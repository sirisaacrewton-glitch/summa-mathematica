# 演習：ブロックデザインと有限幾何 {#comb:page-exercises-designs keywords="exercises, block designs, projective planes"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exdesigns-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$I$ は単位行列、$J$ はすべての成分が 1 の行列。
:::

## ブロックデザイン {#comb:sec-bd-exercises}

対応するページ：\ref{comb:page-block-designs}

::: problem ★ 基本：パラメータの計算 {#comb:ex-bd-parameters}
2-$(9,3,1)$ デザインのブロックの個数 $b$ と反復数 $r$ を求めよ。
:::

::: solution
\ref{comb:design-parameters} から $r=\frac{\lambda(v-1)}{k-1}=\frac{8}{2}=4$、$b=\frac{vr}{k}=\frac{36}{3}=12$。
:::

::: problem ★★ 標準：9 点の三重系 {#comb:ex-bd-sts9}
$\mathbb{F}_{3}^{2}$ の 9 点を点とし、アフィン直線 $\{a+tv: t\in\mathbb{F}_{3}\}$（$v\neq0$）をブロックとすると、2-$(9,3,1)$ デザイン（シュタイナーの三重系）になることを示せ。
:::

::: solution
異なる 2 点 $x,y$ を含む直線は、$a=x$, $v=y-x$ で定まる $\{x+t(y-x)\}$ で、$x$ と $y$ を含む直線 $\{a+tv\}$ は $v$ が $y-x$ の 0 でないスカラー倍であることから同じ集合になるので、ちょうど 1 本。各直線は 3 点（$t\in\mathbb{F}_{3}$）で、$3<9$。直線の数は $\binom{9}{2}/\binom{3}{2}=12$ で、前の問題と一致する。
:::

::: problem ★★★ 発展：対称デザインの平方条件 {#comb:ex-bd-square-condition}
$v$ が偶数の対称 2-$(v,k,\lambda)$ デザインでは、$k-\lambda$ は平方数であることを示せ。（$\det(aI+cJ)=a^{n-1}(a+cn)$ を使う。）
:::

::: solution
**行列式.** $n\times n$ 行列 $aI+cJ$ で、すべての列を第 1 列に足すと第 1 列の成分はすべて $a+cn$ になり、それをくくり出した後、第 1 行を他の行から引くと対角成分が $1,a,\dots,a$ の上三角行列になる。よって $\det(aI+cJ)=(a+cn)a^{n-1}$。
**平方条件.** 接続行列 $M$ は $v\times v$ で $MM^{\mathsf{T}}=(k-\lambda)I+\lambda J$（\ref{comb:incidence-matrix}）。$r=k$ と $\lambda(v-1)=r(k-1)=k(k-1)$ から $k-\lambda+\lambda v=k^{2}$。よって $(\det M)^{2}=\det(MM^{\mathsf{T}})=(k-\lambda)^{v-1}k^{2}$。$v-1$ は奇数なので $(k-\lambda)^{v-1}=\left(\frac{\det M}{k}\right)^{2}$ は有理数の平方で、整数 $k-\lambda$ の奇数乗が有理数の平方なら、素因数分解の各指数を比べて $k-\lambda$ 自身が平方数である。
:::

## 有限射影平面 {#comb:sec-pp-exercises}

対応するページ：\ref{comb:page-projective-planes}

::: problem ★ 基本：2 元体の射影平面 {#comb:ex-pp-fano}
$\mathrm{PG}(2,\mathbb{F}_{2})$ の 7 本の直線を、$\mathbb{F}_{2}^{3}$ の 0 でないベクトルの 3 つ組として書き下せ。
:::

::: solution
2 次元部分空間の 0 でない元は $x,y,x+y$ の 3 個で、和が 0 になる 3 つ組である：
$\{100,010,110\}$, $\{100,001,101\}$, $\{010,001,011\}$, $\{100,011,111\}$, $\{010,101,111\}$, $\{001,110,111\}$, $\{110,101,011\}$。各点は 3 本の直線に含まれ、どの 2 本も 1 点を共有する（\ref{comb:projective-plane-over-field}）。
:::

::: problem ★ 基本：三角形の個数 {#comb:ex-pp-triangles}
位数 $n$ の射影平面で、同じ直線上にない 3 点の組（三角形）の個数を求めよ。
:::

::: solution
点は $N\defeq n^{2}+n+1$ 個（\ref{comb:projective-plane-order}）。順序付きに数えると、1 点目は $N$ 通り、2 点目は $N-1$ 通り、3 点目は 2 点を結ぶ直線の外の $N-(n+1)=n^{2}$ 通り。順序を忘れて $\frac{N(N-1)n^{2}}{6}=\frac{(n^{2}+n+1)(n^{2}+n)n^{2}}{6}$ 個。
:::

::: problem ★★ 標準：ブルック–ライザーの適用 {#comb:ex-pp-bruck-ryser}
\ref{comb:projective-plane-existence-facts} の 2 を使って、位数 6 と 14 の射影平面が存在しないことを確かめよ。位数 10 にはこの定理が使えない理由を述べよ。
:::

::: solution
$6\equiv2$, $14\equiv2\pmod4$。$6$ を 2 つの平方の和にするには $a^{2}+b^{2}=6$ で $a,b\le2$ を試すと $0,1,2,4,5,8$ しか作れず不可能。$14$ も $a,b\le3$ で $9+4=13$, $9+9=18$ などで不可能。よって存在しない。$10\equiv2\pmod4$ だが $10=1+9$ は 2 つの平方の和なので、定理の結論と矛盾せず、存在を否定できない（非存在は計算機による探索で示された）。
:::
