# 有限射影平面 {#comb:page-projective-planes keywords="finite projective plane, order of a projective plane, PG(2,q), projective plane over a finite field, affine plane, parallel classes, Latin squares, mutually orthogonal Latin squares, Bose's theorem, Bruck-Ryser theorem, Euler's 36 officers problem"}

**射影平面**は「どの 2 点も 1 本の直線で結ばれ、どの 2 本の直線も 1 点で交わる」という、平行線のない幾何である。有限の射影平面は、どの直線にも同じ個数 $n+1$ の点があり（$n$ を**位数**という）、点も直線も $n^{2}+n+1$ 個ある。これは $\lambda=1$ の対称デザイン（\ref{comb:symmetric-design}）にほかならない。このページでは、位数 $q$ の有限体から位数 $q$ の射影平面が作れること、射影平面と**互いに直交するラテン方陣**の関係（ボースの定理）を示し、存在問題についての既知の結果（ブルック–ライザーの定理）を述べる。

## 記法と定義の確認 {#comb:sec-pp-notation}

::: notation
- $t$ デザイン・対称デザインとその基本性質は \ref{comb:page-block-designs} のとおり。
- 体 $F$ 上のベクトル空間の次元公式 $\dim(W_{1}+W_{2})+\dim(W_{1}\cap W_{2})=\dim W_{1}+\dim W_{2}$ は \ref{lin:dimension-properties} の 3 のとおり。位数 $q$ の有限体 $\mathbb{F}_{q}$ が素数冪 $q$ ごとに存在することは \ref{fld:finite-field-classification} のとおり。
- 体系は $\ZF$。
:::

## 射影平面と位数 {#comb:sec-pp-planes}

::: definition 射影平面 {#comb:projective-plane keywords="projective plane axioms: two points determine a line, two lines meet in a point, four points in general position" index="射影平面|しゃえいへいめん, 有限射影平面|ゆうげんしゃえいへいめん"}
集合 $P$（**点**）と、$P$ の部分集合の族 $\mathcal{L}$（**直線**）の組 $(P,\mathcal{L})$ が**射影平面**であるとは、次を満たすことをいう。
1. 異なる 2 点を含む直線がちょうど 1 本ある。
2. 異なる 2 本の直線はちょうど 1 点を共有する。
3. どの 3 点も同じ直線上にない（**一般の位置にある**）4 点がある。

$P$ が有限のとき**有限射影平面**という。
:::

::: intuition
ユークリッド平面に「無限遠の点」を、平行線の方向ごとに一つずつ付け加え、それらを結ぶ「無限遠直線」を加えると、平行線も無限遠点で交わり、射影平面になる。条件 3 は、すべての点が 1 本の直線上にあるような退化した場合を除くためのものである。
:::

::: proposition 射影平面の位数 {#comb:projective-plane-order keywords="all lines have n+1 points, all points lie on n+1 lines, n^2+n+1 points and lines" index="射影平面の位数|しゃえいへいめんのいすう" refname="射影平面の位数"}
有限射影平面では、ある整数 $n\ge2$ があり、どの直線もちょうど $n+1$ 個の点を含み、どの点もちょうど $n+1$ 本の直線に含まれ、点と直線はどちらも $n^{2}+n+1$ 個ある。この $n$ を射影平面の**位数**という。
:::

::: intuition
ある直線から別の直線へ、両方の外の 1 点から「光を当てて」影を落とすと、点が一対一に移る。だからどの直線も同じ個数の点をもち、そこからすべての個数が決まる。
:::

::: proof
**Step 1（2 本の直線の外の点）.** 【主張：異なる直線 $L,L'$ について、どちらにも含まれない点がある】条件 3 の 4 点 $x_{1},\dots,x_{4}$ を考える。どれかが $L\cup L'$ の外にあればよい。そうでなければ、どの 3 点も同じ直線上にないので、$L$ と $L'$ はそれぞれちょうど 2 点ずつを含み、たとえば $x_{1},x_{2}\in L$, $x_{3},x_{4}\in L'$（$L\cap L'$ はこの 4 点を含まない）。$x_{1}x_{3}$ を結ぶ直線と $x_{2}x_{4}$ を結ぶ直線の交点 $y$（条件 2）は $L\cup L'$ の外にある：$y\in L$ なら直線 $x_{1}x_{3}$ は $L$ と $x_{1},y$ を共有し、$y\neq x_{1}$ なら条件 1 から $x_{1}x_{3}=L$ となり $x_{3}\in L$ で矛盾、$y=x_{1}$ なら $x_{1}$ が直線 $x_{2}x_{4}$ 上にあり、$x_{1},x_{2},x_{4}$ が同じ直線上で矛盾。$L'$ についても同様。

**Step 2（直線の間の全単射）.** $y\notin L\cup L'$ をとる。$x\in L$ に、$x$ と $y$ を結ぶ直線と $L'$ の交点を対応させる写像 $\varphi\colon L\to L'$ は、逆写像（$L'$ の点と $y$ を結ぶ直線と $L$ の交点）をもつので全単射。よってすべての直線は同じ個数の点をもち、それを $n+1$ とおく。

**Step 3（点を通る直線）.** 点 $x$ について、$x$ を通らない直線 $L$ をとる（条件 3 の 4 点のうち $x$ と異なる 2 点を結ぶ直線のうち、$x$ を通らないものがある）。$x$ を通る直線は、$L$ の点と $x$ を結ぶ直線と一対一に対応する（どの直線も $L$ とちょうど 1 点で交わる）ので $n+1$ 本。

**Step 4（個数）.** 点 $x$ を固定すると、他の点はどれも $x$ を通る $n+1$ 本の直線のちょうど 1 本の上にあり、各直線には $x$ 以外に $n$ 点あるので、点は $1+(n+1)n=n^{2}+n+1$ 個。直線の個数は、点と直線の対 $(x,L)$（$x\in L$）を二通りに数えて、$(n^{2}+n+1)(n+1)=\abs{\mathcal{L}}(n+1)$ から $n^{2}+n+1$ 本。条件 3 の 4 点のうち 2 点を結ぶ直線には、この 2 点以外の点がある（2 点を結ぶ直線と他の 2 点を結ぶ直線の交点は、条件 3 からこの 2 点のどちらでもない）ので $n+1\ge3$、$n\ge2$。
:::

::: proposition 射影平面と対称デザイン {#comb:projective-plane-design keywords="finite projective planes of order n are exactly symmetric 2-(n^2+n+1, n+1, 1) designs" index="射影平面とデザイン|しゃえいへいめんとでざいん"}
$n\ge2$ について、位数 $n$ の有限射影平面は、対称 2-$(n^{2}+n+1,n+1,1)$ デザイン（ブロックが重複しないもの）と同じものである。
:::

::: proof
**Step 1（射影平面 ⇒ デザイン）.** \ref{comb:projective-plane-order} と条件 1 により、点 $n^{2}+n+1$ 個、大きさ $n+1$ のブロック（直線）$n^{2}+n+1$ 個で、どの 2 点もちょうど 1 本のブロックに含まれる。$n+1<n^{2}+n+1$ なので 2 デザインで、$b=v$ なので対称。

**Step 2（デザイン ⇒ 射影平面）.** 条件 1 は $\lambda=1$ そのもの。条件 2 は \ref{comb:symmetric-design-intersection}（異なるブロックはちょうど $\lambda=1$ 点を共有）から従う。条件 3：ブロック $B$ の 2 点 $x_{1},x_{2}$ と、$B$ の外の点 $x_{3}$（$k<v$）をとる。$x_{1}x_{3}$ を結ぶブロックと $x_{2}x_{3}$ を結ぶブロックと $B$ の和集合は高々 $3(n+1)-3=3n$ 点を含み、$v=n^{2}+n+1>3n$（$n\ge2$）なので、その外に点 $x_{4}$ がある。$x_{1},x_{2},x_{3}$ は同じブロック上になく（$x_{1}x_{2}$ を含むのは $B$ だけで $x_{3}\notin B$）、$x_{4}$ を含む 3 点も、$x_{4}$ の選び方から同じブロック上にない。
:::

## 有限体からの構成 {#comb:sec-pp-construction}

::: theorem 体上の射影平面 {#comb:projective-plane-over-field keywords="PG(2,F): points are 1-dimensional subspaces and lines are 2-dimensional subspaces of F^3; finite projective planes of every prime power order" index="PG(2,q)|ぴーじーにきゅー, 体上の射影平面|たいじょうのしゃえいへいめん" refname="体上の射影平面"}
体 $F$ について、$F^{3}$ の 1 次元部分空間を点、2 次元部分空間を直線とし、点が直線に含まれることを部分空間の包含で定めると、射影平面 $\mathrm{PG}(2,F)$ が得られる。$F=\mathbb{F}_{q}$ なら位数 $q$ の有限射影平面である。したがって、すべての素数冪 $q$ について位数 $q$ の有限射影平面が存在する。
:::

::: intuition
空間 $F^{3}$ の原点を通る直線を「点」、原点を通る平面を「直線」と読み替える。原点を通る 2 本の直線はちょうど 1 枚の平面を張り、原点を通る 2 枚の平面はちょうど 1 本の直線で交わる。これが射影平面の公理である。
:::

::: proof
**Step 1（条件 1）.** 【主張：異なる 2 点を含む直線はちょうど 1 本】異なる 1 次元部分空間 $U_{1},U_{2}$ について、$U_{1}\cap U_{2}=0$ なので次元公式から $\dim(U_{1}+U_{2})=2$。$U_{1},U_{2}$ を含む 2 次元部分空間 $W$ は $W\supseteq U_{1}+U_{2}$ で次元が等しいので $W=U_{1}+U_{2}$（\ref{lin:dimension-properties} の 1）。よってちょうど 1 本。

**Step 2（条件 2）.** 異なる 2 次元部分空間 $W_{1},W_{2}$ について、$W_{1}+W_{2}$ は $W_{1}$ を真に含むので次元 3。次元公式から $\dim(W_{1}\cap W_{2})=2+2-3=1$。共通の点（1 次元部分空間）は $W_{1}\cap W_{2}$ に含まれ次元が等しいのでそれに等しく、ちょうど 1 点。

**Step 3（条件 3）.** $e_{1},e_{2},e_{3}$ を標準基底とし、$\langle e_{1}\rangle,\langle e_{2}\rangle,\langle e_{3}\rangle,\langle e_{1}+e_{2}+e_{3}\rangle$ をとる。どの 3 つのベクトル（$\{e_{1},e_{2},e_{3}\}$、$\{e_{i},e_{j},e_{1}+e_{2}+e_{3}\}$）も一次独立なので、張る空間は 3 次元で、同じ 2 次元部分空間に含まれない。

**Step 4（位数）.** $F=\mathbb{F}_{q}$ なら、2 次元部分空間 $W$ の 0 でないベクトルは $q^{2}-1$ 個、各 1 次元部分空間の 0 でないベクトルは $q-1$ 個なので、直線上の点は $\frac{q^{2}-1}{q-1}=q+1$ 個で、位数は $q$。
:::

::: example
$q=2$ の $\mathrm{PG}(2,\mathbb{F}_{2})$ は、$\mathbb{F}_{2}^{3}\setminus\{0\}$ の 7 個のベクトルを点とし、$x+y+z=0$ となる 3 点 $\{x,y,z\}$ を直線とする 7 点 7 直線の平面で、ファノ平面（\ref{comb:fano-plane}）と同型である。
:::

## アフィン平面と直交ラテン方陣 {#comb:sec-pp-latin}

::: definition アフィン平面 {#comb:affine-plane keywords="affine plane, parallel lines, parallel classes, removing a line from a projective plane" index="アフィン平面|あふぃんへいめん, 平行類|へいこうるい"}
位数 $n$ の射影平面 $(P,\mathcal{L})$ から直線 $L_{\infty}$ とその上の点を取り除き、残りの各直線から $L_{\infty}$ との交点を除いたものを、位数 $n$ の**アフィン平面**という（点 $n^{2}$ 個、直線 $n^{2}+n$ 本、各直線に $n$ 点）。$L_{\infty}$ 上の同じ点で交わっていた直線どうしを**平行**といい、平行な直線の集まりを**平行類**という。
:::

::: intuition
射影平面から「無限遠直線」を取り除くと、通常の平面のように平行線をもつ幾何に戻る。平行類は「傾き」にあたり、$L_{\infty}$ の $n+1$ 個の点に対応して $n+1$ 個ある。各平行類の $n$ 本の直線は、アフィン平面の $n^{2}$ 点を $n$ 個ずつに分割する。
:::

::: definition 直交ラテン方陣 {#comb:orthogonal-latin-squares keywords="Latin square, orthogonal Latin squares, mutually orthogonal Latin squares MOLS" index="ラテン方陣|らてんほうじん, 直交ラテン方陣|ちょっこうらてんほうじん"}
$n\times n$ の表で、各行・各列に $1,\dots,n$ がちょうど一度ずつ現れるものを**ラテン方陣**という。2 つのラテン方陣 $A=(a_{ij})$, $B=(b_{ij})$ が**直交する**とは、$n^{2}$ 個の対 $(a_{ij},b_{ij})$ がすべて異なる（したがって $[n]^{2}$ のすべての対がちょうど一度ずつ現れる）ことをいう。どの 2 つも直交するラテン方陣の族を**互いに直交する**という。
:::

::: intuition
2 つのラテン方陣を重ね合わせると、どの記号の組もちょうど一度ずつ現れる。オイラーの「6 つの連隊から 6 つの階級の士官を 1 人ずつ、どの行と列にも各連隊・各階級が一人ずつになるように並べる」問題は、位数 6 の直交ラテン方陣の組を求める問題である。
:::

::: proposition 直交ラテン方陣の個数の上界 {#comb:mols-bound keywords="at most n-1 mutually orthogonal Latin squares of order n" index="直交ラテン方陣の上界|ちょっこうらてんほうじんのじょうかい"}
$n\ge2$ のとき、位数 $n$ の互いに直交するラテン方陣は $n-1$ 個以下である。
:::

::: proof
**Step 1（正規化）.** 各ラテン方陣の記号の名前を付け替えて第 1 行を $1,2,\dots,n$ にしてよい（記号の置換は直交性を保つ）。

**Step 2（位置 $(2,1)$）.** 互いに直交する $A^{(1)},\dots,A^{(t)}$ の $(2,1)$ 成分を考える。どれも 1 ではない（第 1 列には第 1 行に 1 がある）。2 つの方陣で $(2,1)$ 成分が同じ値 $s$ なら、対 $(s,s)$ が位置 $(2,1)$ と、第 1 行の位置 $(1,s)$ の 2 回現れて直交性に反する。よって $(2,1)$ 成分は $\{2,\dots,n\}$ の相異なる値で、$t\le n-1$。
:::

::: theorem 有限体からの直交ラテン方陣 {#comb:mols-from-field keywords="for prime power q, L_a(i,j) = a i + j (a != 0) are q-1 mutually orthogonal Latin squares" index="直交ラテン方陣の構成|ちょっこうらてんほうじんのこうせい"}
$q$ を素数冪とし、行と列と記号を $\mathbb{F}_{q}$ の元で添字づける。$a\in\mathbb{F}_{q}\setminus\{0\}$ について $L_{a}(i,j)\defeq ai+j$ とおくと、$L_{a}$（$q-1$ 個）は互いに直交するラテン方陣である。
:::

::: intuition
有限体の上では、$ai+j$ という「傾き $a$ の直線」の族がラテン方陣を与え、傾きが違えば 2 本の直線はちょうど 1 点で交わるので直交する。
:::

::: proof
**Step 1（ラテン方陣）.** 行 $i$ を固定すると $j\mapsto ai+j$ は全単射、列 $j$ を固定すると $i\mapsto ai+j$ は $a\neq0$ なので全単射。

**Step 2（直交性）.** $a\neq a'$ について、$(L_{a}(i,j),L_{a'}(i,j))=(s,s')$ となる $(i,j)$ は、連立方程式 $ai+j=s$, $a'i+j=s'$ の解で、引き算して $(a-a')i=s-s'$、$a-a'\neq0$ なので $i$ も $j$ も一意に決まる。よってすべての対はちょうど一度ずつ現れる。
:::

::: theorem ボースの定理（射影平面からラテン方陣） {#comb:bose-plane-to-mols keywords="a projective plane of order n yields n-1 mutually orthogonal Latin squares" index="ボースの定理|ぼーすのていり" refname="ボースの定理"}
位数 $n$ の射影平面があれば、位数 $n$ の互いに直交するラテン方陣が $n-1$ 個存在する。
:::

::: intuition
無限遠直線の 2 点を「行の方向」「列の方向」に選び、残りの $n-1$ 点をそれぞれ一つのラテン方陣の「記号の方向」にする。射影平面の公理が、そのまま行・列・記号の釣り合いになる。
:::

::: proof
**Step 1（座標）.** 直線 $L_{\infty}$ をとり、その上の点を $p_{0},p_{1},\dots,p_{n-1},p_{\infty}$ とする。$p_{0}$ を通る $L_{\infty}$ 以外の直線を $R_{1},\dots,R_{n}$（「行」）、$p_{\infty}$ を通る $L_{\infty}$ 以外の直線を $C_{1},\dots,C_{n}$（「列」）とする（\ref{comb:projective-plane-order} により各 $n$ 本）。$R_{i}\cap C_{j}$ の点 $x_{ij}$ は $L_{\infty}$ の外にあり（$L_{\infty}$ との交点は $R_{i}$ では $p_{0}$、$C_{j}$ では $p_{\infty}$）、$(i,j)\mapsto x_{ij}$ は $n^{2}$ 個の $L_{\infty}$ の外の点との全単射である（$L_{\infty}$ の外の点 $x$ は、$xp_{0}$ と $xp_{\infty}$ がそれぞれ一つの行・列）。

**Step 2（ラテン方陣）.** 【主張：$A^{(h)}$ はラテン方陣】$h=1,\dots,n-1$ について、$p_{h}$ を通る $L_{\infty}$ 以外の直線を $M_{h1},\dots,M_{hn}$ とし、$x_{ij}\in M_{hs}$ のとき $A^{(h)}_{ij}\defeq s$ とする。行 $R_{i}$ と $M_{hs}$ は 1 点で交わり、それは $L_{\infty}$ の外（$R_{i}\cap L_{\infty}=p_{0}\neq p_{h}$）なので、行 $i$ には各 $s$ がちょうど一度現れる。列も同様。

**Step 3（直交性）.** $h\neq h'$ について、$(A^{(h)}_{ij},A^{(h')}_{ij})=(s,s')$ となるのは $x_{ij}=M_{hs}\cap M_{h's'}$ のときで、この交点は $L_{\infty}$ の外の 1 点（$M_{hs}\cap L_{\infty}=p_{h}\neq p_{h'}$）なので、ちょうど一つの $(i,j)$ にあたる。
:::

::: fact 逆向きと存在問題 {#comb:projective-plane-existence-facts keywords="Bose's converse, Bruck-Ryser theorem, no plane of order 6, Lam's computer proof for order 10, prime power conjecture, Euler's 36 officers" index="ブルック–ライザーの定理|ぶるっくらいざーのていり, 36 人の士官の問題|さんじゅうろくにんのしかんのもんだい"}
次のことが知られている（Graver–Watkins, *Combinatorics with Emphasis on the Theory of Graphs*, 第 IX 章 D 節、および引用される文献による）。
1. （ボース 1938）逆に、位数 $n$ の互いに直交するラテン方陣が $n-1$ 個あれば、位数 $n$ の射影平面が存在する。
2. （ブルック–ライザー 1949）$n\equiv1,2\pmod4$ で位数 $n$ の射影平面が存在すれば、$n$ は 2 つの整数の平方の和である。証明は接続行列 $M$ についての等式 $MM^{\mathsf{T}}=nI+J$ を有理数係数の 2 次形式の同値として読み、ラグランジュの四平方定理を使う。たとえば $n=6$（$\equiv2$、$6$ は 2 つの平方の和でない）、$n=14,21,22$ の射影平面は存在しない。
3. 位数 6 の直交ラテン方陣の組は存在しない（タリー 1900、オイラーの 36 人の士官の問題）。一方、$n\neq2,6$ ではすべての $n$ について直交ラテン方陣の組が存在する（ボース–シュリカンデ–パーカー 1960）。
4. 位数 10 の射影平面は存在しない（ラムら、1989。計算機による網羅的探索）。
5. 知られている有限射影平面の位数はすべて素数冪であり、位数は素数冪に限るかどうかは未解決である（素数冪予想）。位数 $q\ge9$ の素数冪には、$\mathrm{PG}(2,\mathbb{F}_{q})$ と同型でない射影平面もある。
:::

::: hypcheck
- **射影平面の位数**：条件 3（一般の位置の 4 点）は Step 1, 3, 4 で、2 本の直線の外の点・点を通らない直線の存在に使った。条件 3 がないと、1 本の直線と 1 点だけのような退化した例（直線ごとに点の数が違う）がある。
- **体上の射影平面**：$F$ が体であること（可換でなくてもよい斜体でも同じ議論が通る）は次元公式に使った。可換性は使っていない。
- **ボースの定理**：射影平面の条件 1, 2 を Step 1–3 の交点の一意性に、位数の命題を各点を通る直線の本数に使った。
:::

## 問題 {#comb:sec-pp-problems}

::: problem {#comb:prob-pp-order3}
位数 3 の射影平面（$\mathrm{PG}(2,\mathbb{F}_{3})$）の点・直線の個数と、各直線の点の個数を答えよ。また、位数 3 の互いに直交するラテン方陣 2 個を \ref{comb:mols-from-field} で書き下せ。
:::

::: solution
点・直線は $3^{2}+3+1=13$ 個、各直線に $4$ 点。$\mathbb{F}_{3}=\{0,1,2\}$ で $L_{1}(i,j)=i+j$, $L_{2}(i,j)=2i+j$（行 $i$、列 $j$）：
$$L_{1}=\begin{pmatrix}0&1&2\\1&2&0\\2&0&1\end{pmatrix},\qquad L_{2}=\begin{pmatrix}0&1&2\\2&0&1\\1&2&0\end{pmatrix}.$$
対 $(L_{1},L_{2})$ は $(0,0),(1,1),(2,2),(1,2),(2,0),(0,1),(2,1),(0,2),(1,0)$ で 9 個すべて異なる。
:::

::: problem {#comb:prob-pp-parallel-classes}
位数 $n$ のアフィン平面で、平行は直線の上の同値関係であり（自分自身とも平行とする）、平行類はちょうど $n+1$ 個、各平行類は $n$ 本の直線からなり、それらは点集合を分割することを示せ。
:::

::: solution
元の射影平面では、$L_{\infty}$ 以外の各直線は $L_{\infty}$ とちょうど 1 点で交わる。平行を「$L_{\infty}$ との交点が同じ」と定めたので、同値関係で、類は $L_{\infty}$ の $n+1$ 点と一対一に対応する。点 $p\in L_{\infty}$ を通る $L_{\infty}$ 以外の直線は $n$ 本（\ref{comb:projective-plane-order}）。$L_{\infty}$ の外の各点は、$p$ と結ぶ直線のちょうど 1 本の上にあるので、同じ類の $n$ 本の直線は（$p$ を除いて）点集合を分割する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** $\mathrm{PG}(2,F)$ の構成で $F$ の可換性は使わないので、斜体（たとえば有限でない四元数体）からも射影平面が得られる。有限の斜体は可換（ウェダーバーンの定理）なので、有限の場合には新しい例は生まれない。

**前提を変えると.**
- 射影平面の公理系に「デザルグの定理が成り立つ」を加えると、平面は斜体上の $\mathrm{PG}(2,F)$ に限ることが知られている。有限の場合は $\mathrm{PG}(2,\mathbb{F}_{q})$ に限る。
- 高次元の射影空間（$\mathrm{PG}(d,q)$, $d\ge3$）は、自動的にデザルグ的で体の上に座標づけられる、と知られている。

**類似の定理.** 有限射影平面の接続グラフ（点と直線の二部グラフ）は内周 6 の $(n+1)$ 正則グラフで、$C^{4}$ を含まないグラフの辺の数のコヴァーリ–ショーシュ–トゥランの上界（\ref{comb:kovari-sos-turan}）の指数が最良であることを示す例になる。

**高い視点から：組合せ論と代数の出会い.** 射影平面の公理は純粋に組合せ論的（点と直線の接続だけ）だが、デザルグの定理という幾何の条件を課すと、背後に体が現れて座標が入る。逆に、デザルグ的でない平面は「体でない代数系」（準体）から作られる。このように、有限の組合せ構造の存在問題は、有限体の存在（素数冪）や 2 次形式の整数論（ブルック–ライザー）と深く結びつく。比喩で言えば、射影平面は「完全に釣り合った出会いの表」であり、その表がどの大きさで作れるかを調べると、数の世界の深い性質（どの数が素数冪か、どの数が 2 つの平方の和か）が顔を出す。
:::
