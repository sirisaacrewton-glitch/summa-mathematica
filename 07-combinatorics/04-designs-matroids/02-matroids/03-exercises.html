## マトロイドの公理 {#comb:sec-ma-exercises}

対応するページ：\ref{comb:page-matroid-axioms}

::: problem ★ 基本：グラフ的マトロイドの階数 {#comb:ex-ma-graphic-rank}
$n$ 頂点・$c$ 個の連結成分をもつグラフ $G$ のグラフ的マトロイドの階数は $n-c$ であることを示せ。
:::

::: solution
基は極大な森、すなわち各連結成分の全域木の和（\ref{graph:spanning-tree}）で、$n$ 頂点・$c$ 成分の森の辺は $n-c$ 本（\ref{graph:prob-tb-forest-edges}）。\ref{comb:matroid-maximal-independent} からすべての基は同じ大きさなので、階数は $n-c$。
:::

::: problem ★★ 標準：$U_{2,4}$ はグラフ的でない {#comb:ex-ma-u24-not-graphic}
$U_{2,4}$ は、どのグラフ（多重辺を許す）のグラフ的マトロイドとも同型でないことを示せ。
:::

::: solution
$U_{2,4}=M(G)$ となる $G$ があるとし、辺を $a,b,c,d$ とする。どの 3 辺も閉路（従属で極小）なので、$\{a,b,c\}$ は三角形をなす。$\{a,b,d\}$ も三角形で、$a,b$ は共通の頂点をもつので、その三角形の第 3 の辺は $c$ と同じ 2 頂点を結ぶ。すると $\{c,d\}$ は（平行な 2 辺として）閉路になり、2 元の集合が独立であることに反する。
:::

## マトロイドの双対と貪欲法 {#comb:sec-md-exercises}

対応するページ：\ref{comb:page-matroid-duality-greedy}

::: problem ★ 基本：閉路のグラフ的マトロイドの双対 {#comb:ex-md-cycle-dual}
長さ $n$ の閉路 $C_{n}$ について、$M(C_{n})=U_{n-1,n}$ と $M(C_{n})^{*}=U_{1,n}$ を示せ。
:::

::: solution
$C_{n}$ の辺集合で森をなすのは、すべての辺を含まない集合、すなわち大きさ $n-1$ 以下の集合なので $M(C_{n})=U_{n-1,n}$。基は $n-1$ 元集合で、補集合は 1 元集合なので、双対の基は 1 元集合で $U_{1,n}$（\ref{comb:dual-matroid}）。
:::

::: problem ★ 基本：貪欲法の実行 {#comb:ex-md-kruskal-run}
4 頂点 $a,b,c,d$ の完全グラフで、辺の費用を $ab:1$, $bc:2$, $ac:3$, $cd:4$, $bd:5$, $ad:6$ とする。クラスカルの方法（\ref{comb:kruskal-algorithm}）で費用最小の全域木を求めよ。
:::

::: solution
費用の小さい順に $ab$（採用）、$bc$（採用）、$ac$（$a,b,c$ の閉路を作るので不採用）、$cd$（採用）で 3 辺そろい、全域木 $\{ab,bc,cd\}$、費用 $1+2+4=7$。\ref{comb:rado-edmonds} によりこれは最小である。
:::
