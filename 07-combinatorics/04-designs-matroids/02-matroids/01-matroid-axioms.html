# マトロイドの公理 {#comb:page-matroid-axioms keywords="matroid, independent sets, augmentation axiom, bases, basis exchange, rank function, submodularity, circuits, circuit elimination, uniform matroid, graphic matroid, linear matroid, vector matroid, partition matroid"}

ベクトルの一次独立性と、グラフの辺集合が閉路を含まないこと（森であること）には、共通の性質がある：「独立な集合の部分集合は独立で、小さい独立集合は大きい独立集合から元を一つ借りて大きくできる」。この二つの性質だけを公理にしたものが**マトロイド**である（ホイットニー、1935）。このページでは、マトロイドを独立集合の公理で定義し、**基**（極大な独立集合）・**階数**・**閉路**（極小な従属集合）による同値な言い換えを示す。

## 記法と定義の確認 {#comb:sec-ma-notation}

::: notation
- $E$ は有限集合（**台集合**）、$\mathcal{P}(E)$ はその部分集合の全体。$X+e\defeq X\cup\{e\}$, $X-e\defeq X\setminus\{e\}$。
- グラフ・森・連結成分は \ref{graph:page-graphs}, \ref{graph:tree} のとおりで、$n$ 頂点・$c$ 成分の森の辺は $n-c$ 本（\ref{graph:prob-tb-forest-edges}）。ベクトル空間の次元の性質は \ref{lin:dimension-properties} のとおり。
- 体系は $\ZF$。
:::

## 独立集合の公理 {#comb:sec-ma-independent}

::: definition マトロイド {#comb:matroid keywords="matroid, independent sets, I1 I2 I3, augmentation" index="マトロイド|まとろいど, 独立集合（マトロイドの）|どくりつしゅうごう, 増加公理|ぞうかこうり" refname="マトロイド"}
有限集合 $E$ と $\mathcal{I}\subseteq\mathcal{P}(E)$ の組 $M=(E,\mathcal{I})$ が**マトロイド**であるとは、次を満たすことをいう。
- (I1) $\varnothing\in\mathcal{I}$。
- (I2) $I\in\mathcal{I}$, $J\subseteq I$ なら $J\in\mathcal{I}$。
- (I3)（**増加公理**）$I,J\in\mathcal{I}$, $\abs{I}<\abs{J}$ なら、$I+e\in\mathcal{I}$ となる $e\in J\setminus I$ がある。

$\mathcal{I}$ の元を**独立集合**、独立でない部分集合を**従属集合**という。
:::

::: intuition
独立集合は「無駄のない集まり」である。(I2) は「無駄のない集まりから抜いても無駄はない」、(I3) は「小さい無駄のない集まりは、大きい無駄のない集まりから何か一つを借りて、無駄なく大きくできる」という性質である。
:::

::: example 基本的なマトロイド {#comb:matroid-examples keywords="uniform matroid U_{k,n}, linear matroid, graphic matroid M(G), partition matroid" index="一様マトロイド|いちようまとろいど, 線形マトロイド|せんけいまとろいど, グラフ的マトロイド|ぐらふてきまとろいど, 分割マトロイド|ぶんかつまとろいど"}
1. **一様マトロイド** $U_{k,n}$：$\abs{E}=n$、$\mathcal{I}=\{I:\abs{I}\le k\}$。(I3) は $\abs{I}<\abs{J}\le k$ のとき $J\setminus I$ の任意の元を加えればよい。
2. **線形マトロイド**：体 $F$ 上のベクトル空間の有限個のベクトル $\{v_{e}\}_{e\in E}$ について、$\{v_{e}\}_{e\in I}$ が一次独立（重複なし）となる $I$ を独立集合とする。(I3)：$\abs{I}<\abs{J}$ で、すべての $e\in J$ について $v_{e}\in\operatorname{span}\{v_{i}\}_{i\in I}$ なら、$\operatorname{span}J\subseteq\operatorname{span}I$ で次元を比べて $\abs{J}\le\abs{I}$ となり矛盾（\ref{lin:dimension-properties}）。よって $v_{e}\notin\operatorname{span}I$ の $e\in J\setminus I$ があり、$I+e$ は独立。
3. **グラフ的マトロイド** $M(G)$：グラフ $G$ の辺集合 $E$ で、森をなす（閉路を含まない）辺集合を独立集合とする。これがマトロイドであることは次の命題で確かめる。
4. **分割マトロイド**：$E=E_{1}\sqcup\cdots\sqcup E_{m}$ と $d_{i}\ge0$ について、$\abs{I\cap E_{i}}\le d_{i}$（すべての $i$）となる $I$ を独立集合とする。(I3) は、$\abs{J\cap E_{i}}>\abs{I\cap E_{i}}$ となる $i$ を選んで $J\cap E_{i}$ から借りればよい。
:::

::: proposition グラフ的マトロイド {#comb:graphic-matroid keywords="forests of a graph form a matroid, graphic matroid" index="閉路マトロイド|へいろまとろいど" refname="グラフ的マトロイド"}
グラフ $G=(V,E)$ について、閉路を含まない辺集合（全域部分グラフ $(V,F)$ が森となる $F\subseteq E$）の族はマトロイドの独立集合の族である。
:::

::: intuition
森は「回り道のない」辺の集まりで、小さい森は大きい森の辺を一本借りて、閉路を作らずに大きくできる。大きい森ほど連結成分が少ないので、小さい森の成分をまたぐ辺が必ず大きい森にある。
:::

::: proof
**Step 1（(I1)(I2)）.** 空集合は閉路を含まず、森の部分集合も閉路を含まない。

**Step 2（(I3)）.** 【主張：森 $F_{1},F_{2}$ で $\abs{F_{1}}<\abs{F_{2}}$ なら、$F_{1}+e$ が森となる $e\in F_{2}\setminus F_{1}$ がある】$(V,F_{i})$ の連結成分の数を $c_{i}$ とすると、森の辺の数の式から $c_{i}=\abs{V}-\abs{F_{i}}$ なので $c_{1}>c_{2}$。$F_{2}$ のどの辺も $(V,F_{1})$ の同じ成分の 2 点を結ぶとすると、$(V,F_{2})$ の各成分は $(V,F_{1})$ のある成分に含まれ（成分の中の点は $F_{2}$ の辺の道で結ばれ、各辺は $F_{1}$ の一つの成分の中にある）、$c_{2}\ge c_{1}$ となり矛盾。よって $F_{2}$ のある辺 $e$ は $(V,F_{1})$ の異なる成分を結び、$e\notin F_{1}$ で、$F_{1}+e$ に閉路があれば $e$ を通り、$e$ の両端が $F_{1}$ で結ばれていることになって矛盾。
:::

## 基 {#comb:sec-ma-bases}

::: definition 基と階数 {#comb:matroid-basis-rank keywords="basis of a matroid, rank function r(X) = max |I| over independent I in X" index="基（マトロイドの）|き, 階数（マトロイドの）|かいすう, 階数関数|かいすうかんすう"}
マトロイド $M=(E,\mathcal{I})$ の極大な独立集合を**基**という。$X\subseteq E$ について、$X$ に含まれる独立集合の大きさの最大値を $r(X)$ と書き、**階数**という。$r(E)$ を $M$ の階数という。
:::

::: intuition
基は「これ以上増やせない無駄のない集まり」、階数は「その中で無駄なく選べる最大個数」である。ベクトル空間では基底と次元、グラフでは全域森とその辺の数にあたる。
:::

::: lemma 極大な独立集合は同じ大きさ {#comb:matroid-maximal-independent keywords="all maximal independent subsets of X have size r(X); all bases have the same size" index="基の大きさ|きのおおきさ"}
$X\subseteq E$ に含まれる極大な独立集合（$X$ の中でそれ以上大きくできないもの）はすべて $r(X)$ 個の元をもつ。特に、すべての基は同じ大きさ $r(E)$ をもつ。
:::

::: proof
$X$ に含まれる極大な独立集合 $I$ と、$X$ に含まれる最大の独立集合 $J$（$\abs{J}=r(X)$）をとる。$\abs{I}<\abs{J}$ なら (I3) から $I+e\in\mathcal{I}$ となる $e\in J\setminus I\subseteq X$ があり、$I$ の極大性に反する。よって $\abs{I}=r(X)$。
:::

::: theorem 基の公理 {#comb:basis-axioms keywords="basis exchange axiom characterizes matroids" index="基の交換公理|きのこうかんこうり" refname="基の交換公理"}
$\mathcal{B}\subseteq\mathcal{P}(E)$ がマトロイドの基の族であることと、次の 2 条件は同値である。
- (B1) $\mathcal{B}\neq\varnothing$。
- (B2)（**交換公理**）$B_{1},B_{2}\in\mathcal{B}$, $x\in B_{1}\setminus B_{2}$ なら、$B_{1}-x+y\in\mathcal{B}$ となる $y\in B_{2}\setminus B_{1}$ がある。

このとき、独立集合はちょうど、ある基に含まれる集合である。
:::

::: intuition
基は「最大限まで集めた無駄のない集まり」で、二つの基があれば、一方から一つ抜いた穴を、他方の元で埋め直せる。ベクトル空間の基底の交換定理、全域木の辺の交換が典型例である。
:::

::: proof
**Step 1（マトロイド ⇒ (B1)(B2)）.** $\varnothing$ を含む極大な独立集合があるので (B1)。$B_{1}-x$ は独立で、\ref{comb:matroid-maximal-independent} から $\abs{B_{1}-x}<\abs{B_{2}}$。(I3) から $B_{1}-x+y\in\mathcal{I}$ となる $y\in B_{2}\setminus(B_{1}-x)$ があり、$y\neq x$（$x\notin B_{2}$）なので $y\in B_{2}\setminus B_{1}$。$B_{1}-x+y$ は基と同じ大きさの独立集合なので極大、すなわち基。

**Step 2（(B1)(B2) ⇒ 基は同じ大きさ）.** 【主張：$\mathcal{B}$ の元はすべて同じ大きさ】$\abs{B_{1}}>\abs{B_{2}}$ となる組があるとし、そのうち $\abs{B_{1}\setminus B_{2}}$ が最小のものをとる。$\abs{B_{1}}>\abs{B_{2}}$ なので $B_{1}\setminus B_{2}$ の元 $x$ があり、(B2) から $B_{1}'\defeq B_{1}-x+y\in\mathcal{B}$（$y\in B_{2}\setminus B_{1}$）。$\abs{B_{1}'}=\abs{B_{1}}>\abs{B_{2}}$ かつ $\abs{B_{1}'\setminus B_{2}}=\abs{B_{1}\setminus B_{2}}-1$ で、最小性に反する。

**Step 3（(B1)(B2) ⇒ マトロイド）.** $\mathcal{I}\defeq\{I: I\subseteq B\text{ となる }B\in\mathcal{B}\text{ がある}\}$ とおく。(I1)(I2) は明らか。(I3)：$I\subseteq B_{I}$, $J\subseteq B_{J}$（$B_{I},B_{J}\in\mathcal{B}$）、$\abs{I}<\abs{J}$ とする。そのような $B_{I}$ のうち $\abs{B_{I}\setminus(I\cup B_{J})}$ が最小のものを選ぶ。
- 【主張：$B_{I}\setminus(I\cup B_{J})=\varnothing$】元 $x$ があれば、(B2) を $(B_{I},B_{J},x)$ に使って $B_{I}-x+y\in\mathcal{B}$（$y\in B_{J}\setminus B_{I}$）。これは $I$ を含み、$B_{I}\setminus(I\cup B_{J})$ が 1 つ減るので、選び方に反する。
- よって $B_{I}\subseteq I\cup B_{J}$、すなわち $B_{I}\setminus I\subseteq B_{J}\setminus I$。Step 2 から $\abs{B_{I}}=\abs{B_{J}}$ なので $\abs{B_{I}\setminus I}=\abs{B_{I}}-\abs{I}>\abs{B_{J}}-\abs{J}\ge\abs{B_{J}\setminus J}$。$B_{J}\setminus I=(B_{J}\setminus(I\cup J))\cup(J\setminus I)$ だから、$J\setminus I$ がもし $B_{I}$ と交わらなければ $B_{I}\setminus I\subseteq B_{J}\setminus(I\cup J)\subseteq B_{J}\setminus J$ となり、大きさの不等式に反する。よって $e\in(J\setminus I)\cap B_{I}$ があり、$I+e\subseteq B_{I}$ は独立。

**Step 4（基の一致）.** Step 3 の $\mathcal{I}$ の極大元はちょうど $\mathcal{B}$ の元である（$\mathcal{B}$ の元は同じ大きさなので互いに含み合わない）。逆に、マトロイドの独立集合は（$E$ が有限なので）極大な独立集合、すなわち基に含まれる。
:::

## 階数関数 {#comb:sec-ma-rank}

::: theorem 階数関数の性質 {#comb:rank-function keywords="rank function axioms R1 R2 R3, submodularity r(X cup Y) + r(X cap Y) <= r(X) + r(Y)" index="劣モジュラ性|れつもじゅらせい, 階数公理|かいすうこうり" refname="階数関数の性質"}
マトロイドの階数関数 $r$ は次を満たす。
- (R1) $0\le r(X)\le\abs{X}$。
- (R2) $X\subseteq Y$ なら $r(X)\le r(Y)$。
- (R3)（**劣モジュラ性**）$r(X\cup Y)+r(X\cap Y)\le r(X)+r(Y)$。

さらに、$I$ が独立であることと $r(I)=\abs{I}$ は同値である。
:::

::: intuition
階数は「その中で無駄なく選べる最大個数」で、劣モジュラ性は「二つの集合を合わせると、共通部分の分だけ重複して数えていた自由度が減る」ことを表す。線形マトロイドでは、部分空間の次元公式 $\dim(U+W)+\dim(U\cap W)=\dim U+\dim W$ の不等式版にあたる。
:::

::: proof
**Step 1（(R1)(R2) と独立性）.** (R1) は $\varnothing$ が独立で、$X$ の部分集合の大きさが $\abs{X}$ 以下であることから。(R2) は $X$ の独立集合が $Y$ の独立集合でもあることから。$I$ が独立なら $r(I)=\abs{I}$、逆に $r(I)=\abs{I}$ なら $I$ 自身が独立。

**Step 2（(R3)）.** 【主張：劣モジュラ性】$X\cap Y$ の極大な独立集合 $I$ をとり（$\abs{I}=r(X\cap Y)$）、それを含む $X\cup Y$ の極大な独立集合 $J$ に広げる（(I3) を繰り返す。\ref{comb:matroid-maximal-independent} から $\abs{J}=r(X\cup Y)$）。$J\cap X$, $J\cap Y$ は独立で、$J\cap(X\cap Y)=I$（$I$ は $X\cap Y$ の中で極大で $J\supseteq I$ は独立だから）。よって
$$r(X)+r(Y)\ge\abs{J\cap X}+\abs{J\cap Y}=\abs{J\cap(X\cup Y)}+\abs{J\cap X\cap Y}=\abs{J}+\abs{I}=r(X\cup Y)+r(X\cap Y).$$
:::


## 閉路 {#comb:sec-ma-circuits}

::: definition 閉路（マトロイドの） {#comb:matroid-circuit keywords="circuit of a matroid, minimal dependent set, loop, parallel elements" index="閉路（マトロイドの）|へいろ, ループ（マトロイドの）|るーぷ, 平行な元（マトロイドの）|へいこうなげん"}
マトロイドの極小な従属集合を**閉路**という。1 元の閉路 $\{e\}$ の $e$ を**ループ**、2 元の閉路をなす 2 元を**平行**という。グラフ的マトロイド $M(G)$ の閉路は、ちょうどグラフの閉路の辺集合である。
:::

::: intuition
閉路は「一つでも抜くと無駄がなくなる、最小の無駄」である。グラフでは文字どおり閉路、ベクトルでは「一次従属で、どの真部分集合も一次独立」なベクトルの組（最小の一次関係）にあたる。
:::

::: theorem 閉路の公理 {#comb:circuit-axioms keywords="circuit elimination axiom, unique circuit in I + e" index="閉路の消去公理|へいろのしょうきょこうり, 基本閉路（マトロイド）|きほんへいろ" refname="閉路の消去公理"}
マトロイドの閉路の族 $\mathcal{C}$ は次を満たす。
- (C1) $\varnothing\notin\mathcal{C}$。
- (C2) $C_{1},C_{2}\in\mathcal{C}$, $C_{1}\subseteq C_{2}$ なら $C_{1}=C_{2}$。
- (C3)（**消去公理**）異なる $C_{1},C_{2}\in\mathcal{C}$ と $e\in C_{1}\cap C_{2}$ について、$C_{3}\subseteq(C_{1}\cup C_{2})-e$ となる $C_{3}\in\mathcal{C}$ がある。

さらに、$I$ が独立で $I+e$ が従属なら、$I+e$ に含まれる閉路はちょうど一つで、それは $e$ を含む（**基本閉路**）。
:::

::: intuition
二つの閉路が共通の元をもつとき、その元を取り除いても残りの中にまた閉路がある。グラフでは、辺を共有する 2 つの閉路を合わせてその辺を除くと、まだ閉路が残ることにあたる。
:::

::: proof
**Step 1（(C1)(C2)）.** $\varnothing$ は独立なので閉路でない。閉路は極小な従属集合なので、閉路どうしは含み合わない。

**Step 2（(C3)）.** 【主張：$(C_{1}\cup C_{2})-e$ は従属】独立だとする。$C_{1}\neq C_{2}$ と (C2) から $C_{1}\setminus C_{2}$ の元 $f$ がある。$C_{1}-f$ は独立（極小性）で、それを含む $C_{1}\cup C_{2}$ の極大な独立集合 $I$ をとる。$C_{1}\not\subseteq I$ なので $f\notin I$。また $C_{2}\not\subseteq I$ なので、$C_{2}$ のある元 $g\notin I$ があり、$g\neq f$（$f\notin C_{2}$）。よって $\abs{I}\le\abs{C_{1}\cup C_{2}}-2$。一方、$(C_{1}\cup C_{2})-e$ は独立と仮定したので、\ref{comb:matroid-maximal-independent} から $r(C_{1}\cup C_{2})\ge\abs{C_{1}\cup C_{2}}-1>\abs{I}$ で、$I$ の極大性（$\abs{I}=r(C_{1}\cup C_{2})$）に反する。従属な $(C_{1}\cup C_{2})-e$ は極小な従属集合、すなわち閉路を含む。

**Step 3（基本閉路）.** $I+e$ は従属なので閉路 $C$ を含み、$I$ は独立なので $e\in C$。異なる 2 つの閉路 $C,C'\subseteq I+e$ があれば、どちらも $e$ を含み、(C3) から $(C\cup C')-e\subseteq I$ が閉路を含み、$I$ の独立性に反する。
:::

::: example
1. $U_{k,n}$ の閉路は、ちょうど $k+1$ 個の元からなる部分集合（$k<n$ のとき）。
2. グラフ的マトロイドの基は、$G$ が連結なら全域木で、基の交換公理は「全域木 $T_{1}$ の辺 $x$ を除くと 2 つの成分に分かれ、それをつなぐ $T_{2}$ の辺 $y$ を加えると再び全域木になる」ことである。
3. 基本閉路は、全域木 $T$ と $T$ にない辺 $e$ の基本閉路（\ref{graph:fundamental-cycles-cuts}）の一般化である。
:::

::: hypcheck
- **基の公理**：(B2) は Step 2（同じ大きさ）と Step 3（増加公理）の両方で使った。$E$ の有限性は Step 4 で独立集合が基に含まれることに使った。
- **階数関数**：劣モジュラ性の証明では、極大な独立集合がすべて同じ大きさであること（\ref{comb:matroid-maximal-independent}）が本質的である。
- **閉路の消去公理**：Step 2 で階数（極大独立集合の大きさ）を使った。(I3) だけから直接示すこともできるが、階数を経由すると簡潔になる。
:::

## 問題 {#comb:sec-ma-problems}

::: problem {#comb:prob-ma-not-matroid}
$E=\{1,2,3,4\}$ 上で $\mathcal{I}=\{\varnothing,\{1\},\{2\},\{3\},\{4\},\{1,2\},\{3,4\}\}$ はマトロイドの独立集合の族でないことを示せ。
:::

::: solution
$I=\{1\}$, $J=\{3,4\}$ について $\abs{I}<\abs{J}$ だが、$\{1,3\}$, $\{1,4\}$ はどちらも $\mathcal{I}$ に属さず、(I3) が成り立たない。
:::

::: problem {#comb:prob-ma-k4-circuits}
$K^{4}$ のグラフ的マトロイドの階数、基の個数、閉路の個数を求めよ。
:::

::: solution
$K^{4}$ は連結で 4 頂点なので階数は 3（全域木の辺の数）。基は全域木で、\ref{graph:cayley-formula} から $4^{2}=16$ 個。閉路は三角形 4 個と 4 頂点の閉路 3 個（4 頂点の巡回の仕方 $3!/2=3$）で 7 個。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 増加公理 (I3) は「$\abs{J}=\abs{I}+1$ の場合」だけを要求しても同値である（大きい $J$ からは、$\abs{I}+1$ 個の部分集合をとればよい）。

**前提を変えると.**
- 同値な公理系は他にもあり、**閉包作用素**（$\operatorname{cl}(X)\defeq\{e: r(X+e)=r(X)\}$）が交換法則を満たすこととしても特徴づけられる。体の超越基底（\ref{fld:page-transcendence-basis} の補足）やモデル理論の前幾何も、この形のマトロイド（無限集合上の版）である。
- $E$ が無限集合の場合には、有限の場合のように公理系が同値にならず、注意深い定義が必要になると知られている。

**類似の定理.** 階数関数 (R1)–(R3) と「$r(X)\le r(X+e)\le r(X)+1$」から逆にマトロイドが復元でき、閉路の公理 (C1)–(C3) からも復元できる（ここでは証明しない）。

**高い視点から：一次独立性の組合せ論的な骨格.** マトロイドは、線形代数から「数」を取り除き、一次独立性の組合せ論的な骨格だけを残したものである。どのマトロイドもベクトルで表せる（線形）わけではなく、たとえばファノ平面（\ref{comb:fano-plane}）の点の集合は、直線を「3 点が従属」とするマトロイドとして、標数 2 の体でしか表せない。比喩で言えば、マトロイドは「独立性」という概念の設計図であり、ベクトル空間・グラフ・体の拡大・幾何の配置はその設計図の異なる実現である。
