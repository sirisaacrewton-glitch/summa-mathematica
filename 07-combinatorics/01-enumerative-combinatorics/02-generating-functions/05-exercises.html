# 演習：母関数 {#comb:page-exercises-generating-functions keywords="exercises, generating functions, formal power series, partitions, Polya counting"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exgf-notation}

::: notation
- 記号は各節の見出しの下に示したページの約束に従う。$\binom{n}{k}$ は二項係数（\ref{comb:binomial-coefficient}）、$F_{n}$ はフィボナッチ数（\ref{comb:fibonacci}）、$C_{n}$ はカタラン数（\ref{comb:catalan}）。形式的冪級数 $f$ の $x^{n}$ の係数を $[x^{n}]f$ と書く。
- 体系は $\ZF$。
:::

## 形式的冪級数 {#comb:sec-fps-exercises}

対応するページ：\ref{comb:page-formal-power-series}

::: problem ★ 基本：負の冪の係数 {#comb:ex-fps-1}
$[x^{n}](1-x)^{-3}=\binom{n+2}{2}$ を示せ。
:::

::: solution
$(1-x)^{-1}=\sum_{i\ge0}x^{i}$ なので $(1-x)^{-3}=\left(\sum_{i}x^{i}\right)^{3}$ の $x^{n}$ の係数は、$i+j+l=n$ を満たす非負整数の組 $(i,j,l)$ の個数である。これは 3 種類から重複を許して $n$ 個選ぶ重複組合せの個数で、\ref{comb:multiset-count} により $\binom{n+3-1}{n}=\binom{n+2}{2}$。
:::

::: problem ★ 基本：積の係数 {#comb:ex-fps-2}
$e^{x}\defeq\sum_{k\ge0}x^{k}/k!$ とするとき、$[x^{n}]\,\dfrac{e^{x}}{1-x}=\sum_{k=0}^{n}\dfrac{1}{k!}$ を示し、$n\,!\,[x^{n}]\dfrac{e^{-x}}{1-x}$ が完全順列の個数 $D_{n}$ に等しいことを確かめよ。
:::

::: solution
積の係数は $\sum_{k+l=n}\frac{1}{k!}\cdot1=\sum_{k=0}^{n}\frac{1}{k!}$。$x$ を $-x$ に変えた $e^{-x}$ では同様に $[x^{n}]\frac{e^{-x}}{1-x}=\sum_{k=0}^{n}\frac{(-1)^{k}}{k!}$ で、$n!$ 倍は完全順列の個数の式（\ref{comb:page-inclusion-exclusion}）$D_{n}=n!\sum_{k=0}^{n}\frac{(-1)^{k}}{k!}$ に一致する。
:::

## 母関数 {#comb:sec-gf-exercises}

対応するページ：\ref{comb:page-generating-functions}

::: problem ★★ 標準：パスカルの三角形の斜めの和 {#comb:ex-gf-1}
$\sum_{k\ge0}\binom{n-k}{k}=F_{n+1}$ を母関数で示せ。
:::

::: solution
$k\in\N$ について、\ref{comb:binomial-series-examples.1} から $\sum_{m}\binom{m}{k}x^{m}=x^{k}\sum_{j}\binom{k+j}{j}x^{j}=\frac{x^{k}}{(1-x)^{k+1}}$（\ref{comb:binomial-identities.1} で $\binom{k+j}{k}=\binom{k+j}{j}$）。よって、$n=m+k$ とおいて
$$
\sum_{n}\Bigl(\sum_{k}\binom{n-k}{k}\Bigr)x^{n}=\sum_{k}x^{k}\cdot\frac{x^{k}}{(1-x)^{k+1}}=\frac{1}{1-x}\sum_{k}\Bigl(\frac{x^{2}}{1-x}\Bigr)^{k}=\frac{1}{1-x}\cdot\frac{1}{1-\frac{x^{2}}{1-x}}=\frac{1}{1-x-x^{2}}.
$$
（$k$ についての和は位数 $\ge2k$ の項の総和可能な和で、等比級数は $u=x^{2}/(1-x)$ を $\sum_{k}x^{k}$ に代入したもの：\ref{comb:substitution-homomorphism}。）一方 \ref{comb:fibonacci} より $\sum F_{n}x^{n}=\frac{x}{1-x-x^{2}}$ なので、$\sum F_{n+1}x^{n}=\frac{1}{1-x-x^{2}}$。係数を比べればよい。
:::

::: problem ★★★ 発展：二分木 {#comb:ex-gf-2}
**二分木**を、空の木か、根と、左の部分木・右の部分木（どちらも二分木）の組として帰納的に定める。頂点（根）の個数が $n$ の二分木の個数 $b_{n}$ はカタラン数 $C_{n}$ に等しいことを示せ。
:::

::: solution
$b_{0}=1$（空の木）。$n+1$ 頂点の二分木は、左の部分木の頂点数 $k$（$0\le k\le n$）と、$k$ 頂点・$n-k$ 頂点の二分木の組で一意に決まるので $b_{n+1}=\sum_{k}b_{k}b_{n-k}$。カタラン数も同じ初期値と漸化式をもつ（\ref{comb:catalan-formula.1}）ので、$n$ の帰納法で $b_{n}=C_{n}$。（直接の全単射：二分木を、根で $\mathtt{U}$、左の部分木、$\mathtt{D}$、右の部分木の順に読むと、ディック語の分解 $\mathtt{U}u\mathtt{D}v$ と一致する。）
:::

## 整数の分割 {#comb:sec-pt-exercises}

対応するページ：\ref{comb:page-partitions}

::: problem ★★ 標準：1 を含まない分割 {#comb:ex-gf-3}
部分に $1$ を含まない $n$ の分割の個数は $p(n)-p(n-1)$（$n\ge1$）であることを、母関数と全単射の両方で示せ。
:::

::: solution
母関数：\ref{comb:partition-generating-function} で $S=\{2,3,\dots\}$ とすると $\prod_{i\ge2}\frac{1}{1-x^{i}}=(1-x)\sum_{n}p(n)x^{n}$（\ref{comb:infinite-product-basic.3}）で、$x^{n}$ の係数は $p(n)-p(n-1)$。全単射：$1$ を含む $n$ の分割から $1$ を一つ取り除くと $n-1$ の分割になり、逆は $1$ を一つ加える操作なので、$1$ を含む $n$ の分割は $p(n-1)$ 個。
:::

::: problem ★★ 標準：2 の冪への分割 {#comb:ex-pt-2}
$n$ を 2 の冪（$1,2,4,8,\dots$）の和に分ける方法（順序を考えない）の数を $b(n)$ とする（$b(0)=1$）。$b(2m+1)=b(2m)$ と $b(2m)=b(2m-1)+b(m)$（$m\ge1$）を示せ。
:::

::: solution
**前半.** $2m+1$ は奇数なので、その分割は部分 1 を少なくとも 1 つ含む（他の部分は偶数）。1 を一つ取り除く操作は、$2m+1$ の分割から $2m$ の分割への全単射である（逆は 1 を一つ加える）。
**後半.** $2m$ の分割は、部分 1 を含むものと含まないものに分かれる。含むものは 1 を一つ除いて $2m-1$ の分割と一対一に対応し、$b(2m-1)$ 個。含まないものはすべての部分が偶数で、各部分を半分にすると $m$ の 2 の冪への分割と一対一に対応し、$b(m)$ 個。
:::

## ポリアの数え上げ {#comb:sec-po-exercises}

対応するページ：\ref{comb:page-polya}

::: problem ★★ 標準：正方形の頂点の塗り分け {#comb:ex-mp-3}
正方形の 4 頂点を 3 色で塗る方法を、回転と裏返し（二面体群 $D_{4}$、位数 8）で重なるものを同じとみなして数えよ。
:::

::: solution
$D_{4}$ の元が頂点に引き起こす巡回型は、恒等 $p_{1}^{4}$、$\pm90^{\circ}$ 回転 2 個 $p_{4}$、$180^{\circ}$ 回転 $p_{2}^{2}$、対角線を軸とする裏返し 2 個 $p_{1}^{2}p_{2}$（軸上の 2 頂点を固定）、向かい合う辺の中点を通る軸の裏返し 2 個 $p_{2}^{2}$。よって $Z=\frac18(p_{1}^{4}+2p_{1}^{2}p_{2}+3p_{2}^{2}+2p_{4})$ で、\ref{comb:polya-theorem} の後半から $\frac18(81+2\cdot27+3\cdot9+2\cdot3)=\frac{168}{8}=21$。
:::

::: problem ★★ 標準：立方体の頂点の塗り分け {#comb:ex-po-2}
立方体の 8 頂点を 2 色で塗る方法を、回転で重なるものを同じとみなして数えよ。
:::

::: solution
立方体の回転群（位数 24）の元が 8 頂点に引き起こす置換の巡回型を数える。
- 恒等：$p_{1}^{8}$（1 個）。
- 向かい合う面の中心を通る軸の $\pm90^{\circ}$ 回転：上下の 4 頂点がそれぞれ 4 サイクル、$p_{4}^{2}$（6 個）。
- 同じ軸の $180^{\circ}$ 回転：$p_{2}^{4}$（3 個）。
- 向かい合う頂点を通る軸の $\pm120^{\circ}$ 回転：軸上の 2 頂点を固定し、残り 6 頂点が 3 サイクル 2 つ、$p_{1}^{2}p_{3}^{2}$（8 個）。
- 向かい合う辺の中点を通る軸の $180^{\circ}$ 回転：$p_{2}^{4}$（6 個）。

$1+6+3+8+6=24$ で全部である。ポリアの定理（\ref{comb:polya-theorem}）で各 $p_{k}$ に色の数 2 を代入すると、色付けの個数は
$$\frac{1}{24}\left(2^{8}+6\cdot2^{2}+3\cdot2^{4}+8\cdot2^{4}+6\cdot2^{4}\right)=\frac{256+24+48+128+96}{24}=\frac{552}{24}=23.$$
:::
