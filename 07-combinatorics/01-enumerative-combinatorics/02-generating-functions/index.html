# 母関数（Generating Functions）

形式的冪級数の代入・微分・指数と対数・一般の二項級数、通常型・指数型の母関数、定数係数の線形漸化式、カタラン数、整数の分割の母関数とオイラーの五角数定理。重み付きのバーンサイドの補題、巡回指数とポリアの数え上げ定理、対称群の巡回指数と指数公式。

<p class="mn-msc">MSC2020: 05A15, 05A17, 13F25, 05E18</p>

## 前提知識

- [数え上げ組合せ論 › 基本的な数え上げ](../../../07-combinatorics/01-enumerative-combinatorics/01-basic-counting/index.html)（全体、5 ページ）：二項係数・重複組合せ・スターリング数
- [可換代数 › 環の基礎](../../../02-algebra/03-commutative-algebra/01-basics/index.html)（全体、6 ページ）：形式的冪級数環と単元・形式的微分
- [群論 › 群の作用と対称群](../../../02-algebra/02-group-theory/02-group-actions/index.html)（全体、6 ページ）：群の作用・軌道と安定化群・バーンサイドの補題
