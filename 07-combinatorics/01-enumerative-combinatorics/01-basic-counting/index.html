# 基本的な数え上げ（Basic Counting）

和の法則・積の法則と二重数え上げ、単射・全単射の個数、二項係数と多項係数、重複組合せ、包除原理とボンフェローニの不等式、全射・完全順列・オイラー関数の数え上げ、写像の数え上げ（十二通りの数え方）。

<p class="mn-msc">MSC2020: 05A05, 05A10, 05A15, 05A19</p>

## 前提知識

- [集合論 › 基礎事項](../../../01-foundations/04-set-theory/01-basics/index.html)（全体、13 ページ）：有限集合と濃度・鳩の巣原理・有限基数の和と積と冪
- [群論 › 群と準同型](../../../02-algebra/02-group-theory/01-groups/index.html)（全体、7 ページ）：最大公約数・ユークリッドの補題・オイラー関数（包除原理の応用）
- [実解析 › 一変数の微積分](../../../04-analysis/01-real-analysis/02-calculus/index.html)（全体、11 ページ）：指数関数の級数（完全順列の割合の極限）
