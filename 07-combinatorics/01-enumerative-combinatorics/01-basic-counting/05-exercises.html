# 演習：基本的な数え上げ {#comb:page-exercises-basic-counting keywords="exercises, basic counting, binomial coefficients, inclusion-exclusion, Stirling numbers, Mobius inversion"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exbc-notation}

::: notation
- 記号は各節の見出しの下に示したページの約束に従う。$[n]=\{1,\dots,n\}$、$\binom{n}{k}$ は二項係数（\ref{comb:binomial-coefficient}）、$S(m,k)$ は第 2 種スターリング数（\ref{comb:stirling2}）、$\mu$ は数論のメビウス関数（\ref{comb:mobius-examples.3}）。
- 体系は $\ZF$。有限集合だけを扱うので選択公理は使わない。
:::

## 二項係数と重複組合せ {#comb:sec-bie-exercises}

対応するページ：\ref{comb:page-binomial-coefficients}

::: problem ★ 基本：二項係数の平方和 {#comb:ex-bc-1}
$\sum_{k=0}^{n}\binom{n}{k}^{2}=\binom{2n}{n}$ を示せ。
:::

::: solution
\ref{comb:binomial-identities.4}（ヴァンデルモンドの恒等式）で $m=n$, $k=n$ とすると $\binom{2n}{n}=\sum_{i}\binom{n}{i}\binom{n}{n-i}$ で、\ref{comb:binomial-identities.1} より $\binom{n}{n-i}=\binom{n}{i}$。
:::

::: problem ★★ 標準：隣り合わない部分集合 {#comb:ex-bc-2}
$[n]$ の $k$ 元部分集合で、どの二つの元も隣り合わない（差が 2 以上）ものの個数は $\binom{n-k+1}{k}$ であることを示せ。
:::

::: solution
条件を満たす部分集合の元を $a_{1}<\dots<a_{k}$ と並べ、$b_{i}\defeq a_{i}-(i-1)$ とおく。$a_{i+1}-a_{i}\ge2$ より $b_{i+1}-b_{i}\ge1$ で $b$ は狭義単調増加、$b_{1}=a_{1}\ge1$、$b_{k}=a_{k}-k+1\le n-k+1$。逆に $[n-k+1]$ の $k$ 元部分集合 $b_{1}<\dots<b_{k}$ から $a_{i}=b_{i}+i-1$ と戻すと、$a_{i+1}-a_{i}=b_{i+1}-b_{i}+1\ge2$, $a_{k}\le n$。二つの対応は互いに逆なので（\ref{comb:multiset-count} の Step 2 と同じずらし）、個数は $\binom{n-k+1}{k}$。
:::

::: problem ★ 基本：多項係数 {#comb:ex-bc-3}
単語 MISSISSIPPI の文字を並べ替えてできる文字列（同じ文字は区別しない）の個数を求めよ。
:::

::: solution
11 個の位置のうち M の位置を選び、残りから I（4 個）、S（4 個）、P（2 個）の位置を順に選ぶと考えれば、個数は多項係数（\ref{comb:multinomial-coefficient}）
$$\binom{11}{1,4,4,2}=\frac{11!}{1!\,4!\,4!\,2!}=\binom{11}{1}\binom{10}{4}\binom{6}{4}\binom{2}{2}=11\cdot210\cdot15\cdot1=34650.$$
:::

## 包除原理 {#comb:sec-ie-exercises}

対応するページ：\ref{comb:page-inclusion-exclusion}

::: problem ★★ 標準：隣り合わない夫婦 {#comb:ex-ie-1}
$n$ 組の夫婦 $2n$ 人が一列に並ぶとき、どの夫婦も隣り合わない並べ方の個数は
$$
\sum_{j=0}^{n}(-1)^{j}\binom{n}{j}2^{j}(2n-j)!
$$
であることを示せ（$n=3$ で $240$）。
:::

::: solution
$U$ を $2n$ 人の並べ方全体、$A_{i}$ を夫婦 $i$ が隣り合う並べ方の集合とする。$S\subseteq[n]$, $\abs{S}=j$ について、$A_{S}$ の元は、$S$ の各夫婦を一つの「組」にまとめた $2n-j$ 個の対象の並べ方（$(2n-j)!$ 通り）と、各組の中の順序（$2^{j}$ 通り）の組と一対一に対応するので、$\abs{A_{S}}=2^{j}(2n-j)!$。\ref{comb:inclusion-exclusion} を $\abs{S}=j$ ごとにまとめればよい。$n=3$ では $720-3\cdot2\cdot120+3\cdot4\cdot24-8\cdot6=720-720+288-48=240$。
:::

::: problem ★★ 標準：上限つきの重複組合せ {#comb:ex-ie-2}
区別しない 10 個の玉を区別する 4 つの箱に、どの箱にも 4 個以下になるように入れる方法は何通りか。
:::

::: solution
$U$ を制限なしの入れ方（$x_{1}+\dots+x_{4}=10$ の非負整数解）全体、$A_{i}$ を $x_{i}\ge5$ となるものとする。$\abs{S}=j$ なら、$y_{i}=x_{i}-5$（$i\in S$）とおけば $A_{S}$ は合計 $10-5j$ の非負整数解と一対一に対応し、$\abs{A_{S}}=\binom{10-5j+3}{3}$（$10-5j\ge0$ のとき）、$j\ge3$ では空。\ref{comb:compositions.1} と \ref{comb:inclusion-exclusion} より
$$
\binom{13}{3}-4\binom{8}{3}+6\binom{3}{3}=286-224+6=68.
$$
:::

::: problem ★★ 標準：一部の点を動かす置換 {#comb:ex-ie-3}
$[6]$ の置換で、$1,2,3$ のどれも固定しないもの（$4,5,6$ は固定してもよい）の個数を求めよ。
:::

::: solution
$A_{i}$（$i=1,2,3$）を $i$ を固定する置換の集合とする。$\abs{S}=j$ の $S\subseteq\{1,2,3\}$ について、$S$ の点を固定する置換は残り $6-j$ 点の置換なので $\abs{A_{S}}=(6-j)!$。\ref{comb:inclusion-exclusion} から
$$\sum_{j=0}^{3}(-1)^{j}\binom{3}{j}(6-j)!=720-3\cdot120+3\cdot24-6=426.$$
:::

## 写像の数え上げとスターリング数 {#comb:sec-tw-exercises}

対応するページ：\ref{comb:page-twelvefold-way}

::: problem ★ 基本：全射と分割の数値 {#comb:ex-tw-1}
$S(5,3)=25$ と、全射 $[5]\to[3]$ の個数 $150$ を、漸化式と \ref{comb:surjections-partitions} の公式の両方で確かめよ。
:::

::: solution
漸化式（\ref{comb:stirling2-recurrence}）：$S(4,2)=7$, $S(4,3)=6$ から $S(5,3)=S(4,2)+3S(4,3)=7+18=25$。公式：$\frac{1}{3!}(3^{5}-3\cdot2^{5}+3\cdot1^{5})=\frac{243-96+3}{6}=25$。全射は $3!\cdot25=150$。
:::

::: problem ★★ 標準：$S(n,n-2)$ {#comb:ex-tw-2}
$n\ge2$ について $S(n,n-2)=\binom{n}{3}+3\binom{n}{4}$ を示せ。
:::

::: solution
ブロックが $n-2$ 個の分割では、ブロックの大きさの和が $n$ なので、「大きさ 1 のブロックより余分な元」の合計が $2$ である。したがって、3 元のブロックが一つで他は 1 元か、2 元のブロックが二つで他は 1 元のどちらかである（\ref{comb:sum-rule}）。前者は 3 元のブロックの選び方で $\binom{n}{3}$ 通り。後者は 2 元ブロック二つの和集合（4 元集合）を $\binom{n}{4}$ 通り選び、それを 2 元ずつに分ける方法が 3 通り。
:::

::: problem ★ 基本：区別のない箱 {#comb:ex-tw-3}
区別できる 7 個の玉を、区別できない 3 つの箱に、どの箱も空にならないように入れる方法の数を求めよ。
:::

::: solution
入れ方は $[7]$ の 3 個のブロックへの分割と一対一に対応するので、$S(7,3)$ 通り。\ref{comb:surjections-partitions} の公式から
$$S(7,3)=\frac{1}{3!}\left(3^{7}-3\cdot2^{7}+3\cdot1^{7}\right)=\frac{2187-384+3}{6}=301.$$
:::

## 半順序集合のメビウス反転 {#comb:sec-mi-exercises}

対応するページ：\ref{comb:page-mobius-inversion}

::: problem ★ 基本：メビウス関数の和 {#comb:ex-mp-1}
$\sum_{d\mid n}\mu(d)=[n=1]$ と $\sum_{d\mid n}\frac{\mu(d)}{d}=\frac{\varphi(n)}{n}$ を示せ。
:::

::: solution
前半は、約数の束の区間 $[1,n]$ で $\sum_{1\le d\le n}\mu(1,d)=(\mu*\zeta)(1,n)=\delta_{1,n}$（\ref{comb:mobius-function}）と $\mu(1,d)=\mu(d)$（\ref{comb:mobius-examples.3}）から。後半は \ref{comb:number-theoretic-inversion} の $\varphi(n)=\sum_{d\mid n}\mu(d)\frac{n}{d}$ を $n$ で割ったもの。
:::

::: problem ★★★ 発展：周期をもたない語 {#comb:ex-mp-2}
2 文字からなる長さ 12 の語のうち、より短い語の繰り返しになっていないもの（**原始的な語**）の個数と、原始的な首飾り（\ref{comb:prob-mi-necklaces}）の個数を求めよ。
:::

::: solution
\ref{comb:prob-mi-necklaces} の解答のとおり、原始的な語の個数は $a_{12}=\sum_{d\mid12}\mu(d)2^{12/d}$。$\mu(d)\neq0$ となる約数は $1,2,3,6$（$\mu=1,-1,-1,1$）で、$a_{12}=2^{12}-2^{6}-2^{4}+2^{2}=4096-64-16+4=4020$。原始的な首飾りは、各軌道がちょうど 12 個の語からなるので $4020/12=335$。
:::

::: problem ★★ 標準：ブール束での反転と全射 {#comb:ex-mi-3}
$n,k\ge1$ とする。$T\subseteq[k]$ について、写像 $[n]\to T$ の個数を $g(T)$、全射 $[n]\to T$ の個数を $f(T)$ とする。ブール束 $\mathcal{P}([k])$ でのメビウス反転を使って、全射 $[n]\to[k]$ の個数が $\sum_{j=0}^{k}(-1)^{k-j}\binom{k}{j}j^{n}$ であることを示せ。
:::

::: solution
写像 $[n]\to T$ は、その像 $S\subseteq T$ への全射と一対一に対応するので $g(T)=\sum_{S\subseteq T}f(S)$。$\mathcal{P}([k])$ は有限なのでメビウス反転（\ref{comb:mobius-inversion}）が使え、$\mu(S,T)=(-1)^{\abs{T\setminus S}}$（\ref{comb:mobius-examples.2}）から $f(T)=\sum_{S\subseteq T}(-1)^{\abs{T\setminus S}}g(S)$。$g(S)=\abs{S}^{n}$ で、大きさ $j$ の $S\subseteq[k]$ は $\binom{k}{j}$ 個なので、$T=[k]$ として結論を得る。（これは \ref{comb:surjections-partitions} の公式の別証明である。）
:::
