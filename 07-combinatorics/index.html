# 組合せ論（Combinatorics）

数え上げと母関数、グラフ理論、極値組合せ論と確率的方法、デザインとマトロイド、代数的組合せ論、凸多面体と離散幾何。

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-enumerative-combinatorics/index.html"><span class="mn-card-title">数え上げ組合せ論</span><span class="mn-card-en">Enumerative Combinatorics</span><span class="mn-card-desc">包除原理、形式的冪級数と母関数、整数の分割、半順序集合のメビウス反転、ポリアの数え上げ定理。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="02-graph-theory/index.html"><span class="mn-card-title">グラフ理論</span><span class="mn-card-en">Graph Theory</span><span class="mn-card-desc">木と閉路空間、マッチングとフロー、メンガーの定理、平面グラフとクラトフスキーの定理、彩色、ハミルトン閉路、マイナーと木幅。</span><span class="mn-card-count">1 ページ</span></a>
<a class="mn-card" href="03-extremal-probabilistic/index.html"><span class="mn-card-title">極値組合せ論と確率的方法</span><span class="mn-card-en">Extremal and Probabilistic Combinatorics</span><span class="mn-card-desc">ターンの定理、正則性補題、有限ラムゼー理論とファン・デル・ヴェルデンの定理、確率的方法と閾値関数。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="04-designs-matroids/index.html"><span class="mn-card-title">デザインとマトロイド</span><span class="mn-card-en">Designs and Matroids</span><span class="mn-card-desc">ブロックデザインとフィッシャーの不等式、有限射影平面、マトロイドの公理と貪欲法。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="05-algebraic-combinatorics/index.html"><span class="mn-card-title">代数的組合せ論</span><span class="mn-card-en">Algebraic Combinatorics</span><span class="mn-card-desc">グラフのスペクトルと行列木定理、ヤング図形と RSK 対応。</span><span class="mn-card-count">0 ページ</span></a>
