# 面による閉路空間とマックレーンの判定法 {#graph:page-plane-duality keywords="cycle space of a plane graph, face boundaries, simple basis, MacLane's planarity criterion, plane dual, cycles and bonds"}

平面グラフでは、各面の「縁」（片側だけがその面である辺の集合）が閉路空間（\ref{graph:page-cycle-space}）を生成し、しかも各辺は高々二つの縁にしか現れない。マックレーンの判定法は、この性質が平面性を特徴づけることを主張する：**グラフが平面的であることと、閉路空間が「各辺が高々二つの元にしか現れない」基底をもつことは同値である**。このページではこれを \ref{graph:kuratowski} を使って証明する。あわせて、面を頂点とみる**平面双対**の考え方で、平面グラフの閉路空間が「面の集合の縁」全体と一致することを示す。

## 記法と定義の確認 {#graph:sec-du-notation}

::: notation
- 辺空間・閉路空間 $\mathcal{C}(G)$・カット空間・$\dim\mathcal{C}(G)=m-n+c$ は \ref{graph:page-cycle-space} の定義に従う（$\mathbb{F}_{2}$ 上、和は対称差）。
- 平面グラフの面・辺の両側（\ref{graph:edge-sides}）・\ref{graph:euler-formula}・\ref{graph:kuratowski} を使う。
- 細分・位相的マイナーは \ref{graph:page-minors} のとおり。
:::

## 面の縁と閉路空間 {#graph:sec-du-faces}

::: definition 面の集合の縁 {#graph:face-set-boundary keywords="boundary edge set of a set of faces" index="面の縁|めんのふち"}
平面グラフ $\Gamma$ の面の集合 $\mathcal{S}$ に対し、両側の面（\ref{graph:edge-sides.2}）のうちちょうど一方が $\mathcal{S}$ に属する辺の集合を $\delta\mathcal{S}$ と書き、$\mathcal{S}$ の**縁**という。$\delta\{F\}$ を $\delta F$ と書く。
:::

::: intuition
いくつかの面を塗りつぶしたとき、塗った部分と塗っていない部分の境目になっている辺の集まりである。両側とも同じ面の辺（橋）はどの縁にも入らない。
:::

::: lemma 縁は加法的 {#graph:face-boundary-additive keywords="delta of a union of faces is the sum of deltas" index="縁の加法性|ふちのかほうせい"}
$\delta\mathcal{S}=\sum_{F\in\mathcal{S}}\delta F$。また、すべての面の集合 $\mathcal{F}$ について $\delta\mathcal{F}=\varnothing$。
:::

::: proof
辺 $e$ の両側を $L,R$ とする。$L=R$ なら、$e$ はどの $\delta F$ にも $\delta\mathcal{S}$ にも入らない。$L\neq R$ なら、$e\in\delta F\iff F\in\{L,R\}$ なので、$e$ が右辺に現れる回数は $\abs{\{L,R\}\cap\mathcal{S}}$ で、それが奇数であることは $e\in\delta\mathcal{S}$ と同値。後半は $\{L,R\}\subseteq\mathcal{F}$ による。
:::

::: theorem 平面グラフの閉路空間 {#graph:plane-cycle-space keywords="the cycle space of a plane graph consists of the boundaries of sets of faces; face boundaries form a simple basis" index="平面グラフの閉路空間|へいめんぐらふのへいろくうかん"}
$\Gamma$ を平面グラフ、$F_{0}$ をその非有界な面とする。
1. 各閉路 $D$ について、$D$ の内部に含まれる面の集合を $\mathcal{S}_{D}$ とすると $E(D)=\delta\mathcal{S}_{D}$。
2. $\mathcal{C}(\Gamma)=\{\delta\mathcal{S} : \mathcal{S}\text{ は面の集合}\}$。
3. 有界な面 $F$ の縁 $\delta F$ 全体は $\mathcal{C}(\Gamma)$ の基底をなし、各辺は高々二つの $\delta F$ にしか現れない。
:::

::: intuition
平面グラフの輪は、どれもその内側にある面たちの縁として書け、面の縁を重ね合わせたものは必ず輪の重ね合わせになる。面の縁は閉路空間の「いちばん小さい」基底を与える。
:::

::: proof
**Step 1（(1)）.** 【主張：辺 $e$ が $\delta\mathcal{S}_{D}$ に入ることと $e\in D$ は同値】$e\in D$ なら、\ref{graph:edge-sides} の証明の Step 4 と同じく、$e^{\circ}$ の点の両側は $\mathbb{R}^{2}\setminus D$ の異なる成分にあり、ちょうど一方が $D$ の内部にある。$e\notin D$ なら、$e^{\circ}$ は連結で $D$ と交わらないので $D$ の内部か外部の一方に含まれ、その点のすぐ両側の点も同じ成分にある。よって両側の面はともに内部にあるか、ともに外部にあり、$e\notin\delta\mathcal{S}_{D}$。

**Step 2（縁は閉路空間に入る）.** 【主張：各 $\delta F$ のすべての頂点の次数は偶数】\ref{mfd:tame-graph} で折れ線グラフとし、頂点 $v$ の小さい円板を考えると、$v$ から出る辺（半径）が円板を扇形に分け、各扇形は一つの面に含まれる。$v$ の辺 $e$ の両側の面は、$e$ をはさむ二つの扇形の面である（$e^{\circ}$ の $v$ の近くの点の円板と比べる）。扇形を $v$ のまわりに一周たどると、「$F$ の扇形」と「$F$ でない扇形」が入れ替わる境目の辺がちょうど $\delta F$ の $v$ の辺で、一周して元に戻るので入れ替わりは偶数回。\ref{graph:cycle-space-characterization} より $\delta F\in\mathcal{C}(\Gamma)$、したがって \ref{graph:face-boundary-additive} より $\delta\mathcal{S}\in\mathcal{C}(\Gamma)$。

**Step 3（(2)(3)）.** 【主張：有界な面の縁は $\mathcal{C}(\Gamma)$ を張り、個数は次元に等しい】(1) と \ref{graph:face-boundary-additive} より各閉路は有界な面の縁の和（$D$ の内部の面は有界）で、閉路は $\mathcal{C}(\Gamma)$ を張るので、有界な面の縁 $f-1$ 個は $\mathcal{C}(\Gamma)$ を張る。\ref{graph:euler-formula} より $f-1=m-n+c=\dim\mathcal{C}(\Gamma)$ なので、これらは基底である。よって $\mathcal{C}(\Gamma)$ の元は有界な面の集合 $\mathcal{S}$ の縁 $\delta\mathcal{S}$ と書け、逆に Step 2 から縁はすべて $\mathcal{C}(\Gamma)$ に入る。各辺は両側の面の縁にしか入らない。
:::

## マックレーンの判定法 {#graph:sec-du-maclane}

::: definition 単純な基底 {#graph:simple-basis keywords="simple basis of the cycle space" index="単純な基底（閉路空間）|たんじゅんなきてい"}
$\mathcal{C}(G)$ の基底 $\{B_{1},\dots,B_{k}\}$ で、どの辺も高々二つの $B_{i}$ にしか含まれないものを**単純な基底**という（$k=0$ の空の基底も単純）。
:::

::: intuition
閉路空間の生成元を、どの辺も高々 2 回しか使わないように選べることである。平面グラフの面の縁はその例である。
:::

::: lemma 単純な基底の遺伝性 {#graph:simple-basis-hereditary keywords="simple bases pass to subgraphs and between subdivisions" index="単純な基底の遺伝性|たんじゅんなきていのいでんせい"}
1. $G$ が単純な基底をもてば、$G$ の部分グラフも単純な基底をもつ。
2. $X$ の細分 $TX$ が単純な基底をもてば、$X$ も単純な基底をもつ。
:::

::: proof
**Step 1（辺を一本除く）.** 【主張：単純な基底 $\{B_{i}\}$ をもつ $G$ の辺 $e$ について、$G-e$ も単純な基底をもつ】$\mathcal{C}(G-e)=\{D\in\mathcal{C}(G) : e\notin D\}$ である（偶次数の特徴づけ \ref{graph:cycle-space-characterization}）。(i) $e$ がどの $B_{i}$ にも入らなければ、$\mathcal{C}(G)$ の元はどれも $e$ を含まないので $\mathcal{C}(G-e)=\mathcal{C}(G)$ で、同じ基底でよい。(ii) $e$ がちょうど一つ $B_{1}$ に入れば、$\{B_{2},\dots,B_{k}\}$ は $e$ を含まず一次独立で、$D\in\mathcal{C}(G-e)$ を $\sum_{i\in I}B_{i}$ と書くと $e\notin D$ から $1\notin I$。よって基底で、単純性も保たれる。(iii) $e$ が $B_{1},B_{2}$ に入れば、$\{B_{1}+B_{2},B_{3},\dots,B_{k}\}$ を考える。同様に $D=\sum_{i\in I}B_{i}$ で $e\notin D$ なら $1\in I\iff2\in I$ なので、これは $\mathcal{C}(G-e)$ の基底。辺 $e'\neq e$ が $B_{1}+B_{2}$ に入るのは $B_{1},B_{2}$ のちょうど一方に入るときで、$e'$ が入る基底の元の個数は増えない。

**Step 2（(1)）.** 部分グラフは辺を一本ずつ除き、最後に孤立点を除いて得られる。孤立点を除いても閉路空間は変わらない。

**Step 3（(2)）.** $X$ の辺 $xy$ を道 $P_{xy}$ に置き換えた $TX$ について、$\mathcal{C}(TX)$ の元は各道 $P_{xy}$ の辺を全部含むか全く含まないか（道の内部の頂点の次数は 0 か 2 でなければならない）なので、「$P_{xy}$ を全部含む $\leftrightarrow$ $xy$ を含む」という対応は $\mathcal{C}(TX)$ から $\mathcal{C}(X)$ への線形同型で、各辺 $xy$ を含む元の個数を保つ。単純な基底は単純な基底に移る。
:::

::: theorem マックレーンの判定法 {#graph:maclane keywords="MacLane's planarity criterion" index="マックレーンの判定法|まっくれーんのはんていほう" refname="マックレーンの判定法"}
グラフが平面的であることと、その閉路空間が単純な基底をもつことは同値である。
:::

::: intuition
平面に描けるグラフとは、輪の空間を「どの辺も高々 2 回しか使わない」輪で生成できるグラフのことである。辺の重なり具合という代数的な条件で、平面性が判定できる。
:::

::: proof
**Step 1（⇒）.** 【主張：平面的なら単純な基底がある】平面埋め込みについて \ref{graph:plane-cycle-space.3}。

**Step 2（$K_{3,3}$ と $K^{5}$ は単純な基底をもたない）.** 【主張：単純な基底 $B_{1},\dots,B_{k}$ と $B_{0}\defeq B_{1}+\dots+B_{k}$ について $\sum_{i=0}^{k}\abs{B_{i}}\le2m$】辺が $B_{1},\dots,B_{k}$ のうち $j\le2$ 個に入るとき、$B_{0}$ に入るのは $j$ が奇数のときで、$B_{0},\dots,B_{k}$ のうちちょうど $j+[j\text{ 奇数}]\in\{0,2\}$ 個に入る。$B_{i}$ は一次独立なので $B_{0}\neq\varnothing$ で、$\mathcal{C}$ の空でない元は閉路を含む（\ref{graph:cycle-space-characterization}）ので、どの $B_{i}$ も内周以上の辺をもつ。$K_{3,3}$ は $m=9$, $n=6$, $k=\dim\mathcal{C}=4$, 内周 4 で、$\sum\abs{B_{i}}\ge5\cdot4=20>18$。$K^{5}$ は $m=10$, $k=6$, 内周 3 で、$\ge7\cdot3=21>20$。どちらも矛盾。

**Step 3（⇐）.** 【主張：単純な基底をもつグラフは平面的】平面的でなければ、\ref{graph:kuratowski} より $TK^{5}$ か $TK_{3,3}$ を部分グラフに含み、\ref{graph:simple-basis-hereditary} より $K^{5}$ か $K_{3,3}$ が単純な基底をもつことになり、Step 2 に反する。
:::

::: supplement
**平面双対.** 連結な平面グラフ $\Gamma$ の面を頂点とし、各辺 $e$ に対してその両側の面を結ぶ辺 $e^{*}$ をおいた多重グラフ（ループや多重辺を許すグラフ）$\Gamma^{*}$ を**平面双対**という。\ref{graph:plane-cycle-space.2} は、$e\leftrightarrow e^{*}$ の対応で「$\Gamma$ の閉路空間 $=$ $\Gamma^{*}$ のカット空間」（面の集合 $\mathcal{S}$ を両側に分ける辺の集合）であることを述べている。直交性（\ref{graph:cycle-cut-duality}）を多重グラフに拡張すれば「$\Gamma$ のカット空間 $=$ $\Gamma^{*}$ の閉路空間」も従い、$\Gamma$ の閉路は $\Gamma^{*}$ の結合（極小カット）に、$\Gamma$ の結合は $\Gamma^{*}$ の閉路に対応する。

**ホイットニーの定理.** グラフ $G$ が平面的であることと、$G$ が**抽象的双対**（辺の全単射 $e\mapsto e^{*}$ で、$G$ の閉路の辺集合がちょうど $G^{*}$ の結合の辺集合に移るグラフ $G^{*}$）をもつことは同値である（ホイットニー、1932 年。Diestel, *Graph Theory* 第 4.6 節）。ここでは証明しない。
:::

## 問題 {#graph:sec-du-problems}

::: problem {#graph:prob-du-cube}
立方体のグラフ $Q_{3}$（8 頂点・12 辺）を平面に描き、有界な面の縁が閉路空間の基底をなすことを、個数 $m-n+1$ と比べて確かめよ。
:::

::: solution
正方形の中に正方形を描き、対応する頂点を結ぶと、面は 6 つ（有界な面 5 つ）。$m-n+1=12-8+1=5$ で、\ref{graph:plane-cycle-space.3} の基底の個数と一致する。各辺は二つの面の縁に入る。
:::

::: problem {#graph:prob-du-tree}
木 $T$ の平面埋め込みについて、\ref{graph:plane-cycle-space} がどうなるかを述べよ。
:::

::: solution
木の面は一つだけ（\ref{graph:edge-sides.4} よりすべての辺の両側が同じ面で、オイラーの公式から $f=1$）。有界な面はなく、基底は空で、閉路空間は $\{0\}$（$\dim=m-n+1=0$）。すべての辺が橋なので、どの縁にも入らない。
:::
