# 面の境界と 3 連結グラフの縮約 {#graph:page-face-boundaries keywords="face boundary, faces of a subgraph, theta graph, 2-connected plane graphs, faces bounded by cycles, 3-connected graphs, contractible edge, Tutte"}

クラトフスキーの定理（\ref[クラトフスキーの定理]{graph:page-kuratowski}）の証明には、二つの準備が要る。一つは位相的な事実で、**2 連結な平面グラフのすべての面は閉路で囲まれる**こと。もう一つは組合せ的な事実で、**$K^{4}$ 以外の 3 連結グラフは、3 連結性を保ったまま辺を一本縮約できる**ことである。このページではこの二つを証明する。

## 記法と定義の確認 {#graph:sec-fb-notation}

::: notation
- 有限平面グラフ・面・辺の両側・面の次数は \ref{graph:page-plane-graphs} の定義に従う。面 $f$ の境界 $\partial f$ は辺と頂点の和である（\ref{graph:edge-sides.1}）。$\partial f$ に含まれる辺と頂点のなす部分グラフも同じ記号で表し、$f$ の**境界グラフ**という。
- 耳分解（\ref{graph:ear-decomposition}）、縮約 $G/e$ と縮約でできた頂点 $v_{e}$（\ref{graph:contraction}）、連結度（\ref{graph:connectivity}）を使う。
- 正三角形の周と中線への θ 形グラフの移し方（\ref{mfd:prob-gr-theta}）と \ref{at:jordan-curve} を使う。
:::

## 部分グラフの面と θ 形グラフ {#graph:sec-fb-theta}

::: lemma 部分グラフの面 {#graph:faces-of-subgraph keywords="faces of a plane graph and of its subgraphs" index="部分グラフの面|ぶぶんぐらふのめん"}
$\Gamma'$ を平面グラフ $\Gamma$ の部分グラフとする。
1. $\Gamma$ の各面は $\Gamma'$ のある面に含まれる。
2. $\Gamma$ の面 $f$ で $\partial f\subseteq|\Gamma'|$ となるものは、$\Gamma'$ の面でもある。
:::

::: proof
(1) $\Gamma$ の面は連結で $|\Gamma'|\subseteq|\Gamma|$ と交わらない。(2) $f$ は $\mathbb{R}^{2}\setminus|\Gamma'|$ の連結な開集合で、その境界は $|\Gamma'|$ に含まれるので $\mathbb{R}^{2}\setminus|\Gamma'|$ の中で閉集合でもある。よって $f$ を含む $\Gamma'$ の面（連結）は $f$ に等しい。
:::

::: lemma θ 形グラフの面 {#graph:theta-faces keywords="faces of a theta graph" index="θ 形グラフ|しーたがたぐらふ"}
$C$ を平面グラフの閉路、$P$ を $C$ 道（両端だけが $C$ にある道）とし、$P$ の端点で $C$ を分けた二つの道を $C_{1},C_{2}$ とする。$C\cup P$ の面はちょうど 3 つで、その境界グラフは $C$, $C_{1}\cup P$, $C_{2}\cup P$ である（どれも閉路）。
:::

::: intuition
円に一本の弦を引くと、平面は弦の両側の二つの部分と円の外側の三つに分かれ、それぞれの縁は円、弦と円の一方の弧、弦と他方の弧である。
:::

::: proof
**Step 1（内部の場合）.** 【主張：$P^{\circ}$ が $C$ の内部にあれば主張が成り立つ】$P^{\circ}$ は連結で $C$ と交わらないので、$C$ の内部か外部の一方に含まれる。内部にあるとき、\ref{mfd:prob-gr-theta} より、平面の同相写像で $C$ を正三角形 $T$ の周、$P$ を $T$ の中線に移せる。このとき面は、中線で分けた二つの小さい三角形の内部と $T$ の外部で、境界はそれぞれ二つの小三角形の周と $T$ の周である（凸集合とその補集合なので直接確かめられる）。同相写像は面と境界を保つ。

**Step 2（外部の場合）.** 【主張：反転で内部の場合に帰着する】$a$ を $C$ の内部の点とし、$\phi(z)\defeq1/(z-a)$ を $\widehat{\C}$ の同相写像とみる（$a\mapsto\infty$, $\infty\mapsto0$）。$\phi(C\cup P)$ は平面グラフで、$\phi$ は $C$ の外部と $\infty$ の和（連結で $\infty$ を含む）を $\phi(C)$ の有界な成分（$0$ を含む）に、$C$ の内部（$a$ を含む）を非有界な成分に移す。よって $\phi(P)^{\circ}$ は $\phi(C)$ の内部にあり、Step 1 が使える。$\widehat{\C}\setminus|\Gamma|$ の成分と面の対応（\ref{graph:edge-sides} の Step 7）を通して、面の個数と境界はそのまま戻る。
:::

## 2 連結な平面グラフの面 {#graph:sec-fb-2-connected}

::: theorem 2 連結な平面グラフの面は閉路で囲まれる {#graph:faces-bounded-by-cycles keywords="in a 2-connected plane graph every face is bounded by a cycle" index="面の境界の閉路|めんのきょうかいのへいろ" refname="2 連結平面グラフの面の境界定理"}
2 連結な平面グラフのすべての面の境界グラフは閉路である。
:::

::: intuition
一点を除いてもつながっている平面グラフでは、どの面の縁も一つの輪になっていて、縁から木の枝のような飛び出しはない。
:::

::: proof
辺の数の帰納法。$\Gamma$ が閉路なら、\ref{at:jordan-curve} より面は 2 つでどちらの境界も $\Gamma$ 全体である。

**Step 1（耳を一つ除く）.** 閉路でないとき、\ref{graph:ear-decomposition} より、2 連結な部分グラフ $H$ と $H$ 道 $P$ で $\Gamma=H\cup P$ となるものがある。$P^{\circ}$ は連結で $|H|$ と交わらないので $H$ のある面 $f'$ に含まれ、帰納法の仮定から $\partial f'$ は閉路 $C$ である。$P$ の両端は $\partial f'$ の上にある（$P$ の端点の近くの $P^{\circ}$ の点は $f'$ にあり、端点は $|H|$ にある）ので $C$ 上にあり、$P$ は $C$ 道である。

**Step 2（$f'$ に含まれない面）.** 【主張：$\Gamma$ の面 $f$ が $f'$ と交わらなければ、$f$ は $H$ の面で、境界は帰納法の仮定から閉路】$f$ は $H$ のある面に含まれ（\ref{graph:faces-of-subgraph.1}）、それは $f'$ ではない。$P^{\circ}\subseteq f'$ で $f'$ は開集合なので、$P^{\circ}$ の各点は $f'$ に含まれる近傍をもち、$f'$ と交わらない $f$ はその点を閉包に含まない。よって $\partial f\subseteq|H|$ で、\ref{graph:faces-of-subgraph.2} より $f$ は $H$ の面。

**Step 3（$f'$ に含まれる面）.** 【主張：$f\subseteq f'$ なら $f$ は $C\cup P$ の面で、境界は閉路】\ref{graph:faces-of-subgraph.1} より $\Gamma$ の面は $H$ の面に含まれるので、$f'$ と交わる面は $f'$ に含まれる。$\partial f\subseteq\overline{f'}\cap|\Gamma|\subseteq(f'\cup C)\cap|\Gamma|\subseteq C\cup P$（$f'\cap|\Gamma|=P^{\circ}$）。\ref{graph:faces-of-subgraph.2} より $f$ は $C\cup P$ の面で、\ref{graph:theta-faces} より境界は閉路である。
:::

## 3 連結グラフの縮約 {#graph:sec-fb-contraction}

::: lemma 縮約できる辺 {#graph:contractible-edge keywords="every 3-connected graph other than K4 has a contractible edge, Thomassen's lemma" index="縮約可能な辺|しゅくやくかのうなへん"}
$K^{4}$ でない 3 連結グラフ $G$ は、$G/e$ も 3 連結となる辺 $e$ をもつ。
:::

::: intuition
3 連結なグラフは、どこか一本の辺を縮めても 3 連結のままにできる。これを繰り返せば、どの 3 連結グラフも $K^{4}$ まで縮められる。
:::

::: proof
3 連結なので $\abs{G}\ge4$、$K^{4}$ でないので $\abs{G}\ge5$（4 頂点の 3 連結グラフは最小次数 3 で $K^{4}$）。そのような辺がないと仮定する。

**Step 1（各辺から 3 点の分離集合）.** 【主張：各辺 $xy$ について、$T=\{x,y,z\}$ が $G$ を分離する頂点 $z$ がある】$\abs{G/xy}=\abs{G}-1\ge4$ なので、$G/xy$ が 3 連結でないことから、$\abs{S}\le2$ で $G/xy-S$ が非連結になる $S$ がある。$v_{xy}\notin S$ なら $S$ は $G$ も分離し（$G-S$ の道を縮約すれば $G/xy-S$ の道になる）、$\kappa(G)\ge3$ に反する。$S=\{v_{xy}\}$ なら $\{x,y\}$ が $G$ を分離して矛盾。よって $S=\{v_{xy},z\}$ で、$T\defeq\{x,y,z\}$ は $G$ を分離する。

**Step 2（各点は各成分に隣接）.** 【主張：$T$ の各頂点は $G-T$ のすべての成分に隣接する】そうでない $t\in T$ と成分 $C$ があれば、$T\setminus\{t\}$（2 点）が $C$ と残りを分離し、3 連結性に反する。

**Step 3（最小の成分）.** Step 1 の $(xy,z)$ と $G-T$ の成分 $C$ の組のうち、$\abs{C}$ が最小のものをとる。Step 2 より $z$ は $C$ の頂点 $v$ と隣接する。辺 $zv$ に Step 1 を使うと、$\{z,v,w\}$ が $G$ を分離する頂点 $w$ がある。

**Step 4（より小さい成分）.** 【主張：$G-\{z,v,w\}$ のある成分 $D$ は $D\subsetneq C$ を満たし、最小性に反する】$x,y$ は隣接するので、$\{x,y\}\setminus\{w\}$ は $G-\{z,v,w\}$ の一つの成分に含まれ、成分は 2 つ以上あるので、$x,y$ を含まない成分 $D$ がある。Step 2 を $\{z,v,w\}$ に使うと $v$ は $D$ の頂点 $u$ と隣接する。$v\in C$ なので $u\in C\cup T$ で、$u\notin\{x,y\}$（$D$ は $x,y$ を含まない）、$u\neq z$ なので $u\in C$。$D$ は $T$ と交わらない連結な集合（$z,x,y\notin D$）で $C$ と交わるので $D\subseteq C$、さらに $v\in C\setminus D$。$D$ は辺 $zv$ と頂点 $w$ についての成分なので、$\abs{C}$ の最小性に反する。
:::

::: supplement
**タットの定理.** \ref{graph:contractible-edge} から、グラフが 3 連結であることと、$K^{4}$ から始めて「両端の次数が 3 以上になるように頂点を二つに分ける」操作を繰り返して得られることが同値であることが従う（タット、1961 年。Diestel, *Graph Theory* 第 3.2 節）。ここでは使わない。

**3 連結な平面グラフ.** 3 連結な平面グラフでは、面の境界はちょうど「グラフを分けない、弦のない閉路」であり、埋め込みはグラフから（球面上で）一意に決まる（ホイットニーの定理）。
:::

## 問題 {#graph:sec-fb-problems}

::: problem {#graph:prob-fb-cut-vertex}
2 連結でない平面グラフ（たとえば三角形二つを一点でつないだもの）では、ある面の境界が閉路でないことを確かめよ。
:::

::: solution
三角形 $abc$ と $cde$ を $c$ でつないだグラフでは、外側の面の境界は両方の三角形の和で、$c$ の次数が 4 なので閉路ではない。
:::

::: problem {#graph:prob-fb-wheel}
車輪グラフ $W_{n}$（閉路 $C_{n}$ と、すべての頂点に隣接する中心）は $n\ge3$ で 3 連結であることを示し、$W_{n}$（$n\ge4$）の縮約可能な辺を一つ挙げよ。
:::

::: solution
2 頂点を除いても、中心が残れば中心を通じて連結、中心を除けば残りは閉路から 1 頂点を除いた道で連結。$n\ge4$ では閉路の辺（縁の辺）$e$ を縮約すると $W_{n-1}$ になり 3 連結である。（スポークを縮約すると、縁の閉路が切れて道になり、中心ともう一つの頂点で分離されるので 3 連結でない。）
:::
