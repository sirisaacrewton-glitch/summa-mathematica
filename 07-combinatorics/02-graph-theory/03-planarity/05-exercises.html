# 演習：平面グラフ {#graph:page-exercises-planarity keywords="exercises, graph theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界（等号の例・反例）を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-explanarity-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。
:::

## 平面グラフとオイラーの公式 {#graph:sec-pg-exercises}

対応するページ：\ref{graph:page-plane-graphs}

::: problem ★ 基本：平面二部グラフの小さい次数 {#graph:ex-pl-bipartite-degree}
$n\ge3$ 頂点の平面的な二部グラフは、次数 3 以下の頂点をもつことを示せ。
:::

::: solution
二部グラフは奇閉路をもたず（\ref{graph:bipartite-odd-cycle}）、特に三角形を含まないので、\ref{graph:planar-edge-bound} の 2 から $m\le2n-4$。すべての頂点の次数が 4 以上なら、握手補題から $2m\ge4n$, $m\ge2n$ となり矛盾。
:::

::: problem ★★ 標準：平面性と補グラフ {#graph:ex-pl-complement}
$n\ge11$ 頂点のグラフ $G$ について、$G$ と補グラフ $\overline{G}$ の少なくとも一方は平面的でないことを示せ。
:::

::: solution
両方が平面的なら、\ref{graph:planar-edge-bound} の 1 から $\norm{G}+\norm{\overline{G}}\le2(3n-6)$。一方、$\norm{G}+\norm{\overline{G}}=\binom{n}{2}$。$\binom{n}{2}\le6n-12$ は $n^{2}-13n+24\le0$ と同値で、その解は $n\le\frac{13+\sqrt{73}}{2}<10.8$。よって $n\ge11$ では成り立たない。
:::

## 面の境界 {#graph:sec-fb-exercises}

対応するページ：\ref{graph:page-face-boundaries}

::: problem ★ 基本：三角形の面だけの平面グラフ {#graph:ex-fb-triangulation}
$n\ge3$ 頂点の連結な平面グラフで、すべての面の次数が 3 なら $m=3n-6$ であることを示せ。
:::

::: solution
各辺の両側は合わせて 2 回数えられるので $\sum_{F}d(F)=2m$（\ref{graph:face-degree}）。すべての面の次数が 3 なら $3f=2m$。オイラーの公式（\ref{graph:euler-formula}、連結なので $n-m+f=2$）に代入して $n-m+\frac{2m}{3}=2$、$m=3n-6$。
:::

::: problem ★ 基本：車輪の面 {#graph:ex-fb-wheel-faces}
車輪 $W_{n}$（$n\ge3$）を、中心を円の中心に、閉路を円周に置いて描く。面を列挙し、オイラーの公式を確かめよ。
:::

::: solution
内側の面は、中心 $z$ と閉路の隣り合う 2 頂点 $c_{i},c_{i+1}$ を結ぶ三角形 $n$ 個、外側の面は閉路 $C_{n}$ で囲まれた 1 個。$f=n+1$、頂点 $n+1$、辺 $2n$（閉路 $n$ 本、スポーク $n$ 本）で、$(n+1)-2n+(n+1)=2$。$W_{n}$ は 3 連結（\ref{graph:prob-fb-wheel}）なので、面の境界はどれも閉路である（\ref{graph:faces-bounded-by-cycles}）。
:::

## クラトフスキーの定理 {#graph:sec-ku-exercises}

対応するページ：\ref{graph:page-kuratowski}

::: problem ★ 基本：$K_{2,n}$ は平面的 {#graph:ex-ku-k2n}
$K_{2,n}$ が $K^{5}$ の細分も $K_{3,3}$ の細分も含まないことを、次数を数えて示せ。したがって平面的である。
:::

::: solution
細分 $TX\subseteq G$ の分岐点は、$G$ で $X$ での次数以上の次数をもつ。$TK^{5}$ には次数 4 の分岐点が 5 個、$TK_{3,3}$ には次数 3 の分岐点が 6 個必要だが、$K_{2,n}$ で次数 3 以上の頂点は 2 点側の 2 個だけ（$n$ 点側の次数は 2）。よって含まず、\ref{graph:kuratowski} により平面的。
:::

::: problem ★ 基本：頂点の少ないグラフ {#graph:ex-ku-small}
頂点が 4 個以下のグラフは平面的であり、5 頂点のグラフは $K^{5}$ でなければ平面的であることを示せ。
:::

::: solution
$TK_{3,3}$ は 6 個以上の頂点を、$TK^{5}$ は 5 個以上の頂点を必要とする。頂点が 5 個なら $TK^{5}$ は細分の点を含みえず $K^{5}$ そのもので、それは $G=K^{5}$ を意味する。\ref{graph:kuratowski} から結論を得る。
:::

## 平面グラフの閉路空間 {#graph:sec-du-exercises}

対応するページ：\ref{graph:page-plane-duality}

::: problem ★ 基本：$K^{4}$ の面の縁 {#graph:ex-du-k4}
$K^{4}$ を、三角形 $abc$ の内部に $d$ を置いて描く。3 つの有界な面の縁が閉路空間の基底になることを確かめ、外側の三角形 $abc$ をそれらの和として表せ。
:::

::: solution
有界な面は三角形 $abd$, $bcd$, $cad$ で、$m-n+1=6-4+1=3$ 個（\ref{graph:plane-cycle-space}）。3 つの和（辺集合の対称差）では、辺 $ad,bd,cd$ はそれぞれ 2 回現れて消え、$ab,bc,ca$ が 1 回ずつ残るので、和は外側の三角形 $abc$ に等しい。
:::

::: problem ★ 基本：木の面 {#graph:ex-du-tree-face}
$n$ 頂点の木を平面に描くと、面はちょうど 1 つであることをオイラーの公式から示せ。
:::

::: solution
木は連結で辺は $n-1$ 本なので、\ref{graph:euler-formula} から $n-(n-1)+f=2$、$f=1$。
:::
