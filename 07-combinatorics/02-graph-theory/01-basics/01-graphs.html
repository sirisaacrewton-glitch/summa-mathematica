# グラフと次数・道・閉路・連結性 {#graph:page-graphs keywords="graph, degree, handshake lemma, path, cycle, girth, diameter, connectivity, edge-connectivity, Mader's theorem"}

グラフは、点（頂点）と、二点を結ぶ線（辺）だけからなる最も単純な組合せ構造である。このページでは、グラフ理論の基本的な言葉を定義し、局所的な量（次数）と大域的な量（辺の数・道や閉路の長さ・直径・連結度）の間の基本的な不等式を示す。最後に、平均次数が大きいグラフは高い連結度をもつ部分グラフを含むというメーダーの定理を証明する。

## 記法と定義の確認 {#graph:sec-gr-notation}

::: notation
- 体系は $\ZF$。グラフはすべて有限とする（無限グラフは \ref[無限グラフの基本]{graph:page-infinite-graphs} で扱う）。
- 有限集合 $V$ の 2 元部分集合全体を $\mathcal{P}_{2}(V)$ と書く（\ref{comb:binomial-coefficient}）。二重数え上げ（\ref{comb:double-counting}）を断らずに使う。
- 実数 $x$ について $\lfloor x\rfloor$ は $x$ 以下の最大の整数。
:::

## グラフと次数 {#graph:sec-gr-degree}

::: definition グラフ {#graph:graph keywords="graph, simple graph, vertex, edge, adjacent, incident, order, size, subgraph, induced subgraph, isomorphism" index="グラフ|ぐらふ, 頂点|ちょうてん, 辺|へん, 隣接|りんせつ, 部分グラフ|ぶぶんぐらふ, 誘導部分グラフ|ゆうどうぶぶんぐらふ, 同型（グラフの）|どうけい"}
**グラフ** $G=(V,E)$ とは、有限集合 $V$ と $E\subseteq\mathcal{P}_{2}(V)$ の組である。$V=V(G)$ の元を**頂点**、$E=E(G)$ の元を**辺**という。辺 $\{x,y\}$ を $xy$ と書き、$x,y$ をその**端点**、$x$ と $y$ は**隣接**するという。$\abs{G}\defeq\abs{V}$ を**位数**、$\norm{G}\defeq\abs{E}$ を辺の数と書く。
- $G'=(V',E')$ が $V'\subseteq V$, $E'\subseteq E$ を満たすとき $G'$ を $G$ の**部分グラフ**といい $G'\subseteq G$ と書く。$E'=E\cap\mathcal{P}_{2}(V')$ のとき $G[V']$ と書き、**誘導部分グラフ**という。$G-U\defeq G[V\setminus U]$、$G-F\defeq(V,E\setminus F)$。
- 全単射 $\varphi\colon V\to V'$ が $xy\in E\iff\varphi(x)\varphi(y)\in E'$ を満たすとき、$G$ と $G'$ は**同型**という。
- 頂点が $n$ 個ですべての対が辺のグラフを**完全グラフ** $K^{n}$ という。
:::

::: intuition
グラフは「どの二点が結ばれているか」だけを記録した図である。点の位置や線の形は問題にしない。ここでは同じ二点を結ぶ複数の辺や、一点から自分自身への辺（ループ）は考えない。
:::

::: definition 近傍と次数 {#graph:degree keywords="neighbourhood, degree, minimum degree, maximum degree, average degree, regular graph" index="次数|じすう, 近傍|きんぼう, 最小次数|さいしょうじすう, 平均次数|へいきんじすう, 正則グラフ|せいそくぐらふ"}
頂点 $v$ に隣接する頂点全体を $N(v)$（**近傍**）、$d(v)\defeq\abs{N(v)}$ を $v$ の**次数**という。$\delta(G)\defeq\min_{v}d(v)$（**最小次数**）、$\Delta(G)\defeq\max_{v}d(v)$（**最大次数**）、$d(G)\defeq\frac{1}{\abs{G}}\sum_{v}d(v)$（**平均次数**）、$\varepsilon(G)\defeq\norm{G}/\abs{G}$ とおく（$V\neq\varnothing$）。すべての頂点の次数が $k$ のとき $G$ は **$k$ 正則**であるという。
:::

::: intuition
次数は一つの頂点から出ている辺の数で、平均次数はその平均である。
:::

::: proposition 握手補題 {#graph:handshake keywords="handshake lemma, sum of degrees" index="握手補題|あくしゅほだい" refname="握手補題"}
$\sum_{v\in V}d(v)=2\norm{G}$。したがって $\varepsilon(G)=d(G)/2$ であり、次数が奇数の頂点は偶数個ある。
:::

::: intuition
全員が握手した回数を合計すると、握手の総数のちょうど 2 倍になる（1 回の握手は 2 人に数えられる）。
:::

::: proof
組 $(v,e)$, $v\in e\in E$ を二通りに数える（\ref{comb:double-counting}）。$v$ ごとには $d(v)$ 個、$e$ ごとには 2 個。後半は、$\sum d(v)$ が偶数なので、奇数の項の個数も偶数であることによる。
:::

::: proposition 次数の大きい部分グラフ {#graph:dense-subgraph keywords="subgraph with large minimum degree" index="最小次数の大きい部分グラフ|さいしょうじすうのおおきいぶぶんぐらふ"}
辺をもつグラフ $G$ は、$\delta(H)>\varepsilon(H)\ge\varepsilon(G)$ を満たす部分グラフ $H$ をもつ。
:::

::: intuition
平均すると次数が大きいグラフからは、次数の小さい頂点を一つずつ取り除いていくことで、すべての頂点の次数が大きい部分を取り出せる。
:::

::: proof
**Step 1（取り除いても ε は減らない）.** 【主張：$d(v)\le\varepsilon(G')$ となる頂点 $v$ を $G'$ から除くと $\varepsilon(G'-v)\ge\varepsilon(G')$】$G'$ の位数を $n\ge2$、辺の数を $m$ とすると、$\varepsilon(G'-v)=\frac{m-d(v)}{n-1}\ge\frac{m-m/n}{n-1}=\frac mn$。

**Step 2（列を作る）.** $G_{0}\defeq G$ とし、$G_{i}$ に $d(v_{i})\le\varepsilon(G_{i})$ となる頂点があればそれを除いて $G_{i+1}$ とし、なければ止めて $H\defeq G_{i}$ とする。Step 1 より $\varepsilon(G_{i})$ は減らないので $\varepsilon(H)\ge\varepsilon(G)>0$。

**Step 3（$H$ は空でない）.** 【主張：止まった時点で $H$ は 2 頂点以上】1 頂点のグラフは $\varepsilon=0<\varepsilon(G)$ なので、列に 1 頂点のグラフは現れない（Step 2 で $\varepsilon$ は $\varepsilon(G)$ 以上）。よって列は 2 頂点以上の段階で止まり、止まった理由から $H$ のすべての頂点で $d(v)>\varepsilon(H)$、すなわち $\delta(H)>\varepsilon(H)$。
:::

## 道・閉路・距離 {#graph:sec-gr-paths}

::: definition 道・閉路・歩道 {#graph:path-cycle keywords="path, cycle, walk, length, girth, circumference" index="道（グラフの）|みち, 閉路|へいろ, 歩道|ほどう, 内周|ないしゅう, 周長|しゅうちょう"}
相異なる頂点 $x_{0},\dots,x_{k}$ と辺 $x_{0}x_{1},\dots,x_{k-1}x_{k}$ からなるグラフを、$x_{0}$ と $x_{k}$ を結ぶ長さ $k$ の**道**といい $x_{0}\dots x_{k}$ と書く。$k\ge3$ のとき道に辺 $x_{k}x_{0}$ を加えたものを長さ $k$ の**閉路**という。$G$ に含まれる閉路の長さの最小値を**内周** $g(G)$（閉路がなければ $\infty$）という。頂点と辺の交互の列 $v_{0}e_{0}v_{1}\dots e_{k-1}v_{k}$（$e_{i}=v_{i}v_{i+1}$）を長さ $k$ の**歩道**という（頂点の重複を許す）。
:::

::: intuition
道は同じ点を二度通らない経路、閉路は出発点に戻る道、歩道は同じ点を何度通ってもよい経路である。
:::

::: proposition 歩道から道を取り出す {#graph:walk-contains-path keywords="every walk contains a path between its ends"}
$u$ から $v$ への歩道があれば、$u$ と $v$ を結ぶ道で、頂点が歩道の頂点に含まれるものがある。
:::

::: proof
長さの最小な $u$–$v$ 歩道 $v_{0}\dots v_{k}$ をとる。$v_{i}=v_{j}$（$i<j$）なら、$v_{i+1},\dots,v_{j}$ を飛ばした歩道 $v_{0}\dots v_{i}v_{j+1}\dots v_{k}$ はより短いので矛盾。よって頂点は相異なり、これは道である。
:::

::: proposition 最小次数と長い道・閉路 {#graph:long-path-cycle keywords="minimum degree forces long paths and cycles" index="長い道|ながいみち"}
グラフ $G$（頂点がある）は長さ $\delta(G)$ の道を含み、$\delta(G)\ge2$ なら長さ $\delta(G)+1$ 以上の閉路を含む。
:::

::: proof
**Step 1（最長の道）.** 【主張：最長の道 $x_{0}\dots x_{k}$ の端点 $x_{k}$ の近傍はすべてこの道の上にある】近傍 $y$ が道の上になければ、$x_{0}\dots x_{k}y$ はより長い道で矛盾。

**Step 2.** Step 1 より $N(x_{k})\subseteq\{x_{0},\dots,x_{k-1}\}$ なので $k\ge d(x_{k})\ge\delta(G)$。$\delta(G)\ge2$ のとき、$x_{i}x_{k}\in E$ となる最小の $i$ をとると、$N(x_{k})\subseteq\{x_{i},\dots,x_{k-1}\}$ より $k-i\ge\delta(G)$ で、$x_{i}\dots x_{k}x_{i}$ は長さ $k-i+1\ge\delta(G)+1$ の閉路である（$k-i\ge2$ なので長さは 3 以上）。
:::

::: definition 距離・直径・半径 {#graph:distance keywords="distance, diameter, radius, central vertex" index="距離（グラフの）|きょり, 直径|ちょっけい, 半径|はんけい"}
$x,y$ を結ぶ最短の道の長さを**距離** $d(x,y)$（なければ $\infty$）という。$\operatorname{diam}G\defeq\max_{x,y}d(x,y)$ を**直径**、$\operatorname{rad}G\defeq\min_{x}\max_{y}d(x,y)$ を**半径**という。
:::

::: intuition
直径はいちばん離れた 2 点の間の道のりで、半径は「中心」からいちばん遠い点までの道のりである。
:::

::: proposition 内周と直径・頂点数の評価 {#graph:girth-diameter keywords="girth at most 2 diam + 1, Moore bound" index="ムーアの限界|むーあのげんかい"}
1. 閉路を含むグラフでは $g(G)\le2\operatorname{diam}G+1$。
2. 半径が $k$ 以下で最大次数が $d\ge3$ 以下の連結グラフの位数は $\frac{d}{d-2}(d-1)^{k}$ 未満である。
:::

::: proof
**Step 1（(1)、設定）.** 【主張：$g\defeq g(G)\ge2D+2$（$D\defeq\operatorname{diam}G$）と仮定すると、最短の閉路 $C$ の上に、$C$ の中での距離 $d_{C}(x,y)$ が $D+1$ の 2 頂点 $x,y$ がある】$C$ の上で $x$ から $D+1$ 歩進んだ頂点を $y$ とすると、$C$ の二つの弧の長さは $D+1$ と $g-D-1\ge D+1$ なので $d_{C}(x,y)=D+1$。

**Step 2（(1)、$C$ を離れる部分道）.** 【主張：$G$ での最短の $x$–$y$ 道 $P$ は、端点だけが $C$ 上にあり $C$ の辺でない部分道 $Q$（長さ $\ell\ge1$）を含む】$P$ の長さは $\le D<D+1$ なので、$P$ は $C$ に含まれない（$C$ の中の $x$–$y$ 道は長さ $\ge d_{C}(x,y)$）。$P$ を $x$ から進み、$C$ にない辺か $C$ にない頂点に初めて入る直前の頂点を $u$ とし、そこから次に $C$ の頂点に着くまでの部分を $Q$ とする（$P$ の終点 $y$ は $C$ 上なので必ず着く）。

**Step 3（(1)、短い閉路）.** 【主張：$Q$ と $C$ の弧を合わせて $C$ より短い閉路ができる】$Q$ の端点 $u,u'$ を結ぶ $C$ の二つの弧のうち短い方を $A$ とすると $\abs{A}\le g/2$。$Q$ の内部の頂点は $C$ になく、$Q$ が 1 辺なら $C$ の辺でないので、$Q\cup A$ は閉路で、長さは $\ell+\abs{A}\le D+g/2<g$（$g\ge2D+2>2D$ より）。$C$ の最小性に反する。

**Step 4（(2)）.** 中心 $z$（$\max_{y}d(z,y)=\operatorname{rad}G$）をとり、$D_{i}\defeq\{v : d(z,v)=i\}$ とする。連結で半径 $\le k$ なので $V=\bigcup_{i\le k}D_{i}$。$\abs{D_{0}}=1$, $\abs{D_{1}}\le d$ で、$i\ge1$ なら $D_{i+1}$ の各頂点は $D_{i}$ に隣接する頂点をもち、$D_{i}$ の各頂点は $D_{i-1}$ の頂点と少なくとも一つ隣接するので $D_{i+1}$ の隣接頂点は高々 $d-1$ 個。よって $\abs{D_{i+1}}\le(d-1)\abs{D_{i}}$ で
$$
\abs{G}\le1+d\sum_{i=0}^{k-1}(d-1)^{i}=1+\frac{d}{d-2}\bigl((d-1)^{k}-1\bigr)<\frac{d}{d-2}(d-1)^{k}.
$$
:::

## 連結性と連結度 {#graph:sec-gr-connectivity}

::: definition 連結・連結成分・連結度 {#graph:connectivity keywords="connected graph, component, cut vertex, bridge, k-connected, connectivity, edge-connectivity" index="連結（グラフの）|れんけつ, 連結成分|れんけつせいぶん, 連結度|れんけつど, 辺連結度|へんれんけつど, k 連結|けいれんけつ, 切断点|せつだんてん, 橋|はし"}
$G$ が空でなく、任意の 2 頂点が道で結ばれるとき**連結**という。極大な連結部分グラフを**連結成分**という。$\abs{G}>k$ で、$\abs{X}<k$ のどの $X\subseteq V$ についても $G-X$ が連結のとき **$k$ 連結**といい、そのような最大の $k$ を**連結度** $\kappa(G)$ という。$\abs{G}>1$ で、$\abs{F}<\ell$ のどの $F\subseteq E$ についても $G-F$ が連結のとき **$\ell$ 辺連結**といい、最大の $\ell$ を**辺連結度** $\lambda(G)$ という。
:::

::: intuition
$k$ 連結とは、どの $k-1$ 個の頂点を壊してもつながったままであること。辺連結度は、つながりを断つのに切らなければならない辺の最小数である。
:::

::: proposition 連結成分による分割 {#graph:components-partition keywords="components partition the vertex set"}
「$x$ と $y$ が道で結ばれる」（$x=y$ を含む）は $V$ 上の同値関係で、その同値類 $C$ ごとの誘導部分グラフ $G[C]$ がちょうど連結成分である。
:::

::: proof
反射律・対称律は明らか。推移律：$x$–$y$ 道と $y$–$z$ 道をつなげた歩道から \ref{graph:walk-contains-path} で $x$–$z$ 道が得られる。同値類 $C$ について $G[C]$ は連結（$C$ 内の 2 点を結ぶ道の頂点はすべて $C$ に入る）で、$C$ の外の頂点を含む連結部分グラフは $C$ の点と外の点を結ぶ道を含むので存在せず、極大である。逆に連結部分グラフの頂点は一つの同値類に入る。
:::

::: proposition 連結度の不等式 {#graph:kappa-lambda-delta keywords="kappa <= lambda <= delta" index="連結度と辺連結度の不等式|れんけつどとへんれんけつどのふとうしき"}
$\abs{G}\ge2$ なら $\kappa(G)\le\lambda(G)\le\delta(G)$。
:::

::: proof
**Step 1（$\lambda\le\delta$）.** 次数最小の頂点 $v$ の $d(v)$ 本の辺を除くと $v$ は孤立し、$\abs{G}\ge2$ なので非連結になる。

**Step 2（準備）.** $G$ が非連結なら $\kappa=\lambda=0$。連結とし、$G-F$ が非連結になる $\abs{F}=\lambda(G)$ の辺集合 $F$ をとる。$F$ は極小なので、各辺 $e\in F$ の両端は $G-F$ の異なる連結成分に入る（同じ成分なら $e$ を戻しても非連結のまま）。

**Step 3（$F$ に接しない頂点がある場合）.** 【主張：$\kappa\le\abs{F}$】$v$ を $F$ のどの辺の端点でもない頂点、$C$ を $G-F$ での $v$ の成分とする。$C$ の頂点で $F$ の辺に接するもの全体 $X$ は、各辺に高々 1 個なので $\abs{X}\le\abs{F}$。$v\notin X$ で、$G-F$ は非連結なので $C$ の外に頂点がある。$G-X$ では、$C\setminus X$ から外への辺は $F$ の辺だけで、その $C$ 側の端点は $X$ に入っているので除かれている。よって $X$ は $v$ と $C$ の外を分離し、$\kappa\le\abs{X}\le\abs{F}$。

**Step 4（すべての頂点が $F$ に接する場合）.** 【主張：$\kappa\le\abs{F}$】任意の頂点 $v$ とその成分 $C$ をとる。$v$ の近傍 $w$ のうち $vw\notin F$ のものは $C$ にあり、$w$ は $F$ の辺に接するが、その辺は Step 2 より $v$ には接しない。各 $w$ に一本ずつ、相異なる $F$ の辺が対応し（辺の $C$ 側の端点が $w$）、$vw\in F$ の近傍とも重ならないので $d(v)\le\abs{F}$。$\{v\}\cup N(v)\neq V$ となる $v$ があれば $N(v)$ が $v$ と残りを分離し $\kappa\le d(v)\le\abs{F}$。すべての $v$ で $\{v\}\cup N(v)=V$ なら $G$ は完全グラフで、$\kappa=\abs{G}-1=\delta=\lambda$。
:::

::: theorem メーダーの定理 {#graph:mader keywords="Mader's theorem, average degree forces highly connected subgraph" index="メーダーの定理|めーだーのていり" refname="メーダーの定理"}
$k\ge1$ とする。平均次数 $d(G)\ge4k$ のグラフ $G$ は、$\varepsilon(H)>\varepsilon(G)-k$ を満たす $(k+1)$ 連結な部分グラフ $H$ をもつ。
:::

::: intuition
辺が平均的に十分多いグラフには、簡単には切り離せない（$k$ 個の頂点を除いても連結な）部分がどこかにある。
:::

::: proof
$\gamma\defeq\varepsilon(G)\ge2k$（\ref{graph:handshake}）とし、部分グラフ $G'\subseteq G$ についての条件

　(∗)　$\abs{G'}\ge2k$ かつ $\norm{G'}>\gamma(\abs{G'}-k)$

を考える。$G$ 自身は $\norm{G}=\gamma\abs{G}>\gamma(\abs{G}-k)$ と $\abs{G}\ge d(G)+1>2k$ から (∗) を満たす。(∗) を満たす部分グラフのうち位数最小のものを $H$ とする。

**Step 1（位数 $2k$ は不可能）.** 【主張：$\abs{H}>2k$】$\abs{G'}=2k$ で (∗) なら $\norm{G'}>\gamma k\ge2k^{2}>\binom{2k}{2}$ となり、$2k$ 頂点のグラフの辺の数の上限を超える。

**Step 2（最小次数）.** 【主張：$\delta(H)>\gamma$】$d_{H}(v)\le\gamma$ の頂点 $v$ があれば、$H-v$ は位数 $\abs{H}-1\ge2k$（Step 1）で $\norm{H-v}\ge\norm{H}-\gamma>\gamma(\abs{H-v}-k)$ となり (∗) を満たし、最小性に反する。

**Step 3（$\varepsilon(H)$ の評価）.** $\norm{H}>\gamma\abs{H}-\gamma k$ を $\abs{H}$ で割り、$\abs{H}>\delta(H)>\gamma$ を使うと $\varepsilon(H)>\gamma-\gamma k/\abs{H}>\gamma-k$。

**Step 4（$(k+1)$ 連結性）.** 【主張：$H$ が $(k+1)$ 連結でないと矛盾】$\abs{H}>2k\ge k+1$ なので、$(k+1)$ 連結でなければ、$\abs{X}\le k$ で $H-X$ が非連結となる $X$ がある。$H-X$ の一つの連結成分の頂点集合を $C$ とし、$U_{1}\defeq C\cup X$, $U_{2}\defeq V(H)\setminus C$ とおくと、$U_{1}\cap U_{2}=X$ で、$U_{1}\setminus U_{2}$ と $U_{2}\setminus U_{1}$ の間に辺はない。$H_{i}\defeq H[U_{i}]$ とする。$v\in U_{1}\setminus U_{2}$ の近傍はすべて $U_{1}$ にあるので $\abs{H_{1}}>\delta(H)>\gamma\ge2k$、同様に $\abs{H_{2}}>2k$。$H_{i}$ は $H$ より位数が小さいので (∗) を満たさず、$\norm{H_{i}}\le\gamma(\abs{H_{i}}-k)$。$H$ の辺は $H_{1}$ か $H_{2}$ に入るので
$$
\norm{H}\le\norm{H_{1}}+\norm{H_{2}}\le\gamma(\abs{H_{1}}+\abs{H_{2}}-2k)\le\gamma(\abs{H}+k-2k)=\gamma(\abs{H}-k),
$$
ここで $\abs{H_{1}}+\abs{H_{2}}=\abs{H}+\abs{X}\le\abs{H}+k$ を使った。これは (∗) に反する。

::: hypcheck
- **$d(G)\ge4k$**：$\gamma\ge2k$ として Step 1（$\gamma k\ge2k^{2}$）と Step 4（$\abs{H_{i}}>2k$）に使った。
- **$k\ge1$**：Step 1 の $2k^{2}>\binom{2k}{2}=k(2k-1)$ に使った。
:::
:::

::: supplement
**類似の定理.** 平均次数が大きいと大きな完全グラフのマイナーを含む（\ref[縮約とマイナー]{graph:page-minors}）。最小次数と内周を同時に大きくできることは確率的方法で示される（\ref[確率的方法]{comb:page-probabilistic-method}）。
:::

## 問題 {#graph:sec-gr-problems}

::: problem {#graph:prob-gr-radius-diameter}
連結グラフについて $\operatorname{rad}G\le\operatorname{diam}G\le2\operatorname{rad}G$ を示せ。
:::

::: solution
前半は定義から（最大値の最小値は最大値の最大値以下）。後半：中心 $z$ をとると、任意の $x,y$ について $x$–$z$ 道と $z$–$y$ 道をつないだ歩道から（\ref{graph:walk-contains-path}）$d(x,y)\le d(x,z)+d(z,y)\le2\operatorname{rad}G$。
:::

::: problem {#graph:prob-gr-connected-edges}
$n$ 頂点の連結グラフの辺は $n-1$ 本以上であることを示せ。
:::

::: solution
$n$ の帰納法。$n=1$ は明らか。$n\ge2$ で、次数 1 の頂点 $v$ があれば $G-v$ は連結（$v$ を通る道は $v$ を端点にもつ）なので、帰納法の仮定から $\norm{G}=\norm{G-v}+1\ge n-1$。すべての次数が 2 以上なら（連結で $n\ge2$ なので次数 0 はない）\ref{graph:handshake} より $\norm{G}\ge n$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{graph:sec-gr-exercises} にまとめた。
