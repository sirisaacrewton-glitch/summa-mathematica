# 閉路空間とカット空間 {#graph:page-cycle-space keywords="edge space, cycle space, cut space, bond, fundamental cycle, fundamental cut, cyclomatic number, incidence matrix"}

グラフの辺の部分集合を 2 元体 $\mathbb{F}_{2}$ 上のベクトルとみなすと、閉路の辺集合が張る部分空間（**閉路空間**）と、頂点の分割を横切る辺の集合（**カット**）が張る部分空間（**カット空間**）が、標準的な内積について互いの直交補空間になる。このページではこの事実を示し、全域木（森）による基底と次元 $\dim\mathcal{C}=m-n+c$ を求める。これは平面グラフの双対や、マックレーンの平面性の判定（\ref[平面双対と代数的な平面性の判定]{graph:page-plane-duality}）の基礎になる。

## 記法と定義の確認 {#graph:sec-cs-notation}

::: notation
- $G=(V,E)$ は $n$ 頂点・$m$ 辺・$c$ 個の連結成分をもつグラフ。木・全域木・葉は \ref{graph:page-trees-bipartite} のとおり。
- $\mathbb{F}_{2}=\{0,1\}$ は 2 元体。有限次元ベクトル空間・基底・次元は \ref{lin:page-spaces-bases} の意味で、非退化な対称双線形形式について $\dim W^{\perp}=\dim V-\dim W$、$(W^{\perp})^{\perp}=W$（\ref{lin:orthogonal-complement.1}）。
- 頂点 $v$ に接する辺全体を $E(v)$、$V_{1},V_{2}\subseteq V$ の間の辺全体を $E(V_{1},V_{2})$ と書く。
:::

## 辺空間と閉路空間 {#graph:sec-cs-cycle-space}

::: definition 辺空間・閉路空間 {#graph:edge-space keywords="edge space, cycle space, cyclomatic number" index="辺空間|へんくうかん, 閉路空間|へいろくうかん, 巡回数|じゅんかいすう"}
$E$ から $\mathbb{F}_{2}$ への写像全体を**辺空間** $\mathcal{E}(G)$ という。$F\subseteq E$ をその特性関数と同一視すると、和は対称差 $F+F'=F\mathbin{\triangle}F'$ で、$\{\{e\} : e\in E\}$ が基底、$\dim\mathcal{E}(G)=m$。内積 $\langle F,F'\rangle\defeq\sum_{e}F(e)F'(e)$（$=\abs{F\cap F'}\bmod2$）は対称で非退化である（標準基底について単位行列）。閉路の辺集合全体が張る部分空間を**閉路空間** $\mathcal{C}(G)$ といい、その次元を**巡回数**という。
:::

::: intuition
辺の集合を「足し算」するとは、両方に入っている辺を消して合わせることである。閉路空間は閉路を何個か重ねて得られる辺集合の全体である。
:::

::: proposition 閉路空間の特徴づけ {#graph:cycle-space-characterization keywords="cycle space = edge sets with all degrees even = disjoint unions of cycles" index="偶グラフ|ぐうぐらふ"}
$D\subseteq E$ について次は同値である。
1. $D\in\mathcal{C}(G)$。
2. $D$ は、辺を共有しない閉路の辺集合の（空でもよい）和である。
3. グラフ $(V,D)$ のすべての頂点の次数は偶数である。
:::

::: proof
**Step 1（(1)⇒(3)）.** 閉路の各頂点の次数は 0 か 2。対称差では頂点 $v$ の次数が $\abs{D(v)\triangle D'(v)}=\abs{D(v)}+\abs{D'(v)}-2\abs{D(v)\cap D'(v)}$ となり偶奇は保たれるので、閉路の有限個の和でも次数は偶数。

**Step 2（(3)⇒(2)）.** 【主張：次数がすべて偶数で $D\neq\varnothing$ なら $(V,D)$ は閉路を含む】$D$ の辺に接する頂点だけからなる部分グラフは最小次数 $\ge2$ なので閉路をもつ（\ref{graph:long-path-cycle}）。その閉路の辺を $D$ から除いても次数はすべて偶数なので、$\abs{D}$ の帰納法で (2) を得る。

**Step 3（(2)⇒(1)）.** 辺を共有しない集合の和は対称差の和に等しい。
:::

## カット空間 {#graph:sec-cs-cut-space}

::: definition カットと結合 {#graph:cut keywords="cut, cut space, bond, minimal cut" index="カット（グラフの）|かっと, カット空間|かっとくうかん, 結合（グラフの）|けつごう, ボンド|ぼんど"}
$V$ の分割 $V=V_{1}\sqcup V_{2}$（$V_{1},V_{2}\neq\varnothing$）について $E(V_{1},V_{2})$ を**カット**という。カットと $\varnothing$ の全体を $\mathcal{B}(G)$ と書く。空でない極小なカットを**結合**という。
:::

::: intuition
頂点を二つのグループに分けたとき、グループをまたぐ辺の集まりがカットである。カットの辺を全部切ると二つのグループは切り離される。
:::

::: proposition カット空間 {#graph:cut-space keywords="cuts form a subspace generated by vertex stars" index="カット空間の生成|かっとくうかんのせいせい"}
$\mathcal{B}(G)$ は $\mathcal{E}(G)$ の部分空間で、$E(v)$（$v\in V$）で生成される。
:::

::: proof
**Step 1.** 【主張：$U\subseteq V$ について $\sum_{u\in U}E(u)=E(U,V\setminus U)$】辺 $xy$ がこの和に現れる回数は $\abs{\{x,y\}\cap U}$ で、それが奇数（$=1$）であることは $xy$ が $U$ と $V\setminus U$ をまたぐことと同値。

**Step 2.** Step 1 より、カット $E(V_{1},V_{2})=\sum_{v\in V_{1}}E(v)$ は $E(v)$ の張る空間に入り、逆に $E(v)$ の和はどれも $E(U,V\setminus U)$ の形で、$U\neq\varnothing,V$ ならカット、$U=\varnothing$ または $U=V$ なら $\varnothing$ である。よって $E(v)$ の張る空間は $\mathcal{B}(G)$ に等しく、部分空間である。
:::

## 基本閉路と基本カット {#graph:sec-cs-fundamental}

$G$ の各連結成分の全域木（\ref{graph:spanning-tree}）の和を $T$（**全域森**）とする。$T$ の辺は $n-c$ 本である（\ref{graph:prob-tb-forest-edges}）。

::: definition 基本閉路と基本カット {#graph:fundamental-cycles-cuts keywords="fundamental cycle, fundamental cut with respect to a spanning forest" index="基本閉路|きほんへいろ, 基本カット|きほんかっと"}
$e\in E\setminus E(T)$ に対し、$T+e$ に含まれるただ一つの閉路（\ref{graph:tree-characterization}：$e$ の両端を結ぶ $T$ の道に $e$ を加えたもの）を**基本閉路** $C_{e}$ という。$f\in E(T)$ に対し、$T-f$ で $f$ の含まれていた成分は二つに分かれる。その一方の頂点集合を $U_{f}$ として、$D_{f}\defeq E(U_{f},V\setminus U_{f})$ を**基本カット**という。
:::

::: intuition
木に一本辺を足すとちょうど一つ閉路ができ、木から一本辺を抜くとちょうど二つに分かれる。それぞれが基本閉路と基本カットである。
:::

::: theorem 閉路空間とカット空間の基底と直交性 {#graph:cycle-cut-duality keywords="dim C = m - n + c, dim B = n - c, C = B^perp" index="閉路空間とカット空間の直交性|へいろくうかんとかっとくうかんのちょっこうせい" refname="閉路空間とカット空間の双対性"}
1. 基本閉路 $C_{e}$（$e\notin T$）は $\mathcal{C}(G)$ の基底、基本カット $D_{f}$（$f\in T$）は $\mathcal{B}(G)$ の基底である。したがって $\dim\mathcal{C}(G)=m-n+c$、$\dim\mathcal{B}(G)=n-c$。
2. $\mathcal{C}(G)=\mathcal{B}(G)^{\perp}$、$\mathcal{B}(G)=\mathcal{C}(G)^{\perp}$。
:::

::: intuition
閉路の空間とカットの空間は、辺の空間をちょうど半分ずつ分け合うような関係にある：閉路はどのカットとも偶数本の辺を共有し、その性質で閉路の空間が特徴づけられる。
:::

::: proof
**Step 1（一次独立）.** 【主張：$e\notin T$ は $C_{e}$ にだけ含まれ、$f\in T$ は $D_{f}$ にだけ含まれる】$C_{e}$ の $T$ 以外の辺は $e$ だけ。$D_{f}$ の $T$ の辺は $f$ だけ（$T-f$ の各部分は $T$ の辺で連結なので、他の $T$ の辺は分割をまたがない）。したがって $\sum_{e\in S}C_{e}=\varnothing$ なら、各 $e\in S$ は和の中にちょうど 1 回現れるので $S=\varnothing$。$D_{f}$ も同様。

**Step 2（閉路空間を張る）.** 【主張：$D\in\mathcal{C}$ なら $D=\sum_{e\in D\setminus T}C_{e}$】$D'\defeq D+\sum_{e\in D\setminus T}C_{e}$ は $\mathcal{C}$ の元で、Step 1 より $T$ の外の辺をもたない。$D'\neq\varnothing$ なら \ref{graph:cycle-space-characterization} より $D'$（$\subseteq E(T)$）は閉路を含み、森 $T$ に矛盾。

**Step 3（カット空間を張る）.** 【主張：$D\in\mathcal{B}$ なら $D=\sum_{f\in D\cap T}D_{f}$】$D'\defeq D+\sum_{f\in D\cap T}D_{f}\in\mathcal{B}$ は $T$ の辺を含まない。$D'=E(U,V\setminus U)$ が空でなければ、その辺 $xy$ は $T$ の同じ成分に属する $x\in U$, $y\notin U$ を結ぶので、$T$ の $x$–$y$ 道のどこかの辺が $U$ をまたぎ $D'$ に入るが、それは $T$ の辺で矛盾。次元は基底の個数 $m-(n-c)$ と $n-c$。

**Step 4（直交性）.** 【主張：$\mathcal{C}\subseteq\mathcal{B}^{\perp}$】閉路 $x_{0}\dots x_{k}x_{0}$ がカット $E(U,V\setminus U)$ をまたぐたびに側が入れ替わり、出発点に戻るので、またぐ回数は偶数。双線形性から $\mathcal{C}$ と $\mathcal{B}$ の元はすべて直交する。

**Step 5（等号）.** \ref{lin:orthogonal-complement.1} より $\dim\mathcal{B}^{\perp}=m-(n-c)=\dim\mathcal{C}$ なので、Step 4 の包含は等号。$\mathcal{B}=(\mathcal{B}^{\perp})^{\perp}=\mathcal{C}^{\perp}$。
:::

::: proposition 結合への分解 {#graph:cut-disjoint-bonds keywords="every cut is a disjoint union of bonds" index="結合への分解|けつごうへのぶんかい"}
すべてのカットは、互いに交わらない結合の和である。
:::

::: proof
$\abs{F}$ の帰納法。$F=\varnothing$ なら空の和。$F$ が結合でなければ、$F$ に真に含まれる空でないカット $F'$ があり、$F\setminus F'=F+F'$ も $\mathcal{B}$ の空でない元（\ref{graph:cut-space}）でカットである。$F'$ と $F\setminus F'$ に帰納法の仮定を使えばよい。
:::

::: supplement
**接続行列との関係.** $\mathbb{F}_{2}$ 上の接続行列 $B\in M_{n\times m}(\mathbb{F}_{2})$（$v_{i}\in e_{j}$ のとき $b_{ij}=1$）は、$F\subseteq E$ を「$F$ の奇数本の辺に接する頂点の集合」に写す。\ref{graph:cycle-space-characterization} より $\mathcal{C}=\ker B$、\ref{graph:cut-space} の Step 1 より $\mathcal{B}=\operatorname{im}B^{t}$ であり、\ref{graph:cycle-cut-duality} は「$\ker B=(\operatorname{im}B^{t})^{\perp}$」という線形代数の一般的な事実の特別な場合とみなせる。

**高い視点.** グラフを 1 次元の複体とみると、$\mathcal{C}(G)$ は $\mathbb{F}_{2}$ 係数の 1 次ホモロジー $H_{1}(G;\mathbb{F}_{2})$、$\mathcal{B}(G)$ は 1 次の余境界の空間であり、$\dim\mathcal{C}=m-n+c$ はオイラー標数の関係 $n-m=\dim H_{0}-\dim H_{1}$ にほかならない（\ref{at:page-simplicial-homology}）。
:::

## 問題 {#graph:sec-cs-problems}

::: problem {#graph:prob-cs-bond-sides}
連結グラフのカット $E(V_{1},V_{2})$ が結合であることと、$G[V_{1}]$, $G[V_{2}]$ がともに連結であることは同値であることを示せ。
:::

::: solution
$G[V_{1}]$ が非連結で、その成分 $W$ があるとする。$G$ は連結なので $E(W,V_{2})\neq\varnothing$ で、$E(W,V\setminus W)=E(W,V_{2})$（$W$ から $V_{1}\setminus W$ への辺はない）は $E(V_{1},V_{2})$ に真に含まれる空でないカット（$V_{1}\setminus W\neq\varnothing$ の頂点の辺も $V_{2}$ へ出るので、包含は真）。逆に両側が連結とし、$\varnothing\neq E(U,V\setminus U)\subseteq E(V_{1},V_{2})$ とする。$G[V_{1}]$ の辺は $E(U,V\setminus U)$ に入らないので、$V_{1}$ は $U$ か $V\setminus U$ に含まれる。$V_{2}$ も同様で、両方が同じ側なら $U=\varnothing$ か $V$ でカットが空になるので、$\{U,V\setminus U\}=\{V_{1},V_{2}\}$。
:::

::: problem {#graph:prob-cs-k4}
$K^{4}$ の閉路空間の次元を求め、基本閉路の例を挙げよ。
:::

::: solution
$n=4$, $m=6$, $c=1$ なので $\dim\mathcal{C}=3$。星形の全域木（中心 $1$、辺 $12,13,14$）について、基本閉路は $C_{23}=\{12,23,13\}$, $C_{24}=\{12,24,14\}$, $C_{34}=\{13,34,14\}$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{graph:sec-cs-exercises} にまとめた。
