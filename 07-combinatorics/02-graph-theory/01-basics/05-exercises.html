# 演習：グラフの基本 {#graph:page-exercises-basics keywords="exercises, graph theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界（等号の例・反例）を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-exbasics-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。
:::

## グラフと次数・道・閉路・連結性 {#graph:sec-gr-exercises}

対応するページ：\ref{graph:page-graphs}

::: problem ★ 基本：最小次数の大きいグラフは連結 {#graph:ex-gr-connected-mindeg}
$n$ 頂点のグラフで $\delta(G)\ge(n-1)/2$ なら、$G$ は連結であることを示せ。
:::

::: solution
$u,v$ が異なる連結成分にあるとすると、$\{u\}\cup N(u)$ と $\{v\}\cup N(v)$ は（異なる成分に含まれるので）交わらない。よって $2(\delta(G)+1)\le\abs{\{u\}\cup N(u)}+\abs{\{v\}\cup N(v)}\le n$、すなわち $\delta(G)\le\frac{n}{2}-1<\frac{n-1}{2}$ で矛盾。
:::

::: problem ★★ 標準：直径と補グラフ {#graph:ex-gr-diameter-complement}
$G$ の直径が 3 以上なら、補グラフ $\overline{G}$ の直径は 3 以下であることを示せ。
:::

::: solution
$d_{G}(x,y)\ge3$ となる $x,y$ をとる。$x,y$ は $G$ で隣接せず共通の隣接頂点ももたないので、$xy\in E(\overline{G})$ で、どの頂点 $w\notin\{x,y\}$ も $G$ で $x,y$ の少なくとも一方と隣接しない、すなわち $\overline{G}$ で $x$ か $y$ と隣接する。任意の $u\neq v$ について、$uv\notin E(G)$ なら $\overline{G}$ で距離 1。$uv\in E(G)$ なら、$u$ が $\overline{G}$ で隣接する $a\in\{x,y\}$、$v$ が隣接する $b\in\{x,y\}$ をとる（$u\in\{x,y\}$ なら $a\defeq u$ とする。$v$ も同様）。$a=b$ なら $u\,a\,v$、$a\neq b$ なら $u\,a\,b\,v$ が $\overline{G}$ の歩道で、距離は 3 以下（\ref{graph:walk-contains-path}）。
:::

## 木・二部グラフ・オイラー回路 {#graph:sec-tb-exercises}

対応するページ：\ref{graph:page-trees-bipartite}

::: problem ★ 基本：最大次数と葉の数 {#graph:ex-gr-leaves}
$n\ge2$ 頂点の木 $T$ は、少なくとも $\Delta(T)$ 個の葉をもつことを示せ。
:::

::: solution
葉の数を $L$ とし、次数 $\Delta\defeq\Delta(T)$ の頂点 $v$ をとる。$n\ge2$ なら $T$ は連結で辺をもつので $\Delta\ge1$。$\Delta=1$ なら $T=K^{2}$ で葉は 2 個。$\Delta\ge2$ なら $v$ は葉でなく、$v$ 以外の葉でない $n-1-L$ 個の頂点の次数は 2 以上なので、\ref{graph:handshake}と木の辺数 $n-1$（\ref{graph:tree-characterization}）から
$$2(n-1)=\sum_{u}d(u)\ge L+\Delta+2(n-1-L)=2(n-1)-L+\Delta.$$
よって $L\ge\Delta$。等号は、たとえば星 $K_{1,\Delta}$ や、中心から長さの等しい道を $\Delta$ 本出した「蜘蛛」で成り立つ。
:::

::: problem ★ 基本：葉の数の公式 {#graph:ex-tb-leaf-formula}
$n\ge2$ 頂点の木 $T$ の葉の数は $2+\sum_{d(v)\ge3}(d(v)-2)$ であることを示せ。
:::

::: solution
木の辺は $n-1$ 本（\ref{graph:tree-characterization}）なので、\ref{graph:handshake} から $\sum_{v}(d(v)-2)=2(n-1)-2n=-2$。$d(v)=1$ の項は $-1$、$d(v)=2$ の項は $0$ で、$n\ge2$ の木では $d(v)\ge1$ なので、葉の数を $L$ として $-L+\sum_{d(v)\ge3}(d(v)-2)=-2$。
:::

## 閉路空間とカット空間 {#graph:sec-cs-exercises}

対応するページ：\ref{graph:page-cycle-space}

::: problem ★ 基本：次元の計算 {#graph:ex-cs-dimensions}
ペテルセングラフ（10 頂点・15 辺、連結）の閉路空間とカット空間の次元を求めよ。
:::

::: solution
\ref{graph:cycle-cut-duality} により、連結グラフの閉路空間の次元は $m-n+1=15-10+1=6$、カット空間の次元は $n-1=9$。和 $15$ は辺空間の次元に等しい。
:::

::: problem ★★ 標準：二部グラフと閉路空間 {#graph:ex-cs-bipartite}
$G$ が二部グラフであることと、閉路空間のすべての元が偶数本の辺からなることは同値であることを示せ。
:::

::: solution
($\Rightarrow$) 二部グラフの閉路は偶数の長さをもつ（\ref{graph:bipartite-odd-cycle}）。閉路空間の元は辺を共有しない閉路の和（\ref{graph:cycle-space-characterization}）なので、辺の数は偶数の和で偶数。($\Leftarrow$) 二部グラフでなければ奇閉路 $C$ があり（同じ定理）、$E(C)$ は閉路空間の元で辺の数は奇数。
:::

## 縮約とマイナー {#graph:sec-mn-exercises}

対応するページ：\ref{graph:page-minors}

::: problem ★ 基本：三角形のマイナー {#graph:ex-mn-k3-minor}
$G$ が $K^{3}$ をマイナーにもつことと、$G$ が閉路を含むことは同値であることを示せ。
:::

::: solution
閉路 $C$ があれば、$C$ の頂点を 3 つの空でない弧（連結）に分けると、隣り合う弧の間に $C$ の辺があるので $K^{3}$ の分岐集合になる。逆に分岐集合 $V_{1},V_{2},V_{3}$ があれば、$V_{i}$ と $V_{j}$ を結ぶ辺 $e_{ij}$ をとり、各 $V_{i}$ の中で $e_{ij}$ と $e_{ik}$ の端点を結ぶ道（$V_{i}$ は連結）をつなぐと、3 本の辺と 3 本の道からなる閉じた歩道ができ、各道は異なる $V_{i}$ にあるので閉路になる。
:::

::: problem ★ 基本：車輪の中の $K^{4}$ {#graph:ex-mn-wheel-k4}
車輪 $W_{n}$（閉路 $C_{n}$ と、そのすべての頂点に隣接する中心 $z$、$n\ge3$）は $K^{4}$ をマイナーにもつことを示せ。
:::

::: solution
$C_{n}$ を 3 つの空でない弧 $A_{1},A_{2},A_{3}$ に分ける。分岐集合 $\{z\}$, $A_{1}$, $A_{2}$, $A_{3}$ はそれぞれ連結で、$z$ はすべての弧と隣接し、閉路の上で隣り合う弧の間には辺がある（3 つの弧はどの 2 つも隣り合う）。よって $K^{4}\preccurlyeq W_{n}$（\ref{graph:minor}）。
:::
