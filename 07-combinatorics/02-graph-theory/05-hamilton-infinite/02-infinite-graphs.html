# 無限グラフの基本 {#graph:page-infinite-graphs keywords="infinite graph, locally finite graph, ray, double ray, tail, spanning tree via Zorn's lemma, König's infinity lemma, de Bruijn-Erdos theorem, compactness, Tychonoff, infinite Hall theorem, ends of a graph, unfriendly partition"}

これまでのページではグラフを有限としてきた。頂点が無限個あるグラフでは、有限の場合の議論がそのままでは通らない。たとえば「頂点の多い順に処理する」「極小反例をとる」といった手法は使えず、その代わりに**ツォルンの補題**と**コンパクト性**が基本の道具になる。このページでは、無限グラフの基本的な定義を述べたあと、(1) 連結グラフが全域木をもつこと（ツォルンの補題）、(2) ケーニッヒの無限補題、(3) 有限部分グラフの性質を全体に移すド・ブライン–エルデシュの定理と無限版ホールの定理（コンパクト性）、(4) 無限グラフに固有の概念であるエンド、を扱う。

## 記法と定義の確認 {#graph:sec-ig-notation}

::: notation
- このページに限り体系は $\ZFC$ とし、選択公理を使う箇所は明記する。整列可能定理（\ref{set:well-ordering-theorem}）と\ref{set:zorn}を使う。
- グラフの用語（部分グラフ・誘導部分グラフ $G[U]$・道・閉路・連結・連結成分）は \ref{graph:page-graphs} の定義を、頂点集合が無限でもそのまま使う。**道と閉路は有限**である。
- 頂点彩色と $k$ 彩色可能は \ref{graph:chromatic-number}、二部グラフとマッチングは \ref{graph:page-bipartite-matching} のとおり。$[k]\defeq\{1,\dots,k\}$。
- 位相空間のコンパクト性は \ref{top:compact}、その閉集合による言い換え（有限交叉性をもつ閉集合族の共通部分は空でない）は \ref{top:compact-equivalents}、コンパクト空間の直積については \ref{top:tychonoff} のとおり。有限集合には離散位相を入れる。
- 写像 $f$ の部分集合 $U$ への制限を $f\restr{U}$ と書く。$\N=\{0,1,2,\dots\}$。
:::

## 無限グラフと半無限道 {#graph:sec-ig-definitions}

::: definition 無限グラフ・局所有限 {#graph:infinite-graph keywords="infinite graph, locally finite graph, countable graph" index="無限グラフ|むげんぐらふ, 局所有限グラフ|きょくしょゆうげんぐらふ"}
$V$ を任意の集合、$E\subseteq\mathcal{P}_{2}(V)$ とするとき、組 $G=(V,E)$ もグラフとよび、$V$ が無限集合のとき**無限グラフ**という。頂点 $v$ の次数 $d(v)\defeq\abs{N(v)}$ は基数で、無限でもよい。すべての頂点の次数が有限のとき $G$ は**局所有限**であるという。$V$ が可算のとき**可算グラフ**という。
:::

::: definition 半無限道と両側無限道 {#graph:ray keywords="ray, double ray, tail, two-way infinite path" index="半無限道|はんむげんみち, 両側無限道|りょうがわむげんみち, 尾（半無限道の）|お"}
相異なる頂点 $x_{0},x_{1},x_{2},\dots$ と辺 $x_{0}x_{1},x_{1}x_{2},\dots$ からなるグラフを**半無限道**（ray）といい、$x_{0}x_{1}x_{2}\dots$ と書く。相異なる頂点 $\dots,x_{-1},x_{0},x_{1},\dots$ と辺 $x_{i}x_{i+1}$（$i\in\mathbb{Z}$）からなるグラフを**両側無限道**という。半無限道 $x_{0}x_{1}\dots$ の部分グラフ $x_{n}x_{n+1}\dots$（$n\in\N$）をその**尾**という。グラフ $G$ の部分グラフで半無限道であるものを $G$ の半無限道という。
:::

::: intuition
半無限道は一方向に果てしなく続く一本道、両側無限道は両方向に続く一本道である。尾は「十分先の部分」で、二つの尾は一方が他方を含む（有限個の頂点を除けば同じである）。
:::

::: example
1. **無限星** $K_{1,\aleph_{0}}$：中心 $z$ と頂点 $y_{1},y_{2},\dots$、辺 $zy_{i}$。連結で無限だが局所有限ではない（$d(z)=\aleph_{0}$）。半無限道を含まない：半無限道 $x_{0}x_{1}\dots$ の頂点 $x_{1}$, $x_{2}$ はどちらも道の中で 2 本の辺をもつので $G$ での次数が 2 以上であり、そのような頂点は中心 $z$ しかない。すると $x_{1}=x_{2}=z$ となり、頂点が相異なることに反する。
2. **整数格子** $\mathbb{Z}^{2}$（$(a,b)$ と $(a',b')$ が隣接 $\iff\abs{a-a'}+\abs{b-b'}=1$）は 4 正則の可算グラフで、局所有限である。
:::

## 全域木とツォルンの補題 {#graph:sec-ig-spanning-tree}

有限グラフの全域木（\ref{graph:spanning-tree}）は「辺を一本ずつ除く」か「頂点を一つずつ加える」操作で得られた。無限グラフでは操作が終わらないので、極大な木の存在をツォルンの補題で保証する。

::: proposition 無限連結グラフの全域木 {#graph:infinite-spanning-tree keywords="every connected graph has a spanning tree, Zorn's lemma" index="全域木（無限グラフの）|ぜんいきぎ" refname="無限グラフの全域木"}
（選択公理）連結グラフ $G$（無限でもよい）は全域木をもつ。
:::

::: proof
**Step 1（順序集合の設定）.** $G$ の部分グラフで木であるもの全体を $\mathcal{T}$ とし、部分グラフの包含 $\subseteq$ で半順序を入れる。$G$ は連結なので空でなく（\ref{graph:connectivity}）、1 頂点からなる木があるので $\mathcal{T}\neq\varnothing$。

**Step 2（鎖の上界）.** 【主張：$\mathcal{T}$ の空でない鎖 $\mathcal{C}$ について、和 $T^{*}\defeq\bigcup\mathcal{C}$（頂点集合と辺集合の和）は木である】
- *連結性.* $u,v\in V(T^{*})$ とすると、$u\in T_{u}$, $v\in T_{v}$ となる $T_{u},T_{v}\in\mathcal{C}$ がある。鎖なので一方が他方を含み、たとえば $T_{u}\subseteq T_{v}$。木 $T_{v}$ の中に $u$ と $v$ を結ぶ道があり、それは $T^{*}$ の道でもある。
- *閉路をもたない.* $T^{*}$ が閉路 $C$ を含むとする。$C$ は**有限**なので、その辺 $e_{1},\dots,e_{r}$ はそれぞれある $T_{i}\in\mathcal{C}$ に含まれる。有限個の $T_{1},\dots,T_{r}$ は鎖の中で全順序なので最大元 $T_{j}$ があり、$C\subseteq T_{j}$。$T_{j}$ が木であることに反する。

空の鎖の上界には 1 頂点の木をとればよい。したがって $\mathcal{T}$ のどの鎖も上界をもつ。

**Step 3（極大元）.** \ref{set:zorn}（ここで選択公理を使う）により極大元 $T\in\mathcal{T}$ がある。

**Step 4（極大な木は全域的）.** 【主張：$V(T)=V(G)$】そうでないとし、$v\in V(G)\setminus V(T)$、$u\in V(T)$ をとる。$G$ は連結なので $u$ から $v$ への道 $P=u\dots v$ がある。$P$ 上で最初に $V(T)$ の外に出る頂点を $y$、その直前の頂点を $x\in V(T)$ とする。$T$ に頂点 $y$ と辺 $xy$ を加えた $T'$ は連結で、新しい閉路は $y$ を通らなければならないが $y$ の $T'$ での次数は 1 なので閉路はない。$T'\in\mathcal{T}$ かつ $T\subsetneq T'$ で、極大性に反する。
:::

::: intuition
木をどこまでも大きくしていくと、「これ以上大きくできない木」がある、というのがツォルンの補題の役割である。和をとっても閉路が生じないのは、閉路が有限個の辺でできていて、有限個の段階のどれかですでに現れていなければならないからである。
:::

::: hypcheck
- **閉路の有限性**は Step 2 で本質的に使った。禁止したい構造が無限（たとえば「半無限道を含まない全域木」）だと、鎖の和で初めてその構造が現れうるので、同じ議論は通らない。
- **選択公理**は Step 3 だけで使う。$G$ が可算なら、頂点を $v_{0},v_{1},\dots$ と並べて「$v_{n}$ を最初に加えられる段階で加える」という再帰で、選択公理なしに全域木が作れる（\ref{graph:prob-ig-countable-tree}）。
:::

## ケーニッヒの無限補題 {#graph:sec-ig-konig}

::: lemma ケーニッヒの無限補題 {#graph:konig-infinity-lemma keywords="König's infinity lemma, finitely branching tree has an infinite branch" index="ケーニッヒの無限補題|けーにっひのむげんほだい" refname="ケーニッヒの無限補題"}
$V_{0},V_{1},V_{2},\dots$ を、互いに交わらない空でない**有限**集合の列とし、$G$ をそれらの和集合を頂点集合とするグラフとする。$n\ge1$ のとき各 $v\in V_{n}$ に $G$ での隣接頂点 $f(v)\in V_{n-1}$ が指定されているとする。このとき、すべての $n$ について $v_{n}\in V_{n}$ かつ $f(v_{n+1})=v_{n}$ を満たす $G$ の半無限道 $v_{0}v_{1}v_{2}\dots$ が存在する。
:::

::: intuition
$V_{n}$ を「$n$ 階の部屋」、$f$ を「一つ下の階への階段」と思う。どの階にも部屋があり、各階の部屋は有限個しかない。上の階から階段を下りてくる経路は無限に多いので、鳩の巣原理により、0 階のどこかの部屋には無限に多くの階から経路が降りてくる。その部屋から出発して、また無限に多くの経路が通る部屋を一段ずつ上に選んでいけば、無限に上っていける。
:::

::: proof
**Step 1（「良い」頂点の定義）.** $m\ge n$、$v\in V_{n}$ について、$f^{m-n}(w)=v$ となる $w\in V_{m}$ があるとき「$v$ は $m$ から到達される」という（$f^{0}$ は恒等写像。$f$ は $V_{j}$ を $V_{j-1}$ に写すので $f^{m-n}(w)\in V_{n}$ は意味をもつ）。無限に多くの $m$ から到達される $v$ を**良い**頂点とよぶ。

**Step 2（出発点）.** 【主張：$V_{0}$ に良い頂点がある】各 $m\in\N$ について $V_{m}\neq\varnothing$ なので $w\in V_{m}$ がとれ、$f^{m}(w)\in V_{0}$ は $m$ から到達される。よって各 $m$ に対し、$m$ から到達される $V_{0}$ の頂点がある。$V_{0}$ のどの頂点も有限個の $m$ からしか到達されないとすると、$V_{0}$ が**有限**なので、ある頂点から到達される $m$ 全体は有限集合の有限個の和で有限になり、すべての $m\in\N$ を尽くせない。矛盾。

**Step 3（一段上る）.** 【主張：$v\in V_{n}$ が良いなら、$f(u)=v$ を満たす良い $u\in V_{n+1}$ がある】$v$ が到達される $m>n$ は無限に多い。そのような $m$ ごとに $f^{m-n}(w)=v$ となる $w\in V_{m}$ をとり、$u\defeq f^{m-n-1}(w)\in V_{n+1}$ とおくと $f(u)=v$ で、$u$ は $m$ から到達される。つまり無限に多い各 $m$ について、$f(u)=v$ を満たす $u\in V_{n+1}$ で $m$ から到達されるものがある。$V_{n+1}$ が**有限**なので、Step 2 と同じ鳩の巣論法により、そのうちの一つ $u$ は無限に多くの $m$ から到達され、良い。

**Step 4（再帰的な構成）.** $\bigcup_{n}V_{n}$ に整列順序を一つ固定する（整列可能定理、\ref{set:well-ordering-theorem}。各 $V_{n}$ が自然数の部分集合のように最初から整列されていればこの段階は不要）。$v_{0}$ を $V_{0}$ の良い頂点のうち最小のもの、$v_{n+1}$ を $f(u)=v_{n}$ を満たす良い $u\in V_{n+1}$ のうち最小のものと再帰的に定める（Step 2, 3 により存在する）。

**Step 5（半無限道であること）.** $f(v_{n+1})=v_{n}$ は $G$ での $v_{n+1}$ の隣接頂点なので $v_{n}v_{n+1}\in E(G)$。$v_{n}\in V_{n}$ で $V_{n}$ たちは互いに交わらないので、頂点 $v_{0},v_{1},\dots$ は相異なる。よって $v_{0}v_{1}v_{2}\dots$ は $G$ の半無限道である。
:::

::: corollary 局所有限グラフの半無限道 {#graph:locally-finite-ray keywords="every infinite connected locally finite graph contains a ray" index="半無限道の存在|はんむげんみちのそんざい"}
無限で連結な局所有限グラフ $G$ は、任意の頂点 $x$ から出発する半無限道を含む。
:::

::: proof
**Step 1（距離による層）.** $V_{n}$ を $x$ からの距離（最短の道の長さ）がちょうど $n$ の頂点の集合とする。連結なので $V(G)=\bigcup_{n}V_{n}$ で、$V_{n}$ たちは互いに交わらない。

**Step 2（各層は有限）.** 【主張：各 $V_{n}$ は有限】$n$ についての帰納法。$V_{0}=\{x\}$。$V_{n+1}\subseteq\bigcup_{v\in V_{n}}N(v)$（距離 $n+1$ の頂点の最短の道の直前の頂点は距離 $n$）であり、**局所有限性**から各 $N(v)$ は有限、帰納法の仮定から $V_{n}$ は有限なので、$V_{n+1}$ も有限。

**Step 3（各層は空でない）.** 【主張：各 $V_{n}\neq\varnothing$】ある $V_{n}=\varnothing$ なら、距離 $n$ 以上の頂点はない（距離 $m>n$ の頂点の最短の道は距離 $n$ の頂点を通る）ので $V(G)=V_{0}\cup\dots\cup V_{n-1}$ は有限になり、$G$ が**無限**であることに反する。

**Step 4（ケーニッヒの無限補題の適用）.** $v\in V_{n}$（$n\ge1$）について、$x$ から $v$ への最短の道の $v$ の直前の頂点を一つ選んで $f(v)\in V_{n-1}$ とする（各 $v$ に有限個の候補から一つ選ぶ。頂点全体を整列しておけば最小のものとすればよい）。\ref{graph:konig-infinity-lemma} により $v_{0}=x$ から始まる半無限道 $v_{0}v_{1}\dots$ が得られる。
:::

::: example
**局所有限性は外せない.** 無限星 $K_{1,\aleph_{0}}$ は無限で連結だが半無限道を含まない（前の例）。この場合 $V_{1}$ が無限集合になり、Step 2 が破れる。
:::

## ド・ブライン–エルデシュの定理 {#graph:sec-ig-compactness}

無限グラフの性質を、その有限部分グラフの性質から導く議論を総称して**コンパクト性の議論**という。代表例が彩色についての次の定理である。

::: theorem ド・ブライン–エルデシュの定理 {#graph:de-bruijn-erdos keywords="de Bruijn-Erdos theorem, compactness for colourings, finite subgraphs k-colourable implies k-colourable" index="ド・ブライン–エルデシュの定理|どぶらいんえるでしゅのていり, コンパクト性（グラフの）|こんぱくとせい" refname="ド・ブライン–エルデシュの定理"}
$k\in\N$ とし、$G=(V,E)$ をグラフとする。$G$ のすべての有限部分グラフが $k$ 彩色可能なら、$G$ も $k$ 彩色可能である。
:::

::: intuition
彩色は「隣どうしが違う色」という**局所的な**条件で決まる。有限の部分ごとには塗り方があるが、部分ごとの塗り方が互いに整合するとは限らない。コンパクト性は、整合する塗り方の選び方を（無限個の選択を一度に）保証する。
:::

::: proof
**証明 1（$G$ が可算の場合、ケーニッヒの無限補題による）.**

**Step 1（有限の層）.** $V$ が有限なら仮定そのもの。$V$ を可算無限とし $V=\{x_{0},x_{1},\dots\}$ と並べ、$G_{n}\defeq G[\{x_{0},\dots,x_{n}\}]$ とおく。$V_{n}$ を $G_{n}$ の頂点彩色で色を $[k]$ にとるもの全体とする。$G_{n}$ は有限部分グラフなので**仮定**により $k$ 彩色可能で、色の集合を $[k]$ に単射で写せば $V_{n}\neq\varnothing$。$V_{n}$ は写像 $\{x_{0},\dots,x_{n}\}\to[k]$ の集合なので有限（$k^{n+1}$ 個以下）。定義域が異なるので $V_{n}$ たちは互いに交わらない。

**Step 2（補助グラフ）.** $n\ge1$ と $c\in V_{n}$ について $f(c)\defeq c\restr{\{x_{0},\dots,x_{n-1}\}}$ とおく。$G_{n-1}\subseteq G_{n}$ なので $f(c)$ は $G_{n-1}$ の頂点彩色で、$f(c)\in V_{n-1}$。$\bigcup_{n}V_{n}$ を頂点集合とし、辺を $\{c,f(c)\}$（$c\in V_{n}$, $n\ge1$）とするグラフ $H$ を考える。

**Step 3（整合する彩色の列）.** \ref{graph:konig-infinity-lemma} を $H$ に適用すると、$c_{n}\in V_{n}$ かつ $f(c_{n+1})=c_{n}$ を満たす列 $c_{0},c_{1},\dots$ が得られる。帰納法により、$m\ge n$ なら $c_{m}\restr{\{x_{0},\dots,x_{n}\}}=c_{n}$。

**Step 4（全体の彩色）.** $c(x_{i})\defeq c_{i}(x_{i})$ と定める。【主張：$c$ は $G$ の頂点彩色】辺 $x_{i}x_{j}$ について $m\defeq\max(i,j)$ とおくと、Step 3 により $c(x_{i})=c_{m}(x_{i})$, $c(x_{j})=c_{m}(x_{j})$。$x_{i}x_{j}$ は $G_{m}$ の辺で $c_{m}$ はその頂点彩色なので、$c(x_{i})\neq c(x_{j})$。

**証明 2（一般の場合、チコノフの定理による）.**

**Step 1（コンパクト空間）.** $X\defeq[k]^{V}=\prod_{v\in V}[k]$ に、離散位相の $[k]$ の直積位相を入れる。有限な離散空間はコンパクトなので、\ref{top:tychonoff}（ここで選択公理を使う）により $X$ はコンパクトである。有限集合 $U\subseteq V$ と $h\colon U\to[k]$ について $O_{h}\defeq\{g\in X: g\restr{U}=h\}$ は基本開集合である。

**Step 2（閉集合族）.** 有限集合 $U\subseteq V$ ごとに
$$A_{U}\defeq\{g\in X : g\restr{U}\text{ は }G[U]\text{ の頂点彩色}\}$$
とおく。【主張：$A_{U}$ は閉集合】$g\notin A_{U}$ なら、$g\in O_{g\restr{U}}$ であり、$O_{g\restr{U}}$ の元 $g'$ は $g'\restr{U}=g\restr{U}$ を満たすので $A_{U}$ に属さない。よって補集合は開集合である。

**Step 3（有限交叉性）.** 【主張：有限個の $U_{1},\dots,U_{r}$ について $A_{U_{1}}\cap\dots\cap A_{U_{r}}\neq\varnothing$】$W\defeq U_{1}\cup\dots\cup U_{r}$ は有限なので、**仮定**により $G[W]$ には色を $[k]$ にとる頂点彩色 $c_{W}$ がある。$g\in X$ を $W$ 上で $c_{W}$、それ以外で $1$ と定めると、$G[U_{i}]\subseteq G[W]$ なので $g\restr{U_{i}}=c_{W}\restr{U_{i}}$ は $G[U_{i}]$ の頂点彩色であり、$g\in A_{U_{i}}$。

**Step 4（共通部分の元が彩色）.** \ref{top:compact-equivalents} により $\bigcap_{U}A_{U}\neq\varnothing$（$U$ は $V$ の有限部分集合全体を動く）。その元 $g$ をとる。辺 $uv$ について $U=\{u,v\}$ とすれば $g\in A_{U}$ なので $g(u)\neq g(v)$。よって $g$ は $G$ の $k$ 彩色である。
:::

::: example
**$k$ が有限であることは外せない.** 非可算集合 $V$ 上の完全グラフ（すべての 2 頂点が隣接）を考える。有限部分グラフは有限個の色で彩色できる（つまり「高々可算個の色で彩色可能」）が、全体の頂点彩色は単射でなければならないので、可算個の色では足りない。証明 2 で $[k]$ を無限集合 $\N$ に変えると、離散位相の $\N$ がコンパクトでないため Step 1 が破れる。
:::

::: theorem 無限版ホールの定理 {#graph:infinite-hall keywords="Hall's theorem for infinite bipartite graphs with finite degrees on one side, compactness" index="無限版ホールの定理|むげんばんほーるのていり" refname="無限版ホールの定理"}
$G$ を二部分割 $\{A,B\}$ をもつ二部グラフ（無限でもよい）とし、各 $a\in A$ の次数は**有限**とする。$A$ の任意の**有限**部分集合 $S$ について $\abs{N(S)}\ge\abs{S}$ なら、$G$ は $A$ のマッチングをもつ。すなわち、単射 $h\colon A\to B$ で各 $a$ について $h(a)\in N(a)$ となるものがある。
:::

::: proof
**Step 1（コンパクト空間）.** $S=\{a\}$ に仮定を使うと $N(a)\neq\varnothing$。各 $N(a)$ は**有限**なので離散位相でコンパクトであり、\ref{top:tychonoff}により $X\defeq\prod_{a\in A}N(a)$ はコンパクト（選択公理により空でもない）。$X$ の元は $h(a)\in N(a)$ を満たす写像 $h\colon A\to B$ である。

**Step 2（閉集合族）.** 有限集合 $S\subseteq A$ について $C_{S}\defeq\{h\in X : h\restr{S}\text{ は単射}\}$ とおく。$h\in C_{S}$ かどうかは有限個の座標 $h\restr{S}$ だけで決まるので、ド・ブライン–エルデシュの定理の証明 2 の Step 2 と同様に $C_{S}$ は閉集合である。

**Step 3（有限交叉性）.** 有限個の $S_{1},\dots,S_{r}$ について $S\defeq S_{1}\cup\dots\cup S_{r}$ とおく。有限二部グラフ $G'\defeq G[S\cup N(S)]$ を考えると、$T\subseteq S$ について $N_{G'}(T)=N_{G}(T)$ なので、**仮定**により $G'$ は結婚条件を満たす。\ref{graph:hall-theorem}により $S$ のマッチング、すなわち単射 $h_{S}\colon S\to N(S)$ で $h_{S}(a)\in N(a)$ となるものがある。$h_{S}$ を $X$ の元に延長すれば（$A\setminus S$ の各点では $N(a)$ の任意の元をとる）、それは $C_{S_{1}}\cap\dots\cap C_{S_{r}}$ に属する。

**Step 4（結論）.** \ref{top:compact-equivalents} により、すべての有限 $S$ にわたる $\bigcap C_{S}$ に元 $h$ がある。相異なる $a,a'\in A$ について $S=\{a,a'\}$ とすれば $h(a)\neq h(a')$。よって $h$ は単射で、$A$ のマッチングを与える。
:::

::: example
**$A$ 側の次数の有限性は外せない.** $A=\{a_{0},a_{1},a_{2},\dots\}$, $B=\{b_{1},b_{2},\dots\}$ とし、$a_{0}$ をすべての $b_{j}$ と、$a_{i}$（$i\ge1$）を $b_{i}$ だけと結ぶ。有限な $S\subseteq A$ について、$a_{0}\in S$ なら $N(S)=B$ は無限、$a_{0}\notin S$ なら $\abs{N(S)}=\abs{S}$ なので、結婚条件は満たされる。しかし $A$ のマッチングで $a_{0}$ が $b_{j}$ に対応するなら、$a_{j}$ の行き先がない。この例では $d(a_{0})=\aleph_{0}$ のため Step 1 で $N(a_{0})$ がコンパクトでない。
:::

::: hypcheck
- **ケーニッヒの無限補題**：各 $V_{n}$ の**有限性**は Step 2, 3 の鳩の巣論法で、**非空性**は Step 2 で、$f(v)$ が**隣接頂点**であることは Step 5 で使った。$V_{n}$ が無限だと結論は成り立たない：根 $r$ から長さ $m$ の道 $r\,p_{m,1}\dots p_{m,m}$ を $m=1,2,\dots$ ごとに（$r$ 以外で交わらないように）伸ばしたグラフで、$V_{0}=\{r\}$, $V_{n}=\{p_{m,n}: m\ge n\}$, $f(p_{m,n})=p_{m,n-1}$（$p_{m,0}\defeq r$）とすると、各 $V_{n}$ は空でない無限集合だが、条件を満たす列は一本の有限な道 $r\,p_{m,1}\dots p_{m,m}$ から出られず、半無限道はない。
- **ド・ブライン–エルデシュの定理**：有限部分グラフの $k$ 彩色可能性は各証明の Step 1 / Step 3 で、$k$ の有限性は $V_{n}$ の有限性（証明 1）と $[k]$ のコンパクト性（証明 2）で使った。$V$ の可算性は証明 1 の Step 1 の並べ方だけに使い、証明 2 では不要である。
- **無限版ホールの定理**：次数の有限性は Step 1、有限部分集合での結婚条件は Step 3 で使った。$A$ 側の次数だけが有限であればよく、$B$ 側の次数は無限でもよい。
:::

## エンド {#graph:sec-ig-ends}

有限グラフには対応物のない、無限グラフに固有の概念が**エンド**（無限遠の「行き先」）である。

::: lemma 半無限道の行き先の成分 {#graph:ray-component keywords="for finite S each ray has a tail in exactly one component of G-S"}
$G$ の半無限道 $R$ と有限集合 $S\subseteq V(G)$ について、$R$ の尾で $G-S$ に含まれるものがあり、そのような尾はすべて $G-S$ の同じ連結成分に含まれる。この成分を $C(S,R)$ と書く。
:::

::: proof
**Step 1（存在）.** $R=x_{0}x_{1}\dots$ とする。$S$ は**有限**なので $x_{i}\in S$ となる $i$ は有限個で、その最大値を $N$（なければ $N\defeq-1$）とすると、尾 $x_{N+1}x_{N+2}\dots$ は $S$ と交わらない。尾は連結なので $G-S$ のある連結成分に含まれる。

**Step 2（一意性）.** 尾 $x_{n}x_{n+1}\dots$ と $x_{n'}x_{n'+1}\dots$ がともに $G-S$ に含まれるとすると、両者は尾 $x_{\max(n,n')}\dots$ を共有するので、同じ連結成分に含まれる。
:::

::: definition エンド {#graph:end keywords="end of a graph, equivalent rays, Omega(G)" index="エンド（グラフの）|えんど, 同値な半無限道|どうちなはんむげんみち"}
$G$ の半無限道 $R,R'$ が、すべての有限集合 $S\subseteq V(G)$ について $C(S,R)=C(S,R')$ を満たすとき**同値**であるという。これは等式で定義されるので同値関係であり、その同値類を $G$ の**エンド**という。エンド全体を $\Omega(G)$ と書く。
:::

::: intuition
エンドは、グラフを「遠くから眺めたとき」に半無限道が向かっていく先、つまり無限遠の点である。有限個の頂点を取り除いてグラフを切り分けても、同じエンドに属する半無限道は常に同じ側に残る。
:::

::: example
1. **半無限道** $R=x_{0}x_{1}\dots$ はちょうど 1 つのエンドをもつ：$R$ の半無限道は $R$ の尾だけであり（両側に無限に続く部分がないので、部分グラフとしての半無限道は $x_{n}x_{n+1}\dots$ の形）、どの二つも尾を共有するので同値である。
2. **両側無限道** $D=\dots x_{-1}x_{0}x_{1}\dots$ はちょうど 2 つのエンドをもつ：$D$ の半無限道は $x_{n}x_{n+1}\dots$（右向き）か $x_{n}x_{n-1}\dots$（左向き）の形である。右向きどうしは尾を共有するので同値、左向きどうしも同様。$S=\{x_{0}\}$ とすると $D-S$ は右半分と左半分の 2 成分に分かれ、右向きと左向きの半無限道は $C(S,\cdot)$ が異なるので同値でない。
3. **有限グラフ**や無限星 $K_{1,\aleph_{0}}$ のように半無限道をもたないグラフは、エンドをもたない。\ref{graph:locally-finite-ray} により、無限連結な局所有限グラフはエンドを少なくとも 1 つもつ。
:::

::: fact エンドの次数とフロイデンタール・コンパクト化 {#graph:ends-facts keywords="end degree, Halin's theorem, Freudenthal compactification, binary tree ends" index="フロイデンタール・コンパクト化（グラフ）|ふろいでんたーるこんぱくとか"}
次のことが知られている（R. Diestel, *Graph Theory*, 第 8 章）。
1. 二分木（根以外の各頂点の次数が 3、根の次数が 2 の無限木）のエンドは無限 0–1 列と一対一に対応し、連続体濃度個ある（\ref{graph:prob-ig-binary-tree}）。
2. （ハリンの定理）各 $k\in\N$ について $k$ 本の互いに交わらない半無限道を含むエンドは、無限個の互いに交わらない半無限道を含む。
3. 連結な局所有限グラフ $G$ を 1 次元複体と見てエンドを無限遠点として付け加えた空間（フロイデンタール・コンパクト化）はコンパクトになる。
:::

## 問題 {#graph:sec-ig-problems}

::: problem {#graph:prob-ig-countable-tree}
選択公理を使わずに、連結な可算グラフ $G$ が全域木をもつことを示せ。
:::

::: solution
$V(G)=\{x_{0},x_{1},\dots\}$ と並べる。$T_{0}\defeq\{x_{0}\}$ とし、$T_{n}$ が定まったとき、$V(T_{n})$ の外にあって $V(T_{n})$ の頂点と隣接する頂点が存在すれば、そのうち添字最小の $x_{j}$ と、それに隣接する $V(T_{n})$ の頂点のうち添字最小の $x_{i}$ をとり、$T_{n+1}\defeq T_{n}+x_{j}+x_{i}x_{j}$ とする（存在しなければ $T_{n+1}\defeq T_{n}$）。各 $T_{n}$ は（次数 1 の頂点を加えるだけなので）木で、$T\defeq\bigcup_{n}T_{n}$ は \ref{graph:infinite-spanning-tree} の Step 2 と同じ理由で木である。$T$ が全域的でないとすると、連結性から $V(T)$ の外に $V(T)$ と隣接する頂点があり、その添字を $j$ とする。$x_{j}$ はある $T_{n}$ の頂点と隣接するので、それ以降の各段階で添字 $j$ 以下の頂点が加えられ、有限回で $x_{j}$ が加えられる。矛盾。選択は添字最小という規則で決まっているので、選択公理は使わない。
:::

::: problem {#graph:prob-ig-almost-disjoint}
可算集合 $\N$ は、どの二つの共通部分も有限であるような非可算個の無限部分集合の族をもつことを示せ。（ヒント：有限 0–1 列の全体は可算である。）
:::

::: solution
有限 0–1 列の全体 $2^{<\N}$ は可算なので、$\N$ の代わりに $2^{<\N}$ で示せばよい。無限 0–1 列 $x\in\{0,1\}^{\N}$ ごとに $A_{x}\defeq\{x\restr{\{0,\dots,n-1\}} : n\in\N\}$（$x$ の始切片全体）とおくと、$A_{x}$ は無限集合である。$x\neq y$ なら最初に異なる位置 $n_{0}$ があり、長さ $n_{0}+1$ 以上の始切片は $x$ と $y$ で異なるので、$A_{x}\cap A_{y}$ は長さ $n_{0}$ 以下の始切片だけからなり有限。$x\mapsto A_{x}$ は単射なので、族 $\{A_{x}\}$ は連続体濃度、特に非可算である。
:::

::: problem {#graph:prob-ig-binary-tree}
根 $r$ をもつ二分木 $T_{2}$（頂点は有限 0–1 列、空列が根、$s$ は $s0$ と $s1$ に隣接）のエンドが無限 0–1 列と一対一に対応することを示せ。
:::

::: solution
**(a)** 頂点 $t$ の隣接頂点は、$t$ から最後の文字を除いた**親**（$t\neq\varnothing$ のとき）と、**子** $t0$, $t1$ である。半無限道 $R=x_{0}x_{1}\dots$ の頂点のうち長さ最小のもの $x_{i}$ をとる。$x_{i+1}$ は $x_{i}$ の親ではない（長さの最小性）ので子である。$j>i$ について $x_{j}$ が $x_{j-1}$ の子なら、$x_{j+1}\neq x_{j-1}$（頂点は相異なる）なので $x_{j+1}$ は $x_{j}$ の子である。帰納法により尾 $x_{i}x_{i+1}\dots$ は長さが 1 ずつ増える列で、ある無限 0–1 列 $x$ の始切片の列 $x\restr{\{0,\dots,n-1\}}$（$n\ge\abs{x_{i}}$）に一致する。$R$ の二つの尾から定まる $x$ は同じなので、$x$ は $R$ から一意に定まる。
**(b)** 同じ $x$ を定める半無限道は尾を共有するので同値。異なる $x\neq y$ について最初に異なる位置を $n_{0}$ とし、$S\defeq\{x\restr{\{0,\dots,n_{0}-1\}}\}$（共通の始切片の頂点 1 つ）を取り除くと、$x$ 側と $y$ 側の部分木は異なる成分に入るので同値でない。よって $x\mapsto$（$x$ の定めるエンド）は全単射である。
:::

::: problem {#graph:prob-ig-unfriendly}
頂点集合の 2 分割 $V=U\sqcup W$ で、各頂点について「自分と反対側の隣接頂点の数 $\ge$ 同じ側の隣接頂点の数」が成り立つものを**非友好的分割**という。(1) 有限グラフは非友好的分割をもつことを示せ。(2) 局所有限グラフ（無限でもよい）も非友好的分割をもつことを示せ。
:::

::: solution
**(1)** 分割は有限個なので、両側の間の辺の数が最大のものをとる。条件を満たさない頂点 $v$ があれば、$v$ を反対側に移すと間の辺の数が（同じ側の隣接数）$-$（反対側の隣接数）$>0$ だけ増え、最大性に反する。
**(2)** $X\defeq\{0,1\}^{V}$（コンパクト、\ref{top:tychonoff}）とし、各 $v$ について $A_{v}$ を「$v$ が条件を満たす分割」全体とする。$v$ の条件は $v$ と $N(v)$ の座標だけで決まり、**局所有限性**から $N(v)$ は有限なので $A_{v}$ は閉集合である。有限個の $v_{1},\dots,v_{r}$ について $F\defeq\{v_{1},\dots,v_{r}\}\cup N(v_{1})\cup\dots\cup N(v_{r})$ は有限で、(1) により $G[F]$ は非友好的分割をもつ。各 $v_{i}$ について $N_{G[F]}(v_{i})=N_{G}(v_{i})$ なので、それを任意に $V$ 全体へ延長したものは $A_{v_{1}}\cap\dots\cap A_{v_{r}}$ に属する。\ref{top:compact-equivalents} により $\bigcap_{v}A_{v}$ は空でなく、その元が求める分割である。
:::

::: supplement
**使わなかった前提・本質的でない前提.**
- ド・ブライン–エルデシュの定理の証明 1 は可算グラフに限るが、選択公理は（頂点の並べ方が与えられていれば）使わない。証明 2 は一般の場合に働くが、チコノフの定理を使う。ただし必要なのは「有限離散空間の直積がコンパクト」という特殊な場合だけで、これは選択公理より真に弱い超フィルター補題（ブール素イデアル定理）と同値であると一般には言われている（これは文献の知識で、このサイトでは証明していない）。
- 無限版ホールの定理で $A$ が可算の場合は、証明 1 と同様にケーニッヒの無限補題からも示せる。

**前提を変えると.**
- ド・ブライン–エルデシュの定理で $k$ を無限基数に変えると、非可算集合上の完全グラフの例のとおり成り立たない。
- 非友好的分割は、局所有限でない可算グラフについては一般には未解決（非友好的分割予想）とされている。非可算グラフでは非友好的分割をもたない例がある（S. Shelah と E. C. Milner による）と言われている。

**類似の定理.**
- \ref{logic:page-prop-compactness}と\ref{logic:binary-konig}は、このページのコンパクト性の議論と同じ構造をもつ。逆数学では、ケーニッヒの補題の強さが体系 $\mathsf{WKL}_{0}$, $\mathsf{ACA}_{0}$ の区別に対応する（\ref{logic:heine-borel-wkl}, \ref{logic:konig-aca}）。
- 有限部分の性質から全体の性質を導く「コンパクト性定理」は、ラドの選択補題、ゲーデルのコンパクト性定理（\ref{logic:compactness}）など多くの形がある。

**高い視点から：コンパクト性は「有限な非空集合の逆極限は空でない」.** ケーニッヒの無限補題は、有限で空でない集合 $V_{n}$ と写像 $f\colon V_{n}\to V_{n-1}$ からなる逆系
$$V_{0}\leftarrow V_{1}\leftarrow V_{2}\leftarrow\cdots$$
の逆極限 $\varprojlim V_{n}$（整合する列 $(v_{n})$ の集合）が空でない、という主張にほかならない。ド・ブライン–エルデシュの定理の証明 1 は、「有限部分グラフの彩色の集合」という有限集合の逆系に、これを適用したものである。添字が $\N$ でなく有限部分集合の有向集合になると、各段の集合に離散位相を入れた逆極限が空でないことをチコノフの定理で示すのが証明 2 であり、これは「有向集合で添字づけられた、有限で空でない集合の逆系の極限は空でない」という形の一般化である（逆極限としてできる空間は副有限集合、すなわちコンパクトで完全不連結なハウスドルフ空間になる）。比喩で言えば、無限に続くジグソーパズルの各有限部分に解があるとき、各部分の解の集合がどれも有限なら、全体に整合する解を選び出せる、というのがコンパクト性である。各部分の解が無限にありうると（$k$ が無限、または次数が無限）、どの解も先で行き詰まりうるので、この保証は失われる。
:::
