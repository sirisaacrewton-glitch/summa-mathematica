# グラフ理論（Graph Theory）

木と閉路空間、マッチングとフロー、メンガーの定理、平面グラフとクラトフスキーの定理、彩色、ハミルトン閉路、マイナーと木幅。

<p class="mn-msc">MSC2020: 05C</p>

## 分野
