# 演習：整擬順序と木幅 {#graph:page-exercises-minors-wqo keywords="exercises, graph theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界（等号の例・反例）を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-exminorswqo-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。
:::

## 整擬順序とクラスカルの木定理 {#graph:sec-wq-exercises}

対応するページ：\ref{graph:page-wqo-kruskal}

::: problem ★★ 標準：部分グラフ関係は整擬順序でない {#graph:ex-mi-subgraph-not-wqo}
有限な木全体は、部分グラフの関係（同型を除いて部分グラフとして含まれる）では整擬順序にならないことを示せ。クラスカルの木定理（位相的マイナーでは整擬順序）と比べよ。
:::

::: solution
$n\ge1$ について、長さ $n$ の道の両端に葉を 2 枚ずつ付けた木（両端が次数 3）を $D_{n}$ とする。$D_{n}$ は次数 3 の頂点をちょうど 2 つもち、その距離は $n$ である。$D_{m}\subseteq D_{n}$（$m\neq n$）とすると、$D_{m}$ の次数 3 の 2 頂点の像は $D_{n}$ で次数 3 以上なので、$D_{n}$ の次数 3 の 2 頂点に写る。$D_{m}$ のそれらを結ぶ長さ $m$ の道の像は、$D_{n}$ のそれらを結ぶ道であり、木では一意なのでその長さ $n$ に等しく、$m=n$ となり矛盾。よって $\{D_{n}\}$ は部分グラフについての無限反鎖である。位相的マイナーでは道を細分で伸ばせるので $D_{m}$ は $D_{n}$（$m\le n$）に含まれ、反鎖にならない。
:::

::: problem ★ 基本：$\N^{2}$ の反鎖 {#graph:ex-wq-n2-antichain}
$\N^{2}$（成分ごとの順序）には、どんな大きさの有限反鎖もあるが、無限反鎖はないことを示せ。
:::

::: solution
$\{(i,n-i): 0\le i\le n\}$ は大きさ $n+1$ の反鎖（$i<j$ なら第 1 成分は増え、第 2 成分は減る）。無限反鎖がないことは、$\N^{2}$ が \ref{graph:dickson-lemma} により整擬順序で、\ref{graph:wqo-equivalents} の 2 から従う。
:::

## 木分解と木幅 {#graph:sec-tw-exercises}

対応するページ：\ref{graph:page-tree-width}

::: problem ★★ 標準：完全二部グラフの木幅 {#graph:ex-mi-knm-treewidth}
$1\le a\le b$ について $\mathrm{tw}(K_{a,b})\le a$ を示せ。
:::

::: solution
$K_{a,b}$ の 2 つの側を $A$（$a$ 点）、$B=\{y_{1},\dots,y_{b}\}$ とする。道 $t_{1}\cdots t_{b}$ に部分 $V_{t_{i}}\defeq A\cup\{y_{i}\}$ をのせる。(T1) は明らか。辺 $xy_{i}$（$x\in A$）は $V_{t_{i}}$ に入る。$x\in A$ はすべての部分に、$y_{i}$ は $V_{t_{i}}$ だけに入るので、\ref{graph:t3-subtree} により (T3) も成り立つ。幅は $\abs{A\cup\{y_{i}\}}-1=a$。
:::

::: problem ★★★ 発展：木幅と最小次数 {#graph:ex-mi-tw-delta}
$\mathrm{tw}(G)\ge\delta(G)$ を示せ。
:::

::: solution
幅 $\mathrm{tw}(G)$ の木分解のうち、節点の数が最小のもの $(T,(V_{t}))$ をとる。$T$ が 1 節点なら $\mathrm{tw}(G)=n-1\ge\Delta(G)\ge\delta(G)$。そうでなければ葉 $t$ とその隣接節点 $s$ をとる。$V_{t}\subseteq V_{s}$ なら $t$ を除いても木分解のまま（(T1)(T2) は $V_{s}$ が引き継ぎ、(T3) は部分木を制限しても成り立つ）で幅も増えず、最小性に反する。よって $v\in V_{t}\setminus V_{s}$ がある。$t$ は葉で $s$ を通らずに他の節点へ行けないので、\ref{graph:t3-subtree} から $v$ を含む部分は $V_{t}$ だけ。(T2) により $v$ の各辺 $vw$ はある部分に入るが、それは $V_{t}$ でしかありえないので、$N(v)\subseteq V_{t}$。よって $\abs{V_{t}}\ge d(v)+1\ge\delta(G)+1$ で、$\mathrm{tw}(G)\ge\delta(G)$。
:::

## グラフマイナー定理の概観 {#graph:sec-gmt-exercises}

対応するページ：\ref{graph:page-graph-minor-theorem}

::: problem ★ 基本：頂点数の上限 {#graph:ex-gmt-order}
性質「頂点が $k$ 個以下」はマイナーで閉じており、そのクラトフスキー集合は $\{\overline{K^{k+1}}\}$（辺のない $k+1$ 頂点のグラフ）であることを示せ。
:::

::: solution
マイナーの頂点数は元の頂点数以下（分岐集合は交わらない）なので閉じている。$k+1$ 個以上の頂点をもつグラフは、辺をすべて除き頂点を $k+1$ 個残すと $\overline{K^{k+1}}$ になるので、$\overline{K^{k+1}}$ をマイナーにもつ。$\overline{K^{k+1}}$ の真のマイナーは頂点が $k$ 個以下なので、性質をもたない極小なグラフは $\overline{K^{k+1}}$ だけである（\ref{graph:forbidden-minor-characterization}）。
:::

::: problem ★★ 標準：辺の数の上限 {#graph:ex-gmt-size}
性質「辺が $k$ 本以下」のクラトフスキー集合は、辺がちょうど $k+1$ 本で孤立点をもたないグラフ全体であることを示せ。
:::

::: solution
マイナーの辺の数は元の辺の数以下（分岐集合の間の辺を 1 本ずつ選ぶと単射）なので、性質はマイナーで閉じている。辺が $k+1$ 本以上のグラフ $G$ は、辺を $k+1$ 本残して他の辺と孤立点を除くと、辺 $k+1$ 本で孤立点のないグラフをマイナー（部分グラフ）にもつ。そのようなグラフ $H$ の真のマイナーは、辺の削除・縮約（辺が減る）か、孤立していない頂点の削除（辺が減る）か、それらの組合せで得られ（\ref{graph:minor-deletion-contraction}）、辺は $k$ 本以下になる。孤立点を除くだけの操作は $H$ には適用できない（孤立点がない）。よって極小なものはちょうどこれらのグラフである。
:::
