# 演習：グラフ理論 {#graph:page-exercises-graph-theory keywords="exercises, graph theory"}

グラフ理論の各系列の内容を使う演習を、系列の順に並べた。各ページ末尾の「問題」はそのページの確認で、ここには、二つ以上の結果を組み合わせるものや、定理の限界（等号の例・反例）を確かめるものを集めた。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-exgr-notation}

::: notation
- 記号は各節の見出しの下に示したページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。次数・最小次数・最大次数は $d(v)$, $\delta(G)$, $\Delta(G)$（\ref{graph:degree}）。
- 補グラフ $\overline{G}$ は、同じ頂点集合で、$G$ で隣接しない 2 頂点を結んだグラフ（\ref{graph:page-perfect-graphs}）。
- 体系は $\ZF$。無限グラフの節では $\ZFC$ を使う。
:::

## グラフの基本 {#graph:sec-exgr-basics}

対応するページ：\ref{graph:page-graphs}・\ref{graph:page-trees-bipartite}

::: problem ★ 基本：最大次数と葉の数 {#graph:ex-gr-leaves}
$n\ge2$ 頂点の木 $T$ は、少なくとも $\Delta(T)$ 個の葉をもつことを示せ。
:::

::: solution
葉の数を $L$ とし、次数 $\Delta\defeq\Delta(T)$ の頂点 $v$ をとる。$n\ge2$ なら $T$ は連結で辺をもつので $\Delta\ge1$。$\Delta=1$ なら $T=K^{2}$ で葉は 2 個。$\Delta\ge2$ なら $v$ は葉でなく、$v$ 以外の葉でない $n-1-L$ 個の頂点の次数は 2 以上なので、\ref{graph:handshake}と木の辺数 $n-1$（\ref{graph:tree-characterization}）から
$$2(n-1)=\sum_{u}d(u)\ge L+\Delta+2(n-1-L)=2(n-1)-L+\Delta.$$
よって $L\ge\Delta$。等号は、たとえば星 $K_{1,\Delta}$ や、中心から長さの等しい道を $\Delta$ 本出した「蜘蛛」で成り立つ。
:::

::: problem ★★ 標準：超立方体 {#graph:ex-gr-hypercube}
$d\ge1$ について、$\{0,1\}^{d}$ を頂点集合とし、ちょうど 1 成分だけ異なる 2 点を結んだグラフを**超立方体** $Q_{d}$ という。(1) $Q_{d}$ は二部グラフであることを示せ。(2) $d\ge2$ なら $Q_{d}$ はハミルトン閉路をもつことを示せ。
:::

::: solution
**(1)** 成分の和の偶奇で頂点を 2 つに分けると、隣接する 2 点は和が 1 だけ違うので、異なる側にある（\ref{graph:bipartite}）。
**(2)** $d$ の帰納法。$Q_{2}$ は 4 頂点の閉路。$Q_{d}$（$d\ge3$）は最後の成分が $0$ の部分 $Q^{0}$ と $1$ の部分 $Q^{1}$（どちらも $Q_{d-1}$ と同型）と、対応する点 $x0$, $x1$ を結ぶ辺からなる。帰納法の仮定から $Q_{d-1}$ のハミルトン閉路 $C$ があり、その辺 $uv$ を一つ選ぶ。$C-uv$ は $u$ と $v$ を結ぶハミルトン道 $P$ である。$Q^{0}$ の中の $P$ の像（$u0$ から $v0$）、辺 $v0\,v1$、$Q^{1}$ の中の $P$ の像を逆にたどる道（$v1$ から $u1$）、辺 $u1\,u0$ をつなぐと、$Q_{d}$ のすべての頂点を一度ずつ通る閉路になる。
:::

## マッチングと連結度 {#graph:sec-exgr-matching}

対応するページ：\ref{graph:page-bipartite-matching}・\ref{graph:page-general-matching}・\ref{graph:page-menger}・\ref{graph:page-dilworth}

::: problem ★ 基本：2 連結グラフの 2 点を通る閉路 {#graph:ex-mf-two-vertices-cycle}
2 連結グラフ（$n\ge3$）の任意の 2 頂点は、ある閉路の上に同時にあることを示せ。
:::

::: solution
ホイットニーの定理（\ref{graph:whitney-k-connected}）で $k=2$ とすると、2 頂点 $x\neq y$ は 2 本の独立な道（内部で交わらない $x$–$y$ 道）$P_{1},P_{2}$ で結ばれる。2 本のうち少なくとも一方は長さ 2 以上（単純グラフで辺 $xy$ は高々 1 本）なので、$P_{1}\cup P_{2}$ は頂点 3 個以上の閉路で、$x,y$ を通る。
:::

::: problem ★★★ 発展：木の完全マッチング {#graph:ex-mf-tree-perfect-matching}
木 $T$（$n\ge2$）が完全マッチングをもつことと、すべての頂点 $v$ について $T-v$ の奇数個の頂点をもつ連結成分がちょうど 1 個であることは同値であることを示せ。
:::

::: solution
**(⇒)** 完全マッチング $M$ があれば $n$ は偶数。$v$ の $M$ での相手を $u$ とする。$T-v$ の成分のうち $u$ を含まないものは、その頂点が $M$ によって成分の中で対になる（成分の外の頂点と結ぶ $M$ の辺は $v$ を通るが、$v$ は $u$ と対になっている）ので偶数個の頂点をもつ。$T-v$ の頂点数 $n-1$ は奇数なので、$u$ を含む成分は奇数個の頂点をもち、奇数成分はちょうど 1 個である。
**(⇐)** $n-1$ は「1 個の奇数と偶数たち」の和で奇数なので、$n$ は偶数。$v$ ごとに、$T-v$ の唯一の奇数成分 $C_{v}$ をとる。$T$ は木なので $C_{v}$ は $v$ のちょうど 1 つの隣接頂点 $u(v)$ を含む（成分ごとに $v$ と結ぶ辺は 1 本）。【主張：$u(u(v))=v$】$u\defeq u(v)$ とし、$T-uv$ の $v$ 側を $A$、$u$ 側を $B$ とする。$T-v$ の $u$ を含む成分は $B$ そのものなので $\abs{B}$ は奇数、$\abs{A}=n-\abs{B}$ も奇数。$T-u$ の $v$ を含む成分は $A$ で奇数なので、$u(u)=v$。したがって辺 $\{v,u(v)\}$ の全体は、各頂点をちょうど 1 回ずつ含み、完全マッチングになる。
:::

::: problem ★ 基本：鎖か反鎖 {#graph:ex-mf-chain-antichain}
$ab+1$ 個の元をもつ半順序集合は、$a+1$ 個の元からなる鎖か $b+1$ 個の元からなる反鎖を含むことを示せ。
:::

::: solution
鎖の大きさの最大値を $h$ とする。\ref{graph:mirsky}により、全体は $h$ 個の反鎖で覆える。$h\le a$ なら、$ab+1$ 個の元が $a$ 個以下の反鎖に分かれるので、鳩の巣原理によりある反鎖は $b+1$ 個以上の元をもつ。
:::

## 平面グラフ {#graph:sec-exgr-planarity}

対応するページ：\ref{graph:page-plane-graphs}・\ref{graph:page-kuratowski}

::: problem ★ 基本：平面二部グラフの小さい次数 {#graph:ex-pl-bipartite-degree}
$n\ge3$ 頂点の平面的な二部グラフは、次数 3 以下の頂点をもつことを示せ。
:::

::: solution
二部グラフは奇閉路をもたず（\ref{graph:bipartite-odd-cycle}）、特に三角形を含まないので、\ref{graph:planar-edge-bound} の 2 から $m\le2n-4$。すべての頂点の次数が 4 以上なら、握手補題から $2m\ge4n$, $m\ge2n$ となり矛盾。
:::

::: problem ★★ 標準：平面性と補グラフ {#graph:ex-pl-complement}
$n\ge11$ 頂点のグラフ $G$ について、$G$ と補グラフ $\overline{G}$ の少なくとも一方は平面的でないことを示せ。
:::

::: solution
両方が平面的なら、\ref{graph:planar-edge-bound} の 1 から $\norm{G}+\norm{\overline{G}}\le2(3n-6)$。一方、$\norm{G}+\norm{\overline{G}}=\binom{n}{2}$。$\binom{n}{2}\le6n-12$ は $n^{2}-13n+24\le0$ と同値で、その解は $n\le\frac{13+\sqrt{73}}{2}<10.8$。よって $n\ge11$ では成り立たない。
:::

## 彩色 {#graph:sec-exgr-coloring}

対応するページ：\ref{graph:page-vertex-coloring}・\ref{graph:page-edge-list-coloring}

::: problem ★★ 標準：ノルトハウス–ガダムの不等式 {#graph:ex-co-nordhaus-gaddum}
$n$ 頂点のグラフ $G$ について $\chi(G)\chi(\overline{G})\ge n$ と $\chi(G)+\chi(\overline{G})\le n+1$ を示せ。
:::

::: solution
**積.** $G$ の色クラスは $G$ の独立集合なので $\overline{G}$ のクリークであり、$\overline{G}$ の頂点彩色では全員が別の色をもつから、大きさは $\chi(\overline{G})$ 以下。$\chi(G)$ 個の色クラスで $n$ 頂点を覆うので $n\le\chi(G)\chi(\overline{G})$。
**和.** $n$ の帰納法。$n=1$ では $1+1=2$。$n\ge2$ で頂点 $v$ をとり、$G'\defeq G-v$ とすると $\overline{G'}=\overline{G}-v$。帰納法の仮定から $\chi(G')+\chi(\overline{G'})\le n$。$v$ に新しい色を与えれば $\chi(G)\le\chi(G')+1$、同様に $\chi(\overline{G})\le\chi(\overline{G'})+1$。両方で等号なら、$G'$ の最適な彩色に $v$ を加えられないので $v$ はすべての色の頂点と隣接し $d_{G}(v)\ge\chi(G')$、同様に $d_{\overline{G}}(v)\ge\chi(\overline{G'})$。$d_{G}(v)+d_{\overline{G}}(v)=n-1$ なので $\chi(G')+\chi(\overline{G'})\le n-1$、よって $\chi(G)+\chi(\overline{G})\le n+1$。等号でない場合は $\chi(G)+\chi(\overline{G})\le\chi(G')+\chi(\overline{G'})+1\le n+1$。
:::

::: problem ★★ 標準：完全グラフの辺彩色 {#graph:ex-co-complete-edge}
$m\ge1$ について $\chi'(K^{2m})=2m-1$ を示せ。（$K^{2m-1}$ については $\chi'=2m-1$ となる。）
:::

::: solution
$\Delta(K^{2m})=2m-1$ なので $\chi'\ge2m-1$。頂点を $\infty$ と $\mathbb{Z}/(2m-1)$ の元とする。色 $i\in\mathbb{Z}/(2m-1)$ に、辺 $\infty i$ と辺 $\{i-j,i+j\}$（$j=1,\dots,m-1$）を割り当てる。$2m-1$ は奇数なので $2$ は $\mathbb{Z}/(2m-1)$ で可逆であり、$a\neq b$ の辺 $\{a,b\}$ は $a+b=2i$ を満たす唯一の $i$ の色をもつ（$j=\pm(a-i)$ は $j\neq0$）。辺 $\infty a$ は色 $a$。各色の辺は $\infty,i,i\pm1,\dots,i\pm(m-1)$（$1\le j,j'\le m-1$ なら $j+j'\not\equiv0$ なので相異なる）を 1 回ずつ使う完全マッチングで、各辺はちょうど一つの色をもつので、これは $2m-1$ 色の辺彩色である。後半：$K^{2m-1}$ は各色クラスが高々 $m-1$ 本の辺からなり、辺は $(2m-1)(m-1)$ 本なので $2m-1$ 色が必要で、上の彩色から $\infty$ を除けば $2m-1$ 色で足りる。
:::

## ハミルトン閉路と無限グラフ {#graph:sec-exgr-hamilton-infinite}

対応するページ：\ref{graph:page-hamilton-cycles}・\ref{graph:page-infinite-graphs}

::: problem ★★ 標準：辺の多いグラフはハミルトン的 {#graph:ex-hi-many-edges}
$n\ge3$ 頂点で $m\ge\binom{n-1}{2}+2$ 本の辺をもつグラフはハミルトン的であることを示せ。また $\binom{n-1}{2}+1$ 本では成り立たない例を挙げよ。
:::

::: solution
隣接しない $u,v$ をとる。$G-\{u,v\}$ の辺は $\binom{n-2}{2}$ 本以下なので、$u$ または $v$ に接続する辺は $m-\binom{n-2}{2}\ge\binom{n-1}{2}-\binom{n-2}{2}+2=n$ 本以上。$uv\notin E$ なので、その本数は $d(u)+d(v)$ に等しく、$d(u)+d(v)\ge n$。オーレの定理（\ref{graph:ore-dirac}）によりハミルトン的。例：$K^{n-1}$ に新しい頂点を 1 本の辺で付けたグラフは辺 $\binom{n-1}{2}+1$ 本で、次数 1 の頂点があるのでハミルトン閉路をもたない。
:::

::: problem ★ 基本：無限二部グラフ {#graph:ex-hi-infinite-bipartite}
（$\ZFC$）グラフ $G$（無限でもよい）が奇閉路を含まなければ、$G$ は二部グラフ（2 彩色可能）であることを、ド・ブライン–エルデシュの定理を使って示せ。
:::

::: solution
$G$ の有限部分グラフは奇閉路を含まないので、\ref{graph:bipartite-odd-cycle} により 2 彩色可能。\ref{graph:de-bruijn-erdos} を $k=2$ で使えば $G$ も 2 彩色可能。（閉路は有限なので、この場合は連結成分ごとに 1 点からの距離の偶奇で塗る直接の証明もある。）
:::

## 整擬順序と木幅 {#graph:sec-exgr-minors}

対応するページ：\ref{graph:page-wqo-kruskal}・\ref{graph:page-tree-width}

::: problem ★★ 標準：完全二部グラフの木幅 {#graph:ex-mi-knm-treewidth}
$1\le a\le b$ について $\mathrm{tw}(K_{a,b})\le a$ を示せ。
:::

::: solution
$K_{a,b}$ の 2 つの側を $A$（$a$ 点）、$B=\{y_{1},\dots,y_{b}\}$ とする。道 $t_{1}\cdots t_{b}$ に部分 $V_{t_{i}}\defeq A\cup\{y_{i}\}$ をのせる。(T1) は明らか。辺 $xy_{i}$（$x\in A$）は $V_{t_{i}}$ に入る。$x\in A$ はすべての部分に、$y_{i}$ は $V_{t_{i}}$ だけに入るので、\ref{graph:t3-subtree} により (T3) も成り立つ。幅は $\abs{A\cup\{y_{i}\}}-1=a$。
:::

::: problem ★★★ 発展：木幅と最小次数 {#graph:ex-mi-tw-delta}
$\mathrm{tw}(G)\ge\delta(G)$ を示せ。
:::

::: solution
幅 $\mathrm{tw}(G)$ の木分解のうち、節点の数が最小のもの $(T,(V_{t}))$ をとる。$T$ が 1 節点なら $\mathrm{tw}(G)=n-1\ge\Delta(G)\ge\delta(G)$。そうでなければ葉 $t$ とその隣接節点 $s$ をとる。$V_{t}\subseteq V_{s}$ なら $t$ を除いても木分解のまま（(T1)(T2) は $V_{s}$ が引き継ぎ、(T3) は部分木を制限しても成り立つ）で幅も増えず、最小性に反する。よって $v\in V_{t}\setminus V_{s}$ がある。$t$ は葉で $s$ を通らずに他の節点へ行けないので、\ref{graph:t3-subtree} から $v$ を含む部分は $V_{t}$ だけ。(T2) により $v$ の各辺 $vw$ はある部分に入るが、それは $V_{t}$ でしかありえないので、$N(v)\subseteq V_{t}$。よって $\abs{V_{t}}\ge d(v)+1\ge\delta(G)+1$ で、$\mathrm{tw}(G)\ge\delta(G)$。
:::

::: problem ★★ 標準：部分グラフ関係は整擬順序でない {#graph:ex-mi-subgraph-not-wqo}
有限な木全体は、部分グラフの関係（同型を除いて部分グラフとして含まれる）では整擬順序にならないことを示せ。クラスカルの木定理（位相的マイナーでは整擬順序）と比べよ。
:::

::: solution
$n\ge1$ について、長さ $n$ の道の両端に葉を 2 枚ずつ付けた木（両端が次数 3）を $D_{n}$ とする。$D_{n}$ は次数 3 の頂点をちょうど 2 つもち、その距離は $n$ である。$D_{m}\subseteq D_{n}$（$m\neq n$）とすると、$D_{m}$ の次数 3 の 2 頂点の像は $D_{n}$ で次数 3 以上なので、$D_{n}$ の次数 3 の 2 頂点に写る。$D_{m}$ のそれらを結ぶ長さ $m$ の道の像は、$D_{n}$ のそれらを結ぶ道であり、木では一意なのでその長さ $n$ に等しく、$m=n$ となり矛盾。よって $\{D_{n}\}$ は部分グラフについての無限反鎖である。位相的マイナーでは道を細分で伸ばせるので $D_{m}$ は $D_{n}$（$m\le n$）に含まれ、反鎖にならない。
:::
