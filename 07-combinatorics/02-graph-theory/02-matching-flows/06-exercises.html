# 演習：マッチングとフロー {#graph:page-exercises-matching-flows keywords="exercises, graph theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界（等号の例・反例）を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-exmatchingflows-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。
:::

## 二部グラフのマッチング {#graph:sec-bm-exercises}

対応するページ：\ref{graph:page-bipartite-matching}

::: problem ★ 基本：欠けたチェス盤 {#graph:ex-bm-chessboard}
$8\times8$ のチェス盤から対角の 2 隅のマスを除いた 62 マスは、$1\times2$ のドミノで敷き詰められないことを示せ。マッチングの言葉で述べ直せ。
:::

::: solution
隣り合うマスを結んだグラフは、マスの色（白・黒）で二部グラフであり、敷き詰めは完全マッチングにあたる。対角の 2 隅は同じ色なので、残りは一方の色が 30 マス、他方が 32 マス。完全マッチングでは両側の個数が等しくなければならないので、存在しない。
:::

::: problem ★★ 標準：次数の条件による結婚条件 {#graph:ex-bm-degree-condition}
二部分割 $\{A,B\}$ の二部グラフで、ある $d\ge1$ について $A$ のすべての頂点の次数が $d$ 以上、$B$ のすべての頂点の次数が $d$ 以下なら、$A$ のマッチングが存在することを示せ。
:::

::: solution
$S\subseteq A$ について、$S$ から出る辺は $d\abs{S}$ 本以上で、それらはすべて $N(S)$ に入り、$N(S)$ の各頂点が受け取る辺は $d$ 本以下なので $d\abs{S}\le d\abs{N(S)}$。よって結婚条件が成り立ち、\ref{graph:hall-theorem} から $A$ のマッチングがある。（$d$ 正則な二部グラフの場合が \ref{graph:regular-bipartite-factor} の前半。）
:::

## 一般のグラフのマッチング {#graph:sec-gm-exercises}

対応するページ：\ref{graph:page-general-matching}

::: problem ★★★ 発展：木の完全マッチング {#graph:ex-mf-tree-perfect-matching}
木 $T$（$n\ge2$）が完全マッチングをもつことと、すべての頂点 $v$ について $T-v$ の奇数個の頂点をもつ連結成分がちょうど 1 個であることは同値であることを示せ。
:::

::: solution
**(⇒)** 完全マッチング $M$ があれば $n$ は偶数。$v$ の $M$ での相手を $u$ とする。$T-v$ の成分のうち $u$ を含まないものは、その頂点が $M$ によって成分の中で対になる（成分の外の頂点と結ぶ $M$ の辺は $v$ を通るが、$v$ は $u$ と対になっている）ので偶数個の頂点をもつ。$T-v$ の頂点数 $n-1$ は奇数なので、$u$ を含む成分は奇数個の頂点をもち、奇数成分はちょうど 1 個である。
**(⇐)** $n-1$ は「1 個の奇数と偶数たち」の和で奇数なので、$n$ は偶数。$v$ ごとに、$T-v$ の唯一の奇数成分 $C_{v}$ をとる。$T$ は木なので $C_{v}$ は $v$ のちょうど 1 つの隣接頂点 $u(v)$ を含む（成分ごとに $v$ と結ぶ辺は 1 本）。【主張：$u(u(v))=v$】$u\defeq u(v)$ とし、$T-uv$ の $v$ 側を $A$、$u$ 側を $B$ とする。$T-v$ の $u$ を含む成分は $B$ そのものなので $\abs{B}$ は奇数、$\abs{A}=n-\abs{B}$ も奇数。$T-u$ の $v$ を含む成分は $A$ で奇数なので、$u(u)=v$。したがって辺 $\{v,u(v)\}$ の全体は、各頂点をちょうど 1 回ずつ含み、完全マッチングになる。
:::

::: problem ★ 基本：星のタット–ベルジュ {#graph:ex-gm-star}
星 $K_{1,n}$（$n\ge1$）の最大マッチングの辺の数が 1 であることを、\ref{graph:tutte-berge} の式で $T$ を中心だけの集合にとって確かめよ。
:::

::: solution
$T=\{z\}$（中心）とすると $G-T$ は $n$ 個の孤立点で、奇数個の頂点をもつ成分は $n$ 個。$q(G-T)-\abs{T}=n-1$ なので、式の値は $\frac12(n+1-(n-1))=1$ 以下。辺が 1 本あるので、最大マッチングはちょうど 1 本（式の最大値は $T=\{z\}$ で達成される）。
:::

## ネットワークの流れ {#graph:sec-nf-exercises}

対応するページ：\ref{graph:page-network-flows}

::: problem ★★ 標準：頂点の容量 {#graph:ex-nf-vertex-capacity}
有向グラフの $s,t$ 以外の各頂点 $v$ を、弧 $v^{-}\to v^{+}$（容量 1）でつないだ 2 頂点 $v^{-},v^{+}$ に分け、$v$ に入る弧を $v^{-}$ へ、$v$ から出る弧を $v^{+}$ から出すように付け替える（元の弧の容量は十分大きい整数）。この新しいネットワークの最大流の値が、$s$ から $t$ への内部の頂点を共有しない有向道の最大本数に等しいことを説明せよ。
:::

::: solution
整数の最大流（\ref{graph:max-flow-min-cut}）は、値 1 の弧からなる $s$–$t$ 有向道に分解でき、各 $v^{-}\to v^{+}$ の容量が 1 なので、異なる道は内部の頂点を共有しない（各道を元のグラフに戻すと、$v^{-}v^{+}$ を $v$ に潰した道になる）。逆に内部で交わらない道の族は、各道に沿って値 1 を流せば流れになる。よって両者の最大値は等しい。（最小カットのほうは、容量 1 の弧 $v^{-}v^{+}$ だけからなるとしてよく、$s$ と $t$ を分ける頂点集合にあたる。これがメンガーの定理の有向版である。）
:::

::: problem ★ 基本：整数でない最大流 {#graph:ex-nf-nonintegral}
弧と容量 $s\to a$:1, $s\to b$:1, $a\to c$:1, $b\to c$:1, $c\to t$:1 のネットワークで、最大流の値を求め、整数でない値をもつ最大流があることを確かめよ。（\ref{graph:max-flow-min-cut} が保証するのは、整数の最大流が「存在する」ことだけである。）
:::

::: solution
カット $\{s,a,b,c\}$ の容量は弧 $c\to t$ の 1 なので、値は 1 以下。$s\to a\to c\to t$ に 1 を流せば値 1 で最大。$s\to a$, $a\to c$, $s\to b$, $b\to c$ に $\frac12$、$c\to t$ に 1 を流しても、各頂点で流入と流出が等しく容量を超えないので、値 1 の最大流である。
:::

## 連結度とメンガーの定理 {#graph:sec-me-exercises}

対応するページ：\ref{graph:page-menger}

::: problem ★ 基本：完全二部グラフの連結度 {#graph:ex-me-kmn}
$1\le m\le n$, $n\ge2$ について $\kappa(K_{m,n})=m$ を示せ。
:::

::: solution
$m$ 点側を除くと $n\ge2$ 個の孤立点が残り非連結なので $\kappa\le m$。$\abs{X}<m$ の $X$ を除くと、両側に頂点が残り、残った頂点はどれも反対側の残った頂点と隣接するので連結。$\abs{K_{m,n}}=m+n>m$ なので、\ref{graph:connectivity} から $\kappa=m$。
:::

::: problem ★ 基本：橋と閉路 {#graph:ex-me-bridge}
連結グラフの辺 $e$ について、$e$ が橋（除くと非連結になる辺）であることと、$e$ がどの閉路にも含まれないことは同値であることを示せ。したがって、2 辺連結であることと、すべての辺が閉路に含まれることは同値である（$n\ge2$）。
:::

::: solution
$e=uv$ が閉路 $C$ に含まれれば、$C-e$ は $u$–$v$ 道なので、$G-e$ の中で $e$ を使っていた歩道は迂回でき連結のまま。逆に $G-e$ が連結なら $u$–$v$ 道 $P$ があり、$P+e$ は $e$ を含む閉路。後半は \ref{graph:connectivity} の 2 辺連結の定義（1 本の辺を除いても連結）による。
:::

## 道被覆とディルワースの定理 {#graph:sec-dw-exercises}

対応するページ：\ref{graph:page-dilworth}

::: problem ★ 基本：鎖か反鎖 {#graph:ex-mf-chain-antichain}
$ab+1$ 個の元をもつ半順序集合は、$a+1$ 個の元からなる鎖か $b+1$ 個の元からなる反鎖を含むことを示せ。
:::

::: solution
鎖の大きさの最大値を $h$ とする。\ref{graph:mirsky}により、全体は $h$ 個の反鎖で覆える。$h\le a$ なら、$ab+1$ 個の元が $a$ 個以下の反鎖に分かれるので、鳩の巣原理によりある反鎖は $b+1$ 個以上の元をもつ。
:::

::: problem ★ 基本：平方根の評価 {#graph:ex-dw-sqrt}
$n$ 個の元をもつ半順序集合は、大きさ $\lceil\sqrt{n}\,\rceil$ 以上の鎖か反鎖を含むことを示せ。
:::

::: solution
鎖の最大の大きさを $h$ とすると、\ref{graph:mirsky} により全体は $h$ 個の反鎖で覆えるので、ある反鎖は $n/h$ 個以上の元をもつ。$h<\sqrt{n}$ なら $n/h>\sqrt{n}$。どちらの場合も大きさ $\sqrt{n}$ 以上、整数なので $\lceil\sqrt{n}\,\rceil$ 以上。
:::
