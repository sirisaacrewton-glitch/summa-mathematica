# 演習：彩色 {#graph:page-exercises-coloring keywords="exercises, graph theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界（等号の例・反例）を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#graph:sec-excoloring-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは（無限グラフの節を除き）有限・単純で、$n=\abs{G}$, $m=\norm{G}$。
:::

## 頂点彩色 {#graph:sec-vc-exercises}

対応するページ：\ref{graph:page-vertex-coloring}

::: problem ★★ 標準：ノルトハウス–ガダムの不等式 {#graph:ex-co-nordhaus-gaddum}
$n$ 頂点のグラフ $G$ について $\chi(G)\chi(\overline{G})\ge n$ と $\chi(G)+\chi(\overline{G})\le n+1$ を示せ。
:::

::: solution
**積.** $G$ の色クラスは $G$ の独立集合なので $\overline{G}$ のクリークであり、$\overline{G}$ の頂点彩色では全員が別の色をもつから、大きさは $\chi(\overline{G})$ 以下。$\chi(G)$ 個の色クラスで $n$ 頂点を覆うので $n\le\chi(G)\chi(\overline{G})$。
**和.** $n$ の帰納法。$n=1$ では $1+1=2$。$n\ge2$ で頂点 $v$ をとり、$G'\defeq G-v$ とすると $\overline{G'}=\overline{G}-v$。帰納法の仮定から $\chi(G')+\chi(\overline{G'})\le n$。$v$ に新しい色を与えれば $\chi(G)\le\chi(G')+1$、同様に $\chi(\overline{G})\le\chi(\overline{G'})+1$。両方で等号なら、$G'$ の最適な彩色に $v$ を加えられないので $v$ はすべての色の頂点と隣接し $d_{G}(v)\ge\chi(G')$、同様に $d_{\overline{G}}(v)\ge\chi(\overline{G'})$。$d_{G}(v)+d_{\overline{G}}(v)=n-1$ なので $\chi(G')+\chi(\overline{G'})\le n-1$、よって $\chi(G)+\chi(\overline{G})\le n+1$。等号でない場合は $\chi(G)+\chi(\overline{G})\le\chi(G')+\chi(\overline{G'})+1\le n+1$。
:::

::: problem ★ 基本：ペテルセングラフの彩色数 {#graph:ex-vc-petersen}
ペテルセングラフ（外側の 5 角形 $a_{0}\cdots a_{4}$、スポーク $a_{i}b_{i}$、内側で $b_{i}$ と $b_{i+2}$ が隣接）の彩色数が 3 であることを示せ。
:::

::: solution
5 角形は奇閉路なので 2 色では塗れず（\ref{graph:bipartite-odd-cycle}）、$\chi\ge3$。$(a_{0},\dots,a_{4})\mapsto(1,2,1,2,3)$, $(b_{0},\dots,b_{4})\mapsto(2,1,3,3,2)$ とすると、外側の隣り合う色は異なり、スポーク $a_{i}b_{i}$ は $(1,2),(2,1),(1,3),(2,3),(3,2)$、内側の辺 $b_{i}b_{i+2}$ は $(2,3),(1,3),(3,2),(3,2),(2,1)$ でどれも異なる。
:::

## 辺彩色とリスト彩色 {#graph:sec-el-exercises}

対応するページ：\ref{graph:page-edge-list-coloring}

::: problem ★★ 標準：完全グラフの辺彩色 {#graph:ex-co-complete-edge}
$m\ge1$ について $\chi'(K^{2m})=2m-1$ を示せ。（$K^{2m-1}$ については $\chi'=2m-1$ となる。）
:::

::: solution
$\Delta(K^{2m})=2m-1$ なので $\chi'\ge2m-1$。頂点を $\infty$ と $\mathbb{Z}/(2m-1)$ の元とする。色 $i\in\mathbb{Z}/(2m-1)$ に、辺 $\infty i$ と辺 $\{i-j,i+j\}$（$j=1,\dots,m-1$）を割り当てる。$2m-1$ は奇数なので $2$ は $\mathbb{Z}/(2m-1)$ で可逆であり、$a\neq b$ の辺 $\{a,b\}$ は $a+b=2i$ を満たす唯一の $i$ の色をもつ（$j=\pm(a-i)$ は $j\neq0$）。辺 $\infty a$ は色 $a$。各色の辺は $\infty,i,i\pm1,\dots,i\pm(m-1)$（$1\le j,j'\le m-1$ なら $j+j'\not\equiv0$ なので相異なる）を 1 回ずつ使う完全マッチングで、各辺はちょうど一つの色をもつので、これは $2m-1$ 色の辺彩色である。後半：$K^{2m-1}$ は各色クラスが高々 $m-1$ 本の辺からなり、辺は $(2m-1)(m-1)$ 本なので $2m-1$ 色が必要で、上の彩色から $\infty$ を除けば $2m-1$ 色で足りる。
:::

::: problem ★ 基本：$K_{3,3}$ の辺彩色 {#graph:ex-el-k33}
$K_{3,3}$（両側 $\{a_{0},a_{1},a_{2}\}$, $\{b_{0},b_{1},b_{2}\}$）の辺を 3 色で塗り分ける方法を一つ与えよ。
:::

::: solution
辺 $a_{i}b_{j}$ に色 $i+j\bmod3$ を与える。$a_{i}$ に接続する 3 辺の色は $j$ が動くので相異なり、$b_{j}$ についても同様。$\Delta=3$ なので $\chi'(K_{3,3})=3$（\ref{graph:konig-edge-colouring} と一致）。これはラテン方陣 $L_{ij}=i+j\bmod3$ にあたる。
:::

## パーフェクトグラフ {#graph:sec-pf-exercises}

対応するページ：\ref{graph:page-perfect-graphs}

::: problem ★★ 標準：二部グラフの線グラフ {#graph:ex-pf-line-graph}
二部グラフ $B$ の**線グラフ** $L(B)$（$B$ の辺を頂点とし、端点を共有する 2 辺を結ぶ）はパーフェクトグラフであることを示せ。
:::

::: solution
$L(B)$ の誘導部分グラフは、$B$ のある部分グラフ $B'$ の線グラフ $L(B')$ で、$B'$ も二部グラフ。$L(B')$ の頂点彩色は $B'$ の辺彩色なので $\chi(L(B'))=\chi'(B')=\Delta(B')$（\ref{graph:konig-edge-colouring}）。一方、1 頂点に接続する $\Delta(B')$ 本の辺は $L(B')$ でクリークをなすので $\omega(L(B'))\ge\Delta(B')$、また $\omega\le\chi$。よって $\chi(L(B'))=\omega(L(B'))$（$B'$ に辺がなければ自明）。
:::

::: problem ★ 基本：奇数の反穴 {#graph:ex-pf-antihole}
$C_{7}$ の補グラフ $\overline{C_{7}}$ はパーフェクトでないことを示せ。
:::

::: solution
$C_{7}$ は奇穴なのでパーフェクトでない（\ref{graph:odd-hole-imperfect}）。\ref{graph:perfect-graph-theorem} により、パーフェクトグラフの補グラフはパーフェクトなので、$\overline{C_{7}}$ がパーフェクトなら $C_{7}=\overline{\overline{C_{7}}}$ もパーフェクトになり矛盾。
:::

## フローと彩色 {#graph:sec-fl-exercises}

対応するページ：\ref{graph:page-flows-coloring}

::: problem ★ 基本：偶グラフの 2 フロー {#graph:ex-fl-even}
すべての頂点の次数が偶数のグラフは、どこでも 0 でない $\mathbb{Z}_{2}$ フローをもつことを示せ。
:::

::: solution
任意の向きを付け、すべての辺に $1\in\mathbb{Z}_{2}$ を流す。$\mathbb{Z}_{2}$ では $-1=1$ なので、頂点 $v$ での流入と流出の差は $d(v)\cdot1=0$（$d(v)$ は偶数）。よってキルヒホッフの法則を満たし（\ref{graph:group-flow}）、どの辺の値も 0 でない。
:::

::: problem ★ 基本：θ グラフ {#graph:ex-fl-theta}
2 頂点 $a,b$ を 3 本の平行な辺で結んだ多重グラフは、どこでも 0 でない 3 フローをもつが 2 フローをもたないことを示せ。
:::

::: solution
3 本とも $a\to b$ の向きにし、値を $1,1,-2$ とすれば、$a$ から出る量は $1+1-2=0$ で $b$ も同様なので 3 フロー。2 フローがあれば $\mathbb{Z}_{2}$ フローがあり（\ref{graph:k-flow-zk-flow}）、$a$ でのキルヒホッフの法則は $1+1+1=1\neq0$ となり矛盾（次数 3 が奇数）。
:::

## 4 色定理の証明の構造 {#graph:sec-fc-exercises}

対応するページ：\ref{graph:page-four-colour}

::: problem ★ 基本：最小反例の大きさ {#graph:ex-fc-size}
最小反例（\ref{graph:fc-minimal-counterexample}）が存在すれば、その頂点は 12 個以上であることを示せ。
:::

::: solution
\ref{graph:fc-minimal-properties} の 3 から $\delta\ge5$。\ref{graph:planar-edge-bound} の 1 と握手補題から $\sum_{v}(6-d(v))\ge12$ で、各項は $6-d(v)\le1$ なので、頂点は 12 個以上。
:::

::: problem ★★ 標準：三角形のない平面グラフ {#graph:ex-fc-triangle-free}
三角形を含まない平面的なグラフは 4 彩色可能であることを、\ref{graph:planar-edge-bound} の 2 と貪欲法で示せ（4 色定理を使わずに）。
:::

::: solution
頂点数の帰納法。$n\le3$ は明らか。三角形を含まない平面的なグラフは $m\le2n-4$ なので平均次数は 4 未満で、次数 3 以下の頂点 $v$ がある。$G-v$ も三角形を含まず平面的なので 4 彩色でき、$v$ の隣接頂点は 3 色以下しか使わないので、空いた色で $v$ を塗れる。（グレッチュの定理によれば 3 色で足りる。）
:::
