# 単純多面体・巡回多面体・近隣多面体 {#poly:page-simple-cyclic keywords="faces of a simplex, number of vertices and facets of an e-polytope, vertex figure, edge, graph of a polytope, local maximum is global maximum, connectivity of the graph, simple polytope, simplicial polytope, duality of simple and simplicial, moment curve, cyclic polytope, Gale's evenness condition, neighbourly polytope"}

$d$ 次元の凸多面体の面の構造は、単体のように「頂点がどれも一般の位置にある」ものから、立方体のように「各頂点にちょうど $d$ 本の辺が集まる」ものまで様々である。このページでは、まず単体の面を完全に記述し、頂点の近くを超平面で切った**頂点図形**を使って、各頂点に $d$ 本以上の辺が集まること、1 次関数の局所的な最大は全体の最大であること、多面体のグラフが連結であることを示す。次に、**単純**多面体（各頂点がちょうど $d$ 枚のファセットに含まれる）と**単体的**多面体（ファセットがすべて単体）が極双対で入れ替わることを示す。最後に、モーメント曲線上の点の凸包である**巡回多面体**を調べ、そのファセットを決める**ゲールの偶数性条件**と、どの $\lfloor d/2\rfloor$ 個の頂点も面を張るという**近隣性**を証明する。

## 記法と定義の確認 {#poly:sec-sc-notation}

::: notation
- 凸多面体、$k$ 多面体、面、頂点 $\operatorname{ext}P$、ファセット、多面的集合と $F_{I}$、極集合、共役な面 $F^{\Delta}$ は \ref{poly:page-polytopes-polyhedra} のとおり。特に \ref{poly:polytope-faces}（面は面に入る頂点の凸包）、\ref{poly:polytope-faces-exposed}（面は露出面）、\ref{poly:polar-duality}（$\Delta$ は包含を逆にする全単射で $\dim F+\dim F^{\Delta}=d-1$）を何度も使う。
- $1$ 次元の面を**辺**という。頂点 $v,u$ について $[v,u]$ が辺のとき $v$ と $u$ は**隣接する**という。頂点を頂点、辺を辺とするグラフを $P$ の**グラフ**という。
- $\operatorname{cone}\{w_{1},\dots,w_{k}\}\defeq\{\sum c_{i}w_{i}:c_{i}\ge0\}$。
- 体系は $\ZF$。
:::

## 単体の面と、頂点・ファセットの個数 {#poly:sec-sc-simplex}

::: lemma 単体の面 {#poly:simplex-faces keywords="faces of a simplex are the convex hulls of subsets of its vertex set; number of k-faces is binom(e+1, k+1)" index="単体の面|たんたいのめん" refname="単体の面"}
$X=\{x_{0},\dots,x_{e}\}$ をアフィン独立とし、$S\defeq\operatorname{conv}X$（$e$ 単体）とする。
1. $\operatorname{ext}S=X$。
2. $S$ の面は $\operatorname{conv}Y$（$Y\subseteq X$、$Y=\varnothing$ は空の面）で尽き、$Y\mapsto\operatorname{conv}Y$ は単射で、$\dim\operatorname{conv}Y=\abs{Y}-1$。
3. したがって $S$ の $k$ 次元の面の個数は $\binom{e+1}{k+1}$、ファセットは $e+1$ 枚で、面はすべて単体である。
:::

::: intuition
単体では、頂点のどんな部分集合も面を張り、面はそれで尽きる。重心座標のいくつかを $0$ にした部分が面で、$e$ 単体の面の束は $e+1$ 点集合の部分集合全体の束と同じである。
:::

::: proof
**Step 1（重心座標）.** 【主張：$\operatorname{aff}X$ の点の重心座標は一意で、線分に沿って 1 次】$z\in\operatorname{aff}X$ は $z=\sum\lambda_{i}x_{i}$, $\sum\lambda_{i}=1$ と一意に書ける：2 通りの表示の差は $\sum c_{i}x_{i}=0$, $\sum c_{i}=0$ を与え、$\sum_{i\ge1}c_{i}(x_{i}-x_{0})=0$ と \ref{poly:affine-basic} の 3 から $c_{i}=0$（$i\ge1$）、さらに $c_{0}=0$。この $\lambda_{i}(z)$ について、一意性から $\lambda_{i}((1-t)a+tb)=(1-t)\lambda_{i}(a)+t\lambda_{i}(b)$。$S=\{z\in\operatorname{aff}X:\lambda_{i}(z)\ge0\ (\forall i)\}$ で、$\operatorname{conv}Y=\{z\in S:\lambda_{i}(z)=0\ (x_{i}\notin Y)\}$。

**Step 2（$\operatorname{conv}Y$ は面）.** 【主張：頂点の部分集合の凸包は面】$a,b\in S$, $z\in]a,b[\cap\operatorname{conv}Y$ とする。$x_{i}\notin Y$ なら $0=\lambda_{i}(z)=(1-t)\lambda_{i}(a)+t\lambda_{i}(b)$ で両項は $\ge0$ なので $\lambda_{i}(a)=\lambda_{i}(b)=0$。よって $a,b\in\operatorname{conv}Y$。

**Step 3（1, 2, 3）.** 【主張：面はすべて $\operatorname{conv}Y$ の形で、$Y$ は面から復元できる】Step 2 で $Y=\{x_{i}\}$ とすれば $\{x_{i}\}$ は面なので $x_{i}\in\operatorname{ext}S$。\ref{poly:ext-of-hull} と合わせて $\operatorname{ext}S=X$。空でない面 $F$ は \ref{poly:polytope-faces} の 2 から $F=\operatorname{conv}(F\cap X)$ の形。$x_{j}\notin Y$ なら $\lambda_{j}(x_{j})=1\neq0$ なので $x_{j}\notin\operatorname{conv}Y$、つまり $\operatorname{conv}Y\cap X=Y$ で、$Y$ は面から復元できる（単射）。$Y$ はアフィン独立なので $\dim\operatorname{conv}Y=\abs{Y}-1$ で、$\operatorname{conv}Y$ は単体。$k$ 次元の面は $\abs{Y}=k+1$ の $Y$ と対応する。
:::

::: lemma 頂点とファセットの個数の下界 {#poly:few-vertices-facets keywords="an e-polytope has at least e+1 vertices and at least e+1 facets, with equality iff it is a simplex" index="頂点の個数の下界|ちょうてんのこすうのかかい, ファセットの個数の下界|ふぁせっとのこすうのかかい"}
$G$ を $e$ 多面体（$e\ge1$）とする。
1. $G$ の頂点は $e+1$ 個以上で、ちょうど $e+1$ 個であることと $G$ が単体であることは同値。
2. $G$ のファセットは $e+1$ 枚以上で、ちょうど $e+1$ 枚であることと $G$ が単体であることは同値。
:::

::: intuition
$e$ 次元の立体を作るには角が $e+1$ 個、壁が $e+1$ 枚は必要で、どちらかがちょうどその数なら単体しかない。壁についての主張は、極をとって角についての主張に直せば得られる。
:::

::: proof
**Step 1（1）.** $G=\operatorname{conv}(\operatorname{ext}G)$ なので $\operatorname{aff}(\operatorname{ext}G)=\operatorname{aff}G$ は $e$ 次元。$m$ 点のアフィン包の次元は $m-1$ 以下（\ref{poly:affine-basic} の 2, 3）なので $\abs{\operatorname{ext}G}\ge e+1$。ちょうど $e+1$ 個なら、差ベクトル $e$ 本が $e$ 次元の空間を張るので一次独立で、頂点はアフィン独立（\ref{poly:affine-basic} の 3）、$G$ は単体。逆は \ref{poly:simplex-faces} の 1。

**Step 2（2 の準備）.** $a\in\operatorname{ri}G$ を原点に平行移動し、$\operatorname{aff}G$ の正規直交基底で $\operatorname{aff}G\cong\mathbb{R}^{e}$ と同一視する。この同一視は内積を保つので、面・次元・極集合はそのまま移る。以下 $G\subseteq\mathbb{R}^{e}$, $0\in\operatorname{int}G$ とする。

**Step 3（2）.** 【主張：ファセットの数は $G^{\circ}$ の頂点の数】\ref{poly:polar-duality} の 3, 4 から、$G$ のファセットと $G^{\circ}$ の頂点は一対一に対応し、$G$ の頂点と $G^{\circ}$ のファセットも一対一に対応する。$G^{\circ}$ は $e$ 多面体なので、1 からファセットは $e+1$ 枚以上。ちょうど $e+1$ 枚なら $G^{\circ}$ は頂点 $e+1$ 個で単体（1）、すると $G^{\circ}$ のファセットは $e+1$ 枚（\ref{poly:simplex-faces} の 3）で、$G$ の頂点は $e+1$ 個、1 から $G$ は単体。逆は \ref{poly:simplex-faces} の 3。
:::

## 頂点図形と多面体のグラフ {#poly:sec-sc-graph}

::: definition 頂点図形 {#poly:vertex-figure-def keywords="vertex figure: intersection of P with a hyperplane separating a vertex from the other vertices" index="頂点図形|ちょうてんずけい" refname="頂点図形"}
$P$ を $d$ 多面体（$d\ge1$）、$v$ をその頂点とする。$\langle c,v\rangle>\gamma>\langle c,u\rangle$（$v$ 以外のすべての頂点 $u$）となる $c$, $\gamma$ をとり、$H'\defeq H(c,\gamma)$ とするとき、$P'\defeq P\cap H'$ を $v$ における**頂点図形**という。このような $c$ は \ref{poly:polytope-faces-exposed} を面 $\{v\}$ に使えば存在し、$\gamma$ は $\langle c,v\rangle$ と $\max_{u\neq v}\langle c,u\rangle$ の間にとればよい。
:::

::: intuition
頂点 $v$ のすぐ近くで多面体を平らに切り落とすと、その切り口が頂点図形である。$v$ から出る辺 1 本ごとに切り口の角が 1 つでき、切り口は $v$ のまわりの面の様子の縮図になる。
:::

::: lemma 面の相対的内部 {#poly:ri-of-active-face keywords="a point x of a polyhedral set lies in the relative interior of the face F_{I(x)}" index="面の相対的内部（多面的集合）|めんのそうたいてきないぶ"}
多面的集合 $Q=\bigcap_{i}K(u_{i},\alpha_{i})$ の点 $x$ について $x\in\operatorname{ri}F_{I(x)}$。特に、多面的集合（したがって凸多面体）の各点は、ある面の相対的内部にある。
:::

::: proof
$E\defeq\{y:\langle u_{i},y\rangle=\alpha_{i}\ (i\in I(x))\}$ とする。$i\notin I(x)$ の不等式は $x$ で狭義なので（有限個）、ある $\delta>0$ で $E\cap B(x,\delta)\subseteq F_{I(x)}$。$\operatorname{aff}F_{I(x)}\subseteq E$ なので、$\operatorname{aff}F_{I(x)}\cap B(x,\delta)\subseteq F_{I(x)}$、すなわち $x\in\operatorname{ri}F_{I(x)}$。凸多面体は \ref{poly:minkowski-weyl} から多面的集合である。
:::

::: theorem 頂点図形と辺 {#poly:vertex-figure keywords="vertices of the vertex figure correspond to the edges at v; P is contained in v + cone of the edge directions; the vertex figure is a (d-1)-polytope; every vertex lies on at least d edges" index="頂点図形の基本性質|ちょうてんずけいのきほんせいしつ" refname="頂点図形と辺"}
$P$ を $d$ 多面体（$d\ge1$）、$v$ を頂点、$u_{1},\dots,u_{k}$ を $v$ に隣接する頂点の全体、$P'=P\cap H'$ を $v$ における頂点図形とする。
1. 各辺 $[v,u_{i}]$ は $H'$ とちょうど 1 点 $z_{i}\in]v,u_{i}[$ で交わり、$z_{1},\dots,z_{k}$ は相異なる。$\operatorname{ext}P'=\{z_{1},\dots,z_{k}\}$。
2. $P\subseteq v+\operatorname{cone}\{u_{1}-v,\dots,u_{k}-v\}$。
3. $P'$ は $(d-1)$ 多面体で、$k\ge d$。すなわち、各頂点には $d$ 本以上の辺が集まる。
:::

::: intuition
多面体は、頂点 $v$ から出る辺の方向が張る錐の中に収まっている。だから $v$ のまわりの様子は辺の方向だけで決まり、辺は空間を張るために少なくとも $d$ 本必要になる。
:::

::: proof
**Step 1（頂点図形の頂点は辺の上にある）.** 【主張：$z\in\operatorname{ext}P'$ なら、ある $i$ で $z\in]v,u_{i}[$】\ref{poly:ri-of-active-face} から $z\in\operatorname{ri}F$ となる $P$ の面 $F$ がある。$\dim F\ge2$ なら、$\operatorname{aff}F\cap H'$ は $z$ を含み次元 $\dim F-1\ge1$ 以上のアフィン部分空間なので、$z$ を中点とする短い線分を含み、$z\in\operatorname{ri}F$ からそれは $F\cap H'\subseteq P'$ に入る。これは $z$ が $P'$ の端点であることに反する。$\dim F=0$ なら $z$ は $P$ の頂点だが、頂点は $H'$ 上にない（$\langle c,v\rangle>\gamma$、他は $<\gamma$）。よって $F$ は辺で、\ref{poly:polytope-faces} から $F=[a,b]$（$a,b$ は $P$ の頂点）、$z\in]a,b[$。$\langle c,\cdot\rangle$ は $[a,b]$ 上で 1 次で、内点 $z$ で $\gamma$ をとり、端点では $\gamma$ をとらないので、端点の一方は $\gamma$ より大きく、それは $v$ しかない。よって $F=[v,u_{i}]$。

**Step 2（1 の残り）.** $\langle c,\cdot\rangle$ は $[v,u_{i}]$ 上で $\langle c,v\rangle>\gamma$ から $\langle c,u_{i}\rangle<\gamma$ まで単調に変わるので、$H'$ との交点はただ 1 点 $z_{i}\in]v,u_{i}[$。$z_{i}\in]a,b[$（$a,b\in P'$）なら、$[v,u_{i}]$ が面なので $a,b\in[v,u_{i}]\cap H'=\{z_{i}\}$、よって $z_{i}\in\operatorname{ext}P'$。$z_{i}=z_{j}$（$i\neq j$）なら $u_{i}-v$ と $u_{j}-v$ は同じ向きで、例えば $u_{i}\in]v,u_{j}[$ となり、$u_{i}$ が頂点であることに反する。Step 1 と合わせて $\operatorname{ext}P'=\{z_{i}\}$。$P'$ は空でない（$v$ と他の頂点を結ぶ線分は $H'$ と交わる）凸多面体（\ref{poly:polytope-intersection}）なので、$P'=\operatorname{conv}\{z_{1},\dots,z_{k}\}$ で $k\ge1$。

**Step 3（2）.** 【主張：$x-v$ は辺の方向の非負結合】$z_{i}=v+s_{i}(u_{i}-v)$（$0<s_{i}<1$）と書く。$v$ 以外の頂点 $u$ について、$[v,u]$ は $H'$ と点 $y=v+t(u-v)$（$0<t<1$）で交わり、$y\in P'$ なので $y=\sum\mu_{i}z_{i}$（凸結合）。$y-v=\sum\mu_{i}s_{i}(u_{i}-v)$ から $u-v=\sum\frac{\mu_{i}s_{i}}{t}(u_{i}-v)\in\operatorname{cone}\{u_{i}-v\}$。$x\in P$ を頂点の凸結合 $x=\sum\lambda_{u}u$ で書けば $x-v=\sum\lambda_{u}(u-v)$ も錐に入る。

**Step 4（3）.** $\operatorname{aff}P=\mathbb{R}^{d}$ なので、$x-v$（$x\in P$）は $\mathbb{R}^{d}$ を張り、2 から $u_{i}-v$ も、したがって $z_{i}-v$ も $\mathbb{R}^{d}$ を張る。特に $k\ge d$。$\dim P'\le d-2$ なら $\operatorname{aff}(\{v\}\cup P')$ の次元は $d-1$ 以下だが、これは $v+\operatorname{span}\{z_{i}-v\}=\mathbb{R}^{d}$ を含み矛盾。$P'\subseteq H'$ なので $\dim P'=d-1$。
:::

::: corollary 局所的な最大は最大 {#poly:local-max-global keywords="if a linear functional does not increase along any edge at a vertex, the vertex is a maximizer over P" index="局所的な最大と最大（凸多面体）|きょくしょてきなさいだいとさいだい"}
$P$ を $d$ 多面体、$v$ を頂点、$w\in\mathbb{R}^{d}$ とする。$v$ に隣接するすべての頂点 $u$ で $\langle w,u\rangle\le\langle w,v\rangle$ なら、すべての $x\in P$ で $\langle w,x\rangle\le\langle w,v\rangle$。
:::

::: proof
\ref{poly:vertex-figure} の 2 から $x-v=\sum c_{i}(u_{i}-v)$, $c_{i}\ge0$ で、$\langle w,x-v\rangle=\sum c_{i}\langle w,u_{i}-v\rangle\le0$。
:::

::: corollary 多面体のグラフは連結 {#poly:graph-connected keywords="the graph of a polytope is connected; monotone edge paths to the top vertex" index="多面体のグラフの連結性|ためんたいのぐらふのれんけつせい"}
凸多面体のグラフは連結である。さらに、$\langle c,\cdot\rangle$ がただ 1 つの頂点 $t$ で最大になるとき、どの頂点からも $\langle c,\cdot\rangle$ が真に増える辺をたどって $t$ に着く。
:::

::: proof
$d=\dim P$ とし、$\operatorname{aff}P$ の中で考えれば $d$ 多面体としてよい（$d=0$ なら自明）。頂点 $t$ について、\ref{poly:polytope-faces-exposed} から $\langle c,\cdot\rangle$ が $t$ でだけ最大になる $c$ がある。$v\neq t$ なら $v$ は最大点でないので、\ref{poly:local-max-global} の対偶から $\langle c,u\rangle>\langle c,v\rangle$ となる隣接頂点 $u$ がある。値が真に増えるので同じ頂点は 2 度現れず、頂点は有限個なので、この道は $t$ で止まる。どの頂点も $t$ と結ばれるので連結。
:::

## 単純多面体と単体的多面体 {#poly:sec-sc-simple}

::: definition 単純多面体と単体的多面体 {#poly:simple-simplicial keywords="simple polytope: every vertex lies in exactly d facets; simplicial polytope: every facet is a simplex" index="単純多面体|たんじゅんためんたい, 単体的多面体|たんたいてきためんたい" refname="単純多面体と単体的多面体"}
$d$ 多面体 $P$（$d\ge2$）が**単純**であるとは、各頂点がちょうど $d$ 枚のファセットに含まれることをいう。**単体的**であるとは、各ファセットが $(d-1)$ 単体であることをいう。
:::

::: intuition
単純とは、どの頂点でも壁が「最小限の $d$ 枚」だけ集まっていること（立方体）、単体的とは、どの壁も「最小限の $d$ 個」の頂点しかもたないこと（正八面体）である。前者は壁が一般の位置にあること、後者は頂点が一般の位置にあることに当たる。
:::

::: theorem 単純と単体的の双対性 {#poly:simple-simplicial-duality keywords="for a vertex v: v lies in exactly d facets iff exactly d edges iff the conjugate facet is a simplex; P simple iff every vertex has degree d iff the polar is simplicial" index="単純と単体的の双対性|たんじゅんとたんたいてきのそうついせい" refname="単純と単体的の双対性"}
$P$ を $0\in\operatorname{int}P$ の $d$ 多面体（$d\ge2$）、$Q\defeq P^{\circ}$ とする。$P$ の頂点 $v$ について次は同値。
1. $v$ はちょうど $d$ 枚のファセットに含まれる。
2. $v$ はちょうど $d$ 本の辺に含まれる。
3. $Q$ のファセット $\{v\}^{\Delta}$ は $(d-1)$ 単体である。

したがって、$P$ が単純であることと、$P$ の各頂点にちょうど $d$ 本の辺が集まることと、$Q$ が単体的であることは同値。
:::

::: intuition
極をとると、頂点 $v$ は壁 $\{v\}^{\Delta}$ に、$v$ を含む壁は $\{v\}^{\Delta}$ の頂点に、$v$ を含む辺は $\{v\}^{\Delta}$ の壁に移る。「$v$ に集まる壁や辺が最小限」は「壁 $\{v\}^{\Delta}$ の頂点や壁が最小限」、つまり $\{v\}^{\Delta}$ が単体であることと同じになる。
:::

::: proof
**Step 1（$v$ を含む面と $\{v\}^{\Delta}$ に含まれる面）.** 【主張：$F\mapsto F^{\Delta}$ は「$v$ を含む $P$ の面」と「$G\defeq\{v\}^{\Delta}$ に含まれる $Q$ の面」の間の全単射で、$\dim F^{\Delta}=d-1-\dim F$（$F\neq P$）】$\{v\}\subseteq F$ なら $F^{\Delta}\subseteq G$。逆に $F^{\Delta}\subseteq G$ なら $F=F^{\Delta\Delta}\supseteq G^{\Delta}=\{v\}$（\ref{poly:polar-duality} の 3）。次元は \ref{poly:polar-duality} の 4。$\dim G=d-1$。

**Step 2（$G$ に含まれる $Q$ の面は $G$ の面）.** $G$ の面は \ref{poly:face-basic} の 2 から $Q$ の面。逆に $Q$ の面 $F'\subseteq G$ は、$G$ の 2 点を結ぶ開線分（$Q$ の開線分でもある）について面の条件を満たすので $G$ の面。

**Step 3（同値性）.** Step 1, 2 から、$v$ を含むファセット（$\dim=d-1$）は $G$ の頂点（$\dim 0$ の面）と、$v$ を含む辺（$\dim=1$）は $G$ の $(d-2)$ 次元の面、すなわち $G$ のファセットと一対一に対応する。$G$ は $(d-1)$ 多面体（$d-1\ge1$）なので、\ref{poly:few-vertices-facets} から、1 ⇔ $G$ の頂点が $d$ 個 ⇔ $G$ が単体 ⇔ $G$ のファセットが $d$ 枚 ⇔ 2。

**Step 4（後半）.** $\Delta$ は $P$ の頂点と $Q$ のファセットの全単射（\ref{poly:polar-duality} の 4）なので、$Q$ のファセットはすべて $\{v\}^{\Delta}$ の形。Step 3 を全頂点に使えばよい。
:::

::: proposition 単体的多面体の面 {#poly:simplicial-faces keywords="every proper face of a simplicial polytope is a simplex and lies in a facet; the face lattice is determined by the vertex sets of the facets" index="単体的多面体の面|たんたいてきためんたいのめん"}
$P$ を $d$ 多面体（$d\ge2$）とする。
1. 空でない真の面はファセットに含まれる。
2. $P$ が単体的なら、空でない真の面は単体で、$P$ の面は $\varnothing$, $P$ と、あるファセットの頂点集合の部分集合 $Y$ による $\operatorname{conv}Y$ で尽きる。$\operatorname{ext}(\operatorname{conv}Y)=Y$ で、$F\subseteq F'$ と $\operatorname{ext}F\subseteq\operatorname{ext}F'$ は同値。

特に、単体的 $d$ 多面体 $P_{1},P_{2}$ の頂点の間の全単射 $\varphi$ が、ファセットの頂点集合の族を互いに移すなら、$\varphi$ は面の束の同型 $\operatorname{conv}Y\mapsto\operatorname{conv}\varphi(Y)$ を引き起こし、$P_{1},P_{2}$ は組合せ同値である。
:::

::: proof
**Step 1（1）.** 平行移動で $0\in\operatorname{int}P$ とし、$Q\defeq P^{\circ}$ とする。$F$ が空でない真の面なら $F^{\Delta}$ も空でない（$F^{\Delta}=\varnothing$ なら $F=\varnothing^{\Delta}=Q^{\circ}=P$）。$F^{\Delta}$ の頂点 $w$ をとると $\{w\}\subseteq F^{\Delta}$ から $F=F^{\Delta\Delta}\subseteq\{w\}^{\Delta}$ で、$\{w\}^{\Delta}$ は $\dim=d-1$ のファセット（\ref{poly:polar-duality} の 4）。

**Step 2（2）.** 1 から $F\subseteq G$（ファセット）で、$F$ は $G$ の面（\ref{poly:simple-simplicial-duality} の証明の Step 2 と同じ理由）。$G$ は単体なので \ref{poly:simplex-faces} から $F=\operatorname{conv}Y$, $Y\subseteq\operatorname{ext}G$ で、$F$ は単体。逆に $Y\subseteq\operatorname{ext}G$ なら $\operatorname{conv}Y$ は $G$ の面で、\ref{poly:face-basic} の 2 から $P$ の面。$\operatorname{ext}(\operatorname{conv}Y)=Y$ は \ref{poly:simplex-faces}。$F=\operatorname{conv}(\operatorname{ext}F)$ なので包含は頂点集合の包含と同値。

**Step 3（組合せ同値）.** 2 から、$P_{i}$ の真の空でない面は「あるファセットの頂点集合の部分集合」と包含を保って一対一に対応する。$\varphi$ はこの部分集合族を互いに移すので、$\varnothing\mapsto\varnothing$, $P_{1}\mapsto P_{2}$ と合わせて順序同型を与える。
:::

## 巡回多面体 {#poly:sec-sc-cyclic}

::: definition 巡回多面体と近隣多面体 {#poly:cyclic-polytope keywords="moment curve x(t) = (t, t^2, ..., t^d); cyclic polytope C(n,d); k-neighbourly polytope" index="モーメント曲線|もーめんときょくせん, 巡回多面体|じゅんかいためんたい, 近隣多面体|きんりんためんたい" refname="巡回多面体"}
$x(t)\defeq(t,t^{2},\dots,t^{d})\in\mathbb{R}^{d}$ を**モーメント曲線**という。$n\ge d+1$ と $t_{1}<\cdots<t_{n}$ について $\operatorname{conv}\{x(t_{1}),\dots,x(t_{n})\}$ を**巡回多面体**といい、型を $C(n,d)$ と書く。凸多面体 $P$ が **$k$ 近隣**であるとは、$k$ 個以下の頂点からなる任意の集合 $Y$ について $\operatorname{conv}Y$ が $P$ の面であることをいう。
:::

::: intuition
モーメント曲線は「どの超平面とも $d$ 回までしか交わらない」ほど強く曲がった曲線で、その上の点はできるだけ一般の位置にある。そこから作る巡回多面体は、頂点の数を決めたときに面の数が最大になる多面体の代表である（上限定理）。
:::

::: lemma モーメント曲線と超平面 {#poly:moment-curve keywords="a hyperplane meets the moment curve in at most d points; any at most d+1 points on it are affinely independent" index="モーメント曲線と超平面|もーめんときょくせんとちょうへいめん"}
1. 超平面 $H(u,\alpha)$ とモーメント曲線の交点は $d$ 個以下。より正確に、$\langle u,x(t)\rangle-\alpha=\sum_{j=1}^{d}u_{j}t^{j}-\alpha$ は $0$ でない $d$ 次以下の多項式である。
2. 相異なる $m\le d+1$ 個の $t$ に対する $x(t)$ はアフィン独立。
:::

::: proof
1：$u\neq0$ なので多項式は $0$ でなく、根は $d$ 個以下。2：$m=d+1$ でアフィン独立でなければ、その $d+1$ 点のアフィン包は $d-1$ 次元以下で、ある超平面に含まれ（$d-1$ 次元以下のアフィン部分空間は超平面に含まれる）、1 に反する。$m<d+1$ なら、別の $t$ を足して $d+1$ 点にすれば、アフィン独立な族の部分族としてアフィン独立。
:::

::: theorem 巡回多面体の基本性質 {#poly:cyclic-basic keywords="a cyclic polytope C(n,d) with d >= 2 is a d-polytope, all n points are vertices, and it is simplicial" index="巡回多面体の基本性質|じゅんかいためんたいのきほんせいしつ"}
$d\ge2$ とし、$P$ を $C(n,d)$ 型の巡回多面体とする。$P$ は $d$ 多面体で、$x(t_{1}),\dots,x(t_{n})$ はすべて頂点であり、$P$ は単体的である。
:::

::: intuition
モーメント曲線上の点はどれも角になり、どの壁にもちょうど $d$ 個の角しか乗らない。曲線が強く曲がっているため、余分な点が壁に乗ることがない。
:::

::: proof
**Step 1（次元）.** \ref{poly:moment-curve} の 2 から $x(t_{1}),\dots,x(t_{d+1})$ はアフィン独立なので $\dim P=d$。

**Step 2（頂点）.** 【主張：$x(t_{j})$ を露出する超平面がある】$u\defeq(-2t_{j},1,0,\dots,0)$, $\alpha\defeq-t_{j}^{2}$ とおくと $\langle u,x(t)\rangle-\alpha=(t-t_{j})^{2}\ge0$（$d\ge2$ を使った）。よって $P\subseteq K(-u,-\alpha)$ で、$P\cap H(u,\alpha)$ の点を $x(t_{i})$ の正係数の凸結合で書くと、各項 $(t_{i}-t_{j})^{2}\ge0$ の和が $0$ なので使った点はすべて $x(t_{j})$。よって $P\cap H(u,\alpha)=\{x(t_{j})\}$ は面で、$x(t_{j})$ は頂点。

**Step 3（単体的）.** ファセット $F$ は $(d-1)$ 多面体なので頂点を $d$ 個以上もち（\ref{poly:few-vertices-facets}）、それらは超平面 $\operatorname{aff}F$ 上の曲線の点なので $d$ 個以下（\ref{poly:moment-curve} の 1）。よってちょうど $d$ 個で、$F$ は単体。
:::

::: theorem ゲールの偶数性条件 {#poly:gale-evenness keywords="Gale's evenness condition: a d-subset X of the vertices of C(n,d) spans a facet iff any two non-members are separated by an even number of members" index="ゲールの偶数性条件|げーるのぐうすうせいじょうけん" refname="ゲールの偶数性条件"}
$d\ge2$, $P=\operatorname{conv}\{x(t_{1}),\dots,x(t_{n})\}$（$t_{1}<\cdots<t_{n}$）とし、$T\subseteq\{t_{1},\dots,t_{n}\}$, $\abs{T}=d$, $X\defeq x(T)$ とする。$X$ があるファセットの頂点集合であることと、次は同値：$T$ に属さない任意の $t_{i}<t_{j}$ について、$t_{i}<s<t_{j}$ を満たす $s\in T$ の個数が偶数。
:::

::: intuition
$X$ を通る超平面は、$X$ のパラメータを根にもつ $d$ 次多項式 $p(t)$ の零点の集合として曲線を切る。曲線は根を通るたびに超平面の反対側へ移るので、残りの点がすべて同じ側にあるためには、残りの点の間に挟まる根の個数が偶数でなければならない。
:::

::: proof
**Step 1（$X$ を通る超平面）.** 【主張：$\langle u,x(t)\rangle-\alpha=p(t)\defeq\prod_{s\in T}(t-s)$ となる超平面 $H\defeq H(u,\alpha)$ があり、$H=\operatorname{aff}X$】$p(t)=t^{d}+a_{d-1}t^{d-1}+\cdots+a_{0}$ と展開し、$u\defeq(a_{1},\dots,a_{d-1},1)\neq0$, $\alpha\defeq-a_{0}$ とおけばよい。$X\subseteq H$ で、$X$ はアフィン独立（\ref{poly:moment-curve} の 2）な $d$ 点なので $\operatorname{aff}X$ は $d-1$ 次元で $H$ に等しい。$H$ に乗る $x(t_{i})$ は $p$ の根、すなわち $X$ の点だけ。

**Step 2（符号）.** $t_{i}\notin T$ では $p(t_{i})\neq0$ で、その符号は $(-1)^{\#\{s\in T:s>t_{i}\}}$。したがって $t_{i}<t_{j}$（ともに $T$ の外）について、$p(t_{i})$ と $p(t_{j})$ の符号が同じであることと、間にある $T$ の点の個数が偶数であることは同値。

**Step 3（$\Leftarrow$）.** 条件が成り立てば、$T$ の外の $t_{i}$（$n\ge d+1$ なので存在する）で $p(t_{i})$ の符号は一定。負なら $P\subseteq K(u,\alpha)$、正なら $P\subseteq K(-u,-\alpha)$ で、$H$ は支持超平面。$P\cap H$ の点を $x(t_{i})$ の正係数の凸結合で書くと、使った点はすべて $H$ 上（各項の $p(t_{i})$ が同符号で和が $0$）なので $X$ の点。よって $P\cap H=\operatorname{conv}X$ は $d-1$ 次元の面、すなわちファセットで、頂点集合は $X$（\ref{poly:simplex-faces} の 1）。

**Step 4（$\Rightarrow$）.** $F$ をファセットで $\operatorname{ext}F=X$ とする。\ref{poly:polytope-faces-exposed} から $F=P\cap H''$ となる支持超平面 $H''$ があり、$\operatorname{aff}F\subseteq H''$ で次元が等しいので $H''=\operatorname{aff}F=\operatorname{aff}X=H$。$P$ は $H$ の片側にあるので、$T$ の外の $t_{i}$ で $p(t_{i})$ は同符号で、Step 2 から条件が成り立つ。
:::

::: theorem 巡回多面体の近隣性 {#poly:cyclic-neighbourly keywords="a cyclic polytope C(n,d) is k-neighbourly for k <= floor(d/2); for d >= 4 its graph is complete" index="巡回多面体の近隣性|じゅんかいためんたいのきんりんせい" refname="巡回多面体の近隣性"}
$d\ge2$ とし、$P$ を $C(n,d)$ 型の巡回多面体とする。$1\le k\le\lfloor d/2\rfloor$ なら、$k$ 個の頂点からなる任意の $X$ について $\operatorname{conv}X$ は $P$ の $(k-1)$ 次元の面（単体）である。特に $d\ge4$ なら、どの 2 頂点も辺で結ばれ、$P$ のグラフは完全グラフである。
:::

::: intuition
$k\le d/2$ 個の点なら、その点を重根にもつ $2k$ 次の多項式 $\prod(t-s)^{2}$ が作れ、これは $0$ 以上で、ちょうどその点でだけ $0$ になる。これが「その点だけに触れる支持超平面」を与える。3 次元では起こりえない「どの 2 頂点も隣接する」多面体が、4 次元以上では作れる。
:::

::: proof
**Step 1（支持超平面）.** 【主張：$X$ にだけ触れる支持超平面がある】$X=x(T)$, $\abs{T}=k$ とし、$p(t)\defeq\prod_{s\in T}(t-s)^{2}=\sum_{j=0}^{2k}b_{j}t^{j}$（$b_{2k}=1$）とおく。$2k\le d$ なので $u\defeq(b_{1},\dots,b_{2k},0,\dots,0)\in\mathbb{R}^{d}$, $\alpha\defeq-b_{0}$ とすれば $\langle u,x(t)\rangle-\alpha=p(t)$。$2k\ge2$ なので $u\neq0$。$p\ge0$ で、$p(t)=0$ は $t\in T$ と同値。

**Step 2（面）.** $P\subseteq K(-u,-\alpha)$ で、$P\cap H(u,\alpha)$ の点を正係数の凸結合で書くと、使った点はすべて $p=0$、つまり $X$ の点。よって $P\cap H(u,\alpha)=\operatorname{conv}X$ は面。$X$ はアフィン独立（\ref{poly:moment-curve} の 2）なので $(k-1)$ 単体。$d\ge4$ なら $k=2$ がとれる。
:::

::: corollary 巡回多面体の組合せ型 {#poly:cyclic-type keywords="all cyclic polytopes of type C(n,d) are combinatorially equivalent" index="巡回多面体の組合せ型|じゅんかいためんたいのくみあわせがた"}
$d\ge2$ とする。$C(n,d)$ 型の巡回多面体は、パラメータ $t_{i}$ の選び方によらず互いに組合せ同値である。
:::

::: proof
$P_{1}=\operatorname{conv}\{x(t_{i})\}$, $P_{2}=\operatorname{conv}\{x(s_{i})\}$（ともに小さい順）とし、$\varphi(x(t_{i}))\defeq x(s_{i})$ とする。\ref{poly:gale-evenness} の条件は添字の大小だけで決まるので、$\varphi$ はファセットの頂点集合の族を互いに移す。両者は単体的（\ref{poly:cyclic-basic}）なので、\ref{poly:simplicial-faces} から組合せ同値。
:::

::: example
1. $C(n,2)$ は凸 $n$ 角形で、ゲールの条件からファセット（辺）は $\{x(t_{i}),x(t_{i+1})\}$ と $\{x(t_{1}),x(t_{n})\}$ の $n$ 本。
2. 立方体は単純（各頂点に 3 本の辺）で単体的でない。その極である正八面体は単体的で単純でない（各頂点に 4 本の辺）。
3. $C(6,4)$ は 6 頂点の 4 多面体で、単体ではない（\ref{poly:few-vertices-facets} の 1）が、\ref{poly:cyclic-neighbourly} からどの 2 頂点も隣接する。3 次元の凸多面体のグラフは平面的グラフであることが知られており、$K_{5}$ は平面的でないので、3 次元では 5 頂点以上の多面体のグラフが完全グラフになることはない。
:::

::: hypcheck
- **頂点とファセットの個数の下界**：$e\ge1$ は極双対（$\mathbb{R}^{e}$ で原点を内点にもつこと）を使うために置いた。
- **頂点図形と辺**：$c$ が $v$ を他の頂点から**狭義に**分けることを、頂点が $H'$ に乗らないこと（Step 1）と交点の一意性（Step 2）に使った。$\dim P=d$ は Step 4（辺の方向が $\mathbb{R}^{d}$ を張る）に使った。
- **単純と単体的の双対性**：$0\in\operatorname{int}P$ は \ref{poly:polar-duality} を使うために必要。$d\ge2$ は $\{v\}^{\Delta}$ が $1$ 次元以上で \ref{poly:few-vertices-facets} が使えることに使った。
- **巡回多面体**：$d\ge2$ は頂点であること（$(t-t_{j})^{2}$ が使える）に必要で、$d=1$ では $C(n,1)$ は線分で、内側の点は頂点でない。$n\ge d+1$ はゲールの条件の Step 3（$T$ の外の点の存在）と $\dim P=d$ に使った。
- **近隣性**：$2k\le d$ は多項式 $\prod(t-s)^{2}$ がモーメント曲線の座標で表せることに必要。$k>\lfloor d/2\rfloor$ では、単体でない多面体は $k$ 近隣になりえないことが知られている（Brøndsted, Corollary 14.5）。
:::

## 問題 {#poly:sec-sc-problems}

::: problem {#poly:prob-sc-c62}
\ref{poly:gale-evenness} を使って $C(n,2)$ の辺を求め、凸 $n$ 角形であることを確かめよ。
:::

::: solution
$T=\{t_{i},t_{j}\}$（$i<j$）とし、$T$ の外の点を、$t_{i}$ より前（群 $A$）、間（群 $B$）、$t_{j}$ より後（群 $C$）に分ける。外の 2 点の間に挟まる $T$ の点の個数は、$A$ と $B$、または $B$ と $C$ から 1 点ずつとると 1（奇数）、$A$ と $C$ からとると 2、同じ群からとると 0。よって条件は「$A,B$ がともに空でないことはなく、$B,C$ もともに空でないことはない」、すなわち「$B=\varnothing$」または「$A=C=\varnothing$」。前者は $j=i+1$（$n-1$ 通り）、後者は $i=1$, $j=n$（$n\ge3$ なので前者と重ならない）。辺は $n$ 本で、頂点の順 $x(t_{1}),\dots,x(t_{n})$ に従う $n$ 角形になる。
:::

::: problem {#poly:prob-sc-simple-degree}
単純な $d$ 多面体で、各頂点に集まる辺がちょうど $d$ 本であることを、立方体 $[-1,1]^{3}$ の頂点 $(1,1,1)$ について直接確かめよ。
:::

::: solution
$(1,1,1)$ を含むファセットは $x_{1}=1$, $x_{2}=1$, $x_{3}=1$ の 3 枚（\ref{poly:polyhedral-faces}）。$(1,1,1)$ を含む辺は、3 つの座標のうち 2 つを $1$ に固定した集合 $\{x_{i}=x_{j}=1\}\cap[-1,1]^{3}$ の 3 本で、それぞれ $(1,1,1)$ と $(-1,1,1)$, $(1,-1,1)$, $(1,1,-1)$ を結ぶ。ファセット 3 枚、辺 3 本で、\ref{poly:simple-simplicial-duality} と合う。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 頂点図形の定義では超平面 $H'$ を一つ選んだが、別の選び方でも頂点図形は組合せ同値になる（頂点集合が $v$ を通る辺と一対一に対応し、面の構造も $v$ を含む面から決まる）ことが知られている（Brøndsted, Corollary 11.3）。ここでは頂点と辺の対応だけを示した。

**前提を変えると.**
- \ref{poly:graph-connected} は強められ、$d$ 多面体のグラフは **$d$ 連結**（どの $d-1$ 個の頂点を除いても連結）である（**バリンスキーの定理**、と知られている）。証明は \ref{poly:local-max-global} の考え方を、除く頂点を通る超平面と組み合わせて行う。
- 単純でも単体的でもある $d$ 多面体（$d\ge3$）は単体に限る（Brøndsted, Theorem 12.19）。$d=2$ ではすべての多角形が両方を満たす。

**類似の定理.** 3 次元では、多面体のグラフは平面的で 3 連結であり、逆に平面的で 3 連結なグラフはすべて 3 次元の多面体のグラフになる（**シュタイニッツの定理**、と知られている）。4 次元以上では巡回多面体のように完全グラフも現れ、グラフだけから多面体を特徴づけることはできない。単純多面体については、グラフが面の束全体を決める（ブリンとマニの定理、カライの簡単な証明）ことが知られている。

**高い視点から：一般の位置の双対と線形計画法.** 単純（壁が一般の位置）と単体的（頂点が一般の位置）は、V 表示と H 表示の「一般の位置」が極双対で入れ替わったものである。\ref{poly:local-max-global} は線形計画法の**単体法**の正しさそのもので、「頂点から値の増える辺をたどれば最適な頂点に着く」ことを保証する。巡回多面体は「どの超平面とも $d$ 回までしか交わらない曲線」から作られ、そのファセットの判定が多項式の符号の変化の数え上げ（偶数性条件）になる。比喩で言えば、モーメント曲線は空間を最も激しくねじれながら進む糸で、その上に打った釘に張った膜は、少ない釘で最も多くの面をもつ形になる。これが \ref[上限定理]{poly:page-upper-lower-bound} の主題である。
:::
