# 演習：凸多面体 {#poly:page-exercises-polytopes keywords="exercises, polytopes, polyhedral sets, polar duality, cube, cross-polytope"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#poly:sec-expolytopes-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## 凸多面体と多面的集合 {#poly:sec-pp-exercises}

対応するページ：\ref{poly:page-polytopes-polyhedra}

::: problem ★ 基本：頂点の判定 {#poly:ex-pp-vertices-square}
$P\defeq\operatorname{conv}\{(0,0),(1,0),(0,1),(1,1),(\tfrac{1}{2},\tfrac{1}{2})\}$ の頂点を求め、$P$ の既約な H 表示を書け。
:::

::: solution
$(\tfrac12,\tfrac12)=\tfrac12(0,0)+\tfrac12(1,1)$ はほかの点の凸包に入るので頂点でない。$(0,0)$ はほかの 4 点の凸包に入らない（それらはすべて $x_{1}+x_{2}\ge1$ を満たすが、$(0,0)$ は満たさない）。同様に、$(1,1)$ は $x_{1}+x_{2}\le1$ で、$(1,0)$ は $x_{1}-x_{2}\le0$ で、$(0,1)$ は $x_{2}-x_{1}\le0$ で、ほかの点から分けられる。\ref{poly:polytope-characterization} の 2 から頂点は 4 隅で、$P=[0,1]^{2}=\{-x_{1}\le0,\ -x_{2}\le0,\ x_{1}\le1,\ x_{2}\le1\}$。どの不等式を除いても非有界になるので既約。
:::

::: problem ★★ 標準：ファセットは $d+1$ 個以上 {#poly:ex-pp-facets-lower-bound}
$d$ 多面体 $P\subseteq\mathbb{R}^{d}$ のファセットは $d+1$ 個以上あることを、\ref{poly:polar-duality} を使って示せ。
:::

::: solution
平行移動は面を面に移すので、$0\in\operatorname{int}P$ としてよい（$\dim P=d$ なので $\operatorname{ri}P=\operatorname{int}P\neq\varnothing$）。\ref{poly:polar-duality} の 4 から、$P$ のファセットは $Q\defeq P^{\circ}$ の頂点と一対一に対応する。$Q$ は $0$ を内点にもつので $\dim Q=d$ で、$Q=\operatorname{conv}(\operatorname{ext}Q)$ だから $\operatorname{aff}(\operatorname{ext}Q)=\mathbb{R}^{d}$。$d$ 次元のアフィン包をもつ集合は $d+1$ 個以上の点を含む（$k$ 個の点のアフィン包の次元は $k-1$ 以下、\ref{poly:affine-basic}）。よって $Q$ の頂点、すなわち $P$ のファセットは $d+1$ 個以上。
:::

::: problem ★★ 標準：立方体と正軸体の面の数 {#poly:ex-pp-cube-cross}
$d$ 次元立方体 $C_{d}\defeq[-1,1]^{d}$ の $k$ 次元の面の個数が $2^{d-k}\binom{d}{k}$ であることを示し、正軸体 $O_{d}\defeq\operatorname{conv}\{\pm e_{1},\dots,\pm e_{d}\}$ の $j$ 次元の面（$0\le j\le d-1$）の個数が $2^{j+1}\binom{d}{j+1}$ であることを導け。
:::

::: solution
$C_{d}=\bigcap_{i}\bigl(K(e_{i},1)\cap K(-e_{i},1)\bigr)$。\ref{poly:polyhedral-faces} から空でない面は、いくつかの座標を $\pm1$ に固定した集合 $F_{I}$ である（同じ座標を $+1$ と $-1$ の両方に固定すると空）。固定する座標の集合 $S$ と符号 $\varepsilon\in\{\pm1\}^{S}$ を決めると $F=\{x\in C_{d}:x_{i}=\varepsilon_{i}\ (i\in S)\}$ で、これは $(d-\abs{S})$ 次元の立方体なので、$(S,\varepsilon)$ が異なれば面も異なる。$k$ 次元の面は $\abs{S}=d-k$ で、$\binom{d}{d-k}2^{d-k}=2^{d-k}\binom{d}{k}$ 個。\ref{poly:polar-of-finite} から $O_{d}^{\circ}=C_{d}$ で、\ref{poly:polar-duality} の 3, 4 から $O_{d}$ の $j$ 次元の面は $C_{d}$ の $(d-1-j)$ 次元の面と一対一に対応する。その個数は $2^{j+1}\binom{d}{d-1-j}=2^{j+1}\binom{d}{j+1}$。$d=3$ では頂点 6・辺 12・面 8 となり、正八面体と合う。
:::

## 単純多面体・巡回多面体・近隣多面体 {#poly:sec-sc-exercises}

対応するページ：\ref{poly:page-simple-cyclic}

::: problem ★ 基本：辺の数と頂点の数 {#poly:ex-sc-edges-vertices}
$d$ 多面体 $P$ の頂点の数を $f_{0}$、辺の数を $f_{1}$ とする。$2f_{1}\ge d\,f_{0}$ を示し、$P$ が単純なら $2f_{1}=d\,f_{0}$ であることを示せ。
:::

::: solution
頂点と、それを含む辺の組 $(v,E)$ の個数を 2 通りに数える。各辺はちょうど 2 頂点を含む（\ref{poly:polytope-faces} から辺は 2 頂点の凸包）ので、組の数は $2f_{1}$。各頂点は \ref{poly:vertex-figure} の 3 から $d$ 本以上の辺に含まれるので、組の数は $d\,f_{0}$ 以上。単純なら \ref{poly:simple-simplicial-duality} から各頂点の辺はちょうど $d$ 本で、等号。
:::

::: problem ★★ 標準：$C(n,3)$ のファセットの数 {#poly:ex-sc-c-n-3}
$n\ge4$ について、$C(n,3)$ のファセットの数が $2n-4$ であることを \ref{poly:gale-evenness} から示せ。
:::

::: solution
添字を $1,\dots,n$ で表し、$X$ を 3 元集合とする。ゲールの条件は「$X$ を連続する整数の極大な塊に分けたとき、$1$ も $n$ も含まない塊の大きさはすべて偶数」と同値である（外の 2 点の間に挟まる $X$ の点の個数は、その間にある塊の大きさの和だから）。
- $1\notin X$, $n\notin X$：塊はすべて偶数の大きさで和が 3（奇数）になり、ありえない。
- $1\in X$, $n\notin X$：$\{1,2,3\}$ か、$\{1\}$ と内側の大きさ 2 の塊 $\{j,j+1\}$（$3\le j\le n-2$）。$1+(n-4)=n-3$ 個。
- $1\notin X$, $n\in X$：対称に $n-3$ 個。
- $1,n\in X$：残る 1 点の塊は $1$ か $n$ の塊につながる必要があり、$\{1,2,n\}$, $\{1,n-1,n\}$ の 2 個（$n\ge4$ なので相異なる）。

合計 $2(n-3)+2=2n-4$。
:::

::: problem ★★ 標準：$C(n,4)$ のファセットの数 {#poly:ex-sc-c-n-4}
$n\ge5$ について、$C(n,4)$ のファセットの数が $\frac{n(n-3)}{2}$ であることを示せ。
:::

::: solution
添字を $\mathbb{Z}/n$ の元とみて、$\{i,i+1\}$（$n$ と $1$ も隣とする）を**巡回ドミノ**と呼ぶ。

**Step 1.** 4 元集合 $X$ がゲールの条件を満たすことと、$X$ を $\mathbb{Z}/n$ 上で連続する塊に分けたときすべての塊の大きさが偶数であることは同値：直線上の塊のうち $1$ も $n$ も含まないものは巡回的な塊でもある。$1$ を含む塊と $n$ を含む塊は、両方 $X$ に入れば巡回的には 1 つにつながる。いずれの場合も、残りの塊が偶数で $\abs{X}=4$ が偶数なので、端の塊（またはそのつながり）も偶数になる。逆も同じ計算で従う。

**Step 2.** 巡回的な塊がすべて偶数で、$X\neq\mathbb{Z}/n$（$n\ge5$）なら、各塊を先頭から 2 つずつ区切ることで、$X$ はちょうど 1 通りに、交わらない 2 つの巡回ドミノの和に書ける。逆に、交わらない 2 つの巡回ドミノの和の巡回的な塊は、ドミノをつないだものなので偶数。

**Step 3.** よってファセットの数は、交わらない巡回ドミノの組（順序なし）の数に等しい。ドミノは $n$ 個あり、それぞれ自身と両隣の 3 個と交わるので、組の数は $\frac{n(n-3)}{2}$。$n=5,6,7$ では $5,9,14$ となる。
:::
