この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 凸集合と相対的内部 {#poly:sec-cx-exercises}

対応するページ：\ref{poly:page-convex-sets}

::: problem ★ 基本：線分の相対的内部 {#poly:ex-cx-segment-ri}
$\mathbb{R}^{2}$ の線分 $[a,b]$（$a\neq b$）の内部は空だが、相対的内部は開線分 $]a,b[$ であることを示せ。
:::

::: solution
$[a,b]$ は直線を含まないので $\mathbb{R}^{2}$ の開円板を含まず、内部は空。$\operatorname{aff}[a,b]$ は直線 $\ell$ で、$x\in]a,b[$ なら $\ell$ の中の $x$ の小さい近傍は $[a,b]$ に含まれる。$a$ の近傍は $\ell$ の中で $a$ を越えた点（$[a,b]$ の外）を含むので、$a,b\notin\operatorname{ri}$。
:::

::: problem ★★ 標準：ヘリーの定理と単位円板 {#poly:ex-cx-helly-disk}
平面の有限個の点について、どの 3 点も半径 1 のある閉円板に含まれるなら、すべての点が半径 1 のある閉円板に含まれることを示せ。
:::

::: solution
点 $x_{i}$ ごとに閉円板 $D_{i}\defeq\{z:\abs{z-x_{i}}\le1\}$（凸集合）を考える。3 点 $x_{i},x_{j},x_{k}$ が中心 $c$ の半径 1 の円板に含まれることは $c\in D_{i}\cap D_{j}\cap D_{k}$ と同じ。仮定からどの 3 つの $D_{i}$ も交わるので、\ref{poly:helly}（$d=2$）からすべての $D_{i}$ に共通の点 $c$ があり、中心 $c$ の半径 1 の円板がすべての点を含む。
:::

## 支持超平面・面・極集合 {#poly:sec-fp-exercises}

対応するページ：\ref{poly:page-faces-polarity}

::: problem ★ 基本：線分の極集合 {#poly:ex-fp-segment-polar}
$\mathbb{R}^{2}$ の線分 $S\defeq[-e_{1},e_{1}]$ の極集合が帯 $\{y:\abs{y_{1}}\le1\}$ であることを示し、\ref{poly:bipolar} の 3 の仮定（$0$ が内点）が外せないことを確かめよ。
:::

::: solution
$y\in S^{\circ}$ は $\langle te_{1},y\rangle=ty_{1}\le1$（$-1\le t\le1$）と同値で、$\abs{y_{1}}\le1$。この極集合は有界でない（$S$ は $0$ を内点にもたない）。双極は $S^{\circ\circ}=\operatorname{cl}\operatorname{conv}(S\cup\{0\})=S$ で、2 は成り立っている。
:::

::: problem ★★ 標準：端点が有限個のコンパクト凸集合 {#poly:ex-fp-finitely-many-ext}
コンパクト凸集合 $C$ の端点が有限個なら、$C$ は凸多面体（有限集合の凸包）であることを示せ。逆に、凸多面体 $\operatorname{conv}V$（$V$ 有限）の端点は $V$ に含まれることを示せ。
:::

::: solution
前半は \ref{poly:minkowski-extreme-points} から $C=\operatorname{conv}(\operatorname{ext}C)$。後半：$e\in\operatorname{ext}\operatorname{conv}V$ が $V$ にないとし、$e=\sum\lambda_{v}v$（凸結合、$\lambda_{v}>0$ の項が 2 つ以上）と書く。$\lambda_{w}>0$ の $w$ を一つとると $e=\lambda_{w}w+(1-\lambda_{w})e'$（$e'$ は残りの凸結合、$0<\lambda_{w}<1$）で、$e\neq w$ なので $e$ は線分 $]w,e'[$ の内点となり、端点であることに反する。
:::
