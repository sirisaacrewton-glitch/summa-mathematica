# 演習：面の数 {#poly:page-exercises-face-numbers keywords="exercises, f-vector, h-vector, Euler's relation, Dehn-Sommerville relations, upper bound theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## オイラーの関係式とデーン–ソマーヴィルの関係式 {#poly:sec-eds-exercises}

対応するページ：\ref{poly:page-euler-dehn-sommerville}

::: problem ★ 基本：三角柱の $h$ ベクトル {#poly:ex-eds-prism}
三角柱（単純な 3 多面体）の $h$ ベクトルを、$f$ ベクトルからの計算と、一般の向きで下向きの辺を数える方法の両方で求めよ。
:::

::: solution
$f=(6,9,5)$ で、$6+9(s-1)+5(s-1)^{2}+(s-1)^{3}=1+2s+2s^{2}+s^{3}$ から $h=(1,2,2,1)$。直接には、三角柱を底面 $\{x_{3}=0\}$ と上面 $\{x_{3}=1\}$ の正三角形からなるものとし、高さ $\langle w,x\rangle=x_{3}+\varepsilon x_{1}+\varepsilon^{2}x_{2}$（$\varepsilon>0$ は小さい）をとる。底面の 3 頂点は、縦の辺が上向きで、底面の 2 辺のうち下向きのものの本数が（底面内の高さの順に）$0,1,2$ 本。上面の 3 頂点は縦の辺が下向きで、上面の辺のうち下向きのものが $0,1,2$ 本なので、合計 $1,2,3$ 本。よって $h_{0}=1$, $h_{1}=2$, $h_{2}=2$, $h_{3}=1$ で一致する。
:::

::: problem ★★ 標準：単体的 3 多面体 {#poly:ex-eds-simplicial-3}
単体的な 3 多面体について、$f_{1}=3f_{0}-6$, $f_{2}=2f_{0}-4$ を \ref{poly:dehn-sommerville-simplicial} から導け。また、各ファセットが 3 辺をもち各辺が 2 つのファセットに含まれることからも $2f_{1}=3f_{2}$ を確かめよ。
:::

::: solution
$\sum_{i}h_{i}s^{i}=(s-1)^{3}+f_{0}(s-1)^{2}+f_{1}(s-1)+f_{2}$。$s^{2}$ の係数は $h_{1}=-3+f_{0}$、$s$ の係数は $h_{2}=3-2f_{0}+f_{1}$、定数項は $h_{3}=-1+f_{0}-f_{1}+f_{2}$。$h_{1}=h_{2}$ から $f_{1}=3f_{0}-6$、$h_{0}=1=h_{3}$ から $f_{2}=1-f_{0}+f_{1}+1=2f_{0}-4$。このとき $2f_{1}=6f_{0}-12=3f_{2}$ で、ファセットと辺の組を 2 通りに数えた等式と一致する（各ファセットは三角形で辺 3 本、\ref{poly:simplex-faces}。各辺がちょうど 2 枚のファセットに含まれることは、極双対で「各辺の両端は 2 頂点」に対応する）。
:::

::: problem ★★ 標準：単体的 4 多面体 {#poly:ex-eds-simplicial-4}
単体的な 4 多面体について $f_{2}=2f_{1}-2f_{0}$, $f_{3}=f_{1}-f_{0}$ を示し、$C(6,4)$ の $f=(6,15,18,9)$ で確かめよ。
:::

::: solution
$\sum_{i}h_{i}s^{i}=(s-1)^{4}+f_{0}(s-1)^{3}+f_{1}(s-1)^{2}+f_{2}(s-1)+f_{3}$。係数を比べると $h_{0}=1$、$h_{1}=-4+f_{0}$、$h_{3}=-4+3f_{0}-2f_{1}+f_{2}$、$h_{4}=1-f_{0}+f_{1}-f_{2}+f_{3}$。$h_{1}=h_{3}$ から $f_{2}=2f_{1}-2f_{0}$、$h_{0}=h_{4}$ から $f_{3}=f_{2}-f_{1}+f_{0}=f_{1}-f_{0}$。$C(6,4)$ では $2\cdot15-2\cdot6=18$, $15-6=9$ で合う。$h_{2}=h_{2}$ は新しい条件を与えないので、単体的 4 多面体の $f$ ベクトルは $f_{0},f_{1}$ で決まる。
:::
