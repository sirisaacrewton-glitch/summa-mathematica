## 確率的方法 {#comb:sec-pm-exercises}

対応するページ：\ref{comb:page-probabilistic-method}

::: problem ★ 基本：三角形の期待個数 {#comb:ex-pm-triangles}
$G\in\mathcal{G}(n,p)$ の三角形の個数の期待値は $\binom{n}{3}p^{3}$ であることを示せ。$p=1/2$, $n=10$ では何個か。
:::

::: solution
3 点集合 $\{a,b,c\}$ ごとの指示変数の和に期待値の線形性を使う。各 3 点集合が三角形をなす確率は 3 辺がすべて辺である確率 $p^{3}$（\ref{comb:random-graph-basic}）。$n=10$, $p=1/2$ では $120/8=15$ 個。（\ref{comb:expected-cycles} で $k=3$ とした $\frac{(n)_{3}}{6}p^{3}=\binom{n}{3}p^{3}$ と一致する。）
:::

::: problem ★★ 標準：支配性をもつトーナメント {#comb:ex-pm-tournament-sk}
$n$ 頂点のトーナメントが**性質 $S_{k}$** をもつとは、どの $k$ 頂点 $S$ についても、$S$ のすべての頂点に勝つ（$v\to s$, $s\in S$）頂点 $v\notin S$ があることをいう。$\binom{n}{k}(1-2^{-k})^{n-k}<1$ なら、性質 $S_{k}$ をもつ $n$ 頂点のトーナメントが存在することを示せ。
:::

::: solution
各辺の向きを独立に確率 $1/2$ で決める（$2^{\binom{n}{2}}$ 個のトーナメントを等確率に選ぶ）。$k$ 点集合 $S$ を固定すると、$v\notin S$ が $S$ のすべてに勝つ確率は $2^{-k}$ で、異なる $v$ の事象は互いに交わらない辺の向きで決まるので独立。よってそのような $v$ がない確率は $(1-2^{-k})^{n-k}$。和の上界（\ref{comb:first-moment}）から、ある $S$ で失敗する確率は $\binom{n}{k}(1-2^{-k})^{n-k}<1$ 以下で、どの $S$ でも失敗しないトーナメントがある。（$k$ を固定すると、この条件は $n$ が十分大きければ成り立つ。）
:::

## ほとんどすべてのグラフと閾値関数 {#comb:sec-th-exercises}

対応するページ：\ref{comb:page-thresholds}

::: problem ★ 基本：孤立点 {#comb:ex-th-isolated}
ほとんどすべての $G\in\mathcal{G}(n,\frac12)$ は孤立点をもたないことを、和の上界で直接示せ。
:::

::: solution
頂点 $v$ が孤立する確率は、$v$ と他の $n-1$ 点の対がどれも辺でない確率 $2^{-(n-1)}$。和の上界から孤立点がある確率は $n2^{-(n-1)}\to0$。（\ref{comb:constant-p-properties} の 2 の $k=1$ の場合からも従う。）
:::

::: problem ★ 基本：完全グラフになる確率 {#comb:ex-th-complete}
定数 $p\in(0,1)$ について、ほとんどすべての $G\in\mathcal{G}(n,p)$ の直径はちょうど 2 であることを示せ。
:::

::: solution
\ref{comb:constant-p-properties} の 3 から直径は 2 以下（連結）がほとんど確実。直径が 1 以下なのは $G$ が完全グラフ（または $n=1$）のときで、その確率は $p^{\binom{n}{2}}\to0$。\ref{comb:almost-all-intersection} から結論を得る。
:::
