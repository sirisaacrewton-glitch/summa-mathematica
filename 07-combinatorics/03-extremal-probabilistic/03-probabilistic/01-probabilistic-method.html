# 確率的方法 {#comb:page-probabilistic-method keywords="probabilistic method, random graph G(n,p), Erdos-Renyi model, linearity of expectation, first moment method, Markov inequality, Ramsey lower bound 2^{k/2}, Erdos girth chromatic number theorem, alteration method, Caro-Wei bound, large bipartite subgraph, Lovasz local lemma"}

**確率的方法**は、望む性質をもつ対象の存在を、「ランダムに選んだ対象が正の確率でその性質をもつ」ことで示す方法である。具体的な構成は与えないが、構成が知られていない対象の存在を簡単に示せることが多い。このページでは、有限の確率空間としての**ランダムグラフ** $\mathcal{G}(n,p)$ を定義し、期待値の線形性とマルコフの不等式だけを道具として、(1) ラムゼー数の指数関数的な下界 $R(k)>2^{k/2}$（エルデシュ）、(2) 内周も彩色数も大きいグラフの存在（エルデシュ）、(3) 独立集合と二部部分グラフの大きさの評価、を示す。

## 記法と定義の確認 {#comb:sec-pm-notation}

::: notation
- グラフは有限・単純。$\alpha(G)$ は独立集合の大きさの最大値、$\omega(G)$ は完全部分グラフの頂点数の最大値、内周 $g(G)$ は最短の閉路の長さ（\ref{graph:path-cycle}）。$\chi(G)\alpha(G)\ge\abs{G}$（\ref{graph:chromatic-basic-bounds} の 3）を使う。
- 確率空間はすべて**有限**で、確率は各元の確率の和で定める。確率変数 $X$ の期待値は $\mathbb{E}(X)\defeq\sum_{\omega}\mathbb{P}(\{\omega\})X(\omega)$ で、線形である。
- $[V]^{2}$ は $V$ の 2 元部分集合の全体。$(n)_{k}\defeq n(n-1)\cdots(n-k+1)$。二項展開は \ref{ring:binomial} のとおり。
- 体系は $\ZF$。
:::

## ランダムグラフ {#comb:sec-pm-random-graph}

::: definition ランダムグラフ G(n,p) {#comb:random-graph keywords="random graph G(n,p), edge probability, Erdos-Renyi model" index="ランダムグラフ|らんだむぐらふ, 辺確率|へんかくりつ" refname="ランダムグラフ"}
$n\ge1$, $0\le p\le1$, $q\defeq1-p$, $N\defeq\binom{n}{2}$ とし、$V\defeq\{0,\dots,n-1\}$ とする。$V$ 上のグラフ全体（$2^{N}$ 個）を標本空間とし、辺が $m$ 本のグラフ $G_{0}$ に確率 $\mathbb{P}(\{G_{0}\})\defeq p^{m}q^{N-m}$ を与えた確率空間を $\mathcal{G}(n,p)$ と書き、その元を**辺確率 $p$ のランダムグラフ**という。
:::

::: intuition
$\mathcal{G}(n,p)$ は「すべての点の対について、確率 $p$ の硬貨を独立に投げて表なら辺を引く」ことで得られるランダムなグラフである。$p=1/2$ なら、$V$ 上のすべてのグラフが等確率で現れる。
:::

::: lemma ランダムグラフの基本性質 {#comb:random-graph-basic keywords="G(n,p) is a probability space, edge events are independent with probability p" index="辺の独立性|へんのどくりつせい"}
1. $\mathcal{G}(n,p)$ は確率空間である（確率の総和が 1）。
2. 異なる $e_{1},\dots,e_{k}\in[V]^{2}$ について、$e_{1},\dots,e_{k}$ がすべて辺である確率は $p^{k}$。$e_{1},\dots,e_{k}$ がすべて辺でない確率は $q^{k}$。
3. 特に、$V$ 上の固定したグラフ $H$（辺 $\ell$ 本）について $\mathbb{P}[H\subseteq G]=p^{\ell}$、固定した $k$ 点集合 $U$ が独立集合である確率は $q^{\binom{k}{2}}$、完全グラフをなす確率は $p^{\binom{k}{2}}$。
:::

::: proof
**Step 1（1）.** 辺が $m$ 本のグラフは $\binom{N}{m}$ 個なので、二項定理から $\sum_{m}\binom{N}{m}p^{m}q^{N-m}=(p+q)^{N}=1$。

**Step 2（2）.** $e_{1},\dots,e_{k}$ をすべて含むグラフは、残り $N-k$ 個の対のうちどれを辺にするかで決まり、そのうち $j$ 個を辺にするものの確率は $p^{k+j}q^{N-k-j}$。和は $p^{k}\sum_{j}\binom{N-k}{j}p^{j}q^{N-k-j}=p^{k}$。辺でない場合も同様に $q^{k}$。

**Step 3（3）.** 2 を $H$ の辺、$U$ の $\binom{k}{2}$ 個の対に適用する。
:::


::: lemma 第 1 モーメント法 {#comb:first-moment keywords="Markov inequality, union bound, if E(X) < 1 then P[X = 0] > 0" index="第 1 モーメント法|だいいちもーめんとほう, 和の上界|わのじょうかい"}
有限確率空間の上の確率変数 $X\ge0$ と $a>0$ について次が成り立つ。
1. （マルコフの不等式）$\mathbb{P}[X\ge a]\le\mathbb{E}(X)/a$。
2. （和の上界）事象 $A_{1},\dots,A_{r}$ について $\mathbb{P}[A_{1}\cup\cdots\cup A_{r}]\le\sum_{i}\mathbb{P}[A_{i}]$。
3. $X$ が非負整数値で $\mathbb{E}(X)<1$ なら、$X=0$ となる元が存在する。また $\mathbb{P}[A]+\mathbb{P}[B]<1$ なら、$A$ にも $B$ にも属さない元が存在する。
:::

::: proof
**Step 1（1）.** $\mathbb{E}(X)\ge\sum_{X(\omega)\ge a}\mathbb{P}(\{\omega\})X(\omega)\ge a\,\mathbb{P}[X\ge a]$（$X\ge0$ なので他の項は非負）。これは \ref{prb:basic-inequalities} の 1 の有限の場合である。

**Step 2（2）.** 和集合の各元は少なくとも 1 つの $A_{i}$ に属するので、その確率は右辺で 1 回以上数えられる。

**Step 3（3）.** 1 を $a=1$ で使うと $\mathbb{P}[X\ge1]<1$、よって $\mathbb{P}[X=0]>0$ で、確率が正の事象は空でない。後半は 2 から $\mathbb{P}[A\cup B]<1$。
:::

## ラムゼー数の下界 {#comb:sec-pm-ramsey}

::: theorem エルデシュのラムゼー数の下界 {#comb:erdos-ramsey-lower-bound keywords="R(k) > 2^{k/2}, Erdos 1947, probabilistic lower bound" index="ラムゼー数の下界|らむぜーすうのかかい" refname="エルデシュのラムゼー数の下界"}
$k\ge3$ について $R(k)>2^{k/2}$。
:::

::: intuition
半分の確率で辺を引いたランダムなグラフでは、決まった $k$ 点が完全グラフになる確率も独立集合になる確率も $2^{-\binom{k}{2}}$ と極端に小さい。$k$ 点の選び方 $\binom{n}{k}$ をすべて足しても、$n\le2^{k/2}$ なら 1 に届かない。だから、どちらも含まないグラフがある。
:::

::: proof
**Step 1（設定）.** $n\defeq\lfloor2^{k/2}\rfloor$ とし、$G\in\mathcal{G}(n,\frac{1}{2})$ を考える。$n<k$ なら $K^{k}$ も大きさ $k$ の独立集合も存在しえないので、$n\ge k$ とする。

**Step 2（和の上界）.** \ref{comb:random-graph-basic} の 3 と \ref{comb:first-moment} の 2 により
$$\mathbb{P}[\omega(G)\ge k]\le\binom{n}{k}2^{-\binom{k}{2}},\qquad\mathbb{P}[\alpha(G)\ge k]\le\binom{n}{k}2^{-\binom{k}{2}}.$$

**Step 3（評価）.** 【主張：$\binom{n}{k}2^{-\binom{k}{2}}<\frac{1}{2}$】$\binom{n}{k}\le\frac{n^{k}}{k!}\le\frac{2^{k^{2}/2}}{k!}$ なので $\binom{n}{k}2^{-\binom{k}{2}}\le\frac{2^{k^{2}/2-k(k-1)/2}}{k!}=\frac{2^{k/2}}{k!}$。$k=3$ では $\frac{2^{3/2}}{6}<\frac{3}{6}=\frac{1}{2}$。$k\ge4$ では $k!>2^{k}$（$k=4$ で $24>16$、以後は各段で左辺が $k+1\ge2$ 倍以上）なので $\frac{2^{k/2}}{k!}<2^{-k/2}\le\frac{1}{4}$。

**Step 4（結論）.** Step 2, 3 と \ref{comb:first-moment} の 3 から、$\omega(G)<k$ かつ $\alpha(G)<k$ のグラフが $n$ 頂点に存在する。よって $R(k)>n=\lfloor2^{k/2}\rfloor$、すなわち $R(k)\ge\lfloor2^{k/2}\rfloor+1>2^{k/2}$。
:::

::: example
上界 $R(k)<4^{k-1}$（\ref{comb:erdos-szekeres-ramsey}）と合わせて $2^{k/2}<R(k)<4^{k}$ で、$R(k)$ は $k$ の指数関数のオーダーである。一方、$R(k)>2^{k/2}$ をみたすグラフ（$\omega,\alpha<k$）を**具体的に**構成する方法で、指数関数のオーダーに届くものは知られていない、と一般には言われている。
:::

## 内周と彩色数 {#comb:sec-pm-girth}

::: lemma 閉路の個数の期待値 {#comb:expected-cycles keywords="expected number of k-cycles in G(n,p) is (n)_k p^k / 2k" index="閉路の期待個数|へいろのきたいこすう"}
$k\ge3$ とする。$G\in\mathcal{G}(n,p)$ の長さ $k$ の閉路の個数を $X$ とすると $\mathbb{E}(X)=\dfrac{(n)_{k}}{2k}p^{k}$。
:::

::: proof
**Step 1（閉路の個数）.** $V$ の相異なる $k$ 点の列は $(n)_{k}$ 個あり、各閉路はその列 $2k$ 個（始点 $k$ 通り×向き 2 通り）で表されるので、$V$ 上の長さ $k$ の閉路は $(n)_{k}/(2k)$ 個。

**Step 2（指示変数）.** 各閉路 $C$ について、$C\subseteq G$ なら 1、そうでなければ 0 の確率変数 $X_{C}$ を考えると $X=\sum_{C}X_{C}$、$\mathbb{E}(X_{C})=\mathbb{P}[C\subseteq G]=p^{k}$（\ref{comb:random-graph-basic} の 3）。期待値の線形性から結論を得る。
:::

::: lemma 独立集合が小さいこと {#comb:small-independence keywords="if p >= 16k^2/n then P[alpha >= n/2k] tends to 0" index="独立数の評価（ランダムグラフ）|どくりつすうのひょうか"}
整数 $k\ge1$ と、$n$ の関数 $p=p(n)\in[0,1]$ で十分大きい $n$ について $p\ge16k^{2}/n$ を満たすものについて、$G\in\mathcal{G}(n,p)$ に対し $\lim_{n\to\infty}\mathbb{P}\left[\alpha(G)\ge\frac{n}{2k}\right]=0$。
:::

::: proof
**Step 1（固定した大きさ）.** $2\le r\le n$ について、\ref{comb:random-graph-basic} の 3 と和の上界から $\mathbb{P}[\alpha\ge r]\le\binom{n}{r}q^{\binom{r}{2}}\le2^{n}(1-p)^{\binom{r}{2}}$。$1-p\le e^{-p}$（$e^{x}\ge1+x$ を $x=-p$ で使う）なので $\le2^{n}e^{-p\binom{r}{2}}$。

**Step 2（$r=\lceil n/(2k)\rceil$）.** $n\ge4k$ なら $r\ge2$ で、$\binom{r}{2}=\frac{r(r-1)}{2}\ge\frac{r^{2}}{4}$。$p\ge16k^{2}/n$ と $r\ge n/(2k)$ から $p\binom{r}{2}\ge\frac{16k^{2}}{n}\cdot\frac{n^{2}}{16k^{2}}=n$。よって $\mathbb{P}[\alpha\ge r]\le2^{n}e^{-n}=(2/e)^{n}\to0$。$\alpha$ は整数なので $\alpha\ge\frac{n}{2k}$ と $\alpha\ge r$ は同値である。
:::

::: theorem エルデシュの定理（内周と彩色数） {#comb:erdos-girth-chromatic keywords="Erdos 1959, graphs of large girth and large chromatic number exist, alteration method" index="エルデシュの定理（内周と彩色数）|えるでしゅのていり, 変更法|へんこうほう" refname="内周と彩色数についてのエルデシュの定理"}
任意の整数 $k$ について、内周 $g(H)>k$ かつ彩色数 $\chi(H)>k$ のグラフ $H$ が存在する。
:::

::: intuition
彩色数が大きいことは「局所的に」は見えない：内周が大きいグラフは、どの頂点の近くでも木のように見え、木は 2 色で塗れる。それでも全体としては多くの色が必要なグラフがある。ランダムグラフは短い閉路を少ししか含まず、独立集合も小さい。短い閉路を頂点ごと取り除く（**変更法**）と、内周が大きく独立集合の小さい（したがって彩色数の大きい）グラフが残る。
:::

::: proof
**Step 1（設定）.** $k\le2$ なら、単純グラフの閉路の長さは 3 以上なので $g(K^{3})=3>k$、$\chi(K^{3})=3>k$ で、$H\defeq K^{3}$ でよい。$k\ge3$ とし、$0<\varepsilon<1/k$ を固定して $p\defeq n^{\varepsilon-1}$ とする。長さ $k$ 以下の閉路を**短い閉路**とよび、その個数を $X$ とする。

**Step 2（短い閉路は少ない）.** \ref{comb:expected-cycles} と $np=n^{\varepsilon}\ge1$ から
$$\mathbb{E}(X)=\sum_{i=3}^{k}\frac{(n)_{i}}{2i}p^{i}\le\frac{1}{2}\sum_{i=3}^{k}(np)^{i}\le\frac{k-2}{2}(np)^{k}.$$
マルコフの不等式から $\mathbb{P}[X\ge n/2]\le\frac{2\mathbb{E}(X)}{n}\le(k-2)n^{k\varepsilon-1}\to0$（$k\varepsilon<1$）。

**Step 3（独立集合は小さい）.** $p=n^{\varepsilon-1}\ge16k^{2}/n$（$n^{\varepsilon}\ge16k^{2}$ となる大きい $n$）なので、\ref{comb:small-independence} により $\mathbb{P}[\alpha\ge\frac{n}{2k}]\to0$。

**Step 4（グラフの選択）.** $n$ を十分大きくとって、Step 2, 3 の確率がどちらも $1/2$ 未満になるようにする。\ref{comb:first-moment} の 3 により、短い閉路が $n/2$ 個未満で $\alpha(G)<\frac{n}{2k}$ のグラフ $G$ がある。

**Step 5（変更）.** 各短い閉路から 1 頂点ずつ除いたグラフを $H$ とする。【主張：$g(H)>k$, $\chi(H)>k$】$H$ には短い閉路がない（どの短い閉路も 1 頂点を失った）ので $g(H)>k$。$\abs{H}\ge n-\frac{n}{2}=\frac{n}{2}$、$\alpha(H)\le\alpha(G)<\frac{n}{2k}$ なので、$\chi(H)\ge\frac{\abs{H}}{\alpha(H)}>\frac{n/2}{n/(2k)}=k$。
:::

## 期待値の線形性の応用 {#comb:sec-pm-linearity}

::: theorem カロ–ウェイの評価 {#comb:caro-wei keywords="Caro-Wei bound alpha(G) >= sum 1/(d(v)+1), random ordering" index="カロ–ウェイの評価|かろうぇいのひょうか" refname="カロ–ウェイの評価"}
任意のグラフ $G$ について $\displaystyle\alpha(G)\ge\sum_{v\in V(G)}\frac{1}{d(v)+1}$。特に、平均次数 $\bar{d}$ のグラフでは $\alpha(G)\ge\frac{n}{\bar{d}+1}$。
:::

::: intuition
頂点をランダムな順に並べ、「自分の隣人の誰よりも先に来た頂点」を集めると独立集合になる。各頂点が選ばれる確率は、自分と隣人たち $d(v)+1$ 人の中で一番先に来る確率 $1/(d(v)+1)$ である。
:::

::: proof
**Step 1（ランダムな順序）.** $V$ の全順序（$n!$ 個）を等確率に選ぶ確率空間を考える。順序 $\prec$ について、$v$ のすべての隣接頂点 $u$ で $v\prec u$ となる頂点 $v$ の集合を $I_{\prec}$ とする。

**Step 2（独立性）.** $u,v\in I_{\prec}$ が隣接すれば、$v\prec u$ かつ $u\prec v$ となり矛盾。よって $I_{\prec}$ は独立集合。

**Step 3（期待値）.** 【主張：$\mathbb{E}\abs{I_{\prec}}=\sum_{v}\frac{1}{d(v)+1}$】$v\in I_{\prec}$ となるのは、$\{v\}\cup N(v)$ の $d(v)+1$ 点の中で $v$ が最初に来るときで、対称性からその確率は $\frac{1}{d(v)+1}$（$d(v)+1$ 点のどれが最初に来る確率も等しい）。期待値の線形性から $\mathbb{E}\abs{I_{\prec}}=\sum_{v}\frac{1}{d(v)+1}$。

**Step 4（存在）.** 確率変数は少なくとも一つの元で期待値以上の値をとるので、$\abs{I_{\prec}}\ge\sum_{v}\frac{1}{d(v)+1}$ となる順序がある。後半は、$x\mapsto\frac{1}{x+1}$ の凸性からイェンセンの不等式（\ref{prb:basic-inequalities} の 3、一様分布）で $\frac{1}{n}\sum\frac{1}{d(v)+1}\ge\frac{1}{\bar{d}+1}$。
:::

::: proposition 大きい二部部分グラフ {#comb:large-bipartite-subgraph keywords="every graph has a bipartite subgraph with at least half of its edges, random cut" index="最大カット|さいだいかっと, 二部部分グラフ|にぶぶぶんぐらふ"}
$m$ 本の辺をもつ任意のグラフは、$m/2$ 本以上の辺をもつ二部部分グラフを含む。
:::

::: proof
各頂点を独立に確率 $1/2$ で $A$ か $B$ に入れる（$2^{n}$ 通りの分け方を等確率で選ぶ）。辺 $uv$ が $A$ と $B$ にまたがる確率は $1/2$（$u,v$ の入り方 4 通りのうち 2 通り）。またがる辺の個数の期待値は線形性から $m/2$ で、それ以上の値をとる分け方がある。その分け方でまたがる辺だけを残したグラフは二部グラフである。
:::

::: hypcheck
- **ラムゼー数の下界**：$p=1/2$ は、完全グラフと独立集合の確率を対称にするために使った。$k\ge3$ は Step 3 の数値評価に使った。
- **内周と彩色数**：$\varepsilon<1/k$ は短い閉路の期待値を $n$ より小さくするため（Step 2）に、$\varepsilon>0$ は独立集合を小さくするため（Step 3）に使った。この二つの要求を両立させるために、短い閉路を「なくす」のではなく「少なくして後で除く」変更法を使う。
- **カロ–ウェイ**：順序の一様性は Step 3 の対称性だけに使った。
:::

## 問題 {#comb:sec-pm-problems}

::: problem {#comb:prob-pm-tournament}
**トーナメント**（完全グラフの各辺に向きを付けたもの）で、$n$ 頂点、各辺の向きを独立に確率 $1/2$ で決めたものを考える。どの頂点もすべての辺の向きに沿って通る道（ハミルトン道）の個数の期待値は $n!/2^{n-1}$ であることを示せ。したがって、ハミルトン道を $n!/2^{n-1}$ 個以上もつトーナメントが存在する（セレの定理、T. Szele 1943）。
:::

::: solution
頂点の並べ方 $\sigma=(v_{1},\dots,v_{n})$（$n!$ 個）ごとに、$n-1$ 本の辺 $v_{i}v_{i+1}$ がすべて $v_{i}\to v_{i+1}$ の向きである確率は、辺の向きが独立なので $2^{-(n-1)}$。指示変数の和と期待値の線形性から、期待値は $n!/2^{n-1}$。確率変数は期待値以上の値をとる元をもつ。
:::

::: problem {#comb:prob-pm-dominating}
最小次数 $\delta\ge1$ の $n$ 頂点グラフは、大きさ $n\frac{1+\ln(\delta+1)}{\delta+1}$ 以下の**支配集合**（どの頂点も、その集合に属するかその集合の頂点と隣接する集合）をもつことを示せ。（ヒント：各頂点を確率 $p$ で選び、選んだ集合 $S$ に支配されない頂点 $T$ を加える。）
:::

::: solution
各頂点を独立に確率 $p$ で選んで $S$ とし、$S$ にも属さず $S$ の頂点とも隣接しない頂点の集合を $T$ とする。$S\cup T$ は支配集合である。$\mathbb{E}\abs{S}=np$。頂点 $v$ が $T$ に入るのは $v$ と $N(v)$ の $d(v)+1\ge\delta+1$ 点がすべて選ばれないときで、確率 $(1-p)^{d(v)+1}\le(1-p)^{\delta+1}\le e^{-p(\delta+1)}$。よって $\mathbb{E}\abs{S\cup T}\le np+ne^{-p(\delta+1)}$。$p\defeq\frac{\ln(\delta+1)}{\delta+1}\in(0,1)$ とすると右辺は $n\frac{\ln(\delta+1)}{\delta+1}+\frac{n}{\delta+1}$。期待値以下の値をとる元があるので、その大きさの支配集合が存在する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** このページの議論はすべて有限の確率空間の上で行い、測度論は使わない。使った確率論の道具は、期待値の線形性・マルコフの不等式・和の上界だけである（第 1 モーメント法）。

**前提を変えると.**
- 「ほとんどすべてのグラフ」がある性質をもつこと（確率が 1 に収束すること）を示すには、分散を使う第 2 モーメント法が必要になる（\ref[ほとんどすべてのグラフと閾値関数]{comb:page-thresholds}）。
- 事象がほとんど独立な場合に「どれも起こらない」確率が正であることを示す**ロヴァースの局所補題**がある：各事象の確率が $p$ 以下で、各事象が高々 $d$ 個の他の事象以外と独立なとき、$ep(d+1)\le1$ ならすべての事象が起こらない確率は正である、と知られている。これにより $R(k)>(1+o(1))\frac{\sqrt{2}}{e}k2^{k/2}$ のように下界を改良できる。

**類似の定理.** \ref{comb:caro-wei} は \ref{comb:turan-theorem} の補グラフについての形を含む：$K^{r}$ を含まないグラフの補グラフに適用すると、辺の数の上界が得られる。

**高い視点から：存在証明としての「平均」.** 確率的方法の核心は「平均より大きい（小さい）元が少なくとも一つある」という自明な原理である。期待値の線形性は、事象どうしの複雑な依存関係があっても成り立つので、多くの部分構造を数える問題を個々の部分構造の確率の和に分解できる。比喩で言えば、構成の難しい対象を探すのに、干し草の山から針を一本探す代わりに、山全体の平均を計算して「針の割合が正」であることを示す方法である。ラムゼー数の下界のように、確率的方法で存在が分かっていながら具体的な構成が知られていない対象が多く、その「脱ランダム化」は計算量理論の中心的な問題の一つである。
:::
