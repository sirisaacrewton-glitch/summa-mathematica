# ファン・デル・ヴェルデンの定理とヘイルズ–ジュエットの定理 {#comb:page-van-der-waerden keywords="van der Waerden's theorem, Hales-Jewett theorem, combinatorial line, combinatorial subspace, color focusing, Schur's theorem, compactness principle for colourings, monochromatic arithmetic progression, Euclidean Ramsey theory, Moser spindle"}

ラムゼーの定理（\ref{comb:page-ramsey-numbers}）は「辺の彩色」についての定理だったが、整数や格子点そのものを彩色しても同様の現象が起きる。**ファン・デル・ヴェルデンの定理**は「$\{1,\dots,W\}$ をどう $k$ 色に塗っても、同じ色の $p$ 項等差数列がある」と述べ、**シューアの定理**は「同じ色の $x,y,x+y$ がある」と述べる。このページでは、両者を含む抽象的な定理である**ヘイルズ–ジュエットの定理**（有限アルファベットの長い語の空間には単色の「組合せ直線」がある）を証明し、そこからファン・デル・ヴェルデンの定理を導く。また、無限の対象の彩色を有限の対象の彩色に帰着する**コンパクト性原理**を示す。

## 記法と定義の確認 {#comb:sec-vw-notation}

::: notation
- $[a,b]\defeq\{a,a+1,\dots,b\}$（整数）。$k$ **色の彩色**とは $k$ 元集合への写像のこと。
- $t\ge0$ について**アルファベット** $A_{t}\defeq\{0,1,\dots,t\}$（$t+1$ 文字）とし、$A_{t}^{N}$ を長さ $N$ の語全体とする。
- ラムゼー数と多色ラムゼー数の有限性は \ref{comb:erdos-szekeres-ramsey}, \ref{comb:multicolour-ramsey} のとおり。コンパクト空間の直積は \ref{top:tychonoff}、閉集合の有限交叉性によるコンパクト性の言い換えは \ref{top:compact-equivalents}。
- 体系は $\ZF$（コンパクト性原理の節だけ $\ZFC$）。
:::

## 組合せ直線と部分空間 {#comb:sec-vw-lines}

::: definition 組合せ直線と組合せ部分空間 {#comb:combinatorial-line keywords="combinatorial line, combinatorial subspace, template, variable word" index="組合せ直線|くみあわせちょくせん, 組合せ部分空間|くみあわせぶぶんくうかん, 変数語|へんすうご"}
$m\ge1$ とし、$*_{1},\dots,*_{m}$ を $A_{t}$ に属さない記号とする。語 $w\in(A_{t}\cup\{*_{1},\dots,*_{m}\})^{N}$ で、各 $*_{i}$ が少なくとも 1 回現れるものを **$m$ 変数語**という。$y=(y_{1},\dots,y_{m})\in A_{t}^{m}$ について、$w$ の $*_{i}$ をすべて $y_{i}$ に置き換えた語を $w(y)\in A_{t}^{N}$ と書く。像 $\{w(y): y\in A_{t}^{m}\}$ を **$m$ 次元の組合せ部分空間**といい、$m=1$ のとき**組合せ直線**という（変数を $*$ と書く）。
:::

::: intuition
組合せ直線は、語のいくつかの位置を「同じ変数」でつないで動かした $t+1$ 個の語である。たとえば $A_{2}^{4}$ で $w=1{*}0{*}$ なら、直線は $1000$, $1101$, $1202$ の 3 点からなる。三目並べの盤 $A_{2}^{2}$ の組合せ直線は、縦・横と右下がりの対角線（逆の対角線は含まない）である。
:::

::: lemma 部分空間の中の直線 {#comb:line-in-subspace keywords="a combinatorial line of a combinatorial subspace is a combinatorial line"}
$w$ を $m$ 変数語、$v\in(A_{t}\cup\{*\})^{m}$ を 1 変数語とする。$w$ の $*_{i}$ を $v_{i}$（文字または $*$）に置き換えた語 $u$ は 1 変数語で、すべての $x\in A_{t}$ について $u(x)=w(v(x))$。特に、組合せ部分空間の中の組合せ直線は、全体の組合せ直線である。
:::

::: proof
$v$ にはある $v_{i}=*$ があり、$w$ には $*_{i}$ が現れるので、$u$ には $*$ が現れる。$u(x)$ と $w(v(x))$ は、$w$ の文字の位置では同じ文字、$*_{i}$ の位置ではどちらも $v_{i}(x)$（$v_{i}$ が文字ならその文字、$*$ なら $x$）なので一致する。
:::

::: theorem ヘイルズ–ジュエットの定理 {#comb:hales-jewett keywords="Hales-Jewett theorem, monochromatic combinatorial line" index="ヘイルズ–ジュエットの定理|へいるずじゅえっとのていり" refname="ヘイルズ–ジュエットの定理"}
任意の $t\ge0$ と $k\ge1$ について、ある $N=\mathrm{HJ}(t,k)$ があり、$A_{t}^{N}$ のどの $k$ 色の彩色にも単色の組合せ直線がある。
:::

::: intuition
$(t+1)$ 目並べを $N$ 次元の盤で $k$ 人で遊ぶと、$N$ が十分大きければ引き分けはありえない、という主張である。証明は「色をそろえる位置を一つずつ増やしていく」帰納法で、各段階で直線の一部分だけが単色であるような部分空間を作り、最後に鳩の巣原理で全体をそろえる。
:::

## 証明 {#comb:sec-vw-proof}

ヘイルズ–ジュエットの定理を、より強い主張 $T(t,m)$ の帰納法で示す。

::: definition 末尾の同値と主張 T(t,m) {#comb:t-equivalence keywords="t-equivalence of words, statement T(t,m)" index="末尾の同値（語の）|まつびのどうち"}
$y,y'\in A_{t}^{m}$ が **$t$ 同値**であるとは、両方とも文字 $t$ を含まないか、または両方とも $t$ を含み、$t$ が最後に現れる位置 $j$ が等しく、さらに位置 $1,\dots,j$ で一致することをいう（同値関係である）。次の主張を $T(t,m)$ と書く：任意の $k$ について、ある $N=N(t,m,k)$ があり、$A_{t}^{N}$ のどの $k$ 色の彩色 $c$ についても、$m$ 変数語 $w$ で、$y\mapsto c(w(y))$ が $A_{t}^{m}$ の各 $t$ 同値類の上で一定であるものが存在する。
:::

::: intuition
$m=1$ では同値類は $\{t\}$ と $\{0,\dots,t-1\}$ の 2 つなので、$T(t,1)$ は「直線の最後の 1 点を除く $t$ 点が単色」という主張である。
:::

::: lemma 帰納法の 3 段階 {#comb:hj-induction-steps keywords="T(t,1) implies T(t,m), T(t,m) for all m implies HJ(t), HJ(t) implies T(t+1,1)" index="色の集中|いろのしゅうちゅう"}
$t\ge1$ とする。
1. $T(t,m)$ と $T(t,1)$ が成り立てば $T(t,m+1)$ が成り立つ。
2. すべての $m$ について $T(t,m)$ が成り立てば、$A_{t}$ についてヘイルズ–ジュエットの定理が成り立つ。
3. $A_{t}$ についてヘイルズ–ジュエットの定理が成り立てば、$T(t+1,1)$ が成り立つ。
:::

::: proof
**Step 1（1：積の構成）.** $k$ を固定し、$N\defeq N(t,m,k)$, $K\defeq k^{(t+1)^{N}}$, $N'\defeq N(t,1,K)$ とする。$A_{t}^{N+N'}$ の $k$ 色の彩色 $c$ をとり、語を $(u,v)$（$u\in A_{t}^{N}$, $v\in A_{t}^{N'}$）と書く。$v$ に写像 $u\mapsto c(u,v)$ を対応させると、$A_{t}^{N'}$ の $K$ 色の彩色 $c'$ になる。$T(t,1)$ により 1 変数語 $\ell$ で、$c'(\ell(x))$ が $x\in\{0,\dots,t-1\}$ で一定のものがある。次に $c''(u)\defeq c(u,\ell(0))$ とおき、$T(t,m)$ により $m$ 変数語 $w$ で $c''(w(y))$ が $t$ 同値類の上で一定のものをとる。$(m+1)$ 変数語 $(w,\ell)$（$\ell$ の $*$ を $*_{m+1}$ と読む）が求めるものである：$(y,x),(y',x')\in A_{t}^{m+1}$ が $t$ 同値とする。
- $x=t$ なら、最後の $t$ は位置 $m+1$ なので全体が一致し、同じ点。$x'=t$ も同様。
- $x,x'\neq t$ なら、最後の $t$ は $y$ の中にあり（またはどちらにもなく）、$y,y'$ は $t$ 同値。$c(w(y),\ell(x))=c'(\ell(x))(w(y))=c'(\ell(0))(w(y))=c''(w(y))$ で、同様に $c(w(y'),\ell(x'))=c''(w(y'))$。両者は $c''\circ w$ が同値類の上で一定なので等しい。

**Step 2（2：鳩の巣原理）.** $k$ を固定し、$T(t,k)$ の $N$ をとる。$A_{t}^{N}$ の $k$ 色の彩色 $c$ について、$k$ 変数語 $w$ で $c\circ w$ が $t$ 同値類の上で一定のものをとる。$s=0,1,\dots,k$ について $p_{s}\defeq(\underbrace{t,\dots,t}_{s},0,\dots,0)\in A_{t}^{k}$ とおく。$k+1$ 個の点に $k$ 色なので、ある $s<r$ で $c(w(p_{s}))=c(w(p_{r}))$。1 変数語 $v\defeq(\underbrace{t,\dots,t}_{s},\underbrace{*,\dots,*}_{r-s},0,\dots,0)$ を考える。$v(t)=p_{r}$。$x\in\{0,\dots,t-1\}$ なら $v(x)$ は最後の $t$ が位置 $s$ で、位置 $1,\dots,s$ は $p_{s}$ と一致するので $p_{s}$ と $t$ 同値（$s=0$ なら両方とも $t$ を含まない）。よって直線 $v$ の $t+1$ 点はすべて同じ色で、\ref{comb:line-in-subspace} により $w(v(\cdot))$ は $A_{t}^{N}$ の単色の組合せ直線である。

**Step 3（3：文字を 1 つ増やす）.** $N\defeq\mathrm{HJ}(t,k)$ とし、$A_{t+1}^{N}$ の $k$ 色の彩色 $c$ を $A_{t}^{N}$ に制限する。単色の組合せ直線（1 変数語 $\ell\in(A_{t}\cup\{*\})^{N}$）があり、$\ell$ を $A_{t+1}$ の上の 1 変数語と見ると、$x\in\{0,\dots,t\}$ で $c(\ell(x))$ は一定。これは $T(t+1,1)$ の主張そのものである。
:::

::: proof ヘイルズ–ジュエットの定理の証明
**Step 1（出発点）.** $t=0$ では $A_{0}^{1}$ の 1 点の直線（$w=*$）が単色。$T(1,1)$ は、$N=1$, $w=*$ とすれば、$t$ 同値類 $\{0\}$ と $\{1\}$ はそれぞれ 1 点なので成り立つ。

**Step 2（帰納法）.** $t\ge1$ について $T(t,1)$ が成り立つと仮定する。\ref{comb:hj-induction-steps} の 1 を $m$ について繰り返して、すべての $m$ で $T(t,m)$。2 により $A_{t}$ でヘイルズ–ジュエットの定理が成り立ち、3 により $T(t+1,1)$。Step 1 から始めて、すべての $t$ でヘイルズ–ジュエットの定理が成り立つ。
:::

## ファン・デル・ヴェルデンの定理とシューアの定理 {#comb:sec-vw-vdw}

::: theorem ファン・デル・ヴェルデンの定理 {#comb:van-der-waerden keywords="van der Waerden's theorem, monochromatic arithmetic progressions, W(p,k)" index="ファン・デル・ヴェルデンの定理|ふぁんでるゔぇるでんのていり, ファン・デル・ヴェルデン数|ふぁんでるゔぇるでんすう" refname="ファン・デル・ヴェルデンの定理"}
任意の $p,k\ge1$ について、ある $W=W(p,k)$ があり、$[1,W]$ のどの $k$ 色の彩色にも、同じ色の $p$ 項等差数列 $a,a+d,\dots,a+(p-1)d$（$d\ge1$）がある。
:::

::: intuition
長さ $N$ の語 $x$ を数 $1+\sum_{i}x_{i}$ に写すと、組合せ直線は等差数列に写る（変数の位置の個数が公差になる）。だから語の空間の単色直線から、整数の単色等差数列が得られる。
:::

::: proof
**Step 1（語から数へ）.** $p=1$ は自明なので $p\ge2$ とし、$t\defeq p-1$, $N\defeq\mathrm{HJ}(t,k)$, $W\defeq tN+1$ とする。$\varphi\colon A_{t}^{N}\to[1,W]$ を $\varphi(x)\defeq1+\sum_{i}x_{i}$ で定める。

**Step 2（直線は等差数列に写る）.** 1 変数語 $\ell$ の $*$ の個数を $d\ge1$、文字の位置の和を $b$ とすると $\varphi(\ell(x))=1+b+dx$（$x=0,\dots,t$）。

**Step 3（結論）.** 【主張：$[1,W]$ の彩色には単色の $p$ 項等差数列がある】$[1,W]$ の $k$ 色の彩色 $c$ について、$c\circ\varphi$ は $A_{t}^{N}$ の $k$ 色の彩色なので単色の直線 $\ell$ がある。Step 2 から $1+b,1+b+d,\dots,1+b+(p-1)d$ は同じ色の $p$ 項等差数列で、$[1,W]$ に入る。
:::

::: theorem シューアの定理 {#comb:schur keywords="Schur's theorem, monochromatic solution of x + y = z" index="シューアの定理|しゅーあのていり" refname="シューアの定理"}
任意の $k\ge1$ について、ある $S$ があり、$[1,S]$ のどの $k$ 色の彩色にも、同じ色の $x,y,z$ で $x+y=z$ となるもの（$x=y$ も許す）がある。
:::

::: intuition
差をとって辺の色にすれば、整数の問題が完全グラフの辺の彩色の問題になる。単色の三角形の 3 辺の「長さ」が $x+y=z$ を満たす。
:::

::: proof
**Step 1.** $n\defeq R(K^{3},\dots,K^{3})$（$k$ 色の多色ラムゼー数。\ref{comb:multicolour-ramsey} の 1 を $k$ についての帰納法で使えば有限）とし、$S\defeq n-1$ とする。

**Step 2.** $[1,S]$ の $k$ 色の彩色 $c$ について、頂点集合 $[0,S]$ の完全グラフの辺 $\{i,j\}$（$i<j$）を $c(j-i)$ で塗る。$S+1=n$ 頂点なので単色の三角形 $i<j<l$ がある。$x\defeq j-i$, $y\defeq l-j$, $z\defeq l-i$ は同じ色で $x+y=z$。
:::

## コンパクト性原理 {#comb:sec-vw-compactness}

::: theorem 彩色のコンパクト性原理 {#comb:colouring-compactness keywords="compactness principle for colourings, infinite to finite" index="コンパクト性原理（彩色）|こんぱくとせいげんり" refname="彩色のコンパクト性原理"}
（$\ZFC$）$M$ を集合、$\mathcal{P}$ を $M$ の有限部分集合の族、$k\ge1$ とする。$M$ のどの $k$ 色の彩色にも単色の $P\in\mathcal{P}$ があるなら、ある有限集合 $X\subseteq M$ について、$X$ のどの $k$ 色の彩色にも単色の $P\in\mathcal{P}$（$P\subseteq X$）がある。
:::

::: intuition
無限の対象のどの彩色にも単色の構造があるなら、その証拠は有限の部分ですでに揃っている。そうでなければ、有限の部分ごとの「悪い」彩色を、コンパクト性によって全体の悪い彩色に貼り合わせられてしまう。
:::

::: proof
**Step 1（対偶）.** どの有限 $X$ にも、単色の $P\subseteq X$ をもたない彩色 $X\to[1,k]$ があるとする。$Z\defeq[1,k]^{M}$（離散空間 $[1,k]$ の直積）は \ref{top:tychonoff} によりコンパクト。有限 $X$ について $F(X)\defeq\{c\in Z:\ X\text{ は単色の }P\subseteq X\text{ を含まない}\}$ とおく。

**Step 2（閉集合で有限交叉性）.** $c\in F(X)$ かどうかは $c\restr{X}$ だけで決まるので $F(X)$ は閉集合（補集合は $c\restr{X}$ を固定した基本開集合の和）。仮定から $F(X)\neq\varnothing$（$X$ の悪い彩色を $M$ に任意に延長）。$F(X_{1})\cap\cdots\cap F(X_{r})\supseteq F(X_{1}\cup\cdots\cup X_{r})\neq\varnothing$。

**Step 3（結論）.** 【主張：仮定に反する彩色が存在する】\ref{top:compact-equivalents} により $\bigcap_{X}F(X)$ に元 $c$ がある。任意の $P\in\mathcal{P}$ について $c\in F(P)$ なので $P$ は単色でない。これは仮定に反する。
:::

::: example
$M=\N_{\ge1}$, $\mathcal{P}$ を $p$ 項等差数列全体とすると、「$\N$ のどの $k$ 色の彩色にも単色の $p$ 項等差数列がある」（無限版）から、\ref{comb:colouring-compactness} により有限版（\ref{comb:van-der-waerden}）が従う。ただしこの議論は $W(p,k)$ の大きさについて何も教えない。
:::

::: hypcheck
- **ヘイルズ–ジュエットの定理**：アルファベットの**有限性**は、積の構成で色の数 $K=k^{(t+1)^{N}}$ が有限であること（\ref{comb:hj-induction-steps} の Step 1）に本質的に使った。色の数 $k$ の有限性は鳩の巣原理（Step 2）に使った。
- **ファン・デル・ヴェルデンの定理**：$\varphi$ が直線を等差数列に写すことだけを使い、公差 $d\ge1$ は変数の位置が少なくとも 1 つあることから従う。
- **シューアの定理**：多色ラムゼー数の有限性だけを使う。
- **コンパクト性原理**：$\mathcal{P}$ の元が**有限**集合であることが、$F(P)$ が閉集合であること（有限個の座標で決まる）に使われる。
:::

## 問題 {#comb:sec-vw-problems}

::: problem {#comb:prob-vw-w32}
$W(3,2)\le9$、すなわち $[1,9]$ を 2 色に塗ると同じ色の 3 項等差数列があることを示せ。（実際には $W(3,2)=9$ で、$[1,8]$ の彩色 $\mathrm{RRBBRRBB}$ は単色の 3 項等差数列をもたない。）
:::

::: solution
赤 (R)・青 (B) の彩色で単色の 3 項等差数列がないとする。色の入れ替えは条件を保つ。
- **$c(4)=c(6)$ の場合.** 色を入れ替えて両方 R としてよい。$4,5,6$ から $5$ は B、$2,4,6$ から $2$ は B、$4,6,8$ から $8$ は B。すると $2,5,8$ が B で矛盾。
- **$c(4)\neq c(6)$ の場合.** 色を入れ替えて $c(4)=$ R, $c(6)=$ B としてよい。
  - $c(5)=$ R なら：$3,4,5$ から $3$ は B。$3,6,9$ から $9$ は R。$5,7,9$ から $7$ は B。$6,7,8$ から $8$ は R。$1,5,9$ から $1$ は B。$2,5,8$ から $2$ は B。すると $1,2,3$ が B で矛盾。
  - $c(5)=$ B なら：$5,6,7$ から $7$ は R。$1,4,7$ から $1$ は B。$1,5,9$ から $9$ は R。$7,8,9$ から $8$ は B。$2,5,8$ から $2$ は R。$2,3,4$ から $3$ は B。すると $1,3,5$ が B で矛盾。

いずれも矛盾なので $W(3,2)\le9$。後半の彩色（$1,2,5,6$ が R、$3,4,7,8$ が B）では、公差 1 の数列は 3 連続の中に色の変わり目を含み、公差 2 の数列 $a,a+2,a+4$ は $a$ と $a+2$ の色が常に異なり、公差 3 の数列は $1,4,7$（R,B,B）と $2,5,8$（R,R,B）だけで、どれも単色でない。
:::

::: problem {#comb:prob-vw-hj-tictactoe}
$A_{1}^{2}=\{0,1\}^{2}$ の組合せ直線をすべて挙げよ。また、$A_{1}^{N}$ では、どの 2 色の彩色にも単色の組合せ直線があるような最小の $N$ を求めよ。
:::

::: solution
1 変数語は $0{*}$, $1{*}$, ${*}0$, ${*}1$, ${*}{*}$ で、直線は $\{00,01\}$, $\{10,11\}$, $\{00,10\}$, $\{01,11\}$, $\{00,11\}$ の 5 本。$N=1$ では直線は $\{0,1\}$ の 1 本で、2 点を異なる色に塗れば単色でない。$N=2$ では、$00$ と $11$ は直線 $\{00,11\}$ で結ばれ、$00$ と $01$, $00$ と $10$ も直線で結ばれる。単色の直線がないなら $01,10,11$ は $00$ と異なる色、すなわち同じ色になるが、$\{01,11\}$ が単色になり矛盾。よって最小の $N$ は 2。
:::

::: example ユークリッド空間のラムゼー型の問題 {#comb:euclidean-ramsey-example keywords="unit distance, Moser spindle, chromatic number of the plane" index="平面の彩色数|へいめんのさいしょくすう, モーザーのスピンドル|もーざーのすぴんどる"}
平面 $\mathbb{R}^{2}$ をどう 3 色に塗っても、距離 1 の同色の 2 点がある。辺の長さ 1 の正三角形を 2 つ貼り合わせた菱形を 2 つ、共通の頂点 $x$ のまわりに、遠い側の頂点 $x_{1},x_{2}$ の距離がちょうど 1 になるように回転させて置く（7 点、**モーザーのスピンドル**）。3 色で距離 1 の同色対がないとすると、菱形の 2 つの正三角形の中で 3 点は互いに異なる色なので、$x_{1}$ は $x$ と同じ色になり、同様に $x_{2}$ も $x$ と同じ色になる。$x_{1}x_{2}$ の距離は 1 なので矛盾。（距離 1 の同色対を避けられる最小の色数は 5 以上 7 以下であることが知られている、と一般には言われている。）
:::

::: supplement
**使わなかった前提・本質的でない前提.** ヘイルズ–ジュエットの定理の証明は整数の加法構造を使わず、語の組合せ構造だけを使う。そのため整数への写像を変えると、多次元のファン・デル・ヴェルデンの定理（ガライの定理：$\mathbb{Z}^{d}$ の彩色には任意の有限集合の相似な単色の像がある）も同じ方法で得られる。

**前提を変えると.**
- 色の数を「無限に多い」にすると成り立たない（各整数を別の色に塗る）。
- 密度版（**セメレディの定理**）：$k$ 項等差数列を含まない $A\subseteq[1,N]$ は $o(N)$ 個の元しかもたない。$k=3$ の場合は \ref{comb:roth-theorem} で示した。彩色版は密度版の系である（ある色クラスは密度 $1/k$ 以上）。
- 上の証明から得られる $W(p,k)$ の上界はアッカーマン関数型に巨大である。シェラーは原始再帰的な上界を、ガワーズは $2^{2^{k^{2^{2^{p+9}}}}}$ 型の上界を与えた、と一般には言われている。

**類似の定理.** ラドの定理は、連立 1 次方程式が「どの有限彩色にも単色解をもつ」ための必要十分条件（列条件）を与え、シューアの定理（$x+y-z=0$）はその特別な場合である。

**高い視点から：ラムゼー型定理は「有限な色では構造を壊せない」.** ヘイルズ–ジュエットの定理は、直線という最も単純な構造が、十分高い次元の立方体の中では有限個の色で決して壊せないことを述べる。証明の「色の集中」（\ref{comb:hj-induction-steps} の Step 2）は、多くの部分構造の色を少しずつそろえておき、最後に鳩の巣原理で一致する 2 つを見つける議論で、これはラムゼー理論に共通する手法である。圏論的には、グラハム–リーブ–ロスチャイルドによる「ラムゼー圏」の理論が、組合せ部分空間・有限ベクトル空間の部分空間などの多くの例を統一的に扱う、と一般には言われている。比喩で言えば、高次元の立方体の三目並べは、プレイヤーが何人いても誰かが必ず一列をそろえてしまうほど「直線が多すぎる」盤である。
:::
