# 演習：ラムゼー理論 {#comb:page-exercises-ramsey keywords="exercises, ramsey"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exramsey-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは有限・単純。
:::

## 有限ラムゼー理論とラムゼー数 {#comb:sec-rn-exercises}

対応するページ：\ref{comb:page-ramsey-numbers}

::: problem ★ 基本：星のラムゼー数 {#comb:ex-rn-star}
$R(K_{1,3},K_{1,3})=6$ を示せ。
:::

::: solution
$K^{5}$ の辺を、5 角形を赤、その補グラフ（5 角星）を青に塗ると、各頂点の赤の辺と青の辺は 2 本ずつで、単色の $K_{1,3}$ はない。$K^{6}$ の辺を 2 色に塗ると、各頂点の 5 本の辺のうち 3 本以上が同じ色（鳩の巣原理）なので単色の $K_{1,3}$ がある。
:::

::: problem ★ 基本：$R(3,5)$ の上界 {#comb:ex-rn-r35}
\ref{comb:erdos-szekeres-ramsey} の漸化式から $R(3,5)\le14$ を導け。
:::

::: solution
$R(3,5)\le R(2,5)+R(3,4)=5+9=14$（\ref{comb:small-ramsey-numbers}）。$5$ と $9$ は偶数でないので真の不等号は使えない。（実際に $R(3,5)=14$ であることが知られている。）
:::

## ファン・デル・ヴェルデンの定理とヘイルズ–ジュエットの定理 {#comb:sec-vw-exercises}

対応するページ：\ref{comb:page-van-der-waerden}

::: problem ★ 基本：2 項の等差数列 {#comb:ex-vw-w2k}
$W(2,k)=k+1$ を示せ。
:::

::: solution
2 項の等差数列は異なる 2 数の組である。$[1,k+1]$ を $k$ 色に塗ると、鳩の巣原理で同じ色の 2 数がある。$[1,k]$ は各数を別の色に塗れば単色の 2 数がない。
:::

::: problem ★★ 標準：2 色のシューア数 {#comb:ex-vw-schur2}
$[1,4]$ には、同じ色の $x,y,x+y$（$x=y$ も許す）をもたない 2 色の彩色があるが、$[1,5]$ にはないことを示せ。
:::

::: solution
$\{1,4\}$ を赤、$\{2,3\}$ を青とすると、赤の和 $2,5,8$ は赤でなく、青の和 $4,5,6$ は青でない。$[1,5]$ では、1 を赤としてよい。$1+1=2$ から 2 は青、$2+2=4$ から 4 は赤、$1+3=4$ から 3 は青、$2+3=5$ から 5 は赤。すると $1+4=5$ が赤で矛盾。
:::

## 誘導ラムゼー定理と連結性 {#comb:sec-ir-exercises}

対応するページ：\ref{comb:page-induced-ramsey}

::: problem ★ 基本：3 頂点の道 {#comb:ex-ir-p3}
3 頂点以上の連結グラフで完全グラフでないものは、誘導された $P_{3}$（3 頂点の道）を含むことを示せ。
:::

::: solution
隣接しない 2 頂点 $u,v$ のうち距離が最小の組をとる。連結なので最短の $u$–$v$ 道があり、距離が 2 でなければ、その道の上の、距離 2 の 2 点 $u'$, $v'$（隣接しない）がより近い組になる。よって距離は 2 で、中間の点 $w$ について $u\,w\,v$ は誘導された $P_{3}$（$uv$ は辺でない）。
:::

::: problem ★ 基本：星と道はどちらも必要 {#comb:ex-ir-stars-paths}
\ref{comb:connected-unavoidable} の 3 種類（$K^{r}$, $K_{1,r}$, $P_{r}$）から星か道を除くと主張が成り立たなくなることを、$r=4$ の例で示せ。
:::

::: solution
星 $K_{1,n}$（$n$ 大）は連結で、$K^{4}$ を含まず（三角形もない）、誘導された $P_{4}$ も含まない（どの 2 頂点も距離 2 以下）。道 $P_{n}$ は連結で、$K^{4}$ も $K_{1,4}$ も含まない（次数 2 以下）。よって「$K^{4}$ か $P_{4}$」だけ、あるいは「$K^{4}$ か $K_{1,4}$」だけでは足りない。
:::
