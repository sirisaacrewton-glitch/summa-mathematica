# トゥランの定理とエルデシュ–ストーンの定理 {#comb:page-turan keywords="extremal graph theory, extremal number ex(n,H), Turan graph, Turan's theorem, Mantel's theorem, Zykov symmetrization, Erdos-Stone theorem, Erdos-Stone-Simonovits, Kovari-Sos-Turan theorem, Zarankiewicz problem"}

**極値グラフ理論**の基本問題は「$n$ 頂点のグラフが部分グラフ $H$ を含まないとき、辺は最大で何本か」である。この最大値を $\mathrm{ex}(n,H)$ と書く。$H$ が完全グラフ $K^{r}$ のときの完全な答えがトゥランの定理で、極値グラフは「$r-1$ 個のほぼ等しい組に分けた完全多部グラフ」ただ一つである。一般の $H$ については、エルデシュ–ストーンの定理により、$\mathrm{ex}(n,H)$ の主要項が $H$ の**彩色数**だけで決まる。$H$ が二部グラフの場合には主要項が消え、より細かい評価（コヴァーリ–ショーシュ–トゥラン）が問題になる。

## 記法と定義の確認 {#comb:sec-tu-notation}

::: notation
- グラフは有限・単純。$\abs{G}$ は頂点の数、$\norm{G}$ は辺の数、$d(v)$ は次数、$N(v)$ は近傍（\ref{graph:page-graphs}）。$K^{r}$ は完全グラフ。
- 「$G$ が $H$ を含む」（$H\subseteq G$）は、$H$ と同型な部分グラフを含むことを意味する。
- 頂点彩色・彩色数 $\chi$ は \ref{graph:chromatic-number}、二部グラフは \ref{graph:bipartite}、完全二部グラフ $K_{s,t}$ は \ref{graph:page-trees-bipartite} のとおり。
- 体系は $\ZF$。有限集合だけを扱う。
:::

## 極値数とトゥラングラフ {#comb:sec-tu-definitions}

::: definition 極値数と極値グラフ {#comb:extremal-number keywords="extremal number ex(n,H), extremal graph" index="極値数|きょくちすう, 極値グラフ|きょくちぐらふ"}
グラフ $H$ と $n\ge1$ について、$n$ 頂点で $H$ を含まないグラフの辺の数の最大値を $\mathrm{ex}(n,H)$ と書き、**極値数**という。$n$ 頂点で $H$ を含まず、辺が $\mathrm{ex}(n,H)$ 本のグラフを、$n$ と $H$ についての**極値グラフ**という。
:::

::: intuition
$\mathrm{ex}(n,H)$ は「$H$ を避けながら詰め込める辺の上限」である。これを 1 本でも超えると、どう辺を配置しても $H$ が現れる。
:::

::: definition 完全多部グラフとトゥラングラフ {#comb:turan-graph keywords="complete multipartite graph, Turan graph T^{r-1}(n), t_{r-1}(n)" index="完全多部グラフ|かんぜんたぶぐらふ, トゥラングラフ|とぅらんぐらふ"}
$V$ を互いに交わらない $k$ 個の空でない集合 $V_{1},\dots,V_{k}$（**組**）に分け、異なる組の 2 頂点をすべて結び、同じ組の 2 頂点は結ばないグラフを**完全 $k$ 部グラフ**という。$n\ge k$ のとき、組の大きさの差がどれも 1 以下である $n$ 頂点の完全 $k$ 部グラフを**トゥラングラフ** $T^{k}(n)$ と書き、その辺の数を $t_{k}(n)$ と書く。$n<k$ のときは $T^{k}(n)\defeq K^{n}$ とする。
:::

::: intuition
$T^{k}(n)$ は、$n$ 人を $k$ チームにできるだけ均等に分け、違うチームの人どうしだけが握手するときの握手の図である。同じチームの人は握手しないので、$k+1$ 人が互いに握手している集まり（$K^{k+1}$）はできない（鳩の巣原理で、ある 2 人が同じチームになる）。
:::

::: lemma 均等な分け方が辺を最大にする {#comb:turan-graph-maximal keywords="balanced complete multipartite graphs maximize edges" index="トゥラングラフの最大性|とぅらんぐらふのさいだいせい"}
$1\le k$ とし、$n$ 頂点で組の数が $k$ 以下の完全多部グラフ全体を考える。$n\ge k$ なら辺の数が最大のものは $T^{k}(n)$ ただ一つであり、$n<k$ なら $K^{n}$ ただ一つである。また $T^{k}(n)$ は $K^{k+1}$ を含まない。
:::

::: proof
**Step 1（組を均等にする）.** 組 $V_{1},V_{2}$ が $\abs{V_{1}}-\abs{V_{2}}\ge2$ を満たすとする。$V_{1}$ の頂点 $v$ を $V_{2}$ へ移すと、$v$ に接続する辺の数は $n-\abs{V_{1}}$ から $n-\abs{V_{2}}-1$ に変わり、他の辺は変わらない。$n-\abs{V_{2}}-1>n-\abs{V_{1}}$ なので辺は増える。

**Step 2（組を増やす）.** 組の数 $j<k$ で、ある組が 2 個以上の頂点をもつとき、その組を 2 つの空でない組に分けると、新しい 2 組の間の辺が加わるので辺は真に増える。$n\ge k$ のとき組の数が $k$ 未満なら、ある組は 2 個以上の頂点をもつ（$j<k\le n$）。$n<k$ のときは、すべての組が 1 頂点になるまで分けられ、それが $K^{n}$。

**Step 3（結論）.** 辺の数が最大のものは Step 1, 2 の操作で辺を増やせないので、$n\ge k$ なら組がちょうど $k$ 個で大きさの差が 1 以下、すなわち $T^{k}(n)$（組の大きさの多重集合は $n$ と $k$ で決まるので、同型を除いて一意）。$n<k$ なら $K^{n}$。

**Step 4（$K^{k+1}$ を含まない）.** $K^{k+1}$ の $k+1$ 頂点を $k$ 個以下の組に入れると、鳩の巣原理で 2 頂点が同じ組に入り、隣接しない。
:::

::: proposition トゥラングラフの辺の数の評価 {#comb:turan-number-bound keywords="t_{r-1}(n) <= (1 - 1/(r-1)) n^2/2, limit of edge density" index="トゥラン数の評価|とぅらんすうのひょうか"}
$k\ge1$ について次が成り立つ。
1. $t_{k}(n)\le\left(1-\frac{1}{k}\right)\frac{n^{2}}{2}$ で、$k$ が $n$ を割り切るとき等号が成り立つ。
2. $t_{k}(n)\ge\left(1-\frac{1}{k}\right)\frac{n^{2}}{2}-\frac{n}{2}$。
3. $\lim_{n\to\infty}t_{k}(n)\binom{n}{2}^{-1}=1-\frac{1}{k}$。
:::

::: proof
**Step 1（辺の数の式）.** $n\ge k$ とし、組の大きさを $n_{1},\dots,n_{k}$ とする。同じ組の中の対は辺でないので
$$t_{k}(n)=\binom{n}{2}-\sum_{i}\binom{n_{i}}{2}=\frac{1}{2}\left(n^{2}-\sum_{i}n_{i}^{2}\right).$$
（$n^{2}-n=\sum_{i}(n_{i}^{2}-n_{i})+2t_{k}(n)$ と $\sum n_{i}=n$ から。）

**Step 2（上界）.** \ref{lin:cauchy-schwarz}を $(n_{1},\dots,n_{k})$ と $(1,\dots,1)$ に使うと $n^{2}=(\sum n_{i})^{2}\le k\sum n_{i}^{2}$、よって $\sum n_{i}^{2}\ge n^{2}/k$ で 1 の不等式。等号は $n_{i}$ がすべて等しいとき、つまり $k\mid n$ のとき。$n<k$ のときは $t_{k}(n)=\binom{n}{2}=\frac{n^{2}-n}{2}\le\left(1-\frac{1}{k}\right)\frac{n^{2}}{2}$（$n\le k$ から $n^{2}/k\le n$）。

**Step 3（下界）.** $n\ge k$ では各 $n_{i}\le\frac{n}{k}+1$ なので $\sum n_{i}^{2}\le\left(\max_{i}n_{i}\right)\sum n_{i}\le\frac{n^{2}}{k}+n$、Step 1 から 2。$n<k$ では $t_{k}(n)=\frac{n^{2}-n}{2}\ge\left(1-\frac{1}{k}\right)\frac{n^{2}}{2}-\frac{n}{2}$。

**Step 4（極限）.** 1, 2 を $\binom{n}{2}=\frac{n(n-1)}{2}$ で割ると
$$\left(1-\frac{1}{k}\right)\frac{n}{n-1}-\frac{1}{n-1}\le\frac{t_{k}(n)}{\binom{n}{2}}\le\left(1-\frac{1}{k}\right)\frac{n}{n-1}$$
で、両辺は $n\to\infty$ で $1-\frac{1}{k}$ に収束する。
:::

## トゥランの定理 {#comb:sec-tu-turan}

::: theorem トゥランの定理 {#comb:turan-theorem keywords="Turan's theorem, ex(n,K^r) = t_{r-1}(n), unique extremal graph" index="トゥランの定理|とぅらんのていり" refname="トゥランの定理"}
$r\ge2$, $n\ge1$ とする。$n$ 頂点で $K^{r}$ を含まないグラフの辺の数は $t_{r-1}(n)$ 以下であり、等号が成り立つのは $G\cong T^{r-1}(n)$ のときに限る。特に $\mathrm{ex}(n,K^{r})=t_{r-1}(n)$。
:::

::: intuition
$K^{r}$ を避けるには「$r-1$ チームに分けて、チーム内では結ばない」のが最善で、それ以外の配置は必ず損をする。証明は、最適なグラフで「隣接しない」という関係が同値関係（チーム分け）になっていることを、頂点の**複製**で示す。
:::

::: proof
**Step 1（極値グラフをとる）.** $n$ 頂点で $K^{r}$ を含まないグラフは有限個なので、その中で辺の数が最大のもの $G$ をとる（$\mathrm{ex}(n,K^{r})$ 本の辺をもつ）。\ref{comb:turan-graph-maximal} の Step 4 により $T^{r-1}(n)$ は $K^{r}$ を含まないので $\norm{G}\ge t_{r-1}(n)$。$G\cong T^{r-1}(n)$ を示せば、辺の数の上界と等号の場合が同時に従う（$K^{r}$ を含まず辺が $t_{r-1}(n)$ 本のグラフはどれも極値グラフで、同じ議論が適用できる）。

**Step 2（複製の操作）.** 頂点 $v$ の**複製**とは、新しい頂点 $v'$ を加え、$v'$ を $N(v)$ のすべての頂点と結ぶ（$v$ とは結ばない）操作である。【主張：$K^{r}$ を含まないグラフの頂点を複製しても $K^{r}$ を含まない】複製後のクリーク $Q$ が $v'$ を含むなら、$v'$ と $v$ は隣接しないので $v\notin Q$ で、$Q$ の $v'$ を $v$ に取り替えると（$v$ も $Q\setminus\{v'\}$ のすべてと隣接する）元のグラフのクリークになる。よって大きさ $r$ のクリークは生じない。

**Step 3（非隣接は推移的）.** 【主張：$G$ で $y_{1}x\notin E$, $xy_{2}\notin E$ なら $y_{1}y_{2}\notin E$（$y_{1}\neq y_{2}$）】そうでなく $y_{1}y_{2}\in E$ とする。
- $d(y_{1})>d(x)$ なら、$x$ を削除して $y_{1}$ を複製する。$y_{1}$ と $x$ は隣接しないので $x$ を削除しても $d(y_{1})$ は変わらず、辺の数は $\norm{G}-d(x)+d(y_{1})>\norm{G}$。頂点の数は $n$ のままで、Step 2 から $K^{r}$ を含まない（$K^{r}$ を含まないグラフの部分グラフも含まない）。極値性に反する。$d(y_{2})>d(x)$ も同様。
- $d(y_{1})\le d(x)$ かつ $d(y_{2})\le d(x)$ なら、$y_{1},y_{2}$ を削除して $x$ を 2 回複製する。削除で失う辺は $d(y_{1})+d(y_{2})-1$ 本（辺 $y_{1}y_{2}$ が 2 回数えられる）、$x$ は $y_{1},y_{2}$ と隣接しないので次数 $d(x)$ のまま、2 つの複製で $2d(x)$ 本増える（2 つの複製どうし、および $x$ とは結ばれない）。増減は $2d(x)-d(y_{1})-d(y_{2})+1\ge1$ で、極値性に反する。

**Step 4（完全多部であること）.** 関係「$u=v$ または $uv\notin E$」は反射的・対称的で、Step 3 により推移的なので同値関係である。その同値類は独立集合で、異なる類の 2 頂点は隣接するから、$G$ は類を組とする完全多部グラフである。類が $r$ 個以上あれば各類から 1 頂点ずつとって $K^{r}$ ができるので、組の数は $r-1$ 以下。

**Step 5（結論）.** \ref{comb:turan-graph-maximal} により、組が $r-1$ 個以下の完全多部グラフで辺の数が最大のものは $T^{r-1}(n)$ だけで、$G$ は辺の数が最大（$\ge t_{r-1}(n)$）なので $G\cong T^{r-1}(n)$。
:::

::: corollary マンテルの定理 {#comb:mantel keywords="Mantel's theorem, triangle-free graphs have at most n^2/4 edges" index="マンテルの定理|まんてるのていり" refname="マンテルの定理"}
$n$ 頂点で三角形 $K^{3}$ を含まないグラフの辺の数は $\lfloor n^{2}/4\rfloor$ 以下で、等号は $K_{\lfloor n/2\rfloor,\lceil n/2\rceil}$ のときに限る。
:::

::: intuition
三角形を避けるには、全員を半分ずつの 2 グループに分け、グループ間だけを結ぶのが最善である。
:::

::: proof
\ref{comb:turan-theorem} で $r=3$。$T^{2}(n)=K_{\lfloor n/2\rfloor,\lceil n/2\rceil}$ の辺の数は $\lfloor n/2\rfloor\lceil n/2\rceil=\lfloor n^{2}/4\rfloor$（$n$ の偶奇で場合分けすれば確かめられる）。
:::

::: example
**トゥランの定理と彩色数.** $K^{r}$ を含まないことは $\chi(G)\le r-1$ よりずっと弱い条件だが（三角形を含まず彩色数の大きいグラフがある、\ref{graph:page-vertex-coloring}）、辺の数の最大値については両者は同じ答え $t_{r-1}(n)$ を与える：$\chi(G)\le r-1$ のグラフは $r-1$ 個以下の独立集合に分かれるので、ある完全 $(r-1)$ 部グラフの部分グラフであり、辺は $t_{r-1}(n)$ 以下。
:::

## エルデシュ–ストーンの定理 {#comb:sec-tu-erdos-stone}

$K^{r}_{s}$ を、大きさ $s$ の組 $r$ 個からなる完全 $r$ 部グラフとする（$K^{2}_{s}=K_{s,s}$）。

::: fact エルデシュ–ストーンの定理 {#comb:erdos-stone keywords="Erdos-Stone theorem, t_{r-1}(n) + epsilon n^2 edges force K^r_s" index="エルデシュ–ストーンの定理|えるでしゅすとーんのていり" refname="エルデシュ–ストーンの定理"}
（P. Erdős と A. H. Stone, 1946）整数 $r\ge2$, $s\ge1$ と $\varepsilon>0$ について、ある $n_{0}$ があり、$n\ge n_{0}$ 頂点で辺が $t_{r-1}(n)+\varepsilon n^{2}$ 本以上のグラフは $K^{r}_{s}$ を含む。証明は正則性補題を使って \ref[正則性補題の応用]{comb:page-regularity-applications} で与える。
:::

::: intuition
トゥランの定理の限界をほんの少し（$\varepsilon n^{2}$ 本）超えるだけで、$K^{r}$ が 1 つ現れるどころか、各組が $s$ 頂点に膨らんだ $K^{r}_{s}$ まで現れる。極値グラフの近くでは、構造がほぼ $T^{r-1}(n)$ に固定されているからである。
:::

::: corollary エルデシュ–ストーン–シモノヴィッツの定理 {#comb:erdos-stone-simonovits keywords="ex(n,H)/binom(n,2) tends to (chi(H)-2)/(chi(H)-1)" index="エルデシュ–ストーン–シモノヴィッツの定理|えるでしゅすとーんしものゔぃっつのていり" refname="エルデシュ–ストーン–シモノヴィッツの定理"}
（\ref{comb:erdos-stone} を仮定する）辺を 1 本以上もつグラフ $H$ について、$r\defeq\chi(H)$ とおくと
$$\lim_{n\to\infty}\frac{\mathrm{ex}(n,H)}{\binom{n}{2}}=\frac{r-2}{r-1}.$$
特に $H$ が二部グラフなら $\mathrm{ex}(n,H)=o(n^{2})$。
:::

::: intuition
$H$ を避けるための「最良のチーム分け」は、$H$ が収まりきらないぎりぎりのチーム数、すなわち $\chi(H)-1$ チームへの分け方である。エルデシュ–ストーンの定理は、それより本質的に良い（辺の割合が大きい）避け方はない、と述べる。
:::

::: proof
**Step 1（下界）.** 【主張：$\mathrm{ex}(n,H)\ge t_{r-1}(n)$】$H$ が $T^{r-1}(n)$ に含まれるなら、$T^{r-1}(n)$ の $r-1$ 色の彩色（組ごとに 1 色）を制限して $\chi(H)\le r-1$ となり矛盾。よって $T^{r-1}(n)$ は $H$ を含まず、$\mathrm{ex}(n,H)\ge t_{r-1}(n)$。$H$ は辺をもつので $r\ge2$。

**Step 2（$H\subseteq K^{r}_{s}$）.** $s\defeq\abs{H}$ とする。$H$ の $r$ 色の彩色の各色クラスは独立で $s$ 個以下の頂点をもつので、色クラス $i$ を $K^{r}_{s}$ の第 $i$ 組に単射で送れば、異なる色の頂点は異なる組に写り、$H$ の辺は $K^{r}_{s}$ の辺に写る。よって $H\subseteq K^{r}_{s}$ で、$K^{r}_{s}$ を含むグラフは $H$ を含む。

**Step 3（上界）.** $\varepsilon>0$ を任意にとる。\ref{comb:erdos-stone} により、$n\ge n_{0}$ なら $t_{r-1}(n)+\varepsilon n^{2}$ 本以上の辺をもつグラフは $K^{r}_{s}$、したがって $H$ を含むので、$\mathrm{ex}(n,H)<t_{r-1}(n)+\varepsilon n^{2}$。$n\ge2$ では $\varepsilon n^{2}/\binom{n}{2}=2\varepsilon n/(n-1)\le4\varepsilon$。

**Step 4（極限）.** Step 1, 3 から $n\ge\max(n_{0},2)$ で
$$\frac{t_{r-1}(n)}{\binom{n}{2}}\le\frac{\mathrm{ex}(n,H)}{\binom{n}{2}}<\frac{t_{r-1}(n)}{\binom{n}{2}}+4\varepsilon.$$
\ref{comb:turan-number-bound} の 3 により左端は $\frac{r-2}{r-1}$ に収束するので、上極限と下極限の差は $4\varepsilon$ 以下で、$\varepsilon$ は任意だから極限は $\frac{r-2}{r-1}$。$r=2$ なら極限は 0。
:::

## 二部グラフを禁止する場合 {#comb:sec-tu-bipartite}

::: theorem コヴァーリ–ショーシュ–トゥランの定理 {#comb:kovari-sos-turan keywords="Kovari-Sos-Turan theorem, ex(n,K_{t,t}) = O(n^{2-1/t}), Zarankiewicz problem" index="コヴァーリ–ショーシュ–トゥランの定理|こゔぁーりしょーしゅとぅらんのていり, ザランキェヴィッチの問題|ざらんきぇゔぃっちのもんだい" refname="コヴァーリ–ショーシュ–トゥランの定理"}
$t\ge1$ とする。$n$ 頂点で $K_{t,t}$ を含まないグラフの辺の数 $m$ は
$$m\le\frac{1}{2}(t-1)^{1/t}n^{2-1/t}+\frac{1}{2}(t-1)n$$
を満たす。
:::

::: intuition
$K_{t,t}$ を含まないことは「どの $t$ 点も、共通の隣人を $t$ 人以上もたない」ということである。各頂点の近傍から $t$ 点を選ぶ方法の総数を数えると、次数が大きいほど多くなるが、この条件から総数は $t-1$ 倍の $\binom{n}{t}$ で抑えられる。
:::

::: proof
**Step 1（二重数え上げ）.** 組 $(v,S)$ で $S\subseteq N(v)$, $\abs{S}=t$ となるものの個数 $Z$ を二通りに数える。$v$ ごとに数えると $Z=\sum_{v}\binom{d(v)}{t}$。$S$ ごとに数えると、【主張：各 $t$ 点集合 $S$ について $S\subseteq N(v)$ となる $v$ は $t-1$ 個以下】そのような $v$ が $t$ 個あれば、それらは $S$ に属さず（$v\notin N(v)$）、$S$ のすべての点と隣接するので $K_{t,t}$ をなし、仮定に反する。よって $Z\le(t-1)\binom{n}{t}\le(t-1)\frac{n^{t}}{t!}$。

**Step 2（各項の下界）.** $a_{v}\defeq\max(d(v)-t+1,0)$ とおく。$d(v)\ge t$ なら $\binom{d(v)}{t}=\frac{1}{t!}\prod_{i=0}^{t-1}(d(v)-i)\ge\frac{a_{v}^{t}}{t!}$（各因子は $d(v)-t+1$ 以上）。$d(v)\le t-1$ なら $a_{v}=0$ で同じ不等式は自明。よって $\sum_{v}a_{v}^{t}\le t!\,Z\le(t-1)n^{t}$。

**Step 3（平均をとる）.** $x\mapsto x^{t}$ は $[0,\infty)$ で凸なので、イェンセンの不等式（\ref{prb:basic-inequalities}、一様分布に適用）から
$$\left(\frac{1}{n}\sum_{v}a_{v}\right)^{t}\le\frac{1}{n}\sum_{v}a_{v}^{t}\le(t-1)n^{t-1}.$$
よって $\sum_{v}a_{v}\le(t-1)^{1/t}n^{2-1/t}$。

**Step 4（結論）.** $d(v)\le a_{v}+(t-1)$ なので、\ref{graph:handshake}から $2m=\sum_{v}d(v)\le(t-1)^{1/t}n^{2-1/t}+(t-1)n$。
:::

::: example
$t=2$ のとき、$K_{2,2}=C^{4}$ を含まないグラフは $m\le\frac{1}{2}n^{3/2}+\frac{1}{2}n$ を満たす。一方、有限射影平面の点と直線の接続グラフから、$m$ が $n^{3/2}$ の定数倍のオーダーの $C^{4}$ を含まないグラフが作れることが知られており（R. Diestel, *Graph Theory*, 第 7 章の注などによる）、指数 $3/2$ は改善できない。
:::

::: hypcheck
- **トゥランの定理**：$G$ の極値性は Step 3 で 2 回（複製で辺が増えること）使った。複製で $K^{r}$ が生じないこと（Step 2）が、操作後のグラフも比較の対象になることを保証する。グラフの有限性は Step 1 で最大値の存在に使った。
- **エルデシュ–ストーン–シモノヴィッツ**：$H$ が辺をもつことは $r\ge2$（Step 1）に、$H$ の有限性は Step 2 の $s=\abs{H}$ に使った。エルデシュ–ストーンの定理はこのページでは証明していない。
- **コヴァーリ–ショーシュ–トゥラン**：$K_{t,t}$ を含まないことは Step 1 の主張でだけ使った。
:::

## 問題 {#comb:sec-tu-problems}

::: problem {#comb:prob-tu-edge-maximal}
$n$ 頂点で $K^{3}$ を含まず、どの辺を加えても $K^{3}$ ができる（辺について極大な）グラフで、$\mathrm{ex}(n,K^{3})$ より辺が少ないものの例を挙げよ。（極大は極値を意味しない。）
:::

::: solution
$n=5$ の閉路 $C^{5}$。三角形を含まず、隣接しない 2 頂点は閉路上で距離 2 なので共通の隣接頂点をもち、その間に辺を加えると三角形ができる。辺は 5 本で、$\mathrm{ex}(5,K^{3})=\lfloor25/4\rfloor=6$ より少ない。
:::

::: problem {#comb:prob-tu-path}
$n$ 頂点で、長さ 2 の道 $P$（3 頂点 2 辺）を含まないグラフの辺の数は $\lfloor n/2\rfloor$ 以下であることを示し、極値グラフを決定せよ。
:::

::: solution
長さ 2 の道を含まないことは、どの頂点の次数も 1 以下であることと同値である（次数 2 の頂点とその 2 つの隣接頂点が長さ 2 の道をなす）。よって辺は互いに端点を共有せず（マッチング）、$\lfloor n/2\rfloor$ 本以下。極値グラフは $\lfloor n/2\rfloor$ 本の辺からなるマッチング（$n$ が奇数なら孤立点が 1 つ）で、同型を除いて一意。$\chi(P)=2$ なので \ref{comb:erdos-stone-simonovits} の極限 0 と整合する。
:::

::: problem {#comb:prob-tu-degree-version}
$n$ 頂点で $K^{r}$ を含まないグラフは $\delta(G)\le\left(1-\frac{1}{r-1}\right)n$ を満たすことを示せ。
:::

::: solution
\ref{comb:turan-theorem} と \ref{comb:turan-number-bound} の 1 から $\norm{G}\le\left(1-\frac{1}{r-1}\right)\frac{n^{2}}{2}$。握手補題により $n\delta(G)\le\sum_{v}d(v)=2\norm{G}\le\left(1-\frac{1}{r-1}\right)n^{2}$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** トゥランの定理の証明（ジコフの対称化）では帰納法を使わず、極値グラフの局所的な比較だけで完全多部構造を導いた。帰納法による証明（$K^{r-1}$ を一つ固定し、残りに帰納法の仮定を使う）もある（R. Diestel, *Graph Theory*, 定理 7.1.1 の第 1 証明）。

**前提を変えると.**
- 禁止するグラフを $K^{r}$ から一般の $H$ に変えると、正確な $\mathrm{ex}(n,H)$ は一般には分からないが、主要項は \ref{comb:erdos-stone-simonovits} で決まる。二部グラフ $H$ については主要項が 0 になり、$\mathrm{ex}(n,K_{t,t})$ の正確なオーダーは $t=2,3$ を除いて未解決であると一般には言われている。
- 森 $H$ については $\mathrm{ex}(n,H)$ は $n$ の 1 次で抑えられ、$k$ 本の辺をもつ木 $T$ について $\mathrm{ex}(n,T)\le\frac{1}{2}(k-1)n$ と予想されている（エルデシュ–ショーシュ予想）。

**類似の定理.** 「辺の数」の代わりに「最小次数」を条件にした版（ディラック型の定理）や、「$K^{r}$ の個数」を数える版（$K^{r}$ を含まない代わりに三角形の個数の下界を与える、グッドマンの定理など）がある。

**高い視点から：極値問題は「彩色数という一つの不変量への射影」.** \ref{comb:erdos-stone-simonovits} は、無限に多様なグラフ $H$ についての極値問題が、主要項のレベルでは $\chi(H)$ という一つの整数にしか依存しないことを述べる。これは、密なグラフを「組の間の辺密度」という粗い量だけで見る視点（正則性補題、グラフ極限）では、$H$ を含むかどうかが「$H$ を何色で塗れるか」という準同型の問題に還元されるためである：$H$ が $T^{r-1}(n)$ に入るとは、$H$ から $K^{r-1}$ への準同型（隣接を保つ写像）が存在することと同じである。比喩で言えば、極値グラフ理論の主要項は、グラフを「チームの対戦表」まで縮めて眺めたときに見える性質であり、二部グラフのように対戦表の上では見えない（2 チームに収まる）$H$ について初めて、細かい構造（$n^{2-1/t}$ のような中間のオーダー）が問題になる。
:::
