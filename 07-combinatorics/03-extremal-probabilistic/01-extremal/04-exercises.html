# 演習：極値グラフ理論 {#comb:page-exercises-extremal keywords="exercises, extremal"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるもの、定理の限界を確かめるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exextremal-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。グラフは有限・単純。

## トゥランの定理とエルデシュ–ストーンの定理 {#comb:sec-tu-exercises}

対応するページ：\ref{comb:page-turan}

::: problem ★ 基本：三角形のないグラフの小さい次数 {#comb:ex-tu-small-degree}
$n$ 頂点で三角形を含まないグラフは、次数 $n/2$ 以下の頂点をもつことを示せ。
:::

::: solution
\ref{comb:mantel} から辺は $n^{2}/4$ 本以下で、\ref{graph:handshake} から平均次数は $2\cdot\frac{n^{2}/4}{n}=\frac{n}{2}$ 以下。最小次数は平均以下である。
:::

::: problem ★★ 標準：2 本の交わらない辺を禁止する {#comb:ex-tu-two-edges}
$n\ge3$ 頂点のグラフで、端点を共有しない 2 本の辺を含まないものの辺の数の最大値は $\max(n-1,3)$ であることを示し、極値グラフを決定せよ。
:::

::: solution
辺がどの 2 本も端点を共有するとする。辺 $ab$ と、それと異なる辺 $ac$（端点 $a$ を共有するとしてよい）があるとき、3 本目の辺 $e$ は $ab$ と $ac$ の両方と交わるので、$a$ を含むか $e=bc$ である。$bc$ があると、さらに別の辺は $ab,ac,bc$ のすべてと交わり、$\{a,b,c\}$ の 2 点を含むので既存の辺である。よってグラフ（の辺）は、1 頂点を共有する星か三角形で、辺の数は $n-1$ 以下か 3。極値グラフは、$n\ge5$ で星 $K_{1,n-1}$（と孤立点なし）、$n=3$ で三角形（$=$ 星 $+$ 1 辺）、$n=4$ で星 $K_{1,3}$ と三角形 $+$ 孤立点の 2 つ。
:::

## セメレディの正則性補題 {#comb:sec-rg-exercises}

対応するページ：\ref{comb:page-regularity-lemma}

::: problem ★ 基本：完全二部グラフの指数 {#comb:ex-rg-index-kn}
$K_{n,n}$ の両側を $A,B$ とする分割 $\{A,B\}$ の指数 $q$ を計算せよ（\ref{comb:partition-index}）。
:::

::: solution
頂点数は $2n$、$d(A,B)=1$ なので $q(\{A,B\})=\frac{n\cdot n}{(2n)^{2}}\cdot1^{2}=\frac14$。
:::

::: problem ★★ 標準：正則な対の部分 {#comb:ex-rg-slicing}
$(A,B)$ を密度 $d$ の $\varepsilon$ 正則な対、$0<\alpha\le1$ とし、$A'\subseteq A$, $B'\subseteq B$ が $\abs{A'}\ge\alpha\abs{A}$, $\abs{B'}\ge\alpha\abs{B}$ を満たすとする。$\varepsilon\le\alpha$ なら $(A',B')$ は $\varepsilon'\defeq\max(2\varepsilon,\varepsilon/\alpha)$ 正則であることを示せ。
:::

::: solution
$X\subseteq A'$, $Y\subseteq B'$ が $\abs{X}\ge\varepsilon'\abs{A'}$, $\abs{Y}\ge\varepsilon'\abs{B'}$ を満たすとすると、$\abs{X}\ge\frac{\varepsilon}{\alpha}\alpha\abs{A}=\varepsilon\abs{A}$、同様に $\abs{Y}\ge\varepsilon\abs{B}$。正則性から $\abs{d(X,Y)-d}\le\varepsilon$。また $\abs{A'}\ge\alpha\abs{A}\ge\varepsilon\abs{A}$ なので $\abs{d(A',B')-d}\le\varepsilon$。よって $\abs{d(X,Y)-d(A',B')}\le2\varepsilon\le\varepsilon'$（\ref{comb:regular-pair}）。
:::

## 正則性補題の応用 {#comb:sec-ra-exercises}

対応するページ：\ref{comb:page-regularity-applications}

::: problem ★★ 標準：各辺がちょうど 1 つの三角形に属するグラフ {#comb:ex-ra-ruzsa-szemeredi}
$n$ 頂点のグラフ $G_{n}$ で、どの辺もちょうど 1 つの三角形に含まれるものを考える。辺の数は $o(n^{2})$ であることを、\ref{comb:triangle-removal-lemma} から示せ。
:::

::: solution
辺 $m$ 本の各辺がちょうど 1 つの三角形に含まれるので、三角形は互いに辺を共有せず、$m/3$ 個ある。$m/3\le n^{2}/6$ なので、任意の $\delta>0$ について十分大きい $n$ で三角形は $\delta n^{3}$ 個以下。$\eta>0$ に対する $\delta$ をとると、$\eta n^{2}$ 本以下の辺を除けば三角形がなくなるが、辺を共有しない $m/3$ 個の三角形を壊すには $m/3$ 本以上除く必要があるので $m/3\le\eta n^{2}$。$\eta$ は任意なので $m=o(n^{2})$。
:::

::: problem ★★ 標準：二部グラフの場合のエルデシュ–ストーン {#comb:ex-ra-bipartite-es}
$r=2$ の場合のエルデシュ–ストーンの定理（辺が $\varepsilon n^{2}$ 本以上のグラフは、$n$ が大きければ $K_{s,s}$ を含む）を、正則性補題を使わずに \ref{comb:kovari-sos-turan} から導け。
:::

::: solution
$t_{1}(n)=0$ なので、示すべきは「$m\ge\varepsilon n^{2}$ なら $K_{s,s}\subseteq G$」。$K_{s,s}$ を含まなければ、コヴァーリ–ショーシュ–トゥランから $m\le\frac12(s-1)^{1/s}n^{2-1/s}+\frac12(s-1)n$。右辺を $n^{2}$ で割ると $n\to\infty$ で 0 に収束するので、十分大きい $n$ では $\varepsilon n^{2}$ 未満で、仮定に反する。
:::
