# 演習：スペクトルグラフ理論 {#comb:page-exercises-spectral keywords="exercises, spectral graph theory, matrix tree theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#comb:sec-exspectral-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$A$ は隣接行列、$L$ はラプラシアン、$\tau(G)$ は全域木の個数。
:::

## グラフのスペクトル {#comb:sec-sp-exercises}

対応するページ：\ref{comb:page-graph-spectra}

::: problem ★ 基本：三角形の数 {#comb:ex-sp-k4-triangles}
$K^{4}$ のスペクトル（$3$ と $-1$（重複度 3））から、\ref{comb:walks-trace} を使って三角形の個数を求めよ。
:::

::: solution
$\sum\lambda_{i}^{3}=27+3\cdot(-1)=24=6t$ から $t=4$。実際 $K^{4}$ の 3 頂点の組 $\binom{4}{3}=4$ 個はすべて三角形。
:::

::: problem ★★ 標準：完全二部グラフのスペクトル {#comb:ex-sp-kmn}
$K_{m,n}$ のスペクトルが $\pm\sqrt{mn}$（各重複度 1）と $0$（重複度 $m+n-2$）であることを示せ。
:::

::: solution
両側を $X$（$m$ 点）, $Y$（$n$ 点）とすると、$A$ の行は $X$ の点ではすべて $\mathbf{1}_{Y}$、$Y$ の点ではすべて $\mathbf{1}_{X}$ なので、$A$ の階数は 2 で、固有値 0 の重複度は $m+n-2$ 以上（\ref{lin:rank-nullity}）。$x=a\mathbf{1}_{X}+b\mathbf{1}_{Y}$ について $Ax=bn\mathbf{1}_{X}+am\mathbf{1}_{Y}$ なので、$bn=\lambda a$, $am=\lambda b$ から $\lambda^{2}=mn$、$\lambda=\pm\sqrt{mn}$ は固有値。合わせて $m+n$ 個で、二部グラフのスペクトルの対称性（\ref{comb:bipartite-spectrum}）とも一致する。
:::

## ラプラシアンと行列木定理 {#comb:sec-lp-exercises}

対応するページ：\ref{comb:page-laplacian-matrix-tree}

::: problem ★ 基本：木の余因子 {#comb:ex-lp-tree}
3 頂点の道 $P$（$1-2-3$）のラプラシアンを書き、どの対角余因子も 1 であることを確かめよ。
:::

::: solution
$L=\begin{pmatrix}1&-1&0\\-1&2&-1\\0&-1&1\end{pmatrix}$。第 1 行・列を除くと $\det\begin{pmatrix}2&-1\\-1&1\end{pmatrix}=1$、第 2 行・列を除くと $\det\begin{pmatrix}1&0\\0&1\end{pmatrix}=1$、第 3 行・列を除くと $\det\begin{pmatrix}1&-1\\-1&2\end{pmatrix}=1$。木の全域木は自分自身だけなので $\tau=1$（\ref{comb:matrix-tree-theorem}）。
:::

::: problem ★★ 標準：$K_{2,3}$ の全域木 {#comb:ex-lp-k23}
$K_{2,3}$ の全域木の個数を行列木定理で求めよ。
:::

::: solution
2 点側を $a,b$（次数 3）、3 点側を $x,y,z$（次数 2）とし、$L$ から $a$ の行と列を除くと（行と列の順を $b,x,y,z$ として）
$$L_{0}=\begin{pmatrix}3&-1&-1&-1\\-1&2&0&0\\-1&0&2&0\\-1&0&0&2\end{pmatrix}.$$
第 1 行に第 2〜4 行の $\frac12$ 倍を足すと（行列式は変わらない）第 1 行は $(\frac32,0,0,0)$ になり、第 1 行で展開して $\det L_{0}=\frac32\cdot\det(2I_{3})=\frac32\cdot8=12$。（一般に $\tau(K_{m,n})=m^{n-1}n^{m-1}$ で、$2^{2}\cdot3=12$ と一致する。）
:::
