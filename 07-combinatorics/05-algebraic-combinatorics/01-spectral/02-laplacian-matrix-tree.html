# ラプラシアンと行列木定理 {#comb:page-laplacian-matrix-tree keywords="Laplacian matrix L = D - A, incidence matrix, positive semidefinite, number of connected components, Kirchhoff's matrix tree theorem, number of spanning trees, Cauchy-Binet, Cayley's formula, algebraic connectivity, Fiedler"}

グラフの**ラプラシアン** $L=D-A$（$D$ は次数を並べた対角行列）は、隣接行列とならぶ基本的な行列である。ラプラシアンは「各辺での値の差の 2 乗の和」を表す 2 次形式で、その固有値は非負であり、固有値 0 の重複度が連結成分の数になる。このページの中心は、全域木の個数がラプラシアンの小行列式に等しいという**キルヒホッフの行列木定理**で、コーシー–ビネの公式から証明する。系としてケイリーの公式 $n^{n-2}$ をもう一度導く。

## 記法と定義の確認 {#comb:sec-lp-notation}

::: notation
- グラフは有限・単純で、頂点を $1,\dots,n$、辺を $e_{1},\dots,e_{m}$ とする。全域木・木の特徴づけ・葉の存在・ケイリーの公式は \ref{graph:page-trees-bipartite} のとおり。隣接行列 $A$ と固有値は \ref{comb:page-graph-spectra} のとおり。
- 行列 $X$ の行の集合 $R$・列の集合 $K$ の小行列を $X_{R,K}$ と書く。\ref{lin:cauchy-binet}、余因子展開は \ref{lin:cofactor-expansion}、固有多項式の係数と主小行列式の関係は \ref{lin:char-poly} の 1 のとおり。
- 体系は $\ZF$。
:::

## ラプラシアン {#comb:sec-lp-laplacian}

::: definition ラプラシアンと接続行列 {#comb:laplacian keywords="Laplacian matrix L = D - A, oriented incidence matrix N, L = N N^T" index="ラプラシアン（グラフの）|らぷらしあん, 向き付けられた接続行列|むきづけられたせつぞくぎょうれつ" refname="ラプラシアン"}
$D$ を $D_{ii}=d(i)$ の対角行列とし、$L\defeq D-A$ をグラフの**ラプラシアン**という。各辺 $e=uv$ に向き（$u\to v$）を一つ定め、$n\times m$ 行列 $N$ を、$N_{u,e}=1$, $N_{v,e}=-1$、それ以外の成分を 0 とする（**向き付けられた接続行列**）。このとき $L=NN^{\mathsf{T}}$ であり、$x\in\mathbb{R}^{n}$ について
$$x^{\mathsf{T}}Lx=\sum_{uv\in E}(x_{u}-x_{v})^{2}.$$
:::

::: intuition
頂点に「電位」$x$ を置くと、$x^{\mathsf{T}}Lx$ は各辺（抵抗 1 の導線）での電位差の 2 乗の和、すなわち回路が消費するエネルギーである。ラプラシアンは、熱や電気がグラフの上をどう流れるかを記述する、離散版のラプラス作用素である。
:::

::: proposition ラプラシアンの基本性質 {#comb:laplacian-basic keywords="L is positive semidefinite, L 1 = 0, multiplicity of eigenvalue 0 equals the number of components" index="ラプラシアンの固有値|らぷらしあんのこゆうち"}
1. $L=NN^{\mathsf{T}}$（向きの選び方によらない）。
2. $L$ は半正定値で、固有値は $0=\mu_{1}\le\mu_{2}\le\cdots\le\mu_{n}$ と並べられる（$L\mathbf{1}=0$）。
3. 固有値 0 の重複度は $G$ の連結成分の個数に等しい。特に $G$ が連結であることと $\mu_{2}>0$ は同値（$\mu_{2}$ を**代数的連結度**という）。
:::

::: proof
**Step 1（1）.** $(NN^{\mathsf{T}})_{uw}=\sum_{e}N_{u,e}N_{w,e}$。$u=w$ では、$u$ に接続する各辺が $(\pm1)^{2}=1$ を与えるので $d(u)$。$u\neq w$ では、$u,w$ の両方に接続する辺は辺 $uw$ だけで、その寄与は $1\cdot(-1)=-1$、なければ 0。これは $L$ の成分である。向きを逆にすると $N$ の列の符号が変わるだけで、$NN^{\mathsf{T}}$ は変わらない。

**Step 2（2）.** $x^{\mathsf{T}}Lx=\abs{N^{\mathsf{T}}x}^{2}$ で、$(N^{\mathsf{T}}x)_{e}=x_{u}-x_{v}$（$e=u\to v$）なので、定義の式と $x^{\mathsf{T}}Lx\ge0$ が従う。$L$ は実対称なので、固有ベクトル $x$ に対する固有値 $\mu$ は $\mu\abs{x}^{2}=x^{\mathsf{T}}Lx\ge0$ を満たす。各行の和は $d(u)-d(u)=0$ なので $L\mathbf{1}=0$。

**Step 3（3）.** 【主張：$\ker L$ は各連結成分の上で定数のベクトルの全体】$Lx=0$ なら $x^{\mathsf{T}}Lx=0$ で、すべての辺 $uv$ で $x_{u}=x_{v}$、したがって連結成分の上で定数。逆にそのような $x$ は $N^{\mathsf{T}}x=0$ で $Lx=0$。連結成分が $c$ 個なら、成分ごとの指示ベクトルが $\ker L$ の基底で、次元は $c$。実対称行列では固有値 0 の重複度は $\dim\ker L$（\ref{lin:spectral-theorem} の 3）。
:::

## 行列木定理 {#comb:sec-lp-matrix-tree}

::: lemma 全域木と接続行列の小行列式 {#comb:incidence-minor-tree keywords="an (n-1)-subset of edges gives a minor +-1 of the reduced incidence matrix iff it is a spanning tree, else 0" index="接続行列の小行列式|せつぞくぎょうれつのしょうぎょうれつしき"}
頂点 $i$ を固定し、$N$ から第 $i$ 行を除いた $(n-1)\times m$ 行列を $N_{0}$ とする。$n-1$ 本の辺の集合 $S$ について、$N_{0}$ の列を $S$ に制限した $(n-1)\times(n-1)$ 行列 $N_{0}[S]$ の行列式は、$S$ が全域木の辺集合なら $\pm1$、そうでなければ $0$ である。
:::

::: proof
**Step 1（木でない場合）.** $S$ が全域木でなければ、$n$ 頂点・$n-1$ 辺の全域部分グラフ $(V,S)$ は連結でない（\ref{graph:tree-characterization}：$n-1$ 辺で連結なら木）。$i$ を含まない連結成分 $C$ をとる。$S$ の各辺について、$C$ の頂点に対応する行の成分の和は、辺が $C$ の中にあれば $1+(-1)=0$、$C$ と交わらなければ $0$（$C$ と外を結ぶ辺は $S$ にない）。$C$ の頂点はすべて $N_{0}$ の行として残っているので、$N_{0}[S]$ の行のうち $C$ のものの和は零ベクトルで、行列式は 0。

**Step 2（木の場合：$n$ の帰納法）.** 【主張：$S$ が全域木なら $\det N_{0}[S]=\pm1$】$n=1$ では空行列の行列式 1。$n\ge2$ なら木は 2 つ以上の葉をもつ（\ref{graph:tree-leaves}）ので、$i$ 以外の葉 $v$ がある。$N_{0}[S]$ の $v$ の行は、$v$ に接続する唯一の辺 $e$ の列だけに $\pm1$ をもつ。その行で余因子展開（\ref{lin:cofactor-expansion}）すると、$\det N_{0}[S]=\pm\det N'$ で、$N'$ は $v$ の行と $e$ の列を除いた行列、すなわち木 $S-e$（$n-1$ 頂点、$v$ を除いたグラフの全域木）について同じ構成をした行列である。帰納法の仮定から $\det N'=\pm1$。
:::

::: theorem キルヒホッフの行列木定理 {#comb:matrix-tree-theorem keywords="Kirchhoff's matrix tree theorem: the number of spanning trees equals any cofactor of the Laplacian" index="行列木定理|ぎょうれつきていり, キルヒホッフの定理|きるひほっふのていり, 全域木の個数|ぜんいきぎのこすう" refname="行列木定理"}
グラフ $G$ の全域木の個数を $\tau(G)$ とする。ラプラシアン $L$ から第 $i$ 行と第 $i$ 列を除いた行列を $L_{0}$ とすると、どの $i$ についても $\tau(G)=\det L_{0}$。
:::

::: intuition
ラプラシアンは接続行列の「2 乗」$NN^{\mathsf{T}}$ であり、コーシー–ビネの公式は 2 乗の行列式を「$n-1$ 本の辺の選び方ごとの小行列式の 2 乗の和」に分解する。小行列式は全域木なら $\pm1$、そうでなければ 0 なので、和はちょうど全域木の個数を数える。
:::

::: proof
**Step 1（分解）.** $L=NN^{\mathsf{T}}$ から第 $i$ 行と第 $i$ 列を除くと $L_{0}=N_{0}N_{0}^{\mathsf{T}}$。

**Step 2（コーシー–ビネ）.** 【主張：$\det L_{0}=\sum_{S}(\det N_{0}[S])^{2}$】\ref{lin:cauchy-binet} を $X=N_{0}$（$(n-1)\times m$）, $Y=N_{0}^{\mathsf{T}}$ に使うと
$$\det L_{0}=\sum_{\abs{S}=n-1}\det N_{0}[S]\cdot\det\left(N_{0}[S]\right)^{\mathsf{T}}=\sum_{\abs{S}=n-1}\left(\det N_{0}[S]\right)^{2}$$
（$m<n-1$ なら和は空で 0）。

**Step 3（結論）.** \ref{comb:incidence-minor-tree} から、各項は $S$ が全域木なら 1、そうでなければ 0。よって和は全域木の個数。
:::

::: corollary ケイリーの公式と固有値の公式 {#comb:matrix-tree-corollaries keywords="Cayley's formula n^{n-2} from the matrix tree theorem, tau(G) = mu_2 ... mu_n / n" index="全域木の個数と固有値|ぜんいきぎのこすうとこゆうち"}
1. $\tau(K^{n})=n^{n-2}$。
2. $\tau(G)=\dfrac{1}{n}\mu_{2}\mu_{3}\cdots\mu_{n}$。
:::

::: proof
**Step 1（1）.** $L(K^{n})=nI-J$ なので $L_{0}=nI_{n-1}-J_{n-1}$。$k\times k$ 行列 $aI+cJ$ の行列式は $a^{k-1}(a+ck)$（すべての列を第 1 列に足すと第 1 列は $(a+ck)\mathbf{1}$ になり、それをくくり出したあと第 1 行を他の行から引くと、対角成分 $1,a,\dots,a$ の上三角行列になる）。$a=n$, $c=-1$, $k=n-1$ として $\det L_{0}=n^{n-2}(n-(n-1))=n^{n-2}$。

**Step 2（2）.** $L$ の固有多項式は $\chi_{L}(t)=\prod_{j}(t-\mu_{j})=t\prod_{j\ge2}(t-\mu_{j})$ で、$t$ の係数は $(-1)^{n-1}\mu_{2}\cdots\mu_{n}$。一方 \ref{lin:char-poly} の 1 から、$t$ の係数は $(-1)^{n-1}e_{n-1}(L)$ で、$e_{n-1}(L)$ は $n$ 個の $(n-1)$ 次主小行列式の和。行列木定理から各主小行列式は $\tau(G)$ なので $e_{n-1}(L)=n\tau(G)$。
:::

::: example
1. 閉路 $C_{n}$ の全域木は、辺を 1 本除いたもの $n$ 個。行列木定理では、$L_{0}$ は対角成分 2、隣り合う成分 $-1$ の $(n-1)\times(n-1)$ 三重対角行列で、行列式は $n$（$\det$ を $D_{k}$ とすると $D_{k}=2D_{k-1}-D_{k-2}$, $D_{1}=2$, $D_{2}=3$ から $D_{k}=k+1$）。
2. $K^{n}$ のラプラシアンの固有値は $0$ と $n$（重複度 $n-1$）で、$\frac{1}{n}n^{n-1}=n^{n-2}$ は 2 と一致する。
:::

::: hypcheck
- **行列木定理**：$L=NN^{\mathsf{T}}$（Step 1）とコーシー–ビネ（Step 2）、接続行列の小行列式の補題（Step 3）だけを使う。単純グラフである必要はなく、多重辺があっても同じ証明が通る（ループは $N$ の列が 0 になり、全域木に使われない）。
- **小行列式の補題**：「$n-1$ 辺で連結なら木」（Step 1）と、葉が 2 つ以上あること（Step 2 で $i$ 以外の葉をとる）を使った。
- **固有値の公式**：$\mu_{1}=0$ であること（$L\mathbf{1}=0$）と、主小行列式がすべて $\tau(G)$ に等しいこと（$i$ によらない）を使った。
:::

## 問題 {#comb:sec-lp-problems}

::: problem {#comb:prob-lp-k4-minus-edge}
$K^{4}$ から 1 本の辺を除いたグラフの全域木の個数を行列木定理で求めよ。
:::

::: solution
頂点 $1,2,3,4$ で辺 $34$ を除くと、次数は $3,3,2,2$。$L$ の第 4 行・第 4 列を除いた行列は
$$L_{0}=\begin{pmatrix}3&-1&-1\\-1&3&-1\\-1&-1&2\end{pmatrix},\qquad\det L_{0}=3(6-1)+1(-2-1)-1(1+3)=15-3-4=8.$$
（$K^{4}$ の 16 個の全域木のうち、辺 $34$ を含むものは対称性から $16\cdot3/6=8$ 個なので、残りは 8 個で一致する。）
:::

::: problem {#comb:prob-lp-components}
ラプラシアンの固有値 0 の重複度が連結成分の数であることを使って、$2K_{2}$（辺 2 本の互いに交わらない和）のラプラシアンのスペクトルを求めよ。
:::

::: solution
各 $K_{2}$ のラプラシアンは $\begin{pmatrix}1&-1\\-1&1\end{pmatrix}$ で固有値 $0,2$。2 つの和はブロック対角なので、スペクトルは $0,0,2,2$。0 の重複度 2 は成分の数 2 に等しい。$\tau=0$ で、固有値の公式 $\frac14\cdot0\cdot2\cdot2=0$ とも一致する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 行列木定理の証明では、向き付けの選び方は使わない（$\det N_{0}[S]$ の符号は 2 乗で消える）。

**前提を変えると.**
- 辺に重み（コンダクタンス）を付けた重み付きラプラシアンでは、小行列式は「全域木の辺の重みの積」の和になる（重み付き行列木定理）。有向グラフでは、ある頂点を根とする有向全域木の個数が、ラプラシアンの小行列式になる（タット）、と知られている。
- 小行列式の補題は、向き付けられた接続行列が**完全単模**（すべての小行列式が $0,\pm1$）であることの一部で、これは\ref{graph:max-flow-min-cut} の整数性の背景にある、と一般には言われている。

**類似の定理.** 代数的連結度 $\mu_{2}$ は連結度の下界を与え（フィードラー：$\mu_{2}\le\kappa(G)$）、チーガーの不等式によってグラフの「ボトルネック」（辺の少ないカット）の大きさと結びつく。これがエクスパンダーグラフとスペクトルクラスタリングの基礎である、と知られている。

**高い視点から：離散的なラプラス作用素とホモロジー.** 接続行列 $N$ は、グラフを 1 次元の複体と見たときの境界写像 $\partial\colon C_{1}\to C_{0}$ の行列であり、$L=NN^{\mathsf{T}}=\partial\partial^{*}$ は 0 次の組合せ論的ラプラシアンである。固有値 0 の重複度が連結成分の数（0 次のベッチ数）になるのは、ホッジ理論の「調和形式はホモロジーを表す」ことの最も簡単な場合である。行列木定理は、全域木（ホモロジーの基底を与える最小の部分複体）の個数を行列式で数える公式で、高次元の単体複体にも一般化されている。比喩で言えば、ラプラシアンは「グラフの上の熱の伝わり方」であり、全域木の個数は、そのグラフを最小限の導線でつなぐ方法の数として、電気回路の行列式に現れる。
:::
