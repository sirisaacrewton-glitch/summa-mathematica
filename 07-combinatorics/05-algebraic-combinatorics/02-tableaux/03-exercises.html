## ヤング図形とロビンソン–シェンステッド対応 {#comb:sec-yt-exercises}

対応するページ：\ref{comb:page-young-tableaux}

::: problem ★ 基本：恒等置換と逆順 {#comb:ex-yt-identity-reverse}
恒等置換 $1\,2\cdots n$ と逆順の置換 $n\,(n-1)\cdots1$ の挿入盤と記録盤を求めよ。
:::

::: solution
恒等置換では、各数がそれまでのどの数より大きいので第 1 行の右端に置かれ、$P=Q$ は 1 行の盤 $1\,2\cdots n$。逆順では、各数がそれまでの第 1 行の唯一の数より小さく、押し出しが列の下端まで続くので、$P$ は 1 列の盤（上から $1,2,\dots,n$）、$Q$ も 1 列の盤（上から $1,\dots,n$）。最長増加部分列は前者で $n$、後者で 1 で、第 1 行の長さと一致する（\ref{comb:schensted-theorem}）。
:::

::: problem ★★ 標準：対合の個数 {#comb:ex-yt-involutions}
\ref{comb:rs-facts} の 1 を認めて、$\mathfrak{S}_{4}$ の対合（$\sigma^{2}=\mathrm{id}$）の個数を $\sum_{\lambda\vdash4}f^{\lambda}$ として計算し、直接の数え上げと比べよ。
:::

::: solution
$f^{\lambda}$ は $1,3,2,3,1$（\ref{comb:prob-yt-f4}）で和は 10。直接には、恒等置換 1 個、互換 $\binom{4}{2}=6$ 個、互いに交わらない互換 2 つの積 3 個で 10 個。
:::

## フック長公式 {#comb:sec-hl-exercises}

対応するページ：\ref{comb:page-hook-length}

::: problem ★ 基本：鉤形 {#comb:ex-hl-hook-shape}
鉤形 $\lambda=(a+1,1^{b})$（第 1 行 $a+1$ 個、その下に 1 個ずつ $b$ 行）について $f^{\lambda}=\binom{a+b}{a}$ を、フック長公式と直接の数え上げの両方で示せ。
:::

::: solution
$n=a+b+1$。箱 $(1,1)$ のフック長は $n$、第 1 行の残りは $a,a-1,\dots,1$、第 1 列の残りは $b,b-1,\dots,1$。$f=\frac{n!}{n\cdot a!\,b!}=\frac{(a+b)!}{a!\,b!}$。直接には、$(1,1)$ は 1 で、残りの $a+b$ 個の数のうち第 1 行に入る $a$ 個を選べば（各行・列で増加するように並べる方法は一意）盤が決まる。
:::

::: problem ★★ 標準：フック長公式と RS 対応 {#comb:ex-hl-rs-count}
フック長公式と \ref{comb:robinson-schensted} を使って、$\mathfrak{S}_{5}$ の置換で挿入盤の形が $(3,2)$ になるものの個数を求めよ。
:::

::: solution
挿入盤と記録盤は形 $(3,2)$ の標準ヤング盤の任意の組なので、$(f^{(3,2)})^{2}=5^{2}=25$ 個（$f^{(3,2)}=5$ は \ref{comb:hook-length-formula} の例）。
:::
