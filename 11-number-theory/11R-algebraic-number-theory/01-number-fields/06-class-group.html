# ミンコフスキーの定理とイデアル類群 {#nt:page-class-group keywords="lattice, covolume, fundamental parallelepiped, Blichfeldt lemma, Minkowski convex body theorem, Minkowski embedding R^{r_1} x C^{r_2}, covolume of O_K is 2^{-r_2} sqrt|d_K|, ideal with small norm, every ideal class contains an ideal of norm at most (2/pi)^{r_2} sqrt|d_K|, finiteness of the class number, class number of Q(sqrt -5) is 2, imaginary quadratic fields of class number one, Minkowski bound, Hermite theorem"}

代数体 $K$ を $\mathbb{R}^{r_{1}}\times\mathbb{C}^{r_{2}}\cong\mathbb{R}^{n}$ に埋め込むと、$\mathcal{O}_{K}$ やイデアルは**格子**になり、その基本領域の体積は $\sqrt{|d_{K}|}$ で測れる。**ミンコフスキーの凸体定理**（体積の大きい対称な凸集合は格子点を含む）を使うと、各イデアル類にノルムが $(2/\pi)^{r_{2}}\sqrt{|d_{K}|}$ 以下の整イデアルがあることが分かり、**イデアル類群は有限**である。この評価で、いくつかの 2 次体の類数を具体的に決める。

> 用語は雪江『整数論』の用語（ミンコフスキーの定理・類数）に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## 記法と定義の確認 {#nt:sec-cg-notation}

::: notation
- イデアル類群 $\operatorname{Cl}(\mathcal{O}_{K})$（分数イデアルの群を単項分数イデアルで割ったもの）と、その幾何的な意味は \ref{ring:class-group}, \ref{ag:cl-dedekind}。類群が自明 $\iff$ PID $\iff$ UFD は \ref{ring:class-group-pid}。
- 判別式・指数・イデアルのノルムは \ref{nt:integral-basis}, \ref{nt:ideal-norm-multiplicative}。$r_{1}$, $r_{2}$ と判別式の符号は \ref{nt:discriminant-sign-stickelberger}。2 次体の分解は \ref{nt:quadratic-splitting}。
- 体積：$\mathbb{R}^{n}$ のルベーグ測度 $\operatorname{vol}$ の、平行移動不変性・可算加法性・線形写像 $T$ による像の体積 $|\det T|\operatorname{vol}$・直方体と円板の体積（\ref[ルベーグ測度]{meas:lebesgue-measure}）を使う。測度論の系列で扱う予定。
- **選択公理**：デデキント環の定理を通して使う。
:::

## 格子と凸体定理 {#nt:sec-cg-minkowski}

::: definition 格子 {#nt:lattice keywords="lattice in R^n: subgroup generated by a basis; fundamental parallelepiped; covolume" index="格子|こうし, 基本領域|きほんりょういき"}
$\mathbb{R}^{n}$ の $\mathbb{R}$ 上の基底 $v_{1},\dots,v_{n}$ で生成される部分群 $\Lambda=\bigoplus\mathbb{Z}v_{i}$ を**格子**という。$P\defeq\{\sum t_{i}v_{i} : 0\le t_{i}<1\}$ を**基本領域**、$\operatorname{covol}(\Lambda)\defeq\operatorname{vol}(P)=|\det(v_{1},\dots,v_{n})|$ を格子の**体積**という。$\mathbb{R}^{n}$ は $P+\lambda$（$\lambda\in\Lambda$）の交わらない和。部分格子 $\Lambda'\subset\Lambda$ については $\operatorname{covol}(\Lambda')=[\Lambda:\Lambda']\operatorname{covol}(\Lambda)$（基底変換の行列式：\ref{nt:integral-basis} の Step 3 と同じ）。
:::

::: lemma ブリックフェルトの補題 {#nt:blichfeldt keywords="a measurable set of volume larger than the covolume contains two distinct points differing by a lattice vector" index="ブリックフェルトの補題|ぶりっくふぇるとのほだい"}
可測集合 $S\subset\mathbb{R}^{n}$ が $\operatorname{vol}(S)>\operatorname{covol}(\Lambda)$ をみたせば、$x\neq y\in S$ で $x-y\in\Lambda$ となるものがある。
:::

::: proof
$S=\bigsqcup_{\lambda}(S\cap(P+\lambda))$ なので、可算加法性と平行移動不変性から $\operatorname{vol}(S)=\sum_{\lambda}\operatorname{vol}((S-\lambda)\cap P)$。$(S-\lambda)\cap P$ がどの二つも交わらないなら、和は $\le\operatorname{vol}(P)$ となり仮定に反する。よって $z\in(S-\lambda)\cap(S-\mu)$（$\lambda\neq\mu$）があり、$x\defeq z+\lambda$, $y\defeq z+\mu\in S$ は $x-y=\lambda-\mu\in\Lambda\setminus0$。
:::

::: theorem ミンコフスキーの凸体定理 {#nt:minkowski-convex-body keywords="a centrally symmetric convex set of volume > 2^n covol contains a nonzero lattice point; >= suffices for compact sets" index="ミンコフスキーの凸体定理|みんこふすきーのとつたいていり"}
$X\subset\mathbb{R}^{n}$ を中心対称（$X=-X$）な凸集合とする。
1. $\operatorname{vol}(X)>2^{n}\operatorname{covol}(\Lambda)$ なら、$X$ は $0$ でない格子点を含む。
2. $X$ がコンパクトなら、$\operatorname{vol}(X)\ge2^{n}\operatorname{covol}(\Lambda)$ で十分。
:::

::: proof
**Step 1（1）.** $S\defeq\tfrac12X$ は $\operatorname{vol}(S)=2^{-n}\operatorname{vol}(X)>\operatorname{covol}(\Lambda)$。\ref{nt:blichfeldt} から $x\neq y\in S$, $x-y\in\Lambda$。$2x,-2y\in X$（対称）で、凸性から $\tfrac12(2x)+\tfrac12(-2y)=x-y\in X$。

**Step 2（2）.** $\varepsilon>0$ について $(1+\varepsilon)X$ は 1 の条件をみたすので、$0$ でない格子点 $\lambda_{\varepsilon}\in(1+\varepsilon)X$ がある。$2X$ は有界なので、その中の格子点は有限個（格子は離散：基本領域の有限個の平行移動で覆える）。よって $\varepsilon\to0$ で同じ $\lambda$ が無限回現れ、$\lambda\in\bigcap_{\varepsilon}(1+\varepsilon)X=X$（$X$ は閉）。
:::

## 代数体の格子 {#nt:sec-cg-embedding}

::: proposition ミンコフスキー埋め込み {#nt:minkowski-embedding keywords="j: K -> R^{r_1} x C^{r_2}; j(O_K) is a lattice of covolume 2^{-r_2} sqrt|d_K|; j(a) has covolume 2^{-r_2} sqrt|d_K| N(a)" index="ミンコフスキー埋め込み|みんこふすきーうめこみ"}
実埋め込み $\rho_{1},\dots,\rho_{r_{1}}$ と、複素埋め込みの組の代表 $\tau_{1},\dots,\tau_{r_{2}}$ をとり、
$$
j:K\to\mathbb{R}^{r_{1}}\times\mathbb{C}^{r_{2}}\cong\mathbb{R}^{n},\qquad x\mapsto(\rho_{1}(x),\dots,\rho_{r_{1}}(x),\tau_{1}(x),\dots,\tau_{r_{2}}(x))
$$
（$\mathbb{C}\cong\mathbb{R}^{2}$, $z\mapsto(\operatorname{Re}z,\operatorname{Im}z)$）とする。$0$ でない整イデアル $\mathfrak{a}$ について、$j(\mathfrak{a})$ は格子で
$$
\operatorname{covol}(j(\mathfrak{a}))=2^{-r_{2}}\sqrt{|d_{K}|}\,N(\mathfrak{a}).
$$
:::

::: proof
**Step 1（$\mathcal{O}_{K}$ の場合）.** 整数環の基底 $\omega_{1},\dots,\omega_{n}$ の像を列とする $n\times n$ 実行列 $A$ を考える。行は $\rho_{i}(\omega_{k})$ と、各 $\tau_{l}$ について $\operatorname{Re}\tau_{l}(\omega_{k})$, $\operatorname{Im}\tau_{l}(\omega_{k})$。一方、すべての埋め込みについての行列 $M=(\sigma(\omega_{k}))$ は、行 $\tau_{l}$, $\bar{\tau}_{l}$ の組を持つ。$\operatorname{Re}z=\tfrac12(z+\bar{z})$, $\operatorname{Im}z=\tfrac{1}{2\sqrt{-1}}(z-\bar{z})$ なので、$A$ の 2 行は $M$ の 2 行に行列 $\tfrac12\begin{pmatrix}1&1\\-\sqrt{-1}&\sqrt{-1}\end{pmatrix}$（行列式 $\tfrac{\sqrt{-1}}{2}$）を掛けたもの。よって $|\det A|=2^{-r_{2}}|\det M|=2^{-r_{2}}\sqrt{|d_{K}|}$（\ref{nt:discriminant-basis-properties} の 1）。$\det A\neq0$ なので $j(\omega_{k})$ は $\mathbb{R}^{n}$ の基底で、$j(\mathcal{O}_{K})$ は格子。

**Step 2（$\mathfrak{a}$ の場合）.** $\mathfrak{a}\subset\mathcal{O}_{K}$ は指数 $N(\mathfrak{a})$ の部分群で（\ref{nt:ideal-norm}）、$j$ は単射な準同型なので $j(\mathfrak{a})$ は $j(\mathcal{O}_{K})$ の指数 $N(\mathfrak{a})$ の部分格子。格子の定義の後半から。
:::

::: theorem 小さいノルムの元 {#nt:small-norm-element keywords="every nonzero ideal a contains a nonzero alpha with |N(alpha)| <= (2/pi)^{r_2} sqrt|d_K| N(a)" index="小さいノルムの元|ちいさいのるむのげん"}
$0$ でない整イデアル $\mathfrak{a}$ は、$0$ でない $\alpha\in\mathfrak{a}$ で
$$
|N_{K/\mathbb{Q}}(\alpha)|\le\Bigl(\frac{2}{\pi}\Bigr)^{r_{2}}\sqrt{|d_{K}|}\,N(\mathfrak{a})
$$
をみたすものを含む。
:::

::: proof
**Step 1（凸体）.** $t>0$ について $X_{t}\defeq\{(x,z) : |x_{i}|\le t\ (i\le r_{1}),\ |z_{l}|^{2}\le t\ (l\le r_{2})\}$ はコンパクトで中心対称な凸集合（区間と円板の積）。体積は $\operatorname{vol}(X_{t})=(2t)^{r_{1}}(\pi t)^{r_{2}}$。

**Step 2（$t$ の選択）.** $\operatorname{vol}(X_{t})\ge2^{n}\operatorname{covol}(j(\mathfrak{a}))=2^{r_{1}+2r_{2}}2^{-r_{2}}\sqrt{|d_{K}|}N(\mathfrak{a})$ は $t^{r_{1}+r_{2}}\ge(2/\pi)^{r_{2}}\sqrt{|d_{K}|}N(\mathfrak{a})$ と同値。この等号が成り立つように $t$ を選ぶ（$r_{1}+r_{2}\ge1$）。

**Step 3（ノルムの評価）.** \ref{nt:minkowski-convex-body} の 2 から $0\neq\alpha\in\mathfrak{a}$ で $j(\alpha)\in X_{t}$。$|N(\alpha)|=\prod_{i}|\rho_{i}(\alpha)|\prod_{l}|\tau_{l}(\alpha)|^{2}$（$\tau_{l}$ と $\bar{\tau}_{l}$ の両方が現れる）$\le t^{r_{1}}t^{r_{2}}$。
:::

## 類群の有限性 {#nt:sec-cg-finiteness}

::: theorem イデアル類群の有限性 {#nt:class-group-finite keywords="every ideal class contains an integral ideal of norm at most C_K = (2/pi)^{r_2} sqrt|d_K|; the class group is finite; class number" index="類数の有限性|るいすうのゆうげんせい, 類数|るいすう"}
（AC）$C_{K}\defeq(2/\pi)^{r_{2}}\sqrt{|d_{K}|}$ とする。
1. 各イデアル類は、$N(\mathfrak{b})\le C_{K}$ をみたす整イデアル $\mathfrak{b}$ を含む。
2. ノルムが与えられた値以下の整イデアルは有限個。したがって $\operatorname{Cl}(\mathcal{O}_{K})$ は有限群で、その位数 $h_{K}$ を**類数**という。
3. $\operatorname{Cl}(\mathcal{O}_{K})$ は、$N(\mathfrak{p})\le C_{K}$ の素イデアル $\mathfrak{p}$ の類で生成される。
:::

::: proof
**Step 1（1）.** 類 $c$ をとり、$c^{-1}$ の整イデアル $\mathfrak{a}$ をとる（分数イデアル $\mathfrak{c}$ について、$0\neq d\in\mathbb{Z}$ で $d\mathfrak{c}\subset\mathcal{O}_{K}$ となるもの：$\mathfrak{c}$ は有限生成で、生成元の分母を払う）。\ref{nt:small-norm-element} の $\alpha\in\mathfrak{a}$ について $\alpha\mathcal{O}_{K}\subset\mathfrak{a}$ なので、含むは割るから $\alpha\mathcal{O}_{K}=\mathfrak{a}\mathfrak{b}$（$\mathfrak{b}$ は整）。$[\mathfrak{b}]=[\mathfrak{a}]^{-1}=c$ で、$N(\mathfrak{b})=|N(\alpha)|/N(\mathfrak{a})\le C_{K}$。

**Step 2（2）.** $N(\mathfrak{b})=m$ なら $m\in\mathfrak{b}$（$\mathcal{O}_{K}/\mathfrak{b}$ の位数 $m$ は元を零化する）。$m\mathcal{O}_{K}$ を含むイデアルは $\mathcal{O}_{K}/m\mathcal{O}_{K}$（有限）のイデアルと一対一なので有限個。$m\le C$ の範囲で有限個。

**Step 3（3）.** 1 の $\mathfrak{b}$ を素イデアルに分解すると、各因子のノルムは $N(\mathfrak{b})\le C_{K}$ 以下（ノルムは乗法的で $\ge1$）。
:::

::: remark より精密な評価とその帰結
凸体として $\{\sum_{i}|x_{i}|+2\sum_{l}|z_{l}|\le t\}$ を使うと、体積の計算（$2^{r_{1}}(\pi/2)^{r_{2}}t^{n}/n!$）と相加相乗平均から、ミンコフスキーの評価
$$
N(\mathfrak{b})\le\frac{n!}{n^{n}}\Bigl(\frac{4}{\pi}\Bigr)^{r_{2}}\sqrt{|d_{K}|}
$$
が得られることが知られている（体積の計算は積分を使うので本サイト未収録）。これから $K\neq\mathbb{Q}$ なら $|d_{K}|>1$（**$\mathbb{Q}$ の不分岐拡大はない**、ミンコフスキー）、さらに判別式が有界な代数体は有限個しかない（エルミート）ことが従う。
:::

## 類数の計算 {#nt:sec-cg-examples}

::: example 虚 2 次体の類数 {#nt:class-number-examples keywords="class numbers of Q(i), Q(sqrt -3), Q(sqrt -5), Q(sqrt -19), Q(sqrt 2)" index="類数の計算|るいすうのけいさん"}
（AC）$C_{K}$ の値と \ref{nt:class-group-finite} の 3 による。
1. $\mathbb{Q}(i)$：$d=-4$, $r_{2}=1$, $C=\tfrac{2}{\pi}\cdot2\approx1.27$。ノルム 1 の整イデアルは $\mathcal{O}_{K}$ だけなので $h=1$。
2. $\mathbb{Q}(\sqrt{-3})$：$C=\tfrac{2}{\pi}\sqrt{3}\approx1.10$、$h=1$。
3. $\mathbb{Q}(\sqrt{2})$：$r_{2}=0$, $d=8$, $C=\sqrt{8}\approx2.83$。ノルム 2 の素イデアルは $2$ の上の $\mathfrak{p}=(\sqrt{2})$（$2=(\sqrt{2})^{2}$）で単項。$h=1$。
4. $\mathbb{Q}(\sqrt{-5})$：$d=-20$, $C=\tfrac{2}{\pi}\sqrt{20}\approx2.85$。ノルム 2 の素イデアルは $\mathfrak{p}_{2}=(2,1+\sqrt{-5})$（$2=\mathfrak{p}_{2}^{2}$）だけで、単項でない（\ref{nt:prob-pd-sqrt-minus-five}）。$\mathfrak{p}_{2}^{2}=(2)$ は単項なので $\operatorname{Cl}\cong\mathbb{Z}/2$、$h=2$。これが $6=2\cdot3=(1+\sqrt{-5})(1-\sqrt{-5})$（\ref{ring:non-ufd-example}）の背後にある：$(2)=\mathfrak{p}_{2}^{2}$, $(3)=\mathfrak{p}_{3}\mathfrak{p}_{3}'$, $(1\pm\sqrt{-5})=\mathfrak{p}_{2}\mathfrak{p}_{3}^{(\prime)}$ で、イデアルとしては一意に分解している。
5. $\mathbb{Q}(\sqrt{-19})$：$d=-19$, $C=\tfrac{2}{\pi}\sqrt{19}\approx2.78$。$-19\equiv5\pmod8$ なので $2$ は惰性的で、ノルム 2 の素イデアルはない。$h=1$、$\mathcal{O}_{K}=\mathbb{Z}[\tfrac{1+\sqrt{-19}}{2}]$ は PID（\ref{ring:pid-not-euclidean-fact} と一致。この環はユークリッド環でない：\ref{ring:pid-not-euclidean}）。
:::

::: remark ガウスの類数問題
類数 1 の虚 2 次体は $d_{K}=-3,-4,-7,-8,-11,-19,-43,-67,-163$ の 9 個に限ることが知られている（ガウスが予想し、ヒーグナー・ベイカー・スタークが 1950〜60 年代に証明）。一方、類数 1 の実 2 次体が無限にあるかどうかは未解決である（ガウスの予想）。実 2 次体では単数群が無限で（\ref{nt:page-units}）、類数と単数の大きさ（単数基準）が類数公式で結びついていることが知られている。
:::

::: hypcheck
- **中心対称性と凸性**：\ref{nt:minkowski-convex-body} の Step 1 で、$2x,-2y\in X$ の中点が $X$ に入ることに使う。どちらかを外すと反例がある（原点を含まない大きな凸集合、細長い非凸の十字形など）。
- **コンパクト性**：\ref{nt:minkowski-convex-body} の 2 で極限の点が $X$ に入ることに使う。\ref{nt:small-norm-element} では $\le$ の評価のために 2 を使う。
- **デデキント性**：「含むは割る」と分数イデアルの可逆性（\ref{nt:class-group-finite} の Step 1）に使う。
- **選択公理**：デデキント環の定理を通して使う。ルベーグ測度の構成と性質は測度論の系列で扱う予定（記法の確認）。
:::

::: supplement
**前提を弱めると.** 凸体定理は「体積 $>2^{n}\operatorname{covol}$」を「中心対称な凸集合の逐次最小」の理論（ミンコフスキーの第 2 定理）に精密化できる。類群の有限性は、関数体 $\mathbb{F}_{q}(t)$ の有限次拡大でも（無限素点の扱いを変えて）成り立つが、$\mathbb{C}(t)$ 上の曲線ではピカール群の次数 0 部分（ヤコビ多様体の点）は一般に無限群である（\ref{ag:degree-principal}）。有限体上であることが有限性に効いている。

**似た定理.** 2 次形式の簡約理論（ガウス）は、虚 2 次体の類群を判別式 $d$ の正定値 2 元 2 次形式の同値類として計算する方法で、類数を有限個の簡約形式の数え上げで求められる。

**計算の観点.** 類群の計算は、$C_{K}$（あるいはミンコフスキーの評価）以下の素イデアルを列挙し、それらの間の関係（単項イデアル $(\alpha)$ の分解）を集めて整数行列のスミス標準形を求める、という手順になる（\ref{mod:smith-normal-form}）。一般化リーマン予想のもとではバッハの評価 $12\log^{2}|d_{K}|$ で十分であることが知られている。
:::

## 高い視点 {#nt:sec-cg-viewpoint}

::: remark 幾何学的な有限性
$\operatorname{Cl}(\mathcal{O}_{K})$ は $\operatorname{Spec}\mathcal{O}_{K}$ のピカール群（\ref{ag:cl-dedekind}）で、その有限性は「算術的な曲線」に無限素点（実・複素埋め込み）を加えて「コンパクト化」したことの帰結と見ることができる：格子 $j(\mathcal{O}_{K})$ の体積が有限であることが、関数体の場合の「射影曲線の次数 0 の因子類が有限個（有限体上）」に対応する。アラケロフ幾何はこの見方を体系化し、$\log|d_{K}|$ を「種数」の類似として扱う。比喩で言えば、ミンコフスキーの定理は「十分大きな対称な網を投げれば、必ず格子点（代数的整数）が引っかかる」ことで、その網の大きさが判別式で測られる。
:::

## 問題 {#nt:sec-cg-problems}

::: problem {#nt:prob-cg-sqrt-ten}
$K=\mathbb{Q}(\sqrt{10})$ の類数が $2$ であることを示せ。（$\mathcal{O}_{K}=\mathbb{Z}[\sqrt{10}]$, $d_{K}=40$。）
:::

::: solution
$C_{K}=\sqrt{40}\approx6.32$。ノルム $\le6$ の素イデアルは $2,3,5$ の上にある。$2$, $5$ は分岐：$\mathfrak{p}_{2}^{2}=(2)$, $\mathfrak{p}_{5}^{2}=(5)$。$(\tfrac{10}{3})=(\tfrac{1}{3})=1$ なので $3=\mathfrak{p}_{3}\mathfrak{p}_{3}'$。$N(a+b\sqrt{10})=a^{2}-10b^{2}\equiv a^{2}\pmod5$ は $\pm2,\pm3$ にならない（$\bmod5$ の平方は $0,1,4$）ので、$\mathfrak{p}_{2}$, $\mathfrak{p}_{3}$, $\mathfrak{p}_{3}'$ は単項でない。$N(2+\sqrt{10})=-6$ で $(2+\sqrt{10})\subset\mathfrak{p}_{2}$, $\subset\mathfrak{p}_{3}$ か $\mathfrak{p}_{3}'$（ノルム 6 なので素因子は $2$, $3$ の上に一つずつ）から $[\mathfrak{p}_{3}^{(\prime)}]=[\mathfrak{p}_{2}]^{-1}$。$(\sqrt{10})^{2}=(10)=\mathfrak{p}_{2}^{2}\mathfrak{p}_{5}^{2}$ から $(\sqrt{10})=\mathfrak{p}_{2}\mathfrak{p}_{5}$, $[\mathfrak{p}_{5}]=[\mathfrak{p}_{2}]^{-1}$。$[\mathfrak{p}_{2}]^{2}=1$、$[\mathfrak{p}_{3}][\mathfrak{p}_{3}']=1$。よって類群は位数 2 の元 $[\mathfrak{p}_{2}]$ で生成され、$h=2$。
:::

::: problem {#nt:prob-cg-minus-seven}
$\mathbb{Q}(\sqrt{-7})$ の類数が $1$ であることを示せ。
:::

::: solution
$-7\equiv1\pmod4$ なので $d_{K}=-7$、$C_{K}=\tfrac{2}{\pi}\sqrt{7}\approx1.68<2$。ノルム 1 の整イデアルは $\mathcal{O}_{K}$ だけなので、すべての類は自明、$h=1$。
:::
