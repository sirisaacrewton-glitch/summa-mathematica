# 分解群と惰性群 {#nt:page-decomposition-inertia keywords="Galois number field, Galois group acts transitively on primes above p, e f g = n, decomposition group, inertia group, surjection onto Galois group of residue field, Frobenius element, Frobenius conjugacy class, Artin symbol, cyclotomic field splitting p mod n, decomposition field, inertia field, Chebotarev density theorem"}

$K/\mathbb{Q}$ がガロア拡大なら、ガロア群 $G$ は素数 $p$ の上の素イデアル全体に**推移的**に作用し、そのため分岐指数と相対次数はすべて等しく $efg=n$ となる。素イデアル $\mathfrak{P}$ を固定する部分群（**分解群**）$D_{\mathfrak{P}}$ は剰余体のガロア群に全射し、その核が**惰性群** $I_{\mathfrak{P}}$（位数 $e$）である。不分岐なら、剰余体のフロベニウス写像の持ち上げとして**フロベニウス元**が定まる。円分体では、フロベニウス元は $\zeta\mapsto\zeta^{p}$ で、$p$ の分解は $p\bmod n$ の位数で決まる。

> 用語は雪江『整数論 1・2』の用語（分解群・惰性群・フロベニウス置換）に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## 記法と定義の確認 {#nt:sec-di-notation}

::: notation
- 素イデアルの分解・分岐指数・相対次数・基本等式・クンマー–デデキントの定理は \ref{nt:fundamental-identity}, \ref{nt:splitting-types}, \ref{nt:kummer-dedekind}, \ref{nt:finitely-many-ramified}。
- ガロアの基本定理は \tref{fld:fundamental-theorem}。有限体の自己同型群はフロベニウス写像 $a\mapsto a^{p}$ で生成される巡回群（\ref{fld:finite-field-automorphisms}）、有限体の乗法群は巡回群（\ref{fld:finite-field-properties.1}）。円分体のガロア群は \ref{fld:cyclotomic-galois}。中国剰余定理は \tref{ring:chinese-remainder}。
- この頁では $K/\mathbb{Q}$ を $n$ 次のガロア拡大、$G=\operatorname{Gal}(K/\mathbb{Q})$ とする。$\sigma\in G$ は $\mathcal{O}_{K}$ を $\mathcal{O}_{K}$ に写す（整な元の像は整）ので、素イデアル $\mathfrak{P}\mid p$ を素イデアル $\sigma\mathfrak{P}\mid p$ に写す（$\sigma\mathfrak{P}\cap\mathbb{Z}=\sigma(\mathfrak{P}\cap\mathbb{Z})=p\mathbb{Z}$）。$\kappa(\mathfrak{P})\defeq\mathcal{O}_{K}/\mathfrak{P}$。
- **選択公理**：デデキント環の定理（\ref{nt:fundamental-identity}）を通して使う。
:::

## 推移性と $efg=n$ {#nt:sec-di-transitive}

::: theorem ガロア群の推移的な作用 {#nt:galois-transitive keywords="Gal(K/Q) acts transitively on the primes above p; all e_i equal, all f_i equal, efg = n" index="ガロア群の推移性|がろあぐんのすいいせい"}
（AC）$p$ の上の素イデアル $\mathfrak{P},\mathfrak{P}'$ について、$\sigma\mathfrak{P}=\mathfrak{P}'$ となる $\sigma\in G$ がある。したがって $p\mathcal{O}_{K}=(\mathfrak{P}_{1}\cdots\mathfrak{P}_{g})^{e}$ で、すべての $f(\mathfrak{P}_{i})$ は等しく（$f$ と書く）、$efg=n$。
:::

::: proof
**Step 1（背理法の設定）.** $\mathfrak{P}'\neq\sigma\mathfrak{P}$ がすべての $\sigma$ で成り立つとする。$\{\sigma\mathfrak{P}\}_{\sigma\in G}$ と $\mathfrak{P}'$ は相異なる極大イデアルの有限族なので、中国剰余定理から $x\in\mathcal{O}_{K}$ で $x\equiv0\pmod{\mathfrak{P}'}$、すべての $\sigma$ で $x\equiv1\pmod{\sigma\mathfrak{P}}$ となるものがある。

**Step 2（ノルムで矛盾）.** $N(x)=\prod_{\sigma\in G}\sigma(x)$ は $\mathbb{Z}$ の元で（\ref{nt:integers-basic.3}）、因子 $x$（$\sigma=1$）が $\mathfrak{P}'$ に入るので $N(x)\in\mathfrak{P}'\cap\mathbb{Z}=p\mathbb{Z}\subset\mathfrak{P}$。$\mathfrak{P}$ は素なので、ある $\sigma(x)\in\mathfrak{P}$、すなわち $x\in\sigma^{-1}\mathfrak{P}$。これは $x\equiv1\pmod{\sigma^{-1}\mathfrak{P}}$ に反する。

**Step 3（$e$, $f$ の一致）.** $\sigma$ は $\mathcal{O}_{K}$ の自己同型で $p\mathcal{O}_{K}$ を保つので、$p\mathcal{O}_{K}=\prod\mathfrak{P}_{i}^{e_{i}}$ に $\sigma$ を施すと $p\mathcal{O}_{K}=\prod(\sigma\mathfrak{P}_{i})^{e_{i}}$。分解の一意性から $e(\sigma\mathfrak{P})=e(\mathfrak{P})$。$\sigma$ は環の同型 $\mathcal{O}_{K}/\mathfrak{P}\cong\mathcal{O}_{K}/\sigma\mathfrak{P}$ を誘導するので $f$ も等しい。推移性からすべて等しく、\ref{nt:fundamental-identity} から $efg=n$。
:::

## 分解群と惰性群 {#nt:sec-di-groups}

::: definition 分解群と惰性群 {#nt:decomposition-inertia-def keywords="decomposition group D_P = stabilizer of P; inertia group I_P = kernel of D_P -> Gal(k(P)/F_p)" index="分解群|ぶんかいぐん, 惰性群|だせいぐん"}
$\mathfrak{P}\mid p$ について、$D_{\mathfrak{P}}\defeq\{\sigma\in G : \sigma\mathfrak{P}=\mathfrak{P}\}$ を**分解群**という。$\sigma\in D_{\mathfrak{P}}$ は $\kappa(\mathfrak{P})$ の自己同型 $\bar{\sigma}(\bar{x})\defeq\overline{\sigma(x)}$ を誘導し、準同型 $D_{\mathfrak{P}}\to\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{p})$ を得る。その核 $I_{\mathfrak{P}}\defeq\{\sigma\in D_{\mathfrak{P}} : \sigma(x)\equiv x\pmod{\mathfrak{P}}\ (x\in\mathcal{O}_{K})\}$ を**惰性群**という。
:::

::: theorem 分解群と惰性群の基本性質 {#nt:decomposition-inertia keywords="|D_P| = ef, [G : D_P] = g, D_P -> Gal(k(P)/F_p) is surjective, |I_P| = e, D_{sigma P} = sigma D_P sigma^{-1}" index="分解群の性質|ぶんかいぐんのせいしつ"}
（AC）
1. $[G:D_{\mathfrak{P}}]=g$、$|D_{\mathfrak{P}}|=ef$。$D_{\sigma\mathfrak{P}}=\sigma D_{\mathfrak{P}}\sigma^{-1}$, $I_{\sigma\mathfrak{P}}=\sigma I_{\mathfrak{P}}\sigma^{-1}$。
2. $D_{\mathfrak{P}}\to\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{p})$ は全射。
3. $|I_{\mathfrak{P}}|=e$。とくに $p$ が不分岐 $\iff I_{\mathfrak{P}}=1$。
:::

::: proof
**Step 1（1）.** \ref{nt:galois-transitive} から $G$ は $g$ 個の素イデアルに推移的に作用し、$D_{\mathfrak{P}}$ は固定部分群なので $[G:D_{\mathfrak{P}}]=g$（軌道と固定部分群の関係）、$|D_{\mathfrak{P}}|=n/g=ef$。共役の式は $\tau\sigma\mathfrak{P}=\sigma\mathfrak{P}\iff\sigma^{-1}\tau\sigma\in D_{\mathfrak{P}}$ と、惰性群の定義に $\sigma$ を施すことから。

**Step 2（2：よい代表元）.** $\kappa(\mathfrak{P})^{\times}$ の生成元 $\bar{a}$ をとる（\ref{fld:finite-field-properties.1}）。$\kappa(\mathfrak{P})=\mathbb{F}_{p}(\bar{a})$。中国剰余定理で $a\in\mathcal{O}_{K}$ を、$a\equiv\bar{a}\pmod{\mathfrak{P}}$、すべての $\tau\notin D_{\mathfrak{P}}$ について $a\in\tau\mathfrak{P}$（$\tau\mathfrak{P}\neq\mathfrak{P}$）となるようにとる。

**Step 3（2：多項式の根）.** $h(x)\defeq\prod_{\sigma\in G}(x-\sigma(a))$ の係数は $G$ で不変な $\mathcal{O}_{K}$ の元なので $\mathbb{Z}$ に入る（\ref{fld:fundamental-theorem}、\ref{nt:integers-basic.1}）。$\bar{h}\in\mathbb{F}_{p}[x]$ は $\bar{a}$ を根にもつので、$\rho\in\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{p})$ について $\rho(\bar{a})$ も $\bar{h}$ の根で、$\bar{h}=\prod(x-\overline{\sigma(a)})$ から $\rho(\bar{a})=\overline{\sigma(a)}$ となる $\sigma$ がある。$\sigma\notin D_{\mathfrak{P}}$ なら $\sigma^{-1}\notin D_{\mathfrak{P}}$ で $a\in\sigma^{-1}\mathfrak{P}$、$\sigma(a)\in\mathfrak{P}$、$\overline{\sigma(a)}=0$ だが、$\rho(\bar{a})\neq0$（$\bar{a}\neq0$）。よって $\sigma\in D_{\mathfrak{P}}$ で $\bar{\sigma}(\bar{a})=\rho(\bar{a})$、$\bar{a}$ は $\kappa(\mathfrak{P})$ を生成するので $\bar{\sigma}=\rho$。

**Step 4（3）.** $\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{p})$ の位数は $f$（\ref{fld:finite-field-automorphisms}）。2 から $|I_{\mathfrak{P}}|=|D_{\mathfrak{P}}|/f=e$。
:::

::: definition フロベニウス元 {#nt:frobenius-element keywords="Frobenius element Frob_P for unramified P: sigma(x) = x^p mod P; Frobenius conjugacy class; Artin symbol for abelian extensions" index="フロベニウス元|ふろべにうすげん, フロベニウス置換|ふろべにうすちかん, アルティン記号|あるてぃんきごう"}
（AC）$p$ が $K$ で不分岐なら、\ref{nt:decomposition-inertia} から $D_{\mathfrak{P}}\cong\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{p})$ で、フロベニウス写像 $\bar{x}\mapsto\bar{x}^{p}$ に対応する元を $\operatorname{Frob}_{\mathfrak{P}}\in D_{\mathfrak{P}}$（**フロベニウス元**）と書く。すなわち $\operatorname{Frob}_{\mathfrak{P}}$ は
$$
\sigma(x)\equiv x^{p}\pmod{\mathfrak{P}}\qquad(x\in\mathcal{O}_{K})
$$
をみたすただ一つの $\sigma\in G$ である（$\sigma\mathfrak{P}=\mathfrak{P}$ も従う：$x\in\mathfrak{P}$ なら $\sigma(x)\in\mathfrak{P}$）。$\operatorname{Frob}_{\sigma\mathfrak{P}}=\sigma\operatorname{Frob}_{\mathfrak{P}}\sigma^{-1}$ なので、$p$ の上の $\mathfrak{P}$ を動かすと共役類 $\operatorname{Frob}_{p}$ が定まる。$G$ が可換なら $\operatorname{Frob}_{p}$ は元で、**アルティン記号**ともいう。$\operatorname{Frob}_{\mathfrak{P}}$ の位数は $f$。
:::

::: proof
一意性：$\sigma,\sigma'$ がともに条件をみたせば $\sigma\mathfrak{P}=\sigma'\mathfrak{P}=\mathfrak{P}$ で、$\bar{\sigma}=\bar{\sigma}'$、$I_{\mathfrak{P}}=1$ から $\sigma=\sigma'$。共役の式：$\tau\in G$ について $\tau\operatorname{Frob}_{\mathfrak{P}}\tau^{-1}(x)=\tau(\operatorname{Frob}_{\mathfrak{P}}(\tau^{-1}x))\equiv\tau((\tau^{-1}x)^{p})=x^{p}\pmod{\tau\mathfrak{P}}$。位数は $\operatorname{Gal}(\kappa/\mathbb{F}_{p})$ の生成元の位数 $f$。
:::

## 円分体 {#nt:sec-di-cyclotomic}

::: theorem 円分体での素数の分解 {#nt:cyclotomic-splitting keywords="for p not dividing n, p is unramified in Q(zeta_n), Frob_p is zeta -> zeta^p, f is the order of p mod n, p splits completely iff p = 1 mod n" index="円分体での素数の分解|えんぶんたいでのそすうのぶんかい"}
（AC）$K=\mathbb{Q}(\zeta_{n})$、$p\nmid n$ とする。
1. $p$ は $K$ で不分岐。
2. $\operatorname{Frob}_{p}=\sigma_{p}$（$\zeta_{n}\mapsto\zeta_{n}^{p}$）。
3. $f$ は $p$ の $(\mathbb{Z}/n)^{\times}$ での位数、$g=\varphi(n)/f$。とくに $p$ が完全分解 $\iff p\equiv1\pmod n$。
:::

::: proof
**Step 1（1）.** $\bar{\Phi}_{n}$ は $x^{n}-1$ を割り切り、$x^{n}-1$ は $\mathbb{F}_{p}$ 上分離的（微分 $nx^{n-1}$ と共通根をもたない：$p\nmid n$ で根 $\neq0$）なので $\bar{\Phi}_{n}$ も分離的、$\overline{D(\Phi_{n})}\neq0$（\ref{fld:discriminant-properties.2}）。\ref{nt:finitely-many-ramified} から不分岐で、その証明から $p$ は指数 $[\mathcal{O}_{K}:\mathbb{Z}[\zeta]]$ を割り切らない。

**Step 2（2）.** $\sigma_{p}$ について、$y=\sum a_{i}\zeta^{i}\in\mathbb{Z}[\zeta]$ なら $\sigma_{p}(y)=\sum a_{i}\zeta^{ip}\equiv(\sum a_{i}\zeta^{i})^{p}\pmod{p}$（標数 $p$ の 2 項定理と $a_{i}^{p}\equiv a_{i}$：フェルマー）。$x\in\mathcal{O}_{K}$ は、\ref{nt:kummer-dedekind} の Step 1 から $x\equiv y\pmod{p\mathcal{O}_{K}}$（$y\in\mathbb{Z}[\zeta]$）と書け、$\sigma_{p}(p\mathcal{O}_{K})=p\mathcal{O}_{K}$ なので $\sigma_{p}(x)\equiv\sigma_{p}(y)\equiv y^{p}\equiv x^{p}\pmod{p\mathcal{O}_{K}}$、とくに $\bmod\mathfrak{P}$。\ref{nt:frobenius-element} の一意性から $\sigma_{p}=\operatorname{Frob}_{\mathfrak{P}}$（$G$ は可換なので $\mathfrak{P}$ によらない）。

**Step 3（3）.** \ref{fld:cyclotomic-galois} の同型で $\sigma_{p}\leftrightarrow p\bmod n$ なので、$f=\operatorname{ord}(\operatorname{Frob}_{p})$ は $p$ の位数。$e=1$ と $efg=\varphi(n)$ から $g=\varphi(n)/f$。$f=1\iff p\equiv1$。
:::

::: example 2 次体とガウス整数
2 次体 $K$（$G=\{1,\sigma\}$）では、$p$ が完全分解なら $D_{\mathfrak{P}}=1$、惰性的なら $D_{\mathfrak{P}}=G$, $I_{\mathfrak{P}}=1$, $\operatorname{Frob}_{p}=\sigma$、分岐なら $D_{\mathfrak{P}}=I_{\mathfrak{P}}=G$。$K=\mathbb{Q}(i)=\mathbb{Q}(\zeta_{4})$ では \ref{nt:cyclotomic-splitting} から、奇素数 $p$ について $f=1\iff p\equiv1\pmod4$ で、\ref{nt:gaussian-decomposition} の結果が再現される。
:::

::: remark 分解体・惰性体とチェボタレフの密度定理
1. ガロアの基本定理で $D_{\mathfrak{P}}$, $I_{\mathfrak{P}}$ に対応する中間体 $K^{D}\subset K^{I}$ を**分解体**・**惰性体**という。$\mathfrak{P}$ の下にある素イデアルは、$K^{D}$ で相対次数・分岐指数がともに 1、$K^{I}/K^{D}$ で惰性的（相対次数 $f$）、$K/K^{I}$ で完全分岐（分岐指数 $e$）となることが知られている（相対拡大での分解の理論が要るので本サイト未収録）。
2. **チェボタレフの密度定理**：$G$ の共役類 $C$ について、$\operatorname{Frob}_{p}=C$ となる素数 $p$ の集合の（ディリクレ）密度は $|C|/|G|$ であることが知られている（本サイト未収録）。$K=\mathbb{Q}(\zeta_{n})$ では、これは算術級数の素数定理（ディリクレの定理）にあたる。
3. 可換拡大のアルティン記号 $p\mapsto\operatorname{Frob}_{p}$ を、素イデアルの群から $G$ への準同型に延ばしたものの核を記述するのが**類体論**（アルティンの相互法則）で、平方剰余の相互法則（\ref{nt:page-quadratic-cyclotomic}）はその最初の例である。
:::

::: hypcheck
- **ガロア性**：\ref{nt:galois-transitive} で $N(x)=\prod_{\sigma}\sigma(x)$ を $G$ の積として書くこと、\ref{nt:decomposition-inertia} の Step 3 で $h$ の係数が $\mathbb{Z}$ に入ることに使う。ガロアでない体（$\mathbb{Q}(\sqrt[3]{2})$）では $e_{i}$, $f_{i}$ は揃わない：$5=\mathfrak{P}_{1}\mathfrak{P}_{2}$, $f_{1}=1\neq f_{2}=2$（\ref{nt:cube-root-two-decomposition}）。
- **剰余体が有限であること**：\ref{nt:decomposition-inertia} の Step 2 で乗法群の生成元をとり、剰余体のガロア群がフロベニウスで生成される巡回群であることに使う（剰余体が完全体なら、原始元で同様の議論が通る）。
- **不分岐性**：フロベニウス元の一意性（$I_{\mathfrak{P}}=1$）に使う。分岐する素数では、フロベニウス元は $I_{\mathfrak{P}}$ の剰余類としてしか定まらない。
- **$p\nmid n$**：\ref{nt:cyclotomic-splitting} の Step 1 で $x^{n}-1$ の分離性に使う。
- **選択公理**：デデキント環の定理を通して使う。
:::

::: supplement
**前提を変えると.** デデキント環 $A$ 上のガロア拡大 $L/F$ でも、推移性・$efg=[L:F]$・$|I|=e$ は、剰余体の拡大が分離的なら同じ証明で成り立つ（\ref{nt:decomposition-inertia.2} は剰余体が完全なら原始元で示せる）。

**似た定理.** リーマン面のガロア被覆 $Y\to X$ では、点 $y$ の固定部分群が「惰性群」で、その位数が分岐指数、剰余体は $\mathbb{C}$ なので分解群と惰性群は一致する。有限体上の曲線では、フロベニウス元は「点を $q$ 乗写像で動かすこと」に対応し、ヴェイユ予想の理論の出発点である。

**計算の観点.** \ref{nt:cyclotomic-splitting} から、$\mathbb{Q}(\zeta_{n})$ での $p$ の分解は $p\bmod n$ の位数を計算するだけで分かる。一般のガロア拡大でフロベニウス元を求めるには、$\bmod p$ での最小多項式の分解型（既約因子の次数の多重集合）が $\operatorname{Frob}_{p}$ の巡回型と一致すること（$p\nmid$ 指数のとき）を使う。
:::

## 高い視点 {#nt:sec-di-viewpoint}

::: remark フロベニウスは「素数のまわりのループ」
$\operatorname{Spec}\mathcal{O}_{K}\to\operatorname{Spec}\mathbb{Z}$ は、不分岐な素数の上ではガロア群 $G$ を変換群とする「被覆」で、$p$ の上の点の集合は $G/D_{\mathfrak{P}}$ と同一視できる（\ref{nt:galois-transitive}）。位相幾何の被覆では、基点のまわりのループがファイバーに作用して**モノドロミー**を与える。$\operatorname{Spec}\mathbb{F}_{p}$ の「基本群」は $\operatorname{Gal}(\bar{\mathbb{F}}_{p}/\mathbb{F}_{p})\cong\hat{\mathbb{Z}}$ でフロベニウスが生成するので、フロベニウス元は「点 $p$ の周りを一周するループ」の像であり、$\operatorname{Frob}_{p}$ がこのモノドロミーにあたる。これはエタール基本群（\ref{cat:page-etale-site}）の言葉で正確になる。比喩で言えば、$G$ は被覆の対称性の全体で、各素数 $p$ はその対称性の中から一つの元（の共役類）を「指名」し、その元の巡回型が $p$ の分解の仕方を決めている。
:::

## 問題 {#nt:sec-di-problems}

::: problem {#nt:prob-di-zeta-five}
$K=\mathbb{Q}(\zeta_{5})$ で、素数 $p\neq5$ について $p$ の分解の型（$f$ と $g$）を $p\bmod5$ で分類せよ。また $5$ の分解を求めよ。
:::

::: solution
$\varphi(5)=4$。\ref{nt:cyclotomic-splitting} から $f$ は $p$ の $(\mathbb{Z}/5)^{\times}$ での位数：$p\equiv1$ なら $f=1,g=4$（完全分解）、$p\equiv4\equiv-1$ なら $f=2,g=2$、$p\equiv2,3$ なら $f=4,g=1$（惰性的）。$5$ は \ref{nt:prob-pd-cyclotomic-p} から $5\mathcal{O}_{K}=(1-\zeta_{5})^{4}$（完全分岐、$e=4$, $D=I=G$）。
:::

::: problem {#nt:prob-di-cube-root-galois}
$L=\mathbb{Q}(\sqrt[3]{2},\zeta_{3})$（$G\cong S_{3}$）で、$p=5$ の上の素イデアル $\mathfrak{P}$ の分解群の位数と $g$ を求めよ。（$5$ は $L$ で不分岐であることを使ってよい。）
:::

::: solution
$L\supset K=\mathbb{Q}(\sqrt[3]{2})$ で $5\mathcal{O}_{K}=\mathfrak{p}_{1}\mathfrak{p}_{2}$, $f(\mathfrak{p}_{2})=2$（\ref{nt:cube-root-two-decomposition}）。$L$ の素イデアル $\mathfrak{P}\mid\mathfrak{p}_{2}$ の剰余体は $\mathcal{O}_{K}/\mathfrak{p}_{2}\cong\mathbb{F}_{25}$ を含むので $f\ge2$ で、$f$ は $L$ での相対次数（すべて等しい）。また $5\equiv2\pmod3$ は $\mathbb{Q}(\zeta_{3})$ で惰性的で、$f$ は 2 の倍数。$e=1$, $f\mid|G|=6$ で、不分岐なので $D_{\mathfrak{P}}\cong\operatorname{Gal}(\kappa(\mathfrak{P})/\mathbb{F}_{5})$ は位数 $f$ の巡回群（\ref{nt:decomposition-inertia}）。$f=6$ なら $D=G\cong S_{3}$ が巡回群になり矛盾。よって $f=2$、$|D_{\mathfrak{P}}|=2$、$g=6/2=3$。
:::
