# $p$ 進数と完備化 {#nt:page-p-adic keywords="p-adic integers Z_p, p-adic numbers Q_p, p-adic valuation and absolute value, Z_p is a complete DVR, ultrametric inequality, Hensel's lemma, roots of unity in Z_p, squares in Z_p, product formula, completion of O_K at a prime, O_K tensor Z_p = product of completions, K tensor Q_p = product of local fields, local degree e f, factorization of the minimal polynomial over Q_p, Ostrowski, Hasse principle"}

$p$ 進整数環 $\mathbb{Z}_{p}=\varprojlim\mathbb{Z}/p^{n}$ は完備な離散付値環で、その商体が $p$ 進数体 $\mathbb{Q}_{p}$ である。$\mathbb{Z}_{p}$ では「$\bmod p$ で単根をもつ方程式は解をもつ」（**ヘンゼルの補題**）。代数体 $K$ について、$\mathcal{O}_{K}\otimes\mathbb{Z}_{p}$ は $p$ の上の素イデアル $\mathfrak{P}$ ごとの完備化 $\hat{\mathcal{O}}_{\mathfrak{P}}$ の積に分解し、$K\otimes\mathbb{Q}_{p}\cong\prod_{\mathfrak{P}\mid p}K_{\mathfrak{P}}$、$[K_{\mathfrak{P}}:\mathbb{Q}_{p}]=e_{\mathfrak{P}}f_{\mathfrak{P}}$ となる。とくに $p$ の分解は、最小多項式の $\mathbb{Q}_{p}$ 上の因数分解と一対一に対応する。

> 用語は雪江『整数論 1』（$p$ 進数の章）・『整数論 2』（分岐と完備化の章）の用語に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## $p$ 進整数と $p$ 進数 {#nt:sec-pa-padic}

::: proposition $p$ 進整数環 {#nt:p-adic-integers keywords="Z_p is a DVR with uniformizer p; units are the elements not divisible by p; Z is dense; Q_p = Z_p[1/p] = Frac Z_p" index="p 進整数|ぴーしんせいすう, p 進数|ぴーしんすう"}
$\mathbb{Z}_{p}\defeq\varprojlim\mathbb{Z}/p^{n}$ とし、$\pi_{n}:\mathbb{Z}_{p}\to\mathbb{Z}/p^{n}$ を射影とする。
1. $x\in\mathbb{Z}_{p}$ が単元 $\iff\pi_{1}(x)\neq0$。
2. $\ker\pi_{n}=p^{n}\mathbb{Z}_{p}$。$0\neq x\in\mathbb{Z}_{p}$ はただ一通りに $x=p^{m}u$（$u$ 単元、$m\ge0$）と書ける。
3. $\mathbb{Z}_{p}$ は一意化元 $p$ の離散付値環で、$v(x)\defeq m$（2 の $m$）が付値。$\mathbb{Z}\to\mathbb{Z}_{p}$ は単射で、$v|_{\mathbb{Z}}=v_{p}$。
4. $\mathbb{Q}_{p}\defeq\operatorname{Frac}\mathbb{Z}_{p}=\mathbb{Z}_{p}[1/p]$ を **$p$ 進数体**という。$|x|_{p}\defeq p^{-v(x)}$（$|0|_{p}=0$）は $|x+y|_{p}\le\max(|x|_{p},|y|_{p})$（**超距離不等式**）と $|xy|_{p}=|x|_{p}|y|_{p}$ をみたし、$\mathbb{Q}_{p}$ はこの距離で完備で、$\mathbb{Q}$ は稠密。
:::

::: proof
**Step 1（1）.** $\pi_{1}(x)\neq0$ なら、各 $n$ で $x_{n}\defeq\pi_{n}(x)$ は $p$ と互いに素な整数の類なので $\mathbb{Z}/p^{n}$ で可逆、逆元は逆系と両立する（逆元の一意性）ので $\mathbb{Z}_{p}$ の逆元を与える。逆に $\pi_{1}(x)=0$ なら $\pi_{1}(xy)=0\neq1$。

**Step 2（2：核）.** $p^{n}\mathbb{Z}_{p}\subset\ker\pi_{n}$ は明らか。$x\in\ker\pi_{n}$ なら、各 $k$ で $x_{n+k}\in p^{n}\mathbb{Z}/p^{n+k}$ なので $x_{n+k}=p^{n}y_{k}$ と書け、$y_{k}\bmod p^{k}$ は一意に決まり（$p^{n}y\equiv0\bmod p^{n+k}\iff y\equiv0\bmod p^{k}$）、逆系をなす。$y\defeq(y_{k}\bmod p^{k})_{k}$ について $x=p^{n}y$（各成分で比べる）。

**Step 3（2：分解）.** $x\neq0$ なら $\pi_{n}(x)\neq0$ となる $n$ があり、$m\defeq\max\{n : \pi_{n}(x)=0\}$ は有限。$x=p^{m}u$ で $\pi_{1}(u)\neq0$（そうでなければ $u\in p\mathbb{Z}_{p}$、$x\in p^{m+1}\mathbb{Z}_{p}=\ker\pi_{m+1}$）、1 から $u$ は単元。一意性：$p^{m}u=p^{m'}u'$（$m\le m'$）なら、$p$ は非零因子（Step 2 の議論から $py=0\Rightarrow y=0$）なので $u=p^{m'-m}u'$、$u$ が単元なので $m=m'$, $u=u'$。

**Step 4（3）.** 2 から $\mathbb{Z}_{p}$ は整域（$p^{m}u\cdot p^{m'}u'=p^{m+m'}uu'\neq0$）で、$0$ でないイデアルは $p^{m}\mathbb{Z}_{p}$（最小の $m$）なので局所 PID、DVR（\ref{ring:dvr-characterization}）。$\mathbb{Z}\to\mathbb{Z}_{p}$ の核は $\bigcap p^{n}\mathbb{Z}=0$。$a=p^{m}b$（$p\nmid b$）なら $b$ の像は単元なので $v(a)=m=v_{p}(a)$。

**Step 5（4）.** $\mathbb{Q}_{p}=\mathbb{Z}_{p}[1/p]$：$x/y$（$y=p^{m}u$）$=xu^{-1}p^{-m}$。超距離不等式と乗法性は付値の性質 $v(x+y)\ge\min(v(x),v(y))$, $v(xy)=v(x)+v(y)$ から。完備性：$|x_{k}-x_{l}|_{p}\to0$ なら、$p^{c}x_{k}\in\mathbb{Z}_{p}$（$c$ は共通）としてよく、各 $n$ で $\pi_{n}(p^{c}x_{k})$ は $k$ が大きいと一定になり、その値の列が $\mathbb{Z}_{p}$ の元（極限）を定める。稠密性：$x\in\mathbb{Z}_{p}$ について、$\pi_{n}(x)$ の代表 $a_{n}\in\mathbb{Z}$ は $|x-a_{n}|_{p}\le p^{-n}$（2）。$\mathbb{Q}_{p}$ の元は $p^{-c}\mathbb{Z}_{p}$ に入るので $\mathbb{Q}$ の元で近似できる。
:::

::: proposition 積公式 {#nt:product-formula keywords="product formula: for nonzero rational x, product over all places of |x|_v = 1" index="積公式|せきこうしき"}
$0\neq x\in\mathbb{Q}$ について $|x|_{\infty}\prod_{p}|x|_{p}=1$（$|x|_{\infty}$ は通常の絶対値、$p$ は素数全体で、有限個を除いて $|x|_{p}=1$）。
:::

::: proof
$x=\pm\prod p^{a_{p}}$ と素因数分解すると $|x|_{\infty}=\prod p^{a_{p}}$, $|x|_{p}=p^{-a_{p}}$（\ref{nt:p-adic-integers} の 3）。
:::

## ヘンゼルの補題 {#nt:sec-pa-hensel}

::: theorem ヘンゼルの補題 {#nt:hensel-lemma keywords="Hensel's lemma: a simple root mod p of a polynomial over Z_p lifts uniquely to a root in Z_p" index="ヘンゼルの補題|へんぜるのほだい"}
$f\in\mathbb{Z}_{p}[x]$, $a\in\mathbb{Z}_{p}$ について $f(a)\equiv0\pmod p$, $f'(a)\not\equiv0\pmod p$ なら、$f(\alpha)=0$, $\alpha\equiv a\pmod p$ となる $\alpha\in\mathbb{Z}_{p}$ がただ一つある。
:::

::: proof
**Step 1（テイラー展開）.** $f(y+h)=f(y)+hf'(y)+h^{2}g(y,h)$（$g\in\mathbb{Z}_{p}[y,h]$）。これは各単項式 $(y+h)^{k}=y^{k}+khy^{k-1}+h^{2}(\cdots)$ の展開から。

**Step 2（持ち上げ）.** $a_{1}\defeq a$ とし、$a_{n}\equiv a\pmod p$, $f(a_{n})\equiv0\pmod{p^{n}}$ となる $a_{n}$ があるとする。$a_{n+1}\defeq a_{n}+tp^{n}$（$t\in\mathbb{Z}_{p}$）とおくと、Step 1 から $f(a_{n+1})\equiv f(a_{n})+tp^{n}f'(a_{n})\pmod{p^{2n}}$、$2n\ge n+1$。$f(a_{n})=p^{n}c$ と書くと、条件 $f(a_{n+1})\equiv0\pmod{p^{n+1}}$ は $c+tf'(a_{n})\equiv0\pmod p$。$f'(a_{n})\equiv f'(a)\not\equiv0\pmod p$ は単元（\ref{nt:p-adic-integers} の 1）なので、$t\equiv-cf'(a_{n})^{-1}\pmod p$ と選べ、$t\bmod p$ は一意。

**Step 3（極限）.** $a_{n+1}\equiv a_{n}\pmod{p^{n}}$ なので $(a_{n}\bmod p^{n})_{n}$ は $\mathbb{Z}_{p}$ の元 $\alpha$ を定め、$\alpha\equiv a_{n}\pmod{p^{n}}$。$f(\alpha)\equiv f(a_{n})\equiv0\pmod{p^{n}}$ がすべての $n$ で成り立つので、$f(\alpha)\in\bigcap p^{n}\mathbb{Z}_{p}=0$。

**Step 4（一意性）.** $\alpha,\beta$ がともに条件をみたし $\alpha\neq\beta$ とする。$\beta=\alpha+h$, $h\neq0$, $v(h)\ge1$。Step 1 から $0=f(\beta)=hf'(\alpha)+h^{2}g$、$h$ で割って $f'(\alpha)=-hg\in p\mathbb{Z}_{p}$、$f'(\alpha)\equiv f'(a)\not\equiv0$ に反する。
:::

::: corollary ヘンゼルの補題の応用 {#nt:hensel-applications keywords="Z_p contains the (p-1)-th roots of unity; for odd p a p-adic unit is a square iff it is a square mod p; sqrt(-1) in Q_5 but not in Q_3; sqrt 2 in Q_7" index="p 進数の平方|ぴーしんすうのへいほう, タイヒミュラー代表元|たいひみゅらーだいひょうげん"}
1. $\mathbb{Z}_{p}$ は 1 の $(p-1)$ 乗根をちょうど $p-1$ 個含み、$\bmod p$ で $\mathbb{F}_{p}^{\times}$ と一対一に対応する（**タイヒミュラー代表元**）。
2. $p$ を奇素数とする。$u\in\mathbb{Z}_{p}^{\times}$ が $\mathbb{Z}_{p}$ で平方 $\iff u\bmod p$ が平方。とくに $\sqrt{-1}\in\mathbb{Q}_{p}\iff p\equiv1\pmod4$。
:::

::: proof
**Step 1（1）.** $f=x^{p-1}-1$ は $\mathbb{F}_{p}$ の $0$ でない元をすべて単根にもつ（フェルマーの小定理と $f'=(p-1)x^{p-2}\not\equiv0$）。ヘンゼルの補題で各根が一意に持ち上がる。根は $p-1$ 個以下（整域上の多項式）なので、ちょうどこれらで尽きる。

**Step 2（2）.** ⇒ は $\bmod p$ をとる。⇐：$u\equiv b^{2}$, $b\not\equiv0$ なら $f=x^{2}-u$ について $f(b)\equiv0$, $f'(b)=2b\not\equiv0$（$p$ 奇）でヘンゼル。$\sqrt{-1}$ については $(\tfrac{-1}{p})$（\ref{nt:euler-criterion} の 3）。$\mathbb{Q}_{p}$ の元 $y$ で $y^{2}=-1$ なら $v(y)=0$ なので $y\in\mathbb{Z}_{p}^{\times}$。
:::

## 代数体の完備化 {#nt:sec-pa-completion}

::: theorem 整数環の完備化と局所体 {#nt:local-decomposition keywords="O_K tensor Z_p = product of P-adic completions; each completion is a complete DVR free of rank e f over Z_p; K tensor Q_p = product of local fields K_P of degree e_P f_P; irreducible factors of f over Q_p correspond to primes above p" index="局所体|きょくしょたい, 完備化（代数体）|かんびかだいすうたい"}
（AC・DC）$p\mathcal{O}_{K}=\prod_{i=1}^{g}\mathfrak{P}_{i}^{e_{i}}$, $f_{i}=f(\mathfrak{P}_{i})$ とし、$\hat{\mathcal{O}}_{\mathfrak{P}}\defeq\varprojlim_{m}\mathcal{O}_{K}/\mathfrak{P}^{m}$ とする。
1. $\mathcal{O}_{K}\otimes_{\mathbb{Z}}\mathbb{Z}_{p}\cong\prod_{i}\hat{\mathcal{O}}_{\mathfrak{P}_{i}}$。
2. $\hat{\mathcal{O}}_{\mathfrak{P}_{i}}$ は完備な離散付値環で、階数 $e_{i}f_{i}$ の自由 $\mathbb{Z}_{p}$ 加群。その商体を $K_{\mathfrak{P}_{i}}$ とすると $[K_{\mathfrak{P}_{i}}:\mathbb{Q}_{p}]=e_{i}f_{i}$。
3. $K\otimes_{\mathbb{Q}}\mathbb{Q}_{p}\cong\prod_{i}K_{\mathfrak{P}_{i}}$。
4. $K=\mathbb{Q}(\theta)$, $f$ を $\theta$ の最小多項式とし、$f=f_{1}^{\mathrm{loc}}\cdots f_{h}^{\mathrm{loc}}$ を $\mathbb{Q}_{p}[x]$ でのモニック既約分解とすると、$h=g$ で、適当に番号を付ければ $\deg f_{i}^{\mathrm{loc}}=e_{i}f_{i}$。
:::

::: proof
**Step 1（1：$p$ 進完備化として）.** $\mathcal{O}_{K}$ は有限生成 $\mathbb{Z}$ 加群なので、\ref{ring:completion-tensor} から $\mathcal{O}_{K}\otimes\mathbb{Z}_{p}\cong\varprojlim_{n}\mathcal{O}_{K}/p^{n}\mathcal{O}_{K}$（環としても：積が両立する）。

**Step 2（1：中国剰余定理）.** $p^{n}\mathcal{O}_{K}=\prod_{i}\mathfrak{P}_{i}^{e_{i}n}$ で、異なる極大イデアルの冪は互いに素なので $\mathcal{O}_{K}/p^{n}\cong\prod_{i}\mathcal{O}_{K}/\mathfrak{P}_{i}^{e_{i}n}$（$n$ について両立）。逆極限は積と交換し、$\varprojlim_{n}\mathcal{O}_{K}/\mathfrak{P}^{en}\cong\varprojlim_{m}\mathcal{O}_{K}/\mathfrak{P}^{m}$（\ref{ring:completion-cofinal}：$\mathfrak{P}^{en}$ と $\mathfrak{P}^{m}$ は互いに抑えあう）。

**Step 3（2：DVR）.** $\mathcal{O}_{K}/\mathfrak{P}^{m}$ は局所環（極大イデアルは $\mathfrak{P}/\mathfrak{P}^{m}$ だけ）なので $\mathcal{O}_{K,\mathfrak{P}}/\mathfrak{P}^{m}\mathcal{O}_{K,\mathfrak{P}}\cong\mathcal{O}_{K}/\mathfrak{P}^{m}$ で、$\hat{\mathcal{O}}_{\mathfrak{P}}$ は DVR $\mathcal{O}_{K,\mathfrak{P}}$（\ref{ring:dedekind-local}）の極大イデアル進完備化。\ref{ring:regular-completion} から正則な 1 次元の局所環、すなわち DVR（\ref{ring:dvr-characterization}）。完備性は \ref{ring:completion} の性質（完備化は完備）による。

**Step 4（2：階数）.** $\hat{\mathcal{O}}_{\mathfrak{P}_{i}}$ は 1 から有限生成 $\mathbb{Z}_{p}$ 加群（$\mathbb{Z}_{p}^{n}$ の直和因子）で、整域なので捩れがなく、PID $\mathbb{Z}_{p}$ 上自由（\ref{mod:pid-submodule-free}）。階数は $\dim_{\mathbb{F}_{p}}\hat{\mathcal{O}}_{\mathfrak{P}_{i}}/p=\dim_{\mathbb{F}_{p}}\mathcal{O}_{K}/\mathfrak{P}_{i}^{e_{i}}=e_{i}f_{i}$（Step 2 の $n=1$ と、\ref{nt:ideal-norm-multiplicative} の Step 1：$|\mathcal{O}_{K}/\mathfrak{P}^{e}|=p^{ef}$）。$K_{\mathfrak{P}}=\hat{\mathcal{O}}_{\mathfrak{P}}[1/p]$（$p$ は $\hat{\mathcal{O}}_{\mathfrak{P}}$ の極大イデアルに入る $0$ でない元で、DVR の商体は一意化元の冪で分母を払える）なので $[K_{\mathfrak{P}}:\mathbb{Q}_{p}]=e_{i}f_{i}$。

**Step 5（3）.** $K\otimes_{\mathbb{Q}}\mathbb{Q}_{p}=(\mathcal{O}_{K}\otimes_{\mathbb{Z}}\mathbb{Z}_{p})[1/p]$（$K=\mathcal{O}_{K}\otimes\mathbb{Q}$, $\mathbb{Q}_{p}=\mathbb{Z}_{p}[1/p]$）で、1 と Step 4 から $\prod K_{\mathfrak{P}_{i}}$。

**Step 6（4）.** $K\cong\mathbb{Q}[x]/(f)$ なので $K\otimes\mathbb{Q}_{p}\cong\mathbb{Q}_{p}[x]/(f)$。$f$ は分離的なので既約因子は相異なり、中国剰余定理で $\mathbb{Q}_{p}[x]/(f)\cong\prod_{j}\mathbb{Q}_{p}[x]/(f_{j}^{\mathrm{loc}})$（体の積）。有限個の体の積として書く方法は、極大イデアル（成分の一つを $0$ にするもの）の集合と、その剰余体で決まるので一意。3 と比べて $h=g$、次数は $[K_{\mathfrak{P}_{i}}:\mathbb{Q}_{p}]=e_{i}f_{i}$。
:::

::: example ガウス整数の局所的な分解 {#nt:local-gaussian}
$f=x^{2}+1$。$p=5$：$2^{2}\equiv-1\pmod5$ でヘンゼルの補題から $\mathbb{Q}_{5}$ で $f=(x-\alpha)(x+\alpha)$、2 つの因子は次数 $1=e_{i}f_{i}$：$5$ は $\mathbb{Q}(i)$ で完全分解（\ref{nt:gaussian-decomposition}）。$p=3$：$-1$ は $\bmod3$ で平方でないので $\mathbb{Q}_{3}$ でも平方でなく（\ref{nt:hensel-applications} の 2）、$f$ は $\mathbb{Q}_{3}$ 上既約、$e f=2$：$3$ は惰性的（$e=1,f=2$）か分岐（$e=2$）で、$3\nmid d_{K}=-4$ から惰性的。$p=2$：$\mathbb{Q}_{2}(i)/\mathbb{Q}_{2}$ は 2 次で $e=2$（分岐）。
:::

::: remark オストロフスキーの定理と局所大域原理
1. **オストロフスキーの定理**：$\mathbb{Q}$ 上の自明でない絶対値は、$|\cdot|_{\infty}^{c}$（$0<c\le1$）か $|\cdot|_{p}^{c}$（$c>0$）と同値であることが知られている（本サイト未収録）。したがって $\mathbb{Q}$ の完備化は $\mathbb{R}$ と $\mathbb{Q}_{p}$ で尽き、積公式（\ref{nt:product-formula}）はすべての「素点」をそろえて初めて成り立つ。
2. **局所大域原理**：2 次形式が $\mathbb{Q}$ で非自明な零点をもつ $\iff$ $\mathbb{R}$ とすべての $\mathbb{Q}_{p}$ でもつ（**ハッセ–ミンコフスキーの定理**）が知られている（本サイト未収録）。3 次形式では成り立たず、セルマーの例 $3x^{3}+4y^{3}+5z^{3}=0$（すべての $\mathbb{Q}_{p}$ と $\mathbb{R}$ で非自明な解をもつが $\mathbb{Q}$ ではもたない）が知られている。
3. **ヘンゼル**は 1897 年頃に $p$ 進数を導入し、代数的整数論を「各素数での局所的な理論」に分ける見方を開いたと一般に言われている。\ref{nt:local-decomposition} はその基本で、分岐・分解群・惰性群（\ref{nt:page-decomposition-inertia}）は局所体の拡大 $K_{\mathfrak{P}}/\mathbb{Q}_{p}$ のガロア群として読み直せる（$D_{\mathfrak{P}}\cong\operatorname{Gal}(K_{\mathfrak{P}}/\mathbb{Q}_{p})$。本サイト未収録）。
:::

::: hypcheck
- **$f'(a)\not\equiv0$**：ヘンゼルの補題の Step 2（$t$ が解けること）と Step 4（一意性）に使う。外すと持ち上がらない例がある：$x^{2}-2$ は $\bmod2$ で根 $0$ をもつが、$\sqrt{2}\notin\mathbb{Q}_{2}$（$v(y^{2})$ は偶数なので $y^{2}=2$ は不可能）。
- **$p$ が奇素数**：\ref{nt:hensel-applications} の 2 で $f'(b)=2b$ が単元であることに使う。$p=2$ では、$u\in\mathbb{Z}_{2}^{\times}$ が平方 $\iff u\equiv1\pmod8$ になることが知られている（ヘンゼルの補題の精密版）。
- **有限生成性**：\ref{nt:local-decomposition} の Step 1 で完備化をテンソル積で書くのに使う（$\mathcal{O}_{K}$ が有限生成 $\mathbb{Z}$ 加群）。
- **選択公理・従属選択公理**：引用する完備化とデデキント環の定理を通して使う。
:::

::: supplement
**前提を弱めると.** ヘンゼルの補題は、完備な局所環（$\mathfrak{m}$ 進完備）上の多項式について、$\bmod\mathfrak{m}$ での互いに素な因数分解が持ち上がる、という形（**ヘンゼルの補題（因数分解版）**）に一般化される。この性質をもつ局所環を**ヘンゼル環**という。

**似た定理.** ニュートン法は、実数での方程式の解を同じ漸化式 $a_{n+1}=a_{n}-f(a_{n})/f'(a_{n})$ で近似し、$p$ 進の場合と同様に精度が倍々に上がる（2 次収束）。ヘンゼルの補題の Step 2 も、$t$ を $\bmod p^{n}$ まで一度に解くようにすれば $a_{n}\to a_{2n}$ と精度が倍になる。

**計算の観点.** $\mathbb{Q}_{p}$ の元は有限精度の $p$ 進展開として計算機で扱われ、多項式の $\mathbb{Q}_{p}$ 上の因数分解（したがって \ref{nt:local-decomposition} の 4 による素数の分解の計算）は、指数を割り切る素数についても可能である（モンテスのアルゴリズムなど）。
:::

## 高い視点 {#nt:sec-pa-viewpoint}

::: remark 形式的な近傍と分解
$\operatorname{Spec}\mathbb{Z}_{p}\to\operatorname{Spec}\mathbb{Z}$ は「点 $p$ の無限小近傍」で、底変換 $\operatorname{Spec}(\mathcal{O}_{K}\otimes\mathbb{Z}_{p})$ は $\operatorname{Spec}\mathcal{O}_{K}$ の $p$ の上の部分を無限小近傍の精度で見たものである。\ref{nt:local-decomposition} は、この近傍が $p$ の上の点ごとの近傍 $\operatorname{Spec}\hat{\mathcal{O}}_{\mathfrak{P}}$ の**交わらない和**に分かれることを言い、ヘンゼルの補題は「完備な近傍では、ファイバーの分解がそのまま近傍の分解に持ち上がる」ことを保証する。代数幾何で、点の形式的近傍が完備局所環で表されるのと同じである。比喩で言えば、$\mathbb{Q}$ を素数 $p$ の「顕微鏡」で覗くと $\mathbb{Q}_{p}$ が見え、$K$ を同じ顕微鏡で覗くと、$p$ の上の素イデアルの数だけの別々の像 $K_{\mathfrak{P}}$ に分かれて見え、それぞれの像の大きさが $e_{\mathfrak{P}}f_{\mathfrak{P}}$ である。
:::

## 問題 {#nt:sec-pa-problems}

::: problem {#nt:prob-pa-sqrt-seven-two}
$\sqrt{2}\in\mathbb{Q}_{7}$ を示し、その $\bmod7^{2}$ での値（$3$ に合同なもの）を求めよ。
:::

::: solution
$3^{2}=9\equiv2\pmod7$ で $f=x^{2}-2$, $f'(3)=6\not\equiv0$、ヘンゼルの補題で $\alpha\equiv3$ の根がある。$a_{2}=3+7t$：$f(3)=7$ なので $c=1$、$t\equiv-c\cdot f'(3)^{-1}=-6^{-1}\equiv-6\equiv1\pmod7$（$6\cdot6=36\equiv1$）。$a_{2}=10$、確かに $10^{2}-2=98=2\cdot49\equiv0\pmod{49}$。
:::

::: problem {#nt:prob-pa-cube-root-five}
$K=\mathbb{Q}(\sqrt[3]{2})$ で、$x^{3}-2$ の $\mathbb{Q}_{5}$ 上の既約分解の次数を求め、\ref{nt:cube-root-two-decomposition} と比べよ。
:::

::: solution
$\bmod5$ で $x^{3}-2=(x-3)(x^{2}+3x+4)$（後者は既約）で、二つの因子は互いに素。$x=3$ は単根（$f'(3)=27\not\equiv0$）なのでヘンゼルの補題で $\mathbb{Q}_{5}$ の根 $\alpha$ に持ち上がり、$x^{3}-2=(x-\alpha)g(x)$、$g$ は $\bmod5$ で $x^{2}+3x+4$ に一致する 2 次式で、$\mathbb{Q}_{5}$ に根があれば $\bmod5$ に根がある（根は $\mathbb{Z}_{5}$ に入る）ので既約。次数は $1,2$ で、$5\mathcal{O}_{K}=\mathfrak{P}_{1}\mathfrak{P}_{2}$, $e_{i}f_{i}=1,2$ と一致（\ref{nt:local-decomposition} の 4）。
:::
