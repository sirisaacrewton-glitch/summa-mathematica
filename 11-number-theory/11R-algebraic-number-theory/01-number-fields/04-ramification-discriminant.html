# 分岐と判別式 {#nt:page-ramification-discriminant keywords="p ramifies iff p divides the discriminant, trace form of O_K/pO_K, nilpotent elements have trace zero, dual lattice, inverse different, different ideal, norm of the different equals |d_K|, index of fractional ideals, Stickelberger's theorem d_K = 0 or 1 mod 4, sign of the discriminant (-1)^{r_2}, real and complex embeddings, ramified primes of quadratic and cyclotomic fields"}

デデキントの判別定理「素数 $p$ が $K$ で分岐する $\iff$ $p\mid d_{K}$」を、$\mathcal{O}_{K}/p\mathcal{O}_{K}$ 上のトレース形式が退化するかどうかで証明する（冪零元はトレースが $0$、有限体の拡大は分離的）。続いて、トレース形式の双対格子から**共役差積** $\mathfrak{D}_{K}$ を定義し、$N(\mathfrak{D}_{K})=|d_{K}|$ を示す。判別式の符号は複素埋め込みの組の数 $r_{2}$ で決まり、$d_{K}\equiv0,1\pmod4$（シュティッケルベルガー）も成り立つ。

> 用語は雪江『整数論』の用語（共役差積）に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## 記法と定義の確認 {#nt:sec-rd-notation}

::: notation
- 整数環の基底・判別式 $d_{K}$・基底変換・指数は \ref{nt:integral-basis}, \ref{nt:discriminant-basis-properties}。素イデアルの分解・分岐・ノルムは \ref{nt:fundamental-identity}, \ref{nt:splitting-types}, \ref{nt:ideal-norm-multiplicative}。
- トレース形式の非退化性（分離拡大）とトレースの共役による表示は \ref{ring:trace-conjugates}。有限体の拡大は分離的（\ref{fld:finite-field-properties} の 2）。中国剰余定理は \ref{ring:chinese-remainder}。分数イデアルと可逆性は \ref{ring:fractional-ideal}, \ref{ring:dedekind-invertible}。
- 有限次元の代数 $R$（体 $F$ 上）のトレース $\operatorname{Tr}_{R/F}(x)$ は掛け算写像 $m_{x}$ のトレース。冪零な行列のトレースは $0$（線形代数：冪零行列の固有値は $0$。\ref{lin:nilpotent-trace}）。行列式のライプニッツ展開 $\det(a_{ij})=\sum_{\pi\in S_{n}}\operatorname{sgn}(\pi)\prod_{i}a_{i\pi(i)}$（\ref{lin:leibniz-formula}）。線形代数の系列で扱う予定。
- $K$ の $\mathbb{C}$ への埋め込みのうち、像が $\mathbb{R}$ に入るものの個数を $r_{1}$、そうでないもの（複素共役で組になる）の組の数を $r_{2}$ とし、$r_{1}+2r_{2}=n$。
- **選択公理**：デデキント環の定理を通して使う。
:::

## 判別式と分岐 {#nt:sec-rd-dedekind}

::: lemma 剰余環のトレース形式 {#nt:trace-form-mod-p keywords="the trace form of O_K reduced mod p is the trace form of the F_p-algebra O_K/pO_K; its discriminant is d_K mod p" index="剰余環のトレース形式|じょうよかんのとれーすけいしき"}
整数環の基底 $\omega_{1},\dots,\omega_{n}$ の $\bmod p$ での像は $\mathbb{F}_{p}$ 代数 $\bar{R}\defeq\mathcal{O}_{K}/p\mathcal{O}_{K}$ の基底で、$\operatorname{Tr}_{K/\mathbb{Q}}(x)\bmod p=\operatorname{Tr}_{\bar{R}/\mathbb{F}_{p}}(\bar{x})$。したがって $d_{K}\bmod p=\det\bigl(\operatorname{Tr}_{\bar{R}/\mathbb{F}_{p}}(\bar{\omega}_{i}\bar{\omega}_{j})\bigr)$。
:::

::: proof
$\mathcal{O}_{K}=\bigoplus\mathbb{Z}\omega_{i}$ から $\bar{R}=\bigoplus\mathbb{F}_{p}\bar{\omega}_{i}$。$x\in\mathcal{O}_{K}$ の掛け算の行列（基底 $\omega_{i}$ について）は $\mathbb{Z}$ 成分で、その $\bmod p$ が $\bar{x}$ の掛け算の行列。$K$ 上の掛け算のトレースは $\mathcal{O}_{K}$ の基底で計算してよい（$\omega_{i}$ は $K$ の $\mathbb{Q}$ 上の基底）。行列式は成分の多項式なので $\bmod p$ と交換する。
:::

::: theorem デデキントの判別定理 {#nt:dedekind-discriminant keywords="a prime p ramifies in K if and only if p divides d_K" index="デデキントの判別定理|でできんとのはんべつていり"}
（AC）素数 $p$ が $K$ で分岐する $\iff p\mid d_{K}$。とくに分岐する素数は有限個。
:::

::: proof
**Step 1（積への分解）.** $p\mathcal{O}_{K}=\prod\mathfrak{P}_{i}^{e_{i}}$ とすると、中国剰余定理から $\bar{R}\cong\prod_{i}R_{i}$、$R_{i}\defeq\mathcal{O}_{K}/\mathfrak{P}_{i}^{e_{i}}$。積の代数のトレースは成分のトレースの和で、異なる成分の積は $0$ なので、$\bar{R}$ のトレース形式は $R_{i}$ のトレース形式の直交和。したがって $\bar{R}$ のトレース形式が非退化 $\iff$ すべての $R_{i}$ のトレース形式が非退化。

**Step 2（$e_{i}>1$ なら退化）.** $e_{i}\ge2$ なら $\mathfrak{P}_{i}\neq\mathfrak{P}_{i}^{e_{i}}$ なので $0\neq x\in\mathfrak{P}_{i}/\mathfrak{P}_{i}^{e_{i}}\subset R_{i}$ がある。任意の $y\in R_{i}$ について $xy\in\mathfrak{P}_{i}/\mathfrak{P}_{i}^{e_{i}}$ は冪零（$(xy)^{e_{i}}=0$）なので、掛け算 $m_{xy}$ は冪零な線形写像でトレース $0$。よって $x$ はトレース形式の核に入り、退化。

**Step 3（$e_{i}=1$ なら非退化）.** $R_{i}=\mathcal{O}_{K}/\mathfrak{P}_{i}$ は有限体で $\mathbb{F}_{p}$ 上分離的なので、トレース形式は非退化（\ref{ring:trace-conjugates} の 3）。

**Step 4（結論）.** \ref{nt:trace-form-mod-p} から $p\mid d_{K}\iff\bar{R}$ のトレース形式の行列式が $0$ $\iff$ 退化 $\iff$（Step 1〜3）ある $e_{i}>1$。$d_{K}\neq0$ なので割る素数は有限個。
:::

::: example 2 次体と円分体の分岐 {#nt:ramified-examples}
1. 2 次体 $\mathbb{Q}(\sqrt{d})$（$d$ は平方因子なし）：$d_{K}=d$（$d\equiv1\pmod4$）または $4d$（$d\equiv2,3$）なので、分岐する素数は $d$ の素因数と、$d\equiv2,3$ のときの $2$（\ref{nt:quadratic-integers}）。
2. $\mathbb{Q}(\zeta_{p})$（$p$ 奇素数）：$d_{K}=\pm p^{p-2}$ なので $p$ だけが分岐する（\ref{nt:cyclotomic-integers}）。
3. $\mathbb{Q}(\sqrt[3]{2})$：$d_{K}=-108=-2^{2}3^{3}$ なので $2,3$ だけが分岐する（\ref{nt:cube-root-two-decomposition} と一致）。
:::

## 共役差積 {#nt:sec-rd-different}

::: definition 双対格子と共役差積 {#nt:different keywords="dual lattice O^vee = {x : Tr(x O_K) in Z}, inverse different, different D_K = (O^vee)^{-1}" index="共役差積|きょうやくさせき, 双対格子|そうついこうし"}
$\mathcal{O}_{K}^{\vee}\defeq\{x\in K : \operatorname{Tr}_{K/\mathbb{Q}}(x\mathcal{O}_{K})\subset\mathbb{Z}\}$ とする。$\mathcal{O}_{K}^{\vee}$ は $\mathcal{O}_{K}$ を含む分数イデアル（$\mathcal{O}_{K}$ 部分加群で、$d_{K}\mathcal{O}_{K}^{\vee}\subset\mathcal{O}_{K}$：下の命題）で、その逆 $\mathfrak{D}_{K}\defeq(\mathcal{O}_{K}^{\vee})^{-1}$ を**共役差積**という。$\mathcal{O}_{K}\subset\mathcal{O}_{K}^{\vee}$ から $\mathfrak{D}_{K}\subset\mathcal{O}_{K}$ は整イデアル。
:::

::: proposition 共役差積のノルム {#nt:different-norm keywords="O^vee has the dual basis as Z-basis; [O^vee : O] = |d_K|; N(D_K) = |d_K|; index of fractional ideals" index="共役差積のノルム|きょうやくさせきののるむ"}
（AC）
1. 整数環の基底 $\omega_{i}$ の双対基底 $\omega_{i}^{*}$（$\operatorname{Tr}(\omega_{i}\omega_{j}^{*})=\delta_{ij}$）は $\mathcal{O}_{K}^{\vee}$ の $\mathbb{Z}$ 基底で、$[\mathcal{O}_{K}^{\vee}:\mathcal{O}_{K}]=|d_{K}|$。
2. 分数イデアル $\mathfrak{b}\supset\mathfrak{c}$ について $[\mathfrak{b}:\mathfrak{c}]=N(\mathfrak{c})/N(\mathfrak{b})$（ノルムを分数イデアルに乗法的に延ばしたもの）。
3. $N(\mathfrak{D}_{K})=|d_{K}|$。とくに $\mathfrak{D}_{K}$ を割る素イデアルは、分岐する素数の上にある。
:::

::: proof
**Step 1（1：基底）.** $x\in K$ を $x=\sum c_{j}\omega_{j}^{*}$（$c_{j}\in\mathbb{Q}$）と書くと $c_{j}=\operatorname{Tr}(x\omega_{j})$ なので、$x\in\mathcal{O}_{K}^{\vee}\iff$ すべての $c_{j}\in\mathbb{Z}$（$\mathcal{O}_{K}$ は $\omega_{j}$ で生成されるので、$\operatorname{Tr}(x\omega_{j})\in\mathbb{Z}$ を確かめれば十分）。$\mathcal{O}_{K}$ 部分加群であることは定義から。

**Step 2（1：指数）.** $\omega_{i}=\sum_{j}\operatorname{Tr}(\omega_{i}\omega_{j})\omega_{j}^{*}$（Step 1 の係数の式）なので、$\mathcal{O}_{K}$ の基底を $\mathcal{O}_{K}^{\vee}$ の基底で表す行列は $(\operatorname{Tr}(\omega_{i}\omega_{j}))$ で、行列式は $d_{K}$。\ref{nt:integral-basis} の Step 3 と同じスミス標準形の議論で $[\mathcal{O}_{K}^{\vee}:\mathcal{O}_{K}]=|d_{K}|$。とくに $d_{K}\mathcal{O}_{K}^{\vee}\subset\mathcal{O}_{K}$（有限アーベル群の位数は元を零化する）。

**Step 3（2）.** $0\neq d\in\mathbb{Z}$ で $d\mathfrak{b}\subset\mathcal{O}_{K}$ となるものをとる。$x\mapsto dx$ は $\mathfrak{b}/\mathfrak{c}\cong d\mathfrak{b}/d\mathfrak{c}$ を与え、整イデアルについて $[d\mathfrak{b}:d\mathfrak{c}]=[\mathcal{O}_{K}:d\mathfrak{c}]/[\mathcal{O}_{K}:d\mathfrak{b}]=N(d)N(\mathfrak{c})/(N(d)N(\mathfrak{b}))$（\ref{nt:ideal-norm-multiplicative}）。

**Step 4（3）.** 2 で $\mathfrak{b}=\mathfrak{D}_{K}^{-1}$, $\mathfrak{c}=\mathcal{O}_{K}$ とすると $|d_{K}|=[\mathfrak{D}_{K}^{-1}:\mathcal{O}_{K}]=1/N(\mathfrak{D}_{K}^{-1})=N(\mathfrak{D}_{K})$。$\mathfrak{P}\mid\mathfrak{D}_{K}$ なら $N(\mathfrak{P})$ は $|d_{K}|$ を割り切るので、$\mathfrak{P}$ の下の素数 $p$ は $d_{K}$ を割り切り、\ref{nt:dedekind-discriminant} から分岐する。
:::

::: remark 共役差積と分岐の精密な関係
より精密に、素イデアル $\mathfrak{P}$ が $\mathfrak{D}_{K}$ を割り切る $\iff$ $e(\mathfrak{P})>1$ で、$v_{\mathfrak{P}}(\mathfrak{D}_{K})\ge e(\mathfrak{P})-1$、等号は $p\nmid e(\mathfrak{P})$（**順分岐**）のときに限ることが知られている（局所化・完備化して計算する。本サイト未収録）。また $\mathcal{O}_{K}=\mathbb{Z}[\theta]$ なら $\mathfrak{D}_{K}=f'(\theta)\mathcal{O}_{K}$（オイラーの補題 $\operatorname{Tr}(\theta^{i}/f'(\theta))$ の計算による）が知られており、これは \ref{nt:discriminant-basis-properties} の 4 と \ref{nt:different-norm} の 3 に整合する：$N(f'(\theta)\mathcal{O}_{K})=|N(f'(\theta))|=|D(f)|=|d_{K}|$。
:::

## 判別式の符号と $\bmod4$ {#nt:sec-rd-sign}

::: proposition 判別式の符号とシュティッケルベルガーの定理 {#nt:discriminant-sign-stickelberger keywords="sign of d_K is (-1)^{r_2}; Stickelberger: d_K is congruent to 0 or 1 mod 4" index="判別式の符号|はんべつしきのふごう, シュティッケルベルガーの定理|しゅてぃっけるべるがーのていり"}
1. $d_{K}$ の符号は $(-1)^{r_{2}}$。
2. $d_{K}\equiv0$ または $1\pmod4$。
:::

::: proof
**Step 1（1）.** $\delta\defeq\det(\sigma_{i}(\omega_{j}))$ とすると $d_{K}=\delta^{2}$（\ref{nt:discriminant-basis-properties} の 1）。複素共役 $c$ は埋め込みの集合を置換し（$c\circ\sigma_{i}=\sigma_{c(i)}$）、実埋め込みを固定し、$r_{2}$ 組の複素埋め込みを入れ替える。よって $\bar{\delta}=\det(\overline{\sigma_{i}(\omega_{j})})$ は $\delta$ の行を $r_{2}$ 回入れ替えたもので、$\bar{\delta}=(-1)^{r_{2}}\delta$。$r_{2}$ が偶数なら $\delta\in\mathbb{R}$ で $d_{K}>0$、奇数なら $\delta\in\sqrt{-1}\mathbb{R}$ で $d_{K}<0$（$d_{K}\neq0$）。

**Step 2（2：偶置換と奇置換に分ける）.** ライプニッツ展開で $\delta=P-N$、$P\defeq\sum_{\pi\text{ 偶}}\prod_{i}\sigma_{i}(\omega_{\pi(i)})$, $N\defeq\sum_{\pi\text{ 奇}}\prod_{i}\sigma_{i}(\omega_{\pi(i)})$（ここでは行列の転置をとって、置換を埋め込みの側に作用させてもよい）。$K$ を含むガロア拡大 $L$ の元 $\tau$ は $\sigma_{i}$ を $\tau\circ\sigma_{i}=\sigma_{\rho(i)}$ と置換し、$\rho$ が偶置換なら $P,N$ を固定し、奇置換なら入れ替える。よって $P+N$ と $PN$ は $\operatorname{Gal}(L/\mathbb{Q})$ で不変な代数的整数で、$\mathbb{Z}$ の元（\ref{nt:integers-basic} の 1）。

**Step 3（2：結論）.** $d_{K}=(P-N)^{2}=(P+N)^{2}-4PN\equiv(P+N)^{2}\pmod4$ で、整数の平方は $\bmod4$ で $0$ か $1$。
:::

::: hypcheck
- **有限体が完全であること**：\ref{nt:dedekind-discriminant} の Step 3 で、剰余体の拡大が分離的でトレース形式が非退化であることに使う。剰余体が完全でない（関数体の拡大で非分離な剰余拡大がある）場合、$e=1$ でも判別式に現れることがあり、「不分岐」の定義に剰余拡大の分離性を含める。
- **$\mathcal{O}_{K}$ が自由 $\mathbb{Z}$ 加群であること**：\ref{nt:trace-form-mod-p} で基底を $\bmod p$ に落とすこと、\ref{nt:different-norm} で双対基底をとることに使う。
- **選択公理**：デデキント環の定理を通して使う。
:::

::: supplement
**前提を弱めると.** デデキント環 $A$ 上の相対拡大 $L/F$ では、判別式は $A$ のイデアル $\mathfrak{d}_{L/F}$（局所的な基底の判別式で生成）として定義され、「$\mathfrak{p}$ が分岐 $\iff\mathfrak{p}\mid\mathfrak{d}_{L/F}$」と $N_{L/F}(\mathfrak{D}_{L/F})=\mathfrak{d}_{L/F}$ が同じ形で成り立つ（剰余拡大が分離的なら）。

**似た定理.** リーマン面の被覆 $f:Y\to X$ の分岐因子 $R=\sum(e_{y}-1)y$ は共役差積の類似で、リーマン–フルヴィッツの公式 $2g_{Y}-2=\deg f\,(2g_{X}-2)+\deg R$ が成り立つ。数論では $\log|d_{K}|$ がこの「種数」の役割を演じる。

**計算の観点.** 分岐する素数は $d_{K}$ の素因数として計算できる。$d_{K}$ の計算には整数環の基底が必要だが、$D(f)$ を割る素数のうち $d_{K}$ を割るものを決めるだけなら、\ref{nt:squarefree-criterion} と \ref{nt:kummer-dedekind} で多くの場合足りる。
:::

## 高い視点 {#nt:sec-rd-viewpoint}

::: remark 判別式は「被覆の分岐の総量」
$\operatorname{Spec}\mathcal{O}_{K}\to\operatorname{Spec}\mathbb{Z}$ は有限平坦な射で、各ファイバーは有限次元の $\mathbb{F}_{p}$ 代数 $\mathcal{O}_{K}/p$ である。ファイバーが**エタール**（被約で、剰余体が分離的な有限体の積）であることと、トレース形式が非退化であることは同値で、判別式はトレース形式の行列式として「エタールでないファイバーの場所」を切り出す（\ref{nt:dedekind-discriminant}）。共役差積はトレースの双対として定義される「相対的な微分形式」の層（$\Omega_{\mathcal{O}_{K}/\mathbb{Z}}$ の零化イデアル）であることが知られており、判別式はその次数（ノルム）である。比喩で言えば、判別式は被覆の継ぎ目の目録で、共役差積は各継ぎ目の深さまで記録した詳細な目録である。
:::

## 問題 {#nt:sec-rd-problems}

::: problem {#nt:prob-rd-quadratic-different}
$K=\mathbb{Q}(\sqrt{d})$（$d\equiv2,3\pmod4$, 平方因子なし）で、$\mathcal{O}_{K}^{\vee}=\frac{1}{2\sqrt{d}}\mathcal{O}_{K}$、したがって $\mathfrak{D}_{K}=(2\sqrt{d})$ を示し、$N(\mathfrak{D}_{K})=|d_{K}|$ を確かめよ。
:::

::: solution
基底 $1,\sqrt{d}$ について $\operatorname{Tr}(1)=2$, $\operatorname{Tr}(\sqrt{d})=0$, $\operatorname{Tr}(d)=2d$。双対基底は $\operatorname{Tr}(1\cdot\tfrac12)=1$, $\operatorname{Tr}(\sqrt{d}\cdot\tfrac12)=0$, $\operatorname{Tr}(1\cdot\tfrac{\sqrt{d}}{2d})=0$, $\operatorname{Tr}(\sqrt{d}\cdot\tfrac{\sqrt{d}}{2d})=1$ から $\tfrac12$, $\tfrac{\sqrt{d}}{2d}=\tfrac{1}{2\sqrt{d}}$。$\tfrac{1}{2\sqrt{d}}\mathcal{O}_{K}$ の基底 $\tfrac{1}{2\sqrt{d}}$, $\tfrac{\sqrt{d}}{2\sqrt{d}}=\tfrac12$ と一致するので $\mathcal{O}_{K}^{\vee}=\tfrac{1}{2\sqrt{d}}\mathcal{O}_{K}$（\ref{nt:different-norm} の 1）、$\mathfrak{D}_{K}=(2\sqrt{d})$。$N(2\sqrt{d})=|N(2\sqrt{d})|=|4\cdot(-d)|=4|d|=|d_{K}|$。（$f=x^{2}-d$ について $f'(\sqrt{d})=2\sqrt{d}$ で、注意の公式とも一致。）
:::

::: problem {#nt:prob-rd-stickelberger-check}
$\mathbb{Q}(\sqrt{3})$ と $\mathbb{Q}(\sqrt{5})$ のそれぞれについて、$\mathbb{Z}[\sqrt{d}]$ の判別式とシュティッケルベルガーの定理（\ref{nt:discriminant-sign-stickelberger} の 2）だけから $d_{K}$ が決まるかどうかを調べ、\ref{nt:quadratic-integers} と比べよ。
:::

::: solution
$d(1,\sqrt{d})=4d$。\ref{nt:integral-basis} の 3 から指数は $1$ か $2$ で、$d_{K}=4d$ か $d$。$d=3$：候補 $12$ と $3$ のうち $3\equiv3\pmod4$ はシュティッケルベルガーの定理に反するので $d_{K}=12$、$\mathcal{O}_{K}=\mathbb{Z}[\sqrt{3}]$。$d=5$：候補 $20\equiv0$ と $5\equiv1$ はどちらも許されるので判別式だけでは決まらず、実際は $d_{K}=5$、$\mathcal{O}_{K}=\mathbb{Z}[\tfrac{1+\sqrt{5}}{2}]$（\ref{nt:quadratic-integers}）。
:::
