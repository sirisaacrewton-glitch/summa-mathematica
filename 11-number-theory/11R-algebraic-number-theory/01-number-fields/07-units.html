# ディリクレの単数定理 {#nt:page-units keywords="unit group, roots of unity in a number field, Kronecker's theorem, logarithmic embedding, discrete subgroups of R^m are lattices, existence of units with prescribed signs of logarithms, strictly diagonally dominant matrix, Dirichlet unit theorem O_K^x = mu_K x Z^{r_1 + r_2 - 1}, fundamental units, regulator, real quadratic fields, Pell's equation, fundamental unit of Q(sqrt 2)"}

整数環の単元群 $\mathcal{O}_{K}^{\times}$ は、有限巡回群 $\mu_{K}$（$K$ の 1 の冪根）と階数 $r_{1}+r_{2}-1$ の自由アーベル群の直積である（**ディリクレの単数定理**）。証明は、単数を対数写像 $u\mapsto(\log|\sigma(u)|)_{\sigma}$ で超平面の中の格子に写すことと、ミンコフスキーの凸体定理で「十分多くの単数」を作ることからなる。実 2 次体では単数群は $\pm\varepsilon^{\mathbb{Z}}$ で、ペル方程式の解の構造が分かる。

> 用語は雪江『整数論』の用語（単数・基本単数・単数基準）に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## 記法と定義の確認 {#nt:sec-un-notation}

::: notation
- 単元の判定 $N(\alpha)=\pm1$ は \ref{nt:integers-basic} の 4。埋め込み $\rho_{i}$（実）, $\tau_{l}$（複素の組の代表）と $r_{1},r_{2}$、ミンコフスキー埋め込み・凸体定理・小さいノルムの元・類群の有限性（ノルムが有界な整イデアルは有限個）は \ref{nt:minkowski-embedding}, \ref{nt:minkowski-convex-body}, \ref{nt:small-norm-element}, \ref{nt:class-group-finite}。
- 体の乗法群の有限部分群は巡回群（\ref{fld:finite-multiplicative-cyclic}）。PID 上の自由加群の部分加群は自由（\ref{mod:pid-submodule-free}）。
- $s\defeq r_{1}+r_{2}$ 個の「無限素点」を $v_{1},\dots,v_{s}$ とし、$x\in K$ について $\|x\|_{v}\defeq|\rho_{i}(x)|$（実）、$|\tau_{l}(x)|^{2}$（複素）とする。$|N(x)|=\prod_{v}\|x\|_{v}$。$r\defeq s-1$。
- **選択公理**：デデキント環の定理（類群の有限性）を通して使う。
:::

## 1 の冪根と離散部分群 {#nt:sec-un-roots}

::: lemma 有界な代数的整数とクロネッカーの定理 {#nt:kronecker-roots-of-unity keywords="finitely many algebraic integers of K with all conjugates bounded; an algebraic integer with all conjugates of absolute value one is a root of unity; mu_K is finite cyclic" index="クロネッカーの定理（1 の冪根）|くろねっかーのていりいちのべきこん"}
1. $C>0$ について、$\mathcal{O}_{K}$ の元で、すべての埋め込みで $|\sigma(\alpha)|\le C$ となるものは有限個。
2. $\alpha\in\mathcal{O}_{K}$ がすべての $\sigma$ で $|\sigma(\alpha)|=1$ をみたせば、$\alpha$ は 1 の冪根。
3. $K$ に含まれる 1 の冪根全体 $\mu_{K}$ は有限巡回群。
:::

::: proof
**Step 1（1）.** $\alpha$ の特性多項式 $\chi_{\alpha}(X)\defeq\prod_{\sigma}(X-\sigma(\alpha))$（掛け算写像の特性多項式。最小多項式の冪なので $\mathbb{Z}[X]$ に属する）の $X^{n-k}$ の係数は、絶対値が $\binom{n}{k}C^{k}$ 以下の整数。そのような多項式は有限個で、根も有限個。

**Step 2（2）.** $\alpha^{m}$（$m\ge1$）はすべて 1 の条件（$C=1$）をみたすので、有限個の値しかとらず、$\alpha^{a}=\alpha^{b}$（$a<b$）。$\alpha\neq0$ なので $\alpha^{b-a}=1$。

**Step 3（3）.** 1 の冪根は代数的整数で絶対値 1 なので、1 から $\mu_{K}$ は有限。体の乗法群の有限部分群なので巡回群。
:::

::: lemma 離散部分群は格子 {#nt:discrete-subgroup keywords="a discrete subgroup of R^m is generated by R-linearly independent vectors" index="離散部分群|りさんぶぶんぐん"}
$\Gamma\subset\mathbb{R}^{m}$ を離散な部分群（$0$ のある近傍が $\Gamma$ の元を $0$ しか含まない）とすると、$\Gamma$ は $\mathbb{R}$ 上一次独立な元 $\gamma_{1},\dots,\gamma_{t}$（$t\le m$）で $\Gamma=\bigoplus\mathbb{Z}\gamma_{i}$ と書ける。
:::

::: proof
**Step 1（有界集合の中は有限）.** $|x|<\varepsilon$ の $\Gamma$ の元が $0$ だけとすると、$\Gamma$ の相異なる元の距離は $\ge\varepsilon$（差が $\Gamma$ の元）。有界集合は、直径 $<\varepsilon$ の有限個の集合で覆えるので、その中の $\Gamma$ の元は有限個。

**Step 2（有限指数の部分格子）.** $V$ を $\Gamma$ の張る部分空間、$t=\dim V$ とし、$\Gamma$ から $V$ の基底 $v_{1},\dots,v_{t}$ を選ぶ。$\Lambda_{0}\defeq\bigoplus\mathbb{Z}v_{i}\subset\Gamma$。$\gamma\in\Gamma$ を $\gamma=\sum c_{i}v_{i}$（$c_{i}\in\mathbb{R}$）と書き、$\gamma-\sum\lfloor c_{i}\rfloor v_{i}$ は有界な平行体 $\{\sum t_{i}v_{i} : 0\le t_{i}<1\}$ の中の $\Gamma$ の元。Step 1 からその個数は有限なので $N\defeq[\Gamma:\Lambda_{0}]<\infty$。

**Step 3（自由）.** $N\Gamma\subset\Lambda_{0}$ なので $\Gamma\subset\tfrac1N\Lambda_{0}\cong\mathbb{Z}^{t}$、\ref{mod:pid-submodule-free} から $\Gamma$ は自由で、$\Lambda_{0}\subset\Gamma$ から階数 $t$。その基底 $\gamma_{1},\dots,\gamma_{t}$ は $t$ 次元の $V$ を張るので $\mathbb{R}$ 上一次独立。
:::

## 対数写像 {#nt:sec-un-log}

::: proposition 対数写像 {#nt:log-embedding keywords="logarithmic embedding l(u) = (log ||u||_v); image lies in the trace-zero hyperplane; kernel is mu_K; image is discrete" index="対数写像|たいすうしゃぞう"}
$\ell:\mathcal{O}_{K}^{\times}\to\mathbb{R}^{s}$, $\ell(u)\defeq(\log\|u\|_{v_{1}},\dots,\log\|u\|_{v_{s}})$ は準同型で
1. 像は超平面 $H\defeq\{y : \sum y_{i}=0\}$ に含まれる。
2. 核は $\mu_{K}$。
3. 像は離散。したがって $\ell(\mathcal{O}_{K}^{\times})\cong\mathbb{Z}^{t}$（$t\le r=s-1$）。
:::

::: proof
**Step 1（1）.** $\sum_{v}\log\|u\|_{v}=\log|N(u)|=\log1=0$（\ref{nt:integers-basic} の 4）。

**Step 2（2）.** $\ell(u)=0$ ならすべての $|\sigma(u)|=1$（複素の $\|\cdot\|_{v}$ は 2 乗、$\bar{\tau}$ も同じ絶対値）で、\ref{nt:kronecker-roots-of-unity} の 2 から 1 の冪根。逆は明らか。

**Step 3（3）.** $\ell(u)$ が有界集合 $\{|y_{i}|\le c\}$ に入れば、すべての $|\sigma(u)|\le e^{c}$ なので、\ref{nt:kronecker-roots-of-unity} の 1 からそのような $u$ は有限個。よって $\ell$ の像は、原点の近傍に有限個の点しか持たず離散（有限個の $0$ でない点より小さい近傍をとる）。\ref{nt:discrete-subgroup} と 1 から結論。
:::

## 単数の存在 {#nt:sec-un-existence}

::: lemma 一つの素点だけで大きい単数 {#nt:unit-large-at-one-place keywords="for each infinite place v_k there is a unit u with ||u||_v < 1 for all v != v_k" index="単数の存在|たんすうのそんざい"}
（AC）$s\ge2$ とする。各 $k$ について、単数 $u_{k}$ で、$v\neq v_{k}$ なるすべての $v$ について $\|u_{k}\|_{v}<1$ となるものがある。
:::

::: proof
**Step 1（指定した大きさの元）.** $B\defeq(2/\pi)^{r_{2}}\sqrt{|d_{K}|}$ とする。正の数 $c_{v}$（$\prod_{v}c_{v}=B$）について、$0\neq\alpha\in\mathcal{O}_{K}$ で $\|\alpha\|_{v}\le c_{v}$（すべての $v$）となるものがある：\ref{nt:small-norm-element} の証明で $X_{t}$ を $\{|x_{i}|\le c_{v_{i}},\ |z_{l}|^{2}\le c_{v_{l}}\}$ に替えると、体積は $\prod_{\text{実}}2c_{v}\prod_{\text{複素}}\pi c_{v}=2^{r_{1}}\pi^{r_{2}}B=2^{n}\cdot2^{-r_{2}}\sqrt{|d_{K}|}$ でちょうど凸体定理の条件（$\mathfrak{a}=\mathcal{O}_{K}$）。このとき $|N(\alpha)|=\prod\|\alpha\|_{v}\le B$。

**Step 2（減少列）.** $\alpha_{1}\in\mathcal{O}_{K}\setminus0$ を任意にとる。$\alpha_{m}$ が決まったら、$v\neq v_{k}$ について $c_{v}\defeq\tfrac12\|\alpha_{m}\|_{v}$、$c_{v_{k}}\defeq B/\prod_{v\neq v_{k}}c_{v}$ として Step 1 の元を $\alpha_{m+1}$ とする。$v\neq v_{k}$ で $\|\alpha_{m+1}\|_{v}\le\tfrac12\|\alpha_{m}\|_{v}<\|\alpha_{m}\|_{v}$、また $|N(\alpha_{m+1})|\le B$。

**Step 3（同じイデアル）.** $m\ge2$ で $N(\alpha_{m}\mathcal{O}_{K})=|N(\alpha_{m})|\le B$（\ref{nt:ideal-norm-multiplicative}）。ノルムが $B$ 以下の整イデアルは有限個（\ref{nt:class-group-finite} の 2）なので、$a<b$ で $\alpha_{a}\mathcal{O}_{K}=\alpha_{b}\mathcal{O}_{K}$。$u_{k}\defeq\alpha_{b}/\alpha_{a}$ は単数で、$v\neq v_{k}$ について $\|u_{k}\|_{v}=\|\alpha_{b}\|_{v}/\|\alpha_{a}\|_{v}<1$。
:::

::: lemma 狭義対角優位な行列 {#nt:diagonally-dominant keywords="a strictly diagonally dominant real matrix is invertible" index="対角優位な行列|たいかくゆういなぎょうれつ"}
実正方行列 $A=(a_{ij})$ が、すべての $i$ で $|a_{ii}|>\sum_{j\neq i}|a_{ij}|$ をみたせば、$A$ は正則。
:::

::: proof
$Ax=0$, $x\neq0$ とし、$|x_{i}|$ が最大の $i$ をとる。$a_{ii}x_{i}=-\sum_{j\neq i}a_{ij}x_{j}$ から $|a_{ii}||x_{i}|\le\sum_{j\neq i}|a_{ij}||x_{i}|$、$|x_{i}|>0$ で割って仮定に反する。
:::

## 単数定理 {#nt:sec-un-theorem}

::: theorem ディリクレの単数定理 {#nt:dirichlet-unit-theorem keywords="O_K^x is isomorphic to mu_K x Z^{r_1 + r_2 - 1}; fundamental units" index="ディリクレの単数定理|でぃりくれのたんすうていり, 基本単数|きほんたんすう"}
（AC）$r=r_{1}+r_{2}-1$ とすると
$$
\mathcal{O}_{K}^{\times}\cong\mu_{K}\times\mathbb{Z}^{r}.
$$
すなわち単数 $\varepsilon_{1},\dots,\varepsilon_{r}$（**基本単数**）があり、任意の単数はただ一通りに $\zeta\varepsilon_{1}^{m_{1}}\cdots\varepsilon_{r}^{m_{r}}$（$\zeta\in\mu_{K}$, $m_{i}\in\mathbb{Z}$）と書ける。
:::

::: proof
**Step 1（$r=0$）.** $s=1$ なら $H=0$ で、\ref{nt:log-embedding} から $\mathcal{O}_{K}^{\times}=\mu_{K}$。以下 $s\ge2$。

**Step 2（$r$ 個の独立な像）.** \ref{nt:unit-large-at-one-place} の $u_{1},\dots,u_{s}$ について、行列 $A=(a_{ki})$, $a_{ki}\defeq\log\|u_{k}\|_{v_{i}}$ を考える。$i\neq k$ で $a_{ki}<0$、行の和は $0$（\ref{nt:log-embedding} の 1）なので $a_{kk}=-\sum_{i\neq k}a_{ki}>0$。最後の行と列を除いた $r\times r$ 行列は、$k\le r$ について $|a_{kk}|=\sum_{i\neq k,\,i\le s}|a_{ki}|>\sum_{i\neq k,\,i\le r}|a_{ki}|$（$|a_{ks}|>0$ の分だけ真に大きい）なので狭義対角優位で、\ref{nt:diagonally-dominant} から正則。よって $\ell(u_{1}),\dots,\ell(u_{r})$ は一次独立。

**Step 3（階数）.** \ref{nt:log-embedding} の 3 から $\ell(\mathcal{O}_{K}^{\times})\cong\mathbb{Z}^{t}$ で $t\le r$、Step 2 から $t\ge r$。よって $\ell(\mathcal{O}_{K}^{\times})\cong\mathbb{Z}^{r}$。

**Step 4（直積への分解）.** 完全列 $1\to\mu_{K}\to\mathcal{O}_{K}^{\times}\xrightarrow{\ell}\mathbb{Z}^{r}\to0$ で、$\mathbb{Z}^{r}$ の基底 $e_{i}$ の逆像 $\varepsilon_{i}$ を選ぶと、$\mathbb{Z}^{r}\to\mathcal{O}_{K}^{\times}$, $e_{i}\mapsto\varepsilon_{i}$ は分裂を与え（自由加群の普遍性 \ref{mod:free-module-universal}）、$\mathcal{O}_{K}^{\times}\cong\mu_{K}\times\mathbb{Z}^{r}$。
:::

::: definition 単数基準 {#nt:regulator keywords="regulator R_K = |det(log ||epsilon_i||_{v_j})_{i,j <= r}|" index="単数基準|たんすうきじゅん"}
基本単数 $\varepsilon_{1},\dots,\varepsilon_{r}$ について、$R_{K}\defeq|\det(\log\|\varepsilon_{i}\|_{v_{j}})_{1\le i,j\le r}|$（$r=0$ なら $1$）を**単数基準**という。基本単数の取り方と、除く素点の選び方によらない（行列の行の和が $0$ なので、どの列を除いても行列式の絶対値は同じ；基本単数の取り替えは $\mathrm{GL}_{r}(\mathbb{Z})$ の行列）。$R_{K}$ は格子 $\ell(\mathcal{O}_{K}^{\times})$ の（適当に正規化した）体積である。
:::

## 例 {#nt:sec-un-examples}

::: example 2 次体の単数 {#nt:quadratic-units-examples keywords="units of imaginary quadratic fields; units of Q(sqrt 2) are plus or minus (1 + sqrt 2)^n; fundamental unit" index="2 次体の単数|にじたいのたんすう"}
1. 虚 2 次体（$r_{1}=0$, $r_{2}=1$, $r=0$）：$\mathcal{O}_{K}^{\times}=\mu_{K}$。$\mathbb{Q}(i)$ では $\{\pm1,\pm i\}$、$\mathbb{Q}(\sqrt{-3})$ では 6 次の 1 の冪根、他は $\{\pm1\}$（$a^{2}+|d|b^{2}=1$ または $4$ の解を数える）。
2. 実 2 次体（$r_{1}=2$, $r=1$）：$\mathcal{O}_{K}^{\times}=\{\pm\varepsilon^{m}\}$ で、$\varepsilon>1$ を**基本単数**という。$\mathbb{Q}(\sqrt{2})$ では $\varepsilon=1+\sqrt{2}$：単数 $u=a+b\sqrt{2}>1$ について、共役 $\bar{u}=\pm u^{-1}\in(-1,1)$ なので $a=\tfrac{u+\bar{u}}{2}>0$, $b\sqrt{2}=\tfrac{u-\bar{u}}{2}>0$、$a,b\ge1$ で $u\ge1+\sqrt{2}$。1 より大きい最小の単数は $1+\sqrt{2}$（$N=-1$）で、これが基本単数（$\ell$ の像の格子の生成元は、1 より大きい最小の単数の像）。
3. $\mathbb{Q}(\zeta_{p})$（$p$ 奇素数）：$r_{1}=0$, $r_{2}=(p-1)/2$ なので階数は $(p-3)/2$。$\tfrac{1-\zeta^{a}}{1-\zeta}$（$p\nmid a$）は単数で、**円単数**と呼ばれる。
:::

::: theorem ペル方程式 {#nt:pell-equation keywords="Pell's equation x^2 - d y^2 = 1 has infinitely many integer solutions; solutions are given by powers of a fundamental solution" index="ペル方程式|ぺるほうていしき"}
（AC）$d>1$ を平方でない整数とする。$x^{2}-dy^{2}=1$ は無限個の整数解をもち、正の解は、最小の正の解 $(x_{1},y_{1})$ について $x+y\sqrt{d}=(x_{1}+y_{1}\sqrt{d})^{m}$（$m\ge1$）で与えられる。
:::

::: proof
**Step 1（解はノルム 1 の単元）.** 解 $(x,y)$ と $\mathbb{Z}[\sqrt{d}]$ のノルム 1 の元 $x+y\sqrt{d}$ は一対一。$\mathbb{Z}[\sqrt{d}]\subset\mathcal{O}_{K}$（$K=\mathbb{Q}(\sqrt{d})$、$d$ を平方因子のない部分に替えても $\mathbb{Z}[\sqrt{d}]$ は $\mathcal{O}_{K}$ の部分環）で、ノルム $1$ の元は単元（逆元は共役）。

**Step 2（無限個）.** $U\defeq\{u\in\mathbb{Z}[\sqrt{d}]^{\times} : N(u)=1\}$ は $\mathcal{O}_{K}^{\times}$ の有限指数の部分群：$\mathcal{O}_{K}^{\times}/\{u : N(u)=1\}$ は $\{\pm1\}$ に入り、$\mathbb{Z}[\sqrt{d}]$ は $\mathcal{O}_{K}$ の有限指数の部分群 $M$ を含む（$m\mathcal{O}_{K}\subset\mathbb{Z}[\sqrt{d}]$）ので、$\mathcal{O}_{K}^{\times}$ の像を有限群 $(\mathcal{O}_{K}/m\mathcal{O}_{K})^{\times}$ に写したときの核 $\{u\equiv1\bmod m\}$ は $\mathbb{Z}[\sqrt{d}]$ に入る（$u=1+m\beta$）。よって $U$ は $\mathcal{O}_{K}^{\times}\cong\{\pm1\}\times\mathbb{Z}$ の有限指数の部分群で、無限群。

**Step 3（構造）.** $U\cap\{u>1\}$ の最小元 $\eta=x_{1}+y_{1}\sqrt{d}$ をとる（$U$ は $\pm\varepsilon_{0}^{\mathbb{Z}}$ の部分群で、$1$ より大きい元の集合は $\varepsilon_{0}$ の正の冪の離散集合なので最小元がある）。$U\cap\{u>0\}=\eta^{\mathbb{Z}}$（$\mathbb{Z}$ の部分群は巡回）。$u=x+y\sqrt{d}>1$ で $N(u)=1$ なら $x,y>0$（\ref{nt:quadratic-units-examples} の 2 と同じ議論）なので、正の解は $\eta^{m}$（$m\ge1$）で、$\eta$ は $x,y>0$ の解のうち $x+y\sqrt{d}$ が最小のもの、すなわち最小の正の解。
:::

::: remark 類数公式と単数基準
$\zeta_{K}(s)=\sum_{\mathfrak{a}}N(\mathfrak{a})^{-s}$（デデキントのゼータ関数）の $s=1$ での留数は
$$
\frac{2^{r_{1}}(2\pi)^{r_{2}}h_{K}R_{K}}{w_{K}\sqrt{|d_{K}|}}\qquad(w_{K}=|\mu_{K}|)
$$
であることが知られている（**類数公式**、ディリクレ・デデキント。本サイト未収録）。類数 $h_{K}$ と単数基準 $R_{K}$ は積の形でしか現れず、実 2 次体で類数を個別に決めるのが難しい理由の一つになっている（\ref{nt:page-class-group} のガウスの予想）。
:::

::: hypcheck
- **類群の有限性（ノルムが有界な整イデアルの有限性）**：\ref{nt:unit-large-at-one-place} の Step 3 で、無限列から同じイデアルを生成する 2 元を選ぶのに本質的。
- **凸体定理**：\ref{nt:unit-large-at-one-place} の Step 1 で、指定した素点ごとの大きさの元を作るのに使う（各素点の大きさを自由に配分できることが要点）。
- **離散性**：\ref{nt:log-embedding} の 3 で、像が格子であることに使う。単元でない元まで含めると対数写像の像は離散にならない（$\mathbb{Q}^{\times}$ でも $\log|2^{a}3^{b}|$ は $\mathbb{R}$ で稠密）。
- **$s\ge2$**：\ref{nt:unit-large-at-one-place} で $v\neq v_{k}$ の素点があることに使う（$s=1$ は Step 1 で別に扱う）。
- **選択公理**：デデキント環の定理を通して使う。
:::

::: supplement
**前提を弱めると.** 有限個の素イデアルの集合 $S$ を加えた **$S$ 単数**（$S$ の外では単元）の群は $\mu_{K}\times\mathbb{Z}^{r+|S|}$ と同型である（同じ方法で、$S$ の素イデアルでの付値の座標を加える）。関数体では、単数群は定数体の乗法群と有限生成自由群の積になる（無限遠の点の個数で階数が決まる）。

**似た定理.** 実 2 次体の基本単数は、$\sqrt{d}$ の連分数展開の周期から計算できる（ラグランジュ）。単数定理は「数論的な群 $\mathrm{GL}_{1}(\mathcal{O}_{K})$ が、実リー群 $(\mathbb{R}^{\times})^{r_{1}}\times(\mathbb{C}^{\times})^{r_{2}}$ のノルム 1 部分の中で余コンパクトな格子をなす」ことと言い換えられ、一般の数論的部分群についてのボレル–ハリシュ＝チャンドラの定理の最も簡単な場合である。

**計算の観点.** 基本単数は非常に大きくなりうる（$d=61$ では $x_{1}=1766319049$）。連分数による方法は周期の長さ（おおよそ $\sqrt{d}$ 程度まで）に比例する手間がかかり、大きな判別式ではブーフマンの準指数時間アルゴリズムなどが使われることが知られている。
:::

## 高い視点 {#nt:sec-un-viewpoint}

::: remark 無限素点での「モノドロミー」
単数定理は、$\operatorname{Spec}\mathcal{O}_{K}$ の「大域切断の単元」$H^{0}(\mathcal{O}^{\times})$ が、無限素点の個数 $s$ から 1 を引いた階数をもつことを言う。関数体の類似では、射影曲線から $s$ 個の点を除いたアフィン曲線の単元群（$k^{\times}$ を除く）は、因子の次数 0 という 1 つの制約のもとで $s$ 個の点に支えられた主因子の群で、階数は $s-1$ 以下になる。数論では無限素点が「除いた点」の役割を演じ、ミンコフスキーの定理がその主因子を十分多く作る。比喩で言えば、単数は「どの有限素点にも零点・極をもたない関数」で、対数写像はそれを無限素点での大きさの配分として見る地図であり、配分の総和が 0（積公式）という一本の拘束のもとで、残りの方向はすべて実際に単数で実現できる。
:::

## 問題 {#nt:sec-un-problems}

::: problem {#nt:prob-un-sqrt-three}
$\mathbb{Q}(\sqrt{3})$ の基本単数が $2+\sqrt{3}$ であることを示し、ペル方程式 $x^{2}-3y^{2}=1$ の正の解を 3 つ挙げよ。
:::

::: solution
$\mathcal{O}_{K}=\mathbb{Z}[\sqrt{3}]$。単数 $u=a+b\sqrt{3}>1$ は \ref{nt:quadratic-units-examples} の 2 と同じ議論で $a,b\ge1$、$a^{2}-3b^{2}=\pm1$。$b=1$ で $a^{2}=3\pm1$ から $a=2$（$N=1$）。$a=1$, $b\ge1$ では $1-3b^{2}=\pm1$ は $b=0$ 以外に解がない。よって最小の単数は $2+\sqrt{3}$（$a\ge2$ または $b\ge2$ のものはより大きい）。$-1$ をノルムにもつ単数はない（$a^{2}-3b^{2}\equiv a^{2}\not\equiv-1\pmod3$）ので、正の解は $(2+\sqrt{3})^{m}$：$(2,1)$, $(7,4)$, $(26,15)$。
:::

::: problem {#nt:prob-un-rank}
次の体の単数群の階数を求めよ：$\mathbb{Q}(\sqrt[3]{2})$、$\mathbb{Q}(\zeta_{7})$、$\mathbb{Q}(\sqrt{2},\sqrt{3})$。
:::

::: solution
$\mathbb{Q}(\sqrt[3]{2})$：実埋め込み 1 個（実の立方根）と複素の組 1 個、$r=1+1-1=1$。$\mathbb{Q}(\zeta_{7})$：$r_{1}=0$, $r_{2}=3$、$r=2$。$\mathbb{Q}(\sqrt{2},\sqrt{3})$：4 個の埋め込みはすべて実、$r=4-1=3$。
:::
