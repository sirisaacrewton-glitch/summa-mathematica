# 2 次体・円分体と平方剰余の相互法則 {#nt:page-quadratic-cyclotomic keywords="Legendre symbol, Euler's criterion, splitting of primes in quadratic fields, p = 2 in quadratic fields, Gauss sum, g^2 = p*, quadratic subfield of Q(zeta_p), restriction of Frobenius, quadratic reciprocity law, first and second supplementary laws, (2/p) via Q(zeta_8), sums of two squares, Fermat's theorem on primes p = 1 mod 4, Kronecker-Weber"}

2 次体 $\mathbb{Q}(\sqrt{d})$ での素数 $p$ の分解は、ルジャンドル記号 $(\tfrac{d}{p})$ で決まる。一方、$p$ 次円分体 $\mathbb{Q}(\zeta_{p})$ はガウス和により唯一の 2 次部分体 $\mathbb{Q}(\sqrt{p^{*}})$（$p^{*}=(-1)^{(p-1)/2}p$）を含み、そこでの素数 $q$ の分解はフロベニウス元 $\zeta\mapsto\zeta^{q}$ で決まる。二つの記述を比べると**平方剰余の相互法則**が得られる。

> 用語は雪江『整数論』の用語に合わせた。証明は資料の文章によらず、標準的な議論（フロベニウス元による証明）で書いた。

## 記法と定義の確認 {#nt:sec-qc-notation}

::: notation
- 2 次体・$p$ 次円分体の整数環と判別式は \ref{nt:quadratic-integers}, \ref{nt:cyclotomic-integers}。クンマー–デデキントの定理は \ref{nt:kummer-dedekind}。分解の型は \ref{nt:splitting-types}。フロベニウス元・円分体での分解は \ref{nt:frobenius-element}, \ref{nt:cyclotomic-splitting}。分岐と判別式は \ref{nt:dedekind-discriminant}。
- 有限体の乗法群は巡回群（\ref{fld:finite-multiplicative-cyclic}）。円分体のガロア群 $(\mathbb{Z}/n)^{\times}$ とガロアの基本定理は \ref{fld:cyclotomic-galois}, \ref{fld:fundamental-theorem}。巡回群の部分群は位数ごとにただ一つ（\ref{grp:subgroups-cyclic}）。フェルマーの小定理は \ref{grp:euler-fermat}。
- この頁では $p,q$ は奇素数、$p\neq q$。$p^{*}\defeq(-1)^{(p-1)/2}p$（$p^{*}\equiv1\pmod4$）。
- **選択公理**：デデキント環の定理を通して使う。
:::

## ルジャンドル記号 {#nt:sec-qc-legendre}

::: definition ルジャンドル記号 {#nt:legendre-symbol keywords="Legendre symbol (a/p): 0 if p divides a, 1 if a is a nonzero square mod p, -1 otherwise" index="ルジャンドル記号|るじゃんどるきごう, 平方剰余|へいほうじょうよ"}
整数 $a$ について、$(\tfrac{a}{p})\defeq0$（$p\mid a$）、$1$（$a$ が $\bmod p$ で $0$ でない平方：**平方剰余**）、$-1$（そうでない：**平方非剰余**）とする。
:::

::: proposition オイラーの規準 {#nt:euler-criterion keywords="Euler's criterion a^{(p-1)/2} = (a/p) mod p; the Legendre symbol is multiplicative; (-1/p) = (-1)^{(p-1)/2}; squares form the unique index-two subgroup" index="オイラーの規準|おいらーのきじゅん, 第 1 補充法則|だいいちほじゅうほうそく"}
1. $a^{(p-1)/2}\equiv(\tfrac{a}{p})\pmod p$。
2. $(\tfrac{ab}{p})=(\tfrac{a}{p})(\tfrac{b}{p})$。
3. （第 1 補充法則）$(\tfrac{-1}{p})=(-1)^{(p-1)/2}$。
4. $\mathbb{F}_{p}^{\times}$ の平方全体は、指数 2 のただ一つの部分群。
:::

::: proof
**Step 1（4）.** $\mathbb{F}_{p}^{\times}=\langle c\rangle$ は位数 $p-1$（偶数）の巡回群。平方全体は $\langle c^{2}\rangle$ で位数 $(p-1)/2$、巡回群では指数 2 の部分群はただ一つ。

**Step 2（1）.** $p\mid a$ なら両辺 $0$。そうでなければ $a=c^{k}$ として、$a$ が平方 $\iff k$ が偶数。$c^{(p-1)/2}$ は位数 2 の元で、$t^{2}=1$ の根は $\pm1$ だけなので $c^{(p-1)/2}=-1$。よって $a^{(p-1)/2}=(-1)^{k}$。

**Step 3（2・3）.** 1 の両辺は乗法的で、$\pm1$ は $p$ が奇数なので $\bmod p$ で区別できる。3 は 1 で $a=-1$。
:::

## 2 次体での分解 {#nt:sec-qc-quadratic}

::: theorem 2 次体での素数の分解 {#nt:quadratic-splitting keywords="p odd: split iff (d/p) = 1, inert iff (d/p) = -1, ramified iff p | d; p = 2: d = 1 mod 8 split, d = 5 mod 8 inert, d = 2,3 mod 4 ramified" index="2 次体での素数の分解|にじたいでのそすうのぶんかい"}
（AC）$d\neq0,1$ を平方因子をもたない整数、$K=\mathbb{Q}(\sqrt{d})$ とする。
1. 奇素数 $p$ について：$p\mid d$ なら分岐、$(\tfrac{d}{p})=1$ なら完全分解、$(\tfrac{d}{p})=-1$ なら惰性的。
2. $p=2$ について：$d\equiv2,3\pmod4$ なら分岐、$d\equiv1\pmod8$ なら完全分解、$d\equiv5\pmod8$ なら惰性的。
:::

::: proof
**Step 1（1）.** $\mathbb{Z}[\sqrt{d}]$ の指数は $1$ か $2$（\ref{nt:quadratic-integers}）なので奇素数 $p$ を割り切らず、\ref{nt:kummer-dedekind} が $\theta=\sqrt{d}$, $f=x^{2}-d$ で使える。$\bar{f}=x^{2}-\bar{d}$ は、$p\mid d$ なら $x^{2}$（分岐）、$\bar{d}$ が $0$ でない平方 $b^{2}$ なら $(x-b)(x+b)$（$b\neq-b$、完全分解）、平方でなければ根をもたない 2 次式で既約（惰性的）。

**Step 2（2：$d\equiv2,3$）.** $\mathcal{O}_{K}=\mathbb{Z}[\sqrt{d}]$ で、$\bar{f}=x^{2}-\bar{d}$ は $\mathbb{F}_{2}$ 上 $x^{2}$ か $x^{2}+1=(x+1)^{2}$：分岐。

**Step 3（2：$d\equiv1\pmod4$）.** $\mathcal{O}_{K}=\mathbb{Z}[\omega]$, $\omega=\tfrac{1+\sqrt{d}}{2}$ の最小多項式は $x^{2}-x+\tfrac{1-d}{4}$（指数 1）。$\bmod2$ で $c\defeq\tfrac{1-d}{4}$ が偶数（$d\equiv1\pmod8$）なら $x^{2}-x=x(x-1)$ で完全分解、奇数（$d\equiv5\pmod8$）なら $x^{2}+x+1$ で、$\mathbb{F}_{2}$ に根がない（$0,1$ を代入すると $1$）ので既約、惰性的。
:::

## ガウス和と円分体の 2 次部分体 {#nt:sec-qc-gauss}

::: proposition ガウス和 {#nt:gauss-sum keywords="quadratic Gauss sum g = sum (a/p) zeta^a satisfies g^2 = p*; Q(sqrt(p*)) is the unique quadratic subfield of Q(zeta_p)" index="ガウス和|がうすわ"}
$\zeta=\zeta_{p}$ とし、$g\defeq\sum_{a=1}^{p-1}(\tfrac{a}{p})\zeta^{a}$（**ガウス和**）とする。
1. $g^{2}=p^{*}$。
2. $\mathbb{Q}(\sqrt{p^{*}})$ は $\mathbb{Q}(\zeta_{p})$ のただ一つの 2 次部分体で、$\operatorname{Gal}(\mathbb{Q}(\zeta_{p})/\mathbb{Q}(\sqrt{p^{*}}))$ は \ref{fld:cyclotomic-galois} の同型で平方剰余の群 $(\mathbb{F}_{p}^{\times})^{2}$ に対応する。
:::

::: proof
**Step 1（$g^{2}$ の展開）.** $g^{2}=\sum_{a,b}(\tfrac{ab}{p})\zeta^{a+b}$（\ref{nt:euler-criterion} の 2）。$b=ac$（$c$ は $1,\dots,p-1$ を動く）と置き換えると $(\tfrac{a\cdot ac}{p})=(\tfrac{c}{p})$ なので
$$
g^{2}=\sum_{c=1}^{p-1}\Bigl(\frac{c}{p}\Bigr)\sum_{a=1}^{p-1}\zeta^{a(1+c)}.
$$

**Step 2（内側の和）.** $1+c\not\equiv0$ なら $a\mapsto a(1+c)$ は $\mathbb{F}_{p}^{\times}$ の全単射で、$\sum_{a=1}^{p-1}\zeta^{a(1+c)}=\sum_{b=1}^{p-1}\zeta^{b}=-1$（$\Phi_{p}(\zeta)=0$）。$c=p-1$（$1+c\equiv0$）なら和は $p-1$。

**Step 3（1）.** $g^{2}=(\tfrac{-1}{p})(p-1)-\sum_{c\neq p-1}(\tfrac{c}{p})=(\tfrac{-1}{p})p-\sum_{c=1}^{p-1}(\tfrac{c}{p})$。平方剰余と非剰余は同数（\ref{nt:euler-criterion} の 4）なので最後の和は $0$、$g^{2}=(\tfrac{-1}{p})p=p^{*}$（第 1 補充法則）。

**Step 4（2）.** $g\in\mathbb{Q}(\zeta)$ なので $\mathbb{Q}(\sqrt{p^{*}})\subset\mathbb{Q}(\zeta)$ で、$p^{*}$ は平方でないので 2 次。$(\mathbb{Z}/p)^{\times}$ は巡回群なので指数 2 の部分群はただ一つ（平方の群、\ref{nt:euler-criterion} の 4）で、ガロアの基本定理から 2 次部分体はただ一つ。
:::

## 平方剰余の相互法則 {#nt:sec-qc-reciprocity}

::: lemma フロベニウス元の制限 {#nt:frobenius-restriction keywords="for Galois number fields K subset L and an unramified prime, the restriction of Frob to K is Frob in K" index="フロベニウス元の制限|ふろべにうすげんのせいげん"}
（AC）ガロアな代数体 $F\subset L$ と、$L$ で不分岐な素数 $q$、$\mathfrak{Q}\mid q$（$L$ の素イデアル）、$\mathfrak{q}\defeq\mathfrak{Q}\cap\mathcal{O}_{F}$ について、$\operatorname{Frob}_{\mathfrak{Q}}|_{F}=\operatorname{Frob}_{\mathfrak{q}}$。
:::

::: proof
$\sigma\defeq\operatorname{Frob}_{\mathfrak{Q}}$ は $\sigma(x)\equiv x^{q}\pmod{\mathfrak{Q}}$（$x\in\mathcal{O}_{L}$）をみたす。$F/\mathbb{Q}$ はガロアなので $\sigma(F)=F$ で、$x\in\mathcal{O}_{F}$ について $\sigma(x)-x^{q}\in\mathfrak{Q}\cap\mathcal{O}_{F}=\mathfrak{q}$。$q$ は $F$ でも不分岐（$\mathfrak{q}^{2}\mid q\mathcal{O}_{F}$ なら、$\mathcal{O}_{L}$ に拡大して $\mathfrak{q}^{2}\mathcal{O}_{L}\mid q\mathcal{O}_{L}$、$\mathfrak{Q}\mid\mathfrak{q}\mathcal{O}_{L}$ なので $\mathfrak{Q}^{2}\mid q\mathcal{O}_{L}$ となり、$L$ での不分岐に反する）なので、\ref{nt:frobenius-element} の一意性から $\sigma|_{F}=\operatorname{Frob}_{\mathfrak{q}}$。
:::

::: theorem 平方剰余の相互法則 {#nt:quadratic-reciprocity keywords="quadratic reciprocity (p/q)(q/p) = (-1)^{(p-1)/2 (q-1)/2}; proof via Frobenius in Q(zeta_p)" index="平方剰余の相互法則|へいほうじょうよのそうごほうそく"}
（AC）相異なる奇素数 $p,q$ について
$$
\Bigl(\frac{p}{q}\Bigr)\Bigl(\frac{q}{p}\Bigr)=(-1)^{\frac{p-1}{2}\cdot\frac{q-1}{2}}.
$$
:::

::: proof
**Step 1（$\mathbb{Q}(\zeta_{p})$ での $q$）.** $q\neq p$ は $L\defeq\mathbb{Q}(\zeta_{p})$ で不分岐で、$\operatorname{Frob}_{q}=\sigma_{q}$（\ref{nt:cyclotomic-splitting}）。

**Step 2（$F=\mathbb{Q}(\sqrt{p^{*}})$ に制限）.** \ref{nt:frobenius-restriction} から $\operatorname{Frob}_{q}(F)=\sigma_{q}|_{F}$。$\sigma_{q}|_{F}=1\iff\sigma_{q}\in\operatorname{Gal}(L/F)\iff q\bmod p$ が平方剰余（\ref{nt:gauss-sum} の 2）$\iff(\tfrac{q}{p})=1$。

**Step 3（$F$ での $q$ の分解）.** $F$ は 2 次体（$p^{*}$ は平方因子をもたない）で $q\nmid p^{*}$。$q$ が $F$ で完全分解 $\iff f=1\iff\operatorname{Frob}_{q}(F)=1$。\ref{nt:quadratic-splitting} の 1 から、これは $(\tfrac{p^{*}}{q})=1$ と同値。

**Step 4（結論）.** Step 2・3 から $(\tfrac{q}{p})=(\tfrac{p^{*}}{q})$（どちらも $\pm1$ で、$1$ になる条件が同じ）。\ref{nt:euler-criterion} の 2・3 から $(\tfrac{p^{*}}{q})=(\tfrac{-1}{q})^{(p-1)/2}(\tfrac{p}{q})=(-1)^{\frac{q-1}{2}\cdot\frac{p-1}{2}}(\tfrac{p}{q})$。両辺に $(\tfrac{p}{q})$ を掛けて（$(\tfrac{p}{q})^{2}=1$）結論。
:::

::: theorem 第 2 補充法則 {#nt:second-supplementary keywords="(2/p) = (-1)^{(p^2-1)/8}; proof via Q(zeta_8) and sqrt 2 = zeta_8 + zeta_8^{-1}" index="第 2 補充法則|だいにほじゅうほうそく"}
（AC）奇素数 $p$ について $(\tfrac{2}{p})=(-1)^{(p^{2}-1)/8}$、すなわち $(\tfrac{2}{p})=1\iff p\equiv\pm1\pmod8$。
:::

::: proof
**Step 1（$\sqrt{2}\in\mathbb{Q}(\zeta_{8})$）.** $\zeta\defeq\zeta_{8}=e^{2\pi\sqrt{-1}/8}$ について $(\zeta+\zeta^{-1})^{2}=\zeta^{2}+2+\zeta^{-2}=\sqrt{-1}+2-\sqrt{-1}=2$。よって $F\defeq\mathbb{Q}(\sqrt{2})\subset L\defeq\mathbb{Q}(\zeta_{8})$。

**Step 2（フロベニウス）.** $p$ は $L$ で不分岐で $\operatorname{Frob}_{p}=\sigma_{p}$（\ref{nt:cyclotomic-splitting}）。$\sigma_{p}(\zeta+\zeta^{-1})=\zeta^{p}+\zeta^{-p}$ は、$p\equiv\pm1\pmod8$ なら $\zeta+\zeta^{-1}$、$p\equiv\pm3$ なら $\zeta^{3}+\zeta^{-3}=-(\zeta+\zeta^{-1})$（$\zeta^{4}=-1$ から $\zeta^{3}=-\zeta^{-1}$）。よって \ref{nt:frobenius-restriction} から $\operatorname{Frob}_{p}(F)=1\iff p\equiv\pm1\pmod8$。

**Step 3（結論）.** $F=\mathbb{Q}(\sqrt{2})$ で $p$ が完全分解 $\iff(\tfrac{2}{p})=1$（\ref{nt:quadratic-splitting} の 1）$\iff\operatorname{Frob}_{p}(F)=1$。$(p^{2}-1)/8$ が偶数 $\iff p\equiv\pm1\pmod8$ も直接確かめられる（$p=8k\pm1$ なら $(p^{2}-1)/8=8k^{2}\pm2k$、$p=8k\pm3$ なら $8k^{2}\pm6k+1$）。
:::

::: example 2 平方和 {#nt:two-squares}
奇素数 $p$ が $p=a^{2}+b^{2}$（$a,b\in\mathbb{Z}$）と書ける $\iff p\equiv1\pmod4$（フェルマー）。⇒：平方は $\bmod4$ で $0,1$ なので $a^{2}+b^{2}\not\equiv3$。⇐：第 1 補充法則から $(\tfrac{-1}{p})=1$ で、\ref{nt:quadratic-splitting} から $p$ は $\mathbb{Q}(i)$ で完全分解、$p\mathbb{Z}[i]=\mathfrak{P}\bar{\mathfrak{P}}$, $N(\mathfrak{P})=p$。$\mathbb{Z}[i]$ はユークリッド環なので PID（\ref{ring:euclidean-examples} の 3, \ref{ring:euclidean-pid}）、$\mathfrak{P}=(a+bi)$ で、$a^{2}+b^{2}=N(a+bi)=N(\mathfrak{P})=p$（\ref{nt:ideal-norm-multiplicative}）。
:::

::: remark ガウスの「黄金定理」とクロネッカー–ウェーバーの定理
1. 平方剰余の相互法則はオイラーとルジャンドルが予想し、ガウスが初めて完全な証明を与え（1796 年頃、『整数論研究』1801 年）、生涯に複数の証明を残したことが一般に知られている。上の証明は「円分体の 2 次部分体」と「フロベニウス元」を使うもので、ガウス和による証明を代数的整数論の言葉で整理したものである。
2. 上の議論は、$\mathbb{Q}(\sqrt{p^{*}})$ が円分体に含まれることに依存している。**クロネッカー–ウェーバーの定理**：$\mathbb{Q}$ の有限次アーベル拡大はすべてある円分体 $\mathbb{Q}(\zeta_{n})$ に含まれることが知られている（本サイト未収録）。したがってアーベル拡大での素数の分解は、$p\bmod n$ という「合同条件」で記述できる。これを一般の代数体に拡げたものが類体論である。
:::

::: hypcheck
- **$p,q$ が奇素数で異なること**：\ref{nt:quadratic-reciprocity} で、$q$ が $\mathbb{Q}(\zeta_{p})$ で不分岐であること（$q\neq p$）と、\ref{nt:quadratic-splitting} の 1 を $q$ について使うこと（$q$ 奇数）に使う。$q=2$ は第 2 補充法則で別に扱う。
- **$p^{*}$ の符号**：\ref{nt:gauss-sum} の 1 で、$g^{2}$ は $p$ ではなく $p^{*}$。$\mathbb{Q}(\sqrt{p})$ は $p\equiv3\pmod4$ のとき円分体 $\mathbb{Q}(\zeta_{p})$ に含まれない（2 次部分体はただ一つで $\mathbb{Q}(\sqrt{-p})$）。
- **ガロア性**：\ref{nt:frobenius-restriction} で $\sigma(F)=F$ に使う。
- **選択公理**：デデキント環の定理を通して使う。
:::

::: supplement
**前提を弱めると.** ヤコビ記号（合成数の法への拡張）でも相互法則が成り立ち、ルジャンドル記号の計算を素因数分解なしに行える（ユークリッドの互除法と同じ手間）。これは素数判定（ソロベイ–シュトラッセン法）にも使われる。

**似た定理.** 3 乗・4 乗剰余の相互法則（アイゼンシュタイン・ガウス）は $\mathbb{Z}[\zeta_{3}]$, $\mathbb{Z}[i]$ の中で述べられ、一般には**アルティンの相互法則**（類体論）にまとめられる。関数体 $\mathbb{F}_{q}[t]$ でも同じ形の相互法則が成り立つ。

**計算の観点.** $(\tfrac{a}{p})$ は、オイラーの規準による冪乗（$O(\log p)$ 回の掛け算）か、相互法則とヤコビ記号による互除法で計算できる。2 次体での素数の分解（\ref{nt:quadratic-splitting}）はこれだけで決まる。
:::

## 高い視点 {#nt:sec-qc-viewpoint}

::: remark 二つの「地図」の比較としての相互法則
$q$ の $\mathbb{Q}(\sqrt{p^{*}})$ での分解には二つの記述がある：(a) 2 次体の側では、方程式 $x^{2}=p^{*}$ が $\bmod q$ で解けるか、すなわち $(\tfrac{p^{*}}{q})$；(b) 円分体の側では、フロベニウス元 $\sigma_{q}$ が 2 次部分体を固定するか、すなわち $q\bmod p$ が平方か、$(\tfrac{q}{p})$。(a) は「$q$ を法とする」条件、(b) は「$p$ を法とする」条件で、その一致が相互法則である。圏論的には、アーベル拡大の圏と「合同条件で定まる素数の集合（イデアル類群の指標）」の圏の対応（類体論）の最も簡単な場合で、ガロア群の側の「局所的な情報（フロベニウス）」が「大域的な合同条件」と結びつくことを表す。比喩で言えば、同じ山（$q$ の分解）を北（$\bmod q$）から見た地図と南（$\bmod p$）から見た地図が、必ず同じ形をしていることの保証である。
:::

## 問題 {#nt:sec-qc-problems}

::: problem {#nt:prob-qc-three}
$(\tfrac{3}{p})=1$ となる奇素数 $p\neq3$ を $p\bmod12$ で特徴づけよ。
:::

::: solution
相互法則から $(\tfrac{3}{p})=(-1)^{(p-1)/2}(\tfrac{p}{3})$。$(\tfrac{p}{3})=1\iff p\equiv1\pmod3$。$(-1)^{(p-1)/2}=1\iff p\equiv1\pmod4$。よって $(\tfrac{3}{p})=1\iff$（$p\equiv1\pmod4$ かつ $p\equiv1\pmod3$）または（$p\equiv3\pmod4$ かつ $p\equiv2\pmod3$）$\iff p\equiv\pm1\pmod{12}$。
:::

::: problem {#nt:prob-qc-sqrt-five}
$\mathbb{Q}(\sqrt{5})$ で素数 $p\neq2,5$ が完全分解する条件を $p\bmod5$ で書け。また $\mathbb{Q}(\sqrt{5})\subset\mathbb{Q}(\zeta_{5})$ を確かめよ。
:::

::: solution
\ref{nt:quadratic-splitting} から完全分解 $\iff(\tfrac{5}{p})=1$。相互法則で $(\tfrac{5}{p})=(\tfrac{p}{5})$（$(5-1)/2=2$ は偶数）、$(\tfrac{p}{5})=1\iff p\equiv\pm1\pmod5$。$5^{*}=5$（$5\equiv1\pmod4$）なので \ref{nt:gauss-sum} から $\sqrt{5}=\pm(\zeta-\zeta^{2}-\zeta^{3}+\zeta^{4})\in\mathbb{Q}(\zeta_{5})$（平方剰余は $1,4$）。$p=2$：$5\equiv5\pmod8$ なので惰性的。
:::
