# 素イデアルの分解 {#nt:page-prime-decomposition keywords="ring of integers is a Dedekind domain, ideal norm, norm is multiplicative, norm of a principal ideal is the absolute value of the field norm, decomposition of pO_K, ramification index, residue degree, sum e_i f_i = n, ramified, inert, split completely, totally ramified, Kummer-Dedekind theorem, factorization of polynomial mod p, Q(cube root of 2), Dedekind's non-monogenic cubic field"}

整数環 $\mathcal{O}_{K}$ はデデキント環なので、$0$ でないイデアルは素イデアルの積に一意に分解する。素数 $p$ について $p\mathcal{O}_{K}=\mathfrak{P}_{1}^{e_{1}}\cdots\mathfrak{P}_{g}^{e_{g}}$ と書き、**分岐指数** $e_{i}$ と**相対次数** $f_{i}=[\mathcal{O}_{K}/\mathfrak{P}_{i}:\mathbb{F}_{p}]$ を定めると、$\sum e_{i}f_{i}=[K:\mathbb{Q}]$ が成り立つ。$p$ が指数 $[\mathcal{O}_{K}:\mathbb{Z}[\theta]]$ を割り切らなければ、分解は $\theta$ の最小多項式を $\bmod p$ で因数分解するだけで分かる（**クンマー–デデキントの定理**）。

> 用語は雪江『整数論 1』の用語（分岐指数・相対次数・完全分解・不分岐）に合わせた。証明は資料の文章によらず、標準的な議論で書いた。

## 記法と定義の確認 {#nt:sec-pd-notation}

::: notation
- 代数体・整数環・判別式・指数は \ref{nt:number-field}, \ref{nt:integers-basic}, \ref{nt:integral-basis}。
- デデキント環とイデアルの素イデアル分解・「含むは割る」・局所化は DVR は \ref{ring:dedekind}, \ref{ring:dedekind-factorization}, \ref{ring:dedekind-ideal-arithmetic}, \ref{ring:dedekind-local}。整拡大と次元・横たわり定理は \ref{ring:integral-dimension}, \tref{ring:lying-over}。中国剰余定理は \tref{ring:chinese-remainder}。
- 有限体 $\mathbb{F}_{p}$ と有限整域は体であること（有限整域では $x\mapsto ax$ が単射なので全射）。多項式環 $\mathbb{F}_{p}[x]$ は PID で一意分解。
- スキームの言葉（$\operatorname{Spec}\mathcal{O}_{K}\to\operatorname{Spec}\mathbb{Z}$ のファイバー）は \ref{ag:affine-fiber}, \ref{ag:fibers-gaussian}。
- **選択公理**：\ref{ring:dedekind-factorization} と \ref{ring:dedekind-local} を通して使う（$\mathcal{O}_{K}$ はネーターなので、極大イデアルの存在などは AC なしにも示せるが、ここでは引用する定理の形に合わせる）。
:::

## 整数環はデデキント環 {#nt:sec-pd-dedekind}

::: theorem 整数環はデデキント環 {#nt:integers-dedekind keywords="O_K is a Dedekind domain; nonzero ideals have finite index; every nonzero prime lies over a unique rational prime" index="整数環はデデキント環|せいすうかんはでできんとかん"}
（AC）
1. $\mathcal{O}_{K}$ はデデキント環。
2. $0$ でないイデアル $\mathfrak{a}$ について $\mathcal{O}_{K}/\mathfrak{a}$ は有限。
3. $0$ でない素イデアル $\mathfrak{P}$ について $\mathfrak{P}\cap\mathbb{Z}=p\mathbb{Z}$（$p$ は素数）で、$\mathcal{O}_{K}/\mathfrak{P}$ は $\mathbb{F}_{p}$ の有限次拡大体。このとき $\mathfrak{P}$ は $p$ の**上にある**といい、$\mathfrak{P}\mid p$ と書く。
:::

::: proof
**Step 1（ネーター）.** $\mathcal{O}_{K}\cong\mathbb{Z}^{n}$（\ref{nt:integral-basis}）なので、イデアルは $\mathbb{Z}$ 部分加群として有限生成（\ref{mod:pid-submodule-free}）、とくにイデアルとして有限生成。

**Step 2（正規）.** $\mathcal{O}_{K}$ は $\mathbb{Z}$ の $K$ における整閉包で、整閉包の推移律（\ref{ring:integral-closure}）から $K$ の元で $\mathcal{O}_{K}$ 上整なものは $\mathbb{Z}$ 上整、すなわち $\mathcal{O}_{K}$ に入る。$\operatorname{Frac}\mathcal{O}_{K}=K$（\ref{nt:integers-basic.2}）。

**Step 3（2）.** $0\neq\alpha\in\mathfrak{a}$ をとり、最小多項式を $x^{r}+c_{r-1}x^{r-1}+\dots+c_{0}$（$c_{i}\in\mathbb{Z}$：\ref{nt:integers-basic.3}）とする。既約で $\alpha\neq0$ なので $c_{0}\neq0$、$c_{0}=-\alpha(\alpha^{r-1}+\dots+c_{1})\in\alpha\mathcal{O}_{K}\subset\mathfrak{a}$。$m\defeq c_{0}$ とおくと、$\mathcal{O}_{K}/\mathfrak{a}$ は $\mathcal{O}_{K}/m\mathcal{O}_{K}\cong(\mathbb{Z}/m)^{n}$ の商なので有限。

**Step 4（次元 1 と 3）.** $\mathfrak{P}\neq0$ が素なら、$\mathcal{O}_{K}/\mathfrak{P}$ は有限（2）な整域なので体、$\mathfrak{P}$ は極大。$\mathfrak{P}\cap\mathbb{Z}$ は $\mathbb{Z}$ の素イデアルで、Step 3 から $0$ でない整数を含むので $p\mathbb{Z}$。$\mathcal{O}_{K}/\mathfrak{P}$ は $\mathbb{Z}/p$ を含む有限体。
:::

## イデアルのノルム {#nt:sec-pd-norm}

::: definition イデアルのノルム {#nt:ideal-norm keywords="absolute norm of an ideal N(a) = |O_K / a|" index="イデアルのノルム|いであるののるむ"}
$0$ でないイデアル $\mathfrak{a}$ について $N(\mathfrak{a})\defeq|\mathcal{O}_{K}/\mathfrak{a}|$ とする。素イデアル $\mathfrak{P}\mid p$ について $f(\mathfrak{P})\defeq[\mathcal{O}_{K}/\mathfrak{P}:\mathbb{F}_{p}]$ を**相対次数**といい、$N(\mathfrak{P})=p^{f(\mathfrak{P})}$。
:::

::: proposition ノルムの乗法性 {#nt:ideal-norm-multiplicative keywords="N(ab) = N(a)N(b); N(alpha O_K) = |N_{K/Q}(alpha)|" index="ノルムの乗法性|のるむのじょうほうせい"}
（AC）
1. $N(\mathfrak{a}\mathfrak{b})=N(\mathfrak{a})N(\mathfrak{b})$。
2. $\alpha\in\mathcal{O}_{K}\setminus0$ について $N(\alpha\mathcal{O}_{K})=|N_{K/\mathbb{Q}}(\alpha)|$。
:::

::: proof
**Step 1（素イデアルの冪）.** 素イデアル $\mathfrak{P}$ と $i\ge0$ について $\mathfrak{P}^{i}/\mathfrak{P}^{i+1}$ は $\mathcal{O}_{K}/\mathfrak{P}$ 上の 1 次元のベクトル空間であることを示す。一意分解から $\mathfrak{P}^{i}\neq\mathfrak{P}^{i+1}$ なので $\pi\in\mathfrak{P}^{i}\setminus\mathfrak{P}^{i+1}$ をとる。$I\defeq\pi\mathcal{O}_{K}+\mathfrak{P}^{i+1}$ は $\mathfrak{P}^{i+1}\subset I\subset\mathfrak{P}^{i}$ をみたし、含むは割る（\ref{ring:dedekind-ideal-arithmetic}）から $I$ は $\mathfrak{P}^{i+1}$ の約数 $\mathfrak{P}^{j}$（$j\le i+1$）で、$I\subset\mathfrak{P}^{i}$ から $j\ge i$、$\pi\in I\setminus\mathfrak{P}^{i+1}$ から $j=i$。よって $\mathfrak{P}^{i}/\mathfrak{P}^{i+1}$ は $\pi$ の像で生成される $0$ でない $\mathcal{O}_{K}/\mathfrak{P}$ 加群で、1 次元。したがって $|\mathcal{O}_{K}/\mathfrak{P}^{e}|=\prod_{i<e}|\mathfrak{P}^{i}/\mathfrak{P}^{i+1}|=N(\mathfrak{P})^{e}$。

**Step 2（1）.** $\mathfrak{a}=\prod\mathfrak{P}_{i}^{a_{i}}$（\ref{ring:dedekind-factorization}）とすると、異なる極大イデアルの冪は互いに素なので、中国剰余定理から $\mathcal{O}_{K}/\mathfrak{a}\cong\prod\mathcal{O}_{K}/\mathfrak{P}_{i}^{a_{i}}$、$N(\mathfrak{a})=\prod N(\mathfrak{P}_{i})^{a_{i}}$（Step 1）。これは指数について加法的なので乗法的。

**Step 3（2）.** 整数環の基底 $\omega_{1},\dots,\omega_{n}$ について、$\alpha\omega_{1},\dots,\alpha\omega_{n}$ は $\alpha\mathcal{O}_{K}$ の基底で、基底変換の行列は掛け算写像 $m_{\alpha}$ の行列 $P$。\ref{nt:integral-basis} の Step 3 から $[\mathcal{O}_{K}:\alpha\mathcal{O}_{K}]=|\det P|=|N_{K/\mathbb{Q}}(\alpha)|$（\ref{ring:trace-norm}：ノルムは $m_{\alpha}$ の行列式）。
:::

## $p$ の分解と $\sum e_{i}f_{i}=n$ {#nt:sec-pd-efg}

::: theorem 基本等式 {#nt:fundamental-identity keywords="pO_K = prod P_i^{e_i}, ramification index e_i, residue degree f_i, sum e_i f_i = n" index="分岐指数|ぶんきしすう, 相対次数|そうたいじすう, 基本等式|きほんとうしき"}
（AC）素数 $p$ について $p\mathcal{O}_{K}=\mathfrak{P}_{1}^{e_{1}}\cdots\mathfrak{P}_{g}^{e_{g}}$（$\mathfrak{P}_{i}$ は相異なる素イデアル、$e_{i}\ge1$）と分解する。
1. $p$ の上にある素イデアルはちょうど $\mathfrak{P}_{1},\dots,\mathfrak{P}_{g}$。
2. $f_{i}\defeq f(\mathfrak{P}_{i})$ とすると $\sum_{i=1}^{g}e_{i}f_{i}=n=[K:\mathbb{Q}]$。
$e_{i}$ を**分岐指数**という。
:::

::: proof
**Step 1（1）.** $\mathfrak{P}\mid p$ $\iff$ $\mathfrak{P}\supset p\mathcal{O}_{K}$ $\iff$（含むは割る：\ref{ring:dedekind-ideal-arithmetic}）$\mathfrak{P}$ が $p\mathcal{O}_{K}$ の分解に現れる。

**Step 2（2）.** $N(p\mathcal{O}_{K})=|\mathcal{O}_{K}/p\mathcal{O}_{K}|=|(\mathbb{Z}/p)^{n}|=p^{n}$。一方 \ref{nt:ideal-norm-multiplicative} から $N(p\mathcal{O}_{K})=\prod N(\mathfrak{P}_{i})^{e_{i}}=p^{\sum e_{i}f_{i}}$。
:::

::: definition 分岐と分解の型 {#nt:splitting-types keywords="ramified, unramified, split completely, inert, totally ramified" index="分岐|ぶんき, 不分岐|ふぶんき, 完全分解|かんぜんぶんかい, 惰性|だせい, 完全分岐|かんぜんぶんき"}
上の記法で、ある $e_{i}>1$ のとき $p$ は $K$ で**分岐する**といい、すべての $e_{i}=1$ なら**不分岐**という。$g=n$（すべての $e_{i}=f_{i}=1$）なら**完全分解**、$g=1$, $e_{1}=1$（$f_{1}=n$）なら**惰性的**（$p\mathcal{O}_{K}$ は素イデアル）、$g=1$, $e_{1}=n$ なら**完全分岐**という。
:::

## クンマー–デデキントの定理 {#nt:sec-pd-kummer-dedekind}

::: theorem クンマー–デデキントの定理 {#nt:kummer-dedekind keywords="if p does not divide the index [O_K : Z[theta]] and f = prod g_i^{e_i refname="クンマー–デデキントの定理"} mod p, then pO_K = prod (p, g_i(theta))^{e_i} with residue degrees deg g_i" index="クンマー–デデキントの定理|くんまーでできんとのていり"}
（AC）$K=\mathbb{Q}(\theta)$, $\theta\in\mathcal{O}_{K}$、$f\in\mathbb{Z}[x]$ を $\theta$ の最小多項式とし、素数 $p$ が指数 $[\mathcal{O}_{K}:\mathbb{Z}[\theta]]$ を割り切らないとする。$\bar{f}=\bar{g}_{1}^{e_{1}}\cdots\bar{g}_{r}^{e_{r}}$ を $\mathbb{F}_{p}[x]$ での相異なるモニック既約多項式への分解とし、$g_{i}\in\mathbb{Z}[x]$ を $\bar{g}_{i}$ のモニックな持ち上げとする。このとき $\mathfrak{P}_{i}\defeq(p,g_{i}(\theta))$ は相異なる素イデアルで
$$
p\mathcal{O}_{K}=\mathfrak{P}_{1}^{e_{1}}\cdots\mathfrak{P}_{r}^{e_{r}},\qquad f(\mathfrak{P}_{i})=\deg\bar{g}_{i}.
$$
:::

::: proof
**Step 1（$\mathcal{O}_{K}/p\mathcal{O}_{K}\cong\mathbb{Z}[\theta]/p\mathbb{Z}[\theta]$）.** $m\defeq[\mathcal{O}_{K}:\mathbb{Z}[\theta]]$ とすると $m\mathcal{O}_{K}\subset\mathbb{Z}[\theta]$（ラグランジュ）、$p\nmid m$ なので $1=am+bp$（$a,b\in\mathbb{Z}$）。包含 $\mathbb{Z}[\theta]\to\mathcal{O}_{K}/p\mathcal{O}_{K}$ は全射：$x\in\mathcal{O}_{K}$ について $x=a(mx)+p(bx)$, $mx\in\mathbb{Z}[\theta]$。核は $\mathbb{Z}[\theta]\cap p\mathcal{O}_{K}=p\mathbb{Z}[\theta]$：$y=pz$（$z\in\mathcal{O}_{K}$）なら $mz\in\mathbb{Z}[\theta]$ で、$y=amy+bpy=p(a\,mz)+p(by)\in p\mathbb{Z}[\theta]$。

**Step 2（剰余環の構造）.** $\mathbb{Z}[\theta]\cong\mathbb{Z}[x]/(f)$（$f$ は最小多項式でモニック）なので $\mathbb{Z}[\theta]/p\cong\mathbb{F}_{p}[x]/(\bar{f})$。中国剰余定理（$\bar{g}_{i}^{e_{i}}$ はどの二つも互いに素）から
$$
\mathcal{O}_{K}/p\mathcal{O}_{K}\cong\mathbb{F}_{p}[x]/(\bar{f})\cong\prod_{i}\mathbb{F}_{p}[x]/(\bar{g}_{i}^{e_{i}}).
$$

**Step 3（素イデアル）.** $\mathcal{O}_{K}/p\mathcal{O}_{K}$ の極大イデアルは $(\bar{g}_{i})$（$\mathbb{F}_{p}[x]$ の $\bar{f}$ を含む極大イデアル）に対応し、その $\mathcal{O}_{K}$ での逆像は Step 1 の同型のもとで $(p,g_{i}(\theta))=\mathfrak{P}_{i}$。$p$ の上の素イデアルは $\mathcal{O}_{K}/p$ の極大イデアルと一対一なので、$\mathfrak{P}_{1},\dots,\mathfrak{P}_{r}$ がちょうど $p$ の上の素イデアルで、相異なり、$\mathcal{O}_{K}/\mathfrak{P}_{i}\cong\mathbb{F}_{p}[x]/(\bar{g}_{i})$、$f(\mathfrak{P}_{i})=\deg\bar{g}_{i}$。

**Step 4（指数の上界）.** $\prod_{i}\mathfrak{P}_{i}^{e_{i}}\subset p\mathcal{O}_{K}+\prod_{i}g_{i}(\theta)^{e_{i}}\mathcal{O}_{K}$（積を展開すると、$p$ を因子に含まない項は $\prod g_{i}(\theta)^{e_{i}}$ の倍）で、$\prod g_{i}^{e_{i}}\equiv f\pmod p$ なので $\prod g_{i}(\theta)^{e_{i}}\in f(\theta)+p\mathbb{Z}[\theta]=p\mathbb{Z}[\theta]$。よって $\prod\mathfrak{P}_{i}^{e_{i}}\subset p\mathcal{O}_{K}$。$p\mathcal{O}_{K}=\prod\mathfrak{P}_{i}^{a_{i}}$（\ref{nt:fundamental-identity} と Step 3）と書くと、含むは割るから $a_{i}\le e_{i}$。

**Step 5（等号）.** \ref{nt:fundamental-identity} から $n=\sum a_{i}\deg\bar{g}_{i}\le\sum e_{i}\deg\bar{g}_{i}=\deg\bar{f}=n$。よってすべての $a_{i}=e_{i}$。
:::

::: corollary 分岐する素数は有限個 {#nt:finitely-many-ramified keywords="if p does not divide the discriminant of the minimal polynomial then p is unramified; finitely many primes ramify" index="分岐する素数の有限性|ぶんきするそすうのゆうげんせい"}
（AC）$K=\mathbb{Q}(\theta)$, $\theta\in\mathcal{O}_{K}$, $f$ を最小多項式とする。$p\nmid D(f)$ なら $p$ は $K$ で不分岐。とくに分岐する素数は有限個。
:::

::: proof
$D(f)=[\mathcal{O}_{K}:\mathbb{Z}[\theta]]^{2}d_{K}$（\ref{nt:integral-basis.3}、\ref{nt:discriminant-basis-properties.4}）なので $p\nmid D(f)$ なら $p$ は指数を割り切らない。また $\bar{f}$ の判別式 $\overline{D(f)}\neq0$ なので $\bar{f}$ は $\mathbb{F}_{p}$ 上重根をもたず（\ref{fld:discriminant-properties.2}）、既約因子はすべて 1 乗。\ref{nt:kummer-dedekind} からすべての $e_{i}=1$。（逆向き「分岐する $\iff p\mid d_{K}$」は \ref{nt:page-ramification-discriminant} で示す。）
:::

## 例 {#nt:sec-pd-examples}

::: example ガウス整数 {#nt:gaussian-decomposition}
$K=\mathbb{Q}(i)$, $\mathcal{O}_{K}=\mathbb{Z}[i]$（指数 1）, $f=x^{2}+1$。\ref{nt:kummer-dedekind} から：$p=2$ で $\bar{f}=(x+1)^{2}$、$2\mathbb{Z}[i]=(1+i)^{2}$（$(2,1+i)=(1+i)$：$2=-i(1+i)^{2}$）、完全分岐。$p\equiv1\pmod4$ で $\bar{f}=(x-c)(x+c)$、完全分解 $p\mathbb{Z}[i]=(p,i-c)(p,i+c)$。$p\equiv3\pmod4$ で $\bar{f}$ は既約、惰性的。これは \ref{ag:fibers-gaussian} で見た $\operatorname{Spec}\mathbb{Z}[i]\to\operatorname{Spec}\mathbb{Z}$ のファイバーの形そのものである。
:::

::: example $\mathbb{Q}(\sqrt[3]{2})$ の素数の分解 {#nt:cube-root-two-decomposition}
$\mathcal{O}_{K}=\mathbb{Z}[\theta]$, $\theta^{3}=2$（\ref{nt:cube-root-two}、指数 1）。
1. $p=2$：$\bar{f}=x^{3}$、$2\mathcal{O}_{K}=(\theta)^{3}$（$(2,\theta)=(\theta)$）、完全分岐。
2. $p=3$：$x^{3}-2\equiv x^{3}+1=(x+1)^{3}\pmod3$、$3\mathcal{O}_{K}=(3,\theta+1)^{3}$、完全分岐。
3. $p=5$：$3^{3}=27\equiv2$ なので $\bar{f}=(x-3)(x^{2}+3x+4)$。後者の判別式 $9-16=-7\equiv3$ は $\bmod5$ の平方（$0,1,4$）でないので既約。$5\mathcal{O}_{K}=\mathfrak{P}_{1}\mathfrak{P}_{2}$, $f_{1}=1$, $f_{2}=2$。
4. $p=7$：$\bmod7$ の立方は $0,\pm1$ なので $2$ は立方でなく、3 次の $\bar{f}$ は根をもたないので既約。$7$ は惰性的。
5. $p=31$：$4^{3}=64\equiv2$ で、$31\equiv1\pmod3$ なので $\mathbb{F}_{31}$ には 1 の原始 3 乗根があり、$\bar{f}$ は 3 つの 1 次式に分解する。完全分解。
:::

::: remark 指数を割り切る素数とデデキントの例
$p$ が指数を割り切ると \tref{nt:kummer-dedekind} は使えない。デデキントの 3 次体（$x^{3}-x^{2}-2x-8$ の根で生成）では、$2$ が完全分解する（相対次数 1 の素イデアルが 3 つ）ことが知られている。もし $\mathcal{O}_{K}=\mathbb{Z}[\theta]$ なら、\ref{nt:kummer-dedekind} から $\bar{f}$ は $\mathbb{F}_{2}$ 上の相異なる 3 つの 1 次式の積になるはずだが、$\mathbb{F}_{2}[x]$ の 1 次式は $x$, $x+1$ の 2 つしかない。よって**どの** $\theta$ についても $\mathcal{O}_{K}\neq\mathbb{Z}[\theta]$（\ref{nt:page-rings-of-integers} の注意）。指数を割り切る素数の分解は、ニュートン多角形（オレの定理）などで計算する方法が知られている（本サイト未収録）。
:::

::: hypcheck
- **$p\nmid$ 指数**：\ref{nt:kummer-dedekind} の Step 1 で $\mathcal{O}_{K}/p\cong\mathbb{Z}[\theta]/p$ を示すのに本質的。デデキントの例はこれが外せないことを示す。
- **デデキント性**：一意分解（\ref{ring:dedekind-factorization}）と「含むは割る」を、\ref{nt:fundamental-identity} と \ref{nt:kummer-dedekind} の Step 4・5 で使う。$\mathbb{Z}[\theta]$ がデデキントでない（$p$ が指数を割り切る）と、$p\mathbb{Z}[\theta]$ はこのように分解しないことがある。
- **有限性**：ノルム $N(\mathfrak{a})$ の定義（\ref{nt:integers-dedekind.2}）と、$\mathcal{O}_{K}/p\cong(\mathbb{Z}/p)^{n}$ に使う。
- **選択公理**：引用するデデキント環の定理を通して使う。
:::

::: supplement
**前提を変えると.** デデキント環 $A$（商体 $F$）と有限次分離拡大 $L/F$、$A$ の $L$ での整閉包 $B$ について、$A$ の素イデアル $\mathfrak{p}$（剰余体が有限とは限らない）の分解 $\mathfrak{p}B=\prod\mathfrak{P}_{i}^{e_{i}}$ で $\sum e_{i}f_{i}=[L:F]$ が成り立つ（$B$ は $A$ 上有限生成で、$A_{\mathfrak{p}}$ は DVR なので $B_{\mathfrak{p}}$ は階数 $[L:F]$ の自由 $A_{\mathfrak{p}}$ 加群）。クンマー–デデキントの定理も「$\mathfrak{p}$ が導手 $\{x : xB\subset A[\theta]\}$ と互いに素」という形で成り立つ。

**似た定理.** 有限体上の曲線の被覆 $C'\to C$ での点の分解も同じ等式 $\sum e_{i}f_{i}=\deg$ に従う（関数体の拡大の付値の分解）。リーマン面の被覆では $f_{i}=1$（剰余体が $\mathbb{C}$）で、$\sum e_{i}=\deg$ は「被覆の各点の上の点を重複度込みで数えると次数」というおなじみの事実である。

**計算の観点.** \ref{nt:kummer-dedekind} は、$\mathbb{F}_{p}[x]$ での多項式の因数分解（ベルレカンプ法やカントール–ザッセンハウス法）に帰着するので、$p$ が指数を割り切らない限り分解は効率よく計算できる。
:::

## 高い視点 {#nt:sec-pd-viewpoint}

::: remark ファイバーとしての分解
$\operatorname{Spec}\mathcal{O}_{K}\to\operatorname{Spec}\mathbb{Z}$ の $p$ でのファイバーは $\operatorname{Spec}\mathcal{O}_{K}/p\mathcal{O}_{K}=\operatorname{Spec}\prod\mathcal{O}_{K}/\mathfrak{P}_{i}^{e_{i}}$（\ref{ag:affine-fiber}）で、点 $\mathfrak{P}_{i}$ の個数が $g$、各点の「剰余体の大きさ」が $f_{i}$、「被約でない度合い（重なり）」が $e_{i}$ である。$\sum e_{i}f_{i}=n$ は「有限平坦な被覆の各ファイバーは長さ $n$」という幾何的な事実（$\mathcal{O}_{K}$ が階数 $n$ の自由 $\mathbb{Z}$ 加群であること）の言い換えで、クンマー–デデキントの定理は「ファイバーの環が $\mathbb{F}_{p}[x]/(\bar{f})$ と同型なら、多項式の因数分解がそのまま点の分解になる」ことを言っている。比喩で言えば、素数 $p$ という一本の糸は、$K$ に入ると $g$ 本に分かれ、それぞれ太さ $f_{i}$ で、$e_{i}$ 本ずつ撚り合わされている——総量は常に $n$ 本ぶんである。
:::

## 問題 {#nt:sec-pd-problems}

::: problem {#nt:prob-pd-sqrt-minus-five}
$K=\mathbb{Q}(\sqrt{-5})$ で $2$, $3$, $5$, $7$ の分解を求めよ。また $2\mathcal{O}_{K}=\mathfrak{p}^{2}$ となる $\mathfrak{p}$ が単項でないことを、ノルムを使って示せ。
:::

::: solution
$-5\equiv3\pmod4$ なので $\mathcal{O}_{K}=\mathbb{Z}[\sqrt{-5}]$（\ref{nt:quadratic-integers}）、$f=x^{2}+5$。$p=2$：$\bar{f}=(x+1)^{2}$、$2=\mathfrak{p}^{2}$, $\mathfrak{p}=(2,1+\sqrt{-5})$。$p=3$：$x^{2}+5\equiv x^{2}-1=(x-1)(x+1)$、$3=(3,\sqrt{-5}-1)(3,\sqrt{-5}+1)$ 完全分解。$p=5$：$\bar{f}=x^{2}$、$5=(\sqrt{-5})^{2}$ 完全分岐。$p=7$：$x^{2}+5\equiv x^{2}-2$ で $3^{2}=9\equiv2$ なので $(x-3)(x+3)$、完全分解。$\mathfrak{p}$ が単項 $(\alpha)$ なら $|N(\alpha)|=N(\mathfrak{p})=2$（\ref{nt:ideal-norm-multiplicative}）だが、$N(a+b\sqrt{-5})=a^{2}+5b^{2}=2$ は整数解をもたない。
:::

::: problem {#nt:prob-pd-cyclotomic-p}
奇素数 $p$ と $K=\mathbb{Q}(\zeta_{p})$ について、$p\mathcal{O}_{K}=(1-\zeta_{p})^{p-1}$（完全分岐）を示せ。
:::

::: solution
$\mathcal{O}_{K}=\mathbb{Z}[\zeta]$（\ref{nt:cyclotomic-integers}）、$\Phi_{p}(x)\equiv(x-1)^{p-1}\pmod p$（$x^{p}-1\equiv(x-1)^{p}$ を $x-1$ で割る）。\ref{nt:kummer-dedekind} から $p\mathcal{O}_{K}=(p,\zeta-1)^{p-1}$。$N(1-\zeta)=p$（\ref{nt:cyclotomic-integers.1}）なので $(1-\zeta)$ はノルム $p$ のイデアルで $p$ を含む（$p=N(1-\zeta)=\prod(1-\zeta^{i})$ は $1-\zeta$ の倍）から $(p,\zeta-1)=(1-\zeta)$。
:::
