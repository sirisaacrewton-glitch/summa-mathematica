# 代数的位相幾何学（Algebraic Topology）

ホモトピー、ホモロジー、コホモロジー。

<p class="mn-msc">MSC2020: 55</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="55P-homotopy-theory/index.html"><span class="mn-card-title">ホモトピー論</span><span class="mn-card-en">Homotopy Theory</span><span class="mn-card-desc">基本群とファン・カンペン、被覆空間、高次ホモトピー群、ファイブレーション、フレヴィッツの定理。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="55N-homology-and-cohomology/01-homology/index.html"><span class="mn-card-title">ホモロジー論</span><span class="mn-card-en">Homology Theory</span><span class="mn-card-desc">単体的・特異・胞体ホモロジー、ホモトピー不変性、相対ホモロジーと切除、マイヤー–ヴィートリス、球面のホモロジーと領域不変性・ジョルダン–ブラウワーの分離定理、CW 複体、単体的・胞体・特異ホモロジーの一致、アイレンバーグ–スティーンロッドの公理と一意性（無限 CW 複体を含む）、普遍係数定理とキュネットの定理。</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="55N-homology-and-cohomology/02-cohomology/index.html"><span class="mn-card-title">コホモロジー論</span><span class="mn-card-en">Cohomology Theory</span><span class="mn-card-desc">特異コホモロジーと普遍係数定理、ボルスク–ウラム、カップ積と次数付き可換性、チェック・層・特異コホモロジーの CW 複体での一致、理論が一致しない空間（ワルシャワの円・カントール集合・ハワイの耳飾り）、キャップ積とポアンカレ双対性。</span><span class="mn-card-count">6 ページ</span></a>
</div>
