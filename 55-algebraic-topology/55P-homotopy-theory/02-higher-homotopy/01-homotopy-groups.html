# 高次ホモトピー群 {#at:page-homotopy-groups keywords="higher homotopy groups pi_n(X,x_0), maps of cubes and spheres, commutativity via Eckmann-Hilton, action of pi_1 on pi_n, relative homotopy groups, compression criterion, long exact sequence of homotopy groups of a pair, pi_k(S^n) = 0 for k < n, piecewise multilinear approximation"}

基本群（\ref{at:fundamental-group}）は閉道、すなわち $S^{1}$ からの写像のホモトピー類だった。$S^{n}$ からの基点付き写像のホモトピー類を考えると**高次ホモトピー群** $\pi_{n}(X,x_{0})$ が得られる。$n\ge2$ では可換群で、定義は簡単だが計算は極めて難しい（$\pi_{3}(S^{2})\cong\mathbb{Z}$ のように、次元より高い球面の写像が自明でない）。このページでは基本的な性質、相対ホモトピー群と対の長完全列、そして $k<n$ なら $\pi_{k}(S^{n})=0$ であることを示す。

> 資料：標準的な内容（Massey『Algebraic Topology: An Introduction』、小松・中岡・菅原『位相幾何学 I』のホモトピー群の章など）。$\pi_{k}(S^{n})=0$ の証明は、単体近似の代わりに区分的な多重線形近似を使う形で自分で書き下ろした。

## 記法と定義の確認 {#at:sec-hg-notation}

::: notation
- 基本群・道のホモトピー・径数の付け替えは \ref{at:fundamental-group}, \ref{at:path-groupoid}。ホモトピーの基本性質 \ref{at:homotopy-equivalence-relation}。エックマン–ヒルトンの議論 \ref{cat:eckmann-hilton-algebraic}。
- $I^{n}\defeq[0,1]^{n}$、$\partial I^{n}$ はその境界、$I^{n-1}$ を底面 $\{s_{n}=0\}$ と同一視し、$J^{n-1}\defeq\overline{\partial I^{n}\setminus I^{n-1}}$（底面以外の面の和）とする。
- 立体射影 \ref{at:sphere-simply-connected}、ルベーグ数 \tref{top:lebesgue-number}、一様連続性 \ref{top:heine-cantor}。
- CW 複体の位相とホモトピー拡張性質 \ref{at:page-cw-topology}, \ref{at:cw-hep}、立方体の三角形分割 \ref{at:subdivision-complex}、胞体近似定理 \tref{at:cellular-approximation}、球面の写像の標準形とホップの定理 \ref{at:page-sphere-maps}。
- **選択公理**：胞体近似定理を使う \ref{at:cw-pair-connectivity} で、無限個の胞体があれば使う。それ以外では使わない。
:::

## ホモトピー群 {#at:sec-hg-groups}

::: definition ホモトピー群 {#at:homotopy-group keywords="n-th homotopy group pi_n(X,x_0) as homotopy classes of maps (I^n, boundary) -> (X, x_0), sum by the first coordinate" index="ホモトピー群|ほもとぴーぐん, 高次ホモトピー群|こうじほもとぴーぐん"}
$n\ge1$ について、連続写像 $f\colon(I^{n},\partial I^{n})\to(X,x_{0})$ の、$\partial I^{n}$ を $x_{0}$ に保つホモトピー（rel $\partial I^{n}$）による類の集合を $\pi_{n}(X,x_{0})$ とする。和を
$$
(f+g)(s)\defeq\begin{cases}f(2s_{1},s_{2},\dots,s_{n})&(s_{1}\le\tfrac12)\\ g(2s_{1}-1,s_{2},\dots,s_{n})&(s_{1}\ge\tfrac12)\end{cases}
$$
で定める。$\pi_{0}(X,x_{0})$ は弧状連結成分の集合（$x_{0}$ の成分を基点とする）。$I^{n}/\partial I^{n}\cong S^{n}$ なので、$\pi_{n}(X,x_{0})$ は基点付き写像 $(S^{n},s_{0})\to(X,x_{0})$ の基点付きホモトピー類と同じ。
:::

::: proposition ホモトピー群の基本性質 {#at:homotopy-group-properties keywords="pi_n is a group for n >= 1, abelian for n >= 2; functorial; based homotopy invariant; pi_1 acts on pi_n" index="ホモトピー群の基本性質|ほもとぴーぐんのきほんせいしつ"}
1. $\pi_{n}(X,x_{0})$ は $+$ で群（$n=1$ では基本群）。
2. $n\ge2$ なら可換群。
3. 基点付き写像 $f$ は準同型 $f_{*}$ を誘導し、関手的。基点付きホモトピーで結ばれる写像は同じ $f_{*}$ を誘導する。
4. $x_{0}$ から $x_{1}$ への道 $\gamma$ は同型 $\beta_{\gamma}\colon\pi_{n}(X,x_{1})\to\pi_{n}(X,x_{0})$ を誘導し、$\gamma$ のホモトピー類だけによる。とくに $\pi_{1}(X,x_{0})$ は $\pi_{n}(X,x_{0})$ に作用する。
:::

::: proof
**Step 1（群）.** 第 1 座標だけを使う定義なので、\ref{at:path-groupoid.1}〜\ref[5]{at:path-groupoid.5} の証明（径数の付け替え、結合律、単位元、逆元 $\bar f(s)=f(1-s_{1},s_{2},\dots)$）が、他の座標をそのままにして通る（$\partial I^{n}$ が $x_{0}$ に写ることは各ホモトピーで保たれる）。

**Step 2（可換性）.** 第 2 座標による和 $+_{2}$ も同様に群演算を定め、単位元はどちらも定値写像の類。写像のレベルで交換法則 $(a+_{1}b)+_{2}(c+_{1}d)=(a+_{2}c)+_{1}(b+_{2}d)$ が成り立つ（両辺とも、$I^{n}$ を $s_{1},s_{2}$ について 4 つに分けた各部分に $a,b,c,d$ を縮めて置いた同じ写像）。\ref{cat:eckmann-hilton-algebraic} から $+_{1}=+_{2}$ で可換。

**Step 3（関手性）.** $f\circ(g+h)=(f\circ g)+(f\circ h)$ と、ホモトピーの合成。

**Step 4（基点の取り替え）.** $f\colon(I^{n},\partial I^{n})\to(X,x_{1})$ について、$\gamma f$ を「$I^{n}$ の中心に縮めた立方体（一辺 $\frac12$）で $f$、その外側の殻では、中心からの放射方向の距離に応じて $\gamma$ を走る（外側の境界で $x_{0}$、内側の境界で $x_{1}$）」写像とする。$\gamma$ と $f$ のホモトピーを同じ式に入れればホモトピーになり、$(\gamma\eta)f\simeq\gamma(\eta f)$、$c_{x_{0}}f\simeq f$、$\gamma(f+g)\simeq\gamma f+\gamma g$ が径数の付け替えで示せる。$\bar\gamma$ が逆を与える。
:::

::: supplement
\ref{cat:higher-homotopy-groups} では、$\pi_{n}(X)=\pi_{0}(\Omega^{n}X)$ が群で $n\ge2$ で可換であることを、小立方体オペラッドの作用から導いた。上の証明の Step 2 はその具体形である（$I^{n}$ を 2 方向に分ける自由度が $E_{2}$ 構造）。
:::

## 相対ホモトピー群と長完全列 {#at:sec-hg-relative}

::: definition 相対ホモトピー群 {#at:relative-homotopy-group keywords="relative homotopy group pi_n(X,A,x_0) of maps (I^n, boundary, J^{n-1}) -> (X, A, x_0); group for n >= 2, abelian for n >= 3" index="相対ホモトピー群|そうたいほもとぴーぐん"}
$x_{0}\in A\subset X$、$n\ge1$ について、写像 $f\colon(I^{n},\partial I^{n},J^{n-1})\to(X,A,x_{0})$（$\partial I^{n}$ を $A$ に、$J^{n-1}$ を $x_{0}$ に写す）の、同じ条件を保つホモトピーによる類の集合を $\pi_{n}(X,A,x_{0})$ とする。$n\ge2$ では第 1 座標による和で群（$J^{n-1}$ は $s_{1}$ 方向の面を含むので和が定義できる）、$n\ge3$ で可換。$\pi_{n}(X,x_{0},x_{0})=\pi_{n}(X,x_{0})$。
:::

::: lemma 圧縮の基準 {#at:compression-criterion keywords="compression criterion: a map of triples represents zero in pi_n(X,A,x_0) iff it is homotopic rel boundary to a map into A" index="圧縮の基準|あっしゅくのきじゅん"}
$f\colon(I^{n},\partial I^{n},J^{n-1})\to(X,A,x_{0})$ が $\pi_{n}(X,A,x_{0})$ で $0$ であることと、$f$ が rel $\partial I^{n}$ で $A$ に値をとる写像とホモトープであることは同値。
:::

::: proof
**Step 1（$\Leftarrow$）.** $f\simeq g$ rel $\partial I^{n}$ で $g(I^{n})\subset A$ とする。このホモトピーは三つ組の写像のホモトピーなので $[f]=[g]$。$g$ に、$I^{n}$ の点を上面 $s_{n}=1$ に向かって真上に動かすホモトピー $g_{t}(s)\defeq g(s_{1},\dots,s_{n-1},(1-t)s_{n}+t)$ を施す。$s\in J^{n-1}$ なら $(s_{1},\dots,s_{n-1},(1-t)s_{n}+t)$ も $J^{n-1}$ に入る（側面の点は側面に、上面の点は上面にとどまる）ので $g_{t}(J^{n-1})=x_{0}$、$g_{t}(\partial I^{n})\subset g(I^{n})\subset A$。$g_{1}$ は上面の値で定値 $x_{0}$。よって $[g]=0$。

**Step 2（$\Rightarrow$）.** $F\colon I^{n}\times I\to X$ を $f$ から定値写像 $x_{0}$ へのホモトピー（各時刻で三つ組の写像）とする。$F$ は $\partial I^{n}\times I$ と $I^{n}\times\{1\}$ を $A$ に写す（$x_{0}\in A$）。$P\defeq(m,-1)$（$m$ は $I^{n}$ の中心）とし、$x\in I^{n}$ について $P$ から $(x,0)$ を通る半直線が $I^{n}\times I$ を出る点を $r(x)$ とする。$d\defeq(x,0)-P$ とおくと $r(x)=P+\lambda(x)d$ で、$\lambda(x)$ は、直方体 $I^{n}\times I$ を定める不等式 $z_{i}\le1$, $-z_{i}\le0$ のうち $d$ 方向に増えるもの（上面の $z_{n+1}\le1$ は常に該当）について、境界に達する径数 $(b-a\cdot P)/(a\cdot d)$ の最小値。該当しない不等式は値 $+\infty$ とみなせばよく（$a\cdot d\to0^{+}$ では値が $+\infty$ に発散して最小値に関わらない）、$\lambda$ は連続。$x\in\partial I^{n}$ なら、ある $x_{i}\in\{0,1\}$ に対応する不等式の値がちょうど $\lambda=1$ になるので $r(x)=(x,0)$。$r(x)$ は側面 $\partial I^{n}\times I$ か上面 $I^{n}\times\{1\}$ にある。$h_{t}(x)\defeq(1-t)(x,0)+tr(x)$ と $f_{t}\defeq F\circ h_{t}$ とすると、$f_{0}=f$、$f_{t}\restriction\partial I^{n}=f\restriction\partial I^{n}$（rel $\partial I^{n}$）、$f_{1}(I^{n})\subset F(\text{側面}\cup\text{上面})\subset A$。
:::

::: lemma 境界を固定しない圧縮 {#at:compression-free keywords="if pi_k(Y,B,y) = 0 for all y in B, every map (I^k, boundary) -> (Y,B) is homotopic rel boundary to a map into B" index="境界を固定しない圧縮|きょうかいをこていしないあっしゅく"}
$k\ge1$ とし、空間対 $(Y,B)$ がすべての $y\in B$ で $\pi_{k}(Y,B,y)=0$ を満たすとする。連続写像 $F\colon(I^{k},\partial I^{k})\to(Y,B)$（$J^{k-1}$ を 1 点に写すとは限らない）は、rel $\partial I^{k}$ で $B$ に値をとる写像とホモトープ。
:::

::: proof
$I^{k}=I^{k-1}\times I$ と書き、$m$ を $I^{k-1}$ の中心とする。$I^{k}$, $I^{k-1}$ には立方体の三角形分割 $T^{k}$, $T^{k-1}$（\ref{at:subdivision-complex}）による CW 構造を入れる。立方体の面の和（$\partial I^{k}$, $J^{k-1}$ など）は部分複体である（\ref{at:chain-representation.2} で、$x_{i}=0$ の点の表示の鎖は $i$ を含まず、$x_{i}=1$ の点の表示の鎖はすべて $i$ を含み $\mathbf{1}_{\varnothing}$ の係数が $0$ なので、表示に使う頂点はその面にある）。

**Step 1（$J^{k-1}$ の縮約）.** $P\defeq(m,-1)$ から $(x,0)$（$x\in I^{k-1}$）を通る半直線が $I^{k}$ を出る点を $r(x)$ とする（\ref{at:compression-criterion} の Step 2 の写像で、$n=k-1$ としたもの）。$r$ は連続で、値は $J^{k-1}$（側面と上面）に入る。$r$ は単射（相異なる半直線）で、全射（$z\in J^{k-1}$ について、$P$ から $z$ への線分は底面の点 $m+\frac{z'-m}{1+z_{k}}\in I^{k-1}$ を通る）なので、コンパクト空間からハウスドルフ空間への連続な全単射として同相。$D_{t}(r(x))\defeq r((1-t)x+tm)$ は $J^{k-1}$ の 1 点 $a\defeq r(m)$ への縮約。

**Step 2（$\partial I^{k}$ の変形）.** $\partial I^{k}=J^{k-1}\cup(I^{k-1}\times\{0\})$、共通部分は $\partial I^{k-1}\times\{0\}$。$E\colon\partial I^{k}\times I\to\partial I^{k}$ を、$J^{k-1}$ の上では $D$、底面の上では、$(x,0)\mapsto(x,0)$ と $\partial I^{k-1}$ の上の $D_{t}$ から CW 対 $(I^{k-1},\partial I^{k-1})$ のホモトピー拡張性質（\ref{at:cw-hep}）で得られるホモトピー（値は $\partial I^{k}$ の中にとれる：$Y=\partial I^{k}$ として適用）と定める。両者は $\partial I^{k-1}\times\{0\}\times I$ で一致するので、貼り合わせ補題から連続。$E_{0}=1$, $E_{1}(J^{k-1})=\{a\}$。

**Step 3（対のホモトピー）.** $F\circ E_{t}\colon\partial I^{k}\to B$ を、CW 対 $(I^{k},\partial I^{k})$ のホモトピー拡張性質で $F$ から始まる $I^{k}\times I$ 上のホモトピー $G$ に延ばす。$F'\defeq G_{1}$ は $\partial I^{k}$ を $B$ に、$J^{k-1}$ を $y\defeq F(a)$ に写すので $\pi_{k}(Y,B,y)$ の元で、仮定から $0$。\ref{at:compression-criterion} から $F'$ は rel $\partial I^{k}$ で $B$ に値をとる $F''$ とホモトープ。$G$ とこのホモトピーをつないだ $G'\colon I^{k}\times I\to Y$ は、$G'_{0}=F$、$G'(\partial I^{k}\times I)\subset B$、$G'_{1}(I^{k})\subset B$ を満たす。

**Step 4.** \ref{at:compression-criterion} の Step 2 と同じく、$h_{t}(x)\defeq(1-t)(x,0)+t\,r'(x)$（$r'(x)$ は点 $(c,-1)$ から $(x,0)$ を通る半直線が $I^{k}\times I$ を出る点、$c$ は $I^{k}$ の中心）とおくと、$G'\circ h_{t}$ は rel $\partial I^{k}$ のホモトピーで、$G'\circ h_{1}$ は $G'$ の側面 $\partial I^{k}\times I$ と上面 $I^{k}\times\{1\}$ での値、すなわち $B$ に値をとる。
:::

::: theorem 対のホモトピー長完全列 {#at:homotopy-long-exact-pair keywords="long exact sequence of homotopy groups of a pair: ... -> pi_n(A) -> pi_n(X) -> pi_n(X,A) -> pi_{n-1}(A) -> ... -> pi_0(X)" index="ホモトピー長完全列|ほもとぴーちょうかんぜんれつ"}
空間対 $(X,A)$ と $x_{0}\in A$ について、
$$
\cdots\to\pi_{n}(A,x_{0})\xrightarrow{i_{*}}\pi_{n}(X,x_{0})\xrightarrow{j_{*}}\pi_{n}(X,A,x_{0})\xrightarrow{\partial}\pi_{n-1}(A,x_{0})\to\cdots\to\pi_{0}(X,x_{0})
$$
は完全（$\partial[f]\defeq[f\restriction I^{n-1}]$。低次では基点付き集合の列として、核は基点の逆像）。
:::

::: proof
各項で「合成が自明」と「核 $\subset$ 像」を示す。

**Step 1（$\pi_{n}(X)$ で）.** $j_{*}i_{*}=0$：$A$ に値をとる写像は圧縮の基準（$\Leftarrow$）で $0$。$j_{*}[f]=0$ なら、圧縮の基準（$\Rightarrow$）で $f\simeq g$ rel $\partial I^{n}$、$g(I^{n})\subset A$、よって $[f]=i_{*}[g]$。

**Step 2（$\pi_{n}(X,A)$ で）.** $\partial j_{*}=0$：$\partial I^{n}$ 全体が $x_{0}$ に写るので底面への制限は定値。$\partial[f]=0$ なら、$G\colon I^{n-1}\times I\to A$ を $f\restriction I^{n-1}$ から定値写像への rel $\partial I^{n-1}$ のホモトピーとする。$I^{n}$ の下半分 $s_{n}\le\frac12$ で $G(s',1-2s_{n})$、上半分で $f(s',2s_{n}-1)$ とした $f'$ は $\partial I^{n}$ 全体を $x_{0}$ に写す（底面は $G(\cdot,1)$ で定値、側面は $G$ が rel $\partial I^{n-1}$ で $x_{0}$ と $f$ の $J$ 上の値 $x_{0}$）ので $\pi_{n}(X)$ の元。$f'$ と $f$ は、下半分の $G$ の部分を $G(s',u(1-2s_{n}))$（$u\colon1\to0$）と縮めるホモトピーで三つ組の写像として結ばれる（各時刻で底面は $G(\cdot,u)\in A$、側面と上面は $x_{0}$）。よって $[f]=j_{*}[f']$。

**Step 3（$\pi_{n-1}(A)$ で）.** $i_{*}\partial=0$：$f$ を $s_{n}$ についての族と見ると、$f(\cdot,s_{n})$ は $f\restriction I^{n-1}$ から上面の値（定値 $x_{0}$）への rel $\partial I^{n-1}$ のホモトピー（$X$ の中）。$i_{*}[g]=0$（$g\colon I^{n-1}\to A$）なら、$X$ の中のホモトピー $H\colon I^{n-1}\times I\to X$（$g$ から定値へ、rel $\partial I^{n-1}$）は三つ組の写像 $(I^{n},\partial I^{n},J^{n-1})\to(X,A,x_{0})$ で、$\partial[H]=[g]$。

**Step 4（$\pi_{0}$ の端）.** $\pi_{1}(X,A)\to\pi_{0}(A)\to\pi_{0}(X)$ の完全性は、道の端点の議論（$A$ の 2 点が $X$ の道で結ばれることと、その道が $\pi_{1}(X,A)$ の元であること）。
:::

::: example
$X$ が可縮なら $\partial\colon\pi_{n}(X,A)\cong\pi_{n-1}(A)$（$n\ge2$）。とくに $\pi_{n+1}(D^{n+1},S^{n})\cong\pi_{n}(S^{n})$。
:::

## 低い次元のホモトピー群は消える {#at:sec-hg-spheres}

::: lemma 区分的多重線形近似 {#at:multilinear-approximation keywords="a continuous map from a k-cube into R^n can be approximated by piecewise multilinear maps; the image of a piecewise multilinear map from a k-cube into R^n with k < n has empty interior" index="区分的多重線形近似|くぶんてきたじゅうせんけいきんじ"}
1. 連続写像 $u\colon I^{k}\to\mathbb{R}^{n}$ と $\varepsilon>0$ について、十分大きい $N$ で一辺 $\frac1N$ の格子立方体に分け、各立方体で頂点の値 $u(v)$ を多重線形補間した写像 $L$ は連続で $|L-u|<\varepsilon$。
2. $k<n$ なら $L(I^{k})$ は $\mathbb{R}^{n}$ の内点をもたない。
:::

::: proof
**Step 1（1）.** 小立方体 $Q=v+\frac1N[0,1]^{k}$ の上で $L(v+\frac{t}{N})\defeq\sum_{\epsilon\in\{0,1\}^{k}}\prod_{i}(t_{i}^{\epsilon_{i}}(1-t_{i})^{1-\epsilon_{i}})\,u(v+\frac{\epsilon}{N})$。隣り合う立方体の共通の面では、その面の頂点の値だけで決まる同じ式になるので、$L$ は連続。$L(x)$ は $Q$ の頂点の値の凸結合（係数は非負で和は $1$）なので、$u$ の一様連続性（\ref{top:heine-cantor}）から、直径 $\frac{\sqrt k}{N}$ 以内での $u$ の変動を $\varepsilon$ 未満にすれば $|L(x)-u(x)|<\varepsilon$。

**Step 2（2）.** 各小立方体の上で $L$ は多項式写像で、ある定数 $C$ について $|L(x)-L(y)|\le C|x-y|$（偏微分は有界）。小立方体をさらに一辺 $\frac1M$ の $M^{k}$ 個に分けると、$L(Q)$ は一辺 $2C\frac{\sqrt k}{M}$ の立方体 $M^{k}$ 個で覆われ、その体積の和は $M^{k}(2C\sqrt k/M)^{n}\to0$（$k<n$）。$L(I^{k})$ は有限個の $L(Q)$ の和なので、任意の $\delta>0$ について体積の和が $\delta$ 未満の有限個の立方体で覆える。内点をもてばある立方体（体積 $s^{n}>0$）を含み、それを覆う立方体の体積の和は $s^{n}$ 以上（初等的な体積の比較）となり矛盾。
:::

::: theorem 球面の低次ホモトピー群 {#at:low-homotopy-spheres keywords="pi_k(S^n) = 0 for k < n; every map S^k -> S^n with k < n is null-homotopic" index="球面の低次ホモトピー群|きゅうめんのていじほもとぴーぐん"}
$0\le k<n$ なら $\pi_{k}(S^{n})=0$。より詳しく、$k<n$ なら任意の連続写像 $S^{k}\to S^{n}$ は定値写像とホモトープ。
:::

::: proof
**Step 1（設定）.** $k=0$ は $S^{n}$（$n\ge1$）の弧状連結性。$k\ge1$ とし、$f\colon(I^{k},\partial I^{k})\to(S^{n},S)$（基点 $S=-e_{n+1}$）をとる。$N$ を中心とする座標 $\sigma\colon S^{n}\setminus\{S\}\cong\mathbb{R}^{n}$（$\sigma(N)=0$、立体射影）で、$B_{r}\defeq\sigma^{-1}(\{|y|<r\})$ とする。

**Step 2（切り替え関数と近似）.** $C\defeq f^{-1}(\overline{B_{2}})$ はコンパクトで $\partial I^{k}$ と交わらない。$\phi(x)\defeq\min\{1,\max\{0,\ 3-|\sigma f(x)|\}\}$（$f(x)\in B_{3}$ のとき。$f(x)\notin B_{3}$ なら $\phi(x)=0$）は連続で、$f(x)\in\overline{B_{2}}$ で $1$、$f(x)\notin B_{3}$ で $0$。$f^{-1}(\overline{B_{3}})$ を含む小立方体の上で、$u\defeq\sigma\circ f$ の多重線形近似 $L$（誤差 $<\frac14$、\ref{at:multilinear-approximation}）をとる：一辺を十分小さくすれば $f^{-1}(\overline{B_{3}})$ と交わる小立方体の像は $B_{4}$ に入り、そこで $L$ が定義される。$g(x)\defeq\sigma^{-1}\bigl((1-\phi(x))\sigma f(x)+\phi(x)L(x)\bigr)$（$\phi(x)>0$ のとき）、$g(x)\defeq f(x)$（$\phi(x)=0$）とおく。

**Step 3（ホモトピー）.** $f_{t}\defeq\sigma^{-1}((1-t\phi)\sigma f+t\phi L)$ は $f$ から $g$ へのホモトピーで、$\phi=0$ の近く（$\partial I^{k}$ を含む）では動かない（rel $\partial I^{k}$）。

**Step 4（$g$ は全射でない）.** $g(x)\in B_{1/2}$ とする。$\phi(x)<1$ なら $|\sigma f(x)|>2$ で、$|L(x)-\sigma f(x)|<\frac14$ から凸結合も $|\cdot|>\frac74$ となり矛盾。よって $\phi(x)=1$ で $\sigma g(x)=L(x)$。$L$ の像は内点をもたない（$k<n$、\ref{at:multilinear-approximation.2}）ので、$\sigma^{-1}$ で $B_{1/2}$ の点 $p$ で $g$ の像に入らないものがある。

**Step 5.** $g$ は $S^{n}\setminus\{p\}\cong\mathbb{R}^{n}$（$p$ からの立体射影）に値をとり、そこで基点 $S$ への直線ホモトピーで定値写像とホモトープ（基点を固定）。よって $[f]=[g]=0$。自由な写像 $S^{k}\to S^{n}$ も同じ議論で全射でない写像とホモトープ。

::: hypcheck
- **$k<n$**：Step 4 の「像が内点をもたない」に使った。$k=n$ では偽（恒等写像は写像度 $1$ で、定値写像とホモトープでない）。
- 連続性だけを仮定し、滑らかさは使わない（近似の段階で区分的多項式にした）。
:::
:::

::: corollary 球面の $n$ 次ホモトピー群 {#at:pin-sn-hopf keywords="pi_n(S^n) is isomorphic to Z via the degree, for n >= 1, by the Hopf degree theorem" index="球面の n 次ホモトピー群|きゅうめんのえぬじほもとぴーぐん"}
$n\ge1$ について、写像度 $[f]\mapsto\deg f$ は群の同型 $\pi_{n}(S^{n})\cong\mathbb{Z}$ を与える。
:::

::: proof
$S^{n}\cong\Sigma^{n}=I^{n}/\partial I^{n}$（\ref{at:page-sphere-maps}）で考える。well-defined で単射：\ref{at:hopf-degree-theorem.1}。準同型：$f+g$ はつぶし写像 $c_{2}$ と $\bar f\vee\bar g$ と折り畳み $\nabla$ の合成なので、\ref{at:pinch-wedge.2} から $(f+g)_{*}x=\bar f_{*}x+\bar g_{*}x$、すなわち $\deg(f+g)=\deg f+\deg g$。全射：標準形 $S_{(1,\dots,1)}$（$d$ 個）と $S_{(-1,\dots,-1)}$ は写像度 $\pm d$（\ref{at:slab-degree.3}）。
:::

::: corollary CW 対の連結性 {#at:cw-pair-connectivity keywords="if all cells of X - A have dimension > n then pi_k(X,A,x_0) = 0 for k <= n; the inclusion of the n-skeleton induces isomorphisms on pi_k for k < n and a surjection for k = n" index="CW 対の連結性|しーだぶりゅーついのれんけつせい"}
$(X,A)$ を CW 対、$x_{0}$ を $A$ の 0 胞体とし、$X\setminus A$ の胞体の次元はすべて $n$ より大きいとする。
1. $1\le k\le n$ で $\pi_{k}(X,A,x_{0})=0$。$X$ の各点は $A$ の点と道で結ばれる。
2. 包含 $A\to X$ は $k<n$ で同型 $\pi_{k}(A,x_{0})\cong\pi_{k}(X,x_{0})$、$k=n$ で全射を誘導する。とくに $X^{n}\to X$ はそうである。
:::

::: proof
**Step 1（1）.** $f\colon(I^{k},\partial I^{k},J^{k-1})\to(X,A,x_{0})$ とする。$I^{k}$ に $T^{k}$ による CW 構造を入れると、$\partial I^{k}$ と $J^{k-1}$ は部分複体（\ref{at:compression-free} の証明の冒頭）。$f\restriction\partial I^{k}\colon\partial I^{k}\to A$ は $J^{k-1}$ の上で胞体写像（0 胞体 $x_{0}$ への定値写像）なので、\ref{at:cellular-approximation}で、$A$ の中の rel $J^{k-1}$ のホモトピーにより胞体写像とホモトープ。これを CW 対 $(I^{k},\partial I^{k})$ のホモトピー拡張性質（\ref{at:cw-hep}）で $I^{k}$ に延ばすと、三つ組の写像のホモトピーなので $[f]$ は変わらず、$f$ は $\partial I^{k}$ の上で胞体写像になる。再び胞体近似定理で、$f$ は rel $\partial I^{k}$ で $X^{k}$ に値をとる写像とホモトープ。$k\le n$ なので $X^{k}\subset A$（次元 $n$ 以下の胞体はすべて $A$ に属する）で、圧縮の基準（\ref{at:compression-criterion}）から $[f]=0$。点 $x$ については、1 点 $D^{0}$ からの写像に胞体近似定理を使うと、$x$ から $X^{0}\subset A$ の点への道が得られる。

**Step 2（2）.** 対の長完全列（\ref{at:homotopy-long-exact-pair}）$\pi_{k+1}(X,A)\to\pi_{k}(A)\to\pi_{k}(X)\to\pi_{k}(X,A)$ に 1 を使う（$k=0$ では 1 の後半）。$A=X^{n}$ では $X\setminus X^{n}$ の胞体の次元は $n+1$ 以上。
:::

::: supplement
**一般化.** 同じ「次元の低い円板は高い次元の胞体の 1 点を避けられる」という議論から、CW 複体の間の任意の写像は胞体写像とホモトープであること（胞体近似定理 \tref{at:cellular-approximation}）が示され、その系として \ref{at:cw-pair-connectivity} が得られる。とくに CW 複体の $\pi_{k}$ は $(k+1)$ 骨格で決まる。$k=n$ では写像度が $\pi_{n}(S^{n})\cong\mathbb{Z}$ を与える（\ref{at:pin-sn-hopf}）。

**高い視点.** ホモトピー群は「球面という探針で空間を探る」不変量で、ホモロジーより細かい（$S^{2}$ のホモロジーは次数 $2$ までしかないが、$\pi_{3}(S^{2})\cong\mathbb{Z}$、$\pi_{4}(S^{2})\cong\mathbb{Z}/2$ など無限に続く。知られている）。比喩で言えば、ホモロジーは「穴の数を数える会計」で、ホモトピー群は「穴を通してどれだけ複雑に巻きつけるか」の記録である。
:::

::: supplement 計算の観点
単連結な有限単体複体の高次ホモトピー群 $\pi_{n}$ は有限生成アーベル群で、計算可能である（ブラウンの定理、1957 として知られている）。ただし計算量は一般に非常に大きい。基本群が自明でないと、$\pi_{1}$ の自明性すら決定不能（\ref{at:page-van-kampen} の計算の観点）なので、事情は大きく異なる。球面のホモトピー群 $\pi_{k}(S^{n})$ の完全な計算は未解決である。
:::

## 問題 {#at:sec-hg-problems}

::: problem {#at:prob-pin-product}
$\pi_{n}(X\times Y,(x_{0},y_{0}))\cong\pi_{n}(X,x_{0})\times\pi_{n}(Y,y_{0})$ を示せ。
:::

::: solution
$n=1$ の場合（\ref{at:prob-product}）と同じく、射影の誘導準同型の組が同型：$(f,g)$ を並べた写像 $I^{n}\to X\times Y$ が逆を与え、ホモトピーも成分ごとに組み合わせられる。
:::

::: problem {#at:prob-pi-n-contractible}
可縮な空間のホモトピー群はすべて自明であることを示せ（基点付きで可縮でない場合も含めて）。
:::

::: solution
$H\colon X\times I\to X$ を $1$ から定値写像 $c$ へのホモトピー、$\gamma(t)\defeq H(x_{0},t)$ とする。$f\colon(I^{n},\partial I^{n})\to(X,x_{0})$ について $H\circ(f\times1)$ は、基点を $\gamma$ に沿って動かす自由ホモトピーで $f$ を定値写像に結ぶ。\ref{at:homotopy-group-properties.4} と同じ議論（基点の移動を $\beta_{\gamma}$ で補正する。\ref{at:pi1-homotopy-invariance} の $n$ 次元版）から $[f]=\beta_{\gamma}[c]=0$。
:::
