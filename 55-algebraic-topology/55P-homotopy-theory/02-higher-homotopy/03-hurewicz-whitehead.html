# フレヴィッツとホワイトヘッドの定理 {#at:page-hurewicz-whitehead keywords="Hurewicz homomorphism, H_1 is the abelianization of pi_1, Eilenberg subcomplex, homotopy extension property, Hurewicz theorem for (n-1)-connected spaces, pi_n(S^n) = Z, Hopf degree theorem, compression lemma, weak homotopy equivalence, Whitehead theorem, CW approximation"}

ホモトピー群とホモロジー群は、**フレヴィッツ準同型** $h\colon\pi_{n}(X)\to H_{n}(X)$ で結ばれる。弧状連結な空間では $H_{1}$ は $\pi_{1}$ のアーベル化で、$(n-1)$ 連結な空間（$k<n$ で $\pi_{k}=0$）では $H_{k}$（$0<k<n$）が消え、$h\colon\pi_{n}\to H_{n}$ は同型になる（**フレヴィッツの定理**）。とくに $\pi_{n}(S^{n})\cong\mathbb{Z}$。また、CW 複体の間の写像がすべてのホモトピー群の同型を誘導すれば、それはホモトピー同値である（**ホワイトヘッドの定理**）。これで、ホモトピー群が CW 複体のホモトピー型を「決める」ことと、ホモロジーとの関係が分かる。

> 資料：標準的な内容（小松・中岡・菅原『位相幾何学 I』のフレヴィッツの定理の章、Massey『Singular Homology Theory』など）。$n=1$ の場合、アイレンバーグの部分複体による消滅と全射性、ホモトピー加法定理による単射性、CW 近似は自分で書き下ろした（球面のウェッジのホモトピー群は、球面の積の胞体構造と胞体近似による標準的な議論）。

## 記法と定義の確認 {#at:sec-hw-notation}

::: notation
- ホモトピー群・相対ホモトピー群・圧縮の基準・対の長完全列・$k<n$ での $\pi_{k}(S^{n})=0$ は \ref{at:homotopy-group}, \ref{at:relative-homotopy-group}, \ref{at:compression-criterion}, \ref{at:homotopy-long-exact-pair}, \ref{at:low-homotopy-spheres}。カップへのレトラクション \ref{at:cup-retraction}、立方体と円板 \ref{at:cube-disk}。
- 特異ホモロジー・プリズム作用素（その証明は「$F_{\sigma\circ\delta^{k}}=F_{\sigma}\circ(\delta^{k}\times1)$」だけを使う）・フレヴィッツ準同型（$n=1$）は \ref{at:singular-homology}, \ref{at:singular-homotopy-invariance}, \ref{at:hurewicz-homomorphism}。恒等単体は $H_{n}(\Delta^{n},\partial\Delta^{n})$ の生成元（\ref{at:identity-simplex-generator}）、良い対と商空間 \ref{at:good-pair}。
- CW 複体 \ref{at:cw-complex} とその位相 \ref{at:page-cw-topology}、胞体近似定理 \tref{at:cellular-approximation}、CW 対の連結性 \ref{at:cw-pair-connectivity}、境界を固定しない圧縮 \ref{at:compression-free}、球面の写像の標準形・つぶし写像・ホップの定理 \ref{at:page-sphere-maps}, \ref{at:pinch-wedge}, \ref{at:pin-sn-hopf}。$X$ が **$n$ 連結**とは、弧状連結で $1\le k\le n$ で $\pi_{k}(X)=0$ のこと。
- **選択公理**：$n=1$ の定理（各点への道の選択）、アイレンバーグの部分複体の構成（各特異単体へのホモトピーの選択）、CW 近似（代表元の選択）で使う。
:::

## フレヴィッツ準同型と $n=1$ {#at:sec-hw-n1}

::: definition フレヴィッツ準同型 {#at:hurewicz-map keywords="Hurewicz homomorphism h: pi_n(X,x_0) -> H_n(X), [f] -> f_*(generator of H_n(S^n))" index="フレヴィッツ準同型（一般）|ふれびっつじゅんどうけいいっぱん"}
$n\ge1$ について、$H_{n}(S^{n})\cong\mathbb{Z}$ の生成元 $\iota$ を 1 つ固定し、$h[f]\defeq f_{*}(\iota)$（$f\colon(S^{n},s_{0})\to(X,x_{0})$）とおく。$n=1$ で $\iota=[\omega_{1}]$（\ref{at:circle-h1-generator}）とすると \ref{at:hurewicz-homomorphism} の $h$ と一致する。$h$ は準同型である。$n=1$ では \ref{at:hurewicz-homomorphism} で示した。$n\ge2$ では、$f+g$ がつぶし写像 $c_{2}\colon\Sigma^{n}\to\Sigma^{n}\vee\Sigma^{n}$ と $f\vee g$ と折り畳み写像の合成であることから、\ref{at:pinch-wedge.2}（$c_{2*}\iota=i_{1*}\iota+i_{2*}\iota$）により $h[f+g]=f_{*}\iota+g_{*}\iota$。
:::

::: theorem 1 次元のフレヴィッツの定理 {#at:hurewicz-one keywords="for path-connected X, the Hurewicz map induces pi_1(X)^ab = H_1(X)" index="1 次元のフレヴィッツの定理|いちじげんのふれびっつのていり" refname="1 次元のフレヴィッツの定理"}
$X$ が弧状連結なら、$h$ は同型 $\pi_{1}(X,x_{0})^{\mathrm{ab}}\cong H_{1}(X)$ を誘導する。
:::

::: proof
**Step 1（逆写像の構成）.** 各点 $x\in X$ に $x_{0}$ から $x$ への道 $\gamma_{x}$ を選ぶ（$\gamma_{x_{0}}$ は定値道）。特異 1 単体 $\sigma$ について $\Phi(\sigma)\defeq[\gamma_{\sigma(0)}\cdot\sigma\cdot\bar\gamma_{\sigma(1)}]\in\pi_{1}^{\mathrm{ab}}$ とし、$S_{1}(X)$ 上の準同型に延ばす（$\pi_{1}^{\mathrm{ab}}$ は加法的に書く）。

**Step 2（境界は $0$ に写る）.** 2 単体 $\tau$ の辺 $\tau_{01},\tau_{12},\tau_{02}$（頂点 $v_{0},v_{1},v_{2}$）について、$\pi_{1}^{\mathrm{ab}}$ で
$$
\Phi(\partial\tau)=\Phi(\tau_{12})-\Phi(\tau_{02})+\Phi(\tau_{01})=[\gamma_{v_{0}}\tau_{01}\tau_{12}\bar\tau_{02}\bar\gamma_{v_{0}}]
$$
（中間の $\bar\gamma_{v_{i}}\gamma_{v_{i}}$ が消える）。閉道 $\tau_{01}\tau_{12}\bar\tau_{02}$ は $\tau$ を $\Delta^{2}$ の境界に制限したもので、$\Delta^{2}$ は凸なので（\ref{at:square-lemma} と同様に）定値道とホモトープ。よって $\Phi(\partial\tau)=0$。

**Step 3（$H_{1}$ 上の写像）.** $\Phi$ を 1 サイクルに制限すると $\bar\Phi\colon H_{1}(X)\to\pi_{1}^{\mathrm{ab}}$。$\bar\Phi\circ h$：閉道 $f$ について $\bar\Phi(h[f])=[\gamma_{x_{0}}f\bar\gamma_{x_{0}}]=[f]$。

**Step 4（$h\circ\bar\Phi$）.** サイクル $z=\sum n_{\sigma}\sigma$ について、$H_{1}$ で $h\Phi(\sigma)=[\gamma_{\sigma(0)}+\sigma-\gamma_{\sigma(1)}]$（\ref{at:hurewicz-homomorphism.2} と、$\bar\gamma\equiv-\gamma$）。よって $h\bar\Phi[z]=[z]+\bigl[\sum_{\sigma}n_{\sigma}(\gamma_{\sigma(0)}-\gamma_{\sigma(1)})\bigr]$ で、第 2 項は $\sum_{x}c_{x}\gamma_{x}$（$c_{x}$ は $-\partial z$ の $x$ の係数）$=0$。

::: hypcheck
- **弧状連結**：Step 1 の $\gamma_{x}$ に使った。
- 選択公理：Step 1 で各点に道を選んだ。
:::
:::

## アイレンバーグの部分複体 {#at:sec-hw-eilenberg}

::: lemma 単体のホモトピー拡張 {#at:simplex-hep keywords="homotopy extension property for (Delta^k, boundary): Delta^k x I retracts onto Delta^k x 0 cup boundary Delta^k x I" index="ホモトピー拡張性質|ほもとぴーかくちょうせいしつ"}
$\Delta^{k}\times I$ から $\Delta^{k}\times\{0\}\cup\partial\Delta^{k}\times I$ へのレトラクションがある。したがって、$\Delta^{k}\times\{0\}\cup\partial\Delta^{k}\times I$ 上の連続写像は $\Delta^{k}\times I$ に延びる（**ホモトピー拡張性質**）。
:::

::: proof
$\Delta^{k}$ と $I^{k}$ は、境界を境界に写す同相写像で結ばれる（どちらもコンパクト凸で内点をもつ $\mathbb{R}^{k}$ の集合で、内点からの放射状の写像による。\ref{at:cube-disk} と同じ形）。$I^{k}$ では \ref{at:cup-retraction}。
:::

::: lemma アイレンバーグの部分複体 {#at:eilenberg-subcomplex keywords="for an (n-1)-connected space the subcomplex of singular simplices sending the (n-1)-skeleton to the base point is chain homotopy equivalent to S(X)" index="アイレンバーグの部分複体|あいれんばーぐのぶぶんふくたい"}
$n\ge1$, $X$ を $(n-1)$ 連結（$n=1$ では弧状連結）、$x_{0}\in X$ とする。$\Delta^{k}$ の $(n-1)$ 骨格（次元 $n-1$ 以下の面の和）を $x_{0}$ に写す特異単体が生成する部分鎖複体を $S^{(n)}(X)$ とする。包含 $S^{(n)}(X)\to S(X)$ は鎖ホモトピー同値。
:::

::: proof
**Step 1（ホモトピーの構成）.** 各特異単体 $\sigma\colon\Delta^{k}\to X$ にホモトピー $P_{\sigma}\colon\Delta^{k}\times I\to X$ を、次を満たすように $k$ についての帰納法で選ぶ：(a) $P_{\sigma}(\cdot,0)=\sigma$；(b) $T\sigma\defeq P_{\sigma}(\cdot,1)\in S^{(n)}$；(c) $P_{\sigma\circ\delta^{i}}=P_{\sigma}\circ(\delta^{i}\times1)$；(d) $\sigma\in S^{(n)}$ なら $P_{\sigma}$ は定値（$P_{\sigma}(x,t)=\sigma(x)$）。
- $k=0$：$\sigma$ は点 $x$。$x=x_{0}$ なら定値、そうでなければ $x$ から $x_{0}$ への道（弧状連結性）。
- $k\ge1$：(c) により $P_{\sigma}$ は $\partial\Delta^{k}\times I$ の上で決まっていて（面ごとの定義が共通の面で一致するのは (c) の帰納法の仮定から）、$\Delta^{k}\times\{0\}$ の上では $\sigma$。\ref{at:simplex-hep} で $\Delta^{k}\times I$ に延ばす。$k\ge n$ なら (b) は満たされる（$(n-1)$ 骨格は $\partial\Delta^{k}$ に含まれ、そこで $T$ は $x_{0}$）。$k\le n-1$ なら、終わりの写像 $\sigma'$ は $\partial\Delta^{k}$ を $x_{0}$ に写し、$\pi_{k}(X,x_{0})=0$ なので $\sigma'$ は rel $\partial\Delta^{k}$ で定値写像 $x_{0}$ とホモトープ（$(\Delta^{k},\partial\Delta^{k})\cong(I^{k},\partial I^{k})$）。このホモトピーを後ろにつなげて $P_{\sigma}$ とする。$\sigma\in S^{(n)}$ なら定値にとる（面も $S^{(n)}$ に入るので (c) と両立）。

**Step 2（鎖写像とホモトピー）.** (c) から $T$ は鎖写像、(d) から $T$ は $S^{(n)}$ の上で恒等。\ref{at:singular-homotopy-invariance} のプリズム作用素を $F_{\sigma}\defeq P_{\sigma}$ で作ると、その証明は (c) だけを使うので $\partial D+D\partial=T-1$。よって $S(X)\xrightarrow{T}S^{(n)}(X)\hookrightarrow S(X)$ は恒等写像と鎖ホモトープで、包含と $T$ は互いの鎖ホモトピー逆写像。

::: hypcheck
- **$(n-1)$ 連結**：Step 1 の $k\le n-1$ の場合（$\pi_{k}=0$）と $k=0$ の場合（弧状連結）に使った。
- 選択公理：すべての特異単体についてホモトピーを選んだ。
:::
:::

## ホモトピー加法定理 {#at:sec-hw-addition}

フレヴィッツ準同型の単射性の鍵は、$(n+1)$ 単体の境界の $n+2$ 個の面が与えるホモトピー群の元の交代和が $0$ になること（**ホモトピー加法定理**）である。そのために、まず球面のウェッジのホモトピー群を計算する。以下 $\Sigma^{n}=I^{n}/\partial I^{n}$、$W_{m}=\bigvee_{j=1}^{m}\Sigma^{n}$、$i_{j}$, $p_{j}$ は \ref{at:pinch-wedge} の記号とする。

::: lemma 球面の積の CW 構造 {#at:sphere-product-cw keywords="the product of m copies of S^n is a finite CW complex with one cell of dimension nk for each k-element subset; the wedge is its (2n-1)-skeleton" index="球面の積の CW 構造|きゅうめんのせきのしーだぶりゅーこうぞう"}
$Y\defeq\prod_{i=1}^{m}\Sigma^{n}$（積位相）は、$\{1,\dots,m\}$ の各部分集合 $T$ に対し次元 $n|T|$ の胞体を 1 つもつ有限 CW 複体で、特性写像は $\Phi_{T}\colon(I^{n})^{T}\to Y$、$(s_{i})_{i\in T}\mapsto(y_{i})$（$i\in T$ では $y_{i}=q(s_{i})$、それ以外では $y_{i}=\ast$）である（$(I^{n})^{T}=I^{n|T|}\cong D^{n|T|}$、\ref{at:cube-disk}）。座標のうち高々 1 つだけが $\ast$ でない点の集合は $(2n-1)$ 骨格で、$W_{m}$ と同相（$i_{j}$ を第 $j$ 座標への埋め込みとして）。
:::

::: proof
$Y^{(k)}\defeq\{y\mid\ast$ でない座標は高々 $k$ 個$\}$ は閉集合。$\Phi_{T}$ は $(I^{n})^{T}$ の内部を「$\ast$ でない座標がちょうど $T$」の点の集合の上に全単射に写し、境界（ある $s_{i}\in\partial I^{n}$）を $Y^{(|T|-1)}$ に写す。$k$ についての帰納法で、$Y^{(k-1)}$ に $|T|=k$ の胞体を $\Phi_{T}\restriction\partial$ で貼った CW 複体 $Z_{k}$ から $Y^{(k)}$ への連続な全単射（$Y^{(k-1)}$ の上は帰納法の同一視、胞体の上は $\Phi_{T}$、商写像の普遍性で連続）があり、$Z_{k}$ はコンパクト、$Y^{(k)}$ はハウスドルフなので同相。$n|T|$ の間の次元には胞体がないので、$Y$ は次元 $0,n,2n,\dots,mn$ の胞体をもつ有限 CW 複体。$Y^{(1)}$ は次元 $n$ 以下の胞体の和、すなわち $(2n-1)$ 骨格で、$W_{m}\to Y^{(1)}$（第 $j$ 成分を第 $j$ 座標へ）は連続な全単射で、コンパクトからハウスドルフへの写像なので同相。
:::

::: proposition 球面のウェッジのホモトピー群 {#at:pin-wedge keywords="for n >= 2, pi_n of a wedge of m n-spheres is Z^m, detected by the projections" index="球面のウェッジのホモトピー群|きゅうめんのうぇっじのほもとぴーぐん"}
$n\ge2$ なら、$(p_{j*})_{j}\colon\pi_{n}(W_{m})\to\bigoplus_{j=1}^{m}\pi_{n}(\Sigma^{n})\cong\mathbb{Z}^{m}$ は同型。とくに $\pi_{n}(W_{m})$ の元は、各 $p_{j}$ との合成の写像度で決まる。
:::

::: proof
\ref{at:sphere-product-cw} の $Y$ と $W_{m}=Y^{(2n-1)}$ について、$Y\setminus W_{m}$ の胞体の次元は $2n$ 以上。\ref{at:cw-pair-connectivity.2}（基点は 0 胞体 $(\ast,\dots,\ast)$、$2n-1$ を $n$ の位置に）から、$k<2n-1$ で $\pi_{k}(W_{m})\cong\pi_{k}(Y)$。$n\ge2$ なら $n<2n-1$ なので $k=n$ に使える。積への写像とそのホモトピーは成分ごとの写像とホモトピーの組なので、射影 $\mathrm{pr}_{j}$ は同型 $\pi_{n}(Y)\cong\prod_{j}\pi_{n}(\Sigma^{n})$ を与える。$\mathrm{pr}_{j}\restriction W_{m}=p_{j}$ なので主張が従い、\ref{at:pin-sn-hopf} から各成分は $\mathbb{Z}$。

::: hypcheck
- **$n\ge2$**：$n<2n-1$ に使った。$n=1$ では偽：$\pi_{1}(S^{1}\vee S^{1})$ は 2 元の自由群で可換でない（\ref{at:page-van-kampen}）。
:::
:::

::: definition 特異単体の類 {#at:simplex-class keywords="the homotopy class [f_sigma] of a singular simplex sending the boundary to the base point, via a fixed identification of I^n / boundary with Delta^n / boundary" index="特異単体のホモトピー類|とくいたんたいのほもとぴーるい"}
$n\ge1$ について、$\theta\colon(I^{n},\partial I^{n})\to(\Delta^{n},\partial\Delta^{n})$ を、同相 $\bar\theta\colon\Sigma^{n}\cong\Delta^{n}/\partial\Delta^{n}$ を誘導する写像として 1 つ固定する（\ref{at:cube-disk} と \ref{at:simplex-hep} の証明の同相）。$\partial\Delta^{n}$ を $x_{0}$ に写す特異単体 $\sigma$ について $[f_{\sigma}]\defeq[\sigma\circ\theta]\in\pi_{n}(X,x_{0})$ とおく。フレヴィッツ準同型（\ref{at:hurewicz-map}）の生成元 $\iota\in H_{n}(\Sigma^{n})$ は、$\bar\theta_{*}\iota=q_{\Delta*}[\iota_{n}]$（$q_{\Delta}\colon\Delta^{n}\to\Delta^{n}/\partial\Delta^{n}$、$[\iota_{n}]$ は恒等単体の類、\ref{at:identity-simplex-generator}。$H_{n}(\Delta^{n}/\partial\Delta^{n},\ast)\cong\tilde H_{n}$ で同一視）となるものにとる。
:::

::: theorem ホモトピー加法定理 {#at:homotopy-addition keywords="homotopy addition theorem: for a singular (n+1)-simplex sending its (n-1)-skeleton to the base point, the alternating sum of the homotopy classes of its faces is zero" index="ホモトピー加法定理|ほもとぴーかほうていり" refname="ホモトピー加法定理"}
$n\ge2$ とし、$\tau\colon\Delta^{n+1}\to X$ を $\Delta^{n+1}$ の $(n-1)$ 骨格を $x_{0}$ に写す特異単体とする。$\pi_{n}(X,x_{0})$ で
$$
\sum_{i=0}^{n+1}(-1)^{i}[f_{\tau\circ\delta^{i}}]=0.
$$
:::

::: proof
**Step 1（境界の商）.** $\Delta^{n+1}$ の $(n-1)$ 骨格を $K$、$Q\defeq\partial\Delta^{n+1}/K$、$\pi_{Q}\colon\partial\Delta^{n+1}\to Q$ を商写像とする。$\zeta\colon W_{n+2}\to Q$（成分に $0,\dots,n+1$ と番号を付ける）を $\zeta\circ i_{i}\defeq\pi_{Q}\circ\delta^{i}\circ\bar\theta$ で定める（$\delta^{i}$ は $\partial\Delta^{n}$ を $K$ に写すので well-defined）。$Q$ の点は基点と各面の開単体の点にちょうど一つずつ対応するので $\zeta$ は全単射、$W_{n+2}$ はコンパクトで $Q$ はハウスドルフ（コンパクト・ハウスドルフ空間の閉集合による商）なので同相。$\tau$ は $K$ を $x_{0}$ に写すので $\tau\restriction\partial\Delta^{n+1}=\bar\tau\circ\pi_{Q}$ となる $\bar\tau\colon Q\to X$ があり、$\bar\tau\circ\zeta\circ i_{i}\circ q=\tau\circ\delta^{i}\circ\theta$。

**Step 2（境界全体は $0$）.** $\Psi\colon(I^{n},\partial I^{n})\to(\partial\Delta^{n+1},v_{0})$ を、同相 $\Sigma^{n}\cong\partial\Delta^{n+1}$（$\partial\Delta^{n+1}$ は重心からの放射で $S^{n}$ と同相）で基点を頂点 $v_{0}$ に写すものから作る。$H(s,t)\defeq\tau((1-t)\Psi(s)+tv_{0})$ は、$\Delta^{n+1}$ の凸性から定義でき、$s\in\partial I^{n}$ では $\tau(v_{0})=x_{0}$ なので rel $\partial I^{n}$ のホモトピーで、$\tau\circ\Psi$ と定値写像を結ぶ。よって $[\tau\circ\Psi]=0$。

**Step 3（$\pi_{n}(W_{n+2})$ の元）.** $\psi\defeq\zeta^{-1}\circ\pi_{Q}\circ\Psi$ とすると $\tau\circ\Psi=\bar\tau\circ\zeta\circ\psi$。$p_{i}\circ\psi$ の写像度を計算する。$z\defeq\sum_{j}(-1)^{j}\delta^{j}$ は $\partial\Delta^{n+1}$ の特異サイクルで、対 $(\Delta^{n+1},\partial\Delta^{n+1})$ の長完全列の連結射の同型 $H_{n+1}(\Delta^{n+1},\partial\Delta^{n+1})\cong H_{n}(\partial\Delta^{n+1})$ で生成元 $[\iota_{n+1}]$（\ref{at:identity-simplex-generator}）の像なので生成元。$\bar\Psi$ は同相なので、$\Psi$ だけで決まる符号 $\epsilon$ で $\bar\Psi_{*}\iota=\epsilon[z]$。$p_{i}\zeta^{-1}\pi_{Q}\circ\delta^{j}$ は $j\neq i$ で基点への定値写像、$j=i$ で $\bar\theta^{-1}\circ q_{\Delta}$ なので、$H_{n}(\Sigma^{n},\ast)$ で
$$
(p_{i}\zeta^{-1}\pi_{Q})_{*}[z]=(-1)^{i}\,\bar\theta^{-1}_{*}q_{\Delta*}[\iota_{n}]=(-1)^{i}\iota.
$$
よって $(p_{i}\bar\psi)_{*}\iota=\epsilon(-1)^{i}\iota$、すなわち $\deg(p_{i}\circ\psi)=\epsilon(-1)^{i}$。

**Step 4.** $\pi_{n}(W_{n+2})$ の元 $\sum_{i}\epsilon(-1)^{i}[i_{i}\circ q]$ も、$p_{j}$ との合成の写像度が $\epsilon(-1)^{j}$（$p_{j}i_{i}$ は $i=j$ で恒等、それ以外で定値）。\ref{at:pin-wedge} から $[\psi]=\epsilon\sum_{i}(-1)^{i}[i_{i}\circ q]$。$(\bar\tau\zeta)_{*}$ を施し、Step 1・2 を使うと
$$
0=[\tau\circ\Psi]=\epsilon\sum_{i}(-1)^{i}[\bar\tau\zeta i_{i}q]=\epsilon\sum_{i}(-1)^{i}[\tau\circ\delta^{i}\circ\theta]=\epsilon\sum_{i}(-1)^{i}[f_{\tau\circ\delta^{i}}].
$$

::: hypcheck
- **$n\ge2$**：\ref{at:pin-wedge}（$\pi_{n}$ が射影で検出されること）に使った。$n=1$ では面の類の積の順序が問題になり、可換化した $\pi_{1}^{\mathrm{ab}}$ でだけ成り立つ（\ref{at:hurewicz-one} の Step 2）。
- **$(n-1)$ 骨格が $x_{0}$ に写ること**：Step 1 で $\tau$ を $Q$ 経由で書くのと、各面の類が定義されることに使った。
:::
:::

## フレヴィッツの定理 {#at:sec-hw-hurewicz}

::: theorem フレヴィッツの定理 {#at:hurewicz-theorem keywords="Hurewicz theorem: for an (n-1)-connected space with n >= 2, reduced H_k vanishes for k < n and h: pi_n -> H_n is an isomorphism" index="フレヴィッツの定理|ふれびっつのていり" refname="フレヴィッツの定理"}
$n\ge2$ で $X$ が $(n-1)$ 連結なら、
1. $0<k<n$ で $H_{k}(X)=0$。
2. $h\colon\pi_{n}(X,x_{0})\to H_{n}(X)$ は全射。
3. $h$ は単射（したがって同型）。
:::

::: proof
**Step 1（低次の鎖）.** $k\le n-1$ では $\Delta^{k}$ 全体が $(n-1)$ 骨格なので、$S^{(n)}_{k}(X)$ は定値単体 $c_{k}$ だけで生成される。$\partial c_{m}=\bigl(\sum_{i=0}^{m}(-1)^{i}\bigr)c_{m-1}$ は $m$ が偶数なら $c_{m-1}$、奇数なら $0$。

**Step 2（1）.** \ref{at:eilenberg-subcomplex} から $H_{k}(X)\cong H_{k}(S^{(n)})$。$0<k\le n-1$ で：$k$ が奇数なら $Z_{k}=\mathbb{Z}c_{k}$ で、$c_{k}=\partial c_{k+1}$（$k+1$ は偶数。$k+1\le n$ なので $c_{k+1}\in S^{(n)}$）、よって $H_{k}=0$。$k$ が偶数なら $\partial c_{k}=c_{k-1}\ne0$ で $Z_{k}=0$。

**Step 3（2）.** $S^{(n)}_{n}$ の生成元 $\sigma$（$\partial\Delta^{n}$ を $x_{0}$ に写す $n$ 単体）は、$\sigma=\bar\sigma\circ q_{\Delta}$（$q_{\Delta}\colon\Delta^{n}\to\Delta^{n}/\partial\Delta^{n}$）と書け、$[f_{\sigma}]=[\sigma\circ\theta]\in\pi_{n}(X,x_{0})$（\ref{at:simplex-class}）。$\partial\sigma=\epsilon_{n}c_{n-1}$（$\epsilon_{n}=1$ ($n$ 偶数), $0$ ($n$ 奇数)）。$n$ 次のサイクル $z=\sum_{j}m_{j}\sigma_{j}+mc_{n}$ について、$\hat\sigma_{j}\defeq\sigma_{j}-\epsilon_{n}c_{n}$ とおくと $\hat\sigma_{j}$ はサイクルで（$\partial c_{n}=\epsilon_{n}c_{n-1}$）、$z=\sum m_{j}\hat\sigma_{j}+m'c_{n}$。$m'c_{n}$ はサイクルなので $\epsilon_{n}m'=0$、$n$ が奇数なら $c_{n}=\partial c_{n+1}$ は境界。よって $[z]=\sum m_{j}[\hat\sigma_{j}]$。$h[f_{\sigma}]=(\bar\sigma\bar\theta)_{*}\iota=\bar\sigma_{*}q_{\Delta*}[\iota_{n}]$（\ref{at:simplex-class} の $\iota$ の約束。同型 $H_{n}(X)\cong H_{n}(X,x_{0})$ で見る）で、これは相対サイクル $\sigma=\sigma\circ\iota_{n}$ の類、すなわち絶対サイクル $\hat\sigma$ の類である（$c_{n}$ は $x_{0}$ の中の鎖）。よって $[\hat\sigma_{j}]=h[f_{\sigma_{j}}]$。$h$ は準同型なので $[z]=h\bigl(\sum m_{j}[f_{\sigma_{j}}]\bigr)$ で、$h$ は全射。

**Step 4（3）.** \ref{at:hurewicz-injective} による。
:::

::: theorem フレヴィッツ準同型の単射性 {#at:hurewicz-injective keywords="injectivity of the Hurewicz map for (n-1)-connected spaces via the homotopy addition theorem" index="フレヴィッツ準同型の単射性|ふれびっつじゅんどうけいのたんしゃせい"}
$n\ge2$ で $X$ が $(n-1)$ 連結なら、フレヴィッツ準同型 $h\colon\pi_{n}(X,x_{0})\to H_{n}(X)$ は単射である。
:::

::: proof
**Step 1（左逆の構成）.** $\Lambda\colon S^{(n)}_{n}(X)\to\pi_{n}(X,x_{0})$ を $\sigma\mapsto[f_{\sigma}]$ の線形な延長とする（$n\ge2$ で $\pi_{n}$ は可換）。$\tau\in S^{(n)}_{n+1}$ の面 $\tau\delta^{i}$ は $S^{(n)}_{n}$ に入り、\ref{at:homotopy-addition}から $\Lambda(\partial\tau)=\sum_{i}(-1)^{i}[f_{\tau\delta^{i}}]=0$。よって $\Lambda$ は $\bar\Lambda\colon H_{n}(S^{(n)}(X))\to\pi_{n}(X,x_{0})$ を誘導する。$c_{n}$ は定値なので $\Lambda(c_{n})=0$。

**Step 2（$\bar\Lambda$ は $h$ の左逆）.** $\iota_{*}\colon H_{n}(S^{(n)}(X))\cong H_{n}(X)$ を \ref{at:eilenberg-subcomplex} の同型とする。$[f]\in\pi_{n}(X,x_{0})$ について $\sigma\defeq\bar f\circ\bar\theta^{-1}\circ q_{\Delta}\in S^{(n)}_{n}$ とおくと、$q_{\Delta}\circ\theta=\bar\theta\circ q$ から $\sigma\circ\theta=f$、すなわち $[f_{\sigma}]=[f]$。$\sigma=\bar\sigma\circ q_{\Delta}$ と書くと $h[f]=h[f_{\sigma}]=(\bar\sigma\bar\theta)_{*}\iota=\bar\sigma_{*}q_{\Delta*}[\iota_{n}]$（\ref{at:simplex-class} の $\iota$ の約束。同型 $H_{n}(X)\cong H_{n}(X,x_{0})$ で見る）で、これは相対サイクル $\sigma$ の類、すなわち絶対サイクル $\hat\sigma\defeq\sigma-\epsilon_{n}c_{n}\in S^{(n)}_{n}$（$\epsilon_{n}$ は $n$ が偶数なら $1$、奇数なら $0$。$\partial\sigma=\epsilon_{n}c_{n-1}=\partial(\epsilon_{n}c_{n})$）の類である（$c_{n}$ は $x_{0}$ の中の鎖。\see{at:hurewicz-theorem} の Step 3 と同じ計算）。よって $h[f]=[\hat\sigma]=\iota_{*}[\hat\sigma]$ で、$\bar\Lambda[\hat\sigma]=[f_{\sigma}]-\epsilon_{n}\Lambda(c_{n})=[f]$。よって $\bar\Lambda\circ\iota_{*}^{-1}\circ h=1$ で、$h$ は単射。
:::

::: corollary 球面のホモトピー群とホップの定理 {#at:pin-sn keywords="pi_n(S^n) = Z via degree; pi_3(S^2) = Z; Hopf degree theorem: maps S^n -> S^n are classified up to homotopy by degree" index="ホップの写像度定理|ほっぷのしゃぞうどていり"}
1. $n\ge1$ で $\pi_{n}(S^{n})\cong\mathbb{Z}$ で、写像度（\ref{at:degree}）が同型を与える。
2. $\pi_{3}(S^{2})\cong\mathbb{Z}$（ホップ写像が生成する）。
3. **（ホップの定理）** 2 つの写像 $S^{n}\to S^{n}$（$n\ge1$）がホモトープであることと、写像度が等しいことは同値。
:::

::: proof
1：\ref{at:pin-sn-hopf}（$n\ge2$ ではフレヴィッツの定理からも：$S^{n}$ は $(n-1)$ 連結（\ref{at:low-homotopy-spheres}）で $h[f]=f_{*}\iota=(\deg f)\iota$）。2：\ref{at:pi2-pi3-s2} と 1 から $\pi_{3}(S^{2})\cong\pi_{3}(S^{3})\cong\mathbb{Z}$。3：\ref{at:hopf-degree-theorem.2}。
:::

## ホワイトヘッドの定理 {#at:sec-hw-whitehead}

::: definition 弱ホモトピー同値 {#at:weak-equivalence keywords="weak homotopy equivalence: induces bijections on pi_0 and isomorphisms on all pi_n for all base points" index="弱ホモトピー同値|じゃくほもとぴーどうち"}
連続写像 $f\colon X\to Y$ が、$\pi_{0}$ の全単射と、すべての $x_{0}\in X$, $n\ge1$ で同型 $f_{*}\colon\pi_{n}(X,x_{0})\to\pi_{n}(Y,f(x_{0}))$ を誘導するとき、**弱ホモトピー同値**という。ホモトピー同値は弱ホモトピー同値（\ref{at:pi1-homotopy-invariance} の高次版）。
:::

::: lemma 圧縮補題 {#at:compression-lemma keywords="compression lemma: a map from a CW pair (Z,A) into (Y,B) with pi_k(Y,B,y) = 0 for the relevant k is homotopic rel A to a map into B" index="圧縮補題|あっしゅくほだい" refname="圧縮補題"}
$(Z,A)$ を CW 対（$A$ は部分複体。有限でなくてよい）、$(Y,B)$ を空間対とし、$Z\setminus A$ に $k$ 胞体があるすべての $k$ とすべての $y\in B$ で $\pi_{k}(Y,B,y)=0$（$k=0$ では、$Y$ のすべての点が $B$ の点と道で結ばれる）とする。連続写像 $g\colon(Z,A)\to(Y,B)$ は、rel $A$ で $B$ に値をとる写像とホモトープ。
:::

::: proof
**Step 1（記号）.** $Z_{k}\defeq Z^{k}\cup A$（部分複体、\ref{at:subcomplex-properties.3}）、$Z_{-1}\defeq A$、$g_{-1}\defeq g$ とおく。帰納的に、連続写像 $G_{k}\colon Z\times I\to Y$（$k\ge0$）で、$G_{k}(\cdot,0)=g_{k-1}$、$G_{k}$ は rel $Z_{k-1}$（$Z_{k-1}$ の各点で $t$ によらない）、$g_{k}\defeq G_{k}(\cdot,1)$ は $g_{k}(Z_{k})\subset B$ を満たすものを作る。$g_{-1}(Z_{-1})=g(A)\subset B$ から始める。

**Step 2（0 胞体）.** $A$ に含まれない 0 胞体 $v$ ごとに、$g(v)$ から $B$ の点への道 $\gamma_{v}$ を選ぶ（仮定の $k=0$ の条件）。$Z_{0}\times I$ 上の写像を、$A\times I$ では $g(a)$、$\{v\}\times I$ では $\gamma_{v}$ と定めると、CW 複体 $Z_{0}$ に \ref{at:cw-coherent-product.1} を使って連続。CW 対 $(Z,Z_{0})$ のホモトピー拡張性質（\ref{at:cw-hep}）で、初期値 $g$ の $Z\times I$ 上の写像 $G_{0}$ に延ばす。

**Step 3（$k$ 胞体、$k\ge1$）.** $A$ に含まれない $k$ 胞体 $e$ について、$\Phi_{e}(\partial D^{k})\subset Z_{k-1}$ なので $g_{k-1}\circ\Phi_{e}\colon(D^{k},\partial D^{k})\to(Y,B)$。立方体と円板の同相 $\varphi\colon I^{k}\to D^{k}$（境界を境界に写す、\ref{at:cube-disk}）について、$g_{k-1}\Phi_{e}\varphi\colon(I^{k},\partial I^{k})\to(Y,B)$ は、境界を固定しない圧縮（\ref{at:compression-free}）から rel $\partial I^{k}$ で $B$ に値をとる写像とホモトープ。そのホモトピーを 1 つ選び、$\varphi^{-1}$ で $D^{k}$ に戻したものを $K_{e}\colon D^{k}\times I\to Y$ とする（rel $\partial D^{k}$、$K_{e}(\cdot,1)\in B$）。$Z_{k}\times I$ 上の写像を、$Z_{k-1}\times I$ では $g_{k-1}(x)$、$(\Phi_{e}(z),t)$ では $K_{e}(z,t)$ と定める。$\partial D^{k}$ の上で両者は一致し（rel $\partial D^{k}$）、$Z_{k}\setminus Z_{k-1}$ は新しい開胞体の非交和なので well-defined で、\ref{at:cw-coherent-product.1} から連続。\ref{at:cw-hep} で $(Z,Z_{k})$ について初期値 $g_{k-1}$ の $G_{k}$ に延ばす。$g_{k}$ は $Z_{k-1}$ の上で $g_{k-1}$（$B$ に値をとる）、新しい胞体の上で $K_{e}(\cdot,1)$（$B$ に値をとる）なので $g_{k}(Z_{k})\subset B$。

**Step 4（無限個の段の連結）.** $H\colon Z\times I\to Y$ を
$$
H(x,t)\defeq G_{k}\bigl(x,\,2^{k+1}(t-1+2^{-k})\bigr)\quad(t\in[1-2^{-k},1-2^{-k-1}],\ k\ge0)
$$
と、$x\in Z_{m}$ について $H(x,1)\defeq g_{m}(x)$ で定める。$k'\ge m+1$ なら $G_{k'}$ は rel $Z_{k'-1}\supset Z_{m}$ なので $g_{k'}=g_{m}$ が $Z_{m}$ の上で成り立ち、$H(x,1)$ は $m$ の取り方によらない。区間の端点では $G_{k}(x,1)=g_{k}(x)=G_{k+1}(x,0)$ なので well-defined、$H(x,0)=g(x)$。連続性を \ref{at:cw-coherent-product.1} で胞体ごとに確かめる。$m$ 次元の胞体 $e_{\alpha}$ は $Z_{m}$ に含まれ、$t\ge1-2^{-m-1}$ では $H(\Phi_{\alpha}(z),t)=g_{m}(\Phi_{\alpha}(z))$（上の注意）。よって $H\circ(\Phi_{\alpha}\times1_{I})$ は、有限個の閉集合 $D_{\alpha}\times[1-2^{-k},1-2^{-k-1}]$（$k\le m$）と $D_{\alpha}\times[1-2^{-m-1},1]$ の上でそれぞれ連続で、貼り合わせ補題から連続。$H$ は rel $A$ で（$A=Z_{-1}$ はどの段でも動かない）、$H(\cdot,1)$ は各 $Z_{m}$ の上で $g_{m}$ なので $B$ に値をとる。

::: hypcheck
- **CW 対であること**：Step 2・3 のホモトピー拡張（\ref{at:cw-hep}）と、Step 4 の連続性（胞体ごとの判定 \ref{at:cw-coherent-product}）に使った。無限個の段を時間 $[1-2^{-k},1-2^{-k-1}]$ に詰めても連続になるのは、各胞体の上では有限個の段しか効かないからである。
- **ホモトピー群の消滅**：Step 2・3 で、$Z\setminus A$ に現れる次元についてだけ使った。
- **選択公理**：道 $\gamma_{v}$ とホモトピー $K_{e}$ の選択（一般には無限個）に使った。
:::
:::

::: theorem ホワイトヘッドの定理 {#at:whitehead-theorem keywords="Whitehead theorem: a weak homotopy equivalence between CW complexes (finite or infinite) is a homotopy equivalence; [Z,X] -> [Z,Y] is bijective for all CW complexes Z" index="ホワイトヘッドの定理|ほわいとへっどのていり" refname="ホワイトヘッドの定理"}
$f\colon X\to Y$ が弱ホモトピー同値なら、任意の CW 複体 $Z$（無限でもよい）について $f_{*}\colon[Z,X]\to[Z,Y]$（ホモトピー類の集合）は全単射。とくに $X,Y$ が CW 複体なら、$f$ はホモトピー同値である。
:::

::: proof
**Step 1（写像柱）.** $M_{f}\defeq(X\times I\sqcup Y)/((x,1)\sim f(x))$ とし、$X$ を $X\times\{0\}$ と同一視する。$Y$ は $M_{f}$ の変位レトラクト（$X\times I$ を $1$ の側へ押す）で、レトラクション $r\colon M_{f}\to Y$ と包含 $X\to M_{f}$ の合成は $f$。よって $X\to M_{f}$ は弱ホモトピー同値で、対 $(M_{f},X)$ の長完全列から $\pi_{k}(M_{f},X,x)=0$（すべての $k\ge1$, $x\in X$。$k=1$ と $\pi_{0}$ は全単射性から）。

**Step 2（全射）.** $g\colon Z\to M_{f}$ について、圧縮補題を $(Z,\varnothing)\to(M_{f},X)$ に使うと、$g$ は $X$ に値をとる写像とホモトープ。$[Z,M_{f}]\cong[Z,Y]$（$r$ による）と合わせて $f_{*}$ は全射。

**Step 3（単射）.** $g_{0},g_{1}\colon Z\to X$ で $fg_{0}\simeq fg_{1}$ とすると、$M_{f}$ の中で $g_{0}\simeq g_{1}$（$r$ はホモトピー同値）。そのホモトピー $H\colon Z\times I\to M_{f}$ は $Z\times\partial I$ を $X$ に写す。$Z\times I$ は、胞体 $e\times\{0\}$, $e\times\{1\}$, $e\times(0,1)$ の CW 複体で、$Z\times\partial I$ はその部分複体（\ref{at:cw-product-interval}）なので、圧縮補題で $H$ は rel $Z\times\partial I$ で $X$ に値をとる写像とホモトープ。これは $X$ の中の $g_{0}$ から $g_{1}$ へのホモトピー。

**Step 4（ホモトピー同値）.** $Z=Y$ として、$f_{*}[g]=[1_{Y}]$ となる $g\colon Y\to X$ をとる（$fg\simeq1_{Y}$）。$Z=X$ として、$f_{*}[gf]=[fgf]=[f]=f_{*}[1_{X}]$ なので単射性から $gf\simeq1_{X}$。

::: hypcheck
- **弱ホモトピー同値**：Step 1 で $\pi_{k}(M_{f},X,x)=0$ を得るのに使った。すべての次数と基点が要る：$S^{\infty}$ の代わりに $S^{n}\to\ast$ を考えると、$\pi_{k}$ は $k<n$ では同型だが $k=n$ で同型でなく、ホモトピー同値でない。
- **$Z$ が CW 複体**：Step 2・3 で\ref{at:compression-lemma}を $(Z,\varnothing)$ と $(Z\times I,Z\times\partial I)$（\ref{at:cw-product-interval}）に使った。$X,Y$ 自身は Step 4 でだけ CW 複体であることが要る。外すと偽：ワルシャワの円から 1 点への写像（下の例 2）。
- **選択公理**：圧縮補題の中で使う。
:::
:::

::: example
1. $S^{2}\times\mathbb{R}P^{3}$ と $S^{3}\times\mathbb{R}P^{2}$ は、すべての $n$ で同型なホモトピー群をもつ（どちらも普遍被覆 $S^{2}\times S^{3}$ と基本群 $\mathbb{Z}/2$）が、ホモトピー同値でないことが知られている（$H_{5}$ が異なる：前者は向き付け可能な閉 5 次元多様体で $H_{5}\cong\mathbb{Z}$、後者は向き付け不可能で $H_{5}=0$）。ホワイトヘッドの定理は「ホモトピー群の同型を**写像が**誘導する」ことを要求しており、群が抽象的に同型なだけでは足りない。
2. ワルシャワの円 $W$ から 1 点への写像は弱ホモトピー同値（\ref{at:prob-warsaw-pi1} と同様の議論で高次も消えることが知られている）だが、ホモトピー同値でない（チェックコホモロジーが異なり、チェックコホモロジーはホモトピー不変）。$W$ は CW 複体でない。
:::

## CW 近似 {#at:sec-hw-cw-approximation}

::: theorem CW 近似 {#at:cw-approximation keywords="CW approximation: every space admits a weak homotopy equivalence from a CW complex, built by attaching cells to kill kernels and wedging spheres to hit cokernels" index="CW 近似|しーだぶりゅーきんじ"}
任意の空間 $X$ について、CW 複体 $Z$ と弱ホモトピー同値 $f\colon Z\to X$ が存在する。
:::

::: intuition
$X$ のホモトピー群を、球面を貼る（全射にする）ことと円板を貼る（余分な元を殺す）ことで、低い次元から一段ずつ写し取っていく。胞体近似により、$(n+1)$ 胞体を貼っても $n$ 次以下のホモトピー群は壊れない（$n$ 次は商になるだけ）ので、各段で作ったものが後の段で保たれる。
:::

::: proof
**Step 1（弧状連結な場合への帰着）.** $X$ の各弧状連結成分 $X_{\lambda}$ に $f_{\lambda}\colon Z_{\lambda}\to X_{\lambda}$ を作り、$Z\defeq\bigsqcup Z_{\lambda}$ とすればよい（CW 複体の非交和は CW 複体）。以下 $X$ は弧状連結、$x_{0}\in X$ とする。弧状連結な CW 複体では、1 つの基点でホモトピー群の同型を示せば、基点の取り替えの同型（\ref{at:homotopy-group-properties.4}）がつくる可換図式から、すべての基点で同型になる。

**Step 2（出発点）.** $Z_{1}\defeq\bigvee_{a\in\pi_{1}(X,x_{0})}S^{1}$（0 胞体 $z_{0}$ 1 個と 1 胞体）とし、各円周を $a$ の代表の閉道で写して $f_{1}\colon(Z_{1},z_{0})\to(X,x_{0})$ とする。$f_{1*}\colon\pi_{1}(Z_{1})\to\pi_{1}(X)$ は全射で、$\pi_{0}$ はどちらも 1 点。

**Step 3（帰納法の仮定）.** $n\ge1$ について、次元 $n$ 以下の CW 複体 $Z_{n}$（0 胞体は $z_{0}$ だけ）と $f_{n}\colon(Z_{n},z_{0})\to(X,x_{0})$ で、$f_{n*}\colon\pi_{k}(Z_{n})\to\pi_{k}(X)$ が $k<n$ で同型、$k=n$ で全射とする。

**Step 4（$(n+1)$ 胞体と球面を貼る）.** $K_{n}\defeq\ker(f_{n*}\colon\pi_{n}(Z_{n})\to\pi_{n}(X))$ の各元 $\kappa$ に代表 $\varphi_{\kappa}\colon(S^{n},s_{0})\to(Z_{n},z_{0})$ を選び、これを貼り付け写像として $(n+1)$ 胞体 $e_{\kappa}$ を貼る。さらに各 $b\in\pi_{n+1}(X,x_{0})$ について $S^{n+1}$ を $z_{0}$ でウェッジする（0 胞体を $z_{0}$ に貼り付けた $(n+1)$ 胞体）。こうして得た $Z_{n+1}$ は次元 $n+1$ 以下の CW 複体で $Z_{n+1}^{n}=Z_{n}$。$f_{n}\circ\varphi_{\kappa}$ は $X$ で定値写像とホモトープなので、そのホモトピーで $f_{n}$ を $e_{\kappa}$ の上に延ばし、球面 $S^{n+1}_{b}$ は $b$ の代表で写して、$f_{n+1}\colon Z_{n+1}\to X$ を得る（商写像の普遍性で連続）。

**Step 5（帰納法の進行）.** $(Z_{n+1},Z_{n})$ の新しい胞体の次元は $n+1$ なので、\ref{at:cw-pair-connectivity.2} から $\pi_{k}(Z_{n})\to\pi_{k}(Z_{n+1})$ は $k<n$ で同型、$k=n$ で全射。$f_{n+1}$ は $f_{n}$ の延長なので：
- $k<n$：$f_{n+1*}$ は同型の合成で同型。
- $k=n$：全射は $f_{n*}$ の全射性から。単射：$f_{n+1*}\alpha=0$ なら、$\alpha$ は $\beta\in\pi_{n}(Z_{n})$ の像で $f_{n*}\beta=0$、すなわち $\beta=\kappa\in K_{n}$。$\varphi_{\kappa}$ は $e_{\kappa}$ の特性写像を通って $Z_{n+1}$ で定値写像とホモトープなので、$\alpha=0$。
- $k=n+1$：全射は、$b$ が $S^{n+1}_{b}$ の包含の類の像であることから。

**Step 6（極限）.** $Z\defeq\bigcup_{n}Z_{n}$ に弱位相を入れると、$Z^{n}=Z_{n}$ の CW 複体。$f\defeq\bigcup f_{n}$ は各胞体の上で連続なので連続（\ref{at:cw-closed-criterion.2}）。$(Z,Z_{k+1})$ の胞体の次元は $k+2$ 以上なので、\ref{at:cw-pair-connectivity.2} から $\pi_{k}(Z_{k+1})\cong\pi_{k}(Z)$。$f\restriction Z_{k+1}=f_{k+1}$ は $\pi_{k}$ の同型を誘導する（Step 5、$k<k+1$）ので、$f_{*}\colon\pi_{k}(Z)\to\pi_{k}(X)$ は同型。

::: hypcheck
- **選択公理**：代表の閉道・貼り付け写像・零ホモトピーの選択（無限個）に使った。
- **胞体近似**（\ref{at:cw-pair-connectivity}）：Step 5・6 で、高い次元の胞体を貼っても低い次元のホモトピー群が変わらないことに使った。これがこの構成の核心である。
- $X$ に何の仮定も置いていない：ワルシャワの円のような CW 複体でない空間にも CW 近似がある（その CW 近似は 1 点）。
:::
:::

::: supplement
**一般化と関連する事実.**
- **無限 CW 複体**：\ref{at:compression-lemma}を無限個の段の連結で一般の CW 対に示したので、上の定理は無限 CW 複体でも成り立つ。たとえば $S^{\infty}=\bigcup_{n}S^{n}$（各次元に 2 個ずつの胞体）はすべてのホモトピー群が消える（$S^{k}\to S^{\infty}$ の像はコンパクトなので有限部分複体、したがってある $S^{n}$（$n>k$）に入り（\ref{at:cw-finite-subcomplex}）、$\pi_{k}(S^{n})=0$（\ref{at:low-homotopy-spheres}）から基点を止めて定値写像とホモトープ）ので、1 点への写像は弱ホモトピー同値で、したがって可縮である。
- **CW 近似**（\ref{at:cw-approximation} で証明した）：弱ホモトピー同値は特異ホモロジー・コホモロジーの同型を誘導することが知られているので、特異理論は「CW 近似の上の理論」とみなせる。ワルシャワの円の特異ホモロジーが 1 点と同じになったこと（\ref{at:warsaw-singular}）はこの現象の一例。
- **ホモロジー版のホワイトヘッドの定理**：単連結な CW 複体の間の写像が整係数ホモロジーの同型を誘導するなら、ホモトピー同値である（相対版のフレヴィッツの定理による。知られている、本サイト未収録）。単連結性は外せない（ホモロジー的に自明だが可縮でない、非自明な完全群を基本群にもつ空間がある）。
- **相対フレヴィッツの定理**・**フロイデンタールの懸垂定理**（$\pi_{k}(S^{n})\to\pi_{k+1}(S^{n+1})$ は $k<2n-1$ で同型）により、球面の安定ホモトピー群が定まる（知られている。本サイト未収録）。

**高い視点.** ホワイトヘッドの定理は、CW 複体の上では「弱ホモトピー同値」と「ホモトピー同値」が一致することを言っている。モデル圏の言葉では、CW 複体が「コファイブラント対象」で、弱同値を可逆にした圏（ホモトピー圏）の射が CW 複体の間では本当のホモトピー類で計算できる、ということにあたる（知られている）。比喩で言えば、CW 複体は「部品の規格がそろった構造物」で、すべての球面の探針（ホモトピー群）で調べて一致すれば、実際に互いに変形できる。規格外の空間（ワルシャワの円）では、探針は一致しても変形はできない。
:::

## 問題 {#at:sec-hw-problems}

::: problem {#at:prob-hurewicz-wedge}
$n\ge2$ のとき、$\pi_{n}(S^{n}\vee S^{n})\cong\mathbb{Z}^{2}$ を、$S^{n}\vee S^{n}$ が $(n-1)$ 連結であること（\ref{at:cw-pair-connectivity}）とフレヴィッツの定理から導け（\ref{at:pin-wedge} とは別の証明になる）。
:::

::: solution
$S^{n}\vee S^{n}$ は 0 胞体 1 個と $n$ 胞体 2 個の CW 複体で、\ref{at:cw-pair-connectivity.2}（$A$ を 0 骨格 1 点、$X\setminus A$ の胞体は次元 $n$）から $k<n$ で $\pi_{k}(S^{n}\vee S^{n})\cong\pi_{k}(\ast)=0$ なので $(n-1)$ 連結。フレヴィッツの定理で $\pi_{n}\cong H_{n}\cong\mathbb{Z}^{2}$（\ref{at:prob-wedge-spheres}）。
:::

::: problem {#at:prob-h1-figure-eight}
8 の字形 $S^{1}\vee S^{1}$ の $H_{1}$ を、\ref{at:hurewicz-one} と \ref{at:wedge-circles-free} から求めよ。
:::

::: solution
$\pi_{1}=F(a,b)$ のアーベル化は $\mathbb{Z}^{2}$（\ref{grp:prob-free-abelianization}）なので $H_{1}\cong\mathbb{Z}^{2}$。
:::
