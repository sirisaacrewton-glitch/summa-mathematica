# ファイブレーション {#at:page-fibrations keywords="homotopy lifting property, Serre fibration, relative lifting for cubes, long exact sequence of homotopy groups of a fibration, covering maps are fibrations, higher homotopy groups of coverings, fiber bundle, local triviality, fiber bundles are Serre fibrations, Hopf fibration S^3 -> S^2, pi_2(S^2) = Z, pi_3(S^2) = pi_3(S^3)"}

被覆写像の「持ち上げ」の性質を、離散でないファイバーをもつ写像に一般化したものが**ファイブレーション**（ホモトピー持ち上げ性質をもつ写像）である。ファイブレーション $F\to E\to B$ では、ホモトピー群が長完全列
$$
\cdots\to\pi_{n}(F)\to\pi_{n}(E)\to\pi_{n}(B)\to\pi_{n-1}(F)\to\cdots
$$
でつながる。局所的に積の形をした**ファイバー束**はファイブレーションで、その代表例の**ホップ写像** $S^{3}\to S^{2}$（ファイバー $S^{1}$）から $\pi_{2}(S^{2})\cong\mathbb{Z}$ と $\pi_{3}(S^{2})\cong\pi_{3}(S^{3})$ が得られる。

> 資料：標準的な内容（小松・中岡・菅原『位相幾何学 I』のファイバー空間の章など）。証明は相対ホモトピー群の長完全列（\ref{at:homotopy-long-exact-pair}）に帰着させる標準的な流れを、自分で書き下ろした。

## 記法と定義の確認 {#at:sec-fb-notation}

::: notation
- 高次ホモトピー群・相対ホモトピー群・対の長完全列・$k<n$ での $\pi_{k}(S^{n})=0$ は \ref{at:homotopy-group}, \ref{at:relative-homotopy-group}, \ref{at:homotopy-long-exact-pair}, \ref{at:low-homotopy-spheres}。$J^{n-1}$ は $I^{n}$ の底面以外の面の和。
- 被覆と持ち上げの一意性・道とホモトピーの持ち上げ（格子を順に持ち上げる証明）は \ref{at:covering}, \ref{at:unique-lifting}, \ref{at:path-lifting}。
- $I^{k}\times I$ の**カップ** $\sqcup_{k}\defeq I^{k}\times\{0\}\cup\partial I^{k}\times I$。
- **選択公理**：使わない。
:::

## ファイブレーション {#at:sec-fb-definition}

::: lemma カップへのレトラクション {#at:cup-retraction keywords="I^k x I retracts onto I^k x 0 cup boundary I^k x I by radial projection" index="カップへのレトラクション|かっぷへのれとらくしょん"}
$I^{k}\times I$ から $\sqcup_{k}$ へのレトラクション $\rho_{k}$ がある。
:::

::: proof
$Q\defeq(m,2)$（$m$ は $I^{k}$ の中心）とし、$z\in I^{k}\times I$ について $Q$ から $z$ を通る半直線が最初に $\sqcup_{k}$ に達する点を $\rho_{k}(z)$ とする（$z$ より先の点。$Q$ は上方にあり、半直線は下面か側面で直方体を出る）。\ref{at:compression-criterion} の証明と同様に、出る点の径数は有限個の一次式の比の最小値で連続。$z\in\sqcup_{k}$ なら $\rho_{k}(z)=z$。
:::

::: definition セールファイブレーション {#at:serre-fibration keywords="Serre fibration: relative homotopy lifting property for cubes (I^k x I, cup)" index="セールファイブレーション|せーるふぁいぶれーしょん, ファイブレーション|ふぁいぶれーしょん, ホモトピー持ち上げ性質|ほもとぴーもちあげせいしつ"}
連続写像 $p\colon E\to B$ が**セールファイブレーション**であるとは、すべての $k\ge0$ と、連続写像 $G\colon I^{k}\times I\to B$, $\tilde G_{0}\colon\sqcup_{k}\to E$（$p\tilde G_{0}=G\restriction\sqcup_{k}$）について、$p\tilde G=G$, $\tilde G\restriction\sqcup_{k}=\tilde G_{0}$ となる連続写像 $\tilde G\colon I^{k}\times I\to E$ が存在することをいう（**立方体についての相対ホモトピー持ち上げ性質**）。$b_{0}\in B$ の**ファイバー**を $F\defeq p^{-1}(b_{0})$ とする。
:::

::: remark
$k=0$ では $\sqcup_{0}=\{0\}$ で、道の持ち上げの存在を言っている。「$I^{k}\times\{0\}$ の上の持ち上げだけから延ばせる」形（絶対形）と同値であることが知られている（$(I^{k}\times I,\sqcup_{k})$ と $(I^{k}\times I,I^{k}\times\{0\})$ が対として同相であることによる）が、ここでは相対形を定義とする。
:::

::: theorem ファイブレーションの長完全列 {#at:fibration-long-exact keywords="for a Serre fibration p_*: pi_n(E,F,x_0) -> pi_n(B,b_0) is an isomorphism; long exact sequence ... -> pi_n(F) -> pi_n(E) -> pi_n(B) -> pi_{n-1}(F) -> ..." index="ファイブレーションの長完全列|ふぁいぶれーしょんのちょうかんぜんれつ"}
$p\colon E\to B$ をセールファイブレーション、$b_{0}\in B$, $F=p^{-1}(b_{0})$, $x_{0}\in F$ とする。
1. $n\ge1$ で $p_{*}\colon\pi_{n}(E,F,x_{0})\to\pi_{n}(B,b_{0})$ は全単射（$n\ge2$ で群の同型）。
2. したがって完全列
$$
\cdots\to\pi_{n}(F,x_{0})\to\pi_{n}(E,x_{0})\xrightarrow{p_{*}}\pi_{n}(B,b_{0})\xrightarrow{\partial}\pi_{n-1}(F,x_{0})\to\cdots\to\pi_{0}(E,x_{0})
$$
がある。
:::

::: proof
以下、$\tau(s',s_{n})\defeq(s',1-s_{n})$（最後の座標の反転）とする。

**Step 1（全射）.** $f\colon(I^{n},\partial I^{n})\to(B,b_{0})$ をとり、$G\defeq f\circ\tau$ を $I^{n-1}\times I$（最後の座標を時間とする）上の写像と見る。$\tilde G_{0}$ を $\sqcup_{n-1}$ の上で定値 $x_{0}$ とする（$G$ は $\partial I^{n}\supset\sqcup_{n-1}$ を $b_{0}$ に写すので $p\tilde G_{0}=G$）。持ち上げ $\tilde G$ をとり、$\tilde f\defeq\tilde G\circ\tau$ とおく。$\tilde f$ は底面（$\tau$ で上面 $s_{n}=1$ に対応）を $p^{-1}(b_{0})=F$ に、残りの面（$\tau$ で $\sqcup_{n-1}$ に対応する $J^{n-1}$）を $x_{0}$ に写すので、$\pi_{n}(E,F,x_{0})$ の元で、$p\tilde f=f$。

**Step 2（単射）.** $f_{0},f_{1}\colon(I^{n},\partial I^{n},J^{n-1})\to(E,F,x_{0})$ について、$pf_{0}$ と $pf_{1}$ が $\pi_{n}(B,b_{0})$ のホモトピー $H\colon I^{n}\times I_{t}\to B$（$\partial I^{n}\times I_{t}$ を $b_{0}$ に）で結ばれるとする。$(n+1)$ 次元の立方体 $I^{n-1}\times I_{t}\times I_{s_{n}}$ を、$I^{n-1}\times I_{t}$（$n$ 次元の立方体）と「時間」$1-s_{n}$ の積と見ると、カップは「$s_{n}=1$ の面」と「$s'\in\partial I^{n-1}$ または $t\in\{0,1\}$ の面」の和。そこに持ち上げを、$s_{n}=1$ と $s'\in\partial I^{n-1}$ の面では $x_{0}$（$J^{n-1}$ の像）、$t=0,1$ の面では $f_{0}$, $f_{1}$ と与えると、両立していて $p$ で $H$ に写る。相対持ち上げで $\tilde H$ を得る。$\tilde H$ の $s_{n}=0$ の面は $p$ で $H(\partial I^{n}\times I)=b_{0}$ に写るので $F$ に入り、$J^{n-1}\times I_{t}$ は $x_{0}$ に写る。よって $\tilde H$ は $f_{0}$ から $f_{1}$ への、三つ組の写像のホモトピー。

**Step 3（長完全列）.** 対 $(E,F)$ の長完全列（\ref{at:homotopy-long-exact-pair}）で $\pi_{n}(E,F)$ を 1 の同型で $\pi_{n}(B)$ に置き換える。$\pi_{n}(E)\to\pi_{n}(E,F)\to\pi_{n}(B)$ の合成は $p_{*}$。$n\ge2$ での準同型性は、和が第 1 座標で定義され、Step 1・2 の構成がそれと両立することから。
:::

## 被覆とファイバー束 {#at:sec-fb-examples}

::: proposition 被覆はファイブレーション {#at:covering-fibration keywords="covering maps are Serre fibrations; pi_n(E) = pi_n(B) for n >= 2; pi_n(S^1) = 0 for n >= 2" index="被覆とホモトピー群|ひふくとほもとぴーぐん"}
被覆 $p\colon E\to B$ はセールファイブレーションで、$n\ge2$ で $p_{*}\colon\pi_{n}(E,x_{0})\cong\pi_{n}(B,b_{0})$。とくに $n\ge2$ で $\pi_{n}(S^{1})=0$, $\pi_{n}(T^{k})=0$, $\pi_{n}(\mathbb{R}P^{m})\cong\pi_{n}(S^{m})$。
:::

::: proof
**Step 1（持ち上げ）.** \ref{at:path-lifting} の証明は $I\times I$ を格子に分けて辞書式の順に持ち上げたが、$I^{k}\times I$ でも同じに進む：格子の小立方体を、最後の座標（時間）を最優先にした辞書式順序で並べると、小立方体とそれまでの小立方体の和との共通部分は、その立方体の「下側の面」（各座標で番号が $1$ より大きい方向の下の面）の和で、すべて最小の角を含むので連結。持ち上げの一意性（\ref{at:unique-lifting}）で貼り合わせられる。与えられた $\tilde G_{0}$ と一致することは、$I^{k}\times\{0\}$ の上で一致させてから持ち上げれば、$\partial I^{k}\times I$ の各線分 $\{x\}\times I$ の上で一意性から自動的に成り立つ。

**Step 2.** ファイバー $F=p^{-1}(b_{0})$ は離散なので $\pi_{n}(F)=0$（$n\ge1$）。長完全列から $\pi_{n}(E)\cong\pi_{n}(B)$（$n\ge2$）。$\mathbb{R}\to S^{1}$, $\mathbb{R}^{k}\to T^{k}$ は可縮な空間からの被覆、$S^{m}\to\mathbb{R}P^{m}$ は二重被覆。
:::

::: definition ファイバー束 {#at:fiber-bundle keywords="fiber bundle with fiber F: locally trivial map, local trivializations" index="ファイバー束|ふぁいばーそく, 局所自明|きょくしょじめい, 局所自明化|きょくしょじめいか"}
連続写像 $p\colon E\to B$ と空間 $F$ について、各点 $b\in B$ に開近傍 $U$ と同相写像 $h\colon p^{-1}(U)\to U\times F$ で $\mathrm{pr}_{U}\circ h=p$ となるもの（**局所自明化**）があるとき、$p$ を**ファイバー $F$ のファイバー束**という。
:::

::: theorem ファイバー束はファイブレーション {#at:bundle-fibration keywords="every fiber bundle is a Serre fibration" index="ファイバー束とファイブレーション|ふぁいばーそくとふぁいぶれーしょん"}
ファイバー束はセールファイブレーションである。
:::

::: proof
**Step 1（自明な束）.** $E=U\times F$ のとき：$G\colon I^{k}\times I\to U$ と $\tilde G_{0}=(G,\gamma_{0})$（$\gamma_{0}\colon\sqcup_{k}\to F$）について、$\tilde G\defeq(G,\gamma_{0}\circ\rho_{k})$（\ref{at:cup-retraction}）が求める持ち上げ。同じことは、立方体 $C$ と、$C$ の面の一部と底面からなる「カップ」についても、対応するレトラクションがあれば成り立つ。

**Step 2（細分）.** $G\colon I^{k}\times I\to B$ について、局所自明化の開集合の $G$ による逆像はコンパクト距離空間 $I^{k}\times I$ の開被覆なので、ルベーグ数で $I^{k}$ を一辺 $\frac1N$ の格子に、$I$ を長さ $\frac1N$ の区間に分けると、各 $C\times[t_{j},t_{j+1}]$（$C$ は格子の小立方体）は 1 つの局所自明化の開集合 $U_{C,j}$ の中に写る。

**Step 3（骨格ごとに持ち上げる）.** $j=0,1,\dots$ の順に、帯 $I^{k}\times[t_{j},t_{j+1}]$ の上の持ち上げを作る（$I^{k}\times\{t_{j}\}$ の上では前の帯から、$\partial I^{k}\times I$ の上では $\tilde G_{0}$ から与えられている）。帯の中では、格子の面（次元 $0,1,\dots,k$ の小立方体の面）$e$ を次元の低い順にとり、$\partial I^{k}$ に含まれないものについて、$e\times[t_{j},t_{j+1}]$ の上の持ち上げを、既に定まった $e\times\{t_{j}\}\cup\partial e\times[t_{j},t_{j+1}]$（$e$ についてのカップ）から Step 1 で延ばす（$e\times[t_{j},t_{j+1}]$ は $U_{C,j}$ の中に写り、そこで束は自明）。面の共通部分は低い次元の面で、そこでは先に定めた値と一致するので、有限個の閉集合の上の連続写像として貼り合わせられる（\ref{top:pasting-lemma}）。
:::

::: example ホップ写像
$S^{3}=\{(z_{1},z_{2})\in\mathbb{C}^{2}:|z_{1}|^{2}+|z_{2}|^{2}=1\}$ から $\mathbb{C}P^{1}=S^{3}/S^{1}$ への商写像 $h(z_{1},z_{2})=[z_{1}:z_{2}]$ を**ホップ写像**という。
1. $\mathbb{C}P^{1}\cong S^{2}$：$\mathbb{C}P^{1}$ は 0 胞体 1 個と 2 胞体 1 個の CW 複体（\ref{at:projective-space-homology}）で、2 胞体は定値写像で貼られるので $D^{2}/S^{1}\cong S^{2}$。
2. $h$ はファイバー $S^{1}$ のファイバー束：$U_{1}\defeq\{[z_{1}:z_{2}]:z_{1}\ne0\}$ の上で $(z_{1},z_{2})\mapsto([z_{1}:z_{2}],z_{1}/|z_{1}|)$ は $h^{-1}(U_{1})\to U_{1}\times S^{1}$ の同相写像（逆写像は $([1:w],\lambda)\mapsto\lambda(1,w)/\sqrt{1+|w|^{2}}$）。$U_{2}=\{z_{2}\ne0\}$ も同様で、$U_{1}\cup U_{2}=\mathbb{C}P^{1}$。
:::

::: corollary 2 次元球面のホモトピー群 {#at:pi2-pi3-s2 keywords="pi_2(S^2) = Z and pi_n(S^2) = pi_n(S^3) for n >= 3 via the Hopf fibration" index="2 次元球面のホモトピー群|にじげんきゅうめんのほもとぴーぐん"}
$\pi_{2}(S^{2})\cong\mathbb{Z}$、$n\ge3$ で $\pi_{n}(S^{2})\cong\pi_{n}(S^{3})$（ホップ写像の誘導写像による）。
:::

::: proof
ホップ写像の長完全列（\ref{at:fibration-long-exact}, \ref{at:bundle-fibration}）
$$
\pi_{n}(S^{1})\to\pi_{n}(S^{3})\to\pi_{n}(S^{2})\to\pi_{n-1}(S^{1})\to\pi_{n-1}(S^{3})
$$
で、$\pi_{n}(S^{1})=0$（$n\ge2$, \ref{at:covering-fibration}）、$\pi_{k}(S^{3})=0$（$k\le2$, \ref{at:low-homotopy-spheres}）。$n=2$：$0\to\pi_{2}(S^{2})\to\pi_{1}(S^{1})\cong\mathbb{Z}\to\pi_{1}(S^{3})=0$。$n\ge3$：$0\to\pi_{n}(S^{3})\to\pi_{n}(S^{2})\to\pi_{n-1}(S^{1})=0$。
:::

::: supplement
**一般化.** $S^{2n+1}\to\mathbb{C}P^{n}$（ファイバー $S^{1}$）から $\pi_{2}(\mathbb{C}P^{n})\cong\mathbb{Z}$、$\pi_{k}(\mathbb{C}P^{n})\cong\pi_{k}(S^{2n+1})$（$k\ge3$）。四元数のホップ写像 $S^{7}\to S^{4}$（ファイバー $S^{3}$）、八元数の $S^{15}\to S^{8}$（ファイバー $S^{7}$）もファイバー束であることが知られており、ファイバー・全空間・底空間がすべて球面であるファイバー束はこれらとその自明な類似に限られる（アダムズのホップ不変量 1 の定理による。本サイト未収録）。$\pi_{3}(S^{3})\cong\mathbb{Z}$ はフレヴィッツの定理（\ref[フレヴィッツとホワイトヘッドの定理]{at:page-hurewicz-whitehead}）から従い、$\pi_{3}(S^{2})\cong\mathbb{Z}$ はホップ写像で生成される。

**高い視点.** ファイブレーションは「ホモトピーの意味での束」で、その長完全列はホモトピー論における短完全列の役割を果たす。道の空間のファイブレーション $\Omega B\to PB\to B$（$PB$ は基点から出る道の空間で可縮）からは $\pi_{n}(\Omega B)\cong\pi_{n+1}(B)$ が従う（知られている：$\Omega B$ のホモトピー群が 1 次ずれて $B$ のホモトピー群になる。\ref{cat:page-loops-suspensions} のループ空間）。比喩で言えば、ファイブレーションは「各点の上に同じ形のファイバーが、連続的にねじれながら並んだもの」で、全空間の巻きつき方（ホモトピー群）は、底空間の巻きつき方とファイバーの巻きつき方から、ねじれ（連結射 $\partial$）の補正を受けて組み立てられる。ホップ写像では、$S^{2}$ を一周する 2 次元の巻きつきが、ファイバー $S^{1}$ を 1 回まわるねじれとして現れる。
:::

## 問題 {#at:sec-fb-problems}

::: problem {#at:prob-product-fibration}
射影 $B\times F\to B$ はファイバー束で、その長完全列は分裂して $\pi_{n}(B\times F)\cong\pi_{n}(B)\times\pi_{n}(F)$（\ref{at:prob-pin-product}）と一致することを確かめよ。
:::

::: solution
局所自明化は恒等写像。切断 $b\mapsto(b,f_{0})$ が $p_{*}$ の右逆を与えるので $p_{*}$ は全射、連結射 $\partial$ は $0$（$\partial$ の核 $=\operatorname{im}p_{*}$ が全体）で、$\pi_{n}(F)\to\pi_{n}(B\times F)$ は単射。完全列 $0\to\pi_{n}(F)\to\pi_{n}(B\times F)\to\pi_{n}(B)\to0$ は切断で分裂し、$n\ge2$（可換）で直積と一致。
:::

::: problem {#at:prob-pi2-cpn}
$\pi_{2}(\mathbb{C}P^{n})\cong\mathbb{Z}$ と $\pi_{1}(\mathbb{C}P^{n})=0$ を、ファイバー束 $S^{1}\to S^{2n+1}\to\mathbb{C}P^{n}$ から導け（局所自明性は、ホップ写像と同じく $z_{i}\ne0$ の開集合で確かめられる）。
:::

::: solution
長完全列 $\pi_{2}(S^{2n+1})\to\pi_{2}(\mathbb{C}P^{n})\to\pi_{1}(S^{1})\to\pi_{1}(S^{2n+1})\to\pi_{1}(\mathbb{C}P^{n})\to\pi_{0}(S^{1})$ で、$\pi_{k}(S^{2n+1})=0$（$k\le2<2n+1$, $n\ge1$）、$\pi_{0}(S^{1})$ は 1 点。よって $\pi_{2}(\mathbb{C}P^{n})\cong\pi_{1}(S^{1})\cong\mathbb{Z}$、$\pi_{1}(\mathbb{C}P^{n})=0$。
:::
