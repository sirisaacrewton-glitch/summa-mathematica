# キャップ積とポアンカレ双対性 {#at:page-poincare-duality keywords="cap product, boundary formula for cap product, compactly supported cohomology, duality map, Poincare duality for oriented manifolds, Mayer-Vietoris for compactly supported cohomology, cup product pairing is nondegenerate, Euler characteristic of odd-dimensional closed manifolds, cohomology rings of complex and real projective spaces, intersection form, signature"}

向き付けられた閉 $n$ 次元多様体 $M$ では、$k$ 次のコホモロジーと $n-k$ 次のホモロジーが、基本類 $[M]$ との**キャップ積**で同型になる：
$$
H^{k}(M;R)\xrightarrow{\ [M]\cap-\ }H_{n-k}(M;R).
$$
これが**ポアンカレ双対性**で、多様体の（コ）ホモロジーに強い対称性を課す。証明は、コンパクトでない多様体にも通用する形（コンパクト台コホモロジー）で、$\mathbb{R}^{n}$ から始めてマイヤー–ヴィートリスと増大列の和で一般の多様体に広げる。応用として、カップ積による双線形形式の非退化性、奇数次元の閉多様体のオイラー標数が $0$ であること、$\mathbb{C}P^{n}$ と $\mathbb{R}P^{n}$ のコホモロジー環を示す。

> 資料：標準的な内容（Massey『Singular Homology Theory』のポアンカレ双対性の章など）。証明の流れ（$\mathbb{R}^{n}$ → 開直方体の有限和 → 開集合 → 多様体）は標準的なものを、自分で書き下ろした。

## 記法と定義の確認 {#at:sec-pd-notation}

::: notation
- 多様体・向き・基本類と基本類の補題は \ref{at:topological-manifold}, \ref{at:orientation}, \ref{at:fundamental-class-lemma}, \ref{at:top-homology-closed-manifold}。$H_{i}(M|A)\defeq H_{i}(M,M\setminus A)$、$H^{i}(M|A)\defeq H^{i}(M,M\setminus A)$。
- 特異コホモロジー・カップ積・普遍係数定理は \ref{at:singular-cohomology}, \ref{at:cup-product}, \ref{at:uct-cohomology}。小さい単体の定理 \ref{at:small-simplices}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}、切除 \ref{at:excision}、コンパクト台 \ref{at:compact-support}。
- 有向集合上の余極限（帰納極限）は完全列を保つ（アーベル群の有向系の余極限は完全関手）。
- 多様体は**第二可算**（可算個の開集合からなる開基をもつ）と仮定する。
- **選択公理**：使わない（第二可算性の仮定で、ツォルンの補題を避ける）。
:::

## キャップ積 {#at:sec-pd-cap}

::: definition キャップ積 {#at:cap-product keywords="cap product sigma cap phi = phi(front face) back face, H_k x H^l -> H_{k-l}" index="キャップ積|きゃっぷせき"}
特異 $k$ 単体 $\sigma$ と $\varphi\in S^{l}(X;R)$（$l\le k$）について
$$
\sigma\cap\varphi\defeq\varphi\bigl(\sigma\restriction[e_{0},\dots,e_{l}]\bigr)\,\sigma\restriction[e_{l},\dots,e_{k}]\in S_{k-l}(X;R)
$$
とし、双線形に延ばす。
:::

::: lemma キャップ積の境界 {#at:cap-boundary keywords="boundary(sigma cap phi) = (-1)^l (boundary sigma cap phi - sigma cap delta phi)" index="キャップ積の境界公式|きゃっぷせきのきょうかいこうしき"}
$\partial(\sigma\cap\varphi)=(-1)^{l}\bigl(\partial\sigma\cap\varphi-\sigma\cap\delta\varphi\bigr)$。したがってキャップ積は $H_{k}(X;R)\times H^{l}(X;R)\to H_{k-l}(X;R)$ と、相対版 $H_{k}(X,A;R)\times H^{l}(X,A;R)\to H_{k-l}(X;R)$, $H_{k}(X,A;R)\times H^{l}(X;R)\to H_{k-l}(X,A;R)$ を誘導する。$\psi(\alpha\cap\varphi)=(\varphi\cup\psi)(\alpha)$、$f_{*}(\alpha)\cap\varphi=f_{*}(\alpha\cap f^{*}\varphi)$。
:::

::: proof
**Step 1（境界公式）.** $[i_{0},\dots]$ で $\sigma\restriction[e_{i_{0}},\dots]$ を表す。
$$
\begin{aligned}
\partial\sigma\cap\varphi&=\sum_{i\le l}(-1)^{i}\varphi([0..\hat i..l+1])\,[l+1..k]+\sum_{i\ge l+1}(-1)^{i}\varphi([0..l])\,[l..\hat i..k],\\
\sigma\cap\delta\varphi&=\sum_{i=0}^{l+1}(-1)^{i}\varphi([0..\hat i..l+1])\,[l+1..k].
\end{aligned}
$$
差をとると、$i\le l$ の項は打ち消し、$\sigma\cap\delta\varphi$ の $i=l+1$ の項 $(-1)^{l+1}\varphi([0..l])[l+1..k]$ が符号を変えて残る。よって $\partial\sigma\cap\varphi-\sigma\cap\delta\varphi=\sum_{i\ge l}(-1)^{i}\varphi([0..l])[l..\hat i..k]$。一方 $\partial(\sigma\cap\varphi)=\varphi([0..l])\sum_{i\ge l}(-1)^{i-l}[l..\hat i..k]$。

**Step 2（誘導）.** 境界公式から、サイクル $\cap$ コサイクルはサイクル、境界 $\cap$ コサイクルと サイクル $\cap$ コバウンダリは境界。相対版：$\sigma$ が $A$ の単体なら $\sigma\cap\varphi$ も $A$ の鎖で、$\varphi$ が $A$ の単体で $0$ なら $A$ の単体との積は $0$。

**Step 3.** $\psi(\sigma\cap\varphi)=\varphi([0..l])\psi([l..k])=(\varphi\cup\psi)(\sigma)$。自然性は $f\circ(\sigma\restriction[\cdots])=(f\sigma)\restriction[\cdots]$ から。
:::

## コンパクト台コホモロジーと双対写像 {#at:sec-pd-compact}

::: definition コンパクト台コホモロジー {#at:compact-support-cohomology keywords="compactly supported cohomology H^k_c(M) = colim over compact K of H^k(M, M - K); extension by zero for open inclusions" index="コンパクト台コホモロジー|こんぱくとだいこほもろじー"}
空間 $X$ のコンパクト集合の族を包含で有向集合と見て、$K\subset L$ のとき制限 $H^{k}(X|K;R)\to H^{k}(X|L;R)$（対の包含 $(X,X\setminus L)\to(X,X\setminus K)$ の誘導写像）による余極限
$$
H^{k}_{c}(X;R)\defeq\varinjlim_{K}H^{k}(X|K;R)
$$
を**コンパクト台コホモロジー**という。$X$ がコンパクトなら $H^{k}_{c}(X)=H^{k}(X)$（$K=X$ が最大元）。
:::

::: lemma 開集合からの延長 {#at:compact-support-extension keywords="for an open U in M, excision identifies H^k(U|K) with H^k(M|K) for compact K in U, giving H^k_c(U) -> H^k_c(M)" index="ゼロ延長|ぜろえんちょう"}
$U\subset M$ が開で $K\subset U$ がコンパクトなら、切除で $H^{k}(M|K)\cong H^{k}(U|K)$。これから $H^{k}_{c}(U)\to H^{k}_{c}(M)$ が定まり、開集合の包含について共変関手的。
:::

::: proof
$Z\defeq M\setminus U$ は閉で、$M\setminus K$（開、$K$ はハウスドルフ空間のコンパクト集合なので閉）に含まれる。切除（\ref{at:cohomology-axioms.3}）で $(M\setminus Z,(M\setminus K)\setminus Z)=(U,U\setminus K)$。
:::

::: example
$\mathbb{R}^{n}$ では閉球 $B$ たちが共終で、$H^{k}(\mathbb{R}^{n}|B;R)$ は $k=n$ で $R$、他は $0$（\ref{at:local-homology-ball} と普遍係数定理：$H_{n-1}(\mathbb{R}^{n}|B)=0$ なので Ext は消える）。球の間の制限は同型なので $H^{n}_{c}(\mathbb{R}^{n};R)\cong R$、$H^{k}_{c}(\mathbb{R}^{n};R)=0$（$k\ne n$）。$H^{0}(\mathbb{R}^{n})=R$ とは異なる。
:::

::: definition 双対写像 {#at:duality-map keywords="duality map D_M: H^k_c(M) -> H_{n-k}(M) given by capping with mu_K" index="双対写像|そうついしゃぞう"}
$R$ 向き付けられた $n$ 次元多様体 $M$ とコンパクト集合 $K$ について、$\mu_{K}\in H_{n}(M|K;R)$ を、各 $x\in K$ で向き $\mu_{x}$ に制限される類とする（\ref{at:fundamental-class-lemma.3}）。$D_{K}\colon H^{k}(M|K)\to H_{n-k}(M)$, $\varphi\mapsto\mu_{K}\cap\varphi$ とおく。$K\subset L$ なら $\mu_{L}$ は $\mu_{K}$ に制限され、キャップ積の自然性から $D_{L}(\varphi|_{L})=D_{K}(\varphi)$。よって**双対写像** $D_{M}\colon H^{k}_{c}(M;R)\to H_{n-k}(M;R)$ が定まる。
:::

::: theorem ポアンカレ双対性 {#at:poincare-duality keywords="Poincare duality: for an R-oriented n-manifold D_M: H^k_c(M;R) -> H_{n-k}(M;R) is an isomorphism; for closed M, [M] cap -: H^k -> H_{n-k} is an isomorphism" index="ポアンカレ双対性|ぽあんかれそうついせい"}
$M$ を第二可算な $R$ 向き付けられた $n$ 次元多様体とする。すべての $k$ で $D_{M}\colon H^{k}_{c}(M;R)\to H_{n-k}(M;R)$ は同型。とくに $M$ が閉なら、$[M]\cap-\colon H^{k}(M;R)\to H_{n-k}(M;R)$ は同型。
:::

::: lemma マイヤー–ヴィートリスと双対写像 {#at:pd-mayer-vietoris keywords="the duality maps commute up to sign with the Mayer-Vietoris sequences for compactly supported cohomology and homology" index="双対写像とマイヤー–ヴィートリス|そうついしゃぞうとまいやーびーとりす"}
$M=U\cup V$（$U,V$ 開）について、コンパクト台コホモロジーのマイヤー–ヴィートリス完全列
$$
\cdots\to H^{k}_{c}(U\cap V)\to H^{k}_{c}(U)\oplus H^{k}_{c}(V)\to H^{k}_{c}(M)\xrightarrow{\delta}H^{k+1}_{c}(U\cap V)\to\cdots
$$
があり、$D_{U\cap V}$, $D_{U}\oplus D_{V}$, $D_{M}$ はホモロジーのマイヤー–ヴィートリス完全列（\ref{at:mayer-vietoris}、次数 $n-k$）への写像として、符号を除いて可換な図式をなす。したがって $D_{U\cap V}$, $D_{U}$, $D_{V}$ が同型なら $D_{M}$ も同型。
:::

::: proof
**Step 1（コンパクト台の列）.** コンパクト集合 $K\subset U$, $L\subset V$ について、$M\setminus K$, $M\setminus L$ は開でその和は $M\setminus(K\cap L)$、共通部分は $M\setminus(K\cup L)$。相対版のマイヤー–ヴィートリス（\ref{at:fundamental-class-lemma} の Step 1 の列のコホモロジー版）
$$
H^{k}(M|K\cap L)\to H^{k}(M|K)\oplus H^{k}(M|L)\to H^{k}(M|K\cup L)\xrightarrow{\delta}H^{k+1}(M|K\cap L)
$$
で、切除（\ref{at:compact-support-extension}）により $H^{k}(M|K\cap L)\cong H^{k}(U\cap V|K\cap L)$, $H^{k}(M|K)\cong H^{k}(U|K)$, $H^{k}(M|L)\cong H^{k}(V|L)$ と置き換える。$M$ のコンパクト集合 $C$ は、ある $K\cup L$（$K\subset U$, $L\subset V$ コンパクト）に含まれる：$C$ の各点は、$U$ か $V$ に含まれるコンパクトな近傍をもつ（$M$ は局所コンパクト・ハウスドルフ）ので、有限個の近傍の内部で $C$ を覆い、$U$ に含まれるものの和を $K$、残り（$V$ に含まれる）の和を $L$ とする。$U\cap V$ のコンパクト集合 $C$ は $K=L=C$ とすれば $K\cap L$ の形。有向系の余極限は完全なので、主張の列が得られる。

**Step 2（最初の二つの四角形）.** 制限・延長写像とキャップ積の自然性から可換。

**Step 3（連結射の四角形）.** $\varphi\in S^{k}(M|K\cup L)$ をコサイクルとする（$M\setminus(K\cup L)$ の単体で $0$）。$\varphi=\varphi_{K}-\varphi_{L}$（$\varphi_{K}$ は $M\setminus K$ の単体で $0$、$\varphi_{L}$ は $M\setminus L$ の単体で $0$）と分ける：単体 $\tau$ が $M\setminus L$ に入れば $\varphi_{K}(\tau)\defeq\varphi(\tau)$, $\varphi_{L}(\tau)\defeq0$、入らなければ $\varphi_{K}(\tau)\defeq0$, $\varphi_{L}(\tau)\defeq-\varphi(\tau)$（$\tau$ が $M\setminus K$ と $M\setminus L$ の両方に入るときは $\varphi(\tau)=0$ なので条件と矛盾しない）。連結射は $\delta[\varphi]=[\delta\varphi_{K}]=[\delta\varphi_{L}]$（$\delta\varphi=0$ から $\delta\varphi_{K}=\delta\varphi_{L}$ で、これは $M\setminus K$ と $M\setminus L$ のどちらの単体でも $0$、すなわち $H^{k+1}(M|K\cap L)$ のコサイクル）。一方、$\mu_{K\cup L}$ を、小さい単体の定理で開被覆 $\{U\setminus L,\ U\cap V,\ V\setminus K\}$（これは $M$ を覆う）に関して小さい相対サイクル $\alpha=\alpha_{U\setminus L}+\alpha_{U\cap V}+\alpha_{V\setminus K}$ で代表すると、$\alpha_{U\cap V}$ は $\mu_{K\cap L}$ を代表する（$K\cap L$ の各点への制限を比べる）。

$D_{M}[\varphi]=[\alpha\cap\varphi]$ で、$\alpha\cap\varphi=\alpha\cap\varphi_{K}-\alpha\cap\varphi_{L}$。$\alpha_{V\setminus K}\cap\varphi_{K}=0$（前面が $M\setminus K$ に入る）なので $\alpha\cap\varphi_{K}$ は $U$ の鎖、同様に $\alpha\cap\varphi_{L}$ は $V$ の鎖。ホモロジーのマイヤー–ヴィートリスの連結射は $[\partial(\alpha\cap\varphi_{K})]$ を与え、境界公式（\ref{at:cap-boundary}）から
$$
\partial(\alpha\cap\varphi_{K})=(-1)^{k}\bigl(\partial\alpha\cap\varphi_{K}-\alpha\cap\delta\varphi_{K}\bigr)=(-1)^{k+1}\alpha_{U\cap V}\cap\delta\varphi_{K}
$$
（$\partial\alpha$ は $M\setminus(K\cup L)\subset M\setminus K$ の鎖で、前面が $M\setminus K$ に入るので $\partial\alpha\cap\varphi_{K}=0$。$\delta\varphi_{K}$ は $M\setminus K$ と $M\setminus L$ の単体で $0$ なので、$\alpha_{U\setminus L}$ と $\alpha_{V\setminus K}$ とのキャップ積は $0$）。右辺は $(-1)^{k+1}D_{U\cap V}(\delta[\varphi])$ の代表元。よってこの四角形は符号 $(-1)^{k+1}$ を除いて可換。

**Step 4.** 符号は同型性に影響しないので、五項補題から $D_{M}$ は同型。
:::

::: proof
（\ref{at:poincare-duality} の証明）

**Step 1（$\mathbb{R}^{n}$ と開直方体）.** $M=\mathbb{R}^{n}$：上の例から $H^{k}_{c}=0$（$k\ne n$）, $H_{n-k}(\mathbb{R}^{n})=0$（$k\ne n$）。$k=n$ では閉球 $B$ と $H^{n}(\mathbb{R}^{n}|B;R)\cong\mathrm{Hom}(H_{n}(\mathbb{R}^{n}|B),R)$ の元 $\varphi$ について、$H_{0}(\mathbb{R}^{n})\cong R$（添加写像）で $\varepsilon(\mu_{B}\cap\varphi)=\varphi(\mu_{B})$（次数 $n$ の単体と次数 $n$ のコチェインのキャップ積は、値 $\varphi(\sigma)$ を係数とする点）。$\mu_{B}$ は生成元なので $\varphi\mapsto\varphi(\mu_{B})$ は同型。開直方体 $\prod(a_{i},b_{i})$ は $\mathbb{R}^{n}$ と同相（座標ごとの同相 $(a,b)\cong\mathbb{R}$）で、向きの同相写像は双対写像と両立するので同型。

**Step 2（開直方体の有限和）.** $W=Q_{1}\cup\dots\cup Q_{m}$（$Q_{j}$ は開直方体）について $m$ の帰納法：$W'=Q_{1}\cup\dots\cup Q_{m-1}$ と $Q_{m}$、$W'\cap Q_{m}=\bigcup_{j<m}(Q_{j}\cap Q_{m})$（$m-1$ 個の開直方体の和。直方体の共通部分は直方体か空）で同型なので、\ref{at:pd-mayer-vietoris}。

**Step 3（増大列の和）.** $W=\bigcup_{i}W_{i}$（$W_{1}\subset W_{2}\subset\cdots$ 開）で各 $D_{W_{i}}$ が同型なら $D_{W}$ も同型：コンパクト集合はある $W_{i}$ に入るので $H^{k}_{c}(W)=\varinjlim H^{k}_{c}(W_{i})$（\ref{at:compact-support-extension}）、鎖のコンパクト台から $H_{n-k}(W)=\varinjlim H_{n-k}(W_{i})$（\ref{at:compact-support}）、$D$ はこれらと両立し、同型の余極限は同型。

**Step 4（$\mathbb{R}^{n}$ の開集合）.** 開集合 $W\subset\mathbb{R}^{n}$ は、有理数の端点をもち $W$ に含まれる開直方体（可算個）の和。それらを並べて $W_{i}\defeq Q_{1}\cup\dots\cup Q_{i}$ とすると、Step 2・3 から $D_{W}$ は同型。

**Step 5（多様体）.** 第二可算性から、$M$ は可算個の座標近傍 $V_{1},V_{2},\dots$（各 $V_{j}$ は $\mathbb{R}^{n}$ の開集合と同相）で覆える。$V_{j}$ の開部分集合は $\mathbb{R}^{n}$ の開集合と同相なので Step 4 から双対写像は同型。$M_{i}\defeq V_{1}\cup\dots\cup V_{i}$ について帰納法：$M_{i-1}\cap V_{i}$ は $V_{i}$ の開集合なので同型、\ref{at:pd-mayer-vietoris} で $D_{M_{i}}$ は同型。Step 3 で $D_{M}$ は同型。

**Step 6（閉多様体）.** $M$ がコンパクトなら $H^{k}_{c}=H^{k}$、$\mu_{M}=[M]$。

::: hypcheck
- **向き**：$\mu_{K}$ の存在（Step 1 の $\mu_{B}$、双対写像の定義）に使った。向き付け不可能なら $\mathbb{Z}$ 係数では偽（$\mathbb{R}P^{2}$：$H^{0}=\mathbb{Z}$ だが $H_{2}=0$）。$\mathbb{Z}/2$ 係数ではすべての多様体で成り立つ。
- **第二可算**：Step 5 で可算個の座標近傍をとるのに使った。外す場合はツォルンの補題（極大な開集合で双対写像が同型なもの）で同じ結論が得られることが知られている。
- **境界がない**こと：局所ホモロジー（\ref{at:local-homology-ball}）に使った。境界付き多様体ではルフシェッツ双対性 $H^{k}(M;R)\cong H_{n-k}(M,\partial M;R)$ に替わることが知られている。
:::
:::

## 応用 {#at:sec-pd-applications}

::: corollary カップ積の非退化性 {#at:cup-pairing-nondegenerate keywords="for a closed R-oriented manifold over a field F, (a,b) -> <a cup b, [M]> is a nondegenerate pairing H^k x H^{n-k} -> F" index="カップ積の非退化性|かっぷせきのひたいかせい"}
$M$ を体 $F$ について向き付けられた閉 $n$ 次元多様体（$F=\mathbb{Z}/2$ ならすべての閉多様体）とする。$H^{k}(M;F)\times H^{n-k}(M;F)\to F$, $(a,b)\mapsto\langle a\cup b,[M]\rangle$ は非退化。とくに $\dim H^{k}(M;F)=\dim H^{n-k}(M;F)$。
:::

::: proof
$\langle a\cup b,[M]\rangle=\langle b,[M]\cap a\rangle$（\ref{at:cap-boundary}）。$a\ne0$ なら $[M]\cap a\ne0$（ポアンカレ双対性）で、体係数の普遍係数定理（$H^{n-k}(M;F)\cong\mathrm{Hom}_{F}(H_{n-k}(M;F),F)$）から $\langle b,[M]\cap a\rangle\ne0$ となる $b$ がある。左右対称な議論（$b\ne0$ のときは次数付き可換性で $a\cup b=\pm b\cup a$）で両側の非退化性。次元は双対写像と普遍係数定理で $H^{k}\cong H_{n-k}\cong(H^{n-k})^{*}$。
:::

::: corollary 奇数次元のオイラー標数 {#at:odd-dimension-euler keywords="closed manifolds of odd dimension with finitely generated homology have Euler characteristic zero" index="奇数次元閉多様体のオイラー標数|きすうじげんへいたようたいのおいらーひょうすう"}
$n$ が奇数で、$M$ が閉 $n$ 次元多様体でホモロジーが有限生成なら $\chi(M)=0$。
:::

::: proof
$\chi(M)=\sum(-1)^{k}\dim H_{k}(M;\mathbb{Z}/2)$（有限生成なアーベル群の鎖複体について、$\mathbb{Q}$ 係数と $\mathbb{Z}/2$ 係数の交代和が一致する：普遍係数定理で $\dim H_{k}(\,;\mathbb{Z}/2)=\operatorname{rank}H_{k}+t_{k}+t_{k-1}$（$t_{k}$ は $H_{k}$ の 2 準素部分の巡回因子の数）で、$t$ の項は交代和で打ち消す）。\ref{at:cup-pairing-nondegenerate}（$\mathbb{Z}/2$ 係数）から $b_{k}=b_{n-k}$ で、$n$ が奇数なら $(-1)^{k}$ と $(-1)^{n-k}$ は逆符号なので和は $0$。
:::

::: theorem 射影空間のコホモロジー環 {#at:projective-cohomology-rings keywords="H^*(CP^n;Z) = Z[x]/(x^{n+1}) with |x| = 2, H^*(RP^n;Z/2) = Z/2[x]/(x^{n+1}) with |x| = 1" index="射影空間のコホモロジー環|しゃえいくうかんのこほもろじーかん"}
$$
H^{*}(\mathbb{C}P^{n};\mathbb{Z})\cong\mathbb{Z}[x]/(x^{n+1})\ (|x|=2),\qquad H^{*}(\mathbb{R}P^{n};\mathbb{Z}/2)\cong\mathbb{Z}/2[x]/(x^{n+1})\ (|x|=1).
$$
:::

::: proof
**Step 1（多様体であること）.** $\mathbb{C}P^{n}$ は $U_{i}\defeq\{[z]:z_{i}\ne0\}$ が $[z]\mapsto(z_{j}/z_{i})_{j\ne i}$ で $\mathbb{C}^{n}$ と同相になる（逆写像は $w\mapsto[w_{0},\dots,1,\dots,w_{n}]$ を正規化したもの）ので $2n$ 次元多様体で、ハウスドルフ（\ref{at:projective-space-homology} の hypcheck）、コンパクト、第二可算（有限個の座標近傍）。CW 構造（\ref{at:projective-space-homology}）の 2 骨格は $\mathbb{C}P^{1}\cong S^{2}$ で、3 次元以上の胞体は基本群を変えない（\ref{at:attaching-2-cell}）ので単連結、よって向き付け可能（\ref{at:orientation-cover.3}）。$\mathbb{R}P^{n}$ も同様に $n$ 次元の閉多様体で、$\mathbb{Z}/2$ 向き付け可能。

**Step 2（制限）.** $\mathbb{C}P^{n}=\mathbb{C}P^{n-1}\cup e^{2n}$ で、相対コホモロジー $H^{*}(\mathbb{C}P^{n},\mathbb{C}P^{n-1})$ は次数 $2n$ だけ（胞体コホモロジー）なので、包含の誘導写像 $H^{i}(\mathbb{C}P^{n})\to H^{i}(\mathbb{C}P^{n-1})$ は $i\le2n-2$ で同型。

**Step 3（帰納法）.** $n$ についての帰納法で「$x\in H^{2}$ の生成元について $x^{k}$ が $H^{2k}(\mathbb{C}P^{n})\cong\mathbb{Z}$ の生成元（$k\le n$）」を示す。$n=1$ は自明。$n\ge2$ で、Step 2 は環準同型なので $k\le n-1$ では帰納法の仮定から成り立つ。$k=n$：ポアンカレ双対性で $H^{2}\xrightarrow{[M]\cap}H_{2n-2}$ は同型、普遍係数定理で $H^{2n-2}\cong\mathrm{Hom}(H_{2n-2},\mathbb{Z})$（ホモロジーは自由）。よって $H^{2}\times H^{2n-2}\to\mathbb{Z}$, $(a,b)\mapsto\langle a\cup b,[M]\rangle=\langle b,[M]\cap a\rangle$ は完全な（両側でユニモジュラな）ペアリングで、生成元 $x$, $x^{n-1}$ について $\pm1$。よって $x\cdot x^{n-1}=x^{n}$ は $H^{2n}\cong\mathbb{Z}$ の生成元（$\langle-,[M]\rangle$ は $H^{2n}\cong\mathbb{Z}$ の同型）。

**Step 4（$\mathbb{R}P^{n}$）.** $\mathbb{Z}/2$ 係数で同じ議論（$\mathbb{R}P^{n}=\mathbb{R}P^{n-1}\cup e^{n}$、すべての次数で $H^{k}=\mathbb{Z}/2$、体係数の非退化性 \ref{at:cup-pairing-nondegenerate}）。
:::

::: supplement
**応用.** $H^{*}(\mathbb{R}P^{n};\mathbb{Z}/2)$ の環構造から、\ref{at:borsuk-ulam}の別証明が得られる（奇写像 $S^{n}\to S^{m}$ は $\mathbb{R}P^{n}\to\mathbb{R}P^{m}$ を誘導し、$x\mapsto x$ なので $x^{n}\ne0$ から $n\le m$）。$\mathbb{C}P^{2}$ と $S^{2}\vee S^{4}$ は同じホモロジー群をもつが、カップ積 $x^{2}\ne0$ で区別される。

**交叉形式.** 向き付けられた閉 $4m$ 次元多様体では、$H^{2m}(M;\mathbb{Z})/\text{ねじれ}$ 上の $\langle a\cup b,[M]\rangle$ は対称でユニモジュラ（行列式 $\pm1$）な整数係数の双線形形式で、その符号数（実数上の正負の固有値の数の差）は向き付けられたコボルディズムの不変量であることが知られている（交叉形式。$\mathbb{C}P^{2}$ では $(1)$）。$4m+2$ 次元では交代形式になる。

**高い視点.** ポアンカレ双対性は「多様体は局所的に $\mathbb{R}^{n}$ で、$\mathbb{R}^{n}$ ではコンパクト台コホモロジーが次数 $n$ に集中する」ことを、マイヤー–ヴィートリスで大域に貼り合わせた結果である。層の言葉では、向きの層を係数とするヴェルディエ双対性の特別な場合と見なせる（知られている）。比喩で言えば、多様体の $k$ 次元の「穴」と $n-k$ 次元の「壁」が一対一に対応する：トーラス上で、経線のまわりの輪（1 次ホモロジー）は緯線という壁（1 次コホモロジー）と交わって検出され、その交わりの数がカップ積のペアリングである。
:::

## 問題 {#at:sec-pd-problems}

::: problem {#at:prob-pd-surface}
向き付けられた閉曲面 $M_{g}$ について、$H^{1}(M_{g};\mathbb{Z})\cong\mathbb{Z}^{2g}$ 上のカップ積のペアリング $(a,b)\mapsto\langle a\cup b,[M_{g}]\rangle$ は、適当な基底で標準的なシンプレクティック行列 $\bigoplus_{g}\begin{pmatrix}0&1\\-1&0\end{pmatrix}$ をもつことを、$g=1$ の場合（\ref{at:cup-product} の後のトーラスの例）について確かめよ。
:::

::: solution
トーラスでは $\alpha\cup\beta$ が $H^{2}$ の生成元（その値を $\langle\alpha\cup\beta,[T]\rangle=1$ となるよう基本類の符号を選ぶ）、$\beta\cup\alpha=-\alpha\cup\beta$、$\alpha^{2}=\beta^{2}=0$ なので、基底 $(\alpha,\beta)$ での行列は $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$。
:::

::: problem {#at:prob-pd-odd-sphere-product}
$S^{2}\times S^{4}$ と $\mathbb{C}P^{3}$ は同じホモロジー群をもつがホモトピー同値でないことを示せ。
:::

::: solution
どちらも次数 $0,2,4,6$ に $\mathbb{Z}$（$S^{2}\times S^{4}$ はキュネット）。$\mathbb{C}P^{3}$ では $H^{2}$ の生成元 $x$ について $x^{2}$ が $H^{4}$ の生成元。$S^{2}\times S^{4}$ では $H^{2}$ の生成元は第 1 成分への射影で $S^{2}$ の生成元を引き戻したもの $a$ で、$a^{2}$ は $H^{4}(S^{2})=0$ を経由するので $0$。カップ積は環同型で保たれるので区別される。
:::
