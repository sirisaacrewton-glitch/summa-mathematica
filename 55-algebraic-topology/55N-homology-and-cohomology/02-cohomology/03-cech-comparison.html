# チェックコホモロジー・層コホモロジーとの一致 {#at:page-cech-comparison keywords="Cech cohomology of a good cover equals singular cohomology, double complex, tic-tac-toe lemma, generalized Mayer-Vietoris principle, Cech-singular double complex, nerve of a cover, Cech cohomology as a colimit over covers, sheaf cohomology, Alexander-Spanier cohomology, de Rham theorem, agreement of cohomology theories on CW complexes"}

特異コホモロジーは「単体からの写像」、チェックコホモロジーは「開被覆の重なり方」、層コホモロジーは「局所的な関数の貼り合わせ」から作られ、定義はまったく異なる。このページでは、**良い被覆**（有限個の共通部分がすべて可縮か空）をもつ空間では、その被覆のチェックコホモロジーが特異コホモロジーに一致することを、チェック方向と特異方向の二重複体を使って直接示す。層コホモロジーとの一致（\ref{cat:sheaf-singular-comparison}）と合わせて、多面体や多様体、CW 複体のような「局所的に良い」空間では三つの理論が一致する。一致しない空間の例は次ページ（\ref[ホモロジー理論が一致しない空間]{at:page-homology-counterexamples}）で扱う。

> 資料：チェック–特異の二重複体による比較は、Bott–Tu『Differential Forms in Algebraic Topology』のチェック–ド・ラーム複体の議論（一般化されたマイヤー–ヴィートリス原理）を特異コチェインに移したもの。証明は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-cc-notation}

::: notation
- チェック複体 $C^{p}(\mathcal{U},F)=\prod_{(i_{0},\dots,i_{p})\in I^{p+1}}F(U_{i_{0}\cdots i_{p}})$ とチェックコホモロジー $\check H^{p}(\mathcal{U},F)$ は \ref{cat:cech-complex}（添字の列はすべての組を使う）。ルレイの定理 \ref{cat:leray-theorem}、層コホモロジーと特異コホモロジーの比較 \ref{cat:sheaf-singular-comparison}。
- $A$ はアーベル群。$\underline{A}$ は局所定数関数の層で、空でない連結な開集合の上の切断は $A$、空集合の上では $0$。
- 特異コチェインと小さいコチェイン $S^{\bullet}_{\mathcal{U}}(X;A)\defeq\mathrm{Hom}(S^{\mathcal{U}}(X),A)$ は \ref{at:singular-cohomology}, \ref{at:cohomology-sheaf-facts}。可縮な空間のコホモロジー (H) も同じ所。
- 被覆の添字集合 $I$ には整列順序を 1 つ固定する（有限や可算の被覆では自然にとれる）。
- **選択公理**：添字集合の整列順序を固定すれば使わない。一般の被覆では整列定理（選択公理）を使う。
:::

## 二重複体の補題 {#at:sec-cc-double}

::: definition 二重複体と全複体 {#at:double-complex keywords="first quadrant double complex with commuting differentials, total complex with D = d + (-1)^p delta" index="二重複体|にじゅうふくたい, 全複体|ぜんふくたい"}
アーベル群 $K^{p,q}$（$p\ge-1$, $q\ge0$。ここでは $p=-1$ の列も許す）と、可換な $d\colon K^{p,q}\to K^{p+1,q}$, $\delta\colon K^{p,q}\to K^{p,q+1}$（$dd=0$, $\delta\delta=0$, $d\delta=\delta d$）を**二重複体**という。$\mathrm{Tot}^{n}\defeq\bigoplus_{p+q=n}K^{p,q}$、$D\defeq d+(-1)^{p}\delta$（$K^{p,q}$ 上）とすると $DD=0$（$d\delta$ の項が $(-1)^{p+1}+(-1)^{p}$ で打ち消す）。これを**全複体**という。
:::

::: lemma 行が完全な二重複体 {#at:row-exact-acyclic keywords="if all rows of a double complex bounded on the left are exact, the total complex is acyclic" index="行が完全な二重複体|ぎょうがかんぜんなにじゅうふくたい"}
二重複体 $K^{p,q}$（$p\ge-1$, $q\ge0$）のすべての行 $0\to K^{-1,q}\xrightarrow{d}K^{0,q}\xrightarrow{d}K^{1,q}\to\cdots$ が完全なら、全複体は完全（すべての $H^{n}(\mathrm{Tot})=0$）。
:::

::: proof
**Step 1.** $x=\sum_{p}x_{p}\in\mathrm{Tot}^{n}$（$x_{p}\in K^{p,n-p}$, $-1\le p\le n$）を $Dx=0$ とする。$x_{p}\ne0$ となる最大の $p$ を $m$ とし、$m$ についての帰納法で $x$ が境界であることを示す（$x=0$ なら自明）。

**Step 2.** $Dx$ の $K^{m+1,n-m}$ 成分は $dx_{m}$ だけ（他の成分 $x_{p}$, $p<m$ の $d$ は $K^{p+1,\cdot}$ に、$\delta$ は同じ列に入る）なので $dx_{m}=0$。$m=-1$ なら行の完全性（$d\colon K^{-1,q}\to K^{0,q}$ は単射）から $x_{-1}=0$ で、$x=0$。

**Step 3.** $m\ge0$ なら行の完全性から $x_{m}=dy$ となる $y\in K^{m-1,n-m}$ がある。$x'\defeq x-Dy$ は $Dx'=0$ を満たし、$Dy=dy+(-1)^{m-1}\delta y$ の $K^{m,\cdot}$ 成分が $x_{m}$ を打ち消し、$\delta y$ は $K^{m-1,\cdot}$ に入るので、$x'$ の最大の $p$ は $m-1$ 以下。帰納法の仮定で $x'$ は境界、よって $x$ も境界。
:::

::: proposition 二重複体の比較 {#at:double-complex-comparison keywords="tic-tac-toe: if the rows augmented by R are exact and the columns augmented by C are exact, H(R) = H(Tot) = H(C)" index="二重複体の比較|にじゅうふくたいのひかく"}
$p,q\ge0$ の二重複体 $K$ に、余鎖複体 $R^{\bullet}$ と $\eta\colon R^{q}\to K^{0,q}$（$\delta$ と可換、$d\eta=0$）、余鎖複体 $C^{\bullet}$ と $\iota\colon C^{p}\to K^{p,0}$（$d$ と可換、$\delta\iota=0$）が与えられ、
- 各行 $0\to R^{q}\xrightarrow{\eta}K^{0,q}\xrightarrow{d}K^{1,q}\to\cdots$ が完全、
- 各列 $0\to C^{p}\xrightarrow{\iota}K^{p,0}\xrightarrow{\delta}K^{p,1}\to\cdots$ が完全
とする。このとき $\eta$, $\iota$ は全複体へのコホモロジーの同型を誘導し、$H^{n}(R)\cong H^{n}(\mathrm{Tot}K)\cong H^{n}(C)$。
:::

::: proof
**Step 1（$\eta$）.** $K'^{-1,q}\defeq R^{q}$, $K'^{p,q}\defeq K^{p,q}$（$p\ge0$）、$d\defeq\eta$（$p=-1$ から $0$）とすると二重複体で、行は完全。\ref{at:row-exact-acyclic} から $\mathrm{Tot}K'$ は完全。$\mathrm{Tot}^{n}K'=R^{n+1}\oplus\mathrm{Tot}^{n}K$ で、$0\to\mathrm{Tot}K\to\mathrm{Tot}K'\to R[1]\to0$（$R[1]^{n}=R^{n+1}$、微分は $-\delta$）は余鎖複体の短完全列。長完全列で $\mathrm{Tot}K'$ のコホモロジーが $0$ なので、連結射 $H^{n}(R[1])=H^{n+1}(R)\to H^{n+1}(\mathrm{Tot}K)$ は同型。連結射を計算すると、$r\in R^{n+1}$（コサイクル）を $(r,0)\in\mathrm{Tot}^{n}K'$ に持ち上げて $D$ を施した $\eta(r)$（$K^{0,n+1}$ 成分）なので、$\eta$ の誘導写像にほかならない。

**Step 2（$\iota$）.** 行と列の役割を入れ替える（$K^{\mathrm{t}\,p,q}\defeq K^{q,p}$ とすると全複体は符号の付け方を除いて同じ：$x\in K^{p,q}$ に $(-1)^{pq}$ を掛ける同型で $d+(-1)^{p}\delta$ と $\delta+(-1)^{q}d$ が対応する）。Step 1 と同じ議論。
:::

## 良い被覆とチェックコホモロジー {#at:sec-cc-good-cover}

::: definition 良い被覆 {#at:good-cover keywords="good cover: open cover all of whose nonempty finite intersections are contractible" index="良い被覆|よいひふく"}
空間 $X$ の開被覆 $\mathcal{U}=\{U_{i}\}_{i\in I}$ で、すべての有限個の共通部分 $U_{i_{0}\cdots i_{p}}$ が可縮か空であるものを**良い被覆**という。
:::

::: example
1. $\mathbb{R}^{n}$ の凸開集合からなる被覆は良い被覆（凸集合の共通部分は凸）。
2. 有限単体複体の頂点の開星状体 $\operatorname{st}v$（$v$ を頂点にもつ単体の内部の和）からなる被覆は良い被覆：$\operatorname{st}v_{0}\cap\cdots\cap\operatorname{st}v_{p}$ は $v_{0},\dots,v_{p}$ が単体を張るときその単体の開星状体で、その単体の重心について星形なので可縮、そうでなければ空。
3. コンパクトな滑らかな多様体は、リーマン計量に関して測地的に凸な開球による有限の良い被覆をもつことが知られている（多様体論の系列で扱う予定）。
:::

::: lemma コチェインの一般化マイヤー–ヴィートリス {#at:generalized-mayer-vietoris keywords="for an open cover, 0 -> S^q_U(X) -> prod S^q(U_i) -> prod S^q(U_ij) -> ... is exact" index="一般化されたマイヤー–ヴィートリス原理|いっぱんかされたまいやーびーとりすげんり"}
開被覆 $\mathcal{U}$ と $q\ge0$ について、チェック複体の形の列
$$
0\to S^{q}_{\mathcal{U}}(X;A)\xrightarrow{\eta}\prod_{i_{0}}S^{q}(U_{i_{0}};A)\xrightarrow{d}\prod_{(i_{0},i_{1})}S^{q}(U_{i_{0}i_{1}};A)\xrightarrow{d}\cdots
$$
は完全（$\eta$ は各 $U_{i}$ への制限、$d$ は \ref{cat:cech-complex} の式で、制限は「単体の集合の制限」）。
:::

::: proof
**Step 1（単体ごとに分解）.** $T\defeq\bigcup_{i}\operatorname{Sing}_{q}(U_{i})$（$\mathcal{U}$ 小な $q$ 単体）、$\tau\in T$ について $I_{\tau}\defeq\{i:\tau(\Delta^{q})\subset U_{i}\}\ne\varnothing$ とおく。$S^{q}(U_{i_{0}\cdots i_{p}};A)$ は $\operatorname{Sing}_{q}(U_{i_{0}\cdots i_{p}})=\{\tau\in T:i_{0},\dots,i_{p}\in I_{\tau}\}$ 上の関数全体なので、列全体は $\tau\in T$ ごとの列
$$
0\to A\to\prod_{i_{0}\in I_{\tau}}A\to\prod_{(i_{0},i_{1})\in I_{\tau}^{2}}A\to\cdots
$$
の直積になる。これは集合 $I_{\tau}$ の上の「すべての組を単体とする」複体の添加コチェイン複体。

**Step 2（各成分は完全）.** $j\defeq\min I_{\tau}$（整列順序）とし、$h\colon\prod_{I_{\tau}^{p+1}}A\to\prod_{I_{\tau}^{p}}A$, $(hc)_{i_{0}\cdots i_{p-1}}\defeq c_{j\,i_{0}\cdots i_{p-1}}$（$p=0$ では $\prod_{I_{\tau}}A\to A$, $c\mapsto c_{j}$）とおくと
$$
(dhc+hdc)_{i_{0}\cdots i_{p}}=\sum_{k}(-1)^{k}c_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}+c_{i_{0}\cdots i_{p}}-\sum_{k}(-1)^{k}c_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}=c_{i_{0}\cdots i_{p}}
$$
（$(dc)_{j\,i_{0}\cdots i_{p}}$ の第 0 項が $c_{i_{0}\cdots i_{p}}$、第 $k+1$ 項が $-(-1)^{k}c_{j\cdots\widehat{i_{k}}\cdots}$）。よって恒等写像が $0$ とホモトープで、完全。$h$ は $\tau$ ごとに明示的に定まるので、直積も完全。
:::

::: theorem 良い被覆のチェックコホモロジー {#at:cech-good-cover keywords="for a good cover, Cech cohomology of the cover with constant coefficients equals singular cohomology" index="良い被覆のチェックコホモロジー|よいひふくのちぇっくこほもろじー"}
$\mathcal{U}$ が $X$ の良い被覆なら、すべての $n$ で
$$
\check H^{n}(\mathcal{U},\underline{A})\cong H^{n}_{\mathrm{sing}}(X;A).
$$
:::

::: proof
**Step 1（二重複体）.** $K^{p,q}\defeq\prod_{(i_{0},\dots,i_{p})}S^{q}(U_{i_{0}\cdots i_{p}};A)$、$d$ はチェックの微分、$\delta$ は特異コチェインの余境界（成分ごと）。制限は $\delta$ と可換なので二重複体。

**Step 2（行）.** \ref{at:generalized-mayer-vietoris} から、$R^{q}\defeq S^{q}_{\mathcal{U}}(X;A)$ で添加した行は完全。

**Step 3（列）.** $p$ を固定すると、列は $\prod_{\sigma}S^{\bullet}(U_{\sigma};A)$。$U_{\sigma}$ が空なら成分は $0$、空でなければ可縮で、(H)（\ref{at:cohomology-sheaf-facts}）から $0\to A\to S^{0}(U_{\sigma};A)\to S^{1}(U_{\sigma};A)\to\cdots$（$A$ は定数コチェイン）は完全。直積が完全であるには各成分で逆像を同時に選ぶ必要があるが、$U_{\sigma}$ ごとに可縮化のホモトピーを 1 つ固定すると、プリズム作用素の双対と 1 点の余鎖複体の縮約から、添加列の縮約（$\delta h+h\delta=1$）が明示的に得られる。よって $C^{p}\defeq\prod_{\sigma}\underline{A}(U_{\sigma})=C^{p}(\mathcal{U},\underline{A})$で添加した列は完全。

**Step 4.** \ref{at:double-complex-comparison} から $H^{n}(S_{\mathcal{U}}(X;A))\cong H^{n}(C(\mathcal{U},\underline{A}))=\check H^{n}(\mathcal{U},\underline{A})$。左辺は (S)（\ref{at:cohomology-sheaf-facts}）で $H^{n}_{\mathrm{sing}}(X;A)$。

::: hypcheck
- **良い被覆**：Step 3 で各 $U_{\sigma}$ のコホモロジーが 1 点と同じであることに使った。これを「すべての $U_{\sigma}$ で $H^{q}_{\mathrm{sing}}(U_{\sigma};A)=0$（$q\ge1$）で、$H^{0}_{\mathrm{sing}}(U_{\sigma};A)=\underline{A}(U_{\sigma})$（弧状連結成分ごとの定数）」に弱めても、各成分が可縮なら同じ証明が通る（問題 \ref{at:prob-cech-two-arcs}）。
- 被覆が開であることは (S)（小さいコチェイン）に使った。
- **選択公理**：Step 3 で $U_{\sigma}$ ごとに可縮化のホモトピーを 1 つ固定する。$U_{\sigma}$ は添字の集合 $\{i_{0},\dots,i_{p}\}$ だけで決まるので、添字集合が有限なら有限回の選択。無限の良い被覆では選択公理を使う。
:::
:::

::: supplement
**脈体.** $\check H^{*}(\mathcal{U},\underline{A})$ は、被覆の**脈体**（頂点 $I$、空でない共通部分をもつ有限部分集合を単体とする単体複体）$N(\mathcal{U})$ の単体的コホモロジーに等しい（すべての組の複体と順序付きの組の複体は同じコホモロジーを与える。知られている）。良い被覆については、$X$ と $|N(\mathcal{U})|$ がホモトピー同値であること（脈体定理）も、パラコンパクトな $X$ について知られている（本サイト未収録）。この定理はそのコホモロジー版である。

**一般化.** 同じ二重複体の議論で、特異コチェインの代わりに滑らかな多様体上の微分形式を使うと、ド・ラームの定理 $H^{*}_{\mathrm{dR}}(M)\cong\check H^{*}(\mathcal{U},\underline{\mathbb{R}})\cong H^{*}_{\mathrm{sing}}(M;\mathbb{R})$ が得られる（Bott–Tu の方法。多様体論の系列で扱う予定）。
:::

## 三つのコホモロジー理論の一致 {#at:sec-cc-agreement}

::: definition 空間のチェックコホモロジー {#at:cech-cohomology-space keywords="Cech cohomology of a space as the colimit over open covers ordered by refinement" index="チェックコホモロジー（空間）|ちぇっくこほもろじーくうかん"}
$\mathcal{V}$ が $\mathcal{U}$ の細分（各 $V_{j}$ がある $U_{\lambda(j)}$ に含まれる）のとき、$\lambda$ は $c\mapsto(c_{\lambda(j_{0})\cdots\lambda(j_{p})}\restriction V_{j_{0}\cdots j_{p}})$ により $\check H^{*}(\mathcal{U},F)\to\check H^{*}(\mathcal{V},F)$ を誘導し、これは $\lambda$ の選び方によらないことが知られている。この写像による余極限 $\check H^{*}(X,F)\defeq\varinjlim_{\mathcal{U}}\check H^{*}(\mathcal{U},F)$ を $X$ の**チェックコホモロジー**という。
:::

::: theorem 局所的に良い空間での一致 {#at:cohomology-agreement keywords="on spaces where good covers are cofinal (polyhedra, manifolds), Cech, sheaf and singular cohomology agree; on CW complexes they agree" index="コホモロジー理論の一致|こほもろじーりろんのいっち"}
1. 良い被覆が細分について共終（任意の開被覆が良い被覆で細分できる）な空間 $X$ では $\check H^{n}(X;A)\cong H^{n}_{\mathrm{sing}}(X;A)$。
2. さらに $X$ の開集合がすべてパラコンパクトで $X$ が局所可縮なら、層コホモロジー $H^{n}(X,\underline{A})$ もこれらに等しい。
:::

::: proof
1：良い被覆の間の細分写像は、\ref{at:cech-good-cover} の同型と両立する（二重複体の構成は細分写像 $\lambda$ と可換で、特異側では制限 $S_{\mathcal{U}}\to S_{\mathcal{V}}$ はともに $S$ からの同型と両立する）ので、良い被覆の間の細分写像はすべて同型。共終な部分系の余極限は全体の余極限に等しい。2：\ref{cat:sheaf-singular-comparison}。
:::

::: fact CW 複体と多様体 {#at:cw-local-properties keywords="CW complexes are paracompact and locally contractible; manifolds and finite polyhedra have cofinal good covers" index="CW 複体の局所的性質|しーだぶりゅーふくたいのきょくしょてきせいしつ"}
1. CW 複体はハウスドルフ・パラコンパクトで、局所可縮である（\ref{at:cw-paracompact}, \ref{at:cw-locally-contractible} で証明した）。
2. 有限単体複体（多面体）と位相多様体の任意の開被覆は、コホモロジー的に良い被覆で細分できる（多面体は重心細分の開星状体、多様体は座標近傍の凸集合による）。
3. パラコンパクト・ハウスドルフ空間では、任意の層 $F$ について $\check H^{*}(X,F)\cong H^{*}(X,F)$（ゴドマン『Topologie algébrique et théorie des faisceaux』）。
4. パラコンパクト・ハウスドルフで局所可縮な空間では、定数層の層コホモロジーは特異コホモロジーに一致する（Bredon『Sheaf Theory』。本サイトの \ref{cat:sheaf-singular-comparison} は開集合のパラコンパクト性を仮定した版）。
したがって CW 複体と多様体では、チェック・層・特異コホモロジーは（定数係数で）一致する。本サイトでは 2〜4 を証明していない（2 を認めれば、多面体と多様体についてのチェックと特異の一致は \ref{at:cohomology-agreement} の 1 から従い、3・4 は要らない）。
:::

::: supplement
**アレクサンダー–スパニエのコホモロジー.** 関数 $\varphi\colon X^{p+1}\to A$ を、「対角線のある近傍で $0$」なら $0$ とみなした商（局所的に $0$ な関数で割る）を $p$ コチェインとし、$\delta\varphi(x_{0},\dots,x_{p+1})=\sum(-1)^{k}\varphi(x_{0},\dots,\widehat{x_{k}},\dots,x_{p+1})$ とした理論を**アレクサンダー–スパニエのコホモロジー** $\bar H^{*}(X;A)$ という。パラコンパクト・ハウスドルフ空間ではチェックコホモロジーと一致し、局所可縮な空間では特異コホモロジーとも一致することが知られている（Spanier『Algebraic Topology』第 6 章）。この理論は「点の組」で定義されるので、チェック理論と同じく局所的な性質に敏感で、次ページの例では特異理論と食い違う側に属する。

**高い視点.** 比較の原理は「すべての理論は、可縮な部品の上では 1 点と同じ値をとり、部品の貼り合わせ方（チェック方向の情報）だけが全体を決める」というものである。二重複体の一方の方向（チェック）は部品の組合せ、他方（特異・層・微分形式）は部品の中身を測り、良い被覆では中身が自明なので組合せの情報だけが残る。比喩で言えば、同じ建物を「部屋の配置図」（チェック）と「壁の中の詳細な測量」（特異）で記述しても、各部屋が単純（可縮）なら同じ間取りが得られる。部屋自体が複雑（局所的に悪い空間）だと、両者は食い違いうる。
:::

## 問題 {#at:sec-cc-problems}

::: problem {#at:prob-cech-circle}
$S^{1}$ を 3 つの開弧 $U_{0},U_{1},U_{2}$（どの 2 つも 1 つの開弧で交わり、3 つの共通部分は空）で覆う。良い被覆であることを確かめ、$\check H^{*}(\mathcal{U},\underline{\mathbb{Z}})$ を脈体（三角形の境界）の単体的コホモロジーとして計算し、$H^{*}(S^{1})$ と一致することを確かめよ。
:::

::: solution
開弧と、2 つの開弧の共通部分（開弧）は可縮、3 つの共通部分は空なので良い被覆。脈体は 3 頂点 3 辺の三角形の境界 $\partial\Delta^{2}$ で、その単体的コホモロジーは $H^{0}=H^{1}=\mathbb{Z}$（\ref{at:sphere-simplicial-homology} と普遍係数定理）。$H^{*}(S^{1})$ と一致。
:::

::: problem {#at:prob-cech-two-arcs}
$S^{1}$ を 2 つの開弧で覆う（共通部分は 2 つの開弧の非交和）と、良い被覆でなく、被覆のチェックコホモロジーが $H^{1}=\mathbb{Z}$ を正しく与えることを \ref{cat:cech-two-cover} で確かめよ。良い被覆でなくても一致する理由を、\ref{at:cech-good-cover} の証明の hypcheck から説明せよ。
:::

::: solution
共通部分 $U_{01}$ は可縮でない（連結でない）ので良い被覆ではない。しかし $U_{01}$ は可縮な 2 成分の非交和で、$H^{q}(U_{01})=0$（$q\ge1$）は成り立つ。証明の Step 3 では各 $U_{\sigma}$ で「$q\ge1$ のコホモロジーが消え、$H^{0}=\underline{A}(U_{\sigma})$」であれば足り（$\underline{A}(U_{01})=A^{2}$ も局所定数関数としてそのまま扱える）、二重複体の議論がそのまま通る。
:::
