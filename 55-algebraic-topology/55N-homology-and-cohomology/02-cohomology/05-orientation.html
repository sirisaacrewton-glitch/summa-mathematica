# 多様体の向きと基本類 {#at:page-orientation keywords="topological manifold, local homology H_n(M, M - x), local orientation, orientation of a manifold, R-orientation, orientation double cover, orientable manifolds, homology of M relative to the complement of a compact set, fundamental class lemma, top homology of closed manifolds, fundamental class, Z/2-orientation, orientability of RP^n"}

$n$ 次元多様体の各点では局所ホモロジー $H_{n}(M,M\setminus\{x\})\cong\mathbb{Z}$ が定まり、その生成元の選び方が点ごとの「向き」である。向きを連続に選べるとき多様体は**向き付け可能**という。このページの主結果は、閉じた（コンパクトで境界のない）連結な $n$ 次元多様体 $M$ について、$H_{n}(M)\cong\mathbb{Z}$（向き付け可能）または $0$（向き付け不可能）で、向き付け可能なら各点の向きを一斉に与える**基本類** $[M]$ があること、である。これはポアンカレ双対性（\ref[キャップ積とポアンカレ双対性]{at:page-poincare-duality}）の準備である。

> 資料：標準的な内容（Massey『Singular Homology Theory』の多様体の章など）。基本類の補題の証明（マイヤー–ヴィートリスと凸集合への帰着）は、標準的な流れを自分で書き下ろした。

## 記法と定義の確認 {#at:sec-or-notation}

::: notation
- 特異ホモロジー・相対ホモロジー・長完全列・切除・マイヤー–ヴィートリス \ref{at:singular-homology}, \ref{at:pair-long-exact}, \ref{at:excision}, \ref{at:mayer-vietoris}。局所ホモロジーと次元の不変性 \ref{at:invariance-of-dimension}。鎖のコンパクト台 \ref{at:compact-support}。
- 被覆と持ち上げ \ref{at:covering}, \ref{at:monodromy-action}、単連結な空間の連結な被覆は同相（問題 \ref{at:prob-simply-connected-covering-trivial}）。
- $R$ は可換環（主に $\mathbb{Z}$ と $\mathbb{Z}/2$）。$A\subset M$ について $H_{i}(M|A;R)\defeq H_{i}(M,M\setminus A;R)$、$H_{i}(M|x)\defeq H_{i}(M|\{x\})$。$A\subset B$ なら包含 $(M,M\setminus B)\to(M,M\setminus A)$ が**制限** $H_{i}(M|B)\to H_{i}(M|A)$ を与える。
- **選択公理**：使わない。
:::

## 多様体と局所的な向き {#at:sec-or-local}

::: definition 位相多様体 {#at:topological-manifold keywords="topological n-manifold: Hausdorff and locally homeomorphic to R^n; closed manifold" index="位相多様体|いそうたようたい, 閉多様体|へいたようたい, 座標近傍|ざひょうきんぼう"}
ハウスドルフ空間 $M$ の各点が $\mathbb{R}^{n}$ と同相な開近傍（**座標近傍**）をもつとき、$M$ を **$n$ 次元（位相）多様体**という。コンパクトな多様体を**閉多様体**という（ここでの多様体は境界をもたない）。座標近傍の中の、$\mathbb{R}^{n}$ の閉球に対応する集合を**球**という。
:::

::: lemma 局所ホモロジーと球 {#at:local-homology-ball keywords="for a manifold H_i(M|x) is R in degree n; for a ball B in a chart, H_n(M|B) -> H_n(M|y) is an isomorphism for y in B" index="局所ホモロジー（多様体）|きょくしょほもろじーたようたい"}
$n$ 次元多様体 $M$ について、
1. $H_{i}(M|x;R)\cong R$（$i=n$）、$0$（$i\ne n$）。
2. 球 $B$ と $y\in B$ について、制限 $H_{i}(M|B;R)\to H_{i}(M|y;R)$ は同型。
:::

::: proof
座標近傍 $U\cong\mathbb{R}^{n}$ をとる。$M\setminus U$ は閉で $M\setminus B$（開）に含まれるので、切除で $H_{i}(M|B)\cong H_{i}(U|B)\cong H_{i}(\mathbb{R}^{n}|B)$、同様に $H_{i}(M|y)\cong H_{i}(\mathbb{R}^{n}|y)$。$\mathbb{R}^{n}$ では $B$ を閉球として、$\mathbb{R}^{n}\setminus B\to\mathbb{R}^{n}\setminus\{y\}$ はホモトピー同値（両方とも、$B$ の中心 $c$ を中心とする大きな球面を変位レトラクトにもつ：$y\in B$ から出る放射状の変形。$\mathbb{R}^{n}\setminus B$ は $c$ からの放射状の射影で大きな球面に縮み、$\mathbb{R}^{n}\setminus\{y\}$ は $y$ からの射影で縮む）。対の長完全列と五項補題（$\mathbb{R}^{n}$ は両方で共通）から 2。1 は \ref{at:invariance-of-dimension} の計算（係数 $R$ でも同じ：普遍係数定理または同じ議論）。
:::

::: definition 向き {#at:orientation keywords="local orientation mu_x, R-orientation as a locally consistent choice of generators, orientable manifold" index="向き（多様体）|むきたようたい, 向き付け可能|むきづけかのう, 局所的な向き|きょくしょてきなむき"}
$H_{n}(M|x;R)\cong R$ の生成元（$R$ の可逆元に対応する元）$\mu_{x}$ を $x$ での**局所的な $R$ 向き**という。局所的な向きの族 $(\mu_{x})_{x\in M}$ が**局所的に整合する**とは、各点 $x$ が、ある球 $B\ni x$ と $\mu_{B}\in H_{n}(M|B;R)$ をもち、すべての $y\in B$ で $\mu_{B}$ の制限が $\mu_{y}$ となることをいう。そのような族を $M$ の **$R$ 向き**といい、存在するとき $M$ は **$R$ 向き付け可能**という。$R=\mathbb{Z}$ のとき単に向き、向き付け可能という。
:::

::: example
1. $\mathbb{Z}/2$ では生成元は $1$ だけなので、すべての多様体は $\mathbb{Z}/2$ 向き付け可能。
2. $\mathbb{R}^{n}$ は向き付け可能：大きな球 $B_{r}$ と $\mu\in H_{n}(\mathbb{R}^{n}|B_{r})$ の生成元をとり、すべての $r$ について両立するように選ぶ（$H_{n}(\mathbb{R}^{n}|B_{r'})\to H_{n}(\mathbb{R}^{n}|B_{r})$, $r<r'$ は同型）。
:::

## 向きの二重被覆 {#at:sec-or-cover}

::: proposition 向きの二重被覆 {#at:orientation-cover keywords="orientation double cover M~ -> M; M~ is orientable; a connected M is orientable iff M~ has two components; simply connected manifolds are orientable" index="向きの二重被覆|むきのにじゅうひふく"}
$\tilde M\defeq\{(x,\mu_{x}):x\in M,\ \mu_{x}\text{ は }H_{n}(M|x;\mathbb{Z})\text{ の生成元}\}$ に、球 $B$ と $H_{n}(M|B)$ の生成元 $\mu_{B}$ ごとの集合 $U(\mu_{B})\defeq\{(y,\mu_{B}|_{y}):y\in\operatorname{int}B\}$ を開基とする位相を入れる。
1. $p\colon\tilde M\to M$, $(x,\mu_{x})\mapsto x$ は 2 葉の被覆で、$\tilde M$ は向き付け可能な $n$ 次元多様体。
2. $M$ が連結なら、$M$ が向き付け可能であることと $\tilde M$ が連結でない（ちょうど 2 成分）ことは同値。
3. 単連結な多様体は向き付け可能。
:::

::: proof
**Step 1（開基）.** \ref{at:local-homology-ball.2} から、$U(\mu_{B})$ の点 $(y,\mu_{B}|_{y})$ では $\mu_{B}|_{y}$ は生成元で、$p$ は $U(\mu_{B})$ を $\operatorname{int}B$ に全単射に写す。2 つの $U(\mu_{B})$, $U(\mu_{B'})$ の共通点 $(y,\mu_{y})$ について、$y$ を含む球 $B''\subset\operatorname{int}B\cap\operatorname{int}B'$ と $\mu_{B''}$（$\mu_{y}$ に制限される生成元）をとると、$B''$ の各点で $\mu_{B''}$ と $\mu_{B}$ の制限は一致する（どちらも $H_{n}(M|B'')\cong H_{n}(M|z)$ を経由して $\mu_{y}$ と整合：$H_{n}(M|B)\to H_{n}(M|B'')\to H_{n}(M|y)$ がすべて同型）ので $U(\mu_{B''})\subset U(\mu_{B})\cap U(\mu_{B'})$。よって開基。

**Step 2（被覆）.** 球 $B$ について $p^{-1}(\operatorname{int}B)=U(\mu_{B})\sqcup U(-\mu_{B})$（各点の生成元は $\pm$ の 2 つで、$\mu_{B}$ の制限か $-\mu_{B}$ の制限）で、それぞれ $\operatorname{int}B$ と同相（$p$ は連続な開全単射：開基の像は $\operatorname{int}$ 球で開）。$\tilde M$ はハウスドルフ（$p$ で異なる点に写る 2 点は $M$ で分離、同じ点の上の 2 点は $U(\pm\mu_{B})$ で分離）で局所的に $\mathbb{R}^{n}$ と同相。

**Step 3（$\tilde M$ の向き）.** $\tilde x=(x,\mu_{x})$ での局所ホモロジーを、$p$ の局所同相で $H_{n}(M|x)$ と同一視し、$\mu_{x}$ を $\tilde x$ での向きとする。$U(\mu_{B})$ の上では $\mu_{B}$ が整合性を与える。

**Step 4（2）.** $M$ の向き $(\mu_{x})$ は、$x\mapsto(x,\mu_{x})$ という $p$ の連続な切断（局所的整合性は、この切断が $U(\mu_{B})$ の上で開であることと同じ）を与え、その像と $(x,-\mu_{x})$ の像は $\tilde M$ を 2 つの開集合に分ける。逆に $\tilde M$ が連結でないなら、2 葉の被覆なので（$M$ 連結）成分は 2 つで、各成分は $p$ で $M$ と同相（葉の数の議論：\ref{at:monodromy-action}）、その逆写像が向きを与える。

**Step 5（3）.** $M$ が単連結なら、$\tilde M$ の各成分は $M$ の連結な被覆で、同相写像（問題 \ref{at:prob-simply-connected-covering-trivial}）。よって成分は 2 つで、2 から向き付け可能。
:::

## 基本類 {#at:sec-or-fundamental}

::: lemma 基本類の補題 {#at:fundamental-class-lemma keywords="for compact A in an n-manifold, H_i(M|A) = 0 for i > n, and a continuous section of local generators over A comes from a unique class in H_n(M|A)" index="基本類の補題|きほんるいのほだい"}
$M$ を $n$ 次元多様体、$A\subset M$ をコンパクト集合とする。
1. $i>n$ なら $H_{i}(M|A;R)=0$。
2. $\alpha\in H_{n}(M|A;R)$ がすべての $x\in A$ で $\alpha|_{x}=0$ なら $\alpha=0$。
3. 各 $x\in A$ に $\alpha_{x}\in H_{n}(M|x;R)$ が与えられ、局所的に整合する（各 $x\in A$ に球 $B\ni x$ と $\alpha_{B}\in H_{n}(M|B;R)$ があり、$y\in A\cap B$ で $\alpha_{B}|_{y}=\alpha_{y}$）なら、すべての $x\in A$ で $\alpha|_{x}=\alpha_{x}$ となる $\alpha\in H_{n}(M|A;R)$ がただ一つある。
:::

::: proof
3 の一意性は 2 から。主張 1・2 と 3 の存在を「$A$ について成り立つ」と言う。

**Step 1（和）.** $A,B$ と $A\cap B$ で成り立てば $A\cup B$ でも成り立つ。相対版のマイヤー–ヴィートリス
$$
0\to H_{n}(M|A\cup B)\xrightarrow{\Phi}H_{n}(M|A)\oplus H_{n}(M|B)\xrightarrow{\Psi}H_{n}(M|A\cap B)\to\cdots
$$
（$M\setminus A$ と $M\setminus B$ は開で、その和は $M\setminus(A\cap B)$、共通部分は $M\setminus(A\cup B)$。対 $(M,M\setminus A)$, $(M,M\setminus B)$ の鎖複体の短完全列 $0\to S(M)/S(M\setminus(A\cup B))\to\cdots$ と小さい単体の定理から得られる。$\Phi=(\text{制限},\text{制限})$, $\Psi=\text{制限}-\text{制限}$）を使う。$i>n$ では、両隣の項が $0$（$H_{i+1}(M|A\cap B)=0$ と $H_{i}(M|A)=H_{i}(M|B)=0$）なので $H_{i}(M|A\cup B)=0$。左端が $0$ なのは $H_{n+1}(M|A\cap B)=0$ による。2：$\alpha|_{x}=0$（全 $x$）なら $\Phi(\alpha)$ の各成分は 2 から $0$、$\Phi$ は単射で $\alpha=0$。3：$\alpha_{A}$, $\alpha_{B}$ をとると $\Psi(\alpha_{A},\alpha_{B})$ は $A\cap B$ の各点で $0$ なので 2 から $0$、よって $\alpha_{A\cup B}$ がある。

**Step 2（$\mathbb{R}^{n}$ の中のコンパクト凸集合）.** $M=\mathbb{R}^{n}$（座標近傍は切除で $\mathbb{R}^{n}$ に帰着）、$A$ をコンパクト凸集合とする。$A$ の点 $c$ と、$A$ を内部に含む $c$ 中心の球面 $\Sigma$ をとる。$y\notin A$ について、$c$ から $y$ を通る半直線の $y$ より先の点は $A$ に入らない（入れば凸性から $y\in A$）ので、$y$ をこの半直線に沿って $\Sigma$ まで動かす変形（$\Sigma$ の外の点は内向きに動かす）は $\mathbb{R}^{n}\setminus A$ の中で行え、$\mathbb{R}^{n}\setminus A$ は $\Sigma$ を変位レトラクトにもつ。$x\in A$ について $\mathbb{R}^{n}\setminus\{x\}$ も $x$ からの同様の変形で $x$ 中心の球面に縮み、包含 $\mathbb{R}^{n}\setminus A\to\mathbb{R}^{n}\setminus\{x\}$ はホモトピー同値（どちらも $S^{n-1}$ とホモトピー同値で、包含は大きな球面の上で $x$ からの放射状射影と両立する）ので、$H_{i}(\mathbb{R}^{n}|A)\cong\tilde H_{i-1}(S^{n-1})$ で、$x\in A$ への制限は同型（\ref{at:local-homology-ball.2} と同じ議論）。1・2・3 が成り立つ（3 は $x\in A$ を 1 つとって $\alpha_{x}$ の逆像をとり、凸性で $A$ は連結なので、局所整合性から他の点でも一致）。

**Step 3（凸集合の有限和）.** $A=K_{1}\cup\dots\cup K_{m}$（$K_{j}$ はコンパクト凸）について $m$ の帰納法：$A'=K_{1}\cup\dots\cup K_{m-1}$ と $K_{m}$、$A'\cap K_{m}=\bigcup_{j<m}(K_{j}\cap K_{m})$（$m-1$ 個のコンパクト凸集合の和）で成り立つので、Step 1。

**Step 4（$\mathbb{R}^{n}$ の一般のコンパクト集合）.** 1・2 を示す（3 の存在は Step 6 でまとめて）。$\alpha\in H_{i}(\mathbb{R}^{n}|A)$ を相対サイクル $z$（$\partial z$ は $\mathbb{R}^{n}\setminus A$ の鎖）で代表する。$\partial z$ の台 $C$ はコンパクトで $A$ と交わらないので $d\defeq\operatorname{dist}(A,C)>0$。一辺が $d/2\sqrt{n}$ 未満の格子の閉立方体のうち $A$ と交わるもの（有限個）の和を $K$ とすると、$A\subset K\subset\mathbb{R}^{n}\setminus C$。$z$ は $H_{i}(\mathbb{R}^{n}|K)$ の類 $\alpha_{K}$ を定め、$\alpha_{K}|_{A}=\alpha$。$i>n$ なら Step 3 で $\alpha_{K}=0$ なので $\alpha=0$。$i=n$ で $\alpha|_{x}=0$（$x\in A$）なら、$\alpha_{K}$ は $K$ の各成分（立方体の和の連結成分で、$A$ と交わる）の点で $0$…とするため、$K$ を $A$ と交わる立方体だけにとっておく：各立方体 $Q$ は $A$ の点 $x$ を含み、$\alpha_{K}|_{Q}\in H_{n}(\mathbb{R}^{n}|Q)\cong H_{n}(\mathbb{R}^{n}|x)$（Step 2）は $\alpha|_{x}=0$ に写るので $0$、よって $Q$ の各点で $\alpha_{K}$ の制限は $0$。Step 3 の 2 で $\alpha_{K}=0$、$\alpha=0$。

**Step 5（一般の多様体の 1・2）.** $A$ は有限個の座標近傍の中の球の和に覆われ、$A=\bigcup_{j}(A\cap B_{j})$ と書ける（各 $A\cap B_{j}$ はコンパクトで座標近傍の中）。座標近傍の中のコンパクト集合では、切除で $\mathbb{R}^{n}$ の場合に帰着し、Step 4 から 1・2 が成り立つ。共通部分も座標近傍の中のコンパクト集合なので、Step 1 の 1・2 の部分を帰納的に使う。

**Step 6（3 の存在）.** 局所整合性の球 $B$ たちのうち有限個 $B_{1},\dots,B_{m}$ で $A$ を覆い、$A_{j}\defeq A\cap B_{j}$ とする。$A_{j}$ の上では $\alpha_{B_{j}}$ の制限が求める類。$A_{1}\cup\dots\cup A_{k}$ と $A_{k+1}$ の上の類を、Step 1 の 3 の議論（2 は Step 5 で一般に成り立つ）で貼り合わせていく。
:::

::: theorem 閉多様体の最高次ホモロジー {#at:top-homology-closed-manifold keywords="for a closed connected n-manifold, H_n(M;R) -> H_n(M|x;R) is an isomorphism if M is R-orientable and injective with image the elements of order 2 otherwise; H_i(M;R) = 0 for i > n; fundamental class" index="閉多様体の最高次ホモロジー|へいたようたいのさいこうじほもろじー, 基本類|きほんるい"}
$M$ を連結な閉 $n$ 次元多様体とする。
1. $i>n$ なら $H_{i}(M;R)=0$。
2. $M$ が $R$ 向き付け可能なら、$H_{n}(M;R)\to H_{n}(M|x;R)\cong R$ はすべての $x$ で同型。向き $(\mu_{x})$ について $[M]|_{x}=\mu_{x}$ となる類 $[M]\in H_{n}(M;R)$（**基本類**）がただ一つある。
3. $M$ が向き付け不可能なら $H_{n}(M;\mathbb{Z})=0$。
:::

::: proof
\ref{at:fundamental-class-lemma} を $A=M$（コンパクト）に使う：$H_{i}(M|M)=H_{i}(M)$。1 は補題の 1。2：$H_{n}(M)$ の元は、各点での制限の族（局所的に整合する）で決まり（補題の 2）、逆に局所的に整合する族は類を定める（補題の 3）。局所的に整合する族 $x\mapsto\alpha_{x}$ は、$M$ が連結なので 1 点の値 $\alpha_{x_{0}}$ で決まる（$\alpha_{x}=r\mu_{x}$ となる $r\in R$ の集合は局所定数：球の上で $\alpha_{B}$ と $\mu_{B}$ の制限を比べる）。よって $H_{n}(M;R)\cong R$ で、$x$ への制限は同型。3：$H_{n}(M;\mathbb{Z})$ の元 $\alpha$ について $x\mapsto\alpha|_{x}$ は局所的に整合する族で、$\alpha|_{x}$ を $H_{n}(M|x)\cong\mathbb{Z}$ の生成元の $k_{x}$ 倍（$k_{x}\ge0$）と書くと、$k_{x}$ は局所定数（球の上で $\alpha_{B}$ の制限）で、連結性から一定の $k$。$k\ge1$ なら、各点で $\alpha|_{x}=k\beta_{x}$ となる生成元 $\beta_{x}$ がただ一つあり、球の上では $\alpha_{B}=k\beta_{B}$（$H_{n}(M|B)\cong\mathbb{Z}$）から局所的に整合するので、$(\beta_{x})$ は向き。向き付け不可能ならこれは不可能で、$\alpha|_{x}=0$ がすべての $x$ で成り立ち、補題の 2 で $\alpha=0$。
:::

::: example
1. $S^{n}$, $T^{n}=(S^{1})^{n}$, 閉曲面 $M_{g}$ は $H_{n}\cong\mathbb{Z}$（\ref{at:sphere-homology}, \ref{at:kunneth}, \ref{at:surface-homology}）なので向き付け可能。$N_{h}$ は $H_{2}=0$ なので向き付け不可能（\ref{at:surface-homology}）。
2. $\mathbb{R}P^{n}$ は $H_{n}(\mathbb{R}P^{n})\cong\mathbb{Z}$（$n$ 奇数）、$0$（$n$ 偶数）（\ref{at:projective-space-homology}）なので、$n$ が奇数のときに限り向き付け可能。
3. $\mathbb{Z}/2$ 係数ではすべての閉多様体が基本類 $[M]_{2}\in H_{n}(M;\mathbb{Z}/2)\cong\mathbb{Z}/2$ をもつ。
:::

::: supplement
**一般化.** 境界付き多様体では、$H_{n}(M,\partial M)$ に基本類があり、向き付け可能な境界付き多様体の境界 $\partial M$ の基本類は $\partial[M]=[\partial M]$ で与えられる（ルフシェッツ双対性の準備。知られている）。滑らかな多様体では、向きは座標変換のヤコビ行列式の符号として定義でき、ここでのホモロジー的な向きと一致する（\ref{at:prob-degree-reflection-composition} の線形写像の写像度 $=\det$ の符号による。多様体論の系列で扱う予定）。

**高い視点.** 向きの二重被覆は、局所的に定数 $\mathbb{Z}$ と同型な**局所系**（層） $x\mapsto H_{n}(M|x;\mathbb{Z})$ の自己同型 $\pm1$ の構造で、その「ねじれ」は準同型 $w_{1}\colon\pi_{1}(M)\to\{\pm1\}$（第 1 スティーフェル–ホイットニー類）として記録される（知られている）。基本類の補題は、局所的な情報（各点の向き）がコンパクト集合の上で大域的な情報（ホモロジー類）に貼り合わさることを言っており、層の言葉では「向きの層の大域切断と $H_{n}$ の同一視」にあたる。比喩で言えば、各点で時計回りか反時計回りかを決めるのが局所的な向きで、それを地図帳全体で矛盾なく決められるのが向き付け可能性、メビウスの帯の上を一周すると時計回りが反時計回りに変わってしまうのが向き付け不可能性である。
:::

## 問題 {#at:sec-or-problems}

::: problem {#at:prob-orientable-cover}
連結な多様体 $M$ について、$\pi_{1}(M)$ が指数 2 の部分群をもたなければ $M$ は向き付け可能であることを示せ。
:::

::: solution
$M$ が向き付け不可能なら、$\tilde M$ は連結な 2 葉の被覆（\ref{at:orientation-cover.2}）で、\ref{at:monodromy-action.3} から $p_{*}\pi_{1}(\tilde M)$ は指数 2 の部分群。多様体は局所弧状連結なので被覆の理論が使える。
:::

::: problem {#at:prob-product-orientable}
$M$, $N$ が向き付け可能な閉多様体なら $M\times N$ も向き付け可能であることを、キュネットの定理から示せ。
:::

::: solution
$M\times N$ は $(m+n)$ 次元の閉多様体（連結成分ごとに考える）。キュネットの定理（\ref{at:kunneth}）で $H_{m}(M)\otimes H_{n}(N)\cong\mathbb{Z}\otimes\mathbb{Z}$ は $H_{m+n}(M\times N)$ の直和因子なので $H_{m+n}(M\times N)\ne0$。\ref{at:top-homology-closed-manifold.3} から向き付け可能。
:::
