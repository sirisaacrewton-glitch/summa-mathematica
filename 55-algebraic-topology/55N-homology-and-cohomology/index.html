# ホモロジー論とコホモロジー論（Homology and Cohomology Theories）

単体・特異・胞体ホモロジー、切除とマイヤー–ヴィートリス、アイレンバーグ–スティーンロッドの公理、特異・チェック・層コホモロジーの一致と不一致、カップ積とポアンカレ双対性。

<p class="mn-msc">MSC2020: 55N</p>

## 分野
