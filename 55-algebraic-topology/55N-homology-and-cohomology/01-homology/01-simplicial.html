# 単体的ホモロジー {#at:page-simplicial-homology keywords="simplex, standard simplex, simplicial complex, polyhedron, triangulation, Delta-complex, semi-simplicial set, geometric realization, oriented simplex, simplicial chain complex, boundary operator, simplicial homology, reduced homology, augmentation, simplicial map, cone, acyclic, homology of spheres, torus, real projective plane, Klein bottle, Euler characteristic, Euler-Poincare formula"}

基本群は 1 次元の「穴」（ほどけない輪）を捉えたが、群が非可換で計算が難しく、高次元の穴は見えない（$n\ge2$ で $S^{n}$ は単連結）。**ホモロジー**は、空間を単体（点・線分・三角形・四面体…）に分け、「境界をもたない組合せ（サイクル）のうち、何かの境界になっていないもの」をアーベル群として数える。このページでは単体複体とその一般化である Δ 複体の上で単体的ホモロジーを定義し、単体・球面・トーラス・実射影平面のホモロジーを計算し、オイラー標数がホモロジーで書けること（オイラー–ポアンカレの公式）を示す。単体的ホモロジーが空間の位相だけで決まることは、特異ホモロジーとの一致（\ref[単体的ホモロジーと特異ホモロジーの一致]{at:page-simplicial-singular}）で示す。

> 資料：標準的な内容で、Massey『Singular Homology Theory』の序章や、小松・中岡・菅原『位相幾何学 I』の単体複体の章などにある。Δ 複体の扱いと例の計算は自分で書き下ろした。訳語は小松・中岡・菅原（単体複体・多面体・三角形分割・単体写像・有向単体）と、本サイトのホモロジー代数のページ（鎖複体・サイクル）に合わせた。

## 記法と定義の確認 {#at:sec-sh-notation}

::: notation
- 鎖複体・鎖写像・サイクル・ホモロジーは \ref{ha:chain-complex}, \ref{ha:homology}（アーベル群の圏で使う：$Z_{n}=\ker\partial_{n}$, $B_{n}=\operatorname{im}\partial_{n+1}$, $H_{n}=Z_{n}/B_{n}$）。鎖ホモトピーとホモトピー不変性は \ref{ha:chain-homotopy}, \ref{ha:homotopy-invariance}。
- 置換の符号 \ref{grp:sign}。PID 上の自由加群の部分加群は自由（\ref{mod:pid-submodule-free}）、スミス標準形 \ref{mod:smith-normal-form}、次元定理 \ref{lin:rank-nullity}。
- 単体的対象と面作用素の恒等式は \ref{cat:simplicial-object}（ここでは退化作用素を使わない）。
- **選択公理**：使わない（以下の複体は主に有限）。
:::

## 単体と単体複体 {#at:sec-sh-complexes}

::: definition 単体 {#at:simplex keywords="affinely independent points, geometric simplex, faces, standard n-simplex, face inclusion delta^i" index="単体|たんたい, 面（単体）|めんたんたい, 標準単体|ひょうじゅんたんたい, アフィン独立|あふぃんどくりつ"}
$\mathbb{R}^{N}$ の点 $v_{0},\dots,v_{n}$ が**アフィン独立**（$v_{1}-v_{0},\dots,v_{n}-v_{0}$ が一次独立）なとき、その凸包
$$
[v_{0},\dots,v_{n}]\defeq\Bigl\{\sum_{i}t_{i}v_{i}:t_{i}\ge0,\ \sum_{i}t_{i}=1\Bigr\}
$$
を $n$ **単体**、$v_{i}$ をその頂点、頂点の空でない部分集合の凸包を**面**という（$(t_{i})$ は点ごとに一意で、**重心座標**という）。**標準 $n$ 単体** $\Delta^{n}\defeq[e_{0},\dots,e_{n}]\subset\mathbb{R}^{n+1}$。$i=0,\dots,n$ について、$\delta^{i}\colon\Delta^{n-1}\to\Delta^{n}$ を $(t_{0},\dots,t_{n-1})\mapsto(t_{0},\dots,t_{i-1},0,t_{i},\dots,t_{n-1})$（$i$ 番目の頂点の向かいの面への埋め込み）とする。
:::

::: definition 単体複体 {#at:simplicial-complex keywords="finite simplicial complex, polyhedron |K|, triangulation, vertex scheme, subcomplex" index="単体複体|たんたいふくたい, 多面体|ためんたい, 三角形分割|さんかくけいぶんかつ, 部分複体|ぶぶんふくたい"}
$\mathbb{R}^{N}$ の単体の有限集合 $K$ が**単体複体**であるとは、(a) $K$ の単体の面は $K$ に属し、(b) $K$ の 2 つの単体の共通部分は空か、両者の共通の面であることをいう。$|K|\defeq\bigcup_{\sigma\in K}\sigma$（相対位相）を $K$ の**多面体**という。空間 $X$ と同相写像 $|K|\to X$ を $X$ の**三角形分割**という。$K$ の単体の部分集合で (a) を満たすものを**部分複体**という。
:::

::: example
1. 単体 $\sigma$ のすべての面からなる複体を $\bar\sigma$、真の面全体を $\partial\bar\sigma$ と書く。$|\overline{\Delta^{n}}|=\Delta^{n}$ は $D^{n}$ と、$|\partial\overline{\Delta^{n+1}}|$ は $S^{n}$ と同相であることが知られている（重心からの放射状の射影による。ここでは $\partial\overline{\Delta^{n+1}}$ をそれ自体として計算し、位相的な結論は特異ホモロジーとの一致を待つ）。
2. 単体複体の頂点の集合と「単体を張る頂点の集合」の族（**頂点図式**）だけで、$|K|$ は同相を除いて決まる（同じ頂点図式なら頂点の対応をアフィンに延ばした写像が同相になる）。以下、単体を頂点の集合と同一視する。
:::

単体複体の条件 (b) は計算には強すぎることが多い（トーラスの三角形分割には少なくとも 7 頂点が要ることが知られている）。面の貼り合わせ方だけを記録する、次の一般化を使う。

::: definition Δ 複体 {#at:delta-complex keywords="Delta-complex, semi-simplicial set, face maps d_i with d_i d_j = d_{j-1} d_i, geometric realization" index="Δ 複体|でるたふくたい, 半単体的集合|はんたんたいてきしゅうごう, 幾何学的実現|きかがくてきじつげん"}
集合の列 $X_{0},X_{1},\dots$ と写像 $d_{i}\colon X_{n}\to X_{n-1}$（$n\ge1$, $0\le i\le n$。**面作用素**）で
$$
d_{i}d_{j}=d_{j-1}d_{i}\qquad(i<j)
$$
を満たすものを **Δ 複体**（半単体的集合）という。$X_{n}$ の元を $n$ 単体という。各 $X_{n}$ が有限で、十分大きい $n$ で $X_{n}=\varnothing$ のとき有限という。**幾何学的実現**は
$$
|X|\defeq\Bigl(\bigsqcup_{n}X_{n}\times\Delta^{n}\Bigr)\Big/\bigl((d_{i}x,t)\sim(x,\delta^{i}t)\bigr)
$$
（$X_{n}$ は離散、生成された同値関係による商位相）。
:::

::: intuition
$X_{n}$ の各元は 1 枚の $n$ 単体で、$d_{i}x$ は「$x$ の $i$ 番目の頂点の向かいの面に貼られている $(n-1)$ 単体」である。恒等式 $d_{i}d_{j}=d_{j-1}d_{i}$ は、$j$ 番目の頂点を除いてから $i$ 番目を除くことと、$i$ 番目を除いてから（番号が 1 つずれた）$j-1$ 番目を除くことが同じ面を与える、という番号付けの整合性である。単体複体と違い、1 つの単体の 2 つの面が同じ単体に貼られてもよい。
:::

::: example
1. **順序付き単体複体.** 単体複体 $K$ の頂点に全順序を入れ、$X_{n}\defeq\{(v_{0}<\dots<v_{n}):\{v_{0},\dots,v_{n}\}\in K\}$、$d_{i}$ を $v_{i}$ を除く写像とすると Δ 複体 $K_{<}$ が得られる（$d_{i}d_{j}$ と $d_{j-1}d_{i}$ はともに $v_{i}$ と $v_{j}$ を除く）。
2. **トーラス $T$.** 1 つの頂点 $v$、3 つの辺 $a,b,c$、2 つの三角形 $U,L$ をもち、
$$
d_{0}U=b,\ d_{1}U=c,\ d_{2}U=a,\qquad d_{0}L=a,\ d_{1}L=c,\ d_{2}L=b,
$$
辺の面はすべて $v$ とする。正方形 $[0,1]^{2}$ を対角線で 2 つの三角形に分け、対辺を同じ向きに貼り合わせたものの記録である（$a$ は下辺＝上辺、$b$ は右辺＝左辺、$c$ は対角線）。
3. **実射影平面 $P$.** 頂点 $v,w$、辺 $a,b,c$、三角形 $U,L$ で
$$
d_{0}U=b,\ d_{1}U=a,\ d_{2}U=c,\qquad d_{0}L=a,\ d_{1}L=b,\ d_{2}L=c,
$$
$d_{0}a=d_{0}b=w$, $d_{1}a=d_{1}b=v$, $d_{0}c=d_{1}c=v$。正方形の対辺を逆向きに貼り合わせた（対角の頂点どうしが同一視される）ものの記録で、$U=[P_{00},P_{11},P_{10}]$, $L=[P_{00},P_{11},P_{01}]$ と頂点の順序を付けた。恒等式は、例えば $d_{0}d_{1}U=d_{0}a=w=d_{0}b=d_{0}d_{0}U$ のように 6 通りずつ確かめられる。
:::

## 鎖複体とホモロジー {#at:sec-sh-homology}

::: definition 単体的鎖複体とホモロジー {#at:simplicial-chains keywords="simplicial chain complex C_n(X) free on n-simplices, boundary operator sum (-1)^i d_i, simplicial homology H_n(X), augmentation, reduced homology" index="単体的鎖複体|たんたいてきさふくたい, 単体的ホモロジー|たんたいてきほもろじー, 添加写像|てんかしゃぞう, 被約ホモロジー|ひやくほもろじー, 簡約ホモロジー|かんやくほもろじー"}
Δ 複体 $X$ について、$C_{n}(X)$ を $X_{n}$ 上の自由アーベル群（$n<0$ では $0$）とし、
$$
\partial_{n}\colon C_{n}(X)\to C_{n-1}(X),\qquad\partial_{n}x\defeq\sum_{i=0}^{n}(-1)^{i}d_{i}x\quad(x\in X_{n})
$$
とする。$\partial\partial=0$（\ref{at:boundary-squared}）なので鎖複体で、そのホモロジー $H_{n}(X)\defeq H_{n}(C(X))$ を $X$ の**単体的ホモロジー**という。**添加写像** $\varepsilon\colon C_{0}(X)\to\mathbb{Z}$, $\varepsilon(x)=1$（$x\in X_{0}$）について $\varepsilon\partial_{1}=0$（$\varepsilon(d_{0}x-d_{1}x)=0$）。$C_{-1}\defeq\mathbb{Z}$, $\partial_{0}\defeq\varepsilon$ とした鎖複体 $\tilde C(X)$ のホモロジー $\tilde H_{n}(X)$ を**被約ホモロジー**という（$X_{0}\ne\varnothing$ なら $\tilde H_{n}=H_{n}$（$n\ge1$）、$H_{0}\cong\tilde H_{0}\oplus\mathbb{Z}$：$\tilde H_{0}=\ker\varepsilon/B_{0}$, $H_{0}=C_{0}/B_{0}$ なので完全列 $0\to\tilde H_{0}\to H_{0}\xrightarrow{\varepsilon}\mathbb{Z}\to0$ があり、$\varepsilon$ は全射で $\mathbb{Z}$ は自由なので分裂する）。
:::

::: lemma 境界の境界は 0 {#at:boundary-squared keywords="boundary of a boundary is zero for Delta-complexes" index="境界の境界は 0|きょうかいのきょうかいはぜろ"}
$\partial_{n-1}\partial_{n}=0$。
:::

::: proof
$x\in X_{n}$ について $\partial\partial x=\sum_{j=0}^{n}\sum_{i=0}^{n-1}(-1)^{i+j}d_{i}d_{j}x$。和を $i<j$ の部分 $A$ と $i\ge j$ の部分 $B$ に分ける。$i<j$ なら $d_{i}d_{j}=d_{j-1}d_{i}$ で、$(i,j)\mapsto(a,b)\defeq(j-1,i)$ は $\{(i,j):0\le i<j\le n\}$ から $\{(a,b):0\le b\le a\le n-1\}$（$B$ の添字集合）への全単射。項は $(-1)^{i+j}d_{i}d_{j}x=(-1)^{a+b+1}d_{a}d_{b}x$ となるので $A=-B$、$\partial\partial x=0$。
:::

::: intuition
$n$ 鎖は $n$ 単体に整数の重みを付けた形式和、$\partial$ は向きを込めた境界をとる操作。サイクル（$\partial z=0$）は「境界のない膜」、境界 $\partial c$ は「何かの縁になっている膜」で、$H_{n}$ は縁にならない閉じた膜を、縁になるものの差を無視して数える。
:::

::: proposition 0 次ホモロジー {#at:h0-components keywords="H_0 is free abelian on the edge-path components; reduced H_0 vanishes iff connected" index="0 次ホモロジー|ぜろじほもろじー"}
Δ 複体 $X$ の頂点の上の、「$d_{0}e$ と $d_{1}e$ を結ぶ辺 $e$ がある」から生成される同値関係の類を $X$ の（辺道の）**成分**という。$H_{0}(X)$ は成分の集合上の自由アーベル群と同型で、$\tilde H_{0}(X)=0$ と「成分がちょうど 1 つ」は同値。
:::

::: proof
$\Theta\colon C_{0}(X)\to\mathbb{Z}^{(\text{成分})}$ を頂点をその成分に送る準同型とする。全射。$\Theta\partial e=\Theta(d_{0}e)-\Theta(d_{1}e)=0$（同じ成分）なので $B_{0}\subset\ker\Theta$。逆に $\ker\Theta\subset B_{0}$：$c=\sum n_{v}v\in\ker\Theta$ なら、各成分で係数の和が $0$。成分ごとに代表 $v_{*}$ を 1 つ固定し（有限の Δ 複体では有限回の選択。無限個の成分があれば成分ごとの代表を一斉に選ぶことになり、頂点集合に整列順序があればそれで最小のものをとればよい）、$v$ と $v_{*}$ が辺の列で結ばれるので $v-v_{*}\in B_{0}$（辺ごとに $\pm\partial e$ を足す）。$c=\sum n_{v}(v-v_{*})+\sum_{\text{成分}}(\sum n_{v})v_{*}=\sum n_{v}(v-v_{*})\in B_{0}$。よって $H_{0}=C_{0}/B_{0}\cong\mathbb{Z}^{(\text{成分})}$。被約の主張は $\tilde H_{0}=\ker\varepsilon/B_{0}$ で、$\varepsilon$ は $\Theta$ の後に成分の和をとる写像なので、$\ker\varepsilon/B_{0}$ は成分の数が 1 のとき $0$、2 以上なら $0$ でない（2 成分の代表の差）。
:::

::: example 計算例
1. **トーラス**（例 2）：$\partial a=\partial b=\partial c=v-v=0$。$\partial U=d_{0}U-d_{1}U+d_{2}U=b-c+a$、$\partial L=a-c+b$。よって $Z_{2}=\ker\partial_{2}=\mathbb{Z}(U-L)$、$B_{1}=\mathbb{Z}(a+b-c)$。$\{a,b,a+b-c\}$ は $C_{1}$ の基底なので
$$
H_{0}(T)\cong\mathbb{Z},\qquad H_{1}(T)\cong\mathbb{Z}^{2},\qquad H_{2}(T)\cong\mathbb{Z},
$$
$H_{1}$ は $a,b$ の類で生成され、$H_{2}$ は $U-L$ で生成される。
2. **実射影平面**（例 3）：$\partial a=\partial b=w-v$, $\partial c=0$。$Z_{1}=\{xa+yb+zc:x+y=0\}$ は $e_{1}\defeq a-b$, $e_{2}\defeq c$ を基底にもつ。$\partial U=b-a+c=-e_{1}+e_{2}$、$\partial L=a-b+c=e_{1}+e_{2}$。$pU+qL\mapsto(q-p)e_{1}+(p+q)e_{2}$ は単射なので $H_{2}(P)=0$。$H_{1}=Z_{1}/B_{1}$ は関係 $e_{2}=e_{1}$, $e_{1}+e_{2}=0$ をもつ $e_{1},e_{2}$ 上のアーベル群で、$e_{2}$ を消去すると $2e_{1}=0$。$B_{0}=\mathbb{Z}(w-v)$ なので
$$
H_{0}(P)\cong\mathbb{Z},\qquad H_{1}(P)\cong\mathbb{Z}/2\mathbb{Z},\qquad H_{2}(P)=0.
$$
:::

::: remark
$H_{1}(T)\cong\mathbb{Z}^{2}\cong\pi_{1}(T)$、$H_{1}(P)\cong\mathbb{Z}/2\cong\pi_{1}(\mathbb{R}P^{2})$ と、どちらも基本群のアーベル化（\ref{at:surfaces-distinguished}）に一致する。これは偶然ではなく、弧状連結な空間の $H_{1}$ は $\pi_{1}$ のアーベル化である（フレヴィッツの定理、\ref[フレヴィッツとホワイトヘッドの定理]{at:page-hurewicz-whitehead}）。一方 $H_{2}(T)\cong\mathbb{Z}$ と $H_{2}(P)=0$ の違いは向き付け可能性を反映している（\ref[ポアンカレ双対性]{at:page-poincare-duality}）。
:::

## 単体複体のホモロジーと単体写像 {#at:sec-sh-maps}

単体複体のホモロジーを順序付き Δ 複体 $K_{<}$ で定義すると、頂点の順序に依存するように見える。向きを符号で記録する鎖複体を使うと、順序によらないことが分かる。

::: definition 有向単体の鎖複体 {#at:oriented-chains keywords="oriented chain complex of a simplicial complex: [v_{pi 0},...,v_{pi n}] = sgn(pi)[v_0,...,v_n], degenerate tuples are zero" index="有向単体|ゆうこうたんたい, 向き（単体）|むきたんたい"}
単体複体 $K$ について、$C^{\mathrm{or}}_{n}(K)$ を、$n$ 単体を張る相異なる頂点の列 $(v_{0},\dots,v_{n})$ 上の自由アーベル群を、関係 $(v_{\pi(0)},\dots,v_{\pi(n)})-\operatorname{sgn}(\pi)(v_{0},\dots,v_{n})$ で割った群とし、類を $[v_{0},\dots,v_{n}]$（**有向単体**）と書く。頂点に重複がある列については $[v_{0},\dots,v_{n}]\defeq0$ と約束する。$\partial[v_{0},\dots,v_{n}]\defeq\sum_{i}(-1)^{i}[v_{0},\dots,\widehat{v_{i}},\dots,v_{n}]$。
:::

::: proposition 向きの鎖複体と順序 {#at:oriented-ordered-iso keywords="the oriented chain complex is well defined and isomorphic to the chain complex of K_< for every vertex order" index="向きの鎖複体と順序|むきのさふくたいとじゅんじょ"}
1. $C^{\mathrm{or}}_{n}(K)$ は $K$ の $n$ 単体の個数を階数とする自由アーベル群で、各単体について頂点の 1 つの並べ方を選んだものが基底になる。
2. $\partial$ は well-defined で、頂点の任意の全順序について $(v_{0}<\dots<v_{n})\mapsto[v_{0},\dots,v_{n}]$ は鎖複体の同型 $C(K_{<})\to C^{\mathrm{or}}(K)$。
したがって $H_{n}(K)\defeq H_{n}(C^{\mathrm{or}}(K))\cong H_{n}(K_{<})$ は順序によらない。
:::

::: proof
**Step 1（1）.** 生成元は単体ごとに分かれるので、1 つの単体 $\sigma=\{v_{0},\dots,v_{n}\}$ について調べればよい。$\sigma$ の並べ方 $(v_{\pi(0)},\dots)$ を $\operatorname{sgn}(\pi)$ に送る準同型は関係を $0$ に送り（$\operatorname{sgn}$ は準同型）、商から $\mathbb{Z}$ への同型を与える（逆写像は $1\mapsto[v_{0},\dots,v_{n}]$。商ではすべての並べ方が $\pm[v_{0},\dots,v_{n}]$ に等しいので全射）。

**Step 2（$\partial$ の well-definedness）.** 隣り合う互換が対称群を生成するので、$v_{k}$ と $v_{k+1}$ の入れ替えで右辺が $-1$ 倍になることを示せばよい。$i\ne k,k+1$ の項は、残った列でも $v_{k},v_{k+1}$ が隣り合って入れ替わるので $-1$ 倍。$i=k$ の項 $(-1)^{k}[\dots,\widehat{v_{k}},v_{k+1},\dots]$ と $i=k+1$ の項 $(-1)^{k+1}[\dots,v_{k},\widehat{v_{k+1}},\dots]$ は、入れ替え後には $(-1)^{k}[\dots,\widehat{v_{k+1}},v_{k},\dots]$ と $(-1)^{k+1}[\dots,v_{k+1},\widehat{v_{k}},\dots]$ になり、それぞれ元の $i=k+1$, $i=k$ の項の $-1$ 倍。

**Step 3（2）.** 1 から、順序に従って並べた有向単体は基底なので、写像は各次数で同型。$\partial$ は両辺で同じ式なので鎖写像。
:::

::: definition 単体写像 {#at:simplicial-map keywords="simplicial map between simplicial complexes, induced chain map f_#" index="単体写像|たんたいしゃぞう"}
単体複体の間の写像 $f\colon K^{(0)}\to L^{(0)}$（頂点の写像）で、$K$ の単体の像が $L$ の単体を張るものを**単体写像**という。$f_{\#}[v_{0},\dots,v_{n}]\defeq[f(v_{0}),\dots,f(v_{n})]$（重複があれば $0$）とおく。$f$ は各単体の上でアフィンに延ばした連続写像 $|f|\colon|K|\to|L|$ を定める。
:::

::: proposition 単体写像は鎖写像を誘導する {#at:simplicial-map-chain keywords="f_# commutes with the boundary, functoriality of simplicial homology" index="単体写像の誘導準同型|たんたいしゃぞうのゆうどうじゅんどうけい"}
$f_{\#}$ は鎖写像で、$(g\circ f)_{\#}=g_{\#}\circ f_{\#}$。したがって $H_{n}$ は単体複体と単体写像の圏からアーベル群の圏への関手。
:::

::: proof
**Step 1.** $f_{\#}$ は関係を保つ（$f$ で並べ替えた列も同じ置換で並べ替わる）ので well-defined。$w_{i}\defeq f(v_{i})$ とする。$w_{i}$ がすべて異なれば $\partial f_{\#}=f_{\#}\partial$ は式の比較から明らか。

**Step 2（重複がある場合）.** $f_{\#}[v_{0},\dots,v_{n}]=0$ なので、$f_{\#}\partial[v_{0},\dots,v_{n}]=\sum_{i}(-1)^{i}[w_{0},\dots,\widehat{w_{i}},\dots,w_{n}]=0$ を示す。重複が 2 か所以上（同じ値が 3 回以上、または 2 組）なら、どの項も重複を含み $0$。ちょうど $w_{j}=w_{k}$（$j<k$）だけが重複なら、$i\ne j,k$ の項は $0$。残る 2 項について、$[w_{0},\dots,\widehat{w_{k}},\dots,w_{n}]$ は $[w_{0},\dots,\widehat{w_{j}},\dots,w_{n}]$ の中の $w_{k}$（$=w_{j}$）を位置 $k-1$ から位置 $j$ へ移したもので、これは長さ $k-j$ の巡回置換、符号 $(-1)^{k-j-1}$。よって
$$
(-1)^{j}T_{j}+(-1)^{k}T_{k}=(-1)^{j}T_{j}+(-1)^{k}(-1)^{k-j-1}T_{j}=(-1)^{j}T_{j}-(-1)^{j}T_{j}=0
$$
（$T_{i}$ は $i$ 番目を除いた項）。

**Step 3.** 関手性は定義の式から。
:::

::: definition 錐 {#at:cone-complex keywords="cone on a simplicial complex with cone point v" index="錐（単体複体）|すいたんたいふくたい"}
単体複体 $K$ と頂点 $v$ について、$K$ の任意の単体 $\sigma$ に対し $\sigma\cup\{v\}$ も $K$ の単体であるとき、$K$ を $v$ を頂点とする**錐**という。単体 $\overline{\Delta^{n}}$ は任意の頂点について錐である。
:::

::: theorem 錐は非輪状 {#at:cone-acyclic keywords="a cone has trivial reduced homology; the simplex is acyclic" index="非輪状|ひりんじょう, 錐の非輪状性|すいのひりんじょうせい"}
$K$ が錐なら $\tilde H_{n}(K)=0$（すべての $n$）。とくに $H_{0}(\overline{\Delta^{n}})\cong\mathbb{Z}$、$H_{k}(\overline{\Delta^{n}})=0$（$k\ge1$）。
:::

::: proof
**Step 1（作用素）.** $h\colon C^{\mathrm{or}}_{n}(K)\to C^{\mathrm{or}}_{n+1}(K)$, $h[v_{0},\dots,v_{n}]\defeq[v,v_{0},\dots,v_{n}]$ とする（$v$ が $v_{i}$ のどれかなら重複で $0$。$K$ が錐なので右辺は定義される。並べ替えと両立するので well-defined）。$h_{-1}\colon\mathbb{Z}\to C_{0}$, $1\mapsto[v]$ とする。

**Step 2（$n\ge1$, $v\notin\sigma$）.** $\sigma=[v_{0},\dots,v_{n}]$ について
$$
\partial h\sigma=\sigma+\sum_{i}(-1)^{i+1}[v,v_{0},\dots,\widehat{v_{i}},\dots,v_{n}]=\sigma-h\partial\sigma.
$$

**Step 3（$n\ge1$, $v\in\sigma$）.** 並べ替えて $\sigma=[v,w_{1},\dots,w_{n}]$ としてよい。$h\sigma=0$。$\partial\sigma$ の項のうち $v$ を含むものは $h$ で $0$ になり、残るのは $i=0$ の項 $[w_{1},\dots,w_{n}]$ で、$h[w_{1},\dots,w_{n}]=\sigma$。よって $\partial h\sigma+h\partial\sigma=\sigma$。

**Step 4（$n=0$）.** $\sigma=[w]$, $w\ne v$ なら $\partial h\sigma=[w]-[v]=\sigma-h_{-1}\varepsilon\sigma$。$w=v$ なら $h\sigma=0$ で $\sigma-h_{-1}\varepsilon\sigma=0$。

**Step 5.** Step 2〜4 から、被約鎖複体 $\tilde C^{\mathrm{or}}(K)$ 上で $\partial h+h\partial=1$（次数 $-1$ では $\varepsilon h_{-1}=1$）。恒等写像が $0$ と鎖ホモトープなので $\tilde H_{n}(K)=0$（\ref{ha:homotopy-invariance}）。

::: hypcheck
- 錐の条件は Step 1（$h$ の値が $K$ の単体であること）だけに使った。
:::
:::

::: theorem 球面の単体的ホモロジー {#at:sphere-simplicial-homology keywords="homology of the boundary of the (n+1)-simplex: H_n = Z, other reduced groups vanish" index="球面のホモロジー（単体的）|きゅうめんのほもろじーたんたいてき"}
$n\ge0$ について、$\Sigma^{n}\defeq\partial\overline{\Delta^{n+1}}$（$|\Sigma^{n}|\cong S^{n}$）は
$$
\tilde H_{k}(\Sigma^{n})\cong\begin{cases}\mathbb{Z}&(k=n)\\0&(k\ne n)\end{cases}
$$
を満たし、$\tilde H_{n}$ は $\partial[e_{0},\dots,e_{n+1}]$ の類で生成される。
:::

::: proof
$\Delta\defeq\overline{\Delta^{n+1}}$ とすると、$\tilde C(\Sigma^{n})$ は $\tilde C(\Delta)$ から次数 $n+1$ の項（$\mathbb{Z}\tau$, $\tau=[e_{0},\dots,e_{n+1}]$）を除いた鎖複体。$k<n$ では次数 $k$ と $k+1$ の項と境界作用素が両者で同じなので $\tilde H_{k}(\Sigma^{n})=\tilde H_{k}(\Delta)=0$（\ref{at:cone-acyclic}）。$k=n$ では $\tilde H_{n}(\Sigma^{n})=Z_{n}(\Delta)$（$\Sigma^{n}$ には $(n+1)$ 単体がない）で、$\Delta$ の非輪状性から $Z_{n}(\Delta)=B_{n}(\Delta)=\partial(\mathbb{Z}\tau)$。$\partial\tau\ne0$（$\tau$ の面は相異なる基底元）なので $\partial\colon\mathbb{Z}\tau\to Z_{n}$ は同型。$k>n$ では鎖群が $0$。
:::

## オイラー標数 {#at:sec-sh-euler}

::: theorem オイラー–ポアンカレの公式 {#at:euler-poincare keywords="Euler characteristic as alternating sum of numbers of simplices equals alternating sum of Betti numbers (rational homology dimensions)" index="オイラー標数|おいらーひょうすう, オイラー–ポアンカレの公式|おいらーぽあんかれのこうしき, ベッチ数|べっちすう"}
有限 Δ 複体 $X$ について $\chi(X)\defeq\sum_{n}(-1)^{n}|X_{n}|$（**オイラー標数**）とおき、$b_{n}(X)\defeq\dim_{\mathbb{Q}}H_{n}(C(X)\otimes\mathbb{Q})$（**ベッチ数**。$C(X)\otimes\mathbb{Q}$ は $X_{n}$ を基底とする $\mathbb{Q}$ ベクトル空間の鎖複体）とおく。このとき
$$
\chi(X)=\sum_{n}(-1)^{n}b_{n}(X).
$$
:::

::: proof
$C_{n}\defeq C_{n}(X)\otimes\mathbb{Q}$, $Z_{n}\defeq\ker\partial_{n}$, $B_{n}\defeq\operatorname{im}\partial_{n+1}$ とする。次元定理（\ref{lin:rank-nullity}）から $\dim C_{n}=\dim Z_{n}+\dim B_{n-1}$、定義から $b_{n}=\dim Z_{n}-\dim B_{n}$。交代和をとると
$$
\sum_{n}(-1)^{n}\dim C_{n}=\sum_{n}(-1)^{n}(\dim Z_{n}-\dim B_{n})+\sum_{n}(-1)^{n}(\dim B_{n}+\dim B_{n-1})
$$
で、最後の和は $\dim B_{n}$ の項が $n$ と $n+1$ で打ち消し合って $0$（和は有限で、$B_{-1}=0$）。$\dim C_{n}=|X_{n}|$。
:::

::: example
1. $\chi(\Sigma^{n})=\sum_{k=0}^{n}(-1)^{k}\binom{n+2}{k+1}=1+(-1)^{n}$ で、右辺 $b_{0}+(-1)^{n}b_{n}=1+(-1)^{n}$（$n\ge1$）と一致する。
2. トーラス：$\chi=1-3+2=0=1-2+1$。実射影平面：$\chi=2-3+2=1$。$\mathbb{Q}$ 係数では $\mathbb{Z}/2$ が消えるので $b_{1}(P)=0$ で、$1-0+0=1$。
3. **グラフ**（1 次元の複体）が連結なら $H_{1}=Z_{1}\subset C_{1}$ は自由アーベル群（\ref{mod:pid-submodule-free}）で、階数は $b_{1}=b_{0}-\chi=1-V+E$（$V$ は頂点の数、$E$ は辺の数）。
:::

::: supplement
**一般化と注意.** オイラー標数は、三角形分割（Δ 複体の構造）によらず空間だけで決まる：右辺のベッチ数が特異ホモロジーと一致する（\ref[単体的ホモロジーと特異ホモロジーの一致]{at:page-simplicial-singular}）ので。とくに球面 $S^{2}$ のどんな三角形分割でも頂点・辺・面の数は $V-E+F=2$ を満たす（オイラーの多面体定理）。これは位相不変性を経由しないと証明が難しい（凸多面体の場合だけなら初等的な証明がある）。なお、「同相な多面体は組合せ的にも同値な三角形分割をもつか」（基本予想、Hauptvermutung）は一般には偽であることが知られている（ミルナー、1961。本サイト未収録）。

**高い視点.** Δ 複体は、順序数の圏 $\Delta$ の単射だけからなる部分圏 $\Delta_{\mathrm{inj}}$ からの前層 $\Delta_{\mathrm{inj}}^{\mathrm{op}}\to\mathbf{Set}$ にほかならない（$d_{i}$ は面の埋め込み $\delta_{i}$ に対応する。単体的集合 \ref{cat:simplicial-object} から退化作用素を忘れたもの）。$C(X)$ は「自由アーベル群をとる関手 $\mathbf{Set}\to\mathbf{Ab}$」を各次数に施し、面作用素の交代和を境界にした鎖複体で、\ref{cat:simplicial-chain-complex} の交代和の構成の半単体版である。比喩で言えば、単体的ホモロジーは空間を「積み木（単体）」で組み立てた設計図から、境界の打ち消し合いという線形代数だけで穴を数える方法であり、設計図の選び方によらないことが特異ホモロジーとの比較の内容である。
:::

::: supplement 計算の観点
有限 Δ 複体のホモロジーは、境界作用素の整数行列 $\partial_{n}$ のスミス標準形（\ref{mod:smith-normal-form}）から求まる：$\partial_{n+1}$ の単因子を $d_{1},\dots,d_{r}$（$r=\operatorname{rank}\partial_{n+1}$）とすると
$$
H_{n}\cong\mathbb{Z}^{|X_{n}|-\operatorname{rank}\partial_{n}-r}\oplus\bigoplus_{i}\mathbb{Z}/d_{i}\mathbb{Z}.
$$
スミス標準形は多項式時間で計算できるアルゴリズムが知られており（係数の膨張を抑える工夫が要る。本サイト未収録）、有限複体のホモロジーは単体の数について多項式時間で計算できる。基本群（\ref{at:page-van-kampen} の計算の観点：自明性さえ決定不能）とは対照的である。
:::

## 問題 {#at:sec-sh-problems}

::: problem {#at:prob-klein-bottle}
**クラインの壺** $K$ を、頂点 $v$、辺 $a,b,c$、三角形 $U,L$ をもち
$$
d_{0}U=b,\ d_{1}U=a,\ d_{2}U=c,\qquad d_{0}L=a,\ d_{1}L=c,\ d_{2}L=b,
$$
辺の面はすべて $v$ である Δ 複体とする（正方形の上下の辺を同じ向きに、左右の辺を逆向きに貼り合わせ、$U=[P_{00},P_{11},P_{10}]$, $L=[P_{00},P_{01},P_{11}]$ と頂点を並べたもの）。$H_{1}(K)\cong\mathbb{Z}\oplus\mathbb{Z}/2\mathbb{Z}$, $H_{2}(K)=0$ を示せ。
:::

::: solution
$\partial a=\partial b=\partial c=0$、$\partial U=b-a+c$, $\partial L=a-c+b$。$pU+qL\mapsto(q-p)a+(p+q)b+(p-q)c$ は単射（$p=q$ かつ $p+q=0$）なので $H_{2}=0$。$H_{1}=\mathbb{Z}\{a,b,c\}/\langle b-a+c,\ a+b-c\rangle$。$u\defeq a-c$ とすると $\{u,b,c\}$ は基底で、関係は $b-u$, $b+u$。さらに $w\defeq b+u$ とすると $\{w,b,c\}$ は基底で、関係は $w$ と $2b-w$。よって $H_{1}\cong\mathbb{Z}/2\mathbb{Z}\,b\oplus\mathbb{Z}c$。
:::

::: problem {#at:prob-disjoint-wedge}
Δ 複体 $X$, $Y$ の非交和について $H_{n}(X\sqcup Y)\cong H_{n}(X)\oplus H_{n}(Y)$ を示せ。また、頂点 $x_{0}\in X_{0}$, $y_{0}\in Y_{0}$ を同一視した Δ 複体 $X\vee Y$ について $\tilde H_{n}(X\vee Y)\cong\tilde H_{n}(X)\oplus\tilde H_{n}(Y)$ を示せ。
:::

::: solution
非交和の鎖複体は直和 $C(X)\oplus C(Y)$ で、ホモロジーは直和と可換。ウェッジでは $C_{n}(X\vee Y)=C_{n}(X)\oplus C_{n}(Y)$（$n\ge1$）、$C_{0}(X\vee Y)=(C_{0}(X)\oplus C_{0}(Y))/\mathbb{Z}(x_{0}-y_{0})$。被約鎖複体について、$\tilde C(X)\oplus\tilde C(Y)\to\tilde C(X\vee Y)$ を自然な写像（次数 $-1$ では和 $\mathbb{Z}\oplus\mathbb{Z}\to\mathbb{Z}$）とすると全射で、核は次数 $0$ の $\mathbb{Z}(x_{0}-y_{0})$ と次数 $-1$ の $\mathbb{Z}(1,-1)$ からなる鎖複体 $\mathbb{Z}\xrightarrow{\cong}\mathbb{Z}$（$\varepsilon(x_{0}-y_{0})$ は直和の中で $(1,-1)$）で、そのホモロジーは $0$。長完全列（\ref{ha:long-exact-sequence}）から同型。
:::

::: problem {#at:prob-euler-graph-tree}
連結なグラフ（1 次元の単体複体）で $H_{1}=0$ となるもの（木）は $E=V-1$ を満たすことを示せ。
:::

::: solution
\ref{at:euler-poincare} から $V-E=\chi=b_{0}-b_{1}=1-0$。（$H_{1}=0$ なら $\mathbb{Q}$ 係数でも $H_{1}=Z_{1}\otimes\mathbb{Q}=0$：グラフでは $H_{1}=Z_{1}$ は $C_{1}$ の部分群で、$Z_{1}\otimes\mathbb{Q}$ は $C_{1}\otimes\mathbb{Q}$ での核と一致する。）
:::
