# 球面の写像度 {#at:page-degree keywords="degree of a map of spheres, homotopy invariance of degree, suspension preserves degree, reflection has degree -1, antipodal map has degree (-1)^{n+1}, fixed points, hairy ball theorem, tangent vector fields on spheres, degree on the circle equals winding number, generator of H_1(S^1), two-hemisphere formula, relative degree on (D^m, boundary)"}

$\tilde H_{n}(S^{n})\cong\mathbb{Z}$（\ref{at:sphere-homology}）なので、連続写像 $f\colon S^{n}\to S^{n}$ は $\tilde H_{n}$ 上の整数倍として働く。この整数が**写像度**で、円周では閉道の回転数（\ref{at:degree-loop}）と一致する。このページでは写像度の基本性質を示し、鏡映の写像度が $-1$、対蹠写像の写像度が $(-1)^{n+1}$ であることから、不動点の存在と「偶数次元の球面には至る所 $0$ でない接ベクトル場がない」こと（**毛の生えた球面の定理**）を導く。最後に、胞体境界の計算（\ref[CW 複体と胞体ホモロジー]{at:page-cellular-homology}）で使う「二つの半球の公式」を示す。

> 資料：標準的な内容（Massey『Singular Homology Theory』、Fulton『Algebraic Topology』の写像度の章など）。鏡映の写像度を懸垂で帰納的に計算する議論と、二つの半球の公式は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-deg-notation}

::: notation
- 球面と円板のホモロジー \ref{at:sphere-homology}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}（$U=S^{n}\setminus\{N\}$, $V=S^{n}\setminus\{S\}$ による）、良い対と商空間 \ref{at:good-pair}、ホモトピー不変性 \ref{at:singular-homotopy-invariance}、連結射の自然性 \ref{ha:connecting-natural}。
- $N\defeq e_{n+1}$, $S\defeq-e_{n+1}$。$x\in\mathbb{R}^{n+1}$ を $(x',x_{n+1})$（$x'\in\mathbb{R}^{n}$）と書く。赤道 $E\defeq\{x_{n+1}=0\}\cap S^{n}=S^{n-1}\times\{0\}$。閉半球 $D_{\pm}\defeq\{\pm x_{n+1}\ge0\}$ と同相写像 $p_{\pm}\colon D^{n}\to D_{\pm}$, $p_{\pm}(y)\defeq(y,\pm\sqrt{1-|y|^{2}})$（\ref{at:cube-disk}）。
- 閉道の写像度（回転数）\ref{at:degree-loop}、$\omega_{k}(s)=e^{2\pi iks}$、円周の基本群 \ref{at:fundamental-group-circle}、フレヴィッツ準同型 \ref{at:hurewicz-homomorphism}。
- **選択公理**：使わない。
:::

## 定義と基本性質 {#at:sec-deg-definition}

::: definition 写像度 {#at:degree keywords="degree of a continuous map S^n -> S^n defined by the action on reduced H_n" index="写像度|しゃぞうど"}
$n\ge0$ と連続写像 $f\colon S^{n}\to S^{n}$ について、$f_{*}\colon\tilde H_{n}(S^{n})\to\tilde H_{n}(S^{n})$ は無限巡回群の自己準同型なので、ある整数 $d$ による $d$ 倍写像である（生成元 $u$ について $f_{*}u=du$ で、$d$ は $u$ の選び方によらない：$-u$ についても $f_{*}(-u)=d(-u)$）。$d$ を $f$ の**写像度**といい $\deg f$ と書く。
:::

::: proposition 写像度の基本性質 {#at:degree-properties keywords="deg id = 1, deg(fg) = deg f deg g, homotopic maps have the same degree, homotopy equivalences have degree +-1, non-surjective maps have degree 0" index="写像度の基本性質|しゃぞうどのきほんせいしつ"}
1. $\deg1=1$、$\deg(g\circ f)=\deg g\cdot\deg f$。
2. $f\simeq g$ なら $\deg f=\deg g$。ホモトピー同値（とくに同相写像）の写像度は $\pm1$。
3. $f$ が全射でなければ $\deg f=0$。
4. 同相写像 $h\colon S^{n}\to S^{n}$ について $\deg(h^{-1}fh)=\deg f$。
:::

::: proof
1：関手性。2：\ref{at:singular-homotopy-invariance}。$gf\simeq1$ なら $\deg g\deg f=1$ で、整数なので $\pm1$。3：$y\notin f(S^{n})$ なら $f$ は $S^{n}\setminus\{y\}\cong\mathbb{R}^{n}$（可縮）を経由し、$\tilde H_{n}(\mathbb{R}^{n})=0$。4：1 と、整数の積の可換性。
:::

::: lemma 懸垂と写像度 {#at:suspension-degree keywords="the suspension of f: S^{n-1} -> S^{n-1} has the same degree; every integer is a degree" index="懸垂と写像度|けんすいとしゃぞうど"}
$n\ge1$ と $f\colon S^{n-1}\to S^{n-1}$ について、
$$
\Sigma f(x',x_{n+1})\defeq\Bigl(|x'|\,f\bigl(x'/|x'|\bigr),\ x_{n+1}\Bigr)\quad(x'\ne0),\qquad\Sigma f(\pm e_{n+1})\defeq\pm e_{n+1}
$$
は連続写像 $S^{n}\to S^{n}$ で、$\deg\Sigma f=\deg f$。
:::

::: proof
**Step 1（連続性）.** $x'\ne0$ では明らか。極の近くでは $|x'|\to0$ なので第 1 成分は $0$ に、第 2 成分は $\pm1$ に近づく。$|\Sigma f(x)|^{2}=|x'|^{2}+x_{n+1}^{2}=1$。

**Step 2（マイヤー–ヴィートリスの自然性）.** $\Sigma f$ は $N$, $S$ を固定し、$U$, $V$, $U\cap V$ をそれぞれ自分自身に写す。被約マイヤー–ヴィートリスの連結射 $\partial_{*}\colon\tilde H_{n}(S^{n})\to\tilde H_{n-1}(U\cap V)$ は同型（\ref{at:sphere-homology} の証明）で、$U,V$ を保つ写像について自然（短完全列 $0\to S(U\cap V)\to S(U)\oplus S(V)\to S(U)+S(V)\to0$ の写像と \ref{ha:connecting-natural}）。よって $\partial_{*}(\Sigma f)_{*}=(\Sigma f\restriction U\cap V)_{*}\partial_{*}$。

**Step 3（赤道への引き込み）.** $\rho\colon U\cap V\to E$, $\rho(x)\defeq(x'/|x'|,0)$ は、包含 $i\colon E\to U\cap V$ のホモトピー逆写像（$i\rho\simeq1$ は $\bigl(((1-t)+t/|x'|)x',(1-t)x_{n+1}\bigr)$ を正規化したホモトピー。ベクトルは $x'\ne0$ なので $0$ でない）。$\rho\circ\Sigma f=\Sigma f\circ\rho$ で、$E\cong S^{n-1}$ 上で $\Sigma f\restriction E=f$。よって $(\Sigma f\restriction U\cap V)_{*}$ は $i_{*}$ と $\rho_{*}$ を通して $f_{*}$ と同じ整数倍。

**Step 4.** Step 2・3 から $\deg\Sigma f=\deg f$（$n=1$ では被約 $\tilde H_{0}$ の上で）。
:::

::: proposition 鏡映と対蹠写像 {#at:degree-reflection keywords="a reflection of S^n has degree -1, the antipodal map has degree (-1)^{n+1}, orthogonal maps have degree det" index="鏡映の写像度|きょうえいのしゃぞうど, 対蹠写像の写像度|たいせきしゃぞうのしゃぞうど"}
1. 座標の鏡映 $r_{i}(x)\defeq(x_{1},\dots,-x_{i},\dots,x_{n+1})$ の写像度は $-1$。
2. 対蹠写像 $a(x)\defeq-x$ の写像度は $(-1)^{n+1}$。
:::

::: proof
**Step 1（$i=1$）.** $n=0$：$S^{0}=\{\pm1\}$ で $r_{1}$ は 2 点を入れ替え、$\tilde H_{0}(S^{0})$ の生成元 $[1]-[-1]$ を $[-1]-[1]$ に送る。$n\ge1$：$S^{n}$ の $r_{1}$ は $S^{n-1}$ の $r_{1}$ の懸垂（\ref{at:suspension-degree} の式に代入すると一致する）なので、帰納法で $\deg r_{1}=-1$。

**Step 2（一般の $i$）.** 座標 $1$ と $i$ を入れ替える同相写像 $h$ について $r_{i}=h^{-1}r_{1}h$（\ref{at:degree-properties.4}）。

**Step 3（対蹠写像）.** $a=r_{1}\circ\cdots\circ r_{n+1}$。
:::

::: theorem 不動点と写像度 {#at:degree-fixed-points keywords="a map without fixed points is homotopic to the antipodal map; a map with f(x) != -x for all x is homotopic to the identity" index="写像度と不動点|しゃぞうどとふどうてん"}
$f\colon S^{n}\to S^{n}$ について、
1. $f$ が不動点をもたなければ $f\simeq a$ で、$\deg f=(-1)^{n+1}$。
2. すべての $x$ で $f(x)\ne-x$ なら $f\simeq1$ で、$\deg f=1$。
とくに $n$ が偶数なら、任意の $f$ は不動点をもつか、ある $x$ を $-x$ に送る。
:::

::: proof
1：$H(x,t)\defeq\frac{(1-t)f(x)-tx}{|(1-t)f(x)-tx|}$。分母が $0$ なら $(1-t)f(x)=tx$ で、ノルムをとると $1-t=t$、すなわち $t=\frac12$ で $f(x)=x$ となり仮定に反する。$H$ は $f$ から $a$ へのホモトピー。2：$\frac{(1-t)f(x)+tx}{|\cdots|}$ で同様（分母が $0$ なら $f(x)=-x$）。最後：$n$ が偶数なら $(-1)^{n+1}=-1\ne1$ なので、1 と 2 の仮定が同時には成り立たない。
:::

::: theorem 毛の生えた球面の定理 {#at:hairy-ball keywords="S^n admits a nowhere vanishing continuous tangent vector field iff n is odd" index="毛の生えた球面の定理|けのはえたきゅうめんのていり, 接ベクトル場|せつべくとるば" refname="毛の生えた球面の定理"}
$S^{n}$ 上の連続写像 $v\colon S^{n}\to\mathbb{R}^{n+1}$ で、すべての $x$ で $v(x)\perp x$ かつ $v(x)\ne0$ となるもの（至る所 $0$ でない接ベクトル場）が存在するための必要十分条件は、$n$ が奇数であること。
:::

::: proof
**Step 1（奇数次元の構成）.** $n=2m-1$ なら $v(x)\defeq(-x_{2},x_{1},-x_{4},x_{3},\dots,-x_{2m},x_{2m-1})$ は $\langle v(x),x\rangle=0$, $|v(x)|=|x|=1$。

**Step 2（偶数次元では存在しない）.** $v$ があれば $w\defeq v/|v|$ とし、$H(x,t)\defeq\cos(\pi t)x+\sin(\pi t)w(x)$ とおく。$x\perp w(x)$ で両方単位ベクトルなので $|H(x,t)|=1$、$H$ は $1$ から $a$ へのホモトピー。$\deg a=(-1)^{n+1}=1$ となり、$n$ は奇数。
:::

::: supplement
**一般化.** 閉多様体上の接ベクトル場の零点の指数の和はオイラー標数に等しい（ポアンカレ–ホップの定理）。$\chi(S^{n})=1+(-1)^{n}$ は $n$ が偶数で $2\ne0$ なので、零点のないベクトル場は存在しない。この定理は知られている（多様体論の系列で扱う予定）。奇数次元の球面上で一次独立な接ベクトル場が最大何本とれるかは、アダムズによりラドン–フルヴィッツ数で決定されたことが知られている（本サイト未収録）。
:::

## 円周の写像度と回転数 {#at:sec-deg-circle}

::: proposition 円周の 1 次ホモロジーの生成元 {#at:circle-h1-generator keywords="the loop omega_1 generates H_1(S^1); degree on S^1 equals the winding number; z^k has degree k" index="円周の 1 次ホモロジー|えんしゅうのいちじほもろじー"}
1. 標準的な閉道 $\omega_{1}$ の類は $H_{1}(S^{1})\cong\mathbb{Z}$ の生成元。
2. $f\colon S^{1}\to S^{1}$ で $f(1)=1$ なら、写像度 $\deg f$ は閉道 $f\circ\omega_{1}$ の回転数（\ref{at:degree-loop}）に等しい。とくに $\deg(z\mapsto z^{k})=k$ で、\ref{at:suspension-degree} からすべての $n\ge1$ と $k\in\mathbb{Z}$ について写像度 $k$ の写像 $S^{n}\to S^{n}$ がある。
:::

::: proof
**Step 1（四分割）.** $q_{j}$（$j=1,2,3,4$）を $\omega_{1}$ の $[\frac{j-1}{4},\frac{j}{4}]$ の部分（$1\to i\to-1\to-i\to1$）とする。\ref{at:path-subdivision} と \ref{at:hurewicz-homomorphism.1}・\ref[2]{at:hurewicz-homomorphism.2} から、$H_{1}$ で $[\omega_{1}]=[q_{1}+q_{2}+q_{3}+q_{4}]$。

**Step 2（マイヤー–ヴィートリス）.** $U\defeq S^{1}\setminus\{-1\}$, $V\defeq S^{1}\setminus\{1\}$（開弧で可縮）、$U\cap V$ は上の開弧と下の開弧の非交和。$H_{1}(U)\oplus H_{1}(V)=0$ と $\tilde H_{0}(U)\oplus\tilde H_{0}(V)=0$ から $\partial_{*}\colon H_{1}(S^{1})\cong\tilde H_{0}(U\cap V)\cong\mathbb{Z}$ で、右辺は $[i]-[-i]$ で生成される（\ref{at:singular-h0-point}）。サイクル $z=a+b$（$a\in S(U)$, $b\in S(V)$）について $\partial_{*}[z]=[\partial a]$（連結射の構成）。$a\defeq q_{1}+q_{4}\in S(U)$, $b\defeq q_{2}+q_{3}\in S(V)$ とすると $\partial a=(i-1)+(1-(-i))=[i]-[-i]$。よって $\partial_{*}[\omega_{1}]$ は生成元で、$[\omega_{1}]$ も生成元。

**Step 3（2）.** $d$ を $f\circ\omega_{1}$ の回転数とすると、$f\circ\omega_{1}\simeq\omega_{d}$（\ref{at:fundamental-group-circle}：写像度が等しい閉道はホモトープ）。$[\omega_{d}]=[\omega_{1}]^{d}$ で $h$ は準同型なので、$f_{*}[\omega_{1}]=[f\circ\omega_{1}]=[\omega_{d}]=d[\omega_{1}]$。
:::

::: supplement
**写像度の二つの定義.** $f(1)\ne1$ の場合も、回転 $\rho$（$\rho\simeq1$ で写像度 $1$）を合成して $f(1)=1$ にすれば、ホモロジーの写像度と回転数は一致する。こうして AT-01 の「閉道の持ち上げの終点のずれ」と、ここでの「$H_{1}$ への作用」という全く異なる定義が同じ整数を与える。

**高い視点.** 写像度は $[S^{n},S^{n}]\to\mathbb{Z}$（ホモトピー類から整数への写像）で、これは全単射であることが知られている（ホップの定理。\ref[高次ホモトピー群とファイブレーション]{at:page-homotopy-groups} で $\pi_{n}(S^{n})\cong\mathbb{Z}$ として扱う）。比喩で言えば、写像度は「球面で球面を何重に包むか（向きを込めて）」の数え上げで、包み方の細部は連続変形で変わるが、重なりの総数は変わらない。
:::

## 二つの半球の公式 {#at:sec-deg-hemispheres}

::: lemma 円板の対の写像度 {#at:relative-degree keywords="for a map A: (D^m, boundary) -> (D^m, boundary), the action on H_m(D^m, boundary) equals the degree of the restriction to the boundary sphere" index="相対写像度|そうたいしゃぞうど"}
$m\ge1$ と、$A(\partial D^{m})\subset\partial D^{m}$ となる連続写像 $A\colon D^{m}\to D^{m}$ について、$A_{*}$ は $H_{m}(D^{m},\partial D^{m})\cong\mathbb{Z}$ 上で $\deg(A\restriction\partial D^{m})$ 倍。とくに $y\mapsto-y$ は $(-1)^{m}$ 倍。
:::

::: proof
被約の長完全列の連結射 $\partial\colon H_{m}(D^{m},\partial D^{m})\to\tilde H_{m-1}(\partial D^{m})$ は同型（\ref{at:sphere-homology}）で自然なので、$\partial A_{*}=(A\restriction\partial D^{m})_{*}\partial$。最後は \ref{at:degree-reflection.2}（$S^{m-1}$ の対蹠写像）。
:::

::: theorem 二つの半球の公式 {#at:two-hemispheres keywords="if f: S^m -> S^m collapses the equator to a point, then deg f = +-(deg g_+ - deg g_-), with a sign independent of f" index="二つの半球の公式|ふたつのはんきゅうのこうしき"}
$m\ge1$ とし、$\pi\colon D^{m}\to S^{m}$ を、$\partial D^{m}$ を 1 点 $y_{0}$ に写し、商 $D^{m}/\partial D^{m}\to S^{m}$ が同相となる連続写像として 1 つ固定する。$f\colon S^{m}\to S^{m}$ が赤道 $E$ を $y_{0}$ に写すとき、$f\circ p_{\pm}=g_{\pm}\circ\pi$ となる連続写像 $g_{\pm}\colon S^{m}\to S^{m}$ がただ一つずつあり、
$$
\deg f=\epsilon\,(\deg g_{+}-\deg g_{-})
$$
が成り立つ。ここで $\epsilon\in\{\pm1\}$ は $\pi$ だけで決まり、$f$ によらない。
:::

::: proof
**Step 1（$g_{\pm}$）.** $f\circ p_{\pm}$ は $\partial D^{m}$ を $y_{0}$ に写すので、商写像の普遍性（\ref{top:quotient-universal}）と同相 $D^{m}/\partial D^{m}\cong S^{m}$ から $g_{\pm}$ が一意に定まる。

**Step 2（$H_{m}(S^{m},E)$ の分解）.** $u$ を $H_{m}(D^{m},\partial D^{m})\cong\mathbb{Z}$ の生成元とする。$\pi_{*}\colon H_{m}(D^{m},\partial D^{m})\to H_{m}(S^{m},y_{0})\cong\tilde H_{m}(S^{m})$ は同型（\ref{at:good-pair}：$(D^{m},\partial D^{m})$ は良い対）。$s\defeq\pi_{*}u$ とおく。対の写像 $p_{\pm}\colon(D^{m},\partial D^{m})\to(S^{m},E)$ について、$H_{m}(S^{m},E)$ は $u_{+}\defeq p_{+*}u$ と $u_{-}\defeq p_{-*}u$ を基底とする階数 2 の自由アーベル群：実際、$(S^{m},E)$ は良い対で $S^{m}/E$ は $D_{+}/E$ と $D_{-}/E$（ともに $S^{m}$ と同相）のウェッジ和、そのホモロジーは各成分の和（問題 \ref{at:prob-wedge-spheres}）で、各成分の生成元が $u_{\pm}$ の像。

**Step 3（$\tilde H_{m}(S^{m})$ の像）.** 被約の長完全列
$$
0=\tilde H_{m}(E)\to\tilde H_{m}(S^{m})\xrightarrow{j}H_{m}(S^{m},E)\xrightarrow{\partial}\tilde H_{m-1}(E)\to\tilde H_{m-1}(S^{m})=0
$$
で、$p_{\pm}\restriction\partial D^{m}$ はどちらも $y\mapsto(y,0)$ なので $\partial u_{+}=\partial u_{-}$ で、これは $\tilde H_{m-1}(E)$ の生成元（\ref{at:relative-degree} の証明の連結射の同型）。よって $\ker\partial=\mathbb{Z}(u_{+}-u_{-})$ で、$j(s)=\epsilon(u_{+}-u_{-})$ となる符号 $\epsilon$ がある（$j$ は $\tilde H_{m}(S^{m})$ から $\ker\partial$ への同型）。$\epsilon$ は $\pi$（と $u$）だけで決まる。

**Step 4（$f$ の分解）.** $f$ は $E$ を $y_{0}$ に写すので、対の写像 $f\colon(S^{m},E)\to(S^{m},y_{0})$ を与え、$f_{*}\colon\tilde H_{m}(S^{m})\to\tilde H_{m}(S^{m})\cong H_{m}(S^{m},y_{0})$ は $f_{*}\circ j$ と一致する（$j$ の後に $f$ の誘導写像）。$f_{*}u_{\pm}=(f\circ p_{\pm})_{*}u=(g_{\pm}\circ\pi)_{*}u=g_{\pm*}s=(\deg g_{\pm})s$。よって
$$
f_{*}s=f_{*}j(s)=\epsilon(f_{*}u_{+}-f_{*}u_{-})=\epsilon(\deg g_{+}-\deg g_{-})s.
$$

::: hypcheck
- 符号 $\epsilon$ を決めないのは、$D^{m}$ と $S^{m}$ の「向き」を比べる必要があるため。胞体ホモロジーでの応用（射影空間）では、絶対値 $|\deg g_{+}-\deg g_{-}|$ だけで群の構造が決まるので、$\epsilon$ は要らない。
:::
:::

::: example 射影空間の貼り付け写像の写像度
$k\ge2$ とし、$q\colon S^{k-1}\to\mathbb{R}P^{k-1}$ を商写像、$c\colon\mathbb{R}P^{k-1}\to\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ を部分空間 $\mathbb{R}P^{k-2}$（$x_{k}=0$ の点の像）を潰す写像とする。$\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ は $\pi\defeq c\circ q\circ p_{+}\colon D^{k-1}\to\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ により $D^{k-1}/\partial D^{k-1}$ と同相（$q\circ p_{+}$ は開円板の上で単射で、境界 $\partial D^{k-1}\mapsto\mathbb{R}P^{k-2}$）で、これを $S^{k-1}$ と同一視する。$f\defeq c\circ q$ は赤道 $E$ を 1 点に写し、$g_{+}=1$。$q(-x)=q(x)$ と $p_{-}(y)=-p_{+}(-y)$ から $f\circ p_{-}(y)=f(p_{+}(-y))=\pi(-y)$ なので、$g_{-}$ は $y\mapsto-y$ の誘導写像で、\ref{at:relative-degree} から $\deg g_{-}=(-1)^{k-1}$。\ref{at:two-hemispheres} から
$$
|\deg f|=|1-(-1)^{k-1}|=1+(-1)^{k}.
$$
この計算は $\mathbb{R}P^{n}$ の胞体ホモロジーで使う。
:::

## 問題 {#at:sec-deg-problems}

::: problem {#at:prob-odd-map-even}
$n$ が偶数のとき、連続写像 $f\colon\mathbb{R}P^{n}\to\mathbb{R}P^{n}$ の持ち上げ $\tilde f\colon S^{n}\to S^{n}$（$q\tilde f=fq$）が存在するなら、$\tilde f$ は不動点をもつか、ある $x$ を $-x$ に送ることを示せ。これから、$n$ が偶数なら $\mathbb{R}P^{n}$ の自己写像で持ち上げをもつものは不動点をもつことを導け。
:::

::: solution
前半は \ref{at:degree-fixed-points} の最後の主張。$\tilde f(x)=x$ でも $\tilde f(x)=-x$ でも $f(q(x))=q(\tilde f(x))=q(x)$ なので $q(x)$ は $f$ の不動点。
:::

::: problem {#at:prob-degree-reflection-composition}
直交行列 $Q\in O(n+1)$ による写像 $x\mapsto Qx$ の写像度は $\det Q$ であることを示せ（内積は \ref{lin:page-inner-product}）。
:::

::: solution
超平面に関する鏡映 $R_{v}(x)=x-2\langle x,v\rangle v$（$|v|=1$）は、$v$ を $e_{1}$ に移す直交行列 $P$ について $R_{v}=P^{-1}r_{1}P$ で、$\deg R_{v}=\deg r_{1}=-1$（\ref{at:degree-properties.4}、\ref{at:degree-reflection}）。$Q$ は鏡映の積である：$Qe_{1}\ne e_{1}$ なら $v\defeq(Qe_{1}-e_{1})/|Qe_{1}-e_{1}|$ とすると、$\langle Qe_{1},Qe_{1}-e_{1}\rangle=1-\langle Qe_{1},e_{1}\rangle=\frac12|Qe_{1}-e_{1}|^{2}$ から $R_{v}Qe_{1}=e_{1}$。$R_{v}Q$（または $Qe_{1}=e_{1}$ なら $Q$）は $e_{1}$ を固定し $e_{1}^{\perp}$ を保つ直交変換なので、次元についての帰納法で鏡映の積（高々 $n+1$ 個）。$Q$ を $k$ 個の鏡映の積に書くと $\deg Q=(-1)^{k}=\det Q$（鏡映の行列式は $-1$、写像度と行列式はともに乗法的）。
:::

::: problem {#at:prob-degree-not-surjective-circle}
写像度 $0$ の写像 $S^{1}\to S^{1}$ は定値写像とホモトープであることを示せ。
:::

::: solution
回転を合成して $f(1)=1$ としてよい（回転は恒等写像とホモトープ）。\ref{at:circle-h1-generator.2} から $f\circ\omega_{1}$ の回転数は $0$ で、その持ち上げ $\tilde\gamma$ は $\mathbb{R}$ の閉道。$f(e^{2\pi is})=p(\tilde\gamma(s))$ で、$\tilde\gamma(0)=\tilde\gamma(1)$ なので $\tilde\gamma$ は連続写像 $\tilde f\colon S^{1}\to\mathbb{R}$ を与え（\ref{at:prob-nullhomotopic-extends} の解答と同じく商写像 $I\to S^{1}$ を通す）、$f=p\circ\tilde f$。$H(z,t)\defeq p((1-t)\tilde f(z))$ が定値写像 $1$ へのホモトピー。
:::
