# 無限 CW 複体と一意性定理 {#at:page-uniqueness-infinite keywords="Mayer-Vietoris sequence for a general homology theory on CW complexes, mapping telescope, Milnor's additivity lemma, h_k(X^m) -> h_k(X) iso for k < m, cellular chain complex for infinite CW complexes, Eilenberg-Steenrod uniqueness for all CW pairs, Milnor uniqueness theorem"}

\ref{at:eilenberg-steenrod-uniqueness} では、係数群 $G$ の通常のホモロジー理論 $h$ が、**有限** CW 対の上で特異ホモロジー $H_{*}(-;G)$ と（連結射まで込めて）自然に同型であることを示した。このページでは同じ結論を**任意の** CW 対に広げる。有限の場合との違いは一点に集約される：無限次元の CW 複体 $X$ について $h_{k}(X^{m})\to h_{k}(X)$（$k<m$）が同型であること。特異ホモロジーでは「特異鎖の台はコンパクト」から従った（\ref{at:cellular-singular-general}）が、一般の $h$ にはそのような性質はない。代わりに**加法性公理**（任意個の非交和）を使い、$X$ を骨格の**写像望遠鏡**に取り替えて、偶数番目と奇数番目の非交和に分けたマイヤー–ヴィートリス完全列で計算する。これはミルナーによる議論である。

> 資料：望遠鏡の議論は Milnor の論文 "On axiomatic homology theory"（1962）に由来する標準的なもの（論文そのものは参照していない）。証明は、このサイトの CW 複体の位相の結果（\ref{at:page-cw-topology}）に合わせて自分で書き下ろした。

## 一般のホモロジー理論のマイヤー–ヴィートリス完全列 {#at:sec-ui-mv}

特異ホモロジーのマイヤー–ヴィートリス完全列（\ref{at:mayer-vietoris}）は鎖のレベルの議論で示した。一般のホモロジー理論では鎖がないので、公理（長完全列と切除）から代数的に導く。CW 複体の部分複体の対については、切除は商空間の同相から直接得られる。

::: lemma 部分複体の切除 {#at:theory-cw-excision keywords="for subcomplexes A, B of a CW complex K with K = A cup B, the inclusion (B, A cap B) -> (K, A) induces isomorphisms in any homology theory" index="部分複体の切除|ぶぶんふくたいのせつじょ"}
$h$ をホモロジー理論、$K$ を CW 複体、$A,B$ を $K=A\cup B$ となる部分複体とし、$C\defeq A\cap B$ とおく。包含 $(B,C)\to(K,A)$ はすべての $n$ で同型 $h_{n}(B,C)\cong h_{n}(K,A)$ を誘導する。
:::

::: proof
**Step 1（$C=\varnothing$ の場合）.** $A$ と $B$ は閉で交わらず $K=A\sqcup B$ なので、$K$ は位相的に非交和で、加法性公理から $h_{n}(A)\oplus h_{n}(B)\cong h_{n}(K)$。対 $(B,\varnothing)\to(K,A)$ の長完全列の間の写像で、$h_{n}(K,A)\cong\operatorname{coker}(h_{n}(A)\to h_{n}(K))\cong h_{n}(B)$（長完全列の $h_{n}(A)\to h_{n}(K)$ は直和因子の包含で単射なので、連結射は $0$）。

**Step 2（商空間の同相）.** $C\neq\varnothing$ とする。$p_{B}\colon B\to B/C$, $p_{K}\colon K\to K/A$ を商写像とし、包含が誘導する $\bar\iota\colon B/C\to K/A$ を考える。$K\setminus A=B\setminus C$（$x\notin A$ なら $x\in B$ で $x\notin C$、逆も同じ）なので $\bar\iota$ は全単射。逆写像：$r\colon K\to B/C$ を、$B$ の上で $p_{B}$、$A$ の上で定値 $\ast$ と定めると、$A\cap B=C$ の上では両者とも $\ast$ で、$A,B$ は閉なので貼り合わせ補題から連続。$r$ は $A$ を 1 点に写すので $K/A\to B/C$ を誘導し（商写像の普遍性）、これは $\bar\iota$ の逆写像。よって $\bar\iota$ は同相。

**Step 3.** $(B,C)$, $(K,A)$ は CW 対なので良い対（\ref{at:cw-pair-good.1}）で、\ref{at:theory-basic-lemmas.1} から $p_{B*}\colon h_{n}(B,C)\cong h_{n}(B/C,\ast)$, $p_{K*}\colon h_{n}(K,A)\cong h_{n}(K/A,\ast)$。$p_{K}\circ\iota=\bar\iota\circ p_{B}$ なので、包含の誘導写像は $p_{K*}^{-1}\bar\iota_{*}p_{B*}$ で、同型の合成。
:::

::: theorem 一般のホモロジー理論のマイヤー–ヴィートリス完全列 {#at:theory-mayer-vietoris keywords="Mayer-Vietoris exact sequence for any homology theory and subcomplexes A, B of a CW complex with K = A cup B" index="マイヤー–ヴィートリス完全列（一般のホモロジー理論）|まいやーびーとりすかんぜんれついっぱんのほもろじーりろん"}
$h$, $K=A\cup B$, $C=A\cap B$ を \ref{at:theory-cw-excision} のとおりとし、包含を $\alpha\colon C\to A$, $\gamma\colon C\to B$, $i\colon A\to K$, $\beta\colon B\to K$、対の包含を $j_{B}\colon B\to(B,C)$, $j_{K}\colon K\to(K,A)$、\ref{at:theory-cw-excision} の同型を $e\colon h_{n}(B,C)\to h_{n}(K,A)$ とする。
$$
\Delta\defeq\partial_{(B,C)}\circ e^{-1}\circ j_{K*}\colon h_{n}(K)\to h_{n-1}(C)
$$
とおくと、次の列は完全で、部分複体の組を保つ胞体写像について自然である。
$$
\cdots\to h_{n}(C)\xrightarrow{(\alpha_{*},-\gamma_{*})}h_{n}(A)\oplus h_{n}(B)\xrightarrow{i_{*}+\beta_{*}}h_{n}(K)\xrightarrow{\Delta}h_{n-1}(C)\to\cdots
$$
:::

::: proof
対 $(B,C)$ と $(K,A)$ の長完全列と、包含が誘導するその間の写像（各四角形は関手性と連結射の自然性から可換）を使う。とくに $j_{K*}\beta_{*}=e\,j_{B*}$、$\partial_{(K,A)}e=\alpha_{*}\partial_{(B,C)}$、$i_{*}\alpha_{*}=\beta_{*}\gamma_{*}$（どれも $C\to K$ などの同じ写像の誘導写像）。記号を簡単にするため $\partial_{B}\defeq\partial_{(B,C)}$, $\partial_{K}\defeq\partial_{(K,A)}$ と書き、以下 6 つの包含関係を示す。

**Step 1（$h_{n}(A)\oplus h_{n}(B)$ での完全性）.** 合成は $i_{*}\alpha_{*}-\beta_{*}\gamma_{*}=0$。逆に $i_{*}a+\beta_{*}b=0$ とする。$j_{K*}$ を施すと $j_{K*}i_{*}=0$（長完全列）から $0=j_{K*}\beta_{*}b=e\,j_{B*}b$、$e$ は同型なので $j_{B*}b=0$、よって $b=\gamma_{*}c$（$c\in h_{n}(C)$）。すると $0=i_{*}a+\beta_{*}\gamma_{*}c=i_{*}(a+\alpha_{*}c)$ なので $a+\alpha_{*}c=\partial_{K}w$（$w\in h_{n+1}(K,A)$）。$w=e\,w'$ とすると $\partial_{K}e\,w'=\alpha_{*}\partial_{B}w'$。$c'\defeq\partial_{B}w'-c$ とおくと、$\alpha_{*}c'=a$、$-\gamma_{*}c'=-\gamma_{*}\partial_{B}w'+\gamma_{*}c=0+b$（$\gamma_{*}\partial_{B}=0$）。よって $(a,b)=(\alpha_{*}c',-\gamma_{*}c')$。

**Step 2（$h_{n}(K)$ での完全性）.** $\Delta i_{*}a=\partial_{B}e^{-1}j_{K*}i_{*}a=0$、$\Delta\beta_{*}b=\partial_{B}e^{-1}e\,j_{B*}b=\partial_{B}j_{B*}b=0$。逆に $\Delta k=0$ なら、$\partial_{B}(e^{-1}j_{K*}k)=0$ から $e^{-1}j_{K*}k=j_{B*}b$、すなわち $j_{K*}k=e\,j_{B*}b=j_{K*}\beta_{*}b$。$j_{K*}(k-\beta_{*}b)=0$ から $k-\beta_{*}b=i_{*}a$。

**Step 3（$h_{n-1}(C)$ での完全性）.** $\alpha_{*}\Delta k=\alpha_{*}\partial_{B}e^{-1}j_{K*}k=\partial_{K}j_{K*}k=0$、$\gamma_{*}\Delta k=\gamma_{*}\partial_{B}(\cdots)=0$。逆に $\alpha_{*}c=0$, $\gamma_{*}c=0$ なら、後者から $c=\partial_{B}w'$（$w'\in h_{n}(B,C)$）、前者から $0=\alpha_{*}\partial_{B}w'=\partial_{K}e\,w'$ なので $e\,w'=j_{K*}k$（$k\in h_{n}(K)$）。$\Delta k=\partial_{B}e^{-1}j_{K*}k=\partial_{B}w'=c$。

**Step 4（自然性）.** 現れる写像はすべて包含の誘導写像、連結射、$e^{-1}$ の合成で、部分複体の組を保つ写像（$f(A)\subset A'$, $f(B)\subset B'$）はこれらすべてと可換（$e^{-1}$ については $e$ と可換なことから）。

::: hypcheck
- **完全性・連結射の自然性**（公理）：Step 1〜3 のすべてで使った。次元公理と加法性は使わない（$C=\varnothing$ の場合の \ref{at:theory-cw-excision} の Step 1 を除く）。
- **部分複体であること**：\ref{at:theory-cw-excision} で、良い対であることと、商空間の同相に使った。一般の空間では、特異ホモロジーのように「内部が覆う」（\ref{at:mayer-vietoris}）といった条件が要る。
:::
:::

## 写像望遠鏡 {#at:sec-ui-telescope}

::: definition 写像望遠鏡 {#at:mapping-telescope keywords="mapping telescope of the skeleta of a CW complex: T = union of X^i x [i, i+1] in X x [0, infinity)" index="写像望遠鏡|しゃぞうぼうえんきょう, 写像テレスコープ|しゃぞうてれすこーぷ"}
CW 複体 $X$ について、$X\times[0,\infty)$（\ref{at:cw-product-interval} の CW 複体）の部分集合
$$
T(X)\defeq\bigcup_{i\ge0}X^{i}\times[i,i+1]
$$
を $X$ の骨格の**写像望遠鏡**という。$T_{i}\defeq X^{i}\times[i,i+1]$ とおく。
:::

::: intuition
骨格の列 $X^{0}\subset X^{1}\subset\cdots$ を、包含の「写像柱」を順につないで 1 本の筒にしたものである。$X$ そのものでは、すべての骨格が同じ場所に重なっていて「どの骨格から来た点か」が分からないが、望遠鏡では骨格 $X^{i}$ が時刻 $[i,i+1]$ に分けて置かれる。その結果、$T(X)$ は「偶数番目の筒の非交和」と「奇数番目の筒の非交和」の和になり、加法性公理（非交和についての主張）が使える形になる。
:::

::: lemma 望遠鏡の基本性質 {#at:telescope-properties keywords="the mapping telescope is a subcomplex of X x [0, infinity), a strong deformation retract of it, and the projection T(X) -> X is a homotopy equivalence" index="写像望遠鏡の基本性質|しゃぞうぼうえんきょうのきほんせいしつ"}
$X$ を CW 複体、$P\defeq X\times[0,\infty)$、$T\defeq T(X)$ とする。
1. $T$ は $P$ の部分複体で、$T_{i}$ も部分複体。$T_{i}\cap T_{i+1}=X^{i}\times\{i+1\}$、$|i-i'|\ge2$ なら $T_{i}\cap T_{i'}=\varnothing$。
2. 連続写像 $H\colon P\times I\to P$ で、$H_{0}=1_{P}$、$H_{1}(P)\subset T$、すべての $t$ で $H_{t}\restriction T=1_{T}$ となるものがある。
3. 射影 $\pi\colon T\to X$, $(x,s)\mapsto x$ はホモトピー同値である。
:::

::: proof
**Step 1（1）.** \ref{at:cw-product-interval} の胞体で書くと、$T$ は $\dim e_{\alpha}\le j$ となる胞体 $e_{\alpha}\times\{j\}$ と $e_{\alpha}\times(j,j+1)$ の和集合（$X^{j-1}\times\{j\}\subset X^{j}\times\{j\}$ に注意）。$P$ の胞体 $e_{\alpha}\times\{j\}$ などの特性写像は $\Phi_{\alpha}\times1$ を通るので、閉性は $(\Phi_{\alpha}\times1)^{-1}(T)=D_{\alpha}\times[\dim e_{\alpha},\infty)$ が閉であることから（\ref{at:cw-coherent-product.1}）。よって $T$ は閉な開胞体の和で部分複体。$T_{i}$ も同様（$(\Phi_{\alpha}\times1)^{-1}(T_{i})$ は $\dim e_{\alpha}\le i$ なら $D_{\alpha}\times[i,i+1]$、そうでなければ空）。交わりの式は第 2 座標から。

**Step 2（1 段の押し込み）.** $W_{n}\defeq(X^{n}\times[0,\infty))\cup T$ とおく（部分複体）。$X^{0}\times[0,\infty)\subset T$ なので $W_{0}=T$、また $P=\bigcup_{n}W_{n}$。$n\ge1$ とし、\ref{at:cw-hep} の Step 1 のレトラクション $\rho\colon D^{n}\times I\to D^{n}\times\{0\}\cup\partial D^{n}\times I$ の第 2 座標を $s=n(1-t)$ で取り替えたものを $\rho_{n}\colon D^{n}\times[0,n]\to D^{n}\times\{n\}\cup\partial D^{n}\times[0,n]$（$D^{n}\times\{n\}\cup\partial D^{n}\times[0,n]$ の上で恒等）とし、$L_{n}(z,s,u)\defeq(1-u)(z,s)+u\,\rho_{n}(z,s)$（$D^{n}\times[0,n]$ は凸なので値はその中）とする。$R_{n}\colon W_{n}\times I\to W_{n}$ を、$n$ 胞体 $e_{\alpha}$ と $z\in D^{n}$, $s\in[0,n]$ について $R_{n}((\Phi_{\alpha}(z),s),u)\defeq(\Phi_{\alpha}\times1)(L_{n}(z,s,u))$、それ以外（$W_{n-1}$ の点）では $R_{n}(w,u)\defeq w$ と定める。$W_{n}\setminus W_{n-1}=\bigsqcup_{\alpha}e_{\alpha}\times[0,n)$（$e_{\alpha}\times[n,\infty)\subset T$）で、$z\in\partial D^{n}$ または $s=n$ の点は $W_{n-1}$ に属し $L_{n}$ も恒等なので、well-defined。連続性は CW 複体 $W_{n}$ に \ref{at:cw-coherent-product.1}（$K=I$）を使う：$W_{n-1}$ の胞体の上では射影、新しい胞体 $e_{\alpha}\times\{j\}$, $e_{\alpha}\times(j,j+1)$（$j<n$）の特性写像は $\Phi_{\alpha}\times1$ を通り、その上で $R_{n}$ は $(\Phi_{\alpha}\times1)\circ L_{n}$ で連続。$R_{n}(\cdot,0)=1$、$R_{n}$ は $W_{n-1}$ の上で動かず、$R_{n}(\cdot,1)$ の値は $\rho_{n}$ の値の像 $X^{n-1}\times[0,\infty)\cup X^{n}\times\{n\}\subset W_{n-1}$ に入る。

**Step 3（2）.** $w\in W_{m}$ について $r_{k,m}\defeq R_{k+1}(\cdot,1)\circ\cdots\circ R_{m}(\cdot,1)$（$k\ge m$ なら恒等）とおき、$t\in[2^{-k},2^{-k+1}]$（$k\ge1$）で
$$
H(w,t)\defeq R_{k}\bigl(r_{k,m}(w),\,2^{k}t-1\bigr),\qquad H(w,0)\defeq w
$$
と定める（$k>m$ なら $R_{k}$ は $W_{m}\subset W_{k-1}$ の上で恒等なので $H(w,t)=w$）。$w\in W_{m}\subset W_{m'}$ のとき $m$ を $m'$ に取り替えても、$k>m$ の $R_{k}$ は恒等に作用するので値は変わらない。$t=2^{-k}$ では、区間 $k$ の側で $R_{k}(v,0)=v=r_{k,m}(w)$、区間 $k+1$ の側で $R_{k+1}(r_{k+1,m}(w),1)=r_{k,m}(w)$ と一致。連続性を \ref{at:cw-coherent-product.1}（$K=I$、CW 複体 $P$）で確かめる：$P$ の胞体は $e_{\alpha}\times\{j\}$ または $e_{\alpha}\times(j,j+1)$ で、$m=\dim e_{\alpha}$ とするとその閉包は $W_{m}$ に含まれ、$t\le2^{-m}$ では $H$ は恒等、$[2^{-k},2^{-k+1}]$（$k\le m$）では連続写像の合成なので、有限個の閉集合への貼り合わせで連続。$H(w,1)=R_{1}(r_{1,m}(w),1)\in W_{0}=T$、$T=W_{0}\subset W_{k-1}$ はどの $R_{k}$ でも動かない。

**Step 4（3）.** 包含 $\iota\colon T\to P$ について、2 の $H_{1}$ を $T$ への写像 $\rho$ とみると $\rho\iota=1_{T}$、$\iota\rho=H_{1}\simeq1_{P}$ なので $\iota$ はホモトピー同値。射影 $\mathrm{pr}\colon P\to X$ は、$x\mapsto(x,0)$ を逆とするホモトピー同値（$((x,s),u)\mapsto(x,(1-u)s)$ がホモトピー。連続性は積位相から明らか）。$\pi=\mathrm{pr}\circ\iota$ はホモトピー同値の合成。

::: hypcheck
- **CW 複体の位相**：Step 2・3 の連続性はすべて \ref{at:cw-coherent-product}（胞体ごとの判定）による。無限個の段を時間 $[2^{-k},2^{-k+1}]$ に詰めても連続なのは、各胞体の上では有限個の段しか効かないからである。
- 選択公理は使わない。
:::
:::

## ミルナーの補題 {#at:sec-ui-milnor}

::: theorem ミルナーの補題 {#at:milnor-additivity keywords="Milnor: for an ordinary homology theory satisfying the additivity axiom and any CW complex X, h_k(X^m) -> h_k(X) is an isomorphism for k < m" index="ミルナーの補題|みるなーのほだい" refname="ミルナーの補題"}
$h$ を通常のホモロジー理論（加法性公理を含む）、$X$ を CW 複体とする。$k<m$ なら包含の誘導写像 $h_{k}(X^{m})\to h_{k}(X)$ は同型である。
:::

::: intuition
有限次元なら骨格を有限回登れば $X$ に着くので、長完全列だけで済む（\ref{at:theory-cellular}）。無限次元では「極限をとる」操作が要るが、ホモロジー理論の公理には極限についての主張はない。望遠鏡は、極限 $\varinjlim h_{k}(X^{i})$ を「$1-$シフト」写像の余核として表し、その余核を非交和（加法性）とマイヤー–ヴィートリス（完全性・切除）だけで $h_{k}(X)$ に結びつける装置である。
:::

::: proof
$X=\varnothing$ なら自明なので $X\neq\varnothing$ とする。$M_{i}\defeq h_{k}(X^{i})$、包含の誘導写像を $a_{i}\colon M_{i}\to M_{i+1}$ とおく。

**Step 1（有限次元の骨格での事実）.** 任意の CW 複体 $Y$（胞体は無限個でよい）について、$h_{k}(Y^{j},Y^{j-1})=0$（$k\neq j$）。実際、\ref{at:theory-basic-lemmas.2}・\ref[3]{at:theory-basic-lemmas.3} の証明は、有限和の加法性を加法性公理（任意個）に置き換えて、骨格の対 $(Y^{j},Y^{j-1})$ と $(\bigsqcup D_{\alpha},\bigsqcup\partial D_{\alpha})$ がともに良い対で商が同相であること（\ref{at:skeleton-pairs.1}・\ref[2]{at:skeleton-pairs.2}、\ref{at:cw-pair-good.1}）からそのまま通り、$h_{k}(Y^{j},Y^{j-1})\cong\bigoplus_{\alpha}h_{k}(D^{j},\partial D^{j})$。これは \ref{at:theory-cellular} の Step 1 から $k\neq j$ で $0$（$j=0$ では加法性と次元公理から $h_{k}(Y^{0})=0$, $k\neq0$）。対 $(Y^{j+1},Y^{j})$ の長完全列から、$k<j$ なら $h_{k}(Y^{j})\to h_{k}(Y^{j+1})$ は同型、$k=j$ なら全射。とくに $i>k$ なら $a_{i}$ は同型。

**Step 2（望遠鏡の分割）.** $T\defeq T(X)$ とし、$A\defeq\bigcup_{i\text{ 偶数}}T_{i}$, $B\defeq\bigcup_{i\text{ 奇数}}T_{i}$ とおく。\ref{at:telescope-properties.1} から、$A,B$ は部分複体で $T=A\cup B$、$C\defeq A\cap B=\bigcup_{i\ge0}X^{i}\times\{i+1\}$。さらに $A$ は $T_{i}$（$i$ 偶数）たちの位相的な非交和である（各 $T_{i}$ は閉で、補集合 $\bigcup_{i'\neq i}T_{i'}$ も部分複体なので閉）。$B$, $C$ も同様。加法性公理から
$$
h_{k}(A)\oplus h_{k}(B)\cong\bigoplus_{i\ge0}h_{k}(T_{i}),\qquad h_{k}(C)\cong\bigoplus_{i\ge0}h_{k}(X^{i}\times\{i+1\}).
$$

**Step 3（各項の同一視）.** $\iota_{i}\colon X^{i}\to T_{i}$, $x\mapsto(x,i+1)$ はホモトピー同値（逆は射影、$T_{i}=X^{i}\times[i,i+1]$）で、$\iota'_{i}\colon x\mapsto(x,i)$ とホモトープ。これで $h_{k}(T_{i})\cong M_{i}$、$h_{k}(X^{i}\times\{i+1\})\cong M_{i}$ と同一視する。$X^{i}\times\{i+1\}$ から $T_{i}$ への包含は $M_{i}$ の恒等写像に、$T_{i+1}$ への包含は $x\mapsto\iota'_{i+1}(x)$ を通るので $a_{i}$ に対応する。

**Step 4（マイヤー–ヴィートリス）.** \ref{at:theory-mayer-vietoris}（$K=T$）の写像 $\Phi\defeq(\alpha_{*},-\gamma_{*})\colon\bigoplus_{i}M_{i}\to\bigoplus_{i}M_{i}$ は、Step 3 から $x\in M_{i}$ を
$$
\Phi(x)=\pm\bigl(x\,\mathbf{e}_{i}-a_{i}(x)\,\mathbf{e}_{i+1}\bigr)
$$
（符号は $i$ が偶数なら $+$、奇数なら $-$。$\mathbf{e}_{i}$ は第 $i$ 成分）に写す。$\sigma(x)\defeq(-1)^{i}x$（$x\in M_{i}$）は自己同型なので、$\Phi'\defeq\Phi\circ\sigma$、すなわち $\Phi'(x)=x\,\mathbf{e}_{i}-a_{i}(x)\,\mathbf{e}_{i+1}$ は $\Phi$ と同じ像をもち、$\Phi$ が単射 $\iff$ $\Phi'$ が単射。

**Step 5（$\Phi'$ は単射）.** $y=\sum_{i}x_{i}\mathbf{e}_{i}\neq0$（有限和）とし、$x_{i}\neq0$ となる最小の $i=i_{0}$ をとる。$\Phi'(y)$ の第 $i_{0}$ 成分は $x_{i_{0}}-a_{i_{0}-1}(x_{i_{0}-1})=x_{i_{0}}\neq0$（$x_{i_{0}-1}=0$、$i_{0}=0$ なら第 2 項はない）。

**Step 6（余核の計算）.** $m>k$ を固定し、$q\colon\bigoplus_{i}M_{i}\to M_{m}$ を、$i\le m$ の成分では $a_{m-1}\cdots a_{i}$、$i>m$ の成分では $(a_{i-1}\cdots a_{m})^{-1}$（Step 1 から同型）として定める。$q\Phi'(x\mathbf{e}_{i})=q(x\mathbf{e}_{i})-q(a_{i}x\,\mathbf{e}_{i+1})=0$（両方とも同じ元）。$q$ は第 $m$ 成分の上で恒等なので全射。$\ker q\subset\operatorname{im}\Phi'$：$x\mathbf{e}_{i}\equiv a_{i}(x)\mathbf{e}_{i+1}\pmod{\operatorname{im}\Phi'}$ を繰り返すと、任意の $y$ はある $N\ge m$ について $z\,\mathbf{e}_{N}$ と合同。$q(y)=0$ なら $q(z\mathbf{e}_{N})=(a_{N-1}\cdots a_{m})^{-1}z=0$ なので $z=0$、$y\in\operatorname{im}\Phi'$。よって $q$ は同型 $\operatorname{coker}\Phi'\cong M_{m}$ を誘導し、その逆は $x\mapsto[x\mathbf{e}_{m}]$。

**Step 7（$h_{k}(T)$ の計算）.** マイヤー–ヴィートリス完全列 $h_{k}(C)\xrightarrow{\Phi}\bigoplus M_{i}\xrightarrow{\Psi}h_{k}(T)\xrightarrow{\Delta}h_{k-1}(C)\xrightarrow{\Phi}\cdots$ で、次数 $k-1$ の $\Phi$ も Step 5 と同じく単射なので $\Delta=0$。よって $\Psi$ は全射で $\ker\Psi=\operatorname{im}\Phi=\operatorname{im}\Phi'$、$\Psi$ は同型 $\operatorname{coker}\Phi'\cong h_{k}(T)$ を誘導する。Step 6 と合わせて、$x\mapsto\Psi(x\mathbf{e}_{m})=(\jmath_{m})_{*}x$ は同型 $M_{m}\cong h_{k}(T)$。ここで $\jmath_{m}\colon X^{m}\to T$, $x\mapsto(x,m+1)$（$T_{m}$ への $\iota_{m}$ と包含の合成）。

**Step 8（結論）.** 射影 $\pi\colon T\to X$ はホモトピー同値（\ref{at:telescope-properties.3}）で、$\pi\circ\jmath_{m}$ は包含 $X^{m}\to X$。ホモトピー公理から $\pi_{*}$ は同型なので、包含の誘導写像 $=\pi_{*}(\jmath_{m})_{*}$ は同型。

::: hypcheck
- **加法性公理（任意個）**：Step 1（無限個の胞体）と Step 2（無限個の $T_{i}$ の非交和）で使った。有限個の非交和についての加法性だけでは、この議論は通らない。
- **次元公理**：Step 1 で、骨格の対のホモロジーが 1 つの次数に集中することに使い、$a_{i}$（$i>k$）が同型であることを得た。一般ホモロジー理論では Step 1〜5・7・8 は通り、$h_{k}(X)\cong\varinjlim_{i}h_{k}(X^{i})$ が得られる（Step 6 を「余核は帰納極限」に置き換える）。
- **CW 複体であること**：望遠鏡の性質（\ref{at:telescope-properties}）と、マイヤー–ヴィートリス（\ref{at:theory-mayer-vietoris}）の切除に使った。
:::
:::

## 任意の CW 対での一意性 {#at:sec-ui-uniqueness}

::: theorem 胞体鎖複体による計算（無限 CW 複体） {#at:theory-cellular-infinite keywords="the cellular computation of an ordinary homology theory holds for arbitrary CW complexes" index="一般のホモロジー理論の胞体鎖複体（無限 CW 複体）|いっぱんのほもろじーりろんのほうたいさふくたいむげん"}
\ref{at:theory-cellular.1}・\ref[2]{at:theory-cellular.2} は、$X$ を任意の CW 複体（胞体が無限個、無限次元でもよい）としても成り立つ。このとき $D(X)$ は $n$ 胞体を基底とする自由アーベル群（直和）で、境界の行列 $(d_{\alpha\beta})$ と胞体写像の行列 $D(f)$ は各列（各 $\alpha$）に有限個の 0 でない成分しかもたない。
:::

::: proof
**Step 1（集中）.** \ref{at:milnor-additivity} の証明の Step 1 により、$h_{k}(X^{n},X^{n-1})\cong\bigoplus_{\alpha}h_{k}(D^{n},\partial D^{n})$ は $k\neq n$ で $0$、また $h_{k}(X^{0})=0$（$k\neq0$）。

**Step 2（1）.** \ref{at:theory-cellular} の Step 2 の議論は、骨格の長完全列と Step 1 の事実から $H_{n}(C^{h}(X))\cong h_{n}(X^{n+1})$ を与え（有限次元性は使わない）、\ref{at:milnor-additivity}（$k=n<n+1$）から $h_{n}(X^{n+1})\cong h_{n}(X)$。自然性は同じ。

**Step 3（2）.** \ref{at:theory-cellular} の Step 3〜6 は胞体ごとの議論で、有限性を使わない（$\kappa_{\beta}$ の連続性は \ref{at:cw-closed-criterion.2}）。ただし、$d(\Phi_{\alpha*}u_{n}g)\in\bigoplus_{\beta}h_{n-1}(D^{n-1},\partial D^{n-1})$ は直和の元なので、$\beta$ 成分 $d_{\alpha\beta}g$ は有限個の $\beta$ を除いて $0$。$G=\mathbb{Z}$ の理論（特異ホモロジー）で $g=1$ とすれば、$d_{\alpha\beta}$ 自身が有限個の $\beta$ を除いて $0$ であることが分かり、$D(X)$ の境界写像 $e_{\alpha}\mapsto\sum_{\beta}d_{\alpha\beta}e_{\beta}$ は有限和として定まる。$D(f)$ も同様。
:::

::: theorem 一意性定理（任意の CW 対） {#at:eilenberg-steenrod-uniqueness-infinite keywords="Eilenberg-Steenrod-Milnor uniqueness: an ordinary homology theory with coefficients G is isomorphic to singular homology with coefficients G on all CW pairs, compatibly with boundaries" index="一意性定理（無限 CW 複体）|いちいせいていりむげんしーだぶりゅーふくたい"}
$h$ を係数群 $G$ の通常のホモロジー理論（加法性公理を含む）とする。
1. CW 複体 $X$ について同型 $\theta_{X}\colon H_{n}(X;G)\cong h_{n}(X)$ があり、CW 複体の間のすべての連続写像について自然。
2. CW 対 $(X,A)$ について同型 $\theta_{(X,A)}\colon H_{n}(X,A;G)\cong h_{n}(X,A)$ があり、CW 対の間の対の写像について自然。
3. $\partial^{h}\circ\theta_{(X,A)}=\theta_{A}\circ\partial^{H}$。

有限 CW 対の上では、これは \ref{at:eilenberg-steenrod-uniqueness} の同型と一致する。
:::

::: proof
**Step 1（1）.** $H_{*}(-;G)$ も加法性を満たす通常のホモロジー理論（\ref{at:homology-coefficients}）。\ref{at:theory-cellular-infinite} を両理論に使い、\ref{at:eilenberg-steenrod-uniqueness} の証明の Step 1 と同じ式で $\theta_{X}$ を定める。胞体写像について自然。任意の連続写像は胞体写像とホモトープ（\ref{at:cellular-approximation}、無限 CW 複体でよい）なので、同じ Step 2 の議論ですべての連続写像について自然。

**Step 2（2）.** $A\neq\varnothing$ なら $(X,A)$ は良い対（\ref{at:cw-pair-good.1}）で、$X/A$ は CW 複体（\ref{at:cw-pair-good.2}、有限性を仮定しない形）。\ref{at:eilenberg-steenrod-uniqueness} の証明の Step 3 がそのまま通る。

**Step 3（3）.** \ref{at:eilenberg-steenrod-uniqueness.3} の証明の Step 4〜7 を、次の 2 点を取り替えて繰り返す。
- Step 6 の同相 $\bigsqcup D_{\alpha}/\bigsqcup\partial D_{\alpha}\to X_{n}/X_{n-1}$：コンパクト性の代わりに、$X_{n}/X_{n-1}$ が CW 複体（\ref{at:cw-pair-good.2}）で、その閉集合が特性写像 $p\Phi_{\alpha}$ による逆像で判定できること（\ref{at:cw-closed-criterion.2}）を使う。逆写像 $X_{n}/X_{n-1}\to\bigsqcup D_{\alpha}/\bigsqcup\partial D_{\alpha}$ は、各特性写像との合成が商写像 $D_{\alpha}\to\bigsqcup D_{\alpha}/\bigsqcup\partial D_{\alpha}$（と基点の定値写像）なので連続。有限和は \ref{at:milnor-additivity} の証明の Step 1 の形の加法性で置き換える。
- Step 7 の (a) $\tilde H_{n}(Y^{n};G)\to\tilde H_{n}(Y;G)$ の全射性：$h_{n}(Y^{n})\to h_{n}(Y^{n+1})$ の全射性（\ref{at:milnor-additivity} の証明の Step 1）と $h_{n}(Y^{n+1})\cong h_{n}(Y)$（\ref{at:milnor-additivity}）から。(b) の $h_{n}(Y^{n-1})=0$ は同じ Step 1 から。

**Step 4（有限の場合との一致）.** 有限 CW 複体では両者は同じ式で定義されている。

::: hypcheck
- **加法性公理**：\ref{at:milnor-additivity} を通じて、無限次元の CW 複体で骨格から全体へ移るところでだけ本質的に使った。有限次元の CW 複体なら、無限個の胞体があっても、加法性を胞体の数だけの非交和に使えば望遠鏡は要らない。
- **次元公理**：胞体鎖複体への集中に使った（\ref{at:eilenberg-steenrod-uniqueness} と同じ）。
- **選択公理**：胞体近似（\ref{at:cellular-approximation}）の中で使う。
:::
:::

::: supplement
**加法性の役割.** 加法性公理を有限個の非交和に弱めると、有限 CW 対での一意性（\ref{at:eilenberg-steenrod-uniqueness}）はそのまま成り立つが、無限 CW 複体での結論は保証されない。このページの議論で加法性を使ったのは、無限個の胞体と無限個の $T_{i}$ の非交和だけである。

**コホモロジーでは.** 同じ望遠鏡の議論をコホモロジー理論（加法性は直積）に使うと、帰納極限の代わりに射影極限とその導来関手 $\varprojlim{}^{1}$ が現れ、ミルナーの完全列
$$
0\to\varprojlim{}^{1}h^{k-1}(X^{i})\to h^{k}(X)\to\varprojlim h^{k}(X^{i})\to0
$$
が得られることが知られている（本サイト未収録）。通常のコホモロジー理論では $i$ が十分大きいと $h^{k-1}(X^{i})$ が安定するので $\varprojlim{}^{1}$ は消え、一意性が同じように成り立つ。

**高い視点.** 加法性公理は「ホモロジーは（ある種の）余極限と可換」という主張の最も弱い形で、望遠鏡は「列の余極限」を「非交和とマイヤー–ヴィートリス（押し出し）」に分解する装置である。ホモトピー論の言葉では、望遠鏡は骨格の列の**ホモトピー余極限**であり、CW 複体 $X$ は自分の骨格のホモトピー余極限に弱同値になる、ということを言っている。比喩で言えば、無限に続く建物を、1 階ずつ別々の小屋（偶数番目と奇数番目）に分けて建て、その小屋どうしを廊下（マイヤー–ヴィートリス）でつないで同じ建物を再現するのが望遠鏡である。小屋の数え方（加法性）と廊下の通り方（完全性）しか使わないので、どのホモロジー理論にも適用できる。
:::

## 問題 {#at:sec-ui-problems}

::: problem {#at:prob-infinite-rp}
$\mathbb{R}P^{\infty}=\bigcup_{n}\mathbb{R}P^{n}$（各次元に 1 個ずつの胞体）について、係数群 $G$ の任意の通常のホモロジー理論 $h$ で $h_{k}(\mathbb{R}P^{\infty})$ を求めよ（$G=\mathbb{Z}$ と $G=\mathbb{Z}/2$ の場合）。
:::

::: solution
\ref{at:eilenberg-steenrod-uniqueness-infinite} から $h_{k}(\mathbb{R}P^{\infty})\cong H_{k}(\mathbb{R}P^{\infty};G)$。胞体鎖複体は $\cdots\to\mathbb{Z}\xrightarrow{2}\mathbb{Z}\xrightarrow{0}\mathbb{Z}\xrightarrow{2}\mathbb{Z}\xrightarrow{0}\mathbb{Z}$（\ref{at:projective-space-homology} の計算で $n\to\infty$）を $\otimes G$ したもの。$G=\mathbb{Z}$：$H_{0}=\mathbb{Z}$、$k$ 奇数で $\mathbb{Z}/2$、$k\ge2$ 偶数で $0$。$G=\mathbb{Z}/2$：すべての $k\ge0$ で $\mathbb{Z}/2$（微分がすべて $0$ になる）。
:::

::: problem {#at:prob-telescope-colimit}
\ref{at:milnor-additivity} の証明の Step 4〜6 の代数だけを使って、アーベル群の列 $M_{0}\xrightarrow{a_{0}}M_{1}\xrightarrow{a_{1}}\cdots$ について、$\Phi'(x)=x\mathbf{e}_{i}-a_{i}(x)\mathbf{e}_{i+1}$ の余核が帰納極限 $\varinjlim M_{i}$ と同型であることを示せ（$a_{i}$ は同型でなくてよい）。
:::

::: solution
$\varinjlim M_{i}$ は、$\bigsqcup M_{i}$ を「$x\in M_{i}$ と $a_{i}(x)\in M_{i+1}$ を同一視」して得られる群で、標準写像 $\lambda_{i}\colon M_{i}\to\varinjlim M_{i}$ は $\lambda_{i+1}a_{i}=\lambda_{i}$ を満たす。$q\defeq\sum_{i}\lambda_{i}\colon\bigoplus M_{i}\to\varinjlim M_{i}$ は全射で、$q\Phi'=0$。逆に $q(y)=0$ とすると、Step 6 と同様に $y\equiv z\mathbf{e}_{N}$ と書け、$\lambda_{N}(z)=0$ から（帰納極限の構成により）ある $N'\ge N$ で $a_{N'-1}\cdots a_{N}(z)=0$。$z\mathbf{e}_{N}\equiv a_{N'-1}\cdots a_{N}(z)\mathbf{e}_{N'}=0$ なので $y\in\operatorname{im}\Phi'$。
:::
