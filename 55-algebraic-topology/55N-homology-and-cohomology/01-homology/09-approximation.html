# 単体近似と胞体近似 {#at:page-approximation keywords="barycentric subdivision of a simplicial complex, triangulation of the cube, open star, simplicial approximation theorem, piecewise linear approximation, pushing a map off a point of a cell, cellular map, cellular approximation theorem"}

連続写像は一般にはいくらでも複雑になりうるが、ホモトピーで動かしてよいなら、組合せ的に扱いやすい形に直せる。このページでは二つの近似定理を証明する。**単体近似定理**は、単体複体の間の連続写像が、定義域を十分細かく細分すれば単体写像とホモトープであることを主張する。**胞体近似定理**は、CW 複体の間の連続写像が、$n$ 骨格を $n$ 骨格に写す写像（胞体写像）とホモトープであることを主張する。後者の鍵は「次元の低い円板からの写像は、高い次元の胞体の 1 点を避けるように動かせる」という押し出しの補題で、これを区分的線形近似で示す。

> 資料：標準的な内容（単体近似定理は Spanier『Algebraic Topology』、胞体近似定理は Hatcher『Algebraic Topology』§4.1 などにある）。押し出しの補題は、\ref{at:low-homotopy-spheres} と同じ切り替え関数の方法で、単体ごとのアフィン近似を使う形に自分で書き下ろした。

## 記法と定義の確認 {#at:sec-apx-notation}

::: notation
- 単体複体・多面体 $|K|$・単体写像 $|g|$ は \ref{at:simplicial-complex}, \ref{at:simplicial-map}。単体 $\sigma$ の頂点は**アフィン独立**（$\sum_{i}c_{i}v_{i}=0$, $\sum_{i}c_{i}=0$ なら $c_{i}=0$）で、$\sigma$ の点は頂点の凸結合としてただ一通りに書ける（係数を**重心座標**という）。係数がすべて正の点の集合を $\sigma$ の**開単体**という。$x\in|K|$ を開単体に含む単体（ただ一つ）を $x$ の**台単体**という。$\tau\le\sigma$ は $\tau$ が $\sigma$ の面であることを表す。
- CW 複体とその位相 \ref{at:cw-complex}, \ref{at:page-cw-topology}（部分複体 \ref{at:subcomplex}、閉集合の判定 \ref{at:cw-closed-criterion}、直積の上の連続性 \ref{at:cw-coherent-product}、有限部分複体 \ref{at:cw-finite-subcomplex}、ホモトピー拡張性質 \ref{at:cw-hep}）。
- ルベーグ数 \ref{top:lebesgue-number}、一様連続性 \ref{top:heine-cantor}、立方体と円板 \ref{at:cube-disk}、$(\Delta^{k},\partial\Delta^{k})\cong(D^{k},\partial D^{k})$（\ref{at:simplex-hep} の証明）。
- $\|y\|\defeq\max_{i}|y_{i}|$（$y\in\mathbb{R}^{n}$、最大値ノルム）、$B_{r}\defeq\{y\mid\|y\|<r\}$（開立方体）、$\bar B_{r}$ はその閉包。$B_{r}$ は凸で、三角不等式が成り立つ。
- **選択公理**：単体近似定理では使わない。押し出しの補題と胞体近似定理では、無限個の胞体について近似の選択を同時に行うので使う。
:::

## 重心細分と立方体の三角形分割 {#at:sec-apx-subdivision}

::: definition 単体複体の重心細分 {#at:barycentric-subdivision-complex keywords="barycentric subdivision K' of a simplicial complex: simplices spanned by barycenters of chains of faces; standard triangulation of the cube by chains of subsets" index="重心細分（単体複体）|じゅうしんさいぶんたんたいふくたい, 立方体の三角形分割|りっぽうたいのさんかくけいぶんかつ"}
1. 単体 $\sigma$ の重心を $b_{\sigma}$ とする。単体複体 $K$ の単体の鎖 $\sigma_{0}<\sigma_{1}<\cdots<\sigma_{p}$（真の面の列）ごとに、$b_{\sigma_{0}},\dots,b_{\sigma_{p}}$ が張る単体をとり、その全体を $K'$ と書いて $K$ の**重心細分**という。$K^{(r)}$ は $r$ 回の重心細分。
2. $\{1,\dots,k\}$ の部分集合 $A$ の指示ベクトルを $\mathbf{1}_{A}\in\{0,1\}^{k}$ とする。部分集合の鎖 $A_{0}\subsetneq A_{1}\subsetneq\cdots\subsetneq A_{p}$ ごとに $\mathbf{1}_{A_{0}},\dots,\mathbf{1}_{A_{p}}$ が張る単体をとり、その全体を $T^{k}$ と書く（**立方体の標準的な三角形分割**）。
:::

::: lemma 鎖による表示 {#at:chain-representation keywords="every point of a simplex is uniquely a positive convex combination of barycenters of a chain of faces, given by the upper level sets of its barycentric coordinates; similarly for the cube and indicator vectors" index="鎖による表示|くさりによるひょうじ"}
1. 単体 $\sigma=[v_{0},\dots,v_{d}]$ の点 $x=\sum_{i}\lambda_{i}v_{i}$ について、$\lambda$ の正の値を $c_{1}>c_{2}>\cdots>c_{q}>0$、$F_{j}\defeq\{v_{i}\mid\lambda_{i}\ge c_{j}\}$ が張る面とすると、
$$
x=\sum_{j=1}^{q}(c_{j}-c_{j+1})\,|F_{j}|\,b_{F_{j}}\qquad(c_{q+1}\defeq0,\ |F_{j}|\text{ は頂点の数})
$$
で、係数は正で和は $1$。$x$ を「面の鎖 $G_{1}<\cdots<G_{q'}$ の重心の、係数がすべて正の凸結合」と書く方法はこれだけである。
2. $x\in I^{k}$ について、座標の正の値を $c_{1}>\cdots>c_{q}>0$、$A_{j}\defeq\{i\mid x_{i}\ge c_{j}\}$ とすると $x=(1-c_{1})\mathbf{1}_{\varnothing}+\sum_{j}(c_{j}-c_{j+1})\mathbf{1}_{A_{j}}$ で、係数が正の項だけを残した表示は、「部分集合の鎖の指示ベクトルの、係数がすべて正の凸結合」としてただ一通りである。
:::

::: proof
**Step 1（1 の等式）.** $|F_{j}|\,b_{F_{j}}=\sum_{v_{i}\in F_{j}}v_{i}$ なので、右辺の $v_{i}$ の係数は $\sum_{j:\,\lambda_{i}\ge c_{j}}(c_{j}-c_{j+1})$。$\lambda_{i}=c_{m}$ なら、これは $j\ge m$ についての和 $c_{m}-c_{q+1}=\lambda_{i}$、$\lambda_{i}=0$ なら $0$。係数の和は $\sum_{j}(c_{j}-c_{j+1})|F_{j}|=\sum_{i}\lambda_{i}=1$（同じ計算を $v_{i}$ ごとに足した）。

**Step 2（1 の一意性）.** $x=\sum_{j}\mu_{j}b_{G_{j}}$（$\mu_{j}>0$, $G_{1}<\cdots<G_{q'}$）とすると、$v_{i}$ の重心座標は $\lambda_{i}=\sum_{j:\,v_{i}\in G_{j}}\mu_{j}/|G_{j}|$。鎖なので、$v_{i}\in G_{j}$ となる $j$ は $j\ge j_{0}(i)$ の形の区間で、$\lambda_{i}$ は $j_{0}(i)$ が小さいほど大きい。よって $\lambda_{i}$ の値の上側集合 $\{v_{i}\mid\lambda_{i}\ge c\}$ はちょうど $G_{j}$ の頂点集合たちで、$G_{j}=F_{j}$, $q'=q$。係数も $\lambda$ から順に決まる。

**Step 3（2）.** 1 と同じ計算：右辺の第 $i$ 座標は $\sum_{j:\,x_{i}\ge c_{j}}(c_{j}-c_{j+1})=x_{i}$、係数の和は $(1-c_{1})+c_{1}=1$。一意性も Step 2 と同様（第 $i$ 座標が $\sum_{j:\,i\in A_{j}}\mu_{j}$ となるので、座標の上側集合が鎖を決める）。
:::

::: proposition 細分は単体複体 {#at:subdivision-complex keywords="K' and T^k are simplicial complexes, |K'| = |K|, |T^k| = I^k, each simplex of K' lies in a simplex of K, mesh(K') <= d/(d+1) mesh(K)" index="細分の性質|さいぶんのせいしつ"}
1. $K'$ は単体複体で、$|K'|=|K|$。$K'$ の各単体は $K$ のある単体に含まれ、$K$ の部分複体 $L$ について $L'$ は $K'$ の部分複体。
2. $T^{k}$ は単体複体で、$|T^{k}|=I^{k}$。
3. $K$ の次元を $d$、単体の直径の最大値を $\operatorname{mesh}K$ とすると $\operatorname{mesh}K'\le\frac{d}{d+1}\operatorname{mesh}K$。とくに $\operatorname{mesh}K^{(r)}\to0$（$r\to\infty$）。
:::

::: proof
**Step 1（アフィン独立）.** $\sigma_{0}<\cdots<\sigma_{p}$ について $\sum_{j}c_{j}b_{\sigma_{j}}=0$, $\sum_{j}c_{j}=0$ とする。$\sigma_{p}$ の頂点で $\sigma_{p-1}$ にないもの $v$ をとると、$\sigma_{p}$ の重心座標での $v$ の係数は $c_{p}/|\sigma_{p}|$ なので（$\sigma_{p}$ の頂点はアフィン独立）$c_{p}=0$。これを繰り返して全部 $0$。$T^{k}$ でも、$A_{p}\setminus A_{p-1}$ の座標を見れば同様。

**Step 2（単体複体）.** $K'$ の単体の面は部分鎖が張る単体なので $K'$ に属する。$\tau_{1},\tau_{2}\in K'$ と $x\in\tau_{1}\cap\tau_{2}$ について、$x$ を $\tau_{1}$ の頂点の正の凸結合として書くと、それは \ref{at:chain-representation} の一意な表示で、$\tau_{2}$ の側でも同じ表示が得られる。よって表示に使われる頂点は共通の頂点で、$x$ は共通の頂点が張る単体（両者の共通の面）に入る。したがって $\tau_{1}\cap\tau_{2}$ は共通の頂点が張る面に一致する。$|K'|=|K|$：$K'$ の単体は鎖の最大の単体に含まれ、逆に $K$ の単体の点は \ref{at:chain-representation} の 1 で $K'$ の単体に入る。$L$ の単体の鎖は $L$ の中の鎖なので $L'\subset K'$ は部分複体。$T^{k}$ も同様に \ref{at:chain-representation} の 2 から。

**Step 3（直径）.** 凸集合の直径は頂点間の距離の最大値（$y\mapsto|y-w|$ は凸関数なので最大値は頂点でとる）。$\sigma_{i}<\sigma_{j}$ の重心について、$b_{\sigma_{i}}\in\sigma_{j}$ なので $|b_{\sigma_{j}}-b_{\sigma_{i}}|\le\max_{v}|b_{\sigma_{j}}-v|$（$v$ は $\sigma_{j}$ の頂点）。$\sigma_{j}$ の次元を $m\le d$ とすると
$$
|b_{\sigma_{j}}-v|=\Bigl|\frac{1}{m+1}\sum_{u}(u-v)\Bigr|\le\frac{m}{m+1}\operatorname{diam}\sigma_{j}\le\frac{d}{d+1}\operatorname{mesh}K
$$
（$u=v$ の項は $0$）。
:::

## 単体近似定理 {#at:sec-apx-simplicial}

::: definition 開星状体 {#at:open-star keywords="open star st(v) of a vertex: points whose carrier contains v; barycentric coordinate functions" index="開星状体|かいせいじょうたい"}
単体複体 $K$ の頂点 $v$ について、$t_{v}\colon|K|\to[0,1]$ を「$x$ の台単体での $v$ の重心座標（$v$ が台単体の頂点でなければ $0$）」とし、$\operatorname{st}v\defeq\{x\mid t_{v}(x)>0\}$ を $v$ の**開星状体**という。
:::

::: lemma 開星状体の性質 {#at:open-star-properties keywords="t_v is continuous, open stars are open, vertices span a simplex iff their open stars meet, diameter of an open star is at most 2 mesh" index="開星状体の性質|かいせいじょうたいのせいしつ"}
1. $t_{v}$ は連続で、$\operatorname{st}v$ は $|K|$ の開集合。$\{\operatorname{st}v\}_{v}$ は $|K|$ を覆う。
2. 頂点 $v_{0},\dots,v_{p}$ が $K$ の単体を張る $\iff$ $\bigcap_{i}\operatorname{st}v_{i}\neq\varnothing$。
3. $\operatorname{diam}\operatorname{st}v\le2\operatorname{mesh}K$。
:::

::: proof
1：各単体 $\sigma$ の上で $t_{v}$ は $\sigma$ の重心座標（$v\in\sigma$ のとき）か $0$（$v\notin\sigma$ のとき）で、どちらもアフィンなので連続。面の上での値は一致する（面の重心座標は単体の重心座標の制限）。$|K|$ は有限個の閉集合 $\sigma$ の和なので、貼り合わせ補題（\ref{top:pasting-lemma}）から連続。各点 $x$ は台単体の頂点の開星状体に入る。2：(⇒) 張る単体の重心は $\bigcap\operatorname{st}v_{i}$ に入る。(⇐) $x\in\bigcap\operatorname{st}v_{i}$ なら $v_{i}$ はすべて $x$ の台単体の頂点なので、その面を張る。3：$\operatorname{st}v$ の点は $v$ を含む単体に入るので、2 点 $x,y$ について $|x-y|\le|x-v|+|v-y|\le2\operatorname{mesh}K$。
:::

::: theorem 単体近似定理 {#at:simplicial-approximation keywords="simplicial approximation theorem: any continuous map between finite simplicial complexes is homotopic to a simplicial map after sufficiently fine barycentric subdivision of the domain; star condition; carrier homotopy" index="単体近似定理|たんたいきんじていり"}
$K,L$ を有限単体複体、$f\colon|K|\to|L|$ を連続写像とする。
1. 頂点の写像 $g\colon K^{(0)}\to L^{(0)}$ がすべての頂点 $v$ で $f(\operatorname{st}v)\subset\operatorname{st}g(v)$ を満たすなら、$g$ は単体写像で、各 $x$ について $|g|(x)$ は $f(x)$ の台単体に入る。したがって $H(x,t)\defeq(1-t)f(x)+t|g|(x)$ は $|L|$ の中の $f$ から $|g|$ へのホモトピーで、$f(x)=|g|(x)$ となる点 $x$ を動かさない。とくに $f(v)$ が頂点である頂点 $v$ では $g(v)=f(v)$ で、$v$ は動かない。
2. 十分大きい $r$ について、$K^{(r)}$ の頂点の写像 $g$ で 1 の条件（$K^{(r)}$ の開星状体について）を満たすものがある。
:::

::: proof
**Step 1（単体写像であること）.** $v_{0},\dots,v_{p}$ が $K$ の単体を張るとし、$x$ をその開単体の点とする。$x\in\operatorname{st}v_{i}$（すべての $i$）なので $f(x)\in\bigcap_{i}\operatorname{st}g(v_{i})$。\ref{at:open-star-properties} の 2 から $g(v_{0}),\dots,g(v_{p})$ は $L$ の単体を張り、さらにそれらはすべて $f(x)$ の台単体 $\tau$ の頂点である（$t_{g(v_{i})}(f(x))>0$）。

**Step 2（台単体）.** Step 1 の $x$ について $|g|(x)=\sum_{i}\lambda_{i}g(v_{i})$（$\lambda$ は $x$ の重心座標）は $\tau$ の点。$\tau$ は凸なので、$(1-t)f(x)+t|g|(x)\in\tau\subset|L|$。$H$ は $|K|\times I$ から $\mathbb{R}^{M}$（$|L|\subset\mathbb{R}^{M}$）への写像として連続で、値は $|L|$ に入る。$f(x)=|g|(x)$ なら $H(x,t)=f(x)$。$f(v)=w$ が頂点なら、$f(v)\in\operatorname{st}g(v)$ は $t_{g(v)}(w)>0$、すなわち $g(v)=w$ を意味する。

**Step 3（2）.** $\{f^{-1}(\operatorname{st}w)\}_{w}$ は $|K|$ の開被覆（\ref{at:open-star-properties} の 1）で、$|K|$ はコンパクト距離空間なので、ルベーグ数 $\delta>0$ がある（\ref{top:lebesgue-number}）。\ref{at:subdivision-complex} の 3 から $2\operatorname{mesh}K^{(r)}<\delta$ となる $r$ をとる。$K^{(r)}$ の各頂点 $v$ について $\operatorname{diam}\operatorname{st}v<\delta$ なので、ある $w$ で $\operatorname{st}v\subset f^{-1}(\operatorname{st}w)$。そのような $w$ のうち、$L$ の頂点に固定した順序で最初のものを $g(v)$ とする。

::: hypcheck
- **細分**：Step 3 で開星状体を小さくするのに使った。外すと偽：$K=L$ を三角形の境界（$|K|\cong S^{1}$）、$f$ を写像度 $2$ の写像とすると、$K$ から $L$ への単体写像は 3 頂点を 3 頂点に写すだけなので、写像度は $0$ か $\pm1$ にしかならず、$f$ とホモトープにならない。
- **有限性・コンパクト性**：ルベーグ数の存在に使った。
- **選択公理**：使わない（$L$ の頂点は有限個）。
:::
:::

## 区分的線形近似と押し出し {#at:sec-apx-pushoff}

::: lemma 区分的線形近似 {#at:pl-approximation keywords="a map from a polyhedron into a Hausdorff space can be homotoped, near an open cell, to a map that is piecewise affine in local coordinates; if k < n it misses a point; if k = n it has a regular value with finitely many preimages" index="区分的線形近似|くぶんてきせんけいきんじ"}
$Y$ をハウスドルフ空間、$e\subset Y$ を開集合、$\Psi\colon B_{1}\to e$ を同相写像（$B_{1}=(-1,1)^{n}\subset\mathbb{R}^{n}$）とする。$K$ を次元 $k$ の有限単体複体、$f\colon|K|\to Y$ を連続写像とし、$f^{-1}(e)$ の上で $u\defeq\Psi^{-1}\circ f$ とおく。このとき、ホモトピー $f_{t}\colon|K|\to Y$（$f_{0}=f$）、$g\defeq f_{1}$、ある細分 $K^{(r)}$ の部分複体 $K_{1}$、各単体の上でアフィンな写像 $L\colon|K_{1}|\to B_{1}$ で、次を満たすものがある。
1. $f(x)\notin\Psi(B_{3/4})$ ならすべての $t$ で $f_{t}(x)=f(x)$。$f(x)\in e$ ならすべての $t$ で $f_{t}(x)\in e$。
2. $g(x)\in\Psi(B_{1/4})$ なら $x\in|K_{1}|$ で、$x$ のある開近傍の上で $g=\Psi\circ L$。
3. $k<n$ なら、$\Psi(B_{1/4})$ の点で $g(|K|)$ に入らないものがある。
4. $k=n$ で $K\subset\mathbb{R}^{n}$ なら、$p\in B_{1/4}$ で次を満たすものがある：$g^{-1}(\Psi(p))$ は有限集合で、その各点 $x$ は $K_{1}$ のある $n$ 単体 $\tau$ の内部にあり、$L\restriction\tau$ は単射なアフィン写像。
:::

::: proof
**Step 1（切り替え関数）.** $\phi(x)\defeq\min\{1,\max\{0,\,3-4\|u(x)\|\}\}$（$x\in f^{-1}(e)$）、$\phi(x)\defeq0$（$f(x)\notin e$）とする。$\phi$ は $\|u\|\le\frac12$ で $1$、$\|u\|\ge\frac34$ で $0$。$C\defeq f^{-1}(\Psi(\bar B_{3/4}))$ は、$\Psi(\bar B_{3/4})$ がハウスドルフ空間のコンパクト集合で閉なので、閉集合。$\phi$ は開集合 $f^{-1}(e)$ の上で連続、開集合 $|K|\setminus C$ の上で $0$ なので、$|K|$ 上で連続。

**Step 2（細分と近似）.** $C'\defeq f^{-1}(\Psi(\bar B_{7/8}))$ はコンパクトで、$u$ はその上で一様連続（\ref{top:heine-cantor}）。開被覆 $\{f^{-1}(\Psi(B_{7/8})),\ |K|\setminus C\}$ のルベーグ数と、$u$ の $C'$ 上の変動が $\frac1{16}$ 未満になる距離の小さい方より $\operatorname{mesh}K^{(r)}$ が小さくなる $r$ をとる。$C$ と交わる $K^{(r)}$ の単体とその面の全体を $K_{1}$ とすると、$K_{1}$ の単体は $f^{-1}(\Psi(B_{7/8}))$ に含まれ（$|K|\setminus C$ には含まれないので）、その上で $u$ の変動は $\frac1{16}$ 未満。$L(x)\defeq\sum_{v}t_{v}(x)u(v)$（$t_{v}$ は $K^{(r)}$ の重心座標、\ref{at:open-star}）とすると、$L$ は $K_{1}$ の各単体の上でアフィン、値は $u(v)\in B_{7/8}$ の凸結合なので $B_{7/8}$ に入り、$\|L(x)-u(x)\|\le\sum_{v}t_{v}(x)\|u(v)-u(x)\|<\frac1{16}$。また $x\in C$ なら、$x$ を含む $K^{(r)}$ の単体はすべて $K_{1}$ に属する。$x$ を含まない単体の和は閉集合なので、その補集合は $x$ の開近傍で、$x$ を含む単体の和、したがって $|K_{1}|$ に含まれる。

**Step 3（ホモトピー）.** $f_{t}(x)\defeq\Psi\bigl((1-t\phi(x))u(x)+t\phi(x)L(x)\bigr)$（$f(x)\in e$）、$f_{t}(x)\defeq f(x)$（$f(x)\notin e$）とする。$\phi(x)>0$ なら $x\in C\subset|K_{1}|$ で $L(x)$ は定義され、凸結合は $B_{7/8}$ に入る。$\phi(x)=0$ では第 1 式も $f(x)$ に等しい。連続性：$\phi\cdot L$ は、$C$ の点の近くでは（Step 2 の開近傍の上で）連続な積、$f^{-1}(e)\setminus C$ では $0$ なので $f^{-1}(e)$ 上で連続。よって $f_{t}$ は開集合 $f^{-1}(e)\times I$ と $(|K|\setminus C)\times I$ のそれぞれで連続で、両者は $|K|\times I$ を覆い、共通部分で一致する。1 は定義から。

**Step 4（2）.** $g(x)\in\Psi(B_{1/4})$ とする。$\phi(x)=0$ なら $g(x)=f(x)\notin\Psi(B_{3/4})$ で矛盾。$0<\phi(x)<1$ なら $\|u(x)\|>\frac12$ で
$$
\|(1-\phi)u+\phi L\|\ge\|u\|-\phi\|L-u\|>\tfrac12-\tfrac1{16}>\tfrac14
$$
となり矛盾。よって $\phi(x)=1$、$g(x)=\Psi(L(x))$、$\|u(x)\|\le\|L(x)\|+\frac1{16}<\frac12$。開集合 $\{\|u\|<\frac12\}$ の上で $\phi=1$ なので、そこで $g=\Psi\circ L$。

**Step 5（3・4）.** $\mathbb{R}^{n}$ の次元 $n$ 未満のアフィン部分空間は、閉で内点をもたない。閉で内点をもたない集合の有限個の和も内点をもたない（$F_{1}\cup F_{2}$ が空でない開集合 $V$ を含めば、$V\setminus F_{1}$ は空でない開集合で $F_{2}$ に含まれ矛盾）。3：$k<n$ なら $L(|K_{1}|)$ は有限個の単体のアフィン像の和で、各像は次元 $k$ 以下のアフィン部分空間に入るので、$B_{1/4}$ を含まない。$p\in B_{1/4}\setminus L(|K_{1}|)$ をとると、Step 4 から $\Psi(p)\notin g(|K|)$。4：$K_{1}$ の次元 $n$ 未満の単体の像と、$L$ が単射でない $n$ 単体の像は、いずれも次元 $n$ 未満のアフィン部分空間に入るので、それらの和に入らない $p\in B_{1/4}$ がある。$g(x)=\Psi(p)$ なら Step 4 から $L(x)=p$ で、$x$ の台単体 $\tau\in K_{1}$ は $n$ 単体で $L\restriction\tau$ は単射（そうでなければ $p$ は除いた集合に入る）、$x$ は $\tau$ の内部にある。各 $n$ 単体は $L^{-1}(p)$ の点を高々 1 個しか含まないので、$g^{-1}(\Psi(p))$ は有限。

::: hypcheck
- **$Y$ がハウスドルフ**：Step 1 で $C$ が閉であることに使った（CW 複体はハウスドルフ、\ref{at:cw-paracompact}）。
- **$k<n$**：3 で $L$ の像が内点をもたないことに使った。$k=n$ では一般に全射になりうるので、代わりに 4 の「正則な値」を使う。
- **選択公理**：使わない（$r$ と $p$ は、たとえば最小の $r$、有理点の固定した列の最初の点として一意にとれる）。
:::
:::

::: lemma 胞体の押し出し {#at:cell-push-off keywords="a map from D^k into a CW complex Y sending the boundary into Y^k is homotopic rel boundary to a map into Y^k" index="胞体の押し出し|ほうたいのおしだし"}
$Y$ を CW 複体、$h\colon D^{k}\to Y$ を連続写像で $h(\partial D^{k})\subset Y^{k}$ とする。$h$ は rel $\partial D^{k}$ で $Y^{k}$ に値をとる写像とホモトープ。
:::

::: proof
**Step 1（有限部分複体へ）.** $h(D^{k})$ はコンパクトなので、有限部分複体 $Y'$ に含まれる（\ref{at:cw-finite-subcomplex} の 2）。$Y'$ の次元 $k$ より大きい胞体の個数についての帰納法で示す。個数が $0$ なら $h(D^{k})\subset Y'\cap Y^{k}$ で終わる。

**Step 2（最大次元の胞体は開）.** $e$ を $Y'$ の胞体で次元 $n$ が最大のもの（$n>k$）とする。$Y'$ の他の胞体 $e'$ について、$\Phi_{e'}(D)\subset e'\cup Y^{\dim e'-1}$ は $e$ と交わらない（$\dim e'\le n$ で、$e\cap Y^{n-1}=\varnothing$）。よって $Y'\setminus e$ は \ref{at:subcomplex-properties} の 1 の条件を満たす部分複体で閉、$e$ は $Y'$ の開集合。$\Phi_{e}\restriction\mathring D^{n}\colon\mathring D^{n}\to e$ は同相（\ref{at:cw-closed-criterion} の 3）で、立方体と円板の同相 $\varphi\colon[-1,1]^{n}\to D^{n}$（\ref{at:cube-disk}）は内部を内部に写すので、$\Psi\defeq\Phi_{e}\circ\varphi\restriction B_{1}\colon B_{1}\to e$ は同相。

**Step 3（1 点を避ける）.** $(D^{k},\partial D^{k})\cong(\Delta^{k},\partial\Delta^{k})$ で $D^{k}$ を有限単体複体の多面体とみて、\ref{at:pl-approximation} を $Y'$, $e$, $\Psi$, $h$ に使う。$h(\partial D^{k})\subset Y^{k}$ は $e$ と交わらないので、1 によりホモトピーは rel $\partial D^{k}$ で、3 から終わりの写像 $h'$ は $e$ のある点 $y_{0}=\Phi_{e}(z_{0})$（$z_{0}\in\mathring D^{n}$）を通らない。

**Step 4（放射状の押し出し）.** $z\in D^{n}\setminus\{z_{0}\}$ について、$z_{0}$ から $z$ への半直線が $\partial D^{n}$ と交わる点を $z^{*}$ とする（$|z_{0}+\lambda(z-z_{0})|=1$ の正の解 $\lambda\ge1$ は 2 次方程式の解の公式で $z$ に連続に依存）。$Y'\setminus\{y_{0}\}$ 上のホモトピー $R_{t}$ を、$Y'\setminus e$ の上では恒等、$\Phi_{e}(z)$（$z\neq z_{0}$）では $R_{t}(\Phi_{e}(z))\defeq\Phi_{e}((1-t)z+tz^{*})$ と定める。$|z|=1$ では $z^{*}=z$ なので両者は一致し、\ref{at:cw-coherent-product} の 2（CW 複体 $Y'$ の開集合 $Y'\setminus\{y_{0}\}$）から連続。$R_{1}$ は値を $Y'\setminus e$ に持つ。$R_{t}\circ h'$ は rel $\partial D^{k}$ のホモトピーで、$R_{1}\circ h'$ は $Y'\setminus e$（次元 $k$ より大きい胞体が 1 個少ない有限部分複体）に値をとる。帰納法の仮定から結論。
:::

## 胞体近似定理 {#at:sec-apx-cellular}

::: definition 胞体写像 {#at:cellular-map keywords="cellular map: f(X^n) is contained in Y^n for all n" index="胞体写像|ほうたいしゃぞう"}
CW 複体の間の連続写像 $f\colon X\to Y$ がすべての $n$ で $f(X^{n})\subset Y^{n}$ を満たすとき、**胞体写像**という。部分複体 $A\subset X$ の上でこの条件を満たすとき、$f$ は $A$ の上で胞体写像という。
:::

::: theorem 胞体近似定理 {#at:cellular-approximation keywords="cellular approximation theorem: every map between CW complexes is homotopic to a cellular map, relative to a subcomplex on which it is already cellular" index="胞体近似定理|ほうたいきんじていり"}
$X,Y$ を CW 複体、$A\subset X$ を部分複体、$f\colon X\to Y$ を $A$ の上で胞体写像である連続写像とする。$f$ は rel $A$ で胞体写像とホモトープである。
:::

::: proof
**Step 1（骨格ごとの変形）.** $X_{n}\defeq X^{n}\cup A$, $X_{-1}\defeq A$, $f_{-1}\defeq f$ とする。$f_{n-1}$ が $f$ と rel $A$ でホモトープで、$X_{n-1}$ の上で胞体写像（$j\le n-1$ で $f_{n-1}(X^{j})\subset Y^{j}$、かつ $A$ の上で胞体写像）とする。$A$ に含まれない $n$ 胞体 $\beta$ について、$h_{\beta}\defeq f_{n-1}\circ\Phi_{\beta}$ は $h_{\beta}(\partial D_{\beta})\subset f_{n-1}(X^{n-1})\subset Y^{n-1}\subset Y^{n}$ を満たすので、\ref{at:cell-push-off} から rel $\partial D_{\beta}$ のホモトピー $G_{\beta}$ で $Y^{n}$ に値をとる写像につながる（$n=0$ では $\partial D^{0}=\varnothing$ で、$G_{\beta}$ は $f_{n-1}(\beta)$ から $Y^{0}$ の点への道）。

**Step 2（ホモトピーの延長）.** $X_{n}\times I$ 上の写像を、$X_{n-1}\times I$ の上では $f_{n-1}$（時間によらない）、$\Phi_{\beta}(z)$ では $G_{\beta}(z,t)$ と定める。$G_{\beta}$ は rel $\partial D_{\beta}$ なので well-defined で、\ref{at:cw-coherent-product} の 1（CW 複体 $X_{n}$ に適用）から連続。\ref{at:cw-hep} でこれを $f_{n-1}$ から始まる $X\times I$ 上のホモトピー $F^{n}$ に延ばし、$f_{n}\defeq F^{n}_{1}$ とする。$F^{n}$ は $X_{n-1}$ の上で時間によらないので、$f_{n}$ は $X_{n-1}$ の上で $f_{n-1}$ に等しく、$X^{n}$ を $Y^{n}$ に写す。よって $f_{n}$ は $X_{n}$ の上で胞体写像で、$f_{n-1}$ と rel $X_{n-1}$（とくに rel $A$）でホモトープ。

**Step 3（無限個のホモトピーをつなぐ）.** $F\colon X\times I\to Y$ を、$t\in[1-2^{-n},1-2^{-n-1}]$（$n\ge0$）では $F^{n}$ を時間について 1 次関数で縮めたもの（$n=-1$ の段は不要）、$t=1$ では $f_{\infty}(x)\defeq f_{d}(x)$（$x\in X_{d}$）と定める。$x\in X_{d}$ なら $n>d$ の段では $F^{n}$ は $x$ を動かさないので、$f_{\infty}$ は well-defined で、$F$ は各区間の端点で連続につながる。$d$ 次元の胞体 $\gamma$ の上では、$t\ge1-2^{-d-1}$ で $F(\Phi_{\gamma}(z),t)=f_{d}(\Phi_{\gamma}(z))$ と時間によらないので、$F\circ(\Phi_{\gamma}\times1)$ は有限個の閉区間の上の連続写像の貼り合わせで連続。\ref{at:cw-coherent-product} の 1 から $F$ は連続。$F_{0}=f$、$F_{1}=f_{\infty}$ は胞体写像（$X^{d}\subset X_{d}$ で $f_{d}(X^{d})\subset Y^{d}$）、$F$ は $A$ の上で時間によらない。

::: hypcheck
- **$f$ が $A$ の上で胞体写像**：Step 1 の帰納法の出発点に使った。$A$ の上では写像を動かさないので、この仮定は外せない。
- **CW 対のホモトピー拡張性質**：Step 2 で、胞体の上で作ったホモトピーを $X$ 全体に広げるのに使った。
- **選択公理**：Step 1 で無限個の胞体について \ref{at:cell-push-off} のホモトピーを同時に選ぶのに使った（$X$ が有限 CW 複体なら不要）。
:::
:::

::: corollary 胞体近似の帰結 {#at:cellular-approximation-consequences keywords="maps of CW pairs are homotopic to cellular maps of pairs; maps from a k-dimensional CW complex to S^n with k < n are null-homotopic; S^n is simply connected for n >= 2" index="胞体近似の帰結|ほうたいきんじのきけつ"}
1. CW 対の写像 $f\colon(X,A)\to(Y,B)$ は、対の写像を通るホモトピーで、胞体写像 $(X,A)\to(Y,B)$ とホモトープ。
2. $X$ が $k$ 次元の CW 複体で $k<n$ なら、任意の連続写像 $X\to S^{n}$ は定値写像とホモトープ。とくに $n\ge2$ なら $S^{n}$ は単連結。
:::

::: proof
1：まず $f\restriction A\colon A\to B$ に定理（$A=\varnothing$ の場合）を使い、$B$ の中のホモトピーで胞体写像 $A\to B$ につなぐ。$B$ は $Y$ の部分複体なので、それは $Y$ の中でも胞体写像。このホモトピーを \ref{at:cw-hep} で $f$ から始まる $X\times I$ 上のホモトピーに延ばすと、終わりの写像 $f'$ は $A$ の上で胞体写像で、各時刻で $A$ を $B$ に写す。$f'$ に定理を rel $A$ で使う。2：$S^{n}$ に 0 胞体 $e^{0}$ 1 個と $n$ 胞体 1 個の CW 構造を入れる。胞体写像は $X=X^{k}$ を $(S^{n})^{k}=(S^{n})^{0}$（1 点）に写す。単連結性：基点 $e^{0}$ の閉道 $\gamma\colon(I,\partial I)\to(S^{n},e^{0})$ に、$I$ の CW 構造（0 胞体 $0,1$ と 1 胞体 $(0,1)$）と部分複体 $\partial I$ について定理を使う（$\gamma$ は $\partial I$ の上で胞体写像）と、$\gamma$ は rel $\partial I$ で $(S^{n})^{1}=e^{0}$ に値をとる写像、すなわち定値の道とホモトープ。
:::

::: supplement
**一般化と関連する事実.**
- 単体近似定理の相対版：$f$ が部分複体 $L_{0}$ の上で既に単体写像なら、$L_{0}$ の上では $g=f$ ととれる（1 の最後の主張の一般化）。また、単体近似 $g$ の誘導する鎖写像を使ってホモロジーの誘導写像を組合せ的に計算できる。これが特異ホモロジー以前の単体的ホモロジーの位相不変性の証明であった（\ref{at:page-simplicial-singular} の補足）。
- 胞体近似定理の帰結として、CW 対 $(X,A)$ で $X\setminus A$ の胞体の次元がすべて $n$ より大きいなら $k\le n$ で $\pi_{k}(X,A)=0$ となる（\ref[高次ホモトピー群]{at:page-homotopy-groups} で扱う）。CW 複体の $\pi_{k}$ は $(k+1)$ 骨格で決まる。

**前提を変えると.** CW 複体でない空間では胞体近似は意味をもたないが、似た「次元による押し出し」は多様体で横断性定理（滑らかな写像の正則値の存在、サードの定理）として現れる。\ref{at:pl-approximation} の 4 は、その区分的線形版である。

**高い視点.** 二つの近似定理は、「連続写像のホモトピー類は組合せ的なデータで代表できる」ことを言っている。単体近似は写像を頂点の対応という有限のデータに、胞体近似は写像を骨格を保つものに直す。後者は、ホモトピー論の不変量が「低い次元の胞体からの写像は高い次元の胞体を見ない」という次元の原理で計算できることの基礎である。比喩で言えば、紐（低い次元の写像）は布（高い次元の胞体）の上に置いても、布の 1 点に穴が開いていれば必ずその穴を避けて、縁の方へ滑らせて片付けられる。
:::

## 問題 {#at:sec-apx-problems}

::: problem {#at:prob-simplicial-approx-degree}
三角形の境界 $K$（$|K|\cong S^{1}$）について、$K^{(r)}$ から $K$ への単体写像の写像度の絶対値は $2^{r}$ 以下であることを示せ。これから、写像度 $m$ の自己写像の単体近似 $K^{(r)}\to K$ が存在するには $2^{r}\ge|m|$ が必要であることを導け。
:::

::: solution
$|K|$ を、3 頂点 $a_{0},a_{1},a_{2}$ が角度 $0,\frac{2\pi}{3},\frac{4\pi}{3}$ の点に、各辺がその間の弧に写る同相で円周とみる。$K^{(r)}$ は頂点 $N\defeq3\cdot2^{r}$ 個の円周の三角形分割（重心細分のたびに各辺が 2 つに分かれる）で、頂点を一周の順に $w_{0},\dots,w_{N}=w_{0}$ とする。単体写像 $g$ は各辺 $[w_{i},w_{i+1}]$ を 1 点か $K$ の 1 辺に写すので、$|g|$ を辺ごとに持ち上げると、偏角の変化は各辺で $0$ か $\pm\frac{2\pi}{3}$。一周での偏角の変化の合計は $2\pi\deg g$（円周の写像度は回転数、\ref{at:circle-h1-generator}）なので
$$
2\pi|\deg g|\le N\cdot\tfrac{2\pi}{3},\qquad|\deg g|\le2^{r}.
$$
単体近似 $|g|$ は $f$ とホモトープ（\ref{at:simplicial-approximation}）で写像度が等しいので、$|m|\le2^{r}$。
:::

::: problem {#at:prob-cellular-not-rel}
$X=Y=S^{1}$（0 胞体 1 個 $v$、1 胞体 1 個）とし、$f\colon S^{1}\to S^{1}$ を $v$ を $v$ 以外の点に写す回転とする。$f$ は胞体写像でないが、胞体写像とホモトープであることを確かめよ。また、$A=\{v\}$ について「rel $A$ で胞体写像とホモトープ」は成り立たないことを示せ（$f$ は $A$ の上で胞体写像でない）。
:::

::: solution
回転を逆に戻すホモトピーで $f\simeq1_{S^{1}}$、$1_{S^{1}}$ は胞体写像。rel $A$ のホモトピーは各時刻で $v$ を $f(v)\neq v$ に写すので、終わりの写像も $v$ を $Y^{0}=\{v\}$ の外に写し、胞体写像でない。定理の「$A$ の上で胞体写像」という仮定が必要な理由である。
:::

::: problem {#at:prob-one-skeleton-pi1}
CW 複体 $X$ と 0 胞体 $x_{0}$ について、包含が誘導する $\pi_{1}(X^{1},x_{0})\to\pi_{1}(X,x_{0})$ は全射であることを、胞体近似定理を使って示せ。
:::

::: solution
閉道 $\gamma\colon(I,\partial I)\to(X,x_{0})$ は、$I$ の CW 構造（0 胞体 $0,1$、1 胞体 $(0,1)$）について部分複体 $\partial I$ の上で胞体写像（0 胞体を 0 胞体 $x_{0}$ に写す）。\ref{at:cellular-approximation} から、$\gamma$ は rel $\partial I$ で胞体写像、すなわち $X^{1}$ に値をとる閉道とホモトープ。よって $[\gamma]$ は $\pi_{1}(X^{1},x_{0})$ の元の像。
:::
