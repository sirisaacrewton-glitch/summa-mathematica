# 球面の写像の標準形とホップの定理 {#at:page-sphere-maps keywords="normal form of maps between spheres, slab maps, local degree, pinch map and wedge of spheres, reflection has degree -1, connectedness of GL_n components, Hopf degree theorem: maps S^n -> S^n are classified up to homotopy by degree"}

球面の自己写像 $S^{n}\to S^{n}$ は、ホモロジーの上では写像度（\ref{at:degree}）という整数で作用する。このページでは、逆に写像度がホモトピー類を決めること（**ホップの定理**）を、ホモトピー群やフレヴィッツの定理を使わずに証明する。方法は、写像を区分的線形近似で「小さな箱の上だけで向きを保つか反転するアフィン写像として働き、他はすべて基点に潰す」形（**標準形**）に直し、箱を動かして並べ替え、向きの逆な箱どうしを打ち消すことである。この標準形は、後で一般のホモロジー理論の一意性（\ref[アイレンバーグ–スティーンロッドの一意性定理]{at:eilenberg-steenrod-uniqueness}）とホモトピー群の計算（\ref[高次ホモトピー群]{at:page-homotopy-groups}）に使う。

> 資料：ホップの定理は標準的な内容（微分位相幾何では Milnor『Topology from the Differentiable Viewpoint』が正則値を使って示している）。ここでの区分的線形版の証明（標準形への変形と箱の移動）は、その考え方に沿って自分で書き下ろした。

## 記法と定義の確認 {#at:sec-sm-notation}

::: notation
- $n\ge1$ について $\Sigma^{n}\defeq I^{n}/\partial I^{n}$、$q\colon I^{n}\to\Sigma^{n}$ を商写像、$\ast\defeq q(\partial I^{n})$ を基点、$c\defeq(\frac12,\dots,\frac12)$ を中心とする。立方体と円板（\ref{at:cube-disk}）と二つの半球の公式の $\pi$（\ref{at:two-hemispheres}）から $\Sigma^{n}\cong D^{n}/\partial D^{n}\cong S^{n}$ で、$\Sigma^{n}$ はハウスドルフ。$\Sigma^{n}\setminus\{\ast\}=q(\mathring I^{n})$ は開集合で、$q$ はその上で同相。
- 連続写像 $f\colon(I^{n},\partial I^{n})\to(\Sigma^{n},\ast)$ は連続写像 $\bar f\colon\Sigma^{n}\to\Sigma^{n}$（$\bar f\circ q=f$）を定め、$\deg f\defeq\deg\bar f$（\ref{at:degree}）とおく。$f\simeq g$（rel $\partial I^{n}$）は、各時刻で $\partial I^{n}$ を $\ast$ に写すホモトピーを表す。
- $\|y\|\defeq\max_{i}|y_{i}|$。$s\in I^{n}$ を $s=(s_{1},s')$, $s'\in I^{n-1}$ と書く。$\rho(s)\defeq(1-s_{1},s')$。
- 区分的線形近似 \ref{at:pl-approximation}、立方体の三角形分割 \ref{at:subdivision-complex}、良い対と商空間 \ref{at:good-pair}、写像度の基本性質 \ref{at:degree-properties}、円周の基本群 \ref{at:fundamental-group-circle} と回転数 \ref{at:circle-h1-generator}。
- **選択公理**：使わない。
:::

## 箱写像 {#at:sec-sm-boxes}

::: definition 箱写像と標準形 {#at:box-map keywords="box map: finitely many disjoint boxes in the cube on which the map is an affine isomorphism onto the cube followed by the quotient, constant elsewhere; slab map S_epsilon" index="箱写像|はこしゃぞう, 標準形（球面の写像）|ひょうじゅんけいきゅうめんのしゃぞう"}
1. **箱データ**とは、有限個の組 $(x_{j},B_{j})$（$j=1,\dots,m$, $x_{j}\in I^{n}$, $B_{j}\in GL_{n}(\mathbb{R})$）で、**箱** $P_{j}\defeq\{s\mid\|B_{j}(s-x_{j})\|\le\frac12\}$ がすべて $I^{n}$ に含まれ、内部どうしが交わらないものをいう。その**箱写像** $M\colon I^{n}\to\Sigma^{n}$ を、$s\in P_{j}$ では $M(s)\defeq q(c+B_{j}(s-x_{j}))$、どの箱にも入らない $s$ では $M(s)\defeq\ast$ と定める。
2. $\varepsilon=(\varepsilon_{1},\dots,\varepsilon_{m})\in\{\pm1\}^{m}$ について、$I^{n}$ を $s_{1}$ 方向に $m$ 等分した $j$ 番目の板 $\frac{j-1}{m}\le s_{1}\le\frac{j}{m}$ の上で
$$
S_{\varepsilon}(s)\defeq\begin{cases}q(ms_{1}-j+1,\ s')&(\varepsilon_{j}=+1)\\ q(j-ms_{1},\ s')&(\varepsilon_{j}=-1)\end{cases}
$$
とおく（$m=0$ では $S_{\varnothing}\equiv\ast$）。$S_{\varepsilon}$ を**標準形**という。$S_{\varepsilon}$ は、$x_{j}=(\frac{2j-1}{2m},c')$（$c'=(\frac12,\dots,\frac12)\in\mathbb{R}^{n-1}$）、$B_{j}=\operatorname{diag}(\varepsilon_{j}m,1,\dots,1)$ の箱写像である。
:::

::: lemma 箱写像の連続性と変形 {#at:box-map-homotopy keywords="box maps are continuous and send the boundary to the base point; continuous families of box data give homotopies rel boundary" index="箱写像の変形|はこしゃぞうのへんけい"}
1. 箱写像は連続で、$\partial I^{n}$ を $\ast$ に写す。
2. 箱データ $(x_{j}(t),B_{j}(t))$ が $t\in I$ について連続で、各 $t$ で箱データの条件を満たすなら、箱写像 $M_{t}$ は rel $\partial I^{n}$ のホモトピーを与える。
:::

::: proof
2 を示せば 1 は定値の族として従う。$E_{j}\defeq\{(s,t)\mid\|B_{j}(t)(s-x_{j}(t))\|\le\frac12\}$ と $E_{0}\defeq\{(s,t)\mid$ すべての $j$ で $\|B_{j}(t)(s-x_{j}(t))\|\ge\frac12\}$ は $I^{n}\times I$ の閉集合で、和は全体（ある $j$ で $<\frac12$ なら $E_{j}$ に入る）。$E_{j}$ の上で $q(c+B_{j}(t)(s-x_{j}(t)))$ は連続、$E_{0}$ の上で定値 $\ast$。$E_{j}\cap E_{0}$ と $E_{j}\cap E_{k}$（$j\neq k$）の点では $\|B_{j}(t)(s-x_{j}(t))\|=\frac12$（内部が交わらないので $E_{j}\cap E_{k}$ の点は両方の箱の境界にある）となり、$c+B_{j}(t)(\cdots)\in\partial I^{n}$ なので値は $\ast$ で一致する。貼り合わせ補題（\ref{top:pasting-lemma}）から連続。$s\in\partial I^{n}$ が箱 $P_{j}$ に入るなら、$P_{j}\subset I^{n}$ より $s$ は $P_{j}$ の境界にあり、値は $\ast$。
:::

::: lemma $GL_{n}(\mathbb{R})$ の道 {#at:gl-path keywords="every invertible real matrix is joined by a path in GL_n(R) to diag(sign det, 1, ..., 1)" index="一般線形群の弧状連結成分|いっぱんせんけいぐんのこじょうれんけつせいぶん"}
$B\in GL_{n}(\mathbb{R})$ は、$GL_{n}(\mathbb{R})$ の中の道で $D_{\epsilon}\defeq\operatorname{diag}(\epsilon,1,\dots,1)$（$\epsilon=\operatorname{sgn}\det B$）と結ばれる。
:::

::: proof
**Step 1（行の加法で対角化）.** $i\neq j$ について $E\defeq 1+aE_{ij}$（第 $j$ 行の $a$ 倍を第 $i$ 行に足す行列）は、道 $1+taE_{ij}$（行列式 $1$）で単位行列と結ばれる。$B$ に左右からこの形の行列を掛けて対角行列にできる：$B$ の第 1 列は $0$ でないので、$b_{11}=0$ なら第 1 列が $0$ でない行を第 1 行に足して $b_{11}\neq0$ とし、第 1 行の倍数を他の行から引いて第 1 列を、第 1 列の倍数を他の列から引いて第 1 行を、$b_{11}$ 以外 $0$ にする。右下の $(n-1)$ 次の可逆行列に同じことを繰り返す。こうして $B=E_{1}\cdots E_{a}\,\Lambda\,E'_{1}\cdots E'_{b}$（$\Lambda$ は可逆な対角行列）。各 $E$ を単位行列へ動かす道の積で、$B$ は $\Lambda$ と結ばれる（積は連続で、各時刻で可逆）。

**Step 2（対角成分）.** $\Lambda=\operatorname{diag}(\lambda_{i})$ は道 $\operatorname{diag}(\operatorname{sgn}\lambda_{i}\cdot|\lambda_{i}|^{1-t})$ で $\operatorname{diag}(\pm1)$ と結ばれる。第 $i,j$ 成分がともに $-1$ なら、$(i,j)$ 平面の回転 $\begin{pmatrix}\cos\theta&-\sin\theta\\ \sin\theta&\cos\theta\end{pmatrix}$（$\theta\colon\pi\to0$）で両方 $+1$ にできる。$-1$ が 1 個だけ第 $i$ 成分（$i\neq1$）に残れば、$(1,i)$ 平面の行列 $\begin{pmatrix}\cos2\theta&\sin2\theta\\ \sin2\theta&-\cos2\theta\end{pmatrix}$（行列式 $-1$、$\theta\colon0\to\frac{\pi}{2}$）で $-1$ を第 1 成分に移せる。行列式の符号は道に沿って変わらないので、最後は $D_{\operatorname{sgn}\det B}$。
:::

## 写像度の計算 {#at:sec-sm-degree}

::: lemma 球面のウェッジとつぶし写像 {#at:pinch-wedge keywords="the reduced homology of a finite wedge of spheres is the direct sum via inclusions and projections; the pinch map S^n -> wedge of m spheres sends x to the sum of i_j x" index="つぶし写像|つぶししゃぞう, 球面のウェッジのホモロジー|きゅうめんのうぇっじのほもろじー"}
$W_{m}\defeq\bigvee_{j=1}^{m}\Sigma^{n}$（$m$ 個の $\Sigma^{n}$ の非交和で基点を 1 点に同一視）、$i_{j}\colon\Sigma^{n}\to W_{m}$ を第 $j$ 成分の包含、$p_{j}\colon W_{m}\to\Sigma^{n}$ を第 $j$ 成分以外を $\ast$ に潰す写像とする。$c_{m}\colon\Sigma^{n}\to W_{m}$ を、第 $j$ 板の上で $q(s)\mapsto i_{j}(q(ms_{1}-j+1,s'))$ とする（**つぶし写像**）。
1. $(i_{j*})_{j}\colon\bigoplus_{j}\tilde H_{k}(\Sigma^{n})\to\tilde H_{k}(W_{m})$ は同型で、逆写像は $(p_{j*})_{j}$。
2. $c_{m*}x=\sum_{j}i_{j*}x$（$x\in\tilde H_{n}(\Sigma^{n})$）。
:::

::: proof
**Step 1（1）.** $V\defeq q(\{s\mid\min_{i}\min(s_{i},1-s_{i})<\frac14\})$ は $\ast$ の開近傍で、$\partial I^{n}$ の方へ押し出す放射状のホモトピー（\ref{top:homotopy-on-quotient}）で $\ast$ に変位レトラクトするので、$(\Sigma^{n},\ast)$ は良い対。よって $(\bigsqcup_{j}\Sigma^{n},\bigsqcup_{j}\{\ast\})$ も良い対で、その商が $W_{m}$。\ref{at:good-pair} と、非交和の相対鎖複体が直和であることから
$$
\tilde H_{k}(W_{m})\cong H_{k}\Bigl(\bigsqcup_{j}\Sigma^{n},\bigsqcup_{j}\{\ast\}\Bigr)\cong\bigoplus_{j}H_{k}(\Sigma^{n},\ast)\cong\bigoplus_{j}\tilde H_{k}(\Sigma^{n})
$$
で、この同型は $(i_{j*})_{j}$ に一致する。$p_{j}i_{j}=1$、$p_{j}i_{k}$（$k\neq j$）は定値写像で $\tilde H$ に $0$ を誘導するので、$(p_{j*})$ は逆写像。

**Step 2（2）.** $p_{j}\circ c_{m}$ は、第 $j$ 板の上で $q(ms_{1}-j+1,s')$、他で $\ast$ となる写像を $q$ で割ったもの。第 $j$ 板 $[a,b]\times I^{n-1}$ を $[(1-t)a,(1-t)b+t]\times I^{n-1}$ に広げていく箱写像の族（\ref{at:box-map-homotopy.2}）で、恒等写像 $q$ と rel $\partial I^{n}$ でホモトープ。よって $p_{j*}c_{m*}=1$ で、1 から $c_{m*}x=\sum_{j}i_{j*}p_{j*}c_{m*}x=\sum_{j}i_{j*}x$。
:::

::: proposition 標準形の写像度 {#at:slab-degree keywords="the slab map S_epsilon has degree sum of epsilon_j; the reflection rho has degree -1; S_{(+,-)} is null-homotopic rel boundary" index="標準形の写像度|ひょうじゅんけいのしゃぞうど"}
1. $S_{(+1,-1)}$ は rel $\partial I^{n}$ で定値写像 $\ast$ とホモトープ。
2. $\bar\rho\colon\Sigma^{n}\to\Sigma^{n}$（$\rho$ の誘導写像）の写像度は $-1$。
3. $\deg S_{\varepsilon}=\sum_{j}\varepsilon_{j}$。
:::

::: proof
**Step 1（1）.** $S_{(+1,-1)}(s)=q(\min(2s_{1},2-2s_{1}),s')$。$H_{t}(s)\defeq q(\min(2s_{1},2-2s_{1},1-t),s')$ とおくと、$H$ は連続、$H_{0}=S_{(+1,-1)}$、$H_{1}\equiv q(0,s')=\ast$、$s\in\partial I^{n}$ では第 1 成分が $0$ か $s'\in\partial I^{n-1}$ なので $\ast$。

**Step 2（3 の公式）.** $\varepsilon$ に対して $g_{j}\defeq1$（$\varepsilon_{j}=1$）、$\bar\rho$（$\varepsilon_{j}=-1$）とし、$\nabla\colon W_{m}\to\Sigma^{n}$ を各成分で恒等とすると、定義から $\bar S_{\varepsilon}=\nabla\circ(g_{1}\vee\cdots\vee g_{m})\circ c_{m}$。\ref{at:pinch-wedge.2} から、$x\in\tilde H_{n}(\Sigma^{n})$ について
$$
\bar S_{\varepsilon*}x=\sum_{j}\nabla_{*}(g_{1}\vee\cdots\vee g_{m})_{*}i_{j*}x=\sum_{j}g_{j*}x.
$$

**Step 3（2・3）.** $\varepsilon=(+1,-1)$ に Step 2 を使うと $\bar S_{(+1,-1)*}=1+\bar\rho_{*}$。1 から左辺は定値写像の誘導写像で $0$。よって $\bar\rho_{*}=-1$、$\deg\bar\rho=-1$。Step 2 の式から $\deg S_{\varepsilon}=\#\{j\mid\varepsilon_{j}=1\}-\#\{j\mid\varepsilon_{j}=-1\}=\sum_{j}\varepsilon_{j}$。
:::

## 標準形への変形 {#at:sec-sm-normal}

::: lemma 箱の移動 {#at:box-moving keywords="for n >= 2 a box map is homotopic rel boundary to the slab map S_epsilon with epsilon_j = sign det B_j, in any order" index="箱の移動|はこのいどう"}
$n\ge2$ とし、$M$ を箱データ $(x_{j},B_{j})_{j=1}^{m}$ の箱写像で、各箱が $I^{n}$ の内部に含まれ互いに交わらないものとする。$\varepsilon_{j}\defeq\operatorname{sgn}\det B_{j}$ とおくと、任意の並べ替え $\sigma$ について $M\simeq S_{(\varepsilon_{\sigma(1)},\dots,\varepsilon_{\sigma(m)})}$（rel $\partial I^{n}$）。
:::

::: proof
以下のホモトピーはすべて、箱データの連続な族で箱どうしが交わらず $I^{n}$ の内部にあるものとして与え、\ref{at:box-map-homotopy.2} を使う。$P_{j}=x_{j}+B_{j}^{-1}([-\frac12,\frac12]^{n})$ は $x_{j}$ を中心とする凸な平行体で、$B_{j}$ を $\lambda B_{j}$（$\lambda\ge1$）に変えると $x_{j}$ を中心に $\frac1\lambda$ 倍に縮む。

**Step 1（縮小）.** 中心は相異なる（箱が交わらない）ので、$d_{0}\defeq$「中心どうしの距離と、中心から $\partial I^{n}$ への距離」の最小値 $>0$。$B_{j}(t)\defeq(1+t(\lambda-1))B_{j}$ で箱を中心のまわりに縮める（縮めた箱はもとの箱に含まれるので交わらない）。以下、必要に応じて同じ操作で箱の直径を任意に小さくする（Step 2 以降の各段階で、そこで使う距離の $\frac14$ 未満にする）。

**Step 2（第 1 座標を相異ならせる）.** 中心を $x_{j}+t\delta_{j}e_{1}$（$|\delta_{j}|<\frac{d_{0}}{8}$、第 1 座標が相異なるように選ぶ）と動かす。中心どうしの距離は $\frac{3d_{0}}{4}$ 以上、$\partial I^{n}$ への距離も $\frac{7d_{0}}{8}$ 以上に保たれ、箱の直径が $\frac{d_{0}}{4}$ 未満なら交わらない。

**Step 3（第 2 座標で段を分ける）.** $\gamma>0$ を第 1 座標の差の最小値とする。中心の第 2 座標以降を、第 1 座標を固定したまま、$\sigma$ に従って $\sigma^{-1}(j)$ 番目の高さ $(\frac{1}{4}+\frac{\sigma^{-1}(j)}{2m+2},\frac12,\dots,\frac12)$ へ直線で動かす。この間、第 1 座標の差が $\gamma$ 以上なので、箱の直径が $\frac{\gamma}{4}$ 未満なら交わらない。中心は $I^{n}$ の内部の線分上を動くので、境界への距離は端点での距離の小さい方以上。

**Step 4（第 1 座標を並べる）.** 第 2 座標の差が $\frac{1}{2m+2}$ 以上なので、箱の直径がその $\frac14$ 未満なら、第 1 座標を任意に動かしても交わらない。$j$ の中心の第 1 座標を $\frac{2\sigma^{-1}(j)-1}{2m}$ へ直線で動かす。続いて第 2 座標を、第 1 座標の差 $\frac1m$ を保ったまま $\frac12$ へ戻す。

**Step 5（線形部分）.** \ref{at:gl-path} の道で $B_{j}$ を $D_{\varepsilon_{j}}$ へ動かす。道 $B_{j}(t)$ はコンパクトなので $\sup_{t}\|B_{j}(t)^{-1}\|$ は有限で、あらかじめ全体を $\lambda$ 倍しておけば（Step 1 の縮小）、箱 $x_{j}+(\lambda B_{j}(t))^{-1}([-\frac12,\frac12]^{n})$ の直径は動かしている間ずっと $\frac{1}{4m}$ 未満にできる。終わりは $(x_{j},\lambda D_{\varepsilon_{j}})$、中心は $(\frac{2\sigma^{-1}(j)-1}{2m},c')$。

**Step 6（板へ広げる）.** $w_{1}(t)$ を $\frac1{2\lambda}$ から $\frac1{2m}$ へ、$w'(t)$ を $\frac1{2\lambda}$ から $\frac12$ へ直線で動かし、$B_{j}(t)\defeq D_{\varepsilon_{j}}\operatorname{diag}(\frac{1}{2w_{1}(t)},\frac{1}{2w'(t)},\dots,\frac{1}{2w'(t)})$ とする。箱は第 1 座標の幅 $2w_{1}(t)\le\frac1m$、他の座標の幅 $2w'(t)\le1$ の直方体で、内部は交わらず $I^{n}$ に含まれる（$t=1$ で境界が接する）。$t=1$ の箱写像は、$\sigma^{-1}(j)$ 番目の板の上で $q(c+D_{\varepsilon_{j}}\operatorname{diag}(m,1,\dots,1)(s-x_{j}))$ で、これは \ref{at:box-map.2} の $S_{(\varepsilon_{\sigma(1)},\dots,\varepsilon_{\sigma(m)})}$ に一致する。

::: hypcheck
- **$n\ge2$**：Step 3・4 で、第 2 座標を使って箱どうしをすれ違わせるのに使った。$n=1$ では箱は線分上に並び、順序を入れ替えられない（実際 $n=1$ でも結論は正しいが、別の議論（基本群）が要る）。
- 箱の向き $\varepsilon_{j}=\operatorname{sgn}\det B_{j}$ は Step 5 の $GL_{n}(\mathbb{R})$ の道で保たれる不変量である。
:::
:::

::: theorem 球面の写像の標準形 {#at:sphere-normal-form keywords="every map (I^n, boundary) -> (Sigma^n, base point) is homotopic rel boundary to a slab map S_epsilon" index="球面の写像の標準形|きゅうめんのしゃぞうのひょうじゅんけい"}
$n\ge1$ について、連続写像 $f\colon(I^{n},\partial I^{n})\to(\Sigma^{n},\ast)$ は、ある $\varepsilon$ について rel $\partial I^{n}$ で $S_{\varepsilon}$ とホモトープ。このとき $\deg f=\sum_{j}\varepsilon_{j}$。
:::

::: proof
**Step 1（$n=1$）.** $\Sigma^{1}\cong S^{1}$ で、$\pi_{1}(\Sigma^{1},\ast)\cong\mathbb{Z}$ は $[q]$ で生成される（\ref{at:fundamental-group-circle}）。$[f]=[q]^{d}$ とすると、$d\ge0$ なら $f\simeq S_{(+1,\dots,+1)}$（$d$ 個。$q$ を $d$ 回つないだ道を等分に径数付けたもの）、$d<0$ なら $S_{(-1,\dots,-1)}$（$q(1-s)$ は $[q]^{-1}$ を表す）。

**Step 2（$n\ge2$：近似）.** $\Psi\colon B_{1}=(-1,1)^{n}\to\Sigma^{n}\setminus\{\ast\}$, $\Psi(y)\defeq q(c+\frac{y}{2})$ は同相。$I^{n}=|T^{n}|$（\ref{at:subdivision-complex}）とみて \ref{at:pl-approximation} を $Y=\Sigma^{n}$, $e=\Sigma^{n}\setminus\{\ast\}$ に使う。$f(\partial I^{n})=\ast\notin e$ なのでホモトピーは rel $\partial I^{n}$ で、終わりの写像 $g$ について、4 から $p\in B_{1/4}$ で $g^{-1}(\Psi(p))=\{x_{1},\dots,x_{m}\}$ が有限、$x_{j}$ は $T^{n}$ の細分の $n$ 単体 $\tau_{j}$ の内部にあり、$L\restriction\tau_{j}$ は単射なアフィン写像 $L_{j}(s)=p+A_{j}(s-x_{j})$（$A_{j}\in GL_{n}(\mathbb{R})$）。2 から、$x_{j}$ の開近傍 $W_{j}\subset\mathring\tau_{j}$ で $g=\Psi\circ L_{j}$ となるものがあり、$W_{j}$ は互いに交わらないようにとれる。

**Step 3（つぶす）.** $\rho_{0}>0$ を次のように小さくとる：(i) $Q\defeq\{y\mid\|y-p\|\le\rho_{0}\}\subset B_{1/4}$；(ii) $g(I^{n}\setminus\bigcup_{j}W_{j})$ はコンパクトで $\Psi(p)$ を含まないので、$\Psi(Q)$ と交わらない；(iii) $L_{j}^{-1}(Q)=x_{j}+A_{j}^{-1}([-\rho_{0},\rho_{0}]^{n})\subset W_{j}$。すると $g^{-1}(\Psi(Q))=\bigsqcup_{j}L_{j}^{-1}(Q)$。$I^{n}$ の座標で $\Psi(Q)$ は中心 $a\defeq c+\frac{p}{2}$、半幅 $w\defeq\frac{\rho_{0}}{2}$ の立方体の像である。$a_{t}\defeq(1-t)a+tc$, $w_{t}\defeq(1-t)w+\frac{t}{2}$ とし、
$$
r_{t}(q(s))\defeq\begin{cases}q\bigl(c+\frac{s-a_{t}}{2w_{t}}\bigr)&(\|s-a_{t}\|\le w_{t})\\ \ast&(\text{それ以外})\end{cases}
$$
とおく（$\|a_{t}-c\|+w_{t}\le\frac12$ なので立方体は $I^{n}$ に含まれ、境界では両式とも $\ast$）。$r_{t}$ は \ref{top:homotopy-on-quotient} により $\Sigma^{n}\times I$ 上で連続、$r_{1}=1$、$r_{t}(\ast)=\ast$。よって $g\simeq r_{0}\circ g$（rel $\partial I^{n}$）。$s\in L_{j}^{-1}(Q)$ では $r_{0}(g(s))=r_{0}(\Psi(L_{j}(s)))=q\bigl(c+\frac{A_{j}(s-x_{j})}{2\rho_{0}}\bigr)$、他では $\ast$。すなわち $r_{0}\circ g$ は箱データ $(x_{j},\frac{1}{2\rho_{0}}A_{j})$ の箱写像で、箱は $I^{n}$ の内部にあり互いに交わらない。

**Step 4.** \ref{at:box-moving} から $r_{0}\circ g\simeq S_{\varepsilon}$。写像度はホモトピー不変（\ref{at:degree-properties}）なので、\ref{at:slab-degree.3} から $\deg f=\sum_{j}\varepsilon_{j}$。

::: hypcheck
- **$n\ge2$** は Step 2〜4（箱の移動）で使い、$n=1$ は基本群で別に扱った。
- **連続性だけ**を仮定し、滑らかさは使わない（区分的線形近似で正則な値を作った）。
:::
:::

::: theorem ホップの定理 {#at:hopf-degree-theorem keywords="Hopf theorem: two maps (I^n, boundary) -> (Sigma^n, base point) are homotopic rel boundary iff they have the same degree; two maps S^n -> S^n are homotopic iff they have the same degree" index="ホップの写像度定理|ほっぷのしゃぞうどていり, ホップの定理|ほっぷのていり"}
$n\ge1$ とする。
1. $f,g\colon(I^{n},\partial I^{n})\to(\Sigma^{n},\ast)$ について、$f\simeq g$（rel $\partial I^{n}$）$\iff\deg f=\deg g$。
2. 連続写像 $f,g\colon S^{n}\to S^{n}$ について、$f\simeq g\iff\deg f=\deg g$。
:::

::: proof
**Step 1（(⇒)）.** 写像度のホモトピー不変性（\ref{at:degree-properties}）。

**Step 2（並べ替えと打ち消し）.** $n\ge2$ とし、$d\defeq\deg f$ とする。標準形から $f\simeq S_{\varepsilon}$、$\sum\varepsilon_{j}=d$。\ref{at:box-moving}（$S_{\varepsilon}$ 自身を、第 1 座標方向に $\frac{1}{4m}$ 未満の幅に縮めてから適用する。縮める操作は Step 6 の逆向きの族）で、$\varepsilon$ を $(+1,\dots,+1,-1,\dots,-1)$ の順に並べ替えてよい。隣り合う $+1,-1$ の 2 枚の板の上では、写像は（その 2 枚を $I^{n}$ に広げて見ると）$S_{(+1,-1)}$ で、\ref{at:slab-degree.1} のホモトピーをその 2 枚の上で行う（2 枚の境界は各時刻で $\ast$ に写る）と、その 2 枚の上で $\ast$ になる。$\ast$ だけの板は、$s_{1}$ の区分的 1 次の付け替え $h_{t}$（$h_{0}$ はその板を潰し、$h_{1}=1$）による $S\circ(h_{t}\times1)$ で取り除ける。これを繰り返すと $f\simeq S_{(\mathrm{sgn}\,d,\dots,\mathrm{sgn}\,d)}$（$|d|$ 個、$d=0$ なら $S_{\varnothing}\equiv\ast$）。

**Step 3（1 の (⇐)）.** $n\ge2$ では Step 2 から $f,g$ はともに同じ写像とホモトープ。$n=1$ では $\deg$ は回転数に一致し（\ref{at:circle-h1-generator}）、$\pi_{1}(\Sigma^{1})\cong\mathbb{Z}$ の同型を与えるので、$[f]=[g]$。

**Step 4（2）.** $\Sigma^{n}\cong S^{n}$ で考える。$S^{n}$ の点 $y$ と基点 $y_{0}$ を含む平面の回転 $R^{y}_{t}$（$R^{y}_{0}=1$, $R^{y}_{1}(y)=y_{0}$）をとると、$R^{f(y_{0})}_{t}\circ f$ は $f$ と、基点を保つ写像 $f'$ を結ぶホモトピー。$f'\circ\pi'$（$\pi'\colon I^{n}\to\Sigma^{n}\cong S^{n}$ で $\partial I^{n}\mapsto y_{0}$）は 1 の形の写像で、$g$ についても同様。$\deg f'=\deg f=\deg g=\deg g'$ なら 1 から $f'\simeq g'$、よって $f\simeq g$。

::: hypcheck
- **写像度だけで分類できる**のは、標準形の箱がすべて同じ形（$\pm$ の向きだけが違う）で、$n\ge2$ では自由に並べ替えられるからである。
- 基点付き（1）と基点なし（2）の分類が一致するのは、$S^{n}$ が回転で等質だからである。
:::
:::

::: supplement
**一般化と関連する事実.**
- ホップの定理は、閉じた連結な向き付け可能 $n$ 次元多様体 $M$ から $S^{n}$ への写像のホモトピー類が写像度で分類されることへ一般化される（知られている。本サイト未収録）。向き付け不可能なら、写像度の代わりに $\mathbb{Z}/2$ 値の不変量で分類される。
- この結果は、高次ホモトピー群の言葉では $\pi_{n}(S^{n})\cong\mathbb{Z}$（写像度が同型）である（\ref[高次ホモトピー群]{at:page-homotopy-groups} で述べる）。標準形の計算は、一般のホモロジー理論で球面の自己写像が写像度倍で作用すること（\ref[アイレンバーグ–スティーンロッドの一意性定理]{at:eilenberg-steenrod-uniqueness}）の証明にも使う。

**前提を変えると.** 定義域の次元が値域より大きいと、写像度では分類できない：ホップ写像 $S^{3}\to S^{2}$ はホモロジーには自明に作用するが、定値写像とホモトープでない（\ref[ファイブレーション]{at:page-fibrations} で示す $\pi_{3}(S^{2})\cong\mathbb{Z}$）。標準形の議論が使えないのは、正則な値の逆像が点ではなく曲線（$\mathbb{R}^{3}$ の中の絡み目）になり、その「絡み方」が新しい不変量を生むからである。

**高い視点.** 標準形は、写像を「正則な値の逆像の点たちに、向き $\pm1$ を付けたもの」として読む見方である。微分位相幾何ではこれを枠付き同境（ポントリャーギン–トム構成）として一般化し、$\pi_{n+k}(S^{n})$ を $(n+k)$ 次元空間の中の枠付き $k$ 次元多様体の同境類として記述する（知られている）。比喩で言えば、球面の写像は「何枚の布を、表向きか裏向きかで重ねたか」の記録で、表と裏の 1 枚ずつは引き抜いて打ち消せるので、残るのは表の枚数と裏の枚数の差、すなわち写像度だけである。
:::

## 問題 {#at:sec-sm-problems}

::: problem {#at:prob-reflection-cube}
$\bar\rho\colon\Sigma^{n}\to\Sigma^{n}$ の写像度が $-1$ であることを、\ref{at:degree-reflection}（$S^{n}$ の鏡映の写像度）を使わずに示した \ref{at:slab-degree} の証明を振り返り、どの性質が本質的だったか述べよ。また $\bar\rho\circ\bar\rho=1$ と整合することを確かめよ。
:::

::: solution
本質的だったのは (a) $S_{(+1,-1)}$ が rel $\partial I^{n}$ で定値写像とホモトープであること（道とその逆の積が定値になるのと同じ式）と、(b) つぶし写像が $\tilde H_{n}$ で $x\mapsto\sum_{j}i_{j*}x$ を誘導すること（ウェッジのホモロジーの直和分解）。この二つから $1+\bar\rho_{*}=0$。$\bar\rho\circ\bar\rho=1$ から $(\deg\bar\rho)^{2}=1$ で、$\deg\bar\rho=-1$ と整合する。
:::

::: problem {#at:prob-degree-two-normal-form}
$n\ge2$ で、写像度 $2$ の写像 $f\colon(I^{n},\partial I^{n})\to(\Sigma^{n},\ast)$ の標準形が $S_{(+1,-1,+1,+1)}$ だったとする。\ref{at:hopf-degree-theorem} の証明の手順で、これが $S_{(+1,+1)}$ と rel $\partial I^{n}$ でホモトープになることを、手順ごとに述べよ。
:::

::: solution
(1) 箱の移動（\ref{at:box-moving}）で並べ替えて $S_{(+1,+1,+1,-1)}$。(2) 第 3・4 板（$+1,-1$）の上で \ref{at:slab-degree.1} のホモトピーを行い、その 2 枚を $\ast$ にする。(3) $s_{1}$ の付け替えで $\ast$ の 2 枚を取り除き、残りの 2 枚を $I^{n}$ 全体に広げて $S_{(+1,+1)}$。各段は rel $\partial I^{n}$ のホモトピーで、写像度 $2$ は保たれる。
:::
