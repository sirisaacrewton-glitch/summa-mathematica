# ジョルダン–ブラウワーの分離定理と領域不変性 {#at:page-jordan-brouwer keywords="compact supports of singular chains, homology of the complement of an embedded disk and of an embedded sphere, Jordan-Brouwer separation theorem, Jordan curve theorem, invariance of domain, no continuous injection R^m -> R^n for m > n"}

球面 $S^{n}$ に埋め込まれた円板の補集合はホモロジー的に自明で、埋め込まれた $k$ 次元球面の補集合は $S^{n-k-1}$ と同じホモロジーをもつ。埋め込みがどんなに複雑（フラクタル的な曲線や、アレクサンダーの角付き球面のような野性的な埋め込み）でも成り立つのが要点である。系として、$S^{n}$ の中の $(n-1)$ 次元球面は補集合をちょうど 2 つの成分に分け（**ジョルダン–ブラウワーの分離定理**。$n=2$ がジョルダンの曲線定理）、$\mathbb{R}^{n}$ の開集合からの連続単射の像は開である（**領域不変性**）。

> 資料：標準的な内容（Massey『Singular Homology Theory』の応用の章などにある）。マイヤー–ヴィートリスと区間の二分法を組み合わせる議論を、自分で書き下ろした。

## 記法と定義の確認 {#at:sec-jb-notation}

::: notation
- 特異ホモロジーと被約ホモロジー \ref{at:singular-homology}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}、球面のホモロジー \ref{at:sphere-homology}、ホモトピー不変性 \ref{at:singular-homotopy-invariance}、0 次ホモロジーと弧状連結成分 \ref{at:singular-h0-point}。
- 局所弧状連結な空間の弧状連結成分は開で連結成分と一致する（\ref{top:path-components-open}）。$S^{n}$ の開集合は局所弧状連結（球面は局所的に $\mathbb{R}^{n}$ と同相）。コンパクト空間からハウスドルフ空間への連続単射は像への同相写像（\ref{top:compact-to-hausdorff}）。
- 立体射影 $\sigma\colon S^{n}\setminus\{N\}\to\mathbb{R}^{n}$ は \ref{at:sphere-simply-connected} の Step 1。$|\sigma(x)|^{2}=\frac{1+x_{n+1}}{1-x_{n+1}}$ は $x_{n+1}$ について単調増加。
- 被約ホモロジーの約束：$\tilde H_{i}(\varnothing)=0$（$i\ge0$）。
- **選択公理**：使わない。
:::

## コンパクト台 {#at:sec-jb-compact}

::: lemma 鎖のコンパクト台 {#at:compact-support keywords="singular chains have compact support; a cycle that bounds in an increasing union of open sets bounds in one of them" index="コンパクト台|こんぱくとだい"}
$Y=\bigcup_{m}Y_{m}$ を開集合の増大列 $Y_{1}\subset Y_{2}\subset\cdots$ の和とする。$Y_{1}$ の（被約）サイクル $z$ が $Y$ で境界なら、ある $m$ で $Y_{m}$ の中の境界である。
:::

::: proof
$z=\partial c$（$c\in S(Y)$）とする。$c$ は有限個の特異単体の和で、その像の和 $K$ はコンパクト（$\Delta^{n}$ のコンパクト性）。$\{Y_{m}\}$ は $K$ の開被覆で増大列なので、有限部分被覆の最大の番号 $m$ で $K\subset Y_{m}$。$c\in S(Y_{m})$ で $z=\partial c$。
:::

## 埋め込まれた円板と球面の補集合 {#at:sec-jb-complements}

::: lemma 立方体と円板 {#at:cube-disk keywords="the cube [-1,1]^k is homeomorphic to the disk D^k; closed hemispheres are disks" index="立方体と円板|りっぽうたいとえんばん"}
1. $\varphi\colon[-1,1]^{k}\to D^{k}$, $\varphi(x)\defeq\frac{|x|_{\infty}}{|x|}x$（$x\ne0$）, $\varphi(0)=0$ は同相写像（$|x|_{\infty}=\max_{i}|x_{i}|$）。
2. 閉半球 $D_{\pm}\defeq\{x\in S^{k}:\pm x_{k+1}\ge0\}$ は $(x_{1},\dots,x_{k+1})\mapsto(x_{1},\dots,x_{k})$ で $D^{k}$ と同相で、$D_{+}\cap D_{-}=S^{k-1}\times\{0\}$。
:::

::: proof
1：$|\varphi(x)|=|x|_{\infty}$ なので値は $D^{k}$ に入り、$0$ で連続。$\psi(y)\defeq\frac{|y|}{|y|_{\infty}}y$（$\psi(0)=0$）について $|\psi(y)|_{\infty}=|y|$ で、$\psi\varphi(x)=\frac{|\varphi x|}{|\varphi x|_{\infty}}\varphi(x)=\frac{|x|_{\infty}}{(|x|_{\infty}/|x|)|x|_{\infty}}\cdot\frac{|x|_{\infty}}{|x|}x=x$、同様に $\varphi\psi=1$。2：逆写像 $y\mapsto(y,\pm\sqrt{1-|y|^{2}})$ は連続。
:::

::: theorem 埋め込まれた円板の補集合 {#at:complement-disk keywords="the complement of an embedded k-disk in S^n has trivial reduced homology" index="埋め込まれた円板の補集合|うめこまれたえんばんのほしゅうごう"}
$h\colon D^{k}\to S^{n}$ が連続単射（したがって埋め込み）なら、すべての $i$ で $\tilde H_{i}(S^{n}\setminus h(D^{k}))=0$。
:::

::: proof
\ref{at:cube-disk} から $D^{k}$ を $I^{k}=I^{k-1}\times I$ に替えてよい。$k$ についての帰納法。

**Step 1（$k=0$）.** $S^{n}$ から 1 点を除いたものは $\mathbb{R}^{n}$ と同相で可縮。

**Step 2（記号）.** $k\ge1$ とし、閉区間 $J\subset I$ について $X_{J}\defeq S^{n}\setminus h(I^{k-1}\times J)$ とおく（コンパクト集合の像は閉なので開集合）。ある $i$ で $0\ne\alpha\in\tilde H_{i}(X_{I})$ があるとして矛盾を導く。

**Step 3（二分）.** $J=[a,b]$、$t\defeq\frac{a+b}{2}$、$J_{1}\defeq[a,t]$, $J_{2}\defeq[t,b]$ とすると、$h$ の単射性から $X_{J_{1}}\cap X_{J_{2}}=X_{J}$, $X_{J_{1}}\cup X_{J_{2}}=S^{n}\setminus h(I^{k-1}\times\{t\})$。$\alpha$ の像が $\tilde H_{i}(X_{J})$ で $0$ でないなら $X_{J}\ne\varnothing$ で、被約マイヤー–ヴィートリス
$$
\tilde H_{i+1}(X_{J_{1}}\cup X_{J_{2}})\to\tilde H_{i}(X_{J})\to\tilde H_{i}(X_{J_{1}})\oplus\tilde H_{i}(X_{J_{2}})
$$
の左端は帰納法の仮定（$I^{k-1}\times\{t\}\cong I^{k-1}$ の埋め込み）で $0$。よって $\alpha$ の像は $X_{J_{1}}$ か $X_{J_{2}}$ で $0$ でない。

**Step 4（縮小列）.** Step 3 を繰り返し、長さ $2^{-m}$ の閉区間の減少列 $I=J_{(0)}\supset J_{(1)}\supset\cdots$ で、$\alpha$ の像が各 $\tilde H_{i}(X_{J_{(m)}})$ で $0$ でないものを得る（各段で「$J_{1}$ で $0$ でなければ $J_{1}$、そうでなければ $J_{2}$」と決める）。$\bigcap J_{(m)}=\{p\}$。

**Step 5（極限）.** $Y\defeq S^{n}\setminus h(I^{k-1}\times\{p\})$ は増大列 $X_{J_{(m)}}$ の和：$x\notin X_{J_{(m)}}$ がすべての $m$ で成り立てば $x\in\bigcap_{m}h(I^{k-1}\times J_{(m)})=h(I^{k-1}\times\{p\})$（$h$ の単射性）。帰納法の仮定から $\tilde H_{i}(Y)=0$ なので、$\alpha$ を代表する（被約）サイクルは $Y$ で境界で、\ref{at:compact-support} からある $X_{J_{(m)}}$ で境界。これは Step 4 に反する。

::: hypcheck
- **単射性**：Step 3（共通部分と和の計算）と Step 5 に使った。
- **連続性**：像がコンパクト（したがって閉）であることと、$X_{J}$ が開であること（マイヤー–ヴィートリスに必要）に使った。
- 円板の次元 $k$ は $n$ 以下でも以上でもよい（$k>n$ の連続単射 $D^{k}\to S^{n}$ は存在しないことが後で分かる：\ref{at:no-injection-higher}）。
:::
:::

::: theorem 埋め込まれた球面の補集合 {#at:complement-sphere keywords="the complement of an embedded k-sphere in S^n (k < n) has the homology of S^{n-k-1}" index="埋め込まれた球面の補集合|うめこまれたきゅうめんのほしゅうごう"}
$0\le k<n$ で $h\colon S^{k}\to S^{n}$ が連続単射なら、$\tilde H_{i}(S^{n}\setminus h(S^{k}))\cong\mathbb{Z}$（$i=n-k-1$）、$0$（それ以外）。
:::

::: proof
**Step 1（$k=0$）.** $S^{n}$ から 2 点を除いたものは $\mathbb{R}^{n}$ から 1 点を除いたものと同相で、$S^{n-1}$ とホモトピー同値。\ref{at:sphere-homology}。

**Step 2（$k\ge1$）.** $A\defeq S^{n}\setminus h(D_{+})$, $B\defeq S^{n}\setminus h(D_{-})$（\ref{at:cube-disk} の 2）は開で、\ref{at:complement-disk} から $\tilde H_{*}(A)=\tilde H_{*}(B)=0$。$h$ の単射性から $A\cap B=S^{n}\setminus h(S^{k})$、$A\cup B=S^{n}\setminus h(S^{k-1})$。

**Step 3（$A\cap B\ne\varnothing$）.** 空なら $A\cup B=A\sqcup B$（開集合の非交和）で、$H_{j}(A\cup B)=H_{j}(A)\oplus H_{j}(B)=0$（$j\ge1$）。ところが帰納法の仮定で $\tilde H_{n-k}(A\cup B)\cong\mathbb{Z}$（$n-k\ge1$）。矛盾。

**Step 4.** 被約マイヤー–ヴィートリスで $\partial_{*}\colon\tilde H_{i+1}(A\cup B)\cong\tilde H_{i}(A\cap B)$。帰納法の仮定から左辺は $i+1=n-(k-1)-1$、すなわち $i=n-k-1$ のときだけ $\mathbb{Z}$。
:::

## 分離定理と領域不変性 {#at:sec-jb-applications}

::: theorem ジョルダン–ブラウワーの分離定理 {#at:jordan-brouwer keywords="an embedded (n-1)-sphere separates S^n into exactly two components, each open with boundary the sphere" index="ジョルダン–ブラウワーの分離定理|じょるだんぶらうわーのぶんりていり, ジョルダンの曲線定理|じょるだんのきょくせんていり"}
$n\ge1$ で $h\colon S^{n-1}\to S^{n}$ が連続単射なら、$S^{n}\setminus h(S^{n-1})$ はちょうど 2 つの連結成分 $U,V$ をもち、$U,V$ は開で弧状連結、それぞれの境界は $h(S^{n-1})$ に一致する。
:::

::: proof
**Step 1（2 成分）.** \ref{at:complement-sphere}（$k=n-1$, $i=0$）で $\tilde H_{0}\cong\mathbb{Z}$、よって $H_{0}\cong\mathbb{Z}^{2}$ で、弧状連結成分はちょうど 2 つ（\ref{at:singular-h0-point}）。$S^{n}\setminus h(S^{n-1})$ は開集合で局所弧状連結なので、弧状連結成分 $U,V$ は開で、連結成分と一致する（\ref{top:path-components-open}）。

**Step 2（境界は $C$ に含まれる）.** $C\defeq h(S^{n-1})$。$V$ は開で $U$ と交わらないので $\overline{U}\cap V=\varnothing$、よって $\partial U=\overline{U}\setminus U\subset C$。$V$ も同様。

**Step 3（$C$ の各点は両方の閉包に入る）.** $x=h(y)\in C$ とその開近傍 $W$ をとる。$y$ の周りの閉じた帽子 $D\defeq\{z\in S^{n-1}:\langle z,y\rangle\ge1-\varepsilon\}$ を、$h(D)\subset W$ となるよう小さくとる（$h^{-1}(W)$ は $y$ の開近傍）。$S^{n-1}\setminus\operatorname{int}D=\{\langle z,y\rangle\le1-\varepsilon\}$ は、$y$ からの立体射影で閉球に写る（$|\sigma(z)|^{2}$ は $\langle z,y\rangle$ について単調）ので $D^{n-1}$ と同相（$n=1$ では 1 点）。\ref{at:complement-disk} から $S^{n}\setminus h(S^{n-1}\setminus\operatorname{int}D)$ は弧状連結。$u\in U$, $v\in V$ をこの集合の中の道 $\gamma$ で結ぶ。$U$ と $V$ は $S^{n}\setminus C$ の異なる成分なので $\gamma$ は $C$ と交わり、$t_{0}\defeq\min\gamma^{-1}(C)>0$ とすると $\gamma([0,t_{0}))$ は $S^{n}\setminus C$ の連結集合で $u$ を含むので $U$ に入り、$\gamma(t_{0})\in\overline{U}$。$\gamma$ は $h(S^{n-1}\setminus\operatorname{int}D)$ を避けるので $\gamma(t_{0})\in C\setminus h(S^{n-1}\setminus\operatorname{int}D)=h(\operatorname{int}D)\subset W$。$W$ は開なので $\gamma(t_{0})$ の近傍で、$W\cap U\ne\varnothing$。同様に（$v$ から逆にたどって）$W\cap V\ne\varnothing$。よって $x\in\overline{U}\cap\overline{V}$。

::: hypcheck
- 単射性は \ref{at:complement-sphere} と Step 3（$C\setminus h(S^{n-1}\setminus\operatorname{int}D)=h(\operatorname{int}D)$）に使った。単射でない閉曲線（8 の字など）は 3 つ以上の成分を作りうる。
- 分離される 2 成分がそれぞれ「円板と同相」とは限らない：$n=2$ では成り立つ（シェーンフリースの定理として知られている）が、$n=3$ ではアレクサンダーの角付き球面の外側の成分は単連結でないことが知られている（本サイト未収録）。ホモロジーが見ているのは成分の数と、各成分の（被約）ホモロジーが $0$ であること（\ref{at:complement-disk} の議論を成分ごとに）までである。
:::
:::

::: corollary ジョルダンの曲線定理 {#at:jordan-curve keywords="a simple closed curve in the plane separates it into a bounded and an unbounded component, with the curve as common boundary" index="ジョルダンの曲線定理（平面）|じょるだんのきょくせんていりへいめん"}
平面の単純閉曲線（連続単射 $S^{1}\to\mathbb{R}^{2}$ の像）$C$ について、$\mathbb{R}^{2}\setminus C$ はちょうど 2 つの連結成分をもち、一方は有界、他方は非有界で、どちらの境界も $C$ である。
:::

::: proof
$\mathbb{R}^{2}=S^{2}\setminus\{N\}$（立体射影の逆）と見る。$S^{2}\setminus C$ の成分 $U\ni N$ と $V$ について、$\mathbb{R}^{2}\setminus C=(U\setminus\{N\})\sqcup V$。$U\setminus\{N\}$ は弧状連結：$a,b\in U\setminus\{N\}$ を $U$ の道 $\gamma$ で結ぶ（$U$ は弧状連結）。$N$ を中心とする閉円板 $B'$（$S$ からの立体射影の座標で）を、$B'\subset U$ かつ $a,b\notin B'$ となるようにとる。$\gamma$ が $B'$ と交わるなら、最初に $B'$ に入る時刻 $t_{1}$ と最後に出る時刻 $t_{2}$ について $\gamma(t_{1}),\gamma(t_{2})$ は $B'$ の境界の円周上にあり、$\gamma\restriction[t_{1},t_{2}]$ を円周に沿う道に取り替えれば $N$ を避ける道が得られる。$N$ の近傍は $\mathbb{R}^{2}$ の有界集合の補集合に対応するので、$U\setminus\{N\}$ は非有界、$V$ は $N$ の近傍と交わらない（$N\in U$ は開）ので有界。境界は定理から。
:::

::: theorem 領域不変性 {#at:invariance-of-domain keywords="invariance of domain: a continuous injection from an open subset of R^n to R^n is open, hence an embedding" index="領域不変性|りょういきふへんせい"}
$U\subset\mathbb{R}^{n}$ が開集合で $h\colon U\to\mathbb{R}^{n}$ が連続単射なら、$h(U)$ は開で、$h$ は $U$ から $h(U)$ への同相写像。
:::

::: proof
**Step 1.** $\mathbb{R}^{n}$ を $S^{n}\setminus\{N\}$ と同一視する（$S^{n}$ の開集合）。$x\in U$ と、$U$ に含まれる閉球 $D$（中心 $x$）とその境界 $S$ をとる。$h\restriction D$ は $D\cong D^{n}$ から $S^{n}$ への連続単射。

**Step 2.** \ref{at:jordan-brouwer} から $S^{n}\setminus h(S)$ はちょうど 2 つの成分 $P,Q$ をもつ。$S^{n}\setminus h(S)=h(\operatorname{int}D)\sqcup(S^{n}\setminus h(D))$（$h$ の単射性）。$h(\operatorname{int}D)$ は連結（連結集合の連続像）で空でない。$S^{n}\setminus h(D)$ は \ref{at:complement-disk} から弧状連結で、$N$ を含むので空でない。

**Step 3.** 連結集合はどれか 1 つの成分に含まれる。2 つとも同じ成分（たとえば $P$）に入ると $Q=\varnothing$ となり矛盾なので、$h(\operatorname{int}D)=P$（あるいは $Q$）。成分は開なので $h(\operatorname{int}D)$ は $S^{n}$ の開集合で、$h(x)$ を含み $h(U)$ に含まれる。よって $h(U)$ は開。

**Step 4.** $U$ の開部分集合に同じ議論を使うと $h$ は開写像で、連続な開単射は像への同相写像。

::: hypcheck
- **次元が同じ**：Step 1（$S$ が $S^{n-1}$ と同相で、分離定理が使えること）に使った。次元が違うと偽：$\mathbb{R}\to\mathbb{R}^{2}$, $t\mapsto(t,0)$ は連続単射だが像は開でない。
- **単射**：Step 2 の分解に使った。外すと偽（$\mathbb{R}\to\mathbb{R}$, $x\mapsto x^{2}$ の像 $[0,\infty)$ は開でない）。
:::
:::

::: corollary 高次元からの単射の非存在 {#at:no-injection-higher keywords="there is no continuous injection from R^m (or from a nonempty open subset) to R^n for m > n" index="連続単射の非存在|れんぞくたんしゃのひそんざい"}
$m>n$ なら、$\mathbb{R}^{m}$ の空でない開集合から $\mathbb{R}^{n}$ への連続単射は存在しない。
:::

::: proof
$h\colon U\to\mathbb{R}^{n}$ が連続単射なら、$\mathbb{R}^{n}=\mathbb{R}^{n}\times\{0\}\subset\mathbb{R}^{m}$ と合成した $U\to\mathbb{R}^{m}$ も連続単射で、領域不変性からその像は $\mathbb{R}^{m}$ で開。しかし像は $\mathbb{R}^{n}\times\{0\}$ に含まれ、空でない開集合を含まない（$m>n$）。
:::

::: supplement
**一般化.** 領域不変性から、境界付き多様体の境界点と内点が位相的に区別されること（「境界の不変性」）が従う（多様体論の系列で扱う予定）。補集合のホモロジーの計算は、アレクサンダー双対性 $\tilde H_{i}(S^{n}\setminus K)\cong\check H^{n-i-1}(K)$（$K$ はコンパクトで局所可縮とは限らない。右辺はチェックコホモロジー）に一般化されることが知られている（\ref[チェックコホモロジー・層コホモロジーとの一致]{at:page-cech-comparison} を参照。本サイト未収録）。$K$ が円板・球面なら右辺は特異コホモロジーと一致し、上の 2 定理を再現する。

**高い視点.** 二分法の議論（Step 3〜5）は、「ホモロジーの元は有限の情報（コンパクトな台）で決まる」こと（\ref{at:compact-support}：ホモロジーは開集合の増大列の余極限と交換する）と、マイヤー–ヴィートリスによる「局所から大域へ」の貼り合わせを組み合わせたものである。比喩で言えば、埋め込まれた円板は「どんなにくしゃくしゃに押し込んでも、周りの空間に穴を開けられない紙片」で、球面は「ちょうど 1 つの次元の穴を囲む膜」である。
:::

## 問題 {#at:sec-jb-problems}

::: problem {#at:prob-circle-in-s3}
$S^{3}$ に埋め込まれた円周 $C$（結び目）の補集合について、$H_{1}(S^{3}\setminus C)\cong\mathbb{Z}$, $\tilde H_{i}(S^{3}\setminus C)=0$（$i\ne1$）を示せ。（基本群は結び目ごとに異なりうるが、ホモロジーは結び目を区別しない。）
:::

::: solution
\ref{at:complement-sphere} で $n=3$, $k=1$：$n-k-1=1$。
:::

::: problem {#at:prob-sphere-no-embedding}
$n\ge1$ のとき、$S^{n}$ は $\mathbb{R}^{n}$ に埋め込めない（連続単射 $S^{n}\to\mathbb{R}^{n}$ はない）ことを示せ。
:::

::: solution
連続単射 $f\colon S^{n}\to\mathbb{R}^{n}$ があるとする。上半球の内部 $\{x_{n+1}>0\}$ は $\mathbb{R}^{n}$ の開集合（開球）と同相なので、領域不変性から $f(S^{n})$ の中で $f(\{x_{n+1}>0\})$ は $\mathbb{R}^{n}$ の開集合。同様に任意の点の周りで $f$ は開写像なので $f(S^{n})$ は $\mathbb{R}^{n}$ の開集合で、コンパクトなので閉。$\mathbb{R}^{n}$ は連結なので $f(S^{n})=\mathbb{R}^{n}$ となり、コンパクトでない $\mathbb{R}^{n}$ に反する。
:::
