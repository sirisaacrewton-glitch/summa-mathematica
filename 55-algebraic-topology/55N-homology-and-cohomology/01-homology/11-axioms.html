# アイレンバーグ–スティーンロッドの公理と一意性 {#at:page-homology-axioms keywords="Eilenberg-Steenrod axioms, homology theory, dimension axiom, additivity axiom, homology with coefficients, comparison theorem for natural transformations of homology theories on finite CW pairs, uniqueness of homology on CW complexes, universal coefficient theorem for homology, Tor, homology of RP^n with Z/2 coefficients, extraordinary homology theories"}

これまでに示した特異ホモロジーの性質（関手性・長完全列・ホモトピー不変性・切除・1 点の値）を公理として抜き出したものが**アイレンバーグ–スティーンロッドの公理**である。このページの主結果は、**二つのホモロジー理論の間の自然変換が 1 点で同型なら、すべての有限 CW 対で同型**という比較定理である。単体的・胞体・特異ホモロジーの一致は、この定理の具体例として理解でき、コホモロジー版（\ref[チェックコホモロジー・層コホモロジーとの一致]{at:page-cech-comparison}）では、チェック・層・特異コホモロジーが CW 複体の上で一致することの骨組みになる。後半では係数付きホモロジーと**普遍係数定理**を示す。

> 資料：公理系は Eilenberg–Steenrod『Foundations of Algebraic Topology』(1952) による（本の内容は直接は参照していない）。比較定理と一意性定理の証明は、骨格の帰納法・胞体近似・球面の写像の標準形（\ref{at:page-sphere-maps}）を使う形に自分で書き下ろした。普遍係数定理は標準的な議論。

## 記法と定義の確認 {#at:sec-ax-notation}

::: notation
- 特異ホモロジーの性質：長完全列 \ref{at:pair-long-exact}、ホモトピー不変性 \ref{at:singular-homotopy-invariance}, \ref{at:relative-homotopy-invariance}、切除 \ref{at:excision}、1 点 \ref{at:singular-h0-point}。CW 複体と骨格 \ref{at:cw-complex}, \ref{at:skeleton-pairs}。
- 五項補題 \ref{ha:five-lemma}、テンソル積の右完全性 \ref{ha:tensor-right-exact}、Tor とその性質 \ref{ha:tor}, \ref{ha:tor-basic}, \ref{ha:tor-z}。PID 上の自由加群の部分加群は自由（\ref{mod:pid-submodule-free}）。
- 空間対 $(X,A)$ と対の写像の圏で考える。$(X,\varnothing)$ を $X$ と書く。
- **選択公理**：普遍係数定理の分裂（Step 4）以外では使わない。分裂は自由加群の部分加群が自由であることを使い、無限生成の場合はそこで選択公理を使う（\ref{mod:pid-submodule-free} の注意）。
:::

## 公理 {#at:sec-ax-axioms}

::: definition ホモロジー理論 {#at:homology-theory keywords="Eilenberg-Steenrod axioms for a homology theory: functoriality, natural boundary, exactness, homotopy, excision, dimension, additivity; coefficient group" index="ホモロジー理論|ほもろじーりろん, アイレンバーグ–スティーンロッドの公理|あいれんばーぐすてぃーんろっどのこうり, 次元公理|じげんこうり, 加法性公理|かほうせいこうり, 係数群|けいすうぐん"}
**ホモロジー理論** $h$ とは、空間対の圏からアーベル群の圏への関手の族 $h_{n}$（$n\in\mathbb{Z}$）と、自然変換 $\partial\colon h_{n}(X,A)\to h_{n-1}(A)$ の組で、次を満たすものをいう。
1. **（完全性）** $\cdots\to h_{n}(A)\to h_{n}(X)\to h_{n}(X,A)\xrightarrow{\partial}h_{n-1}(A)\to\cdots$ は完全。
2. **（ホモトピー）** 対の写像として（各時刻で $A$ を $B$ に写す）ホモトープな写像は同じ準同型を誘導する。
3. **（切除）** $\overline{Z}\subset\operatorname{int}A$ なら、包含 $(X\setminus Z,A\setminus Z)\to(X,A)$ は同型を誘導する。
4. **（加法性）** 非交和 $X=\bigsqcup_{\lambda}X_{\lambda}$ について、包含の誘導写像の和 $\bigoplus_{\lambda}h_{n}(X_{\lambda})\to h_{n}(X)$ は同型。
さらに **（次元）** $n\ne0$ で $h_{n}(\ast)=0$ を満たすとき通常のホモロジー理論といい、$G\defeq h_{0}(\ast)$ を**係数群**という。
:::

::: example
1. 特異ホモロジー $H_{*}$ は係数群 $\mathbb{Z}$ の通常のホモロジー理論（完全性 \ref{at:pair-long-exact}、ホモトピー \ref{at:relative-homotopy-invariance}、切除 \ref{at:excision}、加法性は特異単体の像が弧状連結であることから \ref{at:singular-h0-point} の 1 と同じ議論、次元 \ref{at:singular-h0-point} の 3）。
2. 次元公理を除いたもの（**一般ホモロジー理論**、extraordinary）には、安定ホモトピー、K ホモロジー、ボルディズムなどがあることが知られている（本サイト未収録）。
:::

::: proposition 係数付きホモロジー {#at:homology-coefficients keywords="singular homology with coefficients in G: H_n(X,A;G) = H_n(S(X,A) (x) G); it is an ordinary homology theory with coefficient group G" index="係数付きホモロジー|けいすうつきほもろじー"}
アーベル群 $G$ について $H_{n}(X,A;G)\defeq H_{n}(S(X,A)\otimes G)$ とおくと、$H_{*}(-;G)$ は係数群 $G$ の通常のホモロジー理論である。
:::

::: proof
**Step 1（完全性）.** $0\to S(A)\to S(X)\to S(X,A)\to0$ は各次数で分裂する（$S_{n}(X,A)$ は自由）ので、$\otimes G$ しても短完全（分裂完全列は加法的関手で保たれる）。長完全列（\ref{ha:long-exact-sequence}）。

**Step 2（ホモトピー・切除）.** プリズム作用素 $P$ と細分の作用素 $S,T,D_{m}$ はすべて自然な鎖写像・鎖ホモトピーなので、$\otimes G$ しても同じ恒等式を満たす。\ref{at:singular-homotopy-invariance}, \ref{at:small-simplices}, \ref{at:excision} の証明はそのまま通る（\ref{at:small-simplices} の Step 4・5 では、鎖 $\sum c_{i}\otimes g_{i}$ の各 $c_{i}$ について $m$ を選ぶ）。

**Step 3（加法性・次元）.** $S(\bigsqcup X_{\lambda})=\bigoplus S(X_{\lambda})$ で、$\otimes G$ と $H$ は直和と可換。1 点の鎖複体は $\cdots\xrightarrow{1}\mathbb{Z}\xrightarrow{0}\mathbb{Z}$ で、$\otimes G$ すると $\cdots\xrightarrow{1}G\xrightarrow{0}G$。
:::

## 比較定理 {#at:sec-ax-comparison}

::: theorem ホモロジー理論の比較定理 {#at:comparison-theorem keywords="a natural transformation of homology theories commuting with boundary maps that is an isomorphism on a point is an isomorphism on all finite CW pairs" index="ホモロジー理論の比較定理|ほもろじーりろんのひかくていり"}
$h,k$ をホモロジー理論（次元公理は仮定しない）、$\tau\colon h_{n}\to k_{n}$ を自然変換で $\partial$ と可換（$\partial\tau=\tau\partial$）なものとする。すべての $n$ で $\tau\colon h_{n}(\ast)\to k_{n}(\ast)$ が同型なら、すべての有限 CW 対 $(X,A)$（$A$ は部分複体）とすべての $n$ で $\tau\colon h_{n}(X,A)\to k_{n}(X,A)$ は同型。
:::

::: intuition
ホモロジー理論は、1 点の値から「胞体を 1 枚ずつ貼る」操作で決まっていく。各段で起きることは長完全列と切除だけで記述されるので、1 点で一致する理論は、胞体を貼るたびに五項補題で一致が受け継がれる。
:::

::: proof
以下、「$\tau$ が対 $(X,A)$ で同型」を「$(X,A)$ で同型」と略す。$\tau$ は自然で $\partial$ と可換なので、対の長完全列どうしの可換図式を与え、五項補題（\ref{ha:five-lemma}）から：(i) $A$ と $X$ で同型なら $(X,A)$ で同型、(ii) $A$ と $(X,A)$ で同型なら $X$ で同型。

**Step 1（可縮な空間と有限個の点）.** 可縮な $X$ では $X\to\ast$ と $\ast\to X$ が互いのホモトピー逆写像で、ホモトピー公理から $h(X)\cong h(\ast)$ と自然に同型。よって可縮な空間で同型。有限個の点の集合では加法性から同型。

**Step 2（円板と球面）.** $k$ についての帰納法で「$S^{k-1}$, $(D^{k},S^{k-1})$, $S^{k}$ で同型」を示す。$S^{-1}=\varnothing$, $S^{0}$ は 2 点。$S^{k-1}$ で同型と仮定すると、$D^{k}$ は可縮なので (i) から $(D^{k},S^{k-1})$ で同型。$S^{k}$ について：$Z\defeq\{x_{k+1}<-\frac12\}$ は $\overline{Z}\subset\operatorname{int}D_{-}=\{x_{k+1}<0\}$ を満たし、切除で $(S^{k}\setminus Z,D_{-}\setminus Z)\to(S^{k},D_{-})$ は両理論で同型。$(S^{k}\setminus Z,D_{-}\setminus Z)=(\{x_{k+1}\ge-\frac12\},\{-\frac12\le x_{k+1}\le0\})$ は、$x_{k+1}$ 座標を $\max(x_{k+1},0)$ の方へ動かして正規化するホモトピーで $(D_{+},S^{k-1})$ と対としてホモトピー同値。よって $(D_{+},S^{k-1})\cong(D^{k},S^{k-1})$ で同型なことから $(S^{k},D_{-})$ で同型。$D_{-}$ は可縮なので (ii) から $S^{k}$ で同型。

**Step 3（骨格の対）.** 有限 CW 複体 $X$ の $n$ 胞体を $e_{1},\dots,e_{r}$、中心を $c_{i}$ とし、$W\defeq X^{n}\setminus\{c_{1},\dots,c_{r}\}$ とする。次の自然な同型の列で、$(X^{n},X^{n-1})$ を $\bigsqcup_{i}(D^{n},S^{n-1})$ に結びつける：
- $(X^{n},X^{n-1})\to(X^{n},W)$：$X^{n-1}\to W$ はホモトピー同値（\ref{at:skeleton-pairs} の 1）で、$X^{n}\to X^{n}$ は恒等なので、五項補題で同型。
- $(X^{n}\setminus X^{n-1},W\setminus X^{n-1})\to(X^{n},W)$：$Z=X^{n-1}$ は閉で $W$（開）に含まれるので切除。
- $X^{n}\setminus X^{n-1}=\bigsqcup_{i}e_{i}$ は特性写像で $\bigsqcup_{i}\mathring D^{n}$ と同相（開で飽和した集合への商写像の制限）、$W\setminus X^{n-1}$ は $\bigsqcup_{i}(\mathring D^{n}\setminus\{0\})$ に対応。加法性で各 $i$ に分かれる。
- $(\mathring D^{n},\mathring D^{n}\setminus\{0\})\to(D^{n},D^{n}\setminus\{0\})$ は切除（$Z=S^{n-1}$ は $D^{n}\setminus\{0\}$ の内部に含まれる閉集合）、$(D^{n},S^{n-1})\to(D^{n},D^{n}\setminus\{0\})$ は五項補題（$S^{n-1}\to D^{n}\setminus\{0\}$ はホモトピー同値）。
これらはすべて連続写像の誘導写像なので $\tau$ と可換で、Step 2 から $(X^{n},X^{n-1})$ で同型。

**Step 4（骨格の帰納法）.** $X^{0}$ は有限個の点なので同型（Step 1）。$X^{n-1}$ と $(X^{n},X^{n-1})$ で同型なら (ii) から $X^{n}$ で同型。$X$ は有限なので $X=X^{N}$ で同型。部分複体 $A$ についても同型なので、(i) から $(X,A)$ で同型。

::: hypcheck
- **有限性**：Step 3 の加法性（有限和なら完全性と切除から導けるが、ここでは公理として使った）と Step 4 の帰納法の終了に使った。無限 CW 複体では、加法性に加えて「ホモロジーが骨格の余極限と可換」が必要になる（特異ホモロジーではコンパクト台の議論で成り立つ）。
- **$\partial$ との可換性**：五項補題を適用するために、長完全列の間の写像であることが要る。
- 次元公理は使わなかった：一般ホモロジー理論でも成り立つ。
:::
:::

::: example 比較定理の使い方
1. 有限 Δ 複体の単体的ホモロジーは空間対の関手ではないので、\ref{at:simplicial-singular-iso} はこの定理の形には直接は入らないが、証明（骨格の帰納法と五項補題）は同じ構造をしている。
2. 係数群の準同型 $\phi\colon G\to G'$ が誘導する $H_{*}(-;G)\to H_{*}(-;G')$ は、$\phi$ が同型なら有限 CW 対で同型（ここでは自明）。
3. コホモロジー版（すべての矢印を逆向きにし、加法性を直積にしたもの）も同じ証明で成り立つ。チェックコホモロジーや層コホモロジーから特異コホモロジーへの自然な比較写像が 1 点で同型であることと、それらが（CW 複体の上で）公理を満たすことを示せば、一致が従う（\ref[チェックコホモロジー・層コホモロジーとの一致]{at:page-cech-comparison}）。
:::


::: supplement
**一致しない例.** 比較定理と一意性定理は CW 複体（または局所的に良い空間）に限った主張である。一般の空間では、公理の一部しか満たさない理論（チェックホモロジーは一般には完全性を満たさない）や、加法性・連続性の違いによって、ホモロジー理論ごとに値が異なる。具体例（ワルシャワの円、カントール集合、ハワイの耳飾り）は \ref[ホモロジー理論が一致しない空間]{at:page-homology-counterexamples} で扱う。

**高い視点.** 公理は「位相空間の圏から、ホモトピーと切除を尊重して、長完全列を出力する関手」を特徴づける。現代的には、ホモロジー理論はスペクトラム（安定ホモトピー論の対象）と対応し、通常のホモロジー理論はアイレンバーグ–マクレーンスペクトラム $HG$ に対応することが知られている（ブラウンの表現定理。本サイト未収録）。比喩で言えば、公理は「物差しの規格」で、規格に合う物差しは、標準の長さ（1 点の値）を決めると、CW 複体という「規格品の部品で組み立てた物」の上では目盛りが完全に決まってしまう。
:::

## 一意性定理 {#at:sec-ax-uniqueness}

以下、$h$ をホモロジー理論とし、空でない空間 $X$ について $\tilde h_{k}(X)\defeq\ker(h_{k}(X)\to h_{k}(\ast))$ とおく。基点 $x_{0}$ があれば、$X\to\{x_{0}\}$ が包含 $\{x_{0}\}\to X$ の左逆なので、対 $(X,x_{0})$ の長完全列は分裂し、$\tilde h_{k}(X)\cong h_{k}(X,x_{0})$（自然）。定値写像は 1 点を経由するので $\tilde h$ に $0$ を誘導する。$\Sigma^{n}=I^{n}/\partial I^{n}$、標準形 $S_{\varepsilon}$、つぶし写像 $c_{m}$ などは \ref{at:page-sphere-maps} の記号を使う。$\Sigma^{0}\defeq S^{0}$（基点は 2 点の一方）とする。

::: lemma 一般のホモロジー理論の基本性質 {#at:theory-basic-lemmas keywords="for any homology theory: good pairs, finite additivity for pairs, cellular groups of skeleta, wedge of spheres and pinch maps" index="一般のホモロジー理論の基本性質|いっぱんのほもろじーりろんのきほんせいしつ"}
$h$ を任意のホモロジー理論とする。
1. **（良い対）** $A\subset X$ が空でない閉集合で、開集合 $V\supset A$ と連続写像 $F\colon V\times I\to V$（$F_{0}=1$, $F_{1}(V)\subset A$, $F_{t}(A)\subset A$）があるなら、商写像 $p$ は同型 $p_{*}\colon h_{k}(X,A)\cong h_{k}(X/A,\ast)\cong\tilde h_{k}(X/A)$ を誘導する。
2. **（有限和）** 有限個の対の非交和について、包含の和 $\bigoplus_{i}h_{k}(X_{i},A_{i})\to h_{k}(\bigsqcup_{i}X_{i},\bigsqcup_{i}A_{i})$ は同型。
3. **（骨格の対）** 有限 CW 複体 $X$ について、特性写像の和 $\bigoplus_{\alpha}h_{k}(D_{\alpha},\partial D_{\alpha})\to h_{k}(X^{n},X^{n-1})$（$\alpha$ は $n$ 胞体）は同型。
4. **（ウェッジ）** $(i_{j*})_{j}\colon\bigoplus_{j=1}^{m}\tilde h_{k}(\Sigma^{n})\to\tilde h_{k}(W_{m})$ は同型で、逆写像は $(p_{j*})_{j}$。$c_{m*}x=\sum_{j}i_{j*}x$（$x\in\tilde h_{k}(\Sigma^{n})$）。
:::

::: proof
**Step 1（1）.** $F$ から包含 $A\to V$ はホモトピー同値（逆は $F_{1}$：$F_{1}\circ\mathrm{incl}\simeq1_{A}$ は $F_{t}\restriction A$、$\mathrm{incl}\circ F_{1}\simeq1_{V}$ は $F$）なので、ホモトピー公理と、対 $(X,A)\to(X,V)$ の長完全列の五項補題（\ref{ha:five-lemma}）から $h_{k}(X,A)\cong h_{k}(X,V)$。切除（$\overline{A}=A\subset V=\operatorname{int}V$）で $h_{k}(X\setminus A,V\setminus A)\cong h_{k}(X,V)$。$X\setminus A$ は開で飽和しているので、$p$ は同相 $(X\setminus A,V\setminus A)\cong(X/A\setminus\{\ast\},V/A\setminus\{\ast\})$ を与える。$X/A$ の側でも、$V/A$ は開で、$F$ は $V/A$ を $\ast$ に縮めるホモトピーに降り（\ref{top:homotopy-on-quotient}）、$\{\ast\}$ は閉なので、同じ 2 段の同型 $h_{k}(X/A,\ast)\cong h_{k}(X/A,V/A)\cong h_{k}(X/A\setminus\{\ast\},V/A\setminus\{\ast\})$ がある。これらはすべて $p$ と可換なので、$p_{*}$ は同型。

**Step 2（2）.** 加法性公理（有限個の場合）を $\bigsqcup X_{i}$ と $\bigsqcup A_{i}$ に使い、対の長完全列どうしの写像に五項補題を使う。

**Step 3（3）.** $(X^{n},X^{n-1})$ と $(\bigsqcup D_{\alpha},\bigsqcup\partial D_{\alpha})$ は 1 の条件を満たし（\ref{at:skeleton-pairs} の 1、円板では放射状の変形）、特性写像は商空間の同相 $\bigsqcup D_{\alpha}/\bigsqcup\partial D_{\alpha}\cong X^{n}/X^{n-1}$ を誘導する（\ref{at:skeleton-pairs} の 2）。1 と 2 を合わせる（$X^{n-1}=\varnothing$ となる $n=0$ では 2 だけ）。

**Step 4（4）.** $(\bigsqcup_{j}\Sigma^{n},\bigsqcup_{j}\{\ast\})$ は 1 の条件を満たし（\ref{at:pinch-wedge} の Step 1）、商が $W_{m}$。1 と 2 から $(i_{j*})$ は同型。$p_{j}i_{j}=1$、$p_{j}i_{k}$（$k\neq j$）は定値なので $(p_{j*})$ が逆写像。$p_{j}\circ c_{m}$ は rel 基点で恒等写像とホモトープ（\ref{at:pinch-wedge} の Step 2）なので $c_{m*}x=\sum_{j}i_{j*}p_{j*}c_{m*}x=\sum_{j}i_{j*}x$。
:::

::: theorem 球面の写像は写像度倍で作用する {#at:theory-sphere-degree keywords="for any homology theory h and any map f: S^n -> S^n, f_* acts on reduced h_k(S^n) as multiplication by the degree of f" index="一般のホモロジー理論と写像度|いっぱんのほもろじーりろんとしゃぞうど"}
$h$ を任意のホモロジー理論、$n\ge0$、$f\colon S^{n}\to S^{n}$ を連続写像とする。すべての $k$ で、$f_{*}\colon\tilde h_{k}(S^{n})\to\tilde h_{k}(S^{n})$ は $\deg f$ 倍（\ref{at:degree}：特異ホモロジーで定めた整数）である。
:::

::: proof
**Step 1（$n=0$）.** $S^{0}=\{a,b\}$ で、加法性から $h_{k}(S^{0})=h_{k}(a)\oplus h_{k}(b)$、$\tilde h_{k}(S^{0})=\{(x,-x)\}$。自己写像は恒等（写像度 $1$）、入れ替え（$(x,-x)\mapsto(-x,x)$ で $-1$ 倍、写像度 $-1$）、定値（$0$ 倍、写像度 $0$）の 4 つで、主張が成り立つ。

**Step 2（$n\ge1$：基点付きへ）.** 同相 $S^{n}\cong\Sigma^{n}$ で写して考える（写像度も $\tilde h_{*}$ への作用も共役で変わらない）。\ref{at:hopf-degree-theorem} の証明の Step 4 の回転で、$f$ は基点を保つ写像 $f'$ とホモトープ。$f'\circ q$ は \ref{at:sphere-normal-form} から rel $\partial I^{n}$ で $S_{\varepsilon}$ とホモトープで、そのホモトピーは $\Sigma^{n}$ 上の基点付きホモトピーに降りる（\ref{top:homotopy-on-quotient}）。ホモトピー公理から $f_{*}=\bar S_{\varepsilon*}$。

**Step 3（標準形の作用）.** \ref{at:slab-degree} の Step 2 の計算は、\ref{at:theory-basic-lemmas} の 4 を使えば $h$ でもそのまま通り、$\bar S_{\varepsilon*}=\sum_{j}g_{j*}$（$g_{j}=1$ または $\bar\rho$）。$\varepsilon=(+1,-1)$ では $S_{(+1,-1)}$ が定値写像とホモトープ（\ref{at:slab-degree} の 1）なので $1+\bar\rho_{*}=0$。よって $\bar S_{\varepsilon*}$ は $\sum_{j}\varepsilon_{j}$ 倍で、\ref{at:sphere-normal-form} からこれは $\deg f$。

::: hypcheck
- **次元公理は使わない**：一般のホモロジー理論（$K$ 理論やボルディズムなど）でも成り立つ。
- 写像度の値そのものは特異ホモロジーで定め、$h$ ではその整数倍として作用することを示した。整数が理論によらないことが、一意性定理の核心である。
:::
:::

::: theorem 胞体鎖複体による計算 {#at:theory-cellular keywords="for an ordinary homology theory h with coefficients G and a finite CW complex X, h_n(X) is the homology of h_n(X^n, X^{n-1}), and this chain complex is D(X) (x) G with an integer chain complex D(X) given by degrees, independent of h" index="一般のホモロジー理論の胞体鎖複体|いっぱんのほもろじーりろんのほうたいさふくたい"}
$h$ を係数群 $G$ の通常のホモロジー理論、$X$ を有限 CW 複体とし、$C^{h}_{n}(X)\defeq h_{n}(X^{n},X^{n-1})$、$d\defeq j_{n-1}\circ\partial$（対 $(X^{n},X^{n-1})$ の連結射の後に $(X^{n-1},X^{n-2})$ へ）とする。
1. $(C^{h}(X),d)$ は鎖複体で、$H_{n}(C^{h}(X))\cong h_{n}(X)$。この同型は胞体写像について自然。
2. $h$ によらない整数の鎖複体 $D(X)$（$n$ 次は $n$ 胞体を基底とする自由アーベル群）と、鎖複体の同型 $\Xi^{h}_{X}\colon D(X)\otimes G\cong C^{h}(X)$ があり、胞体写像 $f\colon X\to Y$ について、$h$ によらない整数行列 $D(f)$ で $C^{h}(f)\circ\Xi^{h}_{X}=\Xi^{h}_{Y}\circ(D(f)\otimes1_{G})$。
:::

::: proof
**Step 1（集中）.** 長完全列と $D^{n}$ の可縮性から $h_{k}(D^{n},\partial D^{n})\cong\tilde h_{k-1}(\partial D^{n})$（$n\ge1$）、\ref{at:theory-basic-lemmas} の 1 から $\tilde h_{k-1}(S^{n-1})\cong\tilde h_{k-1}(\Sigma^{n-1})\cong h_{k-1}(D^{n-1},\partial D^{n-1})$（$D^{n-1}/\partial D^{n-1}\cong\Sigma^{n-1}$。$n=1$ では、加法性から直接 $\tilde h_{k-1}(S^{0})\cong h_{k-1}(\ast)=h_{k-1}(D^{0})$）。繰り返すと $h_{k}(D^{n},\partial D^{n})\cong h_{k-n}(D^{0})=h_{k-n}(\ast)$ で、次元公理から $k\ne n$ で $0$、$k=n$ で $G$。\ref{at:theory-basic-lemmas} の 3 から $h_{k}(X^{n},X^{n-1})$ は $k\neq n$ で $0$。また $h_{k}(X^{0})=0$（$k\neq0$、加法性と次元公理）。

**Step 2（1）.** \ref{at:skeleton-homology} の 1〜3 と \ref{at:cellular-singular} の証明は、対の長完全列と Step 1 の二つの事実だけを使うので、$h$ でそのまま成り立つ。同型は $j_{n}$、包含の誘導写像、長完全列の写像からなり、胞体写像はこれらすべてと可換なので自然。$d\circ d=0$ は $\partial\circ j=0$（長完全列の隣り合う写像）から。

**Step 3（生成元の約束）.** $\chi_{n}\colon(D^{n},\partial D^{n})\to(\Sigma^{n},\ast)$ を、$D^{n}/\partial D^{n}\cong\Sigma^{n}$ を誘導する固定した写像（$\chi_{0}$ は 1 点 $D^{0}$ の $\Sigma^{0}$ の基点でない点への包含）、$\omega_{n-1}\colon\partial D^{n}\to\Sigma^{n-1}$ を固定した同相とする。同型 $u_{n}\colon G\to h_{n}(D^{n},\partial D^{n})$ を、$u_{0}\defeq1$（$h_{0}(D^{0})=G$）、
$$
u_{n}\defeq\partial^{-1}\circ\omega_{n-1*}^{-1}\circ\chi_{n-1*}\circ u_{n-1}
$$
で定める（$\partial\colon h_{n}(D^{n},\partial D^{n})\cong\tilde h_{n-1}(\partial D^{n})$、$\chi_{n-1*}\colon h_{n-1}(D^{n-1},\partial D^{n-1})\cong\tilde h_{n-1}(\Sigma^{n-1})$）。$u'_{n}\defeq\chi_{n*}u_{n}\colon G\cong\tilde h_{n}(\Sigma^{n})$ とおくと、作り方から $\omega_{n-1*}\circ\partial\circ u_{n}=u'_{n-1}$。

**Step 4（成分の取り出し）.** $n$ 胞体 $\beta$ について、$\kappa_{\beta}\colon(X^{n},X^{n-1})\to(\Sigma^{n},\ast)$ を、$\Phi_{\beta}(z)\mapsto\chi_{n}(z)$、$e_{\beta}$ の外を $\ast$ とする写像とする（\ref{at:cw-closed-criterion} の 2 で連続）。$\kappa_{\beta}\circ\Phi_{\gamma}$ は $\gamma=\beta$ で $\chi_{n}$、$\gamma\neq\beta$ で定値なので、3 の分解のもとで $\chi_{n*}^{-1}\kappa_{\beta*}$ は第 $\beta$ 成分への射影。$\Xi^{h}_{X}(e_{\alpha}\otimes g)\defeq\Phi_{\alpha*}u_{n}(g)$ とすると、\ref{at:theory-basic-lemmas} の 3 と Step 1 から $\Xi^{h}_{X}$ は各次数で同型。

**Step 5（境界の行列）.** $d$ の $(\alpha,\beta)$ 成分（$\alpha$ は $n$ 胞体、$\beta$ は $(n-1)$ 胞体）は、連結射の自然性 $\partial\Phi_{\alpha*}=\varphi_{\alpha*}\partial$ と Step 3・4 から
$$
u_{n-1}^{-1}\chi_{n-1*}^{-1}\kappa_{\beta*}\,j\,\varphi_{\alpha*}\,\partial\,u_{n}=u'^{-1}_{n-1}\circ(\kappa_{\beta}\varphi_{\alpha}\omega_{n-1}^{-1})_{*}\circ u'_{n-1}.
$$
$\kappa_{\beta}\varphi_{\alpha}\omega_{n-1}^{-1}$ は $\Sigma^{n-1}$ の自己写像なので、\ref{at:theory-sphere-degree} からこれは整数 $d_{\alpha\beta}\defeq\deg(\kappa_{\beta}\varphi_{\alpha}\omega_{n-1}^{-1})$ 倍。$D(X)$ の境界を行列 $(d_{\alpha\beta})$ で定めれば、$\Xi^{h}_{X}$ は鎖写像。$d_{\alpha\beta}$ は特異ホモロジーの写像度なので $h$ によらない。$D(X)$ が鎖複体であることは、$G=\mathbb{Z}$ の理論（特異ホモロジー）で $\Xi$ が同型であることから従う。

**Step 6（胞体写像の行列）.** 胞体写像 $f$ について、$\kappa_{\beta}\circ f\circ\Phi_{\alpha}\colon(D^{n},\partial D^{n})\to(\Sigma^{n},\ast)$ は $\chi_{n}$ を通って $\mu_{\alpha\beta}\circ\chi_{n}$（$\mu_{\alpha\beta}\colon\Sigma^{n}\to\Sigma^{n}$）と書ける。Step 5 と同じ計算で、$C^{h}(f)$ の $(\alpha,\beta)$ 成分は $u'^{-1}_{n}\mu_{\alpha\beta*}u'_{n}=\deg\mu_{\alpha\beta}$ 倍。$D(f)\defeq(\deg\mu_{\alpha\beta})$。

::: hypcheck
- **次元公理**：Step 1 で、骨格の対のホモロジーを 1 つの次数に集中させるのに使った（これがないと胞体鎖複体はスペクトル系列の $E^{1}$ 項になる）。
- **有限性**：加法性を有限和で使い、骨格の帰納法を有限回で終わらせた。
- **選択公理**：使わない。
:::
:::

::: theorem アイレンバーグ–スティーンロッドの一意性定理 {#at:eilenberg-steenrod-uniqueness keywords="any ordinary homology theory with coefficient group G is naturally isomorphic to singular homology with coefficients in G on finite CW pairs" index="アイレンバーグ–スティーンロッドの一意性定理|あいれんばーぐすてぃーんろっどのいちいせいていり"}
$h$ を係数群 $G$ の通常のホモロジー理論とする。
1. 有限 CW 複体 $X$ について同型 $\theta_{X}\colon H_{n}(X;G)\cong h_{n}(X)$ があり、有限 CW 複体の間のすべての連続写像について自然。
2. 有限 CW 対 $(X,A)$ について同型 $\theta_{(X,A)}\colon H_{n}(X,A;G)\cong h_{n}(X,A)$ があり、有限 CW 対の間の対の写像について自然。
3. 2 の同型は連結射と可換である：すべての有限 CW 対 $(X,A)$ と $n$ について
$$
\partial^{h}\circ\theta_{(X,A)}=\theta_{A}\circ\partial^{H}\colon H_{n}(X,A;G)\to h_{n-1}(A).
$$
したがって $\theta$ は有限 CW 対の上のホモロジー理論の同型（長完全列全体の同型）である。
:::

::: proof
**Step 1（胞体写像について自然な同型）.** $H(-;G)$ は係数群 $G$ の通常のホモロジー理論（\ref{at:homology-coefficients}）。\ref{at:theory-cellular} を $H(-;G)$ と $h$ に使い、
$$
H_{n}(X;G)\cong H_{n}(C^{H(-;G)}(X))\xleftarrow{\ \Xi\ }H_{n}(D(X)\otimes G)\xrightarrow{\ \Xi\ }H_{n}(C^{h}(X))\cong h_{n}(X)
$$
の合成を $\theta_{X}$ とする。各段は胞体写像について自然（\ref{at:theory-cellular} の 1・2）。

**Step 2（1）.** 連続写像 $f\colon X\to Y$ は胞体写像 $f'$ とホモトープ（\ref{at:cellular-approximation}）で、両理論ともホモトピー公理を満たすので $f_{*}=f'_{*}$。よって $\theta_{Y}f_{*}=\theta_{Y}f'_{*}=f'_{*}\theta_{X}=f_{*}\theta_{X}$。

**Step 3（2）.** $A=\varnothing$ なら 1。$A\neq\varnothing$ なら、$(X,A)$ は良い対（\ref{at:cw-pair-good} の 1）なので、両理論で $p_{*}\colon(X,A)\to(X/A,\ast)$ は同型（\ref{at:theory-basic-lemmas} の 1）、$X/A$ は有限 CW 複体（\ref{at:cw-pair-good} の 2）。$\theta_{X/A}$ は $X/A\to\ast$ と $\ast\to X/A$ について自然なので、核 $\tilde H_{n}(X/A;G)\cong\tilde h_{n}(X/A)$ の同型に制限される。対の写像 $f\colon(X,A)\to(Y,B)$（$B\neq\varnothing$）は $\bar f\colon X/A\to Y/B$ を誘導し（$A=\varnothing$ なら $X\to Y\to Y/B$）、$p_{*}$ も $\theta$ も自然なので、合成した同型は自然。

::: hypcheck
- **通常（次元公理）**：\ref{at:theory-cellular} の集中で使った。外すと偽：複素 $K$ 理論は 1 点の値が偶数次で $\mathbb{Z}$、奇数次で $0$ で、特異ホモロジーのどの係数とも一致しない（知られている）。
- **有限性**：無限 CW 複体では、加法性公理（任意個の非交和）を使って同じ結論が成り立つ（\ref{at:eilenberg-steenrod-uniqueness-infinite}。骨格から全体へ移るところでミルナーの望遠鏡の議論 \ref{at:milnor-additivity} が要る）。
- **CW 複体であること**：胞体近似と骨格の分解に使った。一般の空間では理論ごとに値が異なる（\ref{at:page-homology-counterexamples}）。
- **3 の証明の要点**：連結射の値は、骨格への制限（Step 5）、貼り付け写像の自然性（Step 6）によって円板の対 $(D^{n},\partial D^{n})$ の連結射に帰着し、そこでは \ref{at:theory-cellular} の生成元 $u_{n}$ が**連結射を使って**定められていることから可換性が従う（Step 4）。符号の調整は要らない。
:::
:::

::: proof 3 の証明
以下 $h$ と $H(-;G)$ の両方の理論で同じ記号を使い、区別が要るときは $u^{h}_{n}$, $u^{H}_{n}$ のように上付きで書く。$\chi_{n}$, $\omega_{n-1}$, $u_{n}$, $u'_{n}=\chi_{n*}u_{n}$ は \ref{at:theory-cellular} の Step 3 の記号で、$\Sigma^{m}$ には 0 胞体 $\ast$ と特性写像 $\chi_{m}$ の $m$ 胞体からなる CW 構造を入れる（$m=0$ では 2 つの 0 胞体）。$\theta$ は 1 によりすべての連続写像について自然なので、CW 構造の取り方によらない（恒等写像について自然）。

**Step 4（球面と円板の対）.** $m\ge0$ と $g\in G$ について
$$
\theta_{(\Sigma^{m},\ast)}(\chi_{m*}u^{H}_{m}g)=\chi_{m*}u^{h}_{m}g,\qquad \theta_{(D^{m},\partial D^{m})}(u^{H}_{m}g)=u^{h}_{m}g
\label{at:eq-theta-generator}
$$
を示す。$m=0$：$\theta_{\ast}$ は、1 点の唯一の胞体について $\Xi(e\otimes g)=u_{0}(g)=g$ なので $G=H_{0}(\ast;G)\to h_{0}(\ast)=G$ の恒等写像。$\chi_{0}\colon(D^{0},\varnothing)\to(\Sigma^{0},\ast)$ について 2 の自然性から第 1 式。$m\ge1$：$\Sigma^{m}$ の胞体鎖複体は次数 $0$ の $h_{0}(\ast)$ と次数 $m$ の $h_{m}(\Sigma^{m},\ast)$ だけからなり、次数 $m$ の微分は $0$（$m=1$ でも、$\partial\colon h_{1}(\Sigma^{1},\ast)\to h_{0}(\ast)$ は $h_{0}(\ast)\to h_{0}(\Sigma^{1})$ が $\Sigma^{1}\to\ast$ で分裂する単射なので $0$）。\ref{at:theory-cellular} の 1 の同型は、$h_{m}(\Sigma^{m})\xrightarrow{j}h_{m}(\Sigma^{m},\ast)$（$h_{m}(\ast)=0$ と前の注意から同型）の逆写像である。$\Xi(e_{m}\otimes g)=\chi_{m*}u_{m}g$ なので、$\theta_{\Sigma^{m}}$ は $j^{-1}\chi_{m*}u^{H}_{m}g$ を $j^{-1}\chi_{m*}u^{h}_{m}g$ に写す。対 $(\Sigma^{m},\ast)$ の $\theta$ は、2 の証明の Step 3（$\Sigma^{m}/\ast=\Sigma^{m}$）により $j$ で移したものなので第 1 式が成り立つ。第 2 式は、対の写像 $\chi_{m}\colon(D^{m},\partial D^{m})\to(\Sigma^{m},\ast)$ について 2 の自然性 $\theta\chi_{m*}=\chi_{m*}\theta$ と、$\chi_{m*}$ が両理論で同型であること（\ref{at:theory-basic-lemmas} の 1）から従う。

**Step 5（円板の対での可換性）.** $m\ge1$ とする。\ref{at:theory-cellular} の Step 3 の作り方から、$h_{m-1}(\partial D^{m})$ の中で $\partial u_{m}g=\omega_{m-1*}^{-1}(\tilde u'_{m-1}g)$（$\tilde u'_{m-1}g\in\tilde h_{m-1}(\Sigma^{m-1})$ は $u'_{m-1}g$ に対応する被約ホモロジーの元）が両理論で成り立つ。Step 4 の第 1 式（$\Sigma^{m-1}$ で）を被約ホモロジーに移すと $\theta_{\Sigma^{m-1}}(\tilde u'^{H}_{m-1}g)=\tilde u'^{h}_{m-1}g$。同相写像 $\omega_{m-1}^{-1}$ についての 1 の自然性と Step 4 の第 2 式から
$$
\begin{aligned}
\theta_{\partial D^{m}}\partial^{H}u^{H}_{m}g&=\omega_{m-1*}^{-1}\theta_{\Sigma^{m-1}}(\tilde u'^{H}_{m-1}g)=\omega_{m-1*}^{-1}\tilde u'^{h}_{m-1}g\\
&=\partial^{h}u^{h}_{m}g=\partial^{h}\theta_{(D^{m},\partial D^{m})}u^{H}_{m}g.
\end{aligned}
$$
$u^{H}_{m}$ は全射で、$k\neq m$ では $H_{k}(D^{m},\partial D^{m};G)=0$（\ref{at:theory-cellular} の Step 1）なので、$(D^{m},\partial D^{m})$ では 3 が成り立つ。

**Step 6（相対骨格の対）.** 有限 CW 対 $(X,A)$ について $X_{k}\defeq X^{k}\cup A$ とおく（部分複体）。$X\setminus A$ の $n$ 胞体の特性写像 $\Phi_{\alpha}\colon(D^{n},\partial D^{n})\to(X_{n},X_{n-1})$ の和は同型 $\bigoplus_{\alpha}h_{n}(D^{n},\partial D^{n})\cong h_{n}(X_{n},X_{n-1})$ を誘導する（$n\ge1$）：$(X_{n},X_{n-1})$ と $(\bigsqcup D_{\alpha},\bigsqcup\partial D_{\alpha})$ は良い対（\ref{at:cw-pair-good} の 1）、特性写像が誘導する $\bigsqcup D_{\alpha}/\bigsqcup\partial D_{\alpha}\to X_{n}/X_{n-1}$ は連続な全単射（$X_{n}\setminus X_{n-1}$ は $X\setminus A$ の $n$ 開胞体の非交和）で、コンパクト空間から有限 CW 複体（\ref{at:cw-pair-good} の 2）すなわちハウスドルフ空間（\ref{at:cw-paracompact}）への写像なので同相。あとは \ref{at:theory-basic-lemmas} の 1・2。$y\in H_{n}(X_{n},X_{n-1};G)$ を $y=\sum_{\alpha}\Phi_{\alpha*}y_{\alpha}$ と書くと、連結射の自然性 $\partial\Phi_{\alpha*}=\varphi_{\alpha*}\partial$（$\varphi_{\alpha}=\Phi_{\alpha}\restriction\partial D^{n}\colon\partial D^{n}\to X_{n-1}$）、1・2 の自然性と Step 5 から
$$
\partial^{h}\theta y=\sum_{\alpha}\varphi_{\alpha*}\partial^{h}\theta y_{\alpha}=\sum_{\alpha}\varphi_{\alpha*}\theta\partial^{H}y_{\alpha}=\theta\partial^{H}y.
$$
よって $(X_{n},X_{n-1})$ では 3 が成り立つ。

**Step 7（一般の有限 CW 対）.** $A=\varnothing$ なら連結射の行き先は $0$。$A\neq\varnothing$ とし、$n\ge1$、$x\in H_{n}(X,A;G)$ とする（$n\le0$ では $h_{n-1}(A)=0$：\ref{at:theory-cellular} の 1 から有限 CW 複体の負の次数のホモロジーは $0$）。$Y\defeq X/A$ は有限 CW 複体で、その $k$ 骨格は $p(X_{k})$、$X_{k}/A=Y^{k}$（\ref{at:cw-pair-good} の 2）。
- (a) $H_{n}(X_{n},A;G)\to H_{n}(X,A;G)$ は全射：良い対の同型（\ref{at:theory-basic-lemmas} の 1）で $\tilde H_{n}(Y^{n};G)\to\tilde H_{n}(Y;G)$ と同一視され、これは \ref{at:skeleton-homology} の 3（を繰り返したもの）から全射。そこで $x=i_{*}x'$（$i\colon(X_{n},A)\to(X,A)$）と書く。
- (b) $h_{n-1}(A)\to h_{n-1}(X_{n-1})$ は単射：対 $(X_{n-1},A)$ の長完全列で、前の項 $h_{n}(X_{n-1},A)\cong\tilde h_{n}(Y^{n-1})$ は \ref{at:skeleton-homology} の 1（$h$ でも成り立つ、\ref{at:theory-cellular} の Step 2）から $0$。

$i$ は $A$ の上で恒等なので、連結射の自然性と 2 の自然性から $\partial^{h}\theta x=\partial^{h}i_{*}\theta x'=\partial^{h}\theta x'$、$\partial^{H}x=\partial^{H}x'$。対の写像 $k\colon(X_{n},A)\to(X_{n},X_{n-1})$ と包含 $\iota\colon A\to X_{n-1}$ について連結射の自然性は $\partial k_{*}=\iota_{*}\partial$。よって Step 6 から
$$
\iota_{*}\partial^{h}\theta x'=\partial^{h}k_{*}\theta x'=\partial^{h}\theta k_{*}x'=\theta\partial^{H}k_{*}x'=\theta\iota_{*}\partial^{H}x'=\iota_{*}\theta\partial^{H}x'.
$$
(b) の単射性から $\partial^{h}\theta x'=\theta\partial^{H}x'$、すなわち $\partial^{h}\theta x=\theta\partial^{H}x$。

::: hypcheck
- **連結射の自然性**（公理）：Step 6・7 で、連結射を骨格の対と円板の対に移すのに使った。
- **生成元の約束**：Step 5 で、$u_{n}$ が連結射 $\partial$ の逆を使って帰納的に定められていることを使った。これを別の生成元（たとえば $-u_{n}$）に取り替えると、その理論との同型は連結射と $(-1)$ 倍のずれで可換になりうる。両理論で**同じ規則**で生成元を選んだことが、符号の調整を不要にしている。
- **次元公理**：Step 7 の (b) で、骨格より高い次数のホモロジーが消えることに使った。
- **有限性**：Step 6 のコンパクト性と、\ref{at:cw-pair-good} の 2 に使った。無限の CW 対への拡張は \ref[無限 CW 複体と一意性定理]{at:page-uniqueness-infinite} で扱う。
:::

## 普遍係数定理 {#at:sec-ax-uct}

::: lemma 自由鎖複体の普遍係数定理 {#at:algebraic-uct keywords="for a chain complex of free abelian groups C and an abelian group G there is a natural short exact sequence 0 -> H_n(C) (x) G -> H_n(C (x) G) -> Tor(G, H_{n-1}(C)) -> 0 which splits" index="普遍係数定理（代数）|ふへんけいすうていりだいすう"}
$C$ を自由アーベル群の鎖複体、$G$ をアーベル群とする。自然な短完全列
$$
0\to H_{n}(C)\otimes G\to H_{n}(C\otimes G)\to\mathrm{Tor}^{\mathbb{Z}}_{1}(G,H_{n-1}(C))\to0
$$
があり、分裂する（分裂は自然ではない）。
:::

::: proof
**Step 1（短完全列）.** $Z_{n}\defeq\ker\partial_{n}$, $B_{n-1}\defeq\operatorname{im}\partial_{n}\subset C_{n-1}$。$B_{n-1}$ は自由アーベル群の部分群なので自由で、$0\to Z_{n}\to C_{n}\xrightarrow{\partial}B_{n-1}\to0$ は分裂する。$Z$ と $B$（$B$ の次数を 1 つずらしたもの）を微分 $0$ の鎖複体と見ると、$0\to Z\to C\to B[-1]\to0$ は鎖複体の短完全列で、各次数で分裂するので $\otimes G$ しても短完全。

**Step 2（長完全列）.** $Z\otimes G$ と $B\otimes G$ の微分は $0$ なので、長完全列は
$$
B_{n}\otimes G\xrightarrow{\delta}Z_{n}\otimes G\to H_{n}(C\otimes G)\to B_{n-1}\otimes G\xrightarrow{\delta}Z_{n-1}\otimes G
$$
で、連結射 $\delta$ は包含 $i_{n}\colon B_{n}\to Z_{n}$ の $\otimes G$ に等しい（連結射の構成：$b\otimes g$ を $C_{n+1}\otimes G$ に持ち上げて境界をとると $b\otimes g$ 自身）。

**Step 3（両端）.** $0\to B_{n}\xrightarrow{i_{n}}Z_{n}\to H_{n}(C)\to0$ は $H_{n}(C)$ の自由分解。テンソル積の右完全性（\ref{ha:tensor-right-exact}）から $\operatorname{coker}(i_{n}\otimes1)\cong H_{n}(C)\otimes G$。Tor の定義（\ref{ha:tor}：第 2 変数の射影分解を $G\otimes-$ で写したもののホモロジー）から $\ker(i_{n-1}\otimes1)\cong\mathrm{Tor}^{\mathbb{Z}}_{1}(G,H_{n-1}(C))$（$G\otimes M\cong M\otimes G$ で書き直す）。Step 2 の列から主張の短完全列。

**Step 4（分裂）.** $0\to Z_{n}\to C_{n}\to B_{n-1}\to0$ の分裂から射影 $p\colon C_{n}\to Z_{n}$ がとれる。$p$ を $Z_{n}\to H_{n}(C)$ と合成した写像 $C_{n}\to H_{n}(C)$ は $B_{n}$ の上では $0$（$p$ は $Z_{n}$ の上で恒等で、$B_{n}\subset Z_{n}$ の元を $H_{n}$ で $0$ に送る）なので、$\otimes G$ して $C_{n}\otimes G\to H_{n}(C)\otimes G$ を作り、サイクルに制限すると $H_{n}(C\otimes G)\to H_{n}(C)\otimes G$ を誘導する（境界 $\partial(c)\otimes g$ は $B_{n}\otimes G$ の像なので $0$ に送られる）。これは最初の写像の左逆。
:::

::: theorem 普遍係数定理（ホモロジー） {#at:uct-homology keywords="universal coefficient theorem: 0 -> H_n(X;Z) (x) G -> H_n(X;G) -> Tor(H_{n-1}(X), G) -> 0, split but not naturally" index="普遍係数定理|ふへんけいすうていり"}
空間対 $(X,A)$ とアーベル群 $G$ について、自然な短完全列
$$
0\to H_{n}(X,A)\otimes G\to H_{n}(X,A;G)\to\mathrm{Tor}^{\mathbb{Z}}_{1}(G,H_{n-1}(X,A))\to0
$$
があり、分裂する（分裂は自然ではない）。とくに $G$ が平坦（$\mathbb{Q}$ や $\mathbb{R}$ など、ねじれのない群）なら $H_{n}(X,A;G)\cong H_{n}(X,A)\otimes G$。
:::

::: proof
$S(X,A)$ は自由アーベル群の鎖複体なので \ref{at:algebraic-uct}。平坦なら Tor が消える（\ref{ha:flat-tor}）。
:::

::: example 実射影空間の $\mathbb{Z}/2$ 係数ホモロジー
$G=\mathbb{Z}/2$ とする。\ref{at:projective-space-homology} と \ref{ha:tor-z}（$M\otimes\mathbb{Z}/2=M/2M$, $\mathrm{Tor}_{1}(\mathbb{Z}/2,M)\cong M[2]$）から、$0\le k\le n$ で
$$
H_{k}(\mathbb{R}P^{n};\mathbb{Z}/2)\cong\mathbb{Z}/2.
$$
たとえば $k$ が偶数で $0<k<n$ なら $H_{k}=0$, $H_{k-1}=\mathbb{Z}/2$ で、$0\oplus\mathbb{Z}/2[2]=\mathbb{Z}/2$。胞体鎖複体に $\otimes\mathbb{Z}/2$ すると境界 $\pm2$ が $0$ になることからも分かる。
:::

::: supplement
**一般化.** 主イデアル整域 $R$ 上の自由鎖複体と $R$ 加群 $G$ でも同じ形の普遍係数定理が成り立つ（証明は同じ：PID 上の自由加群の部分加群は自由）。体 $k$ 係数では $H_{n}(X;k)\cong H_{n}(X)\otimes k\oplus\mathrm{Tor}(k,H_{n-1}(X))$ で、ベッチ数 $\dim_{k}H_{n}(X;k)$ は $k$ の標数によって変わりうる（$\mathbb{R}P^{2}$ で $\dim H_{1}(\,;\mathbb{Q})=0$, $\dim H_{1}(\,;\mathbb{F}_{2})=1$）。分裂が自然でないことは、ムーア空間の間の写像で示せることが知られている（本サイト未収録）。
:::

## 問題 {#at:sec-ax-problems}

::: problem {#at:prob-uct-torsion}
有限 CW 複体 $X$ について、$H_{n}(X;\mathbb{Q})=0$ がすべての $n\ge1$ で成り立ち、ある素数 $p$ で $H_{n}(X;\mathbb{F}_{p})=0$（すべての $n\ge1$）なら、$H_{n}(X)$（$n\ge1$）は $p$ と互いに素な位数の有限群であることを示せ。
:::

::: solution
$H_{n}(X)$ は有限生成（\ref{at:cw-homology-consequences}）。$\mathbb{Q}$ 係数が消えるので階数 $0$、したがって有限群。$\mathbb{F}_{p}$ 係数の普遍係数定理で $H_{n}(X)\otimes\mathbb{F}_{p}=H_{n}(X)/pH_{n}(X)=0$、すなわち $H_{n}(X)=pH_{n}(X)$。有限群でこれが成り立つのは位数が $p$ と互いに素なとき（シローの定理か、$p$ 倍写像が全射なら単射でもあることから $p$ 位数の元がない）。
:::

::: problem {#at:prob-comparison-not-cw}
比較定理の仮定「有限 CW 対」は外せない。特異ホモロジーと、加法性の代わりに「連続性」（コンパクト空間の逆極限 $X=\varprojlim X_{i}$ について $h(X)$ が $h(X_{i})$ から決まる性質）をもつ理論（チェック理論）が、カントール集合で異なる値をとる理由を説明せよ（詳しくは \ref[ホモロジー理論が一致しない空間]{at:page-homology-counterexamples}）。
:::

::: solution
カントール集合 $C$ は弧状連結成分が 1 点ずつで非可算個あるので、特異ホモロジーの $H_{0}(C)$ は非可算階数の自由アーベル群（加法性：$\bigoplus_{C}\mathbb{Z}$）。一方 $C$ は有限集合の逆極限 $\varprojlim\{0,1\}^{n}$ なので、連続性をもつ理論（チェックホモロジーなど）では $H_{0}$ は $\varprojlim\mathbb{Z}^{2^{n}}$ のような「連続関数的」な群になり、自由アーベル群 $\bigoplus$ とは異なる（チェックコホモロジーでは $\check H^{0}(C)$ は局所定数関数 $C\to\mathbb{Z}$ の群で可算）。CW 複体ではこのような違いが起きないことを比較定理が保証している。
:::
