# キュネットの定理 {#at:page-kunneth keywords="tensor product of chain complexes, acyclic models theorem, free functor with models, Eilenberg-Zilber theorem, S(X x Y) chain homotopy equivalent to S(X) (x) S(Y), algebraic Kunneth theorem, cross product, Kunneth formula for singular homology, homology of products of spheres, torus T^n, field coefficients, Euler characteristic of products"}

積空間 $X\times Y$ のホモロジーは、$X$ と $Y$ のホモロジーのテンソル積（と Tor の補正項）で決まる。これが**キュネットの定理**である。証明は二段に分かれる：位相的な部分は特異鎖複体の同値 $S(X\times Y)\simeq S(X)\otimes S(Y)$（**アイレンバーグ–ジルバーの定理**）で、これを**非輪状モデルの方法**で示す。代数的な部分は自由鎖複体のテンソル積のホモロジーの計算（**代数的キュネット定理**）で、普遍係数定理（\ref{at:algebraic-uct}）と同じ議論である。

> 資料：標準的な内容（Massey『Singular Homology Theory』の積の章、Fulton『Algebraic Topology』など）。非輪状モデルの定理の証明は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-ku-notation}

::: notation
- 特異鎖複体と添加写像 \ref{at:singular-homology}、ホモトピー不変性 \ref{at:singular-homotopy-invariance}（可縮な空間の被約ホモロジーは $0$）。普遍係数定理の代数的な形 \ref{at:algebraic-uct}。
- テンソル積の右完全性 \ref{ha:tensor-right-exact}、Tor \ref{ha:tor}, \ref{ha:tor-basic}（$\mathrm{Tor}^{\mathbb{Z}}_{1}(M,N)$ は第 2 変数 $N$ の自由分解を $M\otimes-$ で写したもののホモロジー）。鎖ホモトピー \ref{ha:chain-homotopy}, \ref{ha:homotopy-invariance}。
- **添加鎖複体**：$F_{-1}=\mathbb{Z}$, $\partial_{0}=\varepsilon$ とした鎖複体（$F_{n}=0$, $n<-1$）。添加鎖写像は次数 $-1$ で恒等。
- **選択公理**：非輪状モデルの定理の構成で、次数ごとに有限個の元を選び、各段の選択は前の段に依存する。厳密には従属選択公理を使う（凸集合の錐作用素を使えば選択を明示できるが、ここでは立ち入らない）。普遍係数定理と同じく、自由アーベル群の部分群が自由であることにも選択公理を使う。
:::

## 鎖複体のテンソル積 {#at:sec-ku-tensor}

::: definition 鎖複体のテンソル積 {#at:tensor-chain-complexes keywords="tensor product of chain complexes with Koszul sign rule" index="鎖複体のテンソル積|さふくたいのてんそるせき"}
鎖複体 $C,D$（次数 $\ge0$）について $(C\otimes D)_{n}\defeq\bigoplus_{p+q=n}C_{p}\otimes D_{q}$、$\partial(a\otimes b)\defeq\partial a\otimes b+(-1)^{p}a\otimes\partial b$（$a\in C_{p}$）とする。$\partial\partial(a\otimes b)=\partial\partial a\otimes b+(-1)^{p-1}\partial a\otimes\partial b+(-1)^{p}\partial a\otimes\partial b+a\otimes\partial\partial b=0$。添加鎖複体については $\varepsilon(a\otimes b)\defeq\varepsilon(a)\varepsilon(b)$（次数 $0$）。
:::

## 非輪状モデル {#at:sec-ku-acyclic-models}

::: definition 自由関手と非輪状性 {#at:free-on-models keywords="functor to augmented chain complexes free on models, acyclic on models" index="モデル上自由|もでるじょうじゆう, モデル上非輪状|もでるじょうひりんじょう, 非輪状モデル|ひりんじょうもでる"}
圏 $\mathcal{C}$ から添加鎖複体の圏への関手 $F$ について、
1. $F$ が**モデル上自由**であるとは、各 $n\ge0$ に対象の集合 $\mathcal{M}_{n}$ と元 $m_{M}\in F_{n}(M)$（$M\in\mathcal{M}_{n}$）があって、任意の対象 $X$ について $\{F_{n}(f)(m_{M}):M\in\mathcal{M}_{n},\ f\in\mathcal{C}(M,X)\}$ が $F_{n}(X)$ の基底（異なる $(M,f)$ は異なる基底元）となることをいう。
2. 関手 $G$ が**モデル $\mathcal{M}=\bigcup_{n}\mathcal{M}_{n}$ の上で非輪状**であるとは、すべての $M\in\mathcal{M}$ で添加鎖複体 $G(M)$ が完全（$\tilde H_{*}(G(M))=0$）であることをいう。
:::

::: theorem 非輪状モデルの定理 {#at:acyclic-models keywords="acyclic models theorem: natural augmented chain maps from a free functor to a functor acyclic on the models exist and are unique up to natural chain homotopy" index="非輪状モデルの定理|ひりんじょうもでるのていり"}
$F$ がモデル $\mathcal{M}$ 上自由で、$G$ が $\mathcal{M}$ の上で非輪状なら、
1. 自然な添加鎖写像 $\tau\colon F\to G$ が存在し、
2. 任意の 2 つの自然な添加鎖写像 $\tau,\tau'\colon F\to G$ は自然な鎖ホモトピーで結ばれる（$\partial D+D\partial=\tau-\tau'$、$D_{-1}=0$）。
:::

::: proof
**Step 1（存在）.** $\tau_{-1}\defeq1$ とし、$n\ge0$ で $\tau_{k}$（$k<n$）が自然で $\partial\tau_{k}=\tau_{k-1}\partial$ を満たすとする。$M\in\mathcal{M}_{n}$ について $c\defeq\tau_{n-1}(\partial m_{M})\in G_{n-1}(M)$ は $\partial c=\tau_{n-2}\partial\partial m_{M}=0$ を満たすサイクル（$n=0$ では $c=\varepsilon(m_{M})\in\mathbb{Z}=G_{-1}$ で、次数 $-1$ の元はすべてサイクル）。$G(M)$ は完全なので $c=\partial g_{M}$ となる $g_{M}\in G_{n}(M)$ がある（1 つ選ぶ）。基底元について $\tau_{n}(F_{n}(f)m_{M})\defeq G_{n}(f)g_{M}$ と定め、線形に延ばす。

**Step 2（自然性と鎖写像）.** $h\colon X\to X'$ について $\tau_{n}F_{n}(h)(F_{n}(f)m_{M})=\tau_{n}(F_{n}(hf)m_{M})=G_{n}(hf)g_{M}=G_{n}(h)\tau_{n}(F_{n}(f)m_{M})$。また $\partial\tau_{n}(F_{n}(f)m_{M})=G_{n-1}(f)\partial g_{M}=G_{n-1}(f)\tau_{n-1}(\partial m_{M})=\tau_{n-1}(F_{n-1}(f)\partial m_{M})=\tau_{n-1}\partial(F_{n}(f)m_{M})$（$\tau_{n-1}$ の自然性と $F(f)$ が鎖写像であること）。

**Step 3（一意性）.** $D_{k}$（$k<n$）が自然で $\partial D_{k}+D_{k-1}\partial=\tau_{k}-\tau'_{k}$ を満たすとする（$D_{-1}=0$。次数 $-1$ では $\tau=\tau'=1$）。$M\in\mathcal{M}_{n}$ について $c\defeq\tau_{n}m_{M}-\tau'_{n}m_{M}-D_{n-1}\partial m_{M}$ とおくと
$$
\partial c=(\tau_{n-1}-\tau'_{n-1})\partial m_{M}-\partial D_{n-1}\partial m_{M}=D_{n-2}\partial\partial m_{M}=0
$$
（$n=0$ では $\partial c=\varepsilon\tau_{0}m-\varepsilon\tau'_{0}m=\varepsilon m-\varepsilon m=0$）。完全性から $c=\partial d_{M}$ となる $d_{M}$ をとり、$D_{n}(F_{n}(f)m_{M})\defeq G_{n+1}(f)d_{M}$ とする。Step 2 と同様に自然で、$\partial D_{n}+D_{n-1}\partial=\tau_{n}-\tau'_{n}$ が基底元で成り立つ。

::: hypcheck
- **$F$ の自由性**：Step 1・3 で、モデルの上で値を決めれば自然に延びること（基底の一意性）に使った。
- **$G$ の非輪状性**：$c$ が境界であることに使った。モデルの上でだけ必要で、一般の $X$ では $G(X)$ は非輪状でなくてよい。
:::
:::

## アイレンバーグ–ジルバーの定理 {#at:sec-ku-ez}

::: lemma テンソル積のホモロジー（代数的キュネット） {#at:algebraic-kunneth keywords="algebraic Kunneth theorem: for a free chain complex C, 0 -> sum H_p(C) (x) H_q(D) -> H_n(C (x) D) -> sum Tor(H_q(D), H_{p}(C)) -> 0, split if D is free" index="代数的キュネット定理|だいすうてききゅねっとていり"}
$C$ を自由アーベル群の鎖複体、$D$ を鎖複体とする。自然な短完全列
$$
0\to\bigoplus_{p+q=n}H_{p}(C)\otimes H_{q}(D)\to H_{n}(C\otimes D)\to\bigoplus_{p+q=n-1}\mathrm{Tor}^{\mathbb{Z}}_{1}(H_{q}(D),H_{p}(C))\to0
$$
がある（左の写像は $[z]\otimes[w]\mapsto[z\otimes w]$）。$D$ も自由なら分裂する。
:::

::: proof
**Step 1.** \ref{at:algebraic-uct} の Step 1 と同じく $Z_{p}\defeq\ker\partial_{p}$, $B_{p}\defeq\operatorname{im}\partial_{p+1}$ は自由で、微分 $0$ の鎖複体の短完全列 $0\to Z\to C\to B[-1]\to0$（$(B[-1])_{p}=B_{p-1}$）は各次数で分裂する。$\otimes D$ しても短完全。

**Step 2（両端のホモロジー）.** $Z$ は微分 $0$ で各 $Z_{p}$ は自由なので、$(Z\otimes D)_{n}=\bigoplus Z_{p}\otimes D_{q}$ の微分は $\pm1\otimes\partial$ で、自由加群とのテンソル積は完全（直和のコピー）なので $H_{n}(Z\otimes D)=\bigoplus Z_{p}\otimes H_{q}(D)$。同様に $H_{n}(B[-1]\otimes D)=\bigoplus_{p+q=n}B_{p-1}\otimes H_{q}(D)$。

**Step 3（連結射）.** 長完全列の連結射 $\bigoplus B_{p-1}\otimes H_{q}(D)\to\bigoplus Z_{p-1}\otimes H_{q}(D)$ は、包含 $i\colon B\to Z$ の $\otimes1$（符号を除いて）：$b\otimes w$（$b=\partial c$）を $c\otimes w$ に持ち上げて境界をとると $\partial c\otimes w\pm c\otimes\partial w=b\otimes w$（$w$ はサイクル）。

**Step 4.** 長完全列から $0\to\operatorname{coker}(i\otimes1)_{n}\to H_{n}(C\otimes D)\to\ker(i\otimes1)_{n-1}\to0$。$0\to B_{p}\to Z_{p}\to H_{p}(C)\to0$ は $H_{p}(C)$ の自由分解なので、右完全性から $\operatorname{coker}=\bigoplus H_{p}(C)\otimes H_{q}(D)$、Tor の定義から $\ker(i_{p}\otimes1)=\mathrm{Tor}_{1}(H_{q}(D),H_{p}(C))$（$M\otimes N\cong N\otimes M$ で書き直す）。

**Step 5（分裂）.** $C$, $D$ がともに自由なら、射影 $r_{C}\colon C_{p}\to Z_{p}(C)$, $r_{D}\colon D_{q}\to Z_{q}(D)$（\ref{at:algebraic-uct} の Step 4）をとり、$\Pi\defeq(\pi_{C}r_{C})\otimes(\pi_{D}r_{D})\colon C\otimes D\to H(C)\otimes H(D)$（$\pi$ はホモロジー類への写像）とおく。$\Pi$ は境界 $\partial a\otimes b\pm a\otimes\partial b$ を $0$ に送る（$\pi_{C}r_{C}\partial a=\pi_{C}\partial a=0$）ので $H(C\otimes D)\to H(C)\otimes H(D)$ を誘導し、$[z]\otimes[w]\mapsto[z\otimes w]\mapsto[z]\otimes[w]$ なので左逆。
:::

::: theorem アイレンバーグ–ジルバーの定理 {#at:eilenberg-zilber keywords="Eilenberg-Zilber theorem: natural chain homotopy equivalence S(X x Y) ~ S(X) (x) S(Y)" index="アイレンバーグ–ジルバーの定理|あいれんばーぐじるばーのていり"}
空間 $X,Y$ について自然な鎖ホモトピー同値 $S(X\times Y)\simeq S(X)\otimes S(Y)$ があり、次数 $0$ では $(x,y)\mapsto x\otimes y$。
:::

::: proof
**Step 1（関手とモデル）.** $\mathcal{C}=\mathbf{Top}\times\mathbf{Top}$ とし、$F(X,Y)\defeq S(X\times Y)$, $G(X,Y)\defeq S(X)\otimes S(Y)$（添加付き）とする。$F$ はモデル $\mathcal{M}_{n}=\{(\Delta^{n},\Delta^{n})\}$、元 $m=(\iota_{n},\iota_{n})$（対角写像 $\Delta^{n}\to\Delta^{n}\times\Delta^{n}$）の上で自由：特異単体 $\sigma=(\sigma_{1},\sigma_{2})\colon\Delta^{n}\to X\times Y$ は $(\sigma_{1}\times\sigma_{2})\circ m$ とただ一通りに書ける。$G$ はモデル $\mathcal{M}_{n}=\{(\Delta^{p},\Delta^{q}):p+q=n\}$、元 $\iota_{p}\otimes\iota_{q}$ の上で自由：基底 $\sigma\otimes\tau$ は $(\sigma,\tau)_{*}(\iota_{p}\otimes\iota_{q})$ とただ一通りに書ける。

**Step 2（非輪状性）.** $F$ は両方のモデルで非輪状：$\Delta^{n}\times\Delta^{n}$ も $\Delta^{p}\times\Delta^{q}$ も凸で可縮なので被約ホモロジーは $0$（\ref{at:singular-homotopy-invariance}）。$G$ も両方のモデルで非輪状：$S(\Delta^{p})$ のホモロジーは次数 $0$ の $\mathbb{Z}$ だけ（自由）なので、\ref{at:algebraic-kunneth} から $H(S(\Delta^{p})\otimes S(\Delta^{q}))$ も次数 $0$ の $\mathbb{Z}\otimes\mathbb{Z}$ だけで、添加写像はその同型（$\varepsilon(x\otimes y)=1$）。

**Step 3.** \ref{at:acyclic-models} の 1 で自然な添加鎖写像 $\theta\colon F\to G$, $\psi\colon G\to F$ をとる。$\psi\theta$ と $1_{F}$ はともに $F\to F$ の自然な添加鎖写像で、$F$ は自分のモデルの上で非輪状なので、2 から自然に鎖ホモトープ。同様に $\theta\psi\simeq1_{G}$。次数 $0$ では、添加写像と両立する自然な写像は $(x,y)\leftrightarrow x\otimes y$ に限る（モデル $(\Delta^{0},\Delta^{0})$ の上で値が 1 点の対の生成元に決まる）。
:::

::: theorem キュネットの定理 {#at:kunneth keywords="Kunneth theorem for singular homology of products; cross product; field coefficients" index="キュネットの定理|きゅねっとのていり, クロス積|くろすせき"}
空間 $X,Y$ について、自然な分裂短完全列
$$
0\to\bigoplus_{p+q=n}H_{p}(X)\otimes H_{q}(Y)\xrightarrow{\times}H_{n}(X\times Y)\to\bigoplus_{p+q=n-1}\mathrm{Tor}^{\mathbb{Z}}_{1}(H_{q}(Y),H_{p}(X))\to0
$$
がある。左の写像 $\times$（**クロス積**）は $[a]\times[b]\defeq[\psi(a\otimes b)]$。体 $k$ 係数では $H_{n}(X\times Y;k)\cong\bigoplus_{p+q=n}H_{p}(X;k)\otimes_{k}H_{q}(Y;k)$。
:::

::: proof
\ref{at:eilenberg-zilber} と \ref{at:algebraic-kunneth}（$S(X)$, $S(Y)$ は自由）。体係数では、$S(X;k)\defeq S(X)\otimes k$ について $S(X\times Y)\otimes k\simeq(S(X)\otimes k)\otimes_{k}(S(Y)\otimes k)$ で、$k$ 上のベクトル空間の鎖複体は自由で Tor が消える（同じ証明を $\mathbb{Z}$ の代わりに体 $k$ 上で行う）。
:::

::: example
1. **球面の積**：$m,n\ge1$ で $H_{*}(S^{m}\times S^{n})$ は次数 $0,m,n,m+n$ に $\mathbb{Z}$（$m=n$ なら次数 $n$ は $\mathbb{Z}^{2}$）。
2. **トーラス** $T^{n}=(S^{1})^{n}$：帰納法で $H_{k}(T^{n})\cong\mathbb{Z}^{\binom{n}{k}}$（Tor は消える）。
3. **Tor が現れる例**：$H_{3}(\mathbb{R}P^{2}\times\mathbb{R}P^{2})\supset\mathrm{Tor}_{1}(H_{1},H_{1})=\mathrm{Tor}_{1}(\mathbb{Z}/2,\mathbb{Z}/2)\cong\mathbb{Z}/2$（\ref{ha:tor-z}）で、テンソル積の項は $H_{p}\otimes H_{q}$（$p+q=3$）で $H_{2}(\mathbb{R}P^{2})=0$ なので $0$。よって $H_{3}(\mathbb{R}P^{2}\times\mathbb{R}P^{2})\cong\mathbb{Z}/2$。
4. **オイラー標数**：有限 CW 複体について $\chi(X\times Y)=\chi(X)\chi(Y)$（$\mathbb{Q}$ 係数のキュネットから、ベッチ数の母関数 $P_{X}(t)=\sum b_{n}t^{n}$ について $P_{X\times Y}=P_{X}P_{Y}$、$t=-1$ を代入）。
:::

::: supplement
**一般化.** 非輪状モデルの定理は、特異ホモロジーのホモトピー不変性（モデル $\Delta^{n}$ と $\Delta^{n}\times I$）や、カップ積の結合性・可換性の証明（\ref[特異コホモロジーとカップ積]{at:page-singular-cohomology}）にも使える汎用の道具である。明示的な鎖写像としては、$\theta$ にアレクサンダー–ホイットニー写像 $\sigma\mapsto\sum_{p+q=n}\sigma\restriction[e_{0},\dots,e_{p}]\otimes\sigma\restriction[e_{p},\dots,e_{n}]$（成分ごとに射影したもの）、$\psi$ にシャッフル写像（$\Delta^{p}\times\Delta^{q}$ の標準的な三角形分割による）をとれることが知られている（プリズム作用素 \ref{at:singular-homotopy-invariance} は $q=1$ のシャッフル写像にあたる）。

**高い視点.** アイレンバーグ–ジルバーの定理は、特異鎖関手 $S\colon\mathbf{Top}\to\mathrm{Ch}$ が「ホモトピーを除いて」モノイダル関手（積をテンソル積に移す）であることを言っている。これを精密化すると $S(X)$ は $E_{\infty}$ 余代数の構造をもち、コホモロジー側でのカップ積の可換性（次数付き可換）と、それが鎖レベルでは「ホモトピーを除いてしか可換でない」こと（スティーンロッド平方の源）が説明される（\ref{cat:page-little-disks} の $E_{n}$ オペラッドの話と同じ現象）。比喩で言えば、非輪状モデルの定理は「設計図を標準部品（モデル）の上でだけ決めれば、あとは自然性が自動的に全部の空間に配ってくれる」という原理で、モデルが可縮（非輪状）であることが、その設計図の選び方の自由度がホモトピーで吸収できることを保証している。
:::

## 問題 {#at:sec-ku-problems}

::: problem {#at:prob-torus-betti}
$T^{n}$ のベッチ数の母関数が $(1+t)^{n}$ であることを示せ。
:::

::: solution
$P_{S^{1}}(t)=1+t$ と \ref{at:kunneth} の例 4 の乗法性から。
:::

::: problem {#at:prob-product-not-sphere}
$S^{2}\times S^{2}$ と $S^{4}\vee S^{2}\vee S^{2}$ は同じホモロジー群をもつことを示せ（両者がホモトピー同値でないことはカップ積で示す：\ref[特異コホモロジーとカップ積]{at:page-singular-cohomology}）。
:::

::: solution
$S^{2}\times S^{2}$：次数 $0,2,2,4$ に $\mathbb{Z}$ で $H_{2}=\mathbb{Z}^{2}$, $H_{4}=\mathbb{Z}$。ウェッジ：被約ホモロジーは各球面の和（\ref{at:prob-wedge-spheres} の議論を繰り返す）で、$H_{2}=\mathbb{Z}^{2}$, $H_{4}=\mathbb{Z}$。
:::

::: problem {#at:prob-kunneth-z2}
$H_{*}(\mathbb{R}P^{2}\times\mathbb{R}P^{2};\mathbb{Z}/2)$ を求めよ。
:::

::: solution
体係数のキュネットで、$H_{*}(\mathbb{R}P^{2};\mathbb{Z}/2)$ は次数 $0,1,2$ に $\mathbb{Z}/2$（\ref{at:uct-homology} の後の例）なので、積の次数 $n$ の次元は $(1+t+t^{2})^{2}=1+2t+3t^{2}+2t^{3}+t^{4}$ の係数。
:::
