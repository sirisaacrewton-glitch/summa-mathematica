単体的・特異・胞体ホモロジー、ホモトピー不変性、相対ホモロジーと切除、マイヤー–ヴィートリス、球面のホモロジーと領域不変性・ジョルダン–ブラウワーの分離定理、CW 複体、単体的・胞体・特異ホモロジーの一致、アイレンバーグ–スティーンロッドの公理と一意性、普遍係数定理とキュネットの定理。
