# 単体的ホモロジーと特異ホモロジーの一致 {#at:page-simplicial-singular keywords="comparison of simplicial (Delta-complex) homology and singular homology, the identity simplex generates H_n(Delta^n, boundary), topological invariance of simplicial homology, Euler characteristic of a triangulation, Euler polyhedron formula, simplicial chains as cellular chains, simplicial approximation theorem"}

単体的ホモロジー（\ref{at:page-simplicial-homology}）は Δ 複体の組合せ的な構造から有限の計算で求まるが、分割の仕方に依存するように見える。特異ホモロジー（\ref{at:page-singular-homology}）は空間だけで決まるが、直接は計算できない。このページでは、有限 Δ 複体 $X$ について、各単体をその特性写像（特異単体）に送る鎖写像 $C(X)\to S(|X|)$ がホモロジーの同型を誘導することを示す。これで単体的ホモロジーとオイラー標数は三角形分割によらない位相不変量になり、たとえば球面のどんな三角形分割でも $V-E+F=2$ が成り立つ。

> 資料：Massey『Singular Homology Theory』、Fulton『Algebraic Topology』の比較定理の節などの標準的な内容。恒等単体が生成元であることの帰納的な証明は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-ss-notation}

::: notation
- Δ 複体・幾何学的実現・単体的鎖複体は \ref{at:delta-complex}, \ref{at:simplicial-chains}。有向単体の鎖複体と順序 \ref{at:oriented-ordered-iso}。オイラー–ポアンカレ \tref{at:euler-poincare}。
- 特異ホモロジー・相対ホモロジー・長完全列・三つ組 \ref{at:singular-homology}, \ref{at:pair-long-exact}、良い対 \ref{at:good-pair}、CW 複体と骨格の対 \ref{at:cw-complex}, \ref{at:skeleton-pairs}、胞体ホモロジー \ref{at:cellular-singular}。五項補題 \tref{ha:five-lemma}。
- $\iota_{n}\defeq1_{\Delta^{n}}$（恒等写像を特異 $n$ 単体と見たもの）。$\partial\Delta^{n}\defeq\bigcup_{i}\delta^{i}(\Delta^{n-1})$。
- **選択公理**：使わない。
:::

## 恒等単体と相対ホモロジー {#at:sec-ss-identity}

::: lemma 恒等単体は生成元 {#at:identity-simplex-generator keywords="the identity singular simplex represents a generator of H_n(Delta^n, boundary Delta^n)" index="恒等単体|こうとうたんたい"}
$n\ge0$ について、$\iota_{n}$ は相対サイクルで、その類は $H_{n}(\Delta^{n},\partial\Delta^{n})\cong\mathbb{Z}$ の生成元である（$n=0$ では $\partial\Delta^{0}=\varnothing$）。
:::

::: proof
**Step 1（$n=0$）.** $H_{0}(\Delta^{0})=\mathbb{Z}$ は 1 点の類 $\iota_{0}$ で生成される。

**Step 2（設定）.** $n\ge1$ とし、$\Lambda\defeq\bigcup_{i\ge1}\delta^{i}(\Delta^{n-1})$（$\Delta^{n}$ の面のうち頂点 $e_{0}$ を含むものの和）とする。$\Lambda$ は $e_{0}$ について星形（$e_{0}$ と $\delta^{i}$ 面の点を結ぶ線分は同じ凸な面に入る）なので可縮。三つ組 $\Lambda\subset\partial\Delta^{n}\subset\Delta^{n}$ を考える。

**Step 3（第 1 の同型）.** $\Delta^{n}$ と $\Lambda$ は可縮なので、対 $(\Delta^{n},\Lambda)$ の被約長完全列から $H_{*}(\Delta^{n},\Lambda)=0$。三つ組の長完全列（\ref{at:pair-long-exact}）から、連結射 $\partial\colon H_{n}(\Delta^{n},\partial\Delta^{n})\to H_{n-1}(\partial\Delta^{n},\Lambda)$ は同型。

**Step 4（第 2 の同型）.** 面の埋め込み $\delta^{0}\colon(\Delta^{n-1},\partial\Delta^{n-1})\to(\partial\Delta^{n},\Lambda)$ はホモロジーの同型を誘導する：両者は良い対（$\partial\Delta^{n-1}$ は $\Delta^{n-1}$ から重心を除いたものの変位レトラクト、$\Lambda$ は $\partial\Delta^{n}$ から 0 番目の面の重心を除いたものの変位レトラクト（その面の中での放射状の射影））で、$\delta^{0}$ は商の同相 $\Delta^{n-1}/\partial\Delta^{n-1}\cong\partial\Delta^{n}/\Lambda$ を誘導する（コンパクトからハウスドルフへの連続全単射）。\ref{at:good-pair} から結論。

**Step 5（計算）.** $H_{n-1}(\partial\Delta^{n},\Lambda)$ で、$\partial\iota_{n}=\sum_{i}(-1)^{i}\delta^{i}\equiv\delta^{0}$（$i\ge1$ の項は $\Lambda$ の鎖）$=\delta^{0}_{\#}\iota_{n-1}$。帰納法の仮定から $[\iota_{n-1}]$ は生成元なので、Step 3・4 の同型で $[\iota_{n}]$ も生成元。
:::

## 比較定理 {#at:sec-ss-comparison}

::: theorem 単体的ホモロジーと特異ホモロジーの一致 {#at:simplicial-singular-iso keywords="for a finite Delta-complex X the chain map C(X) -> S(|X|), sigma -> characteristic map, induces isomorphisms on homology, also relative to subcomplexes" index="単体的ホモロジーと特異ホモロジーの一致|たんたいてきほもろじーととくいほもろじーのいっち"}
有限 Δ 複体 $X$ について、$n$ 単体 $x\in X_{n}$ をその特性写像 $\sigma_{x}\colon\Delta^{n}\to\{x\}\times\Delta^{n}\to|X|$ に送る写像は鎖写像 $\theta\colon C(X)\to S(|X|)$ で、すべての $n$ で同型 $H_{n}(X)\cong H_{n}(|X|)$ を誘導する。部分 Δ 複体 $A$ についても $H_{n}(X,A)\cong H_{n}(|X|,|A|)$。
:::

::: proof
**Step 1（鎖写像）.** 実現の同値関係 $(d_{i}x,t)\sim(x,\delta^{i}t)$ から $\sigma_{x}\circ\delta^{i}=\sigma_{d_{i}x}$。よって $\partial\theta(x)=\sum(-1)^{i}\sigma_{x}\delta^{i}=\theta(\partial x)$。

**Step 2（実現は CW 複体）.** $X^{k}$ を $k$ 次以下の単体からなる部分 Δ 複体とすると、$|X^{k}|$ は $|X^{k-1}|$ に $k$ 単体の数だけ $\Delta^{k}\cong D^{k}$ を、$\sigma_{x}\restriction\partial\Delta^{k}$ で貼り付けたもの（$\bigsqcup X_{n}\times\Delta^{n}$ の商を次元の低い順に作ったものと同じ商空間）。よって $|X|$ は $|X^{k}|$ を $k$ 骨格とする有限 CW 複体で、$\sigma_{x}$ が特性写像。

**Step 3（相対項の同型）.** 鎖複体の商 $C(X^{k})/C(X^{k-1})$ は次数 $k$ の $\mathbb{Z}^{X_{k}}$ だけで微分は $0$ なので、$H_{n}(X^{k},X^{k-1})$ は $n=k$ で $\mathbb{Z}^{X_{k}}$、他は $0$。$\theta$ は $x\mapsto\sigma_{x*}[\iota_{k}]\in H_{k}(|X^{k}|,|X^{k-1}|)$ を誘導し、\ref{at:identity-simplex-generator} と \ref{at:skeleton-pairs.3}（$u_{k}$ として $[\iota_{k}]$ を $\Delta^{k}\cong D^{k}$ で写したものをとる）から、これは基底を基底に写す同型。

**Step 4（骨格についての帰納法）.** $\theta$ は対 $(X^{k},X^{k-1})$ と $(|X^{k}|,|X^{k-1}|)$ の長完全列の間の可換図式を与える（短完全列 $0\to C(X^{k-1})\to C(X^{k})\to C(X^{k})/C(X^{k-1})\to0$ から $S$ の対応する列への写像、連結射の自然性 \ref{ha:connecting-natural}）。$H_{n}(X^{k-1})\to H_{n}(|X^{k-1}|)$ が同型（帰納法の仮定。$k=0$ では $X^{0}$ は有限個の点で、両辺とも点の数を階数とする $H_{0}$ だけ）で、相対項も同型（Step 3）なので、五項補題で $H_{n}(X^{k})\cong H_{n}(|X^{k}|)$。$X=X^{N}$ で結論。

**Step 5（相対版）.** $A$ と $X$ について同型なので、対の長完全列と五項補題から。

::: hypcheck
- 有限性は Step 4 の帰納法を有限回で終わらせることと、Step 2（有限 CW 複体）に使った。無限 Δ 複体でも成り立つ（コンパクト台の議論と、CW 複体のコンパクト集合は有限個の胞体としか交わらないこと（\ref{at:cw-finite-subcomplex}）による。ここでは詳細を書かない）。
- 選択公理は使わない。
:::
:::

::: corollary 単体的ホモロジーの位相不変性 {#at:simplicial-topological-invariance keywords="simplicial homology and Euler characteristic of a finite simplicial complex depend only on the polyhedron; Euler's polyhedron formula V - E + F = 2 for triangulations of S^2" index="単体的ホモロジーの位相不変性|たんたいてきほもろじーのいそうふへんせい, オイラーの多面体定理|おいらーのためんたいていり"}
1. 有限単体複体 $K$ について $H_{n}(K)\cong H_{n}(|K|)$。したがって $|K|\cong|L|$（同相）なら $H_{n}(K)\cong H_{n}(L)$、$\chi(K)=\chi(L)$。
2. $S^{2}$ の三角形分割の頂点・辺・三角形の数は $V-E+F=2$ を満たす。
:::

::: proof
1：頂点に順序を入れた Δ 複体 $K_{<}$（\ref{at:oriented-ordered-iso}）について $|K_{<}|\to|K|$（各単体を対応する幾何学的単体にアフィンに写す）は連続な全単射で、定義域はコンパクト、$|K|\subset\mathbb{R}^{N}$ はハウスドルフなので同相。\ref{at:simplicial-singular-iso} と \ref{at:oriented-ordered-iso} から $H_{n}(K)\cong H_{n}(K_{<})\cong H_{n}(|K|)$。$\chi$ はベッチ数の交代和（\ref{at:euler-poincare}）で、ベッチ数は $H_{n}\otimes\mathbb{Q}$ の次元（\ref{at:cw-homology-consequences.2} の証明と同じく、$\otimes\mathbb{Q}$ の完全性による）なので位相不変。2：$\chi(S^{2})=1-0+1=2$（\ref{at:sphere-homology}）。
:::

::: corollary 単体鎖と胞体鎖 {#at:simplicial-cellular-chains keywords="for a Delta-complex the cellular chain complex of |X| is isomorphic to the simplicial chain complex" index="単体鎖と胞体鎖|たんたいさとほうたいさ"}
有限 Δ 複体 $X$ について、$\theta$ は鎖複体の同型 $C(X)\cong C^{\mathrm{CW}}(|X|)$ を誘導する。
:::

::: proof
次数ごとの同型は \ref{at:simplicial-singular-iso} の Step 3。境界：Δ 複体の側でも $C(X)$ の境界 $\partial$ は「対 $(X^{k},X^{k-1})$ の連結射の後に $(X^{k-1},X^{k-2})$ へ写す」合成 $j\circ\partial$ に一致する（$C(X^{k})/C(X^{k-1})=C_{k}(X)$ と同一視すると、連結射は代表元に $\partial$ を施すだけ）。$\theta$ は両方の長完全列と可換なので、$C^{\mathrm{CW}}$ の境界 $d=j\circ\partial$ と対応する。
:::

::: remark
単体近似定理（\ref[単体近似定理]{at:simplicial-approximation}。次ページで証明する）は、単体複体の間の連続写像が、定義域を十分細かく重心細分すれば単体写像とホモトープであることを主張する。本ページでは、ホモロジーの位相不変性を特異ホモロジー経由で示したので、この定理は使わない。
:::

::: supplement
**歴史と比較.** 特異ホモロジーが整備される前は、単体的ホモロジーの位相不変性を単体近似定理で示した（$f$ の単体近似の誘導写像が細分の取り方によらないことを示す）。特異ホモロジー経由の証明は、ホモトピー不変性と切除という一般的な性質だけを使い、組合せ論的な細分の議論をほぼ必要としない（重心細分は切除の証明の中で特異鎖に対して一度だけ使った）。

**高い視点.** \ref{at:simplicial-singular-iso} は、「Δ 複体の組合せ的な情報から作った鎖複体」と「空間から作った巨大な鎖複体」が、鎖ホモトピー同値（自由な鎖複体の間のホモロジー同型は鎖ホモトピー同値になる）であることを主張している。圏論的には、実現関手 $|\cdot|$ と特異 Δ 複体 $\operatorname{Sing}$ の随伴の単位 $X\to\operatorname{Sing}|X|$ が鎖複体のレベルで弱同値を与えることにあたる。比喩で言えば、職人（単体的ホモロジー）が設計図から数えた穴の数と、検査官（特異ホモロジー）が完成品をあらゆる角度から調べた穴の数が一致することの保証である。
:::

## 問題 {#at:sec-ss-problems}

::: problem {#at:prob-platonic}
凸多面体の表面（$S^{2}$ と同相であることは知られている）で、すべての面が $p$ 角形、各頂点に $q$ 個の面が集まるもの（$p,q\ge3$）について、$V-E+F=2$（各面を三角形に分割して \ref{at:simplicial-topological-invariance} を使う）から $\frac1p+\frac1q>\frac12$ を導き、$(p,q)$ が $(3,3),(3,4),(4,3),(3,5),(5,3)$ に限ることを示せ。
:::

::: solution
$p$ 角形の面を、面の中に 1 点を加えて $p$ 個の三角形に分けると、$V'=V+F$, $E'=E+pF$, $F'=pF$ で $V'-E'+F'=V-E+F$。よって $V-E+F=2$。辺は 2 つの面に属するので $pF=2E$、頂点には $q$ 本の辺が集まるので $qV=2E$。代入して $\frac{2E}{q}-E+\frac{2E}{p}=2$、すなわち $\frac1p+\frac1q=\frac12+\frac1E>\frac12$。$p,q\ge3$ でこれを満たすのは列挙した 5 組（$p=3$ なら $q<6$、$p=4$ なら $q<4$、$p=5$ なら $q<\frac{10}{3}$、$p\ge6$ なら解なし）。
:::

::: problem {#at:prob-torus-two-structures}
トーラスの Δ 複体（\ref{at:delta-complex} の例 2）と、CW 構造（0 胞体 1 個、1 胞体 2 個、2 胞体 1 個）のそれぞれでホモロジーを計算し、一致することを確かめよ。
:::

::: solution
Δ 複体では \ref{at:simplicial-chains} の後の計算例 1 で $(\mathbb{Z},\mathbb{Z}^{2},\mathbb{Z})$。CW 構造では \ref{at:surface-homology}（$g=1$）で同じ。両者は \ref{at:simplicial-singular-iso} と \ref{at:cellular-singular} によりどちらも $H_{*}(T)$ に一致する。
:::
