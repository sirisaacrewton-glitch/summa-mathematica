# 統計学（Statistics）

推定・検定・回帰・ベイズ統計・時系列・極値統計。確率論の厳密な証明を参照しつつ、主張と証明の流れをやさしく説明する。

<p class="mn-msc">MSC2020: 62</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-estimation/index.html"><span class="mn-card-title">推定</span><span class="mn-card-en">Estimation</span><span class="mn-card-desc">標本と統計量、正規標本の分布（χ²・t 分布）、点推定（モーメント法・最尤法）、フィッシャー情報量とクラメール–ラオの不等式、十分統計量、大標本理論（スルツキーの定理・デルタ法）、信頼区間。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="02-testing/index.html"><span class="mn-card-title">仮説検定</span><span class="mn-card-en">Hypothesis Testing</span><span class="mn-card-desc">検定の枠組みと p 値、ネイマン–ピアソンの補題と一様最強力検定、正規母集団の t 検定、尤度比検定とウィルクスの定理、多次元の中心極限定理とピアソンのカイ二乗検定、多重検定（ホルム、ベンジャミニ–ホッホベルク）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="03-regression/index.html"><span class="mn-card-title">回帰と多変量解析</span><span class="mn-card-en">Regression and Multivariate Analysis</span><span class="mn-card-desc">最小二乗法を直交射影として、ガウス–マルコフの定理、正規線形モデルの t 検定・F 検定、主成分分析、過学習とリッジ回帰・ラッソ。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="04-bayes/index.html"><span class="mn-card-title">ベイズ統計</span><span class="mn-card-en">Bayesian Statistics</span><span class="mn-card-desc">事前分布と事後分布、ベイズ推定量の最適性と信用区間、共役事前分布と予測分布、事後分布の一致性、マルコフ連鎖モンテカルロ法（メトロポリス–ヘイスティングス、ギブス）。</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="05-time-series-extremes/index.html"><span class="mn-card-title">時系列と極値統計</span><span class="mn-card-en">Time Series and Extreme Values</span><span class="mn-card-desc">ポアソン過程、弱定常過程と自己回帰モデル、最大値の極限分布（グンベル・フレシェ・ワイブル）、裾の重い分布と 1 回の大きな跳び。</span><span class="mn-card-count">5 ページ</span></a>
</div>
