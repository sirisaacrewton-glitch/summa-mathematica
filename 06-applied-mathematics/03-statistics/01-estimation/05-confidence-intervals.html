# 区間推定 {#stat:page-confidence-intervals keywords="confidence intervals and confidence level, correct frequentist interpretation and common misreadings, pivotal quantities, z interval with known variance, Student t interval for a normal mean, chi-square interval for a normal variance, asymptotic confidence intervals via Slutsky, Wald interval for a proportion and its coverage problems, Wilson interval, bootstrap idea, duality with tests"}

点推定は一つの値を答えるが、その値がどれほど信頼できるかは語らない。**区間推定**は「真の値はこの範囲にある」と幅をもって答え、その答え方の信頼性を確率で保証する。ただし、その確率は「手続きが当たる確率」であって、「計算された特定の区間に真の値が入っている確率」ではない。この区別が区間推定の最も誤解されやすい点である。このページでは、正規標本の正確な区間（$t$ 区間・$\chi^{2}$ 区間）と、大標本理論に基づく近似的な区間を作る。

## 記法と定義の確認 {#stat:sec-ci-notation}

::: notation
- 正規標本の分布についての結果は \ref{stat:normal-sample-theorem}, \ref{stat:chi-square-t}, \ref{stat:chi-square-density}, \ref{stat:t-density}。大標本理論の道具は \ref{stat:slutsky}, \ref{stat:consistency}、中心極限定理は \ref{prb:clt}。
- $\Phi$ は標準正規分布の分布関数、$0<\alpha<1$ について $z_{\alpha}$ は $1-\Phi(z_{\alpha})=\alpha$ をみたす数（上側 $\alpha$ 点）。同様に $t_{k,\alpha}$, $\chi_{k,\alpha}^{2}$ は $t_{k}$, $\chi_{k}^{2}$ の上側 $\alpha$ 点（これらの分布は連続な密度をもつので存在する）。
- 体系は $\ZFC$。
:::

## 信頼区間 {#stat:sec-ci-definition}

::: definition 信頼区間 {#stat:confidence-interval keywords="a confidence interval of level 1 - alpha for g(theta) is a pair of statistics L <= U with P_theta(L <= g(theta) <= U) >= 1 - alpha for every theta; exact if equality; asymptotic if liminf of the coverage >= 1 - alpha; pivotal quantity" index="信頼区間|しんらいくかん, 信頼係数|しんらいけいすう, 被覆確率|ひふくかくりつ, 枢軸量|すうじくりょう" refname="信頼区間"}
1. 統計量 $L\le U$ の組が、すべての $\theta$ で
$$
P_{\theta}\bigl(L\le g(\theta)\le U\bigr)\ge1-\alpha
$$
をみたすとき、$[L,U]$ を $g(\theta)$ の**信頼係数** $1-\alpha$ の**信頼区間**という。左辺を**被覆確率**という。
2. 標本の大きさ $n$ ごとの区間 $[L_{n},U_{n}]$ が、すべての $\theta$ で $\liminf_{n}P_{\theta}(L_{n}\le g(\theta)\le U_{n})\ge1-\alpha$ をみたすとき、**漸近的な**信頼区間という。
3. データと $\theta$ の関数 $Q(X,\theta)$ で、その分布が $\theta$ によらないものを**枢軸量**という。
:::

::: intuition
信頼区間は「網」である。網を投げる手続き（データから区間を作る規則）は、真の値を $1-\alpha$ の確率で捕まえるように作られている。一度投げた後の網に魚が入っているかどうかは決まっていて、確率の問題ではない。「95% の確率でこの区間に真の値がある」と読むのは誤りで、正しくは「この手続きを繰り返すと、作られる区間の 95% が真の値を含む」である。
:::

::: remark
**よくある誤解.** (1) 計算された区間 $[1.2,3.4]$ について「$\theta$ がこの区間にある確率は 95%」と言うのは、$\theta$ を確率変数とみなすベイズ統計の言い方で、ここでの信頼区間の意味ではない（ベイズの信用区間は別の概念で、事前分布に依存する）。(2) 区間の外の値が「ありえない」わけではない。(3) 2 つの信頼区間が重なることは、差が有意でないことを意味しない（重なっていても差の検定は有意になりうる）。
:::

## 正規標本の正確な信頼区間 {#stat:sec-ci-exact}

::: theorem 正規平均の t 区間 {#stat:t-interval keywords="for an i.i.d. N(m, sigma^2) sample, [bar X - t_{n-1, alpha/2} S / sqrt(n), bar X + t_{n-1, alpha/2} S / sqrt(n)] has coverage exactly 1 - alpha; with known sigma, bar X +- z_{alpha/2} sigma / sqrt(n)" index="t 区間|てぃーくかん, スチューデントの t|すちゅーでんとのてぃー" refname="正規平均の t 区間"}
$N(m,\sigma^{2})$（$m,\sigma^{2}$ とも未知）からの標本（$n\ge2$）について、
$$
\Bigl[\bar X-t_{n-1,\alpha/2}\frac{S}{\sqrt n},\ \bar X+t_{n-1,\alpha/2}\frac{S}{\sqrt n}\Bigr]
$$
は $m$ の信頼係数 $1-\alpha$ の信頼区間で、被覆確率はちょうど $1-\alpha$。$\sigma$ が既知なら $\bar X\pm z_{\alpha/2}\sigma/\sqrt n$ が同じ性質をもつ。
:::

::: intuition
$T=\frac{\sqrt n(\bar X-m)}{S}$ は $m$ を含むが、その分布 $t_{n-1}$ は $m$ にも $\sigma$ にもよらない（枢軸量）。「$T$ が $\pm t_{n-1,\alpha/2}$ の間にある」という確率 $1-\alpha$ の出来事を、$m$ について解き直したのが $t$ 区間である。$\sigma$ を $S$ で置き換えた不確かさの分だけ、正規分布の $z$ より裾の重い $t$ 分布の点を使う。
:::

::: proof
**Step 1（枢軸量）.** 【主張：$T$ の分布は $t_{n-1}$ でパラメータによらない】\ref{stat:normal-sample-theorem} の 4 から $T\defeq\frac{\sqrt n(\bar X-m)}{S}\sim t_{n-1}$ で、これは $(m,\sigma^{2})$ によらない。

**Step 2（対称性）.** $t_{n-1}$ は原点について対称（定義で $Z$ を $-Z$ に替えても分布は同じ）で、連続な密度をもつ（\ref{stat:t-density}）ので、$P(\abs T\le t_{n-1,\alpha/2})=1-2\cdot\frac\alpha2=1-\alpha$。

**Step 3（書き直し）.** $\abs T\le c$ と $\bar X-c\frac S{\sqrt n}\le m\le\bar X+c\frac S{\sqrt n}$ は同値（$S>0$ a.s.）。$\sigma$ 既知の場合は $\frac{\sqrt n(\bar X-m)}\sigma\sim N(0,1)$ で同じ議論。
:::

::: proposition 正規分散の χ² 区間 {#stat:chi-square-interval keywords="[(n-1) S^2 / chi^2_{n-1, alpha/2}, (n-1) S^2 / chi^2_{n-1, 1-alpha/2}] is an exact 1 - alpha confidence interval for sigma^2 under normality; sensitive to non-normality" index="分散の信頼区間|ぶんさんのしんらいくかん" refname="正規分散の χ² 区間"}
正規標本について
$$
\Bigl[\frac{(n-1)S^{2}}{\chi_{n-1,\alpha/2}^{2}},\ \frac{(n-1)S^{2}}{\chi_{n-1,1-\alpha/2}^{2}}\Bigr]
$$
は $\sigma^{2}$ の信頼係数 $1-\alpha$ の信頼区間で、被覆確率はちょうど $1-\alpha$。
:::

::: intuition
分散の枢軸量 $\chi^{2}$ は左右非対称なので、区間も推定値のまわりで非対称になる。分散が大きい側に長く伸びる。
:::

::: proof
**Step 1（枢軸量と書き直し）.** $V\defeq\frac{(n-1)S^{2}}{\sigma^{2}}\sim\chi_{n-1}^{2}$（\ref{stat:normal-sample-theorem} の 2）で、$P(\chi_{n-1,1-\alpha/2}^{2}\le V\le\chi_{n-1,\alpha/2}^{2})=1-\alpha$（連続分布）。この不等式を $\sigma^{2}$ について解く。
:::

## 漸近的な信頼区間 {#stat:sec-ci-asymptotic}

::: theorem 漸近的な信頼区間 {#stat:asymptotic-interval keywords="if sqrt(n)(T_n - g(theta)) => N(0, v(theta)) with v(theta) > 0 and v-hat_n -> v(theta) in probability, then T_n +- z_{alpha/2} sqrt(v-hat_n / n) is an asymptotic 1 - alpha confidence interval; Wald interval for a mean or a proportion" index="漸近的な信頼区間|ぜんきんてきなしんらいくかん, ワルド区間|わるどくかん" refname="漸近的な信頼区間"}
$\sqrt n(T_{n}-g(\theta))\Rightarrow N(0,v(\theta))$、$v(\theta)>0$ で、$\hat v_{n}\xrightarrow{P}v(\theta)$ なら
$$
\lim_{n\to\infty}P_{\theta}\Bigl(\abs{T_{n}-g(\theta)}\le z_{\alpha/2}\sqrt{\hat v_{n}/n}\Bigr)=1-\alpha.
$$
:::

::: intuition
正確な分布がわからなくても、標本が大きければ誤差は正規分布で近似できる。未知の分散を推定値で置き換えても、スルツキーの定理によって極限は変わらない。
:::

::: proof
**Step 1（標準化）.** \ref{stat:continuous-mapping-probability} から $\hat v_{n}^{-1/2}\xrightarrow{P}v(\theta)^{-1/2}$（$\hat v_{n}>0$ となる確率は $\to1$）。\ref{stat:slutsky} から $\frac{\sqrt n(T_{n}-g(\theta))}{\sqrt{\hat v_{n}}}\Rightarrow N(0,1)$。

**Step 2（被覆確率）.** $\pm z_{\alpha/2}$ は $\Phi$ の連続点なので、法則収束から $P(\abs{\cdot}\le z_{\alpha/2})\to\Phi(z_{\alpha/2})-\Phi(-z_{\alpha/2})=1-\alpha$。
:::

::: example 比率の信頼区間 {#stat:proportion-interval keywords="Wald interval p-hat +- z sqrt(p-hat(1 - p-hat)/n); poor coverage for small n or p near 0, 1; Wilson score interval by inverting |p-hat - p| <= z sqrt(p(1-p)/n)" index="比率の信頼区間|ひりつのしんらいくかん, ウィルソンの区間|うぃるそんのくかん" refname="比率の信頼区間"}
ベルヌーイ標本で $\hat p=\bar X$ とすると、中心極限定理から $\sqrt n(\hat p-p)\Rightarrow N(0,p(1-p))$、$\hat p(1-\hat p)\to p(1-p)$ なので、\ref{stat:asymptotic-interval} から
$$
\hat p\pm z_{\alpha/2}\sqrt{\hat p(1-\hat p)/n}\qquad\text{（ワルド区間）}
$$
は $0<p<1$ で漸近的な信頼区間。ただし $p$ が $0$ や $1$ に近いと収束は遅く、例えば $\hat p=0$ なら区間は 1 点 $\{0\}$ に退化する。分散を推定せずに不等式 $\abs{\hat p-p}\le z\sqrt{p(1-p)/n}$ を $p$ について解いた（2 次不等式の解の）**ウィルソンの区間**
$$
\frac{\hat p+\frac{z^{2}}{2n}\pm z\sqrt{\frac{\hat p(1-\hat p)}n+\frac{z^{2}}{4n^{2}}}}{1+\frac{z^{2}}n}\qquad(z=z_{\alpha/2})
$$
の方が、有限の $n$ での被覆確率が名目の値に近いことが知られている（Brown–Cai–DasGupta, 2001, Statistical Science の比較研究）。
:::

::: remark
**ブートストラップの考え方.** 枢軸量の分布がわからないとき、データの経験分布 $F_{n}$ を真の分布の代わりにして、$F_{n}$ から大きさ $n$ の標本を復元抽出で何度も取り直し、統計量の分布を計算機で近似する方法を**ブートストラップ**という。経験分布は真の分布に一様に近づく（\ref{stat:empirical-distribution-function}）ことが正当化の出発点で、標本平均などのなめらかな統計量では漸近的に正しい信頼区間が得られる（Efron–Tibshirani『An Introduction to the Bootstrap』）。最大値のような統計量では一般には正しくない。
:::

::: hypcheck
- **正規性**：$t$ 区間・$\chi^{2}$ 区間の被覆確率が「ちょうど」$1-\alpha$ になることに使った。正規でない分布でも、$t$ 区間は中心極限定理から漸近的には正しい（$S\to\sigma$ とスルツキー）。一方 $\chi^{2}$ 区間は漸近的にも正しくない：$S^{2}$ の漸近分散は 4 次モーメントに依存し、正規分布の $2\sigma^{4}$ とは一般に違う。
- **独立同分布**：すべての区間の前提。系列相関のあるデータ（時系列）では $\operatorname{Var}(\bar X)\ne\sigma^{2}/n$ となり、区間は狭すぎ（または広すぎ）になる。
- **$v(\theta)>0$**：漸近的な区間の Step 1 で割り算に使った。
:::

## 問題 {#stat:sec-ci-problems}

::: problem {#stat:prob-ci-sample-size}
$\sigma$ が既知の正規標本で、信頼係数 95%（$z_{0.025}\approx1.96$）の区間の幅を $w$ 以下にするのに必要な $n$ を求めよ。
:::

::: solution
幅は $2\cdot1.96\sigma/\sqrt n$。$\le w$ から $n\ge(3.92\sigma/w)^{2}$。幅を半分にするには $n$ を 4 倍にする必要がある。
:::

::: problem {#stat:prob-ci-poisson}
ポアソン分布の $\lambda$ について、\ref{stat:delta-examples} の 2 の分散安定化を使った漸近的な信頼区間を作れ。
:::

::: solution
$\sqrt n(2\sqrt{\bar X}-2\sqrt\lambda)\Rightarrow N(0,1)$ なので、$2\sqrt\lambda\in2\sqrt{\bar X}\pm z_{\alpha/2}/\sqrt n$。2 乗して $\lambda\in\bigl[(\sqrt{\bar X}-\frac{z}{2\sqrt n})_{+}^{2},(\sqrt{\bar X}+\frac{z}{2\sqrt n})^{2}\bigr]$（$x_{+}=\max(x,0)$）。分散の推定が不要で、被覆確率は漸近的に $1-\alpha$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** $t$ 区間の正確性には $t$ 分布の密度の具体形は不要で、対称性と連続性だけを使った。議論は Casella–Berger『Statistical Inference』第 9 章の流れに沿う。

**前提を変えると.**
- **検定との双対性**：各 $\theta_{0}$ について有意水準 $\alpha$ の検定の受容域を $A(\theta_{0})$ とすると、$\{\theta_{0}:X\in A(\theta_{0})\}$ は信頼係数 $1-\alpha$ の信頼集合になり、逆も成り立つ（仮説検定の系列で扱う予定）。
- **最短の区間**：単峰で対称な枢軸量なら、等しい裾を切る区間が最短である。$\chi^{2}$ 区間は非対称なので、等しい裾の区間は最短ではない。
- **同時信頼区間**：複数のパラメータを同時に覆う区間を作るには、ボンフェローニの補正（各区間の $\alpha$ を個数で割る）やシェフェの方法を使う。

**高い視点から：集合値の推定量.** 信頼区間は、データから「パラメータ空間の部分集合」への写像で、点推定（1 点への写像）の一般化である。被覆確率の条件は、データとパラメータの積空間の中の集合 $\{(x,\theta):\theta\in C(x)\}$ が、各 $\theta$ の切り口で確率 $1-\alpha$ 以上をもつ、という条件で、検定の受容域の族を「別の向きから切った」ものにすぎない。比喩で言えば、点推定は「一点を狙う射撃」、区間推定は「どれだけの確率で的を覆えるかが保証された網」で、網を大きくすれば確実になるが、何も言っていないのと同じになる。信頼係数と幅の釣り合いが、区間推定の実践の中心である。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref[演習]{stat:sec-ci-exercises} にまとめた。
