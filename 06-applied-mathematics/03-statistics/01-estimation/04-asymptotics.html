# 大標本理論 {#stat:page-asymptotics keywords="consistency of estimators, continuous mapping for convergence in probability, asymptotic normality, tightness from convergence in distribution, Slutsky's theorem, delta method, variance stabilization, asymptotic normality of moment estimators, consistency and asymptotic normality of the MLE with asymptotic variance 1/I(theta) (proof outline), asymptotic efficiency"}

標本の大きさ $n$ が大きいとき、推定量はどう振る舞うか。良い推定量は真の値に近づき（**一致性**）、その誤差は $\frac1{\sqrt n}$ の尺度で正規分布に近づく（**漸近正規性**）。この 2 つが言えれば、正確な分布がわからなくても、誤差の大きさを見積もることができる。道具は大数の法則と中心極限定理に加えて、確率変数の組み合わせの極限を扱う**スルツキーの定理**と、なめらかな関数を通した極限を扱う**デルタ法**である。最尤推定量は、適当な条件のもとで漸近的に分散 $\frac1{nI(\theta)}$ の正規分布にしたがい、クラメール–ラオの下限を漸近的に達成する。

## 記法と定義の確認 {#stat:sec-as-notation}

::: notation
- 確率収束 $\xrightarrow{P}$ と法則収束 $\Rightarrow$、その関係・特徴づけ・連続写像定理は \ref{prb:convergence-relations}, \ref{prb:convergence-in-distribution}, \ref{prb:portmanteau}。大数の弱法則・強法則、中心極限定理は \ref{prb:weak-law}, \ref{prb:strong-law}, \ref{prb:clt}。
- 前のページまでの記法（推定量、最尤推定量、フィッシャー情報量）は \ref{stat:estimator-bias-mse}, \ref{stat:maximum-likelihood}, \ref{stat:fisher-information}。
- 分布関数の不連続点は高々可算個なので、連続点は稠密である。体系は $\ZFC$。
:::

## 一致性 {#stat:sec-as-consistency}

::: definition 一致性と漸近正規性 {#stat:consistency keywords="T_n is consistent for g(theta) if T_n -> g(theta) in P_theta-probability for every theta; asymptotically normal with asymptotic variance v(theta) if sqrt(n)(T_n - g(theta)) => N(0, v(theta))" index="一致性|いっちせい, 一致推定量|いっちすいていりょう, 漸近正規性|ぜんきんせいきせい, 漸近分散|ぜんきんぶんさん" refname="一致性と漸近正規性"}
大きさ $n$ の標本に基づく推定量の列 $T_{n}$ について、
1. すべての $\theta$ で $T_{n}\xrightarrow{P_{\theta}}g(\theta)$ のとき、$T_{n}$ は**一致性**をもつ（一致推定量である）という。
2. すべての $\theta$ で $\sqrt n(T_{n}-g(\theta))\Rightarrow N(0,v(\theta))$ のとき、**漸近正規**で**漸近分散** $v(\theta)$ をもつという。
:::

::: intuition
一致性は「データを無限に集めれば真実がわかる」こと、漸近正規性は「有限のデータでの誤差は、おおよそ幅 $\sqrt{v/n}$ の釣鐘形にばらつく」ことである。後者は、誤差の大きさを数値で見積もるための主張である。
:::

::: proposition 確率収束と連続関数 {#stat:continuous-mapping-probability keywords="if T_n -> theta in probability and g is continuous at theta then g(T_n) -> g(theta) in probability; moment estimators are consistent" index="連続写像定理（確率収束）|れんぞくしゃぞうていり" refname="確率収束と連続関数"}
$T_{n}\xrightarrow{P}\theta$（定数）で $g$ が $\theta$ で連続なら、$g(T_{n})\xrightarrow{P}g(\theta)$。$\mathbb{R}^{k}$ 値でも同じ。
:::

::: intuition
推定量が真の値に近づけば、そのなめらかな関数も真の値の関数に近づく。モーメント推定量の一致性はこれだけで従う。
:::

::: proof
**Step 1（$\varepsilon$–$\delta$）.** $\varepsilon>0$ について、連続性から $\delta>0$ があって $\abs{t-\theta}<\delta\Rightarrow\abs{g(t)-g(\theta)}<\varepsilon$。よって $P(\abs{g(T_{n})-g(\theta)}\ge\varepsilon)\le P(\abs{T_{n}-\theta}\ge\delta)\to0$。
:::

::: example 一致推定量の例 {#stat:consistency-examples}
1. 平均が有限なら $\bar X\to m$（大数の法則）。分散が有限なら $S^{2}=\frac n{n-1}\bigl(\frac1n\sum X_{i}^{2}-\bar X^{2}\bigr)\to\sigma^{2}$（各項に大数の法則、\ref{stat:continuous-mapping-probability}）。
2. モーメント推定量 $\hat\theta=h(\frac1n\sum X_{i},\dots,\frac1n\sum X_{i}^{k})$ は、$h$ が連続なら一致推定量（例：一様分布の $2\bar X$、指数分布の $1/\bar X$）。
3. 一様分布 $U(0,\theta)$ の最大値 $M$：$P(\abs{M-\theta}>\varepsilon)=(1-\varepsilon/\theta)^{n}\to0$。
:::

## スルツキーの定理とデルタ法 {#stat:sec-as-slutsky}

::: lemma 法則収束する列は確率有界 {#stat:tightness-from-weak-convergence keywords="if X_n => X then for every epsilon there is M with sup_n P(|X_n| > M) < epsilon; consequently Y_n -> 0 in probability implies X_n Y_n -> 0 in probability" index="確率有界|かくりつゆうかい" refname="法則収束する列は確率有界"}
$X_{n}\Rightarrow X$ なら、
1. 任意の $\varepsilon>0$ について $M$ があって、すべての $n$ で $P(\abs{X_{n}}>M)<\varepsilon$。
2. $Y_{n}\xrightarrow{P}0$ なら $X_{n}Y_{n}\xrightarrow{P}0$。
:::

::: intuition
分布が極限をもつ列は、確率の質量が無限遠に逃げていかない。だから、$0$ に近づく量を掛ければ全体も $0$ に近づく。
:::

::: proof
**Step 1（1）.** $X$ の分布関数 $F$ の連続点 $\pm M_{0}$ を $F(-M_{0})<\varepsilon/4$, $1-F(M_{0})<\varepsilon/4$ となるようにとる。$F_{n}(\pm M_{0})\to F(\pm M_{0})$ なので、$n\ge N$ で $P(\abs{X_{n}}>M_{0})\le F_{n}(-M_{0})+1-F_{n}(M_{0})<\varepsilon$。有限個の $n<N$ については $M$ を大きくとればよい（各 $X_{n}$ は実数値）。

**Step 2（2）.** $\delta,\varepsilon>0$ について、1 の $M$ で $P(\abs{X_{n}Y_{n}}>\delta)\le P(\abs{X_{n}}>M)+P(\abs{Y_{n}}>\delta/M)<\varepsilon+P(\abs{Y_{n}}>\delta/M)$。
:::

::: theorem スルツキーの定理 {#stat:slutsky keywords="if X_n => X and Y_n -> c in probability (c constant) then X_n + Y_n => X + c and Y_n X_n => c X" index="スルツキーの定理|するつきーのていり" refname="スルツキーの定理"}
$X_{n}\Rightarrow X$、$Y_{n}\xrightarrow{P}c$（定数）なら、
$$
X_{n}+Y_{n}\Rightarrow X+c,\qquad Y_{n}X_{n}\Rightarrow cX.
$$
:::

::: intuition
定数に確率収束する部分は、極限では「ただの数」として振る舞う。だから、未知の分散を一致推定量で置き換えても、極限分布は変わらない。これが、実際の計算で $\sigma$ を $S$ に置き換えてよい理由である。
:::

::: proof
**Step 1（和）.** 【主張：$F$ を $X$ の分布関数として、$x-c$ が $F$ の連続点なら $P(X_{n}+Y_{n}\le x)\to F(x-c)$】$\varepsilon>0$ を $x-c\pm\varepsilon$ が $F$ の連続点になるようにとる（連続点は稠密）。
$$
P(X_{n}+Y_{n}\le x)\le P(X_{n}\le x-c+\varepsilon)+P(\abs{Y_{n}-c}>\varepsilon)\to F(x-c+\varepsilon),
$$
$$
P(X_{n}+Y_{n}\le x)\ge P(X_{n}\le x-c-\varepsilon)-P(\abs{Y_{n}-c}>\varepsilon)\to F(x-c-\varepsilon).
$$
$\varepsilon\downarrow0$ とすると、$x-c$ での連続性から両辺は $F(x-c)$ に近づく。$X+c$ の分布関数は $F(\cdot-c)$ なので主張の通り。

**Step 2（積）.** $Y_{n}X_{n}=cX_{n}+(Y_{n}-c)X_{n}$。連続写像定理（\ref{prb:portmanteau} の 3）から $cX_{n}\Rightarrow cX$、\ref{stat:tightness-from-weak-convergence} の 2 から $(Y_{n}-c)X_{n}\xrightarrow{P}0$。Step 1（$c=0$）を使う。
:::

::: theorem デルタ法 {#stat:delta-method keywords="if sqrt(n)(T_n - theta) => N(0, sigma^2) and g is differentiable at theta then sqrt(n)(g(T_n) - g(theta)) => N(0, g'(theta)^2 sigma^2)" index="デルタ法|でるたほう" refname="デルタ法"}
$\sqrt n(T_{n}-\theta)\Rightarrow N(0,\sigma^{2})$ で、$g$ が $\theta$ で微分可能なら
$$
\sqrt n\bigl(g(T_{n})-g(\theta)\bigr)\Rightarrow N\bigl(0,g'(\theta)^{2}\sigma^{2}\bigr).
$$
:::

::: intuition
$T_{n}$ が $\theta$ の近くにあれば $g(T_{n})-g(\theta)\approx g'(\theta)(T_{n}-\theta)$ で、正規分布を定数倍しても正規分布のままである。
:::

::: proof
**Step 1（剰余の関数）.** 【主張：$g(t)-g(\theta)=(g'(\theta)+r(t))(t-\theta)$ で $r$ は $\theta$ で連続、$r(\theta)=0$】$r(t)\defeq\frac{g(t)-g(\theta)}{t-\theta}-g'(\theta)$（$t\ne\theta$）、$r(\theta)\defeq0$ とすると、微分可能性から $r$ は $\theta$ で連続で、$g(t)-g(\theta)=(g'(\theta)+r(t))(t-\theta)$。

**Step 2（$T_{n}\to\theta$）.** $T_{n}-\theta=\frac1{\sqrt n}\cdot\sqrt n(T_{n}-\theta)$ で、\ref{stat:tightness-from-weak-convergence} の 2 から $T_{n}\xrightarrow{P}\theta$。\ref{stat:continuous-mapping-probability} から $r(T_{n})\xrightarrow{P}0$。

**Step 3（結論）.** $\sqrt n(g(T_{n})-g(\theta))=(g'(\theta)+r(T_{n}))\sqrt n(T_{n}-\theta)$。\ref{stat:slutsky} から極限は $g'(\theta)Z$（$Z\sim N(0,\sigma^{2})$）で、これは $N(0,g'(\theta)^{2}\sigma^{2})$。
:::

::: example デルタ法の例 {#stat:delta-examples}
1. **指数分布の $1/\bar X$**：平均 $1/\lambda$、分散 $1/\lambda^{2}$ なので中心極限定理から $\sqrt n(\bar X-\frac1\lambda)\Rightarrow N(0,\frac1{\lambda^{2}})$。$g(t)=1/t$, $g'(1/\lambda)=-\lambda^{2}$ から $\sqrt n(\frac1{\bar X}-\lambda)\Rightarrow N(0,\lambda^{2})$。
2. **分散安定化**：ポアソン分布で $\sqrt n(\bar X-\lambda)\Rightarrow N(0,\lambda)$。$g(t)=2\sqrt t$ とすると $g'(\lambda)^{2}\lambda=1$ なので $\sqrt n(2\sqrt{\bar X}-2\sqrt\lambda)\Rightarrow N(0,1)$。漸近分散が $\lambda$ によらなくなる。
:::

## 最尤推定量の漸近理論 {#stat:sec-as-mle}

::: lemma 情報不等式 {#stat:information-inequality keywords="if P_theta differs from P_theta0, both densities are positive on the same set and the log-densities are P_theta0-integrable, then E_theta0[log f(X; theta) - log f(X; theta0)] < 0 (positivity of the Kullback-Leibler divergence)" index="情報不等式|じょうほうふとうしき, カルバック–ライブラー情報量の正値性|かるばっくらいぶらーじょうほうりょうのせいちせい" refname="情報不等式"}
密度（または確率関数）$f(\cdot;\theta)$, $f(\cdot;\theta_{0})$ がともに同じ集合 $D$ の上で正で $D$ の外で $0$、$E_{\theta_{0}}\abs{\log f(X;\theta)}<\infty$, $E_{\theta_{0}}\abs{\log f(X;\theta_{0})}<\infty$ とする。$P_{\theta}\ne P_{\theta_{0}}$ なら
$$
E_{\theta_{0}}\bigl[\log f(X;\theta)-\log f(X;\theta_{0})\bigr]<0.
$$
:::

::: intuition
真の分布で測ると、真の分布の対数尤度は、他のどの分布の対数尤度より平均して大きい。だから標本を増やせば、対数尤度は真の値の近くで最も大きくなる。これは相対エントロピー（カルバック–ライブラー情報量）が正であることの言い換えである。
:::

::: proof
**Step 1（$\log y\le y-1$）.** $Y\defeq f(X;\theta)/f(X;\theta_{0})$ は（$X\in D$ a.s. なので）a.s. に正の値をとる。$\log y\le y-1$（等号は $y=1$ のときに限る：$\log$ の凹性）から $\log Y\le Y-1$。

**Step 2（期待値）.** $E_{\theta_{0}}[Y]=\int_{D}\frac{f(x;\theta)}{f(x;\theta_{0})}f(x;\theta_{0})dx=\int_{D}f(x;\theta)dx=1$ なので $E_{\theta_{0}}[\log Y]\le0$。等号なら、非負の確率変数 $Y-1-\log Y$ の期待値が $0$ なので $Y=1$（$P_{\theta_{0}}$-a.s.）。$f(\cdot;\theta_{0})>0$ の $D$ の上では、$P_{\theta_{0}}$ の零集合はルベーグ測度（離散なら数え上げ測度）の零集合なので、$D$ の上でほとんど至る所 $f(\cdot;\theta)=f(\cdot;\theta_{0})$。$D$ の外では両方 $0$ なので $P_{\theta}=P_{\theta_{0}}$ となり、仮定に反する。
:::

::: theorem 最尤推定量の一致性と漸近正規性 {#stat:mle-asymptotic-normality keywords="Cramer conditions: identifiability, integrable log-densities, C^3 log-density with integrable bound on the third derivative near theta_0, int d^2 f = 0, 0 < I(theta_0) < infinity; then with probability -> 1 the likelihood equation has a root within delta of theta_0, any consistent sequence of roots satisfies sqrt(n)(theta-hat - theta_0) => N(0, 1/I(theta_0)), and for concave log-likelihoods the MLE itself is such a sequence" index="最尤推定量の漸近正規性|さいゆうすいていりょうのぜんきんせいきせい, 漸近有効性|ぜんきんゆうこうせい, クラメールの条件|くらめーるのじょうけん" refname="最尤推定量の一致性と漸近正規性"}
モデルは \ref{stat:fisher-information} の意味で正則で、台を $D$ とする。$\theta_{0}\in\Theta$（開区間）を真の値とし、次を仮定する。
- （A1）$\theta\ne\theta'$ なら $P_{\theta}\ne P_{\theta'}$（識別可能性）。
- （A2）すべての $\theta\in\Theta$ で $E_{\theta_{0}}\abs{\log f(X;\theta)}<\infty$。
- （A3）各 $x\in D$ で $\theta\mapsto\log f(x;\theta)$ は $\Theta$ 上 $C^{3}$ 級で、$\delta_{0}>0$ と $E_{\theta_{0}}[M(X)]<\infty$ をみたす $M$ があって、$\abs{\theta-\theta_{0}}<\delta_{0}$ で $\abs{\partial_{\theta}^{3}\log f(x;\theta)}\le M(x)$。
- （A4）$E_{\theta_{0}}\abs{\partial_{\theta}^{2}\log f(X;\theta_{0})}<\infty$、$\int_{D}\partial_{\theta}^{2}f(x;\theta_{0})dx=0$、$0<I(\theta_{0})<\infty$。

$\ell_{n}(\theta)\defeq\sum_{i\le n}\log f(X_{i};\theta)$ とする。このとき、
1. $[\theta_{0}-\delta,\theta_{0}+\delta]\subseteq\Theta$ となる任意の $\delta>0$ について、事象 $B_{n}$ で $P_{\theta_{0}}(B_{n})\to1$ かつ $B_{n}$ の上で $\ell_{n}'$ が $(\theta_{0}-\delta,\theta_{0}+\delta)$ に零点をもつものがある。
2. 統計量の列 $\hat\theta_{n}$ が $\hat\theta_{n}\xrightarrow{P}\theta_{0}$ かつ $P_{\theta_{0}}(\ell_{n}'(\hat\theta_{n})=0)\to1$ をみたせば、
$$
\sqrt n(\hat\theta_{n}-\theta_{0})\Rightarrow N\Bigl(0,\frac1{I(\theta_{0})}\Bigr).
$$
3. さらに各 $x\in D^{n}$ で $\ell_{n}(\cdot;x)$ が凹で $\ell_{n}'(\cdot;x)$ の零点が高々 1 つなら、零点が存在する事象の上でそれを $\hat\theta_{n}$、それ以外で $\hat\theta_{n}\defeq\theta_{0}'$（任意の定数）とおくと、$\hat\theta_{n}$ は統計量で、零点が存在するときは最尤推定量であり、2 の仮定をみたす。
:::

::: intuition
大きな標本では、平均の対数尤度 $\frac1n\ell_{n}$ は大数の法則で真の値 $\theta_{0}$ に頂点をもつ曲線に近づく（情報不等式）。頂点の近くでは曲線は放物線で、その曲率が $I(\theta_{0})$。最尤推定量のずれは「傾き（スコア）のゆらぎ」÷「曲率」で、傾きのゆらぎは中心極限定理で分散 $nI$ の正規分布になる。$\sqrt{nI}/(nI)$ の尺度で $\frac1{\sqrt{nI}}$ の誤差になり、クラメール–ラオの下限と一致する。
:::

::: proof
**Step 1（1：対数尤度比の大数の法則）.** 【主張：$B_{n}\defeq\{\ell_{n}(\theta_{0}\pm\delta)<\ell_{n}(\theta_{0})\}$（両符号）について $P(B_{n})\to1$】（A2）と大数の強法則（\ref{prb:strong-law}）から $\frac1n(\ell_{n}(\theta_{0}\pm\delta)-\ell_{n}(\theta_{0}))\to E_{\theta_{0}}[\log f(X;\theta_{0}\pm\delta)-\log f(X;\theta_{0})]$（a.s.）で、（A1）と \ref{stat:information-inequality} から右辺は負。よって a.s. に十分大きい $n$ で $B_{n}$ が起こり、$1_{B_{n}^{c}}\to0$（a.s.）、優収束定理で $P(B_{n}^{c})\to0$。

**Step 2（1：零点の存在）.** $X\in D^{n}$（a.s.）で、$\ell_{n}$ は $[\theta_{0}-\delta,\theta_{0}+\delta]$ 上連続（A3）なので最大値をとる。$B_{n}$ の上では両端の値が $\ell_{n}(\theta_{0})$ より小さいので、最大点は内点で、そこで $\ell_{n}'=0$。

**Step 3（2：スコアと曲率の極限）.** 【主張：$N_{n}\defeq\frac1{\sqrt n}\ell_{n}'(\theta_{0})\Rightarrow N(0,I(\theta_{0}))$、$-\frac1n\ell_{n}''(\theta_{0})\to I(\theta_{0})$（a.s.）】前者はスコアが独立同分布で平均 $0$、分散 $I(\theta_{0})$（\ref{stat:score-properties}）なので中心極限定理（\ref{prb:clt}）。後者は（A4）と大数の強法則から $\frac1n\ell_{n}''(\theta_{0})\to E_{\theta_{0}}[\partial_{\theta}^{2}\log f]$ で、$\partial_{\theta}^{2}\log f=\frac{\partial_{\theta}^{2}f}{f}-s^{2}$ と $E_{\theta_{0}}[\frac{\partial_{\theta}^{2}f}{f}]=\int_{D}\partial_{\theta}^{2}f\,dx=0$ から $=-I(\theta_{0})$。

**Step 4（2：テイラー展開）.** 【主張：$\abs{\hat\theta_{n}-\theta_{0}}<\delta_{0}$ のとき $\ell_{n}'(\hat\theta_{n})-\ell_{n}'(\theta_{0})=(\hat\theta_{n}-\theta_{0})\bigl(\ell_{n}''(\theta_{0})+nR_{n}\bigr)$、$\abs{R_{n}}\le\frac12\bar M_{n}\abs{\hat\theta_{n}-\theta_{0}}$、$\bar M_{n}\defeq\frac1n\sum_{i}M(X_{i})$】$\hat\theta_{n}\ne\theta_{0}$ のとき $R_{n}\defeq\frac1n\bigl(\frac{\ell_{n}'(\hat\theta_{n})-\ell_{n}'(\theta_{0})}{\hat\theta_{n}-\theta_{0}}-\ell_{n}''(\theta_{0})\bigr)$、それ以外では $R_{n}\defeq0$ とおくと $R_{n}$ は可測。$\ell_{n}'$ に 2 次の剰余つきのテイラーの定理（\ref{calc:taylor-lagrange}）を使うと、$\hat\theta_{n}$ と $\theta_{0}$ の間の点 $\tilde\theta$ で $\frac{\ell_{n}'(\hat\theta_{n})-\ell_{n}'(\theta_{0})}{\hat\theta_{n}-\theta_{0}}-\ell_{n}''(\theta_{0})=\frac12\ell_{n}'''(\tilde\theta)(\hat\theta_{n}-\theta_{0})$ で、（A3）から $\abs{\ell_{n}'''(\tilde\theta)}\le\sum M(X_{i})$。

**Step 5（2：結論）.** $D_{n}\defeq-\frac1n\ell_{n}''(\theta_{0})-R_{n}$ とする。$\bar M_{n}\to E M$（a.s.）と $\hat\theta_{n}\xrightarrow{P}\theta_{0}$ から $R_{n}\xrightarrow{P}0$（\ref{stat:tightness-from-weak-convergence} の 2）、Step 3 から $D_{n}\xrightarrow{P}I(\theta_{0})$。$G_{n}\defeq1/D_{n}$（$D_{n}>0$）、$\defeq1/I(\theta_{0})$（それ以外）とすると \ref{stat:continuous-mapping-probability} から $G_{n}\xrightarrow{P}1/I(\theta_{0})$ で、\ref{stat:slutsky} から $N_{n}G_{n}\Rightarrow N(0,1/I(\theta_{0}))$。事象 $A_{n}\defeq\{\ell_{n}'(\hat\theta_{n})=0,\ \abs{\hat\theta_{n}-\theta_{0}}<\delta_{0},\ D_{n}>0\}$ は $P(A_{n})\to1$ をみたし、$A_{n}$ の上で Step 4 から $-\ell_{n}'(\theta_{0})=-n(\hat\theta_{n}-\theta_{0})D_{n}$、すなわち $\sqrt n(\hat\theta_{n}-\theta_{0})=N_{n}G_{n}$。よって差 $\sqrt n(\hat\theta_{n}-\theta_{0})-N_{n}G_{n}$ は確率 $\to1$ で $0$、とくに $0$ に確率収束し、再び \ref{stat:slutsky} から主張が従う。

**Step 6（3）.** 凹関数の導関数 $\ell_{n}'$ は非増加。零点 $r$ がただ一つあれば、$t\in\Theta$ について $r\le t\iff\ell_{n}'(t)\le0$（$r>t$ なら $\ell_{n}'(t)\ge0$ で、$=0$ なら $t$ が別の零点になる）。零点が存在する事象は、$\ell_{n}'(q)>0$ となる有理数 $q$ と $\ell_{n}'(q')<0$ となる有理数 $q'$ がともに存在する事象に等しく（中間値の定理）、可測。したがって $\{\hat\theta_{n}\le t\}$ は可測で、$\hat\theta_{n}$ は統計量。凹関数は導関数が $0$ の点で最大なので（接線の不等式）、零点は最尤推定量。$0<\delta<\delta_{0}$ について、Step 1, 2 の $B_{n}$ の上では零点が $(\theta_{0}-\delta,\theta_{0}+\delta)$ にあり、一意性からそれが $\hat\theta_{n}$。よって $P(\abs{\hat\theta_{n}-\theta_{0}}<\delta)\ge P(B_{n})\to1$、$P(\ell_{n}'(\hat\theta_{n})=0)\ge P(B_{n})\to1$。
:::

::: example 凹な対数尤度の例 {#stat:mle-concave-examples}
ポアソン分布では $\ell_{n}(\lambda)=\sum x_{i}\log\lambda-n\lambda+\text{定数}$、$\ell_{n}''=-\sum x_{i}/\lambda^{2}\le0$ で、$\ell_{n}'(\lambda)=\sum x_{i}/\lambda-n$ の零点は $\sum x_{i}>0$ のときだけ $\bar x$ の 1 つ。$I(\lambda)=1/\lambda$ なので定理の結論は $\sqrt n(\bar X-\lambda)\Rightarrow N(0,\lambda)$ で、中心極限定理からの直接の結論と一致する。ベルヌーイ分布・正規分布の平均でも同様に対数尤度は凹である。
:::

::: hypcheck
- **スルツキーの定理の $c$ が定数であること**：Step 1 で $Y_{n}$ の極限が確率変数だと、$X_{n}$ と $Y_{n}$ の同時分布がわからない限り和の極限は決まらない。
- **デルタ法の微分可能性**：Step 1 の剰余関数の連続性に使った。$g'(\theta)=0$ なら極限は $0$ に退化し、$n(g(T_{n})-g(\theta))$ の尺度で $\chi^{2}$ 型の極限を考える（2 次のデルタ法）。
- **最尤推定量の正則性**：一様分布 $U(0,\theta)$ のように台がパラメータに依存すると、$n(\theta-M)$ が指数分布に法則収束し（\ref{stat:uniform-maximum}）、$\sqrt n$ の漸近正規性は成り立たない。
:::

## 問題 {#stat:sec-as-problems}

::: problem {#stat:prob-as-bernoulli-odds}
ベルヌーイ分布で、対数オッズ $\log\frac p{1-p}$ の推定量 $\log\frac{\bar X}{1-\bar X}$ の漸近分散を求めよ。
:::

::: solution
$\sqrt n(\bar X-p)\Rightarrow N(0,p(1-p))$、$g(t)=\log\frac t{1-t}$, $g'(p)=\frac1{p(1-p)}$ から漸近分散 $\frac1{p(1-p)}$。
:::

::: problem {#stat:prob-as-uniform-max-limit}
一様分布 $U(0,\theta)$ の最大値 $M$ について、$n(\theta-M)$ が平均 $\theta$ の指数分布に法則収束することを示せ。
:::

::: solution
$P(n(\theta-M)>x)=P(M<\theta-x/n)=(1-\frac x{n\theta})^{n}\to e^{-x/\theta}$（$x\ge0$）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** スルツキーの定理とデルタ法は、独立性も同分布性も使わず、法則収束と確率収束だけを使う。最尤推定量については、尤度方程式の解の可測な選び方が一般には難しいので、「一致する解の列」についての主張（2）と、凹な対数尤度で最尤推定量そのものが条件をみたすこと（3）に分けて証明した。一般のモデルで最尤推定量（大域的な最大点）の一致性を示すには、ワルドの条件（コンパクト性と一様な可積分性）が要る。議論は Lehmann–Casella『Theory of Point Estimation』第 6 章、van der Vaart『Asymptotic Statistics』第 5 章の流れに沿う。

**前提を変えると.**
- **多次元のデルタ法**：$\sqrt n(T_{n}-\theta)\Rightarrow N(0,\Sigma)$ で $g:\mathbb{R}^{k}\to\mathbb{R}^{m}$ が微分可能なら、$\sqrt n(g(T_{n})-g(\theta))\Rightarrow N(0,Dg\,\Sigma\,Dg^{\top})$。
- **超有効性**：ホッジスの推定量のように、特定の $\theta$ で漸近分散が $1/I(\theta)$ より小さい推定量が存在する。それでも「局所的に一様な」意味では $1/I(\theta)$ が下限である（ハイェック–ル・カムの畳み込み定理、局所漸近ミニマックス定理）。
- **モデルの誤特定**：真の分布がモデルに含まれないと、最尤推定量は相対エントロピーを最小にするパラメータに収束し、漸近分散は「サンドイッチ型」$A^{-1}BA^{-1}$ になる。

**高い視点から：局所的には正規モデル.** 正則なモデルでは、真の値の近くを $\frac1{\sqrt n}$ の尺度で拡大すると、尤度比はガウスの平行移動モデル $N(h,1/I)$ の尤度比に近づく（ル・カムの局所漸近正規性）。大標本理論の結果はすべて、この「拡大すると正規分布の平均の推定に見える」という事実から出てくる。比喩で言えば、なめらかな曲面も十分に拡大すれば平面に見えるように、正則な統計モデルも十分なデータのもとでは正規分布の平均の推定問題に見える。
:::
