# 演習：時系列と極値 {#stat:page-exercises-time-series-extremes keywords="exercises, waiting time paradox, sum of independent Poisson processes, AR(1) variance and prediction error, random walk variance growth, maxima of exponential samples, Gumbel approximation numbers, Pareto tail regular variation, one big jump for Pareto sums"}

## ポアソン過程 {#stat:sec-pp-exercises}

対応するページ：\ref{stat:page-poisson-process}

::: problem ★ 基本：一定時間内の出来事の数 {#stat:ex-pp-count}
1 時間あたり平均 3 件の問い合わせがポアソン過程で届く。30 分間に 1 件も届かない確率と、ちょうど 2 件届く確率を求めよ。
:::

::: solution
$N(0.5)\sim\mathrm{Po}(1.5)$（\ref{stat:poisson-increments}）。$P(0)=e^{-1.5}\approx0.223$、$P(2)=e^{-1.5}\frac{1.5^{2}}2\approx0.251$。
:::

::: problem ★★ 標準：待ち時間の逆説 {#stat:ex-pp-inspection}
強度 $\lambda$ のポアソン過程で、時刻 $t$ の直後の到着までの時間 $S_{N(t)+1}-t$ が平均 $1/\lambda$ の指数分布にしたがうことを示せ。
:::

::: solution
$y>0$ について $\{S_{N(t)+1}-t>y\}=\{N(t+y)-N(t)=0\}$（$(t,t+y]$ に到着がない）。\ref{stat:poisson-increments} から確率は $e^{-\lambda y}$。到着の間隔の平均は $1/\lambda$ なのに、任意の時刻から次の到着までの平均待ち時間も $1/\lambda$（前の到着からの経過時間も含めると、その時刻を含む間隔は平均より長い：長い間隔ほど「当たりやすい」ため）。
:::

## 自己回帰モデル {#stat:sec-ar-exercises}

対応するページ：\ref{stat:page-autoregressive}

::: problem ★ 基本：AR(1) の分散と予測誤差 {#stat:ex-ar-variance}
$\varphi=0.5$, $\sigma^{2}=3$ の AR(1) で、$\gamma(0)$ と、2 期先の最良予測の誤差の分散を求めよ。
:::

::: solution
$\gamma(0)=\frac3{1-0.25}=4$。2 期先は $\sigma^{2}(1+\varphi^{2})=3\cdot1.25=3.75$（\ref{stat:ar1-prediction}）。予測期間が長くなると誤差の分散は $\gamma(0)=4$ に近づく（予測しないのと同じ）。
:::

::: problem ★★ 標準：ランダムウォーク {#stat:ex-ar-random-walk}
$X_{0}=0$, $X_{t}=X_{t-1}+\varepsilon_{t}$（$\varphi=1$、$\varepsilon_{t}$ はホワイトノイズ）について $\operatorname{Var}(X_{t})=t\sigma^{2}$ を示し、弱定常でないことを説明せよ。
:::

::: solution
$X_{t}=\sum_{s\le t}\varepsilon_{s}$ で、無相関性から分散は $t\sigma^{2}$。分散が $t$ に依存するので弱定常でない（\ref{stat:weakly-stationary}）。差分 $X_{t}-X_{t-1}=\varepsilon_{t}$ は定常なので、このような過程は差分をとってから分析する。
:::

## 極値分布 {#stat:sec-ev-exercises}

対応するページ：\ref{stat:page-extreme-values}

::: problem ★ 基本：指数分布の最大値 {#stat:ex-ev-exponential}
平均 1 の指数分布の標本 $n=1000$ 個の最大値が $10$ を超える確率を、正確な式とグンベル近似の両方で求めよ（$\log1000\approx6.91$）。
:::

::: solution
正確には $1-(1-e^{-10})^{1000}\approx1-e^{-1000e^{-10}}\approx1-e^{-0.0454}\approx0.044$。グンベル近似 $1-\exp(-e^{-(10-6.91)})=1-\exp(-e^{-3.09})\approx1-e^{-0.0455}\approx0.044$（\ref{stat:extreme-value-examples} の 1）。
:::

::: problem ★★ 標準：最大値の平均の増え方 {#stat:ex-ev-max-mean}
平均 1 の指数分布の $n$ 個の最大値の期待値が $\sum_{k=1}^{n}\frac1k$ であることを示せ（$\approx\log n+0.577$）。
:::

::: solution
\ref{prb:tail-formula} から $E[M_{n}]=\int_{0}^{\infty}P(M_{n}>x)dx=\int_{0}^{\infty}\bigl(1-(1-e^{-x})^{n}\bigr)dx$。$u=1-e^{-x}$（$dx=\frac{du}{1-u}$）と置換すると $\int_{0}^{1}\frac{1-u^{n}}{1-u}du=\int_{0}^{1}\sum_{k=0}^{n-1}u^{k}du=\sum_{k=1}^{n}\frac1k$。最大値は $\log n$ 程度の速さでしか大きくならない（\ref{stat:extreme-value-examples} の 1 と整合する）。
:::

## 裾の重い分布 {#stat:sec-ht-exercises}

対応するページ：\ref{stat:page-heavy-tails}

::: problem ★ 基本：正則変動の確認 {#stat:ex-ht-regular-variation}
$\bar F(x)=\frac{1}{1+x^{2}}$（$x\ge0$）の裾が指数 $2$ で正則変動することを示し、$E[X]<\infty$, $E[X^{2}]=\infty$ を確かめよ。
:::

::: solution
$\frac{\bar F(tx)}{\bar F(x)}=\frac{1+x^{2}}{1+t^{2}x^{2}}\to t^{-2}$。\ref{prb:tail-formula} から $E[X]=\int_{0}^{\infty}\bar F=\frac\pi2<\infty$、$E[X^{2}]=\int_{0}^{\infty}2x\bar F(x)dx=\int\frac{2x}{1+x^{2}}dx=\infty$。
:::

::: problem ★★ 標準：パレート分布の和の裾 {#stat:ex-ht-pareto-sum}
指数 $1$ のパレート分布の独立な 2 つの和について、$P(X_{1}+X_{2}>x)$ を $x=100$ で $2\bar F(100)$ と比べたときの近似の精度について、\ref{stat:one-big-jump} の証明の評価から何が言えるか。
:::

::: solution
証明の評価から $2\bar F(x)-\bar F(x)^{2}\le P(X_{1}+X_{2}>x)\le2\bar F((1-\delta)x)+\bar F(\delta x)^{2}$。$x=100$, $\delta=0.1$ なら下限 $0.02-0.0001=0.0199$、上限 $2\cdot\frac1{90}+\frac1{100}\approx0.0322$。$\delta$ を最適化しても比は $1$ に近くなく、収束は遅い（$\bar F(\delta x)^{2}$ の項が効く）。漸近的な等式は大きな $x$ でしか良い近似にならない。
:::
