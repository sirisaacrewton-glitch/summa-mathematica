## ベイズの定理と事後分布 {#stat:sec-bt-exercises}

対応するページ：\ref{stat:page-bayes-theorem}

::: problem ★ 基本：3 つの扉 {#stat:ex-bt-monty-hall}
3 つの扉の 1 つに賞品があり（一様な事前分布）、参加者が扉 1 を選んだ後、賞品の場所を知る司会者が、残りのうち賞品のない扉を開ける（両方とも空なら等確率で選ぶ）。扉 3 が開けられたとき、賞品が扉 2 にある事後確率を求めよ。
:::

::: solution
$\theta\in\{1,2,3\}$ を賞品の場所、データを「扉 3 が開いた」とする。尤度は $\theta=1$ で $\frac12$、$\theta=2$ で $1$、$\theta=3$ で $0$。事後分布は $\frac13(\frac12,1,0)$ を正規化した $(\frac13,\frac23,0)$。扉 2 に替えるべきである。
:::

::: problem ★★ 標準：事後中央値 {#stat:ex-bt-exponential-median}
事後分布が平均 $1/\lambda$ の指数分布のとき、2 乗損失と絶対値損失のベイズ推定値を求め、比べよ。
:::

::: solution
2 乗損失では事後平均 $\frac1\lambda$。絶対値損失では中央値 $m$：$1-e^{-\lambda m}=\frac12$ から $m=\frac{\log2}\lambda\approx\frac{0.69}\lambda$（\ref{stat:bayes-estimator-posterior-loss}）。右に裾の長い分布では中央値は平均より小さい。
:::

## 共役事前分布 {#stat:sec-cp-exercises}

対応するページ：\ref{stat:page-conjugate-priors}

::: problem ★ 基本：ベータ事後分布の確率 {#stat:ex-cp-beta-probability}
一様事前分布で 10 回中 9 回成功した。事後分布と、$\theta>\frac12$ の事後確率を求めよ。
:::

::: solution
事後分布は $\mathrm{Beta}(10,2)$、密度 $110\theta^{9}(1-\theta)$（$1/B(10,2)=\frac{11!}{9!\,1!}=110$）。$P(\theta\le\frac12)=110\int_{0}^{1/2}(\theta^{9}-\theta^{10})d\theta=110\bigl(\frac{2^{-10}}{10}-\frac{2^{-11}}{11}\bigr)=\frac{11}{1024}-\frac{10}{2048}=\frac{12}{2048}\approx0.0059$。よって $P(\theta>\frac12\mid x)\approx0.994$。
:::

::: problem ★★ 標準：ガンマ–ポアソンの逐次更新 {#stat:ex-cp-sequential}
ガンマ–ポアソンモデルで、データを 1 個ずつ観測して事後分布を更新した結果が、一度に全部を使った更新と一致することを示せ。
:::

::: solution
1 個の観測 $x$ による更新は $(\alpha,\beta)\mapsto(\alpha+x,\beta+1)$（\ref{stat:gamma-poisson}）。$n$ 回続けると $(\alpha+\sum x_{i},\beta+n)$ で、一度の更新と同じ。一般に、独立なデータでは、前の事後分布を次の事前分布とする逐次更新は一括の更新と一致する（尤度が積に分かれるため）。
:::

## 事後分布の一致性 {#stat:sec-pc-exercises}

対応するページ：\ref{stat:page-posterior-consistency}

::: problem ★ 基本：ベイズ因子の計算 {#stat:ex-pc-bayes-factor}
$H_{0}:\theta=\frac12$ 対 $H_{1}:\theta\sim\mathrm{Beta}(1,1)$ で、10 回中 9 回成功したときのベイズ因子 $B_{01}$ を求めよ。
:::

::: solution
$H_{0}$ の尤度は $\binom{10}9 2^{-10}$、$H_{1}$ の周辺尤度は $\binom{10}9B(10,2)=\binom{10}9\frac1{110}$。$B_{01}=\frac{110}{1024}\approx0.107$。データは $H_{1}$ を約 9.3 倍支持する。
:::

::: problem ★★ 標準：2 つの単純仮説の一致性 {#stat:ex-pc-two-normals}
$N(0,1)$ と $N(1,1)$ のどちらかが真で（事前確率 $\frac12$ ずつ）、実際は $N(0,1)$ のとき、誤った方の事後オッズの対数の $\frac1n$ 倍の極限を求めよ。
:::

::: solution
$\frac1n\log\frac{\pi(1\mid x)}{\pi(0\mid x)}=\frac1n\sum\bigl(x_{i}-\frac12\bigr)\to-\frac12$（大数の強法則）。これは $-H(N(0,1)\mid N(1,1))=-\frac12$ に等しい（\ref{stat:posterior-consistency-finite}）。
:::

## マルコフ連鎖モンテカルロ法 {#stat:sec-mc-exercises}

対応するページ：\ref{stat:page-mcmc}

::: problem ★ 基本：3 状態のメトロポリス法 {#stat:ex-mc-three-states}
$S=\{1,2,3\}$ を円に並べ、両隣に確率 $\frac12$ ずつ提案する。$\pi=(\frac16,\frac13,\frac12)$ のときのメトロポリス–ヘイスティングスの遷移行列を求め、$\pi P=\pi$ を確かめよ。
:::

::: solution
$p_{12}=\frac12$, $p_{13}=\frac12$, $p_{21}=\frac12\cdot\frac12=\frac14$, $p_{23}=\frac12$, $p_{31}=\frac12\cdot\frac13=\frac16$, $p_{32}=\frac12\cdot\frac23=\frac13$。対角は $p_{11}=0$, $p_{22}=\frac14$, $p_{33}=\frac12$。$\pi P$ の第 1 成分 $\frac13\cdot\frac14+\frac12\cdot\frac16=\frac16$、第 2 成分 $\frac16\cdot\frac12+\frac13\cdot\frac14+\frac12\cdot\frac13=\frac13$、第 3 成分は残り $\frac12$。
:::

::: problem ★★ 標準：2×2 表のギブス・サンプラー {#stat:ex-mc-gibbs-table}
$S=\{0,1\}^{2}$ 上の $\pi(0,0)=\pi(1,1)=\frac{1-\varepsilon}2$, $\pi(0,1)=\pi(1,0)=\frac\varepsilon2$（$0<\varepsilon<1$）について、無作為走査のギブス・サンプラーで $(0,0)$ から $(1,1)$ へ 2 段で移る確率を求め、$\varepsilon\to0$ での振る舞いを述べよ。
:::

::: solution
$(0,0)$ から座標を 1 つ引き直して $(1,0)$ か $(0,1)$ に移る確率は $\frac12\varepsilon+\frac12\varepsilon=\varepsilon$（条件付き分布で値が変わる確率は $\frac{\varepsilon/2}{(1-\varepsilon)/2+\varepsilon/2}=\varepsilon$）。そこから $(1,1)$ へは、変わっていない方の座標を選び（確率 $\frac12$）、それが $1$ になる確率は $1-\varepsilon$。よって 2 段で $(1,1)$ に移る確率は $\varepsilon\cdot\frac12(1-\varepsilon)$。$\varepsilon\to0$ では 2 つの峰の間の移動が極めて遅くなり、連鎖は正しい定常分布をもつが、混合は非常に遅い（\ref{stat:gibbs-sampler} の収束の速さについての注意）。
:::
