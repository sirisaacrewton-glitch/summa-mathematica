# マルコフ連鎖モンテカルロ法 {#stat:page-mcmc keywords="Markov chain Monte Carlo on a finite state space, detailed balance implies stationarity, Metropolis-Hastings acceptance probability min(1, pi_j q_ji / (pi_i q_ij)), only ratios of the target are needed, irreducibility and aperiodicity, convergence in total variation, mean-square law of large numbers for ergodic averages, random-scan Gibbs sampler, sampling from posteriors known up to a constant"}

事後分布 $\pi(\theta\mid x)\propto\pi(\theta)f(x\mid\theta)$ は、比例定数（周辺尤度）の計算が難しいため、直接にはサンプリングも期待値の計算もできないことが多い。**マルコフ連鎖モンテカルロ法**（MCMC）は、目標の分布を定常分布にもつマルコフ連鎖を作り、それを長く走らせて、時間平均で期待値を近似する方法である。目標の分布は「比」しか使わないので、比例定数は不要である。このページでは有限の状態空間の上で、メトロポリス–ヘイスティングス法とギブス・サンプラーが正しい定常分布をもつこと、連鎖の分布が目標に収束すること、時間平均が期待値に（平均二乗の意味で）収束することを証明する。

## 記法と定義の確認 {#stat:sec-mc-notation}

::: notation
- マルコフ連鎖・遷移行列・$n$ 段の遷移確率 $p_{ij}^{(n)}$・既約性・定常分布・周期は \ref{prb:markov-chain}, \ref{prb:recurrence}, \ref{prb:stationary-distribution}。既約・非周期的で定常分布をもつ連鎖の収束定理は \ref{prb:markov-convergence}。
- このページでは状態空間 $S$ は有限集合、$\pi$ は $S$ 上の確率分布で、すべての $i$ で $\pi_{i}>0$ とする。$\pi f\defeq\sum_{i}\pi_{i}f(i)$。体系は $\ZFC$。
:::

## 詳細つり合いとメトロポリス–ヘイスティングス法 {#stat:sec-mc-mh}

::: proposition 詳細つり合い {#stat:detailed-balance keywords="if pi_i p_ij = pi_j p_ji for all i, j (reversibility, detailed balance) then pi is stationary for P" index="詳細つり合い|しょうさいつりあい, 可逆なマルコフ連鎖|かぎゃくなまるこふれんさ" refname="詳細つり合い"}
遷移行列 $P$ がすべての $i,j$ で $\pi_{i}p_{ij}=\pi_{j}p_{ji}$（**詳細つり合い**、$P$ は $\pi$ について**可逆**）をみたせば、$\pi$ は $P$ の定常分布である。
:::

::: intuition
定常であるには、各状態への流入の総量と流出の総量が釣り合えばよい。詳細つり合いはそれより強く、「どの 2 状態の間でも、行きと帰りの流量が等しい」ことを要求する。この強い条件は局所的に確かめやすく、連鎖を設計するときに便利である。
:::

::: proof
**Step 1（和をとる）.** $\sum_{i}\pi_{i}p_{ij}=\sum_{i}\pi_{j}p_{ji}=\pi_{j}\sum_{i}p_{ji}=\pi_{j}$。
:::

::: theorem メトロポリス–ヘイスティングス法 {#stat:metropolis-hastings keywords="proposal matrix Q irreducible with q_ij > 0 iff q_ji > 0; acceptance alpha_ij = min(1, pi_j q_ji/(pi_i q_ij)); P_ij = q_ij alpha_ij for i != j; P is pi-reversible and irreducible; if some p_ii > 0 it is aperiodic and P(X_n = j) -> pi_j" index="メトロポリス–ヘイスティングス法|めとろぽりすへいすてぃんぐすほう, 提案分布|ていあんぶんぷ, 採択確率|さいたくかくりつ" refname="メトロポリス–ヘイスティングス法"}
**提案行列** $Q=(q_{ij})$（確率行列）は既約で、$q_{ij}>0\iff q_{ji}>0$ をみたすとする。$q_{ij}>0$ の $i\ne j$ について**採択確率** $\alpha_{ij}\defeq\min\bigl(1,\frac{\pi_{j}q_{ji}}{\pi_{i}q_{ij}}\bigr)$ とし、
$$
p_{ij}\defeq q_{ij}\alpha_{ij}\quad(i\ne j,\ q_{ij}>0),\qquad p_{ij}\defeq0\quad(i\ne j,\ q_{ij}=0),\qquad p_{ii}\defeq1-\sum_{j\ne i}p_{ij}
$$
とする（「$Q$ で候補 $j$ を出し、確率 $\alpha_{ij}$ で移り、さもなければ留まる」）。このとき
1. $P$ は確率行列で、$\pi$ について可逆。特に $\pi$ は定常分布。
2. $P$ は既約。
3. ある $i$ で $p_{ii}>0$ なら $P$ は非周期的で、任意の初期分布で $\sum_{j}\abs{P(X_{n}=j)-\pi_{j}}\to0$。
:::

::: intuition
提案された移動が「目標の分布で見て確率が上がる」方向なら必ず受け入れ、下がる方向なら比の確率でしか受け入れない。これで、確率の高い状態ほど長く滞在するようになる。$\alpha$ に現れるのは $\pi_{j}/\pi_{i}$ だけなので、$\pi$ の比例定数を知らなくてよい。
:::

::: proof
**Step 1（確率行列）.** $0\le\alpha_{ij}\le1$ なので $\sum_{j\ne i}p_{ij}\le\sum_{j\ne i}q_{ij}\le1$、よって $p_{ii}\ge0$。

**Step 2（詳細つり合い）.** 【主張：$i\ne j$ で $\pi_{i}p_{ij}=\pi_{j}p_{ji}$】$q_{ij}=0$ なら $q_{ji}=0$ で両辺 $0$。$q_{ij}>0$ なら $\pi_{i}p_{ij}=\pi_{i}q_{ij}\min(1,\frac{\pi_{j}q_{ji}}{\pi_{i}q_{ij}})=\min(\pi_{i}q_{ij},\pi_{j}q_{ji})$ で、これは $i,j$ について対称。$i=j$ は自明。\ref{stat:detailed-balance} を使う。

**Step 3（2）.** $q_{ij}>0$（$i\ne j$）なら $\alpha_{ij}>0$（$\pi>0$, $q_{ji}>0$）で $p_{ij}>0$。$Q$ の既約性から、任意の $i,j$ を $Q$ で正の確率の道で結べ、同じ道が $P$ でも正の確率をもつ。

**Step 4（3）.** 【主張：既約な連鎖で $p_{ii}>0$ なら、すべての状態の周期は $1$】任意の $j$ について、既約性から $p_{ij}^{(a)}>0$, $p_{ji}^{(b)}>0$ となる $a,b$ がある。$p_{jj}^{(a+b)}\ge p_{ji}^{(b)}p_{ij}^{(a)}>0$、$p_{jj}^{(a+b+1)}\ge p_{ji}^{(b)}p_{ii}p_{ij}^{(a)}>0$ なので、$j$ の周期は $a+b$ と $a+b+1$ を割り切り、$1$。収束は \ref{prb:markov-convergence}。
:::

::: remark
$p_{ii}>0$ の仮定は弱い。$\pi$ が一様分布でなく、$Q$ が対称なら、$\pi_{j}<\pi_{i}$ となる隣り合う $i,j$ があり、$i$ からの提案が棄却される確率が正なので $p_{ii}>0$ になる。
:::

## 時間平均の収束 {#stat:sec-mc-lln}

::: theorem エルゴード平均の大数の法則（有限状態） {#stat:mcmc-ergodic-average keywords="for an irreducible aperiodic chain on a finite set with stationary distribution pi, any initial distribution and any f: S -> R, E[((1/n) sum_{k<n} f(X_k) - pi f)^2] -> 0; hence the ergodic average converges to pi f in probability" index="エルゴード平均|えるごーどへいきん, マルコフ連鎖の大数の法則|まるこふれんさのたいすうのほうそく" refname="エルゴード平均の大数の法則（有限状態）"}
有限集合 $S$ の上の既約・非周期的な遷移行列 $P$ が定常分布 $\pi$ をもつとし、$(X_{k})$ を任意の初期分布のマルコフ連鎖とする。任意の $f:S\to\mathbb{R}$ について
$$
E\Bigl[\Bigl(\frac1n\sum_{k=0}^{n-1}f(X_{k})-\pi f\Bigr)^{2}\Bigr]\to0.
$$
特に時間平均は $\pi f$ に確率収束する。
:::

::: intuition
連鎖は時間がたつと初期状態を「忘れる」（$p_{ij}^{(m)}\to\pi_{j}$）。そのため、時間が十分離れた 2 つの値 $f(X_{k})$, $f(X_{l})$ はほとんど無相関になり、時間平均は独立な場合と同じように平均の値に落ち着く。近い時刻どうしの相関は残るが、その組の数は全体の組の数に比べて無視できる。
:::

::: proof
**Step 1（中心化と忘却）.** 【主張：$g\defeq f-\pi f$、$\varepsilon_{m}\defeq\max_{i\in S}\bigl|\sum_{j}p_{ij}^{(m)}g(j)\bigr|$ とすると $\varepsilon_{m}\to0$】\ref{prb:markov-convergence}（初期分布 $\delta_{i}$）から各 $i,j$ で $p_{ij}^{(m)}\to\pi_{j}$、よって $\sum_{j}p_{ij}^{(m)}g(j)\to\pi g=0$。$S$ は有限なので最大値も $0$ に収束する。

**Step 2（共分散の評価）.** 【主張：$k\le l$ について $\abs{E[g(X_{k})g(X_{l})]}\le C\varepsilon_{l-k}$、$C\defeq\max\abs g$】マルコフ連鎖の有限次元分布の式（\ref{prb:markov-chain}、途中の状態について和をとる）から $E[g(X_{k})g(X_{l})]=\sum_{i}P(X_{k}=i)g(i)\sum_{j}p_{ij}^{(l-k)}g(j)$ で、絶対値は $\sum_{i}P(X_{k}=i)C\varepsilon_{l-k}=C\varepsilon_{l-k}$。

**Step 3（2 重の和）.** 
$$
E\Bigl[\Bigl(\frac1n\sum_{k<n}g(X_{k})\Bigr)^{2}\Bigr]\le\frac{2}{n^{2}}\sum_{0\le k\le l<n}\abs{E[g(X_{k})g(X_{l})]}\le\frac{2C}{n^{2}}\sum_{0\le k\le l<n}\varepsilon_{l-k}\le\frac{2C}{n}\sum_{m=0}^{n-1}\varepsilon_{m}.
$$
（$m=l-k$ ごとに組は高々 $n$ 個。）$\varepsilon_{m}\to0$ なので、その算術平均 $\frac1n\sum_{m<n}\varepsilon_{m}$ も $0$ に収束する（チェザロ平均）。左辺は示すべき量。確率収束はチェビシェフの不等式から。
:::

## ギブス・サンプラー {#stat:sec-mc-gibbs}

::: theorem ギブス・サンプラー（無作為走査） {#stat:gibbs-sampler keywords="on a finite product space S = S_1 x ... x S_d with pi > 0, the random-scan Gibbs sampler chooses a coordinate uniformly and resamples it from the conditional distribution of pi given the other coordinates; it is pi-reversible, irreducible and aperiodic, hence converges to pi" index="ギブス・サンプラー|ぎぶすさんぷらー, 完全条件付き分布|かんぜんじょうけんつきぶんぷ" refname="ギブス・サンプラー（無作為走査）"}
$S=S_{1}\times\dots\times S_{d}$（各 $S_{c}$ は有限）、$\pi>0$ とする。$x\in S$ と座標 $c$ について、$x_{-c}$ を $x$ の第 $c$ 座標以外の組とし、
$$
G_{c}(x,y)\defeq\begin{cases}\dfrac{\pi(y)}{\sum_{z:z_{-c}=x_{-c}}\pi(z)}&y_{-c}=x_{-c}\\0&\text{それ以外}\end{cases},\qquad P\defeq\frac1d\sum_{c=1}^{d}G_{c}
$$
とする（座標を一様に選び、その座標だけを、他の座標を固定した条件付き分布から引き直す）。このとき $P$ は $\pi$ について可逆、既約、非周期的で、\ref{stat:mcmc-ergodic-average} と \ref{prb:markov-convergence} が適用できる。
:::

::: intuition
多変数の分布から直接引くのが難しくても、他の座標を固定した 1 変数の条件付き分布から引くのは易しいことが多い。座標ごとの引き直しを繰り返すと、全体として目標の同時分布を定常分布とする連鎖になる。
:::

::: proof
**Step 1（可逆性）.** $y_{-c}=x_{-c}$ なら $\pi(x)G_{c}(x,y)=\frac{\pi(x)\pi(y)}{\sum_{z_{-c}=x_{-c}}\pi(z)}$ は $x,y$ について対称（分母は $x_{-c}=y_{-c}$ だけで決まる）。それ以外は両辺 $0$。$\frac1d$ 倍して足しても詳細つり合いは保たれる。\ref{stat:detailed-balance} から $\pi$ は定常分布。

**Step 2（既約性と非周期性）.** $\pi>0$ なので $G_{c}(x,y)>0$（$y_{-c}=x_{-c}$）。$x$ から $y$ へは座標を 1 つずつ $y$ の値に替えていけばよく、各段階の確率は正。また $P(x,x)\ge\frac1dG_{1}(x,x)>0$ なので、\ref{stat:metropolis-hastings} の Step 4 と同じ議論で非周期的。
:::

::: example 格子の上の事後分布 {#stat:mcmc-grid-example}
2 項データ（$n$ 回中 $k$ 回成功）の成功確率 $\theta$ を、格子 $S=\{\frac1{N+1},\dots,\frac N{N+1}\}$ の上の事前分布 $\pi_{0}$ で考えると、事後分布は $\pi(\theta)\propto\pi_{0}(\theta)\theta^{k}(1-\theta)^{n-k}$。隣の格子点に確率 $\frac12$ ずつ提案する（端では外向きの提案を自分自身への提案とする）対称な $Q$ でメトロポリス–ヘイスティングス法を使うと、採択確率は $\min\bigl(1,\frac{\pi_{0}(\theta')\theta'^{k}(1-\theta')^{n-k}}{\pi_{0}(\theta)\theta^{k}(1-\theta)^{n-k}}\bigr)$ で、周辺尤度を計算せずに済む。$q_{ii}>0$ となる端の点があるので非周期的で、事後平均は時間平均 $\frac1n\sum\theta_{k}$ で近似できる。
:::

::: hypcheck
- **有限な状態空間**：Step 1 の $\varepsilon_{m}$ の一様な収束（最大値の収束）に使った。可算や連続な状態空間では、エルゴード定理の証明に再生の議論や調和解析が要る（下の補足）。
- **非周期性**：\ref{prb:markov-convergence} の前提。時間平均の収束（チェザロ平均）だけなら非周期性は本来不要だが、ここでは収束定理を経由したので使った。
- **$\pi>0$**：採択確率の比を定義し、既約性（Step 3）を得るのに使った。
- **収束の速さは別問題**：定理は収束を保証するだけで、どれだけ走らせればよいか（混合時間）は教えない。多峰な分布では、峰の間を移るのに非常に長い時間がかかりうる。
:::

## 問題 {#stat:sec-mc-problems}

::: problem {#stat:prob-mc-two-state}
$S=\{1,2\}$, $\pi=(\frac13,\frac23)$、$Q$ は常に他方を提案する（$q_{12}=q_{21}=1$）とする。メトロポリス–ヘイスティングスの遷移行列を求め、詳細つり合いを確かめよ。
:::

::: solution
$\alpha_{12}=\min(1,2)=1$, $\alpha_{21}=\min(1,\frac12)=\frac12$。$P=\begin{pmatrix}0&1\\\frac12&\frac12\end{pmatrix}$。$\pi_{1}p_{12}=\frac13=\pi_{2}p_{21}$。$p_{22}>0$ なので非周期的。
:::

::: problem {#stat:prob-mc-periodic}
$S=\{1,2\}$, $P=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ の連鎖は一様分布について可逆だが、$P(X_{n}=1)$ は収束しないことを確かめよ。それでも時間平均は収束することを示せ。
:::

::: solution
$X_{0}=1$ なら $X_{n}$ は $1,2,1,2,\dots$ と交互で、$P(X_{n}=1)$ は $1,0,1,0,\dots$。時間平均 $\frac1n\sum_{k<n}f(X_{k})$ は $\frac{f(1)+f(2)}2$ と高々 $\frac{\max\abs f}n$ しか違わない。非周期性は分布の収束に必要だが、時間平均の収束には必要でない。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 時間平均の収束は平均二乗（したがって確率）収束で示し、概収束は扱わなかった。有限な既約連鎖では、強法則（概収束）も再生の議論（初めて戻るまでの区間が独立同分布になること、\ref{prb:strong-markov}）から示せる（ここでは証明しない）。議論は Levin–Peres–Wilmer『Markov Chains and Mixing Times』第 1・3・4 章、Robert–Casella『Monte Carlo Statistical Methods』第 6・7 章の流れに沿う。

**前提を変えると.**
- **連続な状態空間**：$\mathbb{R}^{d}$ 上の密度 $\pi$ に対しても、提案密度 $q(x,y)$ で同じ採択確率を使えば $\pi$ について可逆な連鎖が得られ、適当な条件（$\pi$-既約性、非周期性、ハリス再帰性）のもとで全変動距離で収束する（ここでは証明しない）。
- **中心極限定理と有効標本サイズ**：時間平均の分散は独立な標本より大きく、$\frac{\sigma_{f}^{2}}n\bigl(1+2\sum_{m\ge1}\rho_{m}\bigr)$（$\rho_{m}$ は自己相関）程度になる。括弧の中の因子で $n$ を割ったものが有効標本サイズである。
- **ハミルトニアン・モンテカルロ**：連続な場合には、勾配を使って遠くへ提案し採択率を高く保つ方法が実用上重要である。

**高い視点から：分布を定常状態として作る.** MCMC は「欲しい分布から直接くじを引く」代わりに、「その分布を平衡状態にもつ力学系を作って走らせる」という発想で、統計力学のシミュレーション（メトロポリスらの 1953 年の論文）から生まれた。詳細つり合いは物理の微視的可逆性にあたり、時間平均が空間平均（期待値）に等しくなるというエルゴード性が、この方法の正しさの根拠である。比喩で言えば、MCMC は、地図（比例定数）を持たずに、各地点の標高（確率の比）だけを見ながら歩き回る登山者で、高い所ほど長く留まるように歩き方を決めれば、十分長く歩いた後の滞在時間の割合が地形そのものを再現する。
:::
