# 仮説検定（Hypothesis Testing）

検定の枠組みと p 値、ネイマン–ピアソンの補題と一様最強力検定、正規母集団の t 検定、尤度比検定とウィルクスの定理、多次元の中心極限定理とピアソンのカイ二乗検定、多重検定（ホルム、ベンジャミニ–ホッホベルク）。

<p class="mn-msc">MSC2020: 62F03, 62F05, 62J15</p>

## 前提知識

- [統計学 › 推定](../../../06-applied-mathematics/03-statistics/01-estimation/index.html)（全体、7 ページ）：正規標本の分布・最尤推定量の漸近論・信頼区間
