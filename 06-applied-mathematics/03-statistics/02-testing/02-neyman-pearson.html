# ネイマン–ピアソンの補題 {#stat:page-neyman-pearson keywords="most powerful tests, randomized threshold lemma P(T > c) + gamma P(T = c) = alpha, Neyman-Pearson lemma (existence, optimality, uniqueness), likelihood ratio tests for simple hypotheses, monotone likelihood ratio, one-parameter exponential families, Karlin-Rubin theorem, uniformly most powerful one-sided tests, monotone power functions, binomial test with randomization, nonexistence of UMP two-sided tests"}

有意水準 $\alpha$ を守る検定はたくさんある。その中で検出力が最も高いものはどれか。帰無仮説と対立仮説がどちらも 1 つの分布（単純仮説）なら、答えは**ネイマン–ピアソンの補題**が与える：2 つの分布の**尤度比**が大きいデータから順に棄却域に入れればよい。さらに、尤度比が 1 つの統計量について単調に増える族（**単調尤度比**をもつ族）では、片側の検定問題に対して、対立仮説のどの値に対しても同時に最強力な検定（**一様最強力検定**）が存在する。正規分布の平均の z 検定や 2 項分布の検定は、すべてこの形である。

## 記法と定義の確認 {#stat:sec-np-notation}

::: notation
- 検定関数・大きさ・検出力関数・有意水準は \ref{stat:hypothesis-test}。
- $P_{0},P_{1}$ は可測空間 $(\mathcal{X},\mathcal{A})$ 上の確率測度で、$\sigma$ 有限測度 $\mu$ に関する密度 $f_{0},f_{1}$ をもつとする（例えば $\mu$ はルベーグ測度か数え上げ測度。$\mu=P_{0}+P_{1}$ ととれば常に可能：\ref{meas:radon-nikodym}）。$E_{j}$ は $P_{j}$ による期待値。
- 体系は $\ZFC$。
:::

## ネイマン–ピアソンの補題 {#stat:sec-np-lemma}

::: lemma しきい値と乱択 {#stat:randomized-threshold keywords="for a real random variable T and alpha in (0, 1) there are c in R and gamma in [0, 1] with P(T > c) + gamma P(T = c) = alpha" index="乱択検定|らんたくけんてい" refname="しきい値と乱択"}
実数値確率変数 $T$ と $\alpha\in(0,1)$ について、$c\in\mathbb{R}$, $\gamma\in[0,1]$ で $P(T>c)+\gamma P(T=c)=\alpha$ となるものがある。
:::

::: intuition
離散な統計量では、しきい値をどこに置いても棄却の確率がちょうど $\alpha$ にならないことがある。境界の値に当たったときだけ硬貨を投げて棄却するかを決めれば、確率を連続的に調整できる。
:::

::: proof
**Step 1（しきい値）.** $a(k)\defeq P(T>k)$ は非増加、右連続（$\{T>k_{j}\}\uparrow\{T>k\}$, $k_{j}\downarrow k$）、$k\to-\infty$ で $1$、$k\to\infty$ で $0$ に近づく。$c\defeq\inf\{k:a(k)\le\alpha\}$ は有限で、右連続性から $a(c)\le\alpha$。$k<c$ では $a(k)>\alpha$ なので、$P(T\ge c)=\lim_{k\uparrow c}a(k)\ge\alpha$。

**Step 2（乱択の割合）.** $P(T=c)=P(T\ge c)-a(c)$。$P(T=c)=0$ なら $a(c)=\alpha$ で $\gamma=0$。そうでなければ $\gamma\defeq\frac{\alpha-a(c)}{P(T=c)}\in[0,1]$（Step 1 の 2 つの不等式から）。
:::

::: theorem ネイマン–ピアソンの補題 {#stat:neyman-pearson keywords="for simple H_0: P_0 vs H_1: P_1 and alpha in (0, 1): (1) there is a test phi* = 1 on {f_1 > k f_0}, gamma on {f_1 = k f_0}, 0 on {f_1 < k f_0} with E_0 phi* = alpha; (2) any test with E_0 phi <= alpha has E_1 phi <= E_1 phi*; more generally any test of the form 1 on {f_1 > k f_0} and 0 on {f_1 < k f_0} is most powerful at its size; (3) uniqueness off {f_1 = k f_0}" index="ネイマン–ピアソンの補題|ねいまんぴあそんのほだい, 最強力検定|さいきょうりょくけんてい, 尤度比検定（単純仮説）|ゆうどひけんてい" refname="ネイマン–ピアソンの補題"}
$\alpha\in(0,1)$ とする。
1. （存在）$k\ge0$ と $\gamma\in[0,1]$ があって、
$$
\varphi^{*}(x)=\begin{cases}1&f_{1}(x)>kf_{0}(x)\\\gamma&f_{1}(x)=kf_{0}(x)\\0&f_{1}(x)<kf_{0}(x)\end{cases}
$$
は $E_{0}[\varphi^{*}]=\alpha$ をみたす。
2. （最強力性）$k\in[0,\infty)$ について、検定 $\varphi^{*}$ が $\{f_{1}>kf_{0}\}$ で $1$、$\{f_{1}<kf_{0}\}$ で $0$ ならば（$\{f_{1}=kf_{0}\}$ での値は任意）、$E_{0}[\varphi]\le E_{0}[\varphi^{*}]$ となるすべての検定 $\varphi$ について $E_{1}[\varphi]\le E_{1}[\varphi^{*}]$。
3. （一意性）1 の $\varphi^{*}$ に対し、$\varphi$ が大きさ $\le\alpha$ で $E_{1}[\varphi]=E_{1}[\varphi^{*}]$ なら、$\mu$-a.e. に $\{f_{1}\ne kf_{0}\}$ の上で $\varphi=\varphi^{*}$。
:::

::: intuition
有意水準 $\alpha$ は「帰無仮説のもとでの確率」という予算で、検出力は「対立仮説のもとでの確率」という利益である。予算あたりの利益が最も大きいデータ、すなわち尤度比 $f_{1}/f_{0}$ が大きいデータから順に棄却域に入れていくのが最適で、これは「価格あたりの価値が高い順に買う」貪欲な戦略が最適になる、連続版のナップサック問題である。
:::

::: proof
**Step 1（1：しきい値の選び方）.** $P_{0}$ のもとで $f_{0}>0$（a.s.）なので、$R\defeq f_{1}/f_{0}$（$f_{0}>0$ の上）は $P_{0}$-a.s. に有限な実数値確率変数。\ref{stat:randomized-threshold} を $P_{0}$ のもとの $R$ に使うと、$c,\gamma$ で $P_{0}(R>c)+\gamma P_{0}(R=c)=\alpha$。$R\ge0$ なので $c<0$ なら $P_{0}(R>c)=1>\alpha$ となり矛盾、よって $k\defeq c\ge0$。$f_{0}>0$ の上では $\{f_{1}>kf_{0}\}=\{R>k\}$ などが成り立つので $E_{0}[\varphi^{*}]=\alpha$。

**Step 2（2：基本の不等式）.** 【主張：すべての $x$ で $(\varphi^{*}(x)-\varphi(x))(f_{1}(x)-kf_{0}(x))\ge0$】$f_{1}>kf_{0}$ なら $\varphi^{*}=1\ge\varphi$、$f_{1}<kf_{0}$ なら $\varphi^{*}=0\le\varphi$、$f_{1}=kf_{0}$ なら第 2 因子が $0$。

**Step 3（2：積分）.** Step 2 を $\mu$ で積分すると（被積分関数は非負で、$\abs{\varphi^{*}-\varphi}\le1$ から可積分）
$$
E_{1}[\varphi^{*}]-E_{1}[\varphi]\ge k\bigl(E_{0}[\varphi^{*}]-E_{0}[\varphi]\bigr)\ge0.
$$

**Step 4（3）.** $E_{0}[\varphi]\le\alpha=E_{0}[\varphi^{*}]$ と $E_{1}[\varphi]=E_{1}[\varphi^{*}]$ から、非負関数 $(\varphi^{*}-\varphi)(f_{1}-kf_{0})$ の積分は $(E_{1}[\varphi^{*}]-E_{1}[\varphi])-k(E_{0}[\varphi^{*}]-E_{0}[\varphi])=-k(E_{0}[\varphi^{*}]-E_{0}[\varphi])\le0$、したがって $0$。よって $\mu$-a.e. にこの積は $0$ で、$\{f_{1}\ne kf_{0}\}$ の上では $\varphi=\varphi^{*}$。
:::

::: example 正規平均の単純仮説 {#stat:np-normal-example}
$N(m,1)$ からの標本で $H_{0}:m=0$ 対 $H_{1}:m=m_{1}$（$m_{1}>0$）。尤度比は $\frac{f_{1}}{f_{0}}=\exp\bigl(m_{1}\sum x_{i}-\frac n2m_{1}^{2}\bigr)$ で、$\bar x$ の増加関数。よって $\{f_{1}>kf_{0}\}=\{\bar X>c'\}$ の形で、大きさ $\alpha$ にすると $c'=z_{\alpha}/\sqrt n$。最強力検定は $m_{1}$ の値によらない。
:::

## 単調尤度比と一様最強力検定 {#stat:sec-np-ump}

::: definition 単調尤度比と一様最強力検定 {#stat:monotone-likelihood-ratio keywords="a family f(x; theta), theta in an interval, with common support has monotone likelihood ratio in T if for theta < theta' the ratio f(x; theta')/f(x; theta) is a nondecreasing function of T(x); a level-alpha test is uniformly most powerful if its power is maximal at every theta in Theta_1" index="単調尤度比|たんちょうゆうどひ, 一様最強力検定|いちようさいきょうりょくけんてい" refname="単調尤度比と一様最強力検定"}
1. $\Theta\subseteq\mathbb{R}$ を区間とし、各 $P_{\theta}$ は $\mu$ に関する密度 $f(x;\theta)$ をもち、集合 $\{x:f(x;\theta)>0\}$ は $\theta$ によらないとする。統計量 $T$ について、$\theta<\theta'$ ならば非減少関数 $h_{\theta,\theta'}$ によって $\frac{f(x;\theta')}{f(x;\theta)}=h_{\theta,\theta'}(T(x))$（台の上）と書けるとき、族は $T$ について**単調尤度比**をもつという。
2. 有意水準 $\alpha$ の検定 $\varphi$ が、有意水準 $\alpha$ のすべての検定 $\psi$ とすべての $\theta\in\Theta_{1}$ について $\beta_{\varphi}(\theta)\ge\beta_{\psi}(\theta)$ をみたすとき、**一様最強力**（UMP）であるという。
:::

::: intuition
単調尤度比は「$T$ が大きいほど、$\theta$ が大きい側の分布の方がもっともらしい」ことを意味する。だから「$\theta$ が大きいか」を問う検定では、$\theta$ のどの対立値に対しても「$T$ が大きいときに棄却する」のが最適で、同じ検定がすべての対立値に対して最強力になる。
:::

::: theorem カーリン–ルービンの定理 {#stat:karlin-rubin keywords="for a family with monotone likelihood ratio in T and H_0: theta <= theta_0 vs H_1: theta > theta_0, the test phi = 1{T > c} + gamma 1{T = c} with E_{theta_0} phi = alpha is UMP of level alpha, and its power function is nondecreasing" index="カーリン–ルービンの定理|かーりんるーびんのていり" refname="カーリン–ルービンの定理"}
族が $T$ について単調尤度比をもつとし、$H_{0}:\theta\le\theta_{0}$ 対 $H_{1}:\theta>\theta_{0}$（$\theta_{0}$ は $\Theta$ の内点）、$\alpha\in(0,1)$ とする。\ref{stat:randomized-threshold} で $P_{\theta_{0}}(T>c)+\gamma P_{\theta_{0}}(T=c)=\alpha$ となる $c,\gamma$ をとり、$\varphi\defeq1_{\{T>c\}}+\gamma1_{\{T=c\}}$ とする。このとき
1. 検出力関数 $\beta_{\varphi}$ は非減少で、$\varphi$ は有意水準 $\alpha$。
2. $\varphi$ は有意水準 $\alpha$ の一様最強力検定。
:::

::: intuition
単調尤度比をもつ族では、対立仮説のどの値と比べても、ネイマン–ピアソンの補題が選ぶ棄却域は「$T$ が大きい側」で同じになる。だから 1 つの検定が対立仮説のすべての値に対して同時に最強力になる。
:::

::: proof
**Step 1（ネイマン–ピアソンの形）.** 【主張：$\theta<\theta'$ について、$k\defeq h_{\theta,\theta'}(c)$ とおくと、$\varphi$ は $\{f(\cdot;\theta')>kf(\cdot;\theta)\}$ で $1$、$\{f(\cdot;\theta')<kf(\cdot;\theta)\}$ で $0$】台の上で $f(x;\theta')/f(x;\theta)=h(T(x))$（$h=h_{\theta,\theta'}$ は非減少）。$h(T)>h(c)$ なら $T>c$（$T\le c$ なら $h(T)\le h(c)$）で $\varphi=1$。$h(T)<h(c)$ なら $T<c$ で $\varphi=0$。台の外は両方の分布で零集合なので影響しない。

**Step 2（検出力の単調性）.** $\theta<\theta'$ とし、$a\defeq E_{\theta}[\varphi]$ とする。Step 1 と\ref{stat:neyman-pearson} の 2（$P_{0}=P_{\theta}$, $P_{1}=P_{\theta'}$）から、$\varphi$ は大きさ $\le a$ の検定の中で $\theta'$ での検出力が最大。定数の検定 $\psi\equiv a$ は大きさ $a$ なので $E_{\theta'}[\varphi]\ge E_{\theta'}[\psi]=a=E_{\theta}[\varphi]$。よって $\beta_{\varphi}$ は非減少で、$\theta\le\theta_{0}$ では $\beta_{\varphi}(\theta)\le\beta_{\varphi}(\theta_{0})=\alpha$。

**Step 3（一様最強力性）.** $\psi$ を有意水準 $\alpha$ の検定、$\theta_{1}>\theta_{0}$ とする。$E_{\theta_{0}}[\psi]\le\alpha=E_{\theta_{0}}[\varphi]$ で、Step 1 から $\varphi$ は $\theta_{0}$ 対 $\theta_{1}$ のネイマン–ピアソンの形なので、\ref{stat:neyman-pearson} の 2 から $E_{\theta_{1}}[\psi]\le E_{\theta_{1}}[\varphi]$。
:::

::: example 指数型分布族と 2 項検定 {#stat:ump-examples}
1. **1 パラメータ指数型分布族**：$f(x;\theta)=a(x)\exp(\eta(\theta)T(x)-A(\theta))$ で $\eta$ が増加関数なら、$\theta<\theta'$ で比は $\exp((\eta(\theta')-\eta(\theta))T(x)-\cdots)$、$T$ の非減少関数なので単調尤度比をもつ。正規分布の平均（$T=\sum x_{i}$）、ポアソン分布、2 項分布（$\eta(p)=\log\frac p{1-p}$）、指数分布（$\eta(\lambda)=-\lambda$ なので $T=-\sum x_{i}$）がこの形。
2. **2 項検定**：$\mathrm{Bin}(n,p)$ で $H_{0}:p\le p_{0}$ の一様最強力検定は「$T>c$ で棄却、$T=c$ では確率 $\gamma$ で棄却」。$T$ は離散なので、大きさをちょうど $\alpha$ にするには一般に乱択（$0<\gamma<1$）が必要である。
:::

::: hypcheck
- **単純仮説（ネイマン–ピアソン）**：最強力性は 1 点対 1 点の比較である。合成仮説へは、単調尤度比を通して各対立値ごとに同じ検定が最強力になることで拡張した。
- **台が $\theta$ によらないこと**：単調尤度比の定義で比を有限の値にするために仮定した。一様分布 $U(0,\theta)$ のように台が動く族でも、比を $[0,\infty]$ に値をとるとして同様の議論ができるが、ここでは扱わない。
- **片側の対立仮説**：両側 $H_{1}:\theta\ne\theta_{0}$ では、$\theta>\theta_{0}$ 側と $\theta<\theta_{0}$ 側で最強力検定の棄却域が逆向きになるので、一般に一様最強力検定は存在しない（正規平均では、片側 z 検定はそれぞれの側で最強力で、両者は異なる）。
:::

## 問題 {#stat:sec-np-problems}

::: problem {#stat:prob-np-exponential}
平均 $1/\lambda$ の指数分布で $H_{0}:\lambda\ge\lambda_{0}$ 対 $H_{1}:\lambda<\lambda_{0}$ の一様最強力検定を求めよ（$\sum X_{i}$ が $H_{0}$ の境界でガンマ分布にしたがうことを使ってよい）。
:::

::: solution
$\theta\defeq-\lambda$ とすると $H_{0}:\theta\le-\lambda_{0}$ で、密度 $\lambda^{n}e^{-\lambda\sum x_{i}}=\exp(\theta\sum x_{i}+n\log(-\theta))$ は $T=\sum x_{i}$ について単調尤度比をもつ。\ref{stat:karlin-rubin} から「$\sum X_{i}>c$ で棄却」、$c$ は $\lambda=\lambda_{0}$ での上側 $\alpha$ 点（連続分布なので乱択は不要）。
:::

::: problem {#stat:prob-np-power-at-least-size}
最強力検定の検出力はその大きさ以上であることを、\ref{stat:neyman-pearson} の 2 から示せ。
:::

::: solution
大きさ $a$ の最強力検定 $\varphi^{*}$ と定数の検定 $\psi\equiv a$（大きさ $a$）を比べると $E_{1}[\varphi^{*}]\ge E_{1}[\psi]=a$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** ネイマン–ピアソンの補題では、密度の存在以外に分布の形の仮定を使っていない。独立性も不要である。議論は Lehmann–Romano『Testing Statistical Hypotheses』第 3 章に沿う。

**前提を変えると.**
- **不偏検定**：両側の問題では、検出力が対立仮説の上で常に $\alpha$ 以上という「不偏性」を課すと、指数型分布族では一様最強力不偏検定（UMPU）が存在する。正規平均の両側 t 検定はこの意味で最適である。
- **局所最強力検定**：対立仮説が帰無仮説の近くにある場合、検出力関数の $\theta_{0}$ での傾きを最大化すると、スコア $\partial_{\theta}\log f(X;\theta_{0})$ に基づく検定（スコア検定）が得られる。
- **ベイズ検定**：事前分布と損失を決めると、事後オッズ（ベイズ因子 × 事前オッズ）がしきい値を超えるかで判定する規則が最適になる。これも尤度比の比較という形はネイマン–ピアソンと同じである。

**高い視点から：線形計画と双対性.** 「$E_{0}[\varphi]\le\alpha$、$0\le\varphi\le1$ のもとで $E_{1}[\varphi]=\int\varphi f_{1}d\mu$ を最大化する」問題は、$\varphi$ についての（無限次元の）線形計画で、しきい値 $k$ はその双対変数（ラグランジュ乗数）にあたる。ネイマン–ピアソンの補題の証明の不等式 $(\varphi^{*}-\varphi)(f_{1}-kf_{0})\ge0$ は、まさに双対性による最適性の証明書である。比喩で言えば、予算 $\alpha$ で品物（データ点）を買い集めるとき、「値段 $f_{0}$ あたりの価値 $f_{1}$」の高い順に、予算が尽きるまで買い、最後の 1 つは予算に合わせて一部だけ買う（乱択）、というのが最適な買い物である。
:::
