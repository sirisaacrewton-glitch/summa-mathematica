# 尤度比検定とカイ二乗検定 {#stat:page-likelihood-ratio-chi-square keywords="likelihood ratio statistic, generalized likelihood ratio test, Wilks theorem in one dimension 2 log likelihood ratio => chi^2_1, multivariate central limit theorem for smooth test functions by Lindeberg's replacement method, convergence of quadratic forms, Pearson's chi-square goodness-of-fit statistic sum (N_j - n p_j)^2/(n p_j) => chi^2_{k-1}, covariance I - q q^T as a projection"}

ネイマン–ピアソンの補題は単純仮説の最適な検定が尤度比で与えられることを示した。一般の仮説でも、帰無仮説のもとでの最大の尤度と全体での最大の尤度の比（**尤度比統計量**）は自然な検定統計量になる。その正確な分布は一般にはわからないが、大標本では対数尤度比の 2 倍が $\chi^{2}$ 分布に近づく（**ウィルクスの定理**）。このページでは、1 次元のパラメータについてウィルクスの定理を前の系列の最尤推定量の漸近論から導き、さらに、多項分布の度数が理論値に合うかを調べる**ピアソンのカイ二乗検定**の漸近分布を、多次元の中心極限定理（ここで証明する）から導く。

## 記法と定義の確認 {#stat:sec-lr-notation}

::: notation
- 検定・p 値は \ref{stat:hypothesis-test}, \ref{stat:p-value}。最尤推定量の漸近論（仮定 (A1)〜(A4) を含む）とその証明の記号 $\ell_{n}$, $M$, $\delta_{0}$ は \ref{stat:mle-asymptotic-normality}。大標本理論の道具は \ref{stat:slutsky}, \ref{stat:tightness-from-weak-convergence}、連続写像定理は \ref{prb:portmanteau}。
- $\chi^{2}$ 分布は \ref{stat:chi-square-t}, \ref{stat:chi-square-density}、多次元正規分布は \ref{prb:multivariate-normal}, \ref{prb:multivariate-normal-properties}, \ref{prb:multivariate-uniqueness}。剰余つきの多変数のテイラー展開は \ref{calc:multivariable-taylor}。
- $C_{b}^{3}(\mathbb{R}^{d})$：$C^{3}$ 級で、関数自身と 3 階までの偏導関数がすべて有界な関数の全体。$K_{3}(f)\defeq\sum_{i,j,l}\sup\abs{\partial_{i}\partial_{j}\partial_{l}f}$。
- 体系は $\ZFC$。
:::

## 尤度比検定とウィルクスの定理 {#stat:sec-lr-wilks}

::: definition 尤度比統計量 {#stat:likelihood-ratio-statistic keywords="lambda(x) = sup_{Theta_0} L(theta; x) / sup_Theta L(theta; x); likelihood ratio test rejects for small lambda, i.e. large -2 log lambda" index="尤度比統計量|ゆうどひとうけいりょう, 尤度比検定|ゆうどひけんてい" refname="尤度比統計量"}
$H_{0}:\theta\in\Theta_{0}$ について
$$
\lambda(x)\defeq\frac{\sup_{\theta\in\Theta_{0}}L(\theta;x)}{\sup_{\theta\in\Theta}L(\theta;x)}\in[0,1]
$$
を**尤度比統計量**といい、$\lambda$ が小さいとき（$-2\log\lambda$ が大きいとき）$H_{0}$ を棄却する検定を**尤度比検定**という。$\Theta_{0}=\{\theta_{0}\}$ で最尤推定量 $\hat\theta$ があれば $-2\log\lambda=2(\ell(\hat\theta)-\ell(\theta_{0}))$。
:::

::: intuition
帰無仮説の中で最善を尽くした説明と、制限なしで最善を尽くした説明を比べる。帰無仮説が正しければ両者の差は「偶然のゆらぎ」程度にとどまり、正しくなければ大きく開く。
:::

::: theorem ウィルクスの定理（1 次元） {#stat:wilks-theorem keywords="under the assumptions (A1)-(A4) of the MLE theorem and for a consistent sequence of roots theta-hat_n of the likelihood equation, 2(l_n(theta-hat_n) - l_n(theta_0)) => chi^2_1 under theta_0" index="ウィルクスの定理|うぃるくすのていり" refname="ウィルクスの定理（1 次元）"}
\ref{stat:mle-asymptotic-normality} の仮定 (A1)〜(A4) のもとで、統計量の列 $\hat\theta_{n}$ が $\hat\theta_{n}\xrightarrow{P}\theta_{0}$ かつ $P_{\theta_{0}}(\ell_{n}'(\hat\theta_{n})=0)\to1$ をみたせば、$\theta_{0}$ のもとで
$$
\Lambda_{n}\defeq2\bigl(\ell_{n}(\hat\theta_{n})-\ell_{n}(\theta_{0})\bigr)\Rightarrow\chi_{1}^{2}.
$$
特に「$\Lambda_{n}\ge\chi_{1,\alpha}^{2}$ なら $H_{0}:\theta=\theta_{0}$ を棄却」は、漸近的に大きさ $\alpha$ の検定である。
:::

::: intuition
対数尤度は最尤推定量の近くで放物線 $\ell(\theta)\approx\ell(\hat\theta)-\frac n2I(\theta-\hat\theta)^{2}$ に見える。だから $\Lambda_{n}\approx nI(\hat\theta-\theta_{0})^{2}=\bigl(\sqrt{nI}(\hat\theta-\theta_{0})\bigr)^{2}$ で、括弧の中は標準正規分布に近いので、その 2 乗は $\chi_{1}^{2}$ に近い。
:::

::: proof
**Step 1（2 次の展開）.** 【主張：$\abs{\hat\theta_{n}-\theta_{0}}<\delta_{0}$, $\ell_{n}'(\hat\theta_{n})=0$ の事象の上で $\Lambda_{n}=Q_{n}\cdot n(\hat\theta_{n}-\theta_{0})^{2}$、ただし $\abs{Q_{n}+\frac1n\ell_{n}''(\theta_{0})}\le\bar M_{n}\abs{\hat\theta_{n}-\theta_{0}}$】$\hat\theta_{n}\ne\theta_{0}$ のとき $Q_{n}\defeq\frac{\Lambda_{n}}{n(\hat\theta_{n}-\theta_{0})^{2}}$、それ以外で $Q_{n}\defeq I(\theta_{0})$ とおく（可測）。$\ell_{n}$ を $\hat\theta_{n}$ のまわりで 2 次の剰余つきでテイラー展開する（\ref{calc:taylor-lagrange}）と、$\ell_{n}'(\hat\theta_{n})=0$ から、$\hat\theta_{n}$ と $\theta_{0}$ の間の $\tilde\theta$ で $\ell_{n}(\theta_{0})=\ell_{n}(\hat\theta_{n})+\frac12\ell_{n}''(\tilde\theta)(\theta_{0}-\hat\theta_{n})^{2}$、すなわち $Q_{n}=-\frac1n\ell_{n}''(\tilde\theta)$。（A3）と平均値の定理から $\abs{\ell_{n}''(\tilde\theta)-\ell_{n}''(\theta_{0})}\le\sum_{i}M(X_{i})\abs{\tilde\theta-\theta_{0}}\le n\bar M_{n}\abs{\hat\theta_{n}-\theta_{0}}$（$\bar M_{n}\defeq\frac1n\sum M(X_{i})$）。

**Step 2（各因子の極限）.** \ref{stat:mle-asymptotic-normality} の証明の Step 3 から $-\frac1n\ell_{n}''(\theta_{0})\to I(\theta_{0})$（a.s.）。$\bar M_{n}\to E M$（a.s.）と $\hat\theta_{n}\xrightarrow{P}\theta_{0}$ から、Step 1 の事象（確率 $\to1$）の上での評価により $Q_{n}\xrightarrow{P}I(\theta_{0})$。同じ定理の 2 から $W_{n}\defeq\sqrt n(\hat\theta_{n}-\theta_{0})\Rightarrow N(0,1/I(\theta_{0}))$、連続写像定理（\ref{prb:portmanteau} の 3）から $W_{n}^{2}\Rightarrow\frac1{I(\theta_{0})}\chi_{1}^{2}$。

**Step 3（結論）.** $\Lambda_{n}-Q_{n}W_{n}^{2}$ は確率 $\to1$ で $0$ なので $0$ に確率収束する。\ref{stat:slutsky}（積と和）から $\Lambda_{n}\Rightarrow I(\theta_{0})\cdot\frac1{I(\theta_{0})}\chi_{1}^{2}=\chi_{1}^{2}$。検定については、$\chi_{1}^{2}$ は連続分布なので $P(\Lambda_{n}\ge\chi_{1,\alpha}^{2})\to\alpha$。
:::

## 多次元の中心極限定理 {#stat:sec-lr-multivariate-clt}

::: theorem 多次元の中心極限定理（なめらかな関数版） {#stat:multivariate-clt-smooth keywords="for i.i.d. mean-zero random vectors X_i in R^d with covariance Sigma and E|X|^3 < infinity, and Z ~ N(0, Sigma): |E f(S_n / sqrt(n)) - E f(Z)| <= K_3(f) d^{3/2} (E|X|^3 + E|Z|^3) / (6 sqrt(n)) for f in C_b^3; proof by Lindeberg's replacement method" index="多次元の中心極限定理|たじげんのちゅうしんきょくげんていり, リンデベルグの置き換え法|りんでべるぐのおきかえほう" refname="多次元の中心極限定理（なめらかな関数版）"}
$X_{1},X_{2},\dots$ を独立同分布な $\mathbb{R}^{d}$ 値確率変数で、$E[X]=0$、共分散行列 $\Sigma$、$E\abs X^{3}<\infty$ とし、$Z\sim N(0,\Sigma)$、$S_{n}\defeq X_{1}+\dots+X_{n}$ とする。すべての $f\in C_{b}^{3}(\mathbb{R}^{d})$ について
$$
\Bigl|E\Bigl[f\Bigl(\frac{S_{n}}{\sqrt n}\Bigr)\Bigr]-E[f(Z)]\Bigr|\le\frac{K_{3}(f)\,d^{3/2}\bigl(E\abs X^{3}+E\abs Z^{3}\bigr)}{6\sqrt n}\to0.
$$
:::

::: intuition
和を構成する $n$ 個の項を、同じ平均と共分散をもつ正規確率変数に 1 つずつ置き換えていく。1 回の置き換えで変わるのは、テイラー展開の 3 次以上の項だけである（1 次と 2 次の項は平均と共分散が同じなので打ち消し合う）。3 次の項は $n^{-3/2}$ の大きさで、$n$ 回の置き換えの合計でも $n^{-1/2}$ にしかならない。すべて置き換え終えた和は正確に正規分布である。
:::

::: proof
**Step 1（置き換えの列）.** $Z_{1},\dots,Z_{n}$ を $N(0,\Sigma)$ の独立同分布で $(X_{i})$ と独立なものとする（直積空間上に実現してよい。主張は分布だけで決まる）。$\frac1{\sqrt n}\sum Z_{i}\sim N(0,\Sigma)$（特性関数 $\prod_{i}e^{-\langle u,\Sigma u\rangle/(2n)}$ と \ref{prb:multivariate-uniqueness}）。$k=1,\dots,n$ について $U_{k}\defeq\frac1{\sqrt n}\bigl(\sum_{i<k}X_{i}+\sum_{i>k}Z_{i}\bigr)$ とすると、
$$
E\Bigl[f\Bigl(\frac{S_{n}}{\sqrt n}\Bigr)\Bigr]-E[f(Z)]=\sum_{k=1}^{n}\Bigl(E\bigl[f(U_{k}+\tfrac{X_{k}}{\sqrt n})\bigr]-E\bigl[f(U_{k}+\tfrac{Z_{k}}{\sqrt n})\bigr]\Bigr)
$$
（$U_{k}+X_{k}/\sqrt n=U_{k+1}+Z_{k+1}/\sqrt n$ により和は打ち消し合う）。

**Step 2（テイラー展開）.** 【主張：$f(u+h)=f(u)+\sum_{i}\partial_{i}f(u)h_{i}+\frac12\sum_{i,j}\partial_{i}\partial_{j}f(u)h_{i}h_{j}+R(u,h)$、$\abs{R}\le\frac16K_{3}(f)d^{3/2}\abs h^{3}$】3 次の剰余をもつテイラーの定理（\ref{calc:multivariable-taylor}）から $R=\frac16\sum_{i,j,l}\partial_{i}\partial_{j}\partial_{l}f(\xi)h_{i}h_{j}h_{l}$（$\xi$ は線分上の点）で、$\abs{h_{i}h_{j}h_{l}}\le\abs h^{3}$ から $\abs R\le\frac16K_{3}(f)\abs h^{3}\le\frac16K_{3}(f)d^{3/2}\abs h^{3}$（$d\ge1$）。

**Step 3（1 次と 2 次の打ち消し）.** $U_{k}$ は $X_{k}$ とも $Z_{k}$ とも独立で、$\partial_{i}f$, $\partial_{i}\partial_{j}f$ は有界。独立性から
$$
E[\partial_{i}f(U_{k})X_{k}^{i}]=E[\partial_{i}f(U_{k})]E[X_{k}^{i}]=0,\qquad E[\partial_{i}\partial_{j}f(U_{k})X_{k}^{i}X_{k}^{j}]=E[\partial_{i}\partial_{j}f(U_{k})]\Sigma_{ij},
$$
$Z_{k}$ についても同じ値。よって $k$ 番目の差は $E[R(U_{k},X_{k}/\sqrt n)]-E[R(U_{k},Z_{k}/\sqrt n)]$ で、絶対値は $\frac{K_{3}(f)d^{3/2}}{6n^{3/2}}(E\abs X^{3}+E\abs Z^{3})$ 以下。$n$ 個足す。
:::

::: lemma 2 次形式の法則収束 {#stat:quadratic-form-convergence keywords="if E f(W_n) -> E f(Z) for all f in C_b^3(R^d) and the distribution function of |Z|^2 is continuous, then |W_n|^2 => |Z|^2" index="2 次形式の法則収束|にじけいしきのほうそくしゅうそく" refname="2 次形式の法則収束"}
$\mathbb{R}^{d}$ 値確率変数 $W_{n}$, $Z$ について、すべての $f\in C_{b}^{3}(\mathbb{R}^{d})$ で $E[f(W_{n})]\to E[f(Z)]$ とし、$\abs Z^{2}$ の分布関数 $F$ が連続とする。このとき $\abs{W_{n}}^{2}\Rightarrow\abs Z^{2}$。
:::

::: intuition
「半径 $\sqrt x$ の球の中に入るか」という指示関数を、境界の外側で少しずつ $0$ に落ちるなめらかな関数ではさむ。なめらかな関数については期待値の収束がわかっているので、境界の厚みを $0$ にすれば確率の収束が得られる。
:::

::: proof
**Step 1（なめらかな階段）.** \ref{calc:non-analytic-smooth} の 2 の関数 $s$（$C^{\infty}$、$t\le0$ で $0$、$t\ge1$ で $1$、値は $[0,1]$）を使い、$\psi\defeq1-s$ とする。$x\ge0$, $\varepsilon>0$ について $f_{x,\varepsilon}(w)\defeq\psi\bigl((\abs w^{2}-x)/\varepsilon\bigr)$ は $C^{\infty}$ で、$\abs w^{2}\le x$ で $1$、$\abs w^{2}\ge x+\varepsilon$ で $0$。導関数は球 $\{\abs w^{2}\le x+\varepsilon\}$ の外で $0$ なので、$f_{x,\varepsilon}\in C_{b}^{3}$。不等式 $1_{\{\abs w^{2}\le x\}}\le f_{x,\varepsilon}(w)\le1_{\{\abs w^{2}\le x+\varepsilon\}}$ が成り立つ。

**Step 2（はさみうち）.** $x\ge0$ について
$$
\limsup_{n}P(\abs{W_{n}}^{2}\le x)\le\lim_{n}E[f_{x,\varepsilon}(W_{n})]=E[f_{x,\varepsilon}(Z)]\le F(x+\varepsilon),
$$
$x\ge\varepsilon$ なら同様に $\liminf_{n}P(\abs{W_{n}}^{2}\le x)\ge E[f_{x-\varepsilon,\varepsilon}(Z)]\ge F(x-\varepsilon)$。$\varepsilon\to0$ として $F$ の連続性から $P(\abs{W_{n}}^{2}\le x)\to F(x)$（$x>0$）。$x<0$ では両辺 $0$。$x=0$ では、上からの評価で $\varepsilon\to0$ とすると $\limsup_{n}P(\abs{W_{n}}^{2}\le0)\le F(0)$ で、$F$ は連続かつ負の値で $0$ なので $F(0)=0$。よってすべての $x$ で分布関数が収束し、法則収束の定義（\ref{prb:convergence-in-distribution}）をみたす。
:::

## ピアソンのカイ二乗検定 {#stat:sec-lr-pearson}

::: theorem ピアソンのカイ二乗適合度検定 {#stat:pearson-chi-square keywords="for counts N_1..N_k of n i.i.d. observations in k categories with probabilities p_j > 0, X^2 = sum (N_j - n p_j)^2 / (n p_j) => chi^2_{k-1}; asymptotic size alpha of the test rejecting when X^2 >= chi^2_{k-1, alpha}" index="ピアソンのカイ二乗検定|ぴあそんのかいにじょうけんてい, 適合度検定|てきごうどけんてい" refname="ピアソンのカイ二乗適合度検定"}
$Y_{1},Y_{2},\dots$ を独立同分布で $P(Y=j)=p_{j}>0$（$j=1,\dots,k$, $k\ge2$）とし、$N_{j}\defeq\#\{i\le n:Y_{i}=j\}$、
$$
X_{n}^{2}\defeq\sum_{j=1}^{k}\frac{(N_{j}-np_{j})^{2}}{np_{j}}
$$
とする。このとき $X_{n}^{2}\Rightarrow\chi_{k-1}^{2}$。特に「$X_{n}^{2}\ge\chi_{k-1,\alpha}^{2}$ なら $H_{0}:P(Y=j)=p_{j}$（すべての $j$）を棄却」は漸近的に大きさ $\alpha$。
:::

::: intuition
各度数のずれを、その標準偏差の目安 $\sqrt{np_{j}}$ で測って 2 乗して足したのが $X^{2}$ である。$k$ 個のずれは合計が必ず $0$（$\sum N_{j}=n$）という 1 つの制約を受けるので、実質的に自由に動けるのは $k-1$ 方向で、それが自由度 $k-1$ の正体である。幾何学的には、ずれのベクトルは単位ベクトル $(\sqrt{p_{j}})$ に直交する $k-1$ 次元の超平面の上にある。
:::

::: proof
**Step 1（ベクトル化）.** 【主張：$X_{n}^{2}=\abs{W_{n}}^{2}$、$W_{n}=\frac1{\sqrt n}\sum_{i\le n}V_{i}$、$V_{i}$ は独立同分布で平均 $0$、共分散 $I-qq^{\top}$（$q\defeq(\sqrt{p_{1}},\dots,\sqrt{p_{k}})^{\top}$）】$V_{i}$ の第 $j$ 成分を $(1_{\{Y_{i}=j\}}-p_{j})/\sqrt{p_{j}}$ とすると $W_{n}$ の第 $j$ 成分は $(N_{j}-np_{j})/\sqrt{np_{j}}$。$E[V^{j}]=0$、$E[V^{j}V^{l}]=\frac{p_{j}\delta_{jl}-p_{j}p_{l}}{\sqrt{p_{j}p_{l}}}=\delta_{jl}-\sqrt{p_{j}p_{l}}$。$V$ は有界なので $E\abs V^{3}<\infty$。

**Step 2（極限の分布）.** 【主張：$Z\sim N(0,I-qq^{\top})$ なら $\abs Z^{2}\sim\chi_{k-1}^{2}$】$\abs q=1$ なので、\ref{stat:normal-sample-theorem} の Step 1 と同じく第 1 行が $q^{\top}$ の直交行列 $Q$ がある。$Qq=e_{1}$ なので $Q(I-qq^{\top})Q^{\top}=I-e_{1}e_{1}^{\top}$、\ref{prb:multivariate-normal-properties} から $QZ\sim N(0,\operatorname{diag}(0,1,\dots,1))$。特性関数が各成分の特性関数の積（第 1 成分は定数 $0$ の特性関数 $1$）なので、\ref{prb:multivariate-uniqueness} から $(QZ)_{1}=0$（a.s.）、$(QZ)_{2},\dots,(QZ)_{k}$ は独立な標準正規。$\abs Z^{2}=\abs{QZ}^{2}=\sum_{i\ge2}(QZ)_{i}^{2}\sim\chi_{k-1}^{2}$。

**Step 3（結論）.** \ref{stat:multivariate-clt-smooth} から $E[f(W_{n})]\to E[f(Z)]$（$f\in C_{b}^{3}$）。$\chi_{k-1}^{2}$ は密度をもつので分布関数は連続（\ref{stat:chi-square-density}）。\ref{stat:quadratic-form-convergence} から $X_{n}^{2}=\abs{W_{n}}^{2}\Rightarrow\chi_{k-1}^{2}$。検定の大きさは連続分布の上側 $\alpha$ 点での収束から。
:::

::: example さいころの公平性 {#stat:pearson-dice-example}
さいころを $n=120$ 回振って目の度数が $(15,25,18,22,17,23)$ だったとする。$np_{j}=20$ で $X^{2}=\frac{25+25+4+4+9+9}{20}=3.8$。自由度 $5$ の上側 5% 点は約 $11.07$ なので、有意水準 5% では公平性は棄却されない（これは公平であることの証明ではない：\ref{stat:p-value} の後の注意）。
:::

::: hypcheck
- **ウィルクスの定理の仮定**：最尤推定量の漸近正規性の仮定 (A1)〜(A4) と、$\theta_{0}$ が $\Theta$ の内点であることを使った。$\theta_{0}$ が境界にある（例：分散成分が $0$ かどうかの検定）と、極限は $\frac12\chi_{0}^{2}+\frac12\chi_{1}^{2}$ のような混合になる。
- **3 次モーメント**：\ref{stat:multivariate-clt-smooth} の剰余の評価に使った。ピアソンの検定では $V$ が有界なので自動的にみたされる。2 次モーメントだけでも結論（収束）自体は成り立つが、その証明には切り捨ての議論が要る。
- **$p_{j}>0$**：$\sqrt{p_{j}}$ で割るために使った。また、$np_{j}$ が小さいと近似は悪い（実務では $np_{j}\ge5$ 程度が目安とされることが多いが、これは経験則で、定理ではない）。
:::

## 問題 {#stat:sec-lr-problems}

::: problem {#stat:prob-lr-normal-wilks}
$N(m,1)$ の標本で $H_{0}:m=m_{0}$ の $-2\log\lambda$ を計算し、それが $H_{0}$ のもとで（漸近的でなく）正確に $\chi_{1}^{2}$ にしたがうことを示せ。
:::

::: solution
$\ell(m)=-\frac12\sum(x_{i}-m)^{2}+$ 定数、$\hat m=\bar x$。$2(\ell(\bar x)-\ell(m_{0}))=\sum(x_{i}-m_{0})^{2}-\sum(x_{i}-\bar x)^{2}=n(\bar x-m_{0})^{2}$（\ref{stat:sample-mean-variance} の Step 2）。$\sqrt n(\bar X-m_{0})\sim N(0,1)$ なので 2 乗は $\chi_{1}^{2}$。
:::

::: problem {#stat:prob-lr-two-categories}
$k=2$ のとき、$X_{n}^{2}=\frac{(N_{1}-np_{1})^{2}}{np_{1}(1-p_{1})}$ を示し、1 次元の中心極限定理だけから $X_{n}^{2}\Rightarrow\chi_{1}^{2}$ を導け。
:::

::: solution
$N_{2}-np_{2}=-(N_{1}-np_{1})$ なので $X^{2}=(N_{1}-np_{1})^{2}(\frac1{np_{1}}+\frac1{np_{2}})=\frac{(N_{1}-np_{1})^{2}}{np_{1}p_{2}}$。中心極限定理から $\frac{N_{1}-np_{1}}{\sqrt{np_{1}p_{2}}}\Rightarrow N(0,1)$、連続写像定理で 2 乗。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 多次元の中心極限定理は、特性関数の連続性定理（多次元のレヴィの連続性定理）を使わず、リンデベルグの置き換え法で、なめらかな関数に対する形で直接示した。そのため結論はなめらかな関数の期待値の収束で、法則収束への移行は必要な 2 次形式についてだけ行った。議論は van der Vaart『Asymptotic Statistics』第 16・17 章、リンデベルグの方法は Billingsley『Probability and Measure』の流儀に沿う。

**前提を変えると.**
- **多次元のウィルクスの定理**：$\Theta\subseteq\mathbb{R}^{p}$、$H_{0}$ が $r$ 個の独立な制約で定まる部分多様体なら、$-2\log\lambda\Rightarrow\chi_{r}^{2}$（ここでは証明しない）。ピアソンの検定は、多項分布で $p$ を固定する（$k-1$ 個の制約）場合の、尤度比検定と漸近同等な検定である。
- **パラメータを推定する適合度検定**：理論確率 $p_{j}(\theta)$ が $s$ 次元のパラメータに依存し、$\theta$ を（度数に基づく）最尤法で推定すると、極限は $\chi_{k-1-s}^{2}$ になる。自由度が推定したパラメータの数だけ減る。
- **分割表の独立性の検定**：$r\times c$ の分割表で行と列の独立性を検定するピアソンの統計量は $\chi_{(r-1)(c-1)}^{2}$ に近づく（上の場合の応用）。

**高い視点から：情報幾何と $\chi^{2}$.** 対数尤度比の 2 倍は、最尤推定量と帰無仮説の点の間の「フィッシャー計量で測った距離の 2 乗」の近似で、正規分布で近似した世界では、それはちょうど正規ベクトルの射影の長さの 2 乗、すなわち $\chi^{2}$ 分布にしたがう。ピアソンの統計量も、多項分布の単体の上で、フィッシャー計量で測った経験分布と仮説の分布の距離の 2 乗（の近似）である。比喩で言えば、$\chi^{2}$ 検定は「観測点が仮説の点からどれだけ離れているか」を、その方向のゆらぎの大きさを 1 とする物差しで測り、ずれの方向の数（自由度）だけの成分の 2 乗を足し合わせる。
:::
