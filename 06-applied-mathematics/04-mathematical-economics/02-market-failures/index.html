# 市場の失敗と政府（Market Failures and Government）

外部性とピグー税・コースの定理・排出量取引、公共財とサミュエルソン条件・ただ乗り、独占と寡占（クールノー均衡）、情報の非対称（逆選択・モラルハザード）。厚生経済学の基本定理の前提が崩れる場所と、政府の介入の数学的な根拠。

<p class="mn-msc">MSC2020: 91B18, 91B76, 91A10, 91B44</p>
