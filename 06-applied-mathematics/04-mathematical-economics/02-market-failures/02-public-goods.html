# 公共財 {#econ:page-public-goods keywords="public good, non-rivalry and non-excludability, Samuelson condition sum of marginal rates of substitution equals marginal cost, voluntary contribution game, Nash equilibrium underprovision, free riding worsens with the number of consumers, Lindahl equilibrium with personalized prices is efficient, Groves mechanism, Clarke pivot mechanism, truthful reporting is a dominant strategy, budget imbalance"}

灯台・国防・基礎研究のように、一人が使っても他人の使える量が減らず（**非競合性**）、お金を払わない人を締め出すのが難しい（**非排除性**）財を**公共財**という。公共財の量は全員に共通なので、市場で各人が自分の分だけを買うという仕組みが働かない。このページでは、(1) 公共財の効率的な量が「各人の限界便益の和 ＝ 限界費用」（**サミュエルソン条件**）で決まること、(2) 各人が自発的に負担する仕組みでは公共財が過少になり（**ただ乗り**）、その程度は人数とともに悪化しうること、(3) 個人ごとに異なる価格をつける**リンダール均衡**は効率的だが、各人が自分の便益を正直に申告する誘因がないこと、(4) **グローブス・メカニズム**（特に**クラーク・メカニズム**）では正直な申告が支配戦略になること、を証明する。

## 記法と定義の確認 {#econ:sec-pg-notation}

::: notation
- 準線形効用と、お金による効用の移転の考え方は \ref{econ:quasilinear-efficiency} と同じ。\ref{econ:pareto-efficiency} の定義を、このページの「公共財の量と私的財の配分の組」に読み替える。
- 消費者は $i=1,\dots,n$（$n\ge2$）。公共財の量 $G\ge0$ を作る費用は私的財で測って $G$（限界費用 $1$）とする。
- 価格を所与とする最大化の議論は \ref{econ:permit-market-efficiency} の証明と同じ型である。
:::

## サミュエルソン条件 {#econ:sec-pg-samuelson}

::: definition 公共財のある経済 {#econ:public-good-economy keywords="n consumers with quasi-linear utility v_i(G) + x_i; public good G costs G units of the private good; allocation (G, x) feasible if sum x_i + G <= sum w_i; v_i continuous, nondecreasing" index="公共財|こうきょうざい, 非競合性|ひきょうごうせい, 非排除性|ひはいじょせい" refname="公共財のある経済"}
消費者 $i$ の効用を $v_{i}(G)+x_{i}$（$x_{i}\in\mathbb{R}$ は私的財、$v_{i}:[0,\infty)\to\mathbb{R}$ は連続）、私的財の初期保有を $w_{i}$ とする。$(G,x)$（$G\ge0$, $x=(x_{i})$）が $\sum_{i}x_{i}+G\le\sum_{i}w_{i}$ をみたすとき**実行可能な配分**という。$G$ は全員が同時に消費する（非競合性）。
:::

::: intuition
私的財なら 1 単位は 1 人しか使えないので、その 1 単位を最も高く評価する人に回すのが効率的である。公共財の 1 単位は全員が同時に使うので、その 1 単位の価値は全員の評価の「和」になる。
:::

::: theorem サミュエルソン条件 {#econ:samuelson-condition keywords="a feasible allocation (G, x) with sum x_i + G = sum w_i is Pareto efficient iff G maximizes sum_i v_i(G) - G; if the v_i are differentiable and G > 0 this gives sum_i v_i'(G) = 1 (sum of marginal benefits equals marginal cost)" index="サミュエルソン条件|さみゅえるそんじょうけん" refname="サミュエルソン条件"}
\ref{econ:public-good-economy} の設定で、$\sum_{i}x_{i}+G=\sum_{i}w_{i}$ をみたす実行可能な配分 $(G,x)$ について、
1. $(G,x)$ がパレート効率的であることと、$G$ が $\Phi(G)\defeq\sum_{i}v_{i}(G)-G$ の $[0,\infty)$ での最大点であることは同値。
2. $v_{i}$ が微分可能で、$G>0$ が $\Phi$ の最大点なら $\sum_{i}v'_{i}(G)=1$。
:::

::: intuition
私的財で効用を 1 対 1 に移せるので、効率性は「全員の効用の和の最大化」と同じになる。効用の和は、資源を使い切っていれば $\Phi(G)+\sum_{i}w_{i}$ で、私的財の分け方によらない。
:::

::: proof
**Step 1（効用の和）.** 【主張：実行可能な配分の効用の和は $\Phi(G)+\sum_{i}w_{i}$ 以下で、資源を使い切るとき等号】$\sum_{i}(v_{i}(G)+x_{i})=\sum_{i}v_{i}(G)+\sum_{i}x_{i}\le\sum_{i}v_{i}(G)+\sum_{i}w_{i}-G$。

**Step 2（最大点なら効率的）.** $G$ が $\Phi$ の最大点で、実行可能な $(G',x')$ がパレート改善するなら、効用の和は真に大きくなるので、Step 1 から $\Phi(G')+\sum_{i}w_{i}\ge$（$(G',x')$ の効用の和）$>$（$(G,x)$ の効用の和）$=\Phi(G)+\sum_{i}w_{i}$。最大性に反する。

**Step 3（効率的なら最大点）.** 【主張：$\Phi(G')>\Phi(G)$ となる $G'\ge0$ があれば、$(G,x)$ はパレート改善される】$\delta\defeq\Phi(G')-\Phi(G)>0$ とし、$x'_{i}\defeq x_{i}+v_{i}(G)-v_{i}(G')+\delta/n$ とする。各人の効用は $v_{i}(G')+x'_{i}=v_{i}(G)+x_{i}+\delta/n$ で真に増える。実行可能性：$\sum_{i}x'_{i}+G'=\sum_{i}x_{i}+\sum_{i}v_{i}(G)-\sum_{i}v_{i}(G')+\delta+G'=\sum_{i}x_{i}+G=\sum_{i}w_{i}$（$\delta$ の定義を代入して整理した）。

**Step 4（2）.** $G>0$ は $[0,\infty)$ の内点なので、微分可能な $\Phi$ の最大点では $\Phi'(G)=\sum_{i}v'_{i}(G)-1=0$。
:::

## 自発的な負担とただ乗り {#econ:sec-pg-free-riding}

::: definition 自発的な負担のゲーム {#econ:voluntary-contribution keywords="each consumer chooses a contribution g_i in [0, w_i]; G = sum g_j; payoff v_i(G) + w_i - g_i; Nash equilibrium: each g_i is a best response to the others' contributions" index="自発的な負担|じはつてきなふたん, ただ乗り|ただのり, フリーライダー|ふりーらいだー" refname="自発的な負担のゲーム"}
各消費者 $i$ が負担 $g_{i}\ge0$ を選び、公共財は $G=\sum_{j}g_{j}$ だけ作られ、$i$ の利得は $v_{i}(G)+w_{i}-g_{i}$ とする（$w_{i}$ は十分大きく、負担の上限は問題にならないとする）。$g=(g_{i})$ が**ナッシュ均衡**であるとは、各 $i$ について、他人の負担の和 $G_{-i}\defeq\sum_{j\ne i}g_{j}$ を所与として、$g_{i}$ が $\gamma\mapsto v_{i}(\gamma+G_{-i})-\gamma$ の $[0,\infty)$ での最大点であることをいう。
:::

::: intuition
自分が 1 円負担すると、自分は 1 円を失い、得る便益は自分の限界便益だけである。他人も同じ公共財から便益を得るが、それは自分の計算に入らない。だから各人は「自分ひとりの限界便益 ＝ 1」で負担をやめ、和が $1$ になるサミュエルソン条件の量には届かない。
:::

::: theorem 自発的な負担では公共財は過少になる {#econ:free-riding-underprovision keywords="with v_i differentiable, strictly concave and strictly increasing, any Nash equilibrium of the voluntary contribution game has G^N <= G^*, where G^* is the efficient level, strictly if some consumer contributes or sum v_i'(0) > 1; identical v = 2 sqrt G gives G^N = 1, G^* = n^2" index="過少供給（公共財）|かしょうきょうきゅう" refname="自発的な負担では公共財は過少になる"}
各 $v_{i}$ が $[0,\infty)$ で微分可能、狭義凹、狭義増加（$v'_{i}>0$）とし、$\Phi$ の最大点 $G^{*}$ がただ一つ存在するとする。$g$ をナッシュ均衡、$G^{N}\defeq\sum_{j}g_{j}$ とすると、
1. $g_{i}>0$ なら $v'_{i}(G^{N})=1$、$g_{i}=0$ なら $v'_{i}(G^{N})\le1$。
2. $G^{N}\le G^{*}$。さらに、ある $i$ で $g_{i}>0$ なら $G^{N}<G^{*}$。
:::

::: intuition
均衡で負担している人は自分の限界便益がちょうど $1$ で、他の人の限界便益（正）を足すと和は $1$ を超える。限界便益の和は量とともに減るので、和が $1$ に下がるまで、つまり効率的な量までは、まだ増やす余地がある。
:::

::: proof
**Step 1（1）.** $\phi_{i}(\gamma)\defeq v_{i}(\gamma+G_{-i})-\gamma$ は $[0,\infty)$ で微分可能。$g_{i}>0$ が最大点なら内点なので $\phi'_{i}(g_{i})=v'_{i}(G^{N})-1=0$。$g_{i}=0$ が最大点なら、$\gamma\downarrow0$ で $\frac{\phi_{i}(\gamma)-\phi_{i}(0)}\gamma\le0$ なので右微分係数 $\phi'_{i}(0)=v'_{i}(G^{N})-1\le0$。

**Step 2（限界便益の和の単調性）.** 【主張：$\Psi\defeq\sum_{i}v'_{i}$ は狭義減少で、$\Phi$ は凹】狭義凹で微分可能な関数の導関数は狭義減少（凹関数の傾きの単調性）なので、和 $\Psi$ も狭義減少。$\Phi=\sum_{i}v_{i}-G$ は凹関数の和なので凹。

**Step 3（効率的な量の特徴づけ）.** 【主張：$\Psi(G)>1$ なら $G<G^{*}$】$\Psi(G)>1$ なら $\Phi'(G)>0$ で、$G$ の少し右に $\Phi$ がより大きい点がある。凹関数 $\Phi$ について、$G^{*}\le G$ だとすると $[G^{*},\infty)$ で $\Phi$ は非増加（凹関数は最大点の右で非増加）となって矛盾する。

**Step 4（2）.** ある $j$ で $g_{j}>0$ なら、Step 1 から $v'_{j}(G^{N})=1$ で、$n\ge2$ と $v'_{i}>0$ から $\Psi(G^{N})=1+\sum_{i\ne j}v'_{i}(G^{N})>1$。Step 3 から $G^{N}<G^{*}$。誰も負担しなければ $G^{N}=0\le G^{*}$。
:::

::: example 人数とともに悪化するただ乗り {#econ:free-riding-example}
全員が $v_{i}(G)=2\sqrt G$ とする（$G=0$ での微分可能性を除き、上の定理の議論はそのまま使える）。$v'_{i}(G)=1/\sqrt G$ なので、効率的な量は $n/\sqrt{G^{*}}=1$ から $G^{*}=n^{2}$。ナッシュ均衡では、負担する人について $1/\sqrt{G^{N}}=1$、すなわち $G^{N}=1$（$G^{N}=0$ は、$v'_{i}(0+)=\infty>1$ なので誰かが負担したくなり、均衡でない）。$G^{N}/G^{*}=1/n^{2}$ は人数とともに $0$ に近づく。均衡は $\sum_{i}g_{i}=1$ をみたす任意の $g\ge0$ で、誰が負担するかは定まらない。
:::

## リンダール均衡 {#econ:sec-pg-lindahl}

::: definition リンダール均衡 {#econ:lindahl-equilibrium keywords="personalized prices tau_i >= 0 with sum tau_i = 1; each consumer demands the G maximizing v_i(G) - tau_i G; a Lindahl equilibrium is (tau, G) where all consumers demand the same G" index="リンダール均衡|りんだーるきんこう, 個人別価格|こじんべつかかく" refname="リンダール均衡"}
個人別の価格 $\tau_{i}\ge0$（$\sum_{i}\tau_{i}=1$、すなわち 1 単位の費用を分担する割合）と量 $G\ge0$ の組で、すべての $i$ について $G$ が $\gamma\mapsto v_{i}(\gamma)-\tau_{i}\gamma$ の $[0,\infty)$ での最大点であるものを**リンダール均衡**という。
:::

::: intuition
私的財では全員が同じ価格に向き合い、異なる量を買う。リンダール均衡はその鏡像で、全員が同じ量を「買い」、評価の高い人ほど高い個人別の価格を払う。
:::

::: theorem リンダール均衡は効率的 {#econ:lindahl-efficiency keywords="the quantity G in a Lindahl equilibrium maximizes sum_i v_i(G) - G, hence with the cost shares tau_i G it is Pareto efficient; no concavity needed" index="リンダール均衡の効率性|りんだーるきんこうのこうりつせい" refname="リンダール均衡は効率的"}
$(\tau,G)$ がリンダール均衡なら、$G$ は $\Phi$ の最大点である。したがって、各人が $\tau_{i}G$ を負担する配分 $x_{i}=w_{i}-\tau_{i}G$ はパレート効率的である。
:::

::: intuition
各人が自分の価格のもとで最適な量を選んでいるので、どの量に変えても「便益の増分 ≦ 自分の負担の増分」である。全員について足すと、負担の和は費用そのものなので、便益の和の増分は費用の増分を超えない。
:::

::: proof
**Step 1（各人の不等式）.** 【主張：任意の $G'\ge0$ で $v_{i}(G')-\tau_{i}G'\le v_{i}(G)-\tau_{i}G$】均衡の定義そのもの。

**Step 2（足し合わせ）.** $i$ について足し、$\sum_{i}\tau_{i}=1$ を使うと $\Phi(G')\le\Phi(G)$。

**Step 3（効率性）.** $\sum_{i}x_{i}+G=\sum_{i}w_{i}-G+G=\sum_{i}w_{i}$ なので、\ref{econ:samuelson-condition} の 1 からパレート効率的。
:::

::: remark
\ref{econ:free-riding-example} の経済では、$\tau_{i}=\frac1n$, $G=n^{2}$ がリンダール均衡である（$v'_{i}(n^{2})=\frac1n=\tau_{i}$ で、$v_{i}(\gamma)-\tau_{i}\gamma$ は凹なので、導関数が $0$ の点が最大点）。ただし、リンダール均衡を実際に計算するには各人の $v_{i}$ が必要で、各人は自分の評価を低く申告すれば $\tau_{i}$ を下げられる。この申告の誘因の問題を解くのが次の節の仕組みである。
:::

## グローブス・メカニズム {#econ:sec-pg-groves}

::: definition 公共事業の決定と申告 {#econ:public-project-mechanism keywords="binary public project; consumer i has private net value theta_i (value minus fixed cost share); reports r_i; decision k(r) = 1 iff sum r_j >= 0; Groves transfers t_i(r) = k(r) sum_{j != i} r_j - h_i(r_{-i}); Clarke pivot rule h_i = max(sum_{j != i} r_j, 0)" index="グローブス・メカニズム|ぐろーぶすめかにずむ, クラーク・メカニズム|くらーくめかにずむ, ピボット・メカニズム|ぴぼっとめかにずむ, メカニズムデザイン|めかにずむでざいん" refname="公共事業の決定と申告"}
公共事業（橋など）を作るか（$k=1$）作らないか（$k=0$）を決める。消費者 $i$ の、費用の分担を差し引いた正味の評価 $\theta_{i}\in\mathbb{R}$ は本人しか知らない。各人は評価 $r_{i}\in\mathbb{R}$ を申告し、申告の組 $r=(r_{j})$ から
- 決定 $k(r)\defeq1$（$\sum_{j}r_{j}\ge0$ のとき）、$k(r)\defeq0$（それ以外）、
- 移転 $t_{i}(r)\defeq k(r)\sum_{j\ne i}r_{j}-h_{i}(r_{-i})$（$h_{i}$ は他人の申告 $r_{-i}$ だけの関数）

を定める。$i$ の利得は $\theta_{i}k(r)+t_{i}(r)$。これを**グローブス・メカニズム**といい、$h_{i}(r_{-i})\defeq\max\bigl(\sum_{j\ne i}r_{j},0\bigr)$ としたものを**クラーク・メカニズム**（ピボット・メカニズム）という。
:::

::: intuition
各人に「他人の申告した評価の和」を、事業が行われたときに受け取らせる。すると各人の利得は、自分の本当の評価と他人の申告の和、すなわち「社会全体の申告上の余剰」になり、各人の利害が社会の利害と一致する。$h_{i}$ は本人の申告によらないので、誘因を変えずにお金の額だけを調整する。
:::

::: theorem 正直な申告は支配戦略 {#econ:groves-truthful keywords="in any Groves mechanism, reporting r_i = theta_i maximizes consumer i's payoff for every profile r_{-i} of others' reports (dominant strategy incentive compatibility); under truthful reports the project is built iff it is efficient; in the Clarke mechanism t_i <= 0 and t_i != 0 only for pivotal consumers" index="支配戦略|しはいせんりゃく, 誘因両立性|ゆういんりょうりつせい" refname="正直な申告は支配戦略"}
\ref{econ:public-project-mechanism} の設定で、
1. 他人の申告 $r_{-i}$ がどうであっても、$r_{i}=\theta_{i}$ は $i$ の利得を最大にする（**正直な申告は支配戦略**）。
2. 全員が正直に申告すれば、事業が行われるのは $\sum_{j}\theta_{j}\ge0$（作ることが効率的）のとき、かつそのときに限る。
3. クラーク・メカニズムでは $t_{i}(r)\le0$（各人は払うことはあっても受け取らない）で、$t_{i}(r)\ne0$ となるのは、$i$ の申告が決定を変える（$k(r)\ne k(0,r_{-i})$ の意味で、$i$ が評価 $0$ を申告した場合と決定が異なる）ときに限る。
:::

::: intuition
他人の申告を所与とすると、自分の申告が影響するのは「作るか作らないか」だけで、作った場合の自分の利得は（本当の評価）＋（他人の申告の和）である。正直に申告すれば、この量が非負のときちょうど作られるので、自分にとって最善の決定が選ばれる。嘘をついて得をするのは決定を変えるときだけで、そのときは必ず損な方向に変わる。
:::

::: proof
**Step 1（利得の書き換え）.** 【主張：$i$ の利得は $\bigl(\theta_{i}+\sum_{j\ne i}r_{j}\bigr)k(r)-h_{i}(r_{-i})$】移転の定義を代入する。

**Step 2（1）.** $A\defeq\theta_{i}+\sum_{j\ne i}r_{j}$ とおく。$h_{i}(r_{-i})$ は $r_{i}$ によらないので、$i$ は $Ak(r)$ を最大にすればよい。$k\in\{0,1\}$ なので $Ak(r)\le\max(A,0)$。$r_{i}=\theta_{i}$ と申告すると $\sum_{j}r_{j}=A$ なので、$k(r)=1\iff A\ge0$ で、$Ak(r)=\max(A,0)$ が達成される。

**Step 3（2）.** 全員が正直なら $\sum_{j}r_{j}=\sum_{j}\theta_{j}$ で、$k$ の定義から。

**Step 4（3）.** $B\defeq\sum_{j\ne i}r_{j}$ とおくと $t_{i}=Bk(r)-\max(B,0)$。$k(r)=1$ なら $t_{i}=B-\max(B,0)=\min(B,0)\le0$、$k(r)=0$ なら $t_{i}=-\max(B,0)\le0$。$t_{i}\ne0$ となるのは「$k(r)=1$ かつ $B<0$」または「$k(r)=0$ かつ $B>0$」のときで、$k(0,r_{-i})=1\iff B\ge0$ なので、これは $k(r)\ne k(0,r_{-i})$ のときに限る。
:::

::: hypcheck
- **準線形性**：効率性と「効用の和の最大化」の同値（サミュエルソン条件の Step 1・3）と、グローブス・メカニズムで利得をお金と評価の和として足すこと（Step 1）に使った。
- **狭義凹・狭義増加（ただ乗りの定理）**：$\Psi$ の狭義単調性（Step 2）と $v'_{i}>0$（Step 4 の $\Psi(G^{N})>1$）に使った。$n\ge2$ も Step 4 で使った（$n=1$ なら均衡は効率的）。
- **$G^{*}$ の存在**：仮定として置いた。$v_{i}$ が狭義凹で $\Psi(G)\to\sum_{i}\lim v'_{i}<1$ となるなら存在する。
- **リンダール均衡の効率性**：凹性を使っていない（均衡の存在には必要）。
:::

## 問題 {#econ:sec-pg-problems}

::: problem {#econ:prob-pg-two-consumers}
$n=2$, $v_{1}(G)=2\sqrt G$, $v_{2}(G)=4\sqrt G$ とする。自発的な負担のナッシュ均衡、効率的な量、リンダール均衡の価格を求めよ。
:::

::: solution
$v'_{1}=1/\sqrt G$, $v'_{2}=2/\sqrt G$。ナッシュ均衡で消費者 2 が負担するなら $2/\sqrt{G^{N}}=1$ から $G^{N}=4$。このとき $v'_{1}(4)=\frac12\le1$ なので消費者 1 は負担しない（$g=(0,4)$ が均衡）。消費者 1 だけが負担する均衡は $G=1$ で $v'_{2}(1)=2>1$ となり成り立たない。効率的な量は $3/\sqrt{G^{*}}=1$ から $G^{*}=9$。リンダール均衡では $v'_{i}(9)=\tau_{i}$ から $\tau=(\frac13,\frac23)$。
:::

::: problem {#econ:prob-pg-clarke}
3 人の正味の評価が $\theta=(5,-2,-1)$ のとき、正直な申告のもとでのクラーク・メカニズムの決定と各人の支払いを求めよ。
:::

::: solution
$\sum\theta_{j}=2\ge0$ なので作る。消費者 1：$B=-3$, $t_{1}=-3-0=-3$（3 を払う。消費者 1 がいなければ作られなかった）。消費者 2：$B=4$, $t_{2}=4-4=0$。消費者 3：$B=3$, $t_{3}=0$。支払いの合計は $3$ で、$0$ ではない（予算が均衡しない）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** グローブス・メカニズムの定理は、評価の分布や他人の合理性を一切仮定しない（支配戦略なので、他人が何を申告しても正直が最善）。リンダール均衡の効率性は凹性を使わない。

**前提を変えると.**
- **予算の均衡**：グローブス・メカニズムでは、評価の取りうる値が十分豊かなら、支配戦略で正直な申告と効率的な決定を保ちつつ、移転の和を常に $0$ にすることはできない（グリーン–ラフォンの定理、Green–Laffont, Econometrica 45 (1977)、ここでは証明しない）。上の問題の「払われた 3」は、捨てるか、外部に渡すしかない。
- **ベイズ均衡での実装**：支配戦略をベイズ均衡に弱めると、評価が独立なら予算を均衡させつつ効率的な決定を実装できる（d'Aspremont–Gérard-Varet, J. Public Econ. 11 (1979)、ここでは証明しない）。ただし個人合理性も加えると不可能性が戻る（\ref{econ:page-externalities} の補足のマイヤーソン–サタースウェイトの定理）。
- **排除可能な公共財**：映画やソフトウェアのように締め出しが可能な財（クラブ財）は、入場料をとることで市場で供給できるが、非競合なのに締め出すことによる非効率（死荷重）が生じる。

**出典.** サミュエルソン条件は Samuelson, "The Pure Theory of Public Expenditure", Rev. Econ. Stat. 36 (1954)、リンダール均衡は Lindahl (1919)、グローブス・メカニズムは Groves, Econometrica 41 (1973)、クラーク・メカニズムは Clarke, Public Choice 11 (1971)、同じ構造の競売は Vickrey (1961) による（総称して VCG メカニズム）。

**高い視点から：私的財との双対.** 私的財の市場では「価格が共通で量が個別」、公共財では「量が共通で価格（評価）が個別」であり、効率の条件は前者では限界便益が全員で等しいこと、後者では限界便益の和が限界費用に等しいことである。線形代数の言葉では、私的財の配分は「和が一定」という制約（対角への射影の双対）、公共財は「全員が同じ値」という制約（対角そのもの）で、ラグランジュ乗数（価格）の役割が入れ替わる。比喩で言えば、私的財はピザを切り分ける問題、公共財は全員で 1 枚の絵を買う問題で、絵の値段は全員の評価の和に見合うべきだが、誰もが「自分はあまり好きでない」と言いたがる。グローブス・メカニズムは、各人に「他人の評価の和」という鏡を持たせて、正直に言うことを自分の得にする工夫である。
:::
