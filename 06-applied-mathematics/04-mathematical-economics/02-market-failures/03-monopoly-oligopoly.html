# 独占と寡占 {#econ:page-monopoly-oligopoly keywords="monopoly, marginal revenue equals marginal cost, Lerner index equals inverse elasticity, monopoly output below the competitive output by a revealed-preference argument, deadweight loss of monopoly, Cournot oligopoly, unique Nash equilibrium with linear demand, convergence to the competitive price as the number of firms grows, Bertrand competition and the Bertrand paradox"}

厚生経済学の第一基本定理は、全員が価格を所与として行動することを前提にしていた。市場に企業が一社しかない（**独占**）か、少数しかない（**寡占**）場合、企業は自分の生産量や価格の決定が市場価格を動かすことを知っている。このページでは、(1) 独占企業は競争的な市場より少なく作り、価格を限界費用より高くつけること（価格と限界費用の差の割合は需要の弾力性の逆数）、(2) 企業が生産量で競う**クールノー競争**の均衡がただ一つで、企業の数が増えると価格が限界費用に近づくこと、(3) 企業が価格で競う**ベルトラン競争**では、二社だけで価格が限界費用まで下がること、を証明する。

## 記法と定義の確認 {#econ:sec-mo-notation}

::: notation
- 逆需要関数 $P$・総余剰とその最大化は \ref{econ:surplus-maximization}、税の死荷重は \ref{econ:tax-incidence}。
- 生産量 $q$ の費用を $C(q)$（$C(0)=0$）、総生産量を $Q$ とする。ナッシュ均衡は「各企業の選択が、他の企業の選択を所与として最適」である組（\ref{econ:voluntary-contribution} と同じ考え方）。
- 需要の価格弾力性は \ref{econ:tax-incidence} の $\varepsilon_{D}$ と同じ定義 $\varepsilon\defeq\frac{P}{qP'}$（逆需要関数で書いたもの）。
:::

## 独占 {#econ:sec-mo-monopoly}

::: definition 独占企業の問題 {#econ:monopoly-problem keywords="a monopolist facing continuous nonincreasing inverse demand P chooses q >= 0 to maximize profit Pi(q) = q P(q) - C(q); marginal revenue (qP)'; consumer surplus CS(q) = int_0^q (P(s) - P(q)) ds" index="独占|どくせん, 限界収入|げんかいしゅうにゅう, 独占企業|どくせんきぎょう" refname="独占企業の問題"}
連続で非増加な逆需要関数 $P:[0,\infty)\to\mathbb{R}$ に直面する唯一の企業が、利潤 $\Pi(q)\defeq qP(q)-C(q)$ を最大にする $q^{M}\ge0$ を選ぶ。$P$ が微分可能なとき $(qP(q))'=P(q)+qP'(q)$ を**限界収入**という。量 $q$ が価格 $P(q)$ で売られるときの消費者余剰（\ref{econ:quasilinear-surplus}）を量で表したものを $CS(q)\defeq\int_{0}^{q}\bigl(P(s)-P(q)\bigr)ds$ とする。
:::

::: intuition
競争的な企業は「もう 1 単位売れば価格 $p$ が入る」と考える。独占企業は「もう 1 単位売るには価格を下げねばならず、その値下げは今まで売っていた全部の単位に及ぶ」と考える。だから 1 単位増やすことの収入（限界収入）は価格より小さい。
:::

::: theorem 独占の生産量と価格 {#econ:monopoly-theorem keywords="if P is strictly decreasing, the monopoly quantity q^M is at most the competitive quantity q^c (P(q^c) = C'(q^c), C convex differentiable); at an interior differentiable optimum P + qP' = C' and the Lerner index (P - C')/P = 1/|epsilon|; the monopolist produces where demand is elastic when C' >= 0" index="ラーナー指数|らーなーしすう, マークアップ|まーくあっぷ, 独占の死荷重|どくせんのしかじゅう" refname="独占の生産量と価格"}
\ref{econ:monopoly-problem} の設定で、$C$ を $[0,\infty)$ 上の微分可能な凸関数とし、$P(q^{c})=C'(q^{c})$ となる $q^{c}$（競争的な量）と、$\Pi$ の最大点 $q^{M}$ が存在するとする。
1. $P$ が狭義減少なら $q^{M}\le q^{c}$。
2. $P$ が $q^{M}>0$ で微分可能なら、$P(q^{M})+q^{M}P'(q^{M})=C'(q^{M})$。さらに $P(q^{M})>0$, $P'(q^{M})<0$ なら
$$
\frac{P(q^{M})-C'(q^{M})}{P(q^{M})}=\frac1{\abs{\varepsilon}},\qquad\varepsilon\defeq\frac{P(q^{M})}{q^{M}P'(q^{M})},
$$
で、$C'(q^{M})\ge0$ なら $\abs{\varepsilon}\ge1$（需要が弾力的な範囲で生産する）。
:::

::: intuition
独占企業の目的（利潤）と社会の目的（総余剰）の差は、消費者余剰だけである。独占企業は消費者余剰を気にしないので、消費者余剰が増える方向、すなわち量を増やす方向への動機が社会より弱い。価格と限界費用の差の割合は、需要が価格に反応しにくいほど大きい。
:::

::: proof
**Step 1（競争的な量は総余剰の最大点）.** 【主張：$W(q)\defeq\int_{0}^{q}P(s)ds-C(q)$ は $q^{c}$ で最大】$W$ は微分可能で $W'=P-C'$ は非増加（$P$ は非増加、$C'$ は凸関数の導関数なので非減少）、$W'(q^{c})=0$。$q<q^{c}$ では $W'\ge0$、$q>q^{c}$ では $W'\le0$ なので、平均値の定理から $W(q)\le W(q^{c})$。

**Step 2（目的の差）.** 【主張：$\Pi(q)-W(q)=-CS(q)$】$qP(q)-\int_{0}^{q}P(s)ds=-\int_{0}^{q}(P(s)-P(q))ds$。

**Step 3（消費者余剰の狭義単調性）.** 【主張：$P$ が狭義減少なら $CS$ は狭義増加】$0\le q<q'$ とすると
$$
CS(q')-CS(q)=\int_{0}^{q}\bigl(P(q)-P(q')\bigr)ds+\int_{q}^{q'}\bigl(P(s)-P(q')\bigr)ds.
$$
第 1 項は $q(P(q)-P(q'))\ge0$。第 2 項の被積分関数は $(q,q')$ で正で連続なので、第 2 項は正。

**Step 4（1）.** 最大性から $\Pi(q^{M})\ge\Pi(q^{c})$、Step 1 から $W(q^{c})\ge W(q^{M})$。足して $\Pi(q^{M})-W(q^{M})\ge\Pi(q^{c})-W(q^{c})$、Step 2 から $CS(q^{M})\le CS(q^{c})$。Step 3 から $q^{M}\le q^{c}$（$q^{M}>q^{c}$ なら $CS(q^{M})>CS(q^{c})$）。

**Step 5（2）.** $q^{M}>0$ は内点の最大点なので $\Pi'(q^{M})=0$、すなわち限界収入 $=$ 限界費用。両辺を $P(q^{M})>0$ で割って整理すると $\frac{P-C'}{P}=-\frac{q^{M}P'}{P}=\frac1{\abs{\varepsilon}}$（$P'<0$ なので $\varepsilon<0$）。$C'\ge0$ なら左辺は $1$ 以下なので $\abs{\varepsilon}\ge1$。
:::

::: example 線形の需要の独占 {#econ:linear-monopoly}
$P(q)=a-q$, $C(q)=cq$（$0\le c<a$）とする。競争的な量は $q^{c}=a-c$、価格は $c$。独占では $a-2q=c$ から $q^{M}=\frac{a-c}2$、価格は $\frac{a+c}2$。死荷重は $\int_{q^{M}}^{q^{c}}(a-s-c)ds=\frac{(a-c)^{2}}8$ で、競争的な総余剰 $\frac{(a-c)^{2}}2$ の $\frac14$ にあたる。
:::

## クールノー競争 {#econ:sec-mo-cournot}

::: definition クールノー競争 {#econ:cournot-game keywords="N firms choose quantities q_i >= 0 simultaneously; price P(Q) = a - Q with Q = sum q_j; constant marginal cost c < a; profit (a - Q - c) q_i; Cournot-Nash equilibrium" index="クールノー競争|くーるのーきょうそう, クールノー均衡|くーるのーきんこう, 寡占|かせん, 最適反応|さいてきはんのう" refname="クールノー競争"}
$N$ 社が同時に生産量 $q_{i}\ge0$ を選び、価格は $P(Q)=a-Q$（$Q\defeq\sum_{j}q_{j}$）で決まるとする。各社の限界費用は一定の $c$ で、$0\le c<a$。企業 $i$ の利潤は $\pi_{i}(q)\defeq(a-Q-c)q_{i}$。$q=(q_{i})$ が**クールノー均衡**であるとは、各 $i$ について、$Q_{-i}\defeq\sum_{j\ne i}q_{j}$ を所与として $q_{i}$ が $x\mapsto(a-x-Q_{-i}-c)x$ の $[0,\infty)$ での最大点であることをいう。
:::

::: intuition
各社は、他社の生産量を所与として、残された需要（残余需要）に対して独占企業のようにふるまう。企業の数が多いほど、各社の残余需要は小さく、自分の値下げの影響を受ける「今まで売っていた単位」も少なくなる。
:::

::: theorem クールノー均衡 {#econ:cournot-equilibrium keywords="the Cournot game with linear demand has a unique equilibrium, symmetric with q_i = (a - c)/(N + 1), total Q = N(a - c)/(N + 1), price (a + Nc)/(N + 1); as N -> infinity the price tends to marginal cost c" index="クールノー均衡の一意性|くーるのーきんこうのいちいせい" refname="クールノー均衡"}
\ref{econ:cournot-game} のクールノー均衡はただ一つで、
$$
q_{i}=\frac{a-c}{N+1},\qquad Q=\frac{N(a-c)}{N+1},\qquad P(Q)=\frac{a+Nc}{N+1}.
$$
特に $N=1$ は独占、$N\to\infty$ で価格は限界費用 $c$ に収束する。
:::

::: intuition
均衡では各社が「価格 − 限界費用 ＝ 自分の生産量」をみたす（線形の需要での限界収入の条件）。全社が同じ条件に向き合うので対称になり、企業の数が増えると 1 社あたりの量、したがって価格と限界費用の差は $\frac1{N+1}$ の割合で縮む。
:::

::: proof
**Step 1（最適反応）.** 【主張：$Q_{-i}$ に対する最適な $q_{i}$ は $\max\bigl(\frac{a-c-Q_{-i}}2,0\bigr)$ ただ一つ】$f(x)\defeq(a-c-Q_{-i})x-x^{2}$ は狭義凹の 2 次関数で、頂点は $x_{0}=\frac{a-c-Q_{-i}}2$。$x_{0}\ge0$ なら最大点は $x_{0}$、$x_{0}<0$ なら $[0,\infty)$ で $f$ は減少なので $0$。

**Step 2（均衡の条件）.** Step 1 から、均衡では $q_{i}>0$ の企業は $2q_{i}=a-c-Q_{-i}$、すなわち $q_{i}=a-c-Q$。$q_{i}=0$ の企業は $a-c-Q_{-i}\le0$、すなわち $Q\ge a-c$（$Q_{-i}=Q$ なので）。

**Step 3（全社が生産する）.** 【主張：均衡ではすべての $q_{i}>0$】ある $i$ で $q_{i}=0$ とすると、Step 2 から $Q\ge a-c>0$。すると生産している企業 $j$ があり、$q_{j}=a-c-Q\le0$ となって矛盾。

**Step 4（解く）.** Step 3 と Step 2 から、すべての $i$ で $q_{i}=a-c-Q$（同じ値）。足すと $Q=N(a-c-Q)$、$Q=\frac{N(a-c)}{N+1}$、$q_{i}=a-c-Q=\frac{a-c}{N+1}$。価格は $a-Q=\frac{a+Nc}{N+1}$。逆に、この $q$ は Step 1 の最適反応の条件 $q_{i}=\frac{a-c-Q_{-i}}2$ をみたす（$Q_{-i}=\frac{(N-1)(a-c)}{N+1}$ を代入して確かめる）ので均衡である。

**Step 5（極限）.** $\frac{a+Nc}{N+1}-c=\frac{a-c}{N+1}\to0$。
:::

## ベルトラン競争 {#econ:sec-mo-bertrand}

::: theorem ベルトランの逆説 {#econ:bertrand-paradox keywords="two firms with the same constant marginal cost c set prices; the lower price captures the whole market demand D(p), ties split it; if D is continuous and positive on [0, a) with a > c, the unique Nash equilibrium is p_1 = p_2 = c with zero profits" index="ベルトラン競争|べるとらんきょうそう, ベルトランの逆説|べるとらんのぎゃくせつ" refname="ベルトランの逆説"}
2 社が同じ一定の限界費用 $c\ge0$ をもち、同時に価格 $p_{1},p_{2}\ge0$ を選ぶ。需要 $D:[0,\infty)\to[0,\infty)$ は連続で、ある $\bar a>c$ について $[0,\bar a)$ で $D>0$ とする。安い価格をつけた企業が需要 $D(\min(p_{1},p_{2}))$ をすべて得て、同じ価格なら半分ずつ分ける。企業 $i$ の利潤は（得た需要）$\times(p_{i}-c)$。このとき、ナッシュ均衡は $p_{1}=p_{2}=c$ ただ一つで、両社の利潤は $0$ である。
:::

::: intuition
同じ価格なら市場の半分、ほんの少し安くすれば市場の全部が手に入る。価格が費用より高い限り、相手よりわずかに安くする誘惑が残るので、価格は費用まで下がる。二社しかなくても競争的な価格になるのは、製品が完全に同じで、生産能力に限りがないという強い前提のためである。
:::

::: proof
**Step 1（$(c,c)$ は均衡）.** 両社の利潤は $0$。企業 1 が $p>c$ に上げると需要を失い利潤 $0$、$p<c$ に下げると $D(p)(p-c)\le0$。よって改善できない。企業 2 も同じ。

**Step 2（$\min p_{i}<c$ は均衡でない）.** 最安値の企業（同じなら両社）は正の需要（$p<c<\bar a$ なので $D>0$）を負の利幅で売るので利潤は負。価格を $c$ に上げれば利潤は $0$ 以上になる。

**Step 3（$\min p_{i}=c<\max p_{i}$ は均衡でない）.** 価格 $c$ の企業の利潤は $0$。$p'\in(c,\min(\max p_{i},\bar a))$ に上げると、まだ最安値なので利潤 $D(p')(p'-c)>0$。

**Step 4（$\min p_{i}>c$ は均衡でない）.** $m\defeq\min p_{i}$ とし、3 つの場合に分ける。
- $D(m)=0$ のとき：両社の利潤は $0$。どちらかが $p'\in(c,\bar a)$ に価格を変えれば、最安値になって利潤 $D(p')(p'-c)>0$ を得る。
- $D(m)>0$ で $p_{1}=p_{2}=m$ のとき：各社の利潤は $\frac12D(m)(m-c)>0$。企業 1 が $m-\eta$（$0<\eta<m-c$）に下げると利潤は $D(m-\eta)(m-\eta-c)$ で、$\eta\to0$ のとき $D$ の連続性から $D(m)(m-c)$ に収束する。$D(m)(m-c)>\frac12D(m)(m-c)$ なので、十分小さい $\eta$ で改善する。
- $D(m)>0$ で $p_{1}\ne p_{2}$ のとき：高い価格の企業の利潤は $0$。$p'\in(c,\min(m,\bar a))$ に下げると最安値になり、利潤 $D(p')(p'-c)>0$ を得る。

以上で、$(c,c)$ 以外の価格の組はすべて均衡でない。
:::

::: hypcheck
- **$P$ の狭義減少（独占の 1）**：消費者余剰の狭義単調性（Step 3）に使った。非増加だけなら、$CS(q^{M})\le CS(q^{c})$ までは言えるが $q^{M}\le q^{c}$ は言えない（需要が水平な区間がありうる）。
- **$C$ の凸性と微分可能性**：競争的な量が総余剰の最大点であること（Step 1）に使った。独占企業の最大点 $q^{M}$ の存在は仮定として置いた。
- **クールノー競争の線形性**：最適反応を陽に解くのに使った。一般の需要と費用では、均衡の存在には最適反応の連続性と不動点定理が、一意性には追加の条件が必要である。
- **ベルトランの同一費用・無制限の生産能力・同質な製品**：Step 3・4 の「わずかに下げれば市場の全部を得る」に使った。どれかが崩れると、価格は費用より高くなりうる。
:::

## 問題 {#econ:sec-mo-problems}

::: problem {#econ:prob-mo-cournot-welfare}
\ref{econ:cournot-equilibrium} の均衡での死荷重を求め、$N\to\infty$ で $0$ に収束することを確かめよ。
:::

::: solution
競争的な量は $a-c$。死荷重は $\int_{Q}^{a-c}(a-s-c)ds=\frac12(a-c-Q)^{2}=\frac{(a-c)^{2}}{2(N+1)^{2}}\to0$。$N=1$ で \ref{econ:linear-monopoly} の $\frac{(a-c)^{2}}8$ と一致する。
:::

::: problem {#econ:prob-mo-price-discrimination}
独占企業が、需要 $D(p)$ の各消費者に、それぞれの支払意思額ちょうどの価格をつけられる（**完全価格差別**）とする。生産量は競争的な量 $q^{c}$ に一致することを示せ（$P$ は狭義減少、$C$ は凸で微分可能）。
:::

::: solution
完全価格差別では、量 $q$ を売る収入は $\int_{0}^{q}P(s)ds$ で、利潤は $W(q)=\int_{0}^{q}P(s)ds-C(q)$ に等しい。\ref{econ:monopoly-theorem} の証明の Step 1 から $q^{c}$ は $W$ の最大点。死荷重は生じないが、余剰はすべて企業のものになる（効率的だが分配は偏る）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 独占の 1 は、$P$ の微分可能性を使わない（顕示選好の議論、すなわち二つの最大化問題の不等式を足す議論）。

**前提を変えると.**
- **ベルトランと生産能力**：生産能力に上限がある企業が先に能力を選び、その後で価格競争をすると、条件のもとでクールノー均衡の結果が再現される（Kreps–Scheinkman, Bell J. Econ. 14 (1983)、ここでは証明しない）。量で競うか価格で競うかの違いは、何が先に固定されるかの違いと解釈できる。
- **製品の差別化**：製品が少しずつ違えば、ベルトラン競争でも価格は限界費用を上回る（ホテリングの立地モデルなど）。
- **参入**：固定費用のある市場に自由に参入できるなら、企業の数は利潤が $0$ になるまで増える。企業の数自体が内生的に決まると、参入が社会的に過剰になる場合がある（Mankiw–Whinston, RAND J. Econ. 17 (1986)、ここでは証明しない）。
- **プラットフォームと AI**：アルゴリズムによる価格設定が、明示的な合意なしに競争的な価格より高い価格を維持しうることが、シミュレーションで報告されている（Calvano–Calzolari–Denicolò–Pastorello, Am. Econ. Rev. 110 (2020)）。これは実験結果で、現実の市場でどの程度起きているかは分かっていない。

**高い視点から：価格への影響力が歪みの源.** 第一基本定理の証明で、各人が「価格は自分の行動によらない」と考えることは、価格が全員に共通の定規であることを意味した。独占企業は自分で定規の目盛りを動かせるので、定規で測った最適が社会の最適からずれる。クールノー均衡で $N\to\infty$ のとき価格が限界費用に近づくのは、各社の目盛りを動かす力が $\frac1N$ に薄まるからである。比喩で言えば、市場は多数の人が少しずつ押しても動かない大きな船で、一社が舵を握ると、その会社に都合のよい方向に船が進む。
:::
