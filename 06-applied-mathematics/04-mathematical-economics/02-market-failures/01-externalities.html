# 外部性 {#econ:page-externalities keywords="externality, marginal damage, overproduction in competitive equilibrium with a negative externality, deadweight loss, Pigouvian tax equal to marginal damage at the optimum, Coase theorem: with quasi-linear utility and costless bargaining every efficient bargain chooses the surplus-maximizing activity level regardless of the assignment of property rights, Nash bargaining, tradable emission permits minimize total cost of meeting a cap, prices vs quantities"}

ある人の行動が、市場の取引を通さずに他人の効用や費用に影響することを**外部性**という。工場の排煙が近隣の健康を害する、というのが典型である。外部性があると、\ref{econ:first-welfare-theorem} の証明の第 1 段（「より好ましいものは予算の外にある」）が崩れ、競争的な均衡は効率的でなくなる。このページでは、部分均衡の枠組みで (1) 競争的な市場が負の外部性のある財を作りすぎること、(2) 最適な量での限界的な被害に等しい税（**ピグー税**）がその歪みを正すこと、(3) 所得効果がなく交渉の費用もなければ、権利をどちらに与えても交渉で効率的な量が選ばれること（**コースの定理**）、(4) 排出量の上限を決めて排出権を売買させると、上限を最も安く達成できること、を証明する。

## 記法と定義の確認 {#econ:sec-xt-notation}

::: notation
- 逆需要関数 $P_{D}$・総余剰 $W$ と、その最大化は \ref{econ:surplus-maximization}。価格を所与とする企業が限界費用と価格の等しい量を供給することは \ref{econ:competitive-supply}。
- \ref{econ:pareto-efficiency} の定義を、このページの「活動の水準と移転の組」に読み替えて使う。
- $c(q)$ は財を $q$ 作るときの私的な費用、$d(q)$ はそのとき第三者に生じる被害（金額で測る）。$c',d'$ はそれぞれ限界費用・限界被害。
:::

## 負の外部性と作りすぎ {#econ:sec-xt-overproduction}

::: definition 外部性のある市場 {#econ:externality-market keywords="competitive market with private marginal cost c' and marginal external damage d' > 0; market quantity q^m solves P_D = c'; social optimum q^o maximizes W^o(q) = int_0^q (P_D - c' - d')" index="外部性|がいぶせい, 外部不経済|がいぶふけいざい, 限界被害|げんかいひがい, 社会的限界費用|しゃかいてきげんかいひよう" refname="外部性のある市場"}
逆需要関数 $P_{D}:[0,\infty)\to\mathbb{R}$ を連続で非増加、私的な限界費用 $c'$ と限界被害 $d'$ を $[0,\infty)$ 上の連続で非減少な関数とし、$d'>0$ とする（**負の外部性**）。
1. $P_{D}(q^{m})=c'(q^{m})$ となる $q^{m}$ を**市場の量**という（価格を所与とする企業は価格と限界費用が等しい量を供給するので、競争均衡の取引量）。
2. $c'+d'$ を**社会的限界費用**といい、被害を含めた総余剰を $W^{o}(q)\defeq\int_{0}^{q}\bigl(P_{D}(s)-c'(s)-d'(s)\bigr)ds$ とする。$P_{D}(q^{o})=c'(q^{o})+d'(q^{o})$ となる $q^{o}$ を**社会的に最適な量**という。
:::

::: intuition
企業は自分の払う費用 $c'$ だけを見て生産量を決めるが、社会は被害 $d'$ も負担している。社会にとっての費用の曲線は企業の供給曲線より $d'$ だけ上にあり、需要曲線との交点はそのぶん左にずれる。
:::

::: theorem 負の外部性のもとで競争市場は作りすぎる {#econ:externality-overproduction keywords="with d' > 0 the market quantity exceeds the social optimum, q^m > q^o; q^o maximizes W^o; the deadweight loss W^o(q^o) - W^o(q^m) = int_{q^o}^{q^m} (c' + d' - P_D) > 0" index="作りすぎ（外部性）|つくりすぎ, 死荷重（外部性）|しかじゅう" refname="負の外部性のもとで競争市場は作りすぎる"}
\ref{econ:externality-market} の設定で $q^{m},q^{o}$ が存在するとする。
1. $q^{o}$ は $W^{o}$ の最大点である。
2. $q^{m}>q^{o}$。
3. $W^{o}(q^{o})-W^{o}(q^{m})=\displaystyle\int_{q^{o}}^{q^{m}}\bigl(c'(s)+d'(s)-P_{D}(s)\bigr)ds>0$。
:::

::: intuition
市場の量と最適な量の間の各単位では、消費者の支払意思額が企業の費用は上回るが、被害を足した社会的な費用には届かない。企業と消費者にとっては得な取引でも、被害を受ける人を含めると損な取引で、その損の合計が死荷重になる。
:::

::: proof
**Step 1（1）.** 【主張：$q^{o}$ は $W^{o}$ の最大点】$P_{S}\defeq c'+d'$ は連続で非減少（非減少関数の和）なので、\ref{econ:surplus-maximization} を逆供給関数 $P_{S}$ に適用すると、$P_{D}(q^{o})=P_{S}(q^{o})$ をみたす $q^{o}$ は $W^{o}$ の最大点である。

**Step 2（2）.** 【主張：$q^{m}>q^{o}$】$h\defeq P_{D}-c'-d'$ は非増加（非増加関数から非減少関数を引いた）。$h(q^{o})=0$、$h(q^{m})=P_{D}(q^{m})-c'(q^{m})-d'(q^{m})=-d'(q^{m})<0$（$q^{m}$ の定義と $d'>0$）。もし $q^{m}\le q^{o}$ なら、$h$ の非増加性から $h(q^{m})\ge h(q^{o})=0$ となり矛盾。よって $q^{m}>q^{o}$。

**Step 3（3）.** 等式は $W^{o}$ の定義と積分の加法性から。被積分関数 $-h$ は、Step 2 と同じ理由で $(q^{o},q^{m}]$ 上で $-h\ge-h(q^{o})=0$ であり、$s=q^{m}$ で $-h(q^{m})=d'(q^{m})>0$。$-h$ は連続なので、$q^{m}$ のある左近傍 $[q^{m}-\delta,q^{m}]$（$\delta>0$, $q^{m}-\delta>q^{o}$）で $-h\ge d'(q^{m})/2$。よって積分は $\delta\,d'(q^{m})/2>0$ 以上である。
:::

## ピグー税 {#econ:sec-xt-pigou}

::: theorem ピグー税 {#econ:pigouvian-tax keywords="a per-unit tax t* = d'(q^o), the marginal damage at the social optimum, makes q^o a competitive equilibrium quantity under the tax; if P_D - c' is strictly decreasing it is the only one" index="ピグー税|ぴぐーぜい, 外部性の内部化|がいぶせいのないぶか" refname="ピグー税"}
\ref{econ:externality-market} の設定で、生産 1 単位あたり $t^{*}\defeq d'(q^{o})$ の税を企業に課す。このとき $q^{o}$ は税のもとでの競争均衡の取引量（$P_{D}(q)=c'(q)+t^{*}$ をみたす $q$）である。$P_{D}-c'$ が狭義減少なら、税のもとでの均衡の量は $q^{o}$ ただ一つである。
:::

::: intuition
税は、企業が無視していた被害を、企業自身の費用として感じさせる装置である（外部性の**内部化**）。ただし税率は「最適な量での」限界被害で、市場の量での限界被害ではない。被害の大きさを政府が知っていることが前提である。
:::

::: proof
**Step 1（税のもとでの供給）.** 【主張：税のもとの均衡の量は $P_{D}(q)=c'(q)+t^{*}$ の解】買い手の払う価格を $p$ とすると、企業の受け取りは $p-t^{*}$ で、利潤 $(p-t^{*})q-c(q)$ を最大にする内点の量は $p-t^{*}=c'(q)$（\ref{econ:competitive-supply} の 1 を価格 $p-t^{*}$ に適用）。買い手は $p=P_{D}(q)$ となる量を買う。

**Step 2（$q^{o}$ が解）.** $q^{o}$ の定義から $P_{D}(q^{o})=c'(q^{o})+d'(q^{o})=c'(q^{o})+t^{*}$。

**Step 3（一意性）.** $P_{D}-c'-t^{*}$ が狭義減少なら零点は高々 1 つ。
:::

::: example 線形の外部性 {#econ:linear-externality-example}
$P_{D}(q)=a-q$, $c'(q)=cq$, $d'(q)=eq$（$a,c,e>0$）とする。$q^{m}=\frac a{1+c}$、$q^{o}=\frac a{1+c+e}$、ピグー税は $t^{*}=eq^{o}=\frac{ea}{1+c+e}$。死荷重は、被積分関数 $(1+c+e)s-a=(1+c+e)(s-q^{o})$ を $q^{o}$ から $q^{m}$ まで積分して $\frac{1+c+e}2(q^{m}-q^{o})^{2}=\dfrac{a^{2}e^{2}}{2(1+c)^{2}(1+c+e)}$。
:::

## コースの定理 {#econ:sec-xt-coase}

::: definition 二者の外部性と交渉 {#econ:coase-setting keywords="polluter A chooses activity q in [0, Q] with benefit b(q), victim B suffers damage d(q); outcomes (q, T) with transfer T from B to A; quasi-linear utilities u_A = b(q) + T, u_B = -d(q) - T; joint surplus S(q) = b(q) - d(q); property rights determine the disagreement point" index="コースの定理|こーすのていり, 所有権の割り当て|しょゆうけんのわりあて, 交渉|こうしょう" refname="二者の外部性と交渉"}
活動の水準 $q\in[0,\bar Q]$ を選ぶ者 A（例：工場）と、その被害を受ける者 B（例：住民）がいる。$b,d:[0,\bar Q]\to\mathbb{R}$ は連続とする。
1. **結果**は組 $(q,T)$（$T\in\mathbb{R}$ は B から A への支払い。負なら A から B へ）で、効用は $u_{A}=b(q)+T$, $u_{B}=-d(q)-T$（準線形）。**総余剰**を $S(q)\defeq b(q)-d(q)$ とする。
2. 結果 $(q,T)$ が**パレート効率的**とは、すべての人の効用を下げず、誰かの効用を上げる結果 $(q',T')$ がないこと。
3. 権利の割り当ては、交渉が決裂したときの結果（**決裂点**）を決める。A が汚染する権利をもつなら決裂点は $(q_{A},0)$（$q_{A}$ は $b$ の最大点）、B がきれいな環境の権利をもつなら $(0,0)$。
4. 決裂点 $(q^{0},0)$ に対して、結果 $(q,T)$ が**個人合理的**とは、$u_{A}(q,T)\ge b(q^{0})$ かつ $u_{B}(q,T)\ge-d(q^{0})$ であること。
:::

::: intuition
権利をどちらに与えるかは「交渉しなければどうなるか」を決めるだけである。汚染する権利が工場にあれば住民がお金を払って汚染を減らしてもらい、きれいな環境の権利が住民にあれば工場がお金を払って汚染を認めてもらう。
:::

::: lemma 準線形のもとでの効率性 {#econ:quasilinear-efficiency keywords="with quasi-linear utilities and unrestricted transfers, an outcome (q, T) is Pareto efficient iff q maximizes the joint surplus S; such q exists since S is continuous on a compact interval" index="総余剰の最大化と効率性|そうよじょうのさいだいかとこうりつせい" refname="準線形のもとでの効率性"}
\ref{econ:coase-setting} の設定で、結果 $(q,T)$ がパレート効率的であることと、$q$ が $S$ の最大点であることは同値である。$S$ の最大点は存在する。
:::

::: intuition
お金で効用を 1 対 1 で移せるので、二人の効用の和（総余剰）を大きくできるなら、増えた分を配って二人とも悪くならないようにできる。だから効率性は「和の最大化」と同じになり、和はお金の移転に関係しない。
:::

::: proof
**Step 1（効用の和）.** 【主張：$u_{A}(q,T)+u_{B}(q,T)=S(q)$】$b(q)+T-d(q)-T=S(q)$。

**Step 2（最大点なら効率的）.** $q$ が $S$ の最大点で、$(q',T')$ がパレート改善するとする。両者の効用は下がらず一方は真に上がるので、和について $S(q')>S(q)$（Step 1）。これは最大性に反する。

**Step 3（効率的なら最大点）.** 【主張：$S(q')>S(q)$ となる $q'$ があれば、$(q,T)$ はパレート改善される】$T'\defeq T+b(q)-b(q')$ とすると $u_{A}(q',T')=b(q)+T=u_{A}(q,T)$。Step 1 から $u_{B}(q',T')=S(q')-u_{A}(q',T')>S(q)-u_{A}(q,T)=u_{B}(q,T)$。対偶をとると主張の向き。

**Step 4（存在）.** $S$ はコンパクトな区間 $[0,\bar Q]$ 上の連続関数なので最大値をとる（\ref{top:extreme-value}）。
:::

::: theorem コースの定理 {#econ:coase-theorem keywords="in the quasi-linear two-party externality problem with costless bargaining, under either assignment of property rights the set of efficient individually rational outcomes is nonempty and every such outcome has the same activity level (a maximizer of S); the assignment affects only the transfer; the Nash bargaining solution splits the gain S(q*) - S(q^0) equally" index="コースの定理|こーすのていり, ナッシュ交渉解|なっしゅこうしょうかい" refname="コースの定理"}
\ref{econ:coase-setting} の設定で、決裂点を $(q^{0},0)$（$q^{0}=q_{A}$ または $0$）、$q^{*}$ を $S$ の最大点とする。
1. 効率的かつ個人合理的な結果が存在し、そのような結果 $(q,T)$ では、どちらの権利の割り当てでも $q$ は $S$ の最大点である（$S$ の最大点が一つなら $q=q^{*}$）。
2. 効率的かつ個人合理的な結果は、$q^{*}$ と $\lambda\in[0,1]$ を使って
$$
u_{A}=b(q^{0})+\lambda G,\qquad u_{B}=-d(q^{0})+(1-\lambda)G,\qquad G\defeq S(q^{*})-S(q^{0})\ge0
$$
と表される。$\lambda=\frac12$（利得を等分する）の結果を**ナッシュ交渉解**という。
3. 権利の割り当てによって変わるのは $q^{0}$、したがって移転 $T$ だけである。
:::

::: intuition
交渉で得られるパイの大きさ（総余剰）は権利の割り当てに関係しない。権利が決めるのは、パイの分け方の出発点だけである。だから、交渉の費用がなければ、法律がどちらの味方をしても、汚染の量そのものは同じになる。
:::

::: proof
**Step 1（効率的な結果の活動水準）.** 効率的な結果では $q$ は $S$ の最大点（\ref{econ:quasilinear-efficiency}）。これは決裂点、すなわち権利の割り当てによらない。

**Step 2（利得の分け方）.** 【主張：$q$ を $S$ の最大点として、$(q,T)$ が個人合理的であることと、$u_{A}=b(q^{0})+\lambda G$, $u_{B}=-d(q^{0})+(1-\lambda)G$ となる $\lambda\in[0,1]$ があることは同値】$S(q)=S(q^{*})$ なので、Step 1 の和の式（\ref{econ:quasilinear-efficiency} の Step 1）から $u_{A}+u_{B}=S(q^{*})=b(q^{0})-d(q^{0})+G$。$\lambda\defeq(u_{A}-b(q^{0}))/G$（$G>0$ のとき）とおけば表示が成り立ち、個人合理性は $\lambda\ge0$ かつ $1-\lambda\ge0$ と同値。$G=0$ のときは、個人合理性と和の式から $u_{A}=b(q^{0})$, $u_{B}=-d(q^{0})$ で、任意の $\lambda$ で表示が成り立つ。$G\ge0$ は $q^{*}$ の最大性から。

**Step 3（存在）.** $\lambda\in[0,1]$ を一つ選び、$T\defeq b(q^{0})+\lambda G-b(q^{*})$ とすると $u_{A}(q^{*},T)=b(q^{0})+\lambda G$、和の式から $u_{B}=-d(q^{0})+(1-\lambda)G$。Step 2 から個人合理的で、Step 1 の補題から効率的。

**Step 4（3）.** Step 1 で $q$ は割り当てによらず、Step 3 の $T$ の式には $q^{0}$ が現れる。
:::

::: example 2 つの割り当ての比較 {#econ:coase-example}
$b(q)=q-\frac{q^{2}}2$, $d(q)=\frac{q^{2}}2$, $\bar Q=1$ とすると $S(q)=q-q^{2}$、$q^{*}=\frac12$, $S(q^{*})=\frac14$。
- A が汚染の権利をもつ：$q_{A}=1$, $S(1)=0$, $G=\frac14$。ナッシュ交渉解では $u_{A}=b(1)+\frac18=\frac58$、$b(\frac12)=\frac38$ なので $T=\frac14$：住民が工場に $\frac14$ を払って活動を $\frac12$ に減らしてもらう。
- B が環境の権利をもつ：$q^{0}=0$, $G=\frac14$。$u_{A}=0+\frac18$ なので $T=\frac18-\frac38=-\frac14$：工場が住民に $\frac14$ を払って活動 $\frac12$ を認めてもらう。

どちらでも活動は $\frac12$ で、お金の流れの向きだけが逆になる。
:::

## 排出量取引 {#econ:sec-xt-permits}

::: theorem 排出権の市場は上限を最も安く達成する {#econ:permit-market-efficiency keywords="cap-and-trade: firms i with benefit b_i(e_i) from emissions; if at permit price p >= 0 each e_i maximizes b_i(e) - p e over e >= 0 and sum e_i = E, then e maximizes the total benefit sum b_i subject to the cap sum e_i <= E; no concavity needed; equal marginal benefits" index="排出量取引|はいしゅつりょうとりひき, 排出権|はいしゅつけん, キャップ・アンド・トレード|きゃっぷあんどとれーど" refname="排出権の市場は上限を最も安く達成する"}
企業 $i=1,\dots,N$ が排出量 $e_{i}\ge0$ から便益 $b_{i}(e_{i})$（排出を減らす費用を負にしたもの）を得るとし、政府が総排出量の上限 $E>0$ を決めて、その量の排出権を売買させる。価格 $p\ge0$ と $e=(e_{i})$ が、
1. 各 $i$ で $e_{i}$ が $b_{i}(x)-px$ の $x\ge0$ での最大点であり、
2. $\sum_{i}e_{i}=E$

をみたすなら、$e$ は「$\sum_{i}e'_{i}\le E$, $e'_{i}\ge0$ のもとで $\sum_{i}b_{i}(e'_{i})$ を最大にする」問題の解である。$b_{i}$ が微分可能で $e_{i}>0$ なら、$b'_{i}(e_{i})=p$（限界的な削減費用がすべての企業で等しい）。
:::

::: intuition
排出権の価格は、すべての企業に共通の「1 トン減らすことの値段」である。減らすのが安い企業は多く減らして排出権を売り、高い企業は排出権を買う。結果として、どの企業でも「あと 1 トン減らす費用」が価格に揃い、どこかで減らす量を別の企業に移しても総費用は下がらない。厚生経済学の第二基本定理と同じく、価格が資源の制約（ここでは排出の上限）の影の価格になっている。
:::

::: proof
**Step 1（各企業の不等式）.** 【主張：任意の $e'_{i}\ge0$ で $b_{i}(e'_{i})\le b_{i}(e_{i})+p(e'_{i}-e_{i})$】条件 1 から $b_{i}(e'_{i})-pe'_{i}\le b_{i}(e_{i})-pe_{i}$。

**Step 2（足し合わせ）.** $\sum_{i}e'_{i}\le E$ なら、Step 1 を足して
$$
\sum_{i}b_{i}(e'_{i})\le\sum_{i}b_{i}(e_{i})+p\Bigl(\sum_{i}e'_{i}-E\Bigr)\le\sum_{i}b_{i}(e_{i}).
$$
最後の不等号は $p\ge0$ と $\sum_{i}e'_{i}\le E$ から。条件 2 は、$e$ 自身が上限をみたすこと（許容点であること）と、括弧の中を $\sum_{i}e'_{i}-\sum_{i}e_{i}$ と書き換えることに使った。

**Step 3（限界条件）.** $e_{i}>0$ が $b_{i}(x)-px$ の内点の最大点なので、微分が $0$：$b'_{i}(e_{i})=p$。
:::

::: hypcheck
- **連続性・単調性（\ref{econ:externality-market}）**：作りすぎの定理の Step 2（$h$ の非増加性）と Step 3（正の積分）に使った。
- **$d'>0$**：$q^{m}\ne q^{o}$ を導くのに使った。$d'\ge0$ だけなら $q^{m}\ge q^{o}$ である。
- **準線形性と無制限の移転（コースの定理）**：効率性と総余剰の最大化の同値（補題の Step 1 と Step 3）に使った。所得効果があると、効率的な活動水準が誰がお金を持つかに依存し、したがって権利の割り当てに依存しうる。
- **$S$ の連続性と $[0,\bar Q]$ のコンパクト性**：効率的な結果の存在（補題の Step 4）にだけ使った。
- **排出権の定理**：便益 $b_{i}$ の凹性も連続性も使っていない。ただし、条件 1・2 をみたす価格の存在（市場の均衡の存在）には凹性などが必要で、ここではそれを仮定として置いた。
:::

## 問題 {#econ:sec-xt-problems}

::: problem {#econ:prob-xt-positive}
正の外部性（$d'<0$、例えば予防接種や研究開発）のもとでは、競争市場の量は社会的に最適な量より小さいことを示せ。
:::

::: solution
\ref{econ:externality-market} の $d'>0$ だけを $d'<0$ に替え（$d'$ は非減少のまま）、$q^{m},q^{o}$ が存在するとする。$h\defeq P_{D}-c'-d'$ は非増加（$P_{D}$ は非増加、$c'$ と $d'$ は非減少）で、$h(q^{m})=-d'(q^{m})>0=h(q^{o})$。$q^{m}\ge q^{o}$ なら $h(q^{m})\le h(q^{o})$ となり矛盾。よって $q^{m}<q^{o}$。最適な量は補助金 $-d'(q^{o})$ で実現できる。
:::

::: problem {#econ:prob-xt-coase-transaction-cost}
\ref{econ:coase-example} で、交渉に費用 $k>0$（交渉がまとまると当事者全体で $k$ を失う）がかかるとする。A が汚染の権利をもつ場合、$k$ がいくら以上なら交渉は行われず、活動は $1$ のままになるか。
:::

::: solution
交渉で得られる利得は $G-k=\frac14-k$。これが負なら、どう分けても少なくとも一方は決裂点より悪くなるので交渉はまとまらない。$k>\frac14$ なら活動は $q_{A}=1$ のままで、権利の割り当てが結果を左右する（コースの定理の「交渉の費用がない」という前提が本質的であることを示す）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 作りすぎの定理は、需要や費用の微分可能性を使わない（積分と単調性だけ）。排出権の定理は便益関数について何も仮定しない（最大点であることだけを使う）。

**前提を変えると.**
- **情報の非対称のもとでのコースの定理**：被害や便益の大きさを互いに知らない場合、効率的・個人合理的・誘因両立的で予算が均衡する交渉の仕組みは一般には存在しない（マイヤーソン–サタースウェイトの定理、Myerson–Satterthwaite, J. Econ. Theory 29 (1983)、ここでは証明しない）。
- **価格か数量か**：政府が便益や費用を不確実にしか知らないとき、税（価格の規制）と排出の上限（数量の規制）のどちらが期待厚生で優れるかは、限界便益と限界被害の曲線の傾きの比で決まる（Weitzman, "Prices vs. Quantities", Rev. Econ. Stud. 41 (1974)、ここでは証明しない）。確実性のもとでは、ピグー税と上限 $q^{o}$ は同じ結果を与える。
- **排出権の初期配分**：排出権を無償で配るか競売するかは、企業の間の所得の分配を変えるが、条件 1・2 をみたす $e$ は変えない（準線形のもとで。コースの定理と同じ構造）。この観察は Montgomery (J. Econ. Theory 5 (1972)) による。

**出典.** ピグー税は Pigou『The Economics of Welfare』(1920)、コースの定理は Coase, "The Problem of Social Cost", J. Law Econ. 3 (1960) にさかのぼる。コース自身は定理の形では述べておらず、上の定式化（準線形・交渉の費用なし）は後の教科書による整理である。

**高い視点から：欠けている市場.** 外部性は「被害という財に市場がない」状態と見ることができる。排出権の取引は、被害の権利を財にして市場を作ることで、欠けていた市場を補う。そうすると経済は再び第一基本定理の前提をみたす。コースの定理は、取引の費用がなければ当事者が自分たちで市場を作ることを主張し、取引の費用こそが外部性の問題の本体だと指摘する。比喩で言えば、外部性は帳簿に載っていない取引で、ピグー税は政府が代わりに帳簿をつけること、コースの交渉と排出権の市場は当事者に帳簿をつけさせること、である。
:::
