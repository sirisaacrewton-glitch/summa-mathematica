# 演習：市場の失敗と政府 {#econ:page-exercises-market-failures keywords="exercises, Pigouvian tax with quadratic damage, Coase bargaining with income effects, permit market with quadratic abatement costs, Samuelson condition with Cobb-Douglas utilities, free riding with heterogeneous consumers, Clarke tax with many consumers, monopoly with constant elasticity demand, Cournot duopoly with different costs, lemons with buyer premium, moral hazard with square-root utility"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#econ:sec-emf-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 外部性 {#econ:sec-xt-exercises}

対応するページ：\ref{econ:page-externalities}

::: problem ★ 基本：排出権の価格 {#econ:ex-xt-permits}
2 社の便益が $b_{i}(e)=\alpha_{i}e-\frac{e^{2}}2$（$\alpha_{1}=10$, $\alpha_{2}=6$）、上限が $E=8$ のとき、排出権の均衡価格と各社の排出量を求め、\ref{econ:permit-market-efficiency} の条件をみたすことを確かめよ。
:::

::: solution
$b_{i}(x)-px$ は狭義凹で、$x\ge0$ での最大点は $x=\max(\alpha_{i}-p,0)$。$p<6$ なら $e_{1}+e_{2}=16-2p=8$ から $p=4$、$e=(6,2)$。条件 1・2 をみたすので、$e$ は上限 $8$ のもとで便益の和を最大にする。限界便益は両社とも $4$ に揃う。
:::

::: problem ★★ 標準：所得効果のある交渉 {#econ:ex-xt-coase-income}
\ref{econ:coase-setting} で、住民 B の効用を準線形でなく $\log(m_{B})-d(q)$（$m_{B}>0$ は所持金）とする。総余剰の最大化と効率性の同値（\ref{econ:quasilinear-efficiency}）の証明のどこが使えなくなるか述べよ。
:::

::: solution
証明の Step 1「効用の和は $S(q)$ で移転によらない」が崩れる：お金を 1 円移すと A の効用は 1 増えるが、B の効用は $\log$ の傾き $1/m_{B}$ だけ減り、両者の交換比率が所持金に依存する。したがって効率的な $q$ は B の所持金に依存し、権利の割り当て（決裂点）によって B の所持金が変わると、効率的な活動水準も変わりうる。コースの定理の「活動水準は割り当てによらない」は準線形性に依存する。
:::

## 公共財 {#econ:sec-pg-exercises}

対応するページ：\ref{econ:page-public-goods}

::: problem ★ 基本：限界便益の和 {#econ:ex-pg-samuelson}
3 人の便益が $v_{i}(G)=a_{i}\log(1+G)$（$a=(1,2,3)$）のとき、効率的な公共財の量を求めよ。
:::

::: solution
$\Phi(G)=6\log(1+G)-G$ は狭義凹で、$\Phi'(G)=\frac6{1+G}-1=0$ から $G^{*}=5$（\ref{econ:samuelson-condition}）。
:::

::: problem ★★ 標準：異なる人々のただ乗り {#econ:ex-pg-heterogeneous}
前問の経済で自発的な負担のナッシュ均衡を求め、誰が負担するかを答えよ。
:::

::: solution
負担する人は $\frac{a_{i}}{1+G^{N}}=1$、負担しない人は $\frac{a_{i}}{1+G^{N}}\le1$（\ref{econ:free-riding-underprovision} の 1）。$a_{i}$ が異なるので等式は高々 1 人でしか成り立たず、最大の $a_{3}=3$ の人だけが負担する：$G^{N}=2$、$g=(0,0,2)$。他の 2 人は $\frac{a_{i}}3\le1$ をみたす。$G^{N}=2<5=G^{*}$。最も熱心な人だけが負担し、他の全員がただ乗りする。
:::

## 独占と寡占 {#econ:sec-mo-exercises}

対応するページ：\ref{econ:page-monopoly-oligopoly}

::: problem ★ 基本：弾力性が一定の需要 {#econ:ex-mo-constant-elasticity}
需要の価格弾力性が一定の $-\eta$（$\eta>1$）で、限界費用が一定の $c$ のとき、独占価格を求めよ。
:::

::: solution
\ref{econ:monopoly-theorem} の 2 から $\frac{p-c}p=\frac1\eta$、$p=\frac{\eta}{\eta-1}c$。$\eta\downarrow1$ でマークアップは無限大に、$\eta\to\infty$ で $p\to c$。
:::

::: problem ★★ 標準：費用の異なる複占 {#econ:ex-mo-asymmetric-cournot}
\ref{econ:cournot-game} で $N=2$、限界費用が $c_{1}<c_{2}$（$a>2c_{2}-c_{1}$）のとき、クールノー均衡を求めよ。
:::

::: solution
最適反応は $q_{i}=\max\bigl(\frac{a-c_{i}-q_{j}}2,0\bigr)$（\ref{econ:cournot-equilibrium} の Step 1 と同じ）。両社が生産するとして連立方程式 $2q_{1}+q_{2}=a-c_{1}$, $q_{1}+2q_{2}=a-c_{2}$ を解くと $q_{1}=\frac{a-2c_{1}+c_{2}}3$, $q_{2}=\frac{a-2c_{2}+c_{1}}3$。仮定から $q_{2}>0$、また $q_{1}>q_{2}>0$。費用の低い企業が多く生産する。
:::

## 情報の非対称 {#econ:sec-ai-exercises}

対応するページ：\ref{econ:page-asymmetric-information}

::: problem ★ 基本：品質の分布と崩壊 {#econ:ex-ai-two-point}
品質が $\theta=0$ と $\theta=1$ の二点で、それぞれの割合が $\frac12$ のとき、$\beta>1$ の値によって取引のある均衡価格を求めよ。
:::

::: solution
$p\in(0,1)$ では売られるのは $\theta=0$ だけで、$\beta E[\theta\mid\theta\le p]=0\ne p$。$p\ge1$ では全員が売り、等式は $p=\frac\beta2$。これが $1$ 以上となるのは $\beta\ge2$ のとき。よって $1<\beta<2$ なら取引のある均衡はなく（$\theta=0$ の財だけでも価値は $0$ で、取引されても余剰を生まない）、$\beta\ge2$ なら $p=\frac\beta2$ で全員が売る。
:::

::: problem ★★ 標準：平方根の効用 {#econ:ex-ai-sqrt}
\ref{econ:principal-agent} で $u(w)=\sqrt w$（$w\ge0$）、$U_{0}=1$, $k=1$, $p_{1}=\frac34$, $p_{0}=\frac14$ とする。最適な契約と、ファーストベストとの期待賃金の差（エージェンシー・コスト）を求めよ。
:::

::: solution
$\Delta=\frac12$。\ref{econ:moral-hazard-cost} の 2 の式で $u(w_{H})=2+\frac{(1/4)\cdot1}{1/2}=\frac52$、$u(w_{L})=2-\frac{(3/4)\cdot1}{1/2}=\frac12$（$u$ の値域 $[0,\infty)$ に入るので、定理の証明は $\phi(U)=U^{2}$ を $[0,\infty)$ 上で使ってそのまま通る）。$w_{H}=\frac{25}4$, $w_{L}=\frac14$、期待賃金は $\frac34\cdot\frac{25}4+\frac14\cdot\frac14=\frac{76}{16}=\frac{19}4$。ファーストベストは $w^{*}=2^{2}=4$。差は $\frac34$。
:::
