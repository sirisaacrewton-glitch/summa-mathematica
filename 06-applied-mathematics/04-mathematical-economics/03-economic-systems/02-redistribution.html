# 再分配と社会保障 {#econ:page-redistribution keywords="social welfare function, utilitarian and Rawlsian (maximin) welfare, equal division is utilitarian optimal with concave utility and fixed income, Pigou-Dalton transfer principle, linear income tax with lump-sum benefit (negative income tax), labor supply response, Laffer curve, optimal linear tax between 0 and the revenue-maximizing rate, Chebyshev sum inequality, equity-efficiency trade-off, progressive taxation, welfare state"}

\ref[厚生経済学の第二基本定理]{econ:second-welfare-theorem} は、再分配を初期保有の一括の移転で行えば、効率を損なわずにどの効率的な配分も実現できることを示した。しかし一括の移転は、各人の能力のように政府が観察できない情報に依存しなければならず、実際には所得のような観察できる量に課税するしかない。所得に課税すると、人々は働く量を変えるので、効率が損なわれる。**修正資本主義**（福祉国家）の再分配の理論は、この「公平と効率のトレードオフ」をどう扱うかの理論である。

このページでは、(1) 社会の望ましさを測る**社会厚生関数**を定め、効用が凹で総所得が一定なら均等な分配が功利主義的に最適であること、(2) 豊かな人から貧しい人への順位を逆転させない移転（**ピグー–ドルトン移転**）は凹な社会厚生関数を下げないこと、(3) 労働供給の反応を入れた線形の所得税（一律の給付つき）で、税収を最大にする税率と、社会厚生を最大にする税率の関係（最適な税率は $0$ と税収最大の税率の間にあること）を証明する。

## 記法と定義の確認 {#econ:sec-rd-notation}

::: notation
- $n$ 人の社会を考え、$y_{i}$ は個人 $i$ の所得、$\bar y\defeq\frac1n\sum_{i}y_{i}$ は平均。
- 凹関数 $\phi$ の定義：$\phi(\lambda a+(1-\lambda)b)\ge\lambda\phi(a)+(1-\lambda)\phi(b)$（$0\le\lambda\le1$）。等号が $a\ne b$, $0<\lambda<1$ で決して成り立たないとき狭義凹。
- 一括の移転と第二基本定理は \ref{econ:second-welfare-theorem}。労働供給の最適化は、準線形効用の最大化（\ref{econ:quasilinear-surplus} と同じ型）である。
:::

## 社会厚生関数 {#econ:sec-rd-swf}

::: definition 社会厚生関数 {#econ:social-welfare-function keywords="a social welfare function aggregates individual utilities; utilitarian W = sum psi(u_i) with psi increasing (psi concave expresses inequality aversion), Rawlsian maximin W = min u_i; Pigou-Dalton transfer from richer to poorer that does not reverse ranks" index="社会厚生関数|しゃかいこうせいかんすう, 功利主義|こうりしゅぎ, マキシミン|まきしみん, ロールズ型の社会厚生関数|ろーるずがたのしゃかいこうせいかんすう, ピグー–ドルトン移転|ぴぐーどるとんいてん" refname="社会厚生関数"}
各人の効用の組 $(u_{1},\dots,u_{n})$ から社会の望ましさを与える関数を**社会厚生関数**という。
1. $W=\sum_{i}\psi(u_{i})$（$\psi$ は増加関数）。$\psi$ が恒等関数なら**功利主義的**、$\psi$ が凹なら、効用の不平等を嫌う度合いが $\psi$ の曲がり方で表される。
2. $W=\min_{i}u_{i}$ を**ロールズ型**（マキシミン）という。
3. 所得の組 $y$ で $y_{i}<y_{j}$ のとき、$0<\delta\le y_{j}-y_{i}$ について $y_{i}$ を $y_{i}+\delta$ に、$y_{j}$ を $y_{j}-\delta$ に変えることを**ピグー–ドルトン移転**という（$\delta\le\frac{y_{j}-y_{i}}2$ なら順位を逆転させない）。
:::

::: intuition
社会厚生関数は「社会としての価値判断」を数式にしたもので、数学からは決まらない。功利主義は効用の合計だけを見て、誰が得るかを問わない。ロールズ型は最も恵まれない人の状態だけを見る。凹な $\psi$ はその中間で、恵まれない人の効用の増加をより重く数える。
:::

::: proposition 均等な分配の最適性とピグー–ドルトンの原理 {#econ:equal-division-pigou-dalton keywords="with identical concave utility of income phi and fixed total income, equal division maximizes sum phi(y_i), uniquely if phi is strictly concave; a Pigou-Dalton transfer never decreases sum phi(y_i) for concave phi" index="均等分配|きんとうぶんぱい, ピグー–ドルトンの原理|ぴぐーどるとんのげんり" refname="均等な分配の最適性とピグー–ドルトンの原理"}
$\phi:\mathbb{R}\to\mathbb{R}$ を凹関数とする。
1. $\sum_{i}y_{i}=n\bar y$ をみたすすべての $y$ について $\sum_{i}\phi(y_{i})\le n\phi(\bar y)$。$\phi$ が狭義凹なら、等号は $y_{i}=\bar y$（すべての $i$）のときに限る。
2. $y'$ が $y$ からピグー–ドルトン移転で得られるなら $\sum_{i}\phi(y'_{i})\ge\sum_{i}\phi(y_{i})$。
:::

::: intuition
効用が凹なら、豊かな人の 1 円は貧しい人の 1 円より効用を少ししか生まない。だから豊かな人から貧しい人に移すと合計は増え、全員が同じになったところで増える余地がなくなる。ただし、これは「総所得が分配によって変わらない」という前提のもとでの話で、次の節でこの前提を外す。
:::

::: proof
**Step 1（1：イェンセンの不等式）.** 【主張：$\frac1n\sum_{i}\phi(y_{i})\le\phi(\bar y)$】$n$ についての帰納法。$n=1$ は等号。$n-1$ で成り立つとし、$\bar y'\defeq\frac1{n-1}\sum_{i<n}y_{i}$ とおくと $\bar y=\frac{n-1}n\bar y'+\frac1ny_{n}$。凹性から $\phi(\bar y)\ge\frac{n-1}n\phi(\bar y')+\frac1n\phi(y_{n})\ge\frac{n-1}n\cdot\frac1{n-1}\sum_{i<n}\phi(y_{i})+\frac1n\phi(y_{n})$（帰納法の仮定）。

**Step 2（1：等号の条件）.** $\phi$ が狭義凹で $y$ が均等でないとき、$y_{n}\ne\bar y'$ となるように番号を付け替えられる（すべての $i$ について、$y_{i}$ が残りの平均に等しいなら、全員が平均に等しい）。そのとき Step 1 の最初の不等号は狭義になる。

**Step 3（2）.** 【主張：$\phi(y_{i}+\delta)+\phi(y_{j}-\delta)\ge\phi(y_{i})+\phi(y_{j})$】$\lambda\defeq1-\frac\delta{y_{j}-y_{i}}\in[0,1)$ とすると、$y_{i}+\delta=\lambda y_{i}+(1-\lambda)y_{j}$, $y_{j}-\delta=\lambda y_{j}+(1-\lambda)y_{i}$。凹性から $\phi(y_{i}+\delta)\ge\lambda\phi(y_{i})+(1-\lambda)\phi(y_{j})$, $\phi(y_{j}-\delta)\ge\lambda\phi(y_{j})+(1-\lambda)\phi(y_{i})$。足すと主張。他の人の所得は変わらない。
:::

## 線形の所得税と労働供給 {#econ:sec-rd-linear-tax}

::: definition 給付つき線形所得税 {#econ:linear-income-tax keywords="individual i with wage (ability) w_i >= 0 chooses labor l >= 0 to maximize c - l^2/2 with c = (1 - tau) w_i l + b; labor supply l_i = (1 - tau) w_i; budget balance b = tau (1 - tau) m_2 with m_2 = mean of w_i^2; indirect utility V_i(tau) = (1 - tau)^2 w_i^2 / 2 + tau (1 - tau) m_2" index="線形所得税|せんけいしょとくぜい, 負の所得税|ふのしょとくぜい, 労働供給|ろうどうきょうきゅう, ラッファー曲線|らっふぁーきょくせん" refname="給付つき線形所得税"}
個人 $i$ の 1 時間あたりの賃金（能力）を $w_{i}\ge0$ とし、$m_{2}\defeq\frac1n\sum_{i}w_{i}^{2}>0$ とする。政府は税率 $\tau\le1$ で所得に課税し、税収を全員に同額 $b$ ずつ配る（**負の所得税**、またはベーシックインカムつきの一律税）。個人は労働 $l\ge0$ を選び、効用 $c-\frac{l^{2}}2$（$c=(1-\tau)w_{i}l+b$ は消費）を最大にする。政府の予算は $nb=\tau\sum_{i}w_{i}l_{i}$ で釣り合う。
:::

::: intuition
税率を上げると、給付の財源が増えて貧しい人が助かる一方、働いた分の手取りが減るので、人々は働く量を減らし、課税の対象（総所得）が縮む。税収は税率と課税対象の積なので、税率を上げすぎるとかえって減る。
:::

::: proposition 労働供給とラッファー曲線 {#econ:laffer-curve keywords="labor supply l_i = (1 - tau) w_i, per capita revenue R(tau) = tau (1 - tau) m_2 maximized at tau = 1/2, indirect utility V_i(tau) = (1 - tau)^2 w_i^2/2 + tau (1 - tau) m_2" index="ラッファー曲線|らっふぁーきょくせん, 税収最大化|ぜいしゅうさいだいか" refname="労働供給とラッファー曲線"}
\ref{econ:linear-income-tax} の設定で、
1. 個人 $i$ の労働供給は $l_{i}=(1-\tau)w_{i}$。
2. 予算を釣り合わせる給付は $b=R(\tau)\defeq\tau(1-\tau)m_{2}$ で、$R$ は $\tau\in[0,1]$ で $\tau=\frac12$ のとき最大。
3. 個人 $i$ の最大化された効用は $V_{i}(\tau)=\frac{(1-\tau)^{2}w_{i}^{2}}2+\tau(1-\tau)m_{2}$。
:::

::: intuition
税収は「税率 × 課税対象」で、課税対象 $(1-\tau)m_{2}$ は税率とともに直線的に縮む。二つの積は放物線で、真ん中で最大になる。
:::

::: proof
**Step 1（1）.** $f(l)\defeq(1-\tau)w_{i}l+b-\frac{l^{2}}2$ は狭義凹の 2 次関数で、頂点は $l=(1-\tau)w_{i}\ge0$（$\tau\le1$）。

**Step 2（2）.** 総所得は $\sum_{i}w_{i}l_{i}=(1-\tau)\sum_{i}w_{i}^{2}=(1-\tau)nm_{2}$ なので $b=\tau(1-\tau)m_{2}$。$R(\tau)=m_{2}\bigl(\frac14-(\tau-\frac12)^{2}\bigr)$。

**Step 3（3）.** $V_{i}=(1-\tau)w_{i}l_{i}+b-\frac{l_{i}^{2}}2=(1-\tau)^{2}w_{i}^{2}-\frac{(1-\tau)^{2}w_{i}^{2}}2+b$。
:::

::: theorem 最適な線形所得税 {#econ:optimal-linear-tax keywords="for social welfare sum psi(V_i(tau)) with psi increasing, differentiable and concave, welfare is nondecreasing on tau <= 0 and decreasing on [1/2, 1], so an optimal tax rate exists in [0, 1/2]; utilitarian (psi linear) gives tau = 0, Rawlsian with some w_i = 0 gives tau = 1/2; proof via Chebyshev's sum inequality" index="最適課税|さいてきかぜい, 公平と効率のトレードオフ|こうへいとこうりつのとれーどおふ, チェビシェフの和の不等式|ちぇびしぇふのわのふとうしき" refname="最適な線形所得税"}
\ref{econ:linear-income-tax} の設定で、$\psi:\mathbb{R}\to\mathbb{R}$ を微分可能・非減少・凹とし、$\mathcal W(\tau)\defeq\sum_{i}\psi(V_{i}(\tau))$（$\tau\le1$）とする。
1. $\mathcal W$ は $(-\infty,0]$ で非減少、$\psi'>0$ なら $[\frac12,1]$ で狭義減少。したがって、$\psi'>0$ なら $\mathcal W$ の $(-\infty,1]$ での最大点が $[0,\frac12]$ の中に存在する。
2. $\psi$ が恒等関数（功利主義）なら、最大点は $\tau=0$ ただ一つ。
3. ある $i$ で $w_{i}=0$ なら、ロールズ型の $\min_{i}V_{i}(\tau)$ の $(-\infty,1]$ での最大点は $\tau=\frac12$。
:::

::: intuition
税率が $\frac12$ を超えると、税収（給付）まで減るので、誰にとっても損で、どんな価値判断でも正当化できない。税率が負（賃金への補助金）だと、能力の高い人ほど得をするので、不平等を嫌う価値判断では望ましくない。その間のどこが最適かは、不平等をどれだけ嫌うか（$\psi$ の曲がり方）で決まる。効用が消費について線形なこのモデルでは、功利主義は再分配に価値を認めず、税率 $0$ を選ぶ。最も恵まれない人だけを見るロールズ型は、給付を最大にする税率 $\frac12$ を選ぶ。
:::

::: proof
**Step 1（効用の傾き）.** 【主張：$V'_{i}(\tau)=(1-2\tau)m_{2}-(1-\tau)w_{i}^{2}$、平均は $\frac1n\sum_{i}V'_{i}(\tau)=-\tau m_{2}$】\ref{econ:laffer-curve} の 3 を微分し、$\frac1n\sum_{i}w_{i}^{2}=m_{2}$ を使う。

**Step 2（$\tau\ge\frac12$ で減少）.** $\frac12<\tau\le1$ なら $(1-2\tau)m_{2}<0$ かつ $-(1-\tau)w_{i}^{2}\le0$ なので、すべての $i$ で $V'_{i}(\tau)<0$。$\psi'>0$ なら $\mathcal W'(\tau)=\sum_{i}\psi'(V_{i})V'_{i}<0$ が $(\frac12,1]$ で成り立ち、平均値の定理から $\mathcal W$ は $[\frac12,1]$ で狭義減少。

**Step 3（チェビシェフの和の不等式）.** 【主張：$a_{1},\dots,a_{n}$ と $b_{1},\dots,b_{n}$ が同じ向きに並んでいる（$(a_{i}-a_{j})(b_{i}-b_{j})\ge0$ がすべての $i,j$ で成り立つ）なら、$\sum_{i}a_{i}b_{i}\ge\frac1n\sum_{i}a_{i}\sum_{j}b_{j}$】$0\le\sum_{i,j}(a_{i}-a_{j})(b_{i}-b_{j})=2n\sum_{i}a_{i}b_{i}-2\sum_{i}a_{i}\sum_{j}b_{j}$。

**Step 4（$\tau\le0$ で非減少）.** $\tau<0$ とする。$V_{i}$ は $w_{i}^{2}$ の増加関数（係数 $\frac{(1-\tau)^{2}}2>0$）なので、$\psi$ の凹性から $\psi'$ は非増加で、$a_{i}\defeq\psi'(V_{i}(\tau))$ は $w_{i}^{2}$ について非増加。$b_{i}\defeq V'_{i}(\tau)$ も $w_{i}^{2}$ について非増加（係数 $-(1-\tau)<0$）。よって $(a_{i}-a_{j})(b_{i}-b_{j})\ge0$ で、Step 3 と Step 1 から
$$
\mathcal W'(\tau)=\sum_{i}a_{i}b_{i}\ge\frac1n\sum_{i}a_{i}\sum_{j}b_{j}=\Bigl(\sum_{i}a_{i}\Bigr)(-\tau m_{2})\ge0.
$$
平均値の定理から $\mathcal W$ は $(-\infty,0]$ で非減少。

**Step 5（1 の最大点）.** $\mathcal W$ は $[0,\frac12]$ で連続なので最大値をとる。Step 4 から $\tau<0$ の値はそれ以下（$\mathcal W(\tau)\le\mathcal W(0)$）、Step 2 から $\tau>\frac12$ の値も $\mathcal W(\frac12)$ 以下。

**Step 6（2）.** $\psi$ が恒等関数なら $\mathcal W'(\tau)=\sum_{i}V'_{i}=-n\tau m_{2}$。$\mathcal W(\tau)=\mathcal W(0)-\frac{n m_{2}\tau^{2}}2$ で、最大点は $\tau=0$ ただ一つ。

**Step 7（3）.** $w_{i}=0$ の人の効用は $V_{i}=R(\tau)$（給付だけ）で、他の人は $V_{j}\ge R(\tau)$。よって $\min_{i}V_{i}(\tau)=R(\tau)$ で、\ref{econ:laffer-curve} の 2 から最大点は $\tau=\frac12$（$\tau<0$ では $R<0$）。
:::

::: hypcheck
- **$\phi$ の凹性（均等分配）**：Step 1 と Step 3 の唯一の前提。$\phi$ が凸（豊かな人ほど 1 円を有効に使う）なら結論は逆転する。
- **準線形の効用 $c-\frac{l^{2}}2$**：労働供給と効用の陽な式（\ref{econ:laffer-curve}）に使った。消費の効用が凹なら、功利主義でも正の税率が最適になりうる（Mirrlees のモデル、補足）。
- **$\psi$ の凹性と微分可能性**：Step 4 で $\psi'$ が非増加であることに使った。$\psi$ が凸（不平等を好む）なら、負の税率が選ばれうる。
- **$m_{2}>0$**：Step 2 の狭義の不等号と Step 6 に使った。
- **一律の給付**：課税の形を「税率 × 所得 − 給付」に制限した。最適な非線形の税（累進の形そのもの）を求めるのは、ずっと難しい問題である。
:::

## 問題 {#econ:sec-rd-problems}

::: problem {#econ:prob-rd-variance}
ピグー–ドルトン移転が、所得の平均を変えずに分散を増やさないことを、\ref{econ:equal-division-pigou-dalton} から導け。
:::

::: solution
総所得は変わらないので平均 $\bar y$ も変わらない。$\phi(y)\defeq-(y-\bar y)^{2}$ は凹なので、2 から $\sum_{i}\phi(y'_{i})\ge\sum_{i}\phi(y_{i})$、すなわち $\sum_{i}(y'_{i}-\bar y)^{2}\le\sum_{i}(y_{i}-\bar y)^{2}$。
:::

::: problem {#econ:prob-rd-progressive}
\ref{econ:linear-income-tax} の税で、所得 $y>0$ の人の正味の税 $T(y)=\tau y-b$ の平均税率 $T(y)/y$ が $y$ について増加すること（**累進性**）を示せ（$0<\tau\le1$, $b>0$）。
:::

::: solution
$\frac{T(y)}y=\tau-\frac by$ は $b>0$ なので $y$ について狭義増加。限界税率は一定の $\tau$ でも、一律の給付があるために平均税率は所得とともに上がる。所得の低い人では $T(y)<0$（給付が税を上回る）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 均等分配の命題は $\phi$ の微分可能性も単調性も使わない。最適な線形所得税の定理の 1 は、$\psi$ の具体的な形を使わない。

**前提を変えると（ここでは証明しない）.**
- **非線形の最適課税**：能力が連続に分布し、政府が所得だけを観察できるとき、最適な所得税の形はマーリーズの公式で特徴づけられる（Mirrlees, Rev. Econ. Stud. 38 (1971)）。最高の能力の人の限界税率は $0$ であるべき、などの意外な結論を含む。数値計算では、最適な限界税率は能力の分布の裾の形に強く依存する（Saez, Rev. Econ. Stud. 68 (2001)）。
- **アトキンソンの指数**：$\psi(u)=\frac{u^{1-\varepsilon}}{1-\varepsilon}$ の形の社会厚生関数から、不平等を「平等な分配なら同じ厚生を与える所得が、平均より何割少ないか」で測る指数が得られる。$\varepsilon$ が不平等を嫌う度合いである。
- **アローの不可能性定理**：個人の選好の順序から社会の順序を作る規則で、いくつかの自然な条件（全会一致・無関係な選択肢からの独立・非独裁）を同時にみたすものは、選択肢が 3 つ以上なら存在しない（Arrow, 1951）。社会厚生関数を使うことは、効用の個人間比較を許すことで、この定理の前提の一つを外している。

**実証と論争.** 所得の税率を上げたときに課税対象の所得がどれだけ減るか（課税所得の弾力性）の推定は、研究によって大きく異なり、所得の分類の付け替えや申告の時期の変更なども含むので、労働供給そのものの反応より大きく出ることが多い、と一般には言われている。どの税率が最適かは、この弾力性と社会厚生関数（価値判断）の両方に依存するので、数学だけでは決まらない。

**高い視点から：価値判断と制約の分離.** 最適課税の問題は「何を望ましいとするか（$\psi$）」と「何が実現可能か（労働供給の反応と予算）」に分かれる。数学が示すのは後者が作る可能性の境界（例えば $\tau>\frac12$ は誰にとっても損）で、境界の上のどの点を選ぶかは前者が決める。この分業は、第二基本定理が効率と分配を分けたことの、より現実的な（一括の移転が使えない）版である。比喩で言えば、パイを切り分けるナイフ（税）がパイを少し潰してしまう状況で、どこまで均等に切るかの選択であり、潰れ方は測れるが、どこまで均等にすべきかは測れない。
:::
