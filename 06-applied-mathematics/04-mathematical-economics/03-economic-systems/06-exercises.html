# 演習：経済体制のモデル {#econ:page-exercises-systems keywords="exercises, multiplier with taxes and imports, IS-LM with linear functions, liquidity trap, Pigou-Dalton and Gini, optimal linear tax for log welfare, Leontief inverse by Neumann series, shadow prices in production planning, Okishio with two goods, exploitation rate, creative destruction comparative statics, median voter with even voters"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#econ:sec-esy-notation}

- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## ケインズ型のマクロモデル {#econ:sec-ky-exercises}

対応するページ：\ref{econ:page-keynesian}

::: problem ★ 基本：線形の IS-LM {#econ:ex-ky-linear-islm}
$C(Y-T)=10+0.8(Y-T)$, $I(r)=20-2r$, $L(Y,r)=0.5Y-5r$, $P=1$ とする。$G=T=10$, $M=40$ での均衡と、$\partial Y/\partial G$, $\partial Y/\partial M$ を求めよ。
:::

::: solution
IS：$Y=10+0.8(Y-10)+20-2r+10$、すなわち $0.2Y=32-2r$。LM：$40=0.5Y-5r$。LM から $r=0.1Y-8$、IS に代入して $0.2Y=32-0.2Y+16$、$Y=120$, $r=4$。\ref{econ:is-lm-comparative-statics} で $C'=0.8$, $I'=-2$, $L_{Y}=0.5$, $L_{r}=-5$：$D=0.2+\frac{(-2)(0.5)}{-5}=0.4$、$\partial Y/\partial G=2.5$（単純な乗数 $5$ の半分）、$\partial Y/\partial M=\frac{-2}{-5\cdot0.4}=1$。
:::

::: problem ★★ 標準：調整の速さ {#econ:ex-ky-half-life}
\ref{econ:keynesian-multiplier} の調整過程で、均衡からのずれが半分になるまでの期間を $c$ で表し、$c=0.8$ で計算せよ。
:::

::: solution
$\abs{Y_{t}-Y^{*}}=c^{t}\abs{Y_{0}-Y^{*}}$ なので、$c^{t}\le\frac12$ となる最小の整数 $t$ は $\lceil\log2/\log(1/c)\rceil$。$c=0.8$ では $\log2/\log1.25\approx3.11$ なので $4$ 期。限界消費性向が高いほど、乗数は大きいが調整は遅い。
:::

## 再分配と社会保障 {#econ:sec-rd-exercises}

対応するページ：\ref{econ:page-redistribution}

::: problem ★★ 標準：2 つの能力の最適税率 {#econ:ex-rd-two-types}
半数が $w=0$、半数が $w=2$ の社会（$m_{2}=2$）で、$\psi(V)=\log(1+V)$ のときの最適な線形税率を求めよ。
:::

::: solution
$V_{0}(\tau)=2\tau(1-\tau)$、$V_{2}(\tau)=2(1-\tau)^{2}+2\tau(1-\tau)=2(1-\tau)$。1 人あたりの厚生は $\frac12\bigl[\log(1+2\tau-2\tau^{2})+\log(3-2\tau)\bigr]$。微分して $0$ とおくと $\frac{2-4\tau}{1+2\tau-2\tau^{2}}=\frac2{3-2\tau}$、整理して $(1-2\tau)(3-2\tau)=1+2\tau-2\tau^{2}$、すなわち $6\tau^{2}-10\tau+2=0$、$\tau=\frac{5-\sqrt{13}}6\approx0.232$。これは \ref{econ:optimal-linear-tax} の通り $[0,\frac12]$ に入る（もう一つの解 $\approx1.43$ は範囲外）。
:::

## 計画経済の数理 {#econ:sec-pl-exercises}

対応するページ：\ref{econ:page-planning}

::: problem ★ 基本：ノイマン級数の打ち切り {#econ:ex-pl-truncation}
$A$ が生産的で、\ref{econ:productive-matrix} の証明の $\theta$ について、$x=(I-A)^{-1}d$ を $\sum_{t=0}^{T}A^{t}d$ で近似したときの誤差を、重みつきノルムで評価せよ。
:::

::: solution
誤差は $\sum_{t>T}A^{t}d$ で、$\norm{A^{t}d}_{x}\le\theta^{t}\norm d_{x}$ なので、誤差のノルムは $\frac{\theta^{T+1}}{1-\theta}\norm d_{x}$ 以下。$\theta$ は「最も自給的でない産業」の自己消費の割合で、$1$ に近いほど連鎖が長く、近似に多くの項が必要になる。
:::

::: problem ★★ 標準：資源の追加の価値 {#econ:ex-pl-extra-land}
\ref{econ:prob-pl-diet} の問題で、土地を 1 単位増やす（$r_{2}=7$）と最適値はいくらになるか。\ref{econ:shadow-price} の上界と比べよ。
:::

::: solution
$x_{1}+2x_{2}\le10$, $x_{1}+x_{2}\le7$ の頂点 $(7,0),(4,3),(0,5)$ の値は $21,24,20$ で、最適値は $24$。増分は $2=y_{2}^{*}$ で、上界 $V(r)+y^{*}(r'-r)=22+2$ がちょうど達成される（基底が変わらない範囲では等号）。
:::

## マルクス経済学の数理 {#econ:sec-mx-exercises}

対応するページ：\ref{econ:page-marxian}

::: problem ★★ 標準：2 財の基本定理 {#econ:ex-mx-two-goods}
$A=\begin{pmatrix}0.2&0.1\\0.1&0.2\end{pmatrix}$, $a_{0}=(1,1)$, $b=(0,\beta)^{\top}$（労働者は財 2 だけを消費）とする。$M=A+ba_{0}\gg0$ となる $\beta>0$ について、体化労働・搾取率と、利潤率が正になる $\beta$ の範囲を求めよ。
:::

::: solution
$I-A=\begin{pmatrix}0.8&-0.1\\-0.1&0.8\end{pmatrix}$、行列式 $0.63$。$\lambda=a_{0}(I-A)^{-1}=\frac1{0.63}(0.9,0.9)=(\frac{10}7,\frac{10}7)$。$\lambda b=\frac{10\beta}7$ なので、\ref{econ:fundamental-marxian-theorem} から $\pi>0\iff\beta<0.7$、搾取率は $e=\frac{0.7-\beta}\beta$。（直接の確認：$M$ の各列の和は $0.3+\beta$ で、行ベクトル $(1,1)$ が $M$ の左固有ベクトル、$\rho=0.3+\beta$。$\pi>0\iff\rho<1\iff\beta<0.7$。）
:::

## 体制の内生的な変容 {#econ:sec-ch-exercises}

対応するページ：\ref{econ:page-endogenous-change}

::: problem ★ 基本：割引率と成長 {#econ:ex-ch-discount}
\ref{econ:creative-destruction} で、割引率 $r$ が上がると成長率はどう変わるか。理由も述べよ。
:::

::: solution
$n^{*}$ は $r$ について減少するので、成長率 $\lambda n^{*}\log\gamma$ も下がる。将来の独占の価値 $V$ が強く割り引かれ、研究の裁定条件を釣り合わせる研究の量が減るからである。
:::

::: problem ★★★ 発展：偶数の投票者 {#econ:ex-ch-even-voters}
投票者が偶数 $2k$ 人で、峰を小さい順に並べた $k$ 番目と $k+1$ 番目を $\tau_{(k)}\le\tau_{(k+1)}$ とする。単峰的な選好のもとで、$[\tau_{(k)},\tau_{(k+1)}]$ の点はどの対案にも負けない（同数を含めて、過半数で負けない）ことを示せ。
:::

::: solution
$\tau^{\circ}\in[\tau_{(k)},\tau_{(k+1)}]$ と $\tau'>\tau^{\circ}$ をとる。峰が $\tau_{(k)}$ 以下の $k$ 人は $\tau_{i}\le\tau^{\circ}<\tau'$ なので $\tau^{\circ}$ を選ぶ（\ref{econ:median-voter-theorem} の Step 1 と同じ）。$\tau'$ を厳密に好む人は残りの $k$ 人以下なので、$\tau'$ は過半数（$k+1$ 人）をとれない。$\tau'<\tau^{\circ}$ も同様。奇数のときと違い、勝者が区間になり、同数で決着しない場合がある。
:::
