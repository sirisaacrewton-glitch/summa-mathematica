# ケインズ型のマクロモデル {#econ:page-keynesian keywords="modified capitalism, Keynesian cross, consumption function, marginal propensity to consume, government spending multiplier as a geometric series, tax multiplier, balanced budget multiplier, paradox of thrift, IS-LM model, comparative statics via the implicit function theorem, crowding out, liquidity trap, fiscal versus monetary policy, rigid prices, Lucas critique, empirical multiplier estimates"}

\ref[市場と均衡]{econ:page-welfare-theorems} の系列では、価格が速やかに調整されて市場が釣り合う経済を扱った。そこでは失業（労働市場の売れ残り）は一時的な現象にすぎない。1930 年代の大恐慌は、売れ残りが長く続きうることを示し、ケインズ『雇用・利子および貨幣の一般理論』(1936) は、短期には価格が硬直的で、生産量（所得）が需要に合わせて決まる、という見方を示した。この見方は、政府が財政支出や金融政策で需要を管理する体制（**修正資本主義**、混合経済）の理論的な根拠になった。

このページでは、価格を固定したうえで、(1) 政府支出の増加がその何倍もの所得を生むこと（**乗数**）、(2) 全員が貯蓄を増やそうとすると所得が減り、貯蓄の総額は増えないこと（**倹約の逆説**）、(3) 財市場と貨幣市場を同時に扱う **IS-LM モデル**での財政政策と金融政策の効果、特に金利がそれ以上下がらない状況（**流動性の罠**）で金融政策が効かなくなること、を証明する。これらは「価格が硬直的である」という仮定のもとでの定理であり、仮定がどの程度現実に当てはまるかは別の問題である（補足を参照）。

## 記法と定義の確認 {#econ:sec-ky-notation}

::: notation
- $Y$ は国民所得（＝生産量）、$C$ は消費、$I$ は投資、$G$ は政府支出、$T$ は税、$r$ は利子率、$M$ は貨幣の量、$P$ は物価水準（このページでは定数）。
- \ref{calc:implicit-function-theorem} を使う。縮小写像の不動点定理は \ref{top:banach-fixed-point}（ここでは $\mathbb{R}$ 上の簡単な場合だけ使う）。
- 「均衡」は、計画された支出の合計が生産量に等しい状態（財市場）と、貨幣の需要が供給に等しい状態（貨幣市場）を指す。価格による調整は考えない。
:::

## 乗数 {#econ:sec-ky-multiplier}

::: definition ケインズ型の財市場 {#econ:keynesian-cross keywords="consumption function C = c_0 + c (Y - T) with marginal propensity to consume 0 < c < 1; planned expenditure E(Y) = C + I + G; equilibrium income Y* solves Y = E(Y); adjustment Y_{t+1} = E(Y_t)" index="消費関数|しょうひかんすう, 限界消費性向|げんかいしょうひせいこう, ケインズの交差図|けいんずのこうさず, 有効需要|ゆうこうじゅよう" refname="ケインズ型の財市場"}
消費を**消費関数** $C=c_{0}+c(Y-T)$（$c_{0}\ge0$、$0<c<1$ は**限界消費性向**）、投資 $I$ と政府支出 $G$ と税 $T$ を定数とする。計画された総支出を $E(Y)\defeq c_{0}+c(Y-T)+I+G$ とし、$Y=E(Y)$ となる $Y^{*}$ を**均衡所得**という。生産者が前の期の支出に合わせて生産量を決める調整過程を $Y_{t+1}=E(Y_{t})$ とする。
:::

::: intuition
価格が動かないなら、企業は売れる分だけ作る。売れる量（需要）は人々の所得で決まり、所得は作った量で決まる。この循環が釣り合う点が均衡所得で、価格ではなく生産量が調整を担う。
:::

::: theorem 乗数 {#econ:keynesian-multiplier keywords="Y* = (c_0 - cT + I + G)/(1 - c); dY*/dG = 1/(1 - c) > 1, dY*/dT = -c/(1 - c), balanced budget multiplier 1; Y_t -> Y* geometrically with Y_t - Y* = c^t (Y_0 - Y*); after a permanent increase dG the income increases are dG, c dG, c^2 dG, ... summing to dG/(1 - c)" index="乗数|じょうすう, 政府支出乗数|せいふししゅつじょうすう, 租税乗数|そぜいじょうすう, 均衡予算乗数|きんこうよさんじょうすう" refname="乗数"}
\ref{econ:keynesian-cross} の設定で、
1. 均衡所得はただ一つで $Y^{*}=\dfrac{c_{0}-cT+I+G}{1-c}$。
2. $\dfrac{\partial Y^{*}}{\partial G}=\dfrac1{1-c}>1$（**政府支出乗数**）、$\dfrac{\partial Y^{*}}{\partial T}=-\dfrac c{1-c}$（**租税乗数**）。$G$ と $T$ を同じ額だけ増やすと $Y^{*}$ はちょうどその額だけ増える（**均衡予算乗数**は $1$）。
3. 調整過程は $Y_{t}-Y^{*}=c^{t}(Y_{0}-Y^{*})$ をみたし、$Y_{t}\to Y^{*}$。特に、均衡 $Y_{0}=Y^{*}(G)$ から $G$ を $\Delta G$ だけ恒久的に増やすと、所得の増分は $Y_{t}-Y_{0}=(1+c+\dots+c^{t-1})\Delta G\to\dfrac{\Delta G}{1-c}$。
:::

::: intuition
政府が 1 円使うと、それは誰かの所得になり、その人は $c$ 円を消費に回す。それがまた誰かの所得になり、$c^{2}$ 円が消費される……。この連鎖の合計が等比級数 $1+c+c^{2}+\dots=\frac1{1-c}$ である。税を 1 円減らすと、最初の 1 円のうち $c$ 円しか使われないので、連鎖は 1 段短い。
:::

::: proof
**Step 1（1）.** $Y=c_{0}+c(Y-T)+I+G$ は $Y$ の 1 次方程式で、$(1-c)Y=c_{0}-cT+I+G$。$1-c>0$ なので解はただ一つ。

**Step 2（2）.** 1 の式を $G$, $T$ で微分する。$G$ と $T$ を同じ $\Delta$ だけ増やすと、$Y^{*}$ の変化は $\frac{\Delta-c\Delta}{1-c}=\Delta$。

**Step 3（3）.** 【主張：$Y_{t+1}-Y^{*}=c(Y_{t}-Y^{*})$】$Y_{t+1}-Y^{*}=E(Y_{t})-E(Y^{*})=c(Y_{t}-Y^{*})$（$E$ は傾き $c$ の 1 次関数）。帰納法で $Y_{t}-Y^{*}=c^{t}(Y_{0}-Y^{*})$、$0<c<1$ から $c^{t}\to0$。$G$ を増やした後の均衡を $Y^{**}=Y_{0}+\frac{\Delta G}{1-c}$（2）とすると、$Y_{t}-Y_{0}=(Y^{**}-Y_{0})(1-c^{t})=\frac{1-c^{t}}{1-c}\Delta G=(1+c+\dots+c^{t-1})\Delta G$。
:::

::: theorem 倹約の逆説 {#econ:paradox-of-thrift keywords="in the Keynesian cross without government, a fall in autonomous consumption c_0 (more thrift) lowers equilibrium income by the multiplier and leaves aggregate saving S = Y - C equal to investment I unchanged; with investment increasing in income, I = I_0 + hY (0 <= h < 1 - c), aggregate saving falls" index="倹約の逆説|けんやくのぎゃくせつ, 合成の誤謬|ごうせいのごびゅう" refname="倹約の逆説"}
$G=T=0$ とし、投資を $I=I_{0}+hY$（$I_{0}\ge0$, $0\le h<1-c$）とする。貯蓄を $S\defeq Y-C$ とする。
1. 均衡は $Y^{*}=\dfrac{c_{0}+I_{0}}{1-c-h}$ で、均衡では $S=I$。
2. $c_{0}$ を下げる（人々がより倹約する）と $Y^{*}$ は下がる。$h=0$ なら均衡の貯蓄 $S^{*}$ は $c_{0}$ によらず $I_{0}$ のまま、$h>0$ なら $S^{*}$ は真に減る。
:::

::: intuition
一人が倹約すればその人の貯蓄は増えるが、全員が倹約すると消費が減り、企業の売上と人々の所得が減る。所得が減ると貯蓄も減るので、全員の貯蓄の合計は投資の額に縛られたまま増えない。投資が所得とともに増える場合には、所得の減少が投資を減らし、貯蓄はかえって減る。個人にとって正しいことが全体では成り立たない（**合成の誤謬**）例である。
:::

::: proof
**Step 1（1）.** $Y=c_{0}+cY+I_{0}+hY$ から $(1-c-h)Y=c_{0}+I_{0}$、$1-c-h>0$。均衡では $Y=C+I$ なので $S=Y-C=I$。

**Step 2（2）.** $\frac{\partial Y^{*}}{\partial c_{0}}=\frac1{1-c-h}>0$。均衡の貯蓄は $S^{*}=I_{0}+hY^{*}$ で、$\frac{\partial S^{*}}{\partial c_{0}}=\frac h{1-c-h}$。これは $h=0$ なら $0$、$h>0$ なら正なので、$c_{0}$ を下げると $S^{*}$ は真に減る。
:::

## IS-LM モデル {#econ:sec-ky-islm}

::: definition IS-LM モデル {#econ:is-lm-model keywords="IS curve Y = C(Y - T) + I(r) + G, LM curve M/P = L(Y, r); C' in (0, 1), I' < 0, L_Y > 0, L_r < 0, all C^1; equilibrium (Y, r) solves both" index="IS-LM モデル|あいえすえるえむもでる, IS 曲線|あいえすきょくせん, LM 曲線|えるえむきょくせん, 貨幣需要|かへいじゅよう" refname="IS-LM モデル"}
$C:\mathbb{R}\to\mathbb{R}$, $I:\mathbb{R}\to\mathbb{R}$, $L:\mathbb{R}^{2}\to\mathbb{R}$ を $C^{1}$ 級とし、$0<C'<1$、$I'<0$（利子率が上がると投資が減る）、$L_{Y}\defeq\partial L/\partial Y>0$（取引のための貨幣需要）、$L_{r}\defeq\partial L/\partial r<0$（利子率が上がると、利子を生まない貨幣を持つ費用が上がる）とする。
$$
F(Y,r;G,T,M)\defeq\begin{pmatrix}Y-C(Y-T)-I(r)-G\\ L(Y,r)-M/P\end{pmatrix}
$$
とし、$F=0$ をみたす $(Y,r)$ を **IS-LM 均衡**という。第 1 成分が $0$ の点の集合を **IS 曲線**（財市場の均衡）、第 2 成分が $0$ の点の集合を **LM 曲線**（貨幣市場の均衡）という。
:::

::: intuition
IS 曲線は「利子率が低いほど投資が増え、所得が高くなる」という右下がりの関係、LM 曲線は「所得が高いほど取引に必要な貨幣が増え、貨幣が足りなくなって利子率が上がる」という右上がりの関係である。両者の交点で、財と貨幣の両方の市場が釣り合う。
:::

::: theorem IS-LM モデルの比較静学 {#econ:is-lm-comparative-statics keywords="at an IS-LM equilibrium the Jacobian determinant (1 - C') L_r + I' L_Y is negative, so (Y, r) is locally a C^1 function of policy; dY/dG = 1/D with D = 1 - C' + I' L_Y / L_r in (1 - C', infinity), so 0 < dY/dG < 1/(1 - C') (crowding out), dr/dG > 0, dY/dM = I'/(P L_r D) > 0; as L_r -> -infinity (liquidity trap) dY/dM -> 0 and dY/dG -> 1/(1 - C')" index="比較静学|ひかくせいがく, クラウディング・アウト|くらうでぃんぐあうと, 流動性の罠|りゅうどうせいのわな, 財政政策|ざいせいせいさく, 金融政策|きんゆうせいさく" refname="IS-LM モデルの比較静学"}
\ref{econ:is-lm-model} の設定で、政策 $(G_{0},T_{0},M_{0})$ のもとで IS-LM 均衡 $(Y_{0},r_{0})$ があるとする。
1. 政策の近くで、均衡 $(Y,r)$ は政策の $C^{1}$ 級関数として一意に定まる（$(Y_{0},r_{0})$ の近くで）。
2. 偏導関数を $(Y_{0},r_{0})$ で評価し、$D\defeq1-C'+\dfrac{I'L_{Y}}{L_{r}}$ とおくと $D>1-C'>0$ で、
$$
\frac{\partial Y}{\partial G}=\frac1D,\qquad\frac{\partial r}{\partial G}=-\frac{L_{Y}}{L_{r}D}>0,\qquad\frac{\partial Y}{\partial M}=\frac{I'}{PL_{r}D}>0.
$$
特に $0<\frac{\partial Y}{\partial G}<\frac1{1-C'}$：利子率の上昇が投資を押しのけ（**クラウディング・アウト**）、乗数は \ref{econ:keynesian-multiplier} より小さい。
3. $C',I',L_{Y}$ を固定して $L_{r}\to-\infty$（貨幣需要が利子率に無限に敏感、**流動性の罠**）とすると、$\frac{\partial Y}{\partial M}\to0$ かつ $\frac{\partial Y}{\partial G}\to\frac1{1-C'}$。
:::

::: intuition
政府支出を増やすと所得が増え、取引のための貨幣需要が増えて利子率が上がり、投資が一部減る。これが乗数を小さくする。逆に金融緩和（貨幣を増やす）は利子率を下げて投資を増やす。しかし、人々が「利子率はこれ以上下がらない」と考えて、増えた貨幣をそのまま持ち続けるなら（流動性の罠）、利子率は動かず、金融緩和は効かない。そのとき財政支出は利子率を上げないので、押しのけがなく、単純な乗数がそのまま効く。
:::

::: proof
**Step 1（ヤコビ行列）.** 【主張：$\det D_{(Y,r)}F=(1-C')L_{r}+I'L_{Y}<0$】
$$
D_{(Y,r)}F=\begin{pmatrix}1-C'&-I'\\ L_{Y}&L_{r}\end{pmatrix},\qquad\det=(1-C')L_{r}+I'L_{Y}.
$$
$1-C'>0$, $L_{r}<0$ から第 1 項は負、$I'<0$, $L_{Y}>0$ から第 2 項も負。

**Step 2（1）.** $F$ は $C^{1}$ 級で、Step 1 から $D_{(Y,r)}F(Y_{0},r_{0})$ は可逆。\ref{calc:implicit-function-theorem} を、政策 $(G,T,M)$ を $x$、$(Y,r)$ を $y$ として適用する。

**Step 3（2：微分の計算）.** 陰関数定理の 3 の式、すなわち $F(Y(G),r(G))=0$ を $G$ で微分した式
$$
(1-C')Y_{G}-I'r_{G}=1,\qquad L_{Y}Y_{G}+L_{r}r_{G}=0
$$
を解く。第 2 式から $r_{G}=-\frac{L_{Y}}{L_{r}}Y_{G}$。第 1 式に代入して $\bigl(1-C'+\frac{I'L_{Y}}{L_{r}}\bigr)Y_{G}=1$。$\frac{I'L_{Y}}{L_{r}}>0$（負・正・負の積と商）なので $D>1-C'>0$、$Y_{G}=\frac1D$。$r_{G}=-\frac{L_{Y}}{L_{r}D}>0$。$M$ について同様に、$(1-C')Y_{M}-I'r_{M}=0$, $L_{Y}Y_{M}+L_{r}r_{M}=\frac1P$ から $r_{M}=\frac{1-L_{Y}Y_{M}P}{PL_{r}}$、代入して $(1-C')Y_{M}=I'\frac{1-PL_{Y}Y_{M}}{PL_{r}}$、すなわち $DY_{M}=\frac{I'}{PL_{r}}$。$\frac{I'}{L_{r}}>0$ なので $Y_{M}>0$。

**Step 4（3）.** $L_{r}\to-\infty$ のとき $\frac{I'L_{Y}}{L_{r}}\to0$ なので $D\to1-C'$、$Y_{G}\to\frac1{1-C'}$。$Y_{M}=\frac{I'}{PL_{r}D}$ の分母の絶対値は $\to\infty$、分子は一定なので $Y_{M}\to0$。
:::

::: hypcheck
- **$0<c<1$（乗数）**：均衡の一意性（$1-c\ne0$）、乗数が正で $1$ より大きいこと、調整の収束（$c^{t}\to0$）に使った。$c\ge1$ なら調整過程は発散する。
- **$h<1-c$（倹約の逆説）**：均衡の存在と、所得への効果の符号に使った。
- **符号の条件（IS-LM）**：ヤコビ行列式の符号（Step 1）、したがって陰関数定理の適用と、比較静学のすべての符号に使った。
- **$C^{1}$ 級**：陰関数定理の前提。
- **均衡の存在**：IS-LM 均衡 $(Y_{0},r_{0})$ があることは仮定として置いた。定理は局所的な主張で、均衡が大域的に一つかどうかは述べていない。
- **物価の固定**：モデル全体の前提。物価が動くと、貨幣の実質量 $M/P$ が変わり、金融政策の効果は物価の上昇に吸収されうる。
:::

## 問題 {#econ:sec-ky-problems}

::: problem {#econ:prob-ky-open-economy}
輸入を $\mathrm{Im}=mY$（$0<m<1$, **限界輸入性向**）として \ref{econ:keynesian-cross} の総支出から差し引くと、政府支出乗数はどうなるか。
:::

::: solution
$Y=c_{0}+c(Y-T)+I+G-mY$ から $Y^{*}=\frac{c_{0}-cT+I+G}{1-c+m}$、乗数は $\frac1{1-c+m}<\frac1{1-c}$。支出の一部が海外に漏れるので、連鎖の各段が $c-m$ 倍に縮む。
:::

::: problem {#econ:prob-ky-tax-function}
税が所得に比例する（$T=\tau Y$, $0<\tau<1$）とき、政府支出乗数を求め、比例税が所得の変動を小さくする（**自動安定化装置**）ことを説明せよ。
:::

::: solution
$Y=c_{0}+c(1-\tau)Y+I+G$ から乗数は $\frac1{1-c(1-\tau)}<\frac1{1-c}$。投資 $I$ が変動したときの $Y^{*}$ の変動も同じ係数倍なので、税率が高いほど所得の変動は小さい。所得が下がると税が自動的に減って可処分所得の減少を和らげるからで、政策の判断を待たずに働く。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 乗数の定理は消費関数の線形性を使ったが、$C$ が $C^{1}$ 級で $0<C'<1$ なら、局所的に同じ結論（乗数は $\frac1{1-C'}$）が陰関数定理から得られる。

**前提を変えると（ここでは証明しない）.**
- **リカードの等価定理**：家計が政府の予算制約を見通し、将来の増税に備えて今の減税分を貯蓄するなら、国債で賄う減税は消費を変えない（Barro, J. Polit. Econ. 82 (1974)）。前提（無限の視野、借入制約がない、一括税）は強く、現実にどこまで成り立つかは議論がある。
- **ルーカス批判**：消費関数のような「行動の式」の係数は、政策の変更とともに変わりうるので、過去のデータから推定した係数で新しい政策の効果を予測するのは誤りうる（Lucas, Carnegie-Rochester Conf. Ser. 1 (1976)）。この批判の後、マクロ経済学は家計と企業の最適化から式を導くモデル（動学的一般均衡）に移った（\ref[成長と動学]{econ:page-solow-model} を参照、予定）。
- **価格の硬直性の根拠**：価格を変える費用（メニュー・コスト）や長期の契約によって価格が硬直的になることを、最適化から導くモデル（ニューケインジアン・モデル）がある。

**実証（推定値には幅がある）.** 政府支出乗数の実証的な推定は方法と時期によって大きく異なり、米国についての展望論文 Ramey, "Can Government Purchases Stimulate the Economy?", J. Econ. Lit. 49 (2011) は、おおむね $0.8$ から $1.5$ の範囲の推定が多いとまとめている。金利がゼロ近くに張り付いている時期には乗数が大きくなるという研究もあるが、合意は得られていない。限界消費性向を $0.8$ として \ref{econ:keynesian-multiplier} の式から得られる $5$ は、輸入・税・利子率の反応・期待などを無視した上限と考えるべきである。

**高い視点から：不動点としての均衡と、調整の主役.** 均衡所得は写像 $Y\mapsto E(Y)$ の不動点で、$E$ が縮小写像（傾き $c<1$）であることが、一意性と調整の収束の両方を保証する（\ref{top:banach-fixed-point} の最も簡単な例）。乗数はその不動点の、パラメータについての微分で、等比級数 $\sum c^{t}$ はノイマン級数 $(1-c)^{-1}=\sum c^{t}$（\ref{fa:neumann-series}）の 1 次元版である。産業連関分析（\ref[計画経済]{econ:page-planning}、予定）では、同じ構造が行列 $(I-A)^{-1}=\sum A^{t}$ として現れる。比喩で言えば、ワルラス的な経済では「値札」が動いて釣り合いをとり、ケインズ的な経済では値札が動かない代わりに「生産量」が動いて釣り合う。どちらが主役かは時間の長さによる、というのが現代の標準的な見方である。
:::
