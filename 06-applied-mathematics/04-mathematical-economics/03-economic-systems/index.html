# 経済体制のモデル（Models of Economic Systems）

修正資本主義の理論（ケインズ型の乗数と IS-LM、再分配と社会保障）、計画経済（産業連関とホーキンス–サイモン条件、線形計画の双対価格）、マルクス経済学の数理（置塩の定理・森嶋の基本定理）、イノベーションや所得の集中による体制の内生的な変容。証明できること・実証・論争を分けて扱う。

<p class="mn-msc">MSC2020: 91B50, 91B64, 91B66, 91B62</p>
