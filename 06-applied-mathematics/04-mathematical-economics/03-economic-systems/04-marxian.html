# マルクス経済学の数理 {#econ:page-marxian keywords="Marxian economics, reproduction schemes, simple reproduction condition, labor values, value of labor power, rate of exploitation, prices of production with a uniform rate of profit, augmented input matrix, positive eigenvector via Brouwer, Collatz-Wielandt comparison, wage-profit trade-off, Fundamental Marxian Theorem (Okishio, Morishima), Okishio theorem on technical change, falling rate of profit"}

マルクス『資本論』は、資本主義の利潤の源泉を労働の搾取に求め、資本主義が内部の矛盾によって変容・崩壊すると論じた。20 世紀後半には、置塩信雄・森嶋通夫らが、その主張のうち数学的に定式化できる部分を、前のページの産業連関の枠組み（\ref{econ:page-planning}）で厳密に扱った。その結果、(1) 正の利潤があることと、労働者が自分の消費する財に含まれる以上の労働をすること（**搾取**）が同値であること（**マルクスの基本定理**）が示される一方で、(2) 実質賃金が一定なら、資本家が費用を下げる新技術を採用しても利潤率は下がらない（**置塩の定理**）ことも示された。後者は、「技術革新が利潤率を傾向的に低下させ、資本主義を自壊させる」というマルクスの議論に、少なくともそのままの形では成り立たないことを示す反例となる仮定を明らかにしている。

このページでは、再生産表式の均衡条件、価値と生産価格、そして二つの定理を、正の行列の固有ベクトルの存在（ブラウワーの不動点定理による）から証明する。

## 記法と定義の確認 {#econ:sec-mx-notation}

::: notation
- 投入係数行列 $A\ge0$、労働投入 $a_{0}$、生産的な行列とレオンチェフ逆行列は \ref{econ:input-output-model}, \ref{econ:productive-matrix}。$\lambda\defeq a_{0}(I-A)^{-1}$ とする（\ref{econ:embodied-labor}）。
- 単体 $\Delta\defeq\{p\ge0:\sum_{i}p_{i}=1\}$（行ベクトル）の連続な自己写像が不動点をもつことは \ref{econ:convex-body-ball}（ブラウワーの不動点定理）。
- $e\defeq(1,\dots,1)^{\top}$。行列の不等式は成分ごと。$M\gg0$ はすべての成分が正。
:::

## 再生産表式 {#econ:sec-mx-reproduction}

::: definition 二部門の再生産表式 {#econ:reproduction-scheme keywords="department I produces means of production, department II consumption goods; value of output of department k is c_k + v_k + s_k (constant capital, variable capital, surplus value); simple reproduction: all surplus value is consumed" index="再生産表式|さいせいさんひょうしき, 不変資本|ふへんしほん, 可変資本|かへんしほん, 剰余価値|じょうよかち, 単純再生産|たんじゅんさいせいさん" refname="二部門の再生産表式"}
経済を、生産手段を作る第 I 部門と、消費財を作る第 II 部門に分ける。第 $k$ 部門の年間の生産物の価値を $c_{k}+v_{k}+s_{k}$ と書く。$c_{k}$ は使い尽くされた生産手段の価値（**不変資本**）、$v_{k}$ は賃金として支払われた価値（**可変資本**）、$s_{k}$ は**剰余価値**である。労働者は賃金をすべて消費財に、資本家は剰余価値をすべて消費財に使い、生産手段は前年と同じだけ補塡される経済を**単純再生産**という。
:::

::: intuition
生産手段の部門は、自分の部門と消費財の部門の両方に生産手段を供給しなければならない。消費財の部門は、両部門の労働者と資本家に消費財を供給しなければならない。二つの部門の間で、売る量と買う量が釣り合う条件が、再生産の条件である。
:::

::: proposition 単純再生産の条件 {#econ:simple-reproduction keywords="simple reproduction is possible iff v_1 + s_1 = c_2: department I's wages and surplus (spent on consumption goods) equal department II's demand for means of production" index="単純再生産の条件|たんじゅんさいせいさんのじょうけん" refname="単純再生産の条件"}
\ref{econ:reproduction-scheme} の単純再生産で、生産手段の需給（$c_{1}+v_{1}+s_{1}=c_{1}+c_{2}$）と消費財の需給（$c_{2}+v_{2}+s_{2}=v_{1}+s_{1}+v_{2}+s_{2}$）は、どちらも $v_{1}+s_{1}=c_{2}$ と同値である。
:::

::: intuition
第 I 部門の労働者と資本家は消費財を買い、第 II 部門は生産手段を買う。部門の間で交換される価値が等しいことが、両方の市場が釣り合う条件である。一方の市場が釣り合えば、もう一方も自動的に釣り合う（ワルラス法則と同じ構造）。
:::

::: proof
**Step 1（生産手段）.** $c_{1}+v_{1}+s_{1}=c_{1}+c_{2}$ から $c_{1}$ を消すと $v_{1}+s_{1}=c_{2}$。

**Step 2（消費財）.** $c_{2}+v_{2}+s_{2}=v_{1}+s_{1}+v_{2}+s_{2}$ から $v_{2}+s_{2}$ を消すと同じ式。
:::

## 価値と生産価格 {#econ:sec-mx-prices}

::: definition 搾取率と生産価格 {#econ:exploitation-and-production-prices keywords="real wage bundle b >= 0 per unit of labor; value of labor power lambda b; rate of exploitation e = (1 - lambda b)/(lambda b); augmented input matrix M = A + b a_0; prices of production p >> 0 with uniform profit rate pi: p = (1 + pi) p M, i.e. p = (1 + pi)(p A + w a_0) with w = p b" index="搾取率|さくしゅりつ, 労働力の価値|ろうどうりょくのかち, 生産価格|せいさんかかく, 均等利潤率|きんとうりじゅんりつ, 拡大投入係数行列|かくだいとうにゅうけいすうぎょうれつ" refname="搾取率と生産価格"}
\ref{econ:input-output-model} の経済で、$A$ は生産的、$a_{0}\gg0$ とし、労働者が 1 単位の労働あたりに受け取る消費財の組（**実質賃金**）を列ベクトル $b\ge0$, $b\ne0$ とする。
1. $\lambda b$（実質賃金に含まれる労働）を**労働力の価値**、$e\defeq\dfrac{1-\lambda b}{\lambda b}$ を**搾取率**という。
2. $M\defeq A+ba_{0}$ を**拡大投入係数行列**という（第 $j$ 列は、財 $j$ を 1 単位作るのに必要な原材料と、労働者の消費財の合計）。
3. 価格 $p\gg0$（行ベクトル）と $\pi>-1$ が $p=(1+\pi)pM$ をみたすとき、$p$ を**生産価格**、$\pi$ を**均等利潤率**という。これは、賃金 $w\defeq pb$ のもとで $p=(1+\pi)(pA+wa_{0})$（価格は費用に一律の利潤率を上乗せしたもの）と同じである。
:::

::: intuition
労働者は 1 時間働いて、$\lambda b$ 時間分の労働を含む消費財を受け取る。$\lambda b<1$ なら、差の $1-\lambda b$ 時間は資本家のために働いていることになり、その比が搾取率である。生産価格は、どの産業でも資本（原材料と賃金の前払い）に対する利潤の率が同じになる価格で、資本が利潤率の高い産業に移動する競争の結果として想定される。
:::

::: lemma 正の行列の固有ベクトル {#econ:positive-eigenvector keywords="for M >> 0 there are a row vector p >> 0, a column vector x >> 0 and rho > 0 with p M = rho p and M x = rho x (via Brouwer on the simplex); comparison: if q >= 0, q != 0 and q M <= sigma q then rho <= sigma, with strict inequality if q M != sigma q; similarly q M >= sigma q implies rho >= sigma, strictly if q M != sigma q" index="ペロン–フロベニウスの定理（正の行列）|ぺろんふろべにうすのていり, 正の固有ベクトル|せいのこゆうべくとる" refname="正の行列の固有ベクトル"}
$M$ を $n$ 次の正方行列で $M\gg0$ とする。
1. 行ベクトル $p\gg0$、列ベクトル $x\gg0$、$\rho>0$ で $pM=\rho p$ かつ $Mx=\rho x$ となるものがある（$\rho$ は左右で共通）。この $\rho$ を $\rho(M)$ と書く。
2. 行ベクトル $q\ge0$, $q\ne0$ と $\sigma\in\mathbb{R}$ について、$qM\le\sigma q$ なら $\rho(M)\le\sigma$ で、さらに $qM\ne\sigma q$ なら $\rho(M)<\sigma$。$qM\ge\sigma q$ なら $\rho(M)\ge\sigma$ で、さらに $qM\ne\sigma q$ なら $\rho(M)>\sigma$。
3. 特に、1 の $\rho$ は $p$ や $x$ の選び方によらない。
:::

::: intuition
正の行列を何度も掛けると、どのベクトルも一つの「正の方向」に向かう。その方向が正の固有ベクトルで、固有値 $\rho$ はその方向への伸び率である。非負のベクトル $q$ が「$M$ を掛けると $\sigma$ 倍以下に縮む」なら、正の固有ベクトルとの内積で測ると、伸び率 $\rho$ も $\sigma$ 以下でなければならない。
:::

::: proof
**Step 1（左固有ベクトル）.** 【主張：$pM=\rho p$ となる $p\gg0$, $\rho>0$ がある】$f(p)\defeq\dfrac{pM}{pMe}$ を $\Delta$ 上で定める。$p\in\Delta$ なら $p\ge0$, $p\ne0$ で $M\gg0$ なので $pM\gg0$、分母は正。$f$ は連続で $f(p)\in\Delta$。\ref{econ:convex-body-ball} から不動点 $p=f(p)$ があり、$\rho\defeq pMe>0$ とすると $pM=\rho p$。$p=pM/\rho\gg0$。

**Step 2（右固有ベクトル）.** $M^{\top}\gg0$ に Step 1 を適用して、$x\gg0$, $\rho'>0$ で $Mx=\rho'x$。

**Step 3（2）.** $q\ge0$, $q\ne0$ と $x\gg0$ から $qx>0$。$qM\le\sigma q$ の右から $x$ を掛けると $\rho'qx=qMx\le\sigma qx$、よって $\rho'\le\sigma$。$qM\ne\sigma q$ なら $\sigma q-qM\ge0$ は $0$ でないので、$x\gg0$ との積は正で、$\rho'<\sigma$。逆向きの不等式も同様。

**Step 4（$\rho=\rho'$ と 3）.** Step 3 を $q=p$, $\sigma=\rho$（$pM=\rho p$ なので両向きの不等式が成り立つ）に適用して $\rho'\le\rho$ かつ $\rho'\ge\rho$。別の $(\tilde p,\tilde\rho)$ を選んでも同じ議論で $\tilde\rho=\rho'$。
:::

::: theorem 生産価格と賃金–利潤のトレードオフ {#econ:production-prices-existence keywords="if M >> 0, prices of production exist, unique up to scale, with 1 + pi = 1/rho(M); a higher real wage b' >= b, b' != b lowers the uniform profit rate" index="賃金–利潤曲線|ちんぎんりじゅんきょくせん" refname="生産価格と賃金–利潤のトレードオフ"}
\ref{econ:exploitation-and-production-prices} の設定で $M\gg0$ とする。
1. 生産価格と均等利潤率が存在し、$1+\pi=1/\rho(M)$。生産価格は定数倍を除いて一意である。
2. 実質賃金を $b'\ge b$, $b'\ne b$ に上げ、$M'\defeq A+b'a_{0}\gg0$ とすると、新しい均等利潤率 $\pi'$ は $\pi'<\pi$。
:::

::: intuition
生産価格の式 $pM=\frac1{1+\pi}p$ は、価格が $M$ の左固有ベクトルで、利潤率が固有値から決まることを意味する。実質賃金を上げると、費用の行列 $M$ が大きくなり、固有値（費用の伸び率）が上がって、利潤率は下がる。賃金と利潤は、生産物を分け合う関係にある。
:::

::: proof
**Step 1（存在）.** \ref{econ:positive-eigenvector} の $p\gg0$, $\rho=\rho(M)$ について、$\pi\defeq1/\rho-1>-1$ とすれば $p=(1+\pi)pM$。

**Step 2（一意性）.** 【主張：$\tilde p\gg0$, $\tilde\pi>-1$ が $\tilde p=(1+\tilde\pi)\tilde pM$ をみたすなら、$\tilde\pi=\pi$ で $\tilde p$ は $p$ の定数倍】$\tilde pM=\frac1{1+\tilde\pi}\tilde p$ なので、\ref{econ:positive-eigenvector} の 3 から $\frac1{1+\tilde\pi}=\rho$。$t\defeq\min_{i}\tilde p_{i}/p_{i}>0$ とし、$q\defeq\tilde p-tp\ge0$ とすると $qM=\rho q$ で、$q$ のある成分は $0$。$q\ne0$ なら、$q\ge0$ と $M\gg0$ から $qM\gg0$ なので $q=qM/\rho\gg0$ となり、成分が $0$ であることに反する。よって $q=0$、$\tilde p=tp$。

**Step 3（2）.** $p$ を $M$ の生産価格とすると、$pM'=pM+(p(b'-b))a_{0}$。$p\gg0$ と $b'-b\ge0$, $\ne0$ から $p(b'-b)>0$、$a_{0}\gg0$ なので $pM'\gg pM=\rho p$。\ref{econ:positive-eigenvector} の 2 を $M'$ と $q=p$ に適用して $\rho(M')>\rho$、すなわち $1+\pi'=1/\rho(M')<1/\rho=1+\pi$。
:::

## 二つの定理 {#econ:sec-mx-theorems}

::: theorem マルクスの基本定理 {#econ:fundamental-marxian-theorem keywords="with A productive, a_0 >> 0 and M >> 0, the uniform profit rate is positive iff the rate of exploitation is positive: pi > 0 iff lambda b < 1; proof via lambda M = lambda - (1 - lambda b) a_0" index="マルクスの基本定理|まるくすのきほんていり, 森嶋の定理|もりしまのていり, 搾取|さくしゅ" refname="マルクスの基本定理"}
\ref{econ:exploitation-and-production-prices} の設定で $M\gg0$ とすると、$\pi>0\iff e>0\iff\lambda b<1$。さらに $\pi=0\iff\lambda b=1$。
:::

::: intuition
体化労働 $\lambda$ で測ると、拡大投入係数行列 $M$ を掛けることは「財を作るのに必要な原材料と労働者の消費財の労働」を数えることで、その合計は財に含まれる労働から、剰余の労働 $(1-\lambda b)a_{0}$ を引いたものになる。剰余の労働が正なら、費用は生産物より小さく、生産価格で測っても利潤が出る。
:::

::: proof
**Step 1（労働で測った費用）.** 【主張：$\lambda M=\lambda-(1-\lambda b)a_{0}$】\ref{econ:embodied-labor} から $\lambda A=\lambda-a_{0}$。よって $\lambda M=\lambda A+(\lambda b)a_{0}=\lambda-a_{0}+(\lambda b)a_{0}$。

**Step 2（$\lambda b<1$ ⇒ $\pi>0$）.** $\lambda\gg0$（\ref{econ:embodied-labor}）で、$(1-\lambda b)a_{0}\gg0$ なので $\lambda M\le\lambda$ かつ $\lambda M\ne\lambda$。\ref{econ:positive-eigenvector} の 2 から $\rho(M)<1$、すなわち $\pi>0$。

**Step 3（$\lambda b\ge1$ ⇒ $\pi\le0$）.** $\lambda M\ge\lambda$ なので $\rho(M)\ge1$、$\pi\le0$。$\lambda b>1$ なら $\lambda M\ne\lambda$ で $\rho(M)>1$, $\pi<0$。$\lambda b=1$ なら $\lambda M=\lambda$ で $\rho(M)=1$（両向きの比較）、$\pi=0$。

**Step 4（まとめ）.** Step 2・3 から $\pi>0\iff\lambda b<1$、$\pi=0\iff\lambda b=1$。$e>0\iff\lambda b<1$ は定義から（$\lambda b>0$ は $\lambda\gg0$, $b\ge0$, $b\ne0$ から）。
:::

::: theorem 置塩の定理 {#econ:okishio-theorem keywords="with the real wage b fixed, if capitalists adopt a new technique (A', a_0') that is cost-reducing at the current prices of production, p M' <= p M with p M' != p M, M' = A' + b a_0' >> 0, then the new uniform profit rate is strictly higher: technical change alone does not lower the rate of profit" index="置塩の定理|おきしおのていり, 利潤率の傾向的低下|りじゅんりつのけいこうてきていか, 技術変化|ぎじゅつへんか" refname="置塩の定理"}
\ref{econ:exploitation-and-production-prices} の設定で $M\gg0$、$p$ を生産価格、$\pi$ を均等利潤率とする。新しい技術 $(A',a'_{0})$ が、実質賃金 $b$ を一定として $M'\defeq A'+ba'_{0}\gg0$ をみたし、**現在の価格で費用を下げる**、すなわち $pM'\le pM$ かつ $pM'\ne pM$（ある財の 1 単位の費用 $pA'_{j}+(pb)a'_{0j}$ が下がり、他は上がらない）とする。このとき新しい均等利潤率 $\pi'$ は $\pi'>\pi$。
:::

::: intuition
資本家は、今の価格で費用が下がる技術だけを採用する。費用が下がるとは、価格で測った $M$ が小さくなることで、固有値（費用の伸び率）が下がり、均等利潤率は上がる。マルクスは、機械化（不変資本の増加）が利潤率を下げると論じたが、実質賃金が一定である限り、資本家が自ら選ぶ技術変化は利潤率を上げる。利潤率が下がりうるのは、実質賃金が上がる場合（\ref{econ:production-prices-existence} の 2）である。
:::

::: proof
**Step 1（比較）.** 仮定から $pM'\le pM=\rho(M)p$ かつ $pM'\ne\rho(M)p$。$p\gg0$ なので \ref{econ:positive-eigenvector} の 2 を $M'$, $q=p$, $\sigma=\rho(M)$ に適用して $\rho(M')<\rho(M)$。

**Step 2（利潤率）.** \ref{econ:production-prices-existence} の 1 から $1+\pi'=1/\rho(M')>1/\rho(M)=1+\pi$。
:::

::: hypcheck
- **$M\gg0$**：正の固有ベクトルの存在（Step 1 の分母が正であること）と、生産価格の一意性（Step 2）に使った。$M\ge0$ が既約であれば同様の結論が成り立つ（ペロン–フロベニウスの定理、ここでは証明しない）。
- **$a_{0}\gg0$**：基本定理の Step 2（$\lambda M\ne\lambda$）と、賃金–利潤のトレードオフ（$pM'\gg pM$）に使った。
- **$A$ が生産的**：$\lambda$ が存在して正であること（\ref{econ:embodied-labor}）にだけ使った。
- **実質賃金 $b$ が一定（置塩の定理）**：これが定理の本質的な前提で、技術変化とともに実質賃金が上がれば、利潤率は下がりうる。
- **費用を下げる技術の採用**：資本家の合理的な選択の仮定。現在の価格での費用の低下を使い、新しい価格での費用は使わない。
- **固定資本がない（流動資本だけのモデル）**：すべての投入は 1 期で使い尽くされると仮定した。固定資本や結合生産を入れると、議論は複雑になる（補足）。
:::

## 問題 {#econ:sec-mx-problems}

::: problem {#econ:prob-mx-one-good}
1 財の経済（$n=1$）で $A=a\in(0,1)$, $a_{0}=\ell>0$, $b>0$ とする。体化労働・搾取率・均等利潤率を求め、マルクスの基本定理を確かめよ。
:::

::: solution
$\lambda=\frac\ell{1-a}$、$\lambda b=\frac{\ell b}{1-a}$、$e=\frac{1-a-\ell b}{\ell b}$。$M=a+b\ell$、$1+\pi=\frac1{a+b\ell}$。$\pi>0\iff a+b\ell<1\iff\frac{\ell b}{1-a}<1\iff e>0$。
:::

::: problem {#econ:prob-mx-okishio-one-good}
前問で、新しい技術 $(a',\ell')$ が $a'+b\ell'<a+b\ell$（現在の価格での費用の低下：1 財なので価格は打ち消し合う）をみたすとき、利潤率と搾取率がどう変わるかを答えよ。
:::

::: solution
$1+\pi'=\frac1{a'+b\ell'}>1+\pi$ で利潤率は上がる。前問の同値から、元の経済で $e>0$（$a+b\ell<1$）なら $a'+b\ell'<1$ で $e'>0$ のまま。しかし搾取率 $e=\frac{1-a}{\ell b}-1$ が上がるとは限らない。例えば $b=1$, $(a,\ell)=(0.5,0.2)$ から $(a',\ell')=(0.1,0.5)$ に変えると、$a+b\ell=0.7>0.6=a'+b\ell'$ で利潤率は上がるが、搾取率は $1.5$ から $0.8$ に下がる。利潤率と搾取率は同じ符号をもつ（基本定理）が、大小の動きは連動しない。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 置塩の定理は体化労働を使わず、価格の議論だけで完結する。基本定理は生産価格の一意性を使わない。

**前提を変えると（ここでは証明しない）.**
- **結合生産と固定資本**：一つの過程が複数の財を生む場合（固定資本を「1 年古くなった機械」という別の財として扱う方法を含む）、体化労働が負になりうる、正の利潤と負の剰余価値が両立しうる、などの反例が知られている（Steedman『Marx after Sraffa』(1977)）。森嶋は、労働価値の定義を最適化問題で置き換えることで、基本定理をこの場合に拡張した（Morishima『Marx's Economics』(1973) の流れ）。
- **実質賃金の内生化**：技術変化とともに実質賃金が上がる（例えば労働市場の需給による）なら、利潤率は下がりうる。利潤率が実際に長期的に低下してきたかは実証の問題で、測り方（固定資本の評価、利潤の定義）によって結論が分かれ、合意はない。
- **転形問題**：剰余価値の総額と利潤の総額、価値の総額と価格の総額を同時に等しくできるか（マルクスの「転形」）は、一般には両立しない。どちらの等式を正規化として選ぶかで結論が変わり、長い論争がある。

**出典.** 置塩の定理は Okishio, "Technical Changes and the Rate of Profit" (1961)、マルクスの基本定理の名は Morishima『Marx's Economics』(Cambridge Univ. Press, 1973) による（置塩も同じ趣旨の結果を先に示している）。ここでの証明は正の行列の場合に限ったもので、標準的な扱い（Roemer『Analytical Foundations of Marxian Economic Theory』(1981) など）に沿う。

**この定理から言えること・言えないこと.** 証明できるのは「実質賃金一定・流動資本だけのモデルでは、費用を下げる技術変化は利潤率を上げる」ことである。これは「資本主義は自壊しない」ことの証明ではなく、自壊の議論が成り立つためには、実質賃金の上昇・固定資本・需要の不足（ケインズ的な問題、\ref{econ:page-keynesian}）など、別の機構が必要であることを示している。体制の内生的な変容の機構は \ref[体制の内生的な変容]{econ:page-endogenous-change}（予定）で扱う。

**高い視点から：固有値としての分配.** 生産価格と利潤率は、拡大投入係数行列の正の固有ベクトルと固有値である。費用が下がることは行列が「小さく」なること、賃金が上がることは行列が「大きく」なることで、正の行列の固有値はこの順序について単調である（比較の補題）。分配をめぐる対立は、固有値の大小として一次元に圧縮される。比喩で言えば、経済は毎期同じ形で拡大または縮小する機械で、その拡大の速さ（$1/\rho$）を、資本家（利潤）と労働者（実質賃金）が引っ張り合っている。置塩の定理は、機械の効率が上がれば、労働者の取り分を一定に保つ限り、余った分はすべて資本家の側に流れることを述べている。
:::
