# 消費者の理論 {#econ:page-consumer keywords="budget set, utility maximization problem, existence of demand by compactness, Walras' law under local nonsatiation, homogeneity of degree zero, uniqueness under strict quasi-concavity, Cobb-Douglas demand, expenditure minimization, duality between utility maximization and expenditure minimization, Hicksian demand, concavity of the expenditure function, Shephard's lemma, Slutsky equation, substitution and income effects, negative semidefinite substitution matrix, Giffen goods"}

消費者は、価格と所得が与えられたとき、買える範囲の中で最も好ましい消費の組を選ぶ。このページでは、その最適な選択（**需要**）が存在するための条件、所得をすべて使い切ること（**ワルラス法則**）、そして価格が変わったときの需要の変化が「代わりのものに乗り換える効果」（**代替効果**）と「実質的に豊かになった・貧しくなった効果」（**所得効果**）に分かれること（**スルツキー方程式**）を証明する。後者は「支出を最小にする問題」との双対性から導かれ、代替効果が常に価格と逆向きに働くことも分かる。

## 記法と定義の確認 {#econ:sec-cs-notation}

::: notation
- 選好・効用関数・連続性・凸性と準凹性は \ref{econ:preference-relation}, \ref{econ:utility-function}, \ref{econ:continuous-monotone-preference}, \ref{econ:convex-quasiconcave}。
- 価格 $p\in\mathbb{R}^{n}$ は $p\gg0$、所得 $w>0$、$p\cdot x\defeq\sum p_{i}x_{i}$。コンパクト集合上の連続関数の最大値の存在は \ref{top:extreme-value}。
- 体系は $\ZFC$。
:::

## 効用最大化と需要 {#econ:sec-cs-demand}

::: definition 予算集合と需要 {#econ:budget-demand keywords="budget set B(p, w) = {x in R^n_+ : p . x <= w}; utility maximization problem; Walrasian (Marshallian) demand x(p, w) = set of maximizers; indirect utility v(p, w); locally nonsatiated preferences" index="予算集合|よさんしゅうごう, 需要関数|じゅようかんすう, 間接効用関数|かんせつこうようかんすう, 局所非飽和|きょくしょひほうわ" refname="予算集合と需要"}
1. $B(p,w)\defeq\{x\in\mathbb{R}_{+}^{n}:p\cdot x\le w\}$ を**予算集合**という。
2. 効用関数 $u$ について、$B(p,w)$ の上で $u$ を最大にする $x$ の集合を $x(p,w)$（**需要**）、最大値を $v(p,w)$（**間接効用関数**）とする。
3. 任意の $x$ と $\varepsilon>0$ について $\abs{y-x}<\varepsilon$ かつ $u(y)>u(x)$ となる $y\in\mathbb{R}_{+}^{n}$ があるとき、$u$ は**局所非飽和**であるという。
:::

::: intuition
予算集合は「買えるものの全体」、需要はその中で最も好ましいものである。局所非飽和は「どんな近くにも、もっと好ましいものがある」ことで、満腹で何も欲しくない状態が存在しないことを意味する。
:::

::: proposition 需要の基本性質 {#econ:demand-properties keywords="if u is continuous, x(p, w) is nonempty; demand is homogeneous of degree zero in (p, w); under local nonsatiation every x in x(p, w) satisfies p . x = w (Walras' law); if u is strictly quasi-concave, x(p, w) is a single point" index="ワルラス法則（消費者）|わるらすほうそく, 需要の 0 次同次性|じゅようのぜろじどうじせい" refname="需要の基本性質"}
$u$ を連続とする。
1. $x(p,w)\ne\emptyset$。
2. $\alpha>0$ について $x(\alpha p,\alpha w)=x(p,w)$（0 次同次性）。
3. $u$ が局所非飽和なら、すべての $x\in x(p,w)$ で $p\cdot x=w$（**ワルラス法則**）。
4. $u$ が狭義準凹（$x\ne y$, $0<\lambda<1$ で $u(\lambda x+(1-\lambda)y)>\min(u(x),u(y))$）なら、$x(p,w)$ は 1 点。
:::

::: proof
**Step 1（1）.** 【主張：$B(p,w)$ はコンパクト】閉集合の共通部分なので閉。$x\in B$ なら $0\le x_{i}\le w/p_{i}$ なので有界。\ref{top:extreme-value} から $u$ は最大値をとる。

**Step 2（2）.** $B(\alpha p,\alpha w)=B(p,w)$。

**Step 3（3）.** $x\in x(p,w)$ で $p\cdot x<w$ なら、$\varepsilon>0$ を $\abs{y-x}<\varepsilon$ の $y$ が $p\cdot y<w$ をみたすようにとれる（$p\cdot y\le p\cdot x+\abs p\varepsilon$）。局所非飽和からそのような $y\in\mathbb{R}_{+}^{n}$ で $u(y)>u(x)$ となるものがあり、最大性に反する。

**Step 4（4）.** $x\ne y$ がともに最大点なら、凸集合 $B$ の点 $\frac12(x+y)$ で $u>\min(u(x),u(y))=v$ となり矛盾。
:::

::: example コブ–ダグラス型の需要 {#econ:cobb-douglas-demand keywords="for u = sum a_i log x_i with a_i > 0, sum a_i = 1, the demand is x_i = a_i w / p_i: expenditure shares are constant" index="コブ–ダグラス型効用|こぶだぐらすがたこうよう" refname="コブ–ダグラス型の需要"}
$u(x)=\sum_{i}a_{i}\log x_{i}$（$a_{i}>0$, $\sum a_{i}=1$、$x\gg0$ の外では $-\infty$）の需要は $x_{i}=\frac{a_{i}w}{p_{i}}$。実際、$p\cdot x=w$ の $x\gg0$ について $s_{i}\defeq p_{i}x_{i}/w$（$\sum s_{i}=1$）とおくと $u(x)=\sum a_{i}\log s_{i}+\sum a_{i}\log\frac{w}{p_{i}}$。第 1 項は相対エントロピーの非負性（$\sum a_{i}\log\frac{a_{i}}{s_{i}}\ge0$、等号は $s=a$）から $s=a$ でだけ最大。予算の $a_{i}$ の割合を財 $i$ に使うので、支出の割合は価格によらない。
:::

## 支出最小化と双対性 {#econ:sec-cs-duality}

::: definition 支出関数とヒックスの需要 {#econ:expenditure-function keywords="expenditure minimization: e(p, u) = min{p . x : u(x) >= u}; Hicksian (compensated) demand h(p, u) = set of minimizers" index="支出関数|ししゅつかんすう, ヒックスの需要|ひっくすのじゅよう, 補償需要|ほしょうじゅよう" refname="支出関数とヒックスの需要"}
効用の水準 $\bar u$（$u(x)\ge\bar u$ となる $x\in\mathbb{R}_{+}^{n}$ があるもの）について、$e(p,\bar u)\defeq\inf\{p\cdot x:x\in\mathbb{R}_{+}^{n},\ u(x)\ge\bar u\}$ を**支出関数**、下限を達成する $x$ の集合を $h(p,\bar u)$（**ヒックスの需要**、補償需要）という。
:::

::: intuition
支出最小化は効用最大化の「裏返し」である。「この満足を得るのに最低いくら必要か」を問う。価格が変わったとき、満足の水準を保つように所得を補償した場合の需要の変化が、純粋な代替効果である。
:::

::: proposition 効用最大化と支出最小化の双対性 {#econ:duality-ump-emp keywords="for continuous locally nonsatiated u: if x* solves the UMP at (p, w) then x* solves the EMP at (p, v(p, w)) and e(p, v(p, w)) = w; the infimum in e is attained; e(p, u) is concave in p" index="双対性（消費者）|そうついせい" refname="効用最大化と支出最小化の双対性"}
$u$ を連続で局所非飽和とする。
1. $e(p,\bar u)$ の下限は達成される。
2. $x^{*}\in x(p,w)$ なら $x^{*}\in h(p,v(p,w))$ で、$e(p,v(p,w))=w$。
3. $p\mapsto e(p,\bar u)$ は凹。
:::

::: proof
**Step 1（1）.** $u(x_{0})\ge\bar u$ となる $x_{0}$ をとると、下限は集合 $\{x\ge0:u(x)\ge\bar u,\ p\cdot x\le p\cdot x_{0}\}$ の上でとればよく、これはコンパクト（閉で有界）。連続関数 $p\cdot x$ は最小値をとる。

**Step 2（2）.** $u(x^{*})=v(p,w)$ なので $x^{*}$ は支出最小化の許容点で、$e\le p\cdot x^{*}=w$（ワルラス法則）。もし $u(y)\ge v(p,w)$ で $p\cdot y<w$ なる $y$ があれば、局所非飽和から $y$ の近くに $p\cdot z<w$, $u(z)>u(y)\ge v(p,w)$ となる $z$ があり、$v$ の最大性に反する。よって $e=w$ で、$x^{*}$ は最小点。

**Step 3（3）.** $e(\cdot,\bar u)$ は線形関数 $p\mapsto p\cdot x$（$u(x)\ge\bar u$）の下限で、線形関数の下限は凹。
:::

::: theorem シェパードの補題とスルツキー方程式 {#econ:slutsky-equation keywords="Shephard's lemma: if h(p, u) is a single point and e is differentiable in p then grad_p e = h; Slutsky equation dx_i/dp_j = dh_i/dp_j - x_j dx_i/dw; the substitution matrix is symmetric negative semidefinite; compensated own-price effect <= 0" index="スルツキー方程式|するつきーほうていしき, シェパードの補題|しぇぱーどのほだい, 代替効果|だいたいこうか, 所得効果|しょとくこうか" refname="シェパードの補題とスルツキー方程式"}
$u$ を連続で局所非飽和とし、需要 $x(p,w)$ とヒックスの需要 $h(p,\bar u)$ が 1 点からなり、点 $(p,w)$ の近くで $x$ は微分可能、$\bar u\defeq v(p,w)$ のまわりで $e$ は $C^{2}$ 級、$h$ は微分可能とする。このとき
1. （**シェパードの補題**）$\frac{\partial e}{\partial p_{j}}(p,\bar u)=h_{j}(p,\bar u)$。
2. （**スルツキー方程式**）$\dfrac{\partial x_{i}}{\partial p_{j}}(p,w)=\dfrac{\partial h_{i}}{\partial p_{j}}(p,\bar u)-x_{j}(p,w)\dfrac{\partial x_{i}}{\partial w}(p,w)$。
3. 代替行列 $S_{ij}\defeq\frac{\partial h_{i}}{\partial p_{j}}$ は対称で半負定値。特に $\frac{\partial h_{i}}{\partial p_{i}}\le0$。
:::

::: intuition
価格 $p_{j}$ の上昇は 2 つの効果をもつ。財 $j$ が相対的に高くなったので他の財に乗り換える効果（代替効果、補償需要の変化）と、同じ所得で買えるものが減って実質的に貧しくなる効果（所得効果、$x_{j}$ だけ所得が減ったのと同じ）である。代替効果は必ず価格と逆向きに働くが、所得効果は財の性質（上級財か劣等財か）によってどちらにも働く。
:::

::: proof
**Step 1（1）.** 【主張：$g(q)\defeq q\cdot h(p,\bar u)-e(q,\bar u)$ は $q=p$ で最小値 $0$ をとる】$h(p,\bar u)$ は効用 $\bar u$ を達成するので $e(q,\bar u)\le q\cdot h(p,\bar u)$、すなわち $g\ge0$、$q=p$ で等号。$g$ は $p$ で微分可能なので、最小点で勾配は $0$：$h_{j}(p,\bar u)-\partial_{j}e(p,\bar u)=0$。

**Step 2（2）.** 【主張：$h_{i}(q,\bar u)=x_{i}(q,e(q,\bar u))$（$q$ は $p$ の近く）】\ref{econ:duality-ump-emp} の 2 の逆向き：$y\in h(q,\bar u)$ なら $q\cdot y=e(q,\bar u)$ で、所得 $e(q,\bar u)$ のもとで $u(y)\ge\bar u$。所得 $e(q,\bar u)$ で $u(z)>\bar u$ となる $z$ があれば、連続性から $z$ を少し縮めた $(1-\delta)z$ も $u>\bar u$ で、支出が $e$ より小さく矛盾（$e>0$ のとき。$e=0$ なら $h=0$ で両辺 $0$）。よって $y$ は効用最大化の解で、一意性から $y=x(q,e(q,\bar u))$。この恒等式を $q_{j}$ で微分し（連鎖律）、$q=p$ で $e(p,\bar u)=w$ と 1 を使うと $\frac{\partial h_{i}}{\partial p_{j}}=\frac{\partial x_{i}}{\partial p_{j}}+\frac{\partial x_{i}}{\partial w}h_{j}$、$h_{j}(p,\bar u)=x_{j}(p,w)$。

**Step 3（3）.** 1 から $S_{ij}=\frac{\partial^{2}e}{\partial p_{i}\partial p_{j}}$ で、$C^{2}$ 級なので対称。$e$ は凹（\ref{econ:duality-ump-emp} の 3）なので、ヘッセ行列は半負定値（凹関数を直線に制限した 2 階微分は $\le0$）。対角成分は $\le0$。
:::

::: hypcheck
- **局所非飽和**：ワルラス法則（\ref{econ:demand-properties} の 3）と双対性（\ref{econ:duality-ump-emp} の 2）に使った。飽和点があると、所得を使い切らないことが合理的になりうる。
- **微分可能性と一意性**：シェパードの補題とスルツキー方程式は、需要が 1 点で微分可能という仮定のもとで示した。凸でない選好では需要が飛ぶことがある。
- **ギッフェン財**：スルツキー方程式は、劣等財（$\frac{\partial x_{i}}{\partial w}<0$）で所得効果が代替効果より大きければ、価格の上昇で需要が増える（$\frac{\partial x_{i}}{\partial p_{i}}>0$）ことを許す。補償需要についてはそれは起こらない（3）。
:::

## 問題 {#econ:sec-cs-problems}

::: problem {#econ:prob-cs-cobb-douglas-slutsky}
2 財のコブ–ダグラス型 $x_{1}=\frac{aw}{p_{1}}$ について、スルツキー方程式の各項（$\frac{\partial x_{1}}{\partial p_{1}}$、所得効果 $-x_{1}\frac{\partial x_{1}}{\partial w}$、代替効果）を求めよ。
:::

::: solution
$\frac{\partial x_{1}}{\partial p_{1}}=-\frac{aw}{p_{1}^{2}}$、所得効果 $-x_{1}\cdot\frac a{p_{1}}=-\frac{a^{2}w}{p_{1}^{2}}$、代替効果はその差 $-\frac{a(1-a)w}{p_{1}^{2}}\le0$。
:::

::: problem {#econ:prob-cs-walras-sum}
ワルラス法則から、所得の変化に対する需要の変化が $\sum_{i}p_{i}\frac{\partial x_{i}}{\partial w}=1$ をみたすことを示せ。
:::

::: solution
$p\cdot x(p,w)=w$ を $w$ で微分する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 需要の存在には凸性を使っていない（一意性にだけ使った）。議論は Mas-Colell–Whinston–Green『Microeconomic Theory』第 2・3 章の流れに沿う。

**前提を変えると.**
- **顕示選好**：効用関数を仮定せず、観測された選択が一貫している条件（顕示選好の強公理）から、効用最大化と矛盾しない選択を特徴づけられる（アフリアットの定理。ここでは証明しない）。
- **ロワの恒等式**：$x_{i}=-\frac{\partial v/\partial p_{i}}{\partial v/\partial w}$。間接効用関数から需要が求まり、計量分析で使われる。
- **代表的消費者の問題**：個人のスルツキー方程式は集計した需要には一般に引き継がれない（ソンネンシャイン–マンテル–ドブリューの定理：集計した超過需要はワルラス法則と同次性以外に構造をほとんどもたない）。

**高い視点から：凸双対性.** 支出関数は、効用の上方集合（凸集合）の「支持関数」で、価格は双対空間のベクトルである。シェパードの補題は「支持関数の勾配は接点を与える」という凸解析の事実で、スルツキー方程式はその双対性を効用最大化の言葉に翻訳したものである。比喩で言えば、消費者は「満足の山」を予算の柵の中で登る登山者で、価格が変わると柵が傾き、山の形に沿って横に滑る動き（代替効果）と、柵全体が近づいたり遠ざかったりする動き（所得効果）が重なる。
:::
