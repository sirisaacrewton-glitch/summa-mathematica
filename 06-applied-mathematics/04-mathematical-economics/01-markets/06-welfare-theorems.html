# 厚生経済学の基本定理 {#econ:page-welfare-theorems keywords="Pareto efficiency, first fundamental theorem of welfare economics under local nonsatiation, second fundamental theorem via the separating hyperplane theorem, equilibrium with lump-sum transfers, separation of efficiency and distribution, contract curve in the Edgeworth box, limits: externalities, public goods, market power, information, and the informational problem of lump-sum transfers"}

市場の均衡は社会にとって「良い」結果なのか。**厚生経済学の第一基本定理**は、競争的な均衡の配分が、誰かを悪くせずに誰かを良くすることのできない状態（**パレート効率的**）であることを示す。**第二基本定理**は逆に、凸性の仮定のもとで、どのパレート効率的な配分も、初期保有を適当に再分配したうえで市場に任せれば均衡として実現できることを示す。2 つ合わせると、「効率」は市場に、「分配（公平）」は再分配に任せられる、という分業の論理が得られる。ただし、どちらの定理も強い前提の上に立っており、その前提が崩れる場所が、市場の失敗と政府の役割の理論の出発点になる。

## 記法と定義の確認 {#econ:sec-wt-notation}

::: notation
- 交換経済・ワルラス均衡・需要・局所非飽和は \ref{econ:walrasian-equilibrium}, \ref{econ:budget-demand}。凸な選好と準凹性は \ref{econ:convex-quasiconcave}。
- ノルム空間の分離定理（交わらない凸集合の一方が開なら連続線形汎関数で分離できる）は \ref{fa:separation}（ここでは $\mathbb{R}^{n}$ に使う）。
- $e\defeq(1,\dots,1)$、$\Omega\defeq\sum_{i}\omega^{i}$。体系は $\ZFC$。
:::

## パレート効率性と第一基本定理 {#econ:sec-wt-first}

::: definition パレート効率性 {#econ:pareto-efficiency keywords="a feasible allocation x is Pareto efficient if there is no feasible x' with u^i(x'^i) >= u^i(x^i) for all i and strict inequality for some i" index="パレート効率性|ぱれーとこうりつせい, パレート最適|ぱれーとさいてき" refname="パレート効率性"}
実行可能な配分 $x$ について、実行可能な配分 $x'$ で、すべての $i$ で $u^{i}(x'^{i})\ge u^{i}(x^{i})$、ある $i$ で $u^{i}(x'^{i})>u^{i}(x^{i})$ となるもの（$x$ を**パレート改善**するもの）が存在しないとき、$x$ は**パレート効率的**であるという。
:::

::: intuition
パレート効率性は「無駄がない」ことで、「公平」とは関係がない。1 人が全部を持ち、他の人が何も持たない配分も、持っている人から何かを取ればその人が悪くなるので、パレート効率的である。
:::

::: theorem 厚生経済学の第一基本定理 {#econ:first-welfare-theorem keywords="if all utilities are locally nonsatiated, every Walrasian equilibrium allocation is Pareto efficient" index="厚生経済学の第一基本定理|こうせいけいざいがくのだいいちきほんていり, 見えざる手|みえざるて" refname="厚生経済学の第一基本定理"}
すべての $u^{i}$ が局所非飽和なら、ワルラス均衡 $(p,x)$ の配分 $x$ はパレート効率的である。
:::

::: intuition
均衡で各人が選んだものより良いものは、各人にとって「予算では買えなかったもの」、すなわち価格で評価するとより高価なものである。全員がそれ以上に良くなる配分は、価格で評価した総額が経済全体の資源の価値を超えるので、実行できない。価格が全員に共通の物差しになっていることが鍵である。
:::

::: proof
**Step 1（好ましいものは高価）.** 【主張：$u^{i}(y)>u^{i}(x^{i})$ なら $p\cdot y>p\cdot\omega^{i}$、$u^{i}(y)\ge u^{i}(x^{i})$ なら $p\cdot y\ge p\cdot\omega^{i}$】前者は $x^{i}$ が予算集合での最大点であることから（$p\cdot y\le p\cdot\omega^{i}$ なら $y$ は買えたはず）。後者：$p\cdot y<p\cdot\omega^{i}$ なら、局所非飽和から $y$ の近くに $p\cdot z<p\cdot\omega^{i}$ かつ $u^{i}(z)>u^{i}(y)\ge u^{i}(x^{i})$ となる $z$ があり、前者に反する。

**Step 2（和をとる）.** $x'$ が $x$ をパレート改善するとすると、Step 1 から $\sum_{i}p\cdot x'^{i}>\sum_{i}p\cdot\omega^{i}=p\cdot\Omega$。一方、実行可能性 $\sum x'^{i}\le\Omega$ と $p\ge0$ から $p\cdot\sum x'^{i}\le p\cdot\Omega$。矛盾。
:::

## 第二基本定理 {#econ:sec-wt-second}

::: theorem 厚生経済学の第二基本定理 {#econ:second-welfare-theorem keywords="in an exchange economy with continuous, quasi-concave, strongly monotone utilities, every Pareto efficient allocation x* with x*^i >> 0 is a Walrasian equilibrium allocation for some price p >= 0, p != 0, after lump-sum redistribution of endowments to omega^i = x*^i; proof by separating the set of jointly preferred aggregates from Omega - R^n_+" index="厚生経済学の第二基本定理|こうせいけいざいがくのだいにきほんていり, 一括移転|いっかついてん" refname="厚生経済学の第二基本定理"}
交換経済で、各 $u^{i}$ は連続・準凹で、**強単調**（$y\ge x$, $y\ne x$ なら $u^{i}(y)>u^{i}(x)$）とする。$x^{*}$ をパレート効率的で $x^{*i}\gg0$（すべての $i$）の配分とし、$\sum_{i}x^{*i}=\Omega$ とする。このとき $p\ge0$, $p\ne0$ があって、各 $i$ で $x^{*i}$ は所得 $p\cdot x^{*i}$ のもとでの最適な消費である。すなわち、初期保有を $\omega^{i}\defeq x^{*i}$ に再分配すれば、$(p,x^{*})$ はワルラス均衡である。
:::

::: intuition
パレート効率的な配分では、全員が今より良くなる消費の組を合計したもの（の集合）と、経済にある資源（の集合）が交わらない。どちらも凸なので、間に超平面を立てられ、その傾きが価格になる。この価格で各人の今の消費を評価した額を所得として与えれば、各人は自分から今の消費を選ぶ。
:::

::: proof
**Step 1（凸集合）.** $U_{i}\defeq\{y\in\mathbb{R}_{+}^{n}:u^{i}(y)>u^{i}(x^{*i})\}$ は準凹性から凸（\ref{econ:convex-quasiconcave} と同じ議論）。$A\defeq\sum_{i}U_{i}+\{v:v\gg0\}$（ミンコフスキー和）とすると、$A$ は凸で開（開集合 $\{v\gg0\}$ を平行移動したものの和）。$B\defeq\{\Omega-w:w\ge0\}$ は凸。

**Step 2（交わらない）.** 【主張：$A\cap B=\emptyset$】$a=\sum y_{i}+v\in B$（$y_{i}\in U_{i}$, $v\gg0$）なら $\sum y_{i}\le\Omega-v\le\Omega$。強単調性から、余り $\Omega-\sum y_{i}\ge0$ を誰かに加えても誰も悪くならないので、実行可能な配分 $(y_{i})$（余りを $1$ 人目に加えたもの）は全員を $x^{*}$ より真に良くする。パレート効率性に反する。

**Step 3（分離）.** \ref{fa:separation} の 1 から、$q\in\mathbb{R}^{n}$ と $c$ で $q\cdot a<c\le q\cdot b$（$a\in A$, $b\in B$）となるものがある。$p\defeq-q$ とおくと $p\cdot a>-c\ge p\cdot b$。$b=\Omega-w$ で $w$ のある成分だけを大きくすると、$p\ge0$ でなければ $p\cdot b$ が上に有界でなくなるので $p\ge0$。$q\ne0$ なので $p\ne0$。

**Step 4（各人の評価）.** 【主張：$u^{i}(y)>u^{i}(x^{*i})$ なら $p\cdot y\ge p\cdot x^{*i}$】強単調性から $x^{*j}+\varepsilon e\in U_{j}$。$y+\sum_{j\ne i}(x^{*j}+\varepsilon e)+\varepsilon e\in A$ と $\Omega\in B$ から $p\cdot y+\sum_{j\ne i}p\cdot x^{*j}+I\varepsilon\,p\cdot e>p\cdot\Omega=\sum_{j}p\cdot x^{*j}$。$\varepsilon\to0$ として主張を得る。

**Step 5（最適性）.** 【主張：$u^{i}(y)>u^{i}(x^{*i})$ なら $p\cdot y>p\cdot x^{*i}$】$p\ge0$, $p\ne0$, $x^{*i}\gg0$ から $p\cdot x^{*i}>0$。$p\cdot y=p\cdot x^{*i}$ なら、連続性から $\delta>0$ を小さくとって $u^{i}((1-\delta)y)>u^{i}(x^{*i})$ で、Step 4 から $(1-\delta)p\cdot y\ge p\cdot x^{*i}=p\cdot y>0$ となり矛盾。よって、所得 $p\cdot x^{*i}$ で買える $y$ はどれも $x^{*i}$ より好ましくなく、$x^{*i}$ は最適。
:::

::: example 契約曲線 {#econ:contract-curve-example}
\ref{econ:edgeworth-cobb-douglas} の 2 人 2 財の経済（総量 $(1,1)$）では、パレート効率的な配分は 2 人の限界代替率が等しいもの：$\frac{a}{1-a}\frac{x_{2}^{1}}{x_{1}^{1}}=\frac b{1-b}\frac{1-x_{2}^{1}}{1-x_{1}^{1}}$（内点の場合）。この曲線（**契約曲線**）の上の任意の点は、第二基本定理から適当な再分配のもとで均衡になる。初期保有 $(1,0),(0,1)$ からの均衡 $x^{1}=(a,b)$ もこの式をみたす：左辺は $\frac a{1-a}\cdot\frac ba=\frac b{1-a}$、右辺は $\frac b{1-b}\cdot\frac{1-b}{1-a}=\frac b{1-a}$。
:::

::: remark
**2 つの定理の読み方と限界.** 第一基本定理は「自由放任の市場はパレート効率的」を、第二基本定理は「再分配さえすれば、どの効率的な配分も市場で実現できる」を述べる。前者は資本主義の擁護に、後者は修正資本主義（市場 ＋ 再分配）の擁護に使われてきた。しかし、どちらも次の前提に依存する（数学的に示せる限界）。

1. **外部性・公共財がない**：各人の効用は自分の消費だけに依存する（Step 1, Step 2 で使用）。
2. **価格受容**：誰も価格を動かせない。
3. **完全な情報と完全な市場**：すべての財に市場があり、全員が品質を知っている。
4. **第二基本定理の一括移転**：再分配は行動によらない「一括」の移転でなければならない。現実の再分配は所得や消費に応じて行うしかなく、それは行動を歪める（\ref[市場の失敗]{econ:page-externalities} と、最適課税の議論）。

また、パレート効率性はどの分配が望ましいかを何も言わない。どの効率的な配分を選ぶかは価値判断（社会厚生関数）の問題である。
:::

::: hypcheck
- **局所非飽和（第一定理）**：Step 1 の後半で使った。
- **凸性（第二定理）**：$U_{i}$ が凸であること（Step 1）に本質的に使った。凸でない選好では、効率的な配分が均衡として支えられないことがある。第一定理は凸性を使わない。
- **強単調性と内点性（第二定理）**：Step 2（余りの配分）、Step 4（$x^{*j}+\varepsilon e\in U_{j}$）、Step 5（$p\cdot x^{*i}>0$）に使った。
:::

## 問題 {#econ:sec-wt-problems}

::: problem {#econ:prob-wt-dictator}
2 人 2 財の経済で、一方が全資源 $(1,1)$ を持つ配分がパレート効率的であることを示せ（強単調な効用）。
:::

::: solution
他方の消費を正にすると、持っている側の消費が減り、強単調性からその人の効用が下がる。誰も悪くせずに他方を良くすることはできない。
:::

::: problem {#econ:prob-wt-externality}
消費者 1 の効用が消費者 2 の財 1 の消費量に依存する（$u^{1}(x^{1},x_{1}^{2})$, $\partial u^{1}/\partial x_{1}^{2}<0$）とき、第一基本定理の証明のどこが崩れるか述べよ。
:::

::: solution
Step 1 で「$u^{1}(y)>u^{1}(x^{1})$ なら $p\cdot y>p\cdot\omega^{1}$」を使ったが、$u^{1}$ は他人の消費にも依存するので、他人の消費を減らすだけで（自分の予算と無関係に）効用を上げられる。均衡は消費者 2 の財 1 の消費が消費者 1 に与える害を考慮しない。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 第一基本定理は凸性も連続性も、均衡の存在すら使わない（均衡があればそれは効率的、という主張）。議論は Mas-Colell–Whinston–Green『Microeconomic Theory』第 16 章の流れに沿う。

**前提を変えると.**
- **生産のある経済**：第二基本定理は、凸な生産集合の経済でも成り立つ（利潤の分配も含めて再分配する）。収穫逓増（固定費用）があると、効率的な配分は価格で支えられないことがある。
- **コア**：経済の参加者のどの部分集団も、自分たちの初期保有だけで全員がより良くなる配分を作れない配分をコアという。均衡の配分はコアに入り、参加者が多くなるとコアは均衡の配分に縮む（ドブリュー–スカーフの極限定理、ここでは証明しない）。
- **不完全な情報**：情報の非対称がある市場では、競争的な均衡は一般に（制約付きの意味でも）効率的でない（グリーンウォルド–スティグリッツ）。

**高い視点から：価格は分離超平面の法線.** 第二基本定理の証明は、凸集合の分離定理そのもので、価格ベクトルは「良くなる消費の集合」と「資源の集合」を分ける超平面の法線である。これは最適化の双対性（ラグランジュ乗数が価格になる）と同じ構造で、市場価格は社会全体の資源制約の「影の価格」と解釈できる。比喩で言えば、価格は全員が共有する 1 枚の定規で、この定規で測って予算内の最善を各人が選べば、全員の選択が資源の限界にぴったり合う。ただしこの定規は、他人への影響や、定規の目盛りを動かせる人の存在を測れない。
:::
