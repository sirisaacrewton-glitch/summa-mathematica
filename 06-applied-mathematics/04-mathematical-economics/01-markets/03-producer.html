# 生産者の理論 {#econ:page-producer keywords="production sets and net output vectors, profit function as a support function, convexity of the profit function, law of supply (p - p').(y - y') >= 0, Hotelling's lemma, constant returns to scale and zero profit, single-output firms, cost function, homogeneity and concavity in input prices, Shephard's lemma for conditional factor demands, supply of a competitive firm p = marginal cost, Cobb-Douglas cost function"}

企業は、技術的に可能な生産計画の中から、利潤を最大にするものを選ぶ。このページでは、生産の技術を**生産集合**として表し、最大の利潤を価格の関数とみた**利潤関数**が凸であること、価格が上がった財の供給は減らないこと（**供給の法則**）、利潤関数の微分が供給を与えること（**ホテリングの補題**）を証明する。また 1 つの生産物を作る企業について、**費用関数**の性質と、競争的な企業の供給が「価格 = 限界費用」で決まることを示す。消費者の理論と同じ双対性の議論が、より簡単な形で現れる。

## 記法と定義の確認 {#econ:sec-pr-notation}

::: notation
- 消費者の理論の双対性（支出関数の凹性、シェパードの補題）は \ref{econ:duality-ump-emp}, \ref{econ:slutsky-equation}。
- 価格 $p\in\mathbb{R}^{n}$、$p\cdot y\defeq\sum p_{i}y_{i}$。体系は $\ZFC$。
:::

## 生産集合と利潤関数 {#econ:sec-pr-profit}

::: definition 生産集合と利潤関数 {#econ:production-set keywords="production set Y subset R^n of feasible net output vectors (positive entries outputs, negative entries inputs); profit function pi(p) = sup over y in Y of p . y; supply correspondence y(p) of maximizers" index="生産集合|せいさんしゅうごう, 利潤関数|りじゅんかんすう, 供給|きょうきゅう" refname="生産集合と利潤関数"}
技術的に実行可能な生産計画 $y\in\mathbb{R}^{n}$（正の成分は生産物、負の成分は投入物の量）の全体 $Y\subseteq\mathbb{R}^{n}$ を**生産集合**という。$Y$ は空でないとし、価格 $p$ について
$$
\pi(p)\defeq\sup_{y\in Y}p\cdot y\in(-\infty,\infty]
$$
を**利潤関数**、上限を達成する $y$ の集合を $y(p)$（**供給**）という。
:::

::: intuition
生産計画の利潤 $p\cdot y$ は「売上 − 費用」で、生産物の価値から投入物の価値を引いたものである。利潤関数は、価格ごとに最善の計画を選んだときの利潤である。
:::

::: proposition 利潤関数の性質と供給の法則 {#econ:profit-function-properties keywords="pi is convex and positively homogeneous of degree one; law of supply: if y in y(p), y' in y(p') then (p - p').(y - y') >= 0; in particular own-price supply responses are nonnegative" index="供給の法則|きょうきゅうのほうそく" refname="利潤関数の性質と供給の法則"}
1. $\pi$ は凸で、$\alpha>0$ について $\pi(\alpha p)=\alpha\pi(p)$。
2. （**供給の法則**）$y\in y(p)$, $y'\in y(p')$ なら $(p-p')\cdot(y-y')\ge0$。特に $p'$ が $p$ と第 $i$ 成分だけ違うなら $(p_{i}-p'_{i})(y_{i}-y'_{i})\ge0$：価格が上がった財の純供給は減らない。
:::

::: proof
**Step 1（1）.** $p\mapsto p\cdot y$ は線形で、線形関数の上限は凸。同次性は $\sup_{y}\alpha p\cdot y=\alpha\sup_{y}p\cdot y$。

**Step 2（2）.** $y$ は $p$ で最適なので $p\cdot y\ge p\cdot y'$、$y'$ は $p'$ で最適なので $p'\cdot y'\ge p'\cdot y$。足すと $(p-p')\cdot(y-y')\ge0$。
:::

::: intuition
供給の法則は、最適化だけから出てくる。2 つの価格のそれぞれで最善の計画を比べ、「相手の計画を自分の価格で評価しても自分の方が良い」という 2 つの不等式を足すだけである。消費者の需要と違って所得効果がないので、価格と供給の関係に例外はない。
:::

::: theorem ホテリングの補題 {#econ:hotelling-lemma keywords="if y(p) is a single point and pi is differentiable at p then grad pi(p) = y(p)" index="ホテリングの補題|ほてりんぐのほだい" refname="ホテリングの補題"}
$y(p)$ が 1 点 $\{y^{*}\}$ で $\pi$ が $p$ で微分可能なら、$\nabla\pi(p)=y^{*}$。
:::

::: proof
**Step 1（接する線形関数）.** 【主張：$g(q)\defeq\pi(q)-q\cdot y^{*}$ は $q=p$ で最小値 $0$】$\pi(q)\ge q\cdot y^{*}$（$y^{*}\in Y$）、$q=p$ で等号。$g$ は $p$ で微分可能なので勾配は $0$：$\nabla\pi(p)=y^{*}$。
:::

::: proposition 規模に関して収穫一定なら利潤は 0 か無限大 {#econ:constant-returns-profit keywords="if Y is a cone (constant returns to scale: y in Y implies alpha y in Y for alpha >= 0) then pi(p) is 0 or +infinity" index="規模に関して収穫一定|きぼにかんしてしゅうかくいってい" refname="規模に関して収穫一定なら利潤は 0 か無限大"}
$Y$ が錐（$y\in Y$, $\alpha\ge0$ なら $\alpha y\in Y$：**規模に関して収穫一定**）なら、各 $p$ で $\pi(p)\in\{0,+\infty\}$。
:::

::: proof
**Step 1（場合分け）.** $0\in Y$ なので $\pi(p)\ge0$。$p\cdot y>0$ となる $y\in Y$ があれば $p\cdot(\alpha y)=\alpha p\cdot y\to\infty$ で $\pi(p)=\infty$。なければ $\pi(p)=0$。
:::

::: intuition
すべての投入を 2 倍にすれば産出もちょうど 2 倍になる技術では、少しでも利潤の出る計画があれば規模を無限に大きくできる。競争的な均衡で有限の生産が起こるなら、利潤は 0 でなければならない。収穫一定の産業で「長期の利潤は 0」と言われる理由である。
:::

## 費用関数と競争的な企業 {#econ:sec-pr-cost}

::: definition 費用関数 {#econ:cost-function keywords="single-output technology f: R^m_+ -> R_+; cost function c(w, q) = min{w . z : f(z) >= q}; conditional factor demand z(w, q)" index="費用関数|ひようかんすう, 条件付き要素需要|じょうけんつきようそじゅよう, 生産関数|せいさんかんすう" refname="費用関数"}
投入 $z\in\mathbb{R}_{+}^{m}$ から産出 $f(z)$ を生む**生産関数** $f$（連続）と、投入の価格 $w\gg0$ について、
$$
c(w,q)\defeq\min\{w\cdot z:z\in\mathbb{R}_{+}^{m},\ f(z)\ge q\}
$$
を**費用関数**、最小点の集合を $z(w,q)$（**条件付き要素需要**）という（$f(z)\ge q$ となる $z$ があるとき。最小値の存在は支出関数と同じ議論、\ref{econ:duality-ump-emp} の 1）。
:::

::: proposition 費用関数の性質 {#econ:cost-function-properties keywords="c(w, q) is homogeneous of degree one and concave in w, nondecreasing in w and q; Shephard's lemma dc/dw_k = z_k(w, q) when z is single-valued and c differentiable; conditional factor demands do not increase in their own price" index="シェパードの補題（費用）|しぇぱーどのほだい" refname="費用関数の性質"}
1. $c(\alpha w,q)=\alpha c(w,q)$（$\alpha>0$）で、$w\mapsto c(w,q)$ は凹かつ非減少。$q\mapsto c(w,q)$ も非減少。
2. （シェパードの補題）$z(w,q)$ が 1 点で $c$ が $w$ で微分可能なら $\frac{\partial c}{\partial w_{k}}=z_{k}(w,q)$。
3. $c$ が $w$ について $C^{2}$ なら $\frac{\partial z_{k}}{\partial w_{k}}\le0$。
:::

::: proof
**Step 1（1）.** 同次性と単調性は定義から（$w\cdot z$ は $w$ について増加、$q$ を増やすと許容集合が小さくなる）。凹性は線形関数 $w\mapsto w\cdot z$ の下限だから。

**Step 2（2）.** \ref{econ:slutsky-equation} の 1 の証明と同じ：$w'\cdot z(w,q)-c(w',q)\ge0$ で $w'=w$ で $0$。

**Step 3（3）.** 2 から $\frac{\partial z_{k}}{\partial w_{k}}=\frac{\partial^{2}c}{\partial w_{k}^{2}}\le0$（凹関数の 2 階微分）。
:::

::: theorem 競争的な企業の供給 {#econ:competitive-supply keywords="a price-taking firm with differentiable convex cost C(q) chooses q >= 0 maximizing p q - C(q); interior optimum satisfies p = C'(q); supply is nondecreasing in p" index="限界費用|げんかいひよう, 競争的な企業|きょうそうてきなきぎょう" refname="競争的な企業の供給"}
価格 $p>0$ を所与とする企業が、微分可能な凸の費用関数 $C:[0,\infty)\to\mathbb{R}$ のもとで $pq-C(q)$ を最大にするとする。
1. $q^{*}>0$ が最大点なら $p=C'(q^{*})$。逆に $p=C'(q^{*})$ をみたす $q^{*}\ge0$ は最大点。
2. $p<p'$ で $q,q'$ がそれぞれの価格での最大点なら $q\le q'$（供給は価格について非減少）。
:::

::: proof
**Step 1（1）.** $\phi(q)\defeq pq-C(q)$ は凹で微分可能。内点の最大点では $\phi'(q^{*})=0$。逆に $\phi'(q^{*})=0$ なら、凹関数の接線の不等式 $\phi(q)\le\phi(q^{*})+\phi'(q^{*})(q-q^{*})$ から最大。

**Step 2（2）.** \ref{econ:profit-function-properties} の 2 の議論と同じく、$pq-C(q)\ge pq'-C(q')$ と $p'q'-C(q')\ge p'q-C(q)$ を足して $(p-p')(q-q')\ge0$。
:::

::: example コブ–ダグラス型の費用関数 {#econ:cobb-douglas-cost}
$f(z_{1},z_{2})=z_{1}^{a}z_{2}^{1-a}$（$0<a<1$）では、費用最小化の解は $\frac{w_{1}z_{1}}{w_{2}z_{2}}=\frac a{1-a}$ をみたし（費用に占める投入 1 の割合が $a$）、$c(w,q)=q\Bigl(\frac{w_{1}}a\Bigr)^{a}\Bigl(\frac{w_{2}}{1-a}\Bigr)^{1-a}$。$q$ について線形（収穫一定）で、平均費用＝限界費用は一定。実際、$z_{1}=\frac{a}{w_{1}}C$, $z_{2}=\frac{1-a}{w_{2}}C$（総費用 $C$）とおくと $f(z)=C\bigl(\frac a{w_{1}}\bigr)^{a}\bigl(\frac{1-a}{w_{2}}\bigr)^{1-a}$ で、$f=q$ を $C$ について解けばよい（割合が最適であることは \ref{econ:cobb-douglas-demand} と同じ相対エントロピーの議論で、$\log f$ を固定した費用のもとで最大化する問題として示せる）。
:::

::: hypcheck
- **価格受容者**：企業が価格を所与とすることを、利潤関数の定義（価格は $y$ によらない）と競争的な企業の供給で使った。価格を動かせる独占企業では「価格 = 限界費用」は成り立たない（市場の失敗の系列で扱う）。
- **凸性**：競争的な企業の供給の Step 1（一階条件が十分条件になる）に使った。凸でない費用（固定費用や規模の経済）では、一階条件は最大点を保証せず、供給は不連続になりうる。
- **利潤関数の微分可能性**：ホテリングの補題の仮定。供給が 1 点でない価格では、利潤関数は微分できず、劣微分が供給の集合になる。
:::

## 問題 {#econ:sec-pr-problems}

::: problem {#econ:prob-pr-quadratic-cost}
$C(q)=F+\frac{c}2q^{2}$（$F,c>0$）の競争的な企業の供給を求めよ。$F$ が回収できない固定費用で、生産しなければ $0$ にできる場合はどうか。
:::

::: solution
$C$ は凸で $p=cq$ から $q=p/c$、利潤 $\frac{p^{2}}{2c}-F$。$F$ が生産しなければ避けられる場合は、$\frac{p^{2}}{2c}\ge F$、すなわち $p\ge\sqrt{2cF}$ のときだけ生産する（それ未満の価格では供給 $0$）。供給は $p=\sqrt{2cF}$ で不連続に跳ぶ。
:::

::: problem {#econ:prob-pr-hotelling-check}
1 財の生産者で $\pi(p)=\frac{p^{2}}{2c}$（前問で $F=0$）のとき、ホテリングの補題を確かめよ。
:::

::: solution
$\pi'(p)=\frac pc=q(p)$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 利潤関数の凸性と供給の法則には、生産集合の凸性も閉性も使っていない（最適化の定義だけを使った）。議論は Mas-Colell–Whinston–Green『Microeconomic Theory』第 5 章の流れに沿う。

**前提を変えると.**
- **生産集合の復元**：凸で閉な生産集合（と自由処分）は利潤関数から $Y=\{y:p\cdot y\le\pi(p)\text{ すべての }p\gg0\}$ として復元される（双対性。分離定理による、ここでは証明しない）。
- **短期と長期**：一部の投入が固定されている短期の費用関数は長期の費用関数以上で、長期の費用関数は短期の費用関数の包絡線になる。
- **集計**：複数の企業の生産集合の和の利潤関数は、各企業の利潤関数の和である（供給は足し合わせればよい）。消費者の需要の集計と違い、企業の集計には問題が生じない。

**高い視点から：支持関数としての利潤関数.** 利潤関数は生産集合の支持関数で、価格は生産集合を「外から支える超平面の向き」である。ホテリングの補題は「支持関数の勾配は接点」という凸解析の事実で、供給の法則は「支持関数の勾配は単調写像」であることの言い換えである。比喩で言えば、企業は「可能な生産の山」に価格という向きの光を当て、最も遠くまで届く点を選んでおり、光の向きを少し変えると届く点は滑らかに（そして向きと同じ方向に）移る。
:::
