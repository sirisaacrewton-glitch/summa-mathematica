# 部分均衡と余剰 {#econ:page-partial-equilibrium keywords="market demand and supply, existence and uniqueness of partial equilibrium by the intermediate value theorem, quasi-linear utility, consumer surplus as the area under the demand curve, producer surplus, total surplus is maximized at the competitive quantity, per-unit tax, deadweight loss, tax incidence formula dp/dt = S'/(S' - D'), elasticities, price ceilings"}

1 つの財の市場だけを取り出し、他の市場の影響を一定とみなして分析するのが**部分均衡分析**である。需要曲線と供給曲線が交わる点が均衡で、その存在は中間値の定理から出る。消費者が得る利益は需要曲線の下の面積（**消費者余剰**）で測れ、競争的な均衡は消費者と生産者の余剰の合計を最大にする。税を課すと取引量が減り、誰の利益にもならない損失（**死荷重**）が生じる。税を実際に負担するのが買い手か売り手かは、誰が納税するかではなく、需要と供給の傾きで決まる（**税の帰着**）。

## 記法と定義の確認 {#econ:sec-pe-notation}

::: notation
- 消費者と生産者の理論は \ref{econ:budget-demand}, \ref{econ:competitive-supply}。\ref{top:intermediate-value} と \ref{meas:fubini} を使う。
- 需要関数 $D:[0,\infty)\to[0,\infty)$ は連続で非増加、供給関数 $S$ は連続で非減少とする。体系は $\ZFC$。
:::

## 均衡の存在 {#econ:sec-pe-equilibrium}

::: proposition 部分均衡の存在と一意性 {#econ:partial-equilibrium-existence keywords="if D(0) >= S(0) and D(p) <= S(p) for some p, there is an equilibrium price with D = S; if D - S is strictly decreasing it is unique" index="部分均衡|ぶぶんきんこう, 均衡価格|きんこうかかく, 超過需要|ちょうかじゅよう" refname="部分均衡の存在と一意性"}
超過需要 $E(p)\defeq D(p)-S(p)$ について、$E(0)\ge0$ で、ある $\bar p$ で $E(\bar p)\le0$ なら、$E(p^{*})=0$ となる**均衡価格** $p^{*}\in[0,\bar p]$ がある。$E$ が狭義減少なら均衡はただ一つ。
:::

::: intuition
価格が $0$ では欲しい量が作られる量を上回り、十分高い価格では下回る。超過需要が価格について連続なら、その間のどこかでちょうど釣り合う（中間値の定理）。
:::

::: proof
**Step 1（存在）.** $E$ は連続で、$[0,\bar p]$ の端で符号が変わる（または $0$）ので、\ref{top:intermediate-value}。

**Step 2（一意性）.** 狭義減少関数の零点は高々 1 つ。
:::

## 余剰 {#econ:sec-pe-surplus}

::: definition 準線形効用と余剰 {#econ:quasilinear-surplus keywords="quasi-linear utility u(x) + m with u' continuous strictly decreasing; demand D(p) = (u')^{-1}(p) for p < u'(0), 0 otherwise; consumer surplus CS(p) = int_p^infinity D(t) dt; producer surplus PS(p) = p S(p) - C(S(p))" index="消費者余剰|しょうひしゃよじょう, 生産者余剰|せいさんしゃよじょう, 準線形効用|じゅんせんけいこうよう" refname="準線形効用と余剰"}
消費者の効用を $u(x)+m$（$x$ はこの財の量、$m$ はその他の財に使うお金、**準線形効用**）とし、$u$ は $[0,\infty)$ で $C^{1}$、$u'$ は狭義減少で $u'(x)\to0$（$x\to\infty$）、$\bar p\defeq u'(0)<\infty$ とする。このとき需要は $D(p)=(u')^{-1}(p)$（$0<p<\bar p$）、$D(p)=0$（$p\ge\bar p$）。**消費者余剰**を $CS(p)\defeq\int_{p}^{\bar p}D(t)dt$ とする。凸な費用 $C$ の企業について、**生産者余剰**を $PS(p)\defeq pS(p)-C(S(p))$（固定費用を除いた利潤）とする。
:::

::: intuition
需要曲線の高さは「その 1 単位にいくらまで払ってもよいか」（限界的な支払意思額）である。実際に払うのは価格 $p$ だけなので、各単位で「払ってもよい額 − 実際の価格」の得をしており、その合計が需要曲線と価格の線の間の面積になる。
:::

::: proposition 消費者余剰は効用の増分 {#econ:consumer-surplus-utility keywords="with quasi-linear utility, the utility gain from buying D(p) at price p, u(D(p)) - u(0) - p D(p), equals the consumer surplus int_p^{u'(0)} D(t) dt" index="支払意思額|しはらいいしがく" refname="消費者余剰は効用の増分"}
\ref{econ:quasilinear-surplus} の設定で、$0<p<\bar p$、$x\defeq D(p)$ とすると、
$$
u(x)-u(0)-px=\int_{p}^{\bar p}D(t)\,dt.
$$
:::

::: intuition
各単位の支払意思額から価格を引いたものを足し合わせると、消費者がこの取引から得た効用の増分になる。需要曲線の左側の面積と、限界効用曲線の下の面積は、同じ領域を縦と横から測ったものである。
:::

::: proof
**Step 1（同じ領域の 2 通りの記述）.** 【主張：$R\defeq\{(s,t):0\le s\le x,\ p\le t\le u'(s)\}$ は $\{(s,t):p\le t\le\bar p,\ 0\le s\le D(t)\}$ と（境界を除き）一致する】$u'$ は狭義減少なので、$t\le u'(s)\iff s\le(u')^{-1}(t)=D(t)$（$p\le t<\bar p$）。また $s\le x$ と $t\ge p$ は、$s\le D(t)\le D(p)=x$ から自動的に成り立つ。

**Step 2（面積の計算）.** \ref{meas:fubini} で $R$ の面積を 2 通りに計算する。$s$ ごとには $\int_{0}^{x}(u'(s)-p)ds=u(x)-u(0)-px$。$t$ ごとには $\int_{p}^{\bar p}D(t)dt$。
:::

::: theorem 競争均衡は総余剰を最大にする {#econ:surplus-maximization keywords="total surplus W(q) = int_0^q (P_D(s) - P_S(s)) ds with inverse demand P_D decreasing and inverse supply P_S increasing is maximized at the quantity where P_D = P_S, i.e. at the competitive equilibrium" index="総余剰|そうよじょう, 部分均衡の厚生定理|ぶぶんきんこうのこうせいていり" refname="競争均衡は総余剰を最大にする"}
逆需要関数 $P_{D}$（量 $s$ の単位に対する支払意思額、連続で非増加）と逆供給関数 $P_{S}$（量 $s$ の単位を作る限界費用、連続で非減少）について、量 $q$ の取引による**総余剰**を $W(q)\defeq\int_{0}^{q}(P_{D}(s)-P_{S}(s))ds$ とする。$P_{D}(q^{*})=P_{S}(q^{*})$ となる $q^{*}$ があれば、$q^{*}$ は $W$ の最大点である。
:::

::: intuition
支払意思額が限界費用を上回る単位はすべて取引した方がよく、下回る単位は取引しない方がよい。競争的な均衡の量はちょうどその境目である。これが、部分均衡での「見えざる手」（厚生経済学の第一基本定理の 1 財版）である。
:::

::: proof
**Step 1（被積分関数の符号）.** $h\defeq P_{D}-P_{S}$ は非増加で $h(q^{*})=0$ なので、$s<q^{*}$ で $h\ge0$、$s>q^{*}$ で $h\le0$。

**Step 2（比較）.** $q<q^{*}$ なら $W(q^{*})-W(q)=\int_{q}^{q^{*}}h\ge0$、$q>q^{*}$ なら $W(q^{*})-W(q)=-\int_{q^{*}}^{q}h\ge0$。
:::

## 税と死荷重 {#econ:sec-pe-tax}

::: theorem 税の帰着と死荷重 {#econ:tax-incidence keywords="per-unit tax t: buyers pay p_b, sellers receive p_b - t, D(p_b) = S(p_b - t); dp_b/dt = S'/(S' - D'), the buyers' share of the tax; in elasticity form epsilon_S/(epsilon_S + |epsilon_D|); deadweight loss = int over the lost quantity of (P_D - P_S) > 0" index="税の帰着|ぜいのきちゃく, 死荷重|しかじゅう, 弾力性|だんりょくせい" refname="税の帰着と死荷重"}
1 単位あたり $t\ge0$ の税を課すと、買い手の支払う価格 $p_{b}$ と売り手の受け取る価格 $p_{b}-t$ は $D(p_{b})=S(p_{b}-t)$ をみたす。
1. $D,S$ が微分可能で $D'<0\le S'$、$p_{b}(t)$ が $t$ について微分可能なら、$\dfrac{dp_{b}}{dt}=\dfrac{S'}{S'-D'}\in[0,1]$（買い手が負担する割合）。$t=0$ では、均衡での弾力性 $\varepsilon_{D}\defeq\frac{pD'}{D}$, $\varepsilon_{S}\defeq\frac{pS'}{S}$ を使って $\dfrac{\varepsilon_{S}}{\varepsilon_{S}-\varepsilon_{D}}$。
2. 税のもとでの取引量 $q_{t}$ が税のない均衡の量 $q^{*}$ より小さければ、総余剰の減少（税収を余剰に含めたもの）は $\int_{q_{t}}^{q^{*}}(P_{D}-P_{S})ds\ge0$（**死荷重**）。
:::

::: intuition
税を誰が納めるかは関係なく、需要と供給のうち「逃げにくい」（弾力性の小さい）側が多く負担する。たばこの税は、需要が価格にあまり反応しないので、主に買い手が負担する。死荷重は、税がなければ互いに得をしたはずの取引が、税のために行われなくなった分の損失で、誰の所得にもならない。
:::

::: proof
**Step 1（1）.** $D(p_{b}(t))=S(p_{b}(t)-t)$ を $t$ で微分すると $D'p_{b}'=S'(p_{b}'-1)$、よって $p_{b}'(S'-D')=S'$。$S'-D'>0$ なので主張の式。$S'\ge0$, $-D'>0$ から $[0,1]$ に入る。$t=0$ では $p,q$ が共通なので、分子と分母に $p/q$ を掛けて弾力性の形にする。

**Step 2（2）.** 税のもとでの総余剰は、取引される量 $q_{t}$ まで支払意思額と限界費用の差を積分したもので、$W(q_{t})$ に等しい（税収 $tq_{t}$ は買い手から政府への移転で、総余剰の中で打ち消し合う）。\ref{econ:surplus-maximization} から $W(q^{*})-W(q_{t})=\int_{q_{t}}^{q^{*}}(P_{D}-P_{S})ds\ge0$。
:::

::: example 線形の需要と供給 {#econ:linear-tax-example}
$D(p)=a-bp$, $S(p)=cp$（$a,b,c>0$）とする。均衡は $p^{*}=\frac a{b+c}$, $q^{*}=\frac{ac}{b+c}$。税 $t$ のもとで $a-bp_{b}=c(p_{b}-t)$ から $p_{b}=\frac{a+ct}{b+c}$、買い手の負担割合は $\frac c{b+c}$、取引量は $q_{t}=q^{*}-\frac{bct}{b+c}$。死荷重は三角形の面積 $\frac12t(q^{*}-q_{t})=\frac{bc\,t^{2}}{2(b+c)}$ で、税率の 2 乗に比例する。
:::

::: hypcheck
- **準線形効用**：消費者余剰が効用の増分に正確に一致すること（\ref{econ:consumer-surplus-utility}）に使った。所得効果がある一般の効用では、余剰は効用の変化の近似にすぎない（補償変分・等価変分を使う）。
- **他の市場を一定とすること**：部分均衡の前提。税の影響が他の財の価格や所得に波及する場合は、一般均衡で考える必要がある（\ref[一般均衡]{econ:page-general-equilibrium}）。
- **需要と供給の単調性**：一意性と余剰の最大化（Step 1 の符号）に使った。
:::

## 問題 {#econ:sec-pe-problems}

::: problem {#econ:prob-pe-inelastic-supply}
供給が完全に非弾力的（$S$ が定数）のとき、税は誰が負担するか。
:::

::: solution
$S'=0$ なので $\frac{dp_{b}}{dt}=0$：買い手の価格は変わらず、税は全額売り手が負担する（土地への課税が典型）。取引量も変わらず死荷重は $0$。
:::

::: problem {#econ:prob-pe-cs-linear}
$u(x)=ax-\frac b2x^{2}$（$x\le a/b$）の消費者余剰を価格 $p$ の関数として求め、\ref{econ:consumer-surplus-utility} を確かめよ。
:::

::: solution
$D(p)=\frac{a-p}b$, $\bar p=a$。$\int_{p}^{a}\frac{a-t}bdt=\frac{(a-p)^{2}}{2b}$。$x=\frac{a-p}b$ で $u(x)-px=(a-p)x-\frac b2x^{2}=\frac{(a-p)^{2}}{2b}$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 総余剰の最大化には、需要と供給が個人や企業の最適化から導かれたことを使っていない（単調性だけ）。議論は Mas-Colell–Whinston–Green『Microeconomic Theory』第 10 章の流れに沿う。

**前提を変えると.**
- **価格の上限規制**：均衡価格より低い上限を設けると、取引量は供給量まで減り、死荷重に加えて、誰が買えるかの割り当ての非効率が生じる。
- **ラムゼーの課税ルール**：一定の税収を最小の死荷重で集めるには、需要の弾力性が小さい財ほど高い税率を課すのがよい（逆弾力性ルール）。効率の観点からの結論で、必需品ほど高い税率になるので公平の観点とは衝突する。
- **補助金**：補助金は税の符号を変えたもので、やはり死荷重を生む（過剰な取引）。

**高い視点から：面積としての厚生.** 部分均衡の厚生分析は、需要と供給の曲線で囲まれた領域の面積の計算である。総余剰の最大化は、凸な最適化の一階条件（支払意思額 = 限界費用）の幾何学的な表現で、死荷重は最適点からのずれの 2 次の誤差（三角形）である。比喩で言えば、市場は「得をする取引」を見つけて実行する仕組みで、税はその取引に通行料をかけるので、通行料より得の小さい取引が行われなくなる。その失われた得の合計が死荷重である。
:::
