# 一般均衡 {#econ:page-general-equilibrium keywords="exchange economy, endowments and allocations, Walrasian equilibrium, aggregate excess demand, homogeneity and Walras' law, relative prices and the price simplex, gauge function and homeomorphism of compact convex sets with balls, Brouwer fixed point theorem, Gale-Nikaido-Debreu lemma, existence of equilibrium with free goods, two-consumer Cobb-Douglas example, Edgeworth box, absence of money in Arrow-Debreu (Hahn's problem)"}

部分均衡は 1 つの市場だけを見たが、現実の市場は互いにつながっている。ある財の価格が変われば、人々の所得（持っている財の価値）と他の財の需要が変わる。すべての市場が同時に釣り合う価格（**一般均衡**）は存在するか。このページでは、人々が持っている財を交換するだけの経済（**交換経済**）について、超過需要が連続でワルラス法則をみたせば均衡が存在することを、ブラウワーの不動点定理から証明する。均衡で決まるのは財どうしの交換比率（相対価格）だけで、この理論にはまだ**貨幣**が登場しないことにも注意する。

## 記法と定義の確認 {#econ:sec-ge-notation}

::: notation
- 需要とワルラス法則・0 次同次性は \ref{econ:budget-demand}, \ref{econ:demand-properties}。例では \ref{econ:cobb-douglas-demand} を使う。
- 閉円板の連続な自己写像が不動点をもつことは \ref{at:brouwer-fixed-point}。
- **価格の単体** $\Delta\defeq\{p\in\mathbb{R}_{+}^{n}:\sum_{i}p_{i}=1\}$。$t^{+}\defeq\max(t,0)$。体系は $\ZFC$。
:::

## 交換経済と均衡 {#econ:sec-ge-economy}

::: definition 交換経済とワルラス均衡 {#econ:walrasian-equilibrium keywords="exchange economy with consumers i = 1..I, utilities u^i and endowments omega^i in R^n_+; allocation x = (x^i); feasible if sum x^i <= sum omega^i; Walrasian equilibrium: prices p and allocation x with x^i in x^i(p, p . omega^i) and markets clearing; aggregate excess demand z(p)" index="交換経済|こうかんけいざい, ワルラス均衡|わるらすきんこう, 一般均衡|いっぱんきんこう, 初期保有|しょきほゆう" refname="交換経済とワルラス均衡"}
$I$ 人の消費者がそれぞれ効用関数 $u^{i}$ と**初期保有** $\omega^{i}\in\mathbb{R}_{+}^{n}$ をもつ経済を**交換経済**という。$\Omega\defeq\sum_{i}\omega^{i}$ とする。
1. 各人の消費 $x^{i}\in\mathbb{R}_{+}^{n}$ の組 $x=(x^{i})$ を**配分**といい、$\sum_{i}x^{i}\le\Omega$ のとき**実行可能**という。
2. 価格 $p$ と配分 $x$ の組で、各 $i$ について $x^{i}$ が所得 $p\cdot\omega^{i}$ のもとでの需要（\ref{econ:budget-demand}）であり、$\sum_{i}x^{i}\le\Omega$、かつ $\sum_{i}x_{j}^{i}<\Omega_{j}$ となる財 $j$ では $p_{j}=0$ であるものを**ワルラス均衡**という。
3. 需要が 1 点で定まるとき、$z(p)\defeq\sum_{i}\bigl(x^{i}(p,p\cdot\omega^{i})-\omega^{i}\bigr)$ を**総超過需要**という。
:::

::: intuition
各人は自分の持ち物を市場価格で売ったと考え、その代金で最も好ましい組を買い直す。均衡価格とは、全員がそうしたときに、どの財についても「欲しい総量」が「ある総量」に収まる価格である。余る財は、価格が $0$（自由財）でなければならない。
:::

::: proposition 総超過需要の性質 {#econ:excess-demand-properties keywords="aggregate excess demand is homogeneous of degree zero, so only relative prices matter (normalize to the simplex); under local nonsatiation p . z(p) = 0 (Walras' law); if n - 1 markets clear the last one clears" index="ワルラス法則（市場）|わるらすほうそく, 相対価格|そうたいかかく" refname="総超過需要の性質"}
各 $u^{i}$ が連続で局所非飽和、需要が 1 点で定まるとすると、
1. $z(\alpha p)=z(p)$（$\alpha>0$）。したがって価格は $\Delta$ に正規化してよい（相対価格だけが意味をもつ）。
2. $p\cdot z(p)=0$（**ワルラス法則**）。
3. $p\gg0$ で $n-1$ 個の財の市場が釣り合えば（$z_{j}(p)=0$）、残りの財の市場も釣り合う。
:::

::: proof
**Step 1（1）.** 各人の需要は 0 次同次（\ref{econ:demand-properties} の 2）で、所得 $p\cdot\omega^{i}$ も価格と同じ倍率で変わる。

**Step 2（2）.** 各人のワルラス法則 $p\cdot x^{i}=p\cdot\omega^{i}$（\ref{econ:demand-properties} の 3）を足す。

**Step 3（3）.** 2 から $p_{n}z_{n}(p)=-\sum_{j<n}p_{j}z_{j}(p)=0$ で、$p_{n}>0$。
:::

## 均衡の存在 {#econ:sec-ge-existence}

::: lemma 凸体は球と同相 {#econ:convex-body-ball keywords="a compact convex subset of R^m with nonempty interior is homeomorphic to the closed unit ball via the gauge (Minkowski functional); in particular the price simplex is homeomorphic to a closed (n-1)-ball, so it has the fixed point property" index="ミンコフスキー汎関数|みんこふすきーはんかんすう, ゲージ関数|げーじかんすう" refname="凸体は球と同相"}
$K\subseteq\mathbb{R}^{m}$ をコンパクトな凸集合で $0$ を内点に含むものとする。$\mu(x)\defeq\inf\{t>0:x\in tK\}$ とおくと、$\Phi(x)\defeq\frac{\mu(x)}{\abs x}x$（$x\ne0$）、$\Phi(0)\defeq0$ は $K$ から閉単位球への同相写像である。特に $\Delta$（$n-1$ 次元のアフィン空間の中の凸体）の連続な自己写像は不動点をもつ。
:::

::: proof
**Step 1（ゲージの性質）.** 【主張：$B(0,r)\subseteq K\subseteq\bar B(0,R)$ となる $r,R>0$ をとると、$\frac{\abs x}R\le\mu(x)\le\frac{\abs x}r$、$\mu(\lambda x)=\lambda\mu(x)$（$\lambda\ge0$）、$\mu(x+y)\le\mu(x)+\mu(y)$、$\abs{\mu(x)-\mu(y)}\le\frac{\abs{x-y}}r$、$K=\{\mu\le1\}$】上下の評価と同次性は定義から。劣加法性：$x\in sK$, $y\in tK$ なら凸性から $x+y=(s+t)\bigl(\frac s{s+t}\frac xs+\frac t{s+t}\frac yt\bigr)\in(s+t)K$。リプシッツ性は劣加法性と上の評価から（$\mu(x)\le\mu(y)+\mu(x-y)$）。$K$ は閉で凸、$0$ を含むので $\{\mu\le1\}=K$（$\mu(x)\le1$ なら $x\in tK$（$t\downarrow1$）の極限で $x\in K$）。

**Step 2（同相）.** $\Phi$ は $x\ne0$ で連続、$\abs{\Phi(x)}=\mu(x)\le\abs x/r\to0$ から $0$ でも連続。$\Phi$ は各半直線をそれ自身に写し、半直線 $\{su:s\ge0\}$（$\abs u=1$）の上で $s\mapsto s\mu(u)$ という線形の全単射（$K$ の部分 $[0,1/\mu(u)]$ を $[0,1]$ に）なので、$K$ から閉単位球への全単射。逆写像 $y\mapsto\frac{\abs y}{\mu(y)}y$ も同様に連続。コンパクト集合からハウスドルフ空間への連続全単射なので同相。

**Step 3（単体）.** $\Delta$ はアフィン空間 $\{\sum p_{i}=1\}$（$\mathbb{R}^{n-1}$ と同一視）の中で、点 $(\frac1n,\dots,\frac1n)$ を内点にもつコンパクトな凸集合。Step 2 と \ref{at:brouwer-fixed-point} から、$\Delta$ の連続な自己写像は不動点をもつ。
:::

::: theorem ゲール–二階堂–ドブリューの補題（均衡の存在） {#econ:gale-nikaido-debreu keywords="if z: Delta -> R^n is continuous and p . z(p) = 0 on the simplex, there is p* with z(p*) <= 0; then z_j(p*) < 0 implies p*_j = 0 (free goods); existence of Walrasian equilibrium for continuous excess demand; proof via Brouwer applied to p -> (p + z(p)^+)/(1 + sum z_j(p)^+)" index="ゲール–二階堂–ドブリューの補題|げーるにかいどうどぶりゅーのほだい, 一般均衡の存在|いっぱんきんこうのそんざい" refname="ゲール–二階堂–ドブリューの補題（均衡の存在）"}
$z:\Delta\to\mathbb{R}^{n}$ が連続で、すべての $p\in\Delta$ で $p\cdot z(p)=0$ なら、$z(p^{*})\le0$ となる $p^{*}\in\Delta$ がある。このとき $z_{j}(p^{*})<0$ となる $j$ では $p_{j}^{*}=0$。特に、交換経済の総超過需要が $\Delta$ 上で定義され連続なら、ワルラス均衡が存在する。
:::

::: intuition
「超過需要のある財の価格を上げ、その分だけ全体を割り直す」という価格の調整の写像を作り、その不動点を探す。不動点では、どの財の価格をもう上げる必要がない。ワルラス法則（価値で測った超過需要の合計は $0$）があるので、上げる必要のない状態とは超過需要がどこにもない状態である。
:::

::: proof
**Step 1（価格調整の写像）.** $g(p)_{i}\defeq\dfrac{p_{i}+z_{i}(p)^{+}}{1+\sum_{j}z_{j}(p)^{+}}$ とすると、$g(p)\in\Delta$（成分は非負で和は $1$）で、$z$ の連続性から $g$ は連続。\ref{econ:convex-body-ball} から不動点 $p^{*}=g(p^{*})$ がある。

**Step 2（不動点の条件）.** 【主張：$z(p^{*})\le0$】$s\defeq\sum_{j}z_{j}(p^{*})^{+}$ とすると、不動点の式は $p_{i}^{*}s=z_{i}(p^{*})^{+}$。両辺に $z_{i}(p^{*})$ を掛けて $i$ について足すと、左辺は $s\,p^{*}\cdot z(p^{*})=0$（ワルラス法則）、右辺は $\sum_{i}z_{i}(p^{*})z_{i}(p^{*})^{+}=\sum_{i}(z_{i}(p^{*})^{+})^{2}$。よってすべての $i$ で $z_{i}(p^{*})^{+}=0$。

**Step 3（自由財）.** $p^{*}\ge0$, $z(p^{*})\le0$, $p^{*}\cdot z(p^{*})=0$ なので、各項 $p_{j}^{*}z_{j}(p^{*})\le0$ の和が $0$、すなわちすべての項が $0$。$z_{j}(p^{*})<0$ なら $p_{j}^{*}=0$。これはワルラス均衡の定義（\ref{econ:walrasian-equilibrium} の 2）の条件そのもの。
:::

::: example 2 人 2 財のコブ–ダグラス経済 {#econ:edgeworth-cobb-douglas}
消費者 $1$ は $u^{1}=a\log x_{1}+(1-a)\log x_{2}$、初期保有 $\omega^{1}=(1,0)$、消費者 $2$ は $u^{2}=b\log x_{1}+(1-b)\log x_{2}$、$\omega^{2}=(0,1)$（$0<a,b<1$）とする。価格を $p=(p_{1},p_{2})$ とすると所得は $p_{1}$ と $p_{2}$ で、財 1 の需要は $\frac{ap_{1}}{p_{1}}+\frac{bp_{2}}{p_{1}}$（\ref{econ:cobb-douglas-demand}）。財 1 の市場の均衡 $a+\frac{bp_{2}}{p_{1}}=1$ から $\frac{p_{2}}{p_{1}}=\frac{1-a}b$。財 2 の市場は \ref{econ:excess-demand-properties} の 3 から自動的に釣り合う。均衡の配分は、消費者 1 が所得 $p_{1}$ の割合 $a$ を財 1 に、$1-a$ を財 2 に使うので $x^{1}=\bigl(a,\frac{(1-a)p_{1}}{p_{2}}\bigr)=(a,b)$、同様に $x^{2}=\bigl(\frac{bp_{2}}{p_{1}},1-b\bigr)=(1-a,1-b)$ で、どちらの財も総量 $1$ に釣り合う。この経済の総超過需要は $p_{1}=0$ や $p_{2}=0$ で発散するので \ref{econ:gale-nikaido-debreu} はそのままは使えないが、均衡は直接の計算で存在する。
:::

::: remark
**一般均衡理論には貨幣の役割がない.** ここで決まる価格は財どうしの交換比率で、$\Delta$ への正規化は「価格の合計を $1$ とする」という単位の約束にすぎない。均衡では、すべての交換が一度に、中央の市場で同時に行われると想定されており、交換の媒介や価値の保存としての貨幣が入る余地がない（ハーンの問題）。貨幣がなぜ価値をもつのかは、取引が時間的・空間的に分散している経済のモデル（\ref[貨幣]{econ:page-money-definition}）で扱う。
:::

::: hypcheck
- **超過需要の連続性**：Step 1 で写像 $g$ の連続性に使った。凸で連続な選好の経済では、需要の連続性はベルジュの最大値定理から出るが、価格が $0$ に近づくと需要が発散するので、実際の存在定理では境界での振る舞いを別に扱う必要がある（上の例のように）。この一般の存在定理（アロー–ドブリュー）はここでは証明しない。
- **ワルラス法則**：Step 2 の要。局所非飽和から出る（\ref{econ:excess-demand-properties} の 2）。
- **凸性**：需要が 1 点（または凸集合）になることを通して、超過需要の連続性に効く。凸でない選好では均衡が存在しないことがある。
- **価格受容**：全員が価格を所与として行動することを前提にしている。
:::

## 問題 {#econ:sec-ge-problems}

::: problem {#econ:prob-ge-walras-check}
\ref{econ:edgeworth-cobb-douglas} の均衡価格のもとで、財 2 の市場が実際に釣り合っていることを直接確かめよ。
:::

::: solution
財 2 の需要は $\frac{(1-a)p_{1}}{p_{2}}+\frac{(1-b)p_{2}}{p_{2}}=\frac{(1-a)b}{1-a}+1-b=1=\Omega_{2}$。
:::

::: problem {#econ:prob-ge-relative-price}
\ref{econ:edgeworth-cobb-douglas} で、消費者 2 の財 1 への好み $b$ が大きくなると財 1 の相対価格 $p_{1}/p_{2}$ はどう変わるか。
:::

::: solution
$\frac{p_{1}}{p_{2}}=\frac b{1-a}$ は $b$ について増加。財 1 の需要が増えると相対価格が上がり、財 1 を持つ消費者 1 が豊かになる（交易条件の改善）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** ゲール–二階堂–ドブリューの補題は、超過需要が個人の最適化から導かれたことを使わず、連続性とワルラス法則だけを使う。議論は Mas-Colell–Whinston–Green『Microeconomic Theory』第 17 章、二階堂副包『現代経済学の数学的方法』の流れに沿う。

**前提を変えると.**
- **生産のある経済**：企業の利潤を株式の持ち分に応じて分配するアロー–ドブリューの経済でも、凸性の仮定のもとで均衡は存在する（角谷の不動点定理による。ここでは証明しない）。
- **一意性と安定性**：均衡は一般に複数ありうる。超過需要が「粗代替性」（ある財の価格が上がると他の財の需要が増える）をみたせば均衡は一意で、価格調整の動学（タトンヌマン）は均衡に収束するが、一般には収束しない例がある（スカーフの例）。
- **ソンネンシャイン–マンテル–ドブリューの定理**：ワルラス法則と同次性をみたす連続関数は、（価格が境界から離れた範囲では）ある交換経済の総超過需要として実現される。一般均衡の理論だけからは、均衡の一意性や安定性について多くを言えない。

**高い視点から：不動点としての均衡.** 一般均衡の存在は、価格の空間（単体）の上の連続写像の不動点の存在で、その背後にあるのは「単体の連続写像は不動点をもつ」という位相的な事実（ブラウワー、あるいは組合せ的なスペルナーの補題）である。経済が釣り合う価格が存在するのは、価格の空間が「穴のない」形をしているからだ、と言ってもよい。比喩で言えば、市場の調整は、どの方向にも押し出されない場所を探す作業で、その場所の存在は、部屋に出口がない限り、風に流される紙切れがどこかで止まる点が必ずある、という事実に似ている。
:::
