# 演習：市場と均衡 {#econ:page-exercises-markets keywords="exercises, intransitive preferences and money pump, utility for Leontief preferences, quasi-linear demand, Slutsky for quasi-linear utility, law of supply, cost function of Leontief technology, tax incidence with elasticities, deadweight loss of a subsidy, equilibrium in a Leontief-Cobb-Douglas economy, Pareto efficiency of equilibria with satiation"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#econ:sec-ema-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## 選好と効用 {#econ:sec-pu-exercises}

対応するページ：\ref{econ:page-preferences-utility}

::: problem ★ 基本：マネーポンプ {#econ:ex-pu-money-pump}
$a\succ b\succ c\succ a$（循環する強い選好）をもつ人は、効用関数で表現できないことを示せ。
:::

::: solution
効用 $u$ があれば $u(a)>u(b)>u(c)>u(a)$ となり矛盾。この人は「$c$ を持っていれば少しのお金を払って $b$ に、$b$ なら $a$ に、$a$ なら $c$ に替える」ので、際限なくお金を失う。
:::

::: problem ★★ 標準：完全補完財 {#econ:ex-pu-leontief}
$u(x_{1},x_{2})=\min(x_{1}/\alpha,x_{2}/\beta)$（$\alpha,\beta>0$）の選好が連続・単調・凸であることを確かめ、価格 $p$、所得 $w$ のもとでの需要を求めよ。
:::

::: solution
$\min$ は連続で、各成分を増やすと減らない（$x\gg y$ なら真に増える）、上方集合 $\{x_{1}\ge\alpha t,x_{2}\ge\beta t\}$ は凸。需要では $x_{1}/\alpha=x_{2}/\beta=t$（余りを作らない）で、予算 $p_{1}\alpha t+p_{2}\beta t=w$ から $t=\frac{w}{p_{1}\alpha+p_{2}\beta}$、$x=(\alpha t,\beta t)$。効用 $\bar u$ を最小の支出で達成する組は $(\alpha\bar u,\beta\bar u)$ で価格によらないので、補償需要は価格に反応せず、スルツキー方程式（\ref{econ:slutsky-equation}）の代替効果は $0$ である。
:::

## 消費者の理論 {#econ:sec-cs-exercises}

対応するページ：\ref{econ:page-consumer}

::: problem ★ 基本：準線形効用の需要 {#econ:ex-cs-quasilinear}
$u(x,m)=2\sqrt x+m$（$m$ は価格 $1$ の財）で、所得が十分大きいときの $x$ の需要が所得によらないことを示せ。
:::

::: solution
予算 $px+m=w$ のもとで $2\sqrt x+w-px$ を最大にすると $\frac1{\sqrt x}=p$、$x=1/p^{2}$（$m=w-1/p\ge0$ のとき）。所得効果が $0$ なので、スルツキー方程式（\ref{econ:slutsky-equation}）で価格効果は代替効果に等しい。
:::

::: problem ★★ 標準：間接効用関数 {#econ:ex-cs-indirect-utility}
2 財のコブ–ダグラス型 $u=a\log x_{1}+(1-a)\log x_{2}$ の間接効用関数と支出関数を求め、$e(p,v(p,w))=w$ を確かめよ。
:::

::: solution
$v(p,w)=a\log\frac{aw}{p_{1}}+(1-a)\log\frac{(1-a)w}{p_{2}}=\log w+K(p)$、$K(p)\defeq a\log\frac a{p_{1}}+(1-a)\log\frac{1-a}{p_{2}}$。$v=\bar u$ を $w$ について解いて $e(p,\bar u)=e^{\bar u-K(p)}$。$e(p,v(p,w))=e^{\log w}=w$（\ref{econ:duality-ump-emp} の 2）。
:::

## 生産者の理論 {#econ:sec-pr-exercises}

対応するページ：\ref{econ:page-producer}

::: problem ★ 基本：レオンチェフ型の費用関数 {#econ:ex-pr-leontief-cost}
$f(z_{1},z_{2})=\min(z_{1},z_{2})$ の費用関数を求め、シェパードの補題を確かめよ。
:::

::: solution
$q$ を作るには $z_{1}=z_{2}=q$ が最も安く、$c(w,q)=(w_{1}+w_{2})q$。$\frac{\partial c}{\partial w_{k}}=q=z_{k}$（\ref{econ:cost-function-properties} の 2）。
:::

::: problem ★★ 標準：供給の法則の多財版 {#econ:ex-pr-law-of-supply}
2 つの価格 $p,p'$ で $p_{1}<p'_{1}$、他の成分は等しいとき、\ref{econ:profit-function-properties} から $y_{1}\le y'_{1}$ を導け。生産物 1 が投入物（$y_{1}<0$）の場合の意味も述べよ。
:::

::: solution
$(p-p')\cdot(y-y')=(p_{1}-p'_{1})(y_{1}-y'_{1})\ge0$ で $p_{1}-p'_{1}<0$ なので $y_{1}-y'_{1}\le0$。財 1 が投入物（$y_{1},y'_{1}<0$）なら、投入量 $-y_{1}$ と $-y'_{1}$ について $-y'_{1}\le-y_{1}$：投入物の価格が上がると、その使用量は増えない。
:::

## 部分均衡と余剰 {#econ:sec-pe-exercises}

対応するページ：\ref{econ:page-partial-equilibrium}

::: problem ★ 基本：弾力性による税の帰着 {#econ:ex-pe-elasticity}
均衡で需要の弾力性が $-0.5$、供給の弾力性が $2$ のとき、小さな税のうち買い手が負担する割合を求めよ。
:::

::: solution
\ref{econ:tax-incidence} から $\frac{\varepsilon_{S}}{\varepsilon_{S}-\varepsilon_{D}}=\frac2{2.5}=0.8$。買い手が 8 割を負担する。
:::

::: problem ★★ 標準：補助金の死荷重 {#econ:ex-pe-subsidy}
\ref{econ:linear-tax-example} の線形の市場で、1 単位あたり $s$ の補助金を与えたときの死荷重を求めよ（補助金の支出を余剰から差し引く）。
:::

::: solution
**Step 1（取引量）.** 買い手の価格 $p_{b}$、売り手の受け取りは $p_{b}+s$ で、$a-bp_{b}=c(p_{b}+s)$。これは税の例で $t=-s$ としたものなので、取引量は $q_{s}=q^{*}+\frac{bcs}{b+c}>q^{*}$。

**Step 2（余剰）.** 補助金の支出 $sq_{s}$ は政府から売り手への移転なので、消費者余剰と生産者余剰の和から支出を引いたものは $W(q_{s})$ に等しい。\ref{econ:surplus-maximization} の Step 2（$q>q^{*}$ の場合）から $W(q^{*})-W(q_{s})=\int_{q^{*}}^{q_{s}}(P_{S}-P_{D})ds\ge0$。

**Step 3（計算）.** $P_{S}-P_{D}$ は量の 1 次式で、$q^{*}$ で $0$、$q_{s}$ で $(p_{b}+s)-p_{b}=s$。積分は三角形の面積 $\frac12s(q_{s}-q^{*})=\frac{bc\,s^{2}}{2(b+c)}$ で、同じ大きさの税の死荷重と一致する。
:::

## 一般均衡 {#econ:sec-ge-exercises}

対応するページ：\ref{econ:page-general-equilibrium}

::: problem ★★ 標準：補完財と代替財の経済 {#econ:ex-ge-leontief}
消費者 1 は $u^{1}=\min(x_{1},x_{2})$、$\omega^{1}=(1,0)$、消費者 2 は $u^{2}=\frac12\log x_{1}+\frac12\log x_{2}$、$\omega^{2}=(0,1)$ とする。均衡の相対価格と配分を求めよ。
:::

::: solution
$p=(p_{1},p_{2})$ とする。消費者 1 の需要は $x_{1}=x_{2}=\frac{p_{1}}{p_{1}+p_{2}}$、消費者 2 は $\bigl(\frac{p_{2}}{2p_{1}},\frac12\bigr)$。財 2 の市場：$\frac{p_{1}}{p_{1}+p_{2}}+\frac12=1$ から $p_{1}=p_{2}$。配分 $x^{1}=(\frac12,\frac12)$, $x^{2}=(\frac12,\frac12)$。財 1 も $\frac12+\frac12=1$ で釣り合う（\ref{econ:excess-demand-properties} の 3）。
:::

::: problem ★ 基本：価格調整写像の不動点 {#econ:ex-ge-gnd-fixed-point}
\ref{econ:gale-nikaido-debreu} の写像 $g$ の不動点 $p^{*}$ が $p^{*}\gg0$ をみたすなら、$z(p^{*})=0$ であることを示せ。
:::

::: solution
定理から $z(p^{*})\le0$ で、$z_{j}(p^{*})<0$ なら $p_{j}^{*}=0$。$p^{*}\gg0$ なので $z_{j}(p^{*})<0$ となる $j$ はなく、$z(p^{*})=0$。
:::

## 厚生経済学の基本定理 {#econ:sec-wt-exercises}

対応するページ：\ref{econ:page-welfare-theorems}

::: problem ★★ 標準：局所非飽和が崩れる場合 {#econ:ex-wt-satiation}
2 財 2 人の交換経済で、消費者 1 の効用を定数 $u^{1}\equiv0$（何を持っても同じ）、消費者 2 の効用を $u^{2}=x_{1}+x_{2}$、初期保有を $\omega^{1}=\omega^{2}=(1,1)$ とする。$p=(1,1)$ と配分 $x=\omega$ がワルラス均衡であり、パレート効率的でないことを示せ。
:::

::: solution
**Step 1（均衡）.** 消費者 1 にとっては予算集合のすべての点が最大点なので、$x^{1}=(1,1)$ は需要である。消費者 2 の予算集合 $\{x_{1}+x_{2}\le2\}$ で $u^{2}$ の最大値は $2$ で、$(1,1)$ はそれを達成する。$\sum_{i}x^{i}=\Omega$ なので市場は釣り合う。

**Step 2（効率的でない）.** $y^{1}=(0,0)$, $y^{2}=(2,2)$ は実行可能で、$u^{1}(y^{1})=u^{1}(x^{1})$, $u^{2}(y^{2})=4>2=u^{2}(x^{2})$。

**Step 3（どの前提が崩れたか）.** $u^{1}$ は局所非飽和でない（どの点の近くにも、より好ましい点がない）。第一基本定理（\ref{econ:first-welfare-theorem}）の証明の Step 1 の後半「好ましさが同じなら予算を使い切る」が消費者 1 で成り立たないことが原因である。
:::
