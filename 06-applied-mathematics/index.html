# 応用数学（Applied Mathematics）

計算機科学の実装と応用、物理数学、統計学、経済数学・金融工学・保険数理、音楽理論と音響物理学、政治・社会・倫理への数学の応用。

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-computing/index.html"><span class="mn-card-title">計算機科学（応用）</span><span class="mn-card-en">Applied Computer Science</span><span class="mn-card-desc">論理回路とハードウェアの実装、高級言語の文法と処理系の比較とチューリング完全性、暗号と仮想通貨の設計、量子計算。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="02-mathematical-physics/index.html"><span class="mn-card-title">物理数学</span><span class="mn-card-en">Mathematical Physics</span><span class="mn-card-desc">公理から出発する古典力学・電磁気学・相対論・量子力学・統計力学。実験との整合・反証可能性・技術への応用のコラム。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="03-statistics/index.html"><span class="mn-card-title">統計学</span><span class="mn-card-en">Statistics</span><span class="mn-card-desc">推定・検定・回帰・ベイズ統計・時系列・極値統計。確率論の厳密な証明を参照しつつ、主張と証明の流れをやさしく説明する。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="04-mathematical-economics/index.html"><span class="mn-card-title">経済数学</span><span class="mn-card-en">Mathematical Economics</span><span class="mn-card-desc">公理的なミクロ・マクロ経済モデルとその限界、金融工学（伊藤の補題・ブラック–ショールズ）、保険数理・年金、投資手法の数学的裏付けとコスト・税金の計算。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="05-music-acoustics/index.html"><span class="mn-card-title">音楽理論と音響物理学</span><span class="mn-card-en">Music Theory and Acoustics</span><span class="mn-card-desc">振動と音響の物理、協和の理論、音律と調、和声とジャズ理論、リズム、異なる音楽体系の比較、サンプリング定理。</span><span class="mn-card-count">0 ページ</span></a>
<a class="mn-card" href="06-social-sciences/index.html"><span class="mn-card-title">政治・社会と数学</span><span class="mn-card-en">Mathematics of Politics and Society</span><span class="mn-card-desc">社会的選択理論（アローの不可能性定理など）、投票方式の比較、権力の集中と政治体制の比較、社会・倫理システムの長所と問題点。</span><span class="mn-card-count">0 ページ</span></a>
