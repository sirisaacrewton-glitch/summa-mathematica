# 位相的性質の保存表 {#top:page-preservation-table keywords="preservation of topological properties under subspaces, products, sums, quotients, continuous images, open maps, closed maps, perfect maps, hereditary, productive"}

分離公理・コンパクト性・可算公理・連結性・距離化可能性などの性質が、部分空間・直積・直和をとる操作や、商写像・連続写像・開写像・閉写像・完全写像の像で保たれるかを、二つの表にまとめる（\ref{top:preservation-table-constructions}, \ref{top:preservation-table-maps}）。各欄には、保たれるなら証明への参照を、保たれないなら反例への参照を付けた。これまでのページにない短い主張は \ref{top:sec-pres-proofs} で証明し、反例に使う空間は \ref{top:sec-pres-examples} で作る。

> 資料によらず、これまでのページの結果を整理した。このサイトで証明していない主張は `fact` として出典を書き、筆者が確かめていない欄は「?」として明記する。

## 記法と定義の確認 {#top:sec-pres-notation}

::: notation
- 性質の定義：$T_{0}$・$T_{1}$・正則・正規・$T_{3}$・$T_{4}$（\ref{top:separation-axioms}）、ハウスドルフ（\ref{top:hausdorff}）、チコノフ空間（\ref{top:completely-regular}）、コンパクト（\ref{top:compact}）、可算コンパクト・点列コンパクト（\ref{top:countably-compact}）、局所コンパクト（\ref{top:locally-compact}）、第一可算・第二可算・リンデレーフ（\ref{top:second-countable}）、可分（\ref{top:separable-space}）、パラコンパクト（\ref{top:paracompact}。ハウスドルフを含む）、連結（\ref{top:connected}）、弧状連結（\ref{top:path-connected}）、局所連結（\ref{top:locally-connected}）、距離化可能（\ref{top:metrizable}）、完備距離化可能（\ref{top:completely-metrizable}）。
- 「LCH」は局所コンパクトなハウスドルフ空間を表す。表では局所コンパクト性をハウスドルフ空間に限って扱う（ハウスドルフでない空間では、局所コンパクト性の定義が文献によって分かれるため）。
- 操作：部分空間（\ref{top:subspace}）、直積（\ref{top:product-topology}。因子はすべて空でないとする）、**直和**（**位相和**：集合の非交和 $\bigsqcup_{i}X_{i}$ に、各 $X_{i}$ との共通部分が $X_{i}$ で開である集合を開集合とする位相を入れたもの。各 $X_{i}$ は開かつ閉）、商空間（\ref{top:quotient-topology}）、連続像（連続な全射の値域）、開写像・閉写像（\ref{top:homeomorphism}）、完全写像（\ref{top:perfect-map}：閉な連続全射で各ファイバーがコンパクトなもの）。
- 記号：:yes: はつねに保たれる、:no: は保たれない例がある、:partial: は条件付きで保たれる（備考に条件を書く）、:open: は筆者が確かめていない。表の「(n)」は \ref{top:preservation-notes} の番号である。
- 「可算直積」は可算無限個の直積、「直積」は任意個（非可算個を含む）の直積を表す。有限直積で :no: なら、それより多い直積でも :no: である（反例に一点空間を掛け足せばよい）。
- 公理：$\ZF$ に従属選択公理（DC）を加えて議論し、選択公理（AC）を使う欄は備考に書く。
:::

::: intuition
二つの表を縦に眺めると、性質がおおよそ三つの型に分かれる。

- **「点の近くの性質」**（分離公理・第一可算・局所連結・LCH など）は、部分空間や直積にはよく遺伝するが、像には伝わりにくい。点を貼り合わせると、近くの様子が壊れるからである（\ref{top:pres-r-mod-z} の $\R/\Z$ が典型）。
- **「被覆の性質」**（コンパクト・リンデレーフ・可算コンパクトなど）は、閉部分空間と連続像にはよく伝わるが、一般の部分空間には伝わらない。開被覆を引き戻したり押し出したりできるのは、閉集合と連続写像の向きだからである。
- **「つながりの性質」**（連結・弧状連結）は、連続像と直積に伝わり、部分空間と直和には伝わらない。

例外として、正規性・リンデレーフ性・パラコンパクト性は「被覆の性質」寄りなのに有限直積でさえ壊れる（ゾルゲンフライ平面、\ref{top:sorgenfrey-plane}）。この表を手で再現できるようになるには、型ごとの理由と、例外を作る少数の反例空間を覚えておけばよい。
:::

## 各欄の根拠 {#top:sec-pres-reasons}

::: remark 表の番号の説明 {#top:preservation-notes}
1. $T_{0}$・$T_{1}$ の部分空間と直積：\ref{top:pres-t0-t1} の 1。
2. \ref{top:hausdorff-properties} の 1。
3. 正則性の遺伝（\ref{top:regular-hereditary} の 1）と $T_{1}$ の遺伝（1）。
4. \ref{top:completely-regular-basic} の 3。
5. 正規空間の閉部分空間（\ref{top:regular-hereditary} の 2）と $T_{1}$ の遺伝（1）。
6. 欠けたチコノフの板 $T$ は、コンパクトハウスドルフ空間（したがって $T_{4}$ でパラコンパクト：\ref{top:compact-hausdorff-normal}）であるチコノフの板 $P$ の開部分空間だが、正規でない（\ref{top:tychonoff-plank-not-normal}）。パラコンパクト空間は正規なので（\ref{top:paracompact-normal}）、$T$ はパラコンパクトでもない。
7. ゾルゲンフライ直線 $\R_{\ell}$ は $T_{4}$（\ref{top:sorgenfrey-normal}, \ref{top:sorgenfrey-basic}）、リンデレーフ（\ref{top:sorgenfrey-lindelof}）、パラコンパクト（\ref{top:sorgenfrey-paracompact}）だが、$\R_{\ell}\times\R_{\ell}$ はリンデレーフでも正規でもない（\ref{top:sorgenfrey-plane}）。正規でないのでパラコンパクトでもない。
8. 直和：\ref{top:pres-sum}。:partial: の条件は、コンパクト・可算コンパクト・点列コンパクトは有限個の直和、リンデレーフ・第二可算・可分は可算個の直和なら :yes: で、空でない因子がそれより多いと :no: である。連結・弧状連結は空でない因子が 2 個以上あると :no:。
9. $(0,1)$ は $[0,1]$ の開部分空間だが、コンパクトでも可算コンパクトでもない（被覆 $\{(1/n,1)\}_{n\ge2}$ が有限部分被覆をもたない）。点列コンパクトでもない（点列 $1/n$ は $(0,1)$ で収束する部分列をもたない）。
10. 閉部分空間：\ref{top:compact-basic} の 1。有限直積：\ref{top:heine-borel}。任意個の直積：チコノフの定理（\ref{top:tychonoff}。選択公理を使う。チコノフの定理は選択公理と同値：\ref{top:tychonoff-implies-ac}）。
11. \ref{top:pres-subspaces}。
12. 可算コンパクト空間二つの直積で可算コンパクトでないものがある（\ref{top:fact-countably-compact-product}。このサイトでは構成を扱っていない）。一方の因子がコンパクトなら直積は可算コンパクトであることが知られている（同じ出典）。
13. 可算直積：\ref{top:pres-countable-products} の 4。任意個の直積：$\{0,1\}^{\mathcal{P}(\N)}$ はコンパクトだが点列コンパクトでない（\ref{top:compactness-variants-examples} の 2）。
14. $\mathbb{Q}$ は LCH である $\R$ の部分空間だが、局所コンパクトでも完備距離化可能でもない（\ref{top:pres-rationals}）。また、離散空間 $\mathbb{Q}_{\mathrm{disc}}$ から $\mathbb{Q}$ への恒等写像は連続な全射で、$\mathbb{Q}_{\mathrm{disc}}$ は LCH で完備距離化可能（離散距離は完備）なので、連続像の欄も :no: になる。
15. \ref{top:pres-large-products}：非可算個の、二点以上の $T_{1}$ 空間の直積は第一可算でない（したがって第二可算でも距離化可能でもない）。無限個の非コンパクト空間の直積（例 $\R^{\N}$）は局所コンパクトでない。
16. $[0,\omega_{1}]$ はコンパクトだが、その開部分空間 $[0,\omega_{1})$ はリンデレーフでない（\ref{top:pres-omega-one}）。
17. $\{0,1\}$ は $\R$ の閉部分空間で、$(0,1)\cup(2,3)$ は開部分空間だが、どちらも連結でない（したがって弧状連結でない）。
18. \ref{top:connected-preservation} の 4（無限個の直積を含む）。
19. \ref{top:pres-path-products}。
20. $S\defeq\{0\}\cup\{1/n:n\ge1\}$ は $\R$ の閉部分空間だが、$0$ で局所連結でない（\ref{top:pres-subspaces} の 7）。
21. 有限直積は :yes:。無限直積 $\prod_{i}X_{i}$ が局所連結であることと、各 $X_{i}$ が局所連結で、有限個を除くすべての $X_{i}$ が連結であることは同値である（\ref{top:pres-locally-connected-products}）。たとえば $\{0,1\}^{\N}$（カントール集合と同相）は局所連結でない。
22. 部分空間：第一可算・第二可算は、基本近傍系や開基を部分空間に制限すればよい（\ref{top:subspace-basic} の 3）。距離化可能性は距離を制限すればよい。
23. \ref{top:pres-countable-products}。
24. ニェミツキ平面は可分（\ref{top:niemytzki-separable} の 1）だが、その閉部分空間である境界線 $L$ は非可算な離散空間（同じ命題の 2）で、可分でない。
25. 可分空間の、連続体濃度 $\mathfrak{c}$ 個以下の直積は可分である（\ref{top:fact-hmp}）。逆に、二つの交わらない空でない開集合をもつ空間（たとえば二点以上のハウスドルフ空間）を $\mathfrak{c}$ 個より多く掛けた直積は可分でない（\ref{top:pres-large-products} の 3）。
26. 可算直積：\ref{top:countable-product-metrizable}。
27. 開部分空間：\ref{top:open-subset-complete-metric}（より一般に $G_{\delta}$ 集合：\ref{top:alexandroff-gdelta}）。閉部分空間：\ref{top:complete-closed} の 1。
28. 剰余空間 $\R/\mathbb{Q}$ は、$\R$ からの開な商写像の像で、密着空間である（\ref{top:pres-coset-space}）。二点以上の密着空間は $T_{0}$ でない。$\R$ は距離化可能なので、この例は $T_{0}$ から $T_{4}$ までのすべての分離公理について、商・連続像・開連続像の欄を :no: にする。
29. \ref{top:pres-t0-closed}。
30. $T_{1}$：\ref{top:pres-t0-t1} の 2。$T_{4}$：閉な連続全射は正規性と $T_{1}$ を保つ（\ref{top:perfect-preserves} の 2）。
31. 二つの原点をもつ直線（\ref{top:quotient-not-hausdorff} の 2）は、距離化可能な空間 $\R\times\{0,1\}$ の開な商写像の像（\ref{top:pres-two-origins}）で、ハウスドルフでない。したがってハウスドルフ性を含む性質（ハウスドルフ・$T_{3}$・チコノフ・LCH・パラコンパクト・距離化可能・完備距離化可能）はどれも商・連続像・開連続像で保たれない。
32. ゾルゲンフライ平面で、分離できない交わらない閉集合を二点に潰す（\ref{top:pres-collapse}）。もとの空間はチコノフ空間だが、像はハウスドルフでない。
33. ハウスドルフ・正則・LCH・第二可算は完全写像の像に伝わる（\ref{top:perfect-preserves}）。$T_{3}$ は正則と $T_{1}$（30）から。
34. コンパクト：\ref{top:compact-basic} の 2。連結：\ref{top:connected-preservation} の 1。それ以外（可算コンパクト・点列コンパクト・リンデレーフ・弧状連結・可分）：\ref{top:pres-images} の 1。商写像・開写像・閉写像・完全写像はどれも連続な全射なので、連続像の欄が :yes: なら残りもすべて :yes: である。
35. $\R$ の整数全体を一点に潰した $\R/\Z$（\ref{top:pres-r-mod-z}）は、$\R$ の閉な商写像の像だが、第一可算でも局所コンパクトでもない（したがって第二可算でも距離化可能でもない）。
36. 閉な連続全射はパラコンパクト性を保つ（マイケルの定理、\ref{top:fact-michael-closed-image}。このサイトでは未証明）。
37. 筆者は確かめていない。完全写像の一般論は \ref{top:page-perfect-maps} にある。
38. 局所連結性は商写像の像に伝わる（\ref{top:quotient-locally-connected}）。開写像・閉写像である連続全射は商写像である（\ref{top:quotient-map-criteria}）。連続像の反例：離散空間 $\N$ から $S=\{0\}\cup\{1/n:n\ge1\}$ への全単射は連続だが、$S$ は局所連結でない（20）。
39. \ref{top:pres-images} の 2。
40. 可分距離空間の完全像は距離化可能である（\ref{top:perfect-image-metrizable}）。可分でない一般の距離空間でも成り立つ（\ref{top:fact-morita-hanai-stone}）。
41. $X$ が完備距離化可能で $f\colon X\to Y$ が完全写像なら、$Y$ は距離化可能（40）、$X$ はチェック完備（\ref{top:cech-complete-metric}）、チェック完備性は完全写像の像に伝わる（\ref{top:fact-perfect-cech}）ので、$Y$ はチェック完備な距離化可能空間、すなわち完備距離化可能である（\ref{top:cech-complete-metric}）。
:::

## 短い主張の証明 {#top:sec-pres-proofs}

::: proposition $T_{0}$ と $T_{1}$ の遺伝 {#top:pres-t0-t1 keywords="T0 and T1 are hereditary and productive; closed images of T1 spaces are T1" index="T₁ の遺伝|てぃーわんのいでん"}
1. $T_{0}$ 空間（$T_{1}$ 空間）の部分空間と、任意個の直積は $T_{0}$（$T_{1}$）である。
2. $X$ が $T_{1}$ で $f\colon X\to Y$ が閉な連続全射なら、$Y$ は $T_{1}$ である。
:::

::: proof
**Step 1（部分空間）.** $A\subseteq X$ の異なる二点 $x,y$ について、$X$ の開集合 $U$ が一方だけを含めば、$A$ の開集合 $U\cap A$ も同じ一方だけを含む。

**Step 2（直積）.** $x\neq y$ を $\prod_{i}X_{i}$ の二点とすると、ある $i$ で $x_{i}\neq y_{i}$。$X_{i}$ の開集合 $U$ が $x_{i}$ と $y_{i}$ の一方だけを含めば、$\pi_{i}^{-1}(U)$ は開集合（射影の連続性、\ref{top:product-maps}）で、$x$ と $y$ の同じ一方だけを含む。$T_{1}$ の場合は、役割を入れ替えた開集合も同じように得られる。

**Step 3（閉写像）.** $y\in Y$ について $y=f(x)$ となる $x$ をとる。$\{x\}$ は閉集合（\ref{top:separation-implications} の 1）なので $\{y\}=f[\{x\}]$ は閉集合（$f$ が閉写像）。すべての一点集合が閉なので $Y$ は $T_{1}$（同じ命題の 1）。

::: hypcheck
- **Step 3 の「閉写像」**：外すと偽：$\R/\mathbb{Q}$（\ref{top:pres-coset-space}）は $\R$ の開な商写像の像だが $T_{1}$ でない。
- **Step 3 の「$T_{1}$」**：$T_{0}$ に弱めると偽（\ref{top:pres-t0-closed}）。
:::
:::

::: proposition 直和で保たれる性質 {#top:pres-sum keywords="topological sum (disjoint union, coproduct) of spaces: which properties are preserved" index="直和（位相空間）|ちょくわいそうくうかん, 位相和|いそうわ"}
$X=\bigsqcup_{i\in I}X_{i}$ を空でない空間の直和とする。
1. 各 $X_{i}$ が $T_{0}$・$T_{1}$・ハウスドルフ・$T_{3}$・チコノフ・$T_{4}$・LCH・局所連結・第一可算・パラコンパクト・距離化可能・完備距離化可能なら、$X$ もそうである（$T_{4}$・パラコンパクト・距離化可能・完備距離化可能は選択公理を使う）。
2. $I$ が有限なら、コンパクト・可算コンパクト・点列コンパクトは $X$ に伝わる。$I$ が可算なら、リンデレーフ・第二可算・可分は $X$ に伝わる。
3. $I$ が無限なら $X$ は可算コンパクトでなく（したがってコンパクトでも点列コンパクトでもなく）、$I$ が非可算なら $X$ はリンデレーフでも第二可算でも可分でもない。$I$ が 2 個以上なら $X$ は連結でない。
:::

::: proof
**Step 0（準備）.** 各 $X_{i}$ は $X$ の開集合で、補集合 $\bigsqcup_{j\neq i}X_{j}$ も開なので閉集合でもある。$X_{i}$ の $X$ からの相対位相はもとの位相に一致する（$U\subseteq X_{i}$ が $X$ で開 $\iff$ $X_{i}$ で開）。したがって $x\in X_{i}$ の $X_{i}$ での近傍は $X$ での近傍でもある。

**Step 1（点ごとの性質）.** $T_{0}$・$T_{1}$・ハウスドルフについて：同じ $X_{i}$ の二点は $X_{i}$ の開集合（$X$ でも開）で分けられ、別の $X_{i},X_{j}$ の二点は開集合 $X_{i},X_{j}$ で分けられる。LCH・局所連結・第一可算は各点の近傍についての条件なので、Step 0 から $X_{i}$ での性質がそのまま $X$ での性質になる（LCH のハウスドルフ性は前半から）。

**Step 2（正則・完全正則）.** $F$ を閉集合、$x\notin F$, $x\in X_{i}$ とする。$F\cap X_{i}$ は $X_{i}$ の閉集合なので、$X_{i}$ の交わらない開集合 $U\ni x$, $V\supseteq F\cap X_{i}$ がある。$U$ と $V\cup(X\setminus X_{i})$ は $X$ の交わらない開集合で、それぞれ $x$ と $F$ を含む。完全正則性については、$X_{i}$ 上の連続関数 $g$ で $g(x)=0$, $g[F\cap X_{i}]\subseteq\{1\}$ となるものをとり、$X_{i}$ の外では $1$ とすれば、各 $X_{j}$ 上で連続なので $X$ 上で連続である。

**Step 3（正規・パラコンパクト）.** 交わらない閉集合 $F,G$ について、各 $i$ で $F\cap X_{i}$, $G\cap X_{i}$ を分ける $X_{i}$ の開集合 $U_{i},V_{i}$ を選び（選択公理）、$\bigcup_{i}U_{i}$, $\bigcup_{i}V_{i}$ をとる。パラコンパクト性：開被覆 $\mathcal{U}$ について、各 $i$ で $\{U\cap X_{i}:U\in\mathcal{U}\}$ の局所有限な開細分 $\mathcal{V}_{i}$ を選び（選択公理）、$\mathcal{V}\defeq\bigcup_{i}\mathcal{V}_{i}$ とする。$x\in X_{i}$ の近傍 $W\subseteq X_{i}$ で $\mathcal{V}_{i}$ の有限個の元としか交わらないものをとると、$W$ は他の $\mathcal{V}_{j}$ の元と交わらないので、$\mathcal{V}$ は局所有限である。

**Step 4（距離）.** 各 $X_{i}$ の位相を定める距離 $d_{i}$ を選び（選択公理）、$x,y\in X_{i}$ なら $d(x,y)\defeq\min\{1,d_{i}(x,y)\}$、別の成分なら $d(x,y)\defeq1$ とする。三角不等式は、三点が同じ成分にあれば $\min\{1,\cdot\}$ が三角不等式を保つことから、そうでなければ右辺が $1$ 以上になることから従う。半径 $r<1$ の球は一つの成分の中の $\min\{1,d_{i}\}$ の球で、$d_{i}$ の球と同じなので、$d$ は直和の位相を定める。$d_{i}$ がすべて完備なら $d$ も完備：コーシー列は十分先で $d<1$ となるので一つの成分に入り、そこで $d_{i}$ についてコーシー列で収束する。

**Step 5（2）.** $I$ が有限のとき：開被覆の各 $X_{i}$ への制限は有限部分被覆をもち（コンパクトの場合）、その有限個の和が $X$ の有限部分被覆になる。可算コンパクトでも同じ。点列 $(x_{n})$ は、ある $X_{i}$ に無限個の項をもつので、その部分列が $X_{i}$ で（したがって $X$ で）収束する部分列をもつ。$I$ が可算のとき：可算個の可算部分被覆、可算基、可算稠密集合の和はそれぞれ可算である（可算選択公理）。

**Step 6（3）.** $\{X_{i}\}_{i\in I}$ は交わらない空でない開集合からなる被覆で、どの真部分族も被覆しない。$I$ が無限なら、可算無限個の $X_{i_{n}}$ と残りの和 $\bigcup_{i\neq i_{n}}X_{i}$ からなる可算被覆に有限部分被覆がない。$I$ が非可算なら可算部分被覆がない。開基は各 $X_{i}$ の部分集合を少なくとも一つ含む（$X_{i}$ が開で空でないから）ので、開基は非可算個の元をもつ。稠密集合は各 $X_{i}$ と交わるので非可算。$I$ が 2 個以上なら、$X_{i}$ と $X\setminus X_{i}$ が交わらない空でない開集合である。

::: hypcheck
- **「各 $X_{i}$ は空でない」**：Step 6 で使った。空の因子は直和に影響しないので、本質的な仮定ではない。
- **選択公理**：Step 3, 4 で、各成分の分離する開集合・細分・距離を一斉に選ぶのに使った。成分ごとに標準的な選び方がある場合（たとえば距離が与えられている場合）は不要である。
:::
:::

::: proposition 部分空間についての補足 {#top:pres-subspaces keywords="closed subspaces of countably compact, sequentially compact, Lindelof, paracompact spaces; open and closed subspaces of locally compact Hausdorff spaces; open subspaces of separable and locally connected spaces" index="閉部分空間への遺伝|へいぶぶんくうかんへのいでん"}
1. 可算コンパクト空間・リンデレーフ空間の閉部分空間は、それぞれ可算コンパクト・リンデレーフである。
2. 点列コンパクト空間の閉部分空間は点列コンパクトである。
3. パラコンパクト空間の閉部分空間はパラコンパクトである。
4. LCH の開部分空間と閉部分空間は LCH である。LCH の有限直積は LCH である。
5. 可分空間の開部分空間は可分である。
6. 局所連結空間の開部分空間は局所連結である。
7. $S\defeq\{0\}\cup\{1/n:n\ge1\}\subseteq\R$ は閉集合で、点 $0$ で局所連結でない。
:::

::: proof
**Step 1（1）.** $F\subseteq X$ を閉集合とし、$F$ の開集合による可算被覆を $\{U_{n}\cap F\}$（$U_{n}$ は $X$ の開集合）とする。$\{U_{n}\}\cup\{X\setminus F\}$ は $X$ の可算開被覆なので有限部分被覆をもち、そこから $X\setminus F$ を除いて $F$ と交われば $F$ の有限部分被覆になる。リンデレーフ性も、任意の開被覆と可算部分被覆について同じ議論をする。

**Step 2（2）.** $F$ の点列 $(x_{n})$ は $X$ で収束する部分列 $x_{n_{k}}\to x$ をもつ。$x$ の任意の近傍は $F$ の点 $x_{n_{k}}$ を含むので $x\in\overline{F}=F$（\ref{top:closure-neighborhood}）で、$F$ の中で収束する（\ref{top:subspace-basic}）。

**Step 3（3）.** $F$ の開被覆 $\{U_{\lambda}\cap F\}_{\lambda}$（$U_{\lambda}$ は $X$ の開集合）をとる。$\mathcal{U}\defeq\{U_{\lambda}\}_{\lambda}\cup\{X\setminus F\}$ は $X$ の開被覆なので、局所有限な開細分 $\mathcal{V}$ がある。$\mathcal{V}_{F}\defeq\{V\cap F:V\in\mathcal{V},\ V\cap F\neq\emptyset\}$ を考える。$V\cap F\neq\emptyset$ なら $V\not\subseteq X\setminus F$ なので、細分の条件から $V\subseteq U_{\lambda}$ となる $\lambda$ があり、$V\cap F\subseteq U_{\lambda}\cap F$。$\mathcal{V}_{F}$ は $F$ を覆い（$\mathcal{V}$ が $X$ を覆うので）、$F$ の開集合からなり、局所有限である（$x\in F$ の $X$ での近傍 $W$ が $\mathcal{V}$ の有限個としか交わらなければ、$W\cap F$ は $\mathcal{V}_{F}$ の有限個としか交わらない）。ハウスドルフ性は部分空間に遺伝する（\ref{top:hausdorff-properties}）。

**Step 4（4）.** $X$ を LCH とする。開部分空間 $W$ と $x\in W$ について、\ref{top:lch-neighborhood-base} から開集合 $U$ で $x\in U\subseteq\overline{U}\subseteq W$, $\overline{U}$ コンパクトなものがある。$\overline{U}$ は $W$ の中の $x$ のコンパクトな近傍である。閉部分空間 $F$ と $x\in F$ について、$x$ のコンパクトな近傍 $K$ をとると、$K\cap F$ は $K$ の閉部分集合なのでコンパクト（\ref{top:compact-basic} の 1）で、$F$ での $x$ の近傍である。直積：$x_{1},x_{2}$ のコンパクトな近傍 $K_{1},K_{2}$ について $K_{1}\times K_{2}$ はコンパクト（\ref{top:heine-borel}）で $(x_{1},x_{2})$ の近傍。ハウスドルフ性は部分空間・直積に遺伝する。

**Step 5（5）.** $D$ を可算稠密集合、$U$ を開集合とする。$U$ の空でない開集合 $V$ は $X$ でも開なので $D$ と交わる。よって $D\cap U$ は $U$ で稠密（\ref{top:dense-characterization}）で可算。

**Step 6（6）.** $x\in U$（$U$ は開）と、$U$ での $x$ の近傍 $N$ をとる。$U$ が開なので $N$ は $X$ でも $x$ の近傍で、連結な開集合 $V$ で $x\in V\subseteq N$ となるものがある。$V$ は $U$ でも開。

**Step 7（7）.** $S$ の補集合は開区間の和 $(-\infty,0)\cup\bigcup_{n}(1/(n+1),1/n)\cup(1,\infty)$ なので $S$ は閉集合。$S$ の連結部分集合は $\R$ の連結集合なので区間（\ref{top:connected-intervals}）で、二点以上を含む区間は非可算だが $S$ は可算なので、一点集合である。点 $0$ の $S$ での近傍 $S$ に含まれる $0$ を含む連結な開集合は $\{0\}$ だけだが、$\{0\}$ は $S$ で開でない（$1/n\to0$）。

::: hypcheck
- **「閉」部分空間**（1〜3）：外すと偽：$(0,1)\subseteq[0,1]$（備考 9）、$[0,\omega_{1})\subseteq[0,\omega_{1}]$（\ref{top:pres-omega-one}）、欠けたチコノフの板（備考 6）。
- **「開」部分空間**（5, 6）：外すと偽（備考 24, 20）。
- **4 のハウスドルフ性**：Step 4 で \ref{top:lch-neighborhood-base} を使うのに必要だった。
:::
:::

::: proposition 連続像と開写像の像 {#top:pres-images keywords="continuous images of countably compact, sequentially compact, Lindelof, path-connected, separable spaces; open images of first and second countable spaces" index="連続像の性質|れんぞくぞうのせいしつ, 開写像の像|かいしゃぞうのぞう"}
$f\colon X\to Y$ を連続な全射とする。
1. $X$ が可算コンパクト・点列コンパクト・リンデレーフ・弧状連結・可分なら、$Y$ もそうである。
2. さらに $f$ が開写像なら、$X$ が第一可算（第二可算）のとき $Y$ も第一可算（第二可算）である。
:::

::: proof
**Step 1（被覆の性質）.** $Y$ の開被覆 $\{U_{\lambda}\}$ の逆像 $\{f^{-1}(U_{\lambda})\}$ は $X$ の開被覆である。$X$ が可算コンパクト（リンデレーフ）なら、被覆が可算のとき有限部分被覆（任意の被覆の可算部分被覆）$\{f^{-1}(U_{\lambda_{k}})\}$ があり、$f$ が全射なので $Y=f[X]=\bigcup_{k}U_{\lambda_{k}}$。

**Step 2（点列コンパクト）.** $Y$ の点列 $(y_{n})$ について $f(x_{n})=y_{n}$ となる $x_{n}$ を選ぶ（可算選択公理）。部分列 $x_{n_{k}}\to x$ があり、$f$ が連続なので $y_{n_{k}}=f(x_{n_{k}})\to f(x)$。

**Step 3（弧状連結）.** $y,y'\in Y$ について $f(x)=y$, $f(x')=y'$ とし、$x$ から $x'$ への道 $\gamma$ をとれば、$f\circ\gamma$ は $y$ から $y'$ への道。

**Step 4（可分）.** $D$ を $X$ の可算稠密集合とすると、$Y=f[X]=f[\overline{D}]\subseteq\overline{f[D]}$（\ref{top:continuity-equivalents} の 4）。$f[D]$ は可算。

**Step 5（開写像と第一可算）.** $y\in Y$ と $f(x)=y$ となる $x$ をとり、$x$ の可算な基本近傍系を開集合 $\{V_{n}\}$ からなるようにとる（基本近傍系の各元の内部をとればよい）。$\{f[V_{n}]\}$ は $y$ の開近傍の族である（$f$ は開写像）。$y$ の近傍 $W$ について $f^{-1}(W)$ は $x$ の近傍なので $V_{n}\subseteq f^{-1}(W)$ となる $n$ があり、$f[V_{n}]\subseteq W$。よって $\{f[V_{n}]\}$ は $y$ の基本近傍系。

**Step 6（開写像と第二可算）.** $\mathcal{B}$ を $X$ の可算な開基とすると、$\{f[B]:B\in\mathcal{B}\}$ は $Y$ の開集合の可算族である。$Y$ の開集合 $W$ と $y\in W$ について、$f(x)=y$ となる $x$ と、$x\in B\subseteq f^{-1}(W)$ となる $B\in\mathcal{B}$ をとれば、$y\in f[B]\subseteq W$。よって開基である。

::: hypcheck
- **「開写像」**（2）：外すと偽：$\R/\Z$（\ref{top:pres-r-mod-z}）は第二可算な $\R$ の閉な商写像の像だが、第一可算でない。
- **可算選択公理**：Step 2 で使った。Step 1, 3, 4 は選択公理を使わない（Step 1 の部分被覆は $X$ 側で与えられる）。
:::
:::

::: proposition 可算直積で保たれる性質 {#top:pres-countable-products keywords="countable products of first countable, second countable, separable, sequentially compact, completely metrizable spaces" index="可算直積|かさんちょくせき"}
$X=\prod_{n\ge1}X_{n}$ を空でない空間の可算直積とする（有限直積も同じ証明で扱える）。
1. 各 $X_{n}$ が第一可算なら $X$ も第一可算。
2. 各 $X_{n}$ が第二可算なら $X$ も第二可算。
3. 各 $X_{n}$ が可分なら $X$ も可分。
4. 各 $X_{n}$ が点列コンパクトなら $X$ も点列コンパクト。
5. 各 $X_{n}$ が完備距離化可能なら $X$ も完備距離化可能。
:::

::: proof
各 $X_{n}$ の基本近傍系・開基・可算稠密集合・完備な距離を一斉に選ぶのに、可算選択公理を使う。

**Step 1（1）.** $x\in X$ と、各 $x_{n}$ の可算な基本近傍系 $\{V_{n,k}\}_{k}$ をとる。有限列 $(k_{1},\dots,k_{m})$ ごとに
$$
W_{k_{1}\dots k_{m}}\defeq V_{1,k_{1}}\times\cdots\times V_{m,k_{m}}\times\prod_{n>m}X_{n}
$$
とおくと、これは可算族で、各元は $x$ の近傍（直積位相の基本開集合 \ref{top:product-base} の内部を含む）である。$x$ の任意の近傍は基本開集合 $\prod_{n}U_{n}$（$n>m$ で $U_{n}=X_{n}$）を含み、各 $n\le m$ で $V_{n,k_{n}}\subseteq U_{n}$ となる $k_{n}$ をとれば $W_{k_{1}\dots k_{m}}\subseteq\prod_{n}U_{n}$。

**Step 2（2）.** 各 $X_{n}$ の可算な開基 $\mathcal{B}_{n}$ について、$B_{1}\times\cdots\times B_{m}\times\prod_{n>m}X_{n}$（$B_{n}\in\mathcal{B}_{n}$）の全体は可算で、Step 1 と同じ議論で開基になる。

**Step 3（3）.** 点 $a\in X$ を一つ固定し、$D_{n}$ を $X_{n}$ の可算稠密集合とする。$D\defeq\{x\in X:\ \text{ある } m \text{ について、}n\le m\text{ で }x_{n}\in D_{n},\ n>m\text{ で }x_{n}=a_{n}\}$ は可算集合の可算和なので可算である。空でない基本開集合 $\prod_{n}U_{n}$（$n>m$ で $U_{n}=X_{n}$）について、$d_{n}\in D_{n}\cap U_{n}$（$n\le m$）を選び $n>m$ で $a_{n}$ とした点は $D$ に属し、この基本開集合に入る。よって $D$ は稠密。

**Step 4（4、対角線論法）.** $X$ の点列 $(x^{(k)})_{k}$ をとる。第 1 座標の点列は収束する部分列をもつので、添字の無限集合 $N_{1}\subseteq\N$ で $(x^{(k)}_{1})_{k\in N_{1}}$ が収束するものがある。帰納的に $N_{n+1}\subseteq N_{n}$ で $(x^{(k)}_{n+1})_{k\in N_{n+1}}$ が収束するものを選ぶ（DC）。$k_{n}\defeq N_{n}$ の第 $n$ 番目の元とすると、$k_{1}<k_{2}<\cdots$ で、各 $n$ について $(k_{j})_{j\ge n}$ は $N_{n}$ の部分列なので、$(x^{(k_{j})}_{n})_{j}$ は収束する。直積位相での収束は座標ごとの収束と同値（\ref{top:product-universal} と \ref{top:net-continuity}）なので、$(x^{(k_{j})})_{j}$ は $X$ で収束する。

**Step 5（5）.** 各 $X_{n}$ の位相を定める完備な距離 $d_{n}$ をとり、\ref{top:countable-product-metrizable} の距離 $d(x,y)=\sum_{n}2^{-n}\min\{1,d_{n}(x_{n},y_{n})\}$ を考える。これは直積位相を定める。$(x^{(k)})$ が $d$ についてコーシー列なら、各 $n$ について $\min\{1,d_{n}(x^{(k)}_{n},x^{(l)}_{n})\}\le2^{n}d(x^{(k)},x^{(l)})$ なので、$(x^{(k)}_{n})_{k}$ は $d_{n}$ についてコーシー列で、ある $x_{n}$ に収束する。$x\defeq(x_{n})$ について、座標ごとの収束から直積位相で $x^{(k)}\to x$、すなわち $d$ について収束する。

::: hypcheck
- **「可算」直積**：Step 1〜3, 5 で可算性を使った（有限列の全体が可算、可算和が可算、重み $2^{-n}$ の和が有限）。非可算個では 1, 2, 5 が偽、3 は \ref{top:fact-hmp} により連続体濃度個まで成り立つ（\ref{top:pres-large-products}）。
- **Step 4**：点列でなく一般のネットでは、この論法は使えない。非可算個の直積で点列コンパクト性が壊れる例は \ref{top:compactness-variants-examples} の 2。
:::
:::

::: proposition 大きな直積で壊れる性質 {#top:pres-large-products keywords="uncountable products are not first countable; infinite products of noncompact spaces are not locally compact; products of more than continuum many spaces are not separable" index="非可算直積|ひかさんちょくせき"}
$X=\prod_{i\in I}X_{i}$ とする。
1. $I$ が非可算で、各 $X_{i}$ が二点以上の $T_{1}$ 空間なら、$X$ は第一可算でない。
2. 無限個の $X_{i}$ がコンパクトでない（空でない）なら、$X$ は局所コンパクトでない。とくに $\R^{\N}$ は局所コンパクトでない。
3. （AC）各 $X_{i}$ が交わらない空でない開集合 $U_{i},V_{i}$ をもち、$X$ が可分なら、$I$ の濃度は $2^{\aleph_{0}}$ 以下である。
:::

::: proof
**Step 1（1）.** $x\in X$ が可算な基本近傍系 $\{W_{k}\}$ をもつとする。各 $W_{k}$ は $x$ を含む基本開集合を含み、その基本開集合が制限する座標の有限集合を $F_{k}$ とする。$J\defeq\bigcup_{k}F_{k}$ は可算なので、$i\in I\setminus J$ がある。$X_{i}$ の点 $y\neq x_{i}$ をとると、$U\defeq X_{i}\setminus\{y\}$ は $x_{i}$ を含む開集合（$T_{1}$）。$\pi_{i}^{-1}(U)$ は $x$ の近傍なので、ある $W_{k}\subseteq\pi_{i}^{-1}(U)$。しかし $W_{k}$ に含まれる基本開集合は座標 $i$ を制限しないので、$i$ 座標が $y$ の点を含み、その点は $\pi_{i}^{-1}(U)$ に入らない。矛盾。

**Step 2（2）.** $x$ がコンパクトな近傍 $K$ をもつとする。$K$ は基本開集合 $\prod_{i}U_{i}$（有限集合 $F$ の外で $U_{i}=X_{i}$）を含む。仮定から $X_{j}$ が非コンパクトな $j\notin F$ がある。射影 $\pi_{j}$ は連続なので $\pi_{j}[K]$ はコンパクト（\ref{top:compact-basic} の 2）だが、$\pi_{j}[K]\supseteq\pi_{j}\bigl[\prod_{i}U_{i}\bigr]=X_{j}$ なので $\pi_{j}[K]=X_{j}$ となり矛盾。

**Step 3（3）.** $D$ を可算稠密集合とし、$\varphi(i)\defeq D\cap\pi_{i}^{-1}(U_{i})$ とおく。$i\neq j$ とする。開集合 $\pi_{i}^{-1}(U_{i})\cap\pi_{j}^{-1}(V_{j})$ は空でない（座標 $i,j$ だけを制限する）ので、$D$ の点 $d$ を含む。$d\in\varphi(i)$ だが、$d_{j}\in V_{j}$ で $U_{j}\cap V_{j}=\emptyset$ だから $d\notin\varphi(j)$。よって $\varphi\colon I\to\mathcal{P}(D)$ は単射で、$\lvert I\rvert\le\lvert\mathcal{P}(D)\rvert\le2^{\aleph_{0}}$。

::: hypcheck
- **1 の「非可算」**：可算なら第一可算（\ref{top:pres-countable-products} の 1）。**「二点以上の $T_{1}$」**：Step 1 で $x_{i}$ を含む真の開集合を作るのに使った。一点空間をいくら掛けても一点である。
- **2 の「無限個」**：有限個なら、LCH の有限直積は LCH（\ref{top:pres-subspaces} の 4）。
- **選択公理**：Step 3 で $U_{i},V_{i}$ を一斉に選ぶのに使った。
:::
:::

::: fact ヒューイット–マルチェフスキー–ポンジチェリの定理 {#top:fact-hmp keywords="Hewitt-Marczewski-Pondiczery theorem: product of at most continuum many separable spaces is separable" index="ヒューイット–マルチェフスキー–ポンジチェリの定理|ひゅーいっとまるちぇふすきーぽんじちぇりのていり"}
可分空間の、$2^{\aleph_{0}}$ 個以下の直積は可分である（出典：R. Engelking, *General Topology*）。
:::

::: proposition 局所連結性と直積 {#top:pres-locally-connected-products keywords="a product of spaces is locally connected iff each factor is locally connected and all but finitely many are connected" index="局所連結空間の直積|きょくしょれんけつくうかんのちょくせき"}
空でない空間の直積 $X=\prod_{i\in I}X_{i}$ が局所連結であることと、各 $X_{i}$ が局所連結で、有限個を除くすべての $X_{i}$ が連結であることは同値である。
:::

::: proof
**Step 1（⇒）.** 射影 $\pi_{i}$ は開な連続全射（基本開集合の像は開）なので商写像で（\ref{top:quotient-map-criteria}）、$X_{i}$ は局所連結（\ref{top:quotient-locally-connected}）。点 $x$ と近傍 $X$ について、連結な開集合 $V\ni x$ がある。$V$ は基本開集合を含み、それは有限集合 $F$ の外の座標を制限しない。$i\notin F$ について $\pi_{i}[V]\supseteq X_{i}$ なので $\pi_{i}[V]=X_{i}$ で、これは連結空間の連続像なので連結（\ref{top:connected-preservation} の 1）。

**Step 2（⇐）.** $G$ を連結でない $X_{i}$ の添字の有限集合とする。$x\in X$ とその近傍 $N$ をとり、$N$ に含まれる基本開集合 $\prod_{i}U_{i}\ni x$（有限集合 $F$ の外で $U_{i}=X_{i}$）をとる。$i\in F$ では $x_{i}\in V_{i}\subseteq U_{i}$ となる連結な開集合 $V_{i}$、$i\in G\setminus F$ では $x_{i}\in V_{i}$ となる連結な開集合 $V_{i}$（近傍 $X_{i}$ に対して局所連結性を使う）、それ以外では $V_{i}\defeq X_{i}$（連結）とする。$V\defeq\prod_{i}V_{i}$ は $F\cup G$ の外の座標を制限しないので開集合で、連結空間の直積なので連結（\ref{top:connected-preservation} の 4）、$x\in V\subseteq N$。

::: hypcheck
- **「有限個を除いて連結」**：Step 2 で $V$ が開集合になるために使った。$\{0,1\}^{\N}$ は各因子が局所連結（離散）だが、局所連結でない（Step 1 の議論で、どの連結な開集合も、ある座標から先で射影が $\{0,1\}$ 全体になるはずだが、$\{0,1\}$ は連結でない）。
:::
:::

::: proposition 弧状連結性と直積 {#top:pres-path-products keywords="products of path-connected spaces are path-connected" index="弧状連結空間の直積|こじょうれんけつくうかんのちょくせき"}
（AC）弧状連結空間の直積は弧状連結である。
:::

::: proof
$x,y\in\prod_{i}X_{i}$ について、各 $i$ で $x_{i}$ から $y_{i}$ への道 $\gamma_{i}$ を選ぶ（選択公理）。$\gamma(t)\defeq(\gamma_{i}(t))_{i}$ は、各座標が連続なので直積の普遍性（\ref{top:product-universal}）から連続で、$x$ から $y$ への道である。

::: hypcheck
- **選択公理**：道の選び方が標準的に決まる場合（たとえば $\R^{n}$ の凸集合で線分をとる）は不要である。
:::
:::

## 反例に使う空間 {#top:sec-pres-examples}

::: proposition 有理数の空間 {#top:pres-rationals keywords="Q is not locally compact and not completely metrizable" index="有理数の空間の性質|ゆうりすうのくうかんのせいしつ"}
$\mathbb{Q}$（$\R$ の部分空間）は局所コンパクトでなく、完備距離化可能でもない。
:::

::: proof
**Step 1（局所コンパクトでない）.** $q\in\mathbb{Q}$ がコンパクトな近傍 $K$ をもつとすると、$\varepsilon>0$ で $C\defeq[q-\varepsilon,q+\varepsilon]\cap\mathbb{Q}\subseteq K$ となるものがある。$C$ は $\mathbb{Q}$ の閉集合なので、$K$ の閉部分集合としてコンパクト（\ref{top:compact-basic} の 1）。無理数 $r\in(q-\varepsilon,q+\varepsilon)$ をとり、$U_{n}\defeq\{s\in C:\lvert s-r\rvert>1/n\}$ とおく。$U_{n}$ は $C$ の開集合で、$r\notin\mathbb{Q}$ なので $\bigcup_{n}U_{n}=C$。有限個の $U_{n}$ の和は $U_{N}$ の形だが、$r$ に $1/N$ より近い有理数が $C$ にあるので $C$ を覆わない。矛盾。

**Step 2（完備距離化可能でない）.** $\mathbb{Q}$ は孤立点をもたない（各点の近傍は他の有理数を含む）可算集合である。孤立点のない完備距離空間は非可算（\ref{top:perfect-complete-uncountable}）なので、$\mathbb{Q}$ の位相を定める完備な距離はない。

::: hypcheck
- Step 2 はベールのカテゴリー定理に基づく \ref{top:perfect-complete-uncountable} を使い、DC を使う。
:::
:::

::: proposition $[0,\omega_{1})$ はリンデレーフでない {#top:pres-omega-one keywords="the space of countable ordinals is not Lindelof; it is an open subspace of the compact space omega_1+1" index="ω₁ のリンデレーフ性|おめがわんのりんでれーふせい"}
$[0,\omega_{1}]$ はコンパクトで、$[0,\omega_{1})$ はその開部分空間だが、リンデレーフでない。
:::

::: proof
$[0,\omega_{1}]$ のコンパクト性は \ref{top:ordinal-compact}。$\{\omega_{1}\}$ はハウスドルフ空間（\ref{top:order-hausdorff}）の点なので閉集合で、補集合 $[0,\omega_{1})$ は開集合。$[0,\omega_{1})$ の開被覆 $\{[0,\alpha):\alpha<\omega_{1}\}$ の可算部分族 $\{[0,\alpha_{n})\}$ の和は $[0,\sup_{n}\alpha_{n})$ で、可算個の可算順序数の上限は可算順序数（$\omega_{1}$ の正則性。可算選択公理を使う）なので、$[0,\omega_{1})$ を覆わない。
:::

::: proposition 剰余空間 ℝ/ℚ {#top:pres-coset-space keywords="the coset space R/Q is indiscrete; the projection is an open quotient map" index="剰余空間 ℝ/ℚ|じょうよくうかんあーるぶんのきゅー"}
$x\sim y\iff x-y\in\mathbb{Q}$ による商空間 $\R/\mathbb{Q}$ について、射影 $\pi\colon\R\to\R/\mathbb{Q}$ は開写像で、$\R/\mathbb{Q}$ は非可算個の点をもつ密着空間（開集合が $\emptyset$ と全体だけ）である。とくに $T_{0}$ でない。
:::

::: proof
**Step 1（開写像）.** 開集合 $U\subseteq\R$ について $\pi^{-1}(\pi[U])=\bigcup_{q\in\mathbb{Q}}(U+q)$ は開集合の和なので開。商位相の定義から $\pi[U]$ は開。

**Step 2（密着）.** $W\subseteq\R/\mathbb{Q}$ を空でない開集合とすると、$\pi^{-1}(W)$ は空でない開集合なので開区間 $I$ を含み、$\pi^{-1}(W)$ は飽和しているので $I+\mathbb{Q}$ を含む。任意の $x\in\R$ について、$x-I$ は開区間なので有理数 $q$ を含み、$x-q\in I$, $x\in I+q$。よって $\pi^{-1}(W)=\R$、$W=\R/\mathbb{Q}$。

**Step 3（点の個数）.** 各同値類 $x+\mathbb{Q}$ は可算で、$\R$ は非可算なので、同値類は非可算個ある（可算個の可算集合の和は可算：可算選択公理）。二点以上の密着空間では、どの開集合も二点の両方を含むか両方を含まないので $T_{0}$ でない。
:::

::: proposition 二つの原点をもつ直線は開写像の像 {#top:pres-two-origins keywords="the line with two origins is an open quotient of two copies of the real line" index="二つの原点をもつ直線（開写像）|ふたつのげんてんをもつちょくせんかいしゃぞう"}
\ref{top:quotient-not-hausdorff} の 2 の商写像 $p\colon\R\times\{0,1\}\to L$ は開写像である。
:::

::: proof
$\sigma(x,e)\defeq(x,1-e)$ は $\R\times\{0,1\}$ の同相写像である。開集合 $U$ について、$p^{-1}(p[U])=U\cup\sigma\bigl[U\setminus\{(0,0),(0,1)\}\bigr]$。一点集合は閉（$\R\times\{0,1\}$ は距離化可能）なので $U\setminus\{(0,0),(0,1)\}$ は開、その $\sigma$ による像も開。よって $p^{-1}(p[U])$ は開で、$p[U]$ は開集合。
:::

::: proposition 閉写像で壊れる $T_{0}$ {#top:pres-t0-closed keywords="closed continuous images of T0 spaces need not be T0" index="T₀ と閉写像|てぃーぜろとへいしゃぞう"}
$\N$ に、$\emptyset$, $\N$, $\{0,1,\dots,n-1\}$（$n\ge1$）を開集合とする位相を入れた空間 $X$ は $T_{0}$ である。二点の密着空間 $Y=\{p,q\}$ への写像 $f(n)\defeq p$（$n$ 偶数）, $q$（$n$ 奇数）は閉な連続全射だが、$Y$ は $T_{0}$ でない。
:::

::: proof
**Step 1（位相）.** 挙げた集合の族は、任意の和（初期区間の和は初期区間か $\N$）と有限の共通部分（小さい方の初期区間）で閉じ、$\emptyset,\N$ を含むので位相である。

**Step 2（$T_{0}$）.** $m<n$ なら開集合 $\{0,\dots,n-1\}$ は $m$ を含み $n$ を含まない。

**Step 3（閉な連続全射）.** $Y$ は密着なので $f$ は連続。$X$ の閉集合は $\emptyset$, $\N$, $\{n,n+1,\dots\}$（$n\ge1$）で、その像は $\emptyset$, $Y$, $Y$（$\{n,n+1,\dots\}$ は偶数と奇数を含む）なので、すべて $Y$ の閉集合。
:::

::: remark
この $f$ のファイバー（偶数全体）は、開被覆 $\{\{0,\dots,2k\}\}_{k}$ が有限部分被覆をもたないのでコンパクトでなく、$f$ は完全写像でない。完全写像が $T_{0}$ を保つかどうかは、筆者は確かめていない（表の :open:）。
:::

::: proposition 閉集合を潰す商写像 {#top:pres-collapse keywords="collapsing two disjoint closed sets; closed images of Tychonoff spaces need not be Hausdorff" index="閉集合を潰す|へいしゅうごうをつぶす"}
$A,B$ を空間 $X$ の交わらない空でない閉集合とし、$A$ と $B$ をそれぞれ一点 $a,b$ に潰した商空間を $Y$、射影を $q$ とする。
1. $q$ は閉写像である。$X$ が $T_{1}$ なら $Y$ も $T_{1}$ である。
2. $A$ と $B$ が交わらない開集合で分離されないなら、$a$ と $b$ は $Y$ で分離されない。
3. ゾルゲンフライ平面 $\R_{\ell}^{2}$ に 1, 2 を適用すると、チコノフ空間の閉な連続像でハウスドルフでないものが得られる。
:::

::: proof
**Step 1（閉写像）.** 閉集合 $F$ について $q^{-1}(q[F])$ は、$F$ に、$F$ が $A$ と交われば $A$ を、$B$ と交われば $B$ を加えたもので、閉集合の有限和なので閉。商位相の定義から $q[F]$ は閉。$X$ が $T_{1}$ なら、$Y$ の各点 $q(x)$ は一点集合 $\{x\}$, $A$, $B$ のいずれかの像なので閉で、$Y$ は $T_{1}$（\ref{top:pres-t0-t1} の 2 と同じ議論）。

**Step 2（2）.** $Y$ の交わらない開集合 $U\ni a$, $V\ni b$ があれば、$q^{-1}(U)\supseteq A$, $q^{-1}(V)\supseteq B$ は交わらない開集合となり、仮定に反する。

**Step 3（3）.** $\R_{\ell}$ は正規（\ref{top:sorgenfrey-normal}）で $T_{1}$（\ref{top:sorgenfrey-basic}）なので $T_{4}$ で、チコノフ空間（\ref{top:completely-regular-basic} の 2）で、その直積 $\R_{\ell}^{2}$ もチコノフ空間（同じ命題の 3）。$\R_{\ell}^{2}$ は正規でない（\ref{top:sorgenfrey-plane}）ので、分離されない交わらない閉集合 $A,B$ がある（$\R_{\ell}^{2}$ は $T_{1}$ なので、正規でないとは、そのような $A,B$ があることである）。1, 2 から、潰した空間は $T_{1}$ だがハウスドルフでない。
:::

::: proposition 整数を一点に潰した直線 {#top:pres-r-mod-z keywords="R/Z with the integers collapsed to a point is not first countable and not locally compact" index="整数を潰した直線|せいすうをつぶしたちょくせん"}
$q\colon\R\to\R/\Z$ を整数全体を一点 $\ast$ に潰す射影とする。
1. $q$ は閉な商写像で、$\R/\Z$ は $T_{4}$ である。
2. $\R/\Z$ は点 $\ast$ で第一可算でない。
3. $\R/\Z$ は点 $\ast$ でコンパクトな近傍をもたない。
:::

::: proof
**Step 1（1）.** $\Z$ は閉集合なので、\ref{top:pres-collapse} の Step 1 と同じ議論（潰す閉集合が一つ）で $q$ は閉写像である。閉な連続全射は $T_{4}$ を保つ（\ref{top:perfect-preserves} の 2）ので、$\R$ が $T_{4}$（\ref{top:metric-normal}）であることから $\R/\Z$ は $T_{4}$。

**Step 2（2）.** $\ast$ の近傍の可算族 $\{W_{k}\}_{k\ge0}$ をとる。$W_{k}$ は $\ast$ を含む開集合 $O_{k}$ を含み、$q^{-1}(O_{k})$ は $\Z$ を含む開集合なので、整数 $k$ のまわりに $(k-\delta_{k},k+\delta_{k})\subseteq q^{-1}(O_{k})$ となる $0<\delta_{k}\le1/2$ がある（可算選択公理で選ぶ）。$\varepsilon_{n}\defeq\delta_{n}/2$（$n\ge0$）, $\varepsilon_{n}\defeq1/4$（$n<0$）とし、$U\defeq\bigcup_{n\in\Z}(n-\varepsilon_{n},n+\varepsilon_{n})$ とおく。$U$ は $\Z$ を含む開集合で、潰す集合 $\Z$ を含むので飽和しており、$q[U]$ は $\ast$ の開近傍。各 $k\ge0$ について、点 $t\defeq k+\tfrac{3}{4}\delta_{k}$ は $q^{-1}(W_{k})$ に属するが、$(k-\varepsilon_{k},k+\varepsilon_{k})$ に入らず、他の整数 $n$ からは $1-\tfrac{3}{8}>\tfrac{1}{4}\ge\varepsilon_{n}$ 以上離れているので $U$ に入らない。$t\notin\Z$ なので $q(t)\in W_{k}\setminus q[U]$。よってどの $W_{k}$ も $q[U]$ に含まれず、$\{W_{k}\}$ は基本近傍系でない。

**Step 3（3）.** $K$ を $\ast$ のコンパクトな近傍とする。$q^{-1}(K^{\circ})$ は $\Z$ を含む開集合なので、各 $n\in\Z$ について $(n-\delta_{n},n+\delta_{n})\subseteq q^{-1}(K^{\circ})$ となる $0<\delta_{n}\le1/2$ がある。$x_{n}\defeq n+\delta_{n}/2$ とし $S\defeq\{q(x_{n}):n\in\Z\}\subseteq K$ とおく。$\{x_{n}\}$ の任意の部分集合は $\R$ の閉集合（有界な区間には有限個の $x_{n}$ しかない）で、整数を含まないので飽和している。よって $S$ の任意の部分集合 $T$ について $q^{-1}(T)$ は閉で、$T$ は閉集合。とくに $S$ は $K$ の閉集合なのでコンパクトだが、$S$ の各点は $S$ で開（補集合が閉）なので、$\{\{s\}:s\in S\}$ は無限個の点からなる $S$ の開被覆で、有限部分被覆をもたない。矛盾。

::: hypcheck
- **潰す集合が無限個の点をもつこと**：Step 2, 3 で整数ごとに $\delta_{n}$ を独立に選べることを使った。有限集合を潰した場合、たとえば $\{0,1\}$ を潰すと、円周の一点に半直線を二本つないだ空間になり、第一可算で局所コンパクトである。
- この空間は完全写像の像ではない（ファイバー $\Z$ がコンパクトでない）。完全写像は局所コンパクト性と第二可算性を保つ（\ref{top:perfect-preserves}）ので、ファイバーのコンパクト性はここで本質的である。
:::
:::

## 範囲外の既知の結果 {#top:sec-pres-facts}

::: fact 可算コンパクト空間の直積 {#top:fact-countably-compact-product keywords="the product of two countably compact spaces need not be countably compact (Novak, Terasaka)" index="可算コンパクト空間の直積|かさんこんぱくとくうかんのちょくせき"}
二つの可算コンパクトなチコノフ空間で、直積が可算コンパクトでないものがある。一方、可算コンパクト空間とコンパクト空間の直積は可算コンパクトである（出典：R. Engelking, *General Topology*。反例は $\beta\N$ の部分空間として作られる）。
:::

::: fact 閉写像とパラコンパクト性（マイケル） {#top:fact-michael-closed-image keywords="Michael's theorem: closed continuous images of paracompact spaces are paracompact" index="閉写像とパラコンパクト性|へいしゃぞうとぱらこんぱくとせい"}
パラコンパクト空間の、閉な連続全射による像（ハウスドルフである）はパラコンパクトである（E. Michael による。出典：R. Engelking, *General Topology*）。
:::

::: fact 完全写像と距離化可能性（森田–花井–ストーン） {#top:fact-morita-hanai-stone keywords="Morita-Hanai-Stone theorem: perfect images of metrizable spaces are metrizable" index="森田–花井–ストーンの定理|もりたはないすとーんのていり"}
距離化可能空間の完全写像による像は距離化可能である。より一般に、距離化可能空間の閉な連続全射による像 $Y$ について、$Y$ が距離化可能であることと、各点の逆像の境界がコンパクトであることは同値である（出典：R. Engelking, *General Topology*）。
:::

::: fact 完全写像とチェック完備性 {#top:fact-perfect-cech keywords="Cech-completeness is preserved by perfect maps" index="完全写像とチェック完備性|かんぜんしゃぞうとちぇっくかんびせい"}
チコノフ空間 $X$ からチコノフ空間 $Y$ への完全写像があるとき、$X$ がチェック完備なら $Y$ もチェック完備である（出典：R. Engelking, *General Topology*）。
:::

::: supplement
**表の読み方の注意.** 「:no:」は「保たれない例が一つはある」の意味で、「いつも壊れる」ではない。たとえば $T_{4}$ の部分空間は一般には $T_{4}$ でないが、閉部分空間なら $T_{4}$ であり、距離化可能空間ではすべての部分空間が $T_{4}$ である。性質がすべての部分空間に伝わる空間の性質は「遺伝的」と呼ばれる（例：遺伝的リンデレーフ、\ref{top:double-arrow-hereditary}）。

**正則・正規を $T_{1}$ なしで考えると.** 表では $T_{3}$・$T_{4}$ の行を挙げた。$T_{1}$ を仮定しない「正則」「正規」では、密着空間がどちらも満たすので、商や連続像の欄の反例 28 は使えない。たとえば「正規」（$T_{1}$ なし）は閉な連続全射で保たれる（\ref{top:perfect-preserves} の 2）。

**圏論の言葉で.** 部分空間・直積は始位相（\ref{top:initial-topology}）で、直和・商は終位相（\ref{top:final-topology}）で定まる。始位相は行き先の開集合を引き戻して作るので、行き先で点を分けていた開集合が引き戻しても点を分ける。分離公理が部分空間・直積に伝わるのはこのためである。終位相は逆に、像の側の開集合を「引き戻すと開」という条件で決めるので、開集合が少なくなりやすく、分離公理は壊れやすい。一方、コンパクト性は「開被覆を引き戻して有限個を選び、押し出す」議論で示せるので、像（終位相の側）に伝わる。$\mathbf{Top}$ の中で、$T_{0}$・$T_{1}$・ハウスドルフ・チコノフ空間のなす充満部分圏は直積と部分空間で閉じており、包含関手が左随伴をもつ（反射的部分圏である）ことが知られている。
:::

## 問題 {#top:sec-pres-problems}

::: problem {#top:prob-pres-sum-compact}
直和 $\bigsqcup_{n\in\N}[0,1]$ が局所コンパクトでパラコンパクトだが、コンパクトでないことを示せ。その一点コンパクト化はどんな空間か。
:::

::: solution
LCH とパラコンパクト性は直和で保たれる（\ref{top:pres-sum} の 1）。被覆 $\{[0,1]\times\{n\}\}_{n}$ に有限部分被覆がないのでコンパクトでない（同じ命題の 3）。一点コンパクト化 $X^{*}$ では、コンパクト集合は有限個の $[0,1]\times\{n\}$ としか交わらないので、$\infty$ の近傍は有限個を除くすべての区間を丸ごと含む。$X^{*}$ は、$\R^{2}$ の部分空間 $Z\defeq\{(0,0)\}\cup\bigcup_{n\ge1}\{1/n\}\times[0,1/n]$ と同相である：$(t,n)\mapsto(1/n,t/n)$, $\infty\mapsto(0,0)$ は全単射で、$(0,0)$ の近傍 $\{\lvert z\rvert<\varepsilon\}$ は有限個を除く線分を丸ごと含み、逆に有限個を除く線分を含む開集合は $(0,0)$ の近傍なので、両者の近傍系が対応する（\ref{top:one-point-unique} を使ってもよい：$Z$ はコンパクトハウスドルフで、$Z\setminus\{(0,0)\}$ が $X$ と同相）。
:::

::: problem {#top:prob-pres-sorgenfrey-diagonal}
ゾルゲンフライ平面の反対角線 $\Delta^{-}\defeq\{(x,-x):x\in\R\}$ は閉で離散な部分空間であることを示し、これを使って $\R_{\ell}^{2}$ がリンデレーフでないことと、可分空間の閉部分空間が可分とは限らないことを示せ。
:::

::: solution
**閉.** $\Delta^{-}$ は通常の位相で閉で、ゾルゲンフライ位相は通常の位相より強いので閉。**離散.** $(x,-x)$ の近傍 $[x,x+1)\times[-x,-x+1)$ と $\Delta^{-}$ の共通部分は、$x\le y<x+1$ かつ $-x\le-y<-x+1$ を満たす $(y,-y)$ の全体で、二つ目の条件から $y\le x$ なので $y=x$、すなわち一点だけである。**リンデレーフでない.** $\Delta^{-}$ は非可算な離散空間なのでリンデレーフでない（一点集合による被覆に可算部分被覆がない）。リンデレーフ空間の閉部分空間はリンデレーフ（\ref{top:pres-subspaces} の 1）なので、$\R_{\ell}^{2}$ はリンデレーフでない。**可分.** $\R_{\ell}^{2}$ は可分（$\mathbb{Q}^{2}$ が稠密）だが、閉部分空間 $\Delta^{-}$ は非可算な離散空間なので可分でない。
:::
