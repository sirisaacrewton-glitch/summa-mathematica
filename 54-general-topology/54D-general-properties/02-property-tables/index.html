# 性質の保存と含意の一覧（Tables of Topological Properties）

分離公理・コンパクト性・可算性・連結性・距離化可能性などが、部分空間・直積・直和・商・連続像・開写像・閉写像・完全写像で保たれるかの一覧表、閉包・内部・直積・商などの操作の可換性、性質の組み合わせから別の性質が導かれる関係の地図。各欄に証明または反例への参照を付ける。

<p class="mn-msc">MSC2020: 54D, 54B, 54C, 54G</p>

- [豊かな構造をもつ位相空間 › 距離空間](../../../54-general-topology/54E-richer-structures/01-metric-spaces/index.html)（全体、10 ページ）：距離化定理・完備距離化可能性・ベール空間
