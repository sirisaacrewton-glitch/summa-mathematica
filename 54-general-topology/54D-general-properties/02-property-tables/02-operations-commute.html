# 位相的な操作の可換性 {#top:page-operations-commute keywords="commutation of topological operations: closure, interior, boundary with unions, intersections, subspaces, products, images, preimages; quotients and products; components of products; one-point and Stone-Cech compactifications of products"}

閉包・内部・境界をとる操作と、和・共通部分・部分空間・直積・像・逆像をとる操作は、順序を入れ替えても同じ結果になるか。また、部分空間・直積・商・コンパクト化といった構成どうしは入れ替えられるか。これらを二つの表にまとめる（\ref{top:commute-table-closure}, \ref{top:commute-table-constructions}）。「交換できない」ときには、片側の包含がいつ成り立つか、どんな追加の条件で等号になるかも書く。

> 表にない短い主張は \ref{top:sec-oc-proofs} で証明する。

## 記法と定義の確認 {#top:sec-oc-notation}

::: notation
- $\overline{A}$, $A^{\circ}$ は閉包と内部（\ref{top:interior-closure}）、$\partial A\defeq\overline{A}\setminus A^{\circ}$ は境界（\ref{top:boundary}）。部分空間 $Y$ の中での閉包・内部・境界を $\mathrm{cl}_{Y}$, $\mathrm{int}_{Y}$, $\partial_{Y}$ と書く。
- $f[A]$ は像、$f^{-1}(B)$ は逆像。開写像・閉写像は \ref{top:homeomorphism}。
- 直和（位相和）は \ref{top:page-preservation-table} の記法による。$X^{*}$ は一点コンパクト化（\ref{top:one-point-compactification}）、$\beta X$ はストーン–チェックのコンパクト化（\ref{top:stone-cech-def}）。
- 表の記号：:yes: は等号（同相）がつねに成り立つ、:no: は成り立たない例がある、:partial: は条件付きで成り立つ。:no: や :partial: の欄でも、片側の包含がつねに成り立つことが多いので、それを「関係」の列に書く。
:::

## 閉包・内部・境界と集合演算・写像 {#top:sec-oc-closure}

::: table 閉包・内部・境界の可換性 {#top:commute-table-closure}
| 関係 | 等号 | 根拠・条件・反例 |
|---|---|---|
| $\overline{A\cup B}=\overline{A}\cup\overline{B}$ | :yes: | \ref{top:kuratowski-closure} の (K3)。有限個の和でも同じ |
| $\overline{\bigcup_{\lambda}A_{\lambda}}\supseteq\bigcup_{\lambda}\overline{A_{\lambda}}$ | :partial: | 族が局所有限なら等号（\ref{top:locally-finite-closure}）。一般には $\mathbb{Q}=\bigcup_{q}\{q\}$ で左辺 $\R$、右辺 $\mathbb{Q}$ |
| $\overline{A\cap B}\subseteq\overline{A}\cap\overline{B}$ | :no: | $A=\mathbb{Q}$, $B=\R\setminus\mathbb{Q}$ で左辺 $\emptyset$、右辺 $\R$ |
| $(A\cap B)^{\circ}=A^{\circ}\cap B^{\circ}$ | :yes: | (K3) の双対（\ref{top:interior-closure-basic.3}）。有限個の共通部分でも同じ |
| $\bigl(\bigcap_{\lambda}A_{\lambda}\bigr)^{\circ}\subseteq\bigcap_{\lambda}A_{\lambda}^{\circ}$ | :no: | $\bigcap_{n}(-1/n,1/n)=\{0\}$ で左辺 $\emptyset$、右辺 $\{0\}$ |
| $(A\cup B)^{\circ}\supseteq A^{\circ}\cup B^{\circ}$ | :no: | $A=\mathbb{Q}$, $B=\R\setminus\mathbb{Q}$ で左辺 $\R$、右辺 $\emptyset$ |
| $\overline{A^{\circ}}$ と $\overline{A}^{\circ}$ | :no: | 一般にどちらの包含もない：$A=\mathbb{Q}$ で $\overline{A^{\circ}}=\emptyset$, $\overline{A}^{\circ}=\R$。$A=[0,1]\cup\{2\}$ で $\overline{A^{\circ}}=[0,1]$, $\overline{A}^{\circ}=(0,1)$ |
| $\partial(A\cup B)\subseteq\partial A\cup\partial B$ | :no: | 包含は (K3) と $(A\cup B)^{\circ}\supseteq A^{\circ}\cup B^{\circ}$ から。等号の反例：$A=\mathbb{Q}\cap[0,1]$, $B=[0,1]\setminus\mathbb{Q}$ で左辺 $\{0,1\}$、右辺 $[0,1]$ |
| $\partial(A^{c})=\partial A$ | :yes: | \ref{top:boundary-basic} |
| $f[\overline{A}]\subseteq\overline{f[A]}$（$f$ 連続） | :partial: | 包含は連続性と同値（\ref{top:continuity-equivalents.4}）。$f$ が閉写像なら等号（\ref{top:oc-images.1}）。$\arctan\colon\R\to\R$, $A=\R$ で左辺 $(-\pi/2,\pi/2)$、右辺 $[-\pi/2,\pi/2]$ |
| $\overline{f^{-1}(B)}\subseteq f^{-1}(\overline{B})$（$f$ 連続） | :partial: | $f$ が開写像なら等号（\ref{top:oc-images.2}）。定数写像 $f=0$, $B=(0,1)$ で左辺 $\emptyset$、右辺 $\R$ |
| $f^{-1}(B^{\circ})\subseteq f^{-1}(B)^{\circ}$（$f$ 連続） | :partial: | $f$ が開写像なら等号（\ref{top:oc-images.2}）。上と同じ例で $B=[0,1]$ |
| $\mathrm{cl}_{Y}(A)=\overline{A}\cap Y$（$A\subseteq Y$） | :yes: | \ref{top:subspace-basic.2} |
| $\mathrm{int}_{Y}(A)\supseteq A^{\circ}\cap Y$ | :partial: | $Y$ が開なら等号。$Y=A=\mathbb{Q}$ で左辺 $\mathbb{Q}$、右辺 $\emptyset$（\ref{top:oc-subspace}） |
| $\partial_{Y}(A)\subseteq\partial A\cap Y$ | :partial: | $Y$ が開なら等号。$Y=A=\mathbb{Q}$ で左辺 $\emptyset$、右辺 $\mathbb{Q}$（\ref{top:oc-subspace}） |
| $\overline{\prod_{i}A_{i}}=\prod_{i}\overline{A_{i}}$ | :yes: | \ref{top:product-closure}（任意個の直積） |
| $\bigl(\prod_{i}A_{i}\bigr)^{\circ}\subseteq\prod_{i}A_{i}^{\circ}$ | :partial: | 有限個なら等号。無限個では $\prod_{n}(0,1)\subseteq\R^{\N}$ で左辺 $\emptyset$（\ref{top:oc-products.1}） |
| $\partial(A\times B)=(\partial A\times\overline{B})\cup(\overline{A}\times\partial B)$ | :yes: | \ref{top:oc-products.2} |
:::

::: intuition
閉包は「近づける点を足す」操作、内部は「余裕のある点だけ残す」操作である。閉包は和と相性がよく（$A\cup B$ に近づくなら、$A$ か $B$ のどちらかに近づく）、共通部分とは相性が悪い（$A$ にも $B$ にも近づけるが、両方に同時に属する点では近づけない：有理数と無理数）。内部はその双対である。

写像については、連続写像は「近いものを近くに送る」ので $f[\overline{A}]\subseteq\overline{f[A]}$ だけが無条件で、等号には「閉集合を閉集合に送る」閉写像の性質が要る。逆像の側では、等号に「開集合を開集合に送る」開写像の性質が要る。どちらの等号が閉写像で、どちらが開写像かは、「像の閉包」が閉集合であることと、「逆像の閉包」の点のまわりの開集合を前に押し出して $B$ と交わらせる議論の違いから来る（\ref{top:oc-images} の証明）。
:::

## 構成どうしの可換性 {#top:sec-oc-constructions}

::: table 構成の可換性 {#top:commute-table-constructions}
| 関係 | 成立 | 根拠・条件・反例 |
|---|---|---|
| 部分空間の部分空間は部分空間 | :yes: | \ref{top:subspace-basic.5} |
| 部分空間の直積 $\prod_{i}A_{i}$ の位相＝直積 $\prod_{i}X_{i}$ からの相対位相 | :yes: | \ref{top:oc-subspace-product} |
| 直積の直積 $\prod_{i}\prod_{j}X_{ij}\cong\prod_{(i,j)}X_{ij}$ | :yes: | どちらも積の普遍性（\ref{top:product-universal}）をもつ |
| 直和と直積の分配 $\bigl(\bigsqcup_{i}X_{i}\bigr)\times Y\cong\bigsqcup_{i}(X_{i}\times Y)$ | :yes: | \ref{top:oc-sum-product} |
| 商写像の合成は商写像 | :yes: | \ref{top:oc-quotient-basic.1} |
| 商写像の飽和部分集合への制限は商写像 | :partial: | 飽和した開集合・閉集合への制限なら :yes:。一般には :no:（\ref{top:oc-quotient-basic.2}, \ref[3]{top:oc-quotient-basic.3}） |
| 商写像と恒等写像の直積 $q\times1_{Z}$ は商写像 | :partial: | $Z$ が LCH なら :yes:（\ref{top:whitehead-product}）。一般には :no:（\ref{top:product-quotient-counterexample}） |
| 完全写像と恒等写像の直積は完全写像 | :yes: | \ref{top:perfect-times-identity} |
| 直積の連結成分＝連結成分の直積 | :yes: | \ref{top:oc-components.1}（任意個の直積） |
| 直積の弧状連結成分＝弧状連結成分の直積 | :yes: | \ref{top:oc-components.2}（選択公理） |
| 一点コンパクト化と直積 $(X\times Y)^{*}$ と $X^{*}\times Y^{*}$ | :no: | $X,Y$ が非コンパクトな LCH なら、$X^{*}\times Y^{*}$ は $X\times Y$ に 2 点以上を足した空間（\ref{top:oc-compactifications.1}）。例：$(\R^{2})^{*}\cong S^{2}$ に対し $\R^{*}\times\R^{*}\cong S^{1}\times S^{1}$ |
| ストーン–チェックのコンパクト化と直積 $\beta(X\times Y)\cong\beta X\times\beta Y$ | :partial: | 無限なチコノフ空間 $X,Y$ について、自然な写像が同相であることと $X\times Y$ が擬コンパクトであることは同値（\ref{top:fact-glicksberg}）。例：$\N\times\N$ では成り立たない |
| 指数法則 $C(Z\times X,Y)\cong C(Z,C(X,Y))$（コンパクト開位相） | :partial: | $X$ が LCH、$Z$ がハウスドルフなら同相（\ref{top:exponential-law}）。$X$ が局所コンパクトでないと評価写像が連続とは限らない（\ref{top:evaluation-q-discontinuous}） |
| 極限と連続写像 $f(\lim x_{\alpha})=\lim f(x_{\alpha})$ | :yes: | ネットについて連続性と同値（\ref{top:net-continuity}） |
| 閉包と極限：$\overline{A}$＝$A$ の点列の極限の全体 | :partial: | ネットなら :yes:（\ref{top:net-closure}）。点列では第一可算なら :yes:（\ref{top:sequences-first-countable}）、一般には :no:（\ref{top:oc-sequences}） |
| 点列連続性と連続性 | :partial: | 第一可算なら同値（\ref{top:sequences-first-countable.2}）、一般には :no:（\ref{top:oc-sequences}） |
:::

## 短い主張の証明 {#top:sec-oc-proofs}

::: proposition 像・逆像と閉包 {#top:oc-images keywords="closed maps commute with closure of images; open maps commute with closure and interior of preimages" index="閉写像と閉包|へいしゃぞうとへいほう, 開写像と逆像の閉包|かいしゃぞうとぎゃくぞうのへいほう"}
$f\colon X\to Y$ を連続写像とする。
1. $f$ が閉写像なら、すべての $A\subseteq X$ について $f[\overline{A}]=\overline{f[A]}$。
2. $f$ が開写像なら、すべての $B\subseteq Y$ について $f^{-1}(\overline{B})=\overline{f^{-1}(B)}$、$f^{-1}(B^{\circ})=f^{-1}(B)^{\circ}$。
:::

::: proof
**Step 1（1）.** $f[\overline{A}]\subseteq\overline{f[A]}$ は連続性から（\ref{top:continuity-equivalents.4}）。逆に、$f[\overline{A}]$ は閉写像の像なので閉集合で、$f[A]$ を含むので $\overline{f[A]}\subseteq f[\overline{A}]$（閉包は $f[A]$ を含む最小の閉集合、\ref{top:interior-closure-basic.1}）。

**Step 2（2 の閉包）.** $f^{-1}(\overline{B})$ は連続性から閉集合で $f^{-1}(B)$ を含むので、$\overline{f^{-1}(B)}\subseteq f^{-1}(\overline{B})$。逆に $x\in f^{-1}(\overline{B})$ とし、$x$ の開近傍 $U$ をとる。$f[U]$ は $f(x)$ の開近傍（$f$ は開写像）で、$f(x)\in\overline{B}$ なので $f[U]\cap B\neq\emptyset$（\ref{top:closure-neighborhood}）。$f(u)\in B$ となる $u\in U$ は $f^{-1}(B)$ に属するので、$U\cap f^{-1}(B)\neq\emptyset$。よって $x\in\overline{f^{-1}(B)}$。

**Step 3（2 の内部）.** 双対性（\ref{top:interior-closure-basic.3}）と、逆像が補集合と交換すること：$f^{-1}(B^{\circ})=f^{-1}\bigl((\overline{B^{c}})^{c}\bigr)=\bigl(f^{-1}(\overline{B^{c}})\bigr)^{c}=\bigl(\overline{f^{-1}(B^{c})}\bigr)^{c}=\bigl(\overline{f^{-1}(B)^{c}}\bigr)^{c}=f^{-1}(B)^{\circ}$。

::: hypcheck
- **1 の「閉写像」**：Step 1 で $f[\overline{A}]$ が閉であることに使った。外すと偽（表の $\arctan$ の例）。
- **2 の「開写像」**：Step 2 で $f[U]$ が開であることに使った。外すと偽（表の定数写像の例）。
- 1 で連続性は包含 $\subseteq$ にだけ使った。閉写像でも連続でなければ等号は一般に成り立たない。
:::
:::

::: proposition 部分空間での内部と境界 {#top:oc-subspace keywords="interior and boundary relative to a subspace" index="相対内部|そうたいないぶ"}
$A\subseteq Y\subseteq X$ とする。
1. $A^{\circ}\cap Y\subseteq\mathrm{int}_{Y}(A)$、$\partial_{Y}(A)\subseteq\partial A\cap Y$。
2. $Y$ が開集合なら、1 はどちらも等号である。
3. $X=\R$, $Y=A=\mathbb{Q}$ では、1 はどちらも等号でない。
:::

::: proof
**Step 1（1）.** $A^{\circ}\cap Y$ は $Y$ の開集合で $A$ に含まれるので、$\mathrm{int}_{Y}(A)$ に含まれる。境界は $\partial_{Y}(A)=\mathrm{cl}_{Y}(A)\setminus\mathrm{int}_{Y}(A)=(\overline{A}\cap Y)\setminus\mathrm{int}_{Y}(A)$（\ref{top:subspace-basic.2}）で、$\mathrm{int}_{Y}(A)\supseteq A^{\circ}\cap Y$ だから $\subseteq(\overline{A}\cap Y)\setminus(A^{\circ}\cap Y)=\partial A\cap Y$。

**Step 2（2）.** $Y$ が開なら、$\mathrm{int}_{Y}(A)$ は $Y$ の開集合なので $X$ でも開（\ref{top:subspace-basic.4}）で $A$ に含まれ、$\mathrm{int}_{Y}(A)\subseteq A^{\circ}$。したがって $\mathrm{int}_{Y}(A)=A^{\circ}\cap Y$ で、Step 1 の計算は等号で成り立つ。

**Step 3（3）.** $\mathrm{int}_{\mathbb{Q}}(\mathbb{Q})=\mathbb{Q}$ だが $\mathbb{Q}^{\circ}=\emptyset$。$\partial_{\mathbb{Q}}(\mathbb{Q})=\emptyset$ だが $\partial\mathbb{Q}=\R$ なので $\partial\mathbb{Q}\cap\mathbb{Q}=\mathbb{Q}$。
:::

::: proposition 直積の内部と境界 {#top:oc-products keywords="interior of a product; boundary of a product of two sets" index="直積の内部|ちょくせきのないぶ, 直積の境界|ちょくせきのきょうかい"}
1. $\bigl(\prod_{i}A_{i}\bigr)^{\circ}\subseteq\prod_{i}A_{i}^{\circ}$ で、有限個の直積なら等号である。$\R^{\N}$ で $A_{n}=(0,1)$ とすると、左辺は空集合で右辺は空でない。
2. $\partial(A\times B)=(\partial A\times\overline{B})\cup(\overline{A}\times\partial B)$。
:::

::: proof
**Step 1（1 の包含）.** $x\in\bigl(\prod_{i}A_{i}\bigr)^{\circ}$ なら、$x$ を含む基本開集合 $\prod_{i}U_{i}\subseteq\prod_{i}A_{i}$ がある。各 $i$ で $x_{i}\in U_{i}\subseteq A_{i}$（各 $A_{j}$ が空でないので射影できる）なので $x_{i}\in A_{i}^{\circ}$。

**Step 2（有限個の等号）.** 有限個なら $\prod_{i}A_{i}^{\circ}$ は基本開集合で $\prod_{i}A_{i}$ に含まれるので、内部に含まれる。

**Step 3（無限個の反例）.** $\prod_{n}(0,1)$ が空でない開集合 $W$ を含むとすると、$W$ は基本開集合 $\prod_{n}U_{n}$（$n>m$ で $U_{n}=\R$）を含み、$\pi_{m+1}\bigl[\prod_{n}U_{n}\bigr]=\R\not\subseteq(0,1)$ で矛盾。よって内部は空。一方 $\prod_{n}(0,1)^{\circ}=\prod_{n}(0,1)\neq\emptyset$。

**Step 4（2）.** 有限個の直積では、Step 2 から $(A\times B)^{\circ}=A^{\circ}\times B^{\circ}$、\ref{top:product-closure} から $\overline{A\times B}=\overline{A}\times\overline{B}$。よって
$$
\partial(A\times B)=(\overline{A}\times\overline{B})\setminus(A^{\circ}\times B^{\circ}).
$$
点 $(x,y)\in\overline{A}\times\overline{B}$ が $A^{\circ}\times B^{\circ}$ に属さないことは、$x\notin A^{\circ}$ または $y\notin B^{\circ}$、すなわち $x\in\partial A$ または $y\in\partial B$ と同値である。よって右辺は $(\partial A\times\overline{B})\cup(\overline{A}\times\partial B)$。

::: hypcheck
- **Step 3 の「無限個」**：基本開集合が有限個の座標しか制限しないことを使った。箱位相（\ref{top:box-topology}）では $\prod_{n}(0,1)$ は開集合で、等号が成り立つ。
:::
:::

::: proposition 部分空間の直積 {#top:oc-subspace-product keywords="the product of subspaces carries the subspace topology of the product" index="部分空間の直積|ぶぶんくうかんのちょくせき"}
$A_{i}\subseteq X_{i}$ について、$\prod_{i}A_{i}$ の直積位相（各 $A_{i}$ は部分空間）と、$\prod_{i}X_{i}$ からの相対位相は一致する。
:::

::: proof
直積位相の基本開集合は $\prod_{i}(U_{i}\cap A_{i})$（$U_{i}$ は $X_{i}$ の開集合、有限個を除いて $U_{i}=X_{i}$）で、これは $\bigl(\prod_{i}U_{i}\bigr)\cap\prod_{i}A_{i}$ に等しい。後者は相対位相の開基（\ref{top:subspace-basic.3} を \ref{top:product-base} の開基に適用）なので、二つの位相は同じ開基をもち一致する。
:::

::: proposition 直和と直積の分配 {#top:oc-sum-product keywords="products distribute over topological sums" index="直和と直積の分配|ちょくわとちょくせきのぶんぱい"}
自然な全単射 $\varphi\colon\bigsqcup_{i}(X_{i}\times Y)\to\bigl(\bigsqcup_{i}X_{i}\bigr)\times Y$ は同相写像である。
:::

::: proof
**Step 1（連続）.** 各 $X_{i}\times Y$ 上で $\varphi$ は包含 $X_{i}\to\bigsqcup X_{i}$ と $1_{Y}$ の直積なので連続で、直和の各成分上で連続な写像は連続（終位相の普遍性、\ref{top:final-topology-universal}）。

**Step 2（開写像）.** 左辺の開集合 $W$ について、$W\cap(X_{i}\times Y)$ は $X_{i}\times Y$ の開集合なので、基本開集合 $U\times V$（$U\subseteq X_{i}$, $V\subseteq Y$ は開）の和である。$U$ は $\bigsqcup X_{i}$ でも開なので $\varphi[U\times V]=U\times V$ は右辺で開。よって $\varphi[W]$ は開。全単射で連続かつ開なので同相（\ref{top:homeomorphism-characterization}）。
:::

::: proposition 商写像の合成と制限 {#top:oc-quotient-basic keywords="composition of quotient maps; restriction of a quotient map to a saturated open or closed subset; counterexample" index="商写像の制限|しょうしゃぞうのせいげん"}
1. 商写像の合成は商写像である。
2. $q\colon X\to Y$ を商写像、$A\subseteq X$ を飽和した（$A=q^{-1}(q[A])$ となる）開集合または閉集合とすると、$q|_{A}\colon A\to q[A]$ は商写像である。
3. 2 は、飽和しているが開でも閉でもない $A$ では成り立たないことがある。
:::

::: proof
**Step 1（1）.** $q_{1}\colon X\to Y$, $q_{2}\colon Y\to Z$ を商写像とすると、$V\subseteq Z$ について、$(q_{2}q_{1})^{-1}(V)$ が開 $\iff$ $q_{2}^{-1}(V)$ が開（$q_{1}$ が商写像）$\iff$ $V$ が開（$q_{2}$ が商写像）。全射性も合成で保たれる。

**Step 2（2、開の場合）.** $V\subseteq q[A]$ で $(q|_{A})^{-1}(V)$ が $A$ で開とする。$A$ が飽和しているので $(q|_{A})^{-1}(V)=q^{-1}(V)$ で、$A$ が開なのでこれは $X$ で開（\ref{top:subspace-basic.4}）。$q$ が商写像なので $V$ は $Y$ で開で、$q[A]$ でも開。閉の場合は、開を閉に置き換えて同じ議論をする（商写像では、補集合をとれば $V$ が閉 $\iff$ $q^{-1}(V)$ が閉）。逆に $q[A]$ の開集合の逆像が $A$ で開なのは連続性から。

**Step 3（3）.** $X\defeq\{a,b,c,d,e\}$ に、$\{c,d\}$ と $\{a,e\}$ が生成する位相 $\{\emptyset,\{c,d\},\{a,e\},\{a,c,d,e\},X\}$ を入れる。同値類 $\{a,b\},\{c\},\{d,e\}$ で割った商空間を $Y=\{p,c',r\}$（$p=[a]$, $c'=[c]$, $r=[d]$）とし、$A\defeq\{a,b,c\}$（飽和）とする。$X$ の空でない真の開集合 $\{c,d\}$, $\{a,e\}$, $\{a,c,d,e\}$ はどれも飽和していない（$d$ を含むが $e$ を含まない、$a$ を含むが $b$ を含まない、など）ので、$Y$ は密着空間で、$q[A]=\{p,c'\}$ の相対位相も密着である。一方 $A$ の相対位相では $\{c\}=\{c,d\}\cap A$ が開で、$(q|_{A})^{-1}(\{c'\})=\{c\}$ だから、$q|_{A}$ による商位相では $\{c'\}$ が開になる。二つの位相が違うので、$q|_{A}\colon A\to q[A]$（相対位相）は商写像でない。

::: hypcheck
- **2 の「飽和」**：Step 2 で $(q|_{A})^{-1}(V)=q^{-1}(V)$ に使った。
- **2 の「開または閉」**：Step 2 で $A$ の開集合が $X$ の開集合であることに使った。Step 3 の $A$ は飽和しているが開でも閉でもない（閉集合は $\emptyset,X,\{a,b,e\},\{b,c,d\},\{b\}$）。
:::
:::

::: proposition 直積の連結成分 {#top:oc-components keywords="components and path components of a product are products of components" index="直積の連結成分|ちょくせきのれんけつせいぶん"}
$x\in\prod_{i}X_{i}$ について、$C(y)$ を点 $y$ の連結成分、$P(y)$ を弧状連結成分とする。
1. $C(x)=\prod_{i}C(x_{i})$。
2. （AC）$P(x)=\prod_{i}P(x_{i})$。
:::

::: proof
**Step 1（⊇）.** $\prod_{i}C(x_{i})$ は連結集合の直積なので連結（\ref{top:connected-preservation.4}。直積の部分空間としての位相は直積位相：\ref{top:oc-subspace-product}）で、$x$ を含むので、最大の連結集合 $C(x)$（\ref{top:components-properties}）に含まれる。

**Step 2（⊆）.** $\pi_{i}[C(x)]$ は連結（連続像、\ref{top:connected-preservation.1}）で $x_{i}$ を含むので $C(x_{i})$ に含まれる。よって $C(x)\subseteq\prod_{i}C(x_{i})$。

**Step 3（2）.** 弧状連結成分は $x$ を含む最大の弧状連結集合なので、弧状連結空間の直積が弧状連結であること（\ref{top:pres-path-products}。選択公理）と、弧状連結集合の連続像が弧状連結であること（\ref{top:pres-images.1}）を使って、Step 1, 2 と同じ議論をする。
:::

::: proposition コンパクト化と直積 {#top:oc-compactifications keywords="one-point compactification does not commute with products" index="一点コンパクト化と直積|いってんこんぱくとかとちょくせき"}
1. $X,Y$ を非コンパクトな LCH とする。$X^{*}\times Y^{*}$ はコンパクトハウスドルフで $X\times Y$ を開部分空間として含むが、$X^{*}\times Y^{*}\setminus X\times Y$ は 2 点以上を含む。したがって $X^{*}\times Y^{*}$ は $X\times Y$ の一点コンパクト化ではない。
:::

::: proof
$X^{*}$, $Y^{*}$ はコンパクトハウスドルフ（\ref{top:one-point-properties.2}, \ref[3]{top:one-point-properties.3}）なので直積もそうである（\ref{top:heine-borel}, \ref{top:hausdorff-properties}）。$X\times Y$ は開集合の直積なので開。補集合は $(\{\infty\}\times Y^{*})\cup(X^{*}\times\{\infty\})$ で、$Y$ は非コンパクトなので無限集合（有限空間はコンパクト）であり、$\{\infty\}\times Y$ だけで無限個の点を含む。$(X\times Y)^{*}$ は補集合がちょうど 1 点なので、$X^{*}\times Y^{*}$ とは $X\times Y$ を保つ同相写像で結べない。
:::

::: fact グリックスバーグの定理 {#top:fact-glicksberg keywords="Glicksberg's theorem: beta(X x Y) = beta X x beta Y iff X x Y is pseudocompact" index="グリックスバーグの定理|ぐりっくすばーぐのていり"}
$X,Y$ を無限なチコノフ空間とする。$X\times Y\to\beta X\times\beta Y$ を延長した自然な写像 $\beta(X\times Y)\to\beta X\times\beta Y$ が同相写像であることと、$X\times Y$ が擬コンパクト（\ref{top:countably-compact}）であることは同値である（I. Glicksberg による。出典：R. Engelking, *General Topology*）。
:::

::: proposition 点列で足りない例 {#top:oc-sequences keywords="sequences do not determine closure or continuity in omega_1+1" index="点列と閉包|てんれつとへいほう, 点列連続|てんれつれんぞく"}
$X\defeq[0,\omega_{1}]$（順序位相）とする。
1. $\omega_{1}\in\overline{[0,\omega_{1})}$ だが、$[0,\omega_{1})$ の点列で $\omega_{1}$ に収束するものはない。
2. $\{\omega_{1}\}$ の特性関数 $f\colon X\to\R$ は点列連続（収束する点列を収束する点列に送る）だが、連続でない。
:::

::: proof
**Step 1（1）.** \ref{top:omega-one-space.2}。

**Step 2（2、点列連続）.** $x_{n}\to\omega_{1}$ とする。$x_{n}<\omega_{1}$ となる $n$ が無限個あれば、その部分列は $[0,\omega_{1})$ の点列で $\omega_{1}$ に収束し、1 に反する。よって十分先で $x_{n}=\omega_{1}$、$f(x_{n})=1=f(\omega_{1})$。$x_{n}\to\alpha<\omega_{1}$ なら、$\alpha$ の開近傍 $[0,\alpha+1)$ は $\omega_{1}$ を含まないので、十分先で $x_{n}\neq\omega_{1}$、$f(x_{n})=0=f(\alpha)$。

**Step 3（連続でない）.** $f^{-1}((1/2,2))=\{\omega_{1}\}$ は、1 から $\omega_{1}$ が $[0,\omega_{1})$ の閉包に入るので開でない。

::: hypcheck
- **第一可算でないこと**：$X$ は点 $\omega_{1}$ で第一可算でない（\ref{top:omega-one-space.2}）。第一可算なら点列で閉包も連続性も決まる（\ref{top:sequences-first-countable}）。
:::
:::

::: supplement
**表の使い方.** 「:no:」の欄にも片側の包含が書いてある。証明で等号が必要になったら、表の「条件」の列の仮定（閉写像・開写像・局所有限・開部分空間・有限直積・LCH など）が満たされているかを確かめればよい。

**高い視点.** 閉包と和の交換 (K3) は、閉包作用素が有限和を保つ束準同型であることを言っている。像の閉包の等号（閉写像）と逆像の閉包の等号（開写像）は、写像が誘導する閉包作用素どうしの交換条件である。構成どうしの可換性のうち、部分空間と直積の交換・直積の結合は、どちらも始位相の推移性（始位相の始位相は合成写像の始位相）の帰結で、直和と直積の分配は $\mathbf{Top}$ で「$-\times Y$」が直和を保つことを言っている。一方、$-\times Y$ は商（コイコライザー）を一般には保たない（\ref{top:product-quotient-counterexample}）。$Y$ が LCH なら、写像の集合として $C(Z\times Y,W)\cong C(Z,C_{c}(Y,W))$（\ref{top:exponential-bijective}）が $Z,W$ について自然に成り立ち、$-\times Y$ は右随伴 $C_{c}(Y,-)$ をもつ。左随伴は余極限を保つので、$-\times Y$ は商写像を商写像に送る。これが\ref{top:whitehead-product}の圏論的な理由である。
:::

## 問題 {#top:sec-oc-problems}

::: problem {#top:prob-oc-kuratowski-14}
$A\subseteq\R$ に閉包と補集合を交互に施して得られる集合は高々 14 個である（クラトフスキーの 14 集合定理）ことが知られている。$A=(0,1)\cup(1,2)\cup\{3\}\cup(\mathbb{Q}\cap(4,5))$ について、$\overline{A}$, $A^{\circ}$, $\overline{A^{\circ}}$, $\overline{A}^{\circ}$, $\overline{\overline{A}^{\circ}}$, $\overline{A^{\circ}}^{\circ}$ を求め、互いに異なることを確かめよ。
:::

::: solution
- $\overline{A}=[0,2]\cup\{3\}\cup[4,5]$。
- $A^{\circ}=(0,1)\cup(1,2)$（$\mathbb{Q}\cap(4,5)$ は内部をもたない）。
- $\overline{A^{\circ}}=[0,2]$。
- $\overline{A}^{\circ}=(0,2)\cup(4,5)$。
- $\overline{\overline{A}^{\circ}}=[0,2]\cup[4,5]$。
- $\overline{A^{\circ}}^{\circ}=(0,2)$。

$1$ が入るか、$\{3\}$ が入るか、$[4,5]$ の部分がどうなるかで、6 個はすべて異なる。
:::

::: problem {#top:prob-oc-image-closed}
連続写像 $f\colon X\to Y$ について、$X$ がコンパクトで $Y$ がハウスドルフなら、すべての $A\subseteq X$ で $f[\overline{A}]=\overline{f[A]}$ であることを示せ。
:::

::: solution
$X$ がコンパクトで $Y$ がハウスドルフなら $f$ は閉写像である（\ref{top:compact-to-hausdorff}）。\ref{top:oc-images.1} から従う。
:::
