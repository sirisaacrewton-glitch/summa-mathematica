# Summa Mathematica（数学大全）

数学を分野ごとに体系化したノート。定義・定理・証明にラベルを付け、ページをまたいでワンクリックで参照できます。

## 基礎論（Foundations）

<div class="mn-cards">
<a class="mn-card" href="01-foundations/01-general-logic/index.html"><span class="mn-card-title">一般論理</span><span class="mn-card-en">General Logic</span><span class="mn-card-desc">命題論理と一階述語論理の構文・意味論・証明体系と完全性定理、様相論理（クリプキ意味論・完全性・決定可能性）、計算機科学の様相論理（双模倣・PDL・時相論理・μ 計算・ホーア論理）。</span><span class="mn-card-count">37 ページ</span></a>
<a class="mn-card" href="01-foundations/02-model-theory/index.html"><span class="mn-card-title">モデル理論</span><span class="mn-card-en">Model Theory</span><span class="mn-card-desc">構造と理論、コンパクト性、初等部分構造、ヴォートの判定法、量化子消去、型と可算モデル、飽和モデル、識別不能列、超積、安定性と非可算範疇性（モーリーの範疇性定理）。</span><span class="mn-card-count">28 ページ</span></a>
<a class="mn-card" href="01-foundations/03-computation/index.html"><span class="mn-card-title">計算理論</span><span class="mn-card-en">Theory of Computation</span><span class="mn-card-desc">オートマトンと形式言語、計算可能性理論（プログラミング言語 L、原始再帰関数と一般再帰関数、レジスタ機械とチューリング機械、決定可能性と還元、万能プログラム・smn 定理・再帰定理）、その発展（論理的理論の決定可能性、チューリング還元と算術的階層）、計算複雑性、コルモゴロフ複雑性とアルゴリズム的ランダムネス、型なしラムダ計算。</span><span class="mn-card-count">60 ページ</span></a>
<a class="mn-card" href="01-foundations/04-set-theory/index.html"><span class="mn-card-title">集合論</span><span class="mn-card-en">Set Theory</span><span class="mn-card-desc">公理的集合論。基礎事項から無限組合せ論・構成可能集合・強制法まで。章立ては Kunen『Set Theory』(1980) を参考にしている。</span><span class="mn-card-count">61 ページ</span></a>
<a class="mn-card" href="01-foundations/05-proof-theory/index.html"><span class="mn-card-title">証明論と型理論</span><span class="mn-card-en">Proof Theory &amp; Type Theory</span><span class="mn-card-desc">シーケント計算とカット除去、算術の形式化とゲーデルの不完全性定理、証明可能性論理、二階算術とその部分体系、逆数学、順序数解析（ε₀ と PA）、型理論（カリー＝ハワード＝ランベック対応、ホモトピー型理論）。</span><span class="mn-card-count">58 ページ</span></a>
<a class="mn-card" href="01-foundations/06-category-theory/index.html"><span class="mn-card-title">圏論</span><span class="mn-card-en">Category Theory</span><span class="mn-card-desc">圏・関手・自然変換、極限と随伴、モノイダル圏、モナド、カン拡張とエンド、高次圏、豊穣圏と双対性、オペラッドと反復ループ空間、層のコホモロジー、トポスとサイト。</span><span class="mn-card-count">68 ページ</span></a>
</div>

## 代数（Algebra）

<div class="mn-cards">
<a class="mn-card" href="02-algebra/01-linear-algebra/index.html"><span class="mn-card-title">線形代数</span><span class="mn-card-en">Linear Algebra</span><span class="mn-card-desc">ベクトル空間と線形写像、行列式、固有値とジョルダン標準形、双線形形式と内積空間、テンソル代数と外積代数。</span><span class="mn-card-count">19 ページ</span></a>
<a class="mn-card" href="02-algebra/02-group-theory/index.html"><span class="mn-card-title">群論</span><span class="mn-card-en">Group Theory</span><span class="mn-card-desc">群論の基礎、有限群、表現論、組合せ群論、アーベル群。</span><span class="mn-card-count">33 ページ</span></a>
<a class="mn-card" href="02-algebra/03-commutative-algebra/index.html"><span class="mn-card-title">可換代数</span><span class="mn-card-en">Commutative Algebra</span><span class="mn-card-desc">可換環とイデアル、局所化、ネーター環、整域の分類と保存表、次元論、正則局所環・コーエン＝マコーレー環、ホモロジー的方法。</span><span class="mn-card-count">37 ページ</span></a>
<a class="mn-card" href="02-algebra/04-associative-rings/index.html"><span class="mn-card-title">結合環と結合代数</span><span class="mn-card-en">Associative Rings and Algebras</span><span class="mn-card-desc">加群論、非可換環論。</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="02-algebra/05-field-theory/index.html"><span class="mn-card-title">体論と多項式</span><span class="mn-card-en">Field Theory and Polynomials</span><span class="mn-card-desc">体の拡大、ガロア理論、超越拡大。</span><span class="mn-card-count">20 ページ</span></a>
<a class="mn-card" href="02-algebra/06-homological-algebra/index.html"><span class="mn-card-title">ホモロジー代数</span><span class="mn-card-en">Homological Algebra</span><span class="mn-card-desc">鎖複体と長完全列、射影・入射分解、導来関手 Ext と Tor、スペクトル系列、導来圏。</span><span class="mn-card-count">14 ページ</span></a>
</div>

## 数論（Number Theory）

<div class="mn-cards">
<a class="mn-card" href="03-number-theory/01-algebraic-number-theory/index.html"><span class="mn-card-title">代数的整数論</span><span class="mn-card-en">Algebraic Number Theory</span><span class="mn-card-desc">整数環、デデキント環とイデアル類群、判別式、素イデアルの分解、単数定理。</span><span class="mn-card-count">8 ページ</span></a>
</div>

## 解析（Analysis）

<div class="mn-cards">
<a class="mn-card" href="04-analysis/01-real-analysis/index.html"><span class="mn-card-title">実解析</span><span class="mn-card-en">Real Analysis</span><span class="mn-card-desc">実数論、一変数の微積分、多変数解析、ベクトル解析。</span><span class="mn-card-count">32 ページ</span></a>
<a class="mn-card" href="04-analysis/02-complex-analysis/index.html"><span class="mn-card-title">複素解析</span><span class="mn-card-en">Complex Analysis</span><span class="mn-card-desc">正則関数とコーシーの積分定理、留数、調和関数、等角写像とリーマンの写像定理、解析接続、楕円関数。</span><span class="mn-card-count">18 ページ</span></a>
</div>

## 幾何・位相（Geometry and Topology）

<div class="mn-cards">
<a class="mn-card" href="05-geometry-topology/01-general-topology/index.html"><span class="mn-card-title">一般位相</span><span class="mn-card-en">General Topology</span><span class="mn-card-desc">位相空間と連続写像、部分空間・直積・商、分離公理、コンパクト性とチコノフの定理、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性、距離空間と距離化、関数空間とアスコリ–アルツェラの定理、超空間とフラクタル集合、一様空間、局所連結性とカントール集合、完全写像、位相群。</span><span class="mn-card-count">56 ページ</span></a>
<a class="mn-card" href="05-geometry-topology/02-algebraic-topology/index.html"><span class="mn-card-title">代数的位相幾何学</span><span class="mn-card-en">Algebraic Topology</span><span class="mn-card-desc">ホモトピー、ホモロジー、コホモロジー。</span><span class="mn-card-count">26 ページ</span></a>
<a class="mn-card" href="05-geometry-topology/03-algebraic-geometry/index.html"><span class="mn-card-title">代数幾何学</span><span class="mn-card-en">Algebraic Geometry</span><span class="mn-card-desc">アフィン・射影多様体、次元と非特異性、代数曲線、スキームと層、コホモロジー、曲線のリーマン–ロッホの定理。</span><span class="mn-card-count">16 ページ</span></a>
</div>
