# 一変数の微分積分（Calculus of One Variable）

実数の完備性、極限と連続、微分、リーマン積分、級数と一様収束。

<p class="mn-msc">MSC2020: 26A</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-real-numbers/index.html"><span class="mn-card-title">実数</span><span class="mn-card-en">Real Numbers</span><span class="mn-card-desc">順序体とアルキメデスの原理、連続の公理とその同値な形（上限・デデキント・単調収束・区間縮小・ボルツァーノ–ワイエルシュトラス・コーシー・ハイネ–ボレル・連結性）、デデキント切断とコーシー列による実数の構成と一意性、数列の極限。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="02-series/index.html"><span class="mn-card-title">級数</span><span class="mn-card-en">Series</span><span class="mn-card-desc">級数の収束判定（比較・凝縮・根・比・ディリクレ・アーベル・交代級数）、絶対収束と再配列（リーマンの再配列定理）、コーシー積と二重級数。</span><span class="mn-card-count">1 ページ</span></a>
<a class="mn-card" href="03-differentiation/index.html"><span class="mn-card-title">連続性と微分</span><span class="mn-card-en">Continuity and Differentiation</span><span class="mn-card-desc">関数の極限と連続性（点列との関係と選択公理）、中間値・最大値・一様連続、単調関数、半連続、微分と平均値の定理、ロピタル、凸関数、テイラーの定理。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="04-integration/index.html"><span class="mn-card-title">積分</span><span class="mn-card-en">Integration</span><span class="mn-card-desc">リーマン積分（ダルブー和とリーマン和、積分可能な関数、ルベーグの判定法）、微分積分学の基本定理、置換積分と部分積分、広義積分、リーマン–スティルチェス積分。</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="05-function-sequences/index.html"><span class="mn-card-title">関数列と冪級数</span><span class="mn-card-en">Sequences of Functions and Power Series</span><span class="mn-card-desc">一様収束と極限・積分・微分の交換、M 判定法、ディニの定理、高木関数、ベルンシュタイン多項式、冪級数の収束半径と項別微分、アーベルの定理、実解析関数。</span><span class="mn-card-count">2 ページ</span></a>
</div>
