# 演習：積分 {#calc:page-exercises-integration keywords="exercises, Integration"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exintegration-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## リーマン積分 {#calc:sec-ri-exercises}

対応するページ：\ref{calc:page-riemann-integral}

::: problem ★ 基本：リーマン和による計算 {#calc:ex-ri-1}
$\int_{0}^{1}x^{2}\,dx=\frac13$ を、等分割の上リーマン和・下リーマン和の極限として示せ。
:::

::: solution
$n$ 等分の上和は $\sum_{k=1}^{n}\frac{k^{2}}{n^{3}}=\frac{(n+1)(2n+1)}{6n^{2}}$、下和は $\sum_{k=0}^{n-1}\frac{k^{2}}{n^{3}}=\frac{(n-1)(2n-1)}{6n^{2}}$。どちらも $\frac13$ に収束する。
:::

::: problem ★ 基本：和の極限を積分で {#calc:ex-ri-2}
$\lim_{n\to\infty}\sum_{k=1}^{n}\frac{n}{n^{2}+k^{2}}$ を求めよ。
:::

::: solution
$\frac1n\sum_{k=1}^{n}\frac{1}{1+(k/n)^{2}}$ は $\frac{1}{1+x^{2}}$ の $[0,1]$ でのリーマン和なので、$\int_{0}^{1}\frac{dx}{1+x^{2}}=\frac\pi4$。
:::

::: problem ★★ 標準：トマエ関数 {#calc:ex-ri-3}
$f(x)=\frac1q$（$x=\frac pq$ 既約、$q\ge1$）、$f(x)=0$（$x$ 無理数）は $[0,1]$ で積分可能で積分は $0$ であることを示せ。
:::

::: solution
下和はいつも $0$（どの区間にも無理数がある）。$\varepsilon>0$ について $f(x)\ge\varepsilon$ となる点は有限個（分母 $q\le1/\varepsilon$）なので、それらを合計の長さ $\varepsilon$ 以下の小区間で囲む分割をとると、上和は $\varepsilon\cdot1+1\cdot\varepsilon=2\varepsilon$ 以下。
:::

::: problem ★★★ 発展：積分可能性の判定 {#calc:ex-ri-4}
$[a,b]$ 上の有界関数 $f$ について、$f$ の不連続点の集合が測度 $0$ なら積分可能である（ルベーグの判定法の一方向）ことを示せ。
:::

::: solution
$\varepsilon>0$ とし、振幅が $\varepsilon$ 以上の点の集合 $D_{\varepsilon}$ は閉集合で（コンパクト）、不連続点に含まれるので測度 $0$。有限個の開区間（長さの合計 $<\varepsilon$）で覆える。残りのコンパクト集合上では各点の振幅が $\varepsilon$ 未満なので、細かい分割で各小区間の振幅を $\varepsilon$ 未満にできる。上和と下和の差は $2M\varepsilon+\varepsilon(b-a)$ 以下（$M=\sup\lvert f\rvert$）。
:::

## 微分積分学の基本定理 {#calc:sec-ft-exercises}

対応するページ：\ref{calc:page-fundamental-theorem}

::: problem ★ 基本：定積分の計算 {#calc:ex-ft-1}
(1) $\int_{0}^{1}xe^{x}\,dx$ (2) $\int_{0}^{\pi/2}\sin^{2}x\,dx$ (3) $\int_{0}^{\infty}x^{3}e^{-x}\,dx$
:::

::: solution
(1) 部分積分で $[xe^{x}]_{0}^{1}-\int_{0}^{1}e^{x}=e-(e-1)=1$。(2) $\sin^{2}x=\frac{1-\cos2x}{2}$ から $\frac\pi4$。(3) 部分積分を 3 回で $3!=6$。
:::

::: problem ★ 基本：積分で定義された関数の微分 {#calc:ex-ft-2}
$F(x)=\int_{0}^{x^{2}}e^{t^{2}}\,dt$ の導関数を求めよ。
:::

::: solution
$G(u)=\int_{0}^{u}e^{t^{2}}dt$ は $G'(u)=e^{u^{2}}$（基本定理）で、$F=G\circ(x^{2})$ なので $F'(x)=2xe^{x^{4}}$。
:::

::: problem ★★ 標準：広義積分の収束 {#calc:ex-ft-3}
$\int_{1}^{\infty}\frac{dx}{x^{p}}$ と $\int_{0}^{1}\frac{dx}{x^{p}}$ が収束する $p$ を求め、$\int_{0}^{\infty}\frac{\sin x}{x}dx$ が（条件）収束することを示せ。
:::

::: solution
$p\neq1$ で $\int_{1}^{R}x^{-p}=\frac{R^{1-p}-1}{1-p}$ なので、前者は $p>1$、後者は $p<1$ で収束（$p=1$ は $\log$ で発散）。$\int_{1}^{R}\frac{\sin x}{x}=\Bigl[-\frac{\cos x}{x}\Bigr]_{1}^{R}-\int_{1}^{R}\frac{\cos x}{x^{2}}$ で右辺は $R\to\infty$ で収束（$\frac{1}{x^{2}}$ は可積分）。$[0,1]$ では被積分関数は連続に延長される。
:::

::: problem ★★★ 発展：ウォリスの積分 {#calc:ex-ft-4}
$I_{n}\defeq\int_{0}^{\pi/2}\sin^{n}x\,dx$ について $I_{n}=\frac{n-1}{n}I_{n-2}$ を示し、$I_{4}$ を求めよ。さらに $\lim\frac{I_{2n+1}}{I_{2n}}=1$ からウォリスの公式 $\frac\pi2=\prod_{k\ge1}\frac{(2k)^{2}}{(2k-1)(2k+1)}$ を導け。
:::

::: solution
部分積分で $I_{n}=(n-1)\int\sin^{n-2}x\cos^{2}x=(n-1)(I_{n-2}-I_{n})$。$I_{0}=\frac\pi2$ から $I_{4}=\frac34\cdot\frac12\cdot\frac\pi2=\frac{3\pi}{16}$。$I_{2n+1}\le I_{2n}\le I_{2n-1}=\frac{2n+1}{2n}I_{2n+1}$ から比は $1$ に収束し、漸化式で書いた $I_{2n}$, $I_{2n+1}$ の比が有限積 $\frac\pi2\prod_{k\le n}\frac{(2k-1)(2k+1)}{(2k)^{2}}$ の逆数に等しいことから従う。
:::
