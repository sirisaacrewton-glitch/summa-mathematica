# 演習：関数列と冪級数 {#calc:page-exercises-function-sequences keywords="exercises, Sequences of Functions and Power Series"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exfunctionsequences-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 一様収束 {#calc:sec-uc-exercises}

対応するページ：\ref{calc:page-uniform-convergence}

::: problem ★ 基本：一様収束の判定 {#calc:ex-uc-1}
$f_{n}(x)=\frac{x}{1+nx^{2}}$ は $\R$ で $0$ に一様収束することを示せ。
:::

::: solution
$1+nx^{2}\ge2\sqrt n\lvert x\rvert$（相加相乗平均）なので $\lvert f_{n}(x)\rvert\le\frac{1}{2\sqrt n}\to0$（$x$ によらない）。
:::

::: problem ★ 基本：一様収束しない例 {#calc:ex-uc-2}
$f_{n}(x)=x^{n}$ は $[0,\frac12]$ では一様収束するが、$[0,1)$ では一様収束しないことを示せ。
:::

::: solution
$[0,\frac12]$ で $\sup\lvert x^{n}\rvert=2^{-n}\to0$。$[0,1)$ では各点で $0$ に収束するが、$\sup_{[0,1)}x^{n}=1$。
:::

::: problem ★★ 標準：M 判定法 {#calc:ex-uc-3}
$\sum_{n\ge1}\frac{\sin nx}{n^{2}}$ は $\R$ で一様収束し、連続関数を定めることを示せ。項別微分した級数はどうか。
:::

::: solution
$\bigl\lvert\frac{\sin nx}{n^{2}}\bigr\rvert\le\frac1{n^{2}}$ で $\sum\frac{1}{n^{2}}<\infty$ なので M 判定法で一様収束し、極限は連続（一様収束の基本定理）。項別微分 $\sum\frac{\cos nx}{n}$ は $x=0$ で発散するので、項別微分の定理は使えない。
:::

::: problem ★★★ 発展：多項式の一様極限 {#calc:ex-uc-4}
$\R$ 全体で一様収束する多項式の列の極限は多項式であることを示せ。
:::

::: solution
一様コーシー性から、十分大きい $m,n$ で $p_{m}-p_{n}$ は $\R$ 上有界な多項式なので定数。よってある $N$ から先 $p_{n}=p_{N}+c_{n}$（$c_{n}$ は定数）で、$c_{n}$ は収束し、極限は $p_{N}+\lim c_{n}$。
:::

## 冪級数 {#calc:sec-ps-exercises}

対応するページ：\ref{calc:page-power-series}

::: problem ★ 基本：収束半径 {#calc:ex-ps-1}
次の冪級数の収束半径を求めよ。(1) $\sum n^{2}x^{n}$ (2) $\sum\frac{x^{n}}{n!}$ (3) $\sum n!\,x^{n}$ (4) $\sum\frac{x^{n}}{2^{n}+3^{n}}$
:::

::: solution
比判定法（またはコーシー–アダマール）で (1) $1$ (2) $\infty$ (3) $0$ (4) $(2^{n}+3^{n})^{1/n}\to3$ なので $3$。
:::

::: problem ★ 基本：冪級数の和 {#calc:ex-ps-2}
$\lvert x\rvert<1$ で $\sum_{n\ge1}nx^{n}=\frac{x}{(1-x)^{2}}$ を示せ。
:::

::: solution
$\sum_{n\ge0}x^{n}=\frac1{1-x}$ を項別微分（収束半径の内側で可能）して $\sum nx^{n-1}=\frac1{(1-x)^{2}}$、$x$ を掛ける。
:::

::: problem ★★ 標準：アークタンジェントの級数 {#calc:ex-ps-3}
$\arctan x=\sum_{n\ge0}\frac{(-1)^{n}x^{2n+1}}{2n+1}$（$\lvert x\rvert<1$）を示し、アーベルの定理を使って $\frac\pi4=1-\frac13+\frac15-\cdots$ を導け。
:::

::: solution
$\frac{1}{1+t^{2}}=\sum(-1)^{n}t^{2n}$（$\lvert t\rvert<1$）を $0$ から $x$ まで項別積分。$x=1$ で右辺は交代級数として収束するので、アーベルの定理から $\lim_{x\to1-}$ をとって $\arctan1=\frac\pi4$。
:::

::: problem ★★★ 発展：解析的でない無限回微分可能関数 {#calc:ex-ps-4}
$f(x)=e^{-1/x^{2}}$（$x\neq0$）, $f(0)=0$ は $C^{\infty}$ で $f^{(k)}(0)=0$ だが、$0$ の近くで冪級数で表せないことを示せ。
:::

::: solution
帰納法で $x\neq0$ では $f^{(k)}(x)=P_{k}(1/x)e^{-1/x^{2}}$（$P_{k}$ は多項式）。$y=1/x$ として $y^{m}e^{-y^{2}}\to0$ から $f^{(k)}(0)=\lim\frac{f^{(k-1)}(h)}{h}=0$。冪級数で表せるなら係数がすべて $0$ で $f\equiv0$ となるが、$x\neq0$ で $f(x)>0$。
:::
