# 演習：初等関数 {#calc:page-exercises-elementary-functions keywords="exercises, Elementary Functions"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exelementaryfunctions-notation}

- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## 指数関数と対数関数 {#calc:sec-el-exercises}

対応するページ：\ref{calc:page-exp-log}

::: problem ★ 基本：指数関数の極限 {#calc:ex-el-1}
$\lim_{n\to\infty}\bigl(1+\frac xn\bigr)^{n}=e^{x}$ を、$\log$ の連続性と $\lim_{h\to0}\frac{\log(1+h)}{h}=1$ から示せ。
:::

::: solution
$n\log\bigl(1+\frac xn\bigr)=x\cdot\frac{\log(1+x/n)}{x/n}\to x$（$x\neq0$）。$\exp$ の連続性から従う。
:::

::: problem ★ 基本：不定形の極限 {#calc:ex-el-2}
(1) $\lim_{x\to0+}x^{x}$ (2) $\lim_{x\to\infty}\frac{\log x}{x^{\alpha}}$（$\alpha>0$）を求めよ。
:::

::: solution
(1) $x\log x\to0$（$x=e^{-y}$ として $-ye^{-y}\to0$）なので $1$。(2) $x=e^{y}$ とすると $ye^{-\alpha y}\to0$ なので $0$。
:::

::: problem ★★ 標準：e の評価 {#calc:ex-el-3}
$2<e<3$ と、$0<e-\sum_{k=0}^{n}\frac{1}{k!}<\frac{1}{n!\,n}$ を示せ。
:::

::: solution
剰余 $\sum_{k>n}\frac{1}{k!}<\frac{1}{(n+1)!}\sum_{j\ge0}\frac{1}{(n+1)^{j}}=\frac{1}{(n+1)!}\cdot\frac{n+1}{n}=\frac{1}{n!\,n}$。$n=1$ で $0<e-2<1$。
:::

::: problem ★★★ 発展：e の無理性 {#calc:ex-el-4}
$e$ が無理数であることを示せ。
:::

::: solution
$e=\frac pq$ なら $q!\bigl(e-\sum_{k\le q}\frac1{k!}\bigr)$ は整数だが、前問から $0$ と $\frac1q\le1$ の間に真に入る。矛盾。
:::

## 三角関数と円周率 {#calc:sec-tr-exercises}

対応するページ：\ref{calc:page-trig}

::: problem ★ 基本：加法定理の応用 {#calc:ex-tr-1}
$\cos\frac\pi{12}$, $\sin\frac{\pi}{12}$ と $\tan\frac{\pi}{8}$ を求めよ。
:::

::: solution
$\frac\pi{12}=\frac\pi3-\frac\pi4$ から $\cos\frac\pi{12}=\frac{\sqrt6+\sqrt2}{4}$, $\sin\frac\pi{12}=\frac{\sqrt6-\sqrt2}{4}$。半角公式 $\tan\frac\theta2=\frac{1-\cos\theta}{\sin\theta}$ に $\theta=\frac\pi4$ で $\sqrt2-1$。
:::

::: problem ★ 基本：三角関数の積分 {#calc:ex-tr-2}
$\int_{0}^{2\pi}\sin^{2}x\,dx$ と $\int_{0}^{2\pi}\sin mx\sin nx\,dx$（$m,n\ge1$）を求めよ。
:::

::: solution
$\pi$。積和公式 $\sin mx\sin nx=\frac12(\cos(m-n)x-\cos(m+n)x)$ から、$m\neq n$ で $0$、$m=n$ で $\pi$（直交関係）。
:::

::: problem ★★ 標準：ジョルダンの不等式 {#calc:ex-tr-3}
$0\le x\le\frac\pi2$ で $\frac{2}{\pi}x\le\sin x\le x$ を示せ。
:::

::: solution
$\sin$ は $[0,\frac\pi2]$ で凹（$\sin''=-\sin\le0$）なので、両端を結ぶ弦 $\frac2\pi x$ より上。$x-\sin x$ は $0$ で $0$、導関数 $1-\cos x\ge0$ なので非負。
:::

::: problem ★★★ 発展：円周率の評価 {#calc:ex-tr-4}
$\frac{\pi}{4}=4\arctan\frac15-\arctan\frac{1}{239}$（マチンの公式）を加法定理で確かめ、これを使うと $\pi$ を速く計算できる理由を説明せよ。
:::

::: solution
$\tan(2\alpha)=\frac{2\tan\alpha}{1-\tan^{2}\alpha}$ を $\tan\alpha=\frac15$ に 2 回使うと $\tan4\alpha=\frac{120}{119}$、$\tan(4\alpha-\beta)$（$\tan\beta=\frac1{239}$）は $\frac{120/119-1/239}{1+120/(119\cdot239)}=1$。$\arctan$ の級数は $x=\frac15$ で項が $5^{-2n}$ 程度に減るので、1 項ごとに約 1.4 桁ずつ精度が上がる。
:::

## ガンマ関数とスターリングの公式 {#calc:sec-ga-exercises}

対応するページ：\ref{calc:page-gamma}

::: problem ★ 基本：ガンマ関数の値 {#calc:ex-ga-1}
$\Gamma(\frac12)=\sqrt\pi$ を認めて $\Gamma(\frac52)$ と $\Gamma(n+\frac12)$ を求めよ。
:::

::: solution
$\Gamma(s+1)=s\Gamma(s)$ から $\Gamma(\frac52)=\frac32\cdot\frac12\sqrt\pi=\frac{3\sqrt\pi}{4}$、一般に $\Gamma(n+\frac12)=\frac{(2n)!}{4^{n}n!}\sqrt\pi$。
:::

::: problem ★ 基本：ベータ関数 {#calc:ex-ga-2}
$B(2,3)=\int_{0}^{1}x(1-x)^{2}\,dx$ を直接計算し、$\frac{\Gamma(2)\Gamma(3)}{\Gamma(5)}$ と比べよ。
:::

::: solution
$\int_{0}^{1}(x-2x^{2}+x^{3})=\frac12-\frac23+\frac14=\frac{1}{12}$、$\frac{1!\,2!}{4!}=\frac{2}{24}=\frac1{12}$。
:::

::: problem ★★ 標準：積分のガンマ関数による表示 {#calc:ex-ga-3}
$\int_{0}^{\pi/2}\sin^{4}x\,dx$ をベータ関数で表して計算せよ。
:::

::: solution
$x=\sin^{2}\theta$ と置くと $\int_{0}^{\pi/2}\sin^{2a-1}\theta\cos^{2b-1}\theta\,d\theta=\frac12B(a,b)$。$a=\frac52$, $b=\frac12$ で $\frac12\cdot\frac{\Gamma(5/2)\Gamma(1/2)}{\Gamma(3)}=\frac12\cdot\frac{3\pi/4}{2}=\frac{3\pi}{16}$。
:::

::: problem ★★★ 発展：ガンマ関数の対数凸性 {#calc:ex-ga-4}
$\log\Gamma$ が $(0,\infty)$ で凸であることを、ヘルダーの不等式から示せ。
:::

::: solution
$s=\lambda a+(1-\lambda)b$ とすると $t^{s-1}e^{-t}=(t^{a-1}e^{-t})^{\lambda}(t^{b-1}e^{-t})^{1-\lambda}$。ヘルダー（指数 $\frac1\lambda$, $\frac1{1-\lambda}$）で $\Gamma(s)\le\Gamma(a)^{\lambda}\Gamma(b)^{1-\lambda}$。対数をとる。
:::
