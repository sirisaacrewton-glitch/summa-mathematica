# 実数論（Real Numbers and Series）

順序体とアルキメデスの原理、連続の公理とその同値な形（上限・デデキント・単調収束・区間縮小・ボルツァーノ–ワイエルシュトラス・コーシー・ハイネ–ボレル・連結性）、デデキント切断とコーシー列による実数の構成と一意性、数列の極限、級数の収束判定・絶対収束と再配列・コーシー積と二重級数。

<p class="mn-msc">MSC2020: 26A03, 40A05</p>
