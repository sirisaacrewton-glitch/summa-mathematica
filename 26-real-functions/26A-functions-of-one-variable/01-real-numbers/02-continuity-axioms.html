# 連続の公理とその同値な形 {#calc:page-continuity-axioms keywords="completeness axiom of the real numbers, least upper bound property, Dedekind axiom, monotone convergence, nested interval property, Bolzano-Weierstrass, Cauchy completeness, Heine-Borel, connectedness, equivalences in an ordered field, complete ordered field, formal Laurent series, ultrapower"}

実数体を他の順序体から区別するのは「すき間がない」という性質（**実数の連続性**）である。この性質は、上限の存在、デデキントの切断、単調数列の収束、区間縮小法、有界数列の収束部分列、コーシー列の収束、有界閉区間のコンパクト性、連結性など、さまざまな形で述べられる。このページでは、任意の順序体の上で、これらがすべて同値であること（区間縮小法とコーシー列の収束は、アルキメデスの原理と合わせて）を証明する。さらに、アルキメデスの原理を外すと同値性が崩れる例を、形式的ローラン級数体と超冪で示す。

> 資料：杉浦光夫『解析入門 I』第 I 章 §3（注意 4 の (W)・(M)・(A)・(K)・(B-W)・(C) とデデキントの公理 (D)）の命題群を、ハイネ–ボレルと連結性まで含めて順序体の上で整理した。証明と反例（$\mathbb{Q}((t))$ と超冪）は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-ca-notation}

::: notation
- 順序体・アルキメデスの原理・上限と下限は \ref{calc:page-ordered-fields}（\ref{calc:archimedean}, \ref{calc:archimedean-equivalents}, \ref{calc:supremum}, \ref{calc:sup-characterization}）。
- 順序体 $K$ の数列 $(a_{n})_{n\ge1}$ が $a$ に**収束する**（$a_{n}\to a$）とは、任意の $\varepsilon>0$ に $N$ があって $n\ge N\Rightarrow|a_{n}-a|<\varepsilon$ となること。**コーシー列**とは、任意の $\varepsilon>0$ に $N$ があって $m,n\ge N\Rightarrow|a_{m}-a_{n}|<\varepsilon$ となること。**単調増加**は $a_{n}\le a_{n+1}$。部分列は狭義単調増加な $n_{1}<n_{2}<\cdots$ による $(a_{n_{k}})_{k}$。
- **区間縮小列**とは、閉区間の列 $[a_{n},b_{n}]$（$a_{n}\le b_{n}$）で $[a_{n+1},b_{n+1}]\subset[a_{n},b_{n}]$ となるもの。
- $K$ には順序位相（\ref{top:order-topology}）を入れる。順序体には最大元・最小元がないので、開区間 $(c,d)$ の全体が開基をなし（\ref{top:order-topology-base}）、$U$ が開 $\iff$ 各 $s\in U$ に $\delta>0$ があって $(s-\delta,s+\delta)\subset U$。コンパクト性・連結性は一般位相の定義による。
- **公理系**：$\ZF$ で行う。選択公理は、最後の例（超冪）を除いて使わない。
:::

## 数列の基本性質 {#calc:sec-ca-sequences}

::: lemma 順序体の数列 {#calc:ordered-field-sequences keywords="uniqueness of limits, limits preserve weak inequalities, convergent sequences are Cauchy and bounded, a Cauchy sequence with a convergent subsequence converges, every sequence has a monotone subsequence" index="順序体の数列|じゅんじょたいのすうれつ, 単調部分列|たんちょうぶぶんれつ"}
$K$ を順序体とする。
1. 極限はただ一つ。$a_{n}\to a$, $b_{n}\to b$ で、すべての $n$ で $a_{n}\le b_{n}$ なら $a\le b$。
2. 収束列はコーシー列で、有界。
3. 収束する部分列をもつコーシー列は、その極限に収束する。
4. $a_{n}\to a$ なら、その部分列も $a$ に収束する。$a_{n}\to a$, $b_{n}\to b$ なら $a_{n}+b_{n}\to a+b$, $a_{n}-b_{n}\to a-b$。
5. 全順序集合の任意の列は、単調（増加または減少）な部分列をもつ。
:::

::: proof
**1.** $a_{n}\to a$, $a_{n}\to a'$, $a\neq a'$ なら、$\varepsilon\defeq\frac{|a-a'|}{2}$ について十分大きい $n$ で $|a-a'|\le|a-a_{n}|+|a_{n}-a'|<2\varepsilon$ となり矛盾。後半：$a>b$ とし $\varepsilon\defeq\frac{a-b}{2}$ とすると、十分大きい $n$ で $a_{n}>a-\varepsilon=b+\varepsilon>b_{n}$ となり矛盾。

**2.** $|a_{m}-a_{n}|\le|a_{m}-a|+|a-a_{n}|$。有界性：$\varepsilon=1$ の $N$ について、$n\ge N$ では $|a_{n}|<|a|+1$、残りは有限個なので最大値をとる。

**3.** $a_{n_{k}}\to a$ とし、$\varepsilon>0$ について、コーシー性の $N$（$\frac{\varepsilon}{2}$ について）と、$|a_{n_{k}}-a|<\frac{\varepsilon}{2}$ となる $k$ で $n_{k}\ge N$ のものをとる。$n\ge N$ なら $|a_{n}-a|\le|a_{n}-a_{n_{k}}|+|a_{n_{k}}-a|<\varepsilon$。

**4.** $n_{k}\ge k$ から前半。後半は三角不等式と $\frac{\varepsilon}{2}$。

**5.** $n$ が**山**であるとは、すべての $m>n$ で $a_{m}\le a_{n}$ となることとする。山が無限個あれば、それらを小さい順に $n_{1}<n_{2}<\cdots$ と並べると（$n_{k+1}$ は $n_{k}$ より大きい最小の山）、$a_{n_{1}}\ge a_{n_{2}}\ge\cdots$。山が有限個なら、最大の山より大きい $n_{1}$ をとり、$n_{k+1}$ を「$m>n_{k}$ で $a_{m}>a_{n_{k}}$ となる最小の $m$」（$n_{k}$ は山でないので存在する）と定めると、$a_{n_{1}}<a_{n_{2}}<\cdots$。

::: hypcheck
- **選択公理は使わない**：5 では、部分列の添字を「最小の」自然数として一意に決めた（$\mathbb{N}$ の整列性）。
:::
:::

## 連続の公理の同値な形 {#calc:sec-ca-equivalence}

::: theorem 連続の公理の同値な形 {#calc:continuity-axioms-equivalent keywords="in an ordered field the following are equivalent: least upper bound property (W), Dedekind axiom (D), monotone convergence (M), nested intervals with Archimedes (K)+(A), Bolzano-Weierstrass (B-W), Cauchy completeness with Archimedes (C)+(A), compactness of closed bounded intervals (HB), connectedness (Conn)" index="連続の公理|れんぞくのこうり, 実数の連続性|じっすうのれんぞくせい, デデキントの公理|ででぎんとのこうり, 区間縮小法|くかんしゅくしょうほう, 単調収束定理|たんちょうしゅうそくていり, コーシーの収束条件|こーしーのしゅうそくじょうけん"}
順序体 $K$ について、次はすべて同値である。
- **(W)**（連続の公理）上に有界な空でない部分集合は上限をもつ。
- **(D)**（デデキントの公理）$K=A\sqcup B$, $A,B\neq\varnothing$, $a\in A$, $b\in B\Rightarrow a<b$（**切断**）なら、$A$ の最大元か $B$ の最小元が存在する。
- **(M)** 上に有界な単調増加数列は収束する。
- **(K)+(A)** アルキメデスの原理と、**区間縮小法**：区間縮小列 $[a_{n},b_{n}]$ について $\bigcap_{n}[a_{n},b_{n}]\neq\varnothing$。
- **(B-W)** 有界な数列は収束する部分列をもつ。
- **(C)+(A)** アルキメデスの原理と、**コーシーの収束条件**：コーシー列は収束する。
- **(HB)** 有界閉区間 $[a,b]$ はコンパクト。
- **(Conn)** $K$ は連結。
:::

::: intuition
どの条件も「$K$ にすき間がない」ことを別の角度から述べている：上限が欠けていない (W)、切り口に必ず端がある (D)、増え続けて止まる列には行き先がある (M)、縮む区間の芯が空でない (K)、有界な列は集積する (B-W)、互いに近づく列には行き先がある (C)、閉区間は有限個の開集合で覆える (HB)、二つの開集合に分けられない (Conn)。(K) と (C) は「すき間」を「列が近づく先」で測るので、無限小があって列が端まで届かない（アルキメデス的でない）体では、すき間を見逃してしまう。それを補うのが (A) である。
:::

::: proof
以下の含意を示す：(W)⇔(D)、(W)⇒(M)⇒(K)+(A)⇒(W)、(M)⇒(B-W)⇒(C)+(A)⇒(W)、(W)⇔(HB)、(W)⇔(Conn)。

**Step 1（(W) ⇒ (D)）.** 切断 $(A,B)$ について、$B$ の元は $A$ の上界なので、(W) から $s\defeq\sup A$ がある。$s\in A$ なら $s$ は $A$ の最大元。$s\in B$ なら、任意の $b\in B$ は $A$ の上界なので $s\le b$ で、$s$ は $B$ の最小元。

**Step 2（(D) ⇒ (W)）.** $A$ を上に有界な空でない集合とし、最大元をもたないとする（もてばそれが上限）。$B$ を $A$ の上界の全体、$C\defeq K\setminus B$ とする。$B\neq\varnothing$、$A\subset C$（$a\in A$ はより大きい $A$ の元があるので上界でない）なので $C\neq\varnothing$。$c\in C$, $b\in B$ なら、$c$ は上界でないので $c<a\le b$ となる $a\in A$ がある。よって $(C,B)$ は切断。$C$ に最大元 $m$ があるとすると、$m$ は上界でないので $m<a$ となる $a\in A\subset C$ があり矛盾。(D) から $B$ に最小元があり、それが $\sup A$。

**Step 3（(W) ⇒ (M)）.** $(a_{n})$ を上に有界な単調増加列、$s\defeq\sup_{n}a_{n}$ とする。$\varepsilon>0$ について \ref{calc:sup-characterization} の 1 から $a_{N}>s-\varepsilon$ となる $N$ があり、$n\ge N$ なら $s-\varepsilon<a_{N}\le a_{n}\le s$。

**Step 4（(M) ⇒ (A)）.** $K$ がアルキメデス的でないなら、$a_{n}\defeq n$ は上に有界な単調増加列で、(M) から収束する。収束列はコーシー列（\ref{calc:ordered-field-sequences} の 2）なので、十分大きい $n$ で $1=|a_{n+1}-a_{n}|<1$ となり矛盾。

**Step 5（(M) ⇒ (K)）.** 区間縮小列 $[a_{n},b_{n}]$ で、$(a_{n})$ は $b_{1}$ で上に有界な単調増加列、$(-b_{n})$ は $-a_{1}$ で上に有界な単調増加列。(M) から $a_{n}\to a$, $b_{n}\to b$。$m\ge n$ なら $a_{n}\le a_{m}\le b_{m}\le b_{n}$ なので、\ref{calc:ordered-field-sequences} の 1（$m\to\infty$）から $a_{n}\le a\le b\le b_{n}$。よって $a\in\bigcap_{n}[a_{n},b_{n}]$。

**Step 6（二分法の準備）.** 上に有界な空でない $A$ が最大元をもたないとき、$x\in A$ について $a_{0}\defeq x$（上界でない）、$b_{0}$ を上界とし、$m\defeq\frac{a_{n}+b_{n}}{2}$ が上界なら $[a_{n+1},b_{n+1}]\defeq[a_{n},m]$、そうでなければ $[m,b_{n}]$ と定める。帰納法で、$a_{n}$ は上界でなく、$b_{n}$ は上界で、$b_{n}-a_{n}=\frac{b_{0}-a_{0}}{2^{n}}$、$[a_{n},b_{n}]$ は区間縮小列。(A) があれば、$2^{n}\ge n$ と \ref{calc:archimedean-equivalents} の 2 から $b_{n}-a_{n}\to0$。

**Step 7（二分法の極限は上限）.** Step 6 の列について、$s$ が $a_{n}\le s\le b_{n}$（すべての $n$）を満たし、$b_{n}-a_{n}\to0$ なら、$s=\sup A$。実際、$x\in A$ で $x>s$ なら、$b_{n}\ge x$ から $b_{n}-a_{n}\ge x-s>0$（すべての $n$）となり矛盾。$\varepsilon>0$ について $b_{n}-a_{n}<\varepsilon$ となる $n$ をとると $a_{n}\ge s-(b_{n}-a_{n})>s-\varepsilon$ で、$a_{n}$ は上界でないので $x>a_{n}>s-\varepsilon$ となる $x\in A$ がある。\ref{calc:sup-characterization} の 1 から $s=\sup A$。

**Step 8（(K)+(A) ⇒ (W)）.** Step 6 の区間縮小列に (K) を使い、$s\in\bigcap_{n}[a_{n},b_{n}]$ をとる。Step 7 から $s=\sup A$。

**Step 9（(M) ⇒ (B-W)）.** 有界な列は単調な部分列をもつ（\ref{calc:ordered-field-sequences} の 5）。それが増加なら (M) で収束、減少なら $-1$ 倍して (M) を使う。

**Step 10（(B-W) ⇒ (C)+(A)）.** コーシー列は有界（$\varepsilon=1$ の $N$ から先は $a_{N}$ の近く、残りは有限個）で、(B-W) から収束する部分列をもち、\ref{calc:ordered-field-sequences} の 3 から収束する。(A)：アルキメデス的でないなら、$a_{n}\defeq n$ は有界な列で、(B-W) の収束部分列 $(n_{k})$ はコーシー列だが、$|n_{k+1}-n_{k}|\ge1$ で矛盾。

**Step 11（(C)+(A) ⇒ (W)）.** Step 6 の列について、$m\ge n$ なら $a_{n}\le a_{m}\le b_{m}\le b_{n}$ なので $|b_{m}-b_{n}|\le b_{n}-a_{n}\to0$ で、$(b_{n})$ はコーシー列。(C) から $b_{n}\to s$。Step 5 と同様に $a_{n}\le s\le b_{n}$ で、Step 7 から $s=\sup A$。

**Step 12（(W) ⇒ (HB)）.** $\mathcal{U}$ を $[a,b]$ の開被覆（$K$ の開集合の族）とし、$S\defeq\{x\in[a,b]\mid[a,x]$ は $\mathcal{U}$ の有限個で覆える$\}$ とおく。$a\in S$ で、$S$ は $b$ で上に有界なので $s\defeq\sup S\in[a,b]$。$s\in U\in\mathcal{U}$ とし、$(s-\delta,s+\delta)\subset U$ となる $\delta>0$ をとる。$s-\delta$ は $S$ の上界でないので $x>s-\delta$ となる $x\in S$ があり、$[a,x]$ の有限被覆に $U$ を加えると $[a,\min(s+\frac{\delta}{2},b)]$ が覆える。よって $\min(s+\frac{\delta}{2},b)\in S$ で、これは $s$ 以下なので $s=b$、すなわち $[a,b]$ は有限個で覆える。

**Step 13（(HB) ⇒ (W)）.** $A$ が上に有界な空でない集合で上限をもたないとし、$a_{0}\in A$ と上界 $b$ をとる。$a\in A$ について $V_{a}\defeq\{x\mid x<a\}$、$A$ の上界 $u$ について $W_{u}\defeq\{x\mid x>u\}$ とおくと、これらは開集合で $[a_{0},b]$ を覆う：$x$ が上界でなければ $x<a$ となる $a\in A$ があって $x\in V_{a}$、$x$ が上界なら最小の上界でないので上界 $u<x$ があって $x\in W_{u}$。(HB) から有限個 $V_{a_{1}},\dots,V_{a_{k}}$, $W_{u_{1}},\dots,W_{u_{l}}$ で覆える。$a^{*}\defeq\max(a_{0},a_{1},\dots,a_{k})\in A\cap[a_{0},b]$ は、$a^{*}\ge a_{i}$ なのでどの $V_{a_{i}}$ にも入らず、$u_{j}$ は上界なので $a^{*}\le u_{j}$ でどの $W_{u_{j}}$ にも入らない。矛盾。

**Step 14（(W) ⇒ (Conn)）.** $K=U\sqcup V$（$U,V$ は空でない開集合）とし、$u\in U$, $v\in V$ で $u<v$ とする（逆なら役割を入れ替える）。$s\defeq\sup(U\cap[u,v])$ をとる。$s\in U$ なら $s<v$ で、$(s-\delta,s+\delta)\subset U$ となる $\delta$ について $\min(s+\frac{\delta}{2},v)\in U\cap[u,v]$ は $s$ より大きく矛盾。$s\in V$ なら $s>u$ で、$(s-\delta,s+\delta)\subset V$ となる $\delta$ について、$U\cap[u,v]$ の元は $s-\delta$ 以下となり、$s-\delta$ が上界で矛盾。

**Step 15（(Conn) ⇒ (W)）.** $A$ が上に有界な空でない集合で上限をもたないとし、$B$ を上界の全体、$L\defeq K\setminus B$ とする。$b\in B$ なら、$b$ は最小の上界でないので上界 $b'<b$ があり、$(b',b+1)\subset B$。$x\in L$ なら $a>x$ となる $a\in A$ があり、$(x-1,a)\subset L$。よって $B$, $L$ は交わらない空でない開集合で $K=B\sqcup L$、(Conn) に反する。

::: hypcheck
- **(A) が (K)・(C) に必要**：Step 6 の区間の幅を $0$ に近づけるのに使った。外すと偽（下の \ref{calc:laurent-series-field} と \ref{calc:ultrapower-nested}）。
- **選択公理**：使わない。Step 6 の二分法は「中点が上界かどうか」で一意に決まり、Step 13 の $U_{x}$ も選択なしに定義できる（手順の中に注記した）。数列の部分列（\ref{calc:ordered-field-sequences} の 5）も最小の添字で決めた。
- **順序体であること**：中点 $\frac{a+b}{2}$、絶対値、$2^{n}\ge n$ などで使った。(W)・(D)・(HB)・(Conn) の同値性は、端点をもたない稠密な全順序集合でも成り立つ（Step 1・2・13 は順序だけを使い、Step 12・14・15 の $s+\frac{\delta}{2}$, $b+1$ などを、稠密性と端点のなさで選んだ元に置き換えればよい）。
:::
:::

::: definition 完備順序体 {#calc:complete-ordered-field keywords="complete ordered field: an ordered field satisfying the equivalent forms of the completeness axiom; the real number field" index="完備順序体|かんびじゅんじょたい, 実数体|じっすうたい"}
\ref{calc:continuity-axioms-equivalent} の同値な条件を満たす順序体を**完備順序体**という。完備順序体は存在し、順序体として同型を除いてただ一つである（\ref[実数の構成と一意性]{calc:page-real-construction}）。それを**実数体** $\mathbb{R}$ という。
:::

::: corollary 実数体の基本性質 {#calc:reals-basic keywords="the real numbers are Archimedean, Q is dense in R, monotone convergence, Bolzano-Weierstrass, Cauchy completeness, nested intervals, intermediate value theorem" index="実数体の基本性質|じっすうたいのきほんせいしつ"}
完備順序体 $\mathbb{R}$ はアルキメデス的で、$\mathbb{Q}$ は $\mathbb{R}$ で稠密。(M)・(K)・(B-W)・(C)・(HB)・(Conn) がすべて成り立つ。とくに、区間 $I\subset\mathbb{R}$ 上の連続関数 $f$ について、$f(a)<c<f(b)$ なら $f(\xi)=c$ となる $\xi$ が $a$ と $b$ の間にある（**中間値の定理**）。
:::

::: proof
\ref{calc:continuity-axioms-equivalent} と \ref{calc:archimedean-equivalents} の 5。中間値の定理：(W)⇒(Conn) の証明（Step 14）は区間 $[a,b]$ にもそのまま使え、$[a,b]$ は連結。連結空間の連続像は連結なので、\ref{top:intermediate-value} の議論で従う。
:::

## アルキメデスの原理が外せない例 {#calc:sec-ca-counterexamples}

::: example 有理数体
$\mathbb{Q}$ はアルキメデス的だが、どの条件も満たさない：$A\defeq\{r\in\mathbb{Q}\mid r\le0$ または $r^{2}<2\}$ は上に有界（$2$ が上界）だが $\mathbb{Q}$ に上限をもたない（問題 \ref{calc:prob-ca-sqrt2}）。
:::

::: proposition 形式的ローラン級数体 {#calc:laurent-series-field keywords="the field Q((t)) of formal Laurent series ordered with t positive infinitesimal is Cauchy complete but not Archimedean and fails the nested interval property" index="形式的ローラン級数体|けいしきてきろーらんきゅうすうたい"}
$\mathbb{Q}((t))$ を、$f=\sum_{k\ge k_{0}}c_{k}t^{k}$（$k_{0}\in\mathbb{Z}$, $c_{k}\in\mathbb{Q}$）の形の形式的ローラン級数の体とし、$f\neq0$ の**位数** $v(f)$ を $c_{k}\neq0$ となる最小の $k$、$f>0$ を $c_{v(f)}>0$ と定める。
1. $\mathbb{Q}((t))$ は順序体で、$0<t<\frac1n$（すべての $n\ge1$）。とくにアルキメデス的でない。
2. (C) を満たす。
3. (K) を満たさない。
:::

::: proof
**Step 1（体）.** 和と積は係数の有限和で定義され（積の $t^{k}$ の係数は有限和 $\sum_{i+j=k}c_{i}d_{j}$）、可換環になる。$f\neq0$ は $f=c\,t^{v}(1-h)$（$c=c_{v(f)}\neq0$、$h$ は位数 $1$ 以上）と書け、$(1-h)^{-1}=\sum_{m\ge0}h^{m}$（$h^{m}$ の位数は $m$ 以上なので、各係数は有限和）から $f^{-1}=c^{-1}t^{-v}(1-h)^{-1}$。

**Step 2（1）.** $P\defeq\{f\neq0\mid c_{v(f)}>0\}$ について、$f\neq0$ なら $f\in P$ と $-f\in P$ のちょうど一方が成り立ち、$f,g\in P$ なら $fg\in P$（最低次の係数は積）、$f+g\in P$（位数が異なれば低い方の係数、等しければ和）。よって順序体。$\frac1n-t$ の最低次の係数は $\frac1n>0$ なので $t<\frac1n$。

**Step 3（位数と大きさ）.** $\varepsilon>0$ について、$v(g)>v(\varepsilon)$ なら $|g|<\varepsilon$（$\varepsilon-|g|$ の最低次の係数は $\varepsilon$ のそれで正）。逆に $|g|<t^{N+1}$ なら $v(g)\ge N+1$（$v(g)\le N$ なら $|g|-t^{N+1}$ の最低次の係数は $|g|$ のそれで正）。

**Step 4（2）.** $(f_{n})$ をコーシー列とする。Step 3 から、各 $N$ に $n_{N}$ があって $m,n\ge n_{N}$ なら $v(f_{m}-f_{n})>N$、すなわち $f_{m}$ と $f_{n}$ の $t^{k}$（$k\le N$）の係数は一致する。$N=0$ から、$n\ge n_{0}$ の $f_{n}$ の負の次数の係数は $f_{n_{0}}$ のそれに等しく、位数は共通の下界をもつ。$f$ の $t^{k}$ の係数を「$n\ge n_{\max(k,0)}$ での $f_{n}$ の $t^{k}$ の係数」と定めると $f\in\mathbb{Q}((t))$ で、$n\ge n_{N}$ なら $v(f-f_{n})>N$。$\varepsilon>0$ について $N\defeq v(\varepsilon)$ とすれば、Step 3 から $n\ge n_{N}$ で $|f-f_{n}|<\varepsilon$。

**Step 5（3）.** $I_{n}\defeq[n,\frac{1}{nt}]$ とする。$\frac1{nt}-n$ の最低次の係数は $\frac1n>0$ なので $I_{n}$ は空でなく、$I_{n+1}\subset I_{n}$。$x\in\bigcap I_{n}$ とすると、$x\ge n$（すべての $n$）なので $x>0$。$v(x)\ge0$ なら、$x$ の $t^{0}$ の係数を $c_{0}$ とすると $|c_{0}|+1-x$ の最低次の係数は $|c_{0}|+1-c_{0}>0$（$v(x)=0$ のとき）または $|c_{0}|+1>0$（$v(x)>0$ のとき）なので $x<|c_{0}|+1$ となり、$x\ge n$ に反する。よって $v(x)<0$ で、$x>0$ から最低次の係数は正。$v(x)\le-2$ なら $x-\frac1t$ の最低次の係数は $x$ のそれで正なので $x>\frac1t$ で $x\le\frac1t$（$n=1$）に反する。$v(x)=-1$ なら $x=c\,t^{-1}+\cdots$（$c>0$）で、$\frac1n<c$ となる $n$ について $x>\frac{1}{nt}$ となり矛盾。よって $\bigcap I_{n}=\varnothing$。
:::

::: example 区間縮小法とコーシーの収束条件を満たす非アルキメデス的順序体 {#calc:ultrapower-nested}
$\mathcal{U}$ を $\omega$ 上の非単項超フィルターとし、$K\defeq\mathbb{Q}^{\omega}/\mathcal{U}$（超冪）とする。$K$ は $\mathbb{Q}$ の初等拡大（ウォシュの定理）なので順序体で、可算不完全な超フィルターによる超積は $\aleph_{1}$ 飽和（\ref{model:ultraproduct-saturated}）。
1. 型 $\{x>n\mid n\in\mathbb{N}\}$ は有限充足可能なので実現され、$K$ はアルキメデス的でない。
2. (K)：区間縮小列 $[a_{n},b_{n}]$ について、可算個のパラメータをもつ型 $\{a_{n}\le x\le b_{n}\mid n\in\mathbb{N}\}$ は有限充足可能（有限個の共通部分は最小の区間で空でない）なので実現される。
3. (C)：コーシー列 $(a_{n})$ について、型 $\{0<x\}\cup\{x<|a_{m}-a_{n}|\mid a_{m}\neq a_{n}\}$ は有限充足可能なので、すべての $|a_{m}-a_{n}|\neq0$ より小さい正の元 $\varepsilon_{0}$ がある。$\varepsilon_{0}$ についてのコーシー性から、ある $N$ 以降 $|a_{m}-a_{n}|<\varepsilon_{0}$、すなわち $a_{m}=a_{n}$ で、列は最終的に定数なので収束する。

したがって (K) と (C) は、(A) なしには (W) を導かない。非単項超フィルターの存在に選択公理（の弱い形）を使う。
:::

::: supplement
**一般化と関連する事実.**
- 二分法の議論は、アルキメデス的順序体では「(K) ⇔ (C) ⇔ (W)」を与える。非アルキメデス的な体では、(C) は (K) を導かない：$\mathbb{Q}((t))$ は (C) を満たして (K) を満たさない（\ref{calc:laurent-series-field}）。上の超冪は (K) と (C) の両方を満たすが (W) を満たさない（\ref{calc:ultrapower-nested}）。
- 逆数学では、(B-W) や (M) を自然数の部分集合についての公理系 $\mathsf{RCA}_{0}$ の上で証明するには算術的内包公理 $\mathsf{ACA}_{0}$ が必要で、(HB) は弱ケーニッヒの補題 $\mathsf{WKL}_{0}$ と同値である（\ref{logic:heine-borel-wkl}）。同値な公理も、証明に必要な「強さ」は異なる。

**前提を変えると.** 選択公理なしでも、上の同値性はすべて成り立つ（数列の議論は二分法と最小の添字で行った）。一方、一般の距離空間でのコンパクトと点列コンパクトの同値性には可算選択公理が要る（\ref[連続関数]{calc:page-continuity} で ε-δ 連続と点列連続について同じ現象を扱う）。

**高い視点.** (W)・(D)・(HB)・(Conn) は順序だけで述べられ、和と積を使わない。これらは全順序集合としての完備性（デデキント完備）であり、(M)・(B-W)・(C) は列（可算な近似）による完備性である。二つの完備性をつなぐのがアルキメデスの原理で、それは「順序の上の可算な列で、どこまでも届く」こと（$\mathbb{N}$ が共終）を保証する。比喩で言えば、順序の完備性は「地図に穴がないこと」、列の完備性は「どの道をたどっても行き止まりに目的地があること」で、アルキメデスの原理は「道が地図の端まで続いている」ことを保証する。
:::

## 問題 {#calc:sec-ca-problems}

::: problem {#calc:prob-ca-sqrt2}
$\mathbb{Q}$ で $A\defeq\{r\in\mathbb{Q}\mid r\le0$ または $r^{2}<2\}$ は上限をもたないことを示せ。
:::

::: solution
$s=\sup A$ が $\mathbb{Q}$ にあるとする。$1\in A$ なので $s\ge1>0$。$s^{2}=2$ となる有理数はない（$s=\frac pq$ 既約なら $p^{2}=2q^{2}$ から $p$ は偶数、さらに $q$ も偶数となり矛盾）。$s^{2}<2$ なら、$h\defeq\frac{2-s^{2}}{2s+1}$ と $0<\delta\defeq\min(1,h)$ について $(s+\delta)^{2}=s^{2}+\delta(2s+\delta)\le s^{2}+\delta(2s+1)\le2$、等号は $s+\delta$ が $\sqrt2$ となるときだけで不可能なので $s+\delta\in A$ で上界に反する。$s^{2}>2$ なら、$\delta\defeq\frac{s^{2}-2}{2s}>0$ について $(s-\delta)^{2}>s^{2}-2s\delta=2$ で、$s-\delta>0$ なら $s-\delta$ も上界（$r\in A$, $r>0$ なら $r^{2}<2<(s-\delta)^{2}$ から $r<s-\delta$）となり矛盾（$s-\delta\le0$ は $2s^{2}\le s^{2}-2$ を意味し不可能）。
:::

::: problem {#calc:prob-ca-dedekind-dense-order}
\ref{calc:continuity-axioms-equivalent} の (W)⇔(D) の証明（Step 1・2）は、順序体の演算を使わずに、任意の全順序集合で「上に有界な空でない部分集合が上限をもつ」と「任意の切断で $A$ の最大元か $B$ の最小元が存在する」が同値であることを示していることを確かめよ。また $\mathbb{Z}$ はどちらも満たすが、順序体ではないことに注意せよ。
:::

::: solution
Step 1 は上界と最小元だけを使い、Step 2 も「上界でない元より大きい元がある」という順序の性質だけを使う（$A$ が最大元をもたないことと切断の定義）。$\mathbb{Z}$ では上に有界な空でない集合は最大元をもち（整列性）、切断 $(A,B)$ の $A$ は上に有界なので最大元をもつ。$\mathbb{Z}$ は体でない（$2$ の逆元がない）。
:::

::: problem {#calc:prob-ca-nested-open}
$\mathbb{R}$ で、開区間の縮小列 $(0,\frac1n)$ の共通部分は空であることを示せ。区間縮小法で閉区間が必要な理由を述べよ。
:::

::: solution
$x\in\bigcap_{n}(0,\frac1n)$ なら $0<x<\frac1n$（すべての $n$）で、アルキメデスの原理（\ref{calc:archimedean-equivalents} の 2）に反する。閉区間では端点の列 $a_{n}$, $b_{n}$ の極限が区間に残る（Step 5）が、開区間では極限 $0$ が区間から抜け落ちる。
:::
