# 順序体 {#calc:page-ordered-fields keywords="ordered field, absolute value, embedding of the rationals, Archimedean principle, floor function, density of the rationals, non-Archimedean ordered field, infinitesimal, upper bound, supremum, infimum"}

実数の性質は、「四則演算ができる」（体）、「大小が比べられ、演算と両立する」（順序体）、「すき間がない」（連続の公理）の三段に分けて理解できる。このページでは前の二段を扱う。任意の順序体が有理数体 $\mathbb{Q}$ を含むこと、「自然数がいくらでも大きくなる」という**アルキメデスの原理**とその言い換え、それが成り立たない順序体（無限小を含む体）の例、そして第三段で使う上限・下限の定義を述べる。次ページ \ref[連続の公理とその同値な形]{calc:page-continuity-axioms} で、第三段の公理のさまざまな形が同値であることを示す。

> 資料：杉浦光夫『解析入門 I』第 I 章 §1・§3、Rudin『Principles of Mathematical Analysis』第 1 章の内容に相当する標準的な事項。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-of-notation}

::: notation
- 順序環・順序体（狭義の全順序 $<$ が (O1) $a<b\Rightarrow a+c<b+c$、(O2) $0<a,0<b\Rightarrow0<ab$ を満たす体）と、その基本性質（$a\neq0$ なら $a^{2}>0$、$1>0$、標数 $0$、$a<b$, $c>0$ なら $ac<bc$、絶対値 $|a|\defeq\max(a,-a)$ の三角不等式と $|ab|=|a||b|$、$0<a<b$ なら $0<b^{-1}<a^{-1}$）は \ref{model:ordered-field}, \ref{model:ordered-field-basic} による。$a\le b$ は「$a<b$ または $a=b$」。
- 整域の順序は商体に一意に延びる（\ref{model:fraction-field-order}）。
- $\mathbb{N}=\{0,1,2,\dots\}$, $\mathbb{Z}$, $\mathbb{Q}$ は集合論の標準的な構成（\ref{set:number-systems-construction}）のもの。$\mathbb{N}$ の帰納法と、空でない部分集合が最小元をもつこと（整列性）を使う。$\mathbb{Q}$ は通常の順序で順序体である（構成の詳細は \ref[実数の構成と一意性]{calc:page-real-construction} で扱う）。
- 素体 \ref{fld:prime-field}。
- 順序体 $K$ の区間：$(a,b)\defeq\{x\mid a<x<b\}$、$[a,b]\defeq\{x\mid a\le x\le b\}$ など。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 順序体と有理数 {#calc:sec-of-rationals}

::: proposition 順序体の稠密性 {#calc:ordered-field-dense keywords="between two elements of an ordered field lies their midpoint; an element that is below every positive element is nonpositive" index="順序体の稠密性|じゅんじょたいのちゅうみつせい"}
$K$ を順序体とする。
1. $a<b$ なら $a<\frac{a+b}{2}<b$。
2. $a\in K$ がすべての $\varepsilon>0$ について $a<\varepsilon$ を満たすなら $a\le0$。$|a|<\varepsilon$（すべての $\varepsilon>0$）なら $a=0$。
:::

::: proof
1：$2=1+1>0$（\ref{model:ordered-field-basic}）なので $\frac12>0$。$a<b$ の両辺に $a$ を足して $2a<a+b$、$\frac12$ を掛けて $a<\frac{a+b}{2}$。同様に $a+b<2b$ から $\frac{a+b}{2}<b$。2：$a>0$ なら $\varepsilon\defeq\frac{a}{2}$ について $0<\varepsilon<a$（1 を $0<a$ に使う）となり仮定に反する。後半は $a$ と $-a$ に前半を使う。
:::

::: theorem 順序体は有理数体を含む {#calc:rational-embedding keywords="every ordered field contains a unique copy of Q: the unique ring homomorphism Q -> K is injective and order preserving" index="順序体の中の有理数体|じゅんじょたいのなかのゆうりすうたい"}
順序体 $K$ について、環準同型 $\iota\colon\mathbb{Q}\to K$ がただ一つ存在し、$\iota$ は単射で順序を保つ（$r<s\iff\iota(r)<\iota(s)$）。像は $K$ の素体である。
:::

::: proof
**Step 1（自然数）.** $\iota(n)\defeq n\cdot1=1+\cdots+1$（$n$ 個、$\iota(0)=0$）とする。$\iota(n+1)=\iota(n)+1>\iota(n)$（$1>0$ と (O1)）なので、帰納法で $m<n\Rightarrow\iota(m)<\iota(n)$。

**Step 2（整数と有理数）.** $\iota(-n)\defeq-\iota(n)$ で $\mathbb{Z}$ に延ばすと、$\iota$ は和と積を保つ（$\mathbb{N}$ の上で帰納法、負の数は符号の規則）。$m<n$ なら $\iota(n)-\iota(m)=\iota(n-m)>0$。$r=\frac{p}{q}$（$q>0$）について $\iota(r)\defeq\iota(p)\iota(q)^{-1}$（$\iota(q)>0$ なので可逆）。$\frac{p}{q}=\frac{p'}{q'}$ なら $pq'=p'q$ から $\iota(p)\iota(q')=\iota(p')\iota(q)$ で、値は代表によらない。和と積を保つことは、分数の和と積の公式を $\iota$ で写して確かめる。

**Step 3（順序）.** $r=\frac{p}{q}>0$（$p,q>0$）なら $\iota(r)=\iota(p)\iota(q)^{-1}>0$（正の元の逆元・積は正）。よって $r<s\Rightarrow\iota(s)-\iota(r)=\iota(s-r)>0$。全順序なので逆向きも成り立ち、とくに $\iota$ は単射。

**Step 4（一意性）.** 環準同型は $1\mapsto1$ なので、和と積を保つことから $\mathbb{N}$, $\mathbb{Z}$ 上で値が決まり、$\iota(q)\iota(q^{-1})=1$ から $\mathbb{Q}$ 上で決まる。像は $1$ を含む最小の部分体、すなわち素体（\ref{fld:prime-field}）。
:::

::: intuition
順序体の中では $1,1+1,1+1+1,\dots$ が狭義単調に増えるので、自然数・整数・有理数の「影」が必ず入っている。以下、$\iota$ で $\mathbb{Q}\subset K$ とみなす。問題は、この $\mathbb{Q}$ が $K$ の中でどれだけ「大きい」か（$K$ のどの元も有理数ではさめるか）で、それがアルキメデスの原理である。
:::

## アルキメデスの原理 {#calc:sec-of-archimedes}

::: definition アルキメデス的順序体 {#calc:archimedean keywords="Archimedean ordered field: the natural numbers are unbounded" index="アルキメデスの原理|あるきめですのげんり, アルキメデス的順序体|あるきめですてきじゅんじょたい"}
順序体 $K$ で、任意の $a\in K$ に対し $n>a$ となる $n\in\mathbb{N}$ が存在するとき、$K$ は**アルキメデスの原理**を満たす、または**アルキメデス的**であるという。
:::

::: proposition アルキメデスの原理の言い換え {#calc:archimedean-equivalents keywords="equivalent forms of the Archimedean principle: 1/n -> 0, na > b, floor function, density of the rationals" index="アルキメデスの原理の言い換え|あるきめですのげんりのいいかえ, 床関数|ゆかかんすう, 有理数の稠密性|ゆうりすうのちゅうみつせい"}
順序体 $K$ について次は同値。
1. $K$ はアルキメデス的。
2. 任意の $\varepsilon>0$ に対し $\frac1n<\varepsilon$ となる $n\ge1$ がある。
3. 任意の $a>0$ と $b$ に対し $na>b$ となる $n\in\mathbb{N}$ がある。
4. 各 $x\in K$ に、$m\le x<m+1$ となる整数 $m$ がただ一つある（$m=\lfloor x\rfloor$ と書く）。
5. $\mathbb{Q}$ は $K$ で稠密：$a<b$ なら $a<r<b$ となる $r\in\mathbb{Q}$ がある。
:::

::: proof
**Step 1（1 ⇒ 2 ⇒ 3 ⇒ 1）.** 1 ⇒ 2：$n>\frac1\varepsilon$ をとると、正の元の逆元の大小が逆転するので $\frac1n<\varepsilon$（\ref{model:ordered-field-basic}）。2 ⇒ 3：$b\le0$ なら $n=1$ で $1\cdot a>0\ge b$。$b>0$ なら $\varepsilon\defeq\frac{a}{b}>0$ に 2 を使い、$\frac1n<\frac ab$ に $nb>0$ を掛けて $b<na$。3 ⇒ 1：$a=1$ とする。

**Step 2（1 ⇒ 4）.** $S\defeq\{k\in\mathbb{Z}\mid k>x\}$ は、1 から空でない。$-x$ にも 1 を使って $n_{0}>-x$ をとると、$k\in S$ なら $k>x>-n_{0}$ で、$S$ は下に有界な整数の集合なので最小元 $k_{0}$ をもつ（$\{k+n_{0}\mid k\in S\}\subset\mathbb{N}$ の整列性）。$m\defeq k_{0}-1$ とすると $m\notin S$ なので $m\le x$、$m+1=k_{0}>x$。一意性：$m\le x<m+1$ と $m'\le x<m'+1$ で $m<m'$ なら $m+1\le m'\le x$ となり矛盾。

**Step 3（4 ⇒ 1）.** $x$ について $\lfloor x\rfloor+1>x$ で、$\lfloor x\rfloor+1\le0$ なら $n=0$、そうでなければ $n=\lfloor x\rfloor+1\in\mathbb{N}$ が $n>x$ を満たす。

**Step 4（1 ⇒ 5）.** $a<b$ とする。2 から $\frac1q<b-a$ となる $q\ge1$ をとり、$p\defeq\lfloor qa\rfloor+1$（4 は 1 から従う）とすると $p-1\le qa<p$ なので $a<\frac pq$、かつ $\frac pq\le a+\frac1q<b$。

**Step 5（5 ⇒ 1）.** $K$ がアルキメデス的でないとし、$a$ をすべての $n\in\mathbb{N}$ より大きい元とする。5 から $a<r<a+1$ となる $r=\frac pq$（$q\ge1$）がある。$r\le|p|$（$q\ge1$）で $|p|\in\mathbb{N}$ なので $r\le|p|<a$ となり矛盾。

::: hypcheck
- **整列性**：Step 2 で整数の最小元をとるのに使った（$\ZF$ の定理。選択公理は不要）。
- **アルキメデス性**：Step 2・4 で使った。Step 5 は 5 だけから 1 を出している。
:::
:::

::: example
1. $\mathbb{Q}$ はアルキメデス的（$\frac pq\le|p|<|p|+1$）。
2. 実数体はアルキメデス的である。これは連続の公理から従う（\ref[連続の公理とその同値な形]{calc:page-continuity-axioms}）。
:::

## 非アルキメデス的順序体 {#calc:sec-of-non-archimedean}

::: proposition 有理関数体の順序 {#calc:rational-function-order keywords="the field K(x) of rational functions over an ordered field K is ordered by the sign of the leading coefficient; x is larger than every element of K, so K(x) is non-Archimedean" index="有理関数体の順序|ゆうりかんすうたいのじゅんじょ, 非アルキメデス的順序体|ひあるきめですてきじゅんじょたい, 無限小|むげんしょう"}
$K$ を順序体とする。多項式環 $K[x]$ で、$f\neq0$ を「最高次の係数が正」のとき正と定めると、$K[x]$ は順序環になり、この順序は有理関数体 $K(x)$ に一意に延びる。この順序で $x$ は $K$ のどの元よりも大きく、$\frac1x$ は $0<\frac1x<\varepsilon$（$K$ のすべての正の元 $\varepsilon$）を満たす。とくに $K(x)$ はアルキメデス的でない。
:::

::: proof
**Step 1（順序環）.** $P\defeq\{f\neq0\mid$ 最高次の係数が正$\}$ とおき、$f<g\iff g-f\in P$ と定める。$f\neq0$ について $f\in P$ と $-f\in P$ のちょうど一方が成り立つので、$<$ は狭義の全順序（推移性は $P+P\subset P$ から）。$f,g\in P$ なら：$fg$ の最高次の係数は最高次の係数の積で正、$f+g$ の最高次の係数は、次数が異なれば高い方の係数、等しければ係数の和で、いずれも正。よって (O1) は $g-f\in P\Rightarrow(g+h)-(f+h)\in P$、(O2) は $PP\subset P$ から成り立つ。

**Step 2（商体）.** $K[x]$ は整域なので、\ref{model:fraction-field-order} から順序は $K(x)$ に一意に延び、$\frac fg>0\iff fg>0$。

**Step 3（無限大と無限小）.** $c\in K$ について $x-c$ の最高次の係数は $1>0$ なので $x>c$。$\varepsilon>0$ について $\varepsilon x-1$ の最高次の係数は $\varepsilon>0$ なので $\varepsilon x>1$、$x>0$ で割って $\frac1x<\varepsilon$。$\mathbb{N}\subset K$ なので $x$ はすべての自然数より大きい。
:::

::: intuition
$K(x)$ の中で $x$ は「無限に大きい数」、$\frac1x$ は「無限小」として振る舞う。順序体の公理（四則演算と大小の両立）だけでは、無限大・無限小の存在を排除できない。アルキメデスの原理は「無限大がない」（同値に「無限小がない」）という公理であり、連続の公理はさらに「すき間がない」ことを要求する。
:::

## 上限と下限 {#calc:sec-of-sup}

::: definition 上界と上限 {#calc:supremum keywords="upper bound, bounded above, least upper bound (supremum), greatest lower bound (infimum), maximum and minimum" index="上界|じょうかい, 上限|じょうげん, 下界|かかい, 下限|かげん, 有界|ゆうかい"}
全順序集合 $K$ の部分集合 $A$ について、すべての $a\in A$ で $a\le u$ となる $u$ を $A$ の**上界**、上界が存在するとき $A$ は**上に有界**という。上界の全体に最小元があるとき、それを $A$ の**上限**といい $\sup A$ と書く。**下界**・**下に有界**・**下限** $\inf A$ も同様。上にも下にも有界なとき**有界**という。$A$ が最大元をもてば、それが上限である。
:::

::: lemma 上限の特徴づけ {#calc:sup-characterization keywords="s = sup A iff s is an upper bound and for every eps > 0 some element of A exceeds s - eps; inf A = -sup(-A)" index="上限の特徴づけ|じょうげんのとくちょうづけ"}
$K$ を順序体、$A\subset K$ とする。
1. $s=\sup A$ $\iff$ $s$ は $A$ の上界で、任意の $\varepsilon>0$ に対し $a>s-\varepsilon$ となる $a\in A$ がある。
2. $-A\defeq\{-a\mid a\in A\}$ とすると、$\sup(-A)$ が存在することと $\inf A$ が存在することは同値で、$\inf A=-\sup(-A)$。
3. $A\subset B$ で両方の上限が存在すれば $\sup A\le\sup B$。
:::

::: proof
1：(⇒) $s-\varepsilon<s$ なので $s-\varepsilon$ は上界でない。すなわち $a>s-\varepsilon$ となる $a\in A$ がある。(⇐) $u$ を上界とし、$u<s$ とすると $\varepsilon\defeq s-u>0$ について $a>s-\varepsilon=u$ となる $a\in A$ があり、$u$ が上界であることに反する。よって $s\le u$ で、$s$ は最小の上界。2：$x\mapsto-x$ は順序を逆にする全単射なので、$A$ の下界と $-A$ の上界が $-$ で対応し、最大の下界と最小の上界が対応する。3：$\sup B$ は $B$ の、したがって $A$ の上界。
:::

::: supplement
**一般化と関連する事実.**
- 体の順序は正の錐 $P$（$P+P\subset P$, $PP\subset P$, $K=P\sqcup\{0\}\sqcup(-P)$）と一対一に対応する。体が順序付け可能であるための必要十分条件は $-1$ が平方和でないこと（**アルティン–シュライアーの定理**、知られている。本サイト未収録）。たとえば $\mathbb{C}$ は $i^{2}=-1$ から順序付けられない（問題 \ref{calc:prob-of-complex}）。
- アルキメデス的順序体は $\mathbb{R}$ の部分体と（順序体として）同型である（\ref[実数の構成と一意性]{calc:page-real-construction} で示す）。アルキメデス的な全順序アーベル群も $\mathbb{R}$ に埋め込める（ヘルダーの定理、知られている。本サイト未収録）。

**前提を変えると.** 有理関数体の順序は一通りではない。たとえば「最低次の係数が正」を正と定めると、今度は $x$ が無限小になる。$\mathbb{Q}(\sqrt2)$ には $\sqrt2$ を正とする順序と負とする順序の二つがあり（問題 \ref{calc:prob-of-sqrt2}）、どちらもアルキメデス的である。

**高い視点.** アルキメデスの原理は、順序体を「無限大や無限小を区別できない粗い目」で見る条件である。無限小をもつ順序体（有理関数体、超実数体）は、極限の議論を無限小の計算に置き換える**超準解析**の舞台になる（知られている）。比喩で言えば、アルキメデス的順序体は「どんなに小さな長さも、物差しの目盛りを十分細かくすれば測れる」世界で、非アルキメデス的な体は「どれだけ目盛りを細かくしても届かない、見えない小ささの粒」がある世界である。
:::

## 問題 {#calc:sec-of-problems}

::: problem {#calc:prob-of-complex}
複素数体 $\mathbb{C}$ には、順序体にする順序が存在しないことを示せ。
:::

::: solution
順序体では $a\neq0$ なら $a^{2}>0$、とくに $1=1^{2}>0$（\ref{model:ordered-field-basic}）。$\mathbb{C}$ が順序体なら $-1=i^{2}>0$ となり、$0=1+(-1)>0$ で矛盾。
:::

::: problem {#calc:prob-of-sqrt2}
$\mathbb{Q}(\sqrt2)=\{a+b\sqrt2\mid a,b\in\mathbb{Q}\}$ には、順序体にする順序がちょうど二つあることを示せ。
:::

::: solution
順序が与えられたとき、$\sqrt2>0$ か $-\sqrt2>0$ のどちらか。

**存在.** 実数体 $\mathbb{R}$（\ref[実数の構成と一意性]{calc:page-real-construction} で構成する）の中で $\sqrt2\notin\mathbb{Q}$ なので、$\sigma_{\pm}(a+b\sqrt2)\defeq a\pm b\sqrt2\in\mathbb{R}$ はどちらも単射な環準同型。$x>_{\pm}y\iff\sigma_{\pm}(x)>\sigma_{\pm}(y)$ は順序体の順序（$\mathbb{R}$ の順序の引き戻し）で、$>_{+}$ では $\sqrt2>0$、$>_{-}$ では $\sqrt2<0$。

**一意性.** 順序 $<$ で $\sqrt2>0$ とする。有理数 $r\ge0$ で $r^{2}<2$ なら、$\sqrt2+r>0$ と $(\sqrt2-r)(\sqrt2+r)=2-r^{2}>0$ から $r<\sqrt2$。同様に有理数 $s>0$ で $s^{2}>2$ なら $s>\sqrt2$。$x=a+b\sqrt2$（$b>0$）で $\sigma_{+}(x)>0$ なら、$\mathbb{R}$ で $a+br>0$ となる有理数 $0\le r<\sqrt2$ をとれば、$<$ の順序でも $x>a+br>0$。$\sigma_{+}(x)<0$ なら、$a+bs<0$ となる有理数 $s>\sqrt2$ をとれば $x<a+bs<0$。$b<0$ も同様、$b=0$ は有理数の符号。よって $<$ は $>_{+}$ と一致する。$\sqrt2<0$ なら $>_{-}$ と一致する。
:::

::: problem {#calc:prob-of-floor}
アルキメデス的順序体 $K$ で、$x,y\in K$ と整数 $n$ について $\lfloor x+n\rfloor=\lfloor x\rfloor+n$ と $\lfloor x\rfloor+\lfloor y\rfloor\le\lfloor x+y\rfloor\le\lfloor x\rfloor+\lfloor y\rfloor+1$ を示せ。
:::

::: solution
$m=\lfloor x\rfloor$ なら $m+n\le x+n<m+n+1$ なので一意性（\ref{calc:archimedean-equivalents} の 4）から $\lfloor x+n\rfloor=m+n$。$\lfloor x\rfloor+\lfloor y\rfloor\le x+y<\lfloor x\rfloor+\lfloor y\rfloor+2$ なので、$k\defeq\lfloor x\rfloor+\lfloor y\rfloor$ について $k\le x+y<k+2$。$x+y<k+1$ なら $\lfloor x+y\rfloor=k$、そうでなければ $k+1\le x+y<k+2$ で $\lfloor x+y\rfloor=k+1$。
:::

::: problem {#calc:prob-of-sup-rationals}
アルキメデス的順序体 $K$ の各元 $a$ について、$a=\sup\{r\in\mathbb{Q}\mid r<a\}$（$K$ での上限）であることを示せ。
:::

::: solution
$A\defeq\{r\in\mathbb{Q}\mid r<a\}$ の上界は $a$。$\varepsilon>0$ について、有理数の稠密性（\ref{calc:archimedean-equivalents} の 5）から $a-\varepsilon<r<a$ となる $r\in\mathbb{Q}$ があり $r\in A$。\ref{calc:sup-characterization} の 1 から $a=\sup A$。
:::
