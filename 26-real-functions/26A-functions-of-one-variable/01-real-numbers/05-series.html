# 級数 {#calc:page-series keywords="infinite series, partial sums, Cauchy criterion for series, geometric series, harmonic series, comparison test, Cauchy condensation test, ratio test, root test, Cauchy-Hadamard, alternating series test, Leibniz, summation by parts, Abel and Dirichlet tests, absolute convergence, conditional convergence, rearrangement, Riemann rearrangement theorem, Cauchy product, Mertens theorem, double series"}

数列 $(a_{n})$ の項を順に足していった極限を**級数** $\sum a_{n}$ という。このページでは、級数が収束するための判定法（比較・凝縮・比・根・交代級数・アーベルとディリクレ）と、和の順序を入れ替えてよいか（絶対収束と条件収束、**リーマンの再配列定理**）、級数どうしの積（**コーシー積**とメルテンスの定理）、二重級数の和の順序交換を扱う。

> 資料：Rudin『Principles of Mathematical Analysis』第 3 章（3.21〜3.55）、杉浦光夫『解析入門 I』第 V 章の内容に相当する標準的な事項。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-se-notation}

::: notation
- 実数列の極限、上極限・下極限、よく使う極限は \tref{calc:page-sequences}（\ref{calc:limit-laws}, \ref{calc:limsup-properties}, \ref{calc:standard-limits}, \ref{calc:nth-root}）。コーシー列の収束 (C)・単調収束 (M) は \ref{calc:continuity-axioms-equivalent}。
- 正の有理数 $p=\frac ab$ について $n^{p}\defeq(n^{1/b})^{a}$（\ref{calc:nth-root}。代表のとり方によらない）。実数の指数は \ref[指数関数と対数関数]{calc:page-exp-log} で定める。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 収束の基本 {#calc:sec-se-basic}

::: definition 級数 {#calc:series keywords="series, partial sums, convergent series, sum of a series" index="級数|きゅうすう, 部分和|ぶぶんわ"}
実数列 $(a_{n})_{n\ge0}$ について、**部分和** $s_{N}\defeq\sum_{n=0}^{N}a_{n}$ の列が $s$ に収束するとき、**級数** $\sum_{n\ge0}a_{n}$ は収束するといい、$s$ をその**和**として $\sum_{n=0}^{\infty}a_{n}=s$ と書く。収束しないとき発散するという。
:::

::: proposition 級数の基本性質 {#calc:series-basic keywords="Cauchy criterion for series, terms tend to zero, geometric series, harmonic series diverges, series with nonnegative terms converge iff partial sums are bounded" index="級数のコーシー判定法|きゅうすうのこーしーはんていほう, 幾何級数|きかきゅうすう, 調和級数|ちょうわきゅうすう"}
1. **（コーシーの判定法）** $\sum a_{n}$ が収束 $\iff$ 任意の $\varepsilon>0$ に $N$ があって、$N\le m\le n$ なら $\bigl|\sum_{k=m}^{n}a_{k}\bigr|<\varepsilon$。
2. $\sum a_{n}$ が収束すれば $a_{n}\to0$。
3. $a_{n}\ge0$ なら、$\sum a_{n}$ が収束 $\iff$ 部分和が有界。
4. **（幾何級数）** $|x|<1$ なら $\sum_{n\ge0}x^{n}=\frac{1}{1-x}$。$|x|\ge1$ なら発散。
5. **（調和級数）** $\sum_{n\ge1}\frac1n$ は発散する。
:::

::: proof
1：部分和の列がコーシー列であることの言い換えで、(C) と \ref{calc:ordered-field-sequences.2} による。2：1 で $m=n$。3：部分和は単調増加なので、\ref{calc:monotone-limit.1}。4：$s_{N}=\frac{1-x^{N+1}}{1-x}$ と $x^{N+1}\to0$（\ref{calc:standard-limits.4}）。$|x|\ge1$ では $|x^{n}|\ge1$ なので 2 に反する。5：$\sum_{k=2^{j}+1}^{2^{j+1}}\frac1k\ge2^{j}\cdot\frac{1}{2^{j+1}}=\frac12$ なので $s_{2^{m}}\ge1+\frac m2$ で有界でない。
:::

## 正項級数の判定法 {#calc:sec-se-tests}

::: theorem 比較判定法と凝縮判定法 {#calc:comparison-condensation keywords="comparison test; Cauchy condensation test: for decreasing nonnegative a_n, sum a_n converges iff sum 2^k a_{2^k refname="比較判定法と凝縮判定法"} converges; p-series" index="比較判定法|ひかくはんていほう, 凝縮判定法|ぎょうしゅくはんていほう, p 級数|ぴーきゅうすう"}
1. **（比較）** ある $N$ 以降 $|a_{n}|\le c_{n}$ で $\sum c_{n}$ が収束すれば、$\sum a_{n}$ は収束する。ある $N$ 以降 $a_{n}\ge d_{n}\ge0$ で $\sum d_{n}$ が発散すれば、$\sum a_{n}$ は発散する。
2. **（凝縮）** $a_{1}\ge a_{2}\ge\cdots\ge0$ なら、$\sum_{n\ge1}a_{n}$ が収束 $\iff$ $\sum_{k\ge0}2^{k}a_{2^{k}}$ が収束。
3. 正の有理数 $p$ について、$\sum_{n\ge1}\frac{1}{n^{p}}$ は $p>1$ で収束、$p\le1$ で発散。
:::

::: proof
**1.** $\bigl|\sum_{k=m}^{n}a_{k}\bigr|\le\sum_{k=m}^{n}c_{k}$ とコーシーの判定法。後半は前半の対偶（$\sum d_{n}$ が $\sum a_{n}$ で上から押さえられる）。

**2.** $s_{n}\defeq\sum_{j\le n}a_{j}$, $t_{k}\defeq\sum_{i\le k}2^{i}a_{2^{i}}$ とする。$n<2^{k}$ なら、$a_{1}+(a_{2}+a_{3})+\cdots+(a_{2^{k}}+\cdots+a_{2^{k+1}-1})$ の各かっこを最初の項で上から押さえて $s_{n}\le t_{k}$。$n>2^{k}$ なら、$a_{1}+a_{2}+(a_{3}+a_{4})+\cdots+(a_{2^{k-1}+1}+\cdots+a_{2^{k}})$ の各かっこを最後の項で下から押さえて $s_{n}\ge\frac12t_{k}$。よって部分和の有界性が同値（\ref{calc:series-basic.3}）。

**3.** $n\mapsto\frac{1}{n^{p}}$ は減少（\ref{calc:nth-root} の単調性）。$2^{k}\cdot\frac{1}{(2^{k})^{p}}=(2^{1-p})^{k}$ で、$2^{1-p}<1\iff p>1$。幾何級数と 2。
:::

::: theorem 根判定法と比判定法 {#calc:root-ratio-tests keywords="root test via limsup |a_n|^{1/n refname="根判定法と比判定法"}; ratio test; comparison of the two; Cauchy-Hadamard" index="根判定法|こんはんていほう, 比判定法|ひはんていほう, コーシー–アダマールの判定法|こーしーあだまーるのはんていほう"}
$\alpha\defeq\limsup_{n}|a_{n}|^{1/n}\in[0,+\infty]$ とする。
1. **（根判定法）** $\alpha<1$ なら $\sum|a_{n}|$ は収束、$\alpha>1$ なら $\sum a_{n}$ は発散する。
2. **（比判定法）** $a_{n}\neq0$ とする。$\limsup\bigl|\frac{a_{n+1}}{a_{n}}\bigr|<1$ なら $\sum|a_{n}|$ は収束、ある $N$ 以降 $\bigl|\frac{a_{n+1}}{a_{n}}\bigr|\ge1$ なら発散。
3. 正の数列 $(c_{n})$ について
$$
\liminf\frac{c_{n+1}}{c_{n}}\le\liminf c_{n}^{1/n}\le\limsup c_{n}^{1/n}\le\limsup\frac{c_{n+1}}{c_{n}}.
$$
とくに比判定法で収束が分かる級数は、根判定法でも分かる。
:::

::: proof
**Step 1（1）.** $\alpha<\beta<1$ となる $\beta$ をとると、\ref{calc:limsup-properties.2} から $N$ 以降 $|a_{n}|^{1/n}<\beta$、すなわち $|a_{n}|<\beta^{n}$ で、幾何級数との比較。$\alpha>1$ なら $|a_{n}|^{1/n}>1$ となる $n$ が無限個あり、$a_{n}\not\to0$。

**Step 2（3 の右側の不等式）.** $\limsup\frac{c_{n+1}}{c_{n}}<\beta$ となる任意の $\beta$ について、$N$ 以降 $c_{n+1}<\beta c_{n}$ なので $c_{n}\le c_{N}\beta^{-N}\beta^{n}$（$n\ge N$）。$c_{n}^{1/n}\le(c_{N}\beta^{-N})^{1/n}\beta$ で、\ref{calc:standard-limits.2} から右辺 $\to\beta$。よって $\limsup c_{n}^{1/n}\le\beta$。左側の不等式も同様。

**Step 3（2）.** 収束は 3 と 1（$c_{n}=|a_{n}|$）。$N$ 以降 $|a_{n+1}|\ge|a_{n}|$ なら $|a_{n}|\ge|a_{N}|>0$ で $a_{n}\not\to0$。

::: hypcheck
- **$\alpha=1$ では判定できない**：$\sum\frac1n$（発散）と $\sum\frac1{n^{2}}$（収束）はどちらも $\alpha=1$（\ref{calc:standard-limits.3}）。
- 比判定法の「$\limsup\ge1$ なら発散」は誤り：$a_{2m}=a_{2m+1}=2^{-m}$ 型の列では比は $1$ と $\frac12$ を交互にとるが、級数は収束する。発散の判定には「最終的に比が $1$ 以上」が要る。
:::
:::

## 一般の級数の判定法 {#calc:sec-se-general}

::: lemma アーベルの総和公式 {#calc:summation-by-parts keywords="summation by parts: sum a_k b_k = A_n b_n - A_{m-1 refname="アーベルの総和公式"} b_m - sum A_k (b_{k+1} - b_k)" index="アーベルの総和公式|あーべるのそうわこうしき, 部分和分|ぶぶんわぶん"}
$A_{n}\defeq\sum_{k=0}^{n}a_{k}$（$A_{-1}\defeq0$）とすると、$0\le m\le n$ について
$$
\sum_{k=m}^{n}a_{k}b_{k}=A_{n}b_{n}-A_{m-1}b_{m}-\sum_{k=m}^{n-1}A_{k}(b_{k+1}-b_{k}).
$$
:::

::: proof
$a_{k}=A_{k}-A_{k-1}$ を代入し、$\sum_{k=m}^{n}A_{k}b_{k}-\sum_{k=m}^{n}A_{k-1}b_{k}$ の第 2 の和の添字を $k-1\mapsto k$ とずらして並べ直す。
:::

::: theorem ディリクレとアーベルの判定法 {#calc:dirichlet-abel-tests keywords="Dirichlet test: bounded partial sums times decreasing sequence tending to zero; Abel test; alternating series test (Leibniz)" index="ディリクレの判定法|でぃりくれのはんていほう, アーベルの判定法|あーべるのはんていほう, 交代級数|こうたいきゅうすう, ライプニッツの判定法|らいぷにっつのはんていほう" refname="ディリクレとアーベルの判定法"}
1. **（ディリクレ）** $\sum a_{n}$ の部分和が有界で、$b_{0}\ge b_{1}\ge\cdots$, $b_{n}\to0$ なら、$\sum a_{n}b_{n}$ は収束する。
2. **（ライプニッツ）** $b_{0}\ge b_{1}\ge\cdots$, $b_{n}\to0$ なら、交代級数 $\sum(-1)^{n}b_{n}$ は収束し、和 $s$ と部分和の差は $|s-s_{N}|\le b_{N+1}$。
3. **（アーベル）** $\sum a_{n}$ が収束し、$(b_{n})$ が有界な単調列なら、$\sum a_{n}b_{n}$ は収束する。
:::

::: proof
**1.** $|A_{n}|\le M$ とすると、\ref{calc:summation-by-parts} と $b_{k}-b_{k+1}\ge0$ から
$$
\Bigl|\sum_{k=m}^{n}a_{k}b_{k}\Bigr|\le Mb_{n}+Mb_{m}+M\sum_{k=m}^{n-1}(b_{k}-b_{k+1})=2Mb_{m}\to0
$$
で、コーシーの判定法。

**2.** $a_{n}=(-1)^{n}$ の部分和は $1$ か $0$ で有界なので 1 から収束。誤差：$s-s_{N}=\sum_{k>N}(-1)^{k}b_{k}$ で、二つずつまとめると $(-1)^{N+1}\bigl[(b_{N+1}-b_{N+2})+(b_{N+3}-b_{N+4})+\cdots\bigr]$ の各かっこは $0$ 以上、別のまとめ方で $b_{N+1}-(b_{N+2}-b_{N+3})-\cdots\le b_{N+1}$。

**3.** $b_{n}\to b$（(M)）。$b_{n}$ が増加なら $c_{n}\defeq b-b_{n}$ は減少して $0$ に収束し、$\sum a_{n}c_{n}$ は 1 から収束（収束級数の部分和は有界）。$a_{n}b_{n}=ba_{n}-a_{n}c_{n}$。減少なら $c_{n}\defeq b_{n}-b$ とする。
:::

## 絶対収束と再配列 {#calc:sec-se-rearrangement}

::: definition 絶対収束 {#calc:absolute-convergence keywords="absolutely convergent series; conditionally convergent series; rearrangement" index="絶対収束|ぜったいしゅうそく, 条件収束|じょうけんしゅうそく, 再配列|さいはいれつ"}
$\sum|a_{n}|$ が収束するとき $\sum a_{n}$ は**絶対収束**するといい、収束するが絶対収束しないとき**条件収束**するという。全単射 $\sigma\colon\mathbb{N}\to\mathbb{N}$ について $\sum a_{\sigma(n)}$ を $\sum a_{n}$ の**再配列**という。
:::

::: theorem 絶対収束級数の再配列 {#calc:absolute-rearrangement keywords="absolutely convergent series converge, and every rearrangement converges to the same sum; positive and negative parts" index="絶対収束級数の再配列|ぜったいしゅうそくきゅうすうのさいはいれつ"}
1. 絶対収束する級数は収束し、$\bigl|\sum a_{n}\bigr|\le\sum|a_{n}|$。
2. $a_{n}^{+}\defeq\max(a_{n},0)$, $a_{n}^{-}\defeq\max(-a_{n},0)$ とすると、$\sum a_{n}$ が絶対収束 $\iff$ $\sum a_{n}^{+}$ と $\sum a_{n}^{-}$ がともに収束。条件収束なら両方とも発散する。
3. 絶対収束する級数のすべての再配列は絶対収束し、和は等しい。
:::

::: proof
**1.** $\bigl|\sum_{k=m}^{n}a_{k}\bigr|\le\sum_{k=m}^{n}|a_{k}|$ とコーシーの判定法。不等式は部分和で成り立ち、極限で保たれる。

**2.** $a_{n}^{\pm}\le|a_{n}|=a_{n}^{+}+a_{n}^{-}$ と比較判定法。条件収束で $\sum a_{n}^{+}$ が収束すれば、$a_{n}^{-}=a_{n}^{+}-a_{n}$ から $\sum a_{n}^{-}$ も収束し、$\sum|a_{n}|$ が収束して矛盾（$\sum a_{n}^{-}$ も同様）。

**3.** $\varepsilon>0$ について、$\sum_{k\ge N}|a_{k}|<\varepsilon$ となる $N$ をとる。$M$ を $\{0,\dots,N-1\}\subset\{\sigma(0),\dots,\sigma(M)\}$ となるようにとる（$\sigma$ は全射）。$n\ge M$ なら $\sum_{k\le n}a_{\sigma(k)}-\sum_{k\le n}a_{k}$ では $a_{0},\dots,a_{N-1}$ が打ち消し合い、残りは添字 $\ge N$ の項の差なので絶対値は $2\sum_{k\ge N}|a_{k}|<2\varepsilon$ 以下。$\sum|a_{\sigma(k)}|$ の部分和も $\sum|a_{k}|$ で押さえられ、絶対収束する。
:::

::: theorem リーマンの再配列定理 {#calc:riemann-rearrangement keywords="Riemann rearrangement theorem: a conditionally convergent series can be rearranged to converge to any prescribed real number or to diverge to plus or minus infinity" index="リーマンの再配列定理|りーまんのさいはいれつていり" refname="リーマンの再配列定理"}
$\sum a_{n}$ が条件収束するとき、任意の $L\in\overline{\mathbb{R}}$ について、再配列 $\sum a_{\sigma(n)}$ で部分和が $L$ に収束する（$L=\pm\infty$ なら発散する）ものがある。
:::

::: proof
**Step 1（正と負の項）.** $P\defeq\{n\mid a_{n}\ge0\}$, $Q\defeq\{n\mid a_{n}<0\}$ とする。\ref{calc:absolute-rearrangement.2} から $\sum_{n\in P}a_{n}=+\infty$, $\sum_{n\in Q}a_{n}=-\infty$ で、とくに $P$, $Q$ はともに無限集合。$a_{n}\to0$。

**Step 2（$L\in\mathbb{R}$ の場合の構成）.** 次の手順で添字を並べる：まだ使っていない $P$ の添字を小さい順に、部分和が $L$ を超えるまで加え、次にまだ使っていない $Q$ の添字を小さい順に、部分和が $L$ 以下になるまで加える。これを繰り返す。各段は有限回で終わる（残りの正の項の和も負の項の和も発散するので）。各段で少なくとも 1 つ加え、$P$, $Q$ の添字は小さい順に使い尽くされるので、$\sigma$ は全単射。

**Step 3（収束）.** 各段の切り替えの直後、部分和と $L$ の差は直前に加えた項の絶対値以下。段の途中の部分和は、直前の切り替え時の値と $L$ の間か、それより $L$ に近い。項は $0$ に収束し、段は無限回切り替わるので、部分和は $L$ に収束する。

**Step 4（$L=+\infty$）.** 第 $j$ 段では、$P$ の添字を部分和が $j$ を超えるまで加え、次に $Q$ の添字を 1 つだけ加える。部分和は $j-|a_{q}|$ 以上にとどまり、$+\infty$ に発散する。$-\infty$ も同様。

::: hypcheck
- **選択公理**：構成は「まだ使っていない最小の添字」を順にとる手順なので使わない。
- **条件収束**：Step 1 で正の項と負の項の和がどちらも発散することに使った。絶対収束なら \ref{calc:absolute-rearrangement.3} により和は変わらない。
:::
:::

## コーシー積と二重級数 {#calc:sec-se-products}

::: theorem コーシー積（メルテンスの定理） {#calc:cauchy-product keywords="Cauchy product of series; Mertens theorem: if one series converges absolutely and the other converges, the Cauchy product converges to the product of the sums; if both converge absolutely so does the product" index="コーシー積|こーしーせき, メルテンスの定理|めるてんすのていり, 絶対収束級数の積|ぜったいしゅうそくきゅうすうのせき"}
$c_{n}\defeq\sum_{k=0}^{n}a_{k}b_{n-k}$ とおく（**コーシー積**）。
1. $\sum a_{n}=A$ が絶対収束し、$\sum b_{n}=B$ が収束すれば、$\sum c_{n}=AB$。
2. 両方が絶対収束すれば、$\sum c_{n}$ も絶対収束する。
:::

::: proof
**Step 1.** $A_{n}$, $B_{n}$, $C_{n}$ を部分和、$\beta_{n}\defeq B_{n}-B$ とする。$C_{n}=\sum_{k=0}^{n}a_{k}B_{n-k}=A_{n}B+\sum_{k=0}^{n}a_{k}\beta_{n-k}$（和の順序を入れ替えた有限和）。$A_{n}B\to AB$ なので、$\gamma_{n}\defeq\sum_{k=0}^{n}a_{k}\beta_{n-k}\to0$ を示せばよい。

**Step 2.** $\alpha\defeq\sum|a_{n}|$、$|\beta_{n}|\le M$（収束列）とする。$\varepsilon>0$ について $|\beta_{m}|<\varepsilon$（$m\ge N$）となる $N$ をとると、$n\ge N$ で
$$
|\gamma_{n}|\le\sum_{k=0}^{n-N}|a_{k}||\beta_{n-k}|+\sum_{k=n-N+1}^{n}|a_{k}||\beta_{n-k}|\le\varepsilon\alpha+M\sum_{k=n-N+1}^{n}|a_{k}|.
$$
第 2 項は $N$ 個の項の和で、$a_{k}\to0$ から $n\to\infty$ で $0$ に収束する。よって $\limsup|\gamma_{n}|\le\varepsilon\alpha$、$\varepsilon$ は任意。

**Step 3（2）.** $\sum_{n\le N}|c_{n}|\le\sum_{n\le N}\sum_{k\le n}|a_{k}||b_{n-k}|\le\bigl(\sum|a_{k}|\bigr)\bigl(\sum|b_{j}|\bigr)$。

::: hypcheck
- **絶対収束（片方）**：Step 2 で $\alpha<\infty$ を使った。両方が条件収束だと偽：$a_{n}=b_{n}=\frac{(-1)^{n}}{\sqrt{n+1}}$ では $|c_{n}|\ge\sum_{k}\frac{1}{\sqrt{(k+1)(n-k+1)}}\ge\sum_{k}\frac{2}{n+2}=\frac{2(n+1)}{n+2}$（相加相乗平均）で $c_{n}\not\to0$。
:::
:::

::: theorem 二重級数 {#calc:double-series keywords="for a double sequence with sum of |a_{mn}| finite, the iterated sums in both orders and the sum along any enumeration agree" index="二重級数|にじゅうきゅうすう"}
$(a_{mn})_{m,n\ge0}$ で $\sum_{m}\sum_{n}|a_{mn}|<\infty$ とする。このとき $\sum_{n}a_{mn}$ はすべての $m$ で絶対収束し、
$$
\sum_{m}\sum_{n}a_{mn}=\sum_{n}\sum_{m}a_{mn}=\sum_{k}a_{\tau(k)}
$$
（$\tau\colon\mathbb{N}\to\mathbb{N}\times\mathbb{N}$ は任意の全単射）。どの和も絶対収束する。
:::

::: proof
**Step 1（任意の列挙）.** $S\defeq\sum_{m}\sum_{n}|a_{mn}|$。有限集合 $F\subset\mathbb{N}\times\mathbb{N}$ について $\sum_{F}|a_{mn}|\le S$（$F$ を $[0,M]^{2}$ に含めて行ごとに和をとる）なので、$\sum_{k}|a_{\tau(k)}|\le S$ で絶対収束。その和 $T$ は \ref{calc:absolute-rearrangement.3} から $\tau$ によらない。

**Step 2（行ごとの和）.** $\varepsilon>0$ について、有限集合 $F_{0}$ で $\sum_{(m,n)\notin F_{0}}|a_{mn}|<\varepsilon$ となるもの（Step 1 の列挙の最初の有限個）をとり、$F_{0}\subset[0,M_{0}]^{2}$ とする。$M\ge M_{0}$ について $\bigl|\sum_{m\le M}\sum_{n}a_{mn}-T\bigr|$ は、$[0,M]\times\mathbb{N}$ の外と $F_{0}$ の外の項で押さえられ、$2\varepsilon$ 以下（極限の交換は有限個の行についての和なので許される）。よって $\sum_{m}\sum_{n}a_{mn}=T$。列ごとの和も対称。
:::

::: supplement
**一般化と関連する事実.**
- $\mathbb{R}$ では、すべての再配列が収束すること（**無条件収束**）と絶対収束は同値である（\ref{calc:absolute-rearrangement} とリーマンの再配列定理）。無限次元のバナッハ空間では、無条件収束するが絶対収束しない級数が必ず存在する（ドヴォレツキー–ロジャースの定理、知られている）。
- 二重級数の和の交換は、数え上げ測度についてのフビニ–トネリの定理（\ref[測度論]{meas:fubini}）の特別な場合である。
- コーシー積は冪級数の積の係数の公式であり、指数関数の加法定理 $e^{x}e^{y}=e^{x+y}$ の証明に使う（\ref[指数関数と対数関数]{calc:page-exp-log}）。

**前提を変えると.** 根判定法・比判定法は $\alpha=1$ では無力で、より細かい判定法（ラーベの判定法、ガウスの判定法、積分判定法）がある（知られている。積分判定法は \ref[微分積分学の基本定理]{calc:page-fundamental-theorem} の後で扱える）。

**高い視点.** 絶対収束級数の和は、添字集合 $\mathbb{N}$ の順序に依存しない「集合 $\mathbb{N}$ の上の和」（数え上げ測度による積分）であり、条件収束級数の和は、$\mathbb{N}$ の順序という追加の構造に依存する量である。リーマンの再配列定理はその依存がいかに強いかを示す。比喩で言えば、絶対収束の級数は「どの順に財布にお金を入れても合計が同じ」で、条件収束の級数は「大きな借金と大きな貯金を交互に積む会計」で、積む順番を変えれば帳尻をどんな額にも合わせられる。
:::

## 問題 {#calc:sec-se-problems}

::: problem {#calc:prob-se-log2-rearrangement}
交代調和級数 $\sum_{n\ge1}\frac{(-1)^{n+1}}{n}=s$ は収束する。その項を「正の項 2 つ、負の項 1 つ」の順に並べた再配列 $1+\frac13-\frac12+\frac15+\frac17-\frac14+\cdots$ の和は $\frac32s$ であることを示せ（$s\neq0$ なので和が変わる）。
:::

::: solution
ライプニッツの判定法から $s$ は収束し、$s>1-\frac12>0$。$\frac12s=\sum\frac{(-1)^{n+1}}{2n}$ を、項の間に $0$ を挟んで $0+\frac12+0-\frac14+0+\frac16+\cdots$ と書き（$0$ を挟んでも部分和の極限は同じ）、$s=1-\frac12+\frac13-\frac14+\cdots$ と項ごとに足すと（収束級数の和）、$1+0+\frac13-\frac12+\frac15+0+\frac17-\frac14+\cdots$ の和が $\frac32s$。$0$ を除いたものが問題の再配列で、$0$ の項を除いても、3 項ごとの部分和は一致し、途中の部分和も項 $\to0$ なので極限は変わらない。
:::

::: problem {#calc:prob-se-ratio-root}
$a_{n}=2^{-n+(-1)^{n}}$ について、比判定法は判定できないが根判定法で収束が分かることを確かめよ。
:::

::: solution
$\frac{a_{n+1}}{a_{n}}=2^{-1+(-1)^{n+1}-(-1)^{n}}$ は $n$ が偶数で $2^{-3}$、奇数で $2$ をとり、$\limsup=2\ge1$ だが「最終的に $\ge1$」ではない。$a_{n}^{1/n}=2^{-1+(-1)^{n}/n}\to\frac12$（\ref{calc:standard-limits.2} の議論）なので根判定法で収束。
:::

::: problem {#calc:prob-se-condensation-log}
凝縮判定法と比較判定法を使い、$\sum_{n\ge2}\frac{1}{n\,k(n)}$（$k(n)$ は $2^{k}\le n<2^{k+1}$ となる $k$、すなわち $\lfloor\log_{2}n\rfloor$）が発散することを示せ。
:::

::: solution
$a_{n}=\frac{1}{nk(n)}$ は単調減少（$n$ も $k(n)$ も増加）。$2^{k}a_{2^{k}}=2^{k}\cdot\frac{1}{2^{k}k}=\frac1k$ で、調和級数は発散（\ref{calc:series-basic.5}）。凝縮判定法から発散。
:::
