# 指数関数と対数関数 {#calc:page-exp-log keywords="exponential function as a power series, exp' = exp, addition theorem, exp(x) = lim (1+x/n)^n, natural logarithm, log x = integral of 1/t, real powers a^x, laws of exponents, derivative of x^alpha, growth rates, irrationality of e, series of log(1+x), log 2, smooth non-analytic function, bump function, Borel's theorem"}

指数関数を冪級数 $\exp x=\sum\frac{x^{n}}{n!}$ として定義し、$\exp'=\exp$ と加法定理 $\exp(x+y)=\exp x\exp y$ を示す。その逆関数として自然対数 $\log$ を定め、正の数の実数乗 $a^{x}$ を定義して、有理数乗と一致することと指数法則を確かめる。さらに、増大度の比較、$e$ の無理性、$\log(1+x)$ の級数を扱う。最後に、指数関数を使って、すべての点で何回でも微分できるが冪級数で表せない関数と、任意の数列をテイラー係数にもつ $C^{\infty}$ 級関数（**ボレルの定理**）を構成する。

> 資料：Rudin『Principles of Mathematical Analysis』第 8 章（8.6）、杉浦光夫『解析入門 I』第 II 章 §3 の内容に相当する標準的な事項。ボレルの定理の証明は、定数の選び方を明示して選択公理を使わない形に自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-el-notation}

::: notation
- 冪級数（収束半径、項別微分、積）は \tref{calc:page-power-series}（\ref{calc:cauchy-hadamard}, \ref{calc:power-series-differentiation}, \ref{calc:power-series-product}）。ネイピア数 $e=\sum\frac{1}{k!}=\lim(1+\frac1n)^{n}$ は \ref{calc:napier-e}。
- 微分（連鎖律・逆関数の微分）、平均値の定理、ロピタルの定理、テイラーの定理は \ref{calc:page-derivatives}, \tref{calc:page-taylor}。基本定理 \tref{calc:fundamental-theorem}。一様収束と項別微分 \ref{calc:uniform-limit-theorems}, \ref{calc:uniform-derivative}。
- 正の数の有理数乗 $a^{p/q}=(a^{1/q})^{p}$ は \ref{calc:nth-root} による。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 指数関数 {#calc:sec-el-exp}

::: theorem 指数関数 {#calc:exp keywords="exp x = sum x^n/n! converges for all x; exp' = exp; exp(x+y) = exp x exp y; exp > 0; exp is a strictly increasing bijection R -> (0,infinity); exp(1) = e; exp(x) = lim (1+x/n)^n" index="指数関数|しすうかんすう, 加法定理（指数関数）|かほうていりしすうかんすう"}
$\exp x\defeq\sum_{n\ge0}\frac{x^{n}}{n!}$ とする。
1. 収束半径は $\infty$ で、$\exp$ は $\mathbb{R}$ で $C^{\infty}$ 級、$\exp'=\exp$、$\exp0=1$。
2. **（加法定理）** $\exp(x+y)=\exp x\cdot\exp y$。
3. $\exp x>0$、$\exp(-x)=\frac{1}{\exp x}$、$\exp$ は狭義単調増加で $\mathbb{R}$ から $(0,\infty)$ への全単射。
4. $\exp1=e$。有理数 $q$ について $\exp q=e^{q}$。
5. $\exp x=\lim_{n\to\infty}\bigl(1+\frac xn\bigr)^{n}$。
:::

::: proof
**Step 1（1）.** $\bigl(\frac{1}{n!}\bigr)^{1/n}\to0$（\ref{calc:prob-ps-radius.2}）なので $R=\infty$。項別微分（\ref{calc:power-series-differentiation}）で $\exp'x=\sum_{n\ge1}\frac{x^{n-1}}{(n-1)!}=\exp x$。

**Step 2（2）.** 冪級数の積（\ref{calc:power-series-product}、コーシー積）と二項定理から
$$
\exp x\exp y=\sum_{n}\sum_{k\le n}\frac{x^{k}}{k!}\frac{y^{n-k}}{(n-k)!}=\sum_{n}\frac{(x+y)^{n}}{n!}=\exp(x+y).
$$

**Step 3（3）.** 2 から $\exp x\exp(-x)=\exp0=1$ なので $\exp x\neq0$。$x\ge0$ なら定義から $\exp x\ge1>0$、$x<0$ なら $\exp x=\frac{1}{\exp(-x)}>0$。$\exp'=\exp>0$ なので狭義増加（\ref{calc:mvt-consequences}）。$x>0$ で $\exp x\ge1+x\to\infty$、$\exp(-x)=\frac1{\exp x}\to0$ なので、中間値の定理から $(0,\infty)$ 全体が像。

**Step 4（4）.** $\exp1=\sum\frac1{k!}=e$（\ref{calc:napier-e}）。2 から $\exp n=e^{n}$（$n\in\mathbb{N}$）、$\exp(-n)=e^{-n}$。$q=\frac pm$ なら $(\exp q)^{m}=\exp p=e^{p}$ で、$\exp q>0$ と正の $m$ 乗根の一意性（\ref{calc:nth-root}）から $\exp q=(e^{p})^{1/m}=e^{q}$。

**Step 5（5）.** $x$ を固定する。二項展開で $\bigl(1+\frac xn\bigr)^{n}=\sum_{k=0}^{n}\frac{x^{k}}{k!}\prod_{j<k}\bigl(1-\frac jn\bigr)$。各 $k$ で係数 $\prod_{j<k}(1-\frac jn)\to1$ で、$\bigl|\frac{x^{k}}{k!}\prod(\cdots)\bigr|\le\frac{|x|^{k}}{k!}$（$\sum\frac{|x|^{k}}{k!}<\infty$）。$\varepsilon>0$ について $\sum_{k>K}\frac{|x|^{k}}{k!}<\varepsilon$ となる $K$ をとると、$n\ge K$ で
$$
\Bigl|\Bigl(1+\frac xn\Bigr)^{n}-\exp x\Bigr|\le\sum_{k\le K}\frac{|x|^{k}}{k!}\Bigl|1-\prod_{j<k}\Bigl(1-\frac jn\Bigr)\Bigr|+2\varepsilon,
$$
第 1 項は有限和で $n\to\infty$ で $0$。
:::

## 対数関数と実数乗 {#calc:sec-el-log}

::: definition 自然対数 {#calc:log keywords="natural logarithm log: (0,infinity) -> R as the inverse of exp; log' = 1/x; log(xy) = log x + log y; log x = integral_1^x dt/t" index="自然対数|しぜんたいすう, 対数関数|たいすうかんすう"}
$\exp\colon\mathbb{R}\to(0,\infty)$ の逆関数を**自然対数** $\log\colon(0,\infty)\to\mathbb{R}$ という。
:::

::: proposition 対数関数の性質 {#calc:log-properties keywords="log is smooth, strictly increasing, log' = 1/x, log(xy) = log x + log y, log x = int_1^x dt/t, log x <= x - 1" index="対数関数の性質|たいすうかんすうのせいしつ"}
1. $\log$ は連続で狭義増加、$\log1=0$、$\log e=1$、$\log(xy)=\log x+\log y$。
2. $\log$ は微分可能で $(\log x)'=\frac1x$。したがって $\log x=\int_{1}^{x}\frac{dt}{t}$。
3. $\log x\le x-1$（等号は $x=1$ のときだけ）。
:::

::: proof
1：逆関数の連続性と単調性（\ref{calc:continuous-inverse}）。加法定理を $\log x$, $\log y$ に使う。2：逆関数の微分（\ref{calc:chain-rule.2}）で $(\log x)'=\frac{1}{\exp(\log x)}=\frac1x$。基本定理の 2。3：$\exp$ は凸（$\exp''=\exp>0$）なので接線の不等式 $\exp t\ge1+t$（\ref{calc:convex-properties.3}、狭義の凸性から等号は $t=0$ だけ）を $t=\log x$ に使う。
:::

::: definition 実数乗 {#calc:general-power keywords="real powers a^x = exp(x log a) for a > 0, consistent with rational powers; laws of exponents; derivative of x^alpha and a^x" index="実数乗|じっすうじょう, 指数法則|しすうほうそく"}
$a>0$, $x\in\mathbb{R}$ について $a^{x}\defeq\exp(x\log a)$ とおく。
:::

::: proposition 実数乗の性質 {#calc:general-power-properties keywords="a^q agrees with rational powers; a^{x+y} = a^x a^y, (a^x)^y = a^{xy}, (ab)^x = a^x b^x; d/dx a^x = a^x log a; d/dx x^alpha = alpha x^{alpha - 1}" index="実数乗の性質|じっすうじょうのせいしつ"}
1. 有理数 $q$ について、$a^{q}$ は \ref{calc:nth-root} の有理数乗に一致する。$e^{x}=\exp x$。
2. $a^{x+y}=a^{x}a^{y}$, $(a^{x})^{y}=a^{xy}$, $(ab)^{x}=a^{x}b^{x}$。
3. $(a^{x})'=a^{x}\log a$、$x>0$ で $(x^{\alpha})'=\alpha x^{\alpha-1}$（$\alpha\in\mathbb{R}$）。
:::

::: proof
1：$a=\exp(\log a)$ と \ref{calc:exp.4} の証明と同じ議論で、$\exp(\frac pm\log a)$ の $m$ 乗は $\exp(p\log a)=a^{p}$。$e^{x}=\exp(x\log e)=\exp x$。2：加法定理と $\log(a^{x})=x\log a$。3：連鎖律で $(\exp(x\log a))'=\exp(x\log a)\log a$、$(\exp(\alpha\log x))'=\exp(\alpha\log x)\frac\alpha x=\alpha x^{\alpha-1}$。
:::

::: proposition 増大度の比較 {#calc:growth-rates keywords="x^k e^{-x} -> 0 and (log x)/x^epsilon -> 0 as x -> infinity; x^epsilon log x -> 0 as x -> 0+" index="増大度|ぞうだいど"}
$k\ge0$, $\varepsilon>0$ について、$x\to+\infty$ で $\frac{x^{k}}{e^{x}}\to0$、$\frac{\log x}{x^{\varepsilon}}\to0$。$x\to0+$ で $x^{\varepsilon}\log x\to0$。
:::

::: proof
$x>0$ で $e^{x}\ge\frac{x^{m}}{m!}$（$m>k$ とする）から $0<\frac{x^{k}}{e^{x}}\le\frac{m!}{x^{m-k}}\to0$。$x=e^{t}$ とおくと $\frac{\log x}{x^{\varepsilon}}=\frac{t}{e^{\varepsilon t}}=\frac1\varepsilon\cdot\frac{\varepsilon t}{e^{\varepsilon t}}\to0$。$x=\frac1y$ とすると $x^{\varepsilon}\log x=-\frac{\log y}{y^{\varepsilon}}\to0$。
:::

::: theorem $e$ の無理性 {#calc:e-irrational keywords="e is irrational: n! times the tail of sum 1/k! lies strictly between 0 and 1" index="e の無理性|いーのむりせい"}
$e$ は無理数である。
:::

::: proof
$e=\frac pq$（$q\ge1$）とする。$s_{q}\defeq\sum_{k\le q}\frac1{k!}$ とすると
$$
0<e-s_{q}=\sum_{k>q}\frac1{k!}<\frac{1}{(q+1)!}\sum_{j\ge0}\frac{1}{(q+1)^{j}}=\frac{1}{q!\,q}.
$$
$q!(e-s_{q})$ は整数（$q!e=(q-1)!p$ と $q!s_{q}$ は整数）だが、$0<q!(e-s_{q})<\frac1q\le1$ で矛盾。
:::

::: proposition 対数関数の級数 {#calc:log-series keywords="log(1+x) = sum (-1)^{n+1} x^n / n for -1 < x <= 1; log 2 = 1 - 1/2 + 1/3 - ..." index="対数関数の冪級数|たいすうかんすうのべききゅうすう"}
$-1<x\le1$ で $\log(1+x)=\sum_{n\ge1}\frac{(-1)^{n+1}}{n}x^{n}$。とくに $\log2=1-\frac12+\frac13-\cdots$。
:::

::: proof
右辺の収束半径は $1$。$|x|<1$ で項別微分すると $\sum(-1)^{n+1}x^{n-1}=\frac{1}{1+x}$ で、これは $\log(1+x)$ の導関数。両者は $0$ で $0$ なので一致（\ref{calc:mvt-consequences.1}）。$x=1$ では右辺の級数は交代級数として収束し、\ref{calc:abel-theorem}と $\log$ の連続性から $\lim_{x\to1-}\log(1+x)=\log2$ に等しい。
:::

## 解析的でない滑らかな関数 {#calc:sec-el-smooth}

::: theorem 解析的でない $C^{\infty}$ 級関数 {#calc:non-analytic-smooth keywords="f(x) = e^{-1/x} for x > 0 and 0 for x <= 0 is C^infinity with all derivatives zero at 0, hence not analytic at 0; smooth step and bump functions" index="解析的でない滑らかな関数|かいせきてきでないなめらかなかんすう, 隆起関数|りゅうきかんすう, バンプ関数|ばんぷかんすう"}
1. $f(x)\defeq e^{-1/x}$（$x>0$）、$f(x)\defeq0$（$x\le0$）は $\mathbb{R}$ で $C^{\infty}$ 級で、すべての $n$ で $f^{(n)}(0)=0$。とくに $f$ は $0$ のどの近傍でも、$0$ を中心とする冪級数で表せない（実解析的でない）。
2. $s(x)\defeq\frac{f(x)}{f(x)+f(1-x)}$ は $C^{\infty}$ 級で、$x\le0$ で $0$、$x\ge1$ で $1$。$\psi(x)\defeq s(2-2|x|)$ は $C^{\infty}$ 級で、$|x|\le\frac12$ で $1$、$|x|\ge1$ で $0$、値は $[0,1]$。
:::

::: proof
**Step 1（$x>0$ での導関数）.** 帰納法で、多項式 $P_{n}$ により $f^{(n)}(x)=P_{n}(\frac1x)e^{-1/x}$（$x>0$）：$P_{0}=1$、$\bigl(P_{n}(\frac1x)e^{-1/x}\bigr)'=\bigl(-P_{n}'(\frac1x)\frac1{x^{2}}+P_{n}(\frac1x)\frac1{x^{2}}\bigr)e^{-1/x}$。

**Step 2（$0$ での導関数）.** 帰納法で $f^{(n)}(0)=0$ を示す。$f^{(n)}(0)=0$ なら、$x>0$ で $\frac{f^{(n)}(x)-0}{x}=\frac1xP_{n}(\frac1x)e^{-1/x}=Q(t)e^{-t}$（$t=\frac1x\to+\infty$、$Q$ は多項式）$\to0$（\ref{calc:growth-rates}）、$x<0$ では $0$。よって $f^{(n+1)}(0)=0$。$f^{(n)}$ は $0$ で連続（同じ極限）なので $f\in C^{\infty}$。

**Step 3（解析的でない）.** $0$ を中心とする冪級数 $\sum c_{n}x^{n}$ が $0$ の近くで $f$ に等しければ、$c_{n}=\frac{f^{(n)}(0)}{n!}=0$（\ref{calc:power-series-differentiation.3}）で $f\equiv0$ となるが、$x>0$ で $f(x)>0$。

**Step 4（2）.** 分母 $f(x)+f(1-x)$ は $x>0$ と $1-x>0$ の少なくとも一方が成り立つので正。商は $C^{\infty}$ 級。$\psi$ は $|x|<\frac12$ の近くで定数 $1$ なので、$|x|$ が微分できない $0$ の近くでも $C^{\infty}$ 級。
:::

::: theorem ボレルの定理 {#calc:borel-theorem keywords="Borel's theorem: every real sequence (a_n) is the sequence of derivatives at 0 of some C^infinity function" index="ボレルの定理|ぼれるのていり" refname="ボレルの定理"}
任意の実数列 $(a_{n})_{n\ge0}$ について、$\mathbb{R}$ 上の $C^{\infty}$ 級関数 $F$ で $F^{(n)}(0)=a_{n}$（すべての $n$）となるものがある。
:::

::: proof
**Step 1（定数の選び方）.** \ref{calc:non-analytic-smooth} の $\psi$ について $C_{k}\defeq\max_{j\le k}\sup|\psi^{(j)}|$（$\psi^{(j)}$ は台がコンパクトで連続なので有限）とし、
$$
\lambda_{n}\defeq1+|a_{n}|\,4^{n}\max_{k<n}2^{k}C_{k}\qquad(n\ge1),\qquad\lambda_{0}\defeq1
$$
とおく。$g_{n}(x)\defeq\frac{a_{n}}{n!}x^{n}\psi(\lambda_{n}x)$ とする。

**Step 2（導関数の評価）.** ライプニッツの公式で
$$
g_{n}^{(k)}(x)=\frac{a_{n}}{n!}\sum_{j=0}^{k}\binom kj\frac{n!}{(n-k+j)!}x^{n-k+j}\lambda_{n}^{j}\psi^{(j)}(\lambda_{n}x)
$$
（$n-k+j<0$ の項は $0$）。$\psi^{(j)}(\lambda_{n}x)\neq0$ なら $|x|\le\frac1{\lambda_{n}}$ なので、$k<n$ のとき各項は $\frac{|a_{n}|}{(n-k+j)!}\lambda_{n}^{-(n-k+j)}\lambda_{n}^{j}C_{k}\le|a_{n}|\lambda_{n}^{-(n-k)}C_{k}\le|a_{n}|\lambda_{n}^{-1}C_{k}$。よって $\|g_{n}^{(k)}\|\le2^{k}|a_{n}|C_{k}\lambda_{n}^{-1}\le4^{-n}$（$k<n$）。

**Step 3（収束）.** 各 $k$ について、$n>k$ の項 $\sum_{n>k}\|g_{n}^{(k)}\|\le\sum4^{-n}<\infty$ なので、$\sum_{n}g_{n}^{(k)}$ は一様収束する（有限個の $n\le k$ の項は連続）。項別微分の定理（\ref{calc:uniform-derivative}）を $k=0,1,2,\dots$ と繰り返し使うと、$F\defeq\sum g_{n}$ は $C^{\infty}$ 級で $F^{(k)}=\sum g_{n}^{(k)}$。

**Step 4（$0$ での値）.** $|x|<\frac{1}{2\lambda_{n}}$ で $\psi(\lambda_{n}x)=1$ なので、$0$ の近くで $g_{n}(x)=\frac{a_{n}}{n!}x^{n}$。よって $g_{n}^{(k)}(0)=a_{n}$（$k=n$）、$0$（$k\neq n$）で、$F^{(k)}(0)=a_{k}$。

::: hypcheck
- **選択公理**：$\lambda_{n}$ を明示的な式で与えたので使わない。
- **$\psi$ の存在**：$C^{\infty}$ 級で台がコンパクトな関数（\ref{calc:non-analytic-smooth.2}）が鍵。実解析関数では台がコンパクトになりえない（一致の定理）。
:::
:::

::: supplement
**一般化と関連する事実.**
- 指数関数は複素数でも同じ冪級数で定義でき、$e^{ix}=\cos x+i\sin x$ から三角関数が得られる（\ref[三角関数と円周率]{calc:page-trig}）。$\exp$ は加法群 $\mathbb{R}$ から乗法群 $(0,\infty)$ への連続な同型で、連続な準同型 $\mathbb{R}\to(0,\infty)$ は $x\mapsto a^{x}$ の形に限る（知られている。連続性を外すと、選択公理のもとで病的な解がある）。
- $\pi$ や $e^{\pi}$ の無理性・超越性、$e$ の超越性（エルミート）、$\pi$ の超越性（リンデマン）は知られている（本サイト未収録）。
- 隆起関数 $\psi$ は、多様体の 1 の分割（\ref{top:partition-of-unity}）を滑らかにとるのに使う。

**前提を変えると.** ボレルの定理は、$C^{\infty}$ 級関数のテイラー級数が「どんな冪級数でもありうる」ことを示す：収束半径 $0$ の冪級数（たとえば $\sum n!x^{n}$）もテイラー級数になる。したがって「テイラー級数が収束する」ことも「収束して元の関数に一致する」ことも、$C^{\infty}$ 級からは従わない。

**高い視点.** 指数関数は「変化率が自分自身に等しい」唯一の関数（$y'=y$, $y(0)=1$ の解）であり、加法定理はその「時間の平行移動に対する不変性」の表れである。比喩で言えば、$e^{x}$ は「利息を各瞬間に元本へ組み入れる複利」で、$(1+\frac xn)^{n}$ の極限（\ref{calc:exp.5}）はまさにその連続複利である。
:::

## 問題 {#calc:sec-el-problems}

::: problem {#calc:prob-el-exp-unique}
$\mathbb{R}$ 上の微分可能な関数 $y$ で $y'=y$, $y(0)=1$ を満たすものは $\exp$ だけであることを示せ。
:::

::: solution
$g(x)\defeq y(x)e^{-x}$ とすると $g'=y'e^{-x}-ye^{-x}=0$ なので $g$ は定数（\ref{calc:mvt-consequences.1}）で、$g(0)=1$。よって $y=e^{x}$。
:::

::: problem {#calc:prob-el-am-gm}
$\log$ の凹性を使い、正の数 $x_{1},\dots,x_{n}$ について相加相乗平均の不等式 $\sqrt[n]{x_{1}\cdots x_{n}}\le\frac{x_{1}+\cdots+x_{n}}{n}$ を示せ。
:::

::: solution
$\log''(x)=-\frac1{x^{2}}<0$ なので $-\log$ は凸（\ref{calc:convex-properties.3}）。イェンセンの不等式（同じ 4、$t_{i}=\frac1n$）で $\log\frac{\sum x_{i}}{n}\ge\frac1n\sum\log x_{i}=\log\sqrt[n]{\prod x_{i}}$。$\exp$ は増加なので結論。
:::

::: problem {#calc:prob-el-sum-1-over-nlogn}
積分判定法で $\sum_{n\ge2}\frac{1}{n\log n}$ が発散し、$\sum_{n\ge2}\frac{1}{n(\log n)^{2}}$ が収束することを示せ。
:::

::: solution
$x\ge2$ で $\frac{1}{x\log x}$, $\frac{1}{x(\log x)^{2}}$ は正で減少。原始関数はそれぞれ $\log\log x$（$\to\infty$）と $-\frac{1}{\log x}$（$\to0$）なので、前者の積分は発散、後者は収束（\ref{calc:improper-tests.3}）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{calc:sec-el-exercises} にまとめた。
