# 曲線と線積分 {#vec:page-curves-line-integrals keywords="curves in R^n, length of a curve, rectifiable curve, length of C^1 curves as integral of |gamma'|, non-rectifiable curve, arc length, line integral of a vector field, line integral of a 1-form, line integral with respect to arc length, reparametrization, conservative vector field, potential, gradient field, path independence, polygonal connectedness"}

このページから、多変数解析（\ref{calc:page-euclidean-space} 以降）の結果を使って、ベクトル解析の基本的な対象を扱う。まず曲線の**長さ**を折れ線の長さの上限として定義し、$C^{1}$ 級の曲線では $\int|\gamma'|$ に等しいことを示す。次に、ベクトル場の**線積分**を定義し、それが 1 形式の積分（\ref{calc:chain-integral}）と同じものであること、向きを保つパラメータの取り替えで変わらないことを示す。最後に、線積分が経路によらないベクトル場（**保存場**）は**勾配場**にほかならないことを証明する。

> 資料：杉浦光夫『解析入門 II』（ベクトル解析）、Rudin『Principles of Mathematical Analysis』第 10 章と同じ標準的な内容。証明は自分で書き下ろした。

## 記法と定義の確認 {#vec:sec-cl-notation}

::: notation
- 全微分・連鎖律・勾配 \ref{calc:total-derivative}, \ref{calc:multivariable-chain-rule}, \ref{calc:gradient}、平均値の不等式 \tref{calc:mean-value-inequality}、偏導関数が連続なら微分可能 \ref{calc:continuous-partials-differentiable}。
- 1 変数の積分と微分積分学の基本定理 \ref{calc:integral-properties}, \tref{calc:fundamental-theorem}、置換積分 \ref{calc:substitution-parts}。
- 微分形式・引き戻し・鎖の上の積分 \ref{calc:differential-form}, \ref{calc:pullback-properties}, \ref{calc:chain-integral}、ポアンカレの補題 \tref{calc:poincare-lemma}、閉曲線と完全形式 \ref{calc:exact-closed-curve}。
- 連結性 \ref{top:connected}、ハイネ–カントール \tref{top:heine-cantor}。
- **ベクトル値関数の積分**：$g\colon[a,b]\to\mathbb{R}^{n}$ の積分は成分ごとに $\int g\defeq(\int g_{1},\dots,\int g_{n})$ と定める。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 曲線の長さ {#vec:sec-cl-length}

::: definition 曲線と長さ {#vec:curve-length keywords="curve as a continuous map from an interval; length as supremum of inscribed polygon lengths; rectifiable" index="曲線|きょくせん, 曲線の長さ|きょくせんのながさ, 求長可能|きゅうちょうかのう"}
連続写像 $\gamma\colon[a,b]\to\mathbb{R}^{n}$ を**曲線**という。$[a,b]$ の分割 $P\colon a=t_{0}<\cdots<t_{m}=b$ について、折れ線の長さ $\Lambda(\gamma,P)\defeq\sum_{k}|\gamma(t_{k})-\gamma(t_{k-1})|$ とし、
$$
L(\gamma)\defeq\sup_{P}\Lambda(\gamma,P)\in[0,\infty]
$$
を $\gamma$ の**長さ**という。$L(\gamma)<\infty$ のとき $\gamma$ は**求長可能**であるという。
:::

::: lemma 長さの基本性質 {#vec:length-basic keywords="refinement increases polygon length; additivity of length over subintervals; |gamma(b) - gamma(a)| <= L" index="曲線の長さの性質|きょくせんのながさのせいしつ"}
1. $P'$ が $P$ の細分なら $\Lambda(\gamma,P)\le\Lambda(\gamma,P')$。
2. $a<c<b$ について $L(\gamma)=L(\gamma\restriction[a,c])+L(\gamma\restriction[c,b])$。
3. $|\gamma(b)-\gamma(a)|\le L(\gamma)$。
:::

::: proof
**Step 1（1）.** 分点を 1 つ加えるごとに、三角不等式 $|\gamma(t_{k})-\gamma(t_{k-1})|\le|\gamma(t_{k})-\gamma(s)|+|\gamma(s)-\gamma(t_{k-1})|$ から和は増えない（減らない）。

**Step 2（2）.** 任意の分割 $P$ に $c$ を加えた細分 $P'$ は、$[a,c]$ と $[c,b]$ の分割の組で、1 から $\Lambda(\gamma,P)\le\Lambda(\gamma,P')\le L(\gamma\restriction[a,c])+L(\gamma\restriction[c,b])$。逆に、両側の分割をつなげた分割で $\Lambda$ は和になるので、上限をとって逆の不等式。

**Step 3（3）.** 自明な分割 $\{a,b\}$。
:::

::: lemma ベクトル値積分の不等式 {#vec:vector-integral-inequality keywords="|int g| <= int |g| for vector-valued integrable g" index="ベクトル値積分の不等式|べくとるちせきぶんのふとうしき"}
$g\colon[a,b]\to\mathbb{R}^{n}$ が連続なら $\bigl|\int_{a}^{b}g\bigr|\le\int_{a}^{b}|g|$。
:::

::: proof
$v\defeq\int g$。$v=0$ なら明らか。そうでなければ $u\defeq v/|v|$ とすると、積分の線形性とコーシー–シュワルツから $|v|=\langle u,v\rangle=\int\langle u,g\rangle\le\int|g|$。
:::

::: theorem $C^{1}$ 級の曲線の長さ {#vec:c1-curve-length keywords="a C^1 curve is rectifiable with length int_a^b |gamma'(t)| dt" index="C1 曲線の長さ|しーわんきょくせんのながさ"}
$\gamma\colon[a,b]\to\mathbb{R}^{n}$ が $C^{1}$ 級なら、$\gamma$ は求長可能で
$$
L(\gamma)=\int_{a}^{b}|\gamma'(t)|\,dt.
$$
:::

::: proof
**Step 1（$\le$）.** 微分積分学の基本定理（成分ごと）から $\gamma(t_{k})-\gamma(t_{k-1})=\int_{t_{k-1}}^{t_{k}}\gamma'$ で、\ref{vec:vector-integral-inequality} から $|\gamma(t_{k})-\gamma(t_{k-1})|\le\int_{t_{k-1}}^{t_{k}}|\gamma'|$。足して $\Lambda(\gamma,P)\le\int_{a}^{b}|\gamma'|$。

**Step 2（$\ge$）.** $\varepsilon>0$ とする。$\gamma'$ は $[a,b]$ 上で一様連続（\ref{top:heine-cantor}）なので、網目 $<\delta$ の分割では、各小区間の点 $t$ で $|\gamma'(t)-\gamma'(t_{k})|<\varepsilon$。よって
$$
\Bigl|\int_{t_{k-1}}^{t_{k}}\gamma'\Bigr|\ge|\gamma'(t_{k})|\Delta t_{k}-\Bigl|\int_{t_{k-1}}^{t_{k}}(\gamma'-\gamma'(t_{k}))\Bigr|\ge|\gamma'(t_{k})|\Delta t_{k}-\varepsilon\Delta t_{k},
$$
$$
\int_{t_{k-1}}^{t_{k}}|\gamma'|\le|\gamma'(t_{k})|\Delta t_{k}+\varepsilon\Delta t_{k}.
$$
足すと $\int_{a}^{b}|\gamma'|\le\Lambda(\gamma,P)+2\varepsilon(b-a)\le L(\gamma)+2\varepsilon(b-a)$。
:::

::: counterexample 求長可能でない曲線 {#vec:non-rectifiable keywords="the curve (t, t cos(pi/t)) on [0,1] is continuous but not rectifiable" index="求長可能でない曲線|きゅうちょうかのうでないきょくせん"}
$\gamma(t)\defeq(t,t\cos(\pi/t))$（$0<t\le1$）、$\gamma(0)\defeq(0,0)$ は連続だが、$L(\gamma)=\infty$。
:::

::: proof
連続性：$|t\cos(\pi/t)|\le t\to0$。$t_{k}\defeq1/k$ では $\gamma(t_{k})=(\frac1k,\frac{(-1)^{k}}{k})$ で、隣り合う 2 点の第 2 座標の差は $\frac1k+\frac{1}{k+1}\ge\frac1k$。分割 $\{0,\frac1N,\frac1{N-1},\dots,1\}$ について $\Lambda\ge\sum_{k=1}^{N-1}\frac1k\to\infty$。
:::

::: proposition パラメータの取り替えと弧長 {#vec:reparametrization-length keywords="length is invariant under monotone reparametrization; arc length parametrization of a regular C^1 curve" index="弧長|こちょう, 弧長パラメータ|こちょうぱらめーた, 正則曲線|せいそくきょくせん"}
1. $h\colon[c,d]\to[a,b]$ が連続な全単射（したがって狭義単調）なら $L(\gamma\circ h)=L(\gamma)$。
2. $\gamma$ が $C^{1}$ 級で**正則**（$\gamma'(t)\neq0$）なら、$s(t)\defeq\int_{a}^{t}|\gamma'|$ は $[a,b]$ から $[0,L(\gamma)]$ への $C^{1}$ 級の狭義増加な全単射で、逆写像も $C^{1}$ 級。$\tilde\gamma\defeq\gamma\circ s^{-1}$（**弧長パラメータ**）は $|\tilde\gamma'|=1$ を満たす。
:::

::: proof
**Step 1（1）.** $h$ は分割を分割に（単調減少なら逆順に）1 対 1 に写し、折れ線の長さは同じ。上限も同じ。

**Step 2（2）.** 微分積分学の基本定理から $s'(t)=|\gamma'(t)|>0$ で、$s$ は $C^{1}$ 級で狭義増加。1 変数の逆関数の微分（\ref{calc:chain-rule.2}）から $s^{-1}$ は微分可能で $(s^{-1})'=1/(s'\circ s^{-1})$（連続）。連鎖律から $|\tilde\gamma'(\sigma)|=|\gamma'(s^{-1}(\sigma))|/s'(s^{-1}(\sigma))=1$。
:::

## 線積分 {#vec:sec-cl-line-integral}

::: definition 線積分 {#vec:line-integral keywords="line integral of a continuous vector field F along a piecewise C^1 curve: int_gamma F . d x = int <F(gamma(t)), gamma'(t)> dt; line integral of a 1-form; integral with respect to arc length" index="線積分|せんせきぶん, 区分的 C1 曲線|くぶんてきしーわんきょくせん, 弧長に関する線積分|こちょうにかんするせんせきぶん"}
$U\subset\mathbb{R}^{n}$ を開集合、$F\colon U\to\mathbb{R}^{n}$ を連続なベクトル場、$\gamma\colon[a,b]\to U$ を**区分的 $C^{1}$ 級**（分割 $a=\tau_{0}<\cdots<\tau_{m}=b$ があって各 $[\tau_{l-1},\tau_{l}]$ 上で $C^{1}$ 級）とする。
$$
\int_{\gamma}F\cdot dx\defeq\sum_{l}\int_{\tau_{l-1}}^{\tau_{l}}\bigl\langle F(\gamma(t)),\gamma'(t)\bigr\rangle\,dt
$$
を $F$ の $\gamma$ に沿った**線積分**という。1 形式 $\omega=\sum_{i}F_{i}\,dx_{i}$ について $\int_{\gamma}\omega\defeq\int_{\gamma}F\cdot dx$ とも書く。連続関数 $f$ について $\int_{\gamma}f\,ds\defeq\sum_{l}\int_{\tau_{l-1}}^{\tau_{l}}f(\gamma(t))|\gamma'(t)|\,dt$ を**弧長に関する線積分**という。
:::

::: remark
$\gamma$ が $[0,1]$ 上の $C^{2}$ 級の写像なら、$\gamma^{*}\omega=\langle F(\gamma(t)),\gamma'(t)\rangle dt$（\ref{calc:pullback-properties} の定義）なので、$\int_{\gamma}\omega$ は特異 1 立方体の上の積分 \ref{calc:chain-integral} と一致する。$[a,b]$ 上の曲線は、アフィンな $t=a+(b-a)u$ で $[0,1]$ 上に移せる（置換積分で値は変わらない）。
:::

::: proposition 線積分とパラメータの取り替え {#vec:line-integral-reparametrization keywords="line integrals are invariant under orientation preserving C^1 reparametrizations and change sign under orientation reversing ones; arc length integrals are invariant under both" index="線積分の向き|せんせきぶんのむき"}
$h\colon[c,d]\to[a,b]$ を $C^{1}$ 級の全単射で $h'>0$（向きを保つ）または $h'<0$（向きを逆にする）とする。$C^{1}$ 級の $\gamma$ について
$$
\int_{\gamma\circ h}F\cdot dx=\pm\int_{\gamma}F\cdot dx,\qquad\int_{\gamma\circ h}f\,ds=\int_{\gamma}f\,ds
$$
（符号は $h'$ の符号）。
:::

::: proof
連鎖律 $(\gamma\circ h)'(u)=\gamma'(h(u))h'(u)$ と置換積分 $t=h(u)$（\ref{calc:substitution-parts}）から、$h'>0$ なら $\int_{c}^{d}\langle F(\gamma(h(u))),\gamma'(h(u))\rangle h'(u)\,du=\int_{a}^{b}\langle F(\gamma(t)),\gamma'(t)\rangle dt$。$h'<0$ なら $h(c)=b$, $h(d)=a$ で積分の向きが逆になり $-1$ 倍。弧長では $|h'|=\pm h'$ が符号を打ち消す。
:::

::: example
1. $F(x,y)=(-y,x)$、$\gamma(t)=(\cos t,\sin t)$（$0\le t\le2\pi$）：$\langle F(\gamma),\gamma'\rangle=\sin^{2}t+\cos^{2}t=1$ で $\int_{\gamma}F\cdot dx=2\pi$。
2. 曲線の長さは $L(\gamma)=\int_{\gamma}1\,ds$（\ref{vec:c1-curve-length}）。
:::

## 保存場とポテンシャル {#vec:sec-cl-conservative}

::: lemma 連結な開集合は折れ線で結べる {#vec:polygonal-connected keywords="in a connected open subset of R^n any two points are joined by a polygonal path with segments parallel to the axes" index="折れ線連結|おれせんれんけつ"}
$U\subset\mathbb{R}^{n}$ が連結な開集合なら、任意の 2 点は、各辺が座標軸に平行な $U$ 内の折れ線（有限個の線分をつないだ区分的 $C^{1}$ 曲線）で結べる。
:::

::: proof
$a\in U$ を固定し、$a$ とそのような折れ線で結べる点の集合を $E$ とする。$a\in E$。$x\in U$ と、$C(x,r)\subset U$ となる立方体（$|y-x|_{\infty}<r$）をとると、立方体の中の点は $x$ から座標軸に平行な $n$ 本の線分で結べる（立方体は各座標方向に凸）。よって $x\in E$ ならその立方体は $E$ に含まれ（$E$ は開）、$x\notin E$ ならその立方体は $E$ と交わらない（$U\setminus E$ は開）。$U$ は連結なので $E=U$（\ref{top:connected}）。
:::

::: theorem 保存場の特徴づけ {#vec:conservative-field keywords="for a continuous vector field on a connected open set: gradient field iff line integrals are path independent iff integrals over closed piecewise C^1 curves vanish" index="保存場|ほぞんば, 保存力場|ほぞんりょくば, ポテンシャル|ぽてんしゃる, 勾配場|こうばいば, 経路によらない|けいろによらない"}
$U\subset\mathbb{R}^{n}$ を連結な開集合、$F\colon U\to\mathbb{R}^{n}$ を連続なベクトル場とする。次は同値。
1. $C^{1}$ 級の関数 $f\colon U\to\mathbb{R}$（**ポテンシャル**）があって $F=\nabla f$（**勾配場**）。
2. （経路によらない）始点と終点が同じ区分的 $C^{1}$ 曲線 $\gamma_{1},\gamma_{2}$ について $\int_{\gamma_{1}}F\cdot dx=\int_{\gamma_{2}}F\cdot dx$。
3. 閉じた（始点 $=$ 終点の）区分的 $C^{1}$ 曲線 $\gamma$ について $\int_{\gamma}F\cdot dx=0$。

このとき $\int_{\gamma}F\cdot dx=f(\gamma(b))-f(\gamma(a))$ で、ポテンシャルは定数の差を除いて一意。
:::

::: proof
**Step 1（1 ⇒ 2 と公式）.** 各 $C^{1}$ 級の区間で、連鎖律から $\frac{d}{dt}f(\gamma(t))=\langle\nabla f(\gamma(t)),\gamma'(t)\rangle$（連続）なので、微分積分学の基本定理から $\int_{\tau_{l-1}}^{\tau_{l}}\langle F(\gamma),\gamma'\rangle=f(\gamma(\tau_{l}))-f(\gamma(\tau_{l-1}))$。足すと端点の値の差で、始点と終点だけで決まる。

**Step 2（2 ⇔ 3）.** 2 ⇒ 3：閉曲線 $\gamma$ と定値曲線（積分 $0$）を比べる。3 ⇒ 2：$\gamma_{1}$ のあとに $\gamma_{2}$ を逆向きにたどる閉曲線（区分的 $C^{1}$）の積分は、\ref{vec:line-integral-reparametrization} から $\int_{\gamma_{1}}-\int_{\gamma_{2}}$。

**Step 3（2 ⇒ 1）.** $a\in U$ を固定し、$f(x)\defeq\int_{\gamma}F\cdot dx$（$\gamma$ は $a$ から $x$ への区分的 $C^{1}$ 曲線。\ref{vec:polygonal-connected} から存在し、2 から $\gamma$ によらない）とおく。$x\in U$、$B(x,r)\subset U$、$0<|t|<r$ について、$a\to x$ の曲線に線分 $s\mapsto x+se_{i}$（$s$ は $0$ から $t$ まで）をつなげると
$$
\frac{f(x+te_{i})-f(x)}{t}=\frac1t\int_{0}^{t}F_{i}(x+se_{i})\,ds\to F_{i}(x)\quad(t\to0)
$$
（$F_{i}$ の連続性と積分の平均値）。よって $\partial_{i}f=F_{i}$ は連続で、$f$ は $C^{1}$ 級（\ref{calc:continuous-partials-differentiable}）、$\nabla f=F$。

**Step 4（一意性）.** $\nabla(f-g)=0$ なら、連結性から $f-g$ は定数（\ref{calc:zero-derivative-constant}）。

::: hypcheck
- **連結性**：Step 3 で $f$ をすべての点で定義するのに、Step 4 で一意性に使った。連結でなければ、各成分ごとに定数を選べる。
- **区分的 $C^{1}$ 曲線**：線積分の定義に使った。連続曲線一般では線積分そのものが定義されない（求長可能な曲線ではリーマン–スティルチェス積分で定義できる、\ref{calc:riemann-stieltjes}）。
:::
:::

::: corollary 保存場の必要条件と十分条件 {#vec:curl-free-condition keywords="a C^1 gradient field satisfies d_j F_i = d_i F_j; on a star-shaped open set the converse holds; counterexample on the punctured plane" index="渦なし|うずなし, 保存場の判定|ほぞんばのはんてい"}
$F$ を $U$ 上の $C^{1}$ 級のベクトル場とする。
1. $F$ が勾配場なら $\partial_{j}F_{i}=\partial_{i}F_{j}$（すべての $i,j$）。
2. $U$ が星形なら、逆に $\partial_{j}F_{i}=\partial_{i}F_{j}$ から $F$ は勾配場。
3. 2 は星形の仮定なしでは成り立たない：$U=\mathbb{R}^{2}\setminus\{0\}$, $F=\bigl(\frac{-y}{x^{2}+y^{2}},\frac{x}{x^{2}+y^{2}}\bigr)$。
:::

::: proof
**Step 1（1）.** $F=\nabla f$ で $F$ が $C^{1}$ 級なら $f$ は $C^{2}$ 級で、シュワルツの定理（\ref{calc:ck-symmetric}）から $\partial_{j}\partial_{i}f=\partial_{i}\partial_{j}f$。

**Step 2（2）.** 条件は 1 形式 $\omega=\sum F_{i}dx_{i}$ について $d\omega=\sum_{i<j}(\partial_{i}F_{j}-\partial_{j}F_{i})dx_{i}\wedge dx_{j}=0$ と同値。\ref{calc:poincare-lemma}から $\omega=df$（$f=K\omega$ は $C^{1}$ 級）で、$F=\nabla f$。

**Step 3（3）.** \ref{calc:exact-closed-curve.2}：$d\omega=0$ だが単位円に沿った線積分が $2\pi\neq0$ なので、定理の 3 に反し勾配場でない。
:::

::: example
**万有引力**：$F(x)\defeq-\frac{x}{|x|^{3}}$（$\mathbb{R}^{3}\setminus\{0\}$）は $F=\nabla\frac{1}{|x|}$（$\partial_{i}|x|^{-1}=-x_{i}|x|^{-3}$）。したがって、物体を点 $p$ から $q$ へ動かす仕事 $\int_{\gamma}F\cdot dx=\frac1{|q|}-\frac1{|p|}$ は経路によらない。$\mathbb{R}^{3}\setminus\{0\}$ は星形でないが、勾配場であることは直接確かめられる。
:::

::: supplement
**一般化.** \ref{vec:conservative-field} は「連結な開集合の上で、1 形式が完全 $\iff$ すべての閉曲線（サイクル）の上の積分が $0$」と言い換えられ、ド・ラーム・コホモロジーの $H^{1}$ が、閉形式を閉曲線上の積分で調べることで決まることの最も簡単な場合である。$\mathbb{R}^{2}\setminus\{0\}$ の例では、閉形式 $\omega$ の閉曲線に沿った積分は $2\pi\times$（原点の周りの回転数）で、$H^{1}(\mathbb{R}^{2}\setminus\{0\})\cong\mathbb{R}$ を表す（知られている）。

**前提を変えると.** 星形を**単連結**（すべての閉曲線が 1 点に縮む）に弱めても 2 は成り立つことが知られているが、証明にはホモトピーによる線積分の不変性が要る（本サイト未収録）。

**高い視点.** 線積分は「ベクトル場に沿った仕事」で、保存場とは「仕事が経路によらず、位置だけの関数（ポテンシャルエネルギー）の差で決まる」場である。比喩で言えば、山道をどの道で登っても標高差（ポテンシャル）だけで登った高さが決まるのが保存場で、らせん階段のように 1 周すると 1 階上がる構造（$\mathbb{R}^{2}\setminus\{0\}$ の $\omega$）では、局所的には標高が定義できても全体では定義できない。
:::

## 問題 {#vec:sec-cl-problems}

::: problem {#vec:prob-cl-helix}
らせん $\gamma(t)=(\cos t,\sin t,ct)$（$0\le t\le2\pi$）の長さを求め、弧長パラメータで書け。
:::

::: solution
$|\gamma'|=\sqrt{1+c^{2}}$ なので $L=2\pi\sqrt{1+c^{2}}$。$s=\sqrt{1+c^{2}}\,t$ から $\tilde\gamma(s)=(\cos\frac{s}{\sqrt{1+c^{2}}},\sin\frac{s}{\sqrt{1+c^{2}}},\frac{cs}{\sqrt{1+c^{2}}})$。
:::

::: problem {#vec:prob-cl-potential}
$F(x,y,z)=(2xy+z,\,x^{2}+2yz,\,y^{2}+x)$ が勾配場であることを示し、ポテンシャルを求めよ。
:::

::: solution
$\partial_{y}F_{1}=2x=\partial_{x}F_{2}$, $\partial_{z}F_{1}=1=\partial_{x}F_{3}$, $\partial_{z}F_{2}=2y=\partial_{y}F_{3}$ で $\mathbb{R}^{3}$ は星形なので勾配場。$f=x^{2}y+xz+y^{2}z$ が $\nabla f=F$ を満たす（直接微分して確かめる）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{vec:sec-cl-exercises} にまとめた。
