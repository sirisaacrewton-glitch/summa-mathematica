# 演習：多変数解析 {#calc:page-exercises-multivariable keywords="exercises, Multivariable Calculus"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exmultivariable-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## ユークリッド空間 {#calc:sec-eu-exercises}

対応するページ：\ref{calc:page-euclidean-space}

::: problem ★ 基本：ノルムの比較 {#calc:ex-eu-1}
$\R^{n}$ で $\lVert x\rVert_{\infty}\le\lVert x\rVert_{2}\le\lVert x\rVert_{1}\le n\lVert x\rVert_{\infty}$ を示せ。
:::

::: solution
$\max\lvert x_{i}\rvert^{2}\le\sum x_{i}^{2}$、$\sum x_{i}^{2}\le(\sum\lvert x_{i}\rvert)^{2}$（展開すると交差項が非負）、$\sum\lvert x_{i}\rvert\le n\max\lvert x_{i}\rvert$。
:::

::: problem ★ 基本：開集合と閉集合 {#calc:ex-eu-2}
$\R^{2}$ の部分集合 $A=\{(x,y):0<x\le1\}$ の内部・閉包・境界を求めよ。
:::

::: solution
内部 $\{0<x<1\}$、閉包 $\{0\le x\le1\}$、境界 $\{x=0\}\cup\{x=1\}$。$A$ は開でも閉でもない。
:::

::: problem ★★ 標準：コンパクト性の判定 {#calc:ex-eu-3}
$\{(x,y):x^{4}+y^{4}\le1\}$ はコンパクトか。$\{(x,y):xy=1\}$ はどうか。
:::

::: solution
前者は有界（$\lvert x\rvert,\lvert y\rvert\le1$）で閉（連続関数の逆像）なのでコンパクト（ハイネ–ボレル）。後者は閉だが有界でない（$(n,1/n)$）のでコンパクトでない。
:::

::: problem ★★★ 発展：有限次元のノルムの同値性 {#calc:ex-eu-4}
$\R^{n}$ 上の任意のノルム $N$ について $c\lVert x\rVert_{2}\le N(x)\le C\lVert x\rVert_{2}$ となる $c,C>0$ があることを示せ。
:::

::: solution
$N(x)\le\sum\lvert x_{i}\rvert N(e_{i})\le C\lVert x\rVert_{2}$（$C=\sqrt{\sum N(e_{i})^{2}}$、コーシー–シュワルツ）なので $N$ はユークリッドノルムについて連続。単位球面はコンパクトなので $N$ はそこで正の最小値 $c$ をとり、斉次性から $N(x)\ge c\lVert x\rVert_{2}$。
:::

## 全微分と連鎖律 {#calc:sec-di-exercises}

対応するページ：\ref{calc:page-differentiability}

::: problem ★ 基本：ヤコビ行列 {#calc:ex-di-1}
$F(x,y)=(x^{2}y,\ e^{xy},\ x+\sin y)$ のヤコビ行列を求め、$(1,0)$ での値を計算せよ。
:::

::: solution
$DF=\begin{pmatrix}2xy&x^{2}\\ye^{xy}&xe^{xy}\\1&\cos y\end{pmatrix}$、$(1,0)$ で $\begin{pmatrix}0&1\\0&1\\1&1\end{pmatrix}$。
:::

::: problem ★ 基本：方向微分と勾配 {#calc:ex-di-2}
$f(x,y)=x^{2}+3xy$ の点 $(1,2)$ での勾配と、方向 $u=\frac15(3,4)$ の方向微分を求めよ。$f$ が最も速く増える方向はどれか。
:::

::: solution
$\nabla f=(2x+3y,3x)=(8,3)$。$D_{u}f=\nabla f\cdot u=\frac{24+12}{5}=\frac{36}{5}$。最も速く増えるのは $\nabla f$ の方向 $\frac{1}{\sqrt{73}}(8,3)$。
:::

::: problem ★★ 標準：偏微分可能だが連続でない {#calc:ex-di-3}
$f(x,y)=\frac{xy}{x^{2}+y^{2}}$（$(x,y)\neq0$）, $f(0,0)=0$ は原点で偏微分可能だが連続でないことを示せ。
:::

::: solution
$f(x,0)=f(0,y)=0$ なので偏微分係数はどちらも $0$。直線 $y=x$ 上で $f=\frac12$ なので原点で連続でない（したがって全微分可能でもない）。
:::

::: problem ★★★ 発展：連鎖律の応用 {#calc:ex-di-4}
$f$ を $\R^{2}$ の $C^{1}$ 関数とし、$g(r,\theta)=f(r\cos\theta,r\sin\theta)$ とする。$f_{x}^{2}+f_{y}^{2}=g_{r}^{2}+\frac{1}{r^{2}}g_{\theta}^{2}$ を示せ。
:::

::: solution
$g_{r}=f_{x}\cos\theta+f_{y}\sin\theta$, $g_{\theta}=-f_{x}r\sin\theta+f_{y}r\cos\theta$。$g_{r}^{2}+\frac{1}{r^{2}}g_{\theta}^{2}$ を展開すると交差項が打ち消し合い、$f_{x}^{2}(\cos^{2}+\sin^{2})+f_{y}^{2}(\sin^{2}+\cos^{2})$。
:::

## 高階微分とテイラーの定理 {#calc:sec-hd-exercises}

対応するページ：\ref{calc:page-higher-derivatives}

::: problem ★ 基本：極値の判定 {#calc:ex-hd-1}
$f(x,y)=x^{3}-3xy+y^{3}$ の臨界点を求め、ヘッセ行列で極値を判定せよ。
:::

::: solution
$f_{x}=3x^{2}-3y=0$, $f_{y}=-3x+3y^{2}=0$ から $y=x^{2}$, $x=y^{2}$ で、実数解は $(0,0),(1,1)$。ヘッセ行列 $\begin{pmatrix}6x&-3\\-3&6y\end{pmatrix}$ の行列式は $(0,0)$ で $-9<0$（鞍点）、$(1,1)$ で $27>0$ かつ $f_{xx}=6>0$（極小、値 $-1$）。
:::

::: problem ★ 基本：2 次のテイラー展開 {#calc:ex-hd-2}
$f(x,y)=e^{x}\cos y$ の原点での 2 次のテイラー多項式を求めよ。
:::

::: solution
$f=1$, $f_{x}=1$, $f_{y}=0$, $f_{xx}=1$, $f_{xy}=0$, $f_{yy}=-1$ なので $1+x+\frac12(x^{2}-y^{2})$。
:::

::: problem ★★ 標準：ラプラス方程式 {#calc:ex-hd-3}
$u(x,y)=\log(x^{2}+y^{2})$ が $\R^{2}\setminus\{0\}$ で $u_{xx}+u_{yy}=0$ をみたすことを示せ。
:::

::: solution
$u_{x}=\frac{2x}{x^{2}+y^{2}}$, $u_{xx}=\frac{2(y^{2}-x^{2})}{(x^{2}+y^{2})^{2}}$、対称性から $u_{yy}=\frac{2(x^{2}-y^{2})}{(x^{2}+y^{2})^{2}}$。和は $0$。
:::

::: problem ★★★ 発展：鞍点の判定の限界 {#calc:ex-hd-4}
$f(x,y)=x^{2}-3xy^{2}+2y^{4}$ は原点を通るどの直線に制限しても原点で極小だが、原点で極小でないことを示せ。
:::

::: solution
$f=(x-y^{2})(x-2y^{2})$。直線 $y=mx$ 上では $x^{2}(1-3m^{2}x+2m^{4}x^{2})$ で $x\to0$ で正（$x\neq0$）、直線 $x=0$ 上でも $2y^{4}\ge0$。一方、放物線 $x=\frac32y^{2}$ 上で $f=-\frac14y^{4}<0$。ヘッセ行列は原点で $\mathrm{diag}(2,0)$ で退化しているので、2 次の判定法は使えない。
:::

## 逆関数定理と陰関数定理 {#calc:sec-ii-exercises}

対応するページ：\ref{calc:page-inverse-implicit}

::: problem ★ 基本：陰関数の微分 {#calc:ex-ii-1}
$x^{3}+y^{3}-3xy=0$ の点 $(\frac32,\frac32)$ の近くで $y=y(x)$ と解けることを示し、$y'(\frac32)$ を求めよ。
:::

::: solution
$F_{y}=3y^{2}-3x=\frac{27}{4}-\frac92=\frac94\neq0$ なので陰関数定理が使える。$y'=-\frac{F_{x}}{F_{y}}=-\frac{3x^{2}-3y}{3y^{2}-3x}=-1$。
:::

::: problem ★ 基本：局所的な逆写像 {#calc:ex-ii-2}
$F(x,y)=(e^{x}\cos y,\ e^{x}\sin y)$ のヤコビ行列式を計算し、$F$ が各点の近くで逆写像をもつが、全体では単射でないことを示せ。
:::

::: solution
$\det DF=e^{2x}\neq0$ なので逆関数定理から局所的に可逆。$F(x,y)=F(x,y+2\pi)$ なので単射でない（複素指数関数 $e^{z}$ に対応する）。
:::

::: problem ★★ 標準：ラグランジュの未定乗数法 {#calc:ex-ii-3}
$x^{2}+y^{2}=1$ の上で $f=xy$ の最大値・最小値を求めよ。
:::

::: solution
$\nabla f=\lambda\nabla g$：$y=2\lambda x$, $x=2\lambda y$ から $x^{2}=y^{2}=\frac12$。$xy=\pm\frac12$ で、最大 $\frac12$（$x=y=\pm\frac1{\sqrt2}$）、最小 $-\frac12$。円周はコンパクトなので最大・最小は存在し、臨界点の中にある。
:::

::: problem ★★★ 発展：陰関数定理の幾何 {#calc:ex-ii-4}
$\R^{3}$ で $x^{2}+y^{2}-z^{2}=c$ が滑らかな曲面（各点の近くで二変数のグラフ）になる $c$ を求めよ。
:::

::: solution
$\nabla F=2(x,y,-z)$ は原点以外で $0$ でない。原点を含むのは $c=0$ のときだけなので、$c\neq0$ なら陰関数定理から各点の近くで、$0$ でない成分の変数について解ける。$c=0$ は原点で錐の頂点となり、近くでグラフにならない。
:::

## 重積分 {#calc:sec-mi-exercises}

対応するページ：\ref{calc:page-multiple-integrals}

::: problem ★ 基本：長方形上の積分 {#calc:ex-mi-1}
$\int_{[0,1]^{2}}(x+y)^{2}\,dx\,dy$ を求めよ。
:::

::: solution
展開して $\int\int(x^{2}+2xy+y^{2})=\frac13+\frac12+\frac13=\frac76$。
:::

::: problem ★ 基本：三角形上の積分 {#calc:ex-mi-2}
$D=\{0\le y\le x\le1\}$ で $\int_{D}xy$ を求めよ。
:::

::: solution
$\int_{0}^{1}\int_{0}^{x}xy\,dy\,dx=\int_{0}^{1}\frac{x^{3}}{2}dx=\frac18$。
:::

::: problem ★★ 標準：体積 {#calc:ex-mi-3}
$x,y,z\ge0$, $x+y+z\le1$ の四面体の体積を重積分で求めよ。
:::

::: solution
$\int_{0}^{1}\int_{0}^{1-x}(1-x-y)\,dy\,dx=\int_{0}^{1}\frac{(1-x)^{2}}{2}dx=\frac16$。
:::

::: problem ★★★ 発展：ジョルダン可測でない集合 {#calc:ex-mi-4}
$[0,1]^{2}$ の有理点全体 $\mathbb{Q}^{2}\cap[0,1]^{2}$ はジョルダン可測でないことを示せ。可算個のジョルダン可測集合の和が可測とは限らないことを結論せよ。
:::

::: solution
内部は空なので内測度 $0$、閉包は $[0,1]^{2}$ なので外測度 $1$。一点はジョルダン可測（測度 $0$）なので、可算個の可測集合の和でも可測でない。（ルベーグ測度では測度 $0$。）
:::

## フビニの定理 {#calc:sec-fu-exercises}

対応するページ：\ref{calc:page-fubini}

::: problem ★ 基本：積分順序の交換 {#calc:ex-fu-1}
$\int_{0}^{1}\int_{x}^{1}e^{y^{2}}\,dy\,dx$ を求めよ。
:::

::: solution
$e^{y^{2}}$ の原始関数は初等関数で書けないので順序を交換する。領域 $\{0\le x\le y\le1\}$ で $\int_{0}^{1}\int_{0}^{y}e^{y^{2}}\,dx\,dy=\int_{0}^{1}ye^{y^{2}}dy=\frac{e-1}{2}$。
:::

::: problem ★ 基本：累次積分の計算 {#calc:ex-fu-2}
$\int_{0}^{1}\int_{0}^{2}(x^{2}+xy)\,dy\,dx$ を両方の順序で計算し、一致を確かめよ。
:::

::: solution
内側 $y$：$\int_{0}^{2}(x^{2}+xy)dy=2x^{2}+2x$、外側で $\frac23+1=\frac53$。内側 $x$：$\int_{0}^{1}(x^{2}+xy)dx=\frac13+\frac y2$、外側で $\frac23+1=\frac53$。
:::

::: problem ★★ 標準：フビニが使えない例の確認 {#calc:ex-fu-3}
$f(x,y)=\frac{x^{2}-y^{2}}{(x^{2}+y^{2})^{2}}$ について $\int_{0}^{1}f(x,y)\,dy=\frac{1}{1+x^{2}}$ を確かめ、二つの累次積分が $\pm\frac\pi4$ になることを示せ。
:::

::: solution
$\frac{\partial}{\partial y}\frac{y}{x^{2}+y^{2}}=f(x,y)$ なので $\int_{0}^{1}f\,dy=\frac{1}{x^{2}+1}$、外側の積分で $\frac\pi4$。$f(y,x)=-f(x,y)$ なので逆順は $-\frac\pi4$（\ref{calc:fubini-counterexamples}）。
:::

::: problem ★★★ 発展：確率への応用 {#calc:ex-fu-4}
$X,Y$ が $[0,1]$ 上の一様分布で独立なとき、$P(X+Y\le t)$（$0\le t\le2$）を求めよ。
:::

::: solution
$\{x+y\le t\}\cap[0,1]^{2}$ の面積。$0\le t\le1$ で $\frac{t^{2}}{2}$、$1\le t\le2$ で $1-\frac{(2-t)^{2}}{2}$。
:::

## 変数変換公式 {#calc:sec-cv-exercises}

対応するページ：\ref{calc:page-change-of-variables}

::: problem ★ 基本：極座標 {#calc:ex-cv-1}
$\int_{x^{2}+y^{2}\le1}e^{-(x^{2}+y^{2})}\,dx\,dy$ を求めよ。
:::

::: solution
極座標（ヤコビアン $r$）で $\int_{0}^{2\pi}\int_{0}^{1}e^{-r^{2}}r\,dr\,d\theta=2\pi\cdot\frac{1-e^{-1}}{2}=\pi(1-e^{-1})$。
:::

::: problem ★ 基本：球の体積 {#calc:ex-cv-2}
半径 $a$ の球の体積を球座標で計算せよ。
:::

::: solution
$x=r\sin\varphi\cos\theta$ などのヤコビアンは $r^{2}\sin\varphi$。$\int_{0}^{2\pi}\int_{0}^{\pi}\int_{0}^{a}r^{2}\sin\varphi\,dr\,d\varphi\,d\theta=2\pi\cdot2\cdot\frac{a^{3}}{3}=\frac43\pi a^{3}$。
:::

::: problem ★★ 標準：一次変換 {#calc:ex-cv-3}
$D$ を $0\le x+y\le1$, $0\le x-y\le1$ の正方形として、$\int_{D}(x+y)^{2}\,dx\,dy$ を求めよ。
:::

::: solution
$u=x+y$, $v=x-y$ とすると $\lvert\det\frac{\partial(u,v)}{\partial(x,y)}\rvert=2$ なので $dx\,dy=\frac12du\,dv$。$\frac12\int_{0}^{1}\int_{0}^{1}u^{2}\,du\,dv=\frac16$。
:::

::: problem ★★★ 発展：n 次元球の体積 {#calc:ex-cv-4}
$n$ 次元単位球の体積 $V_{n}$ について $V_{n}=\frac{2\pi}{n}V_{n-2}$ を示し、$V_{4}=\frac{\pi^{2}}{2}$ を求めよ。
:::

::: solution
最後の 2 座標を極座標 $(\rho,\theta)$ にとると、残りの $n-2$ 座標は半径 $\sqrt{1-\rho^{2}}$ の球を動き、$V_{n}=\int_{0}^{2\pi}\int_{0}^{1}V_{n-2}(1-\rho^{2})^{(n-2)/2}\rho\,d\rho\,d\theta=2\pi V_{n-2}\cdot\frac{1}{n}$。$V_{2}=\pi$ から $V_{4}=\frac{2\pi}{4}\pi=\frac{\pi^{2}}{2}$。
:::

## 広義重積分とパラメータを含む積分 {#calc:sec-pi-exercises}

対応するページ：\ref{calc:page-parameter-integrals}

::: problem ★ 基本：パラメータについての微分 {#calc:ex-pi-1}
$\int_{0}^{1}x^{a}\,dx=\frac{1}{a+1}$（$a>-1$）を $a$ で微分して、$\int_{0}^{1}x^{a}\log x\,dx$ を求めよ。微分の正当化も述べよ。
:::

::: solution
$-\frac{1}{(a+1)^{2}}$。$a\ge a_{0}>-1$ で $\lvert x^{a}\log x\rvert\le x^{a_{0}}\lvert\log x\rvert$ は $(0,1]$ で可積分なので、優関数による交換（\ref{calc:dominated-parameter-integral} と同様の議論）が使える。例：$a=2$ で $-\frac19$。
:::

::: problem ★ 基本：繰り返し微分 {#calc:ex-pi-2}
$\int_{0}^{\infty}e^{-ax}dx=\frac1a$（$a>0$）を $n$ 回微分して $\int_{0}^{\infty}x^{n}e^{-ax}dx=\frac{n!}{a^{n+1}}$ を導け。
:::

::: solution
$a\ge a_{0}>0$ で $x^{n}e^{-ax}\le x^{n}e^{-a_{0}x}$ が可積分なので、積分記号下で微分できる。$\frac{d^{n}}{da^{n}}\frac1a=\frac{(-1)^{n}n!}{a^{n+1}}$ と被積分関数の微分 $(-x)^{n}e^{-ax}$ を比べる。
:::

::: problem ★★ 標準：フルラーニ型の積分 {#calc:ex-pi-3}
$\int_{0}^{1}\frac{x^{b}-x^{a}}{\log x}\,dx=\log\frac{b+1}{a+1}$（$a,b>-1$）を示せ。
:::

::: solution
$\frac{x^{b}-x^{a}}{\log x}=\int_{a}^{b}x^{s}\,ds$。積分の順序を交換して（被積分関数は $[0,1]\times[a,b]$ で非負または可積分）$\int_{a}^{b}\frac{ds}{s+1}=\log\frac{b+1}{a+1}$。
:::

::: problem ★★★ 発展：ディリクレ積分 {#calc:ex-pi-4}
$I(a)=\int_{0}^{\infty}e^{-ax}\frac{\sin x}{x}dx$（$a>0$）について $I'(a)=-\frac{1}{1+a^{2}}$ を示し、$\int_{0}^{\infty}\frac{\sin x}{x}dx=\frac\pi2$ を導け（$a\to0+$ の極限は認めてよい）。
:::

::: solution
$a\ge a_{0}>0$ で $\lvert e^{-ax}\sin x\rvert\le e^{-a_{0}x}$ なので微分でき、$I'(a)=-\int_{0}^{\infty}e^{-ax}\sin x\,dx=-\frac{1}{1+a^{2}}$。$\lvert I(a)\rvert\le\frac1a\to0$（$a\to\infty$）なので $I(a)=\frac\pi2-\arctan a$。$a\to0+$ で $\frac\pi2$。
:::

## ℝⁿ 上の微分形式と鎖の上のストークスの定理 {#calc:sec-df-exercises}

対応するページ：\ref{calc:page-differential-forms}

::: problem ★ 基本：外微分の計算 {#calc:ex-df-1}
$\omega=xy\,dx+x^{2}\,dy$ について $d\omega$ を求めよ。$\omega$ は閉形式か。
:::

::: solution
$d\omega=d(xy)\wedge dx+d(x^{2})\wedge dy=x\,dy\wedge dx+2x\,dx\wedge dy=x\,dx\wedge dy\neq0$。閉形式でない。
:::

::: problem ★ 基本：引き戻し {#calc:ex-df-2}
極座標 $\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$ による $dx\wedge dy$ の引き戻しを求めよ。
:::

::: solution
$dx=\cos\theta\,dr-r\sin\theta\,d\theta$, $dy=\sin\theta\,dr+r\cos\theta\,d\theta$ から $\Phi^{*}(dx\wedge dy)=r\,dr\wedge d\theta$（ヤコビアン）。
:::

::: problem ★★ 標準：閉だが完全でない形式 {#calc:ex-df-3}
$\omega=\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$ は $\R^{2}\setminus\{0\}$ で閉だが完全でないことを、単位円周上の積分で示せ。
:::

::: solution
$d\omega=\Bigl(\frac{\partial}{\partial x}\frac{x}{x^{2}+y^{2}}+\frac{\partial}{\partial y}\frac{y}{x^{2}+y^{2}}\Bigr)dx\wedge dy=\frac{(y^{2}-x^{2})+(x^{2}-y^{2})}{(x^{2}+y^{2})^{2}}dx\wedge dy=0$。円周 $(\cos t,\sin t)$ 上で $\int\omega=\int_{0}^{2\pi}dt=2\pi\neq0$。完全 $\omega=df$ なら閉曲線上の積分は $0$。
:::

::: problem ★★★ 発展：ポアンカレの補題の具体例 {#calc:ex-df-4}
$\R^{3}$ の 1 形式 $\omega=yz\,dx+xz\,dy+xy\,dz$ が閉であることを確かめ、$\omega=df$ となる $f$ を、ポアンカレの補題の公式 $f(p)=\int_{0}^{1}\omega_{tp}(p)\,dt$ で求めよ。
:::

::: solution
$d\omega=(z-z)dx\wedge dy+\cdots=0$。$\omega_{tp}(p)=t^{2}(yz\cdot x+xz\cdot y+xy\cdot z)=3t^{2}xyz$ なので $f=\int_{0}^{1}3t^{2}xyz\,dt=xyz$。
:::

## 極限操作の交換の一覧 {#calc:sec-li-exercises}

対応するページ：\ref{calc:page-limit-interchange}

::: problem ★ 基本：極限と積分が交換できない例の計算 {#calc:ex-li-1}
$f_{n}(x)=nx(1-x^{2})^{n}$ について $\lim_{n}\int_{0}^{1}f_{n}$ と $\int_{0}^{1}\lim_{n}f_{n}$ を求めよ。
:::

::: solution
$\int_{0}^{1}nx(1-x^{2})^{n}dx=\frac{n}{2(n+1)}\to\frac12$。各点では $f_{n}(x)\to0$（$0<x\le1$ で $(1-x^{2})^{n}$ が指数的に減る）なので右辺は $0$。一様収束しない（$\sup f_{n}\to\infty$）。
:::

::: problem ★★ 標準：項別積分の正当化 {#calc:ex-li-2}
$\int_{0}^{1}\frac{\log(1+x)}{x}\,dx=\sum_{n\ge1}\frac{(-1)^{n+1}}{n^{2}}=\frac{\pi^{2}}{12}$ を、項別積分を正当化して示せ（$\sum\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$ は認めてよい）。
:::

::: solution
$\frac{\log(1+x)}{x}=\sum_{n\ge1}\frac{(-1)^{n+1}x^{n-1}}{n}$ は $[0,1]$ で一様収束する（交代級数の剰余は次の項 $\frac{x^{n}}{n+1}\le\frac{1}{n+1}$ で抑えられる）ので項別積分でき、$\sum\frac{(-1)^{n+1}}{n^{2}}=\frac{\pi^{2}}{6}-2\cdot\frac{1}{4}\cdot\frac{\pi^{2}}{6}=\frac{\pi^{2}}{12}$。
:::
