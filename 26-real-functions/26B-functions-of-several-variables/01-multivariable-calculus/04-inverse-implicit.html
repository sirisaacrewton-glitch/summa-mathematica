# 逆関数定理と陰関数定理 {#calc:page-inverse-implicit keywords="inverse function theorem, local diffeomorphism, implicit function theorem, constant rank theorem, submersion and immersion normal forms, Lagrange multipliers, composition of C^k maps"}

1 変数では、$f'(a)\neq0$ なら $f$ は $a$ の近くで狭義単調で、逆関数も微分可能だった。多変数での対応する主張が**逆関数定理**である：$C^{1}$ 級の写像の微分 $Df(a)$ が可逆なら、$f$ は $a$ の近くで $C^{1}$ 級の逆写像をもつ。証明は、方程式 $f(x)=y$ を縮小写像の不動点として解くことによる（縮小写像の原理は一般位相で示した \ref{top:banach-fixed-point}）。逆関数定理から、方程式 $F(x,y)=0$ を $y$ について解く**陰関数定理**、写像の局所的な標準形を与える**階数定理**、条件付き極値の**ラグランジュの未定乗数法**が導かれる。

> 資料：Rudin『Principles of Mathematical Analysis』第 9 章、杉浦光夫『解析入門 I』第 II 章 §7 と同じ標準的な内容。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-ii-notation}

::: notation
- 全微分・連鎖律・平均値の不等式 \ref{calc:total-derivative}, \ref{calc:multivariable-chain-rule}, \ref{calc:mean-value-inequality}、$C^{1}$ 級とその言い換え \ref{calc:c1-map}, \ref{calc:c1-equivalent}、$C^{k}$ 級 \ref{calc:ck-map}。
- 作用素ノルム \ref{calc:operator-norm-properties}、可逆行列の全体は開集合で逆行列は連続 \ref{calc:invertible-open}。ブロック行列の行列式 \ref{lin:block-determinant}、余因子行列 \ref{lin:adjugate}。
- バナッハの不動点定理（縮小写像の原理）\ref{top:banach-fixed-point}、完備空間の閉集合は完備 \ref{top:complete-closed}、$\mathbb{R}^{n}$ の完備性 \ref{top:reals-complete}。
- $B(x,r)$ は開球、$\bar B(x,r)$ は閉球。$\mathbb{R}^{n}\times\mathbb{R}^{m}=\mathbb{R}^{n+m}$ の点を $(x,y)$ と書き、$F(x,y)$ の $x$, $y$ に関する部分的な微分（ヤコビ行列の対応するブロック）を $D_{x}F$, $D_{y}F$ と書く。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## $C^{k}$ 級写像の合成 {#calc:sec-ii-ck}

::: lemma $C^{k}$ 級写像の合成と逆行列 {#calc:ck-composition keywords="composition of C^k maps is C^k; matrix inversion is C^infinity on GL_n" index="Ck 級写像の合成|しーけーきゅうしゃぞうのごうせい"}
1. $C^{k}$ 級写像（$k\ge1$）の合成は $C^{k}$ 級。
2. 逆行列をとる写像 $\iota\colon GL_{n}(\mathbb{R})\to M_{n}(\mathbb{R})$, $A\mapsto A^{-1}$（$M_{n}(\mathbb{R})=\mathbb{R}^{n^{2}}$ とみる）は $C^{\infty}$ 級。
:::

::: proof
**Step 1（1）.** $k$ についての帰納法。$f\colon U\to V$, $g\colon V\to\mathbb{R}^{l}$ が $C^{k}$ 級とする。連鎖律から $g\circ f$ は微分可能で、成分で $\partial_{j}(g\circ f)_{p}=\sum_{i}(\partial_{i}g_{p}\circ f)\,\partial_{j}f_{i}$。$k=1$：右辺は連続関数の合成・積・和で連続なので $C^{1}$ 級。$k\ge2$：$\partial_{i}g_{p}$ と $f$ は $C^{k-1}$ 級なので、帰納法の仮定から $\partial_{i}g_{p}\circ f$ は $C^{k-1}$ 級、$\partial_{j}f_{i}$ も $C^{k-1}$ 級。$C^{k-1}$ 級関数の積と和は $C^{k-1}$ 級（積の微分 \ref{calc:multivariable-chain-rule} の 3 を $k-1$ 回使う帰納法）。よって $g\circ f$ の 1 階偏導関数はすべて $C^{k-1}$ 級で、$g\circ f$ は $C^{k}$ 級。

**Step 2（2）.** $A^{-1}=\frac{1}{\det A}\operatorname{adj}A$（\ref{lin:adjugate}）で、$\det A$ と $\operatorname{adj}A$ の成分は $A$ の成分の多項式、$\det A\neq0$ なので、各成分は多項式を $0$ にならない多項式で割った有理関数で、$C^{\infty}$ 級。
:::

## 逆関数定理 {#calc:sec-ii-inverse}

::: theorem 逆関数定理 {#calc:inverse-function-theorem keywords="inverse function theorem: if f is C^k (k >= 1) and Df(a) is invertible, f is a C^k diffeomorphism between neighborhoods of a and f(a), with D(f^{-1})(y) = Df(f^{-1}(y))^{-1}" index="逆関数定理|ぎゃくかんすうていり, 局所微分同相|きょくしょびぶんどうそう, 微分同相写像|びぶんどうそうしゃぞう"}
$U\subset\mathbb{R}^{n}$ を開集合、$f\colon U\to\mathbb{R}^{n}$ を $C^{k}$ 級（$k\ge1$）、$a\in U$ で $Df(a)$ が可逆とする。このとき $a$ を含む開集合 $V\subset U$ と $f(a)$ を含む開集合 $W$ があって、
1. $f\restriction V\colon V\to W$ は全単射で、
2. 逆写像 $g\defeq(f\restriction V)^{-1}\colon W\to V$ は $C^{k}$ 級で、$Dg(y)=Df(g(y))^{-1}$（$y\in W$）。
:::

::: intuition
$f$ は $a$ の近くで線形写像 $A=Df(a)$ にほぼ等しい。$A$ は可逆なので、$f$ も「ほぼ可逆」であるはずだ、というのが直感である。方程式 $f(x)=y$ は $x=x+A^{-1}(y-f(x))$ と書き直せ、右辺の写像 $\varphi_{y}$ の微分は $I-A^{-1}Df(x)$、すなわち「$Df(x)$ と $A$ のずれ」なので、$a$ の近くでは小さい。小さい微分をもつ写像は縮小写像なので、不動点がただ一つある。これが解の存在と一意性を与える。
:::

::: proof
**Step 1（近傍の選び方）.** $A\defeq Df(a)$ とし、$\lambda>0$ を $2\lambda\|A^{-1}\|=1$ となるようにとる。$Df$ は連続（\ref{calc:c1-equivalent}）なので、$a$ を中心とする開球 $V\subset U$ を、$x\in V$ なら $\|Df(x)-A\|<\lambda$ となるようにとれる。

**Step 2（補助写像）.** $y\in\mathbb{R}^{n}$ について $\varphi_{y}(x)\defeq x+A^{-1}(y-f(x))$（$x\in U$）とおく。$f(x)=y\iff\varphi_{y}(x)=x$。連鎖律から $D\varphi_{y}(x)=I-A^{-1}Df(x)=A^{-1}(A-Df(x))$ で、$x\in V$ なら $\|D\varphi_{y}(x)\|\le\|A^{-1}\|\lambda=\frac12$。$V$ は凸なので、平均値の不等式（\ref{calc:mean-value-inequality}）から
$$
|\varphi_{y}(x_{1})-\varphi_{y}(x_{2})|\le\tfrac12|x_{1}-x_{2}|\qquad(x_{1},x_{2}\in V).
\label{calc:eq-ift-contraction}
$$

**Step 3（単射）.** $x_{1},x_{2}\in V$, $f(x_{1})=f(x_{2})=y$ なら、$x_{1},x_{2}$ はともに $\varphi_{y}$ の不動点なので、\eqref{calc:eq-ift-contraction} から $|x_{1}-x_{2}|\le\frac12|x_{1}-x_{2}|$、すなわち $x_{1}=x_{2}$。

**Step 4（$W\defeq f(V)$ は開）.** $y_{0}=f(x_{0})$（$x_{0}\in V$）とし、$\rho>0$ を $\bar B(x_{0},\rho)\subset V$ となるようにとる。$|y-y_{0}|<\lambda\rho$ を満たす $y$ が $W$ に入ることを示す。$x\in\bar B(x_{0},\rho)$ なら
$$
|\varphi_{y}(x)-x_{0}|\le|\varphi_{y}(x)-\varphi_{y}(x_{0})|+|\varphi_{y}(x_{0})-x_{0}|\le\tfrac12\rho+\|A^{-1}\||y-y_{0}|<\tfrac12\rho+\tfrac12\rho=\rho
$$
（$\varphi_{y}(x_{0})-x_{0}=A^{-1}(y-y_{0})$）。よって $\varphi_{y}$ は閉球 $\bar B(x_{0},\rho)$ を自分自身に写す縮小写像。閉球は完備（\ref{top:complete-closed}）で空でないので、不動点定理（\ref{top:banach-fixed-point}）から不動点 $x$ があり、$f(x)=y$。したがって $B(y_{0},\lambda\rho)\subset W$。

**Step 5（逆写像の連続性の評価）.** $g\defeq(f\restriction V)^{-1}\colon W\to V$ とする。$y,y+k\in W$ について $x\defeq g(y)$, $h\defeq g(y+k)-x$ とおくと、$\varphi_{y}(x+h)-\varphi_{y}(x)=h-A^{-1}k$ なので、\eqref{calc:eq-ift-contraction} から $|h-A^{-1}k|\le\frac12|h|$。よって $\frac12|h|\le|A^{-1}k|\le\|A^{-1}\||k|=\frac{|k|}{2\lambda}$、すなわち
$$
|h|\le\lambda^{-1}|k|.
\label{calc:eq-ift-lipschitz}
$$
とくに $g$ はリプシッツ連続。

**Step 6（微分可能性）.** $x\in V$ では $\|Df(x)-A\|\|A^{-1}\|<\frac12<1$ なので、$T\defeq Df(x)$ は可逆（\ref{calc:invertible-open} の 2）。$r(h)\defeq f(x+h)-f(x)-Th$ とおくと $k=f(x+h)-f(x)=Th+r(h)$ で
$$
g(y+k)-g(y)-T^{-1}k=h-T^{-1}(Th+r(h))=-T^{-1}r(h).
$$
$k\neq0$ なら $h\neq0$（$g$ は単射）で、\eqref{calc:eq-ift-lipschitz} から
$$
\frac{|T^{-1}r(h)|}{|k|}\le\frac{\|T^{-1}\|}{\lambda}\cdot\frac{|r(h)|}{|h|}.
$$
$k\to0$ のとき \eqref{calc:eq-ift-lipschitz} から $h\to0$ なので、右辺は $0$ に近づく。よって $g$ は $y$ で微分可能で $Dg(y)=T^{-1}=Df(g(y))^{-1}$。

**Step 7（$C^{k}$ 級）.** $Dg=\iota\circ Df\circ g$（$\iota$ は逆行列）。$g$ は連続、$Df$ は連続、$\iota$ は連続（\ref{calc:invertible-open} の 3）なので $Dg$ は連続で、$g$ は $C^{1}$ 級（\ref{calc:c1-equivalent}）。$j<k$ で $g$ が $C^{j}$ 級なら、$Df$ は $C^{k-1}$ 級で $j\le k-1$ なので、\ref{calc:ck-composition} から $\iota\circ Df\circ g$ は $C^{j}$ 級、すなわち $g$ の 1 階偏導関数が $C^{j}$ 級で、$g$ は $C^{j+1}$ 級。帰納法で $g$ は $C^{k}$ 級。

::: hypcheck
- **$Df(a)$ が可逆**：Step 1 で $A^{-1}$ を使った。外すと偽：$f(x)=x^{3}$ は $\mathbb{R}$ の全単射だが、逆関数 $y^{1/3}$ は $0$ で微分可能でない（$Df(0)=0$）。
- **$C^{1}$ 級（$Df$ の $a$ での連続性）**：Step 1 で、$a$ の近傍全体で $Df(x)$ が $A$ に近いことに使った。外すと偽：$f(x)=x+2x^{2}\sin(1/x)$（$x\neq0$）, $f(0)=0$ は $\mathbb{R}$ 上で微分可能で $f'(0)=1$ だが、$f'(\frac{1}{2\pi n})=-1$, $f'(\frac{1}{(2n+1)\pi})=3$ なので $0$ のどの近傍でも単調でなく、したがって単射でない（区間上の連続な単射は狭義単調、\ref{calc:continuous-inverse} の 1）。
- **完備性**：Step 4 の不動点定理に使った。
- **結論は局所的**：次の例を見よ。
:::
:::

::: example
1. **大域的には単射とは限らない**：$f(x,y)=(e^{x}\cos y,e^{x}\sin y)$ は $\det Df=e^{2x}\neq0$ なのですべての点で逆関数定理が使えるが、$f(x,y+2\pi)=f(x,y)$ なので $\mathbb{R}^{2}$ 上で単射でない。
2. **極座標**：$F(r,\theta)=(r\cos\theta,r\sin\theta)$ は $\det DF=r$ なので、$r>0$ の各点の近くで $C^{\infty}$ 級の逆写像をもつ。
:::

::: definition 微分同相写像 {#calc:diffeomorphism keywords="C^k diffeomorphism between open sets: bijection, C^k with C^k inverse" index="微分同相写像（開集合の間）|びぶんどうそうしゃぞうかいしゅうごうのあいだ"}
$\mathbb{R}^{n}$ の開集合 $V,W$ の間の全単射 $f\colon V\to W$ で、$f$ と $f^{-1}$ がともに $C^{k}$ 級であるものを **$C^{k}$ 微分同相写像**という。逆関数定理は、「$Df(a)$ が可逆な $C^{k}$ 級写像は、$a$ の近くで $C^{k}$ 微分同相写像である」と言っている。
:::

::: corollary 開写像性 {#calc:open-mapping-c1 keywords="a C^1 map whose derivative is invertible everywhere is an open map" index="開写像（多変数）|かいしゃぞうたへんすう"}
$f\colon U\to\mathbb{R}^{n}$ が $C^{1}$ 級で、すべての点で $Df$ が可逆なら、$f$ は開集合を開集合に写す。
:::

::: proof
$O\subset U$ が開で $y=f(x)$, $x\in O$ とする。$f\restriction O$ に逆関数定理を使うと、$x\in V\subset O$ で $f(V)$ は $y$ を含む開集合。よって $f(O)$ は各点の近傍を含み開。
:::

## 陰関数定理 {#calc:sec-ii-implicit}

::: theorem 陰関数定理 {#calc:implicit-function-theorem keywords="implicit function theorem: if F(a,b) = 0 and D_y F(a,b) is invertible, the zero set of F near (a,b) is the graph of a unique C^k function y = phi(x), with D phi = -(D_y F)^{-1} D_x F" index="陰関数定理|いんかんすうていり, 陰関数|いんかんすう"}
$\Omega\subset\mathbb{R}^{n}\times\mathbb{R}^{m}$ を開集合、$F\colon\Omega\to\mathbb{R}^{m}$ を $C^{k}$ 級（$k\ge1$）、$(a,b)\in\Omega$ で $F(a,b)=0$、$D_{y}F(a,b)$（$m\times m$ 行列）が可逆とする。このとき $(a,b)$ を含む開集合 $V\subset\Omega$、$a$ を含む開集合 $A\subset\mathbb{R}^{n}$、$C^{k}$ 級写像 $\phi\colon A\to\mathbb{R}^{m}$ があって、
1. $\phi(a)=b$、すべての $x\in A$ で $(x,\phi(x))\in V$ かつ $F(x,\phi(x))=0$。
2. $\{(x,y)\in V:F(x,y)=0\}=\{(x,\phi(x)):x\in A\}$（$V$ の中の零点はちょうど $\phi$ のグラフ）。
3. $D\phi(x)=-D_{y}F(x,\phi(x))^{-1}D_{x}F(x,\phi(x))$。
:::

::: intuition
$F$ が線形 $F(x,y)=Px+Qy$ なら、$Q$ が可逆のとき $F=0$ は $y=-Q^{-1}Px$ と解ける。陰関数定理はその非線形版で、「$y$ についての微分が可逆なら、$F=0$ は $y$ について局所的に解ける」。証明は、$x$ をそのまま残す写像 $\Phi(x,y)=(x,F(x,y))$ に逆関数定理を使う、という一つの工夫に尽きる。
:::

::: proof
**Step 1（補助写像）.** $\Phi\colon\Omega\to\mathbb{R}^{n}\times\mathbb{R}^{m}$, $\Phi(x,y)\defeq(x,F(x,y))$ は $C^{k}$ 級で
$$
D\Phi=\begin{pmatrix}I_{n}&0\\D_{x}F&D_{y}F\end{pmatrix},\qquad\det D\Phi(a,b)=\det D_{y}F(a,b)\neq0
$$
（\ref{lin:block-determinant} の 2、左上 $I_{n}$ について）。逆関数定理から、$(a,b)$ を含む開集合 $V\subset\Omega$ と $(a,0)=\Phi(a,b)$ を含む開集合 $W$ があって、$\Phi\colon V\to W$ は全単射で、逆写像 $\Psi\colon W\to V$ は $C^{k}$ 級。

**Step 2（逆写像の形）.** $\Phi$ は第 1 成分を保つので、$\Psi(x,z)=(x,\psi(x,z))$ の形（$\Phi(\Psi(x,z))=(x,z)$ の第 1 成分から）で、$\psi$ は $C^{k}$ 級、$F(x,\psi(x,z))=z$。

**Step 3（1）.** $A\defeq\{x\in\mathbb{R}^{n}:(x,0)\in W\}$ は開（連続写像 $x\mapsto(x,0)$ による $W$ の逆像）で $a\in A$。$\phi(x)\defeq\psi(x,0)$ とおくと $C^{k}$ 級（\ref{calc:ck-composition}）、$(x,\phi(x))=\Psi(x,0)\in V$、$F(x,\phi(x))=0$。$\Psi(a,0)=(a,b)$ から $\phi(a)=b$。

**Step 4（2）.** $(x,y)\in V$ で $F(x,y)=0$ なら、$\Phi(x,y)=(x,0)\in W$ なので $x\in A$ で、$(x,y)=\Psi(x,0)=(x,\phi(x))$。逆の包含は 1。

**Step 5（3）.** $G(x)\defeq F(x,\phi(x))=0$ を連鎖律で微分すると $D_{x}F+D_{y}F\,D\phi=0$（$(x,\phi(x))$ で評価）。$(x,\phi(x))\in V$ では $D\Phi$ が可逆（逆関数定理の 2 で $D\Psi=D\Phi^{-1}$）なので $\det D_{y}F=\det D\Phi\neq0$。$D_{y}F^{-1}$ を左から掛ける。

::: hypcheck
- **$D_{y}F(a,b)$ が可逆**：Step 1 で逆関数定理を使うのに使った。外すと偽：$F(x,y)=x^{2}+y^{2}$ は $(0,0)$ で $D_{y}F=0$ で、零点集合は 1 点なので $y=\phi(x)$ と表せない。$F(x,y)=x-y^{3}$ では零点集合はグラフ $y=x^{1/3}$ だが $\phi$ は $0$ で微分可能でない。
- **$C^{1}$ 級**：逆関数定理の仮定として使った。
:::
:::

::: example
**円周**：$F(x,y)=x^{2}+y^{2}-1$、$(a,b)$ で $b\neq0$ なら $D_{y}F=2b\neq0$ で、$a$ の近くで $y=\phi(x)=\operatorname{sgn}(b)\sqrt{1-x^{2}}$、$\phi'(x)=-\frac{2x}{2\phi(x)}=-\frac{x}{\phi(x)}$。$b=0$（$(\pm1,0)$）では $y$ について解けないが、$D_{x}F=\pm2\neq0$ なので $x$ について解ける。
:::

## 階数定理 {#calc:sec-ii-rank}

::: theorem 階数定理 {#calc:constant-rank-theorem keywords="constant rank theorem: a C^k map of constant rank r near a is, after C^k changes of coordinates, (x_1,...,x_n) -> (x_1,...,x_r,0,...,0); submersions and immersions" index="階数定理|かいすうていり, 沈め込み|しずめこみ, はめ込み|はめこみ"}
$U\subset\mathbb{R}^{n}$ を開集合、$f\colon U\to\mathbb{R}^{m}$ を $C^{k}$ 級（$k\ge1$）、$a\in U$ とし、$a$ のある近傍で $\operatorname{rank}Df(x)=r$（一定）とする。このとき、$a$ を含む開集合 $V$、$0$ を含む開集合 $V'$、$C^{k}$ 微分同相写像 $\alpha\colon V'\to V$（$\alpha(0)=a$）と、$f(a)$ を含む開集合 $W$ 上の $C^{k}$ 微分同相写像 $\beta\colon W\to\beta(W)$（$\beta(f(a))=0$）があって、$f(V)\subset W$ かつ
$$
\beta\circ f\circ\alpha(u_{1},\dots,u_{n})=(u_{1},\dots,u_{r},0,\dots,0)\qquad(u\in V').
$$
とくに $Df(a)$ が全射（$r=m$、**沈め込み**）なら $\beta$ は平行移動にとれ、$Df(a)$ が単射（$r=n$、**はめ込み**）なら $\alpha$ は平行移動にとれる。階数が一定であることは、$r=m$ または $r=n$ のときは $a$ での条件から自動的に従う。
:::

::: proof
**Step 1（座標の並べ替え）.** 平行移動で $a=0$, $f(a)=0$ としてよい。$Df(0)$ の階数は $r$ なので、$r\times r$ の可逆な小行列がある（\ref{lin:rank-minors}）。定義域と値域の座標を並べ替える（置換行列という線形の微分同相写像を前後に合成する）ことで、左上の $r\times r$ ブロックが可逆としてよい。$x=(x',x'')\in\mathbb{R}^{r}\times\mathbb{R}^{n-r}$, $f=(f',f'')\in\mathbb{R}^{r}\times\mathbb{R}^{m-r}$ と書くと、$D_{x'}f'(0)$ は可逆。

**Step 2（定義域の座標変換）.** $G(x)\defeq(f'(x),x'')$ とおくと
$$
DG(0)=\begin{pmatrix}D_{x'}f'(0)&D_{x''}f'(0)\\0&I_{n-r}\end{pmatrix}
$$
は可逆（\ref{lin:block-determinant} の 1）。逆関数定理から、$0$ の近傍 $V_{0}$ と $G(V_{0})$ の間で $G$ は $C^{k}$ 微分同相写像で、逆写像を $H$ とする。$f'(H(u))=u'$（$G(H(u))=u$ の第 1 成分）なので
$$
f\circ H(u)=(u',k(u)),\qquad k\defeq f''\circ H.
$$

**Step 3（$k$ は $u'$ だけの関数）.** $V_{0}$ を $\operatorname{rank}Df=r$ となる近傍の中にとっておく。$D(f\circ H)(u)=Df(H(u))DH(u)$ で $DH(u)$ は可逆なので、階数は $r$。一方
$$
D(f\circ H)(u)=\begin{pmatrix}I_{r}&0\\D_{u'}k&D_{u''}k\end{pmatrix}
$$
で、行基本変形（上の $r$ 行の $D_{u'}k$ 倍を下から引く）で $\begin{pmatrix}I_{r}&0\\0&D_{u''}k\end{pmatrix}$ になるので、階数は $r+\operatorname{rank}D_{u''}k$。よって $G(V_{0})$ の上で $D_{u''}k=0$。$0$ を中心とする直積の形の開集合 $V'\defeq B'\times B''\subset G(V_{0})$（$B'\subset\mathbb{R}^{r}$, $B''\subset\mathbb{R}^{n-r}$ は開球）をとると、各 $u'$ について $u''\mapsto k(u',u'')$ は凸集合 $B''$ 上で微分が $0$ なので定数（\ref{calc:zero-derivative-constant}）。$\kappa(u')\defeq k(u',0)$ とおくと $k(u)=\kappa(u')$ で、$\kappa$ は $C^{k}$ 級。

**Step 4（値域の座標変換）.** $W\defeq B'\times\mathbb{R}^{m-r}$ 上で $\beta(v',v'')\defeq(v',v''-\kappa(v'))$ とおく。$\beta$ は $C^{k}$ 級で、逆写像 $(v',w'')\mapsto(v',w''+\kappa(v'))$ も $C^{k}$ 級なので微分同相写像。$\alpha\defeq H\restriction V'$, $V\defeq H(V')$ とおくと、$u\in V'$ について $f(\alpha(u))=(u',\kappa(u'))\in W$ で、$\beta(f(\alpha(u)))=(u',0)$。

**Step 5（特別な場合）.** $r=m$ なら $f''$ はなく、$\beta$ は座標の並べ替えと平行移動だけ。$r=n\le m$ なら、$a=0$, $f(0)=0$ とし値域の座標を並べ替えて $D f'(0)$（$n\times n$）を可逆とする。$\Theta(u,w)\defeq(f'(u),f''(u)+w)$（$w\in\mathbb{R}^{m-n}$）は $D\Theta(0,0)=\begin{pmatrix}Df'(0)&0\\Df''(0)&I\end{pmatrix}$ が可逆なので（\ref{lin:block-determinant} の 2）、逆関数定理から $0$ の近くの微分同相写像で、$\beta\defeq\Theta^{-1}$ とすると $\beta(f(u))=\beta(\Theta(u,0))=(u,0)$。よって $\alpha$ は平行移動でよい。$\operatorname{rank}Df(a)=m$（または $n$）なら、最大階数の小行列式は $a$ の近くで $0$ にならない（連続性）ので、階数は近傍で一定。

::: hypcheck
- **階数一定**：Step 3 で $D_{u''}k=0$ を得るのに使った。外すと偽：$f(x)=x^{2}$（$\mathbb{R}\to\mathbb{R}$）は $0$ で階数 $0$、その近くで階数 $1$ で、$0$ の近くでどんな座標変換でも $u\mapsto(u)$ や $u\mapsto0$ にならない（単射でも定数でもない）。
- **$C^{1}$ 級**：逆関数定理に使った。
:::
:::

## ラグランジュの未定乗数法 {#calc:sec-ii-lagrange}

::: theorem ラグランジュの未定乗数法 {#calc:lagrange-multipliers keywords="Lagrange multipliers: at a local extremum of f subject to g = 0 with Dg(a) of full rank, grad f(a) is a linear combination of the grad g_i(a)" index="ラグランジュの未定乗数法|らぐらんじゅのみていじょうすうほう, 条件付き極値|じょうけんつききょくち"}
$U\subset\mathbb{R}^{N}$ を開集合、$f\colon U\to\mathbb{R}$ と $g=(g_{1},\dots,g_{m})\colon U\to\mathbb{R}^{m}$（$m<N$）を $C^{1}$ 級、$M\defeq\{x\in U:g(x)=0\}$ とする。$a\in M$ で $\operatorname{rank}Dg(a)=m$ とし、$f\restriction M$ が $a$ で極値をとる（$a$ のある近傍 $O$ で、$x\in O\cap M$ なら $f(x)\ge f(a)$、または $\le$）とする。このとき実数 $\lambda_{1},\dots,\lambda_{m}$ があって
$$
\nabla f(a)=\sum_{i=1}^{m}\lambda_{i}\nabla g_{i}(a).
$$
:::

::: proof
**Step 1（座標の分け方）.** $Dg(a)$ の $m\times m$ の可逆な小行列（\ref{lin:rank-minors}）の列に対応する座標を $y\in\mathbb{R}^{m}$、残りを $x\in\mathbb{R}^{n}$（$n=N-m$）とし、座標を並べ替えて点を $(x,y)$、$a=(a',b)$ と書く。$D_{y}g(a)$ は可逆。

**Step 2（陰関数）.** 陰関数定理から、$(a',b)$ の近傍 $V$（$O$ に含まれるようにとる）、$a'$ の近傍 $A$、$C^{1}$ 級の $\phi\colon A\to\mathbb{R}^{m}$ があって、$V\cap M$ はグラフ $\{(x,\phi(x))\}$。$h(x)\defeq f(x,\phi(x))$ は $A$ 上の $C^{1}$ 級関数で、$(x,\phi(x))\in V\cap M\subset O\cap M$ なので $h$ は $a'$ で極値をとる。よって $\nabla h(a')=0$（\ref{calc:second-derivative-test} の Step 1 と同じく、フェルマーの定理を各方向に使う）。

**Step 3（乗数）.** 連鎖律と陰関数定理の 3 から、$(a',b)$ で評価して
$$
0=Dh(a')=D_{x}f+D_{y}f\,D\phi(a')=D_{x}f-D_{y}f\,(D_{y}g)^{-1}D_{x}g.
$$
行ベクトル $\lambda\defeq D_{y}f\,(D_{y}g)^{-1}\in M_{1,m}(\mathbb{R})$ とおくと $D_{x}f=\lambda D_{x}g$、また定義から $D_{y}f=\lambda D_{y}g$。合わせて $Df(a)=\lambda Dg(a)$、すなわち $\nabla f(a)=\sum_{i}\lambda_{i}\nabla g_{i}(a)$。

::: hypcheck
- **$\operatorname{rank}Dg(a)=m$**：Step 1・2 で陰関数定理を使うのに使った。外すと偽：$g(x,y)=y^{2}-x^{3}$、$f(x,y)=x$ では、$M=\{y^{2}=x^{3}\}\subset\{x\ge0\}$ なので $f\restriction M$ は原点で最小値をとるが、$\nabla g(0)=0$ なので $\lambda\nabla g(0)=0\neq(1,0)=\nabla f(0)$。
- 結論は**必要条件**にすぎない：$\nabla f=\lambda\nabla g$ を満たす点が極値とは限らない。
:::
:::

::: example
**円周上の最大**：$f(x,y)=x+y$ を $g=x^{2}+y^{2}-1=0$ の上で考える。$M$ はコンパクトなので $f$ は最大値・最小値をとり（\ref{top:extreme-value}）、$\nabla g=(2x,2y)\neq0$ が $M$ 上で成り立つので、極値点で $(1,1)=\lambda(2x,2y)$。$x=y=\frac{1}{2\lambda}$ と $x^{2}+y^{2}=1$ から $(x,y)=\pm(\frac{1}{\sqrt2},\frac{1}{\sqrt2})$。最大値 $\sqrt2$、最小値 $-\sqrt2$。
:::

::: supplement
**一般化.** 逆関数定理・陰関数定理は、$\mathbb{R}^{n}$ を**バナッハ空間**（完備なノルム空間）に、可逆行列を有界な逆をもつ有界線形作用素に置き換えて、同じ証明で成り立つ（使ったのは完備性、平均値の不等式、ノイマン級数だけ）。これは微分方程式の解の存在や、変分問題で使われる。

**前提を変えると.** $f$ が $C^{1}$ でなく単に微分可能で、すべての点で $Df$ が可逆な場合にも、$f$ は局所的に単射であることが知られているが、証明はより難しい（本サイト未収録）。

**高い視点.** 逆関数定理は「微分（線形近似）が持つ性質のうち、可逆性は開条件なので、近くの非線形写像にも引き継がれる」という原理の典型例である。階数定理はさらに、「階数が一定なら、写像は座標を取り替えると線形写像 $(u',u'')\mapsto(u',0)$ と同じ形になる」ことを言っており、局所的には $C^{1}$ 写像の分類が線形代数（階数）に帰着する。比喩で言えば、逆関数定理は「顕微鏡で拡大して見た像が可逆な線形写像なら、肉眼で見える範囲でも可逆」という保証で、その範囲の大きさは「微分がどれだけ速く変わるか」（Step 1 の $\lambda$ と近傍の取り方）で決まる。多様体論では、これらの定理が部分多様体の定義と、正則値の逆像が部分多様体になること（陰関数定理の幾何的な言い換え）の土台になる。
:::

## 問題 {#calc:sec-ii-problems}

::: problem {#calc:prob-ii-implicit-curve}
$x^{3}+y^{3}-3xy=0$（デカルトの葉線）について、どの点の近くで $y$ を $x$ の $C^{\infty}$ 級関数として解けるか調べ、そこでの $y'$ を求めよ。
:::

::: solution
$F=x^{3}+y^{3}-3xy$、$\partial_{y}F=3y^{2}-3x$。$F=0$ と $y^{2}=x$ を連立すると $x^{3}+y^{3}-3y^{3}=0$ から $x^{3}=2y^{3}$、$y^{6}=2y^{3}$ で $y=0$ または $y^{3}=2$。よって $(0,0)$ と $(2^{2/3},2^{1/3})$ を除く曲線上の点で解け、$y'=-\frac{\partial_{x}F}{\partial_{y}F}=-\frac{x^{2}-y}{y^{2}-x}$。
:::
