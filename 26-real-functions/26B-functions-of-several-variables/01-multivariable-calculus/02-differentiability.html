# 全微分と連鎖律 {#calc:page-differentiability keywords="total derivative, Frechet derivative, differentiable map R^n -> R^m, partial derivative, directional derivative, Jacobian matrix, gradient, C^1 implies differentiable, chain rule, mean value inequality, partial derivatives without differentiability"}

1 変数の微分係数 $f'(a)$ は「$f(a+h)-f(a)$ を $h$ の 1 次式 $f'(a)h$ で近似したときの係数」と読み直せる。多変数では、この「1 次式」を**線形写像**に置き換えたものが**全微分**である。このページでは全微分を定義し、偏微分・方向微分との関係（全微分可能なら偏微分はすべて存在するが、逆は成り立たない）、偏導関数が連続なら全微分可能であること、**連鎖律**、**平均値の不等式**を示す。前ページ（\ref{calc:page-euclidean-space}）の作用素ノルムを使う。

> 資料：Rudin『Principles of Mathematical Analysis』第 9 章、杉浦光夫『解析入門 I』第 II 章 §5 と同じ標準的な内容。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-di-notation}

::: notation
- $U\subset\mathbb{R}^{n}$ は開集合、$f=(f_{1},\dots,f_{m})\colon U\to\mathbb{R}^{m}$。$|\cdot|$ はユークリッドノルム、$\|A\|$ は作用素ノルム（\ref{calc:operator-norm}, \ref{calc:operator-norm-properties}）。ノルムの同値性（\ref{calc:norm-equivalence}）により、以下の定義はどのノルムで測っても同じである。
- 1 変数の微分 \ref{calc:derivative}、連鎖律 \ref{calc:chain-rule}、平均値の定理 \tref{calc:mean-value-theorem}。
- **極限**：$g$ が $0$ の近く（$0$ を除く）で定義された $\mathbb{R}^{m}$ 値の写像のとき、$\lim_{h\to0}g(h)=L$ は「任意の $\varepsilon>0$ に $\delta>0$ があり、$0<|h|<\delta$ なら $|g(h)-L|<\varepsilon$」の意味。
- **連結**：\ref{top:connected}。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 全微分 {#calc:sec-di-total}

::: definition 全微分 {#calc:total-derivative keywords="differentiable at a point: f(a+h) = f(a) + Ah + o(|h|) with A linear; total derivative Df(a); Frechet derivative" index="全微分|ぜんびぶん, 全微分可能|ぜんびぶんかのう, 微分可能（多変数）|びぶんかのうたへんすう, フレシェ微分|ふれしぇびぶん"}
$a\in U$ とする。$A\in M_{m,n}(\mathbb{R})$ があって
$$
\lim_{h\to0}\frac{|f(a+h)-f(a)-Ah|}{|h|}=0
\label{calc:eq-total-derivative}
$$
となるとき、$f$ は $a$ で**（全）微分可能**であるといい、$A$ を $f$ の $a$ での**（全）微分**と呼んで $Df(a)$ と書く（一意性は次の命題）。$U$ のすべての点で微分可能なとき、$f$ は $U$ で微分可能という。
:::

::: intuition
\eqref{calc:eq-total-derivative} は「$f(a+h)=f(a)+Ah+r(h)$ と書いたとき、誤差 $r(h)$ が $|h|$ よりも速く $0$ に近づく」こと、すなわち $f$ が $a$ の近くで**アフィン写像** $x\mapsto f(a)+A(x-a)$ でよく近似できることを言っている。$n=m=1$ では $A$ は $1\times1$ 行列 $(f'(a))$ で、1 変数の微分可能性と一致する（両辺を $h$ で割った式と同じ）。$h$ は**すべての方向から** $0$ に近づくことに注意する。後で見るように、座標軸の方向だけ、あるいは直線に沿ってだけ近づけても、微分可能性は保証されない。
:::

::: proposition 全微分の基本性質 {#calc:total-derivative-basic keywords="uniqueness of the total derivative; differentiable implies continuous; directional derivatives D_v f(a) = Df(a) v; partial derivatives and the Jacobian matrix; componentwise" index="ヤコビ行列|やこびぎょうれつ, 偏微分係数|へんびぶんけいすう, 方向微分係数|ほうこうびぶんけいすう"}
$f$ が $a$ で微分可能で $A=Df(a)$ とする。
1. （一意性）\eqref{calc:eq-total-derivative} を満たす $A$ はただ一つ。
2. $f$ は $a$ で連続。
3. （方向微分）任意の $v\in\mathbb{R}^{n}$ について、**方向微分係数** $D_{v}f(a)\defeq\lim_{t\to0}\frac{f(a+tv)-f(a)}{t}$ が存在して $D_{v}f(a)=Av$。
4. （ヤコビ行列）とくに**偏微分係数** $\partial_{j}f_{i}(a)\defeq D_{e_{j}}f_{i}(a)$ はすべて存在し、$A$ の $(i,j)$ 成分は $\partial_{j}f_{i}(a)$。すなわち $Df(a)$ は**ヤコビ行列** $\bigl(\partial_{j}f_{i}(a)\bigr)_{i,j}$ である。
5. $f$ が $a$ で微分可能 $\iff$ 各成分 $f_{i}$ が $a$ で微分可能。このとき $Df(a)$ の第 $i$ 行は $Df_{i}(a)$。
:::

::: proof
**Step 1（1）.** $A,B$ がともに \eqref{calc:eq-total-derivative} を満たすとする。$v\in\mathbb{R}^{n}$, $v\neq0$ と $t>0$ について、$h=tv$ とすると、三角不等式から
$$
\frac{|(A-B)tv|}{|tv|}\le\frac{|f(a+tv)-f(a)-Atv|}{|tv|}+\frac{|f(a+tv)-f(a)-Btv|}{|tv|}.
$$
左辺は線形性から $t$ によらず $|(A-B)v|/|v|$ で、右辺は $t\to0$ で $0$ に近づく。よって $(A-B)v=0$。$v$ は任意なので $A=B$。

**Step 2（2）.** $r(h)\defeq f(a+h)-f(a)-Ah$ とおくと、$|f(a+h)-f(a)|\le\|A\||h|+|r(h)|$。仮定から $0<|h|<\delta$ で $|r(h)|\le|h|$ となる $\delta$ があり、そこで $|f(a+h)-f(a)|\le(\|A\|+1)|h|\to0$。

**Step 3（3）.** $v=0$ なら両辺 $0$。$v\neq0$ なら、$t\neq0$ について
$$
\Bigl|\frac{f(a+tv)-f(a)}{t}-Av\Bigr|=\frac{|r(tv)|}{|t|}=\frac{|r(tv)|}{|tv|}\,|v|\to0\quad(t\to0).
$$

**Step 4（4）.** 3 を $v=e_{j}$ に使うと $D_{e_{j}}f(a)=Ae_{j}$ は $A$ の第 $j$ 列。その第 $i$ 成分は $f_{i}$ の方向微分（極限は成分ごとにとれる、\ref{calc:componentwise.1}）すなわち $\partial_{j}f_{i}(a)$。

**Step 5（5）.** $r(h)$ の第 $i$ 成分は $f_{i}(a+h)-f_{i}(a)-A_{i}h$（$A_{i}$ は第 $i$ 行）で、$|r_{i}(h)|\le|r(h)|\le\sum_{i}|r_{i}(h)|$（\ref{calc:norm-comparison}）。よって $|r(h)|/|h|\to0\iff$ 各 $i$ で $|r_{i}(h)|/|h|\to0$。
:::

::: example
1. 定値写像の微分は $0$。線形写像 $f(x)=Bx$ の微分は各点で $B$（$r(h)=0$）。
2. $f(x)=|x|^{2}=\langle x,x\rangle$ は $Df(a)h=2\langle a,h\rangle$：$f(a+h)-f(a)-2\langle a,h\rangle=|h|^{2}$ で、$|h|^{2}/|h|=|h|\to0$。
3. 双線形写像 $\beta\colon\mathbb{R}^{n}\times\mathbb{R}^{k}\to\mathbb{R}^{m}$ は $D\beta(a,b)(h,k)=\beta(a,k)+\beta(h,b)$。誤差は $\beta(h,k)$ で、$|\beta(h,k)|\le C|h||k|\le C|(h,k)|^{2}$（$C$ は成分を係数とする定数）。
:::

## 偏微分可能だが全微分可能でない例 {#calc:sec-di-counterexamples}

::: counterexample 偏微分・方向微分が存在しても微分可能とは限らない {#calc:partials-not-sufficient keywords="xy/(x^2+y^2) has partial derivatives at 0 but is not continuous; x^2 y/(x^4+y^2) has all directional derivatives at 0 but is not continuous" index="偏微分可能だが微分可能でない例|へんびぶんかのうだがびぶんかのうでないれい"}
1. $f(x,y)\defeq\dfrac{xy}{x^{2}+y^{2}}$（$(x,y)\neq0$）、$f(0,0)\defeq0$ は、原点で $\partial_{1}f(0)=\partial_{2}f(0)=0$ だが、原点で連続でない（したがって微分可能でない）。
2. $g(x,y)\defeq\dfrac{x^{2}y}{x^{4}+y^{2}}$（$(x,y)\neq0$）、$g(0,0)\defeq0$ は、原点ですべての方向微分係数が存在するが、$v\mapsto D_{v}g(0)$ は線形でなく、$g$ は原点で連続でない。
:::

::: proof
**Step 1（1 の偏微分）.** $f(t,0)=f(0,t)=0$ なので、座標軸に沿った差分商はすべて $0$。

**Step 2（1 の不連続性）.** 直線 $y=x$ の上で $f(t,t)=\frac{t^{2}}{2t^{2}}=\frac12$（$t\neq0$）なので、$(t,t)\to0$ でも $f\to\frac12\neq0=f(0)$。\ref{calc:total-derivative-basic.2} から微分可能でない。

**Step 3（2 の方向微分）.** $v=(v_{1},v_{2})$, $t\neq0$ について
$$
\frac{g(tv)}{t}=\frac{t^{3}v_{1}^{2}v_{2}}{t(t^{4}v_{1}^{4}+t^{2}v_{2}^{2})}=\frac{v_{1}^{2}v_{2}}{t^{2}v_{1}^{4}+v_{2}^{2}}\quad(v\neq0).
$$
$v_{2}\neq0$ なら $t\to0$ で $v_{1}^{2}/v_{2}$、$v_{2}=0$ なら恒等的に $0$。よって $D_{v}g(0)$ はすべての $v$ で存在する。$D_{(1,1)}g(0)=1$, $D_{(1,0)}g(0)=D_{(0,1)}g(0)=0$ なので $D_{(1,1)}g(0)\neq D_{(1,0)}g(0)+D_{(0,1)}g(0)$ で、線形でない（\ref{calc:total-derivative-basic.3} に反するので、この点でも微分可能でないことが分かる）。

**Step 4（2 の不連続性）.** 放物線 $y=x^{2}$ の上で $g(t,t^{2})=\frac{t^{4}}{2t^{4}}=\frac12$（$t\neq0$）。
:::

::: intuition
直線に沿った情報（方向微分）をすべて集めても、曲線（放物線）に沿った近づき方は捉えられない。全微分可能性の定義 \eqref{calc:eq-total-derivative} が「$h$ がどんな近づき方をしても」誤差が小さいことを要求するのは、このためである。
:::

## 連続な偏導関数と $C^{1}$ 級 {#calc:sec-di-c1}

::: theorem 偏導関数が連続なら微分可能 {#calc:continuous-partials-differentiable keywords="if all partial derivatives exist near a and are continuous at a then f is differentiable at a" index="偏導関数の連続性と微分可能性|へんどうかんすうのれんぞくせいとびぶんかのうせい"}
$a$ のある近傍ですべての偏微分係数 $\partial_{j}f_{i}$ が存在し、それらが $a$ で連続なら、$f$ は $a$ で微分可能である。
:::

::: proof
**Step 1（成分への帰着）.** \ref{calc:total-derivative-basic.5} から $m=1$ としてよい。$\delta>0$ を、開球 $B(a,\delta)\subset U$ の上で偏微分係数がすべて存在するようにとる。$A\defeq(\partial_{1}f(a),\dots,\partial_{n}f(a))$ とおく。

**Step 2（座標ごとに分ける）.** $h=(h_{1},\dots,h_{n})$, $|h|<\delta$ について、$p^{(0)}\defeq a$, $p^{(k)}\defeq a+h_{1}e_{1}+\cdots+h_{k}e_{k}$ とおく。どの $p^{(k)}$ も、$|p^{(k)}-a|\le|h|<\delta$ なので $B(a,\delta)$ に入り、$p^{(k-1)}$ と $p^{(k)}$ を結ぶ線分も入る（球は凸）。
$$
f(a+h)-f(a)=\sum_{k=1}^{n}\bigl(f(p^{(k)})-f(p^{(k-1)})\bigr).
$$

**Step 3（1 変数の平均値の定理）.** $\varphi_{k}(s)\defeq f(p^{(k-1)}+se_{k})$（$s$ は $0$ と $h_{k}$ の間）は 1 変数の関数で、偏微分係数の存在から微分可能、$\varphi_{k}'(s)=\partial_{k}f(p^{(k-1)}+se_{k})$（とくに連続）。$h_{k}\neq0$ なら\ref{calc:mean-value-theorem.3}から、$0$ と $h_{k}$ の間の $s_{k}$ で
$$
f(p^{(k)})-f(p^{(k-1)})=\varphi_{k}(h_{k})-\varphi_{k}(0)=\partial_{k}f(q^{(k)})\,h_{k},\qquad q^{(k)}\defeq p^{(k-1)}+s_{k}e_{k}.
$$
$h_{k}=0$ なら左辺は $0$ で、$q^{(k)}\defeq p^{(k-1)}$ とすれば同じ式が成り立つ。$|q^{(k)}-a|\le|h|$。

**Step 4（評価）.** Step 2・3 から
$$
\bigl|f(a+h)-f(a)-Ah\bigr|=\Bigl|\sum_{k}\bigl(\partial_{k}f(q^{(k)})-\partial_{k}f(a)\bigr)h_{k}\Bigr|\le\sum_{k}\bigl|\partial_{k}f(q^{(k)})-\partial_{k}f(a)\bigr|\,|h|.
$$
$\varepsilon>0$ に対し、偏導関数の $a$ での連続性から、$|q-a|<\delta'$ ならすべての $k$ で $|\partial_{k}f(q)-\partial_{k}f(a)|<\varepsilon/n$ となる $\delta'\le\delta$ がとれる（有限個の $k$ について最小をとる）。$0<|h|<\delta'$ なら右辺は $\varepsilon|h|$ 未満。

::: hypcheck
- **偏導関数の連続性**：Step 4 で、$q^{(k)}$ での値を $a$ での値で置き換えるのに使った。$a$ での連続性だけで十分で、近傍での存在は Step 3 の平均値の定理に使った。外すと偽：\ref{calc:partials-not-sufficient.1} の $f$ は原点の近傍で偏導関数が存在するが、それは原点で連続でない（たとえば $\partial_{1}f(0,y)=1/y$, $y\neq0$）。
- 連続性は十分条件にすぎない：$f(x)=|x|^{2}\sin(1/|x|)$（$x\neq0$）, $f(0)=0$ は原点で微分可能（$Df(0)=0$、$|f(h)|\le|h|^{2}$）だが、偏導関数は原点で連続でない（1 変数の $x^{2}\sin(1/x)$ と同じ現象）。
- 実は「1 つを除くすべての偏導関数が $a$ で連続で、残りの 1 つが $a$ で存在する」でも結論が成り立つ（Step 3 で最初の $k=1$ だけは平均値の定理の代わりに偏微分の定義を使う）。
:::
:::

::: definition $C^{1}$ 級 {#calc:c1-map keywords="continuously differentiable map: all partial derivatives exist and are continuous; equivalently differentiable with continuous Df" index="C1 級|しーわんきゅう, 連続微分可能|れんぞくびぶんかのう"}
$f\colon U\to\mathbb{R}^{m}$ のすべての偏導関数 $\partial_{j}f_{i}$ が $U$ 上で存在して連続なとき、$f$ は $U$ で **$C^{1}$ 級**であるという。
:::

::: proposition $C^{1}$ 級の言い換え {#calc:c1-equivalent keywords="f is C^1 iff f is differentiable on U and Df: U -> M_{m,n} is continuous" index="C1 級の言い換え|しーわんきゅうのいいかえ"}
$f$ が $U$ で $C^{1}$ 級であるための必要十分条件は、$f$ が $U$ で微分可能で、$Df\colon U\to M_{m,n}(\mathbb{R})$ が（作用素ノルムについて）連続であることである。
:::

::: proof
(⇒) \ref{calc:continuous-partials-differentiable} から各点で微分可能で、$Df(x)$ の成分は $\partial_{j}f_{i}(x)$（\ref{calc:total-derivative-basic.4}）。成分がすべて連続なので、作用素ノルムで連続（\ref{calc:operator-norm-properties.5} の、成分の収束と作用素ノルムの収束の同値性）。(⇐) 微分可能なら偏導関数は存在して $Df$ の成分に等しく、$\|Df(x)-Df(y)\|\ge|\partial_{j}f_{i}(x)-\partial_{j}f_{i}(y)|$（\ref{calc:operator-norm-properties.1}）から連続。
:::

## 微分の計算規則と連鎖律 {#calc:sec-di-chain}

::: theorem 連鎖律 {#calc:multivariable-chain-rule keywords="chain rule D(g o f)(a) = Dg(f(a)) Df(a); Jacobian matrices multiply; linearity of D" index="連鎖律（多変数）|れんさりつたへんすう, 合成写像の微分|ごうせいしゃぞうのびぶん"}
1. （線形性）$f,g\colon U\to\mathbb{R}^{m}$ が $a$ で微分可能なら、$\lambda f+\mu g$ も微分可能で $D(\lambda f+\mu g)(a)=\lambda Df(a)+\mu Dg(a)$。
2. （連鎖律）$f\colon U\to\mathbb{R}^{m}$ が $a$ で微分可能、$V\subset\mathbb{R}^{m}$ が開で $f(U)\subset V$、$g\colon V\to\mathbb{R}^{l}$ が $b\defeq f(a)$ で微分可能なら、$g\circ f$ は $a$ で微分可能で
$$
D(g\circ f)(a)=Dg(f(a))\,Df(a).
$$
成分で書くと $\displaystyle\partial_{j}(g\circ f)_{k}(a)=\sum_{i=1}^{m}\partial_{i}g_{k}(b)\,\partial_{j}f_{i}(a)$。
3. （積）$f,g\colon U\to\mathbb{R}$ が $a$ で微分可能なら、$fg$ も微分可能で $D(fg)(a)=f(a)Dg(a)+g(a)Df(a)$。
:::

::: proof
**Step 1（1）.** 誤差は $\lambda r_{f}(h)+\mu r_{g}(h)$ で、三角不等式から $|h|$ で割って $0$ に近づく。

**Step 2（2 の誤差の分解）.** $A\defeq Df(a)$, $B\defeq Dg(b)$ とし、
$$
f(a+h)=b+Ah+r(h),\qquad g(b+k)=g(b)+Bk+s(k)
$$
とおく（$r(h)/|h|\to0$, $s(k)/|k|\to0$）。$k(h)\defeq f(a+h)-b=Ah+r(h)$ とおくと
$$
g(f(a+h))-g(b)-BAh=Br(h)+s(k(h)).
$$

**Step 3（第 1 項）.** $|Br(h)|/|h|\le\|B\||r(h)|/|h|\to0$（\ref{calc:operator-norm-properties.2}）。

**Step 4（第 2 項）.** $\varepsilon>0$ をとる。$s$ についての仮定から、$|k|<\eta$ なら $|s(k)|\le\varepsilon|k|$ となる $\eta>0$ がある（$k=0$ でも $s(0)=0$ なので成り立つ）。$r$ についての仮定から、$0<|h|<\delta$ なら $|r(h)|\le|h|$ で、そこで $|k(h)|\le(\|A\|+1)|h|$。$\delta$ を小さくとって $(\|A\|+1)\delta<\eta$ とすると、$0<|h|<\delta$ で
$$
\frac{|s(k(h))|}{|h|}\le\varepsilon\frac{|k(h)|}{|h|}\le\varepsilon(\|A\|+1).
$$
$\varepsilon$ は任意なので第 2 項も $|h|$ で割って $0$ に近づく。成分の式は行列の積の成分。

**Step 5（3）.** $\beta(u,v)\defeq uv$ は $\mathbb{R}\times\mathbb{R}$ 上の双線形写像で $D\beta(u,v)(h,k)=uk+hv$（例 3）。$F\defeq(f,g)\colon U\to\mathbb{R}^{2}$ は 5 から $a$ で微分可能で $DF(a)h=(Df(a)h,Dg(a)h)$。$fg=\beta\circ F$ に 2 を使う。

::: hypcheck
- **$f$ の微分可能性**：Step 3・4 で $r(h)/|h|\to0$ を使った。$f$ の連続性（$k(h)\to0$）もここから出る。
- **$g$ の $b$ での微分可能性**：Step 4 で、$s(k)=o(|k|)$ を $k=k(h)$ に代入した。$k(h)=0$ となる $h$ があっても $s(0)=0$ なので問題ない（1 変数の連鎖律の証明で注意が要る点）。外すと偽：$g$ が偏微分可能なだけなら、$g\circ f$ の偏微分の式は一般に成り立たない。$g$ を \ref{calc:partials-not-sufficient.1} の $f$、$f(t)=(t,t)$ とすると $g(f(t))=\frac12$（$t\neq0$）, $0$（$t=0$）で、$t=0$ で微分可能でもない。
:::
:::

::: example
1. **曲線に沿った微分**：$\gamma\colon(\alpha,\beta)\to U$ が微分可能、$f\colon U\to\mathbb{R}$ が微分可能なら $(f\circ\gamma)'(t)=\sum_{i}\partial_{i}f(\gamma(t))\gamma_{i}'(t)$。
2. **極座標**：$F(r,\theta)=(r\cos\theta,r\sin\theta)$ のヤコビ行列は $\begin{pmatrix}\cos\theta&-r\sin\theta\\\sin\theta&r\cos\theta\end{pmatrix}$ で、$\det DF=r$。$f\circ F$ の偏微分は $\partial_{r}(f\circ F)=\cos\theta\,\partial_{1}f+\sin\theta\,\partial_{2}f$ など。
:::

::: definition 勾配 {#calc:gradient keywords="gradient vector of a differentiable function, Df(a)h = <grad f(a), h>, direction of steepest ascent" index="勾配|こうばい, グラディエント|ぐらでぃえんと"}
$f\colon U\to\mathbb{R}$ が $a$ で微分可能なとき、$\nabla f(a)\defeq(\partial_{1}f(a),\dots,\partial_{n}f(a))\in\mathbb{R}^{n}$ を $f$ の $a$ での**勾配**という。$Df(a)h=\langle\nabla f(a),h\rangle$。
:::

::: proposition 最急上昇方向 {#calc:steepest-ascent keywords="among unit vectors v, the directional derivative D_v f(a) is maximized by v = grad f / |grad f|" index="最急上昇方向|さいきゅうじょうしょうほうこう"}
$f$ が $a$ で微分可能で $\nabla f(a)\neq0$ なら、単位ベクトル $v$ の中で $D_{v}f(a)$ が最大になるのは $v=\nabla f(a)/|\nabla f(a)|$ のときに限り、最大値は $|\nabla f(a)|$。
:::

::: proof
$D_{v}f(a)=\langle\nabla f(a),v\rangle\le|\nabla f(a)||v|=|\nabla f(a)|$（コーシー–シュワルツ、\tref{lin:cauchy-schwarz}）。等号は $v$ が $\nabla f(a)$ の正の実数倍のとき（コーシー–シュワルツの等号条件と、内積が正であること）、$|v|=1$ からそのときに限る。
:::

## 平均値の不等式 {#calc:sec-di-mvt}

::: theorem 平均値の不等式 {#calc:mean-value-inequality keywords="mean value inequality |f(b) - f(a)| <= sup ||Df|| |b - a| on a segment; failure of the mean value equality for vector-valued maps" index="平均値の不等式|へいきんちのふとうしき" refname="平均値の不等式"}
$f\colon U\to\mathbb{R}^{m}$ が $U$ で微分可能で、$a,b\in U$ を結ぶ線分 $[a,b]\defeq\{a+t(b-a):0\le t\le1\}$ が $U$ に含まれ、$\sup_{x\in[a,b]}\|Df(x)\|\le M<\infty$ なら
$$
|f(b)-f(a)|\le M|b-a|.
$$
:::

::: intuition
1 変数の平均値の定理 $f(b)-f(a)=f'(\xi)(b-a)$ は、$\mathbb{R}^{m}$ 値（$m\ge2$）では一般に成り立たない（下の例）。しかし「ずれの方向」を 1 つ固定し、その方向の成分だけを見れば実数値関数になるので、1 変数の平均値の定理が使える。こうして得られるのが不等式の形である。
:::

::: proof
**Step 1.** $f(b)=f(a)$ なら明らか。そうでなければ $u\defeq\frac{f(b)-f(a)}{|f(b)-f(a)|}$（単位ベクトル）とし、$\varphi(t)\defeq\langle u,f(a+t(b-a))\rangle$ とおく。$U$ は開で $[a,b]\subset U$ なので、$t$ は $[0,1]$ を含む開区間を動ける。

**Step 2（微分）.** 連鎖律（\ref{calc:multivariable-chain-rule.2}）を、$t\mapsto a+t(b-a)$（微分は $b-a$）、$f$、線形写像 $y\mapsto\langle u,y\rangle$ の合成に使うと、$\varphi$ は微分可能で $\varphi'(t)=\langle u,Df(a+t(b-a))(b-a)\rangle$。

**Step 3.** 1 変数の\ref{calc:mean-value-theorem.3}から、ある $\tau\in(0,1)$ で
$$
\begin{aligned}
|f(b)-f(a)|&=\langle u,f(b)-f(a)\rangle=\varphi(1)-\varphi(0)=\varphi'(\tau)\\
&\le|u|\,\|Df(a+\tau(b-a))\|\,|b-a|\le M|b-a|
\end{aligned}
$$
（コーシー–シュワルツと \ref{calc:operator-norm-properties.2}）。

::: hypcheck
- **線分が $U$ に含まれる**：Step 1・2 で、$\varphi$ が定義されて微分可能であることに使った。外すと偽：$U=\mathbb{R}^{2}\setminus\{(x,0):x\le0\}$ 上の偏角関数 $\theta\in(-\pi,\pi)$ は $\|D\theta(x)\|=1/|x|$ で、$a=(-1,\varepsilon)$, $b=(-1,-\varepsilon)$ では $|b-a|=2\varepsilon$ だが $|\theta(b)-\theta(a)|\to2\pi$（$\varepsilon\to0$）。
- 等式の形は成り立たない：$f(t)=(\cos t,\sin t)$ を $[0,2\pi]$ で考えると $f(2\pi)-f(0)=0$ だが、$|f'(t)|=1$ なので $f(2\pi)-f(0)=f'(\xi)\cdot2\pi$ となる $\xi$ はない。
:::
:::

::: corollary 微分が 0 なら定数 {#calc:zero-derivative-constant keywords="on a connected open set, Df = 0 implies f is constant" index="微分が 0 なら定数|びぶんがぜろならていすう"}
$U$ が連結な開集合で、$U$ のすべての点で $Df=0$ なら、$f$ は定数である。
:::

::: proof
$U=\varnothing$ なら明らか。$a\in U$ を固定し $E\defeq\{x\in U:f(x)=f(a)\}$ とおく。$E\neq\varnothing$。$E$ は $U$ の中で閉（$f$ は連続、\ref{calc:total-derivative-basic.2}）。$E$ は開：$x\in E$ と、$B(x,r)\subset U$ となる $r$ について、$y\in B(x,r)$ なら線分 $[x,y]\subset B(x,r)$（球は凸）で、平均値の不等式（$M=0$）から $f(y)=f(x)=f(a)$。$U$ は連結なので $E=U$（\ref{top:connected}）。
:::

::: supplement
**一般化.** 全微分の定義 \eqref{calc:eq-total-derivative} は、$\mathbb{R}^{n}$, $\mathbb{R}^{m}$ をノルム空間に、行列を有界線形作用素に置き換えてそのまま意味をもつ（**フレシェ微分**）。連鎖律と平均値の不等式の証明もそのまま通る。方向微分がすべて存在して線形・有界なものは**ガトー微分**と呼ばれ、\ref{calc:partials-not-sufficient} はガトー微分可能性が線形性すら保証しないことの、2 変数での例になっている。

**前提を変えると.** 連鎖律は「$g$ が $f(a)$ で微分可能」を外すと成り立たない（hypcheck）。一方 \ref{calc:continuous-partials-differentiable} の連続性の仮定は弱められる（hypcheck の 3 つ目）。

**高い視点.** 連鎖律 $D(g\circ f)(a)=Dg(f(a))Df(a)$ は、「点 $a$ とそこでの線形近似」をまとめた対応 $(f,a)\mapsto Df(a)$ が、**合成を行列の積に移す関手**であることを言っている（基点付きの開集合と、基点を保つ微分可能写像のなす圏から、有限次元ベクトル空間と線形写像の圏への関手）。微分とは非線形な写像を各点で線形代数に「翻訳」する操作で、連鎖律はその翻訳が合成と整合することの保証である。多様体論では、この関手を接空間と接写像として座標によらずに定式化する。比喩で言えば、全微分は「その点を十分拡大すると写像が線形写像に見える」という虫眼鏡で、連鎖律は「2 つの写像を続けて使ったものを虫眼鏡で見ると、それぞれを虫眼鏡で見たものの合成になる」ということである。
:::

## 問題 {#calc:sec-di-problems}

::: problem {#calc:prob-di-norm-not-differentiable}
$f(x)=|x|$（ユークリッドノルム）は $x\neq0$ で微分可能で $Df(x)h=\langle x,h\rangle/|x|$ であること、$x=0$ では微分可能でないことを示せ。
:::

::: solution
$x\neq0$ の近くで $|x|=\sqrt{\langle x,x\rangle}$ は、例 2 の $|x|^{2}$ と $(0,\infty)$ 上の $\sqrt{\cdot}$ の合成なので、連鎖律から $Df(x)h=\frac{1}{2|x|}\cdot2\langle x,h\rangle$。$x=0$：微分可能なら $D_{v}f(0)=Av$ は $v$ について線形だが、$D_{e_{1}}f(0)=\lim_{t\to0}|t|/t$ は存在しない（$t\to\pm0$ で $\pm1$）。
:::

::: problem {#calc:prob-di-homogeneous}
$f\colon\mathbb{R}^{n}\setminus\{0\}\to\mathbb{R}$ が微分可能で、ある $k\in\mathbb{R}$ について $f(tx)=t^{k}f(x)$（$t>0$）を満たすなら、$\langle\nabla f(x),x\rangle=kf(x)$（オイラーの恒等式）を示せ。
:::

::: solution
$x$ を固定し $\varphi(t)\defeq f(tx)=t^{k}f(x)$ を $t>0$ で微分する。連鎖律から $\varphi'(t)=\langle\nabla f(tx),x\rangle$、右辺から $\varphi'(t)=kt^{k-1}f(x)$。$t=1$ とおく。
:::

::: problem {#calc:prob-di-lipschitz-convex}
$U$ が凸な開集合で、$f\colon U\to\mathbb{R}^{m}$ が微分可能、$\sup_{U}\|Df\|=M<\infty$ なら、$f$ は $U$ 上で定数 $M$ のリプシッツ連続であることを示せ。凸性を外すとどうなるか。
:::

::: solution
凸なら任意の $a,b$ を結ぶ線分が $U$ に入るので、平均値の不等式から $|f(b)-f(a)|\le M|b-a|$。凸性を外すと偽：\ref{calc:mean-value-inequality} の hypcheck の偏角関数 $\theta$ を $U\cap\{|x|>1\}$ に制限すると $\|D\theta\|\le1$ だが、切れ目をはさむ 2 点で $|\theta(b)-\theta(a)|$ は $2\pi$ 近くになり、$|b-a|$ はいくらでも小さくとれる。
:::
