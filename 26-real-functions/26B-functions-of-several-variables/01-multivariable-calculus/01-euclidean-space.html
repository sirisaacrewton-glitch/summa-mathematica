# ユークリッド空間 {#calc:page-euclidean-space keywords="Euclidean space R^n, norm, Euclidean norm, sup norm, l1 norm, equivalence of norms, convergence and continuity in R^n, operator norm, invertible matrices form an open set, Neumann series"}

多変数の微分積分の舞台は $\mathbb{R}^{n}$ である。1 変数では絶対値 $|x|$ で「近さ」を測ったが、$\mathbb{R}^{n}$ では長さの測り方（**ノルム**）がたくさんある。このページの主結果は、**$\mathbb{R}^{n}$ のノルムはすべて同値**で、収束・連続性・完備性・コンパクト性はどのノルムで測っても同じになる、ということである。後半では、微分の定義に使う線形写像の大きさ（**作用素ノルム**）を導入し、可逆な行列の全体が開集合で、逆行列をとる操作が連続であることを示す。後者は逆関数定理（\ref[逆関数定理と陰関数定理]{calc:page-inverse-implicit}）で使う。

> 資料：Rudin『Principles of Mathematical Analysis』第 9 章、杉浦光夫『解析入門 I』第 I 章・第 II 章の該当部分と同じ標準的な内容。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-eu-notation}

::: notation
- $\mathbb{R}^{n}$ の元を $x=(x_{1},\dots,x_{n})$ と書き、標準基底を $e_{1},\dots,e_{n}$ とする。標準内積 $\langle x,y\rangle=\sum_{i}x_{i}y_{i}$ とコーシー–シュワルツの不等式 $|\langle x,y\rangle|\le|x||y|$（\ref{lin:cauchy-schwarz}）。
- 一般位相・距離空間の結果：ハイネ–ボレル（\ref{top:heine-borel}：$\mathbb{R}^{n}$ の部分集合がコンパクト $\iff$ 有界閉）、ボルツァーノ–ワイエルシュトラス（\tref{top:bolzano-weierstrass}）、$\mathbb{R}^{n}$ の完備性（\ref{top:reals-complete}）、完備空間の閉集合は完備（\ref{top:complete-closed}）、最大値・最小値の定理（\tref{top:extreme-value}）、コンパクト距離空間上の連続写像は一様連続（ハイネ–カントール、\tref{top:heine-cantor}）。これらは $\mathbb{R}^{n}$ にユークリッド距離を入れたものについての主張である。
- $m\times n$ 実行列の全体を $M_{m,n}(\mathbb{R})$、$n$ 次正方行列の全体を $M_{n}(\mathbb{R})$ と書き、行列 $A$ と線形写像 $x\mapsto Ax$ を同一視する（\ref{lin:matrix-of-map}）。行列式 \ref{lin:leibniz-formula}、余因子行列 \ref{lin:adjugate}。
- **体系**：$\mathsf{ZF}$ で行う。このページでは選択公理を使わない。
:::

## ノルム {#calc:sec-eu-norms}

::: definition ノルム {#calc:norm keywords="norm on a real vector space, normed space, Euclidean norm, sup norm, l1 norm" index="ノルム|のるむ, ユークリッドノルム|ゆーくりっどのるむ, 最大値ノルム|さいだいちのるむ, ノルム空間|のるむくうかん"}
実ベクトル空間 $V$ 上の関数 $N\colon V\to\mathbb{R}$ が次を満たすとき**ノルム**といい、$(V,N)$ を**ノルム空間**という。
1. $N(x)\ge0$ で、$N(x)=0\iff x=0$。
2. $N(\lambda x)=|\lambda|N(x)$（$\lambda\in\mathbb{R}$）。
3. （**三角不等式**）$N(x+y)\le N(x)+N(y)$。

ノルム $N$ は距離 $d_{N}(x,y)\defeq N(x-y)$ を定める。$\mathbb{R}^{n}$ の代表的なノルムは
$$
|x|\defeq\Bigl(\sum_{i}x_{i}^{2}\Bigr)^{1/2},\qquad |x|_{1}\defeq\sum_{i}|x_{i}|,\qquad |x|_{\infty}\defeq\max_{i}|x_{i}|
$$
（それぞれ**ユークリッドノルム**、$\ell^{1}$ ノルム、**最大値ノルム**）。特に断らなければ $\mathbb{R}^{n}$ の距離・位相はユークリッドノルムで考える。
:::

::: intuition
ノルムは「原点からの長さ」の公理化である。1 と 2 は長さの基本的な性質、3 は「寄り道すると遠くなる」こと。ユークリッドノルムは三平方の定理による長さ、$|x|_{1}$ は碁盤の目の街を縦横にしか進めないときの道のり、$|x|_{\infty}$ は各座標のずれの最大値で、単位球はそれぞれ球・正軸体（$n=2$ では菱形）・立方体になる。
:::

::: lemma 3 つのノルムの比較 {#calc:norm-comparison keywords="|x|_inf <= |x| <= |x|_1 <= sqrt(n)|x| <= n |x|_inf" index="ノルムの比較|のるむのひかく"}
$|x|$, $|x|_{1}$, $|x|_{\infty}$ はノルムで、すべての $x\in\mathbb{R}^{n}$ について
$$
|x|_{\infty}\le|x|\le|x|_{1}\le\sqrt{n}\,|x|\le n|x|_{\infty}.
$$
:::

::: proof
**Step 1（ノルムであること）.** 1・2 はどれも定義から明らか（$|x|=0$ ならすべての $x_{i}^{2}=0$）。三角不等式：$|x|_{1}$, $|x|_{\infty}$ は各座標の $|x_{i}+y_{i}|\le|x_{i}|+|y_{i}|$ を足す・最大をとる。$|x|$ は、コーシー–シュワルツから $|x+y|^{2}=|x|^{2}+2\langle x,y\rangle+|y|^{2}\le(|x|+|y|)^{2}$。

**Step 2（不等式）.** $|x_{j}|^{2}\le\sum_{i}x_{i}^{2}$ から $|x|_{\infty}\le|x|$。$|x|_{1}^{2}=\sum_{i,j}|x_{i}||x_{j}|\ge\sum_{i}x_{i}^{2}$ から $|x|\le|x|_{1}$。コーシー–シュワルツを $(|x_{1}|,\dots,|x_{n}|)$ と $(1,\dots,1)$ に使うと $|x|_{1}\le\sqrt{n}|x|$。最後に $|x|^{2}\le n|x|_{\infty}^{2}$ から $\sqrt{n}|x|\le n|x|_{\infty}$。
:::

::: definition ノルムの同値 {#calc:norm-equivalent keywords="equivalent norms: c N(x) <= N'(x) <= C N(x)" index="ノルムの同値|のるむのどうち"}
$V$ 上の 2 つのノルム $N,N'$ が**同値**であるとは、定数 $c,C>0$ があってすべての $x$ で $cN(x)\le N'(x)\le CN(x)$ となることをいう（これは同値関係）。
:::

::: theorem $\mathbb{R}^{n}$ のノルムの同値性 {#calc:norm-equivalence keywords="all norms on R^n are equivalent" index="ノルムの同値性|のるむのどうちせい"}
$\mathbb{R}^{n}$ 上の任意のノルム $N$ はユークリッドノルムと同値である。したがって $\mathbb{R}^{n}$ 上の任意の 2 つのノルムは同値である。
:::

::: intuition
上からの評価 $N(x)\le C|x|$ は三角不等式だけで出る（基底の長さの最大値を使う）。難しいのは下からの評価で、これは「単位球面の上で $N$ が $0$ に近い値をとらない」ことを言っている。$N$ は単位球面上で $0$ にならないので、球面がコンパクトなら最小値は正である。有限次元であることは、このコンパクト性（ハイネ–ボレル）を通じて使われる。
:::

::: proof
**Step 1（上からの評価）.** $M\defeq\max_{i}N(e_{i})$ とおく。$x=\sum_{i}x_{i}e_{i}$ に三角不等式と 2 を使い、\ref{calc:norm-comparison} から
$$
N(x)\le\sum_{i}|x_{i}|N(e_{i})\le M|x|_{1}\le M\sqrt{n}\,|x|.
$$
$C\defeq M\sqrt{n}$ とおく（$n\ge1$ なら $M>0$）。

**Step 2（$N$ の連続性）.** 三角不等式から $N(x)\le N(x-y)+N(y)$、$N(y)\le N(y-x)+N(x)$ なので $|N(x)-N(y)|\le N(x-y)\le C|x-y|$。よって $N\colon(\mathbb{R}^{n},|\cdot|)\to\mathbb{R}$ はリプシッツ連続。

**Step 3（下からの評価）.** 単位球面 $S\defeq\{x:|x|=1\}$ は有界で、連続関数 $|\cdot|$ による閉集合 $\{1\}$ の逆像なので閉。ハイネ–ボレル（\ref{top:heine-borel}）からコンパクトで、空でない（$e_{1}\in S$）。最大値・最小値の定理（\tref{top:extreme-value}）から、$N$ は $S$ 上で最小値 $c=N(x_{0})$（$x_{0}\in S$）をとる。$x_{0}\neq0$ なので 1 から $c>0$。$x\neq0$ なら $x/|x|\in S$ なので、2 から $N(x)=|x|N(x/|x|)\ge c|x|$。$x=0$ でも成り立つ。

**Step 4.** ノルムの同値は同値関係（推移律：$c_{1}N\le N'\le C_{1}N$, $c_{2}N'\le N''\le C_{2}N'$ なら $c_{1}c_{2}N\le N''\le C_{1}C_{2}N$。対称律：$cN\le N'\le CN$ なら $C^{-1}N'\le N\le c^{-1}N'$）なので、任意の 2 つのノルムはユークリッドノルムを経由して同値。

::: hypcheck
- **有限次元**：Step 3 のハイネ–ボレル（単位球面のコンパクト性）で本質的に使った。外すと偽：有限個の項を除いて $0$ の実数列の空間 $c_{00}$ で、$|x|_{1}$ と $|x|_{\infty}$ は同値でない。$x^{(k)}=e_{1}+\cdots+e_{k}$ について $|x^{(k)}|_{\infty}=1$, $|x^{(k)}|_{1}=k$ で、$|x|_{1}\le C|x|_{\infty}$ となる $C$ はない。
- **三角不等式**：Step 1・2 で使った。
- 選択公理は使わない（ハイネ–ボレルと最大値の定理は $\mathsf{ZF}$ で成り立つ）。
:::
:::

::: corollary ノルムによらない性質 {#calc:norm-independent-notions keywords="convergence, open sets, Cauchy sequences, completeness, boundedness and compactness in R^n do not depend on the norm" index="ノルムによらない性質|のるむによらないせいしつ"}
$\mathbb{R}^{n}$ の任意のノルム $N$ について、次はユークリッドノルムの場合と同じである：点列の収束とその極限、コーシー列、開集合・閉集合、有界集合、コンパクト集合。とくに $(\mathbb{R}^{n},d_{N})$ は完備で、有界閉集合はコンパクトである。
:::

::: proof
$c|x|\le N(x)\le C|x|$ とする。$N(x_{k}-x)\to0\iff|x_{k}-x|\to0$（$|x_{k}-x|\le c^{-1}N(x_{k}-x)$ と $N(x_{k}-x)\le C|x_{k}-x|$）。コーシー列と有界性も同様。開集合：$N$ の開球 $\{N(y-x)<r\}$ はユークリッドの開球 $\{|y-x|<r/C\}$ を含み、ユークリッドの開球 $\{|y-x|<r\}$ は $N$ の開球 $\{N(y-x)<cr\}$ を含むので、2 つの距離の開集合は一致する（開集合の定義は「各点を中心とする小さい開球を含む」）。コンパクト性は開集合だけで決まる。完備性とハイネ–ボレルは、ユークリッドノルムでの結果（\ref{top:reals-complete}, \ref{top:heine-borel}）から。
:::

## 点列と連続写像 {#calc:sec-eu-continuity}

::: proposition 成分ごとの収束と連続性 {#calc:componentwise keywords="a sequence in R^n converges iff each coordinate converges; a map into R^m is continuous iff its components are continuous; sums, products and quotients of continuous functions" index="成分ごとの収束|せいぶんごとのしゅうそく"}
1. $\mathbb{R}^{n}$ の点列 $x^{(k)}$ が $x$ に収束する $\iff$ 各 $i$ で $x^{(k)}_{i}\to x_{i}$。
2. $D\subset\mathbb{R}^{n}$ 上の写像 $f=(f_{1},\dots,f_{m})\colon D\to\mathbb{R}^{m}$ が点 $a$ で連続 $\iff$ 各 $f_{j}$ が $a$ で連続。
3. $D$ 上の実数値関数 $f,g$ が $a$ で連続なら $f+g$, $fg$, $f/g$（$g(a)\neq0$ のとき、$g\neq0$ となる $a$ の近くで）も $a$ で連続。とくに多項式関数は連続。
:::

::: proof
**Step 1（1）.** \ref{calc:norm-independent-notions} から最大値ノルムで考えてよい。$|x^{(k)}-x|_{\infty}\to0\iff$ 各 $i$ で $|x^{(k)}_{i}-x_{i}|\to0$：(⇒) は $|x^{(k)}_{i}-x_{i}|\le|x^{(k)}-x|_{\infty}$。(⇐) は、$\varepsilon>0$ について各 $i$ で $k\ge K_{i}$ なら $|x^{(k)}_{i}-x_{i}|<\varepsilon$ となる $K_{i}$ をとり、$K\defeq\max_{i}K_{i}$（有限個の最大）とすればよい。

**Step 2（2）.** 距離空間の写像の連続性は点列で判定できる（$a$ に収束する任意の点列 $x^{(k)}$ で $f(x^{(k)})\to f(a)$）。1 から、これは各成分で $f_{j}(x^{(k)})\to f_{j}(a)$ と同値。

**Step 3（3）.** 点列で判定し、数列の極限の性質（\ref{calc:limit-laws}）を使う。座標関数 $x\mapsto x_{i}$ は $|x_{i}-y_{i}|\le|x-y|$ から連続で、多項式はその和と積。

::: hypcheck
- 点列による連続性の判定は距離空間（第一可算）で成り立つ。$\mathsf{ZF}$ では、点列連続 ⇒ 連続 の向きに可算選択が要ることが知られているが、ここでは (⇒) と (⇐) の両方を $\varepsilon$–$\delta$ で直接示すこともできる：$|f(x)-f(a)|_{\infty}=\max_{j}|f_{j}(x)-f_{j}(a)|$ なので、各 $j$ の $\delta_{j}$ の最小をとればよい。このページの主張はこの形で選択公理なしに成り立つ。
:::
:::

::: remark
コンパクト集合上の連続写像は一様連続（\ref{top:heine-cantor}）で、最大値・最小値をとる（\tref{top:extreme-value}）。どちらも \ref{calc:norm-independent-notions} により、どのノルムで測っても成り立つ。
:::

## 線形写像と作用素ノルム {#calc:sec-eu-operator-norm}

::: definition 作用素ノルム {#calc:operator-norm keywords="operator norm of a linear map ||A|| = sup_{|x| <= 1} |Ax|" index="作用素ノルム|さようそのるむ"}
$A\in M_{m,n}(\mathbb{R})$ について
$$
\|A\|\defeq\sup\{|Ax|:x\in\mathbb{R}^{n},\ |x|\le1\}
$$
を $A$ の**作用素ノルム**という（右辺が有限であることは次の命題で示す）。
:::

::: proposition 作用素ノルムの性質 {#calc:operator-norm-properties keywords="||A|| is finite, |Ax| <= ||A|| |x|, it is a norm, submultiplicative, max |a_ij| <= ||A|| <= Frobenius norm, linear maps are Lipschitz" index="作用素ノルムの性質|さようそのるむのせいしつ"}
$A=(a_{ij})\in M_{m,n}(\mathbb{R})$、$B\in M_{l,m}(\mathbb{R})$ とする。
1. $\displaystyle\max_{i,j}|a_{ij}|\le\|A\|\le\Bigl(\sum_{i,j}a_{ij}^{2}\Bigr)^{1/2}$。とくに $\|A\|<\infty$。
2. すべての $x$ で $|Ax|\le\|A\||x|$。したがって $|Ax-Ay|\le\|A\||x-y|$ で、線形写像はリプシッツ連続。
3. $\|\cdot\|$ は $M_{m,n}(\mathbb{R})$ 上のノルム。
4. $\|BA\|\le\|B\|\|A\|$。また $\|I_{n}\|=1$（$n\ge1$）。
5. 行列の列 $A_{k}$ について、$\|A_{k}-A\|\to0\iff$ 各成分が収束する。$(M_{m,n}(\mathbb{R}),\|\cdot\|)$ は完備。
:::

::: proof
**Step 1（1）.** $Ax$ の第 $i$ 成分は $\sum_{j}a_{ij}x_{j}$ で、コーシー–シュワルツから $|\sum_{j}a_{ij}x_{j}|^{2}\le(\sum_{j}a_{ij}^{2})|x|^{2}$。$i$ について足すと $|Ax|^{2}\le(\sum_{i,j}a_{ij}^{2})|x|^{2}$。$|x|\le1$ で上限をとって右の不等式。左：$x=e_{j}$ とすると $|Ae_{j}|\ge|a_{ij}|$ なので $\|A\|\ge|a_{ij}|$。

**Step 2（2）.** $x=0$ なら明らか。$x\neq0$ なら $|x/|x||=1$ なので $|A(x/|x|)|\le\|A\|$、両辺に $|x|$ を掛ける。後半は $A(x-y)=Ax-Ay$。

**Step 3（3）.** $\|A\|=0$ なら 1 の左の不等式からすべての $a_{ij}=0$。$\|\lambda A\|=|\lambda|\|A\|$ は上限の性質から。$|(A+A')x|\le|Ax|+|A'x|\le\|A\|+\|A'\|$（$|x|\le1$）で上限をとる。

**Step 4（4）.** 2 を 2 回使うと $|BAx|\le\|B\||Ax|\le\|B\|\|A\||x|$。$|x|\le1$ で上限をとる。$\|I\|=\sup_{|x|\le1}|x|=1$。

**Step 5（5）.** $M_{m,n}(\mathbb{R})$ は成分によって $\mathbb{R}^{mn}$ と同一視され、$\|\cdot\|$ はその上のノルムなので、\ref{calc:norm-independent-notions} と \ref{calc:componentwise.1} から従う。
:::

::: example
1. 対角行列 $\operatorname{diag}(d_{1},\dots,d_{n})$ の作用素ノルムは $\max_{i}|d_{i}|$（$|Dx|^{2}=\sum d_{i}^{2}x_{i}^{2}\le(\max d_{i}^{2})|x|^{2}$ で、$x=e_{i}$ で等号）。
2. 1 の右の不等式は一般に等号でない：$I_{n}$ では $\|I_{n}\|=1$ だが $(\sum a_{ij}^{2})^{1/2}=\sqrt{n}$。
3. 一般に $\|A\|$ は $A^{\mathsf{T}}A$ の最大固有値の平方根であることが、スペクトル定理から分かる（\tref{lin:spectral-theorem} の内容。ここでは使わない）。
:::

## 可逆行列 {#calc:sec-eu-invertible}

::: theorem 可逆行列の全体は開集合 {#calc:invertible-open keywords="GL_n(R) is open in M_n(R) and inversion is continuous; if ||B - A|| ||A^{-1}|| < 1 then B is invertible with an explicit bound; Neumann series" index="可逆行列の全体は開集合|かぎゃくぎょうれつのぜんたいはかいしゅうごう, ノイマン級数|のいまんきゅうすう"}
1. （**ノイマン級数**）$H\in M_{n}(\mathbb{R})$、$\|H\|<1$ なら、$I-H$ は可逆で
$$
(I-H)^{-1}=\sum_{k=0}^{\infty}H^{k},\qquad\|(I-H)^{-1}\|\le\frac{1}{1-\|H\|}.
$$
2. $A$ が可逆で $\|B-A\|<1/\|A^{-1}\|$ なら $B$ も可逆で
$$
\|B^{-1}-A^{-1}\|\le\frac{\|A^{-1}\|^{2}\|B-A\|}{1-\|A^{-1}\|\|B-A\|}.
$$
3. 可逆な $n$ 次正方行列の全体 $GL_{n}(\mathbb{R})$ は $M_{n}(\mathbb{R})$ の開集合で、$A\mapsto A^{-1}$ は $GL_{n}(\mathbb{R})$ 上で連続。
:::

::: intuition
1 は等比級数 $\frac{1}{1-h}=1+h+h^{2}+\cdots$（$|h|<1$）の行列版である。行列の積は可換でないが、$H$ のべき同士は可換なので等比級数の計算がそのまま通る。2 は「$A$ の近くの $B$ は $A(I-H)$ と書け、$H$ が小さい」ことから 1 に帰着する。
:::

::: proof
**Step 1（級数の収束）.** $r\defeq\|H\|<1$。\ref{calc:operator-norm-properties.4} から $\|H^{k}\|\le r^{k}$。部分和 $S_{p}\defeq\sum_{k=0}^{p}H^{k}$ について、$p<q$ なら
$$
\|S_{q}-S_{p}\|\le\sum_{k=p+1}^{q}r^{k}\le\frac{r^{p+1}}{1-r}\to0\quad(p\to\infty)
$$
なので $(S_{p})$ はコーシー列で、完備性（\ref{calc:operator-norm-properties.5}）から極限 $S$ をもつ。$\|S_{p}\|\le\sum_{k\le p}r^{k}\le\frac{1}{1-r}$ で、ノルムは連続（\ref{calc:norm-equivalence} の Step 2）なので $\|S\|\le\frac{1}{1-r}$。

**Step 2（逆行列であること）.** $(I-H)S_{p}=S_{p}(I-H)=I-H^{p+1}$（項が打ち消し合う）。$\|H^{p+1}\|\le r^{p+1}\to0$。行列の積は連続（$\|XY-X'Y'\|\le\|X-X'\|\|Y\|+\|X'\|\|Y-Y'\|$）なので、$p\to\infty$ として $(I-H)S=S(I-H)=I$。

**Step 3（2）.** $H\defeq A^{-1}(A-B)$ とおくと $B=A-(A-B)=A(I-H)$、$\|H\|\le\|A^{-1}\|\|A-B\|<1$。1 から $I-H$ は可逆で、$B$ は可逆な行列の積なので可逆、$B^{-1}=(I-H)^{-1}A^{-1}$。さらに $(I-H)^{-1}-I=(I-H)^{-1}H$（$(I-H)^{-1}=I+(I-H)^{-1}H$ は $(I-H)^{-1}(I-H)=I$ を書き換えたもの）なので
$$
\|B^{-1}-A^{-1}\|=\|(I-H)^{-1}HA^{-1}\|\le\frac{\|H\|}{1-\|H\|}\|A^{-1}\|.
$$
$t\mapsto\frac{t}{1-t}$ は $[0,1)$ で増加なので、$\|H\|\le\|A^{-1}\|\|B-A\|$ を代入して主張の評価。

**Step 4（3）.** 2 から、$A\in GL_{n}(\mathbb{R})$ の開球 $\{\|B-A\|<1/\|A^{-1}\|\}$ は $GL_{n}(\mathbb{R})$ に含まれるので開集合。2 の評価の右辺は $B\to A$ で $0$ に近づくので、逆行列をとる写像は $A$ で連続。

::: hypcheck
- **完備性**：Step 1 で級数の極限の存在に使った。$M_{n}(\mathbb{R})$ が有限次元であることから \ref{calc:norm-independent-notions} で得た。
- **劣乗法性** $\|BA\|\le\|B\|\|A\|$：Step 1・3 で使った。
- 選択公理は使わない。
:::
:::

::: supplement
**別証明（行列式）.** $\det\colon M_{n}(\mathbb{R})\to\mathbb{R}$ は成分の多項式（\ref{lin:leibniz-formula}）なので連続（\ref{calc:componentwise.3}）で、$GL_{n}(\mathbb{R})=\det^{-1}(\mathbb{R}\setminus\{0\})$ は開集合。逆行列は $A^{-1}=\frac{1}{\det A}\operatorname{adj}A$（\ref{lin:adjugate}）で、成分は成分の有理式なので連続。この方法は短いが、2 のような定量的な評価は得られない。逆関数定理では 2 の評価が便利である。

**前提を変えると.** 無限次元のノルム空間では、ノルムが同値でないことがあり（\ref{calc:norm-equivalence} の hypcheck）、有界閉集合がコンパクトでないこともある。ノルム空間が有限次元であることと、閉単位球がコンパクトであることは同値であることが知られている（リースの補題による。本サイト未収録）。1 のノイマン級数は、完備なノルム空間（バナッハ空間）上の有界線形作用素についてそのまま成り立つ。

**高い視点.** \ref{calc:norm-equivalence} は、「有限次元の実ベクトル空間には、ノルムの選び方によらない標準的な位相がただ 1 つある」ことを言っている。言い換えると、有限次元の実ベクトル空間の間の線形写像はすべて連続で、線形代数の圏から位相空間の圏への関手が「位相をどう入れるか」の選択なしに定まる。多変数の微分は「各点の近くで写像を線形写像で近似する」ことなので、線形写像の世界に位相の曖昧さがないことが、微分の定義が座標やノルムの選び方によらないことの土台になる。比喩で言えば、ノルムは物差しの種類（巻尺、方眼紙、マス目の数）で、有限次元では物差しを取り替えても「近い・遠い」の判定は定数倍しか変わらないので、極限や連続性といった「限りなく近い」の議論は物差しの種類に左右されない。
:::

## 問題 {#calc:sec-eu-problems}

::: problem {#calc:prob-eu-unit-balls}
$n=2$ のとき、$|x|_{1}\le1$, $|x|\le1$, $|x|_{\infty}\le1$ の 3 つの集合を図示し、\ref{calc:norm-comparison} の不等式 $|x|_{\infty}\le|x|\le|x|_{1}$ が「単位球の包含」$\{|x|_{1}\le1\}\subset\{|x|\le1\}\subset\{|x|_{\infty}\le1\}$ と同値であることを示せ。
:::

::: solution
菱形（頂点 $(\pm1,0),(0,\pm1)$）、円板、正方形 $[-1,1]^{2}$。$|x|\le|x|_{1}$ なら $|x|_{1}\le1\Rightarrow|x|\le1$。逆に包含 $\{|x|_{1}\le1\}\subset\{|x|\le1\}$ を仮定すると、$x\neq0$ について $y=x/|x|_{1}$ は $|y|_{1}=1$ なので $|y|\le1$、すなわち $|x|\le|x|_{1}$（2 を使う）。もう一方も同様。
:::

::: problem {#calc:prob-eu-operator-norm-rank-one}
$u\in\mathbb{R}^{m}$, $v\in\mathbb{R}^{n}$ について、行列 $A=uv^{\mathsf{T}}$（$Ax=\langle v,x\rangle u$）の作用素ノルムが $|u||v|$ であることを示せ。
:::

::: solution
$|Ax|=|\langle v,x\rangle||u|\le|v||x||u|$（コーシー–シュワルツ）なので $\|A\|\le|u||v|$。$v\neq0$ なら $x=v/|v|$ で $|Ax|=|v||u|$。$v=0$ なら両辺 $0$。
:::

::: problem {#calc:prob-eu-nilpotent}
$H$ がべき零（$H^{N}=0$）なら、$\|H\|$ の大きさによらず $I-H$ は可逆で $(I-H)^{-1}=I+H+\cdots+H^{N-1}$ であることを示せ。また $\|H\|\ge1$ のべき零行列の例を挙げよ。
:::

::: solution
$(I-H)(I+H+\cdots+H^{N-1})=I-H^{N}=I$（逆順の積も同じ）。例：$H=\begin{pmatrix}0&2\\0&0\end{pmatrix}$ は $H^{2}=0$ で、$|He_{2}|=2$ から $\|H\|\ge2$。ノイマン級数の条件 $\|H\|<1$ は十分条件にすぎない。
:::
