# 可換代数（Commutative Algebra）

可換環とイデアル、局所化、ネーター環、整域の分類と保存表、次元論、正則局所環・コーエン＝マコーレー環、ホモロジー的方法。

<p class="mn-msc">MSC2020: 13</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="13A-general-commutative-ring-theory/01-basics/index.html"><span class="mn-card-title">環の基礎</span><span class="mn-card-en">Basic Ring Theory</span><span class="mn-card-desc">環・イデアル・剰余環、準同型定理、素イデアルと極大イデアル、中国剰余定理、多項式環と冪級数環、局所化と商体、イデアルの演算法則と反例（雪江『代数学 2』第 1 章に対応）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="13A-general-commutative-ring-theory/02-commutative-algebra/index.html"><span class="mn-card-title">可換環論</span><span class="mn-card-en">Commutative Algebra</span><span class="mn-card-desc">分数加群と局所的性質・中山の補題、ネーター環とアルティン環、整拡大と正規環、準素分解、ヒルベルトの零点定理、次数環とフィルトレーション、完備化、次元論とクルルの主イデアル定理、整閉包の有限性・クルル＝秋月の定理・正規性の判定、操作の可換性と反例、局所的な性質と局所的でない性質（松村『可換環論』、Zariski–Samuel を参考）。</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="13D-homological-methods/index.html"><span class="mn-card-title">ホモロジー的方法</span><span class="mn-card-en">Homological Methods</span><span class="mn-card-desc">コシュル複体と深さ、射影次元とアウスランダー＝ブクスバウムの公式、セールの正則性判定法。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="13F-arithmetic-rings/index.html"><span class="mn-card-title">算術的な環</span><span class="mn-card-en">Arithmetic Rings and Other Special Commutative Rings</span><span class="mn-card-desc">整域の分類（UFD・PID・デデキント環など）と環の性質。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="13H-local-rings/index.html"><span class="mn-card-title">局所環</span><span class="mn-card-en">Local Rings</span><span class="mn-card-desc">正則局所環、正則列と深さ、コーエン＝マコーレー環、ゴレンシュタイン環。</span><span class="mn-card-count">5 ページ</span></a>
