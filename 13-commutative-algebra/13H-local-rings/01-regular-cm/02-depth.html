# 正則列と深さ {#ring:page-depth keywords="regular sequence, M-regular sequence, depth, grade, Ext characterization of depth, Rees theorem, depth at most dim A/p for associated primes"}

$x_{1}$ が $M$ の非零因子、$x_{2}$ が $M/x_{1}M$ の非零因子、…と続く元の列を**正則列**という（\ref{ring:regular-sequence}）。多項式環の変数 $x_{1},\dots,x_{n}$ がその典型で、「独立な方程式で順に切っていく」ことに対応する。イデアル $I$ の中の極大な $M$ 正則列の長さは列の取り方によらず、$\operatorname{Ext}$ を使って $\min\{i : \operatorname{Ext}^{i}_{A}(A/I,M)\neq 0\}$ と表される（\ref{ring:depth-ext}）。この長さを**深さ**という。このページでは正則列の基本性質（局所環での並べ替え \ref{ring:regular-sequence-permutation}）と深さの特徴付けを示し、深さが次元を超えないこと、より精密に随伴素イデアル $\mathfrak{p}$ について $\operatorname{depth}M\le\dim A/\mathfrak{p}$ であること（\ref{ring:depth-le-dim}）を証明する。深さと次元が一致する加群が次のページのコーエン＝マコーレー加群である。

> 松村『可換環論』§16–17 の流れを参考にした。深さの定義が列によらないことは $\operatorname{Ext}$ による特徴付けで示した。

## 記法と定義の確認 {#ring:sec-dp-notation}

::: notation
- 環は可換、$A$ はネーター環、加群は有限生成とする。随伴素イデアル・零因子は \ref{ring:page-primary-decomposition}、素イデアルの回避は \ref{ring:prime-avoidance}、中山の補題は \ref{ring:nakayama}、加群の次元 $\dim M\defeq\dim A/\operatorname{Ann}M$（$=\operatorname{Supp}M$ の素イデアルの鎖の長さの上限）、次元論は \ref{ring:page-dimension-theory}。
- $\operatorname{Ext}^{i}_{A}(N,M)$ は第 1 変数の射影分解で定義したもの（\ref{ha:ext}）で、$\operatorname{Ext}^{0}=\Hom$、第 2 変数についての長完全列（\ref{ha:ext-long-exact}）をもつ。$A$ が可換なので $\operatorname{Ext}^{i}_{A}(N,M)$ は $A$ 加群で、$a\in A$ の作用は「$N$ への $a$ 倍が誘導する写像」とも「$M$ への $a$ 倍が誘導する写像」とも一致する（$\Hom_{A}(P_{j},M)$ 上で、$P_{j}$ 側で $a$ 倍してから写すことと、写してから $M$ 側で $a$ 倍することは同じだから）。
- $\Hom_{A}(A/I,M)\cong\{m\in M : Im=0\}$。
- **選択公理**：素イデアルの存在と中山の補題を通して使う。
:::

## 正則列 {#ring:sec-dp-regular}

::: definition 正則列 {#ring:regular-sequence keywords="M-regular sequence, regular element, non-zero-divisor on M" index="正則列|せいそくれつ, 正則元|せいそくげん, M 正則列|えむせいそくれつ"}
加群 $M$ と $x_{1},\dots,x_{n}\in A$ について、次の二条件をみたすとき $x_{1},\dots,x_{n}$ を **$M$ 正則列**という。
1. 各 $i$ で $x_{i}$ は $M/(x_{1},\dots,x_{i-1})M$ の非零因子（$x_{i}\bar m=0\Rightarrow\bar m=0$）。
2. $M/(x_{1},\dots,x_{n})M\neq 0$。

$I$ の元からなる $M$ 正則列で、$I$ の元を後ろに加えて長くできないものを **$I$ の中の極大な $M$ 正則列**という。
:::

::: example
1. $A=k[x_{1},\dots,x_{n}]$（または $k[[x_{1},\dots,x_{n}]]$）で $x_{1},\dots,x_{n}$ は $A$ 正則列：$A/(x_{1},\dots,x_{i-1})\cong k[x_{i},\dots,x_{n}]$ は整域で $x_{i}\neq 0$。
2. 正則局所環の正則なパラメーター系は正則列：$A/(x_{1},\dots,x_{i-1})$ は正則局所環（\ref{ring:regular-quotient}）なので整域（\ref{ring:regular-domain}）で、$x_{i}$ はその $0$ でない元。
3. 局所でないと順序が効く：$A=k[x,y,z]$ で $x,\ y(1-x),\ z(1-x)$ は $A$ 正則列だが、$y(1-x),\ z(1-x),\ x$ は正則列でない：$z(1-x)\cdot y=z\cdot y(1-x)\in(y(1-x))$ で $y\notin(y(1-x))$ なので、$z(1-x)$ は $A/(y(1-x))$ の零因子である。（前者が正則列であることは、$A/(x)\cong k[y,z]$ で $y(1-x)\mapsto y$, $z(1-x)\mapsto z$ となることからわかる。）
:::

::: theorem 局所環での正則列の並べ替え {#ring:regular-sequence-permutation keywords="permutations of regular sequences in a local ring are regular" index="正則列の並べ替え|せいそくれつのならべかえ"}
（AC）$(A,\mathfrak{m})$ をネーター局所環、$M\neq 0$ を有限生成加群とする。$\mathfrak{m}$ の元からなる $M$ 正則列は、どう並べ替えても $M$ 正則列である。
:::

::: proof
**Step 1（隣接する二つの交換）.** 互換は隣接互換の積なので、$x,y$ が $M$ 正則列なら $y,x$ も $M$ 正則列であることを示せばよい（前の元で割った加群 $M/(x_{1},\dots,x_{i-1})M$ に適用する）。条件 2 は $M/(x,y)M$ が同じなので成り立つ。

**Step 2（$y$ は $M$ の非零因子）.** $K\defeq\{m\in M : ym=0\}$ とする。$m\in K$ について $ym=0\in xM$ で、$y$ は $M/xM$ の非零因子なので $m\in xM$：$m=xm'$。$xym'=0$ で $x$ は $M$ の非零因子なので $ym'=0$、$m'\in K$。よって $K=xK$。$K$ は有限生成で $x\in\mathfrak{m}$ なので、中山の補題から $K=0$。

**Step 3（$x$ は $M/yM$ の非零因子）.** $xm\in yM$：$xm=ym'$ とする。$ym'\in xM$ なので $m'\in xM$（$y$ は $M/xM$ の非零因子）：$m'=xm''$。$xm=xym''$ から $x(m-ym'')=0$、$m=ym''\in yM$。

::: hypcheck
- **前提「局所環、$\mathfrak{m}$ の元」**：Step 2 の中山の補題に使った。外すと偽：例 3。
:::
:::

## 深さ {#ring:sec-dp-depth}

::: lemma 零因子からなるイデアル {#ring:ideal-of-zero-divisors keywords="Hom(A/I,M) != 0 iff I consists of zero divisors on M" index="零因子からなるイデアル|れいいんしからなるいである"}
（AC）$\Hom_{A}(A/I,M)\neq 0$ であることと、$I$ が $M$ の零因子だけからなることは同値である。このとき $I$ はある $\mathfrak{p}\in\operatorname{Ass}(M)$ に含まれる。
:::

::: proof
**Step 1（⇒）.** $0\neq m$ で $Im=0$ なら、$I$ の元はすべて $m$ を消す。

**Step 2（⇐）.** 零因子全体は $\bigcup_{\mathfrak{p}\in\operatorname{Ass}M}\mathfrak{p}$（\ref{ring:zero-divisors-ass}）で、$\operatorname{Ass}M$ は有限（\ref{ring:prime-filtration}）。素イデアルの回避（\ref{ring:prime-avoidance}）から $I\subset\mathfrak{p}=\operatorname{Ann}(m)$ となる $\mathfrak{p}\in\operatorname{Ass}M$ がある。$Im=0$, $m\neq 0$ なので $\Hom(A/I,M)\neq 0$。
:::

::: theorem 深さの Ext による特徴付け（リース） {#ring:depth-ext keywords="all maximal M-regular sequences in I have the same length, depth via Ext, Rees" index="深さ|ふかさ, 深度|しんど, グレード|ぐれーど"}
（AC）$A$ をネーター環、$M$ を有限生成加群、$I$ をイデアルで $IM\neq M$ とする。$I$ の中の極大な $M$ 正則列の長さ $n$ は列によらず、
$$
n=\min\{i : \operatorname{Ext}^{i}_{A}(A/I,M)\neq 0\}.
$$
この $n$ を $I$ に関する $M$ の**深さ**（グレード）といい $\operatorname{depth}_{I}M$ と書く。局所環 $(A,\mathfrak{m})$ で $I=\mathfrak{m}$ のときは単に $\operatorname{depth}M$ と書く。
:::

::: proof
極大な $M$ 正則列 $x_{1},\dots,x_{n}\in I$ について、$\operatorname{Ext}^{i}(A/I,M)=0$（$i<n$）かつ $\operatorname{Ext}^{n}(A/I,M)\neq 0$ を $n$ の帰納法で示す。右辺は列によらないので、主張が従う。

**Step 1（$n=0$）.** 正則列が空で極大なら、$I$ のどの元も $M$ の非零因子でない。\ref{ring:ideal-of-zero-divisors} から $\Hom(A/I,M)=\operatorname{Ext}^{0}\neq 0$。

**Step 2（$n\ge 1$）.** $x=x_{1}$ は $M$ の非零因子なので $0\to M\xrightarrow{x}M\to M/xM\to 0$ は完全。長完全列（\ref{ha:ext-long-exact}）
$$
\operatorname{Ext}^{i}(A/I,M)\xrightarrow{x}\operatorname{Ext}^{i}(A/I,M)\to\operatorname{Ext}^{i}(A/I,M/xM)\to\operatorname{Ext}^{i+1}(A/I,M)\xrightarrow{x}\cdots
$$
で、$x$ 倍の写像は $x\in I$ が $A/I$ を消すので $0$（記法の欄）。よって短完全列
$$
0\to\operatorname{Ext}^{i}(A/I,M)\to\operatorname{Ext}^{i}(A/I,M/xM)\to\operatorname{Ext}^{i+1}(A/I,M)\to 0
$$
を得る。$x_{2},\dots,x_{n}$ は $I$ の中の極大な $M/xM$ 正則列なので、帰納法の仮定から $\operatorname{Ext}^{i}(A/I,M/xM)=0$（$i<n-1$）、$\neq 0$（$i=n-1$）。短完全列から $\operatorname{Ext}^{i}(A/I,M)=0$（$i\le n-1$）、$\operatorname{Ext}^{n}(A/I,M)\neq 0$（$i=n-1$ で、中央が $0$ でなく左が $0$ なので右が $0$ でない）。

**Step 3（極大な列の存在）.** $M$ 正則列 $x_{1},\dots,x_{k}$ について、$x_{i}\notin(x_{1},\dots,x_{i-1})$：そうでなければ $x_{i}$ は $0$ でない加群 $M/(x_{1},\dots,x_{i-1})M$（$M/(x_{1},\dots,x_{k})M\neq 0$ に全射する）を零化し、非零因子でない。よって $(x_{1})\subsetneq(x_{1},x_{2})\subsetneq\cdots$ は真の昇鎖で、$A$ はネーターなので、正則列を延ばしていく操作は有限回で止まり、極大な列が存在する（空の列から始めてよい。従属選択公理を使う）。
:::

::: example
1. 正則局所環 $A$ では $\operatorname{depth}A=\dim A$（正則なパラメーター系が正則列で、長さ $\dim A$。\ref{ring:depth-le-dim} の上界と合わせて）。
2. $A=k[[x,y]]/(x^{2},xy)$ では $\operatorname{depth}A=0$：$\bar x\neq 0$ を $\mathfrak{m}=(x,y)$ が消すので $\mathfrak{m}\in\operatorname{Ass}A$。一方 $\dim A=1$（$\mathfrak{p}=(x)$ で $A/\mathfrak{p}\cong k[[y]]$）。
3. $A=k[[x,y]]/(xy)$ では $\operatorname{depth}A=1=\dim A$：$x+y$ は非零因子（$\operatorname{Ass}A=\{(x),(y)\}$ のどちらにも属さない）。
:::

::: proposition 深さと次元 {#ring:depth-le-dim keywords="depth M <= dim A/p for all associated primes p, depth <= dim" index="深さと次元|ふかさとじげん"}
（AC）$(A,\mathfrak{m})$ をネーター局所環、$M\neq 0$ を有限生成加群とする。すべての $\mathfrak{p}\in\operatorname{Ass}M$ について $\operatorname{depth}M\le\dim A/\mathfrak{p}$。特に $\operatorname{depth}M\le\dim M$。
:::

::: proof
**Step 1（補題）.** $x\in\mathfrak{m}$ が $M$ の非零因子、$\mathfrak{p}\in\operatorname{Ass}M$ なら、$\mathfrak{p}+xA\subset\mathfrak{q}$ となる $\mathfrak{q}\in\operatorname{Ass}(M/xM)$ がある。実際、$N\defeq\Hom(A/\mathfrak{p},M)\neq 0$ で、$0\to M\xrightarrow{x}M\to M/xM$ に $\Hom(A/\mathfrak{p},-)$（左完全）を施すと $N/xN\hookrightarrow\Hom(A/\mathfrak{p},M/xM)$。中山の補題から $N/xN\neq 0$ なので、$\mathfrak{p}$ と $x$ に消される $0$ でない元 $\bar m\in M/xM$ がある。$\operatorname{Ann}(\bar m)\supset\mathfrak{p}+xA$ を含む零化イデアルの極大元は随伴素イデアル（\ref{ring:ass-nonempty} の Step 2 の議論）。

**Step 2（帰納法）.** $\operatorname{depth}M$ についての帰納法。$0$ なら明らか。$\operatorname{depth}M\ge 1$ なら $\mathfrak{m}$ の中の $M$ 正則元 $x$ をとると、$\operatorname{depth}M/xM=\operatorname{depth}M-1$（\ref{ring:depth-ext} の Step 2 の短完全列から）。Step 1 の $\mathfrak{q}$ について、$x$ は非零因子なので $x\notin\mathfrak{p}$（\ref{ring:zero-divisors-ass}）で $\mathfrak{q}\supsetneq\mathfrak{p}$、よって $\dim A/\mathfrak{q}\le\dim A/\mathfrak{p}-1$。帰納法の仮定から $\operatorname{depth}M-1=\operatorname{depth}M/xM\le\dim A/\mathfrak{q}\le\dim A/\mathfrak{p}-1$。

**Step 3（特に）.** $\operatorname{Ass}M$ の元 $\mathfrak{p}$ は $\operatorname{Ann}M$ を含むので $\dim A/\mathfrak{p}\le\dim M$。
:::

::: supplement
**深さの幾何的意味.** 深さは「$\mathfrak{m}$ の中でどれだけ独立に方程式を課せるか」を測り、$\operatorname{depth}<\dim$ の局所環には、埋没素因子や次元の異なる成分の交わりのような「病的な」構造がある（例 2 の埋没点）。局所コホモロジーの言葉では、$\operatorname{depth}M=\min\{i : H^{i}_{\mathfrak{m}}(M)\neq 0\}$ で、次元は $\max\{i : H^{i}_{\mathfrak{m}}(M)\neq 0\}$ である（グロタンディーク）。

**コシュル複体による特徴付け.** 深さはコシュル複体のホモロジーでも計算できる（\ref{ring:page-koszul-depth}）。
:::

## 問題 {#ring:sec-dp-problems}

::: problem {#ring:prob-depth-polynomial}
$A=k[x,y]_{(x,y)}$ について $\operatorname{depth}A=2$ を示し、$\operatorname{depth}A/(x^{2},xy)=0$、$\operatorname{depth}A/(x)=1$ を確かめよ。
:::

::: solution
$x,y$ は $A$ 正則列（例 1 と局所化）で、$\operatorname{depth}A\le\dim A=2$（\ref{ring:depth-le-dim}）なので $2$。$A/(x^{2},xy)$ では $\bar x\neq 0$ が $\mathfrak{m}$ で消されるので $\mathfrak{m}\in\operatorname{Ass}$、深さ $0$（\ref{ring:ideal-of-zero-divisors}）。$A/(x)\cong k[y]_{(y)}$ は DVR で、$y$ が非零因子、深さ $\le\dim=1$ なので $1$。
:::
