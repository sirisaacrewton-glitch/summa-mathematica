# コーエン＝マコーレー環 {#ring:page-cohen-macaulay keywords="Cohen-Macaulay local ring, Cohen-Macaulay ring, unmixedness theorem, system of parameters is a regular sequence, equidimensional, no embedded primes"}

ネーター局所環の深さは次元以下である（\ref{ring:depth-le-dim}）。等号 $\operatorname{depth}A=\dim A$ が成り立つ局所環を**コーエン＝マコーレー環**（CM 環）という（\ref{ring:cohen-macaulay}）。正則局所環は CM であり、CM 環は正則局所環の持つ「よい性質」のうち、次元と深さに関わる部分を保ったまま、特異点を許す広いクラスになっている。このページでは、CM 局所環では随伴素イデアルがすべて同じ次元をもつこと（埋没素因子がない）、パラメーター系がつねに正則列であること（\ref{ring:cm-sop-regular}）を示し、そこから**マコーレーの非混合性定理**（\ref{ring:unmixedness}）を導く。

> 松村『可換環論』§17 の流れを参考にした。局所環の場合（環そのものが CM）に絞り、加群の場合と局所化での保存は事実として述べた。

## 記法と定義の確認 {#ring:sec-cm-notation}

::: notation
- $(A,\mathfrak{m})$ はネーター局所環。深さ・正則列・$\operatorname{depth}\le\dim A/\mathfrak{p}$ は \ref{ring:page-depth}、次元定理・パラメーター系・非零因子での次元の低下は \ref{ring:dimension-theorem}, \ref{ring:dimension-corollaries}、随伴素イデアルと零因子は \ref{ring:page-primary-decomposition}、正則局所環は \ref{ring:page-regular-local-rings}。
- **選択公理**：深さと次元の結果を通して使う。
:::

## 定義と例 {#ring:sec-cm-definition}

::: definition コーエン＝マコーレー環 {#ring:cohen-macaulay keywords="Cohen-Macaulay local ring, CM ring, maximal Cohen-Macaulay module" index="コーエン＝マコーレー環|こーえんまこーれーかん, CM 環|しーえむかん"}
ネーター局所環 $(A,\mathfrak{m})$ で $\operatorname{depth}A=\dim A$ となるものを**コーエン＝マコーレー局所環**という。ネーター環 $A$ で、すべての極大イデアル $\mathfrak{m}$ について $A_{\mathfrak{m}}$ がコーエン＝マコーレー局所環であるものを**コーエン＝マコーレー環**という。（有限生成加群 $M\neq 0$ についても $\operatorname{depth}M=\dim M$ で CM 加群を定義する。）
:::

::: example コーエン＝マコーレー環の例 {#ring:cm-examples}
1. 正則局所環は CM（\ref{ring:depth-ext} の後の例 1）。
2. $0$ 次元のネーター局所環（アルティン局所環）は CM（$0\le\operatorname{depth}\le\dim=0$）。
3. 被約な $1$ 次元ネーター局所環は CM：被約なネーター環では随伴素イデアルは極小素イデアルに限る（$\mathfrak{p}=\operatorname{Ann}(x)$, $x\neq 0$ なら、極小素イデアルの共通部分は $0$ なので $x\notin\mathfrak{q}$ となる極小素イデアル $\mathfrak{q}$ があり、$\mathfrak{p}x=0\in\mathfrak{q}$ から $\mathfrak{p}\subset\mathfrak{q}$、極小性から $\mathfrak{p}=\mathfrak{q}$）。$\mathfrak{m}$ は極小でないので $\mathfrak{m}\notin\operatorname{Ass}A$、\ref{ring:ideal-of-zero-divisors} から深さ $\ge 1$。例：$k[[x,y]]/(xy)$、$k[[t^{2},t^{3}]]$。
4. **CM でない例**：$k[[x,y]]/(x^{2},xy)$（$\dim 1$, 深さ $0$。埋没点がある）、$k[[x,y,z]]/(xy,xz)=k[[x,y,z]]/((x)\cap(y,z))$（平面と直線の和集合。随伴素イデアル $(x)$, $(y,z)$ の次元が $2$ と $1$ で異なるので、下の \ref{ring:cm-properties} の 1 に反する）。
5. ゴレンシュタイン環・完全交叉（\ref{ring:page-gorenstein}）は CM。
:::

## 基本性質 {#ring:sec-cm-properties}

::: proposition コーエン＝マコーレー環の基本性質 {#ring:cm-properties keywords="CM local rings have no embedded primes and are equidimensional, quotient by a non-zero-divisor" index="コーエン＝マコーレー環の性質|こーえんまこーれーかんのせいしつ"}
（AC）$(A,\mathfrak{m})$ を $d$ 次元のネーター局所環とする。
1. $A$ が CM なら、すべての $\mathfrak{p}\in\operatorname{Ass}A$ で $\dim A/\mathfrak{p}=d$。特に $A$ は埋没素因子をもたず、極小素イデアル $\mathfrak{p}$ はすべて $\dim A/\mathfrak{p}=d$ をみたす。
2. $x\in\mathfrak{m}$ を $A$ の非零因子とする。$A$ が CM であることと、$A/xA$ が CM であることは同値で、このとき $\dim A/xA=d-1$。
:::

::: proof
**Step 1（1）.** \ref{ring:depth-le-dim} から $d=\operatorname{depth}A\le\dim A/\mathfrak{p}\le\dim A=d$。極小素イデアルは随伴素イデアル（\ref{ring:ass-localization} の 2）なので、極小でない随伴素イデアル $\mathfrak{p}\supsetneq\mathfrak{q}$ があれば $\dim A/\mathfrak{p}<\dim A/\mathfrak{q}\le d$ となり矛盾。

**Step 2（2）.** 非零因子なので $\dim A/xA=d-1$（\ref{ring:dimension-corollaries} の 3）、$\operatorname{depth}A/xA=\operatorname{depth}A-1$（\ref{ring:depth-ext} の Step 2 の短完全列）。よって $\operatorname{depth}A=d\iff\operatorname{depth}A/xA=d-1=\dim A/xA$。
:::

::: theorem パラメーター系と正則列 {#ring:cm-sop-regular keywords="in a Cohen-Macaulay local ring, x_1,...,x_r is a regular sequence iff it is part of a system of parameters" index="パラメーター系は正則列|ぱらめーたーけいはせいそくれつ"}
（AC）$(A,\mathfrak{m})$ を $d$ 次元の CM 局所環、$x_{1},\dots,x_{r}\in\mathfrak{m}$ とする。次は同値である。
1. $x_{1},\dots,x_{r}$ は $A$ 正則列。
2. $\dim A/(x_{1},\dots,x_{r})=d-r$（すなわち、パラメーター系の一部である）。

特に、CM 局所環のパラメーター系は正則列である。逆に、ネーター局所環で、あるパラメーター系が正則列なら CM である。
:::

::: proof
**Step 1（1⇒2）.** 非零因子で割るごとに次元はちょうど $1$ 下がる（\ref{ring:dimension-corollaries} の 3）。

**Step 2（2⇒1、$r=1$）.** $\dim A/x_{1}A=d-1$ とする。$x_{1}$ が零因子なら、ある $\mathfrak{p}\in\operatorname{Ass}A$ に属し（\ref{ring:zero-divisors-ass}）、$\dim A/\mathfrak{p}=d$（\ref{ring:cm-properties} の 1）なので $\dim A/x_{1}A\ge\dim A/\mathfrak{p}=d$ となり矛盾。

**Step 3（2⇒1、一般）.** $r$ の帰納法。$\dim A/(x_{1},\dots,x_{r})=d-r$ なら、$\dim A/x_{1}A\le d-r+(r-1)=d-1$（\ref{ring:dimension-corollaries} の 3 を $A/x_{1}A$ から $r-1$ 回）で、$\ge d-1$ なので $=d-1$。Step 2 から $x_{1}$ は非零因子で、$A/x_{1}A$ は $d-1$ 次元の CM 局所環（\ref{ring:cm-properties} の 2）。その中で $x_{2},\dots,x_{r}$ について帰納法の仮定を使う。

**Step 4（逆）.** パラメーター系 $x_{1},\dots,x_{d}$ が正則列なら $\operatorname{depth}A\ge d=\dim A$ で、$\operatorname{depth}\le\dim$ と合わせて CM。
:::

::: theorem マコーレーの非混合性定理 {#ring:unmixedness keywords="Macaulay unmixedness theorem: in a CM local ring an ideal of height r generated by r elements is unmixed" index="非混合性定理|ひこんごうせいていり, 非混合|ひこんごう"}
（AC）$(A,\mathfrak{m})$ を CM 局所環、$I=(x_{1},\dots,x_{r})$ を $\operatorname{ht}I=r$ となるイデアルとする（$\operatorname{ht}I$ は $I$ を含む素イデアルの高さの最小値）。$A/I$ は CM で、$\operatorname{Ass}(A/I)$ の元はすべて高さ $r$ である。特に $I$ は埋没素因子をもたない（**非混合**）。
:::

::: proof
**Step 1（次元）.** $d=\dim A$ とする。$I$ 上の極小素イデアル $\mathfrak{p}$ で $\dim A/\mathfrak{p}=\dim A/I$ となるものをとると、$\operatorname{ht}\mathfrak{p}+\dim A/\mathfrak{p}\le d$（鎖をつなげる）と $\operatorname{ht}\mathfrak{p}\ge r$ から $\dim A/I\le d-r$。一方 $\dim A/I\ge d-r$（\ref{ring:dimension-corollaries} の 3 を $r$ 回）。よって $\dim A/I=d-r$。

**Step 2（CM）.** \ref{ring:cm-sop-regular} から $x_{1},\dots,x_{r}$ は正則列で、\ref{ring:cm-properties} の 2 を繰り返して $A/I$ は $d-r$ 次元の CM 局所環。

**Step 3（高さ）.** $\mathfrak{p}\in\operatorname{Ass}(A/I)$ について、\ref{ring:cm-properties} の 1（$A/I$ に適用）から $\dim A/\mathfrak{p}=d-r$。$\operatorname{ht}\mathfrak{p}\le d-\dim A/\mathfrak{p}=r$ と $\operatorname{ht}\mathfrak{p}\ge\operatorname{ht}I=r$ から $\operatorname{ht}\mathfrak{p}=r$。
:::

::: fact 局所化と CM 性 {#ring:cm-localization-fact keywords="localization of a Cohen-Macaulay ring is Cohen-Macaulay, CM rings are universally catenary" index="CM 環の局所化|しーえむかんのきょくしょか"}
CM 局所環の素イデアルでの局所化は CM である。CM 環 $A$ について $A[x]$ も CM で、CM 局所環では任意のイデアル $I$ について $\operatorname{ht}I+\dim A/I=\dim A$ が成り立ち、CM 環は（普遍）鎖状である。出典：松村『可換環論』§17。
:::

::: supplement
**正則局所環との関係.** 正則 ⇒ 完全交叉 ⇒ ゴレンシュタイン ⇒ CM ⇒（$\dim A/\mathfrak{p}=\dim A$ が全随伴素イデアルで成り立つ）。どの逆も成り立たない（\ref{ring:page-gorenstein}）。

**幾何的な意味.** CM 性は「局所的にどこでも同じ次元で、埋め込まれた低次元の部分をもたない」性質の強いもので、代数多様体の交わりの重複度が「素朴に数えた値（長さ）」と一致するための条件（$\ell(A/(x))=e(x;A)$）としても現れる。セールの「交叉重複度」の理論や、双対性（CM なら双対化加群がある）で中心的な役割を果たす。
:::

## 問題 {#ring:sec-cm-problems}

::: problem {#ring:prob-cm-hypersurface}
$(A,\mathfrak{m})$ を CM 局所環、$x\in\mathfrak{m}$ を非零因子とすると $A/xA$ は CM であること（\ref{ring:cm-properties} の 2）から、正則局所環を $0$ でない元で割った環（超曲面）は CM であることを示せ。例えば $k[[x,y]]/(y^{2}-x^{3})$ は正則でないが CM である。
:::

::: solution
正則局所環は CM（例 1）で整域（\ref{ring:regular-domain}）なので、$0\neq f\in\mathfrak{m}$ は非零因子。\ref{ring:cm-properties} の 2 から $A/fA$ は CM。$k[[x,y]]/(y^{2}-x^{3})$ は正則でない（\ref{ring:regular-examples} の 5）が、このようにして CM。
:::

::: problem {#ring:prob-not-cm-union}
$A=k[[x,y,z]]/(xy,xz)$ が CM でないことを、深さを直接計算して確かめよ（$\dim A=2$, $\operatorname{depth}A=1$）。
:::

::: solution
$(xy,xz)=(x)\cap(y,z)$ なので $\operatorname{Ass}A=\{(x),(y,z)\}$（どちらも素、無駄のない分解）、$\dim A=\max(\dim A/(x),\dim A/(y,z))=\max(2,1)=2$。$\mathfrak{m}\notin\operatorname{Ass}$ なので深さ $\ge 1$。$f=x+y$（両方の随伴素イデアルの外）は非零因子で、$A/fA\cong k[[x,y,z]]/(xy,xz,x+y)\cong k[[x,z]]/(x^{2},xz)$（$y=-x$）。後者では $\bar x\neq 0$ が $\mathfrak{m}$ で消されるので深さ $0$。よって $\operatorname{depth}A=1<2$。
:::
