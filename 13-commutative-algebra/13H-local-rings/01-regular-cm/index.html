# 正則局所環とコーエン＝マコーレー環（Regular and Cohen-Macaulay Local Rings）

正則局所環と随伴次数環、正則列と深さ、コーエン＝マコーレー環と非混合性定理、ゴレンシュタイン環と完全交叉、操作（多項式環・完備化・剰余・忠実平坦降下）で保たれる性質（松村『可換環論』を参考）。

<p class="mn-msc">MSC2020: 13H05, 13H10</p>
