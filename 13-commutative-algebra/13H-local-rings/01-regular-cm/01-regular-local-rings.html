# 正則局所環 {#ring:page-regular-local-rings keywords="regular local ring, regular system of parameters, embedding dimension, associated graded ring of a regular local ring is a polynomial ring, regular local rings are domains"}

ネーター局所環 $(A,\mathfrak{m},k)$ の次元は埋め込み次元 $\dim_{k}\mathfrak{m}/\mathfrak{m}^{2}$ 以下である（\ref{ring:dimension-corollaries}）。等号が成り立つ局所環を**正則局所環**という（\ref{ring:regular-local-ring}）。幾何的には、代数多様体の**非特異点**の局所環がちょうど正則局所環で、接空間の次元 $\dim\mathfrak{m}/\mathfrak{m}^{2}$ が多様体の次元と一致する点である。このページでは、正則局所環の随伴次数環が剰余体上の多項式環であること（\ref{ring:regular-gr}）を示し、そこから正則局所環が整域であること、$1$ 次元の正則局所環が DVR であること、正則性が完備化と「正則なパラメーターで割ること」で保たれることを導く。正則局所環が局所化しても正則であること（\ref{ring:regular-localization}）・一意分解環であること（\ref{ring:regular-ufd}）は、ホモロジー代数の道具を使って後で示す。また、多項式で定義された点の正則性をヤコビ行列で判定する（\ref{ring:jacobian-criterion}）。

> 松村『可換環論』§14 と Atiyah–Macdonald 第 11 章の流れを参考にした。

## 記法と定義の確認 {#ring:sec-rl-notation}

::: notation
- 環は可換。$(A,\mathfrak{m},k)$ はネーター局所環で $k=A/\mathfrak{m}$。次元・ヒルベルト＝サミュエル関数 $\chi(n)=\ell(A/\mathfrak{m}^{n})$・次元定理・パラメーター系は \ref{ring:page-dimension-theory}、随伴次数環は \ref{ring:associated-graded}、中山の補題による生成系は \ref{ring:nakayama-generators}、完備化は \ref{ring:page-completion}、離散付値環は \ref{ring:dvr-characterization}。
- $\operatorname{edim}A\defeq\dim_{k}\mathfrak{m}/\mathfrak{m}^{2}$（**埋め込み次元**）。$\mathfrak{m}$ の極小生成系の元の個数に等しい。
- **選択公理**：次元定理を通して使う。
:::

## 定義と例 {#ring:sec-rl-definition}

::: definition 正則局所環 {#ring:regular-local-ring keywords="regular local ring, regular system of parameters" index="正則局所環|せいそくきょくしょかん, 正則なパラメーター系|せいそくなぱらめーたーけい"}
ネーター局所環 $(A,\mathfrak{m},k)$ で $\dim A=\operatorname{edim}A$ となるものを**正則局所環**という。このとき $\mathfrak{m}$ を生成する $\dim A$ 個の元を**正則なパラメーター系**という（それは \ref{ring:system-of-parameters} の意味のパラメーター系でもある）。
:::

::: example 正則局所環の例 {#ring:regular-examples}
1. 体（$\dim=\operatorname{edim}=0$）。
2. DVR：$\mathfrak{m}=(t)$, $\dim=1$（\ref{ring:dvr-characterization}）。$\Z_{(p)}$, $\Z_{p}$, $k[[x]]$。
3. $k[[x_{1},\dots,x_{n}]]$：$\dim=n$（\ref{ring:prob-hilbert-samuel-power-series}）、$\mathfrak{m}=(x_{1},\dots,x_{n})$ なので $\operatorname{edim}\le n$。よって正則。
4. $k[x_{1},\dots,x_{n}]_{(x_{1},\dots,x_{n})}$：完備化が $k[[x_{1},\dots,x_{n}]]$（\ref{ring:completion-examples.2} と局所化）で、\ref{ring:regular-completion} から正則。
5. **正則でない例**：$A=k[[x,y]]/(y^{2}-x^{3})$ は $\dim A=1$（$y^{2}-x^{3}$ は整域 $k[[x,y]]$ の非零因子なので \ref{ring:dimension-corollaries.3} から $\dim A=2-1$）だが、$\mathfrak{m}=(x,y)$ で $y^{2}-x^{3}\in(x,y)^{2}$ なので $\mathfrak{m}/\mathfrak{m}^{2}$ は $\bar x,\bar y$ を基底にもち $\operatorname{edim}=2$。尖点 $y^{2}=x^{3}$ の原点は特異点である。同様に $k[[x,y]]/(xy)$（$\dim 1$, $\operatorname{edim}2$）も正則でない。
:::

## 随伴次数環 {#ring:sec-rl-gr}

::: lemma 多項式環の剰余のヒルベルト関数 {#ring:hypersurface-hilbert keywords="Hilbert function of k[X]/(F) has degree d-2" index="超曲面のヒルベルト関数|ちょうきょくめんのひるべるとかんすう"}
体 $k$ 上の $S=k[X_{1},\dots,X_{d}]$（$d\ge 1$）と、次数 $e\ge 1$ の斉次多項式 $F\neq 0$ について、$\dim_{k}(S/(F))_{j}$ は $j$ の次数 $\le d-2$ の多項式に一致する（$j\ge e$）。
:::

::: proof
$S_{j}$ の次元は $\binom{j+d-1}{d-1}$（次数 $j$ の単項式の個数）。$F$ を掛ける写像 $S_{j-e}\to S_{j}$ は単射（$S$ は整域）で、像は $(F)_{j}$。よって $\dim(S/(F))_{j}=\binom{j+d-1}{d-1}-\binom{j-e+d-1}{d-1}$。二つの二項係数は $j$ の $d-1$ 次多項式で最高次の係数が等しい（$1/(d-1)!$）ので、差の次数は $\le d-2$。
:::

::: theorem 正則局所環の随伴次数環 {#ring:regular-gr keywords="A is regular iff gr_m(A) is a polynomial ring over k in dim A variables" index="正則局所環の随伴次数環|せいそくきょくしょかんのずいはんじすうかん"}
（AC）ネーター局所環 $(A,\mathfrak{m},k)$, $d=\dim A$ について、次は同値である。
1. $A$ は正則局所環。
2. $\operatorname{gr}_{\mathfrak{m}}(A)\cong k[X_{1},\dots,X_{d}]$（次数環として）。
:::

::: proof
**Step 1（自然な全射）.** $\mathfrak{m}$ の極小生成系 $x_{1},\dots,x_{e}$（$e=\operatorname{edim}A$）について、$\varphi:k[X_{1},\dots,X_{e}]\to\operatorname{gr}_{\mathfrak{m}}(A)$, $X_{i}\mapsto\bar x_{i}\in\mathfrak{m}/\mathfrak{m}^{2}$ は次数を保つ全射な環準同型（$\mathfrak{m}^{n}/\mathfrak{m}^{n+1}$ は $x$ の次数 $n$ の単項式の像で張られる）。

**Step 2（1⇒2）.** $e=d$ とし、$\Ker\varphi\neq 0$ と仮定する。斉次イデアルなので、$0$ でない斉次元 $F$（次数 $\ge 1$。次数 $0$ の部分 $k\to k$ は同型）を含む。$\dim_{k}\mathfrak{m}^{j}/\mathfrak{m}^{j+1}\le\dim(S/(F))_{j}$ で、\ref{ring:hypersurface-hilbert} から右辺は次数 $\le d-2$ の多項式。$\chi(n)=\sum_{j<n}\dim\mathfrak{m}^{j}/\mathfrak{m}^{j+1}$ は、次数 $\le d-1$ の多項式で上から抑えられ（差分の補題 \ref{ring:difference-lemma} から和の次数は $\le d-1$）、$d(A)\le d-1$。次元定理 $d(A)=\dim A=d$ に反する。よって $\varphi$ は同型。

**Step 3（2⇒1）.** $\operatorname{gr}_{\mathfrak{m}}(A)\cong k[X_{1},\dots,X_{d}]$ なら、次数 $1$ の部分を比べて $\operatorname{edim}A=\dim\mathfrak{m}/\mathfrak{m}^{2}=d$。
:::

::: corollary 正則局所環は整域 {#ring:regular-domain keywords="regular local rings are integral domains, regular local ring of dimension one is a DVR" index="正則局所環は整域|せいそくきょくしょかんはせいいき"}
（AC）正則局所環は整域である。$1$ 次元の正則局所環は離散付値環であり、逆も成り立つ。
:::

::: proof
**Step 1.** $\operatorname{gr}_{\mathfrak{m}}(A)\cong k[X_{1},\dots,X_{d}]$ は整域なので、\ref{ring:prob-gr-domain}（クルルの交叉定理を使う）から $A$ は整域。

**Step 2.** $\dim A=1$ で正則なら、$\mathfrak{m}$ は一つの元で生成される単項イデアルで、$A$ はネーター局所整域なので DVR（\ref{ring:dvr-characterization.4}⇒1）。逆に DVR は例 2 のとおり正則。
:::

## 正則性の保存 {#ring:sec-rl-preservation}

::: proposition 正則なパラメーターによる剰余 {#ring:regular-quotient keywords="A regular and x in m minus m^2 implies A/xA regular of dimension d-1, converse for non-zero-divisors" index="正則局所環の剰余|せいそくきょくしょかんのじょうよ"}
（AC）ネーター局所環 $(A,\mathfrak{m})$ と $x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ について、
1. $A$ が正則なら、$A/xA$ は $\dim A-1$ 次元の正則局所環である。
2. $x$ が非零因子で $A/xA$ が正則なら、$A$ は正則である。
3. したがって、正則局所環 $A$ と元 $x_{1},\dots,x_{i}\in\mathfrak{m}$ について、$A/(x_{1},\dots,x_{i})$ が $\dim A-i$ 次元の正則局所環であることと、$x_{1},\dots,x_{i}$ が正則なパラメーター系の一部であること（$\mathfrak{m}/\mathfrak{m}^{2}$ で一次独立）は同値である。
:::

::: proof
**Step 1（埋め込み次元）.** $\bar A=A/xA$, $\bar{\mathfrak{m}}=\mathfrak{m}/xA$ とすると、$\mathfrak{m}/\mathfrak{m}^{2}\to\bar{\mathfrak{m}}/\bar{\mathfrak{m}}^{2}$ は全射で核は $\bar x$ で張られる（$\bar{\mathfrak{m}}^{2}=(\mathfrak{m}^{2}+xA)/xA$）。$x\notin\mathfrak{m}^{2}$ なので $\bar x\neq 0$ で、$\operatorname{edim}\bar A=\operatorname{edim}A-1$。

**Step 2（1）.** \ref{ring:dimension-corollaries.3} から $\dim\bar A\ge\dim A-1=\operatorname{edim}A-1=\operatorname{edim}\bar A\ge\dim\bar A$。よって等号で $\bar A$ は正則、$\dim\bar A=\dim A-1$。

**Step 3（2）.** 非零因子なので $\dim\bar A=\dim A-1$（\ref{ring:dimension-corollaries.3}）。$\operatorname{edim}A=\operatorname{edim}\bar A+1=\dim\bar A+1=\dim A$。

**Step 4（3）.** 1 を繰り返すと（各段階で正則局所環は整域なので $x_{i}$ は非零因子）、$\mathfrak{m}/\mathfrak{m}^{2}$ で一次独立な $x_{1},\dots,x_{i}$ について $A/(x_{1},\dots,x_{i})$ は正則で次元 $\dim A-i$。逆に $A/(x_{1},\dots,x_{i})$ が $\dim A-i$ 次元で正則なら、Step 1 と同様に $\operatorname{edim}A/(x_{1},\dots,x_{i})=\operatorname{edim}A-r$（$r$ は $\bar x_{j}$ の張る次元）で、$\dim A-i=\operatorname{edim}A-r=\dim A-r$ なので $r=i$、一次独立。
:::

::: proposition 完備化と正則性 {#ring:regular-completion keywords="A is regular iff its completion is regular" index="完備化と正則性|かんびかとせいそくせい"}
（AC）ネーター局所環 $A$ が正則であることと、その $\mathfrak{m}$ 進完備化 $\hat A$ が正則であることは同値である。
:::

::: proof
$\hat A$ はネーター局所環で $\hat A/\hat{\mathfrak{m}}^{n}\cong A/\mathfrak{m}^{n}$（\ref{ring:completion-noetherian}、$\hat{\mathfrak{m}}=\mathfrak{m}\hat A$）。よってヒルベルト＝サミュエル関数が一致し、次元定理から $\dim\hat A=\dim A$。また $n=2$ から $\hat{\mathfrak{m}}/\hat{\mathfrak{m}}^{2}\cong\mathfrak{m}/\mathfrak{m}^{2}$ で埋め込み次元も一致する。
:::

::: lemma 余接空間と微分 {#ring:cotangent-derivative keywords="for a maximal ideal P of k[x_1..x_n] with separable residue field L, f -> (df/dx_j mod P) induces an isomorphism P/P^2 = L^n" index="余接空間と微分|よせつくうかんとびぶん"}
（AC）体 $k$、$R=k[x_{1},\dots,x_{n}]$、極大イデアル $P$ と $L\defeq R/P$ とし、$L/k$ は分離拡大とする（$L$ は $k$ 上有限次。\ref{ring:zariski-lemma}）。$D(f)\defeq(\partial f/\partial x_{1}\bmod P,\dots,\partial f/\partial x_{n}\bmod P)$ は $L$ 線形な同型 $\bar D\colon P/P^{2}\to L^{n}$ を誘導する。
:::

::: proof
**Step 1（$L$ 線形写像）.** ライプニッツ則（\ref{ring:multiple-root.1}）から $D(hf)=\bar hD(f)+\bar fD(h)$。$f\in P$ なら $\bar f=0$ なので $D(hf)=\bar hD(f)$。特に $f,g\in P$ なら $D(fg)=0$ で、$D$ は $L$ 線形写像 $\bar D\colon P/P^{2}\to L^{n}$ を誘導する。

**Step 2（全射）.** $\alpha_{j}\defeq\bar x_{j}\in L$ は $k$ 上分離的で、その最小多項式 $g_{j}\in k[t]$ について $g_{j}(x_{j})\in P$、$D(g_{j}(x_{j}))=g_{j}'(\alpha_{j})e_{j}$ で $g_{j}'(\alpha_{j})\neq 0$（\ref{fld:separable-criterion}）。よって $e_{j}$ は像に入る。

**Step 3（$\dim_{L}P/P^{2}\le n$）.** $Q\defeq(g_{1}(x_{1}),\dots,g_{n}(x_{n}))\subset P$ とする。$C_{i}\defeq k[x_{1},\dots,x_{i}]/(g_{1}(x_{1}),\dots,g_{i}(x_{i}))$ が体の有限直積であることを $i$ の帰納法で示す。$C_{i-1}\cong\prod_{s}F_{s}$（$F_{s}\supset k$ は体）なら $C_{i}\cong C_{i-1}[t]/(g_{i})\cong\prod_{s}F_{s}[t]/(g_{i})$。$g_{i}$ は $k[t]$ で $g_{i}'$ と互いに素（$ug_{i}+vg_{i}'=1$）なので $F_{s}[t]$ でも分離的で、相異なるモニック既約因子の積に分かれ、中国剰余定理（\ref{ring:chinese-remainder}）から $F_{s}[t]/(g_{i})$ は体の直積。よって $R/Q=C_{n}$ は体の有限直積で、そのイデアル $P/Q$ は（各成分が $0$ か全体の直積なので）冪等元 $e$ で生成され、$(P/Q)^{2}=P/Q$。すなわち $P=P^{2}+Q$ で、$P/P^{2}$ は $g_{j}(x_{j})$ の像 $n$ 個で張られる。

**Step 4.** Step 2・3 から $\bar D$ は $n$ 次元以下の空間から $L^{n}$ への全射で、同型。
:::

::: theorem ヤコビアンの判定法 {#ring:jacobian-criterion keywords="Jacobian criterion for regularity at closed points over a perfect field: edim = n - rank of the Jacobian matrix mod P" index="ヤコビアンの判定法|やこびあんのはんていほう, 非特異点|ひとくいてん"}
（AC）$k$ を完全体（より一般に、以下の $L/k$ が分離的であればよい）、$R=k[x_{1},\dots,x_{n}]$、$f_{1},\dots,f_{m}\in R$、$I=(f_{1},\dots,f_{m})$、$P\supset I$ を極大イデアル、$L=R/P$ とし、$B\defeq(R/I)_{P}$ とする。ヤコビ行列を $P$ を法として $L$ に落としたもの $J(P)\defeq(\partial f_{i}/\partial x_{j}\bmod P)\in M_{m,n}(L)$ について
$$
\operatorname{edim}B=n-\operatorname{rank}_{L}J(P).
$$
したがって $B$ が正則 $\iff\operatorname{rank}_{L}J(P)=n-\dim B$。$P=\mathfrak{m}_{a}=(x_{1}-a_{1},\dots,x_{n}-a_{n})$（有理点 $a\in k^{n}$）なら $L=k$ で、$J(P)=(\partial f_{i}/\partial x_{j}(a))$。
:::

::: proof
**Step 1（余接空間）.** $\mathfrak{m}_{B}/\mathfrak{m}_{B}^{2}\cong P/(P^{2}+I)$（右辺は $P$ に消されるので、$P$ での局所化で変わらない）。

**Step 2（$I$ の像）.** $(I+P^{2})/P^{2}$ は $L$ 上 $f_{1},\dots,f_{m}$ の像で張られる（$hf_{i}\equiv\bar hf_{i}$ の意味で）。\ref{ring:cotangent-derivative} の同型 $\bar D$ で、$f_{i}$ の像は $J(P)$ の第 $i$ 行に写る。よって $\dim_{L}(I+P^{2})/P^{2}=\operatorname{rank}J(P)$ で、$\operatorname{edim}B=n-\operatorname{rank}J(P)$。後半は正則の定義（\ref{ring:regular-local-ring}）。

**Step 3（有理点）.** $L=k$ で、$\partial f/\partial x_{j}\bmod\mathfrak{m}_{a}$ は値 $\partial f/\partial x_{j}(a)$。$k$ が完全体でなくても $L=k/k$ は分離的。
:::

::: hypcheck
- **前提「$L/k$ が分離的」**：\ref{ring:cotangent-derivative} の Step 2・3 に使った。外すと偽：$k=\mathbb{F}_{p}(t)$, $n=1$, $f=x^{p}-t$（既約）、$P=(f)$ では $B=R/P=L$ は体（$0$ 次元の正則局所環）だが、$f'=0$ なので $\operatorname{rank}J=0\neq n-\dim B=1$。
- **選択公理**：ザリスキの補題と正則局所環の次元論を通して使う。
:::

::: supplement
**このサイトでの続き.**
- 正則局所環の素イデアルでの局所化は正則（セール。\ref{ring:regular-localization}）。
- 正則局所環は一意分解環（アウスランダー＝ブクスバウム。\ref{ring:regular-ufd}）。
- 正則局所環はコーエン＝マコーレー環（\ref{ring:page-cohen-macaulay}）。正則なパラメーター系は正則列である。
- ヤコビアンの判定法（\ref{ring:jacobian-criterion}）は、完全体上の閉点（極大イデアル）すべてで使える。幾何の「非特異点」の定義がこの条件である。ケーラー微分を使うと、$\bar D$ は余接完全列 $P/P^{2}\to\Omega_{R/k}\otimes L\to\Omega_{L/k}\to 0$ の一部と解釈でき、分離性は $\Omega_{L/k}=0$ に対応する。

**高い視点.** $\mathfrak{m}/\mathfrak{m}^{2}$ の双対 $(\mathfrak{m}/\mathfrak{m}^{2})^{*}$ は点での**ザリスキ接空間**で、\ref{ring:regular-gr} は「正則点では接錐が接空間全体（線形空間）になる」ことを言っている。特異点では接錐が線形でない錐（例：$y^{2}=x^{2}$ の二本の直線、$y^{2}=0$ の重直線）になる（\ref{ring:associated-graded} の後の例）。
:::

## 問題 {#ring:sec-rl-problems}

::: problem {#ring:prob-regular-hypersurface}
$(A,\mathfrak{m})$ を正則局所環、$0\neq f\in\mathfrak{m}$ とする。$A/(f)$ が正則であることと、$f\notin\mathfrak{m}^{2}$ であることは同値であることを示せ。
:::

::: solution
$f\notin\mathfrak{m}^{2}$ なら \ref{ring:regular-quotient.1} から正則。$f\in\mathfrak{m}^{2}$ なら、$\operatorname{edim}A/(f)=\operatorname{edim}A$（$\mathfrak{m}/\mathfrak{m}^{2}\to\bar{\mathfrak{m}}/\bar{\mathfrak{m}}^{2}$ が同型）で、$f\neq 0$ は整域 $A$ の非零因子なので $\dim A/(f)=\dim A-1$（\ref{ring:dimension-corollaries.3}）。よって $\operatorname{edim}>\dim$ で正則でない。
:::

::: problem {#ring:prob-regular-node}
$A=k[[x,y]]/(y^{2}-x^{2}-x^{3})$（結節点）が正則でないことを示し、$\operatorname{gr}_{\mathfrak{m}}(A)$ を求めよ。
:::

::: solution
$f=y^{2}-x^{2}-x^{3}\in\mathfrak{m}^{2}$（$\mathfrak{m}=(x,y)$ in $k[[x,y]]$）なので、前問から正則でない（$k[[x,y]]$ は正則）。$\operatorname{gr}_{\mathfrak{m}}(A)\cong k[X,Y]/(Y^{2}-X^{2})$（$f$ の最低次の斉次部分。\ref{ring:associated-graded} の後の例 2）で、これは整域でない（$(Y-X)(Y+X)=0$）。実は $A$ 自身も整域でない：$k$ の標数が $2$ でなければ $1+x$ は $k[[x]]$ に平方根 $u=\sum_{n}\binom{1/2}{n}x^{n}$ をもち、$y^{2}-x^{2}(1+x)=(y-xu)(y+xu)$ と分解する。多項式環の局所化 $k[x,y]_{(x,y)}/(f)$ は整域だが、完備化すると結節点が「二本の枝」に分かれる。
:::
