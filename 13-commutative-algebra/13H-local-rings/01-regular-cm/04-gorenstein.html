# ゴレンシュタイン環 {#ring:page-gorenstein keywords="Gorenstein local ring, injective dimension, Bass theorem injdim = depth, Rees lemma, socle, type of a local ring, complete intersection, hierarchy regular complete intersection Gorenstein Cohen-Macaulay"}

正則局所環とコーエン＝マコーレー環の間には、**完全交叉**と**ゴレンシュタイン環**という二つの中間のクラスがある：
$$
\text{正則}\ \Rightarrow\ \text{完全交叉}\ \Rightarrow\ \text{ゴレンシュタイン}\ \Rightarrow\ \text{CM}.
$$
ゴレンシュタイン環は「環自身が有限な入射次元をもつ」局所環で（\ref{ring:gorenstein}）、0 次元の場合は「ソークル（極大イデアルで消える元の全体）が 1 次元」という具体的な条件になる（\ref{ring:artinian-gorenstein}）。このページでは、入射次元が $\operatorname{Ext}(k,-)$ で計算できること（\ref{ring:injdim-ext-k}）、有限なら深さに等しいこと（バスの定理 \ref{ring:bass-theorem}）、非零因子で割ると $\operatorname{Ext}$ の次数が一つずれること（リースの補題 \ref{ring:rees-lemma}）を示し、それらを組み合わせて特徴付け（\ref{ring:gorenstein-characterization}）と包含関係（\ref{ring:gorenstein-hierarchy}）を証明する。

> 松村『可換環論』§18 の流れを参考にした。各補題の証明は、入射加群の構造論（マトリス双対）を使わない形に組み直した。

## 記法と定義の確認 {#ring:sec-go-notation}

::: notation
- $(A,\mathfrak{m},k)$ はネーター局所環。CM 環とパラメーター系は \ref{ring:page-cohen-macaulay}、正則局所環は \ref{ring:page-regular-local-rings}、深さは \ref{ring:depth-ext}、コシュル複体は \ref{ring:page-koszul-depth}。
- 入射加群・十分な入射対象・ベールの判定法は \ref{ha:page-injective-modules}, \ref{ha:enough-injectives}, \ref{ha:baer-criterion}。$\operatorname{Ext}$ は第 1 変数の射影分解でも第 2 変数の入射分解でも計算できる（\ref{ha:ext-balance}）。入射加群 $E$ について $\operatorname{Ext}^{i}(-,E)=0$（$i\ge 1$。\ref{ha:ext-vanish-injective}）。
- 加群 $M$ の**入射次元** $\operatorname{injdim}M$ は、入射分解 $0\to M\to E^{0}\to\cdots\to E^{n}\to 0$ の長さ $n$ の最小値（なければ $\infty$）。
- 加群 $M$ の**ソークル**を $\operatorname{Soc}M\defeq(0:_{M}\mathfrak{m})=\{x\in M : \mathfrak{m}x=0\}$ とする。$k$ ベクトル空間で、$\cong\Hom_{A}(k,M)$。長さ $\ell$ は \ref{ring:length}, \ref{ring:length-properties}。
- 素イデアルによるフィルトレーション（\ref{ring:prime-filtration}）$0=M_{0}\subset\cdots\subset M_{n}=M$, $M_{i}/M_{i-1}\cong A/\mathfrak{p}_{i}$ では、$A/\mathfrak{p}_{i}$ が $M$ の部分商なので $\mathfrak{p}_{i}\supset\operatorname{Ann}M$。
- **選択公理**：十分な入射対象・素イデアルの回避・中山の補題・深さの理論を通して使う。
:::

## 定義 {#ring:sec-go-definition}

::: definition ゴレンシュタイン局所環 {#ring:gorenstein keywords="Gorenstein local ring, finite injective dimension" index="ゴレンシュタイン環|ごれんしゅたいんかん"}
ネーター局所環 $A$ が $A$ 加群として有限な入射次元をもつとき、**ゴレンシュタイン局所環**という。
:::

::: definition 完全交叉 {#ring:complete-intersection keywords="complete intersection ring" index="完全交叉|かんぜんこうさ"}
ネーター局所環 $A$ の完備化 $\hat A$ が、ある完備正則局所環 $R$ を $R$ 正則列 $f_{1},\dots,f_{r}$ で割った環 $R/(f_{1},\dots,f_{r})$ に同型なとき、$A$ を**完全交叉**という。
:::

## 入射次元の計算 {#ring:sec-go-injdim}

::: lemma 入射次元の判定 {#ring:injdim-criterion keywords="injdim M <= n iff Ext^{n+1}(A/p,M)=0 for all primes p" index="入射次元の判定|にゅうしゃじげんのはんてい"}
（AC）$A$ をネーター環、$M$ を $A$ 加群、$n\ge 0$ とする。次は同値。
1. $\operatorname{injdim}M\le n$。
2. すべての $X$ と $i>n$ で $\operatorname{Ext}^{i}(X,M)=0$。
3. すべてのイデアル $I$ で $\operatorname{Ext}^{n+1}(A/I,M)=0$。
4. すべての素イデアル $\mathfrak{p}$ で $\operatorname{Ext}^{n+1}(A/\mathfrak{p},M)=0$。
:::

::: proof
**Step 1（1⇒2⇒3⇒4）.** 長さ $n$ 以下の入射分解で $\operatorname{Ext}$ を計算する（\ref{ha:ext-balance}）と、$i>n$ の項は $0$。残りは明らか。

**Step 2（4⇒3）.** $A/I$ の素イデアルによるフィルトレーションの各段 $0\to M_{j-1}\to M_{j}\to A/\mathfrak{p}_{j}\to 0$ の長完全列 $\operatorname{Ext}^{n+1}(A/\mathfrak{p}_{j},M)\to\operatorname{Ext}^{n+1}(M_{j},M)\to\operatorname{Ext}^{n+1}(M_{j-1},M)$ から、$j$ についての帰納法で $\operatorname{Ext}^{n+1}(M_{j},M)=0$。

**Step 3（3⇒1）.** \ref{ring:auslander-global-dimension} の Step 2–4 と同じく、入射加群 $E^{j}$ と短完全列 $0\to C^{j}\to E^{j}\to C^{j+1}\to 0$（$C^{0}=M$）を作ると、$\operatorname{Ext}^{1}(A/I,C^{n})\cong\operatorname{Ext}^{n+1}(A/I,M)=0$ からベールの判定法で $C^{n}$ は入射的。$0\to M\to E^{0}\to\cdots\to E^{n-1}\to C^{n}\to 0$ は長さ $n$ の入射分解。
:::

::: lemma Ext と局所化 {#ring:ext-localization keywords="Ext of finitely generated modules commutes with localization" index="Ext と局所化|えくすとときょくしょか"}
$A$ をネーター環、$N$ を有限生成加群、$M$ を加群、$S$ を積閉集合とすると、$S^{-1}\operatorname{Ext}^{i}_{A}(N,M)\cong\operatorname{Ext}^{i}_{S^{-1}A}(S^{-1}N,S^{-1}M)$。特に素イデアル $\mathfrak{p}$ について $\operatorname{Ext}^{i}_{A}(A/\mathfrak{p},M)_{\mathfrak{p}}\cong\operatorname{Ext}^{i}_{A_{\mathfrak{p}}}(\kappa(\mathfrak{p}),M_{\mathfrak{p}})$（$\kappa(\mathfrak{p})=A_{\mathfrak{p}}/\mathfrak{p}A_{\mathfrak{p}}$）。
:::

::: proof
$N$ の自由分解 $F$ で各 $F_{j}$ が有限階数のものをとる（$A$ はネーターなのでシジジーは有限生成）。$F_{j}=A^{r}$ について $S^{-1}\Hom_{A}(A^{r},M)=S^{-1}M^{r}=\Hom_{S^{-1}A}(S^{-1}A^{r},S^{-1}M)$ で、これは微分と可換。局所化は完全（\ref{ring:localization-exact}）なのでコホモロジーと可換で、$S^{-1}F$ は $S^{-1}N$ の自由分解。$(A/\mathfrak{p})_{\mathfrak{p}}\cong\kappa(\mathfrak{p})$ は局所化の完全性から。
:::

::: theorem 入射次元と Ext(k,-) {#ring:injdim-ext-k keywords="for finitely generated M over a noetherian local ring, injdim M = sup{i : Ext^i(k,M) != 0}" index="入射次元と剰余体|にゅうしゃじげんとじょうよたい"}
（AC）$(A,\mathfrak{m},k)$ をネーター局所環、$M$ を有限生成加群とすると、$\operatorname{injdim}M=\sup\{i : \operatorname{Ext}^{i}_{A}(k,M)\neq 0\}$。
:::

::: proof
**Step 1（$\ge$）.** \ref{ring:injdim-criterion} の 1⇒2。

**Step 2（設定）.** 右辺 $n$ が有限のとき、すべての素イデアル $\mathfrak{p}$ と $i>n$ で $\operatorname{Ext}^{i}(A/\mathfrak{p},M)=0$ を $\dim A/\mathfrak{p}$ についての帰納法で示せば、\ref{ring:injdim-criterion} の 4⇒1 から $\operatorname{injdim}M\le n$。$\dim A/\mathfrak{p}=0$ なら $\mathfrak{p}=\mathfrak{m}$ で仮定そのもの。

**Step 3（帰納法）.** $\mathfrak{p}\neq\mathfrak{m}$ とし $x\in\mathfrak{m}\setminus\mathfrak{p}$ をとる。$0\to A/\mathfrak{p}\xrightarrow{x}A/\mathfrak{p}\to A/(\mathfrak{p}+xA)\to 0$ は完全（$A/\mathfrak{p}$ は整域）。$A/(\mathfrak{p}+xA)$ のフィルトレーションの素イデアル $\mathfrak{q}$ は $\mathfrak{p}+xA$ を含むので $\mathfrak{q}\supsetneq\mathfrak{p}$、$\dim A/\mathfrak{q}<\dim A/\mathfrak{p}$。帰納法の仮定から各 $\operatorname{Ext}^{i}(A/\mathfrak{q},M)=0$（$i>n$）で、\ref{ring:injdim-criterion} の Step 2 と同じフィルトレーションの議論から $\operatorname{Ext}^{i}(A/(\mathfrak{p}+xA),M)=0$（$i>n$）。

**Step 4（中山）.** $i>n$ について長完全列 $\operatorname{Ext}^{i}(A/\mathfrak{p},M)\xrightarrow{x}\operatorname{Ext}^{i}(A/\mathfrak{p},M)\to\operatorname{Ext}^{i+1}(A/(\mathfrak{p}+xA),M)=0$ から $x$ 倍は全射。$\operatorname{Ext}^{i}(A/\mathfrak{p},M)$ は有限生成（有限階数の自由分解で計算）で $x\in\mathfrak{m}$ なので、中山の補題（\ref{ring:nakayama}）から $0$。
:::

::: lemma バスの補題 {#ring:bass-lemma keywords="if Ext^i(kappa(p),M_p) != 0 and q is a prime just above p then Ext^{i+1}(kappa(q),M_q) != 0" index="バスの補題|ばすのほだい"}
（AC）$A$ をネーター環、$M$ を有限生成加群、$\mathfrak{p}\subsetneq\mathfrak{q}$ を間に素イデアルのない素イデアルとする。$\operatorname{Ext}^{i}_{A_{\mathfrak{p}}}(\kappa(\mathfrak{p}),M_{\mathfrak{p}})\neq 0$ なら $\operatorname{Ext}^{i+1}_{A_{\mathfrak{q}}}(\kappa(\mathfrak{q}),M_{\mathfrak{q}})\neq 0$。
:::

::: proof
**Step 1（局所化）.** $A_{\mathfrak{q}}$ に移っても仮定と結論は変わらない（$(A_{\mathfrak{q}})_{\mathfrak{p}A_{\mathfrak{q}}}=A_{\mathfrak{p}}$）ので、$A$ は局所環、$\mathfrak{q}=\mathfrak{m}$, $\dim A/\mathfrak{p}=1$ とする。$\operatorname{Ext}^{i+1}(k,M)=0$ と仮定して矛盾を導く。

**Step 2.** $x\in\mathfrak{m}\setminus\mathfrak{p}$ をとる。$A/(\mathfrak{p}+xA)$ を含む素イデアルは $\mathfrak{m}$ だけなので、そのフィルトレーションの段はすべて $k$ で、長完全列から $\operatorname{Ext}^{i+1}(A/(\mathfrak{p}+xA),M)=0$。\ref{ring:injdim-ext-k} の Step 4 と同じく $x$ 倍が $\operatorname{Ext}^{i}(A/\mathfrak{p},M)$ 上で全射になり、中山の補題から $\operatorname{Ext}^{i}(A/\mathfrak{p},M)=0$。$\mathfrak{p}$ で局所化すると \ref{ring:ext-localization} から $\operatorname{Ext}^{i}_{A_{\mathfrak{p}}}(\kappa(\mathfrak{p}),M_{\mathfrak{p}})=0$ で、仮定に反する。
:::

::: theorem バスの定理 {#ring:bass-theorem keywords="Bass: injdim M = depth A when finite; Gorenstein rings are Cohen-Macaulay with injdim A = dim A" index="バスの定理|ばすのていり"}
（AC）$(A,\mathfrak{m},k)$ を $d$ 次元のネーター局所環とする。
1. 有限生成加群 $M\neq 0$ の入射次元が有限なら $\operatorname{injdim}M=\operatorname{depth}A$。
2. $A$ がゴレンシュタインなら $A$ は CM で、$\operatorname{injdim}A=d$。
:::

::: proof
**Step 1（設定）.** $t\defeq\operatorname{depth}A$、$x_{1},\dots,x_{t}\in\mathfrak{m}$ を極大な $A$ 正則列、$r\defeq\operatorname{injdim}M$ とする。$K=K(\boldsymbol{x};A)$ は $A/(\boldsymbol{x})$ の長さ $t$ の自由分解（\ref{ring:koszul-regular-acyclic}）なので、$\operatorname{Ext}^{i}(A/(\boldsymbol{x}),M)=0$（$i>t$）。

**Step 2（$r\ge t$）.** $\operatorname{Ext}^{t}(A/(\boldsymbol{x}),M)$ は $\Hom(K_{t-1},M)=M^{t}\to\Hom(K_{t},M)=M$ の余核。$K_{t}=A\to K_{t-1}=A^{t}$ の成分は $\pm x_{1},\dots,\pm x_{t}$（\ref{ring:koszul-complex} の定義から帰納法で：$d(a,0)=(-d'a,x_{t}a)$）なので、像は $(\boldsymbol{x})M$ で、$\operatorname{Ext}^{t}\cong M/(\boldsymbol{x})M\neq 0$（中山の補題）。\ref{ring:injdim-criterion} の 2 から $r\ge t$。

**Step 3（$r\le t$）.** $A/(\boldsymbol{x})$ の深さは $0$（列は極大）なので $\mathfrak{m}\in\operatorname{Ass}(A/(\boldsymbol{x}))$ で、短完全列 $0\to k\to A/(\boldsymbol{x})\to C\to 0$ がある。長完全列 $\operatorname{Ext}^{r}(A/(\boldsymbol{x}),M)\to\operatorname{Ext}^{r}(k,M)\to\operatorname{Ext}^{r+1}(C,M)=0$ と、$\operatorname{Ext}^{r}(k,M)\neq 0$（\ref{ring:injdim-ext-k}）から $\operatorname{Ext}^{r}(A/(\boldsymbol{x}),M)\neq 0$。Step 1 から $r\le t$。

**Step 4（2：CM）.** $\dim A/\mathfrak{p}=d$ となる極小素イデアル $\mathfrak{p}$ と、長さ $d$ の鎖 $\mathfrak{p}=\mathfrak{p}_{0}\subsetneq\cdots\subsetneq\mathfrak{p}_{d}=\mathfrak{m}$ をとる（長さ最大なので各段の間に素イデアルはない）。$\mathfrak{p}\in\operatorname{Ass}A$（\ref{ring:ass-localization} の 2）なので $\mathfrak{p}A_{\mathfrak{p}}\in\operatorname{Ass}A_{\mathfrak{p}}$ で、$\Hom_{A_{\mathfrak{p}}}(\kappa(\mathfrak{p}),A_{\mathfrak{p}})\neq 0$。バスの補題（\ref{ring:bass-lemma}）を $d$ 回使うと $\operatorname{Ext}^{d}(k,A)\neq 0$、よって $\operatorname{injdim}A\ge d$。1 から $\operatorname{injdim}A=\operatorname{depth}A\le d$（\ref{ring:depth-le-dim}）。よって $\operatorname{depth}A=d$。
:::

## リースの補題 {#ring:sec-go-rees}

::: lemma リースの補題 {#ring:rees-lemma keywords="Rees lemma: Ext^{i+1}_A(N,M) = Ext^i_{A/x}(N,M/xM) for x regular on A and M, N an A/x-module" index="リースの補題|りーすのほだい"}
（AC）$A$ を環、$x\in A$ を $A$ と $A$ 加群 $M$ の両方の非零因子、$B=A/xA$、$N$ を $B$ 加群とする。すべての $i\ge 0$ で $\operatorname{Ext}^{i+1}_{A}(N,M)\cong\operatorname{Ext}^{i}_{B}(N,M/xM)$、また $\Hom_{A}(N,M)=0$。
:::

::: proof
**Step 1（$\operatorname{Ext}_{A}(B,M)$）.** $0\to A\xrightarrow{x}A\to B\to 0$ は $B$ の射影分解なので、$\operatorname{Ext}^{0}_{A}(B,M)=(0:_{M}x)=0$、$\operatorname{Ext}^{1}_{A}(B,M)=M/xM$、$\operatorname{Ext}^{j}_{A}(B,M)=0$（$j\ge 2$）。$N$ は $x$ に消されるので $\Hom_{A}(N,M)\subset\Hom_{A}(N,(0:_{M}x))=0$。

**Step 2（入射分解を $B$ に落とす）.** $M$ の $A$ 入射分解 $E^{\bullet}$ をとり、$I^{j}\defeq\Hom_{A}(B,E^{j})=(0:_{E^{j}}x)$ とおく。$B$ 加群 $N$ について $\Hom_{B}(N,I^{j})\cong\Hom_{A}(N,E^{j})$（$N$ の元の像は自動的に $x$ に消される）で、右辺は $N$ について完全なので $I^{j}$ は入射的 $B$ 加群。\ref{ha:ext-balance} と Step 1 から $H^{j}(I^{\bullet})=\operatorname{Ext}^{j}_{A}(B,M)$ は $j=1$ で $M/xM$、他で $0$。

**Step 3（切り詰め）.** $H^{0}=0$ なので $d\colon I^{0}\to I^{1}$ は単射で、$I^{0}$ が入射的なので $I^{1}=d(I^{0})\oplus J$ と分解する。$d\circ d=0$ から $d$ は $d(I^{0})$ 上で $0$ なので、複体は $[I^{0}\xrightarrow{\cong}d(I^{0})]\oplus[0\to J\to I^{2}\to I^{3}\to\cdots]$ と分かれる。後者は $J$ の位置で $H=M/xM$、他で完全なので、$0\to M/xM\to J\to I^{2}\to\cdots$ は $M/xM$ の $B$ 入射分解（$J$ は入射加群の直和因子）。

**Step 4（比較）.** $\operatorname{Ext}^{i+1}_{A}(N,M)=H^{i+1}(\Hom_{A}(N,E^{\bullet}))=H^{i+1}(\Hom_{B}(N,I^{\bullet}))$。前者の直和成分 $\Hom_{B}(N,I^{0})\to\Hom_{B}(N,d(I^{0}))$ は同型でコホモロジーに寄与しないので、これは $J$ から始まる複体の $i$ 番目のコホモロジー $\operatorname{Ext}^{i}_{B}(N,M/xM)$ に等しい。
:::

::: corollary 正則列で割ること {#ring:rees-regular-sequence keywords="Ext^{i+r}_A(k,A) = Ext^i_{A/(x)}(k,A/(x)) for an A-regular sequence of length r" index="正則列とリースの補題|せいそくれつとりーすのほだい"}
（AC）$(A,\mathfrak{m},k)$ をネーター局所環、$x_{1},\dots,x_{r}\in\mathfrak{m}$ を $A$ 正則列、$\bar A=A/(\boldsymbol{x})$ とする。すべての $i\ge 0$ で $\operatorname{Ext}^{i+r}_{A}(k,A)\cong\operatorname{Ext}^{i}_{\bar A}(k,\bar A)$。特に $\operatorname{injdim}_{A}A<\infty\iff\operatorname{injdim}_{\bar A}\bar A<\infty$。
:::

::: proof
$A_{j}\defeq A/(x_{1},\dots,x_{j})$ とすると、$x_{j+1}$ は環 $A_{j}$ の非零因子で、$k$ は $A_{j+1}$ 加群。リースの補題を環 $A_{j}$、$M=A_{j}$ に使うと $\operatorname{Ext}^{i+1}_{A_{j}}(k,A_{j})\cong\operatorname{Ext}^{i}_{A_{j+1}}(k,A_{j+1})$。$j=0,\dots,r-1$ と並べる。後半は \ref{ring:injdim-ext-k}。
:::

## 0 次元の場合 {#ring:sec-go-artinian}

::: theorem アルティン局所環のゴレンシュタイン性 {#ring:artinian-gorenstein keywords="an artinian local ring is Gorenstein iff self-injective iff its socle is one-dimensional" index="ソークル|そーくる, 台座|だいざ, 自己入射的|じこにゅうしゃてき"}
（AC）$(A,\mathfrak{m},k)$ をアルティン局所環とする。次は同値。
1. $A$ はゴレンシュタイン。
2. $A$ は $A$ 加群として入射的。
3. $\dim_{k}\operatorname{Soc}A=1$。
:::

::: proof
**Step 1（1⇔2）.** \ref{ring:bass-theorem} から $\operatorname{injdim}A=\dim A=0$ と同値。

**Step 2（2⇒3）.** $\operatorname{Soc}A\neq 0$（$\mathfrak{m}$ は冪零なので、$\mathfrak{m}^{s}\neq 0=\mathfrak{m}^{s+1}$ となる $s$ について $\mathfrak{m}^{s}\subset\operatorname{Soc}A$）。一次独立な $s_{1},s_{2}\in\operatorname{Soc}A$ があるとする。$I=ks_{1}\oplus ks_{2}$ はイデアルで、$\varphi(s_{1})=s_{1}$, $\varphi(s_{2})=0$ は $A$ 線形写像 $I\to A$（$\mathfrak{m}$ は $I$ を消すので $k$ 線形なら $A$ 線形）。入射性から $\varphi$ はある $a\in A$ 倍に延びる。$as_{1}=s_{1}\neq 0$ から $a\notin\mathfrak{m}$、$a$ は単元で、$as_{2}=0$ から $s_{2}=0$、矛盾。

**Step 3（3⇒2：長さの不等式）.** $\dim\operatorname{Soc}A=1$ とする。有限生成加群 $N$ について $\ell(\Hom(N,A))\le\ell(N)$ を $\ell(N)$ の帰納法で示す。$N=k$ なら $\Hom(k,A)\cong\operatorname{Soc}A$ で等号。一般には $0\to N'\to N\to k\to 0$ をとり、$0\to\Hom(k,A)\to\Hom(N,A)\to\Hom(N',A)$ から $\ell(\Hom(N,A))\le 1+\ell(N')=\ell(N)$（\ref{ring:length-properties} の 3）。

**Step 4（3⇒2：$\operatorname{Ext}^{1}(k,A)=0$）.** $0\to\mathfrak{m}\to A\to k\to 0$ から完全列 $A=\Hom(A,A)\xrightarrow{\rho}\Hom(\mathfrak{m},A)\to\operatorname{Ext}^{1}(k,A)\to 0$。$\rho$ の核は $(0:_{A}\mathfrak{m})=\operatorname{Soc}A$ なので $\ell(\operatorname{Im}\rho)=\ell(A)-1=\ell(\mathfrak{m})\ge\ell(\Hom(\mathfrak{m},A))$（Step 3）。よって $\rho$ は全射で $\operatorname{Ext}^{1}(k,A)=0$。$A$ の素イデアルは $\mathfrak{m}$ だけなので、\ref{ring:injdim-criterion}（$n=0$）から $A$ は入射的。
:::

::: proposition ソークルの計算 {#ring:socle-examples keywords="socle computations: k[x]/(x^n) is Gorenstein, k[x,y]/(x^2,xy,y^2) has two-dimensional socle" index="ソークルの計算|そーくるのけいさん"}
体 $k$ について、
1. $A=k[x]/(x^{n})$（$n\ge 1$）のソークルは $kx^{n-1}$ で $1$ 次元。
2. $A=k[x,y]/(x^{2},xy,y^{2})$ のソークルは $kx\oplus ky$ で $2$ 次元。
3. $A=k[x,y,z]/I$, $I=(xy,\ xz,\ yz,\ x^{2}-y^{2},\ x^{2}-z^{2})$ は $k$ 上 $1,x,y,z,x^{2}$ を基底にもち、ソークルは $kx^{2}$ で $1$ 次元。
:::

::: proof
いずれも $\mathfrak{m}$ は変数の像で生成され、$A$ は有限次元なのでアルティン局所環（\ref{ring:prob-finite-dim-algebra}）。ソークルは「すべての変数を掛けて $0$ になる元」。

**Step 1（1）.** 基底 $1,x,\dots,x^{n-1}$。$f=\sum c_{i}x^{i}$ について $xf=\sum_{i<n-1}c_{i}x^{i+1}$ が $0$ $\iff c_{0}=\dots=c_{n-2}=0$。

**Step 2（2）.** 基底 $1,x,y$。$f=a+bx+cy$ について $xf=ax$, $yf=ay$ なので、$\mathfrak{m}f=0\iff a=0$。

**Step 3（3：基底）.** $I$ の関係式から、次数 $2$ の単項式は $x^{2}=y^{2}=z^{2}$ と $xy=xz=yz=0$ をみたす。次数 $3$ の単項式は、二つの異なる変数を含めば $xy$, $xz$, $yz$ のどれかで割り切れて $0$、一つの変数だけなら $x^{3}=x\cdot x^{2}=x\cdot y^{2}=(xy)y=0$（$y^{3}$, $z^{3}$ も同様）なので、次数 $3$ 以上の部分は $0$。よって $A$ は $1,x,y,z,x^{2}$ で張られる。これらが一次独立であることは、$I$ が斉次で、次数 $0,1$ の部分に $I$ の元がなく、次数 $2$ の部分 $I_{2}=\langle xy,xz,yz,x^{2}-y^{2},x^{2}-z^{2}\rangle$ が $6$ 次元の空間の $5$ 次元部分空間であることからわかる（$A_{2}$ は $1$ 次元で $x^{2}$ の像が張る）。

**Step 4（3：ソークル）.** $f=a+bx+cy+dz+ex^{2}$ について $xf=ax+bx^{2}$, $yf=ay+cy^{2}=ay+cx^{2}$, $zf=az+dx^{2}$。すべて $0$ $\iff a=b=c=d=0$。よってソークルは $kx^{2}$。
:::

## 特徴付け {#ring:sec-go-characterization}

::: theorem ゴレンシュタイン環の特徴付け {#ring:gorenstein-characterization keywords="Gorenstein iff CM of type one iff socle of A/(x) is one-dimensional for a system of parameters" index="ゴレンシュタイン環の特徴付け|ごれんしゅたいんかんのとくちょうづけ, 型|かた"}
（AC）$d$ 次元のネーター局所環 $(A,\mathfrak{m},k)$ について、次は同値である。
1. $A$ はゴレンシュタイン局所環。このとき $\operatorname{injdim}A=d$。
2. $\operatorname{Ext}^{i}_{A}(k,A)=0$（$i\neq d$）かつ $\dim_{k}\operatorname{Ext}^{d}_{A}(k,A)=1$。
3. $A$ は CM で、あるパラメーター系 $x_{1},\dots,x_{d}$ について $\dim_{k}\operatorname{Soc}(A/(x_{1},\dots,x_{d}))=1$。
4. $A$ は CM で、すべてのパラメーター系について 3 が成り立つ。

$A$ が CM のとき $r(A)\defeq\dim_{k}\operatorname{Ext}^{d}_{A}(k,A)$ を $A$ の**型**という。任意のパラメーター系について $r(A)=\dim_{k}\operatorname{Soc}(A/(\boldsymbol{x}))$ で、ゴレンシュタイン $\iff r(A)=1$。
:::

::: proof
**Step 1（CM のときの型）.** $A$ が CM なら、パラメーター系 $\boldsymbol{x}$ は正則列（\ref{ring:cm-sop-regular}）で、\ref{ring:rees-regular-sequence} から $\operatorname{Ext}^{d}_{A}(k,A)\cong\Hom_{\bar A}(k,\bar A)=\operatorname{Soc}\bar A$、$\operatorname{Ext}^{d+i}_{A}(k,A)\cong\operatorname{Ext}^{i}_{\bar A}(k,\bar A)$（$\bar A=A/(\boldsymbol{x})$ はアルティン局所環）。また $i<d$ で $\operatorname{Ext}^{i}_{A}(k,A)=0$（\ref{ring:depth-ext}）。

**Step 2（1⇒4）.** \ref{ring:bass-theorem} から $A$ は CM で $\operatorname{injdim}A=d$。任意のパラメーター系について Step 1 から $\operatorname{Ext}^{i}_{\bar A}(k,\bar A)=\operatorname{Ext}^{d+i}_{A}(k,A)=0$（$i\ge 1$）なので、$\bar A$ はゴレンシュタイン（\ref{ring:injdim-ext-k}）で、\ref{ring:artinian-gorenstein} から $\dim\operatorname{Soc}\bar A=1$。

**Step 3（4⇒3）.** 明らか。

**Step 4（3⇒1）.** \ref{ring:artinian-gorenstein} から $\bar A$ はゴレンシュタインで入射的、$\operatorname{Ext}^{i}_{\bar A}(k,\bar A)=0$（$i\ge 1$）。Step 1 から $\operatorname{Ext}^{j}_{A}(k,A)=0$（$j>d$）で、\ref{ring:injdim-ext-k} から $\operatorname{injdim}A\le d$。

**Step 5（1⇔2）.** 1 なら Step 1・2 から 2。2 なら \ref{ring:injdim-ext-k} から $\operatorname{injdim}A\le d$。型の主張は Step 1。
:::

## 包含関係 {#ring:sec-go-hierarchy}

::: lemma 完備化とゴレンシュタイン性 {#ring:gorenstein-completion keywords="A is Gorenstein iff its completion is" index="完備化とゴレンシュタイン性|かんびかとごれんしゅたいんせい"}
（AC）ネーター局所環 $A$ がゴレンシュタインであることと、$\hat A$ がゴレンシュタインであることは同値。
:::

::: proof
$k$ の自由分解 $F$（各項は有限階数）をとる。$\hat A$ は平坦（\ref{ring:completion-flat}）なので $F\otimes_{A}\hat A$ は $k\otimes\hat A=\hat A/\mathfrak{m}\hat A=k$ の自由分解で、$\Hom_{\hat A}(F_{j}\otimes\hat A,\hat A)\cong\Hom_{A}(F_{j},A)\otimes_{A}\hat A$。平坦性からコホモロジーと可換なので $\operatorname{Ext}^{i}_{\hat A}(k,\hat A)\cong\operatorname{Ext}^{i}_{A}(k,A)\otimes_{A}\hat A$。$E=\operatorname{Ext}^{i}_{A}(k,A)$ は $\mathfrak{m}$ に消される有限生成加群なので $E\otimes\hat A\cong\hat E=E$（\ref{ring:completion-tensor}。$\mathfrak{m}E=0$ なので $E$ の $\mathfrak{m}$ 進完備化は $E$）。よって両者の $\operatorname{Ext}(k,-)$ は一致し、\ref{ring:injdim-ext-k} から結論。
:::

::: theorem 包含関係 {#ring:gorenstein-hierarchy keywords="regular implies complete intersection implies Gorenstein implies Cohen-Macaulay; Gorenstein is preserved by localization" index="正則・完全交叉・ゴレンシュタイン・CM|せいそくかんぜんこうさごれんしゅたいんしーえむ"}
（AC）ネーター局所環について、
1. 正則局所環は完全交叉。
2. 完全交叉はゴレンシュタイン。
3. ゴレンシュタイン局所環は CM。
4. ゴレンシュタイン局所環 $A$ の素イデアル $\mathfrak{p}$ での局所化 $A_{\mathfrak{p}}$ はゴレンシュタイン。
:::

::: proof
**Step 1（1）.** $A$ が正則なら $\hat A$ は正則（\ref{ring:regular-completion}）で完備なので、$R=\hat A$, $r=0$ とすればよい。

**Step 2（正則ならゴレンシュタイン）.** $d$ 次元の正則局所環 $R$ の正則なパラメーター系は正則列で、$R/(\boldsymbol{x})=k$。\ref{ring:rees-regular-sequence} から $\operatorname{Ext}^{d+i}_{R}(k,R)\cong\operatorname{Ext}^{i}_{k}(k,k)$ で、これは $i\ge 1$ で $0$（体上の加群はすべて射影的）。\ref{ring:injdim-ext-k} から $\operatorname{injdim}R\le d$。

**Step 3（2）.** $\hat A\cong R/(f_{1},\dots,f_{r})$ とする。Step 2 から $R$ はゴレンシュタインで、\ref{ring:rees-regular-sequence} から $R/(\boldsymbol{f})$ もゴレンシュタイン。\ref{ring:gorenstein-completion} から $A$ もゴレンシュタイン。

**Step 4（3）.** \ref{ring:bass-theorem} の 2。

**Step 5（4）.** $\operatorname{injdim}A=n$ とすると、$A_{\mathfrak{p}}$ の素イデアル $\mathfrak{q}A_{\mathfrak{p}}$ について $\operatorname{Ext}^{n+1}_{A_{\mathfrak{p}}}(A_{\mathfrak{p}}/\mathfrak{q}A_{\mathfrak{p}},A_{\mathfrak{p}})\cong\operatorname{Ext}^{n+1}_{A}(A/\mathfrak{q},A)_{\mathfrak{p}}=0$（\ref{ring:ext-localization}, \ref{ring:injdim-criterion}）。\ref{ring:injdim-criterion}（$A_{\mathfrak{p}}$ に適用）から $\operatorname{injdim}A_{\mathfrak{p}}\le n$。
:::

::: example 包含が真であること {#ring:gorenstein-strict}
1. **CM だがゴレンシュタインでない**：$k[x,y]/(x^{2},xy,y^{2})$ は $0$ 次元で CM、ソークルが $2$ 次元なので型 $2$（\ref{ring:socle-examples} の 2、\ref{ring:artinian-gorenstein}）。
2. **ゴレンシュタインだが完全交叉でない**：$A=k[x,y,z]_{(x,y,z)}/I$（\ref{ring:socle-examples} の 3 の $I$）はソークルが $1$ 次元でゴレンシュタイン。完全交叉でないことは \ref{ring:prob-not-ci} で示す。
3. **完全交叉だが正則でない**：$k[[x,y]]/(y^{2}-x^{3})$（$k[[x,y]]$ を正則列 $y^{2}-x^{3}$ で割った）。
4. $k[x]/(x^{n})$ は完全交叉（$k[[x]]$ を $x^{n}$ で割った）でゴレンシュタイン（\ref{ring:socle-examples} の 1）。
:::

## 問題 {#ring:sec-go-problems}

::: problem {#ring:prob-not-ci}
例 2 の $A$ が完全交叉でないことを示せ。
:::

::: solution
**Step 1（$A$ の不変量）.** $A$ はアルティン局所環なので $\hat A=A$（$\mathfrak{m}^{n}=0$ となる $n$ がある）。$\ell(A)=5$（基底 $1,x,y,z,x^{2}$）、$I\subset(x,y,z)^{2}$ なので $\operatorname{edim}A=3$、$\dim A=0$。

**Step 2（表示を簡約する）.** $A\cong R/(f_{1},\dots,f_{r})$（$R$ は完備正則局所環、$\boldsymbol{f}$ は正則列）と仮定する。ある $f_{i}\notin\mathfrak{m}_{R}^{2}$ なら、並べ替え（\ref{ring:regular-sequence-permutation}）で $i=1$ とし、$R'=R/f_{1}R$ は正則（\ref{ring:regular-quotient}）で完備（有限生成 $R$ 加群は完備。\ref{ring:completion-tensor}）、$f_{2},\dots,f_{r}$ の像は $R'$ 正則列で $A\cong R'/(f_{2},\dots,f_{r})$。これを繰り返して、すべての $f_{i}\in\mathfrak{m}_{R}^{2}$ としてよい。

**Step 3（次元の勘定）.** $(\boldsymbol{f})\subset\mathfrak{m}_{R}^{2}$ なので $\mathfrak{m}_{R}/\mathfrak{m}_{R}^{2}\cong\mathfrak{m}_{A}/\mathfrak{m}_{A}^{2}$、$\dim R=\operatorname{edim}R=3$。正則列で割ると次元は $r$ 下がる（\ref{ring:dimension-corollaries} の 3）ので $r=3$。

**Step 4（長さの下限）.** $\operatorname{gr}R\cong k[X,Y,Z]$（\ref{ring:regular-gr}）なので $\ell(R/\mathfrak{m}_{R}^{3})=1+3+6=10$。$((\boldsymbol{f})+\mathfrak{m}_{R}^{3})/\mathfrak{m}_{R}^{3}$ は $\mathfrak{m}_{R}$ に消される（$\mathfrak{m}_{R}f_{i}\subset\mathfrak{m}_{R}^{3}$）ので $k$ ベクトル空間で、$f_{1},f_{2},f_{3}$ の像で張られ、次元 $\le 3$。よって $\ell(A)=\ell(R/(\boldsymbol{f}))\ge\ell(R/((\boldsymbol{f})+\mathfrak{m}_{R}^{3}))\ge 10-3=7$ で、$\ell(A)=5$ に反する。
:::

::: supplement
**双対性.** 知られている事実として、CM 局所環 $A$ には（例えば $A$ が正則局所環の剰余なら）**標準加群**（双対化加群）$\omega_{A}$ があり、$A$ がゴレンシュタイン $\iff\omega_{A}\cong A$。射影代数多様体 $X$ の標準層 $\omega_{X}$ が直線束であることが、$X$ がゴレンシュタインであることの幾何的な意味で、セール双対性がこの場合にきれいな形をとる。このサイトではまだ扱っていない。

**バスの予想.** \ref{ring:bass-theorem} は「入射次元が有限な有限生成加群 $M\neq 0$ があれば $\operatorname{injdim}M=\operatorname{depth}A$」を示したが、そのとき $A$ が CM であること（バスの予想）は、ペスキーヌ＝スピロとロバーツの深い結果（新交叉定理）を使って示されたと知られている。このページでは $M=A$ の場合（\ref{ring:bass-theorem} の 2）だけを示した。

**高い視点.** 0 次元では「ソークルが 1 次元」は「$A$ が自分自身の双対（入射包絡）になっている」ことで、有限次元代数の言葉では**フロベニウス代数**（$A\cong\Hom_{k}(A,k)$）に近い概念である。一般次元のゴレンシュタイン性は、パラメーター系で 0 次元に切ったときにこの自己双対性が残ることと言える（\ref{ring:gorenstein-characterization} の 3）。
:::
