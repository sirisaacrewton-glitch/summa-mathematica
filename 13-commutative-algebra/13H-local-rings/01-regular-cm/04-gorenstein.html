# ゴレンシュタイン環 {#ring:page-gorenstein keywords="Gorenstein local ring, injective dimension, socle, type of a local ring, complete intersection, hierarchy regular complete intersection Gorenstein Cohen-Macaulay"}

正則局所環とコーエン＝マコーレー環の間には、**完全交叉**と**ゴレンシュタイン環**という二つの中間のクラスがある：
$$
\text{正則}\ \Rightarrow\ \text{完全交叉}\ \Rightarrow\ \text{ゴレンシュタイン}\ \Rightarrow\ \text{CM}.
$$
ゴレンシュタイン環は「環自身が有限な入射次元をもつ」局所環で（\ref{ring:gorenstein}）、0 次元の場合は「ソークル（極大イデアルで消える元の全体）が 1 次元」という非常に具体的な条件になる。双対性（セール双対性・グロタンディーク双対性）が最もきれいに成り立つ環であり、ゴレンシュタインの名は平面曲線の研究に由来する。このページは発展的な内容の概観で、一般論の深い部分（特徴付けの同値性）は出典つきの事実として述べ、0 次元の具体例での計算（\ref{ring:socle-examples}）と、各包含が真であることの例を確かめる。

> 松村『可換環論』§18、Bruns–Herzog *Cohen–Macaulay Rings*（書名のみ。本棚にない）の内容を概観した。証明を付けたのは 0 次元の計算と例の部分だけである。

## 記法と定義の確認 {#ring:sec-go-notation}

::: notation
- $(A,\mathfrak{m},k)$ はネーター局所環。CM 環とパラメーター系は \ref{ring:page-cohen-macaulay}、正則局所環は \ref{ring:page-regular-local-rings}、入射加群は \ref{mod:injective}, \ref{ha:page-injective-modules}、射影次元は \ref{ha:projective-dimension}。
- 加群 $M$ の**入射次元** $\operatorname{injdim}M$ は、入射分解 $0\to M\to E^{0}\to E^{1}\to\cdots\to E^{n}\to 0$ の長さ $n$ の最小値（なければ $\infty$）。
- $A$ 加群 $M$ の**ソークル**を $\operatorname{Soc}M\defeq(0:_{M}\mathfrak{m})=\{x\in M : \mathfrak{m}x=0\}$ とする。$k$ ベクトル空間である（$\cong\Hom_{A}(k,M)$）。
:::

## 定義と特徴付け {#ring:sec-go-definition}

::: definition ゴレンシュタイン局所環 {#ring:gorenstein keywords="Gorenstein local ring, finite injective dimension" index="ゴレンシュタイン環|ごれんしゅたいんかん"}
ネーター局所環 $A$ が $A$ 加群として有限な入射次元をもつとき、**ゴレンシュタイン局所環**という。
:::

::: fact ゴレンシュタイン環の特徴付け {#ring:gorenstein-characterization keywords="Gorenstein iff CM of type one iff socle of A/(x) is one-dimensional for a system of parameters" index="ゴレンシュタイン環の特徴付け|ごれんしゅたいんかんのとくちょうづけ, 型|かた"}
$d$ 次元のネーター局所環 $(A,\mathfrak{m},k)$ について、次は同値である（松村『可換環論』§18）。
1. $A$ はゴレンシュタイン局所環。このとき $\operatorname{injdim}A=d$。
2. $\operatorname{Ext}^{i}_{A}(k,A)=0$（$i\neq d$）かつ $\dim_{k}\operatorname{Ext}^{d}_{A}(k,A)=1$。
3. $A$ は CM で、あるパラメーター系 $x_{1},\dots,x_{d}$ について $\dim_{k}\operatorname{Soc}(A/(x_{1},\dots,x_{d}))=1$。
4. $A$ は CM で、すべてのパラメーター系について 3 が成り立つ。

$A$ が CM のとき $r(A)\defeq\dim_{k}\operatorname{Ext}^{d}_{A}(k,A)$ を $A$ の**型**といい、ゴレンシュタイン $\iff r(A)=1$。$d=0$ では $r(A)=\dim_{k}\operatorname{Soc}A$。
:::

::: definition 完全交叉 {#ring:complete-intersection keywords="complete intersection ring" index="完全交叉|かんぜんこうさ"}
ネーター局所環 $A$ の完備化が、ある完備正則局所環 $R$ を正則列 $f_{1},\dots,f_{r}$ で割った環 $R/(f_{1},\dots,f_{r})$ に同型なとき、$A$ を**完全交叉**という。
:::

::: fact 包含関係 {#ring:gorenstein-hierarchy keywords="regular implies complete intersection implies Gorenstein implies Cohen-Macaulay" index="正則・完全交叉・ゴレンシュタイン・CM|せいそくかんぜんこうさごれんしゅたいんしーえむ"}
正則局所環は完全交叉（$r=0$）、完全交叉はゴレンシュタイン、ゴレンシュタイン局所環は CM である（松村『可換環論』§18、§21）。ゴレンシュタイン性と CM 性は局所化で保たれる。
:::

## 0 次元の場合の計算 {#ring:sec-go-artinian}

::: proposition ソークルの計算 {#ring:socle-examples keywords="socle computations: k[x]/(x^n) is Gorenstein, k[x,y]/(x^2,xy,y^2) has two-dimensional socle" index="ソークル|そーくる, 台座|だいざ"}
体 $k$ について、
1. $A=k[x]/(x^{n})$（$n\ge 1$）のソークルは $kx^{n-1}$ で $1$ 次元。
2. $A=k[x,y]/(x^{2},xy,y^{2})$ のソークルは $kx\oplus ky$ で $2$ 次元。
3. $A=k[x,y,z]/I$, $I=(xy,\ xz,\ yz,\ x^{2}-y^{2},\ x^{2}-z^{2})$ は $k$ 上 $1,x,y,z,x^{2}$ を基底にもち、ソークルは $kx^{2}$ で $1$ 次元。
:::

::: proof
いずれも $\mathfrak{m}$ は変数の像で生成され、$A$ は有限次元なのでアルティン局所環（\ref{ring:prob-finite-dim-algebra}）。ソークルは「すべての変数を掛けて $0$ になる元」。

**Step 1（1）.** 基底 $1,x,\dots,x^{n-1}$。$f=\sum c_{i}x^{i}$ について $xf=\sum_{i<n-1}c_{i}x^{i+1}$ が $0$ $\iff c_{0}=\dots=c_{n-2}=0$。

**Step 2（2）.** 基底 $1,x,y$。$f=a+bx+cy$ について $xf=ax$, $yf=ay$ なので、$\mathfrak{m}f=0\iff a=0$。

**Step 3（3：基底）.** $I$ の関係式から、次数 $2$ の単項式は $x^{2}=y^{2}=z^{2}$ と $xy=xz=yz=0$ をみたす。次数 $3$ の単項式は、二つの異なる変数を含めば $xy$, $xz$, $yz$ のどれかで割り切れて $0$、一つの変数だけなら $x^{3}=x\cdot x^{2}=x\cdot y^{2}=(xy)y=0$（$y^{3}$, $z^{3}$ も同様）なので、次数 $3$ 以上の部分は $0$。よって $A$ は $1,x,y,z,x^{2}$ で張られる。これらが一次独立であることは、$I$ が斉次で、次数 $0,1$ の部分に $I$ の元がなく、次数 $2$ の部分 $I_{2}=\langle xy,xz,yz,x^{2}-y^{2},x^{2}-z^{2}\rangle$ が $6$ 次元の空間の $5$ 次元部分空間であることからわかる（$A_{2}$ は $1$ 次元で $x^{2}$ の像が張る）。

**Step 4（3：ソークル）.** $f=a+bx+cy+dz+ex^{2}$ について $xf=ax+bx^{2}$, $yf=ay+cy^{2}=ay+cx^{2}$, $zf=az+dx^{2}$。すべて $0$ $\iff a=b=c=d=0$。よってソークルは $kx^{2}$。
:::

::: example 包含が真であること {#ring:gorenstein-strict}
1. **CM だがゴレンシュタインでない**：$k[x,y]/(x^{2},xy,y^{2})$ は $0$ 次元で CM、型 $2$（\ref{ring:socle-examples} の 2）。
2. **ゴレンシュタインだが完全交叉でない**：$A=k[x,y,z]_{(x,y,z)}/I$（\ref{ring:socle-examples} の 3 の $I$）は型 $1$ でゴレンシュタイン。$\operatorname{edim}A=3$ で、完全交叉なら $3$ 次元の正則局所環を長さ $3$ の正則列で割った形になり、$I$ の極小生成系の個数は $3$ になるはずだが、$I/\mathfrak{m}I$ は $5$ 次元（$I$ の生成元は次数 $2$ の一次独立な $5$ 個）。（「極小生成系の個数が正則局所環の取り方によらない」ことは事実として認める。）
3. **完全交叉だが正則でない**：$k[[x,y]]/(y^{2}-x^{3})$（$k[[x,y]]$ を正則列 $y^{2}-x^{3}$ で割った）。
4. $k[x]/(x^{n})$ は完全交叉（$k[[x]]$ を $x^{n}$ で割った）でゴレンシュタイン（1）。
:::

::: supplement
**双対性.** CM 局所環 $A$ には**標準加群**（双対化加群）$\omega_{A}$ があり（例えば $A$ が正則局所環の剰余なら）、$A$ がゴレンシュタイン $\iff\omega_{A}\cong A$。射影代数多様体 $X$ の標準層 $\omega_{X}$ が直線束であることが、$X$ がゴレンシュタインであることの幾何的な意味で、セール双対性 $H^{i}(X,F)^{\vee}\cong\operatorname{Ext}^{n-i}(F,\omega_{X})$ がこの場合にきれいな形をとる。

**バスの定理.** 有限生成加群 $M\neq 0$ が有限な入射次元をもつネーター局所環は CM である（バスの予想、ペスキーヌ＝スピロとロバーツによって解決）。
:::
