# 正則局所環は一意分解環 {#ring:page-regular-ufd keywords="Auslander-Buchsbaum theorem: regular local rings are UFDs, Nagata's criterion, stably free, locally free implies projective, finite free resolution"}

正則局所環は一意分解環である（**アウスランダー＝ブクスバウムの定理**、\ref{ring:regular-ufd}）。幾何的には「非特異点の近くでは、余次元 1 の部分多様体は局所的に一つの方程式で定義される」ことを意味する。証明は次元についての帰納法で、正則なパラメーター $x$ を一つとり、$x$ を逆元にした環 $A[1/x]$ の高さ 1 の素イデアルが単項であることを示す。そのために、セールの判定法（\ref{ring:serre-regularity}）から得られる「有限な自由分解」と、局所化での正則性（\ref{ring:regular-localization}）を使い、最後に行列式で「安定自由な階数 1 のイデアルは単項」を示す（\ref{ring:stably-free-principal}）。$A[1/x]$ から $A$ に戻るところで\ref{ring:nagata-criterion}を使う。

> 松村『可換環論』§20 の流れを参考にした。安定自由なイデアルが単項であることは、外積代数を使わず、行列式と $\Hom(P,B)=(B:P)$ で示した。

## 記法と定義の確認 {#ring:sec-ru-notation}

::: notation
- 環は可換。一意分解環と高さ 1 の素イデアルによる特徴付けは \ref{ring:page-euclid-pid-ufd}, \ref{ring:ufd-height-one}、局所化の素イデアルと完全性・局所的性質は \ref{ring:localization-primes}, \ref{ring:localization-exact}, \ref{ring:local-properties}、クルルの単項イデアル定理・交叉定理は \tref{ring:principal-ideal-theorem}, \ref{ring:krull-intersection}。
- 正則局所環・正則なパラメーターによる剰余・整域性は \ref{ring:regular-local-ring}, \ref{ring:regular-quotient}, \ref{ring:regular-domain}、セールの判定法と局所化は \ref{ring:serre-regularity}, \ref{ring:regular-localization}、極小自由分解は \ref{ring:minimal-free-resolution}。
- 射影性の判定 $\operatorname{Ext}^{1}(P,-)=0$ は \ref{ha:ext-projective}、$\operatorname{Ext}$ と局所化は \ref{ring:ext-localization}、分裂補題は \tref{mod:splitting-lemma}。
- 整域 $B$ の商体を $K$、$0$ でないイデアル $P$ について $(B:P)\defeq\{c\in K : cP\subset B\}$ とする。
- **選択公理**：一意分解環の特徴付け、セールの判定法、局所的性質を通して使う。
:::

## 四つの補題 {#ring:sec-ru-lemmas}

::: lemma ナガタの判定法 {#ring:nagata-criterion keywords="Nagata's criterion: if x is a prime element and A[1/x] is a UFD then A is a UFD" index="ナガタの判定法（一意分解）|ながたのはんていほういちいぶんかい" refname="ナガタの判定法"}
（AC）$A$ をネーター整域、$x\in A$ を素元とする。$A[1/x]$ が一意分解環なら、$A$ も一意分解環である。
:::

::: proof
\ref{ring:ufd-height-one} から、$A$ の高さ 1 の素イデアル $P$ が単項であることを示せばよい。

**Step 1（$x\in P$）.** $xA$ は $0$ でない素イデアルで、単項イデアル定理（\tref{ring:principal-ideal-theorem}）から高さ $\le 1$、よって $0\subsetneq xA\subset P$ と $\operatorname{ht}P=1$ から $P=xA$。

**Step 2（$x\notin P$：生成元の選択）.** $PA[1/x]$ は $A[1/x]$ の高さ 1 の素イデアル（\ref{ring:localization-primes}）なので単項で、分母を払って生成元 $f\in P$ がとれる。$f=xf'$ なら $f'\in P$（$P$ は素で $x\notin P$）で $f'$ も生成元。$\bigcap_{n}x^{n}A=0$（\ref{ring:krull-intersection.3}）なので、これを有限回繰り返して $f\notin xA$ としてよい。

**Step 3（$P=fA$）.** $p\in P$ について $p=fa/x^{m}$（$a\in A$）、すなわち $x^{m}p=fa$。$x$ は素元で $x\nmid f$ なので $x\mid a$ で、$m$ についての帰納法で $x^{m}\mid a$：$a=x^{m}a'$, $p=fa'$。
:::

::: lemma 局所自由なら射影的 {#ring:locally-free-projective keywords="a finitely generated module over a noetherian ring which is locally free is projective" index="局所自由と射影性|きょくしょじゆうとしゃえいせい"}
（AC）$B$ をネーター環、$P$ を有限生成 $B$ 加群で、すべての極大イデアル $Q$ について $P_{Q}$ が自由 $B_{Q}$ 加群とする。このとき $P$ は射影的。
:::

::: proof
任意の $N$ について、\ref{ring:ext-localization} から $\operatorname{Ext}^{1}_{B}(P,N)_{Q}\cong\operatorname{Ext}^{1}_{B_{Q}}(P_{Q},N_{Q})=0$（自由加群は射影的）。\ref{ring:local-properties.1} から $\operatorname{Ext}^{1}_{B}(P,N)=0$ で、\ref{ha:ext-projective} から $P$ は射影的。
:::

::: lemma 有限自由分解をもつ射影加群 {#ring:finite-free-stably-free keywords="a projective module with a finite free resolution is stably free" index="安定自由|あんていじゆう"}
環 $B$ 上の射影加群 $P$ が、有限階数の自由加群による有限の長さの分解 $0\to F_{n}\to\cdots\to F_{0}\to P\to 0$ をもてば、有限階数の自由加群 $G,G'$ で $P\oplus G\cong G'$ となるものがある（$P$ は**安定自由**）。
:::

::: proof
$n$ についての帰納法。$n=0$ なら $P\cong F_{0}$。$n\ge 1$ なら $K\defeq\operatorname{Ker}(F_{0}\to P)$ について、$P$ が射影的なので $0\to K\to F_{0}\to P\to 0$ は分裂し（\ref{mod:splitting-lemma}）$F_{0}\cong P\oplus K$。$K$ は射影加群の直和因子なので射影的で、長さ $n-1$ の分解 $0\to F_{n}\to\cdots\to F_{1}\to K\to 0$ をもつ。帰納法の仮定から $K\oplus G\cong G'$。よって $P\oplus G'\cong P\oplus K\oplus G\cong F_{0}\oplus G$。
:::

::: lemma 安定自由なイデアルは単項 {#ring:stably-free-principal keywords="a nonzero ideal P with P + B^a = B^{a+1} is principal (determinant argument)" index="安定自由なイデアル|あんていじゆうないである"}
$B$ を整域、$P\neq 0$ をイデアルとし、$P\oplus B^{a}\cong B^{b}$ とする。このとき $b=a+1$ で、$P$ は単項イデアル。
:::

::: proof
**Step 1（階数）.** 商体 $K$ でのテンソル積（局所化）をとると、$P\otimes K=K$（$P\neq 0$）なので $K^{1+a}\cong K^{b}$、$b=a+1$（\ref{mod:vector-space-dimension}）。

**Step 2（$\Hom(P,B)$）.** $B$ 線形写像 $h\colon P\to B$ は $(B:P)$ のある元倍：$0\neq p,p'\in P$ について $p'h(p)=h(p'p)=ph(p')$ なので $h(p)/p\in K$ は $p$ によらず、その値 $c$ は $cP\subset B$ をみたす。

**Step 3（行列）.** 同型 $\varphi\colon B^{a+1}\to P\oplus B^{a}$ と逆写像 $\psi$ をとる。$P\oplus B^{a}\subset K^{a+1}$ とみると、$\varphi$ は $K$ 成分の $(a+1)$ 次正方行列 $M$（第 $j$ 列が $\varphi(e_{j})$）で表され、第 1 行の成分は $P$、他の成分は $B$ に入る。$\psi$ は Step 2 から行列 $N$ で表され、第 1 列の成分は $(B:P)$、他の成分は $B$ に入る。$\psi\varphi=\id$ から $NM=I$（$K$ 上で）、$\det M\det N=1$。

**Step 4（結論）.** $\delta\defeq\det M$ を第 1 行で展開すると $P$ の元の $B$ 係数一次結合なので $\delta\in P$。$\det N$ を第 1 列で展開すると $(B:P)$ に入る。$p\in P$ について $p\delta^{-1}=p\det N\in B$ なので $p\in\delta B$。よって $P=\delta B$。
:::

## 定理 {#ring:sec-ru-theorem}

::: theorem 正則局所環は一意分解環（アウスランダー＝ブクスバウム） {#ring:regular-ufd keywords="regular local rings are UFDs (Auslander-Buchsbaum)" index="正則局所環は一意分解環|せいそくきょくしょかんはいちいぶんかいかん"}
（AC）正則局所環は一意分解環である。
:::

::: proof
$(A,\mathfrak{m})$ を $d$ 次元の正則局所環とし、$d$ についての帰納法。$d=0$ なら $A$ は体。$d\ge 1$ とする。

**Step 1（素元 $x$）.** $x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ をとると $A/xA$ は正則（\ref{ring:regular-quotient}）なので整域（\ref{ring:regular-domain}）、$x$ は素元。\ref{ring:nagata-criterion} から、$B\defeq A[1/x]$ が一意分解環であることを示せばよい。$B$ はネーター整域。

**Step 2（$B$ の局所化）.** $B$ の素イデアル $Q$ について $\mathfrak{q}\defeq Q\cap A$ とすると $x\notin\mathfrak{q}$ なので $\mathfrak{q}\neq\mathfrak{m}$、$B_{Q}=A_{\mathfrak{q}}$。これは正則（\ref{ring:regular-localization}）で $\dim A_{\mathfrak{q}}=\operatorname{ht}\mathfrak{q}<d$（$\mathfrak{q}\subsetneq\mathfrak{m}$）なので、帰納法の仮定から一意分解環。

**Step 3（局所的に単項）.** $P$ を $B$ の高さ 1 の素イデアルとする。極大イデアル $Q$ について、$P\not\subset Q$ なら $P_{Q}=B_{Q}$、$P\subset Q$ なら $P_{Q}$ は一意分解環 $B_{Q}$ の高さ 1 の素イデアルで単項（\ref{ring:ufd-height-one}）。どちらも $B_{Q}$ 加群として階数 1 の自由加群（整域の $0$ でない単項イデアル）。\ref{ring:locally-free-projective} から $P$ は射影的。

**Step 4（有限自由分解）.** $\mathfrak{p}\defeq P\cap A$ は $A$ の素イデアルで $P=\mathfrak{p}B$（\ref{ring:localization-primes}）。セールの判定法（\ref{ring:serre-regularity}）から $\operatorname{pd}_{A}\mathfrak{p}<\infty$ で、有限階数の自由加群による有限の極小自由分解がある。$x$ の冪で局所化すると（完全。\ref{ring:localization-exact}）、$P$ の有限階数の自由 $B$ 加群による有限の分解を得る。

**Step 5（単項）.** \ref{ring:finite-free-stably-free} から $P\oplus G\cong G'$（有限階数の自由加群）、\ref{ring:stably-free-principal} から $P$ は単項。\ref{ring:ufd-height-one} から $B$ は一意分解環。
:::

::: hypcheck
- **前提「正則」**：Step 1（$x$ が素元）、Step 2（局所化が正則で帰納法が使える）、Step 4（射影次元が有限）に使った。外すと偽：$k[[x,y,z]]/(z^{2}-xy)$ は CM な局所整域だが一意分解環でない（\ref{ring:prob-ru-not-ufd}）。
- **Step 3 から Step 5 の流れ**：「局所的に単項」だけでは単項にならない（デデキント環の非単項イデアル）。有限自由分解（正則性）があることで「安定自由」になり、行列式で単項になる。
- **選択公理**：一意分解環の特徴付け、局所的性質、セールの判定法を通して使った。
:::

::: corollary 冪級数環 {#ring:regular-power-series-ufd keywords="power series ring over a field is a UFD" index="冪級数環の一意分解性|べききゅうすうかんのいちいぶんかいせい"}
（AC）体 $k$ 上の $k[[x_{1},\dots,x_{n}]]$ と、多項式環の局所化 $k[x_{1},\dots,x_{n}]_{(x_{1},\dots,x_{n})}$ は一意分解環である。
:::

::: proof
どちらも $n$ 次元の正則局所環（\ref{ring:regular-examples}）。
:::

## 問題 {#ring:sec-ru-problems}

::: problem {#ring:prob-ru-not-ufd}
$A=k[[x,y,z]]/(z^{2}-xy)$ は $2$ 次元の局所整域だが一意分解環でないことを、$\mathfrak{p}=(x,z)$ が高さ 1 の単項でない素イデアルであることから確かめよ。
:::

::: solution
$R=k[[x,y,z]]$ とする。

**Step 1（整域）.** $z^{2}=xy$ を使うと、$A$ の元は $f(x,y)+zg(x,y)$（$f,g\in k[[x,y]]$）と一意に書ける（$z$ の冪は $z^{2m}=(xy)^{m}$, $z^{2m+1}=z(xy)^{m}$ と書き直せ、一意性は次の写像の単射性から）。$x\mapsto s^{2}$, $y\mapsto t^{2}$, $z\mapsto st$ で定まる $A\to k[[s,t]]$ による像は $f(s^{2},t^{2})+st\,g(s^{2},t^{2})$ で、第 1 項は $s,t$ の指数がともに偶数、第 2 項はともに奇数の単項式からなるので、像が $0$ なら $f=g=0$。よって $A$ は整域 $k[[s,t]]$ の部分環と同型で整域。

**Step 2（次元と高さ）.** $z^{2}-xy\neq 0$ は 3 次元の正則局所環 $R$ の非零因子なので $\dim A=2$（\ref{ring:dimension-corollaries.3}）で、$A$ は CM（\ref{ring:prob-cm-hypersurface}）。$A/\mathfrak{p}\cong k[[y]]$ は整域なので $\mathfrak{p}$ は素イデアルで $\dim A/\mathfrak{p}=1$。\ref{ring:cm-localization-fact.2} から $\operatorname{ht}\mathfrak{p}=1$。

**Step 3（単項でない）.** $z^{2}-xy\in\mathfrak{m}_{R}^{2}$ なので $\mathfrak{m}_{A}/\mathfrak{m}_{A}^{2}\cong\mathfrak{m}_{R}/\mathfrak{m}_{R}^{2}$ は $x,y,z$ の像を基底とする。$\mathfrak{p}=fA$ なら $\mathfrak{p}$ の $\mathfrak{m}_{A}/\mathfrak{m}_{A}^{2}$ での像は $f$ の像で張られ $1$ 次元以下だが、$x,z\in\mathfrak{p}$ の像は一次独立。

**Step 4（結論）.** \ref{ring:ufd-height-one} から一意分解環でない。（$z\cdot z=x\cdot y$ という二通りの積がある。）
:::

::: supplement
**高い視点.** 一意分解環であることは「因子類群 $\operatorname{Cl}(A)$ が自明」と言い換えられる。定理は「非特異点の局所環の因子類群は自明」、すなわち非特異な多様体上ではヴェイユ因子とカルティエ因子が一致することの局所版である。問題の錐 $z^{2}=xy$ では、直線 $x=z=0$（$\mathfrak{p}$）は一つの方程式で定義されない（Step 3）が、$\mathfrak{p}^{(2)}$ に相当する $(x)$ は一つの方程式 $x=0$ で定義される（$x=0$ の上では $z^{2}=0$）。
:::
