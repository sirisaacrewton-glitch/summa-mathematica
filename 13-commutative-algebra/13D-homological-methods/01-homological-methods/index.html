# 可換環論のホモロジー的方法（Homological Methods in Commutative Algebra）

Ext とコシュル複体による深さ、局所環上の極小自由分解とアウスランダー＝ブクスバウムの公式、セールの正則性判定法（正則 ⇔ 大域次元有限）、正則局所環は一意分解環（アウスランダー＝ブクスバウム）。

<p class="mn-msc">MSC2020: 13D02, 13D05, 13H05</p>
