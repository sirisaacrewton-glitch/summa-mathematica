# セールの正則性判定法 {#ring:page-serre-regularity keywords="Serre's theorem: regular iff finite global dimension iff pd k finite; localization of regular local rings is regular; Auslander-Buchsbaum-Serre"}

正則局所環は「$\dim A=\dim_{k}\mathfrak{m}/\mathfrak{m}^{2}$」という次元の言葉で定義された（\ref{ring:regular-local-ring}）。セールは、これがホモロジー代数の言葉で「剰余体 $k$ の射影次元が有限」（同じことだが「大域次元が有限」）と同値であることを示した（\ref{ring:serre-regularity}）。この判定法の利点は、射影次元の有限性が局所化で保たれることがすぐわかる点にあり、そこから「正則局所環を素イデアルで局所化しても正則」という、定義からは見えにくい性質が従う（\ref{ring:regular-localization}）。

> 松村『可換環論』§19 の内容を参考にした。$\operatorname{pd}k<\infty\Rightarrow$ 正則 の証明は埋め込み次元についての帰納法で、各段階の補題の証明を補った。

## 記法と定義の確認 {#ring:sec-sr-notation}

::: notation
- $(A,\mathfrak{m},k)$ はネーター局所環、加群は有限生成。埋め込み次元 $\operatorname{edim}A\defeq\dim_{k}\mathfrak{m}/\mathfrak{m}^{2}$、正則局所環・正則なパラメーター系は \ref{ring:regular-local-ring}、正則なパラメーターによる剰余は \ref{ring:regular-quotient}。
- 極小自由分解・射影次元と $\operatorname{Tor}(-,k)$ は \ref{ring:minimal-free-resolution}, \ref{ring:pd-tor-k}、アウスランダー＝ブクスバウムの公式とその帰結は \tref{ring:auslander-buchsbaum}, \ref{ring:auslander-buchsbaum-corollaries}、コシュル複体は \ref{ring:koszul-complex}, \ref{ring:koszul-regular-acyclic}。
- $\operatorname{Tor}$ の定義（第 2 変数の射影分解で計算）と平衡性は \ref{ha:tor}, \ref{ha:tor-balanced}。随伴素イデアルと零因子は \ref{ring:zero-divisors-ass}、素イデアルの回避は \ref{ring:prime-avoidance}、局所化の完全性は \ref{ring:localization-exact}。
- **選択公理**：中山の補題・随伴素イデアル・深さの理論を通して使う。
:::

## 三つの補題 {#ring:sec-sr-lemmas}

::: lemma m² と随伴素イデアルを避ける元 {#ring:avoid-m-squared keywords="if depth A >= 1 and m != 0 there is a non-zero-divisor in m minus m^2" index="m² を避ける非零因子|えむにじょうをさけるひれいいんし"}
（AC）$\mathfrak{m}\neq 0$ かつ $\operatorname{depth}A\ge 1$ なら、$A$ の非零因子 $x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ がある。
:::

::: proof
**Step 1（避けるべき素イデアル）.** $\operatorname{Ass}A$ は有限で（\ref{ring:prime-filtration}）、零因子全体は $\bigcup_{\mathfrak{p}\in\operatorname{Ass}A}\mathfrak{p}$（\ref{ring:zero-divisors-ass}）。$\operatorname{Ass}A$ の極大元を $\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}$ とすると、和集合は同じで、$\mathfrak{p}_{i}$ どうしは互いに含まない。$\operatorname{depth}A\ge 1$ から $\Hom(k,A)=0$、すなわち $\mathfrak{m}\notin\operatorname{Ass}A$ なので、各 $\mathfrak{p}_{i}\subsetneq\mathfrak{m}$。

**Step 2（$z$ の選択）.** 中山の補題から $\mathfrak{m}\neq\mathfrak{m}^{2}$ なので $z\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ をとる。$S\defeq\{i : z\in\mathfrak{p}_{i}\}$ とする。$S=\varnothing$ なら $x=z$ でよい。

**Step 3（補正項）.** $S\neq\varnothing$ とし、$J\defeq\mathfrak{m}^{2}\prod_{j\notin S}\mathfrak{p}_{j}$ とおく。$i\in S$ について $J\not\subset\mathfrak{p}_{i}$：もし $J\subset\mathfrak{p}_{i}$ なら、$\mathfrak{p}_{i}$ は素イデアルなので $\mathfrak{m}\subset\mathfrak{p}_{i}$ またはある $j\notin S$ で $\mathfrak{p}_{j}\subset\mathfrak{p}_{i}$ となり（$j\neq i$）、Step 1 に反する。素イデアルの回避（\ref{ring:prime-avoidance}）から $a\in J\setminus\bigcup_{i\in S}\mathfrak{p}_{i}$ がある。

**Step 4（$x=z+a$）.** $i\in S$ なら $z\in\mathfrak{p}_{i}$, $a\notin\mathfrak{p}_{i}$ から $x\notin\mathfrak{p}_{i}$。$j\notin S$ なら $z\notin\mathfrak{p}_{j}$, $a\in\mathfrak{p}_{j}$ から $x\notin\mathfrak{p}_{j}$。よって $x$ は非零因子。$a\in\mathfrak{m}^{2}$, $z\notin\mathfrak{m}^{2}$ から $x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$。
:::

::: lemma 非零因子で割ること {#ring:pd-mod-regular-element keywords="if x is regular on A and N then pd_{A/xA} N/xN <= pd_A N" index="非零因子による射影次元の比較|ひれいいんしによるしゃえいじげんのひかく"}
$A$ を環、$x\in A$ を $A$ と $A$ 加群 $N$ の両方の非零因子、$B\defeq A/xA$ とする。$\operatorname{pd}_{A}N\le n$ なら $\operatorname{pd}_{B}N/xN\le n$。
:::

::: proof
**Step 1（Tor の計算）.** $0\to A\xrightarrow{x}A\to B\to 0$ は（$x$ が $A$ の非零因子なので）$B$ の射影分解。定義（\ref{ha:tor}）から $\operatorname{Tor}^{A}_{i}(N,B)$ は $0\to N\xrightarrow{x}N\to 0$ のホモロジーで、$\operatorname{Tor}_{1}=(0:_{N}x)=0$（$x$ は $N$ の非零因子）、$\operatorname{Tor}_{i}=0$（$i\ge 2$）。

**Step 2（分解を割る）.** 長さ $n$ 以下の $N$ の射影分解 $P$ をとる。\ref{ha:tor-balanced} から $H_{i}(P\otimes_{A}B)\cong\operatorname{Tor}^{A}_{i}(N,B)$ で、これは $i\ge 1$ で $0$（Step 1）、$i=0$ で $N\otimes_{A}B\cong N/xN$。$P_{i}\otimes_{A}B\cong P_{i}/xP_{i}$ は $B$ 射影加群（$P_{i}\oplus Q\cong A^{(I)}$ なら $P_{i}/xP_{i}\oplus Q/xQ\cong B^{(I)}$）。よって $P/xP$ は $N/xN$ の長さ $n$ 以下の $B$ 射影分解。
:::

::: lemma m/xm の分解 {#ring:m-mod-xm-splits keywords="for x in m minus m^2 regular, m/xm = k + m/xA as A/xA-modules" index="m/xm の分解|えむえっくすえむのぶんかい"}
$x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ が $A$ の非零因子なら、$B=A/xA$ 加群として $\mathfrak{m}/x\mathfrak{m}\cong k\oplus\mathfrak{m}/xA$。
:::

::: proof
**Step 1（補集合の候補）.** $x_{1}=x$ を含む $\mathfrak{m}$ の極小生成系 $x_{1},\dots,x_{e}$ をとる（$\bar x\neq 0$ を $\mathfrak{m}/\mathfrak{m}^{2}$ の基底に延ばして持ち上げる。\ref{ring:nakayama-generators}）。$C\defeq(x_{2},\dots,x_{e})+x\mathfrak{m}$ とする。$xA+C=\mathfrak{m}$ は明らか。

**Step 2（$xA\cap C=x\mathfrak{m}$）.** $\supset$ は明らか。$ax\in C$ とする。$a\notin\mathfrak{m}$ なら $a$ は単元で $x\in(x_{2},\dots,x_{e})+\mathfrak{m}^{2}$、これは $\bar x_{1},\dots,\bar x_{e}$ の一次独立性に反する。よって $a\in\mathfrak{m}$, $ax\in x\mathfrak{m}$。

**Step 3（直和分解）.** Step 1・2 から $\mathfrak{m}/x\mathfrak{m}=xA/x\mathfrak{m}\oplus C/x\mathfrak{m}$（どちらも $x$ に消されるので $B$ 加群）。$xA/x\mathfrak{m}\cong A/\mathfrak{m}=k$（$x$ 倍 $A\to xA$ は $x$ が非零因子なので同型で、$\mathfrak{m}$ を $x\mathfrak{m}$ に写す）。$C/x\mathfrak{m}=C/(C\cap xA)\cong(C+xA)/xA=\mathfrak{m}/xA$。
:::

## セールの定理 {#ring:sec-sr-theorem}

::: theorem セールの正則性判定法 {#ring:serre-regularity keywords="Serre: A regular iff pd_A k < infinity iff pd_A k = dim A iff global dimension finite" index="セールの正則性判定法|せーるのせいそくせいはんていほう, セールの定理（正則局所環）|せーるのていりせいそくきょくしょかん" refname="セールの正則性判定法"}
（AC）ネーター局所環 $(A,\mathfrak{m},k)$ について、次は同値である。
1. $A$ は正則局所環。
2. $\operatorname{pd}_{A}k=\dim A$。
3. $\operatorname{pd}_{A}k<\infty$。
4. 有限生成 $A$ 加群の射影次元はすべて有限。

このとき有限生成加群の射影次元の上限は $\dim A$ である（すべての加群に広げた大域次元も $\dim A$。\ref{ring:global-dimension-residue-field}）。
:::

::: proof
**Step 1（1⇒2）.** $d=\dim A$、$x_{1},\dots,x_{d}$ を正則なパラメーター系とする。これは $A$ 正則列（\ref{ring:regular-sequence} の後の例 2）なので、$K(\boldsymbol{x};A)$ は $A/(\boldsymbol{x})=A/\mathfrak{m}=k$ の自由分解（\ref{ring:koszul-regular-acyclic}）。微分の成分は $0$ か $\pm x_{i}\in\mathfrak{m}$（\ref{ring:koszul-basic}）なので極小で、$K_{d}=A\neq 0$。\ref{ring:pd-tor-k.1} から $\operatorname{pd}_{A}k=d$。

**Step 2（2⇒3, 3⇔4）.** 2⇒3 は明らか。3⇒4 は \ref{ring:pd-tor-k.2}、4⇒3 は明らか。

**Step 3（3⇒1：帰納法の設定）.** $e\defeq\operatorname{edim}A$ についての帰納法。$e=0$ なら $\mathfrak{m}=\mathfrak{m}^{2}$ で、中山の補題から $\mathfrak{m}=0$、$A$ は体で $\dim A=0=e$、正則。以下 $e\ge 1$（$\mathfrak{m}\neq 0$）とする。

**Step 4（$\operatorname{depth}A\ge 1$）.** $\operatorname{depth}A=0$ なら、\ref{ring:auslander-buchsbaum-corollaries.2} から $\operatorname{pd}k=0$、$k$ は射影的で自由（\ref{ring:local-projective-free}）：$k\cong A^{r}$, $r\ge 1$。$\mathfrak{m}$ は $k$ を消すので $A^{r}$ を消し、$\mathfrak{m}=0$ となって矛盾。

**Step 5（$x$ の選択）.** \ref{ring:avoid-m-squared} から非零因子 $x\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ をとり、$B\defeq A/xA$（剰余体は $k$）とする。$\operatorname{edim}B=e-1$（\ref{ring:regular-quotient} の証明の Step 1）。

**Step 6（$\operatorname{pd}_{B}k<\infty$）.** $k$ の極小自由分解 $F$ は $F_{0}=A$ で始まり、$F_{1}\to F_{0}$ の像は $\mathfrak{m}$。よって $F_{\ge 1}$ は $\mathfrak{m}$ の自由分解で、$\operatorname{pd}_{A}\mathfrak{m}<\infty$。$x$ は $A$ の非零因子なので部分加群 $\mathfrak{m}$ の非零因子でもあり、\ref{ring:pd-mod-regular-element} から $\operatorname{pd}_{B}\mathfrak{m}/x\mathfrak{m}<\infty$。\ref{ring:m-mod-xm-splits} から $\mathfrak{m}/x\mathfrak{m}\cong k\oplus\mathfrak{m}/xA$ で、$\operatorname{Tor}^{B}_{i}(-,k)$ は（第 2 変数の分解で計算するので）直和を直和に写すから、$\operatorname{Tor}^{B}_{i}(k,k)$ は $\operatorname{Tor}^{B}_{i}(\mathfrak{m}/x\mathfrak{m},k)$ の直和因子で、十分大きい $i$ で $0$。\ref{ring:pd-tor-k.1}（$B$ に適用）から $\operatorname{pd}_{B}k<\infty$。

**Step 7（結論）.** 帰納法の仮定から $B$ は正則。$x$ は非零因子で $x\notin\mathfrak{m}^{2}$ なので、\ref{ring:regular-quotient.2} から $A$ は正則。
:::

::: hypcheck
- **前提「ネーター局所環」**：極小自由分解と \ref{ring:pd-tor-k}（中山の補題）、\ref{ring:avoid-m-squared}（随伴素イデアルの有限性）、\ref{ring:regular-quotient}（次元論）に使った。
- **Step 4 の役割**：アウスランダー＝ブクスバウムの公式は「深さ $0$ なら射影次元有限の加群は自由」という形で、$\operatorname{depth}A\ge 1$（$\mathfrak{m}$ の中の非零因子の存在）を保証するためだけに使った。
- **$x\notin\mathfrak{m}^{2}$ の役割**：\ref{ring:m-mod-xm-splits}（$k$ が直和因子になること）と、$\operatorname{edim}$ が $1$ 減ること、\ref{ring:regular-quotient.2} に使った。$x\in\mathfrak{m}^{2}$ では $A/xA$ は正則にならない（例えば $A=k[[t]]$, $x=t^{2}$ で $A/xA=k[t]/(t^{2})$）。
- **選択公理**：中山の補題・随伴素イデアル・深さの理論・極小自由分解の構成（従属選択公理）を通して使った。
:::

::: corollary 正則局所環の局所化 {#ring:regular-localization keywords="localization of a regular local ring at a prime is regular (Serre)" index="正則局所環の局所化|せいそくきょくしょかんのきょくしょか"}
（AC）$A$ が正則局所環なら、任意の素イデアル $\mathfrak{p}$ について $A_{\mathfrak{p}}$ は正則局所環である。
:::

::: proof
**Step 1.** $d=\dim A$ とする。\ref{ring:serre-regularity} から $\operatorname{pd}_{A}A/\mathfrak{p}\le d$ で、長さ $d$ 以下の有限生成自由加群による分解 $0\to F_{d}\to\cdots\to F_{0}\to A/\mathfrak{p}\to 0$ がある（極小自由分解）。

**Step 2.** 局所化は完全（\ref{ring:localization-exact}）なので、$0\to(F_{d})_{\mathfrak{p}}\to\cdots\to(F_{0})_{\mathfrak{p}}\to(A/\mathfrak{p})_{\mathfrak{p}}\to 0$ は完全。$(A^{r})_{\mathfrak{p}}\cong A_{\mathfrak{p}}^{r}$ は自由 $A_{\mathfrak{p}}$ 加群で、$0\to\mathfrak{p}\to A\to A/\mathfrak{p}\to 0$ を局所化すると $(A/\mathfrak{p})_{\mathfrak{p}}\cong A_{\mathfrak{p}}/\mathfrak{p}A_{\mathfrak{p}}$ は $A_{\mathfrak{p}}$ の剰余体。

**Step 3.** $A_{\mathfrak{p}}$ はネーター局所環で、剰余体の射影次元は $d$ 以下で有限。\ref{ring:serre-regularity}（3⇒1）から正則。
:::

::: remark
正則局所環は一意分解環である（アウスランダー＝ブクスバウム）。証明には \ref{ring:regular-localization} を使い、次のページ \ref{ring:page-regular-ufd} で行う。
:::

::: example
1. $A=k[x,y]_{(x,y)}/(y^{2}-x^{3})$ は $\dim A=1<2=\operatorname{edim}A$ で正則でないので、セールの定理から $\operatorname{pd}_{A}k=\infty$。
2. $k[x]/(x^{2})$, $k[x,y]/(x^{2},xy,y^{2})$ で $\operatorname{pd}k=\infty$ を直接確かめたこと（\ref{ring:page-auslander-buchsbaum} の例と問題）は、これらが正則でない（$\dim 0<\operatorname{edim}$）ことと整合する。
:::

## 問題 {#ring:sec-sr-problems}

::: problem {#ring:prob-sr-tor-kk}
$d$ \term[次元]{ring:krull-dimension}の正則局所環 $A$ について、$\dim_{k}\operatorname{Tor}^{A}_{i}(k,k)=\binom{d}{i}$ を示せ。
:::

::: solution
Step 1 の極小自由分解 $K(\boldsymbol{x};A)$ で $\operatorname{rank}K_{i}=\binom{d}{i}$（\ref{ring:koszul-basic}）。\ref{ring:betti-numbers} から $\dim_{k}\operatorname{Tor}_{i}(k,k)=\binom{d}{i}$。
:::

::: problem {#ring:prob-sr-localization}
$A=k[x,y]_{(x,y)}$、$\mathfrak{p}=(x)$ について、$A_{\mathfrak{p}}$ が 1 \term[次元]{ring:krull-dimension}の正則局所環（DVR）であることを、\ref{ring:regular-localization} を使わずに確かめよ。
:::

::: solution
$A_{\mathfrak{p}}=k[x,y]_{(x)}$ の極大イデアルは $xA_{\mathfrak{p}}$ で単項、$\mathfrak{p}=(x)$ は高さ $1$（$0\subsetneq(x)$ で、単項イデアル定理 \tref{ring:principal-ideal-theorem} から高さ $\le 1$）なので $\dim A_{\mathfrak{p}}=1=\operatorname{edim}A_{\mathfrak{p}}$。
:::

::: supplement
**ホモロジー的な判定の意味.** 正則性の局所化（\ref{ring:regular-localization}）は、定義（\term[次元]{ring:krull-dimension}と生成元の個数）から直接示すのは難しく、セールの判定法によって初めて示されたと一般に言われている。「正則」が射影次元という「局所化で保たれることが明らかな量」で特徴付けられたことが鍵である。

**高い視点：滑らかさとホモロジー次元.** 幾何的には、正則局所環は非特異点の局所環で、セールの定理は「特異点がない ⇔ どの連接層も有限長の局所自由層の分解をもつ」と言い換えられる。特異点では、剰余体の分解が無限に続き（ベッチ数が増え続け）、ホモロジーが「止まらない」。滑らかさを「有限の手順で自由なものに還元できる」というホモロジー的有限性でとらえる考え方は、非可換環（大域次元有限な代数）や導来圏（完全複体）にも受け継がれている。
:::
