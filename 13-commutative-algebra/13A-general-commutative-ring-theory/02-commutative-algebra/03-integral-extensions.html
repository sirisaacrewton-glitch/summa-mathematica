# 整拡大と正規環 {#ring:page-integral-extensions keywords="integral element, integral extension, integral closure, integrally closed domain, normal domain, lying over, going up, incomparability, going down, Cohen-Seidenberg"}

環の拡大 $A\subset B$ で、$B$ の元がモニックな $A$ 係数多項式の根になるとき、$B$ は $A$ 上**整**であるという（\ref{ring:integral-def}）。これは体の代数拡大の環版であり、整数論では「代数的整数」の概念にあたる。このページでは、整であることの有限生成性による特徴付け（\ref{ring:integral-criterion}）、整閉包が部分環であること、整性の推移律を示し、**正規環**（整閉整域）を定義して一意分解環が正規であることを確かめる。後半では、整拡大で素イデアルがどう振る舞うかを述べる**コーエン＝ザイデンバーグの定理**（横たわり・上昇・比較不能。\ref{ring:lying-over}, \ref{ring:going-up}）を証明する。これらは次元論で「整拡大は次元を変えない」ことの基礎になる。

> Atiyah–Macdonald 第 5 章と松村『可換環論』§9 の流れを参考にした。下降定理は体論（分解体）を使うので、体論の系列ができるまで事実として引用する。

## 記法と定義の確認 {#ring:sec-ie-notation}

::: notation
- 環は可換。行列式のトリック・中山の補題は \ref{ring:determinant-trick}, \ref{ring:nakayama}、局所化と素イデアルは \ref{ring:localization-primes}, \ref{ring:localization-at-prime}、有理根定理は \ref{ring:rational-root}。
- 環の拡大 $A\subset B$ とは、$A$ が $B$ の部分環であること。より一般に環準同型 $A\to B$ についても、像を考えて同じ言葉を使う。$\mathfrak{q}\in\Spec B$ について $\mathfrak{q}\cap A$ は $A$ の素イデアル（\ref{ring:prime-preimage} の 1）。
- **選択公理**：横たわり定理（\ref{ring:lying-over}）で、局所環の極大イデアルの上の極大イデアルの存在（\ref{ring:maximal-ideal-existence}）を使う。
:::

## 整な元 {#ring:sec-ie-integral}

::: definition 整な元・整拡大 {#ring:integral-def keywords="integral element, integral extension, integral dependence, finite algebra" index="整|せい, 整な元|せいなげん, 整拡大|せいかくだい, 整従属|せいじゅうぞく, 有限|ゆうげん"}
環の拡大 $A\subset B$ と $b\in B$ について、モニックな多項式 $f\in A[x]$ で $f(b)=0$ となるものがあるとき、$b$ は $A$ 上**整**であるという。$B$ のすべての元が $A$ 上整なとき、$B$ は $A$ 上整、または**整拡大**であるという。$B$ が $A$ 加群として有限生成なとき、$B$ は $A$ 上**有限**であるという。
:::

::: theorem 整であることの特徴付け {#ring:integral-criterion keywords="b is integral iff A[b] is a finitely generated A-module iff b lies in a faithful finitely generated A[b]-module" index="整であることの特徴付け|せいであることのとくちょうづけ"}
環の拡大 $A\subset B$ と $b\in B$ について、次は同値である。
1. $b$ は $A$ 上整。
2. $A[b]$ は有限生成 $A$ 加群。
3. $A[b]$ を含む $B$ の部分環 $C$ で、有限生成 $A$ 加群であるものがある。
4. 忠実な $A[b]$ 加群 $M$（$A[b]$ の $0$ でない元はどれも $M$ を零化しない）で、$A$ 加群として有限生成なものがある。
:::

::: proof
**Step 1（1⇒2）.** $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ なら $b^{n}\in A+Ab+\dots+Ab^{n-1}$ で、帰納的にすべての $b^{m}$ がこの中に入る（$b^{m+1}=b\cdot b^{m}$ を展開して $b^{n}$ を置き換える）。よって $A[b]=A+Ab+\dots+Ab^{n-1}$。

**Step 2（2⇒3⇒4）.** $C=A[b]$ とすればよい。3 の $C$ は $1\in C$ をもつので、$C$ の元 $c$ で $cC=0$ なら $c=c\cdot 1=0$、すなわち $C$ は忠実な $A[b]$ 加群。

**Step 3（4⇒1）.** $\varphi:M\to M$, $m\mapsto bm$ に行列式のトリック（\ref{ring:determinant-trick}）を $I=A$ で使うと、$\varphi^{n}+a_{1}\varphi^{n-1}+\dots+a_{n}=0$（$a_{i}\in A$）。すなわち $(b^{n}+a_{1}b^{n-1}+\dots+a_{n})M=0$ で、$M$ は忠実なので $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$。
:::

::: corollary 整閉包と推移律 {#ring:integral-closure keywords="integral closure is a subring, transitivity of integrality, finite implies integral" index="整閉包|せいへいほう, 推移律|すいいりつ"}
環の拡大 $A\subset B$ について、
1. $b_{1},\dots,b_{n}\in B$ がどれも $A$ 上整なら、$A[b_{1},\dots,b_{n}]$ は有限生成 $A$ 加群。
2. $B$ の元で $A$ 上整なもの全体 $\bar A^{B}$ は $B$ の部分環である（$A$ の $B$ における**整閉包**）。
3. （推移律）$A\subset B\subset C$ で、$B$ が $A$ 上整、$C$ が $B$ 上整なら、$C$ は $A$ 上整。
4. 有限な拡大は整拡大。有限生成な整拡大は有限。
:::

::: proof
**Step 1（1）.** $A_{k}\defeq A[b_{1},\dots,b_{k}]$ とおく。$b_{k}$ は $A$ 上、したがって $A_{k-1}$ 上整なので、\ref{ring:integral-criterion} の証明の Step 1 から $A_{k}=A_{k-1}[b_{k}]$ は有限生成 $A_{k-1}$ 加群。生成元の積をとれば、有限生成の有限生成は有限生成なので、帰納的に $A_{n}$ は有限生成 $A$ 加群。

**Step 2（2）.** $b,c$ が整なら、$A[b,c]$ は有限生成 $A$ 加群で、$b\pm c$, $bc$ を含む部分環なので、\ref{ring:integral-criterion} の 3⇒1 からこれらも整。

**Step 3（3）.** $c\in C$ が $c^{n}+b_{1}c^{n-1}+\dots+b_{n}=0$（$b_{i}\in B$）をみたすとする。$B'\defeq A[b_{1},\dots,b_{n}]$ は 1 から有限生成 $A$ 加群で、$c$ は $B'$ 上整なので $B'[c]$ は有限生成 $B'$ 加群、したがって有限生成 $A$ 加群。\ref{ring:integral-criterion} の 3⇒1 から $c$ は $A$ 上整。

**Step 4（4）.** 前半は \ref{ring:integral-criterion} の 3⇒1（$C=B$）。後半は 1。
:::

::: definition 正規環 {#ring:normal-domain keywords="integrally closed domain, normal domain, normalization" index="整閉|せいへい, 整閉整域|せいへいせいいき, 正規環|せいきかん, 正規化|せいきか"}
整域 $A$ が商体 $K=\Frac A$ の中で整閉（$\bar A^{K}=A$）なとき、$A$ を**整閉整域**または**正規環**という。$\bar A^{K}$ を $A$ の**正規化**という。（一般の環では「すべての素イデアルでの局所化が整閉整域」を正規の定義とすることが多い。）
:::

::: proposition 一意分解環は正規 {#ring:ufd-normal keywords="UFDs are integrally closed" index="一意分解環は正規|いちいぶんかいかんはせいき"}
一意分解環は正規環である。特に $\Z$, $K[x_{1},\dots,x_{n}]$, PID は正規環。
:::

::: proof
$K$ の元 $r/s$ がモニックな $A$ 係数多項式の根なら、有理根定理（\ref{ring:rational-root}）から $r/s\in A$。例は \ref{ring:polynomial-ufd} と \ref{ring:pid-ufd}。
:::

::: example 正規でない整域 {#ring:non-normal-examples}
1. $\Z[\sqrt{5}]$ は正規でない：$\varphi=\frac{1+\sqrt{5}}{2}$ は $x^{2}-x-1=0$ の根で商体に属するが、$\Z[\sqrt{5}]$ に属さない。正規化は $\Z[\varphi]$ である（$d\equiv 1\pmod 4$ の二次体の整数環。証明は整数論の系列で扱う）。
2. 体 $K$ 上の $A=K[t^{2},t^{3}]\subset K[t]$（$y^{2}=x^{3}$ の尖点のある曲線の座標環 $K[x,y]/(y^{2}-x^{3})$ に同型）は正規でない：$t=t^{3}/t^{2}\in\Frac A$ は $x^{2}-t^{2}=0$ の根だが $t\notin A$。正規化は $K[t]$。
3. $\Z[2i]$ は正規でない（$i$ が $x^{2}+1$ の根）。
:::

::: proposition 整閉包と局所化 {#ring:integral-localization keywords="integral closure commutes with localization, normality is a local property" index="正規性は局所的|せいきせいはきょくしょてき"}
$A\subset B$ と積閉集合 $S\subset A$ について、
1. $B$ が $A$ 上整なら $S^{-1}B$ は $S^{-1}A$ 上整。
2. $S^{-1}(\bar A^{B})=\overline{S^{-1}A}^{S^{-1}B}$。
3. （AC）整域 $A$ について、$A$ が正規 $\iff$ すべての素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ が正規 $\iff$ すべての極大イデアル $\mathfrak{m}$ で $A_{\mathfrak{m}}$ が正規。
:::

::: proof
**Step 1（1）.** $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ なら、$s\in S$ について $(b/s)^{n}+(a_{1}/s)(b/s)^{n-1}+\dots+a_{n}/s^{n}=0$。

**Step 2（2）.** $\subset$ は 1。逆に $b/s$ が $S^{-1}A$ 上整：$(b/s)^{n}+(a_{1}/s_{1})(b/s)^{n-1}+\dots+a_{n}/s_{n}=0$ とする。$t=s_{1}\cdots s_{n}$ を掛けて分母を払うと、$B$ の中で $u\bigl((tb)^{n}+c_{1}(tb)^{n-1}+\dots+c_{n}\bigr)=0$（$c_{i}\in A$, $u\in S$）の形になる（$\frac{x}{1}=0\iff ux=0$）。両辺に $u^{n-1}$ を掛けると $utb$ は $A$ 上整で、$b/s=utb/(uts)\in S^{-1}(\bar A^{B})$。

**Step 3（3）.** $K=\Frac A=\Frac A_{\mathfrak{p}}$ とし、$C=\bar A^{K}$ とする。$A$ 正規 ⇒ $C=A$ ⇒ 2 から $A_{\mathfrak{p}}$ の正規化は $C_{\mathfrak{p}}=A_{\mathfrak{p}}$。逆に、すべての $\mathfrak{m}$ で $A_{\mathfrak{m}}$ が正規なら、包含 $A\to C$ の局所化 $A_{\mathfrak{m}}\to C_{\mathfrak{m}}$ は 2 から全射、すなわち $(C/A)_{\mathfrak{m}}=0$。局所的性質（\ref{ring:local-properties} の 1）から $C/A=0$。
:::

## コーエン＝ザイデンバーグの定理 {#ring:sec-ie-cohen-seidenberg}

::: proposition 整拡大と体 {#ring:integral-field keywords="in an integral extension of domains A is a field iff B is a field, contraction of maximal ideals" index="整拡大と体|せいかくだいとたい"}
$A\subset B$ を整域の整拡大とする。
1. $A$ が体であることと $B$ が体であることは同値である。
2. $\mathfrak{q}\in\Spec B$（$B$ は整域とは限らない一般の整拡大でよい）について、$\mathfrak{q}$ が極大 $\iff\mathfrak{q}\cap A$ が極大。
:::

::: proof
**Step 1（1、⇒）.** $0\neq b\in B$ の満たすモニックな式で次数最小のもの $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ をとる。整域で次数最小なので $a_{n}\neq 0$（$a_{n}=0$ なら $b$ で割って次数が下がる）。$b(b^{n-1}+\dots+a_{n-1})=-a_{n}$ で、$A$ は体なので $b^{-1}=-a_{n}^{-1}(b^{n-1}+\dots+a_{n-1})\in B$。

**Step 2（1、⇐）.** $0\neq a\in A$ について $a^{-1}\in B$ は $A$ 上整：$a^{-m}+c_{1}a^{-m+1}+\dots+c_{m}=0$。$a^{m-1}$ を掛けて $a^{-1}=-(c_{1}+c_{2}a+\dots+c_{m}a^{m-1})\in A$。

**Step 3（2）.** $B/\mathfrak{q}$ は $A/(\mathfrak{q}\cap A)$ 上整な整域（式を還元する）。1 と \ref{ring:prime-maximal-quotient} の 2 から。
:::

::: theorem 比較不能定理 {#ring:incomparability keywords="incomparability in integral extensions" index="比較不能|ひかくふのう"}
$A\subset B$ を整拡大、$\mathfrak{q}\subset\mathfrak{q}'$ を $B$ の素イデアルとする。$\mathfrak{q}\cap A=\mathfrak{q}'\cap A$ なら $\mathfrak{q}=\mathfrak{q}'$。
:::

::: proof
$\mathfrak{p}\defeq\mathfrak{q}\cap A$, $S\defeq A\setminus\mathfrak{p}$ とし、局所化 $A_{\mathfrak{p}}\subset B_{\mathfrak{p}}\defeq S^{-1}B$（整拡大。\ref{ring:integral-localization} の 1）を考える。$\mathfrak{q},\mathfrak{q}'$ は $S$ と交わらないので、$B_{\mathfrak{p}}$ の素イデアル $\mathfrak{q}B_{\mathfrak{p}}\subset\mathfrak{q}'B_{\mathfrak{p}}$ に対応し（\ref{ring:localization-primes}）、その $A_{\mathfrak{p}}$ との共通部分はどちらも極大イデアル $\mathfrak{p}A_{\mathfrak{p}}$。\ref{ring:integral-field} の 2 から両方とも極大で、包含関係にあるので等しい。対応の単射性から $\mathfrak{q}=\mathfrak{q}'$。
:::

::: theorem 横たわり定理 {#ring:lying-over keywords="lying over theorem" index="横たわり定理|よこたわりていり, 上にある素イデアル|うえにあるそいである"}
（AC）$A\subset B$ を整拡大、$\mathfrak{p}\in\Spec A$ とする。$\mathfrak{q}\cap A=\mathfrak{p}$ となる $\mathfrak{q}\in\Spec B$（$\mathfrak{p}$ の**上にある**素イデアル）が存在する。
:::

::: proof
**Step 1（局所化）.** $S=A\setminus\mathfrak{p}$ で局所化すると、$A_{\mathfrak{p}}\subset B_{\mathfrak{p}}$ は整拡大。$B_{\mathfrak{p}}\neq 0$（$1\neq 0$：$0\notin S$ なので $S^{-1}B$ は零環でない。$A\subset B$ なので $S\subset B$ でも $0\notin S$）。

**Step 2（極大イデアル）.** $B_{\mathfrak{p}}$ の極大イデアル $\mathfrak{n}$ をとる（\ref{ring:maximal-ideal-existence}）。$\mathfrak{n}\cap A_{\mathfrak{p}}$ は \ref{ring:integral-field} の 2 から極大、すなわち $\mathfrak{p}A_{\mathfrak{p}}$（局所環の唯一の極大イデアル）。

**Step 3（引き戻し）.** $\mathfrak{q}\defeq\mathfrak{n}\cap B$（$B\to B_{\mathfrak{p}}$ による逆像）は $B$ の素イデアルで、可換図式（$A\to B\to B_{\mathfrak{p}}$ と $A\to A_{\mathfrak{p}}\to B_{\mathfrak{p}}$ は等しい）から $\mathfrak{q}\cap A$ は $\mathfrak{p}A_{\mathfrak{p}}$ の $A$ への逆像、すなわち $\mathfrak{p}$（\ref{ring:localization-primes}）。
:::

::: theorem 上昇定理 {#ring:going-up keywords="going up theorem" index="上昇定理|じょうしょうていり"}
（AC）$A\subset B$ を整拡大、$\mathfrak{p}_{1}\subset\mathfrak{p}_{2}\subset\dots\subset\mathfrak{p}_{n}$ を $A$ の素イデアルの鎖、$\mathfrak{q}_{1}\subset\dots\subset\mathfrak{q}_{m}$（$m<n$）を $\mathfrak{q}_{i}\cap A=\mathfrak{p}_{i}$ となる $B$ の素イデアルの鎖とする。これを $\mathfrak{q}_{1}\subset\dots\subset\mathfrak{q}_{n}$, $\mathfrak{q}_{i}\cap A=\mathfrak{p}_{i}$ に延長できる。
:::

::: proof
帰納法により $m=1$, $n=2$ の場合を示せばよい。$\bar A\defeq A/\mathfrak{p}_{1}\subset\bar B\defeq B/\mathfrak{q}_{1}$ は整拡大（$\mathfrak{q}_{1}\cap A=\mathfrak{p}_{1}$ なので包含は単射）。横たわり定理（\ref{ring:lying-over}）を $\bar A$ の素イデアル $\mathfrak{p}_{2}/\mathfrak{p}_{1}$ に使うと、その上にある $\bar B$ の素イデアル $\bar{\mathfrak{q}}_{2}$ があり、その $B$ への逆像 $\mathfrak{q}_{2}\supset\mathfrak{q}_{1}$ が $\mathfrak{q}_{2}\cap A=\mathfrak{p}_{2}$ をみたす（\ref{ring:prime-preimage} の 2）。
:::

::: fact 下降定理 {#ring:going-down keywords="going down theorem for integral extensions of normal domains" index="下降定理|かこうていり"}
$A\subset B$ を整域の整拡大で、$A$ は正規環とする。$A$ の素イデアルの鎖 $\mathfrak{p}_{1}\supset\mathfrak{p}_{2}$ と $\mathfrak{q}_{1}\cap A=\mathfrak{p}_{1}$ となる $\mathfrak{q}_{1}\in\Spec B$ について、$\mathfrak{q}_{1}\supset\mathfrak{q}_{2}$, $\mathfrak{q}_{2}\cap A=\mathfrak{p}_{2}$ となる $\mathfrak{q}_{2}\in\Spec B$ がある。出典：Atiyah–Macdonald 第 5 章（証明は、$A$ 上整な元の最小多項式の係数が根基に入ることを、分解体の中で共役を使って示す）。平坦な拡大でも下降定理が成り立つ（松村『可換環論』§9）。
:::

::: supplement
**次元への応用.** 上昇定理と比較不能定理を合わせると、整拡大 $A\subset B$ で $\dim A=\dim B$（クルル次元。\ref[次元論]{ring:page-dimension-theory}）が従う：$A$ の素イデアルの鎖は $B$ の同じ長さの鎖に持ち上がり（上昇）、$B$ の真の鎖は $A$ に落としても真のまま（比較不能）。ネーターの正規化（\ref[零点定理]{ring:nullstellensatz} の準備）と組み合わせて、体上の有限生成整域の次元が超越次数に等しいことを示すのに使う。

**幾何的な意味.** 整拡大 $A\subset B$ は $\Spec B\to\Spec A$ が**全射**（横たわり）で、ファイバーが「有限個の点の離散集合」のように振る舞う（比較不能）射に対応する。代数曲線の正規化 $K[t^{2},t^{3}]\subset K[t]$ では、尖点の上にただ一点があり、正規化は「特異点をほどく」操作になる。
:::

## 問題 {#ring:sec-ie-problems}

::: problem {#ring:prob-integral-z-i}
$\Z[i]$ は $\Z$ 上整であり、$\Z[i]$ の素イデアル $(1+i)$ は $\Z$ の素イデアル $(2)$ の上にあることを示せ。また $(2)$ の上にある $\Z[i]$ の素イデアルは $(1+i)$ だけであることを示せ。
:::

::: solution
$i$ は $x^{2}+1$ の根なので整、$\Z[i]=\Z+\Z i$ は有限生成 $\Z$ 加群（\ref{ring:integral-closure} の 4）。$(1+i)$ は $\Z[i]/(1+i)$ が 2 元の体（$N(1+i)=2$、$i\equiv-1\equiv 1$）なので極大で、$(1+i)\cap\Z\ni 2$、真のイデアルなので $(1+i)\cap\Z=(2)$。$(2)$ の上にある素イデアル $\mathfrak{q}$ は $2=-i(1+i)^{2}$ を含むので $1+i\in\mathfrak{q}$、$(1+i)\subset\mathfrak{q}$ で、$(1+i)$ は極大なので等しい。
:::

::: problem {#ring:prob-integral-closure-polynomial}
$A\subset B$ で $A$ が $B$ の中で整閉なら、$A[x]$ は $B[x]$ の中で整閉であることが知られている。$A=\Z$, $B=\Q$ の場合に、$f\in\Q[x]$ が $\Z[x]$ 上整なら $f\in\Z[x]$ であることを、ガウスの補題を使って示せ。
:::

::: solution
$f^{n}+g_{1}f^{n-1}+\dots+g_{n}=0$（$g_{i}\in\Z[x]$）とする。$y$ を新しい変数とし、$F(y)\defeq y^{n}+g_{1}y^{n-1}+\dots+g_{n}\in\Z[x][y]$ は $y-f$ を因子にもつ：$\Q[x][y]$ で $F=(y-f)G$。$\Z[x]$ は UFD で商体は $\Q(x)$。$F$ は $y$ についてモニックなので $\Z[x]$ 上の原始多項式で、$\Q(x)[y]$ での分解 $F=(y-f)G$ から、ガウスの補題の帰結（\ref{ring:gauss-irreducible} の 1）により $a\in\Q(x)^{\times}$ で $a(y-f),a^{-1}G\in\Z[x][y]$。$a(y-f)$ の $y$ の係数 $a\in\Z[x]$、$a^{-1}G$ の最高次係数 $a^{-1}\in\Z[x]$ なので $a$ は $\Z[x]$ の単元 $\pm1$。よって $y-f\in\Z[x][y]$、すなわち $f\in\Z[x]$。
:::
