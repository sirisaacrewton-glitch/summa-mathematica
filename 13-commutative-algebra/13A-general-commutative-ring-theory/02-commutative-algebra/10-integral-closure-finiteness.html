# 整閉包の構造と有限性 {#ring:page-integral-closure-finiteness keywords="integral closure in a finite extension, clearing denominators, trace and norm of integral elements, finiteness of integral closure in separable extensions, free over a PID, Emmy Noether finiteness theorem, Chevalley extension theorem, integral closure as intersection of valuation rings"}

正規環 $A$（商体 $K$）と $K$ の有限次拡大 $L$ について、$A$ の $L$ における整閉包 $B$ を調べる。$B$ の商体は $L$ で（\ref{ring:clearing-denominators}）、$B$ の元の最小多項式・トレース・ノルムは $A$ に属する（\ref{ring:integral-trace-norm}）。$L/K$ が分離的なら、トレース形式の非退化性から $B$ は有限生成 $A$ 加群になり（\ref{ring:integral-closure-finite}）、$A$ が PID なら階数 $[L:K]$ の自由加群になる。代数的整数環 $\mathcal{O}_{L}$ が $\Z^{[L:\Q]}$ と同型になるのはこの特別な場合である。体上の有限生成整域については、非分離な場合も含めて整閉包が有限であること（**ネーターの有限性定理**、\tref{ring:noether-finiteness}）を示す。最後に、整閉包を付値環の共通部分として特徴付ける（\ref{ring:integral-closure-valuations}）。

> 松村『可換環論』§9–§10、Zariski–Samuel 第 V 章の内容を参考にした。ネーターの有限性定理の非分離な場合は、係数の $q$ 乗根を添加して分離的な場合に帰着する形で書いた。

## 記法と定義の確認 {#ring:sec-icf-notation}

::: notation
- 整拡大・整閉包・推移律・正規環・整閉包と局所化・イデアル上整な元・最小多項式の係数は \ref{ring:integral-def}, \ref{ring:integral-closure}, \ref{ring:normal-domain}, \ref{ring:integral-localization}, \ref{ring:minimal-polynomial-ideal}。一意分解環は正規（\ref{ring:ufd-normal}）。
- 体論：次数・塔の公式・最小多項式・分離性・分離次数・デデキントの補題は \ref{fld:tower-law}, \ref{fld:minimal-polynomial}, \ref{fld:separable-polynomial}, \ref{fld:separable-degree}, \ref{fld:dedekind-independence}。
- 付値環とその性質は \ref{ring:valuation-ring}, \ref{ring:valuation-properties}。ネーターの正規化定理は \tref{ring:noether-normalization}、ツォルンの補題は \tref{set:zorn}。
- **選択公理**：付値環の存在（ツォルンの補題）と、極大イデアルの存在で使う。有限性の定理には使わない。
:::

## 分母を払う {#ring:sec-icf-denominators}

::: lemma 分母を払う {#ring:clearing-denominators keywords="for x algebraic over K = Frac A there is d in A with dx integral over A; the integral closure of A in L has fraction field L" index="分母を払う|ぶんぼをはらう"}
$A$ を整域、$K=\Frac A$、$L/K$ を代数拡大とする。$x\in L$ について $dx$ が $A$ 上整となる $0\neq d\in A$ がある。したがって $A$ の $L$ における整閉包 $B$ について $\Frac B=L$ で、$L$ の $K$ 上の基底で $B$ に属するものがとれる。
:::

::: proof
$x$ が $a_{n}x^{n}+\dots+a_{0}=0$（$a_{i}\in A$, $a_{n}\neq 0$。$K$ 係数の式の分母を払う）をみたすとすると、$a_{n}^{n-1}$ を掛けて $(a_{n}x)^{n}+a_{n-1}(a_{n}x)^{n-1}+a_{n-2}a_{n}(a_{n}x)^{n-2}+\dots+a_{0}a_{n}^{n-1}=0$。$d=a_{n}$。後半：$x=(dx)/d$ で $dx,d\in B$。基底の各元に $d$ を掛ければよい。
:::

## トレースとノルム {#ring:sec-icf-trace}

::: definition トレースとノルム {#ring:trace-norm keywords="trace and norm of a finite field extension" index="トレース（体の拡大）|とれーすたいのかくだい, ノルム（体の拡大）|のるむたいのかくだい"}
有限次拡大 $L/K$ と $x\in L$ について、$K$ 線形写像 $m_{x}\colon L\to L$, $y\mapsto xy$ のトレースと行列式を $\operatorname{Tr}_{L/K}(x)$, $N_{L/K}(x)$ と書く。$\operatorname{Tr}$ は $K$ 線形、$N$ は乗法的（$m_{xy}=m_{x}m_{y}$）。
:::

::: proposition トレース・ノルムと共役 {#ring:trace-conjugates keywords="Tr(x) = [L:K(x)] times sum of roots of the minimal polynomial; for separable L/K, Tr = sum over embeddings and the trace form is nondegenerate" index="トレース形式|とれーすけいしき"}
$x\in L$ の $K$ 上の最小多項式を $f=X^{r}-c_{1}X^{r-1}+\dots+(-1)^{r}c_{r}$、$s=[L:K(x)]$ とする。
1. $\operatorname{Tr}_{L/K}(x)=sc_{1}$、$N_{L/K}(x)=c_{r}^{s}$。
2. $L/K$ が分離的なら、$\Omega$（代数的閉体）への $K$ 埋め込み全体 $\sigma_{1},\dots,\sigma_{n}$ について $\operatorname{Tr}(x)=\sum_{i}\sigma_{i}(x)$。
3. $L/K$ が分離的なら、トレース形式 $(y,z)\mapsto\operatorname{Tr}(yz)$ は非退化：$K$ 上の基底 $v_{1},\dots,v_{n}$ に対し、$\operatorname{Tr}(v_{i}v_{j}^{*})=\delta_{ij}$ となる**双対基底** $v_{1}^{*},\dots,v_{n}^{*}$ がある。
:::

::: proof
**Step 1（1）.** $K(x)$ の基底 $1,x,\dots,x^{r-1}$ に関する $m_{x}$ の行列は $f$ の同伴行列で、特性多項式は $f$（トレース $c_{1}$、行列式 $c_{r}$）。$L$ の $K(x)$ 上の基底 $u_{1},\dots,u_{s}$ との積 $x^{i}u_{j}$（\ref{fld:tower-law}）を基底にとると、$m_{x}$ の行列は同伴行列の $s$ 個のブロック対角なので、トレースは $sc_{1}$、行列式は $c_{r}^{s}$。

**Step 2（2）.** $K(x)$ の $K$ 埋め込みは $f$ の $r$ 個の相異なる根に対応し（\ref{fld:extension-simple}）、各々の $L$ への延長はちょうど $s$ 個（\ref{fld:separable-degree.2}・\ref[3]{fld:separable-degree.3}）。よって $\sum_{i}\sigma_{i}(x)=s\cdot(\text{根の和})=sc_{1}$。

**Step 3（3）.** $\operatorname{Tr}=\sum\sigma_{i}$ は $0$ でない（デデキントの補題 \tref{fld:dedekind-independence}）。$y\neq 0$ で $\operatorname{Tr}(yz)=0$（すべての $z$）なら、$z$ を $y^{-1}w$ として $\operatorname{Tr}\equiv 0$ となり矛盾。よって $L\to\Hom_{K}(L,K)$, $y\mapsto\operatorname{Tr}(y\,\cdot)$ は単射で、\term[次元]{lin:dimension}が等しいので同型。$v_{j}^{*}$ は $v$ の双対基底 $v^{\vee}_{j}$ の逆像。
:::

::: proposition 整な元のトレース・ノルム {#ring:integral-trace-norm keywords="for A normal, the minimal polynomial, trace and norm of an element of L integral over A lie in A" index="整な元のトレース|せいなげんのとれーす"}
$A$ を正規環、$K=\Frac A$、$L/K$ を有限次拡大、$x\in L$ を $A$ 上整とする。$x$ の最小多項式は $A[X]$ に属し、$\operatorname{Tr}_{L/K}(x),N_{L/K}(x)\in A$。
:::

::: proof
\ref{ring:minimal-polynomial-ideal}（$\mathfrak{p}=A$）から最小多項式の係数 $c_{i}\in A$。\ref{ring:trace-conjugates.1} から $\operatorname{Tr}=sc_{1}$, $N=c_{r}^{s}\in A$。
:::

## 整閉包の有限性 {#ring:sec-icf-finite}

::: theorem 分離拡大での整閉包の有限性 {#ring:integral-closure-finite keywords="integral closure of a normal Noetherian domain in a finite separable extension is a finite module; free of rank [L:K] over a PID" index="整閉包の有限性|せいへいほうのゆうげんせい"}
$A$ を正規環、$K=\Frac A$、$L/K$ を $n$ 次の分離拡大、$B$ を $A$ の $L$ における整閉包とする。
1. $L$ の $K$ 上の基底 $v_{1},\dots,v_{n}\in B$ について、$B\subset\sum_{i}Av_{i}^{*}$（双対基底）。
2. $A$ がネーターなら、$B$ は有限生成 $A$ 加群で、ネーター環。
3. $A$ が PID なら、$B$ は階数 $n$ の自由 $A$ 加群。
:::

::: proof
**Step 1（1）.** $b\in B$ を $b=\sum_{j}c_{j}v_{j}^{*}$（$c_{j}\in K$）と書くと $\operatorname{Tr}(bv_{i})=c_{i}$。$bv_{i}\in B$ は整なので $c_{i}\in A$（\ref{ring:integral-trace-norm}）。

**Step 2（2）.** $\sum Av_{i}^{*}$ は有限生成で、ネーター環上の有限生成加群の部分加群は有限生成（\ref{ring:noetherian-exact}）。$B$ は $A$ 上有限な環なのでネーター。

**Step 3（3）.** PID 上の有限生成でねじれのない加群は自由（\ref{mod:pid-torsion-free-free}）。$Av_{1}+\dots+Av_{n}\subset B\subset\sum Av_{i}^{*}$ で、両端は階数 $n$ の自由加群なので $B$ の階数は $n$。
:::

::: theorem ネーターの有限性定理 {#ring:noether-finiteness keywords="Emmy Noether: the integral closure of a finitely generated domain over a field in a finite extension of its fraction field is a finite module" index="ネーターの有限性定理|ねーたーのゆうげんせいていり" refname="ネーターの有限性定理"}
体 $k$ 上の有限生成整域 $A$ と、$\Frac A$ の有限次拡大 $L$ について、$A$ の $L$ における整閉包 $B$ は有限生成 $A$ 加群（したがって有限生成 $k$ 代数）である。
:::

::: proof
**Step 1（正規化）.** \ref{ring:noether-normalization}から $P\defeq k[y_{1},\dots,y_{d}]\subset A$ で $A$ が $P$ 上有限となるものがある。$B$ は $P$ の $L$ における整閉包でもある（推移律 \ref{ring:integral-closure}）ので、$B$ が $P$ 上有限なことを示せばよい。$P$ は一意分解環なので正規、$F\defeq k(y_{1},\dots,y_{d})$ とすると $L/F$ は有限次。

**Step 2（分離的な場合）.** $L/F$ が分離的なら \ref{ring:integral-closure-finite.2}。特に標数 $0$ なら終わり。

**Step 3（係数の $q$ 乗根の添加）.** 標数 $p$ とする。$L=F(\alpha_{1},\dots,\alpha_{m})$ とし、$\alpha_{i}$ の最小多項式を $g_{i}(X^{q_{i}})$（$g_{i}$ 分離的、$q_{i}$ は $p$ の冪。\ref{fld:separable-criterion.3} を繰り返す）と書き、$q\defeq\max_{i}q_{i}$ とする。$g_{i}$ の係数は $y$ の $k$ 係数有理式で、それらに現れる $k$ の元有限個の $q$ 乗根を $k$ に添加した有限次拡大を $k'$ とし、$F'\defeq k'(y_{1}^{1/q},\dots,y_{d}^{1/q})$, $P'\defeq k'[y_{1}^{1/q},\dots,y_{d}^{1/q}]$ とする（$L$ を含む代数閉包の中で考える）。$g_{i}$ の係数の $q_{i}$ 乗根は $F'$ に属し（$c^{1/q_{i}}=(c^{1/q})^{q/q_{i}}$）、それらを係数とする多項式 $h_{i}$ について $g_{i}(X^{q_{i}})=h_{i}(X)^{q_{i}}$。$h_{i}$ の根は $g_{i}$ の相異なる根の $q$ 乗根で相異なるので $h_{i}$ は分離的で、$\alpha_{i}$ は $F'$ 上分離的。よって $L'\defeq LF'=F'(\alpha_{1},\dots,\alpha_{m})$ は $F'$ 上分離的（\ref{fld:separable-degree.4}）で、有限次。

**Step 4（帰着）.** $P'$ は多項式環（変数 $y_{i}^{1/q}$）で正規。Step 2 から $P'$ の $L'$ における整閉包 $C'$ は $P'$ 上有限。$P'$ は $P$ 上有限（$k'/k$ 有限、$y_{i}^{1/q}$ は $X^{q}-y_{i}$ の根）なので $C'$ は $P$ 上有限。$B$ の元は $P$ 上（したがって $P'$ 上）整で $L\subset L'$ に属するので $B\subset C'$。$P$ はネーターなので $B$ も有限生成 $P$ 加群。
:::

::: hypcheck
- **前提「体上有限生成」**：Step 1 の正規化と Step 3 の「有限個の係数」に使った。一般のネーター整域では整閉包は有限とは限らない（\ref{ring:nagata-examples} に関連する永田の例）。
- **選択公理**：使っていない（代数閉包の代わりに十分大きな分解体の中で議論できる）。
:::

## 付値環による特徴付け {#ring:sec-icf-valuation}

::: theorem 付値環の存在（シュヴァレー） {#ring:chevalley-extension keywords="Chevalley extension theorem: for a subring A of a field K and a prime p there is a valuation ring V of K with A in V and m_V cap A = p" index="シュヴァレーの延長定理|しゅゔぁれーのえんちょうていり"}
（AC）体 $K$ の部分環 $A$ と $\mathfrak{p}\in\Spec A$ について、$K$ の付値環 $V\supset A$ で $\mathfrak{m}_{V}\cap A=\mathfrak{p}$ となるものがある。
:::

::: proof
**Step 1（ツォルン）.** $\Sigma\defeq\{R : A_{\mathfrak{p}}\subset R\subset K\text{ は部分環}, \mathfrak{p}R\neq R\}$ は $A_{\mathfrak{p}}$ を含む（$\mathfrak{p}A_{\mathfrak{p}}\neq A_{\mathfrak{p}}$）。鎖の和集合 $R^{*}$ では $1\in\mathfrak{p}R^{*}$ なら有限個の元の式で、ある一つの $R$ で $1\in\mathfrak{p}R$ となり矛盾。ツォルンの補題から極大元 $V$ がある。

**Step 2（局所で $\mathfrak{m}\cap A=\mathfrak{p}$）.** $\mathfrak{p}V$ を含む極大イデアル $\mathfrak{m}$ をとると $V_{\mathfrak{m}}\in\Sigma$ で $V\subset V_{\mathfrak{m}}$、極大性から $V=V_{\mathfrak{m}}$ は局所環で極大イデアルは $\mathfrak{m}$。$\mathfrak{m}\cap A_{\mathfrak{p}}$ は $\mathfrak{p}A_{\mathfrak{p}}$ を含む真のイデアルなので $\mathfrak{p}A_{\mathfrak{p}}$ に等しく、$\mathfrak{m}\cap A=\mathfrak{p}$。

**Step 3（付値環）.** $x\in K^{\times}$ で $x,x^{-1}\notin V$ とする。$V[x]\supsetneq V$ は $\Sigma$ に入らないので $\mathfrak{p}V[x]=V[x]$、特に $\mathfrak{m}V[x]=V[x]$：$1=a_{0}+a_{1}x+\dots+a_{n}x^{n}$（$a_{i}\in\mathfrak{m}$）。同様に $1=b_{0}+b_{1}x^{-1}+\dots+b_{m}x^{-m}$（$b_{j}\in\mathfrak{m}$）。$n,m$ を最小にとり、$n\ge m$ とする（逆も同様）。$1-b_{0}$ は単元なので $1=c_{1}x^{-1}+\dots+c_{m}x^{-m}$（$c_{j}\in\mathfrak{m}$）、$x^{n}=c_{1}x^{n-1}+\dots+c_{m}x^{n-m}$。これを最初の式の $x^{n}$ に代入すると、次数 $n-1$ 以下の同じ形の式になり、最小性に反する。
:::

::: theorem 整閉包は付値環の共通部分 {#ring:integral-closure-valuations keywords="the integral closure of A in K is the intersection of all valuation rings of K containing A" index="整閉包と付値環|せいへいほうとふちかん"}
（AC）体 $K$ の部分環 $A$ の $K$ における整閉包は、$A$ を含む $K$ の付値環すべての共通部分に等しい。
:::

::: proof
**Step 1（$\subset$）.** 付値環は正規（\ref{ring:valuation-properties.3}）なので、$A\subset V$ なら $A$ 上整な元は $V$ に属する。

**Step 2（$\supset$）.** $x\in K$ が $A$ 上整でないとする（$x\neq 0$）。$A'\defeq A[x^{-1}]$ で $x^{-1}A'\neq A'$：$1=x^{-1}(a_{0}+a_{1}x^{-1}+\dots+a_{n}x^{-n})$ なら $x^{n+1}$ を掛けて $x^{n+1}=a_{0}x^{n}+\dots+a_{n}$ となり $x$ は整。$x^{-1}A'$ を含む素イデアル $\mathfrak{P}$ に \ref{ring:chevalley-extension} を使うと、付値環 $V\supset A'\supset A$ で $x^{-1}\in\mathfrak{P}\subset\mathfrak{m}_{V}$。よって $x\notin V$。
:::

## 問題 {#ring:sec-icf-problems}

::: problem {#ring:prob-icf-gaussian}
$A=\Z$, $L=\Q(i)$ の整閉包が $\Z[i]$ であり、$\Z$ 上階数 2 の自由加群であることを確かめよ。
:::

::: solution
$a+bi$（$a,b\in\Q$）が整なら、トレース $2a$ とノルム $a^{2}+b^{2}$ が整数（\ref{ring:integral-trace-norm}）。$2a\in\Z$ と $4(a^{2}+b^{2})\in 4\Z$ から $(2b)^{2}\in\Z$ で $2b\in\Z$、さらに $(2a)^{2}+(2b)^{2}\equiv 0\pmod 4$ から $2a,2b$ はともに偶数（平方数は $4$ を法として $0,1$）。よって $a,b\in\Z$。逆に $\Z[i]$ の元は整。基底 $1,i$。
:::

::: problem {#ring:prob-icf-sqrt-d}
平方因子のない整数 $d\neq 1$ について、$\Q(\sqrt{d})$ における $\Z$ の整閉包は、$d\equiv 2,3\pmod 4$ なら $\Z[\sqrt{d}]$、$d\equiv 1\pmod 4$ なら $\Z[\frac{1+\sqrt{d}}{2}]$ であることを示せ。
:::

::: solution
$x=a+b\sqrt{d}$（$a,b\in\Q$, $b\neq 0$）の最小多項式は $X^{2}-2aX+(a^{2}-db^{2})$ で、整 $\iff 2a\in\Z$, $a^{2}-db^{2}\in\Z$（\ref{ring:integral-trace-norm} と、逆はこの多項式から）。$u=2a$, $v=2b$ とすると $u\in\Z$, $u^{2}-dv^{2}\in 4\Z$。$dv^{2}\in\Z$ と $d$ が平方因子をもたないことから $v\in\Z$。$u^{2}\equiv dv^{2}\pmod 4$：$d\equiv 2,3$ なら（平方数は $0,1$）$u,v$ はともに偶数で $a,b\in\Z$。$d\equiv 1$ なら $u\equiv v\pmod 2$ で、$x=\frac{u+v\sqrt{d}}{2}$（$u\equiv v$）全体は $\Z[\frac{1+\sqrt{d}}{2}]$。
:::

::: supplement
**整数論へ.** 代数体 $L$ の整数環 $\mathcal{O}_{L}$（$\Z$ の $L$ における整閉包）は、\ref{ring:integral-closure-finite} から階数 $[L:\Q]$ の自由 $\Z$ 加群で、次のページのクルル＝秋月の定理からデデキント環になる。イデアルの素因数分解、イデアル類群、単数群は数論の系列で扱う。
:::
