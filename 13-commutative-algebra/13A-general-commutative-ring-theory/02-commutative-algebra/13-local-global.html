# 局所的な性質と局所的でない性質 {#ring:page-local-global keywords="local property, local-global principle, properties that are not local, Noetherian is not a local property, open cover of Spec, f_1,...,f_n generate the unit ideal"}

環や加群の性質 $P$ が**局所的**であるとは、「$M$ が $P$ をもつ $\iff$ すべての素イデアル（または極大イデアル）$\mathfrak{p}$ で $M_{\mathfrak{p}}$ が $P$ をもつ」が成り立つことをいう。局所的な性質は、局所環に帰着して調べられる。このページでは、局所的な性質をまとめて証明し（\ref{ring:local-properties} の続き）、局所的でない性質には反例を与える。さらに、素イデアルごとの局所化ではなく、有限個の元 $f_{1},\dots,f_{n}$（$(f_{1},\dots,f_{n})=A$）による局所化 $A_{f_{i}}$（幾何的には $\Spec A$ の有限開被覆）について局所的な性質を調べる。ネーター性は後者の意味では局所的だが、前者の意味では局所的でない。

## 記法と定義の確認 {#ring:sec-lg-notation}

::: notation
- 環は可換。$A_{f}\defeq S^{-1}A$（$S=\{1,f,f^{2},\dots\}$）、$M_{f}$ も同様。局所化の完全性は \ref{ring:localization-exact}、和・共通部分・剰余との交換は \ref{ring:localization-operations}、根基との交換は \ref{ring:localization-commutes}。
- \ref{ring:local-properties}：（AC）$M=0$、単射・全射、平坦は、素イデアル全体でも極大イデアル全体でも局所的。
- 冪零根基 $\mathrm{nil}(A)$ は \ref{ring:nilradical}、クルル次元は \ref{ring:krull-dimension}。
- **選択公理**：素イデアル・極大イデアルでの局所化について述べる命題では（AC）と書く。有限個の $f_{i}$ についての命題は選択公理を使わない。
:::

## 局所的な性質 {#ring:sec-lg-local}

::: definition 局所的な性質 {#ring:local-property-def keywords="local property of rings and modules" index="局所的な性質|きょくしょてきなせいしつ"}
環（または加群）の性質 $P$ について、すべての $A$（$M$）で
$$
\begin{aligned}
A\text{ が }P&\iff\text{すべての }\mathfrak{p}\in\Spec A\text{ で }A_{\mathfrak{p}}\text{ が }P\\
&\iff\text{すべての極大イデアル }\mathfrak{m}\text{ で }A_{\mathfrak{m}}\text{ が }P
\end{aligned}
$$
が成り立つとき、$P$ は**局所的**であるという。
:::

::: theorem 局所的な性質の一覧 {#ring:local-properties-list keywords="reducedness, normality, inclusion of submodules, dimension are local" index="局所的な性質の一覧|きょくしょてきなせいしつのいちらん"}
（AC）次は局所的である（$\mathfrak{m}$ は極大イデアル全体を動く）。
1. 部分加群 $N,P\subset M$ について $N\subset P$。特に $N=P$、元 $a$ がイデアル $I$ に属すること。
2. 環が被約であること。
3. 整域が正規であること（\ref{ring:integral-localization.3}）。
4. \term[次元]{ring:krull-dimension}：$\dim A=\sup_{\mathfrak{m}}\dim A_{\mathfrak{m}}$。特に「$\dim A\le d$」は局所的。
5. 加群が $0$ であること、準同型が単射・全射であること、加群が平坦であること（\ref{ring:local-properties}）。
:::

::: proof
**Step 1（1）.** $N\subset P\iff(N+P)/P=0$。局所化は和・剰余と交換するので $((N+P)/P)_{\mathfrak{m}}\cong(N_{\mathfrak{m}}+P_{\mathfrak{m}})/P_{\mathfrak{m}}$ で、これが $0$ であることは $N_{\mathfrak{m}}\subset P_{\mathfrak{m}}$ と同値。\ref{ring:local-properties.1} から主張を得る。$a\in I\iff Aa\subset I$。

**Step 2（2）.** $\mathrm{nil}(A)_{\mathfrak{m}}=\mathrm{nil}(A_{\mathfrak{m}})$（\ref{ring:localization-commutes.3}）なので、$A$ 加群 $\mathrm{nil}(A)$ に \ref{ring:local-properties.1} を使う。

**Step 3（4）.** $A$ の素イデアルの鎖 $\mathfrak{p}_{0}\subsetneq\dots\subsetneq\mathfrak{p}_{r}$ について、$\mathfrak{p}_{r}$ を含む極大イデアル $\mathfrak{m}$ をとる（\ref{ring:maximal-ideal-existence}）と、すべての $\mathfrak{p}_{i}$ は $A\setminus\mathfrak{m}$ と交わらず、$A_{\mathfrak{m}}$ の素イデアルの鎖 $\mathfrak{p}_{0}A_{\mathfrak{m}}\subsetneq\dots$ に対応する（\ref{ring:localization-primes}。対応は包含を保つ全単射）。よって $\dim A\le\sup\dim A_{\mathfrak{m}}$。逆に $A_{\mathfrak{m}}$ の鎖は $A$ への逆像で $A$ の鎖になる。素イデアル全体についても同じ（$\mathfrak{p}\subset\mathfrak{m}$ なら、同じ対応から $\dim A_{\mathfrak{p}}\le\dim A_{\mathfrak{m}}$）。
:::

## 有限開被覆での局所性 {#ring:sec-lg-cover}

::: lemma 単位イデアルの冪 {#ring:unit-ideal-powers keywords="if f_1,...,f_n generate the unit ideal then so do their powers" index="単位イデアルの生成元|たんいいであるのせいせいげん"}
$(f_{1},\dots,f_{n})=A$ なら、すべての $k\ge1$ で $(f_{1}^{k},\dots,f_{n}^{k})=A$。
:::

::: proof
$1=\sum_{i}a_{i}f_{i}$ と書き、両辺を $nk$ 乗する。\ref{ring:binomial}で展開した各項は $c\,f_{1}^{e_{1}}\cdots f_{n}^{e_{n}}$（$e_{1}+\dots+e_{n}=nk$）の形で、鳩の巣原理からある $e_{i}\ge k$。したがって各項は $(f_{1}^{k},\dots,f_{n}^{k})$ に属し、$1$ も属する。
:::

::: theorem 有限開被覆での局所性 {#ring:local-on-cover keywords="vanishing, finite generation and Noetherianity are local on a finite open cover D(f_i)" index="開被覆での局所性|かいひふくでのきょくしょせい"}
$(f_{1},\dots,f_{n})=A$ とする。
1. $A$ 加群 $M$ について $M=0\iff$ すべての $i$ で $M_{f_{i}}=0$。
2. $M$ が有限生成 $A$ 加群 $\iff$ すべての $i$ で $M_{f_{i}}$ が有限生成 $A_{f_{i}}$ 加群。
3. $A$ がネーター環 $\iff$ すべての $i$ で $A_{f_{i}}$ がネーター環。
:::

::: proof
**Step 1（1）.** $\Rightarrow$ は明らか。$m\in M$ をとる。$m/1=0\in M_{f_{i}}$ なので $f_{i}^{k_{i}}m=0$ となる $k_{i}$ があり、$k=\max k_{i}$ とすると $f_{i}^{k}m=0$（すべての $i$）。\ref{ring:unit-ideal-powers} から $1=\sum b_{i}f_{i}^{k}$ と書けて $m=\sum b_{i}f_{i}^{k}m=0$。

**Step 2（2）.** $\Rightarrow$：生成元の像が生成する。$\Leftarrow$：各 $i$ で $M_{f_{i}}$ の有限個の生成元をとり、分母を払って $m_{ij}/1$（$m_{ij}\in M$）の形にしてよい（$f_{i}$ の冪は単元）。$N$ を $m_{ij}$ 全体（有限個）で生成される部分加群とすると $N_{f_{i}}=M_{f_{i}}$、すなわち $(M/N)_{f_{i}}=0$（局所化の完全性）。1 から $M=N$。

**Step 3（3、$\Rightarrow$）.** $A_{f}$ のイデアルの昇鎖 $J_{1}\subset J_{2}\subset\cdots$ をとる。$j:A\to A_{f}$ による逆像 $j^{-1}(J_{k})$ は $A$ の昇鎖なので、ある所から一定。$J_{k}=S^{-1}j^{-1}(J_{k})$（\ref{ring:localization-ideals.2}）なので $J_{k}$ も一定。

**Step 4（3、$\Leftarrow$）.** $A$ のイデアルの昇鎖 $I_{1}\subset I_{2}\subset\cdots$ をとる。各 $i$ で $(I_{k})_{f_{i}}$ は $A_{f_{i}}$ の昇鎖なので $k\ge N_{i}$ で一定。$N=\max_{i}N_{i}$ とすると、$k\ge N$ で $(I_{k}/I_{N})_{f_{i}}\cong(I_{k})_{f_{i}}/(I_{N})_{f_{i}}=0$（すべての $i$）。1 から $I_{k}=I_{N}$。

::: hypcheck
- **前提「有限個」**：Step 1 で $k=\max k_{i}$ をとり、Step 4 で $N=\max N_{i}$ をとるのに使った。素イデアル全体での局所化（無限個）では 3 は偽（\ref{ring:non-local-properties.1}）。1 は（AC のもとで）素イデアル全体でも正しい（\ref{ring:local-properties.1}）。
- **選択公理**：使わない。
:::
:::

## 局所的でない性質 {#ring:sec-lg-nonlocal}

::: example 局所的でない性質 {#ring:non-local-properties keywords="Noetherian, domain, local, finitely generated, connected are not local properties" index="局所的でない性質|きょくしょてきでないせいしつ"}
次の性質は、すべての素イデアルでの局所化がその性質をもつのに、環（加群）自身はもたない例がある。
1. **ネーター性**：$A=\prod_{n\in\N}\mathbb{F}_{2}$。
   - $A$ はネーターでない：$I_{N}\defeq\{x : n\ge N\text{ で }x_{n}=0\}$ は真に増加するイデアルの鎖。
   - すべての $\mathfrak{p}$ で $A_{\mathfrak{p}}\cong\mathbb{F}_{2}$（体なのでネーター）：$A$ のすべての元は $x^{2}=x$ をみたし、$A_{\mathfrak{p}}$ の元も同じ（$(a/s)^{2}=a/s^{2}$ で、$s^{2}=s$）。局所環 $A_{\mathfrak{p}}$ の元 $y$ について $y(1-y)=0$ で、$y$ と $1-y$ の和は $1$ なので両方が極大イデアルに属することはなく、一方は単元、したがって他方は $0$。よって $A_{\mathfrak{p}}=\{0,1\}\cong\mathbb{F}_{2}$（$A_{\mathfrak{p}}\neq 0$）。

   \ref{ring:local-on-cover.3} と比べると、$\Spec A$ は「無限個の点がばらばらに並んだ」空間で、有限個の $A_{f_{i}}$ で覆うと、ある $A_{f_{i}}$ は無限個の点を含み、ネーターでない。
2. **整域であること・連結性**：$A=k\times k$（$k$ は体）。素イデアルは $\mathfrak{p}_{1}=k\times 0$ と $\mathfrak{p}_{2}=0\times k$ の二つ（\ref{ring:prob-primes-of-product}）。$A_{\mathfrak{p}_{1}}$ では $(0,1)\notin\mathfrak{p}_{1}$ が単元になり $(1,0)\cdot(0,1)=0$ から $(1,0)/1=0$、よって $A_{\mathfrak{p}_{1}}\cong k$（第 2 成分。$\mathfrak{p}_{2}$ も同様）。局所化はすべて体だが、$A$ は零因子と自明でない冪等元 $(1,0)$ をもつ。
3. **局所環であること**：$\Z$ は局所環でないが、局所化 $\Z_{(p)}$, $\Q$ はすべて局所環（\ref{ring:localization-at-prime}）。
4. **有限生成であること**：$\Z$ 加群 $M=\bigoplus_{p}\Z/p\Z$（全素数）。局所化は直和と交換し（\ref{ring:localization-commutes.1}）、$q\neq p$ なら $q$ は $\Z_{(p)}$ の単元なので $(\Z/q\Z)_{(p)}=0$。よって $M_{(p)}\cong\Z/p\Z$、$M_{(0)}=0$ で、どれも有限生成。一方 $M$ は有限生成でない：有限生成なら生成元の位数の積 $n\neq0$ が $M$ を零化するが、$p\nmid n$ となる素数 $p$ の成分は零化されない。
:::

::: remark 局所的でない性質をどう回復するか
局所的でない性質は、局所的な条件に大域的な条件を足すと回復することが多い。
- ネーター性：有限個の $A_{f_{i}}$ で覆えれば回復する（\ref{ring:local-on-cover.3}）。
- 有限生成性：同上（\ref{ring:local-on-cover.2}）。
- 整域：（AC）$A$ が被約で、極小素イデアル $\mathfrak{p}_{0}$ がただ一つなら整域。実際、どの素イデアルも極小素イデアルを含む（素イデアルの減少鎖の共通部分は素イデアルなので、ツォルンの補題が使える）ので、すべての素イデアルは $\mathfrak{p}_{0}$ を含み、\ref{ring:nilradical} から $\mathrm{nil}(A)=\mathfrak{p}_{0}$。被約なので $\mathfrak{p}_{0}=0$ は素イデアル。被約は局所的だが、「極小素イデアルがただ一つ」は局所的でない（2 の例）。
:::

::: supplement
**数論的な性質.** 「PID である」「UFD である」「自由加群である」も局所的でない：$\Z[\sqrt{-5}]$ はすべての極大イデアルでの局所化が DVR（PID・UFD）だが、自身は PID でも UFD でもなく、イデアル $(2,1+\sqrt{-5})$ は局所的には単項（階数 1 の自由加群）だが自由でない（\ref{ring:local-not-global}, \ref{ring:z-sqrt-minus-5-dedekind}）。局所的な条件「局所自由」に大域的な条件「有限表示」を足すと「射影的」が回復する（\ref{ring:locally-free-projective}）。

**高い視点.** \ref{ring:local-on-cover.1} は、$\Spec A$ 上の層 $\widetilde{M}$ について「切断が局所的に $0$ なら $0$」という層の公理（の一部）の代数版である。素イデアルでの局所化 $M_{\mathfrak{p}}$ は点 $\mathfrak{p}$ での茎にあたり、茎ごとの性質（被約・正規・次元）は局所的、有限性のような「大域的な量」の性質（ネーター・有限生成）は有限個の開集合では回復するが茎ごとでは回復しない、という違いが 1 の例に現れている。これは見方の説明であり、層の理論はこのページでは使っていない。
:::

## 問題 {#ring:sec-lg-problems}

::: problem {#ring:prob-reduced-cover}
$(f_{1},\dots,f_{n})=A$ とする。$A$ が被約であることと、すべての $i$ で $A_{f_{i}}$ が被約であることは同値であることを、選択公理を使わずに示せ。
:::

::: solution
$\mathrm{nil}(A)_{f_{i}}=\mathrm{nil}(A_{f_{i}})$（\ref{ring:localization-commutes.3}。その証明は選択公理を使わない）。よって「すべての $A_{f_{i}}$ が被約」$\iff$「すべての $i$ で $\mathrm{nil}(A)_{f_{i}}=0$」$\iff$「$\mathrm{nil}(A)=0$」（\ref{ring:local-on-cover.1}）。
:::
