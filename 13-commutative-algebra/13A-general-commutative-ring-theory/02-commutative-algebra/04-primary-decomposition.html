# 準素分解と随伴素イデアル {#ring:page-primary-decomposition keywords="associated prime, Ass(M), 素因子, zero divisors, prime filtration, primary submodule, primary ideal, primary decomposition, Lasker-Noether theorem, embedded prime, irreducible submodule"}

整数 $n=\prod p_{i}^{e_{i}}$ のイデアルは $n\Z=\bigcap p_{i}^{e_{i}}\Z$ と素数冪のイデアルの共通部分に分解する。ネーター環ではこれが一般化され、すべてのイデアル（加群の部分加群）が**準素イデアル**の有限個の共通部分に分解する（**ラスカー＝ネーターの定理**、\ref{ring:primary-decomposition}）。分解そのものは一意でないが、現れる素イデアルの組は一意で、それが**随伴素イデアル**の集合 $\operatorname{Ass}$ である（\ref{ring:associated-prime}）。このページでは随伴素イデアルを先に調べ（零因子の集合との関係 \ref{ring:zero-divisors-ass}、有限性 \ref{ring:prime-filtration}、局所化と台との関係）、それを使って準素分解の存在と一意性を示す。随伴素イデアルは、深さやコーエン＝マコーレー環（\ref{ring:page-cohen-macaulay}）の議論でも中心的な役割を果たす。

> 松村『可換環論』§6 の流れ（随伴素イデアルを先に扱う方式）を参考にした。

## 記法と定義の確認 {#ring:sec-pd-notation}

::: notation
- 環は可換、加群は $A$ 加群。ネーター環・極大条件・ネーター帰納法は \ref{ring:noetherian-module}, \ref{ring:noetherian-prime-product}、局所化と台は \ref{ring:module-localization}, \ref{ring:support}, \ref{ring:support-properties}、零化イデアルと巡回加群は \ref{mod:annihilator}, \ref{mod:cyclic-module}、根基は \ref{ring:radical-ideal}。
- $a\in A$ が加群 $M$ の**零因子**とは、$ax=0$ となる $0\neq x\in M$ があること。
- **選択公理**：ネーター環の極大条件・ネーター帰納法を通して従属選択公理を使う。
:::

## 随伴素イデアル {#ring:sec-pd-ass}

::: definition 随伴素イデアル {#ring:associated-prime keywords="associated prime of a module, Ass(M)" index="随伴素イデアル|ずいはんそいである, 付属素イデアル|ふぞくそいである"}
$A$ 加群 $M$ について、ある $x\in M$ の零化イデアル $\operatorname{Ann}(x)$ として表される素イデアル $\mathfrak{p}$ を $M$ の**随伴素イデアル**といい、その全体を $\operatorname{Ass}(M)$（$\operatorname{Ass}_{A}(M)$）と書く。$\mathfrak{p}\in\operatorname{Ass}(M)$ は、$A/\mathfrak{p}$ と同型な部分加群 $Ax\subset M$ があることと同値である（\ref{mod:cyclic-module}）。
:::

::: example
1. 素イデアル $\mathfrak{p}$ について $\operatorname{Ass}(A/\mathfrak{p})=\{\mathfrak{p}\}$：$A/\mathfrak{p}$ は整域なので、$0$ でない元の零化イデアルはすべて $\mathfrak{p}$。
2. $\Z/12\Z$ では $\operatorname{Ann}(6)=2\Z$, $\operatorname{Ann}(4)=3\Z$ で、$\operatorname{Ass}=\{2\Z,3\Z\}$（他の元の零化イデアルは $4\Z,6\Z,12\Z$ など素でないか、同じもの）。
3. $\operatorname{Ass}(0)=\emptyset$。
:::

::: theorem 随伴素イデアルの存在 {#ring:ass-nonempty keywords="maximal annihilators are associated primes, Ass(M) is nonempty" index="随伴素イデアルの存在|ずいはんそいであるのそんざい"}
（DC）$A$ をネーター環、$M\neq 0$ を $A$ 加群とする。$\{\operatorname{Ann}(x) : 0\neq x\in M\}$ の極大元は素イデアルである。特に $\operatorname{Ass}(M)\neq\emptyset$。
:::

::: proof
**Step 1.** 集合 $\Sigma=\{\operatorname{Ann}(x) : x\neq 0\}$ は空でなく、ネーター性から極大元 $\mathfrak{p}=\operatorname{Ann}(x)$ をもつ（\ref{ring:noetherian-module} の 2）。$x\neq 0$ なので $1\notin\mathfrak{p}$。

**Step 2.** $ab\in\mathfrak{p}$, $b\notin\mathfrak{p}$ とする。$bx\neq 0$ で、$\operatorname{Ann}(bx)\supset\operatorname{Ann}(x)=\mathfrak{p}$。極大性から $\operatorname{Ann}(bx)=\mathfrak{p}$。$a(bx)=abx=0$ なので $a\in\operatorname{Ann}(bx)=\mathfrak{p}$。よって $\mathfrak{p}$ は素イデアル。

::: hypcheck
- **前提「ネーター」**：Step 1 の極大元の存在に使った。外すと偽：有理数冪の環 $V$（\ref{ring:rational-exponent-ring}）と $M=V/tV$ では、$0$ でない元 $\bar x$（$x=t^{q}u$, $0\le q<1$）の零化イデアルは $\{a : \operatorname{ord}a\ge 1-q\}$ で、$V$ の素イデアル $0$, $\mathfrak{m}V=\{\operatorname{ord}>0\}$ のどちらでもない。よって $\operatorname{Ass}(M)=\emptyset$。
:::
:::

::: corollary 零因子と随伴素イデアル {#ring:zero-divisors-ass keywords="the set of zero divisors on M is the union of the associated primes" index="零因子の集合|れいいんしのしゅうごう"}
（DC）ネーター環 $A$ と加群 $M$ について、$M$ の零因子全体は $\bigcup_{\mathfrak{p}\in\operatorname{Ass}(M)}\mathfrak{p}$ に等しい。
:::

::: proof
$a$ が零因子（$ax=0$, $x\neq 0$）なら $a\in\operatorname{Ann}(x)$。$\{\operatorname{Ann}(y) : y\neq 0,\ \operatorname{Ann}(y)\supset\operatorname{Ann}(x)\}$ の極大元 $\operatorname{Ann}(y)$ は、\ref{ring:ass-nonempty} の Step 2 と同じ議論で素イデアル（極大性の比較はこの集合の中で行い、$\operatorname{Ann}(by)\supset\operatorname{Ann}(y)\supset\operatorname{Ann}(x)$ なので集合に属する）で、$a\in\operatorname{Ann}(y)\in\operatorname{Ass}(M)$。逆に $a\in\mathfrak{p}=\operatorname{Ann}(x)$, $x\neq 0$ なら $ax=0$。
:::

::: proposition 完全列と随伴素イデアル {#ring:ass-exact keywords="Ass of a short exact sequence" index="随伴素イデアルと完全列|ずいはんそいであるとかんぜんれつ"}
短完全列 $0\to M'\to M\to M''\to 0$ について $\operatorname{Ass}(M')\subset\operatorname{Ass}(M)\subset\operatorname{Ass}(M')\cup\operatorname{Ass}(M'')$。
:::

::: proof
**Step 1（左の包含）.** $M'$ を $M$ の部分加群とみなせば、$M'$ の元の零化イデアルは $M$ の元としての零化イデアルと同じ。

**Step 2（右の包含）.** $\mathfrak{p}=\operatorname{Ann}(x)\in\operatorname{Ass}(M)$ とし、$N=Ax\cong A/\mathfrak{p}$。$N$ の $0$ でない元の零化イデアルはすべて $\mathfrak{p}$（$A/\mathfrak{p}$ は整域）。$N\cap M'\neq 0$ なら、その $0$ でない元 $y$ で $\mathfrak{p}=\operatorname{Ann}(y)\in\operatorname{Ass}(M')$。$N\cap M'=0$ なら、$N$ は $M''$ に単射で移り、像 $\cong A/\mathfrak{p}$ なので $\mathfrak{p}\in\operatorname{Ass}(M'')$。
:::

::: theorem 素イデアルによるフィルトレーションと有限性 {#ring:prime-filtration keywords="prime filtration of a finitely generated module, Ass(M) is finite" index="素イデアルによるフィルトレーション|そいであるによるふぃるとれーしょん"}
（DC）$A$ をネーター環、$M$ を有限生成 $A$ 加群とする。
1. 部分加群の列 $0=M_{0}\subset M_{1}\subset\dots\subset M_{n}=M$ で、各 $M_{i}/M_{i-1}\cong A/\mathfrak{p}_{i}$（$\mathfrak{p}_{i}$ は素イデアル）となるものがある。
2. $\operatorname{Ass}(M)\subset\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}\}$。特に $\operatorname{Ass}(M)$ は有限集合。
:::

::: proof
**Step 1（1）.** $M\neq 0$ なら $\mathfrak{p}_{1}\in\operatorname{Ass}(M)$ をとり、$M_{1}\defeq Ax_{1}\cong A/\mathfrak{p}_{1}$。$M/M_{1}\neq 0$ ならその随伴素イデアル $\mathfrak{p}_{2}=\operatorname{Ann}(\bar x_{2})$ をとり $M_{2}\defeq M_{1}+Ax_{2}$（$M_{2}/M_{1}\cong A/\mathfrak{p}_{2}$）。これを続けると $M_{1}\subsetneq M_{2}\subsetneq\cdots$ はネーター加群 $M$（\ref{ring:noetherian-exact} の 2）の昇鎖なので有限で止まり、止まるのは $M_{n}=M$ のとき。

**Step 2（2）.** $0\to M_{i-1}\to M_{i}\to A/\mathfrak{p}_{i}\to 0$ に \ref{ring:ass-exact} を繰り返し使うと $\operatorname{Ass}(M)\subset\bigcup_{i}\operatorname{Ass}(A/\mathfrak{p}_{i})=\{\mathfrak{p}_{i}\}$。
:::

::: proposition 局所化と台 {#ring:ass-localization keywords="Ass commutes with localization, minimal primes of the support are associated" index="随伴素イデアルと局所化|ずいはんそいであるときょくしょか"}
（DC）$A$ をネーター環、$M$ を $A$ 加群、$S$ を積閉集合とする。
1. $\operatorname{Ass}_{S^{-1}A}(S^{-1}M)=\{S^{-1}\mathfrak{p} : \mathfrak{p}\in\operatorname{Ass}(M),\ \mathfrak{p}\cap S=\emptyset\}$。
2. $\operatorname{Ass}(M)\subset\operatorname{Supp}(M)$ で、$\operatorname{Supp}(M)$ の（包含について）極小な元は $\operatorname{Ass}(M)$ に属する。特に、イデアル $I$ を含む極小素イデアルは $\operatorname{Ass}(A/I)$ に属する。
:::

::: proof
**Step 1（1、⊃）.** $\mathfrak{p}=\operatorname{Ann}(x)$, $\mathfrak{p}\cap S=\emptyset$ とする。$\frac{b}{s}\cdot\frac{x}{1}=0\iff$ ある $u\in S$ で $ubx=0\iff ub\in\mathfrak{p}\iff b\in\mathfrak{p}$（$u\notin\mathfrak{p}$）。よって $\operatorname{Ann}(x/1)=S^{-1}\mathfrak{p}$ で、これは素イデアル（\ref{ring:localization-primes}）。

**Step 2（1、⊂）.** $\mathfrak{q}=\operatorname{Ann}(x/s)$ を $S^{-1}M$ の随伴素イデアルとし、$\mathfrak{p}\defeq\mathfrak{q}\cap A$（$\mathfrak{q}=S^{-1}\mathfrak{p}$, $\mathfrak{p}\cap S=\emptyset$）。$\mathfrak{p}=(a_{1},\dots,a_{n})$（ネーター）で、$a_{i}x/1=0$ から $t_{i}a_{i}x=0$ となる $t_{i}\in S$ があり、$t=\prod t_{i}$ とおくと $\mathfrak{p}\subset\operatorname{Ann}(tx)$。逆に $btx=0$ なら $\frac{b}{1}\cdot\frac{x}{s}=0$（$t$ は単元）なので $b\in\mathfrak{q}\cap A=\mathfrak{p}$。よって $\mathfrak{p}=\operatorname{Ann}(tx)\in\operatorname{Ass}(M)$。

**Step 3（2）.** $\mathfrak{p}=\operatorname{Ann}(x)\in\operatorname{Ass}(M)$ なら、$x/1\neq 0$ in $M_{\mathfrak{p}}$（$ux=0$ なら $u\in\mathfrak{p}$）なので $\mathfrak{p}\in\operatorname{Supp}(M)$。$\mathfrak{p}$ が $\operatorname{Supp}(M)$ の極小元なら、$M_{\mathfrak{p}}\neq 0$ で $A_{\mathfrak{p}}$ はネーターなので $\operatorname{Ass}(M_{\mathfrak{p}})\neq\emptyset$（\ref{ring:ass-nonempty}）。1 からその元は $\mathfrak{q}A_{\mathfrak{p}}$（$\mathfrak{q}\in\operatorname{Ass}(M)$, $\mathfrak{q}\subset\mathfrak{p}$）で、$\mathfrak{q}\in\operatorname{Supp}(M)$ なので極小性から $\mathfrak{q}=\mathfrak{p}$。最後の主張は $\operatorname{Supp}(A/I)=V(I)$（\ref{ring:support-properties} の 1）から。
:::

::: definition 極小素因子と埋没素因子 {#ring:embedded-prime keywords="minimal associated prime, embedded prime" index="埋没素因子|まいぼつそいんし, 埋没素イデアル|まいぼつそいである, 極小素因子|きょくしょうそいんし, 極小素イデアル|きょくしょうそいである"}
$\operatorname{Ass}(M)$ の極小元を $M$ の**極小素因子**（極小素イデアル、孤立素因子）、それ以外を**埋没素因子**（埋没素イデアル）という。\ref{ring:ass-localization} の 2 から、極小素イデアルは $\operatorname{Supp}(M)$ の極小元と一致する。
:::

## 準素分解 {#ring:sec-pd-primary}

::: definition 準素部分加群・準素イデアル {#ring:primary keywords="primary submodule, primary ideal, p-primary" index="準素イデアル|じゅんそいである, 準素部分加群|じゅんそぶぶんかぐん"}
$A$ をネーター環、$M$ を有限生成 $A$ 加群とする。部分加群 $Q\subsetneq M$ で $\operatorname{Ass}(M/Q)$ がただ一つの素イデアル $\mathfrak{p}$ からなるものを **$\mathfrak{p}$ 準素**という。$M=A$ のとき、$\mathfrak{p}$ 準素なイデアルを**準素イデアル**という。
:::

::: proposition 準素イデアルの古典的な特徴付け {#ring:primary-ideal-classical keywords="q is primary iff ab in q and a not in q imply b^n in q, radical of a primary ideal is prime" index="準素イデアルの特徴付け|じゅんそいであるのとくちょうづけ"}
（DC）ネーター環 $A$ のイデアル $\mathfrak{q}\neq A$ について、次は同値である。
1. $\mathfrak{q}$ は準素イデアル（$\operatorname{Ass}(A/\mathfrak{q})=\{\mathfrak{p}\}$）。
2. $ab\in\mathfrak{q}$, $a\notin\mathfrak{q}$ なら、ある $n$ で $b^{n}\in\mathfrak{q}$。

このとき $\mathfrak{p}=\sqrt{\mathfrak{q}}$。
:::

::: proof
**Step 1（1⇒2）.** $A/\mathfrak{q}$ の零因子全体は $\mathfrak{p}$（\ref{ring:zero-divisors-ass}）。また $\sqrt{\mathfrak{q}}$ は $\mathfrak{q}$ を含む素イデアルの共通部分（\ref{ring:radical-properties} の 2）で、それは $V(\mathfrak{q})=\operatorname{Supp}(A/\mathfrak{q})$ の極小元の共通部分に等しく、極小元は $\operatorname{Ass}=\{\mathfrak{p}\}$ に属するので $\sqrt{\mathfrak{q}}=\mathfrak{p}$。$ab\in\mathfrak{q}$, $a\notin\mathfrak{q}$ なら $b$ は $A/\mathfrak{q}$ の零因子なので $b\in\mathfrak{p}=\sqrt{\mathfrak{q}}$。

**Step 2（2⇒1）.** 2 から、$A/\mathfrak{q}$ の零因子は $\sqrt{\mathfrak{q}}$ に属する。$\sqrt{\mathfrak{q}}$ は素イデアル：$ab\in\sqrt{\mathfrak{q}}$ なら $a^{n}b^{n}\in\mathfrak{q}$ で、$a^{n}\notin\mathfrak{q}$ なら $b^{nm}\in\mathfrak{q}$。$\operatorname{Ass}(A/\mathfrak{q})$ の元 $\mathfrak{p}'$ は零因子からなるので $\mathfrak{p}'\subset\sqrt{\mathfrak{q}}$、また $\mathfrak{q}$ を含む素イデアルなので $\mathfrak{p}'\supset\sqrt{\mathfrak{q}}$。よって $\operatorname{Ass}=\{\sqrt{\mathfrak{q}}\}$（空でないことは \ref{ring:ass-nonempty}）。
:::

::: example
1. $\Z$ の準素イデアルは $0$ と $p^{e}\Z$（$p$ 素数、$e\ge 1$）。$p^{e}\Z$ は 2 をみたし、$\sqrt{p^{e}\Z}=p\Z$。$6\Z$ は準素でない（$\operatorname{Ass}=\{2\Z,3\Z\}$）。
2. 素イデアルの冪は準素とは限らない：$A=k[x,y,z]/(xy-z^{2})$, $\mathfrak{p}=(x,z)$ について $\mathfrak{p}^{2}$ は準素でない（$xy=z^{2}\in\mathfrak{p}^{2}$ だが、$x\notin\mathfrak{p}^{2}$（$x,y,z$ を次数 $1$ とすると $\mathfrak{p}^{2}$ は次数 $2$ 以上の元からなる）で、$y^{n}\notin\mathfrak{p}^{2}$（$x=0$ とおいた $k[y,z]/(z^{2})$ で $\mathfrak{p}^{2}$ の像は $0$、$y^{n}$ の像は $0$ でない））。
3. 極大イデアル $\mathfrak{m}$ について、$\sqrt{\mathfrak{q}}=\mathfrak{m}$ なら $\mathfrak{q}$ は $\mathfrak{m}$ 準素（$\operatorname{Supp}(A/\mathfrak{q})=\{\mathfrak{m}\}$ で、$\operatorname{Ass}$ は空でなく台に含まれる）。特に $\mathfrak{m}^{n}$ は $\mathfrak{m}$ 準素。
:::

::: theorem 準素分解（ラスカー＝ネーター） {#ring:primary-decomposition keywords="existence and uniqueness of primary decomposition, Lasker-Noether theorem, irredundant primary decomposition" index="準素分解|じゅんそぶんかい, ラスカー＝ネーターの定理|らすかーねーたーのていり, 無駄のない準素分解|むだのないじゅんそぶんかい"}
（DC）$A$ をネーター環、$M$ を有限生成 $A$ 加群、$N\subsetneq M$ を部分加群とする。
1. （存在）$N=Q_{1}\cap\dots\cap Q_{r}$（$Q_{i}$ は $\mathfrak{p}_{i}$ 準素部分加群）と書ける。さらに、どの $Q_{i}$ も省けず、$\mathfrak{p}_{i}$ が互いに異なるようにできる（**無駄のない**準素分解）。
2. （素イデアルの一意性）無駄のない準素分解について $\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}\}=\operatorname{Ass}(M/N)$。
:::

::: proof
**Step 1（既約部分加群）.** 部分加群 $N\subsetneq M$ が、$N=N_{1}\cap N_{2}$ なら $N=N_{1}$ または $N=N_{2}$ をみたすとき**既約**という。ネーター帰納法：有限個の既約部分加群の共通部分に書けない真の部分加群全体が空でなければ極大元 $N$ があり、$N$ は既約でないので $N=N_{1}\cap N_{2}$, $N\subsetneq N_{i}$。極大性から $N_{i}$ は（$N_{i}=M$ でなければ）既約部分加群の有限共通部分で、$N$ もそうなる（$N_{i}=M$ なら $N=N_{j}$ となり矛盾）。

**Step 2（既約なら準素）.** $N$ を既約とし、$\operatorname{Ass}(M/N)$ が二つの異なる素イデアル $\mathfrak{p}=\operatorname{Ann}(\bar x)$, $\mathfrak{q}=\operatorname{Ann}(\bar y)$ を含むとする。$A\bar x\cong A/\mathfrak{p}$, $A\bar y\cong A/\mathfrak{q}$ で、$A\bar x\cap A\bar y$ の $0$ でない元の零化イデアルは $\mathfrak{p}$ にも $\mathfrak{q}$ にも等しくなるので、$A\bar x\cap A\bar y=0$。$\pi:M\to M/N$ について $N=\pi^{-1}(A\bar x)\cap\pi^{-1}(A\bar y)$ で、どちらも $N$ より真に大きく、既約性に反する。$\operatorname{Ass}(M/N)\neq\emptyset$（\ref{ring:ass-nonempty}）なので、ちょうど一つ。

**Step 3（無駄をなくす）.** 同じ $\mathfrak{p}$ に対する準素部分加群の共通部分 $Q\cap Q'$ は $\mathfrak{p}$ 準素：$M/(Q\cap Q')\to M/Q\oplus M/Q'$ は単射なので $\operatorname{Ass}(M/(Q\cap Q'))\subset\operatorname{Ass}(M/Q)\cup\operatorname{Ass}(M/Q')=\{\mathfrak{p}\}$（\ref{ring:ass-exact}、直和の場合）で、空でない。同じ素イデアルの成分をまとめ、省ける成分を除けば無駄のない分解を得る。

**Step 4（2）.** $M/N\to\bigoplus_{i}M/Q_{i}$ は単射なので $\operatorname{Ass}(M/N)\subset\{\mathfrak{p}_{i}\}$。逆に、各 $i$ について $N_{i}\defeq\bigcap_{j\neq i}Q_{j}\supsetneq N$（無駄がない）で、$N_{i}\cap Q_{i}=N$ なので $N_{i}/N\to M/Q_{i}$ は単射。$N_{i}/N\neq 0$ なので $\emptyset\neq\operatorname{Ass}(N_{i}/N)\subset\operatorname{Ass}(M/Q_{i})=\{\mathfrak{p}_{i}\}$、よって $\mathfrak{p}_{i}\in\operatorname{Ass}(N_{i}/N)\subset\operatorname{Ass}(M/N)$。
:::

::: example 埋没素因子と分解の非一意性 {#ring:primary-decomposition-example}
体 $k$ 上の $A=k[x,y]$ で $I=(x^{2},xy)$ とする。
$$
I=(x)\cap(x^{2},y)=(x)\cap(x,y)^{2}.
$$
実際、$f\in(x)\cap(x^{2},y)$ なら $f=xg$ で、$xg\in(x^{2},y)$ は $g$ の定数項が $0$、すなわち $g\in(x,y)$ と同値なので $f\in(x^{2},xy)$（二つ目も同様）。$(x)$ は素、$(x^{2},y)$ と $(x,y)^{2}$ はどちらも根基が極大イデアル $(x,y)$ なので $(x,y)$ 準素（上の例の 3）。よって $\operatorname{Ass}(A/I)=\{(x),(x,y)\}$ で、$(x,y)$ は埋没素因子。分解は一意でないが、素イデアルの組 $\{(x),(x,y)\}$ と、極小素イデアル $(x)$ の成分 $(x)$ は一意である（極小素イデアルの成分の一意性は、局所化 $I A_{(x)}\cap A$ として成分が復元できることによる）。幾何的には、$y$ 軸（$x=0$）に原点の「埋め込まれた点」が付いた図形である。
:::

::: supplement
**極小成分の一意性.** 無駄のない準素分解で、極小素イデアル $\mathfrak{p}_{i}$ に対応する成分 $Q_{i}$ は分解によらず $Q_{i}=\{x\in M : x/1\in N_{\mathfrak{p}_{i}}\}$（$N$ の $\mathfrak{p}_{i}$ での局所化の引き戻し）として一意に決まる。埋没素因子の成分は一意でない（上の例）。

**零因子と次元への応用.** \ref{ring:zero-divisors-ass} と素イデアルの回避（\ref{ring:prime-avoidance}）を組み合わせると、「イデアル $I$ が $M$ の零因子だけからなるなら、ある随伴素イデアルに含まれる」ことがわかり、これが $M$ 正則元の存在、ひいては深さの理論（\ref{ring:page-depth}）の出発点になる。

**計算の観点.** $\Q$ 上の多項式環のイデアルの準素分解や随伴素イデアルは、グレブナー基底を使って計算できることが知られている（ギアーニ・トレイガー・ザカリアス、1988 年など。本サイト未収録）。
:::

## 問題 {#ring:sec-pd-problems}

::: problem {#ring:prob-ass-z-modules}
有限アーベル群 $M$（$\Z$ 加群）について、$\operatorname{Ass}(M)$ は $\abs{M}$ を割り切る素数 $p$ に対する $p\Z$ 全体であることを示せ。また $\operatorname{Ass}(\Q)=\{0\}$、$\operatorname{Ass}(\Q/\Z)$ はすべての $p\Z$ からなることを示せ。
:::

::: solution
**Step 1.** $\operatorname{Ann}(x)=n\Z$（$n$ は $x$ の位数）が素イデアルになるのは $n$ が素数のとき。$p\mid\abs{M}$ ならコーシーの定理から位数 $p$ の元があり $p\Z\in\operatorname{Ass}$。逆に位数 $p$ の元があれば $p\mid\abs{M}$（ラグランジュ）。$0$ は零化イデアルにならない（有限群の元は有限位数）。

**Step 2.** $\Q$ の $0$ でない元の零化イデアルは $0$（ねじれがない）で素。$\Q/\Z$ では $1/p+\Z$ の零化イデアルが $p\Z$、$0$ でない元は有限位数なので $0$ は現れない。
:::

::: problem {#ring:prob-primary-power-maximal}
ネーター局所環 $(A,\mathfrak{m})$ で、$\sqrt{I}=\mathfrak{m}$ となるイデアル $I$ について、$\mathfrak{m}^{n}\subset I$ となる $n$ があることを示せ。
:::

::: solution
$A/I$ はネーター環で、その冪零根基 $\sqrt{I}/I=\mathfrak{m}/I$ は冪零（\ref{ring:noetherian-prime-product} の 3）。$(\mathfrak{m}/I)^{n}=0$ は $\mathfrak{m}^{n}\subset I$ を意味する。
:::
