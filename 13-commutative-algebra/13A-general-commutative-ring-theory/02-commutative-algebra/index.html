# 可換環論（Commutative Algebra）

分数加群と局所的性質・中山の補題、ネーター環とアルティン環、整拡大と正規環、準素分解、ヒルベルトの零点定理、次数環とフィルトレーション、完備化、次元論とクルルの主イデアル定理（松村『可換環論』、Zariski–Samuel を参考にする）。
