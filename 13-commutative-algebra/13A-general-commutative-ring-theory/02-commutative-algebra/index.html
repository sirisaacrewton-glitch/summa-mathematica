# 可換環論（Commutative Algebra）

分数加群と局所的性質・中山の補題、ネーター環とアルティン環、整拡大と正規環、準素分解、ヒルベルトの零点定理、次数環とフィルトレーション、完備化、次元論とクルルの主イデアル定理、整閉包の有限性・クルル＝秋月の定理・正規性の判定、操作の可換性と反例、局所的な性質と局所的でない性質（松村『可換環論』、Zariski–Samuel を参考にする）。

<p class="mn-msc">MSC2020: 13</p>

## 前提知識

- [可換代数 › 環の基礎](../../../13-commutative-algebra/13A-general-commutative-ring-theory/01-basics/index.html)（全体、6 ページ）
