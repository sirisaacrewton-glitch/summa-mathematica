# ヒルベルトの零点定理 {#ring:page-nullstellensatz keywords="Hilbert's Nullstellensatz, Noether normalization, Zariski's lemma, weak Nullstellensatz, strong Nullstellensatz, Rabinowitsch trick, Jacobson ring, algebraically independent"}

代数閉体 $k$ 上の多項式の連立方程式 $f_{1}=\dots=f_{m}=0$ が解をもたないのは、$1$ が $f_{i}$ の一次結合で書けるときに限る。これが**弱形の零点定理**（\tref{ring:weak-nullstellensatz}）で、「多項式 $f$ が方程式系のすべての解で $0$ になるなら、$f$ のある冪が $f_{i}$ の一次結合になる」という**強形**（\ref{ring:nullstellensatz}）に精密化される。零点定理は、代数幾何で「図形（代数的集合）」と「根基イデアル」を一対一に対応させる基本定理である。このページでは、体上の有限生成代数が多項式環上の有限な代数であるという**ネーターの正規化定理**（\tref{ring:noether-normalization}）から、体の有限生成代数が体なら有限次拡大であるという**ザリスキの補題**（\tref{ring:zariski-lemma}）を導き、零点定理と、有限生成代数でジャコブソン根基と冪零根基が一致すること（\ref{ring:fg-algebra-jacobson}）を証明する。

> Atiyah–Macdonald 第 5・7 章と松村『可換環論』§5 の流れを参考にした。正規化定理は、有限体の場合も含めて通る「指数をずらす」変数変換で証明した。

## 記法と定義の確認 {#ring:sec-ns-notation}

::: notation
- 環は可換、$k$ は体。有限生成代数と多変数の多項式環の普遍性は \ref{ring:multivariate-polynomial}, \ref{ring:multivariate-universal}、整拡大・推移律・整拡大と体は \ref{ring:integral-def}, \ref{ring:integral-closure}, \ref{ring:integral-field}、ラビノヴィッチの技法で使う局所化は \ref{ring:localization}。
- $k$ 代数 $A$ の元 $y_{1},\dots,y_{d}$ が $k$ 上**代数的に独立**であるとは、代入 $k[t_{1},\dots,t_{d}]\to A$, $t_{i}\mapsto y_{i}$ が単射であること（$A$ の中で $k[y_{1},\dots,y_{d}]$ が多項式環と同型）。
- 体 $k$ が**代数閉体**であるとは、$k[t]$ の定数でない多項式がすべて $k$ に根をもつこと。このとき、因数定理（\ref{ring:factor-theorem}）を繰り返し使えば、モニックな多項式は一次式の積に分解する。
- $k$ 代数 $A$ が $k$ ベクトル空間として有限次元なとき、$k$ 上**有限**という（\ref{ring:integral-def} の有限と同じ）。
- **選択公理**：ジャコブソン環の部分で極大イデアルの存在を使う。
:::

## ネーターの正規化定理 {#ring:sec-ns-normalization}

::: theorem ネーターの正規化定理 {#ring:noether-normalization keywords="Noether normalization lemma" index="ネーターの正規化定理|ねーたーのせいきかていり, 正規化定理|せいきかていり, 代数的に独立|だいすうてきにどくりつ" refname="ネーターの正規化定理"}
体 $k$ 上の有限生成代数 $A\neq 0$ に対し、$k$ 上代数的に独立な元 $y_{1},\dots,y_{d}\in A$（$d\ge 0$）で、$A$ が $k[y_{1},\dots,y_{d}]$ 上有限（したがって整）になるものがある。
:::

::: intuition
幾何的には、代数多様体は「$d$ 次元のアフィン空間の上に、有限個ずつ点が乗った」形に射影できる、ということである。$d$ は多様体の\term[次元]{ag:dimension}になる（\ref{ring:page-dimension-theory}）。
:::

::: proof
$A=k[x_{1},\dots,x_{n}]$（生成元 $x_{i}$）とし、$n$ についての帰納法で示す。$n=0$ なら $A=k$ で $d=0$。

**Step 1（独立な場合）.** $x_{1},\dots,x_{n}$ が代数的に独立なら $y_{i}=x_{i}$, $d=n$ でよい。

**Step 2（関係式）.** そうでなければ、$0$ でない多項式 $f\in k[t_{1},\dots,t_{n}]$ で $f(x_{1},\dots,x_{n})=0$ となるものがある。$f$ に現れる単項式の各変数の指数より大きい整数 $r$ をとり、
$$
z_{i}\defeq x_{i}-x_{n}^{r^{i}}\quad(1\le i\le n-1)
$$
とおく。$x_{i}=z_{i}+x_{n}^{r^{i}}$ を代入すると $f(z_{1}+x_{n}^{r},\dots,z_{n-1}+x_{n}^{r^{n-1}},x_{n})=0$。

**Step 3（$x_{n}$ の最高次）.** $f$ の単項式 $c_{\alpha}t^{\alpha}$（$c_{\alpha}\neq 0$）は、$x_{n}$ の多項式として（係数は $k[z_{1},\dots,z_{n-1}]$）、最高次の項 $c_{\alpha}x_{n}^{e(\alpha)}$ をもつ。ここで
$$
e(\alpha)\defeq\alpha_{n}+\alpha_{1}r+\alpha_{2}r^{2}+\dots+\alpha_{n-1}r^{n-1}.
$$
各 $\alpha_{i}<r$ なので、$e(\alpha)$ は $\alpha$ の「$r$ 進展開」で、異なる $\alpha$ には異なる $e(\alpha)$ が対応する。$e(\alpha)$ が最大の $\alpha$ はただ一つで、その項だけが $x_{n}$ の最高次 $e(\alpha)$ に寄与するので、$x_{n}$ は最高次係数 $c_{\alpha}\in k^{\times}$ の式をみたす。$c_{\alpha}^{-1}$ を掛ければ、$x_{n}$ は $B\defeq k[z_{1},\dots,z_{n-1}]$ 上のモニックな式の根、すなわち $B$ 上整。

**Step 4（帰納法）.** $x_{i}=z_{i}+x_{n}^{r^{i}}$ も $B[x_{n}]$ の元なので、$A=B[x_{n}]$ は $B$ 上有限（\ref{ring:integral-criterion}）。$B$ は $n-1$ 個の元で生成されるので、帰納法の仮定から代数的に独立な $y_{1},\dots,y_{d}$ で $B$ が $k[y_{1},\dots,y_{d}]$ 上有限なものがある。有限の有限は有限（生成元の積）なので、$A$ も $k[y_{1},\dots,y_{d}]$ 上有限。

::: hypcheck
- **体 $k$**：Step 3 で $c_{\alpha}$ が単元であることに使った。$k$ が無限体なら一次の変数変換 $z_{i}=x_{i}-a_{i}x_{n}$ で済むが、ここでの冪による変換は有限体でも通る。
- 選択公理は使わない。
:::
:::

## ザリスキの補題と弱形の零点定理 {#ring:sec-ns-zariski}

::: theorem ザリスキの補題 {#ring:zariski-lemma keywords="Zariski's lemma: a field finitely generated as a k-algebra is a finite extension of k" index="ザリスキの補題|ざりすきのほだい" refname="ザリスキの補題"}
体 $k$ 上の有限生成代数 $K$ が体なら、$K$ は $k$ 上有限（有限次の拡大体）である。
:::

::: proof
**Step 1.** 正規化定理（\tref{ring:noether-normalization}）から、代数的に独立な $y_{1},\dots,y_{d}$ で $K$ が $B\defeq k[y_{1},\dots,y_{d}]$ 上整なものがある。

**Step 2.** $B\subset K$ は整域の整拡大で $K$ は体なので、$B$ も体（\ref{ring:integral-field.1}）。$B$ は多項式環と同型なので、$d\ge 1$ なら $y_{1}$ は単元でない（多項式環の単元は定数。\ref{ring:polynomial-domain.3}）。よって $d=0$, $B=k$ で、$K$ は $k$ 上有限。
:::

::: corollary 弱形の零点定理 {#ring:weak-nullstellensatz keywords="weak Nullstellensatz, maximal ideals of polynomial rings over algebraically closed fields" index="弱形の零点定理|じゃくけいのれいてんていり" refname="弱形の零点定理"}
$k$ を代数閉体とする。
1. $k[x_{1},\dots,x_{n}]$ の極大イデアルは $(x_{1}-a_{1},\dots,x_{n}-a_{n})$（$a\in k^{n}$）の形のものですべてである。
2. イデアル $I\subsetneq k[x_{1},\dots,x_{n}]$ について、$I$ のすべての元が $a$ で $0$ になる点 $a\in k^{n}$ がある。すなわち、連立方程式 $f_{1}=\dots=f_{m}=0$ が $k^{n}$ に解をもたないなら $1\in(f_{1},\dots,f_{m})$。
:::

::: proof
**Step 1（剰余体は $k$）.** 極大イデアル $\mathfrak{m}$ について $K\defeq k[x_{1},\dots,x_{n}]/\mathfrak{m}$ は有限生成 $k$ 代数で体なので、ザリスキの補題から $k$ 上有限。$\alpha\in K$ は $k$ 上整（\ref{ring:integral-closure.4}）で、モニックな $g\in k[t]$ の根。代数閉体上 $g=\prod(t-c_{j})$ なので $\prod(\alpha-c_{j})=0$ で、$K$ は体なので $\alpha=c_{j}\in k$。よって $k\to K$ は同型。

**Step 2（1）.** $x_{i}$ の $K\cong k$ での像を $a_{i}$ とすると $x_{i}-a_{i}\in\mathfrak{m}$。$(x_{1}-a_{1},\dots,x_{n}-a_{n})$ は代入 $f\mapsto f(a)$ の核で、$k$ は体なので極大（\ref{ring:polynomial-quotients.1} を繰り返し使う：核が $(x_{i}-a_{i})$ で生成されることは $x_{i}=(x_{i}-a_{i})+a_{i}$ でテイラー展開すればわかる）。$\mathfrak{m}$ はそれを含むので等しい。

**Step 3（2）.** $I$ は極大イデアル $\mathfrak{m}$ に含まれ（$k[x]$ はネーターなので、従属選択公理だけで極大元がとれる）、1 から $\mathfrak{m}=(x_{i}-a_{i})$。$f\in I\subset\mathfrak{m}$ は代入 $x\mapsto a$ の核に属するので $f(a)=0$。

::: hypcheck
- **前提「代数閉体」**：Step 1 で $g$ が一次式に分解することに使った。外すと偽：$\R[x]$ の極大イデアル $(x^{2}+1)$ は $(x-a)$ の形でなく、$x^{2}+1=0$ は $\R$ に解をもたないが $1\notin(x^{2}+1)$。
:::
:::

## 強形の零点定理 {#ring:sec-ns-strong}

::: definition 代数的集合と零点イデアル {#ring:algebraic-set keywords="algebraic set, vanishing ideal, V(I), I(X)" index="代数的集合|だいすうてきしゅうごう, 零点集合|れいてんしゅうごう"}
体 $k$ と $k[x_{1},\dots,x_{n}]$ の部分集合 $S$ について $V(S)\defeq\{a\in k^{n} : \text{すべての }f\in S\text{ で }f(a)=0\}$ を**代数的集合**、$X\subset k^{n}$ について $I(X)\defeq\{f : \text{すべての }a\in X\text{ で }f(a)=0\}$ を $X$ の**零点イデアル**という。$I(X)$ は根基イデアルである（$f^{m}(a)=0\Rightarrow f(a)=0$）。
:::

::: theorem 強形の零点定理（ヒルベルト） {#ring:nullstellensatz keywords="Hilbert's Nullstellensatz, strong form, I(V(J)) = rad J, Rabinowitsch trick" index="零点定理|れいてんていり, ヒルベルトの零点定理|ひるべるとのれいてんていり, ラビノヴィッチの技法|らびのゔぃっちのぎほう" refname="強形の零点定理"}
$k$ を代数閉体、$J$ を $k[x_{1},\dots,x_{n}]$ のイデアルとすると、$I(V(J))=\sqrt{J}$。したがって $I$ と $V$ は、根基イデアル全体と代数的集合全体の間の、包含を逆にする一対一対応を与える。
:::

::: proof
**Step 1（$\supset$）.** $f^{m}\in J$ なら、$a\in V(J)$ で $f(a)^{m}=0$、よって $f(a)=0$。

**Step 2（$\subset$：ラビノヴィッチの技法）.** $f\in I(V(J))$, $f\neq 0$ とする。新しい変数 $y$ をとり、$k[x_{1},\dots,x_{n},y]$ のイデアル $J'\defeq Jk[x,y]+(1-yf)$ を考える。点 $(a,b)\in V(J')$ があれば、$a\in V(J)$ なので $f(a)=0$ で、$1-bf(a)=1\neq 0$ となり矛盾。\ref{ring:weak-nullstellensatz.2}から $1\in J'$：
$$
1=\sum_{i}g_{i}(x,y)h_{i}(x)+q(x,y)(1-yf(x))\qquad(h_{i}\in J).
$$

**Step 3（$y=1/f$ を代入）.** 有理関数体 $k(x_{1},\dots,x_{n})$ の中で、普遍性による代入 $y\mapsto 1/f$ を施すと $1=\sum_{i}g_{i}(x,1/f)h_{i}(x)$。$g_{i}$ の $y$ についての次数の最大値を $m$ として $f^{m}$ を掛けると、$f^{m}g_{i}(x,1/f)\in k[x]$ なので $f^{m}=\sum_{i}(f^{m}g_{i}(x,1/f))h_{i}\in J$。

**Step 4（対応）.** $V(I(X))=X$ が代数的集合 $X=V(S)$ について成り立つ（$X\subset V(I(X))$ は定義から、$S\subset I(X)$ から $V(I(X))\subset V(S)=X$）。根基イデアル $J$ については Step 1〜3 から $I(V(J))=J$。

::: hypcheck
- **前提「代数閉体」**：Step 2 で弱形を使った。外すと偽：$\R[x]$ で $J=(x^{2}+1)$ は根基イデアルで $V(J)=\emptyset$ なので $I(V(J))=\R[x]\neq J$。
:::
:::

## ジャコブソン環 {#ring:sec-ns-jacobson}

::: theorem 有限生成代数のジャコブソン性 {#ring:fg-algebra-jacobson keywords="finitely generated algebras over a field are Jacobson rings, nilradical equals Jacobson radical, contraction of maximal ideals" index="ジャコブソン環|じゃこぶそんかん, ヒルベルト環|ひるべるとかん"}
（AC）体 $k$ 上の有限生成代数 $A$ について、
1. すべての素イデアルは、それを含む極大イデアルの共通部分である。特に $\mathrm{nil}(A)=\mathrm{rad}(A)$。
2. $k$ 代数の準同型 $\varphi:A\to B$（$B$ も有限生成 $k$ 代数）について、$B$ の極大イデアルの逆像は $A$ の極大イデアルである。

（1 をみたす環を**ジャコブソン環**という。）
:::

::: proof
**Step 1（極大イデアルの剰余体）.** 有限生成 $k$ 代数 $B$ の極大イデアル $\mathfrak{n}$ について、$B/\mathfrak{n}$ はザリスキの補題から $k$ 上有限。

**Step 2（2）.** $\mathfrak{m}\defeq\varphi^{-1}(\mathfrak{n})$ について、$A/\mathfrak{m}\hookrightarrow B/\mathfrak{n}$ は単射な $k$ 代数の準同型なので、$A/\mathfrak{m}$ は $k$ 上有限次元の整域。有限次元の整域は体：$0\neq a$ を掛ける写像は単射な $k$ 線形写像なので全射で、$ab=1$ となる $b$ がある。よって $\mathfrak{m}$ は極大。

**Step 3（1）.** 素イデアル $\mathfrak{p}$ と $f\notin\mathfrak{p}$ について、$f$ を含まず $\mathfrak{p}$ を含む極大イデアルがあることを示す。$C\defeq(A/\mathfrak{p})_{\bar f}=(A/\mathfrak{p})[1/\bar f]$ は有限生成 $k$ 代数（$1/\bar f$ を生成元に加える）で、$\bar f\neq 0$ かつ $A/\mathfrak{p}$ は整域なので零環でない。$C$ の極大イデアル $\mathfrak{n}$ をとり（選択公理。$C$ はネーターなので従属選択公理で足りる）、2 を合成 $A\to A/\mathfrak{p}\to C$ に使うと、$\mathfrak{m}\defeq$ その逆像は極大イデアルで、$\mathfrak{p}\subset\mathfrak{m}$、$f\notin\mathfrak{m}$（$f$ の像は $C$ の単元）。よって $\bigcap_{\mathfrak{m}\supset\mathfrak{p}}\mathfrak{m}=\mathfrak{p}$。$\mathfrak{p}$ について共通部分をとれば $\mathrm{rad}(A)=\bigcap\mathfrak{m}=\bigcap\mathfrak{p}=\mathrm{nil}(A)$（\ref{ring:nilradical}）。

::: hypcheck
- **前提「有限生成」**：Step 1 でザリスキの補題を使うのに必要。外すと偽：DVR $\Z_{(p)}$（$\Q$ 上の代数ではないが $\Z$ 上の代数）や $k[[x]]$ では、素イデアル $0$ は極大イデアル（ただ一つ）の共通部分に等しくない。また $k(x)$ の部分環 $k[x]_{(x)}$ の極大イデアル $(x)$ の、包含 $k[x]\to k[x]_{(x)}$ による逆像は $(x)$ で極大だが、包含 $k[x]_{(x)}\to k(x)$ では $k(x)$ の極大イデアル $0$ の逆像 $0$ は極大でない。
:::
:::

::: supplement
**幾何的な意味.** \ref{ring:nullstellensatz} により、代数閉体上のアフィン代数的集合 $X\subset k^{n}$ と有限生成な被約 $k$ 代数 $k[x]/I(X)$（座標環）とが対応し、$X$ の点は座標環の極大イデアルに対応する（\ref{ring:weak-nullstellensatz}）。ジャコブソン性は、「素イデアル（既約な部分多様体）は、それに含まれる点（極大イデアル）で決まる」ことを意味する。これが、代数閉体上では極大イデアルだけを見ても情報が失われない理由で、一般の環で $\Spec$ を考える必要性との違いである（\ref{ag:zariski-topology}）。

**\term[次元]{ring:krull-dimension}への応用.** 正規化定理の $d$ は $A$（整域なら）の商体の超越次数で、これが $A$ のクルル次元に等しい（\ref{ring:page-dimension-theory}）。

**計算の観点.** $\Q[x_{1},\dots,x_{n}]$ で $f\in(g_{1},\dots,g_{r})$ かを判定する問題（イデアル所属問題）は、ブッフベルガーのアルゴリズム（グレブナー基底）で計算可能である。ただし指数領域（EXPSPACE）完全で、最悪の場合の計算量は非常に大きい（マイヤーとマイヤー、1982 年）。弱形の零点定理の「$V(g_{1},\dots,g_{r})=\emptyset$ か」は「$1\in(g_{1},\dots,g_{r})$ か」と同じである。有効零点定理（$1=\sum h_{i}g_{i}$ の $h_{i}$ の次数の、変数の数について単指数の上限。コラール、1988 年など）により、これは大きな一次方程式系の可解性に帰着する。いずれも本サイト未収録。
:::

## 問題 {#ring:sec-ns-problems}

::: problem {#ring:prob-nullstellensatz-example}
$\C[x,y]$ のイデアル $J=(x^{2}+y^{2}-1,\ x-1)$ について $V(J)$ と $\sqrt{J}$ を求め、$J\neq\sqrt{J}$ を確かめよ。
:::

::: solution
$x=1$ を代入すると $y^{2}=0$ なので $V(J)=\{(1,0)\}$。$I(V(J))=(x-1,y)$ で、零点定理から $\sqrt{J}=(x-1,y)$。$J=(x-1,\ y^{2}+(x-1)(x+1))=(x-1,y^{2})$ で、$y\notin J$（$x=1$ とおくと $\C[y]$ で $(y^{2})\not\ni y$）。幾何的には、円と接線 $x=1$ が点 $(1,0)$ で接する（重複度 $2$）ことを $y^{2}$ が表している。
:::

::: problem {#ring:prob-finite-dim-algebra}
体 $k$ 上の有限生成代数 $A$ が $k$ 上有限次元であることと、$A$ の素イデアルがすべて極大であること（$\dim A=0$）は同値であることを示せ。
:::

::: solution
**⇒**：有限次元の環はアルティン（イデアルは\term[部分空間]{lin:vector-space}で、降鎖は\term[次元]{lin:dimension}が下がって止まる）なので、素イデアルは極大（\ref{ring:akizuki-hopkins.1}）。**⇐**：正規化定理で $A$ が $k[y_{1},\dots,y_{d}]$ 上有限とする。$d\ge 1$ なら、$k[y]$ の素イデアルの鎖 $0\subsetneq(y_{1})$ は横たわり・\ref{ring:going-up}で $A$ の鎖 $\mathfrak{q}_{0}\subsetneq\mathfrak{q}_{1}$ に持ち上がり、$\mathfrak{q}_{0}$ が極大でない素イデアルになる。よって $d=0$ で $A$ は $k$ 上有限次元。
:::
