# クルル＝秋月の定理と正規性の判定 {#ring:page-krull-akizuki-normality keywords="Krull-Akizuki theorem, integral closure of a Dedekind domain in a finite extension is Dedekind, Noetherian normal domain is intersection of DVRs at height one primes, associated primes of principal ideals, Serre's criterion for normality R1 S2"}

$1$ \term[次元]{ring:krull-dimension}のネーター整域 $A$ と、その商体の有限次拡大 $L$ について、$A$ と $L$ の間の環はすべて $1$ 次元以下のネーター環である（**クルル＝秋月の定理**、\tref{ring:krull-akizuki}）。分離性を仮定しないので、デデキント環の任意の有限次拡大での整閉包がデデキント環になる（\ref{ring:dedekind-extension}）。後半では、高次元のネーター正規整域について、「単項イデアルの随伴素イデアルは高さ $1$ で、そこでの局所化は離散付値環」（\ref{ring:normal-principal-ass}）を示し、そこから $A=\bigcap_{\operatorname{ht}\mathfrak{p}=1}A_{\mathfrak{p}}$（\ref{ring:normal-intersection-dvr}）と、正規性の**セールの判定法**（$R_{1}$ と $S_{2}$、\ref{ring:serre-normality}）を導く。

> 松村『可換環論』§11 の内容を参考にした。クルル＝秋月の定理は、ねじれのない加群の長さの等式（\ref{ring:length-torsion-free}）で、商体の拡大への帰着なしに直接示した。

## 記法と定義の確認 {#ring:sec-ka-notation}

::: notation
- 加群の長さとその加法性は \ref{ring:length}, \ref{ring:length-properties}、アルティン環と秋月＝ホプキンスの定理は \ref{ring:akizuki-hopkins}、随伴素イデアル・零因子・局所化は \ref{ring:associated-prime}, \ref{ring:zero-divisors-ass}, \ref{ring:ass-localization}、行列式のトリックは \ref{ring:determinant-trick}。
- 離散付値環の特徴付け、デデキント環とその局所的特徴付けは \ref{ring:dvr-characterization}, \ref{ring:dedekind}, \ref{ring:dedekind-local}。分母を払うことは \ref{ring:clearing-denominators}。
- 深さは \ref{ring:depth-ext}（セールの判定法の言い換えでだけ使う）。
- **選択公理**：秋月＝ホプキンスの定理・局所化・随伴素イデアルの理論を通して使う。
:::

## クルル＝秋月の定理 {#ring:sec-ka-theorem}

::: lemma ねじれのない加群の長さ {#ring:length-torsion-free keywords="for a one-dimensional Noetherian domain and a finitely generated torsion-free module M of rank r, length(M/aM) = r length(A/aA)" index="ねじれのない加群の長さ|ねじれのないかぐんのながさ"}
（AC）$A$ を $1$ \term[次元]{ring:krull-dimension}のネーター整域、$K=\Frac A$、$0\neq a\in A$ とする。
1. 有限生成のねじれ加群 $T$（各元が $0$ でない元に消される）は長さ有限。
2. 有限生成でねじれのない加群 $M$ の階数を $r=\dim_{K}(M\otimes_{A}K)$ とすると、$\ell(M/aM)=r\,\ell(A/aA)<\infty$。
:::

::: proof
**Step 1（1）.** 生成元の零化元の積 $c\neq 0$ が $T$ を消す。$A/cA$ の素イデアルは $c$ を含む $0$ でない素イデアルで、$\dim A=1$ から極大。$A/cA$ はネーターなのでアルティン（\ref{ring:akizuki-hopkins.4}）で、その上の有限生成加群 $T$ は長さ有限（ネーターかつアルティン。\ref{ring:length-properties.2}）。

**Step 2（2：自由部分加群）.** $M\otimes K$ の基底を $M$ の元の像 $m_{1},\dots,m_{r}$ でとると（分母を払う）、$F\defeq\sum Am_{i}\cong A^{r}$（$M$ はねじれがないので $M\to M\otimes K$ は単射）で、$T\defeq M/F$ はねじれ加群（$m\in M$ と $m_{i}$ は $K$ 上従属なので $cm\in F$）。

**Step 3（2：蛇の補題）.** 短完全列 $0\to F\to M\to T\to 0$ に $a$ 倍を施すと、$F,M$ は $a$ 倍が単射なので完全列 $0\to T[a]\to F/aF\to M/aM\to T/aT\to 0$（$T[a]$ は $a$ 倍の核）。$T$ は長さ有限なので、$a$ 倍 $T\to T$ について $\ell(T)=\ell(T[a])+\ell(aT)=\ell(aT)+\ell(T/aT)$、$\ell(T[a])=\ell(T/aT)$。完全列の長さの交代和から $\ell(M/aM)=\ell(F/aF)=r\,\ell(A/aA)$。$\ell(A/aA)<\infty$ は 1（$T=A/aA$）から。
:::

::: theorem クルル＝秋月の定理 {#ring:krull-akizuki keywords="Krull-Akizuki: rings between a one-dimensional Noetherian domain and a finite extension of its fraction field are Noetherian of dimension at most one" index="クルル＝秋月の定理|くるるあきづきのていり" refname="クルル＝秋月の定理"}
（AC）$A$ を $1$ \term[次元]{ring:krull-dimension}のネーター整域、$K=\Frac A$、$L$ を $K$ の有限次拡大、$B$ を $A\subset B\subset L$ となる環とする。$B$ はネーター環で $\dim B\le 1$。さらに $B$ の $0$ でないイデアル $J$ について、$B/J$ は長さ有限の $A$ 加群。
:::

::: proof
**Step 1（$B/aB$ の長さ）.** $n=[L:K]$、$0\neq a\in A$ とする。$1$ を含む $B$ の有限生成 $A$ 部分加群 $N$ はねじれがなく階数 $\le n$ なので、\ref{ring:length-torsion-free} から $\ell(N/aN)\le n\,\ell(A/aA)$。$B/aB$ の有限生成部分加群は、ある $N$ の像 $(N+aB)/aB$（$N/aN$ の商）なので長さ $\le n\,\ell(A/aA)$。部分加群の真の鎖の長さが有界なので、$B/aB$ は長さ有限の $A$ 加群（ネーターかつアルティン）。

**Step 2（ネーター）.** $J\neq 0$ を $B$ のイデアル、$0\neq b\in J$ とする。$b$ の $K$ 上の最小多項式 $X^{m}+k_{1}X^{m-1}+\dots+k_{m}$ は既約で $b\neq 0$ なので $k_{m}\neq 0$。係数の共通分母 $d\in A$ を掛けると $dk_{m}=-b(db^{m-1}+dk_{1}b^{m-2}+\dots+dk_{m-1})$ で、括弧内は $B$ の元（$dk_{i}\in A$）なので $a\defeq dk_{m}\in J\cap A$, $a\neq 0$。$J/aB\subset B/aB$ は有限生成 $A$ 加群（Step 1）なので、$J=aB+\sum_{j}Bc_{j}$ は有限生成。$B/J$ は $B/aB$ の商なので長さ有限。

**Step 3（\term[次元]{ring:krull-dimension}）.** $B$ の $0$ でない素イデアル $Q$ について、$B/Q$ は長さ有限の $A$ 加群なので、そのイデアル（$A$ 部分加群）の降鎖は止まり、$B/Q$ はアルティンな整域、すなわち体（$x\neq 0$ について $xB\supset x^{2}B\supset\cdots$ が止まり $x^{n}=x^{n+1}y$, $xy=1$）。よって $Q$ は極大で $\dim B\le 1$。
:::

::: corollary デデキント環の拡大 {#ring:dedekind-extension keywords="the integral closure of a Dedekind domain in a finite extension of its fraction field is a Dedekind domain" index="デデキント環の拡大|でできんとかんのかくだい"}
（AC）デデキント環 $A$（体でない）の、商体の有限次拡大 $L$ における整閉包 $B$ はデデキント環である。
:::

::: proof
$\dim A=1$。$B$ はクルル＝秋月の定理からネーターで $\dim B\le 1$、$\Frac B=L$（\ref{ring:clearing-denominators}）の中で整閉（整閉包の推移律）なので正規。$0$ でない素イデアルは極大。\ref{ring:dedekind} の定義をみたす。
:::

## ネーター正規整域 {#ring:sec-ka-normal}

::: lemma 単項イデアルの随伴素イデアル {#ring:normal-principal-ass keywords="in a Noetherian normal domain, associated primes of a nonzero principal ideal have height one and the localization there is a DVR" index="単項イデアルの随伴素イデアル|たんこういであるのずいはんそいである"}
（AC）$A$ をネーター正規整域、$0\neq a\in A$、$\mathfrak{p}\in\operatorname{Ass}(A/aA)$ とする。$A_{\mathfrak{p}}$ は離散付値環で、$\operatorname{ht}\mathfrak{p}=1$。
:::

::: proof
**Step 1（局所化）.** $A_{\mathfrak{p}}$ も正規（\ref{ring:integral-localization.3}）で、$\mathfrak{m}\defeq\mathfrak{p}A_{\mathfrak{p}}\in\operatorname{Ass}(A_{\mathfrak{p}}/aA_{\mathfrak{p}})$（\ref{ring:ass-localization.1}）。よって $\mathfrak{m}b\subset aA_{\mathfrak{p}}$, $b\notin aA_{\mathfrak{p}}$ となる $b\in A_{\mathfrak{p}}$ がある。$y\defeq a/b\in K$ とすると $y^{-1}\mathfrak{m}=(b/a)\mathfrak{m}\subset A_{\mathfrak{p}}$ はイデアル。

**Step 2（$y^{-1}\mathfrak{m}=A_{\mathfrak{p}}$）.** $y^{-1}\mathfrak{m}\subset\mathfrak{m}$ なら、$\mathfrak{m}$ は有限生成で $K$ の中で忠実な $A_{\mathfrak{p}}[y^{-1}]$ 加群なので、$y^{-1}$ は $A_{\mathfrak{p}}$ 上整（\ref{ring:integral-criterion.4}）、正規性から $y^{-1}=b/a\in A_{\mathfrak{p}}$、すなわち $b\in aA_{\mathfrak{p}}$ となり矛盾。よって $y^{-1}\mathfrak{m}$ は $\mathfrak{m}$ に含まれないイデアルで、$A_{\mathfrak{p}}$ に等しい。

**Step 3（DVR）.** $\mathfrak{m}=yA_{\mathfrak{p}}$ は単項で、$A_{\mathfrak{p}}$ はネーター局所整域（体でない：$a\in\mathfrak{m}$ は $0$ でない）。\ref{ring:dvr-characterization}（4⇒1）から離散付値環で、$\operatorname{ht}\mathfrak{p}=\dim A_{\mathfrak{p}}=1$。
:::

::: theorem 高さ 1 の局所化の共通部分 {#ring:normal-intersection-dvr keywords="a Noetherian normal domain is the intersection of its localizations at height one primes, which are DVRs (Krull)" index="正規環と離散付値環|せいきかんとりさんふちかん"}
（AC）ネーター正規整域 $A$（体でない）について、高さ $1$ の素イデアル $\mathfrak{p}$ での局所化 $A_{\mathfrak{p}}$ は離散付値環で、$A=\bigcap_{\operatorname{ht}\mathfrak{p}=1}A_{\mathfrak{p}}$（$K$ の中で）。
:::

::: proof
**Step 1（DVR）.** $A_{\mathfrak{p}}$ は $1$ \term[次元]{ring:krull-dimension}のネーター正規局所整域なので離散付値環（\ref{ring:dvr-characterization.5}⇒1）。

**Step 2（共通部分）.** $x=b/a$（$a\neq 0$）が右辺に属するとし、$b\in aA$ を示す。$b\notin aA$ なら、$A/aA$ の元 $\bar b\neq 0$ の零化イデアルを含む随伴素イデアル $\mathfrak{p}$ があり（\ref{ring:ass-nonempty}：$A\bar b$ の随伴素イデアルは $A/aA$ の随伴素イデアル）、$\operatorname{Ann}(\bar b)\subset\mathfrak{p}$ なので $(A/aA)_{\mathfrak{p}}$ で $\bar b/1\neq 0$、すなわち $b\notin aA_{\mathfrak{p}}$。一方 \ref{ring:normal-principal-ass} から $\operatorname{ht}\mathfrak{p}=1$ で、仮定から $x\in A_{\mathfrak{p}}$、$b\in aA_{\mathfrak{p}}$。矛盾。
:::

::: theorem 正規性のセールの判定法 {#ring:serre-normality keywords="Serre's criterion: a Noetherian domain is normal iff R1 and associated primes of nonzero principal ideals have height one (S2)" index="セールの判定法（正規性）|せーるのはんていほうせいきせい, R1|あーるいち, S2|えすに" refname="正規性のセールの判定法"}
（AC）ネーター整域 $A$ について、次は同値である。
1. $A$ は正規。
2. （$R_{1}$）高さ $1$ の素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ は離散付値環、かつ（$S_{2}$）$0$ でない $a\in A$ について $\operatorname{Ass}(A/aA)$ の元はすべて高さ $1$。

条件 $S_{2}$ は「高さ $2$ 以上の素イデアル $\mathfrak{p}$ で $\operatorname{depth}A_{\mathfrak{p}}\ge 2$」と同値である。
:::

::: proof
**Step 1（1⇒2）.** $R_{1}$ は \ref{ring:normal-intersection-dvr} の Step 1、$S_{2}$ は \ref{ring:normal-principal-ass}。

**Step 2（2⇒1）.** $x=b/a\in K$ が $A$ 上整とする。各 $\mathfrak{p}\in\operatorname{Ass}(A/aA)$ は高さ $1$ で $A_{\mathfrak{p}}$ は離散付値環（正規。\ref{ring:valuation-properties.3}）なので $x\in A_{\mathfrak{p}}$、$b\in aA_{\mathfrak{p}}$。\ref{ring:normal-intersection-dvr} の Step 2 と同じ議論で $b\in aA$、$x\in A$。

**Step 3（深さによる言い換え）.** $\operatorname{ht}\mathfrak{p}\ge 2$ で $\operatorname{depth}A_{\mathfrak{p}}\le 1$ とすると、整域なので深さは $1$ で、$0\neq a\in\mathfrak{p}$ について $A_{\mathfrak{p}}/aA_{\mathfrak{p}}$ の深さは $0$（\ref{ring:depth-ext}）、$\mathfrak{p}A_{\mathfrak{p}}\in\operatorname{Ass}$ なので $\mathfrak{p}\in\operatorname{Ass}(A/aA)$（\ref{ring:ass-localization}）、$S_{2}$ に反する。逆に $\mathfrak{p}\in\operatorname{Ass}(A/aA)$, $\operatorname{ht}\mathfrak{p}\ge 2$ なら、$A_{\mathfrak{p}}$ で $a$ は正則で $A_{\mathfrak{p}}/aA_{\mathfrak{p}}$ の深さは $0$、$\operatorname{depth}A_{\mathfrak{p}}=1$。
:::

::: corollary 正規環の例 {#ring:normal-examples-serre keywords="regular local rings and UFDs are normal; normal domains of dimension one are exactly the Dedekind domains" index="正規環の例|せいきかんのれい"}
（AC）
1. $1$ \term[次元]{ring:krull-dimension}のネーター整域が正規 $\iff$ デデキント環 $\iff$ 高さ $1$ の局所化がすべて離散付値環。
2. CM 整域（局所化がすべて CM）は $S_{2}$ をみたし、さらに $R_{1}$ をみたせば正規。例えば $k[x,y,z]_{(x,y,z)}/(z^{2}-xy)$ は正規（一意分解環でないこと \ref{ring:prob-ru-not-ufd} と対照的）。
:::

::: proof
**Step 1（1）.** $\dim 1$ では $S_{2}$ は自動的（$0$ でない素イデアルは高さ $1$）なので、セールの判定法と \ref{ring:dedekind-local}。

**Step 2（2）.** CM 局所環では $\operatorname{depth}=\dim$（\ref{ring:cohen-macaulay}）なので $\operatorname{ht}\mathfrak{p}\ge 2$ で深さ $\ge 2$。例：$R=k[x,y,z]_{(x,y,z)}$（3 \term[次元]{ring:krull-dimension}の正則局所環）と $A=R/(z^{2}-xy)$。$A$ は整域（$k[x,y,z]/(z^{2}-xy)\cong k[s^{2},st,t^{2}]$ を \ref{ring:prob-ru-not-ufd} の Step 1 と同様に示し、その局所化）で、正則局所環の超曲面なので CM（\ref{ring:prob-cm-hypersurface}）、高さ $2$ 以上の素イデアルは極大イデアルだけで、$S_{2}$ をみたす。$R_{1}$：高さ $1$ の素イデアル $\mathfrak{p}$ について、$x\notin\mathfrak{p}$ なら $A[1/x]$ では $y=z^{2}/x$ なので $A[1/x]$ は $k[x,x^{-1},z]$ の局所化、$A_{\mathfrak{p}}$ はその局所化で、一意分解環の局所化として正規（\ref{ring:ufd-normal}, \ref{ring:integral-localization}）な $1$ 次元ネーター局所整域、すなわち DVR。$y\notin\mathfrak{p}$ も同様。$x,y\in\mathfrak{p}$ なら $z^{2}\in\mathfrak{p}$ から $z\in\mathfrak{p}$ で $\mathfrak{p}$ は極大イデアル（高さ $2$）となり起こらない。よって $A$ は正規。
:::

## 問題 {#ring:sec-ka-problems}

::: problem {#ring:prob-ka-not-normal-s2}
$A=k[t^{2},t^{3}]$ は $1$ \term[次元]{ring:krull-dimension}のネーター整域で $S_{2}$ をみたすが $R_{1}$ をみたさず、正規でないことを確かめよ。
:::

::: solution
$\dim 1$ なので $S_{2}$ は自動的。$\mathfrak{p}=(t^{2},t^{3})$ は高さ $1$ で、$A_{\mathfrak{p}}$ の極大イデアルは $t^{2},t^{3}$ で生成され単項でない（単項なら $\mathfrak{p}/\mathfrak{p}^{2}$ が $1$ \term[次元]{lin:dimension}だが、$\mathfrak{p}^{2}=(t^{4},t^{5},t^{6})$ で $\mathfrak{p}/\mathfrak{p}^{2}$ は $t^{2},t^{3}$ の像で張られる $2$ 次元）ので DVR でない。$t=t^{3}/t^{2}$ は $X^{2}-t^{2}$ の根で整だが $A$ に属さない。
:::

::: supplement
**クルル整域.** \ref{ring:normal-intersection-dvr} の性質（離散付値環の局所有限な共通部分）をもつ整域を**クルル整域**といい、ネーター正規整域と一意分解環はその例である。クルル整域には因子類群が定義され、一意分解環であることは因子類群が自明であることと同値になることが知られている（このサイトではまだ扱っていない）。

**数論へ.** \ref{ring:dedekind-extension} と前のページの有限性（\ref{ring:integral-closure-finite}）から、代数体の整数環はデデキント環で、$\Z$ 上の自由加群である。素イデアル分解と分岐はガロア理論（\ref{fld:page-fundamental-theorem}）と組み合わせて数論の系列で扱う。
:::
