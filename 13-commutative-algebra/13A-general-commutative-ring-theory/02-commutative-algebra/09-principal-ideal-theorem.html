# クルルの単項イデアル定理と応用 {#ring:page-principal-ideal-theorem keywords="Krull's principal ideal theorem, Krull's height theorem, height of minimal primes, UFD iff height one primes are principal, dimension of polynomial rings, dim A[x] = dim A + 1"}

ネーター環で一つの元 $x$ を含む極小素イデアルの高さは $1$ 以下である。これが**クルルの単項イデアル定理**（\ref{ring:principal-ideal-theorem}）で、幾何的には「一つの方程式で切ると次元は高々 $1$ しか下がらない」ことを意味する。$r$ 個の元についての一般化（**高さ定理**）とその逆（\ref{ring:height-converse}）は、次元定理（\ref{ring:dimension-theorem}）を局所化して直ちに得られる。このページではこれらを示した後、応用として、ネーター整域が一意分解環であることと高さ $1$ の素イデアルがすべて単項であることの同値性（\ref{ring:ufd-height-one}）、ネーター環について $\dim A[x]=\dim A+1$（\ref{ring:polynomial-dimension}）を証明する。特に $\dim k[x_{1},\dots,x_{n}]=n$ である。

> Atiyah–Macdonald 第 11 章、松村『可換環論』§13・§15 の流れを参考にした。

## 記法と定義の確認 {#ring:sec-pi-notation}

::: notation
- 環は可換。クルル次元・高さ・次元定理・パラメーター系は \ref{ring:page-dimension-theory}、局所化と素イデアルは \ref{ring:localization-primes}, \ref{ring:localization-at-prime}、ネーター環の極小素イデアルは \ref{ring:noetherian-prime-product}、随伴素イデアルと零因子は \ref{ring:zero-divisors-ass}, \ref{ring:ass-localization}、一意分解環の判定は \ref{ring:ufd-criterion}, \ref{ring:gcd-accp-ufd}。
- イデアル $I$ を含む素イデアルのうち包含について極小なものを、**$I$ 上の極小素イデアル**という。
- **選択公理**：次元定理を通して使う。
:::

## 単項イデアル定理と高さ定理 {#ring:sec-pi-theorems}

::: theorem クルルの高さ定理 {#ring:height-theorem keywords="Krull's height theorem: a minimal prime over an ideal generated by r elements has height at most r" index="高さ定理|たかさていり, クルルの高さ定理|くるるのたかさていり"}
（AC）$A$ をネーター環、$x_{1},\dots,x_{r}\in A$ とする。$(x_{1},\dots,x_{r})$ 上の極小素イデアル $\mathfrak{p}$ について $\operatorname{ht}\mathfrak{p}\le r$。
:::

::: proof
$A_{\mathfrak{p}}$ の素イデアルは $\mathfrak{p}$ に含まれる素イデアルに対応する（\ref{ring:localization-at-prime.2}）。$\mathfrak{p}$ は $(x_{1},\dots,x_{r})$ 上で極小なので、$A_{\mathfrak{p}}$ で $(x_{1},\dots,x_{r})A_{\mathfrak{p}}$ を含む素イデアルは極大イデアル $\mathfrak{p}A_{\mathfrak{p}}$ だけ。よって $(x_{1},\dots,x_{r})A_{\mathfrak{p}}$ の根基は $\mathfrak{p}A_{\mathfrak{p}}$（\ref{ring:radical-properties.2}）で、これは $\mathfrak{p}A_{\mathfrak{p}}$ 準素イデアル（\ref{ring:primary-ideal-classical} の後の例 3）。$\delta(A_{\mathfrak{p}})\le r$ で、次元定理から $\operatorname{ht}\mathfrak{p}=\dim A_{\mathfrak{p}}=\delta(A_{\mathfrak{p}})\le r$。
:::

::: corollary クルルの単項イデアル定理 {#ring:principal-ideal-theorem keywords="Krull's principal ideal theorem, Hauptidealsatz" index="単項イデアル定理|たんこういであるていり, クルルの単項イデアル定理|くるるのたんこういであるていり, 主イデアル定理|しゅいであるていり"}
（AC）ネーター環 $A$ の元 $x$ について、$(x)$ 上の極小素イデアルの高さは $1$ 以下である。$x$ が非零因子かつ非単元なら、$(x)$ 上の極小素イデアルの高さはちょうど $1$ である。
:::

::: proof
前半は高さ定理の $r=1$。後半：$\mathfrak{p}$ を $(x)$ 上の極小素イデアルとする。$\operatorname{ht}\mathfrak{p}=0$ なら $\mathfrak{p}$ は $A$ の極小素イデアルで、$\operatorname{Supp}(A)=\Spec A$ の極小元なので随伴素イデアル（\ref{ring:ass-localization.2}）、その元は零因子（\ref{ring:zero-divisors-ass}）。$x\in\mathfrak{p}$ が非零因子であることに反する。
:::

::: theorem 高さ定理の逆 {#ring:height-converse keywords="a prime of height r is minimal over an ideal generated by r elements" index="高さ定理の逆|たかさていりのぎゃく"}
（AC）ネーター環 $A$ の素イデアル $\mathfrak{p}$ が $\operatorname{ht}\mathfrak{p}=r$ なら、$\mathfrak{p}$ が $(x_{1},\dots,x_{r})$ 上の極小素イデアルとなる $x_{1},\dots,x_{r}\in\mathfrak{p}$ がある。さらに、$(x_{1},\dots,x_{i})$ 上の極小素イデアルの高さがすべて $i$ となるようにとれる（$1\le i\le r$）。
:::

::: proof
次元定理の証明の Step 3（\ref{ring:dimension-theorem}）と同じ構成を、$\mathfrak{m}$ を $\mathfrak{p}$ に替えて $A$ の中で行う：$x_{1},\dots,x_{i-1}\in\mathfrak{p}$ まで選んだとき、$(x_{1},\dots,x_{i-1})$ 上の極小素イデアルで高さ $i-1$ のもの（有限個、どれも $\mathfrak{p}$ でない：$i-1<r$）のどれにも属さない $x_{i}\in\mathfrak{p}$ を素イデアルの回避（\ref{ring:prime-avoidance}）でとる。すると $(x_{1},\dots,x_{i})$ を含む素イデアルの高さは $i$ 以上で、高さ定理から極小なものはちょうど $i$。$i=r$ で、$\mathfrak{p}$ は $(x_{1},\dots,x_{r})$ を含む高さ $r$ の素イデアルなので、その上の極小素イデアル（$\mathfrak{p}$ に含まれ高さ $\ge r$）は $\mathfrak{p}$ 自身。
:::

::: example
1. $k[x,y,z]$ で $(xy,xz)=(x)\cap(y,z)$ 上の極小素イデアルは $(x)$（高さ $1$）と $(y,z)$（高さ $2$）。二つの元で生成されるので高さ定理と整合する。極小素イデアルの高さは一定とは限らない。
2. 単項イデアル定理の「極小」は必要：$k[x,y]$ で $(x)\subsetneq(x,y)$ で、$(x,y)$ は $(x)$ を含むが高さ $2$。
:::

## 一意分解環の特徴付け {#ring:sec-pi-ufd}

::: theorem 高さ 1 の素イデアルによる一意分解環の特徴付け {#ring:ufd-height-one keywords="a Noetherian domain is a UFD iff every height one prime is principal" index="一意分解環と高さ 1 の素イデアル|いちいぶんかいかんとたかさいちのそいである"}
（AC）ネーター整域 $A$ について、$A$ が一意分解環であることと、高さ $1$ の素イデアルがすべて単項であることは同値である。
:::

::: proof
**Step 1（⇒）.** $\mathfrak{p}$ を高さ $1$ の素イデアルとし、$0\neq a\in\mathfrak{p}$ をとる。$a$ の既約元分解の因子のどれか $\pi$ が $\mathfrak{p}$ に属し、$\pi$ は素元（UFD）なので $(\pi)$ は $0$ でない素イデアル。$0\subsetneq(\pi)\subset\mathfrak{p}$ と $\operatorname{ht}\mathfrak{p}=1$ から $(\pi)=\mathfrak{p}$。

**Step 2（⇐）.** ネーター整域は ACCP をみたすので既約元分解が存在する（\ref{ring:gcd-accp-ufd} の Step 2 の前半）。既約元 $\pi$ が素元であることを示せば \ref{ring:ufd-criterion} から UFD。$(\pi)$ 上の極小素イデアル $\mathfrak{p}$ をとると、単項イデアル定理（\ref{ring:principal-ideal-theorem}、整域なので $\pi$ は非零因子）から $\operatorname{ht}\mathfrak{p}=1$、仮定から $\mathfrak{p}=(a)$。$\pi\in(a)$ から $\pi=ab$ で、$a$ は単元でない（$\mathfrak{p}\neq A$）ので、既約性から $b$ は単元。よって $(\pi)=(a)=\mathfrak{p}$ は素イデアル。
:::

## 多項式環の次元 {#ring:sec-pi-polynomial}

::: lemma 拡大素イデアルの高さ {#ring:height-extension keywords="ht p[x] = ht p for Noetherian A" index="拡大素イデアルの高さ|かくだいそいであるのたかさ"}
（AC）$A$ をネーター環、$\mathfrak{p}$ を素イデアルとすると、$\mathfrak{p}[x]\defeq\mathfrak{p}A[x]$ は $A[x]$ の素イデアルで、$\operatorname{ht}\mathfrak{p}[x]=\operatorname{ht}\mathfrak{p}$。
:::

::: proof
**Step 1（素イデアル）.** $A[x]/\mathfrak{p}[x]\cong(A/\mathfrak{p})[x]$ は整域（係数の還元。\ref{ring:polynomial-primes} の Step 1 と同様）。

**Step 2（$\ge$）.** $A$ の鎖 $\mathfrak{p}_{0}\subsetneq\dots\subsetneq\mathfrak{p}_{s}=\mathfrak{p}$ は $\mathfrak{p}_{0}[x]\subsetneq\dots\subsetneq\mathfrak{p}[x]$ に移る（$\mathfrak{p}_{i}[x]\cap A=\mathfrak{p}_{i}$ なので異なる）。

**Step 3（$\le$）.** $r=\operatorname{ht}\mathfrak{p}$ とし、\ref{ring:height-converse} で $\mathfrak{p}$ が $(a_{1},\dots,a_{r})$ 上で極小となる $a_{i}$ をとる。$\mathfrak{p}[x]$ が $(a_{1},\dots,a_{r})A[x]$ 上で極小であることを示す：その間の素イデアル $Q$ は $Q\cap A$ が $(a_{i})$ を含み $\mathfrak{p}$ に含まれる素イデアルなので $Q\cap A=\mathfrak{p}$、よって $Q\supset\mathfrak{p}[x]$ で $Q=\mathfrak{p}[x]$。$A[x]$ はネーター（\ref{ring:hilbert-basis}）なので高さ定理から $\operatorname{ht}\mathfrak{p}[x]\le r$。
:::

::: theorem 多項式環の次元 {#ring:polynomial-dimension keywords="dim A[x] = dim A + 1 for Noetherian A, dim k[x_1,...,x_n] = n" index="多項式環の次元|たこうしきかんのじげん"}
（AC）$A$ をネーター環とすると $\dim A[x]=\dim A+1$。特に体 $k$ 上で $\dim k[x_{1},\dots,x_{n}]=n$、$\dim\Z[x_{1},\dots,x_{n}]=n+1$。
:::

::: proof
**Step 1（$\ge$）.** $A$ の鎖 $\mathfrak{p}_{0}\subsetneq\dots\subsetneq\mathfrak{p}_{r}$ から $A[x]$ の鎖 $\mathfrak{p}_{0}[x]\subsetneq\dots\subsetneq\mathfrak{p}_{r}[x]\subsetneq\mathfrak{p}_{r}[x]+(x)$ を得る（最後は $A[x]/(\mathfrak{p}_{r}[x]+(x))\cong A/\mathfrak{p}_{r}$ が整域なので素で、$x\notin\mathfrak{p}_{r}[x]$）。長さ $r+1$。

**Step 2（$\le$：局所化）.** $A[x]$ の素イデアル $P$ について、$\mathfrak{p}\defeq P\cap A$, $r\defeq\operatorname{ht}\mathfrak{p}$ とし、$\operatorname{ht}P\le r+1$ を示す。$S=A\setminus\mathfrak{p}$ で局所化すると $\operatorname{ht}P=\operatorname{ht}(S^{-1}P)$（$S^{-1}A[x]=A_{\mathfrak{p}}[x]$ の素イデアルは $S$ と交わらない素イデアルに対応）、$\operatorname{ht}\mathfrak{p}=\operatorname{ht}\mathfrak{p}A_{\mathfrak{p}}$ なので、$A$ は局所環 $(A,\mathfrak{p})$ で $P\cap A=\mathfrak{p}$ と仮定してよい。

**Step 3（剰余体上の多項式環）.** $k\defeq A/\mathfrak{p}$（体）とすると $A[x]/\mathfrak{p}[x]\cong k[x]$ は PID。$P=\mathfrak{p}[x]$ なら \ref{ring:height-extension} から $\operatorname{ht}P=r$。$P\supsetneq\mathfrak{p}[x]$ なら、$P/\mathfrak{p}[x]$ は $k[x]$ の $0$ でない素イデアルで $(\bar g)$ と単項。$g\in P$ をその持ち上げとし、\ref{ring:height-converse} で $\mathfrak{p}$ が $(a_{1},\dots,a_{r})$ 上で極小となる $a_{i}$ をとる。$P$ は $(a_{1},\dots,a_{r},g)$ 上の極小素イデアルである：間の素イデアル $Q$ は、\ref{ring:height-extension} の Step 3 と同様に $Q\supset\mathfrak{p}[x]$ で、$Q/\mathfrak{p}[x]$ は $\bar g$ を含む $k[x]$ の素イデアルなので、$(\bar g)$ が極大であることから $Q=P$。高さ定理から $\operatorname{ht}P\le r+1\le\dim A+1$。

**Step 4（特に）.** $\dim k=0$, $\dim\Z=1$ から帰納法。
:::

::: supplement
**ネーターでない場合.** ネーターでない環では $\dim A+1\le\dim A[x]\le 2\dim A+1$ であり、上限まで取りうることが知られている（ザイデンバーグ）。

**鎖状環.** 体上の有限生成整域 $A$ では、極大な素イデアルの鎖の長さはすべて $\dim A$ に等しく、$\operatorname{ht}\mathfrak{p}+\dim A/\mathfrak{p}=\dim A$ が成り立つ（**鎖状性**）。これはネーターの正規化と下降定理から示され、代数多様体の次元が「どの点・どの部分多様体から測っても同じ」であることを保証する。一般のネーター環は鎖状とは限らない（永田の例）。
:::

## 問題 {#ring:sec-pi-problems}

::: problem {#ring:prob-height-two-not-principal}
$A=k[x,y]$ の素イデアル $(x,y)$ が単項でないこと（高さ $2$ なので単項イデアル定理と矛盾する）を、単項イデアル定理を使って示せ。
:::

::: solution
$(x,y)=(f)$ なら、$(x,y)$ は $(f)$ 上の極小素イデアル（自分自身）なので、単項イデアル定理から高さ $\le 1$。しかし $0\subsetneq(x)\subsetneq(x,y)$ で高さ $\ge 2$。矛盾。
:::

::: problem {#ring:prob-non-ufd-height-one}
$A=k[x,y,z,w]/(xy-zw)$ は整域で、高さ $1$ の素イデアル $(x,z)$ が単項でないことから、一意分解環でないことを示せ（整域であることと高さの計算は認めてよい）。
:::

::: solution
\ref{ring:ufd-height-one} から、UFD なら高さ $1$ の素イデアル $(x,z)$ は単項である。$\mathfrak{m}\defeq(x,y,z,w)$ とし、$k$ ベクトル空間 $V\defeq(x,z)/(x,z)\mathfrak{m}$ を考える。$A$ は $x,y,z,w$ を次数 $1$ とする次数環（関係式 $xy-zw$ は斉次）で、$(x,z)\mathfrak{m}$ は次数 $2$ の斉次元で生成されるので次数 $1$ の $0$ でない元を含まない。$x,z$ は次数 $1$ の部分（$x,y,z,w$ を基底とする $4$ 次元空間）で一次独立なので、その像は $V$ で一次独立で $\dim V\ge 2$。一方 $(x,z)=(f)$ なら $V$ は $f$ の像で張られ $\dim V\le 1$。矛盾。よって $A$ は UFD でない（$xy=zw$ が二通りの既約分解を与える）。
:::
