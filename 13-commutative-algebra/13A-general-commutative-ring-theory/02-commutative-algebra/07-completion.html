# 完備化とクルルの交叉定理 {#ring:page-completion keywords="completion, I-adic completion, inverse limit, p-adic integers, exactness of completion, completion is flat, Krull intersection theorem, completion of a Noetherian ring is Noetherian, Hensel's lemma"}

整数 $\Z$ を $p$ 進位相で「穴を埋めて」得られるのが $p$ 進整数環 $\Z_{p}$ であり、多項式環 $k[x]$ を $(x)$ 進位相で完備化すると冪級数環 $k[[x]]$ になる。一般に、環 $A$ と加群 $M$ を $I$ 進位相（\ref{ring:adic-topology}）で完備化したもの $\hat M=\varprojlim M/I^{n}M$ を考える（\ref{ring:completion}）。このページでは、ネーター環上の有限生成加群について、完備化が完全であり（\ref{ring:completion-exact}）、$\hat M\cong\hat A\otimes_{A}M$ で（\ref{ring:completion-tensor}）、$\hat A$ が平坦な $A$ 加群であること（\ref{ring:completion-flat}）を示す。鍵になるのは\ref{ring:artin-rees}である。同じ補題から**クルルの交叉定理**（\tref{ring:krull-intersection}）が従い、ネーター局所環が $\mathfrak{m}$ 進位相でハウスドルフであることがわかる。最後に、ネーター環の完備化がネーター環であること（\ref{ring:completion-noetherian}）を、随伴次数環を使って証明する。

> Atiyah–Macdonald 第 10 章の流れを参考にした。逆極限は列（$\N$ で添字付けたもの）に限って扱い、位相の言葉を使わずに代数的に定義した。

## 記法と定義の確認 {#ring:sec-co-notation}

::: notation
- 環は可換、加群は $A$ 加群。フィルトレーション・安定性・アルティン＝リースの補題・随伴次数環・$I$ 進位相は \ref{ring:page-filtrations}、中山の補題は \tref{ring:nakayama}、平坦性のイデアルによる判定は \ref{mod:flat-ideal-criterion}、五項補題は \tref{mod:five-lemma}、テンソル積の右完全性は \ref{ha:tensor-right-exact}。
- **選択公理**：ネーター性から有限生成性を引くところ（従属選択公理）と、平坦性の判定（ベールの判定法）で使う。
:::

## 逆極限と完備化 {#ring:sec-co-limits}

::: definition 逆極限 {#ring:inverse-limit keywords="inverse limit of a sequence of modules, inverse system" index="逆極限|ぎゃくきょくげん, 射影極限|しゃえいきょくげん, 逆系|ぎゃくけい"}
加群の列と準同型 $\cdots\to M_{n+1}\xrightarrow{\theta_{n+1}}M_{n}\to\cdots\to M_{1}$（**逆系**）について、$\prod_{n}M_{n}$ の部分加群
$$
\varprojlim M_{n}\defeq\Bigl\{(x_{n})_{n}\in\prod_{n}M_{n} : \text{すべての }n\text{ で }\theta_{n+1}(x_{n+1})=x_{n}\Bigr\}
$$
を**逆極限**という。逆系の間の準同型（各段の準同型で $\theta$ と可換なもの）は逆極限の間の準同型を誘導する。
:::

::: lemma 逆極限の完全性 {#ring:inverse-limit-exact keywords="inverse limit is left exact, exact if the first system is surjective" index="逆極限の完全性|ぎゃくきょくげんのかんぜんせい"}
逆系の短完全列 $0\to(M'_{n})\to(M_{n})\to(M''_{n})\to 0$（各 $n$ で短完全で、$\theta$ と可換）について、$0\to\varprojlim M'_{n}\to\varprojlim M_{n}\to\varprojlim M''_{n}$ は完全である。さらに $(M'_{n})$ の $\theta'_{n+1}$ がすべて全射なら、$\varprojlim M_{n}\to\varprojlim M''_{n}$ も全射である。
:::

::: proof
**Step 1（左完全）.** 単射性と $\im\subset\Ker$ は成分ごとに明らか。$(x_{n})\in\varprojlim M_{n}$ が $M''$ で $0$ に移るなら、各 $x_{n}$ は $M'_{n}$ の元 $x'_{n}$ の像で、単射性から $(x'_{n})$ は逆系の条件をみたす。

**Step 2（全射）.** $(x''_{n})\in\varprojlim M''_{n}$ とする。$n$ についての帰納法で、$x_{n}\mapsto x''_{n}$ かつ $\theta_{n+1}(x_{n+1})=x_{n}$ となる $x_{n}$ を作る。$x_{1}$ は $M_{1}\to M''_{1}$ の全射性から。$x_{n}$ まで作ったとき、$y\in M_{n+1}$ を $y\mapsto x''_{n+1}$ ととると、$\theta_{n+1}(y)-x_{n}$ は $M''_{n}$ で $\theta''(x''_{n+1})-x''_{n}=0$ に移るので $M'_{n}$ の元 $z$ の像。$\theta'_{n+1}$ が全射なので $z=\theta'_{n+1}(z')$ とし、$x_{n+1}\defeq y-z'$（$z'$ を $M_{n+1}$ の元とみる）とおけば条件をみたす。

::: hypcheck
- **従属選択公理**：Step 2 の帰納的な選択で使う。
- **前提「$\theta'$ が全射」**：Step 2 で $z'$ を得るのに使った。外すと偽：$M'_{n}=p^{n}\Z$（包含）、$M_{n}=\Z$（恒等）、$M''_{n}=\Z/p^{n}\Z$ では、$\varprojlim M'_{n}=\bigcap p^{n}\Z=0$、$\varprojlim M_{n}=\Z$ で、$\Z\to\varprojlim\Z/p^{n}\Z=\Z_{p}$ は全射でない（$\Z_{p}$ は非可算集合）。
:::
:::

::: definition 完備化 {#ring:completion keywords="I-adic completion, completion map, complete, separated" index="完備化|かんびか, 完備|かんび, 分離的|ぶんりてき"}
イデアル $I$ と加群 $M$ について、自然な射影の逆系 $M/I^{n+1}M\to M/I^{n}M$ の逆極限
$$
\hat M\defeq\varprojlim_{n}M/I^{n}M
$$
を $M$ の **$I$ 進完備化**という。$\iota:M\to\hat M$, $x\mapsto(x+I^{n}M)_{n}$ の核は $\bigcap_{n}I^{n}M$ である。$\iota$ が単射のとき $M$ は（$I$ 進位相で）**分離的**、同型のとき**完備**であるという。$\hat A$ は成分ごとの積で環になり、$\hat M$ は $\hat A$ 加群になる。
:::

::: example 完備化の例 {#ring:completion-examples}
1. **$p$ 進整数.** $\Z_{p}\defeq\varprojlim\Z/p^{n}\Z$ は $\Z$ の $(p)$ 進完備化。その元は「$p$ 進展開」$\sum_{k\ge 0}c_{k}p^{k}$（$0\le c_{k}<p$）と一対一に対応する。
2. **冪級数.** 体 $k$ について、$k[x]$ の $(x)$ 進完備化は $k[[x]]$ に同型：$k[[x]]\to\varprojlim k[x]/(x^{n})$, $f\mapsto(f\bmod x^{n})_{n}$ は、係数を一段ずつ読むことで全単射な環準同型になる（$k[x]/(x^{n})$ の元は次数 $<n$ の多項式と同一視でき、整合する列は冪級数の係数列そのもの）。同様に $A[x_{1},\dots,x_{r}]$ の $(x_{1},\dots,x_{r})$ 進完備化は $A[[x_{1},\dots,x_{r}]]$。
3. $k[[x]]$ は $(x)$ 進完備で、完備化しても変わらない。
:::

## 完備化の完全性と平坦性 {#ring:sec-co-exact}

::: lemma 同値なフィルトレーションの完備化 {#ring:completion-cofinal keywords="filtrations with bounded difference give the same completion" index="フィルトレーションと完備化|ふぃるとれーしょんとかんびか"}
$M$ の二つの降鎖 $(M_{n})$, $(M'_{n})$ が、ある $n_{0}$ ですべての $n$ について $M_{n+n_{0}}\subset M'_{n}$ かつ $M'_{n+n_{0}}\subset M_{n}$ をみたすなら、$\varprojlim M/M_{n}\cong\varprojlim M/M'_{n}$（$M$ からの写像と両立する同型）である。
:::

::: proof
包含から誘導される準同型 $\varprojlim M/M_{n}\to\varprojlim M/M'_{n}$, $(x_{n})\mapsto(x_{n+n_{0}}\bmod M'_{n})$ と、逆向きの同様の写像を作ると、合成は $(x_{n})\mapsto(x_{n+2n_{0}}\bmod M_{n})=(x_{n})$（逆系の条件）なので互いに逆である。
:::

::: theorem 完備化の完全性 {#ring:completion-exact keywords="completion is exact on finitely generated modules over a Noetherian ring" index="完備化の完全性|かんびかのかんぜんせい"}
（DC）$A$ をネーター環、$I$ をイデアルとする。有限生成加群の短完全列 $0\to M'\to M\to M''\to 0$ について、$0\to\hat M'\to\hat M\to\hat M''\to 0$ は完全である。
:::

::: proof
**Step 1.** $M'\subset M$ とみなす。各 $n$ で
$$
0\to M'/(I^{n}M\cap M')\to M/I^{n}M\to M''/I^{n}M''\to 0
$$
は完全（$M''$ の像のフィルトレーションは $(I^{n}M+M')/M'=I^{n}M''$）。最初の項の逆系の写像は全射（剰余の剰余）なので、\ref{ring:inverse-limit-exact} から逆極限の列は完全。

**Step 2.** \ref{ring:artin-rees}から $(I^{n}M\cap M')$ は $M'$ の安定な $I$ フィルトレーションで、$(I^{n}M')$ と \ref{ring:stable-same-topology.1} の意味で同値。\ref{ring:completion-cofinal} から $\varprojlim M'/(I^{n}M\cap M')\cong\hat M'$。
:::

::: theorem 完備化とテンソル積 {#ring:completion-tensor keywords="completion of a finitely generated module is A-hat tensor M" index="完備化とテンソル積|かんびかとてんそるせき"}
（DC）$A$ をネーター環、$M$ を有限生成加群とすると、自然な写像 $\hat A\otimes_{A}M\to\hat M$ は同型である。
:::

::: proof
**Step 1（自然な写像）.** $(\hat a,x)\mapsto\hat a\cdot\iota(x)$ は双線形なので $\alpha_{M}:\hat A\otimes_{A}M\to\hat M$ ができ、$M$ について自然。

**Step 2（自由加群）.** $M=A^{r}$ なら、両辺とも有限直和と交換し（逆極限は有限直和と交換、テンソル積も）、$M=A$ では $\hat A\otimes A\cong\hat A$ なので同型。

**Step 3（一般）.** 有限表示 $A^{s}\to A^{r}\to M\to 0$（$A$ がネーターなので核も有限生成）をとる。テンソル積は右完全（\ref{ha:tensor-right-exact}）、完備化も完全（\ref{ring:completion-exact} を $0\to K\to A^{r}\to M\to 0$ と $A^{s}\to K\to 0$ に使う）なので、二つの右完全列と $\alpha$ による可換図式ができ、$\alpha_{A^{s}}$, $\alpha_{A^{r}}$ が同型なので、\ref{mod:five-lemma}から $\alpha_{M}$ も同型。
:::

::: corollary 完備化は平坦 {#ring:completion-flat keywords="completion of a Noetherian ring is flat" index="完備化の平坦性|かんびかのへいたんせい"}
（AC）$A$ がネーター環なら、$\hat A$ は平坦な $A$ 加群である。さらに $\widehat{I^{n}}\cong\hat A\otimes I^{n}=I^{n}\hat A$ で、$\hat A/I^{n}\hat A\cong A/I^{n}$。
:::

::: proof
**Step 1.** 平坦性のイデアルによる判定（\ref{mod:flat-ideal-criterion}）から、イデアル $J$ について $\hat A\otimes J\to\hat A\otimes A=\hat A$ が単射ならよい。\ref{ring:completion-tensor} からこれは $\hat J\to\hat A$ と同一視され、\ref{ring:completion-exact} から単射。

**Step 2.** $0\to I^{n}\to A\to A/I^{n}\to 0$ を完備化すると $0\to\widehat{I^{n}}\to\hat A\to\widehat{A/I^{n}}\to 0$ で、$A/I^{n}$ は $I^{n}$ で消えるので完備：$\widehat{A/I^{n}}=A/I^{n}$。また $\widehat{I^{n}}\cong\hat A\otimes I^{n}$ の像は $I^{n}\hat A$。
:::

## クルルの交叉定理 {#ring:sec-co-krull}

::: theorem クルルの交叉定理 {#ring:krull-intersection keywords="Krull intersection theorem" index="クルルの交叉定理|くるるのこうさていり" refname="クルルの交叉定理"}
（DC）$A$ をネーター環、$I$ をイデアル、$M$ を有限生成加群とし、$N\defeq\bigcap_{n}I^{n}M$ とおく。
1. $IN=N$ であり、$(1+a)N=0$ となる $a\in I$ がある。
2. $I\subset\mathrm{rad}(A)$ なら $N=0$。特に、ネーター局所環 $(A,\mathfrak{m})$ の有限生成加群は $\mathfrak{m}$ 進位相で分離的。
3. $A$ が整域で $I\neq A$ なら $\bigcap_{n}I^{n}=0$。
:::

::: proof
**Step 1（1）.** アルティン＝リースの補題から、$n\ge k$ で $I^{n}M\cap N=I^{n-k}(I^{k}M\cap N)$。$N\subset I^{n}M$ なので、$n=k+1$ として $N=IN$。$N$ は有限生成（ネーター加群の部分加群）なので、中山の補題の 1（\tref{ring:nakayama}）から $(1+a)N=0$, $a\in I$。

**Step 2（2）.** $1+a$ は単元（\ref{ring:jacobson-radical.1}）なので $N=0$。

**Step 3（3）.** $M=A$ とすると $(1+a)N=0$, $a\in I$。$I\neq A$ なので $1+a\neq 0$（$-1\notin I$）、整域なので $N=0$。

::: hypcheck
- **前提「ネーター」**：外すと偽：有理数冪の環 $V$（\ref{ring:rational-exponent-ring}）は局所整域だが、極大イデアル $\mathfrak{m}V$ について $\mathfrak{m}^{2}=\mathfrak{m}$（$t^{q}=t^{q/2}t^{q/2}$）なので $\bigcap\mathfrak{m}^{n}=\mathfrak{m}\neq 0$。
- **前提 $I\subset\mathrm{rad}(A)$（2）**：外すと偽：$A=\Z\times\Z$, $I=\Z\times 0$ では $I^{n}=I$ で $\bigcap I^{n}=I\neq 0$。
:::
:::

## 完備化のネーター性 {#ring:sec-co-noetherian}

::: lemma 随伴次数加群による有限生成性 {#ring:gr-finite-generation keywords="if gr(M) is finitely generated and M is separated over a complete ring then M is finitely generated" index="随伴次数加群と有限生成|ずいはんじすうかぐんとゆうげんせいせい"}
（DC）環 $B$ と降鎖 $B=B_{0}\supset B_{1}\supset\cdots$（$B_{m}B_{n}\subset B_{m+n}$）について、$B$ は完備（$B\to\varprojlim B/B_{n}$ が同型）とする。$B$ 加群 $M$ と降鎖 $(M_{n})$（$B_{m}M_{n}\subset M_{m+n}$）について、$M$ は分離的（$\bigcap M_{n}=0$）で、$\operatorname{gr}(M)\defeq\bigoplus M_{n}/M_{n+1}$ が $\operatorname{gr}(B)\defeq\bigoplus B_{n}/B_{n+1}$ 上有限生成なら、$M$ は有限生成である。
:::

::: proof
**Step 1（持ち上げ）.** $\operatorname{gr}(M)$ の斉次な生成元 $\xi_{i}\in M_{d_{i}}/M_{d_{i}+1}$（$i=1,\dots,r$）をとり、代表元 $x_{i}\in M_{d_{i}}$ を選ぶ。$F\defeq B^{r}$ に $F_{n}\defeq\bigoplus_{i}B_{n-d_{i}}$（$B_{k}=B$ for $k\le 0$）でフィルトレーションを入れ、$\varphi:F\to M$, $e_{i}\mapsto x_{i}$ とすると $\varphi(F_{n})\subset M_{n}$。$\operatorname{gr}(\varphi):\operatorname{gr}(F)\to\operatorname{gr}(M)$ は $\xi_{i}$ を像に含むので全射。

**Step 2（各段で全射）.** $F/F_{n}\to M/M_{n}$ が全射であることを $n$ の帰納法で示す。$0\to F_{n}/F_{n+1}\to F/F_{n+1}\to F/F_{n}\to 0$ と $M$ の同様の列の間の可換図式で、両端の写像（$\operatorname{gr}_{n}(\varphi)$ と帰納法の仮定）が全射なので、真ん中も全射（元を追えばよい）。さらに核 $C_{n}\defeq\Ker(F/F_{n}\to M/M_{n})$ の逆系の写像 $C_{n+1}\to C_{n}$ も全射である：$c\in C_{n}$ を $F/F_{n+1}$ に持ち上げた元 $\tilde c$ の像は $M_{n}/M_{n+1}$ に属し、$\operatorname{gr}_{n}(\varphi)$ の全射性から $F_{n}/F_{n+1}$ の元 $u$ の像なので、$\tilde c-u\in C_{n+1}$ が $c$ に移る。

**Step 3（完備化で全射）.** \ref{ring:inverse-limit-exact} を $0\to(C_{n})\to(F/F_{n})\to(M/M_{n})\to 0$ に使うと、$\hat\varphi:\hat F\to\hat M$ は全射。

**Step 4（$\varphi$ は全射）.** $F=B^{r}$ は（$F_{n}$ が $B_{n}$ のずらしの直和なので）完備：$F\to\hat F$ は同型。$M\to\hat M$ は分離的なので単射。$m\in M$ について、$\iota_{M}(m)=\hat\varphi(\hat f)$ となる $\hat f=\iota_{F}(f)$ があり、$\iota_{M}(\varphi(f))=\hat\varphi(\iota_{F}(f))=\iota_{M}(m)$、単射性から $m=\varphi(f)$。よって $M$ は $x_{1},\dots,x_{r}$ で生成される。
:::

::: theorem 完備化のネーター性 {#ring:completion-noetherian keywords="the I-adic completion of a Noetherian ring is Noetherian, completion of a Noetherian local ring is a Noetherian local ring" index="完備化のネーター性|かんびかのねーたーせい"}
（DC）$A$ がネーター環なら $\hat A$ もネーター環である。$(A,\mathfrak{m})$ がネーター局所環なら、$\mathfrak{m}$ 進完備化 $\hat A$ は極大イデアル $\mathfrak{m}\hat A$ をもつネーター局所環で、$\hat A/\mathfrak{m}^{n}\hat A\cong A/\mathfrak{m}^{n}$。
:::

::: proof
**Step 1（$\hat A$ のフィルトレーション）.** $\hat A_{n}\defeq\Ker(\hat A\to A/I^{n})$ とおくと、$\hat A/\hat A_{n}\cong A/I^{n}$（射影は全射）で、$\hat A$ は $(\hat A_{n})$ について完備かつ分離的、$\operatorname{gr}(\hat A)\cong\bigoplus I^{n}/I^{n+1}=\operatorname{gr}_{I}(A)$。

**Step 2（イデアルは有限生成）.** $\operatorname{gr}_{I}(A)$ はネーター環（\ref{ring:associated-graded}）。$\hat A$ のイデアル $J$ に誘導されたフィルトレーション $J_{n}\defeq J\cap\hat A_{n}$ を入れると、$\operatorname{gr}(J)$ は $\operatorname{gr}(\hat A)$ のイデアル（斉次部分）なので有限生成で、$J$ は分離的。\ref{ring:gr-finite-generation} から $J$ は有限生成。

**Step 3（局所の場合）.** \ref{ring:completion-flat} から $\hat A/\mathfrak{m}\hat A\cong A/\mathfrak{m}$ は体で、$\mathfrak{m}\hat A=\hat A_{1}$ の元 $x$ について $1-x$ は単元（逆元 $\sum_{k}x^{k}$ は $\hat A$ で収束する：部分和は $\hat A/\hat A_{n}$ で定まる）。\ref{ring:local-ring-criterion.3} から局所環。
:::

::: supplement
**ヘンゼルの補題.** 完備局所環 $(A,\mathfrak{m},k)$ 上のモニック多項式 $f$ の還元 $\bar f\in k[x]$ が、互いに素なモニック多項式の積 $\bar f=\bar g\bar h$ に分解するなら、$f=gh$（$g,h$ はモニックで還元が $\bar g,\bar h$）と持ち上げられる。例えば $\Z_{7}$ で $x^{2}-2$ は根をもつ（$\bmod 7$ で $3^{2}=9\equiv 2$）。証明は $\mathfrak{m}$ 進近似を一段ずつ進めるもので、ニュートン法の類似である（松村『可換環論』§8）。

**コーエンの構造定理.** 完備ネーター局所環は、体または完備 DVR 上の冪級数環の剰余環に同型であることが知られている（コーエン）。完備化は局所環の研究を「冪級数環の剰余」という具体的な対象に帰着させる。
:::

## 問題 {#ring:sec-co-problems}

::: problem {#ring:prob-z-p-units}
$\Z_{p}$ で、$a=(a_{n})_{n}$（$a_{n}\in\Z/p^{n}\Z$）が単元であることと、$a_{1}\neq 0$ in $\Z/p\Z$ であることは同値であることを示せ。したがって $\Z_{p}$ は局所環で、極大イデアルは $p\Z_{p}$。
:::

::: solution
$a$ が単元なら成分 $a_{1}$ も単元で $\neq 0$。逆に $a_{1}\neq 0$ なら $p\nmid a_{n}$ の代表元なので各 $a_{n}$ は $\Z/p^{n}\Z$ の単元（\ref{ring:z-mod-n-ring.2}）で、逆元 $a_{n}^{-1}$ は単元の逆元の一意性から逆系の条件をみたす。よって $a^{-1}=(a_{n}^{-1})$。非単元全体は $\{a : a_{1}=0\}=\Ker(\Z_{p}\to\Z/p\Z)$ でイデアルなので局所環（\ref{ring:local-ring-criterion.1}）、\ref{ring:completion-flat} からそれは $p\Z_{p}$。
:::

::: problem {#ring:prob-completion-not-faithful}
$\Z$ の $(6)$ 進完備化は $\Z_{2}\times\Z_{3}$ に同型であることを示せ。
:::

::: solution
中国剰余定理（\ref{ring:crt-integers}）から $\Z/6^{n}\Z\cong\Z/2^{n}\Z\times\Z/3^{n}\Z$ で、この同型は $n$ について両立する。逆極限は直積と交換するので $\varprojlim\Z/6^{n}\Z\cong\varprojlim\Z/2^{n}\Z\times\varprojlim\Z/3^{n}\Z=\Z_{2}\times\Z_{3}$。（完備化は局所環とは限らず、整域とも限らない。）
:::
