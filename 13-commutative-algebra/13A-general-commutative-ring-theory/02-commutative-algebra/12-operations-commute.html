# 操作の可換性と反例 {#ring:page-operations-commute keywords="localization commutes with, flat base change, localization and Hom, localization and annihilator, localization and products, tensor product and products, polynomial and power series rings and quotients, completion and localization"}

可換環論では「局所化してから剰余をとる」と「剰余をとってから局所化する」が同じになる、というような**操作の交換**を絶えず使う。局所化・テンソル積・平坦な拡大は「有限の操作」（剰余・有限の和と共通部分・有限直和・多項式環）とはほぼ無条件に交換するが、「無限の操作」（無限直積・冪級数・有限生成でないものの $\Hom$ や零化イデアル）とは交換しないことが多い。このページでは交換する場合を証明し、しない場合には反例を与え、最後に表にまとめる。イデアルの演算どうしの法則は \ref{ring:page-ideal-arithmetic} で扱った。

## 記法と定義の確認 {#ring:sec-oc-notation}

::: notation
- 環は可換。$S\subset A$ は積閉集合、$S^{-1}M$ は分数加群（\ref{ring:module-localization}）。$S^{-1}M\cong S^{-1}A\otimes_{A}M$ で、局所化は完全（\ref{ring:localization-exact}）。有限の和・共通部分・剰余・テンソル積との交換は \ref{ring:localization-operations} で示した。
- 加群 $M$ が**有限表示**であるとは、完全列 $A^{q}\to A^{p}\to M\to 0$（$p,q$ は有限）があること。ネーター環上では有限生成と同値（核も有限生成なので）。
- $\Hom$ の左完全性は \ref{mod:hom-left-exact}、テンソル積の右完全性は \ref{ha:tensor-right-exact}、テンソル積と直和・剰余の交換は \ref{mod:tensor-isomorphisms}, \ref{mod:tensor-quotient}。
- 商イデアル $(I:J)$ は \ref{ring:colon-ideal}、イデアルの拡大 $IB$ は \ref{ring:extension-contraction}。
- **選択公理**：使わない。
:::

## 局所化と交換するもの {#ring:sec-oc-localization}

::: proposition 局所化と交換する操作 {#ring:localization-commutes keywords="localization commutes with direct sums, polynomial rings, radicals, nilradical" index="局所化と交換する操作|きょくしょかとこうかんするそうさ"}
$A$ を可換環、$S$ を積閉集合とする。
1. 加群の任意の族について $S^{-1}\bigl(\bigoplus_{\lambda}M_{\lambda}\bigr)\cong\bigoplus_{\lambda}S^{-1}M_{\lambda}$。
2. 環として $S^{-1}(A[x])\cong(S^{-1}A)[x]$（左辺の $S$ は $A[x]$ の定数とみる）。
3. イデアル $I$ について $S^{-1}\sqrt{I}=\sqrt{S^{-1}I}$。特に $S^{-1}\mathrm{nil}(A)=\mathrm{nil}(S^{-1}A)$。
:::

::: proof
**Step 1（1）.** $S^{-1}M\cong S^{-1}A\otimes_{A}M$（\ref{ring:localization-operations} の証明で使った同型）と、テンソル積が任意の直和と交換すること（\ref{mod:tensor-isomorphisms}）から。

**Step 2（2）.** $A$ 加群として $A[x]=\bigoplus_{n\ge0}Ax^{n}$ なので、1 から $A$ 加群の同型
$$
\theta:S^{-1}(A[x])\to\bigoplus_{n}(S^{-1}A)x^{n}=(S^{-1}A)[x],\quad \frac{\sum_{n}a_{n}x^{n}}{s}\mapsto\sum_{n}\frac{a_{n}}{s}x^{n}
$$
がある。$\theta$ は環準同型でもある：$\theta$ は、$A[x]\to(S^{-1}A)[x]$（係数ごとに $a\mapsto a/1$）が $S$ の元を単元に送ることから局所化の普遍性（\ref{ring:localization-universal}）で得られる環準同型と、生成元 $f/1$ 上で一致し、$\theta(f/s)=\theta(f/1)\theta(1/s)$ を満たすからである。

**Step 3（3、$\subset$）.** $a\in\sqrt{I}$, $a^{n}\in I$ なら $(a/s)^{n}=a^{n}/s^{n}\in S^{-1}I$。

**Step 4（3、$\supset$）.** $(a/s)^{n}\in S^{-1}I$ とすると、\ref{ring:localization-ideals} の 1 から $a^{n}/s^{n}=b/t$（$b\in I$, $t\in S$）と書け、$u(ta^{n}-s^{n}b)=0$ となる $u\in S$ がある。すると $uta^{n}=us^{n}b\in I$ なので
$$
(uta)^{n}=(ut)^{n-1}\cdot uta^{n}\in I,
$$
すなわち $uta\in\sqrt{I}$ で、$a/s=uta/(uts)\in S^{-1}\sqrt{I}$。$I=0$ とすると後半。
:::

::: theorem 局所化と Hom {#ring:localization-hom keywords="localization commutes with Hom for finitely presented modules" index="局所化と Hom|きょくしょかとほむ"}
$M,N$ を $A$ 加群とし、自然な $S^{-1}A$ 線形写像
$$
\theta_{M}:S^{-1}\Hom_{A}(M,N)\to\Hom_{S^{-1}A}(S^{-1}M,S^{-1}N),\quad\frac{\varphi}{s}\mapsto\Bigl(\frac{m}{t}\mapsto\frac{\varphi(m)}{st}\Bigr)
$$
を考える。$M$ が有限生成なら $\theta_{M}$ は単射、有限表示なら同型である。
:::

::: proof
**Step 1（定義できること）.** $m/t=m'/t'$ なら $u(t'm-tm')=0$ となる $u\in S$ があり、$\varphi$ を施すと $u(t'\varphi(m)-t\varphi(m'))=0$ なので $\varphi(m)/(st)=\varphi(m')/(st')$。同様に $\varphi/s=\varphi'/s'$ なら像も等しい。線形性は定義から。$\theta_{M}$ は $M$ について自然（$g:M'\to M$ との合成と可換）。

**Step 2（自由加群）.** $M=A^{p}$ なら $\Hom_{A}(A^{p},N)\cong N^{p}$（$\varphi\mapsto(\varphi(e_{i}))_{i}$）で、同様に右辺は $(S^{-1}N)^{p}$。\ref{ring:localization-commutes} の 1 から $S^{-1}(N^{p})\cong(S^{-1}N)^{p}$ で、この同一視のもとで $\theta_{A^{p}}$ は恒等写像になる。よって $\theta_{A^{p}}$ は同型。

**Step 3（有限生成なら単射）.** 全射 $\pi:A^{p}\to M$ をとる。$\Hom(-,N)$ の左完全性（\ref{mod:hom-left-exact}）と局所化の完全性から、$0\to S^{-1}\Hom(M,N)\xrightarrow{\pi^{*}}S^{-1}\Hom(A^{p},N)$ は完全（$\pi^{*}$ は単射）。自然性から $\theta_{A^{p}}\circ\pi^{*}=(S^{-1}\pi)^{*}\circ\theta_{M}$ で、左辺は単射の合成なので $\theta_{M}$ は単射。

**Step 4（有限表示なら全射）.** 完全列 $A^{q}\xrightarrow{\alpha}A^{p}\xrightarrow{\pi}M\to0$ に Step 3 と同じ議論を使うと、可換図式の行
$$
\begin{aligned}
&0\to S^{-1}\Hom(M,N)\to S^{-1}\Hom(A^{p},N)\to S^{-1}\Hom(A^{q},N),\\
&0\to\Hom(S^{-1}M,S^{-1}N)\to\Hom(S^{-1}A^{p},S^{-1}N)\to\Hom(S^{-1}A^{q},S^{-1}N)
\end{aligned}
$$
はどちらも完全（下の行は $S^{-1}A^{q}\to S^{-1}A^{p}\to S^{-1}M\to 0$ が完全であることと $\Hom$ の左完全性から）。縦の写像 $\theta$ のうち右二つは Step 2 から同型。$\psi\in\Hom(S^{-1}M,S^{-1}N)$ をとると、その像 $\psi'$ は真ん中で $\theta_{A^{p}}(\xi)$（$\xi$ は一意）と書け、$\xi$ の右への像は $\theta_{A^{q}}$ で $0$ に移る（$\psi'$ の右への像が $0$ なので）。$\theta_{A^{q}}$ は単射なので $\xi$ の右への像は $0$、上の行の完全性から $\xi$ は $S^{-1}\Hom(M,N)$ の元 $\eta$ の像。$\theta_{M}(\eta)$ と $\psi$ は真ん中で同じ像をもち、下の行の左の写像は単射なので $\theta_{M}(\eta)=\psi$。

::: hypcheck
- **前提「有限生成」（単射）・「有限表示」（全射）**：Step 3・4 で有限個の生成元・関係式に使い、Step 2 の有限直和に帰着させた。外すと偽（\ref{ring:localization-hom-counterexamples}）。
- 証明は Step 2 で $\Hom(A^{p},N)\cong N^{p}$ が有限直和であることを本質的に使う。無限直和では $\Hom(A^{(\Lambda)},N)\cong N^{\Lambda}$ は直積になり、局所化は直積と交換しない（\ref{ring:localization-noncommutes} の 1）。
:::
:::

::: proposition 局所化と零化イデアル・商 {#ring:localization-annihilator keywords="localization commutes with annihilators and ideal quotients for finitely generated modules" index="局所化と零化イデアル|きょくしょかとれいかいである"}
1. 有限生成 $A$ 加群 $M$ について $S^{-1}\operatorname{Ann}_{A}M=\operatorname{Ann}_{S^{-1}A}S^{-1}M$。
2. $A$ のイデアル $I$ と有限生成イデアル $J$ について $S^{-1}(I:J)=(S^{-1}I:S^{-1}J)$。
:::

::: proof
**Step 1（1、$\subset$）.** $aM=0$ なら $\frac{a}{s}\cdot\frac{m}{t}=\frac{am}{st}=0$。（有限生成は使わない。）

**Step 2（1、$\supset$）.** $M=Am_{1}+\dots+Am_{n}$ とし、$a/s$ が $S^{-1}M$ を零化するとする。各 $i$ で $am_{i}/s=0$ なので $u_{i}am_{i}=0$ となる $u_{i}\in S$ がある。$u\defeq u_{1}\cdots u_{n}\in S$ は $uam_{i}=0$（すべての $i$）をみたすので $ua\in\operatorname{Ann}M$、よって $a/s=ua/(us)\in S^{-1}\operatorname{Ann}M$。

**Step 3（2）.** $(I:J)=\operatorname{Ann}_{A}\bigl((I+J)/I\bigr)$ である（$aJ\subset I\iff a(I+J)\subset I$）。$(I+J)/I$ は $J$ の像で有限生成。1 と \ref{ring:localization-operations} の 1（$S^{-1}((I+J)/I)\cong(S^{-1}I+S^{-1}J)/S^{-1}I$）から
$$
S^{-1}(I:J)=\operatorname{Ann}_{S^{-1}A}\bigl((S^{-1}I+S^{-1}J)/S^{-1}I\bigr)=(S^{-1}I:S^{-1}J).
$$

::: hypcheck
- **前提「有限生成」**：Step 2 で有限個の $u_{i}$ の積をとるのに使った。外すと偽（次の例）。
:::
:::

::: example 有限性がないと交換しない例 {#ring:localization-hom-counterexamples keywords="localization does not commute with Hom, annihilator, ideal quotient without finiteness" index="局所化と Hom の反例|きょくしょかとほむのはんれい"}
1. **零化イデアル**（有限生成でない）：$A=\Z$, $S=\Z\setminus\{0\}$, $M=\bigoplus_{p}\Z/p\Z$（全素数）。$\operatorname{Ann}M=0$（$n\neq0$ は $p\nmid n$ となる成分を消さない）なので $S^{-1}\operatorname{Ann}M=0$。一方 $S^{-1}M=\Q\otimes M=\bigoplus_{p}\Q\otimes\Z/p\Z=0$（$x\in\Z/p\Z$ について $\frac{1}{1}\otimes x=\frac{p}{p}\otimes x=\frac{1}{p}\otimes px=0$）なので $\operatorname{Ann}S^{-1}M=\Q$。
2. **Hom**（有限生成でない）：$A=\Z$, $S=\Z\setminus\{0\}$。$\Hom_{\Z}(\Q,\Z)=0$：$\varphi(1)$ はすべての $m\ge1$ で $m\varphi(1/m)$ と書けるので、すべての整数で割り切れて $0$。さらに $b\varphi(a/b)=a\varphi(1)=0$ で $\Z$ はねじれがないので $\varphi=0$。よって $S^{-1}\Hom(\Q,\Z)=0$ だが、$\Hom_{\Q}(\Q,\Q)=\Q$。
3. **Hom・商イデアル**（有限生成だが有限表示でない）：$P=k[x,y_{1},y_{2},\dots]$（可算無限変数）、$J_{0}=(x^{n}y_{n} : n\ge1)$, $A=P/J_{0}$, $I=(y_{1},y_{2},\dots)A$, $S=\{x^{m}\}$ とする。
   - $(0:I)=0$：単項式で生成されたイデアル $J_{0}$ について、多項式 $f$ が $J_{0}$ に属することと、$f$ の各単項式がある生成元 $x^{n}y_{n}$ で割り切れることは同値（$\sum g_{i}x^{n_{i}}y_{n_{i}}$ の単項式は、ある $g_{i}$ の単項式と生成元の積）。$f\notin J_{0}$ なら、生成元で割り切れない単項式 $\mu$ をもつ。$k$ を $\mu$ の $x$ の次数より大きくとると、$y_{k}\mu$（$y_{k}f$ の単項式）は $x^{k}y_{k}$ で割り切れず（$x$ の次数が足りない）、$n\neq k$ の $x^{n}y_{n}$ で割り切れれば $\mu$ も割り切れてしまう。よって $y_{k}f\notin J_{0}$。したがって $\bar f\in(0:I)$ なら $\bar f=0$。
   - $S^{-1}I=0$：$y_{n}/1=x^{n}y_{n}/x^{n}=0$。よって $(0:S^{-1}I)=S^{-1}A$ で、$S^{-1}A\neq0$（$x^{m}\notin J_{0}$。単項式 $x^{m}$ はどの生成元でも割り切れない）。

   以上から $S^{-1}(0:I)=0\neq(0:S^{-1}I)$。同じことを $\Hom_{A}(A/I,A)\cong(0:I)$ で言い換えると、巡回加群 $A/I$（有限生成だが有限表示でない）について $S^{-1}\Hom_{A}(A/I,A)=0\neq\Hom_{S^{-1}A}(S^{-1}A/S^{-1}I,S^{-1}A)=S^{-1}A$。
:::

::: example 局所化と交換しない無限の操作 {#ring:localization-noncommutes keywords="localization does not commute with infinite products, power series, completion" index="局所化と直積|きょくしょかとちょくせき"}
1. **無限直積**：$A=\Z$, $S=\Z\setminus\{0\}$。自然な写像 $S^{-1}\prod_{\lambda}M_{\lambda}\to\prod_{\lambda}S^{-1}M_{\lambda}$ は
   - 単射でない：$M_{p}=\Z/p\Z$（全素数）。右辺は $0$（1 の例と同じ）。左辺で $e=(1,1,\dots)$ について $e/1\neq0$：$ne=0$ となる $0\neq n$ はない（$p\nmid n$ の成分）。
   - 全射でない：$M_{n}=\Z$（$n\ge1$）。$(1/n)_{n}\in\prod\Q$ は、左辺の元 $(a_{n})_{n}/s$（$s\neq0$）の像なら、各 $n$ で $1/n=a_{n}/s$、すなわち $s=na_{n}$。$s$ がすべての $n\ge1$ で割り切れることになり、$s\neq0$ に反する。
2. **冪級数**：$S^{-1}(\Z[[x]])\to\Q[[x]]$（係数ごとに $a\mapsto a/1$）は単射だが全射でない：$\sum_{n}x^{n}/n!$ が $f/s$（$f\in\Z[[x]]$）なら $s/n!\in\Z$ がすべての $n$ で成り立ち矛盾。単射は、$f/s\mapsto0$ なら $f$ の係数がすべて $0$ なので。
3. **完備化**：$A=k[x]$, $S=\{x^{m}\}$, $I=(x)$。先に完備化すると $\hat A=k[[x]]$（\ref{ring:completion-examples}）で、$S^{-1}\hat A=k[[x]][1/x]=k((x))\neq0$。先に局所化すると $S^{-1}I=S^{-1}A$（$x$ が単元）なので $S^{-1}A/(S^{-1}I)^{n}=0$、$S^{-1}I$ 進完備化は $0$。
:::

## テンソル積と平坦な拡大 {#ring:sec-oc-tensor}

::: proposition テンソル積と直積 {#ring:tensor-product-commutes keywords="tensor product commutes with direct products for finitely presented modules" index="テンソル積と直積|てんそるせきとちょくせき"}
加群 $M$ と族 $(N_{\lambda})$ について、自然な写像 $\tau_{M}:M\otimes\prod_{\lambda}N_{\lambda}\to\prod_{\lambda}(M\otimes N_{\lambda})$, $m\otimes(n_{\lambda})\mapsto(m\otimes n_{\lambda})$ は、$M$ が有限生成なら全射、有限表示なら同型である。
:::

::: proof
**Step 1（自由加群）.** $M=A^{p}$ なら、$A^{p}\otimes N\cong N^{p}$（\ref{mod:tensor-isomorphisms}）により両辺は $(\prod N_{\lambda})^{p}$ と $\prod N_{\lambda}^{p}$ になり、$\tau$ は成分の並べ替えなので同型。

**Step 2（有限生成なら全射）.** 全射 $A^{p}\to M$ に $-\otimes N$ を施すと全射（右完全性 \ref{ha:tensor-right-exact}）。自然性から $\tau_{M}\circ(\pi\otimes1)=\prod(\pi\otimes1)\circ\tau_{A^{p}}$ で、右辺は全射の合成なので $\tau_{M}$ は全射。

**Step 3（有限表示なら同型）.** $A^{q}\to A^{p}\to M\to 0$ に $-\otimes\prod N_{\lambda}$ と $\prod(-\otimes N_{\lambda})$ を施すと、どちらも右完全（直積は完全列を完全列に移す）で、行は完全。縦の写像は左二つが Step 1 から同型。\ref{ring:localization-hom} の Step 4 と双対な図式追跡（余核の間の写像）で $\tau_{M}$ は同型：二つの行で $M$ の項は左の写像の余核であり、同型な写像の余核は同型。
:::

::: example テンソル積と直積が交換しない例
\ref{ring:localization-noncommutes} の 1 は、$\Q\otimes_{\Z}-=S^{-1}$（$S=\Z\setminus\{0\}$）なので、$M=\Q$（有限生成でない）について $\tau_{\Q}$ が単射でも全射でもない例である。
:::

::: theorem 平坦な拡大と共通部分・商イデアル {#ring:flat-extension-intersection keywords="flat base change commutes with finite intersections of ideals and with ideal quotients by finitely generated ideals" index="平坦な拡大と共通部分|へいたんなかくだいときょうつうぶぶん"}
$f:A\to B$ を環準同型で、$B$ が平坦 $A$ 加群とする。$A$ のイデアル $I,I_{1},\dots,I_{n}$ と有限生成イデアル $J$ について
1. $(I_{1}\cap\dots\cap I_{n})B=I_{1}B\cap\dots\cap I_{n}B$。
2. $(I:J)B=(IB:JB)$。

局所化 $A\to S^{-1}A$ は平坦（\ref{ring:localization-exact}）なので、特に局所化はイデアルの有限個の共通部分と有限生成イデアルによる商と交換する。
:::

::: proof
**Step 1（拡大イデアルとテンソル積）.** 包含 $I\to A$ に $-\otimes_{A}B$ を施すと、平坦性から $I\otimes_{A}B\to A\otimes_{A}B=B$ は単射で、像は $f(a)b$ たちで生成される $IB$。また $A/I\otimes_{A}B\cong B/IB$（\ref{mod:tensor-quotient}）。

**Step 2（1、$n=2$）.** $A\to A/I_{1}\oplus A/I_{2}$, $a\mapsto(\bar a,\bar a)$ の核は $I_{1}\cap I_{2}$ なので、$0\to I_{1}\cap I_{2}\to A\to A/I_{1}\oplus A/I_{2}$ は完全。$-\otimes_{A}B$ は平坦性から完全性を保ち、直和と交換するので、Step 1 から
$$
0\to(I_{1}\cap I_{2})B\to B\to B/I_{1}B\oplus B/I_{2}B
$$
は完全。右の写像の核は $I_{1}B\cap I_{2}B$ なので $(I_{1}\cap I_{2})B=I_{1}B\cap I_{2}B$。一般の $n$ は帰納法（$(I_{1}\cap\dots\cap I_{n-1})\cap I_{n}$）。

**Step 3（2、単項の場合）.** $a\in A$ について、$\mu_{a}:A\to A/I$, $r\mapsto\overline{ra}$ の核は $(I:a)$。$-\otimes B$ を施すと $B\to B/IB$, $b\mapsto\overline{f(a)b}$ になり、平坦性からその核 $(IB:f(a))$ は $(I:a)\otimes B=(I:a)B$。

**Step 4（2）.** $J=(a_{1},\dots,a_{m})$ とすると $(I:J)=\bigcap_{i}(I:a_{i})$（\ref{ring:colon-laws} の 4）、同様に $JB=\sum_{i}f(a_{i})B$ なので $(IB:JB)=\bigcap_{i}(IB:f(a_{i}))$。Step 2・3 から
$$
(I:J)B=\bigcap_{i}(I:a_{i})B=\bigcap_{i}(IB:f(a_{i}))=(IB:JB).
$$

::: hypcheck
- **前提「平坦」**：Step 1 の単射性と Step 2・3 の完全性に使った。外すと偽：\ref{ring:extension-contraction-counterexamples} の 1（$k[x,y]\to k[x,y]/(x-y)$ は平坦でない）。
- **前提「有限個」**：Step 2 の帰納法。無限個の共通部分とは局所化でも交換しない：$\Z$ で $\bigcap_{p}p\Z=0$ だが、$S=\Z\setminus\{0\}$ で局所化すると各 $p\Z$ は $\Q$ になり共通部分は $\Q\neq0$。
- **前提「$J$ が有限生成」**：Step 4。外すと偽（\ref{ring:localization-hom-counterexamples} の 3）。
:::
:::

## 多項式環・冪級数環と剰余 {#ring:sec-oc-polynomial}

::: proposition 多項式環・冪級数環と剰余 {#ring:polynomial-quotient-commutes keywords="(A/I)[x] = A[x]/IA[x], (A/I)[[x]] = A[[x]]/I[[x]], IA[[x]] = I[[x]] for finitely generated I" index="多項式環と剰余|たこうしきかんとじょうよ"}
$A$ のイデアル $I$ について、係数がすべて $I$ に属する多項式・冪級数の全体を $I[x]$, $I[[x]]$ と書く。
1. $I[x]=IA[x]$ で、$(A/I)[x]\cong A[x]/IA[x]$。
2. $(A/I)[[x]]\cong A[[x]]/I[[x]]$。
3. $I$ が有限生成なら $I[[x]]=IA[[x]]$。
4. $B$ を $A$ 代数とすると $B\otimes_{A}A[x]\cong B[x]$。
:::

::: proof
**Step 1（1・2）.** 係数ごとの剰余 $A[[x]]\to(A/I)[[x]]$, $\sum a_{n}x^{n}\mapsto\sum\bar a_{n}x^{n}$ は全射な環準同型（積の係数 $\sum_{i+j=n}a_{i}b_{j}$ は有限和なので剰余と交換）で、核は $I[[x]]$。準同型定理から 2。多項式でも同じで $(A/I)[x]\cong A[x]/I[x]$。$I[x]=IA[x]$：$\sum a_{n}x^{n}$（$a_{n}\in I$, 有限和）は $IA[x]$ の元 $\sum a_{n}\cdot x^{n}$。逆に $IA[x]$ の元 $\sum a_{i}g_{i}$ の係数は $I$ に属する。

**Step 2（3）.** $IA[[x]]\subset I[[x]]$ は Step 1 と同じ。$I=(a_{1},\dots,a_{r})$ とし、$f=\sum_{n}c_{n}x^{n}$（$c_{n}\in I$）をとる。各 $n$ で $c_{n}=\sum_{i}b_{in}a_{i}$（$b_{in}\in A$）と書き、$g_{i}\defeq\sum_{n}b_{in}x^{n}\in A[[x]]$ とおくと、$f=\sum_{i=1}^{r}a_{i}g_{i}\in IA[[x]]$（係数ごとに比べる。$i$ の和は有限）。

**Step 3（4）.** $A[x]=\bigoplus_{n}Ax^{n}$ なので $B\otimes_{A}A[x]\cong\bigoplus_{n}Bx^{n}=B[x]$（\ref{mod:tensor-isomorphisms}）。積も $(b\otimes x^{m})(b'\otimes x^{n})=bb'\otimes x^{m+n}$ で一致する。

::: hypcheck
- **前提「有限生成」（3）**：Step 2 で $f$ を有限個の $g_{i}$ でまとめるのに使った。外すと偽：$A=k[y_{1},y_{2},\dots]$, $I=(y_{1},y_{2},\dots)$, $f=\sum_{n}y_{n}x^{n}\in I[[x]]$。$IA[[x]]$ の元は $\sum_{i=1}^{r}a_{i}g_{i}$（$a_{i}\in I$）の形で、$a_{1},\dots,a_{r}$ に現れる変数は $y_{1},\dots,y_{N}$ までとすると、その係数はすべて $(y_{1},\dots,y_{N})$ に属する。しかし $y_{N+1}\notin(y_{1},\dots,y_{N})$（$y_{1},\dots,y_{N}\mapsto0$ の代入で $y_{N+1}$ は $0$ に移らない）なので $f\notin IA[[x]]$。
- 4 の冪級数版は偽：$\Q\otimes_{\Z}\Z[[x]]=S^{-1}\Z[[x]]\neq\Q[[x]]$（\ref{ring:localization-noncommutes} の 2）。
:::
:::

## まとめ {#ring:sec-oc-summary}

::: table 操作の可換性 {#ring:table-operations-commute}
| 操作 | 局所化 $S^{-1}$ | 平坦な $-\otimes_{A}B$ | 一般の $-\otimes_{A}N$ | 完備化（ネーター・有限生成） |
|---|---|---|---|---|
| 剰余 $M/N$ | :yes: | :yes: | :yes: | :yes: |
| 有限の和 | :yes: | :yes: | :yes: | :yes: |
| 有限の共通部分 | :yes: | :yes: | :no: | :yes: |
| 任意の直和 | :yes: | :yes: | :yes: | — |
| 無限直積 | :no: | :no: | :partial: | — |
| $\Hom(M,-)$ | :partial: | :partial: | — | — |
| 零化イデアル・商イデアル | :partial: | :partial: | — | — |
| 根基・冪零根基 | :yes: | :no: | — | — |
| 多項式環 $A[x]$ | :yes: | :yes: | :yes: | — |
| 冪級数環 $A[[x]]$ | :no: | :no: | :no: | — |
| 整閉包 | :yes: | — | — | — |
| 随伴素イデアル（ネーター） | :yes: | — | — | — |
| 完備化 | :no: | — | — | — |
:::

::: remark 表の根拠
- 局所化：剰余・和・有限共通部分・テンソル積（\ref{ring:localization-operations}）、直和・多項式環・根基（\ref{ring:localization-commutes}）、$\Hom$（\ref{ring:localization-hom}。:partial: は有限表示のとき）、零化イデアル・商（\ref{ring:localization-annihilator}。有限生成のとき）、整閉包（\ref{ring:integral-localization}）、随伴素イデアル（\ref{ring:ass-localization}）、直積・冪級数・完備化（\ref{ring:localization-noncommutes}）。
- 平坦な拡大：完全列を保つので剰余・有限共通部分（\ref{ring:flat-extension-intersection}）と、局所化と同じ議論で $\Hom$・商イデアル。根基は保たれない：$\Z\to\Z[i]$ は平坦（自由加群）だが \ref{ring:extension-contraction-counterexamples} の 2。
- 一般のテンソル積：右完全なので剰余・和・直和と交換するが、共通部分は保たない（$B=k[x,y]/(x-y)$ を $N$ とした \ref{ring:extension-contraction-counterexamples} の 1。イデアル $I$ の拡大 $IB$ は $I\otimes B$ の像）。直積は有限表示なら交換（\ref{ring:tensor-product-commutes}）。
- 完備化：ネーター環上の有限生成加群では完全（\ref{ring:completion-exact}）で $\hat M\cong\hat A\otimes M$（\ref{ring:completion-tensor}）なので、完全列で書ける操作（剰余・有限の和と共通部分）と交換する。無限直和は有限生成でないので、この列の対象外とした。
:::

::: supplement
**高い視点.** 局所化 $S^{-1}A\otimes_{A}-$ は左随伴（\ref{ha:tensor-hom-adjunction}）なので任意の余極限（直和・余核・フィルター付き余極限）と交換する（\ref{cat:adjoints-preserve-limits} の双対）。さらに平坦なので有限の極限（核・有限共通部分・有限直積）とも交換する。交換しないのは無限の極限（無限直積・逆極限＝冪級数や完備化）である。$\Hom(M,-)$ や $M\otimes-$ が「有限表示なら」交換するのは、$M$ が有限個の自由加群の有限の余極限（余核）で書けるからで、圏論の言葉では有限表示加群がコンパクト対象（$\Hom(M,-)$ がフィルター付き余極限と交換する）であることに対応する。これは解釈であり、このページの証明はこの一般論を使っていない。
:::

## 問題 {#ring:sec-oc-problems}

::: problem {#ring:prob-localization-quotient-power}
$A$ を可換環、$I$ をイデアル、$\mathfrak{p}$ を素イデアルとする。$(I^{n})_{\mathfrak{p}}=(I_{\mathfrak{p}})^{n}$ と $(A/I)_{\mathfrak{p}}\cong A_{\mathfrak{p}}/I_{\mathfrak{p}}$ を示し、$\operatorname{Ann}_{A_{\mathfrak{p}}}(A/I)_{\mathfrak{p}}=I_{\mathfrak{p}}$ を確かめよ。
:::

::: solution
積は拡大と交換する（\ref{ring:extension-contraction-laws} の 2。局所化の拡大イデアルは $S^{-1}I$）ので $(I^{n})_{\mathfrak{p}}=(I_{\mathfrak{p}})^{n}$。剰余との交換は \ref{ring:localization-operations} の 1。$A/I$ は有限生成（$1$ で生成）なので \ref{ring:localization-annihilator} の 1 から $\operatorname{Ann}(A/I)_{\mathfrak{p}}=(\operatorname{Ann}A/I)_{\mathfrak{p}}=I_{\mathfrak{p}}$。
:::
