# 環の基礎（Basic Ring Theory）

環・イデアル・剰余環、準同型定理、素イデアルと極大イデアル、中国剰余定理、多項式環と冪級数環、局所化と商体、イデアルの演算法則と反例（雪江『代数学 2』第 1 章に対応）。

<p class="mn-msc">MSC2020: 13A, 16A</p>
