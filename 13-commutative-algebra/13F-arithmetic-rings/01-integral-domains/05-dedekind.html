# デデキント環 {#ring:page-dedekind keywords="Dedekind domain, fractional ideal, invertible ideal, unique factorization of ideals, ideal class group, Z[sqrt(-5)]"}

$\Z[\sqrt{-5}]$ では元の素元分解が一意でない（\ref{ring:non-ufd-example}）が、**イデアル**の素イデアル分解は一意である。この性質をもつ整域が**デデキント環**であり（\ref{ring:dedekind}）、代数体の整数環や代数曲線の座標環がその代表例である。このページでは、デデキント環を「\term[次元]{ring:krull-dimension} $1$ のネーター正規整域」として定義し、各素イデアルでの局所化が離散付値環になること（\ref{ring:dedekind-local}）、$0$ でない分数イデアルがすべて可逆であること（\ref{ring:dedekind-invertible}）、イデアルが素イデアルの積にただ一通りに分解すること（\ref{ring:dedekind-factorization}）を示す。最後に、デデキント環が PID からどれだけ離れているかを測る**イデアル類群**（\ref{ring:class-group}）を導入し、$\Z[\sqrt{-5}]$ で計算する。

> Atiyah–Macdonald 第 9 章と松村『可換環論』§11 の流れを参考にした。可逆性の局所的判定（\ref{ring:invertible-local}）を経由する証明にした。

## 記法と定義の確認 {#ring:sec-dd-notation}

::: notation
- 環は可換。ネーター環・極小素イデアルの有限性は \ref{ring:page-noetherian-artinian}、正規環と局所性は \ref{ring:normal-domain}, \ref{ring:integral-localization}、離散付値環の特徴付けは \ref{ring:dvr-characterization}、局所的性質は \ref{ring:local-properties}、局所化のイデアルは \ref{ring:localization-ideals}, \ref{ring:localization-primes}。
- $A$ を整域、$K=\Frac A$ とする。$A$ 部分加群 $I,J\subset K$ について $IJ\defeq\{\sum x_{k}y_{k}\}$、$(I:J)\defeq\{x\in K : xJ\subset I\}$。
- **選択公理**：局所的性質と中山の補題（離散付値環の特徴付け）を通して使う。
:::

## デデキント環の定義と局所的な特徴付け {#ring:sec-dd-definition}

::: definition デデキント環 {#ring:dedekind keywords="Dedekind domain" index="デデキント環|でできんとかん, デデキント整域|でできんとせいいき"}
整域 $A$ が (1) ネーター環、(2) 正規環、(3) $0$ でない素イデアルはすべて極大イデアル、をみたすとき、$A$ を**デデキント環**という。（体もこの定義をみたすが、以下の主張は体については自明である。体を除く流儀もある。）
:::

::: example
1. PID はデデキント環：ネーターで、UFD なので正規（\ref{ring:ufd-normal}）、$0$ でない素イデアルは極大（\ref{ring:pid-basic.4}）。特に $\Z$, $K[x]$, DVR。
2. $\Z[\sqrt{-5}]$ はデデキント環である（\ref{ring:z-sqrt-minus-5-dedekind}）が、PID でない。
3. $K[x,y]$ は正規なネーター整域だが、$0\subsetneq(x)\subsetneq(x,y)$ なので (3) をみたさず、デデキント環でない。$K[t^{2},t^{3}]$ は (1)(3) をみたすが正規でない（\ref{ring:non-normal-examples.2}）。
:::

::: theorem デデキント環の局所的な特徴付け {#ring:dedekind-local keywords="Dedekind iff Noetherian domain whose localizations at nonzero primes are DVRs" index="デデキント環の局所的特徴付け|でできんとかんのきょくしょてきとくちょうづけ"}
（AC）ネーター整域 $A$ で $0$ でない素イデアルがすべて極大なものについて、$A$ がデデキント環であることと、$0$ でないすべての素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ が離散付値環であることは同値である。
:::

::: proof
**Step 1（$A_{\mathfrak{p}}$ の性質）.** $A_{\mathfrak{p}}$ はネーター局所整域（\ref{ring:noetherian-exact.3}）で、その素イデアルは $\mathfrak{p}$ に含まれる素イデアル $0$, $\mathfrak{p}$ に対応する（\ref{ring:localization-at-prime.2}。仮定から $0\subsetneq\mathfrak{q}\subset\mathfrak{p}$ なら $\mathfrak{q}=\mathfrak{p}$）ので、\term[次元]{ring:krull-dimension}は $1$。

**Step 2.** 離散付値環の特徴付け（\ref{ring:dvr-characterization.1}⇔5）から、$A_{\mathfrak{p}}$ が DVR $\iff$ $A_{\mathfrak{p}}$ が正規。正規性は局所的性質（\ref{ring:integral-localization.3}）なので、すべての $\mathfrak{p}\neq 0$ で $A_{\mathfrak{p}}$ が正規 $\iff$ $A$ が正規（$A_{(0)}=K$ は常に正規）。
:::

## 分数イデアルと可逆性 {#ring:sec-dd-fractional}

::: definition 分数イデアル・可逆イデアル {#ring:fractional-ideal keywords="fractional ideal, invertible ideal, inverse of a fractional ideal" index="分数イデアル|ぶんすういである, 可逆イデアル|かぎゃくいである"}
$A$ 部分加群 $I\subset K$ で、$dI\subset A$ となる $0\neq d\in A$ があるものを**分数イデアル**という（$A$ のイデアルは $d=1$ の分数イデアル）。分数イデアル $I$ に対し $IJ=A$ となる分数イデアル $J$ があるとき、$I$ を**可逆**という。
:::

::: proposition 可逆イデアルの性質 {#ring:invertible-properties keywords="inverse is (A:I), invertible implies finitely generated, invertible in a local domain iff principal" index="可逆イデアルの性質|かぎゃくいであるのせいしつ"}
$I$ を $0$ でない分数イデアルとする。
1. $I$ が可逆なら、逆は $I^{-1}=(A:I)$ でただ一つ。
2. 可逆な分数イデアルは有限生成 $A$ 加群である。
3. $A$ が局所整域なら、$I$ が可逆であることと、$I=xA$（$x\in K^{\times}$）と単項であることは同値である。
:::

::: proof
**Step 1（1）.** $IJ=A$ なら $J\subset(A:I)$ で、$(A:I)=(A:I)A=(A:I)IJ\subset AJ=J$。

**Step 2（2）.** $1\in A=II^{-1}$ なので $1=\sum_{k=1}^{n}x_{k}y_{k}$（$x_{k}\in I$, $y_{k}\in I^{-1}$）。$x\in I$ について $x=\sum(xy_{k})x_{k}$ で $xy_{k}\in II^{-1}=A$ なので、$I=Ax_{1}+\dots+Ax_{n}$。

**Step 3（3）.** 単項 $xA$ の逆は $x^{-1}A$。逆に局所整域で $1=\sum x_{k}y_{k}$ なら、$x_{k}y_{k}\in A$ のどれかは単元（すべて極大イデアルに属すると和も属するので）。$x_{1}y_{1}=u$ を単元とすると、$x\in I$ について $x=x_{1}\cdot(y_{1}x)u^{-1}$ で $y_{1}x\in A$ なので $I=x_{1}A$。
:::

::: remark 商イデアル・準同型との関係
分数イデアル $I,J$ について $(J:I)=(J:_{K}I)$（\ref{ring:colon-fraction}）で、\ref{ring:hom-fractional} から $\Hom_{A}(I,J)\cong(J:I)$。特に $I^{-1}=(A:I)\cong\Hom_{A}(I,A)$ は $I$ の双対加群で、可逆性 $II^{-1}=A$ は「$I$ の元と双対の元を組み合わせて $1$ が作れる」ことを表す。また $I$ が可逆なら $\End_{A}(I)=(I:I)=A$：$(I:I)\supset A$ と、$(I:I)=(I:I)II^{-1}\subset II^{-1}=A$ から。逆は一般に成り立たない（正規でない整域の極大イデアルでは $(I:I)\supsetneq A$ になりうるが、正規なネーター局所整域でも、$\End(I)=A$ で可逆でないイデアルがある。例：$k[x,y]_{(x,y)}$ の極大イデアル。\ref{ring:colon-integral.2} から $\End=A$ だが、単項でないので可逆でない）。
:::

::: lemma 可逆性の局所的判定 {#ring:invertible-local keywords="a fractional ideal is invertible iff finitely generated and locally principal" index="可逆性の局所的判定|かぎゃくせいのきょくしょてきはんてい"}
（AC）整域 $A$ の有限生成な分数イデアル $I\neq 0$ について、$I$ が可逆であることと、すべての極大イデアル $\mathfrak{m}$ で $I_{\mathfrak{m}}=IA_{\mathfrak{m}}$ が単項であることは同値である。
:::

::: proof
**Step 1（商と局所化の交換）.** $I=Ax_{1}+\dots+Ax_{n}$ なら $(A:I)=\bigcap_{k}x_{k}^{-1}A$ で、有限個の共通部分は局所化と交換する（\ref{ring:localization-operations.1}）ので、$(A:I)_{\mathfrak{m}}=(A_{\mathfrak{m}}:I_{\mathfrak{m}})$。

**Step 2.** $I(A:I)\subset A$ は常に成り立つ。$I$ が可逆 $\iff I(A:I)=A$（\ref{ring:invertible-properties.1}）$\iff$ すべての $\mathfrak{m}$ で $(I(A:I))_{\mathfrak{m}}=A_{\mathfrak{m}}$（局所的性質 \ref{ring:local-properties.1} を $A/I(A:I)$ に使う）$\iff$ すべての $\mathfrak{m}$ で $I_{\mathfrak{m}}(A_{\mathfrak{m}}:I_{\mathfrak{m}})=A_{\mathfrak{m}}$（Step 1）$\iff$ $I_{\mathfrak{m}}$ が可逆 $\iff$ $I_{\mathfrak{m}}$ が単項（\ref{ring:invertible-properties.3}）。
:::

::: theorem デデキント環と可逆性 {#ring:dedekind-invertible keywords="a domain is Dedekind iff every nonzero fractional ideal is invertible" index="デデキント環と可逆性|でできんとかんとかぎゃくせい"}
（AC）整域 $A$ がデデキント環であることと、$0$ でない分数イデアル（同じことだが、$0$ でないイデアル）がすべて可逆であることは同値である。したがって、デデキント環の $0$ でない分数イデアル全体は、積について可換群をなす。
:::

::: proof
**Step 1（⇒）.** 分数イデアル $I\neq 0$ について $dI\subset A$ はネーター環のイデアルなので有限生成、したがって $I$ も有限生成。各極大イデアル $\mathfrak{m}$ で $A_{\mathfrak{m}}$ は DVR（\ref{ring:dedekind-local}）なので PID で、$I_{\mathfrak{m}}$ は単項。\ref{ring:invertible-local} から可逆。

**Step 2（⇐）.** イデアルはすべて可逆なので有限生成（\ref{ring:invertible-properties.2}）で、$A$ はネーター。極大イデアル $\mathfrak{m}$ について、$A_{\mathfrak{m}}$ のイデアルは $A$ のイデアルの拡大（\ref{ring:localization-ideals.2}）で、可逆性は局所化しても保たれる（$IJ=A$ なら $I_{\mathfrak{m}}J_{\mathfrak{m}}=A_{\mathfrak{m}}$）ので、局所整域 $A_{\mathfrak{m}}$ のイデアルはすべて単項（\ref{ring:invertible-properties.3}）。よって $A_{\mathfrak{m}}$ は局所 PID、すなわち DVR（\ref{ring:dvr-characterization.3}⇒1）で正規・次元 $1$（または体）。正規性は局所的（\ref{ring:integral-localization.3}）。$0\neq\mathfrak{p}\subset\mathfrak{m}$ が素イデアルなら $\mathfrak{p}A_{\mathfrak{m}}$ は DVR の $0$ でない素イデアルなので極大で、対応から $\mathfrak{p}=\mathfrak{m}$。よって (3) も成り立つ。

**Step 3（群）.** 積は結合的・可換で単位元 $A$、逆元 $(A:I)$。分数イデアルの積は分数イデアル（$dI,eJ\subset A$ なら $deIJ\subset A$）。
:::

## イデアルの素イデアル分解 {#ring:sec-dd-factorization}

::: theorem イデアルの素イデアル分解 {#ring:dedekind-factorization keywords="unique factorization of ideals into prime ideals in a Dedekind domain" index="イデアルの素イデアル分解|いであるのそいであるぶんかい"}
（AC）デデキント環 $A$ の $0$ でないイデアル $I$ は、相異なる $0$ でない素イデアル $\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}$ と $e_{i}\ge 1$ によって
$$
I=\mathfrak{p}_{1}^{e_{1}}\cdots\mathfrak{p}_{r}^{e_{r}}
$$
と書け、この表示は順序を除いて一意である（$I=A$ は $r=0$）。$e_{i}$ は $IA_{\mathfrak{p}_{i}}=(\mathfrak{p}_{i}A_{\mathfrak{p}_{i}})^{e_{i}}$ で決まる。
:::

::: proof
**Step 1（局所的な指数）.** $0$ でない素イデアル $\mathfrak{p}$ について $A_{\mathfrak{p}}$ は DVR（\ref{ring:dedekind-local}）なので、$IA_{\mathfrak{p}}=(\mathfrak{p}A_{\mathfrak{p}})^{v_{\mathfrak{p}}(I)}$ となる $v_{\mathfrak{p}}(I)\ge 0$ がただ一つある（DVR のイデアルは極大イデアルの冪。\ref{ring:prob-dvr-ideals}）。$v_{\mathfrak{p}}(I)>0\iff I\subset\mathfrak{p}$（$IA_{\mathfrak{p}}\neq A_{\mathfrak{p}}\iff I\cap(A\setminus\mathfrak{p})=\emptyset$。\ref{ring:localization-ideals.1}）。$I$ を含む素イデアルは $I$ を含む極小素イデアル（$0$ でない素イデアルは極大なので、$I\neq 0$ を含む素イデアルはそれ以上小さくできない）で、有限個（\ref{ring:noetherian-prime-product.2}）：$\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}$。

**Step 2（存在）.** $J\defeq\prod_{i}\mathfrak{p}_{i}^{e_{i}}$（$e_{i}=v_{\mathfrak{p}_{i}}(I)$）とおく。極大イデアル $\mathfrak{m}$ について、$\mathfrak{p}_{i}\neq\mathfrak{m}$ なら $\mathfrak{p}_{i}\not\subset\mathfrak{m}$（どちらも極大）なので $\mathfrak{p}_{i}A_{\mathfrak{m}}=A_{\mathfrak{m}}$。よって $JA_{\mathfrak{m}}=(\mathfrak{m}A_{\mathfrak{m}})^{v_{\mathfrak{m}}(I)}=IA_{\mathfrak{m}}$（$\mathfrak{m}$ が $\mathfrak{p}_{i}$ のどれでもなければ両辺 $A_{\mathfrak{m}}$）。イデアルの包含は局所的に判定できる（$(I+J)/I$ と $(I+J)/J$ に \ref{ring:local-properties.1}）ので $I=J$。

**Step 3（一意性）.** $I=\prod\mathfrak{q}_{j}^{f_{j}}$ と別に書けたとすると、$\mathfrak{p}$ で局所化して $IA_{\mathfrak{p}}=(\mathfrak{p}A_{\mathfrak{p}})^{f}$（$f$ は $\mathfrak{q}_{j}=\mathfrak{p}$ の指数、なければ $0$）。DVR では極大イデアルの冪は互いに異なるので $f=v_{\mathfrak{p}}(I)$。
:::

::: corollary デデキント環のイデアルの演算 {#ring:dedekind-ideal-arithmetic keywords="divisibility of ideals is containment, gcd and lcm of ideals in a Dedekind domain" index="イデアルの割り算|いであるのわりざん"}
デデキント環で、$0$ でないイデアル $I,J$ について、$I\supset J\iff$ ある $L$ で $J=IL$（「含むは割る」）$\iff$ すべての $\mathfrak{p}$ で $v_{\mathfrak{p}}(I)\le v_{\mathfrak{p}}(J)$。また $v_{\mathfrak{p}}(I+J)=\min$, $v_{\mathfrak{p}}(I\cap J)=\max$, $v_{\mathfrak{p}}(IJ)=v_{\mathfrak{p}}(I)+v_{\mathfrak{p}}(J)$。
:::

::: proof
$I\supset J$ なら $L\defeq I^{-1}J\subset I^{-1}I=A$ はイデアルで $IL=J$。逆は明らか。指数の条件は局所化して DVR で比べる（DVR では $\mathfrak{m}^{a}\supset\mathfrak{m}^{b}\iff a\le b$）。和・共通部分・積の指数も局所化して DVR で計算し（局所化は和・有限共通部分・積と交換する）、$\mathfrak{m}^{a}+\mathfrak{m}^{b}=\mathfrak{m}^{\min}$ などから。
:::

## イデアル類群 {#ring:sec-dd-class-group}

::: definition イデアル類群 {#ring:class-group keywords="ideal class group, class number, Picard group" index="イデアル類群|いであるるいぐん, 類数|るいすう"}
デデキント環 $A$ の $0$ でない分数イデアル全体の群（\ref{ring:dedekind-invertible}）を $\mathcal{I}(A)$、単項分数イデアル $xA$（$x\in K^{\times}$）全体の部分群を $\mathcal{P}(A)$ とし、剰余群 $\operatorname{Cl}(A)\defeq\mathcal{I}(A)/\mathcal{P}(A)$ を $A$ の**イデアル類群**という。その位数を**類数**という。
:::

::: proposition 類群と PID {#ring:class-group-pid keywords="Dedekind domain is a PID iff UFD iff class group is trivial" index="類群と単項イデアル整域|るいぐんとたんこういであるせいいき"}
（AC）デデキント環 $A$ について、次は同値である：(a) $\operatorname{Cl}(A)=0$、(b) $A$ は PID、(c) $A$ は一意分解環。
:::

::: proof
**Step 1（(a)⇔(b)）.** $\operatorname{Cl}(A)=0$ は「すべての分数イデアルが単項」で、イデアルについて言えば PID。逆に PID なら、分数イデアル $I$ について $dI\subset A$ は単項 $aA$ なので $I=(a/d)A$。

**Step 2（(b)⇒(c)）.** \ref{ring:pid-ufd}。

**Step 3（(c)⇒(b)）.** $0$ でない素イデアル $\mathfrak{p}$ について、$0\neq a\in\mathfrak{p}$ の既約元分解の因子のどれか $\pi$ が $\mathfrak{p}$ に属する（$\mathfrak{p}$ は素）。$\pi$ は素元（UFD）なので $(\pi)$ は $0$ でない素イデアルで、極大なので $(\pi)=\mathfrak{p}$。すべての $0$ でないイデアルは素イデアルの積（\ref{ring:dedekind-factorization}）なので単項。
:::

::: proposition $\Z[\sqrt{-5}]$ はデデキント環 {#ring:z-sqrt-minus-5-dedekind keywords="Z[sqrt(-5)] is a Dedekind domain with nontrivial class group" index="Z[√−5] のイデアル類群|ぜっとるーとまいなすごのいであるるいぐん"}
（AC）$A=\Z[\sqrt{-5}]$ はデデキント環で、$\mathfrak{p}\defeq(2,1+\sqrt{-5})$ は単項でない素イデアルで $\mathfrak{p}^{2}=(2)$。したがって $\operatorname{Cl}(A)$ は位数 $2$ の元をもつ。
:::

::: proof
**Step 1（ネーター・次元）.** $A=\Z+\Z\sqrt{-5}$ は有限生成 $\Z$ 加群、すなわち $\Z$ 上有限で、ネーター（\ref{ring:hilbert-basis}：$\Z[x]/(x^{2}+5)$ の剰余）。$0\neq\mathfrak{q}\in\Spec A$ について $\mathfrak{q}\cap\Z\neq 0$（$0\neq\alpha\in\mathfrak{q}$ なら $N(\alpha)=\alpha\bar\alpha\in\mathfrak{q}\cap\Z$）なので $\mathfrak{q}\cap\Z=p\Z$ は極大、\ref{ring:integral-field.2} から $\mathfrak{q}$ は極大。

**Step 2（正規）.** $x=a+b\sqrt{-5}\in\Q(\sqrt{-5})$（$a,b\in\Q$）が $\Z$ 上整とする。$b\neq 0$ なら $x$ の $\Q$ 上の最小多項式は $t^{2}-2at+(a^{2}+5b^{2})$ で、ガウスの補題の帰結（\ref{ring:gauss-irreducible.1}：モニックな整数係数多項式の $\Q[t]$ でのモニックな因子は整数係数）から $2a\in\Z$, $a^{2}+5b^{2}\in\Z$。$4(a^{2}+5b^{2})=(2a)^{2}+20b^{2}$ から $20b^{2}\in\Z$ で、$b=u/v$（既約）について $v^{2}\mid 20$、$v\in\{1,2\}$。$a'=2a$, $b'=2b\in\Z$ とすると $a'^{2}+5b'^{2}\equiv 0\pmod 4$。平方数は $4$ を法として $0$ か $1$ で、$a'^{2}+5b'^{2}\equiv a'^{2}+b'^{2}$ なので $a',b'$ はともに偶数、すなわち $a,b\in\Z$。$b=0$ なら $a\in\Q$ が $\Z$ 上整で、$\Z$ は正規なので $a\in\Z$。よって $A$ は $\Z$ の $\Q(\sqrt{-5})$ での整閉包に等しく、$\Frac A=\Q(\sqrt{-5})$ の中で整閉（\ref{ring:integral-closure.3} の推移律から、$A$ 上整な元は $\Z$ 上整）。

**Step 3（$\mathfrak{p}^{2}=(2)$）.** $\mathfrak{p}^{2}=(4,\ 2+2\sqrt{-5},\ (1+\sqrt{-5})^{2})=(4,\ 2+2\sqrt{-5},\ -4+2\sqrt{-5})$。生成元はすべて $2$ の倍数で、$(2+2\sqrt{-5})-(-4+2\sqrt{-5})-4=2$ も含むので $\mathfrak{p}^{2}=(2)$。

**Step 4（素で単項でない）.** $\mathfrak{p}$ は $a\equiv b\pmod 2$ をみたす $a+b\sqrt{-5}$ 全体 $P$ に等しい：生成元 $2$, $1+\sqrt{-5}$ は $P$ に属し、$P$ は加法で閉じ $\sqrt{-5}(a+b\sqrt{-5})=-5b+a\sqrt{-5}$（$-5b\equiv b\equiv a$）も $P$ に属するのでイデアル、逆に $P$ の元は $b(1+\sqrt{-5})+(a-b)$（$a-b$ は偶数）なので $\mathfrak{p}$ に属する。よって $1\notin\mathfrak{p}$ で、$A/\mathfrak{p}$ の元は $0,1$ の類（$a+b\sqrt{-5}\equiv a-b\pmod{\mathfrak{p}}$）だけなので $A/\mathfrak{p}\cong\mathbb{F}_{2}$、$\mathfrak{p}$ は極大。単項 $(\alpha)$ なら $N(\alpha)\mid N(2)=4$ と $N(\alpha)\mid N(1+\sqrt{-5})=6$ から $N(\alpha)\in\{1,2\}$。$N=2$ の元はなく（$x^{2}+5y^{2}=2$ は解なし）、$N=1$ なら $\alpha$ は単元で $\mathfrak{p}=A$ となり矛盾。よって単項でなく、$[\mathfrak{p}]\neq 0$, $2[\mathfrak{p}]=[(2)]=0$。
:::

::: supplement
**類数の有限性.** 代数体の整数環のイデアル類群は有限群である（ミンコフスキーの凸体定理による）。$\Z[\sqrt{-5}]$ の類数は $2$ で、$\operatorname{Cl}\cong\Z/2\Z$ であることが知られている（整数論の系列で扱う）。一方、任意のアーベル群があるデデキント環のイデアル類群として現れることも知られている（クレボーン）。

**高い視点.** デデキント環の $0$ でない分数イデアルは可逆、すなわち**階数 $1$ の射影加群**であり、$\operatorname{Cl}(A)$ は階数 $1$ の射影加群の同型類が $\otimes$ でなす群 $\operatorname{Pic}(A)$ に一致する（一般の可換環でピカール群が定義される）。幾何的には、$\operatorname{Cl}$ は曲線上の因子類群、すなわち直線束の同型類の群である。
:::

## 問題 {#ring:sec-dd-problems}

::: problem {#ring:prob-p-not-unit}
$A=\Z[\sqrt{-5}]$, $\mathfrak{p}=(2,1+\sqrt{-5})$ について、$\mathfrak{p}$ の元のノルムはすべて偶数であること、また $\mathfrak{q}\defeq(3,1+\sqrt{-5})$ について $\mathfrak{p}\mathfrak{q}=(1+\sqrt{-5})$ を示せ。
:::

::: solution
**Step 1.** \ref{ring:z-sqrt-minus-5-dedekind} の Step 4 から $\mathfrak{p}$ の元は $a\equiv b\pmod 2$ をみたすので、$N=a^{2}+5b^{2}\equiv a^{2}+b^{2}\equiv 2a^{2}\equiv 0\pmod 2$。

**Step 2.** $\mathfrak{p}\mathfrak{q}=(6,\ 2+2\sqrt{-5},\ 3+3\sqrt{-5},\ (1+\sqrt{-5})^{2})$。$6=(1+\sqrt{-5})(1-\sqrt{-5})$、$(1+\sqrt{-5})^{2}$ も $1+\sqrt{-5}$ の倍数なので、すべて $(1+\sqrt{-5})$ に属する。逆に $(3+3\sqrt{-5})-(2+2\sqrt{-5})=1+\sqrt{-5}\in\mathfrak{p}\mathfrak{q}$。よって $\mathfrak{p}\mathfrak{q}=(1+\sqrt{-5})$。（$6=2\cdot 3=(1+\sqrt{-5})(1-\sqrt{-5})$ の二つの分解は、イデアルでは $\mathfrak{p}^{2}\mathfrak{q}\bar{\mathfrak{q}}$ という一つの分解にまとまる。$\bar{\mathfrak{q}}=(3,1-\sqrt{-5})$。）
:::

::: problem {#ring:prob-dedekind-semilocal-pid}
極大イデアルが有限個しかないデデキント環は PID であることを、中国剰余定理を使って示せ。
:::

::: solution
極大イデアルを $\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}$ とする。各 $i$ で $\mathfrak{p}_{i}\neq\mathfrak{p}_{i}^{2}$（DVR の局所化で比べる）なので $\pi_{i}\in\mathfrak{p}_{i}\setminus\mathfrak{p}_{i}^{2}$ をとる。中国剰余定理（\tref{ring:chinese-remainder}。$\mathfrak{p}_{i}^{2}$ はどの二つも互いに素）で $x_{i}\equiv\pi_{i}\pmod{\mathfrak{p}_{i}^{2}}$, $x_{i}\equiv 1\pmod{\mathfrak{p}_{j}}$（$j\neq i$）となる $x_{i}$ をとると、$v_{\mathfrak{p}_{i}}(x_{i}A)=1$, $v_{\mathfrak{p}_{j}}(x_{i}A)=0$ なので $x_{i}A=\mathfrak{p}_{i}$（\ref{ring:dedekind-factorization}）。すべてのイデアルは $\mathfrak{p}_{i}$ の積なので単項。
:::
