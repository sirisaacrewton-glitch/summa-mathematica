# 性質の保存表 {#ring:page-preservation-table keywords="preservation of ring properties under quotients, polynomial rings, power series rings, localization, direct products, tensor products"}

環の性質（ネーター・整域・一意分解環など）が、剰余環・多項式環・冪級数環・局所化・直積・テンソル積という基本的な構成で保たれるかどうかを一覧表にまとめる（\ref{ring:preservation-table}）。表の各欄は、保たれるなら証明への参照、保たれないなら反例への参照を付けた。参照先がない短い主張は、このページの \ref{ring:sec-pt-proofs} で証明する。証明の長い反例は次のページ（\ref{ring:page-counterexamples}）で扱う。


## 記法と定義の確認 {#ring:sec-pt-notation}

::: notation
- 表の列：剰余環 $A/I$（$I\neq A$）、多項式環 $A[x]$、形式的冪級数環 $A[[x]]$、局所化 $S^{-1}A$（$0\notin S$）、直積 $A\times B$（$A,B$ は零環でない）、テンソル積 $A\otimes_{k}B$（$A,B$ は体 $k$ 上の代数）。
- 表の行：その性質を、列の構成の材料（$A$、または $A$ と $B$）がもつとき、できた環ももつか。
- 記号：:yes: は常に保たれる、:no: は保たれない例がある、:partial: は条件付きで保たれる（備考を付ける）。「未確認」は筆者が確かめていない欄である。
- 「被約」は冪零元が $0$ だけ（\ref{ring:multiplicative-set}）。整域であることを要求する性質（PID・UFD・デデキント環など）について、直積は零環でない二つの環の直積なので整域でなく、自動的に :no: である。
:::

## 各欄の根拠 {#ring:sec-pt-reasons}

::: remark 表の番号の説明 {#ring:preservation-notes}
1. 剰余環・局所化のネーター性・アルティン性：\tref{ring:noetherian-exact.3}（アルティン環の剰余も同じ証明）。
2. ヒルベルトの基底定理 \tref{ring:hilbert-basis}。
3. \ref{ring:power-series-noetherian}。
4. 直積：\ref{ring:product-preservation}。
5. $A$ または $B$ が $k$ 上有限生成なら :yes:（\ref{ring:tensor-noetherian-fg}）。一般には :no:：$L=k(t_{1},t_{2},\dots)$ は体だが $L\otimes_{k}L$ はネーターでない（\ref{ring:tensor-not-noetherian}）。
6. $k[x]$, $k[[x]]$ は体 $k$ 上でアルティンでない：$(x)\supsetneq(x^{2})\supsetneq\cdots$。
7. \ref{ring:product-preservation.3}。
8. $k(x)\otimes_{k}k(y)$（\ref{ring:tensor-fields-not-artinian}）。
9. $\Z/4\Z$ は $\Z$（PID・UFD・デデキント環・正規など）の剰余環だが整域でも被約でもない。
10. \ref{ring:polynomial-domain.3}。
11. 整域の局所化は商体の部分環（\ref{ring:prob-localization-domain}）。体の局所化は体自身。
12. $\C\otimes_{\R}\C\cong\C\times\C$（\ref{mod:tensor-algebra-examples.3}）は整域でなく局所環でもない。
13. 多項式：\ref{ring:prob-polynomial-nilpotent}。冪級数：\ref{ring:product-preservation.4}。
14. \ref{ring:prob-localization-nilradical}。
15. $k$ が完全体（標数 $0$ など）なら :yes: であることが知られている。標数 $p$ では :no:：\ref{ring:tensor-not-reduced}。
16. 局所環 $(A,\mathfrak{m})$ の剰余環 $A/I$ の極大イデアルは $\mathfrak{m}/I$ だけ（\ref{ring:prime-preimage.2}）。体の真のイデアルは $0$ だけ。
17. $k[x]$ は極大イデアル $(x)$, $(x-1)$ をもち局所環でも体でもない。$k[[x]]$ は体でない（$x$ が非単元）。
18. \ref{ring:power-series-units.2}。
19. \ref{ring:product-preservation.5}。
20. $\Z$ は PID（ベズー整域）だが $\Z[x]$ も $\Z[[x]]$ も $(2,x)$ が単項でない（$\Z[[x]]$ では \ref{ring:product-preservation.6}）。
21. 局所化のイデアルは拡大イデアル（\ref{ring:localization-ideals.2}）で、単項（有限生成なら単項）なイデアルの拡大は単項。
22. \ref{ring:polynomial-ufd}。
23. 一意分解環 $A$ で $A[[x]]$ が一意分解環でない例がある（サミュエル。\ref{ring:samuel-power-series}、構成は未収録）。PID や正則局所環の上なら :yes:（\ref{ring:power-series-ufd}）。
24. \ref{ring:product-preservation.7}。
25. GCD 整域 $A$ について $A[x]$ と $S^{-1}A$ は GCD 整域（\ref{ring:gcd-polynomial}, \ref{ring:gcd-localization}。ガウスの補題の GCD 整域版 \ref{ring:gcd-gauss} による）。
26. $\Z$ は PID（したがってデデキント環・プリューファー整域）だが、$\Z[x]$ には素イデアルの鎖 $0\subsetneq(2)\subsetneq(2,x)$ があり、$0$ でない素イデアル $(2)$ が極大でないのでデデキント環でない。また $\Z[x]$ は UFD なので、プリューファー整域なら PID になる（\ref{ring:prufer-ufd}）が PID でない（\ref{ring:ufd-not-pid}）のでプリューファー整域でもない。$\Z[[x]]$ も同じ鎖 $0\subsetneq(2)\subsetneq(2,x)$（$\Z[[x]]/(2)\cong\mathbb{F}_{2}[[x]]$ は整域）をもち、UFD である（\ref{ring:power-series-ufd}）ので同じ議論が通る。
27. プリューファー整域の上の環（局所化を含む）はプリューファー整域（\ref{ring:prob-prufer-overring}）。
28. ネーター性（1）、正規性（31）、$0$ でない素イデアルが極大であること（\ref{ring:localization-primes} による対応）が局所化で保たれる。
29. $k[x,y]$ は正規だが、剰余環 $k[x,y]/(y^{2}-x^{3})\cong k[t^{2},t^{3}]$ は正規でない（\ref{ring:non-normal-examples.2}）。
30. $A$ が正規なら $A[x]$ も正規（\ref{ring:polynomial-integrally-closed}）。冪級数環は $A$ がネーター正規なら正規（:partial:）であることが知られている（このサイトでは未証明）。
31. \ref{ring:integral-localization.2}。
32. ネーターな GCD 整域は一意分解環（\ref{ring:gcd-accp-ufd}。ネーター環は単項イデアルの昇鎖条件をみたす）。サミュエルの例（\ref{ring:samuel-power-series}。ネーター一意分解環 $A$ で $A[[x]]$ が一意分解環でないもの）では $A[[x]]$ はネーター（\ref{ring:power-series-noetherian}）なので GCD 整域でない。この反例自体の構成はこのサイトでは扱っていない。
:::

## 短い主張の証明 {#ring:sec-pt-proofs}

::: proposition 直積・局所化などについての補足 {#ring:product-preservation keywords="ideals of a product ring, preservation under products and localization" index="直積環のイデアル|ちょくせきかんのいである"}
1. 直積 $A\times B$ のイデアルは $I\times J$（$I,J$ はそれぞれ $A,B$ のイデアル）の形のものですべてである。
2. したがって、$A,B$ がネーター（アルティン、被約）なら $A\times B$ もそうである。
3. アルティン環の局所化はアルティン環である。
4. 被約環 $A$ 上の $A[[x]]$ は被約である。
5. 局所環の局所化は局所環とは限らない。
6. $\Z[[x]]$ のイデアル $(2,x)$ は単項でない。
7. 一意分解環の局所化（$0\notin S$）は一意分解環である。
:::

::: proof
**Step 1（1）.** イデアル $L\subset A\times B$ について $I\defeq\{a : (a,b)\in L\}$, $J$ も同様とする。$(a,b)\in L$ なら $(a,0)=(1,0)(a,b)\in L$, $(0,b)\in L$。よって $L=I\times J$ で、$I,J$ はイデアル。逆に $I\times J$ はイデアル。

**Step 2（2）.** 1 から、$A\times B$ のイデアルの昇鎖（降鎖）は成分ごとの鎖の組で、両方が止まれば止まる。被約性は成分ごと。

**Step 3（3）.** $S^{-1}A$ のイデアルの降鎖は、縮約 $J\mapsto j^{-1}(J)$（包含を保つ単射。\ref{ring:localization-ideals.2}）で $A$ の降鎖に移り、それが止まれば元の鎖も止まる。

**Step 4（4）.** $0\neq f\in A[[x]]$ の最低次の係数を $a_{d}\neq 0$ とすると、$f^{n}$ の $x^{nd}$ の係数は $a_{d}^{n}\neq 0$（被約）なので $f^{n}\neq 0$。

**Step 5（5）.** 体 $k$ 上の局所環 $A=k[x,y]_{(x,y)}$ を $S=\{x^{n}\}$ で局所化する。$A_{x}$ の素イデアルは $A$ の素イデアルで $x$ を含まないものに対応し（\ref{ring:localization-primes}）、$(y)A$ と $(x-y)A$ はそのような素イデアルの拡大で、$A_{x}/(y)\cong k[x]_{(x)}[1/x]=k(x)$, $A_{x}/(x-y)\cong k(x)$ はどちらも体なので、二つの異なる極大イデアルがある。

**Step 6（6）.** $(2,x)=(f)$ とすると $f\mid 2$ から $f$ の定数項 $f_{0}$ は $2$ を割り、$f\mid x$。$f_{0}=\pm1$ なら $f$ は単元（\ref{ring:power-series-units}）で $(2,x)=\Z[[x]]$ となるが、$2g+xh$ の定数項は偶数なので $1\notin(2,x)$。$f_{0}=\pm2$ なら $x=fg$ の定数項 $0=f_{0}g_{0}$ から $g_{0}=0$、$x$ の係数 $1=f_{0}g_{1}+f_{1}g_{0}=\pm2g_{1}$ となり矛盾。

**Step 7（7）.** $A$ を一意分解環、$S$ を $0$ を含まない積閉集合とする。$A$ の素元 $p$ について、$p$ が $S$ のある元を割り切るなら $p/1$ は $S^{-1}A$ の単元、そうでなければ $(p)\cap S=\emptyset$ なので $pS^{-1}A$ は素イデアル（\ref{ring:localization-primes}）で $p/1$ は素元。$S^{-1}A$ の $0$ でも単元でもない元 $a/s$ は、$a$ の素元分解から単元と素元の積に書ける。素元の積への分解をもつ整域は一意分解環である（\ref{ring:ufd-criterion} の Step 2 の議論は「素元の積」に対してそのまま通り、既約元は素元の積の因子の一つと同伴になる）。
:::

::: proposition テンソル積についての補足 {#ring:tensor-noetherian-fg keywords="tensor product with a finitely generated algebra preserves Noetherianity" index="テンソル積とネーター性|てんそるせきとねーたーせい"}
体 $k$ 上の代数 $A,B$ で、$A$ が $k$ 上有限生成、$B$ がネーター環なら、$A\otimes_{k}B$ はネーター環である。
:::

::: proof
$A\cong k[x_{1},\dots,x_{n}]/I$ なので、\ref{mod:tensor-algebra-examples.1}・\ref[2]{mod:tensor-algebra-examples.2} と同様に $A\otimes_{k}B\cong B[x_{1},\dots,x_{n}]/IB[x_{1},\dots,x_{n}]$。\ref{ring:hilbert-basis}と剰余環（\ref{ring:noetherian-exact.3}）から。
:::

::: proposition 有理関数体のテンソル積 {#ring:tensor-fields-not-artinian keywords="k(x) tensor k(y) is not Artinian" index="体のテンソル積|たいのてんそるせき"}
体 $k$ について、$k(x)\otimes_{k}k(y)$ はアルティン環でない（体どうしのテンソル積はアルティンとは限らない）。
:::

::: proof
**Step 1.** $k[x]\otimes_{k}k[y]\cong k[x,y]$（\ref{mod:tensor-algebra-examples.1}）で、$k(x)\otimes k(y)$ はこれを $S\defeq\{f(x)g(y) : f,g\neq 0\}$ で局所化したものに同型である（局所化はスカラーの拡大で書け、$k(x)=S_{1}^{-1}k[x]$ とテンソル積は交換する：\ref{ring:module-localization.3} と \ref{mod:tensor-isomorphisms}）。

**Step 2.** $k[x,y]$ の素イデアル $(x-y)$ は $S$ と交わらない：$f(x)g(y)\in(x-y)$ なら $y$ を $x$ に代入して $f(x)g(x)=0$ で、$f=0$ か $g=0$。よって $S^{-1}k[x,y]$ には素イデアルの鎖 $0\subsetneq(x-y)$ がある。アルティン環の素イデアルはすべて極大（\ref{ring:akizuki-hopkins.1}）なので、アルティンでない。
:::

::: proposition 被約性が保たれないテンソル積 {#ring:tensor-not-reduced keywords="tensor product of reduced algebras over an imperfect field need not be reduced" index="非完全体上のテンソル積|ひかんぜんたいじょうのてんそるせき"}
$p$ を素数、$k=\mathbb{F}_{p}(t)$（有理関数体）、$L=k[u]/(u^{p}-t)$ とする。$L$ は体で（$u^{p}-t$ は $k[u]$ で既約）、$L\otimes_{k}L$ は $0$ でない冪零元 $u\otimes 1-1\otimes u$ をもつ。
:::

::: proof
**Step 1（$L$ は体）.** $u^{p}-t$ は\ref{ring:eisenstein}を $\mathbb{F}_{p}[t]$ の素元 $t$ について使うと、$\mathbb{F}_{p}(t)[u]$ で既約。よって $L$ は体（\ref{ring:prob-k-x-irreducible-maximal}）。

**Step 2（冪零元）.** $\delta\defeq u\otimes 1-1\otimes u$ について、標数 $p$ のフロベニウス（\ref{ring:char-domain.3}）から $\delta^{p}=u^{p}\otimes 1-1\otimes u^{p}=t\otimes 1-1\otimes t=0$（$t\in k$ はテンソルの両側に移せる）。

**Step 3（$\delta\neq 0$）.** $L$ は $k$ 上基底 $1,u,\dots,u^{p-1}$ をもつので、$L\otimes_{k}L$ は基底 $u^{i}\otimes u^{j}$ をもつ（\ref{mod:tensor-isomorphisms.5}）。$\delta=u\otimes 1-1\otimes u$ は基底の元 $u\otimes 1$ と $1\otimes u$ の一次結合で係数が $0$ でないので $\delta\neq 0$。
:::
