# 保存の反例集 {#ring:page-counterexamples keywords="counterexamples in commutative algebra, tensor product of Noetherian rings not Noetherian, subring of Noetherian ring not Noetherian, Z[x] is not Bezout, quotient of UFD not UFD"}

性質の保存表（\ref{ring:preservation-table}）で「保たれない」とした欄のうち、証明に少し手間のかかる反例と、表の列にない構成（部分環・整閉包など）についての反例をまとめる。各反例は「何が保たれないか」「どの環で」「なぜ」の順に述べる。証明の長い有名な反例（ナガタの例など）は事実として紹介し、出典を付ける。

> 資料によらず書いた。事実として引用するものは、出典として確実に知っている文献名だけを挙げる。

## 記法と定義の確認 {#ring:sec-ce-notation}

::: notation
- 環は可換。ネーター環（\ref{ring:noetherian-artinian-def}）、一意分解環（\ref{ring:ufd}）、ベズー整域（\ref{ring:bezout-domain}）、正規環（\ref{ring:normal-domain}）、代数のテンソル積と余積の普遍性（\ref{mod:tensor-algebras}）、商体の普遍性（\ref{ring:fraction-field}）を使う。
- 体 $k$ と集合 $X$ について、$k[X]$ は $X$ の元を変数とする多項式環（各元は有限個の変数の多項式）、$k(X)$ はその商体。$X$ の元は $k$ 上**代数的に独立**：$k[X]$ の中で異なる単項式は一次独立。
- 選択公理は使わない。
:::

## ネーター性 {#ring:sec-ce-noetherian}

::: counterexample ネーター環のテンソル積がネーターでない例 {#ring:tensor-not-noetherian keywords="L tensor_k L for L = k(t_1, t_2, ...) is not Noetherian" index="ネーターでないテンソル積|ねーたーでないてんそるせき"}
$L\defeq k(t_{1},t_{2},\dots)$（可算無限個の変数の有理関数体）は体なのでネーター環だが、$L\otimes_{k}L$ はネーター環でない。
:::

::: proof
**Step 1（イデアルの鎖）.** $\delta_{i}\defeq t_{i}\otimes 1-1\otimes t_{i}\in L\otimes_{k}L$ とし、$I_{n}\defeq(\delta_{1},\dots,\delta_{n})$ とおく。$I_{1}\subset I_{2}\subset\cdots$。$\delta_{n+1}\notin I_{n}$ を示せば、真の昇鎖なのでネーターでない。

**Step 2（体への準同型）.** $n$ を固定する。新しい変数 $u_{n+1},u_{n+2},\dots$ を加えた体 $M\defeq k(t_{1},t_{2},\dots,u_{n+1},u_{n+2},\dots)$ を考える。多項式環の準同型 $\sigma_{0}:k[t_{1},t_{2},\dots]\to k[t_{1},t_{2},\dots,u_{n+1},\dots]$ を $t_{i}\mapsto t_{i}$（$i\le n$）、$t_{i}\mapsto u_{i}$（$i>n$）で定める（多項式環の普遍性。\ref{ring:multivariate-universal} を有限個の変数ごとに使う）。$\sigma_{0}$ は変数を相異なる変数に移すので、異なる単項式を異なる単項式に移し、単射である。商体の普遍性（\ref{ring:fraction-field} の 2）から単射 $\sigma:L\to M$ に延びる。

**Step 3（$\delta_{n+1}$ を消さない準同型）.** 余積の普遍性（\ref{mod:tensor-algebras} の 2）から、$\varphi:L\otimes_{k}L\to M$, $a\otimes b\mapsto a\,\sigma(b)$ は $k$ 代数の準同型。$i\le n$ なら $\varphi(\delta_{i})=t_{i}-\sigma(t_{i})=0$ なので $I_{n}\subset\Ker\varphi$。一方 $\varphi(\delta_{n+1})=t_{n+1}-u_{n+1}\neq 0$。よって $\delta_{n+1}\notin I_{n}$。

::: hypcheck
- **無限個の変数**：Step 1 の鎖を無限に続けるのに使った。$L$ が $k$ 上有限生成な体（例えば $k(t_{1},\dots,t_{m})$）なら、$L\otimes_{k}L$ は $k[t,s]$ の局所化でネーター（\ref{ring:tensor-noetherian-fg} と局所化）。
- 同様の現象として、$\bar{\Q}\otimes_{\Q}\bar{\Q}$（代数閉包どうし）は無限個の冪等元をもちネーターでないことが知られている。
:::
:::

::: counterexample ネーター環の部分環がネーターでない例 {#ring:subring-not-noetherian keywords="a subring of a Noetherian ring need not be Noetherian" index="ネーターでない部分環|ねーたーでないぶぶんかん"}
$k[t_{1},t_{2},\dots]$ はネーター環（体）$k(t_{1},t_{2},\dots)$ の部分環だが、ネーターでない：$(t_{1})\subsetneq(t_{1},t_{2})\subsetneq\cdots$。有限生成の例もある：$k[x,xy,xy^{2},xy^{3},\dots]\subset k[x,y]$ はネーターでない。
:::

::: proof
**Step 1（無限変数）.** $t_{n+1}\notin(t_{1},\dots,t_{n})$：$t_{i}\mapsto 0$（$i\le n$）、$t_{i}\mapsto t_{i}$（$i>n$）で定まる準同型は $(t_{1},\dots,t_{n})$ を $0$ に送り、$t_{n+1}$ を $0$ でない元に送る。

**Step 2（$A=k[x,xy,xy^{2},\dots]$）.** $A$ は $k[x,y]$ の単項式 $x^{a}y^{b}$ のうち「$a\ge 1$ または $b=0$」のもので張られる部分空間である（生成元の積はこの形で、逆にこの形の単項式は $x^{a-1}\cdot xy^{b}$）。イデアル $J_{n}\defeq(x,xy,\dots,xy^{n})A$ について、$xy^{n+1}\notin J_{n}$ を示す。$xy^{n+1}=\sum_{i\le n}xy^{i}f_{i}$（$f_{i}\in A$）と書けたとすると、$y^{n+1}=\sum_{i\le n}y^{i}f_{i}$。右辺の $y^{n+1}$ の係数は、$f_{i}$ の単項式 $y^{n+1-i}$（$x$ を含まない、$b\ge 1$）の係数からしか来ないが、そのような単項式は $A$ に属さない（$a=0$, $b\ge 1$）。よって係数は $0$ で矛盾。
:::

::: fact 整閉包・次元についての反例（ナガタ） {#ring:nagata-examples keywords="Nagata's examples: Noetherian domain with non-Noetherian integral closure, Noetherian ring of infinite Krull dimension" index="ナガタの例|ながたのれい"}
1. ネーター整域で、正規化（商体の中での整閉包）がネーターでない例がある（永田雅宜）。
2. クルル次元が無限大のネーター環がある（永田雅宜）。一方、ネーター局所環の次元は有限である（\ref[次元論]{ring:page-dimension-theory}）。

出典：永田雅宜 *Local Rings*（Interscience, 1962）の付録の例。
:::

## 一意分解性とベズー性 {#ring:sec-ce-ufd}

::: counterexample 一意分解環の剰余環・部分環 {#ring:ufd-quotient-subring keywords="quotient of a UFD need not be a UFD, subring of a UFD need not be a UFD" index="一意分解でない剰余環|いちいぶんかいでないじょうよかん"}
1. $\Z[x]$ は一意分解環だが、剰余環 $\Z[x]/(x^{2}+5)\cong\Z[\sqrt{-5}]$ は一意分解環でない。
2. $\Z[i]$ は一意分解環（ユークリッド環）だが、部分環 $\Z[2i]$ は正規でなく、したがって一意分解環でない。
:::

::: proof
**Step 1（1）.** 代入 $\Z[x]\to\Z[\sqrt{-5}]$, $x\mapsto\sqrt{-5}$ は全射で、核は $(x^{2}+5)$（モニックな $x^{2}+5$ で割った余り $c+dx$ が $c+d\sqrt{-5}=0$ なら $c=d=0$。\ref{ring:polynomial-quotients} と同じ議論）。$\Z[\sqrt{-5}]$ が UFD でないことは \ref{ring:non-ufd-example}。

**Step 2（2）.** $i=\frac{2i}{2}\in\Frac\Z[2i]$ は $x^{2}+1$ の根で $\Z[2i]$ に属さない。一意分解環は正規（\ref{ring:ufd-normal}）。
:::

::: counterexample ベズー性は多項式環で保たれない {#ring:bezout-polynomial-fails keywords="Z[x] is not a Bezout domain, A[x] Bezout iff A is a field" index="ベズーでない多項式環|べずーでないたこうしきかん"}
$\Z$ はベズー整域（PID）だが $\Z[x]$ はベズー整域でない。より一般に、整域 $A$ について $A[x]$ がベズー整域であることと $A$ が体であることは同値である。
:::

::: proof
**Step 1（$\Z[x]$）.** $(2,x)$ は単項でない（\ref{ring:ufd-not-pid}）。$\gcd(2,x)=1$（UFD で共通の既約因子がない）だが $1\notin(2,x)$ で、ベズーの等式が成り立たない（\ref{ring:bezout-characterization}）。

**Step 2（一般の $A$）.** $A$ が体なら $A[x]$ はユークリッド環で PID。$A$ が体でないなら、$0\neq a\in A$ を非単元とし、$(a,x)=(f)$ と仮定する。$f\mid a$ から $\deg f=0$、$f\in A$。$f\mid x$ から $x=fg$ で $x$ の係数を比べて $f$ は単元。よって $(a,x)=A[x]$ で、$1=ag+xh$ の定数項から $1=ag(0)$、$a$ が単元となり矛盾。
:::

::: fact 冪級数環は一意分解性を保たない（サミュエル） {#ring:samuel-power-series keywords="Samuel's example: UFD A with A[[x]] not a UFD" index="サミュエルの例|さみゅえるのれい"}
一意分解環 $A$ で、$A[[x]]$ が一意分解環でないものが存在する。一方、$A$ が PID や正則局所環なら $A[[x]]$ は一意分解環である。出典：P. Samuel, "On unique factorization domains", *Illinois J. Math.* 5 (1961)。
:::

## その他の構成 {#ring:sec-ce-others}

::: counterexample 局所化は「逆向きに」性質を戻さない {#ring:local-not-global keywords="all localizations are PIDs but the ring is not, locally free not free" index="局所的に PID|きょくしょてきにぴーあいでぃー"}
$\Z[\sqrt{-5}]$ はすべての極大イデアルでの局所化が DVR（したがって PID・UFD）だが、自身は PID でも UFD でもない（\ref{ring:dedekind-local}, \ref{ring:z-sqrt-minus-5-dedekind}）。「PID である」「UFD である」は局所的性質ではない。対照的に「正規」「被約」は局所的性質である（\ref{ring:integral-localization}, \ref{ring:prob-localization-nilradical}）。
:::

::: counterexample 直積と局所性・整域性 {#ring:product-counterexamples keywords="product of local rings is not local, product of domains is not a domain" index="直積の反例|ちょくせきのはんれい"}
零環でない $A,B$ について $A\times B$ は $(1,0)(0,1)=0$ なので整域でなく、極大イデアル $\mathfrak{m}\times B$ と $A\times\mathfrak{n}$ をもつので局所環でない（\ref{ring:prob-primes-of-product}）。一方、ネーター・アルティン・被約は保たれる（\ref{ring:product-preservation}）。
:::

::: supplement
**反例を探すときの指針.** 本ページの反例の多くは、(1) 変数を無限個にする（ネーター性を壊す）、(2) 二次の整数環で整数論的な障害を作る（一意分解性・単項性を壊す）、(3) 体の非分離性・非代数閉性を使う（テンソル積で被約性・整域性を壊す）、(4) 有理数の値群を使う（離散性を壊す）、の四つの方法で作られている。新しい主張の反例を探すときも、まずこれらを試すとよい。
:::
