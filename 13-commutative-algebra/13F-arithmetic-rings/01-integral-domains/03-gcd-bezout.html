# GCD 整域とベズー整域 {#ring:page-gcd-bezout keywords="GCD domain, Bezout domain, Euclid's lemma in GCD domains, ascending chain condition on principal ideals, ACCP, atomic domain, Bezout domain that is not a UFD"}

一意分解環では任意の二元に最大公約元がある（\ref{ring:ufd-gcd}）。逆に「最大公約元が常に存在する」だけを要求した整域が **GCD 整域**（\ref{ring:gcd-domain}）であり、さらに最大公約元がベズーの等式 $d=ax+by$ で書ける整域が**ベズー整域**（\ref{ring:bezout-domain}）である。このページでは包含関係
$$
\text{PID}\subset\text{ベズー整域}\subset\text{GCD 整域}\supset\text{UFD}
$$
とその真偽を調べ、**GCD 整域 ＋ 単項イデアルの昇鎖条件 ＝ UFD**（\ref{ring:gcd-accp-ufd}）、**ベズー整域 ＋ 単項イデアルの昇鎖条件 ＝ PID**（\ref{ring:bezout-accp-pid}）を示す。一意分解環でないベズー整域の例として、値が有理数の「冪」をもつ環を初等的に構成する（\ref{ring:rational-exponent-ring}）。

> 資料によらず書いた。構成 \ref{ring:rational-exponent-ring} は付値環の標準的な例を、付値の一般論なしで直接確かめる形にした。

## 記法と定義の確認 {#ring:sec-gb-notation}

::: notation
- 環は可換。整域・単元・同伴・既約元・素元・一意分解環・PID・最大公約元は \ref{ring:page-euclid-pid-ufd} のもの。最大公約元は同伴を除いて定まり、$\gcd(a,b)$ と書く。
- **単項イデアルの昇鎖条件**（ACCP）：単項イデアルの昇鎖 $(a_{1})\subset(a_{2})\subset\cdots$ はある番号から先で一定。PID はこれをみたす（\ref{ring:pid-basic} の 3）。$0$ でも単元でもない元が既約元の有限積に書ける整域を**原子的**という。
- **選択公理**：ACCP から原子性・有限生成性を導くところで従属選択公理を使う。
:::

## GCD 整域 {#ring:sec-gb-gcd}

::: definition GCD 整域 {#ring:gcd-domain keywords="GCD domain, greatest common divisor, least common multiple" index="GCD 整域|じーしーでぃーせいいき, 最大公約元|さいだいこうやくげん"}
整域 $A$ の任意の二元 $a,b$ が最大公約元（$d\mid a$, $d\mid b$ で、$c\mid a,b\Rightarrow c\mid d$ となる $d$）をもつとき、$A$ を **GCD 整域**という。
:::

::: proposition GCD 整域の性質 {#ring:gcd-properties keywords="gcd(ac,bc) = c gcd(a,b), Euclid's lemma in a GCD domain, irreducible elements are prime in a GCD domain, GCD domains are integrally closed" index="GCD 整域の性質|じーしーでぃーせいいきのせいしつ"}
$A$ を GCD 整域とする。
1. $c\in A$ について $\gcd(ac,bc)=c\gcd(a,b)$。
2. （ユークリッドの補題）$\gcd(a,b)=1$ かつ $a\mid bc$ なら $a\mid c$。
3. 既約元は素元である。
4. $A$ は正規環（整閉整域）である。
:::

::: proof
**Step 1（1）.** $c=0$ なら両辺 $0$。$c\neq 0$ とし、$d=\gcd(a,b)$, $e=\gcd(ac,bc)$ とする。$cd\mid ac$, $cd\mid bc$ なので $cd\mid e$：$e=cdu$。$e\mid ac$ から $cdu\mid ac$、簡約して $du\mid a$。同様に $du\mid b$。よって $du\mid d$ で、$d\neq 0$ なら $u$ は単元（$d=0$ なら $a=b=0$ で $e=0$）。

**Step 2（2）.** 1 から $\gcd(ac,bc)=c\gcd(a,b)=c$。$a\mid ac$ と $a\mid bc$ から $a\mid\gcd(ac,bc)=c$。

**Step 3（3）.** 既約元 $p$ が $p\mid ab$, $p\nmid a$ とする。$\gcd(p,a)$ は $p$ の約元なので単元か $p$ の同伴（既約性）で、後者なら $p\mid a$ となるので単元。2 から $p\mid b$。

**Step 4（4）.** 商体の元 $r/s$ を $\gcd(r,s)=1$ にとれる（$d=\gcd(r,s)$ で割る。1 から $\gcd(r/d,s/d)=1$）。$r/s$ がモニックな $A$ 係数多項式の根なら、有理根定理と同じ計算（\ref{ring:rational-root}）で $s\mid r^{n}$。$\gcd(s,r)=1$ から 2 を繰り返して $\gcd(s,r^{n})=1$ なので、$s$ は単元で $r/s\in A$。
:::

::: theorem GCD 整域と一意分解環 {#ring:gcd-accp-ufd keywords="a domain is a UFD iff it is a GCD domain with ACCP" index="GCD 整域と一意分解環|じーしーでぃーせいいきといちいぶんかいかん"}
（DC）整域 $A$ について、$A$ が一意分解環であることと、$A$ が GCD 整域で ACCP をみたすことは同値である。
:::

::: proof
**Step 1（⇒）.** GCD 整域であることは \ref{ring:ufd-gcd}。ACCP：$(a_{1})\subsetneq(a_{2})$ なら $a_{2}$ は $a_{1}$ の真の約元で、既約因子の個数 $\ell$（\ref{mod:page-pid-modules} の記法）について $\ell(a_{2})<\ell(a_{1})$。$\ell$ は非負整数なので真の昇鎖は有限で止まる（$a_{1}=0$ の場合は $(a_{2})\neq 0$ から始めればよい）。

**Step 2（⇐）.** ACCP から原子性が従う：既約元の積に書けない元 $a$ があれば、$a=bc$ で $b,c$ の一方も書けず真の約元であり、これを繰り返して（DC）単項イデアルの真の昇鎖ができ、ACCP に反する（\ref{ring:pid-ufd} の Step 1 と同じ）。既約元は素元（\ref{ring:gcd-properties} の 3）なので、\ref{ring:ufd-criterion} から一意分解環。
:::

## GCD 整域の多項式環と局所化 {#ring:sec-gb-gauss}

::: lemma 有限個の元の最大公約元 {#ring:gcd-finite keywords="gcd of finitely many elements in a GCD domain, gcd(c a_1,...,c a_n) = c gcd(a_1,...,a_n)" index="有限個の最大公約元|ゆうげんこのさいだいこうやくげん"}
$A$ を GCD 整域とする。有限個の元 $a_{1},\dots,a_{n}$ は最大公約元 $\gcd(a_{1},\dots,a_{n})$（同伴を除いて一意）をもち、$c\in A$ について $\gcd(ca_{1},\dots,ca_{n})=c\gcd(a_{1},\dots,a_{n})$。
:::

::: proof
$\gcd(a_{1},\dots,a_{n})\defeq\gcd(\gcd(a_{1},\dots,a_{n-1}),a_{n})$ と帰納的に定めると、公約元であり、すべての公約元に割り切られる。後半は \ref{ring:gcd-properties} の 1 を帰納的に使う。
:::

::: definition 内容・原始多項式（GCD 整域） {#ring:gcd-content keywords="content of a polynomial over a GCD domain, primitive polynomial" index="内容（GCD 整域）|ないようじーしーでぃーせいいき"}
GCD 整域 $A$ 上の $0$ でない $f\in A[x]$ について、係数の最大公約元を $f$ の**内容** $c(f)$ といい（同伴を除いて定まる）、$c(f)$ が単元のとき $f$ を**原始的**という。$f=c(f)f_{0}$ と書くと $f_{0}$ は原始的（\ref{ring:gcd-finite}）。
:::

::: lemma マッコイの補題 {#ring:mccoy keywords="McCoy's theorem: a zero divisor in R[x] is annihilated by a nonzero constant" index="マッコイの補題|まっこいのほだい"}
$R$ を可換環、$f\in R[x]$ とする。$0$ でない $g\in R[x]$ で $fg=0$ となるものがあれば、$0$ でない $c\in R$ で $cf=0$ となるものがある。
:::

::: proof
$fg=0$, $g\neq 0$ となる $g$ のうち次数 $n$ が最小のものをとり、$g=\sum_{j\le n}b_{j}x^{j}$, $f=\sum_{i}a_{i}x^{i}$ とする。

**Step 1.** すべての $i$ で $a_{i}g=0$ なら、$a_{i}b_{n}=0$ なので $c=b_{n}$ でよい。

**Step 2.** そうでないとき、$a_{i}g\neq 0$ となる最大の $i$ をとる。$j>i$ では $a_{j}g=0$。$fg=0$ の $x^{i+n}$ の係数は $a_{i}b_{n}+\sum_{j>i}a_{j}b_{i+n-j}=0$ で、和の項は $a_{j}g=0$ から $0$ なので $a_{i}b_{n}=0$。よって $a_{i}g$ は次数 $<n$ で $0$ でなく、$f(a_{i}g)=a_{i}(fg)=0$。最小性に反する。
:::

::: theorem ガウスの補題（GCD 整域） {#ring:gcd-gauss keywords="Gauss lemma for GCD domains: product of primitive polynomials is primitive, c(fg) = c(f)c(g)" index="ガウスの補題（GCD 整域）|がうすのほだいじーしーでぃーせいいき"}
$A$ を GCD 整域とする。原始多項式の積は原始的で、$0$ でない $f,g\in A[x]$ について $c(fg)=c(f)c(g)$（同伴を除いて）。
:::

::: proof
**Step 1（原始多項式の積）.** $f,g$ を原始的とし、$d\in A$ が $fg$ のすべての係数を割り切るとする。$\bar R\defeq A/dA$ で $\bar f\bar g=0$。$\bar g\neq 0$ なら、マッコイの補題（\ref{ring:mccoy}）から $c\notin dA$ で $\bar c\bar f=0$、すなわち $d\mid ca_{i}$（すべての $i$）となるものがある。すると $d\mid\gcd(ca_{i})=c\,c(f)=c$（\ref{ring:gcd-finite}）で $c\in dA$、矛盾。よって $\bar g=0$、$d$ は $g$ の係数すべてを割り切り、$d\mid c(g)=1$。$d$ は単元で、$fg$ は原始的。

**Step 2（一般）.** $f=c(f)f_{0}$, $g=c(g)g_{0}$ と書くと $fg=c(f)c(g)f_{0}g_{0}$ で、\ref{ring:gcd-finite} から $c(fg)=c(f)c(g)c(f_{0}g_{0})=c(f)c(g)$。
:::

::: lemma 原始多項式による割り算 {#ring:gcd-primitive-divides keywords="if a primitive polynomial divides F in K[x] it divides F in A[x]" index="原始多項式による割り算|げんしたこうしきによるわりざん"}
$A$ を GCD 整域、$K=\Frac A$ とする。原始多項式 $h\in A[x]$ が $F\in A[x]$ を $K[x]$ で割り切るなら、$A[x]$ で割り切る。
:::

::: proof
$F=hq$, $q\in K[x]$ とする（$F\neq 0$ としてよい）。係数の分母を払い内容をくくり出すと $q=\frac{a}{b}q_{0}$（$q_{0}\in A[x]$ 原始的、$a,b\in A$, $\gcd(a,b)=1$。\ref{ring:gcd-properties} の Step 4 のように既約分数にする）。$bF=a\,hq_{0}$ の内容をとると、ガウスの補題から $b\,c(F)=a$（同伴を除いて）。よって $b\mid a$ で、$\gcd(a,b)=1$ から $b$ は単元。$q=ab^{-1}q_{0}\in A[x]$。
:::

::: theorem GCD 整域の多項式環 {#ring:gcd-polynomial keywords="A GCD domain implies A[x] GCD domain" index="GCD 整域の多項式環|じーしーでぃーせいいきのたこうしきかん"}
$A$ が GCD 整域なら $A[x]$ も GCD 整域。$0$ でない $f,g$ について、$K[x]$ での最大公約元を原始的にとったもの $h\in A[x]$ を用いて $\gcd(f,g)=\gcd(c(f),c(g))\cdot h$。
:::

::: proof
**Step 1（$h$ の取り方）.** $f=c(f)f_{0}$, $g=c(g)g_{0}$ とし、$K[x]$（PID）での $\gcd(f_{0},g_{0})$ の分母を払い内容で割ったものを $h$（原始的）とする。$D\defeq\gcd(c(f),c(g))h$。

**Step 2（公約元）.** $h\mid f_{0}$ は $K[x]$ で成り立つので、\ref{ring:gcd-primitive-divides} から $A[x]$ でも。よって $D\mid c(f)f_{0}=f$、同様に $D\mid g$。

**Step 3（最大）.** $e\in A[x]$ が $f,g$ を割り切るとし、$e=c(e)e_{0}$ とする。$f=eq$ から $c(f)=c(e)c(q)$（ガウスの補題）なので $c(e)\mid c(f)$、同様に $c(e)\mid c(g)$、$c(e)\mid\gcd(c(f),c(g))$。$K[x]$ で $e_{0}\mid f_{0}$, $e_{0}\mid g_{0}$ なので $e_{0}\mid h$（$K[x]$）、\ref{ring:gcd-primitive-divides} から $A[x]$ でも。よって $e=c(e)e_{0}\mid D$。
:::

::: theorem GCD 整域の局所化 {#ring:gcd-localization keywords="localization of a GCD domain is a GCD domain" index="GCD 整域の局所化|じーしーでぃーせいいきのきょくしょか"}
$A$ が GCD 整域なら、積閉集合 $S\not\ni 0$ について $S^{-1}A$ も GCD 整域。
:::

::: proof
**Step 1（最小公倍元から最大公約元）.** 整域 $B$ の $0$ でない $a,b$ について、$aB\cap bB=mB$ となる $m$（最小公倍元）があれば、$ab=md$ となる $d$ は最大公約元：$a\mid m$ から $m=aa'$、$ab=aa'd$ で $b=a'd$、同様に $a=b'd$。$e\mid a$, $e\mid b$ なら $ab/e$ は $a$ と $b$ の公倍元（$a\cdot(b/e)$, $b\cdot(a/e)$）なので $m\mid ab/e$：$ab=e\,m\,u$、$md=emu$ から $d=eu$。

**Step 2（$A$ の最小公倍元）.** $A$ では $\operatorname{lcm}(a,b)=ab/\gcd(a,b)$ が最小公倍元（\ref{ring:prob-gcd-lcm}）で、$aA\cap bA=\operatorname{lcm}(a,b)A$。

**Step 3（局所化）.** $S^{-1}A$ の $0$ でない元は単元倍を除いて $a/1$（$a\in A$）なので、$a,b\in A$ について考えればよい。局所化は共通部分と可換（\ref{ring:localization-operations} の 1）なので、$aS^{-1}A\cap bS^{-1}A=S^{-1}(aA\cap bA)=\operatorname{lcm}(a,b)S^{-1}A$。Step 1 から最大公約元がある。
:::

## ベズー整域 {#ring:sec-gb-bezout}

::: definition ベズー整域 {#ring:bezout-domain keywords="Bezout domain, every finitely generated ideal is principal" index="ベズー整域|べずーせいいき"}
有限生成イデアルがすべて単項イデアルである整域を**ベズー整域**という。帰納法により、任意の二元で生成されるイデアル $(a,b)$ が単項であることと同値（$(a_{1},\dots,a_{n})=((a_{1},\dots,a_{n-1}),a_{n})$）。
:::

::: proposition ベズー整域の特徴付け {#ring:bezout-characterization keywords="Bezout iff GCD domain with gcd in the ideal, PID is Bezout, Bezout is GCD" index="ベズー整域の特徴付け|べずーせいいきのとくちょうづけ"}
整域 $A$ について、次は同値である。
1. $A$ はベズー整域。
2. $A$ は GCD 整域で、任意の $a,b$ について $\gcd(a,b)\in(a,b)$（ベズーの等式）。

特に PID はベズー整域、ベズー整域は GCD 整域である。
:::

::: proof
**Step 1（1⇒2）.** $(a,b)=(d)$ なら、$d\mid a,b$ で、$c\mid a,b$ なら $c\mid ax+by=d$。よって $d=\gcd(a,b)\in(a,b)$。

**Step 2（2⇒1）.** $d=\gcd(a,b)=ax+by\in(a,b)$ なので $(d)\subset(a,b)$、$d\mid a,b$ なので $(a,b)\subset(d)$。
:::

::: theorem ベズー整域と PID {#ring:bezout-accp-pid keywords="a Bezout domain with ACCP is a PID, Noetherian Bezout domain is a PID" index="ベズー整域と単項イデアル整域|べずーせいいきとたんこういであるせいいき"}
（DC）ベズー整域 $A$ について、次は同値である：(a) $A$ は PID、(b) $A$ はネーター環、(c) $A$ は ACCP をみたす、(d) $A$ は一意分解環。
:::

::: proof
**Step 1.** (a)⇒(b)：イデアルが有限生成（\ref{ring:noetherian-module}）。(b)⇒(c)：昇鎖条件の特別な場合。

**Step 2（(c)⇒(a)）.** 単項でないイデアル $I$ があるとする。$I$ の有限生成部分イデアルは単項。$a_{1}\in I$ をとり、$(a_{1})\neq I$ なので $b\in I\setminus(a_{1})$ をとって $(a_{2})\defeq(a_{1},b)\supsetneq(a_{1})$。これを繰り返して（DC）単項イデアルの真の昇鎖ができ、ACCP に反する。

**Step 3（(c)⇔(d)）.** ベズー整域は GCD 整域なので、\ref{ring:gcd-accp-ufd} から。
:::

## 包含が真であること {#ring:sec-gb-examples}

::: example GCD 整域だがベズー整域でない例
$\Z[x]$ と $K[x,y]$（$K$ は体）は一意分解環（\ref{ring:polynomial-ufd}）なので GCD 整域だが、$(2,x)$, $(x,y)$ は単項でない（\ref{ring:ufd-not-pid}）のでベズー整域でない。$\gcd(2,x)=1$ だが $1\notin(2,x)$ で、ベズーの等式が成り立たない。
:::

::: construction 有理数冪の環 {#ring:rational-exponent-ring keywords="Bezout domain that is not a UFD, valuation ring with value group Q, monoid ring K[t^{Q>=0}]" index="有理数冪の環|ゆうりすうべきのかん"}
体 $K$ について、$R\defeq K[t^{q} : q\in\Q_{\ge 0}]$ を、有限和 $\sum_{q}a_{q}t^{q}$（$q\in\Q_{\ge 0}$, $a_{q}\in K$）全体に $t^{q}t^{r}\defeq t^{q+r}$ で積を入れた環（$\Q_{\ge 0}$ の**モノイド環**）とする。$0$ でない $f$ について、$a_{q}\neq 0$ となる最小の $q$ を $\operatorname{ord}f$、$a_{\operatorname{ord}f}$ を $f$ の**初項係数**とする。$\mathfrak{m}\defeq\{f : f=0\text{ または }\operatorname{ord}f>0\}$（定数項が $0$ の元全体）とし、$V\defeq R_{\mathfrak{m}}$ とおく。
:::

::: proposition 有理数冪の環の性質 {#ring:rational-exponent-properties keywords="properties of K[t^Q]_m: Bezout, not Noetherian, no irreducible elements" index="既約元のない整域|きやくげんのないせいいき"}
上の $R$, $\mathfrak{m}$, $V$ について、
1. $R$ は整域で、$\operatorname{ord}(fg)=\operatorname{ord}f+\operatorname{ord}g$。$\mathfrak{m}$ は素イデアル。
2. $V$ の $0$ でない元はすべて、$q\in\Q_{\ge 0}$ と単元 $u\in V^{\times}$ によって $t^{q}u$ とただ一通りに書ける（$q=\operatorname{ord}$）。$V$ の商体の $0$ でない元は $t^{q}u$（$q\in\Q$）と書ける。
3. $t^{q}u\mid t^{r}v$（$u,v$ 単元）$\iff q\le r$。したがって $V$ の任意の二元は一方が他方を割り切り、$V$ はベズー整域である。
4. $V$ は既約元をもたず、ACCP をみたさない。したがって $V$ はベズー整域だが一意分解環でもネーター環でもない。
:::

::: proof
**Step 1（1）.** $f,g\neq 0$ の積の最小の指数の項は、それぞれの初項の積 $a b\,t^{\operatorname{ord}f+\operatorname{ord}g}$ だけから来る（他の組 $q+r$ は真に大きい）。$ab\neq 0$ なので $fg\neq 0$ で、ord は加法的。$\mathfrak{m}$ は定数項をとる準同型 $R\to K$ の核なので、$R/\mathfrak{m}\cong K$ は体で $\mathfrak{m}$ は極大（素）。

**Step 2（2）.** $0\neq f\in R$ は $f=t^{\operatorname{ord}f}f_{1}$（$f_{1}$ の定数項は初項係数 $\neq 0$）と書け、$f_{1}\notin\mathfrak{m}$ なので $V$ で単元。$V$ の元 $f/s$（$s\notin\mathfrak{m}$）は $t^{\operatorname{ord}f}(f_{1}/s)$。商体の元 $f/g=t^{\operatorname{ord}f-\operatorname{ord}g}(f_{1}/g_{1})$。一意性：$t^{q}u=t^{r}v$ で $q<r$ なら $u=t^{r-q}v\in\mathfrak{m}V$（$V$ の極大イデアル）となり単元でないので矛盾。

**Step 3（3）.** $q\le r$ なら $t^{r}v=t^{q}u\cdot t^{r-q}vu^{-1}$。$q>r$ なら $t^{q}u\mid t^{r}v$ とすると $t^{r}v=t^{q}uw$, $w=t^{s}w'$ で $r=q+s\ge q$ となり矛盾。任意の二元 $a,b$ は一方が他方を割り切るので $(a,b)$ は $(a)$ か $(b)$、すなわち単項。

**Step 4（4）.** 単元でない $0\neq t^{q}u$（$q>0$）は $t^{q/2}\cdot t^{q/2}u$ と二つの非単元の積なので既約でない。$(t)\subsetneq(t^{1/2})\subsetneq(t^{1/4})\subsetneq\cdots$ は真の昇鎖（3 から）。一意分解環なら原子的なので、既約元のない $V$（体でない）は一意分解環でない。ネーター環なら ACCP をみたすので、ネーター環でもない。

::: hypcheck
- Step 2 で $V$ の極大イデアルが $\mathfrak{m}V$ であること（\ref{ring:localization-at-prime} の 1）を使った。選択公理は使わない。
:::
:::

::: supplement
**付値環.** $V$ は「商体の任意の元 $x\neq 0$ について $x\in V$ か $x^{-1}\in V$」をみたす（2 から、$q\ge 0$ なら $t^{q}u\in V$、$q<0$ なら逆元が $V$ に属する）。この性質をもつ整域を**付値環**といい、$V$ は値群が $\Q$ の付値環である（\ref{ring:page-valuation-rings}）。付値環はベズー整域であり、ネーターな付値環はちょうど離散付値環（PID）である。

**包含のまとめ.** PID $\subsetneq$ ベズー整域（例 $V$）、ベズー整域 $\subsetneq$ GCD 整域（例 $\Z[x]$）、UFD $\subsetneq$ GCD 整域（例 $V$）、UFD と ベズー整域は互いに含まない（$\Z[x]$ と $V$）、UFD $\cap$ ベズー整域 $=$ PID（\ref{ring:bezout-accp-pid}）。GCD 整域は正規（\ref{ring:gcd-properties} の 4）で、正規でも GCD 整域でない例は $\Z[\sqrt{-5}]$（二次体 $\Q(\sqrt{-5})$ の整数環なので正規だが（整数論の系列で示す）、$\gcd(2,1+\sqrt{-5})$ は存在する一方、$6$ と $2+2\sqrt{-5}$ の最大公約元が存在しないことが確かめられる）。
:::

## 問題 {#ring:sec-gb-problems}

::: problem {#ring:prob-gcd-lcm}
GCD 整域で、$0$ でない $a,b$ について $\operatorname{lcm}(a,b)\defeq ab/\gcd(a,b)$ が最小公倍元（$a,b$ の公倍元で、すべての公倍元を割り切るもの）であることを示せ。
:::

::: solution
$d=\gcd(a,b)$, $a=da'$, $b=db'$ とすると \ref{ring:gcd-properties} の 1 から $\gcd(a',b')=1$。$m\defeq ab/d=da'b'$ は $a=da'$ と $b=db'$ の倍元。$a\mid c$, $b\mid c$ とする：$c=da'x=db'y$ から $a'x=b'y$、$a'\mid b'y$ で $\gcd(a',b')=1$ なのでユークリッドの補題から $a'\mid y$：$y=a'z$。$c=db'a'z=mz$。
:::

::: problem {#ring:prob-z-sqrt-minus-5-no-gcd}
$\Z[\sqrt{-5}]$ で $6$ と $2+2\sqrt{-5}$ は最大公約元をもたないことを示せ。
:::

::: solution
$N(6)=36$, $N(2+2\sqrt{-5})=24$。$2$ と $1+\sqrt{-5}$ はどちらも両者の公約元である（$6=2\cdot 3=(1+\sqrt{-5})(1-\sqrt{-5})$、$2+2\sqrt{-5}=2(1+\sqrt{-5})$）。最大公約元 $d$ があれば $2\mid d$, $1+\sqrt{-5}\mid d$ なので $N(2)=4\mid N(d)$, $N(1+\sqrt{-5})=6\mid N(d)$、よって $12\mid N(d)$。また $d\mid 6$, $d\mid 2+2\sqrt{-5}$ から $N(d)\mid 36$, $N(d)\mid 24$、よって $N(d)\mid 12$。したがって $N(d)=12$。しかし $x^{2}+5y^{2}=12$ は整数解をもたない（$y=0$ なら $12$ は平方数でない、$y=\pm1$ なら $x^{2}=7$）。矛盾。
:::
