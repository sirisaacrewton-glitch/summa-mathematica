# 整域の分類と包含関係 {#ring:page-classification keywords="classification of integral domains, inclusion diagram, Euclidean, PID, UFD, GCD, Bezout, Prufer, Dedekind, valuation ring, DVR, normal, Noetherian, counterexamples"}

このページは、これまでに定義した整域のクラス（体・ユークリッド環・PID・一意分解環・GCD 整域・ベズー整域・付値環・離散付値環・デデキント環・プリューファー整域・正規環・ネーター整域）の**包含関係を一枚の図にまとめ**（\ref{ring:classification-diagram}）、各包含の証明と、**包含が真であること（逆が成り立たないこと）の反例**を一覧にする（\ref{ring:classification-table}）。さらに、二つのクラスの共通部分が別のクラスに一致するという「交わりの定理」（\ref{ring:classification-intersections}）を集める。個々の主張の証明はすべて前のページにあり、ここでは \ref で参照する。


## 記法と定義の確認 {#ring:sec-cl-notation}

::: notation
- 各クラスの定義：ユークリッド環・PID・一意分解環（\ref{ring:euclidean-domain}, \ref{ring:pid}, \ref{ring:ufd}）、GCD 整域・ベズー整域（\ref{ring:gcd-domain}, \ref{ring:bezout-domain}）、付値環・離散付値環（\ref{ring:valuation-ring}, \ref{ring:dvr}）、デデキント環（\ref{ring:dedekind}）、プリューファー整域（\ref{ring:prufer}）、正規環（\ref{ring:normal-domain}）、ネーター環（\ref{ring:noetherian-artinian-def}）。
- 「$\mathcal{C}\subset\mathcal{D}$」はクラスの包含（$\mathcal{C}$ に属する整域はすべて $\mathcal{D}$ に属する）。
- 反例で繰り返し使う環：$\Z[\sqrt{-5}]$（\ref{ring:non-ufd-example}）、$\Z[\frac{1+\sqrt{-19}}{2}]$（\ref{ring:pid-not-euclidean}）、$\Z[x]$ と体 $K$ 上の $K[x,y]$（\ref{ring:ufd-not-pid}）、有理数冪の環 $V=K[t^{\Q_{\ge 0}}]_{\mathfrak{m}}$（\ref{ring:rational-exponent-ring}）、$\Z[\sqrt{5}]$（\ref{ring:non-normal-examples}）。
:::

::: proof
各包含の証明は \ref{ring:classification-table} の「理由」の欄の結果による。図にない包含のうち、離散付値環 $\subset$ ユークリッド環と体 $\subset$ 付値環の二つだけはここで示す。

**Step 1（DVR はユークリッド環）.** 離散付値 $v$ を $\delta$ とする。$a\in A$, $0\neq b$ について、$a=0$ なら $q=r=0$。$v(a)\ge v(b)$ なら $a/b\in A$（$v(a/b)\ge 0$）なので $a=(a/b)b+0$。$v(a)<v(b)$ なら $a=0\cdot b+a$ で $\delta(a)<\delta(b)$。

**Step 2（体は付値環・ユークリッド環）.** 体では $0$ でない元の逆元が属するので付値環。割り算は $a=(ab^{-1})b+0$ で、$\delta$ は何でもよい。
:::

## 包含と反例の一覧 {#ring:sec-cl-table}

::: table 包含・理由・逆が成り立たない例 {#ring:classification-table}
| 包含 | 理由 | 逆が成り立たない例 |
|---|---|---|
| 体 $\subset$ ユークリッド環 | \ref{ring:classification-diagram} の Step 2 | $\Z$ |
| 離散付値環 $\subset$ ユークリッド環 | \ref{ring:classification-diagram} の Step 1 | $\Z$（局所環でない） |
| ユークリッド環 $\subset$ PID | \ref{ring:euclidean-pid} | $\Z[\frac{1+\sqrt{-19}}{2}]$（\ref{ring:pid-not-euclidean}） |
| PID $\subset$ 一意分解環 | \ref{ring:pid-ufd} | $\Z[x]$, $K[x,y]$（\ref{ring:ufd-not-pid}） |
| PID $\subset$ ベズー整域 | \ref{ring:bezout-characterization} | $V$（\ref{ring:rational-exponent-properties}） |
| PID $\subset$ デデキント環 | \ref{ring:dedekind} の後の例 | $\Z[\sqrt{-5}]$（\ref{ring:z-sqrt-minus-5-dedekind}） |
| 一意分解環 $\subset$ GCD 整域 | \ref{ring:ufd-gcd} | $V$（既約元がない） |
| ベズー整域 $\subset$ GCD 整域 | \ref{ring:bezout-characterization} | $\Z[x]$（$(2,x)$ が単項でない） |
| ベズー整域 $\subset$ プリューファー整域 | \ref{ring:prufer-classes} | $\Z[\sqrt{-5}]$（\ref{ring:prob-prufer-not-bezout}） |
| デデキント環 $\subset$ プリューファー整域 | \ref{ring:prufer-classes} | $V$（ネーターでない） |
| 付値環 $\subset$ ベズー整域 | \ref{ring:valuation-properties} | $\Z$（局所環でない） |
| 離散付値環 $\subset$ 付値環 | 定義 | $V$（値群が $\Q$） |
| 体 $\subset$ 付値環 | 定義 | $\Z_{(p)}$ |
| GCD 整域 $\subset$ 正規環 | \ref{ring:gcd-properties} | $\Z[\sqrt{-5}]$（\ref{ring:prob-z-sqrt-minus-5-no-gcd}） |
| プリューファー整域 $\subset$ 正規環 | \ref{ring:prufer-characterization} | $K[x,y]$ |
| デデキント環 $\subset$ ネーター整域 | 定義 | $K[x,y]$, $\Z[\sqrt{5}]$ |
| 正規環 $\subset$ 整域 | 定義 | $\Z[\sqrt{5}]$, $K[t^{2},t^{3}]$（\ref{ring:non-normal-examples}） |
:::

::: proof
「逆が成り立たない例」の各環が左のクラスに属さず右のクラスに属することを確かめる。

**Step 1（PID・ユークリッド環）.** $\Z$ はユークリッド環で体でも局所環でもない。$\Z[\frac{1+\sqrt{-19}}{2}]$ は \ref{ring:pid-not-euclidean}。$\Z[x]$, $K[x,y]$ は UFD で PID でない（\ref{ring:ufd-not-pid}）。

**Step 2（$V$）.** \ref{ring:rational-exponent-properties} から、$V$ は付値環・ベズー整域（したがってプリューファー整域・GCD 整域）で、既約元がなく ACCP をみたさないので一意分解環でもネーターでもなく、したがって PID・デデキント環・離散付値環でない。

**Step 3（$\Z[\sqrt{-5}]$）.** デデキント環（\ref{ring:z-sqrt-minus-5-dedekind}）なので正規・プリューファー整域。$(2,1+\sqrt{-5})$ が単項でないのでベズー整域・PID でない。GCD 整域でない（\ref{ring:prob-z-sqrt-minus-5-no-gcd}）。

**Step 4（$K[x,y]$）.** UFD なので正規・GCD 整域・ネーター（\ref{ring:hilbert-basis}）。プリューファー整域なら UFD $\cap$ プリューファー $=$ PID（\ref{ring:prufer-ufd}）となって矛盾。デデキント環なら同じく PID になる。

**Step 5（$\Z[\sqrt{5}]$ など）.** 正規でない（\ref{ring:non-normal-examples}）ので、正規環を含むどのクラスにも属さないが、$\Z[x]$ の剰余環 $\Z[x]/(x^{2}-5)$ としてネーター整域。$\Z_{(p)}$ は離散付値環で体でない。
:::

## 交わりの定理 {#ring:sec-cl-intersections}

::: theorem 交わりの定理 {#ring:classification-intersections keywords="intersections of classes of domains: UFD and Bezout is PID, Noetherian Prufer is Dedekind, Noetherian valuation ring is DVR" index="交わりの定理|まじわりのていり"}
（AC）次の等式が成り立つ（体を除く場合は適宜読み替える）。
1. 一意分解環 $\cap$ ベズー整域 $=$ ネーター整域 $\cap$ ベズー整域 $=$ PID（\ref{ring:bezout-accp-pid}）。
2. ネーター整域 $\cap$ プリューファー整域 $=$ デデキント環（\ref{ring:prufer-classes.2}）。
3. ネーター整域 $\cap$ 付値環 $=$ 局所環 $\cap$ PID $=$ 離散付値環 $\cup$ 体（\ref{ring:dvr-characterization}）。
4. 一意分解環 $\cap$ デデキント環 $=$ PID（\ref{ring:class-group-pid}）。
5. GCD 整域 $\cap$ プリューファー整域 $=$ ベズー整域（\ref{ring:prufer-ufd}）。一意分解環 $\cap$ プリューファー整域 $=$ PID。
6. 局所環 $\cap$ プリューファー整域 $=$ 付値環（\ref{ring:prufer-classes.3}）。局所環 $\cap$ デデキント環 $=$ 離散付値環 $\cup$ 体（\ref{ring:dedekind-local}）。
:::

::: supplement
**図にないクラス.** 一意分解環はネーターとは限らない：体 $K$ 上の可算無限変数の多項式環 $K[x_{1},x_{2},\dots]$ は一意分解環（各元は有限個の変数の多項式環 $K[x_{1},\dots,x_{n}]$ に属し、そこで UFD。分解は変数を増やしても変わらない）だがネーターでない（\ref{ring:noetherian-exact} の後の例）。ほかに、**クルル整域**（一意分解環とデデキント環を共通に含む、「因子の一意分解」をもつ整域）、**GCD でないが正規なネーター整域**（$\Z[\sqrt{-5}]$）、**正規だがプリューファーでも GCD でもない整域**（$\Z[\sqrt{-5}][x]$ など）がある。

**性質の保存.** 各クラスが剰余環・多項式環・冪級数環・局所化・直積・テンソル積で保たれるかは \ref{ring:page-preservation-table} にまとめる。
:::
