# 正規拡大 {#fld:page-normal keywords="normal extension, splitting field characterization, embeddings into an algebraic closure preserve L, normal closure, normality is not transitive, conjugates"}

代数拡大 $L/K$ が**正規**であるとは、$K$ 上の既約多項式が $L$ に一つ根をもてば、すべての根を $L$ にもつ（$L$ で分解する）ことをいう（\ref{fld:normal}）。有限次拡大については、「ある多項式の分解体である」「代数閉包への $K$ 埋め込みがすべて $L$ を $L$ に写す」と同値である（\ref{fld:normal-equivalent}）。正規性は、ガロア拡大の二つの条件（正規・分離）の一方で、「共役な元がすべて揃っている」ことを表す。有限次拡大は、その**正規閉包**（\ref{fld:normal-closure}）に含まれる。

> 雪江明彦『代数学 2』第 3 章 §3.4 を参考にした。

## 記法と定義の確認 {#fld:sec-nm-notation}

::: notation
- 分解体とその一意性、延長の補題は \ref{fld:splitting-field}, \ref{fld:splitting-field-uniqueness}, \ref{fld:extension-simple}、代数閉包・代数的閉体への埋め込みは \ref{fld:algebraically-closed}, \ref{fld:embedding-algebraic-closure}。
- $\Omega$ を $L$ を含む代数的閉体とするとき、$K$ 準同型 $\sigma\colon L\to\Omega$ を $L$ の **$K$ 埋め込み**という。$\alpha\in L$ と $\sigma(\alpha)$ は同じ最小多項式をもつ（$f(\sigma(\alpha))=\sigma(f(\alpha))=0$ と \ref{fld:minimal-polynomial-properties.2}）。$\alpha$ の最小多項式の $\Omega$ における根を $\alpha$ の（$K$ 上の）**共役**という。
- **選択公理**：代数閉包（\ref{fld:algebraic-closure-existence}）と埋め込みの延長（\ref{fld:embedding-algebraic-closure}）を通して使う。有限次拡大で、$\Omega$ として十分大きな分解体をとれば使わずに済む。
:::

## 定義と特徴付け {#fld:sec-nm-definition}

::: definition 正規拡大 {#fld:normal keywords="normal extension" index="正規拡大|せいきかくだい, 共役（体）|きょうやくたい"}
代数拡大 $L/K$ が**正規**であるとは、$K[x]$ の既約多項式で $L$ に根をもつものが、すべて $L[x]$ で一次式の積に分解することをいう。言い換えると、$L$ の元の共役はすべて $L$ に属する。
:::

::: theorem 正規性の特徴付け {#fld:normal-equivalent keywords="for a finite extension: normal iff splitting field iff all K-embeddings into an algebraic closure map L onto L" index="正規性の特徴付け|せいきせいのとくちょうづけ"}
（AC）有限次拡大 $L/K$ と、$L$ を含む代数的閉体 $\Omega$ について、次は同値である。
1. $L/K$ は正規。
2. $L$ はある $f\in K[x]$ の $K$ 上の分解体。
3. すべての $K$ 埋め込み $\sigma\colon L\to\Omega$ について $\sigma(L)=L$。
:::

::: proof
**Step 1（1⇒2）.** $L=K(\alpha_{1},\dots,\alpha_{n})$（例えば基底）とし、$\alpha_{i}$ の最小多項式を $f_{i}$、$f\defeq f_{1}\cdots f_{n}$ とする。1 から各 $f_{i}$ は $L$ で分解するので $f$ も分解し、$L$ は $f$ の根（$\alpha_{i}$ を含む）で生成される。よって $L$ は $f$ の分解体。

**Step 2（2⇒3）.** $L=K(\beta_{1},\dots,\beta_{m})$（$\beta_{j}$ は $f$ の根全体）。$\sigma(\beta_{j})$ は $f$ の根なのでどれかの $\beta_{j'}$ に等しい（$f$ は $L$ で分解し、$\Omega$ は整域なので $f$ の $\Omega$ での根は $\beta_{j}$ だけ）。よって $\sigma(L)=K(\sigma(\beta_{1}),\dots)\subset L$ で、$\sigma(L)$ は $L$ と同じ $K$ 次元をもつ\term[部分空間]{lin:vector-space}なので $\sigma(L)=L$。

**Step 3（3⇒1）.** $g\in K[x]$ を既約で $L$ に根 $\alpha$ をもつものとし、$\beta\in\Omega$ を $g$ の任意の根とする。\ref{fld:extension-simple} から $K$ 準同型 $K(\alpha)\to\Omega$, $\alpha\mapsto\beta$ があり、\ref{fld:embedding-algebraic-closure}（$L/K(\alpha)$ は代数拡大）から $\tau\colon L\to\Omega$ に延びる。3 から $\beta=\tau(\alpha)\in\tau(L)=L$。$g$ は $\Omega$ で分解し、その根はすべて $L$ に属するので、$g$ は $L$ で分解する。
:::

::: corollary 中間体と正規性 {#fld:normal-intermediate keywords="if L/K is normal then L/M is normal for intermediate M; normality is not transitive" index="正規拡大と中間体|せいきかくだいとちゅうかんたい"}
（AC）$L/K$ が有限次の正規拡大で $K\subset M\subset L$ なら、$L/M$ は正規。$M/K$ は正規とは限らず、また $L/M$, $M/K$ が正規でも $L/K$ は正規とは限らない（\ref{fld:prob-nm-not-transitive}）。
:::

::: proof
$L$ が $f\in K[x]$ の $K$ 上の分解体なら、$f\in M[x]$ とみて $L$ は $M$ 上の分解体（$L=K(\text{根})\subset M(\text{根})\subset L$）。\ref{fld:normal-equivalent.2}⇒1。$M/K$ の反例は例 2（$\Q(\sqrt[3]{2})$ は分解体 $\Q(\sqrt[3]{2},\omega)$ の中間体）。
:::

::: proposition 2 次拡大は正規 {#fld:quadratic-normal keywords="extensions of degree 2 are normal" index="2 次拡大|にじかくだい"}
$[L:K]=2$ なら $L/K$ は正規。
:::

::: proof
$\alpha\in L\setminus K$ をとると $L=K(\alpha)$（\ref{fld:degree-divides}）で、最小多項式 $x^{2}+bx+c$ のもう一つの根 $-b-\alpha$ は $L$ に属する。よって $L$ は $x^{2}+bx+c$ の分解体で、\ref{fld:normal-equivalent} から正規。
:::

## 正規閉包 {#fld:sec-nm-closure}

::: theorem 正規閉包 {#fld:normal-closure keywords="normal closure of a finite extension; composite of all conjugate fields" index="正規閉包|せいきへいほう"}
（AC）有限次拡大 $L/K$ と、$L$ を含む代数的閉体 $\Omega$ について、$K$ 埋め込み $\sigma\colon L\to\Omega$ 全体の像の合成体 $N\defeq\prod_{\sigma}\sigma(L)$ は、$L$ を含む $K$ 上有限次の正規拡大で、$L\subset N'\subset\Omega$ となる $K$ 上の正規拡大 $N'$ はすべて $N$ を含む。$N$ を $L/K$ の（$\Omega$ の中の）**正規閉包**という。
:::

::: proof
**Step 1（分解体）.** $L=K(\alpha_{1},\dots,\alpha_{n})$ とし、$f$ を $\alpha_{i}$ の最小多項式の積とする。$\sigma(L)=K(\sigma(\alpha_{1}),\dots)$ は $f$ の根で生成されるので $N\subset N_{0}\defeq K(f\text{ の }\Omega\text{ での根全体})$。逆に $f$ の各根 $\beta$ は、ある $\alpha_{i}$ の共役で、\ref{fld:normal-equivalent} の Step 3 と同じく $\alpha_{i}\mapsto\beta$ となる $K$ 埋め込み $\sigma\colon L\to\Omega$ があるので、$\beta\in\sigma(L)\subset N$。よって $N=N_{0}$ は $f$ の分解体で、正規かつ有限次（\ref{fld:splitting-field-existence}）。

**Step 2（最小性）.** $N'$ が $L$ を含む正規拡大なら、各 $\alpha_{i}$ の共役（$f$ の根）はすべて $N'$ に属するので $N=N_{0}\subset N'$。
:::

::: example
1. $\Q(\sqrt{2})/\Q$ は 2 次なので正規（\ref{fld:quadratic-normal}）。
2. $\Q(\sqrt[3]{2})/\Q$（実数の中）は正規でない：$x^{3}-2$ は既約で根 $\sqrt[3]{2}$ をもつが、他の根 $\sqrt[3]{2}\omega^{\pm1}$ は実数でないので $\Q(\sqrt[3]{2})\subset\R$ に属さない。正規閉包は分解体 $\Q(\sqrt[3]{2},\omega)$（次数 $6$。\ref{fld:page-splitting-fields} の例 2）。
3. 有理関数体 $K(t)$ について、$K(t)/K(t^{2})$ は 2 次なので正規。
:::

## 問題 {#fld:sec-nm-problems}

::: problem {#fld:prob-nm-not-transitive}
$\Q\subset\Q(\sqrt{2})\subset\Q(\sqrt[4]{2})$ で、各段は正規だが $\Q(\sqrt[4]{2})/\Q$ は正規でないことを示せ。
:::

::: solution
$\alpha=\sqrt[4]{2}>0$ とする。$x^{4}-2$ はアイゼンシュタインで既約なので $[\Q(\alpha):\Q]=4$、$\alpha^{2}=\sqrt{2}$ から $[\Q(\alpha):\Q(\sqrt{2})]=2$。各段は 2 次なので正規（\ref{fld:quadratic-normal}）。一方 $x^{4}-2$ の根 $i\alpha$ は実数でなく $\Q(\alpha)\subset\R$ に属さないので、$\Q(\alpha)/\Q$ は正規でない。
:::

::: problem {#fld:prob-nm-cyclotomic}
$p$ を素数、$\zeta=e^{2\pi\sqrt{-1}/p}$ とすると $\Q(\zeta)/\Q$ は正規であることを示せ。
:::

::: solution
$x^{p}-1$ の根は $\zeta^{j}$（$0\le j<p$）で、すべて $\Q(\zeta)$ に属する。よって $\Q(\zeta)$ は $x^{p}-1$ の分解体で、\ref{fld:normal-equivalent} から正規。
:::

::: supplement
**高い視点.** 条件 3 は「$L$ は $\Omega$ の中で $K$ 自己同型の作用について安定」と言っている。正規拡大の $K$ 埋め込みはすべて $L$ の自己同型になるので、$\operatorname{Aut}(L/K)$ が埋め込み全体を表す。正規でない拡大では、埋め込みの一部が $L$ の外に出てしまい、自己同型としては見えない。正規閉包は、それらすべてを含む最小の「対称な」体である。
:::
