# 体の拡大と次数 {#fld:page-degree keywords="field extension, degree of an extension, tower law, prime field, algebraic element, transcendental element, minimal polynomial, simple extension K(alpha) = K[x]/(f), adjoining a root"}

体 $K$ を部分体として含む体 $L$ を $K$ の**拡大体**といい、$L/K$ と書く（\ref{fld:extension}）。$L$ は $K$ 上のベクトル空間なので、その次元として**拡大次数** $[L:K]$ が定まり、塔 $K\subset L\subset M$ について $[M:K]=[M:L][L:K]$ が成り立つ（\ref{fld:tower-law}）。$L$ の元 $\alpha$ が $K$ 係数の多項式の根になるとき**代数的**といい、そのような多項式のうち次数最小のモニックなものが**最小多項式**である（\ref{fld:minimal-polynomial}）。このページの中心は、$\alpha$ で生成される体が多項式環の剰余環 $K[x]/(f)$ と同型で、次数が $\deg f$ に等しいこと（\ref{fld:simple-extension}）である。逆に、既約多項式 $f$ が与えられれば $K[x]/(f)$ は $f$ の根をもつ拡大体になる（\ref{fld:kronecker}）。

> 雪江明彦『代数学 2』第 3 章 §3.1 の流れを参考にした。標数とフロベニウス写像は環論の系列（\ref{ring:char-domain}）で扱ったので、ここでは素体だけを補う。

## 記法と定義の確認 {#fld:sec-dg-notation}

::: notation
- 体は可換（\ref{ring:domain-field-def}）。体の準同型は単射（\ref{ring:field-ideals.2}）。標数・フロベニウス写像・素部分環は \ref{ring:characteristic}, \ref{ring:char-domain}, \ref{ring:prime-subring}、商体の普遍性は \ref{ring:fraction-field}。
- $K[x]$ は体 $K$ 上の多項式環。割り算（\ref{ring:polynomial-division}）ができるユークリッド環なので単項イデアル整域（\ref{ring:euclidean-pid}）で、既約多項式 $f$ について $(f)$ は極大イデアル（\ref{ring:pid-basic.2}）、$K[x]/(f)$ は体（\ref{ring:prime-maximal-quotient.2}）。
- 多項式環の普遍性（代入）は \ref{ring:polynomial-universal}、ガウスの補題・アイゼンシュタインの判定法・有理根定理は \ref{ring:gauss-irreducible}, \ref{ring:eisenstein}, \ref{ring:rational-root}。
- ベクトル空間の次元は \ref{mod:vector-space-dimension}（無限の場合は濃度）。
- **選択公理**：無限次元のベクトル空間の基底と次元（塔の公式の無限の場合）でだけ使う。
:::

## 拡大体と次数 {#fld:sec-dg-extension}

::: definition 拡大体・次数 {#fld:extension keywords="field extension L/K, subfield, intermediate field, degree [L:K], finite extension" index="拡大体|かくだいたい, 体の拡大|たいのかくだい, 部分体|ぶぶんたい, 中間体|ちゅうかんたい, 拡大次数|かくだいじすう, 有限次拡大|ゆうげんじかくだい"}
体 $L$ の部分環 $K$ が体であるとき $K$ を $L$ の**部分体**、$L$ を $K$ の**拡大体**といい、$L/K$ と書く。$K\subset M\subset L$ となる体 $M$ を**中間体**という。$L$ は $K$ の元を掛けることで $K$ 上のベクトル空間になり、その次元 $[L:K]\defeq\dim_{K}L$ を**拡大次数**という。$[L:K]<\infty$ のとき**有限次拡大**という。体の準同型 $\sigma\colon K\to L$ があるとき、$\sigma(K)$ と $K$ を同一視して $L$ を $K$ の拡大体とみなすことがある。
:::

::: proposition 素体 {#fld:prime-field keywords="every field contains a unique smallest subfield, isomorphic to Q or F_p" index="素体|そたい"}
体 $L$ の部分体すべての共通部分 $P$ は部分体で、$\operatorname{char}L=0$ なら $P\cong\Q$、$\operatorname{char}L=p$ なら $P\cong\mathbb{F}_{p}\defeq\Z/p\Z$。$P$ を $L$ の**素体**という。
:::

::: proof
**Step 1（共通部分）.** 部分体の共通部分は、和・積・$-$・$0$ でない元の逆元で閉じ $0,1$ を含むので部分体。

**Step 2（標数 $p$）.** 標数は $0$ か素数（\ref{ring:char-domain.2}）。$\operatorname{char}L=p$ なら素部分環は $\Z/p\Z$ と同型（\ref{ring:prime-subring}）で、これは体なので部分体。すべての部分体は $1$ を含むので素部分環を含み、$P$ は素部分環に等しい。

**Step 3（標数 $0$）.** 素部分環は $\Z$ と同型で、$\Z\to L$ は単射。商体の普遍性（\ref{ring:fraction-field}）から単射 $\Q\to L$, $m/n\mapsto(m\cdot 1)(n\cdot 1)^{-1}$ に延び、その像は $1$ を含む部分体すべてに含まれる部分体なので $P$ に等しい。
:::

::: theorem 塔の公式 {#fld:tower-law keywords="tower law: [M:K] = [M:L][L:K]" index="塔の公式|とうのこうしき, 次数の乗法性|じすうのじょうほうせい" refname="塔の公式"}
体の拡大 $K\subset L\subset M$ について、$\{u_{i}\}_{i\in I}$ が $L$ の $K$ 上の基底、$\{v_{j}\}_{j\in J}$ が $M$ の $L$ 上の基底なら、$\{u_{i}v_{j}\}_{(i,j)\in I\times J}$ は $M$ の $K$ 上の基底である。特に $[M:K]=[M:L][L:K]$（無限の場合は濃度の積として。基底の存在に選択公理を使う）で、$[M:K]$ が有限 $\iff$ $[M:L]$ と $[L:K]$ がともに有限。このとき $[L:K]$ と $[M:L]$ は $[M:K]$ の約数。
:::

::: proof
**Step 1（張る）.** $z\in M$ は $z=\sum_{j}b_{j}v_{j}$（$b_{j}\in L$、有限和）と書け、各 $b_{j}=\sum_{i}a_{ij}u_{i}$（$a_{ij}\in K$）なので $z=\sum_{i,j}a_{ij}u_{i}v_{j}$。

**Step 2（一次独立）.** $\sum_{i,j}a_{ij}u_{i}v_{j}=0$（有限和）なら、$\sum_{j}\bigl(\sum_{i}a_{ij}u_{i}\bigr)v_{j}=0$ で、括弧内は $L$ の元なので $\{v_{j}\}$ の $L$ 上の独立性から各 $\sum_{i}a_{ij}u_{i}=0$、$\{u_{i}\}$ の独立性から $a_{ij}=0$。

**Step 3（後半）.** $\abs{I\times J}=\abs{I}\abs{J}$ で、両方有限なら積は有限、一方が無限なら積も無限（どちらも空でない）。
:::

## 代数的な元と最小多項式 {#fld:sec-dg-algebraic}

::: definition 生成された部分環・部分体 {#fld:generated-subfield keywords="K[S], K(S), simple extension K(alpha)" index="生成された部分体|せいせいされたぶぶんたい, 単拡大|たんかくだい"}
拡大 $L/K$ と部分集合 $S\subset L$ について、$K$ と $S$ を含む $L$ の最小の部分環を $K[S]$、最小の部分体を $K(S)$ と書く（それぞれ、含む部分環・部分体すべての共通部分）。$S=\{\alpha_{1},\dots,\alpha_{n}\}$ なら $K[\alpha_{1},\dots,\alpha_{n}]$, $K(\alpha_{1},\dots,\alpha_{n})$ と書く。$K[\alpha]$ は $\alpha$ の $K$ 係数多項式の値全体で、$K(\alpha)$ はその商（$g(\alpha)/h(\alpha)$, $h(\alpha)\neq 0$）全体である。$L=K(\alpha)$ となる $\alpha$ があるとき $L/K$ を**単拡大**という。
:::

::: definition 代数的・超越的・最小多項式 {#fld:minimal-polynomial keywords="algebraic element, transcendental element, minimal polynomial, algebraic extension" index="代数的元|だいすうてきげん, 超越的元|ちょうえつてきげん, 最小多項式|さいしょうたこうしき, 代数拡大|だいすうかくだい"}
拡大 $L/K$ と $\alpha\in L$ について、代入 $\varphi_{\alpha}\colon K[x]\to L$, $g\mapsto g(\alpha)$（\ref{ring:polynomial-universal}）の核が $0$ でないとき $\alpha$ は $K$ 上**代数的**、$0$ のとき**超越的**という。代数的なとき、核は単項イデアル $(f)$ で、$f$ をモニックにとったものを $\alpha$ の $K$ 上の**最小多項式**という。$L$ のすべての元が $K$ 上代数的なとき、$L/K$ を**代数拡大**という。
:::

::: proposition 最小多項式の性質 {#fld:minimal-polynomial-properties keywords="minimal polynomial is irreducible, divides every polynomial vanishing at alpha, characterized as the monic irreducible polynomial with root alpha" index="最小多項式の性質|さいしょうたこうしきのせいしつ"}
$\alpha$ を $K$ 上代数的、$f$ をその最小多項式とする。
1. $f$ は $K[x]$ の既約多項式で、$g(\alpha)=0$ となる $g\in K[x]$ はすべて $f$ の倍数。$f$ は $\alpha$ を根にもつ $0$ でない多項式のうち次数が最小のモニックなものである。
2. 逆に、$\alpha$ を根にもつモニックな既約多項式 $g\in K[x]$ は $f$ に等しい。
:::

::: proof
**Step 1（既約）.** $\operatorname{Ker}\varphi_{\alpha}=(f)$ で、$K[x]/(f)\cong\operatorname{Im}\varphi_{\alpha}\subset L$（準同型定理 \tref{ring:first-isomorphism}）は体の部分環なので整域。よって $(f)$ は素イデアル（\ref{ring:prime-maximal-quotient.1}）で、$f\neq 0$ は非単元（$\alpha$ の像 $1\neq 0$ なので $f$ は定数でない）だから既約（素元は既約）。

**Step 2（倍数・最小次数）.** $g(\alpha)=0\iff g\in(f)\iff f\mid g$。$g\neq 0$ なら $\deg g\ge\deg f$。

**Step 3（2）.** $g(\alpha)=0$ なので $f\mid g$。$g$ は既約で $f$ は定数でないので $g=cf$（$c\in K^{\times}$）、両方モニックなので $c=1$。
:::

::: theorem 単拡大の構造 {#fld:simple-extension keywords="K(alpha) = K[alpha] = K[x]/(f) for algebraic alpha, degree equals degree of minimal polynomial; K(alpha) = K(x) for transcendental alpha" index="単拡大の構造|たんかくだいのこうぞう"}
拡大 $L/K$ と $\alpha\in L$ について、
1. $\alpha$ が代数的で最小多項式 $f$ の次数が $n$ なら、$\varphi_{\alpha}$ は同型 $K[x]/(f)\cong K[\alpha]$ を誘導し、$K[\alpha]=K(\alpha)$ は体、$1,\alpha,\dots,\alpha^{n-1}$ はその $K$ 上の基底で、$[K(\alpha):K]=n$。
2. $\alpha$ が超越的なら、$K[\alpha]\cong K[x]$, $K(\alpha)\cong K(x)$（有理関数体）で、$[K(\alpha):K]=\infty$。
3. したがって、$\alpha$ が代数的 $\iff[K(\alpha):K]<\infty$。
:::

::: proof
**Step 1（1：体）.** 準同型定理から $K[x]/(f)\cong\operatorname{Im}\varphi_{\alpha}=K[\alpha]$。$f$ は既約なので $(f)$ は極大イデアルで、$K[\alpha]$ は体（記法の欄）。$K(\alpha)$ は $K[\alpha]$ を含む最小の部分体なので $K(\alpha)=K[\alpha]$。

**Step 2（1：基底）.** $g\in K[x]$ を $f$ で割ると $g=qf+r$, $\deg r<n$（\ref{ring:polynomial-division}）で $g(\alpha)=r(\alpha)$ なので、$1,\alpha,\dots,\alpha^{n-1}$ は $K[\alpha]$ を張る。$\sum_{i<n}c_{i}\alpha^{i}=0$ なら、$\sum c_{i}x^{i}$ は $f$ の倍数で次数 $<n$ なので $0$。

**Step 3（2）.** 核が $0$ なので $K[x]\cong K[\alpha]$。$K[\alpha]$ は整域で、商体の普遍性（\ref{ring:fraction-field}）から $K(x)\to L$ に延び、像は $K[\alpha]$ を含む最小の部分体 $K(\alpha)$。$1,\alpha,\alpha^{2},\dots$ は一次独立なので次数は無限。

**Step 4（3）.** 1 と 2 から。
:::

::: theorem 根の添加（クロネッカー） {#fld:kronecker keywords="Kronecker's construction: for irreducible f, K[x]/(f) is an extension of K in which f has a root" index="根の添加|ねのてんか, クロネッカーの構成|くろねっかーのこうせい"}
$f\in K[x]$ を既約多項式とすると、$L\defeq K[x]/(f)$ は $K$ の拡大体（$c\mapsto c+(f)$ で $K\subset L$ とみなす）で、$\alpha\defeq x+(f)$ は $f(\alpha)=0$ をみたし、$L=K(\alpha)$, $[L:K]=\deg f$。一般に、定数でない $g\in K[x]$ に対して、$g$ が根をもつ拡大体が存在する。
:::

::: proof
**Step 1.** $(f)$ は極大イデアルなので $L$ は体、$K\to L$ は体の準同型なので単射。$f(\alpha)=f(x)+(f)=0$。$L$ は $K$ と $\alpha$ で生成されるので $L=K[\alpha]=K(\alpha)$。$\alpha$ の最小多項式は $f$ をモニックにしたもの（\ref{fld:minimal-polynomial-properties.2}）なので \ref{fld:simple-extension} から $[L:K]=\deg f$。

**Step 2（一般の $g$）.** $K[x]$ は一意分解環（\ref{ring:pid-ufd}）なので $g$ は既約因子 $f$ をもち、Step 1 の $L$ で $g(\alpha)=0$。
:::

::: example
1. $\sqrt{2}\in\R$ の $\Q$ 上の最小多項式は $x^{2}-2$（有理根定理 \tref{ring:rational-root} から $\Q$ に根がなく、2 次なので既約）。$[\Q(\sqrt{2}):\Q]=2$、$\Q(\sqrt{2})=\{a+b\sqrt{2} : a,b\in\Q\}$。
2. $\sqrt[3]{2}\in\R$ の最小多項式は $x^{3}-2$（$p=2$ のアイゼンシュタインの判定法 \tref{ring:eisenstein} とガウスの補題 \ref{ring:gauss-irreducible} から $\Q[x]$ で既約）。$[\Q(\sqrt[3]{2}):\Q]=3$。
3. $\C=\R(i)$ で $i$ の最小多項式は $x^{2}+1$、$[\C:\R]=2$（\ref{ring:polynomial-quotients.2}）。
4. 体 $K$ 上の有理関数体 $K(t)$ で $t$ は超越的、$[K(t):K]=\infty$。
:::

::: corollary 次数による制限 {#fld:degree-divides keywords="degree of an element divides the degree of a finite extension" index="元の次数|げんのじすう"}
$[L:K]=n<\infty$ なら、$L$ の各元は $K$ 上代数的で、その最小多項式の次数は $n$ を割り切る。特に $n$ が素数なら、$L/K$ の中間体は $K$ と $L$ だけで、$K$ に属さない任意の $\alpha\in L$ について $L=K(\alpha)$。
:::

::: proof
$\alpha\in L$ について $K\subset K(\alpha)\subset L$ と\ref{fld:tower-law}から $[K(\alpha):K]$ は $n$ の約数で有限、\ref{fld:simple-extension.3} から代数的で、次数は最小多項式の次数。$n$ が素数なら中間体 $M$ について $[M:K]\in\{1,n\}$ で、$M=K$ か $[L:M]=1$ すなわち $M=L$。
:::

## 問題 {#fld:sec-dg-problems}

::: problem {#fld:prob-dg-sqrt2-sqrt3}
$[\Q(\sqrt{2},\sqrt{3}):\Q]=4$ を示し、$\Q(\sqrt{2},\sqrt{3})=\Q(\sqrt{2}+\sqrt{3})$ と、$\sqrt{2}+\sqrt{3}$ の最小多項式が $x^{4}-10x^{2}+1$ であることを確かめよ。
:::

::: solution
**Step 1（$\sqrt{3}\notin\Q(\sqrt{2})$）.** $\sqrt{3}=a+b\sqrt{2}$（$a,b\in\Q$）とすると $3=a^{2}+2b^{2}+2ab\sqrt{2}$。$\sqrt{2}\notin\Q$ なので $ab=0$。$b=0$ なら $a^{2}=3$、$a=0$ なら $2b^{2}=3$ で、どちらも有理数解がない（有理根定理）。よって $x^{2}-3$ は $\Q(\sqrt{2})$ 上既約で、$[\Q(\sqrt{2},\sqrt{3}):\Q(\sqrt{2})]=2$、塔の公式から $4$。

**Step 2（生成元）.** $\gamma=\sqrt{2}+\sqrt{3}$ とすると $\gamma^{-1}=\sqrt{3}-\sqrt{2}$（積が $1$）なので $\sqrt{3}=(\gamma+\gamma^{-1})/2$, $\sqrt{2}=(\gamma-\gamma^{-1})/2\in\Q(\gamma)$。よって $\Q(\gamma)=\Q(\sqrt{2},\sqrt{3})$、$[\Q(\gamma):\Q]=4$。

**Step 3（最小多項式）.** $\gamma^{2}=5+2\sqrt{6}$, $(\gamma^{2}-5)^{2}=24$ なので $\gamma^{4}-10\gamma^{2}+1=0$。次数 4 のモニック多項式で、最小多項式の次数は $4$ なので、\ref{fld:minimal-polynomial-properties.1} からこれが最小多項式。
:::

::: problem {#fld:prob-dg-cube-root-not-in}
$\sqrt{2}\notin\Q(\sqrt[3]{2})$ を示せ。
:::

::: solution
$[\Q(\sqrt{2}):\Q]=2$ は $[\Q(\sqrt[3]{2}):\Q]=3$ を割り切らないので、\ref{fld:degree-divides} から $\sqrt{2}\notin\Q(\sqrt[3]{2})$。
:::

::: supplement
**高い視点.** 体の拡大は「体の圏の射」（体の準同型はすべて単射）であり、拡大次数は線形代数の次元である。塔の公式は群の指数の乗法性 $(G:K)=(G:H)(H:K)$ とよく似ていて、ガロア理論ではこの二つが対応する（\ref{fld:page-fundamental-theorem}）。クロネッカーの構成は「方程式 $f=0$ の解がなければ、$x$ を形式的に解として扱い、$f$ を $0$ とみなした商環を作る」という考え方で、環論の剰余環が体論の道具になる典型である。
:::
