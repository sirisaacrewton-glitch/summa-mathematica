# 分離拡大 {#fld:page-separable keywords="separable polynomial, separable element, separable extension, perfect field, separable degree, purely inseparable, primitive element theorem, finite subgroups of the multiplicative group are cyclic"}

多項式が重根をもたないとき**分離的**という（\ref{fld:separable-polynomial}）。標数 $0$ の体の既約多項式はすべて分離的だが、標数 $p$ では $\mathbb{F}_{p}(t)$ 上の $x^{p}-t$ のように、既約なのに一つの根が $p$ 重になる多項式がある。最小多項式が分離的な元を分離的、すべての元が分離的な拡大を分離拡大という。有限次拡大 $L/K$ の代数閉包への $K$ 埋め込みの個数（**分離次数**）は $[L:K]$ 以下で、等号は分離拡大のときに限る（\ref{fld:separable-degree}）。この等式が、ガロア拡大で「自己同型の個数 = 次数」が成り立つ理由になる。最後に、有限次分離拡大は一つの元で生成されるという**原始元定理**（\tref{fld:primitive-element}）を示す。

> 雪江明彦『代数学 2』第 3 章 §3.3 を参考にした。分離次数の扱いは、延長の個数の評価（\ref{fld:extension-count}）を使って組み立てた。

## 記法と定義の確認 {#fld:sec-sp-notation}

::: notation
- 形式的微分と重根の判定は \ref{ring:formal-derivative}, \ref{ring:multiple-root}、標数とフロベニウス写像は \ref{ring:char-domain}、アイゼンシュタインの判定法とガウスの補題は \tref{ring:eisenstein}, \ref{ring:gauss-irreducible}。
- 延長の補題・延長の個数・代数閉包・埋め込み・正規性は \ref{fld:extension-simple}, \ref{fld:extension-count}, \ref{fld:algebraic-closure-existence}, \ref{fld:embedding-algebraic-closure}, \ref{fld:normal}。
- $\Omega$ は $K$ の代数閉包（以下で考える拡大はすべてその中にとれる。\ref{fld:embedding-algebraic-closure}）。$\Hom_{K}(L,\Omega)$ は $K$ 埋め込み $L\to\Omega$ 全体。
- 有限巡回群・元の位数・オイラー関数は \ref{grp:page-order-cyclic}, \ref{grp:order-of-power}。
- **選択公理**：代数閉包 $\Omega$ を使うところで使う。有限次拡大では $\Omega$ の代わりに十分大きな分解体をとれば不要。
:::

## 分離多項式 {#fld:sec-sp-polynomial}

::: definition 分離多項式・分離拡大 {#fld:separable-polynomial keywords="separable polynomial, separable element, separable extension, inseparable" index="分離多項式|ぶんりたこうしき, 分離的|ぶんりてき, 分離拡大|ぶんりかくだい, 非分離|ひぶんり"}
定数でない $f\in K[x]$ が、分解体（したがって $\Omega$）で相異なる根に分解するとき**分離的**という。代数的な元 $\alpha$ の最小多項式が分離的なとき $\alpha$ は $K$ 上**分離的**、代数拡大 $L/K$ のすべての元が分離的なとき $L/K$ は**分離拡大**という。
:::

::: proposition 分離性の判定 {#fld:separable-criterion keywords="f separable iff gcd(f,f') = 1; irreducible f separable iff f' != 0; in characteristic p, f' = 0 iff f = g(x^p)" index="分離性の判定|ぶんりせいのはんてい"}
1. $f$ が分離的 $\iff$ $f$ と $f'$ は $K[x]$ で互いに素（$\gcd(f,f')=1$）。
2. 既約な $f$ が分離的 $\iff f'\neq 0$。
3. $\operatorname{char}K=0$ なら既約多項式はすべて分離的。$\operatorname{char}K=p$ なら、既約な $f$ が分離的でない $\iff f=g(x^{p})$ となる $g\in K[x]$ がある。
:::

::: proof
**Step 1（1）.** $f$ が $\Omega$ で重根 $a$ をもつ $\iff$ $f(a)=f'(a)=0$（\ref{ring:multiple-root.2}）$\iff$ $f,f'$ が $\Omega$ で共通根をもつ。$d=\gcd(f,f')$ を $K[x]$ でとると（$K[x]$ は PID。$d=uf+vf'$）、共通根は $d$ の根で、逆に $d$ の根は共通根。$\Omega$ は代数的閉体なので、共通根がない $\iff d$ は定数。

**Step 2（2）.** $f$ が既約なら $\gcd(f,f')$ は $1$ か $f$ の定数倍。$f'\neq 0$ なら $\deg f'<\deg f$ なので $f\nmid f'$、$\gcd=1$。$f'=0$ なら $\gcd=f$。

**Step 3（3）.** $f=\sum a_{i}x^{i}$ について $f'=\sum ia_{i}x^{i-1}$。標数 $0$ で $\deg f\ge 1$ なら最高次の係数から $f'\neq 0$。標数 $p$ では $f'=0\iff$ $p\nmid i$ なら $a_{i}=0$ $\iff f=g(x^{p})$。
:::

::: definition 完全体 {#fld:perfect-field keywords="perfect field: characteristic 0 or Frobenius surjective" index="完全体|かんぜんたい"}
標数 $0$ の体、または標数 $p$ でフロベニウス写像 $a\mapsto a^{p}$ が全射（$K=K^{p}$）な体を**完全体**という。
:::

::: theorem 完全体上の分離性 {#fld:perfect-separable keywords="over a perfect field every irreducible polynomial is separable; finite fields are perfect" index="完全体上の分離性|かんぜんたいじょうのぶんりせい"}
1. 完全体上の既約多項式は分離的で、完全体の代数拡大は分離拡大である。
2. 有限体は完全体である。
3. $\operatorname{char}K=p$ で $K\neq K^{p}$ なら、$a\in K\setminus K^{p}$ について $x^{p}-a$ は既約で分離的でない。例えば $\mathbb{F}_{p}(t)$ 上の $x^{p}-t$。
:::

::: proof
**Step 1（1）.** 標数 $0$ は \ref{fld:separable-criterion.3}。標数 $p$ で既約な $f$ が分離的でないとすると $f=\sum b_{i}x^{pi}$。$b_{i}=c_{i}^{p}$ と書ける（完全体）ので、フロベニウスの準同型性（\ref{ring:char-domain.3}）から $f=(\sum c_{i}x^{i})^{p}$ で既約でない。

**Step 2（2）.** フロベニウス写像は体の準同型なので単射で、有限集合の単射は全射。

**Step 3（3）.** $\Omega$ で $b^{p}=a$ となる $b$ をとると $x^{p}-a=(x-b)^{p}$。$b$ の最小多項式 $g$ は $(x-b)^{m}$（$1\le m\le p$）の形で、その $x^{m-1}$ の係数 $-mb$ が $K$ に属する。$m<p$ なら $m$ は $K$ で可逆で $b\in K$、$a=b^{p}\in K^{p}$ となり矛盾。よって $m=p$, $g=x^{p}-a$ は既約で、重根 $b$ をもつ。$\mathbb{F}_{p}(t)$ では $t\notin\mathbb{F}_{p}(t)^{p}$（$t=(g/h)^{p}$ なら $th^{p}=g^{p}$ の次数は $p$ を法として $1$ と $0$ で矛盾）。
:::

## 分離次数 {#fld:sec-sp-degree}

::: definition 分離次数 {#fld:separable-degree-def keywords="separable degree [L:K]_s = number of K-embeddings into an algebraic closure" index="分離次数|ぶんりじすう"}
有限次拡大 $L/K$ について、$[L:K]_{s}\defeq\abs{\Hom_{K}(L,\Omega)}$ を**分離次数**という（$\Omega$ の取り方によらない：二つの代数閉包は $K$ 上同型。\ref{fld:algebraic-closure-uniqueness}）。
:::

::: theorem 分離次数の性質 {#fld:separable-degree keywords="separable degree is multiplicative, at most the degree, equality iff separable; generators separable implies separable; transitivity" index="分離次数の性質|ぶんりじすうのせいしつ"}
（AC）有限次拡大について、
1. $[K(\alpha):K]_{s}$ は $\alpha$ の最小多項式の相異なる根の個数で、$\alpha$ が分離的 $\iff[K(\alpha):K]_{s}=[K(\alpha):K]$。
2. $K\subset L\subset M$ について $[M:K]_{s}=[M:L]_{s}[L:K]_{s}$。
3. $[L:K]_{s}\le[L:K]$ で、等号 $\iff L/K$ は分離拡大。
4. $L=K(\alpha_{1},\dots,\alpha_{n})$ で各 $\alpha_{i}$ が $K$ 上分離的なら、$L/K$ は分離拡大。
5. $M/L$, $L/K$ が分離拡大なら $M/K$ も分離拡大。
:::

::: proof
**Step 1（1）.** \ref{fld:extension-simple}（$\sigma=\id_{K}$）から $K$ 埋め込みは最小多項式 $f$ の $\Omega$ の根と一対一。$f$ の次数は $[K(\alpha):K]$ で、相異なる根の個数が次数に等しい $\iff f$ は分離的。

**Step 2（2）.** $\tau\in\Hom_{K}(M,\Omega)$ は制限 $\sigma=\tau|_{L}\in\Hom_{K}(L,\Omega)$ で分類される。各 $\sigma$ の $M$ への延長の個数は $[M:L]_{s}$：$\sigma$ を同型 $\Omega\to\Omega$ に延ばしたもの $\tilde\sigma$（\ref{fld:algebraic-closure-uniqueness}。$\Omega$ は $\sigma(L)$ 上も代数閉包）をとると、$\rho\mapsto\tilde\sigma\circ\rho$ は $\Hom_{L}(M,\Omega)$ から $\sigma$ の延長全体への全単射（逆は $\tau\mapsto\tilde\sigma^{-1}\circ\tau$）。

**Step 3（3：不等式）.** $L=K(\alpha_{1},\dots,\alpha_{n})$ とし、$K_{i}=K(\alpha_{1},\dots,\alpha_{i})$ の塔を考える。各段 $[K_{i}:K_{i-1}]_{s}\le[K_{i}:K_{i-1}]$（1、$K_{i-1}$ 上）で、2 と塔の公式から掛け合わせる。

**Step 4（4）.** 各 $\alpha_{i}$ は $K_{i-1}$ 上も分離的（$K_{i-1}$ 上の最小多項式は $K$ 上の最小多項式を割り切る）なので、Step 3 の各段で等号、$[L:K]_{s}=[L:K]$。$\beta\in L$ について $[L:K]_{s}=[L:K(\beta)]_{s}[K(\beta):K]_{s}\le[L:K(\beta)][K(\beta):K]=[L:K]$ で等号なので $[K(\beta):K]_{s}=[K(\beta):K]$、1 から $\beta$ は分離的。これで 3 の ⇐ も示された（$L$ の基底を生成元にとる）。

**Step 5（3：⇒）.** 等号なら、Step 4 の後半と同じく各 $\beta\in L$ で $[K(\beta):K]_{s}=[K(\beta):K]$ となり分離的。

**Step 6（5）.** $\gamma\in M$ の $L$ 上の最小多項式の係数を $c_{1},\dots,c_{m}$ とし、$L'=K(c_{1},\dots,c_{m})$ とする。$L'/K$ は分離拡大（$L$ の部分）で有限次、$\gamma$ は $L'$ 上分離的。3 と 2 から $[L'(\gamma):K]_{s}=[L'(\gamma):L']_{s}[L':K]_{s}=[L'(\gamma):K]$ で、3 から $L'(\gamma)/K$ は分離拡大、$\gamma$ は $K$ 上分離的。
:::

::: proposition 純非分離拡大 {#fld:purely-inseparable keywords="separable closure in a finite extension, purely inseparable extension, inseparable degree is a power of p" index="純非分離拡大|じゅんひぶんりかくだい, 分離閉包|ぶんりへいほう"}
（AC）有限次拡大 $L/K$ で $K$ 上分離的な $L$ の元全体 $L_{s}$ は中間体で、$[L:K]_{s}=[L_{s}:K]$。$\operatorname{char}K=p>0$ なら、$L$ の各元 $\alpha$ について $\alpha^{p^{e}}\in L_{s}$ となる $e\ge 0$ があり、$[L:L_{s}]$ は $p$ の冪。
:::

::: proof
**Step 1（中間体）.** \ref{fld:separable-degree.4} から、分離的な元で生成される体は分離拡大なので、$L_{s}$ は和・積・逆元で閉じる。

**Step 2（$\alpha^{p^{e}}$）.** $\alpha$ の最小多項式 $f$ について、\ref{fld:separable-criterion.3} を繰り返して $f=g(x^{p^{e}})$, $g$ は既約かつ分離的（$g'\neq 0$）。$g(\alpha^{p^{e}})=0$ なので $\alpha^{p^{e}}$ は分離的で $L_{s}$ に属する。

**Step 3（$L/L_{s}$ の分離次数は 1）.** $\alpha\in L$ の $L_{s}$ 上の最小多項式は $x^{p^{e}}-\alpha^{p^{e}}=(x-\alpha)^{p^{e}}$ を割り切るので、$\Omega$ での根は $\alpha$ だけで $[L_{s}(\alpha):L_{s}]_{s}=1$。生成元ごとに積をとって $[L:L_{s}]_{s}=1$。\ref{fld:separable-degree.2}・\ref[3]{fld:separable-degree.3} から $[L:K]_{s}=[L_{s}:K]$。

**Step 4（$p$ の冪）.** $\alpha\in L$ の $L_{s}$ 上の最小多項式 $h$ は $(x-\alpha)^{p^{e}}$ を割り切るので、$\Omega[x]$ で $h=(x-\alpha)^{m}$。$m=p^{a}m'$（$p\nmid m'$）と書くと $h=(x^{p^{a}}-\alpha^{p^{a}})^{m'}$ で、その $x^{p^{a}(m'-1)}$ の係数 $-m'\alpha^{p^{a}}$ は $L_{s}$ に属し、$m'$ は可逆なので $\alpha^{p^{a}}\in L_{s}$。すると $\alpha$ は $x^{p^{a}}-\alpha^{p^{a}}\in L_{s}[x]$ の根なので $m\le p^{a}$、$m'=1$。よって $[L_{s}(\alpha):L_{s}]=p^{a}$。生成元を一つずつ添加して（各段も同じ議論）、塔の公式から $[L:L_{s}]$ は $p$ の冪。
:::

## 原始元定理 {#fld:sec-sp-primitive}

::: lemma 乗法群の有限部分群 {#fld:finite-multiplicative-cyclic keywords="a finite subgroup of the multiplicative group of a field is cyclic" index="乗法群の有限部分群|じょうほうぐんのゆうげんぶぶんぐん"}
体 $K$ の乗法群 $K^{\times}$ の有限部分群は巡回群である。特に有限体の乗法群は巡回群。
:::

::: proof
**Step 1.** $G$ を位数 $n$ の部分群、$d\mid n$ について $\psi(d)$ を位数 $d$ の元の個数とする。位数 $d$ の元 $a$ があれば、$\langle a\rangle$ の $d$ 個の元はすべて $x^{d}-1$ の根で、根は $d$ 個以下（\ref{ring:factor-theorem}）なので位数 $d$ の元はすべて $\langle a\rangle$ に属し、その個数は位数 $d$ の巡回群の生成元の個数 $\varphi(d)$（\ref{grp:order-of-power}）。よって $\psi(d)\in\{0,\varphi(d)\}$。

**Step 2.** 位数 $n$ の巡回群 $\Z/n\Z$ の元を位数で分けると $\sum_{d\mid n}\varphi(d)=n$。一方 $\sum_{d\mid n}\psi(d)=n$（ラグランジュの定理から位数は $n$ の約数）。$\psi(d)\le\varphi(d)$ なのですべて等号で、$\psi(n)=\varphi(n)\ge 1$。位数 $n$ の元が $G$ を生成する。
:::

::: theorem 原始元定理 {#fld:primitive-element keywords="primitive element theorem: a finite separable extension is simple" index="原始元定理|げんしげんていり, 原始元|げんしげん" refname="原始元定理"}
（AC）有限次分離拡大 $L/K$ は単拡大である：$L=K(\gamma)$ となる $\gamma\in L$（**原始元**）がある。
:::

::: proof
**Step 1（$K$ が有限）.** $L$ も有限で、$L^{\times}$ は巡回群（\ref{fld:finite-multiplicative-cyclic}）。生成元 $\gamma$ について $L=K(\gamma)$。

**Step 2（$K$ が無限：二元の場合）.** $L=K(\alpha,\beta)$ の場合を示せば、帰納法で一般の場合が従う。$\sigma_{1},\dots,\sigma_{n}$ を $\Hom_{K}(L,\Omega)$ の元全体とする（$n=[L:K]$。\ref{fld:separable-degree.3}）。$P(c)\defeq\prod_{i<j}\bigl((\sigma_{i}(\alpha)-\sigma_{j}(\alpha))+c(\sigma_{i}(\beta)-\sigma_{j}(\beta))\bigr)$ は $c$ の多項式で、各因子は $0$ でない（$\sigma_{i}\neq\sigma_{j}$ は生成元 $\alpha,\beta$ のどちらかで値が異なる）ので $P\neq 0$。$K$ は無限なので $P(c)\neq 0$ となる $c\in K$ がある。

**Step 3（原始元）.** $\gamma\defeq\alpha+c\beta$ とすると、$\sigma_{i}(\gamma)$ は相異なる $n$ 個の値をとるので、$[K(\gamma):K]_{s}\ge n$。$[K(\gamma):K]\ge[K(\gamma):K]_{s}\ge n=[L:K]$ で $K(\gamma)\subset L$ なので $L=K(\gamma)$。
:::

::: hypcheck
- **前提「分離」**：Step 2 で埋め込みがちょうど $[L:K]$ 個あること、Step 3 の次数の比較に使った。外すと偽：$K=\mathbb{F}_{p}(s,t)$, $L=K(s^{1/p},t^{1/p})$ は $[L:K]=p^{2}$ だが、$L$ のどの元 $\gamma$ も $\gamma^{p}\in K$ をみたすので $[K(\gamma):K]\le p$、単拡大でない（\ref{fld:prob-sp-not-simple}）。
- **選択公理**：$\Omega$ を使うところ。$L$ の正規閉包の中で議論すれば不要。
:::

## 問題 {#fld:sec-sp-problems}

::: problem {#fld:prob-sp-not-simple}
$K=\mathbb{F}_{p}(s,t)$（2 変数の有理関数体）、$L=K(s^{1/p},t^{1/p})$ について、$[L:K]=p^{2}$ で $L/K$ は単拡大でないことを示せ。
:::

::: solution
**Step 1（次数）.** $t\notin\mathbb{F}_{p}(s,t)^{p}$ なので $x^{p}-t$ は $K$ 上既約（\ref{fld:perfect-separable.3}）、$[K(t^{1/p}):K]=p$。同様に $s\notin K(t^{1/p})^{p}$（$K(t^{1/p})=\mathbb{F}_{p}(s,t^{1/p})$ は $s$, $u=t^{1/p}$ の有理関数体で、$s=(g/h)^{p}$ なら $s$ についての次数の比較で矛盾）なので $[L:K(t^{1/p})]=p$。塔の公式から $p^{2}$。

**Step 2（単拡大でない）.** $L$ の元は $s^{1/p},t^{1/p}$ の $K$ 係数有理式で、フロベニウス写像は環準同型なので $\gamma^{p}\in K$（$K$ の元の $p$ 乗も $K$ に属する）。よって $\gamma$ は $x^{p}-\gamma^{p}\in K[x]$ の根で $[K(\gamma):K]\le p<p^{2}$。
:::

::: problem {#fld:prob-sp-char0-separable}
標数 $0$ の体の代数拡大は分離拡大で、有限次拡大は単拡大であることを確かめよ。例えば $\Q(\sqrt{2},\sqrt{3})=\Q(\sqrt{2}+\sqrt{3})$（\ref{fld:prob-dg-sqrt2-sqrt3}）。
:::

::: solution
標数 $0$ の体は完全体なので \ref{fld:perfect-separable.1} から分離拡大、有限次なら \ref{fld:primitive-element} から単拡大。
:::

::: supplement
**高い視点.** 分離次数は「$\Omega$ の中に $L$ を置く置き方の数」で、分離性は「置き方が次数ぶんだけ（最大限）ある」ことである。非分離性は標数 $p$ の現象で、幾何的には「フロベニウス写像で潰れる方向」（無限小の厚み）に対応する。テンソル積の言葉では、$L/K$ が分離的 $\iff L\otimes_{K}\Omega$ が被約（実は $\Omega^{[L:K]}$）であり、非分離なら冪零元が現れる（\ref{ring:tensor-not-reduced}。\ref{fld:page-etale-algebras} で扱う）。
:::
