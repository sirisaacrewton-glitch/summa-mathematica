# 代数閉包 {#fld:page-algebraic-closure keywords="algebraically closed field, algebraic closure, existence of algebraic closure (Artin), uniqueness of algebraic closure, extension of embeddings into an algebraically closed field, algebraic closure inside an algebraically closed field"}

定数でない多項式がすべて根をもつ体を**代数的閉体**といい（\ref{fld:algebraically-closed}）、$K$ の代数拡大で代数的閉体であるものを $K$ の**代数閉包**という。このページでは、代数閉包が存在すること（アルティンの構成、\ref{fld:algebraic-closure-existence}）と、同型を除いて一意であること（\ref{fld:algebraic-closure-uniqueness}）を、選択公理（極大イデアルの存在とツォルンの補題）を使って示す。一意性の証明から、任意の代数拡大は代数閉包の中に埋め込めることもわかる（\ref{fld:embedding-algebraic-closure}）。以後、体の有限次拡大の比較や共役の議論は、すべて一つの代数閉包の中で行える。

> 雪江明彦『代数学 2』第 3 章 §3.2 を参考にした。存在の証明は、無限個の変数の多項式環の極大イデアルによるアルティンの方法を、体の鎖の和集合で仕上げる形にした。

## 記法と定義の確認 {#fld:sec-ac-notation}

::: notation
- 代数拡大・推移性・相対代数閉包・延長の補題・分解体は \ref{fld:minimal-polynomial}, \ref{fld:algebraic-transitive}, \ref{fld:relative-algebraic-closure}, \ref{fld:extension-simple}, \ref{fld:splitting-field-existence}。
- 集合 $X$ を変数とする多項式環 $K[X]$：各元は有限個の変数の多項式（有限部分集合 $Y\subset X$ について $K[Y]$ の和集合）。代入の普遍性は有限個の変数ごとに \ref{ring:multivariate-universal} を使う。極大イデアルの存在は \ref{ring:maximal-ideal-existence}、ツォルンの補題は \tref{set:zorn}。
- **選択公理**：存在（極大イデアルの存在と、可算個の構成の選択）と一意性・埋め込み（ツォルンの補題）で使う。
:::

## 代数的閉体 {#fld:sec-ac-closed}

::: definition 代数的閉体・代数閉包 {#fld:algebraically-closed keywords="algebraically closed field, algebraic closure" index="代数的閉体|だいすうてきへいたい, 代数閉体|だいすうへいたい, 代数閉包|だいすうへいほう"}
体 $\Omega$ の定数でない多項式 $g\in\Omega[x]$ がすべて $\Omega$ に根をもつとき、$\Omega$ を**代数的閉体**という。体 $K$ の代数拡大 $E$ が代数的閉体であるとき、$E$ を $K$ の**代数閉包**という。
:::

::: proposition 代数的閉体の言い換え {#fld:algebraically-closed-equivalent keywords="algebraically closed iff every polynomial splits iff no proper algebraic extension; algebraically closed fields are infinite" index="代数的閉体の特徴付け|だいすうてきへいたいのとくちょうづけ"}
体 $\Omega$ について次は同値。
1. $\Omega$ は代数的閉体。
2. 定数でない $g\in\Omega[x]$ はすべて $\Omega[x]$ で一次式の積に分解する。
3. $\Omega[x]$ の既約多項式は一次式だけ。
4. $\Omega$ の代数拡大は $\Omega$ 自身だけ。

また、代数的閉体は無限体である。
:::

::: proof
**Step 1（1⇒2）.** 次数の帰納法：根 $a$ で $g=(x-a)h$（因数定理 \ref{ring:factor-theorem}）とし、$h$ に繰り返す。

**Step 2（2⇒3⇒4）.** 既約多項式が一次式の積なら、それ自身一次式。代数拡大 $L/\Omega$ の元 $\alpha$ の最小多項式は既約なので一次式 $x-a$、$\alpha=a\in\Omega$。

**Step 3（4⇒1）.** 定数でない $g$ の既約因子 $f$ について、根の添加（\ref{fld:kronecker}）$\Omega[x]/(f)$ は $\Omega$ の有限次（代数）拡大なので $\Omega$ 自身、すなわち $\deg f=1$ で $g$ は $\Omega$ に根をもつ。

**Step 4（無限）.** 有限体 $\Omega=\{a_{1},\dots,a_{q}\}$ なら $g=\prod_{i}(x-a_{i})+1$ は $\Omega$ のどの元でも値 $1$ で根がない。
:::

::: lemma 代数閉包の判定 {#fld:algebraic-closure-criterion keywords="an algebraic extension in which every polynomial over K splits is algebraically closed" index="代数閉包の判定|だいすうへいほうのはんてい"}
$E/K$ が代数拡大で、定数でない $f\in K[x]$ がすべて $E$ で分解するなら、$E$ は代数的閉体（したがって $K$ の代数閉包）。
:::

::: proof
代数拡大 $L/E$ の元 $\beta$ は、推移性（\ref{fld:algebraic-transitive}）から $K$ 上代数的で、その $K$ 上の最小多項式 $h$ は $E$ で分解するので、$h(\beta)=0$ から $\beta$ は $E$ の元（$L$ は整域なので $\prod(\beta-e_{i})=0$ ならある $\beta=e_{i}$）。\ref{fld:algebraically-closed-equivalent.4}⇒1。
:::

::: proposition 代数的閉体の中の代数閉包 {#fld:algebraic-closure-in-acf keywords="the algebraic elements over F in an algebraically closed field form an algebraic closure of F" index="代数的閉体の中の代数閉包|だいすうてきへいたいのなかのだいすうへいほう"}
代数的閉体 $\Omega$ とその部分体 $F$ について、$F$ 上代数的な $\Omega$ の元全体 $\bar F^{\Omega}$ は $F$ の代数閉包である。
:::

::: proof
$\bar F^{\Omega}$ は部分体（\ref{fld:relative-algebraic-closure}）で $F$ 上代数的。$f\in F[x]$ は $\Omega$ で分解し（\ref{fld:algebraically-closed-equivalent.2}）、その根は $F$ 上代数的なので $\bar F^{\Omega}$ に属する。\ref{fld:algebraic-closure-criterion} から代数的閉体。
:::

## 存在 {#fld:sec-ac-existence}

::: lemma すべての多項式に根を与える拡大 {#fld:artin-step keywords="Artin's construction: an algebraic extension in which every polynomial over K has a root" index="アルティンの構成|あるてぃんのこうせい"}
（AC）体 $K$ について、代数拡大 $K_{1}/K$ で、定数でない $f\in K[x]$ がすべて $K_{1}$ に根をもつものがある。
:::

::: proof
**Step 1（多項式環とイデアル）.** 定数でないモニックな $f\in K[x]$ ごとに変数 $x_{f}$ を用意し、それらの集合を $X$ とする。$A\defeq K[X]$ のイデアル $I\defeq(f(x_{f}) : f)$ を考える。

**Step 2（$I\neq A$）.** $1\in I$ なら $1=\sum_{j=1}^{m}g_{j}f_{j}(x_{f_{j}})$（$g_{j}\in A$、有限個の変数しか現れない）。$f_{1}\cdots f_{m}$ の分解体 $L$（\ref{fld:splitting-field-existence}）で $f_{j}$ の根 $\alpha_{j}$ をとり、$x_{f_{j}}\mapsto\alpha_{j}$、他の変数 $\mapsto 0$ と代入すると $1=0$ となり矛盾。

**Step 3（剰余体）.** $I$ を含む極大イデアル $\mathfrak{m}$（\ref{ring:maximal-ideal-existence}）をとり $K_{1}\defeq A/\mathfrak{m}$ とする。$K\to K_{1}$ は体の準同型なので単射で、$K_{1}$ は $K$ の拡大体。$\bar x_{f}$ は $f$ の根なので $K$ 上代数的で、$K_{1}$ はそれらで生成されるので代数拡大（\ref{fld:relative-algebraic-closure}：代数的な元の全体は部分体で生成元を含む）。
:::

::: theorem 代数閉包の存在 {#fld:algebraic-closure-existence keywords="every field has an algebraic closure" index="代数閉包の存在|だいすうへいほうのそんざい"}
（AC）すべての体は代数閉包をもつ。
:::

::: proof
**Step 1（鎖）.** $K_{0}\defeq K$ とし、\ref{fld:artin-step} を繰り返して $K_{0}\subset K_{1}\subset K_{2}\subset\cdots$（$K_{n+1}/K_{n}$ は代数拡大で、$K_{n}[x]$ の定数でない多項式はすべて $K_{n+1}$ に根をもつ）を作る（従属選択公理）。$E\defeq\bigcup_{n}K_{n}$ は体（任意の二元は同じ $K_{n}$ に入る）。

**Step 2（代数的閉）.** 定数でない $g\in E[x]$ の係数は有限個なので、ある $K_{n}$ に入り、$g$ は $K_{n+1}\subset E$ に根をもつ。

**Step 3（代数拡大）.** 推移性（\ref{fld:algebraic-transitive}）と帰納法で $K_{n}/K$ は代数拡大、よって $E/K$ も代数拡大。
:::

## 一意性と埋め込み {#fld:sec-ac-uniqueness}

::: theorem 代数的閉体への埋め込み {#fld:embedding-algebraic-closure keywords="an embedding of K into an algebraically closed field extends to any algebraic extension of K" index="代数的閉体への埋め込み|だいすうてきへいたいへのうめこみ"}
（AC）$L/K$ を代数拡大、$\Omega$ を代数的閉体、$\sigma\colon K\to\Omega$ を体の準同型とする。$\sigma$ は体の準同型 $\tau\colon L\to\Omega$ に延長できる。
:::

::: proof
**Step 1（ツォルン）.** 組 $(M,\tau)$（$K\subset M\subset L$ は中間体、$\tau\colon M\to\Omega$ は $\sigma$ の延長）全体に「$M\subset M'$ かつ $\tau'|_{M}=\tau$」で順序を入れる。$(K,\sigma)$ を含み空でない。鎖 $(M_{\lambda},\tau_{\lambda})$ について、$M^{*}=\bigcup M_{\lambda}$ は中間体で、$\tau^{*}(a)\defeq\tau_{\lambda}(a)$（$a\in M_{\lambda}$）は矛盾なく定まる体の準同型なので上界。\ref{set:zorn}から極大元 $(M,\tau)$ がある。

**Step 2（$M=L$）.** $\alpha\in L\setminus M$ があれば、$\alpha$ は $M$ 上代数的で、その最小多項式 $f$ について $f^{\tau}\in\tau(M)[x]$ は $\Omega$ に根をもつ。\ref{fld:extension-simple} から $\tau$ は $M(\alpha)\to\Omega$ に延長でき、極大性に反する。
:::

::: theorem 代数閉包の一意性 {#fld:algebraic-closure-uniqueness keywords="algebraic closures are unique up to isomorphism; an isomorphism of fields extends to their algebraic closures" index="代数閉包の一意性|だいすうへいほうのいちいせい"}
（AC）$\sigma\colon F\to F'$ を体の同型、$E$, $E'$ をそれぞれ $F$, $F'$ の代数閉包とする。$\sigma$ は同型 $\tau\colon E\to E'$ に延長できる。特に、体の二つの代数閉包は $F$ の上で同型である。
:::

::: proof
\ref{fld:embedding-algebraic-closure}（$L=E$, $\Omega=E'$）から延長 $\tau\colon E\to E'$ がある。$\tau(E)\cong E$ は代数的閉体で、$E'$ は $F'=\sigma(F)\subset\tau(E)$ 上代数的なので $\tau(E)$ 上も代数的。\ref{fld:algebraically-closed-equivalent.4} から $E'=\tau(E)$。
:::

::: example
1. $\C$ は代数的閉体（代数学の基本定理。\tref{fld:fundamental-theorem-algebra} でガロア理論を使って証明する）。これを認めると、代数的数の体 $\bar{\Q}_{\C}$（\ref{fld:relative-algebraic-closure}）は $\Q$ の代数閉包（\ref{fld:algebraic-closure-in-acf}）で、$\R$ の代数閉包は $\C$。
2. 有限体は代数的閉体でない（\ref{fld:algebraically-closed-equivalent}）。$\mathbb{F}_{p}$ の代数閉包は無限次の代数拡大である。
:::

## 問題 {#fld:sec-ac-problems}

::: problem {#fld:prob-ac-countable}
$K$ が可算体なら、$K$ の代数閉包は可算であることを示せ（$\bar{\Q}$ は可算で、したがって $\C$ より真に小さい）。
:::

::: solution
$K[x]$ は可算（次数 $n$ の多項式全体は $K^{n+1}$ と同じ濃度で可算、その可算和）。代数閉包 $E$ の元は、ある定数でない $f\in K[x]$ の根で、各 $f$ の根は $\deg f$ 個以下（\ref{ring:factor-theorem}）。よって $E$ は可算集合の可算和で可算（選択公理を可算個使う）。$\C$ は非可算なので $\bar{\Q}_{\C}\neq\C$。
:::

::: supplement
**選択公理について.** 存在と一意性の証明では選択公理を本質的に使った。\ref{fld:prob-ac-countable} の可算体の場合は、変数を可算個に並べて構成を具体的に行えば選択公理を避けられる。

**高い視点.** 代数閉包は「$K$ 上のすべての有限次拡大を同時に含む」普遍的な場所で、\ref{fld:embedding-algebraic-closure} は「有限次拡大（より一般に代数拡大）$L/K$ から $\bar K$ への $K$ 埋め込みは必ず存在する」ことを言う。この埋め込みの集合 $\Hom_{K}(L,\bar K)$ に $\bar K$ の自己同型群 $\operatorname{Aut}(\bar K/K)$ が作用する、という見方が、グロタンディーク流のガロア理論（\ref{fld:page-grothendieck-galois}）の出発点である。
:::
