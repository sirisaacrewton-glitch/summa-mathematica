# 分解体 {#fld:page-splitting-fields keywords="splitting field, existence and uniqueness of splitting fields, extension of isomorphisms, number of extensions bounded by degree, conjugates"}

多項式 $f\in K[x]$ が一次式の積に分解し、かつその根で生成される拡大体を $f$ の**分解体**という（\ref{fld:splitting-field}）。分解体はクロネッカーの構成（\ref{fld:kronecker}）を繰り返して作れ（\ref{fld:splitting-field-existence}）、同型を除いて一意である（\ref{fld:splitting-field-uniqueness}）。一意性の証明の核心は「体の同型 $\sigma\colon K\to K'$ は、根を対応する根に移すことで単拡大へ延長できる」こと（\ref{fld:extension-simple}）で、延長の個数は拡大次数以下になる（\ref{fld:extension-count}）。この個数の評価は、のちにガロア群の位数を拡大次数で抑えるのに使う。

> 雪江明彦『代数学 2』第 3 章 §3.2 を参考にした。

## 記法と定義の確認 {#fld:sec-sf-notation}

::: notation
- 拡大体・次数・塔の公式・単拡大の構造・根の添加・代数拡大は \ref{fld:extension}, \ref{fld:tower-law}, \ref{fld:simple-extension}, \ref{fld:kronecker}, \ref{fld:page-algebraic-extensions}。
- 体の準同型 $\sigma\colon K\to K'$ と $f=\sum a_{i}x^{i}\in K[x]$ について $f^{\sigma}\defeq\sum\sigma(a_{i})x^{i}\in K'[x]$。$f\mapsto f^{\sigma}$ は環準同型で、$\sigma$ が同型なら同型 $K[x]\cong K'[x]$（既約性・次数・モニック性を保つ）。
- 拡大 $L/K$, $L'/K$ について、$K$ の元を動かさない体の準同型 $L\to L'$ を **$K$ 準同型**という。
- 「$f$ が $L$ で分解する」とは、$f=c\prod_{i}(x-\alpha_{i})$（$c\in K$, $\alpha_{i}\in L$）と書けること。
- **選択公理**：使わない。
:::

## 同型の延長 {#fld:sec-sf-extension}

::: lemma 単拡大への延長 {#fld:extension-simple keywords="an isomorphism K -> K' extends to K(alpha) -> K'(beta) sending alpha to a root beta of f^sigma" index="同型の延長|どうけいのえんちょう"}
$\sigma\colon K\to K'$ を体の同型、$\alpha$ を $K$ 上代数的で最小多項式が $f$ の元、$\Omega$ を $K'$ の拡大体とする。$K(\alpha)\to\Omega$ への $\sigma$ の延長（$\tau|_{K}=\sigma$ となる体の準同型 $\tau$）は、$\tau\mapsto\tau(\alpha)$ によって $\Omega$ における $f^{\sigma}$ の根と一対一に対応する。特に延長の個数は $f^{\sigma}$ の $\Omega$ における相異なる根の個数で、$\deg f=[K(\alpha):K]$ 以下。
:::

::: proof
**Step 1（根に移る）.** 延長 $\tau$ について $0=\tau(f(\alpha))=f^{\sigma}(\tau(\alpha))$。$K(\alpha)=K[\alpha]$（\ref{fld:simple-extension}）の元は $g(\alpha)$ と書けるので $\tau(g(\alpha))=g^{\sigma}(\tau(\alpha))$ で、$\tau$ は $\tau(\alpha)$ で決まる（単射）。

**Step 2（全射）.** $\beta\in\Omega$ を $f^{\sigma}$ の根とする。$K[x]\xrightarrow{g\mapsto g^{\sigma}}K'[x]\xrightarrow{h\mapsto h(\beta)}\Omega$ の合成 $\psi$ の核は $f$ を含み、$(f)$ は極大イデアル、$\psi(1)=1\neq 0$ なので核は $(f)$。$K[x]/(f)\cong K(\alpha)$（$x\mapsto\alpha$）を通して $\tau\colon K(\alpha)\to\Omega$, $g(\alpha)\mapsto g^{\sigma}(\beta)$ が定まり、$\tau|_{K}=\sigma$, $\tau(\alpha)=\beta$。

**Step 3（個数）.** $f^{\sigma}$ は次数 $\deg f$ の多項式なので、整域 $\Omega$ での根は $\deg f$ 個以下（因数定理 \ref{ring:factor-theorem}）。
:::

::: theorem 延長の個数 {#fld:extension-count keywords="number of extensions of an embedding to a finite extension is at most the degree; extensions exist when the target contains splitting data" index="延長の個数|えんちょうのこすう"}
$L/K$ を有限次拡大、$\sigma\colon K\to\Omega$ を体の準同型とする。
1. $\sigma$ の $L\to\Omega$ への延長の個数は $[L:K]$ 以下。
2. $L=K(\alpha_{1},\dots,\alpha_{n})$ で、各 $\alpha_{i}$ の $K$ 上の最小多項式 $f_{i}$ について $f_{i}^{\sigma}$ が $\Omega$ で分解するなら、延長は少なくとも一つ存在する。
:::

::: proof
**Step 1（1）.** $[L:K]$ についての帰納法。$L=K$ なら $1$ 個。$\alpha\in L\setminus K$ をとり $K_{1}=K(\alpha)$ とする。延長 $\tau\colon L\to\Omega$ は $\tau|_{K_{1}}$ で分類され、\ref{fld:extension-simple} から $\tau|_{K_{1}}$ の候補は $[K_{1}:K]$ 個以下、各候補 $\sigma_{1}$ について $\sigma_{1}$ の $L$ への延長は帰納法の仮定（$[L:K_{1}]<[L:K]$、$\sigma_{1}\colon K_{1}\to\Omega$ に適用）から $[L:K_{1}]$ 個以下。合計 $[K_{1}:K][L:K_{1}]=[L:K]$ 個以下（\ref{fld:tower-law}）。

**Step 2（2）.** $n$ についての帰納法。$K_{1}=K(\alpha_{1})$ への延長 $\sigma_{1}$ は、$f_{1}^{\sigma}$ の $\Omega$ における根 $\beta$ をとれば \ref{fld:extension-simple}（$\sigma\colon K\to\sigma(K)$ を同型とみなし、$\Omega$ は $\sigma(K)$ の拡大体）から存在する。$\alpha_{i}$（$i\ge 2$）の $K_{1}$ 上の最小多項式 $g_{i}$ は $f_{i}$ を割り切るので、$g_{i}^{\sigma_{1}}$ は $f_{i}^{\sigma}$ を割り切り、$\Omega$ で分解する（$\Omega[x]$ は一意分解環で、一次式の積の約元は一次式の積の定数倍）。$L=K_{1}(\alpha_{2},\dots,\alpha_{n})$ に帰納法の仮定を使う。
:::

## 分解体 {#fld:sec-sf-splitting}

::: definition 分解体 {#fld:splitting-field keywords="splitting field of a polynomial" index="分解体|ぶんかいたい, 最小分解体|さいしょうぶんかいたい"}
定数でない $f\in K[x]$ について、$K$ の拡大体 $L$ が次をみたすとき、$L$ を $f$ の $K$ 上の**分解体**という。
1. $f$ は $L$ で分解する：$f=c(x-\alpha_{1})\cdots(x-\alpha_{n})$, $\alpha_{i}\in L$。
2. $L=K(\alpha_{1},\dots,\alpha_{n})$。
:::

::: theorem 分解体の存在 {#fld:splitting-field-existence keywords="existence of splitting fields, degree at most n!" index="分解体の存在|ぶんかいたいのそんざい"}
次数 $n\ge 1$ の $f\in K[x]$ は分解体 $L$ をもち、$[L:K]\le n!$。
:::

::: proof
$n$ についての帰納法。根の添加（\ref{fld:kronecker}）で $f$ の根 $\alpha_{1}$ をもつ拡大 $K_{1}=K(\alpha_{1})$、$[K_{1}:K]\le n$ をとる。因数定理から $K_{1}[x]$ で $f=(x-\alpha_{1})g$, $\deg g=n-1$。$n=1$ なら $K_{1}=K$ が分解体。$n\ge 2$ なら帰納法の仮定から $g$ の $K_{1}$ 上の分解体 $L=K_{1}(\alpha_{2},\dots,\alpha_{n})$, $[L:K_{1}]\le(n-1)!$ がある。$f$ は $L$ で分解し、$L=K(\alpha_{1},\dots,\alpha_{n})$、塔の公式から $[L:K]\le n!$。
:::

::: theorem 分解体の一意性 {#fld:splitting-field-uniqueness keywords="splitting fields are unique up to isomorphism; isomorphism of base fields extends to splitting fields" index="分解体の一意性|ぶんかいたいのいちいせい"}
$\sigma\colon K\to K'$ を体の同型、$f\in K[x]$ を定数でない多項式、$L$ を $f$ の $K$ 上の分解体、$L'$ を $f^{\sigma}$ の $K'$ 上の分解体とする。$\sigma$ は同型 $\tau\colon L\to L'$ に延長でき、その個数は $[L:K]$ 以下。特に（$\sigma=\id$ として）$f$ の分解体は $K$ 同型を除いて一意。
:::

::: proof
**Step 1（延長の存在）.** $L=K(\alpha_{1},\dots,\alpha_{n})$（$\alpha_{i}$ は $f$ の根）。各 $\alpha_{i}$ の最小多項式 $f_{i}$ は $f$ を割り切るので、$f_{i}^{\sigma}$ は $f^{\sigma}$ を割り切り $L'$ で分解する。\ref{fld:extension-count.2}（$\Omega=L'$）から延長 $\tau\colon L\to L'$ がある。

**Step 2（全射）.** $f=c\prod(x-\alpha_{i})$ から $f^{\sigma}=\sigma(c)\prod(x-\tau(\alpha_{i}))$ で、$L'$ は整域なので $f^{\sigma}$ の $L'$ における根は $\tau(\alpha_{i})$ だけ。$L'$ はそれらで $K'$ 上生成されるので $L'=K'(\tau(\alpha_{1}),\dots)=\tau(L)$。$\tau$ は単射なので同型。個数は \ref{fld:extension-count.1}。
:::

::: example
1. $x^{2}-2$ の $\Q$ 上の分解体は $\Q(\sqrt{2})$（根は $\pm\sqrt{2}$）、次数 $2$。
2. $x^{3}-2$ の $\Q$ 上の分解体（$\C$ の中でとる）は $L=\Q(\sqrt[3]{2},\omega)$（$\omega=e^{2\pi\sqrt{-1}/3}$。根は $\sqrt[3]{2},\sqrt[3]{2}\omega,\sqrt[3]{2}\omega^{2}$）。$[\Q(\sqrt[3]{2}):\Q]=3$ で、$\omega\notin\R\supset\Q(\sqrt[3]{2})$ は $x^{2}+x+1$ の根なので $[L:\Q(\sqrt[3]{2})]=2$、$[L:\Q]=6=3!$。
3. $x^{p}-1$（$p$ 素数）の $\Q$ 上の分解体は $\Q(\zeta)$（$\zeta=e^{2\pi\sqrt{-1}/p}$）で、次数は $p-1$（$g\defeq\frac{x^{p}-1}{x-1}=x^{p-1}+\cdots+1$ について $g(x+1)=\frac{(x+1)^{p}-1}{x}=\sum_{k=1}^{p}\binom{p}{k}x^{k-1}$ で、$1\le k\le p-1$ の $\binom{p}{k}$ は $p$ の倍数、定数項 $\binom{p}{1}=p$ は $p^{2}$ の倍数でないので、アイゼンシュタインの判定法 \tref{ring:eisenstein} から $g(x+1)$、したがって $g$ は既約）。
:::

## 問題 {#fld:sec-sf-problems}

::: problem {#fld:prob-sf-x4-2}
$x^{4}-2$ の $\Q$ 上の分解体 $L$ を求め、$[L:\Q]=8$ を示せ。
:::

::: solution
根は $\pm\alpha$, $\pm i\alpha$（$\alpha=\sqrt[4]{2}>0$）なので $L=\Q(\alpha,i)$。$x^{4}-2$ はアイゼンシュタイン（$p=2$）で既約なので $[\Q(\alpha):\Q]=4$。$\Q(\alpha)\subset\R$ なので $i\notin\Q(\alpha)$ で、$i$ は $x^{2}+1$ の根なので $[L:\Q(\alpha)]=2$。塔の公式から $8$。
:::

::: problem {#fld:prob-sf-finite-field-4}
$x^{2}+x+1$ の $\mathbb{F}_{2}$ 上の分解体は 4 元からなる体であることを示せ。
:::

::: solution
$\mathbb{F}_{2}$ に根がない（$0,1$ で値 $1$）ので 2 次の既約多項式で、$L=\mathbb{F}_{2}[x]/(x^{2}+x+1)=\mathbb{F}_{2}(\alpha)$ は次数 2、元は $0,1,\alpha,\alpha+1$。$\alpha^{2}=\alpha+1$ なので $x^{2}+x+1=(x-\alpha)(x-(\alpha+1))$（係数比較：$\alpha+(\alpha+1)=1$, $\alpha(\alpha+1)=\alpha^{2}+\alpha=1$）。よって $L$ で分解し、$L$ が分解体。
:::

::: supplement
**高い視点.** 分解体の一意性は「同型を除いて」であり、同型の取り方は一意でない。この「取り方の自由度」を集めたものが、$L$ の $K$ 自己同型の群（ガロア群）である。\ref{fld:extension-count} の「延長は $[L:K]$ 個以下」は「自己同型の個数は次数以下」を意味し、等号が成り立つ拡大がガロア拡大（\ref{fld:page-artin}）である。等号が崩れる原因は二つあり、根が $\Omega$ に足りないこと（正規性の欠如。\ref{fld:page-normal}）と、根が重なること（分離性の欠如。\ref{fld:page-separable}）である。

**計算の観点.** 分解体を実際に構成するには、多項式を既約因子に分解する手順が要る（\ref{fld:kronecker} の構成では既約因子を一つ選ぶ）。$\Q$ 上では、クロネッカーの方法で分解が計算でき、さらに多項式時間のアルゴリズム（LLL 格子簡約による。レンストラ・レンストラ・ロヴァース、1982 年）が知られている。有限体上については \ref{fld:page-finite-fields} の補足を参照。一方、計算可能な体の中には、多項式の既約性を判定するアルゴリズムが存在しないものがある（フレーリッヒとシェファードソン、1956 年）。いずれも本サイト未収録。
:::
