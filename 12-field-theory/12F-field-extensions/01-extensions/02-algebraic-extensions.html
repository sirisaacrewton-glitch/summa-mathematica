# 代数拡大 {#fld:page-algebraic-extensions keywords="algebraic extension, finite implies algebraic, finitely generated algebraic is finite, transitivity of algebraic extensions, relative algebraic closure, algebraic numbers, compositum"}

すべての元が代数的な拡大を**代数拡大**という（\ref{fld:minimal-polynomial}）。有限次拡大は代数拡大で、逆に「有限個の代数的な元で生成される拡大」は有限次である（\ref{fld:finite-algebraic}）。ここから、代数的な元の和・差・積・商がまた代数的であること（代数的な元の全体は部分体をなす。\ref{fld:relative-algebraic-closure}）と、代数拡大の代数拡大は代数拡大であること（\ref{fld:algebraic-transitive}）が従う。複素数のうち $\Q$ 上代数的なもの全体（代数的数）は体で、$\Q$ 上無限次の代数拡大の例になる。

> 雪江明彦『代数学 2』第 3 章 §3.1 を参考にした。

## 記法と定義の確認 {#fld:sec-ae-notation}

::: notation
- 拡大体・次数・塔の公式・生成された部分体・最小多項式・単拡大の構造は \ref{fld:extension}, \ref{fld:tower-law}, \ref{fld:generated-subfield}, \ref{fld:minimal-polynomial}, \ref{fld:simple-extension}、次数による制限は \ref{fld:degree-divides}。
- **選択公理**：使わない（次数が無限になるところでも、有限部分の議論しか使わない）。
:::

## 有限次と代数的 {#fld:sec-ae-finite}

::: theorem 有限次拡大と代数拡大 {#fld:finite-algebraic keywords="finite extensions are algebraic; L = K(alpha_1,...,alpha_n) with algebraic alpha_i is finite; finite iff finitely generated and algebraic" index="有限次拡大と代数拡大|ゆうげんじかくだいとだいすうかくだい"}
1. 有限次拡大は代数拡大である。
2. $\alpha_{1},\dots,\alpha_{n}\in L$ が $K$ 上代数的なら、$K(\alpha_{1},\dots,\alpha_{n})=K[\alpha_{1},\dots,\alpha_{n}]$ は $K$ 上有限次で、次数は $\prod_{i}[K(\alpha_{i}):K]$ 以下。
3. $L/K$ が有限次 $\iff$ $L$ は $K$ 上有限個の代数的な元で生成される。
:::

::: proof
**Step 1（1）.** \ref{fld:degree-divides}。

**Step 2（2）.** $K_{0}=K$, $K_{i}=K_{i-1}(\alpha_{i})$ とする。$\alpha_{i}$ は $K$ 上代数的なので $K_{i-1}$ 上も代数的（$K$ 係数の多項式は $K_{i-1}$ 係数）で、$K_{i-1}$ 上の最小多項式は $K$ 上の最小多項式を割り切る（\ref{fld:minimal-polynomial-properties.1}）。\ref{fld:simple-extension} から $K_{i}=K_{i-1}[\alpha_{i}]$ で $[K_{i}:K_{i-1}]\le[K(\alpha_{i}):K]$。\ref{fld:tower-law}で掛け合わせる。$K_{n}=K[\alpha_{1},\dots,\alpha_{n}]$ は帰納的に $K_{i}=K_{i-1}[\alpha_{i}]$ から。

**Step 3（3）.** ⇒：$K$ 上の基底（有限個、1 から代数的）で生成される。⇐：2。
:::

::: corollary 代数的な元の全体 {#fld:relative-algebraic-closure keywords="the algebraic elements of L over K form a subfield (relative algebraic closure); algebraic numbers form a field" index="相対代数閉包|そうたいだいすうへいほう, 代数的数|だいすうてきすう"}
拡大 $L/K$ について、$K$ 上代数的な $L$ の元全体 $\bar K_{L}$ は $L$ の部分体である。これを $L$ における $K$ の**相対代数閉包**という。特に、$\C$ の元で $\Q$ 上代数的なもの（**代数的数**）全体 $\bar{\Q}_{\C}$ は体である。
:::

::: proof
$\alpha,\beta\in\bar K_{L}$ なら、$K(\alpha,\beta)$ は有限次（\ref{fld:finite-algebraic.2}）なので、その元 $\alpha\pm\beta$, $\alpha\beta$, $\alpha^{-1}$（$\alpha\neq 0$）はすべて $K$ 上代数的（同 1）。$K\subset\bar K_{L}$。
:::

::: theorem 代数拡大の推移性 {#fld:algebraic-transitive keywords="if M/L and L/K are algebraic then M/K is algebraic" index="代数拡大の推移性|だいすうかくだいのすいいせい"}
$K\subset L\subset M$ で $M/L$ と $L/K$ が代数拡大なら、$M/K$ も代数拡大である。
:::

::: proof
$\gamma\in M$ の $L$ 上の最小多項式を $x^{n}+c_{n-1}x^{n-1}+\cdots+c_{0}$ とする。$L'\defeq K(c_{0},\dots,c_{n-1})$ は有限個の代数的な元で生成されるので $K$ 上有限次（\ref{fld:finite-algebraic.2}）。$\gamma$ は $L'$ 上代数的なので $[L'(\gamma):L']<\infty$、塔の公式から $[L'(\gamma):K]<\infty$。よって $\gamma\in L'(\gamma)$ は $K$ 上代数的（同 1）。
:::

::: example 無限次の代数拡大
代数的数の体 $\bar{\Q}_{\C}$ は $\Q$ 上の代数拡大だが、$[\bar{\Q}_{\C}:\Q]=\infty$：各 $n\ge 1$ で $x^{n}-2$ は $p=2$ の\ref{ring:eisenstein}とガウスの補題（\ref{ring:gauss-irreducible}）から $\Q[x]$ で既約なので、その実根 $\sqrt[n]{2}$ の次数は $n$ で、$[\bar{\Q}_{\C}:\Q]\ge n$（\ref{fld:degree-divides} の対偶と塔の公式）。したがって「代数拡大 ⇒ 有限次」は成り立たない。
:::

## 合成体 {#fld:sec-ae-compositum}

::: definition 合成体 {#fld:compositum keywords="compositum of two subfields" index="合成体|ごうせいたい"}
体 $\Omega$ の部分体 $L,M$ について、$L\cup M$ で生成される部分体 $LM\defeq L(M)=M(L)$ を $L$ と $M$ の**合成体**という。
:::

::: proposition 合成体の次数 {#fld:compositum-degree keywords="[LM:K] <= [L:K][M:K]; LM = L[M] for finite M/K" index="合成体の次数|ごうせいたいのじすう"}
$K\subset L,M\subset\Omega$ で $[M:K]=m<\infty$ とする。$M$ の $K$ 上の基底 $v_{1},\dots,v_{m}$ について、$LM=\{\sum_{j}l_{j}v_{j} : l_{j}\in L\}$ で、$[LM:L]\le m$。特に $[L:K]<\infty$ なら $[LM:K]\le[L:K][M:K]$。
:::

::: proof
**Step 1.** 右辺 $V\defeq\sum_{j}Lv_{j}$ は $L$ と $M$ を含み（$M=\sum Kv_{j}$）、和で閉じ、積でも閉じる：$v_{j}v_{k}\in M=\sum Kv_{l}$ なので $(lv_{j})(l'v_{k})\in V$。よって $V$ は $L$ 上有限次元の整域（体の部分環）。

**Step 2.** 有限次元の整域 $V$ は体：$0\neq v\in V$ について $V\to V$, $w\mapsto vw$ は $L$ 線形な単射なので全射で、$vw=1$ となる $w$ がある。よって $V$ は $L\cup M$ を含む部分体で、明らかに最小、$V=LM$。$[LM:L]\le m$ と塔の公式から後半。
:::

## 問題 {#fld:sec-ae-problems}

::: problem {#fld:prob-ae-degree-6}
$[\Q(\sqrt{2},\sqrt[3]{2}):\Q]=6$ を示せ。
:::

::: solution
$L=\Q(\sqrt{2},\sqrt[3]{2})$ は $\Q(\sqrt{2})$（次数 2）と $\Q(\sqrt[3]{2})$（次数 3）を含むので、塔の公式から $2\mid[L:\Q]$ かつ $3\mid[L:\Q]$、よって $6\mid[L:\Q]$。一方 \ref{fld:compositum-degree} から $[L:\Q]\le 6$。
:::

::: problem {#fld:prob-ae-square-root-transcendental}
$K(t)$ を有理関数体とする。$K(t)/K(t^{2})$ は次数 $2$ の拡大で、$K(t^{2})/K$ は代数拡大でないことを示せ。
:::

::: solution
$t$ は $x^{2}-t^{2}\in K(t^{2})[x]$ の根で $K(t^{2})(t)=K(t)$ なので $[K(t):K(t^{2})]\le 2$。$t\in K(t^{2})$ なら $t=g(t^{2})/h(t^{2})$ で、$th(t^{2})=g(t^{2})$ の左辺は奇数次の項だけ、右辺は偶数次の項だけなので $g=h=0$ となり矛盾。よって次数 2。$t^{2}$ は $K$ 上超越的（$t$ が超越的なので、$g(t^{2})=0$ なら $g=0$）なので $K(t^{2})/K$ は代数拡大でない。
:::

::: supplement
**高い視点.** \ref{fld:finite-algebraic.3} は、環論の「有限生成かつ整 ⇔ 有限加群」（\ref{ring:page-integral-extensions}）の体の場合である：体上では「代数的」と「整」は同じ（最小多項式をモニックにできる）。相対代数閉包は整閉包の類似で、代数閉包（\ref{fld:page-algebraic-closure}）は「代数拡大で、それ以上代数的に大きくできない」体として次の次のページで構成する。
:::
