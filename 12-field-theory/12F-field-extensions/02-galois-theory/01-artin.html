# アルティンの定理とガロア拡大 {#fld:page-artin keywords="Dedekind independence of characters, Artin's theorem [L:L^G] = |G|, Galois extension, Galois group, equivalent definitions of Galois extensions: normal and separable, splitting field of a separable polynomial, fixed field"}

有限群 $G$ が体 $L$ に自己同型として作用するとき、固定体 $L^{G}$ 上の次数はちょうど $\abs{G}$ になる。これが**アルティンの定理**（\tref{fld:artin-theorem}）で、証明は線形代数（連立一次方程式の解の存在）と、相異なる自己同型の一次独立性（**デデキントの補題**、\tref{fld:dedekind-independence}）だけを使う。有限次拡大 $L/K$ の $K$ 自己同型の個数は $[L:K]$ 以下であり（\ref{fld:extension-count}）、等号が成り立つ拡大を**ガロア拡大**という（\ref{fld:galois-extension}）。アルティンの定理と前の系列の結果から、ガロア拡大は「正規かつ分離」「分離多項式の分解体」「自己同型群の固定体が $K$」とも特徴付けられる（\ref{fld:galois-equivalent}）。

> 雪江明彦『代数学 2』第 4 章 §4.1 と、E. Artin *Galois Theory*（書名のみ。本棚にない）の考え方を参考にした。アルティンの定理を先に示し、ガロア拡大の同値な定義をそれから導く順にした。

## 記法と定義の確認 {#fld:sec-ar-notation}

::: notation
- 拡大・次数・塔の公式・延長の個数・正規性・分離性・分離次数は \ref{fld:extension}, \ref{fld:tower-law}, \ref{fld:extension-count}, \ref{fld:normal-equivalent}, \ref{fld:separable-polynomial}, \ref{fld:separable-degree}。$\Omega$ は $L$ を含む代数的閉体。
- 体 $L$ の自己同型全体のなす群を $\operatorname{Aut}(L)$、$K$ の元を固定するもの全体を $\operatorname{Aut}(L/K)$ と書く。部分群 $H\subset\operatorname{Aut}(L)$ の**固定体** $L^{H}\defeq\{a\in L : \text{すべての }\sigma\in H\text{ で }\sigma(a)=a\}$ は部分体。
- 群の作用は \ref{grp:page-group-actions}。
- **選択公理**：アルティンの定理とデデキントの補題には使わない。同値な定義のところで $\Omega$ を使う（有限次では十分大きな分解体で代用でき、不要）。
:::

## デデキントの補題 {#fld:sec-ar-dedekind}

::: lemma デデキントの補題 {#fld:dedekind-independence keywords="Dedekind's lemma: distinct characters / field embeddings are linearly independent" index="デデキントの補題|でできんとのほだい, 指標の一次独立性|しひょうのいちじどくりつせい" refname="デデキントの補題"}
$M$ をモノイド（$G$ が群のときを含む）、$L$ を体とし、$\chi_{1},\dots,\chi_{n}\colon M\to L^{\times}$ を相異なる準同型（$\chi(ab)=\chi(a)\chi(b)$）とする。$c_{1},\dots,c_{n}\in L$ がすべての $m\in M$ で $\sum_{i}c_{i}\chi_{i}(m)=0$ をみたすなら $c_{1}=\dots=c_{n}=0$。特に、体 $F$ から $L$ への相異なる準同型 $\sigma_{1},\dots,\sigma_{n}$ は（$F^{\times}$ に制限して）$L$ 上一次独立。
:::

::: proof
$n$ についての帰納法。$n=1$ なら $\chi_{1}(m)\neq 0$ から $c_{1}=0$。$n\ge 2$ で、すべては $0$ でない関係 $\sum c_{i}\chi_{i}=0$ があるとし、帰納法の仮定からすべての $c_{i}\neq 0$ としてよい。$\chi_{1}\neq\chi_{n}$ なので $\chi_{1}(a)\neq\chi_{n}(a)$ となる $a\in M$ をとる。$m$ を $am$ に替えると $\sum c_{i}\chi_{i}(a)\chi_{i}(m)=0$。元の式に $\chi_{n}(a)$ を掛けて引くと
$$
\sum_{i=1}^{n-1}c_{i}\bigl(\chi_{i}(a)-\chi_{n}(a)\bigr)\chi_{i}(m)=0
$$
で、$i=1$ の係数は $0$ でない。帰納法の仮定に反する。
:::

## アルティンの定理 {#fld:sec-ar-artin}

::: theorem アルティンの定理 {#fld:artin-theorem keywords="Artin's theorem: if G is a finite group of automorphisms of L then [L:L^G] = |G| and Aut(L/L^G) = G" index="アルティンの定理|あるてぃんのていり, 固定体|こていたい" refname="アルティンの定理"}
$G$ を体 $L$ の自己同型の有限群、$K\defeq L^{G}$ とする。$[L:K]=\abs{G}$ で、$\operatorname{Aut}(L/K)=G$。
:::

::: proof
$G=\{\sigma_{1}=\id,\sigma_{2},\dots,\sigma_{n}\}$ とする。

**Step 1（$[L:K]\ge n$）.** $[L:K]=r<n$ とし、基底 $w_{1},\dots,w_{r}$ をとる。$n$ 個の未知数 $x_{1},\dots,x_{n}$ の $r$ 本の方程式 $\sum_{i}\sigma_{i}(w_{j})x_{i}=0$（$j=1,\dots,r$）は $L$ 上で自明でない解 $(c_{i})$ をもつ（未知数が方程式より多い。\ref{mod:span-dependence}）。$a=\sum_{j}k_{j}w_{j}$（$k_{j}\in K$, $\sigma_{i}(k_{j})=k_{j}$）について $\sum_{i}c_{i}\sigma_{i}(a)=\sum_{j}k_{j}\sum_{i}c_{i}\sigma_{i}(w_{j})=0$。\ref{fld:dedekind-independence}に反する。

**Step 2（$[L:K]\le n$：設定）.** $m>n$ 個の元 $a_{1},\dots,a_{m}\in L$ が $K$ 上一次従属であることを示す。$n$ 本の方程式 $\sum_{j=1}^{m}\sigma_{i}^{-1}(a_{j})y_{j}=0$（$i=1,\dots,n$）は $L$ 上で自明でない解をもつ。$0$ でない成分の個数が最小の解 $(y_{j})$ をとり、番号を付け替えて $y_{1}=1$（全体を $y_{1}^{-1}$ 倍）とする。

**Step 3（解は $K$ に入る）.** $\tau\in G$ を解に施すと $\sum_{j}\tau\sigma_{i}^{-1}(a_{j})\tau(y_{j})=0$ で、$\tau\sigma_{i}^{-1}$ は $i$ とともに $G$ 全体を動く（$\{\sigma_{i}^{-1}\}=G$ を左から $\tau$ 倍）ので、$(\tau(y_{j}))$ も同じ方程式系の解。差 $(y_{j}-\tau(y_{j}))$ も解で、第 1 成分は $0$、$0$ でない成分は $(y_{j})$ のものに含まれる。最小性から差は $0$：$\tau(y_{j})=y_{j}$。$\tau$ は任意なので $y_{j}\in K$。

**Step 4（従属）.** $i=1$（$\sigma_{1}=\id$）の方程式は $\sum_{j}a_{j}y_{j}=0$ で、$y_{j}\in K$ は自明でない。よって $a_{1},\dots,a_{m}$ は $K$ 上一次従属で $[L:K]\le n$。

**Step 5（$\operatorname{Aut}(L/K)=G$）.** $G\subset\operatorname{Aut}(L/K)$ で、$\abs{\operatorname{Aut}(L/K)}\le[L:K]=n$（\ref{fld:extension-count.1}、$\Omega=L$）なので等しい。
:::

## ガロア拡大 {#fld:sec-ar-galois}

::: definition ガロア拡大・ガロア群 {#fld:galois-extension keywords="Galois extension, Galois group Gal(L/K)" index="ガロア拡大|がろあかくだい, ガロア群|がろあぐん"}
有限次拡大 $L/K$ で $\abs{\operatorname{Aut}(L/K)}=[L:K]$ となるものを**ガロア拡大**といい、$\operatorname{Gal}(L/K)\defeq\operatorname{Aut}(L/K)$ を**ガロア群**という。（一般に $\abs{\operatorname{Aut}(L/K)}\le[L:K]$。\ref{fld:extension-count}）
:::

::: theorem ガロア拡大の同値な定義 {#fld:galois-equivalent keywords="for a finite extension: Galois iff normal and separable iff splitting field of a separable polynomial iff K = L^{Aut(L/K) refname="ガロア拡大の同値な定義" refscope="field"}" index="ガロア拡大の特徴付け|がろあかくだいのとくちょうづけ"}
（AC）有限次拡大 $L/K$ について、次は同値である。
1. $L/K$ はガロア拡大。
2. $L/K$ は正規かつ分離的。
3. $L$ はある分離多項式 $f\in K[x]$ の $K$ 上の分解体。
4. $K=L^{\operatorname{Aut}(L/K)}$。
5. $K=L^{G}$ となる $\operatorname{Aut}(L)$ の有限部分群 $G$ がある。
:::

::: proof
**Step 1（不等式の連鎖）.** $L\subset\Omega$ とすると、$\operatorname{Aut}(L/K)$ は $\Hom_{K}(L,\Omega)$ の中の「像が $L$ になるもの」全体と一対一（$\sigma\colon L\to L$ に包含 $L\subset\Omega$ を合成。逆に像が $L$ の埋め込みは $L$ の自己同型）。よって
$$
\abs{\operatorname{Aut}(L/K)}\le\abs{\Hom_{K}(L,\Omega)}=[L:K]_{s}\le[L:K].
$$
最初の等号は「すべての埋め込みの像が $L$」、すなわち正規（\ref{fld:normal-equivalent.3}）と同値、二番目の等号は分離（\ref{fld:separable-degree.3}）と同値。よって 1 ⇔ 2。

**Step 2（2⇒3）.** $L=K(\alpha_{1},\dots,\alpha_{n})$ とし、$\alpha_{i}$ の相異なる最小多項式 $f_{1},\dots,f_{m}$ の積 $f$ をとる。各 $f_{j}$ は分離的（分離拡大）で、相異なるモニック既約多項式は共通根をもたない（共通根の最小多項式として両方に等しい）ので $f$ は分離的。正規性から $f$ は $L$ で分解し、$L$ は $f$ の根で生成されるので分解体。

**Step 3（3⇒2）.** $L$ は分解体なので正規（\ref{fld:normal-equivalent}）。$f$ の根は分離的（最小多項式が $f$ を割り切るので重根をもたない）で、$L$ はそれらで生成されるので分離拡大（\ref{fld:separable-degree.4}）。

**Step 4（1⇒4）.** $G=\operatorname{Aut}(L/K)$, $K'=L^{G}\supset K$ とする。アルティンの定理から $[L:K']=\abs{G}=[L:K]$ で、塔の公式から $[K':K]=1$。

**Step 5（4⇒5⇒1）.** 4 なら $G=\operatorname{Aut}(L/K)$（有限。\ref{fld:extension-count}）で 5。5 ならアルティンの定理から $\operatorname{Aut}(L/K)=G$, $[L:K]=\abs{G}$ で 1。
:::

::: corollary ガロア拡大と中間体 {#fld:galois-intermediate keywords="if L/K is Galois then L/M is Galois for every intermediate M; finite separable extensions lie in a Galois extension" index="ガロア拡大と中間体|がろあかくだいとちゅうかんたい, ガロア閉包|がろあへいほう"}
（AC）$L/K$ がガロア拡大で $K\subset M\subset L$ なら、$L/M$ はガロア拡大。また、有限次分離拡大 $L/K$ の正規閉包（\ref{fld:normal-closure}）はガロア拡大（**ガロア閉包**）。
:::

::: proof
前半：$L$ は分離多項式 $f\in K[x]\subset M[x]$ の $M$ 上の分解体でもある（\ref{fld:galois-equivalent.3}）。後半：正規閉包は $L$ の生成元の最小多項式（分離的）の積の分解体（\ref{fld:normal-closure} の Step 1）で、Step 2 と同じく分離多項式にとれる。
:::

::: example
1. $\Q(\sqrt{2})/\Q$：$\operatorname{Gal}=\{\id,\sigma\}$, $\sigma(\sqrt{2})=-\sqrt{2}$。
2. $\Q(\sqrt[3]{2})/\Q$ はガロアでない：$\operatorname{Aut}$ の元は $\sqrt[3]{2}$ を $x^{3}-2$ の実根、すなわち $\sqrt[3]{2}$ 自身に写すので恒等写像だけで、$1<3$。
3. $x^{3}-2$ の分解体 $L=\Q(\sqrt[3]{2},\omega)$：$[L:\Q]=6$ でガロア（標数 $0$ の分解体）。$\operatorname{Gal}(L/\Q)$ は根 $\sqrt[3]{2}\omega^{k}$（$k=0,1,2$）の置換として忠実に作用し、位数 $6$ なので $S_{3}$ 全体と同型。
4. 有限体 $\mathbb{F}_{p^{n}}/\mathbb{F}_{p}$ はガロアで、ガロア群はフロベニウスで生成される位数 $n$ の巡回群（\ref{fld:finite-field-automorphisms}）。
5. $\mathbb{F}_{p}(t)/\mathbb{F}_{p}(t^{p})$ は正規だが分離的でなく、$\operatorname{Aut}$ は自明（$t$ の行き先は $x^{p}-t^{p}=(x-t)^{p}$ の根 $t$ だけ）。
:::

## 問題 {#fld:sec-ar-problems}

::: problem {#fld:prob-ar-klein}
$L=\Q(\sqrt{2},\sqrt{3})$ について、$L/\Q$ はガロアで $\operatorname{Gal}(L/\Q)\cong\Z/2\Z\times\Z/2\Z$ を示せ。
:::

::: solution
$L$ は分離多項式 $(x^{2}-2)(x^{2}-3)$ の分解体なのでガロアで、$[L:\Q]=4$（\ref{fld:prob-dg-sqrt2-sqrt3}）。$\sigma\in\operatorname{Gal}$ は $\sqrt{2}\mapsto\pm\sqrt{2}$, $\sqrt{3}\mapsto\pm\sqrt{3}$ で決まり、4 通りの組がすべて現れる（位数 4）。各元の 2 乗は恒等写像なので、巡回群でなく $\Z/2\Z\times\Z/2\Z$。
:::

::: problem {#fld:prob-ar-fixed-field-rational}
有理関数体 $L=k(t)$ に $\sigma(t)=1/t$ で定まる位数 2 の自己同型群 $G$ を作用させる。$L^{G}=k(t+1/t)$ を示せ（$\operatorname{char}k\neq 2$ は仮定しない）。
:::

::: solution
$u\defeq t+t^{-1}\in L^{G}$。$t$ は $x^{2}-ux+1\in k(u)[x]$ の根なので $[L:k(u)]\le 2$。アルティンの定理から $[L:L^{G}]=2$ で、$k(u)\subset L^{G}$ と塔の公式から $[L^{G}:k(u)]=1$。
:::

::: supplement
**高い視点.** アルティンの定理は「有限群の作用による商」の体版で、$L\supset L^{G}$ は $L^{G}$ 上の「主 $G$ 束」のように振る舞う：$L\otimes_{L^{G}}L\cong\prod_{\sigma\in G}L$（\ref{fld:page-etale-algebras}）。ガロア拡大の定義のうち、「自己同型が最大限ある」（1）は群の側から、「正規かつ分離」（2）は多項式の根の側から、「固定体」（4・5）は不変式の側から見たもので、ガロア理論はこれらを結ぶ。
:::
