# 円分体 {#fld:page-cyclotomic keywords="roots of unity, primitive root of unity, cyclotomic polynomial, irreducibility of cyclotomic polynomials, cyclotomic field, Galois group (Z/nZ)^x, quadratic subfield of Q(zeta_p)"}

$1$ の $n$ 乗根で生成される体 $\Q(\zeta_{n})$ を**円分体**という。その $\Q$ 上の最小多項式は円分多項式 $\Phi_{n}$ で、$\Phi_{n}$ は $\Q$ 上既約である（\ref{fld:cyclotomic-irreducible}）。証明は、素数 $p\nmid n$ について「$\zeta$ の最小多項式の根は $\zeta^{p}$ も根にもつ」ことを、$p$ を法とする還元とフロベニウス写像 $g(x)^{p}\equiv g(x^{p})$ で示す。結果として $\operatorname{Gal}(\Q(\zeta_{n})/\Q)\cong(\Z/n\Z)^{\times}$（\ref{fld:cyclotomic-galois}）で、円分体はアーベル拡大の基本的な例になる。

> 雪江明彦『代数学 2』第 4 章 §4.7 を参考にした。円分多項式が整数係数であることは非可換環の系列（\ref{mod:cyclotomic-integer}）で示した。

## 記法と定義の確認 {#fld:sec-cy-notation}

::: notation
- 円分多項式 $\Phi_{n}(x)=\prod(x-\zeta)$（$\zeta$ は位数ちょうど $n$ の $1$ の複素 $n$ 乗根）、$x^{n}-1=\prod_{d\mid n}\Phi_{d}$、$\Phi_{n}\in\Z[x]$ は \ref{mod:cyclotomic-integer}。
- ガウスの補題の帰結（$\Q[x]$ での分解は $\Z[x]$ でできる）は \ref{ring:gauss-irreducible}、分離性の判定は \ref{fld:separable-criterion}、乗法群の有限部分群は \ref{fld:finite-multiplicative-cyclic}、ガロア拡大と基本定理は \ref{fld:galois-equivalent}, \ref{fld:fundamental-theorem}。
- オイラー関数 $\varphi(n)=\abs{(\Z/n\Z)^{\times}}$。$(\Z/n\Z)^{\times}$ は $\Z/n\Z$ の単元群（\ref{ring:unit-group}）。
- **選択公理**：使わない。
:::

## 1 の冪根 {#fld:sec-cy-roots}

::: proposition 1 の冪根の群 {#fld:roots-of-unity keywords="the n-th roots of unity form a cyclic group of order n when char does not divide n; primitive roots" index="1 の冪根|いちのべきこん, 原始 n 乗根|げんしえぬじょうこん"}
体 $K$ の標数が $n$ を割り切らない（標数 $0$ を含む）とき、$x^{n}-1$ の分解体 $L$ における根全体 $\mu_{n}$ は位数 $n$ の巡回群である。その生成元を **1 の原始 $n$ 乗根**といい、$\zeta$ が原始 $n$ 乗根なら原始 $n$ 乗根全体は $\zeta^{a}$（$a\in(\Z/n\Z)^{\times}$）で、ちょうど $\varphi(n)$ 個。$L=K(\zeta)$。
:::

::: proof
$(x^{n}-1)'=nx^{n-1}$ で、$K$ の中で $n\neq 0$ なので $x^{n}-1$ と互いに素（$x\cdot nx^{n-1}-n(x^{n}-1)=n$）、分離的（\ref{fld:separable-criterion} の 1）。よって根は $n$ 個で、積と逆元で閉じるので $L^{\times}$ の位数 $n$ の部分群、巡回群（\ref{fld:finite-multiplicative-cyclic}）。生成元の個数は $\varphi(n)$（\ref{grp:order-of-power}）。$L$ は根で生成され、根はすべて $\zeta$ の冪。
:::

## 円分多項式の既約性 {#fld:sec-cy-irreducible}

::: theorem 円分多項式の既約性 {#fld:cyclotomic-irreducible keywords="cyclotomic polynomials are irreducible over Q" index="円分多項式の既約性|えんぶんたこうしきのきやくせい"}
$\Phi_{n}$ は $\Q[x]$ で既約である。したがって原始 $n$ 乗根 $\zeta$ について $[\Q(\zeta):\Q]=\varphi(n)$。
:::

::: proof
**Step 1（設定）.** $\zeta=e^{2\pi\sqrt{-1}/n}$、$f$ をその $\Q$ 上の最小多項式とする。$f\mid\Phi_{n}$ で、ガウスの補題（\ref{ring:gauss-irreducible} の 1）から $\Phi_{n}=fg$（$f,g\in\Z[x]$ モニック）と書ける。

**Step 2（素数乗）.** $\theta$ を $f$ の根、$p$ を $n$ を割り切らない素数とし、$f(\theta^{p})=0$ を示す。$f(\theta^{p})\neq 0$ とすると、$\theta^{p}$ は原始 $n$ 乗根（$\gcd(p,n)=1$）なので $\Phi_{n}$ の根で、$g(\theta^{p})=0$。すると $\theta$ は $g(x^{p})$ の根で、$f\mid g(x^{p})$（$\theta$ の最小多項式は $f$）。ガウスの補題から $\Z[x]$ で $g(x^{p})=fh$。

**Step 3（$p$ で還元）.** $\Z[x]\to\mathbb{F}_{p}[x]$ による像を $\bar{\ }$ で表す。$\mathbb{F}_{p}$ ではフロベニウスと $a^{p}=a$ から $\bar g(x^{p})=\bar g(x)^{p}$ なので $\bar f\mid\bar g^{p}$。$\bar f$ の既約因子 $\pi$（$\bar f$ はモニックで次数 $\ge 1$）は $\bar g$ を割り切り、$\pi^{2}\mid\bar f\bar g=\bar\Phi_{n}\mid x^{n}-1$。ところが $\mathbb{F}_{p}$ で $n\neq 0$ なので $x^{n}-1$ は分離的（\ref{fld:roots-of-unity} の証明）で平方因子をもたない。矛盾。

**Step 4（既約）.** 原始 $n$ 乗根はすべて $\zeta^{a}$（$\gcd(a,n)=1$）で、$a=p_{1}\cdots p_{r}$（$p_{i}\nmid n$ 素数）と分解して Step 2 を繰り返すと $f(\zeta^{a})=0$。よって $\Phi_{n}$ の根はすべて $f$ の根で、$\Phi_{n}=f$ は既約。次数は $\varphi(n)$（\ref{fld:roots-of-unity}）。
:::

::: theorem 円分体のガロア群 {#fld:cyclotomic-galois keywords="Gal(Q(zeta_n)/Q) is isomorphic to (Z/nZ)^x via sigma_a(zeta) = zeta^a" index="円分体|えんぶんたい, 円分体のガロア群|えんぶんたいのがろあぐん"}
$\Q(\zeta_{n})/\Q$ はガロア拡大で、$a\in(\Z/n\Z)^{\times}$ に $\sigma_{a}(\zeta_{n})=\zeta_{n}^{a}$ となる $\sigma_{a}$ を対応させる写像は同型 $(\Z/n\Z)^{\times}\cong\operatorname{Gal}(\Q(\zeta_{n})/\Q)$ である。特にガロア群は可換。
:::

::: proof
$\Q(\zeta_{n})$ は分離多項式 $x^{n}-1$ の分解体（\ref{fld:roots-of-unity}）なのでガロア。$\sigma\in\operatorname{Gal}$ は $\zeta_{n}$ を $\Phi_{n}$ の根、すなわち $\zeta_{n}^{a}$（$a\in(\Z/n\Z)^{\times}$、一意）に写す。逆に各 $\zeta_{n}^{a}$ は $\Phi_{n}$（既約、\ref{fld:cyclotomic-irreducible}）の根なので、$\zeta_{n}\mapsto\zeta_{n}^{a}$ となる $\sigma_{a}$ がある（\ref{fld:extension-simple}）。$\sigma_{a}\sigma_{b}(\zeta)=\sigma_{a}(\zeta^{b})=\zeta^{ab}$ なので準同型で、全単射。
:::

::: example
1. $p$ が素数なら $\operatorname{Gal}(\Q(\zeta_{p})/\Q)\cong(\Z/p\Z)^{\times}=\mathbb{F}_{p}^{\times}$ は位数 $p-1$ の巡回群（\ref{fld:finite-multiplicative-cyclic}）。基本定理から、$p-1$ の各約数 $d$ についてちょうど一つ、次数 $d$ の中間体がある。
2. $p=5$：$\zeta=\zeta_{5}$、$\eta\defeq\zeta+\zeta^{4}=2\cos(2\pi/5)$ は $\sigma_{4}$（複素共役）で固定され、$\eta^{2}+\eta-1=0$（$1+\zeta+\dots+\zeta^{4}=0$ から）。唯一の 2 次の中間体は $\Q(\eta)=\Q(\sqrt{5})$。
3. $n=8$：$\zeta_{8}=(1+i)/\sqrt{2}$、$\Q(\zeta_{8})=\Q(i,\sqrt{2})$、ガロア群 $(\Z/8\Z)^{\times}=\{1,3,5,7\}\cong\Z/2\times\Z/2$。
:::

## 問題 {#fld:sec-cy-problems}

::: problem {#fld:prob-cy-cubic-subfield}
$\zeta=\zeta_{7}$ とする。$\Q(\zeta)$ の唯一の 3 次の部分体は $\Q(\zeta+\zeta^{-1})$ で、$\zeta+\zeta^{-1}=2\cos(2\pi/7)$ の最小多項式は $x^{3}+x^{2}-2x-1$ であることを示せ。
:::

::: solution
**Step 1.** ガロア群は位数 6 の巡回群で、3 次の部分体は位数 2 の部分群 $\{\sigma_{1},\sigma_{6}\}$（$\sigma_{6}$ は複素共役）の固定体。$\eta=\zeta+\zeta^{6}$ は $\sigma_{6}$ で固定され、$\sigma_{2}(\eta)=\zeta^{2}+\zeta^{5}\neq\eta$ なので $\Q(\eta)$ は次数 $>1$ で 3 次の部分体に含まれ、それに等しい。

**Step 2.** $\eta_{1}=\eta$, $\eta_{2}=\zeta^{2}+\zeta^{5}$, $\eta_{3}=\zeta^{3}+\zeta^{4}$ は $\eta$ の共役。$\eta_{1}+\eta_{2}+\eta_{3}=\zeta+\dots+\zeta^{6}=-1$、$\eta_{1}\eta_{2}+\eta_{2}\eta_{3}+\eta_{3}\eta_{1}=2(\zeta+\dots+\zeta^{6})=-2$（展開すると各 $\zeta^{k}$, $1\le k\le 6$ がちょうど 2 回現れる）、$\eta_{1}\eta_{2}\eta_{3}=2+(\zeta+\dots+\zeta^{6})=1$。よって最小多項式は $x^{3}+x^{2}-2x-1$。
:::

::: supplement
**高い視点.** 円分体は「可換なガロア群をもつ拡大」の基本形で、$\Q$ の有限次アーベル拡大はすべて円分体の部分体であることが知られている（クロネッカー＝ウェーバーの定理。類体論の入口で、このサイトではまだ扱っていない）。基本定理と組み合わせると、$\Q(\zeta_{n})$ の部分体は $(\Z/n\Z)^{\times}$ の部分群と対応し、たとえば正 $n$ 角形の作図可能性（\ref{fld:page-constructions}）は $\varphi(n)$ が 2 の冪かどうかで決まる。
:::
