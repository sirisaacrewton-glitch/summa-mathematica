# 作図と代数学の基本定理 {#fld:page-constructions keywords="ruler and compass constructions, constructible numbers, quadratic towers, doubling the cube, angle trisection, regular polygons, Gauss-Wantzel, Fermat primes, fundamental theorem of algebra via Galois theory, normal basis theorem"}

ガロア理論の古典的な応用を三つ扱う。(1) 定規とコンパスで作図できる数は、2 次拡大を繰り返して得られる数であり、ガロア閉包の次数が 2 の冪であるものと一致する。これから、立方体の倍積・角の 3 等分の不可能性と、正 $n$ 角形が作図できる $n$ の決定（ガウス＝ヴァンツェル）が従う。(2) 代数学の基本定理（$\mathbb{C}$ は代数閉体）を、実数の二つの解析的な事実（奇数次の実多項式は実根をもつ、複素数は平方根をもつ）とシローの定理から導く。(3) 有限次ガロア拡大は、一つの元の共役全体からなる基底（**正規底**）をもつ。

> 雪江『代数学 2』§4.11・§4.17 の内容を参考にし、証明は独自に組み立てた。

## 記法と定義の確認 {#fld:sec-co-notation}

::: notation
- 体の拡大の次数と塔の公式は \ref{fld:tower-law}、ガロア拡大・基本定理・正規閉包は \ref{fld:galois-equivalent}, \ref{fld:fundamental-theorem}, \ref{fld:normal-closure}、円分体のガロア群は \ref{fld:cyclotomic-galois}、原始元定理は \ref{fld:primitive-element}、デデキントの補題は \ref{fld:dedekind-independence}。
- $p$ 群が各位数の正規部分群をもつことは \ref{grp:p-group-normal-subgroups}、シローの定理は \ref{grp:sylow-existence}、オイラー関数の乗法性は \ref{grp:euler-phi-multiplicative}。
- 実数の性質：中間値の定理（\ref{top:intermediate-value}）、非負の実数は実数の平方根をもつ。
- **選択公理**：使わない。
:::

## 定規とコンパスによる作図 {#fld:sec-co-constructions}

::: definition 作図可能な数 {#fld:constructible keywords="constructible point, constructible number, ruler and compass" index="作図可能|さくずかのう, 定規とコンパス|じょうぎとこんぱす"}
$\mathbb{C}=\mathbb{R}^{2}$ の点の集合 $P\supset\{0,1\}$ から、次の操作で新しい点を加える：(a) $P$ の 2 点を通る直線どうしの交点、(b) そのような直線と、中心が $P$ の点で半径が $P$ の 2 点間の距離の円との交点、(c) そのような円どうしの交点。$\{0,1\}$ から有限回の操作で得られる点を**作図可能な数**といい、その全体を $\mathcal{C}$ と書く。
:::

::: theorem 作図可能な数の特徴付け {#fld:constructible-characterization keywords="z is constructible iff it lies in a tower of quadratic extensions of Q iff the Galois closure of Q(z) has 2-power degree" index="2 次拡大の塔|にじかくだいのとう"}
$z\in\mathbb{C}$ について、次は同値である。
1. $z$ は作図可能。
2. $\Q=K_{0}\subset K_{1}\subset\dots\subset K_{m}\subset\mathbb{C}$, $[K_{i+1}:K_{i}]=2$, $z\in K_{m}$ となる塔がある。
3. $z$ は $\Q$ 上代数的で、$\Q(z)$ の（$\mathbb{C}$ の中の）ガロア閉包 $L$ について $[L:\Q]$ は 2 の冪。

特に、作図可能な数の $\Q$ 上の次数は 2 の冪である。
:::

::: proof
**Step 1（1 ⇒ 2：1 回の操作）.** 有限個の点の実部と虚部をすべて含む実の部分体 $F\subset\mathbb{R}$ を考える。$F$ の点を通る直線は $ax+by=c$（$a,b,c\in F$）、$F$ の点を中心とし $F$ の 2 点間の距離を半径とする円は $x^{2}+y^{2}+dx+ey+f=0$（$d,e,f\in F$：半径の 2 乗は $F$ の元）と書ける。直線どうしの交点の座標は $F$ の元（連立一次方程式）。直線と円の交点は、直線の式で一方の変数を消すと $F$ 係数の 2 次方程式の解なので、座標は $F(\sqrt{\delta})$（$\delta\in F$, $\delta\ge0$）に入る。円どうしの交点は、二つの式を引くと直線の式になり、直線と円の場合に帰着する。

**Step 2（1 ⇒ 2：まとめ）.** 作図の手順に沿って、実の体の塔 $\Q=F_{0}\subset F_{1}\subset\dots\subset F_{r}$（各段の次数は $1$ か $2$）で、$z=x+iy$ について $x,y\in F_{r}$ となるものが得られる。$z\in F_{r}(i)$ で $[F_{r}(i):F_{r}]=2$（$F_{r}\subset\mathbb{R}$）。次数 $1$ の段を除けば 2 になる。

**Step 3（2 ⇒ 1：作図可能な数は $\sqrt{\ }$ で閉じた体）.** 次の作図が知られている（いずれも初等幾何の標準的な作図）。$a,b\in\mathcal{C}$ なら $a\pm b$（平行四辺形）、$ab$ と $a/b$（$b\neq0$。偏角は角の和・差、絶対値は相似な三角形）、$\bar a$（実軸への垂線）、$\sqrt{a}$（偏角は角の 2 等分、絶対値 $\sqrt{\lvert a\rvert}$ は長さ $1$ と $\lvert a\rvert$ を並べた線分を直径とする円と垂線の交点：直角三角形の相似から高さ $h$ は $h^{2}=1\cdot\lvert a\rvert$）。よって $\mathcal{C}$ は $\mathbb{C}$ の部分体で、平方根で閉じている。$[K_{i+1}:K_{i}]=2$ なら $K_{i+1}=K_{i}(\sqrt{\delta})$（$\delta\in K_{i}$、2 次方程式の解の公式。標数 $0$）なので、$K_{i}\subset\mathcal{C}$ から $K_{i+1}\subset\mathcal{C}$。帰納法で $K_{m}\subset\mathcal{C}$。

**Step 4（2 ⇒ 3）.** $z$ は次数 $2^{m}$ の拡大に属するので代数的。$K_{m}$ の $\Q$ 上のガロア閉包 $N$ は、$\Q$ 埋め込み $\sigma\colon K_{m}\to\mathbb{C}$ の像 $\sigma(K_{m})$ の合成体で、$\sigma(K_{i+1})=\sigma(K_{i})(\sqrt{\sigma(\delta_{i})})$ なので、\ref{fld:radical-normal-closure} と同じく、それらの生成元を順に添加して次数 $1$ か $2$ の段からなる塔が得られる。よって $[N:\Q]$ は 2 の冪で、$L\subset N$ なので $[L:\Q]$ もその約数。

**Step 5（3 ⇒ 2）.** $G=\operatorname{Gal}(L/\Q)$ は位数 $2^{k}$ の 2 群なので、指数 2 の部分群の鎖 $G=H_{0}\supset H_{1}\supset\dots\supset H_{k}=\{1\}$ がある（\ref{grp:p-group-normal-subgroups} を繰り返し使う）。固定体の鎖 $\Q=L^{H_{0}}\subset\dots\subset L^{H_{k}}=L$ の各段の次数は 2 で（基本定理）、$z\in L$。
:::

::: corollary 古典的な作図問題 {#fld:classical-constructions keywords="doubling the cube and trisecting 60 degrees are impossible; squaring the circle is impossible" index="立方体の倍積|りっぽうたいのばいせき, 角の 3 等分|かくのさんとうぶん"}
1. （倍積問題）$\sqrt[3]{2}$ は作図可能でない。
2. （3 等分）$60^{\circ}$ の角は 3 等分できない：$\cos20^{\circ}$ は作図可能でない。
3. （円積問題）$\sqrt{\pi}$ は作図可能でない（$\pi$ が超越数であることを認めれば）。
:::

::: proof
**1.** $x^{3}-2$ は既約（アイゼンシュタイン \ref{ring:eisenstein}）で、$[\Q(\sqrt[3]{2}):\Q]=3$ は 2 の冪でない。

**2.** $\theta=20^{\circ}$, $c=\cos\theta$ とすると $\cos3\theta=4c^{3}-3c=\tfrac12$、すなわち $8c^{3}-6c-1=0$。$t=2c$ とおくと $t^{3}-3t-1=0$ で、有理根の候補 $\pm1$ は根でないので既約。次数 3。$60^{\circ}$ の角（$e^{i\pi/3}$ は作図可能）が 3 等分できれば $e^{i\pi/9}$、したがって $\cos20^{\circ}=\operatorname{Re}e^{i\pi/9}$ が作図可能になる。

**3.** $\sqrt{\pi}$ が作図可能なら代数的で、$\pi=(\sqrt{\pi})^{2}$ も代数的。$\pi$ が超越数であること（リンデマン、1882 年）は本サイト未収録。
:::

::: theorem ガウス＝ヴァンツェルの定理 {#fld:gauss-wantzel keywords="the regular n-gon is constructible iff phi(n) is a power of 2 iff n = 2^k times distinct Fermat primes" index="ガウス＝ヴァンツェルの定理|がうすゔぁんつぇるのていり, 正多角形の作図|せいたかっけいのさくず, フェルマー素数|ふぇるまーそすう"}
正 $n$ 角形（$n\ge3$）が作図可能 $\iff\zeta_{n}=e^{2\pi i/n}$ が作図可能 $\iff\varphi(n)$ が 2 の冪 $\iff n=2^{k}p_{1}\cdots p_{s}$（$p_{j}$ は相異なる**フェルマー素数** $2^{2^{a}}+1$）。
:::

::: proof
**Step 1.** 正 $n$ 角形の頂点として $1$ と $\zeta_{n}$ がとれるので、作図可能性は $\zeta_{n}\in\mathcal{C}$ と同値（逆に $\zeta_{n}$ から $\zeta_{n}^{k}$ は積で得られる）。

**Step 2.** $\Q(\zeta_{n})/\Q$ はガロア拡大で次数 $\varphi(n)$（\ref{fld:cyclotomic-galois}）なので、\ref{fld:constructible-characterization} の 3 から $\zeta_{n}\in\mathcal{C}\iff\varphi(n)$ は 2 の冪。

**Step 3.** $n=2^{k}\prod p^{a_{p}}$（$p$ は奇素数）とすると $\varphi(n)=\varphi(2^{k})\prod p^{a_{p}-1}(p-1)$（\ref{grp:euler-phi-multiplicative}）。これが 2 の冪 $\iff$ 各 $a_{p}=1$ かつ $p-1$ が 2 の冪。$p=2^{m}+1$ が素数なら $m$ は 2 の冪：$m$ が奇数 $d>1$ で割り切れて $m=de$ なら、$2^{m}+1=(2^{e})^{d}+1$ は $2^{e}+1$ で割り切れ（$x^{d}+1=(x+1)(x^{d-1}-\dots+1)$、$d$ は奇数）、$1<2^{e}+1<2^{m}+1$ なので素数でない。
:::

::: example
フェルマー素数として知られているのは $3,5,17,257,65537$ だけである。$n=17$ の正 17 角形はガウスが作図した（1796 年）。正 7 角形・正 9 角形は作図できない（$\varphi(7)=6$, $\varphi(9)=6$）。
:::

## 代数学の基本定理 {#fld:sec-co-fta}

::: theorem 代数学の基本定理 {#fld:fundamental-theorem-algebra keywords="fundamental theorem of algebra via Galois theory and Sylow" index="代数学の基本定理|だいすうがくのきほんていり"}
$\mathbb{C}$ は代数閉体である。
:::

::: proof
**Step 1（実数の二つの事実）.** (a) 奇数次の実多項式 $h$ は実根をもつ：最高次の係数を正とすると $x\to\pm\infty$ で $h(x)\to\pm\infty$ なので、中間値の定理（\ref{top:intermediate-value}）から。したがって $\mathbb{R}$ の奇数次の拡大は $\mathbb{R}$ 自身だけ（原始元定理 \ref{fld:primitive-element} で $\mathbb{R}(\beta)$ と書くと、$\beta$ の最小多項式は奇数次で既約、実根をもつので 1 次）。(b) $\mathbb{C}$ の元は $\mathbb{C}$ に平方根をもつ：$a+bi$ について $w=\sqrt{(\lvert z\rvert+a)/2}+i\,\varepsilon\sqrt{(\lvert z\rvert-a)/2}$（$\varepsilon=\pm1$ は $b$ の符号、$b=0$ なら $1$）とすると $w^{2}=a+bi$。したがって $\mathbb{C}$ の 2 次拡大は存在しない（標数 $0$ の 2 次拡大は平方根の添加）。

**Step 2（ガロア拡大の中で）.** $f\in\mathbb{C}[x]$ を定数でない多項式とする。$f\bar f\in\mathbb{R}[x]$（$\bar f$ は係数の共役）と $x^{2}+1$ の積の $\mathbb{R}$ 上の分解体 $L$ は、標数 $0$ なので $\mathbb{R}$ 上ガロアで、$\mathbb{C}\subset L$（$i$ を含む）。$L=\mathbb{C}$ を示せば、$f$ は $\mathbb{C}$ で分解する。

**Step 3（2 群であること）.** $G=\operatorname{Gal}(L/\mathbb{R})$、$\lvert G\rvert=2^{k}m$（$m$ は奇数）とし、シロー 2 部分群 $P$ をとる（\ref{grp:sylow-existence}）。固定体 $L^{P}$ は $\mathbb{R}$ 上次数 $m$（奇数）なので、(a) から $m=1$。

**Step 4（結論）.** $H=\operatorname{Gal}(L/\mathbb{C})$ は位数 $2^{k-1}$ の 2 群。$H\neq\{1\}$ なら指数 2 の部分群をもち（\ref{grp:p-group-normal-subgroups}）、その固定体は $\mathbb{C}$ の 2 次拡大になって (b) に反する。よって $H=\{1\}$, $L=\mathbb{C}$。

::: hypcheck
- 解析的な事実は Step 1 の二つだけ（$\mathbb{R}$ の順序の完備性から来る中間値の定理と、非負実数の平方根の存在）。証明の残りは代数（ガロア理論とシローの定理）である。実閉体 $R$ について $R(i)$ が代数閉体であることも同じ証明で示される（実閉体 \ref{model:rcf} では (a) と「正の元は平方根をもつ」が成り立つため）。
:::
:::

## 正規底定理 {#fld:sec-co-normal-basis}

::: theorem 正規底定理 {#fld:normal-basis keywords="normal basis theorem: a finite Galois extension has a basis consisting of the conjugates of one element" index="正規底|せいきてい, 正規底定理|せいきていていり"}
$L/K$ を有限次ガロア拡大、$G=\{\sigma_{1},\dots,\sigma_{n}\}$ をそのガロア群とする。$\{\sigma_{1}(\alpha),\dots,\sigma_{n}(\alpha)\}$ が $L$ の $K$ 上の基底になる $\alpha\in L$（**正規底**の生成元）がある。
:::

::: proof
**Step 1（$K$ が無限体：補間多項式）.** 原始元 $\theta$（\ref{fld:primitive-element}）をとり、最小多項式を $f$、$\theta_{i}=\sigma_{i}(\theta)$（相異なる）とする。$g(x)\defeq f(x)/((x-\theta)f'(\theta))\in L[x]$、$g_{i}\defeq\sigma_{i}(g)=f(x)/((x-\theta_{i})f'(\theta_{i}))$（係数に $\sigma_{i}$ を施したもの）とおく。$g_{i}(\theta_{j})=\delta_{ij}$。$\sum_{i}g_{i}-1$ は次数 $n-1$ 以下で $n$ 点 $\theta_{j}$ で $0$ なので $\sum_{i}g_{i}=1$。$i\neq j$ なら $g_{i}g_{j}$ は $f$ で割り切れる。

**Step 2（行列式）.** $N(x)\defeq(\sigma_{k}\sigma_{i}(g))_{k,i}$ とおく。$f\in K[x]$ なので $f$ を法とする合同は $\sigma_{k}$ で保たれ、Step 1 から
$$
\sum_{k}\sigma_{k}\sigma_{i}(g)\,\sigma_{k}\sigma_{j}(g)=\sum_{k}\sigma_{k}\bigl(g_{i}g_{j}\bigr)\equiv\delta_{ij}\sum_{k}\sigma_{k}(g_{i})=\delta_{ij}\sum_{l}g_{l}=\delta_{ij}\pmod f
$$
（$i=j$ のとき $g_{i}^{2}=g_{i}(1-\sum_{l\neq i}g_{l})\equiv g_{i}$）。よって $N^{\mathsf{T}}N\equiv E\pmod f$、$D(x)\defeq\det N(x)$ は $D^{2}\equiv1\pmod f$ をみたし、$0$ でない多項式。

**Step 3（代入）.** $L$ 係数の $0$ でない多項式の根は有限個で、$K$ は無限なので $D(a)\neq0$ となる $a\in K$ がある。$\alpha\defeq g(a)$ とすると、$a\in K$ なので $\sigma_{k}\sigma_{i}(g)(a)=\sigma_{k}\sigma_{i}(\alpha)$、すなわち $\det(\sigma_{k}\sigma_{i}(\alpha))\neq0$。$\sum_{i}c_{i}\sigma_{i}(\alpha)=0$（$c_{i}\in K$）なら $\sigma_{k}$ を施して $\sum_{i}c_{i}\sigma_{k}\sigma_{i}(\alpha)=0$（すべての $k$）、行列が正則なので $c=0$。$n$ 個の一次独立な元は基底。

**Step 4（$K$ が有限体）.** $G$ はフロベニウス $\sigma$ で生成される巡回群（\ref{fld:finite-field-automorphisms}）。$L$ を $f(x)\cdot v\defeq f(\sigma)(v)$ で $K[x]$ 加群とみる。$1,\sigma,\dots,\sigma^{n-1}$ は相異なるのでデデキントの補題（\ref{fld:dedekind-independence}）から $L$ 上一次独立で、次数 $n-1$ 以下の $0$ でない多項式は $\sigma$ を零化しない。$\sigma^{n}=1$ なので、$\sigma$ の最小多項式は $x^{n}-1$。PID $K[x]$ 上の構造定理（\ref{mod:pid-structure}）で $L\cong\bigoplus_{j}K[x]/(d_{j})$（$d_{1}\mid\dots\mid d_{t}$）と書くと、最小多項式は $d_{t}$ で、$\dim_{K}L=\sum_{j}\deg d_{j}=n=\deg d_{t}$ なので $t=1$。よって $L\cong K[x]/(x^{n}-1)$ は $1$ の像 $\alpha$ で生成される巡回加群で、$\alpha,\sigma\alpha,\dots,\sigma^{n-1}\alpha$ が基底。

::: hypcheck
- **前提「ガロア」**：Step 1 で $\theta_{i}$ が相異なり $L$ に属すること、Step 4 で $G$ が巡回群であることに使った。
- Step 4 の議論は、有限体に限らず巡回拡大ならそのまま通る。Step 1〜3 は $K$ が無限であることだけを使う。
:::
:::

::: example
$\Q(i)/\Q$：$\{1,i\}$ は共役の組でないが、$\alpha=1+i$ の共役 $\{1+i,1-i\}$ は基底。$\mathbb{F}_{4}/\mathbb{F}_{2}$（$\mathbb{F}_{4}=\mathbb{F}_{2}(\omega)$, $\omega^{2}=\omega+1$）：$\{\omega,\omega^{2}\}=\{\omega,\omega+1\}$ は基底。
:::

::: supplement
**高い視点.** 正規底定理は、$L$ が $K[G]$ 加群として $K[G]$ 自身（正則表現 \ref{rep:representation-examples} の 4）と同型であることを述べている。ガロア理論の基本定理が「部分体 ↔ 部分群」の対応なら、正規底定理は「$L$ 全体 ↔ 群環」の対応である。

**作図の一般化.** 定規だけ、コンパスだけ、折り紙（3 次方程式も解ける）などの作図可能な数の体も、同様に拡大の次数で特徴付けられることが知られている（本サイト未収録）。
:::

## 問題 {#fld:sec-co-problems}

::: problem {#fld:prob-co-pentagon}
正 5 角形が作図可能であることを、$\zeta_{5}+\zeta_{5}^{-1}$ のみたす 2 次方程式を求めて確かめよ。
:::

::: solution
$\eta=\zeta_{5}+\zeta_{5}^{-1}$ とすると、$\zeta_{5}^{4}+\zeta_{5}^{3}+\zeta_{5}^{2}+\zeta_{5}+1=0$ を $\zeta_{5}^{2}$ で割って $\eta^{2}+\eta-1=0$。よって $\eta=(-1+\sqrt{5})/2$ は作図可能で、$\zeta_{5}$ は $x^{2}-\eta x+1=0$ の根なので $\Q(\eta)$ の 2 次拡大に属し、作図可能（\ref{fld:constructible-characterization}）。
:::
