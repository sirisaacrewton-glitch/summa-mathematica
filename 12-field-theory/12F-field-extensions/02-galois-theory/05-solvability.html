# 方程式の可解性 {#fld:page-solvability keywords="solvability by radicals, radical extension, Galois's theorem, solvable Galois group, quintic not solvable by radicals, x^5 - 4x + 2, Abel-Ruffini"}

2 次方程式の解の公式のように、係数から四則演算と冪根 $\sqrt[n]{\ }$ を有限回使って根を表せるとき、方程式は**冪根で解ける**という。ガロアの定理は、標数 $0$ の体上で、方程式が冪根で解けることと、そのガロア群が可解群であることが同値であることを主張する。証明の鍵は、1 の冪根を含む体の巡回拡大が冪根の添加であるというクンマー理論（\ref{fld:kummer-cyclic}）である。系として、$x^{5}-4x+2$ のように、ガロア群が $S_{5}$ になる 5 次方程式は冪根で解けない（アーベル＝ルフィニ）。

> 雪江『代数学 2』§4.10 の内容を参考にし、証明はクンマー理論とガロアの基本定理から組み立てた。

## 記法と定義の確認 {#fld:sec-sv-notation}

::: notation
- 体 $K$ の標数は $0$ とする（分離性の問題を避けるため。正標数での注意は補足）。$K$ を含む代数的閉体 $\Omega$ を固定する。$\zeta_{n}$ は 1 の原始 $n$ 乗根。
- ガロア拡大・基本定理・推進定理は \ref{fld:galois-equivalent}, \ref{fld:fundamental-theorem}, \ref{fld:galois-lattice}, \ref{fld:translation-theorem}、正規閉包は \ref{fld:normal-closure}。巡回拡大と冪根（クンマー）は \ref{fld:kummer-cyclic}。
- 可解群とその言い換え（可換な因子をもつ正規列、有限なら素数位数の巡回因子）・閉包性は \ref{grp:solvable-group}, \ref{grp:solvable-equivalent}, \ref{grp:solvable-closure}。交代群の単純性は \ref{grp:an-simple}、対称群の生成元は \ref{grp:sn-generators}、コーシーの定理は \tref{grp:cauchy}。
- **選択公理**：$\Omega$ の存在に使う（$K\subset\mathbb{C}$ なら不要）。
:::

## 冪根拡大 {#fld:sec-sv-radical}

::: definition 冪根拡大・冪根で解ける {#fld:radical-extension keywords="radical extension, radical tower, polynomial solvable by radicals" index="冪根拡大|べきこんかくだい, 冪根で解ける|べきこんでとける"}
1. 体の塔 $K=K_{0}\subset K_{1}\subset\dots\subset K_{m}$ で、各 $i$ について $K_{i+1}=K_{i}(\alpha_{i})$, $\alpha_{i}^{n_{i}}\in K_{i}$（$n_{i}\ge1$）となるものを**冪根の塔**、$K_{m}/K$ を**冪根拡大**という。
2. $f\in K[x]$ の分解体 $L\subset\Omega$ が、ある冪根拡大に含まれるとき、$f$ は（$K$ 上）**冪根で解ける**という。
:::

::: lemma 1 の冪根の添加 {#fld:roots-of-unity-extension keywords="K(zeta_n)/K is abelian, Galois group embeds into (Z/n)^x" index="1 の冪根の添加|いちのべきこんのてんか"}
$K(\zeta_{n})/K$ はガロア拡大で、$\sigma(\zeta_{n})=\zeta_{n}^{a(\sigma)}$ で定まる $\sigma\mapsto a(\sigma)$ は単射準同型 $\operatorname{Gal}(K(\zeta_{n})/K)\to(\Z/n\Z)^{\times}$。特にガロア群は可換。
:::

::: proof
$K(\zeta_{n})$ は分離多項式 $x^{n}-1$（標数 $0$）の分解体（根は $\zeta_{n}^{k}$）なのでガロア拡大。$\sigma(\zeta_{n})$ も 1 の原始 $n$ 乗根（位数が保たれる）なので $\zeta_{n}^{a}$（$\gcd(a,n)=1$）の形。$\sigma\tau(\zeta_{n})=\sigma(\zeta_{n}^{a(\tau)})=\zeta_{n}^{a(\sigma)a(\tau)}$ なので準同型。$a(\sigma)=1$ なら $\sigma$ は生成元を固定し恒等写像。
:::

::: lemma 冪根拡大の正規閉包 {#fld:radical-normal-closure keywords="the Galois closure of a radical extension is radical, and can be taken to contain roots of unity" index="冪根拡大の正規閉包|べきこんかくだいのせいきへいほう"}
$K_{m}/K$ を冪根拡大（塔の指数 $n_{0},\dots,n_{m-1}$）、$n=\operatorname{lcm}(n_{i})$ とする。$K_{m}(\zeta_{n})$ を含む $K$ の有限次ガロア拡大 $N\subset\Omega$ と、塔 $K\subset K(\zeta_{n})=F_{0}\subset F_{1}\subset\dots\subset F_{t}=N$ で、各 $F_{j+1}=F_{j}(\beta_{j})$, $\beta_{j}^{n_{(j)}}\in F_{j}$（$n_{(j)}$ はある $n_{i}$）となるものがある。
:::

::: proof
**Step 1（$N$ の定義）.** $N$ を $K_{m}(\zeta_{n})$ の $K$ 上の正規閉包（\ref{fld:normal-closure}）とする。標数 $0$ なので分離的で、$N/K$ は有限次ガロア拡大。$N$ は、$K$ 埋め込み $\sigma\colon K_{m}\to\Omega$（有限個）の像 $\sigma(K_{m})$ と $\zeta_{n}$ で生成される（$N$ は $K_{m}$ の生成元 $\alpha_{i}$ の最小多項式と $x^{n}-1$ の分解体で、$\alpha_{i}$ の共役はある $\sigma$ について $\sigma(\alpha_{i})$）。

**Step 2（塔）.** $K$ 埋め込みを $\sigma_{1},\dots,\sigma_{s}$ とし、$K(\zeta_{n})$ に
$$
\sigma_{1}(\alpha_{0}),\dots,\sigma_{1}(\alpha_{m-1}),\ \sigma_{2}(\alpha_{0}),\dots,\sigma_{s}(\alpha_{m-1})
$$
をこの順に添加する。$\sigma_{k}(\alpha_{i})^{n_{i}}=\sigma_{k}(\alpha_{i}^{n_{i}})\in\sigma_{k}(K_{i})=K(\sigma_{k}(\alpha_{0}),\dots,\sigma_{k}(\alpha_{i-1}))$ は、それまでに添加した体に含まれる。最後に得られる体は Step 1 から $N$。
:::

## ガロアの定理 {#fld:sec-sv-galois}

::: theorem ガロアの定理 {#fld:galois-solvability keywords="Galois's theorem: a polynomial is solvable by radicals iff its Galois group is solvable" index="ガロアの定理（可解性）|がろあのていりかかいせい" refname="ガロアの定理"}
$\operatorname{char}K=0$ とし、$f\in K[x]$ の分解体を $L$ とする。$f$ が冪根で解ける $\iff$ $\operatorname{Gal}(L/K)$ は可解群。
:::

::: proof
**Step 1（$\Rightarrow$：塔の各段は可換）.** $L\subset K_{m}$ となる冪根拡大をとり、\ref{fld:radical-normal-closure} の $N$ と塔 $F_{0}\subset\dots\subset F_{t}=N$ をとる。$F_{j}$ は $\zeta_{n}$ を含み、$n_{(j)}\mid n$ なので 1 の原始 $n_{(j)}$ 乗根を含む。\ref{fld:kummer-cyclic.1} から $F_{j+1}/F_{j}$ は巡回群をガロア群とするガロア拡大。$F_{0}/K$ は \ref{fld:roots-of-unity-extension} から可換なガロア拡大。

**Step 2（$\Rightarrow$：正規列）.** $G=\operatorname{Gal}(N/K)$, $H_{-1}\defeq G$, $H_{j}\defeq\operatorname{Gal}(N/F_{j})$ とおく。$F_{j+1}/F_{j}$ はガロア拡大なので、基本定理（$N/F_{j}$ に使う）から $H_{j+1}\trianglelefteq H_{j}$ で $H_{j}/H_{j+1}\cong\operatorname{Gal}(F_{j+1}/F_{j})$ は可換。同様に $H_{0}\trianglelefteq G$, $G/H_{0}\cong\operatorname{Gal}(F_{0}/K)$ も可換。$H_{t}=\{1\}$ なので、$G\trianglerighteq H_{0}\trianglerighteq\dots\trianglerighteq H_{t}=\{1\}$ は可換な因子をもつ正規列で、$G$ は可解（\ref{grp:solvable-equivalent}）。

**Step 3（$\Rightarrow$：剰余群へ）.** $L\subset N$ で $L/K$ はガロア拡大なので、$\operatorname{Gal}(L/K)\cong G/\operatorname{Gal}(N/L)$（基本定理）。可解群の剰余群は可解（\ref{grp:solvable-closure.1}）。

**Step 4（$\Leftarrow$：1 の冪根の添加）.** $G=\operatorname{Gal}(L/K)$ を可解とし、$n=\lvert G\rvert$、$K'=K(\zeta_{n})$, $L'=L(\zeta_{n})=LK'$ とおく。\ref{fld:translation-theorem.1}から $L'/K'$ はガロア拡大で、$G'\defeq\operatorname{Gal}(L'/K')\cong\operatorname{Gal}(L/L\cap K')$ は $G$ の部分群、したがって可解（\ref{grp:solvable-closure.1}）。

**Step 5（$\Leftarrow$：素数次の巡回拡大の塔）.** 有限可解群 $G'$ には、因子が素数位数の巡回群である正規列 $G'=H_{0}\trianglerighteq H_{1}\trianglerighteq\dots\trianglerighteq H_{s}=\{1\}$ がある（\ref{grp:solvable-equivalent}）。$E_{j}$ を $H_{j}$ の固定体とすると $K'=E_{0}\subset E_{1}\subset\dots\subset E_{s}=L'$ で、$L'/E_{j}$ のガロア群は $H_{j}$、$H_{j+1}\trianglelefteq H_{j}$ なので $E_{j+1}/E_{j}$ はガロア拡大でガロア群は $H_{j}/H_{j+1}\cong\Z/p_{j}\Z$。$p_{j}$ は $\lvert G'\rvert$ の約数、したがって $n$ の約数なので、$E_{j}\supset K'$ は 1 の原始 $p_{j}$ 乗根 $\zeta_{n}^{n/p_{j}}$ を含む。\ref{fld:kummer-cyclic.2} から $E_{j+1}=E_{j}(\beta_{j})$, $\beta_{j}^{p_{j}}\in E_{j}$。

**Step 6（$\Leftarrow$：結論）.** $K\subset K(\zeta_{n})=E_{0}\subset\dots\subset E_{s}=L'$ は冪根の塔（最初の段は $\zeta_{n}^{n}=1\in K$）で、$L\subset L'$。よって $f$ は冪根で解ける。

::: hypcheck
- **前提「標数 $0$」**：\ref{fld:radical-normal-closure} で正規閉包がガロア（分離的）であること、Step 1・5 でクンマー理論（$\operatorname{char}K\nmid n$）を使うこと、\ref{fld:roots-of-unity-extension} の分離性に使った。正標数でも、$\operatorname{char}K$ が冪根の指数とガロア群の位数を割り切らなければ同じ証明が通る。そうでない場合（指数や位数が標数 $p$ で割り切れる場合）はこの証明は通らない。そのときは、冪根の添加に加えて $x^{p}-x-a$ の根の添加（アルティン＝シュライアー拡大 \tref{fld:artin-schreier}）も許すと、同じ形の定理が成り立つことが知られている（本サイト未収録）。
- **選択公理**：$\Omega$ の存在だけ。
:::
:::

::: remark 4 次以下の方程式
$S_{2},S_{3},S_{4}$ は可解（$S_{4}\trianglerighteq A_{4}\trianglerighteq V_{4}\trianglerighteq\{1\}$ の因子は $C_{2},C_{3},C_{2}\times C_{2}$）で、次数 $n$ の多項式のガロア群は根の置換として $S_{n}$ の部分群なので、標数 $0$ の体上の 4 次以下の方程式はすべて冪根で解ける。証明の Step 4〜6 を具体的にたどると、カルダノ・フェラーリの公式が得られる（\ref{fld:page-discriminant} で扱う予定）。
:::

## 冪根で解けない 5 次方程式 {#fld:sec-sv-quintic}

::: lemma 素数次の対称群の生成元 {#fld:prime-sym-generators keywords="a p-cycle and a transposition generate S_p for p prime" index="対称群の生成（素数次）|たいしょうぐんのせいせいそすうじ"}
$p$ を素数とする。$S_{p}$ の $p$ 巡回置換 $\sigma$ と互換 $\tau$ は $S_{p}$ を生成する。
:::

::: proof
$\tau=(a\ b)$ とする。$\sigma$ は $p$ 巡回置換なので、$\sigma^{k}(a)=b$ となる $1\le k<p$ がある。$p$ は素数なので $\sigma^{k}$ も $p$ 巡回置換（位数 $p$ の元で、型の位数は周期の最小公倍数 \ref{grp:order-cycle-type}）。点の名前を付け替えて $\sigma^{k}=(1\ 2\ \cdots\ p)$, $\tau=(1\ 2)$ としてよい。これらは $S_{p}$ を生成する（\ref{grp:sn-generators}）。
:::

::: theorem ガロア群が $S_{5}$ の 5 次方程式 {#fld:quintic-s5 keywords="x^5 - 4x + 2 has Galois group S_5 and is not solvable by radicals" index="5 次方程式|ごじほうていしき, アーベル＝ルフィニの定理|あーべるるふぃにのていり"}
$f=x^{5}-4x+2\in\Q[x]$ のガロア群は $S_{5}$ で、$f$ は冪根で解けない。
:::

::: proof
**Step 1（既約）.** $p=2$ についての\ref{ring:eisenstein}から $f$ は $\Q$ 上既約。

**Step 2（実根はちょうど 3 個）.** $f(-2)=-22<0$, $f(-1)=5>0$, $f(1)=-1<0$, $f(2)=26>0$ なので、\ref{top:intermediate-value}から $(-2,-1)$, $(-1,1)$, $(1,2)$ に実根がある。一方 $f'=5x^{4}-4$ の実根は $\pm(4/5)^{1/4}$ の 2 個だけで、ロルの定理（$\mathbb{R}$ は実閉体。\ref{model:rcf-rolle}）から $f$ の相異なる実根の間には $f'$ の根があるので、$f$ の実根は高々 3 個。よって実根はちょうど 3 個、残りの 2 個は互いに共役な虚根（$f$ は実係数）。$f$ は既約なので重根はない（標数 $0$）。

**Step 3（ガロア群の元）.** $L\subset\mathbb{C}$ を分解体、$G=\operatorname{Gal}(L/\Q)$ を 5 個の根の置換群として $S_{5}$ の部分群とみる。根 $\alpha$ について $[\Q(\alpha):\Q]=5$ は $[L:\Q]=\lvert G\rvert$ を割り切るので、\ref{grp:cauchy}から $G$ は位数 5 の元をもち、それは $S_{5}$ の中で 5 巡回置換（\ref{grp:order-cycle-type}）。また複素共役は $L$ を $L$ に移し（$L/\Q$ は正規）、2 個の虚根を入れ替え 3 個の実根を固定するので、$G$ の互換である。

**Step 4（結論）.** \ref{fld:prime-sym-generators} から $G=S_{5}$。$S_{5}$ は可解でない：可解なら部分群 $A_{5}$ も可解（\ref{grp:solvable-closure}）だが、$A_{5}$ は可換でない単純群（\ref{grp:an-simple}）なので導来列が $A_{5}$ で止まる。\ref{fld:galois-solvability}から $f$ は冪根で解けない。
:::

::: supplement
**一般の 5 次方程式.** 係数を不定元とした「一般の $n$ 次方程式」のガロア群は $S_{n}$ で（対称式の基本定理による。\ref{fld:page-discriminant} で扱う予定）、$n\ge5$ では冪根で解けない（アーベル＝ルフィニの定理）。上の定理は、具体的な有理数係数の方程式でも解けないものがあることを示している。

**可解でも冪根の式は複雑.** ガロア群が可解なら冪根で書けるが、その式は一般に虚数を経由する。例えば 3 個の実根をもつ既約な 3 次方程式の根は、実数の冪根だけでは書けないことが知られている（還元不能の場合。本サイト未収録）。

**計算の観点.** 有理数係数の多項式のガロア群は計算可能で、可解かどうかも判定できる（\ref{fld:page-fundamental-theorem} の補足）。可解な場合に冪根による表示を実際に求めるアルゴリズムも知られているが、式の大きさは急速に増える（本サイト未収録）。

**高い視点.** ガロアの定理は、「冪根の添加」という体の操作が「巡回群による拡大」という群の操作に対応し、塔が正規列に対応する、というガロア対応（\ref{fld:fundamental-theorem}）の典型的な使い方である。可解性は群の性質だが、それを体の言葉に戻すにはクンマー理論（1 の冪根を含む体の巡回拡大は冪根拡大）が要る。
:::

## 問題 {#fld:sec-sv-problems}

::: problem {#fld:prob-sv-x5-1}
$x^{5}-1$ と $x^{5}-2$ は $\Q$ 上冪根で解けることを、ガロア群を求めて確かめよ。
:::

::: solution
$x^{5}-1$ の分解体は $\Q(\zeta_{5})$ で、ガロア群は $(\Z/5\Z)^{\times}\cong C_{4}$（\ref{fld:cyclotomic-galois}）、可換なので可解。$x^{5}-2$ の分解体は $L=\Q(\sqrt[5]{2},\zeta_{5})$ で、$\operatorname{Gal}(L/\Q(\zeta_{5}))$ は \ref{fld:kummer-cyclic.1} から $\mu_{5}$ の部分群（実は $C_{5}$）で正規、剰余は $\operatorname{Gal}(\Q(\zeta_{5})/\Q)\cong C_{4}$。可換な因子をもつ正規列があるので可解。もちろん根は $\zeta_{5}^{k}\sqrt[5]{2}$ と冪根で書ける。
:::
