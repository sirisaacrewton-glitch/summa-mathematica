# ガロア接続としての対応 {#fld:page-galois-connection keywords="Galois connection, polarity, closure operator, closed elements, closed subgroups, closed intermediate fields, fundamental theorem as a Galois connection"}

ガロアの基本定理の「中間体 ↔ 部分群」の対応は、実は**どんな体の拡大**についても、さらには任意の二項関係について成り立つ形式的な対応（**ガロア接続**）の特別な場合である。一般には対応が全単射になるのは「閉じた」中間体と「閉じた」部分群の間だけで、ガロア拡大とは「すべてが閉じている」拡大のことだ、と言い換えられる。このページでは、ガロア接続の一般論を証明し、基本定理（\ref{fld:fundamental-theorem}）のどの部分が形式的で、どの部分がアルティンの定理（\ref{fld:artin-theorem}）という本当の内容なのかを切り分ける。

> 資料によらず書いた。ガロア接続と随伴の関係は \ref{cat:prob-galois-connection}。

## 記法と定義の確認 {#fld:sec-gc-notation}

::: notation
- $\mathcal{P}(X)$ は集合 $X$ の冪集合。半順序集合の間の随伴（$f(p)\le q\iff p\le g(q)$）と閉包作用素は \ref{cat:prob-galois-connection}。
- 体の拡大 $L/K$ について $\operatorname{Aut}(L/K)$ は $K$ を固定する $L$ の自己同型群。$H\subset\operatorname{Aut}(L/K)$ の固定体を $L^{H}$ と書く。アルティンの定理・ガロア拡大の同値な定義・基本定理は \ref{fld:artin-theorem}, \ref{fld:galois-equivalent}, \ref{fld:fundamental-theorem}。
- **選択公理**：使わない。
:::

## ガロア接続の一般論 {#fld:sec-gc-general}

::: definition 関係から定まるガロア接続 {#fld:polarity keywords="polarity of a binary relation, Galois connection between power sets" index="ガロア接続|がろあせつぞく, 極（関係の）|きょくかんけいの"}
集合 $X,Y$ と関係 $R\subset X\times Y$ について、$A\subset X$, $B\subset Y$ に対し
$$
A^{\prime}\defeq\{y\in Y : \forall a\in A\ (a\,R\,y)\},\qquad B^{\prime}\defeq\{x\in X : \forall b\in B\ (x\,R\,b)\}
$$
とおく。$A=A^{\prime\prime}$ となる $A$ を**閉**であるという（$B$ についても同様）。
:::

::: theorem ガロア接続の基本性質 {#fld:galois-connection-basic keywords="A subset B' iff B subset A', A subset A'', A''' = A', closed sets correspond bijectively and inclusion-reversingly" index="閉元|へいげん, 閉包作用素（ガロア接続）|へいほうさようそがろあせつぞく"}
1. $A\subset B^{\prime}\iff B\subset A^{\prime}$（どちらも「$A\times B\subset R$」）。
2. $A_{1}\subset A_{2}\Rightarrow A_{2}^{\prime}\subset A_{1}^{\prime}$、$A\subset A^{\prime\prime}$、$A^{\prime\prime\prime}=A^{\prime}$。$Y$ 側も同様。
3. $A\mapsto A^{\prime\prime}$ は閉包作用素で、その閉集合はちょうど $B^{\prime}$ の形の集合。
4. $A\mapsto A^{\prime}$ は、$X$ の閉集合全体から $Y$ の閉集合全体への、包含を逆にする全単射で、逆は $B\mapsto B^{\prime}$。閉集合は任意の共通部分で閉じ、$\bigl(\bigcup A_{\lambda}\bigr)^{\prime}=\bigcap A_{\lambda}^{\prime}$。
:::

::: proof
**Step 1（1）.** どちらも「すべての $a\in A$, $b\in B$ で $a\,R\,b$」と同値。

**Step 2（2）.** 単調性は定義から。$B=A^{\prime}$ として 1 の右辺 $A^{\prime}\subset A^{\prime}$ が成り立つので $A\subset A^{\prime\prime}$。$A\subset A^{\prime\prime}$ に $^{\prime}$ を施すと $A^{\prime\prime\prime}\subset A^{\prime}$、$Y$ 側の $B\subset B^{\prime\prime}$ を $B=A^{\prime}$ に使うと $A^{\prime}\subset A^{\prime\prime\prime}$。

**Step 3（3）.** 単調で $A\subset A^{\prime\prime}$、$A^{\prime\prime\prime\prime}=(A^{\prime\prime\prime})^{\prime}=A^{\prime\prime}$ なので閉包作用素。$A$ が閉なら $A=(A^{\prime})^{\prime}$ は $B^{\prime}$ の形。逆に $B^{\prime\prime\prime}=B^{\prime}$ なので $B^{\prime}$ は閉。

**Step 4（4）.** $A$ が閉なら $A^{\prime}$ は 3 から閉、$(A^{\prime})^{\prime}=A$。$Y$ 側も同様なので互いに逆の全単射で、2 から包含を逆にする。$\bigl(\bigcup A_{\lambda}\bigr)^{\prime}=\bigcap A_{\lambda}^{\prime}$ は定義から。閉集合 $A_{\lambda}=B_{\lambda}^{\prime}$ の共通部分は $\bigl(\bigcup B_{\lambda}\bigr)^{\prime}$ で閉。
:::

::: remark 随伴として
$A\mapsto A^{\prime}$ と $B\mapsto B^{\prime}$ は、$\mathcal{P}(X)$ と $\mathcal{P}(Y)^{\mathrm{op}}$ の間の随伴（半順序集合を圏とみたもの）で、1 がその定義である。一般の随伴でも、単位と余単位が同型になる対象どうしの間で圏同値が得られる（\ref{cat:prob-galois-connection} の一般化）。
:::

## 体の拡大のガロア接続 {#fld:sec-gc-fields}

::: proposition 体の拡大のガロア接続 {#fld:field-galois-connection keywords="the relation sigma(x) = x between L and Aut(L/K); closed sets are intermediate fields and subgroups; closed subgroups and closed fields" index="閉部分群|へいぶぶんぐん, 閉中間体|へいちゅうかんたい"}
体の拡大 $L/K$ について、$X=L$, $Y=\operatorname{Aut}(L/K)$、関係を $x\,R\,\sigma\iff\sigma(x)=x$ とする。
1. $H\subset Y$ について $H^{\prime}=L^{H}$ は $K$ を含む中間体。$T\subset L$ について $T^{\prime}=\operatorname{Aut}(L/K(T))$ は部分群。
2. 閉集合は、$M=L^{\operatorname{Aut}(L/M)}$ となる中間体 $M$（**閉中間体**）と、$H=\operatorname{Aut}(L/L^{H})$ となる部分群 $H$（**閉部分群**）。$M\mapsto\operatorname{Aut}(L/M)$ は閉中間体と閉部分群の間の包含を逆にする全単射。
:::

::: proof
**1.** $L^{H}$ は和・積・逆元で閉じ（自己同型は体の演算を保つ）、$K\subset L^{H}$（$H\subset\operatorname{Aut}(L/K)$）。$T$ のすべての元を固定することと $K(T)$ を固定することは同値で、その全体は部分群。

**2.** \ref{fld:galois-connection-basic} の 3 から閉集合は $B^{\prime}$ や $A^{\prime}$ の形、すなわち 1 の形の中間体と部分群のうち閉なもの。閉であることは定義をこの場合に書き直したもの。全単射は \ref{fld:galois-connection-basic} の 4。
:::

::: theorem ガロア拡大と閉性 {#fld:galois-closedness keywords="for finite extensions every subgroup is closed (Artin); an intermediate field is closed iff L/M is Galois; L/K is Galois iff K is closed iff all intermediate fields are closed" index="ガロア拡大と閉性|がろあかくだいとへいせい"}
$L/K$ を有限次拡大とする。
1. $\operatorname{Aut}(L/K)$ のすべての部分群は閉。
2. 中間体 $M$ が閉 $\iff L/M$ はガロア拡大。
3. $L/K$ がガロア拡大 $\iff K$ が閉 $\iff$ すべての中間体が閉。このとき対応は中間体全体と部分群全体の全単射で、\ref{fld:fundamental-theorem} の対応と一致する。
:::

::: proof
**Step 1（1）.** $H$ は有限群（$\lvert\operatorname{Aut}(L/K)\rvert\le[L:K]$。\ref{fld:extension-count}）。アルティンの定理（\ref{fld:artin-theorem}）から $[L:L^{H}]=\lvert H\rvert$。$H\subset\operatorname{Aut}(L/L^{H})$ で、右辺の位数は $[L:L^{H}]$ 以下（\ref{fld:extension-count}）なので、$H=\operatorname{Aut}(L/L^{H})$。

**Step 2（2）.** $M=L^{\operatorname{Aut}(L/M)}$ は、ガロア拡大の同値な定義の一つ（固定体による定義。\ref{fld:galois-equivalent}）そのもの。

**Step 3（3）.** 2 を $M=K$ に使うと最初の同値。$L/K$ がガロアなら、すべての中間体 $M$ について $L/M$ もガロア（\ref{fld:galois-intermediate}）なので閉。逆は $K$ も中間体なので明らか。このとき 1 と合わせて、すべての中間体・すべての部分群が閉で、\ref{fld:field-galois-connection} の 2 の全単射が基本定理の対応になる。
:::

::: remark 何が形式的で、何が内容か
基本定理のうち、「対応が包含を逆にする」「閉なもの同士で全単射」「和と共通部分の入れ替え（\ref{fld:galois-lattice}）」はガロア接続の一般論から形式的に出る。本当の内容は (i) 有限群の部分群はすべて閉（アルティンの定理 $[L:L^{H}]=\lvert H\rvert$）と (ii) ガロア拡大の中間体はすべて閉、の二つである。次数と指数の一致 $[L:M]=\lvert\operatorname{Aut}(L/M)\rvert$ も (i) から出る。
:::

::: example 閉でない例
1. **閉でない中間体**：$L=\Q(\sqrt[3]{2})$, $K=\Q$。$\sqrt[3]{2}$ の共役のうち $L\subset\mathbb{R}$ に属するのは自分だけなので $\operatorname{Aut}(L/\Q)=\{1\}$、その固定体は $L$。よって $\Q$ は閉でなく、閉中間体は $L$ だけ。
2. **閉でない部分群**（無限次）：$L=\Q(t)$（有理関数体）、$H=\langle\tau\rangle$（$\tau(t)=t+1$）。$f\in L^{H}$ なら $f(t+1)=f(t)$。$f$ が $\mathbb{C}$ の点 $a$ に極をもてば $a-1,a-2,\dots$ にも極をもつことになり、極は有限個なので $f$ は多項式。すると $f(n)=f(0)$ がすべての整数 $n$ で成り立ち、$f-f(0)$ は無限個の根をもつので $f$ は定数。よって $L^{H}=\Q$ で $H^{\prime\prime}=\operatorname{Aut}(\Q(t)/\Q)$。これは $t\mapsto2t$ を含み $H$ より大きいので、$H$ は閉でない。無限次の拡大で閉部分群を位相で特徴付けるのが無限次ガロア理論（\ref{fld:page-infinite-galois}）である。
:::

::: supplement
**他のガロア接続.** 同じ形式は数学のいたるところに現れる。
- 多項式環のイデアルと $k^{n}$ の部分集合（関係「$f(x)=0$」）：閉集合は代数的集合と根基イデアルで（$k$ が代数閉体のとき）、その対応は零点定理（\ref{ring:nullstellensatz}）。
- 有限アーベル群とその指標群（関係「$\chi(a)=0$」）：$H\mapsto H^{\perp}$（\ref{grp:finite-abelian-duality}）。有限群なのですべての部分群が閉。
- 加法圏の核と余核（\ref{ha:ker-coker-galois}）。
- 論理式の集合と構造のクラス（関係「$\mathfrak{A}\models\varphi$」）：閉集合は理論（演繹で閉じた文の集合）と初等クラス。

**高い視点.** 「閉なもの同士の全単射」は、随伴が圏同値に制限される一般的な現象の最も単純な場合である（\ref{cat:page-equivalence}）。グロタンディークのガロア理論（\ref{fld:page-grothendieck-galois}）では、中間体と部分群の対応が、分離代数の圏と $G$ 集合の圏の反変同値に格上げされる。
:::

## 問題 {#fld:sec-gc-problems}

::: problem {#fld:prob-gc-closure}
$L=\Q(\sqrt[4]{2})$, $K=\Q$ とする。$\operatorname{Aut}(L/\Q)$ を求め、閉中間体をすべて求めよ。
:::

::: solution
$\sqrt[4]{2}$ の共役は $\pm\sqrt[4]{2}$, $\pm i\sqrt[4]{2}$ で、$L\subset\mathbb{R}$ に属するのは $\pm\sqrt[4]{2}$。よって $\operatorname{Aut}(L/\Q)=\{1,\tau\}$（$\tau(\sqrt[4]{2})=-\sqrt[4]{2}$）。部分群は二つで、どちらも閉（\ref{fld:galois-closedness} の 1）。固定体は $L^{\{1\}}=L$ と $L^{\langle\tau\rangle}=\Q(\sqrt{2})$。よって閉中間体は $L$ と $\Q(\sqrt{2})$ の二つで、$\Q$ は閉でない（$L/\Q$ はガロアでない）。$L/\Q(\sqrt{2})$ はガロア（$x^{2}-\sqrt{2}$ の分解体）で、2 と合う。
:::
