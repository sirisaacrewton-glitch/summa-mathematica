# 無限次ガロア理論 {#fld:page-infinite-galois keywords="infinite Galois extension, Krull topology, profinite group, inverse limit of Galois groups, fundamental theorem for infinite Galois extensions, closed subgroups, absolute Galois group of a finite field, hat Z"}

無限次の代数拡大でも、正規かつ分離的なら**ガロア拡大**と呼ぶ。そのガロア群は、有限次の部分拡大のガロア群の逆極限（**射有限群**）で、自然な位相（**クルル位相**）をもつコンパクト群になる。基本定理は「中間体 ↔ 部分群」ではなく「中間体 ↔ **閉**部分群」の形でだけ成り立つ。実際、有限体の代数閉包のガロア群 $\hat\Z$ では、フロベニウスが生成する部分群 $\Z$ は稠密だが閉でなく、固定体は全体の固定体 $\mathbb{F}_{p}$ と同じになる。ガロア接続の言葉では、閉部分群がちょうど位相的な閉集合である（\ref{fld:page-galois-connection}）。

> 雪江『代数学 3』§1.4 の内容を参考にし、証明は独自に組み立てた。

## 記法と定義の確認 {#fld:sec-ig-notation}

::: notation
- $L/K$ は代数拡大。$L/K$ が正規（\ref{fld:normal}）かつ分離的（\ref{fld:separable-polynomial}）のとき**ガロア拡大**といい、$G=\operatorname{Gal}(L/K)\defeq\operatorname{Aut}(L/K)$ と書く。有限次の場合はこれまでと同じ（\ref{fld:galois-equivalent}）。
- 有限次の基本定理・推進定理・正規閉包は \tref{fld:fundamental-theorem}, \tref{fld:translation-theorem}, \ref{fld:normal-closure}、代数的閉体への埋め込みの延長は \ref{fld:embedding-algebraic-closure}、ガロア接続は \ref{fld:field-galois-connection}。
- 位相群・開部分群は閉・剰余空間は \ref{top:topological-group}, \ref{top:tg-subgroups}, \ref{top:tg-quotient}、直積位相とチコノフの定理は \ref{top:product-topology}, \tref{top:tychonoff}。
- **選択公理**：埋め込みの延長（ツォルンの補題）と、ガロア群のコンパクト性（チコノフの定理。有限離散空間の直積なので、実際にはブール素イデアル定理で足りることが知られている）で使う。
:::

## 有限次ガロア部分拡大 {#fld:sec-ig-finite-subextensions}

::: lemma 有限次ガロア部分拡大による近似 {#fld:finite-galois-exhaustion keywords="an infinite Galois extension is the union of its finite Galois subextensions; restriction to finite Galois subextensions is surjective" index="有限次ガロア部分拡大|ゆうげんじがろあぶぶんかくだい"}
$L/K$ をガロア拡大とする。
1. $L$ は、$K$ 上有限次ガロアな中間体 $N$（以下**有限ガロア部分拡大**）の和集合で、それらは合成について有向（二つを含む有限ガロア部分拡大がある）。
2. 中間体 $M$ について $L/M$ もガロア拡大。
3. 有限ガロア部分拡大 $N$ について、制限 $G\to\operatorname{Gal}(N/K)$, $\sigma\mapsto\sigma|_{N}$ は全射。
:::

::: proof
**Step 1（1）.** $x\in L$ の $K$ 上の最小多項式 $f$ は分離的で、$L$ は正規なので $L$ で分解する。$f$ の $L$ での分解体 $N$ は $K$ 上有限次ガロア（\ref{fld:galois-equivalent}）で $x\in N$。$N_{1},N_{2}$ について合成 $N_{1}N_{2}$ は有限次ガロア（\ref{fld:translation-theorem.2}）。

**Step 2（2）.** $x\in L$ の $M$ 上の最小多項式は $K$ 上の最小多項式の因子なので、分離的で $L$ で分解する。

**Step 3（3）.** $\tau\in\operatorname{Gal}(N/K)$ を、$L$ を含む代数的閉体 $\Omega$ への埋め込み $\tilde\tau:L\to\Omega$ に延長する（\ref{fld:embedding-algebraic-closure}）。$L/K$ は正規なので $\tilde\tau(L)=L$（$x\in L$ の像は $x$ の共役で $L$ に属し、逆も同様）、すなわち $\tilde\tau\in G$。
:::

## クルル位相と射有限群 {#fld:sec-ig-krull}

::: definition クルル位相 {#fld:krull-topology keywords="Krull topology on an infinite Galois group" index="クルル位相|くるるいそう"}
$G=\operatorname{Gal}(L/K)$ の部分集合 $U$ が**開**であるとは、各 $\sigma\in U$ について、有限ガロア部分拡大 $N$ で $\sigma\operatorname{Gal}(L/N)\subset U$ となるものがあることをいう。これを**クルル位相**という。$L/K$ が有限次なら、$N=L$ がとれるので離散位相。
:::

::: theorem ガロア群は射有限群 {#fld:galois-profinite keywords="the Galois group with the Krull topology is a compact Hausdorff totally disconnected topological group, isomorphic to the inverse limit of finite Galois groups" index="射有限群|しゃゆうげんぐん, 逆極限（群）|ぎゃくきょくげんぐん"}
$L/K$ をガロア拡大とし、有限ガロア部分拡大の全体を $\mathcal{N}$ とする。
1. クルル位相で $G$ は位相群で、$\operatorname{Gal}(L/N)$（$N\in\mathcal{N}$）は開かつ閉な正規部分群。
2. $\rho:G\to\prod_{N\in\mathcal{N}}\operatorname{Gal}(N/K)$, $\sigma\mapsto(\sigma|_{N})_{N}$ は、$G$ から**逆極限**
$$
\varprojlim_{N}\operatorname{Gal}(N/K)\defeq\Bigl\{(\tau_{N})_{N} : N\subset N'\text{ なら }\tau_{N'}|_{N}=\tau_{N}\Bigr\}
$$
への群の同型で、右辺に直積位相（各 $\operatorname{Gal}(N/K)$ は離散）の部分空間位相を入れると同相。
3. （AC）$G$ はコンパクト・ハウスドルフで、完全不連結（連結成分は 1 点）。
:::

::: proof
**Step 1（位相群）.** 開集合の公理は定義から（共通部分は $\operatorname{Gal}(L/N_{1}N_{2})\subset\operatorname{Gal}(L/N_{i})$ を使う。\ref{fld:finite-galois-exhaustion.1}）。$\operatorname{Gal}(L/N)$ は $\operatorname{Gal}(N/K)$ への制限の核なので正規。積と逆元の連続性：$\sigma\operatorname{Gal}(L/N)\cdot\tau\operatorname{Gal}(L/N)=\sigma\tau\operatorname{Gal}(L/N)$（正規性）と $(\sigma\operatorname{Gal}(L/N))^{-1}=\sigma^{-1}\operatorname{Gal}(L/N)$ から。$\operatorname{Gal}(L/N)$ は開部分群なので閉（\ref{top:tg-subgroups}）。

**Step 2（2：同型）.** $\rho$ は準同型で、像は逆極限に含まれる。単射：$\sigma|_{N}=\mathrm{id}$ がすべての $N$ で成り立てば、$L=\bigcup N$ なので $\sigma=\mathrm{id}$。全射：$(\tau_{N})$ が両立するなら、$x\in N$ に対し $\sigma(x)\defeq\tau_{N}(x)$ は $N$ の取り方によらず（二つを含む $N''$ で比べる）、$L$ の $K$ 自己同型を定める（全射は各 $\tau_{N}$ が全射だから）。

**Step 3（2：同相）.** 直積位相の基本開集合 $\{(\tau_{N}):\tau_{N_{i}}=\alpha_{i}\ (i\le k)\}$ の逆像は、$N_{1},\dots,N_{k}$ を含む $N'$ をとると $\operatorname{Gal}(L/N')$ の剰余類の和（$N'$ への制限で決まる条件）で、クルル位相で開。逆に $\sigma\operatorname{Gal}(L/N)=\rho^{-1}(\{\tau_{N}=\sigma|_{N}\})$ は直積位相の開集合の逆像。

**Step 4（3）.** 有限離散空間の直積はハウスドルフで、\ref{top:tychonoff}からコンパクト。逆極限は、各条件 $\tau_{N'}|_{N}=\tau_{N}$ が二つの座標だけで決まる閉集合なので、その共通部分として閉、したがってコンパクト・ハウスドルフ。完全不連結：$\sigma\neq\tau$ なら $\sigma|_{N}\neq\tau|_{N}$ となる $N$ があり、開かつ閉な $\sigma\operatorname{Gal}(L/N)$ が二つを分ける。
:::

## 無限次ガロア理論の基本定理 {#fld:sec-ig-fundamental}

::: theorem 無限次ガロア理論の基本定理 {#fld:infinite-fundamental-theorem keywords="Krull: intermediate fields correspond to closed subgroups; open subgroups to finite subextensions; normal closed subgroups to Galois subextensions; closure of H is Gal(L/L^H)" index="クルルの基本定理|くるるのきほんていり, 閉部分群とガロア対応|へいぶぶんぐんとがろあたいおう" refname="無限次ガロア理論の基本定理"}
（AC）$L/K$ をガロア拡大、$G=\operatorname{Gal}(L/K)$ とする。
1. 中間体 $M$ について、$\operatorname{Gal}(L/M)$ は閉部分群で、$L^{\operatorname{Gal}(L/M)}=M$。
2. 部分群 $H$ について、$\operatorname{Gal}(L/L^{H})=\bar H$（$H$ の閉包）。
3. したがって $M\mapsto\operatorname{Gal}(L/M)$ は中間体全体と閉部分群全体の間の、包含を逆にする全単射。開部分群は $K$ 上有限次の中間体に、閉正規部分群は $K$ 上ガロアな中間体に対応し、後者では $\operatorname{Gal}(M/K)\cong G/\operatorname{Gal}(L/M)$（位相群として）。
:::

::: proof
**Step 1（1：閉）.** $\operatorname{Gal}(L/M)=\bigcap_{x\in M}\operatorname{Gal}(L/K(x))$。$K(x)$ を含む有限ガロア部分拡大 $N$ をとると、$\operatorname{Gal}(L/K(x))$ は開部分群 $\operatorname{Gal}(L/N)$ を含む部分群なので開、したがって閉（\ref{top:tg-subgroups}）。閉集合の共通部分なので閉。

**Step 2（1：固定体）.** $M\subset L^{\operatorname{Gal}(L/M)}$ は明らか。$x\in L\setminus M$ とする。$M(x)$ の $M$ 上の正規閉包 $N'\subset L$ は $M$ 上有限次ガロア（\ref{fld:finite-galois-exhaustion.2}・\ref[1]{fld:finite-galois-exhaustion.1}）で、有限次の基本定理から $\tau\in\operatorname{Gal}(N'/M)$ で $\tau(x)\neq x$ となるものがある（$x\notin M=N'^{\operatorname{Gal}(N'/M)}$）。\ref{fld:finite-galois-exhaustion.3}（$L/M$ に使う）から $\tau$ は $\sigma\in\operatorname{Gal}(L/M)$ に延長され、$\sigma(x)\neq x$。

**Step 3（2）.** $\operatorname{Gal}(L/L^{H})$ は 1 から閉で $H$ を含むので $\bar H\subset\operatorname{Gal}(L/L^{H})$。逆に $\sigma\in\operatorname{Gal}(L/L^{H})$ と基本近傍 $\sigma\operatorname{Gal}(L/N)$（$N\in\mathcal{N}$）をとる。制限の像 $H_{N}\subset\operatorname{Gal}(N/K)$ の固定体は $N^{H_{N}}=N\cap L^{H}$ で、$\sigma|_{N}$ はこれを固定するので、有限次の基本定理から $\sigma|_{N}\in H_{N}$。すなわち $h|_{N}=\sigma|_{N}$ となる $h\in H$ があり、$h\in\sigma\operatorname{Gal}(L/N)$。よって $\sigma\in\bar H$。

**Step 4（3：全単射）.** 1 と 2（閉な $H$ では $\bar H=H$）から互いに逆。

**Step 5（3：開と有限）.** $\operatorname{Gal}(L/M)$ が開なら、ある $\operatorname{Gal}(L/N)$ を含み、1 から $M=L^{\operatorname{Gal}(L/M)}\subset L^{\operatorname{Gal}(L/N)}=N$ で $M$ は有限次。逆に $M$ が有限次なら、$M$ を含む $N$ をとると $\operatorname{Gal}(L/M)\supset\operatorname{Gal}(L/N)$ で開。

**Step 6（3：正規とガロア）.** $\sigma\operatorname{Gal}(L/M)\sigma^{-1}=\operatorname{Gal}(L/\sigma M)$ なので、$\operatorname{Gal}(L/M)$ が正規 $\iff$ すべての $\sigma$ で $\sigma M=M$ $\iff M/K$ は正規（\ref{fld:finite-galois-exhaustion.3} の議論で、$M$ の $K$ 埋め込みは $G$ の元に延長される）、分離性は $L$ から遺伝する。このとき制限 $G\to\operatorname{Gal}(M/K)$ は全射（延長）で核は $\operatorname{Gal}(L/M)$、連続な全射でコンパクトからハウスドルフへの写像なので、誘導される $G/\operatorname{Gal}(L/M)\to\operatorname{Gal}(M/K)$ は同相。
:::

## 例 {#fld:sec-ig-examples}

::: example 有限体の代数閉包 {#fld:galois-finite-field-closure keywords="Gal(F_p-bar / F_p) is hat Z, topologically generated by Frobenius; <Frobenius> = Z is dense but not closed" index="完備化された整数|かんびかされたせいすう, Z ハット|ぜっとはっと"}
$\bar{\mathbb{F}}_{p}=\bigcup_{n}\mathbb{F}_{p^{n}}$（有限ガロア部分拡大は $\mathbb{F}_{p^{n}}$ だけ。\ref{fld:finite-subfields}）で、$\operatorname{Gal}(\mathbb{F}_{p^{n}}/\mathbb{F}_{p})\cong\Z/n\Z$（フロベニウス $\varphi$ が $1$ に対応。\ref{fld:finite-field-automorphisms}）。\ref{fld:galois-profinite} から
$$
G=\operatorname{Gal}(\bar{\mathbb{F}}_{p}/\mathbb{F}_{p})\cong\varprojlim_{n}\Z/n\Z\eqdef\hat\Z
$$
（$m\mid n$ のとき $\Z/n\Z\to\Z/m\Z$ は自然な射影）。
1. $\langle\varphi\rangle$ は稠密：任意の基本開集合 $\sigma\operatorname{Gal}(\bar{\mathbb{F}}_{p}/\mathbb{F}_{p^{n}})$ は、$\sigma|_{\mathbb{F}_{p^{n}}}=\varphi^{k}|_{\mathbb{F}_{p^{n}}}$ となる $k$ について $\varphi^{k}$ を含む。
2. $\langle\varphi\rangle\cong\Z$ は閉でない：閉なら 1 から $G$ 全体だが、$G$ は非可算である（$n=k!$ の部分列について、$c_{j}\in\{0,1\}$ を選んで $\sum_{j<k}c_{j}\,j!\bmod k!$ を並べると両立する列になる。一般の $n$ の成分は $n\mid k!$ となる $k$ の値の $\bmod n$ で決まる。$c_{j}$ が初めて異なる $j$ で $(j+1)!$ の成分が $j!\not\equiv0$ だけずれるので、$\{0,1\}$ の無限列ごとに相異なる元が得られる）一方、$\Z$ は可算。
3. 固定体は $\bar{\mathbb{F}}_{p}^{\langle\varphi\rangle}=\mathbb{F}_{p}$（$x^{p}=x$ の根）$=\bar{\mathbb{F}}_{p}^{G}$。有限次の場合と違い、部分群 $\langle\varphi\rangle\subsetneq G$ が同じ固定体をもつ。これは \ref{fld:infinite-fundamental-theorem.2}（$\overline{\langle\varphi\rangle}=G$）と合う。
:::

::: example 1 の $p$ 冪乗根
$L=\Q(\mu_{p^{\infty}})=\bigcup_{n}\Q(\zeta_{p^{n}})$ について、円分体のガロア群（\ref{fld:cyclotomic-galois}）から
$$
\operatorname{Gal}(L/\Q)\cong\varprojlim_{n}(\Z/p^{n}\Z)^{\times}=\Z_{p}^{\times}
$$
（$\Z_{p}$ は $p$ 進整数環。\ref{ring:completion-examples}）。$\sigma\in\operatorname{Gal}(L/\Q)$ は、すべての $n$ で $\sigma(\zeta_{p^{n}})=\zeta_{p^{n}}^{a_{n}}$ となる両立する列 $(a_{n})$ に対応する。
:::

::: supplement
**射有限群.** コンパクト・ハウスドルフ・完全不連結な位相群を**射有限群**という。射有限群は有限群の逆極限と同値であり、すべての射有限群はあるガロア拡大のガロア群として現れることが知られている（ワーテルハウスの定理。本サイト未収録）。

**逆ガロア問題.** どの有限群が $\Q$ 上のガロア群として現れるか（逆ガロア問題）は未解決である。可解群（シャファレビッチ）や $S_{n}$, $A_{n}$ は現れることが知られている（本サイト未収録）。

**高い視点.** 絶対ガロア群 $G_{K}=\operatorname{Gal}(K^{\mathrm{sep}}/K)$ は、\ref{fld:page-grothendieck-galois}の無限版で、$K$ のエタール代数の圏を「$G_{K}$ が連続に作用する有限集合の圏」として表す。$\hat\Z$ は「円周の基本群 $\Z$ の射有限完備化」で、有限体はこの意味で円周に似ている（ヴェイユ予想の考え方の出発点）。
:::

## 問題 {#fld:sec-ig-problems}

::: problem {#fld:prob-ig-quadratic-compositum}
$L=\Q(\sqrt{2},\sqrt{3},\sqrt{5},\sqrt{7},\dots)$（全素数の平方根を添加）について、$\operatorname{Gal}(L/\Q)\cong\prod_{p}\Z/2\Z$ を示し、指数 2 の閉部分群と $\Q$ の 2 次部分体の対応を説明せよ。
:::

::: solution
有限ガロア部分拡大は $\Q(\sqrt{p_{1}},\dots,\sqrt{p_{k}})$ に含まれ、クンマー理論（\ref{fld:kummer-theory}、$n=2$）から $\operatorname{Gal}(\Q(\sqrt{p_{1}},\dots,\sqrt{p_{k}})/\Q)\cong(\Z/2\Z)^{k}$（$\sqrt{p_{i}}$ の符号を独立に変える）。逆極限は $\prod_{p}\Z/2\Z$（直積位相）。指数 2 の閉部分群は開部分群（有限指数の閉部分群は、補集合が有限個の閉な剰余類の和なので開）で、2 次の中間体 $\Q(\sqrt{d})$（$d$ は平方因子のない整数で $\pm1$ 以外、ただし $L$ に含まれるもの）に対応する。$-1$ は $L$ に平方根をもたない（$L\subset\mathbb{R}$）ので、$d>0$ だけが現れる。
:::
