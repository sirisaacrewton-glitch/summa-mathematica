# エタール代数 {#fld:page-etale-algebras keywords="etale algebra, finite separable algebra, A tensor K-bar reduced, Hom_K(A, K-bar) has dim A elements, L tensor L is a product of copies of L iff L/K is Galois, base change"}

体 $K$ 上の有限次元可換代数で、有限次分離拡大の直積と同型なものを**エタール代数**（有限分離代数）という。分離性は体の性質として定義したが（\ref{fld:separable-polynomial}）、エタール代数の言葉では「代数閉包へ係数拡大すると被約になる」「代数閉包への埋め込みがちょうど次元の個数だけある」と、元をとらずに言い換えられる。この言い換えで、ガロア拡大は「$L\otimes_{K}L\cong L^{[L:K]}$ となる拡大」、つまり「自分自身で係数拡大すると完全に分解する拡大」として特徴付けられる。次のページのグロタンディークのガロア理論（\ref{fld:page-grothendieck-galois}）では、エタール代数全体の圏が中心的な役割を果たす。

> 資料：Szamuely, *Galois Groups and Fundamental Groups* の目次の構成（エタール代数からグロタンディークのガロア理論へ）に従ったが、本文は資料によらず書いた。

## 記法と定義の確認 {#fld:sec-et-notation}

::: notation
- $K$ は体、$\bar K$ はその代数閉包（\ref{fld:algebraic-closure-existence}）。**$K$ 代数**は単位元をもつ可換環 $A$ と環準同型 $K\to A$ の組で、$\dim_{K}A<\infty$ のとき有限次元という。$\Hom_{K}(A,B)$ は $K$ 代数の準同型全体。
- 代数のテンソル積と係数拡大は \ref{mod:tensor-algebras}, \ref{mod:extension-of-scalars}、剰余とのテンソル積 $K[x]/(f)\otimes_{K}F\cong F[x]/(f)$ は \ref{mod:tensor-quotient}、中国剰余定理は \ref{ring:chinese-remainder}。
- アルティン環の構造定理（有限個のアルティン局所環の直積）は \ref{ring:artinian-structure}。有限次元 $K$ 代数は $K$ 部分空間の降鎖条件をみたすのでアルティン環。
- 分離次数・原始元定理・ガロア拡大の同値な定義は \ref{fld:separable-degree}, \ref{fld:primitive-element}, \ref{fld:galois-equivalent}。
- **選択公理**：$\bar K$ の存在に使う。
:::

## エタール代数の特徴付け {#fld:sec-et-characterization}

::: definition エタール代数 {#fld:etale-algebra keywords="etale algebra, finite separable algebra" index="エタール代数|えたーるだいすう, 分離代数（可換）|ぶんりだいすうかかん"}
有限次元 $K$ 代数 $A$ が、有限次分離拡大 $L_{1},\dots,L_{r}$ の直積 $L_{1}\times\cdots\times L_{r}$ と同型なとき、$A$ を（$K$ 上の）**エタール代数**という。
:::

::: lemma 単純拡大の係数拡大 {#fld:simple-base-change keywords="K[x]/(f) tensor F = F[x]/(f) splits as a product of copies of F iff f splits into distinct linear factors over F" index="係数拡大（単純拡大）|けいすうかくだいたんじゅんかくだい"}
$f\in K[x]$ をモニックで次数 $n$、$F/K$ を拡大とする。
1. $K[x]/(f)\otimes_{K}F\cong F[x]/(f)$。
2. $f$ が $F$ 上 $\prod_{i}(x-\beta_{i})$ と相異なる一次式の積に分解するなら $F[x]/(f)\cong F^{n}$。
3. $f$ が $\bar K$ で重根 $\beta$ をもつなら、$\bar K[x]/(f)$ は $0$ でない冪零元をもつ。
:::

::: proof
**1.** \ref{mod:tensor-quotient}（$K[x]\otimes_{K}F\cong F[x]$ と剰余）。**2.** $(x-\beta_{i})$ はどの二つも互いに素なので中国剰余定理（\ref{ring:chinese-remainder}）から $F[x]/(f)\cong\prod_{i}F[x]/(x-\beta_{i})\cong F^{n}$。**3.** $f=(x-\beta)^{2}g$ とすると $h=(x-\beta)g$ は $f$ で割り切れず（次数が小さい）$h^{2}=fg$ は割り切れる。
:::

::: theorem エタール代数の同値な条件 {#fld:etale-equivalent keywords="A is etale iff A tensor K-bar is reduced iff A tensor K-bar = K-bar^n iff |Hom_K(A, K-bar)| = dim A" index="エタール代数の特徴付け|えたーるだいすうのとくちょうづけ"}
有限次元 $K$ 代数 $A$（$n=\dim_{K}A$）について、次は同値である。
1. $A$ はエタール代数。
2. $\bar A\defeq A\otimes_{K}\bar K$ は被約（$0$ でない冪零元をもたない）。
3. $\bar K$ 代数として $\bar A\cong\bar K^{n}$。
4. $\lvert\Hom_{K}(A,\bar K)\rvert=n$。

また、一般に $\lvert\Hom_{K}(A,\bar K)\rvert\le n$ である。
:::

::: proof
**Step 1（1 ⇒ 3）.** $A=\prod_{j}L_{j}$ なら $\bar A=\prod_{j}(L_{j}\otimes_{K}\bar K)$（テンソル積は直積（有限直和）と交換）。$L_{j}=K(\alpha_{j})\cong K[x]/(f_{j})$（原始元定理 \ref{fld:primitive-element}、$f_{j}$ は分離的な最小多項式）なので、\ref{fld:simple-base-change} から $L_{j}\otimes\bar K\cong\bar K^{[L_{j}:K]}$。次元を合わせて $\bar A\cong\bar K^{n}$。

**Step 2（3 ⇒ 2）.** $\bar K^{n}$ は被約。

**Step 3（2 ⇒ 1）.** $A\to\bar A$, $a\mapsto a\otimes1$ は単射（$\bar K$ は $K$ 上自由で、$K$ の基底の一つを $1$ にとれる）なので $A$ も被約。$A$ はアルティン環なので、構造定理（\ref{ring:artinian-structure}）から局所アルティン環の直積で、各成分も被約。被約なアルティン局所環の極大イデアルは冪零（\ref{ring:akizuki-hopkins}：冪零根基は冪零で、素イデアルは極大イデアルだけ）なので $0$、すなわち各成分は体 $L_{j}$。$L_{j}$ が分離的でないとすると、分離的でない元 $\alpha\in L_{j}$ の最小多項式 $f$ は $\bar K$ で重根をもち（\ref{fld:separable-degree.1}）、$K(\alpha)\otimes\bar K\cong\bar K[x]/(f)$ は $0$ でない冪零元をもつ（\ref{fld:simple-base-change.3}）。$K(\alpha)\subset L_{j}$ から $K(\alpha)\otimes\bar K\to L_{j}\otimes\bar K\subset\bar A$ は単射（体上の線形写像の係数拡大）なので、$\bar A$ が被約であることに反する。

**Step 4（4 と不等式）.** $\Hom_{K}(A,\bar K)\cong\Hom_{\bar K}(\bar A,\bar K)$（係数拡大の普遍性 \ref{mod:extension-of-scalars}）。$A=\prod_{j}A_{j}$（局所アルティン環、剰余体 $k_{j}$）とすると、体への準同型の核は素イデアルで、$A$ の素イデアルは $A_{1}\times\dots\times\mathfrak{m}_{j}\times\dots\times A_{r}$ の形なので、$\Hom_{K}(A,\bar K)=\bigsqcup_{j}\Hom_{K}(k_{j},\bar K)$。$\lvert\Hom_{K}(k_{j},\bar K)\rvert=[k_{j}:K]_{s}\le[k_{j}:K]\le\dim_{K}A_{j}$ で、和をとって $\le n$。等号は、すべての $j$ で $[k_{j}:K]_{s}=[k_{j}:K]$（$k_{j}$ が分離的）かつ $A_{j}=k_{j}$（$A_{j}$ が体）のとき、すなわち 1 のとき。よって 1 ⇔ 4。
:::

::: corollary エタール代数の閉包性 {#fld:etale-closure keywords="etale algebras are closed under products, tensor products, quotients, subalgebras and base change" index="エタール代数の閉包性|えたーるだいすうのへいほうせい"}
$K$ 上のエタール代数 $A,B$ について、$A\times B$、$A\otimes_{K}B$、$A$ の部分代数・剰余代数はエタール。拡大 $F/K$ について $A\otimes_{K}F$ は $F$ 上エタール。
:::

::: proof
条件 3（$\bar K$ 上で $\bar K^{n}$ と同型）で確かめる。直積・テンソル積：$\bar K^{n}\times\bar K^{m}$, $\bar K^{n}\otimes_{\bar K}\bar K^{m}\cong\bar K^{nm}$。部分代数 $B\subset A$：$\bar B\subset\bar A$（体上の係数拡大は単射を保つ）は被約な代数の部分代数で被約、条件 2。剰余：$A=\prod L_{j}$ のイデアルは成分ごとに $0$ か $L_{j}$ なので、剰余はいくつかの $L_{j}$ の直積。係数拡大：$(A\otimes_{K}F)\otimes_{F}\bar F\cong A\otimes_{K}\bar F$ で、$\bar F\supset\bar K$ なので $\cong\bar A\otimes_{\bar K}\bar F\cong\bar F^{n}$、$F$ 上の条件 3。
:::

## ガロア拡大の特徴付け {#fld:sec-et-galois}

::: theorem $L\otimes_{K}L$ によるガロアの特徴付け {#fld:galois-tensor keywords="a finite extension L/K is Galois iff L tensor_K L is isomorphic to L^[L:K] as L-algebras; explicit isomorphism via the Galois group" index="L ⊗ L とガロア拡大|えるてんそるえるとがろあかくだい"}
有限次拡大 $L/K$（$n=[L:K]$）について、$L\otimes_{K}L$ を第 2 成分で $L$ 代数とみる。次は同値である。
1. $L/K$ はガロア拡大。
2. $L$ 代数として $L\otimes_{K}L\cong L^{n}$。

このとき、同型は $x\otimes y\mapsto(\sigma(x)\,y)_{\sigma\in\operatorname{Gal}(L/K)}$ で与えられる。
:::

::: proof
**Step 1（2 ⇒ 1）.** $\Hom_{K}(L,L)\cong\Hom_{L}(L\otimes_{K}L,L)$（係数拡大の普遍性）。$L^{n}$ から体 $L$ への $L$ 代数の準同型は $n$ 個の射影だけ（核は極大イデアルで、それは一つの成分を $0$ にするもの）なので、$\lvert\operatorname{Aut}(L/K)\rvert=\lvert\Hom_{K}(L,L)\rvert=n=[L:K]$（体の自己準同型は単射で、次数を比べて全射）。\ref{fld:galois-equivalent} から $L/K$ はガロア。

**Step 2（1 ⇒ 2）.** $\Phi:L\otimes_{K}L\to\prod_{\sigma}L$, $x\otimes y\mapsto(\sigma(x)y)_{\sigma}$ は $L$ 代数の準同型（$(x,y)\mapsto(\sigma(x)y)$ が双線形で、積を保つ）。両辺は $L$ 上 $n$ 次元。全射性：像は $L$ 部分空間で、もし真の部分空間なら、それを消す $0$ でない $L$ 線形汎関数 $v\mapsto\sum_{\sigma}c_{\sigma}v_{\sigma}$ がある。$\Phi(x\otimes1)=(\sigma(x))_{\sigma}$ に施すと、すべての $x\in L$ で $\sum_{\sigma}c_{\sigma}\sigma(x)=0$ となる。これはデデキントの補題（\ref{fld:dedekind-independence}）に反する。よって $\Phi$ は全射、次元から同型。
:::

::: example
1. $L=\Q(\sqrt{2})$：$L\otimes_{\Q}L\cong L[x]/(x^{2}-2)\cong L\times L$（$x^{2}-2=(x-\sqrt2)(x+\sqrt2)$）。
2. $L=\Q(\sqrt[3]{2})$：$L\otimes_{\Q}L\cong L[x]/(x^{3}-2)\cong L\times L(\omega\sqrt[3]{2})$（$x^{3}-2=(x-\sqrt[3]{2})(x^{2}+\sqrt[3]{2}x+\sqrt[3]{4})$ で、2 次の因子は $L\subset\mathbb{R}$ 上既約）。エタールだが $L^{3}$ ではないので、$L/\Q$ はガロアでない。
3. $K=\mathbb{F}_{p}(t)$, $L=K(t^{1/p})$：$L\otimes_{K}L\cong L[x]/(x^{p}-t)=L[x]/((x-t^{1/p})^{p})$ は冪零元 $x-t^{1/p}$ をもち、エタールでない（$L/K$ は分離的でない）。
:::

::: supplement
**名前の由来.** 「エタール」は代数幾何の用語で、$\Spec A\to\Spec K$ が「不分岐かつ平坦」であることを指す。体上では、それは $A$ が分離的な体の直積であることと同値である。代数閉体上のエタール代数は $\bar K^{n}$ だけで、幾何的には「$n$ 個の点」に当たる。

**トレース形式による判定.** 有限次元 $K$ 代数 $A$ がエタールであることは、トレース形式 $(a,b)\mapsto\operatorname{Tr}_{A/K}(ab)$ が非退化であることとも同値であることが知られている（体の場合は \ref{ring:trace-conjugates.3}。一般の場合は本サイト未収録）。
:::

## 問題 {#fld:sec-et-problems}

::: problem {#fld:prob-et-quadratic}
$\operatorname{char}K\neq2$、$d\in K$ とする。$A=K[x]/(x^{2}-d)$ がエタールであるための条件を求め、$A$ を体の直積で表せ。
:::

::: solution
$x^{2}-d$ が $\bar K$ で重根をもつのは $d=0$ のときだけなので、$d\neq0$ ならエタール、$d=0$ なら $A=K[x]/(x^{2})$ は冪零元 $\bar x$ をもちエタールでない（\ref{fld:simple-base-change}）。$d\neq0$ のとき、$d$ が $K$ の平方 $c^{2}$ なら $A\cong K\times K$（中国剰余定理、$(x-c),(x+c)$）、平方でなければ $x^{2}-d$ は既約で $A\cong K(\sqrt{d})$。
:::
