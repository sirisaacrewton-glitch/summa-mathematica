# 分離生成拡大 {#fld:page-separably-generated keywords="separating transcendence basis, separably generated extension, finitely generated extensions of a perfect field are separably generated, MacLane criterion, purely inseparable"}

有限生成拡大 $L/K$ に、$L/K(B)$ が**分離的**な代数拡大になる超越基底 $B$（**分離超越基底**）があるとき、$L/K$ は**分離生成**であるという。標数 $0$ ではすべての有限生成拡大が分離生成だが、標数 $p$ では超越基底の選び方が重要で、$\mathbb{F}_{p}(x)$ の超越基底 $\{x^{p}\}$ のように分離的でないものもある。このページの主定理は、**完全体上の有限生成拡大は分離生成で、分離超越基底は生成元の中から選べる**ことである。これは代数幾何で、完全体上の多様体の関数体を「有理関数体の有限次分離拡大」として扱うための基礎になる。

> Jacobson, *Basic Algebra II* の該当節の構成を参考にし、証明は既存の分離性の結果から組み立てた。マクレーンの判定法は主張だけを述べる。

## 記法と定義の確認 {#fld:sec-sg-notation}

::: notation
- 超越基底・超越次数・交換の性質は \ref{fld:algebraic-independence}, \ref{fld:transcendence-degree}, \ref{fld:exchange-lemma}, \ref{fld:transcendence-basis-exists}。
- 分離性の判定（既約多項式が分離的 $\iff$ 微分が $0$ でない）・完全体・分離拡大の推移性は \ref{fld:separable-criterion}, \ref{fld:perfect-field}, \ref{fld:separable-degree}。
- 多変数多項式環は UFD で、ガウスの補題（$A$ が UFD なら、$A[X]$ の既約元で次数正のものは $\operatorname{Frac}(A)[X]$ でも既約）が成り立つ（\ref{ring:polynomial-ufd}, \ref{ring:gauss-lemma}）。
- **選択公理**：使わない（有限生成の拡大だけを扱う）。
:::

## 分離生成 {#fld:sec-sg-definition}

::: definition 分離超越基底・分離生成 {#fld:separably-generated keywords="separating transcendence basis, separably generated extension" index="分離超越基底|ぶんりちょうえつきてい, 分離生成|ぶんりせいせい"}
有限生成拡大 $L/K$ の超越基底 $B$ で、$L/K(B)$ が分離拡大になるものを**分離超越基底**という。分離超越基底をもつとき $L/K$ は**分離生成**であるという。
:::

::: example
1. $\operatorname{char}K=0$ なら、すべての超越基底が分離超越基底（標数 $0$ の代数拡大は分離的）。
2. $K=\mathbb{F}_{p}$, $L=\mathbb{F}_{p}(x)$：$\{x\}$ は分離超越基底だが、$\{x^{p}\}$ は超越基底なのに分離的でない（$x$ の $K(x^{p})$ 上の最小多項式は $T^{p}-x^{p}=(T-x)^{p}$）。
3. $K=\mathbb{F}_{p}(t)$, $L=K(t^{1/p})$：超越次数 $0$ で超越基底は空集合だけ、$L/K$ は分離的でないので、分離生成でない。基礎体 $K$ が完全でないと主定理は成り立たない。
:::

::: lemma 一つの関係式からの交換 {#fld:separable-exchange keywords="if F(x_1,...,x_{d+1}) = 0 is a relation of minimal degree and dF/dX_i != 0, then x_i is separable algebraic over the others, which form a transcendence basis" index="分離的な交換|ぶんりてきなこうかん"}
$K$ を体、$x_{1},\dots,x_{d+1}\in L$ で、$K(x_{1},\dots,x_{d+1})/K$ の超越次数が $d$ とする。$F(x_{1},\dots,x_{d+1})=0$ となる $0$ でない $F\in K[X_{1},\dots,X_{d+1}]$ のうち全次数が最小のものをとる。
1. $F$ は既約。
2. $\partial F/\partial X_{i}\neq0$ なら、$\{x_{j}\}_{j\neq i}$ は $K(x_{1},\dots,x_{d+1})/K$ の超越基底で、$x_{i}$ はその上で分離的。
:::

::: proof
**Step 1（1）.** $F=GH$ なら $G(x)H(x)=0$ でどちらかが $0$、全次数の最小性から $G$ か $H$ は定数。

**Step 2（2：係数は消えない）.** $F=\sum_{k}g_{k}X_{i}^{k}$（$g_{k}$ は $X_{i}$ 以外の変数の多項式）と書く。$\partial F/\partial X_{i}\neq0$ なので $X_{i}$ は $F$ に現れ、$0$ でない $g_{k}$ で $k\ge1$ のものがある。$0$ でない $g_{k}$ について、$g_{k}(x)\neq0$：$g_{k}$ は $F$ より全次数が小さいので、最小性から $x$ で $0$ にならない。よって $F(x_{1},\dots,X_{i},\dots,x_{d+1})$ は $K(x_{j}:j\neq i)$ 上の $0$ でない多項式で、$x_{i}$ を根にもつ。$x_{i}$ はほかの $d$ 個に従属するので、ほかの $d$ 個は $d$ 次元の超越次数の体を代数的にする $d$ 元で、超越基底（\ref{fld:transcendence-basis-exists} から基底を含み、濃度から一致）。

**Step 3（2：分離性）.** $y_{j}\defeq x_{j}$（$j\neq i$）は独立なので $K[X_{j}:j\neq i]\cong K[y]$。$F$ は既約で $X_{i}$ を含むので、ガウスの補題から $F$ は $K(y)[X_{i}]$ でも既約。よって $f(T)\defeq F(y,T)$ は $x_{i}$ の $K(y)$ 上の最小多項式の定数倍で、$f'(T)=(\partial F/\partial X_{i})(y,T)\neq0$（同型 $K[X]\cong K[y][X_{i}]$ で微分は保たれる）。既約で微分が $0$ でないので分離的（\ref{fld:separable-criterion}）。
:::

::: theorem 完全体上の有限生成拡大 {#fld:perfect-separably-generated keywords="finitely generated extensions of a perfect field are separably generated, with a separating transcendence basis chosen among the generators" index="完全体上の分離生成|かんぜんたいじょうのぶんりせいせい"}
$K$ を完全体、$L=K(x_{1},\dots,x_{n})$ とする。生成元の中から、$L/K$ の分離超越基底を選べる。
:::

::: proof
**Step 1（帰納法の設定）.** $n$ についての帰納法。$d=\operatorname{trdeg}_{K}L$ とする。$\{x_{1},\dots,x_{n}\}$ が独立（$n=d$）なら、それ自身が分離超越基底（$L=K(B)$）。以下、独立でないとし、生成元の中の超越基底を番号を付け替えて $x_{1},\dots,x_{d}$ とする（\ref{fld:transcendence-basis-exists}。$T$ が有限なので選択公理は要らない）。

**Step 2（関係式の微分）.** $L_{0}\defeq K(x_{1},\dots,x_{d+1})$ は超越次数 $d$。\ref{fld:separable-exchange} の最小次数の関係式 $F$ をとる。$\partial F/\partial X_{i}=0$ がすべての $i$ で成り立つと仮定すると、$F$ に現れる単項式の指数はすべて $p=\operatorname{char}K$ の倍数で（標数 $0$ ならこれは $F$ が定数のときだけで、不可能）、$F=\sum_{\alpha}a_{\alpha}X^{p\alpha}$。$K$ は完全なので $a_{\alpha}=b_{\alpha}^{p}$ となる $b_{\alpha}\in K$ があり、$F=(\sum b_{\alpha}X^{\alpha})^{p}$ はフロベニウスの加法性から $p$ 乗で、$F$ の既約性（\ref{fld:separable-exchange.1}）に反する。よって $\partial F/\partial X_{i}\neq0$ となる $i\le d+1$ がある。

**Step 3（交換）.** \ref{fld:separable-exchange.2} から、$x_{i}$ は $B^{\prime}\defeq\{x_{j}:j\le d+1, j\neq i\}$ の上で分離的。$L_{1}\defeq K(x_{j}:j\neq i)$（$n-1$ 個で生成）は $B^{\prime}$ を含み、$L=L_{1}(x_{i})$ は $L_{1}$ 上代数的なので $\operatorname{trdeg}L_{1}=d$。帰納法の仮定から、$L_{1}$ の生成元の中に分離超越基底 $B''$ がある（$L_{1}/K(B'')$ は分離的）。

**Step 4（結論）.** $x_{i}$ は $K(B^{\prime})\subset L_{1}$ 上分離的なので $L_{1}$ 上も分離的（最小多項式が割り切る）、$L=L_{1}(x_{i})/L_{1}$ は分離拡大（\ref{fld:separable-degree.4}）。$L_{1}/K(B'')$ も分離的なので、推移性（\ref{fld:separable-degree.5}）から $L/K(B'')$ は分離拡大。$B''$ は $L/K$ の超越基底でもある（$L$ は $L_{1}$ 上代数的）ので、分離超越基底。

::: hypcheck
- **前提「完全体」**：Step 2 で係数の $p$ 乗根をとるのに使った。外すと偽（例 3）。
- **前提「有限生成」**：帰納法と、最小次数の関係式をとるのに使った。
:::
:::

::: supplement
**マクレーンの判定法.** 標数 $p$ の体 $K$ 上の有限生成拡大 $L$ が分離生成であることは、$L$ と $K^{1/p}$ が（共通の代数閉包の中で）$K$ 上線形無関連であることと同値であることが知られている（マクレーン、1939 年。本サイト未収録）。

**微分による特徴付け.** 分離生成な $L/K$ では、$K$ 上の微分 $\operatorname{Der}_{K}(L,L)$ の $L$ 上の次元が超越次数に等しい（分離超越基底の各元についての偏微分が基底になる）。完全体上の多様体の関数体についてのこの事実は、代数幾何の微分形式の層の議論の出発点である（\ref{ring:jacobian-criterion} のヤコビアンの判定法と関係する。本サイト未収録）。

**体論の系列のまとめ.** 代数拡大（\ref{fld:page-algebraic-extensions}）・分離拡大（\ref{fld:page-separable}）・ガロア理論（\ref{fld:page-fundamental-theorem}）・その展開（\ref{fld:page-grothendieck-galois}, \ref{fld:page-infinite-galois}）を経て、超越拡大はこのページの「有限次分離拡大と純超越拡大への分解」で、代数拡大の理論に帰着される。
:::

## 問題 {#fld:sec-sg-problems}

::: problem {#fld:prob-sg-curve}
$K=\mathbb{F}_{p}$（$p\neq2$）、$L=K(x,y)$ で $y^{2}=x^{3}+1$ とする（$x$ は超越的）。$\{x\}$ が分離超越基底であることを示し、$\{y\}$ も分離超越基底であるかを調べよ。
:::

::: solution
$y$ の $K(x)$ 上の最小多項式は $T^{2}-(x^{3}+1)$（$x^{3}+1$ は $K(x)$ の平方でない：平方なら次数 3 が偶数になる）で、微分 $2T\neq0$（$p\neq2$）なので分離的。$\{y\}$ について、$x$ は $T^{3}-(y^{2}-1)$ の根で、これは $K(y)$ 上既約（$y^{2}-1$ は $K(y)$ の 3 乗でない：次数を比べる）。微分 $3T^{2}$ は $p\neq3$ なら $0$ でなく分離的。$p=3$ では $T^{3}-(y^{2}-1)$ は微分が $0$ で分離的でなく、$\{y\}$ は分離超越基底でない（$x$ は $K(y)$ 上純非分離）。完全体上でも、どの超越基底でもよいわけではない。
:::
