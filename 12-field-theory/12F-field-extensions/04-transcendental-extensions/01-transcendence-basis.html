# 超越基底と超越次数 {#fld:page-transcendence-basis keywords="algebraically independent, transcendence basis, transcendence degree, exchange lemma, existence of transcendence bases, additivity of transcendence degree, Steinitz theorem on algebraically closed fields, transcendence degree of C over Q"}

代数的でない拡大を調べるには、ベクトル空間の基底に当たる**超越基底**を使う：拡大 $L/K$ の部分集合 $B$ で、$B$ の元の間に多項式の関係がなく（**代数的独立**）、$L$ が $K(B)$ 上代数的になるもの。ベクトル空間の基底と同じく、超越基底は存在し（選択公理）、その濃度は一定である（**超越次数**）。証明の鍵は、代数的従属性が一次従属性と同じ「交換の性質」をもつことである。応用として、代数閉体はその標数と超越次数で同型を除いて決まる（シュタイニッツ）。

> 雪江『代数学 3』と Jacobson, *Basic Algebra II* の該当節を参考にし、証明は交換の性質から統一的に組み立てた。

## 記法と定義の確認 {#fld:sec-tb-notation}

::: notation
- $L/K$ は体の拡大。$S\subset L$ について $K(S)$ は $S$ で生成される部分体（\ref{fld:generated-subfield}）。$x$ が $K(S)$ 上代数的であることを「$x$ は $S$ に**代数的に従属**する」という。
- 代数拡大の推移性と相対代数閉包は \ref{fld:algebraic-transitive}, \ref{fld:relative-algebraic-closure}、代数閉包の存在と一意性は \ref{fld:algebraic-closure-existence}, \ref{fld:algebraic-closure-uniqueness}。
- ツォルンの補題は \ref{set:zorn}、無限基数 $\kappa$ について $\kappa\cdot\aleph_{0}=\kappa$ は \ref{set:kappa-times-kappa}。
- **選択公理**：超越基底の存在（ツォルンの補題）と、無限の場合の濃度の比較（基数の積）で使う。有限生成の拡大では使わない。
:::

## 代数的独立と交換の性質 {#fld:sec-tb-independence}

::: definition 代数的独立・超越基底 {#fld:algebraic-independence keywords="algebraically independent set, transcendence basis" index="代数的独立|だいすうてきどくりつ, 超越基底|ちょうえつきてい, 純超越拡大|じゅんちょうえつかくだい"}
1. $S\subset L$ が $K$ 上**代数的独立**であるとは、相異なる $s_{1},\dots,s_{n}\in S$ と $0$ でない $f\in K[x_{1},\dots,x_{n}]$ について常に $f(s_{1},\dots,s_{n})\neq0$ となることをいう。このとき $K(S)$ は $S$ を変数とする有理関数体と同型で、$K(S)/K$ を**純超越拡大**という。
2. $K$ 上代数的独立な $B\subset L$ で、$L$ が $K(B)$ 上代数的なものを $L/K$ の**超越基底**という。
:::

::: lemma 独立性の言い換え {#fld:independence-criterion keywords="S is algebraically independent iff no s in S is algebraic over K(S - {s})" index="代数的独立の判定|だいすうてきどくりつのはんてい"}
$S\subset L$ が代数的独立 $\iff$ どの $s\in S$ も $S\setminus\{s\}$ に代数的に従属しない。また、$S$ が代数的独立で $x\in L$ が $S$ に代数的に従属しないなら、$S\cup\{x\}$ も代数的独立。
:::

::: proof
**Step 1（後半）.** $S\cup\{x\}$ の元の間の関係 $f(s_{1},\dots,s_{n},x)=0$（$f\neq0$）があるとし、$f=\sum_{i}g_{i}(x_{1},\dots,x_{n})T^{i}$ と書く。$S$ が独立なので、$0$ でない $g_{i}$ について $g_{i}(s)\neq0$。よって $\sum_{i}g_{i}(s)T^{i}$ は $K(S)$ 上の $0$ でない多項式で $x$ を根にもち、$x$ は $S$ に従属する。

**Step 2（前半 $\Rightarrow$）.** $s$ が $K(S\setminus\{s\})$ 上代数的なら、分母を払って $K[S\setminus\{s\}][T]$ の $0$ でない多項式 $F(T)$ で $F(s)=0$ となるものがあり、これは $S$ の元の間の $0$ でない関係。

**Step 3（前半 $\Leftarrow$）.** $S$ が独立でないとし、関係に現れる元 $s_{1},\dots,s_{n}$ を、関係が成り立つ最小の個数 $n$ でとる。$\{s_{1},\dots,s_{n-1}\}$ は独立（最小性）で、$s_{n}$ がそれに従属しなければ Step 1 から $\{s_{1},\dots,s_{n}\}$ が独立になり矛盾。よって $s_{n}$ は $S\setminus\{s_{n}\}$ に従属する。
:::

::: lemma 交換の性質 {#fld:exchange-lemma keywords="exchange property of algebraic dependence: if y is algebraic over K(S, x) but not over K(S) then x is algebraic over K(S, y)" index="交換の性質|こうかんのせいしつ, 交換補題（代数的従属）|こうかんほだいだいすうてきじゅうぞく"}
$S\subset L$, $x,y\in L$ について、$y$ が $S\cup\{x\}$ に従属し $S$ に従属しないなら、$x$ は $S\cup\{y\}$ に従属する。
:::

::: proof
$F:=K(S)$ とおく。$y$ は $F(x)$ 上代数的なので、分母を払って $0$ でない $P(X,T)\in F[X,T]$ で $P(x,y)=0$ となるものがある。$P=\sum_{i}G_{i}(T)X^{i}$（$G_{i}\in F[T]$）と書く。$y$ は $F$ 上超越的なので、$0$ でない $G_{i}$ について $G_{i}(y)\neq0$。よって $P(X,y)=\sum_{i}G_{i}(y)X^{i}$ は $F(y)$ 上の $0$ でない多項式で、$x$ を根にもつ。
:::

## 超越基底の存在と超越次数 {#fld:sec-tb-degree}

::: theorem 超越基底の存在 {#fld:transcendence-basis-exists keywords="every independent set extends to a transcendence basis contained in a given generating set; maximal independent sets are bases" index="超越基底の存在|ちょうえつきていのそんざい"}
（AC）$S\subset T\subset L$ で、$S$ は代数的独立、$L$ は $K(T)$ 上代数的とする。このとき $S\subset B\subset T$ となる超越基底 $B$ がある。特に $L/K$ は超越基底をもつ。$T$ が有限なら選択公理は要らない。
:::

::: proof
**Step 1（ツォルン）.** $S\subset B\subset T$ となる代数的独立な $B$ 全体を包含で順序付ける。鎖の和集合も代数的独立（関係は有限個の元しか使わないので、鎖のある一つの元の中で成り立つ）。ツォルンの補題（\ref{set:zorn}）から極大な $B$ がある。$T$ が有限なら、極大なものは有限個の候補から選べる。

**Step 2（極大なら基底）.** $t\in T\setminus B$ が $B$ に従属しなければ、\ref{fld:independence-criterion} の後半から $B\cup\{t\}$ が独立で、極大性に反する。よってすべての $t\in T$ は $K(B)$ 上代数的で、$K(T)$ は $K(B)$ 上代数的（\ref{fld:relative-algebraic-closure}）。$L$ は $K(T)$ 上代数的なので、推移性（\ref{fld:algebraic-transitive}）から $L$ は $K(B)$ 上代数的。
:::

::: theorem 超越次数の一意性 {#fld:transcendence-degree keywords="any two transcendence bases have the same cardinality; transcendence degree" index="超越次数|ちょうえつじすう"}
$B,B'$ を $L/K$ の超越基底とすると $\lvert B\rvert=\lvert B'\rvert$（$B$ が有限なら選択公理なしで）。この濃度を $L/K$ の**超越次数** $\operatorname{trdeg}_{K}L$ という。
:::

::: proof
**Step 1（有限の場合：交換）.** $L$ が $K(b_{1},\dots,b_{n})$ 上代数的で、$c_{1},\dots,c_{m}\in L$ が独立なら $m\le n$ であることを示す（$B'$ の任意の有限部分集合に使えば $\lvert B'\rvert\le n$、対称に等号）。$k=0,1,\dots$ について、$b$ の番号を付け替えて「$L$ は $K(c_{1},\dots,c_{k},b_{k+1},\dots,b_{n})$ 上代数的」とできることを帰納法で示す。$k=0$ は仮定。$k$ で成り立ち $k<m$ とする。$c_{k+1}$ は $\{c_{1},\dots,c_{k},b_{k+1},\dots,b_{n}\}$ に従属するが、$\{c_{1},\dots,c_{k}\}$ には従属しない（独立性と \ref{fld:independence-criterion}）。特に $k<n$。$c_{k+1}$ が $\{c_{1},\dots,c_{k},b_{k+1},\dots,b_{j}\}$ に従属する最小の $j$ をとると、$c_{k+1}$ は $S\defeq\{c_{1},\dots,c_{k},b_{k+1},\dots,b_{j-1}\}$ に従属せず $S\cup\{b_{j}\}$ に従属するので、交換の性質（\ref{fld:exchange-lemma}）から $b_{j}$ は $S\cup\{c_{k+1}\}$ に従属する。$b_{j}$ と $b_{k+1}$ の番号を入れ替えると、$b_{k+1}$ は $\{c_{1},\dots,c_{k+1},b_{k+2},\dots,b_{n}\}$ に従属するので、$K(c_{1},\dots,c_{k},b_{k+1},\dots,b_{n})$ はこの集合の生成する体の上代数的で、推移性（\ref{fld:algebraic-transitive}）から $L$ も代数的。こうして $k$ を $m$ まで進められ、その途中で常に $k<n$ だったので $m\le n$。

**Step 2（無限の場合）.** $B,B'$ が無限とする。各 $b'\in B'$ は $K(B)$ 上代数的なので、その最小多項式の係数に現れる有限部分集合 $B_{b'}\subset B$ に従属する。$B_{0}\defeq\bigcup_{b'\in B'}B_{b'}$ とすると、$K(B')$ は $K(B_{0})$ 上代数的、したがって $L$ も代数的。$b\in B\setminus B_{0}$ があれば $b$ は $B_{0}\subset B\setminus\{b\}$ に従属し、$B$ の独立性に反する（\ref{fld:independence-criterion}）。よって $B=B_{0}$ で、$\lvert B\rvert\le\lvert B'\rvert\cdot\aleph_{0}=\lvert B'\rvert$（\ref{set:kappa-times-kappa}）。対称に $\lvert B'\rvert\le\lvert B\rvert$。$B$ が有限で $B'$ が無限になることは Step 1 からない。
:::

::: corollary 超越次数の加法性 {#fld:trdeg-additivity keywords="trdeg is additive in towers; union of transcendence bases" index="超越次数の加法性|ちょうえつじすうのかほうせい"}
$K\subset L\subset M$ について、$L/K$ の超越基底 $B$ と $M/L$ の超越基底 $C$ の和 $B\cup C$ は $M/K$ の超越基底で（$B\cap C=\emptyset$）、$\operatorname{trdeg}_{K}M=\operatorname{trdeg}_{K}L+\operatorname{trdeg}_{L}M$。
:::

::: proof
**独立.** $B\cup C$ の元の間の関係 $f(b,c)=0$ を、$c$ の多項式で係数が $K[b]$ のものとみると、$C$ は $L$ 上独立なので係数はすべて $0$、さらに $B$ が $K$ 上独立なので $f=0$。$B\subset L$ で $C$ は $L$ 上独立なので $B\cap C=\emptyset$。

**代数的.** $L$ は $K(B)$ 上代数的なので $L(C)$ は $K(B\cup C)$ 上代数的（生成元 $L$ の元が代数的。\ref{fld:relative-algebraic-closure}）、$M$ は $L(C)$ 上代数的なので、推移性から $M$ は $K(B\cup C)$ 上代数的。
:::

::: example
1. $\operatorname{trdeg}_{K}K(x_{1},\dots,x_{n})=n$（$x_{i}$ が超越基底）。$K(x_{1},\dots,x_{n})$ と $K(y_{1},\dots,y_{m})$ が $K$ 上同型なら $n=m$。
2. 体上有限生成な整域 $A$ の次元は $\operatorname{trdeg}_{K}\operatorname{Frac}A$（ネーターの正規化 \ref{ring:noether-normalization} で $A$ が $K[y_{1},\dots,y_{d}]$ 上整になるとき、$y_{i}$ が超越基底）。
3. $\operatorname{trdeg}_{\Q}\mathbb{C}=2^{\aleph_{0}}$：可算な $S$ について $\Q(S)$ は可算で、その代数閉包も可算（各多項式の根は有限個）。$\mathbb{C}$ は非可算なので超越基底 $B$ は非可算で、$\mathbb{C}$ は $\Q(B)$ の代数閉包なので $\lvert\mathbb{C}\rvert=\max(\lvert B\rvert,\aleph_{0})=\lvert B\rvert$。
:::

::: theorem シュタイニッツの定理 {#fld:steinitz-acf keywords="algebraically closed fields are determined up to isomorphism by characteristic and transcendence degree; uncountable algebraically closed fields of the same cardinality and characteristic are isomorphic" index="シュタイニッツの定理|しゅたいにっつのていり"}
（AC）代数閉体 $\Omega,\Omega'$ が同じ標数で、素体上の超越次数が等しければ $\Omega\cong\Omega'$。特に、非可算な代数閉体は標数と濃度で同型を除いて決まり、標数 $0$ で濃度 $2^{\aleph_{0}}$ の代数閉体は $\mathbb{C}$ と同型。
:::

::: proof
**Step 1.** 素体 $P$ は共通。超越基底 $B,B'$ の間の全単射は同型 $P(B)\cong P(B')$（有理関数体の変数の付け替え）を与える。$\Omega$ は $P(B)$ 上代数的で代数閉なので $P(B)$ の代数閉包、$\Omega'$ も同様。代数閉包の一意性（\ref{fld:algebraic-closure-uniqueness}）から、同型は $\Omega\cong\Omega'$ に延長される。

**Step 2.** $\Omega$ が非可算なら、例 3 と同じ議論で $\lvert\Omega\rvert=\lvert B\rvert$（素体と $B$ の生成する体の代数閉包は $\max(\lvert B\rvert,\aleph_{0})$ の濃度）。よって超越次数は濃度で決まる。
:::

::: supplement
**モデル理論との関係.** シュタイニッツの定理は、標数を固定した代数的閉体の理論 $\mathrm{ACF}_{p}$（\ref{model:acf}）が非可算なすべての濃度で範疇的であることを述べている。代数的従属性は、モデル理論の「代数閉包」が交換の性質をもつ例（強極小構造）の原型である。

**一般化.** 交換の性質をもつ閉包作用素（マトロイド）一般について、基底の存在と濃度の一意性が同じ証明で成り立つ。ベクトル空間の一次従属（\ref{mod:vector-space-dimension}）とこのページの代数的従属はその二つの例である。

**リューローの定理.** $K\subset M\subset K(x)$（$x$ は超越的）で $M\neq K$ なら $M\cong K(y)$（純超越）であることが知られている（リューローの定理。本サイト未収録）。
:::

## 問題 {#fld:sec-tb-problems}

::: problem {#fld:prob-tb-two-variables}
$L=\Q(x,y)$（$x,y$ は不定元）、$s=x+y$, $t=xy$ とする。$\{s,t\}$ は $L/\Q$ の超越基底であることを示し、$[L:\Q(s,t)]$ を求めよ。
:::

::: solution
$x,y$ は $T^{2}-sT+t\in\Q(s,t)[T]$ の根なので $L$ は $\Q(s,t)$ 上代数的で、$[L:\Q(s,t)]\le2$。超越次数は 2（例 1）なので、$\Q(s,t)$ の超越基底 $\subset\{s,t\}$ は 2 元、すなわち $\{s,t\}$ 自身が独立で超越基底（\ref{fld:transcendence-basis-exists} と \ref{fld:transcendence-degree}）。$x\notin\Q(s,t)$（$x,y$ の入れ替えは $\Q(s,t)$ を固定し $x$ を動かす）なので $[L:\Q(s,t)]=2$（\ref{fld:general-polynomial} の $n=2$ の場合）。
:::
