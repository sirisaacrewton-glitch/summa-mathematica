# 群論（Group Theory）

群論の基礎、有限群、表現論、組合せ群論、アーベル群。

<p class="mn-msc">MSC2020: 20A, 20C, 20D, 20F, 20K</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-groups/index.html"><span class="mn-card-title">群と準同型</span><span class="mn-card-en">Groups and Homomorphisms</span><span class="mn-card-desc">群の定義と例（対称群・二面体群・四元数群・行列群）、一般結合法則と冪、部分群と生成された部分群、元の位数、巡回群とその部分群、剰余類とラグランジュの定理、正規部分群と剰余群、準同型定理、直積と半直積、群の拡大とシューア–ツァッセンハウスの定理（雪江『代数学 1』第 2 章に対応）。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="02-group-actions/index.html"><span class="mn-card-title">群の作用と対称群</span><span class="mn-card-en">Group Actions and Symmetric Groups</span><span class="mn-card-desc">群の作用・軌道・安定化群とケイリーの定理、類等式と p 群、軌道の数え上げ、対称群の巡回置換分解、置換の符号と交代群、交代群の単純性（雪江『代数学 1』第 4 章に対応）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="03-sylow/index.html"><span class="mn-card-title">シローの定理と組成列</span><span class="mn-card-en">Sylow Theorems and Composition Series</span><span class="mn-card-desc">シローの定理（存在・共役・個数の条件）とその応用（位数 pq の群、位数 60 未満の単純群、A₅ の特徴づけ）、組成列とジョルダン–ヘルダーの定理、可解群と冪零群、直積の部分群（グルサの補題、部分直積、ℤ/m×ℤ/n の部分群の個数、単純群の直積の正規部分群と対角部分群）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="04-finite-abelian/index.html"><span class="mn-card-title">有限アーベル群</span><span class="mn-card-en">Finite Abelian Groups</span><span class="mn-card-desc">有限アーベル群の構造定理（巡回群の直和への分解、初等因子と単因子の一意性）、与えられた位数のアーベル群の個数、最短の巡回分解と生成元の最小個数（単因子の個数・p ランク・部分群の生成元の個数）。</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="05-infinite-abelian/index.html"><span class="mn-card-title">無限アーベル群</span><span class="mn-card-en">Infinite Abelian Groups</span><span class="mn-card-desc">自由アーベル群とその部分群、射影性、捩れ部分群、有限生成アーベル群（群論の側からの証明）、可除群と入射性・構造定理・プリューファー群、捩れのない群の階数と型・ベールの分類・ポントリャーギンの判定法・ベール–シュペッカーの定理、純部分群と基本部分群・有界な群の構造・クリコフの判定法、拡大と Ext・ホワイトヘッドの問題（Robinson 第 4 章を参考）。</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="06-presentations/index.html"><span class="mn-card-title">自由群と群の表示</span><span class="mn-card-en">Free Groups and Presentations</span><span class="mn-card-desc">簡約語による自由群の構成と普遍性、階数の一意性、生成元と関係式による群の表示、二面体群・四元数群などの表示。</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="07-representations/index.html"><span class="mn-card-title">有限群の表現</span><span class="mn-card-en">Representations of Finite Groups</span><span class="mn-card-desc">表現と群環加群、指標と直交関係、指標表の計算、誘導表現とフロベニウスの相互律、次元の整除性とバーンサイドの定理（雪江『代数学 3』第 5 章を参考）。群環の環論的な部分（マシュケの定理・ウェダーバーン＝アルティン）は非可換環論の系列にある。</span><span class="mn-card-count">5 ページ</span></a>
</div>
