# 純部分群と有界な群 {#grp:page-pure-bounded keywords="pure subgroup, pure cyclic subgroup, basic subgroup (Kulikov), bounded abelian groups are direct sums of cyclic groups (Pruefer-Baer), pure bounded subgroups are direct summands, torsion subgroup need not be a direct summand, Kulikov's criterion, Pruefer's theorem on countable p-groups, subgroups of direct sums of cyclic groups"}

直和因子は「どの整数で割れるかを、部分群の中で判定しても群全体で判定しても同じ」という性質をもつ。この性質だけを取り出したのが**純部分群**で、直和因子の一般化である。このページでは、純部分群を道具にして、元の位数が有界なアーベル群は巡回群の直和であること（\ref{grp:bounded-structure}）、有界な純部分群は直和因子であること（\ref{grp:pure-bounded-summand}）を示す。応用として、捩れ部分群が直和因子にならない例（\ref{grp:torsion-not-summand}）を作る。最後に、アーベル $p$ 群が巡回群の直和になるための\ref{grp:kulikov-criterion}を証明し、巡回群の直和の部分群がまた巡回群の直和であること（\ref{grp:kulikov-subgroups}）を導く。

> 資料：D. J. S. Robinson, *A Course in the Theory of Groups* §4.3 を参考にした。証明の細部は補った。

## 記法と定義の確認 {#grp:sec-pb-notation}

::: notation
- アーベル群の記法は \ref{grp:sec-fab-notation}、捩れ部分群と準素分解は \ref{grp:torsion-subgroup}, \ref{grp:torsion-primary-decomposition}、可除群とその直和因子性は \ref{grp:divisible}, \ref{grp:divisible-summand}、構造定理は \tref{grp:divisible-structure}。
- アーベル $p$ 群 $G$ の元 $g$ の**高さ** $h(g)$ は $p$ 高さ（\ref{grp:height-type}）。$h(g)=\infty$ の元の全体は $\bigcap_{n}p^{n}G$。
- アーベル群が**有界**であるとは、ある $n\ge1$ で $nG=0$ となることをいう。
- 元の集合 $X$ が**一次独立**（\ref{grp:sec-tf-notation}）なら、$\ang{X}=\bigoplus_{x\in X}\ang{x}$。
- $\ZFC$ の中で議論する。\ref{set:zorn}を使う箇所は明記する。
:::

## 純部分群 {#grp:sec-pb-pure}

::: definition 純部分群 {#grp:pure-subgroup keywords="pure subgroup: nG cap H = nH for all n" index="純部分群|じゅんぶぶんぐん"}
アーベル群 $G$ の部分群 $H$ が**純**であるとは、すべての $n\ge1$ で $nG\cap H=nH$、すなわち「$H$ の元が $G$ の中で $n$ で割れるなら $H$ の中で $n$ で割れる」ことをいう。
:::

::: proposition 純部分群の基本性質 {#grp:pure-basic keywords="direct summands are pure; subgroups with torsion-free quotient are pure; transitivity of purity; purity in p-groups" index="純部分群の性質|じゅんぶぶんぐんのせいしつ"}
$H\le K\le G$ とする。
1. 直和因子は純である。
2. $G/H$ が捩れのない群なら $H$ は純である。とくに捩れ部分群 $T(G)$ は純である。
3. $H$ が $K$ で純、$K$ が $G$ で純なら、$H$ は $G$ で純。
4. $H$ が $G$ で純、$K/H$ が $G/H$ で純なら、$K$ は $G$ で純。
5. $G$ が $p$ 群なら、$H$ が純であることと、すべての $i\ge1$ で $p^{i}G\cap H=p^{i}H$ となることは同値。
:::

::: proof
**Step 1（1）.** $G=H\oplus E$ で $h=ng=n(h'+e)$ なら、成分を比べて $h=nh'$。

**Step 2（2）.** $h=ng$ なら $n(g+H)=0$ で、$G/H$ に捩れがないので $g\in H$。$G/T(G)$ は捩れがない（\ref{grp:torsion-subgroup}）。

**Step 3（3）.** $nG\cap H=nG\cap K\cap H=nK\cap H=nH$。

**Step 4（4）.** $k=ng\in nG\cap K$ とする。$k+H=n(g+H)$ なので、$K/H$ の純性から $k+H=n(k'+H)$（$k'\in K$）。$h\defeq k-nk'\in H$ で $h=n(g-k')\in nG\cap H=nH$、$h=nh'$。よって $k=n(h'+k')\in nK$。

**Step 5（5）.** $n=p^{i}n'$（$p\nmid n'$）とする。$p$ 群の元 $x$ の位数 $p^{e}$ と $n'$ は\term[互いに素]{grp:gcd}なので、$n'n''\equiv1\pmod{p^{e}}$ となる $n''$ について $x=n'(n''x)$：$n'$ 倍は $G$ でも $H$ でも全射。よって $nG=p^{i}G$, $nH=p^{i}H$。
:::

::: lemma 位数 p の元の高さと可除性 {#grp:p-group-divisible-criterion keywords="an abelian p-group in which every element of order p has infinite height is divisible" index="p 群の可除性の判定|ぴーぐんのかじょせいのはんてい"}
アーベル $p$ 群 $G$ で、位数 $p$ の元がすべて無限の高さをもてば、$G$ は可除である。
:::

::: proof
**Step 1.** $p$ 群では $G=pG$ なら可除（\ref{grp:pure-basic} の Step 5 から、$p$ と\term[互いに素]{grp:gcd}な $n'$ 倍は全射なので、$nG=p^{i}G=G$）。

**Step 2.** $G\neq pG$ とし、$g\notin pG$ となる元のうち位数 $p^{m}$ が最小のものをとる。位数 $p$ の元は無限の高さをもつので $pG$ に入り、$m\ge2$。$p^{m-1}g$ は位数 $p$ なので無限の高さをもち、$p^{m-1}g=p^{m}g_{1}$ と書ける。$g_{2}\defeq g-pg_{1}$ は $p^{m-1}g_{2}=0$ なので位数が $p^{m}$ より小さく、最小性から $g_{2}=pg_{3}$。$g=p(g_{1}+g_{3})\in pG$ となり矛盾。
:::

::: proposition 純な巡回部分群の存在 {#grp:pure-cyclic-exists keywords="a non-divisible abelian p-group has a nontrivial pure cyclic subgroup" index="純な巡回部分群|じゅんなじゅんかいぶぶんぐん"}
可除でないアーベル $p$ 群 $G$ は、$0$ でない純な巡回部分群をもつ。
:::

::: proof
**Step 1（元の選び方）.** \ref{grp:p-group-divisible-criterion} から、位数 $p$ の元 $g$ で高さ $m$ が有限のものがある：$g=p^{m}h$, $g\notin p^{m+1}G$。$h$ の位数は $p^{m+1}$。

**Step 2（$p^{a}h$ の高さ）.** $0\le a\le m$ について $h(p^{a}h)=a$：$\ge$ は明らか。$p^{a}h\in p^{a+1}G$ なら $g=p^{m-a}(p^{a}h)\in p^{m+1}G$ で矛盾。

**Step 3（純性）.** \ref{grp:pure-basic.5} から、$p^{i}G\cap\ang{h}\subseteq p^{i}\ang{h}$ を示せばよい。$x=ch\in p^{i}G$, $x\neq0$ とし、$c=p^{a}c'$（$p\nmid c'$, $a\le m$）と書く。$c'$ は $\Z/p^{m+1}$ で可逆なので $c'c''\equiv1$ として $p^{a}h=c''x\in p^{i}G$。Step 2 から $a\ge i$ で、$x=c'p^{a}h\in p^{i}\ang{h}$。
:::

## 基本部分群と有界な群 {#grp:sec-pb-basic}

::: definition 基本部分群 {#grp:basic-subgroup keywords="basic subgroup of an abelian p-group: pure, direct sum of cyclic groups, divisible quotient" index="基本部分群|きほんぶぶんぐん"}
アーベル $p$ 群 $G$ の部分群 $B$ が**基本部分群**であるとは、$B$ が純で、巡回群の直和で、$G/B$ が可除であることをいう。
:::

::: theorem 基本部分群の存在（クリコフ） {#grp:basic-subgroup-exists keywords="Kulikov: every abelian p-group has a basic subgroup" index="基本部分群の存在|きほんぶぶんぐんのそんざい"}
（AC）すべてのアーベル $p$ 群は基本部分群をもつ。
:::

::: proof
**Step 1.** $G$ が可除なら $B=0$。以下 $G$ は可除でないとする。部分集合 $X\subseteq G$ が**純独立**であるとは、一次独立で $\ang{X}$ が純であることとする。\ref{grp:pure-cyclic-exists} の $h$ について $\{h\}$ は純独立。

**Step 2（ツォルン）.** 純独立な集合の鎖 $(X_{i})$ の和 $X$ は純独立：一次独立性は有限個の元についての条件なので、ある $X_{i}$ の中で成り立つ。$\ang{X}=\bigcup_{i}\ang{X_{i}}$（鎖なので）で、$x\in nG\cap\ang{X}$ はある $\ang{X_{i}}$ に入り、$nG\cap\ang{X_{i}}=n\ang{X_{i}}\subseteq n\ang{X}$。\ref{set:zorn}から極大な純独立集合 $X$ があり、$B\defeq\ang{X}=\bigoplus_{x\in X}\ang{x}$ は純な巡回群の直和。

**Step 3（$G/B$ は可除）.** そうでないとすると、\ref{grp:pure-cyclic-exists} から $G/B$ に $0$ でない純な巡回部分群 $\ang{g+B}$ がある。その位数を $p^{d}$ とすると $p^{d}g\in p^{d}G\cap B=p^{d}B$ なので $p^{d}g=p^{d}b$（$b\in B$）。$g'\defeq g-b$ とすると $g'+B=g+B$, $p^{d}g'=0$ で、$g'$ の位数も $p^{d}$。

**Step 4（矛盾）.** $Y\defeq X\cup\{g'\}$ は一次独立：$\sum m_{x}x+mg'=0$ なら $mg'\in B$ で $m(g'+B)=0$、$p^{d}\mid m$、$mg'=0$。すると $\sum m_{x}x=0$ で $m_{x}x=0$。$\ang{Y}/B=\ang{g'+B}$ は $G/B$ で純、$B$ は $G$ で純なので、\ref{grp:pure-basic.4} から $\ang{Y}$ は純。$X$ の極大性に反する。
:::

::: theorem 有界な群の構造（プリューファー–ベール） {#grp:bounded-structure keywords="Pruefer-Baer: a bounded abelian group is a direct sum of cyclic groups" index="有界なアーベル群の構造|ゆうかいなあーべるぐんのこうぞう"}
（AC）有界なアーベル群は、位数が有界な巡回群の直和である。
:::

::: proof
**Step 1（$p$ 群）.** $G$ を有界な $p$ 群、$B$ を基本部分群（\ref{grp:basic-subgroup-exists}）とする。$G/B$ は可除で有界：$nG=0$ なら $x\in G/B$ は $x=ny=0$ と書けて $G/B=0$。よって $G=B$ は巡回群の直和。

**Step 2（一般）.** $nG=0$ なら $G$ は捩れ群で、$G=\bigoplus_{p}G_{p}$（\ref{grp:torsion-primary-decomposition}）、$G_{p}\neq0$ となる $p$ は $n$ の素因数だけ。各 $G_{p}$ は有界な $p$ 群なので Step 1 から従う。

::: hypcheck
- **有界性**：Step 1 で $G/B=0$ を導くのに使った。外すと偽：$\Z(p^{\infty})$ は可除で、$0$ でない純な巡回部分群をもたず（真部分群 $\ang{b_{n}}$ は $b_{n}=pb_{n+1}$ が $\ang{b_{n}}$ の中で $p$ で割れないので純でない）、巡回群の直和でない（\ref{grp:pruefer-properties}）。
- \ref{grp:finite-abelian-structure}はこの定理の特別な場合でもある。
:::
:::

::: theorem 有界な純部分群は直和因子 {#grp:pure-bounded-summand keywords="a pure bounded subgroup is a direct summand" index="有界な純部分群|ゆうかいなじゅんぶぶんぐん"}
（AC）アーベル群 $G$ の有界な純部分群 $H$ は直和因子である。
:::

::: proof
**Step 1（剰余の分解）.** $nH=0$ とし、$K\defeq H+nG$, $\overline{G}\defeq G/K$ とおく。$n\overline{G}=0$ なので、\ref{grp:bounded-structure} から $\overline{G}=\bigoplus_{\lambda}\ang{x_{\lambda}+K}$。$x_{\lambda}+K$ の位数を $n_{\lambda}$（$n$ の約数）とする。

**Step 2（代表の取り替え）.** $n_{\lambda}x_{\lambda}\in K$ なので $n_{\lambda}x_{\lambda}=h_{\lambda}+ng_{\lambda}$（$h_{\lambda}\in H$, $g_{\lambda}\in G$）。$h_{\lambda}=n_{\lambda}\bigl(x_{\lambda}-\frac{n}{n_{\lambda}}g_{\lambda}\bigr)\in n_{\lambda}G\cap H=n_{\lambda}H$（純性）なので $h_{\lambda}=n_{\lambda}h'_{\lambda}$。$y_{\lambda}\defeq x_{\lambda}-h'_{\lambda}$ とおくと、$y_{\lambda}+K=x_{\lambda}+K$, $n_{\lambda}y_{\lambda}=ng_{\lambda}$。

**Step 3（補部分群）.** $L\defeq\ang{nG,\ y_{\lambda}\ (\text{すべての }\lambda)}$ とする。$H\cap L=0$：$x=\sum m_{\lambda}y_{\lambda}+ng\in H$ なら、$K$ を法として $\sum m_{\lambda}(x_{\lambda}+K)=0$ で、直和なので $n_{\lambda}\mid m_{\lambda}$。$m_{\lambda}y_{\lambda}=\frac{m_{\lambda}}{n_{\lambda}}ng_{\lambda}\in nG$ なので $x\in nG\cap H=nH=0$。$G=H+L$：$g\in G$ について $g+K=\sum l_{\lambda}(y_{\lambda}+K)$ なので $g-\sum l_{\lambda}y_{\lambda}\in K=H+nG\subseteq H+L$。

::: hypcheck
- **純性**：Step 2 で $h_{\lambda}$ を $H$ の中で $n_{\lambda}$ で割るのに使った。外すと偽：$p\Z/p^{2}\Z\le\Z/p^{2}\Z$ は有界だが直和因子でない（純でない：$p\cdot1\in pG\cap H$ だが $pH=0$）。
- **有界性**：Step 1 で $\overline{G}$ を巡回群の直和に分けるのに使った。外すと偽：純部分群 $T(G)$ が直和因子でない例 \ref{grp:torsion-not-summand}。
:::
:::

::: corollary 捩れ部分群が直和因子になる条件 {#grp:torsion-summand-criterion keywords="if the torsion subgroup is a direct sum of a divisible group and a bounded group, it is a direct summand" index="捩れ部分群の直和因子性|ねじれぶぶんぐんのちょくわいんしせい"}
（AC）アーベル群 $G$ の捩れ部分群 $T$ が可除群と有界な群の直和なら、$T$ は $G$ の直和因子である。とくに有限な捩れ部分群は直和因子である。
:::

::: proof
$T=D\oplus E$（$D$ 可除、$E$ 有界）とする。\ref{grp:divisible-summand} から $G=D\oplus G'$。$D\subseteq T$ なので $T=D\oplus(T\cap G')$（$t=d+g'$ なら $g'=t-d\in T$）。$T\cap G'\cong T/D\cong E$ は有界。$T\cap G'$ は $G'$ の捩れ部分群なので $G'$ で純（\ref{grp:pure-basic.2}）。\ref{grp:pure-bounded-summand} から $G'=(T\cap G')\oplus C$ で、$G=D\oplus(T\cap G')\oplus C=T\oplus C$。
:::

::: theorem 捩れ部分群が直和因子でない例 {#grp:torsion-not-summand keywords="the torsion subgroup of the product of Z/p^n is not a direct summand" index="捩れ部分群が直和因子でない例|ねじれぶぶんぐんがちょくわいんしでないれい"}
$C\defeq\prod_{i\ge1}\ang{x_{i}}$（$x_{i}$ の位数は $p^{i}$）とすると、$C$ の捩れ部分群 $T$ は $C$ の直和因子でない。
:::

::: proof
**Step 1（$C$ に無限の高さの元はない）.** $z\in\bigcap_{n}p^{n}C$ なら、各成分 $z_{i}\in\bigcap_{n}p^{n}\ang{x_{i}}=0$。

**Step 2（$C/T$ の無限の高さの元）.** $y\defeq(p^{\lfloor i/2\rfloor}x_{i})_{i}$ とする。成分の位数 $p^{i-\lfloor i/2\rfloor}$ は有界でないので $y\notin T$。各 $n$ で、$i<2n$ の成分だけをもつ元 $t$ は捩れ元で、$y-t$ の成分は $i\ge2n$ で $p^{\lfloor i/2\rfloor}x_{i}\in p^{n}\ang{x_{i}}$ なので $y-t\in p^{n}C$。よって $y+T\in\bigcap_{n}p^{n}(C/T)$ は $0$ でない無限の高さの元。

**Step 3（矛盾）.** $C=T\oplus M$ とすると、射影は同型 $C/T\cong M$ を与え、同型は高さを保つので、$M$ に $0$ でない無限の高さの元 $m$ がある。$p^{n}M\subseteq p^{n}C$ なので $m$ は $C$ でも無限の高さをもち、Step 1 に反する。
:::

::: proposition 巡回群か準巡回群の直和因子 {#grp:cyclic-or-quasicyclic-summand keywords="an abelian group that is not torsion-free has a cyclic or quasicyclic direct summand; indecomposable abelian groups that are not torsion-free" index="直既約なアーベル群|ちょくきやくなあーべるぐん"}
（AC）捩れのない群でないアーベル群 $G$ は、$0$ でない巡回 $p$ 群かプリューファー群と同型な直和因子をもつ。とくに、捩れのない群でない直既約なアーベル群は、$\Z/p^{k}$ か $\Z(p^{\infty})$ と同型である。
:::

::: proof
**Step 1（$T$ が可除）.** $T\defeq T(G)\neq0$ が可除なら、$T$ は $G$ の直和因子（\ref{grp:divisible-summand}）で、構造定理（\tref{grp:divisible-structure}）から $T$ は $\Z(p^{\infty})$ と同型な直和因子をもつ。

**Step 2（$T$ が可除でない）.** ある $G_{p}$ が可除でない（各成分が可除なら直和 $T$ も可除）。\ref{grp:pure-cyclic-exists} から $G_{p}$ に $0$ でない純な巡回部分群 $Z$ がある。$Z$ は $G_{p}$ で純、$G_{p}$ は $T$ の直和因子なので純、$T$ は $G$ で純（\ref{grp:pure-basic.1}, \ref[2]{grp:pure-basic.2}）なので、推移性（3）から $Z$ は $G$ で純。有界なので直和因子（\ref{grp:pure-bounded-summand}）。
:::

## クリコフの判定法 {#grp:sec-pb-kulikov}

::: theorem クリコフの判定法 {#grp:kulikov-criterion keywords="Kulikov's criterion: an abelian p-group is a direct sum of cyclic groups iff it is the union of an ascending chain of subgroups whose nonzero elements have bounded heights" index="クリコフの判定法|くりこふのはんていほう" refname="クリコフの判定法"}
（AC）アーベル $p$ 群 $G$ が巡回群の直和であることと、部分群の増大列 $G_{1}\subseteq G_{2}\subseteq\cdots$ で $\bigcup_{n}G_{n}=G$、かつ各 $n$ について $G_{n}$ の $0$ でない元の（$G$ での）高さがある $k(n)$ 以下であるものが存在することは同値である。
:::

::: intuition
巡回群の直和では、「位数 $p^{n}$ 以下の直和因子の和」に入る元は高さ $n-1$ 以下である。逆向きの証明では、各段で「高さ $n-1$ ちょうどの位数 $p$ の元」を集めた基底 $S_{n}$ をとり、それを $p^{n-1}$ で割った元 $g(s)$ を巡回群の生成元として使う。高さが有界であることは、「$p^{n}G$ と $n$ 段目が交わらない」という形で、作った巡回群の和が直和であり全体を覆うことの証明に使われる。
:::

::: proof
**Step 1（⇒）.** $G=\bigoplus_{\lambda}\ang{z_{\lambda}}$ とし、$G_{n}$ を位数 $p^{n}$ 以下の直和因子の和とする。$0\neq x\in G_{n}$ が $x=p^{n}y$ なら、成分ごとに $x_{\lambda}=p^{n}y_{\lambda}$ で、$x$ の成分は位数 $p^{n}$ 以下の因子にしかないので、そこでは $p^{n}y_{\lambda}=0$、すなわち $x=0$ で矛盾。よって高さは $n-1$ 以下。

**Step 2（番号の付け替え）.** 逆を示す。$G_{j}\subseteq G_{n}$（$j\le n$）なので $k(n)$ は単調非減少としてよい。$G'_{m}\defeq\bigcup\{G_{n}:k(n)<m\}$ とおくと（$G_{n}$ は増大列なので $G'_{m}$ は部分群）、$G'_{m}$ は増大列で、各 $G_{n}$ は $G'_{k(n)+1}$ に含まれるので和は $G$、$G'_{m}$ の $0$ でない元の高さは $m-1$ 以下。以下 $G_{n}$ をこの $G'_{n}$ に取り替え、$p^{n}G\cap G_{n}=0$（$n\ge1$）とする。

**Step 3（極大な列）.** 部分群の増大列 $(H_{n})_{n\ge1}$ で $G_{n}\subseteq H_{n}$, $p^{n}G\cap H_{n}=0$ となるものの全体 $\mathcal{S}$ に、成分ごとの包含で順序を入れる。$\mathcal{S}$ の鎖の成分ごとの和は $\mathcal{S}$ に入る（$p^{n}G\cap\bigcup H_{n}^{(i)}=\bigcup(p^{n}G\cap H_{n}^{(i)})=0$）ので、ツォルンの補題から極大元 $(H_{n})$ がある。$\bigcup H_{n}\supseteq\bigcup G_{n}=G$。

**Step 4（基底 $S_{n}$）.** $V_{n}\defeq p^{n-1}G\cap H_{n}[p]$ は $\mathbb{F}_{p}$ ベクトル空間で、基底 $S_{n}$ をとる（AC）。$V_{1},V_{2},\dots$ の和は直和：$v_{1}+\cdots+v_{N}=0$（$v_{n}\in V_{n}$）で $v_{n}\neq0$ となる最小の $n$ をとると、$v_{n}=-\sum_{m>n}v_{m}\in p^{n}G$（$v_{m}\in p^{m-1}G\subseteq p^{n}G$）かつ $v_{n}\in H_{n}$ なので $v_{n}=0$ で矛盾。よって $S\defeq\bigcup_{n}S_{n}$ は（$\mathbb{F}_{p}$ 上、したがって群として）一次独立。$s\in S_{n}$ は $p^{n-1}G$ に入り $p^{n}G$ に入らない（$H_{n}\cap p^{n}G=0$）ので高さちょうど $n-1$：$s=p^{n-1}g(s)$ となる $g(s)\in G$ を選ぶ（AC）。$g(s)$ の位数は $p^{n}$。

**Step 5（$\{g(s)\}$ は一次独立）.** $\sum m_{s}g(s)=0$ で $m_{s}g(s)\neq0$ となる項があるとし、その位数の最大値を $p^{d}$（$d\ge1$）とする。$p^{d-1}$ を掛けると、位数 $p^{d}$ 未満の項は消え、位数 $p^{d}$ の項は、$g(s)$ の位数を $p^{n_{s}}$ として $m_{s}=p^{n_{s}-d}m'_{s}$（$p\nmid m'_{s}$）と書けるので、$p^{d-1}m_{s}g(s)=m'_{s}p^{n_{s}-1}g(s)=m'_{s}s$。よって $\sum m'_{s}s=0$（$p\nmid m'_{s}$ の項が少なくとも一つ）で、$S$ の一次独立性に反する。したがって $T\defeq\ang{g(s):s\in S}=\bigoplus_{s}\ang{g(s)}$ は巡回群の直和。

**Step 6（$G[p]\subseteq T$）.** $H_{r}[p]\subseteq T$ をすべての $r$ で示す。$r=1$：$H_{1}[p]=V_{1}=\ang{S_{1}}$ で、$s\in S_{1}$ は $s=g(s)\in T$。$H_{r}[p]\not\subseteq T$ となる最小の $r\ge2$ があるとし、$g\in H_{r}[p]\setminus T$ をとる。$g\notin H_{r-1}$（最小性）。$H'_{r-1}\defeq H_{r-1}+\ang{g}\subseteq H_{r}$ に取り替えた列は $\mathcal{S}$ の元で極大元より真に大きくなるので、極大性から $p^{r-1}G\cap H'_{r-1}\neq0$：$0\neq h+jg\in p^{r-1}G$（$h\in H_{r-1}$）。$p\mid j$ なら $jg=0$ で $h\in p^{r-1}G\cap H_{r-1}=0$ となり矛盾なので、$p\nmid j$ で、$j$ の逆数倍をとって $g=g_{1}+h_{1}$（$g_{1}\in p^{r-1}G$, $h_{1}\in H_{r-1}$）。$g_{1}=g-h_{1}\in H_{r}$ で、$pg_{1}\in p^{r}G\cap H_{r}=0$ なので $g_{1}\in V_{r}=\ang{S_{r}}$；$s\in S_{r}$ は $s=p^{r-1}g(s)\in T$ なので $g_{1}\in T$。$ph_{1}=p(g-g_{1})=0$ なので $h_{1}\in H_{r-1}[p]\subseteq T$。よって $g\in T$ で矛盾。

**Step 7（$G=T$）.** $G\setminus T$ の元で位数が最小の $g$ をとると、Step 6 から位数は $p^{n+1}$（$n\ge1$）。$p^{n}g\in G[p]\subseteq T$, $T[p]=\ang{S}$（Step 5 の直和から）なので $p^{n}g=\sum_{i}m_{i}s_{i}$（$s_{i}\in S$）。$s_{i}\in S_{m}$（$m\ge n+1$）の項は $s_{i}=p^{m-1}g(s_{i})=p^{n}a_{i}$（$a_{i}\defeq p^{m-1-n}g(s_{i})\in T$）、$s_{i}\in S_{m}$（$m\le n$）の項は $H_{m}\subseteq H_{n}$ に入る。よって
$$
p^{n}\Bigl(g-\sum_{m\ge n+1}m_{i}a_{i}\Bigr)=\sum_{m\le n}m_{i}s_{i}\in p^{n}G\cap H_{n}=0.
$$
$g'\defeq g-\sum m_{i}a_{i}$ は位数 $p^{n}$ 以下なので最小性から $g'\in T$、$g\in T$ で矛盾。
:::

::: corollary 可算な p 群（プリューファー） {#grp:pruefer-countable keywords="Pruefer: a countable abelian p-group is a direct sum of cyclic groups iff it has no nonzero elements of infinite height" index="プリューファーの定理（可算 p 群）|ぷりゅーふぁーのていりかさんぴーぐん"}
可算なアーベル $p$ 群 $G$ が巡回群の直和であることと、$0$ でない無限の高さの元をもたないことは同値である。
:::

::: proof
巡回群の直和の元は有限個の成分をもち、各成分の高さは有限なので、$0$ でない元の高さは有限。逆に、$G=\{g_{1},g_{2},\dots\}$ として $G_{n}\defeq\ang{g_{1},\dots,g_{n}}$ とおく。$G_{n}$ の $0$ でない元の高さはどれも有限で、$G_{n}$ は有限なので、その最大値 $k(n)$ がある。$G_{n}$ は有限生成な捩れ群なので有限（\ref{grp:fg-abelian-structure.2}）。クリコフの判定法から従う。
:::

::: corollary 巡回群の直和の部分群（クリコフ） {#grp:kulikov-subgroups keywords="Kulikov: subgroups of direct sums of cyclic groups are direct sums of cyclic groups" index="巡回群の直和の部分群|じゅんかいぐんのちょくわのぶぶんぐん"}
（AC）巡回群の直和の部分群は、巡回群の直和である。
:::

::: proof
**Step 1（$p$ 群）.** $G$ が巡回 $p$ 群の直和で $H\le G$ とする。クリコフの判定法の Step 1 の列 $(G_{n})$ について $H_{n}\defeq H\cap G_{n}$ は和が $H$ の増大列で、$H$ の元の $H$ での高さは $G$ での高さ以下なので、$H_{n}$ の $0$ でない元の高さは $n-1$ 以下。判定法から $H$ は巡回群の直和。

**Step 2（一般）.** $G=\bigoplus_{\lambda}C_{\lambda}$（巡回群）とし、$T\defeq T(G)$ は有限巡回群の因子の和、$G/T$ は無限巡回群の因子の和と同型で自由。$H/(H\cap T)\cong(H+T)/T\le G/T$ は自由（\ref{grp:subgroup-of-free-abelian}）なので、\ref{grp:free-quotient-splits} から $H=(H\cap T)\oplus K$（$K$ 自由）。$T=\bigoplus_{p}T_{p}$ で $H\cap T=\bigoplus_{p}(H\cap T_{p})$（準素分解）、$T_{p}$ は巡回 $p$ 群の直和なので、Step 1 から $H\cap T_{p}$ は巡回群の直和。
:::

::: supplement
**基本部分群の一意性.** アーベル $p$ 群の基本部分群は一意ではないが、互いに同型であることが知られている（クリコフ、フックス。Robinson §4.3）。基本部分群は群の「巡回群の直和で近似できる部分」を測る不変量である。

**ウルムの定理.** 可算な被約アーベル $p$ 群は、ウルム–カプランスキー不変量（$p^{\alpha}G[p]/p^{\alpha+1}G[p]$ の次元、$\alpha$ は順序数）で分類されることが知られている（ウルムの定理）。\ref{grp:pruefer-countable} は、無限の高さの元がない場合（$\alpha<\omega$ だけで済む場合）にあたる。
:::

## 問題 {#grp:sec-pb-problems}

::: problem {#grp:prob-pb-pure-divisible}
可除群の純部分群は直和因子であることを示せ。
:::

::: solution
$H$ を可除群 $G$ の純部分群とする。$h\in H$, $n\ge1$ について $h\in nG\cap H=nH$ なので $H$ は可除。可除な部分群は直和因子（\ref{grp:divisible-summand}）。
:::

::: problem {#grp:prob-pb-reduced-countable}
$x_{1},x_{2},\dots$ で生成され、関係 $px_{1}=0$, $p^{n}x_{n+1}=x_{1}$（$n\ge1$）だけをもつアーベル群を $G$ とする（すなわち、自由アーベル群をこれらの関係で生成される部分群で割ったもの）。$x_{1}\neq0$ を認めて、$x_{1}$ が無限の高さをもつことを示し、$G$ が巡回群の直和でないことを結論せよ。
:::

::: solution
$x_{1}=p^{n}x_{n+1}\in p^{n}G$（すべての $n$）なので $x_{1}$ は無限の高さをもつ。$G$ は可算な $p$ 群（各 $x_{n+1}$ の位数は $p^{n+1}$ を割る：$p^{n+1}x_{n+1}=px_{1}=0$）で、$0$ でない無限の高さの元 $x_{1}$ をもつので、\ref{grp:pruefer-countable} から巡回群の直和でない。
:::
