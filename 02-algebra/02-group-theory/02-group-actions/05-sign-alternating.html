# 置換の符号と交代群 {#grp:page-sign-alternating keywords="sign of a permutation, parity, even permutation, odd permutation, inversion, alternating group, 3-cycles generate A_n, A_4 has no subgroup of order 6"}

置換を互換の積に書く方法は一通りではないが、使う互換の個数の偶奇は置換だけで決まる。これを、差積の比として定義した**符号** $\sgn:S_{n}\to\{\pm 1\}$ が準同型であること（\ref{grp:sign-homomorphism}）として証明する。符号が $+1$ の置換（偶置換）全体が**交代群** $A_{n}$ で、指数 $2$ の正規部分群になる（\ref{grp:alternating-group}）。$A_{n}$ は長さ $3$ の巡回置換で生成され（\ref{grp:an-generated-3cycles}）、$n\ge 5$ ではそれらが $A_{n}$ の中で互いに共役である（\ref{grp:3cycles-conjugate-an}）。これは次のページで $A_{n}$ の単純性を示す鍵になる。最後に、ラグランジュの定理の逆の反例として、$A_{4}$ が位数 $6$ の部分群をもたないことを示す（\ref{grp:a4-no-order-6}）。

> 雪江明彦『代数学 1 群論入門』は符号が準同型であることを線形代数の既知の事実として引用している（§2.5）。ここでは差積を使って証明した。

## 記法と定義の確認 {#grp:sec-sa-notation}

::: notation
- 対称群・巡回置換・互換・巡回置換分解・型・共役の公式・生成元は \ref{grp:symmetric-group}, \ref{grp:cycle}, \ref{grp:cycle-decomposition}, \ref{grp:cycle-type}, \ref{grp:conjugation-formula}, \ref{grp:conjugacy-cycle-type}, \ref{grp:sn-generators}、型ごとの個数は \ref{grp:cycle-type-count}。
- 準同型・核・第一同型定理は \ref{grp:homomorphism}, \ref{grp:homomorphism-basic}, \ref{grp:first-isomorphism}。指数・ラグランジュの定理は \ref{grp:index}, \tref{grp:lagrange}、指数 $2$ の部分群が正規であることは \ref{grp:prob-index-two}。
- $\{\pm 1\}$ は乗法で位数 $2$ の群。$n\ge 1$ とし、$P_{n}\defeq\{\{i,j\} : 1\le i<j\le n\}$（二元部分集合の全体）とおく。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 符号 {#grp:sec-sa-sign}

::: definition 符号・偶置換・奇置換 {#grp:sign keywords="sign of a permutation, signature, even permutation, odd permutation, difference product" index="符号|ふごう, 偶置換|ぐうちかん, 奇置換|きちかん, 差積|させき"}
$\sigma\in S_{n}$ について
$$
\sgn(\sigma)\defeq\prod_{1\le i<j\le n}\frac{\sigma(j)-\sigma(i)}{j-i}
$$
を $\sigma$ の**符号**という（$n=1$ なら空積で $1$）。$\sgn(\sigma)=1$ の置換を**偶置換**、$-1$ の置換を**奇置換**という（下の \ref{grp:sign-value} で値が $\pm 1$ であることを示す）。
:::

::: lemma 符号の値と転倒数 {#grp:sign-value keywords="sign equals (-1)^{number of inversions}" index="転倒数|てんとうすう"}
$\mathrm{inv}(\sigma)\defeq\abs{\{(i,j) : i<j,\ \sigma(i)>\sigma(j)\}}$（**転倒数**）とすると $\sgn(\sigma)=(-1)^{\mathrm{inv}(\sigma)}$。特に $\sgn(\sigma)\in\{\pm 1\}$。
:::

::: proof
**Step 1（各因子は二元集合だけで決まる）.** $a\neq b$ について $f_{\sigma}(a,b)\defeq\frac{\sigma(b)-\sigma(a)}{b-a}$ は $f_{\sigma}(a,b)=f_{\sigma}(b,a)$（分子・分母がともに符号を変える）をみたすので、二元集合 $\{a,b\}$ の関数とみなせる。$\sgn(\sigma)=\prod_{\{a,b\}\in P_{n}}f_{\sigma}(a,b)$。

**Step 2（絶対値）.** $\{a,b\}\mapsto\{\sigma(a),\sigma(b)\}$ は $P_{n}$ の全単射（$\sigma$ が全単射だから）。よって $\prod_{\{a,b\}}\abs{\sigma(b)-\sigma(a)}$ は $\prod_{\{c,d\}}\abs{d-c}$ の因子を並べ替えたもので等しく、$\abs{\sgn(\sigma)}=1$。

**Step 3（符号）.** $i<j$ の因子 $\frac{\sigma(j)-\sigma(i)}{j-i}$ が負 $\iff\sigma(i)>\sigma(j)$。負の因子はちょうど $\mathrm{inv}(\sigma)$ 個なので、$\sgn(\sigma)$ の符号は $(-1)^{\mathrm{inv}(\sigma)}$。Step 2 と合わせて主張を得る。
:::

::: theorem 符号は準同型 {#grp:sign-homomorphism keywords="sign is a homomorphism, sgn(στ) = sgn(σ) sgn(τ)" index="符号の乗法性|ふごうのじょうほうせい"}
$\sgn:S_{n}\to\{\pm 1\}$ は準同型である：$\sgn(\sigma\tau)=\sgn(\sigma)\sgn(\tau)$。
:::

::: proof
**Step 1（分解）.** \ref{grp:sign-value} の Step 1 の記号で、$\{a,b\}\in P_{n}$ について（$\tau(a)\neq\tau(b)$ なので割れる）
$$
f_{\sigma\tau}(a,b)=\frac{\sigma(\tau(b))-\sigma(\tau(a))}{\tau(b)-\tau(a)}\cdot\frac{\tau(b)-\tau(a)}{b-a}=f_{\sigma}(\tau(a),\tau(b))\cdot f_{\tau}(a,b).
$$

**Step 2（積をとる）.** $\{a,b\}$ について積をとると $\sgn(\sigma\tau)=\prod_{\{a,b\}}f_{\sigma}(\tau(a),\tau(b))\cdot\sgn(\tau)$。$\{a,b\}\mapsto\{\tau(a),\tau(b)\}$ は $P_{n}$ の全単射で、$f_{\sigma}$ は二元集合の関数なので、最初の積は $\prod_{\{c,d\}}f_{\sigma}(c,d)=\sgn(\sigma)$ の因子の並べ替え。

::: hypcheck
- Step 2 で $f_{\sigma}$ が二元集合だけの関数である（順序によらない）ことを本質的に使った。差積の各因子を「$i<j$ の順序付き組」のまま扱うと、$\tau$ で順序が入れ替わる組の処理が必要になる。
:::
:::

::: corollary 符号の計算 {#grp:sign-computation keywords="sign of a transposition is -1, sign of a k-cycle, sign from cycle type, parity of transposition decompositions" index="互換の符号|ごかんのふごう"}
1. 互換の符号は $-1$、長さ $k$ の巡回置換の符号は $(-1)^{k-1}$。
2. $\sigma$ の型が $(l_{1},\dots,l_{t})$（固定点を含む）なら $\sgn(\sigma)=(-1)^{n-t}$。
3. $\sigma$ が $m$ 個の互換の積なら $\sgn(\sigma)=(-1)^{m}$。特に、$\sigma$ を互換の積に書くときの互換の個数の偶奇は、書き方によらない。
:::

::: proof
**Step 1（$(1\ 2)$）.** $(1\ 2)$ で $i<j$, $\sigma(i)>\sigma(j)$ となるのは $(i,j)=(1,2)$ だけなので、転倒数は $1$、符号は $-1$（\ref{grp:sign-value}）。

**Step 2（互換）.** 互換 $(a\ b)$ は $(1\ 2)$ と型が同じなので共役（\ref{grp:conjugacy-cycle-type}）：$(a\ b)=\rho(1\ 2)\rho^{-1}$。\ref{grp:sign-homomorphism} と $\{\pm 1\}$ の可換性から $\sgn(a\ b)=\sgn(\rho)\sgn(1\ 2)\sgn(\rho)^{-1}=-1$。

**Step 3（巡回置換）.** 長さ $k$ の巡回置換は $k-1$ 個の互換の積（\ref{grp:sn-generators} の証明の Step 1）なので、符号は $(-1)^{k-1}$。

**Step 4（2）.** 巡回置換分解（\ref{grp:cycle-decomposition}）の各因子の符号の積で、$\prod_{i}(-1)^{l_{i}-1}=(-1)^{\sum l_{i}-t}=(-1)^{n-t}$（長さ $1$ の軌道は $(-1)^{0}=1$ を寄与する）。

**Step 5（3）.** 準同型性と Step 2 から $\sgn(\sigma)=(-1)^{m}$。二通りに $m$ 個、$m'$ 個の互換の積に書けたら $(-1)^{m}=(-1)^{m'}$ なので偶奇が一致する。
:::

## 交代群 {#grp:sec-sa-alternating}

::: definition 交代群 {#grp:alternating-group keywords="alternating group A_n, even permutations" index="交代群|こうたいぐん"}
$A_{n}\defeq\Ker(\sgn)=\{\sigma\in S_{n} : \sgn(\sigma)=1\}$ を $n$ 次**交代群**という。
:::

::: proposition 交代群の基本性質 {#grp:alternating-basic keywords="A_n is normal of index 2, |A_n| = n!/2" index="交代群の位数|こうたいぐんのいすう"}
$n\ge 2$ なら $A_{n}\trianglelefteq S_{n}$, $(S_{n}:A_{n})=2$, $\abs{A_{n}}=n!/2$, $S_{n}/A_{n}\cong\{\pm 1\}$。$A_{n}$ の元は、型 $(l_{1},\dots,l_{t})$ の中の偶数の長さの個数が偶数であるような置換である。
:::

::: proof
核なので正規（\ref{grp:homomorphism-basic}）。$n\ge 2$ なら $\sgn(1\ 2)=-1$ なので $\sgn$ は全射で、\ref{grp:first-isomorphism} より $S_{n}/A_{n}\cong\{\pm 1\}$、指数 $2$、位数 $n!/2$（\ref{grp:lagrange}）。最後の主張は \ref{grp:sign-computation.1} と 2 による（長さ $l$ の巡回置換は $l$ が偶数のときに限り奇置換）。
:::

::: example
1. $A_{3}=\{e,(1\ 2\ 3),(1\ 3\ 2)\}$ は位数 $3$ の巡回群。
2. $A_{4}$（位数 $12$）の元は型 $(1,1,1,1)$：$1$ 個、$(2,2)$：$3$ 個、$(3,1)$：$8$ 個（\ref{grp:cycle-type-count} の例）。クラインの四元群 $V$ は $A_{4}$ の正規部分群（$S_{4}$ で正規なので）で、$A_{4}$ は単純でない。
3. $A_{5}$（位数 $60$）の元は型 $(1^{5})$：$1$、$(2,2,1)$：$5!/(2^{2}\cdot 2!)=15$、$(3,1,1)$：$5!/(3\cdot 2!)=20$、$(5)$：$5!/5=24$ 個。
:::

::: theorem 交代群は 3 巡回置換で生成される {#grp:an-generated-3cycles keywords="A_n is generated by 3-cycles" index="3 巡回置換による生成|さんじゅんかいちかんによるせいせい"}
$n\ge 3$ なら $A_{n}$ は長さ $3$ の巡回置換全体で生成される。
:::

::: proof
**Step 1（3 巡回置換は偶置換）.** \ref{grp:sign-computation.1} より符号 $(-1)^{2}=1$。よって生成される部分群は $A_{n}$ に含まれる。

**Step 2（互換二つの積）.** 相異なる $a,b,c,d$ について
$$
(a\ b)(a\ c)=(a\ c\ b),\qquad (a\ b)(c\ d)=(a\ b\ c)(b\ c\ d),
$$
また $(a\ b)(a\ b)=e$。一つめは右を先に施して $a\mapsto c$, $c\mapsto a\mapsto b$, $b\mapsto a$ から。二つめは、右辺を右から施すと $b\mapsto c\mapsto a$、$c\mapsto d\mapsto d$、$d\mapsto b\mapsto c$、$a\mapsto a\mapsto b$ となり、左辺の $a\leftrightarrow b$, $c\leftrightarrow d$ と一致する。互換二つの積は、共通の元が二つ・一つ・なしのどれかなので、上のいずれかの形になる。

**Step 3（$A_{n}$ の元）.** $\sigma\in A_{n}$ を互換の積に書くと（\ref{grp:sn-generators}）、個数は偶数（\ref{grp:sign-computation.3}）。二つずつ組にして Step 2 を使えば、$\sigma$ は 3 巡回置換の積。
:::

::: theorem 3 巡回置換は A_n で共役 {#grp:3cycles-conjugate-an keywords="all 3-cycles are conjugate in A_n for n >= 5" index="交代群での共役|こうたいぐんでのきょうやく"}
$n\ge 5$ なら、長さ $3$ の巡回置換はすべて $A_{n}$ の中で互いに共役である。
:::

::: proof
$\gamma,\gamma'$ を 3 巡回置換とする。型が同じなので $\gamma'=\tau\gamma\tau^{-1}$ となる $\tau\in S_{n}$ がある（\ref{grp:conjugacy-cycle-type}）。$\tau\in A_{n}$ ならよい。$\tau$ が奇置換なら、$n\ge 5$ なので $\gamma$ の台 $\{a,b,c\}$ の外に二元 $d,e$ がとれる。$\tau'\defeq\tau(d\ e)$ は偶置換で、$(d\ e)$ は $\gamma$ と\term[互いに素]{grp:cycle}なので可換（\ref{grp:disjoint-commute}）。$\tau'\gamma\tau'^{-1}=\tau(d\ e)\gamma(d\ e)\tau^{-1}=\tau\gamma\tau^{-1}=\gamma'$。

::: hypcheck
- **$n\ge 5$**：台の外に二元をとるのに使った。$n=4$ では偽：$A_{4}$ の 3 巡回置換 $8$ 個は、$A_{4}$ の中では $4$ 個ずつ二つの共役類に分かれる（$(1\ 2\ 3)$ の $A_{4}$ での中心化群は $\ang{(1\ 2\ 3)}$（位数 $3$）なので、共役類の大きさは $12/3=4$）。
:::
:::

::: theorem A₄ は位数 6 の部分群をもたない {#grp:a4-no-order-6 keywords="A_4 has no subgroup of order 6, converse of Lagrange's theorem fails" index="ラグランジュの定理の逆|らぐらんじゅのていりのぎゃく"}
$A_{4}$（位数 $12$）には位数 $6$ の部分群がない。したがって、ラグランジュの定理の逆（位数の約数ごとに部分群がある）は成り立たない。
:::

::: proof
**Step 1.** $H\le A_{4}$, $\abs{H}=6$ と仮定する。$(A_{4}:H)=2$ なので $H\trianglelefteq A_{4}$ で、$A_{4}/H$ は位数 $2$ の群。

**Step 2（平方は $H$ に入る）.** 位数 $2$ の群の元 $u$ は $u^{2}=e$ をみたすので、任意の $g\in A_{4}$ で $(gH)^{2}=g^{2}H=H$、すなわち $g^{2}\in H$。

**Step 3（3 巡回置換はすべて $H$ に入る）.** 3 巡回置換 $g$ について $g^{3}=e$ なので $g=g^{4}=(g^{2})^{2}$、Step 2 を $g^{2}$ に使って $g\in H$。$A_{4}$ には 3 巡回置換が $8$ 個ある（上の例）ので $\abs{H}\ge 8$ となり、$\abs{H}=6$ に矛盾。
:::

::: supplement
**$S_{n}$ の指数 $2$ の部分群.** 同じ論法で、$n\ge 2$ について $S_{n}$ の指数 $2$ の部分群は $A_{n}$ だけであることがわかる（下の問題）。

**行列式との関係.** 置換 $\sigma$ に置換行列 $P_{\sigma}$（$(\sigma(i),i)$ 成分が $1$）を対応させると $\det P_{\sigma}=\sgn(\sigma)$ で、行列式の交代性はこの符号から来ている。

**次へ.** $n\ge 5$ では $A_{n}$ が単純群であること（自明でない正規部分群をもたないこと）を、\ref{grp:an-generated-3cycles} と \ref{grp:3cycles-conjugate-an} を使って示す（\ref{grp:page-simplicity-an}）。
:::

## 問題 {#grp:sec-sa-problems}

::: problem {#grp:prob-index-two-sn}
$n\ge 2$ とする。$S_{n}$ の指数 $2$ の部分群は $A_{n}$ だけであることを示せ。
:::

::: solution
$H\le S_{n}$, $(S_{n}:H)=2$ とする。\ref{grp:a4-no-order-6} の Step 1, 2 と同様に、すべての $g$ で $g^{2}\in H$。3 巡回置換 $g$ は $g=(g^{2})^{2}$ なので $H$ に属する（$n=2$ なら 3 巡回置換はなく $A_{2}=\{e\}$ で、$\abs{H}=1$ から $H=A_{2}$）。$n\ge 3$ なら \ref{grp:an-generated-3cycles} より $A_{n}\subseteq H$、位数がともに $n!/2$ なので $H=A_{n}$。
:::

::: problem {#grp:prob-order-2m-normal}
$m\ge 1$ を奇数とする。位数 $2m$ の群 $G$ は位数 $m$ の正規部分群をもつことを示せ。
:::

::: solution
\ref{grp:cayley}の $\lambda:G\to\Sym(G)$, $\lambda(g)(x)=gx$ と、$G$ の番号付けによる同一視 $\Sym(G)\cong S_{2m}$ を考える。位数 $2$ の元 $t$ がある（\ref{grp:cauchy}）。$tx\neq x$ なので $\lambda(t)$ は固定点をもたず、$\lambda(t)^{2}=\lambda(t^{2})=\id$ なので、軌道はすべて $\{x,tx\}$ の形で $m$ 個、型は $(2,\dots,2)$（$m$ 個）。\ref{grp:sign-computation.2} より $\sgn(\lambda(t))=(-1)^{2m-m}=-1$。よって $\sgn\circ\lambda:G\to\{\pm 1\}$ は全射準同型で、核は位数 $m$ の正規部分群（\ref{grp:first-isomorphism}）。（$\sgn$ が $\Sym(G)$ の番号付けによらないことは、番号付けを変えると共役になり、符号が共役で不変なことによる。）
:::

::: problem {#grp:prob-a5-classes}
$A_{5}$ の 5 巡回置換 $24$ 個は、$A_{5}$ の中で $12$ 個ずつ二つの共役類に分かれることを示せ。
:::

::: solution
$\gamma=(1\ 2\ 3\ 4\ 5)$ の $S_{5}$ での中心化群の位数は \ref{grp:cycle-type-count} より $5^{1}\cdot 1!=5$ で、$\ang{\gamma}$（位数 $5$）を含むので $Z_{S_{5}}(\gamma)=\ang{\gamma}\subseteq A_{5}$。よって $Z_{A_{5}}(\gamma)=\ang{\gamma}$ で、$A_{5}$ での共役類の大きさは $60/5=12$（\ref{grp:class-equation}）。$S_{5}$ では $24$ 個すべてが共役なので、$A_{5}$ では大きさ $12$ の類が二つ（$\gamma$ の類と $(1\ 2)\gamma(1\ 2)^{-1}$ の類）に分かれる。
:::
