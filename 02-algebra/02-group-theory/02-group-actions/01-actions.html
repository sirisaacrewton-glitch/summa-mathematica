# 群の作用 {#grp:page-group-actions keywords="group action, left action, right action, permutation representation, orbit, stabilizer, orbit-stabilizer theorem, transitive action, faithful action, Cayley's theorem, normalizer, centralizer"}

群は、もともと何かの「対称性」——集合の元を入れ替える操作の集まり——として現れる。この見方を定式化したのが**群の作用**（\ref{grp:group-action}）で、群 $G$ の各元に集合 $X$ の置換を対応させる準同型 $G\to\Sym(X)$ と同じものである（\ref{grp:action-homomorphism}）。作用は $X$ を**軌道**に分割し、各軌道の大きさは**安定化群**の指数に等しい（\ref{grp:orbit-stabilizer}）。このページではこれらの基本事項と、どんな群も対称群の部分群とみなせるという**ケイリーの定理**（\tref{grp:cayley}）、剰余類への作用から正規部分群を作る方法（\ref{grp:core-index}）を述べる。共役による作用は、次のページで類等式に使う。

> 雪江明彦『代数学 1 群論入門』第 4 章 §4.1 を参考にした。雪江は安定化群を $G_{x}$ と書き、本ページもそれに従う。

## 記法と定義の確認 {#grp:sec-ac-notation}

::: notation
- 群・部分群・生成された部分群は \ref{grp:group}, \ref{grp:subgroup}, \ref{grp:generated-subgroup}、対称群 $\Sym(X)$, $S_{n}$ と $\abs{S_{n}}=n!$ は \ref{grp:symmetric-group} とその直後の例。元の位数は \ref{grp:element-order}。
- 剰余類・剰余類による分割・指数・ラグランジュの定理は \ref{grp:coset}, \ref{grp:coset-partition}, \ref{grp:index}, \tref{grp:lagrange}。正規部分群・中心は \ref{grp:normal-subgroup}, \ref{grp:normal-equivalent}, \ref{grp:center}。準同型・核・第一同型定理・内部自己同型は \ref{grp:homomorphism}, \ref{grp:homomorphism-basic}, \ref{grp:first-isomorphism}, \ref{grp:inner-automorphisms}。
- 置換の積は写像の合成 $(\sigma\tau)(x)=\sigma(\tau(x))$（右の置換を先に施す）。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 作用と置換表現 {#grp:sec-ac-actions}

::: definition 群の作用 {#grp:group-action keywords="group action, left action, right action, G-set" index="群の作用|ぐんのさよう, 作用|さよう, 左作用|ひだりさよう, 右作用|みぎさよう"}
$G$ を群、$X$ を集合とする。写像 $G\times X\to X$, $(g,x)\mapsto g\cdot x$ が
1. すべての $x\in X$ について $e\cdot x=x$、
2. すべての $g,h\in G$, $x\in X$ について $g\cdot(h\cdot x)=(gh)\cdot x$

をみたすとき、これを $G$ の $X$ への（左）**作用**といい、$G$ は $X$ に**作用する**という。$g\cdot x$ を単に $gx$ と書くこともある。写像 $X\times G\to X$, $(x,g)\mapsto x\cdot g$ で $x\cdot e=x$, $(x\cdot g)\cdot h=x\cdot(gh)$ をみたすものを**右作用**という。
:::

::: intuition
作用は「群の元を集合の元を動かす操作として読む」ことである。条件 2 は「$h$ で動かしてから $g$ で動かすのは、$gh$ で一度に動かすのと同じ」という意味で、写像の合成の順序（右から施す）に合わせてある。
:::

::: example 作用の例 {#grp:action-examples}
1. **自然な作用**：$\Sym(X)$ は $X$ に $\sigma\cdot x\defeq\sigma(x)$ で作用する。特に $S_{n}$ は $\{1,\dots,n\}$ に、$\GL_{n}(\R)$ は $\R^{n}$ に行列の積で作用する。
2. **左からの積**：$G$ は $G$ 自身に $g\cdot x\defeq gx$ で作用する（結合法則が条件 2）。
3. **共役**：$G$ は $G$ 自身に $g\cdot x\defeq gxg^{-1}$ で作用する。$g\cdot(h\cdot x)=g(hxh^{-1})g^{-1}=(gh)x(gh)^{-1}$。
4. **剰余類への作用**：$H\le G$ のとき、$G$ は左剰余類の集合 $G/H$ に $g\cdot(xH)\defeq(gx)H$ で作用する。$xH=x'H$ なら $x^{-1}x'\in H$ で、$(gx)^{-1}(gx')=x^{-1}x'\in H$ なので $gxH=gx'H$：矛盾なく定まる。条件 1, 2 は $G$ の結合法則から。
5. **部分集合・部分群への共役**：$G$ は $G$ の部分集合全体に $g\cdot A\defeq gAg^{-1}$ で作用する。$A$ が部分群なら $gAg^{-1}$ も部分群なので、部分群全体の集合にも作用する。
6. **自明な作用**：$g\cdot x\defeq x$。
7. **右作用から左作用へ**：右作用 $x\cdot g$ があれば $g\ast x\defeq x\cdot g^{-1}$ は左作用：$g\ast(h\ast x)=(x\cdot h^{-1})\cdot g^{-1}=x\cdot(h^{-1}g^{-1})=x\cdot(gh)^{-1}=(gh)\ast x$。逆も同様なので、以下では左作用だけを扱う。
:::

::: proposition 作用と置換表現 {#grp:action-homomorphism keywords="permutation representation, actions correspond to homomorphisms into symmetric groups" index="置換表現|ちかんひょうげん"}
$G$ を群、$X$ を集合とする。
1. $G$ の $X$ への作用が与えられたとき、各 $g$ について $\rho(g)(x)\defeq g\cdot x$ は $X$ の置換で、$\rho:G\to\Sym(X)$ は準同型である。
2. 逆に準同型 $\rho:G\to\Sym(X)$ が与えられたとき、$g\cdot x\defeq\rho(g)(x)$ は作用である。
3. この二つの対応は互いに逆である。

$\rho$ を作用の**置換表現**という。
:::

::: proof
**Step 1（1）.** 条件 2 から $\rho(g)\circ\rho(g^{-1})(x)=g\cdot(g^{-1}\cdot x)=(gg^{-1})\cdot x=e\cdot x=x$（条件 1）。同様に $\rho(g^{-1})\circ\rho(g)=\id$。よって $\rho(g)$ は全単射で $\rho(g)^{-1}=\rho(g^{-1})$。条件 2 は $\rho(g)\circ\rho(h)=\rho(gh)$ そのもの。

**Step 2（2）.** $\rho(e)=\id_{X}$（\ref{grp:homomorphism-basic.1}）なので $e\cdot x=x$。$g\cdot(h\cdot x)=\rho(g)(\rho(h)(x))=(\rho(g)\circ\rho(h))(x)=\rho(gh)(x)=(gh)\cdot x$。

**Step 3（3）.** どちらの向きも $g\cdot x=\rho(g)(x)$ という同じ式なので、互いに逆。
:::

::: definition 作用の核・忠実・推移的 {#grp:faithful-transitive keywords="kernel of an action, faithful action, effective action, transitive action, homogeneous space" index="忠実な作用|ちゅうじつなさよう, 推移的|すいいてき, 等質空間|とうしつくうかん"}
$G$ が $X$ に作用し、$\rho$ をその置換表現とする。
1. $\Ker\rho=\{g : \text{すべての } x \text{ で } g\cdot x=x\}$ を作用の**核**という。核が $\{e\}$（$\rho$ が単射）のとき、作用は**忠実**であるという。
2. 任意の $x,y\in X$ に対し $g\cdot x=y$ となる $g$ があるとき（$X\neq\emptyset$ とする）、作用は**推移的**であるといい、$X$ を $G$ の**等質空間**という。
:::

::: theorem ケイリーの定理 {#grp:cayley keywords="Cayley's theorem, every group embeds in a symmetric group, regular representation" index="ケイリーの定理|けいりーのていり, 正則表現|せいそくひょうげん" refname="ケイリーの定理"}
任意の群 $G$ は対称群 $\Sym(G)$ のある部分群と同型である。特に、位数 $n$ の有限群は $S_{n}$ のある部分群と同型である。
:::

::: proof
**Step 1.** 左からの積による作用（\ref{grp:action-examples.2}）の置換表現 $\lambda:G\to\Sym(G)$, $\lambda(g)(x)=gx$ は準同型（\ref{grp:action-homomorphism}）。

**Step 2（忠実）.** $\lambda(g)=\id$ なら $g=ge=\lambda(g)(e)=e$。よって $\Ker\lambda=\{e\}$ で $\lambda$ は単射（\ref{grp:homomorphism-basic.3}）。\ref{grp:first-isomorphism} より $G\cong\im\lambda\le\Sym(G)$。

**Step 3（有限の場合）.** $\abs{G}=n$ なら全単射 $\beta:G\to\{1,\dots,n\}$ を一つ選び、$\sigma\mapsto\beta\sigma\beta^{-1}$ とすると $\Sym(G)\cong S_{n}$（$\beta\sigma\tau\beta^{-1}=(\beta\sigma\beta^{-1})(\beta\tau\beta^{-1})$、逆写像は $\pi\mapsto\beta^{-1}\pi\beta$）。$G$ は $S_{n}$ の部分群 $\beta\,\im\lambda\,\beta^{-1}$ と同型。

::: hypcheck
- **公理**：Step 3 の $\beta$ は有限集合の番号付けで、選択公理は要らない。
- ケイリーの定理は「群とは置換の群である」ことを保証するが、$S_{n}$ は $n!$ 元と大きく、埋め込みとしては効率が悪い（例えば $D_{n}$ は $2n$ 元だが $S_{n}$ に入る）。
:::
:::

::: supplement
**歴史的な見方.** 群の公理（\ref{grp:group}）は、置換の集まりがもつ性質を抜き出したものである。ケイリーの定理は、抜き出した公理から出発しても、置換の群以上のものは出てこないことを示している。

**高い視点.** 作用 $G\times X\to X$ は、群 $G$ を一対象の圏とみたときの、集合の圏 $\Set$ への関手と同じものである（対象に $X$ を、射 $g$ に置換 $\rho(g)$ を対応させる）。ケイリーの定理は、この見方での米田の埋め込み（\ref{cat:page-yoneda}）の特別な場合にあたる。
:::

## 軌道と安定化群 {#grp:sec-ac-orbits}

::: definition 軌道と安定化群 {#grp:orbit-stabilizer-def keywords="orbit, stabilizer, isotropy group, fixed point" index="軌道|きどう, 安定化群|あんていかぐん, 固定部分群|こていぶぶんぐん, 固定点|こていてん"}
$G$ が $X$ に作用し、$x\in X$ とする。
1. $G\cdot x\defeq\{g\cdot x : g\in G\}$ を $x$ の**軌道**という。
2. $G_{x}\defeq\{g\in G : g\cdot x=x\}$ を $x$ の**安定化群**（固定部分群）という。$G_{x}=G$ のとき $x$ を**固定点**という。
:::

::: proposition 軌道による分割 {#grp:orbits-partition keywords="orbits partition the set, stabilizers are subgroups, conjugate stabilizers" index="軌道による分割|きどうによるぶんかつ"}
$G$ が $X$ に作用するとする。
1. $G_{x}$ は $G$ の部分群である。
2. $y=g\cdot x$ なら $G\cdot y=G\cdot x$ かつ $G_{y}=gG_{x}g^{-1}$。
3. 二つの軌道は等しいか交わらないかのどちらかで、$X$ は軌道の和集合である。
:::

::: proof
**Step 1（1）.** $e\cdot x=x$ なので $e\in G_{x}$。$g,h\in G_{x}$ なら $(gh)\cdot x=g\cdot(h\cdot x)=g\cdot x=x$。$g\in G_{x}$ なら $g^{-1}\cdot x=g^{-1}\cdot(g\cdot x)=(g^{-1}g)\cdot x=x$。

**Step 2（2：軌道）.** $h\cdot y=h\cdot(g\cdot x)=(hg)\cdot x\in G\cdot x$ なので $G\cdot y\subseteq G\cdot x$。$x=g^{-1}\cdot y$ なので同様に $G\cdot x\subseteq G\cdot y$。

**Step 3（2：安定化群）.** $h\in G$ について
$$
h\cdot y=y\iff hg\cdot x=g\cdot x\iff g^{-1}hg\cdot x=x\iff g^{-1}hg\in G_{x}\iff h\in gG_{x}g^{-1}.
$$
（二つめの $\iff$ は両辺に $g^{-1}$ を作用させる／$g$ を作用させる。）

**Step 4（3）.** $x\in G\cdot x$ なので $X$ は軌道の和集合。$z\in(G\cdot x)\cap(G\cdot y)$ なら $z=g\cdot x=g'\cdot y$ で、2 より $G\cdot x=G\cdot z=G\cdot y$。
:::

::: theorem 軌道と安定化群の関係 {#grp:orbit-stabilizer keywords="orbit-stabilizer theorem, |G·x| = (G : G_x)" index="軌道安定化群定理|きどうあんていかぐんていり, 軌道と安定化群|きどうとあんていかぐん"}
$G$ が $X$ に作用し、$x\in X$ とする。$gG_{x}\mapsto g\cdot x$ は、$G/G_{x}$ から $G\cdot x$ への矛盾なく定まる全単射である。特に
$$
\abs{G\cdot x}=(G:G_{x}),
$$
$G$ が有限なら $\abs{G}=\abs{G\cdot x}\cdot\abs{G_{x}}$ で、軌道の大きさは $\abs{G}$ の約数である。
:::

::: intuition
$x$ を $y$ に動かす元は「一つ見つければ、あとはそれに $x$ を動かさない元を右から掛けたもの」で尽くされる。だから $x$ を $y$ に動かす元はちょうど一つの左剰余類 $gG_{x}$ をなし、軌道の点と左剰余類が一対一に対応する。
:::

::: proof
**Step 1.** $g,g'\in G$ について
$$
g\cdot x=g'\cdot x\iff g^{-1}g'\cdot x=x\iff g^{-1}g'\in G_{x}\iff gG_{x}=g'G_{x}
$$
（最後は \ref{grp:coset-partition.2}）。右から左の向きから写像 $\Phi(gG_{x})\defeq g\cdot x$ は矛盾なく定まり、左から右の向きから単射。

**Step 2.** $G\cdot x$ の元はすべて $g\cdot x=\Phi(gG_{x})$ の形なので全射。よって $\abs{G\cdot x}=\abs{G/G_{x}}=(G:G_{x})$（\ref{grp:index}）。有限なら \ref{grp:lagrange} から残りが従う。

::: hypcheck
- 前提は作用であることだけ。$G_{x}$ が正規部分群である必要はない（\ref{grp:orbits-partition.2} のとおり、軌道上の点の安定化群は互いに共役で、一般には異なる）。
:::
:::

::: example
1. $S_{n}$ の $\{1,\dots,n\}$ への自然な作用は推移的で、$n$ の安定化群は $n$ を動かさない置換全体で、$S_{n-1}$ と同型（$\{1,\dots,n-1\}$ の置換と同一視）。\ref{grp:orbit-stabilizer} より $n=\abs{S_{n}}/\abs{S_{n-1}}$、これを繰り返して $\abs{S_{n}}=n!$ の別証明になる。
2. $D_{n}$（$n\ge 3$）の $\Z/n\Z$（正 $n$ 角形の頂点）への作用は推移的（$r^{k}\cdot 0=k$）で、頂点 $0$ の安定化群は $\{e,s\}$（$s(0)=0$、$r^{k}(0)=k$、$r^{k}s(0)=k$）。よって $\abs{D_{n}}=n\cdot 2$。
3. 群 $G$ の $G/H$ への作用は推移的で、$eH$ の安定化群は $\{g : gH=H\}=H$。\ref{grp:orbit-stabilizer} はこのときラグランジュの定理になる。
:::

## 正規化群・中心化群と剰余類への作用 {#grp:sec-ac-normalizer}

::: definition 正規化群・中心化群 {#grp:normalizer-centralizer keywords="normalizer, centralizer, conjugate subgroups" index="正規化群|せいきかぐん, 中心化群|ちゅうしんかぐん, 共役な部分群|きょうやくなぶぶんぐん"}
$G$ を群、$H\le G$, $x\in G$ とする。
1. $N_{G}(H)\defeq\{g\in G : gHg^{-1}=H\}$ を $H$ の**正規化群**という。
2. $Z_{G}(x)\defeq\{g\in G : gx=xg\}$ を $x$ の**中心化群**という。
3. $gHg^{-1}$（$g\in G$）の形の部分群を $H$ に**共役な部分群**という。
:::

::: proposition 正規化群と中心化群は安定化群 {#grp:normalizer-stabilizer keywords="number of conjugates equals index of normalizer" index="共役な部分群の個数|きょうやくなぶぶんぐんのこすう"}
$G$ を群、$H\le G$, $x\in G$ とする。
1. $N_{G}(H)$ は部分群の集合への共役による作用での $H$ の安定化群で、$H\trianglelefteq N_{G}(H)\le G$。$H\trianglelefteq G\iff N_{G}(H)=G$。
2. $Z_{G}(x)$ は $G$ 自身への共役による作用での $x$ の安定化群で、$Z(G)\subseteq Z_{G}(x)$。
3. $H$ に共役な部分群の個数は $(G:N_{G}(H))$、$x$ に共役な元の個数は $(G:Z_{G}(x))$ である。
:::

::: proof
**Step 1（1）.** 定義から $N_{G}(H)$ は \ref{grp:action-examples.5} の作用での $H$ の安定化群なので部分群（\ref{grp:orbits-partition}）。$h\in H$ なら $hHh^{-1}=H$（$H$ は部分群）なので $H\subseteq N_{G}(H)$。$N_{G}(H)$ の元による共役で $H$ は $H$ に移るので、$H\trianglelefteq N_{G}(H)$。$N_{G}(H)=G\iff$ すべての $g$ で $gHg^{-1}=H\iff H\trianglelefteq G$（\ref{grp:normal-equivalent}）。

**Step 2（2）.** $gxg^{-1}=x\iff gx=xg$ なので、共役による作用での $x$ の安定化群は $Z_{G}(x)$。中心の元はすべての元と可換なので $Z(G)\subseteq Z_{G}(x)$。

**Step 3（3）.** $H$ に共役な部分群全体は、共役による作用での $H$ の軌道で、\ref{grp:orbit-stabilizer} よりその大きさは $(G:N_{G}(H))$。元についても同様。
:::

::: theorem 剰余類への作用の核 {#grp:core-index keywords="kernel of the action on cosets, normal core, subgroup of finite index contains a normal subgroup of finite index, index of smallest prime is normal" index="正規核|せいきかく"}
$G$ を群、$H\le G$ で $(G:H)=n<\infty$ とする。
1. $G$ の $G/H$ への作用の核は $\mathrm{core}_{G}(H)\defeq\bigcap_{g\in G}gHg^{-1}$ で、これは $H$ に含まれる $G$ の正規部分群のうち最大のものである。
2. $G/\mathrm{core}_{G}(H)$ は $S_{n}$ のある部分群と同型で、特に $(G:\mathrm{core}_{G}(H))$ は $n!$ を割り切る。
3. $G$ が有限で、$n$ が $\abs{G}$ を割り切る素数のうち最小のものなら、$H\trianglelefteq G$。
:::

::: proof
**Step 1（1）.** 作用 $g\cdot xH=gxH$ について、$\rho(g)=\id\iff$ すべての $x$ で $gxH=xH\iff$ すべての $x$ で $x^{-1}gx\in H\iff$ すべての $x$ で $g\in xHx^{-1}$。よって核は $K\defeq\bigcap_{x}xHx^{-1}$。核なので正規（\ref{grp:homomorphism-basic}）で、$x=e$ の項から $K\subseteq H$。$N\trianglelefteq G$, $N\subseteq H$ なら、各 $x$ で $N=xNx^{-1}\subseteq xHx^{-1}$ なので $N\subseteq K$。

**Step 2（2）.** 置換表現 $\rho:G\to\Sym(G/H)$ の核は $K$ なので、\ref{grp:first-isomorphism} より $G/K\cong\im\rho\le\Sym(G/H)\cong S_{n}$（\ref{grp:cayley} の Step 3 と同じ番号付け）。ラグランジュの定理より $\abs{G/K}$ は $n!$ を割り切る。

**Step 3（3）.** $p\defeq n$ とし、$K$ を 1 の核とする。2 より $m\defeq(G:K)$ は $p!$ を割り切る。また $m=(G:H)(H:K)=p\,(H:K)$（\ref{grp:index-tower}）は $\abs{G}$ を割り切る（ラグランジュの定理）。$q$ が $(H:K)$ の素因数なら、$q$ は $\abs{G}$ の素因数なので $q\ge p$。一方 $q\mid m\mid p!=p\cdot(p-1)!$ で、$p\,(H:K)\mid p\cdot(p-1)!$ から $(H:K)\mid(p-1)!$、よって $q\mid(p-1)!$。素数 $q$ が $(p-1)!$ を割り切るなら $q\le p-1$（$q$ は $1,\dots,p-1$ のどれかを割り切る。ユークリッドの補題 \ref{grp:bezout-euclid.4} を素数に使う）で矛盾。よって $(H:K)$ は素因数をもたず $1$、$H=K\trianglelefteq G$。

::: hypcheck
- **$n$ が最小の素因数**（3）：Step 3 で $q\ge p$ に使った。外すと偽：$D_{3}$（位数 $6$）の $\{e,s\}$ は指数 $3$ だが正規でない（$3$ は $6$ の最小の素因数ではない）。
- 3 で $p=2$ とすると「指数 $2$ の部分群は正規」（\ref{grp:prob-index-two}）が再び得られる。
- 素数 $q$ が積 $ab$ を割り切るなら $q\mid a$ または $q\mid b$：$q\nmid a$ なら $\gcd(q,a)=1$（$q$ の正の約数は $1,q$）なのでユークリッドの補題から $q\mid b$。これを繰り返し使った。
:::
:::

::: supplement
**応用の例.** 2 から、無限群 $G$ が指数有限の部分群をもてば、指数有限の正規部分群ももつ。3 からは、例えば位数 $15$ の群の指数 $3$ の部分群（あれば）は正規である。\ref{grp:page-sylow}と組み合わせると、有限群の構造を調べる強い道具になる。
:::

## 問題 {#grp:sec-ac-problems}

::: problem {#grp:prob-action-cyclic-orbits}
$\sigma\in\Sym(X)$ とし、$\ang{\sigma}$ を $X$ に自然に作用させる。$x\in X$ の軌道が有限集合 $\{x,\sigma(x),\dots,\sigma^{k-1}(x)\}$（$k$ 個の相異なる元）なら、$\sigma^{k}(x)=x$ で、$k$ は $\sigma^{m}(x)=x$ となる最小の正の整数であることを示せ。
:::

::: solution
$I\defeq\{m\in\Z : \sigma^{m}(x)=x\}$ とおく。$0\in I$ で、$m,m'\in I$ なら $\sigma^{m-m'}(x)=\sigma^{m}(\sigma^{-m'}(x))=\sigma^{m}(x)=x$（$\sigma^{m'}(x)=x$ の両辺に $\sigma^{-m'}$ を施した）なので $I$ は $\Z$ の部分群で、$I=d\Z$（$d\in\N$）と書ける（\ref{grp:subgroups-of-z}）。$\sigma^{a}(x)=\sigma^{b}(x)\iff b-a\in I$ なので、軌道 $\{\sigma^{m}(x) : m\in\Z\}$ が有限なら $I\neq\{0\}$、$d\ge 1$ で、軌道は相異なる $d$ 個の元 $x,\sigma(x),\dots,\sigma^{d-1}(x)$ からなる（$m$ を $d$ で割った余りで決まる。\ref{grp:division}）。仮定より $d=k$。よって $\sigma^{k}(x)=x$ で、$k$ は $I$ の最小の正の元。
:::

::: problem {#grp:prob-conjugates-not-cover}
$G$ を有限群、$H\lneq G$ とする。$\bigcup_{g\in G}gHg^{-1}\neq G$ を示せ（真部分群の共役全体では群を覆えない）。
:::

::: solution
$m\defeq(G:N_{G}(H))$ は $H$ に共役な部分群の個数で、$H\subseteq N_{G}(H)$ から $m\le(G:H)$（\ref{grp:index-tower}）。各共役は $\abs{H}$ 元で、どれも単位元を含むので、和集合の元の個数は高々 $m(\abs{H}-1)+1\le(G:H)(\abs{H}-1)+1=\abs{G}-(G:H)+1$。$H\neq G$ なら $(G:H)\ge 2$ なので、これは $\abs{G}-1$ 以下で、$\abs{G}$ より小さい。
:::

::: problem {#grp:prob-power-in-finite-index}
$H\le G$, $(G:H)=n<\infty$ なら、すべての $g\in G$ について $g^{n!}\in H$ であることを示せ（$G$ は無限群でもよい）。
:::

::: solution
$K\defeq\mathrm{core}_{G}(H)$ とすると、\ref{grp:core-index.2} より $\abs{G/K}$ は $n!$ を割り切る。$gK$ の $G/K$ での位数は $\abs{G/K}$ を割り切る（\ref{grp:lagrange-corollaries}）ので $n!$ を割り切り、$(gK)^{n!}=g^{n!}K=K$。よって $g^{n!}\in K\subseteq H$。
:::
