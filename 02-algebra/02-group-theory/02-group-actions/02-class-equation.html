# 類等式と p 群 {#grp:page-class-equation keywords="conjugacy class, class equation, p-group, center of a p-group, groups of order p^2, Cauchy's theorem, fixed point congruence"}

群 $G$ が自分自身に共役で作用すると、軌道は**共役類**になり、軌道への分割を数えた式が**類等式**（\ref{grp:class-equation}）である。素数 $p$ について位数が $p$ の冪である群（**$p$ 群**）では、類等式の各項が $p$ の倍数になることから、中心が自明でないこと（\ref{grp:p-group-center}）が従い、位数 $p^{2}$ の群が可換であること（\ref{grp:order-p-squared}）もわかる。その背後には「$p$ 群が作用すると、固定点の個数は全体の個数と $p$ を法として合同」という単純な事実（\ref{grp:fixed-point-congruence}）がある。これを別の作用に使うと、$\abs{G}$ を割り切る素数 $p$ に対し位数 $p$ の元が存在するという**コーシーの定理**（\tref{grp:cauchy}）が得られる。最後に、$p$ 群が各位数の正規部分群をもつことを示す（\ref{grp:p-group-normal-subgroups}）。

> 類等式・$p$ 群の中心・位数 $p^{2}$ の群は雪江明彦『代数学 1 群論入門』第 4 章 §4.1, §4.4 を参考にした。コーシーの定理の証明は、資料によらず、巡回置換で回す作用を使う方法（McKay による証明として知られる）で書いた。

## 記法と定義の確認 {#grp:sec-ce-notation}

::: notation
- 作用・軌道・安定化群・軌道による分割・軌道と安定化群の関係は \ref{grp:group-action}, \ref{grp:orbit-stabilizer-def}, \ref{grp:orbits-partition}, \ref{grp:orbit-stabilizer}。中心化群 $Z_{G}(x)$ と、共役な元の個数が $(G:Z_{G}(x))$ であることは \ref{grp:normalizer-centralizer}, \ref{grp:normalizer-stabilizer}。
- 中心 $Z(G)$、$G/Z(G)$ が巡回群なら可換（\ref{grp:center}, \ref{grp:center-quotient-cyclic}）。ラグランジュの定理とその系は \tref{grp:lagrange}, \ref{grp:lagrange-corollaries}。巡回群の分類・内部直積・対応定理は \ref{grp:cyclic-classification}, \ref{grp:internal-direct-product}, \tref{grp:correspondence}。
- 以下 $p$ は素数。$p$ と\term[互いに素]{grp:gcd}でない整数は $p$ の倍数である（$p$ の正の約数は $1,p$）。整数 $a\ge 1$ が $p^{n}$ を割り切るなら $a=p^{k}$（$0\le k\le n$）：$a$ の素因数 $q$ は $p^{n}$ を割り切り、ユークリッドの補題（\ref{grp:bezout-euclid.4}）から $q\mid p$、$q=p$ となるので。
- 作用 $G\times X\to X$ について、固定点全体を $X^{G}\defeq\{x\in X : \text{すべての } g \text{ で } g\cdot x=x\}$ と書く。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## p 群と固定点 {#grp:sec-ce-fixed}

::: definition p 群 {#grp:p-group keywords="p-group, finite p-group" index="p 群|ぴーぐん"}
$p$ を素数とする。位数が $p^{n}$（$n\ge 0$）の形の有限群を **$p$ 群**という。
:::

::: example
$\Z/p^{n}\Z$、$\Z/p\Z\times\Z/p\Z$、$D_{4}$（位数 $8$）、$Q_{8}$ は $2$ 群である。$D_{3}$（位数 $6$）は $p$ 群でない。
:::

::: lemma p 群の固定点の合同式 {#grp:fixed-point-congruence keywords="fixed point congruence, |X| ≡ |X^G| mod p for p-group actions" index="固定点の合同式|こていてんのごうどうしき"}
$p$ 群 $G$ が有限集合 $X$ に作用するとき
$$
\abs{X}\equiv\abs{X^{G}}\pmod{p}.
$$
:::

::: proof
**Step 1（軌道に分ける）.** \ref{grp:orbits-partition} より $X$ は互いに交わらない軌道の和集合で、$X$ が有限なので軌道は有限個 $O_{1},\dots,O_{m}$。よって $\abs{X}=\sum_{i}\abs{O_{i}}$。

**Step 2（軌道の大きさ）.** \ref{grp:orbit-stabilizer} より $\abs{O_{i}}$ は $\abs{G}=p^{n}$ の約数なので $p^{k_{i}}$ の形（記法の確認）。$\abs{O_{i}}=1\iff O_{i}=\{x\}$ で $x$ が固定点。

**Step 3.** よって $\abs{X}=\abs{X^{G}}+\sum_{\abs{O_{i}}>1}\abs{O_{i}}$ で、後の和の各項は $p$ の倍数。

::: hypcheck
- **$G$ が $p$ 群**：Step 2 で、大きさ $1$ でない軌道が $p$ の倍数になることに使った。外すと偽：$S_{3}$ の $\{1,2,3\}$ への作用では $\abs{X}=3$、固定点は $0$ 個で、$3\not\equiv 0\pmod 2$。
- **$X$ が有限**：Step 1 の和に使った。
:::
:::

## 共役類と類等式 {#grp:sec-ce-class-equation}

::: definition 共役類 {#grp:conjugacy-class keywords="conjugacy class, conjugate elements" index="共役類|きょうやくるい, 共役|きょうやく"}
群 $G$ の共役による作用（\ref{grp:action-examples.3}）の軌道 $\mathcal{C}(x)\defeq\{gxg^{-1} : g\in G\}$ を $x$ の**共役類**という。$y\in\mathcal{C}(x)$ のとき $x$ と $y$ は**共役**であるという。
:::

::: theorem 類等式 {#grp:class-equation keywords="class equation, class formula" index="類等式|るいとうしき"}
$G$ を有限群とする。
1. $\abs{\mathcal{C}(x)}=(G:Z_{G}(x))$ で、これは $\abs{G}$ の約数。$\mathcal{C}(x)=\{x\}\iff x\in Z(G)$。
2. 中心に含まれない共役類を $\mathcal{C}(x_{1}),\dots,\mathcal{C}(x_{m})$（相異なる）とすると
$$
\abs{G}=\abs{Z(G)}+\sum_{i=1}^{m}(G:Z_{G}(x_{i})),
$$
ここで各 $(G:Z_{G}(x_{i}))$ は $1$ より大きい $\abs{G}$ の約数である。
:::

::: proof
**Step 1（1）.** 共役による作用で $x$ の安定化群は $Z_{G}(x)$（\ref{grp:normalizer-stabilizer.2}）なので、\ref{grp:orbit-stabilizer} から $\abs{\mathcal{C}(x)}=(G:Z_{G}(x))$、ラグランジュの定理からこれは $\abs{G}$ の約数。$\mathcal{C}(x)=\{x\}\iff$ すべての $g$ で $gxg^{-1}=x\iff x\in Z(G)$。

**Step 2（2）.** 共役類は $G$ を分割する（\ref{grp:orbits-partition}）。大きさ $1$ の共役類は 1 より $\{z\}$（$z\in Z(G)$）の形で、その個数は $\abs{Z(G)}$。残りの共役類が $\mathcal{C}(x_{1}),\dots,\mathcal{C}(x_{m})$ で、大きさの和をとって主張を得る。各 $(G:Z_{G}(x_{i}))=\abs{\mathcal{C}(x_{i})}>1$。
:::

::: example
1. $D_{3}$：共役類は $\{e\}$, $\{r,r^{2}\}$, $\{s,rs,r^{2}s\}$ で、類等式は $6=1+2+3$。
   - $srs^{-1}=r^{-1}=r^{2}$ なので $r$ と $r^{2}$ は共役で、$r^{k}$ との共役では $r$ は動かない。
   - $rsr^{-1}=r\cdot rs=r^{2}s$（$sr^{-1}=rs$）、$r^{2}sr^{-2}=r^{4}s=rs$ なので $s$ の共役類は $\{s,rs,r^{2}s\}$。
2. $D_{4}$：$Z(D_{4})=\{e,r^{2}\}$（\ref{grp:center} の例）、共役類は $\{e\}$, $\{r^{2}\}$, $\{r,r^{3}\}$, $\{s,r^{2}s\}$, $\{rs,r^{3}s\}$ で、類等式は $8=2+2+2+2$（$\abs{Z}=2$ と大きさ $2$ の類が三つ）。
   - $srs^{-1}=r^{-1}=r^{3}$。$rsr^{-1}=r^{2}s$、$r(rs)r^{-1}=r^{2}sr^{-1}=r^{3}s$。
   - 大きさの上限：$\mathcal{C}(x)$ の大きさは $(D_{4}:Z_{D_{4}}(x))$ で、$Z_{D_{4}}(x)$ は $\ang{x}$ と $Z(D_{4})=\{e,r^{2}\}$ を含む。$x=r$ なら $\ang{r}$ は位数 $4$、$x=s$ なら $\{e,s,r^{2},r^{2}s\}$（位数 $4$）、$x=rs$ なら $\{e,rs,r^{2},r^{3}s\}$（位数 $4$）を含むので、どれも $\abs{Z_{D_{4}}(x)}\ge 4$、類の大きさは $2$ 以下。上の計算で二つずつ見つかっているので、類はちょうど上の五つ。
:::

## p 群の中心と位数 p² の群 {#grp:sec-ce-p-groups}

::: theorem p 群の中心は自明でない {#grp:p-group-center keywords="center of a p-group is nontrivial" index="p 群の中心|ぴーぐんのちゅうしん"}
$G$ が $p$ 群で $G\neq\{e\}$ なら、$Z(G)\neq\{e\}$。より詳しく、$\abs{Z(G)}$ は $p$ の倍数である。
:::

::: proof
共役による作用の固定点全体は $Z(G)$（\ref{grp:class-equation.1}）。\ref{grp:fixed-point-congruence} より $\abs{Z(G)}\equiv\abs{G}=p^{n}\equiv 0\pmod p$（$n\ge 1$）。$e\in Z(G)$ なので $\abs{Z(G)}\ge 1$ で、$p$ の倍数なので $\ge p\ge 2$。

::: hypcheck
- **$p$ 群**：\ref{grp:fixed-point-congruence} を使うのに必要。外すと偽：$Z(D_{3})=\{e\}$。
- **$G\neq\{e\}$**：$n\ge 1$ として $\abs{G}\equiv 0$ に使った。
:::
:::

::: theorem 位数 p² の群 {#grp:order-p-squared keywords="groups of order p^2 are abelian, classification of groups of order p^2" index="位数 p² の群|いすうぴーにじょうのぐん"}
$\abs{G}=p^{2}$ なら $G$ は可換群で、$\Z/p^{2}\Z$ か $\Z/p\Z\times\Z/p\Z$ のどちらかと同型である（この二つは同型でない）。
:::

::: proof
**Step 1（可換）.** \ref{grp:p-group-center} より $\abs{Z(G)}\in\{p,p^{2}\}$。$\abs{Z(G)}=p$ なら $\abs{G/Z(G)}=p$ は素数なので $G/Z(G)$ は巡回群（\ref{grp:lagrange-corollaries}）で、\ref{grp:center-quotient-cyclic} より $G$ は可換、すると $Z(G)=G$ で $\abs{Z(G)}=p^{2}$ となり矛盾。よって $Z(G)=G$、$G$ は可換。

**Step 2（分類）.** 位数 $p^{2}$ の元があれば $G$ は巡回群で $\Z/p^{2}\Z$ と同型（\ref{grp:cyclic-classification}）。ないとき、単位元以外の元の位数は $p$（$p^{2}$ の約数で $1,p^{2}$ でない）。$a\neq e$ をとり $H\defeq\ang{a}$（位数 $p$）、$b\notin H$ をとり $K\defeq\ang{b}$（位数 $p$）。$H\cap K$ は $K$ の部分群で $b\notin H\cap K$ なので位数 $1$（ラグランジュの定理より $1$ か $p$）。$G$ は可換なので $H,K$ は正規、$\abs{HK}=p\cdot p/1=p^{2}$（\ref{grp:product-formula}）なので $HK=G$。\ref{grp:internal-direct-product} より $G\cong H\times K\cong\Z/p\Z\times\Z/p\Z$。

**Step 3（二つは異なる）.** $\Z/p\Z\times\Z/p\Z$ の元の位数は $\lcm$ の公式（\ref{grp:direct-product-basic.3}）から $1$ か $p$ で、位数 $p^{2}$ の元がない。同型は位数を保つ。
:::

::: supplement
**位数 $p^{3}$ では.** 非可換になりうる：$D_{4}$ と $Q_{8}$ は位数 $8=2^{3}$ の非可換群で、互いに同型でない（$D_{4}$ には位数 $2$ の元が五つ、$Q_{8}$ には一つ）。

**高い視点.** \ref{grp:fixed-point-congruence} は「$p$ 群の作用では、固定点以外は $p$ の倍数個ずつ固まって動く」ことを言っている。シローの定理の証明（\tref{grp:page-sylow}）もこの補題を別の作用に使う。
:::

## コーシーの定理 {#grp:sec-ce-cauchy}

::: theorem コーシーの定理 {#grp:cauchy keywords="Cauchy's theorem, element of prime order" index="コーシーの定理|こーしーのていり" refname="コーシーの定理"}
有限群 $G$ の位数を素数 $p$ が割り切るなら、$G$ には位数 $p$ の元がある。
:::

::: intuition
$p$ 個の元の積が $e$ になる組 $(x_{1},\dots,x_{p})$ を、巡回的にずらす操作で動かす。ずらしても変わらない組は $(x,\dots,x)$ で $x^{p}=e$ をみたすものだけで、固定点の合同式から、その個数は $p$ の倍数になる。$(e,\dots,e)$ が一つあるので、他にもある。
:::

::: proof
**Step 1（集合 $X$）.** $X\defeq\{(x_{1},\dots,x_{p})\in G^{p} : x_{1}x_{2}\cdots x_{p}=e\}$ とおく。$x_{1},\dots,x_{p-1}$ を自由に選ぶと、$x_{p}=(x_{1}\cdots x_{p-1})^{-1}$ がただ一つ決まるので、$\abs{X}=\abs{G}^{p-1}$。$p\mid\abs{G}$ なので $\abs{X}\equiv 0\pmod p$。

**Step 2（巡回シフトは $X$ 上の作用）.** $\tau(x_{1},x_{2},\dots,x_{p})\defeq(x_{2},\dots,x_{p},x_{1})$ とおく。$x_{1}\cdots x_{p}=e$ なら $x_{2}\cdots x_{p}x_{1}=x_{1}^{-1}(x_{1}x_{2}\cdots x_{p})x_{1}=x_{1}^{-1}x_{1}=e$ なので、$\tau$ は $X$ を $X$ に写す。$\tau$ は全単射（逆は右へのずらし）で、$\tau^{p}=\id$。よって $k+p\Z\mapsto\tau^{k}$ は $\Z/p\Z$ から $\Sym(X)$ への準同型として矛盾なく定まり（$\tau^{k}=\tau^{k'}$ は $p\mid k-k'$ から）、$\Z/p\Z$ の $X$ への作用を与える（\ref{grp:action-homomorphism}）。

**Step 3（固定点）.** $\Z/p\Z$ は生成元 $1$ をもつので、固定点は $\tau(x)=x$ となる $x\in X$、すなわち $x_{1}=x_{2}=\cdots=x_{p}$ となる組 $(a,\dots,a)$ で、$X$ に属する条件は $a^{p}=e$。よって $\abs{X^{\Z/p\Z}}=\abs{\{a\in G : a^{p}=e\}}$。

**Step 4.** $\Z/p\Z$ は $p$ 群なので \ref{grp:fixed-point-congruence} と Step 1 より $\abs{\{a : a^{p}=e\}}\equiv\abs{X}\equiv 0\pmod p$。$a=e$ がこの集合に属するので、個数は $p$ 以上で、$e$ 以外の $a$ で $a^{p}=e$ となるものがある。その位数は $p$ の約数で $1$ でないので $p$（\ref{grp:order-divides}）。

::: hypcheck
- **$p\mid\abs{G}$**：Step 1 の $\abs{X}\equiv 0$ に使った。
- **$p$ が素数**：Step 4 で \ref{grp:fixed-point-congruence} を $\Z/p\Z$ に使うこと（$\Z/p\Z$ が $p$ 群）と、位数が $p$ の約数で $1$ でなければ $p$ であることに使った。合成数では偽：$\Z/2\Z\times\Z/2\Z$ の位数 $4$ は $4$ で割り切れるが、位数 $4$ の元はない。
:::
:::

::: proof 別証明（類等式と位数についての帰納法） {of="grp:cauchy"}
$\abs{G}$ についての強い帰納法で示す。$p\mid\abs{G}$ とし、位数が $\abs{G}$ より小さく $p$ で割り切れる群では主張が成り立つとする。

**Step 1（可換群の場合）.** 【主張：$G$ が可換なら位数 $p$ の元がある】 $p\mid\abs{G}$ なので $G\neq\{e\}$。$a\neq e$ をとり $m\defeq\ord(a)$ とする（有限群なので有限）。$p\mid m$ なら \ref{grp:order-of-power.1} から $\ord(a^{m/p})=m/\gcd(m,m/p)=p$。$p\nmid m$ なら、$H\defeq\langle a\rangle$ は（$G$ が可換なので）正規部分群で、剰余群 $G/H$（\ref{grp:quotient-group}）の位数 $\abs{G}/m$（\ref{grp:lagrange}）は $p$ で割り切れ（$p$ は素数で $p\nmid m$）、$m\ge2$ なので $\abs{G}$ より小さい。帰納法の仮定から位数 $p$ の元 $bH$ がある。$n\defeq\ord(b)$ とすると $(bH)^{n}=H$ なので $p\mid n$（\ref{grp:order-divides}）。よって $\ord(b^{n/p})=p$。

**Step 2（一般の場合）.** 【主張：$G$ が可換でなくても位数 $p$ の元がある】 類等式 $\abs{G}=\abs{Z(G)}+\sum_{i}(G:Z_{G}(x_{i}))$（\ref{grp:class-equation.2}）を使う。ある $i$ で $p\nmid(G:Z_{G}(x_{i}))$ なら、$\abs{G}=(G:Z_{G}(x_{i}))\,\abs{Z_{G}(x_{i})}$ と $p$ が素数であることから $p\mid\abs{Z_{G}(x_{i})}$。$x_{i}\notin Z(G)$ なので $Z_{G}(x_{i})\neq G$ で、帰納法の仮定から $Z_{G}(x_{i})$ に（したがって $G$ に）位数 $p$ の元がある。すべての $i$ で $p\mid(G:Z_{G}(x_{i}))$ なら、類等式から $p\mid\abs{Z(G)}$。$Z(G)$ は可換なので、Step 1 から位数 $p$ の元がある。

::: hypcheck
- **$p$ が素数**：Step 1 の $\ord(a^{m/p})=p$ と「$p\nmid m$ なら $p\mid\abs{G}/m$」、Step 2 の「$p\nmid(G:Z_{G}(x_{i}))$ なら $p\mid\abs{Z_{G}(x_{i})}$」（素数が積を割れば一方を割る）に使った。
- 主証明（$p$ 個の元の組を巡回的にずらす議論）は固定点の合同式だけで済む。こちらは帰納法・剰余群・類等式を使う古典的な証明で、シローの定理の証明と同じ型の議論になる。どちらも選択公理は使わない。
:::
:::

::: corollary {#grp:p-group-iff-elements}
有限群 $G$ について、$G$ が $p$ 群 $\iff$ すべての元の位数が $p$ の冪。
:::

::: proof
$\Rightarrow$：元の位数は $\abs{G}=p^{n}$ を割り切る（\ref{grp:lagrange-corollaries}）ので $p$ の冪（記法の確認）。$\Leftarrow$：$\abs{G}$ が $p$ 以外の素数 $q$ で割り切れれば、\ref{grp:cauchy} より位数 $q$ の元があり、仮定に反する。よって $\abs{G}$ の素因数は $p$ だけで、$\abs{G}=p^{n}$（素因数を一つずつ割っていくと $p$ の冪になる）。
:::

## p 群の正規部分群 {#grp:sec-ce-normal}

::: theorem p 群は各位数の正規部分群をもつ {#grp:p-group-normal-subgroups keywords="a group of order p^n has normal subgroups of every order p^k" index="p 群の正規部分群|ぴーぐんのせいきぶぶんぐん"}
$\abs{G}=p^{n}$ なら、各 $0\le k\le n$ について位数 $p^{k}$ の $G$ の正規部分群がある。
:::

::: proof
$n$ についての帰納法。$n=0$ なら $k=0$ で $\{e\}$。$n\ge 1$ とし、位数 $p^{n-1}$ の群について主張が成り立つとする。

**Step 1（中心の位数 $p$ の元）.** \ref{grp:p-group-center} より $p\mid\abs{Z(G)}$。\ref{grp:cauchy} を $Z(G)$ に使い、位数 $p$ の $z\in Z(G)$ をとる。$N\defeq\ang{z}$ は中心に含まれるので正規（$gzg^{-1}=z$）で、$\abs{N}=p$。

**Step 2（剰余群に帰納法）.** $\abs{G/N}=p^{n-1}$（\ref{grp:quotient-group}）。$k=0$ は $\{e\}$。$1\le k\le n$ について、帰納法の仮定から位数 $p^{k-1}$ の正規部分群 $\bar K\trianglelefteq G/N$ がある。

**Step 3（引き戻す）.** \ref{grp:correspondence}より $\bar K=K/N$ となる $K$（$N\subseteq K\le G$）があり、3 より $K\trianglelefteq G$。$\abs{K}=\abs{N}\abs{K/N}=p\cdot p^{k-1}=p^{k}$（ラグランジュの定理を $K$ と $N$ に使う）。

::: hypcheck
- **$p$ 群**：Step 1 で中心が $p$ で割り切れることに使った。一般の有限群では偽（下の補足）。
- **コーシーの定理**：Step 1 で、可換群 $Z(G)$ に使った。
:::
:::

::: supplement
**$p$ 群でないと.** 一般の有限群では、位数の約数ごとに部分群があるとは限らない：交代群 $A_{4}$（位数 $12$）は位数 $6$ の部分群をもたない（\ref{grp:a4-no-order-6}）。

**シローの定理へ.** 一般の有限群 $G$ で $\abs{G}=p^{n}m$（$p\nmid m$）なら、位数 $p^{n}$ の部分群（シロー $p$ 部分群）が存在する（\tref{grp:page-sylow}）。それにこの定理を使うと、$p^{k}$（$k\le n$）の位数の部分群がすべて存在することになる。ただし $G$ での正規性は一般には成り立たない。
:::

## 問題 {#grp:sec-ce-problems}

::: problem {#grp:prob-normal-meets-center}
$G$ を $p$ 群、$N\trianglelefteq G$ で $N\neq\{e\}$ とする。$N\cap Z(G)\neq\{e\}$ を示せ。
:::

::: solution
$G$ は $N$ に共役で作用する（$N$ が正規なので $gNg^{-1}=N$）。固定点全体は $\{n\in N : \text{すべての } g \text{ で } gng^{-1}=n\}=N\cap Z(G)$。\ref{grp:fixed-point-congruence} より $\abs{N\cap Z(G)}\equiv\abs{N}\equiv 0\pmod p$（$\abs{N}$ は $p^{n}$ の約数で $1$ でないので $p$ の倍数）。$e\in N\cap Z(G)$ なので個数は $p$ 以上。
:::

::: problem {#grp:prob-order-six}
位数 $6$ の群は $\Z/6\Z$ か $D_{3}$ のどちらかと同型であることを示せ。
:::

::: solution
**Step 1.** \ref{grp:cauchy} より位数 $3$ の元 $a$ と位数 $2$ の元 $b$ がある。$N\defeq\ang{a}$ は指数 $2$ なので正規（\ref{grp:prob-index-two}）、$H\defeq\{e,b\}$ について $N\cap H=\{e\}$（位数が\term[互いに素]{grp:gcd}、\ref{grp:coprime-orders-trivial-intersection}）、$\abs{NH}=6$ なので $NH=G$。

**Step 2.** $bab^{-1}\in N$ の位数は $3$（共役は自己同型、\ref{grp:homomorphism-basic.5}）なので $bab^{-1}\in\{a,a^{2}\}$。

**Step 3.** $bab^{-1}=a$ なら $a,b$ は可換で、$G=NH$ は可換。$H$ も正規になり、$G\cong N\times H\cong\Z/3\Z\times\Z/2\Z\cong\Z/6\Z$（\ref{grp:internal-direct-product}, \ref{grp:chinese-remainder-group}）。

**Step 4.** $bab^{-1}=a^{2}=a^{-1}$ なら、\ref{grp:internal-semidirect} より $G\cong N\rtimes_{\theta}H$ で $\theta_{b}(x)=x^{-1}$。巡回群の分類から $N\cong\Z/3\Z$, $H\cong\Z/2\Z$ で、これは \ref{grp:dihedral-semidirect} の $\Z/3\Z\rtimes\Z/2\Z\cong D_{3}$。（$\theta$ が同じ形の半直積は同型であることを使った：同型 $N\to\Z/3\Z$, $H\to\Z/2\Z$ を成分ごとに施すと演算が対応する。）
:::

::: problem {#grp:prob-class-sizes-divide}
有限群 $G$ の類等式が $10=1+1+2+2+4$ となることはないことを示せ。
:::

::: solution
$10=1+1+2+2+4$ なら、大きさ $1$ の類が二つなので $\abs{Z(G)}=2$。$4$ は共役類の大きさなので $\abs{G}=10$ の約数でなければならない（\ref{grp:class-equation.1}）が、$4\nmid 10$。矛盾。
:::
