# 直積と半直積 {#grp:page-products keywords="direct product, external direct product, internal direct product, Chinese remainder theorem, semidirect product, dihedral group as semidirect product, least common multiple"}

二つの群 $H,K$ から、組 $(h,k)$ を成分ごとに掛ける群 $H\times K$（**直積**）が作れる（\ref{grp:direct-product}）。逆に、群 $G$ が二つの正規部分群 $H,K$ を「重なりなく」含み $G=HK$ となるとき、$G$ は $H\times K$ と同型になる（\ref{grp:internal-direct-product}）。この判定法を整数の剰余群に使うと**中国剰余定理** $\Z/mn\Z\cong\Z/m\Z\times\Z/n\Z$（$\gcd(m,n)=1$、\ref{grp:chinese-remainder-group}）が得られる。片方の部分群だけが正規なときには、直積の代わりに**半直積**（\ref{grp:semidirect-product}）が現れる。二面体群は回転の巡回群と折り返しの位数 $2$ の群の半直積である（\ref{grp:dihedral-semidirect}）。

> 直積と中国剰余定理は雪江明彦『代数学 1 群論入門』第 2 章 §2.9 を参考にした。半直積は資料によらず、標準的な定義から組み立てた。

## 記法と定義の確認 {#grp:sec-pr-notation}

::: notation
- 群・部分群・生成された部分群は \ref{grp:group}, \ref{grp:subgroup}, \ref{grp:generated-subgroup}、元の位数は \ref{grp:element-order}, \ref{grp:order-divides}、$\Z$ の部分群は \ref{grp:subgroups-of-z}、最大公約数とベズーの等式は \ref{grp:gcd}, \ref{grp:bezout-euclid}。
- 正規部分群・剰余群は \ref{grp:normal-subgroup}, \ref{grp:quotient-group}、部分群の積 $HN$ は \ref{grp:product-with-normal}、\ref{grp:product-formula}。準同型・同型・自己同型群 $\Aut$・第一同型定理は \ref{grp:homomorphism}, \ref{grp:homomorphism-basic}, \ref{grp:inner-automorphisms}, \ref{grp:first-isomorphism}。
- 二面体群 $D_{n}=\ang{r,s}$（$n\ge 3$）と関係式 $r^{n}=s^{2}=e$, $srs=r^{-1}$ は \ref{grp:dihedral-group}, \ref{grp:dihedral-order}。$(\Z/n\Z)^{\times}$ とオイラー関数 $\varphi$ は \ref{grp:units-mod-n}。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 直積 {#grp:sec-pr-direct}

::: definition 直積 {#grp:direct-product keywords="direct product, external direct product, product of groups, projection" index="直積|ちょくせき, 外部直積|がいぶちょくせき"}
群 $G_{1},\dots,G_{n}$ について、直積集合 $G_{1}\times\cdots\times G_{n}$ に成分ごとの演算
$$
(g_{1},\dots,g_{n})(g'_{1},\dots,g'_{n})\defeq(g_{1}g'_{1},\dots,g_{n}g'_{n})
$$
を入れたものを $G_{1},\dots,G_{n}$ の**直積**という。単位元は $(e,\dots,e)$、$(g_{i})_{i}$ の逆元は $(g_{i}^{-1})_{i}$ で、群の公理は各成分で成り立つことから従う。$p_{i}(g_{1},\dots,g_{n})\defeq g_{i}$ を**射影**という。可換群の直積を $G_{1}\oplus\cdots\oplus G_{n}$ と書くこともある。
:::

::: proposition 直積の基本性質 {#grp:direct-product-basic keywords="universal property of direct product, order of an element in a direct product, lcm" index="最小公倍数|さいしょうこうばいすう"}
$G,H$ を群とする。
1. 射影 $p_{1}:G\times H\to G$, $p_{2}:G\times H\to H$ は全射準同型で、$\Ker p_{2}=G\times\{e\}\cong G$、$\Ker p_{1}=\{e\}\times H\cong H$。これらは $G\times H$ の正規部分群で、互いの元は可換、共通部分は単位元だけ。$(G\times H)/(G\times\{e\})\cong H$。
2. （**普遍性**）群 $K$ と準同型 $\alpha:K\to G$, $\beta:K\to H$ に対し、$p_{1}\circ\gamma=\alpha$, $p_{2}\circ\gamma=\beta$ となる準同型 $\gamma:K\to G\times H$ がただ一つある（$\gamma(x)=(\alpha(x),\beta(x))$）。
3. $a,b\in\Z$ について $a\Z\cap b\Z=l\Z$ となる $l\in\N$ がただ一つある（\ref{grp:subgroups-of-z}）。これを $a,b$ の**最小公倍数**といい $\lcm(a,b)$ と書く。$g\in G$, $h\in H$ が有限位数なら $\ord(g,h)=\lcm(\ord g,\ord h)$。
:::

::: proof
**Step 1（1）.** $p_{1}((g,h)(g',h'))=gg'=p_{1}(g,h)p_{1}(g',h')$、全射は明らか。$\Ker p_{2}=\{(g,h) : h=e\}=G\times\{e\}$ で、$g\mapsto(g,e)$ は $G$ から $G\times\{e\}$ への同型。核なので正規（\ref{grp:homomorphism-basic}）。$(g,e)(e,h)=(g,h)=(e,h)(g,e)$。$(G\times\{e\})\cap(\{e\}\times H)=\{(e,e)\}$。最後の同型は $p_{2}$ に \ref{grp:first-isomorphism} を使う。

**Step 2（2）.** $\gamma(x)\defeq(\alpha(x),\beta(x))$ は成分ごとに準同型なので準同型で、$p_{1}\gamma=\alpha$, $p_{2}\gamma=\beta$。条件をみたす $\gamma'$ は $\gamma'(x)=(p_{1}\gamma'(x),p_{2}\gamma'(x))=(\alpha(x),\beta(x))$ なので $\gamma'=\gamma$。

**Step 3（3）.** $a\Z\cap b\Z$ は部分群の共通部分なので部分群（\ref{grp:subgroup-intersection}）、\ref{grp:subgroups-of-z} から $l$ が決まる。$(g,h)^{k}=(g^{k},h^{k})$（成分ごとの演算と帰納法）なので
$$
(g,h)^{k}=e\iff g^{k}=e\text{ かつ }h^{k}=e\iff k\in\ord(g)\Z\cap\ord(h)\Z=\lcm(\ord g,\ord h)\,\Z
$$
（\ref{grp:order-divides}）。$\ord g,\ord h\ge 1$ なので積 $\ord g\cdot\ord h$ がこの共通部分に属し、$l\ge 1$。よって位数は $l$（\ref{grp:order-divides} の逆向き）。
:::

::: example
$\Z/2\Z\times\Z/2\Z$ の単位元以外の元 $(1,0),(0,1),(1,1)$ はどれも位数 $2$ なので、位数 $4$ の元がなく、巡回群 $\Z/4\Z$ と同型でない（同型は位数を保つ。\ref{grp:homomorphism-basic.5}）。積の表を比べると、クラインの四元群 $V$ と同型である（$(1,0),(0,1),(1,1)$ を $a,b,c$ に対応させる）。
:::

::: theorem 内部直積 {#grp:internal-direct-product keywords="internal direct product, recognition theorem for direct products" index="内部直積|ないぶちょくせき"}
$G$ を群、$H,K\le G$ とする。次は同値である。
1. $H\trianglelefteq G$, $K\trianglelefteq G$, $H\cap K=\{e\}$, $HK=G$。
2. $\mu(h,k)\defeq hk$ が $H\times K$ から $G$ への同型である。

このとき $G$ は $H$ と $K$ の**内部直積**であるという。特に、$H$ の元と $K$ の元は可換で、$G$ の各元は $hk$（$h\in H$, $k\in K$）の形にただ一通りに書ける。
:::

::: proof
**Step 1（1⇒2：可換性）.** $h\in H$, $k\in K$ とし、$c\defeq hkh^{-1}k^{-1}$ とおく。$c=h\,(kh^{-1}k^{-1})$ で、$H$ の正規性から $kh^{-1}k^{-1}\in H$ なので $c\in H$。同様に $c=(hkh^{-1})k^{-1}$ で、$K$ の正規性から $hkh^{-1}\in K$ なので $c\in K$。よって $c\in H\cap K=\{e\}$、$hk=kh$。

**Step 2（1⇒2：準同型）.** Step 1 より $\mu(h,k)\mu(h',k')=hkh'k'=hh'kk'=\mu(hh',kk')=\mu((h,k)(h',k'))$。

**Step 3（1⇒2：全単射）.** 全射は $HK=G$ から。$\mu(h,k)=e$ なら $h=k^{-1}\in H\cap K=\{e\}$ なので $(h,k)=(e,e)$。\ref{grp:homomorphism-basic.3} より単射。

**Step 4（2⇒1）.** $\mu$ は同型で、$H\times\{e\}$, $\{e\}\times K$ は $H\times K$ の正規部分群（\ref{grp:direct-product-basic.1}）なので、その像 $\mu(H\times\{e\})=H$, $\mu(\{e\}\times K)=K$ は $G$ の正規部分群（同型による像。$\mu^{-1}$ も同型なので、正規部分群の逆像として \ref{grp:homomorphism-basic.2}）。$HK=\im\mu=G$。$x\in H\cap K$ なら $\mu(x,e)=x=\mu(e,x)$ で、単射性から $(x,e)=(e,x)$、$x=e$。

**Step 5（一意性）.** $hk=h'k'$ なら $\mu(h,k)=\mu(h',k')$ で、単射性から $h=h'$, $k=k'$。

::: hypcheck
- **両方が正規**：Step 1 で両方を使った（$c\in H$ に $H$ の正規性、$c\in K$ に $K$ の正規性）。片方だけでは偽：$D_{3}$ の $N=\ang{r}$（正規）と $H=\{e,s\}$（正規でない）は $N\cap H=\{e\}$, $NH=D_{3}$（$\abs{NH}=3\cdot 2/1=6$、\ref{grp:product-formula}）をみたすが、$D_{3}$ は非可換で $\Z/3\Z\times\Z/2\Z$（可換）と同型でない。このときは半直積になる（\ref{grp:internal-semidirect}）。
- **$H\cap K=\{e\}$**：Step 1, 3 に使った。外すと $\mu$ は単射でない。
:::
:::

::: theorem 中国剰余定理 {#grp:chinese-remainder-group keywords="Chinese remainder theorem, Z/mn ≅ Z/m × Z/n" index="中国剰余定理|ちゅうごくじょうよていり, 中国式剰余定理|ちゅうごくしきじょうよていり" refname="群の中国剰余定理"}
$m,n\ge 1$ とする。
$$
\Z/mn\Z\cong\Z/m\Z\times\Z/n\Z\iff\gcd(m,n)=1.
$$
$\gcd(m,n)=1$ のとき、同型は $x+mn\Z\mapsto(x+m\Z,\ x+n\Z)$ で与えられ、$ma+nb=1$ となる整数 $a,b$ について、$(x+m\Z,\ y+n\Z)$ に対応する元は $z\defeq x\,nb+y\,ma$ の剰余類である。
:::

::: proof
**Step 1（写像）.** $\Z\to\Z/m\Z\times\Z/n\Z$, $x\mapsto(x+m\Z,x+n\Z)$ は自然な射影の組なので準同型（\ref{grp:direct-product-basic.2}）。その核は $m\Z\cap n\Z$ で、$mn\Z$ を含む（$mn\in m\Z\cap n\Z$）。\ref{grp:factor-through-quotient} より準同型 $\Phi:\Z/mn\Z\to\Z/m\Z\times\Z/n\Z$, $\Phi(x+mn\Z)=(x+m\Z,x+n\Z)$ がある。

**Step 2（$\gcd=1$ なら全射）.** $ma+nb=1$ とする（ベズーの等式）。$z=xnb+yma$ について $z-x=x(nb-1)+yma=m(ya-xa)$ なので $z+m\Z=x+m\Z$。同様に $z-y=n(xb-yb)$ なので $z+n\Z=y+n\Z$。よって $\Phi(z+mn\Z)=(x+m\Z,y+n\Z)$ で全射。

**Step 3（$\gcd=1$ なら同型）.** 両辺の位数はともに $mn$ なので、全射 $\Phi$ は全単射（有限集合の間の全射）で、同型。

**Step 4（$\gcd>1$ なら同型でない）.** $g\defeq\gcd(m,n)>1$ とし、$L\defeq mn/g$ とおく。$g\mid n$ なので $L=m\cdot(n/g)$ は $m$ の倍数、同様に $n$ の倍数。$(x+m\Z,y+n\Z)$ を $L$ 回足すと $(Lx+m\Z,Ly+n\Z)=(0,0)$ なので、$\Z/m\Z\times\Z/n\Z$ のすべての元の位数は $L$ を割り切り、特に $L$ 以下で、$L<mn$。一方 $\Z/mn\Z$ の $1+mn\Z$ の位数は $mn$。同型は位数を保つので、同型でない。

::: hypcheck
- **$\gcd(m,n)=1$**：Step 2 のベズーの等式 $ma+nb=1$ に使った。Step 4 のとおり外すと偽：$\Z/4\Z\not\cong\Z/2\Z\times\Z/2\Z$。
- 不完全性定理の系列では、自然数の範囲の同じ主張を、ゲーデルの $\beta$ 関数のために別に証明している（\ref{pt:chinese-remainder}）。
:::
:::

::: corollary オイラー関数の乗法性 {#grp:euler-phi-multiplicative keywords="multiplicativity of Euler's totient function" index="オイラー関数の乗法性|おいらーかんすうのじょうほうせい"}
$\gcd(m,n)=1$ なら $\varphi(mn)=\varphi(m)\varphi(n)$。
:::

::: proof
**Step 1.** $\gcd(x,mn)=1\iff\gcd(x,m)=1$ かつ $\gcd(x,n)=1$ を示す。$\Rightarrow$：$1=xs+mnt=xs+m(nt)$ なので $1\in x\Z+m\Z$、$\gcd(x,m)=1$。$n$ も同様。$\Leftarrow$：$1=xs+mt$, $1=xu+nv$ と書いて掛けると $1=x(sxu+snv+mtu)+mn\,tv\in x\Z+mn\Z$。

**Step 2.** \ref{grp:chinese-remainder-group} の全単射 $\Phi$ を、代表元 $x\in\{0,\dots,mn-1\}$ と $(r_{m}(x),r_{n}(x))$ の対応として見る。Step 1 と \ref{grp:gcd-residue.1}（$\gcd(r_{m}(x),m)=\gcd(x,m)$）より、$x\in(\Z/mn\Z)^{\times}\iff r_{m}(x)\in(\Z/m\Z)^{\times}$ かつ $r_{n}(x)\in(\Z/n\Z)^{\times}$。よって $\Phi$ は $(\Z/mn\Z)^{\times}$ と $(\Z/m\Z)^{\times}\times(\Z/n\Z)^{\times}$ の間の全単射を与え、元の個数を比べて $\varphi(mn)=\varphi(m)\varphi(n)$。
:::

> この全単射は乗法も保つので、$(\Z/mn\Z)^{\times}\cong(\Z/m\Z)^{\times}\times(\Z/n\Z)^{\times}$ という群の同型になる（$r_{m}(r_{mn}(xy))=r_{m}(xy)$ による）。

## 半直積 {#grp:sec-pr-semidirect}

::: definition 半直積 {#grp:semidirect-product keywords="semidirect product, action by automorphisms" index="半直積|はんちょくせき"}
$N,H$ を群、$\theta:H\to\Aut(N)$ を準同型とし、$\theta(h)$ を $\theta_{h}$ と書く。集合 $N\times H$ に演算
$$
(n,h)(n',h')\defeq\bigl(n\,\theta_{h}(n'),\ hh'\bigr)
$$
を入れたものを $N$ と $H$ の $\theta$ による**半直積**といい、$N\rtimes_{\theta}H$ と書く。
:::

::: intuition
$H$ の元 $h$ は、$N$ の元を右に「くぐり抜ける」ときに $\theta_{h}$ だけ $N$ の元を変える：$(e,h)(n',e)=(\theta_{h}(n'),h)$。$\theta$ が自明（すべての $h$ で $\theta_{h}=\id$）なら直積 $N\times H$ そのものである。
:::

::: theorem 半直積は群 {#grp:semidirect-group}
$G\defeq N\rtimes_{\theta}H$ は群で、単位元は $(e,e)$、$(n,h)$ の逆元は $(\theta_{h^{-1}}(n^{-1}),h^{-1})$。さらに
1. $\bar N\defeq N\times\{e\}$ は $G$ の正規部分群で、$n\mapsto(n,e)$ により $N\cong\bar N$。
2. $\bar H\defeq\{e\}\times H$ は $G$ の部分群で、$h\mapsto(e,h)$ により $H\cong\bar H$。
3. $\bar N\cap\bar H=\{(e,e)\}$、$\bar N\bar H=G$、$G/\bar N\cong H$。
4. $(e,h)(n,e)(e,h)^{-1}=(\theta_{h}(n),e)$。$\abs{G}=\abs{N}\abs{H}$。
:::

::: proof
**Step 1（結合法則）.** $\theta$ が準同型であることから $\theta_{hh'}=\theta_{h}\circ\theta_{h'}$、各 $\theta_{h}$ が準同型であることから $\theta_{h}(ab)=\theta_{h}(a)\theta_{h}(b)$。これらを使うと
$$
\begin{aligned}
\bigl((n,h)(n',h')\bigr)(n'',h'')&=\bigl(n\theta_{h}(n')\,\theta_{hh'}(n''),\ hh'h''\bigr),\\
(n,h)\bigl((n',h')(n'',h'')\bigr)&=\bigl(n\,\theta_{h}(n'\theta_{h'}(n'')),\ hh'h''\bigr)\\
&=\bigl(n\theta_{h}(n')\,\theta_{h}(\theta_{h'}(n'')),\ hh'h''\bigr),
\end{aligned}
$$
で、$\theta_{hh'}(n'')=\theta_{h}(\theta_{h'}(n''))$ なので一致する。

**Step 2（単位元・逆元）.** $\theta_{e}=\id_{N}$（準同型は単位元を単位元に送る）と $\theta_{h}(e)=e$ から、$(e,e)(n,h)=(\theta_{e}(n),h)=(n,h)$、$(n,h)(e,e)=(n\theta_{h}(e),h)=(n,h)$。$(n,h)(\theta_{h^{-1}}(n^{-1}),h^{-1})=(n\,\theta_{h}\theta_{h^{-1}}(n^{-1}),e)=(nn^{-1},e)=(e,e)$。左逆元についても $(\theta_{h^{-1}}(n^{-1}),h^{-1})(n,h)=(\theta_{h^{-1}}(n^{-1})\theta_{h^{-1}}(n),e)=(\theta_{h^{-1}}(n^{-1}n),e)=(e,e)$。

**Step 3（1, 3）.** $p(n,h)\defeq h$ は $p((n,h)(n',h'))=hh'$ なので $G\to H$ の全射準同型で、$\Ker p=\bar N$。よって $\bar N\trianglelefteq G$、$G/\bar N\cong H$（\ref{grp:first-isomorphism}）。$(n,e)(n',e)=(n\theta_{e}(n'),e)=(nn',e)$ なので $n\mapsto(n,e)$ は単射準同型で、像は $\bar N$。

**Step 4（2, 3 の残り）.** $(e,h)(e,h')=(e\theta_{h}(e),hh')=(e,hh')$ なので $h\mapsto(e,h)$ は単射準同型で、像 $\bar H$ は部分群。$\bar N\cap\bar H=\{(e,e)\}$ は明らか。$(n,e)(e,h)=(n\theta_{e}(e),h)=(n,h)$ なので $\bar N\bar H=G$。

**Step 5（4）.** $(e,h)^{-1}=(e,h^{-1})$（Step 2）で、$(e,h)(n,e)=(\theta_{h}(n),h)$、$(\theta_{h}(n),h)(e,h^{-1})=(\theta_{h}(n)\theta_{h}(e),e)=(\theta_{h}(n),e)$。位数は集合 $N\times H$ の元の個数。
:::

::: theorem 内部半直積 {#grp:internal-semidirect keywords="internal semidirect product, recognition theorem for semidirect products, complement" index="内部半直積|ないぶはんちょくせき, 補群|ほぐん"}
$G$ を群、$N\trianglelefteq G$, $H\le G$ で、$N\cap H=\{e\}$, $NH=G$ とする。$\theta_{h}(n)\defeq hnh^{-1}$ とおくと $\theta:H\to\Aut(N)$ は準同型で、$\mu(n,h)\defeq nh$ は同型 $N\rtimes_{\theta}H\to G$ である。
:::

::: proof
**Step 1（$\theta$）.** $N$ が正規なので $c_{h}(n)=hnh^{-1}\in N$ で、\ref{grp:inner-automorphisms} の $c_{h}$ を $N$ に制限したもの $\theta_{h}$ は $N$ から $N$ への準同型。$\theta_{h^{-1}}$ が逆写像なので自己同型。$\theta_{hh'}=\theta_{h}\circ\theta_{h'}$（$c$ が準同型だから）なので $\theta$ は準同型。

**Step 2（$\mu$ は準同型）.** $\mu(n,h)\mu(n',h')=nhn'h'=n(hn'h^{-1})hh'=\mu\bigl(n\theta_{h}(n'),hh'\bigr)=\mu\bigl((n,h)(n',h')\bigr)$。

**Step 3（全単射）.** 全射は $NH=G$ から。$\mu(n,h)=e$ なら $n=h^{-1}\in N\cap H=\{e\}$。\ref{grp:homomorphism-basic.3} より単射。

::: hypcheck
- **$N$ が正規**：Step 1 で $hnh^{-1}\in N$ に使った。$H$ の正規性は要らない（$H$ も正規なら $\theta$ は自明になり、\ref{grp:internal-direct-product} の内部直積になる）。
:::
:::

::: example 二面体群は半直積 {#grp:dihedral-semidirect}
$n\ge 3$ とする。$D_{n}$ の $N\defeq\ang{r}$（位数 $n$、指数 $2$ なので正規）と $H\defeq\{e,s\}$ について、$s\notin\ang{r}$（\ref{grp:dihedral-order}）なので $N\cap H=\{e\}$、$\abs{NH}=n\cdot 2=\abs{D_{n}}$（\ref{grp:product-formula}）なので $NH=D_{n}$。$\theta_{s}(r^{k})=sr^{k}s^{-1}=r^{-k}$。\ref{grp:internal-semidirect} と巡回群の分類（\ref{grp:cyclic-classification}）から
$$
D_{n}\cong\Z/n\Z\rtimes_{\theta}\Z/2\Z,\qquad\theta_{1}(x)=-x.
$$
逆に、この右辺は $n=1,2$ を含むすべての $n\ge 1$ で意味をもつ（$x\mapsto -x$ は可換群 $\Z/n\Z$ の自己同型で、二回施すと恒等写像なので、$\theta_{0}=\id$, $\theta_{1}=(x\mapsto -x)$ は $\Z/2\Z$ からの準同型）。これを位数 $2n$ の二面体群の定義とする流儀もある。$n=2$ では $-x=x$ なので $\theta$ は自明で、$\Z/2\Z\times\Z/2\Z\cong V$ になる。
:::

::: supplement
**直積と半直積の違い.** 半直積 $N\rtimes_{\theta}H$ では $\bar N$ は常に正規だが、$\bar H$ は $\theta$ が自明なときに限り正規である：$(n,e)(e,h)(n,e)^{-1}=(n,h)(n^{-1},e)=(n\,\theta_{h}(n)^{-1},h)$ が $\bar H$ に属する $\iff\theta_{h}(n)=n$。また、$N\trianglelefteq G$ に対して上の条件をみたす $H$（$N$ の**補群**）が存在するとは限らない：$\Z/4\Z$ の部分群 $2\Z/4\Z$ には補群がない（位数 $2$ の部分群はそれ自身だけ）ので、$\Z/4\Z$ は $\Z/2\Z$ と $\Z/2\Z$ の半直積にならない。$N$ と $G/N$ から $G$ を復元する問題（拡大の問題）は、一般には半直積より複雑である。

**高い視点.** $\theta:H\to\Aut(N)$ は「$H$ が $N$ に自己同型として作用する」ことを意味する（\ref{grp:page-group-actions}）。半直積は、作用を掛け算の中に組み込んだ群である。
:::

## 問題 {#grp:sec-pr-problems}

::: problem {#grp:prob-order-four}
位数 $4$ の群は $\Z/4\Z$ か $\Z/2\Z\times\Z/2\Z$ のどちらかに同型であることを示せ。
:::

::: solution
$\abs{G}=4$ とする。元の位数は $1,2,4$ のどれか（\ref{grp:lagrange-corollaries}）。位数 $4$ の元があれば $G$ は巡回群で、$\Z/4\Z$ と同型（\ref{grp:cyclic-classification}）。ないとき、すべての元が $x^{2}=e$ をみたすので $G$ は可換（\ref{grp:prob-exponent-two-abelian}）。$a\neq e$ をとり、$b\notin\{e,a\}$ をとる。$H\defeq\{e,a\}$, $K\defeq\{e,b\}$ は位数 $2$ の部分群で、可換群なので正規、$H\cap K=\{e\}$、$\abs{HK}=4$（\ref{grp:product-formula}）なので $HK=G$。\ref{grp:internal-direct-product} より $G\cong H\times K\cong\Z/2\Z\times\Z/2\Z$。
:::

::: problem {#grp:prob-center-product}
$Z(G\times H)=Z(G)\times Z(H)$ を示せ。また $D_{3}\times\Z/2\Z$ と $D_{6}$ の中心の位数を比べよ。
:::

::: solution
$(z,w)$ が中心 $\iff$ すべての $(g,h)$ で $(zg,wh)=(gz,hw)\iff$ すべての $g$ で $zg=gz$ かつすべての $h$ で $wh=hw\iff z\in Z(G)$ かつ $w\in Z(H)$。$Z(D_{3})=\{e\}$（\ref{grp:center} の例）なので $\abs{Z(D_{3}\times\Z/2\Z)}=1\cdot 2=2$。$Z(D_{6})=\{e,r^{3}\}$ で位数 $2$。（実は $D_{6}\cong D_{3}\times\Z/2\Z$ である：$D_{6}$ の部分群 $\ang{r^{2},s}$（位数 $6$、指数 $2$ で正規）と $Z(D_{6})=\{e,r^{3}\}$ に \ref{grp:internal-direct-product} を使い、$\ang{r^{2},s}\cong D_{3}$ を確かめればよい。）
:::

::: problem {#grp:prob-crt-solve}
$x\equiv 2\pmod{9}$ かつ $x\equiv 3\pmod{7}$ となる整数 $x$ を一つ求めよ。
:::

::: solution
ユークリッドの互除法で $9=7+2$, $7=3\cdot 2+1$ から $1=7-3\cdot 2=7-3(9-7)=4\cdot 7-3\cdot 9$。$m=9$, $n=7$, $a=-3$, $b=4$ として \ref{grp:chinese-remainder-group} の $z=x\,nb+y\,ma$ に $x=2$, $y=3$ を入れると $z=2\cdot 7\cdot 4+3\cdot 9\cdot(-3)=56-81=-25$。検算：$-25=-3\cdot 9+2$, $-25=-4\cdot 7+3$。$9\cdot 7=63$ を足して $x=38$ でもよい。
:::
