# 可解群と冪零群 {#grp:page-solvable-nilpotent keywords="solvable group, derived series, nilpotent group, lower central series, upper central series, finite nilpotent groups are products of Sylow subgroups, normalizer condition"}

交換子部分群をとる操作を繰り返した列（**導来列**）が有限回で $\{e\}$ に達する群を**可解群**という（\ref{grp:solvable-group}）。有限群では、可解であることは「可換な因子をもつ正規列がある」こと、さらに「組成因子がすべて素数位数の巡回群」であることと同値である（\ref{grp:solvable-equivalent}）。可解性は部分群・剰余群・拡大で保たれる（\ref{grp:solvable-closure}）。より強い条件として、中心を使った列が $G$ に達する群を**冪零群**という（\ref{grp:nilpotent-group}）。$p$ 群は冪零で（\ref{grp:p-group-nilpotent}）、有限冪零群はちょうどシロー部分群の直積である（\ref{grp:finite-nilpotent-sylow}）。

> 雪江明彦『代数学 1 群論入門』第 4 章 §4.3 は導来列と可解群を扱っている。冪零群とその特徴づけは資料によらず書いた。

## 記法と定義の確認 {#grp:sec-sn-notation}

::: notation
- 交換子 $[x,y]=xyx^{-1}y^{-1}$、交換子部分群 $[G,G]$ とその性質は \ref{grp:commutator-subgroup}, \ref{grp:commutator-properties}。部分群 $A,B\le G$ について $[A,B]\defeq\ang{\{[a,b] : a\in A,\ b\in B\}}$ と書く。
- 中心 $Z(G)$、正規化群 $N_{G}(H)$ は \ref{grp:center}, \ref{grp:normalizer-centralizer}。準同型・対応定理・第三同型定理は \ref{grp:homomorphism-basic}, \tref{grp:correspondence}, \ref{grp:third-isomorphism}、内部直積は \ref{grp:internal-direct-product}。
- 組成列・ジョルダン–ヘルダーの定理・正規部分群を通る組成列は \ref{grp:composition-series}, \tref{grp:jordan-holder}, \ref{grp:prob-composition-through-normal}。$p$ 群の中心は \ref{grp:p-group-center}。シロー部分群とその性質は \ref{grp:sylow-subgroup}, \ref{grp:sylow-normal-iff-unique}, \ref{grp:prob-sylow-normalizer-self}。$A_{n}$ の単純性は \ref{grp:an-simple}。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 可解群 {#grp:sec-sn-solvable}

::: definition 導来列と可解群 {#grp:solvable-group keywords="derived series, solvable group, soluble group, derived length" index="導来列|どうらいれつ, 可解群|かかいぐん"}
群 $G$ について $G^{(0)}\defeq G$, $G^{(i+1)}\defeq[G^{(i)},G^{(i)}]$ とおいた列 $G=G^{(0)}\supseteq G^{(1)}\supseteq G^{(2)}\supseteq\cdots$ を**導来列**という。ある $k$ で $G^{(k)}=\{e\}$ となるとき $G$ を**可解群**という。
:::

::: lemma 導来列の基本性質 {#grp:derived-series-basic}
1. 各 $G^{(i)}$ は $G$ の正規部分群で、$G^{(i)}/G^{(i+1)}$ は可換群。
2. $H\le G$ なら $H^{(i)}\subseteq G^{(i)}$。
3. $\varphi:G\to K$ が全射準同型なら $\varphi(G^{(i)})=K^{(i)}$。
:::

::: proof
**Step 1（3）.** $\varphi([x,y])=[\varphi(x),\varphi(y)]$ で、$\varphi$ が全射なので $\varphi$ は $G$ の交換子全体を $K$ の交換子全体に写す。生成された部分群の像は像で生成された部分群（\ref{grp:homomorphism-basic.1} と \ref{grp:generated-subgroup-words}）なので $\varphi([G,G])=[K,K]$。$\varphi$ を $G^{(i)}\to K^{(i)}$（帰納法の仮定で全射）に制限して繰り返す。

**Step 2（1）.** $g\in G$ による共役 $c_{g}$ は $G$ の自己同型（全射準同型）なので、3 より $c_{g}(G^{(i)})=G^{(i)}$。よって $G^{(i)}\trianglelefteq G$。$G^{(i)}/G^{(i+1)}=G^{(i)}/[G^{(i)},G^{(i)}]$ は可換（\ref{grp:commutator-properties}）。

**Step 3（2）.** $H$ の交換子は $G$ の交換子なので $[H,H]\subseteq[G,G]$。帰納法で $H^{(i+1)}=[H^{(i)},H^{(i)}]\subseteq[G^{(i)},G^{(i)}]=G^{(i+1)}$。
:::

::: theorem 可解性の言い換え {#grp:solvable-equivalent keywords="solvable iff normal series with abelian factors, finite solvable iff composition factors cyclic of prime order" index="可解性の言い換え|かかいせいのいいかえ"}
群 $G$ について次は同値。
1. $G$ は可解。
2. 因子がすべて可換な正規列 $G=N_{0}\trianglerighteq N_{1}\trianglerighteq\cdots\trianglerighteq N_{r}=\{e\}$ がある。

$G$ が有限なら、さらに次とも同値。

3. $G$ の組成因子はすべて素数位数の巡回群である。
:::

::: proof
**Step 1（1⇒2）.** 導来列 $G^{(0)}\trianglerighteq\cdots\trianglerighteq G^{(k)}=\{e\}$ は \ref{grp:derived-series-basic.1} より可換な因子をもつ正規列。

**Step 2（2⇒1）.** $G^{(i)}\subseteq N_{i}$ を $i$ の帰納法で示す。$i=0$ は等号。$G^{(i)}\subseteq N_{i}$ とすると、$N_{i}/N_{i+1}$ は可換なので \ref{grp:commutator-properties.2}（群 $N_{i}$ とその正規部分群 $N_{i+1}$ に使う）より $[N_{i},N_{i}]\subseteq N_{i+1}$。よって $G^{(i+1)}=[G^{(i)},G^{(i)}]\subseteq[N_{i},N_{i}]\subseteq N_{i+1}$。$i=r$ で $G^{(r)}=\{e\}$。

**Step 3（3⇒2）.** 素数位数の巡回群は可換なので、組成列が 2 の列になる。

**Step 4（1⇒3、有限の場合）.** 導来列 $G=G^{(0)}\trianglerighteq\cdots\trianglerighteq G^{(k)}=\{e\}$ の各段 $G^{(i)}\trianglerighteq G^{(i+1)}$ で、\ref{grp:prob-composition-through-normal} を群 $G^{(i)}$ と正規部分群 $G^{(i+1)}$ に繰り返し使うと、導来列を細かくした $G$ の組成列が得られ、その組成因子は各可換群 $G^{(i)}/G^{(i+1)}$ の組成因子を合わせたもの。可換な単純群は素数位数の巡回群（\ref{grp:simple-group} の例 2）なので、すべての組成因子は素数位数の巡回群。\ref{grp:jordan-holder}より、どの組成列の因子もそうである。
:::

::: theorem 可解性の閉包性 {#grp:solvable-closure keywords="subgroups, quotients and extensions of solvable groups are solvable" index="可解群の閉包性|かかいぐんのへいほうせい"}
1. 可解群の部分群と剰余群は可解である。
2. $N\trianglelefteq G$ で $N$ と $G/N$ がともに可解なら $G$ も可解である。
3. 可解群の有限個の直積は可解である。
:::

::: proof
**Step 1（1）.** $G^{(k)}=\{e\}$ とする。$H\le G$ なら $H^{(k)}\subseteq G^{(k)}=\{e\}$（\ref{grp:derived-series-basic.2}）。$N\trianglelefteq G$ なら自然な射影 $\pi$ について $(G/N)^{(k)}=\pi(G^{(k)})=\{N\}$（同 3）。

**Step 2（2）.** $(G/N)^{(k)}=\{N\}$, $N^{(l)}=\{e\}$ とする。$\pi(G^{(k)})=(G/N)^{(k)}=\{N\}$ なので $G^{(k)}\subseteq N$。すると $G^{(k+l)}=(G^{(k)})^{(l)}\subseteq N^{(l)}=\{e\}$（$G^{(k+j)}=(G^{(k)})^{(j)}$ は定義から、包含は \ref{grp:derived-series-basic.2}）。

**Step 3（3）.** $G\times H$ で $G\times\{e\}\cong G$ は正規、$(G\times H)/(G\times\{e\})\cong H$（\ref{grp:direct-product-basic}）なので 2 から。有限個は帰納法。
:::

::: example
1. 可換群は可解（$G^{(1)}=\{e\}$）。
2. $D_{n}$ は可解：$D_{n}^{(1)}=\ang{r^{2}}$（\ref{grp:dihedral-commutator}）は可換なので $D_{n}^{(2)}=\{e\}$。
3. $S_{4}$ は可解：$S_{4}^{(1)}=A_{4}$（\ref{grp:prob-commutator-sn}）、$A_{4}^{(1)}=V$（$A_{4}/V$ は位数 $3$ で可換なので $[A_{4},A_{4}]\subseteq V$、逆に $[(1\ 2\ 3),(1\ 2)(3\ 4)]=(1\ 3)(2\ 4)$（右から施して計算する）は $[A_{4},A_{4}]$ に属し、$[A_{4},A_{4}]$ は $A_{4}$ の正規部分群なので、$(1\ 3)(2\ 4)$ の $(1\ 2\ 3)$ による共役 $(2\ 1)(3\ 4)$ と、さらにその共役 $(3\ 2)(1\ 4)$ も属する（\ref{grp:conjugation-formula}）。よって $V\subseteq[A_{4},A_{4}]$）、$V^{(1)}=\{e\}$。
4. $n\ge 5$ なら $S_{n}$, $A_{n}$ は可解でない：$A_{n}$ は単純で非可換なので $[A_{n},A_{n}]$ は $\{e\}$ でない正規部分群、よって $A_{n}$。導来列は $A_{n}$ で止まり $\{e\}$ に達しない。部分群 $A_{n}$ が可解でないので、1 より $S_{n}$ も可解でない。
5. $p$ 群は可解（組成因子はすべて $\Z/p\Z$、\ref{grp:composition-series-exists} の後の例 4）。
:::

::: fact 可解性についての深い定理 {#grp:solvable-deep-facts keywords="Burnside's p^a q^b theorem, Feit-Thompson theorem" index="バーンサイドの定理|ばーんさいどのていり, ファイト–トンプソンの定理|ふぁいととんぷそんのていり"}
1. （バーンサイドの $p^{a}q^{b}$ 定理）位数が $p^{a}q^{b}$（$p,q$ は素数）の群は可解である。
2. （ファイト–トンプソンの定理）位数が奇数の有限群は可解である。

1 は表現論の系列で、指標と代数的整数を使って証明した（\ref{rep:burnside-paqb}）。2 は本サイトの範囲外である（証明は非常に長い）。
:::

## 冪零群 {#grp:sec-sn-nilpotent}

::: definition 中心列と冪零群 {#grp:nilpotent-group keywords="lower central series, upper central series, nilpotent group, nilpotency class" index="冪零群|べきれいぐん, 降中心列|こうちゅうしんれつ, 昇中心列|しょうちゅうしんれつ"}
群 $G$ について、
1. **降中心列**：$\gamma_{1}(G)\defeq G$, $\gamma_{i+1}(G)\defeq[\gamma_{i}(G),G]$。
2. **昇中心列**：$Z_{0}(G)\defeq\{e\}$ とし、$Z_{i+1}(G)$ を $Z_{i+1}(G)/Z_{i}(G)=Z(G/Z_{i}(G))$ となる部分群（対応定理で引き戻したもの）とする。

ある $c$ で $\gamma_{c+1}(G)=\{e\}$ となるとき $G$ を**冪零群**といい、そのような最小の $c$ を**冪零類**という。
:::

::: lemma 中心列の基本性質 {#grp:central-series-basic}
1. $\gamma_{i}(G)$, $Z_{i}(G)$ は $G$ の正規部分群で、$\gamma_{i+1}\subseteq\gamma_{i}$、$Z_{i}\subseteq Z_{i+1}$。$Z_{1}(G)=Z(G)$。
2. $x\in Z_{i+1}(G)\iff$ すべての $g\in G$ について $[x,g]\in Z_{i}(G)$。
:::

::: proof
**Step 1（$\gamma_{i}$）.** $\gamma_{i}\trianglelefteq G$ なら、$g[a,h]g^{-1}=[gag^{-1},ghg^{-1}]$ で $gag^{-1}\in\gamma_{i}$ なので、$[\gamma_{i},G]$ の生成元の集合は共役で閉じ、\ref{grp:normal-generators} より $\gamma_{i+1}\trianglelefteq G$。$a\in\gamma_{i}$, $g\in G$ について $[a,g]=a\cdot(ga^{-1}g^{-1})\in\gamma_{i}$（正規性）なので $\gamma_{i+1}\subseteq\gamma_{i}$。

**Step 2（$Z_{i}$）.** $Z(G/Z_{i})$ は $G/Z_{i}$ の正規部分群（\ref{grp:center-normal}）なので、\ref{grp:correspondence.3}より $Z_{i+1}\trianglelefteq G$ で、$Z_{i}\subseteq Z_{i+1}$。$Z_{1}/\{e\}=Z(G/\{e\})$ なので $Z_{1}=Z(G)$。

**Step 3（2）.** $Z_{i}$ は正規なので左剰余類と右剰余類が一致する（\ref{grp:normal-equivalent}）。$xZ_{i}\in Z(G/Z_{i})\iff$ すべての $g$ で $xgZ_{i}=gxZ_{i}\iff$ すべての $g$ で $Z_{i}xg=Z_{i}gx\iff$ すべての $g$ で $(xg)(gx)^{-1}=xgx^{-1}g^{-1}\in Z_{i}$（\ref{grp:coset-partition.4}）。
:::

::: theorem 降中心列と昇中心列 {#grp:lower-upper-central keywords="lower central series reaches e iff upper central series reaches G" index="中心列の同値性|ちゅうしんれつのどうちせい"}
$c\ge 0$ について、$\gamma_{c+1}(G)=\{e\}\iff Z_{c}(G)=G$。このとき $\gamma_{c+1-i}(G)\subseteq Z_{i}(G)$（$0\le i\le c$）。
:::

::: proof
**Step 1（⇒）.** $\gamma_{c+1}=\{e\}$ とし、$\gamma_{c+1-i}\subseteq Z_{i}$ を $i$ の帰納法で示す。$i=0$ は仮定。$\gamma_{c+1-i}\subseteq Z_{i}$ とすると、$x\in\gamma_{c-i}$ と $g\in G$ について $[x,g]\in\gamma_{c+1-i}\subseteq Z_{i}$ なので、\ref{grp:central-series-basic.2} より $x\in Z_{i+1}$。$i=c$ で $G=\gamma_{1}\subseteq Z_{c}$。

**Step 2（⇐）.** $Z_{c}=G$ とし、$\gamma_{i+1}\subseteq Z_{c-i}$ を $i$ の帰納法で示す。$i=0$ は $\gamma_{1}=G=Z_{c}$。$\gamma_{i+1}\subseteq Z_{c-i}$ とすると、$\gamma_{i+2}$ の生成元 $[x,g]$（$x\in\gamma_{i+1}\subseteq Z_{c-i}$）は \ref{grp:central-series-basic.2} より $Z_{c-i-1}$ に属し、$Z_{c-i-1}$ は部分群なので $\gamma_{i+2}\subseteq Z_{c-i-1}$。$i=c$ で $\gamma_{c+1}\subseteq Z_{0}=\{e\}$。
:::

::: theorem p 群は冪零 {#grp:p-group-nilpotent keywords="finite p-groups are nilpotent" index="p 群の冪零性|ぴーぐんのべきれいせい"}
有限 $p$ 群は冪零である。
:::

::: proof
$Z_{i}\neq G$ なら $G/Z_{i}$ は $\{e\}$ でない $p$ 群なので、\ref{grp:p-group-center} より $Z(G/Z_{i})\neq\{e\}$、すなわち $Z_{i}\subsetneq Z_{i+1}$。$G$ は有限なので、昇中心列は有限回で $G$ に達する。\ref{grp:lower-upper-central} より冪零。
:::

::: proposition 冪零なら可解 {#grp:nilpotent-solvable}
冪零群は可解である。逆は成り立たない。
:::

::: proof
$G^{(i)}\subseteq\gamma_{i+1}(G)$ を帰納法で示す：$G^{(0)}=\gamma_{1}$、$G^{(i+1)}=[G^{(i)},G^{(i)}]\subseteq[\gamma_{i+1},G]=\gamma_{i+2}$。$\gamma_{c+1}=\{e\}$ なら $G^{(c)}=\{e\}$。逆の反例：$S_{3}$ は可解（\ref{grp:solvable-closure} の後の例 2、$S_{3}\cong D_{3}$）だが、$Z(S_{3})=\{e\}$ なので $Z_{i}=\{e\}$ がずっと続き、冪零でない。
:::

::: theorem 有限冪零群の特徴づけ {#grp:finite-nilpotent-sylow keywords="a finite group is nilpotent iff it is the direct product of its Sylow subgroups, normalizer grows" index="有限冪零群の特徴づけ|ゆうげんべきれいぐんのとくちょうづけ"}
有限群 $G$ について次は同値。
1. $G$ は冪零。
2. 真部分群 $H\lneq G$ はすべて $H\subsetneq N_{G}(H)$ をみたす。
3. すべてのシロー部分群は正規。
4. $G$ はそのシロー部分群（各素数につき一つ）の直積と同型。
:::

::: proof
**Step 1（1⇒2）.** $c$ を $Z_{c}=G$ とし（\ref{grp:lower-upper-central}）、$Z_{i}\subseteq H$ となる最大の $i$ をとる（$Z_{0}=\{e\}\subseteq H$、$Z_{c}=G\not\subseteq H$ なので $0\le i<c$）。$Z_{i+1}\not\subseteq H$。$z\in Z_{i+1}$, $h\in H$ について $[z,h]\in Z_{i}\subseteq H$（\ref{grp:central-series-basic.2}）なので $zhz^{-1}=[z,h]h\in H$。よって $Z_{i+1}\subseteq N_{G}(H)$ で、$N_{G}(H)\neq H$。

**Step 2（2⇒3）.** $P$ をシロー $p$ 部分群とし、$M\defeq N_{G}(P)$ とする。$N_{G}(M)=M$（\ref{grp:prob-sylow-normalizer-self}）。$M\neq G$ なら 2 に反するので $M=G$、$P\trianglelefteq G$。

**Step 3（3⇒4）.** $\abs{G}=p_{1}^{a_{1}}\cdots p_{k}^{a_{k}}$ とし、$P_{j}$ をシロー $p_{j}$ 部分群（正規なのでただ一つ）とする。$Q_{j}\defeq P_{1}P_{2}\cdots P_{j}$ が位数 $p_{1}^{a_{1}}\cdots p_{j}^{a_{j}}$ の正規部分群で $Q_{j}\cong P_{1}\times\cdots\times P_{j}$ であることを $j$ の帰納法で示す。$Q_{j-1}$ と $P_{j}$ は正規で、位数が\term[互いに素]{grp:gcd}なので $Q_{j-1}\cap P_{j}=\{e\}$（\ref{grp:coprime-orders-trivial-intersection}）、$Q_{j}=Q_{j-1}P_{j}$ は正規部分群（積の元の共役は共役の積）で位数は積。\ref{grp:internal-direct-product} を群 $Q_{j}$ に使って $Q_{j}\cong Q_{j-1}\times P_{j}$。$j=k$ で位数が $\abs{G}$ なので $Q_{k}=G$。

**Step 4（4⇒1）.** $p$ 群は冪零（\ref{grp:p-group-nilpotent}）。直積 $H\times K$ について、$Z_{i}(H\times K)=Z_{i}(H)\times Z_{i}(K)$ を帰納法で示せば、冪零群の有限直積は冪零（$Z_{c}$ が全体になる $c$ として大きい方をとる）。$i=0$ は明らか。$i$ で成り立てば、\ref{grp:central-series-basic.2} より $(x,y)\in Z_{i+1}(H\times K)\iff$ すべての $(g,h)$ で $([x,g],[y,h])\in Z_{i}(H)\times Z_{i}(K)\iff x\in Z_{i+1}(H)$ かつ $y\in Z_{i+1}(K)$。

::: hypcheck
- **有限**：Step 2 のシローの定理と Step 3 の位数の計算に使った。1⇒2 は無限群でも成り立つ。
- 3⇒4 の Step 3 で「積の元の共役は共役の積」：$g(xy)g^{-1}=(gxg^{-1})(gyg^{-1})$ を使った。
:::
:::

::: supplement
**可解群と方程式.** 「可解」の名は、代数方程式が冪根で解けること（可解性）と、ガロア群が可解群であることが同値であるというガロアの理論から来ている。$S_{5}$ が可解でないこと（上の例 4）から、一般の $5$ 次方程式は冪根で解けない。

**有限冪零群の例.** 有限冪零群は $p$ 群の直積なので、例えば $D_{n}$ が冪零 $\iff n$ が $2$ の冪（$n\ge 3$）であることが、この特徴づけからわかる（$n$ が奇素数 $q$ で割り切れれば、位数 $q$ の元 $r^{n/q}$ と位数 $2$ の元 $s$ は可換でない（$sr^{n/q}s^{-1}=r^{-n/q}\neq r^{n/q}$、$q$ は奇数で $q>2$）。一方 $p$ 群の直積では位数が\term[互いに素]{grp:gcd}な元は別の直積因子に属し可換なので、冪零でない）。
:::

## 問題 {#grp:sec-sn-problems}

::: problem {#grp:prob-pq-solvable}
素数 $p,q$ について、位数 $pq$ の群と位数 $p^{2}q$ の群は可解であることを示せ。
:::

::: solution
位数 $pq$（$p<q$）：シロー $q$ 部分群 $Q$ は正規（\ref{grp:order-pq}）で、$Q$ と $G/Q$（位数 $p$）は可換なので、\ref{grp:solvable-closure.2} より可解。位数 $p^{2}q$（$p\neq q$）：\ref{grp:p2q-not-simple} の証明より、正規なシロー部分群 $P$ があり、$\{\abs{P},\abs{G/P}\}=\{p^{2},q\}$。位数 $p^{2}$ の群は可換（\ref{grp:order-p-squared}）、素数位数の群は巡回群なので、$P$ と $G/P$ はともに可解で、\ref{grp:solvable-closure.2} より $G$ も可解。
:::

::: problem {#grp:prob-q8-nilpotent}
$Q_{8}$ と $D_{4}$ の昇中心列を求め、冪零類が $2$ であることを示せ。
:::

::: solution
$Z(Q_{8})=\{\pm 1\}$（\ref{grp:center} の例）、$Q_{8}/Z(Q_{8})\cong V$ は可換（\ref{grp:prob-q8-mod-center}）なので $Z_{2}=Q_{8}$。$Z_{1}\neq Q_{8}$ なので冪零類は $2$。$D_{4}$ も $Z(D_{4})=\{e,r^{2}\}$ で、$D_{4}/Z(D_{4})$ は位数 $4$ で、$\bar r^{2}=\bar s^{2}=e$ なので $V$ と同型で可換（\ref{grp:prob-order-four}）、$Z_{2}=D_{4}$、冪零類 $2$。
:::

::: problem {#grp:prob-maximal-subgroup-nilpotent}
有限冪零群 $G$ の極大部分群（真部分群で、それを真に含む真部分群がないもの）$M$ は正規で、指数は素数であることを示せ。
:::

::: solution
\ref{grp:finite-nilpotent-sylow.2} より $M\subsetneq N_{G}(M)$ で、$M$ の極大性から $N_{G}(M)=G$、すなわち $M\trianglelefteq G$。$G/M$ は、\ref{grp:correspondence}より自明でない真部分群をもたない群である（$M$ と $G$ の間に部分群がないから）。自明でない真部分群をもたない群は素数位数の巡回群（元 $x\neq e$ について $\ang{x}=G/M$ で、巡回群の部分群の分類 \ref{grp:subgroups-cyclic} から位数は素数）。よって $(G:M)$ は素数。
:::
