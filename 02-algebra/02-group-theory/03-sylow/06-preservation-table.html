# 群の性質の保存表 {#grp:page-preservation-table keywords="preservation of group properties under subgroups, normal subgroups, quotients, direct products, extensions; abelian, cyclic, finite, finitely generated, torsion, torsion-free, p-group, solvable, nilpotent, simple, free"}

可換・巡回・有限・有限生成・可解・冪零・単純・自由などの群の性質が、部分群・正規部分群・剰余群・直積・拡大をとる操作で保たれるかを表にまとめ（\ref{grp:preservation-table}）、部分群や直積についての操作どうしの関係をもう一つの表にまとめる（\ref{grp:operations-table}）。各欄には、保たれるなら証明への参照を、保たれないなら反例への参照を付けた。参照先のない短い主張は \ref{grp:sec-gpt-proofs} で証明する。


## 記法と定義の確認 {#grp:sec-gpt-notation}

::: notation
- 性質：可換（\ref{grp:abelian-group}）、巡回（\ref{grp:cyclic-group}）、$p$ 群（\ref{grp:p-group}。位数 $p^{n}$ の**有限**群）、可解（\ref{grp:solvable-group}）、冪零（\ref{grp:nilpotent-group}）、単純（\ref{grp:simple-group}。自明な群は単純でない）、自由群（\ref{grp:free-group}）。
- 群 $G$ が**有限生成**であるとは、有限個の元で生成されること（\ref{grp:generated-subgroup}）。**捩れ群**（周期群）はすべての元の位数が有限な群、**捩れのない群**は単位元以外の元の位数がすべて無限な群である（\ref{grp:element-order}）。
- 操作：部分群・正規部分群（\ref{grp:normal-subgroup}）・剰余群（\ref{grp:quotient-group}）・直積（\ref{grp:direct-product}。無限個の直積 $\prod_{i}G_{i}$ も成分ごとの積で群になる）・**拡大**：正規部分群 $N\trianglelefteq G$ について、$N$ と $G/N$ がともにその性質をもてば $G$ ももつか（\ref{grp:extension}）。半直積（\ref{grp:semidirect-product}）は拡大の特別な場合である。
- 記号：:yes: はつねに保たれる、:no: は保たれない例がある、:partial: は条件付きで保たれる。「(n)」は \ref{grp:preservation-notes} の番号。「無限直積」は自明でない群の無限個の直積を表す。
:::

::: intuition
表の左半分（部分群・正規部分群・剰余群）は「群を小さくする」操作、右半分（直積・拡大）は「群を大きくする」操作である。

- 可換・可解・冪零・捩れ・有限のような「元についての等式や有限性」の性質は、小さくする操作にはよく伝わる。部分群の元も剰余群の元も、もとの群の元（の像）だからである。
- 有限生成性と自由性は逆向きで、剰余群には「生成元の像」が伝わるが、部分群には伝わらない（部分群は思いのほか複雑になりうる：\ref{grp:gpt-bs}）。
- 拡大で保たれる性質（有限・有限生成・可解・$p$ 群・捩れ）と保たれない性質（可換・巡回・冪零）の違いは、「$N$ と $G/N$ の情報を貼り合わせるだけで決まるか、$N$ と $G/N$ の『相互作用』（作用や共役）にもよるか」である。可解性は「可換な層を積み重ねる」性質なので拡大と相性がよく、可換性・冪零性は層どうしの交換も要求するので拡大では壊れる。
:::

## 各欄の根拠 {#grp:sec-gpt-reasons}

::: remark 表の番号の説明 {#grp:preservation-notes}
1. 可換性は元どうしの等式 $xy=yx$ なので、部分群と（成分ごとの）直積に伝わり、剰余群では $xNyN=xyN=yxN=yNxN$。
2. 対称群 $S_{3}$ と $N=A_{3}$（\ref{grp:alternating-group}）：$A_{3}\cong\Z/3\Z$ と $S_{3}/A_{3}\cong\Z/2\Z$ はどちらも巡回群（したがって可換で冪零）だが、$S_{3}$ は可換でなく、巡回群でなく、冪零でもない（\ref{grp:gpt-s3}）。
3. 巡回群の部分群は巡回群（\ref{grp:subgroups-cyclic.1}：$\ang{a}$ の部分群は $\ang{a^{d}}$ の形）。
4. 生成元の像が剰余群を生成する（$G=\ang{S}$ なら $G/N=\ang{sN:s\in S}$。\ref{grp:generated-subgroup-words} から、$G$ の元は $S$ の元とその逆元の積なので）。
5. $\Z/m\Z\times\Z/n\Z$ が巡回群であることと $\gcd(m,n)=1$ は同値（\ref{grp:chinese-remainder-group}）。無限巡回群を含む直積 $\Z\times\Z$, $\Z\times\Z/n\Z$（$n\ge2$）は巡回群でない（\ref{grp:gpt-free-groups.3} の議論、および捩れのある元をもつことから）。
6. 自明でない群の無限個の直積は非可算集合である（\ref{grp:gpt-uncountable-product}）。一方、有限生成群は可算である（有限集合上の有限列の全体は可算）。したがって無限直積は、有限・有限生成・巡回・$p$ 群のどれでもない。
7. \ref{grp:lagrange}から $\abs{G}=\abs{N}\cdot\abs{G/N}$ で、$\abs{G\times H}=\abs{G}\abs{H}$。
8. バウムスラッグ–ソリター群 $BS(1,2)$ は 2 元で生成されるが、有限生成でない正規部分群 $\Z[1/2]$ を含む（\ref{grp:gpt-bs}）。
9. 有限直積：$d(G\times H)\le d(G)+d(H)$（\ref{grp:min-generators-basic.2}）。拡大：$N$ の生成元と、$G/N$ の生成元の代表を合わせれば $G$ を生成する（\ref{grp:gpt-extensions.1}）。
10. 部分群・直積は元ごとの性質なので明らか（捩れのない群の無限直積も、元 $(g_{i})$ が $e$ でなければある成分 $g_{i}$ が $e$ でなく、その位数が無限なので $(g_{i})$ の位数も無限）。剰余群（捩れ群）と拡大は \ref{grp:gpt-extensions.2}, \ref[3]{grp:gpt-extensions.3}。
11. $\prod_{n\ge1}\Z/n\Z$ の元 $(1,1,1,\dots)$ は位数無限（$k$ 乗が $e$ なら、すべての $n$ で $n\mid k$ となり、$k=0$）。
12. $\Z$ は捩れがないが、剰余群 $\Z/2\Z$ は捩れ群。
13. $p$ 群の部分群・剰余群の位数は $p^{n}$ の約数（ラグランジュ）、直積と拡大の位数は（7）から $p$ の冪。
14. 可解群の部分群・剰余群・有限直積は可解で、$N$ と $G/N$ が可解なら $G$ も可解（\ref{grp:solvable-closure}）。正規部分群は部分群の特別な場合。
15. 可解群の無限直積は、成分の導来長が有界なら可解だが、有界でなければ可解でない（\ref{grp:gpt-solvable-products}）。導来長が上限なく大きくなる有限可解群の列がある（\ref{grp:fact-derived-length}）。
16. 降中心列 $\gamma_{i}$ は部分群・剰余群・有限直積と両立する（\ref{grp:gpt-nilpotent}）。拡大で壊れる例は（2）の $S_{3}$。
17. 二面体群 $D_{2^{n}}$ は冪零（$2$ 群なので：\ref{grp:p-group-nilpotent}）で、冪零類が $n$ 以上である（\ref{grp:gpt-dihedral-class}）。冪零類が有界でない群の無限直積は冪零でない（\ref{grp:gpt-nilpotent.3}）。
18. 部分群：単純群 $A_{5}$（\ref{grp:an-simple}）の部分群 $\{e,(12)(34),(13)(24),(14)(23)\}$ は位数 $4$ の可換群なので、位数 $2$ の部分群が正規で、単純でない。正規部分群と剰余群：単純群 $G$ の正規部分群は $\{e\}$ と $G$、剰余群は $G/G=\{e\}$ と $G/\{e\}\cong G$ だけで、自明な群は単純でないので :no: とした（自明な群を除けば保たれる）。直積：$G\times G$ は正規部分群 $G\times\{e\}$ をもつ。拡大：$\Z/p\Z\times\Z/p\Z$ は単純群 $\Z/p\Z$ の $\Z/p\Z$ による拡大だが単純でない。
19. 自由群の部分群は自由群（ニールセン–シュライアーの定理、\ref{grp:nielsen-schreier}。このサイトでは未証明）。
20. 剰余群 $\Z/2\Z$ は有限で自明でないので自由群でない。$\Z\times\Z$ は可換で巡回群でないので自由群でなく、$\Z$ の $\Z$ による拡大でもある。無限直積 $\Z^{\N}$ も同様（\ref{grp:gpt-free-groups}）。
:::

## 操作どうしの関係 {#grp:sec-gpt-operations}

::: table 部分群・直積についての関係 {#grp:operations-table}
| 関係 | 成立 | 根拠・条件・反例 |
|---|---|---|
| 部分群の共通部分は部分群 | :yes: | \ref{grp:subgroup-intersection} |
| 部分群の和集合は部分群 | :no: | $2\Z\cup3\Z\subseteq\Z$ は $2+3=5$ を含まない。一方が他方を含むときに限り部分群（\ref{grp:gpt-subgroup-ops.1}） |
| 部分群の積 $HK$ は部分群 | :partial: | $HK=KH$ のときに限る（\ref{grp:gpt-subgroup-ops.2}）。一方が正規なら成り立つ（\ref{grp:product-with-normal}）。$S_{3}$ の $\ang{(12)}\ang{(13)}$ は 4 元で部分群でない |
| $\abs{HK}=\abs{H}\abs{K}/\abs{H\cap K}$ | :yes: | \ref{grp:product-formula}（有限の場合） |
| 指数の積 $[G:K]=[G:H][H:K]$ | :yes: | \ref{grp:index-tower} |
| 正規部分群の共通部分・積は正規 | :yes: | \ref{grp:gpt-subgroup-ops.3} |
| 正規部分群の正規部分群は正規（推移性） | :no: | 二面体群 $D_{4}$ の $\ang{s}\trianglelefteq\{e,r^{2},s,r^{2}s\}\trianglelefteq D_{4}$ だが $\ang{s}$ は $D_{4}$ で正規でない（\ref{grp:gpt-subgroup-ops.4}） |
| $(G/N)/(M/N)\cong G/M$ | :yes: | \ref{grp:third-isomorphism} |
| $HN/N\cong H/(H\cap N)$ | :yes: | \ref{grp:second-isomorphism} |
| 直積の中心 $Z(G\times H)=Z(G)\times Z(H)$ | :yes: | \ref{grp:gpt-products.1} |
| 直積の交換子部分群 $[G\times H,G\times H]=[G,G]\times[H,H]$ | :yes: | \ref{grp:gpt-products.2}。したがって可換化も直積と交換する |
| 直積の元の位数 $\ord(g,h)=\lcm(\ord g,\ord h)$ | :yes: | \ref{grp:direct-product-basic.3} |
| 直積のシロー部分群はシロー部分群の直積 | :yes: | \ref{grp:gpt-products.3}（有限群） |
| 直積の部分群は部分群の直積 | :no: | $\Z/p\Z\times\Z/p\Z$ の対角部分群。一般形は\ref{grp:goursat} |
| 直積の正規部分群は正規部分群の直積 | :partial: | 非可換単純群の直積なら :yes:（\ref{grp:normal-subgroups-simple-product}）。可換群では対角部分群が反例 |
| 生成元の最小個数 $d(G\times H)=d(G)+d(H)$ | :partial: | 不等号 $\le$ はつねに成り立つ（\ref{grp:min-generators-basic}）。$\Z/2\Z\times\Z/3\Z\cong\Z/6\Z$ で左辺 $1$、右辺 $2$ |
| 部分群の生成元の個数 $d(H)\le d(G)$ | :partial: | 有限アーベル群なら :yes:（\ref{grp:subgroup-min-generators}）。一般には :no:：$BS(1,2)$（\ref{grp:gpt-bs}）。有限群でも $S_{n}$ の部分群 $(\Z/2\Z)^{\lfloor n/2\rfloor}$ |
:::

## 短い主張の証明 {#grp:sec-gpt-proofs}

::: proposition $S_{3}$ は冪零でない {#grp:gpt-s3 keywords="S3 has trivial center and is not nilpotent" index="S₃ の中心|えすすりーのちゅうしん"}
$S_{3}$ の中心は $\{e\}$ で、$S_{3}$ は可換でも冪零でもない。
:::

::: proof
**Step 1（中心）.** $(12)(13)=(132)$, $(13)(12)=(123)$ なので $(12)$ と $(13)$ は可換でない。同様に、互換はどの他の互換とも可換でなく、$3$ 巡回置換 $(123)$ は $(12)$ と可換でない（$(12)(123)=(23)$, $(123)(12)=(13)$）。$(132)=(123)^{-1}$ も同じ。よって中心は $\{e\}$。

**Step 2（冪零でない）.** 昇中心列は $Z_{1}=Z(S_{3})=\{e\}$ で、帰納的に $Z_{i}=\{e\}$（$Z_{i+1}/Z_{i}=Z(S_{3}/\{e\})$）。冪零なら、ある $c$ で $Z_{c}=S_{3}$ となる（\ref{grp:lower-upper-central}）ので矛盾。
:::

::: proposition 無限直積は非可算 {#grp:gpt-uncountable-product keywords="an infinite product of nontrivial groups is uncountable" index="無限直積の濃度|むげんちょくせきののうど"}
自明でない群の可算無限個の直積 $\prod_{n\ge1}G_{n}$ は非可算である（より多くの因子の直積も、可算個の因子の直積へ全射するので非可算）。
:::

::: proof
各 $n$ で $g_{n}\neq e$ を選ぶ（可算選択公理）。$\{0,1\}$ の列 $\varepsilon$ に、第 $n$ 成分が $g_{n}^{\varepsilon_{n}}$ の元を対応させる写像は単射で、$\{0,1\}^{\N}$ は非可算（対角線論法）。射影 $\prod_{i\in I}G_{i}\to\prod_{n}G_{i_{n}}$（可算個の添字 $i_{n}$ を選ぶ）は全射。
:::

::: proposition 有限生成群の部分群 {#grp:gpt-bs keywords="Baumslag-Solitar group BS(1,2) is 2-generated but contains the non-finitely generated normal subgroup Z[1/2]" index="バウムスラッグ–ソリター群|ばうむすらっぐそりたーぐん"}
$\R$ の変換 $a(x)\defeq x+1$, $b(x)\defeq2x$ で生成される $\Sym(\R)$ の部分群を $G\defeq BS(1,2)$ とする。
1. $G$ の元はすべて $x\mapsto2^{k}x+t$（$k\in\Z$, $t\in\Z[1/2]$）の形で、$k$ を対応させる写像 $\varphi\colon G\to\Z$ は準同型である。
2. $\Ker\varphi$ は加法群 $\Z[1/2]\defeq\{m/2^{j}:m\in\Z,\ j\ge0\}$ と同型で、有限生成でない。
:::

::: proof
**Step 1（1）.** $x\mapsto2^{k}x+t$（$t\in\Z[1/2]$）の形の写像の全体 $A$ は、合成 $(2^{k}x+t)\circ(2^{l}x+u)=2^{k+l}x+(2^{k}u+t)$ と逆写像 $2^{-k}x-2^{-k}t$ で閉じた $\Sym(\R)$ の部分群で、$a,b\in A$ なので $G\subseteq A$。合成の式から $\varphi$ は準同型。

**Step 2（核）.** $\Ker\varphi$ は平行移動 $x\mapsto x+t$ の全体で、$t$ を対応させると $\Z[1/2]$ の部分群と同型。$b^{-n}ab^{n}(x)=2^{-n}(2^{n}x+1)=x+2^{-n}$ なので、核は $2^{-n}$（$n\ge0$）をすべて含み、$\Z[1/2]$ 全体と同型。

**Step 3（有限生成でない）.** $\Z[1/2]$ の有限個の元 $m_{1}/2^{j_{1}},\dots,m_{r}/2^{j_{r}}$ が生成する部分群は $2^{-J}\Z$（$J\defeq\max j_{i}$）に含まれ、$2^{-J-1}$ を含まない（$2^{-J-1}\in2^{-J}\Z$ なら $1/2\in\Z$）。

::: hypcheck
- $\Ker\varphi$ は正規部分群なので、この例は「正規部分群」の欄の反例にもなる。
- 有限群の部分群は有限なので有限生成である。有限生成アーベル群の部分群も有限生成（PID 上の加群の結果、\ref{mod:page-pid-modules}）なので、反例には非可換な無限群が要る。
:::
:::

::: proposition 拡大で保たれる性質 {#grp:gpt-extensions keywords="extensions of finitely generated, torsion, torsion-free groups" index="拡大で保たれる性質|かくだいでたもたれるせいしつ"}
$N\trianglelefteq G$ とする。
1. $N$ と $G/N$ が有限生成なら $G$ も有限生成。
2. 捩れ群の剰余群は捩れ群。$N$ と $G/N$ が捩れ群なら $G$ も捩れ群。
3. $N$ と $G/N$ が捩れのない群なら $G$ も捩れがない。
:::

::: proof
**Step 1（1）.** $N=\ang{n_{1},\dots,n_{r}}$, $G/N=\ang{g_{1}N,\dots,g_{s}N}$ とする。$g\in G$ について $gN$ は $g_{j}N$ とその逆元の積 $g_{j_{1}}^{\pm1}\cdots g_{j_{k}}^{\pm1}N$ に等しい（\ref{grp:generated-subgroup-words}）ので、$g=g_{j_{1}}^{\pm1}\cdots g_{j_{k}}^{\pm1}n$（$n\in N$）と書け、$n$ は $n_{i}^{\pm1}$ の積。よって $G=\ang{g_{1},\dots,g_{s},n_{1},\dots,n_{r}}$。

**Step 2（2）.** $g^{m}=e$ なら $(gN)^{m}=N$。拡大：$g\in G$ について $(gN)^{m}=N$ となる $m\ge1$ があり、$g^{m}\in N$ なので $(g^{m})^{k}=e$ となる $k\ge1$ がある。$g^{mk}=e$。

**Step 3（3）.** $g^{m}=e$（$m\ge1$）とする。$(gN)^{m}=N$ で $G/N$ に捩れがないので $gN=N$、すなわち $g\in N$。$N$ に捩れがないので $g=e$。
:::

::: proposition 冪零性の遺伝 {#grp:gpt-nilpotent keywords="subgroups, quotients and finite products of nilpotent groups are nilpotent" index="冪零群の部分群と剰余群|べきれいぐんのぶぶんぐんとじょうよぐん"}
1. 冪零群の部分群と剰余群は冪零で、冪零類はもとの群の冪零類以下である。
2. 冪零群の有限個の直積は冪零である。
3. 群の族 $(G_{i})$ について、ある $c$ で $\gamma_{c+1}\bigl(\prod_{i}G_{i}\bigr)=\{e\}$ なら、すべての $i$ で $\gamma_{c+1}(G_{i})=\{e\}$。とくに、冪零類が有界でない冪零群の族の直積は冪零でない。
:::

::: proof
**Step 1（部分群）.** $H\le G$ について、$i$ に関する帰納法で $\gamma_{i}(H)\subseteq\gamma_{i}(G)$：$i=1$ は $H\subseteq G$。$\gamma_{i+1}(H)=[\gamma_{i}(H),H]$ は交換子 $[x,h]$（$x\in\gamma_{i}(H)\subseteq\gamma_{i}(G)$, $h\in G$）で生成されるので $[\gamma_{i}(G),G]=\gamma_{i+1}(G)$ に含まれる。

**Step 2（剰余群）.** $\pi\colon G\to G/N$ について、帰納法で $\gamma_{i}(G/N)=\pi[\gamma_{i}(G)]$：交換子の像は像の交換子 $\pi([x,g])=[\pi(x),\pi(g)]$ で、$\pi$ は全射なので、生成元どうしが対応する。$\gamma_{c+1}(G)=\{e\}$ なら $\gamma_{c+1}(G/N)=\{N\}$。

**Step 3（2, 3）.** 直積では交換子が成分ごとに計算される：$[(x_{i}),(g_{i})]=([x_{i},g_{i}])$。帰納法で $\gamma_{k}(\prod G_{i})\subseteq\prod\gamma_{k}(G_{i})$ なので、有限個の直積の冪零類は成分の冪零類の最大値以下。逆に、第 $i$ 成分への埋め込み $\iota_{i}\colon G_{i}\to\prod G_{j}$ は単射準同型なので、Step 1 と同じ議論で $\iota_{i}[\gamma_{k}(G_{i})]=\gamma_{k}(\iota_{i}[G_{i}])\subseteq\gamma_{k}(\prod G_{j})$。$\gamma_{c+1}(\prod G_{j})=\{e\}$ なら $\gamma_{c+1}(G_{i})=\{e\}$。
:::

::: proposition 二面体 2 群の冪零類 {#grp:gpt-dihedral-class keywords="the nilpotency class of the dihedral group of order 2^{n+1} is at least n" index="二面体群の冪零類|にめんたいぐんのべきれいるい"}
$n\ge2$ について、二面体群 $D_{2^{n}}$（位数 $2^{n+1}$）の冪零類は $n$ 以上である。
:::

::: proof
**Step 1.** $D_{2^{n}}$ で $sr^{-a}s^{-1}=sr^{-a}s=(srs)^{-a}=r^{a}$（\ref{grp:dihedral-order} の $srs=r^{-1}$, $s^{2}=e$）なので、$[r^{a},s]=r^{a}sr^{-a}s^{-1}=r^{2a}$。

**Step 2.** $i\ge1$ について $r^{2^{i-1}}\in\gamma_{i}$ を帰納法で示す。$i=1$ は $r\in G$。$r^{2^{i-1}}\in\gamma_{i}$ なら、Step 1 から $r^{2^{i}}=[r^{2^{i-1}},s]\in[\gamma_{i},G]=\gamma_{i+1}$。

**Step 3.** $r$ の位数は $2^{n}$ なので $r^{2^{n-1}}\neq e$ で、Step 2 から $\gamma_{n}\neq\{e\}$。よって冪零類 $c$（$\gamma_{c+1}=\{e\}$ となる最小の $c$）は $n$ 以上。
:::

::: proposition 可解群の無限直積 {#grp:gpt-solvable-products keywords="infinite products of solvable groups with unbounded derived length are not solvable" index="可解群の無限直積|かかいぐんのむげんちょくせき"}
群の族 $(G_{i})$ の直積 $P\defeq\prod_{i}G_{i}$ について、$P^{(k)}\subseteq\prod_{i}G_{i}^{(k)}$ で、各 $i$ について $\iota_{i}[G_{i}^{(k)}]\subseteq P^{(k)}$ である。したがって、$P$ が可解であることと、$G_{i}$ がすべて可解で導来長が有界であることは同値である。
:::

::: proof
**Step 1.** 交換子は成分ごとに計算されるので、帰納法で $P^{(k)}\subseteq\prod_{i}G_{i}^{(k)}$。埋め込み $\iota_{i}$ は準同型なので $\iota_{i}[G_{i}^{(k)}]=(\iota_{i}[G_{i}])^{(k)}\subseteq P^{(k)}$。

**Step 2.** 導来長が $k$ 以下で有界なら $P^{(k)}\subseteq\prod\{e\}=\{e\}$。逆に $P^{(k)}=\{e\}$ なら、Step 1 の後半からすべての $i$ で $G_{i}^{(k)}=\{e\}$。
:::

::: fact 導来長の大きい可解群 {#grp:fact-derived-length keywords="finite solvable groups of arbitrarily large derived length, Sylow p-subgroups of symmetric groups" index="導来長|どうらいちょう"}
任意の $k$ について、導来長がちょうど $k$ の有限 $p$ 群がある。たとえば、対称群 $S_{p^{k}}$ のシロー $p$ 部分群（位数 $p$ の巡回群の $k$ 重のリース積）の導来長は $k$ であることが知られている（出典：D. J. S. Robinson, *A Course in the Theory of Groups*）。
:::

::: proposition 自由群についての反例 {#grp:gpt-free-groups keywords="quotients, products and extensions of free groups need not be free; Z x Z is not free" index="自由群の直積|じゆうぐんのちょくせき"}
1. 自由群は、自明な群か無限群である。とくに $\Z/2\Z$（$\Z$ の剰余群）は自由群でない。
2. 階数 $2$ 以上の自由群は可換でない。
3. $\Z\times\Z$ は自由群でない。とくに、自由群 $\Z$ の $\Z$ による拡大は自由群とは限らず、自由群の有限直積・無限直積も自由群とは限らない。
:::

::: proof
**Step 1（1）.** 自由群 $F(X)$ で $X\neq\emptyset$ なら、$x\in X$ の冪 $x^{n}$（$n\in\Z$）は相異なる簡約語（\ref{grp:reduced-word}）なので、$F(X)$ は無限群。

**Step 2（2）.** 異なる $x,y\in X$ について $xy$ と $yx$ は異なる簡約語なので $xy\neq yx$。

**Step 3（3）.** $\Z\times\Z\cong F(X)$ とすると、可換なので 2 から $\abs{X}\le1$ で、$F(X)$ は自明な群か $\Z$ と同型（どちらも巡回群）。しかし $\Z\times\Z$ は巡回群でない：生成元 $(a,b)$ の倍数 $(ka,kb)$ が $(1,0)$ と $(0,1)$ をともに表すなら、$ka=1$ から $a=\pm1$, $kb=0$ から $b=0$ だが、$(0,1)=(k'a,k'b)$ から $k'a=0$ で $k'=0$ となり $0=1$。$\Z\times\Z$ は $\Z\times\{0\}$ による $\Z$ の拡大で、無限直積 $\Z^{\N}$ も可換で巡回群でない（非可算：\ref{grp:gpt-uncountable-product}）ので自由群でない。
:::

::: proposition 部分群の演算 {#grp:gpt-subgroup-ops keywords="union of subgroups, product of subgroups, intersection and product of normal subgroups, normality is not transitive" index="部分群の和集合|ぶぶんぐんのわしゅうごう, 正規性の推移性|せいきせいのすいいせい"}
$H,K\le G$ とする。
1. $H\cup K$ が部分群であることと、$H\subseteq K$ または $K\subseteq H$ は同値。
2. $HK$ が部分群であることと、$HK=KH$ は同値。
3. $H,K\trianglelefteq G$ なら $H\cap K\trianglelefteq G$, $HK\trianglelefteq G$。
4. 二面体群 $D_{4}$ で、$K\defeq\{e,s\}$, $H\defeq\{e,r^{2},s,r^{2}s\}$ とすると、$K\trianglelefteq H\trianglelefteq D_{4}$ だが $K$ は $D_{4}$ で正規でない。
:::

::: proof
**Step 1（1）.** 包含関係があれば和集合は大きい方。逆に $h\in H\setminus K$, $k\in K\setminus H$ があるとき、$hk\in H$ なら $k=h^{-1}(hk)\in H$、$hk\in K$ なら $h\in K$ でどちらも矛盾するので、$hk\notin H\cup K$ で部分群でない。

**Step 2（2）.** $HK$ が部分群なら、逆元をとって $HK=(HK)^{-1}=K^{-1}H^{-1}=KH$。逆に $HK=KH$ なら、$(h_{1}k_{1})(h_{2}k_{2})=h_{1}(k_{1}h_{2})k_{2}=h_{1}(h'k')k_{2}\in HK$、$(hk)^{-1}=k^{-1}h^{-1}\in KH=HK$ で、部分群の判定（\ref{grp:subgroup-criterion}）から部分群。

**Step 3（3）.** $g(H\cap K)g^{-1}\subseteq gHg^{-1}\cap gKg^{-1}=H\cap K$。$HK$ は部分群（\ref{grp:product-with-normal}）で、$ghkg^{-1}=(ghg^{-1})(gkg^{-1})\in HK$。

**Step 4（4）.** \ref{grp:dihedral-order} から $D_{4}$ の位数は $8$ で、$sr=r^{-1}s$。$H$ は $r^{2}$ と $s$ が可換（$sr^{2}s^{-1}=r^{-2}=r^{2}$）なので $\{e,r^{2}\}\times\{e,s\}$ と同型な位数 $4$ の部分群。$[D_{4}:H]=2$ で、指数 $2$ の部分群は正規（左剰余類も右剰余類も $H$ とその補集合：\ref{grp:normal-equivalent}）。$K$ は $H$ で指数 $2$ なので $H$ で正規。一方 $rsr^{-1}=r(sr^{-1})=r(rs)=r^{2}s\notin K$ なので、$K$ は $D_{4}$ で正規でない。
:::

::: proposition 直積の中心・交換子部分群・シロー部分群 {#grp:gpt-products keywords="center, commutator subgroup and Sylow subgroups of a direct product" index="直積の中心|ちょくせきのちゅうしん"}
1. $Z(G\times H)=Z(G)\times Z(H)$。
2. $[G\times H,G\times H]=[G,G]\times[H,H]$。
3. $G,H$ が有限群なら、$G\times H$ のシロー $p$ 部分群は $P\times Q$（$P\in\mathrm{Syl}_{p}(G)$, $Q\in\mathrm{Syl}_{p}(H)$）の形のものですべてである。
:::

::: proof
**Step 1（1）.** $(g,h)$ が $(x,y)$ と可換 $\iff$ $gx=xg$ かつ $hy=yh$。すべての $(x,y)$ について成り立つことは $g\in Z(G)$ かつ $h\in Z(H)$ と同値。

**Step 2（2）.** $[(g,h),(g',h')]=([g,g'],[h,h'])$ なので、左辺の生成元は右辺に入る。逆に $([g,g'],e)=[(g,e),(g',e)]$ と $(e,[h,h'])$ は左辺に入り、これらは右辺を生成する。

**Step 3（3）.** $\abs{G}=p^{a}m$, $\abs{H}=p^{b}n$（$p\nmid mn$）とすると $\abs{G\times H}=p^{a+b}mn$ で、$\abs{P\times Q}=p^{a+b}$ なので $P\times Q$ はシロー $p$ 部分群。シロー部分群は互いに共役（\tref{grp:sylow-conjugacy}）で、$(g,h)(P\times Q)(g,h)^{-1}=gPg^{-1}\times hQh^{-1}$ も同じ形なので、すべてのシロー $p$ 部分群がこの形である。
:::

::: supplement
**多様体（群の多様体）.** 可換群・冪零類 $c$ 以下の群・導来長 $k$ 以下の群のように「すべての元が決まった等式（恒等式）をみたす群」の族は、部分群・剰余群・任意個の直積で閉じている。逆に、この三つの操作で閉じた群の族は恒等式で定義される（バーコフの定理：普遍代数の一般論）。表で「冪零」「可解」の無限直積が :no: なのは、冪零類・導来長を固定しない「冪零群全体」「可解群全体」が恒等式で定義できないことに対応している。

**高い視点.** 拡大の欄で可換性と冪零性が壊れることは、群のコホモロジーの言葉では、拡大が $N$ と $G/N$ だけでなく作用と 2 コサイクル（拡大の類）で決まることの反映である（\ref{grp:split-extension}）。
:::

## 問題 {#grp:sec-gpt-problems}

::: problem {#grp:prob-gpt-extension-abelian}
$N\trianglelefteq G$ で $N\subseteq Z(G)$（中心拡大）、$G/N$ が巡回群なら、$G$ は可換であることを示せ。これは表の「可換・拡大」の :no: を、どんな条件で :yes: にできるかの一例である。
:::

::: solution
$G/N=\ang{gN}$ とすると、$G$ の元は $g^{i}n$（$n\in N$）の形。$N$ は中心に入るので $(g^{i}n)(g^{j}m)=g^{i+j}nm=(g^{j}m)(g^{i}n)$。（\ref{grp:center-quotient-cyclic} と同じ議論。）
:::

::: problem {#grp:prob-gpt-torsion-subgroup}
可換群 $A$ について、位数有限の元の全体 $T(A)$ は部分群で、$A/T(A)$ は捩れのない群であることを示せ。非可換群では位数有限の元の全体が部分群とは限らないことを、$\R^{2}$ の二つの折り返しで生成される群で確かめよ。
:::

::: solution
$a^{m}=e$, $b^{n}=e$ なら $(ab^{-1})^{mn}=a^{mn}b^{-mn}=e$（可換性）なので $T(A)$ は部分群。$(aT(A))^{m}=T(A)$ なら $a^{m}\in T(A)$ で $(a^{m})^{k}=e$ となり $a\in T(A)$。非可換の例：$\R^{2}$ の直線 $x=0$ と $x=1$ での折り返し $\sigma_{0}(x,y)=(-x,y)$, $\sigma_{1}(x,y)=(2-x,y)$ はどちらも位数 $2$ だが、$\sigma_{1}\sigma_{0}(x,y)=(x+2,y)$ は位数無限の平行移動。
:::
