# 群のコホモロジー（Cohomology of Groups）

群のコホモロジーとホモロジー、巡回群の計算、シャピロの補題・制限・余制限・インフレーション、群の拡大と H²、テイトのコホモロジーとエルブラン商、カップ積とヒルベルトの定理 90。Brown・Serre に対応。

<p class="mn-msc">MSC2020: 20J06, 12G05</p>
