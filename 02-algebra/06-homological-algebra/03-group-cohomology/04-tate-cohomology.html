# テイトのコホモロジー {#ha:page-tate-cohomology keywords="norm map N_G, complete resolution, construction from the bar resolution and its dual, Tate cohomology groups H^n_T(G, M) for n in Z, H^0_T = M^G / N M, H^{-1}_T = ker N / I_G M, long exact sequence in all degrees, periodicity for cyclic groups, Herbrand quotient, multiplicativity, Herbrand quotient of finite modules is 1, h(Z) = |G|"}

有限群 $G$ のコホモロジー $H^{n}(G,M)$（$n\ge0$）とホモロジー $H_{n}(G,M)$ は、ノルム写像 $N:M\to M$, $m\mapsto\sum_{g}gm$ を介して 1 本の列に貼り合わせることができる。これが**テイトのコホモロジー** $\hat H^{n}(G,M)$（$n\in\Z$）で、$\hat H^{0}=M^{G}/NM$, $\hat H^{-1}=\ker N/I_{G}M$ を間にはさんで、全次数にわたる長完全列をもつ。このページでは、棒分解とその双対を貼り合わせて**完全分解**を構成し、テイトのコホモロジーを定義して低次の項を計算する。巡回群ではテイトのコホモロジーは周期 2 で繰り返し、その 2 つの値の位数の比（**エルブラン商**）が短完全列について乗法的で、有限加群では $1$ になることを示す。エルブラン商は類体論でノルム群の指数を計算する主要な道具である。

## 記法と定義の確認 {#ha:sec-tc-notation}

::: notation
- $G$ は有限群、$N\defeq\sum_{g\in G}g\in\Z G$、$N_{M}:M\to M$ はその作用。$N_{M}(M)\subseteq M^{G}$, $I_{G}M\subseteq\ker N_{M}$。
- 群のコホモロジー、巡回群の周期的な分解、棒分解 $B_{n}$（$\Z G$ 加群として $[g_{1}|\cdots|g_{n}]$ を基底とする自由加群、$\partial[g]=g[\,]-[\,]$）は \ref{ha:page-group-cohomology}, \ref{cat:bar-faces} のとおり。
- 鎖複体の短完全列のホモロジーの長完全列は \ref{ha:long-exact-sequence}。
- 体系は $\ZF$。
:::

## 完全分解 {#ha:sec-tc-complete}

::: definition 完全分解とテイトのコホモロジー {#ha:tate-cohomology-def keywords="complete resolution: exact complex X of projective ZG-modules with X_{>=0} -> Z a resolution and Z = im(X_0 -> X_{-1}); Tate cohomology H^n_T(G, M) = H^n(Hom_G(X, M))" index="テイトのコホモロジー|ていとのこほもろじー, 完全分解|かんぜんぶんかい" refname="テイトのコホモロジー"}
射影的 $\Z G$ 加群の完全な複体 $X=(X_{n},\partial_{n}:X_{n}\to X_{n-1})_{n\in\Z}$ で、$\partial_{0}:X_{0}\to X_{-1}$ が $X_{0}\xrightarrow{\varepsilon}\Z\xrightarrow{\eta}X_{-1}$（$\varepsilon$ 全射、$\eta$ 単射）と分解し、$\cdots\to X_{1}\to X_{0}\xrightarrow{\varepsilon}\Z\to0$ が射影分解であるものを**完全分解**という。$G$ 加群 $M$ について
$$\hat H^{n}(G,M)\defeq H^{n}\bigl(\mathrm{Hom}_{\Z G}(X_{\bullet},M)\bigr)\qquad(n\in\Z)$$
（$n$ 次の項 $\mathrm{Hom}_{\Z G}(X_{n},M)$）を**テイトのコホモロジー**という。
:::

::: intuition
通常の射影分解は右に $\Z$ で止まるが、完全分解はそこから左右に無限に延びる。右半分がコホモロジーを、左半分（双対）がホモロジーを与え、その継ぎ目にノルム写像が現れる。
:::

::: theorem 完全分解の存在と低次の項 {#ha:tate-low-degrees keywords="the bar resolution spliced with its Z-dual is a complete resolution; H^n_T = H^n for n >= 1, H^0_T = M^G / N M, H^{-1}_T = ker N / I_G M; long exact sequence in all degrees" index="テイトのコホモロジーの低次の項|ていとのこほもろじーのていじのこう"}
1. $X_{n}\defeq B_{n}$（$n\ge0$）、$X_{-n-1}\defeq B_{n}^{\ast}\defeq\mathrm{Hom}_{\Z}(B_{n},\Z)$（$(g\varphi)(x)\defeq\varphi(g^{-1}x)$、$n\ge0$）とし、負の次数の微分を $\partial^{\ast}$、$\partial_{0}\defeq\varepsilon^{\ast}\circ\varepsilon$ とすると、$X$ は自由加群からなる完全分解である。
2. $n\ge1$ で $\hat H^{n}(G,M)=H^{n}(G,M)$、$\hat H^{0}(G,M)=M^{G}/N_{M}M$、$\hat H^{-1}(G,M)=\ker N_{M}/I_{G}M$。
3. 短完全列 $0\to M'\to M\to M''\to0$ から、すべての $n\in\Z$ にわたる長完全列 $\cdots\to\hat H^{n}(G,M')\to\hat H^{n}(G,M)\to\hat H^{n}(G,M'')\to\hat H^{n+1}(G,M')\to\cdots$ が得られる。
:::

::: intuition
棒分解の右に、その双対を鏡に映したように貼り付けると、両側に無限に延びる完全な複体ができる。継ぎ目の写像はノルム $N$ を掛けることで、そこから $\hat H^{0}=M^{G}/NM$ と $\hat H^{-1}=\ker N/I_{G}M$ が現れる。
:::

::: proof
**Step 1（双対は自由加群）.** 【主張：$B_{n}^{\ast}$ は有限階数の自由加群】$G$ は有限なので $B_{n}$ は有限階数の自由 $\Z G$ 加群。$\Z G^{\ast}=\mathrm{Hom}_{\Z}(\Z G,\Z)$ の双対基底 $h^{\ast}$ について $g\cdot h^{\ast}=(gh)^{\ast}$ なので、$h^{\ast}\mapsto h$ は $G$ 加群の同型 $\Z G^{\ast}\cong\Z G$。よって $B_{n}^{\ast}$ も有限階数の自由加群。

**Step 2（1：完全性）.** 【主張：$X$ は完全】$\cdots\to B_{1}\to B_{0}\to\Z\to0$ は自由アーベル群の完全列なので、アーベル群として分裂し、$\mathrm{Hom}_{\Z}(-,\Z)$ を施した $0\to\Z\to B_{0}^{\ast}\to B_{1}^{\ast}\to\cdots$ も完全。継ぎ目では、$\varepsilon^{\ast}$ が単射で $\varepsilon$ が全射なので $\ker\partial_{0}=\ker\varepsilon=\operatorname{im}\partial_{1}$, $\operatorname{im}\partial_{0}=\operatorname{im}\varepsilon^{\ast}=\ker(B_{0}^{\ast}\to B_{1}^{\ast})$。

**Step 3（2：$n\ge1$）.** 【主張：$\hat H^{n}=H^{n}$】$X_{\ge0}$ は $\Z$ の射影分解なので、$n\ge1$ の項は $\mathrm{Ext}^{n}_{\Z G}(\Z,M)$ の計算と同じ。

**Step 4（2：$\hat H^{0}$）.** 【主張：$\hat H^{0}=M^{G}/NM$】$B_{0}=\Z G$（基底 $[\,]=1$）、Step 1 の同一視で $B_{0}^{\ast}\cong\Z G$、$\varepsilon^{\ast}(1)=\sum_{h}h^{\ast}\leftrightarrow N$。よって $\partial_{0}:\Z G\to\Z G$ は $x\mapsto\varepsilon(x)N=xN$。$\mathrm{Hom}_{\Z G}(\Z G,M)\cong M$（$1$ での値）で、$\partial_{0}$ から誘導される写像は $m\mapsto Nm$。0 次の余輪体は $\partial_{1}$ の像 $I_{G}$ で消えるもの、すなわち $M^{G}$。余境界は $N_{M}M$。

**Step 5（2：$\hat H^{-1}$）.** 【主張：$\hat H^{-1}=\ker N/I_{G}M$】$-1$ 次の余輪体は $\mathrm{Hom}(X_{-1},M)\cong M$ の中で $\partial_{0}$ から誘導される写像 $m\mapsto Nm$ の核 $\ker N_{M}$。余境界は $\psi\in\mathrm{Hom}_{\Z G}(B_{1}^{\ast},M)$ について $\psi(\partial_{1}^{\ast}(1^{\ast}))$ の全体。$B_{1}$ のアーベル群としての基底 $h[g]$ について $(\partial_{1}^{\ast}1^{\ast})(h[g])=1^{\ast}(hg-h)=[hg=1]-[h=1]$ なので、$\partial_{1}^{\ast}1^{\ast}=\sum_{g}\bigl((g^{-1}[g])^{\ast}-[g]^{\ast}\bigr)=\sum_{g}(g^{-1}-1)\cdot[g]^{\ast}$。$m_{g}\defeq\psi([g]^{\ast})$ は自由に選べるので、余境界の全体は $\sum_{g}(g^{-1}-1)M=I_{G}M$。

**Step 6（3）.** 【主張：長完全列】$X_{n}$ は射影的なので $\mathrm{Hom}_{\Z G}(X_{n},-)$ は完全で、余鎖複体の短完全列 $0\to\mathrm{Hom}(X,M')\to\mathrm{Hom}(X,M)\to\mathrm{Hom}(X,M'')\to0$ を与える。\ref{ha:long-exact-sequence}（余鎖複体版）から長完全列。
:::

::: fact 完全分解の一意性と負の次数 {#ha:tate-independence keywords="Tate cohomology does not depend on the complete resolution; H^{-n-1}_T(G, M) = H_n(G, M) for n >= 1; H^n_T(G, CoInd M) = 0 for all n" index="テイトのコホモロジーの一意性|ていとのこほもろじーのいちいせい"}
1. $\hat H^{n}(G,M)$ は完全分解の選び方によらない（2 つの完全分解は、$\Z$ の上の恒等写像を持ち上げる鎖ホモトピー同値で結ばれる）。
2. $n\ge1$ で $\hat H^{-n-1}(G,M)\cong H_{n}(G,M)$。
3. 余誘導加群 $\operatorname{CoInd}_{1}^{G}B$ について、すべての $n\in\Z$ で $\hat H^{n}=0$。

（Br VI §3–5、Se VIII §1。ここでは証明しない。3 は $n\ge1$ で\ref{ha:shapiro-lemma}、$n=0,-1$ で 2 の計算から直接確かめられる。）
:::

## 巡回群とエルブラン商 {#ha:sec-tc-cyclic}

::: theorem 巡回群のテイトのコホモロジー {#ha:tate-cyclic keywords="for G cyclic with generator sigma: H^{2k}_T = M^G / N M and H^{2k+1}_T = ker N / (sigma - 1) M for all k in Z; the long exact sequence becomes an exact hexagon" index="巡回群のテイトのコホモロジー|じゅんかいぐんのていとのこほもろじー" refname="巡回群のテイトのコホモロジー"}
$G=\langle\sigma\rangle$ を位数 $m$ の巡回群とする。
1. すべての $k\in\Z$ で $\hat H^{2k}(G,M)\cong M^{G}/N_{M}M$, $\hat H^{2k+1}(G,M)\cong\ker N_{M}/(\sigma-1)M$。
2. 短完全列 $0\to M'\to M\to M''\to0$ から完全な六角形
$$\hat H^{0}(M')\to\hat H^{0}(M)\to\hat H^{0}(M'')\to\hat H^{1}(M')\to\hat H^{1}(M)\to\hat H^{1}(M'')\to\hat H^{0}(M')$$
が得られる（最後の写像で最初に戻る）。
:::

::: intuition
巡回群の周期的な分解は両側に延ばしても周期的なままなので、テイトのコホモロジーは全次数で 2 つの値を交互にとる。長完全列は 6 項で一周する六角形に縮む。
:::

::: proof
**Step 1（周期的な完全分解）.** 【主張：周期的な完全分解がある】\ref{ha:cyclic-periodic-resolution} の分解を両側に延ばした $\cdots\xrightarrow{N}\Z G\xrightarrow{\sigma-1}\Z G\xrightarrow{N}\Z G\xrightarrow{\sigma-1}\cdots$（$X_{n}=\Z G$、$\partial_{n}$ は $n$ が奇数で $\sigma-1$、偶数で $N$。$\partial_{0}=N=\eta\circ\varepsilon$, $\eta(1)=N$）は完全分解（完全性は同じ証明）。\ref{ha:tate-independence} の 1 からこれで計算してよい。

**Step 2（1）.** 【主張：各次数の値】$\mathrm{Hom}(\Z G,M)\cong M$ で、余鎖複体は $\cdots\xrightarrow{\sigma-1}M\xrightarrow{N}M\xrightarrow{\sigma-1}M\xrightarrow{N}\cdots$。偶数次は $\ker(\sigma-1)/\operatorname{im}N$、奇数次は $\ker N/\operatorname{im}(\sigma-1)$。

**Step 3（2）.** 【主張：六角形】\ref{ha:tate-low-degrees} の 3 の長完全列で、1 から $\hat H^{2}\cong\hat H^{0}$ と同一視する（周期的な完全分解では同一視は自然で、連結準同型とも両立する）。
:::

::: definition エルブラン商 {#ha:herbrand-quotient-def keywords="Herbrand quotient h(M) = |H^0_T(G, M)| / |H^1_T(G, M)| for G cyclic when both are finite" index="エルブラン商|えるぶらんしょう" refname="エルブラン商"}
$G$ を巡回群とする。$\hat H^{0}(G,M)$, $\hat H^{1}(G,M)$ がともに有限のとき、**エルブラン商**を $h(M)\defeq\abs{\hat H^{0}(G,M)}/\abs{\hat H^{1}(G,M)}$ とする。
:::

::: intuition
巡回群のテイトのコホモロジーは 2 つの値しかとらないので、その「比」は加群の大きさの尺度になる。六角形の完全列のおかげで、比は短完全列について掛け算的に振る舞い、有限の誤差（有限加群）では変わらない。
:::

::: theorem エルブラン商の性質 {#ha:herbrand-quotient-properties keywords="h is multiplicative in short exact sequences when two of the three are defined; h(M) = 1 for finite M; h(Z) = |G| for trivial action; if M' has finite index in M then h(M') = h(M)" index="エルブラン商の性質|えるぶらんしょうのせいしつ" refname="エルブラン商の性質"}
$G$ を位数 $m$ の巡回群とする。
1. $0\to M'\to M\to M''\to0$ が完全で、3 つのうち 2 つのエルブラン商が定義されるなら、残りも定義され、$h(M)=h(M')h(M'')$。
2. $M$ が有限なら $h(M)=1$。
3. $h(\Z)=m$（自明な作用）。
4. $M'\subseteq M$ が有限指数の部分加群なら $h(M')=h(M)$（一方が定義されれば他方も）。
:::

::: intuition
六角形の完全列では、各項の大きさが前後の像の大きさの積になるので、交代積が $1$ になる。これが乗法性で、有限加群は自己準同型の核と余核が同じ大きさなので比が $1$ になる。
:::

::: proof
**Step 1（1）.** 【主張：乗法性】六角形（\ref{ha:tate-cyclic} の 2）の各項を $A_{1},\dots,A_{6}$、像を $I_{j}$ とすると、完全性から $\abs{A_{j}}=\abs{I_{j-1}}\abs{I_{j}}$（$I_{j-1}$ は $A_{j}$ に入る写像の像＝核、$I_{j}$ は出る写像の像）。2 つが有限なら、六角形の完全性から残りの項も有限（有限群の間に挟まれた項は、核と像が有限）。交代積 $\frac{\abs{A_{1}}\abs{A_{3}}\abs{A_{5}}}{\abs{A_{2}}\abs{A_{4}}\abs{A_{6}}}=1$（各 $\abs{I_{j}}$ が分子と分母に 1 回ずつ現れる）で、$A_{1},A_{2},A_{3}=\hat H^{0}(M'),\hat H^{0}(M),\hat H^{0}(M'')$、$A_{4},A_{5},A_{6}=\hat H^{1}(M'),\hat H^{1}(M),\hat H^{1}(M'')$ を代入すると $\frac{h(M')h(M'')}{h(M)}=1$。

**Step 2（2）.** 【主張：有限加群で $h=1$】有限群の自己準同型 $f$ では $\abs{\ker f}=\abs{\operatorname{coker}f}$（$\abs{\ker f}\abs{\operatorname{im}f}=\abs M$）。$\abs{\hat H^{0}}=\abs{M^{G}}/\abs{NM}=\abs{\ker(\sigma-1)}\cdot\frac{\abs{\ker N}}{\abs M}$、$\abs{\hat H^{1}}=\abs{\ker N}/\abs{(\sigma-1)M}=\abs{\ker N}\cdot\frac{\abs{\ker(\sigma-1)}}{\abs M}$。比は $1$。

**Step 3（3）.** 【主張：$h(\Z)=m$】$\hat H^{0}(\Z)=\Z/m\Z$, $\hat H^{1}(\Z)=\ker(m)/0=0$。

**Step 4（4）.** 【主張：有限指数の部分加群】$0\to M'\to M\to M/M'\to0$ に 1 と 2 を使う。
:::

::: example
1. $G=C_{2}$, $M=\Z^{-}$（$-1$ 倍で作用）：$\hat H^{0}=M^{G}/NM=0$, $\hat H^{1}=\ker N/(\sigma-1)M=\Z/2\Z$ なので $h=\frac12$。
2. $L/K$ を局所体の $n$ 次不分岐拡大、$G=\operatorname{Gal}(L/K)$ とする。$0\to U_{L}\to L^{\times}\xrightarrow{v}\Z\to0$ と 1 から $h(L^{\times})=h(U_{L})\,h(\Z)=n\,h(U_{L})$。$\hat H^{0}(G,U_{L})=U_{K}/N(U_{L})=1$（\ref{nt:unramified-norm-group}）で、$\hat H^{1}(G,U_{L})=1$ も成り立つことが知られている（Se V §2）ので $h(U_{L})=1$。ヒルベルトの定理 90（$\hat H^{1}(G,L^{\times})=1$）と合わせると $\abs{K^{\times}/N(L^{\times})}=\abs{\hat H^{0}(G,L^{\times})}=n$ で、\ref{nt:unramified-norm-group} の直接の計算と一致する。
:::

::: hypcheck
- **完全分解の存在**：$G$ が有限であることは、$B_{n}$ が有限階数で双対も自由になること（Step 1）と、ノルム $N$ が有限和であることに使った。
- **エルブラン商**：$G$ が巡回群であることは、テイトのコホモロジーが 2 つの値しかとらないこと（周期性）に本質的。
- **有限加群**：有限性は、自己準同型の核と余核が同じ大きさであることに使った。
:::

## 問題 {#ha:sec-tc-problems}

::: problem {#ha:prob-tc-zg}
$M=\Z G$（$G$ 有限）について $\hat H^{0}(G,\Z G)=0$, $\hat H^{-1}(G,\Z G)=0$ を直接確かめよ。
:::

::: solution
$(\Z G)^{G}=\Z N$（すべての係数が等しい元）で、$N\cdot\Z G=\Z N$（$Nx=\varepsilon(x)N$）なので $\hat H^{0}=0$。$\ker N=\{x:\varepsilon(x)=0\}=I_{G}$ で、$I_{G}\cdot\Z G=I_{G}$ なので $\hat H^{-1}=0$。
:::

::: problem {#ha:prob-tc-herbrand-z-minus}
$G=C_{2}$ について、$0\to\Z^{-}\to\Z G\to\Z\to0$（$1\mapsto\sigma-1$, $\Z G\xrightarrow{\varepsilon}\Z$）が完全であることを確かめ、エルブラン商の乗法性 $h(\Z G)=h(\Z^{-})h(\Z)$ を確かめよ。
:::

::: solution
$\sigma(\sigma-1)=1-\sigma=-(\sigma-1)$ なので $\Z(\sigma-1)\cong\Z^{-}$ で、それが $\ker\varepsilon=I_{G}$。$h(\Z^{-})=\frac12$（例 1）、$h(\Z)=2$、$h(\Z G)=1$（前問）。$\frac12\cdot2=1$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 低次の項の計算（2）は棒分解の 0 次と 1 次だけを使い、群の構造を使わない。

**前提を変えると.**
- テイトのコホモロジーにもカップ積があり、$\hat H^{\ast}(G,\Z)$ の元とのカップ積で次数をずらせる。巡回群の周期性は、$\hat H^{2}(G,\Z)\cong\Z/m$ の生成元とのカップ積で与えられる（\ref[カップ積とガロアコホモロジー]{ha:page-cup-products-galois}）。
- **テイト–中山の定理**：$\hat H^{2}(G,C)$ が適当な条件を満たす類 $u$ をもつと、$u$ とのカップ積が $\hat H^{n}(G,\Z)\cong\hat H^{n+2}(G,C)$ を与える。$n=-2$ で $G^{\mathrm{ab}}\cong\hat H^{0}(G,C)=C^{G}/NC$ となり、これが類体論の相互法則の形である（Se IX §8）。

**高い視点から：安定化されたコホモロジー.** テイトのコホモロジーは、射影加群をすべて「$0$ と同じ」とみなした安定圏（安定加群圏）での Hom 群で、ホモロジーとコホモロジーを 1 つの三角圏の中で統一する。有限群の表現論では、この安定圏の構造が群のコホモロジー環で制御される、と知られている。比喩で言えば、通常のコホモロジーは片側に壁がある部屋（$\Z$ で止まる分解）での振動の記録で、テイトのコホモロジーは壁を取り払って両側に無限に続く廊下での振動の記録である。巡回群では廊下の振動は周期 2 で、エルブラン商はその 1 周期分の「振幅の比」にあたる。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{ha:sec-tc-exercises} にまとめた。
