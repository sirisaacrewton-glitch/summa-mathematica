# 演習：群のコホモロジー {#ha:page-exercises-group-cohomology keywords="exercises, group cohomology, cyclic groups, abelianization, Shapiro, restriction, corestriction, extensions, Tate cohomology, Hilbert 90"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#ha:sec-exgc-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 群のコホモロジー {#ha:sec-gc-exercises}

対応するページ：\ref{ha:page-group-cohomology}

::: problem ★ 基本：$H^{n}(C_{3},\Z/3)$ {#ha:ex-gc-c3}
$C_{3}$ が $\Z/3$ に自明に作用するとき、$H^{n}(C_{3},\Z/3)$ をすべて求めよ。
:::

::: solution
自明な作用で $\sigma-1=0$, $N=3=0$。\ref{ha:cyclic-cohomology} から $H^{0}=\Z/3$、奇数次 $\ker N/0=\Z/3$、正の偶数次 $M^{G}/NM=\Z/3$。すべての $n\ge0$ で $\Z/3$。
:::

::: problem ★★ 標準：アーベル化の計算 {#ha:ex-gc-h1-examples}
$H_{1}(S_{3},\Z)$ と、四元数群 $Q_{8}$ の $H_{1}(Q_{8},\Z)$ を求めよ。
:::

::: solution
\ref{ha:h1-abelianization} から $H_{1}=G^{\mathrm{ab}}$。$[S_{3},S_{3}]=A_{3}$ なので $S_{3}^{\mathrm{ab}}\cong\Z/2$。$Q_{8}$ の交換子群は $\{\pm1\}$ で、$Q_{8}/\{\pm1\}\cong(\Z/2)^{2}$。
:::

## 群の取り替え {#ha:sec-cg-exercises}

対応するページ：\ref{ha:page-change-of-groups}

::: problem ★★ 標準：$H^{2}(G,\Z)$ と指標 {#ha:ex-cg-h2-z}
有限群 $G$ について $H^{2}(G,\Z)\cong\mathrm{Hom}(G,\mathbb{Q}/\Z)$（自明な作用）を示し、$H^{2}(S_{3},\Z)$ を求めよ。
:::

::: solution
$0\to\Z\to\mathbb{Q}\to\mathbb{Q}/\Z\to0$ の長完全列（\ref{ha:group-cohomology-basic} の 2）で、$H^{n}(G,\mathbb{Q})=0$（$n\ge1$。\ref{ha:cor-res-index} の 3 で $\abs G$ 倍が $0$、一方 $\mathbb{Q}$ では $\abs G$ 倍は同型）なので、$H^{1}(G,\mathbb{Q}/\Z)\cong H^{2}(G,\Z)$。自明な作用では $H^{1}=\mathrm{Hom}$（同 4）。$S_{3}$ の準同型 $S_{3}\to\mathbb{Q}/\Z$ は $S_{3}^{\mathrm{ab}}\cong\Z/2$ を経由するので、$H^{2}(S_{3},\Z)\cong\Z/2$。
:::

::: problem ★★ 標準：シロー部分群と消滅 {#ha:ex-cg-sylow-vanishing}
有限群 $G$ と $G$ 加群 $M$ について、すべての素数 $p$ でシロー $p$ 部分群 $P$ の $H^{n}(P,M)$ が $0$ なら、$H^{n}(G,M)=0$（$n\ge1$）であることを示せ。
:::

::: solution
$H^{n}(G,M)$ は $\abs G$ で零化される有限生成とは限らないアーベル群で、$\abs G$ の素因数 $p$ についての $p$ 準素成分の直和である（$\abs G$ 倍で $0$ なので、ベズーの等式で分解できる）。各 $p$ 準素成分は \ref{ha:cor-res-index} の 4 から $H^{n}(P,M)=0$ に単射に移るので $0$。
:::

## 群の拡大と $H^{2}$ {#ha:sec-ge-exercises}

対応するページ：\ref{ha:page-group-extensions}

::: problem ★ 基本：$\Z/p$ の $\Z/p$ による拡大 {#ha:ex-ge-zp}
素数 $p$ について、$\Z/p$ の $\Z/p$（自明な作用）による拡大の同値類は $p$ 個あることを示し、群としての同型類は $\Z/p^{2}$ と $\Z/p\times\Z/p$ の 2 つであることを確かめよ。
:::

::: solution
$H^{2}(\Z/p,\Z/p)=\Z/p$（\ref{ha:cyclic-cohomology}）なので同値類は $p$ 個。類 $0$ は $\Z/p\times\Z/p$。$0$ でない類の拡大は分裂しないので、位数 $p^{2}$ の群で $\Z/p\times\Z/p$ でないもの、すなわち $\Z/p^{2}$（位数 $p^{2}$ の群は可換で、この 2 つしかない）。$p-1$ 個の非零の類はすべて群として $\Z/p^{2}$ に同型だが、拡大としては（部分群 $M$ と商への射影の同一視を込めて）異なる。
:::

::: problem ★★ 標準：補群の存在しない例 {#ha:ex-ge-no-complement}
四元数群 $Q_{8}$ の中心 $Z=\{\pm1\}$ は補群をもたないことを示し、対応する $H^{2}((\Z/2)^{2},\Z/2)$ の類が $0$ でないことを説明せよ。
:::

::: solution
$Q_{8}$ の位数 2 の元は $-1$ だけなので、位数 4 の部分群はすべて $-1$ を含み、$Z\cap C\neq1$。よって補群はない。$Q_{8}/Z\cong(\Z/2)^{2}$ で、拡大が分裂しないので \ref{ha:h2-classifies-extensions} の 4 から類は $0$ でない。
:::

## テイトのコホモロジー {#ha:sec-tc-exercises}

対応するページ：\ref{ha:page-tate-cohomology}

::: problem ★ 基本：巡回群の自明な加群 {#ha:ex-tc-trivial}
位数 $m$ の巡回群 $G$ が有限生成アーベル群 $A$ に自明に作用するとき、$\hat H^{0}(G,A)$, $\hat H^{1}(G,A)$ を求め、$A=\Z^{r}\oplus F$（$F$ 有限）について $h(A)=m^{r}$ を確かめよ。
:::

::: solution
$\sigma-1=0$, $N=m$ なので $\hat H^{0}=A/mA$, $\hat H^{1}=A[m]$（$m$ 倍の核）。$h$ は乗法的（\ref{ha:herbrand-quotient-properties} の 1）で、$h(\Z)=m$、$h(F)=1$（有限）なので $h(A)=m^{r}$。直接にも $\abs{A/mA}=m^{r}\abs{F/mF}$, $\abs{A[m]}=\abs{F[m]}$ で、$\abs{F/mF}=\abs{F[m]}$。
:::

::: problem ★★ 標準：エルブラン商と指数 {#ha:ex-tc-herbrand-index}
巡回群 $G$ と $G$ 加群 $M$、有限指数の部分加群 $M'\subseteq M$ について、$\hat H^{0}(G,M')$ と $\hat H^{0}(G,M)$ の位数が一般には異なっても、$h(M')=h(M)$ であることを、$G=C_{2}$, $M=\Z$（自明）、$M'=2\Z$ で確かめよ。
:::

::: solution
$\hat H^{0}(\Z)=\Z/2\Z$, $\hat H^{1}(\Z)=0$ で $h=2$。$M'=2\Z\cong\Z$（加群として同型）なので同じく $h=2$。$0\to2\Z\to\Z\to\Z/2\to0$ と $h(\Z/2)=1$ から、乗法性とも一致する。
:::

## カップ積とガロアコホモロジー {#ha:sec-cp-exercises}

対応するページ：\ref{ha:page-cup-products-galois}

::: problem ★ 基本：クンマーの同型の計算 {#ha:ex-cp-kummer}
$K=\mathbb{Q}(\omega)$（$\omega$ は 1 の原始 3 乗根）、$L=K(\sqrt[3]2)$ について、$G=\operatorname{Gal}(L/K)\cong\Z/3$ と $\mathrm{Hom}(G,\mu_{3})\cong\Z/3$ を確かめ、\ref{ha:kummer-isomorphism} の左辺の生成元を一つ挙げよ。
:::

::: solution
$x^{3}-2$ は $K$ 上既約（次数 3 で、$[K:\mathbb{Q}]=2$ と $\mathbb{Q}(\sqrt[3]2)$ の次数 3 から $[L:\mathbb{Q}]=6$）で、$L/K$ は 3 次のガロア拡大（$\mu_{3}\subseteq K$、\ref{fld:kummer-cyclic}）、$G\cong\Z/3$。$\mathrm{Hom}(\Z/3,\mu_{3})\cong\Z/3$。$2=(\sqrt[3]2)^{3}\in K^{\times}\cap L^{\times3}$ で、$2\notin K^{\times3}$（$\sqrt[3]2\notin K$）なので、$2$ の類が生成元（位数 3 の群の非自明な元）。
:::

::: problem ★★ 標準：ライプニッツ則の符号 {#ha:ex-cp-leibniz-sign}
$p=0$, $q=1$（$\varphi=m\in M$, $\psi$ は 1 コチェイン）について、\ref{ha:cup-leibniz} の 1 を直接確かめよ。
:::

::: solution
$(m\cup\psi)(g)=m\otimes\psi(g)$。$\delta(m\cup\psi)(g,h)=g(m\otimes\psi(h))-m\otimes\psi(gh)+m\otimes\psi(g)$。右辺：$(\delta m)\cup\psi$ は $(\delta m)(g)=gm-m$ から $(gm-m)\otimes g\psi(h)$、$m\cup\delta\psi$ は $m\otimes(g\psi(h)-\psi(gh)+\psi(g))$。和は $gm\otimes g\psi(h)-m\otimes\psi(gh)+m\otimes\psi(g)$ で、$g(m\otimes\psi(h))=gm\otimes g\psi(h)$ から左辺と一致する。
:::
