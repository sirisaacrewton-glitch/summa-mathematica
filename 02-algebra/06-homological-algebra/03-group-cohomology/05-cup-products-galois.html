# カップ積とガロアコホモロジー {#ha:page-cup-products-galois keywords="cup product of inhomogeneous cochains, Leibniz formula delta(phi cup psi) = delta phi cup psi + (-1)^p phi cup delta psi, cup product on cohomology, Galois cohomology of a finite Galois extension, Hilbert 90 as H^1(G, L^x) = 1, additive Hilbert 90 H^n(G, L) = 0 via normal basis, Kummer isomorphism (K^x cap L^{xn}) / K^{xn} = H^1(G, mu_n), relative Brauer group, Tate-Nakayama theorem"}

群のコホモロジーには、2 つのコホモロジー類から 1 つの類を作る**カップ積** $H^{p}(G,M)\times H^{q}(G,M')\to H^{p+q}(G,M\otimes M')$ がある。このページではカップ積をコチェインの段階で定義し、微分についてのライプニッツ則を確かめて、コホモロジーへの積が well-defined であることを示す。後半では、有限次ガロア拡大 $L/K$ のガロア群 $G$ のコホモロジー（**ガロアコホモロジー**）を調べる。ヒルベルトの定理 90 は $H^{1}(G,L^{\times})=1$ と読め、加法群については正規底定理とシャピロの補題から $H^{n}(G,L)=0$（$n\ge1$）が従う。応用として、冪の短完全列から**クンマーの同型** $(K^{\times}\cap L^{\times n})/K^{\times n}\cong H^{1}(G,\mu_{n})$ を導く。最後に、類体論の相互法則を生むテイト–中山の定理を述べる。

## 記法と定義の確認 {#ha:sec-cp-notation}

::: notation
- 非斉次コチェイン $C^{n}(G,M)$（写像 $G^{n}\to M$）と微分 $\delta$ は \ref{cat:group-cohomology-low}：
$$(\delta\varphi)(g_{1},\dots,g_{n+1})=g_{1}\varphi(g_{2},\dots,g_{n+1})+\sum_{i=1}^{n}(-1)^{i}\varphi(\dots,g_{i}g_{i+1},\dots)+(-1)^{n+1}\varphi(g_{1},\dots,g_{n}).$$
- $G$ 加群 $M,M'$ のテンソル積 $M\otimes M'\defeq M\otimes_{\Z}M'$ には対角作用 $g(m\otimes m')\defeq gm\otimes gm'$ を入れる。
- \ref{fld:hilbert-90}, \ref{fld:normal-basis}, \ref{fld:dedekind-independence}, \ref{ha:shapiro-lemma} を使う。
- 体系は $\ZF$。
:::

## カップ積 {#ha:sec-cp-cup}

::: definition カップ積 {#ha:cup-product-def keywords="(phi cup psi)(g_1, ..., g_{p+q}) = phi(g_1, ..., g_p) tensor (g_1 ... g_p) psi(g_{p+1}, ..., g_{p+q})" index="カップ積|かっぷせき" refname="カップ積"}
$\varphi\in C^{p}(G,M)$, $\psi\in C^{q}(G,M')$ について、$\varphi\cup\psi\in C^{p+q}(G,M\otimes M')$ を
$$(\varphi\cup\psi)(g_{1},\dots,g_{p+q})\defeq\varphi(g_{1},\dots,g_{p})\otimes(g_{1}\cdots g_{p})\,\psi(g_{p+1},\dots,g_{p+q})$$
で定める（$p=0$ のとき $\varphi$ は $M$ の元、$g_{1}\cdots g_{p}=1$）。
:::

::: intuition
カップ積は、前半の $p$ 個の群の元で $\varphi$ を、後半の $q$ 個で $\psi$ を評価して掛け合わせたものである。ただし後半は前半の積だけ「進んだ位置」から見るので、$g_{1}\cdots g_{p}$ の作用がつく。
:::

::: theorem ライプニッツ則とカップ積 {#ha:cup-leibniz keywords="delta(phi cup psi) = (delta phi) cup psi + (-1)^p phi cup (delta psi); cup product descends to H^p(G, M) x H^q(G, M') -> H^{p+q}(G, M tensor M'); in degree 0 it is the tensor product of invariants; it is natural and compatible with restriction" index="カップ積のライプニッツ則|かっぷせきのらいぷにっつそく" refname="ライプニッツ則とカップ積"}
1. $\delta(\varphi\cup\psi)=(\delta\varphi)\cup\psi+(-1)^{p}\varphi\cup(\delta\psi)$。
2. したがってカップ積は双線形写像 $H^{p}(G,M)\times H^{q}(G,M')\to H^{p+q}(G,M\otimes M')$ を誘導する。$p=q=0$ では $M^{G}\times M'^{G}\to(M\otimes M')^{G}$, $(m,m')\mapsto m\otimes m'$。
3. 制限と可換：$\mathrm{res}(x\cup y)=\mathrm{res}\,x\cup\mathrm{res}\,y$。
:::

::: intuition
カップ積の微分を展開すると、前半の微分と後半の微分にほぼ分かれ、継ぎ目の 2 項だけが余るが、それは打ち消し合う。だから余輪体の積は余輪体、余境界との積は余境界になり、積がコホモロジーに降りる。
:::

::: proof
**Step 1（1：左辺の展開）.** 【主張：左辺は 4 種類の項に分かれる】$n\defeq p+q$、$h\defeq g_{1}\cdots g_{p}$, $h'\defeq g_{1}\cdots g_{p+1}$ とする。$\delta(\varphi\cup\psi)(g_{1},\dots,g_{n+1})$ の項は、(a) $g_{1}(\varphi\cup\psi)(g_{2},\dots)=g_{1}\varphi(g_{2},\dots,g_{p+1})\otimes h'\psi(g_{p+2},\dots)$、(b) $1\le i\le p$ の $(-1)^{i}\varphi(\dots,g_{i}g_{i+1},\dots,g_{p+1})\otimes h'\psi(g_{p+2},\dots)$、(c) $p+1\le i\le n$ の $(-1)^{i}\varphi(g_{1},\dots,g_{p})\otimes h\psi(\dots,g_{i}g_{i+1},\dots)$、(d) $(-1)^{n+1}\varphi(g_{1},\dots,g_{p})\otimes h\psi(g_{p+1},\dots,g_{n})$。

**Step 2（1：右辺の展開）.** 【主張：右辺の項は左辺の項と一致し、余る 2 項は打ち消し合う】$(\delta\varphi)\cup\psi$ は $\bigl[g_{1}\varphi(g_{2},\dots)+\sum_{i=1}^{p}(-1)^{i}\varphi(\dots)+(-1)^{p+1}\varphi(g_{1},\dots,g_{p})\bigr]\otimes h'\psi(g_{p+2},\dots)$ で、最初の 2 種類が (a)(b)。$(-1)^{p}\varphi\cup\delta\psi$ は $(-1)^{p}\varphi(g_{1},\dots,g_{p})\otimes h\bigl[g_{p+1}\psi(g_{p+2},\dots)+\sum_{j=1}^{q}(-1)^{j}\psi(\dots)+(-1)^{q+1}\psi(g_{p+1},\dots,g_{n})\bigr]$ で、$\sum_{j}$ の項は $i=p+j$ として (c)、最後の項は (d)。残る $(-1)^{p+1}\varphi(g_{1},\dots,g_{p})\otimes h'\psi(g_{p+2},\dots)$ と $(-1)^{p}\varphi(g_{1},\dots,g_{p})\otimes hg_{p+1}\psi(g_{p+2},\dots)$ は $hg_{p+1}=h'$ から打ち消し合う。

**Step 3（2）.** 【主張：コホモロジーへの積】1 から余輪体どうしのカップ積は余輪体、余境界と余輪体のカップ積は余境界（$\delta\alpha\cup\psi=\delta(\alpha\cup\psi)$ など）。双線形性はテンソル積の双線形性から。

**Step 4（3）.** 【主張：制限との可換性】非斉次コチェインでは制限は $G^{n}$ から $H^{n}$ への制限で、定義式と両立する（棒分解は $H$ の分解でもあり、\ref{ha:restriction-corestriction} の包含は非斉次コチェインの制限に対応する）。
:::

## ガロアコホモロジー {#ha:sec-cp-galois}

::: theorem ガロアコホモロジーの消滅 {#ha:galois-cohomology-vanishing keywords="for a finite Galois extension L/K with group G: H^1(G, L^x) = 1 (Hilbert 90); H^n(G, L) = 0 for n >= 1 since L is coinduced by the normal basis theorem" index="ガロアコホモロジー|がろあこほもろじー, ヒルベルトの定理 90（コホモロジー）|ひるべるとのていりきゅうじゅう" refname="ガロアコホモロジーの消滅"}
$L/K$ を有限次ガロア拡大、$G=\operatorname{Gal}(L/K)$ とする。
1. $H^{1}(G,L^{\times})=1$。
2. すべての $n\ge1$ で $H^{n}(G,L)=0$。
:::

::: intuition
乗法群の 1 次コホモロジーが消えることは、ヒルベルトの定理 90 そのものである（交叉準同型は $y/\sigma(y)$ の形）。加法群は、正規底によって「$G$ の各元に $K$ を 1 つずつ置いた」加群になり、余誘導加群なので高次のコホモロジーがすべて消える。
:::

::: proof
**Step 1（1）.** $H^{1}$ は交叉準同型 $a_{\sigma\tau}=a_{\sigma}\sigma(a_{\tau})$ を主交叉準同型で割ったもので（\ref{cat:group-cohomology-low}、乗法的に書いた）、\ref{fld:hilbert-90} の 1 からすべて $\sigma\mapsto y/\sigma(y)$ の形。$y/\sigma(y)=\sigma(y^{-1})/y^{-1}$ なので主交叉準同型。

**Step 2（$L$ は余誘導加群）.** 【主張：$L\cong\operatorname{CoInd}_{1}^{G}K=\mathrm{Hom}_{\Z}(\Z G,K)$（$G$ 加群として）】\ref{fld:normal-basis} から $\{\sigma(\beta)\}_{\sigma\in G}$ が $K$ 上の基底となる $\beta$ がある。$\Phi:\mathrm{Hom}_{\Z}(\Z G,K)\to L$, $f\mapsto\sum_{\sigma}f(\sigma^{-1})\sigma(\beta)$ は $K$ 線形同型。$G$ 同変性：$(\tau f)(x)=f(x\tau)$ について $\Phi(\tau f)=\sum_{\sigma}f(\sigma^{-1}\tau)\sigma(\beta)=\sum_{\rho}f(\rho^{-1})\tau\rho(\beta)=\tau\Phi(f)$（$\rho\defeq\tau^{-1}\sigma$。$K$ の元 $f(\cdot)$ は $\tau$ で動かない）。

**Step 3（2）.** \ref{ha:shapiro-lemma} の 3。
:::

::: theorem クンマーの同型 {#ha:kummer-isomorphism keywords="if L/K is finite Galois, n is prime to char K and mu_n is contained in L, then (K^x cap L^{xn}) / K^{xn} = H^1(G, mu_n); if moreover mu_n is in K this is Hom(G, mu_n)" index="クンマーの同型|くんまーのどうけい" refname="クンマーの同型"}
$L/K$ を有限次ガロア拡大、$G=\operatorname{Gal}(L/K)$、$n$ を $K$ の標数で割れない正の整数とし、$\mu_{n}\subseteq L$（$1$ の $n$ 乗根全体）とする。このとき
$$(K^{\times}\cap L^{\times n})/K^{\times n}\cong H^{1}(G,\mu_{n}).$$
さらに $\mu_{n}\subseteq K$ なら右辺は $\mathrm{Hom}(G,\mu_{n})$ である。
:::

::: intuition
$n$ 乗する写像の核が $1$ の $n$ 乗根で、そのコホモロジーの長完全列で $H^{1}(G,L^{\times})$ がヒルベルトの定理 90 で消えるので、「$L$ で $n$ 乗になる $K$ の元」と「ガロア群から $1$ の冪根への準同型」がちょうど対応する。
:::

::: proof
**Step 1（短完全列）.** 【主張：$n$ 乗写像の完全列】$1\to\mu_{n}\to L^{\times}\xrightarrow{x\mapsto x^{n}}L^{\times n}\to1$ は $G$ 加群の完全列（$\mu_{n}$ は $x^{n}=1$ の解全体）。

**Step 2（長完全列）.** 【主張：同型が得られる】\ref{ha:group-cohomology-basic} の 2 から $K^{\times}\xrightarrow{n}(L^{\times n})^{G}\to H^{1}(G,\mu_{n})\to H^{1}(G,L^{\times})=1$（\ref{ha:galois-cohomology-vanishing} の 1）。$(L^{\times n})^{G}=K^{\times}\cap L^{\times n}$ なので、同型 $(K^{\times}\cap L^{\times n})/K^{\times n}\cong H^{1}(G,\mu_{n})$。

**Step 3（自明な作用）.** 【主張：$\mu_{n}\subseteq K$ の場合】$\mu_{n}\subseteq K$ なら $G$ は $\mu_{n}$ に自明に作用し、$H^{1}=\mathrm{Hom}(G,\mu_{n})$（\ref{ha:group-cohomology-basic} の 4）。
:::

::: fact テイト–中山の定理と相対ブラウアー群 {#ha:tate-nakayama keywords="H^2(G, L^x) is the relative Brauer group Br(L/K); for G cyclic H^2(G, L^x) = K^x / N(L^x); Tate-Nakayama: if H^1(H, C) = 0 and H^2(H, C) is cyclic of order |H| generated by res u for all subgroups H, then cup product with u gives H^n_T(G, Z) = H^{n+2}_T(G, C); for n = -2, G^ab = C^G / N C" index="テイト–中山の定理|ていとなかやまのていり, 相対ブラウアー群|そうたいぶらうあーぐん" refname="テイト–中山の定理"}
1. $H^{2}(G,L^{\times})$ は、$K$ 上の中心的単純環のうち $L$ で分裂するものの類の群（相対ブラウアー群 $\operatorname{Br}(L/K)$）と同型である。$G$ が巡回群なら $H^{2}(G,L^{\times})\cong\hat H^{0}(G,L^{\times})=K^{\times}/N(L^{\times})$（\ref{ha:tate-cyclic}）。
2. （テイト–中山）有限群 $G$ と $G$ 加群 $C$、$u\in\hat H^{2}(G,C)$ について、すべての部分群 $H$ で $\hat H^{1}(H,C)=0$ かつ $\hat H^{2}(H,C)$ が $\mathrm{res}\,u$ で生成される位数 $\abs H$ の巡回群なら、$u$ とのカップ積は同型 $\hat H^{n}(G,\Z)\cong\hat H^{n+2}(G,C)$（すべての $n\in\Z$）を与える。$n=-2$ では $G^{\mathrm{ab}}\cong\hat H^{-2}(G,\Z)\cong\hat H^{0}(G,C)=C^{G}/NC$。
3. 局所体のガロア拡大では $C=L^{\times}$ がこの仮定を満たし（基本類 $u$）、2 の同型の逆が局所相互写像 $K^{\times}/N(L^{\times})\cong G^{\mathrm{ab}}$ である（\ref{nt:local-class-field-theory} を参照）。

（Se IX §8, X–XIII。カップ積の次数を負にも延ばしたテイトのコホモロジーのカップ積と、次元のずらし（dimension shifting）を使う。ここでは証明しない。）
:::

::: intuition
ある加群 $C$ の 2 次のコホモロジーが「ちょうどよい」生成元をもつと、そのカップ積で $\Z$ のコホモロジーを 2 次ずらした形で写し取れる。$-2$ 次を $0$ 次に移すと、ガロア群のアーベル化が $C$ のノルム剰余群として現れる。これが類体論の相互法則の骨格である。
:::

::: example
1. $G=C_{m}$, $M=M'=\Z$（自明）では、$H^{2}(C_{m},\Z)=\Z/m$ の生成元 $u$ とのカップ積 $H^{n}(G,M)\to H^{n+2}(G,M)$ が、巡回群のコホモロジーの周期性を与える（$n\ge1$）、と知られている（Br VI §9）。
2. $K=\mathbb{Q}$, $L=\mathbb{Q}(\sqrt2)$, $n=2$：$\mu_{2}=\{\pm1\}\subseteq K$, $G\cong\Z/2$ で、$\mathrm{Hom}(G,\mu_{2})\cong\Z/2$。左辺は $(\mathbb{Q}^{\times}\cap L^{\times2})/\mathbb{Q}^{\times2}$ で、$2=(\sqrt2)^{2}$ の類が生成元（$\{1,2\}\cdot\mathbb{Q}^{\times2}$）。
3. 有限体の拡大 $\mathbb{F}_{q^{n}}/\mathbb{F}_{q}$ では、ノルムは全射（\ref{nt:unramified-norm-group} の Step 1）なので $H^{2}(G,\mathbb{F}_{q^{n}}^{\times})=\mathbb{F}_{q}^{\times}/N=1$：有限体のブラウアー群は自明（ウェダーバーンの定理の再証明に相当する）。
:::

::: hypcheck
- **ライプニッツ則**：作用 $h=g_{1}\cdots g_{p}$ を後半にかけたことが、Step 2 で中間の 2 項を打ち消すのに必要。
- **ガロアコホモロジーの消滅**：有限次ガロア拡大であることは、ヒルベルトの定理 90（デデキントの補題）と正規底定理に使った。
- **クンマーの同型**：$n$ が標数で割れないことは $x\mapsto x^{n}$ の核がちょうど $\mu_{n}$（$n$ 個）であることに、$\mu_{n}\subseteq L$ は短完全列を $L$ の中で作るのに使った。
:::

## 問題 {#ha:sec-cp-problems}

::: problem {#ha:prob-cp-cup-h1}
$G$ が $M=M'=\Z/2$ に自明に作用するとき、$\varphi,\psi\in\mathrm{Hom}(G,\Z/2)=H^{1}$ のカップ積 $\varphi\cup\psi\in H^{2}(G,\Z/2)$ を表すコチェインを書き、$G=\Z/2$, $\varphi=\psi=\mathrm{id}$ で、それが $\Z/4$ の拡大の因子団（\ref{ha:prob-ge-z4}）と同じ類であることを確かめよ。
:::

::: solution
$(\varphi\cup\psi)(g,h)=\varphi(g)\psi(h)$（$\Z/2\otimes\Z/2=\Z/2$）。$G=\Z/2$ では $f(1,1)=1$、他は $0$。\ref{ha:prob-ge-z4} の因子団も $f(1,1)\neq0$、他は $0$（$M=\{0,2\}\cong\Z/2$ と同一視）で同じコチェイン。よって $\Z/4$ の類（$H^{2}(\Z/2,\Z/2)$ の生成元）に等しい。
:::

::: problem {#ha:prob-cp-additive}
$L=\mathbb{C}$, $K=\mathbb{R}$, $G=\{1,c\}$（複素共役）について、$H^{1}(G,\mathbb{C})=0$ を、トレース $0$ の元 $x$（純虚数）が $y-c(y)$ と書けることで直接確かめよ。
:::

::: solution
巡回群なので $H^{1}=\ker\mathrm{Tr}/(c-1)\mathbb{C}$。$\mathrm{Tr}(x)=x+\bar x=0$ なら $x=bi$ で、$y\defeq\frac{b}{2}i$ について $y-\bar y=bi=x$。よって $H^{1}=0$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** カップ積の定義とライプニッツ則は群の有限性を使わない。ガロアコホモロジーの議論では、ガロア群が有限であることを正規底定理に使った。

**前提を変えると.**
- 無限次ガロア拡大（例えば分離閉包 $K^{\mathrm{sep}}/K$）では、副有限群の連続コホモロジー $H^{n}(G_{K},M)=\varinjlim H^{n}(\operatorname{Gal}(L/K),M^{\operatorname{Gal}(K^{\mathrm{sep}}/L)})$ を使う。$H^{1}(G_{K},\mu_{n})\cong K^{\times}/K^{\times n}$、$H^{2}(G_{K},K^{\mathrm{sep}\times})=\operatorname{Br}(K)$ が成り立つ、と知られている（Se X）。
- カップ積は次数つき可換：$x\cup y=(-1)^{pq}y\cup x$（$M\otimes M'\cong M'\otimes M$ を通して）、と知られている（Br V §3）。

**高い視点から：コホモロジー環.** カップ積により $H^{\ast}(G,\Z)$ や $H^{\ast}(G,\mathbb{F}_{p})$ は次数つき可換環になり、その構造（クイレンの定理：$\operatorname{Spec}H^{\ast}(G,\mathbb{F}_{p})$ の次元は基本可換 $p$ 部分群の最大階数）が群の構造を反映する、と知られている。ガロアコホモロジーでは、カップ積はヒルベルト記号やブラウアー群の積を与え、類体論の双対性（テイト–ポワトゥー）を記述する。比喩で言えば、カップ積はコホモロジー類どうしの「掛け算表」で、群の対称性の情報が 1 次の類の組み合わせとして高次の類に織り込まれていく。
:::
