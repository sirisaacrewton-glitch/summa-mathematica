# 群の拡大と $H^{2}$ {#ha:page-group-extensions keywords="group extension with abelian kernel, induced G-module structure on the kernel, equivalence of extensions, factor set, normalized 2-cocycle, H^2 classifies extensions, split extensions, semidirect product, complements correspond to crossed homomorphisms, conjugacy classes of complements and H^1, Schur-Zassenhaus theorem for abelian normal subgroups"}

可換な正規部分群 $M$ と商群 $G$ から元の群 $E$ を組み立てる方法（**拡大**）は一通りではない。たとえば $\Z/4$ と $\Z/2\times\Z/2$ はどちらも $\Z/2$ を $\Z/2$ で拡大したものである。このページでは、拡大を「切断の積がどれだけずれるか」を記録する**因子団**で表し、その同値類がちょうど 2 次のコホモロジー群 $H^{2}(G,M)$ と一対一に対応することを示す。半直積（分裂拡大）は $0$ に対応し、その補群の共役類は $H^{1}(G,M)$ で分類される。応用として、位数が互いに素なら可換正規部分群は補群をもち、補群はすべて共役であること（**シューア–ツァッセンハウスの定理**の可換な場合）を導く。

## 記法と定義の確認 {#ha:sec-ge-notation}

::: notation
- $G$ 加群、非斉次コチェインと微分 $(\delta\varphi)(x_{1},\dots,x_{n+1})$、$H^{1}$ の交叉準同型による記述は \ref{cat:group-cohomology-low}。2 コチェイン $f:G\times G\to M$ が余輪体であることは
$$x_{1}f(x_{2},x_{3})-f(x_{1}x_{2},x_{3})+f(x_{1},x_{2}x_{3})-f(x_{1},x_{2})=0$$
と同値。
- $\abs G$ で零化されることは \ref{ha:cor-res-index}。$M$ は加法的に、$E$ と $G$ は乗法的に書く。
- 体系は $\ZF$（切断の存在には $G$ の元ごとの選択が要り、一般には選択公理を使う。$G$ が有限なら不要）。
:::

## 拡大と因子団 {#ha:sec-ge-factor-sets}

::: definition 可換核の拡大 {#ha:abelian-extension keywords="extension 0 -> M -> E -> G -> 1 with M abelian; conjugation makes M a G-module; equivalence of extensions; section s with s(1) = 1; factor set f(g,h) = s(g) s(h) s(gh)^{-1}" index="群の拡大|ぐんのかくだい, 因子団|いんしだん, 拡大の同値|かくだいのどうち" refname="可換核の拡大"}
可換群 $M$ と群 $G$ について、完全列 $0\to M\xrightarrow{i}E\xrightarrow{\pi}G\to1$ を **$G$ の $M$ による拡大**という。$e\in E$ の共役 $i(m)\mapsto e\,i(m)e^{-1}$ は $\pi(e)$ だけで決まり（$M$ は可換）、$M$ は $G$ 加群になる。この $G$ 加群の構造を固定し、同型 $\phi:E\to E'$ で $M$ と $G$ の上で恒等なものがあるとき、2 つの拡大は**同値**という。$\pi\circ s=\mathrm{id}$, $s(1)=1$ となる写像 $s:G\to E$（**正規化された切断**）について
$$f_{s}(g,h)\defeq s(g)s(h)s(gh)^{-1}\in M$$
を拡大の**因子団**という。
:::

::: intuition
拡大 $E$ は、$G$ の各元 $g$ に「代表」$s(g)$ を選び、$E$ の元を $m\cdot s(g)$ と書くことで、集合としては $M\times G$ になる。掛け算を計算すると、代表どうしの積 $s(g)s(h)$ は $s(gh)$ と $M$ の元 $f(g,h)$ だけずれていて、このずれの表が拡大の情報をすべて持っている。
:::

::: theorem $H^{2}$ による拡大の分類 {#ha:h2-classifies-extensions keywords="factor sets are normalized 2-cocycles; changing the section changes the factor set by a coboundary; conversely every 2-cocycle defines an extension E_f = M x G with (m,g)(n,h) = (m + g n + f(g,h), gh); equivalence classes of extensions correspond bijectively to H^2(G, M); the class is 0 iff the extension splits" index="拡大の分類（H²）|かくだいのぶんるい" refname="H² による拡大の分類"}
$G$ 加群 $M$ を固定する。
1. 因子団 $f_{s}$ は正規化された（$f(1,g)=f(g,1)=0$）2 余輪体で、切断を取り替えると余境界だけ変わる。
2. 正規化された 2 余輪体 $f$ について、$E_{f}\defeq M\times G$ に積 $(m,g)(n,h)\defeq(m+gn+f(g,h),\ gh)$ を入れると群で、$m\mapsto(m,1)$, $(m,g)\mapsto g$ により拡大になり、切断 $g\mapsto(0,g)$ の因子団は $f$。
3. 拡大の同値類全体と $H^{2}(G,M)$ は、拡大 $\mapsto[f_{s}]$ によって一対一に対応する。
4. 拡大が分裂する（準同型な切断 $G\to E$ がある）ことと、その類が $0$ であることは同値。
:::

::: intuition
因子団は結合法則のおかげで 2 余輪体になり、代表の選び直しは余境界だけの違いを生む。逆にどんな 2 余輪体からも、それを因子団とする群が「$M\times G$ にずれを加えた積」で組み立てられる。だから拡大とコホモロジー類はぴったり対応し、ずれをなくせる（類が $0$）ことが分裂することである。
:::

::: proof
**Step 1（1：余輪体の条件）.** 【主張：結合法則が余輪体の条件を与える】$s(g)s(h)=f(g,h)s(gh)$（$M$ の元を左に書き、$M$ を $E$ の部分群とみる）。$s(g)s(h)s(k)$ を 2 通りに計算する：$(s(g)s(h))s(k)=f(g,h)s(gh)s(k)=f(g,h)f(gh,k)s(ghk)$、$s(g)(s(h)s(k))=s(g)f(h,k)s(hk)=(g\cdot f(h,k))s(g)s(hk)=(g\cdot f(h,k))f(g,hk)s(ghk)$。加法的に書くと $f(g,h)+f(gh,k)=gf(h,k)+f(g,hk)$、すなわち余輪体の条件。$s(1)=1$ から $f(1,g)=f(g,1)=0$。

**Step 2（1：切断の取り替え）.** 【主張：$f_{s'}=f_{s}+\delta c$】別の正規化された切断は $s'(g)=c(g)s(g)$（$c:G\to M$, $c(1)=0$）。$s'(g)s'(h)=c(g)s(g)c(h)s(h)=c(g)\,(g\cdot c(h))\,f(g,h)\,s(gh)$ で、$s(gh)=c(gh)^{-1}s'(gh)$ を代入すると、加法的に書いて $f_{s'}(g,h)=c(g)+gc(h)-c(gh)+f(g,h)$、すなわち $f_{s'}=f_{s}+\delta c$（$(\delta c)(g,h)=gc(h)-c(gh)+c(g)$）。

**Step 3（2）.** 結合法則：$((m,g)(n,h))(p,k)$ と $(m,g)((n,h)(p,k))$ の第 1 成分はそれぞれ $m+gn+f(g,h)+ghp+f(gh,k)$ と $m+gn+ghp+gf(h,k)+f(g,hk)$ で、余輪体の条件から等しい。単位元は $(0,1)$（正規化から）。$(m,g)$ の右逆元 $(-g^{-1}m-g^{-1}f(g,g^{-1}),\ g^{-1})$ がある（積の第 1 成分が $m+g(\cdots)+f(g,g^{-1})=0$）。結合的で単位元と右逆元をもつので群。$(m,1)(n,1)=(m+n,1)$、$(0,g)(m,1)(0,g)^{-1}=(gm,1)$ なので、誘導される作用は与えられたもの。$(0,g)(0,h)=(f(g,h),gh)=(f(g,h),1)(0,gh)$ から因子団は $f$。

**Step 4（3）.** 1 から写像は well-defined（同値な拡大の切断は同型で移し合え、因子団は同じ）。全射は 2（正規化：任意の余輪体 $f$ は $c(g)\defeq f(1,1)$ の定数コチェインで $f-\delta c$ が正規化される。$(\delta c)(1,h)=c(h)-c(h)+c(1)=f(1,1)$ で、$f(1,h)=f(1,1)$ は余輪体の条件で $x_{1}=x_{2}=1$ とおいて得られる。$f(h,1)$ も同様）。単射：$E$, $E'$ の因子団が $f_{s'}=f_{s}+\delta c$ なら、$E'$ の切断を $c$ で取り替えて因子団を一致させ、$m\,s(g)\mapsto m\,s'(g)$ が同値を与える（2 の積の公式で、どちらも同じ $f$ で掛け算が決まる）。

**Step 5（4）.** 準同型な切断の因子団は $0$。逆に類が $0$ なら Step 2 で因子団 $0$ の切断がとれ、それは準同型。
:::

## 分裂拡大と補群 {#ha:sec-ge-split}

::: theorem 補群と $H^{1}$ {#ha:complements-h1 keywords="in a semidirect product E = M x| G, complements of M correspond to crossed homomorphisms G -> M, and M-conjugacy classes of complements correspond to H^1(G, M)" index="補群|ほぐん, 半直積と補群|はんちょくせきとほぐん" refname="補群と H¹"}
$E=M\rtimes G$（$(m,g)(n,h)=(m+gn,gh)$）とする。$M$ の**補群**（$M\cap C=0$, $MC=E$ となる部分群 $C$）は、交叉準同型 $\varphi:G\to M$ と $C_{\varphi}\defeq\{(\varphi(g),g)\}$ によって一対一に対応し、$C_{\varphi}$ と $C_{\psi}$ が $M$ の元で共役であることと $\varphi-\psi$ が主交叉準同型であることは同値。したがって補群の $M$ 共役類は $H^{1}(G,M)$ と一対一に対応する。
:::

::: intuition
半直積の補群は「$G$ を $E$ の中に持ち上げる方法」で、その持ち上げのずれ方が交叉準同型である。$M$ の元で共役をとるとずれが主交叉準同型だけ変わるので、補群の共役類は $H^{1}$ になる。
:::

::: proof
**Step 1（補群と切断）.** 補群 $C$ は $\pi|_{C}:C\to G$ が同型（$M\cap C=0$, $MC=E$）なので、準同型な切断 $g\mapsto(\varphi(g),g)$ を与え、逆も同様。$(\varphi(g),g)(\varphi(h),h)=(\varphi(g)+g\varphi(h),gh)$ が $(\varphi(gh),gh)$ に等しいことは、$\varphi$ が交叉準同型であることと同値。

**Step 2（共役）.** $(m,1)(\varphi(g),g)(m,1)^{-1}=(m+\varphi(g)-gm,\ g)$ なので、$(m,1)C_{\varphi}(m,1)^{-1}=C_{\varphi'}$, $\varphi'(g)=\varphi(g)-(gm-m)$。主交叉準同型だけ異なる。
:::

::: theorem シューア–ツァッセンハウスの定理（可換な場合） {#ha:schur-zassenhaus-abelian keywords="if M is an abelian normal subgroup of a finite group E with gcd(|M|, [E:M]) = 1, then M has a complement and all complements are conjugate" index="シューア–ツァッセンハウスの定理|しゅーあつぁっせんはうすのていり" refname="シューア–ツァッセンハウスの定理"}
有限群 $E$ の可換な正規部分群 $M$ について $\gcd(\abs M,[E:M])=1$ なら、$M$ は補群をもち、補群はすべて互いに共役である。
:::

::: intuition
拡大の障害は $H^{2}(G,M)$、補群の共役のずれは $H^{1}(G,M)$ にある。これらは $\abs G$ でも $\abs M$ でも零化されるので、両者が互いに素なら消える。
:::

::: proof
**Step 1（コホモロジーの消滅）.** 【主張：$n\ge1$ で $H^{n}(G,M)=0$（$G=E/M$）】$\abs G=[E:M]$ 倍で $0$（\ref{ha:cor-res-index} の 3）。また $M$ の $\abs M$ 倍写像は $0$ なので、コチェインの値を $\abs M$ 倍する写像は $0$ を誘導し、$\abs M\cdot H^{n}=0$。ベズーの等式から $H^{n}=0$。

**Step 2（存在）.** $H^{2}(G,M)=0$ と \ref{ha:h2-classifies-extensions} の 4 から拡大は分裂し、補群がある。

**Step 3（共役）.** $E\cong M\rtimes G$ で、$H^{1}(G,M)=0$ と \ref{ha:complements-h1} から補群はすべて $M$ の元で共役。
:::

::: example
1. $G=\Z/2$, $M=\Z/2$（自明な作用）：$H^{2}(\Z/2,\Z/2)=\Z/2$（\ref{ha:cyclic-cohomology}）で、拡大は $\Z/2\times\Z/2$（類 $0$）と $\Z/4$（類 $\neq0$）の 2 つ。
2. $G=\Z/2$, $M=\Z$ に $-1$ 倍で作用：$H^{2}(\Z/2,\Z^{-})=0$（\ref{ha:page-group-cohomology} の例）なので、拡大は半直積 $\Z\rtimes\Z/2$（無限二面体群）だけ。
3. $S_{3}$ の正規部分群 $A_{3}\cong\Z/3$ と商 $\Z/2$ は位数が互いに素で、補群は 3 つの互換の生成する部分群で、すべて共役。
:::

::: hypcheck
- **$H^{2}$ による分類**：$M$ が可換であることが、共役作用が $G$ の作用を与えること（$M$ 自身の共役が自明）に必要。非可換な核の拡大は $H^{3}$ が障害になる複雑な理論になる（Br IV §6）。
- **シューア–ツァッセンハウス**：位数が互いに素であることが本質。$\Z/4$ の部分群 $\Z/2$ は補群をもたない（$\gcd(2,2)\neq1$）。$M$ が可換でない場合も補群は存在するが、証明にはファイト–トンプソンの定理（奇数位数の群の可解性）か別の議論が要ると知られている。
:::

## 問題 {#ha:sec-ge-problems}

::: problem {#ha:prob-ge-z4}
$\Z/4\to\Z/2$（$\bmod2$）を $\Z/2$ の $\Z/2$ による拡大とみて、切断 $s(0)=0$, $s(1)=1$ の因子団を計算し、$H^{2}(\Z/2,\Z/2)$ の $0$ でない類を与えることを確かめよ。
:::

::: solution
$f(1,1)=s(1)+s(1)-s(0)=2\in M=\{0,2\}$、他は $0$。この余輪体が余境界なら $f=\delta c$, $(\delta c)(1,1)=c(1)-c(0)+c(1)=2c(1)=0$（$M\cong\Z/2$）で、$f(1,1)\neq0$ に反する。よって類は $0$ でない（$\Z/4$ は分裂しない）。
:::

::: problem {#ha:prob-ge-dihedral-complements}
$D_{3}=\Z/3\rtimes\Z/2$（$\Z/2$ は $-1$ 倍で作用）で、$\Z/3$ の補群をすべて求め、$H^{1}(\Z/2,\Z/3^{-})$ を計算して共役類が 1 つであることを確かめよ。
:::

::: solution
交叉準同型 $\varphi:\Z/2\to\Z/3^{-}$ は $\varphi(\sigma)=a$ で、$\varphi(\sigma^{2})=a+\sigma a=a-a=0$ が成り立つので任意の $a\in\Z/3$ でよく、補群は 3 つ $\{(0,1),(a,\sigma)\}$。主交叉準同型 $\sigma m-m=-2m$ は $\Z/3$ 全体をとるので $H^{1}=0$、共役類は 1 つ。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 分類定理は $G$ の有限性を使わない。シューア–ツァッセンハウスでは有限性（位数の零化）を使った。

**前提を変えると.**
- $M$ が中心的（作用が自明）な場合、$H^{2}(G,M)$ は中心拡大を分類し、$H^{2}(G,\mathbb{C}^{\times})$（シューア乗数）は射影表現の持ち上げの障害を記述する、と知られている。
- 数論では、$H^{2}(\operatorname{Gal}(L/K),L^{\times})$ は $K$ 上の中心的単純環で $L$ で分裂するもの（ブラウアー群の一部）を分類し、局所類体論の基本類はこの群の生成元である（Se X）。

**高い視点から：トーサーとねじれ.** $H^{1}$ は「局所的には自明だが大域的にはねじれている」もの（補群の共役類、トーサー）を、$H^{2}$ は「貼り合わせの障害」（拡大の非分裂性）を分類するという読み方は、層のコホモロジーやガロアコホモロジーでも共通している。比喩で言えば、$H^{2}$ は部品 $M$ と設計図 $G$ から建物 $E$ を組み立てるときの「継ぎ目のずれ方」の一覧で、ずれが $0$ に調整できる（余境界）なら建物はまっすぐ組み上がる（分裂する）。
:::
