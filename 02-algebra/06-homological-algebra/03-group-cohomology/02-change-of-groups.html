# 群の取り替え {#ha:page-change-of-groups keywords="restriction of a ZG-resolution to a subgroup, induced and coinduced modules, Shapiro's lemma, restriction, corestriction, cor o res = multiplication by the index, |G| kills H^n(G, M) for finite G, finiteness of cohomology of finitely generated modules, restriction to a Sylow subgroup is injective on the p-primary part, inflation, inflation-restriction exact sequence"}

群 $G$ のコホモロジーを、部分群 $H$ や商群 $G/N$ のコホモロジーと比べる写像が 3 つある：部分群へ移る**制限** $\mathrm{res}$、指数有限の部分群から戻る**余制限** $\mathrm{cor}$、商群から持ち上げる**インフレーション** $\mathrm{inf}$ である。このページでは、まず部分群のコホモロジーが「誘導された」$G$ 加群のコホモロジーに等しいという**シャピロの補題**を示す。次に $\mathrm{cor}\circ\mathrm{res}$ が指数倍であることをコチェインの段階で示し、有限群のコホモロジーが群の位数で零化されること、シロー部分群への制限が $p$ 部分で単射であることを導く。最後に、$H^{1}$ についてのインフレーション–制限完全列を証明する。

## 記法と定義の確認 {#ha:sec-cg-notation}

::: notation
- $G$ 加群、$H^{n}(G,M)=\mathrm{Ext}^{n}_{\Z G}(\Z,M)$、基本性質は \ref{ha:page-group-cohomology} のとおり。非斉次コチェインと $H^{1}$ の記述は \ref{cat:group-cohomology-low}。
- $H\le G$ について、$\Z G$ は左 $\Z H$ 加群として、右剰余類 $Hg$ の代表系 $\{g_{i}\}$ を基底とする自由加群（$\Z G=\bigoplus_{i}\Z H\,g_{i}$）。
- 体系は $\ZF$（剰余類の代表系を選ぶ部分は、指数有限のとき有限個の選択で済む。指数が無限のときは代表系の存在に選択公理を使う）。
:::

## シャピロの補題 {#ha:sec-cg-shapiro}

::: definition 誘導加群と余誘導加群 {#ha:induced-coinduced keywords="Ind_H^G A = ZG tensor_{ZH} A, CoInd_H^G A = Hom_{ZH}(ZG, A) with (g phi)(x) = phi(x g); for finite index they are isomorphic" index="誘導加群|ゆうどうかぐん, 余誘導加群|よゆうどうかぐん" refname="誘導加群と余誘導加群"}
$H\le G$ と $H$ 加群 $A$ について、**誘導加群** $\operatorname{Ind}_{H}^{G}A\defeq\Z G\otimes_{\Z H}A$ と**余誘導加群** $\operatorname{CoInd}_{H}^{G}A\defeq\mathrm{Hom}_{\Z H}(\Z G,A)$（$\Z G$ を左 $\Z H$ 加群とみる）を定め、後者には $(g\varphi)(x)\defeq\varphi(xg)$ で $G$ を作用させる。$H=1$ のとき、それぞれ**誘導加群**・**余誘導加群**と呼ぶ。
:::

::: intuition
余誘導加群は「$H$ の上の加群 $A$ を $G$ 全体に広げたもの」で、$G/H$ の各点に $A$ のコピーを置いた空間の切断のようなものである。そのコホモロジーは $H$ の上の $A$ のコホモロジーに戻る。
:::

::: theorem シャピロの補題 {#ha:shapiro-lemma keywords="H^n(G, CoInd_H^G A) = H^n(H, A); a projective ZG-resolution of Z restricts to a projective ZH-resolution; H^n(G, CoInd_1^G A) = 0 for n >= 1" index="シャピロの補題|しゃぴろのほだい" refname="シャピロの補題"}
1. $\Z$ の射影的 $\Z G$ 分解 $P\to\Z$ は、$\Z H$ 加群として $\Z$ の射影的 $\Z H$ 分解である。
2. $H$ 加群 $A$ について $H^{n}(G,\operatorname{CoInd}_{H}^{G}A)\cong H^{n}(H,A)$（すべての $n$）。
3. 特に余誘導加群 $\operatorname{CoInd}_{1}^{G}B$（$B$ はアーベル群）について $n\ge1$ で $H^{n}(G,\operatorname{CoInd}_{1}^{G}B)=0$。
:::

::: intuition
$G$ の分解は $H$ の分解でもあり、余誘導加群への $G$ 同変写像は $A$ への $H$ 同変写像と一対一に対応する（随伴）。だから両者の余鎖複体は同じで、コホモロジーも同じになる。
:::

::: proof
**Step 1（1）.** 自由 $\Z G$ 加群は自由 $\Z H$ 加群（$\Z G$ が自由 $\Z H$ 加群だから）、射影 $\Z G$ 加群は自由加群の直和因子なので射影 $\Z H$ 加群。完全性は加群の構造によらない。

**Step 2（随伴）.** 【主張：$\Z G$ 加群 $X$ について $\mathrm{Hom}_{\Z G}(X,\operatorname{CoInd}A)\cong\mathrm{Hom}_{\Z H}(X,A)$ が $X$ について自然に成り立つ】$f\mapsto(x\mapsto f(x)(1))$ と、逆に $u\mapsto(x\mapsto(y\mapsto u(yx)))$。前者が $\Z H$ 準同型であることは $f(hx)(1)=(hf(x))(1)=f(x)(h)=hf(x)(1)$ から（$f(x)$ は $\Z H$ 準同型）。後者の $y\mapsto u(yx)$ は $\Z H$ 準同型、$x\mapsto(\cdot)$ は $G$ 同変：$(g\cdot u(\,\cdot\,x))(y)=u(ygx)$。互いに逆であることは直接確かめられる。

**Step 3（2）.** 1 の分解 $P$ について、Step 2 の同型は余鎖複体の同型 $\mathrm{Hom}_{\Z G}(P,\operatorname{CoInd}A)\cong\mathrm{Hom}_{\Z H}(P,A)$ を与え（自然性から微分と可換）、コホモロジーをとれば 2。

**Step 4（3）.** $H=1$ では $H^{n}(1,B)=\mathrm{Ext}^{n}_{\Z}(\Z,B)=0$（$n\ge1$、$\Z$ は射影的）。
:::

## 制限と余制限 {#ha:sec-cg-res-cor}

::: definition 制限と余制限 {#ha:restriction-corestriction keywords="restriction res: H^n(G, M) -> H^n(H, M) induced by Hom_G(P, M) subset Hom_H(P, M); corestriction cor: H^n(H, M) -> H^n(G, M) for [G:H] finite induced by f -> sum_{g in G/H} g f g^{-1}" index="制限（コホモロジー）|せいげん, 余制限|よせいげん" refname="制限と余制限"}
$H\le G$、$P\to\Z$ を射影的 $\Z G$ 分解とする（\ref{ha:shapiro-lemma} の 1 から $\Z H$ 分解でもある）。
1. 包含 $\mathrm{Hom}_{\Z G}(P,M)\subseteq\mathrm{Hom}_{\Z H}(P,M)$ が誘導する $\mathrm{res}:H^{n}(G,M)\to H^{n}(H,M)$ を**制限**という。
2. $[G:H]$ が有限で、$\{g_{i}\}$ が左剰余類 $gH$ の代表系のとき、$f\mapsto\sum_{i}g_{i}fg_{i}^{-1}$（$(g_{i}fg_{i}^{-1})(p)\defeq g_{i}f(g_{i}^{-1}p)$）が誘導する $\mathrm{cor}:H^{n}(H,M)\to H^{n}(G,M)$ を**余制限**という。
:::

::: intuition
制限は「$G$ で同変な写像を $H$ で同変な写像とみなす」だけの操作で、余制限は「$H$ で同変な写像を剰余類にわたって平均（和）して $G$ で同変にする」操作である。$H^{0}$ では、制限は包含 $M^{G}\subseteq M^{H}$、余制限はノルム $M^{H}\to M^{G}$, $m\mapsto\sum g_{i}m$ になる。
:::

::: theorem 余制限と制限の合成 {#ha:cor-res-index keywords="cor is well defined and commutes with differentials; cor o res = multiplication by [G:H]; for finite G, |G| H^n(G, M) = 0 for n >= 1; H^n(G, M) is finite for finitely generated M and finite G; res to a Sylow p-subgroup is injective on the p-primary component" index="余制限と制限の合成|よせいげんとせいげんのごうせい" refname="余制限と制限の合成"}
1. $\mathrm{cor}$ は代表系の選び方によらず定まり、微分と可換である。
2. $\mathrm{cor}\circ\mathrm{res}$ は $[G:H]$ 倍の写像である。
3. $G$ が位数 $m$ の有限群なら、$n\ge1$ で $m\cdot H^{n}(G,M)=0$。$M$ が有限生成アーベル群なら $H^{n}(G,M)$（$n\ge1$）は有限群である。
4. $G$ が有限群、$P$ がそのシロー $p$ 部分群なら、$\mathrm{res}:H^{n}(G,M)\to H^{n}(P,M)$ は $p$ 準素成分 $H^{n}(G,M)_{(p)}$ の上で単射である。
:::

::: intuition
$G$ 同変なコチェインを剰余類ごとに足すと、同じものが指数の数だけ足される。部分群として自明な群をとると、そこではコホモロジーが消えるので、有限群のコホモロジーは群の位数倍で消える。
:::

::: proof
**Step 1（1）.** 【主張：余制限は well-defined で微分と可換】$f$ が $H$ 同変なら $g_{i}h\,f\,(g_{i}h)^{-1}=g_{i}fg_{i}^{-1}$ なので、和は代表系によらない。$g\in G$ を左から掛けると代表系 $\{gg_{i}\}$ に替わるだけなので、$g\cdot\sum g_{i}fg_{i}^{-1}\cdot g^{-1}=\sum(gg_{i})f(gg_{i})^{-1}$ は元の和に等しく、結果は $G$ 同変。$P$ の微分 $\partial$ は $G$ 同変なので $g_{i}(f\partial)g_{i}^{-1}=(g_{i}fg_{i}^{-1})\partial$。

**Step 2（2）.** 【主張：$\mathrm{cor}\circ\mathrm{res}=[G:H]$】$f$ が $G$ 同変なら $g_{i}fg_{i}^{-1}=f$ なので、$\sum_{i}g_{i}fg_{i}^{-1}=[G:H]f$。

**Step 3（3）.** 【主張：位数倍で消え、有限】$H=1$ とすると $H^{n}(1,M)=0$（$n\ge1$）なので、$m\cdot x=\mathrm{cor}(\mathrm{res}\,x)=0$。棒分解を使うと $\mathrm{Hom}_{\Z G}(B_{n},M)\cong M^{G^{n}}$ は $G$ が有限で $M$ が有限生成なら有限生成アーベル群で、その部分商 $H^{n}$ も有限生成、$m$ 倍で $0$ なので有限。

**Step 4（4）.** 【主張：$p$ 部分で単射】$[G:P]$ は $p$ と互いに素。$x\in H^{n}(G,M)_{(p)}$（$p^{k}x=0$）で $\mathrm{res}\,x=0$ なら $[G:P]x=0$ で、$\gcd([G:P],p^{k})=1$ からベズーの等式で $x=0$。
:::

## インフレーション {#ha:sec-cg-inflation}

::: definition インフレーション {#ha:inflation keywords="inflation inf: H^n(G/N, M^N) -> H^n(G, M) induced on inhomogeneous cochains by G^n -> (G/N)^n and M^N -> M" index="インフレーション|いんふれーしょん" refname="インフレーション"}
$N$ を $G$ の正規部分群とする。$M^{N}$ は $G/N$ 加群である（$gN\cdot m\defeq gm$。$g'm\in M^{N}$ は $N$ の正規性から）。非斉次コチェイン $\varphi:(G/N)^{n}\to M^{N}$ に $\varphi\circ\pi^{n}$（$\pi:G\to G/N$）を対応させる写像は微分と可換で、**インフレーション** $\mathrm{inf}:H^{n}(G/N,M^{N})\to H^{n}(G,M)$ を誘導する。
:::

::: intuition
商群の上のコチェインを、射影で $G$ の上に引き戻したもの。$G$ の元を「$N$ の分だけ区別しない」ことで、商群のコホモロジーを $G$ のコホモロジーの中に送り込む。
:::

::: theorem インフレーション–制限完全列 {#ha:inflation-restriction keywords="0 -> H^1(G/N, M^N) -inf-> H^1(G, M) -res-> H^1(N, M) is exact; if H^i(N, M) = 0 for 1 <= i <= q-1 then 0 -> H^q(G/N, M^N) -> H^q(G, M) -> H^q(N, M) is exact (Hochschild-Serre)" index="インフレーション–制限完全列|いんふれーしょんせいげんかんぜんれつ" refname="インフレーション–制限完全列"}
$N\trianglelefteq G$ とする。
1. $0\to H^{1}(G/N,M^{N})\xrightarrow{\mathrm{inf}}H^{1}(G,M)\xrightarrow{\mathrm{res}}H^{1}(N,M)$ は完全である。
2. （事実）$H^{i}(N,M)=0$（$1\le i\le q-1$）なら、$0\to H^{q}(G/N,M^{N})\to H^{q}(G,M)\to H^{q}(N,M)$ は完全である（ホッホシルト–セールのスペクトル系列の帰結。Br VII §6。ここでは証明しない）。
:::

::: intuition
$G$ の交叉準同型が $N$ の上で主交叉準同型（つまりコホモロジー的に自明）なら、修正して $N$ の上で $0$ にでき、すると $G/N$ を経由し、値は $N$ で不変になる。逆に商群から来たものを $N$ に制限すれば $0$。こうして $H^{1}(G,M)$ は、$G/N$ の部分と $N$ の部分に「完全列で」分かれる。
:::

::: proof
**Step 1（inf の単射性）.** $\varphi:G/N\to M^{N}$ を交叉準同型とし、$\varphi\circ\pi$ が主交叉準同型 $g\mapsto gm-m$（$m\in M$）とする。$g\in N$ では $\varphi(\pi g)=\varphi(1)=0$ なので $gm=m$、すなわち $m\in M^{N}$。よって $\varphi(gN)=gm-m$ は $G/N$ の主交叉準同型。

**Step 2（$\mathrm{res}\circ\mathrm{inf}=0$）.** $\varphi\circ\pi$ を $N$ に制限すると $\varphi(1)=0$。

**Step 3（中央での完全性）.** 【主張：$\mathrm{res}[\psi]=0$ なら $[\psi]$ は inf の像】$\psi$ を $G$ の交叉準同型とし、$N$ 上で $\psi(n)=nm-m$ とする。$\psi'(g)\defeq\psi(g)-(gm-m)$ も交叉準同型で $[\psi']=[\psi]$、$\psi'|_{N}=0$。交叉準同型の式から $\psi'(gn)=\psi'(g)+g\psi'(n)=\psi'(g)$ なので $\psi'$ は $G/N$ を経由する。また $ng=gn'$（$n'\defeq g^{-1}ng\in N$）から $\psi'(n)+n\psi'(g)=\psi'(ng)=\psi'(gn')=\psi'(g)$、すなわち $n\psi'(g)=\psi'(g)$ で、値は $M^{N}$ に入る。よって $\psi'=\varphi\circ\pi$ となる交叉準同型 $\varphi:G/N\to M^{N}$ がある。
:::

::: example
1. $G$ が位数 $m$ の有限群で、$M$ の $m$ 倍写像が同型（例えば $M$ が $\mathbb{Q}$ ベクトル空間）なら、$n\ge1$ で $H^{n}(G,M)=0$（$m$ 倍で $0$ かつ同型）。
2. $G=C_{m}$ が $\Z$ に自明に作用するとき、$H^{2}(C_{m},\Z)=\Z/m\Z$ は $m$ で零化され、\ref{ha:cor-res-index} の 3 の評価が最良であることを示す。
:::

::: hypcheck
- **シャピロの補題**：$\Z G$ が $\Z H$ 上自由であることが、分解の制限が射影分解になる理由である。
- **$\mathrm{cor}\circ\mathrm{res}$**：$[G:H]$ が有限であることは余制限の和が有限和であるために必要。
- **インフレーション–制限**：1 次では何の仮定も要らない。高次では低次の $H^{i}(N,M)$ が消えるという仮定が要る。
:::

## 問題 {#ha:sec-cg-problems}

::: problem {#ha:prob-cg-h0-cor}
$H^{0}$ での余制限 $M^{H}\to M^{G}$ が $m\mapsto\sum_{i}g_{i}m$ であることを、定義から確かめよ。$G=C_{2}$, $H=1$, $M=\Z$（自明）のとき $\mathrm{cor}\circ\mathrm{res}$ を計算せよ。
:::

::: solution
0 次の余輪体 $f:P_{0}\to M$（$f\partial_{1}=0$, $H$ 同変）は $\varepsilon:P_{0}\to\Z$ を経由するので、$m\in M^{H}$ によって $f(x)=\varepsilon(x)m$ と書ける（$H^{0}(H,M)=M^{H}$ の同一視）。$\varepsilon$ は $G$ 同変で $\Z$ への作用は自明なので $(g_{i}fg_{i}^{-1})(x)=g_{i}\varepsilon(g_{i}^{-1}x)m=\varepsilon(x)\,g_{i}m$。和をとると $\mathrm{cor}(m)=\sum_{i}g_{i}m$。$G=C_{2}$, $H=1$, $M=\Z$（自明）では $\mathrm{res}$ は恒等で、$\mathrm{cor}(m)=m+m=2m$、すなわち $\mathrm{cor}\circ\mathrm{res}=2$ 倍。
:::

::: problem {#ha:prob-cg-inf-res-direct}
$G=C_{4}=\langle\sigma\rangle$, $N=\langle\sigma^{2}\rangle$, $M=\Z/2$（自明）について、インフレーション–制限完全列の 3 つの項を求め、完全であることを確かめよ。
:::

::: solution
自明な作用なので $H^{1}=\mathrm{Hom}$。$H^{1}(G/N,M^{N})=\mathrm{Hom}(C_{2},\Z/2)=\Z/2$、$H^{1}(G,M)=\mathrm{Hom}(C_{4},\Z/2)=\Z/2$、$H^{1}(N,M)=\mathrm{Hom}(C_{2},\Z/2)=\Z/2$。inf は $C_{2}\to\Z/2$ を $C_{4}\to C_{2}\to\Z/2$ に送る同型。res は $\chi\mapsto\chi|_{N}$ で、$C_{4}\to\Z/2$ の非自明な準同型は $\sigma\mapsto1$、$\sigma^{2}\mapsto0$ なので $N$ 上で $0$。res は $0$ 写像で、$\ker\mathrm{res}=H^{1}(G,M)=\operatorname{im}\mathrm{inf}$。完全。
:::

::: supplement
**使わなかった前提・本質的でない前提.** シャピロの補題は指数の有限性を使わない。余制限と、$\mathrm{cor}\circ\mathrm{res}$ の式だけが指数有限を必要とする。

**前提を変えると.**
- 指数有限なら $\operatorname{Ind}_{H}^{G}A\cong\operatorname{CoInd}_{H}^{G}A$ で、ホモロジーについても $H_{n}(G,\operatorname{Ind}A)\cong H_{n}(H,A)$ が成り立つ（Br III §5）。
- $\mathrm{res}\circ\mathrm{cor}$ は一般には $[G:H]$ 倍ではなく、二重剰余類による和（マッキーの公式）になる。$H$ が正規なら $\mathrm{res}\circ\mathrm{cor}=\sum_{g\in G/H}c_{g}$（共役作用の和）と知られている。
- インフレーション–制限完全列の 2 は、局所類体論・大域類体論で、ガロアコホモロジーを体の塔に沿って比べるのに使われる（Se X §4）。

**高い視点から：随伴と変化.** 制限は部分群への関手の引き戻し、余誘導はその右随伴で、シャピロの補題は「右随伴は入射的なものを入射的なものに移し、導来関手と可換である」ことの一例である。代数幾何学の言葉では、$G/H$ への射の層コホモロジーにおける固有底変換に似た役割を果たす。比喩で言えば、シャピロの補題は「部屋 $H$ の中の計算を、建物 $G$ 全体に部屋のコピーを並べた計算に移しても答えが変わらない」という原理で、余制限はその逆に、建物全体の情報を部屋ごとに足し合わせる。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{ha:sec-cg-exercises} にまとめた。
