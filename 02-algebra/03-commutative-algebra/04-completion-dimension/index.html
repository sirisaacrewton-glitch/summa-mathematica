# 完備化と次元論（Completion and Dimension Theory）

次数環とフィルトレーション（アルティン＝リースの補題）、完備化とクルルの交叉定理、次元論（ヒルベルト＝サミュエル関数・巴系・三つの次元の一致）、クルルの単項イデアル定理と応用（アティヤ＝マクドナルド 第 10・11 章、松村『可換環論』を参考）。

<p class="mn-msc">MSC2020: 13A30, 13B35, 13C15, 13D40</p>

- [可換代数 › 局所化とネーター環](../../../02-algebra/03-commutative-algebra/02-localization-noetherian/index.html)（全体、3 ページ）：中山の補題・ネーター環・長さ・準素分解
