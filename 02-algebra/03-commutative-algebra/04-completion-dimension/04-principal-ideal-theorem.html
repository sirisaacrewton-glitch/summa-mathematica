# クルルの単項イデアル定理と応用 {#ring:page-principal-ideal-theorem keywords="Krull's principal ideal theorem, Krull's height theorem, height of minimal primes, UFD iff height one primes are principal, dimension of polynomial rings, dim A[x] = dim A + 1"}

ネーター環で一つの元 $x$ を含む極小素イデアルの高さは $1$ 以下である。これが**クルルの単項イデアル定理**（\tref{ring:principal-ideal-theorem}）で、幾何的には「一つの方程式で切ると\term[次元]{ring:krull-dimension}は高々 $1$ しか下がらない」ことを意味する。$r$ 個の元についての一般化（**高さ定理**）とその逆（\ref{ring:height-converse}）は、\ref{ring:dimension-theorem}を局所化して直ちに得られる。このページではこれらを示した後、応用として、ネーター整域が一意分解環であることと高さ $1$ の素イデアルがすべて単項であることの同値性（\ref{ring:ufd-height-one}）、ネーター環について $\dim A[x]=\dim A+1$（\ref{ring:polynomial-dimension}）を証明する。特に $\dim k[x_{1},\dots,x_{n}]=n$ である。

> Atiyah–Macdonald 第 11 章、松村『可換環論』§13・§15 の流れを参考にした。

## 記法と定義の確認 {#ring:sec-pi-notation}

::: notation
- 環は可換。クルル次元・高さ・次元定理・パラメーター系は \ref{ring:page-dimension-theory}、局所化と素イデアルは \ref{ring:localization-primes}, \ref{ring:localization-at-prime}、ネーター環の極小素イデアルは \ref{ring:noetherian-prime-product}、随伴素イデアルと零因子は \ref{ring:zero-divisors-ass}, \ref{ring:ass-localization}、一意分解環の判定は \ref{ring:ufd-criterion}, \ref{ring:gcd-accp-ufd}。
- イデアル $I$ を含む素イデアルのうち包含について極小なものを、**$I$ 上の極小素イデアル**という。
- **選択公理**：次元定理を通して使う。
:::

## 単項イデアル定理と高さ定理 {#ring:sec-pi-theorems}

::: theorem クルルの高さ定理 {#ring:height-theorem keywords="Krull's height theorem: a minimal prime over an ideal generated by r elements has height at most r" index="高さ定理|たかさていり, クルルの高さ定理|くるるのたかさていり" refname="クルルの高さ定理"}
（AC）$A$ をネーター環、$x_{1},\dots,x_{r}\in A$ とする。$(x_{1},\dots,x_{r})$ 上の極小素イデアル $\mathfrak{p}$ について $\operatorname{ht}\mathfrak{p}\le r$。
:::

::: proof
$A_{\mathfrak{p}}$ の素イデアルは $\mathfrak{p}$ に含まれる素イデアルに対応する（\ref{ring:localization-at-prime.2}）。$\mathfrak{p}$ は $(x_{1},\dots,x_{r})$ 上で極小なので、$A_{\mathfrak{p}}$ で $(x_{1},\dots,x_{r})A_{\mathfrak{p}}$ を含む素イデアルは極大イデアル $\mathfrak{p}A_{\mathfrak{p}}$ だけである。よって \ref{ring:radical-properties.2} から $(x_{1},\dots,x_{r})A_{\mathfrak{p}}$ の根基は $\mathfrak{p}A_{\mathfrak{p}}$ であり、これは $\mathfrak{p}A_{\mathfrak{p}}$ 準素イデアルである（\ref{ring:primary-ideal-classical} の後の例 3）。ゆえに $\delta(A_{\mathfrak{p}})\le r$ であり、次元定理から $\operatorname{ht}\mathfrak{p}=\dim A_{\mathfrak{p}}=\delta(A_{\mathfrak{p}})\le r$。
:::

::: corollary クルルの単項イデアル定理 {#ring:principal-ideal-theorem keywords="Krull's principal ideal theorem, Hauptidealsatz" index="単項イデアル定理|たんこういであるていり, クルルの単項イデアル定理|くるるのたんこういであるていり, 主イデアル定理|しゅいであるていり" refname="クルルの単項イデアル定理"}
（AC）ネーター環 $A$ の元 $x$ について、$(x)$ 上の極小素イデアルの高さは $1$ 以下である。$x$ が非零因子かつ非単元なら、$(x)$ 上の極小素イデアルの高さはちょうど $1$ である。
:::

::: proof
前半は \ref{ring:height-theorem} で $r=1$ とした場合である。後半を示す。$x$ は非単元なので $(x)\neq A$ であり、$(x)$ 上の極小素イデアル $\mathfrak{p}$ がある。$\operatorname{ht}\mathfrak{p}=0$ と仮定すると、$\mathfrak{p}$ は $A$ の極小素イデアル、すなわち $\operatorname{Supp}(A)=\Spec A$ の極小元なので、\ref{ring:ass-localization.2} から随伴素イデアルであり、\ref{ring:zero-divisors-ass} からその元は零因子である。これは $x\in\mathfrak{p}$ が非零因子であることに反する。よって前半とあわせて $\operatorname{ht}\mathfrak{p}=1$ である。
:::

::: theorem 高さ定理の逆 {#ring:height-converse keywords="a prime of height r is minimal over an ideal generated by r elements" index="高さ定理の逆|たかさていりのぎゃく"}
（AC）ネーター環 $A$ の素イデアル $\mathfrak{p}$ が $\operatorname{ht}\mathfrak{p}=r$ なら、$\mathfrak{p}$ が $(x_{1},\dots,x_{r})$ 上の極小素イデアルとなる $x_{1},\dots,x_{r}\in\mathfrak{p}$ がある。さらに、$(x_{1},\dots,x_{i})$ 上の極小素イデアルの高さがすべて $i$ となるようにとれる（$1\le i\le r$）。
:::

::: proof
次元定理の証明の Step 3（\ref{ring:dimension-theorem}）と同じ構成を、$\mathfrak{m}$ を $\mathfrak{p}$ に替えて $A$ の中で行う：$x_{1},\dots,x_{i-1}\in\mathfrak{p}$ まで選んだとき、$(x_{1},\dots,x_{i-1})$ 上の極小素イデアルで高さ $i-1$ のもの（\ref{ring:noetherian-prime-product.2} から有限個）は、高さが $i-1<r=\operatorname{ht}\mathfrak{p}$ なので $\mathfrak{p}$ を含まない。よって素イデアルの回避（\ref{ring:prime-avoidance}）から、それらのどれにも属さない $x_{i}\in\mathfrak{p}$ がとれる。すると次元定理の証明の Step 3 と同じ議論で、$(x_{1},\dots,x_{i})$ を含む素イデアルの高さは $i$ 以上であり、\ref{ring:height-theorem}から、その上の極小素イデアルの高さはちょうど $i$ である。$i=r$ まで選ぶと、$\mathfrak{p}$ に含まれる $(x_{1},\dots,x_{r})$ 上の極小素イデアル $\mathfrak{q}$ は高さ $\ge r=\operatorname{ht}\mathfrak{p}$ なので $\mathfrak{q}=\mathfrak{p}$ であり、$\mathfrak{p}$ 自身が $(x_{1},\dots,x_{r})$ 上の極小素イデアルである。
:::

::: example
1. $k[x,y,z]$ で $(xy,xz)=(x)\cap(y,z)$ 上の極小素イデアルは $(x)$（高さ $1$）と $(y,z)$（高さ $2$）。二つの元で生成されるので高さ定理と整合する。極小素イデアルの高さは一定とは限らない。
2. 単項イデアル定理の「極小」は必要：$k[x,y]$ で $(x,y)$ は $(x)$ を含むが、鎖 $0\subsetneq(x)\subsetneq(x,y)$ があるので高さは $2$ である（$(x)$ 上で極小ではない）。
:::

## 一意分解環の特徴付け {#ring:sec-pi-ufd}

::: theorem 高さ 1 の素イデアルによる一意分解環の特徴付け {#ring:ufd-height-one keywords="a Noetherian domain is a UFD iff every height one prime is principal" index="一意分解環と高さ 1 の素イデアル|いちいぶんかいかんとたかさいちのそいである"}
（AC）ネーター整域 $A$ について、$A$ が一意分解環であることと、高さ $1$ の素イデアルがすべて単項であることは同値である。
:::

::: proof
**Step 1（⇒）.** 【主張：UFD なら高さ $1$ の素イデアル $\mathfrak{p}$ は単項】 $0\neq a\in\mathfrak{p}$ をとる。$a$ は単元でないので既約元の積に分解し、$\mathfrak{p}$ は素イデアルなので因子のどれか $\pi$ が $\mathfrak{p}$ に属する。UFD では既約元は素元なので、$(\pi)$ は $0$ でない素イデアルである。$0\subsetneq(\pi)\subset\mathfrak{p}$ であり、$(\pi)\subsetneq\mathfrak{p}$ なら長さ $2$ の鎖ができて $\operatorname{ht}\mathfrak{p}=1$ に反するので、$(\pi)=\mathfrak{p}$ である。

**Step 2（⇐）.** 【主張：高さ $1$ の素イデアルがすべて単項なら、既約元は素元であり $A$ は UFD】 ネーター整域は ACCP をみたすので既約元分解が存在する（\ref{ring:gcd-accp-ufd} の Step 2 の前半）。よって既約元 $\pi$ が素元であることを示せば、\ref{ring:ufd-criterion} から UFD である。$(\pi)$ 上の極小素イデアル $\mathfrak{p}$ をとる。整域なので $\pi$ は非零因子であり、\ref{ring:principal-ideal-theorem}から $\operatorname{ht}\mathfrak{p}=1$ である。仮定から $\mathfrak{p}=(a)$ と書ける。$\pi\in(a)$ から $\pi=ab$ であり、$\mathfrak{p}\neq A$ なので $a$ は単元でなく、既約性から $b$ は単元である。よって $(\pi)=(a)=\mathfrak{p}$ は素イデアルである。
:::

## 多項式環の次元 {#ring:sec-pi-polynomial}

::: lemma 拡大素イデアルの高さ {#ring:height-extension keywords="ht p[x] = ht p for Noetherian A" index="拡大素イデアルの高さ|かくだいそいであるのたかさ"}
（AC）$A$ をネーター環、$\mathfrak{p}$ を素イデアルとすると、$\mathfrak{p}[x]\defeq\mathfrak{p}A[x]$ は $A[x]$ の素イデアルで、$\operatorname{ht}\mathfrak{p}[x]=\operatorname{ht}\mathfrak{p}$。
:::

::: proof
**Step 1（素イデアル）.** 【主張：$\mathfrak{p}[x]$ は素イデアル】 係数の還元 $A[x]\to(A/\mathfrak{p})[x]$ の核は $\mathfrak{p}[x]$ なので、$A[x]/\mathfrak{p}[x]\cong(A/\mathfrak{p})[x]$ であり、これは整域である（\ref{ring:polynomial-primes} の Step 1 と同様）。

**Step 2（$\ge$）.** 【主張：$\operatorname{ht}\mathfrak{p}[x]\ge\operatorname{ht}\mathfrak{p}$】 $A$ の鎖 $\mathfrak{p}_{0}\subsetneq\dots\subsetneq\mathfrak{p}_{s}=\mathfrak{p}$ は $\mathfrak{p}_{0}[x]\subsetneq\dots\subsetneq\mathfrak{p}[x]$ に移る（$\mathfrak{p}_{i}[x]\cap A=\mathfrak{p}_{i}$ なので異なる）。

**Step 3（$\le$）.** $r\defeq\operatorname{ht}\mathfrak{p}$ とおく。【主張：$\operatorname{ht}\mathfrak{p}[x]\le r$】 \ref{ring:height-converse} で $\mathfrak{p}$ が $(a_{1},\dots,a_{r})$ 上で極小となる $a_{i}$ をとる。$\mathfrak{p}[x]$ が $(a_{1},\dots,a_{r})A[x]$ 上で極小であることを示す。$(a_{1},\dots,a_{r})A[x]\subset Q\subset\mathfrak{p}[x]$ となる素イデアル $Q$ をとると、$Q\cap A$ は $(a_{1},\dots,a_{r})$ を含み $\mathfrak{p}$ に含まれる素イデアルなので、$\mathfrak{p}$ の極小性から $Q\cap A=\mathfrak{p}$ である。よって $Q\supset\mathfrak{p}A[x]=\mathfrak{p}[x]$ であり、$Q=\mathfrak{p}[x]$ である。$A[x]$ はネーター環（\ref{ring:hilbert-basis}）なので、\ref{ring:height-theorem}から $\operatorname{ht}\mathfrak{p}[x]\le r$ である。
:::

::: theorem 多項式環の次元 {#ring:polynomial-dimension keywords="dim A[x] = dim A + 1 for Noetherian A, dim k[x_1,...,x_n] = n" index="多項式環の次元|たこうしきかんのじげん"}
（AC）$A$ をネーター環とすると $\dim A[x]=\dim A+1$。特に体 $k$ 上で $\dim k[x_{1},\dots,x_{n}]=n$、$\dim\Z[x_{1},\dots,x_{n}]=n+1$。
:::

::: proof
**Step 1（$\ge$）.** 【主張：$\dim A[x]\ge\dim A+1$】 $A$ の鎖 $\mathfrak{p}_{0}\subsetneq\dots\subsetneq\mathfrak{p}_{r}$ から $A[x]$ の鎖 $\mathfrak{p}_{0}[x]\subsetneq\dots\subsetneq\mathfrak{p}_{r}[x]\subsetneq\mathfrak{p}_{r}[x]+(x)$ を得る（最後は $A[x]/(\mathfrak{p}_{r}[x]+(x))\cong A/\mathfrak{p}_{r}$ が整域なので素イデアルであり、$x\notin\mathfrak{p}_{r}[x]$ なので真に大きい）。この鎖の長さは $r+1$ である。

**Step 2（$\le$：局所化）.** $A[x]$ の素イデアル $P$ について、$\mathfrak{p}\defeq P\cap A$, $r\defeq\operatorname{ht}\mathfrak{p}$ とおき、$\operatorname{ht}P\le r+1$ を示す。【主張：$A$ は局所環 $(A,\mathfrak{p})$ で $P\cap A=\mathfrak{p}$ と仮定してよい】 $S\defeq A\setminus\mathfrak{p}$ で局所化する。$P$ に含まれる素イデアル $Q$ は $Q\cap A\subset\mathfrak{p}$ をみたすので $S$ と交わらず、$S^{-1}A[x]=A_{\mathfrak{p}}[x]$ の素イデアルは $S$ と交わらない素イデアルに対応するので（\ref{ring:localization-primes}）、$\operatorname{ht}P=\operatorname{ht}(S^{-1}P)$ である。また $\operatorname{ht}\mathfrak{p}=\operatorname{ht}\mathfrak{p}A_{\mathfrak{p}}$、$S^{-1}P\cap A_{\mathfrak{p}}=\mathfrak{p}A_{\mathfrak{p}}$ であり、$A_{\mathfrak{p}}$ もネーター環なので、$A$ を $A_{\mathfrak{p}}$ に置き換えてよい。

**Step 3（剰余体上の多項式環）.** 【主張：$\operatorname{ht}P\le r+1$】 $k\defeq A/\mathfrak{p}$ は体なので、$A[x]/\mathfrak{p}[x]\cong k[x]$ は PID である。$P=\mathfrak{p}[x]$ の場合、\ref{ring:height-extension} から $\operatorname{ht}P=r$ である。$P\supsetneq\mathfrak{p}[x]$ の場合、$P/\mathfrak{p}[x]$ は $k[x]$ の $0$ でない素イデアルなので $(\bar g)$ と書け、これは極大イデアルである。$g\in P$ をその持ち上げとし、\ref{ring:height-converse} で $\mathfrak{p}$ が $(a_{1},\dots,a_{r})$ 上で極小となる $a_{i}$ をとる。$P$ は $(a_{1},\dots,a_{r},g)$ 上の極小素イデアルである。実際、$(a_{1},\dots,a_{r},g)\subset Q\subset P$ となる素イデアル $Q$ をとると、\ref{ring:height-extension} の Step 3 と同様に $Q\cap A=\mathfrak{p}$ なので $Q\supset\mathfrak{p}[x]$ であり、$Q/\mathfrak{p}[x]$ は $\bar g$ を含む $k[x]$ の素イデアルである。$(\bar g)$ は極大なので $Q/\mathfrak{p}[x]=(\bar g)$ であり、$Q=P$ である。よって \ref{ring:height-theorem}から $\operatorname{ht}P\le r+1\le\dim A+1$ である。$P$ は任意なので $\dim A[x]\le\dim A+1$ である。

**Step 4（特に）.** 体 $k$ の素イデアルは $0$ だけなので $\dim k=0$ である。$\Z$ の $0$ でない素イデアル $P$ は $0$ でない整数 $n$ を含み、$n$ の素因数 $p$ のどれかを含むので $p\Z\subset P$ である。$\Z/p\Z$ は体（\ref{ring:z-mod-n-ring.3}）なので $p\Z$ は極大であり、$P=p\Z$ である。したがって $0$ でない素イデアルはすべて極大で、長さ $2$ の鎖はなく、鎖 $0\subsetneq 2\Z$ があるので $\dim\Z=1$ である。$A[x_{1},\dots,x_{n}]=A[x_{1},\dots,x_{n-1}][x_{n}]$ はネーター環（\ref{ring:hilbert-basis}）なので、$n$ についての帰納法で $\dim k[x_{1},\dots,x_{n}]=n$、$\dim\Z[x_{1},\dots,x_{n}]=n+1$ を得る。
:::

::: supplement
**ネーターでない場合.** ネーターでない環 $A$ では、$\dim A<\infty$ のとき $\dim A+1\le\dim A[x]\le 2\dim A+1$ であり、上限まで取りうることが知られている（ザイデンバーグ）。左の不等式 $\dim A+1\le\dim A[x]$ は、\ref{ring:polynomial-dimension} の証明の Step 1 の議論からどの環でも成り立つ。

**鎖状環.** 体上の\term[有限生成]{ring:multivariate-polynomial}整域 $A$ では、極大な素イデアルの鎖の長さはすべて $\dim A$ に等しく、$\operatorname{ht}\mathfrak{p}+\dim A/\mathfrak{p}=\dim A$ が成り立つ（**鎖状性**）。これは \ref{ring:noether-normalization}と\ref{ring:going-down}から示され、代数多様体の\term[次元]{ag:dimension}が「どの点・どの部分多様体から測っても同じ」であることを保証する。一般のネーター環は鎖状とは限らない（永田の例）。
:::

## 問題 {#ring:sec-pi-problems}

::: problem {#ring:prob-height-two-not-principal}
$A=k[x,y]$ の素イデアル $(x,y)$ が単項でないこと（高さ $2$ なので単項イデアル定理と矛盾する）を、単項イデアル定理を使って示せ。
:::

::: solution
$(x,y)=(f)$ と仮定すると、$(x,y)$ は $(f)$ 上の極小素イデアル（自分自身）なので、\ref{ring:principal-ideal-theorem}から高さは $1$ 以下である。しかし鎖 $0\subsetneq(x)\subsetneq(x,y)$ があるので高さは $2$ 以上であり、矛盾する。
:::

::: problem {#ring:prob-non-ufd-height-one}
$A=k[x,y,z,w]/(xy-zw)$ は整域で、高さ $1$ の素イデアル $(x,z)$ が単項でないことから、一意分解環でないことを示せ（整域であることと高さの計算は認めてよい）。
:::

::: solution
\ref{ring:ufd-height-one} から、UFD なら高さ $1$ の素イデアル $(x,z)$ は単項である。$\mathfrak{m}\defeq(x,y,z,w)$ とし、$k$ ベクトル空間 $V\defeq(x,z)/(x,z)\mathfrak{m}$ を考える。関係式 $xy-zw$ は斉次なので、$A$ は $x,y,z,w$ を次数 $1$ とする次数環であり、$(x,z)\mathfrak{m}$ は次数 $2$ の斉次元で生成されるので次数 $1$ の $0$ でない元を含まない。$x,z$ は次数 $1$ の部分（$x,y,z,w$ を基底とする $4$ 次元空間）で一次独立なので、その像は $V$ で一次独立であり、$\dim V\ge 2$ である。一方 $(x,z)=(f)$ なら $V$ は $f$ の像で張られるので $\dim V\le 1$ となり、矛盾する。よって $A$ は UFD でない（$xy=zw$ が二通りの既約分解を与える）。
:::
