# 完備化とクルルの交叉定理 {#ring:page-completion keywords="completion, I-adic completion, inverse limit, p-adic integers, exactness of completion, completion is flat, Krull intersection theorem, completion of a Noetherian ring is Noetherian, Hensel's lemma"}

整数 $\Z$ を $p$ 進位相で「穴を埋めて」得られるのが $p$ 進整数環 $\Z_{p}$ であり、多項式環 $k[x]$ を $(x)$ 進位相で完備化すると冪級数環 $k[[x]]$ になる。一般に、環 $A$ と加群 $M$ を $I$ 進位相（\ref{ring:adic-topology}）で完備化したもの $\hat M=\varprojlim M/I^{n}M$ を考える（\ref{ring:completion}）。このページでは、ネーター環上の有限生成加群について、完備化が完全であり（\ref{ring:completion-exact}）、$\hat M\cong\hat A\otimes_{A}M$ で（\ref{ring:completion-tensor}）、$\hat A$ が平坦な $A$ 加群であること（\ref{ring:completion-flat}）を示す。鍵になるのは\ref{ring:artin-rees}である。同じ補題から**クルルの交叉定理**（\tref{ring:krull-intersection}）が従い、ネーター局所環が $\mathfrak{m}$ 進位相でハウスドルフであることがわかる。最後に、ネーター環の完備化がネーター環であること（\ref{ring:completion-noetherian}）を、随伴次数環を使って証明する。

> Atiyah–Macdonald 第 10 章の流れを参考にした。逆極限は列（$\N$ で添字付けたもの）に限って扱い、位相の言葉を使わずに代数的に定義した。

## 記法と定義の確認 {#ring:sec-co-notation}

::: notation
- 環は可換、加群は $A$ 加群。フィルトレーション・安定性・アルティン＝リースの補題・随伴次数環・$I$ 進位相は \ref{ring:page-filtrations}、中山の補題は \tref{ring:nakayama}、平坦性のイデアルによる判定は \ref{mod:flat-ideal-criterion}、五項補題は \tref{mod:five-lemma}、テンソル積の右完全性は \ref{ha:tensor-right-exact}。
- **選択公理**：ネーター性から有限生成性を引くところ（従属選択公理）と、平坦性の判定（ベールの判定法）で使う。
:::

## 逆極限と完備化 {#ring:sec-co-limits}

::: definition 逆極限 {#ring:inverse-limit keywords="inverse limit of a sequence of modules, inverse system" index="逆極限|ぎゃくきょくげん, 射影極限|しゃえいきょくげん, 逆系|ぎゃくけい"}
加群の列と\term[準同型]{mod:submodule-homomorphism} $\cdots\to M_{n+1}\xrightarrow{\theta_{n+1}}M_{n}\to\cdots\to M_{1}$（**逆系**）について、$\prod_{n}M_{n}$ の部分加群
$$
\varprojlim M_{n}\defeq\Bigl\{(x_{n})_{n}\in\prod_{n}M_{n} : \text{すべての }n\text{ で }\theta_{n+1}(x_{n+1})=x_{n}\Bigr\}
$$
を**逆極限**という。逆系の間の準同型（各段の準同型で $\theta$ と可換なもの）は逆極限の間の準同型を誘導する。
:::

::: lemma 逆極限の完全性 {#ring:inverse-limit-exact keywords="inverse limit is left exact, exact if the first system is surjective" index="逆極限の完全性|ぎゃくきょくげんのかんぜんせい"}
逆系の短完全列 $0\to(M'_{n})\to(M_{n})\to(M''_{n})\to 0$（各 $n$ で\term[短完全]{mod:exact-sequence}であり、$\theta$ と可換なもの）について、$0\to\varprojlim M'_{n}\to\varprojlim M_{n}\to\varprojlim M''_{n}$ は完全である。さらに $(M'_{n})$ の $\theta'_{n+1}$ がすべて全射なら、$\varprojlim M_{n}\to\varprojlim M''_{n}$ も全射である。
:::

::: proof
**Step 1（左完全）.** 逆極限の間の写像は成分ごとの写像である。各 $n$ で $M'_{n}\to M_{n}$ が単射なので $\varprojlim M'_{n}\to\varprojlim M_{n}$ は単射であり、各 $n$ で合成 $M'_{n}\to M''_{n}$ が $0$ なので逆極限の間の合成も $0$ である。逆に $(x_{n})\in\varprojlim M_{n}$ が $\varprojlim M''_{n}$ で $0$ に移るとする。各 $n$ での完全性から、$x_{n}$ は $M'_{n}$ の元 $x'_{n}$ の像である。$\theta'_{n+1}(x'_{n+1})$ と $x'_{n}$ はどちらも $M_{n}$ で $\theta_{n+1}(x_{n+1})=x_{n}$ に移るので、$M'_{n}\to M_{n}$ の単射性から等しい。よって $(x'_{n})\in\varprojlim M'_{n}$ であり、$(x_{n})$ はその像である。

**Step 2（全射）.** $(x''_{n})\in\varprojlim M''_{n}$ とする。$n$ についての帰納法で、$x_{n}\mapsto x''_{n}$ かつ $\theta_{n+1}(x_{n+1})=x_{n}$ となる $x_{n}$ を作る。$x_{1}$ は $M_{1}\to M''_{1}$ の全射性からとれる。$x_{n}$ まで作ったとき、$y\in M_{n+1}$ を $y\mapsto x''_{n+1}$ となるようにとると、$\theta_{n+1}(y)-x_{n}$ は $M''_{n}$ で $\theta''_{n+1}(x''_{n+1})-x''_{n}=0$ に移るので、$M'_{n}$ の元 $z$ の像である。$\theta'_{n+1}$ が全射なので $z=\theta'_{n+1}(z')$ とし、$x_{n+1}\defeq y-z'$（$z'$ を $M_{n+1}$ の元とみる）とおけば、$x_{n+1}\mapsto x''_{n+1}$ かつ $\theta_{n+1}(x_{n+1})=\theta_{n+1}(y)-z=x_{n}$ となる。

::: hypcheck
- **従属選択公理**：Step 2 の帰納的な選択で使う。
- **前提「$\theta'$ が全射」**：Step 2 で $z'$ を得るのに使った。外すと偽：$M'_{n}=p^{n}\Z$（包含）、$M_{n}=\Z$（恒等）、$M''_{n}=\Z/p^{n}\Z$ では、$\varprojlim M'_{n}=\bigcap p^{n}\Z=0$、$\varprojlim M_{n}=\Z$ で、$\Z\to\varprojlim\Z/p^{n}\Z=\Z_{p}$ は全射でない（$\Z$ は可算だが、\ref{ring:completion-examples.1} から $\Z_{p}$ は桁の列 $(c_{k})\in\{0,\dots,p-1\}^{\N}$ と全単射なので非可算集合である）。
:::
:::

::: definition 完備化 {#ring:completion keywords="I-adic completion, completion map, complete, separated" index="完備化|かんびか, 完備|かんび, 分離的|ぶんりてき"}
イデアル $I$ と加群 $M$ について、自然な射影の逆系 $M/I^{n+1}M\to M/I^{n}M$ の逆極限
$$
\hat M\defeq\varprojlim_{n}M/I^{n}M
$$
を $M$ の **$I$ 進完備化**という。$\iota:M\to\hat M$, $x\mapsto(x+I^{n}M)_{n}$ の核は $\bigcap_{n}I^{n}M$ である。$\iota$ が単射のとき $M$ は（$I$ 進位相で）**分離的**、同型のとき**完備**であるという。$\hat A$ は成分ごとの積で環になり、$\hat M$ は $\hat A$ 加群になる。
:::

::: example 完備化の例 {#ring:completion-examples}
1. **$p$ 進整数.** $\Z_{p}\defeq\varprojlim\Z/p^{n}\Z$ は $\Z$ の $(p)$ 進完備化である。その元は「$p$ 進展開」$\sum_{k\ge 0}c_{k}p^{k}$（$0\le c_{k}<p$）と一対一に対応する。実際、$a_{n}\in\Z/p^{n}\Z$ の代表元 $0\le r_{n}<p^{n}$ をとると、逆系の条件は $r_{n+1}\equiv r_{n}\pmod{p^{n}}$、すなわち $r_{n+1}=r_{n}+c_{n}p^{n}$（$0\le c_{n}<p$）と書けることであり、$c_{n}$ が第 $n$ 桁になる。
2. **冪級数.** 体 $k$ について、$k[x]$ の $(x)$ 進完備化は $k[[x]]$ に同型：$k[[x]]\to\varprojlim k[x]/(x^{n})$, $f\mapsto(f\bmod x^{n})_{n}$ は、係数を一段ずつ読むことで全単射な環準同型になる（$k[x]/(x^{n})$ の元は次数 $<n$ の多項式と同一視でき、整合する列は冪級数の係数列そのもの）。同様に $A[x_{1},\dots,x_{r}]$ の $(x_{1},\dots,x_{r})$ 進完備化は $A[[x_{1},\dots,x_{r}]]$。
3. $k[[x]]$ は $(x)$ 進完備で、完備化しても変わらない。
:::

## 完備化の完全性と平坦性 {#ring:sec-co-exact}

::: lemma 同値なフィルトレーションの完備化 {#ring:completion-cofinal keywords="filtrations with bounded difference give the same completion" index="フィルトレーションと完備化|ふぃるとれーしょんとかんびか"}
$M$ の二つの降鎖 $(M_{n})$, $(M'_{n})$ が、ある $n_{0}$ ですべての $n$ について $M_{n+n_{0}}\subset M'_{n}$ かつ $M'_{n+n_{0}}\subset M_{n}$ をみたすなら、$\varprojlim M/M_{n}\cong\varprojlim M/M'_{n}$（$M$ からの写像と両立する同型）である。
:::

::: proof
包含から誘導される\term[準同型]{mod:submodule-homomorphism} $\varprojlim M/M_{n}\to\varprojlim M/M'_{n}$, $(x_{n})\mapsto(x_{n+n_{0}}\bmod M'_{n})$ と、逆向きの同様の写像を作ると、合成は $(x_{n})\mapsto(x_{n+2n_{0}}\bmod M_{n})=(x_{n})$（逆系の条件）となるので、二つの写像は互いに逆である。どちらも $M$ からの写像 $x\mapsto(x\bmod M_{n})_{n}$, $x\mapsto(x\bmod M'_{n})_{n}$ と両立する。
:::

::: theorem 完備化の完全性 {#ring:completion-exact keywords="completion is exact on finitely generated modules over a Noetherian ring" index="完備化の完全性|かんびかのかんぜんせい"}
（DC）$A$ をネーター環、$I$ をイデアルとする。有限生成加群の短完全列 $0\to M'\to M\to M''\to 0$ について、$0\to\hat M'\to\hat M\to\hat M''\to 0$ は完全である。
:::

::: proof
**Step 1.** $M'\subset M$ とみなす。各 $n$ で
$$
0\to M'/(I^{n}M\cap M')\to M/I^{n}M\to M''/I^{n}M''\to 0
$$
は完全である（$M/I^{n}M$ を $M'$ の像で割ると $M/(I^{n}M+M')$ であり、これは $M''/I^{n}M''$ に等しい）。最初の項の逆系の写像 $M'/(I^{n+1}M\cap M')\to M'/(I^{n}M\cap M')$ は剰余の剰余なので全射である。よって \ref{ring:inverse-limit-exact} から、逆極限の列 $0\to\varprojlim M'/(I^{n}M\cap M')\to\hat M\to\hat M''\to 0$ は完全である。

**Step 2.** \ref{ring:artin-rees}から $(I^{n}M\cap M')$ は $M'$ の安定な $I$ フィルトレーションで、$(I^{n}M')$ と \ref{ring:stable-same-topology.1} の意味で同値である：ある $n_{0}$ で $I^{n+n_{0}}M'\subset I^{n}M'\subset I^{n}M\cap M'$ かつ $I^{n+n_{0}}M\cap M'\subset I^{n}M'$。よって \ref{ring:completion-cofinal} から $\varprojlim M'/(I^{n}M\cap M')\cong\hat M'$（$M'$ からの写像と両立する）であり、Step 1 の列は $0\to\hat M'\to\hat M\to\hat M''\to 0$ と同一視される。
:::

::: theorem 完備化とテンソル積 {#ring:completion-tensor keywords="completion of a finitely generated module is A-hat tensor M" index="完備化とテンソル積|かんびかとてんそるせき"}
（DC）$A$ をネーター環、$M$ を有限生成加群とすると、自然な写像 $\hat A\otimes_{A}M\to\hat M$ は同型である。
:::

::: proof
**Step 1.** 【主張：$M$ について自然な準同型 $\alpha_{M}:\hat A\otimes_{A}M\to\hat M$ がある】 $(\hat a,x)\mapsto\hat a\cdot\iota(x)$ は双線形なので $\alpha_{M}:\hat A\otimes_{A}M\to\hat M$ ができ、これは $M$ について自然である（\term[準同型]{mod:submodule-homomorphism} $f:M\to N$ について $\hat f\circ\alpha_{M}=\alpha_{N}\circ(1\otimes f)$）。

**Step 2（自由加群）.** 【主張：$\alpha_{A^{r}}$ は同型である】 $M=A^{r}$ の場合、逆極限もテンソル積も有限直和と交換するので、$\alpha_{A^{r}}$ は $\alpha_{A}$ の $r$ 個の直和である。$\alpha_{A}:\hat A\otimes_{A}A\to\hat A$ は標準的な同型なので、$\alpha_{A^{r}}$ も同型である。

**Step 3（一般）.** 【主張：有限生成な $M$ について $\alpha_{M}$ は同型である】 全射 $A^{r}\to M$ の核 $K$ は、$A$ がネーターなので有限生成であり、全射 $A^{s}\to K$ がとれる。その核 $K'$ も有限生成である。こうして完全列 $A^{s}\to A^{r}\to M\to 0$ を得る。テンソル積は右完全（\ref{ha:tensor-right-exact}）なので $\hat A\otimes A^{s}\to\hat A\otimes A^{r}\to\hat A\otimes M\to 0$ は完全である。\ref{ring:completion-exact} を $0\to K\to A^{r}\to M\to 0$ と $0\to K'\to A^{s}\to K\to 0$ に使うと、$\hat K\to\hat A^{r}$ は単射で $\hat A^{s}\to\hat K$ は全射なので、$\hat A^{s}\to\hat A^{r}\to\hat M\to 0$ も完全である。Step 1 の自然性から $\alpha$ はこの二つの列の間の可換図式を与える。右に $0\to 0$ を付け足した 5 項の図式に \ref{mod:five-lemma}を使うと、$\alpha_{A^{s}}$（全射）、$\alpha_{A^{r}}$（同型）と右の二つの $0$ の写像（同型）から、$\alpha_{M}$ は同型である。
:::

::: corollary 完備化は平坦 {#ring:completion-flat keywords="completion of a Noetherian ring is flat" index="完備化の平坦性|かんびかのへいたんせい"}
（AC）$A$ がネーター環なら、$\hat A$ は平坦な $A$ 加群である。さらに $\widehat{I^{n}}\cong\hat A\otimes I^{n}=I^{n}\hat A$ で、$\hat A/I^{n}\hat A\cong A/I^{n}$。
:::

::: proof
**Step 1.** 平坦性のイデアルによる判定（\ref{mod:flat-ideal-criterion}）から、各イデアル $J$ について $\hat A\otimes J\to\hat A\otimes A=\hat A$ が単射であることを示せばよい。$J$ は有限生成なので、\ref{ring:completion-tensor} とその自然性からこの写像は包含の完備化 $\hat J\to\hat A$ と同一視され、\ref{ring:completion-exact} から単射である。

**Step 2.** $0\to I^{n}\to A\to A/I^{n}\to 0$ を完備化すると、\ref{ring:completion-exact} から完全列 $0\to\widehat{I^{n}}\to\hat A\to\widehat{A/I^{n}}\to 0$ を得る。$A/I^{n}$ は $I^{n}$ で消えるので、$k\ge n$ で $I^{k}(A/I^{n})=0$ であり、$\widehat{A/I^{n}}=A/I^{n}$ である。また \ref{ring:completion-tensor} から $\widehat{I^{n}}\cong\hat A\otimes I^{n}$ であり、Step 1 からこれは $\hat A$ への単射で、その像は $I^{n}\hat A$ である。よって $\hat A/I^{n}\hat A\cong A/I^{n}$ である。
:::

## クルルの交叉定理 {#ring:sec-co-krull}

::: theorem クルルの交叉定理 {#ring:krull-intersection keywords="Krull intersection theorem" index="クルルの交叉定理|くるるのこうさていり" refname="クルルの交叉定理"}
（DC）$A$ をネーター環、$I$ をイデアル、$M$ を有限生成加群とし、$N\defeq\bigcap_{n}I^{n}M$ とおく。
1. $IN=N$ であり、$(1+a)N=0$ となる $a\in I$ がある。
2. $I\subset\mathrm{rad}(A)$ なら $N=0$。特に、ネーター局所環 $(A,\mathfrak{m})$ の有限生成加群は $\mathfrak{m}$ 進位相で分離的。
3. $A$ が整域で $I\neq A$ なら $\bigcap_{n}I^{n}=0$。
:::

::: proof
**Step 1（1）.** 【主張：$IN=N$ であり、$(1+a)N=0$ となる $a\in I$ がある】 \ref{ring:artin-rees}から、ある $k$ があって $n\ge k$ で $I^{n}M\cap N=I^{n-k}(I^{k}M\cap N)$ が成り立つ。$N\subset I^{n}M$ なので左辺は $N$、右辺は $I^{n-k}N$ であり、$n=k+1$ とすると $N=IN$ を得る。$M$ はネーター加群なので、その部分加群 $N$ は有限生成である。よって \ref{ring:nakayama.1} から、$(1+a)N=0$ となる $a\in I$ がある。

**Step 2（2）.** 【主張：$I\subset\mathrm{rad}(A)$ なら $N=0$】 $a\in\mathrm{rad}(A)$ なので、\ref{ring:jacobson-radical.1} で $y=-1$ とすると $1+a$ は単元である。よって $(1+a)N=0$ から $N=0$ である。局所環では $\mathrm{rad}(A)=\mathfrak{m}$（\ref{ring:jacobson-radical.3}）なので、$I=\mathfrak{m}$ に当てはまる。

**Step 3（3）.** 【主張：$A$ が整域で $I\neq A$ なら $\bigcap_{n}I^{n}=0$】 $M=A$ に 1 を使うと、$(1+a)N=0$ となる $a\in I$ がある。$I\neq A$ なので $-1\notin I$ であり、$1+a\neq 0$ である。$A$ は整域なので $N=0$ である。

::: hypcheck
- **前提「ネーター」**：外すと偽：有理数冪の環 $V$（\ref{ring:rational-exponent-ring}）は局所整域だが、極大イデアル $\mathfrak{m}V$ について $(\mathfrak{m}V)^{2}=\mathfrak{m}V$（$t^{q}=t^{q/2}t^{q/2}$）なので $\bigcap_{n}(\mathfrak{m}V)^{n}=\mathfrak{m}V\neq 0$ である。
- **前提 $I\subset\mathrm{rad}(A)$（2）**：外すと偽：$A=\Z\times\Z$, $I=\Z\times 0$ では $I^{n}=I$ なので $\bigcap I^{n}=I\neq 0$ である。
- **前提「整域」（3）**：Step 3 で使った。外すと偽：$A=\Z/6\Z$, $I=(2)$ では $I^{2}=(4)=(2)$ なので $\bigcap I^{n}=(2)\neq 0$ である（1 の $a$ は $a=2$ で、$(1+a)\cdot 2=6=0$）。
:::
:::

## 完備化のネーター性 {#ring:sec-co-noetherian}

::: lemma 随伴次数加群による有限生成性 {#ring:gr-finite-generation keywords="if gr(M) is finitely generated and M is separated over a complete ring then M is finitely generated" index="随伴次数加群と有限生成|ずいはんじすうかぐんとゆうげんせいせい"}
（DC）環 $B$ と降鎖 $B=B_{0}\supset B_{1}\supset\cdots$（$B_{m}B_{n}\subset B_{m+n}$）について、$B$ は完備（$B\to\varprojlim B/B_{n}$ が同型）とする。$B$ 加群 $M$ と降鎖 $M=M_{0}\supset M_{1}\supset\cdots$（$B_{m}M_{n}\subset M_{m+n}$）について、$M$ は分離的（$\bigcap M_{n}=0$）で、$\operatorname{gr}(M)\defeq\bigoplus M_{n}/M_{n+1}$ が $\operatorname{gr}(B)\defeq\bigoplus B_{n}/B_{n+1}$ 上有限生成なら、$M$ は有限生成である。
:::

::: proof
**Step 1（持ち上げ）.** 【主張：有限生成自由加群 $F$ のフィルトレーション $(F_{n})$ と $\varphi:F\to M$ で、$\varphi(F_{n})\subset M_{n}$ かつ $\operatorname{gr}(\varphi)$ が全射なものがある】 $\operatorname{gr}(M)$ の斉次な生成元 $\xi_{i}\in M_{d_{i}}/M_{d_{i}+1}$（$i=1,\dots,r$）をとり、代表元 $x_{i}\in M_{d_{i}}$ を選ぶ。$F\defeq B^{r}$ に $F_{n}\defeq\bigoplus_{i}B_{n-d_{i}}$（$k\le 0$ では $B_{k}\defeq B$）でフィルトレーションを入れ、$\varphi:F\to M$, $e_{i}\mapsto x_{i}$ とおく。$n\ge d_{i}$ なら $B_{n-d_{i}}x_{i}\subset M_{n}$、$n<d_{i}$ なら $Bx_{i}\subset M_{d_{i}}\subset M_{n}$ なので、$\varphi(F_{n})\subset M_{n}$ である。$\operatorname{gr}(\varphi):\operatorname{gr}(F)\to\operatorname{gr}(M)$ は $\xi_{i}$ を像に含むので全射である。

**Step 2.** 【主張：各 $n$ で $F/F_{n}\to M/M_{n}$ は全射であり、その核 $C_{n}$ の逆系の写像 $C_{n+1}\to C_{n}$ も全射である】 $F/F_{n}\to M/M_{n}$ が全射であることを $n$ の帰納法で示す。$n=0$ では $F_{0}=F$, $M_{0}=M$ なので両辺が $0$ である。$0\to F_{n}/F_{n+1}\to F/F_{n+1}\to F/F_{n}\to 0$ と $M$ の同様の列の間の可換図式で、両端の写像（$\operatorname{gr}_{n}(\varphi)$ と帰納法の仮定）が全射なので、真ん中も全射である（元を追えばよい）。さらに核 $C_{n}\defeq\Ker(F/F_{n}\to M/M_{n})$ の逆系の写像 $C_{n+1}\to C_{n}$ も全射である：$c\in C_{n}$ を $F/F_{n+1}$ に持ち上げた元 $\tilde c$ の像は $M_{n}/M_{n+1}$ に属し、$\operatorname{gr}_{n}(\varphi)$ の全射性から $F_{n}/F_{n+1}$ の元 $u$ の像なので、$\tilde c-u\in C_{n+1}$ が $c$ に移る。

**Step 3.** 【主張：$\hat\varphi:\hat F\to\hat M$ は全射である】 \ref{ring:inverse-limit-exact} を $0\to(C_{n})\to(F/F_{n})\to(M/M_{n})\to 0$ に使うと、$\hat\varphi:\hat F\to\hat M$ は全射である。

**Step 4.** 【主張：$\varphi$ は全射であり、$M$ は有限生成である】 $F_{n}$ は $B_{n}$ のずらしの直和なので、$\varprojlim F/F_{n}=\bigoplus_{i}\varprojlim_{n}B/B_{n-d_{i}}\cong B^{r}$ であり（\ref{ring:completion-cofinal}）、$F$ は完備である：$\iota_{F}:F\to\hat F$ は同型である。$M$ は分離的なので $\iota_{M}:M\to\hat M$ は単射である。$m\in M$ をとると、Step 3 から $\iota_{M}(m)=\hat\varphi(\hat f)$ となる $\hat f\in\hat F$ があり、$\hat f=\iota_{F}(f)$ と書ける。このとき $\iota_{M}(\varphi(f))=\hat\varphi(\iota_{F}(f))=\iota_{M}(m)$ であり、単射性から $m=\varphi(f)$ である。よって $M$ は $x_{1},\dots,x_{r}$ で生成される。
:::

::: theorem 完備化のネーター性 {#ring:completion-noetherian keywords="the I-adic completion of a Noetherian ring is Noetherian, completion of a Noetherian local ring is a Noetherian local ring" index="完備化のネーター性|かんびかのねーたーせい"}
（DC）$A$ がネーター環なら $\hat A$ もネーター環である。$(A,\mathfrak{m})$ がネーター局所環なら、$\mathfrak{m}$ 進完備化 $\hat A$ は極大イデアル $\mathfrak{m}\hat A$ をもつネーター局所環で、$\hat A/\mathfrak{m}^{n}\hat A\cong A/\mathfrak{m}^{n}$。
:::

::: proof
**Step 1（$\hat A$ のフィルトレーション）.** $\hat A_{n}\defeq\Ker(\hat A\to A/I^{n})$ とおく（第 $n$ 成分への射影の核）。【主張：$\hat A$ は $(\hat A_{n})$ について完備かつ分離的で、$\hat A_{m}\hat A_{n}\subset\hat A_{m+n}$ であり、$\operatorname{gr}(\hat A)\cong\operatorname{gr}_{I}(A)$】 射影は全射なので $\hat A/\hat A_{n}\cong A/I^{n}$ であり、$\hat A\to\varprojlim\hat A/\hat A_{n}=\varprojlim A/I^{n}=\hat A$ は恒等写像なので、$\hat A$ は $(\hat A_{n})$ について完備かつ分離的である。$x\in\hat A_{m}$, $y\in\hat A_{n}$ なら、$k\ge m+n$ で $x,y$ の第 $k$ 成分はそれぞれ $I^{m}/I^{k}$, $I^{n}/I^{k}$ に属するので（逆系の条件）、積の第 $m+n$ 成分は $0$ であり、$\hat A_{m}\hat A_{n}\subset\hat A_{m+n}$ である。また $\hat A_{n}/\hat A_{n+1}=\Ker(A/I^{n+1}\to A/I^{n})=I^{n}/I^{n+1}$ なので、次数環として $\operatorname{gr}(\hat A)\cong\operatorname{gr}_{I}(A)$ である。

**Step 2.** 【主張：$\hat A$ のイデアルはすべて有限生成であり、$\hat A$ はネーター環である】 \ref{ring:associated-graded} から $\operatorname{gr}_{I}(A)$ はネーター環である。$\hat A$ のイデアル $J$ に $J_{n}\defeq J\cap\hat A_{n}$ でフィルトレーションを入れると、$J_{0}=J$ で $\hat A_{m}J_{n}\subset J_{m+n}$ である。$J_{n+1}=J_{n}\cap\hat A_{n+1}$ なので $J_{n}/J_{n+1}\to\hat A_{n}/\hat A_{n+1}$ は単射であり、$\operatorname{gr}(J)$ は $\operatorname{gr}(\hat A)$ の斉次イデアルとみなせる。よって $\operatorname{gr}(J)$ は有限生成であり、$\bigcap_{n}J_{n}\subset\bigcap_{n}\hat A_{n}=0$ から $J$ は分離的である。\ref{ring:gr-finite-generation}（$B=\hat A$, $M=J$）から $J$ は有限生成である。

**Step 3（局所の場合）.** 【主張：$\hat A$ は $\mathfrak{m}\hat A$ を極大イデアルとする局所環である】 \ref{ring:completion-flat} から $\hat A_{n}=\mathfrak{m}^{n}\hat A$ であり、$\hat A/\mathfrak{m}\hat A\cong A/\mathfrak{m}$ は体なので $\mathfrak{m}\hat A$ は極大イデアルである。$x\in\mathfrak{m}\hat A=\hat A_{1}$ をとると、Step 1 から $x^{k}\in\hat A_{k}$ なので、部分和 $s_{N}\defeq\sum_{k<N}x^{k}$ の $\hat A/\hat A_{n}$ での像は $N\ge n$ で一定である。その像の列は逆極限の元 $s\in\hat A$ を定め、$(1-x)s\equiv(1-x)s_{n}=1-x^{n}\equiv 1\pmod{\hat A_{n}}$ がすべての $n$ で成り立つ。$\hat A$ は分離的なので $(1-x)s=1$ であり、$1-x$ は単元である。よって \ref{ring:local-ring-criterion.3} から $\hat A$ は $\mathfrak{m}\hat A$ を極大イデアルとする局所環である。
:::

::: supplement
**ヘンゼルの補題.** 完備局所環 $(A,\mathfrak{m},k)$ 上のモニック多項式 $f$ の還元 $\bar f\in k[x]$ が、互いに素なモニック多項式の積 $\bar f=\bar g\bar h$ に分解するなら、$f=gh$（$g,h$ はモニックで還元が $\bar g,\bar h$）と持ち上げられる。例えば $\Z_{7}$ で $x^{2}-2$ は根をもつ（$\bmod 7$ で $3^{2}=9\equiv 2$）。証明は $\mathfrak{m}$ 進近似を一段ずつ進めるもので、ニュートン法の類似である（松村『可換環論』§8）。

**コーエンの構造定理.** 完備ネーター局所環は、体または完備 DVR 上の冪級数環の剰余環に同型であることが知られている（コーエン）。完備化は局所環の研究を「冪級数環の剰余」という具体的な対象に帰着させる。
:::

## 問題 {#ring:sec-co-problems}

::: problem {#ring:prob-z-p-units}
$\Z_{p}$ で、$a=(a_{n})_{n}$（$a_{n}\in\Z/p^{n}\Z$）が単元であることと、$\Z/p\Z$ で $a_{1}\neq 0$ であることは同値であることを示せ。したがって $\Z_{p}$ は局所環で、極大イデアルは $p\Z_{p}$。
:::

::: solution
$a$ が単元なら、環準同型 $\Z_{p}\to\Z/p\Z$ による像 $a_{1}$ も単元なので $a_{1}\neq 0$ である。逆に $a_{1}\neq 0$ と仮定する。$a_{n}$ の代表元 $c\in\Z$ は $c\bmod p=a_{1}\neq 0$ をみたすので $\gcd(c,p^{n})=1$ であり、\ref{ring:z-mod-n-ring.2} から $a_{n}$ は $\Z/p^{n}\Z$ の単元である。射影 $\Z/p^{n+1}\Z\to\Z/p^{n}\Z$ は環準同型なので $a_{n+1}^{-1}$ を $a_{n}$ の逆元に移し、逆元の一意性からそれは $a_{n}^{-1}$ である。よって $(a_{n}^{-1})_{n}\in\Z_{p}$ が $a$ の逆元である。したがって非単元全体は $\{a : a_{1}=0\}=\Ker(\Z_{p}\to\Z/p\Z)$ でありイデアルなので、\ref{ring:local-ring-criterion.1} から $\Z_{p}$ は局所環である。\ref{ring:completion-flat}（$n=1$）から、この核は $p\Z_{p}$ である。
:::

::: problem {#ring:prob-completion-not-faithful}
$\Z$ の $(6)$ 進完備化は $\Z_{2}\times\Z_{3}$ に同型であることを示せ。
:::

::: solution
\ref{ring:crt-integers}から $\Z/6^{n}\Z\cong\Z/2^{n}\Z\times\Z/3^{n}\Z$（$c\mapsto(c\bmod 2^{n},c\bmod 3^{n})$）であり、この同型は射影 $\Z/6^{n+1}\Z\to\Z/6^{n}\Z$ などと両立する。逆極限は直積と交換するので $\varprojlim\Z/6^{n}\Z\cong\varprojlim\Z/2^{n}\Z\times\varprojlim\Z/3^{n}\Z=\Z_{2}\times\Z_{3}$。（完備化は局所環とは限らず、整域とも限らない。）
:::
