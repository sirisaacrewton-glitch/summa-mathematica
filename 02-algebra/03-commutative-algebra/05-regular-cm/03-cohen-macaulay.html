# コーエン＝マコーレー環 {#ring:page-cohen-macaulay keywords="Cohen-Macaulay local ring, Cohen-Macaulay ring, unmixedness theorem, system of parameters is a regular sequence, equidimensional, no embedded primes"}

ネーター局所環の深さは次元以下である（\ref{ring:depth-le-dim}）。等号 $\operatorname{depth}A=\dim A$ が成り立つ局所環を**コーエン＝マコーレー環**（CM 環）という（\ref{ring:cohen-macaulay}）。正則局所環は CM であり、CM 環は正則局所環の持つ「よい性質」のうち、\term[次元]{ring:krull-dimension}と深さに関わる部分を保ったまま、特異点を許す広いクラスになっている。このページでは、CM 局所環では随伴素イデアルがすべて同じ次元をもつこと（埋没素因子がない）、パラメーター系がつねに正則列であること（\ref{ring:cm-sop-regular}）を示し、そこから**マコーレーの非混合性定理**（\tref{ring:unmixedness}）を導く。

> 松村『可換環論』§17 の流れを参考にした。局所環の場合（環そのものが CM）を中心にし、最後に局所化・多項式環・鎖状性を証明した。加群の CM 性は定義だけ述べる。

## 記法と定義の確認 {#ring:sec-cm-notation}

::: notation
- $(A,\mathfrak{m})$ はネーター局所環。深さ・正則列・$\operatorname{depth}\le\dim A/\mathfrak{p}$ は \ref{ring:page-depth}、次元定理・パラメーター系・非零因子での\term[次元]{ring:krull-dimension}の低下は \ref{ring:dimension-theorem}, \ref{ring:dimension-corollaries}、随伴素イデアルと零因子は \ref{ring:page-primary-decomposition}、正則局所環は \tref{ring:page-regular-local-rings}。
- **選択公理**：深さと次元の結果を通して使う。
:::

## 定義と例 {#ring:sec-cm-definition}

::: definition コーエン＝マコーレー環 {#ring:cohen-macaulay keywords="Cohen-Macaulay local ring, CM ring, maximal Cohen-Macaulay module" index="コーエン＝マコーレー環|こーえんまこーれーかん, CM 環|しーえむかん"}
ネーター局所環 $(A,\mathfrak{m})$ で $\operatorname{depth}A=\dim A$ となるものを**コーエン＝マコーレー局所環**という。ネーター環 $A$ で、すべての極大イデアル $\mathfrak{m}$ について $A_{\mathfrak{m}}$ がコーエン＝マコーレー局所環であるものを**コーエン＝マコーレー環**という。（有限生成加群 $M\neq 0$ についても $\operatorname{depth}M=\dim M$ で CM 加群を定義する。）
:::

::: example コーエン＝マコーレー環の例 {#ring:cm-examples}
1. 正則局所環は CM（\ref{ring:depth-ext} の後の例 1）。
2. $0$ \term[次元]{ring:krull-dimension}のネーター局所環（アルティン局所環）は CM（$0\le\operatorname{depth}\le\dim=0$）。
3. 被約な $1$ 次元ネーター局所環は CM：被約なネーター環では随伴素イデアルは極小素イデアルに限る（$\mathfrak{p}=\operatorname{Ann}(x)$, $x\neq 0$ なら、極小素イデアルの共通部分は $0$ なので $x\notin\mathfrak{q}$ となる極小素イデアル $\mathfrak{q}$ があり、$\mathfrak{p}x=0\in\mathfrak{q}$ から $\mathfrak{p}\subset\mathfrak{q}$、極小性から $\mathfrak{p}=\mathfrak{q}$）。$\mathfrak{m}$ は極小でないので $\mathfrak{m}\notin\operatorname{Ass}A$、\ref{ring:ideal-of-zero-divisors} から深さ $\ge 1$。例：$k[[x,y]]/(xy)$、$k[[t^{2},t^{3}]]$。
4. **CM でない例**：$k[[x,y]]/(x^{2},xy)$（$\dim 1$, 深さ $0$。埋没点がある）、$k[[x,y,z]]/(xy,xz)=k[[x,y,z]]/((x)\cap(y,z))$（平面と直線の和集合。随伴素イデアル $(x)$, $(y,z)$ の次元が $2$ と $1$ で異なるので、下の \ref{ring:cm-properties.1} に反する）。
5. ゴレンシュタイン環・完全交叉（\tref{ring:page-gorenstein}）は CM。
:::

## 基本性質 {#ring:sec-cm-properties}

::: proposition コーエン＝マコーレー環の基本性質 {#ring:cm-properties keywords="CM local rings have no embedded primes and are equidimensional, quotient by a non-zero-divisor" index="コーエン＝マコーレー環の性質|こーえんまこーれーかんのせいしつ"}
（AC）$(A,\mathfrak{m})$ を $d$ \term[次元]{ring:krull-dimension}のネーター局所環とする。
1. $A$ が CM なら、すべての $\mathfrak{p}\in\operatorname{Ass}A$ で $\dim A/\mathfrak{p}=d$。特に $A$ は埋没素因子をもたず、極小素イデアル $\mathfrak{p}$ はすべて $\dim A/\mathfrak{p}=d$ をみたす。
2. $x\in\mathfrak{m}$ を $A$ の非零因子とする。$A$ が CM であることと、$A/xA$ が CM であることは同値で、このとき $\dim A/xA=d-1$。
:::

::: proof
**Step 1（1）.** \ref{ring:depth-le-dim} から $d=\operatorname{depth}A\le\dim A/\mathfrak{p}\le\dim A=d$。極小素イデアルは随伴素イデアル（\ref{ring:ass-localization.2}）なので、極小でない随伴素イデアル $\mathfrak{p}\supsetneq\mathfrak{q}$ があれば $\dim A/\mathfrak{p}<\dim A/\mathfrak{q}\le d$ となり矛盾。

**Step 2（2）.** 非零因子なので $\dim A/xA=d-1$（\ref{ring:dimension-corollaries.3}）、$\operatorname{depth}A/xA=\operatorname{depth}A-1$（\ref{ring:depth-ext} の Step 2 の短完全列）。よって $\operatorname{depth}A=d\iff\operatorname{depth}A/xA=d-1=\dim A/xA$。
:::

::: theorem パラメーター系と正則列 {#ring:cm-sop-regular keywords="in a Cohen-Macaulay local ring, x_1,...,x_r is a regular sequence iff it is part of a system of parameters" index="パラメーター系は正則列|ぱらめーたーけいはせいそくれつ"}
（AC）$(A,\mathfrak{m})$ を $d$ \term[次元]{ring:krull-dimension}の CM 局所環、$x_{1},\dots,x_{r}\in\mathfrak{m}$ とする。次は同値である。
1. $x_{1},\dots,x_{r}$ は $A$ 正則列。
2. $\dim A/(x_{1},\dots,x_{r})=d-r$（すなわち、パラメーター系の一部である）。

特に、CM 局所環のパラメーター系は正則列である。逆に、ネーター局所環で、あるパラメーター系が正則列なら CM である。
:::

::: proof
**Step 1（1⇒2）.** 非零因子で割るごとに\term[次元]{ring:krull-dimension}はちょうど $1$ 下がる（\ref{ring:dimension-corollaries.3}）。

**Step 2（2⇒1、$r=1$）.** $\dim A/x_{1}A=d-1$ とする。$x_{1}$ が零因子なら、ある $\mathfrak{p}\in\operatorname{Ass}A$ に属し（\ref{ring:zero-divisors-ass}）、$\dim A/\mathfrak{p}=d$（\ref{ring:cm-properties.1}）なので $\dim A/x_{1}A\ge\dim A/\mathfrak{p}=d$ となり矛盾。

**Step 3（2⇒1、一般）.** $r$ の帰納法。$\dim A/(x_{1},\dots,x_{r})=d-r$ なら、$\dim A/x_{1}A\le d-r+(r-1)=d-1$（\ref{ring:dimension-corollaries.3} を $A/x_{1}A$ から $r-1$ 回）で、$\ge d-1$ なので $=d-1$。Step 2 から $x_{1}$ は非零因子で、$A/x_{1}A$ は $d-1$ 次元の CM 局所環（\ref{ring:cm-properties.2}）。その中で $x_{2},\dots,x_{r}$ について帰納法の仮定を使う。

**Step 4（逆）.** パラメーター系 $x_{1},\dots,x_{d}$ が正則列なら $\operatorname{depth}A\ge d=\dim A$ で、$\operatorname{depth}\le\dim$ と合わせて CM。
:::

::: theorem マコーレーの非混合性定理 {#ring:unmixedness keywords="Macaulay unmixedness theorem: in a CM local ring an ideal of height r generated by r elements is unmixed" index="非混合性定理|ひこんごうせいていり, 非混合|ひこんごう" refname="マコーレーの非混合性定理"}
（AC）$(A,\mathfrak{m})$ を CM 局所環、$I=(x_{1},\dots,x_{r})$ を $\operatorname{ht}I=r$ となるイデアルとする（$\operatorname{ht}I$ は $I$ を含む素イデアルの高さの最小値）。$A/I$ は CM で、$\operatorname{Ass}(A/I)$ の元はすべて高さ $r$ である。特に $I$ は埋没素因子をもたない（**非混合**）。
:::

::: proof
**Step 1（\term[次元]{ring:krull-dimension}）.** $d=\dim A$ とする。$I$ 上の極小素イデアル $\mathfrak{p}$ で $\dim A/\mathfrak{p}=\dim A/I$ となるものをとると、$\operatorname{ht}\mathfrak{p}+\dim A/\mathfrak{p}\le d$（鎖をつなげる）と $\operatorname{ht}\mathfrak{p}\ge r$ から $\dim A/I\le d-r$。一方 $\dim A/I\ge d-r$（\ref{ring:dimension-corollaries.3} を $r$ 回）。よって $\dim A/I=d-r$。

**Step 2（CM）.** \ref{ring:cm-sop-regular} から $x_{1},\dots,x_{r}$ は正則列で、\ref{ring:cm-properties.2} を繰り返して $A/I$ は $d-r$ 次元の CM 局所環。

**Step 3（高さ）.** $\mathfrak{p}\in\operatorname{Ass}(A/I)$ について、\ref{ring:cm-properties.1}（$A/I$ に適用）から $\dim A/\mathfrak{p}=d-r$。$\operatorname{ht}\mathfrak{p}\le d-\dim A/\mathfrak{p}=r$ と $\operatorname{ht}\mathfrak{p}\ge\operatorname{ht}I=r$ から $\operatorname{ht}\mathfrak{p}=r$。
:::

## 局所化・多項式環・鎖状性 {#ring:sec-cm-localization}

::: lemma 正則列で割った環の随伴素イデアル {#ring:cm-regular-sequence-height keywords="in a CM local ring, associated primes of A/(x) for a regular sequence of length i have height i" index="正則列と高さ|せいそくれつとたかさ"}
（AC）$(A,\mathfrak{m})$ を $d$ \term[次元]{ring:krull-dimension}の CM 局所環、$x_{1},\dots,x_{i}$ を $A$ 正則列とする。$\operatorname{Ass}(A/(x_{1},\dots,x_{i}))$ の元 $P$ はすべて $\operatorname{ht}P=i$ をみたす。
:::

::: proof
**Step 1（上から）.** $A/(\boldsymbol{x})$ は $d-i$ \term[次元]{ring:krull-dimension}の CM 局所環（\ref{ring:cm-properties.2} を $i$ 回）なので、\ref{ring:cm-properties.1} から $\dim A/P=d-i$。$P$ の下の鎖と上の鎖をつなぐと $\operatorname{ht}P+\dim A/P\le d$ なので $\operatorname{ht}P\le i$。

**Step 2（下から）.** $x_{1},\dots,x_{i}$ は $A_{P}$ 正則列：局所化は完全（\ref{ring:localization-exact}）なので $x_{j}$ 倍の単射性は局所化で保たれ、$A_{P}/(\boldsymbol{x})A_{P}\neq 0$（$(\boldsymbol{x})\subset P$）。よって $\operatorname{depth}A_{P}\ge i$ で、\ref{ring:depth-le-dim} から $\operatorname{ht}P=\dim A_{P}\ge i$（\ref{ring:localization-primes}）。
:::

::: theorem 局所化と高さの公式 {#ring:cm-localization-fact keywords="localization of a Cohen-Macaulay local ring is Cohen-Macaulay; ht I + dim A/I = dim A" index="CM 環の局所化|しーえむかんのきょくしょか, 高さの公式（CM）|たかさのこうしきしーえむ"}
（AC）$(A,\mathfrak{m})$ を $d$ \term[次元]{ring:krull-dimension}の CM 局所環とする。
1. 素イデアル $\mathfrak{p}$ について、$\mathfrak{p}$ の中に長さ $\operatorname{ht}\mathfrak{p}$ の $A$ 正則列がある。
2. $\operatorname{ht}\mathfrak{p}+\dim A/\mathfrak{p}=d$。より一般にイデアル $I\neq A$ について $\operatorname{ht}I+\dim A/I=d$。
3. $A_{\mathfrak{p}}$ は CM 局所環。したがって CM 環（\ref{ring:cohen-macaulay}）の任意の素イデアルでの局所化は CM。
:::

::: proof
$r\defeq\operatorname{ht}\mathfrak{p}$ とする。

**Step 1（1：延ばす）.** $\mathfrak{p}$ の中の正則列 $x_{1},\dots,x_{i}$（$i<r$）が延ばせることを示す。\ref{ring:cm-regular-sequence-height} から $\operatorname{Ass}(A/(\boldsymbol{x}))$ の元は高さ $i<r$ なので $\mathfrak{p}$ を含まない。$\operatorname{Ass}$ は有限（\ref{ring:prime-filtration}）なので、素イデアルの回避（\ref{ring:prime-avoidance}）から、どの随伴素イデアルにも属さない $x_{i+1}\in\mathfrak{p}$ があり、それは $A/(\boldsymbol{x})$ の非零因子（\ref{ring:zero-divisors-ass}）。$A/(x_{1},\dots,x_{i+1})\neq 0$（$\subset\mathfrak{m}$）。空の列から始めて $r$ 回繰り返す。

**Step 2（2：素イデアル）.** Step 1 の正則列 $x_{1},\dots,x_{r}\in\mathfrak{p}$ について、$\mathfrak{p}$ は $(\boldsymbol{x})$ 上のある極小素イデアル $P$ を含み、$\operatorname{ht}P=r$（\ref{ring:cm-regular-sequence-height}。極小素イデアルは随伴素イデアル）$=\operatorname{ht}\mathfrak{p}$ なので $P=\mathfrak{p}$。よって $\mathfrak{p}\in\operatorname{Ass}(A/(\boldsymbol{x}))$ で、\ref{ring:cm-regular-sequence-height} の Step 1 から $\dim A/\mathfrak{p}=d-r$。

**Step 3（2：イデアル）.** $\dim A/I=\max_{\mathfrak{p}}\dim A/\mathfrak{p}=\max_{\mathfrak{p}}(d-\operatorname{ht}\mathfrak{p})=d-\min_{\mathfrak{p}}\operatorname{ht}\mathfrak{p}=d-\operatorname{ht}I$（$\mathfrak{p}$ は $I$ 上の極小素イデアルを走る）。

**Step 4（3）.** Step 1 の列は $A_{\mathfrak{p}}$ 正則列（\ref{ring:cm-regular-sequence-height} の Step 2 と同じ理由）なので、$\operatorname{depth}A_{\mathfrak{p}}\ge r=\dim A_{\mathfrak{p}}$。CM 環 $A$ の素イデアル $\mathfrak{p}$ については、$\mathfrak{p}\subset\mathfrak{m}$ となる極大イデアルで $A_{\mathfrak{p}}=(A_{\mathfrak{m}})_{\mathfrak{p}A_{\mathfrak{m}}}$ に適用する。
:::

::: theorem 多項式環の CM 性 {#ring:cm-polynomial keywords="A Cohen-Macaulay implies A[x] Cohen-Macaulay" index="多項式環の CM 性|たこうしきかんのしーえむせい"}
（AC）$A$ が CM 環なら $A[x]$ も CM 環である。
:::

::: proof
**Step 1（帰着）.** $B=A[x]$ はネーター（\ref{ring:hilbert-basis}）。$B$ の素イデアル $P$ について $B_{P}$ が CM であることを示す。$\mathfrak{p}=P\cap A$, $S=A\setminus\mathfrak{p}$ とすると $B_{P}=(S^{-1}B)_{S^{-1}P}$ で $S^{-1}B=A_{\mathfrak{p}}[x]$。$A_{\mathfrak{p}}$ は CM（\ref{ring:cm-localization-fact.3}）なので、以下 $A$ は $d$ \term[次元]{ring:krull-dimension}の CM 局所環 $(A,\mathfrak{m},k)$ で $P\cap A=\mathfrak{m}$ とする。$x_{1},\dots,x_{d}$ をパラメーター系とすると $A$ 正則列（\ref{ring:cm-sop-regular}）。

**Step 2（$B$ でも正則列）.** $B/(x_{1},\dots,x_{j-1})B\cong(A/(x_{1},\dots,x_{j-1}))[x]$ で、$x_{j}$ 倍は係数ごとの $x_{j}$ 倍なので単射。

**Step 3（$P$ の形）.** $P\supset\mathfrak{m}B$ で $B/\mathfrak{m}B\cong k[x]$。$P/\mathfrak{m}B$ は $k[x]$ の素イデアルなので、$0$ か、モニックな既約多項式 $\bar f$ で生成される。後者では $\bar f$ のモニックな持ち上げ $f\in A[x]$ をとる。

**Step 4（$P=\mathfrak{m}B$ の場合）.** $\mathfrak{m}^{N}\subset(\boldsymbol{x})$ となる $N$ がある（パラメーター系）ので $(\mathfrak{m}B)^{N}\subset(\boldsymbol{x})B\subset\mathfrak{m}B$ で、素イデアル $\mathfrak{m}B$ は $(\boldsymbol{x})B$ 上の極小素イデアル。高さ定理（\tref{ring:height-theorem}）から $\dim B_{P}=\operatorname{ht}P\le d$。Step 2 の正則列は $B_{P}$ 正則列（局所化の完全性、$(\boldsymbol{x})\subset P$）なので $\operatorname{depth}B_{P}\ge d\ge\dim B_{P}$。

**Step 5（$P=\mathfrak{m}B+fB$ の場合）.** $f$ はモニックなので $(A/(\boldsymbol{x}))[x]$ の非零因子（最高次の係数が $1$）で、$x_{1},\dots,x_{d},f$ は $B$ 正則列、$B_{P}$ 正則列でもある。$(\boldsymbol{x},f)$ を含む素イデアルは根基をとって $\mathfrak{m}B+fB$ を含み、$B/(\mathfrak{m}B+fB)\cong k[x]/(\bar f)$ は体なので、そのような素イデアルは $P$ だけ。よって $P$ は $(\boldsymbol{x},f)$ 上の極小素イデアルで $\operatorname{ht}P\le d+1$。$\operatorname{depth}B_{P}\ge d+1\ge\dim B_{P}$。
:::

::: corollary CM 環は普遍鎖状 {#ring:cm-universally-catenary keywords="Cohen-Macaulay rings are catenary and universally catenary" index="鎖状環|さじょうかん, 普遍鎖状|ふへんさじょう"}
（AC）環 $A$ の素イデアル $\mathfrak{p}\subset\mathfrak{q}$ の間の飽和な鎖（間に素イデアルを挿入できない鎖）の長さがすべて等しいとき、$A$ を**鎖状**という。有限生成 $A$ 代数がすべて鎖状のとき**普遍鎖状**という。CM 環は普遍鎖状である。
:::

::: proof
**Step 1（CM 環は鎖状）.** CM 環 $A$ と $\mathfrak{p}\subset\mathfrak{q}$ について、CM 局所環 $A_{\mathfrak{q}}$（\ref{ring:cm-localization-fact.3}）で 2 を $\mathfrak{p}A_{\mathfrak{q}}$ に使うと $\operatorname{ht}\mathfrak{p}+\operatorname{ht}(\mathfrak{q}/\mathfrak{p})=\operatorname{ht}\mathfrak{q}$（$\operatorname{ht}(\mathfrak{q}/\mathfrak{p})\defeq\dim A_{\mathfrak{q}}/\mathfrak{p}A_{\mathfrak{q}}$）。飽和な鎖 $\mathfrak{p}=\mathfrak{p}_{0}\subsetneq\cdots\subsetneq\mathfrak{p}_{l}=\mathfrak{q}$ では各段で $\operatorname{ht}(\mathfrak{p}_{j+1}/\mathfrak{p}_{j})=1$ なので $\operatorname{ht}\mathfrak{p}_{j+1}=\operatorname{ht}\mathfrak{p}_{j}+1$、足して $l=\operatorname{ht}\mathfrak{q}-\operatorname{ht}\mathfrak{p}$（高さは有限。\ref{ring:height-theorem}）。

**Step 2（剰余環）.** 鎖状環の剰余環は鎖状：$A/I$ の素イデアルの鎖は $I$ を含む $A$ の素イデアルの鎖と同じ。

**Step 3（普遍鎖状）.** 有限生成 $A$ 代数は $A[x_{1},\dots,x_{n}]$ の剰余環で、\ref{ring:cm-polynomial} を $n$ 回使うと CM、Step 1・2 から鎖状。
:::

::: supplement
**正則局所環との関係.** 正則 ⇒ 完全交叉 ⇒ ゴレンシュタイン ⇒ CM ⇒（$\dim A/\mathfrak{p}=\dim A$ が全随伴素イデアルで成り立つ）。どの逆も成り立たない（\ref{ring:page-gorenstein}）。

**幾何的な意味.** CM 性は「局所的にどこでも同じ\term[次元]{ring:krull-dimension}で、埋め込まれた低次元の部分をもたない」性質の強いもので、代数多様体の交わりの重複度が「素朴に数えた値（長さ）」と一致するための条件（$\ell(A/(x))=e(x;A)$）としても現れる。セールの「交叉重複度」の理論や、双対性（CM なら双対化加群がある）で中心的な役割を果たす。
:::

## 正規性のセールの判定法 {#ring:sec-cm-serre-normality}

::: theorem 正規性のセールの判定法 {#ring:serre-normality keywords="Serre's criterion: a Noetherian domain is normal iff R1 and associated primes of nonzero principal ideals have height one (S2)" index="セールの判定法（正規性）|せーるのはんていほうせいきせい, R1|あーるいち, S2|えすに" refname="正規性のセールの判定法"}
（AC）ネーター整域 $A$ について、次は同値である。
1. $A$ は正規。
2. （$R_{1}$）高さ $1$ の素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ は離散付値環、かつ（$S_{2}$）$0$ でない $a\in A$ について $\operatorname{Ass}(A/aA)$ の元はすべて高さ $1$。

条件 $S_{2}$ は「高さ $2$ 以上の素イデアル $\mathfrak{p}$ で $\operatorname{depth}A_{\mathfrak{p}}\ge 2$」と同値である。
:::

::: proof
**Step 1（1⇒2）.** $R_{1}$ は \ref{ring:normal-intersection-dvr} の Step 1、$S_{2}$ は \ref{ring:normal-principal-ass}。

**Step 2（2⇒1）.** $x=b/a\in K$ が $A$ 上整とする。各 $\mathfrak{p}\in\operatorname{Ass}(A/aA)$ は高さ $1$ で $A_{\mathfrak{p}}$ は離散付値環（正規。\ref{ring:valuation-properties.3}）なので $x\in A_{\mathfrak{p}}$、$b\in aA_{\mathfrak{p}}$。\ref{ring:normal-intersection-dvr} の Step 2 と同じ議論で $b\in aA$、$x\in A$。

**Step 3（深さによる言い換え）.** $\operatorname{ht}\mathfrak{p}\ge 2$ で $\operatorname{depth}A_{\mathfrak{p}}\le 1$ とすると、整域なので深さは $1$ で、$0\neq a\in\mathfrak{p}$ について $A_{\mathfrak{p}}/aA_{\mathfrak{p}}$ の深さは $0$（\ref{ring:depth-ext}）、$\mathfrak{p}A_{\mathfrak{p}}\in\operatorname{Ass}$ なので $\mathfrak{p}\in\operatorname{Ass}(A/aA)$（\ref{ring:ass-localization}）、$S_{2}$ に反する。逆に $\mathfrak{p}\in\operatorname{Ass}(A/aA)$, $\operatorname{ht}\mathfrak{p}\ge 2$ なら、$A_{\mathfrak{p}}$ で $a$ は正則で $A_{\mathfrak{p}}/aA_{\mathfrak{p}}$ の深さは $0$、$\operatorname{depth}A_{\mathfrak{p}}=1$。
:::

::: corollary 正規環の例 {#ring:normal-examples-serre keywords="regular local rings and UFDs are normal; normal domains of dimension one are exactly the Dedekind domains" index="正規環の例|せいきかんのれい"}
（AC）
1. $1$ \term[次元]{ring:krull-dimension}のネーター整域が正規 $\iff$ デデキント環 $\iff$ 高さ $1$ の局所化がすべて離散付値環。
2. CM 整域（局所化がすべて CM）は $S_{2}$ をみたし、さらに $R_{1}$ をみたせば正規。例えば $k[x,y,z]_{(x,y,z)}/(z^{2}-xy)$ は正規（一意分解環でないこと \ref{ring:prob-ru-not-ufd} と対照的）。
:::

::: proof
**Step 1（1）.** $\dim 1$ では $S_{2}$ は自動的（$0$ でない素イデアルは高さ $1$）なので、セールの判定法と \ref{ring:dedekind-local}。

**Step 2（2）.** CM 局所環では $\operatorname{depth}=\dim$（\ref{ring:cohen-macaulay}）なので $\operatorname{ht}\mathfrak{p}\ge 2$ で深さ $\ge 2$。例：$R=k[x,y,z]_{(x,y,z)}$（3 \term[次元]{ring:krull-dimension}の正則局所環）と $A=R/(z^{2}-xy)$。$A$ は整域（$k[x,y,z]/(z^{2}-xy)\cong k[s^{2},st,t^{2}]$ を \ref{ring:prob-ru-not-ufd} の Step 1 と同様に示し、その局所化）で、正則局所環の超曲面なので CM（\ref{ring:prob-cm-hypersurface}）、高さ $2$ 以上の素イデアルは極大イデアルだけで、$S_{2}$ をみたす。$R_{1}$：高さ $1$ の素イデアル $\mathfrak{p}$ について、$x\notin\mathfrak{p}$ なら $A[1/x]$ では $y=z^{2}/x$ なので $A[1/x]$ は $k[x,x^{-1},z]$ の局所化、$A_{\mathfrak{p}}$ はその局所化で、一意分解環の局所化として正規（\ref{ring:ufd-normal}, \ref{ring:integral-localization}）な $1$ 次元ネーター局所整域、すなわち DVR。$y\notin\mathfrak{p}$ も同様。$x,y\in\mathfrak{p}$ なら $z^{2}\in\mathfrak{p}$ から $z\in\mathfrak{p}$ で $\mathfrak{p}$ は極大イデアル（高さ $2$）となり起こらない。よって $A$ は正規。
:::

## 問題 {#ring:sec-cm-problems}

::: problem {#ring:prob-cm-hypersurface}
$(A,\mathfrak{m})$ を CM 局所環、$x\in\mathfrak{m}$ を非零因子とすると $A/xA$ は CM であること（\ref{ring:cm-properties.2}）から、正則局所環を $0$ でない元で割った環（超曲面）は CM であることを示せ。例えば $k[[x,y]]/(y^{2}-x^{3})$ は正則でないが CM である。
:::

::: solution
正則局所環は CM（例 1）で整域（\ref{ring:regular-domain}）なので、$0\neq f\in\mathfrak{m}$ は非零因子。\ref{ring:cm-properties.2} から $A/fA$ は CM。$k[[x,y]]/(y^{2}-x^{3})$ は正則でない（\ref{ring:regular-examples.5}）が、このようにして CM。
:::

::: problem {#ring:prob-not-cm-union}
$A=k[[x,y,z]]/(xy,xz)$ が CM でないことを、深さを直接計算して確かめよ（$\dim A=2$, $\operatorname{depth}A=1$）。
:::

::: solution
$(xy,xz)=(x)\cap(y,z)$ なので $\operatorname{Ass}A=\{(x),(y,z)\}$（どちらも素、無駄のない分解）、$\dim A=\max(\dim A/(x),\dim A/(y,z))=\max(2,1)=2$。$\mathfrak{m}\notin\operatorname{Ass}$ なので深さ $\ge 1$。$f=x+y$（両方の随伴素イデアルの外）は非零因子で、$A/fA\cong k[[x,y,z]]/(xy,xz,x+y)\cong k[[x,z]]/(x^{2},xz)$（$y=-x$）。後者では $\bar x\neq 0$ が $\mathfrak{m}$ で消されるので深さ $0$。よって $\operatorname{depth}A=1<2$。
:::
