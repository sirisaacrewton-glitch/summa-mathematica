# 操作で保たれる性質 {#ring:page-operations-invariance keywords="regular, Cohen-Macaulay, Gorenstein are preserved by polynomial extension and completion, quotient by a regular element, faithfully flat descent, regular ring, Gorenstein ring"}

正則・コーエン＝マコーレー（CM）・ゴレンシュタインという局所環の三つのクラスと、被約・整域・正規という性質が、次の四つの操作の前後でどう振る舞うかを調べる：多項式環 $A\mapsto A[t]$、完備化 $A\mapsto\hat A$、正則元による剰余 $A\mapsto A/xA$、忠実平坦な拡大 $A\to B$ からの降下。結論は「正則・CM・ゴレンシュタインは前の三つで両方向に保たれる（剰余の正則性だけは条件付き）」「整域・被約・正規は剰余や完備化では保たれない」で、最後に表にまとめる。局所化での保存は \ref{ring:cm-localization-fact}, \ref{ring:regular-localization}, \ref{ring:gorenstein-hierarchy} で示した。

## 記法と定義の確認 {#ring:sec-oi-notation}

::: notation
- 環は可換でネーター。$(A,\mathfrak{m},k)$ はネーター局所環、$\operatorname{edim}A=\dim_{k}\mathfrak{m}/\mathfrak{m}^{2}$。正則局所環は \ref{ring:regular-local-ring}、CM は \ref{ring:cohen-macaulay}、ゴレンシュタインは \ref{ring:gorenstein}、パラメーター系は \ref{ring:system-of-parameters}、深さの Ext による特徴付けは \ref{ring:depth-ext}。
- ゴレンシュタイン局所環の特徴付け（CM で、パラメーター系 $\boldsymbol{x}$ について $\operatorname{Soc}(A/(\boldsymbol{x}))\defeq(0:_{A/(\boldsymbol{x})}\mathfrak{m})$ が $k$ 上 1 \term[次元]{lin:dimension}）は \ref{ring:gorenstein-characterization}。
- 平坦な拡大と商イデアルの交換は \ref{ring:flat-extension-intersection}、平坦な拡大の下降定理は \ref{ring:going-down-flat}、忠実平坦性は \ref{mod:faithfully-flat}。
- 多項式環の変数は $t$ と書き、$B\defeq A[t]$。
- **選択公理**：次元論・深さ・局所化の議論を通して全体で使う。
:::

::: definition 正則環・ゴレンシュタイン環 {#ring:regular-ring keywords="regular ring, Gorenstein ring (not necessarily local)" index="正則環|せいそくかん, ゴレンシュタイン環（大域）|ごれんしゅたいんかんたいいき"}
ネーター環 $A$ のすべての素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ が正則局所環（ゴレンシュタイン局所環）のとき、$A$ を**正則環**（**ゴレンシュタイン環**）という。\ref{ring:regular-localization}（\ref{ring:gorenstein-hierarchy.4}）から、極大イデアルだけで確かめれば十分である。CM 環（\ref{ring:cohen-macaulay}）についても同じ（\ref{ring:cm-localization-fact}）。
:::

## 多項式環 {#ring:sec-oi-polynomial}

::: lemma 多項式環の素イデアルの局所構造 {#ring:polynomial-fiber-primes keywords="primes of A[t] lying over the maximal ideal of a local ring, height" index="多項式環の素イデアル|たこうしきかんのそいである"}
（AC）$(A,\mathfrak{m},k)$ を $d$ \term[次元]{ring:krull-dimension}のネーター局所環、$x_{1},\dots,x_{d}$ をパラメーター系、$B=A[t]$、$P\in\Spec B$ で $P\cap A=\mathfrak{m}$ とする。次のどちらかが成り立つ。
1. $P=\mathfrak{m}B$。このとき $\operatorname{ht}P=d$ で、$P$ は $(\boldsymbol{x})B$ を含む極小な素イデアル。
2. $P=\mathfrak{m}B+fB$（$f\in A[t]$ はモニックで、$k[t]$ での像 $\bar f$ は既約）。このとき $\operatorname{ht}P=d+1$ で、$P$ は $(\boldsymbol{x},f)B$ を含む極小な素イデアル。
:::

::: proof
**Step 1（形）.** $B/\mathfrak{m}B\cong k[t]$（\ref{ring:polynomial-quotient-commutes.1}）は整域なので $\mathfrak{m}B$ は素イデアル。$P\supset\mathfrak{m}B$ で、$P/\mathfrak{m}B$ は PID $k[t]$ の素イデアルなので $0$ か $(\bar f)$（$\bar f$ はモニック既約）。後者では $\bar f$ のモニックな持ち上げ $f$ をとれば $P=\mathfrak{m}B+fB$。

**Step 2（1 の極小性と高さ $\le d$）.** パラメーター系の定義から $\mathfrak{m}^{N}\subset(\boldsymbol{x})$ となる $N$ があり、$(\mathfrak{m}B)^{N}\subset(\boldsymbol{x})B$。よって $(\boldsymbol{x})B$ を含む素イデアルは $\mathfrak{m}B$ を含み、素イデアル $\mathfrak{m}B$ は $(\boldsymbol{x})B$ を含む極小な素イデアル。高さ定理（\tref{ring:height-theorem}）から $\operatorname{ht}\mathfrak{m}B\le d$。

**Step 3（1 の高さ $\ge d$）.** $B$ は自由 $A$ 加群なので平坦。$\dim A=d$ なので $A$ の素イデアルの鎖 $\mathfrak{m}=\mathfrak{p}_{0}\supsetneq\mathfrak{p}_{1}\supsetneq\dots\supsetneq\mathfrak{p}_{d}$ がある。平坦な拡大の下降定理（\ref{ring:going-down-flat}）を繰り返し使うと、$\mathfrak{m}B=\mathfrak{q}_{0}\supset\mathfrak{q}_{1}\supset\dots\supset\mathfrak{q}_{d}$, $\mathfrak{q}_{i}\cap A=\mathfrak{p}_{i}$ となる素イデアルの鎖がとれる。縮約が相異なるので包含は真で、$\operatorname{ht}\mathfrak{m}B\ge d$。

**Step 4（2）.** $(\boldsymbol{x},f)B$ を含む素イデアルは Step 2 から $\mathfrak{m}B$ を含み、$f$ も含むので $P$ を含む。よって $P$ は $(\boldsymbol{x},f)B$ を含む極小な素イデアルで、高さ定理から $\operatorname{ht}P\le d+1$。$\bar f\neq0$ なので $f\notin\mathfrak{m}B$、$\mathfrak{m}B\subsetneq P$ で、Step 3 から $\operatorname{ht}P\ge\operatorname{ht}\mathfrak{m}B+1=d+1$。
:::

::: theorem 多項式環での保存 {#ring:polynomial-invariance keywords="A is regular / Cohen-Macaulay / Gorenstein iff A[t] is" index="多項式環と正則性|たこうしきかんとせいそくせい"}
（AC）ネーター環 $A$ について、
1. $A$ が正則環 $\iff$ $A[t]$ が正則環。
2. $A$ が CM 環 $\iff$ $A[t]$ が CM 環。
3. $A$ がゴレンシュタイン環 $\iff$ $A[t]$ がゴレンシュタイン環。
:::

::: proof
**Step 1（$\Rightarrow$ の帰着）.** $P\in\Spec B$, $\mathfrak{p}=P\cap A$, $S=A\setminus\mathfrak{p}$ とすると、$B_{P}=(S^{-1}B)_{S^{-1}P}$ で $S^{-1}B=A_{\mathfrak{p}}[t]$（\ref{ring:localization-commutes.2}）、$S^{-1}P\cap A_{\mathfrak{p}}=\mathfrak{p}A_{\mathfrak{p}}$。よって $A$ を $d$ \term[次元]{ring:krull-dimension}の局所環 $(A,\mathfrak{m},k)$（正則・CM・ゴレンシュタインのいずれか）、$P\cap A=\mathfrak{m}$ として、$B_{P}$ が同じ性質をもつことを示せばよい。

**Step 2（1 の $\Rightarrow$）.** $A$ は正則なので $\mathfrak{m}=(x_{1},\dots,x_{d})$（正則なパラメーター系。パラメーター系でもある）。\ref{ring:polynomial-fiber-primes.1} の場合、$PB_{P}=\mathfrak{m}B_{P}$ は $d$ 個の元で生成され $\dim B_{P}=d$。2 の場合、$PB_{P}$ は $x_{1},\dots,x_{d},f$ の $d+1$ 個で生成され $\dim B_{P}=d+1$。どちらも $\operatorname{edim}B_{P}\le\dim B_{P}$ で、逆向きの不等式（\ref{ring:dimension-corollaries.1}）と合わせて $B_{P}$ は正則。

**Step 3（2 の $\Rightarrow$）.** \ref{ring:cm-polynomial}。

**Step 4（3 の $\Rightarrow$：準備）.** ゴレンシュタイン局所環 $A$ は CM（\ref{ring:gorenstein-hierarchy.3}）なので、Step 3 から $B_{P}$ は CM。パラメーター系 $\boldsymbol{x}$ をとり $\bar A\defeq A/(\boldsymbol{x})$ とすると、\ref{ring:gorenstein-characterization.4} から $\operatorname{Soc}\bar A=(0:_{\bar A}\bar{\mathfrak{m}})=ks$（$s\neq0$）。$\bar A\to\bar A[t]$ は自由（平坦）。

**Step 5（3 の $\Rightarrow$：1 の場合）.** \ref{ring:polynomial-fiber-primes.1} から $\boldsymbol{x}$ は $B_{P}$ のパラメーター系（$\dim B_{P}=d$ で、$PB_{P}$ は $(\boldsymbol{x})B_{P}$ を含む唯一の素イデアル）。$C\defeq B_{P}/(\boldsymbol{x})B_{P}\cong(\bar A[t])_{\bar{\mathfrak{m}}\bar A[t]}$ は局所環で、極大イデアルは $\bar{\mathfrak{m}}C$。$\bar A\to C$ は平坦（自由加群の局所化）なので、\ref{ring:flat-extension-intersection.2}（$I=0$, $J=\bar{\mathfrak{m}}$）から
$$
\operatorname{Soc}C=(0:_{C}\bar{\mathfrak{m}}C)=(0:_{\bar A}\bar{\mathfrak{m}})C=sC.
$$
$sC$ は $\bar{\mathfrak{m}}C$ で零化されるので剰余体 $C/\bar{\mathfrak{m}}C$ 上のベクトル空間で、$s$ で生成されるので 1 次元以下。$C$ の中で $s\neq0$ であること：$us=0$（$u\in\bar A[t]\setminus\bar{\mathfrak{m}}\bar A[t]$）とすると、$u$ のある係数 $u_{j}$ は $\bar{\mathfrak{m}}$ に属さず $\bar A$ の単元で、係数を比べて $u_{j}s=0$、$s=0$ となり矛盾。よって $\dim\operatorname{Soc}C=1$ で、\ref{ring:gorenstein-characterization.3} から $B_{P}$ はゴレンシュタイン。

**Step 6（3 の $\Rightarrow$：2 の場合）.** 同様に $\boldsymbol{x},f$ は $B_{P}$ のパラメーター系。$D\defeq\bar A[t]/(\bar f)$（$\bar f$ は $f$ の像でモニック、次数 $e$）は、モニックな多項式による割り算（\ref{ring:polynomial-division}）から基底 $1,t,\dots,t^{e-1}$ をもつ自由 $\bar A$ 加群。$D$ は $\bar A$ 上整なので極大イデアルは $\bar{\mathfrak{m}}$ に縮約され（\ref{ring:integral-field.2}）$\bar{\mathfrak{m}}D$ を含み、$D/\bar{\mathfrak{m}}D\cong k[t]/(\bar f)$ は体なので、$D$ は $\bar{\mathfrak{m}}D$ を極大イデアルとする局所環。したがって $C\defeq B_{P}/(\boldsymbol{x},f)B_{P}\cong D_{\bar{\mathfrak{m}}D}=D$。Step 5 と同じく平坦性から $\operatorname{Soc}D=sD$ は $D/\bar{\mathfrak{m}}D$ 上 1 次元以下で、$D$ は自由で基底に $1$ を含むので $s\cdot1\neq0$。よって $B_{P}$ はゴレンシュタイン。

**Step 7（$\Leftarrow$）.** $\mathfrak{p}\in\Spec A$ とし、$P\defeq\mathfrak{p}B+tB$ とおく。$B/P\cong A/\mathfrak{p}$（$t\mapsto0$）は整域なので $P$ は素イデアル。$t$ は $B$ の非零因子なので $B_{P}$ の非零因子（局所化の完全性）で、
$$
B_{P}/tB_{P}\cong(B/tB)_{P}\cong A_{\mathfrak{p}}
$$
（$B/tB\cong A$ で $P$ の像は $\mathfrak{p}$）。CM なら \ref{ring:cm-properties.2}、ゴレンシュタインなら \ref{ring:rees-regular-sequence}（$r=1$）から $A_{\mathfrak{p}}$ も同じ。正則なら、$t\notin P^{2}B_{P}$ を示せば \ref{ring:regular-quotient.1} から $A_{\mathfrak{p}}$ は正則：$R\defeq(A/\mathfrak{p})[t]$ は整域で、$B_{P}\to R_{(t)}$ で $P$ は $(t)$ に移る。$t\in P^{2}B_{P}$ なら $R_{(t)}$ で $t=t^{2}g/u$（$u\notin(t)$）、整域なので $u=tg\in(t)$ となり矛盾。

::: hypcheck
- **前提「ネーター」**：$B$ のネーター性（\ref{ring:hilbert-basis}）、高さ定理、Ext の議論のすべてに使う。
- Step 5・6 は、ゴレンシュタインの判定が「一つのパラメーター系でソークルが 1 \term[次元]{lin:dimension}」で済む（\ref{ring:gorenstein-characterization.3}）ことを使っている。
:::
:::

::: remark 他の性質
ネーター性（\ref{ring:hilbert-basis}、逆は $A\cong B/tB$）、$\dim A[t]=\dim A+1$（\ref{ring:polynomial-dimension}）、被約・整域・正規（\ref{ring:preservation-table}、逆は $A\subset A[t]$ が部分環であることと $A=A[t]\cap\Frac A$）も多項式環で保たれる。冪級数環 $A[[t]]$ でも、ネーター局所環 $A$ について正則・CM・ゴレンシュタインは保たれることが知られている（$A$ が完備なら $A[[t]]$ は $A[t]_{(\mathfrak{m},t)}$ の完備化なので、この定理と次の \ref{ring:completion-invariance} から従う。一般の場合は本サイト未収録）。
:::

## 完備化 {#ring:sec-oi-completion}

::: proposition 完備化での保存 {#ring:completion-invariance keywords="dimension, depth, Cohen-Macaulay, Gorenstein, regular are invariant under completion" index="完備化と深さ|かんびかとふかさ"}
（AC）ネーター局所環 $(A,\mathfrak{m},k)$ とその $\mathfrak{m}$ 進完備化 $\hat A$ について、$\dim\hat A=\dim A$、$\operatorname{depth}\hat A=\operatorname{depth}A$ で、$A$ が正則・CM・ゴレンシュタインであることと $\hat A$ がそうであることはそれぞれ同値。
:::

::: proof
**Step 1（次元・正則）.** \ref{ring:regular-completion} とその証明（$\hat A/\hat{\mathfrak{m}}^{n}\cong A/\mathfrak{m}^{n}$ からヒルベルト＝サミュエル関数が一致し、次元定理で\term[次元]{ring:krull-dimension}が一致する）。

**Step 2（深さ）.** \ref{ring:depth-ext}（$I=\mathfrak{m}$）から $\operatorname{depth}A=\min\{i:\operatorname{Ext}^{i}_{A}(k,A)\neq0\}$、$\hat A$ についても同様（剰余体は $\hat A/\mathfrak{m}\hat A=k$）。$\hat A$ は平坦（\ref{ring:completion-flat}）なので、\ref{ring:gorenstein-completion} の証明と同じく $\operatorname{Ext}^{i}_{\hat A}(k,\hat A)\cong E\otimes_{A}\hat A$（$E\defeq\operatorname{Ext}^{i}_{A}(k,A)$）。$a\in\mathfrak{m}$ の掛け算は $k$ 上 $0$ なので関手性から $E$ 上でも $0$、すなわち $E$ は $k$ ベクトル空間（有限次元）。よって $E\otimes_{A}\hat A\cong E\otimes_{k}(k\otimes_{A}\hat A)\cong E\otimes_{k}k=E$ で、$\operatorname{Ext}$ の消え方が一致する。

**Step 3（CM・ゴレンシュタイン）.** CM は Step 1・2 から。ゴレンシュタインは \ref{ring:gorenstein-completion}。
:::

::: example 完備化で整域性が失われる例 {#ring:completion-not-domain keywords="node: a local domain whose completion is not a domain" index="結節点|けっせつてん"}
$k$ を標数 $2$ でない体、$R=k[x,y]_{(x,y)}$、$g=y^{2}-x^{2}-x^{3}$、$A=R/gR$（原点に結節点をもつ曲線の局所環）とする。
1. **$A$ は整域**：$g$ は $k[x,y]=(k[x])[y]$ で既約。実際 $g$ は $y$ についてモニックなので、分解するならモニックな 1 次式の積 $(y-a)(y-b)$（$a,b\in k[x]$）で、$y$ の係数から $b=-a$、定数項から $a^{2}=x^{2}+x^{3}$。左辺の次数は偶数、右辺は $3$ で矛盾。$k[x,y]$ は UFD（\ref{ring:polynomial-ufd}）なので $g$ は素元、$k[x,y]/(g)$ は整域で、その局所化 $A$（\ref{ring:localization-quotient}）も整域。
2. **$\hat A$ は整域でない**：$\hat A\cong\hat R/g\hat R$（\ref{ring:completion-tensor}, \ref{mod:tensor-quotient}）、$\hat R=k[[x,y]]$（\ref{ring:regular-examples.4}）。$k[[x]]$ に $s^{2}=1+x$ となる $s=1+c_{1}x+c_{2}x^{2}+\cdots$ がある（$x^{n}$ の係数を比べると $2c_{n}+(c_{1},\dots,c_{n-1}\text{ の式})=\delta_{n1}$ で、$2$ が可逆なので順に解ける）。すると $g=(y-xs)(y+xs)$。$y-xs\in g\hat R$ なら $y-xs=(y-xs)(y+xs)h$ で、整域 $k[[x,y]]$（\ref{ring:preservation-table}）で簡約して $1=(y+xs)h$ となるが、$y+xs$ は極大イデアルに属し矛盾。同様に $y+xs\notin g\hat R$。よって $\hat A$ は零因子をもつ。

幾何的には、結節点の近くでは曲線は 2 本の枝 $y=\pm x\sqrt{1+x}$ に分かれるが、$\sqrt{1+x}$ は多項式（の分数）では書けず、冪級数でだけ書ける。
:::

::: remark 被約性・正規性と完備化
被約・正規なネーター局所環の完備化が被約・正規とは限らないことも知られている（永田の例。本サイト未収録）。一方、体上有限生成な環の局所化のような「優秀環」では保たれることが知られている（未収録）。逆向き（$\hat A$ が被約・整域・正規なら $A$ も）は次の \ref{ring:faithfully-flat-descent} から従う。
:::

## 正則元による剰余 {#ring:sec-oi-quotient}

::: proposition 正則元による剰余 {#ring:regular-element-quotient keywords="quotient of a local ring by a non-zero-divisor: dimension, depth, CM, Gorenstein, regularity, domain, reduced" index="正則元による剰余|せいそくげんによるじょうよ"}
（AC）$(A,\mathfrak{m},k)$ をネーター局所環、$x\in\mathfrak{m}$ を非零因子、$\bar A=A/xA$ とする。
1. $\dim\bar A=\dim A-1$、$\operatorname{depth}\bar A=\operatorname{depth}A-1$。
2. $A$ が CM $\iff\bar A$ が CM。$A$ がゴレンシュタイン $\iff\bar A$ がゴレンシュタイン。
3. $\bar A$ が正則なら、$x\notin\mathfrak{m}^{2}$ で $A$ は正則。$A$ が正則なら、$\bar A$ が正則 $\iff x\notin\mathfrak{m}^{2}$。
4. $\bar A$ が整域なら $A$ は整域。$\bar A$ が被約なら $A$ は被約。
:::

::: proof
**Step 1（1）.** \term[次元]{ring:krull-dimension}は \ref{ring:dimension-corollaries.3}。深さ：\ref{ring:rees-regular-sequence}（$r=1$）から $\operatorname{Ext}^{i+1}_{A}(k,A)\cong\operatorname{Ext}^{i}_{\bar A}(k,\bar A)$。また $\operatorname{Ext}^{0}_{A}(k,A)=\Hom_{A}(k,A)=0$：$\varphi:k\to A$ の像は $\mathfrak{m}$ で零化されるので $x\varphi(1)=0$、$x$ は非零因子なので $\varphi(1)=0$。\ref{ring:depth-ext} から $\operatorname{depth}A=\operatorname{depth}\bar A+1$。

**Step 2（2）.** \ref{ring:cm-properties.2} と \ref{ring:rees-regular-sequence}。

**Step 3（3）.** $\bar A$ の極大イデアル $\bar{\mathfrak{m}}$ について $\bar{\mathfrak{m}}/\bar{\mathfrak{m}}^{2}\cong\mathfrak{m}/(\mathfrak{m}^{2}+xA)$。$x\in\mathfrak{m}^{2}$ なら $\operatorname{edim}\bar A=\operatorname{edim}A\ge\dim A>\dim\bar A$（1 と \ref{ring:dimension-corollaries.1}）で $\bar A$ は正則でない。よって $\bar A$ が正則なら $x\notin\mathfrak{m}^{2}$ で、\ref{ring:regular-quotient.2} から $A$ は正則。$A$ が正則で $x\notin\mathfrak{m}^{2}$ なら \ref{ring:regular-quotient.1} から $\bar A$ は正則。

**Step 4（4、整域）.** $\bar A$ が整域なので $xA$ は素イデアル。$xA$ に含まれる極小素イデアル $\mathfrak{p}$ をとる（素イデアルの減少鎖の共通部分は素イデアルなので、ツォルンの補題で $xA$ に含まれる極小なものがある）。極小素イデアルは $\operatorname{Ass}A$ に属し（\ref{ring:ass-localization.2}）、その元は零因子なので $x\notin\mathfrak{p}$。$a\in\mathfrak{p}$ を $a=xb$ と書くと、$xb\in\mathfrak{p}$, $x\notin\mathfrak{p}$ から $b\in\mathfrak{p}$。よって $\mathfrak{p}=x\mathfrak{p}\subset\mathfrak{m}\mathfrak{p}$ で、\ref{ring:nakayama.2}から $\mathfrak{p}=0$。$0$ が素イデアルなので $A$ は整域。

**Step 5（4、被約）.** $N\defeq\mathrm{nil}(A)$ とする。$a\in N$ の像は $\bar A$ で冪零なので $0$、$a=xb$ と書ける。$a^{n}=x^{n}b^{n}=0$ で $x$ は非零因子なので $b^{n}=0$、$b\in N$。よって $N=xN$ で、中山の補題から $N=0$。
:::

::: example 剰余で失われる性質 {#ring:regular-element-quotient-counterexamples keywords="quotient by a regular element need not be a domain, reduced, normal or regular" index="剰余の反例|じょうよのはんれい"}
$R=k[x,y]_{(x,y)}$（正則局所環で UFD、したがって正規。\ref{ring:regular-examples.4}、\ref{ring:regular-ufd}、\ref{ring:ufd-normal}）とする。
1. **整域でない**：$xy$ は $R$ の非零因子だが、$R/(xy)$ では $\bar x\bar y=0$、$\bar x\neq0$（$x\notin(xy)$）。
2. **被約でも正則でもない**：$k[x]_{(x)}$（DVR）の非零因子 $x^{2}\in\mathfrak{m}^{2}$ について $k[x]_{(x)}/(x^{2})$ は冪零元 $\bar x$ をもち、$\operatorname{edim}=1>0=\dim$。
3. **正規でない**：$A=R/(y^{2}-x^{3})$。$y^{2}-x^{3}$ は \ref{ring:completion-not-domain.1} と同じ次数の議論（$a^{2}=x^{3}$ は右辺の次数が奇数で不可能）で既約なので、$A$ は整域。$\tau\defeq\bar y/\bar x\in\Frac A$ は $\tau^{2}=\bar y^{2}/\bar x^{2}=\bar x$ をみたすので $A$ 上整。$\tau\in A$ とすると、持ち上げて $y=xa+(y^{2}-x^{3})h$（$a,h\in R$）。$x\mapsto0$ として $k[y]_{(y)}$ で $y=y^{2}\bar h$、すなわち $1=y\bar h$ となり、$y$ が単元になって矛盾。よって $A$ は正規でない（尖点）。
:::

::: remark 正規性の持ち上げ
$\bar A$ が正規なら $A$ も正規であることが知られている（セールの判定法 \ref{ring:serre-normality} を使う。本サイト未収録）。
:::

## 忠実平坦な拡大からの降下 {#ring:sec-oi-descent}

::: proposition 忠実平坦降下 {#ring:faithfully-flat-descent keywords="faithfully flat descent of Noetherian, reduced, domain, normal, regular" index="忠実平坦降下|ちゅうじつへいたんこうか"}
（AC）環準同型 $\varphi:A\to B$ で $B$ が忠実平坦 $A$ 加群とする。
1. $A$ 加群 $N$ について $N\to N\otimes_{A}B$, $n\mapsto n\otimes1$ は単射。特に $\varphi$ は単射で、$A$ のイデアル $I$ について $\varphi^{-1}(IB)=I$。
2. $B$ がネーター・被約・整域なら $A$ もそう。$B$ が正規整域なら $A$ も正規整域。
3. $\varphi$ が局所環の局所準同型 $(A,\mathfrak{m})\to(B,\mathfrak{n})$（$\varphi(\mathfrak{m})\subset\mathfrak{n}$）で $B$ が平坦なら、$B$ は忠実平坦。さらに $A,B$ がネーターで $B$ が正則なら $A$ は正則。
:::

::: proof
**Step 1（1）.** $\iota:N\to N\otimes B$ に $-\otimes B$ を施した $\iota\otimes1:N\otimes B\to N\otimes B\otimes B$, $n\otimes b\mapsto n\otimes1\otimes b$ は、$n\otimes b\otimes b'\mapsto n\otimes bb'$ という左逆写像をもつので単射。$K\defeq\Ker\iota$ とすると、平坦性から $0\to K\otimes B\to N\otimes B\xrightarrow{\iota\otimes1}N\otimes B\otimes B$ は完全で、$K\otimes B=0$。忠実平坦性（\ref{mod:faithfully-flat.2}）から $K=0$。$N=A$ で $\varphi$ の単射性、$N=A/I$ で $A/I\to B/IB$（\ref{mod:tensor-quotient}）の単射性、すなわち $\varphi^{-1}(IB)=I$。

**Step 2（2）.** ネーター：$A$ の昇鎖 $I_{1}\subset I_{2}\subset\cdots$ について $I_{k}B$ はある所から一定で、$I_{k}=\varphi^{-1}(I_{k}B)$ も一定。被約・整域：$\varphi$ は単射なので $A$ は $B$ の部分環とみなせる。正規：$K=\Frac A\subset\Frac B$ とし、$z=a/b\in K$（$a,b\in A$）が $A$ 上整とする。$z$ は $B$ 上整なので $z\in B$、$a=bz\in bB\cap A=bA$（1）で $z\in A$。

**Step 3（3、忠実平坦）.** $\mathfrak{m}B\subset\mathfrak{n}\neq B$ で、$A$ の極大イデアルは $\mathfrak{m}$ だけなので \ref{mod:faithfully-flat.3} から忠実平坦。

**Step 4（3、正則）.** $k=A/\mathfrak{m}$ の自由分解 $F$ をとる。$B$ は平坦なので $F\otimes_{A}B$ は $B/\mathfrak{m}B$ の自由 $B$ 分解で、ホモロジーと $-\otimes_{A}B$ は交換するから
$$
\begin{aligned}
\operatorname{Tor}^{A}_{i}(k,k)\otimes_{A}B&\cong H_{i}(F\otimes_{A}k\otimes_{A}B)\cong H_{i}\bigl((F\otimes_{A}B)\otimes_{B}(B/\mathfrak{m}B)\bigr)\\
&=\operatorname{Tor}^{B}_{i}(B/\mathfrak{m}B,B/\mathfrak{m}B).
\end{aligned}
$$
$B$ は正則なので $\operatorname{pd}_{B}(B/\mathfrak{m}B)\le\operatorname{pd}_{B}(B/\mathfrak{n})=\dim B$（\ref{ring:pd-tor-k.2}、\ref{ring:serre-regularity}）で、$i>\dim B$ で右辺は $0$。忠実平坦性から $\operatorname{Tor}^{A}_{i}(k,k)=0$（$i>\dim B$）、\ref{ring:pd-tor-k.1} から $\operatorname{pd}_{A}k<\infty$。\ref{ring:serre-regularity} から $A$ は正則。
:::

::: remark 降下と上昇
- CM・ゴレンシュタインも局所平坦準同型で降下することが知られている（次元公式 $\dim B=\dim A+\dim B/\mathfrak{m}B$ などを使う。本サイト未収録）。
- 上昇は成り立たない：$k\to k[t]/(t^{2})$ は自由（忠実平坦）だが、正則な $k$ から被約でない環になる。完備化 $A\to\hat A$ は局所平坦なので、\ref{ring:completion-invariance} の「$\hat A$ 正則 $\Rightarrow A$ 正則」は 3 からも従う。
:::

## 問題 {#ring:sec-oi-problems}

::: problem {#ring:prob-polynomial-gorenstein-example}
$A=k[x,y]/(x^{2},y^{2})$ はゴレンシュタイン環であることを、$A$ の唯一の素イデアル $(x,y)$ でのソークルを計算して示せ。さらに $A[t]$ もゴレンシュタイン環であることを、\ref{ring:polynomial-invariance} を使わずに素イデアル $P=(x,y)A[t]$ での局所化について確かめよ。
:::

::: solution
**$A$.** $A$ は $k$ 上 $1,x,y,xy$ を基底とする 4 \term[次元]{lin:dimension}の局所環で、素イデアルは $\mathfrak{m}=(x,y)$ だけ（$x,y$ は冪零）。$a=c_{0}+c_{1}x+c_{2}y+c_{3}xy$ について $xa=c_{0}x+c_{2}xy$、$ya=c_{0}y+c_{1}xy$ なので、$\mathfrak{m}a=0\iff c_{0}=c_{1}=c_{2}=0$。よって $\operatorname{Soc}A=k\cdot xy$ は 1 次元で、$0$ \term[次元]{ring:krull-dimension}（パラメーター系は空）なので \ref{ring:gorenstein-characterization.3} からゴレンシュタイン。

**$A[t]$ の $P$ での局所化.** $A[t]$ の素イデアルは冪零元 $x,y$ を含むので $P=\mathfrak{m}A[t]$（素イデアル）を含み、$P$ は唯一の極小素イデアル。よって $C=A[t]_{P}$ は $0$ 次元。$C$ は $A$ 上平坦なので $\operatorname{Soc}C=(0:_{C}\mathfrak{m}C)=(0:_{A}\mathfrak{m})C=xy\,C$（\ref{ring:flat-extension-intersection.2}）。$xy\,C$ は $C/\mathfrak{m}C=k(t)$ 上 $xy$ で生成され、$C$ の中で $xy\neq0$：$u\in A[t]\setminus P$ で $u\cdot xy=0$ とすると、係数ごとに $u_{j}xy=0$ で、$u\notin P$ からある係数 $u_{j}$ は $\mathfrak{m}$ に属さず単元なので $xy=0$ となり矛盾。よって 1 次元で $C$ はゴレンシュタイン。
:::
