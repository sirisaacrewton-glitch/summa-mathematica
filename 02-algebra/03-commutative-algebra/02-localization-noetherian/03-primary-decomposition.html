# 準素分解と随伴素イデアル {#ring:page-primary-decomposition keywords="associated prime, Ass(M), 素因子, zero divisors, prime filtration, primary submodule, primary ideal, primary decomposition, Lasker-Noether theorem, embedded prime, irreducible submodule"}

整数 $n=\prod p_{i}^{e_{i}}$ のイデアルは $n\Z=\bigcap p_{i}^{e_{i}}\Z$ と素数冪のイデアルの共通部分に分解する。ネーター環ではこれが一般化され、すべてのイデアル（加群の部分加群）が**準素イデアル**の有限個の共通部分に分解する（**ラスカー＝ネーターの定理**、\ref{ring:primary-decomposition}）。分解そのものは一意でないが、現れる素イデアルの組は一意で、それが**随伴素イデアル**の集合 $\operatorname{Ass}$ である（\ref{ring:associated-prime}）。このページでは随伴素イデアルを先に調べ（零因子の集合との関係 \ref{ring:zero-divisors-ass}、有限性 \ref{ring:prime-filtration}、局所化と台との関係）、それを使って準素分解の存在と一意性を示す。随伴素イデアルは、深さや\see{ring:page-cohen-macaulay}の議論でも中心的な役割を果たす。

> 松村『可換環論』§6 の流れ（随伴素イデアルを先に扱う方式）を参考にした。

## 記法と定義の確認 {#ring:sec-pd-notation}

::: notation
- 環は可換、加群は $A$ 加群。ネーター環・極大条件・ネーター帰納法は \ref{ring:noetherian-module}, \ref{ring:noetherian-prime-product}、局所化と台は \ref{ring:module-localization}, \ref{ring:support}, \ref{ring:support-properties}、零化イデアルと巡回加群は \ref{mod:annihilator}, \ref{mod:cyclic-module}、根基は \ref{ring:radical-ideal}。
- $a\in A$ が加群 $M$ の**零因子**とは、$ax=0$ となる $0\neq x\in M$ があること。
- **選択公理**：ネーター環の極大条件・ネーター帰納法を通して従属選択公理を使う。
:::

## 随伴素イデアル {#ring:sec-pd-ass}

::: definition 随伴素イデアル {#ring:associated-prime keywords="associated prime of a module, Ass(M)" index="随伴素イデアル|ずいはんそいである, 付属素イデアル|ふぞくそいである"}
$A$ 加群 $M$ について、ある $x\in M$ の零化イデアル $\operatorname{Ann}(x)$ として表される素イデアル $\mathfrak{p}$ を $M$ の**随伴素イデアル**といい、その全体を $\operatorname{Ass}(M)$（$\operatorname{Ass}_{A}(M)$）と書く。$\mathfrak{p}\in\operatorname{Ass}(M)$ は、$A/\mathfrak{p}$ と同型な部分加群 $Ax\subset M$ があることと同値である（\ref{mod:cyclic-module}）。
:::

::: example
1. 素イデアル $\mathfrak{p}$ について $\operatorname{Ass}(A/\mathfrak{p})=\{\mathfrak{p}\}$：$A/\mathfrak{p}$ は整域なので、$0$ でない元の零化イデアルはすべて $\mathfrak{p}$。
2. $\Z/12\Z$ では $\operatorname{Ann}(6)=2\Z$, $\operatorname{Ann}(4)=3\Z$ で、$\operatorname{Ass}=\{2\Z,3\Z\}$（他の元の零化イデアルは $4\Z,6\Z,12\Z$ など素でないか、同じもの）。
3. $\operatorname{Ass}(0)=\emptyset$。
:::

::: theorem 随伴素イデアルの存在 {#ring:ass-nonempty keywords="maximal annihilators are associated primes, Ass(M) is nonempty" index="随伴素イデアルの存在|ずいはんそいであるのそんざい"}
（DC）$A$ をネーター環、$M\neq 0$ を $A$ 加群とする。$\{\operatorname{Ann}(x) : 0\neq x\in M\}$ の極大元は素イデアルである。特に $\operatorname{Ass}(M)\neq\emptyset$。
:::

::: proof
**Step 1.** $M\neq 0$ なので集合 $\Sigma=\{\operatorname{Ann}(x) : x\neq 0\}$ は空でなく、ネーター性から極大元 $\mathfrak{p}=\operatorname{Ann}(x)$ をもつ（\ref{ring:noetherian-module.2}）。$x\neq 0$ なので $1\notin\mathfrak{p}$ である。

**Step 2.** $ab\in\mathfrak{p}$, $b\notin\mathfrak{p}$ とする。$b\notin\operatorname{Ann}(x)$ なので $bx\neq 0$ であり、$\operatorname{Ann}(bx)\supset\operatorname{Ann}(x)=\mathfrak{p}$ である。極大性から $\operatorname{Ann}(bx)=\mathfrak{p}$ となる。$a(bx)=abx=0$ なので $a\in\operatorname{Ann}(bx)=\mathfrak{p}$ である。よって $\mathfrak{p}$ は素イデアルである。

::: hypcheck
- **前提「ネーター」**：Step 1 の極大元の存在に使った。外すと偽：有理数冪の環 $V$（\ref{ring:rational-exponent-ring}）と $M=V/tV$ では、$0$ でない元 $\bar x$（$x=t^{q}u$, $0\le q<1$）の零化イデアルは $\{a : \operatorname{ord}a\ge 1-q\}$ で、$V$ の素イデアル $0$, $\mathfrak{m}V=\{\operatorname{ord}>0\}$ のどちらでもない。よって $\operatorname{Ass}(M)=\emptyset$。
:::
:::

::: corollary 零因子と随伴素イデアル {#ring:zero-divisors-ass keywords="the set of zero divisors on M is the union of the associated primes" index="零因子の集合|れいいんしのしゅうごう"}
（DC）ネーター環 $A$ と加群 $M$ について、$M$ の零因子全体は $\bigcup_{\mathfrak{p}\in\operatorname{Ass}(M)}\mathfrak{p}$ に等しい。
:::

::: proof
$a$ が零因子で、$ax=0$, $x\neq 0$ とする。このとき $a\in\operatorname{Ann}(x)$ である。集合 $\Sigma_{x}\defeq\{\operatorname{Ann}(y) : y\neq 0,\ \operatorname{Ann}(y)\supset\operatorname{Ann}(x)\}$ は $\operatorname{Ann}(x)$ を元にもつので空でなく、ネーター性から極大元 $\operatorname{Ann}(y)$ をもつ（\ref{ring:noetherian-module.2}）。$\operatorname{Ann}(y)$ は \ref{ring:ass-nonempty} の Step 2 と同じ議論で素イデアルである（$b\notin\operatorname{Ann}(y)$ なら $by\neq 0$ かつ $\operatorname{Ann}(by)\supset\operatorname{Ann}(y)\supset\operatorname{Ann}(x)$ なので $\operatorname{Ann}(by)\in\Sigma_{x}$ であり、極大性の比較をこの集合の中で行える）。ゆえに $a\in\operatorname{Ann}(x)\subset\operatorname{Ann}(y)\in\operatorname{Ass}(M)$ である。逆に $a\in\mathfrak{p}=\operatorname{Ann}(x)$（$x\neq 0$）なら $ax=0$ なので、$a$ は零因子である。
:::

::: proposition 完全列と随伴素イデアル {#ring:ass-exact keywords="Ass of a short exact sequence" index="随伴素イデアルと完全列|ずいはんそいであるとかんぜんれつ"}
短完全列 $0\to M'\to M\to M''\to 0$ について $\operatorname{Ass}(M')\subset\operatorname{Ass}(M)\subset\operatorname{Ass}(M')\cup\operatorname{Ass}(M'')$。
:::

::: proof
**Step 1（左の包含）.** $M'$ を $M$ の部分加群とみなせば、$M'$ の元の零化イデアルは $M$ の元としての零化イデアルと同じなので、左の包含が成り立つ。

**Step 2（右の包含）.** $\mathfrak{p}=\operatorname{Ann}(x)\in\operatorname{Ass}(M)$ とし、$N\defeq Ax\cong A/\mathfrak{p}$ とおく。$A/\mathfrak{p}$ は整域なので、$N$ の $0$ でない元の零化イデアルはすべて $\mathfrak{p}$ である。$N\cap M'\neq 0$ の場合、その $0$ でない元 $y$ について $\operatorname{Ann}(y)=\mathfrak{p}$ なので $\mathfrak{p}\in\operatorname{Ass}(M')$ である。$N\cap M'=0$ の場合、$N$ は $M''$ に単射で移り、像は $A/\mathfrak{p}$ と同型なので $\mathfrak{p}\in\operatorname{Ass}(M'')$ である。
:::

::: theorem 素イデアルによるフィルトレーションと有限性 {#ring:prime-filtration keywords="prime filtration of a finitely generated module, Ass(M) is finite" index="素イデアルによるフィルトレーション|そいであるによるふぃるとれーしょん"}
（DC）$A$ をネーター環、$M$ を有限生成 $A$ 加群とする。
1. 部分加群の列 $0=M_{0}\subset M_{1}\subset\dots\subset M_{n}=M$ で、各 $M_{i}/M_{i-1}\cong A/\mathfrak{p}_{i}$（$\mathfrak{p}_{i}$ は素イデアル）となるものがある。
2. $\operatorname{Ass}(M)\subset\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}\}$。特に $\operatorname{Ass}(M)$ は有限集合。
:::

::: proof
**Step 1（1）.** $M=0$ なら $n=0$ とすればよい。$M\neq 0$ なら $\mathfrak{p}_{1}=\operatorname{Ann}(x_{1})\in\operatorname{Ass}(M)$ をとり（\ref{ring:ass-nonempty}）、$M_{1}\defeq Ax_{1}\cong A/\mathfrak{p}_{1}$ とおく。$M/M_{1}\neq 0$ ならその随伴素イデアル $\mathfrak{p}_{2}=\operatorname{Ann}(\bar x_{2})$ をとり、$M_{2}\defeq M_{1}+Ax_{2}$ とおく（このとき $M_{2}/M_{1}=A\bar x_{2}\cong A/\mathfrak{p}_{2}$）。これを続けると、$M_{1}\subsetneq M_{2}\subsetneq\cdots$ はネーター加群 $M$（\ref{ring:noetherian-exact.2}）の昇鎖なので有限で止まり、止まるのは $M_{n}=M$ のときである。

**Step 2（2）.** $0\to M_{i-1}\to M_{i}\to A/\mathfrak{p}_{i}\to 0$ に \ref{ring:ass-exact} を使うと $\operatorname{Ass}(M_{i})\subset\operatorname{Ass}(M_{i-1})\cup\{\mathfrak{p}_{i}\}$ である。$i$ について帰納法を使うと $\operatorname{Ass}(M)\subset\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}\}$ を得る。
:::

::: proposition 局所化と台 {#ring:ass-localization keywords="Ass commutes with localization, minimal primes of the support are associated" index="随伴素イデアルと局所化|ずいはんそいであるときょくしょか"}
（DC）$A$ をネーター環、$M$ を $A$ 加群、$S$ を積閉集合とする。
1. $\operatorname{Ass}_{S^{-1}A}(S^{-1}M)=\{S^{-1}\mathfrak{p} : \mathfrak{p}\in\operatorname{Ass}(M),\ \mathfrak{p}\cap S=\emptyset\}$。
2. $\operatorname{Ass}(M)\subset\operatorname{Supp}(M)$ で、$\operatorname{Supp}(M)$ の（包含について）極小な元は $\operatorname{Ass}(M)$ に属する。特に、イデアル $I$ を含む素イデアルのうち極小なものは $\operatorname{Ass}(A/I)$ に属する。
3. $\operatorname{Supp}(M)$ のどの元も、$\operatorname{Ass}(M)$ のある元を含む。したがって、$\operatorname{Ass}(M)$ の極小元と $\operatorname{Supp}(M)$ の極小元は一致する。
:::

::: proof
**Step 1（1、⊃）.** $\mathfrak{p}=\operatorname{Ann}(x)$, $\mathfrak{p}\cap S=\emptyset$ とする。$b\in A$, $s\in S$ について、$\frac{b}{s}\cdot\frac{x}{1}=0\iff$ ある $u\in S$ で $ubx=0\iff ub\in\mathfrak{p}\iff b\in\mathfrak{p}$ である（最後の同値は $u\notin\mathfrak{p}$ による）。よって $\operatorname{Ann}(x/1)=S^{-1}\mathfrak{p}$ であり、これは素イデアルである（\ref{ring:localization-primes}）。

**Step 2（1、⊂）.** $\mathfrak{q}=\operatorname{Ann}(x/s)$ を $S^{-1}M$ の随伴素イデアルとし、$\mathfrak{p}\defeq\mathfrak{q}\cap A$（$A\to S^{-1}A$ による逆像）とおく。\ref{ring:localization-primes} から $\mathfrak{q}=S^{-1}\mathfrak{p}$, $\mathfrak{p}\cap S=\emptyset$ である。ネーター性から $\mathfrak{p}=(a_{1},\dots,a_{n})$ と書ける。$a_{i}x/s=0$ に $s/1$ を掛けると $a_{i}x/1=0$ なので、$t_{i}a_{i}x=0$ となる $t_{i}\in S$ がある。$t\defeq\prod t_{i}$ とおくと $\mathfrak{p}\subset\operatorname{Ann}(tx)$ である。逆に $btx=0$ なら、$\frac{b}{1}\cdot\frac{t}{1}\cdot\frac{x}{s}=0$ で $\frac{t}{1}$ は単元なので $\frac{b}{1}\in\mathfrak{q}$、すなわち $b\in\mathfrak{p}$ である。よって $\mathfrak{p}=\operatorname{Ann}(tx)\in\operatorname{Ass}(M)$ である。

**Step 3（2）.** $\mathfrak{p}=\operatorname{Ann}(x)\in\operatorname{Ass}(M)$ とする。$ux=0$ となる $u$ は $\mathfrak{p}$ に属するので、$M_{\mathfrak{p}}$ で $x/1\neq 0$ であり、$\mathfrak{p}\in\operatorname{Supp}(M)$ となる。次に $\mathfrak{p}$ が $\operatorname{Supp}(M)$ の極小元とする。$M_{\mathfrak{p}}\neq 0$ で $A_{\mathfrak{p}}$ はネーター（\ref{ring:noetherian-exact.3}）なので、$\operatorname{Ass}(M_{\mathfrak{p}})\neq\emptyset$ である（\ref{ring:ass-nonempty}）。1 からその元は $\mathfrak{q}A_{\mathfrak{p}}$（$\mathfrak{q}\in\operatorname{Ass}(M)$, $\mathfrak{q}\subset\mathfrak{p}$）の形である。前半から $\mathfrak{q}\in\operatorname{Supp}(M)$ なので、極小性から $\mathfrak{q}=\mathfrak{p}$ となる。最後の主張は $\operatorname{Supp}(A/I)=V(I)$（\ref{ring:support-properties.1}）から従う。

**Step 4（3）.** $\mathfrak{q}\in\operatorname{Supp}(M)$ とする。$M_{\mathfrak{q}}\neq 0$ なので $M_{\mathfrak{q}}$ で $x/1\neq 0$ となる $x\in M$ があり、$\operatorname{Ann}(x)\subset\mathfrak{q}$ である（$a\in\operatorname{Ann}(x)\setminus\mathfrak{q}$ があれば $x/1=0$ となる）。\ref{ring:noetherian-prime-product.1} から、$\operatorname{Ann}(x)$ を含む素イデアル $\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}$ で $\mathfrak{p}_{1}\cdots\mathfrak{p}_{n}\subset\operatorname{Ann}(x)$ となるものがある。$\operatorname{Ann}(x)$ を含む素イデアルはこの積を含むので、どれかの $\mathfrak{p}_{i}$ を含む（\ref{ring:prime-contains-product}）。特に $\mathfrak{q}$ に含まれる $\mathfrak{p}_{i}$ があり、そのうち包含について極小なものを $\mathfrak{p}'$ とおく。$\mathfrak{p}'$ は $V(\operatorname{Ann}(x))$ の極小元である：$\operatorname{Ann}(x)\subset\mathfrak{r}\subset\mathfrak{p}'$ となる素イデアル $\mathfrak{r}$ はある $\mathfrak{p}_{j}$ を含み、$\mathfrak{p}_{j}\subset\mathfrak{p}'\subset\mathfrak{q}$ なので $\mathfrak{p}'$ の選び方から $\mathfrak{p}_{j}=\mathfrak{p}'$、ゆえに $\mathfrak{r}=\mathfrak{p}'$ となる。$Ax\cong A/\operatorname{Ann}(x)$ なので $\operatorname{Supp}(Ax)=V(\operatorname{Ann}(x))$ であり（\ref{ring:support-properties.1}）、2 を $Ax$ に使うと $\mathfrak{p}'\in\operatorname{Ass}(Ax)\subset\operatorname{Ass}(M)$ となる（\ref{ring:ass-exact}）。これが前半である。後半：$\operatorname{Supp}(M)$ の極小元は 2 から $\operatorname{Ass}(M)$ に属し、$\operatorname{Ass}(M)\subset\operatorname{Supp}(M)$ なので $\operatorname{Ass}(M)$ でも極小である。逆に $\mathfrak{p}$ を $\operatorname{Ass}(M)$ の極小元とし、$\mathfrak{q}\subset\mathfrak{p}$, $\mathfrak{q}\in\operatorname{Supp}(M)$ とする。前半から $\mathfrak{p}'\subset\mathfrak{q}$ となる $\mathfrak{p}'\in\operatorname{Ass}(M)$ があり、$\mathfrak{p}'\subset\mathfrak{p}$ と極小性から $\mathfrak{p}'=\mathfrak{p}$、ゆえに $\mathfrak{q}=\mathfrak{p}$ である。よって $\mathfrak{p}$ は $\operatorname{Supp}(M)$ の極小元である。
:::

::: definition 極小素因子と埋没素因子 {#ring:embedded-prime keywords="minimal associated prime, embedded prime" index="埋没素因子|まいぼつそいんし, 埋没素イデアル|まいぼつそいである, 極小素因子|きょくしょうそいんし, 極小素イデアル|きょくしょうそいである"}
$\operatorname{Ass}(M)$ の極小元を $M$ の**極小素因子**（極小素イデアル、孤立素因子）、それ以外を**埋没素因子**（埋没素イデアル）という。\ref{ring:ass-localization.3} から、極小素因子は $\operatorname{Supp}(M)$ の極小元と一致する。
:::

## 準素分解 {#ring:sec-pd-primary}

::: definition 準素部分加群・準素イデアル {#ring:primary keywords="primary submodule, primary ideal, p-primary" index="準素イデアル|じゅんそいである, 準素部分加群|じゅんそぶぶんかぐん"}
$A$ をネーター環、$M$ を有限生成 $A$ 加群とする。部分加群 $Q\subsetneq M$ で $\operatorname{Ass}(M/Q)$ がただ一つの素イデアル $\mathfrak{p}$ からなるものを **$\mathfrak{p}$ 準素**という。$M=A$ のとき、$\mathfrak{p}$ 準素なイデアルを**準素イデアル**という。
:::

::: proposition 準素イデアルの古典的な特徴付け {#ring:primary-ideal-classical keywords="q is primary iff ab in q and a not in q imply b^n in q, radical of a primary ideal is prime" index="準素イデアルの特徴付け|じゅんそいであるのとくちょうづけ"}
（DC）ネーター環 $A$ のイデアル $\mathfrak{q}\neq A$ について、次は同値である。
1. $\mathfrak{q}$ は準素イデアル（$\operatorname{Ass}(A/\mathfrak{q})=\{\mathfrak{p}\}$）。
2. $ab\in\mathfrak{q}$, $a\notin\mathfrak{q}$ なら、ある $n$ で $b^{n}\in\mathfrak{q}$。

このとき $\mathfrak{p}=\sqrt{\mathfrak{q}}$。
:::

::: proof
**Step 1（1⇒2）.** \ref{ring:zero-divisors-ass} から、$A/\mathfrak{q}$ の零因子全体は $\mathfrak{p}$ である。次に $\sqrt{\mathfrak{q}}=\mathfrak{p}$ を示す。$\mathfrak{p}$ は $A/\mathfrak{q}$ の元の零化イデアルなので $\mathfrak{q}$ を含む素イデアルである。$\mathfrak{q}$ を含む素イデアルは $V(\mathfrak{q})=\operatorname{Supp}(A/\mathfrak{q})$（\ref{ring:support-properties.1}）の元なので、\ref{ring:ass-localization.3} から $\operatorname{Ass}(A/\mathfrak{q})=\{\mathfrak{p}\}$ の元 $\mathfrak{p}$ を含む。ゆえに $\mathfrak{q}$ を含む素イデアル全体の共通部分は $\mathfrak{p}$ であり、\ref{ring:radical-properties.2} から $\sqrt{\mathfrak{q}}=\mathfrak{p}$ である。最後に、$ab\in\mathfrak{q}$, $a\notin\mathfrak{q}$ なら、$b\bar a=0$, $\bar a\neq 0$ なので $b$ は $A/\mathfrak{q}$ の零因子であり、$b\in\mathfrak{p}=\sqrt{\mathfrak{q}}$ となる。

**Step 2（2⇒1）.** 2 から、$A/\mathfrak{q}$ の零因子は $\sqrt{\mathfrak{q}}$ に属する（$b\bar a=0$, $\bar a\neq 0$ なら $ab\in\mathfrak{q}$, $a\notin\mathfrak{q}$ なので $b^{n}\in\mathfrak{q}$）。$\sqrt{\mathfrak{q}}$ は素イデアルである：$\mathfrak{q}\neq A$ なので $1\notin\sqrt{\mathfrak{q}}$ であり、$ab\in\sqrt{\mathfrak{q}}$ なら $a^{n}b^{n}\in\mathfrak{q}$ となる $n$ があり、$a^{n}\notin\mathfrak{q}$ なら 2 から $b^{nm}\in\mathfrak{q}$ となる $m$ があるので、$a\in\sqrt{\mathfrak{q}}$ または $b\in\sqrt{\mathfrak{q}}$ となる。$\operatorname{Ass}(A/\mathfrak{q})$ の元 $\mathfrak{p}'$ は零因子からなるので $\mathfrak{p}'\subset\sqrt{\mathfrak{q}}$ であり、また $\mathfrak{q}$ を含む素イデアルなので $\mathfrak{p}'\supset\sqrt{\mathfrak{q}}$ である。よって $\operatorname{Ass}(A/\mathfrak{q})=\{\sqrt{\mathfrak{q}}\}$ である（空でないことは \ref{ring:ass-nonempty}）。
:::

::: example
1. $\Z$ の準素イデアルは $0$ と $p^{e}\Z$（$p$ 素数、$e\ge 1$）。$p^{e}\Z$ は 2 をみたし、$\sqrt{p^{e}\Z}=p\Z$。$6\Z$ は準素でない（$\operatorname{Ass}=\{2\Z,3\Z\}$）。
2. 素イデアルの冪は準素とは限らない：$A=k[x,y,z]/(xy-z^{2})$, $\mathfrak{p}=(x,z)$ について $\mathfrak{p}^{2}$ は準素でない（$xy=z^{2}\in\mathfrak{p}^{2}$ だが、$x\notin\mathfrak{p}^{2}$ であり（$x,y,z$ を次数 $1$ とすると $xy-z^{2}$ は斉次なので $A$ は次数環になり、$\mathfrak{p}^{2}=(x^{2},xz,z^{2})$ は次数 $2$ 以上の斉次元で生成されるので、次数 $1$ の元 $x$ を含まない）、どの $n$ でも $y^{n}\notin\mathfrak{p}^{2}$ である（$x\mapsto 0$ は環準同型 $A\to k[y,z]/(z^{2})$ を定め、$\mathfrak{p}^{2}$ の像は $0$、$y^{n}$ の像は $0$ でない）。よって \ref{ring:primary-ideal-classical.2} が成り立たない）。
3. 極大イデアル $\mathfrak{m}$ について、$\sqrt{\mathfrak{q}}=\mathfrak{m}$ なら $\mathfrak{q}$ は $\mathfrak{m}$ 準素（$\operatorname{Supp}(A/\mathfrak{q})=\{\mathfrak{m}\}$ で、$\operatorname{Ass}$ は空でなく台に含まれる）。特に $\mathfrak{m}^{n}$ は $\mathfrak{m}$ 準素。
:::

::: theorem 準素分解（ラスカー＝ネーター） {#ring:primary-decomposition keywords="existence and uniqueness of primary decomposition, Lasker-Noether theorem, irredundant primary decomposition" index="準素分解|じゅんそぶんかい, ラスカー＝ネーターの定理|らすかーねーたーのていり, 無駄のない準素分解|むだのないじゅんそぶんかい"}
（DC）$A$ をネーター環、$M$ を有限生成 $A$ 加群、$N\subsetneq M$ を部分加群とする。
1. （存在）$N=Q_{1}\cap\dots\cap Q_{r}$（$Q_{i}$ は $\mathfrak{p}_{i}$ 準素部分加群）と書ける。さらに、どの $Q_{i}$ も省けず、$\mathfrak{p}_{i}$ が互いに異なるようにできる（**無駄のない**準素分解）。
2. （素イデアルの一意性）無駄のない準素分解について $\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}\}=\operatorname{Ass}(M/N)$。
:::

::: proof
部分加群 $N\subsetneq M$ が、$N=N_{1}\cap N_{2}$ なら $N=N_{1}$ または $N=N_{2}$ をみたすとき**既約**という。

**Step 1（既約部分加群への分解）.** 【主張：$M$ の真の部分加群は、有限個の既約部分加群の共通部分である】 そう書けない真の部分加群全体を $\Sigma$ とし、$\Sigma\neq\emptyset$ と仮定する。$M$ はネーター加群（\ref{ring:noetherian-exact.2}）なので、$\Sigma$ は極大元 $N$ をもつ（\ref{ring:noetherian-module.2}）。$N$ 自身は既約でない（既約なら $N$ 一つの共通部分になる）ので、$N=N_{1}\cap N_{2}$, $N\neq N_{1}$, $N\neq N_{2}$ と書け、$N\subsetneq N_{i}$ である。$N_{1}=M$ なら $N=N_{2}$ となって矛盾するので $N_{1}\neq M$ であり、同様に $N_{2}\neq M$ である。極大性から $N_{1},N_{2}\notin\Sigma$ なので、どちらも既約部分加群の有限個の共通部分であり、$N=N_{1}\cap N_{2}$ もそうなる。これは $N\in\Sigma$ に反するので、$\Sigma=\emptyset$ である。

**Step 2（既約なら準素）.** 【主張：既約部分加群 $N$ について、$\operatorname{Ass}(M/N)$ はただ一つの元からなる】 $M/N\neq 0$ なので $\operatorname{Ass}(M/N)\neq\emptyset$ である（\ref{ring:ass-nonempty}）。$\operatorname{Ass}(M/N)$ が二つの異なる素イデアル $\mathfrak{p}=\operatorname{Ann}(\bar x)$, $\mathfrak{q}=\operatorname{Ann}(\bar y)$ を含むと仮定する。$A\bar x\cong A/\mathfrak{p}$ は整域と同型なので、$A\bar x$ の $0$ でない元の零化イデアルはすべて $\mathfrak{p}$ であり、同様に $A\bar y$ の $0$ でない元の零化イデアルはすべて $\mathfrak{q}$ である。$0\neq z\in A\bar x\cap A\bar y$ があれば $\mathfrak{p}=\operatorname{Ann}(z)=\mathfrak{q}$ となって矛盾するので、$A\bar x\cap A\bar y=0$ である。$\pi:M\to M/N$ を射影とすると $N=\pi^{-1}(0)=\pi^{-1}(A\bar x)\cap\pi^{-1}(A\bar y)$ であり、$\bar x\neq 0$, $\bar y\neq 0$ なのでどちらも $N$ より真に大きい。これは既約性に反する。

**Step 3（無駄をなくす）.** 【主張：同じ $\mathfrak{p}$ に対する $\mathfrak{p}$ 準素部分加群 $Q$, $Q'$ の共通部分は $\mathfrak{p}$ 準素である】 $M/(Q\cap Q')\to M/Q\oplus M/Q'$ は単射である。\ref{ring:ass-exact} を部分加群と直和 $0\to M/Q\to M/Q\oplus M/Q'\to M/Q'\to 0$ に使うと、$\operatorname{Ass}(M/(Q\cap Q'))\subset\operatorname{Ass}(M/Q)\cup\operatorname{Ass}(M/Q')=\{\mathfrak{p}\}$ であり、$Q\cap Q'\neq M$ なので左辺は空でない（\ref{ring:ass-nonempty}）。Step 1・2 で得た分解で同じ素イデアルの成分をこれでまとめ、そのあと省ける成分を一つずつ除けば（素イデアルは互いに異なったまま）、無駄のない分解を得る。

**Step 4（2）.** 【主張：無駄のない分解について $\operatorname{Ass}(M/N)=\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}\}$】 $M/N\to\bigoplus_{i}M/Q_{i}$ は単射なので、\ref{ring:ass-exact} から $\operatorname{Ass}(M/N)\subset\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}\}$ である。逆に、各 $i$ について $N_{i}\defeq\bigcap_{j\neq i}Q_{j}$ とおくと、無駄がないので $N_{i}\supsetneq N$ である。$N_{i}\cap Q_{i}=N$ なので $N_{i}/N\to M/Q_{i}$ は単射である。$N_{i}/N\neq 0$ なので $\emptyset\neq\operatorname{Ass}(N_{i}/N)\subset\operatorname{Ass}(M/Q_{i})=\{\mathfrak{p}_{i}\}$ であり、よって $\mathfrak{p}_{i}\in\operatorname{Ass}(N_{i}/N)\subset\operatorname{Ass}(M/N)$ である。

::: hypcheck
- **前提「$A$ はネーター」**：Step 1 で $M$ がネーター加群であること、Step 2・3・4 で $\operatorname{Ass}\neq\emptyset$（\ref{ring:ass-nonempty}）に使った。準素部分加群の定義（$\operatorname{Ass}$ による）もネーター環を前提にしている。
- **前提「$M$ は有限生成」**：Step 1 で $M$ がネーター加群であることに使った。外すと偽：$\Z$ 加群 $M=\bigoplus_{p}\Z/p\Z$（$p$ はすべての素数）と $N=0$ では、$1\in\Z/p\Z$ の零化イデアルが $p\Z$ なので $\operatorname{Ass}(M)$ は無限集合である。一方、有限個の部分加群 $Q_{i}$ で $\operatorname{Ass}(M/Q_{i})=\{\mathfrak{p}_{i}\}$ となるものの共通部分が $0$ なら、Step 4 の前半と同じ議論で $\operatorname{Ass}(M)\subset\{\mathfrak{p}_{1},\dots,\mathfrak{p}_{r}\}$ となるので、$0$ はそのような有限個の共通部分に書けない。
- **選択公理**：Step 1 の極大元の存在（ネーター帰納法）で従属選択公理を使う。
:::
:::

::: example 埋没素因子と分解の非一意性 {#ring:primary-decomposition-example}
体 $k$ 上の $A=k[x,y]$ で $I=(x^{2},xy)$ とする。
$$
I=(x)\cap(x^{2},y)=(x)\cap(x,y)^{2}.
$$
実際、$f\in(x)\cap(x^{2},y)$ なら $f=xg$ で、$xg\in(x^{2},y)$ は $g$ の定数項が $0$、すなわち $g\in(x,y)$ と同値なので $f\in(x^{2},xy)$（二つ目も同様）。$(x)$ は素、$(x^{2},y)$ と $(x,y)^{2}$ はどちらも根基が極大イデアル $(x,y)$ なので $(x,y)$ 準素（上の例の 3）。$x\notin I$, $y\notin I$ なので $I\neq(x)$, $I\neq(x^{2},y)$ であり、どちらの分解も無駄がない。よって \ref{ring:primary-decomposition.2} から $\operatorname{Ass}(A/I)=\{(x),(x,y)\}$ であり、$(x,y)$ は埋没素因子である。分解は一意でないが、素イデアルの組 $\{(x),(x,y)\}$ と、極小素イデアル $(x)$ の成分 $(x)$ は一意である（極小素イデアルの成分の一意性は、下の \ref{ring:primary-minimal-component} による。成分は局所化 $IA_{(x)}$ の $A$ への逆像として復元できる）。幾何的には、$y$ 軸（$x=0$）に原点の「埋め込まれた点」が付いた図形である。
:::

::: proposition 極小成分の一意性 {#ring:primary-minimal-component keywords="uniqueness of isolated primary components" index="極小成分の一意性|きょくしょうせいぶんのいちいせい, 孤立成分|こりつせいぶん"}
（DC）\ref{ring:primary-decomposition} の状況で、$N=Q_{1}\cap\dots\cap Q_{r}$ を無駄のない準素分解とし、$\mathfrak{p}_{i}$ を $\operatorname{Ass}(M/N)$ の極小元とする。このとき
$$
Q_{i}=\{x\in M : M_{\mathfrak{p}_{i}}\text{ で }x/1\in N_{\mathfrak{p}_{i}}\}
$$
である（$N_{\mathfrak{p}_{i}}\subset M_{\mathfrak{p}_{i}}$ は $N$ の局所化）。特に $Q_{i}$ は分解によらず $N$ と $\mathfrak{p}_{i}$ だけで決まる。
:::

::: proof
$\mathfrak{p}\defeq\mathfrak{p}_{i}$ とおく。

**Step 1.** 【主張：$j\neq i$ なら $(M/Q_{j})_{\mathfrak{p}}=0$】 $\mathfrak{p}_{j}\subset\mathfrak{p}$ なら、$\mathfrak{p}$ の極小性から $\mathfrak{p}_{j}=\mathfrak{p}$ となり、素イデアルが互いに異なることに反する。ゆえに $\mathfrak{p}_{j}\not\subset\mathfrak{p}$ である。\ref{ring:ass-localization.3} から $\operatorname{Supp}(M/Q_{j})$ の元は $\operatorname{Ass}(M/Q_{j})=\{\mathfrak{p}_{j}\}$ の元を含むので、$\mathfrak{p}\notin\operatorname{Supp}(M/Q_{j})$ である。

**Step 2.** 【主張：$x\in Q_{i}$ なら $x/1\in N_{\mathfrak{p}}$】 Step 1 から、各 $j\neq i$ について $s_{j}x\in Q_{j}$ となる $s_{j}\notin\mathfrak{p}$ がある。$s\defeq\prod_{j\neq i}s_{j}\notin\mathfrak{p}$ とおくと、$sx\in Q_{i}$ と合わせて $sx\in\bigcap_{j}Q_{j}=N$ である。ゆえに $x/1=(sx)/s\in N_{\mathfrak{p}}$ である。

**Step 3.** 【主張：$x/1\in N_{\mathfrak{p}}$ なら $x\in Q_{i}$】 $x/1=n/s$（$n\in N$, $s\notin\mathfrak{p}$）なら、$u(sx-n)=0$ となる $u\notin\mathfrak{p}$ があるので、$t\defeq us\notin\mathfrak{p}$ について $tx=un\in N\subset Q_{i}$ である。$\operatorname{Ass}(M/Q_{i})=\{\mathfrak{p}\}$ なので、\ref{ring:zero-divisors-ass} から $M/Q_{i}$ の零因子全体は $\mathfrak{p}$ であり、$t$ は $M/Q_{i}$ の零因子でない。$t\bar x=0$ なので $\bar x=0$、すなわち $x\in Q_{i}$ である。
:::

::: supplement
**埋没成分.** 埋没素因子に対応する成分は一意でない（上の例の $(x^{2},y)$ と $(x,y)^{2}$）。

**零因子と深さへの応用.** $M\neq 0$ を有限生成 $A$ 加群とする。$\operatorname{Ass}(M)$ は空でない有限集合なので（\ref{ring:ass-nonempty}・\ref{ring:prime-filtration}）、\ref{ring:zero-divisors-ass} と素イデアルの回避（\ref{ring:prime-avoidance}）を組み合わせると、「イデアル $I$ が $M$ の零因子だけからなるなら、ある随伴素イデアルに含まれる」ことがわかる。これが $M$ 正則元の存在、ひいては深さの理論（\see{ring:page-depth}）の出発点になる。有限生成でない $M$ では $\operatorname{Ass}(M)$ が無限集合になりうるので、素イデアルの回避は使えない。

**計算の観点.** $\Q$ 上の多項式環のイデアルの準素分解や随伴素イデアルは、グレブナー基底を使って計算できることが知られている（ギアーニ・トレイガー・ザカリアス、1988 年など。本サイト未収録）。
:::

## 問題 {#ring:sec-pd-problems}

::: problem {#ring:prob-ass-z-modules}
有限アーベル群 $M$（$\Z$ 加群）について、$\operatorname{Ass}(M)$ は $\abs{M}$ を割り切る素数 $p$ に対する $p\Z$ 全体であることを示せ。また $\operatorname{Ass}(\Q)=\{0\}$、$\operatorname{Ass}(\Q/\Z)$ はすべての $p\Z$ からなることを示せ。
:::

::: solution
**Step 1.** $x\in M$ について $\operatorname{Ann}(x)=n\Z$（$n$ は $x$ の\term[位数]{grp:element-order}）であり、これが素イデアルになるのは $n$ が素数のときである（$n=1$ すなわち $x=0$ なら $\operatorname{Ann}(x)=\Z$）。$p\mid\abs{M}$ ならコーシーの定理から\term[位数]{grp:element-order} $p$ の元があるので、$p\Z\in\operatorname{Ass}(M)$ である。逆に\term[位数]{grp:element-order} $p$ の元があれば、ラグランジュの定理から $p\mid\abs{M}$ である。有限群の元の\term[位数]{grp:element-order}は有限なので、零イデアル $0$ は零化イデアルとして現れない。

**Step 2.** $\Q$ はねじれをもたないので、$0$ でない元の零化イデアルは $0$ であり、これは素イデアルである。ゆえに $\operatorname{Ass}(\Q)=\{0\}$ である。$\Q/\Z$ では $1/p+\Z$ の零化イデアルが $p\Z$ なので、すべての $p\Z$ が随伴素イデアルである。$0$ でない元の\term[位数]{grp:element-order}は有限なので、$0$ は随伴素イデアルとして現れない。
:::

::: problem {#ring:prob-primary-power-maximal}
ネーター局所環 $(A,\mathfrak{m})$ で、$\sqrt{I}=\mathfrak{m}$ となるイデアル $I$ について、$\mathfrak{m}^{n}\subset I$ となる $n$ があることを示せ。
:::

::: solution
$A/I$ はネーター環であり（\ref{ring:noetherian-exact.3}）、その冪零根基は $\sqrt{I}/I=\mathfrak{m}/I$ である（\ref{ring:radical-properties.1}）。\ref{ring:noetherian-prime-product.3} から $(\mathfrak{m}/I)^{n}=0$ となる $n$ がある。これは $\mathfrak{m}^{n}\subset I$ を意味する。
:::
