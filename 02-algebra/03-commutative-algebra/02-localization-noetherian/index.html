# 局所化とネーター環（Localization and Noetherian Rings）

分数加群と局所的性質・中山の補題、ネーター環とアルティン環（ヒルベルトの基底定理・秋月＝ホプキンスの定理・長さ）、準素分解と随伴素イデアル（アティヤ＝マクドナルド 第 3・4・6〜8 章、松村『可換環論』を参考）。

<p class="mn-msc">MSC2020: 13A15, 13B30, 13C, 13E</p>

- [可換代数 › 環の基礎](../../../02-algebra/03-commutative-algebra/01-basics/index.html)（全体、9 ページ）
