# 整拡大と付値環（Integral Extensions and Valuation Rings）

整拡大と正規環（上昇・下降・比較不能）、ヒルベルトの零点定理とネーターの正規化、付値環と離散付値環、整閉包の構造と有限性（トレース・ネーターの有限性定理）（アティヤ＝マクドナルド 第 5 章、松村『可換環論』を参考）。

<p class="mn-msc">MSC2020: 13B21, 13B22, 13F30</p>

- [可換代数 › 環の基礎](../../../02-algebra/03-commutative-algebra/01-basics/index.html)（全体、9 ページ）
- [結合環と結合代数 › 加群論](../../../02-algebra/04-associative-rings/01-module-theory/index.html)（全体、6 ページ）：テンソル積・忠実平坦
- [可換代数 › 局所化とネーター環](../../../02-algebra/03-commutative-algebra/02-localization-noetherian/index.html)（全体、3 ページ）：局所化・中山の補題・ネーター環
- [体論と多項式 › 体の拡大](../../../02-algebra/05-field-theory/01-extensions/index.html)（全体、7 ページ）：証明・主張で使う：分解体・最小多項式・分離次数・塔の公式
- [体論と多項式 › ガロア理論](../../../02-algebra/05-field-theory/02-galois-theory/index.html)（全体、7 ページ）：証明・主張で使う：トレースとノルム・トレース形式の非退化性（整閉包の有限性で使う）
