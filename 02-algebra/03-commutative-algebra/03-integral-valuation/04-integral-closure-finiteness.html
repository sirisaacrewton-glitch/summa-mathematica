# 整閉包の構造と有限性 {#ring:page-integral-closure-finiteness keywords="integral closure in a finite extension, clearing denominators, trace and norm of integral elements, finiteness of integral closure in separable extensions, free over a PID, Emmy Noether finiteness theorem, Chevalley extension theorem, integral closure as intersection of valuation rings"}

正規環 $A$（商体 $K$）と $K$ の有限次拡大 $L$ について、$A$ の $L$ における整閉包 $B$ を調べる。$B$ の商体は $L$ で（\ref{ring:clearing-denominators}）、$B$ の元の最小多項式・\term[トレース]{ring:trace-norm}・ノルムは $A$ に属する（\ref{ring:integral-trace-norm}）。$L/K$ が分離的なら、トレース形式の非退化性から $B$ は有限生成 $A$ 加群になり（\ref{ring:integral-closure-finite}）、$A$ が PID なら階数 $[L:K]$ の自由加群になる。代数的整数環 $\mathcal{O}_{L}$ が $\Z$ 加群として $\Z^{[L:\Q]}$ と同型になる（階数 $[L:\Q]$ の自由 $\Z$ 加群になる）のはこの特別な場合である。体上の有限生成整域については、非分離な場合も含めて整閉包が有限であること（**ネーターの有限性定理**、\tref{ring:noether-finiteness}）を示す。最後に、整閉包を付値環の共通部分として特徴付ける（\ref{ring:integral-closure-valuations}）。

> 松村『可換環論』§9–§10、Zariski–Samuel 第 V 章の内容を参考にした。ネーターの有限性定理の非分離な場合は、係数の $q$ 乗根を添加して分離的な場合に帰着する形で書いた。

## 記法と定義の確認 {#ring:sec-icf-notation}

::: notation
- 整拡大・整閉包・\term[推移律]{ring:integral-closure}・正規環・整閉包と局所化・イデアル上整な元・最小多項式の係数は \ref{ring:integral-def}, \ref{ring:integral-closure}, \ref{ring:normal-domain}, \ref{ring:integral-localization}, \ref{ring:minimal-polynomial-ideal}。一意分解環は正規（\ref{ring:ufd-normal}）。
- 体論：次数・塔の公式・最小多項式・分離性・分離次数・デデキントの補題は \tref{fld:tower-law}, \ref{fld:minimal-polynomial}, \ref{fld:separable-polynomial}, \ref{fld:separable-degree}, \ref{fld:dedekind-independence}。
- 付値環とその性質は \ref{ring:valuation-ring}, \ref{ring:valuation-properties}。体上の有限生成整域を多項式環の上の有限な環とみる \ref{ring:noether-normalization} と、\ref{set:zorn} を使う。
- **選択公理**：付値環の存在（ツォルンの補題）と、極大イデアルの存在で使う。有限性の定理（\ref{ring:integral-closure-finite}, \ref{ring:noether-finiteness}）は、本文では代数閉包の中で書くが、扱う拡大はすべて有限次なので、代数閉包の代わりに有限次の分解体の中で同じ議論ができ、選択公理を使わずに示せる（\ref{ring:noether-finiteness} の hypcheck）。
:::

## 分母を払う {#ring:sec-icf-denominators}

::: lemma 分母を払う {#ring:clearing-denominators keywords="for x algebraic over K = Frac A there is d in A with dx integral over A; the integral closure of A in L has fraction field L" index="分母を払う|ぶんぼをはらう"}
$A$ を整域、$K=\Frac A$、$L/K$ を代数拡大とする。$x\in L$ について $dx$ が $A$ 上整となる $0\neq d\in A$ がある。したがって $A$ の $L$ における整閉包 $B$ について $\Frac B=L$ で、$L$ の $K$ 上の基底で $B$ に属するものがとれる。
:::

::: proof
$x$ は $K$ 上代数的なので、$K$ 係数の多項式の分母を払って、$x$ は $a_{n}x^{n}+\dots+a_{0}=0$（$a_{i}\in A$, $a_{n}\neq 0$）をみたすとしてよい。両辺に $a_{n}^{n-1}$ を掛けると
$$
(a_{n}x)^{n}+a_{n-1}(a_{n}x)^{n-1}+a_{n-2}a_{n}(a_{n}x)^{n-2}+\dots+a_{0}a_{n}^{n-1}=0
$$
となる。これは $a_{n}x$ がモニックな $A$ 係数の多項式の根であることを示すので、$d\defeq a_{n}$ とおけば $dx$ は $A$ 上整である。後半：$x=(dx)/d$ と書けて $dx,d\in B$ なので $x\in\Frac B$ である。$K$ 上の基底 $u_{1},\dots,u_{n}$ をとり、各 $u_{i}$ に対して前半の $d_{i}$ を掛けた $d_{i}u_{i}\in B$ も $K$ 上の基底である（$d_{i}\in K^{\times}$）。
:::

## トレースとノルム {#ring:sec-icf-trace}

::: definition トレースとノルム {#ring:trace-norm keywords="trace and norm of a finite field extension" index="トレース（体の拡大）|とれーすたいのかくだい, ノルム（体の拡大）|のるむたいのかくだい"}
有限次拡大 $L/K$ と $x\in L$ について、$K$ 線形写像 $m_{x}\colon L\to L$, $y\mapsto xy$ のトレースと行列式を $\operatorname{Tr}_{L/K}(x)$, $N_{L/K}(x)$ と書き、$x$ の $L/K$ に関する**トレース**、**ノルム**という。$\operatorname{Tr}$ は $K$ 線形、$N$ は乗法的（$m_{xy}=m_{x}m_{y}$）。
:::

::: proposition トレース・ノルムと共役 {#ring:trace-conjugates keywords="Tr(x) = [L:K(x)] times sum of roots of the minimal polynomial; for separable L/K, Tr = sum over embeddings and the trace form is nondegenerate" index="トレース形式|とれーすけいしき"}
$x\in L$ の $K$ 上の最小多項式を $f=X^{r}-c_{1}X^{r-1}+\dots+(-1)^{r}c_{r}$、$s=[L:K(x)]$ とする。
1. $\operatorname{Tr}_{L/K}(x)=sc_{1}$、$N_{L/K}(x)=c_{r}^{s}$。
2. $L/K$ が分離的なら、$\Omega$（代数的閉体）への $K$ 埋め込み全体 $\sigma_{1},\dots,\sigma_{n}$ について $\operatorname{Tr}(x)=\sum_{i}\sigma_{i}(x)$。
3. $L/K$ が分離的なら、トレース形式 $(y,z)\mapsto\operatorname{Tr}(yz)$ は非退化：$K$ 上の基底 $v_{1},\dots,v_{n}$ に対し、$\operatorname{Tr}(v_{i}v_{j}^{*})=\delta_{ij}$ となる**双対基底** $v_{1}^{*},\dots,v_{n}^{*}$ がある。
:::

::: proof
**Step 1（1）.** 【主張：$m_{x}$ の行列は $f$ の同伴行列 $s$ 個のブロック対角にとれ、$\operatorname{Tr}(x)=sc_{1}$, $N(x)=c_{r}^{s}$ である】 $K(x)$ の基底 $1,x,\dots,x^{r-1}$ に関する $m_{x}|_{K(x)}$ の行列は $f$ の同伴行列で、その特性多項式は $f$ なので、トレースは $c_{1}$、行列式は $(-1)^{r}f(0)=c_{r}$ である。$L$ の $K(x)$ 上の基底 $u_{1},\dots,u_{s}$ をとると、積 $x^{i}u_{j}$ は $L$ の $K$ 上の基底である（\ref{fld:tower-law}）。$m_{x}(x^{i}u_{j})=x^{i+1}u_{j}$ なので各 $K(x)u_{j}$ は $m_{x}$ で保たれ、$j$ ごとにまとめた基底での $m_{x}$ の行列は同伴行列の $s$ 個のブロック対角である。ゆえにトレースは $sc_{1}$、行列式は $c_{r}^{s}$ である。

**Step 2（2）.** 【主張：$\sum_{i}\sigma_{i}(x)=sc_{1}$】 $L/K$ は分離的なので $f$ は相異なる $r$ 個の根をもち、$K(x)$ の $\Omega$ への $K$ 埋め込みはそれらの根に $x$ を送る $r$ 個である（\ref{fld:extension-simple}）。$L/K(x)$ も分離的なので、各々の $L$ への延長はちょうど $[L:K(x)]_{s}=s$ 個ある（\ref{fld:separable-degree.2}・\ref[3]{fld:separable-degree.3}）。よって $\sum_{i}\sigma_{i}(x)=s\cdot(\text{根の和})=sc_{1}$ であり、(1) と合わせて $\operatorname{Tr}(x)=\sum_{i}\sigma_{i}(x)$ を得る。

**Step 3（3）.** 【主張：$y\mapsto\operatorname{Tr}(y\,\cdot)$ は $L\cong\Hom_{K}(L,K)$ を与え、双対基底がある】 $\sigma_{1},\dots,\sigma_{n}$ は相異なる準同型 $L^{\times}\to\Omega^{\times}$ なので、デデキントの補題（\tref{fld:dedekind-independence}）から $\operatorname{Tr}=\sum\sigma_{i}$ は恒等的に $0$ ではない。$y\neq 0$ がすべての $z$ について $\operatorname{Tr}(yz)=0$ をみたすと仮定すると、任意の $w$ に対して $z=y^{-1}w$ とおけば $\operatorname{Tr}(w)=0$ となり矛盾する。よって $L\to\Hom_{K}(L,K)$, $y\mapsto\operatorname{Tr}(y\,\cdot)$ は単射で、両辺の\term[次元]{lin:dimension}はともに $n$ なので同型である。$v$ の双対基底 $v^{\vee}_{1},\dots,v^{\vee}_{n}$ のこの同型による逆像を $v_{j}^{*}$ とおくと、$\operatorname{Tr}(v_{i}v_{j}^{*})=v^{\vee}_{j}(v_{i})=\delta_{ij}$ である。
:::

::: proposition 整な元のトレース・ノルム {#ring:integral-trace-norm keywords="for A normal, the minimal polynomial, trace and norm of an element of L integral over A lie in A" index="整な元のトレース|せいなげんのとれーす"}
$A$ を正規環、$K=\Frac A$、$L/K$ を有限次拡大、$x\in L$ を $A$ 上整とする。$x$ の最小多項式は $A[X]$ に属し、$\operatorname{Tr}_{L/K}(x),N_{L/K}(x)\in A$。
:::

::: proof
\ref{ring:minimal-polynomial-ideal}（$\mathfrak{p}=A$ の場合）から、最小多項式の係数について $c_{i}\in A$ である。ゆえに \ref{ring:trace-conjugates.1} から $\operatorname{Tr}(x)=sc_{1}\in A$, $N(x)=c_{r}^{s}\in A$ である。
:::

## 整閉包の有限性 {#ring:sec-icf-finite}

::: theorem 分離拡大での整閉包の有限性 {#ring:integral-closure-finite keywords="integral closure of a normal Noetherian domain in a finite separable extension is a finite module; free of rank [L:K] over a PID" index="整閉包の有限性|せいへいほうのゆうげんせい"}
$A$ を正規環、$K=\Frac A$、$L/K$ を $n$ 次の分離拡大、$B$ を $A$ の $L$ における整閉包とする。
1. $L$ の $K$ 上の基底 $v_{1},\dots,v_{n}\in B$ について、$B\subset\sum_{i}Av_{i}^{*}$（$v_{i}^{*}$ は \ref{ring:trace-conjugates.3} のトレース形式に関する双対基底）。
2. $A$ がネーターなら、$B$ は有限生成 $A$ 加群で、ネーター環。
3. $A$ が PID なら、$B$ は階数 $n$ の自由 $A$ 加群。
:::

::: intuition
分離拡大なら、整な元はトレースで測った座標がすべて $A$ に入るので、整閉包は有限個の元（双対基底）で張られる加群の中に閉じ込められる。
:::

::: proof
**Step 1（1）.** 【主張：$b\in B$ の双対基底に関する座標は $A$ に属する】 $b\in B$ を $b=\sum_{j}c_{j}v_{j}^{*}$（$c_{j}\in K$）と書くと、$\operatorname{Tr}(bv_{i})=\sum_{j}c_{j}\operatorname{Tr}(v_{j}^{*}v_{i})=c_{i}$ である。$b,v_{i}\in B$ なので $bv_{i}$ は $A$ 上整であり、\ref{ring:integral-trace-norm} から $c_{i}\in A$ である。

**Step 2（2）.** 【主張：$A$ がネーターなら $B$ は有限生成 $A$ 加群でネーター環】 $\sum_{i}Av_{i}^{*}$ は有限生成 $A$ 加群なのでネーター加群であり（\ref{ring:noetherian-exact.2}）、その部分加群 $B$ も有限生成である。$B$ のイデアルは $A$ 部分加群でもあるので、$B$ のイデアルの昇鎖は $A$ 部分加群の昇鎖として止まる。ゆえに $B$ はネーター環である。

**Step 3（3）.** 【主張：$A$ が PID なら $B$ は階数 $n$ の自由加群】 PID はネーター環なので、(2) から $B$ は有限生成である。$B\subset L$ はねじれのない $A$ 加群なので自由である（\ref{mod:pid-torsion-free-free}）。その基底 $w_{1},\dots,w_{r}$ は $A$ 上一次独立なので、分母を払えば $K$ 上も一次独立であり、$r\le n$ である。一方 $v_{1},\dots,v_{n}\in B$ は $w_{j}$ の $A$ 係数の一次結合なので、$w_{j}$ の $K$ 上の張る空間は $L$ であり、$r\ge n$ である。ゆえに $B$ の階数は $n$ である。

::: hypcheck
- **前提「$A$ は正規」**：Step 1 で \ref{ring:integral-trace-norm} を使うのに使った。
- **前提「$L/K$ は分離的」**：Step 1 で双対基底（トレース形式の非退化性）に使った。外すとこの方法は使えない：$L/K$ が $[L:K]=p^{e}>1$ の純非分離拡大なら、\ref{ring:trace-conjugates.1} の $sc_{1}$ は $x\notin K$ なら $c_{1}=0$、$x\in K$ なら $s=p^{e}$ なので、トレースは恒等的に $0$ である。体上の有限生成整域なら分離性なしでも有限性は成り立つ（\ref{ring:noether-finiteness}）。
- **前提「ネーター」「PID」**：Step 2 と Step 3 にだけ使う。(1) は任意の正規環で成り立つ。
:::
:::

::: theorem ネーターの有限性定理 {#ring:noether-finiteness keywords="Emmy Noether: the integral closure of a finitely generated domain over a field in a finite extension of its fraction field is a finite module" index="ネーターの有限性定理|ねーたーのゆうげんせいていり" refname="ネーターの有限性定理"}
体 $k$ 上の有限生成整域 $A$ と、$\Frac A$ の有限次拡大 $L$ について、$A$ の $L$ における整閉包 $B$ は有限生成 $A$ 加群（したがって有限生成 $k$ 代数）である。
:::

::: intuition
体上の有限生成整域なら、分離的でない拡大でも整閉包は有限である。係数の $p$ 冪乗根を添加して分離的な場合に帰着する。
:::

::: proof
**Step 1（多項式環への帰着）.** 【主張：$k$ 上の多項式環 $P\subset A$ で、$B$ が $P$ の $L$ における整閉包で $L$ が $\Frac P$ の有限次拡大となるものがある】 \ref{ring:noether-normalization} から、代数的に独立な $y_{1},\dots,y_{d}\in A$ で $A$ が $P\defeq k[y_{1},\dots,y_{d}]$ 上有限となるものがある。$A$ は $P$ 上整なので、\term[推移律]{ring:integral-closure}（\ref{ring:integral-closure.3}）から、$L$ の元が $A$ 上整であることと $P$ 上整であることは同値である。ゆえに $B$ は $P$ の $L$ における整閉包でもある。$F\defeq k(y_{1},\dots,y_{d})=\Frac P$ とおくと、$A$ が有限生成 $P$ 加群なので $\Frac A$ は $F$ 上有限次であり、$L/F$ も有限次である（\ref{fld:tower-law}）。$P$ は一意分解環なので正規である（\ref{ring:ufd-normal}）。$P\subset A$ なので、$B$ が有限生成 $P$ 加群なら有限生成 $A$ 加群でもある。以下、$B$ が $P$ 上有限であることを示す。

**Step 2（分離的な場合）.** 【主張：$L/F$ が分離的なら $B$ は $P$ 上有限】 $P$ はネーター環（\ref{ring:hilbert-basis}）で正規なので、\ref{ring:integral-closure-finite.2} を当てはめればよい。特に標数 $0$ の場合は、すべての代数拡大が分離的なので証明が終わる。

**Step 3（係数の $q$ 乗根の添加）.** 【主張：有限次拡大 $k'/k$ と $q=p^{f}$ をとって $F'\defeq k'(y_{1}^{1/q},\dots,y_{d}^{1/q})$ とおくと、$L'\defeq LF'$ は $F'$ 上有限次の分離拡大である】 標数を $p>0$ とする。以下、$L$ を含む代数閉包の中で考える（必要な根は有限個なので、$L$ 上の適当な多項式の分解体の中で考えてもよい）。$L=F(\alpha_{1},\dots,\alpha_{m})$ と書く。\ref{fld:separable-criterion.3} を繰り返し使うと、$\alpha_{i}$ の最小多項式は $g_{i}(X^{q_{i}})$（$g_{i}$ は分離的な既約多項式、$q_{i}$ は $p$ の冪）の形に書ける（$g$ が分離的でなければ $g(X)=g_{1}(X^{p})$ と書けて次数が下がるので、有限回で止まる）。$q\defeq\max_{i}q_{i}$ とおく。$g_{i}$ の係数は $y$ の $k$ 係数の有理式であり、それらに現れる $k$ の元は有限個である。その $q$ 乗根をすべて $k$ に添加した有限次拡大を $k'$ とし、$F'\defeq k'(y_{1}^{1/q},\dots,y_{d}^{1/q})$ とおく。$F$ の元 $c=\sum a_{\mu}y^{\mu}/\sum b_{\nu}y^{\nu}$ について、フロベニウス写像が環準同型であることから $c^{1/q}=\sum a_{\mu}^{1/q}y^{\mu/q}/\sum b_{\nu}^{1/q}y^{\nu/q}$ であり、ゆえに $g_{i}$ の係数 $c$ について $c^{1/q}\in F'$ である。したがって $c^{1/q_{i}}=(c^{1/q})^{q/q_{i}}\in F'$ である。$g_{i}$ の係数を $q_{i}$ 乗根に替えた多項式を $h_{i}\in F'[X]$ とおくと、$g_{i}(X^{q_{i}})=h_{i}(X)^{q_{i}}$ である。$h_{i}$ の根は $g_{i}$ の根の $q_{i}$ 乗根であり、$g_{i}$ の根は相異なり、$q_{i}$ 乗根はただ一つなので、$h_{i}$ の $\deg h_{i}=\deg g_{i}$ 個の根は相異なる。ゆえに $h_{i}$ は分離的で、$h_{i}(\alpha_{i})^{q_{i}}=0$ から $h_{i}(\alpha_{i})=0$ なので、$\alpha_{i}$ は $F'$ 上分離的である。よって $L'=F'(\alpha_{1},\dots,\alpha_{m})$ は $F'$ 上の有限次の分離拡大である（\ref{fld:separable-degree.4}）。

**Step 4（帰着）.** 【主張：$B$ は $P'\defeq k'[y_{1}^{1/q},\dots,y_{d}^{1/q}]$ の $L'$ における整閉包 $C'$ に含まれ、$C'$ は $P$ 上有限である】 まず $P'$ は $k'$ 上の多項式環である。実際、$k'$ の元の $q$ 乗は $k$ に属するので（$k'$ は $q$ 乗が $k$ に入る元で生成され、$q$ 乗は環準同型）、$G\in k'[Z_{1},\dots,Z_{d}]$ が $0$ でなく $G(y^{1/q})=0$ をみたすと仮定すると、係数を $q$ 乗した $G^{(q)}\in k[Z]$ は $0$ でなく、$G^{(q)}(y)=G(y^{1/q})^{q}=0$ となり、$y_{i}$ が $k$ 上代数的に独立であることに反する。ゆえに $P'$ は正規なネーター環で、$\Frac P'=F'$ である。Step 2 と同じ理由で、$C'$ は $P'$ 上有限である。$P'$ は $P$ 上有限である（$k'/k$ は有限次で、$y_{i}^{1/q}$ は $X^{q}-y_{i}$ の根なので、$k'$ の $k$ 上の基底と単項式 $y^{\nu/q}$（$0\le\nu_{i}<q$）の積が $P'$ を $P$ 加群として生成する）。ゆえに $C'$ は $P$ 上有限である。$B$ の元は $P$ 上（したがって $P'$ 上）整で $L\subset L'$ に属するので、$B\subset C'$ である。$P$ はネーター環なので、有限生成 $P$ 加群 $C'$ の部分加群 $B$ も有限生成である（\ref{ring:noetherian-exact.2}）。

::: hypcheck
- **前提「体上有限生成」**：Step 1 で \ref{ring:noether-normalization} を使うのと、Step 3 で係数に現れる $k$ の元が有限個であることに使った。一般のネーター整域では整閉包は有限生成加群とは限らない：永田の例では正規化がネーター環でない（\see{ring:nagata-examples}）。正規化が有限生成 $A$ 加群なら、ネーター環上の有限な環としてネーター環になる（\ref{ring:integral-closure-finite} の Step 2 と同じ議論）ので、この例の正規化は有限生成加群でない。
- **選択公理**：使わずに示せる。本文では代数閉包の中で書き、\ref{ring:trace-conjugates} の証明でも代数的閉体 $\Omega$ と、選択公理つきで述べた \ref{fld:separable-degree} を引用しているが、現れる拡大はすべて有限次なので、代数閉包の代わりに有限個の多項式の分解体（または正規閉包）の中で同じ議論ができる。有限次の分解体は、既約因子による剰余環 $K[X]/(g)$ を有限回とって作れるので選択公理は要らない。極大イデアルの存在も使わない。
:::
:::

## 付値環による特徴付け {#ring:sec-icf-valuation}

::: theorem 付値環の存在（シュヴァレー） {#ring:chevalley-extension keywords="Chevalley extension theorem: for a subring A of a field K and a prime p there is a valuation ring V of K with A in V and m_V cap A = p" index="シュヴァレーの延長定理|しゅゔぁれーのえんちょうていり"}
（AC）体 $K$ の部分環 $A$ と $\mathfrak{p}\in\Spec A$ について、$K$ の付値環 $V\supset A$ で $\mathfrak{m}_{V}\cap A=\mathfrak{p}$ となるものがある。
:::

::: proof
**Step 1（ツォルン）.** 【主張：$\Sigma\defeq\{R : A_{\mathfrak{p}}\subset R\subset K\text{ は部分環}, \mathfrak{p}R\neq R\}$ は包含について極大元 $V$ をもつ】 $\mathfrak{p}A_{\mathfrak{p}}\neq A_{\mathfrak{p}}$ なので $A_{\mathfrak{p}}\in\Sigma$ である。$\Sigma$ の鎖の和集合 $R^{*}$ は $A_{\mathfrak{p}}$ を含む部分環である。$1\in\mathfrak{p}R^{*}$ と仮定すると、$1=\sum_{i}p_{i}r_{i}$（有限和、$p_{i}\in\mathfrak{p}$, $r_{i}\in R^{*}$）と書け、有限個の $r_{i}$ は鎖のある一つの $R$ に入るので $1\in\mathfrak{p}R$ となり矛盾する。ゆえに $R^{*}\in\Sigma$ であり、ツォルンの補題から極大元 $V$ がある。

**Step 2（局所で $\mathfrak{m}\cap A=\mathfrak{p}$）.** 【主張：$V$ は局所環で、その極大イデアル $\mathfrak{m}$ について $\mathfrak{m}\cap A=\mathfrak{p}$】 $\mathfrak{p}V\neq V$ なので、$\mathfrak{p}V$ を含む極大イデアル $\mathfrak{m}$ がある。$\mathfrak{p}V_{\mathfrak{m}}\subset\mathfrak{m}V_{\mathfrak{m}}\neq V_{\mathfrak{m}}$ なので $V_{\mathfrak{m}}\in\Sigma$ で、$V\subset V_{\mathfrak{m}}$ である。極大性から $V=V_{\mathfrak{m}}$ であり、$V$ は極大イデアル $\mathfrak{m}$ をもつ局所環である。$\mathfrak{m}\cap A_{\mathfrak{p}}$ は $\mathfrak{p}A_{\mathfrak{p}}$ を含む真のイデアルで、$\mathfrak{p}A_{\mathfrak{p}}$ は $A_{\mathfrak{p}}$ の極大イデアルなので、$\mathfrak{m}\cap A_{\mathfrak{p}}=\mathfrak{p}A_{\mathfrak{p}}$ である。ゆえに $\mathfrak{m}\cap A=\mathfrak{p}A_{\mathfrak{p}}\cap A=\mathfrak{p}$ である。

**Step 3（付値環）.** 【主張：$x\in K^{\times}$ なら $x\in V$ または $x^{-1}\in V$】 $x,x^{-1}\notin V$ と仮定する。$V[x]\supsetneq V$ は極大性から $\Sigma$ に入らないので $\mathfrak{p}V[x]=V[x]$ であり、$\mathfrak{p}\subset\mathfrak{m}$ から $\mathfrak{m}V[x]=V[x]$ である。ゆえに $1=a_{0}+a_{1}x+\dots+a_{n}x^{n}$（$a_{i}\in\mathfrak{m}$）と書ける。同様に $1=b_{0}+b_{1}x^{-1}+\dots+b_{\ell}x^{-\ell}$（$b_{j}\in\mathfrak{m}$）と書ける。$n,\ell$ をそれぞれ最小にとる（$1\notin\mathfrak{m}$ なので $n,\ell\ge1$）。$n\ge\ell$ の場合を考える（$n<\ell$ の場合は $x$ と $x^{-1}$ を入れ替えて同じ議論をする）。$1-b_{0}$ は局所環 $V$ の単元なので、$1=c_{1}x^{-1}+\dots+c_{\ell}x^{-\ell}$（$c_{j}=b_{j}/(1-b_{0})\in\mathfrak{m}$）である。両辺に $x^{n}$ を掛けると $x^{n}=c_{1}x^{n-1}+\dots+c_{\ell}x^{n-\ell}$ となる。これを最初の式の $x^{n}$ に代入すると、$1$ が $x$ の $n-1$ 次以下の $\mathfrak{m}$ 係数の多項式で書け、$n$ の最小性に反する。ゆえに $V$ は $K$ の付値環である。

::: hypcheck
- **選択公理**：Step 1 のツォルンの補題と Step 2 の極大イデアルの存在に使った。
- **$\mathfrak{p}$ が素イデアルであること**：$A_{\mathfrak{p}}$ を作るのと、Step 2 で $\mathfrak{p}A_{\mathfrak{p}}$ が極大イデアルであることに使った。
:::
:::

::: intuition
体の部分環と素イデアルを与えると、その素イデアルを「ちょうど極大イデアルの切り口」とする付値環で部分環を包める。
:::

::: theorem 整閉包は付値環の共通部分 {#ring:integral-closure-valuations keywords="the integral closure of A in K is the intersection of all valuation rings of K containing A" index="整閉包と付値環|せいへいほうとふちかん"}
（AC）体 $K$ の部分環 $A$ の $K$ における整閉包は、$A$ を含む $K$ の付値環すべての共通部分に等しい。
:::

::: proof
**Step 1（$\subset$）.** 付値環は正規（\ref{ring:valuation-properties.3}）なので、$A\subset V$ なら $A$ 上整な $K$ の元は $V$ に属する。

**Step 2（$\supset$）.** $x\in K$ が $A$ 上整でないと仮定する。$0$ は整なので $x\neq 0$ である。$A'\defeq A[x^{-1}]$ とおくと $x^{-1}A'\neq A'$ である。実際、$1=x^{-1}(a_{0}+a_{1}x^{-1}+\dots+a_{n}x^{-n})$（$a_{i}\in A$）と書けたとすると、$x^{n+1}$ を掛けて $x^{n+1}=a_{0}x^{n}+\dots+a_{n}$ となり、$x$ が整であることになって矛盾する。$x^{-1}A'$ を含む極大イデアル $\mathfrak{P}$ に \ref{ring:chevalley-extension} を使うと、$K$ の付値環 $V\supset A'\supset A$ で $\mathfrak{m}_{V}\cap A'=\mathfrak{P}$ となるものがある。ゆえに $x^{-1}\in\mathfrak{m}_{V}$ であり、$x\in V$ なら $1=x\cdot x^{-1}\in\mathfrak{m}_{V}$ となるので、$x\notin V$ である。
:::

## 問題 {#ring:sec-icf-problems}

::: problem {#ring:prob-icf-gaussian}
$A=\Z$, $L=\Q(i)$ の整閉包が $\Z[i]$ であり、$\Z$ 上階数 2 の自由加群であることを確かめよ。
:::

::: solution
$\Z$ は正規である（\ref{ring:ufd-normal}）。$a+bi$（$a,b\in\Q$）が整なら、\ref{ring:integral-trace-norm} から、トレース $2a$ とノルム $a^{2}+b^{2}$ は整数である。$(2b)^{2}=4(a^{2}+b^{2})-(2a)^{2}\in\Z$ なので、有理数 $2b$ の平方が整数であることから $2b\in\Z$ である。さらに $(2a)^{2}+(2b)^{2}=4(a^{2}+b^{2})\equiv 0\pmod 4$ であり、平方数は $4$ を法として $0$ か $1$ なので、$2a,2b$ はともに偶数である。よって $a,b\in\Z$ である。逆に $i$ は $X^{2}+1$ の根なので整であり、$\Z[i]$ の元はすべて整である（\ref{ring:integral-closure.2}）。$\Z[i]=\Z\oplus\Z i$ なので、$1,i$ を基底とする階数 $2$ の自由加群である。
:::

::: problem {#ring:prob-icf-sqrt-d}
平方因子のない整数 $d\neq 1$ について、$\Q(\sqrt{d})$ における $\Z$ の整閉包は、$d\equiv 2,3\pmod 4$ なら $\Z[\sqrt{d}]$、$d\equiv 1\pmod 4$ なら $\Z[\frac{1+\sqrt{d}}{2}]$ であることを示せ。
:::

::: solution
$b=0$ の場合、$x=a\in\Q$ が整であることは $a\in\Z$ と同値である（$\Z$ は正規）。$b\neq 0$ の場合、$x=a+b\sqrt{d}$（$a,b\in\Q$）の最小多項式は $X^{2}-2aX+(a^{2}-db^{2})$ である。ゆえに \ref{ring:integral-trace-norm} と、逆向きはこの多項式自身から、$x$ が整 $\iff$ $2a\in\Z$ かつ $a^{2}-db^{2}\in\Z$ である。$u\defeq 2a$, $v\defeq 2b$ とおくと、この条件は $u\in\Z$ かつ $u^{2}-dv^{2}\in 4\Z$ である。このとき $dv^{2}\in\Z$ であり、$v=r/t$（既約分数）と書くと $t^{2}\mid d$ となるので、$d$ が平方因子をもたないことから $t=1$、すなわち $v\in\Z$ である。したがって条件は $u,v\in\Z$ かつ $u^{2}\equiv dv^{2}\pmod 4$ である。
- $d\equiv 2,3\pmod 4$ の場合：$v$ が奇数なら $dv^{2}\equiv d\equiv 2,3$ となり、平方数は $4$ を法として $0,1$ なので矛盾する。ゆえに $v$ は偶数で、$u^{2}\equiv 0$ から $u$ も偶数であり、$a,b\in\Z$ である。逆に $a,b\in\Z$ なら条件をみたす。よって整閉包は $\Z[\sqrt{d}]$ である。
- $d\equiv 1\pmod 4$ の場合：条件は $u^{2}\equiv v^{2}\pmod 4$、すなわち $u\equiv v\pmod 2$ である（$u\equiv v$ なら $u^{2}-v^{2}=(u-v)(u+v)$ は $4$ の倍数）。$\Z[\frac{1+\sqrt{d}}{2}]=\{m+n\frac{1+\sqrt{d}}{2}:m,n\in\Z\}=\{\frac{u+v\sqrt{d}}{2}:u\equiv v\pmod 2\}$ なので、整閉包は $\Z[\frac{1+\sqrt{d}}{2}]$ である。ここで最初の等号は、$\frac{1+\sqrt{d}}{2}$ が $\Z$ 係数のモニックな多項式 $X^{2}-X+\frac{1-d}{4}$ の根であり、その平方が $1$ と $\frac{1+\sqrt{d}}{2}$ の $\Z$ 係数の一次結合で書けることによる。
:::

::: supplement
**整数論へ.** 代数体 $L$ の整数環 $\mathcal{O}_{L}$（$\Z$ の $L$ における整閉包）は、\ref{ring:integral-closure-finite} から階数 $[L:\Q]$ の自由 $\Z$ 加群で、次のページのクルル＝秋月の定理からデデキント環になる。イデアルの素因数分解、イデアル類群、単数群は数論の系列で扱う。
:::
