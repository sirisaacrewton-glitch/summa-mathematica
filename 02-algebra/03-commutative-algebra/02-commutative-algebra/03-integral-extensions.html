# 整拡大と正規環 {#ring:page-integral-extensions keywords="integral element, integral extension, integral closure, integrally closed domain, normal domain, lying over, going up, incomparability, going down, Cohen-Seidenberg"}

環の拡大 $A\subset B$ で、$B$ の元がモニックな $A$ 係数多項式の根になるとき、$B$ は $A$ 上**整**であるという（\ref{ring:integral-def}）。これは体の代数拡大の環版であり、整数論では「代数的整数」の概念にあたる。このページでは、整であることの有限生成性による特徴付け（\ref{ring:integral-criterion}）、整閉包が部分環であること、整性の推移律を示し、**正規環**（整閉整域）を定義して一意分解環が正規であることを確かめる。後半では、整拡大で素イデアルがどう振る舞うかを述べる**コーエン＝ザイデンバーグの定理**（横たわり・上昇・比較不能。\ref{ring:lying-over}, \ref{ring:going-up}）を証明する。これらは次元論で「整拡大は\term[次元]{ring:krull-dimension}を変えない」ことの基礎になる。

> Atiyah–Macdonald 第 5 章と松村『可換環論』§9 の流れを参考にした。下降定理は体論（分解体）を使うので、体論の系列ができるまで事実として引用する。

## 記法と定義の確認 {#ring:sec-ie-notation}

::: notation
- 環は可換。行列式のトリック・中山の補題は \ref{ring:determinant-trick}, \tref{ring:nakayama}、局所化と素イデアルは \ref{ring:localization-primes}, \ref{ring:localization-at-prime}、有理根定理は \tref{ring:rational-root}。
- 環の拡大 $A\subset B$ とは、$A$ が $B$ の部分環であること。より一般に環準同型 $A\to B$ についても、像を考えて同じ言葉を使う。$\mathfrak{q}\in\Spec B$ について $\mathfrak{q}\cap A$ は $A$ の素イデアル（\ref{ring:prime-preimage.1}）。
- **選択公理**：\ref{ring:lying-over}で、局所環の極大イデアルの上の極大イデアルの存在（\ref{ring:maximal-ideal-existence}）を使う。
:::

## 整な元 {#ring:sec-ie-integral}

::: definition 整な元・整拡大 {#ring:integral-def keywords="integral element, integral extension, integral dependence, finite algebra" index="整|せい, 整な元|せいなげん, 整拡大|せいかくだい, 整従属|せいじゅうぞく, 有限|ゆうげん"}
環の拡大 $A\subset B$ と $b\in B$ について、モニックな多項式 $f\in A[x]$ で $f(b)=0$ となるものがあるとき、$b$ は $A$ 上**整**であるという。$B$ のすべての元が $A$ 上整なとき、$B$ は $A$ 上整、または**整拡大**であるという。$B$ が $A$ 加群として有限生成なとき、$B$ は $A$ 上**有限**であるという。
:::

::: theorem 整であることの特徴付け {#ring:integral-criterion keywords="b is integral iff A[b] is a finitely generated A-module iff b lies in a faithful finitely generated A[b]-module" index="整であることの特徴付け|せいであることのとくちょうづけ"}
環の拡大 $A\subset B$ と $b\in B$ について、次は同値である。
1. $b$ は $A$ 上整。
2. $A[b]$ は有限生成 $A$ 加群。
3. $A[b]$ を含む $B$ の部分環 $C$ で、有限生成 $A$ 加群であるものがある。
4. 忠実な $A[b]$ 加群 $M$（$A[b]$ の $0$ でない元はどれも $M$ を零化しない）で、$A$ 加群として有限生成なものがある。
:::

::: proof
**Step 1（1⇒2）.** $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ なら $b^{n}\in A+Ab+\dots+Ab^{n-1}$ で、帰納的にすべての $b^{m}$ がこの中に入る（$b^{m+1}=b\cdot b^{m}$ を展開して $b^{n}$ を置き換える）。よって $A[b]=A+Ab+\dots+Ab^{n-1}$。

**Step 2（2⇒3⇒4）.** $C=A[b]$ とすればよい。3 の $C$ は $1\in C$ をもつので、$C$ の元 $c$ で $cC=0$ なら $c=c\cdot 1=0$、すなわち $C$ は忠実な $A[b]$ 加群。

**Step 3（4⇒1）.** $\varphi:M\to M$, $m\mapsto bm$ に行列式のトリック（\ref{ring:determinant-trick}）を $I=A$ で使うと、$\varphi^{n}+a_{1}\varphi^{n-1}+\dots+a_{n}=0$（$a_{i}\in A$）。すなわち $(b^{n}+a_{1}b^{n-1}+\dots+a_{n})M=0$ で、$M$ は忠実なので $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$。
:::

::: corollary 整閉包と推移律 {#ring:integral-closure keywords="integral closure is a subring, transitivity of integrality, finite implies integral" index="整閉包|せいへいほう, 推移律|すいいりつ"}
環の拡大 $A\subset B$ について、
1. $b_{1},\dots,b_{n}\in B$ がどれも $A$ 上整なら、$A[b_{1},\dots,b_{n}]$ は有限生成 $A$ 加群。
2. $B$ の元で $A$ 上整なもの全体 $\bar A^{B}$ は $B$ の部分環である（$A$ の $B$ における**整閉包**）。
3. （推移律）$A\subset B\subset C$ で、$B$ が $A$ 上整、$C$ が $B$ 上整なら、$C$ は $A$ 上整。
4. 有限な拡大は整拡大。有限生成な整拡大は有限。
:::

::: proof
**Step 1（1）.** $A_{k}\defeq A[b_{1},\dots,b_{k}]$ とおく。$b_{k}$ は $A$ 上、したがって $A_{k-1}$ 上整なので、\ref{ring:integral-criterion} の証明の Step 1 から $A_{k}=A_{k-1}[b_{k}]$ は有限生成 $A_{k-1}$ 加群。生成元の積をとれば、有限生成の有限生成は有限生成なので、帰納的に $A_{n}$ は有限生成 $A$ 加群。

**Step 2（2）.** $b,c$ が整なら、$A[b,c]$ は有限生成 $A$ 加群で、$b\pm c$, $bc$ を含む部分環なので、\ref{ring:integral-criterion.3}⇒1 からこれらも整。

**Step 3（3）.** $c\in C$ が $c^{n}+b_{1}c^{n-1}+\dots+b_{n}=0$（$b_{i}\in B$）をみたすとする。$B'\defeq A[b_{1},\dots,b_{n}]$ は 1 から有限生成 $A$ 加群で、$c$ は $B'$ 上整なので $B'[c]$ は有限生成 $B'$ 加群、したがって有限生成 $A$ 加群。\ref{ring:integral-criterion.3}⇒1 から $c$ は $A$ 上整。

**Step 4（4）.** 前半は \ref{ring:integral-criterion.3}⇒1（$C=B$）。後半は 1。
:::

::: definition 正規環 {#ring:normal-domain keywords="integrally closed domain, normal domain, normalization" index="整閉|せいへい, 整閉整域|せいへいせいいき, 正規環|せいきかん, 正規化|せいきか"}
整域 $A$ が商体 $K=\Frac A$ の中で整閉（$\bar A^{K}=A$）なとき、$A$ を**整閉整域**または**正規環**という。$\bar A^{K}$ を $A$ の**正規化**という。（一般の環では「すべての素イデアルでの局所化が整閉整域」を正規の定義とすることが多い。）
:::

::: proposition 一意分解環は正規 {#ring:ufd-normal keywords="UFDs are integrally closed" index="一意分解環は正規|いちいぶんかいかんはせいき"}
一意分解環は正規環である。特に $\Z$, $K[x_{1},\dots,x_{n}]$, PID は正規環。
:::

::: proof
$K$ の元 $r/s$ がモニックな $A$ 係数多項式の根なら、\ref{ring:rational-root}から $r/s\in A$。例は \ref{ring:polynomial-ufd} と \ref{ring:pid-ufd}。
:::

::: example 正規でない整域 {#ring:non-normal-examples}
1. $\Z[\sqrt{5}]$ は正規でない：$\varphi=\frac{1+\sqrt{5}}{2}$ は $x^{2}-x-1=0$ の根で商体に属するが、$\Z[\sqrt{5}]$ に属さない。正規化は $\Z[\varphi]$ である（$d\equiv 1\pmod 4$ の二次体の整数環。証明は整数論の系列で扱う）。
2. 体 $K$ 上の $A=K[t^{2},t^{3}]\subset K[t]$（$y^{2}=x^{3}$ の尖点のある曲線の座標環 $K[x,y]/(y^{2}-x^{3})$ に同型）は正規でない：$t=t^{3}/t^{2}\in\Frac A$ は $x^{2}-t^{2}=0$ の根だが $t\notin A$。正規化は $K[t]$。
3. $\Z[2i]$ は正規でない（$i$ が $x^{2}+1$ の根）。
:::

::: proposition 整閉包と局所化 {#ring:integral-localization keywords="integral closure commutes with localization, normality is a local property" index="正規性は局所的|せいきせいはきょくしょてき"}
$A\subset B$ と積閉集合 $S\subset A$ について、
1. $B$ が $A$ 上整なら $S^{-1}B$ は $S^{-1}A$ 上整。
2. $S^{-1}(\bar A^{B})=\overline{S^{-1}A}^{S^{-1}B}$。
3. （AC）整域 $A$ について、$A$ が正規 $\iff$ すべての素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ が正規 $\iff$ すべての極大イデアル $\mathfrak{m}$ で $A_{\mathfrak{m}}$ が正規。
:::

::: proof
**Step 1（1）.** $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ なら、$s\in S$ について $(b/s)^{n}+(a_{1}/s)(b/s)^{n-1}+\dots+a_{n}/s^{n}=0$。

**Step 2（2）.** $\subset$ は 1。逆に $b/s$ が $S^{-1}A$ 上整：$(b/s)^{n}+(a_{1}/s_{1})(b/s)^{n-1}+\dots+a_{n}/s_{n}=0$ とする。$t=s_{1}\cdots s_{n}$ を掛けて分母を払うと、$B$ の中で $u\bigl((tb)^{n}+c_{1}(tb)^{n-1}+\dots+c_{n}\bigr)=0$（$c_{i}\in A$, $u\in S$）の形になる（$\frac{x}{1}=0\iff ux=0$）。両辺に $u^{n-1}$ を掛けると $utb$ は $A$ 上整で、$b/s=utb/(uts)\in S^{-1}(\bar A^{B})$。

**Step 3（3）.** $K=\Frac A=\Frac A_{\mathfrak{p}}$ とし、$C=\bar A^{K}$ とする。$A$ 正規 ⇒ $C=A$ ⇒ 2 から $A_{\mathfrak{p}}$ の正規化は $C_{\mathfrak{p}}=A_{\mathfrak{p}}$。逆に、すべての $\mathfrak{m}$ で $A_{\mathfrak{m}}$ が正規なら、包含 $A\to C$ の局所化 $A_{\mathfrak{m}}\to C_{\mathfrak{m}}$ は 2 から全射、すなわち $(C/A)_{\mathfrak{m}}=0$。局所的性質（\ref{ring:local-properties.1}）から $C/A=0$。
:::

::: theorem 自己準同型環による正規性の判定 {#ring:colon-integral keywords="End(I) = (I:I) is integral over A for finitely generated I; A is normal iff End(I) = A for all finitely generated ideals" index="自己準同型環と正規性|じこじゅんどうけいかんとせいきせい"}
$A$ を整域、$K=\Frac A$ とする（商体の中の商イデアル $(M:_{K}M)$ は \ref{ring:colon-fraction}、それが $\End_{A}(M)$ と一致することは \ref{ring:hom-fractional}）。
1. $0$ でない有限生成 $A$ 部分加群 $M\subset K$ について、$(M:_{K}M)\cong\End_{A}(M)$ の元はすべて $A$ 上整。
2. $A$ が正規 $\iff$ $0$ でないすべての有限生成イデアル $I$ について $(I:_{K}I)=A$（すなわち $\End_{A}(I)=A$）。
:::

::: proof
**Step 1（1）.** $x\in(M:_{K}M)$ なら $xM\subset M$ なので $M$ は $A[x]$ 加群で、$A$ 上有限生成。忠実でもある：$g\in A[x]\subset K$ が $M$ を零化すれば、$0\neq m\in M$ について $gm=0$ で、$K$ は体なので $g=0$。\ref{ring:integral-criterion.4} から $x$ は $A$ 上整。

**Step 2（2、$\Rightarrow$）.** $A\subset(I:_{K}I)$ は常に成り立つ。1 から $(I:_{K}I)$ の元は $A$ 上整で、$A$ は正規なので $A$ に属する。

**Step 3（2、$\Leftarrow$）.** $x=a/b\in K$（$a,b\in A$, $b\neq0$）が $A$ 上整で $x^{n}+c_{1}x^{n-1}+\dots+c_{n}=0$（$c_{i}\in A$, $n\ge1$）とする。$N\defeq A+Ax+\dots+Ax^{n-1}\subset K$ とおくと、整従属式から $x^{n}\in N$ なので $xN\subset N$。$0\le i\le n-1$ で $b^{n-1}x^{i}=a^{i}b^{n-1-i}\in A$ なので、$I\defeq b^{n-1}N$ は $A$ のイデアルで、$0$ でなく（$b^{n-1}\in I$）有限生成（$n$ 個の元で生成）。$xI=b^{n-1}xN\subset b^{n-1}N=I$ なので $x\in(I:_{K}I)=A$。よって $A$ は正規。

::: hypcheck
- **前提「有限生成」**：Step 1 の \ref{ring:integral-criterion} に使った。外すと偽：$M=K$ なら $(K:_{K}K)=K$ で、$A\neq K$ なら $K$ の元は一般に $A$ 上整でない（例：$A=\Z$ で $1/2$）。
- **前提「整域」**：商体 $K$ をとるのに使った。
:::
:::

::: example
\ref{ring:non-normal-examples.2} の $A=k[t^{2},t^{3}]$ では、極大イデアル $\mathfrak{n}=(t^{2},t^{3})$ について $\End_{A}(\mathfrak{n})=k[t]\neq A$（\ref{ring:sec-ia-colon-hom} の例）。2 の「$\Leftarrow$」の証明で $x=t=t^{3}/t^{2}$（$n=2$, $b=t^{2}$）とすると、$I=t^{2}(A+At)$ は $t^{2}k[t]=\mathfrak{n}$ と一致し、同じイデアルが現れる。
:::

::: supplement
**正規化の計算.** ネーター整域では、$0$ でない適当なイデアル $J$ をとって $A\subset\End_{A}(J)\subset\End_{A}(J')\subset\cdots$ と自己準同型環をとり続けることで、正規化に近づける。グラウエルト＝レンメルトの判定法（$J$ を「正規でない点の集合」を零点に含む根基イデアルにとると、$A$ が正規 $\iff\End_{A}(J)=A$）と、それを使って体上有限生成な整域の正規化を計算するアルゴリズム（デ・ヨング、1998 年など）が知られている（本サイト未収録）。このアルゴリズムはグレブナー基底の計算を使い、最悪の場合の計算量は大きい。
:::

## コーエン＝ザイデンバーグの定理 {#ring:sec-ie-cohen-seidenberg}

::: proposition 整拡大と体 {#ring:integral-field keywords="in an integral extension of domains A is a field iff B is a field, contraction of maximal ideals" index="整拡大と体|せいかくだいとたい"}
$A\subset B$ を整域の整拡大とする。
1. $A$ が体であることと $B$ が体であることは同値である。
2. $\mathfrak{q}\in\Spec B$（$B$ は整域とは限らない一般の整拡大でよい）について、$\mathfrak{q}$ が極大 $\iff\mathfrak{q}\cap A$ が極大。
:::

::: proof
**Step 1（1、⇒）.** $0\neq b\in B$ の満たすモニックな式で次数最小のもの $b^{n}+a_{1}b^{n-1}+\dots+a_{n}=0$ をとる。整域で次数最小なので $a_{n}\neq 0$（$a_{n}=0$ なら $b$ で割って次数が下がる）。$b(b^{n-1}+\dots+a_{n-1})=-a_{n}$ で、$A$ は体なので $b^{-1}=-a_{n}^{-1}(b^{n-1}+\dots+a_{n-1})\in B$。

**Step 2（1、⇐）.** $0\neq a\in A$ について $a^{-1}\in B$ は $A$ 上整：$a^{-m}+c_{1}a^{-m+1}+\dots+c_{m}=0$。$a^{m-1}$ を掛けて $a^{-1}=-(c_{1}+c_{2}a+\dots+c_{m}a^{m-1})\in A$。

**Step 3（2）.** $B/\mathfrak{q}$ は $A/(\mathfrak{q}\cap A)$ 上整な整域（式を還元する）。1 と \ref{ring:prime-maximal-quotient.2} から。
:::

::: theorem 比較不能定理 {#ring:incomparability keywords="incomparability in integral extensions" index="比較不能|ひかくふのう" refname="比較不能定理"}
$A\subset B$ を整拡大、$\mathfrak{q}\subset\mathfrak{q}'$ を $B$ の素イデアルとする。$\mathfrak{q}\cap A=\mathfrak{q}'\cap A$ なら $\mathfrak{q}=\mathfrak{q}'$。
:::

::: proof
$\mathfrak{p}\defeq\mathfrak{q}\cap A$, $S\defeq A\setminus\mathfrak{p}$ とし、局所化 $A_{\mathfrak{p}}\subset B_{\mathfrak{p}}\defeq S^{-1}B$（整拡大。\ref{ring:integral-localization.1}）を考える。$\mathfrak{q},\mathfrak{q}'$ は $S$ と交わらないので、$B_{\mathfrak{p}}$ の素イデアル $\mathfrak{q}B_{\mathfrak{p}}\subset\mathfrak{q}'B_{\mathfrak{p}}$ に対応し（\ref{ring:localization-primes}）、その $A_{\mathfrak{p}}$ との共通部分はどちらも極大イデアル $\mathfrak{p}A_{\mathfrak{p}}$。\ref{ring:integral-field.2} から両方とも極大で、包含関係にあるので等しい。対応の単射性から $\mathfrak{q}=\mathfrak{q}'$。
:::

::: theorem 横たわり定理 {#ring:lying-over keywords="lying over theorem" index="横たわり定理|よこたわりていり, 上にある素イデアル|うえにあるそいである" refname="横たわり定理"}
（AC）$A\subset B$ を整拡大、$\mathfrak{p}\in\Spec A$ とする。$\mathfrak{q}\cap A=\mathfrak{p}$ となる $\mathfrak{q}\in\Spec B$（$\mathfrak{p}$ の**上にある**素イデアル）が存在する。
:::

::: proof
**Step 1（局所化）.** $S=A\setminus\mathfrak{p}$ で局所化すると、$A_{\mathfrak{p}}\subset B_{\mathfrak{p}}$ は整拡大。$B_{\mathfrak{p}}\neq 0$（$1\neq 0$：$0\notin S$ なので $S^{-1}B$ は零環でない。$A\subset B$ なので $S\subset B$ でも $0\notin S$）。

**Step 2（極大イデアル）.** $B_{\mathfrak{p}}$ の極大イデアル $\mathfrak{n}$ をとる（\ref{ring:maximal-ideal-existence}）。$\mathfrak{n}\cap A_{\mathfrak{p}}$ は \ref{ring:integral-field.2} から極大、すなわち $\mathfrak{p}A_{\mathfrak{p}}$（局所環の唯一の極大イデアル）。

**Step 3（引き戻し）.** $\mathfrak{q}\defeq\mathfrak{n}\cap B$（$B\to B_{\mathfrak{p}}$ による逆像）は $B$ の素イデアルで、可換図式（$A\to B\to B_{\mathfrak{p}}$ と $A\to A_{\mathfrak{p}}\to B_{\mathfrak{p}}$ は等しい）から $\mathfrak{q}\cap A$ は $\mathfrak{p}A_{\mathfrak{p}}$ の $A$ への逆像、すなわち $\mathfrak{p}$（\ref{ring:localization-primes}）。
:::

::: theorem 上昇定理 {#ring:going-up keywords="going up theorem" index="上昇定理|じょうしょうていり" refname="上昇定理"}
（AC）$A\subset B$ を整拡大、$\mathfrak{p}_{1}\subset\mathfrak{p}_{2}\subset\dots\subset\mathfrak{p}_{n}$ を $A$ の素イデアルの鎖、$\mathfrak{q}_{1}\subset\dots\subset\mathfrak{q}_{m}$（$m<n$）を $\mathfrak{q}_{i}\cap A=\mathfrak{p}_{i}$ となる $B$ の素イデアルの鎖とする。これを $\mathfrak{q}_{1}\subset\dots\subset\mathfrak{q}_{n}$, $\mathfrak{q}_{i}\cap A=\mathfrak{p}_{i}$ に延長できる。
:::

::: proof
帰納法により $m=1$, $n=2$ の場合を示せばよい。$\bar A\defeq A/\mathfrak{p}_{1}\subset\bar B\defeq B/\mathfrak{q}_{1}$ は整拡大（$\mathfrak{q}_{1}\cap A=\mathfrak{p}_{1}$ なので包含は単射）。\ref{ring:lying-over}を $\bar A$ の素イデアル $\mathfrak{p}_{2}/\mathfrak{p}_{1}$ に使うと、その上にある $\bar B$ の素イデアル $\bar{\mathfrak{q}}_{2}$ があり、その $B$ への逆像 $\mathfrak{q}_{2}\supset\mathfrak{q}_{1}$ が $\mathfrak{q}_{2}\cap A=\mathfrak{p}_{2}$ をみたす（\ref{ring:prime-preimage.2}）。
:::

::: lemma イデアル上整な元 {#ring:integral-over-ideal keywords="x is integral over an ideal p iff x lies in the radical of pC, C the integral closure" index="イデアル上整|いであるじょうせい"}
環の拡大 $A\subset B$、$A$ のイデアル $\mathfrak{p}$、$A$ の $B$ における整閉包 $C$ について、$x\in B$ が $\mathfrak{p}$ 上整（$x^{n}+a_{1}x^{n-1}+\dots+a_{n}=0$, $a_{i}\in\mathfrak{p}$ となる式がある）$\iff$ $x\in\sqrt{\mathfrak{p}C}$。特に $\mathfrak{p}$ 上整な元全体は $C$ のイデアルで、和と積で閉じる。
:::

::: proof
**Step 1（⇒）.** $x$ は $A$ 上整なので $x\in C$ で、$x^{n}=-\sum a_{i}x^{n-i}\in\mathfrak{p}C$。

**Step 2（⇐）.** $x^{n}=\sum_{i=1}^{m}a_{i}c_{i}$（$a_{i}\in\mathfrak{p}$, $c_{i}\in C$）とする。$M\defeq A[x,c_{1},\dots,c_{m}]$ は有限生成 $A$ 加群（\ref{ring:integral-closure.1}）で、$x^{n}M\subset\mathfrak{p}M$。行列式のトリック（\ref{ring:determinant-trick}）から $\varphi=x^{n}$ 倍は $\varphi^{r}+b_{1}\varphi^{r-1}+\dots+b_{r}=0$（$b_{k}\in\mathfrak{p}^{k}\subset\mathfrak{p}$）をみたし、$1\in M$ に施して $x$ は $\mathfrak{p}$ 上整。根基はイデアルなので後半。
:::

::: lemma 最小多項式の係数 {#ring:minimal-polynomial-ideal keywords="for A normal, the minimal polynomial over K of an element integral over p has coefficients in rad p" index="最小多項式と整性|さいしょうたこうしきとせいせい"}
$A$ を正規環、$K=\Frac A$、$\mathfrak{p}$ を $A$ のイデアル、$L$ を $K$ の拡大体、$x\in L$ を $\mathfrak{p}$ 上整な元とする。$x$ の $K$ 上の最小多項式 $g=x^{r}+u_{1}x^{r-1}+\dots+u_{r}$ の係数は $u_{i}\in\sqrt{\mathfrak{p}}$ をみたす。特に（$\mathfrak{p}=A$ として）$A$ 上整な元の最小多項式は $A[x]$ に属する。
:::

::: proof
**Step 1（共役も整）.** $h\in\mathfrak{p}$ 係数のモニック多項式で $h(x)=0$ とすると、$g\mid h$（\ref{fld:minimal-polynomial-properties}）。$g$ の $K$ 上の分解体 $N$（\ref{fld:splitting-field-existence}）で $g=\prod_{j}(X-y_{j})$ と書くと、各 $y_{j}$ は $h$ の根なので $\mathfrak{p}$ 上整。

**Step 2（係数）.** $C$ を $A$ の $N$ における整閉包とすると、\ref{ring:integral-over-ideal} から $y_{j}\in\sqrt{\mathfrak{p}C}$ で、$u_{i}$ は $y_{j}$ の基本対称式の $\pm1$ 倍なので $u_{i}\in\sqrt{\mathfrak{p}C}$、すなわち $\mathfrak{p}$ 上整。$u_{i}\in K$ は $A$ 上整で $A$ は正規なので $u_{i}\in A$。$u_{i}^{n}+a_{1}u_{i}^{n-1}+\dots+a_{n}=0$（$a_{k}\in\mathfrak{p}$）から $u_{i}^{n}\in\mathfrak{p}$、$u_{i}\in\sqrt{\mathfrak{p}}$。
:::

::: lemma 縮約になる素イデアル {#ring:contraction-criterion keywords="a prime p of A is a contraction of a prime of B iff pB intersect A = p" index="縮約になる素イデアル|しゅくやくになるそいである"}
（AC）環準同型 $f\colon A\to B$ と $\mathfrak{p}\in\Spec A$ について、$f^{-1}(\mathfrak{q})=\mathfrak{p}$ となる $\mathfrak{q}\in\Spec B$ がある $\iff$ $f^{-1}(f(\mathfrak{p})B)=\mathfrak{p}$。
:::

::: proof
⇒：$\mathfrak{p}\subset f^{-1}(f(\mathfrak{p})B)\subset f^{-1}(\mathfrak{q})=\mathfrak{p}$。⇐：$S\defeq f(A\setminus\mathfrak{p})$ は $B$ の積閉集合で、$f(\mathfrak{p})B\cap S=\emptyset$（交われば $f^{-1}(f(\mathfrak{p})B)\not\subset\mathfrak{p}$）。$S^{-1}(f(\mathfrak{p})B)$ は真のイデアルなので極大イデアル $\mathfrak{n}$ に含まれ（\ref{ring:maximal-ideal-existence}）、$\mathfrak{q}\defeq\mathfrak{n}\cap B$（逆像）は $f(\mathfrak{p})B$ を含み $S$ と交わらない素イデアル。$f^{-1}(\mathfrak{q})$ は $\mathfrak{p}$ を含み $A\setminus\mathfrak{p}$ と交わらないので $\mathfrak{p}$。
:::

::: theorem 下降定理 {#ring:going-down keywords="going down theorem for integral extensions of normal domains" index="下降定理|かこうていり" refname="下降定理"}
（AC）$A\subset B$ を整域の整拡大で、$A$ は正規環とする。$A$ の素イデアルの鎖 $\mathfrak{p}_{1}\supset\mathfrak{p}_{2}$ と $\mathfrak{q}_{1}\cap A=\mathfrak{p}_{1}$ となる $\mathfrak{q}_{1}\in\Spec B$ について、$\mathfrak{q}_{1}\supset\mathfrak{q}_{2}$, $\mathfrak{q}_{2}\cap A=\mathfrak{p}_{2}$ となる $\mathfrak{q}_{2}\in\Spec B$ がある。
:::

::: proof
**Step 1（帰着）.** $B'\defeq B_{\mathfrak{q}_{1}}$ とする。$\mathfrak{p}_{2}B'\cap A=\mathfrak{p}_{2}$ を示せば、\ref{ring:contraction-criterion} から $\mathfrak{n}\cap A=\mathfrak{p}_{2}$ となる $\mathfrak{n}\in\Spec B'$ があり、$\mathfrak{q}_{2}\defeq\mathfrak{n}\cap B$ は $\mathfrak{q}_{1}$ に含まれる（$B'$ の素イデアルは $\mathfrak{q}_{1}$ に含まれる素イデアルに対応。\ref{ring:localization-primes}）素イデアルで $\mathfrak{q}_{2}\cap A=\mathfrak{p}_{2}$。

**Step 2（$y$ の最小多項式）.** $x\in\mathfrak{p}_{2}B'\cap A$, $x\neq 0$ とし、$x=y/s$（$y\in\mathfrak{p}_{2}B$, $s\in B\setminus\mathfrak{q}_{1}$）と書く。$K=\Frac A$, $L=\Frac B$ とする。$y\in\mathfrak{p}_{2}B\subset\sqrt{\mathfrak{p}_{2}B}$ は \ref{ring:integral-over-ideal}（$C\supset B$, $B$ は $A$ 上整）から $\mathfrak{p}_{2}$ 上整で、\ref{ring:minimal-polynomial-ideal} から $y$ の $K$ 上の最小多項式 $y^{r}+u_{1}y^{r-1}+\dots+u_{r}$ は $u_{i}\in\mathfrak{p}_{2}$ をみたす。

**Step 3（$s$ の最小多項式）.** $s=x^{-1}y$ で $x^{-1}\in K$ なので、$s$ の最小多項式は $s^{r}+v_{1}s^{r-1}+\dots+v_{r}$, $v_{i}=u_{i}/x^{i}$（次数 $r$ の多項式で $s$ を根にもつモニックなもの。次数が小さいものがあれば $y$ に戻して矛盾）。$s\in B$ は $A$ 上整なので $v_{i}\in A$（\ref{ring:minimal-polynomial-ideal}、$\mathfrak{p}=A$）。

**Step 4（結論）.** $x\notin\mathfrak{p}_{2}$ と仮定すると、$x^{i}v_{i}=u_{i}\in\mathfrak{p}_{2}$ から $v_{i}\in\mathfrak{p}_{2}$。すると $s^{r}=-\sum v_{i}s^{r-i}\in\mathfrak{p}_{2}B\subset\mathfrak{p}_{1}B\subset\mathfrak{q}_{1}$ で $s\in\mathfrak{q}_{1}$、矛盾。よって $\mathfrak{p}_{2}B'\cap A\subset\mathfrak{p}_{2}$、逆の包含は明らか。
:::

::: hypcheck
- **前提「$A$ は正規」**：\ref{ring:minimal-polynomial-ideal} で、最小多項式の係数が $A$ に入ることに使った（Step 2・3）。
- **前提「$B$ は整域」**：最小多項式（$K$ 上の体 $L$ の中）を使うのに使った。
- **選択公理**：分解体は不要だが、\ref{ring:contraction-criterion} の極大イデアルで使う。
- 平坦な拡大でも下降定理が成り立つ（\ref{ring:going-down-flat}）。
:::

::: theorem 平坦な拡大の下降定理 {#ring:going-down-flat keywords="going down for flat ring homomorphisms" index="下降定理（平坦）|かこうていりへいたん"}
（AC）環準同型 $f\colon A\to B$ で $B$ が平坦な $A$ 加群とする。$A$ の素イデアル $\mathfrak{p}_{1}\supset\mathfrak{p}_{2}$ と $f^{-1}(\mathfrak{q}_{1})=\mathfrak{p}_{1}$ となる $\mathfrak{q}_{1}\in\Spec B$ について、$\mathfrak{q}_{1}\supset\mathfrak{q}_{2}$, $f^{-1}(\mathfrak{q}_{2})=\mathfrak{p}_{2}$ となる $\mathfrak{q}_{2}\in\Spec B$ がある。
:::

::: proof
**Step 1（局所化しても平坦）.** $A'\defeq A_{\mathfrak{p}_{1}}$, $B'\defeq B_{\mathfrak{q}_{1}}$ とし、$f$ が誘導する $A'\to B'$ を考える（$A\setminus\mathfrak{p}_{1}$ の像は $B\setminus\mathfrak{q}_{1}$ に入る）。$A'$ 加群 $N$ について $N\otimes_{A'}B'\cong N\otimes_{A}B'\cong(N\otimes_{A}B)\otimes_{B}B'$（$N\otimes_{A}A'\cong N$ と結合法則）で、右辺は $N$ について完全（$B$ は $A$ 上平坦、$B'$ は $B$ 上平坦。\ref{ring:localization-exact}）。よって $B'$ は平坦な $A'$ 加群。

**Step 2（忠実平坦）.** $A'$ の極大イデアルは $\mathfrak{p}_{1}A'$ だけで、その像は $\mathfrak{q}_{1}B'\neq B'$ に入るので $\mathfrak{p}_{1}A'\cdot B'\neq B'$。\ref{mod:faithfully-flat.3} から $B'$ は忠実平坦。

**Step 3（縮約）.** $A'$ のイデアル $I$ について $IB'\cap A'=I$：$N\defeq(IB'\cap A')/I$ とすると、平坦性から $N\otimes_{A'}B'\cong(IB'\cap A')B'/IB'=0$（左辺の部分加群のテンソル積は像と一致）なので、忠実平坦性（\ref{mod:faithfully-flat.2}）から $N=0$。$I=\mathfrak{p}_{2}A'$ に \ref{ring:contraction-criterion} を使うと、$\mathfrak{p}_{2}A'$ の上にある $\mathfrak{n}\in\Spec B'$ があり、$\mathfrak{q}_{2}\defeq\mathfrak{n}\cap B\subset\mathfrak{q}_{1}$ が求めるもの。
:::

::: theorem 多項式環の整閉性 {#ring:polynomial-integrally-closed keywords="if A is integrally closed in B then A[x] is integrally closed in B[x]; A normal implies A[x] normal" index="多項式環の整閉性|たこうしきかんのせいへいせい"}
環の拡大 $A\subset B$ で $A$ が $B$ の中で整閉なら、$A[x]$ は $B[x]$ の中で整閉。特に $A$ が正規なら $A[x]$ も正規。
:::

::: proof
**Step 1（分解する拡大）.** $B$ 上のモニック多項式 $f$ について、$B'\defeq B[t]/(f(t))$ は $B$ 上の自由加群（基底 $1,\bar t,\dots,\bar t^{\deg f-1}$。モニックで割る割り算 \ref{ring:polynomial-division}）で $B\subset B'$、$f(\bar t)=0$。因数定理で $f=(x-\bar t)f_{1}$ と分け、$f_{1}$ に繰り返すと、$f$ が一次式の積に分解する環の拡大 $B''\supset B$ が得られる。

**Step 2（モニックな因子）.** $f,g\in B[x]$ がモニックで $fg\in A[x]$ とする。$f,g$ が分解する拡大 $B''$（Step 1 を $f$, $g$ について続ける）で $f=\prod(x-\xi_{i})$, $g=\prod(x-\eta_{j})$。$\xi_{i},\eta_{j}$ はモニックな $fg\in A[x]$ の根なので $A$ 上整で、$f,g$ の係数はそれらの多項式なので $A$ 上整（\ref{ring:integral-closure.2}）。係数は $B$ に属し、$A$ は $B$ の中で整閉なので $A$ に属する。

**Step 3（本題）.** $f\in B[x]$ が $A[x]$ 上整：$f^{m}+g_{1}f^{m-1}+\dots+g_{m}=0$（$g_{i}\in A[x]$）とする。$r$ を $\deg f$ と $\deg g_{i}$ より大きくとり $f_{1}\defeq f-x^{r}$ とすると、$(f_{1}+x^{r})^{m}+\cdots=0$ を展開して $f_{1}^{m}+h_{1}f_{1}^{m-1}+\dots+h_{m}=0$（$h_{i}\in A[x]$）、$h_{m}=x^{rm}+g_{1}x^{r(m-1)}+\dots+g_{m}$ は $r$ の選び方からモニック。$-f_{1}\cdot(f_{1}^{m-1}+h_{1}f_{1}^{m-2}+\dots+h_{m-1})=h_{m}$ で、$-f_{1}=x^{r}-f$ はモニック、もう一方の因子は $(-1)^{m-1}$ 倍するとモニック（最高次は $f_{1}^{m-1}$ の $(-x^{r})^{m-1}$）。Step 2 から $f_{1}\in A[x]$、よって $f\in A[x]$。

**Step 4（正規）.** $A$ が正規なら $A[x]$ は $K[x]$ の中で整閉（$B=K$）。$K[x]$ は一意分解環で正規（\ref{ring:ufd-normal}）なので $K(x)$ の中で整閉。$K(x)$ の元が $A[x]$ 上整なら $K[x]$ 上整で $K[x]$ に属し、さらに $A[x]$ に属する。$A[x]$ は整域で $\Frac A[x]=K(x)$。
:::

::: supplement
**続き.** 整閉包の商体・トレース・有限性・ネーターの有限性定理・付値環による特徴付けは \ref{ring:page-integral-closure-finiteness}、クルル＝秋月の定理・ネーター正規整域の構造・正規性のセールの判定法は \ref{ring:page-krull-akizuki-normality} で扱う。

**\term[次元]{ring:krull-dimension}への応用.** 上昇定理と比較不能定理を合わせると、整拡大 $A\subset B$ で $\dim A=\dim B$（クルル次元。\ref{ring:page-dimension-theory}）が従う：$A$ の素イデアルの鎖は $B$ の同じ長さの鎖に持ち上がり（上昇）、$B$ の真の鎖は $A$ に落としても真のまま（比較不能）。ネーターの正規化（\ref{ring:nullstellensatz} の準備）と組み合わせて、体上の有限生成整域の次元が超越次数に等しいことを示すのに使う。

**幾何的な意味.** 整拡大 $A\subset B$ は $\Spec B\to\Spec A$ が**全射**（横たわり）で、ファイバーが「有限個の点の離散集合」のように振る舞う（比較不能）射に対応する。代数曲線の正規化 $K[t^{2},t^{3}]\subset K[t]$ では、尖点の上にただ一点があり、正規化は「特異点をほどく」操作になる。
:::

## 整拡大で上下に伝わる性質 {#ring:sec-ie-transfer}

整拡大 $A\subset B$ では、$B$ の情報が $A$ に「縮約」で下り、$A$ の情報が横たわり定理で $B$ に「持ち上がる」。\ref{ring:integral-field} と同じ系統の主張をまとめる。

::: proposition 整拡大で伝わる性質 {#ring:integral-transfer keywords="units, Jacobson radical, nilradical, local rings and ideals under integral extensions" index="整拡大と単元|せいかくだいとたんげん, 整拡大とジャコブソン根基|せいかくだいとじゃこぶそんこんき"}
$A\subset B$ を整拡大（整域とは限らない）とする。
1. $A\cap B^{\times}=A^{\times}$。
2. $\mathrm{nil}(A)=\mathrm{nil}(B)\cap A$。特に $B$ が被約なら $A$ も被約。
3. （AC）$A$ のイデアル $I$ について $IB\cap A\subset\sqrt{I}$。特に $I\neq A$ なら $IB\neq B$。
4. （AC）$\mathrm{rad}(A)=\mathrm{rad}(B)\cap A$。
5. （AC）$B$ が局所環なら $A$ も局所環。
6. $B$ が有限生成 $A$ 加群（$n$ 個の元で生成）なら、各 $\mathfrak{p}\in\Spec A$ の上にある $B$ の素イデアルは $n$ 個以下である。
:::

::: proof
**Step 1（1）.** $\supset$ は $A^{\times}\subset B^{\times}$ から明らか。$a\in A$ が $B$ で可逆とし、$a^{-1}\in B$ の $A$ 上の整従属式 $a^{-m}+c_{1}a^{-m+1}+\dots+c_{m}=0$（$c_{i}\in A$, $m\ge1$）をとる。$a^{m-1}$ を掛けると $a^{-1}=-(c_{1}+c_{2}a+\dots+c_{m}a^{m-1})\in A$。（\ref{ring:integral-field} の Step 2 と同じ計算で、整域であることは使わない。）

**Step 2（2）.** $a\in A$ が冪零であることは $a^{n}=0$ となる $n$ があることで、これは $A$ で計算しても $B$ で計算しても同じ。整であることも使わない（任意の部分環で成り立つ）。

**Step 3（3）.** $\mathfrak{p}\supset I$ を $A$ の素イデアルとする。\ref{ring:lying-over}から $\mathfrak{q}\cap A=\mathfrak{p}$ となる $\mathfrak{q}\in\Spec B$ がある。$IB\subset\mathfrak{p}B\subset\mathfrak{q}$ なので $IB\cap A\subset\mathfrak{q}\cap A=\mathfrak{p}$。$\mathfrak{p}\supset I$ について共通部分をとり、\ref{ring:radical-properties.2} から $IB\cap A\subset\sqrt{I}$。$IB=B$ なら $1\in\sqrt{I}$、よって $I=A$（\ref{ring:radical-properties.3}）。

**Step 4（4）.** $A$ の極大イデアル全体を $\operatorname{Max}A$ と書く。主張は「$\{\mathfrak{n}\cap A:\mathfrak{n}\in\operatorname{Max}B\}=\operatorname{Max}A$」から従う：実際そうなら
$$
\mathrm{rad}(B)\cap A=\bigcap_{\mathfrak{n}\in\operatorname{Max}B}(\mathfrak{n}\cap A)=\bigcap_{\mathfrak{m}\in\operatorname{Max}A}\mathfrak{m}=\mathrm{rad}(A).
$$
$\subset$：$\mathfrak{n}\in\operatorname{Max}B$ なら $\mathfrak{n}\cap A$ は極大（\ref{ring:integral-field.2}）。$\supset$：$\mathfrak{m}\in\operatorname{Max}A$ の上にある $\mathfrak{q}$ を横たわり定理でとると、$\mathfrak{q}\cap A=\mathfrak{m}$ は極大なので \ref{ring:integral-field.2} から $\mathfrak{q}\in\operatorname{Max}B$。

**Step 5（5）.** Step 4 の等式から、$\operatorname{Max}B$ が 1 点なら $\operatorname{Max}A$ も 1 点。

**Step 6（6）.** $B=Ab_{1}+\dots+Ab_{n}$ とし、$\kappa\defeq A_{\mathfrak{p}}/\mathfrak{p}A_{\mathfrak{p}}$（$\mathfrak{p}$ の剰余体）、$\bar B\defeq B_{\mathfrak{p}}/\mathfrak{p}B_{\mathfrak{p}}$ とおく。$\bar B$ は $\kappa$ 代数で、$b_{i}$ の像が $\kappa$ 上張るので $\dim_{\kappa}\bar B\le n$。
- （上にある素イデアル ↔ $\bar B$ の素イデアル）\ref{ring:localization-primes} から、$\mathfrak{q}\cap(A\setminus\mathfrak{p})=\emptyset$ となる $\mathfrak{q}\in\Spec B$ は $\Spec B_{\mathfrak{p}}$ と 1 対 1 に対応し、さらに $\mathfrak{q}\supset\mathfrak{p}B$ という条件は $\mathfrak{q}B_{\mathfrak{p}}\supset\mathfrak{p}B_{\mathfrak{p}}$ に対応する（\ref{ring:prime-preimage}）。$\mathfrak{q}\cap A=\mathfrak{p}$ はこの二条件（$\mathfrak{q}\cap A\subset\mathfrak{p}$ と $\supset\mathfrak{p}$）を合わせたものなので、$\mathfrak{p}$ の上にある素イデアルは $\Spec\bar B$ と 1 対 1 に対応する。
- （$\Spec\bar B$ は $n$ 点以下）$\bar B$ の素イデアル $\bar{\mathfrak{q}}$ について、$\bar B/\bar{\mathfrak{q}}$ は体 $\kappa$ 上整（有限次元なので \ref{ring:integral-criterion}）な整域なので、\ref{ring:integral-field.1} から体。よって $\bar B$ の素イデアルはすべて極大。相異なる $\bar{\mathfrak{q}}_{1},\dots,\bar{\mathfrak{q}}_{r}$ はどの二つも互いに素なので、\ref{ring:chinese-remainder}から全射 $\bar B\to\prod_{i\le r}\bar B/\bar{\mathfrak{q}}_{i}$ があり、右辺は $\kappa$ 上 $r$ 次元以上。よって $r\le\dim_{\kappa}\bar B\le n$。

::: hypcheck
- **前提「整」（1・3・4・5）**：1 の Step 1、3〜5 の横たわり定理と \ref{ring:integral-field} で使った。外すと偽（$\Q$ は $\Z$ 上整でない）：1 は $\Z\subset\Q$ で $2\in\Z\cap\Q^{\times}$ だが $2\notin\Z^{\times}$。3 は $2\Z\cdot\Q=\Q$。4 は $\Z_{(2)}\subset\Q$ で $\mathrm{rad}(\Q)\cap\Z_{(2)}=0\neq 2\Z_{(2)}=\mathrm{rad}(\Z_{(2)})$。5 は $\Q$ が局所環なのに部分環 $\Z$ は局所環でない。
- **前提「有限生成」（6）**：Step 6 の\term[次元]{lin:dimension}の評価に使った。整だけでは偽：体 $k$ 上の「有限個の値しかとらない数列」全体 $B\subset k^{\N}$ は $k$ 上整（値が $c_{1},\dots,c_{r}$ の数列 $s$ は $\prod_{j}(s-c_{j})=0$ をみたす）だが、$\mathfrak{q}_{n}\defeq\{s:s_{n}=0\}$（$n\in\N$）は相異なる素イデアル（$B/\mathfrak{q}_{n}\cong k$）で、すべて $(0)\in\Spec k$ の上にある。
- **選択公理**：3〜5 で横たわり定理を通して使う。1・2・6 は使わない。
:::
:::

::: example 逆向きは伝わらない
整拡大 $A\subset B$ で、上の命題の「逆」はいずれも成り立たない。
1. **$A$ が体でも $B$ は体とは限らない**（\ref{ring:integral-field.1} の前提「$B$ は整域」は外せない）：$k\subset k\times k$（対角）は整（$(a,b)$ は $(x-a)(x-b)=0$ の根）だが、$k\times k$ は零因子 $(1,0)$ をもつ。$k\subset k[x]/(x^{2})$ も整で、$x$ は冪零。
2. **$A$ が被約でも $B$ は被約とは限らない**：同じく $k\subset k[x]/(x^{2})$。
3. **$A$ が局所環でも $B$ は局所環とは限らない**：$k\subset k\times k$ の極大イデアルは $k\times0$ と $0\times k$ の二つ。整数論では、$\Z_{(5)}\subset\Z_{(5)}[i]$ の極大イデアルは $2+i$ と $2-i$ で生成される二つ（$5=(2+i)(2-i)$ で、これらは $\Z[i]$ の $5$ の上にある素イデアル）。
4. **$A$ が整域でも $B$ は整域とは限らない**：1 の例。逆に $B$ が整域なら部分環 $A$ は整域。
5. **$A$ が正規でも $B$ は正規とは限らない、その逆も**：$\Z\subset\Z[\sqrt{-3}]$（$\Z[\sqrt{-3}]$ は正規でない。\ref{ring:non-normal-examples} と同様に $(1+\sqrt{-3})/2$ が分数体の中で整）、$k[t^{2}]\subset k[t]$ で $k[t^{2}]$ は正規（多項式環）。$B$ が正規で $A$ が正規でない例：$k[t^{2},t^{3}]\subset k[t]$。
:::

::: remark 素イデアルの対応のまとめ
整拡大 $A\subset B$ について、$\Spec B\to\Spec A$, $\mathfrak{q}\mapsto\mathfrak{q}\cap A$ は
- 全射（横たわり、\ref{ring:lying-over}）、
- 閉点を閉点に移し、閉点の逆像は閉点だけ（\ref{ring:integral-field.2}）、
- ファイバーの中に包含関係がない（比較不能、\ref{ring:incomparability}）、
- 鎖が持ち上がる（上昇、\ref{ring:going-up}）、$A$ が正規で $B$ が整域なら下にも持ち上がる（下降、\ref{ring:going-down}）、
- $\dim A=\dim B$（\ref{ring:integral-dimension}）。同じ議論（$\mathfrak{q}$ で終わる鎖を比較不能定理で縮約する）から $\operatorname{ht}\mathfrak{q}\le\operatorname{ht}(\mathfrak{q}\cap A)$。
:::

## 問題 {#ring:sec-ie-problems}

::: problem {#ring:prob-integral-z-i}
$\Z[i]$ は $\Z$ 上整であり、$\Z[i]$ の素イデアル $(1+i)$ は $\Z$ の素イデアル $(2)$ の上にあることを示せ。また $(2)$ の上にある $\Z[i]$ の素イデアルは $(1+i)$ だけであることを示せ。
:::

::: solution
$i$ は $x^{2}+1$ の根なので整、$\Z[i]=\Z+\Z i$ は有限生成 $\Z$ 加群（\ref{ring:integral-closure.4}）。$(1+i)$ は $\Z[i]/(1+i)$ が 2 元の体（$N(1+i)=2$、$i\equiv-1\equiv 1$）なので極大で、$(1+i)\cap\Z\ni 2$、真のイデアルなので $(1+i)\cap\Z=(2)$。$(2)$ の上にある素イデアル $\mathfrak{q}$ は $2=-i(1+i)^{2}$ を含むので $1+i\in\mathfrak{q}$、$(1+i)\subset\mathfrak{q}$ で、$(1+i)$ は極大なので等しい。
:::

::: problem {#ring:prob-integral-closure-polynomial}
$A\subset B$ で $A$ が $B$ の中で整閉なら、$A[x]$ は $B[x]$ の中で整閉である（\ref{ring:polynomial-integrally-closed}）。$A=\Z$, $B=\Q$ の場合に、$f\in\Q[x]$ が $\Z[x]$ 上整なら $f\in\Z[x]$ であることを、ガウスの補題を使って示せ。
:::

::: solution
$f^{n}+g_{1}f^{n-1}+\dots+g_{n}=0$（$g_{i}\in\Z[x]$）とする。$y$ を新しい変数とし、$F(y)\defeq y^{n}+g_{1}y^{n-1}+\dots+g_{n}\in\Z[x][y]$ は $y-f$ を因子にもつ：$\Q[x][y]$ で $F=(y-f)G$。$\Z[x]$ は UFD で商体は $\Q(x)$。$F$ は $y$ についてモニックなので $\Z[x]$ 上の原始多項式で、$\Q(x)[y]$ での分解 $F=(y-f)G$ から、ガウスの補題の帰結（\ref{ring:gauss-irreducible.1}）により $a\in\Q(x)^{\times}$ で $a(y-f),a^{-1}G\in\Z[x][y]$。$a(y-f)$ の $y$ の係数 $a\in\Z[x]$、$a^{-1}G$ の最高次係数 $a^{-1}\in\Z[x]$ なので $a$ は $\Z[x]$ の単元 $\pm1$。よって $y-f\in\Z[x][y]$、すなわち $f\in\Z[x]$。
:::
