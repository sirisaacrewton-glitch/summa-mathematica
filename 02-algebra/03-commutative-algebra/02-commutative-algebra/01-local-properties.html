# 分数加群と局所的性質 {#ring:page-local-properties keywords="module of fractions, localization of modules, exactness of localization, local property, support of a module, Nakayama's lemma, determinant trick, finitely generated projective modules over local rings are free"}

環の局所化（\ref{ring:page-localization}）を加群に広げたものが**分数加群** $S^{-1}M$ である（\ref{ring:module-localization}）。局所化は完全列を完全列に移し（\ref{ring:localization-exact}）、そのため「$M=0$」「準同型が単射・全射」「平坦」といった性質は、各素イデアル（あるいは各極大イデアル）での局所化で確かめれば足りる（\ref{ring:local-properties}）。このように局所化で判定できる性質を**局所的性質**といい、可換環論の多くの議論は「局所化して局所環の問題に帰着する」という形をとる。局所環で最も強力な道具が**中山の補題**（\tref{ring:nakayama}）で、その応用として局所環上の有限生成射影加群が自由であることを示す（\ref{ring:local-projective-free}）。

> Atiyah–Macdonald 第 2・3 章と松村『可換環論』§4 の流れを参考にした。中山の補題は行列式のトリック（\ref{ring:determinant-trick}）から導いた。

## 記法と定義の確認 {#ring:sec-lp-notation}

::: notation
- 環は可換、加群は $A$ 加群。環の局所化・普遍性・素イデアルの対応・$A_{\mathfrak{p}}$ は \ref{ring:localization}, \ref{ring:localization-universal}, \ref{ring:localization-primes}, \ref{ring:localization-at-prime}。テンソル積の計算は \tref{mod:page-tensor-products}、平坦性は \ref{ha:flat}, \ref{mod:page-flatness}。ジャコブソン根基は \ref{ring:jacobson-radical}。
- イデアル $I$ について $V(I)\defeq\{\mathfrak{p}\in\Spec A : \mathfrak{p}\supset I\}$。素イデアル $\mathfrak{p}$ での局所化 $(A\setminus\mathfrak{p})^{-1}M$ を $M_{\mathfrak{p}}$ と書く。
- **選択公理**：極大イデアルの存在（\ref{ring:maximal-ideal-existence}）を、「極大イデアルでの局所化で判定できる」という主張で使う。素イデアル全体で判定する形なら使わない箇所もある（各 hypcheck に書く）。
:::

## 分数加群 {#ring:sec-lp-modules}

::: theorem 分数加群 {#ring:module-localization keywords="module of fractions S^{-1}M, localization of a module" index="分数加群|ぶんすうかぐん, 加群の局所化|かぐんのきょくしょか"}
$S$ を $A$ の積閉集合、$M$ を $A$ 加群とする。
1. $M\times S$ 上の関係「$(m,s)\sim(n,t)\iff$ ある $u\in S$ で $u(tm-sn)=0$」は同値関係で、類 $m/s$ の全体 $S^{-1}M$ は
$$
\frac{m}{s}+\frac{n}{t}\defeq\frac{tm+sn}{st},\qquad\frac{a}{t}\cdot\frac{m}{s}\defeq\frac{am}{ts}
$$
で $S^{-1}A$ 加群になる。$m\mapsto m/1$ は $A$ 線形で、核は $\{m : \text{ある }u\in S\text{ で }um=0\}$。
2. $A$ 線形写像 $f:M\to N$ は $S^{-1}A$ 線形写像 $S^{-1}f:S^{-1}M\to S^{-1}N$, $m/s\mapsto f(m)/s$ を誘導し、$S^{-1}(g\circ f)=S^{-1}g\circ S^{-1}f$。
3. $S^{-1}A\otimes_{A}M\cong S^{-1}M$（$\frac{a}{s}\otimes m\mapsto\frac{am}{s}$）で、この同型は $M$ について自然である。
:::

::: proof
**Step 1（1）.** 同値関係であること、演算が矛盾なく定まり加群の公理をみたすことは、環の場合（\ref{ring:localization} の Step 1〜3）と同じ計算で、$a,b$ の役割の一方を $M$ の元に替えればよい（推移律の $w=uvt$ もそのまま）。核の記述も同様。

**Step 2（2）.** $(m,s)\sim(n,t)$ なら $u(tf(m)-sf(n))=f(u(tm-sn))=0$ なので矛盾なく定まり、線形性と合成の式は明らか。

**Step 3（3：写像）.** $(\frac{a}{s},m)\mapsto\frac{am}{s}$ は $A$ 双線形（矛盾なく定まるのは $\frac{a}{s}=\frac{b}{t}$ なら $u(ta-sb)=0$ で $u(t\cdot am-s\cdot bm)=0$ だから）なので、$\phi:S^{-1}A\otimes_{A}M\to S^{-1}M$ を得る（\ref{mod:tensor-module-structure}）。全射は $\phi(\frac{1}{s}\otimes m)=\frac{m}{s}$ から。

**Step 4（3：単射）.** $S^{-1}A\otimes M$ の元は $\sum_{k}\frac{a_{k}}{s_{k}}\otimes m_{k}$ と書けるが、$s=\prod s_{k}$, $t_{k}=s/s_{k}$ とおくと $\frac{a_{k}}{s_{k}}\otimes m_{k}=\frac{1}{s}\otimes a_{k}t_{k}m_{k}$ なので、すべての元は $\frac{1}{s}\otimes m$ の形である。$\phi(\frac{1}{s}\otimes m)=\frac{m}{s}=0$ なら $um=0$ となる $u\in S$ があり、$\frac{1}{s}\otimes m=\frac{u}{us}\otimes m=\frac{1}{us}\otimes um=0$。自然性は定義から。
:::

::: theorem 局所化の完全性 {#ring:localization-exact keywords="localization is exact, S^{-1}A is flat" index="局所化の完全性|きょくしょかのかんぜんせい"}
$M'\xrightarrow{f}M\xrightarrow{g}M''$ が $M$ で完全なら、$S^{-1}M'\to S^{-1}M\to S^{-1}M''$ も完全である。したがって $S^{-1}A$ は平坦な $A$ 加群である。
:::

::: proof
**Step 1.** $gf=0$ なので $S^{-1}g\circ S^{-1}f=S^{-1}(gf)=0$。

**Step 2.** $\frac{m}{s}\in\Ker S^{-1}g$ とすると $\frac{g(m)}{s}=0$ なので、ある $u\in S$ で $ug(m)=g(um)=0$。完全性から $um=f(m')$ となる $m'$ があり、$\frac{m}{s}=\frac{um}{us}=S^{-1}f(\frac{m'}{us})$。

**Step 3（平坦性）.** \ref{ring:module-localization.3} から $S^{-1}A\otimes_{A}-\cong S^{-1}(-)$ で、これは単射を単射に移す（Step 1・2 を $0\to M'\to M$ に使う）。
:::

::: proposition 局所化と加群の演算 {#ring:localization-operations keywords="localization commutes with sums, intersections, quotients, tensor products" index="局所化と演算|きょくしょかとえんざん"}
$N,P\subset M$ を部分加群とする。
1. $S^{-1}(N+P)=S^{-1}N+S^{-1}P$、$S^{-1}(N\cap P)=S^{-1}N\cap S^{-1}P$（$S^{-1}N$ などは $S^{-1}M$ の部分加群とみなす）、$S^{-1}(M/N)\cong S^{-1}M/S^{-1}N$。
2. $S^{-1}(M\otimes_{A}N)\cong S^{-1}M\otimes_{S^{-1}A}S^{-1}N$（$\frac{m}{s}\otimes\frac{n}{t}\mapsto\frac{m\otimes n}{st}$）。
:::

::: proof
**Step 1（1）.** 和は定義から。完全性（\ref{ring:localization-exact}）から、単射 $N\to M$ は単射 $S^{-1}N\to S^{-1}M$ に、短完全列 $0\to N\to M\to M/N\to 0$ は短完全列に移るので剰余の式を得る。共通部分は完全列 $0\to N\cap P\to M\to M/N\oplus M/P$ を局所化して、$S^{-1}(M/N\oplus M/P)\cong S^{-1}M/S^{-1}N\oplus S^{-1}M/S^{-1}P$（直和との交換は定義から）の核をとる。

**Step 2（2）.** $B=S^{-1}A$ とおく。スカラーの拡大とテンソル積の結合・交換（\ref{mod:tensor-isomorphisms}）から
$$
\begin{aligned}
(B\otimes_{A}M)\otimes_{B}(B\otimes_{A}N)&\cong M\otimes_{A}(B\otimes_{B}(B\otimes_{A}N))\\
&\cong M\otimes_{A}(B\otimes_{A}N)\cong B\otimes_{A}(M\otimes_{A}N).
\end{aligned}
$$
（1 行目は $(B\otimes_{A}M)\otimes_{B}X\cong M\otimes_{A}X$（$X$ は $B$ 加群）で、これは両辺が「$A$ 双線形で第 2 変数について $B$ 線形な写像」について普遍的であることから従う。）\ref{ring:module-localization.3} で書き換えれば主張を得る。
:::

## 局所的性質 {#ring:sec-lp-local}

::: theorem 局所的性質 {#ring:local-properties keywords="local properties: M = 0, injectivity, surjectivity, flatness can be checked locally" index="局所的性質|きょくしょてきせいしつ"}
$A$ 加群 $M$ と $A$ 線形写像 $f:M\to N$ について、次の各組の条件は同値である（$\mathfrak{p}$ は素イデアル全体、$\mathfrak{m}$ は極大イデアル全体を動く）。
1. （AC）$M=0$ $\iff$ すべての $\mathfrak{p}$ で $M_{\mathfrak{p}}=0$ $\iff$ すべての $\mathfrak{m}$ で $M_{\mathfrak{m}}=0$。
2. （AC）$f$ が単射 $\iff$ すべての $\mathfrak{p}$ で $f_{\mathfrak{p}}$ が単射 $\iff$ すべての $\mathfrak{m}$ で $f_{\mathfrak{m}}$ が単射。全射についても同様。
3. （AC）$M$ が平坦 $\iff$ すべての $\mathfrak{p}$ で $M_{\mathfrak{p}}$ が平坦な $A_{\mathfrak{p}}$ 加群 $\iff$ すべての $\mathfrak{m}$ で $M_{\mathfrak{m}}$ が平坦な $A_{\mathfrak{m}}$ 加群。
:::

::: proof
**Step 1（1）.** 左から右へは明らか（$M=0$ なら局所化も $0$。極大イデアルは素イデアル）。最後の条件から $M=0$ を示す。$0\neq x\in M$ とすると $\operatorname{Ann}(x)\neq A$（$1\cdot x\neq 0$）なので、それを含む極大イデアル $\mathfrak{m}$ がある（\ref{ring:maximal-ideal-existence}）。$x/1=0$ in $M_{\mathfrak{m}}$ なら $ux=0$ となる $u\notin\mathfrak{m}$ があるが、$u\in\operatorname{Ann}(x)\subset\mathfrak{m}$ で矛盾。よって $M_{\mathfrak{m}}\neq 0$。

**Step 2（2）.** 完全性から $(\Ker f)_{\mathfrak{p}}=\Ker(f_{\mathfrak{p}})$、$(\operatorname{Coker}f)_{\mathfrak{p}}=\operatorname{Coker}(f_{\mathfrak{p}})$（完全列 $0\to\Ker f\to M\to N\to\operatorname{Coker}f\to 0$ を局所化）。1 を $\Ker f$, $\operatorname{Coker}f$ に使う。

**Step 3（3、⇒）.** $A_{\mathfrak{p}}$ 加群の単射 $N'\to N$ について、$M_{\mathfrak{p}}\otimes_{A_{\mathfrak{p}}}N\cong(A_{\mathfrak{p}}\otimes_{A}M)\otimes_{A_{\mathfrak{p}}}N\cong M\otimes_{A}N$（\ref{ring:localization-operations} の Step 2 と同じ同型）なので、$M$ の平坦性から単射。

**Step 4（3、最後の条件 ⇒ 平坦）.** $A$ 加群の単射 $g:N'\to N$ について、$1\otimes g:M\otimes N'\to M\otimes N$ の局所化は、\ref{ring:localization-operations.2} から $M_{\mathfrak{m}}\otimes_{A_{\mathfrak{m}}}N'_{\mathfrak{m}}\to M_{\mathfrak{m}}\otimes_{A_{\mathfrak{m}}}N_{\mathfrak{m}}$ と同一視され、$g_{\mathfrak{m}}$ は単射（完全性）で $M_{\mathfrak{m}}$ は平坦なので単射。2 から $1\otimes g$ は単射。

::: hypcheck
- **選択公理**：Step 1 の極大イデアルの存在に使った。「すべての素イデアル」の形の同値なら、$\operatorname{Ann}(x)$ を含む素イデアルの存在が必要で、やはり選択公理（の弱い形）を使う。
- **局所的でない性質**：「自由である」は局所的性質でない。デデキント整域の非単項イデアル（例えば $\Z[\sqrt{-5}]$ の $(2,1+\sqrt{-5})$）は各極大イデアルで局所化すると自由（単項）だが、自由加群ではない（\ref{ring:page-dedekind}）。
:::
:::

::: definition 台 {#ring:support keywords="support of a module, Supp M" index="台|だい, サポート|さぽーと"}
$A$ 加群 $M$ について、$\operatorname{Supp}M\defeq\{\mathfrak{p}\in\Spec A : M_{\mathfrak{p}}\neq 0\}$ を $M$ の**台**という。
:::

::: proposition 台の性質 {#ring:support-properties keywords="support of a finitely generated module is V(Ann M), support and exact sequences" index="台の性質|だいのせいしつ"}
1. $\operatorname{Supp}M\subset V(\operatorname{Ann}M)$ で、$M$ が有限生成なら等号が成り立つ。特に $\operatorname{Supp}(A/I)=V(I)$。
2. 短完全列 $0\to M'\to M\to M''\to 0$ について $\operatorname{Supp}M=\operatorname{Supp}M'\cup\operatorname{Supp}M''$。
:::

::: proof
**Step 1（1：包含）.** $\mathfrak{p}\not\supset\operatorname{Ann}M$ なら、$a\in\operatorname{Ann}M\setminus\mathfrak{p}$ をとると、$a/1$ は $A_{\mathfrak{p}}$ の単元で $M_{\mathfrak{p}}$ を零化するので $M_{\mathfrak{p}}=0$。

**Step 2（1：等号）.** $M=Am_{1}+\dots+Am_{n}$ で $M_{\mathfrak{p}}=0$ とする。各 $i$ で $m_{i}/1=0$ なので $u_{i}m_{i}=0$ となる $u_{i}\notin\mathfrak{p}$ がある。$u=u_{1}\cdots u_{n}\notin\mathfrak{p}$（素イデアル）は $M$ を零化するので $\operatorname{Ann}M\not\subset\mathfrak{p}$。$A/I$ は $1$ で生成され $\operatorname{Ann}(A/I)=I$。

**Step 3（2）.** 局所化は完全なので $0\to M'_{\mathfrak{p}}\to M_{\mathfrak{p}}\to M''_{\mathfrak{p}}\to 0$ は完全で、$M_{\mathfrak{p}}=0\iff M'_{\mathfrak{p}}=M''_{\mathfrak{p}}=0$。

::: hypcheck
- **前提「有限生成」（1 の等号）**：Step 2 で有限個の $u_{i}$ の積をとるのに使った。外すと偽：$\Z$ 加群 $M=\bigoplus_{p}\Z/p\Z$（全素数の直和）は $\operatorname{Ann}M=0$ なので $V(\operatorname{Ann}M)=\Spec\Z$ だが、$M_{(0)}=\Q\otimes M=0$ なので $(0)\notin\operatorname{Supp}M$。
:::
:::

## 中山の補題 {#ring:sec-lp-nakayama}

::: theorem 行列式のトリック {#ring:determinant-trick keywords="determinant trick, Cayley-Hamilton for modules" index="行列式のトリック|ぎょうれつしきのとりっく, ケイリー＝ハミルトン|けいりーはみるとん"}
$M$ を $n$ 個の元で生成される $A$ 加群、$I$ をイデアル、$\varphi:M\to M$ を $\varphi(M)\subset IM$ をみたす $A$ 線形写像とする。$a_{k}\in I^{k}$ で
$$
\varphi^{n}+a_{1}\varphi^{n-1}+\dots+a_{n-1}\varphi+a_{n}=0\quad(\End_{A}(M)\text{ の中で})
$$
となるものがある。
:::

::: proof
**Step 1.** $M=Am_{1}+\dots+Am_{n}$ とし、$\varphi(m_{i})=\sum_{j}a_{ij}m_{j}$（$a_{ij}\in I$）と書く。$\End_{A}(M)$ の中で $\varphi$ と $A$ の元（の掛け算）が生成する部分環 $A[\varphi]$ は可換環である。$A[\varphi]$ 係数の行列 $\Delta\defeq(\delta_{ij}\varphi-a_{ij})_{i,j}$ を考えると、$\sum_{j}\Delta_{ij}m_{j}=\varphi(m_{i})-\sum_{j}a_{ij}m_{j}=0$（各 $i$）。

**Step 2.** 可換環上の行列について、余因子行列 $\operatorname{adj}\Delta$ は $(\operatorname{adj}\Delta)\Delta=(\det\Delta)E$ をみたす（線形代数と同じ式。成分の多項式としての恒等式）。左から掛けると、各 $k$ で $(\det\Delta)m_{k}=\sum_{i}(\operatorname{adj}\Delta)_{ki}\sum_{j}\Delta_{ij}m_{j}=0$。よって $\det\Delta$ は $M$ の生成元を $0$ に送るので、$\End(M)$ の元として $0$。

**Step 3.** $\det\Delta$ を展開すると、$\varphi$ についてモニックな $n$ 次式で、$\varphi^{n-k}$ の係数は $a_{ij}$ の $k$ 次の斉次式（$k$ 個の積の和）なので $I^{k}$ に属する。
:::

::: theorem 中山の補題 {#ring:nakayama keywords="Nakayama's lemma" index="中山の補題|なかやまのほだい" refname="中山の補題"}
$M$ を有限生成 $A$ 加群、$I$ をイデアルとする。
1. $IM=M$ なら、$1+a$ が $M$ を零化する $a\in I$ がある。
2. $I\subset\mathrm{rad}(A)$（ジャコブソン根基）で $IM=M$ なら $M=0$。
3. $I\subset\mathrm{rad}(A)$、$N\subset M$ が部分加群で $M=N+IM$ なら $M=N$。
:::

::: proof
**Step 1（1）.** \ref{ring:determinant-trick} を $\varphi=\id_{M}$ に使うと（$\id(M)=M=IM$）、$1+a_{1}+\dots+a_{n}=0$ が $\End(M)$ で成り立つ。$a\defeq a_{1}+\dots+a_{n}\in I$。

**Step 2（2）.** 1 の $a\in I\subset\mathrm{rad}(A)$ について、$1+a=1-a\cdot(-1)$ は単元（\ref{ring:jacobson-radical.1}）。$(1+a)M=0$ なので $M=0$。

**Step 3（3）.** $M/N$ は有限生成で、$I(M/N)=(IM+N)/N=M/N$。2 から $M/N=0$。

::: hypcheck
- **前提「有限生成」**：\ref{ring:determinant-trick} で使った。外すと偽：$A=\Z_{(p)}$（局所環、$\mathrm{rad}=p\Z_{(p)}$）、$M=\Q$ では $pM=M$ だが $M\neq 0$。
- **選択公理**：Step 2 で、$\mathrm{rad}(A)$ の元 $x$ について $1-xy$ が単元であること（\ref{ring:jacobson-radical.1}）を使い、その証明は極大イデアルの存在を通して選択公理を使う。局所環 $(A,\mathfrak{m})$ で $\mathfrak{m}=A\setminus A^{\times}$ がわかっている場合（例えば \ref{ring:local-ring-criterion.1}・\ref[3]{ring:local-ring-criterion.3} で局所環であることを示した場合）は、$1+a\notin\mathfrak{m}$ から直接単元とわかり、選択公理は要らない。
:::
:::

::: corollary 局所環上の生成系 {#ring:nakayama-generators keywords="minimal generators of a module over a local ring, lifting generators" index="極小生成系|きょくしょうせいせいけい"}
$(A,\mathfrak{m},k)$ を局所環（$k=A/\mathfrak{m}$）、$M$ を有限生成 $A$ 加群とする。$m_{1},\dots,m_{n}\in M$ の $M/\mathfrak{m}M$ での像が $k$ 上 $M/\mathfrak{m}M$ を張るなら、$m_{1},\dots,m_{n}$ は $M$ を生成する。特に $M$ の生成系の元の個数の最小値は $\dim_{k}M/\mathfrak{m}M$ である。
:::

::: proof
$N\defeq Am_{1}+\dots+Am_{n}$ とすると、仮定から $M=N+\mathfrak{m}M$。$\mathfrak{m}=\mathrm{rad}(A)$（\ref{ring:jacobson-radical.3}）なので中山の補題の 3 から $M=N$。後半：生成系の像は $M/\mathfrak{m}M$ を張るので個数 $\ge\dim_{k}M/\mathfrak{m}M$。逆に $M/\mathfrak{m}M$ の基底を持ち上げれば前半から生成系。
:::

::: remark 行列式のトリックの一般性
\ref{ring:determinant-trick} の $\varphi$ は $\varphi(M)\subset IM$ をみたす**任意の**自己準同型でよく、中山の補題はその特別な場合 $\varphi=\id_{M}$ にすぎない。他の使い方：
- $I=A$ とすると条件は空になり、有限生成加群の任意の自己準同型 $\varphi$ はモニック多項式の根になる（**ケイリー＝ハミルトンの定理**の加群版。$M=A^{n}$ で $\varphi$ が行列 $T$ で与えられるとき、Step 1 の $\Delta$ は $xE-T^{\mathsf{T}}$ の $x$ に $\varphi$ を代入したもので、得られる多項式は $T$ の固有多項式）。
- $M$ が $A$ 上の環 $B$（の部分加群）で、$\varphi$ が $b\in B$ の掛け算なら、整であることの特徴付け（\ref{ring:integral-criterion}）の証明そのものである。
- 次のヴァスコンセロスの定理のように、$M$ を $A[x]$ 加群とみて $I=(x)$ に使うこともできる。
:::

::: theorem ヴァスコンセロスの定理 {#ring:vasconcelos keywords="Vasconcelos theorem, surjective endomorphism of a finitely generated module is an isomorphism" index="ヴァスコンセロスの定理|ゔぁすこんせろすのていり" refname="ヴァスコンセロスの定理"}
$M$ を有限生成 $A$ 加群、$\varphi:M\to M$ を全射な $A$ 線形写像とする。このとき $\varphi$ は同型で、逆写像 $\varphi^{-1}$ は $\varphi$ の $A$ 係数の多項式である。
:::

::: proof
**Step 1（$A[x]$ 加群とみる）.** $\End_{A}(M)$ の中で $A$ の元の掛け算と $\varphi$ は可換なので、\ref{ring:polynomial-universal} により環準同型 $A[x]\to\End_{A}(M)$, $x\mapsto\varphi$ がある（像は可換な部分環 $A[\varphi]$ に入る）。これで $M$ を $f(x)\cdot m\defeq f(\varphi)(m)$ により $A[x]$ 加群とみる。$A$ 上の生成系はそのまま $A[x]$ 上の生成系なので、$M$ は $A[x]$ 上有限生成。

**Step 2（$xM=M$）.** $I\defeq xA[x]$ とおく。$IM$ は $x\cdot m'=\varphi(m')$ を含むので、$\varphi$ が全射であることから $IM\supset\varphi(M)=M$、すなわち $IM=M$。

**Step 3（中山の補題）.** \tref{ring:nakayama.1} を $A[x]$ 加群 $M$ とイデアル $I$ に使うと、$(1+xg(x))M=0$ となる $g\in A[x]$ がある。$\End_{A}(M)$ の中で書き直すと $\id_{M}+\varphi\circ g(\varphi)=0$。$\psi\defeq-g(\varphi)$ とおくと $\varphi\circ\psi=\id_{M}$ で、$\varphi$ と $g(\varphi)$ は可換なので $\psi\circ\varphi=\id_{M}$ も成り立つ。よって $\varphi$ は可逆で $\varphi^{-1}=-g(\varphi)$。

::: hypcheck
- **前提「有限生成」**：Step 3 で中山の補題（その中の行列式のトリック）に使った。外すと偽：体 $k$ 上の $M=k^{(\N)}$（基底 $e_{0},e_{1},\dots$）で $e_{0}\mapsto 0$, $e_{n}\mapsto e_{n-1}$（$n\ge1$）は全射だが単射でない。
- **「全射」を「単射」に替えると偽**：$\Z\to\Z$, $m\mapsto 2m$ は単射だが全射でない（有限生成でも）。ただし $M$ が長さ有限（例えばアルティン環上の有限生成加群）なら、単射な自己準同型も同型である（像は $M$ と同じ長さの部分加群なので $M$ に等しい。長さは \ref{ring:page-dimension-theory}）。
- **前提「可換環」**：Step 1 で $A$ の掛け算と $\varphi$ が可換であることに使った。非可換環では偽：\ref{mod:rank-invariance} の hypcheck の $R=\End_{K}(V)$ では、左 $R$ 加群の同型 $R\cong R^{2}$ と第 1 成分への射影の合成 $R\to R^{2}\to R$ は、$1$ で生成される $R$ の全射な自己準同型だが、核は $0\oplus R\neq 0$ に対応する部分で、単射でない。
- **選択公理**：使わない（中山の補題の 1 は行列式のトリックだけで示した）。
:::
:::

::: corollary 自由加群の生成系と階数 {#ring:free-generators-basis keywords="n generators of A^n form a basis, invariant basis number via Vasconcelos" index="自由加群の基底|じゆうかぐんのきてい"}
$A$ を可換環とする。
1. $A^{n}$ を生成する $n$ 個の元は $A^{n}$ の基底である。
2. 有限生成 $A$ 加群 $M$ と加群 $N$ について $M\cong M\oplus N$ なら $N=0$。
3. $A$ が零環でなく、$A^{m}\cong A^{n}$（$m,n$ は自然数）なら $m=n$。
:::

::: proof
**Step 1（1）.** $v_{1},\dots,v_{n}$ が $A^{n}$ を生成するとし、$\varphi:A^{n}\to A^{n}$, $e_{i}\mapsto v_{i}$ とおく。$\varphi$ は全射なので \ref{ring:vasconcelos} から単射。単射性は「$\sum a_{i}v_{i}=0\Rightarrow$ すべての $a_{i}=0$」（一次独立）を意味する。

**Step 2（2）.** 同型 $\theta:M\to M\oplus N$ と射影 $\pi:M\oplus N\to M$ の合成 $\pi\circ\theta$ は $M$ の全射な自己準同型なので、\ref{ring:vasconcelos} から単射。$y\in N$ について $\theta^{-1}(0,y)$ は $\pi\circ\theta$ で $0$ に移るので $\theta^{-1}(0,y)=0$、よって $y=0$。

**Step 3（3）.** $m>n$ と仮定する。$A^{m}\cong A^{n}\oplus A^{m-n}$ なので、2 を $M=A^{n}$（有限生成）と $N=A^{m-n}$ に使うと $A^{m-n}=0$。$A\neq 0$ かつ $m-n\ge1$ なのでこれは矛盾。対称に $m<n$ もない。

::: hypcheck
- **前提「零環でない」**：Step 3 の最後に使った。零環では $A^{m}=0$ がすべての $m$ で成り立つ。
- **選択公理**：使わない。\ref{mod:rank-invariance} の証明（極大イデアルをとる）と違い、有限階数ではこの証明は選択公理なしで通る。無限階数の場合は \ref{mod:rank-invariance} による。
:::
:::

::: theorem 局所環上の有限生成射影加群は自由 {#ring:local-projective-free keywords="finitely generated projective modules over a local ring are free" index="局所環上の射影加群|きょくしょかんじょうのしゃえいかぐん"}
局所環 $(A,\mathfrak{m},k)$ 上の有限生成射影加群は自由である。
:::

::: proof
**Step 1.** $P$ を有限生成射影加群、$n=\dim_{k}P/\mathfrak{m}P$ とする。\ref{ring:nakayama-generators} から $n$ 個の生成元 $p_{1},\dots,p_{n}$ があり、全射 $f:A^{n}\to P$, $e_{i}\mapsto p_{i}$ を得る。$K\defeq\Ker f$。

**Step 2.** $P$ は射影的なので $0\to K\to A^{n}\to P\to 0$ は分裂し（\ref{mod:projective-characterization}）、$A^{n}\cong K\oplus P$。特に $K$ は $A^{n}$ の直和因子として有限生成（射影の像）。

**Step 3.** $k\otimes_{A}-$ は直和を保つので $k^{n}\cong K/\mathfrak{m}K\oplus P/\mathfrak{m}P$（\ref{mod:tensor-quotient}）。\term[次元]{lin:dimension}を比べると $n=\dim K/\mathfrak{m}K+n$ なので $K/\mathfrak{m}K=0$、すなわち $K=\mathfrak{m}K$。中山の補題（2）から $K=0$ で、$P\cong A^{n}$。
:::

::: supplement
**局所的に自由.** 一般の可換環 $A$ 上の有限生成射影加群 $P$ は、\ref{ring:local-projective-free} から各素イデアルで局所化すると自由（**局所自由**）である。逆に、有限表示で局所自由な加群は射影的である。$\mathfrak{p}\mapsto\operatorname{rank}P_{\mathfrak{p}}$ は $\Spec A$ 上の局所定数関数で、幾何的には $P$ は $\Spec A$ 上のベクトル束に対応する（セール＝スワンの対応の代数版）。

**ネーター局所環上の平坦加群.** ネーター局所環上の有限生成平坦加群は自由である（Tor を使って中山の補題に帰着する。\ref{ha:page-tensor-tor}）。これは \ref{mod:flat-z} の hypcheck で使った事実である。
:::

## 問題 {#ring:sec-lp-problems}

::: problem {#ring:prob-localization-z-module}
$\Z$ 加群 $M=\Z/12\Z$ について、各素イデアル $\mathfrak{p}$ での局所化 $M_{\mathfrak{p}}$ を求め、$\operatorname{Supp}M$ を決定せよ。
:::

::: solution
$\Z/12\Z\cong\Z/4\Z\oplus\Z/3\Z$（\ref{ring:crt-integers}）。$\mathfrak{p}=(p)$ で、$p\neq 2$ なら $4$ は $\Z_{(p)}$ で単元なので $(\Z/4\Z)_{(p)}=0$、$p=2$ なら $3$ が単元で $(\Z/3\Z)_{(2)}=0$、$(\Z/4\Z)_{(2)}\cong\Z_{(2)}/4\Z_{(2)}\cong\Z/4\Z$。同様に $M_{(3)}\cong\Z/3\Z$、他の $p$ と $(0)$ では $0$。よって $\operatorname{Supp}M=\{(2),(3)\}=V(12\Z)$（\ref{ring:support-properties.1}）。
:::

::: problem {#ring:prob-nakayama-local-endomorphism}
$M$ を有限生成 $A$ 加群、$\varphi:M\to M$ を $A$ 線形写像とし、ある $n\ge1$ で $\varphi^{n}$ が全射とする。$\varphi$ は同型であることを示せ。また、$M=\Z/6\Z$、$\varphi(m)=5m$ のとき、\ref{ring:vasconcelos} の証明の多項式 $g$ を一つ求め、$\varphi^{-1}=-g(\varphi)$ を確かめよ。
:::

::: solution
**前半.** $\varphi^{n}=\varphi\circ\varphi^{n-1}$ が全射なので $\varphi$ は全射。\ref{ring:vasconcelos} から $\varphi$ は同型。

**後半.** $\varphi^{2}(m)=25m=m$（$24m=0$）なので $\varphi^{2}=\id$。$g(x)=-x$ とおくと $1+xg(x)=1-x^{2}$ は $M$ を零化する（$m-\varphi^{2}(m)=0$）。$-g(\varphi)=\varphi$ で、実際 $\varphi\circ\varphi=\id$ なので $\varphi^{-1}=\varphi$。
:::
