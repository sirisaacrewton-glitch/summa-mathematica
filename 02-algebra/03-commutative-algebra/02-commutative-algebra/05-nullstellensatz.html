# ヒルベルトの零点定理 {#ring:page-nullstellensatz keywords="Hilbert's Nullstellensatz, Noether normalization, Zariski's lemma, weak Nullstellensatz, strong Nullstellensatz, Rabinowitsch trick, Jacobson ring, algebraically independent"}

代数閉体 $k$ 上の多項式の連立方程式 $f_{1}=\dots=f_{m}=0$ が解をもたないのは、$1$ が $f_{i}$ の一次結合で書けるときに限る。これが**弱形の零点定理**（\tref{ring:weak-nullstellensatz}）で、「多項式 $f$ が方程式系のすべての解で $0$ になるなら、$f$ のある冪が $f_{i}$ の一次結合になる」という**強形**（\ref{ring:nullstellensatz}）に精密化される。零点定理は、代数幾何で「図形（代数的集合）」と「根基イデアル」を一対一に対応させる基本定理である。このページでは、体上の有限生成代数が多項式環上の有限な代数であるという**ネーターの正規化定理**（\tref{ring:noether-normalization}）から、体の有限生成代数が体なら有限次拡大であるという**ザリスキの補題**（\tref{ring:zariski-lemma}）を導き、零点定理と、有限生成代数でジャコブソン根基と冪零根基が一致すること（\ref{ring:fg-algebra-jacobson}）を証明する。

> Atiyah–Macdonald 第 5・7 章と松村『可換環論』§5 の流れを参考にした。正規化定理は、有限体の場合も含めて通る「指数をずらす」変数変換で証明した。

## 記法と定義の確認 {#ring:sec-ns-notation}

::: notation
- 環は可換、$k$ は体。有限生成代数と多変数の多項式環の普遍性は \ref{ring:multivariate-polynomial}, \ref{ring:multivariate-universal}、整拡大は \ref{ring:integral-def}、有限な拡大が整であることと整であることの推移は \ref{ring:integral-closure}、整拡大と体は \ref{ring:integral-field}、多項式環のネーター性は \ref{ring:hilbert-basis}、ラビノヴィッチの技法で使う局所化は \ref{ring:localization}。
- $k$ 代数 $A$ の元 $y_{1},\dots,y_{d}$ が $k$ 上**代数的に独立**であるとは、代入 $k[t_{1},\dots,t_{d}]\to A$, $t_{i}\mapsto y_{i}$ が単射であること（$A$ の中で $k[y_{1},\dots,y_{d}]$ が多項式環と同型）。
- 体 $k$ が**代数閉体**であるとは、$k[t]$ の定数でない多項式がすべて $k$ に根をもつこと。このとき、因数定理（\ref{ring:factor-theorem}）を繰り返し使えば、モニックな多項式は一次式の積に分解する。
- $k$ 代数 $A$ が $k$ ベクトル空間として有限次元なとき、$k$ 上**有限**という（\ref{ring:integral-def} の有限と同じ）。
- **選択公理**：弱形の零点定理と強形の零点定理では、ネーター環の極大イデアルの存在に従属選択公理を使う。ジャコブソン環の部分では極大イデアルの存在と冪零根基の特徴付けを使う。
:::

## ネーターの正規化定理 {#ring:sec-ns-normalization}

::: theorem ネーターの正規化定理 {#ring:noether-normalization keywords="Noether normalization lemma" index="ネーターの正規化定理|ねーたーのせいきかていり, 正規化定理|せいきかていり, 代数的に独立|だいすうてきにどくりつ" refname="ネーターの正規化定理"}
体 $k$ 上の有限生成代数 $A\neq 0$ に対し、$k$ 上代数的に独立な元 $y_{1},\dots,y_{d}\in A$（$d\ge 0$）で、$A$ が $k[y_{1},\dots,y_{d}]$ 上有限（したがって整）になるものがある。
:::

::: intuition
幾何的には、代数多様体は「$d$ 次元のアフィン空間の上に、有限個ずつ点が乗った」形に射影できる、ということである。$d$ は多様体の\term[次元]{ag:dimension}になる（\see{ring:page-dimension-theory}）。
:::

::: proof
$A=k[x_{1},\dots,x_{n}]$（生成元 $x_{i}$）とし、$n$ についての帰納法で示す。$n=0$ なら $A=k$ なので $d=0$ とすればよい。$n\ge 1$ とし、$n-1$ 個の元で生成される $k$ 代数（$\neq 0$）について主張が成り立つと仮定する。$x_{1},\dots,x_{n}$ が代数的に独立なら、$y_{i}=x_{i}$, $d=n$ とすればよい。以下、代数的に独立でない場合を考える。

**Step 1（関係式と変数変換）.** 【主張：$f(x_{1},\dots,x_{n})=0$ となる $0\neq f$ と整数 $r$ をとり $z_{i}\defeq x_{i}-x_{n}^{r^{i}}$ とおくと、$F(Z,T)\defeq f(Z_{1}+T^{r},\dots,Z_{n-1}+T^{r^{n-1}},T)$ について $F(z_{1},\dots,z_{n-1},x_{n})=0$】 代数的に独立でないので、$0$ でない多項式 $f\in k[t_{1},\dots,t_{n}]$ で $f(x_{1},\dots,x_{n})=0$ となるものがある。$f$ に現れる単項式の各変数の指数より大きい整数 $r$ をとり、
$$
z_{i}\defeq x_{i}-x_{n}^{r^{i}}\quad(1\le i\le n-1)
$$
とおく。$x_{i}=z_{i}+x_{n}^{r^{i}}$ なので、多項式 $F\in k[Z_{1},\dots,Z_{n-1}][T]$ に $Z_{i}\mapsto z_{i}$, $T\mapsto x_{n}$ を代入した値は $f(x_{1},\dots,x_{n})=0$ に等しい。

**Step 2（$T$ の最高次）.** 【主張：$F$ は $T$ の多項式として、最高次係数が $k^{\times}$ の元である】 $f$ の単項式 $c_{\alpha}t^{\alpha}$（$c_{\alpha}\neq 0$）から $F$ に入る項 $c_{\alpha}(Z_{1}+T^{r})^{\alpha_{1}}\cdots(Z_{n-1}+T^{r^{n-1}})^{\alpha_{n-1}}T^{\alpha_{n}}$ は、$T$ の多項式として（係数は $k[Z_{1},\dots,Z_{n-1}]$）最高次の項 $c_{\alpha}T^{e(\alpha)}$ をもつ。ここで $e(\alpha)$ は次で定める：
$$
e(\alpha)\defeq\alpha_{n}+\alpha_{1}r+\alpha_{2}r^{2}+\dots+\alpha_{n-1}r^{n-1}.
$$
各 $\alpha_{i}<r$ なので、$e(\alpha)$ は $\alpha$ の「$r$ 進展開」であり、異なる $\alpha$ には異なる $e(\alpha)$ が対応する。ゆえに $e(\alpha)$ が最大の $\alpha$ はただ一つで、その項だけが $T^{e(\alpha)}$ に寄与するので、$F$ の最高次係数は $c_{\alpha}\in k^{\times}$ である。

**Step 3（$x_{n}$ は整）.** 【主張：$x_{n}$ は $B\defeq k[z_{1},\dots,z_{n-1}]$ 上整であり、$A$ は $B$ 上有限である】 Step 2 から $c_{\alpha}^{-1}F$ は $T$ についてモニックで、係数を $Z_{i}\mapsto z_{i}$ で $B$ に移したモニック多項式は、Step 1 から $x_{n}$ を根にもつ。ゆえに $x_{n}$ は $B$ 上整である。$x_{i}=z_{i}+x_{n}^{r^{i}}$ も $B[x_{n}]$ の元なので $A=B[x_{n}]$ であり、\ref{ring:integral-criterion.2} から $A$ は $B$ 上有限である。

**Step 4（帰納法）.** 【主張：$A$ は代数的に独立な $y_{1},\dots,y_{d}$ について $k[y_{1},\dots,y_{d}]$ 上有限である】 $B\neq 0$ は $n-1$ 個の元で生成されるので、帰納法の仮定から代数的に独立な $y_{1},\dots,y_{d}\in B$ で $B$ が $k[y_{1},\dots,y_{d}]$ 上有限なものがある。$B=\sum_{j}k[y]b_{j}$, $A=\sum_{l}Ba_{l}$ なら $A=\sum_{j,l}k[y]b_{j}a_{l}$ なので（有限の有限は有限）、$A$ も $k[y_{1},\dots,y_{d}]$ 上有限である。

::: hypcheck
- **体 $k$**：Step 2・3 で $c_{\alpha}$ が単元であることに使った。$k$ が無限体なら一次の変数変換 $z_{i}=x_{i}-a_{i}x_{n}$ で済むが、ここでの冪による変換は有限体でも通る。
- 選択公理は使わない。
:::
:::

## ザリスキの補題と弱形の零点定理 {#ring:sec-ns-zariski}

::: theorem ザリスキの補題 {#ring:zariski-lemma keywords="Zariski's lemma: a field finitely generated as a k-algebra is a finite extension of k" index="ザリスキの補題|ざりすきのほだい" refname="ザリスキの補題"}
体 $k$ 上の有限生成代数 $K$ が体なら、$K$ は $k$ 上有限（有限次の拡大体）である。
:::

::: proof
**Step 1.** 正規化定理（\tref{ring:noether-normalization}）から、代数的に独立な $y_{1},\dots,y_{d}$ で $K$ が $B\defeq k[y_{1},\dots,y_{d}]$ 上整なものがある。

**Step 2.** $B\subset K$ は整域の整拡大で $K$ は体なので、$B$ も体（\ref{ring:integral-field.1}）。$B$ は多項式環と同型なので、$d\ge 1$ なら $y_{1}$ は単元でない（多項式環の単元は定数。\ref{ring:polynomial-domain.3}）。よって $d=0$, $B=k$ であり、$K$ は $k$ 上有限である。
:::

::: corollary 弱形の零点定理 {#ring:weak-nullstellensatz keywords="weak Nullstellensatz, maximal ideals of polynomial rings over algebraically closed fields" index="弱形の零点定理|じゃくけいのれいてんていり" refname="弱形の零点定理"}
（DC）$k$ を代数閉体とする。
1. $k[x_{1},\dots,x_{n}]$ の極大イデアルは $(x_{1}-a_{1},\dots,x_{n}-a_{n})$（$a\in k^{n}$）の形のものですべてである。
2. イデアル $I\subsetneq k[x_{1},\dots,x_{n}]$ について、$I$ のすべての元が $a$ で $0$ になる点 $a\in k^{n}$ がある。すなわち、連立方程式 $f_{1}=\dots=f_{m}=0$ が $k^{n}$ に解をもたないなら $1\in(f_{1},\dots,f_{m})$。
:::

::: proof
**Step 1（剰余体は $k$）.** 【主張：極大イデアル $\mathfrak{m}$ について $k\to k[x_{1},\dots,x_{n}]/\mathfrak{m}$ は同型】 $K\defeq k[x_{1},\dots,x_{n}]/\mathfrak{m}$ は $k$ 上の有限生成代数で体なので、ザリスキの補題から $k$ 上有限である。ゆえに $\alpha\in K$ は $k$ 上整であり（\ref{ring:integral-closure.4}）、モニックな $g\in k[t]$ の根である。$k$ は代数閉体なので $g=\prod_{j}(t-c_{j})$（$c_{j}\in k$）と分解し、$\prod_{j}(\alpha-c_{j})=0$ となる。$K$ は体なので、ある $j$ で $\alpha=c_{j}\in k$ である。よって $k\to K$ は全射であり、体の準同型なので同型である。

**Step 2（1）.** 【主張：$\mathfrak{m}=(x_{1}-a_{1},\dots,x_{n}-a_{n})$ となる $a\in k^{n}$ がある】 $x_{i}$ の $K\cong k$ での像を $a_{i}$ とおくと、$x_{i}-a_{i}\in\mathfrak{m}$ である。$\mathfrak{m}_{a}\defeq(x_{1}-a_{1},\dots,x_{n}-a_{n})$ は代入 $f\mapsto f(a)$ の核である：$f$ を $x_{i}=(x_{i}-a_{i})+a_{i}$ として展開すると $f-f(a)\in\mathfrak{m}_{a}$ となるからである。代入は全射なので $k[x_{1},\dots,x_{n}]/\mathfrak{m}_{a}\cong k$ は体であり、$\mathfrak{m}_{a}$ は極大である。$\mathfrak{m}\supset\mathfrak{m}_{a}$ で $\mathfrak{m}\neq k[x_{1},\dots,x_{n}]$ なので、$\mathfrak{m}=\mathfrak{m}_{a}$ である。逆に、各 $\mathfrak{m}_{a}$ が極大であることも今示した。

**Step 3（2）.** 【主張：$I\subsetneq k[x_{1},\dots,x_{n}]$ の元はすべて、ある点 $a$ で $0$ になる】 $k[x_{1},\dots,x_{n}]$ はネーター（\ref{ring:hilbert-basis}）なので、$I$ を含む真のイデアル全体の極大元 $\mathfrak{m}$ が従属選択公理でとれ（\ref{ring:noetherian-module.2}）、これは極大イデアルである。1 から $\mathfrak{m}=\mathfrak{m}_{a}$ となる $a$ があり、$f\in I\subset\mathfrak{m}_{a}$ は代入 $x\mapsto a$ の核に属するので $f(a)=0$ である。後半は対偶：$1\notin(f_{1},\dots,f_{m})$ なら、このイデアルの元がすべて $0$ になる点 $a$ があり、$a$ は連立方程式の解である。

::: hypcheck
- **前提「代数閉体」**：Step 1 で $g$ が一次式に分解することに使った。外すと偽：$\R[x]$ の極大イデアル $(x^{2}+1)$ は $(x-a)$ の形でなく、$x^{2}+1=0$ は $\R$ に解をもたないが $1\notin(x^{2}+1)$。
:::
:::

## 強形の零点定理 {#ring:sec-ns-strong}

::: definition 代数的集合と零点イデアル {#ring:algebraic-set keywords="algebraic set, vanishing ideal, V(I), I(X)" index="代数的集合|だいすうてきしゅうごう, 零点集合|れいてんしゅうごう"}
体 $k$ と $k[x_{1},\dots,x_{n}]$ の部分集合 $S$ について $V(S)\defeq\{a\in k^{n} : \text{すべての }f\in S\text{ で }f(a)=0\}$ を**代数的集合**、$X\subset k^{n}$ について $I(X)\defeq\{f : \text{すべての }a\in X\text{ で }f(a)=0\}$ を $X$ の**零点イデアル**という。$I(X)$ は根基イデアルである（$f^{m}(a)=0\Rightarrow f(a)=0$）。
:::

::: theorem 強形の零点定理（ヒルベルト） {#ring:nullstellensatz keywords="Hilbert's Nullstellensatz, strong form, I(V(J)) = rad J, Rabinowitsch trick" index="零点定理|れいてんていり, ヒルベルトの零点定理|ひるべるとのれいてんていり, ラビノヴィッチの技法|らびのゔぃっちのぎほう" refname="強形の零点定理"}
（DC）$k$ を代数閉体、$J$ を $k[x_{1},\dots,x_{n}]$ のイデアルとすると、$I(V(J))=\sqrt{J}$。したがって $I$ と $V$ は、根基イデアル全体と代数的集合全体の間の、包含を逆にする一対一対応を与える。
:::

::: proof
**Step 1（$\supset$）.** 【主張：$\sqrt{J}\subset I(V(J))$】 $f^{m}\in J$ なら、$a\in V(J)$ について $f(a)^{m}=0$ であり、$k$ は体なので $f(a)=0$ である。

**Step 2（$\subset$：ラビノヴィッチの技法）.** 【主張：$f\in I(V(J))$, $f\neq 0$ なら、$1=\sum_{i}g_{i}(x,y)h_{i}(x)+q(x,y)(1-yf(x))$（$h_{i}\in J$）と書ける】 $f=0$ なら $f\in\sqrt{J}$ なので、$f\neq 0$ とする。新しい変数 $y$ をとり、$k[x_{1},\dots,x_{n},y]$ のイデアル $J'\defeq Jk[x,y]+(1-yf)$ を考える。点 $(a,b)\in V(J')$ があれば、$J$ の元は $y$ を含まないので $a\in V(J)$ であり、$f(a)=0$ から $1-bf(a)=1\neq 0$ となって矛盾する。ゆえに $V(J')=\emptyset$ であり、\ref{ring:weak-nullstellensatz.2} から $1\in J'$ である。$J'$ の元の形から、次の形に書ける：
$$
1=\sum_{i}g_{i}(x,y)h_{i}(x)+q(x,y)(1-yf(x))\qquad(h_{i}\in J).
$$

**Step 3（$y=1/f$ を代入）.** 【主張：ある $m$ で $f^{m}\in J$】 有理関数体 $k(x_{1},\dots,x_{n})$ への代入 $x_{i}\mapsto x_{i}$, $y\mapsto 1/f$（\ref{ring:multivariate-universal}）を施すと、$1-(1/f)f=0$ なので $1=\sum_{i}g_{i}(x,1/f)h_{i}(x)$ となる。$g_{i}$ の $y$ についての次数の最大値を $m$ として $f^{m}$ を掛けると、$f^{m}g_{i}(x,1/f)\in k[x]$ なので $f^{m}=\sum_{i}(f^{m}g_{i}(x,1/f))h_{i}\in J$ を得る。

**Step 4（対応）.** 【主張：$I$ と $V$ は根基イデアルと代数的集合の間の互いに逆な対応である】 代数的集合 $X=V(S)$ について $V(I(X))=X$ が成り立つ：$X\subset V(I(X))$ は定義から従い、$S\subset I(X)$ から $V(I(X))\subset V(S)=X$ となる。根基イデアル $J$ については、Step 1〜3 から $I(V(J))=\sqrt{J}=J$ である。$I(X)$ は根基イデアル（\ref{ring:algebraic-set}）、$V(J)$ は代数的集合であり、$I$, $V$ はどちらも包含を逆にする。

::: hypcheck
- **前提「代数閉体」**：Step 2 で弱形を使った。Step 1 と Step 3 は任意の体で成り立つ。外すと偽：$\R[x]$ で $J=(x^{2}+1)$ は根基イデアルで $V(J)=\emptyset$ なので $I(V(J))=\R[x]\neq J$。
:::
:::

## ジャコブソン環 {#ring:sec-ns-jacobson}

::: theorem 有限生成代数のジャコブソン性 {#ring:fg-algebra-jacobson keywords="finitely generated algebras over a field are Jacobson rings, nilradical equals Jacobson radical, contraction of maximal ideals" index="ジャコブソン環|じゃこぶそんかん, ヒルベルト環|ひるべるとかん"}
（AC）体 $k$ 上の有限生成代数 $A$ について、
1. すべての素イデアルは、それを含む極大イデアルの共通部分である。特に $\mathrm{nil}(A)=\mathrm{rad}(A)$。
2. $k$ 代数の準同型 $\varphi:A\to B$（$B$ も $k$ 上の有限生成代数）について、$B$ の極大イデアルの逆像は $A$ の極大イデアルである。

（1 をみたす環を**ジャコブソン環**という。）
:::

::: proof
**Step 1（極大イデアルの剰余体）.** 【主張：$k$ 上の有限生成代数 $B$ の極大イデアル $\mathfrak{n}$ について、$B/\mathfrak{n}$ は $k$ 上有限】 $B/\mathfrak{n}$ は $k$ 上の有限生成代数で体なので、ザリスキの補題から $k$ 上有限である。

**Step 2（2）.** 【主張：$\mathfrak{m}\defeq\varphi^{-1}(\mathfrak{n})$ は極大イデアル】 $\varphi(1)=1\notin\mathfrak{n}$ なので $\mathfrak{m}\neq A$ である。$A/\mathfrak{m}\hookrightarrow B/\mathfrak{n}$ は単射な $k$ 代数の準同型なので、Step 1 から $A/\mathfrak{m}$ は $k$ 上有限次元の整域である。有限次元の整域は体である：$0\neq a$ を掛ける写像は単射な $k$ 線形写像なので全射であり、$ab=1$ となる $b$ がある。よって $\mathfrak{m}$ は極大である。

**Step 3（1）.** 【主張：素イデアル $\mathfrak{p}$ と $f\notin\mathfrak{p}$ について、$\mathfrak{p}$ を含み $f$ を含まない極大イデアルがある】 $C\defeq(A/\mathfrak{p})_{\bar f}=(A/\mathfrak{p})[1/\bar f]$ は $k$ 上の有限生成代数であり（$1/\bar f$ を生成元に加える）、$\bar f\neq 0$ かつ $A/\mathfrak{p}$ は整域なので零環でない。$C$ はネーター（\ref{ring:hilbert-basis}・\ref{ring:noetherian-exact.3}）なので、極大イデアル $\mathfrak{n}$ が従属選択公理でとれる。2 を合成 $A\to A/\mathfrak{p}\to C$ に使うと、その逆像 $\mathfrak{m}$ は極大イデアルであり、$\mathfrak{p}\subset\mathfrak{m}$ である。$f$ の像は $C$ の単元なので $\mathfrak{n}$ に属さず、$f\notin\mathfrak{m}$ である。

ゆえに、$\mathfrak{p}$ を含む極大イデアル全体の共通部分は $\mathfrak{p}$ である。これをすべての素イデアル $\mathfrak{p}$ について合わせると、$\mathrm{rad}(A)\subset\bigcap_{\mathfrak{p}}\mathfrak{p}=\mathrm{nil}(A)$（\ref{ring:nilradical}）であり、逆の包含 $\mathrm{nil}(A)\subset\mathrm{rad}(A)$ は素イデアルの共通部分が極大イデアルの共通部分に含まれることから従う。よって $\mathrm{nil}(A)=\mathrm{rad}(A)$ である。

::: hypcheck
- **前提「有限生成」**：Step 1 でザリスキの補題を使うのに必要。外すと偽：DVR $\Z_{(p)}$（$\Q$ 上の代数ではないが $\Z$ 上の代数）や $k[[x]]$ では、素イデアル $0$ は極大イデアル（ただ一つ）の共通部分に等しくない。2 で $B$ の有限生成も外せない：包含 $k[x]\to k(x)$ では、$k(x)$ の極大イデアル $0$ の逆像 $0$ は $k[x]$ の極大イデアルでない（$k(x)$ は $k$ 上有限でない体なので、ザリスキの補題から $k$ 上の有限生成代数でない）。
:::
:::

::: supplement
**幾何的な意味.** \ref{ring:nullstellensatz} により、代数閉体上のアフィン代数的集合 $X\subset k^{n}$ と被約な $k$ 上の有限生成代数 $k[x]/I(X)$（座標環）とが対応し、$X$ の点は座標環の極大イデアルに対応する（\ref{ring:weak-nullstellensatz}）。ジャコブソン性は、「素イデアル（既約な部分多様体）は、それに含まれる点（極大イデアル）で決まる」ことを意味する。これが、代数閉体上では極大イデアルだけを見ても情報が失われない理由で、一般の環で $\Spec$ を考える必要性との違いである（\see{ag:zariski-topology}）。

**\term[次元]{ring:krull-dimension}への応用.** 正規化定理の $d$ は $A$（整域なら）の商体の超越次数で、これが $A$ のクルル次元に等しい（\see{ring:page-dimension-theory}）。

**計算の観点.** $\Q[x_{1},\dots,x_{n}]$ で $f\in(g_{1},\dots,g_{r})$ かを判定する問題（イデアル所属問題）は、ブッフベルガーのアルゴリズム（グレブナー基底）で計算可能である。ただし問題そのものが指数領域（EXPSPACE）完全であり（困難性はマイヤーとマイヤー、1982 年。$\Q$ 上で指数領域に属することはマイヤー、1989 年）、どのアルゴリズムでも最悪の場合の計算量は非常に大きい。弱形の零点定理の「$V(g_{1},\dots,g_{r})=\emptyset$ か」は「$1\in(g_{1},\dots,g_{r})$ か」と同じである。有効零点定理（$1=\sum h_{i}g_{i}$ の $h_{i}$ の次数の、変数の数について単指数の上限。コラール、1988 年など）により、これは大きな一次方程式系の可解性に帰着する。いずれも本サイト未収録。
:::

## 問題 {#ring:sec-ns-problems}

::: problem {#ring:prob-nullstellensatz-example}
$\C[x,y]$ のイデアル $J=(x^{2}+y^{2}-1,\ x-1)$ について $V(J)$ と $\sqrt{J}$ を求め、$J\neq\sqrt{J}$ を確かめよ。
:::

::: solution
$x=1$ を代入すると $y^{2}=0$ なので、$V(J)=\{(1,0)\}$ である。\ref{ring:weak-nullstellensatz} の証明の Step 2 から $I(\{(1,0)\})=(x-1,y)$ であり（点 $(1,0)$ での値をとる代入の核）、零点定理から $\sqrt{J}=I(V(J))=(x-1,y)$ である。$x^{2}+y^{2}-1=y^{2}+(x-1)(x+1)$ なので $J=(x-1,y^{2})$ である。$x\mapsto 1$ の代入 $\C[x,y]\to\C[y]$ で $J$ の像は $(y^{2})$ に含まれ、$y\notin(y^{2})$ なので $y\notin J$ である。ゆえに $J\neq\sqrt{J}$ である。幾何的には、円と接線 $x=1$ が点 $(1,0)$ で接する（重複度 $2$）ことを $y^{2}$ が表している。
:::

::: problem {#ring:prob-finite-dim-algebra}
体 $k$ 上の有限生成代数 $A$ が $k$ 上有限次元であることと、$A$ の素イデアルがすべて極大であること（$\dim A=0$）は同値であることを示せ。
:::

::: solution
**⇒**：有限次元の環はアルティン環である（イデアルは $k$ 上の\term[部分空間]{lin:vector-space}なので、真の降鎖では\term[次元]{lin:dimension}が真に下がり、有限で止まる）。ゆえに \ref{ring:akizuki-hopkins.1} から素イデアルは極大である。**⇐**：$A=0$ なら明らかに有限次元なので、$A\neq 0$ とする。正規化定理から、代数的に独立な $y_{1},\dots,y_{d}$ について $A$ は $k[y_{1},\dots,y_{d}]$ 上有限（したがって整）である。$d\ge 1$ と仮定する。$k[y]/(y_{1})$ は多項式環と同型で整域なので、$0\subsetneq(y_{1})$ は $k[y]$ の素イデアルの鎖である。\ref{ring:lying-over}と\ref{ring:going-up}から、$A$ の素イデアルの鎖 $\mathfrak{q}_{0}\subset\mathfrak{q}_{1}$ で $\mathfrak{q}_{0}\cap k[y]=0$, $\mathfrak{q}_{1}\cap k[y]=(y_{1})$ となるものがあり、縮約が異なるので $\mathfrak{q}_{0}\subsetneq\mathfrak{q}_{1}$ である。すると $\mathfrak{q}_{0}$ は極大でない素イデアルとなり、仮定に反する。よって $d=0$ であり、$A$ は $k$ 上有限次元である。
:::
