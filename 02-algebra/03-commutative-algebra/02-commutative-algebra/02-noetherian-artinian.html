# ネーター環とアルティン環 {#ring:page-noetherian-artinian keywords="Noetherian ring, Noetherian module, ascending chain condition, Artinian ring, descending chain condition, Hilbert basis theorem, power series ring is Noetherian, Akizuki-Hopkins theorem, structure of Artinian rings, Noetherian induction"}

イデアルの昇鎖が必ず止まる環を**ネーター環**、降鎖が必ず止まる環を**アルティン環**という（\ref{ring:noetherian-artinian-def}）。ネーター環ではすべてのイデアルが有限生成であり（\ref{ring:noetherian-module}）、多項式環・冪級数環・剰余環・局所化をとってもネーター性は保たれる。とくに \ref{ring:hilbert-basis} により、体上の有限生成代数はネーター環で、代数幾何の対象はすべてこの枠に入る。一方アルティン環は非常に制限された環で、「ネーターかつ素イデアルがすべて極大」と同値であり（\ref{ring:akizuki-hopkins}）、アルティン局所環の有限直積に分解する（\ref{ring:artinian-structure}）。

> Atiyah–Macdonald 第 6・7・8 章と松村『可換環論』§3 の流れを参考にした。冪級数環のネーター性の証明は、係数を一段ずつ消していく形で書き直した。

## 記法と定義の確認 {#ring:sec-na-notation}

::: notation
- 環は可換、加群は $A$ 加群。有限生成加群は \ref{mod:generated-submodule}、完全列は \ref{mod:exact-sequence}、局所化と完全性は \ref{ring:page-local-properties}、素イデアルと積は \ref{ring:prime-contains-product}、中国剰余定理は \tref{ring:chinese-remainder}、冪零根基とジャコブソン根基は \ref{ring:nilradical}, \ref{ring:jacobson-radical}。
- 体上のベクトル空間の\term[次元]{lin:dimension}（\ref{mod:vector-space-dimension}）について、有限次元空間 $V$ の\term[部分空間]{lin:vector-space} $W\subsetneq W'$ は $\dim W<\dim W'$ をみたす（線形代数。\ref{lin:dimension}）。
- **選択公理**：「昇鎖条件 ⇒ 極大条件」とネーター帰納法、無限列の構成で**従属選択公理**（DC）を使う。冪零根基とジャコブソン根基の比較で選択公理を使う箇所は明記する。
:::

## 鎖条件 {#ring:sec-na-chain}

::: definition ネーター加群・アルティン加群・ネーター環・アルティン環 {#ring:noetherian-artinian-def keywords="Noetherian module, Artinian module, ascending chain condition, descending chain condition, Noetherian ring, Artinian ring" index="ネーター環|ねーたーかん, ネーター加群|ねーたーかぐん, アルティン環|あるてぃんかん, アルティン加群|あるてぃんかぐん, 昇鎖条件|しょうさじょうけん, 降鎖条件|こうさじょうけん"}
$A$ 加群 $M$ の部分加群の昇鎖 $M_{1}\subset M_{2}\subset\cdots$ がすべてある番号から先で一定になるとき、$M$ は**昇鎖条件**をみたす、または**ネーター加群**であるという。降鎖 $M_{1}\supset M_{2}\supset\cdots$ について同様のとき**降鎖条件**、**アルティン加群**という。$A$ 自身が $A$ 加群としてネーター（アルティン）であるとき、$A$ を**ネーター環**（**アルティン環**）という。
:::

::: theorem ネーター加群の特徴付け {#ring:noetherian-module keywords="Noetherian iff every submodule is finitely generated iff maximal condition" index="ネーター加群の特徴付け|ねーたーかぐんのとくちょうづけ, 極大条件|きょくだいじょうけん"}
（DC）$A$ 加群 $M$ について、次は同値である。
1. $M$ はネーター加群。
2. （極大条件）部分加群の空でない集合は、包含について極大な元をもつ。
3. $M$ のすべての部分加群は有限生成。

アルティン加群についても、1 と「（極小条件）部分加群の空でない集合は極小元をもつ」は同値である。
:::

::: proof
**Step 1（1⇒2）.** 【主張：$M$ がネーター加群なら、部分加群の空でない集合は極大元をもつ】 部分加群の空でない集合 $\Sigma$ が極大元をもたないとすると、各 $N\in\Sigma$ に対し $N\subsetneq N'$ となる $N'\in\Sigma$ がある。従属選択公理で $N_{1}\subsetneq N_{2}\subsetneq\cdots$（$N_{i}\in\Sigma$）を作れるので、昇鎖条件に反する。

**Step 2（2⇒3）.** 【主張：極大条件があれば、$M$ のすべての部分加群は有限生成】 部分加群 $N$ の有限生成部分加群全体 $\Sigma$（$0\in\Sigma$ なので空でない）の極大元 $N_{0}$ をとる。$x\in N\setminus N_{0}$ があれば、$N_{0}+Ax\in\Sigma$ は $N_{0}$ より真に大きく、極大性に反する。よって $N=N_{0}$ であり、$N$ は有限生成である。

**Step 3（3⇒1）.** 【主張：すべての部分加群が有限生成なら、$M$ はネーター加群】 昇鎖 $M_{1}\subset M_{2}\subset\cdots$ の和集合 $N$ は部分加群（鎖の和集合）で、仮定から有限生成なので $N=Ax_{1}+\dots+Ax_{k}$ と書ける。各 $x_{i}$ はある $M_{n_{i}}$ に属し、$n=\max n_{i}$ とすれば $N=M_{n}$ となる。よって $n'\ge n$ なら $M_{n}\subset M_{n'}\subset N=M_{n}$ で、鎖は $M_{n}$ から先で一定である。

**Step 4（アルティン）.** 【主張：降鎖条件と極小条件は同値】 Step 1 と同じ議論を逆向きの鎖に使えば、降鎖条件から極小条件が従う。逆に極小条件を仮定し、降鎖 $M_{1}\supset M_{2}\supset\cdots$ の項全体の集合の極小元を $M_{n}$ とすると、$n'\ge n$ なら $M_{n'}\subset M_{n}$ と極小性から $M_{n'}=M_{n}$ となり、鎖は止まる。

::: hypcheck
- **従属選択公理**：Step 1（1⇒2）と Step 4 の前半で使った。逆向きの 2⇒1（昇鎖の項全体の集合の極大元 $M_{n}$ から先で鎖が一定になる。Step 4 の後半と同じ議論）と 3⇒1 は選択公理を使わない。
:::
:::

::: proposition 完全列と鎖条件 {#ring:noetherian-exact keywords="Noetherian and Artinian modules in short exact sequences, finitely generated modules over a Noetherian ring" index="鎖条件と完全列|さじょうけんとかんぜんれつ" refname="完全列とネーター性・アルティン性" refscope="field"}
短完全列 $0\to M'\xrightarrow{f}M\xrightarrow{g}M''\to 0$ について、$M$ がネーター（アルティン）であることと、$M'$ と $M''$ がともにネーター（アルティン）であることは同値である。したがって、
1. ネーター（アルティン）加群の有限直和はネーター（アルティン）。
2. $A$ がネーター（アルティン）環なら、有限生成 $A$ 加群はネーター（アルティン）加群。
3. $A$ がネーター環なら、剰余環 $A/I$ と局所化 $S^{-1}A$ もネーター環。
:::

::: proof
**Step 1（⇒）.** 【主張：$M$ がネーター（アルティン）なら $M'$, $M''$ もそうである】 $M'$ の部分加群の鎖 $(N'_{n})$ について、$(f(N'_{n}))$ は $M$ の鎖なのである番号から先で一定になり、$f$ は単射なので $N'_{n}=f^{-1}(f(N'_{n}))$ も一定になる。$M''$ の部分加群の鎖 $(N''_{n})$ について、$(g^{-1}(N''_{n}))$ は $M$ の鎖なのである番号から先で一定になり、$g$ は全射なので $N''_{n}=g(g^{-1}(N''_{n}))$ も一定になる。

**Step 2（⇐）.** 【主張：$M'$, $M''$ がネーター（アルティン）なら $M$ もそうである】 $M$ の昇鎖 $(M_{n})$ について、$f^{-1}(M_{n})$ と $g(M_{n})$ はある $n_{0}$ から先で一定。$n\ge n_{0}$ で $M_{n}\subset M_{n+1}$ が等しいことを示す：$x\in M_{n+1}$ について $g(x)\in g(M_{n})$ なので $g(x)=g(y)$, $y\in M_{n}$。$x-y\in\Ker g=f(M')$ で、$x-y\in M_{n+1}$ なので $x-y=f(z)$, $z\in f^{-1}(M_{n+1})=f^{-1}(M_{n})$ と書ける。よって $x-y\in M_{n}$ となり、$x\in M_{n}$ である。降鎖については、$n$ と $n+1$ の役割を入れ替えた同じ議論で $M_{n}\subset M_{n+1}$ を示せばよい。

**Step 3.** 【主張：系の 1〜3 が成り立つ】 1 は短完全列 $0\to M_{1}\to M_{1}\oplus M_{2}\to M_{2}\to 0$ と帰納法から従う。2：$M$ が $n$ 個の元で生成されるなら $M$ は $A^{n}$ の剰余加群に同型であり（\ref{mod:free-module-universal.3}）、$A^{n}$ は 1 からネーター（アルティン）なので、Step 1 から $M$ もそうである。3：$A/I$ のイデアルは $A$ のイデアル $\supset I$ と対応し（\ref{ring:correspondence}）、$S^{-1}A$ のイデアルは $A$ のイデアルの拡大で、$J\mapsto j^{-1}(J)$ は包含を保つ単射（\ref{ring:localization-ideals.2}）なので、昇鎖が $A$ の昇鎖に移る。
:::

::: example
1. 体、PID はネーター環（イデアルが単項、したがって有限生成）。体と $\Z/n\Z$（$n\ge 1$）はアルティン環。$\Z$ はアルティン環でない：$(2)\supsetneq(4)\supsetneq(8)\supsetneq\cdots$。
2. 体 $K$ 上の可算無限変数の多項式環 $K[x_{1},x_{2},\dots]$ はネーター環でない：$(x_{1})\subsetneq(x_{1},x_{2})\subsetneq\cdots$。これは整域なので、ネーター環の部分環（ここでは商体 $K(x_{1},x_{2},\dots)$ の部分環）はネーターとは限らない。
3. $\Z$ 加群 $\Z[1/p]/\Z$（プリューファー群）はアルティン加群だがネーター加群でない。実際、\term[位数]{grp:element-order} $p^{n}$ の元はすべて巡回部分群 $p^{-n}\Z/\Z$ を生成するので、部分群 $H$ は、元の位数が有界なら最大の位数を $p^{n}$ として $H=p^{-n}\Z/\Z$、有界でなければ $H$ 全体である。よって部分群は $0=p^{0}\Z/\Z\subsetneq p^{-1}\Z/\Z\subsetneq p^{-2}\Z/\Z\subsetneq\cdots$ と全体だけで、この昇鎖は止まらないが、降鎖はどれも有限回で止まる。
:::

::: proposition ネーター局所環上の有限生成平坦加群は自由 {#ring:local-flat-free keywords="finitely generated flat modules over a Noetherian local ring are free" index="局所環上の平坦加群|きょくしょかんじょうのへいたんかぐん"}
ネーター局所環 $(A,\mathfrak{m},k)$ 上の有限生成平坦加群は自由である。
:::

::: proof
**Step 1.** $M$ を有限生成平坦加群、$n\defeq\dim_{k}M/\mathfrak{m}M$ とする。【主張：全射 $f:A^{n}\to M$ で、核 $K\defeq\Ker f$ が有限生成のものがある】 \ref{ring:nakayama-generators} から $M$ は $n$ 個の元 $p_{1},\dots,p_{n}$ で生成され、全射 $f:A^{n}\to M$, $e_{i}\mapsto p_{i}$ を得る。$A^{n}$ は \ref{ring:noetherian-exact.2} からネーター加群なので、部分加群 $K$ は有限生成である（\ref{ring:noetherian-module.3}）。

**Step 2.** 【主張：$k\otimes_{A}K\to k\otimes_{A}A^{n}$ は単射】 $M$ は平坦なので $\mathrm{Tor}^{A}_{1}(M,k)=0$ であり（\ref{ha:flat-tor.1}）、平衡性（\ref{ha:tor-balanced}）から $\mathrm{Tor}^{A}_{1}(k,M)=0$ である。\ref{ha:tor-basic.3} を $k\otimes_{A}-$ と短完全列 $0\to K\to A^{n}\to M\to 0$ に使うと、完全列 $\mathrm{Tor}^{A}_{1}(k,M)\to k\otimes_{A}K\to k\otimes_{A}A^{n}\to k\otimes_{A}M\to 0$ を得るので、主張が従う。

**Step 3.** 【主張：$K=0$、したがって $M\cong A^{n}$】 \ref{mod:tensor-quotient} から $k\otimes_{A}A^{n}\cong k^{n}$, $k\otimes_{A}M\cong M/\mathfrak{m}M$ であり、$k^{n}\to M/\mathfrak{m}M$ は $n$ 次元の $k$ ベクトル空間の間の全射なので単射である。Step 2 の完全列で $k\otimes_{A}K$ の像はこの写像の核 $0$ に等しく、$k\otimes_{A}K\to k\otimes_{A}A^{n}$ は単射なので、$K/\mathfrak{m}K\cong k\otimes_{A}K=0$ である。$K$ は有限生成で $\mathfrak{m}=\mathrm{rad}(A)$ なので、\ref{ring:nakayama.2} から $K=0$ であり、$f$ は同型 $A^{n}\cong M$ である。

::: hypcheck
- **前提「ネーター」**：Step 1 で $K$ が有限生成であることにだけ使った（$K$ が有限生成でありさえすれば、Step 2・3 はそのまま通る）。
- **前提「平坦」**：Step 2 で使った。外すと偽：$k=A/\mathfrak{m}$ は（$\mathfrak{m}\neq0$ なら）有限生成だが、$\mathfrak{m}$ で零化されるので自由でない。
- **前提「局所環」**：Step 1・3 で中山の補題に使った。外すと偽：$A=\Z/6\Z$ の直和因子 $\Z/2\Z$ は射影的（したがって平坦。\ref{ha:projective-flat.2}）で有限生成だが、自由でない（$0$ でない自由 $\Z/6\Z$ 加群は $6$ 個以上の元をもつ）。
:::
:::

::: supplement
\ref{ring:page-local-properties} の補足で予告した事実で、\ref{mod:flat-z} の hypcheck の「$(x,y)$ は平坦でない」の理由はこれである。
:::

## ヒルベルトの基底定理 {#ring:sec-na-hilbert}

::: theorem ヒルベルトの基底定理 {#ring:hilbert-basis keywords="Hilbert basis theorem, polynomial ring over a Noetherian ring is Noetherian" index="ヒルベルトの基底定理|ひるべるとのきていていり" refname="ヒルベルトの基底定理"}
$A$ がネーター環なら $A[x]$ もネーター環である。したがって、ネーター環上の有限生成代数（特に体上の有限生成代数と $\Z[x_{1},\dots,x_{n}]$ の剰余環）はネーター環である。
:::

::: proof
**Step 1.** $I\subset A[x]$ をイデアルとし、$I$ の元の最高次係数全体に $0$ を加えた集合 $L$ を考える。【主張：$L$ は $A$ のイデアル】 $a,b$ が $f,g\in I$ の最高次係数で $\deg f\le\deg g$ なら、$x^{\deg g-\deg f}f+g\in I$ の $x^{\deg g}$ の係数は $a+b$ なので、$a+b\in L$ である（$a+b=0$ の場合も $L$ に属する）。$r\in A$ について $rf\in I$ の $x^{\deg f}$ の係数は $ra$ なので、$ra\in L$ である。$A$ はネーターなので $L=(a_{1},\dots,a_{k})$ と書ける。$a_{i}$ を最高次係数にもつ $f_{i}\in I$ をとり、$N\defeq\max\deg f_{i}$ とおく。

**Step 2.** 【主張：各 $f\in I$ について、$f\equiv g\pmod{(f_{1},\dots,f_{k})}$ となる $g\in I$, $\deg g<N$ がある】 $f\in I$ で $\deg f=d\ge N$ なら、最高次係数を $a=\sum u_{i}a_{i}$（$u_{i}\in A$）と書くと、$f-\sum u_{i}x^{d-\deg f_{i}}f_{i}\in I$ は次数が $d$ 未満である。これを次数が $N$ 未満になるまで繰り返せばよい。

**Step 3（次数の低い部分）.** 【主張：$I$ は有限生成】 $I\cap(A+Ax+\dots+Ax^{N-1})$ は有限生成 $A$ 加群 $A+Ax+\dots+Ax^{N-1}\cong A^{N}$ の部分加群なので、有限生成である（\ref{ring:noetherian-exact.2} と \ref{ring:noetherian-module}）。その生成元を $g_{1},\dots,g_{l}$ とする。Step 2 の $g$ はこの部分加群に属するので、$I=(f_{1},\dots,f_{k},g_{1},\dots,g_{l})$ である。

**Step 4.** 【主張：ネーター環上の有限生成代数はネーター環】 Step 1〜3 と \ref{ring:noetherian-module} から $A[x]$ はネーター環であり、$A[x_{1},\dots,x_{n}]=A[x_{1},\dots,x_{n-1}][x_{n}]$ なので、帰納法で $A[x_{1},\dots,x_{n}]$ はネーター環である。有限生成 $A$ 代数はその剰余環に同型であり（\ref{ring:multivariate-universal.2}）、\ref{ring:noetherian-exact.3} からネーター環である。

::: hypcheck
- **前提「ネーター」**：Step 1 で $L$ が有限生成であること、Step 3 で部分加群が有限生成であることに使った。
- 選択公理は使わない（有限生成のイデアルから有限個の元を選ぶだけ）。ただし「ネーター」を昇鎖条件で定義したので、有限生成性（\ref{ring:noetherian-module.3}）を引くところで、従属選択公理を使う 1⇒3 を経由している。「すべてのイデアルが有限生成」を定義に採れば不要。
:::
:::

::: theorem 冪級数環のネーター性 {#ring:power-series-noetherian keywords="power series ring over a Noetherian ring is Noetherian" index="冪級数環のネーター性|べききゅうすうかんのねーたーせい"}
（DC）$A$ がネーター環なら $A[[x]]$ もネーター環である。
:::

::: proof
**Step 1.** イデアル $I\subset A[[x]]$ と $i\ge 0$ について、$J_{i}$ を「$I\cap x^{i}A[[x]]$ の元の $x^{i}$ の係数」全体とする。【主張：$J_{0}\subset J_{1}\subset\cdots$ は $A$ のイデアルの昇鎖で、ある $N$ から先で一定】 $I\cap x^{i}A[[x]]$ は和と $A$ の元の掛け算で閉じるので、$J_{i}$ はイデアルである。$g\in I\cap x^{i}A[[x]]$ の $x^{i}$ の係数が $a$ なら、$xg\in I\cap x^{i+1}A[[x]]$ の $x^{i+1}$ の係数も $a$ なので、$J_{i}\subset J_{i+1}$ である。ネーター性から $J_{N}=J_{N+1}=\cdots$ となる $N$ がある。各 $i\le N$ について $J_{i}=(a_{i1},\dots,a_{ik_{i}})$ と書き、$x^{i}$ の係数が $a_{ij}$ である $f_{ij}\in I\cap x^{i}A[[x]]$ をとる。

**Step 2（一段ずつ消す）.** $f\in I$ を与える。【主張：$h_{0}=f$ から始めて、$h_{i}\in I\cap x^{i}A[[x]]$ と $c_{ij}\in A$ を、下の式 $h_{i+1}=h_{i}-\sum_{j}c_{ij}x^{i-i'}f_{i'j}$ をみたすように順に選べる】$i\ge 0$ について $i'\defeq\min(i,N)$ とし、$h_{0}\defeq f$ から始めて、$h_{i}\in I\cap x^{i}A[[x]]$ の $x^{i}$ の係数は $J_{i}=J_{i'}$ に属するので $\sum_{j}c_{ij}a_{i'j}$ と書け、
$$
h_{i+1}\defeq h_{i}-\sum_{j}c_{ij}x^{i-i'}f_{i'j}\in I\cap x^{i+1}A[[x]]
$$
とおく。$x^{i-i'}f_{i'j}$ は $x^{i}$ で割り切れて $x^{i}$ の係数が $a_{i'j}$ なので、$h_{i+1}$ の $x^{i}$ の係数は $0$ になり、$h_{i+1}\in I\cap x^{i+1}A[[x]]$ である（係数 $c_{ij}$ の選択に従属選択公理を使う）。

**Step 3（和をまとめる）.** $g_{j}\defeq\sum_{i\ge N}c_{ij}x^{i-N}\in A[[x]]$ とおく。【主張：次の等式が成り立ち、したがって $I=(f_{ij})$ は有限生成】
$$
f=\sum_{i<N}\sum_{j}c_{ij}f_{ij}+\sum_{j}g_{j}f_{Nj}.
$$
実際、両辺の $x^{n}$ の係数は、Step 2 の $i\le n$ の段だけで決まり（$i>n$ の段で引いたものは $x^{n+1}$ で割り切れる）、$f-h_{n+1}$ の $x^{n}$ の係数と一致し、$h_{n+1}\in x^{n+1}A[[x]]$ なので $f$ の係数に等しい。よって $I=(f_{ij})$ は有限生成。

::: hypcheck
- **従属選択公理**：Step 2 で無限回の選択をした。
- Step 3 の無限和は、各係数が有限和で決まるので冪級数環の中で意味をもつ（$x$ 進位相での収束。\see{ring:page-completion}）。
:::
:::

## ネーター帰納法 {#ring:sec-na-induction}

::: proposition ネーター環の素イデアルの積 {#ring:noetherian-prime-product keywords="in a Noetherian ring every ideal contains a product of primes, finitely many minimal primes, nilradical is nilpotent" index="ネーター帰納法|ねーたーきのうほう, 極小素イデアル|きょくしょうそいである"}
（DC）$A$ をネーター環とする。
1. すべてのイデアル $I$ は、$I$ を含む素イデアルの有限個の積を含む（$I=A$ のときは空の積 $A$）。
2. $I$ を含む極小な素イデアルは有限個しかない。
3. $\mathrm{nil}(A)$ は冪零イデアル：ある $k$ で $\mathrm{nil}(A)^{k}=0$。
:::

::: proof
**Step 1（1：ネーター帰納法）.** 1 をみたさないイデアル全体 $\Sigma$ が空でないとすると、極大条件（\ref{ring:noetherian-module}）から極大元 $I$ がある。$I$ は素イデアルでない（素ならそれ自身の積）し $I\neq A$。よって $ab\in I$, $a,b\notin I$ となる $a,b$ がある。$I+(a)$, $I+(b)$ は $I$ より真に大きいので $\Sigma$ に属さず、それぞれを含む素イデアルの積 $P_{1}\cdots P_{r}\subset I+(a)$, $Q_{1}\cdots Q_{s}\subset I+(b)$ がある（各 $P_{i},Q_{j}\supset I$）。すると $P_{1}\cdots P_{r}Q_{1}\cdots Q_{s}\subset(I+(a))(I+(b))\subset I+(ab)=I$ で、$I\notin\Sigma$ と矛盾。

**Step 2（2）.** 1 から $\mathfrak{p}_{1}\cdots\mathfrak{p}_{n}\subset I$（$\mathfrak{p}_{i}\supset I$ 素）。$I$ を含む素イデアル $\mathfrak{q}$ は $\mathfrak{p}_{1}\cdots\mathfrak{p}_{n}$ を含むので、ある $\mathfrak{p}_{i}\subset\mathfrak{q}$（\ref{ring:prime-contains-product}）。よって $I$ を含む極小素イデアルは $\mathfrak{p}_{1},\dots,\mathfrak{p}_{n}$ のどれか。

**Step 3（3）.** \ref{ring:noetherian-module.3} から $\mathrm{nil}(A)=(x_{1},\dots,x_{m})$ と有限生成であり、各 $x_{i}$ は冪零なので $x_{i}^{e}=0$ となる $e$ を共通にとれる。$\mathrm{nil}(A)^{m(e-1)+1}$ は単項式 $x_{1}^{k_{1}}\cdots x_{m}^{k_{m}}$（$\sum k_{i}=m(e-1)+1$）で生成され、鳩の巣原理からどの単項式でもある $k_{i}\ge e$ となるので、生成元はすべて $0$ である。よって $\mathrm{nil}(A)^{m(e-1)+1}=0$ である。
:::

## アルティン環 {#ring:sec-na-artinian}

::: lemma 極大イデアルの積で消える環 {#ring:product-of-maximals-zero keywords="if a product of maximal ideals is zero then Noetherian iff Artinian" index="極大イデアルの積|きょくだいいであるのせき"}
（DC）環 $A$ で、極大イデアル（重複を許す）の積 $\mathfrak{m}_{1}\cdots\mathfrak{m}_{n}=0$ となるものがあれば、$A$ がネーター環であることとアルティン環であることは同値である。
:::

::: proof
**Step 1.** $I_{0}\defeq A$, $I_{k}\defeq\mathfrak{m}_{1}\cdots\mathfrak{m}_{k}$ とおくと $A=I_{0}\supset I_{1}\supset\dots\supset I_{n}=0$。各 $V_{k}\defeq I_{k-1}/I_{k}$ は $\mathfrak{m}_{k}$ で消えるので、体 $k_{k}=A/\mathfrak{m}_{k}$ 上のベクトル空間で、その $A$ 部分加群は $k_{k}$ \term[部分空間]{lin:vector-space}と同じ。

**Step 2（ベクトル空間の鎖条件）.** 体上のベクトル空間 $V$ について、ネーター $\iff$ 有限次元 $\iff$ アルティン。有限次元なら、部分空間の真の昇鎖・降鎖では\term[次元]{lin:dimension}が真に増減し（記法の欄）、次元は $0$ 以上 $\dim V$ 以下なので止まる。無限次元なら、一次独立な元の列 $e_{1},e_{2},\dots$ を（従属選択公理で）とると、$\langle e_{1},\dots,e_{n}\rangle$ は止まらない昇鎖、$\langle e_{n},e_{n+1},\dots\rangle$ は止まらない降鎖。

**Step 3.** \ref{ring:noetherian-exact} を短完全列 $0\to I_{k}\to I_{k-1}\to V_{k}\to 0$ に繰り返し使うと、$A$ がネーター $\iff$ すべての $V_{k}$ がネーター $\iff$ すべての $V_{k}$ が有限次元 $\iff$ すべての $V_{k}$ がアルティン $\iff$ $A$ がアルティン。
:::

::: theorem アルティン環の基本性質と秋月＝ホプキンスの定理 {#ring:akizuki-hopkins keywords="Artinian ring: primes are maximal, finitely many maximal ideals, nilradical nilpotent, Artinian iff Noetherian of dimension zero, Akizuki-Hopkins" index="秋月＝ホプキンスの定理|あきづきほぷきんすのていり, アルティン環の性質|あるてぃんかんのせいしつ"}
（AC）$A$ をアルティン環とする。
1. 素イデアルはすべて極大イデアル。
2. 極大イデアルは有限個しかない。
3. $\mathrm{nil}(A)=\mathrm{rad}(A)$ は冪零イデアル。
4. $A$ はネーター環である。逆に、ネーター環で素イデアルがすべて極大イデアルなら、アルティン環である（**秋月＝ホプキンスの定理**）。
:::

::: proof
**Step 1（1）.** 【主張：素イデアルはすべて極大イデアル】 素イデアル $\mathfrak{p}$ について $B=A/\mathfrak{p}$ はアルティン整域（\ref{ring:noetherian-exact} のアルティン版）。$0\neq x\in B$ について降鎖 $(x)\supset(x^{2})\supset\cdots$ は止まり、ある $n$ で $(x^{n})=(x^{n+1})$、すなわち $x^{n}=x^{n+1}y$ となる $y\in B$ がある。整域なので $x^{n}$ で簡約して $1=xy$ を得る。よって $B$ は体であり、$\mathfrak{p}$ は極大イデアルである（\ref{ring:prime-maximal-quotient.2}）。

**Step 2（2）.** 【主張：極大イデアルは有限個しかない】 極大イデアルの有限個の共通部分全体は極小条件から極小元 $\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n}$ をもつ。任意の極大イデアル $\mathfrak{m}$ について $\mathfrak{m}\cap\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n}=\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n}$ なので $\mathfrak{m}\supset\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n}\supset\mathfrak{m}_{1}\cdots\mathfrak{m}_{n}$ である。\ref{ring:prime-contains-product} からある $i$ で $\mathfrak{m}\supset\mathfrak{m}_{i}$ となり、$\mathfrak{m}_{i}$ は極大なので $\mathfrak{m}=\mathfrak{m}_{i}$ である。

**Step 3（3）.** 【主張：$\mathrm{nil}(A)=\mathrm{rad}(A)$ で、ある $k$ について $\mathrm{nil}(A)^{k}=0$】 1 から素イデアル全体と極大イデアル全体が一致するので $\mathrm{nil}(A)=\mathrm{rad}(A)$（\ref{ring:nilradical}、選択公理を使う）。$N\defeq\mathrm{nil}(A)$ の冪の降鎖から $I\defeq N^{k}=N^{k+1}=\cdots$ となる $k$ がある。$I\neq 0$ と仮定する。$IJ\neq 0$ となるイデアル $J$ 全体は $I$ を含む（$I\cdot I=N^{2k}=I\neq 0$）ので空でなく、極小元 $J$ がある。$xI\neq 0$ となる $x\in J$ をとると $(x)\subset J$ で $(x)I\neq 0$ なので、極小性から $J=(x)$。$(xI)I=xI^{2}=xI\neq 0$ かつ $xI\subset(x)$ なので、再び極小性から $xI=(x)$。よって $x=xy$（$y\in I$）で、$x=xy=xy^{2}=\dots=xy^{m}$。$y\in N$ は冪零なので $x=0$ となり、$xI\neq 0$ に反する。よって $N^{k}=0$。

**Step 4（4、⇒）.** 【主張：アルティン環はネーター環】 2 の極大イデアル $\mathfrak{m}_{1},\dots,\mathfrak{m}_{n}$ は極大イデアルのすべてなので、$\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n}=\mathrm{rad}(A)=N$ である。よって $(\mathfrak{m}_{1}\cdots\mathfrak{m}_{n})^{k}\subset(\mathfrak{m}_{1}\cap\dots\cap\mathfrak{m}_{n})^{k}=N^{k}=0$ となり、極大イデアルの積が $0$ になるので、\ref{ring:product-of-maximals-zero} から $A$ はネーター環である。

**Step 5（4、⇐）.** 【主張：ネーター環で素イデアルがすべて極大なら、アルティン環】 \ref{ring:noetherian-prime-product.1} を $I=0$ に使うと、素イデアル、すなわち極大イデアルの有限個の積が $0$ になる。\ref{ring:product-of-maximals-zero} から $A$ はアルティン環である。

::: hypcheck
- **選択公理**：Step 3 の $\mathrm{nil}=\mathrm{rad}$ で \ref{ring:nilradical} を使った（冪零性そのものの議論は極小条件だけ、すなわち従属選択公理で済む）。
- 4 の逆の前提「素イデアルがすべて極大」：外すと偽：$\Z$ はネーターだがアルティンでない（$0$ が極大でない素イデアル）。
:::
:::

::: theorem アルティン環の構造定理 {#ring:artinian-structure keywords="an Artinian ring is a finite product of Artinian local rings" index="アルティン環の構造定理|あるてぃんかんのこうぞうていり, アルティン局所環|あるてぃんきょくしょかん" refname="アルティン環の構造定理"}
（AC）アルティン環 $A$ は、有限個のアルティン局所環の直積に同型である：極大イデアルを $\mathfrak{m}_{1},\dots,\mathfrak{m}_{n}$ とすると、十分大きな $k$ について
$$
A\cong A/\mathfrak{m}_{1}^{k}\times\dots\times A/\mathfrak{m}_{n}^{k},
$$
各 $A/\mathfrak{m}_{i}^{k}$ は唯一の極大イデアル $\mathfrak{m}_{i}/\mathfrak{m}_{i}^{k}$ をもつ局所環で、$A_{\mathfrak{m}_{i}}$ と同型である。
:::

::: proof
**Step 1（中国剰余定理）.** 【主張：$A\cong A/\mathfrak{m}_{1}^{k}\times\dots\times A/\mathfrak{m}_{n}^{k}$】 \ref{ring:akizuki-hopkins} の Step 4 から $\prod_{i}\mathfrak{m}_{i}^{k}=(\mathfrak{m}_{1}\cdots\mathfrak{m}_{n})^{k}=0$。$i\neq j$ なら $\mathfrak{m}_{i}^{k}+\mathfrak{m}_{j}^{k}=A$（そうでなければ極大イデアル $\mathfrak{m}$ に含まれ、$\mathfrak{m}\supset\mathfrak{m}_{i}^{k}$ から $\mathfrak{m}=\mathfrak{m}_{i}$、同様に $\mathfrak{m}=\mathfrak{m}_{j}$ で矛盾）。よって \ref{ring:chinese-remainder.1}・\ref[2]{ring:chinese-remainder.2} から $\bigcap_{i}\mathfrak{m}_{i}^{k}=\prod_{i}\mathfrak{m}_{i}^{k}=0$ で、$A=A/\bigcap_{i}\mathfrak{m}_{i}^{k}\cong A/\mathfrak{m}_{1}^{k}\times\dots\times A/\mathfrak{m}_{n}^{k}$ である。

**Step 2.** 【主張：$A/\mathfrak{m}_{i}^{k}$ は唯一の極大イデアル $\mathfrak{m}_{i}/\mathfrak{m}_{i}^{k}$ をもつ局所環】 $A/\mathfrak{m}_{i}^{k}$ の極大イデアルは $\mathfrak{m}_{i}^{k}$ を含む極大イデアル $\mathfrak{m}$ に対応し（\ref{ring:prime-preimage.2}）、$\mathfrak{m}$ は素イデアルなので $\mathfrak{m}\supset\mathfrak{m}_{i}^{k}$ から $\mathfrak{m}\supset\mathfrak{m}_{i}$、すなわち $\mathfrak{m}=\mathfrak{m}_{i}$ である。

**Step 3.** $B_{j}\defeq A/\mathfrak{m}_{j}^{k}$、$S\defeq A\setminus\mathfrak{m}_{i}$ とおく。【主張：$A_{\mathfrak{m}_{i}}\cong B_{i}$】局所化は有限直和と交換し（\ref{ring:localization-operations} の Step 1 と同じ）、環としても $S^{-1}A\cong\prod_{j}S^{-1}B_{j}$ である（$S$ は各成分に像として作用）。$j\neq i$ なら $\mathfrak{m}_{j}\not\subset\mathfrak{m}_{i}$ なので $s\in\mathfrak{m}_{j}\setminus\mathfrak{m}_{i}$ がとれ、$s^{k}\in\mathfrak{m}_{j}^{k}$ から $s$ の $B_{j}$ での像は冪零、したがって $S$ の像は $0$ を含み $S^{-1}B_{j}=0$（\ref{ring:localization.4}）。$j=i$ なら $S$ の元は局所環 $B_{i}$ の極大イデアル $\mathfrak{m}_{i}/\mathfrak{m}_{i}^{k}$ の外に移るので単元で、普遍性（\ref{ring:localization-universal}）から $S^{-1}B_{i}\cong B_{i}$。よって $A_{\mathfrak{m}_{i}}\cong B_{i}$。
:::

::: example
1. $\Z/n\Z$（$n=\prod p_{i}^{e_{i}}$）$\cong\prod\Z/p_{i}^{e_{i}}\Z$（\ref{ring:crt-integers}）が構造定理の例。
2. 体 $K$ 上の有限次元代数 $B$（例えば $f\neq0$ について $K[x]/(f)$）はアルティン環である（イデアルは有限次元 $K$ ベクトル空間 $B$ の\term[部分空間]{lin:vector-space}なので、\ref{ring:product-of-maximals-zero} の Step 2 と同じく、次元が真に減る降鎖は有限回で止まる）。$K[x]/(x^{2})$ は極大イデアル $(x)$ をもつアルティン局所環で、$x$ は冪零。
:::

::: supplement
**長さ.** アルティンかつネーターな加群は**組成列**（単純加群を因子とする有限列）をもち、その長さ $\ell(M)$ は組成列の取り方によらない（ジョルダン＝ヘルダーの定理の加群版。群の場合は \tref{grp:jordan-holder}。加群の場合の証明は \see{ring:length-properties}）。\ref{ring:product-of-maximals-zero} の証明は、$\ell(A)=\sum_{k}\dim V_{k}$ を計算していることにあたる。長さはヒルベルト＝サミュエル関数の定義に使う（\see{ring:page-dimension-theory}）。
:::

## 問題 {#ring:sec-na-problems}

::: problem {#ring:prob-noetherian-surjective-endo}
ネーター加群の全射\term[自己準同型]{mod:submodule-homomorphism} $\varphi:M\to M$ は単射であることを、$\Ker\varphi^{n}$ の昇鎖を使って示せ。
:::

::: solution
ネーター性から昇鎖 $\Ker\varphi\subset\Ker\varphi^{2}\subset\cdots$ は止まり、ある $n$ で $\Ker\varphi^{n}=\Ker\varphi^{n+1}$ となる。$x\in\Ker\varphi$ とすると、$\varphi^{n}$ は全射なので $x=\varphi^{n}(y)$ となる $y$ がある。$\varphi^{n+1}(y)=\varphi(x)=0$ なので $y\in\Ker\varphi^{n+1}=\Ker\varphi^{n}$ であり、よって $x=\varphi^{n}(y)=0$ である。
:::

::: problem {#ring:prob-noetherian-not-artinian-ideal}
$\Z$ の $0$ でないイデアル $I$ について $\Z/I$ はアルティン環であることを、\ref{ring:akizuki-hopkins.4} を使って示せ。
:::

::: solution
$\Z/I=\Z/n\Z$（$n\ge 1$）はネーター環（\ref{ring:noetherian-exact.3}）。その素イデアルは $n\Z$ を含む $\Z$ の素イデアル $p\Z$（$p\mid n$）に対応し（\ref{ring:prime-preimage.2}）、$p\Z$ は極大なので、$\Z/n\Z$ の素イデアルはすべて極大。\ref{ring:akizuki-hopkins.4} の後半からアルティン環である。（有限環なのでイデアルは有限個しかなく、降鎖が止まることは直接にもわかる。）
:::
