# 可換代数（Commutative Algebra）

可換環とイデアル、局所化、ネーター環、整域の分類と保存表、次元論、正則局所環・コーエン＝マコーレー環、ホモロジー的方法。

<p class="mn-msc">MSC2020: 13A, 13D, 13F, 13H</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-basics/index.html"><span class="mn-card-title">環の基礎</span><span class="mn-card-en">Basic Ring Theory</span><span class="mn-card-desc">環・イデアル・剰余環、準同型定理、素イデアルと極大イデアル、中国剰余定理、多項式環と冪級数環、局所化と商体、イデアルの演算法則と反例（雪江『代数学 2』第 1 章に対応）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="02-commutative-algebra/index.html"><span class="mn-card-title">可換環論</span><span class="mn-card-en">Commutative Algebra</span><span class="mn-card-desc">分数加群と局所的性質・中山の補題、ネーター環とアルティン環、整拡大と正規環、準素分解、ヒルベルトの零点定理、次数環とフィルトレーション、完備化、次元論とクルルの主イデアル定理、整閉包の有限性・クルル＝秋月の定理・正規性の判定、操作の可換性と反例、局所的な性質と局所的でない性質（松村『可換環論』、Zariski–Samuel を参考）。</span><span class="mn-card-count">13 ページ</span></a>
<a class="mn-card" href="03-homological-methods/index.html"><span class="mn-card-title">可換環論のホモロジー的方法</span><span class="mn-card-en">Homological Methods in Commutative Algebra</span><span class="mn-card-desc">Ext とコシュル複体による深さ、局所環上の極小自由分解とアウスランダー＝ブクスバウムの公式、セールの正則性判定法（正則 ⇔ 大域次元有限）、正則局所環は一意分解環（アウスランダー＝ブクスバウム）。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="04-integral-domains/index.html"><span class="mn-card-title">整域の分類と環の性質</span><span class="mn-card-en">Integral Domains &amp; Ring Properties</span><span class="mn-card-desc">体 ⊂ ユークリッド環 ⊂ PID ⊂ 一意分解環（UFD）⊂ … の分類、ガウスの補題、GCD 整域・ベズー整域・付値環・デデキント環・プリューファー整域、剰余・多項式環・冪級数環・直積・テンソル積・局所化での性質の保存表と反例集。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="05-regular-cm/index.html"><span class="mn-card-title">正則局所環とコーエン＝マコーレー環</span><span class="mn-card-en">Regular and Cohen-Macaulay Local Rings</span><span class="mn-card-desc">正則局所環と随伴次数環、正則列と深さ、コーエン＝マコーレー環と非混合性定理、ゴレンシュタイン環と完全交叉、操作（多項式環・完備化・剰余・忠実平坦降下）で保たれる性質（松村『可換環論』を参考）。</span><span class="mn-card-count">5 ページ</span></a>
</div>
