# 可換代数（Commutative Algebra）

可換環とイデアル、局所化とネーター環、整拡大と付値環、完備化と次元論、デデキント環と整域の分類（保存表・反例集）、正則局所環・コーエン＝マコーレー環、ホモロジー的方法。

<p class="mn-msc">MSC2020: 13A, 13D, 13F, 13H</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-basics/index.html"><span class="mn-card-title">環の基礎</span><span class="mn-card-en">Basic Ring Theory</span><span class="mn-card-desc">環・イデアル・剰余環、準同型定理、素イデアルと極大イデアル、中国剰余定理、多項式環と冪級数環、局所化と商体、イデアルの演算法則と反例（雪江『代数学 2』第 1 章に対応）。ユークリッド環・PID・一意分解環、ガウスの補題、GCD 整域とベズー整域。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="02-localization-noetherian/index.html"><span class="mn-card-title">局所化とネーター環</span><span class="mn-card-en">Localization and Noetherian Rings</span><span class="mn-card-desc">分数加群と局所的性質・中山の補題、ネーター環とアルティン環（ヒルベルトの基底定理・秋月＝ホプキンスの定理・長さ）、準素分解と随伴素イデアル（アティヤ＝マクドナルド 第 3・4・6〜8 章、松村『可換環論』を参考）。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="03-integral-valuation/index.html"><span class="mn-card-title">整拡大と付値環</span><span class="mn-card-en">Integral Extensions and Valuation Rings</span><span class="mn-card-desc">整拡大と正規環（上昇・下降・比較不能）、ヒルベルトの零点定理とネーターの正規化、付値環と離散付値環、整閉包の構造と有限性（トレース・ネーターの有限性定理）（アティヤ＝マクドナルド 第 5 章、松村『可換環論』を参考）。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="04-completion-dimension/index.html"><span class="mn-card-title">完備化と次元論</span><span class="mn-card-en">Completion and Dimension Theory</span><span class="mn-card-desc">次数環とフィルトレーション（アルティン＝リースの補題）、完備化とクルルの交叉定理、次元論（ヒルベルト＝サミュエル関数・巴系・三つの次元の一致）、クルルの単項イデアル定理と応用（アティヤ＝マクドナルド 第 10・11 章、松村『可換環論』を参考）。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="05-dedekind-domains/index.html"><span class="mn-card-title">デデキント環と整域の分類</span><span class="mn-card-en">Dedekind Domains and Classification of Domains</span><span class="mn-card-desc">デデキント環（分数イデアル・イデアル類群・素イデアル分解）、クルル＝秋月の定理と正規性の判定、プリューファー整域、整域の分類（体 ⊂ ユークリッド環 ⊂ PID ⊂ UFD ⊂ …）、剰余・多項式環・冪級数環・直積・テンソル積・局所化での性質の保存表と反例集、操作の可換性、局所的な性質と局所的でない性質（アティヤ＝マクドナルド 第 9 章、松村『可換環論』を参考）。PID・UFD・ガウスの補題・GCD 整域は環の基礎の系列にある。</span><span class="mn-card-count">8 ページ</span></a>
<a class="mn-card" href="06-regular-homological/index.html"><span class="mn-card-title">正則局所環とホモロジー的方法</span><span class="mn-card-en">Regular Local Rings and Homological Methods</span><span class="mn-card-desc">正則局所環と随伴次数環、正則列と深さ、コーエン＝マコーレー環と非混合性定理、コシュル複体と深さ、射影次元とアウスランダー＝ブクスバウムの公式、セールの正則性判定法（正則 ⇔ 大域次元有限）、正則局所環は一意分解環、ゴレンシュタイン環と完全交叉、操作（多項式環・完備化・剰余・忠実平坦降下）で保たれる性質（松村『可換環論』を参考）。</span><span class="mn-card-count">9 ページ</span></a>
</div>
