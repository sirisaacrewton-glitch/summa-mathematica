# デデキント環と整域の分類（Dedekind Domains and Classification of Domains）

デデキント環（分数イデアル・イデアル類群・素イデアル分解）、クルル＝秋月の定理と正規性の判定、プリューファー整域、整域の分類（体 ⊂ ユークリッド環 ⊂ PID ⊂ UFD ⊂ …）、剰余・多項式環・冪級数環・直積・テンソル積・局所化での性質の保存表と反例集、操作の可換性、局所的な性質と局所的でない性質（アティヤ＝マクドナルド 第 9 章、松村『可換環論』を参考）。PID・UFD・ガウスの補題・GCD 整域は環の基礎の系列にある。

<p class="mn-msc">MSC2020: 13F05, 13F15, 13G</p>
