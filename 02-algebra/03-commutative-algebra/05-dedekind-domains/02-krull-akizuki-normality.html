# クルル＝秋月の定理と正規性の判定 {#ring:page-krull-akizuki-normality keywords="Krull-Akizuki theorem, integral closure of a Dedekind domain in a finite extension is Dedekind, Noetherian normal domain is intersection of DVRs at height one primes, associated primes of principal ideals"}

$1$ \term[次元]{ring:krull-dimension}のネーター整域 $A$ と、その商体の有限次拡大 $L$ について、$A$ と $L$ の間の環はすべて $1$ 次元以下のネーター環である（**クルル＝秋月の定理**、\tref{ring:krull-akizuki}）。分離性を仮定しないので、デデキント環の任意の有限次拡大での整閉包がデデキント環になる（\ref{ring:dedekind-extension}）。後半では、高次元のネーター正規整域について、「単項イデアルの随伴素イデアルは高さ $1$ で、そこでの局所化は離散付値環」（\ref{ring:normal-principal-ass}）を示し、そこから $A=\bigcap_{\operatorname{ht}\mathfrak{p}=1}A_{\mathfrak{p}}$（\ref{ring:normal-intersection-dvr}）を導く。これは、深さを使って述べる正規性の判定法（$R_{1}$ と $S_{2}$）の土台になり、その判定法は深さを扱う系列（\see{ring:sec-cm-serre-normality}）で示す。

> 松村『可換環論』§11 の内容を参考にした。クルル＝秋月の定理は、ねじれのない加群の長さの等式（\ref{ring:length-torsion-free}）で、商体の拡大への帰着なしに直接示した。

## 記法と定義の確認 {#ring:sec-ka-notation}

::: notation
- 加群の長さと、短完全列で長さが足し算になることは \ref{ring:length}, \ref{ring:length-properties}、アルティン環と秋月＝ホプキンスの定理は \ref{ring:akizuki-hopkins}、随伴素イデアル・零因子・局所化は \ref{ring:associated-prime}, \ref{ring:zero-divisors-ass}, \ref{ring:ass-localization}、行列式のトリックは \ref{ring:determinant-trick}。
- 離散付値環の特徴付け、デデキント環とその局所的特徴付けは \ref{ring:dvr-characterization}, \ref{ring:dedekind}, \ref{ring:dedekind-local}。分母を払うことは \ref{ring:clearing-denominators}。
- 深さ（\see{ring:depth-ext}）はこのページでは使わない。問題の条件 $R_{1}$, $S_{2}$ は問題文の中で定義する。
- **選択公理**：秋月＝ホプキンスの定理・局所化・随伴素イデアルの理論を通して使う。
:::

## クルル＝秋月の定理 {#ring:sec-ka-theorem}

::: lemma ねじれのない加群の長さ {#ring:length-torsion-free keywords="for a one-dimensional Noetherian domain and a finitely generated torsion-free module M of rank r, length(M/aM) = r length(A/aA)" index="ねじれのない加群の長さ|ねじれのないかぐんのながさ"}
（AC）$A$ を $1$ \term[次元]{ring:krull-dimension}のネーター整域、$K=\Frac A$、$0\neq a\in A$ とする。
1. 有限生成のねじれ加群 $T$（各元が $0$ でない元に消される）は長さ有限。
2. 有限生成でねじれのない加群 $M$ の階数を $r=\dim_{K}(M\otimes_{A}K)$ とすると、$\ell(M/aM)=r\,\ell(A/aA)<\infty$。
:::

::: proof
**Step 1（1）.** 【主張：有限生成のねじれ加群 $T$ は長さ有限】 生成元それぞれを消す $0$ でない元の積を $c$ とおくと、$A$ は整域なので $c\neq 0$ で、$c$ は $T$ を消す。$A/cA$ の素イデアルは $c$ を含む $0$ でない $A$ の素イデアルに対応し、$\dim A=1$ からそれらは極大である。$A/cA$ はネーター環なので、\ref{ring:akizuki-hopkins.4} からアルティン環である。ゆえにその上の有限生成加群 $T$ はネーターかつアルティンであり、長さ有限である（\ref{ring:length-properties.2}）。

**Step 2（2：自由部分加群）.** 【主張：$A^{r}\cong F\subset M$ で $M/F$ がねじれ加群となるものがある】 $M\otimes_{A}K=S^{-1}M$（$S=A\setminus\{0\}$）は $m\otimes 1$（$m\in M$）で張られるので、その中から基底 $m_{1}\otimes1,\dots,m_{r}\otimes1$ がとれる。$M$ はねじれがないので $M\to M\otimes K$ は単射であり、$m_{i}$ は $A$ 上一次独立である。ゆえに $F\defeq\sum Am_{i}\cong A^{r}$ である。$m\in M$ について $m\otimes1=\sum\alpha_{i}m_{i}\otimes1$（$\alpha_{i}\in K$）と書き、分母の積を $c\neq0$ とおくと $cm\in F$ となる。ゆえに $T\defeq M/F$ は有限生成のねじれ加群であり、(1) から長さ有限である。

**Step 3（2：蛇の補題）.** 【主張：$\ell(M/aM)=\ell(F/aF)=r\,\ell(A/aA)$】 短完全列 $0\to F\to M\to T\to 0$ に $a$ 倍を施して蛇の補題を使う。$F,M$ はねじれがないので $a$ 倍は単射であり、完全列 $0\to T[a]\to F/aF\to M/aM\to T/aT\to 0$（$T[a]$ は $a$ 倍の核）を得る。$T$ は長さ有限なので、完全列 $0\to T[a]\to T\to aT\to 0$ と $0\to aT\to T\to T/aT\to 0$ から $\ell(T)=\ell(T[a])+\ell(aT)=\ell(aT)+\ell(T/aT)$ であり、$\ell(T[a])=\ell(T/aT)$ である。$A/aA$ は有限生成のねじれ加群なので (1) から $\ell(A/aA)<\infty$ であり、$\ell(F/aF)=r\,\ell(A/aA)<\infty$ である。4 項の完全列の長さの交代和は $0$ なので（\ref{ring:length-properties.3}）、$\ell(M/aM)=\ell(F/aF)-\ell(T[a])+\ell(T/aT)=r\,\ell(A/aA)$ である。
:::

::: theorem クルル＝秋月の定理 {#ring:krull-akizuki keywords="Krull-Akizuki: rings between a one-dimensional Noetherian domain and a finite extension of its fraction field are Noetherian of dimension at most one" index="クルル＝秋月の定理|くるるあきづきのていり" refname="クルル＝秋月の定理"}
（AC）$A$ を $1$ \term[次元]{ring:krull-dimension}のネーター整域、$K=\Frac A$、$L$ を $K$ の有限次拡大、$B$ を $A\subset B\subset L$ となる環とする。$B$ はネーター環で $\dim B\le 1$。さらに $B$ の $0$ でないイデアル $J$ について、$B/J$ は長さ有限の $A$ 加群。
:::

::: intuition
$1$ 次元のネーター整域から商体の有限次拡大までの間にある環は、整閉包に限らずどれもネーターで、次元は $1$ 以下にとどまる。分離性も有限性も仮定しない。
:::

::: proof
**Step 1（$B/aB$ の長さ）.** 【主張：$0\neq a\in A$ について $B/aB$ は長さ $n\,\ell(A/aA)$ 以下の $A$ 加群（$n=[L:K]$）】 $1$ を含む $B$ の有限生成 $A$ 部分加群 $N$ は、$L$ の中にあるのでねじれがなく、$N\otimes_{A}K$ は $L$ の $K$ 部分空間と同型なので階数は $n$ 以下である。ゆえに \ref{ring:length-torsion-free.2} から $\ell(N/aN)\le n\,\ell(A/aA)$ である。$B/aB$ の有限生成 $A$ 部分加群は、生成元の代表と $1$ で生成される $N$ の像 $(N+aB)/aB\cong N/(N\cap aB)$ であり、これは $N/aN$ の商なので長さは $n\,\ell(A/aA)$ 以下である。$B/aB$ の部分加群の真の鎖 $M_{0}\subsetneq\dots\subsetneq M_{t}$ があれば、各 $M_{i}\setminus M_{i-1}$ から元を選んで生成した有限生成部分加群 $N'$ の中で $N'\cap M_{i}$ も真の鎖になるので、$t\le n\,\ell(A/aA)$ である（\ref{ring:length-properties.1}）。ゆえに $B/aB$ は真の鎖の長さが有界であり、ネーターかつアルティン、すなわち長さ有限の $A$ 加群である（\ref{ring:length-properties.2}）。

**Step 2（ネーター）.** 【主張：$B$ の $0$ でないイデアル $J$ は $J\cap A\neq0$ をみたし、有限生成で、$B/J$ は長さ有限】 $0\neq b\in J$ をとる。$b$ の $K$ 上の最小多項式を $X^{m}+k_{1}X^{m-1}+\dots+k_{m}$ とおくと、既約で $b\neq 0$ なので $k_{m}\neq 0$ である。係数の共通分母 $d\in A$ を掛けると
$$
dk_{m}=-b(db^{m-1}+dk_{1}b^{m-2}+\dots+dk_{m-1})
$$
であり、括弧内は $B$ の元（$dk_{i}\in A$）なので、$a\defeq dk_{m}$ について $0\neq a\in J\cap A$ である。Step 1 から $J/aB\subset B/aB$ は有限生成 $A$ 加群なので、$J/aB$ の生成元の代表を $c_{j}$ とおくと $J=aB+\sum_{j}Bc_{j}$ は有限生成である。$0$ イデアルも有限生成なので $B$ はネーター環である。$B/J$ は $B/aB$ の商なので長さ有限である。

**Step 3（\term[次元]{ring:krull-dimension}）.** 【主張：$B$ の $0$ でない素イデアルは極大で、$\dim B\le 1$】 $Q$ を $B$ の $0$ でない素イデアルとする。Step 2 から $B/Q$ は長さ有限の $A$ 加群なので、その $B$ イデアル（$A$ 部分加群でもある）の降鎖は止まる。$0\neq x\in B/Q$ について $xB\supset x^{2}B\supset\cdots$ が止まるので $x^{t}=x^{t+1}y$（$y\in B/Q$）と書け、$B/Q$ は整域なので $xy=1$ である。ゆえに $B/Q$ は体であり、$Q$ は極大である。$B$ は整域なので、素イデアルの鎖は $0\subsetneq Q$ より長くならず、$\dim B\le 1$ である。

::: hypcheck
- **前提「$\dim A=1$」**：\ref{ring:length-torsion-free} の Step 1（$A/cA$ がアルティン）を通して Step 1 で使った。$2$ 次元では偽：$A=k[x,y]$ と $B\defeq k[x,\,y/x^{j}\ (j\ge1)]\subset k(x,y)$ について、$B=k[x]\oplus\bigoplus_{b\ge1}k[x,x^{-1}]y^{b}$ であり、イデアル $I=\bigoplus_{b\ge1}k[x,x^{-1}]y^{b}$ は有限生成でない。実際、生成元を有限個とると、その $y$ の $1$ 次の部分に現れる $x$ の指数はある $-N$ 以上で、$B\cdot f$ の $y$ の $1$ 次の部分は $k[x]$ 倍しか許さないので、$y/x^{N+1}\in I$ が生成されない。
- **前提「$L/K$ は有限次」**：Step 1 で階数を $n$ で抑えるのに使った。無限次では偽：$\Z$ の $\overline{\Q}$ における整閉包（代数的整数全体）では $(2)\subsetneq(2^{1/2})\subsetneq(2^{1/4})\subsetneq\cdots$ が止まらない（$2^{-1/2^{j}}$ の最小多項式 $X^{2^{j}}-\frac12$ は $\Z$ 係数でないので整でない。\ref{ring:minimal-polynomial-ideal}）。
- **前提「$B$ が整」**：使わない。$A\subset B\subset L$ でさえあればよい（整閉包に限らない）。
- **選択公理**：\ref{ring:akizuki-hopkins} を通して使う。
:::
:::

::: corollary デデキント環の拡大 {#ring:dedekind-extension keywords="the integral closure of a Dedekind domain in a finite extension of its fraction field is a Dedekind domain" index="デデキント環の拡大|でできんとかんのかくだい"}
（AC）デデキント環 $A$（体でない）の、商体の有限次拡大 $L$ における整閉包 $B$ はデデキント環である。
:::

::: proof
$A$ は体でないので $\dim A=1$ である。$B$ はクルル＝秋月の定理（\tref{ring:krull-akizuki}）からネーターで、$0$ でない素イデアルは極大である。$\Frac B=L$（\ref{ring:clearing-denominators}）であり、$B$ 上整な $L$ の元は \ref{ring:integral-closure.3} から $A$ 上整なので $B$ に属する。ゆえに $B$ は正規である。よって $B$ は \ref{ring:dedekind} の定義をみたす。
:::

## ネーター正規整域 {#ring:sec-ka-normal}

::: lemma 単項イデアルの随伴素イデアル {#ring:normal-principal-ass keywords="in a Noetherian normal domain, associated primes of a nonzero principal ideal have height one and the localization there is a DVR" index="単項イデアルの随伴素イデアル|たんこういであるのずいはんそいである"}
（AC）$A$ をネーター正規整域、$0\neq a\in A$、$\mathfrak{p}\in\operatorname{Ass}(A/aA)$ とする。$A_{\mathfrak{p}}$ は離散付値環で、$\operatorname{ht}\mathfrak{p}=1$。
:::

::: proof
**Step 1（局所化）.** 【主張：$\mathfrak{m}\defeq\mathfrak{p}A_{\mathfrak{p}}$ について、$y^{-1}\mathfrak{m}\subset A_{\mathfrak{p}}$, $y^{-1}\notin A_{\mathfrak{p}}$ となる $y\in K^{\times}$ がある】 $A_{\mathfrak{p}}$ も正規であり（\ref{ring:integral-localization.3}）、\ref{ring:ass-localization.1} から $\mathfrak{m}\in\operatorname{Ass}(A_{\mathfrak{p}}/aA_{\mathfrak{p}})$ である。よって $\mathfrak{m}b\subset aA_{\mathfrak{p}}$, $b\notin aA_{\mathfrak{p}}$ となる $b\in A_{\mathfrak{p}}$ がある。$b\neq0$ なので $y\defeq a/b\in K^{\times}$ とおくと、$y^{-1}\mathfrak{m}=(b/a)\mathfrak{m}\subset A_{\mathfrak{p}}$ は $A_{\mathfrak{p}}$ のイデアルであり、$y^{-1}=b/a\notin A_{\mathfrak{p}}$ である。

**Step 2（$y^{-1}\mathfrak{m}=A_{\mathfrak{p}}$）.** 【主張：$y^{-1}\mathfrak{m}=A_{\mathfrak{p}}$】 $y^{-1}\mathfrak{m}\subset\mathfrak{m}$ と仮定する。$\mathfrak{m}$ はネーター性から有限生成であり、$y^{-1}$ 倍で閉じるので $A_{\mathfrak{p}}[y^{-1}]$ 加群である。$a\in\mathfrak{m}$ なので $\mathfrak{m}\neq0$ であり、$K$ の $0$ でない元を掛けて $\mathfrak{m}$ が消えることはないので忠実である。ゆえに \ref{ring:integral-criterion.4} から $y^{-1}$ は $A_{\mathfrak{p}}$ 上整であり、正規性から $y^{-1}\in A_{\mathfrak{p}}$ となって Step 1 に矛盾する。よって $y^{-1}\mathfrak{m}$ は $\mathfrak{m}$ に含まれないイデアルであり、局所環 $A_{\mathfrak{p}}$ の極大イデアルが $\mathfrak{m}$ だけなので、$y^{-1}\mathfrak{m}=A_{\mathfrak{p}}$ である。

**Step 3（DVR）.** 【主張：$A_{\mathfrak{p}}$ は離散付値環で $\operatorname{ht}\mathfrak{p}=1$】 Step 2 から $\mathfrak{m}=yA_{\mathfrak{p}}$ は単項である。$A_{\mathfrak{p}}$ はネーター局所整域で、$0\neq a\in\mathfrak{m}$ なので体でない。ゆえに \ref{ring:dvr-characterization.4}⇒\ref[1]{ring:dvr-characterization.1} から離散付値環であり、$\operatorname{ht}\mathfrak{p}=\dim A_{\mathfrak{p}}=1$ である。
:::

::: theorem 高さ 1 の局所化の共通部分 {#ring:normal-intersection-dvr keywords="a Noetherian normal domain is the intersection of its localizations at height one primes, which are DVRs (Krull)" index="正規環と離散付値環|せいきかんとりさんふちかん"}
（AC）ネーター正規整域 $A$（体でない）について、高さ $1$ の素イデアル $\mathfrak{p}$ での局所化 $A_{\mathfrak{p}}$ は離散付値環で、$A=\bigcap_{\operatorname{ht}\mathfrak{p}=1}A_{\mathfrak{p}}$（$K$ の中で）。
:::

::: intuition
ネーター正規整域の元であるかどうかは、高さ $1$ の素イデアルごとに局所的に（離散付値で）調べれば分かる。分母が高さ $1$ のどこでも許されなければ、分母はいらない。
:::

::: proof
**Step 1（DVR）.** $\operatorname{ht}\mathfrak{p}=1$ なら $A_{\mathfrak{p}}$ は $1$ \term[次元]{ring:krull-dimension}のネーター局所整域で、\ref{ring:integral-localization.3} から正規なので、\ref{ring:dvr-characterization.5}⇒\ref[1]{ring:dvr-characterization.1} から離散付値環である。

**Step 2（共通部分）.** $A\subset A_{\mathfrak{p}}$ なので $\subset$ は成り立つ。逆に $x=b/a$（$a,b\in A$, $a\neq 0$）が右辺に属すると仮定し、$b\in aA$ を示す。$b\notin aA$ と仮定すると、$A/aA$ の元 $\bar b$ は $0$ でない。$\{\operatorname{Ann}(c\bar b): c\in A,\ c\bar b\neq0\}$ の中で $\operatorname{Ann}(\bar b)$ を含む極大元はネーター性から存在し、\ref{ring:ass-nonempty} から素イデアル $\mathfrak{p}=\operatorname{Ann}(c\bar b)\in\operatorname{Ass}(A/aA)$ である。$\operatorname{Ann}(\bar b)\subset\mathfrak{p}$ なので、$(A/aA)_{\mathfrak{p}}=A_{\mathfrak{p}}/aA_{\mathfrak{p}}$ で $\bar b/1\neq 0$、すなわち $b\notin aA_{\mathfrak{p}}$ である。一方 \ref{ring:normal-principal-ass} から $\operatorname{ht}\mathfrak{p}=1$ なので、仮定から $x\in A_{\mathfrak{p}}$ であり、$b=ax\in aA_{\mathfrak{p}}$ となって矛盾する。ゆえに $b\in aA$, $x\in A$ である。
:::

## 問題 {#ring:sec-ka-problems}

::: problem {#ring:prob-ka-not-normal-s2}
ネーター整域 $A$ について、条件 $R_{1}$：高さ $1$ の素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ は離散付値環、条件 $S_{2}$：$0$ でない $a\in A$ について $\operatorname{Ass}(A/aA)$ の元はすべて高さ $1$、を考える（ネーター正規整域は両方をみたす：\ref{ring:normal-intersection-dvr} の Step 1 と \ref{ring:normal-principal-ass}）。$A=k[t^{2},t^{3}]$ は $1$ \term[次元]{ring:krull-dimension}のネーター整域で $S_{2}$ をみたすが $R_{1}$ をみたさず、正規でないことを確かめよ。
:::

::: solution
$A$ は $k$ 上 $t^{n}$（$n\neq1$）で張られる。$t$ は $X^{2}-t^{2}\in A[X]$ の根なので $k[t]$ は $A$ 上整であり、$\dim A=\dim k[t]=1$ である（\ref{ring:integral-dimension}）。$A$ はネーター環 $k[x,y]$ の剰余環なのでネーターである。$0\neq a$ について $\operatorname{Ass}(A/aA)$ の元は $a$ を含むので $0$ でない素イデアルであり、$\dim A=1$ から高さ $1$ である。ゆえに $S_{2}$ は自動的にみたされる。$\mathfrak{p}=(t^{2},t^{3})$ は $0$ でない極大イデアル（$A/\mathfrak{p}\cong k$）なので高さ $1$ であり、$A_{\mathfrak{p}}$ の極大イデアル $\mathfrak{p}A_{\mathfrak{p}}$ は単項でない。実際、単項なら $\mathfrak{p}A_{\mathfrak{p}}/\mathfrak{p}^{2}A_{\mathfrak{p}}\cong\mathfrak{p}/\mathfrak{p}^{2}$（$\mathfrak{p}$ で消される加群なので局所化で変わらない）は $k$ 上 $1$ \term[次元]{lin:dimension}以下になるが、$\mathfrak{p}^{2}=(t^{4},t^{5},t^{6})$ は $t^{n}$（$n\ge4$）で張られるので、$\mathfrak{p}/\mathfrak{p}^{2}$ は $t^{2},t^{3}$ の像を基底とする $2$ 次元である。ゆえに $A_{\mathfrak{p}}$ は離散付値環でなく（\ref{ring:dvr-characterization.4}）、$R_{1}$ をみたさない。最後に、$t=t^{3}/t^{2}\in\Frac A$ は $A$ 上整だが $A$ に属さないので、$A$ は正規でない。
:::

::: supplement
**クルル整域.** 整域 $A$ が、商体の中の離散付値環の族 $\{A_{v}\}$ の共通部分 $A=\bigcap_{v}A_{v}$ であり、しかも $0$ でない元はどれも有限個を除くすべての $A_{v}$ で単元であるとき、$A$ を**クルル整域**という。単に離散付値環の共通部分であるだけでは足りない。ネーター正規整域はクルル整域である：\ref{ring:normal-intersection-dvr} の族 $\{A_{\mathfrak{p}}\}_{\operatorname{ht}\mathfrak{p}=1}$ について、$0\neq a\in A$ が $A_{\mathfrak{p}}$ で単元でないのは $a\in\mathfrak{p}$ のときで、そのような高さ $1$ の $\mathfrak{p}$ は $aA$ を含む素イデアルのうち極小なものなので、\ref{ring:ass-localization.2} から $\operatorname{Ass}(A/aA)$ に属し、有限個である（\ref{ring:prime-filtration.2}）。一意分解環もクルル整域の例である。クルル整域には因子類群が定義され、一意分解環であることは因子類群が自明であることと同値になることが知られている（このサイトではまだ扱っていない）。

**数論へ.** \ref{ring:dedekind-extension} から代数体の整数環はデデキント環であり、前のページの \ref{ring:integral-closure-finite.3}（$\Z$ は PID）から階数 $[L:\Q]$ の自由 $\Z$ 加群である。素イデアル分解と分岐はガロア理論（\see{fld:page-fundamental-theorem}）と組み合わせて数論の系列で扱う。
:::
