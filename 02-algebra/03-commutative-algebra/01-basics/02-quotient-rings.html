# 剰余環と準同型定理 {#ring:page-quotient-rings keywords="quotient ring, residue class ring, isomorphism theorems for rings, correspondence theorem, direct product of rings, idempotent, Chinese remainder theorem"}

群を正規部分群で割って剰余群を作ったように、環はイデアルで割って**剰余環**を作れる（\ref{ring:quotient-ring}）。このページでは、剰余環の構成と普遍性（\ref{ring:factor-through-quotient}）、\ref{ring:first-isomorphism}、\ref{ring:correspondence}を述べ、整数の剰余環 $\Z/n\Z$ を詳しく調べる。後半では環の直積と冪等元による分解（\ref{ring:idempotent-decomposition}）を扱い、**中国剰余定理**（\tref{ring:chinese-remainder}）を証明する。群論で示した剰余群・同型定理（\ref{grp:quotient-group}, \ref{grp:first-isomorphism}）を土台にし、乗法についての部分だけを新しく確かめる、という形で進める。

> 雪江明彦『代数学 2』第 1 章 §1.4, §1.6 の流れを参考にした。本が省いた、剰余環の乗法が矛盾なく定まることの検証や、対応定理の詳細はすべて書いた。冪等元による直積分解は本にない内容で、補った。

## 記法と定義の確認 {#ring:sec-qr-notation}

::: notation
- 環は可換とする（\ref{ring:convention}）。環・準同型・イデアル・イデアルの和と積は \ref{ring:page-rings-ideals} のもの（\ref{ring:ring}, \ref{ring:homomorphism}, \ref{ring:ideal}, \ref{ring:ideal-sum-product}）。
- 群論から次を使う：剰余群と自然な射影（\ref{grp:quotient-group}）、準同型の分解（\ref{grp:factor-through-quotient}）、準同型定理・第二・第三同型定理（\tref{grp:first-isomorphism}, \ref{grp:second-isomorphism}, \ref{grp:third-isomorphism}）、\ref{grp:correspondence}、整数の剰余群（\ref{grp:z-mod-nz-quotient}）、既約剰余類群とオイラー関数（\ref{grp:units-mod-n}）。可換群の部分群はすべて正規なので、イデアル $I$ による剰余群 $A/I$ が加法群として定まる。
- $a+I$ を $\bar a$ や $[a]$ とも書く。$a+I=b+I$ は $a-b\in I$ と同値であり（剰余類の性質）、このとき $a\equiv b\pmod{I}$ と書く。
- 選択公理は使わない。
:::

## 剰余環 {#ring:sec-qr-quotient}

::: theorem 剰余環 {#ring:quotient-ring keywords="quotient ring, factor ring, residue class ring, natural projection" index="剰余環|じょうよかん, 商環|しょうかん, 剰余類環|じょうよるいかん, 自然な射影|しぜんなしゃえい"}
$A$ を可換環、$I$ をイデアルとする。
1. 加法群 $A/I$ 上の乗法 $(a+I)(b+I)\defeq ab+I$ は、代表元 $a,b$ の取り方によらず矛盾なく定まる。
2. 剰余群の加法とこの乗法で、$A/I$ は可換環になる。零元は $0+I=I$、単位元は $1+I$。
3. $\pi(a)\defeq a+I$ で定まる $\pi:A\to A/I$ は全射な環準同型で、$\Ker\pi=I$。
4. $A/I$ が零環であることと $I=A$ は同値である。

この環 $A/I$ を $A$ の $I$ による**剰余環**、$\pi$ を**自然な射影**という。
:::

::: intuition
剰余環は「$I$ の元を $0$ とみなした環」である。$a\equiv a'$, $b\equiv b'\pmod I$ のとき $ab\equiv a'b'$ でなければ積が定まらないが、それを保証するのがイデアルの条件「何を掛けても $I$ から出ない」である。
:::

::: proof
**Step 1（1）.** $a+I=a'+I$, $b+I=b'+I$ とする。すなわち $a-a'\in I$, $b-b'\in I$。このとき
$$
ab-a'b'=a(b-b')+(a-a')b'
$$
で、$I$ はイデアルなので右辺の二つの項はどちらも $I$ に属し（$a(b-b')\in I$、$(a-a')b'=b'(a-a')\in I$）、和も $I$ に属する。よって $ab+I=a'b'+I$。

**Step 2（2）.** $(A/I,+)$ は可換群（\ref{grp:quotient-group}、加法的記法）。乗法の結合法則・可換性・分配法則・単位元の性質は、代表元で計算して $A$ の対応する法則に帰着する。例えば分配法則は
$$
\begin{aligned}
(a+I)\bigl((b+I)+(c+I)\bigr)&=a(b+c)+I=(ab+ac)+I\\
&=(a+I)(b+I)+(a+I)(c+I)
\end{aligned}
$$
であり、他も同様（$(a+I)(1+I)=a+I$ など）。

**Step 3（3）.** $\pi(a+b)=\pi(a)+\pi(b)$ は剰余群の演算の定義、$\pi(ab)=ab+I=\pi(a)\pi(b)$ は Step 1 の乗法の定義、$\pi(1)=1+I$。全射は明らか。$\pi(a)=0+I\iff a\in I$ なので $\Ker\pi=I$。

**Step 4（4）.** $A/I$ が零環 $\iff$ $1+I=0+I$（\ref{ring:ring-basic.3}）$\iff$ $1\in I$ $\iff$ $I=A$（\ref{ring:ideal-basic.3}）。

::: hypcheck
- **前提「$I$ はイデアル」**：Step 1 で $a(b-b')\in I$ と $b'(a-a')\in I$ に使った。部分群であるだけでは偽：$\Z\subset\Q$ は加法の部分群だが、$\frac{1}{2}\equiv\frac{3}{2}\pmod{\Z}$ なのに $\frac{1}{2}\cdot\frac{1}{2}=\frac{1}{4}$ と $\frac{3}{2}\cdot\frac{1}{2}=\frac{3}{4}$ は $\Z$ を法として合同でない。
- **前提「可換」**：Step 1 で $(a-a')b'=b'(a-a')$ と書き直すのに使った。非可換環では $I$ が両側イデアルなら同じ議論が通る。
:::
:::

::: theorem 剰余環の普遍性 {#ring:factor-through-quotient keywords="universal property of quotient ring, induced homomorphism, factorization through quotient" index="剰余環の普遍性|じょうよかんのふへんせい, 誘導された準同型|ゆうどうされたじゅんどうけい"}
$f:A\to B$ を環準同型、$I$ を $A$ のイデアル、$\pi:A\to A/I$ を自然な射影とする。$I\subset\Ker f$ なら、$f=\bar f\circ\pi$ となる環準同型 $\bar f:A/I\to B$ がただ一つあり、$\bar f(a+I)=f(a)$ で与えられる。さらに $\im\bar f=\im f$、$\Ker\bar f=\Ker f/I\defeq\{a+I : a\in\Ker f\}$。
:::

::: proof
**Step 1（加法群として）.** $f$ は加法群の準同型で $I\subset\Ker f$ なので、\ref{grp:factor-through-quotient} から $\bar f(a+I)=f(a)$ で矛盾なく定まる加法群の準同型 $\bar f$ で $f=\bar f\circ\pi$ をみたすものがただ一つあり、$\im\bar f=\im f$、$\Ker\bar f=\{a+I : a\in\Ker f\}$。

**Step 2（環準同型であること）.** $\bar f((a+I)(b+I))=\bar f(ab+I)=f(ab)=f(a)f(b)=\bar f(a+I)\bar f(b+I)$、$\bar f(1+I)=f(1)=1$。一意性は Step 1（加法群の準同型としてすでに一意）による。

::: hypcheck
- **前提 $I\subset\Ker f$**：Step 1 で $\bar f$ が矛盾なく定まることに使った（$a+I=a'+I$ なら $f(a)-f(a')=f(a-a')=0$）。外すと $\bar f$ は定まらない。
:::
:::

::: theorem 準同型定理 {#ring:first-isomorphism keywords="first isomorphism theorem for rings, A/Ker f ≅ Im f" index="準同型定理|じゅんどうけいていり, 第一同型定理|だいいちどうけいていり" refname="環の準同型定理"}
環準同型 $f:A\to B$ について、$a+\Ker f\mapsto f(a)$ は環の同型
$$
A/\Ker f\ \cong\ \im f
$$
である。特に $f$ が全射なら $A/\Ker f\cong B$。
:::

::: proof
\ref{ring:factor-through-quotient} を $I=\Ker f$ に適用すると、環準同型 $\bar f:A/\Ker f\to B$ で $\im\bar f=\im f$、$\Ker\bar f=\{a+\Ker f : a\in\Ker f\}=\{0+\Ker f\}$ をみたすものを得る。核が零なので $\bar f$ は単射（\ref{ring:homomorphism-basic.5}）。値域を $\im f$（部分環。\ref{ring:homomorphism-basic.3}）に制限すると全単射な準同型、すなわち同型。

::: hypcheck
- 前提は「$f$ が環準同型」だけ。$f(1)=1$ は $\im f$ が部分環になること（同型の行き先が環であること）に使っている。
:::
:::

::: example 準同型定理の使用例 {#ring:first-isomorphism-examples}
1. **評価写像.** 位相空間 $X$ と点 $x_{0}\in X$ について、$e(f)\defeq f(x_{0})$ で定まる $e:C(X)\to\R$ は全射な環準同型（定数関数 $c$ について $e(c)=c$）で、核は $\mathfrak{m}_{x_{0}}\defeq\{f : f(x_{0})=0\}$。よって $C(X)/\mathfrak{m}_{x_{0}}\cong\R$。
2. **ガウスの整数環の剰余環.** $\Z[i]/(2-i)\cong\Z/5\Z$ である。実際、$\Z[i]$ の元は $x+yi$（$x,y\in\Z$）とただ一通りに書けるので（$i\notin\R$）、$f(x+yi)\defeq(x+2y)+5\Z$ は矛盾なく定まる写像 $\Z[i]\to\Z/5\Z$ である。加法を保つのは明らか。積については
$$
(x+yi)(x'+y'i)=(xx'-yy')+(xy'+x'y)i
$$
の像が $(xx'-yy'+2xy'+2x'y)+5\Z$ で、$(x+2y)(x'+2y')=xx'+2xy'+2x'y+4yy'$ との差 $5yy'$ は $5\Z$ に属するので一致する。$f(1)=1+5\Z$。全射は $f(x)=x+5\Z$ から。核を求める：$2-i\in\Ker f$（$2+2(-1)=0$）なので $(2-i)\subset\Ker f$。逆に $x+yi\in\Ker f$ なら $x+2y=5k$ と書けて、$5=(2-i)(2+i)$ だから
$$
x+yi=(x+2y)-y(2-i)=(2-i)\bigl(k(2+i)-y\bigr)\in(2-i).
$$
よって $\Ker f=(2-i)$ で、準同型定理から主張を得る。（$i\mapsto 2$ という対応は、$\Z/5\Z$ で $2^{2}=-1$ となることから来ている。）
:::

## 整数の剰余環 {#ring:sec-qr-integers}

::: proposition 整数の剰余環 {#ring:z-mod-n-ring keywords="ring of integers modulo n, Z/nZ, units of Z/nZ, Z/pZ is a field" index="整数の剰余環|せいすうのじょうよかん, 有限体|ゆうげんたい"}
$n\ge 1$ とし、$\Z/n\Z$ を $\Z$ のイデアル $n\Z$ による剰余環とする。
1. $\Z/n\Z$ は $n$ 個の元 $0+n\Z,1+n\Z,\dots,(n-1)+n\Z$ からなり、その加法と乗法は、代表元 $\{0,\dots,n-1\}$ では「和・積を $n$ で割った余り」である。
2. $a+n\Z$ が単元であることと $\gcd(a,n)=1$ は同値である。したがって $(\Z/n\Z)^{\times}$ は \ref{grp:units-mod-n} の群と同型で、位数は $\varphi(n)$。
3. 次は同値である：(a) $\Z/n\Z$ は整域、(b) $\Z/n\Z$ は体、(c) $n$ は素数。

$p$ が素数のとき、体 $\Z/p\Z$ を $\mathbb{F}_{p}$ とも書く。
:::

::: proof
**Step 1（1）.** 加法群としての主張は \ref{grp:z-mod-nz-quotient} による（$a+n\Z\mapsto r_{n}(a)$ が群同型）。乗法については、$a+n\Z=r_{n}(a)+n\Z$ なので $(a+n\Z)(b+n\Z)=ab+n\Z=r_{n}(ab)+n\Z$。

**Step 2（2、⇒）.** $a+n\Z$ が単元なら $ab\equiv 1\pmod{n}$、すなわち $ab-1=nk$ となる $b,k\in\Z$ がある。$d=\gcd(a,n)$ は $a$ と $n$ を割るので $1=ab-nk$ を割り、$d=1$。

**Step 3（2、⇐）.** $\gcd(a,n)=1$ ならベズーの等式（\ref{grp:bezout-euclid.1}）から $ax+ny=1$ となる $x,y$ があり、$(a+n\Z)(x+n\Z)=1+n\Z$。群 $(\Z/n\Z)^{\times}$ と \ref{grp:units-mod-n} の群は、Step 1 の対応 $a+n\Z\mapsto r_{n}(a)$ で同型（$\gcd(a,n)=\gcd(r_{n}(a),n)$ であり、積は余りの積の余り）。

**Step 4（3）.** (b)⇒(a) は \ref{ring:domain-field.2}。(a)⇒(c)：$\Z/n\Z$ が整域なら $1\neq 0$ なので $n\ge 2$。$n=ab$, $1<a,b<n$ と書けたとすると $(a+n\Z)(b+n\Z)=0$ だが、$0<a,b<n$ なので $a,b\notin n\Z$ となり、整域であることに反する。よって $n$ は素数。(c)⇒(b)：$n=p$ が素数なら、$p\nmid a$ なる $a$ について $\gcd(a,p)=1$（$\gcd(a,p)$ は $p$ の正の約数で $1$ か $p$、$p\nmid a$ なので $1$）。2 から $a+p\Z$ は単元。$p\ge 2$ なので $1\neq 0$。よって体。

::: hypcheck
- **(a)⇒(c) での $1<a,b<n$**：$n$ が合成数であることの言い換えで、$n=1$ の場合は零環なので別に扱った。
- (a)⇔(b) は $\Z/n\Z$ が有限であることから \ref{ring:domain-field.3} でも得られる。ここでは $\gcd$ を使って直接示した。
:::
:::

::: proposition 素部分環 {#ring:prime-subring keywords="prime subring, image of Z, prime field" index="素部分環|そぶぶんかん, 素体|そたい"}
環 $A$ の標数を $n$ とすると、\ref{ring:z-initial} の準同型 $\iota:\Z\to A$ の像は $\Z/n\Z$ に同型な部分環である（$n=0$ のときは $\Z/0\Z=\Z$ と読む）。この像は $A$ の最小の部分環であり、**素部分環**という。特に、標数 $p$（素数）の環は $\mathbb{F}_{p}$ に同型な部分環を含み、標数 $0$ の環は $\Z$ に同型な部分環を含む。
:::

::: proof
**Step 1.** 標数の定義（\ref{ring:characteristic}）から $\Ker\iota=n\Z$。\ref{ring:first-isomorphism}から $\Z/n\Z\cong\im\iota$ で、$\im\iota$ は部分環（\ref{ring:homomorphism-basic.3}）。$n=0$ なら $\iota$ は単射で $\Z\cong\im\iota$。

**Step 2（最小性）.** 部分環 $B$ は $1$ を含み、加法と減法で閉じているので、すべての $n\cdot 1$（$n\in\Z$）を含む。よって $\im\iota\subset B$。

::: hypcheck
- 標数が素数のとき、素部分環は体 $\mathbb{F}_{p}$ である（\ref{ring:z-mod-n-ring.3}）。標数 $0$ の**体**は、さらに $\Q$ に同型な部分体を含む（商体の普遍性による。\ref{ring:fraction-field} で扱う）。
:::
:::

## 対応定理と同型定理 {#ring:sec-qr-correspondence}

::: theorem イデアルの対応定理 {#ring:correspondence keywords="correspondence theorem for ideals, ideals of a quotient ring" index="対応定理|たいおうていり, 剰余環のイデアル|じょうよかんのいである" refname="イデアルの対応定理"}
$A$ を可換環、$I$ をイデアル、$\pi:A\to A/I$ を自然な射影とする。
1. $J\mapsto\pi(J)=J/I$ と $\bar J\mapsto\pi^{-1}(\bar J)$ は、「$I$ を含む $A$ のイデアル全体」と「$A/I$ のイデアル全体」の間の、互いに逆な全単射である。
2. この対応は包含関係を保つ：$J\subset J'\iff J/I\subset J'/I$。
3. $I\subset J$ なら、$(a+I)+J/I\mapsto a+J$ は環の同型
$$
(A/I)\big/(J/I)\ \cong\ A/J
$$
である（**第三同型定理**）。
:::

::: proof
**Step 1（行き先がイデアルであること）.** $\pi$ は全射な準同型なので、$A$ のイデアル $J$ の像 $\pi(J)$ は $A/I$ のイデアル（\ref{ring:ideal-image-preimage.2}）。$A/I$ のイデアル $\bar J$ の逆像 $\pi^{-1}(\bar J)$ は $A$ のイデアルで、$\Ker\pi=I$ を含む（\ref{ring:ideal-image-preimage.1}）。

**Step 2（互いに逆であること・包含）.** イデアルは特に加法群の部分群であり、上の二つの写像は加法群の対応定理（\tref{grp:correspondence.1}・\ref[2]{grp:correspondence.2}、加法的記法）の写像の制限である。そこでの写像が互いに逆で包含を保つので、Step 1 と合わせて 1・2 が成り立つ。

**Step 3（3）.** 合成 $A\to A/I\to(A/I)/(J/I)$ は全射な準同型で、その核は $\pi^{-1}(J/I)=J$（Step 2）。\ref{ring:first-isomorphism}から $A/J\cong(A/I)/(J/I)$ で、同型は $a+J\mapsto(a+I)+J/I$。その逆写像が主張の写像である。

::: hypcheck
- **前提「$J\supset I$」**：Step 2 で $\pi^{-1}(\pi(J))=J$ が成り立つのに必要。一般には $\pi^{-1}(\pi(J))=J+I$。
:::
:::

::: example
$\Z/n\Z$（$n\ge 1$）のイデアルは、$n$ の正の約数 $d$ に対する $d\Z/n\Z$ ですべてであり、互いに異なる。実際、対応定理から $n\Z$ を含む $\Z$ のイデアル $d\Z$（\ref{ring:ideals-of-z}、$d\ge 0$）と一対一に対応し、$n\Z\subset d\Z\iff d\mid n$ である（$n\neq 0$ なので $d\neq 0$）。例えば $\Z/12\Z$ のイデアルは $d=1,2,3,4,6,12$ に対応する 6 個である。
:::

::: theorem 第二同型定理 {#ring:second-isomorphism keywords="second isomorphism theorem for rings" index="第二同型定理|だいにどうけいていり" refname="環の第二同型定理"}
$A$ を可換環、$B$ を部分環、$I$ をイデアルとする。$B+I\defeq\{b+a : b\in B, a\in I\}$ は $A$ の部分環で $I$ をイデアルとして含み、$B\cap I$ は $B$ のイデアルであり、$b+(B\cap I)\mapsto b+I$ は環の同型
$$
B/(B\cap I)\ \cong\ (B+I)/I
$$
である。
:::

::: proof
**Step 1（$B+I$ は部分環）.** $1=1+0\in B+I$。$(b+a)-(b'+a')=(b-b')+(a-a')\in B+I$。積は
$$
(b+a)(b'+a')=bb'+(ba'+ab'+aa')
$$
で、$bb'\in B$、括弧の中は $I$ に属する（$I$ はイデアル）。\ref{ring:subring-basic.1} から部分環。$I\subset B+I$ で、$B+I$ の元を掛けても $I$ から出ないので、$I$ は $B+I$ のイデアル。

**Step 2（同型）.** $\psi:B\to(B+I)/I$, $b\mapsto b+I$ は、包含 $B\to B+I$ と自然な射影の合成なので準同型。全射：$(b+a)+I=b+I=\psi(b)$。核は $\{b\in B : b\in I\}=B\cap I$ で、核なので $B$ のイデアル（\ref{ring:ideal-basic.1}）。準同型定理から主張を得る。

::: hypcheck
- **前提「$I$ はイデアル」**：Step 1 で積の括弧の中が $I$ に属することに使った。$I$ を部分環に変えると $B+I$ は一般に積で閉じない。
:::
:::

## 直積と冪等元 {#ring:sec-qr-products}

::: definition 環の直積 {#ring:product-ring keywords="direct product of rings, product ring, projection" index="直積環|ちょくせきかん, 環の直積|かんのちょくせき"}
環の族 $(A_{\lambda})_{\lambda\in\Lambda}$ について、直積集合 $\prod_{\lambda}A_{\lambda}$ に成分ごとの和と積
$$
(a_{\lambda})_{\lambda}+(b_{\lambda})_{\lambda}\defeq(a_{\lambda}+b_{\lambda})_{\lambda},\quad(a_{\lambda})_{\lambda}(b_{\lambda})_{\lambda}\defeq(a_{\lambda}b_{\lambda})_{\lambda}
$$
を入れたものは環になり（各成分で環の公理が成り立つから）、単位元は $(1)_{\lambda}$ である。これを**直積環**という。射影 $p_{\mu}:\prod_{\lambda}A_{\lambda}\to A_{\mu}$, $(a_{\lambda})\mapsto a_{\mu}$ は全射な準同型である。有限個のときは $A_{1}\times\dots\times A_{n}$ と書く。
:::

::: proposition 直積の普遍性と単元群 {#ring:product-universal keywords="universal property of product ring, units of a product" index="直積環の普遍性|ちょくせきかんのふへんせい"}
1. 環 $B$ と準同型の族 $f_{\lambda}:B\to A_{\lambda}$ について、$p_{\lambda}\circ f=f_{\lambda}$（すべての $\lambda$）をみたす準同型 $f:B\to\prod_{\lambda}A_{\lambda}$ がただ一つあり、$f(b)=(f_{\lambda}(b))_{\lambda}$ で与えられる。
2. $\bigl(\prod_{\lambda}A_{\lambda}\bigr)^{\times}=\prod_{\lambda}A_{\lambda}^{\times}$。
3. $A_{1},A_{2}$ がともに零環でなければ、$A_{1}\times A_{2}$ は整域でない。
:::

::: proof
**Step 1（1）.** $p_{\lambda}\circ f=f_{\lambda}$ は $f(b)$ の $\lambda$ 成分が $f_{\lambda}(b)$ であることを意味するので、$f$ は一意で、上の式で与えられる。それが準同型であることは、各成分で $f_{\lambda}$ が和・積・$1$ を保つことから。

**Step 2（2）.** $(a_{\lambda})(b_{\lambda})=(1)$ は各 $\lambda$ で $a_{\lambda}b_{\lambda}=1$ と同値（可換なので両側の条件は一つ）。

**Step 3（3）.** $(1,0)(0,1)=(0,0)$ で、$1\neq 0$ が各成分で成り立つので $(1,0)\neq 0$, $(0,1)\neq 0$。
:::

::: definition 冪等元 {#ring:idempotent keywords="idempotent element, trivial idempotents, complementary idempotents" index="冪等元|べきとうげん"}
環 $A$ の元 $e$ が $e^{2}=e$ をみたすとき**冪等元**という。$0,1$ は冪等元（**自明な冪等元**）。$e$ が冪等元なら $1-e$ も冪等元である：$(1-e)^{2}=1-2e+e^{2}=1-e$。
:::

::: theorem 冪等元による直積分解 {#ring:idempotent-decomposition keywords="decomposition of a ring by an idempotent, A ≅ eA × (1-e)A, connected ring" index="冪等元による分解|べきとうげんによるぶんかい"}
$A$ を可換環、$e$ を冪等元とする。$eA$ は加法と乗法について閉じていて、$e$ を単位元として環になり、写像
$$
\phi:A\to eA\times(1-e)A,\quad a\mapsto(ea,(1-e)a)
$$
は環の同型である。逆に $A\cong A_{1}\times A_{2}$ なら、$e$ に対応する元 $(1,0)$ は冪等元である。したがって、$A$ が二つの零環でない環の直積に同型であることと、$A$ が自明でない冪等元（$0,1$ 以外）をもつことは同値である。
:::

::: proof
**Step 1（$eA$ は環）.** $ea+eb=e(a+b)$, $(ea)(eb)=e^{2}ab=e(ab)$ なので加法・乗法で閉じ、$-ea=e(-a)$、$0=e0$ も含む。$e\cdot ea=e^{2}a=ea$ なので $e$ は $eA$ の単位元。環の他の公理は $A$ から受け継ぐ。（$eA$ は $A$ の**部分環ではない**：単位元が $1$ でなく $e$ だから。）$1-e$ も冪等元なので $(1-e)A$ も環。

**Step 2（$\phi$ は準同型）.** 和は明らか。積：$e(ab)=e^{2}ab=(ea)(eb)$、$(1-e)$ についても同様。$\phi(1)=(e,1-e)$ はそれぞれの環の単位元。

**Step 3（全単射）.** 単射：$\phi(a)=0$ なら $a=ea+(1-e)a=0$。全射：$(ex,(1-e)y)$ が与えられたら $a=ex+(1-e)y$ とおくと、$e(1-e)=e-e^{2}=0$ なので $ea=e^{2}x+e(1-e)y=ex$、同様に $(1-e)a=(1-e)y$。

**Step 4（逆と同値性）.** $(1,0)^{2}=(1,0)$。$A_{1},A_{2}$ が零環でなければ $(1,0)\neq(0,0),(1,1)$ なので自明でない冪等元。逆に $e\neq 0,1$ なら、$eA$ は $e\neq 0$ を含むので零環でなく、$(1-e)A$ も $1-e\neq 0$ を含むので零環でない。

::: hypcheck
- **前提「可換」**：Step 2 で $e(ab)=(ea)(eb)$（$e$ と $a$ を入れ替える）に使った。非可換環では、$e$ が中心に属する冪等元（中心的冪等元）なら同じ議論が通る。
:::
:::

::: example
1. $\Z/6\Z$ では $3^{2}=9\equiv 3$ なので $e=3+6\Z$ は自明でない冪等元で、$eA=\{0,3\}\cong\Z/2\Z$、$(1-e)A=4A=\{0,2,4\}\cong\Z/3\Z$。よって $\Z/6\Z\cong\Z/2\Z\times\Z/3\Z$（中国剰余定理の特別な場合）。
2. 整域の冪等元は $0,1$ だけ：$e(e-1)=0$ から $e=0$ または $e=1$。したがって整域は二つの零環でない環の直積に分解しない。
3. $C(X)$ の冪等元は、値が $0$ と $1$ だけの連続関数、すなわち閉かつ開な部分集合の特性関数である。$X$ が連結なら自明な冪等元しかない。冪等元による分解は、空間を閉かつ開な二つの部分に分けることに対応する。
:::

## 中国剰余定理 {#ring:sec-qr-crt}

::: lemma 互いに素なイデアルの積 {#ring:coprime-product-lemma keywords="coprime to each factor implies coprime to product" index="互いに素なイデアル|たがいにそないである"}
可換環 $A$ のイデアル $I,J_{1},\dots,J_{m}$ について、各 $k$ で $I+J_{k}=A$ なら $I+J_{1}\cdots J_{m}=A$ かつ $I+(J_{1}\cap\dots\cap J_{m})=A$。
:::

::: proof
**Step 1.** 各 $k$ で $1=a_{k}+b_{k}$（$a_{k}\in I$, $b_{k}\in J_{k}$）と書く。積をとると
$$
1=\prod_{k=1}^{m}(a_{k}+b_{k})=b_{1}b_{2}\cdots b_{m}+c
$$
で、$c$ は展開したときに少なくとも一つの $a_{k}$ を因子にもつ項の和なので $c\in I$。$b_{1}\cdots b_{m}\in J_{1}\cdots J_{m}$。よって $1\in I+J_{1}\cdots J_{m}$ で、これはイデアルなので $A$ に等しい（\ref{ring:ideal-basic.3}）。

**Step 2.** $J_{1}\cdots J_{m}\subset J_{1}\cap\dots\cap J_{m}$（\ref{ring:ideal-operations.1} を繰り返し使う）なので、Step 1 から $A=I+J_{1}\cdots J_{m}\subset I+(J_{1}\cap\dots\cap J_{m})$。
:::

::: theorem 中国剰余定理 {#ring:chinese-remainder keywords="Chinese remainder theorem" index="中国剰余定理|ちゅうごくじょうよていり" refname="環の中国剰余定理"}
可換環 $A$ のイデアル $I_{1},\dots,I_{n}$（$n\ge 1$）が**どの二つも互いに素**（$j\neq k$ なら $I_{j}+I_{k}=A$）なら、
1. $I_{1}\cap\dots\cap I_{n}=I_{1}I_{2}\cdots I_{n}$。
2. $a+(I_{1}\cap\dots\cap I_{n})\mapsto(a+I_{1},\dots,a+I_{n})$ は環の同型
$$
A/(I_{1}\cap\dots\cap I_{n})\ \cong\ A/I_{1}\times\dots\times A/I_{n}
$$
である。
:::

::: intuition
「$x\equiv a_{k}\pmod{I_{k}}$（$k=1,\dots,n$）という連立合同式は、法がどの二つも互いに素なら必ず解をもち、解は $I_{1}\cap\dots\cap I_{n}$ を法としてただ一つ」という主張である。整数の場合は古くから知られていて、名前はこの問題を扱った中国の古い算術書に由来するとされる。
:::

::: proof
**Step 1（1）.** $n$ の帰納法。$n=1$ は自明。$n\ge 2$ で $n-1$ まで成り立つとする。$J\defeq I_{1}\cap\dots\cap I_{n-1}$ とおくと、帰納法の仮定から $J=I_{1}\cdots I_{n-1}$。\ref{ring:coprime-product-lemma} を $I=I_{n}$, $J_{k}=I_{k}$（$k<n$）に使うと $I_{n}+J=A$。\ref{ring:ideal-operations.3} から $J\cap I_{n}=JI_{n}=I_{1}\cdots I_{n}$。

**Step 2（準同型と核）.** 自然な射影 $\pi_{k}:A\to A/I_{k}$ から、直積の普遍性（\ref{ring:product-universal.1}）で準同型 $f:A\to\prod_{k}A/I_{k}$, $f(a)=(a+I_{1},\dots,a+I_{n})$ を得る。$f(a)=0\iff$ 各 $k$ で $a\in I_{k}$ なので $\Ker f=I_{1}\cap\dots\cap I_{n}$。

**Step 3（全射）.** 各 $k$ について、$I_{k}+\bigcap_{j\neq k}I_{j}=A$（\ref{ring:coprime-product-lemma}。$n=1$ のときは空の共通部分を $A$ と読み、自明）なので、$1=u_{k}+e_{k}$（$u_{k}\in I_{k}$, $e_{k}\in\bigcap_{j\neq k}I_{j}$）と書ける。すると
$$
e_{k}\equiv 1\pmod{I_{k}},\qquad e_{k}\equiv 0\pmod{I_{j}}\ (j\neq k).
$$
任意の $(a_{1}+I_{1},\dots,a_{n}+I_{n})$ に対し $a\defeq\sum_{k}a_{k}e_{k}$ とおくと、各 $j$ で $a\equiv a_{j}e_{j}\equiv a_{j}\pmod{I_{j}}$。よって $f(a)$ は与えられた元で、$f$ は全射。

**Step 4（2）.** \ref{ring:first-isomorphism}と Step 2・3 から。

::: hypcheck
- **前提「どの二つも互いに素」**：Step 1 と Step 3 で \ref{ring:coprime-product-lemma} を使うのに必要。外すと 1・2 とも偽：$\Z$ で $I_{1}=I_{2}=(2)$ なら $I_{1}\cap I_{2}=(2)\neq(4)=I_{1}I_{2}$ で、$\Z/(2)$ は 2 元、$\Z/(2)\times\Z/(2)$ は 4 元なので同型でない。また $I_{1}=(2)$, $I_{2}=(4)$ なら $f$ は全射でない（$(1,0)$ は像に入らない：$a\equiv 1\pmod 2$ と $a\equiv 0\pmod 4$ は両立しない）。
- **「どの二つも」と「全体として」の違い**：$I_{1}+I_{2}+I_{3}=A$ だけでは足りない：$\Z$ で $(2),(2),(3)$ は全体の和が $\Z$ だが、最初の二つは互いに素でない。
:::
:::

::: corollary 整数の中国剰余定理とオイラー関数の乗法性 {#ring:crt-integers keywords="Chinese remainder theorem for integers, multiplicativity of Euler's totient" index="オイラー関数の乗法性|おいらーかんすうのじょうほうせい"}
$m_{1},\dots,m_{n}\ge 1$ がどの二つも互いに素なら、$m=m_{1}\cdots m_{n}$ について
$$
\Z/m\Z\ \cong\ \Z/m_{1}\Z\times\dots\times\Z/m_{n}\Z
$$
であり、$\varphi(m)=\varphi(m_{1})\cdots\varphi(m_{n})$。さらに $m=p_{1}^{e_{1}}\cdots p_{r}^{e_{r}}$（$p_{k}$ は相異なる素数、$e_{k}\ge 1$）なら $\varphi(m)=\prod_{k}p_{k}^{e_{k}-1}(p_{k}-1)$。
:::

::: proof
**Step 1.** $\gcd(m_{j},m_{k})=1$ なので $(m_{j})+(m_{k})=(1)=\Z$（\ref{ring:ideal-operations.4}）。中国剰余定理から $\Z/(m_{1})\cap\dots\cap(m_{n})\cong\prod\Z/m_{k}\Z$ で、$(m_{1})\cap\dots\cap(m_{n})=(m_{1})\cdots(m_{n})=(m)$（同定理の 1 と \ref{ring:ideal-operations.4}）。

**Step 2.** 同型は単元群を単元群に移し（\ref{ring:homomorphism-basic.4} を同型とその逆に使う）、直積の単元群は単元群の直積（\ref{ring:product-universal.2}）なので、位数を比べて $\varphi(m)=\prod\varphi(m_{k})$（\ref{ring:z-mod-n-ring.2}）。

**Step 3.** 素数冪 $p^{e}$ について、$\{0,\dots,p^{e}-1\}$ のうち $p^{e}$ と互いに素でないのは $p$ の倍数 $p^{e-1}$ 個なので $\varphi(p^{e})=p^{e}-p^{e-1}=p^{e-1}(p-1)$。異なる素数の冪はどの二つも互いに素なので、Step 2 から公式を得る。
:::

::: supplement
**高い視点.** 剰余環の普遍性（\ref{ring:factor-through-quotient}）は、$A/I$ を「$I$ を $0$ に送る準同型の中で最も普遍的なもの」として特徴付ける。圏論の言葉では、$\pi:A\to A/I$ は二つの準同型の**余等化子**（\ref{cat:coequalizer}）である：$I$ の元を変数とする多項式環（\ref{ring:page-polynomial-rings}）から $A$ への、変数 $x_{a}$ を $a$ に送る射と $0$ に送る射の余等化子が $A/I$ になる。直積の普遍性（\ref{ring:product-universal.1}）は、直積環が環の圏での**積**（\ref{cat:product}）であることを言っている。

中国剰余定理は、代数幾何の言葉では「互いに交わらない閉集合の和集合上の関数は、各部分の関数を勝手に選んで組み合わせられる」ことにあたる。冪等元による分解が空間の閉かつ開な分割に対応すること（上の $C(X)$ の例）と合わせて、\ref{ring:page-prime-maximal} 以降で導入する素スペクトルの考え方の入口になる。
:::

## 問題 {#ring:sec-qr-problems}

::: problem {#ring:prob-finite-ring-unit-or-zero-divisor}
有限な可換環の元は、単元であるか零因子であるかのどちらかである（両方ではない）ことを示せ。特に $\Z/n\Z$ の元は、$\gcd(a,n)=1$ なら単元、そうでなければ零因子である。
:::

::: solution
**Step 1.** $a$ が零因子でなければ、$ax=ay\Rightarrow a(x-y)=0\Rightarrow x=y$ なので $x\mapsto ax$ は単射。有限集合なので全射で、$ax=1$ となる $x$ がある。よって単元。

**Step 2.** 単元 $u$ が零因子なら $ub=0$, $b\neq 0$ だが、$b=u^{-1}ub=0$ で矛盾。

**Step 3.** $\Z/n\Z$ では \ref{ring:z-mod-n-ring.2} から単元は $\gcd(a,n)=1$ のもの。（直接にも、$d=\gcd(a,n)>1$ なら $a\cdot(n/d)=(a/d)n\equiv 0$ で $n/d\not\equiv 0$。）
:::

::: problem {#ring:prob-gaussian-mod-3}
$\Z[i]/(3)$ は 9 個の元からなる体であることを示せ。
:::

::: solution
**Step 1（元の個数）.** $(3)=\{3(u+vi)\}=\{3u+3vi : u,v\in\Z\}$ で、$x+yi$ の表し方は一意なので、$x+yi\in(3)\iff 3\mid x$ かつ $3\mid y$。よって $x+yi\equiv x'+y'i\pmod{(3)}\iff x\equiv x'$, $y\equiv y'\pmod 3$ で、剰余類は $a+bi$（$a,b\in\{0,1,2\}$）の 9 個。

**Step 2（体であること）.** $a+bi\notin(3)$ とする。整数の平方は $3$ を法として $0$ か $1$ で、$0$ になるのは $3$ で割り切れるときだけなので、$N\defeq a^{2}+b^{2}\not\equiv 0\pmod 3$、したがって $N\equiv\pm1$ で $N^{2}\equiv 1\pmod 3$。$(a+bi)(a-bi)N=N^{2}\equiv 1\pmod{(3)}$（$N^{2}-1\in 3\Z\subset(3)$）なので、$a+bi$ の剰余類は単元で逆元は $(a-bi)N$ の剰余類。$1\notin(3)$ なので零環でもない。
:::

::: problem {#ring:prob-crt-solve}
連立合同式 $x\equiv 2\pmod 3$, $x\equiv 3\pmod 5$, $x\equiv 2\pmod 7$ の解を、中国剰余定理の証明の $e_{k}$ を作って求めよ。
:::

::: solution
$m=105$。$e_{1}$ は $35$ の倍数で $\equiv 1\pmod 3$：$35\equiv 2$ なので $e_{1}=70$（$70\equiv 1\pmod 3$）。$e_{2}$ は $21$ の倍数で $\equiv 1\pmod 5$：$21\equiv 1$ なので $e_{2}=21$。$e_{3}$ は $15$ の倍数で $\equiv 1\pmod 7$：$15\equiv 1$ なので $e_{3}=15$。よって $x\equiv 2\cdot 70+3\cdot 21+2\cdot 15=140+63+30=233\equiv 23\pmod{105}$。検算：$23=7\cdot 3+2$, $23=4\cdot 5+3$, $23=3\cdot 7+2$。
:::

::: problem {#ring:prob-idempotents-z-mod-n}
$n=p_{1}^{e_{1}}\cdots p_{r}^{e_{r}}$（相異なる素数）のとき、$\Z/n\Z$ の冪等元はちょうど $2^{r}$ 個であることを示せ。
:::

::: solution
**Step 1.** 中国剰余定理（\ref{ring:crt-integers}）から $\Z/n\Z\cong\prod_{k}\Z/p_{k}^{e_{k}}\Z$。直積の元が冪等元であることは各成分が冪等元であることと同値なので、各 $\Z/p^{e}\Z$ の冪等元が $0,1$ だけであることを示せばよい。

**Step 2.** $e^{2}\equiv e\pmod{p^{e'}}$（指数を $e'$ と書く）とすると $p^{e'}\mid e(e-1)$。$e$ と $e-1$ は互いに素なので $p$ はどちらか一方だけを割り、その一方が $p^{e'}$ で割り切れる（ユークリッドの補題 \ref{grp:bezout-euclid.4} を繰り返し使う）。よって $e\equiv 0$ または $e\equiv 1$。

**Step 3.** 各成分 2 通りなので全体で $2^{r}$ 個。
:::
