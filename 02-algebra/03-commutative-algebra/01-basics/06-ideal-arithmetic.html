# イデアルの演算法則と反例 {#ring:page-ideal-arithmetic keywords="ideal arithmetic, distributive law for ideals, modular law, ideal quotient, colon ideal, extension and contraction of ideals, radical of a sum"}

イデアルには和・共通部分・積・根基・商イデアル、さらに環準同型による拡大と縮約という演算がある。これらは整数の gcd・lcm・積・割り算のように振る舞うことが多いが、一般の可換環ではいくつかの「分配法則」が成り立たない。このページでは次の順に、成り立つ法則をすべて証明し、成り立たない法則には具体的な反例を与える。
1. 和・共通部分・積（イデアル全体の「束」としての法則）。
2. 根基。
3. 商イデアル $(I:J)$（イデアルの「割り算」）。
4. 商イデアルと準同型：$(I:J)$ は $\Hom$ として現れ、整域では分数イデアルの自己準同型環が商体の中の商イデアルとして計算できる。これは整閉性（\ref{ring:colon-integral}）や可逆イデアル（\ref{ring:invertible-properties}）につながる。
5. 環準同型による拡大と縮約。

反例はすべて体 $k$ 上の 2 変数多項式環 $k[x,y]$ の中で作れるので、そのための計算を最初にまとめる。和・積・共通部分の定義と基本性質は \ref{ring:ideal-operations}、根基の性質は \ref{ring:radical-properties} で示した。

## 記法と定義の確認 {#ring:sec-ia-notation}

::: notation
- 環は単位元をもつ可換環。$A$ のイデアルの和 $I+J$、積 $IJ$、共通部分 $I\cap J$ は \ref{ring:ideal-sum-product}、基本性質（$IJ\subset I\cap J$、$I(J+K)=IJ+IK$、$I+J=A\Rightarrow I\cap J=IJ$）は \ref{ring:ideal-operations}。
- 根基 $\sqrt{I}$ は \ref{ring:radical-ideal}、その性質（$\sqrt{IJ}=\sqrt{I\cap J}=\sqrt{I}\cap\sqrt{J}$ など）は \ref{ring:radical-properties}。
- 環準同型 $f:A\to B$ について、$A$ のイデアル $I$ の**拡大** $I^{e}\defeq f(I)B$、$B$ のイデアル $J$ の**縮約** $J^{c}\defeq f^{-1}(J)$（\ref{ring:extension-contraction}）。
- $k$ は体、$\mathfrak{m}\defeq(x,y)\subset k[x,y]$。
- 整域 $A$ の商体 $K=\Frac A$ は \ref{ring:fraction-field}。
- **選択公理**：使わない。
:::

## 反例のための準備 {#ring:sec-ia-preliminaries}

::: lemma 素元で生成されたイデアルとの共通部分 {#ring:principal-prime-intersection keywords="intersection of principal ideals when one generator is prime" index="単項イデアルの共通部分|たんこういであるのきょうつうぶぶん"}
$A$ を可換環、$f,g\in A$ とし、$(g)$ は素イデアルで $f\notin(g)$ とする。このとき $(f)\cap(g)=(fg)$。
:::

::: proof
$\supset$：$fg$ は $(f)$ にも $(g)$ にも属する。$\subset$：$h\in(f)\cap(g)$ を $h=fu$ と書く。$fu\in(g)$ で $(g)$ は素、$f\notin(g)$ なので $u\in(g)$、$u=gv$ と書けて $h=fgv\in(fg)$。
:::

::: lemma 2 変数多項式環のいくつかの素イデアル {#ring:kxy-primes keywords="prime ideals (x), (y), (x+y), (y-x^2) of k[x,y]" index="多項式環の素イデアル|たこうしきかんのそいである"}
$A=k[x,y]$ で、$(x)$, $(y)$, $(x+y)$, $(y-x^{2})$ はどれも素イデアルである。また $x\notin(y)$, $x\notin(x+y)$, $y\notin(x)$, $y\notin(x+y)$。$\mathfrak{m}^{2}=(x^{2},xy,y^{2})$ の元は、どの単項式も全次数 $2$ 以上である。
:::

::: proof
**Step 1（剰余環）.** $h(x)\in k[x]$ について、$A=(k[x])[y]$ の中で $y-h(x)$ は $y$ についてモニックなので、$F\in A$ を割り算して $F=(y-h(x))Q+R$（$R\in k[x]$）と書ける（\ref{ring:polynomial-division}）。代入準同型 $\sigma_{h}:A\to k[x]$, $y\mapsto h(x)$（$x\mapsto x$。\ref{ring:polynomial-universal}）は全射で、$\sigma_{h}(F)=R$ なので $\Ker\sigma_{h}=(y-h(x))$。\ref{ring:first-isomorphism}から $A/(y-h(x))\cong k[x]$ は整域で、$(y-h(x))$ は素イデアル（\ref{ring:prime-maximal-quotient}）。$h=0$, $-x$, $x^{2}$ として $(y)$, $(x+y)$, $(y-x^{2})$ が素。$x$ と $y$ の役割を入れ替えて $(x)$ も素。

**Step 2（含まれないこと）.** $\sigma_{0}(x)=x\neq 0$ なので $x\notin(y)$。$\sigma_{-x}(x)=x\neq0$ なので $x\notin(x+y)$。$\sigma_{-x}(y)=-x\neq 0$ なので $y\notin(x+y)$。$y\notin(x)$ は対称。

**Step 3（次数）.** $\mathfrak{m}^{2}$ の元は $x^{2}u+xyv+y^{2}w$（$u,v,w\in A$）の形で、各項の単項式は全次数 $2$ 以上。
:::

## 和・共通部分・積 {#ring:sec-ia-lattice}

::: proposition 和と共通部分の法則 {#ring:ideal-lattice-laws keywords="lattice of ideals, absorption law, modular law, distributive inequalities" index="モジュラー律|もじゅらーりつ, イデアルの束|いであるのそく"}
$A$ のイデアル $I,J,K$ について次が成り立つ。
1. （束）$+$ と $\cap$ はどちらも結合的・可換・冪等で、吸収律 $I\cap(I+J)=I$、$I+(I\cap J)=I$ が成り立つ。
2. （モジュラー律）$J\subset I$ なら $I\cap(J+K)=J+(I\cap K)$。
3. （分配の不等式）$I\cap J+I\cap K\subset I\cap(J+K)$、$I+(J\cap K)\subset(I+J)\cap(I+K)$。
4. （積）$I(J\cap K)\subset IJ\cap IK$、$(I+J)(I\cap J)\subset IJ\subset I\cap J$。
:::

::: proof
**Step 1（1）.** 結合・可換・冪等は、$\cap$ については集合の共通部分の性質、$+$ については $A$ の加法の結合・可換性と $I+I=I$（$\supset$ は $a=a+0$、$\subset$ は $I$ が加法で閉じていること）から。吸収律：$I\subset I+J$ なので $I\cap(I+J)=I$。$I\cap J\subset I$ なので $I+(I\cap J)\subset I+I=I$、逆に $I=I+0\subset I+(I\cap J)$。

**Step 2（2）.** $\supset$：$J\subset I$ と $J\subset J+K$ から $J\subset I\cap(J+K)$。$I\cap K\subset I\cap(J+K)$。右辺の元は二つの元の和で、$I\cap(J+K)$ はイデアルなので含まれる。$\subset$：$a\in I\cap(J+K)$ を $a=b+c$（$b\in J$, $c\in K$）と書く。$b\in J\subset I$ なので $c=a-b\in I$。よって $c\in I\cap K$ で、$a=b+c\in J+(I\cap K)$。**前提 $J\subset I$ はこの $c\in I$ に使った。**

**Step 3（3）.** $I\cap J\subset I\cap(J+K)$ と $I\cap K\subset I\cap(J+K)$ から和も含まれる。$J\cap K\subset J$ から $I+(J\cap K)\subset I+J$、同様に $\subset I+K$。

**Step 4（4）.** $I(J\cap K)$ の生成元 $ab$（$a\in I$, $b\in J\cap K$）は $IJ$ と $IK$ の生成元なので、$I(J\cap K)\subset IJ\cap IK$。次に \ref{ring:ideal-operations.2}（と積の可換性）から
$$
(I+J)(I\cap J)=I(I\cap J)+J(I\cap J)\subset IJ+JI=IJ
$$
（$I\cap J\subset J$ と $I\cap J\subset I$ を使った）。$IJ\subset I\cap J$ は \ref{ring:ideal-operations.1}。
:::

::: remark 二つの分配法則は同値
3 の二つの包含がともに等号になるとき、イデアルの束は**分配的**であるという。一般の束で、全ての $I,J,K$ についての $I\cap(J+K)=I\cap J+I\cap K$（D1）と、全ての $I,J,K$ についての $I+(J\cap K)=(I+J)\cap(I+K)$（D2）は同値である。D1 を仮定すると、1 の法則だけを使って
$$
\begin{aligned}
(I+J)\cap(I+K)&=\bigl((I+J)\cap I\bigr)+\bigl((I+J)\cap K\bigr)&&(\text{D1、}\cap\text{ の可換性})\\
&=I+\bigl(K\cap I+K\cap J\bigr)&&(\text{吸収律、D1})\\
&=\bigl(I+(I\cap K)\bigr)+(J\cap K)&&(\text{結合・可換})\\
&=I+(J\cap K)&&(\text{吸収律})
\end{aligned}
$$
となる。D2 から D1 も、$+$ と $\cap$ の役割を入れ替えた同じ計算で示せる。
:::

::: example 分配法則が成り立たない例 {#ring:ideal-nondistributive keywords="ideals do not satisfy the distributive law, counterexample in k[x,y]" index="分配法則（イデアル）|ぶんぱいほうそく"}
$A=k[x,y]$、$I=(x)$, $J=(y)$, $K=(x+y)$ とする（三本の直線 $x=0$, $y=0$, $x+y=0$）。
1. $I\cap(J+K)\neq I\cap J+I\cap K$：$J+K=(y,x+y)=(x,y)=\mathfrak{m}$ なので $I\cap(J+K)=(x)\cap\mathfrak{m}=(x)$。一方 \ref{ring:principal-prime-intersection} と \ref{ring:kxy-primes} から $I\cap J=(xy)$, $I\cap K=(x(x+y))$ で、$I\cap J+I\cap K\subset\mathfrak{m}^{2}$。$x$ は全次数 $1$ なので $x\notin\mathfrak{m}^{2}$。よって $x\in I\cap(J+K)$ だが $x\notin I\cap J+I\cap K$。
2. $I+(J\cap K)\neq(I+J)\cap(I+K)$：$J\cap K=(y(x+y))$ なので $I+(J\cap K)=(x,\,xy+y^{2})=(x,y^{2})$（$xy+y^{2}-y\cdot x=y^{2}$）。$I+J=I+K=\mathfrak{m}$ なので右辺は $\mathfrak{m}\ni y$。$y\notin(x,y^{2})$：$x\mapsto 0$ の代入 $A\to k[y]$ で $(x,y^{2})$ は $(y^{2})$ に移るが、$y\notin(y^{2})$（$0$ でない $y^{2}$ の倍元は次数 $2$ 以上）。
3. $I(J\cap K)\neq IJ\cap IK$：$I'=\mathfrak{m}$, $J'=(x)$, $K'=(y)$ とすると $I'(J'\cap K')=\mathfrak{m}\cdot(xy)=(x^{2}y,xy^{2})$ の元は全次数 $3$ 以上だが、$xy=y\cdot x\in I'J'$ かつ $xy=x\cdot y\in I'K'$。
4. $(I+J)(I\cap J)\neq IJ$：$(I+J)(I\cap J)=\mathfrak{m}\cdot(xy)$ は 3 と同じで $xy$ を含まないが、$IJ=(xy)$。
:::

::: intuition
幾何的には、$I\cap J$ は二つの図形の和集合、$I+J$ は交わりに対応する。三本の直線は原点で交わり、「$I$ と（$J$ と $K$ の交わり）」は直線 $x=0$ 全体を含むのに、「($I$ と $J$ の交わり）と（$I$ と $K$ の交わり）」の和は原点に重なりをもつ図形の情報（$\mathfrak{m}^{2}$）にしか届かない。$\Z$ では $(m)\cap(n)=(\operatorname{lcm})$, $(m)+(n)=(\gcd)$ で、gcd と lcm は素因数ごとの指数の $\min$ と $\max$ なので分配法則が成り立つ（問題 \ref{ring:prob-z-distributive}）。
:::

::: supplement
**分配的なのはどんな環か.** 整域のイデアルの束が分配的であることは、プリューファー整域であることと同値である（\ref{ring:prufer-distributive}）。デデキント環・PID・付値環はその例で、$k[x,y]$ は上の反例によってプリューファーでないとわかる。
:::

## 根基 {#ring:sec-ia-radical}

::: example 根基は和と交換しない {#ring:radical-sum-counterexample keywords="radical of a sum is not the sum of radicals, radical does not commute with infinite intersections" index="根基と和|こんきとわ"}
1. $A=k[x,y]$、$I=(y)$, $J=(y-x^{2})$（直線と、それに接する放物線）。\ref{ring:kxy-primes} からどちらも素イデアル、したがって根基イデアル（\ref{ring:radical-properties.4}）。$I+J=(y,x^{2})$ で、$x^{2}\in I+J$ なので $x\in\sqrt{I+J}$。一方 $\sqrt{I}+\sqrt{J}=I+J=(y,x^{2})$ は $x$ を含まない（$y\mapsto 0$ の代入で $(x^{2})\subset k[x]$ に移り、$x\notin(x^{2})$）。よって $\sqrt{I+J}\neq\sqrt{I}+\sqrt{J}$。成り立つのは $\sqrt{I+J}=\sqrt{\sqrt{I}+\sqrt{J}}$（\ref{ring:radical-properties.3}）までである。
2. 根基は有限個の共通部分とは交換する（\ref{ring:radical-properties.3}）が、無限個とは交換しない：$k[x]$ で $\bigcap_{n\ge1}(x^{n})=0$（$0\neq f$ の次数を $d$ とすると $f\notin(x^{d+1})$）なので $\sqrt{\bigcap_{n}(x^{n})}=\sqrt{0}=0$（整域）。一方 $\sqrt{(x^{n})}=(x)$（$(x)$ は素で $(x^{n})\subset(x)$、$x^{n}\in(x^{n})$）なので $\bigcap_{n}\sqrt{(x^{n})}=(x)$。
:::

::: intuition
1 は「接する二曲線の交わりは、点としては原点 $\sqrt{I+J}=\mathfrak{m}$ だが、方程式 $I+J$ は重複度 $2$ を覚えている」ことを表す。根基をとると重複度の情報が消える。
:::

## 商イデアル {#ring:sec-ia-colon}

::: definition 商イデアル {#ring:colon-ideal keywords="ideal quotient, colon ideal, (I:J), annihilator" index="商イデアル|しょういである, イデアル商|いであるしょう"}
$A$ のイデアル $I,J$ について
$$
(I:J)\defeq\{a\in A : aJ\subset I\}
$$
を**商イデアル**という。$a\in A$ について $(I:a)\defeq(I:(a))$。$(0:J)$ は $J$ の零化イデアル $\operatorname{Ann}J$ である。
:::

::: proposition 商イデアルの法則 {#ring:colon-laws keywords="properties of ideal quotients" index="商イデアルの性質|しょういであるのせいしつ"}
$A$ のイデアル $I,J,K$ とイデアルの族 $(I_{\lambda})$, $(J_{\lambda})$ について次が成り立つ。
1. $(I:J)$ はイデアルで、$I\subset(I:J)$、$(I:J)J\subset I$。$(I:J)=A\iff J\subset I$。$(I:J)$ は $I$ について単調増加、$J$ について単調減少。
2. $((I:J):K)=(I:JK)=((I:K):J)$。
3. $\bigl(\bigcap_{\lambda}I_{\lambda}:J\bigr)=\bigcap_{\lambda}(I_{\lambda}:J)$。特に $((I\cap J):K)=(I:K)\cap(J:K)$。
4. $\bigl(I:\sum_{\lambda}J_{\lambda}\bigr)=\bigcap_{\lambda}(I:J_{\lambda})$。
5. $(I:(J\cap K))\supset(I:J)+(I:K)$、$((I+J):K)\supset(I:K)+(J:K)$。
:::

::: proof
**Step 1（1）.** $a,b\in(I:J)$, $r\in A$, $j\in J$ について $(a+b)j=aj+bj\in I$, $(ra)j=r(aj)\in I$、$0\cdot j=0\in I$ なのでイデアル。$a\in I$ なら $aj\in I$ なので $I\subset(I:J)$。$(I:J)J$ の生成元 $aj$ は $I$ に属する。$1\in(I:J)\iff J\subset I$ で、イデアルが $A$ であることは $1$ を含むことと同値。単調性は定義から（$I\subset I'$ なら $aJ\subset I\Rightarrow aJ\subset I'$、$J'\subset J$ なら $aJ\subset I\Rightarrow aJ'\subset I$）。

**Step 2（2）.** $a\in((I:J):K)\iff$ すべての $c\in K$ で $ac\in(I:J)\iff$ すべての $b\in J$, $c\in K$ で $abc\in I$。$aJK$ の元は $a\sum b_{l}c_{l}=\sum a b_{l}c_{l}$ の形なので、最後の条件は $aJK\subset I$、すなわち $a\in(I:JK)$ と同値。$JK=KJ$ なので $((I:K):J)$ も同じ。

**Step 3（3）.** $aJ\subset\bigcap I_{\lambda}\iff$ すべての $\lambda$ で $aJ\subset I_{\lambda}$。

**Step 4（4）.** $\sum J_{\lambda}$ の元は有限和 $\sum b_{\lambda}$（$b_{\lambda}\in J_{\lambda}$）。$a\sum J_{\lambda}\subset I$ なら各 $aJ_{\lambda}\subset I$。逆に各 $aJ_{\lambda}\subset I$ なら $a\sum b_{\lambda}=\sum ab_{\lambda}\in I$。

**Step 5（5）.** $J\cap K\subset J$ と 1 の単調性から $(I:J)\subset(I:(J\cap K))$、同様に $(I:K)\subset(I:(J\cap K))$ で、和も含まれる。後半も $I\subset I+J$, $J\subset I+J$ と単調性から。
:::

::: example 商イデアルの包含が真になる例 {#ring:colon-counterexamples keywords="ideal quotient does not distribute over intersection in the second variable or over sums in the first" index="商イデアルの反例|しょういであるのはんれい"}
$A=k[x,y]$ とする。
1. $(I:(J\cap K))\neq(I:J)+(I:K)$：$I=(xy)$, $J=(x)$, $K=(y)$ とすると $J\cap K=(xy)$（\ref{ring:principal-prime-intersection}）なので $(I:(J\cap K))=A$（1）。一方 $(I:J)=(y)$：$ax\in(xy)$ なら $ax=xyb$ で、整域なので $x$ を簡約して $a=yb$。同様に $(I:K)=(x)$。和は $\mathfrak{m}\neq A$。
2. $((I+J):K)\neq(I:K)+(J:K)$：$I=(x)$, $J=(y)$, $K=(x+y)$ とすると $I+J=\mathfrak{m}\ni x+y$ なので $((I+J):K)=A$。一方 $((x):(x+y))=(x)$：$a(x+y)\in(x)$ で $(x)$ は素、$x+y\notin(x)$（\ref{ring:kxy-primes}。$y\notin(x)$ と同じ代入 $x\mapsto 0$ で $x+y\mapsto y\neq 0$）なので $a\in(x)$。同様に $((y):(x+y))=(y)$。和は $\mathfrak{m}\neq A$。
:::

::: remark 演算の向き
1・3・4 は、$(I:-)$ が「和を共通部分に」移し、$(-:J)$ が「共通部分を共通部分に」移すことを表す。2 は「$JK$ で割ることは、$J$ で割ってから $K$ で割ること」を表す。次の節で見るように商イデアルは $\Hom$ として現れ（\ref{ring:colon-hom}）、2 はテンソルと $\Hom$ の随伴（\ref{ha:tensor-hom-adjunction}）の類似とみることができる（解釈であり、同型そのものではない）。
:::

## 商イデアルと準同型 {#ring:sec-ia-colon-hom}

商イデアル $(I:J)$ は「$J$ を $I$ の中に移す掛け算」全体である。これを準同型の言葉で言い直すと、剰余環の間の $\Hom$ や、整域ではイデアルの自己準同型環が、商イデアルとして具体的に計算できる。

::: proposition 商イデアルと Hom {#ring:colon-hom keywords="(I:J)/I is Hom(A/J, A/I), annihilator as Hom" index="商イデアルと準同型|しょういであるとじゅんどうけい"}
$A$ のイデアル $I,J$ について、
$$
\Phi:(I:J)\to\Hom_{A}(A/J,A/I),\quad a\mapsto\bigl(\bar r\mapsto\overline{ar}\bigr)
$$
は全射な $A$ 線形写像で、核は $I$。したがって $(I:J)/I\cong\Hom_{A}(A/J,A/I)$。特に $I=0$ として $(0:J)=\operatorname{Ann}J\cong\Hom_{A}(A/J,A)$。
:::

::: proof
**Step 1（定義できること）.** $a\in(I:J)$ と $r-r'\in J$ について $ar-ar'=a(r-r')\in aJ\subset I$ なので、$\bar r\mapsto\overline{ar}$ は $A/J$ 上で定義でき、$A$ 線形。$a\mapsto\Phi(a)$ も $A$ 線形。

**Step 2（全射）.** $\varphi\in\Hom_{A}(A/J,A/I)$ について $\varphi(\bar1)=\bar a$（$a\in A$）とおくと、$\varphi(\bar r)=r\varphi(\bar1)=\overline{ar}$。$r\in J$ なら $\bar r=0$ なので $\overline{ar}=0$、すなわち $aJ\subset I$。よって $a\in(I:J)$ で $\Phi(a)=\varphi$。

**Step 3（核）.** $\Phi(a)=0\iff\overline{a\cdot1}=0\iff a\in I$。
:::

::: definition 商体の中の商イデアル {#ring:colon-fraction keywords="colon of submodules of the fraction field, (N:_K M)" index="商体の中の商イデアル|しょうたいのなかのしょういである"}
$A$ を整域、$K=\Frac A$ とし、$M,N\subset K$ を $A$ 部分加群とする。
$$
(N:_{K}M)\defeq\{x\in K : xM\subset N\}
$$
とおく。これは $A$ 部分加群で、$A$ のイデアル $I,J$ については $(I:J)=(I:_{K}J)\cap A$。
:::

::: theorem 分数イデアルの準同型は掛け算 {#ring:hom-fractional keywords="Hom between submodules of the fraction field is given by multiplication, End(I) = (I:I)" index="イデアルの自己準同型環|いであるのじこじゅんどうけいかん"}
$A$ を整域、$K=\Frac A$、$M,N\subset K$ を $A$ 部分加群で $M\neq0$ とする。
1. $\mu:(N:_{K}M)\to\Hom_{A}(M,N)$, $x\mapsto(m\mapsto xm)$ は $A$ 加群の同型である。
2. 特に $\End_{A}(M)\cong(M:_{K}M)$ は環の同型で、$(M:_{K}M)$ は $A$ を含む $K$ の部分環。とくに $\End_{A}(M)$ は可換環である。
3. $M\cong N$（$A$ 加群として）であることと、$N=xM$ となる $x\in K^{\times}$ があることは同値。
:::

::: proof
**Step 1（単射）.** $xm=0$ がすべての $m\in M$ で成り立てば、$0\neq m_{0}\in M$ をとって $x=0$（$K$ は体）。

**Step 2（全射：比が一定）.** $\varphi\in\Hom_{A}(M,N)$ をとる。$0$ でない $m,m'\in M$ について、$m/m'\in K$ を $c'/c$（$c,c'\in A\setminus\{0\}$）と書くと $cm=c'm'$。$A$ 線形性から $c\varphi(m)=\varphi(cm)=\varphi(c'm')=c'\varphi(m')$ なので
$$
\frac{\varphi(m)}{m}=\frac{c'\varphi(m')}{cm}=\frac{c'\varphi(m')}{c'm'}=\frac{\varphi(m')}{m'}.
$$
この共通の値を $x$ とすると、すべての $m\in M$ で $\varphi(m)=xm$（$m=0$ でも成り立つ）。$xM=\varphi(M)\subset N$ なので $x\in(N:_{K}M)$ で、$\mu(x)=\varphi$。

**Step 3（2）.** $N=M$ のとき $\mu(xy)=\mu(x)\circ\mu(y)$、$\mu(1)=\id$ なので環の同型。$(M:_{K}M)$ は掛け算で閉じ、$1$ と $A$ を含む（$AM\subset M$）。

**Step 4（3）.** 同型 $\varphi:M\to N$ は 1 から $x$ 倍で、$x\neq0$（単射なので）。$N=\varphi(M)=xM$。逆に $N=xM$ なら $x$ 倍は同型（逆は $x^{-1}$ 倍）。

::: hypcheck
- **前提「整域」**：Step 1 で $K$ が体であることを、Step 2 で比 $m/m'$ をとることを使った。整域でない環では、イデアルを商体の中に置くこと自体ができない。
- **前提「$M\neq0$」**：Step 1。$M=0$ なら左辺は $K$、右辺は $0$。
:::
:::

::: example 自己準同型環の計算
1. $A=\Z$, $K=\Q$：$0$ でないイデアル $(n)$ について $((n):_{\Q}(n))=\Z$（$xn\in n\Z\iff x\in\Z$）。よって $\End_{\Z}(n\Z)\cong\Z$。
2. $A=k[t^{2},t^{3}]\subset k[t]$（尖点の座標環）、$K=k(t)$、$\mathfrak{n}=(t^{2},t^{3})A$。$A$ の元は $t$ の係数が $0$ の多項式なので、$\mathfrak{n}=t^{2}k[t]$（次数 $2$ 以上の項だけの多項式）。$x\in(\mathfrak{n}:_{K}\mathfrak{n})$ なら $f\defeq xt^{2}\in\mathfrak{n}\subset t^{2}k[t]$ なので $x=f/t^{2}\in k[t]$。逆に $k[t]\cdot t^{2}k[t]\subset t^{2}k[t]$。よって
$$
\End_{A}(\mathfrak{n})\cong(\mathfrak{n}:_{K}\mathfrak{n})=k[t]\supsetneq A.
$$
極大イデアルの自己準同型環が $A$ より真に大きく、$A$ の正規化 $k[t]$ になっている。
3. $A$ のイデアル $I$ について、$\Hom_{A}(I,A)\cong(A:_{K}I)$。$I$ が可逆なら、これは逆イデアル $I^{-1}$ である。
:::

::: supplement
**正規性との関係.** 2 の例は偶然ではない：$I$ が有限生成なら $(I:_{K}I)$ の元は $A$ 上整で（行列式のトリック）、$A$ が正規であることは「$0$ でない有限生成イデアル $I$ について常に $\End_{A}(I)=A$」と同値である（\ref{ring:colon-integral}）。

**可逆イデアルと類群.** 3 から、$I$ が可逆なら $\End_{A}(I)=(I:_{K}I)=A$（$(I:I)=(I:I)II^{-1}\subset II^{-1}=A$）、双対は $\Hom_{A}(I,A)=I^{-1}$（\ref{ring:invertible-properties}）。また定理の 3 から、加群として同型なイデアルの類は「$K^{\times}$ 倍で移り合う」類と一致し、デデキント環ではこれがイデアル類群（\ref{ring:class-group}）の元である。
:::

## 拡大と縮約 {#ring:sec-ia-extension-contraction}

::: proposition 拡大と縮約の法則 {#ring:extension-contraction-laws keywords="extension and contraction of ideals: compatibility with sums, products, intersections, radicals, quotients" index="拡大と縮約の法則|かくだいとしゅくやくのほうそく"}
$f:A\to B$ を環準同型、$I,I_{1},I_{2}$ を $A$ のイデアル、$J,J_{1},J_{2}$ を $B$ のイデアルとする。
1. $I\subset I^{ec}$、$J^{ce}\subset J$、$I^{e}=I^{ece}$、$J^{c}=J^{cec}$。拡大と縮約は包含を保つ。
2. （拡大）$(I_{1}+I_{2})^{e}=I_{1}^{e}+I_{2}^{e}$、$(I_{1}I_{2})^{e}=I_{1}^{e}I_{2}^{e}$、$(I_{1}\cap I_{2})^{e}\subset I_{1}^{e}\cap I_{2}^{e}$、$(\sqrt{I})^{e}\subset\sqrt{I^{e}}$、$(I_{1}:I_{2})^{e}\subset(I_{1}^{e}:I_{2}^{e})$。
3. （縮約）$(J_{1}\cap J_{2})^{c}=J_{1}^{c}\cap J_{2}^{c}$、$\sqrt{J}^{\,c}=\sqrt{J^{c}}$、$(J_{1}+J_{2})^{c}\supset J_{1}^{c}+J_{2}^{c}$、$(J_{1}J_{2})^{c}\supset J_{1}^{c}J_{2}^{c}$、$(J_{1}:J_{2})^{c}\subset(J_{1}^{c}:J_{2}^{c})$。
:::

::: proof
**Step 1（1）.** $a\in I$ なら $f(a)\in f(I)\subset I^{e}$ なので $a\in I^{ec}$。$J^{ce}$ は $f(f^{-1}(J))\subset J$ で生成されるので $J^{ce}\subset J$。包含を保つことは定義から。$I\subset I^{ec}$ に拡大をとって $I^{e}\subset I^{ece}$、$J^{ce}\subset J$ を $J=I^{e}$ に使って $I^{ece}\subset I^{e}$。同様に $J^{c}\subset J^{cec}$（前半を $I=J^{c}$ に）と $J^{cec}=(J^{ce})^{c}\subset J^{c}$。

**Step 2（2 の和と積）.** $(I_{1}+I_{2})^{e}$ の生成元 $f(a_{1}+a_{2})=f(a_{1})+f(a_{2})$ は $I_{1}^{e}+I_{2}^{e}$ に属し、逆に $I_{i}^{e}\subset(I_{1}+I_{2})^{e}$（単調性）から和も含まれる。積：$(I_{1}I_{2})^{e}$ の生成元 $f(a_{1}a_{2})=f(a_{1})f(a_{2})\in I_{1}^{e}I_{2}^{e}$。逆に $u=\sum_{i}b_{i}f(a_{i})\in I_{1}^{e}$, $v=\sum_{j}c_{j}f(a'_{j})\in I_{2}^{e}$ について $uv=\sum_{i,j}b_{i}c_{j}f(a_{i}a'_{j})\in(I_{1}I_{2})^{e}$ で、$I_{1}^{e}I_{2}^{e}$ はこの形の元で生成される。

**Step 3（2 の残り）.** $\cap$：単調性から $(I_{1}\cap I_{2})^{e}\subset I_{i}^{e}$。根基：$a^{n}\in I$ なら $f(a)^{n}=f(a^{n})\in I^{e}$ なので $f(\sqrt{I})\subset\sqrt{I^{e}}$ で、右辺はイデアル（\ref{ring:radical-properties.1}）なので生成されたイデアルも含まれる。商：$aI_{2}\subset I_{1}$ なら $f(a)f(I_{2})\subset f(I_{1})$ なので、$I_{2}^{e}$ の元 $\sum b_{i}f(c_{i})$ に $f(a)$ を掛けると $\sum b_{i}f(ac_{i})\in I_{1}^{e}$。よって $f((I_{1}:I_{2}))\subset(I_{1}^{e}:I_{2}^{e})$ で、右辺はイデアル。

**Step 4（3）.** 逆像は共通部分と交換する。根基：$a\in\sqrt{J}^{\,c}\iff$ ある $n$ で $f(a)^{n}=f(a^{n})\in J\iff$ ある $n$ で $a^{n}\in J^{c}\iff a\in\sqrt{J^{c}}$。和：単調性から $J_{i}^{c}\subset(J_{1}+J_{2})^{c}$。積：$a_{i}\in J_{i}^{c}$ なら $f(a_{1}a_{2})=f(a_{1})f(a_{2})\in J_{1}J_{2}$ なので生成元 $a_{1}a_{2}$ は $(J_{1}J_{2})^{c}$ に属する。商：$a\in(J_{1}:J_{2})^{c}$ と $b\in J_{2}^{c}$ について $f(ab)=f(a)f(b)\in f(a)J_{2}\subset J_{1}$ なので $ab\in J_{1}^{c}$。
:::

::: example 拡大と縮約の包含が真になる例 {#ring:extension-contraction-counterexamples keywords="extension does not commute with intersection, contraction does not commute with sums or products" index="拡大と縮約の反例|かくだいとしゅくやくのはんれい"}
1. **拡大と共通部分**：$f:k[x,y]\to k[t]$, $x,y\mapsto t$（直線 $x=y$ への制限）。$I_{1}=(x)$, $I_{2}=(y)$ について $I_{1}\cap I_{2}=(xy)$（\ref{ring:principal-prime-intersection}）なので $(I_{1}\cap I_{2})^{e}=(t^{2})$。一方 $I_{1}^{e}=I_{2}^{e}=(t)$ で、$t\notin(t^{2})$。
2. **拡大と根基**：$f:\Z\to\Z[i]$、$I=(2)$。$2$ は素数なので $\sqrt{I}=I$、$(\sqrt{I})^{e}=2\Z[i]$。一方 $(1+i)^{2}=2i\in 2\Z[i]$ なので $1+i\in\sqrt{I^{e}}$ だが、$(1+i)/2\notin\Z[i]$ なので $1+i\notin 2\Z[i]$。
3. **拡大と商**：$f:k[x]\to k$, $x\mapsto 0$、$I_{1}=0$, $I_{2}=(x)$。$(0:(x))=0$（整域）なので拡大も $0$。一方 $I_{1}^{e}=I_{2}^{e}=0$ で $(0:0)=k$。
4. **縮約と和**：包含 $k[x]\subset k[x,y]$、$J_{1}=(y)$, $J_{2}=(y-x)$。$J_{1}^{c}=0$：$g(x)\in(y)$ なら代入 $y\mapsto 0$（$k[x]$ 上で恒等）で $g=0$。同様に $y\mapsto x$ で $J_{2}^{c}=0$。一方 $J_{1}+J_{2}=\mathfrak{m}\ni x$ なので $x\in(J_{1}+J_{2})^{c}\neq 0$。
5. **縮約と積**：$f:k[u]\to k[x]$, $u\mapsto x^{2}$、$J=(x)$。$g(u)\in J^{c}\iff g(x^{2})\in(x)\iff g(0)=0$ なので $J^{c}=(u)$。$g(x^{2})\in(x^{2})\iff g(0)=0$ なので $(J^{2})^{c}=(u)$。一方 $(J^{c})^{2}=(u^{2})\not\ni u$。
6. **縮約と商**：包含 $k\subset k[x]$、$J_{1}=0$, $J_{2}=(x)$。$(0:(x))=0$ なので縮約も $0$。一方 $J_{1}^{c}=J_{2}^{c}=0$ で $(0:0)=k$。
:::

::: remark 等号になる場合
- $f$ が全射なら、縮約は $B$ のイデアル全体と $\Ker f$ を含む $A$ のイデアル全体の間の全単射で（\ref{ring:correspondence}）、$J^{ce}=J$。それでも 1 のように拡大は共通部分と交換しない。
- $f$ が平坦（局所化 $A\to S^{-1}A$ はその例）なら、拡大は有限個の共通部分と、有限生成イデアルによる商と交換する（\ref{ring:flat-extension-intersection}）。
- 局所化 $A\to S^{-1}A$ では $J^{ce}=J$（\ref{ring:localization-ideals.2}）で、さらに素イデアルについて $\mathfrak{p}^{ec}=\mathfrak{p}$（$\mathfrak{p}\cap S=\emptyset$ のとき。\ref{ring:localization-primes}）。
:::

## 問題 {#ring:sec-ia-problems}

::: problem {#ring:prob-z-distributive}
$\Z$ のイデアルの束は分配的であることを示せ。また $\Z$ で商イデアル $((m):(n))$（$m,n\neq 0$）を求めよ。
:::

::: solution
**分配性.** $\Z$ のイデアルは $(m)$（$m\ge 0$）の形（\ref{ring:ideals-of-z}）。$(a)+(b)=(\gcd(a,b))$（\ref{ring:ideal-operations.4}）、$(a)\cap(b)=(\operatorname{lcm}(a,b))$（$c$ が $a$ と $b$ の倍数 $\iff$ $\operatorname{lcm}$ の倍数）。$0$ が関わる場合は $(0)$ が最小元なので直接確かめられ、以下 $a,b,c>0$ とする。素数 $p$ ごとの指数 $v_{p}$ を見ると、$v_{p}(\gcd)=\min$, $v_{p}(\operatorname{lcm})=\max$ なので、示すべき式 $\operatorname{lcm}(a,\gcd(b,c))=\gcd(\operatorname{lcm}(a,b),\operatorname{lcm}(a,c))$ は、各 $p$ で整数の等式 $\max(\alpha,\min(\beta,\gamma))=\min(\max(\alpha,\beta),\max(\alpha,\gamma))$ に帰着する。これは $\alpha,\beta,\gamma$ の大小の 6 通りを調べればよい（全順序集合は分配束）。注意で示した同値性から、もう一方の分配法則も成り立つ。

**商イデアル.** $d=\gcd(m,n)$, $m=dm'$, $n=dn'$（$\gcd(m',n')=1$）。$a\in((m):(n))\iff m\mid an\iff m'\mid an'\iff m'\mid a$（$\gcd(m',n')=1$）。よって $((m):(n))=(m/\gcd(m,n))$。
:::

::: problem {#ring:prob-colon-radical}
$A$ の素イデアル $\mathfrak{p}$ とイデアル $J$ について、$J\not\subset\mathfrak{p}$ なら $(\mathfrak{p}:J)=\mathfrak{p}$ であることを示せ。$J\subset\mathfrak{p}$ のときはどうか。
:::

::: solution
$J\not\subset\mathfrak{p}$ とし、$b\in J\setminus\mathfrak{p}$ をとる。$a\in(\mathfrak{p}:J)$ なら $ab\in\mathfrak{p}$ で、$b\notin\mathfrak{p}$ と素イデアルの定義から $a\in\mathfrak{p}$。$\mathfrak{p}\subset(\mathfrak{p}:J)$ は \ref{ring:colon-laws.1}。$J\subset\mathfrak{p}$ なら \ref{ring:colon-laws.1} から $(\mathfrak{p}:J)=A\neq\mathfrak{p}$ なので、常に $\mathfrak{p}$ でない。
:::
