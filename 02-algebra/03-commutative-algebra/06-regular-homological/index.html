# 正則局所環とホモロジー的方法（Regular Local Rings and Homological Methods）

正則局所環と随伴次数環、正則列と深さ、コーエン＝マコーレー環と非混合性定理、コシュル複体と深さ、射影次元とアウスランダー＝ブクスバウムの公式、セールの正則性判定法（正則 ⇔ 大域次元有限）、正則局所環は一意分解環、ゴレンシュタイン環と完全交叉、操作（多項式環・完備化・剰余・忠実平坦降下）で保たれる性質（松村『可換環論』を参考）。

<p class="mn-msc">MSC2020: 13D02, 13D05, 13H05, 13H10</p>

## 前提知識

- [可換代数 › 局所化とネーター環](../../../02-algebra/03-commutative-algebra/02-localization-noetherian/index.html)（全体、3 ページ）：中山の補題・準素分解と随伴素イデアル
- [可換代数 › 整拡大と付値環](../../../02-algebra/03-commutative-algebra/03-integral-valuation/index.html)（全体、4 ページ）：証明・主張で使う：離散付値環の特徴付け・平坦拡大の下降定理
- [可換代数 › 完備化と次元論](../../../02-algebra/03-commutative-algebra/04-completion-dimension/index.html)（全体、4 ページ）：完備化・次元論・巴系
- [ホモロジー代数 › 導来関手](../../../02-algebra/06-homological-algebra/02-derived-functors/index.html)（全体、9 ページ）：Ext・Tor・射影次元・Ext の平衡性と長完全列
- [可換代数 › デデキント環と整域の分類](../../../02-algebra/03-commutative-algebra/05-dedekind-domains/index.html)（全体、8 ページ）：証明・主張で使う：デデキント環の局所的な特徴付け・正規整域と離散付値環の共通部分
