# ユークリッド環・単項イデアル整域・一意分解環 {#ring:page-euclid-pid-ufd keywords="Euclidean domain, principal ideal domain, PID, unique factorization domain, UFD, irreducible element, prime element, greatest common divisor, Bezout"}

整数は素数の積にただ一通りに分解する。この性質をもつ整域が**一意分解環**（UFD）であり（\ref{ring:ufd}）、すべてのイデアルが単項な**単項イデアル整域**（PID）と、割り算のできる**ユークリッド環**がそれを保証する典型的な条件である。このページでは、既約元と素元を区別して定義し（\ref{ring:irreducible-prime}）、
$$
\text{ユークリッド環}\ \Rightarrow\ \text{PID}\ \Rightarrow\ \text{UFD}
$$
を証明する（\ref{ring:euclidean-pid}, \ref{ring:pid-ufd}）。どちらの包含も真であること、すなわち逆が成り立たないことを、$\Z[(1+\sqrt{-19})/2]$（PID だがユークリッド環でない）と $\Z[x]$（UFD だが PID でない）で確かめる。UFD でない整域の例として $\Z[\sqrt{-5}]$ も調べる。

> 雪江明彦『代数学 2』第 1 章 §1.11 の流れを参考にした。本では証明されていない「$\Z[(1+\sqrt{-19})/2]$ はユークリッド環でない」を、剰余環を使う議論で補った。

## 記法と定義の確認 {#ring:sec-ep-notation}

::: notation
- 環は可換。整域・単元・単項イデアル・同伴（$(a)=(b)\iff a=ub$, $u$ は単元）は \ref{ring:domain-field-def}, \ref{ring:generated-ideal}, \ref{ring:associates}。素イデアル・極大イデアルとその剰余環による特徴付けは \ref{ring:prime-maximal-def}, \ref{ring:prime-maximal-quotient}。イデアルの鎖の和集合は \ref{ring:chain-union-ideal}。多項式の割り算は \ref{ring:polynomial-division}。
- 整域 $A$ の元 $a,b$ について、$b=ac$ となる $c\in A$ があるとき $a\mid b$（$a$ は $b$ を**割り切る**）と書く。$a\mid b\iff(b)\subset(a)$。
- 二次の整数環 $\Z[\sqrt{d}]$ とその単元は \ref{ring:quadratic-units}。複素数 $z$ について $N(z)\defeq z\bar z=\abs{z}^{2}$ とおくと $N(zw)=N(z)N(w)$。
- **選択公理**：PID で既約元分解が存在することの証明（\ref{ring:pid-ufd}）で、従属選択公理（可算回の選択）を使う。それ以外は使わない。
:::

## 既約元と素元 {#ring:sec-ep-irreducible}

::: definition 既約元・素元 {#ring:irreducible-prime-def keywords="irreducible element, prime element" index="既約元|きやくげん, 素元|そげん"}
$A$ を整域、$p\in A$ を $0$ でも単元でもない元とする。
1. $p=ab$ なら $a$ か $b$ が単元であるとき、$p$ を**既約元**という。
2. $p\mid ab$ なら $p\mid a$ または $p\mid b$ であるとき、$p$ を**素元**という。すなわち $(p)$ が素イデアル。
:::

::: proposition 素元は既約元 {#ring:irreducible-prime keywords="prime implies irreducible in a domain, associates of irreducibles" index="素元と既約元|そげんときやくげん"}
$A$ を整域とする。
1. 素元は既約元である。
2. 既約元（素元）と同伴な元は既約元（素元）である。
3. $p$ が既約元であることと、$(p)$ が「$0$ でない単項イデアル全体のうち、$A$ 以外で包含について極大」であることは同値である。
:::

::: proof
**Step 1（1）.** $p$ を素元とし $p=ab$ とする。$p\mid ab$ なので、例えば $p\mid a$：$a=pc$。すると $p=pcb$ で、整域なので簡約して $1=cb$（\ref{ring:domain-field.1}）。よって $b$ は単元。$p\mid b$ の場合も同様。

**Step 2（2）.** $q=up$（$u$ 単元）とする。$q=ab$ なら $p=(u^{-1}a)b$ なので $u^{-1}a$ か $b$ が単元、すなわち $a$ か $b$ が単元。素元についても $(q)=(p)$ なので明らか。

**Step 3（3）.** $(p)\subset(a)\subsetneq A$ とすると $p=ab$ で $a$ は単元でない（$(a)\neq A$）。$p$ が既約なら $b$ は単元で $(a)=(p)$。逆に $p=ab$, $a,b$ がともに単元でないなら $(p)\subsetneq(a)\subsetneq A$（$(p)=(a)$ なら $b$ が単元になる。\ref{ring:associates}）。

::: hypcheck
- **前提「整域」**：Step 1 の簡約に使った。
- 1 の逆は偽：$\Z[\sqrt{-5}]$ で $2$ は既約だが素元でない（\ref{ring:non-ufd-example}）。
:::
:::

## 一意分解環 {#ring:sec-ep-ufd}

::: definition 一意分解環 {#ring:ufd keywords="unique factorization domain, UFD, factorial ring" index="一意分解環|いちいぶんかいかん, 一意分解整域|いちいぶんかいせいいき, 素元分解整域|そげんぶんかいせいいき, UFD|ゆーえふでぃー"}
整域 $A$ が次の二条件をみたすとき、**一意分解環**（**一意分解整域**、**UFD**）という。
1. （存在）$0$ でも単元でもない元は、有限個の既約元の積である。
2. （一意性）$p_{1}\cdots p_{m}=q_{1}\cdots q_{n}$（$p_{i},q_{j}$ は既約元）なら $m=n$ で、番号を並べ替えると各 $i$ で $p_{i}$ と $q_{i}$ は同伴。
:::

::: theorem 一意分解環の判定 {#ring:ufd-criterion keywords="UFD iff factorizations exist and irreducibles are prime" index="一意分解環の判定|いちいぶんかいかんのはんてい"}
整域 $A$ で既約元分解が存在する（定義の 1）とき、$A$ が一意分解環であることと、すべての既約元が素元であることは同値である。
:::

::: proof
**Step 1（⇒）.** $p$ を既約元とし、$p\mid ab$（$ab=pc$）とする。$a=0$ なら $p\mid a$。$a$ が単元なら $b=a^{-1}pc$ で $p\mid b$。$b$ についても同様なので、$a,b$ は $0$ でも単元でもないとしてよい。$c$ が単元でなければ $c$ も既約元の積に書け（$c\neq 0$ は $ab\neq 0$ から）、$a,b,c$ の既約元分解を $ab=pc$ に代入すると、一意性から $p$ は $a$ または $b$ の既約因子のどれかと同伴。よって $p\mid a$ または $p\mid b$。$c$ が単元のときも、$p=c^{-1}ab$ が既約なので同じ結論（$a$ か $b$ が $p$ と同伴）。

**Step 2（⇐）.** $p_{1}\cdots p_{m}=q_{1}\cdots q_{n}$ について $m$ の帰納法で一意性を示す。$p_{1}$ は素元で右辺を割るので、素元の定義を繰り返し使って、ある $q_{j}$ を割り切る。並べ替えて $j=1$ とし、$q_{1}=p_{1}u$ と書くと、$q_{1}$ は既約なので $u$ は単元で、$p_{1}$ と $q_{1}$ は同伴。簡約して $p_{2}\cdots p_{m}=(uq_{2})q_{3}\cdots q_{n}$（$uq_{2}$ も既約。\ref{ring:irreducible-prime.2}）。$m=1$ なら左辺は $1$ で、右辺の既約元の積が単元になるので $n=1$。そうでなければ帰納法の仮定から $m-1=n-1$ で残りも同伴。
:::

::: proposition 一意分解環の最大公約元 {#ring:ufd-gcd keywords="gcd exists in a UFD" index="最大公約元|さいだいこうやくげん, 最小公倍元|さいしょうこうばいげん"}
$A$ を一意分解環とし、既約元の同伴類の代表系 $P$ を一つ固定する。$0$ でない $a\in A$ は $a=u\prod_{p\in P}p^{e_{p}(a)}$（$u$ 単元、ほとんどすべての $e_{p}(a)=0$）とただ一通りに書け、
1. $a\mid b\iff$ すべての $p$ で $e_{p}(a)\le e_{p}(b)$。
2. $d\defeq\prod_{p}p^{\min(e_{p}(a),e_{p}(b))}$ は $a,b$ の**最大公約元**である：$d\mid a$, $d\mid b$ で、$c\mid a$, $c\mid b$ なら $c\mid d$。最大公約元は同伴を除いて一意。
:::

::: proof
**Step 1（表示の一意性）.** 既約元分解の各因子を、$P$ の中の同伴な元と単元の積に置き換えれば表示が得られ、一意性は UFD の一意性から。

**Step 2（1）.** $b=ac$ なら $e_{p}(b)=e_{p}(a)+e_{p}(c)\ge e_{p}(a)$（積の表示は指数の和。一意性から）。逆に不等式が成り立てば $c\defeq u_{b}u_{a}^{-1}\prod p^{e_{p}(b)-e_{p}(a)}$ で $b=ac$。

**Step 3（2）.** 1 から $d\mid a$, $d\mid b$。$c\mid a,b$ なら $e_{p}(c)\le\min(e_{p}(a),e_{p}(b))=e_{p}(d)$ で $c\mid d$。二つの最大公約元 $d,d'$ は互いに割り切るので同伴（\ref{ring:associates}）。
:::

## 単項イデアル整域 {#ring:sec-ep-pid}

::: definition 単項イデアル整域 {#ring:pid keywords="principal ideal domain, PID" index="単項イデアル整域|たんこういであるせいいき, PID|ぴーあいでぃー, 単項イデアル環|たんこういであるかん"}
すべてのイデアルが単項イデアルである整域を**単項イデアル整域**（**PID**）という。
:::

::: proposition 単項イデアル整域の基本性質 {#ring:pid-basic keywords="gcd and Bezout in a PID, irreducible elements generate maximal ideals in a PID, ascending chain condition on principal ideals" index="ベズーの等式|べずーのとうしき"}
$A$ を単項イデアル整域とする。
1. $a,b\in A$ について $(a,b)=(d)$ となる $d$ は $a,b$ の最大公約元で、$d=ax+by$ となる $x,y\in A$ がある（ベズーの等式）。
2. $p$ が既約元なら $(p)$ は極大イデアルで、したがって $p$ は素元である。
3. （単項イデアルの昇鎖条件）イデアルの昇鎖 $I_{1}\subset I_{2}\subset\cdots$ は、ある番号から先で一定になる。
4. $0$ でない素イデアルは極大イデアルである。
:::

::: proof
**Step 1（1）.** $d\in(a,b)$ なので $d=ax+by$。$a,b\in(d)$ なので $d\mid a$, $d\mid b$。$c\mid a$, $c\mid b$ なら $c\mid ax+by=d$。

**Step 2（2）.** $(p)\subset I\subsetneq A$ とすると、$I=(a)$ と書けて \ref{ring:irreducible-prime.3} から $(a)=(p)$。よって $(p)$ は極大（$p$ は単元でないので $(p)\neq A$）。極大イデアルは素イデアル（\ref{ring:prime-maximal-quotient.3}）なので $p$ は素元。

**Step 3（3）.** $I\defeq\bigcup_{n}I_{n}$ は鎖の和集合なのでイデアル（\ref{ring:chain-union-ideal}、$S=\emptyset$）。$I=(d)$ と書けて、$d\in I_{n}$ となる $n$ がある。$k\ge n$ なら $I=(d)\subset I_{n}\subset I_{k}\subset I$ なので $I_{k}=I_{n}$。

**Step 4（4）.** $\mathfrak{p}=(p)\neq 0$ が素イデアルなら $p$ は素元なので既約元（\ref{ring:irreducible-prime.1}）で、2 から $(p)$ は極大。
:::

::: theorem 単項イデアル整域は一意分解環 {#ring:pid-ufd keywords="every PID is a UFD" index="単項イデアル整域は一意分解環|たんこういであるせいいきはいちいぶんかいかん"}
（DC）単項イデアル整域は一意分解環である。
:::

::: proof
**Step 1（既約元分解の存在）.** $0$ でも単元でもない元で、既約元の有限積に書けないもの全体を $X$ とし、$X\neq\emptyset$ と仮定する。$a\in X$ は既約でない（既約元はそれ自身が分解）ので $a=bc$, $b,c$ はともに単元でない。$b,c$ がともに $X$ に属さなければ $a$ は分解をもつので、$b$ か $c$ は $X$ に属し、それを $a'$ とすると $(a)\subsetneq(a')$（$a'$ と $a$ が同伴なら他方が単元になる）。従属選択公理により、$a_{0}\in X$ から始めて $(a_{0})\subsetneq(a_{1})\subsetneq(a_{2})\subsetneq\cdots$ となる列を作れるが、これは \ref{ring:pid-basic.3} に反する。よって $X=\emptyset$。

**Step 2（一意性）.** \ref{ring:pid-basic.2} から既約元は素元なので、\ref{ring:ufd-criterion} から一意分解環。

::: hypcheck
- **選択公理**：Step 1 で無限列を作るのに従属選択公理を使った。
- **前提「PID」**：Step 1 では昇鎖条件（\ref{ring:pid-basic.3}）を、Step 2 では既約元が素元であること（同 2）を使った。どちらも PID より弱い条件で済む：単項イデアルの昇鎖条件をみたし、すべての既約元が素元である整域は UFD である。
:::
:::

## ユークリッド環 {#ring:sec-ep-euclidean}

::: definition ユークリッド環 {#ring:euclidean-domain keywords="Euclidean domain, Euclidean function" index="ユークリッド環|ゆーくりっどかん, ユークリッド整域|ゆーくりっどせいいき, ユークリッド関数|ゆーくりっどかんすう"}
整域 $A$ と写像 $\delta:A\setminus\{0\}\to\N$ が、「任意の $a\in A$ と $0$ でない $b\in A$ について、$a=qb+r$ かつ（$r=0$ または $\delta(r)<\delta(b)$）となる $q,r\in A$ がある」をみたすとき、$A$ を**ユークリッド環**（**ユークリッド整域**）という。
:::

::: theorem ユークリッド環は単項イデアル整域 {#ring:euclidean-pid keywords="every Euclidean domain is a PID" index="ユークリッド環は単項イデアル整域|ゆーくりっどかんはたんこういであるせいいき"}
ユークリッド環は単項イデアル整域であり、したがって一意分解環である。
:::

::: proof
**Step 1.** $I$ をイデアルとする。$I=0$ なら $I=(0)$。$I\neq 0$ なら、$\N$ の整列性から $\delta(b)$ が最小となる $0\neq b\in I$ をとる。

**Step 2.** $a\in I$ について $a=qb+r$（$r=0$ または $\delta(r)<\delta(b)$）と割ると、$r=a-qb\in I$。$r\neq 0$ なら $\delta(r)<\delta(b)$ で $b$ の最小性に反するので $r=0$、すなわち $a\in(b)$。よって $I=(b)$。UFD であることは \ref{ring:pid-ufd} から。

::: hypcheck
- **前提「割り算ができる」**：Step 2 で使った。これが \ref{grp:subgroups-of-z}（$\Z$ の部分群は $d\Z$）の証明の核心と同じ議論である。
- Step 1 は $\N$ の最小元の存在だけを使い、選択公理は要らない。UFD であることの部分では \ref{ring:pid-ufd} を通して従属選択公理を使う。
:::
:::

::: example ユークリッド環の例 {#ring:euclidean-examples}
1. $\Z$（$\delta(a)=\abs{a}$。\ref{grp:division}）。
2. 体 $K$ 上の多項式環 $K[x]$（$\delta(f)=\deg f$。$0$ でない $g$ の最高次係数は単元なので \ref{ring:polynomial-division} が使える）。したがって $K[x]$ は PID で UFD。
3. ガウスの整数環 $\Z[i]$（$\delta=N$）。$a,b\neq 0$ について $a/b=s+ti\in\Q(i)$ とし、$s,t$ に最も近い整数 $m,n$ をとって $q\defeq m+ni$ とおくと、$N(a/b-q)=(s-m)^{2}+(t-n)^{2}\le\frac{1}{4}+\frac{1}{4}=\frac{1}{2}$。$r\defeq a-qb$ について $N(r)=N(b)N(a/b-q)\le\frac{1}{2}N(b)<N(b)$。同じ議論で $\Z[\sqrt{-2}]$ もユークリッド環（$N\le\frac{1}{4}+\frac{2}{4}=\frac{3}{4}$）。
:::

## 包含が真であること {#ring:sec-ep-counterexamples}

::: counterexample 一意分解環でない整域 $\Z[\sqrt{-5}]$ {#ring:non-ufd-example keywords="Z[sqrt(-5)] is not a UFD, 6 = 2*3 = (1+sqrt(-5))(1-sqrt(-5))" index="一意分解でない例|いちいぶんかいでないれい"}
$A=\Z[\sqrt{-5}]$ で
$$
6=2\cdot 3=(1+\sqrt{-5})(1-\sqrt{-5})
$$
であり、$2,3,1\pm\sqrt{-5}$ はどれも既約元で、$2$ はどちらの $1\pm\sqrt{-5}$ とも同伴でない。したがって $A$ は一意分解環でなく、$2$ は既約だが素元でない。
:::

::: proof
**Step 1（ノルム）.** $N(x+y\sqrt{-5})=x^{2}+5y^{2}$ は非負整数で乗法的。$A^{\times}=\{\pm1\}$（\ref{ring:prob-quadratic-units-negative}）で、これは $N=1$ の元。

**Step 2（既約性）.** $N(2)=4$, $N(3)=9$, $N(1\pm\sqrt{-5})=6$。$\alpha=\beta\gamma$ で $\beta,\gamma$ が単元でないなら、$N(\beta),N(\gamma)\ge 2$ で $N(\beta)N(\gamma)=N(\alpha)$。$x^{2}+5y^{2}$ の値は $0,1,4,5,6,9,\dots$ で $2$ と $3$ を取らない（$y\neq 0$ なら $\ge 5$、$y=0$ なら平方数）。$N(\alpha)\in\{4,6,9\}$ を $2$ 以上の二つの値の積に分けると、少なくとも一方は $2$ か $3$ になるので不可能。よって四つとも既約。

**Step 3（同伴でない・素元でない）.** 単元は $\pm1$ なので、$2$ の同伴は $\pm2$ で $1\pm\sqrt{-5}$ ではない。$2\mid(1+\sqrt{-5})(1-\sqrt{-5})$ だが、$2\nmid 1\pm\sqrt{-5}$（$\frac{1\pm\sqrt{-5}}{2}\notin A$）なので $2$ は素元でない。
:::

::: counterexample ユークリッド環でない単項イデアル整域 {#ring:pid-not-euclidean keywords="Z[(1+sqrt(-19))/2] is a PID but not Euclidean" index="ユークリッド環でない単項イデアル整域|ゆーくりっどかんでないたんこういであるせいいき"}
$\theta\defeq\frac{1+\sqrt{-19}}{2}$ とし、$A\defeq\Z[\theta]=\{a+b\theta : a,b\in\Z\}$ とする（$\theta^{2}=\theta-5$ なので部分環）。$A$ は単項イデアル整域だが、ユークリッド環ではない。
:::

::: proof
**Step 1（単元）.** $N(a+b\theta)=a^{2}+ab+5b^{2}$ で、$4N=(2a+b)^{2}+19b^{2}$。$N=1$ なら $b=0$, $a=\pm1$ なので $A^{\times}=\{\pm1\}$。

**Step 2（ユークリッド環なら「万能な割る元」がある）.** $A$ が $\delta$ についてユークリッド環だとする。$A$ は体でない（$2$ は $N(2)=4\neq 1$ なので単元でない）ので、$0$ でも単元でもない元のうち $\delta$ が最小のもの $u$ がある。任意の $x$ を $u$ で割ると $x=qu+r$ で、$r=0$ か $\delta(r)<\delta(u)$。後者では最小性から $r$ は $0$ か単元、すなわち $r\in\{0,1,-1\}$。よって $A/(u)$ の元は $0,1,-1$ の類で尽くされ、$A/(u)$ は 2 個か 3 個の元からなる零環でない環（$u$ は単元でない）。

**Step 3（そのような剰余環はない）.** 元が 2 個（3 個）の環は加法群が $\Z/2\Z$（$\Z/3\Z$）で、$\mathbb{F}_{2}$（$\mathbb{F}_{3}$）に同型である（素部分環 \ref{ring:prime-subring} が全体になる）。すると自然な射影 $A\to A/(u)\cong\mathbb{F}_{q}$（$q=2,3$）による $\theta$ の像 $t$ は $t^{2}-t+5=0$ をみたす。しかし $\mathbb{F}_{2}$ で $x^{2}-x+5=x^{2}+x+1$ は $x=0,1$ で値 $1$、$\mathbb{F}_{3}$ で $x^{2}-x+5=x^{2}-x+2$ は $x=0,1,2$ で値 $2,2,1$ をとり、根がない。矛盾。

**Step 4（PID であること）.** \ref{ring:dedekind-hasse}を確かめる（\ref{ring:pid-not-euclidean-fact}）。

::: hypcheck
- 選択公理は使わない。
:::
:::

::: lemma デデキント＝ハッセの判定法 {#ring:dedekind-hasse keywords="Dedekind-Hasse criterion for principal ideal domains" index="デデキント＝ハッセの判定法|でできんとはっせのはんていほう" refname="デデキント＝ハッセの判定法"}
整域 $A$ と写像 $N\colon A\to\N$ で $N(a)=0\iff a=0$ となるものがあり、$a,b\in A$, $b\neq 0$, $b\nmid a$ ならば $0<N(sa-tb)<N(b)$ となる $s,t\in A$ があるとする。このとき $A$ は単項イデアル整域。
:::

::: proof
$I\neq 0$ をイデアルとし、$I\setminus\{0\}$ で $N$ が最小の $b$ をとる。$a\in I$ で $b\nmid a$ なら、仮定の $s,t$ について $sa-tb\in I$ は $0$ でなく $N(sa-tb)<N(b)$ で、最小性に反する。よって $I=bA$。
:::

::: proposition $\Z[(1+\sqrt{-19})/2]$ は単項イデアル整域 {#ring:pid-not-euclidean-fact keywords="Z[(1+sqrt(-19))/2] satisfies the Dedekind-Hasse criterion" index="ユークリッド環でない単項イデアル整域|ゆーくりっどかんでないたんこういであるせいいき"}
$A=\Z[\theta]$, $\theta=\frac{1+\sqrt{-19}}{2}$ と $N(z)\defeq\abs{z}^{2}$（$N(a+b\theta)=a^{2}+ab+5b^{2}$）はデデキント＝ハッセの判定法の仮定をみたす。したがって $A$ は単項イデアル整域。
:::

::: proof
**Step 0（帰着）.** $A=\{\frac{m+n\sqrt{-19}}{2} : m,n\in\Z,\ m\equiv n\pmod 2\}$ で、$\Z[\sqrt{-19}]\subset A$。$b\nmid a$ なら $\alpha\defeq a/b\in\Q(\sqrt{-19})\setminus A$ で、$N(sa-tb)=N(b)N(s\alpha-t)$ なので、$0<N(s\alpha-t)<1$ となる $s,t\in A$ を見つければよい。$\alpha=\frac{u+v\sqrt{-19}}{c}$（$u,v,c\in\Z$, $c\ge 1$ は分母の最小公倍数、$\gcd(u,v,c)=1$）と書くと、$c=1$ なら $\alpha\in\Z[\sqrt{-19}]\subset A$ なので $c\ge 2$。

**Step 1（$c=2$）.** $\alpha\notin A$ なので $u,v$ の偶奇は異なる。$t\defeq\frac{(u-1)+v\sqrt{-19}}{2}$ は $u-1\equiv v\pmod 2$ なので $A$ の元で、$s=1$ について $\alpha-t=\frac12$、$N=\frac14$。

**Step 2（$c=3$）.** $u^{2}+19v^{2}\equiv u^{2}+v^{2}\pmod 3$ は、$3\nmid u$ または $3\nmid v$（$\gcd$ の条件）なので $3$ で割り切れない（平方数は $3$ を法として $0,1$）。$s=u-v\sqrt{-19}$ とすると $s\alpha=\frac{u^{2}+19v^{2}}{3}=q+\frac{r}{3}$（$r\in\{1,2\}$）で、$t=q$ について $N=\frac{r^{2}}{9}\le\frac49$。

**Step 3（$c=4$）.** $u,v$ がともに奇数なら $u^{2}\equiv 1$, $19v^{2}\equiv 3\pmod 8$ から $u^{2}+19v^{2}=8m+4$。$s=\frac{u-v\sqrt{-19}}{2}\in A$ について $s\alpha=\frac{u^{2}+19v^{2}}{8}=m+\frac12$、$t=m$ で $N=\frac14$。$u,v$ の一方だけが奇数なら $u^{2}+19v^{2}$ は奇数で、$s=u-v\sqrt{-19}$ について $s\alpha=\frac{u^{2}+19v^{2}}{4}=q+\frac{r}{4}$（$r\in\{1,3\}$）、$t=q$ または $q+1$ で $N=\frac{1}{16}$。（両方偶数は $\gcd(u,v,4)=1$ に反する。）

**Step 4（$c\ge 5$）.** $\gcd(u,v,c)=1$ から $ux+vy+cz=1$ となる整数 $x,y,z$ がある。$s\defeq y+x\sqrt{-19}\in A$ とすると
$$
s\alpha=\frac{(uy-19vx)+(ux+vy)\sqrt{-19}}{c}=\frac{uy-19vx}{c}+\Bigl(\frac1c-z\Bigr)\sqrt{-19}.
$$
$uy-19vx=qc+r$（$\abs{r}\le c/2$）とし、$t\defeq q-z\sqrt{-19}\in A$ とすると $s\alpha-t=\frac{r+\sqrt{-19}}{c}$、$N=\frac{r^{2}+19}{c^{2}}>0$。$c=5$ なら $\abs{r}\le 2$ で $N\le\frac{23}{25}$、$c\ge 6$ なら $N\le\frac14+\frac{19}{36}<1$。

いずれの場合も $0<N(s\alpha-t)<1$。\ref{ring:dedekind-hasse} から $A$ は単項イデアル整域。
:::

::: remark
虚二次体 $\Q(\sqrt{-d})$（$d>0$ 平方因子なし）の整数環が PID になるのは $d=1,2,3,7,11,19,43,67,163$ のときに限ることが知られている（ヘーグナー、ベイカー、スタークによる深い定理。このサイトでは証明しない）。上の Step 2・3 の議論（\ref{ring:pid-not-euclidean}）は $d=19,43,67,163$ でも同様に働き、これらがユークリッド環でないことを示す。
:::

::: supplement
**包含のまとめ.** 体 $\subsetneq$ ユークリッド環 $\subsetneq$ PID $\subsetneq$ UFD $\subsetneq$ 整域。各包含が真であることは、$\Z$（体でないユークリッド環）、$\Z[\frac{1+\sqrt{-19}}{2}]$、$\Z[x]$（次のページの \ref{ring:ufd-not-pid}）、$\Z[\sqrt{-5}]$ で示した。整域の分類全体（デデキント・付値環・ベズー・GCD・プリューファーとの関係）は \ref{ring:page-classification} にまとめる。

**高い視点.** \ref{ring:irreducible-prime.3} が示すように、既約性は「単項イデアルの順序」の中での極大性、素元性は「素イデアル」という環全体の構造に関わる性質である。両者が一致すること（UFD）は単項イデアルの世界がうまく振る舞うことの表れで、一致しない $\Z[\sqrt{-5}]$ では、元の代わりにイデアルの素イデアル分解を考えることで一意性が回復する（デデキント整域、\ref{ring:page-dedekind}）。$(2)=(2,1+\sqrt{-5})^{2}$ がその最初の例である。

**計算の観点.** $\Z$ の互除法の割り算の回数は、小さい方の数の桁数の定数倍以下である（ラメの定理）。ベズーの係数まで含めて多項式時間（\ref{comp:class-p}）で計算できる。余りつきの割り算とユークリッド関数が原始再帰的に計算できる表示をもつユークリッド環では、互除法は原始再帰的である（反復回数が $\delta$ の値で抑えられる。\ref{mod:smith-pr-euclidean}）。一方、一意分解の「分解」を求めるのは別の問題である。$\Z$ の素因数分解には多項式時間のアルゴリズムが知られていない（素数判定は多項式時間でできる：アグラワル・カヤル・サクセナ、2002 年）。計算可能な体 $k$ 上の $k[x]$ で、既約性の判定すらアルゴリズムで解けない例もある（フレーリッヒとシェファードソン、1956 年）。いずれも本サイト未収録。
:::

## 問題 {#ring:sec-ep-problems}

::: problem {#ring:prob-gaussian-primes}
$p$ を奇素数とする。$p$ が $\Z[i]$ で素元でないなら、$p=x^{2}+y^{2}$ となる整数 $x,y$ があることを示せ。
:::

::: solution
$\Z[i]$ は UFD（\ref{ring:euclidean-examples}）なので、$p$ が素元でないなら既約でない（\ref{ring:pid-basic.2}）。$p=\alpha\beta$, $\alpha,\beta$ は単元でない、とすると $N(\alpha)N(\beta)=N(p)=p^{2}$ で、$N(\alpha),N(\beta)>1$ なので $N(\alpha)=p$。$\alpha=x+yi$ とすれば $p=x^{2}+y^{2}$。（逆に $p=x^{2}+y^{2}=(x+yi)(x-yi)$ なら素元でない。$p\equiv 1\pmod 4$ ならこれが成り立つことはフェルマーの二平方定理として知られる。）
:::

::: problem {#ring:prob-k-x-irreducible-maximal}
体 $K$ 上の $f\in K[x]$ について、$K[x]/(f)$ が体であることと $f$ が既約であることは同値であることを示せ。また $\R[x]/(x^{2}+1)\cong\C$ がこの例であることを確かめよ。
:::

::: solution
$K[x]$ は PID なので、\ref{ring:pid-basic.2}・\ref[4]{ring:pid-basic.4} から、$f\neq 0$ について $(f)$ が極大 $\iff$ $f$ が既約（$\Rightarrow$ は \ref{ring:irreducible-prime.3}：$(f)$ が極大なら単項イデアルの中でも極大）。\ref{ring:prime-maximal-quotient.2} から $K[x]/(f)$ が体 $\iff(f)$ が極大。$x^{2}+1$ は $\R$ に根がないので一次因子をもたず、二次式なので既約。$\R[x]/(x^{2}+1)\cong\C$ は \ref{ring:polynomial-quotients}。
:::
