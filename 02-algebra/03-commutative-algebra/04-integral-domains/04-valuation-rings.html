# 付値環と離散付値環 {#ring:page-valuation-rings keywords="valuation ring, valuation, value group, discrete valuation ring, DVR, uniformizer, characterization of DVRs"}

商体の元 $x\neq 0$ について「$x$ か $x^{-1}$ のどちらかが必ず属する」整域を**付値環**という（\ref{ring:valuation-ring}）。付値環は**付値**（\ref{ring:valuation}）、すなわち「元の大きさ」を全順序群の値で測る写像と一対一に対応し、イデアルが一列に並ぶ極端に単純な局所環である。値群が $\Z$ の付値環が**離散付値環**（DVR）で（\ref{ring:dvr}）、$\Z_{(p)}$ や $K[[x]]$ がその典型である。このページでは付値環の基本性質（局所・ベズー・正規。\ref{ring:valuation-properties}）を示し、離散付値環を五通りに特徴付ける（\ref{ring:dvr-characterization}）。最後の特徴付け「\term[次元]{ring:krull-dimension} $1$ のネーター正規局所整域」は、\ref{ring:page-dedekind}の局所的な姿である。

> Atiyah–Macdonald 第 5 章後半・第 9 章と松村『可換環論』§10–11 の流れを参考にした。

## 記法と定義の確認 {#ring:sec-vr-notation}

::: notation
- 環は可換。局所環とその判定は \ref{ring:local-ring}, \ref{ring:local-ring-criterion}、ベズー整域・GCD 整域は \ref{ring:page-gcd-bezout}、正規環は \ref{ring:normal-domain}、整であることの特徴付けは \ref{ring:integral-criterion}、中山の補題は \tref{ring:nakayama}、ネーター環の冪零根基は \ref{ring:noetherian-prime-product}。
- **全順序可換群**：可換群 $\Gamma$ と全順序 $\le$ で、$\alpha\le\beta\Rightarrow\alpha+\gamma\le\beta+\gamma$ をみたすもの。$\Z$, $\Q$, $\R$ など。
- 局所整域 $A$ の**\term[次元]{ring:krull-dimension}が $1$** とは、$0$ でない素イデアルがちょうど一つ（極大イデアル）であることを言う（クルル次元は \ref{ring:page-dimension-theory} で定義する）。
- 選択公理：中山の補題（局所環の極大イデアルがジャコブソン根基であること）以外では使わない。
:::

## 付値環 {#ring:sec-vr-valuation}

::: definition 付値環 {#ring:valuation-ring keywords="valuation ring" index="付値環|ふちかん"}
整域 $V$ とその商体 $K$ について、$0$ でないすべての $x\in K$ で $x\in V$ または $x^{-1}\in V$ が成り立つとき、$V$ を（$K$ の）**付値環**という。
:::

::: proposition 付値環の性質 {#ring:valuation-properties keywords="valuation ring is local, ideals are totally ordered, Bezout, integrally closed" index="付値環の性質|ふちかんのせいしつ"}
$V$ を付値環、$K$ をその商体とする。
1. $V$ のイデアルは包含について全順序である。特に $V$ はベズー整域。
2. $V$ は局所環で、極大イデアルは $\mathfrak{m}=\{x\in V : x=0\text{ または }x^{-1}\notin V\}$（非単元全体）。
3. $V$ は正規環である。
4. $V\subset V'\subset K$ となる環 $V'$ も付値環で、$V'$ は $V$ のある素イデアル $\mathfrak{p}$ での局所化 $V_{\mathfrak{p}}$ である。
:::

::: proof
**Step 1（1）.** イデアル $I,J$ で $I\not\subset J$ とし、$a\in I\setminus J$ をとる。$b\in J$, $b\neq 0$ について、$a/b\in V$ なら $a=(a/b)b\in J$ で矛盾するので $b/a\in V$、よって $b=(b/a)a\in I$。$J\subset I$。有限生成イデアル $(a_{1},\dots,a_{n})$ は、単項イデアル $(a_{i})$ のうち最大のものに等しいので単項。

**Step 2（2）.** 非単元全体 $\mathfrak{m}$ がイデアルであることを示せば、\ref{ring:local-ring-criterion.1} から局所環。$x\in\mathfrak{m}$, $a\in V$ について、$ax$ が単元なら $x^{-1}=a(ax)^{-1}\in V$ で矛盾。$x,y\in\mathfrak{m}$（$0$ でない）について、例えば $x/y\in V$ なら $x+y=y(1+x/y)\in yV\subset\mathfrak{m}$（前半から）。$y/x\in V$ の場合も同様。

**Step 3（3）.** $x\in K$ が $V$ 上整：$x^{n}+a_{1}x^{n-1}+\dots+a_{n}=0$ で $x\notin V$ とする。$x^{-1}\in V$ なので、$x^{-(n-1)}$ を掛けて $x=-(a_{1}+a_{2}x^{-1}+\dots+a_{n}x^{-(n-1)})\in V$ となり矛盾。

**Step 4（4）.** $V'$ が付値環であることは定義から明らか（$V\subset V'$）。$\mathfrak{p}\defeq\mathfrak{m}'\cap V$（$\mathfrak{m}'$ は $V'$ の極大イデアル）は $V$ の素イデアル。$V_{\mathfrak{p}}\subset V'$：$s\in V\setminus\mathfrak{p}$ は $V'$ の非単元でないので単元。逆に $x\in V'\setminus V$ なら $x^{-1}\in V$ で、$x^{-1}\in\mathfrak{p}$ だと $x^{-1}$ は $V'$ の非単元だが $x\in V'$ が逆元なので矛盾、よって $x^{-1}\in V\setminus\mathfrak{p}$ で $x=1/x^{-1}\in V_{\mathfrak{p}}$。

::: hypcheck
- 選択公理は使わない（2 は非単元全体がイデアルであることを直接示した）。
:::
:::

::: definition 付値 {#ring:valuation keywords="valuation, value group, valuation ring of a valuation, Krull valuation" index="付値|ふち, 値群|ちぐん"}
体 $K$ と全順序可換群 $\Gamma$ について、全射 $v:K^{\times}\to\Gamma$ が
$$
v(xy)=v(x)+v(y),\qquad v(x+y)\ge\min(v(x),v(y))\ (x+y\neq 0)
$$
をみたすとき、$v$ を $K$ の**付値**、$\Gamma$ を**値群**という（$v(0)\defeq+\infty$ と約束する）。
:::

::: theorem 付値と付値環の対応 {#ring:valuation-correspondence keywords="valuation rings correspond to valuations" index="付値と付値環|ふちとふちかん"}
1. 体 $K$ の付値 $v$ について、$V_{v}\defeq\{x\in K : v(x)\ge 0\}$ は $K$ の付値環で、極大イデアルは $\{v(x)>0\}$、単元群は $\{v(x)=0\}$。
2. 逆に、$K$ の付値環 $V$ について、$\Gamma\defeq K^{\times}/V^{\times}$ に「$xV^{\times}\le yV^{\times}\iff y/x\in V$」で順序を入れると全順序可換群になり、射影 $v:K^{\times}\to\Gamma$ は付値で $V_{v}=V$。
:::

::: proof
**Step 1（1）.** $v(1)=v(1)+v(1)$ から $v(1)=0$、$v(-1)\cdot 2=v(1)=0$ で全順序群には位数 $2$ の元がない（$\gamma>0$ なら $2\gamma>\gamma>0$）ので $v(-1)=0$。和と積で閉じることは付値の条件から。$x\in K^{\times}$ について $v(x)+v(x^{-1})=0$ なので一方は $\ge 0$。単元 $\iff v(x)\ge 0$ かつ $v(x^{-1})\ge 0\iff v(x)=0$。

**Step 2（2）.** 順序が矛盾なく定まり（$V^{\times}$ 倍で $y/x$ の所属は変わらない）、全順序（$y/x$ か $x/y$ が $V$）、反対称（$y/x,x/y\in V$ なら $y/x$ は単元）、推移的（積）、加法と両立（$z$ を掛けても $y/x$ は不変）。$v(x+y)\ge\min$：$v(x)\le v(y)$ なら $y/x\in V$ で、$(x+y)/x=1+y/x\in V$ なので $v(x)\le v(x+y)$。$V_{v}=\{x : x/1\in V\}=V$。
:::

## 離散付値環 {#ring:sec-vr-dvr}

::: definition 離散付値環 {#ring:dvr keywords="discrete valuation ring, DVR, uniformizer, normalized discrete valuation" index="離散付値環|りさんふちかん, 一意化元|いちいかげん, 素元（離散付値環の）|そげんりさんふちかんの"}
値群が $\Z$ の付値（**離散付値**）の付値環を**離散付値環**（DVR）という。$v(t)=1$ となる元 $t$ を**一意化元**（**素元**）という。
:::

::: example
1. $\Z_{(p)}$：$v_{p}(p^{n}a/b)\defeq n$（$p\nmid a,b$）は $\Q$ の離散付値（**$p$ 進付値**）で、その付値環が $\Z_{(p)}$。一意化元は $p$。
2. 体 $K$ 上の $K[[x]]$：$\operatorname{ord}$ を商体 $K((x))$（ローラン級数体）に延ばした離散付値の付値環。一意化元は $x$。同様に $K[x]_{(x)}$ も DVR。
3. 有理数冪の環（\ref{ring:rational-exponent-ring}）は値群 $\Q$ の付値環で、DVR ではない。
:::

::: lemma 冪の共通部分 {#ring:principal-intersection keywords="intersection of powers of a principal maximal ideal in a Noetherian local domain is zero" index="冪の共通部分|べきのきょうつうぶぶん"}
$A$ をネーター整域、$t\in A$ を $1+tA\subset A^{\times}$ となる元とする（例えば局所環の極大イデアルの元）。$\bigcap_{n}t^{n}A=0$。
:::

::: proof
$x\in\bigcap_{n}t^{n}A$ とし、$x=t^{n}x_{n}$ と書く。$t^{n}x_{n}=t^{n+1}x_{n+1}$ から、$t=0$ なら $x=0$。$t\neq 0$ なら整域なので $x_{n}=tx_{n+1}$、よって $(x_{1})\subset(x_{2})\subset\cdots$。ネーター性からある $n$ で $(x_{n+1})=(x_{n})$、$x_{n+1}=cx_{n}=ctx_{n+1}$ なので $(1-ct)x_{n+1}=0$。$1-ct$ は単元なので $x_{n+1}=0$、$x=0$。
:::

::: theorem 離散付値環の特徴付け {#ring:dvr-characterization keywords="characterizations of discrete valuation rings: Noetherian valuation ring, local PID, Noetherian local domain with principal maximal ideal, one-dimensional Noetherian normal local domain" index="離散付値環の特徴付け|りさんふちかんのとくちょうづけ"}
（AC）体でない整域 $A$ について、次は同値である。
1. $A$ は離散付値環。
2. $A$ はネーターな付値環。
3. $A$ は局所的な PID。
4. $A$ はネーター局所整域で、極大イデアルが単項。
5. $A$ はネーター局所整域で、\term[次元]{ring:krull-dimension}が $1$ で、正規。
:::

::: proof
**Step 1（1⇒3）.** 一意化元 $t$ について、$0\neq x\in A$ は $x=t^{v(x)}\cdot(xt^{-v(x)})$ で、後者は $v=0$ なので単元。$0$ でないイデアル $I$ について $n=\min\{v(x) : x\in I\}$ とすれば $I=t^{n}A$。よって PID で、局所環（\ref{ring:valuation-properties.2}）。

**Step 2（3⇒4、1⇒2、2⇒4）.** 3⇒4：PID はネーター（\ref{ring:pid-basic.3} と \ref{ring:noetherian-module}）で、極大イデアルは単項。1⇒2：1⇒3 からネーターで、DVR は付値環。2⇒4：ネーターなら極大イデアルは有限生成で、付値環なので単項（\ref{ring:valuation-properties.1}）。以下、4⇒1（Step 4）と 1⇒5⇒4（Step 3・5）を示せば、すべてが同値になる。

**Step 3（1⇒5）.** 1⇒3 からネーター局所整域。正規は \ref{ring:valuation-properties.3}。\term[次元]{ring:krull-dimension}：Step 1 からイデアルは $t^{n}A$ と $0$ で、素イデアルは $0$ と $tA$ だけ。

**Step 4（4⇒1）.** 極大イデアル $\mathfrak{m}=tA$, $t\neq 0$（体でないので $\mathfrak{m}\neq 0$）。$0\neq x\in A$ について、\ref{ring:principal-intersection} から $x\in t^{n}A\setminus t^{n+1}A$ となる $n$ がただ一つあり、$x=t^{n}u$ で $u\notin tA=\mathfrak{m}$、すなわち $u$ は単元。$v(t^{n}u)\defeq n$ とおき、商体へ $v(x/y)\defeq v(x)-v(y)$ で延ばすと（表示の一意性から矛盾なく定まる）、$v$ は離散付値で $V_{v}=A$。

**Step 5（5⇒4）.** $\mathfrak{m}$ を極大イデアルとする。
- \ref{ring:nakayama}から $\mathfrak{m}\neq\mathfrak{m}^{2}$（$\mathfrak{m}\neq 0$ は有限生成）。$a\in\mathfrak{m}\setminus\mathfrak{m}^{2}$ をとる。
- $A/(a)$ の素イデアルは $\mathfrak{m}/(a)$ だけ（$0$ でない素イデアルは $\mathfrak{m}$ のみで、$a\neq 0$）なので、$\mathrm{nil}(A/(a))=\mathfrak{m}/(a)$。$A/(a)$ はネーターなので冪零（\ref{ring:noetherian-prime-product.3}）：$\mathfrak{m}^{n}\subset(a)$ となる最小の $n\ge 1$ をとる。$n=1$ なら $\mathfrak{m}=(a)$ で終わり。
- $n\ge 2$ とし、$b\in\mathfrak{m}^{n-1}\setminus(a)$ をとり、$y\defeq a/b\in K$ とおく。$b\notin(a)$ なので $y^{-1}=b/a\notin A$。$b\mathfrak{m}\subset\mathfrak{m}^{n}\subset(a)$ なので $y^{-1}\mathfrak{m}\subset A$。
- $y^{-1}\mathfrak{m}\subset\mathfrak{m}$ なら、$\mathfrak{m}$ は $A[y^{-1}]$ 加群として忠実（$K$ の部分集合なので、$0$ でない元を掛けても $0$ にならない）で $A$ 上有限生成なので、\ref{ring:integral-criterion.4} から $y^{-1}$ は $A$ 上整、正規性から $y^{-1}\in A$ となり矛盾。よって $y^{-1}\mathfrak{m}$ は $\mathfrak{m}$ に含まれない $A$ のイデアルで、局所環の真のイデアルは $\mathfrak{m}$ に含まれるので $y^{-1}\mathfrak{m}=A$。すなわち $\mathfrak{m}=yA$ で、極大イデアルは単項。

::: hypcheck
- **選択公理**：Step 5 の中山の補題で使う（局所環の極大イデアルがジャコブソン根基であること）。$\mathfrak{m}$ が非単元全体であることを前提にすれば不要。
- **5 の各条件**：「正規」は Step 5 の最後で、「\term[次元]{ring:krull-dimension} $1$」は $\mathrm{nil}(A/(a))=\mathfrak{m}/(a)$ で、「ネーター」は冪零性と $\mathfrak{m}$ の有限生成性で使った。正規を外すと偽：$K[[t^{2},t^{3}]]$ はネーター局所整域で次元 $1$ だが、極大イデアル $(t^{2},t^{3})$ は単項でない。
:::
:::

::: supplement
**$p$ 進整数.** $\Z_{(p)}$ を $p$ 進位相で完備化した $\Z_{p}$（$p$ 進整数環）も DVR で、一意化元は $p$（\ref{ring:page-completion}）。完備な DVR は整数論で基本的な役割を果たす。

**付値環の存在（シュヴァレー）.** 体 $K$ の部分環 $A$ と素イデアル $\mathfrak{p}$ について、$A_{\mathfrak{p}}\subset V$ で $V$ の極大イデアルが $\mathfrak{p}$ の上にある付値環 $V$ が存在する（ツォルンの補題による）。帰結として、整域 $A$ の正規化は $A$ を含む商体の付値環すべての共通部分に等しい（Atiyah–Macdonald 第 5 章）。

**高い視点.** DVR は代数曲線の非特異点での局所環（$\mathcal{O}_{C,P}$）で、付値は「点 $P$ での零点・極の位数」にほかならない。\ref{ring:dvr-characterization.5} は「1 \term[次元]{ring:krull-dimension}の正規ネーター局所整域は非特異」、すなわち「正規な曲線は非特異」という幾何的事実の代数版である（高次元では正規 ⇏ 非特異）。
:::

## 問題 {#ring:sec-vr-problems}

::: problem {#ring:prob-dvr-ideals}
DVR $A$（一意化元 $t$）のイデアルは $0$ と $t^{n}A$（$n\ge 0$）で、$A/t^{n}A$ は長さ $n$ の加群（$\mathfrak{m}$ 進フィルトレーションの各段が剰余体）であることを示せ。
:::

::: solution
前半は \ref{ring:dvr-characterization} の証明の Step 1。$t^{k}A/t^{k+1}A$（$0\le k<n$）は $a\mapsto t^{k}a$ による $A\to t^{k}A/t^{k+1}A$ が全射で核が $tA$ なので $A/\mathfrak{m}$ に同型。よって $A/t^{n}A\supset tA/t^{n}A\supset\dots\supset 0$ は剰余体を因子とする長さ $n$ の組成列。
:::

::: problem {#ring:prob-valuation-ring-not-noetherian}
付値環 $V$ がネーターでないことと、ある $0$ でない非単元 $x$ について $\bigcap_{n}x^{n}V\neq 0$ となるか、極大イデアルが単項でないことは同値であることを示せ。（ヒント：ネーターな付値環は DVR。）
:::

::: solution
ネーターなら DVR（\ref{ring:dvr-characterization.2}⇒1）で、極大イデアルは単項、\ref{ring:principal-intersection} から $\bigcap x^{n}V=0$（$x\in\mathfrak{m}$ なら $x^{n}V\subset t^{n}V$）。逆に極大イデアル $\mathfrak{m}=tV$ が単項で、すべての $0\neq x\in\mathfrak{m}$ で $\bigcap x^{n}V=0$ なら、特に $\bigcap t^{n}V=0$ で、\ref{ring:dvr-characterization} の Step 4 と同じ議論（$0\neq x$ は $t^{n}u$）から $V$ は DVR でネーター。
:::
