# プリューファー整域 {#ring:page-prufer keywords="Prufer domain, finitely generated ideals are invertible, local characterization by valuation rings, torsion-free modules are flat, invertible ideals in a UFD are principal"}

デデキント環は「$0$ でないイデアルがすべて可逆」な整域だった（\ref{ring:dedekind-invertible}）。この条件を**有限生成**イデアルに限ったものが**プリューファー整域**である（\ref{ring:prufer}）。デデキント環からネーター性を外したもの、あるいは付値環を局所的な部品として貼り合わせたもの（\ref{ring:prufer-characterization}）と考えることができ、ベズー整域・デデキント環・付値環をすべて含む広いクラスをなす。このページでは、局所化による特徴付け、ネーターなプリューファー整域がデデキント環であること、一意分解環でもあるプリューファー整域が PID であること（\ref{ring:prufer-ufd}）、プリューファー整域上ではねじれのない加群が平坦であること（\ref{ring:prufer-flat}）を示す。

> Gilmer *Multiplicative Ideal Theory* と松村『可換環論』の演習の内容を、資料のテキストによらず自分で組み立てた（Gilmer は本棚になく目次のみ）。

## 記法と定義の確認 {#ring:sec-pf-notation}

::: notation
- 環は可換、$A$ は整域、$K=\Frac A$。分数イデアル・可逆性とその局所的判定は \ref{ring:fractional-ideal}, \ref{ring:invertible-properties}, \ref{ring:invertible-local}。付値環とその性質は \ref{ring:valuation-ring}, \ref{ring:valuation-properties}。ベズー整域は \ref{ring:bezout-domain}、デデキント環は \ref{ring:dedekind}、平坦性のイデアルによる判定は \ref{mod:flat-ideal-criterion}、局所的性質は \ref{ring:local-properties}。
- **選択公理**：局所的性質（極大イデアルの存在）と平坦性の判定（ベールの判定法）を通して使う。
:::

## 定義と特徴付け {#ring:sec-pf-definition}

::: definition プリューファー整域 {#ring:prufer keywords="Prufer domain" index="プリューファー整域|ぷりゅーふぁーせいいき"}
$0$ でない有限生成イデアルがすべて可逆である整域を**プリューファー整域**という。
:::

::: lemma 局所ベズー整域は付値環 {#ring:local-bezout-valuation keywords="a local Bezout domain is a valuation ring" index="局所ベズー整域|きょくしょべずーせいいき"}
局所整域 $A$ がベズー整域（有限生成イデアルが単項）なら、$A$ は付値環である。
:::

::: proof
$0\neq x=a/b\in K$（$a,b\in A$）をとる。$(a,b)=(d)$ と書くと $a=da'$, $b=db'$ で、$d=ra+sb$ から $1=ra'+sb'$（$d\neq 0$ で簡約）。局所環なので $ra'$ と $sb'$ のどちらかは単元（両方が極大イデアルに属すると和の $1$ も属する）。$ra'$ が単元なら $a'$ は単元で $x^{-1}=b'/a'\in A$。$sb'$ が単元なら $b'$ は単元で $x=a'/b'\in A$。
:::

::: theorem プリューファー整域の特徴付け {#ring:prufer-characterization keywords="Prufer iff localizations at primes are valuation rings iff localizations at maximal ideals are valuation rings" index="プリューファー整域の特徴付け|ぷりゅーふぁーせいいきのとくちょうづけ"}
（AC）整域 $A$ について、次は同値である。
1. $A$ はプリューファー整域。
2. すべての素イデアル $\mathfrak{p}$ で $A_{\mathfrak{p}}$ は付値環。
3. すべての極大イデアル $\mathfrak{m}$ で $A_{\mathfrak{m}}$ は付値環。

特にプリューファー整域は正規環である。
:::

::: proof
**Step 1（1⇒3）.** $A_{\mathfrak{m}}$ の有限生成イデアルは $A$ の有限生成イデアル $I$ の拡大 $IA_{\mathfrak{m}}$ である（生成元の分子をとる。\ref{ring:localization-ideals}）。$I$ は可逆なので $IA_{\mathfrak{m}}$ も可逆で（$IJ=A\Rightarrow I_{\mathfrak{m}}J_{\mathfrak{m}}=A_{\mathfrak{m}}$）、局所整域なので単項（\ref{ring:invertible-properties.3}）。よって $A_{\mathfrak{m}}$ は局所ベズー整域で、\ref{ring:local-bezout-valuation} から付値環。

**Step 2（3⇒1）.** $0\neq I$ を有限生成イデアルとする。各 $\mathfrak{m}$ で $I_{\mathfrak{m}}$ は付値環の有限生成イデアルなので単項（\ref{ring:valuation-properties.1}）。\ref{ring:invertible-local} から $I$ は可逆。

**Step 3（2⇔3）.** 2⇒3 は明らか。3⇒2：素イデアル $\mathfrak{p}$ を含む極大イデアル $\mathfrak{m}$ をとると、$A_{\mathfrak{p}}$ は $A_{\mathfrak{m}}$ の素イデアル $\mathfrak{p}A_{\mathfrak{m}}$ での局所化で、$A_{\mathfrak{m}}\subset A_{\mathfrak{p}}\subset K$ なので付値環（\ref{ring:valuation-properties.4}）。

**Step 4（正規）.** 付値環は正規（\ref{ring:valuation-properties.3}）で、正規性は局所的（\ref{ring:integral-localization.3}）。
:::

::: proposition プリューファー整域と他のクラス {#ring:prufer-classes keywords="Bezout implies Prufer, Dedekind implies Prufer, Noetherian Prufer is Dedekind, valuation rings are Prufer" index="プリューファー整域とデデキント環|ぷりゅーふぁーせいいきとでできんとかん"}
（AC）
1. ベズー整域（特に付値環と PID）とデデキント環はプリューファー整域である。
2. ネーターなプリューファー整域はデデキント環である。
3. 局所的なプリューファー整域は付値環である。
:::

::: proof
**Step 1（1）.** ベズー整域の $0$ でない有限生成イデアルは単項 $aA$ で、逆 $a^{-1}A$ をもつ。デデキント環は \ref{ring:dedekind-invertible}。

**Step 2（2）.** ネーターならすべてのイデアルが有限生成なので、すべての $0$ でないイデアルが可逆で、\ref{ring:dedekind-invertible} からデデキント環。

**Step 3（3）.** 局所環 $(A,\mathfrak{m})$ なら $A=A_{\mathfrak{m}}$（\ref{ring:prufer-characterization.3}）。
:::

## イデアルの束の分配性 {#ring:sec-pf-distributive}

::: theorem 分配的なイデアルの束 {#ring:prufer-distributive keywords="a domain is Prufer iff its lattice of ideals is distributive, arithmetical ring" index="分配的なイデアルの束|ぶんぱいてきないであるのそく"}
（AC）整域 $A$ について、次は同値である。
1. $A$ はプリューファー整域。
2. $A$ のすべてのイデアル $I,J,K$ について $I\cap(J+K)=I\cap J+I\cap K$。
:::

::: proof
**Step 1（1⇒2：局所化に帰着）.** $N\defeq I\cap J+I\cap K\subset M\defeq I\cap(J+K)$ は常に成り立つ（\ref{ring:ideal-lattice-laws.3}）。局所化は有限個の和・共通部分・剰余と交換するので（\ref{ring:localization-operations.1}）、極大イデアル $\mathfrak{m}$ について
$$
(M/N)_{\mathfrak{m}}\cong M_{\mathfrak{m}}/N_{\mathfrak{m}},\quad M_{\mathfrak{m}}=I_{\mathfrak{m}}\cap(J_{\mathfrak{m}}+K_{\mathfrak{m}}),\quad N_{\mathfrak{m}}=I_{\mathfrak{m}}\cap J_{\mathfrak{m}}+I_{\mathfrak{m}}\cap K_{\mathfrak{m}}.
$$

**Step 2（1⇒2：全順序なら分配的）.** \ref{ring:prufer-characterization} から $A_{\mathfrak{m}}$ は付値環で、そのイデアルは全順序（\ref{ring:valuation-properties.1}）。$J_{\mathfrak{m}}\subset K_{\mathfrak{m}}$ としてよい（対称）。すると $J_{\mathfrak{m}}+K_{\mathfrak{m}}=K_{\mathfrak{m}}$ で $M_{\mathfrak{m}}=I_{\mathfrak{m}}\cap K_{\mathfrak{m}}$、また $I_{\mathfrak{m}}\cap J_{\mathfrak{m}}\subset I_{\mathfrak{m}}\cap K_{\mathfrak{m}}$ なので $N_{\mathfrak{m}}=I_{\mathfrak{m}}\cap K_{\mathfrak{m}}$。よって $(M/N)_{\mathfrak{m}}=0$ がすべての $\mathfrak{m}$ で成り立ち、局所的性質（\ref{ring:local-properties.1}）から $M=N$。

**Step 3（2⇒1：分配性から分解を作る）.** 極大イデアル $\mathfrak{m}$ と $0\neq x\in K$ をとり、$x=a/b$（$a,b\in A\setminus\{0\}$）と書く。$I=(a)$, $J=(b)$, $L=(a-b)$ に 2 を使う。$a=b+(a-b)\in J+L$ なので $a\in I\cap(J+L)=I\cap J+I\cap L$。したがって
$$
a=sb+r(a-b),\qquad sb\in(a),\quad r(a-b)\in(a)
$$
となる $r,s\in A$ がある。$r(a-b)=ta$（$t\in A$）と書く。

**Step 4（2⇒1：場合分け）.**
- $r\notin\mathfrak{m}$ のとき：$r$ は $A_{\mathfrak{m}}$ の単元で、$a-b=r^{-1}ta$ から $b=(1-r^{-1}t)a$。$a\neq 0$ で割って $x^{-1}=b/a=1-r^{-1}t\in A_{\mathfrak{m}}$。
- $r\in\mathfrak{m}$ のとき：$1-r\notin\mathfrak{m}$（さもないと $1\in\mathfrak{m}$）なので $1-r$ は $A_{\mathfrak{m}}$ の単元。$a=sb+r(a-b)$ を整理して $(1-r)a=(s-r)b$ なので $x=a/b=(1-r)^{-1}(s-r)\in A_{\mathfrak{m}}$。

よって $A_{\mathfrak{m}}$ は付値環（\ref{ring:valuation-ring}）で、\ref{ring:prufer-characterization.3}⇒1 から $A$ はプリューファー整域。

::: hypcheck
- **前提「整域」**：Step 3 で商体の元 $x=a/b$ をとり、Step 4 で $a$ や $b$ で割るのに使った（プリューファー整域・付値環の定義が整域を前提とする）。整域でない場合の一般化は下の補足。
- **選択公理**：Step 2 の局所的性質（極大イデアルの存在）と、\ref{ring:prufer-characterization} を通して使う。
- 2⇒1 では、分配法則を $I=(a)$, $J=(b)$, $L=(a-b)$ という単項イデアルにしか使っていない。したがって「単項イデアルについての分配法則」だけで $A$ はプリューファーになる。
:::
:::

::: supplement
**整域でない場合.** 同じ証明で、可換環 $A$ について「イデアルの束が分配的 $\iff$ すべての極大イデアル $\mathfrak{m}$ で $A_{\mathfrak{m}}$ のイデアルが全順序」が示せる。Step 4 を $x$ を使わずに書けば、$A_{\mathfrak{m}}$ で $a\in(b)$ または $b\in(a)$ が得られ、単項イデアルが全順序ならイデアル全体も全順序になる（$I\not\subset J$ なら $a\in I\setminus J$ をとると、各 $b\in J$ で $(a)\not\subset(b)$ なので $(b)\subset(a)\subset I$、すなわち $J\subset I$）。このような環は**算術環**（arithmetical ring）と呼ばれる。$\Z/n\Z$ は算術環で（\ref{ring:prob-z-distributive} と同じ議論）、$k[x,y]$ は算術環でなく（\ref{ring:ideal-nondistributive}）、局所環 $k[x,y]/(x,y)^{2}$ も $\bar x$ と $\bar y$ の生成する単項イデアルが比較不能なので算術環でない。
:::

## 一意分解環との関係 {#ring:sec-pf-ufd}

::: lemma 一意分解環の可逆イデアルは単項 {#ring:ufd-invertible-principal keywords="invertible ideals of a UFD are principal" index="一意分解環の可逆イデアル|いちいぶんかいかんのかぎゃくいである"}
一意分解環（より一般に GCD 整域）の可逆イデアルは単項である。
:::

::: proof
**Step 1.** 可逆イデアル $I$ は有限生成（\ref{ring:invertible-properties.2}）：$I=(a_{1},\dots,a_{n})$。$d\defeq\gcd(a_{1},\dots,a_{n})$（GCD 整域で、二元の場合を繰り返して存在）とし、$J\defeq d^{-1}I=(a'_{1},\dots,a'_{n})$, $a'_{i}=a_{i}/d$ とおく。$\gcd(a'_{1},\dots,a'_{n})=1$（\ref{ring:gcd-properties.1}）。$J$ も可逆。

**Step 2.** $J^{-1}=(A:J)\supset A$。$x\in J^{-1}$ を既約分数 $x=r/s$（$\gcd(r,s)=1$）と書くと、すべての $i$ で $xa'_{i}\in A$、すなわち $s\mid ra'_{i}$。ユークリッドの補題（\ref{ring:gcd-properties.2}）から $s\mid a'_{i}$ で、$\gcd(a'_{i})=1$ なので $s$ は単元、$x\in A$。よって $J^{-1}=A$ で $J=JJ^{-1}=A$、すなわち $I=dA$。
:::

::: theorem 一意分解環であるプリューファー整域 {#ring:prufer-ufd keywords="a Prufer UFD is a PID, Prufer GCD domain is Bezout" index="一意分解的なプリューファー整域|いちいぶんかいてきなぷりゅーふぁーせいいき"}
（DC）GCD 整域であるプリューファー整域はベズー整域である。一意分解環であるプリューファー整域は PID である。
:::

::: proof
有限生成イデアルは可逆（プリューファー）なので単項（\ref{ring:ufd-invertible-principal}）：ベズー整域。一意分解環なら ACCP をみたすので、ベズー整域と合わせて PID（\ref{ring:bezout-accp-pid}）。
:::

## ねじれのない加群の平坦性 {#ring:sec-pf-flat}

::: theorem プリューファー整域上の平坦加群 {#ring:prufer-flat keywords="over a Prufer domain, torsion-free modules are flat" index="プリューファー整域上の平坦加群|ぷりゅーふぁーせいいきじょうのへいたんかぐん"}
（AC）プリューファー整域 $A$ 上の加群が平坦であることと、ねじれがない（$am=0$, $a\neq 0$ なら $m=0$）ことは同値である。
:::

::: proof
**Step 1（平坦 ⇒ ねじれなし）.** $a\neq 0$ について $A\xrightarrow{a}A$ は単射なので、平坦性から $M\xrightarrow{a}M$ が単射（\ref{mod:flat-z} の Step 1 と同じ。整域なら一般に成り立つ）。

**Step 2（局所化）.** ねじれのない $M$ について、平坦性は局所的（\ref{ring:local-properties.3}）なので、各 $\mathfrak{m}$ で $M_{\mathfrak{m}}$ が平坦な $A_{\mathfrak{m}}$ 加群であることを示せばよい。$M_{\mathfrak{m}}$ もねじれがない（$\frac{a}{s}\cdot\frac{m}{t}=0$ なら $uam=0$, $u\neq 0$ なので $m=0$）。

**Step 3（付値環上）.** $V=A_{\mathfrak{m}}$ は付値環で、有限生成イデアルは単項 $aV$。$a\neq 0$ について $aV\otimes_{V}N\to N$ は、$aV\cong V$（$x\mapsto ax$）を通して $N\xrightarrow{a}N$ と同一視され、ねじれがなければ単射。$a=0$ なら自明。平坦性のイデアルによる判定（\ref{mod:flat-ideal-criterion.3}）から $N=M_{\mathfrak{m}}$ は平坦。
:::

::: supplement
**逆と特徴付けの一覧.** 逆に「ねじれのない加群がすべて平坦」な整域はプリューファー整域であり、プリューファー整域は「イデアルの束が分配的（$I\cap(J+L)=I\cap J+I\cap L$）」「有限生成ねじれなし加群が射影的」など、数十通りの同値な条件で特徴付けられることが知られている（Gilmer *Multiplicative Ideal Theory* に詳しい）。

**例.** 一意分解環でもネーター環でもないプリューファー整域として、全代数的整数環（代数的整数全体。ベズー整域であることが知られている）や、整数値多項式環 $\operatorname{Int}(\Z)=\{f\in\Q[x] : f(\Z)\subset\Z\}$（\term[次元]{ring:krull-dimension} $2$ のプリューファー整域で、ベズー整域でないことが知られている）がある。

**包含のまとめ.** PID $\subset$ ベズー整域 $\subset$ プリューファー整域、PID $\subset$ デデキント環 $\subset$ プリューファー整域、付値環 $\subset$ ベズー整域、ネーター $\cap$ プリューファー $=$ デデキント、UFD $\cap$ プリューファー $=$ PID。全体の図は \ref{ring:page-classification}。
:::

## 問題 {#ring:sec-pf-problems}

::: problem {#ring:prob-prufer-overring}
プリューファー整域 $A$ と、$A\subset B\subset K$ となる環 $B$ について、$B$ もプリューファー整域であることを示せ。
:::

::: solution
$B$ の極大イデアル $\mathfrak{n}$ について $\mathfrak{p}\defeq\mathfrak{n}\cap A$ は素イデアルで、$A_{\mathfrak{p}}\subset B_{\mathfrak{n}}$（$A\setminus\mathfrak{p}$ の元は $B\setminus\mathfrak{n}$ に属し $B_{\mathfrak{n}}$ で単元）。$A_{\mathfrak{p}}$ は付値環（\ref{ring:prufer-characterization.2}）なので、それを含む $B_{\mathfrak{n}}\subset K$ も付値環（\ref{ring:valuation-properties.4}）。\ref{ring:prufer-characterization.3} から $B$ はプリューファー整域。（デデキント環 $A$ の上の環は、ネーターなら再びデデキント環になる。）
:::

::: problem {#ring:prob-prufer-not-bezout}
$\Z[\sqrt{-5}]$ はプリューファー整域だがベズー整域でないことを示せ。
:::

::: solution
デデキント環（\ref{ring:z-sqrt-minus-5-dedekind}）なのでプリューファー整域（\ref{ring:prufer-classes.1}）。有限生成イデアル $(2,1+\sqrt{-5})$ は単項でない（同じ命題の Step 4）ので、ベズー整域でない。
:::
