# 付値環・デデキント環と正規性（Valuation Rings, Dedekind Domains & Normality）

付値環と離散付値環、デデキント環、整閉包の有限性とクルル＝秋月の定理・正規性の判定、プリューファー整域、整域の分類（体 ⊂ ユークリッド環 ⊂ PID ⊂ UFD ⊂ …）、剰余・多項式環・冪級数環・直積・テンソル積・局所化での性質の保存表と反例集。可換環論（局所化・中山の補題・ネーター環・整拡大・次元論）を前提にする。PID・UFD・ガウスの補題・GCD 整域は環の基礎の系列にある。

<p class="mn-msc">MSC2020: 13F, 13G</p>
