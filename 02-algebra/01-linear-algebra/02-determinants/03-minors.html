# 小行列式と階数 {#lin:page-minors keywords="minors, submatrices X_{I,J}, Cauchy-Binet formula, determinant of AB for rectangular matrices, rank equals the largest size of a nonzero minor, surjectivity criterion via maximal minors, determinantal ideals, Fitting ideals, invariance under invertible matrices, determinantal divisors and Smith normal form, generalized Laplace expansion, Jacobi complementary minor theorem, minors of the adjugate, Desnanot-Jacobi identity, Dodgson condensation, adjugate of a product"}

行列の小行列式は、積について**コーシー–ビネの公式** $\det(AB)_{I,J}=\sum_{K}\det A_{I,K}\det B_{K,J}$ に従う。体上では、階数は 0 でない小行列式の最大のサイズに等しい。可換環上では $k$ 次小行列式の生成するイデアル（**行列式イデアル**）が可逆行列による変形で不変で、PID 上ではスミス標準形の単因子の積を与える。ほかに、一般化されたラプラス展開、余因子行列の小行列式についてのヤコビの定理と、そこから従うデスナノ–ヤコビの恒等式（ドジソンの凝縮法）を示す。

> 体を使うのは階数の部分だけで、他は可換環上で述べる。

## 記法と定義の確認 {#lin:sec-mi-notation}

::: notation
- 行列式の特徴付け・乗法性・余因子展開・余因子行列・ブロック行列と、多項式環への一般化の技法は \ref{lin:det-characterization}, \ref{lin:det-multiplicative}, \ref{lin:cofactor-expansion}, \ref{lin:adjugate}, \ref{lin:block-determinant}（Step 4）, \ref{lin:sylvester-identity}。交代性の帰結は \ref{lin:alternating-consequences}、置換の符号と転倒数は \ref{grp:sign-value}。
- 階数・行の階数＝列の階数・簡約階段形は \ref{lin:rank-nullity}, \ref{lin:dual-properties}, \ref{lin:rref-existence-uniqueness}。スミス標準形は \ref{mod:smith-normal-form}。
- $X\in M_{m\times n}(A)$ と、$I\subset\{1..m\}$, $J\subset\{1..n\}$（$|I|=|J|=k$）について、$X_{I,J}$ は行 $I$・列 $J$ の部分行列（元の順序で並べる）、$\det X_{I,J}$ を $k$ 次の**小行列式**という。$I^{c}$ は補集合、$\Sigma I\defeq\sum_{i\in I}i$。$[m]\defeq\{1,\dots,m\}$。
- **一般の行列の技法**：成分についての多項式恒等式は、成分を不定元とする整域 $\mathbb{Z}[x_{ij}]$（その商体で行列は可逆）で示せば、任意の可換環に代入して成り立つ（\ref{lin:block-determinant} の補足）。
- **選択公理**：使わない。
:::

## コーシー–ビネの公式 {#lin:sec-mi-cauchy-binet}

::: theorem コーシー–ビネの公式 {#lin:cauchy-binet keywords="Cauchy-Binet: det(AB) = sum over K of det A_{[m],K refname="コーシー–ビネの公式"} det B_{K,[m]} for A m x n, B n x m; zero if m > n; minors of a product" index="コーシー–ビネの公式|こーしーびねのこうしき"}
$X\in M_{m\times n}(A)$, $Y\in M_{n\times m}(A)$ について
$$
\det(XY)=\sum_{K\subset[n],\,|K|=m}\det X_{[m],K}\,\det Y_{K,[m]}.
$$
とくに $m>n$ なら $\det(XY)=0$。より一般に、$X\in M_{m\times n}$, $Y\in M_{n\times p}$, $|I|=|J|=k$ について $\det(XY)_{I,J}=\sum_{|K|=k}\det X_{I,K}\det Y_{K,J}$。
:::

::: proof
**Step 1（列の展開）.** $XY$ の第 $j$ 列は $\sum_{l}y_{lj}x_{l}$（$x_{l}$ は $X$ の第 $l$ 列）。列についての多重線形性から
$$
\det(XY)=\sum_{\phi:[m]\to[n]}\Bigl(\prod_{j}y_{\phi(j)j}\Bigr)\det(x_{\phi(1)},\dots,x_{\phi(m)}).
$$
$\phi$ が単射でなければ等しい列があり $0$。$m>n$ なら単射はないので $0$。

**Step 2（像で分類）.** 単射 $\phi$ を像 $K$ と、$K$ の元を小さい順に並べた $\kappa:[m]\to K$ と $\sigma\in S_{m}$ で $\phi=\kappa\circ\sigma$ と一意に書く。\ref{lin:alternating-consequences.1} から $\det(x_{\kappa\sigma(1)},\dots)=\operatorname{sgn}(\sigma)\det X_{[m],K}$。よって $K$ ごとの和は $\det X_{[m],K}\sum_{\sigma}\operatorname{sgn}\sigma\prod_{j}y_{\kappa\sigma(j)j}=\det X_{[m],K}\det Y_{K,[m]}$（ライプニッツの式）。

**Step 3（一般の小行列式）.** $(XY)_{I,J}=X_{I,[n]}Y_{[n],J}$ に Step 1・2 を使う。
:::

::: corollary 小行列式のイデアルの不変性 {#lin:fitting-ideals keywords="determinantal ideals I_k(X) generated by k x k minors; I_k(XY) subset I_k(X) cap I_k(Y); invariance under multiplication by invertible matrices; determinantal divisors equal products of invariant factors over a PID" index="行列式イデアル|ぎょうれつしきいである, 行列式因子|ぎょうれつしきいんし"}
$I_{k}(X)\subset A$ を $X$ の $k$ 次小行列式で生成されるイデアルとする（$I_{0}=A$、$k$ が行数・列数を超えれば $0$）。
1. $I_{k}(XY)\subset I_{k}(X)\cap I_{k}(Y)$。とくに $P,Q$ が可逆なら $I_{k}(PXQ)=I_{k}(X)$。
2. $A$ が PID で、$X$ のスミス標準形の対角成分を $d_{1}\mid d_{2}\mid\cdots$ とすると、$I_{k}(X)=(d_{1}d_{2}\cdots d_{k})$。したがって単因子 $d_{k}$ は（単元倍を除いて）$X$ だけで決まる。
:::

::: proof
**Step 1（1）.** \ref{lin:cauchy-binet} の一般形から $(XY)$ の $k$ 次小行列式は $X$ の（あるいは $Y$ の）$k$ 次小行列式の $A$ 係数の一次結合。可逆なら $X=P^{-1}(PXQ)Q^{-1}$ で逆の包含。

**Step 2（2）.** 1 から $I_{k}(X)=I_{k}(\operatorname{diag}(d_{1},\dots))$。対角行列の $k$ 次小行列式は、行と列の番号の集合が同じでなければ $0$（同じでない行に対応する列が $0$）、同じなら $\prod_{i\in I}d_{i}$。$d_{1}\mid d_{2}\mid\cdots$ から、これらはすべて $d_{1}\cdots d_{k}$ の倍数で、$I=[k]$ でちょうど $d_{1}\cdots d_{k}$。生成元の比 $d_{k}=(d_{1}\cdots d_{k})/(d_{1}\cdots d_{k-1})$ は単元倍を除いて決まる（$d_{1}\cdots d_{k-1}\neq0$ のとき；$0$ ならそれ以降はすべて $0$）。
:::

## 小行列式と階数 {#lin:sec-mi-rank}

::: theorem 階数と小行列式 {#lin:rank-minors keywords="over a field, rank X is the largest k with a nonzero k x k minor; a linear map k^M -> k^N is surjective iff some N x N minor is nonzero; rank is lower semicontinuous" index="階数と小行列式|かいすうとしょうぎょうれつしき"}
体 $k$ 上の $X\in M_{m\times n}(k)$ について
1. $\operatorname{rank}X=\max\{r : X\text{ に }0\text{ でない }r\text{ 次小行列式がある}\}$。
2. とくに $x\mapsto Xx$ が全射 $\iff$ $0$ でない $m$ 次小行列式がある。単射 $\iff$ $0$ でない $n$ 次小行列式がある。
:::

::: proof
**Step 1（$\ge$）.** $\det X_{I,J}\neq0$（$|I|=|J|=r$）なら $X_{I,J}$ は可逆（\ref{lin:adjugate}）で、その列は一次独立。$X$ の列 $J$ は、行 $I$ に制限したものが一次独立なので一次独立。よって $\operatorname{rank}X\ge r$。

**Step 2（$\le$）.** $r=\operatorname{rank}X$ とし、一次独立な $r$ 個の列 $J$ を選ぶ。$X_{[m],J}$ は階数 $r$ で、行の階数＝列の階数（\ref{lin:dual-properties.4}）から一次独立な $r$ 個の行 $I$ がある。$X_{I,J}$ は $r\times r$ で行が一次独立、すなわち可逆で、$\det X_{I,J}\neq0$（\ref{lin:det-elimination}）。

**Step 3（2）.** 全射 $\iff\operatorname{rank}=m$、単射 $\iff\operatorname{rank}=n$（\ref{lin:rank-nullity}）。
:::

::: remark 可換環上の階数
可換環 $A$ 上では、$\operatorname{rank}$ の代わりに行列式イデアル $I_{k}(X)$ の列が基本的な不変量になる。$A^{n}\to A^{m}$ の余核 $M$ について $I_{k}(X)$ は $M$ の**フィッティング・イデアル** $\operatorname{Fitt}_{m-k}(M)$ で、表示によらないことが知られている（本サイト未収録）。また $X\in M_{m\times n}(A)$ について $Xy=0$ が $0$ でない解をもつ $\iff$ $I_{n}(X)$ の零化イデアルが $0$ でない（**マッコイの定理**）ことが知られている（本サイト未収録。正方行列では「$\det X$ が零因子」と同値になる）。
:::

## 一般化されたラプラス展開 {#lin:sec-mi-laplace}

::: theorem 一般化されたラプラス展開 {#lin:laplace-expansion keywords="Laplace expansion along a set of k rows: det X = sum over J of (-1)^{Sigma I + Sigma J} det X_{I,J} det X_{I^c,J^c}" index="ラプラス展開|らぷらすてんかい"}
$X\in M_{n}(A)$ と $I\subset[n]$（$|I|=k$）を固定すると
$$
\det X=\sum_{J\subset[n],\,|J|=k}(-1)^{\Sigma I+\Sigma J}\det X_{I,J}\det X_{I^{c},J^{c}}.
$$
:::

::: proof
**Step 1（シャッフルの符号）.** $I=\{i_{1}<\dots<i_{k}\}$ について、$I$ の元を先頭に順序を保って移し、$I^{c}$ の元をその後に順序を保って並べる置換を $\rho_{I}$（$\rho_{I}(t)=i_{t}$ ($t\le k$) などと読む）とする。転倒数は $\sum_{t}(i_{t}-t)$（$i_{t}$ より小さい $I^{c}$ の元の個数）なので $\operatorname{sgn}\rho_{I}=(-1)^{\Sigma I-k(k+1)/2}$（\ref{grp:sign-value}）。

**Step 2（行と列の並べ替え）.** $X'\defeq P_{\rho_{I}}^{-1}XP_{\rho_{J}}$（行 $I$ を上に、列 $J$ を左に寄せた行列）は $\det X'=\operatorname{sgn}\rho_{I}\operatorname{sgn}\rho_{J}\det X=(-1)^{\Sigma I+\Sigma J}\det X$（$k(k+1)$ は偶数）。$X'$ の左上 $k\times k$ は $X_{I,J}$、右下は $X_{I^{c},J^{c}}$。

**Step 3（行の展開）.** ライプニッツの式（行の形）$\det X=\sum_{\pi}\operatorname{sgn}\pi\prod_{i}x_{i\pi(i)}$ の項を $J\defeq\pi(I)$ で分類する。$J$ を固定すると、$\pi$ は全単射 $I\to J$ と $I^{c}\to J^{c}$ の組と一対一で、Step 2 の並べ替えのもとで $\pi$ は $X'$ のブロック対角の置換 $\pi_{1}\times\pi_{2}$ に対応し、$\operatorname{sgn}\pi=\operatorname{sgn}\rho_{I}\operatorname{sgn}\rho_{J}\operatorname{sgn}\pi_{1}\operatorname{sgn}\pi_{2}$。よって $J$ ごとの和は $(-1)^{\Sigma I+\Sigma J}\det X_{I,J}\det X_{I^{c},J^{c}}$（\ref{lin:block-determinant} の Step 1 と同じ分解）。
:::

## 余因子行列の小行列式 {#lin:sec-mi-jacobi}

::: theorem ヤコビの定理と積の余因子行列 {#lin:jacobi-complementary keywords="adj(XY) = adj(Y) adj(X); Jacobi: principal minor of the adjugate det(adj X)_{I,I} = det(X)^{k-1} det X_{I^c, I^c}" index="ヤコビの定理（小行列式）|やこびのていりしょうぎょうれつしき, 補小行列式|ほしょうぎょうれつしき"}
$X,Y\in M_{n}(A)$ について
1. $\operatorname{adj}(XY)=\operatorname{adj}(Y)\operatorname{adj}(X)$。
2. $I\subset[n]$, $|I|=k\ge1$ について $\det(\operatorname{adj}X)_{I,I}=(\det X)^{k-1}\det X_{I^{c},I^{c}}$（$k=n$ では $\det X_{\emptyset,\emptyset}=1$）。
:::

::: proof
**Step 1（1）.** 一般の行列の技法で $X,Y$ を $\mathbb{Q}(x_{ij},y_{ij})$ 上の可逆行列としてよい。$\operatorname{adj}X=\det(X)X^{-1}$（\ref{lin:adjugate}）から $\operatorname{adj}(XY)=\det(XY)(XY)^{-1}=\det Y\,Y^{-1}\det X\,X^{-1}$。

**Step 2（2：$I=[k]$）.** $Z\defeq\operatorname{adj}X$ とし、$W$ を「第 $1..k$ 列が $Z$ の第 $1..k$ 列、第 $k+1..n$ 列が $e_{k+1},\dots,e_{n}$」の行列とする。$XZ=\det(X)I$ なので
$$
XW=\begin{pmatrix}\det(X)I_{k}&X_{[k],[k]^{c}}\\0&X_{[k]^{c},[k]^{c}}\end{pmatrix}.
$$
$W$ はブロック下三角（右上が $0$）で $\det W=\det Z_{[k],[k]}$。ブロック三角の行列式と乗法性から $\det X\det Z_{[k],[k]}=(\det X)^{k}\det X_{[k]^{c},[k]^{c}}$。一般の行列の技法で $\det X$ は非零因子なので割れる。

**Step 3（2：一般の $I$）.** 置換行列 $P$ について $\operatorname{adj}(PXP^{-1})=\operatorname{adj}(P^{-1})\operatorname{adj}(X)\operatorname{adj}(P)=P\operatorname{adj}(X)P^{-1}$（1 と、$\operatorname{adj}P=\det(P)P^{-1}$, $\det P\det P^{-1}=1$）。$I$ を先頭に移す $P$ をとれば、主小行列式は同時に並べ替わるので、Step 2 に帰着する。
:::

::: corollary デスナノ–ヤコビの恒等式 {#lin:desnanot-jacobi keywords="Desnanot-Jacobi identity det X det X_{1n,1n} = det X_{11} det X_{nn} - det X_{1n} det X_{n1}; Dodgson condensation; Lewis Carroll" index="デスナノ–ヤコビの恒等式|ですなのやこびのこうとうしき, ドジソンの凝縮法|どじそんのぎょうしゅくほう"}
$n\ge2$ とし、$X^{(i,j)}\defeq X_{\{i\}^{c},\{j\}^{c}}$、$X^{\circ}\defeq X_{\{1,n\}^{c},\{1,n\}^{c}}$ とすると
$$
\det X\cdot\det X^{\circ}=\det X^{(1,1)}\det X^{(n,n)}-\det X^{(1,n)}\det X^{(n,1)}.
$$
:::

::: proof
\ref{lin:jacobi-complementary.2} で $I=\{1,n\}$：$(\operatorname{adj}X)_{I,I}=\begin{pmatrix}\Delta_{11}&\Delta_{n1}\\\Delta_{1n}&\Delta_{nn}\end{pmatrix}$（$\operatorname{adj}X$ の $(i,j)$ 成分は $\Delta_{ji}$）。その行列式は $\Delta_{11}\Delta_{nn}-\Delta_{n1}\Delta_{1n}$ で、$\Delta_{1n}\Delta_{n1}=(-1)^{2(n+1)}\det X^{(1,n)}\det X^{(n,1)}$。右辺は $\det X\cdot\det X^{\circ}$。
:::

::: hypcheck
- **体であること**：\ref{lin:rank-minors} で、行の階数＝列の階数と、$\det\neq0\Rightarrow$ 可逆に使う。可換環上では「0 でない」を「単元」や「非零因子」に置き換える必要があり、\ref{lin:rank-minors} の素朴な形は成り立たない（$\mathbb{Z}/6$ 上の $(2)$ と $(3)$ はともに $0$ でない 1 次小行列式をもつが、単射でも全射でもない）。
- **非零因子への帰着**：\ref{lin:jacobi-complementary} で $\det X$ で割るために一般の行列の技法を使った。そのまま特殊な $X$（$\det X=0$）では Step 2 の両辺がともに $0$ になり、割り算からは何も分からない。
- **単調な並べ方**：小行列式は行・列を元の順序で並べて定義した。順序を変えると符号が変わり、ラプラス展開の符号 $(-1)^{\Sigma I+\Sigma J}$ はこの規約に依存する。
- **選択公理**：使わない。
:::

::: supplement
**前提を弱めると.** コーシー–ビネの公式は、外積代数の言葉では $\Lambda^{k}(XY)=\Lambda^{k}X\circ\Lambda^{k}Y$（$k$ 次小行列式の行列 $\Lambda^{k}X$ の乗法性）に他ならない（\ref{lin:page-exterior}）。行列式イデアルは、PID 上ではスミス標準形を完全に決める（上の系）が、一般の環では加群の同型類を決めない。

**似た定理.** グラム行列式 $\det({}^{t}XX)=\sum_{K}(\det X_{K,[m]})^{2}$（コーシー–ビネで $Y={}^{t}X$）は、$\mathbb{R}^{n}$ の $m$ 個のベクトルが張る平行体の $m$ 次元体積の 2 乗が、座標部分空間への射影の体積の 2 乗の和であること（ピタゴラスの定理の高次元版）を言う。行列木定理（グラフのラプラシアンの小行列式が全域木の個数）もコーシー–ビネから従うことが知られている。

**計算の観点.** ドジソンの凝縮法は、デスナノ–ヤコビの恒等式を繰り返して $n$ 次の行列式を、隣接する $2\times2$ の行列式の計算の繰り返しで求める方法で、途中の内部の小行列式で割るので、それが $0$ になると工夫が要る。小行列式による階数の判定は、記号的な成分の行列や、パラメータに依存する行列の階数の変化（\ref{ag:elimination-theorem} の Step 3）を調べるのに使われる。
:::

## 高い視点 {#lin:sec-mi-viewpoint}

::: remark 小行列式は外冪の行列成分
$k$ 次小行列式 $\det X_{I,J}$ は、$\Lambda^{k}X:\Lambda^{k}A^{n}\to\Lambda^{k}A^{m}$ の、基底 $e_{J}=e_{j_{1}}\wedge\dots\wedge e_{j_{k}}$ と $e_{I}$ に関する行列成分である。コーシー–ビネは $\Lambda^{k}$ の関手性、階数の判定は「$\Lambda^{r}X\neq0$ かつ $\Lambda^{r+1}X=0$ となる $r$ が階数」、行列式イデアルは「$\Lambda^{k}X$ の像が生成するイデアル」と読める。幾何的には、階数が $r$ 以下の行列の集合は $(r+1)$ 次小行列式の共通零点で定まる**行列式多様体**で、階数は小行列式の非零という開条件で測られるので、下に半連続（パラメータを動かすと階数は近くで下がらない）である。比喩で言えば、小行列式は行列の「部分的な体積」の一覧表で、その中にどの大きさまで $0$ でないものがあるかが、行列の本当の大きさ（階数）を教える。
:::

## 問題 {#lin:sec-mi-problems}

::: problem {#lin:prob-mi-binet-two}
$X=\begin{pmatrix}a_{1}&a_{2}&a_{3}\\b_{1}&b_{2}&b_{3}\end{pmatrix}$ について、コーシー–ビネの公式から**ラグランジュの恒等式** $(\sum a_{i}^{2})(\sum b_{i}^{2})-(\sum a_{i}b_{i})^{2}=\sum_{i<j}(a_{i}b_{j}-a_{j}b_{i})^{2}$ を導け。
:::

::: solution
$\det(X\,{}^{t}X)=\det\begin{pmatrix}\sum a_{i}^{2}&\sum a_{i}b_{i}\\\sum a_{i}b_{i}&\sum b_{i}^{2}\end{pmatrix}$ が左辺。コーシー–ビネで右辺 $=\sum_{|K|=2}\det X_{[2],K}\det({}^{t}X)_{K,[2]}=\sum_{i<j}(a_{i}b_{j}-a_{j}b_{i})^{2}$（${}^{t}X$ の小行列式は $X$ の小行列式の転置で同じ値）。
:::

::: problem {#lin:prob-mi-smith}
$X=\begin{pmatrix}2&4\\6&8\end{pmatrix}\in M_{2}(\mathbb{Z})$ の単因子を、行列式イデアルから求めよ。
:::

::: solution
$I_{1}(X)=(2,4,6,8)=(2)$ なので $d_{1}=2$。$I_{2}(X)=(\det X)=(16-24)=(8)$ なので $d_{1}d_{2}=8$、$d_{2}=4$。スミス標準形は $\operatorname{diag}(2,4)$（\ref{lin:fitting-ideals.2}）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lin:sec-mi-exercises} にまとめた。
