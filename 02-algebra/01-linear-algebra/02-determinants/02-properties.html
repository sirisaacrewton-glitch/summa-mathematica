# 行列式の性質 {#lin:page-determinant-properties keywords="cofactor expansion along any row or column, Laplace expansion, alien cofactors, adjugate matrix, adj(X) X = det(X) I, invertible iff determinant is a unit over a commutative ring, Cramer's rule, Vandermonde determinant, block triangular determinant, Schur complement, commuting blocks det = det(PR - QS), generic matrix trick, Sylvester determinant identity det(I + AB) = det(I + BA), matrix determinant lemma"}

可換環 $A$ 上の行列式について、任意の行・列についての余因子展開、余因子行列 $\operatorname{adj}X$ と $\operatorname{adj}(X)X=\det(X)I$、そこから「**可逆 $\iff$ 行列式が単元**」とクラメールの公式を導く。ヴァンデルモンドの行列式、ブロック行列の行列式（シューア補行列、ブロックが可換な場合）、シルヴェスターの恒等式 $\det(I+AB)=\det(I+BA)$ も示す。可換な場合の公式では、行列を多項式環上の「一般の」行列に置き換えて非零因子にする技法を使う。

> すべて最初から可換環上で述べる。

## 記法と定義の確認 {#lin:sec-dp-notation}

::: notation
- 行列式の定義・特徴付け・転置不変性・乗法性・余因子展開による帰納的定義・三角行列は \ref{lin:leibniz-formula}, \ref{lin:det-characterization}, \ref{lin:det-multiplicative}, \ref{lin:det-recursive}, \ref{lin:det-special-matrices}。交代性の帰結（列の入れ替えで符号が変わる）は \ref{lin:alternating-consequences}。
- $X\in M_{n}(A)$ について、$X_{ij}$ は第 $i$ 行と第 $j$ 列を除いた $(n-1)$ 次の行列、$\Delta_{ij}\defeq(-1)^{i+j}\det X_{ij}$ を $(i,j)$ **余因子**という。
- 多項式環 $A[t]$ のモニック多項式は非零因子（最高次の係数が $1$ なので、$fg=0$ なら $g$ の最高次の項から順に $0$）。
- **選択公理**：使わない。
:::

## 余因子展開と余因子行列 {#lin:sec-dp-cofactor}

::: theorem 余因子展開 {#lin:cofactor-expansion keywords="cofactor expansion along any column and any row; alien cofactors vanish" index="余因子展開|よいんしてんかい, 余因子|よいんし"}
$X\in M_{n}(A)$ と $1\le j,l\le n$ について
$$
\sum_{i=1}^{n}x_{il}\Delta_{ij}=\delta_{lj}\det X,\qquad\sum_{i=1}^{n}x_{li}\Delta_{ji}=\delta_{lj}\det X.
$$
とくに $\det X=\sum_{i}x_{ij}\Delta_{ij}$（第 $j$ 列での展開）$=\sum_{i}x_{ji}\Delta_{ji}$（第 $j$ 行での展開）。
:::

::: proof
**Step 1（第 $j$ 列での展開）.** 第 $j$ 列を、隣接する列との入れ替え $j-1$ 回で先頭に移した行列 $X'$ を考える。$\det X'=(-1)^{j-1}\det X$（\ref{lin:alternating-consequences}）。$X'$ の第 1 列は $x_{j}$ で、$X'$ から第 $i$ 行と第 1 列を除くと $X_{ij}$（他の列の順序は保たれる）。\ref{lin:det-recursive} から $\det X'=\sum_{i}(-1)^{i+1}x_{ij}\det X_{ij}$。よって $\det X=\sum_{i}(-1)^{i+j}x_{ij}\det X_{ij}$。

**Step 2（$l\neq j$）.** $X$ の第 $j$ 列を第 $l$ 列で置き換えた行列 $\tilde{X}$ は等しい二列をもつので $\det\tilde{X}=0$。$\tilde{X}_{ij}=X_{ij}$ なので、Step 1 を $\tilde{X}$ に使うと $0=\sum_{i}x_{il}\Delta_{ij}$。

**Step 3（行）.** 転置（\ref{lin:det-characterization.4}）に Step 1・2 を使う：${}^{t}X$ の $(i,j)$ 小行列は ${}^{t}(X_{ji})$。
:::

::: theorem 余因子行列と可逆性 {#lin:adjugate keywords="adjugate matrix adj X = (Delta_{ji}); adj(X) X = X adj(X) = det(X) I; X invertible iff det X is a unit; X^{-1} = det(X)^{-1} adj X" index="余因子行列|よいんしぎょうれつ, 随伴行列（古典的）|ずいはんぎょうれつこてんてき"}
$\operatorname{adj}X\defeq(\Delta_{ji})_{i,j}$（余因子を並べて転置したもの）を**余因子行列**という。
1. $\operatorname{adj}(X)\,X=X\operatorname{adj}(X)=\det(X)\,I$。
2. $X$ が可逆 $\iff\det X\in A^{\times}$。このとき $X^{-1}=(\det X)^{-1}\operatorname{adj}X$。
3. $XY=I$ なら $YX=I$（片側の逆行列は両側の逆行列）。
:::

::: proof
**Step 1（1）.** $(\operatorname{adj}(X)X)_{jl}=\sum_{i}\Delta_{ij}x_{il}=\delta_{jl}\det X$、$(X\operatorname{adj}(X))_{lj}=\sum_{i}x_{li}\Delta_{ji}=\delta_{lj}\det X$（\ref{lin:cofactor-expansion}）。

**Step 2（2）.** ⇒ は \ref{lin:det-multiplicative}。⇐ は 1 から $(\det X)^{-1}\operatorname{adj}X$ が両側の逆。

**Step 3（3）.** $\det X\det Y=1$ なので $\det X$ は単元、2 から $X$ は可逆で $Y=X^{-1}$。
:::

::: corollary クラメールの公式 {#lin:cramer keywords="Cramer's rule: det(X) y_j = det X_j(b) for any solution of Xy = b; unique solution y_j = det X_j(b)/det X when det X is a unit" index="クラメールの公式|くらめーるのこうしき" refname="クラメールの公式"}
$X\in M_{n}(A)$, $b\in A^{n}$ とし、$X_{j}(b)$ を $X$ の第 $j$ 列を $b$ で置き換えた行列とする。
1. $Xy=b$ なら、すべての $j$ で $\det(X)\,y_{j}=\det X_{j}(b)$。
2. $\det X\in A^{\times}$ なら、$Xy=b$ はただ一つの解 $y_{j}=\det X_{j}(b)/\det X$ をもつ。
:::

::: proof
1：$b=\sum_{l}y_{l}x_{l}$ を第 $j$ 列に代入し、列についての多重線形性と交代性から $\det X_{j}(b)=\sum_{l}y_{l}\det X_{j}(x_{l})=y_{j}\det X$（$l\neq j$ では等しい二列）。2：$y=X^{-1}b$ が唯一の解で、1 で割る。
:::

::: remark 余因子行列の応用：行列式のトリック
$\operatorname{adj}(X)X=\det(X)I$ は、可換環論の「行列式のトリック」（\ref{ring:determinant-trick}）の核心である：有限生成加群 $M=\sum Am_{i}$ と自己準同型 $\phi$ について $\phi(m_{i})=\sum a_{ij}m_{j}$ なら、$\det(\phi I-(a_{ij}))$ が $M$ を零化する。ケーリー–ハミルトンの定理（\ref{lin:page-eigenvalues}）と中山の補題はここから従う。
:::

## ヴァンデルモンドの行列式 {#lin:sec-dp-vandermonde}

::: theorem ヴァンデルモンドの行列式 {#lin:vandermonde keywords="Vandermonde determinant det(x_i^{j-1}) = prod_{i<j} (x_j - x_i); interpolation" index="ヴァンデルモンドの行列式|ゔぁんでるもんどのぎょうれつしき"}
$x_{1},\dots,x_{n}\in A$ について
$$
V(x_{1},\dots,x_{n})\defeq\det\bigl(x_{i}^{\,j-1}\bigr)_{1\le i,j\le n}=\prod_{1\le i<j\le n}(x_{j}-x_{i}).
$$
:::

::: proof
**Step 1（列の変形）.** $n$ についての帰納法（$n=1$ で $1$）。第 $j$ 列から第 $j-1$ 列の $x_{1}$ 倍を引く操作を $j=n,n-1,\dots,2$ の順に行う（列の (III) 型の変形は行列式を変えない：交代性と多重線形性）。第 $i$ 行は $(1,\ x_{i}-x_{1},\ x_{i}(x_{i}-x_{1}),\dots,x_{i}^{n-2}(x_{i}-x_{1}))$ になり、第 1 行は $(1,0,\dots,0)$。

**Step 2（展開と因数）.** 第 1 行で展開すると（\ref{lin:cofactor-expansion}）、行列式は右下の $(n-1)$ 次の行列 $(x_{i}^{j-2}(x_{i}-x_{1}))_{i,j\ge2}$ の行列式。各行 $i$ から $(x_{i}-x_{1})$ をくくり出すと（行について多重線形）、$\prod_{i\ge2}(x_{i}-x_{1})\cdot V(x_{2},\dots,x_{n})$。帰納法の仮定から結論。
:::

::: corollary 補間と根の個数 {#lin:interpolation keywords="Lagrange interpolation: if x_i - x_j are units, there is a unique polynomial of degree < n with given values; over a domain a nonzero polynomial of degree < n has fewer than n roots" index="ラグランジュ補間|らぐらんじゅほかん"}
$x_{i}-x_{j}$（$i\neq j$）がすべて $A$ の単元なら、任意の $c_{1},\dots,c_{n}\in A$ について、次数 $<n$ の多項式 $f\in A[x]$ で $f(x_{i})=c_{i}$ となるものがただ一つある。
:::

::: proof
$f=\sum_{j}a_{j}x^{j-1}$ について条件は $(x_{i}^{j-1})(a_{j})=(c_{i})$ で、係数行列の行列式 $V$ は単元の積なので単元。\ref{lin:cramer} から一意に解ける。
:::

## ブロック行列 {#lin:sec-dp-block}

::: theorem ブロック行列の行列式 {#lin:block-determinant keywords="block triangular determinant det [[P,Q],[0,R]] = det P det R; Schur complement det P det(R - S P^{-1} Q); commuting blocks det [[P,Q],[S,R]] = det(PR - QS) when RS = SR" index="ブロック行列の行列式|ぶろっくぎょうれつのぎょうれつしき, シューア補行列|しゅーあほぎょうれつ"}
$P\in M_{p}(A)$, $R\in M_{q}(A)$, $Q\in M_{p\times q}(A)$, $S\in M_{q\times p}(A)$ とし、$M=\begin{pmatrix}P&Q\\S&R\end{pmatrix}$ とする。
1. $S=0$ なら $\det M=\det P\det R$。
2. $P$ が可逆なら $\det M=\det P\det(R-SP^{-1}Q)$（$R-SP^{-1}Q$ を**シューア補行列**という）。
3. $p=q$ で $RS=SR$ なら $\det M=\det(PR-QS)$。
:::

::: proof
**Step 1（1）.** ライプニッツの式の項 $\prod_{j}m_{\sigma(j)j}$ が $0$ でないなら、第 $1,\dots,p$ 列の成分は第 $1,\dots,p$ 行にしかないので $\sigma(\{1..p\})\subset\{1..p\}$、したがって $\sigma=\sigma_{1}\times\sigma_{2}$（$\sigma_{1}\in S_{p}$, $\sigma_{2}\in S_{q}$）。$\operatorname{sgn}\sigma=\operatorname{sgn}\sigma_{1}\operatorname{sgn}\sigma_{2}$（転倒数は各ブロック内の転倒数の和：\ref{grp:sign-value}）なので、和は $\det P\det R$ に分解する。

**Step 2（2）.** 
$$
\begin{pmatrix}I&0\\-SP^{-1}&I\end{pmatrix}M=\begin{pmatrix}P&Q\\0&R-SP^{-1}Q\end{pmatrix}
$$
で、左の行列は対角 1 の下三角なので行列式 1。1 と乗法性から。

**Step 3（3：$\det R$ が非零因子の場合）.** 
$$
M\begin{pmatrix}R&0\\-S&I\end{pmatrix}=\begin{pmatrix}PR-QS&Q\\SR-RS&R\end{pmatrix}=\begin{pmatrix}PR-QS&Q\\0&R\end{pmatrix}.
$$
1 から $\det M\det R=\det(PR-QS)\det R$。$\det R$ が非零因子なら割れる。

**Step 4（3：一般の場合、一般化の技法）.** $A[t]$ 上で $R$ を $R_{t}\defeq R+tI$ に替える。$R_{t}S=SR_{t}$ で、$\det R_{t}$ は $t$ についてモニックな $q$ 次多項式なので非零因子。Step 3 から $A[t]$ で $\det\begin{pmatrix}P&Q\\S&R_{t}\end{pmatrix}=\det(PR_{t}-QS)$。両辺は $t$ の多項式で、$t=0$ を代入する（$A[t]\to A$ は環準同型で、行列式は成分の多項式なので代入と交換する）。
:::

::: theorem シルヴェスターの行列式の恒等式 {#lin:sylvester-identity keywords="det(I_m + AB) = det(I_n + BA) for A m x n and B n x m; matrix determinant lemma det(X + u v^t) = det X (1 + v^t X^{-1} u)" index="シルヴェスターの恒等式|しるゔぇすたーのこうとうしき"}
$A_{0}\in M_{m\times n}(A)$, $B_{0}\in M_{n\times m}(A)$ について $\det(I_{m}+A_{0}B_{0})=\det(I_{n}+B_{0}A_{0})$。とくに $X$ が可逆、$u,v\in A^{n}$ なら $\det(X+u\,{}^{t}v)=\det X\,(1+{}^{t}vX^{-1}u)$。
:::

::: proof
$N\defeq\begin{pmatrix}I_{m}&-A_{0}\\B_{0}&I_{n}\end{pmatrix}$ の行列式を \ref{lin:block-determinant.2} で二通りに計算する。左上 $I_{m}$ を使うと $\det N=\det(I_{n}+B_{0}A_{0})$。行と列のブロックを入れ替えて（$\begin{pmatrix}I_{n}&B_{0}\\-A_{0}&I_{m}\end{pmatrix}$ は $N$ の行と列を同じ置換で並べ替えたもので、行列式は $\operatorname{sgn}^{2}=1$ 倍）、左上 $I_{n}$ を使うと $\det N=\det(I_{m}+A_{0}B_{0})$。後半は $\det(X+u{}^{t}v)=\det X\det(I+X^{-1}u\,{}^{t}v)$ に $m=n$, $n=1$ 版（$A_{0}=X^{-1}u$, $B_{0}={}^{t}v$）を使う。
:::

::: hypcheck
- **可換性**：ライプニッツの式と乗法性を通してすべてで使う。\ref{lin:block-determinant.3} ではブロック $R$, $S$ の可換性が本質的：$RS\neq SR$ だと $\det M\neq\det(PR-QS)$ の例がある（$2\times2$ ブロックで容易に作れる）。
- **単元であること**：\ref{lin:adjugate.2} で $\det X$ の逆元を使う。$\mathbb{Z}$ 上 $\begin{pmatrix}2&0\\0&1\end{pmatrix}$ は $\det=2\neq0$ だが可逆でない（体上では「$\neq0$」と「単元」が一致する）。
- **非零因子への帰着**：\ref{lin:block-determinant} の Step 4 で、$\det R$ が零因子でも成り立たせるために多項式環に移った。この「一般の元を加えて非零因子にし、最後に特殊化する」技法は可換環上の恒等式の証明で繰り返し使う。
- **選択公理**：使わない。
:::

::: supplement
**前提を弱めると.** 恒等式（多項式としての等式）は、すべての可換環で成り立つことと、$\mathbb{Z}[x_{ij}]$（成分を不定元にした**一般の行列**）で成り立つことが同値である（$\mathbb{Z}[x_{ij}]\to A$ の代入）。$\mathbb{Z}[x_{ij}]$ は整域なので、その商体 $\mathbb{Q}(x_{ij})$ で示せば十分、とくに一般の行列は可逆として扱える。これで \ref{lin:block-determinant.3} やシルヴェスターの恒等式を体の場合に帰着することもできる（ただし $RS=SR$ のような条件付きの恒等式では、条件を保つ「一般の元」を選ぶ必要があり、上の $R+tI$ はその例）。

**似た定理.** ラプラス展開の一般形（$k$ 個の列を固定し、$k$ 次小行列式とその補小行列式の積の和として展開する）と、コーシー–ビネの公式は \ref{lin:page-minors} で示す。

**計算の観点.** 余因子展開は再帰的に $n!$ 程度の手間がかかるので数値計算には向かないが、疎な行列や記号的な成分では有効である。クラメールの公式も、解の各成分を行列式の比として表す理論的な道具で、数値解法としては掃き出し法が優れる。
:::

## 高い視点 {#lin:sec-dp-viewpoint}

::: remark 余因子行列は外冪の双対
$\operatorname{adj}X$ は、$\Lambda^{n-1}X$（$(n-1)$ 次小行列式を並べた行列）を、外積のペアリング $\Lambda^{1}\otimes\Lambda^{n-1}\to\Lambda^{n}\cong A$ で $\Lambda^{1}$ に移したものである。$\operatorname{adj}(X)X=\det(X)I$ は「$\Lambda^{n}X$ はスカラー $\det X$」と「ペアリングの自然性」から従う（\ref{lin:page-exterior}）。可逆性の判定「$\det X$ が単元」は、$\operatorname{GL}_{n}$ が $M_{n}$ の中で $\det\neq0$（スキームとしては $\det$ が可逆）な開部分集合であること：$\mathrm{GL}_{n}=\operatorname{Spec}\mathbb{Z}[x_{ij}][1/\det]$ を意味する。比喩で言えば、余因子行列は「逆行列の分子」で、どんな環の上でも作れ、分母 $\det X$ で割れるかどうかだけが可逆性を決める。
:::

## 問題 {#lin:sec-dp-problems}

::: problem {#lin:prob-dp-integer-inverse}
$X\in M_{n}(\mathbb{Z})$ の逆行列が $M_{n}(\mathbb{Z})$ に存在する $\iff\det X=\pm1$ を示し、$X=\begin{pmatrix}2&3\\1&2\end{pmatrix}$ の逆行列を余因子行列で求めよ。
:::

::: solution
\ref{lin:adjugate.2} で $\mathbb{Z}^{\times}=\{\pm1\}$。$\det X=4-3=1$、$\operatorname{adj}X=\begin{pmatrix}2&-3\\-1&2\end{pmatrix}$（$\Delta_{11}=2$, $\Delta_{12}=-1$, $\Delta_{21}=-3$, $\Delta_{22}=2$ を転置）なので $X^{-1}=\begin{pmatrix}2&-3\\-1&2\end{pmatrix}$。
:::

::: problem {#lin:prob-dp-rank-one}
$u,v\in A^{n}$ について $\det(I_{n}+u\,{}^{t}v)=1+{}^{t}vu$ を示し、$\det(I_{n}+J)$（$J$ はすべての成分が $1$ の行列）を求めよ。
:::

::: solution
\ref{lin:sylvester-identity} で $A_{0}=u$（$n\times1$）, $B_{0}={}^{t}v$（$1\times n$）：$\det(I_{n}+u{}^{t}v)=\det(I_{1}+{}^{t}vu)=1+{}^{t}vu$。$J=\mathbf{1}\,{}^{t}\mathbf{1}$（$\mathbf{1}={}^{t}(1,\dots,1)$）なので $\det(I+J)=1+n$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lin:sec-dp-exercises} にまとめた。
