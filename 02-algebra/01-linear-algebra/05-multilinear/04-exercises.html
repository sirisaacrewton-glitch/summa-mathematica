# 演習：多重線形代数 {#lin:page-exercises-multilinear keywords="exercises, Multilinear Algebra"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#lin:sec-exmultilinear-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## テンソル積とテンソル代数 {#lin:sec-te-exercises}

対応するページ：\ref{lin:page-tensor}

::: problem ★ 基本：クロネッカー積 {#lin:ex-te-1}
$A=\begin{pmatrix}1 & 2 \\ 0 & 1\end{pmatrix}$, $B=\begin{pmatrix}0 & 1 \\ 1 & 0\end{pmatrix}$ のクロネッカー積 $A\otimes B$ を書き、$\mathrm{tr}(A\otimes B)=\mathrm{tr}A\,\mathrm{tr}B$, $\det(A\otimes B)=(\det A)^{2}(\det B)^{2}$ を確かめよ。
:::

::: solution
$A\otimes B=\begin{pmatrix}0 & 1 & 0 & 2 \\ 1 & 0 & 2 & 0 \\ 0 & 0 & 0 & 1 \\ 0 & 0 & 1 & 0\end{pmatrix}$。トレースは $0=2\cdot0$、行列式は $1=(1)^{2}(-1)^{2}$。
:::

::: problem ★★ 標準：巡回群のテンソル積 {#lin:ex-te-2}
$\Z/m\otimes_{\Z}\Z/n\cong\Z/\gcd(m,n)$ を示せ。
:::

::: solution
$d=\gcd(m,n)$ とする。双線形写像 $(a,b)\mapsto ab\bmod d$ は well-defined（$m,n$ の倍数の差は $d$ の倍数）で、全射準同型 $\varphi\colon\Z/m\otimes\Z/n\to\Z/d$ を与える。左辺は $1\otimes1$ で生成され、$m(1\otimes1)=0$, $n(1\otimes1)=0$ なので $d=um+vn$ から $d(1\otimes1)=0$、元は高々 $d$ 個。よって $\varphi$ は同型。
:::

::: problem ★★ 標準：分解できないテンソル {#lin:ex-te-3}
$e_{1}\otimes e_{1}+e_{2}\otimes e_{2}\in k^{2}\otimes k^{2}$ は $v\otimes w$ の形に書けないことを示せ。
:::

::: solution
$k^{2}\otimes k^{2}\cong M_{2}(k)$（$v\otimes w\mapsto vw^{\top}$）で、$v\otimes w$ は階数 $1$ 以下の行列に対応する。与えられたテンソルは単位行列（階数 $2$）に対応するので分解できない。
:::

::: problem ★★★ 発展：テンソルの階数と写像の階数 {#lin:ex-te-4}
有限次元の $V,W$ について、$V^{*}\otimes W\to\mathrm{Hom}(V,W)$, $\varphi\otimes w\mapsto(v\mapsto\varphi(v)w)$ は同型であり、テンソル $\tau$ を $\sum_{i=1}^{r}\varphi_{i}\otimes w_{i}$ と書くのに必要な最小の $r$ は、対応する線形写像の階数に等しいことを示せ。
:::

::: solution
基底で見ると、$e_{i}^{*}\otimes f_{j}$ は行列単位 $E_{ji}$ に対応するので同型（次元が等しく、全射）。$\sum_{i=1}^{r}\varphi_{i}\otimes w_{i}$ に対応する写像の像は $\langle w_{1},\dots,w_{r}\rangle$ に入るので階数 $\le r$。逆に階数 $r$ の写像 $f$ について、$\mathrm{Im}f$ の基底 $w_{1},\dots,w_{r}$ で $f(v)=\sum\varphi_{i}(v)w_{i}$ と書け（$\varphi_{i}$ は座標関数と $f$ の合成）、$r$ 項で表せる。
:::

## 外積代数と対称代数 {#lin:sec-ex-exercises}

対応するページ：\ref{lin:page-exterior}

::: problem ★ 基本：外積の計算 {#lin:ex-ex-1}
$\R^{3}$ で $(e_{1}+2e_{2})\wedge(e_{2}+3e_{3})$ を $e_{1}\wedge e_{2},e_{1}\wedge e_{3},e_{2}\wedge e_{3}$ で表し、ベクトル積と比べよ。
:::

::: solution
展開すると $e_{1}\wedge e_{2}+3e_{1}\wedge e_{3}+6e_{2}\wedge e_{3}$（$e_{2}\wedge e_{2}=0$）。$e_{2}\wedge e_{3}\leftrightarrow e_{1}$, $e_{3}\wedge e_{1}\leftrightarrow e_{2}$, $e_{1}\wedge e_{2}\leftrightarrow e_{3}$ と対応させると $(6,-3,1)$ で、ベクトル積 $(1,2,0)\times(0,1,3)=(6, -3, 1)$ と一致する。
:::

::: problem ★ 基本：外冪の次元 {#lin:ex-ex-2}
$\dim\Lambda^{k}\R^{4}$（$k=0,\dots,4$）と $\dim\Lambda\R^{4}$ を求めよ。
:::

::: solution
$\binom{4}{k}$ なので $1,4,6,4,1$、合計 $2^{4}=16$（基底 $e_{i_{1}}\wedge\cdots\wedge e_{i_{k}}$, $i_{1}<\cdots<i_{k}$）。
:::

::: problem ★★ 標準：分解できない 2 形式 {#lin:ex-ex-3}
$\omega=e_{1}\wedge e_{2}+e_{3}\wedge e_{4}\in\Lambda^{2}k^{4}$（$\mathrm{char}\,k\neq2$）は $u\wedge v$ の形に書けないことを示せ。
:::

::: solution
$u\wedge v$ なら $(u\wedge v)\wedge(u\wedge v)=0$（$u\wedge u=0$ と反可換性）。一方 $\omega\wedge\omega=2e_{1}\wedge e_{2}\wedge e_{3}\wedge e_{4}\neq0$。
:::

::: problem ★★★ 発展：外冪の行列式 {#lin:ex-ex-4}
$n=3$ のとき、$\Lambda^{2}A$ の基底 $e_{1}\wedge e_{2},e_{1}\wedge e_{3},e_{2}\wedge e_{3}$ に関する行列の成分は $A$ の 2 次小行列式であることを示し、$\det\Lambda^{2}A=(\det A)^{2}$ を示せ。$A=\begin{pmatrix}1 & 2 & 0 \\ 3 & 1 & 1 \\ 0 & 2 & 1\end{pmatrix}$ で確かめよ。
:::

::: solution
$Ae_{i}\wedge Ae_{j}=\sum_{k<l}\det A_{\{k,l\},\{i,j\}}e_{k}\wedge e_{l}$（展開して $e_{k}\wedge e_{l}$ の係数を集める）。行列式：代数閉包で $A$ を上三角化すると $\Lambda^{2}A$ も（適当な順序で）三角になり、対角成分は $\lambda_{i}\lambda_{j}$（$i<j$）、積は $(\lambda_{1}\lambda_{2}\lambda_{3})^{2}$。例：$\Lambda^{2}A=\begin{pmatrix}-5 & 1 & 2 \\ 2 & 1 & 2 \\ 6 & 3 & -1\end{pmatrix}$, $\det=49=(-7)^{2}$。
:::

## 多重線形代数の応用 {#lin:sec-ma-exercises}

対応するページ：\ref{lin:page-multilinear-applications}

::: problem ★ 基本：平行四辺形の面積 {#lin:ex-ma-1}
$\R^{3}$ の $u=(1,2,2)$, $v=(2,1,0)$ が張る平行四辺形の面積を、グラム行列式で求めよ。
:::

::: solution
グラム行列 $\begin{pmatrix}9 & 4 \\ 4 & 5\end{pmatrix}$ の行列式は $29$ なので面積は $\sqrt{29}$。ベクトル積 $(-2, 4, -3)$ の長さとも一致する。
:::

::: problem ★ 基本：四面体の体積 {#lin:ex-ma-2}
頂点 $(0,0,0),(1,2,0),(0,1,3),(2,0,1)$ の四面体の体積を求めよ。
:::

::: solution
三つの辺ベクトルを並べた行列の行列式は $13$ で、体積は $\frac{\lvert13\rvert}{6}=\frac{13}{6}$（平行六面体の $\frac16$）。
:::

::: problem ★★ 標準：関数空間のグラム行列式 {#lin:ex-ma-3}
内積 $\langle f,g\rangle=\int_{0}^{1}fg$ について、$1,x,x^{2}$ のグラム行列式を求めよ。
:::

::: solution
グラム行列はヒルベルト行列 $\begin{pmatrix}1 & \frac{1}{2} & \frac{1}{3} \\ \frac{1}{2} & \frac{1}{3} & \frac{1}{4} \\ \frac{1}{3} & \frac{1}{4} & \frac{1}{5}\end{pmatrix}$ で、行列式は $\frac{1}{2160}$。正なので $1,x,x^{2}$ は一次独立（グラム行列式は張る平行体の体積の 2 乗）。
:::

::: problem ★★★ 発展：アダマールの不等式 {#lin:ex-ma-4}
実正方行列 $A$ の列を $a_{1},\dots,a_{n}$ とすると $\lvert\det A\rvert\le\prod_{i}\lVert a_{i}\rVert$ であることを示せ。等号はいつ成り立つか。
:::

::: solution
$A$ が可逆なら、グラム–シュミットで $A=QR$（$Q$ 直交、$R$ 上三角で対角成分 $r_{ii}>0$）。$\lvert\det A\rvert=\prod r_{ii}$ で、$r_{ii}$ は $a_{i}$ の $\langle a_{1},\dots,a_{i-1}\rangle^{\perp}$ 成分の長さなので $r_{ii}\le\lVert a_{i}\rVert$。等号は各 $a_{i}$ が前の列と直交するとき、すなわち列が互いに直交するとき（またはある列が $0$ のとき）。
:::
