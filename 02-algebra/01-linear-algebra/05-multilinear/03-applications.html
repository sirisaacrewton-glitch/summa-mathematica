# 多重線形代数の応用 {#lin:page-multilinear-applications keywords="determinant as volume scaling factor, |det T| vol(S) = vol(T S), orientation, sign of determinant, Gram determinant and k-dimensional volume, Pythagorean theorem for volumes via Cauchy-Binet, inner product on exterior powers, Hodge star operator, cross product in R^3, star star = (-1)^{k(n-k)}, homogeneous polynomials and symmetric tensors, polarization, tensor rank, rank of 3-tensors, field dependence of tensor rank, Strassen"}

多重線形代数の応用として、(D9) **行列式は体積の拡大率**（$\operatorname{vol}(T(S))=|\det T|\operatorname{vol}(S)$）を、ルベーグ測度の基本性質と行列式の乗法的特徴付けから導き、向きを行列式の符号で定義する。内積空間では外冪に内積が入り、$k$ 本のベクトルが張る平行体の $k$ 次元体積はグラム行列式で与えられ、コーシー–ビネからその「ピタゴラスの定理」が従う。向き付きの内積空間では**ホッジのスター作用素** $\star:\Lambda^{k}\to\Lambda^{n-k}$ が定まり、$\mathbb{R}^{3}$ のベクトル積は $\star(v\wedge w)$ である。最後に、対称テンソルと多項式の極化、テンソルの階数を述べる。

> 体積の部分は測度論の結果を引用する。

## 記法と定義の確認 {#lin:sec-ma-notation}

::: notation
- 行列式の乗法的特徴付け・基本行列・掃き出し法は \ref{lin:det-multiplicative-characterization}, \ref{lin:det-special-matrices}, \ref{lin:inverse-elimination}。コーシー–ビネは \tref{lin:cauchy-binet}。外積代数・外冪の基底・双対性は \ref{lin:exterior-universal}, \ref{lin:exterior-basis}, \ref{lin:exterior-independence}。テンソル積と Hom、対称代数は \ref{lin:tensor-hom}, \ref{lin:symmetric-algebra}。内積・グラム–シュミット・スペクトル定理は \ref{lin:inner-product}, \ref{lin:gram-schmidt}, \tref{lin:spectral-theorem}。
- 測度論：$\mathbb{R}^{n}$ のルベーグ測度 $\operatorname{vol}$ の平行移動不変性、直方体の体積、平行移動不変でコンパクト集合に有限値をとるボレル測度はルベーグ測度の定数倍であること（\ref[ルベーグ測度]{meas:lebesgue-measure}）、カヴァリエリの原理（フビニの定理）（\ref[フビニの定理]{meas:fubini}）。測度論の系列で扱う予定。
- **選択公理**：使わない。
:::

## 行列式と体積 {#lin:sec-ma-volume}

::: theorem 行列式は体積の拡大率 {#lin:det-volume keywords="for T in M_n(R) and measurable S, vol(T S) = |det T| vol(S); determinant as signed volume of the parallelepiped spanned by the columns" index="行列式と体積|ぎょうれつしきとたいせき, 平行体|へいこうたい"}
$T\in M_{n}(\mathbb{R})$ と可測集合 $S\subset\mathbb{R}^{n}$ について $\operatorname{vol}(T(S))=|\det T|\operatorname{vol}(S)$（**(D9)**）。とくに列ベクトル $t_{1},\dots,t_{n}$ の張る平行体 $\{\sum c_{j}t_{j} : 0\le c_{j}\le1\}$ の体積は $|\det T|$。
:::

::: proof
**Step 1（可逆な場合の比例定数）.** $T$ が可逆なら $S\mapsto\operatorname{vol}(T(S))$ は平行移動不変なボレル測度（$T(S+a)=T(S)+Ta$）で、コンパクト集合に有限値をとる。測度の一意性から $\operatorname{vol}(T(S))=c(T)\operatorname{vol}(S)$ となる定数 $c(T)>0$ がある（$c(T)=\operatorname{vol}(T([0,1]^{n}))$）。

**Step 2（乗法性）.** $\operatorname{vol}(TT'(S))=c(T)c(T')\operatorname{vol}(S)$ なので $c(TT')=c(T)c(T')$。

**Step 3（基本行列での値）.** $D_{i}(a)$ は第 $i$ 座標を $a$ 倍するので、直方体の体積から $c(D_{i}(a))=|a|$。$T_{ij}(c)$ は第 $i$ 座標を $x_{i}+cx_{j}$ に替える「ずらし」で、$x_{j}$ を固定した各断面では平行移動なので、カヴァリエリの原理から $c(T_{ij}(c))=1$。$P_{ij}$ は座標の入れ替えで立方体を保つので $c(P_{ij})=1$。

**Step 4（結論）.** 可逆な $T$ は基本行列の積なので、Step 2・3 と \ref{lin:det-special-matrices.3} から $c(T)=|\det T|$（\ref{lin:det-multiplicative-characterization} と同じ議論で、値を $|\cdot|$ に替えたもの）。$T$ が可逆でなければ $T(\mathbb{R}^{n})$ は真の部分空間で、ある超平面に含まれ測度 $0$（超平面は回転で座標超平面に移り、座標超平面は測度 $0$）なので両辺 $0$。
:::

::: definition 向き {#lin:orientation keywords="orientation of a real vector space as an equivalence class of ordered bases with positive determinant of the change of basis; orientation-preserving maps" index="向き|むき, 向きを保つ|むきをたもつ"}
有限次元の実ベクトル空間 $V$ の順序付き基底 $B$, $B'$ は、基底変換行列の行列式が正のとき**同じ向き**であるという。これは同値関係で（乗法性）、同値類はちょうど二つ（$V\neq0$）。その一方を選ぶことを**向き付け**という。$\Lambda^{n}V\cong\mathbb{R}$ の $0$ でない元 $\omega$ を一つ選ぶことと同値で（$b_{1}\wedge\dots\wedge b_{n}$ が $\omega$ の正の倍数になる基底が「正の向き」）、自己同型 $f$ は $\det f>0$ のとき**向きを保つ**。
:::

## 内積空間の外冪と体積 {#lin:sec-ma-gram}

::: theorem 外冪の内積とグラム行列式 {#lin:exterior-inner-product keywords="inner product on Lambda^k V with <v_1 ^...^ v_k, w_1 ^...^ w_k> = det(<v_i, w_j>); e_I orthonormal; k-volume of a parallelepiped is sqrt of the Gram determinant; Pythagorean theorem: Gram determinant is the sum of squares of k-minors" index="グラム行列式|ぐらむぎょうれつしき, k 次元体積|けいじげんたいせき"}
$V$ を実内積空間（正規直交基底 $e_{1},\dots,e_{n}$）とする。
1. $\langle v_{1}\wedge\dots\wedge v_{k},w_{1}\wedge\dots\wedge w_{k}\rangle\defeq\det(\langle v_{i},w_{j}\rangle)$ は $\Lambda^{k}V$ の内積で、$e_{I}$ は正規直交基底。
2. $\|v_{1}\wedge\dots\wedge v_{k}\|^{2}=\det G$（$G=(\langle v_{i},v_{j}\rangle)$、**グラム行列式**）$=\sum_{|I|=k}(\det X_{I,[k]})^{2}$（$X$ は $v_{j}$ の座標を並べた $n\times k$ 行列）。
3. $\sqrt{\det G}$ は、$v_{1},\dots,v_{k}$ が張る平行体の、それらが張る $k$ 次元部分空間 $W$ の中での $k$ 次元体積（$W$ の正規直交基底で $\mathbb{R}^{k}$ と同一視したルベーグ測度）に等しい。
:::

::: proof
**Step 1（1）.** 右辺は $v$ についても $w$ についても交代多重線形なので、$\Lambda^{k}V\times\Lambda^{k}V\to\mathbb{R}$ の双線形写像を誘導する（\ref{lin:exterior-universal.1} を二回）。対称で、$\langle e_{I},e_{J}\rangle=\det(\delta)_{I,J}=\delta_{IJ}$ なので正規直交基底をもち、正定値。

**Step 2（2）.** 前半は定義、後半は \ref{lin:exterior-basis} の展開 $v_{1}\wedge\dots\wedge v_{k}=\sum_{I}\det X_{I,[k]}e_{I}$ と正規直交性（あるいは $G={}^{t}XX$ とコーシー–ビネ）。

**Step 3（3）.** $W$ の正規直交基底 $u_{1},\dots,u_{k}$ で $v_{j}=\sum_{i}c_{ij}u_{i}$ とすると、平行体の $k$ 次元体積は \ref{lin:det-volume} から $|\det C|$。一方 $G={}^{t}CC$（$\langle u_{i},u_{l}\rangle=\delta_{il}$）で $\det G=(\det C)^{2}$。
:::

::: theorem ホッジのスター作用素 {#lin:hodge-star keywords="Hodge star on an oriented inner product space: alpha wedge star beta = <alpha, beta> vol; star e_I = sign(I, I^c) e_{I^c}; star star = (-1)^{k(n-k)}; cross product in R^3 is star(v wedge w)" index="ホッジのスター作用素|ほっじのすたーさようそ, ホッジ双対|ほっじそうつい, ベクトル積|べくとるせき"}
$V$ を向き付けられた $n$ 次元実内積空間、$\operatorname{vol}\defeq e_{1}\wedge\dots\wedge e_{n}$（正の向きの正規直交基底；正規直交基底の取り替えは行列式 $\pm1$ なので、向きを保てば $\operatorname{vol}$ は変わらない）とする。
1. 各 $k$ について線形写像 $\star:\Lambda^{k}V\to\Lambda^{n-k}V$ で、$\alpha\wedge\star\beta=\langle\alpha,\beta\rangle\operatorname{vol}$（すべての $\alpha,\beta\in\Lambda^{k}V$）となるものがただ一つある。
2. $\star e_{I}=\varepsilon(I,I^{c})\,e_{I^{c}}$（$\varepsilon(I,I^{c})$ は $(I,I^{c})$ を並べた置換の符号）。$\star$ は等長で、$\star\star=(-1)^{k(n-k)}$ on $\Lambda^{k}$。
3. $n=3$ では $v\times w\defeq\star(v\wedge w)$ が通常のベクトル積で、$\langle u,v\times w\rangle=\det(u,v,w)$。
:::

::: proof
**Step 1（1：一意性）.** $\Lambda^{k}\times\Lambda^{n-k}\to\Lambda^{n}\cong\mathbb{R}$, $(\alpha,\gamma)\mapsto\alpha\wedge\gamma$ は完全な対（基底 $e_{I}$ と $e_{J}$（$|J|=n-k$）について $e_{I}\wedge e_{J}=\pm\operatorname{vol}$ if $J=I^{c}$, else $0$）なので、$\gamma=\star\beta$ は $\alpha\mapsto\langle\alpha,\beta\rangle$ から一意に決まる。

**Step 2（2：存在と公式）.** $\star e_{I}\defeq\varepsilon(I,I^{c})e_{I^{c}}$ と定めると、$e_{J}\wedge\star e_{I}=\varepsilon(I,I^{c})e_{J}\wedge e_{I^{c}}$ は $J=I$ のとき $\varepsilon^{2}\operatorname{vol}=\operatorname{vol}$、他は $0$ で、$\langle e_{J},e_{I}\rangle\operatorname{vol}$ に一致。基底を基底に写すので等長。$\star\star e_{I}=\varepsilon(I,I^{c})\varepsilon(I^{c},I)e_{I}$ で、$(I,I^{c})$ と $(I^{c},I)$ を並べた置換の比は $k$ 個と $n-k$ 個のブロックの入れ替えで符号 $(-1)^{k(n-k)}$。

**Step 3（3）.** $\star(e_{1}\wedge e_{2})=e_{3}$, $\star(e_{2}\wedge e_{3})=e_{1}$, $\star(e_{3}\wedge e_{1})=e_{2}$（$\varepsilon$ を計算）で、\ref{lin:prob-ex-cross-product} の対応と一致。$\langle u,\star(v\wedge w)\rangle\operatorname{vol}=u\wedge\star\star(v\wedge w)$ に $\star\star=1$（$k=2$, $n=3$）を使うと $u\wedge v\wedge w=\det(u,v,w)\operatorname{vol}$。
:::

## 対称テンソルと多項式 {#lin:sec-ma-polynomials}

::: proposition 対称テンソルと多項式の極化 {#lin:polarization keywords="Sym^k(V^*) is the space of homogeneous polynomials of degree k on V; symmetric k-linear forms correspond to homogeneous polynomials in characteristic 0 or > k via polarization" index="極化公式|きょくかこうしき, 斉次多項式|せいじたこうしき"}
$V$ を体 $k$ 上の $n$ 次元空間、$\operatorname{char}k=0$ または $>d$ とする。
1. $\operatorname{Sym}^{d}(V^{*})$ は $V$ 上の $d$ 次斉次多項式関数の空間と同一視できる（$V^{*}$ の基底 $x_{1},\dots,x_{n}$ で $\operatorname{Sym}(V^{*})\cong k[x_{1},\dots,x_{n}]$、\ref{lin:symmetric-algebra}）。
2. 対称 $d$ 重線形形式 $\beta$ に $q_{\beta}(v)\defeq\beta(v,\dots,v)$ を対応させる写像は、$d$ 次斉次多項式への同型で、逆は**極化公式**
$$
\beta(v_{1},\dots,v_{d})=\frac{1}{d!}\sum_{\emptyset\neq S\subset[d]}(-1)^{d-|S|}q\Bigl(\sum_{i\in S}v_{i}\Bigr).
$$
:::

::: proof
**Step 1（1）.** \ref{lin:symmetric-algebra.2}。

**Step 2（2：極化）.** 右辺に $q(\sum_{S}v_{i})=\sum_{i_{1},\dots,i_{d}\in S}\beta(v_{i_{1}},\dots,v_{i_{d}})$ を代入し、各項 $\beta(v_{i_{1}},\dots,v_{i_{d}})$ の係数を数える。添字の集合 $T=\{i_{1},\dots,i_{d}\}$ を含む $S$ について $\sum_{S\supset T}(-1)^{d-|S|}=\prod_{i\notin T}(1+(-1))\cdot(\pm1)$ は、$T\neq[d]$ なら $0$、$T=[d]$（$i$ が置換）なら $1$。よって右辺 $=\frac{1}{d!}\sum_{\sigma\in S_{d}}\beta(v_{\sigma(1)},\dots,v_{\sigma(d)})=\beta(v_{1},\dots,v_{d})$（対称性）。$d!$ が可逆であることを使う。逆に、$d$ 次斉次多項式 $q$ から右辺で定めた $\beta$ が対称 $d$ 重線形で $q_{\beta}=q$ となることは、単項式について確かめれば十分（同様の数え上げ）。
:::

## テンソルの階数 {#lin:sec-ma-rank}

::: definition テンソルの階数 {#lin:tensor-rank keywords="tensor rank: minimal number of pure tensors; equals matrix rank for 2-tensors; 3-tensors can have rank larger than the dimensions; depends on the field; matrix multiplication tensor" index="テンソルの階数|てんそるのかいすう"}
$t\in V_{1}\otimes\dots\otimes V_{d}$ について、$t=\sum_{s=1}^{r}v_{1}^{(s)}\otimes\dots\otimes v_{d}^{(s)}$ と書ける最小の $r$ を**テンソルの階数**という。$d=2$ では $V_{1}\otimes V_{2}\cong\operatorname{Hom}(V_{1}^{*},V_{2})$ を通して行列の階数に等しい（\ref{lin:tensor-hom.3}）。
:::

::: remark 3 次以上のテンソルの階数
$d\ge3$ ではテンソルの階数は行列の階数と大きく異なる性質をもつことが知られている（本サイト未収録）。
1. $k^{2}\otimes k^{2}\otimes k^{2}$ の $w=e_{1}\otimes e_{1}\otimes e_{2}+e_{1}\otimes e_{2}\otimes e_{1}+e_{2}\otimes e_{1}\otimes e_{1}$ は階数 $3$ で、各因子の次元 $2$ を超える。しかも $w$ は階数 $2$ のテンソルの極限（$\varepsilon^{-1}((e_{1}+\varepsilon e_{2})^{\otimes3}-e_{1}^{\otimes3})$）なので、階数 $\le2$ の集合は閉でない（**境界階数**の現象）。
2. 階数は体に依存する：$\mathbb{R}^{2}\otimes\mathbb{R}^{2}\otimes\mathbb{R}^{2}$ には $\mathbb{R}$ 上で階数 3、$\mathbb{C}$ 上で階数 2 のテンソルがある。
3. $2\times2$ 行列の積を表すテンソル（$M_{2}\otimes M_{2}\otimes M_{2}$ の元）の階数は $7$ で（ストラッセンの上界とウィノグラードの下界）、これが掛け算 7 回の行列積アルゴリズムを与える。一般の行列積の計算量の指数 $\omega$ の決定は未解決の問題である。
:::

::: hypcheck
- **測度論の結果**：\ref{lin:det-volume} は、平行移動不変な測度の一意性とカヴァリエリの原理に依存する（本サイトの測度論の系列で扱う予定）。行列式の側で使うのは乗法的な特徴付けだけである。
- **正定値な内積**：\ref{lin:exterior-inner-product} の正定値性は、元の内積の正規直交基底の存在（グラム–シュミット）から来る。不定値の内積では外冪の内積も不定値になる。
- **向き**：ホッジのスター作用素の符号は向きの選択に依存し、向きを逆にすると $\star$ は $-\star$ になる。
- **標数の条件**：極化公式で $d!$ で割る。標数 $p\le d$ では、対称テンソルと多項式（対称代数の元）は一致しない（$\mathbb{F}_{2}$ 上の $x^{2}$ は双線形形式 $\beta(u,v)$ の対角 $\beta(v,v)$ として、対称な $\beta$ から一意には復元できない）。
- **選択公理**：使わない。
:::

::: supplement
**前提を弱めると.** \ref{lin:det-volume} の体積の比例は、可測集合ではなく有限個の平行体の和集合（ジョルダン可測集合）に限れば、測度論を使わずに、平行体の体積を行列式で定義して乗法性から示すこともできる。リーマン多様体上では、ホッジのスター作用素が各点の接空間で定まり、ラプラシアンやホッジ理論の基礎になる（多様体上の解析で扱う予定）。

**似た定理.** 変数変換公式 $\int_{\phi(U)}f=\int_{U}(f\circ\phi)|\det D\phi|$ は、\ref{lin:det-volume} を微小な平行体に適用したものである。グラム行列式の公式は、多様体上の体積要素 $\sqrt{\det g}\,dx$ を与える。

**計算の観点.** テンソル分解（CP 分解・タッカー分解）は、データ解析で多次元配列を低階数近似するのに広く使われるが、3 次以上では最良近似が存在しないこともある（境界階数の現象）ことが知られている。
:::

## 高い視点 {#lin:sec-ma-viewpoint}

::: remark 多重線形代数は「幾何の線形化」
行列式は向き付きの体積、外冪は「向き付きの $k$ 次元の部分空間の量」、内積の外冪はその大きさ、ホッジのスター作用素は「$k$ 次元の量を、それに直交する $n-k$ 次元の量と対応させる」双対性である。これらはすべて、一つの線形空間の上で、交代性・対称性・内積という構造を組み合わせて作られ、微分幾何では各点の接空間で同じ構成を行うことで、微分形式・体積要素・ホッジ理論が得られる。比喩で言えば、線形代数が「点と方向」の言葉だとすれば、多重線形代数は「面・体・向き・大きさ」の言葉で、行列式はその辞書のいちばん上の見出し語である。
:::

## 問題 {#lin:sec-ma-problems}

::: problem {#lin:prob-ma-triangle-area}
$\mathbb{R}^{3}$ の点 $0$, $a={}^{t}(1,0,1)$, $b={}^{t}(0,2,1)$ を頂点とする三角形の面積を、グラム行列式と外積の成分の両方で求めよ。
:::

::: solution
$G=\begin{pmatrix}2&1\\1&5\end{pmatrix}$, $\det G=9$、平行四辺形の面積 $3$、三角形は $\tfrac32$。外積の成分（2 次小行列式）：$(a_{1}b_{2}-a_{2}b_{1},\ a_{1}b_{3}-a_{3}b_{1},\ a_{2}b_{3}-a_{3}b_{2})=(2,1,-2)$、平方和 $9$（\ref{lin:exterior-inner-product.2}）。
:::

::: problem {#lin:prob-ma-star-four}
$\mathbb{R}^{4}$（標準の向きと内積）で $\star(e_{1}\wedge e_{2})$ と $\star(e_{1}\wedge e_{3})$ を求め、$\star\star=1$ on $\Lambda^{2}$ を確かめよ。
:::

::: solution
$\star(e_{1}\wedge e_{2})=\varepsilon(1,2,3,4)e_{3}\wedge e_{4}=e_{3}\wedge e_{4}$。$\star(e_{1}\wedge e_{3})=\varepsilon(1,3,2,4)e_{2}\wedge e_{4}=-e_{2}\wedge e_{4}$。$\star(e_{3}\wedge e_{4})=\varepsilon(3,4,1,2)e_{1}\wedge e_{2}=e_{1}\wedge e_{2}$（偶置換）。$k(n-k)=4$ なので $\star\star=(-1)^{4}=1$ と一致。
:::
