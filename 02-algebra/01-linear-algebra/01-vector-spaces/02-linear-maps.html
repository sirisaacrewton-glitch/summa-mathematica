# 線形写像と行列 {#lin:page-linear-maps keywords="linear map determined by images of a basis, kernel and image, rank-nullity theorem, injective iff surjective in equal finite dimension, matrix of a linear map, composition is matrix product, change of basis, similar and equivalent matrices, Hom(V,W) dimension mn, quotient space, dual space, dual basis, double dual, transpose map, annihilator, row rank equals column rank, split exact sequences"}

線形写像は基底の行き先だけで決まり、基底を固定すると行列と一対一に対応して、合成は行列の積になる。核と像の次元の和は定義域の次元（**次元定理**）で、これから有限次元では単射・全射・全単射が同値になる。商空間と双対空間を定義し、転置写像と零化空間の次元から「行の階数＝列の階数」を導く。


## 記法と定義の確認 {#lin:sec-lm-notation}

::: notation
- ベクトル空間・基底・次元・補空間・次元公式は \ref{lin:vector-space}, \ref{lin:basis-existence}, \ref{lin:dimension}, \ref{lin:dimension-properties}。
- 自由加群の普遍性（基底の行き先を任意に決めると線形写像が一意に定まる）は \ref{mod:free-module-universal}、同型定理は \tref{mod:isomorphism-theorems}、直和の普遍性は \ref{mod:direct-sum-universal}。
- $M_{m\times n}(k)$ は $m\times n$ 行列の空間、$M_{n}(k)\defeq M_{n\times n}(k)$。行列の積 $(AB)_{il}=\sum_{j}A_{ij}B_{jl}$。$\mathrm{GL}_{n}(k)$ は可逆な $n$ 次正方行列の群。
- 基底を順序付きの組 $B=(b_{1},\dots,b_{n})$ として扱い、$v=\sum x_{j}b_{j}$ のとき $[v]_{B}\defeq{}^{t}(x_{1},\dots,x_{n})\in k^{n}$（**座標**）。
- **選択公理**：無限次元の場合だけ（基底の延長を通して）使う。
:::

## 核・像と次元定理 {#lin:sec-lm-kernel}

::: theorem 次元定理 {#lin:rank-nullity keywords="rank-nullity: dim V = dim ker f + dim im f; for equal finite dimensions injective iff surjective iff bijective" index="次元定理|じげんていり, 核|かく, 像|ぞう, 階数（線形写像）|かいすうせんけいしゃぞう" refname="次元定理（線形写像）"}
（無限次元では AC）線形写像 $f:V\to W$ について、$\ker f$, $\operatorname{im}f$ は部分空間で
$$
\dim V=\dim\ker f+\dim\operatorname{im}f.
$$
$\operatorname{rank}f\defeq\dim\operatorname{im}f$ を**階数**という。$\dim V=\dim W<\infty$ なら、$f$ が単射 $\iff$ 全射 $\iff$ 全単射。
:::

::: proof
**Step 1（基底の延長）.** $\ker f$ の基底 $C$ を $V$ の基底 $C\sqcup A$ に延長する（\ref{lin:basis-existence}）。

**Step 2（$f(A)$ は像の基底）.** 生成：$v=\sum c+\sum a$（$\langle C\rangle$ と $\langle A\rangle$ の成分）について $f(v)=f(\sum a)$ は $f(A)$ の一次結合。一次独立：$\sum_{a}\lambda_{a}f(a)=0$ なら $\sum\lambda_{a}a\in\ker f=\langle C\rangle$ で、$C\sqcup A$ の一次独立性からすべての $\lambda_{a}=0$。とくに $f|_{A}$ は単射で、$|f(A)|=|A|$。

**Step 3（次元の式）.** $\dim V=|C|+|A|=\dim\ker f+\dim\operatorname{im}f$。

**Step 4（後半）.** 単射 $\iff\dim\ker f=0\iff\dim\operatorname{im}f=\dim V=\dim W\iff\operatorname{im}f=W$（\ref{lin:dimension-properties.1}）$\iff$ 全射。
:::

::: corollary 商空間の次元と分裂 {#lin:quotient-space keywords="quotient space V/W, dim V/W = dim V - dim W, V/W is isomorphic to any complement of W, short exact sequences of vector spaces split" index="商空間|しょうくうかん"}
（無限次元では AC）部分空間 $W\subset V$ について、商空間 $V/W$（\ref{mod:submodule-basic}）は $W$ の任意の補空間 $W'$ と同型（$W'\hookrightarrow V\to V/W$ が同型）で、$\dim V=\dim W+\dim V/W$。ベクトル空間の短完全列 $0\to U\to V\to Q\to0$ はすべて分裂し、$V\cong U\oplus Q$。
:::

::: proof
$\pi:V\to V/W$ の $W'$ への制限は、核 $W\cap W'=0$ で単射、$V=W+W'$ から全射。次元は \ref{lin:dimension-properties.2}。短完全列では $U$ の像の補空間 $Q'$ をとると $Q'\cong Q$（前半）で、$V=U\oplus Q'$。
:::

## 行列表示 {#lin:sec-lm-matrices}

::: definition 線形写像の行列 {#lin:matrix-of-map keywords="matrix of a linear map with respect to bases: columns are coordinates of images of basis vectors" index="表現行列|ひょうげんぎょうれつ, 行列表示|ぎょうれつひょうじ"}
有限次元の $V$, $W$ の基底 $B=(b_{1},\dots,b_{n})$, $C=(c_{1},\dots,c_{m})$ と線形写像 $f$ について、$f(b_{j})=\sum_{i}a_{ij}c_{i}$ で定まる $[f]_{C,B}\defeq(a_{ij})\in M_{m\times n}(k)$ を $f$ の**表現行列**という（第 $j$ 列が $[f(b_{j})]_{C}$）。
:::

::: theorem 行列と線形写像の対応 {#lin:matrix-correspondence keywords="Hom(V,W) is isomorphic to M_{m x n}(k); [f(v)] = [f][v]; [g f] = [g][f]; dim Hom(V,W) = mn; matrix product is associative" index="行列と線形写像|ぎょうれつとせんけいしゃぞう"}
上の記法で：
1. $f\mapsto[f]_{C,B}$ は線形同型 $\operatorname{Hom}(V,W)\cong M_{m\times n}(k)$。とくに $\dim\operatorname{Hom}(V,W)=mn$。
2. $[f(v)]_{C}=[f]_{C,B}[v]_{B}$。
3. $g:W\to U$（基底 $D$）について $[g\circ f]_{D,B}=[g]_{D,C}[f]_{C,B}$。とくに行列の積は結合的で、$f$ が同型 $\iff$ $[f]$ が可逆で、$[f^{-1}]=[f]^{-1}$。
:::

::: proof
**Step 1（1）.** \ref{mod:free-module-universal} から、$f$ は $f(b_{1}),\dots,f(b_{n})$ で一意に決まり、それらは任意に選べる。$f(b_{j})$ は座標 $[f(b_{j})]_{C}$ と一対一（\ref{lin:basis-characterization.4}）。線形性は定義から。$M_{m\times n}(k)$ の基底は行列単位 $E_{ij}$ で $mn$ 個。

**Step 2（2）.** $v=\sum x_{j}b_{j}$ なら $f(v)=\sum_{j}x_{j}\sum_{i}a_{ij}c_{i}=\sum_{i}(\sum_{j}a_{ij}x_{j})c_{i}$。

**Step 3（3）.** $g(f(b_{l}))=g(\sum_{j}a_{jl}c_{j})=\sum_{j}a_{jl}\sum_{i}g_{ij}d_{i}=\sum_{i}(\sum_{j}g_{ij}a_{jl})d_{i}$。写像の合成は結合的で、1 の対応が積を合成に写すので、行列の積も結合的。同型については、$[f][f^{-1}]=[\mathrm{id}]=I$ と、逆に $[f]$ の逆行列が定める写像が逆写像であること。
:::

::: proposition 基底変換 {#lin:change-of-basis keywords="change of basis matrix, [f]_{C',B'} = Q^{-1} [f]_{C,B} P, similar matrices, equivalent matrices, rank normal form" index="基底変換|きていへんかん, 相似|そうじ, 同値（行列）|どうちぎょうれつ"}
$V$ の基底 $B,B'$ について $P\defeq[\mathrm{id}_{V}]_{B,B'}$（$B'$ の元を $B$ で書いた座標を列に並べた行列、**基底変換行列**）は可逆で $[v]_{B}=P[v]_{B'}$。同様に $W$ の基底 $C,C'$ について $Q\defeq[\mathrm{id}_{W}]_{C,C'}$ とすると
$$
[f]_{C',B'}=Q^{-1}[f]_{C,B}P.
$$
とくに $V=W$, $B=C$, $B'=C'$ なら $[f]_{B'}=P^{-1}[f]_{B}P$（**相似**）。また、階数 $r$ の $f$ について、適当な基底で $[f]=\begin{pmatrix}I_{r}&0\\0&0\end{pmatrix}$（**階数標準形**）で、二つの $m\times n$ 行列が $A'=Q^{-1}AP$ と書ける（**同値**）$\iff$ 階数が等しい。
:::

::: proof
**Step 1（変換公式）.** \ref{lin:matrix-correspondence.3} を $f=\mathrm{id}_{W}\circ f\circ\mathrm{id}_{V}$ に使う：$[f]_{C',B'}=[\mathrm{id}]_{C',C}[f]_{C,B}[\mathrm{id}]_{B,B'}$、$[\mathrm{id}]_{C',C}=Q^{-1}$。

**Step 2（階数標準形）.** \ref{lin:rank-nullity} の証明の $A=\{a_{1},\dots,a_{r}\}$, $C=\{c_{1},\dots\}$ について、$V$ の基底 $(a_{1},\dots,a_{r},c_{1},\dots,c_{n-r})$ と、$f(a_{1}),\dots,f(a_{r})$ を延長した $W$ の基底をとる。

**Step 3（同値の判定）.** $A'=Q^{-1}AP$ なら、同じ写像を別の基底で表した行列なので階数は等しい。逆に階数が等しければ、どちらも Step 2 の同じ標準形と同値。
:::

## 双対空間 {#lin:sec-lm-dual}

::: definition 双対空間と転置 {#lin:dual-space keywords="dual space V^* = Hom(V,k), dual basis, transpose map f^*, annihilator" index="双対空間|そうついくうかん, 双対基底|そうついきてい, 転置写像|てんちしゃぞう, 零化空間|れいかくうかん"}
$V^{*}\defeq\operatorname{Hom}(V,k)$ を**双対空間**という。線形写像 $f:V\to W$ の**転置** $f^{*}:W^{*}\to V^{*}$ を $f^{*}(\varphi)\defeq\varphi\circ f$ とする。部分空間 $U\subset V$ の**零化空間**を $U^{\perp}\defeq\{\varphi\in V^{*} : \varphi|_{U}=0\}$ とする。$V$ の基底 $(b_{1},\dots,b_{n})$ について $b_{i}^{*}(b_{j})=\delta_{ij}$ で定まる $(b_{1}^{*},\dots,b_{n}^{*})$ を**双対基底**という。
:::

::: theorem 双対空間の基本性質 {#lin:dual-properties keywords="dual basis is a basis; V -> V** is an isomorphism in finite dimension and injective in general; matrix of the transpose is the transpose matrix; dim U^perp = dim V - dim U; im f^* = (ker f)^perp; row rank equals column rank" index="行の階数と列の階数|ぎょうのかいすうとれつのかいすう"}
$V$, $W$ を有限次元とする。
1. 双対基底は $V^{*}$ の基底。$\dim V^{*}=\dim V$。
2. $\iota:V\to V^{**}$, $\iota(v)(\varphi)\defeq\varphi(v)$ は同型（**標準的な同型**）。$V$ が無限次元でも $\iota$ は単射（AC）。
3. $[f^{*}]_{B^{*},C^{*}}={}^{t}[f]_{C,B}$。
4. $\dim U^{\perp}=\dim V-\dim U$、$\operatorname{im}f^{*}=(\ker f)^{\perp}$、したがって $\operatorname{rank}f^{*}=\operatorname{rank}f$。行列では、列ベクトルの張る空間と行ベクトルの張る空間の次元は等しい（**行の階数＝列の階数**）。
:::

::: proof
**Step 1（1）.** $\varphi=\sum_{i}\varphi(b_{i})b_{i}^{*}$（両辺を $b_{j}$ で評価）なので生成、$\sum c_{i}b_{i}^{*}=0$ を $b_{j}$ で評価すると $c_{j}=0$ で一次独立。

**Step 2（2）.** $\iota(v)=0$ なら、$v\neq0$ のとき $v$ を含む基底をとり（AC）、$v$ で $1$、他で $0$ の $\varphi$ を作ると $\varphi(v)=1$ で矛盾。よって単射。有限次元なら $\dim V^{**}=\dim V$（1 を 2 回）なので、\ref{lin:rank-nullity} の後半から同型。

**Step 3（3）.** $f^{*}(c_{i}^{*})(b_{j})=c_{i}^{*}(f(b_{j}))=a_{ij}$ なので $f^{*}(c_{i}^{*})=\sum_{j}a_{ij}b_{j}^{*}$、すなわち $[f^{*}]$ の第 $i$ 列は $[f]$ の第 $i$ 行。

**Step 4（零化空間の次元）.** $U$ の基底 $(b_{1},\dots,b_{r})$ を $V$ の基底に延長すると、$\varphi=\sum c_{i}b_{i}^{*}$ が $U$ で $0$ $\iff c_{1}=\dots=c_{r}=0$ なので、$U^{\perp}$ の基底は $b_{r+1}^{*},\dots,b_{n}^{*}$。

**Step 5（像の記述と階数）.** $\operatorname{im}f^{*}\subset(\ker f)^{\perp}$：$\varphi\circ f$ は $\ker f$ で $0$。次元を比べる：$\ker f^{*}=\{\varphi : \varphi|_{\operatorname{im}f}=0\}=(\operatorname{im}f)^{\perp}$ なので、\ref{lin:rank-nullity} と Step 4 から $\dim\operatorname{im}f^{*}=\dim W-\dim(\operatorname{im}f)^{\perp}=\operatorname{rank}f$。一方 $\dim(\ker f)^{\perp}=\dim V-\dim\ker f=\operatorname{rank}f$。よって等号。行列 $A$ の列の張る空間は $\operatorname{im}(x\mapsto Ax)$、行の張る空間は ${}^{t}A$ の列の張る空間で、3 から $\operatorname{rank}{}^{t}A=\operatorname{rank}A$。
:::

::: remark 無限次元の双対
$V$ が無限次元なら $\iota:V\to V^{**}$ は同型でなく、実は $\dim V^{*}>\dim V$ であることが知られている（エルデシュ–カプランスキーの定理から $\dim V^{*}=|k|^{\dim V}$。本サイト未収録）。たとえば $V=k^{(\mathbb{N})}$ の双対は $k^{\mathbb{N}}$ で、双対基底 $b_{i}^{*}$ は $V^{*}$ を張らない（すべての $b_{i}$ で $1$ をとる汎関数は有限和で書けない）。位相をもつ空間の双対（連続な汎関数）を考える関数解析では、この点が根本的に変わる。
:::

::: remark 可換環上の行列
可換環 $A$ 上の自由加群 $A^{n}\to A^{m}$ も行列で表され、\ref{lin:matrix-correspondence}・\ref{lin:change-of-basis} の変換公式・双対の転置（3）は同じ証明で成り立つ。しかし次元定理は成り立たない（$\mathbb{Z}\xrightarrow{2}\mathbb{Z}$ は単射で全射でない）。PID 上の行列の同値類は階数ではなく**単因子**で分類される（\ref{mod:smith-normal-form}）。また有限生成加群の自己準同型については「全射なら単射」が任意の可換環で成り立つ（\ref{ring:vasconcelos}）が、「単射なら全射」は成り立たない。
:::

::: hypcheck
- **有限次元**：\ref{lin:rank-nullity} の後半、\ref{lin:dual-properties.1}・\ref[2]{lin:dual-properties.2}・\ref[4]{lin:dual-properties.4} で使う。無限次元では $k[x]\xrightarrow{\cdot x}k[x]$ は単射で全射でなく、$V\to V^{**}$ は同型でない。
- **体であること**：次元定理の証明で基底の延長（\ref{lin:basis-existence}）を使う。上の注意のとおり環上では偽。
- **選択公理**：無限次元の基底の延長（\ref{lin:rank-nullity}, \ref{lin:dual-properties.2}）で使う。
:::

::: supplement
**前提を弱めると.** 次元定理は「$0\to\ker f\to V\to\operatorname{im}f\to0$ が完全で、次元が短完全列で加法的」という形で、有限長の加群の長さ（\ref{ring:noetherian-artinian-def} の文脈）に一般化される。

**似た定理.** 位相ベクトル空間では、ハーン–バナッハの定理が \ref{lin:dual-properties} の Step 2（$v\neq0$ を分離する汎関数の存在）の代わりになる。有限次元では、行列の階数は小行列式でも特徴付けられる（\ref{lin:page-minors}）。

**計算の観点.** 表現行列の計算は、基底の像の座標を求めること（連立一次方程式）に帰着し、階数・核・像の基底は掃き出し法で求められる（\ref{lin:page-rank-elimination}）。
:::

## 高い視点 {#lin:sec-lm-viewpoint}

::: remark 有限次元ベクトル空間の圏と行列の圏
\ref{lin:matrix-correspondence} は、基底を選ぶことで「有限次元ベクトル空間と線形写像の圏」が「自然数 $n$ を対象、$m\times n$ 行列を射とする圏」と**圏同値**になることを言う（各空間は $k^{\dim V}$ と同型で、同型類は次元で決まる）。双対 $V\mapsto V^{*}$ は反変関手で、$\iota:\mathrm{id}\Rightarrow(-)^{**}$ は**自然同型**（基底によらない）——これが「自然」という言葉の歴史的な出発点（アイレンベルグ–マックレーン）である。一方 $V\cong V^{*}$ は基底を選ばないと作れない（自然でない）。比喩で言えば、行列は線形写像を「座標という眼鏡」で見た像で、眼鏡を替えると $Q^{-1}AP$ と映り方が変わるが、階数のような眼鏡によらない量だけが写像そのものの性質である。
:::

## 問題 {#lin:sec-lm-problems}

::: problem {#lin:prob-lm-derivative}
$V=k[x]_{\le n}$ と微分 $D:V\to V$, $f\mapsto f'$ について、基底 $(1,x,\dots,x^{n})$ に関する表現行列、$\ker D$, $\operatorname{rank}D$ を求めよ（$k$ の標数は $0$ とする）。
:::

::: solution
$D(x^{j})=jx^{j-1}$ なので、行と列を $0,\dots,n$ で番号付けると、表現行列の第 $j$ 列は第 $j-1$ 行の成分 $j$ だけが $0$ でない（$j\ge1$；第 $0$ 列は $0$）。標数 $0$ なので $j\neq0$。$\ker D=k$（定数）で次元 1、次元定理から $\operatorname{rank}D=n$、像は $k[x]_{\le n-1}$。（標数 $p$ では $x^{p}$ も核に入る。）
:::

::: problem {#lin:prob-lm-trace-dual}
$V=M_{n}(k)$ で、$A\mapsto(X\mapsto\operatorname{tr}(AX))$ が同型 $V\cong V^{*}$ を与えることを示せ。
:::

::: solution
写像 $\Phi$ は線形。$\Phi(A)=0$ なら、行列単位 $E_{ji}$ について $\operatorname{tr}(AE_{ji})=a_{ij}=0$ がすべての $i,j$ で成り立ち $A=0$。$\dim V=\dim V^{*}=n^{2}$ なので、\ref{lin:rank-nullity} から同型。
:::
