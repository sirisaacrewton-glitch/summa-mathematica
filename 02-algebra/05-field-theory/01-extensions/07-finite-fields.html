# 有限体 {#fld:page-finite-fields keywords="finite field, Galois field F_q, existence and uniqueness of F_{p^n}, subfields of finite fields, Frobenius automorphism generates the automorphism group, irreducible polynomials over finite fields"}

有限体の元の個数は素数の冪 $q=p^{n}$ で、各 $q$ に対して $q$ 元体 $\mathbb{F}_{q}$ が同型を除いてただ一つ存在する：$\mathbb{F}_{q}$ は $x^{q}-x$ の $\mathbb{F}_{p}$ 上の分解体で、その元はちょうど $x^{q}-x$ の根である（\ref{fld:finite-field-classification}）。$\mathbb{F}_{p^{n}}$ の部分体は $n$ の約数 $d$ ごとにただ一つの $\mathbb{F}_{p^{d}}$ で（\ref{fld:finite-subfields}）、$\mathbb{F}_{p^{n}}$ の自己同型群はフロベニウス写像 $a\mapsto a^{p}$ で生成される位数 $n$ の巡回群である（\ref{fld:finite-field-automorphisms}）。これは最初の、そして最も簡単なガロア群の例になる。

> 雪江明彦『代数学 2』第 3 章 §3.5 を参考にした。

## 記法と定義の確認 {#fld:sec-ff-notation}

::: notation
- 素体・次数・塔の公式は \ref{fld:prime-field}, \tref{fld:tower-law}、分解体とその一意性は \ref{fld:splitting-field-existence}, \ref{fld:splitting-field-uniqueness}、延長の個数は \ref{fld:extension-count}、分離性の判定と完全体は \ref{fld:separable-criterion}, \ref{fld:perfect-separable}、乗法群の有限部分群は \ref{fld:finite-multiplicative-cyclic}。
- フロベニウス写像 $\phi(a)=a^{p}$ は標数 $p$ の体の準同型（\ref{ring:char-domain.3}）。$\mathbb{F}_{p}=\Z/p\Z$。
- **選択公理**：使わない（代数閉包を使わずに、分解体の中で議論する）。
:::

## 存在と一意性 {#fld:sec-ff-classification}

::: theorem 有限体の分類 {#fld:finite-field-classification keywords="a finite field has p^n elements; F_{p^n} exists and is unique up to isomorphism, the splitting field of x^{p^n}-x" index="有限体|ゆうげんたい, ガロア体|がろあたい"}
1. 有限体 $F$ の元の個数は $q=p^{n}$（$p=\operatorname{char}F$, $n=[F:\mathbb{F}_{p}]$）で、$F$ の元はちょうど $x^{q}-x$ の根である：$x^{q}-x=\prod_{a\in F}(x-a)$。
2. 素数 $p$ と $n\ge 1$ について、$q=p^{n}$ 元の体が存在し、それは $x^{q}-x$ の $\mathbb{F}_{p}$ 上の分解体として同型を除いて一意。これを $\mathbb{F}_{q}$ と書く。
:::

::: proof
**Step 1（元の個数）.** $F$ は有限なので標数は素数 $p$（標数 $0$ なら $\Q$ を含み無限）、素体は $\mathbb{F}_{p}$（\ref{fld:prime-field}）。$F$ は $\mathbb{F}_{p}$ 上 $n$ 次元のベクトル空間なので $\abs{F}=p^{n}$。

**Step 2（根）.** $F^{\times}$ は位数 $q-1$ の群なので、ラグランジュの定理から $a\neq 0$ について $a^{q-1}=1$、$a^{q}=a$。$a=0$ も $x^{q}-x$ の根。$x^{q}-x$ は次数 $q$ で $q$ 個の相異なる根 $a\in F$ をもつので、因数定理から $\prod_{a\in F}(x-a)$ に等しい。

**Step 3（存在）.** $g=x^{q}-x\in\mathbb{F}_{p}[x]$ の分解体 $L$ をとる。$g'=qx^{q-1}-1=-1$ なので $g$ は分離的（\ref{fld:separable-criterion.1}）で、$L$ に $q$ 個の相異なる根がある。根全体 $R$ は $L$ の部分体：$a,b\in R$ なら $(a\pm b)^{q}=a^{q}\pm b^{q}$（フロベニウスを $n$ 回）、$(ab)^{q}=a^{q}b^{q}$、$(a^{-1})^{q}=a^{-1}$ で、$0,1\in R$。$L$ は根で生成されるので $L=R$ で、$\abs{L}=q$。

**Step 4（一意性）.** 1 から、$q$ 元の体 $F$ は $x^{q}-x$ の $\mathbb{F}_{p}$ 上の分解体（$F$ で分解し、$F$ は根全体）。分解体の一意性（\ref{fld:splitting-field-uniqueness}）から同型を除いて一意。
:::

::: corollary 有限体の性質 {#fld:finite-field-properties keywords="F_q^x is cyclic; F_q = F_p(alpha) for a generator; F_q/F_p is separable and normal" index="有限体の性質|ゆうげんたいのせいしつ"}
1. $\mathbb{F}_{q}^{\times}$ は位数 $q-1$ の巡回群（\ref{fld:finite-multiplicative-cyclic}）で、その生成元 $\alpha$ について $\mathbb{F}_{q}=\mathbb{F}_{p}(\alpha)$。特に $\mathbb{F}_{p}$ 上 $n$ 次の既約多項式が存在する（$\alpha$ の最小多項式）。
2. $\mathbb{F}_{q}/\mathbb{F}_{p}$ は分離的かつ正規（$x^{q}-x$ の分解体で、$x^{q}-x$ は分離的）。
:::

## 部分体と自己同型 {#fld:sec-ff-subfields}

::: theorem 部分体 {#fld:finite-subfields keywords="subfields of F_{p^n} correspond to divisors of n" index="有限体の部分体|ゆうげんたいのぶぶんたい"}
$\mathbb{F}_{p^{n}}$ の部分体は、$n$ の各約数 $d$ についてただ一つの $p^{d}$ 元の部分体 $\{a : a^{p^{d}}=a\}$ で、それ以外にない。部分体 $K\subset L$ について、$\mathbb{F}_{p^{d}}\subset\mathbb{F}_{p^{e}}$（ある共通の体の中で）$\iff d\mid e$。
:::

::: proof
**Step 1（約数）.** 部分体 $K$ は $p^{d}$ 元（$d=[K:\mathbb{F}_{p}]$）で、塔の公式 $n=[L:K]d$ から $d\mid n$。$K$ の元は $a^{p^{d}}=a$ をみたし（\ref{fld:finite-field-classification.1}）、その個数 $p^{d}$ は方程式 $x^{p^{d}}-x$ の根の個数の上限に等しいので、$K=\{a\in L : a^{p^{d}}=a\}$。よって $p^{d}$ 元の部分体は高々一つ。

**Step 2（存在）.** $d\mid n$ なら $p^{d}-1\mid p^{n}-1$（$n=de$ とし $y^{e}-1=(y-1)(y^{e-1}+\dots+1)$ に $y=p^{d}$）、したがって $x^{p^{d}-1}-1\mid x^{p^{n}-1}-1$（同じ式に $y=x^{p^{d}-1}$）、$x^{p^{d}}-x\mid x^{p^{n}}-x$。後者は $L$ で相異なる一次式の積なので、前者も $L$ で $p^{d}$ 個の根をもち、それらは（\ref{fld:finite-field-classification} の Step 3 と同じく）部分体をなす。

**Step 3（包含）.** 1・2 の議論そのもの。
:::

::: theorem 自己同型群 {#fld:finite-field-automorphisms keywords="Aut(F_{p^n}) is cyclic of order n generated by the Frobenius automorphism; fixed field of phi^d is F_{p^d}" index="フロベニウス自己同型|ふろべにうすじこどうけい, 有限体の自己同型群|ゆうげんたいのじこどうけいぐん"}
$L=\mathbb{F}_{p^{n}}$ の自己同型群 $\operatorname{Aut}(L)$ は、フロベニウス写像 $\phi(a)=a^{p}$ で生成される位数 $n$ の巡回群である。$d\mid n$ について $\phi^{d}$ で固定される元全体は $\mathbb{F}_{p^{d}}$。
:::

::: proof
**Step 1（$\phi$ は自己同型）.** $\phi$ は体の準同型なので単射、有限集合なので全射。自己同型はすべて素体 $\mathbb{F}_{p}$ を固定する（$1$ を固定し、$1$ で生成される）。

**Step 2（位数）.** $\phi^{k}(a)=a^{p^{k}}$。$\phi^{n}=\id$（\ref{fld:finite-field-classification.1}）。$1\le k<n$ で $\phi^{k}=\id$ なら、$L$ の $p^{n}$ 個の元がすべて $x^{p^{k}}-x$ の根になり、根は $p^{k}<p^{n}$ 個以下なので矛盾。よって $\phi$ の位数は $n$。

**Step 3（全体）.** \ref{fld:extension-count.1} から $\abs{\operatorname{Aut}(L)}=\abs{\Hom_{\mathbb{F}_{p}}(L,L)}\le[L:\mathbb{F}_{p}]=n$。$\langle\phi\rangle$ は位数 $n$ の部分群なので全体。

**Step 4（固定体）.** $\phi^{d}(a)=a\iff a^{p^{d}}=a\iff a\in\mathbb{F}_{p^{d}}$（\ref{fld:finite-subfields}）。
:::

## 問題 {#fld:sec-ff-problems}

::: problem {#fld:prob-ff-irreducible-divides}
$f\in\mathbb{F}_{p}[x]$ を $d$ 次のモニック既約多項式とすると、$f\mid x^{p^{n}}-x\iff d\mid n$ を示せ。また $x^{p^{n}}-x$ は、次数が $n$ の約数であるモニック既約多項式すべての積に等しいことを示せ。
:::

::: solution
**Step 1.** $f$ の根 $\alpha$ について $\mathbb{F}_{p}(\alpha)\cong\mathbb{F}_{p^{d}}$。$f\mid x^{p^{n}}-x$ なら $\alpha$ は $x^{p^{n}}-x$ の分解体 $\mathbb{F}_{p^{n}}$ の元（適当な体の中で）で、$\mathbb{F}_{p}(\alpha)\subset\mathbb{F}_{p^{n}}$ から $d\mid n$（\ref{fld:finite-subfields}）。逆に $d\mid n$ なら $\alpha^{p^{d}}=\alpha$ から $\alpha^{p^{n}}=\alpha$（$\phi^{d}$ を繰り返す）で、$\alpha$ の最小多項式 $f$ は $x^{p^{n}}-x$ を割り切る。

**Step 2.** $x^{p^{n}}-x$ は分離的なので平方因子をもたず、そのモニック既約因子は Step 1 からちょうど次数が $n$ の約数のもの。$\mathbb{F}_{p}[x]$ は一意分解環なので積に等しい。
:::

::: problem {#fld:prob-ff-count-degree-2}
$\mathbb{F}_{p}$ 上の 2 次のモニック既約多項式の個数は $(p^{2}-p)/2$ であることを示せ。
:::

::: solution
前問から $x^{p^{2}}-x$ は 1 次と 2 次のモニック既約多項式の積。次数を比べると $p^{2}=p\cdot 1+N\cdot 2$（1 次は $x-a$, $a\in\mathbb{F}_{p}$ の $p$ 個、$N$ は 2 次の個数）。よって $N=(p^{2}-p)/2$。
:::

::: supplement
**高い視点.** $\mathbb{F}_{p}$ の代数閉包 $\bar{\mathbb{F}}_{p}$ は、$n$ の整除関係で並んだ $\mathbb{F}_{p^{n}}$ の和集合で、その自己同型群は、各段の $\Z/n\Z$ を整除関係で逆極限にとった群 $\hat\Z$ になる。フロベニウス $\phi$ は「位相的な生成元」である（\ref{fld:page-infinite-galois}）。数論幾何では、有限体上の多様体の点の個数がフロベニウスの固定点として数えられ、ゼータ関数の理論につながる。

**計算の観点.** $\mathbb{F}_{q}$ 上の多項式の因数分解は、バーレカンプのアルゴリズム（1967 年）で $q$ と次数について多項式時間でできる。乱択を許せば、カントールとザッセンハウスのアルゴリズム（1981 年）で $\log q$ と次数について多項式時間でできることが知られている（本サイト未収録）。
:::
