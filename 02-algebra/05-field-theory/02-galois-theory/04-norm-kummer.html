# ノルム・トレースとクンマー理論 {#fld:page-norm-kummer keywords="norm, trace, transitivity of norm and trace, Hilbert's theorem 90, Galois cohomology H^1, cyclic extension, Kummer theory, Kummer pairing, Artin-Schreier extension"}

有限次拡大 $L/K$ のノルム $N_{L/K}$ とトレース $\operatorname{Tr}_{L/K}$ は、元の掛け算を $K$ 線形写像とみたときの行列式とトレースである（\ref{ring:trace-norm}）。このページではまず、それらを $\Omega$ への埋め込みで書き表し、拡大の塔について推移的であることを示す。次に**ヒルベルトの定理 90**（ノルムが $1$ の元は $y/\sigma(y)$ の形）を証明する。その応用として、1 の $n$ 乗根を含む体の巡回拡大はすべて $\sqrt[n]{a}$ を添加したもの（**クンマー拡大**）であること、さらに指数 $n$ のアーベル拡大が $K^{\times}/K^{\times n}$ の部分群と、有限アーベル群の双対性（\ref{grp:finite-abelian-duality}）を通して対応すること（**クンマー理論**）を示す。標数 $p$ の次数 $p$ の巡回拡大は、冪根の代わりに $x^{p}-x-a$ の根で作られる（**アルティン＝シュライアー拡大**）。

> 雪江『代数学 2』§4.12–4.15 の内容を参考にし、証明は独自に組み立てた（ヒルベルト 90 はデデキントの補題から直接示す。クンマー理論は双対性として述べる）。

## 記法と定義の確認 {#fld:sec-nk-notation}

::: notation
- 体の有限次拡大 $L/K$、$L$ を含む代数的閉体 $\Omega$ を固定する。$K$ 埋め込み $L\to\Omega$ の全体を $\Hom_{K}(L,\Omega)$ と書き、その個数が分離次数 $[L:K]_{s}$（\ref{fld:separable-degree-def}, \ref{fld:separable-degree}）。**非分離次数**を $[L:K]_{i}\defeq[L:K]/[L:K]_{s}$ とおく。これは $1$ か標数 $p$ の冪（\ref{fld:purely-inseparable}）で、塔について乗法的（$[L:K]$ と $[L:K]_{s}$ が乗法的なので）。
- ノルム・トレースの定義と、最小多項式による表示（$x$ の最小多項式を $X^{r}-c_{1}X^{r-1}+\dots+(-1)^{r}c_{r}$、$s=[L:K(x)]$ とすると $\operatorname{Tr}_{L/K}(x)=sc_{1}$, $N_{L/K}(x)=c_{r}^{s}$）は \ref{ring:trace-norm}, \ref{ring:trace-conjugates.1}。
- ガロア拡大・ガロア群は \ref{fld:galois-extension}、デデキントの補題（相異なる埋め込みは $\Omega$ 上一次独立）は \tref{fld:dedekind-independence}、基本定理は \tref{fld:fundamental-theorem}, \ref{fld:galois-lattice}。1 の $n$ 乗根の群 $\mu_{n}$ は \ref{fld:roots-of-unity}。
- 有限アーベル群の指標群（双対群）と双対性は \ref{grp:dual-group}, \ref{grp:dual-group-basic}, \ref{grp:finite-abelian-duality}。
- **選択公理**：代数的閉体 $\Omega$ の存在と埋め込みの延長（\ref{fld:embedding-algebraic-closure}）を通して使う。$L$ を含む具体的な代数的閉体（例えば $\mathbb{C}$）があれば不要。
:::

## ノルムとトレース {#fld:sec-nk-norm-trace}

::: lemma 最小多項式の根の重複度 {#fld:root-multiplicity keywords="all roots of an irreducible polynomial have the same multiplicity, equal to the inseparable degree" index="根の重複度|ねのちょうふくど"}
$x\in L$ の $K$ 上の最小多項式 $f$ は、$\Omega$ の中で
$$
f=\prod_{j=1}^{r}(X-\alpha_{j})^{m},\qquad r=[K(x):K]_{s},\quad m=[K(x):K]_{i}
$$
（$\alpha_{j}$ は相異なる）と分解する。
:::

::: proof
**Step 1（根の間を移る自己同型）.** $f$ の根 $\alpha,\beta$ について、$K(\alpha)\to\Omega$, $\alpha\mapsto\beta$ は $K$ 埋め込み（\ref{fld:extension-simple}）で、\ref{fld:embedding-algebraic-closure} から $K$ 埋め込み $\tau:\Omega\to\Omega$ に延長できる。$\tau(\Omega)$ は代数的閉体で、$\Omega$ はその上代数的なので $\tau(\Omega)=\Omega$、すなわち $\tau$ は自己同型。

**Step 2（重複度が等しい）.** $f=\prod_{j}(X-\alpha_{j})^{m_{j}}$ と書く。$f$ の係数は $K$ に属するので、$\tau$ を係数に施しても $f$ は変わらず、$f=\prod_{j}(X-\tau(\alpha_{j}))^{m_{j}}$。$\tau$ は根を並べ替えるので、分解の一意性から $\alpha$ の重複度と $\beta=\tau(\alpha)$ の重複度は等しい。

**Step 3（個数）.** 相異なる根の個数 $r$ は $[K(x):K]_{s}$（\ref{fld:separable-degree.1}）で、$\deg f=rm=[K(x):K]$ から $m=[K(x):K]_{i}$。
:::

::: theorem ノルム・トレースの埋め込みによる表示 {#fld:norm-trace-embeddings keywords="norm and trace as product and sum over embeddings, raised to the inseparable degree; trace vanishes for inseparable extensions" index="ノルムの表示|のるむのひょうじ"}
$\Hom_{K}(L,\Omega)=\{\sigma_{1},\dots,\sigma_{r}\}$、$q=[L:K]_{i}$ とすると、$x\in L$ について
$$
N_{L/K}(x)=\Bigl(\prod_{i=1}^{r}\sigma_{i}(x)\Bigr)^{q},\qquad\operatorname{Tr}_{L/K}(x)=q\sum_{i=1}^{r}\sigma_{i}(x).
$$
特に $L/K$ がガロア拡大なら $N_{L/K}(x)=\prod_{\sigma\in\operatorname{Gal}(L/K)}\sigma(x)$, $\operatorname{Tr}_{L/K}(x)=\sum_{\sigma}\sigma(x)$。
:::

::: proof
**Step 1（埋め込みの数え方）.** $K(x)$ の $K$ 埋め込みは $x$ を最小多項式 $f$ の相異なる根 $\alpha_{1},\dots,\alpha_{r'}$（$r'=[K(x):K]_{s}$）のどれかに送るもので、それぞれ $L$ への延長がちょうど $t\defeq[L:K(x)]_{s}$ 個ある（\ref{fld:separable-degree.2} と \ref{fld:extension-count}）。よって $\sigma_{1}(x),\dots,\sigma_{r}(x)$ には各 $\alpha_{j}$ がちょうど $t$ 回ずつ現れ、$\prod_{i}\sigma_{i}(x)=\prod_{j}\alpha_{j}^{t}$、$\sum_{i}\sigma_{i}(x)=t\sum_{j}\alpha_{j}$。

**Step 2（最小多項式の係数）.** \ref{fld:root-multiplicity} から $f=\prod_{j}(X-\alpha_{j})^{m}$（$m=[K(x):K]_{i}$）なので、$c_{r}=\prod_{j}\alpha_{j}^{m}$、$c_{1}=m\sum_{j}\alpha_{j}$。$s=[L:K(x)]=t\cdot[L:K(x)]_{i}$ とおくと、\ref{ring:trace-conjugates.1} から
$$
N_{L/K}(x)=c_{r}^{s}=\prod_{j}\alpha_{j}^{ms}=\Bigl(\prod_{j}\alpha_{j}^{t}\Bigr)^{m[L:K(x)]_{i}}=\Bigl(\prod_{i}\sigma_{i}(x)\Bigr)^{q}.
$$
最後に $q=[L:K]_{i}=[L:K(x)]_{i}\,m$（乗法性）を使った。トレースも同様に $sc_{1}=t[L:K(x)]_{i}\,m\sum_{j}\alpha_{j}=q\sum_{i}\sigma_{i}(x)$。

**Step 3（ガロアの場合）.** ガロア拡大は分離的なので $q=1$ で、$\Hom_{K}(L,\Omega)$ は $\operatorname{Gal}(L/K)$ の元と $L\subset\Omega$ の包含の合成全体（正規性。\ref{fld:normal-equivalent}）。
:::

::: corollary トレースと分離性 {#fld:trace-separable keywords="the trace map is surjective iff the extension is separable" index="トレースと分離性|とれーすとぶんりせい"}
$\operatorname{Tr}_{L/K}:L\to K$ は、$L/K$ が分離的なら全射、分離的でないなら $0$ 写像である。
:::

::: proof
分離的でなければ $q$ は標数 $p$ の正の冪で、$K$ で $q=0$。分離的なら $q=1$ で $\operatorname{Tr}=\sum_{i}\sigma_{i}$。\ref{fld:dedekind-independence}から、相異なる $\sigma_{i}$ の係数 $1$ の和は $0$ 写像でない。$\operatorname{Tr}$ は $K$ 線形で値は $1$ 次元の $K$ にあるので、$0$ でなければ全射。
:::

::: theorem ノルム・トレースの推移律 {#fld:norm-trace-tower keywords="transitivity of norm and trace in towers" index="ノルムの推移律|のるむのすいいりつ"}
$K\subset M\subset L$ を有限次拡大の塔とすると、$N_{L/K}=N_{M/K}\circ N_{L/M}$、$\operatorname{Tr}_{L/K}=\operatorname{Tr}_{M/K}\circ\operatorname{Tr}_{L/M}$。
:::

::: proof
**Step 1（埋め込みの分解）.** 各 $\tau\in\Hom_{K}(M,\Omega)$ について、\ref{fld:root-multiplicity} の Step 1 と同様に $\tau$ を $\Omega$ の自己同型 $\tilde\tau$ に延長しておく。$\Hom_{M}(L,\Omega)=\{\rho_{1},\dots,\rho_{u}\}$ とすると、
$$
\Hom_{K}(L,\Omega)=\{\tilde\tau\circ\rho_{k} : \tau\in\Hom_{K}(M,\Omega),\ 1\le k\le u\}
$$
で、右辺の元は相異なる。実際、$\sigma\in\Hom_{K}(L,\Omega)$ について $\tau\defeq\sigma|_{M}$ とすると $\tilde\tau^{-1}\circ\sigma$ は $M$ 上恒等で、ある $\rho_{k}$ に等しい。$M$ への制限で $\tau$ が決まり、$\tilde\tau$ は単射なので $k$ も決まる。

**Step 2（ノルム）.** $q_{1}=[M:K]_{i}$, $q_{2}=[L:M]_{i}$ とすると $q_{1}q_{2}=[L:K]_{i}$。\ref{fld:norm-trace-embeddings} から $N_{L/M}(x)=(\prod_{k}\rho_{k}(x))^{q_{2}}\in M$ で、$\tau(N_{L/M}(x))=\tilde\tau(N_{L/M}(x))=(\prod_{k}\tilde\tau\rho_{k}(x))^{q_{2}}$。よって
$$
N_{M/K}(N_{L/M}(x))=\Bigl(\prod_{\tau}\tau(N_{L/M}(x))\Bigr)^{q_{1}}=\Bigl(\prod_{\tau,k}\tilde\tau\rho_{k}(x)\Bigr)^{q_{1}q_{2}}=N_{L/K}(x).
$$
トレースも積を和に、冪を倍に替えて同じ。
:::

::: example
1. $L=\Q(\sqrt{d})$（$d$ は平方数でない整数）で、$\operatorname{Gal}=\{1,\sigma\}$, $\sigma(\sqrt{d})=-\sqrt{d}$ なので、$N(a+b\sqrt{d})=(a+b\sqrt{d})(a-b\sqrt{d})=a^{2}-db^{2}$、$\operatorname{Tr}(a+b\sqrt{d})=2a$。
2. $\mathbb{F}_{q^{n}}/\mathbb{F}_{q}$ では $\operatorname{Gal}$ はフロベニウス $x\mapsto x^{q}$ で生成される巡回群（\ref{fld:finite-field-automorphisms}）なので、$N(x)=x^{1+q+\dots+q^{n-1}}=x^{(q^{n}-1)/(q-1)}$。乗法群 $\mathbb{F}_{q^{n}}^{\times}$ は位数 $q^{n}-1$ の巡回群（\ref{fld:finite-multiplicative-cyclic}）なので、ノルム $\mathbb{F}_{q^{n}}^{\times}\to\mathbb{F}_{q}^{\times}$ は全射（核の位数が $(q^{n}-1)/(q-1)$ なので像の位数は $q-1$）。
3. 純非分離拡大 $L=K(t^{1/p})$（$K=\mathbb{F}_{p}(t)$）では $\Hom_{K}(L,\Omega)$ は 1 元で $q=p$。$N(t^{1/p})=(t^{1/p})^{p}=t$、$\operatorname{Tr}=0$。
:::

## ヒルベルトの定理 90 {#fld:sec-nk-hilbert90}

::: theorem ヒルベルトの定理 90 {#fld:hilbert-90 keywords="Hilbert's theorem 90, H^1(G, L^x) = 1, H^1(G, L) = 0, crossed homomorphisms are coboundaries" index="ヒルベルトの定理 90|ひるべるとのていりきゅうじゅう, 1 コサイクル|いちこさいくる"}
$L/K$ を有限次ガロア拡大、$G=\operatorname{Gal}(L/K)$ とする。
1. （乗法版）写像 $a:G\to L^{\times}$ が $a_{\sigma\tau}=a_{\sigma}\,\sigma(a_{\tau})$（すべての $\sigma,\tau$）をみたすなら、$a_{\sigma}=y/\sigma(y)$ となる $y\in L^{\times}$ がある。
2. （加法版）写像 $a:G\to L$ が $a_{\sigma\tau}=a_{\sigma}+\sigma(a_{\tau})$ をみたすなら、$a_{\sigma}=y-\sigma(y)$ となる $y\in L$ がある。
:::

::: proof
**Step 1（1）.** $z\in L$ について $y_{z}\defeq\sum_{\tau\in G}a_{\tau}\tau(z)$ とおく。係数 $a_{\tau}$ はどれも $0$ でなく、$\tau$ は相異なるので、\ref{fld:dedekind-independence}から $y\defeq y_{z}\neq0$ となる $z$ がある。$\sigma\in G$ について、条件から $\sigma(a_{\tau})=a_{\sigma}^{-1}a_{\sigma\tau}$ なので
$$
\sigma(y)=\sum_{\tau}\sigma(a_{\tau})\,\sigma\tau(z)=a_{\sigma}^{-1}\sum_{\tau}a_{\sigma\tau}\,\sigma\tau(z)=a_{\sigma}^{-1}y
$$
（$\tau\mapsto\sigma\tau$ は $G$ の全単射）。よって $a_{\sigma}=y/\sigma(y)$。

**Step 2（2）.** \ref{fld:trace-separable} から $\operatorname{Tr}(z)=1$ となる $z\in L$ がある。$y\defeq\sum_{\tau}a_{\tau}\tau(z)$ とおくと、$\sigma(a_{\tau})=a_{\sigma\tau}-a_{\sigma}$ から
$$
\sigma(y)=\sum_{\tau}(a_{\sigma\tau}-a_{\sigma})\,\sigma\tau(z)=y-a_{\sigma}\operatorname{Tr}(z)=y-a_{\sigma}.
$$

::: hypcheck
- **前提「ガロア拡大」**：Step 1 で $G$ の元が $L$ の相異なる自己同型であること（デデキントの補題）と $\tau\mapsto\sigma\tau$ の全単射性を、Step 2 で $\operatorname{Tr}=\sum_{\tau}\tau$ が全射であること（分離性）を使った。
- **選択公理**：Step 2 で \ref{fld:trace-separable}（$\Omega$ を使う）を通して使う。$L\subset\mathbb{C}$ のように具体的な代数的閉体があれば不要。Step 1 は $L$ の中だけの計算で使わない。
:::
:::

::: remark コホモロジーの言葉
条件 $a_{\sigma\tau}=a_{\sigma}\sigma(a_{\tau})$ をみたす $a$ を **1 コサイクル**、$\sigma\mapsto y/\sigma(y)$ の形のものを **1 コバウンダリー**といい、その比の群を $H^{1}(G,L^{\times})$ と書く。定理は $H^{1}(G,L^{\times})=1$、$H^{1}(G,L)=0$ を述べている（ネーターによる形）。ヒルベルトの原論文（1897 年の数論報告の定理 90）は次の巡回版である。
:::

::: corollary 巡回拡大でのヒルベルト 90 {#fld:hilbert-90-cyclic keywords="Hilbert 90 for cyclic extensions: norm one elements are y/sigma(y); trace zero elements are y - sigma(y)" index="ヒルベルト 90（巡回版）|ひるべるときゅうじゅうじゅんかいばん"}
$L/K$ を次数 $n$ の巡回拡大、$\sigma$ を $\operatorname{Gal}(L/K)$ の生成元とする。
1. $x\in L$ について $N_{L/K}(x)=1\iff x=y/\sigma(y)$ となる $y\in L^{\times}$ がある。
2. $x\in L$ について $\operatorname{Tr}_{L/K}(x)=0\iff x=y-\sigma(y)$ となる $y\in L$ がある。
:::

::: proof
**Step 1（$\Leftarrow$）.** \ref{fld:norm-trace-embeddings} から $N(y/\sigma(y))=\prod_{k}\sigma^{k}(y)/\prod_{k}\sigma^{k+1}(y)=1$。トレースも同様。

**Step 2（1 の $\Rightarrow$）.** $a_{\sigma^{k}}\defeq x\sigma(x)\cdots\sigma^{k-1}(x)$（$0\le k<n$、$a_{1}=1$）とおく。$N(x)=x\sigma(x)\cdots\sigma^{n-1}(x)=1$ なので、この式は $k$ を $n$ を法として考えても矛盾なく定まり（$k=n$ の値が $1=a_{\sigma^{0}}$）、$a_{\sigma^{k+l}}=a_{\sigma^{k}}\sigma^{k}(a_{\sigma^{l}})$ をみたす。\ref{fld:hilbert-90.1} から $x=a_{\sigma}=y/\sigma(y)$。

**Step 3（2 の $\Rightarrow$）.** 同様に $a_{\sigma^{k}}\defeq x+\sigma(x)+\dots+\sigma^{k-1}(x)$ とおき、\ref{fld:hilbert-90.2} を使う。
:::

::: example
$\Q(i)/\Q$ でノルムが $1$ の元 $x=a+bi$（$a^{2}+b^{2}=1$）は、$x=y/\bar y$ と書ける。$y=m+ni$（$m,n\in\Z$）とすると
$$
\frac{m+ni}{m-ni}=\frac{(m+ni)^{2}}{m^{2}+n^{2}}=\frac{m^{2}-n^{2}}{m^{2}+n^{2}}+\frac{2mn}{m^{2}+n^{2}}i
$$
（分母を払えば $y\in\Q(i)^{\times}$ は $\Z[i]$ の元にとれる）。したがって単位円上の有理点はすべてこの形で、ピタゴラス数 $(m^{2}-n^{2},2mn,m^{2}+n^{2})$ のパラメーター表示が得られる。
:::

## クンマー理論 {#fld:sec-nk-kummer}

以下、$n\ge1$ は $\operatorname{char}K$ で割り切れず、$K$ は 1 の原始 $n$ 乗根 $\zeta$ を含むとする。このとき $\mu_{n}=\langle\zeta\rangle\subset K$ は位数 $n$ の巡回群（\ref{fld:roots-of-unity}）。

::: theorem 巡回拡大と冪根 {#fld:kummer-cyclic keywords="if K contains the n-th roots of unity, cyclic extensions of degree dividing n are radical extensions K(a^(1/n))" index="クンマー拡大|くんまーかくだい, 冪根拡大|べきこんかくだい"}
1. $a\in K^{\times}$ と $\alpha^{n}=a$ となる $\alpha\in\Omega$ について、$K(\alpha)/K$ はガロア拡大で、$\sigma\mapsto\sigma(\alpha)/\alpha$ は単射準同型 $\operatorname{Gal}(K(\alpha)/K)\to\mu_{n}$。特に $\operatorname{Gal}$ は巡回群で、その位数 $d$ は $a$ の $K^{\times}/K^{\times n}$ での位数に等しい。$X^{n}-a$ が既約 $\iff$ $a$ の位数が $n$。
2. 逆に、$L/K$ が次数 $n$ の巡回拡大なら、$L=K(\alpha)$, $\alpha^{n}\in K$ となる $\alpha$ がある。
:::

::: proof
**Step 1（1：ガロア性）.** $X^{n}-a$ の根は $\zeta^{k}\alpha$（$0\le k<n$）で相異なり（$\zeta$ は原始的、$\alpha\neq0$）、すべて $K(\alpha)$ に属する。よって $K(\alpha)$ は分離多項式 $X^{n}-a$ の分解体で、ガロア拡大（\ref{fld:galois-equivalent}）。

**Step 2（1：$\mu_{n}$ への単射）.** $\sigma\in G=\operatorname{Gal}(K(\alpha)/K)$ について $\sigma(\alpha)$ も $X^{n}-a$ の根なので $\chi(\sigma)\defeq\sigma(\alpha)/\alpha\in\mu_{n}$。$\zeta\in K$ は $\sigma$ で動かないので $\chi(\sigma\tau)=\sigma(\chi(\tau)\alpha)/\alpha=\chi(\tau)\chi(\sigma)$。$\chi(\sigma)=1$ なら $\sigma$ は生成元 $\alpha$ を固定し恒等写像。$\mu_{n}$ の部分群なので $G$ は巡回群で、位数 $d$ は $n$ の約数（\ref{grp:subgroups-cyclic}）。

**Step 3（1：位数）.** $\chi(G)=\mu_{d}$ なので、$\sigma(\alpha^{d})=\chi(\sigma)^{d}\alpha^{d}=\alpha^{d}$、すなわち $\alpha^{d}\in K$（固定体。\ref{fld:fundamental-theorem}）で、$a^{d}=(\alpha^{d})^{n}\in K^{\times n}$。逆に $a^{e}=b^{n}$（$b\in K$）なら $(\alpha^{e}/b)^{n}=1$ で $\alpha^{e}\in K\mu_{n}=K$、$\chi(\sigma)^{e}=\sigma(\alpha^{e})/\alpha^{e}=1$ がすべての $\sigma$ で成り立ち $d\mid e$。よって $d$ は $a$ の $K^{\times}/K^{\times n}$ での位数。$X^{n}-a$ が既約 $\iff[K(\alpha):K]=n\iff d=n$。

**Step 4（2）.** $\sigma$ を生成元とする。$N_{L/K}(\zeta)=\zeta^{n}=1$（\ref{fld:norm-trace-embeddings}。$\zeta\in K$）なので、ヒルベルト 90（\ref{fld:hilbert-90-cyclic.1}）から $\zeta=y/\sigma(y)$ となる $y\in L^{\times}$ がある。$\alpha\defeq y$ とすると $\sigma(\alpha)=\zeta^{-1}\alpha$、$\sigma^{k}(\alpha)=\zeta^{-k}\alpha$ は $0\le k<n$ で相異なるので、$\alpha$ の $K$ 上の共役は $n$ 個以上あり $[K(\alpha):K]\ge n=[L:K]$、すなわち $L=K(\alpha)$。$\sigma(\alpha^{n})=\zeta^{-n}\alpha^{n}=\alpha^{n}$ なので $\alpha^{n}\in K$。

::: hypcheck
- **前提「$\zeta\in K$」**：Step 2 で $\chi$ が準同型であること（$\sigma(\zeta)=\zeta$）と、Step 4 でヒルベルト 90 を $\zeta$ に使うことに使った。外すと偽：$\Q(\sqrt[3]{2})/\Q$ はガロア拡大ですらない（$\Q$ は 1 の原始 3 乗根を含まない）。
- **前提「$\operatorname{char}K\nmid n$」**：Step 1 で根が相異なること（分離性）に使った。$\operatorname{char}K=p$, $n=p$ ではアルティン＝シュライアー理論（下）が代わりになる。
:::
:::

::: theorem クンマー理論 {#fld:kummer-theory keywords="Kummer theory: abelian extensions of exponent n correspond to subgroups of K^x / K^x^n; the Kummer pairing is perfect" index="クンマー理論|くんまーりろん, クンマー対|くんまーつい"}
$K^{\times n}\subset B\subset K^{\times}$ を $B/K^{\times n}$ が有限な部分群とし、$L_{B}\defeq K(\sqrt[n]{B})$（$B$ の元の $n$ 乗根をすべて添加した $\Omega$ の部分体）とおく。
1. $L_{B}/K$ は有限次アーベル拡大で、$G=\operatorname{Gal}(L_{B}/K)$ の元の位数は $n$ の約数。
2. （クンマー対）$\langle\sigma,a\rangle\defeq\sigma(\alpha)/\alpha$（$\alpha^{n}=a$）は well-defined な双線形写像 $G\times B/K^{\times n}\to\mu_{n}$ で、
$$
G\cong\Hom(B/K^{\times n},\mu_{n}),\qquad B/K^{\times n}\cong\Hom(G,\mu_{n}).
$$
特に $[L_{B}:K]=\lvert B/K^{\times n}\rvert$。
3. $B\mapsto L_{B}$ は、上の条件をみたす部分群 $B$ 全体から、$\Omega$ の中の $K$ の有限次アーベル拡大で $\operatorname{Gal}$ の元の位数が $n$ の約数であるもの全体への、包含を保つ全単射。逆写像は $L\mapsto K^{\times}\cap L^{\times n}$。
:::

::: proof
**Step 1（1）.** $B/K^{\times n}$ の生成元の代表 $a_{1},\dots,a_{t}$ をとると、$B$ の元は $a_{1}^{e_{1}}\cdots a_{t}^{e_{t}}b^{n}$（$b\in K$）なので、その $n$ 乗根は $\zeta^{k}\alpha_{1}^{e_{1}}\cdots\alpha_{t}^{e_{t}}b$ の形で、$L_{B}=K(\alpha_{1},\dots,\alpha_{t})$ は有限次。各 $K(\alpha_{i})$ はガロア拡大（\ref{fld:kummer-cyclic} の Step 1）なので、その合成体 $L_{B}$ もガロア拡大（分離多項式の積の分解体）。可換性と位数は 2 から従う。

**Step 2（2：well-defined と双線形）.** 別の $n$ 乗根 $\zeta^{k}\alpha$ をとっても $\sigma(\zeta^{k}\alpha)/\zeta^{k}\alpha=\sigma(\alpha)/\alpha$。$a=b^{n}\in K^{\times n}$ なら $\alpha=b\in K$ ととれて値は $1$。$a,a'$ の $n$ 乗根の積は $aa'$ の $n$ 乗根なので $a$ について乗法的。$\sigma$ については \ref{fld:kummer-cyclic} の Step 2 と同じ計算で乗法的。

**Step 3（2：両側の核が自明）.** $\langle\sigma,a\rangle=1$ がすべての $a\in B$ で成り立てば、$\sigma$ は生成元 $\alpha_{i}$ をすべて固定し $\sigma=1$。$\langle\sigma,a\rangle=1$ がすべての $\sigma$ で成り立てば $\alpha\in K$（固定体）で $a=\alpha^{n}\in K^{\times n}$。

**Step 4（2：同型）.** Step 3 から単射 $G\to\Hom(B/K^{\times n},\mu_{n})$ と $B/K^{\times n}\to\Hom(G,\mu_{n})$ がある。$G$ は単射で $\Hom(\cdot,\mu_{n})$ に入るので可換で、元の位数は $n$ の約数。位数が $n$ の約数の有限アーベル群 $H$ について $\Hom(H,\mu_{n})$ は指標群 $\hat H$ と同型（$\mu_{n}\cong\frac1n\Z/\Z\subset\Q/\Z$ で、$H$ からの準同型の値はそこに入る）なので位数は $\lvert H\rvert$（\ref{grp:dual-group-basic.3}）。よって $\lvert G\rvert\le\lvert B/K^{\times n}\rvert\le\lvert G\rvert$ で、二つの単射は同型。

**Step 5（3：単射）.** $B'\defeq K^{\times}\cap L_{B}^{\times n}$ とすると $B\subset B'$。$a\in B'$ について、$B''=B\langle a\rangle$ は $L_{B''}=L_{B}$（$a$ の $n$ 乗根は $L_{B}$ に属する。他の $n$ 乗根は $\zeta$ 倍）をみたすので、2 から $\lvert B''/K^{\times n}\rvert=[L_{B}:K]=\lvert B/K^{\times n}\rvert$、$B''=B$、$a\in B$。よって $B=K^{\times}\cap L_{B}^{\times n}$ で、$B$ は $L_{B}$ から決まる。

**Step 6（3：全射の準備）.** $L/K$ を、ガロア群 $G$ がアーベルで元の位数が $n$ の約数の有限次拡大とし、$B\defeq K^{\times}\cap L^{\times n}$ とおく（$K^{\times n}\subset B$）。$B/K^{\times n}$ は有限：$B\supset B_{0}\supset K^{\times n}$ で $B_{0}/K^{\times n}$ が有限なものについて、$L_{B_{0}}\subset L$（$B_{0}$ の元の $n$ 乗根の一つは $L$ に属し、他は $\zeta^{k}$ 倍）なので 2 から $\lvert B_{0}/K^{\times n}\rvert=[L_{B_{0}}:K]\le[L:K]$。$B/K^{\times n}$ が無限なら、元を一つずつ加えて有限部分群の真の増大列を作れ、位数が $[L:K]$ を超えるので矛盾。

**Step 7（3：全射）.** Step 6 の論法で $L_{B}\subset L$。逆に、構造定理（\tref{grp:finite-abelian-structure}）から $G=C_{1}\oplus\dots\oplus C_{t}$（巡回群、位数 $d_{i}\mid n$）。$H_{i}\defeq\bigoplus_{j\neq i}C_{j}$ の固定体 $L_{i}$ は $\operatorname{Gal}(L_{i}/K)\cong G/H_{i}\cong C_{i}$ の巡回拡大（\ref{fld:fundamental-theorem}）。$\mu_{d_{i}}\subset\mu_{n}\subset K$ なので \ref{fld:kummer-cyclic.2}（$n$ を $d_{i}$ として）から $L_{i}=K(\beta_{i})$, $\beta_{i}^{d_{i}}\in K$。$\beta_{i}^{n}=(\beta_{i}^{d_{i}})^{n/d_{i}}\in K^{\times}\cap L^{\times n}=B$ なので $\beta_{i}\in L_{B}$。$\bigcap_{i}H_{i}=0$ なので $L$ は $L_{1},\dots,L_{t}$ の合成体で（\ref{fld:galois-lattice}）、$L\subset L_{B}$。よって $L=L_{B}$。
:::

::: example
1. $n=2$, $\operatorname{char}K\neq2$：$K$ の 2 次拡大は $K(\sqrt{a})$（$a\in K^{\times}\setminus K^{\times2}$）で、$K(\sqrt{a})=K(\sqrt{b})\iff ab\in K^{\times2}$。$\Q$ の双 2 次拡大 $\Q(\sqrt{2},\sqrt{3})$ は $B=\langle2,3\rangle\Q^{\times2}$（$B/\Q^{\times2}\cong(\Z/2\Z)^{2}$）に対応する。
2. $K=\Q(\zeta_{3})$, $n=3$：$X^{3}-2$ は既約（$2\notin K^{\times3}$）で、$K(\sqrt[3]{2})/K$ は 3 次巡回拡大。$\Q(\sqrt[3]{2})/\Q$ がガロアでないことと対照的である。
:::

## アルティン＝シュライアー拡大 {#fld:sec-nk-artin-schreier}

::: theorem アルティン＝シュライアーの定理 {#fld:artin-schreier keywords="Artin-Schreier: cyclic extensions of degree p in characteristic p are generated by roots of x^p - x - a" index="アルティン＝シュライアー拡大|あるてぃんしゅらいあーかくだい" refname="アルティン＝シュライアーの定理"}
$\operatorname{char}K=p>0$ とする。
1. $a\in K$ について、$f=X^{p}-X-a$ は $K$ に根をもつか（このとき $K$ 上で一次式の積に分解する）、既約である。後者のとき、根 $\alpha$ について $K(\alpha)/K$ は次数 $p$ の巡回拡大で、生成元は $\alpha\mapsto\alpha+1$。
2. 逆に、$L/K$ が次数 $p$ の巡回拡大なら、$L=K(\alpha)$, $\alpha^{p}-\alpha\in K$ となる $\alpha$ がある。
:::

::: proof
**Step 1（根の形）.** $\alpha$ を $f$ の根とすると、$i\in\mathbb{F}_{p}$ について $(\alpha+i)^{p}-(\alpha+i)=\alpha^{p}+i^{p}-\alpha-i=\alpha^{p}-\alpha$（$i^{p}=i$。フェルマー）なので $\alpha+i$ も根。これで $p$ 個の相異なる根がすべて得られ、$f=\prod_{i\in\mathbb{F}_{p}}(X-\alpha-i)$。特に $K(\alpha)$ は分離多項式 $f$ の分解体でガロア拡大。$\alpha\in K$ なら $f$ は $K$ 上一次式の積。

**Step 2（1：既約性）.** $\alpha\notin K$ とする。$G=\operatorname{Gal}(K(\alpha)/K)$ の元 $\sigma$ について $\sigma(\alpha)=\alpha+i_{\sigma}$（$i_{\sigma}\in\mathbb{F}_{p}$）で、$\sigma\mapsto i_{\sigma}$ は単射準同型 $G\to\mathbb{F}_{p}$（$\sigma\tau(\alpha)=\alpha+i_{\tau}+i_{\sigma}$）。$\alpha\notin K$ なので $G\neq1$、よって $G\cong\Z/p\Z$、$[K(\alpha):K]=p=\deg f$ で $f$ は既約。生成元は $i_{\sigma}=1$ のもの。

**Step 3（2）.** $\sigma$ を生成元とする。$\operatorname{Tr}_{L/K}(-1)=-p=0$ なので、加法版ヒルベルト 90（\ref{fld:hilbert-90-cyclic.2}）から $-1=y-\sigma(y)$、すなわち $\sigma(y)=y+1$ となる $y\in L$ がある。$y\notin K$ なので $K(y)=L$（$[L:K]=p$ は素数）。$\sigma(y^{p}-y)=(y+1)^{p}-(y+1)=y^{p}-y$ なので $y^{p}-y\in K$。
:::

::: example
$\mathbb{F}_{p}$ 上の $X^{p}-X-1$ は根をもたない（$c\in\mathbb{F}_{p}$ で $c^{p}-c=0\neq1$）ので既約で、$\mathbb{F}_{p^{p}}=\mathbb{F}_{p}(\alpha)$ を与える。$X^{p}-X$ は $\mathbb{F}_{p}$ の元をすべて根にもつので、$a=0$ は「分解する」側の例。
:::

::: supplement
**一般化.** クンマー理論は、1 の冪根を含まない体や、標数 $p$ の $p$ 冪次数の場合（ヴィット・ベクトルによるアルティン＝シュライアー＝ヴィット理論）に一般化されることが知られている（本サイト未収録）。

**類体論への入口.** クンマー理論は「$K$ のアーベル拡大を $K$ 自身の乗法群の言葉で記述する」最初の例である。$K$ が代数体のとき、1 の冪根の仮定なしにアーベル拡大全体を $K$ のイデール類群で記述するのが類体論である（本サイト未収録）。

**高い視点.** クンマー対は、短完全列 $1\to\mu_{n}\to\bar K^{\times}\xrightarrow{n}\bar K^{\times}\to1$ のガロアコホモロジーの長完全列とヒルベルト 90 から得られる同型 $K^{\times}/K^{\times n}\cong H^{1}(G_{K},\mu_{n})=\Hom(G_{K},\mu_{n})$ の言い換えである（$G_{K}$ は絶対ガロア群。無限次ガロア理論 \tref{fld:page-infinite-galois} が要る）。$B\mapsto L_{B}$ の対応は、有限アーベル群の双対性 \ref{grp:finite-abelian-duality} の「部分群と零化群」の対応を、ガロアの基本定理と組み合わせたものである。

**計算の観点.** ノルム・トレースは最小多項式の係数（または掛け算の行列の行列式・トレース）から、$\Q$ 上では多項式時間で計算できる。ヒルベルト 90 の $y$ もデデキントの補題の証明どおり、$z$ を基底の元から順に試せば有限回で見つかる（$y_{z}$ は $z$ について $K$ 線形なので、基底のどれかで $0$ でない）。
:::

## 問題 {#fld:sec-nk-problems}

::: problem {#fld:prob-nk-norm-cubic}
$K=\Q$, $L=\Q(\sqrt[3]{2})$ で、$N_{L/\Q}(a+b\sqrt[3]{2}+c\sqrt[3]{4})$ を $a,b,c$ の式で求めよ。
:::

::: solution
掛け算 $m_{x}$（$x=a+b\theta+c\theta^{2}$, $\theta=\sqrt[3]{2}$）の基底 $1,\theta,\theta^{2}$ に関する行列は、$x\cdot1=a+b\theta+c\theta^{2}$、$x\theta=2c+a\theta+b\theta^{2}$、$x\theta^{2}=2b+2c\theta+a\theta^{2}$ から
$$
\begin{pmatrix}a&2c&2b\\b&a&2c\\c&b&a\end{pmatrix}
$$
で、その行列式は $a^{3}+2b^{3}+4c^{3}-6abc$。
:::

::: problem {#fld:prob-nk-kummer-degree}
$K=\Q(i)$ で、$X^{4}-a$（$a\in K^{\times}$）の分解体 $K(\sqrt[4]{a})$ の次数を、$a=2$, $a=4$, $a=-4$ について求めよ。
:::

::: solution
$i$ は 1 の原始 4 乗根なので \ref{fld:kummer-cyclic.1} が使え、次数は $a$ の $K^{\times}/K^{\times4}$ での位数。
- $a=2$：$2=-i(1+i)^{2}$ で、$1+i$ は $\Z[i]$ の素元。$2^{e}$ が $K^{\times}$ の 4 乗なら、$1+i$ での付値（$\Z[i]$ は UFD）を比べて $4\mid2e$、すなわち $e$ は偶数。$e=2$：$4=-(1+i)^{4}$ で $-1$ は $K$ の 4 乗でない（$i^{4}=1$、$x^{4}=-1$ の根は 1 の原始 8 乗根で $K$ に属さない）ので $4\notin K^{\times4}$。よって位数 $4$、次数 $4$。
- $a=4$：$4\notin K^{\times4}$（$4=-(1+i)^{4}$ なので、$4=x^{4}$ なら $-1=(x/(1+i))^{4}$ となり上と矛盾）で、$4^{2}=2^{4}\in K^{\times4}$ なので位数 $2$。次数 $2$（実際 $\sqrt[4]{4}=\sqrt{2}$ で $K(\sqrt2)$）。
- $a=-4$：$-4=(1+i)^{4}\in K^{\times4}$ なので次数 $1$（$X^{4}+4=(X^{2}+2X+2)(X^{2}-2X+2)$ で、根 $\pm1\pm i\in K$）。
:::
