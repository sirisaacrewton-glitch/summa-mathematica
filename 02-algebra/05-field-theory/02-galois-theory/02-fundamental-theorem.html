# ガロアの基本定理 {#fld:page-fundamental-theorem keywords="fundamental theorem of Galois theory, Galois correspondence between intermediate fields and subgroups, normal subgroups and Galois subextensions, translation theorem, compositum of Galois extensions"}

有限次ガロア拡大 $L/K$ について、中間体 $M$ に部分群 $\operatorname{Gal}(L/M)$ を、部分群 $H$ に固定体 $L^{H}$ を対応させると、互いに逆な包含を逆転する全単射になる（**ガロアの基本定理**、\tref{fld:fundamental-theorem}）。次数は指数に対応し（$[M:K]=(G:\operatorname{Gal}(L/M))$）、$M/K$ がガロアであることは $\operatorname{Gal}(L/M)$ が正規部分群であることに対応する。体の問題（中間体を求める）が有限群の問題（部分群を求める）に翻訳されるのが、この定理の力である。後半では、ガロア拡大を別の体の上に持ち上げたときのガロア群を求める**推進定理**（\tref{fld:translation-theorem}）を示す。

> 雪江明彦『代数学 2』第 4 章 §4.1・§4.6 を参考にした。

## 記法と定義の確認 {#fld:sec-ft-notation}

::: notation
- ガロア拡大・ガロア群・アルティンの定理・同値な定義は \ref{fld:galois-extension}, \tref{fld:artin-theorem}, \ref{fld:galois-equivalent}, \ref{fld:galois-intermediate}。
- 群の正規部分群・剰余群・準同型定理・共役は \ref{grp:page-normal-quotient}, \ref{grp:first-isomorphism}。
- $\Omega$ は代数的閉体で、以下の拡大はその中にとる。合成体は \ref{fld:compositum}。
- **選択公理**：推移定理で $\Omega$ を使うところで使う（有限次の場合は分解体で代用できる）。基本定理そのものには使わない。
:::

## 基本定理 {#fld:sec-ft-theorem}

::: theorem ガロアの基本定理 {#fld:fundamental-theorem keywords="Galois correspondence: intermediate fields <-> subgroups, inclusion reversing, degree = index, normal subgroups <-> Galois subextensions" index="ガロアの基本定理|がろあのきほんていり, ガロア対応|がろあたいおう" refname="ガロアの基本定理"}
$L/K$ を有限次ガロア拡大、$G=\operatorname{Gal}(L/K)$ とする。
1. 中間体 $M$ に $\operatorname{Gal}(L/M)$、部分群 $H$ に $L^{H}$ を対応させる写像は、中間体全体と $G$ の部分群全体の間の互いに逆な全単射で、包含関係を逆転する。
2. $[L:M]=\abs{\operatorname{Gal}(L/M)}$、$[M:K]=(G:\operatorname{Gal}(L/M))$。
3. $\sigma\in G$ について $\operatorname{Gal}(L/\sigma(M))=\sigma\operatorname{Gal}(L/M)\sigma^{-1}$。
4. $M/K$ がガロア拡大 $\iff$ $\operatorname{Gal}(L/M)$ は $G$ の正規部分群。このとき制限 $\sigma\mapsto\sigma|_{M}$ は同型 $G/\operatorname{Gal}(L/M)\cong\operatorname{Gal}(M/K)$ を与える。
:::

::: proof
**Step 1（$L^{\operatorname{Gal}(L/M)}=M$）.** $L/M$ はガロア（\ref{fld:galois-intermediate}）なので、\ref{fld:galois-equivalent.4} から。

**Step 2（$\operatorname{Gal}(L/L^{H})=H$）.** \ref{fld:artin-theorem}を $H$ に使う。

**Step 3（包含の逆転）.** $M_{1}\subset M_{2}$ なら $M_{2}$ を固定するものは $M_{1}$ も固定するので $\operatorname{Gal}(L/M_{2})\subset\operatorname{Gal}(L/M_{1})$。$H_{1}\subset H_{2}$ なら $L^{H_{2}}\subset L^{H_{1}}$。Step 1・2 と合わせて 1。

**Step 4（2）.** $L/M$ はガロアなので $[L:M]=\abs{\operatorname{Gal}(L/M)}$。塔の公式とラグランジュの定理から $[M:K]=[L:K]/[L:M]=\abs{G}/\abs{\operatorname{Gal}(L/M)}$。

**Step 5（3）.** $\tau\in\operatorname{Gal}(L/\sigma(M))\iff\tau(\sigma(m))=\sigma(m)$（$m\in M$）$\iff\sigma^{-1}\tau\sigma\in\operatorname{Gal}(L/M)$。

**Step 6（4：⇒）.** $M/K$ がガロアなら正規なので、$\sigma\in G$ について $\sigma|_{M}\colon M\to L\subset\Omega$ は $K$ 埋め込みで、像は $M$（\ref{fld:normal-equivalent.3}。$\Omega$ の代わりに $L$ を含む代数的閉体）。3 から $\sigma\operatorname{Gal}(L/M)\sigma^{-1}=\operatorname{Gal}(L/M)$。

**Step 7（4：⇐）.** $N=\operatorname{Gal}(L/M)$ が正規なら、3 と 1 から各 $\sigma\in G$ で $\sigma(M)=M$。制限 $r\colon G\to\operatorname{Aut}(M/K)$, $\sigma\mapsto\sigma|_{M}$ は準同型で、核は $N$。よって $\abs{\operatorname{Aut}(M/K)}\ge\abs{G/N}=[M:K]$（2）で、一般の不等式 $\le$ と合わせて $M/K$ はガロア、$r$ は全射で $G/N\cong\operatorname{Gal}(M/K)$（準同型定理）。Step 6 の場合も同じ $r$ で同型。
:::

::: hypcheck
- **前提「ガロア」**：Step 1 で $L^{\operatorname{Gal}(L/M)}=M$ を使った。外すと偽：$\Q(\sqrt[3]{2})/\Q$ では $\operatorname{Aut}$ は自明で、中間体 $\Q$ と $\Q(\sqrt[3]{2})$ が同じ部分群に対応する。
- **前提「有限次」**：アルティンの定理（有限群）に使った。無限次ではすべての部分群が固定体の群として現れるとは限らず、クルル位相の閉部分群に制限する必要がある（\ref{fld:page-infinite-galois}）。
- **選択公理**：使っていない（Step 6 の埋め込みは、$L$ を $\Omega$ の代わりに使える：$L$ は $K$ 上正規なので、$M$ の $K$ 埋め込みで $L$ に値をとるものを考えれば十分）。
:::

::: corollary 中間体の束 {#fld:galois-lattice keywords="compositum corresponds to intersection of subgroups, intersection of fields to the generated subgroup; finitely many intermediate fields" index="中間体の束|ちゅうかんたいのそく"}
$L/K$ を有限次ガロア拡大とする。中間体 $M_{1},M_{2}$ と $H_{i}=\operatorname{Gal}(L/M_{i})$ について、$\operatorname{Gal}(L/M_{1}M_{2})=H_{1}\cap H_{2}$、$\operatorname{Gal}(L/(M_{1}\cap M_{2}))=\langle H_{1},H_{2}\rangle$。中間体は有限個しかない。
:::

::: proof
$\sigma$ が $M_{1}M_{2}$ を固定 $\iff$ $M_{1}$ と $M_{2}$ を固定（合成体は両者で生成）$\iff\sigma\in H_{1}\cap H_{2}$。$L^{\langle H_{1},H_{2}\rangle}$ は $H_{1}$ と $H_{2}$ の両方で固定される元全体 $=M_{1}\cap M_{2}$ で、基本定理の 1 を使う。有限群の部分群は有限個。
:::

## 推進定理 {#fld:sec-ft-translation}

::: theorem 推進定理 {#fld:translation-theorem keywords="translation theorem (natural irrationalities): for L/K Galois and any F, LF/F is Galois with group Gal(L/L cap F); compositum of Galois extensions" index="推進定理|すいしんていり, 自然な無理数|しぜんなむりすう" refname="推進定理"}
$L/K$ を有限次ガロア拡大、$F/K$ を任意の拡大とし、$L,F\subset\Omega$ とする。
1. $LF/F$ はガロア拡大で、制限 $\sigma\mapsto\sigma|_{L}$ は同型 $\operatorname{Gal}(LF/F)\cong\operatorname{Gal}(L/L\cap F)$ を与える。特に $[LF:F]=[L:L\cap F]$。
2. $L_{1},L_{2}$ が $K$ 上有限次ガロアなら、$L_{1}L_{2}/K$ と $L_{1}\cap L_{2}/K$ はガロアで、$\operatorname{Gal}(L_{1}L_{2}/K)\to\operatorname{Gal}(L_{1}/K)\times\operatorname{Gal}(L_{2}/K)$, $\sigma\mapsto(\sigma|_{L_{1}},\sigma|_{L_{2}})$ は単射。$L_{1}\cap L_{2}=K$ なら同型。
:::

::: proof
**Step 1（$LF/F$ はガロア）.** $L$ は分離多項式 $f\in K[x]$ の分解体（\ref{fld:galois-equivalent.3}）で、$L=K(\text{根})$。$LF=F(\text{根})$ は $f\in F[x]$ の $F$ 上の分解体なので $LF/F$ はガロア。

**Step 2（制限）.** $\sigma\in\operatorname{Gal}(LF/F)$ は $K$ を固定し、$f$ の根を根に移すので $\sigma(L)=L$。制限 $r(\sigma)=\sigma|_{L}\in\operatorname{Gal}(L/K)$。$r(\sigma)=\id$ なら $\sigma$ は $L$ と $F$ を固定するので $LF$ 上で恒等。よって $r$ は単射。

**Step 3（像）.** 像 $H=r(\operatorname{Gal}(LF/F))$ の固定体 $L^{H}$ を求める。$a\in L\cap F$ は固定されるので $L\cap F\subset L^{H}$。逆に $a\in L^{H}$ なら、$a$ はすべての $\sigma\in\operatorname{Gal}(LF/F)$ で固定されるので $a\in(LF)^{\operatorname{Gal}(LF/F)}=F$（\ref{fld:galois-equivalent.4}）、$a\in L\cap F$。基本定理から $H=\operatorname{Gal}(L/L\cap F)$。

**Step 4（2）.** $L_{i}$ が分離多項式 $f_{i}$ の分解体なら、$L_{1}L_{2}$ は $f_{1}f_{2}$ の根で生成され、$f_{1}f_{2}$ の相異なる根だけをとった分離多項式の分解体なのでガロア。$L_{1}\cap L_{2}$ は：$\sigma\in\operatorname{Gal}(\Omega'/K)$（$\Omega'=L_{1}L_{2}$）について $\sigma(L_{i})=L_{i}$ なので $\sigma(L_{1}\cap L_{2})=L_{1}\cap L_{2}$、基本定理の 3・4 から $\operatorname{Gal}(L_{1}L_{2}/L_{1}\cap L_{2})$ は正規部分群でガロア。制限の積が単射なのは Step 2 と同様（$L_{1}$ と $L_{2}$ で恒等なら $L_{1}L_{2}$ で恒等）。$L_{1}\cap L_{2}=K$ なら 1（$L=L_{1}$, $F=L_{2}$）から $[L_{1}L_{2}:K]=[L_{1}L_{2}:L_{2}][L_{2}:K]=[L_{1}:K][L_{2}:K]$ で、位数が一致するので全単射。
:::

::: example $x^{3}-2$ のガロア対応
$L=\Q(\sqrt[3]{2},\omega)$, $G=\operatorname{Gal}(L/\Q)\cong S_{3}$（\ref{fld:page-artin} の例 3）。$\sigma$ を $\sqrt[3]{2}\mapsto\sqrt[3]{2}\omega$, $\omega\mapsto\omega$、$\tau$ を複素共役（$\sqrt[3]{2}\mapsto\sqrt[3]{2}$, $\omega\mapsto\omega^{2}$）とすると、$S_{3}$ の部分群
$$
1,\quad\langle\tau\rangle,\quad\langle\sigma\tau\rangle,\quad\langle\sigma^{2}\tau\rangle,\quad\langle\sigma\rangle,\quad G
$$
に対応する中間体は順に $L$、$\Q(\sqrt[3]{2})$、$\Q(\sqrt[3]{2}\omega^{2})$、$\Q(\sqrt[3]{2}\omega)$、$\Q(\omega)$、$\Q$。（$\sigma\tau(\sqrt[3]{2}\omega^{2})=\sigma(\sqrt[3]{2}\omega)=\sqrt[3]{2}\omega^{2}$ などを確かめる。各固定体は次数 $3$ または $2$ の体で、示した元を含み次数が一致する。）正規部分群は $1,\langle\sigma\rangle,G$ だけで、ガロアな中間体は $L,\Q(\omega),\Q$。
:::

## 問題 {#fld:sec-ft-problems}

::: problem {#fld:prob-ft-sqrt2-sqrt3}
$L=\Q(\sqrt{2},\sqrt{3})$ の $\Q$ 上の中間体をすべて求めよ。
:::

::: solution
$G\cong\Z/2\times\Z/2$（\ref{fld:prob-ar-klein}）の部分群は $1$、位数 2 の三つ、$G$。位数 2 の部分群 $\langle\sigma\rangle$ の固定体は次数 $2$ で、$\sigma$ を $(\sqrt{2},\sqrt{3})\mapsto(\sqrt{2},-\sqrt{3})$, $(-\sqrt{2},\sqrt{3})$, $(-\sqrt{2},-\sqrt{3})$ とするとそれぞれ $\Q(\sqrt{2})$, $\Q(\sqrt{3})$, $\Q(\sqrt{6})$ が固定される。よって中間体は $\Q$, $\Q(\sqrt{2})$, $\Q(\sqrt{3})$, $\Q(\sqrt{6})$, $L$ の 5 個。
:::

::: problem {#fld:prob-ft-translation}
$\Q(\sqrt[3]{2})$ と $\Q(\omega)$ の合成体の次数と、$\Q(\sqrt[3]{2})\cap\Q(\omega)$ を推進定理で求めよ。
:::

::: solution
$\Q(\omega)/\Q$ はガロア（2 次）。推進定理の 1（$L=\Q(\omega)$, $F=\Q(\sqrt[3]{2})$）から $[LF:F]=[L:L\cap F]$。$L\cap F$ は $\Q(\omega)$（次数 2）と $\Q(\sqrt[3]{2})$（次数 3）の共通の部分体なので次数は $1$、$L\cap F=\Q$。よって $[LF:F]=2$, $[LF:\Q]=6$。
:::

::: supplement
**高い視点.** 基本定理は、中間体の順序集合と部分群の順序集合の間の**ガロア接続**が、ガロア拡大では同型（反変）になることを言っている（\ref{fld:page-galois-connection}）。圏論的には、有限次ガロア拡大 $L/K$ の中間体の圏は、推移的な $G$ 集合 $G/H$ の圏と反変同値で、これをすべての有限次分離代数に広げたものが\ref{fld:page-grothendieck-galois}である。

**計算の観点.** $\Q$ 上の多項式のガロア群（置換群としての作用まで含めて）は、アルゴリズムで計算できることが知られている（本サイト未収録）。基本定理は、そのガロア群の部分群を調べることで中間体がすべて求まることを保証する。
:::
