# 非可換環の基本 {#mod:page-noncommutative-rings keywords="noncommutative ring, left ideal, right ideal, two-sided ideal, simple ring, matrix ring, quaternions, division ring, opposite ring, endomorphism ring, Wedderburn's little theorem"}

掛け算の順序を入れ替えられない環を**非可換環**という。行列環 $M_{n}(R)$、加群の自己準同型環 $\End_{R}(M)$、四元数体 $\mathbb{H}$、群環などがその代表で、線形代数・表現論・作用素環で自然に現れる。可換環との最初の違いはイデアルで、左から掛けて閉じるもの・右から掛けて閉じるもの・両方の三種類を区別する必要がある（\ref{mod:one-sided-ideal}）。このページでは、行列環の両側イデアルが係数環の両側イデアルと一対一に対応すること（\ref{mod:matrix-ideals}）を示して、斜体上の行列環が**単純環**であることを導き、四元数体を構成し、自己準同型環と反対環の関係（\ref{mod:endomorphism-opposite}）を確かめる。最後に、有限な可除環は可換であるという**ウェダーバーンの小定理**（\tref{mod:wedderburn-little}）を類等式と円分多項式で証明する。

> Anderson–Fuller *Rings and Categories of Modules* 第 1 章を参考にした。ウェダーバーンの小定理の証明は、類等式と円分多項式によるよく知られた議論（ヴィットによる）を、使う事実を一つずつ確かめながら書いた。

## 記法と定義の確認 {#mod:sec-nr-notation}

::: notation
- $R$ は単位元をもつ環で、可換とは限らない（\ref{ring:ring}）。単元・部分環・環準同型は \ref{ring:page-rings-ideals}、可除環（$1\neq 0$ で $0$ でない元がすべて単元）と斜体（可換でない可除環）は \ref{ring:domain-field-def} の後の注意のとおり。
- 加群は左加群（\ref{mod:module}）、$\Hom_{R}$, $\End_{R}(M)$ は \ref{mod:page-modules} のもの。写像は左に書き、合成 $\varphi\psi\defeq\varphi\circ\psi$ を $\End_{R}(M)$ の積とする。
- $M_{n}(R)$ は $R$ 成分の $n\times n$ 行列の環、$E_{ij}$ は $(i,j)$ 成分だけ $1$ で他は $0$ の**行列単位**。$E_{ij}E_{kl}=\delta_{jk}E_{il}$。
- 環 $R$ の**中心**を $Z(R)\defeq\{z\in R : \text{すべての }r\text{ で }zr=rz\}$ とする。部分環である。
- 類等式は \ref{grp:class-equation}。複素数と $1$ の $n$ 乗根 $e^{2\pi\sqrt{-1}k/n}$ は既知とする。
- **選択公理**：使わない。
:::

## 左イデアル・右イデアル・両側イデアル {#mod:sec-nr-ideals}

::: definition 左イデアル・右イデアル・両側イデアル {#mod:one-sided-ideal keywords="left ideal, right ideal, two-sided ideal, simple ring" index="左イデアル|ひだりいである, 右イデアル|みぎいである, 両側イデアル|りょうがわいである, 単純環|たんじゅんかん"}
環 $R$ の加法部分群 $I$ が、すべての $r\in R$, $a\in I$ について $ra\in I$ をみたすとき**左イデアル**、$ar\in I$ をみたすとき**右イデアル**、両方をみたすとき**両側イデアル**という。$R$ が可換ならこれらはすべてイデアル（\ref{ring:ideal}）と一致する。$R\neq 0$ で、両側イデアルが $0$ と $R$ だけのとき、$R$ を**単純環**という。
:::

::: proposition 両側イデアルと剰余環 {#mod:two-sided-quotient keywords="kernel of a ring homomorphism is a two-sided ideal; quotient ring by a two-sided ideal" index="剰余環（非可換）|じょうよかんひかかん"}
1. 環準同型 $f\colon R\to S$ の核は両側イデアル。
2. $I$ が両側イデアルなら、剰余群 $R/I$ に $(a+I)(b+I)\defeq ab+I$ で積が矛盾なく定まり、$R/I$ は環、$R\to R/I$ は核 $I$ の環準同型になる。
3. 左イデアル $L$ は左 $R$ 加群 $R$ の部分加群で、$R/L$ は左 $R$ 加群（環とは限らない）。
:::

::: proof
**Step 1（1）.** $f(a)=0$ なら $f(ra)=f(r)f(a)=0$, $f(ar)=f(a)f(r)=0$。

**Step 2（2）.** $a-a'\in I$, $b-b'\in I$ なら $ab-a'b'=(a-a')b+a'(b-b')$ で、$(a-a')b\in I$ は右イデアルであることから、$a'(b-b')\in I$ は左イデアルであることから従う。環の公理は代表元の計算に帰着する（\ref{ring:quotient-ring} の証明で可換性を使っていない部分と同じ）。

**Step 3（3）.** 左イデアルの定義は部分加群の定義そのもの。
:::

::: example 左イデアルだが両側イデアルでない
$R=M_{2}(\mathbb{Q})$ で、第 2 列が $0$ の行列全体 $L=\left\{\begin{pmatrix}a&0\\ c&0\end{pmatrix}\right\}$ は左イデアル（左から行列を掛けても第 2 列は $0$ のまま）。しかし $E_{11}\in L$ と $E_{12}$ について $E_{11}E_{12}=E_{12}\notin L$ なので右イデアルでない。
:::

## 行列環のイデアル {#mod:sec-nr-matrix}

::: theorem 行列環の両側イデアル {#mod:matrix-ideals keywords="two-sided ideals of M_n(R) are M_n(I) for two-sided ideals I of R" index="行列環の両側イデアル|ぎょうれつかんのりょうがわいである"}
$n\ge 1$ とする。$R$ の両側イデアル $I$ に $M_{n}(I)$（成分がすべて $I$ に入る行列全体）を対応させる写像は、$R$ の両側イデアル全体から $M_{n}(R)$ の両側イデアル全体への全単射である。
:::

::: proof
**Step 1（行列単位の計算）.** $A=(a_{jk})\in M_{n}(R)$ について $E_{ij}AE_{kl}=a_{jk}E_{il}$。実際、$E_{ij}A$ は $A$ の第 $j$ 行を第 $i$ 行に置いた行列で、それに $E_{kl}$ を右から掛けると、その第 $k$ 列を第 $l$ 列に置いた行列になる。

**Step 2（$M_{n}(I)$ は両側イデアル）.** 加法部分群であることは明らか。$B\in M_{n}(R)$, $A\in M_{n}(I)$ について $(BA)_{ik}=\sum_{j}b_{ij}a_{jk}\in I$（$I$ は左イデアル）、同様に $AB\in M_{n}(I)$（右イデアル）。

**Step 3（逆写像の候補）.** $M_{n}(R)$ の両側イデアル $J$ について、$I_{J}\defeq\{a\in R : aE_{11}\in J\}$ とおく。$I_{J}$ は加法部分群で、$a\in I_{J}$, $r\in R$ なら $(rE_{11})(aE_{11})=raE_{11}\in J$, $(aE_{11})(rE_{11})=arE_{11}\in J$ なので両側イデアル。

**Step 4（$J=M_{n}(I_{J})$）.** $A\in J$ なら Step 1 から $a_{jk}E_{11}=E_{1j}AE_{k1}\in J$、すなわち $a_{jk}\in I_{J}$。よって $J\subset M_{n}(I_{J})$。逆に $a\in I_{J}$ なら $aE_{il}=E_{i1}(aE_{11})E_{1l}\in J$ で、$M_{n}(I_{J})$ の元はこのような行列の和なので $J$ に入る。

**Step 5（$I_{M_{n}(I)}=I$）.** $aE_{11}\in M_{n}(I)\iff a\in I$。Step 4・5 から二つの対応は互いに逆。
:::

::: corollary 可除環上の行列環は単純 {#mod:matrix-simple keywords="M_n(D) is simple for a division ring D" index="行列環の単純性|ぎょうれつかんのたんじゅんせい"}
$D$ が可除環なら $M_{n}(D)$ は単純環である。
:::

::: proof
$D$ の両側イデアル $I\neq 0$ は単元 $a\neq 0$ を含み、$1=a^{-1}a\in I$ から $I=D$。よって $D$ の両側イデアルは $0$, $D$ だけで、\ref{mod:matrix-ideals} から $M_{n}(D)$ の両側イデアルは $0$, $M_{n}(D)$ だけ。$M_{n}(D)\neq 0$。
:::

::: remark
$n\ge 2$ なら $M_{n}(D)$ は可除環でない（$E_{11}E_{22}=0$ で零因子をもつ）。単純環は「両側イデアルの意味では体のようにふるまうが、左イデアルはたくさんある」環である（上の例）。
:::

## 四元数体 {#mod:sec-nr-quaternions}

::: proposition 四元数体 {#mod:quaternions keywords="Hamilton quaternions as a subring of M_2(C), a noncommutative division ring" index="四元数体|しげんすうたい, ハミルトンの四元数|はみるとんのしげんすう"}
$$
\mathbb{H}\defeq\left\{\begin{pmatrix}\alpha&\beta\\ -\bar\beta&\bar\alpha\end{pmatrix} : \alpha,\beta\in\mathbb{C}\right\}\subset M_{2}(\mathbb{C})
$$
は $M_{2}(\mathbb{C})$ の部分環で、斜体（可換でない可除環）である。$\boldsymbol{i}=\begin{pmatrix}\sqrt{-1}&0\\0&-\sqrt{-1}\end{pmatrix}$, $\boldsymbol{j}=\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, $\boldsymbol{k}=\boldsymbol{i}\boldsymbol{j}$ とおくと、$\mathbb{H}$ は実ベクトル空間として $1,\boldsymbol{i},\boldsymbol{j},\boldsymbol{k}$ を基底にもち、$\boldsymbol{i}^{2}=\boldsymbol{j}^{2}=\boldsymbol{k}^{2}=\boldsymbol{i}\boldsymbol{j}\boldsymbol{k}=-1$。
:::

::: proof
**Step 1（部分環）.** 和と $-$ で閉じ、単位行列は $\alpha=1,\beta=0$。積は
$$
\begin{pmatrix}\alpha&\beta\\ -\bar\beta&\bar\alpha\end{pmatrix}\begin{pmatrix}\gamma&\delta\\ -\bar\delta&\bar\gamma\end{pmatrix}=\begin{pmatrix}\alpha\gamma-\beta\bar\delta&\alpha\delta+\beta\bar\gamma\\ -\bar\beta\gamma-\bar\alpha\bar\delta&-\bar\beta\delta+\bar\alpha\bar\gamma\end{pmatrix}
$$
で、$(2,2)$ 成分は $(1,1)$ 成分 $\alpha\gamma-\beta\bar\delta$ の共役、$(2,1)$ 成分は $(1,2)$ 成分 $\alpha\delta+\beta\bar\gamma$ の共役の $-1$ 倍なので、同じ形。結合法則・分配法則は $M_{2}(\mathbb{C})$ から受け継ぐ。

**Step 2（可除環）.** $X=\begin{pmatrix}\alpha&\beta\\ -\bar\beta&\bar\alpha\end{pmatrix}\neq 0$ なら $N\defeq\det X=\abs{\alpha}^{2}+\abs{\beta}^{2}>0$ で、
$$
X^{-1}=\frac{1}{N}\begin{pmatrix}\bar\alpha&-\beta\\ \bar\beta&\alpha\end{pmatrix}
$$
は $\alpha'=\bar\alpha/N$, $\beta'=-\beta/N$ とした同じ形の行列（$-\bar{\beta'}=\bar\beta/N$, $\bar{\alpha'}=\alpha/N$）。$1\neq 0$ も明らか。

**Step 3（基底と関係式）.** $\alpha=a+b\sqrt{-1}$, $\beta=c+d\sqrt{-1}$（$a,b,c,d\in\mathbb{R}$）と書くと、行列は $a\cdot 1+b\boldsymbol{i}+c\boldsymbol{j}+d\boldsymbol{k}$ に等しい（$\boldsymbol{k}=\boldsymbol{i}\boldsymbol{j}=\begin{pmatrix}0&\sqrt{-1}\\ \sqrt{-1}&0\end{pmatrix}$ を代入して確かめられる）。$a,b,c,d$ は行列から一意に決まるので基底。$\boldsymbol{i}^{2}=\boldsymbol{j}^{2}=\boldsymbol{k}^{2}=-1$ は直接の計算、$\boldsymbol{i}\boldsymbol{j}\boldsymbol{k}=\boldsymbol{k}^{2}=-1$。

**Step 4（非可換）.** $\boldsymbol{j}\boldsymbol{i}=\begin{pmatrix}0&-\sqrt{-1}\\ -\sqrt{-1}&0\end{pmatrix}=-\boldsymbol{k}\neq\boldsymbol{k}=\boldsymbol{i}\boldsymbol{j}$。
:::

## 反対環と自己準同型環 {#mod:sec-nr-opposite}

::: definition 反対環 {#mod:opposite-ring keywords="opposite ring R^op" index="反対環|はんたいかん"}
環 $R$ の加法をそのままにし、積を $a*b\defeq ba$ と定めた環を**反対環** $R^{\mathrm{op}}$ という。右 $R$ 加群は左 $R^{\mathrm{op}}$ 加群と同じものである（$r\cdot m\defeq mr$）。
:::

::: theorem 自己準同型環と反対環 {#mod:endomorphism-opposite keywords="End_R(R) = R^op, End_R(M^n) = M_n(End_R(M))" index="自己準同型環|じこじゅんどうけいかん"}
1. 左 $R$ 加群 $R$ について、$\End_{R}(R)\to R^{\mathrm{op}}$, $\varphi\mapsto\varphi(1)$ は環同型。逆写像は $a\mapsto\rho_{a}$（$\rho_{a}(r)\defeq ra$、右からの $a$ 倍）。
2. 左 $R$ 加群 $M$ と $n\ge 1$ について、$\End_{R}(M^{n})\cong M_{n}(\End_{R}(M))$。特に $\End_{R}(R^{n})\cong M_{n}(R^{\mathrm{op}})$。
:::

::: proof
**Step 1（1：全単射）.** $\rho_{a}$ は左 $R$ 線形：$\rho_{a}(sr)=sra=s\rho_{a}(r)$。$\varphi\in\End_{R}(R)$ について $\varphi(r)=\varphi(r\cdot 1)=r\varphi(1)=\rho_{\varphi(1)}(r)$ なので $\varphi=\rho_{\varphi(1)}$。また $\rho_{a}(1)=a$。

**Step 2（1：積）.** $(\varphi\psi)(1)=\varphi(\psi(1))=\psi(1)\varphi(1)$（$\varphi(r)=r\varphi(1)$ を $r=\psi(1)$ で使った）$=\varphi(1)*\psi(1)$。和と $1\mapsto 1$ は明らか。

**Step 3（2）.** $\iota_{j}\colon M\to M^{n}$ を第 $j$ 成分への埋め込み、$\pi_{i}\colon M^{n}\to M$ を第 $i$ 射影とし、$\varphi\in\End(M^{n})$ に行列 $(\varphi_{ij})$, $\varphi_{ij}\defeq\pi_{i}\varphi\iota_{j}\in\End(M)$ を対応させる。$\sum_{j}\iota_{j}\pi_{j}=1$ なので $\varphi=\sum_{i,j}\iota_{i}\varphi_{ij}\pi_{j}$ と復元でき、全単射。積は $(\varphi\psi)_{ik}=\pi_{i}\varphi\Bigl(\sum_{j}\iota_{j}\pi_{j}\Bigr)\psi\iota_{k}=\sum_{j}\varphi_{ij}\psi_{jk}$ で行列の積。$M=R$ では 1 から $\End(R)\cong R^{\mathrm{op}}$。
:::

::: remark
1 の「$\mathrm{op}$」は、写像を左に書いて合成する約束と、$R$ の元を右から掛けて自己準同型を作ることのずれから来る。可換環では $R^{\mathrm{op}}=R$ で、$\End_{A}(A^{n})\cong M_{n}(A)$ という線形代数でおなじみの形になる。
:::

## ウェダーバーンの小定理 {#mod:sec-nr-wedderburn}

::: lemma 円分多項式 {#mod:cyclotomic-integer keywords="cyclotomic polynomial has integer coefficients; x^n - 1 = product of Phi_d over d | n" index="円分多項式|えんぶんたこうしき"}
$n\ge 1$ について $\Phi_{n}(x)\defeq\prod(x-\zeta)$（$\zeta$ は位数がちょうど $n$ の $1$ の複素 $n$ 乗根全体を走る）とおくと、
1. $x^{n}-1=\prod_{d\mid n}\Phi_{d}(x)$。
2. $\Phi_{n}(x)\in\Z[x]$ でモニック。
3. $d\mid n$, $d<n$ なら、$\Phi_{n}(x)$ は $\Z[x]$ で $(x^{n}-1)/(x^{d}-1)$ を割り切る。
:::

::: proof
**Step 1（1）.** $x^{n}-1$ の根は $1$ の $n$ 乗根 $e^{2\pi\sqrt{-1}k/n}$（$0\le k<n$）で相異なる $n$ 個なので、$x^{n}-1=\prod_{k}(x-e^{2\pi\sqrt{-1}k/n})$。各根の位数（$\zeta^{d}=1$ となる最小の $d\ge 1$）は $n$ の約数で、位数 $d$ の根を集めると $\Phi_{d}$。

**Step 2（2）.** $n$ についての帰納法。$g\defeq\prod_{d\mid n,d<n}\Phi_{d}$ は帰納法の仮定から $\Z[x]$ のモニック多項式。$x^{n}-1$ を $g$ で $\Z[x]$ の中で割る（モニックで割る割り算は整数係数のまま実行できる）と $x^{n}-1=gq+r$, $\deg r<\deg g$。$\mathbb{C}[x]$ では 1 から $x^{n}-1=g\Phi_{n}$ なので、割り算の一意性から $r=0$、$\Phi_{n}=q\in\Z[x]$。モニックは定義から。

**Step 3（3）.** $x^{d}-1=\prod_{e\mid d}\Phi_{e}$ で、$e\mid d$ なら $e\mid n$ かつ $e\le d<n$。よって $(x^{n}-1)/(x^{d}-1)=\Phi_{n}\cdot\prod_{e\mid n,\ e\nmid d,\ e<n}\Phi_{e}$ で、右辺の積は 2 から $\Z[x]$ の元。
:::

::: theorem ウェダーバーンの小定理 {#mod:wedderburn-little keywords="Wedderburn's little theorem: every finite division ring is commutative" index="ウェダーバーンの小定理|うぇだーばーんのしょうていり" refname="ウェダーバーンの小定理"}
有限な可除環は可換である（したがって有限体）。
:::

::: proof
$D$ を有限な可除環、$Z\defeq Z(D)$ とする。

**Step 1（中心は体）.** $Z$ は部分環で可換。$z\in Z$, $z\neq 0$ なら $zr=rz$ の両辺に左右から $z^{-1}$ を掛けて $rz^{-1}=z^{-1}r$ なので $z^{-1}\in Z$。よって $Z$ は体で、$q\defeq\abs{Z}\ge 2$。

**Step 2（位数は $q$ の冪）.** $Z$ を含む部分環 $S\subset D$ は、$Z$ の元を左から掛けることで $Z$ 上のベクトル空間。$S$ は有限なので、$S$ を張る極小な有限集合 $v_{1},\dots,v_{m}$ をとると一次独立（$\sum c_{i}v_{i}=0$, $c_{j}\neq 0$ なら $v_{j}$ は残りで張られ、極小性に反する）で、$S\cong Z^{m}$、$\abs{S}=q^{m}$。$S=D$ として $\abs{D}=q^{n}$ とおく。

**Step 3（中心化環）.** $x\in D$ について $C(x)\defeq\{y\in D : xy=yx\}$ は $Z$ を含む部分環で、Step 2 から $\abs{C(x)}=q^{d(x)}$。$y\in C(x)$, $y\neq 0$ なら $y^{-1}\in C(x)$（Step 1 と同様）なので、$C(x)\setminus\{0\}$ は乗法群 $D^{\times}=D\setminus\{0\}$ における $x$ の中心化群 $Z_{D^{\times}}(x)$ に等しく（$x\neq 0$ のとき）、位数 $q^{d(x)}-1$。同様に $Z(D^{\times})=Z\setminus\{0\}$（$D^{\times}$ のすべての元と可換なら $0$ とも可換で、$D$ のすべての元と可換）、位数 $q-1$。

**Step 4（$d(x)\mid n$）.** ラグランジュの定理から $q^{d}-1\mid q^{n}-1$（$d=d(x)$）。$n=sd+r$（$0\le r<d$）と書くと $q^{n}-1=q^{r}(q^{sd}-1)+(q^{r}-1)$ で、$q^{d}-1\mid q^{sd}-1$ なので $q^{d}-1\mid q^{r}-1$。$0\le q^{r}-1<q^{d}-1$ から $q^{r}-1=0$、$r=0$。

**Step 5（類等式）.** 群 $D^{\times}$ の類等式（\ref{grp:class-equation}）から
$$
q^{n}-1=(q-1)+\sum_{i=1}^{m}\frac{q^{n}-1}{q^{d_{i}}-1}
$$
で、各 $d_{i}=d(x_{i})$ は $n$ の約数で $d_{i}<n$（$x_{i}\notin Z$ なので $C(x_{i})\neq D$）。

**Step 6（矛盾）.** $n\ge 2$ と仮定する。\ref{mod:cyclotomic-integer.1}・\ref[3]{mod:cyclotomic-integer.3} から、整数 $\Phi_{n}(q)$ は $q^{n}-1$ と各 $(q^{n}-1)/(q^{d_{i}}-1)$ を割り切るので、Step 5 から $q-1$ を割り切る。一方、位数 $n\ge 2$ の $1$ の根 $\zeta$ は $\zeta\neq 1$, $\abs{\zeta}=1$ なので $\operatorname{Re}\zeta<1$ で、
$$
\abs{q-\zeta}^{2}=q^{2}-2q\operatorname{Re}\zeta+1>q^{2}-2q+1=(q-1)^{2}.
$$
よって $\abs{\Phi_{n}(q)}=\prod\abs{q-\zeta}>(q-1)^{\varphi(n)}\ge q-1\ge 1$（$\varphi(n)\ge 1$ は $\Phi_{n}$ の次数、$q-1\ge 1$）。$q-1\ge 1$ の約数の絶対値は $q-1$ 以下なので矛盾。よって $n=1$、$D=Z$ は可換。
:::

::: hypcheck
- **前提「有限」**：Step 2 の位数の計算と類等式に使った。外すと偽：四元数体 $\mathbb{H}$（\ref{mod:quaternions}）は無限の斜体。
- **前提「可除環」**：Step 1・3 で逆元が中心・中心化環に入ること、Step 3 で $D\setminus\{0\}$ が群であることに使った。外すと偽：$M_{2}(\mathbb{F}_{2})$ は有限で非可換（零因子をもつ）。
- **Step 6 の不等式**：$q\ge 2$ を使った。各因子 $\abs{q-\zeta}>q-1\ge 1$ なので、積は $q-1$ より真に大きい。
- **選択公理**：使っていない。
:::

## 問題 {#mod:sec-nr-problems}

::: problem {#mod:prob-nr-center-matrix}
可換環 $A$ について、$M_{n}(A)$ の中心はスカラー行列 $aI$（$a\in A$）全体であることを示せ。
:::

::: solution
スカラー行列が中心に入るのは明らか。$X=(x_{jk})$ が中心に入るとすると、\ref{mod:matrix-ideals} の Step 1 から $E_{ii}XE_{kk}=x_{ik}E_{ik}$。$X$ が $E_{ii}$ と可換なので $E_{ii}XE_{kk}=XE_{ii}E_{kk}=\delta_{ik}XE_{ii}$。$i\neq k$ なら $x_{ik}E_{ik}=0$、$x_{ik}=0$。また $E_{ij}X=XE_{ij}$ の $(i,j)$ 成分を比べると $x_{jj}=x_{ii}$。よって $X=x_{11}I$。
:::

::: problem {#mod:prob-nr-left-ideals-matrix}
体 $k$ と $n\ge 2$ について、$M_{n}(k)$ の左イデアル $L_{j}\defeq\{X : \text{第 }j\text{ 列以外が }0\}$ は極小な（$0$ でない左イデアルで、$0$ でない左イデアルを真に含まない）ことを示せ。
:::

::: solution
$0\neq X\in L_{j}$ とし、その第 $j$ 列を $v\neq 0$ とする。任意の $w\in k^{n}$ について $Bv=w$ となる $B\in M_{n}(k)$ がある（$v$ を基底に延ばして線形写像を定めればよい）。$BX$ は第 $j$ 列が $w$ で他は $0$。よって $X$ を含む左イデアルは $L_{j}$ 全体を含む。
:::

::: supplement
**次のページへ.** 極小左イデアルは単純な左加群である。$M_{n}(D)$ は $n$ 個の極小左イデアル $L_{1},\dots,L_{n}$ の直和で、これが「半単純環」の典型例になる（\ref{mod:page-wedderburn-artin}）。

**高い視点.** 反対環は、圏論的には「一つの対象をもつ前加法圏」としての環 $R$ の双対圏 $R^{\mathrm{op}}$ である。\ref{mod:endomorphism-opposite} は米田の補題の最も簡単な場合とみなせる：表現可能関手 $\Hom_{R}(R,-)$ の自己自然変換は $R$ の元の右からの掛け算で与えられ、合成の向きが逆になる。

**ウェダーバーンの小定理の周辺.** ジェイコブソンの可換性定理「すべての元 $x$ がある $n(x)\ge 2$ で $x^{n(x)}=x$ をみたす環は可換」はこの定理の一般化で、\ref{mod:jacobson-commutativity} で稠密性定理を使って証明する。
:::
