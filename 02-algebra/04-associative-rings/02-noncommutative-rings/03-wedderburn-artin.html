# ウェダーバーン＝アルティンの定理 {#mod:page-wedderburn-artin keywords="Wedderburn-Artin theorem, semisimple ring is a finite product of matrix rings over division rings, uniqueness, simple artinian ring, semisimple algebras over algebraically closed fields"}

半単純環（左加群として半単純な環。\ref{mod:semisimple-equivalent}）は、可除環上の行列環の有限個の直積
$$
R\cong M_{n_{1}}(D_{1})\times\cdots\times M_{n_{r}}(D_{r})
$$
と同型で、$r$ と組 $(n_{i},D_{i})$ は順序と同型を除いて一意に決まる。これが**ウェダーバーン＝アルティンの定理**（\tref{mod:wedderburn-artin}）である。証明の要は、$R\cong\End_{R}(R)^{\mathrm{op}}$（\ref{mod:endomorphism-opposite}）を、$R$ を単純加群の直和に分けて計算することにある。系として、単純なアルティン環は可除環上の行列環であり（\ref{mod:simple-artinian}）、代数閉体上の有限次元半単純代数は $\prod M_{n_{i}}(k)$ で、$\dim R=\sum n_{i}^{2}$ となる（\ref{mod:semisimple-algebra-closed}）。

> Anderson–Fuller *Rings and Categories of Modules* 第 4 章（§13）を参考にした。証明は前ページの重複度の一意性（\ref{mod:semisimple-multiplicity}）と自己準同型環の計算で組み立てた。

## 記法と定義の確認 {#mod:sec-wa-notation}

::: notation
- $R$ は環、加群は左 $R$ 加群。単純加群・シューアの補題・半単純加群と半単純環・重複度は \ref{mod:simple-module}, \tref{mod:schur-lemma}, \ref{mod:semisimple-equivalent}, \ref{mod:semisimple-multiplicity}、反対環と $\End_{R}(R)\cong R^{\mathrm{op}}$, $\End(M^{n})\cong M_{n}(\End M)$ は \ref{mod:opposite-ring}, \ref{mod:endomorphism-opposite}、行列環のイデアルと行列単位 $E_{ij}$ は \ref{mod:matrix-ideals}。
- 環の直積 $R_{1}\times\cdots\times R_{r}$ は成分ごとの演算をもつ環。$e_{i}$ を第 $i$ 成分が $1$ で他が $0$ の元とすると、$e_{i}$ は中心にあり $e_{i}e_{j}=\delta_{ij}e_{i}$, $\sum e_{i}=1$。$R_{i}$ 加群は射影 $R\to R_{i}$ を通して $R$ 加群とみなす。
- 可除環 $D$ について、$D^{n}$ は列ベクトルの空間で、$M_{n}(D)$ が左から行列の積で作用する左 $M_{n}(D)$ 加群。$e_{1},\dots,e_{n}$ は標準基底。
- 環 $R$ が**左アルティン環**であるとは、左イデアルの降鎖が必ず有限で止まることをいう。
- **選択公理**：半単純環の定義と特徴付け（\ref{mod:semisimple-equivalent}）を通して使う。単純アルティン環の系では、極小左イデアルの存在に従属選択公理を使う。
:::

## 準備：列ベクトル加群 {#mod:sec-wa-column}

::: lemma 列ベクトル加群 {#mod:column-module keywords="D^n is a simple M_n(D)-module, M_n(D) is a direct sum of n copies, End is D^op" index="列ベクトル加群|れつべくとるかぐん"}
$D$ を可除環、$n\ge 1$、$A=M_{n}(D)$、$V=D^{n}$ とする。
1. $V$ は単純左 $A$ 加群。
2. 左 $A$ 加群として $A\cong V^{n}$（第 $j$ 列への分解）。特に $A$ は半単純環。
3. $\End_{A}(V)\cong D^{\mathrm{op}}$（$d\in D$ に右からの $d$ 倍 $v\mapsto vd$ を対応させる）。
:::

::: proof
**Step 1（1）.** $0\neq v\in V$, $w\in V$ とする。$v_{i}\neq 0$ となる $i$ をとり、第 $i$ 列が $wv_{i}^{-1}$ で他の列が $0$ の行列を $B$ とすると、$Bv=wv_{i}^{-1}v_{i}=w$。よって $Av=V$ で、\ref{mod:simple-characterization.1} から $V$ は単純。

**Step 2（2）.** $L_{j}\defeq\{X\in A : \text{第 }j\text{ 列以外が }0\}$ は左イデアルで、$X\mapsto Xe_{j}$（第 $j$ 列）は左 $A$ 加群の同型 $L_{j}\cong V$（$(BX)e_{j}=B(Xe_{j})$）。$A=L_{1}\oplus\dots\oplus L_{n}$（列ごとの分解）。

**Step 3（3：形）.** $\rho_{d}(v)\defeq vd$ は左 $A$ 線形（行列の積の結合法則 $(Bv)d=B(vd)$）。逆に $\varphi\in\End_{A}(V)$ について、$\varphi(e_{1})=\varphi(E_{11}e_{1})=E_{11}\varphi(e_{1})$ なので $\varphi(e_{1})$ は第 1 成分以外が $0$：$\varphi(e_{1})=e_{1}d$ となる $d\in D$ がある。$v\in V$ について、第 1 列が $v$ で他が $0$ の行列 $B_{v}$ は $B_{v}e_{1}=v$ をみたすので、$\varphi(v)=\varphi(B_{v}e_{1})=B_{v}\varphi(e_{1})=B_{v}e_{1}d=vd$。よって $\varphi=\rho_{d}$。

**Step 4（3：環同型）.** $d\mapsto\rho_{d}$ は単射（$\rho_{d}(e_{1})=e_{1}d$）で、Step 3 から全射。$\rho_{d}\rho_{d'}(v)=vd'd=\rho_{d'd}(v)$ なので、$D^{\mathrm{op}}$ の積 $d*d'=d'd$ と合う。
:::

::: lemma 行列環の反対環 {#mod:matrix-opposite keywords="M_n(E)^op = M_n(E^op) via transpose" index="行列環の反対環|ぎょうれつかんのはんたいかん"}
環 $E$ について、転置 $X\mapsto X^{T}$ は環同型 $M_{n}(E)^{\mathrm{op}}\to M_{n}(E^{\mathrm{op}})$ である。
:::

::: proof
加法と単位元は明らか。$M_{n}(E)^{\mathrm{op}}$ での積 $X*Y=YX$ について $(YX)^{T}_{ik}=(YX)_{ki}=\sum_{j}y_{kj}x_{ji}$。$M_{n}(E^{\mathrm{op}})$ での積は $(X^{T}Y^{T})_{ik}=\sum_{j}(X^{T})_{ij}*(Y^{T})_{jk}=\sum_{j}x_{ji}*y_{kj}=\sum_{j}y_{kj}x_{ji}$。一致する。
:::

## 定理 {#mod:sec-wa-theorem}

::: theorem ウェダーバーン＝アルティンの定理 {#mod:wedderburn-artin keywords="Wedderburn-Artin: semisimple rings are finite products of matrix rings over division rings, uniquely" index="ウェダーバーン＝アルティンの定理|うぇだーばーんあるてぃんのていり" refname="ウェダーバーン＝アルティンの定理"}
（AC）
1. （存在）半単純環 $R$ について、可除環 $D_{1},\dots,D_{r}$ と $n_{1},\dots,n_{r}\ge 1$ があって $R\cong M_{n_{1}}(D_{1})\times\cdots\times M_{n_{r}}(D_{r})$。
2. （逆）この形の環は半単純環である。
3. （一意性）$\prod_{i=1}^{r}M_{n_{i}}(D_{i})\cong\prod_{j=1}^{s}M_{m_{j}}(D'_{j})$ なら、$r=s$ で、番号を付け替えると $n_{i}=m_{i}$, $D_{i}\cong D'_{i}$。
:::

::: proof
**Step 1（有限個の単純左イデアルへの分解）.** $R=\bigoplus_{\lambda\in\Lambda}L_{\lambda}$（$L_{\lambda}$ は単純左イデアル）と書き、$1=\sum_{\lambda\in F}u_{\lambda}$（$F$ は有限、$u_{\lambda}\in L_{\lambda}$）とする。$r\in R$ について $r=r\cdot 1=\sum_{\lambda\in F}ru_{\lambda}$ で $ru_{\lambda}\in L_{\lambda}$ なので、直和の一意性から $\lambda\notin F$ の成分は $0$。$L_{\lambda}\neq 0$ なので $\Lambda=F$ は有限。

**Step 2（同型類でまとめる）.** $L_{\lambda}$ の同型類を $T_{1},\dots,T_{r}$（互いに非同型）とし、$T_{i}$ と同型なものの個数を $n_{i}$ とすると、左 $R$ 加群として $R\cong T_{1}^{n_{1}}\oplus\cdots\oplus T_{r}^{n_{r}}$。

**Step 3（自己準同型環）.** $M_{i}\defeq T_{i}^{n_{i}}$ とする。$i\neq j$ なら、\ref{mod:hom-sum-product} から $\Hom(M_{i},M_{j})$ は $\Hom(T_{i},T_{j})$ の直和で、シューアの補題から $0$。よって $\varphi\in\End(\bigoplus M_{i})$ について $\pi_{j}\varphi\iota_{i}=0$（$i\neq j$）で、$\varphi$ は各 $M_{i}$ をそれ自身に写す。$\varphi\mapsto(\varphi|_{M_{i}})_{i}$ は環同型 $\End(\bigoplus M_{i})\cong\prod_{i}\End(M_{i})$。\ref{mod:endomorphism-opposite.2} から $\End(M_{i})\cong M_{n_{i}}(E_{i})$, $E_{i}\defeq\End_{R}(T_{i})$ は可除環（シューアの補題）。

**Step 4（存在の結論）.** \ref{mod:endomorphism-opposite.1} から $R^{\mathrm{op}}\cong\End_{R}(R)\cong\prod_{i}M_{n_{i}}(E_{i})$。反対環をとり（直積の反対環は反対環の直積）、\ref{mod:matrix-opposite} から $R\cong\prod_{i}M_{n_{i}}(E_{i})^{\mathrm{op}}\cong\prod_{i}M_{n_{i}}(E_{i}^{\mathrm{op}})$。$D_{i}\defeq E_{i}^{\mathrm{op}}$ は可除環。

**Step 5（2）.** $R=\prod R_{i}$, $R_{i}=M_{n_{i}}(D_{i})$ とする。左 $R$ 加群として $R=\bigoplus_{i}R_{i}$（$R_{i}$ は $e_{i}R$ と同一視）で、$R_{i}$ の左 $R$ 部分加群は左 $R_{i}$ 部分加群と同じ（$R$ は $R_{i}$ に射影を通して作用）。\ref{mod:column-module.2} から各 $R_{i}$ は単純 $R_{i}$ 加群（すなわち単純 $R$ 加群）の直和で、$R$ も単純加群の直和。

**Step 6（3：単純加群の分類）.** $R=\prod R_{i}$ について $V_{i}\defeq D_{i}^{n_{i}}$（左 $R$ 加群）とする。（a）Step 5 と \ref{mod:column-module.2} から $R\cong\bigoplus_{i}V_{i}^{n_{i}}$。（b）単純 $R$ 加群 $S$ は $R/L$ と同型（\ref{mod:simple-characterization}）なので $0$ でない準同型 $R\to S$ があり、その $V_{i}$ のどれかへの制限が $0$ でなく、シューアの補題から $S\cong V_{i}$。（c）$i\neq j$ なら $V_{i}\not\cong V_{j}$：$e_{i}$ は $V_{i}$ に恒等写像、$V_{j}$ に $0$ で作用する。

**Step 7（3：不変量）.** （b）（c）から $r$ は単純 $R$ 加群の同型類の個数、$n_{i}$ は $R$ における $V_{i}$ の重複度（\ref{mod:semisimple-multiplicity} から分解によらない）、$D_{i}\cong\End_{R}(V_{i})^{\mathrm{op}}$（\ref{mod:column-module.3}。$\End_{R}(V_{i})=\End_{R_{i}}(V_{i})$）。これらは環の同型で保たれる量なので、二つの直積分解の $r$, $\{(n_{i},D_{i})\}$ は、単純加群の同型類の対応で番号を付け替えれば一致する。
:::

::: hypcheck
- **Step 1 の有限性**：$1$ を有限和で書けることだけを使った。半単純「加群」は無限個の単純加群の直和でありうるが、半単純「環」は有限個。
- **選択公理**：半単純の定義から直和分解を取るところ（\ref{mod:semisimple-equivalent}）で使う。$R$ が単純左イデアルの直和として与えられていれば Step 2 以降は使わない（重複度の一意性も選択公理なし）。
- **左右**：結論の形 $\prod M_{n_{i}}(D_{i})$ は左右対称（\ref{mod:matrix-opposite}）なので、左半単純環と右半単純環は同じものである（系の 1）。
:::

## 系 {#mod:sec-wa-corollaries}

::: corollary 半単純環の性質 {#mod:semisimple-ring-corollaries keywords="left semisimple iff right semisimple; commutative semisimple rings are finite products of fields; semisimple rings are left artinian" index="半単純環の性質|はんたんじゅんかんのせいしつ"}
（AC）
1. $R$ が左半単純 $\iff$ $R^{\mathrm{op}}$ が左半単純（$\iff R$ が右半単純）。
2. 可換な半単純環は有限個の体の直積である。
3. 半単純環は左アルティン環である。
:::

::: proof
**Step 1（1）.** \ref{mod:wedderburn-artin.1} と \ref{mod:matrix-opposite} から $R^{\mathrm{op}}\cong\prod M_{n_{i}}(D_{i}^{\mathrm{op}})$ で、2 からこれは左半単純。右 $R$ 加群は左 $R^{\mathrm{op}}$ 加群（\ref{mod:opposite-ring}）。

**Step 2（2）.** 直積が可換なら各 $M_{n_{i}}(D_{i})$ が可換で、$n_{i}\ge 2$ なら $E_{12}E_{21}\neq E_{21}E_{12}$ なので $n_{i}=1$、$D_{i}$ は可換な可除環すなわち体。

**Step 3（3：部分加群の長さ）.** $R=L_{1}\oplus\cdots\oplus L_{m}$（単純左イデアル。定理の証明の Step 1）とする。左イデアル $N$ について、\ref{mod:semisimple-complement} から $R=N\oplus\bigoplus_{j\in J}L_{j}$（$J\subset\{1,\dots,m\}$）となり、$N\cong R/\bigoplus_{j\in J}L_{j}\cong\bigoplus_{i\notin J}L_{i}$。よって $N$ は有限個の単純加群の直和で、その個数 $\ell(N)$ は \ref{mod:semisimple-multiplicity} から分解によらず、$\ell(N)\le m$。

**Step 4（3：降鎖）.** $N\subsetneq N_{2}$ なら、$N_{2}$ も半単純（\ref{mod:semisimple-closure}）で $N_{2}=N\oplus C$, $C\neq 0$。$N$ と $C$ の単純加群への分解をつなぐと $N_{2}$ の分解になるので $\ell(N_{2})=\ell(N)+\ell(C)>\ell(N)$。よって左イデアルの真の降鎖の長さは $m$ 以下で、降鎖は有限で止まる。
:::

::: corollary 単純アルティン環 {#mod:simple-artinian keywords="a simple left artinian ring is a matrix ring over a division ring (Wedderburn)" index="単純アルティン環|たんじゅんあるてぃんかん"}
（AC）単純な左アルティン環は、ある可除環 $D$ と $n\ge 1$ について $M_{n}(D)$ と同型である。
:::

::: proof
**Step 1（極小左イデアル）.** $R\neq 0$ の $0$ でない左イデアル全体は空でなく、降鎖条件から極小元 $L$ をもつ（極小元がなければ真の降鎖を無限に作れる。従属選択公理）。$L$ は単純左加群。

**Step 2（$R$ は $L$ の右移動の和）.** $I\defeq\sum_{r\in R}Lr$ は左イデアルで、右から $R$ を掛けても閉じるので両側イデアル。$L\subset I$ なので $I\neq 0$、$R$ が単純なので $I=R$。

**Step 3（半単純）.** $x\mapsto xr$ は左 $R$ 加群の準同型 $L\to Lr$ で全射なので、シューアの補題の Step 1 と同様に $Lr$ は $0$ か $L$ と同型。よって $R$ は $L$ と同型な単純左イデアルの和で、半単純環。

**Step 4（結論）.** \ref{mod:wedderburn-artin} の Step 2 で単純加群の同型類は $L$ の一つだけなので $r=1$、$R\cong M_{n}(D)$。
:::

::: corollary 代数閉体上の半単純代数 {#mod:semisimple-algebra-closed keywords="a finite-dimensional semisimple algebra over an algebraically closed field is a product of matrix algebras over k; dim = sum of squares" index="半単純代数（代数閉体）|はんたんじゅんだいすうだいすうへいたい"}
（AC）$k$ を代数閉体、$R$ を $k$ 上有限次元の半単純 $k$ 代数（$k\subset Z(R)$）とすると、$R\cong M_{n_{1}}(k)\times\cdots\times M_{n_{r}}(k)$ で、$\dim_{k}R=n_{1}^{2}+\cdots+n_{r}^{2}$。$r$ は単純 $R$ 加群の同型類の個数、$n_{i}$ はそれらの $k$ 上の次元である。
:::

::: proof
**Step 1.** 定理の証明の $T_{i}$ は $R$ の左イデアルなので $k$ 上有限次元で、\ref{mod:schur-algebraically-closed} から $E_{i}=\End_{R}(T_{i})=k\cdot\id$。よって $D_{i}=E_{i}^{\mathrm{op}}\cong k$ で、$R\cong\prod M_{n_{i}}(k)$。

**Step 2.** $\dim_{k}M_{n}(k)=n^{2}$ から次元の式。Step 6 の分類から単純加群は $V_{i}=k^{n_{i}}$ で、$\dim_{k}V_{i}=n_{i}$。
:::

## 問題 {#mod:sec-wa-problems}

::: problem {#mod:prob-wa-c-algebra}
$\mathbb{R}$ 代数 $R=\mathbb{C}\times M_{2}(\mathbb{R})$ の単純加群の同型類をすべて求め、それぞれの自己準同型環を答えよ。
:::

::: solution
定理の Step 6 から、単純加群は $V_{1}=\mathbb{C}$（$\mathbb{C}$ 成分が作用）と $V_{2}=\mathbb{R}^{2}$（$M_{2}(\mathbb{R})$ 成分が作用）の二つ。\ref{mod:column-module.3} から $\End(V_{1})\cong\mathbb{C}^{\mathrm{op}}=\mathbb{C}$, $\End(V_{2})\cong\mathbb{R}$。代数閉体でない体上では自己準同型環が係数体より大きくなりうる（$V_{1}$）。
:::

::: problem {#mod:prob-wa-dimension-count}
$\mathbb{C}$ 上 $6$ 次元の半単純代数を、同型を除いてすべて挙げよ。
:::

::: solution
\ref{mod:semisimple-algebra-closed} から、$n_{1}^{2}+\cdots+n_{r}^{2}=6$（$n_{i}\ge 1$、順序を除く）の解を求めればよい。平方数は $1,4$ なので、$1+1+1+1+1+1$ と $4+1+1$。よって $\mathbb{C}^{6}$ と $M_{2}(\mathbb{C})\times\mathbb{C}\times\mathbb{C}$ の二つ（一意性の部分から互いに非同型）。
:::

::: supplement
**群環への応用.** 有限群 $G$ の位数が体 $k$ の標数で割り切れなければ、群環 $k[G]$ は半単純（マシュケの定理）で、$k=\mathbb{C}$ なら $\abs{G}=\sum n_{i}^{2}$（$n_{i}$ は既約表現の次元）となる（\ref{mod:page-maschke}）。

**高い視点.** 定理は「半単純環の加群の圏は、可除環上のベクトル空間の圏の有限個の直積と同値」と言い換えられる（森田同値：$M_{n}(D)$ と $D$ の加群の圏は同値）。ベクトル空間の圏では対象は次元だけで決まるので、半単純環の加群は「各単純加群の重複度」という自然数の組で完全に分類される。ウェダーバーン＝アルティンの定理は、その環がどれだけの「独立な行列環ブロック」から組み立てられているかを読み取る定理である。
:::
