# 射影加群と入射加群 {#mod:page-projective-injective keywords="projective module, injective module, Baer's criterion, divisible group, enough injectives, enough projectives, coinduced module"}

$\Hom_{R}(X,-)$ と $\Hom_{R}(-,X)$ は左完全だが右完全ではない（\ref{mod:hom-left-exact}, \ref{mod:hom-not-right-exact}）。これが完全になる特別な加群が**射影加群**（\ref{mod:projective}）と**入射加群**（\ref{mod:injective}）である。このページでは、射影加群が自由加群の直和因子として特徴付けられること（\ref{mod:projective-characterization}）、入射加群が分裂で特徴付けられること（\ref{mod:injective-split-criterion}）を、加群の言葉で直接示し、例を調べる。ベールの判定法、$\Z$ 上の入射加群が可除群であること、任意の加群が入射加群に埋め込めることは、ホモロジー代数の系列の \tref{ha:page-injective-modules} で証明済みなので、ここでは主張を確認して使う。射影分解・入射分解による導来関手は \ref{ha:page-projective-resolutions} 以降で扱う。

> Anderson–Fuller 第 5 章 §16–18 の流れを参考にした。

## 記法と定義の確認 {#mod:sec-pi-notation}

::: notation
- $R$ は環（可換とは限らない）、加群は左 $R$ 加群。完全列・分裂補題・$\Hom$ の左完全性は \ref{mod:exact-sequence}, \tref{mod:splitting-lemma}, \ref{mod:hom-left-exact}、自由加群とその普遍性は \ref{mod:free-module}, \ref{mod:free-module-universal}、直和と直積は \ref{mod:direct-sum-universal}, \ref{mod:hom-sum-product}。
- 一般のアーベル圏での射影対象とその性質は \ref{ha:projective}, \ref{ha:projective-basic}、入射加群についての既知の結果は \tref{ha:baer-criterion}（ベールの判定法）、\ref{ha:injective-divisible}（$\Z$ 上では入射＝可除）、\ref{ha:enough-injectives}（入射加群への埋め込み）。
- **選択公理**：自由加群が射影的であることで、基底が無限のとき使う。入射加群への埋め込み（\ref{ha:enough-injectives}）もベールの判定法を通して選択公理を使う。
:::

## 射影加群 {#mod:sec-pi-projective}

::: definition 射影加群 {#mod:projective keywords="projective module, lifting property" index="射影加群|しゃえいかぐん, 持ち上げ|もちあげ"}
左 $R$ 加群 $P$ が次をみたすとき**射影加群**という：任意の全射準同型 $g:M\to N$ と準同型 $h:P\to N$ に対し、$g\circ\tilde h=h$ となる準同型 $\tilde h:P\to M$（$h$ の**持ち上げ**）がある。
$$
\begin{CD}
@. P\\
@. @VV{h}V\\
M @>{g}>> N @>>> 0
\end{CD}
$$
（$\tilde h$ は図式の $P$ から $M$ への斜めの矢印にあたる。）
:::

::: theorem 射影加群の特徴付け {#mod:projective-characterization keywords="characterizations of projective modules, direct summand of free module, Hom(P,-) exact" index="射影加群の特徴付け|しゃえいかぐんのとくちょうづけ"}
左 $R$ 加群 $P$ について、次は同値である。
1. $P$ は射影加群。
2. $\Hom_{R}(P,-)$ は完全：短完全列 $0\to L\to M\to N\to 0$ を短完全列に移す。
3. $P$ で終わる短完全列 $0\to L\to M\to P\to 0$ はすべて分裂する。
4. $P$ はある自由加群の直和因子である（ある加群 $Q$ で $P\oplus Q$ が自由加群になる）。
:::

::: proof
**Step 1（1⇔2）.** \ref{mod:hom-left-exact.1} から、2 は「$g_{*}:\Hom(P,M)\to\Hom(P,N)$ が全射」と同値で、これは 1 そのもの。

**Step 2（1⇒3）.** $0\to L\to M\xrightarrow{g}P\to 0$ について、1 を $h=\id_{P}$ に使うと $g\circ s=\id_{P}$ となる $s$ があり、\ref{mod:splitting-lemma}から分裂する。

**Step 3（3⇒4）.** $P$ の元全体で生成系をとり、自由加群 $F=R^{(P)}$ からの全射 $g:F\to P$ を作る（\ref{mod:free-module-universal.3}）。$0\to\Ker g\to F\to P\to 0$ は 3 から分裂し、分裂補題から $F\cong\Ker g\oplus P$。

**Step 4（自由加群は射影）.** 基底 $(x_{i})$ をもつ自由加群 $F$ と全射 $g:M\to N$、$h:F\to N$ について、各 $i$ で $g(m_{i})=h(x_{i})$ となる $m_{i}$ を選び、自由加群の普遍性で $\tilde h(x_{i})\defeq m_{i}$ とする。$g\tilde h$ と $h$ は基底上で一致するので等しい。

**Step 5（4⇒1）.** $F=P\oplus Q$ が自由とし、$\iota:P\to F$, $p:F\to P$ を包含と射影とする。$g:M\to N$ 全射、$h:P\to N$ について、Step 4 から $h\circ p:F\to N$ の持ち上げ $k:F\to M$（$gk=hp$）があり、$\tilde h\defeq k\circ\iota$ とおくと $g\tilde h=hp\iota=h$。

::: hypcheck
- **選択公理**：Step 4 で各 $i$ について $m_{i}$ を選ぶのに、基底が無限なら選択公理を使う。有限生成の自由加群なら有限個の選択で済む。（射影加群の理論を選択公理なしで展開すると、自由加群が射影的でないことが起こりうる。）
:::
:::

::: example 射影加群の例 {#mod:projective-examples}
1. 自由加群は射影加群（上の証明の Step 4）。
2. $\Z/6\Z\cong\Z/2\Z\oplus\Z/3\Z$（\ref{ring:crt-integers}）なので、$\Z/2\Z$ は $\Z/6\Z$ 上の射影加群だが、自由ではない（自由な $\Z/6\Z$ 加群の元の個数は $6^{n}$ か無限）。より一般に冪等元 $e$ について $Re$ は射影的な左 $R$ 加群（$R=Re\oplus R(1-e)$）。
3. $\Z/n\Z$（$n\ge 2$）は射影的な $\Z$ 加群でない：$0\to\Z\xrightarrow{n}\Z\to\Z/n\Z\to 0$ が分裂しない（\ref{mod:non-split-example} と同じ議論）。$\Q$ も射影的でない（問題 \ref{mod:prob-q-not-free-projective}）。
4. 射影加群の族の直和は射影加群（$\Hom(\bigoplus P_{i},-)\cong\prod\Hom(P_{i},-)$（\ref{mod:hom-sum-product}）で、全射の直積は全射）。
:::

::: supplement
**局所環と PID の場合.** 可換局所環上の有限生成射影加群は自由である（中山の補題を使う。\ref{ring:page-local-properties} の後に扱う）。PID 上の射影加群は自由である（有限生成なら \ref{mod:page-pid-modules} の構造定理から）。体 $K$ 上の多項式環 $K[x_{1},\dots,x_{n}]$ 上の有限生成射影加群が自由であることはセールの問題として知られ、キレンとススリンが 1976 年に独立に肯定的に解決した。
:::

## 入射加群 {#mod:sec-pi-injective}

::: definition 入射加群 {#mod:injective keywords="injective module, extension property" index="入射加群|にゅうしゃかぐん, 単射加群|たんしゃかぐん, 拡張|かくちょう"}
左 $R$ 加群 $E$ が次をみたすとき**入射加群**という：任意の単射準同型 $f:L\to M$ と準同型 $h:L\to E$ に対し、$\tilde h\circ f=h$ となる準同型 $\tilde h:M\to E$（$h$ の**拡張**）がある。
:::

::: proposition 入射加群の特徴付け {#mod:injective-characterization keywords="Hom(-,E) exact, every exact sequence starting with E splits, product of injectives, direct summand of injective" index="入射加群の特徴付け|にゅうしゃかぐんのとくちょうづけ"}
左 $R$ 加群 $E$ について、次は同値である。
1. $E$ は入射加群。
2. $\Hom_{R}(-,E)$ は短完全列を短完全列に移す。

また、入射加群なら、$E$ で始まる短完全列 $0\to E\to M\to N\to 0$ はすべて分裂する（逆も成り立つ。\see{mod:injective-split-criterion}）。入射加群の族の直積と、入射加群の直和因子は入射加群である。
:::

::: proof
**Step 1（1⇔2）.** \ref{mod:hom-left-exact.2} から、2 は「単射 $f$ について $f^{*}:\Hom(M,E)\to\Hom(L,E)$ が全射」と同値で、これは 1。

**Step 2（分裂）.** $0\to E\xrightarrow{f}M\to N\to 0$ について、1 を $h=\id_{E}$ に使うと $r\circ f=\id_{E}$ となる $r$ があり、分裂補題から分裂。

**Step 3（直和因子）.** $I=E\oplus E'$ が入射的とし、$\iota:E\to I$, $p:I\to E$ を包含と射影とする。単射 $f:L\to M$ と $h:L\to E$ について、$\iota\circ h$ の拡張 $k:M\to I$ をとり $\tilde h\defeq p\circ k$ とおくと $\tilde hf=p\iota h=h$。

**Step 4（直積）.** $\Hom(-,\prod E_{i})\cong\prod\Hom(-,E_{i})$（\ref{mod:hom-sum-product}）で、全射の直積は全射。
:::

::: remark 入射加群についての既知の結果 {#mod:injective-known}
次はホモロジー代数の系列で証明済みである。
1. （ベールの判定法、\tref{ha:baer-criterion}）左 $R$ 加群 $E$ が入射的であることと、$R$ の任意の左イデアル $\mathfrak{a}$ からの準同型 $\mathfrak{a}\to E$ が $R$ に拡張できることは同値である（⇐ でツォルンの補題を使う）。
2. （\ref{ha:injective-divisible}）可換群が入射 $\Z$ 加群であることと可除群（すべての $d$ と $n\ge 1$ で $nx=d$ が解ける）であることは同値。$\Q$, $\Q/\Z$ は入射的。同じ議論で、PID 上の加群が入射的であることと可除（$0$ でないすべての $a$ で $aM=M$）であることが同値になる。
3. （\ref{ha:enough-injectives}）任意の左 $R$ 加群は入射加群に埋め込める。埋め込み先は、可除群 $D$ から作る余誘導加群 $\Hom_{\Z}(R,D)$ の直積である。
:::

::: corollary 分裂による入射性の判定 {#mod:injective-split-criterion keywords="E is injective iff every short exact sequence starting with E splits" index="入射加群の判定|にゅうしゃかぐんのはんてい"}
（AC）左 $R$ 加群 $E$ が入射加群であることと、$E$ で始まる短完全列 $0\to E\to M\to N\to 0$ がすべて分裂することは同値である。
:::

::: proof
⇒ は \ref{mod:injective-characterization}。⇐：\ref{ha:enough-injectives} から単射 $E\to I$（$I$ は入射加群）があり、$0\to E\to I\to I/E\to 0$ は仮定から分裂するので、$E$ は $I$ の直和因子（\ref{mod:splitting-lemma}）。入射加群の直和因子は入射加群（\ref{mod:injective-characterization}）。
:::

::: supplement
**入射包絡.** 加群 $M$ を含む入射加群のうち「最小」のもの（本質的拡大で入射的なもの）が同型を除いて一意に存在する（**入射包絡** $E(M)$。エックマン＝シェプフ）。例えば $E(\Z)=\Q$、$E(\Z/p\Z)=\Z[1/p]/\Z$（プリューファー $p$ 群）。

**高い視点.** \ref{ha:enough-injectives} の証明で使う同型 $\Hom_{R}(M,\Hom_{\Z}(R,D))\cong\Hom_{\Z}(M,D)$ は、スカラーの制限 $R\text{-}\mathbf{Mod}\to\mathbf{Ab}$ の**右随伴**が $\Hom_{\Z}(R,-)$ であることを言っている（\ref{cat:adjunction}）。右随伴が単射を保つ左随伴をもつとき入射対象を入射対象に移す、という一般原理（\ref{cat:adjunction} と入射対象の定義から直ちに従う）の特別な場合である。双対に、左随伴 $R\otimes_{\Z}-$（\ref{mod:page-tensor-products}）は射影対象を射影対象に移し、自由加群 $R^{(I)}=R\otimes_{\Z}\Z^{(I)}$ はその例である。
:::

## 問題 {#mod:sec-pi-problems}

::: problem {#mod:prob-q-not-free-projective}
$\Q$ は射影的な $\Z$ 加群でないことを、$\Hom_{\Z}(\Q,\Z)=0$ を使って示せ。
:::

::: solution
**Step 1（$\Hom(\Q,\Z)=0$）.** $f:\Q\to\Z$ について、$q\in\Q$ と $n\ge 1$ で $f(q)=nf(q/n)$ なので $f(q)$ はすべての $n$ で割り切れ、$f(q)=0$。

**Step 2.** $\Q$ が射影的なら自由加群 $F=\Z^{(I)}$ の直和因子で、包含 $\iota:\Q\to F$ は単射。$F$ の各成分への射影 $p_{i}\circ\iota\in\Hom(\Q,\Z)=0$ なので $\iota=0$ となり矛盾（$\Q\neq 0$）。
:::
