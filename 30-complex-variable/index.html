# 複素解析（Complex Analysis）

正則関数とコーシーの積分定理、留数、調和関数、等角写像とリーマンの写像定理、解析接続、楕円関数。

<p class="mn-msc">MSC2020: 30</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="30A-general-properties/01-basics/index.html"><span class="mn-card-title">基本事項</span><span class="mn-card-en">Basics of Complex Analysis</span><span class="mn-card-desc">複素微分とコーシー–リーマンの方程式、複素冪級数、初等関数と対数の分枝、複素線積分、コーシーの積分定理と積分公式、正則関数の基本性質（リウヴィル・一致の定理・最大値原理）、孤立特異点とローラン展開、リーマン球面（杉浦『解析入門 II』第 IX 章 §1〜§5 を参考）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="30A-general-properties/02-residues/index.html"><span class="mn-card-title">留数と調和関数</span><span class="mn-card-en">Residues and Harmonic Functions</span><span class="mn-card-desc">回転数と一般のコーシーの定理（ホモロジー版・単連結領域）、留数定理と偏角の原理・ルーシェの定理・開写像定理、留数による定積分と級数の計算、調和関数とポアソン積分・ディリクレ問題・鏡像原理（杉浦『解析入門 II』第 IX 章 §6〜§9 を参考）。</span><span class="mn-card-count">3 ページ</span></a>
