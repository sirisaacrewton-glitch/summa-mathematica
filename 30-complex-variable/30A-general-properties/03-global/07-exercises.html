# 演習：大域的な理論 {#cx:page-exercises-global keywords="exercises, Global Theory of Holomorphic Functions"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。数値の答えは計算機（mpmath）でも確かめた。

## 記法と定義の確認 {#cx:sec-exglobal-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 関数の表示 {#cx:sec-rp-exercises}

対応するページ：\ref{cx:page-representations}

::: problem ★ 基本：無限積の値 {#cx:ex-rp-1}
$\displaystyle\prod_{n\ge1}\Bigl(1+\frac{1}{n^{2}}\Bigr)=\frac{\sinh\pi}{\pi}$ を示せ。
:::

::: solution
\ref{cx:sine-product} で $z=i$ とすると $\sin(\pi i)=\pi i\prod(1+\frac{1}{n^{2}})$。$\sin(iy)=i\sinh y$ なので $i\sinh\pi=\pi i\prod(\cdots)$。（数値は約 $3.6761$。）
:::

::: problem ★★ 標準：部分分数展開から級数の和 {#cx:ex-rp-2}
$a\notin\mathbb{Z}$ について $\displaystyle\sum_{n\ge1}\frac{1}{n^{2}-a^{2}}=\frac{1}{2a^{2}}-\frac{\pi\cot\pi a}{2a}$ を示し、$a=\frac12$ の場合を直接確かめよ。
:::

::: solution
\ref{cx:cot-partial-fractions} で $z=a$：$\pi\cot\pi a=\frac1a-2a\sum\frac{1}{n^{2}-a^{2}}$ を整理する。$a=\frac12$ では右辺は $2-0=2$、左辺は $\sum\frac{1}{(n-\frac12)(n+\frac12)}=\sum\bigl(\frac{1}{n-\frac12}-\frac{1}{n+\frac12}\bigr)=2$（望遠鏡和）。（$a=0.3$ でも数値的に一致を確かめた：約 $1.7514$。）
:::

::: problem ★★★ 発展：虚軸上のガンマ関数 {#cx:ex-rp-3}
実数 $y\neq0$ について $|\Gamma(iy)|^{2}=\dfrac{\pi}{y\sinh\pi y}$ を示せ。
:::

::: solution
$\Gamma(\bar z)=\overline{\Gamma(z)}$（実軸上で実数値なので、$z\mapsto\overline{\Gamma(\bar z)}$ は有理型で実軸上 $\Gamma$ と一致し、一致の定理から等しい）なので $|\Gamma(iy)|^{2}=\Gamma(iy)\Gamma(-iy)$。関数等式 $\Gamma(1-iy)=-iy\Gamma(-iy)$ と相補公式から $\Gamma(iy)\Gamma(-iy)=\frac{\Gamma(iy)\Gamma(1-iy)}{-iy}=\frac{\pi}{-iy\sin(\pi iy)}=\frac{\pi}{-iy\cdot i\sinh\pi y}=\frac{\pi}{y\sinh\pi y}$。
:::

## 一次分数変換と自己同型群 {#cx:sec-mb-exercises}

対応するページ：\ref{cx:page-mobius}

::: problem ★ 基本：3 点の指定 {#cx:ex-mb-1}
$1,i,-1$ をそれぞれ $0,1,\infty$ に写す一次分数変換を求め、単位円板の像を答えよ。
:::

::: solution
複比 $(z,i,1,-1)=\frac{(z-1)(i+1)}{(z+1)(i-1)}$ で、$\frac{1+i}{-1+i}=-i$ なので $T(z)=-i\frac{z-1}{z+1}$。単位円周は $1,i,-1$ を通るので実軸（$\cup\{\infty\}$）に写り、$T(0)=i$ なので単位円板は上半平面に写る。
:::

::: problem ★★ 標準：2 点を入れ替える自己同型 {#cx:ex-mb-2}
$a\in\mathbb{D}$ について、$0$ と $a$ を入れ替える $\mathbb{D}$ の自己同型を求めよ。それは対合（2 回合成すると恒等写像）か。
:::

::: solution
$f(z)\defeq-\varphi_{a}(z)=\frac{a-z}{1-\bar az}$ は自己同型で $f(0)=a$, $f(a)=0$。$f\circ f$ は $0$ を固定する自己同型で、$(f\circ f)'(0)=f'(a)f'(0)=\frac{-1}{1-|a|^{2}}\cdot(-(1-|a|^{2}))=1$ なので恒等写像（\ref{cx:aut-disk}）。対合である。
:::

::: problem ★★★ 発展：微分係数の評価 {#cx:ex-mb-3}
$f\colon\mathbb{D}\to\mathbb{D}$ が正則で $f(0)=\frac12$ なら $|f'(0)|\le\frac34$ であることを示し、等号が成り立つ $f$ を一つ挙げよ。
:::

::: solution
\ref{cx:schwarz-pick}の第 2 式で $z=0$：$|f'(0)|\le1-|f(0)|^{2}=\frac34$。等号は $f=\varphi_{-1/2}$、すなわち $f(z)=\frac{z+\frac12}{1+\frac z2}$ で、$f'(0)=1-\frac14=\frac34$（\ref{cx:blaschke-properties}）。
:::

## 正規族 {#cx:sec-nf-exercises}

対応するページ：\ref{cx:page-normal-families}

::: problem ★ 基本：正規族かどうか {#cx:ex-nf-1}
$\{z^{n}\}_{n\ge1}$ は $D(0,2)$ で正規族か。
:::

::: solution
正規族でない。$z=\frac32$ で $|z^{n}|\to\infty$ なので、どの部分列も $z=\frac32$ で収束しない（局所有界でない）。$\mathbb{D}$ では $|z^{n}|\le1$ なので正規族。
:::

::: problem ★★ 標準：実部が正の関数の族 {#cx:ex-nf-2}
$\mathcal{F}\defeq\{f\in\mathcal{O}(\mathbb{D})\mid\operatorname{Re}f>0,\ f(0)=1\}$ は正規族であることを示せ。
:::

::: solution
$g\defeq\frac{f-1}{f+1}$ は $\operatorname{Re}f>0$ から $|g|<1$（$|f-1|<|f+1|$）で、$g(0)=0$。シュワルツの補題から $|g(z)|\le|z|$。$f=\frac{1+g}{1-g}$ なので $|f(z)|\le\frac{1+|z|}{1-|z|}$。$|z|\le r<1$ で一様に有界なので局所有界、モンテルの定理から正規族。
:::

::: problem ★★★ 発展：極限の一意性 {#cx:ex-nf-3}
$f_{n}\colon\mathbb{D}\to\mathbb{D}$ が正則で $f_{n}(0)=0$, $f_{n}'(0)\to1$ なら、$f_{n}(z)\to z$ が広義一様に成り立つことを示せ。
:::

::: solution
コンパクト集合 $K$ と $\varepsilon>0$ で $\sup_{K}|f_{n}(z)-z|\ge\varepsilon$ となる $n$ が無限個あったとする。それらの $n$ を小さい順に並べた部分列は $|f_{n}|<1$ で局所有界、モンテルの定理からさらに広義一様収束する部分列があり、極限 $f$ は $|f|\le1$, $f(0)=0$, $f'(0)=1$（\ref{cx:weierstrass-convergence}）。開写像定理から $|f|<1$ で、シュワルツの補題の等号の場合から $f(z)=z$。すると $K$ 上 $\sup|f_{n}(z)-z|\to0$ となる部分列があり、仮定に反する。
:::

## リーマンの写像定理 {#cx:sec-rm-exercises}

対応するページ：\ref{cx:page-riemann-mapping}

::: problem ★ 基本：帯から円板へ {#cx:ex-rm-1}
帯 $\{0<\operatorname{Re}z<1\}$ から $\mathbb{D}$ への双正則写像を一つ求めよ。
:::

::: solution
$z\mapsto i\pi z$ は帯を $\{0<\operatorname{Im}w<\pi\}$ に写し（$i\pi(x+iy)=-\pi y+i\pi x$）、$e^{w}$ がそれを上半平面に、ケーリー変換が $\mathbb{D}$ に写す（\ref{cx:sec-rm-examples}）。$f(z)=\frac{e^{i\pi z}-i}{e^{i\pi z}+i}$。
:::

::: problem ★★ 標準：穴あき平面 {#cx:ex-rm-2}
$\C\setminus\{0\}$ は $\mathbb{D}$ と双正則か。
:::

::: solution
双正則でない。双正則なら同相で、$\mathbb{D}$ は単連結なので $\C\setminus\{0\}$ も単連結になるが、$\frac1z$ は原始関数をもたない（\ref{cx:one-over-z-no-primitive}）ので \ref{cx:simply-connected-equivalents.4} に反する。
:::

::: problem ★★★ 発展：穴あき円板と円環 {#cx:ex-rm-3}
$\mathbb{D}^{*}\defeq\mathbb{D}\setminus\{0\}$ と円環 $A\defeq A(0;1,2)$ は双正則でないことを示せ（どちらも単連結でなく、同相である）。
:::

::: solution
$f\colon\mathbb{D}^{*}\to A$ を双正則とする。$f$ は有界なので $0$ は除去可能（\ref{cx:removable-singularity}）で、$f$ は $\mathbb{D}$ 上の正則関数に延び、$p\defeq f(0)\in\overline{A}$。(i) $p\in A$ なら $p=f(z_{1})$（$z_{1}\neq0$）。$0$ と $z_{1}$ の交わらない小円板の像は開写像定理からどちらも $p$ の近傍で、交わるので $f$ は $\mathbb{D}^{*}$ で単射でない。矛盾。(ii) $p\in\partial A$（$|p|=1$ または $2$）なら、$f(\mathbb{D})=A\cup\{p\}$ は開写像定理から開集合のはずだが、$p$ のどの近傍も $A$ の外の点（$|w|<1$ または $|w|>2$）を含むので開でない。矛盾。
:::

## 解析接続とモノドロミー定理 {#cx:sec-ac-exercises}

対応するページ：\ref{cx:page-analytic-continuation}

::: problem ★ 基本：円周に沿った平方根 {#cx:ex-ac-1}
$\sqrt z$ の $z=2$ での芽（正の値をとる分枝）を、円周 $|z-2|=1$ に沿って一周させるとどうなるか。
:::

::: solution
元に戻る。円板 $D(2,\frac32)$ は $0$ を含まず凸で、その上で $\sqrt z$ の分枝（$e^{\frac12\operatorname{Log}z}$）が正則なので、その分枝を道に沿って並べれば接続になり、終わりの芽は始めと同じ（一意性）。あるいは、円周は $D(2,\frac32)$ の中で定値道とホモトープなのでモノドロミー定理から。
:::

::: problem ★★ 標準：$-\operatorname{Log}(1-z)$ の接続 {#cx:ex-ac-2}
$f(z)=\sum_{n\ge1}\frac{z^{n}}{n}$（$|z|<1$）の $0$ での芽を、$1$ を正の向きに一周する道に沿って接続すると、$f$ はいくら変わるか。
:::

::: solution
$f(z)=-\operatorname{Log}(1-z)$（\ref{cx:log-holomorphic}）。$z$ が $1$ のまわりを正の向きに一周すると、$1-z=-(z-1)$ は $0$ のまわりを正の向きに一周する（$-1$ 倍は回転なので回る向きは変わらない）ので、対数の接続は $2\pi i$ 増え、$f$ は $-2\pi i$ だけ変わる。
:::

::: problem ★★★ 発展：自然境界 {#cx:ex-ac-3}
$\sum_{n\ge1}z^{n!}$ は単位円周を自然境界にもつことを示せ。
:::

::: solution
$\omega=e^{2\pi ip/q}$（$p,q$ は整数、$q\ge1$）について $n\ge q$ なら $q\mid n!$ で $\omega^{n!}=1$。よって $f(r\omega)=\sum_{n<q}(r\omega)^{n!}+\sum_{n\ge q}r^{n!}\to\infty$（$r\to1-$）。このような $\omega$ は単位円周上で稠密なので、\ref{cx:natural-boundary} の Step 2 と同じ議論で、どの点を越えても接続できない。
:::

## 楕円関数 {#cx:sec-el-exercises}

対応するページ：\ref{cx:page-elliptic-functions}

::: problem ★ 基本：位数 {#cx:ex-el-1}
$\wp''$ の\term[位数]{cx:elliptic-function}と、周期平行四辺形の中の $\wp''$ の零点の個数を答えよ。
:::

::: solution
$\wp''$ の極は $\Lambda$ の点の 4 位の極（$\wp=\frac{1}{z^{2}}+\cdots$ を 2 回微分）だけなので\term[位数]{cx:elliptic-function} 4、零点も重複度込みで 4 個（\ref{cx:elliptic-liouville.3}）。
:::

::: problem ★★ 標準：$e_{1},e_{2},e_{3}$ の対称式 {#cx:ex-el-2}
$e_{1}+e_{2}+e_{3}=0$, $e_{1}e_{2}+e_{2}e_{3}+e_{3}e_{1}=-\frac{g_{2}}{4}$, $e_{1}e_{2}e_{3}=\frac{g_{3}}{4}$ を示せ。
:::

::: solution
\ref{cx:half-periods} の $4x^{3}-g_{2}x-g_{3}=4(x-e_{1})(x-e_{2})(x-e_{3})$ の係数を比べる（根と係数の関係）。$x^{2}$ の係数 $0=-4(e_{1}+e_{2}+e_{3})$、$x$ の係数 $-g_{2}=4(e_{1}e_{2}+e_{2}e_{3}+e_{3}e_{1})$、定数項 $-g_{3}=-4e_{1}e_{2}e_{3}$。
:::

::: problem ★★★ 発展：倍角 {#cx:ex-el-3}
$\wp(2z)$ は $\wp(z)$ の有理関数であることを示し、その有理関数の次数（分子・分母の次数の大きい方）を求めよ。
:::

::: solution
$\wp(2z)$ は $\Lambda$ に関する偶な楕円関数（$\wp(2(z+\omega))=\wp(2z+2\omega)=\wp(2z)$）なので、\ref{cx:even-elliptic-rational} から $R(\wp(z))$ と書ける。極は $2z\in\Lambda$、すなわち $z\in\frac12\Lambda$ の 4 点（$\Lambda$ を法として $0,\eta_{1},\eta_{2},\eta_{3}$）でそれぞれ 2 位なので、$\wp(2z)$ の\term[位数]{cx:elliptic-function}は 8。$R$ の次数を $d$ とすると $R(\wp)$ の位数は $2d$（各値を $\wp$ が 2 回とる）なので $d=4$。（明示的には $\wp(2z)=\frac14\bigl(\frac{\wp''}{\wp'}\bigr)^{2}-2\wp$ と書けることが知られている。）
:::
