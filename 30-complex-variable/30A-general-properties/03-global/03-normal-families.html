# 正規族 {#cx:page-normal-families keywords="normal family, locally bounded family, Montel's theorem, equicontinuity from Cauchy estimates, diagonal argument, exhaustion by compact sets, Hurwitz's theorem, limits of nonvanishing functions, limits of injective functions are injective or constant"}

実数の世界では、有界な連続関数の列から一様収束する部分列が取り出せるとは限らない。そのためには同等連続性が要る（アスコリ–アルツェラの定理、\tref{top:ascoli-classical}）。ところが正則関数では、コーシーの評価式が導関数を関数の値で抑えるので、局所的に一様有界であるだけで同等連続性が自動的に従う。その結果、局所的に一様有界な正則関数の族からは、つねに広義一様収束する部分列が取り出せる（**モンテルの定理**）。これは次のページのリーマンの写像定理で、「最もよい写像」の存在を示すためのコンパクト性の議論の核心になる。あわせて、零点をもたない（あるいは単射な）正則関数の極限がどうなるかを述べる**フルヴィッツの定理**を示す。

## 記法と定義の確認 {#cx:sec-nf-notation}

::: notation
- 広義一様収束とワイエルシュトラスの収束定理 \tref{cx:weierstrass-convergence}、コーシーの評価式 \ref{cx:cauchy-estimates}、偏角の原理 \tref{cx:argument-principle}、零点の\term[位数]{cx:zero-order} \ref{cx:zero-order}、一致の定理 \tref{cx:identity-theorem}、一様収束と線積分 \ref{cx:uniform-limit-integral}。
- 同等連続性とアスコリ–アルツェラの定理 \ref{top:equicontinuous}, \ref{top:ascoli-classical}（比較のため。証明では対角線論法を直接書く）、コンパクト集合と閉集合の距離 \ref{top:compact-closed-distance}。
- 開集合 $U$ 上の正則関数全体を $\mathcal{O}(U)$ と書く。
- **公理系**：$\ZF$ で行い、選択公理は使わない（部分列は、条件を満たすもののうち番号の最小のものとして具体的に選ぶ）。
:::

## モンテルの定理 {#cx:sec-nf-montel}

::: definition 正規族と局所有界 {#cx:normal-family keywords="normal family: every sequence has a locally uniformly convergent subsequence; locally bounded (locally uniformly bounded) family" index="正規族|せいきぞく, 局所有界|きょくしょゆうかい"}
$\mathcal{F}\subset\mathcal{O}(U)$ とする。
1. $\mathcal{F}$ の任意の点列が、$U$ 上で広義一様収束する部分列をもつとき、$\mathcal{F}$ は**正規族**であるという（極限は \ref{cx:weierstrass-convergence} から正則）。
2. $U$ の任意のコンパクト集合 $K$ について $\sup_{f\in\mathcal{F}}\sup_{K}|f|<\infty$ のとき、$\mathcal{F}$ は**局所有界**であるという。
:::

::: lemma コンパクト集合による近似 {#cx:exhaustion keywords="exhaustion of an open set by compact sets K_m with K_m in the interior of K_{m+1}" index=""}
開集合 $U\subset\C$ について $K_{m}\defeq\{z\in U\mid|z|\le m,\ |z-w|\ge\frac1m\ (w\notin U)\}$（$U=\C$ なら距離の条件はなし）とおくと、$K_{m}$ はコンパクトで、$K_{m}\subset K_{m+1}$、$\bigcup_{m}K_{m}=U$ で、$U$ の任意のコンパクト集合はある $K_{m}$ に含まれる。
:::

::: proof
$K_{m}$ は有界で、$z\mapsto\operatorname{dist}(z,\C\setminus U)$ は連続なので閉集合、よってコンパクト。$z\in U$ は $U$ が開なので $\operatorname{dist}(z,\C\setminus U)>0$ で、十分大きい $m$ で $K_{m}$ に入る。コンパクト集合 $K\subset U$ は有界で、\ref{top:compact-closed-distance} から $\C\setminus U$ との距離が正なので、十分大きい $m$ で $K\subset K_{m}$。
:::

::: theorem モンテルの定理 {#cx:montel keywords="Montel's theorem: a locally bounded family of holomorphic functions is normal; conversely normal families are locally bounded" index="モンテルの定理|もんてるのていり" refname="モンテルの定理"}
$\mathcal{F}\subset\mathcal{O}(U)$ について、$\mathcal{F}$ が正規族であることと局所有界であることは同値である。
:::

::: intuition
局所有界性からコーシーの評価式で導関数も局所有界になり、関数の族が「一斉に同じくらい滑らか」（同等連続）になる。すると、有理数の座標をもつ可算個の点で収束する部分列を対角線論法で取り出せば、その部分列は全体で一様に収束する。
:::

::: proof
**Step 1（局所有界 ⇒ 同等連続）.** コンパクト集合 $K\subset U$ について、$\delta>0$ を $K_{\delta}\defeq\{z\mid\operatorname{dist}(z,K)\le2\delta\}\subset U$ ととる（\ref{top:compact-closed-distance}）。$K_{\delta}$ はコンパクトなので $M\defeq\sup_{f\in\mathcal{F}}\sup_{K_{\delta}}|f|<\infty$。$a\in K$ について $\overline{D}(a,2\delta)\subset K_{\delta}$ なので、$|z-a|\le\delta$ の点 $z$ でもコーシーの評価式（半径 $\delta$）から $|f'(z)|\le\frac{M}{\delta}$。よって $z,w\in K$, $|z-w|<\delta$ なら、線分 $[w,z]\subset D(w,\delta)$ に沿って積分して $|f(z)-f(w)|\le\frac M\delta|z-w|$（すべての $f\in\mathcal{F}$）。

**Step 2（可算個の点での収束）.** $U$ の点で実部・虚部がともに有理数のものを、決まった順に $q_{1},q_{2},\dots$ と並べる（$\mathbb{Q}^{2}$ の全単射 $\mathbb{N}\to\mathbb{Q}^{2}$ を一つ固定する）。$(f_{n})$ を $\mathcal{F}$ の点列とする。$(f_{n}(q_{1}))$ は有界な複素数列なので、収束する部分列をもつ。具体的には、ボルツァーノ–ワイエルシュトラスの二分法（実部・虚部の正方形を 4 等分し、無限個の項を含む最初の小正方形を選ぶ）で極限 $c_{1}$ を決め、$|f_{n}(q_{1})-c_{1}|<2^{-k}$ を満たす番号の最小のものを順に選んで部分列 $(f_{1,k})_{k}$ を作る。同様に $(f_{1,k})$ から $q_{2}$ で収束する部分列 $(f_{2,k})$、…と作り、対角列 $g_{k}\defeq f_{k,k}$ をとる。$(g_{k})_{k\ge j}$ は $(f_{j,k})$ の部分列なので、$(g_{k})$ はすべての $q_{j}$ で収束する。

**Step 3（コンパクト集合上の一様収束）.** $K\subset U$ をコンパクト、$\varepsilon>0$ とし、Step 1 の $\delta$, $M$ をとる。$\eta\defeq\min(\delta,\frac{\varepsilon\delta}{3M})$ とする。$K$ は有限個の円板 $D(a,\frac\eta2)$ で覆え、各円板の中に有理点 $q$ が（$K_{\delta}$ の内部の点として）とれるので、有限個の有理点 $q_{j_{1}},\dots,q_{j_{s}}$ で、$K$ の各点から距離 $\eta$ 未満に少なくとも一つがあるものをとれる。（$q$ と $K$ の点を結ぶ線分は $K_{\delta}$ に入るので、Step 1 の評価は $K$ を $K_{\delta}$ の中の点に広げても同じ形で使える。）$k,l$ が十分大きければ $|g_{k}(q_{j_{i}})-g_{l}(q_{j_{i}})|<\frac\varepsilon3$（$i=1,\dots,s$）。$z\in K$ について $|z-q_{j_{i}}|<\eta$ となる $i$ をとると
$$
|g_{k}(z)-g_{l}(z)|\le|g_{k}(z)-g_{k}(q_{j_{i}})|+|g_{k}(q_{j_{i}})-g_{l}(q_{j_{i}})|+|g_{l}(q_{j_{i}})-g_{l}(z)|<\varepsilon.
$$
よって $(g_{k})$ は $K$ 上一様コーシーで、一様収束する。

**Step 4（正規族 ⇒ 局所有界）.** 局所有界でないとすると、コンパクト集合 $K$ と、$\sup_{K}|f_{n}|\ge n$ となる $f_{n}\in\mathcal{F}$ の列がある（各 $n$ でそのような $f$ が存在するという事実から列を作るには選択が要るので、ここは可算選択を使う：下の hypcheck）。どの部分列も $K$ 上一様収束しない（一様収束すれば極限は連続で有界、部分列も一様に有界になる）ので正規族でない。

::: hypcheck
- **局所有界性**：Step 1 でコーシーの評価式に使った。外せない：$f_{n}(z)=nz$ は $\mathbb{D}$ 上でどの部分列も $z\neq0$ で発散する。
- **正則性**：Step 1 で導関数の評価に使った。実数値の連続関数の一様有界な族は同等連続とは限らない（$\sin nx$）。
- **選択公理**：1 ⇒ 2（局所有界 ⇒ 正規）は Step 2 で部分列を具体的に選んだので $\ZF$ で示せる。逆向き（Step 4）は「非有界な関数の列」を選ぶのに可算選択を使った。本サイトで使うのは前者だけである。
:::
:::

::: example
1. $\{f\in\mathcal{O}(\mathbb{D})\mid|f|\le1\}$ は正規族。
2. $\{z^{n}\}_{n\ge1}$ は $\mathbb{D}$ で正規族（$|z^{n}|\le1$）。実際 $z^{n}\to0$ は広義一様。しかし $\overline{\mathbb{D}}$ 全体では一様収束しない（$|z|=1$ で $|z^{n}|=1$）。広義一様収束は境界での振る舞いを要求しない。
:::

## フルヴィッツの定理 {#cx:sec-nf-hurwitz}

::: theorem フルヴィッツの定理 {#cx:hurwitz keywords="Hurwitz's theorem: the zeros of a locally uniform limit are limits of zeros; limits of nonvanishing holomorphic functions are nonvanishing or identically zero" index="フルヴィッツの定理|ふるゔぃっつのていり" refname="フルヴィッツの定理"}
$D$ を領域、$f_{n}\in\mathcal{O}(D)$ が $f$ に広義一様収束し、$f\not\equiv0$ とする。
1. $\overline{D}(z_{0},r)\subset D$ で、$f$ が円周 $|z-z_{0}|=r$ 上に零点をもたないなら、十分大きい $n$ で $f_{n}$ と $f$ は $D(z_{0},r)$ に同じ個数の零点（重複度込み）をもつ。
2. すべての $f_{n}$ が $D$ で零点をもたないなら、$f$ も零点をもたない。
:::

::: proof
**Step 1（1）.** $\delta\defeq\min_{|z-z_{0}|=r}|f|>0$。一様収束から、十分大きい $n$ で円周上 $|f_{n}-f|<\delta\le|f|$。ルーシェの定理（\tref{cx:rouche}、$\Gamma=C(z_{0},r)$）から零点の個数は等しい。

**Step 2（2）.** $f(z_{0})=0$ と仮定する。$f\not\equiv0$ なので零点は孤立し（一致の定理）、$\overline{D}(z_{0},r)\subset D$ で $0<|z-z_{0}|\le r$ に零点がないように $r$ をとれる。1 から十分大きい $n$ で $f_{n}$ は $D(z_{0},r)$ に零点を 1 個以上もち、仮定に反する。

::: hypcheck
- **前提「$f\not\equiv0$」**：外せない：$f_{n}=\frac{e^{z}}{n}$ は零点をもたず、$0$ に広義一様収束する。2 の結論は「零点をもたないか、恒等的に $0$」と読める。
- **前提「$D$ は連結」**：一致の定理に使った。
:::
:::

::: corollary 単射な関数の極限 {#cx:hurwitz-injective keywords="a locally uniform limit of injective holomorphic functions on a domain is injective or constant" index=""}
領域 $D$ 上の単射な正則関数の列 $f_{n}$ が $f$ に広義一様収束するなら、$f$ は単射か定数である。
:::

::: proof
$f$ は定数でなく、$f(z_{1})=f(z_{2})=w$, $z_{1}\neq z_{2}$ と仮定する。$f-w$ は恒等的に $0$ でないので零点は孤立し、交わらない閉円板 $\overline{D}(z_{1},r)$, $\overline{D}(z_{2},r)\subset D$ を、その円周上に $f-w$ の零点がないようにとれる。フルヴィッツの定理 1 を $f_{n}-w\to f-w$ に使うと、十分大きい $n$ で $f_{n}-w$ は両方の円板に零点をもち、$f_{n}$ は単射でない。
:::

::: supplement
**応用の形.** リーマンの写像定理では、単射な正則関数 $f\colon U\to\mathbb{D}$ で $f(z_{0})=0$ のものの族を考え、$|f'(z_{0})|$ を最大にするものをモンテルの定理で取り出す。そのとき極限が単射であること（定数でないことは $|f'(z_{0})|>0$ から）を保証するのが \ref{cx:hurwitz-injective} である。

**類似の定理.** ヴィタリの定理（局所有界な列が、集積点をもつ集合の上で各点収束すれば広義一様収束する）も、モンテルの定理と一致の定理から従う（未収録）。値を 2 点除外する族が（無限遠を許して）正規族であるというモンテルの大定理は、ピカールの定理の証明に使われる（未収録）。
:::

## 問題 {#cx:sec-nf-problems}

::: problem {#cx:prob-nf-not-normal}
$f_{n}(z)=nz$ からなる族は $\mathbb{D}$ で正規族でないことを示せ。$\mathbb{D}\setminus\{0\}$ ではどうか。
:::

::: solution
$z\neq0$ で $|f_{n}(z)|\to\infty$ なので、どの部分列も $z$ で収束しない。$\mathbb{D}\setminus\{0\}$ でも同じ理由で正規族でない（どちらでも局所有界でない）。$\infty$ への広義一様収束を許す「拡張された意味の正規族」では、$\mathbb{D}\setminus\{0\}$ 上の $nz$ は $\infty$ に広義一様に発散するので正規族になるが、$\mathbb{D}$ 上では $0$ で $0$ にとどまるので、その意味でも正規族でない。
:::

::: problem {#cx:prob-nf-derivative-bound}
$\mathcal{F}\defeq\{f\in\mathcal{O}(\mathbb{D})\mid f(0)=0,\ |f'|\le1\}$ は正規族であることを示せ。
:::

::: solution
$f(z)=\int_{[0,z]}f'$ から $|f(z)|\le|z|<1$。よって局所有界で、モンテルの定理から正規族。
:::

::: problem {#cx:prob-nf-hurwitz-count}
$f_{n}(z)\defeq\sum_{k=0}^{n}\frac{z^{k}}{k!}$ について、任意の $R>0$ に対し、十分大きい $n$ では $f_{n}$ は $D(0,R)$ に零点をもたないことを示せ。
:::

::: solution
$f_{n}\to e^{z}$ は広義一様（冪級数）。$e^{z}$ は零点をもたないので、$\overline{D}(0,R)$ 上 $|e^{z}|\ge e^{-R}$。フルヴィッツの定理 1（$z_{0}=0$, $r=R$ より少し大きくとる）から、十分大きい $n$ で $f_{n}$ の $D(0,R)$ の零点の個数は $e^{z}$ と同じく $0$。（$f_{n}$ は $n$ 次多項式なので $n$ 個の零点をもつが、それらは $n\to\infty$ で無限遠に逃げていく。）
:::
