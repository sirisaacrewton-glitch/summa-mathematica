# 回転数と一般のコーシーの定理 {#cx:page-winding-number keywords="winding number (index) of a closed curve, integer valued, locally constant, zero on the unbounded component, relation to the degree of a loop, cycle, homologous to zero, homology version of Cauchy's theorem, Dixon's proof, general Cauchy integral formula, simply connected domain, winding numbers vanish in simply connected domains, holomorphic logarithm and roots of nonvanishing functions"}

\ref{cx:cauchy-star} では、星形の領域でコーシーの積分定理を示した。一般の領域では、閉曲線が領域の「穴」のまわりを回っていると積分定理は成り立たない。その回り方を数える量が**回転数** $n(\gamma,a)=\frac{1}{2\pi i}\oint_{\gamma}\frac{dz}{z-a}$ である。このページでは、回転数が整数であり、代数的位相幾何学の閉道の写像度（\ref{at:degree-loop}）と一致することを示す。そのうえで、領域の外の点についての回転数がすべて $0$ になる閉曲線（の和）に対して、コーシーの積分定理と積分公式が成り立つこと（**ホモロジー版のコーシーの定理**）を、ディクソンによる短い証明で示す。最後に、単連結な領域ではこの条件が自動的に満たされるので、正則関数は原始関数をもち、零点のない正則関数は正則な対数と冪根をもつ。

## 記法と定義の確認 {#cx:sec-wn-notation}

::: notation
- 曲線はすべて区分的 $C^{1}$ 級。像 $\gamma^{*}$、閉曲線、複素線積分 \ref{cx:contour-integral}、基本性質 \ref{cx:contour-integral-basic}、長さによる評価 \tref{cx:ml-inequality}、曲線との合成の微分 \ref{cx:chain-rule-curve}、線積分の基本定理と原始関数の存在 \tref{cx:fundamental-theorem-contour}, \ref{cx:primitive-existence}。
- グルサの定理 \tref{cx:goursat}、星形領域のコーシーの定理 \tref{cx:cauchy-star}、コーシー型積分は解析的 \ref{cx:cauchy-type-integral}、正則関数は解析的 \tref{cx:holomorphic-analytic}、リウヴィルの定理 \tref{cx:liouville}、モレラの定理 \tref{cx:morera}、除去可能特異点定理 \tref{cx:removable-singularity}。
- 積分記号下の微分（パラメータ積分の連続性）\ref{calc:differentiation-under-integral.1}、連続関数の累次積分の順序交換 \ref{calc:fubini-continuous}、測度 0 の集合 \ref{calc:measure-zero-rn}, \ref{calc:measure-zero-rn-properties}。
- 位相：道とホモトピー \ref{at:path}, \ref{at:homotopy}、持ち上げの補題 \tref{at:lifting-lemma}、閉道の写像度 \ref{at:degree-loop}、円周の基本群 \tref{at:fundamental-group-circle}、単連結（弧状連結で基本群が自明、\ref{at:fundamental-group} の 3）。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 回転数 {#cx:sec-wn-winding}

::: definition 回転数 {#cx:winding-number keywords="winding number (index) n(gamma, a) = (1/2 pi i) int_gamma dz/(z-a) for a closed curve gamma and a point a not on it" index="回転数|かいてんすう, 指数（曲線の）|しすうきょくせんの"}
閉曲線 $\gamma$ と $a\notin\gamma^{*}$ について
$$
n(\gamma,a)\defeq\frac{1}{2\pi i}\oint_{\gamma}\frac{dz}{z-a}
$$
を、$\gamma$ の $a$ のまわりの**回転数**という。
:::

::: theorem 回転数の基本性質 {#cx:winding-number-properties keywords="the winding number is an integer, locally constant on the complement of the curve, and zero on the unbounded component" index=""}
閉曲線 $\gamma\colon[\alpha,\beta]\to\C$ について、
1. $n(\gamma,a)\in\mathbb{Z}$（$a\notin\gamma^{*}$）。
2. $a\mapsto n(\gamma,a)$ は $\C\setminus\gamma^{*}$ の各連結成分の上で定数である。
3. $\gamma^{*}\subset\overline{D}(0,R)$ なら、$|a|>R$ で $n(\gamma,a)=0$。とくに $\C\setminus\gamma^{*}$ の非有界な連結成分の上で $n(\gamma,\cdot)=0$。
:::

::: proof
**Step 1（1：連続な対数）.** $\varphi(t)\defeq\int_{\alpha}^{t}\frac{\gamma'(s)}{\gamma(s)-a}\,ds$（区分的に連続な関数の積分）とおくと、$\varphi$ は連続で、$\gamma$ が $C^{1}$ の各区間の内部で $\varphi'=\frac{\gamma'}{\gamma-a}$。$\psi(t)\defeq e^{-\varphi(t)}(\gamma(t)-a)$ はその区間で
$$
\psi'=e^{-\varphi}\Bigl(-\frac{\gamma'}{\gamma-a}(\gamma-a)+\gamma'\Bigr)=0
$$
（\ref{cx:chain-rule-curve}）なので、各区間で定数、$\psi$ の連続性から $[\alpha,\beta]$ 全体で定数 $\psi(\alpha)=\gamma(\alpha)-a$。$t=\beta$ で $e^{-\varphi(\beta)}(\gamma(\beta)-a)=\gamma(\alpha)-a$ で、$\gamma(\beta)=\gamma(\alpha)\neq a$ なので $e^{\varphi(\beta)}=1$。\ref{cx:exp.3} から $\varphi(\beta)\in2\pi i\mathbb{Z}$、すなわち $n(\gamma,a)=\frac{\varphi(\beta)}{2\pi i}\in\mathbb{Z}$。

**Step 2（2）.** $a\mapsto n(\gamma,a)$ は \ref{cx:cauchy-type-integral}（$\varphi\equiv\frac{1}{2\pi i}$）から $\C\setminus\gamma^{*}$ で連続。整数値の連続関数は連結集合の上で定数（像は $\mathbb{Z}$ の連結部分集合で一点）。

**Step 3（3）.** $|a|>R$ なら \ref{cx:ml-inequality} から $|n(\gamma,a)|\le\frac{L(\gamma)}{2\pi(|a|-R)}$。$|a|$ が十分大きいとき右辺 $<1$ で、整数なので $0$。$\{|a|>R\}$ は連結で $\gamma^{*}$ と交わらないので一つの連結成分に含まれ、その成分（非有界な成分。それ以外の成分は $\overline{D}(0,R)$ に含まれて有界）の上で 2 から $0$。
:::

::: intuition
Step 1 の $\varphi(t)$ は、$\gamma(t)-a$ の「連続に選んだ対数」で、その虚部は偏角を連続に追いかけたものである。一周して戻ってきたとき偏角は $2\pi$ の整数倍だけ増えていて、その倍数が回転数である。
:::

::: proposition 回転数と写像度 {#cx:winding-degree keywords="the winding number equals the degree of the loop (gamma - a)/|gamma - a| in S^1; winding numbers are homotopy invariant" index=""}
閉曲線 $\gamma\colon[\alpha,\beta]\to\C\setminus\{a\}$ について、$S^{1}$ の閉道 $\sigma(s)\defeq\frac{\gamma(\tau(s))-a}{|\gamma(\tau(s))-a|}$（$\tau(s)\defeq\alpha+s(\beta-\alpha)$, $s\in[0,1]$）の写像度（\ref{at:degree-loop}）は $n(\gamma,a)$ に等しい。
:::

::: proof
\ref{cx:winding-number-properties} の Step 1 から $\gamma(t)-a=(\gamma(\alpha)-a)e^{\varphi(t)}$ で、$\theta_{0}\in\R$ を $\frac{\gamma(\alpha)-a}{|\gamma(\alpha)-a|}=e^{i\theta_{0}}$ ととると $\sigma(s)=e^{i(\theta_{0}+\operatorname{Im}\varphi(\tau(s)))}$。よって $\tilde\sigma(s)\defeq\frac{\theta_{0}+\operatorname{Im}\varphi(\tau(s))}{2\pi}$ は $\sigma$ の連続な持ち上げ（$p(x)=e^{2\pi ix}$）で、持ち上げの一意性（\tref{at:lifting-lemma}）から写像度は $\tilde\sigma(1)-\tilde\sigma(0)=\frac{\operatorname{Im}\varphi(\beta)}{2\pi}$。Step 1 から $\varphi(\beta)=2\pi i\,n(\gamma,a)$ で、$\operatorname{Im}\varphi(\beta)=2\pi n(\gamma,a)$。
:::

## ホモロジー版のコーシーの定理 {#cx:sec-wn-cauchy}

::: definition サイクルと零ホモローグ {#cx:cycle keywords="cycle: formal sum of closed curves; integral over a cycle; winding number of a cycle; cycle homologous to zero in an open set" index="サイクル|さいくる, 零ホモローグ|れいほもろーぐ, ホモローグ|ほもろーぐ"}
有限個の閉曲線 $\gamma_{1},\dots,\gamma_{k}$ の形式的な和 $\Gamma=\gamma_{1}+\cdots+\gamma_{k}$ を**サイクル**といい、$\Gamma^{*}\defeq\bigcup_{j}\gamma_{j}^{*}$、$\int_{\Gamma}f\defeq\sum_{j}\int_{\gamma_{j}}f$、$n(\Gamma,a)\defeq\sum_{j}n(\gamma_{j},a)$ と定める。開集合 $U$ について $\Gamma^{*}\subset U$ で、すべての $a\in\C\setminus U$ について $n(\Gamma,a)=0$ のとき、$\Gamma$ は $U$ で**零ホモローグ**であるという。二つのサイクルの差が零ホモローグのとき、**ホモローグ**であるという。
:::

::: example
$U=A(0;1,3)$（円環）で、$\Gamma\defeq C(0,2)$ は零ホモローグでない（$n(\Gamma,0)=1$, $0\notin U$）。$\Gamma\defeq C(0,2)-C(0,\frac32)$（内側を逆向き）は零ホモローグ：$|a|\le1$ では $1-1=0$、$|a|\ge3$ では $0-0=0$。
:::

::: lemma 曲線の像は内点をもたない {#cx:curve-image-null keywords="the trace of a piecewise C^1 curve has measure zero, hence empty interior" index=""}
サイクル $\Gamma$ の像 $\Gamma^{*}$ は測度 $0$ で、内点をもたない。
:::

::: proof
$C^{1}$ 級の 1 区間 $\gamma\colon[c,d]\to\C$ について、$M\defeq\max|\gamma'|$, $\ell\defeq d-c$ とおく。$[c,d]$ を $N$ 等分すると、各小区間の像は、平均値の不等式（実部・虚部ごと、\ref{cx:complex-integral-inequality} と $\gamma(t)-\gamma(s)=\int_{s}^{t}\gamma'$）から、中心 $\gamma(t_{k})$、一辺 $\frac{2M\ell}{N}$ の正方形に入る。正方形の面積の和は $N\cdot\frac{4M^{2}\ell^{2}}{N^{2}}\to0$。よって像は測度 $0$（\ref{calc:measure-zero-rn}）。有限個の和も測度 $0$（\ref{calc:measure-zero-rn-properties.2}）。内点があれば正の面積の正方形を含み、\ref{calc:measure-zero-rn-properties.3} に反する。
:::

::: theorem ホモロジー版のコーシーの定理 {#cx:cauchy-homology keywords="homology version of Cauchy's theorem and integral formula: if Gamma is homologous to zero in U then int_Gamma f = 0 and n(Gamma,z) f(z) = (1/2 pi i) int_Gamma f(w)/(w-z) dw" index="ホモロジー版のコーシーの定理|ほもろじーばんのこーしーのていり, 一般のコーシーの定理|いっぱんのこーしーのていり" refname="ホモロジー版のコーシーの定理"}
$U\subset\C$ を開集合、$f$ を $U$ で正則、$\Gamma$ を $U$ で零ホモローグなサイクルとする。このとき
1. $z\in U\setminus\Gamma^{*}$ について $\displaystyle n(\Gamma,z)f(z)=\frac{1}{2\pi i}\int_{\Gamma}\frac{f(w)}{w-z}\,dw$。
2. $\displaystyle\int_{\Gamma}f(w)\,dw=0$。
:::

::: intuition
証明の要は、二つの関数 $h(z)=\int_{\Gamma}\frac{f(z)-f(w)}{z-w}dw$（$U$ の上で定義される）と $h_{1}(z)=\int_{\Gamma}\frac{f(w)}{w-z}dw$（回転数が $0$ の点の上で定義される）が、共通の定義域で一致し、つなぐと整関数になること。零ホモローグの仮定は、二つの定義域を合わせると平面全体になることを保証する。あとは無限遠で $0$ になる整関数は $0$ という、リウヴィルの定理だけである。
:::

::: proof
**Step 1（差分商の連続性）.** $U\times U$ 上の関数 $g$ を $g(z,w)\defeq\frac{f(z)-f(w)}{z-w}$（$z\neq w$）、$g(w,w)\defeq f'(w)$ と定める。$g$ は $U\times U$ で連続である：$z_{0}\neq w_{0}$ の近くでは明らか。$(w_{0},w_{0})$ では、$D(w_{0},\rho)\subset U$ をとると、$z,w\in D(w_{0},\rho)$ について
$$
g(z,w)=\int_{0}^{1}f'\bigl(w+t(z-w)\bigr)\,dt
$$
（$z\neq w$ なら、$t\mapsto f(w+t(z-w))$ の微分は $f'(w+t(z-w))(z-w)$（\ref{cx:chain-rule-curve}）なので微分積分学の基本定理から。$z=w$ なら両辺 $f'(w)$）。$f'$ は連続（\ref{cx:holomorphic-analytic}）なので、被積分関数は $(z,w,t)$ の連続関数で、\ref{calc:differentiation-under-integral.1}（実部・虚部ごと）から $g$ は連続。

**Step 2（$h$ は $U$ で正則）.** $h(z)\defeq\int_{\Gamma}g(z,w)\,dw$（$z\in U$）とおく。$\Gamma^{*}$ はコンパクトで $g$ は連続なので、$h$ は連続（パラメータ積分の連続性）。三角形 $\Delta\subset U$ について、$\partial\Delta$ と $\Gamma$ の各曲線をパラメータで書くと、$\int_{\partial\Delta}h(z)\,dz$ は長方形上の連続関数の累次積分の有限和になり、\ref{calc:fubini-continuous} から順序を交換できて
$$
\int_{\partial\Delta}h(z)\,dz=\int_{\Gamma}\Bigl(\int_{\partial\Delta}g(z,w)\,dz\Bigr)dw.
$$
各 $w$ について $z\mapsto g(z,w)$ は $U\setminus\{w\}$ で正則で、$(z-w)g(z,w)=f(z)-f(w)\to0$（$z\to w$）なので除去可能特異点定理から $U$ で正則（値 $g(w,w)=f'(w)$ と一致）。グルサの定理から内側の積分は $0$。モレラの定理から $h$ は $U$ で正則。

**Step 3（つなぎ合わせ）.** $U_{1}\defeq\{z\in\C\setminus\Gamma^{*}\mid n(\Gamma,z)=0\}$ とおく。$U_{1}$ は開集合（\ref{cx:winding-number-properties.2}、$\C\setminus\Gamma^{*}$ は開）。零ホモローグの仮定から $\C\setminus U\subset U_{1}$（$\Gamma^{*}\subset U$ なので $\C\setminus U$ の点は $\Gamma^{*}$ にない）、すなわち $U\cup U_{1}=\C$。$U_{1}$ 上で $h_{1}(z)\defeq\int_{\Gamma}\frac{f(w)}{w-z}dw$ は正則（\ref{cx:cauchy-type-integral}）。$z\in U\setminus\Gamma^{*}$ では
$$
h(z)=\int_{\Gamma}\frac{f(w)-f(z)}{w-z}dw=h_{1}(z)-2\pi i\,n(\Gamma,z)f(z),
\label{cx:eq-dixon}
$$
とくに $z\in U\cap U_{1}$ では $h(z)=h_{1}(z)$。よって $H\defeq h$（$U$ 上）、$H\defeq h_{1}$（$U_{1}$ 上）は矛盾なく定まる整関数である。

**Step 4（$H\equiv0$）.** $\Gamma^{*}\subset\overline{D}(0,R_{0})$ とすると、\ref{cx:winding-number-properties.3} から $|z|>R_{0}$ は $U_{1}$ に入り、$|H(z)|=|h_{1}(z)|\le\frac{\max_{\Gamma^{*}}|f|\cdot L(\Gamma)}{|z|-R_{0}}\to0$（$|z|\to\infty$）。とくに $H$ は有界（$|z|\le R$ では連続性から）で、リウヴィルの定理から定数、その定数は $0$。

**Step 5（1）.** $z\in U\setminus\Gamma^{*}$ では $h(z)=H(z)=0$ なので、\eqref{cx:eq-dixon} から 1。

**Step 6（2）.** \ref{cx:curve-image-null} から $U\setminus\Gamma^{*}\neq\varnothing$（$U\neq\varnothing$ としてよい）。$z_{0}\in U\setminus\Gamma^{*}$ をとり、$F(w)\defeq(w-z_{0})f(w)$ に 1 を使うと $0=n(\Gamma,z_{0})F(z_{0})=\frac{1}{2\pi i}\int_{\Gamma}f(w)\,dw$。

::: hypcheck
- **前提「零ホモローグ」**：Step 3 の $U\cup U_{1}=\C$ に使った。外せない：$U=\C\setminus\{0\}$, $\Gamma=C(0,1)$, $f=\frac1z$ では積分は $2\pi i$。
- **前提「$f$ は $U$ で正則」**：Step 1（$f'$ の連続性）と Step 2（$g(\cdot,w)$ の正則性）に使った。
- Step 2 の順序交換は、連続関数の累次積分（リーマン積分）で済んでいる。
- 選択公理は使っていない。
:::
:::

::: supplement
**歴史.** この証明は J. D. Dixon の 1971 年の短い論文による。コーシーの定理を「零ホモローグ」という条件で述べる形は、アールフォースの教科書『Complex Analysis』で採用されている。ここで述べた形は、「$U$ の外の点のまわりを回らない」という条件だけを使い、曲線がホモトピーで縮むことは使わない。

**高い視点.** 回転数は、サイクル $\Gamma$ が定める $\C\setminus\{a\}$ の 1 次ホモロジー類（$H_{1}(\C\setminus\{a\})\cong\mathbb{Z}$）であり、零ホモローグはその類が $U$ の 1 次ホモロジーで $0$ であることに対応する（平面の開集合 $U$ では、$H_{1}(U)$ の類が $U$ の外の各点のまわりの回転数で判定できることが知られている。アレクサンダー双対性の 2 次元の場合にあたる。未収録）。積分 $\int_{\Gamma}f\,dz$ は、閉 1 形式 $f\,dz$ とホモロジー類の対で、コーシーの定理は「正則関数の微分形式 $f\,dz$ は閉形式である」ことと同じ内容である。
:::

::: corollary ホモローグなサイクルの積分 {#cx:homologous-cycles keywords="integrals of a holomorphic function over homologous cycles coincide; deformation of contours" index="積分路の変形|せきぶんろのへんけい"}
$\Gamma_{1},\Gamma_{2}$ が $U$ でホモローグ（$\Gamma_{1}-\Gamma_{2}$ が零ホモローグ）なら、$U$ で正則な $f$ について $\int_{\Gamma_{1}}f=\int_{\Gamma_{2}}f$。
:::

::: proof
$\Gamma_{1}-\Gamma_{2}$（$\Gamma_{2}$ の曲線を逆向きにして加えたサイクル）に \ref{cx:cauchy-homology.2} を使い、\ref{cx:contour-integral-basic.3} で逆向きの積分を書き直す。
:::

::: corollary 一般のコーシーの積分公式（導関数） {#cx:cauchy-formula-general keywords="n(Gamma,z) f^(k)(z) = (k!/2 pi i) int_Gamma f(w)/(w-z)^{k+1 refname="一般のコーシーの積分公式"} dw for Gamma homologous to zero" index=""}
\ref{cx:cauchy-homology} の状況で、$z\in U\setminus\Gamma^{*}$ と $k\ge0$ について
$$
n(\Gamma,z)f^{(k)}(z)=\frac{k!}{2\pi i}\int_{\Gamma}\frac{f(w)}{(w-z)^{k+1}}dw.
$$
:::

::: proof
$z$ を含む $U\setminus\Gamma^{*}$ の連結成分 $V$ の上で $n(\Gamma,\cdot)=n$ は定数（\ref{cx:winding-number-properties.2}）。$V$ 上で $nf(z)=\frac{1}{2\pi i}\int_{\Gamma}\frac{f(w)}{w-z}dw$ の両辺を $k$ 回微分する。右辺の導関数は \ref{cx:cauchy-type-integral} の公式で与えられる。
:::

## 単連結領域 {#cx:sec-wn-simply-connected}

::: theorem 単連結領域では回転数が消える {#cx:simply-connected-homologous keywords="in a simply connected domain every cycle is homologous to zero; Cauchy's theorem for simply connected domains" index="単連結領域|たんれんけつりょういき, コーシーの定理（単連結領域）|こーしーのていりたんれんけつりょういき"}
$U$ を単連結な領域とする。$U$ 内の任意の閉曲線 $\gamma$ と $a\notin U$ について $n(\gamma,a)=0$。したがって $U$ 内のすべてのサイクルは零ホモローグで、$U$ で正則な $f$ について $\oint_{\gamma}f\,dz=0$、$f$ は $U$ で原始関数をもつ。
:::

::: proof
**Step 1（ホモトピー）.** $\gamma\colon[\alpha,\beta]\to U$ を $\tau(s)=\alpha+s(\beta-\alpha)$ で $[0,1]$ からの閉道 $\gamma\circ\tau$ に直す。$U$ は単連結なので、$\gamma\circ\tau$ は基点 $z_{0}\defeq\gamma(\alpha)$ の定値道と、端点を止めたホモトピー $H\colon I\times I\to U$ で結ばれる。

**Step 2（円周への写像）.** $r(z)\defeq\frac{z-a}{|z-a|}$ は $\C\setminus\{a\}\to S^{1}$ の連続写像で、$U\subset\C\setminus\{a\}$。$e^{-i\theta_{0}}r\circ H$（$\theta_{0}$ は $r(z_{0})=e^{i\theta_{0}}$ となる実数）は、基点 $1$ の閉道 $e^{-i\theta_{0}}\sigma$（$\sigma=r\circ\gamma\circ\tau$）と定値道を結ぶ端点を止めたホモトピーである。

**Step 3（写像度）.** 円周の基本群の同型 \tref{at:fundamental-group-circle} から、$e^{-i\theta_{0}}\sigma$ の写像度は定値道の写像度 $0$ に等しい。回転 $e^{-i\theta_{0}}$ は持ち上げを定数 $-\frac{\theta_{0}}{2\pi}$ だけずらすだけなので、$\deg\sigma=\deg(e^{-i\theta_{0}}\sigma)=0$。\ref{cx:winding-degree} から $n(\gamma,a)=\deg\sigma=0$。

**Step 4.** サイクルは閉曲線の和なので回転数は $0$ の和。\ref{cx:cauchy-homology} から積分は $0$、\ref{cx:primitive-existence} から原始関数が存在する。

::: hypcheck
- **前提「単連結」**：Step 1 で使った。$\C\setminus\{0\}$ は単連結でなく、$C(0,1)$ の回転数は $1$。
- 逆に、すべての閉曲線の外の点のまわりの回転数が $0$ になる領域は単連結である。これは \ref{cx:page-riemann-mapping} で、リーマンの写像定理を経由して示す（複素解析の結果を使った位相的な主張の証明になる）。
:::
:::

::: corollary 正則な対数と冪根 {#cx:holomorphic-log keywords="a nonvanishing holomorphic function on a simply connected domain has a holomorphic logarithm and holomorphic n-th roots" index="正則な対数|せいそくなたいすう, 対数の分枝|たいすうのぶんし"}
$U$ を単連結な領域、$f$ を $U$ で正則で零点をもたないとする。
1. $U$ で正則な $L$ で $e^{L}=f$ となるもの（$f$ の**対数の分枝**）がある。二つの分枝の差は $2\pi i\mathbb{Z}$ の定数。
2. 各 $n\ge1$ について、$U$ で正則な $g$ で $g^{n}=f$ となるものがある。
:::

::: proof
**Step 1.** $\frac{f'}{f}$ は $U$ で正則なので、\ref{cx:simply-connected-homologous} から原始関数 $F$ をもつ。$z_{0}\in U$ と、$e^{c}=f(z_{0})$ となる $c$（\ref{cx:exp.4}）をとり、$L\defeq F-F(z_{0})+c$ とおく。

**Step 2.** $\phi\defeq fe^{-L}$ は $\phi'=f'e^{-L}-fL'e^{-L}=e^{-L}(f'-f\cdot\frac{f'}{f})=0$ なので、$U$ は領域であることから定数（\ref{cx:cr-consequences.2}）で、$\phi(z_{0})=f(z_{0})e^{-c}=1$。よって $e^{L}=f$。二つの分枝 $L_{1},L_{2}$ について $e^{L_{1}-L_{2}}=1$ なので $L_{1}-L_{2}$ は $2\pi i\mathbb{Z}$ に値をとる連続関数で、$U$ の連結性から定数。

**Step 3（2）.** $g\defeq e^{L/n}$ とすれば $g^{n}=e^{L}=f$。
:::

::: example
$\C^{-}$ は単連結（$1$ に関して星形なので可縮）で、$f(z)=z$ の対数の分枝のうち $L(1)=0$ となるものは $\operatorname{Log}$ である（一意性）。一方 $\C\setminus\{0\}$ では $z$ の連続な平方根すら存在しない（\ref{cx:no-continuous-sqrt}）ので、単連結性の仮定は外せない。単連結でない領域でも、対数が存在するかどうかは関数による。対数 $L$ があれば $\frac{f'}{f}=L'$ は原始関数をもつので、すべての閉曲線 $\gamma$ で $\oint_{\gamma}\frac{f'}{f}dz=0$。逆にこれが成り立てば Step 1・2 と同じ構成で対数が作れる。$U=\C\setminus\{0\}$ では、$f(z)=z^{2}$ は $\oint_{|z|=1}\frac{2z}{z^{2}}dz=4\pi i\neq0$ なので対数をもたず、$f(z)=e^{z}$ は対数 $L=z$ をもつ。
:::

## 問題 {#cx:sec-wn-problems}

::: problem {#cx:prob-wn-compute}
$\gamma(t)=e^{2it}$（$0\le t\le2\pi$）と $\delta(t)=2\cos t+i\sin t$（$0\le t\le2\pi$、楕円）について、$n(\gamma,0)$, $n(\gamma,2)$, $n(\delta,0)$, $n(\delta,1)$, $n(\delta,3)$ を求めよ。
:::

::: solution
$\gamma$：$\frac{1}{2\pi i}\int_{0}^{2\pi}\frac{2ie^{2it}}{e^{2it}}dt=2$。$2$ は非有界成分にあるので $0$。$\delta$：$0$ と $1$ は楕円の内部で、楕円の内部は連結（凸）なので両者の回転数は等しい（\ref{cx:winding-number-properties.2}）。$H(s,t)\defeq s\delta(t)+(1-s)e^{it}=(1+s)\cos t+i\sin t$ は $0$ を通らず、$t=0$ では正の実数 $1+s$ なので、$\frac{H}{|H|}$ は基点 $1$ を止めた閉道のホモトピーである。\ref{cx:winding-degree} と円周の基本群の同型（写像度はホモトピー類で決まる）から $n(\delta,0)=n(C(0,1),0)=1$。$n(\delta,1)=1$、$3$ は外部で $0$。
:::

::: problem {#cx:prob-wn-annulus}
$U=\C\setminus\{-1,1\}$ と $f(z)=\frac{1}{z^{2}-1}$ について、$\oint_{|z|=2}f\,dz$ と、8 の字型の閉曲線（$1$ のまわりを正の向きに、$-1$ のまわりを負の向きに 1 回ずつ回る）に沿った積分を求めよ。
:::

::: solution
$f=\frac12\bigl(\frac{1}{z-1}-\frac{1}{z+1}\bigr)$。閉曲線 $\Gamma$ について $\int_{\Gamma}f=\frac12\cdot2\pi i\bigl(n(\Gamma,1)-n(\Gamma,-1)\bigr)=\pi i\bigl(n(\Gamma,1)-n(\Gamma,-1)\bigr)$。円周 $|z|=2$ では $1-1=0$ なので $0$。8 の字では $1-(-1)=2$ なので $2\pi i$。
:::

::: problem {#cx:prob-wn-sqrt-branch}
$U\defeq\C\setminus[-1,1]$ で、$\sqrt{z^{2}-1}$ の正則な分枝（$g^{2}=z^{2}-1$ を満たす正則な $g$）が存在することを示せ。（$U$ は単連結でないことに注意。）
:::

::: solution
$f(z)=z^{2}-1$、$h\defeq\frac{f'}{2f}=\frac12\bigl(\frac{1}{z-1}+\frac{1}{z+1}\bigr)$ とおく。

**Step 1（周期）.** $U$ 内の閉曲線 $\gamma$ について $\oint_{\gamma}h=\pi i\bigl(n(\gamma,1)+n(\gamma,-1)\bigr)$。$[-1,1]$ は連結で $\gamma^{*}$ と交わらないので、$\pm1$ は $\C\setminus\gamma^{*}$ の同じ連結成分にあり、$n(\gamma,1)=n(\gamma,-1)$。よって $\oint_{\gamma}h\in2\pi i\mathbb{Z}$。

**Step 2（構成）.** $z_{0}\defeq2$ と $c^{2}=f(2)=3$ となる $c=\sqrt3$ を固定する。$z\in U$ について、$z_{0}$ から $z$ への $U$ 内の曲線 $\sigma$（\ref{vec:polygonal-connected}）をとり $g(z)\defeq c\,e^{\int_{\sigma}h}$ とおく。別の曲線 $\sigma'$ では指数が $\oint_{\sigma-\sigma'}h\in2\pi i\mathbb{Z}$ だけずれるだけなので、$g$ は曲線によらない。

**Step 3（正則性）.** $z\in U$ と $D(z,r)\subset U$ をとる。円板上で $h$ は原始関数 $H$ をもち（\ref{cx:disk-primitive}）、$w\in D(z,r)$ への曲線として $\sigma$ に線分 $[z,w]$ をつなげると $g(w)=g(z)e^{H(w)-H(z)}$。よって $g$ は正則で $g'=gH'=gh$。

**Step 4.** $\bigl(\frac{g^{2}}{f}\bigr)'=\frac{2gg'f-g^{2}f'}{f^{2}}=\frac{g^{2}(2hf-f')}{f^{2}}=0$ なので $\frac{g^{2}}{f}$ は定数で、$z_{0}$ では $\frac{c^{2}}{f(2)}=1$。よって $g^{2}=z^{2}-1$。（$|z|\to\infty$ で $g(z)\approx\pm z$ となる分枝である。）
:::
