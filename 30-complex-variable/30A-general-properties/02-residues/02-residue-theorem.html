# 留数定理と偏角の原理 {#cx:page-residue-theorem keywords="residue, computing residues at simple and higher order poles, residue theorem, argument principle, logarithmic derivative, counting zeros and poles, generalized argument principle, Rouche's theorem, open mapping theorem, local mapping degree, local inverse of a holomorphic function, injective holomorphic maps have nonzero derivative"}

孤立特異点 $a$ のまわりのローラン展開のうち、閉曲線に沿った積分で生き残るのは $\frac{1}{z-a}$ の項だけである（$(z-a)^{n}$, $n\neq-1$ は原始関数をもつ）。その係数を**留数**という。**留数定理**は、閉曲線に沿った積分が、内部の特異点の留数の和に $2\pi i$ を掛けたものに等しいことを述べる。これを対数微分 $\frac{f'}{f}$ に適用すると、閉曲線の内部の零点と極の個数が積分で数えられる（**偏角の原理**）。その帰結として、関数を少し動かしても零点の個数は変わらないこと（**ルーシェの定理**）、定数でない正則関数は開集合を開集合に写すこと（**開写像定理**）、微分が $0$ でない点の近くでは正則な逆関数があることを示す。

## 記法と定義の確認 {#cx:sec-rt-notation}

::: notation
- ローラン展開 \ref{cx:laurent}、孤立特異点・主要部・極の\term[位数]{cx:isolated-singularity} \ref{cx:isolated-singularity}、極の特徴づけ \ref{cx:pole-characterization}、有理型関数 \ref{cx:meromorphic}、零点の\term[位数]{cx:zero-order} \ref{cx:zero-order}、除去可能特異点定理 \tref{cx:removable-singularity}。
- 回転数とその性質 \ref{cx:winding-number}, \ref{cx:winding-number-properties}、サイクルと零ホモローグ \ref{cx:cycle}、ホモロジー版のコーシーの定理 \tref{cx:cauchy-homology}、円周上の冪の積分 \ref{cx:circle-integral-powers}、一様収束と線積分 \ref{cx:uniform-limit-integral}、線積分の基本定理 \tref{cx:fundamental-theorem-contour}、曲線との合成の微分 \ref{cx:chain-rule-curve}。
- 対数の主値 \ref{cx:principal-log}, \ref{cx:log-holomorphic}、一致の定理 \tref{cx:identity-theorem}、最大値原理 \tref{cx:maximum-principle}。
- $f$ が $a$ で有理型（正則または極）で $f\not\equiv0$ のとき、$\operatorname{ord}_{a}f$ を、零点ならその位数、極なら位数のマイナス、それ以外は $0$ と定める。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 留数 {#cx:sec-rt-residue}

::: definition 留数 {#cx:residue keywords="residue of f at an isolated singularity a: the coefficient c_{-1} of the Laurent expansion; Res(f,a) = (1/2 pi i) int over a small circle" index="留数|りゅうすう"}
$a$ を $f$ の孤立特異点とし、$D^{*}(a,R)$ でのローラン展開を $\sum c_{n}(z-a)^{n}$ とする。$\operatorname{Res}(f,a)\defeq c_{-1}$ を $f$ の $a$ における**留数**という。\ref{cx:laurent} の係数の公式から、$0<\rho<R$ について
$$
\operatorname{Res}(f,a)=\frac{1}{2\pi i}\oint_{|z-a|=\rho}f(z)\,dz.
$$
:::

::: proposition 留数の計算法 {#cx:residue-computation keywords="residue at a simple pole lim (z-a) f(z); g/h with h having a simple zero: g(a)/h'(a); pole of order m: derivative formula; residue of f'/f" index="留数の計算|りゅうすうのけいさん"}
1. $a$ が高々 1 位の極なら $\operatorname{Res}(f,a)=\lim_{z\to a}(z-a)f(z)$。
2. $g,h$ が $a$ の近くで正則、$h(a)=0\neq h'(a)$ なら $\operatorname{Res}\bigl(\frac gh,a\bigr)=\dfrac{g(a)}{h'(a)}$。
3. $a$ が高々 $m$ 位の極なら
$$
\operatorname{Res}(f,a)=\frac{1}{(m-1)!}\lim_{z\to a}\frac{d^{m-1}}{dz^{m-1}}\bigl((z-a)^{m}f(z)\bigr).
$$
4. $f\not\equiv0$ が $a$ で有理型なら、$\frac{f'}{f}$ は $a$ で高々 1 位の極をもち、$\operatorname{Res}\bigl(\frac{f'}{f},a\bigr)=\operatorname{ord}_{a}f$。
:::

::: proof
**3（1 を含む）.** $(z-a)^{m}f(z)=\sum_{n\ge-m}c_{n}(z-a)^{n+m}$ は $a$ の近くで冪級数（除去可能）で、$(z-a)^{m-1}$ の係数が $c_{-1}$。テイラー係数の公式（\ref{cx:power-series-holomorphic.3}）から主張。$m=1$ が 1。

**2.** $h(z)=(z-a)k(z)$、$k(a)=h'(a)\neq0$（\ref{cx:zero-order} の証明と同じく、テイラー展開から）。$(z-a)\frac{g}{h}=\frac gk\to\frac{g(a)}{h'(a)}$ で、$a$ は高々 1 位の極なので 1 から。

**4.** $m\defeq\operatorname{ord}_{a}f$ とすると、零点・極・正則で零点でない場合のいずれでも $f(z)=(z-a)^{m}g(z)$、$g$ は $a$ の近くで正則で $g(a)\neq0$（\ref{cx:zero-order}, \ref{cx:pole-characterization}）。$\frac{f'}{f}=\frac{m}{z-a}+\frac{g'}{g}$ で、$\frac{g'}{g}$ は $a$ の近くで正則。
:::

::: example
1. $\operatorname{Res}\bigl(\frac{1}{z^{4}+1},e^{i\pi/4}\bigr)=\frac{1}{4z^{3}}\big|_{z=e^{i\pi/4}}=\frac{e^{-3\pi i/4}}{4}=-\frac{e^{i\pi/4}}{4}$（2 を使う。$z^{4}=-1$ から $\frac{1}{z^{3}}=-z$）。
2. $\frac{e^{z}}{(z^{2}+1)^{2}}$ は $i$ で 2 位の極。3 で $m=2$：$\frac{d}{dz}\frac{e^{z}}{(z+i)^{2}}\big|_{z=i}=\frac{e^{i}}{(2i)^{2}}-\frac{2e^{i}}{(2i)^{3}}=-\frac{e^{i}}{4}-\frac{ie^{i}}{4}$。
3. $\frac{\pi\cot\pi z}{z^{2}}$ の $0$ での留数：$\pi\cot\pi z=\frac1z-\frac{\pi^{2}z}{3}-\cdots$ なので $\frac{\pi\cot\pi z}{z^{2}}$ の $z^{-1}$ の係数は $-\frac{\pi^{2}}{3}$（\ref{cx:page-definite-integrals} で $\sum\frac{1}{n^{2}}$ の計算に使う）。
:::

::: theorem 留数定理 {#cx:residue-theorem keywords="residue theorem: int_Gamma f = 2 pi i sum n(Gamma,a) Res(f,a) for f holomorphic outside a discrete set and Gamma homologous to zero" index="留数定理|りゅうすうていり" refname="留数定理"}
$U\subset\C$ を開集合、$S\subset U$ を $U$ の中に集積点をもたない集合、$f$ を $U\setminus S$ で正則とする。$U\setminus S$ 内のサイクル $\Gamma$ が $U$ で零ホモローグなら、$n(\Gamma,a)\neq0$ となる $a\in S$ は有限個で、
$$
\int_{\Gamma}f(z)\,dz=2\pi i\sum_{a\in S}n(\Gamma,a)\operatorname{Res}(f,a).
$$
:::

::: intuition
閉曲線を、各特異点のまわりの小さな円周の和（回転数の分だけ）に縮めてしまう、というのが直感である。小さな円周の積分は留数そのもので、残りの部分は正則なので積分に寄与しない。証明では、主要部を引き算して正則な関数に直すことでこれを実現する。
:::

::: proof
**Step 1（有限性）.** $K\defeq\Gamma^{*}\cup\{z\notin\Gamma^{*}\mid n(\Gamma,z)\neq0\}$ とおく。$\C\setminus K=\{z\notin\Gamma^{*}\mid n(\Gamma,z)=0\}$ は開集合（\ref{cx:winding-number-properties.2}）なので $K$ は閉集合で、同じく 3 から有界、よってコンパクト。零ホモローグの仮定から $K\subset U$。$S$ は $U$ の中に集積点をもたないので、各 $z\in K$ に $S$ の点を高々 1 つしか含まない近傍があり、有限個で $K$ を覆えるので $S\cap K$ は有限集合 $\{a_{1},\dots,a_{k}\}$。$n(\Gamma,a)\neq0$ となる $a\in S$ はこの中にある。

**Step 2（主要部を引く）.** $a_{j}$ での主要部を $P_{j}(z)\defeq\sum_{n\ge1}c^{(j)}_{-n}(z-a_{j})^{-n}$ とする。これは $w=\frac{1}{z-a_{j}}$ の冪級数で、収束半径は $\infty$（\ref{cx:laurent} の Step 5 で $r=0$）なので、$P_{j}$ は $\C\setminus\{a_{j}\}$ で正則。$g\defeq f-\sum_{j}P_{j}$ は各 $a_{j}$ で除去可能（主要部が消える）なので、$U'\defeq U\setminus(S\setminus\{a_{1},\dots,a_{k}\})$ で正則に延びる。$S$ は $U$ の中で閉（集積点をもたない）なので $U'$ は開集合。

**Step 3（積分）.** $\Gamma$ は $U'$ で零ホモローグ：$U'$ の外の点は $U$ の外にあるか $S\setminus\{a_{j}\}$ の点で、前者は仮定から、後者は Step 1（$K$ の外）から回転数 $0$。\ref{cx:cauchy-homology} から $\int_{\Gamma}g=0$。

**Step 4（主要部の積分）.** $\Gamma^{*}$ は $a_{j}$ から正の距離 $\rho$ にあり、$P_{j}$ の級数は $|z-a_{j}|\ge\rho$ で一様収束するので項別に積分できる。$n\ge2$ なら $(z-a_{j})^{-n}$ は $\C\setminus\{a_{j}\}$ で原始関数をもつので積分は $0$（\ref{cx:fundamental-theorem-contour}）。$n=1$ の項は $c^{(j)}_{-1}\cdot2\pi i\,n(\Gamma,a_{j})$。よって $\int_{\Gamma}f=\sum_{j}\int_{\Gamma}P_{j}=2\pi i\sum_{j}n(\Gamma,a_{j})\operatorname{Res}(f,a_{j})$。

::: hypcheck
- **前提「零ホモローグ」**：Step 1（$K\subset U$）と Step 3 で使った。
- **前提「$S$ は $U$ の中に集積点をもたない」**：Step 1 の有限性と Step 2 の $U'$ が開であることに使った。$U$ の境界に集積してもよい（例：$\frac{1}{\sin(1/z)}$ の極 $\frac{1}{n\pi}$ は $0$ に集積するが、$U=\C\setminus\{0\}$ ではよい）。
- **$\Gamma^{*}\cap S=\varnothing$**：被積分関数が $\Gamma^{*}$ 上で定義されるために必要。
:::
:::

## 偏角の原理 {#cx:sec-rt-argument}

::: theorem 偏角の原理 {#cx:argument-principle keywords="argument principle: (1/2 pi i) int_Gamma f'/f = sum n(Gamma,a) ord_a f = winding number of f o Gamma around 0; generalized version with a weight g" index="偏角の原理|へんかくのげんり, 対数微分|たいすうびぶん" refname="偏角の原理"}
$U$ を開集合、$f\not\equiv0$ を $U$ で有理型（$U$ の各連結成分で恒等的に $0$ でない）、$\Gamma$ を $U$ で零ホモローグで、$\Gamma^{*}$ 上に $f$ の零点も極もないサイクルとする。$U$ で正則な $g$ について
$$
\frac{1}{2\pi i}\int_{\Gamma}g(z)\frac{f'(z)}{f(z)}dz=\sum_{a}n(\Gamma,a)\operatorname{ord}_{a}(f)\,g(a)
$$
（和は $f$ の零点と極にわたり、有限和）。とくに $g=1$ とし、$\Gamma$ が $n(\Gamma,z)\in\{0,1\}$ を満たすなら、左辺は $\{n(\Gamma,\cdot)=1\}$ の中の零点の個数 $Z$ から極の個数 $P$ を引いたもの（重複度込み）である。また左辺（$g=1$）は像のサイクル $f\circ\Gamma$ の $0$ のまわりの回転数 $n(f\circ\Gamma,0)$ に等しい。
:::

::: proof
**Step 1.** 零点と極の集合 $S$ は $U$ の中に集積点をもたない（一致の定理と極の定義から）。$g\frac{f'}{f}$ は $U\setminus S$ で正則で、$a\in S$ での留数は \ref{cx:residue-computation.4} の証明から $g(a)\operatorname{ord}_{a}f$（$g\frac{f'}{f}=\frac{mg}{z-a}+g\frac{h'}{h}$ で、$\frac{g(z)}{z-a}$ の留数は $g(a)$）。留数定理から主張。

**Step 2（像の回転数）.** $\gamma$ を $\Gamma$ の曲線とすると、$f\circ\gamma$ は区分的 $C^{1}$ の閉曲線で $(f\circ\gamma)'=f'(\gamma)\gamma'$（\ref{cx:chain-rule-curve}）。よって
$$
\oint_{f\circ\gamma}\frac{dw}{w}=\int\frac{f'(\gamma(t))\gamma'(t)}{f(\gamma(t))}dt=\oint_{\gamma}\frac{f'}{f}dz.
$$
:::

::: intuition
$\frac{f'}{f}=(\log f)'$ なので、$\Gamma$ に沿って積分すると $\log f$ の増分、つまり $\log|f|$ の増分（閉曲線なので $0$）と $i\arg f$ の増分になる。$f$ の偏角が一周で何回 $2\pi$ だけ増えるかが、内部の零点の数から極の数を引いたものに等しい。名前の由来はここにある。
:::

::: theorem ルーシェの定理 {#cx:rouche keywords="Rouche's theorem: if |f - g| < |f| on the curve then f and g have the same number of zeros inside" index="ルーシェの定理|るーしぇのていり" refname="ルーシェの定理"}
$U$ を領域、$f,g$ を $U$ で正則、$\Gamma$ を $U$ で零ホモローグなサイクルで $n(\Gamma,z)\in\{0,1\}$（$z\notin\Gamma^{*}$）を満たすものとする。$\Gamma^{*}$ 上で $|f-g|<|f|$ なら、$f$ と $g$ は $\{n(\Gamma,\cdot)=1\}$ の中に同じ個数の零点（重複度込み）をもつ。
:::

::: proof
**Step 1.** $\Gamma^{*}$ 上 $|f|>|f-g|\ge0$ なので $f\neq0$、また $g=0$ なら $|f|<|f|$ となるので $g\neq0$。$V\defeq\{z\in U\mid f(z)\neq0,\ |g(z)-f(z)|<|f(z)|\}$ は開集合で $\Gamma^{*}\subset V$。$V$ 上で $h\defeq\frac gf$ は正則で $|h-1|<1$、すなわち $h(V)\subset D(1,1)\subset\C^{-}$。

**Step 2.** $\operatorname{Log}\circ h$ は $V$ で正則で導関数は $\frac{h'}{h}=\frac{g'}{g}-\frac{f'}{f}$（\ref{cx:log-holomorphic} と連鎖律）。$\Gamma$ の各閉曲線は $V$ の中にあるので、線積分の基本定理から $\int_{\Gamma}\bigl(\frac{g'}{g}-\frac{f'}{f}\bigr)=0$。

**Step 3.** $f,g$ は $\Gamma^{*}$ 上で $0$ でないので恒等的に $0$ ではなく、$U$ は連結なので有理型関数として偏角の原理（$g=1$、極はない）が使える。両者の零点の個数は等しい。

::: hypcheck
- **前提「$\Gamma^{*}$ 上で $|f-g|<|f|$」**：Step 1 で $h$ の値を $\C^{-}$ に閉じ込めるのに使った。等号を許すと成り立たない（$f=z$, $g=z-1$, $\Gamma=C(0,1)$ では $|f-g|=1=|f|$ で、$f$ は円板の中に零点を 1 個もつが、$g$ の零点 $1$ は円周上にあり中にはない）。
- **$n(\Gamma,\cdot)\in\{0,1\}$**：零点の個数として解釈するために使った。一般には $\sum n(\Gamma,a)\operatorname{ord}_{a}$ が一致する。
:::
:::

::: example
1. $z^{4}-5z+1$ は $|z|<1$ にちょうど 1 個、$|z|<2$ に 4 個の零点をもつ。$|z|=1$ では $f=-5z$ と比べて $|z^{4}+1|\le2<5$。$|z|=2$ では $f=z^{4}$ と比べて $|-5z+1|\le11<16$。よって円環 $1<|z|<2$ に 3 個（$|z|=1$ 上には零点がない：$|z^{4}+1|<|5z|$）。数値的には零点の絶対値は約 $0.200$, $1.637$, $1.746$, $1.746$ である。
2. （代数学の基本定理の別証明）$d$ 次多項式 $P(z)=z^{d}+\cdots$ は、$R$ が十分大きい $|z|=R$ で $|P(z)-z^{d}|<|z|^{d}$ なので、$D(0,R)$ に $z^{d}$ と同じく $d$ 個の零点をもつ。
:::

## 開写像定理と局所的な逆関数 {#cx:sec-rt-open-mapping}

::: theorem 局所的な写像の様子 {#cx:local-mapping keywords="if f - w0 has a zero of order m at z0 then for w near w0 the equation f(z) = w has exactly m solutions near z0, all simple for w != w0" index="局所写像度|きょくしょしゃぞうど"}
$D$ を領域、$f$ を $D$ で正則で定数でないとし、$z_{0}\in D$、$w_{0}\defeq f(z_{0})$、$m\defeq\operatorname{ord}_{z_{0}}(f-w_{0})\ge1$ とする。$r>0$ を十分小さくとると、$\delta>0$ があって、$0<|w-w_{0}|<\delta$ を満たす各 $w$ について、方程式 $f(z)=w$ は $D(z_{0},r)$ にちょうど $m$ 個の解をもち、それらはすべて単根である。
:::

::: proof
**Step 1（$r$ の選び方）.** $f-w_{0}$ の零点と $f'$ の零点は孤立している（$f$ は定数でないので $f'\not\equiv0$、\ref{cx:cr-consequences.2} と一致の定理）。$\overline{D}(z_{0},r)\subset D$ で、$0<|z-z_{0}|\le r$ に $f-w_{0}$ の零点も $f'$ の零点もないように $r$ をとる。

**Step 2（$\delta$ と個数）.** $\delta\defeq\min_{|z-z_{0}|=r}|f(z)-w_{0}|>0$（コンパクト集合上の正の連続関数の最小値）。$|w-w_{0}|<\delta$ なら、円周 $C(z_{0},r)$ 上で $|(f-w_{0})-(f-w)|=|w-w_{0}|<\delta\le|f-w_{0}|$ なので、ルーシェの定理から $f-w$ は $D(z_{0},r)$ に $f-w_{0}$ と同じく $m$ 個の零点をもつ。

**Step 3（単根）.** $w\neq w_{0}$ なら解 $z$ は $z_{0}$ と異なり、Step 1 から $f'(z)\neq0$、よって単根。したがって $m$ 個の解は相異なる。
:::

::: theorem 開写像定理 {#cx:open-mapping keywords="open mapping theorem: a nonconstant holomorphic function on a domain maps open sets to open sets" index="開写像定理|かいしゃぞうていり" refname="開写像定理"}
領域 $D$ 上の定数でない正則関数 $f$ は開写像である（$D$ の開集合の像は開集合）。
:::

::: proof
開集合 $V\subset D$ と $w_{0}=f(z_{0})$（$z_{0}\in V$）をとる。\ref{cx:local-mapping} で $r$ を $D(z_{0},r)\subset V$ となるようにさらに小さくとると、$D(w_{0},\delta)\subset f(D(z_{0},r))\subset f(V)$。
:::

::: supplement
**最大値原理の別証明.** $|f|$ が $z_{0}$ で極大なら、$f(z_{0})$ を中心とする小円板は $f$ の像に入り、その中には絶対値が $|f(z_{0})|$ より大きい点がある。よって $f$ は定数（\ref{cx:maximum-principle.1}）。

**実数との違い.** 実数値の滑らかな関数は開写像とは限らない（$x\mapsto x^{2}$ は $(-1,1)$ を $[0,1)$ に写す）。複素数の $z^{2}$ は原点の近くを「2 重に覆う」だけで、像は開集合である。
:::

::: corollary 正則関数の局所的な逆関数 {#cx:local-inverse keywords="if f'(z0) != 0 then f is injective near z0 with holomorphic inverse; an injective holomorphic function has nonvanishing derivative and a holomorphic inverse" index="逆関数定理（複素）|ぎゃくかんすうていりふくそ, 双正則|そうせいそく"}
1. $f$ が $z_{0}$ の近傍で正則で $f'(z_{0})\neq0$ なら、$z_{0}$ のある近傍 $W$ で $f$ は単射で、$f(W)$ は開集合、逆写像 $f^{-1}\colon f(W)\to W$ は正則で $(f^{-1})'(w)=\frac{1}{f'(f^{-1}(w))}$。
2. 開集合 $U$ 上の単射な正則関数 $f$ は、$U$ のすべての点で $f'\neq0$ で、$f(U)$ は開集合、逆写像は正則である（このとき $f$ は $U$ から $f(U)$ への**双正則写像**であるという）。
:::

::: proof
**Step 1（1）.** $m=1$ の場合の \ref{cx:local-mapping}：$|w-w_{0}|<\delta$ の各 $w$ に $D(z_{0},r)$ の解がちょうど 1 つ。$W\defeq D(z_{0},r)\cap f^{-1}(D(w_{0},\delta))$ は開集合で、$f|_{W}$ は $f(W)=D(w_{0},\delta)$ への全単射。逆写像 $\phi$ は連続：$W$ の開部分集合 $W'$ について $\phi^{-1}(W')=f(W')$ は、$D(z_{0},r)$ 上の定数でない正則関数 $f$ に開写像定理を使えば開集合。微分：$w\to w_{1}$ のとき $\phi(w)\to\phi(w_{1})$ で、$\frac{\phi(w)-\phi(w_{1})}{w-w_{1}}=\Bigl(\frac{f(\phi(w))-f(\phi(w_{1}))}{\phi(w)-\phi(w_{1})}\Bigr)^{-1}\to\frac{1}{f'(\phi(w_{1}))}$（$f'\neq0$ を $W$ で保つよう $r$ をとっておく）。

**Step 2（2）.** $f'(z_{0})=0$ とすると $m\ge2$ で、\ref{cx:local-mapping} から $w_{0}$ の近くの $w$ は 2 つ以上の点の像になり、単射に反する（$f$ は定数でない：単射だから。$U$ の各連結成分で考える）。よって $f'\neq0$ で、1 から各点の近くで逆写像は正則、$f(U)$ は開（開写像定理）。
:::

::: example
$e^{z}$ は $f'=e^{z}\neq0$ なので各点の近くで正則な逆関数（対数の分枝）をもつが、$\C$ 全体では単射でない。局所的に可逆であることと大域的に単射であることは別で、その違いが対数の多価性として現れる。
:::

## 問題 {#cx:sec-rt-problems}

::: problem {#cx:prob-rt-residues}
次の留数を求めよ。(a) $\operatorname{Res}\bigl(\frac{z}{\sin^{2}z},\pi\bigr)$　(b) $\operatorname{Res}\bigl(\frac{e^{z}}{z^{3}(z-1)},0\bigr)$　(c) $\operatorname{Res}\bigl(e^{1/z},0\bigr)$
:::

::: solution
(a) $w=z-\pi$ とすると $\sin z=-\sin w$、$\sin^{2}z=w^{2}(1-\frac{w^{2}}{3}+\cdots)$ なので $\frac{z}{\sin^{2}z}=\frac{\pi+w}{w^{2}}(1+\frac{w^{2}}{3}+\cdots)$、$w^{-1}$ の係数は $1$。
(b) $\frac{e^{z}}{z-1}=-(1+z+\frac{z^{2}}{2}+\cdots)(1+z+z^{2}+\cdots)$ の $z^{2}$ の係数は $-(1+1+\frac12)=-\frac52$。これが $\frac{e^{z}}{z^{3}(z-1)}$ の $z^{-1}$ の係数。
(c) $e^{1/z}=\sum\frac{z^{-n}}{n!}$ なので $1$（真性特異点でも留数は定義される）。
:::

::: problem {#cx:prob-rt-count}
$z^{5}+3z+1$ の零点のうち $|z|<1$ にあるものの個数を求めよ。
:::

::: solution
$|z|=1$ で $f=3z$ と比べると $|z^{5}+1|\le2<3=|3z|$。ルーシェの定理から $3z$ と同じく 1 個。（数値的には絶対値約 $0.332$ の実根。）
:::

::: problem {#cx:prob-rt-log-derivative}
$\displaystyle\oint_{|z|=2}\frac{z^{3}}{z^{4}-1}dz$ と $\displaystyle\oint_{|z|=2}\frac{z^{4}}{z^{4}-1}dz$ を求めよ。
:::

::: solution
$\frac{z^{3}}{z^{4}-1}=\frac14\cdot\frac{(z^{4}-1)'}{z^{4}-1}$ で、$z^{4}-1$ は $|z|<2$ に 4 個の零点をもつので、偏角の原理から $\frac14\cdot2\pi i\cdot4=2\pi i$。2 つ目は $\frac14 z\cdot\frac{(z^{4}-1)'}{z^{4}-1}$ で、一般化した偏角の原理（$g(z)=\frac z4$）から $2\pi i\cdot\frac14\sum_{\zeta^{4}=1}\zeta=0$。
:::
