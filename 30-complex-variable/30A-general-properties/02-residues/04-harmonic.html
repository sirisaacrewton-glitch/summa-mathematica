# 調和関数 {#cx:page-harmonic keywords="harmonic function, Laplace equation, real part of a holomorphic function, harmonic conjugate, harmonic functions are smooth, mean value property, maximum principle for harmonic functions, Poisson kernel, Poisson integral, Dirichlet problem on the disk, Harnack's inequality, Liouville theorem for positive harmonic functions, Schwarz reflection principle"}

ラプラス方程式 $\Delta u=u_{xx}+u_{yy}=0$ を満たす関数を**調和関数**という。平面の調和関数は、正則関数の実部とほぼ同じものである：正則関数の実部は調和で、逆に単連結な領域の調和関数は正則関数の実部になる（**調和共役**の存在）。このことから、調和関数は何回でも微分でき、平均値の性質と最大値原理を満たす。円板では、境界の円周上に与えた連続関数を境界値とする調和関数が、**ポアソン積分**によって一つだけ作れる（**ディリクレ問題**の解）。最後に、実軸上で実数値をとる正則関数を鏡像で延ばす**シュワルツの鏡像原理**を示す。

## 記法と定義の確認 {#cx:sec-hm-notation}

::: notation
- 正則関数とコーシー–リーマンの方程式 \ref{cx:holomorphic}, \ref{cx:cauchy-riemann}、正則性の判定 \ref{cx:cr-consequences}、正則関数は何回でも微分できる \ref{cx:holomorphic-analytic}、平均値の性質 \ref{cx:mean-value}、モレラの定理 \tref{cx:morera}、グルサの定理 \tref{cx:goursat}、円板上の原始関数 \ref{cx:disk-primitive}、単連結領域での原始関数 \ref{cx:simply-connected-homologous}、コーシー型積分 \ref{cx:cauchy-type-integral}、一様収束と線積分 \ref{cx:uniform-limit-integral}。
- 実関数：$C^{k}$ 級、偏微分の順序交換（シュワルツの定理）\tref{calc:schwarz-theorem}、微分が $0$ なら定数 \ref{calc:zero-derivative-constant}、偏導関数が連続なら微分可能 \ref{calc:continuous-partials-differentiable}。
- 単位円板 $\mathbb{D}\defeq D(0,1)$、単位円周 $\mathbb{T}\defeq\{|z|=1\}$。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 調和関数と調和共役 {#cx:sec-hm-conjugate}

::: definition 調和関数 {#cx:harmonic keywords="harmonic function: real C^2 function with u_xx + u_yy = 0; harmonic conjugate" index="調和関数|ちょうわかんすう, ラプラス方程式|らぷらすほうていしき, 調和共役|ちょうわきょうやく"}
開集合 $U\subset\C=\R^{2}$ 上の実数値 $C^{2}$ 級関数 $u$ が $\Delta u\defeq u_{xx}+u_{yy}=0$ を満たすとき、$u$ は**調和**であるという。$U$ で正則な $f$ について $u=\operatorname{Re}f$ となるとき、$v\defeq\operatorname{Im}f$ を $u$ の**調和共役**という。
:::

::: proposition 正則関数の実部は調和 {#cx:real-part-harmonic keywords="real and imaginary parts of a holomorphic function are harmonic and C^infinity" index=""}
$f=u+iv$ が $U$ で正則なら、$u,v$ は $C^{\infty}$ 級で調和である。
:::

::: proof
$f$ は何回でも複素微分でき（\ref{cx:holomorphic-analytic}）、$f'=u_{x}+iv_{x}=v_{y}-iu_{y}$（\ref{cx:cauchy-riemann}）。$f'$ も正則なので同じ式を $f'$ に使うと、$u,v$ の 2 階偏導関数は $f''$ の実部・虚部（の符号違い）で表され連続、帰納的に $C^{\infty}$。コーシー–リーマンの方程式 $u_{x}=v_{y}$, $u_{y}=-v_{x}$ を微分すると $u_{xx}=v_{yx}$, $u_{yy}=-v_{xy}$、シュワルツの定理から $v_{xy}=v_{yx}$ なので $\Delta u=0$。$v=\operatorname{Re}(-if)$ も同様。
:::

::: theorem 調和共役の存在 {#cx:harmonic-conjugate keywords="a harmonic function on a simply connected domain (in particular a disk) is the real part of a holomorphic function; harmonic functions are C^infinity" index="調和共役の存在|ちょうわきょうやくのそんざい"}
$U$ を単連結な領域、$u$ を $U$ で調和とする。$U$ で正則な $F$ があって $u=\operatorname{Re}F$。$F$ は純虚数の定数の差を除いて一意である。とくに、任意の開集合上の調和関数は $C^{\infty}$ 級である。
:::

::: proof
**Step 1（$g$ の正則性）.** $g\defeq u_{x}-iu_{y}$ とおく。$P\defeq u_{x}$, $Q\defeq-u_{y}$ は $C^{1}$ 級で、$P_{x}=u_{xx}=-u_{yy}=Q_{y}$（調和）、$P_{y}=u_{xy}=u_{yx}=-Q_{x}$（シュワルツの定理）。\ref{cx:cr-consequences.1} から $g$ は正則。

**Step 2（原始関数）.** $U$ は単連結なので $g$ は原始関数 $G$ をもつ（\ref{cx:simply-connected-homologous}）。$G=A+iB$ とすると $G'=A_{x}+iB_{x}=A_{x}-iA_{y}$（コーシー–リーマン）$=u_{x}-iu_{y}$。よって $\nabla A=\nabla u$、$U$ は連結なので $A-u$ は定数 $c$（\ref{calc:zero-derivative-constant}）。$F\defeq G-c$ とおけば $\operatorname{Re}F=u$。

**Step 3（一意性）.** $\operatorname{Re}F_{1}=\operatorname{Re}F_{2}$ なら $F_{1}-F_{2}$ は実部が定数 $0$ の正則関数で、\ref{cx:cr-consequences.3} から定数（純虚数）。

**Step 4（滑らかさ）.** 任意の開集合 $U$ の各点の近くの円板（単連結）で $u=\operatorname{Re}F$ となるので、\ref{cx:real-part-harmonic} から $u$ は $C^{\infty}$。

::: hypcheck
- **前提「単連結」**：Step 2 の原始関数の存在に使った。外せない：$u=\log|z|$ は $\C\setminus\{0\}$ で調和だが、$u=\operatorname{Re}F$ となる正則な $F$ はない（あれば $F'=g=\frac{x-iy}{x^{2}+y^{2}}=\frac1z$ となり、$\frac1z$ が原始関数をもつことになる。\ref{cx:one-over-z-no-primitive}）。
- 定義では $C^{2}$ 級しか仮定していないが、結論として $C^{\infty}$ 級になる（さらに実解析的）。
:::
:::

## 平均値の性質と最大値原理 {#cx:sec-hm-maximum}

::: proposition 調和関数の平均値の性質 {#cx:harmonic-mean-value keywords="a harmonic function equals its average over every circle in the domain" index="調和関数の平均値の性質|ちょうわかんすうのへいきんちのせいしつ"}
$u$ が $U$ で調和、$\overline{D}(a,r)\subset U$ なら $u(a)=\frac{1}{2\pi}\int_{0}^{2\pi}u(a+re^{it})\,dt$。
:::

::: proof
$\overline{D}(a,r)$ を含む少し大きい円板 $D(a,r')\subset U$（\ref{cx:cauchy-formula} の Step 1 と同じ）で $u=\operatorname{Re}F$（\ref{cx:harmonic-conjugate}）。$F$ の平均値の性質（\ref{cx:mean-value}）の実部をとる。
:::

::: theorem 調和関数の最大値原理 {#cx:harmonic-maximum keywords="maximum principle for harmonic functions: an interior maximum forces constancy; on bounded domains max and min over the closure are attained on the boundary" index="最大値原理（調和関数）|さいだいちげんりちょうわかんすう" refname="調和関数の最大値原理"}
$D$ を領域、$u$ を $D$ で調和とする。
1. $u$ が $D$ のある点で最大値（$D$ 上の）をとれば、$u$ は定数である。
2. $D$ が有界で $u$ が $\overline{D}$ で連続なら、$\max_{\overline{D}}u$ と $\min_{\overline{D}}u$ は $\partial D$ の上でとられる。
:::

::: proof
**Step 1（1）.** $M\defeq\max_{D}u$、$E\defeq\{z\in D\mid u(z)=M\}$ とする。$E$ は空でなく、連続性から $D$ の中で閉。$a\in E$ と $\overline{D}(a,\rho)\subset D$ について、$0<r\le\rho$ で平均値の性質から $\frac{1}{2\pi}\int_{0}^{2\pi}(M-u(a+re^{it}))dt=0$、被積分関数は非負連続なので恒等的に $0$。よって $D(a,\rho)\subset E$、$E$ は開。$D$ は連結なので $E=D$。

**Step 2（2）.** 最大値の部分は \ref{cx:maximum-principle} の Step 3 と同じ議論。最小値は $-u$ に適用する。
:::

::: corollary 境界値による一意性 {#cx:harmonic-uniqueness keywords="a harmonic function on a bounded domain continuous on the closure is determined by its boundary values" index=""}
有界な領域 $D$ 上の調和関数で $\overline{D}$ まで連続なものは、境界 $\partial D$ 上の値で一意に決まる。
:::

::: proof
二つの差 $w$ は調和で境界で $0$。最大値・最小値原理から $\overline{D}$ で $0\le w\le0$。
:::

## ポアソン積分とディリクレ問題 {#cx:sec-hm-poisson}

::: definition ポアソン核とポアソン積分 {#cx:poisson-kernel keywords="Poisson kernel P(z, e^{it}) = Re((e^{it}+z)/(e^{it}-z)) = (1-|z|^2)/|e^{it}-z|^2; Poisson integral of a continuous function on the circle" index="ポアソン核|ぽあそんかく, ポアソン積分|ぽあそんせきぶん"}
$z\in\mathbb{D}$, $t\in\R$ について**ポアソン核**を
$$
P(z,t)\defeq\operatorname{Re}\frac{e^{it}+z}{e^{it}-z}=\frac{1-|z|^{2}}{|e^{it}-z|^{2}}
$$
と定める（二つ目の等号は、$\frac{e^{it}+z}{e^{it}-z}=\frac{(e^{it}+z)(e^{-it}-\bar z)}{|e^{it}-z|^{2}}$ の分子の実部が $1-|z|^{2}$ であることから）。$\mathbb{T}$ 上の連続関数 $\varphi$ について
$$
P[\varphi](z)\defeq\frac{1}{2\pi}\int_{0}^{2\pi}P(z,t)\,\varphi(e^{it})\,dt\qquad(z\in\mathbb{D})
$$
を $\varphi$ の**ポアソン積分**という。
:::

::: lemma ポアソン核の性質 {#cx:poisson-kernel-properties keywords="Poisson kernel is positive, has total mass 1, and concentrates at e^{it0} as z -> e^{it0}" index=""}
1. $P(z,t)>0$。
2. $\frac{1}{2\pi}\int_{0}^{2\pi}P(z,t)\,dt=1$（$z\in\mathbb{D}$）。
3. $t_{0}\in\R$, $\delta\in(0,\pi)$ について、$z\to e^{it_{0}}$（$z\in\mathbb{D}$）のとき、$|t-t_{0}|\ge\delta$（$t$ は $[t_{0}-\pi,t_{0}+\pi]$ の中）の上で $P(z,t)\to0$ が一様に成り立つ。
:::

::: proof
**1.** 二つ目の表示から。

**2.** $|z|<1$ なら $\frac{e^{it}+z}{e^{it}-z}=\frac{1+ze^{-it}}{1-ze^{-it}}=1+2\sum_{n\ge1}z^{n}e^{-int}$ で、$t$ について一様収束（比 $|z|<1$）。項別に積分すると、$n\ge1$ の項は $\int_{0}^{2\pi}e^{-int}dt=0$ なので $\frac{1}{2\pi}\int=1$。実部をとる。

**3.** $\eta\defeq\sin\frac\delta2>0$ とおくと $|e^{it}-e^{it_{0}}|=2|\sin\frac{t-t_{0}}{2}|\ge2\eta$。$|z-e^{it_{0}}|<\eta$ なら $|e^{it}-z|\ge\eta$ で、$P(z,t)\le\frac{1-|z|^{2}}{\eta^{2}}$。$z\to e^{it_{0}}$ で $|z|\to1$ なので右辺は $0$ に収束する（$t$ によらない）。
:::

::: theorem 円板のディリクレ問題 {#cx:dirichlet-disk keywords="Dirichlet problem on the disk: the Poisson integral of a continuous boundary function is harmonic and extends continuously to the boundary values; Poisson formula for harmonic functions" index="ディリクレ問題|でぃりくれもんだい, ポアソンの公式|ぽあそんのこうしき"}
$\varphi$ を $\mathbb{T}$ 上の連続関数（実数値）とする。$u\defeq P[\varphi]$ は $\mathbb{D}$ で調和で、$u(z)\to\varphi(\zeta)$（$z\to\zeta\in\mathbb{T}$, $z\in\mathbb{D}$）。すなわち $u$ を $\mathbb{T}$ 上で $\varphi$ と定めれば $\overline{\mathbb{D}}$ で連続になる。このような $u$ はただ一つである。とくに、$\overline{\mathbb{D}}$ の近傍で調和な $u$ については $u=P[u|_{\mathbb{T}}]$（**ポアソンの公式**）。
:::

::: proof
**Step 1（調和性）.** $H(z)\defeq\frac{1}{2\pi}\int_{0}^{2\pi}\frac{e^{it}+z}{e^{it}-z}\varphi(e^{it})dt$ は $\mathbb{D}$ で正則である：$\gamma(t)=e^{it}$ に沿った線積分で書くと $dz=ie^{it}dt$ から $\frac{e^{it}+z}{e^{it}-z}\varphi\,dt=\frac{\zeta+z}{\zeta-z}\cdot\frac{\varphi(\zeta)}{i\zeta}d\zeta$、$\frac{\zeta+z}{\zeta-z}=-1+\frac{2\zeta}{\zeta-z}$ なので、$H$ は定数とコーシー型積分（\ref{cx:cauchy-type-integral}）の和。$u=\operatorname{Re}H$（$\varphi$ は実数値）なので \ref{cx:real-part-harmonic} から調和。

**Step 2（境界値）.** $\zeta=e^{it_{0}}$、$\varepsilon>0$ をとる。$\varphi$ は $\mathbb{T}$ 上で一様連続なので、$\delta\in(0,\pi)$ を $|t-t_{0}|<\delta\Rightarrow|\varphi(e^{it})-\varphi(\zeta)|<\varepsilon$ ととれる。$B\defeq\max|\varphi|$。\ref{cx:poisson-kernel-properties.2} から
$$
u(z)-\varphi(\zeta)=\frac{1}{2\pi}\int_{t_{0}-\pi}^{t_{0}+\pi}P(z,t)\bigl(\varphi(e^{it})-\varphi(\zeta)\bigr)dt
$$
（周期性で積分区間をずらした）。$|t-t_{0}|<\delta$ の部分は 1・2 から $\varepsilon$ 以下、残りは $2B\sup_{|t-t_{0}|\ge\delta}P(z,t)$ 以下で、3 から $z\to\zeta$ で $0$。よって $\limsup|u(z)-\varphi(\zeta)|\le\varepsilon$。

**Step 3（一意性とポアソンの公式）.** \ref{cx:harmonic-uniqueness}（$D=\mathbb{D}$）。$u$ が $\overline{\mathbb{D}}$ の近傍で調和なら、$u$ と $P[u|_{\mathbb{T}}]$ はどちらも $\mathbb{D}$ で調和で $\overline{\mathbb{D}}$ で連続、境界値が同じなので一致する。

::: hypcheck
- **前提「$\varphi$ は連続」**：Step 2 の一様連続性に使った。連続でない $\varphi$（たとえば階段関数）でも $P[\varphi]$ は調和だが、不連続点では境界値に連続に近づかない。
- 円板以外の領域のディリクレ問題は、リーマンの写像定理で円板に写すか、ペロンの方法などで解く（未収録）。
:::
:::

::: example
$\varphi(e^{it})=\cos t$ なら、$u(z)=\operatorname{Re}z=x$（$\operatorname{Re}z$ は調和で境界値が $\cos t$ なので一意性から）。$\varphi(e^{it})=\cos^{2}t=\frac12+\frac12\cos2t$ なら $u=\frac12+\frac12\operatorname{Re}z^{2}=\frac12+\frac12(x^{2}-y^{2})$。
:::

::: theorem ハルナックの不等式 {#cx:harnack keywords="Harnack's inequality for nonnegative harmonic functions on a disk; Liouville theorem for positive harmonic functions on the plane" index="ハルナックの不等式|はるなっくのふとうしき" refname="ハルナックの不等式"}
$u\ge0$ が $D(a,R)$ で調和なら、$0\le r<R$ と $\theta\in\R$ について
$$
\frac{R-r}{R+r}u(a)\le u(a+re^{i\theta})\le\frac{R+r}{R-r}u(a).
$$
とくに、$\C$ 全体で調和で下に有界な関数は定数である。
:::

::: proof
**Step 1（$\overline{D}(a,R)$ の近傍で調和な場合）.** 平行移動と拡大（$z\mapsto a+Rz$。調和性は保たれる：合成は正則関数の実部の合成になる）で $a=0$, $R=1$ としてよい。ポアソンの公式から $u(z)=\frac{1}{2\pi}\int P(z,t)u(e^{it})dt$。$|z|=r$ で $1-r\le|e^{it}-z|\le1+r$ なので $\frac{1-r}{1+r}\le P(z,t)\le\frac{1+r}{1-r}$。$u\ge0$ と $\frac{1}{2\pi}\int u(e^{it})dt=u(0)$（平均値の性質）から主張。

**Step 2（一般の場合）.** $r<\rho<R$ について $\overline{D}(a,\rho)\subset D(a,R)$ なので、Step 1 を $\rho$ で使い、$\rho\to R$ とする。

**Step 3（リウヴィル型）.** $u\ge m$ なら $u-m\ge0$。任意の $z$ と $R>|z|$ で Step 2 から $u(z)-m\le\frac{R+|z|}{R-|z|}(u(0)-m)$、$R\to\infty$ で $u(z)\le u(0)$。同様に下からの不等式で $u(z)\ge u(0)$。
:::

## シュワルツの鏡像原理 {#cx:sec-hm-reflection}

::: theorem シュワルツの鏡像原理 {#cx:schwarz-reflection keywords="Schwarz reflection principle: a function holomorphic on the upper half of a symmetric domain, continuous up to the real axis and real there, extends holomorphically by f(conj z) = conj f(z)" index="鏡像原理|きょうぞうげんり, シュワルツの鏡像原理|しゅわるつのきょうぞうげんり" refname="シュワルツの鏡像原理"}
$\Omega$ を実軸に関して対称な領域（$z\in\Omega\Rightarrow\bar z\in\Omega$）とし、$\Omega^{+}\defeq\Omega\cap\{\operatorname{Im}z>0\}$、$L\defeq\Omega\cap\R$ とする。$f$ が $\Omega^{+}$ で正則、$\Omega^{+}\cup L$ で連続で、$L$ 上で実数値をとるなら、
$$
F(z)\defeq\begin{cases}f(z)&(z\in\Omega^{+}\cup L)\\\overline{f(\bar z)}&(\operatorname{Im}z<0)\end{cases}
$$
は $\Omega$ で正則である。
:::

::: proof
**Step 1（下半分での正則性と連続性）.** $\operatorname{Im}z<0$ では $\frac{F(z+h)-F(z)}{h}=\overline{\Bigl(\frac{f(\bar z+\bar h)-f(\bar z)}{\bar h}\Bigr)}\to\overline{f'(\bar z)}$ なので正則。$L$ 上では $f$ は実数値なので二つの定義が一致し、$F$ は $\Omega$ で連続（上下どちらから近づいても $f$ の連続性で極限が一致）。

**Step 2（実軸に辺または頂点をもつ三角形）.** 三角形 $\Delta\subset\Omega$ が閉上半平面に含まれるとする。$\Delta$ はコンパクトなので、$\varepsilon_{0}>0$ を $\Delta+i[0,\varepsilon_{0}]\subset\Omega$ となるようにとれる（\ref{top:compact-closed-distance}）。$0<\varepsilon\le\varepsilon_{0}$ について、平行移動した三角形 $\Delta+i\varepsilon$ は $\{\operatorname{Im}z\ge\varepsilon\}\cap\Omega\subset\Omega^{+}$ に入るので、グルサの定理から $\int_{\partial(\Delta+i\varepsilon)}F=\int_{\partial\Delta}F(w+i\varepsilon)dw=0$。$F$ はコンパクト集合 $\Delta+i[0,\varepsilon_{0}]$ 上で一様連続なので、$\varepsilon\to0$ で $\int_{\partial\Delta}F(w)dw=0$（\ref{cx:uniform-limit-integral}）。閉下半平面に含まれる三角形は $-i\varepsilon$ ずらして同様。

**Step 3（一般の三角形）.** 三角形 $\Delta\subset\Omega$ が実軸と交わるとき、$\Delta\cap\{\operatorname{Im}\ge0\}$ と $\Delta\cap\{\operatorname{Im}\le0\}$ はそれぞれ高々 4 頂点の凸多角形で、対角線で高々 2 つの三角形に分けられる。内側の辺の積分は打ち消し合うので、$\int_{\partial\Delta}F$ は Step 2 の型の三角形の積分の和で $0$。実軸と交わらない三角形は $\Omega^{\pm}$ の中にあり、グルサの定理から $0$。モレラの定理から $F$ は $\Omega$ で正則。

::: hypcheck
- **前提「$L$ 上で実数値」**：Step 1 で二つの定義が実軸上で一致することに使った。
- **前提「$\Omega^{+}\cup L$ で連続」**：Step 2 の一様連続性に使った。
- 正則性の証明は、実軸上での微分可能性を直接は示さず、モレラの定理に頼った。
:::
:::

::: example
$f$ が整関数で実軸上で実数値をとれば $f(\bar z)=\overline{f(z)}$（一致の定理からも従う）。鏡像原理は、$f$ が上半分でしか定義されていないときに延長を与える点が新しい。たとえば上半平面から単位円板への等角写像 $\frac{z-i}{z+i}$ のような写像を、境界の線分を越えて延ばす議論で使われる。
:::

## 問題 {#cx:sec-hm-problems}

::: problem {#cx:prob-hm-conjugate}
$u(x,y)=x^{3}-3xy^{2}+2y$ が調和であることを確かめ、調和共役 $v$ と、$u=\operatorname{Re}F$ となる整関数 $F$ を求めよ。
:::

::: solution
$u_{xx}=6x$, $u_{yy}=-6x$ で調和。$g=u_{x}-iu_{y}=3x^{2}-3y^{2}-i(-6xy+2)=3(x+iy)^{2}-2i=3z^{2}-2i$。原始関数 $z^{3}-2iz$ の実部は $x^{3}-3xy^{2}+2y=u$ なので $F=z^{3}-2iz$、$v=\operatorname{Im}F=3x^{2}y-y^{3}-2x$（定数を除く）。
:::

::: problem {#cx:prob-hm-poisson-compute}
$\varphi(e^{it})=\sin^{2}t$ のポアソン積分を $x,y$ の式で求めよ。
:::

::: solution
$\sin^{2}t=\frac12-\frac12\cos2t$ で、$\cos2t=\operatorname{Re}e^{2it}$ の調和な延長は $\operatorname{Re}z^{2}=x^{2}-y^{2}$。一意性から $u=\frac12-\frac12(x^{2}-y^{2})$。
:::

::: problem {#cx:prob-hm-log-modulus}
$f$ が領域 $D$ で正則で零点をもたないなら、$\log|f|$ は調和であることを示せ。単連結でない $D$ でも成り立つか。
:::

::: solution
各点の近くの円板（単連結）で $f$ は正則な対数 $L$ をもち（\ref{cx:holomorphic-log}）、$|f|=e^{\operatorname{Re}L}$ なので $\log|f|=\operatorname{Re}L$ は調和（\ref{cx:real-part-harmonic}）。調和性は局所的な性質なので、$D$ が単連結でなくても成り立つ（例：$\log|z|$ は $\C\setminus\{0\}$ で調和）。ただし大域的な調和共役は存在するとは限らない。
:::
