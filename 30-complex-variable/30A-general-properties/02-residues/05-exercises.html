# 演習：留数と調和関数 {#cx:page-exercises-residues keywords="exercises, Residues and Harmonic Functions"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。数値の答えは計算機（sympy, mpmath）でも確かめた。

## 記法と定義の確認 {#cx:sec-exresidues-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。

## 回転数と一般のコーシーの定理 {#cx:sec-wn-exercises}

対応するページ：\ref{cx:page-winding-number}

::: problem ★ 基本：回転数の計算 {#cx:ex-wn-1}
$\gamma(t)=1+2e^{-3it}$（$0\le t\le2\pi$）について $n(\gamma,1)$, $n(\gamma,0)$, $n(\gamma,4)$ を求めよ。
:::

::: solution
$\gamma$ は円周 $|z-1|=2$ を負の向きに 3 回まわる。$n(\gamma,1)=\frac{1}{2\pi i}\int_{0}^{2\pi}\frac{-6ie^{-3it}}{2e^{-3it}}dt=-3$。$0$ は円の内部（$|0-1|=1<2$）で $1$ と同じ連結成分にあるので $-3$（\ref{cx:winding-number-properties.2}）。$4$ は外部（$|4-1|=3>2$）で非有界な成分にあるので $0$。
:::

::: problem ★★ 標準：零ホモローグな円周での積分 {#cx:ex-wn-2}
$\oint_{|z|=2}\frac{dz}{z(z-1)(z-3)}$ を求めよ。
:::

::: solution
$\C\setminus\{3\}$ に含まれる円板 $D(0,\frac52)$ の中で、被積分関数は $0,1$ を除いて正則。部分分数 $\frac{1}{z(z-1)(z-3)}=\frac{1/3}{z}-\frac{1/2}{z-1}+\frac{1/6}{z-3}$ で、最後の項は円板 $D(0,\frac52)$ で正則なので積分 $0$。残りは $2\pi i(\frac13-\frac12)=-\frac{\pi i}{3}$。
:::

::: problem ★★★ 発展：対数の分枝 {#cx:ex-wn-3}
$U=\C\setminus[-1,1]$ で $\frac{z-1}{z+1}$ の正則な対数の分枝が存在することを示せ。
:::

::: solution
$f(z)=\frac{z-1}{z+1}$ は $U$ で正則で零点をもたない。$U$ 内の閉曲線 $\gamma$ について $\frac{1}{2\pi i}\oint_{\gamma}\frac{f'}{f}=\frac{1}{2\pi i}\oint_{\gamma}\bigl(\frac{1}{z-1}-\frac{1}{z+1}\bigr)=n(\gamma,1)-n(\gamma,-1)$。$[-1,1]$ は連結で $\gamma^{*}$ と交わらないので、$\pm1$ は $\C\setminus\gamma^{*}$ の同じ成分にあり差は $0$。よって $\frac{f'}{f}$ のすべての閉曲線積分が $0$ で、原始関数 $G$ がある（\ref{cx:primitive-existence}）。\ref{cx:holomorphic-log} の証明の Step 1・2 と同じく、定数を調整した $L=G+c$ が $e^{L}=f$ を満たす。
:::

## 留数定理と偏角の原理 {#cx:sec-rt-exercises}

対応するページ：\ref{cx:page-residue-theorem}

::: problem ★ 基本：留数の計算 {#cx:ex-rt-1}
$\operatorname{Res}\bigl(\frac{z^{2}}{z^{4}-1},i\bigr)$ と $\operatorname{Res}(\tan z,\frac\pi2)$ を求めよ。
:::

::: solution
\ref{cx:residue-computation.2} から $\frac{z^{2}}{4z^{3}}\big|_{z=i}=\frac{1}{4i}=-\frac i4$。$\tan z=\frac{\sin z}{\cos z}$ で $\cos\frac\pi2=0$, $\cos'\frac\pi2=-1$ なので $\frac{\sin(\pi/2)}{-1}=-1$。
:::

::: problem ★★ 標準：ルーシェの定理 {#cx:ex-rt-2}
$z^{7}-4z^{3}+z-1$ の零点のうち $|z|<1$ にあるものの個数を求めよ。
:::

::: solution
$|z|=1$ で $f=-4z^{3}$ と比べると $|z^{7}+z-1|\le3<4$。ルーシェの定理から $-4z^{3}$ と同じく 3 個。（数値的には絶対値約 $0.792$, $0.569$, $0.569$ の 3 つ。）
:::

::: problem ★★ 標準：正接の積分 {#cx:ex-rt-3}
$\oint_{|z|=3}\tan z\,dz$ を求めよ。
:::

::: solution
$|z|<3$ にある極は $\pm\frac\pi2$（$\frac{3\pi}{2}>3$）。どちらでも留数は $-1$（前問と同様）。留数定理から $2\pi i(-2)=-4\pi i$。
:::

::: problem ★★★ 発展：超越方程式の解の個数 {#cx:ex-rt-4}
$n\ge1$ について、方程式 $e^{z}=3z^{n}$ は $|z|<1$ にちょうど $n$ 個の解をもつことを示せ。
:::

::: solution
$|z|=1$ で $|e^{z}|=e^{\operatorname{Re}z}\le e<3=|3z^{n}|$。$f\defeq3z^{n}$, $g\defeq3z^{n}-e^{z}$ とすると $|f-g|=|e^{z}|<|f|$ なので、ルーシェの定理から $g$ の零点は $f$ と同じく $n$ 個（重複度込み）。さらに解はすべて単根：$g(z)=0$ かつ $g'(z)=3nz^{n-1}-e^{z}=0$ なら $e^{z}=3z^{n}=3nz^{n-1}$ から $z=n$ となり $|z|<1$ に反する（$n\ge1$）。
:::

## 定積分の計算 {#cx:sec-di-exercises}

対応するページ：\ref{cx:page-definite-integrals}

::: problem ★ 基本：三角関数の有理式 {#cx:ex-di-1}
$\displaystyle\int_{0}^{2\pi}\frac{dt}{5-4\cos t}$ を求めよ。
:::

::: solution
$F(z)=\frac1z\cdot\frac{1}{5-2(z+z^{-1})}=\frac{-1}{2z^{2}-5z+2}=\frac{-1}{(2z-1)(z-2)}$。円板の中の極は $\frac12$ で、$\operatorname{Res}=\frac{-1}{2(\frac12-2)}=\frac13$。積分は $2\pi\cdot\frac13=\frac{2\pi}{3}$。
:::

::: problem ★★ 標準：有理関数 {#cx:ex-di-2}
$\displaystyle\int_{-\infty}^{\infty}\frac{dx}{(x^{2}+1)(x^{2}+4)}$ を求めよ。
:::

::: solution
上半平面の極 $i$, $2i$ での留数は $\frac{1}{2i\cdot3}$, $\frac{1}{(-3)\cdot4i}$。和は $\frac{1}{6i}-\frac{1}{12i}=\frac{1}{12i}$、積分は $\frac{2\pi i}{12i}=\frac\pi6$。（部分分数 $\frac13(\frac{1}{x^{2}+1}-\frac{1}{x^{2}+4})$ からも $\frac13(\pi-\frac\pi2)$。）
:::

::: problem ★★ 標準：フーリエ型 {#cx:ex-di-3}
$\displaystyle\int_{0}^{\infty}\frac{x\sin2x}{x^{2}+1}dx$ を求めよ。
:::

::: solution
$\int_{-\infty}^{\infty}\frac{xe^{2ix}}{x^{2}+1}dx=2\pi i\frac{ie^{-2}}{2i}=\pi ie^{-2}$（\ref{cx:fourier-integral}）。虚部をとり、被積分関数 $\frac{x\sin2x}{x^{2}+1}$ は偶関数なので半分：$\frac\pi2e^{-2}\approx0.21258$。
:::

::: problem ★★★ 発展：交代級数の和 {#cx:ex-di-4}
$\frac{\pi}{\sin\pi z}$ の整数での留数が $(-1)^{n}$ であること、正方形 $Q_{N}$ 上で $\bigl|\frac{1}{\sin\pi z}\bigr|\le1$ であることを示し、$\sum_{n\ge1}\frac{(-1)^{n}}{n^{2}}=-\frac{\pi^{2}}{12}$ を導け。
:::

::: solution
留数：$\frac{\pi}{\pi\cos\pi n}=(-1)^{n}$。評価：$|\sin\pi z|^{2}=\sin^{2}\pi x+\sinh^{2}\pi y$ で、縦の辺では $\sin^{2}\pi x=1$、横の辺では $\sinh^{2}\pi y\ge\sinh^{2}\frac\pi2>1$。\ref{cx:residue-series} と同じ議論で $\sum_{n\neq0}\frac{(-1)^{n}}{n^{2}}+\operatorname{Res}\bigl(\frac{\pi}{z^{2}\sin\pi z},0\bigr)=0$。$\frac{\pi}{\sin\pi z}=\frac1z(1+\frac{\pi^{2}z^{2}}{6}+\cdots)$ から留数は $\frac{\pi^{2}}{6}$。よって $2\sum_{n\ge1}\frac{(-1)^{n}}{n^{2}}=-\frac{\pi^{2}}{6}$。
:::

## 調和関数 {#cx:sec-hm-exercises}

対応するページ：\ref{cx:page-harmonic}

::: problem ★ 基本：調和関数と正則関数 {#cx:ex-hm-1}
$u=e^{x}\cos y$ が調和であることを確かめ、$u=\operatorname{Re}F$ となる整関数 $F$ を求めよ。
:::

::: solution
$u_{xx}=e^{x}\cos y$, $u_{yy}=-e^{x}\cos y$ で調和。$u_{x}-iu_{y}=e^{x}\cos y+ie^{x}\sin y=e^{z}$ の原始関数 $e^{z}$ の実部が $u$ なので $F=e^{z}$（純虚数の定数を除く）。
:::

::: problem ★★ 標準：ディリクレ問題 {#cx:ex-hm-2}
単位円板で調和で、円周上の値が $\cos^{3}t$（$z=e^{it}$）となる関数を $x,y$ の式で求めよ。
:::

::: solution
$\cos^{3}t=\frac34\cos t+\frac14\cos3t$ で、$\cos nt=\operatorname{Re}e^{int}$ の調和な延長は $\operatorname{Re}z^{n}$。一意性（\ref{cx:dirichlet-disk}）から $u=\frac34x+\frac14(x^{3}-3xy^{2})$。
:::

::: problem ★★★ 発展：回転対称な調和関数 {#cx:ex-hm-3}
$\C\setminus\{0\}$ 上の調和関数で $u=\varphi(|z|)$（$\varphi$ は $(0,\infty)$ 上の $C^{2}$ 級関数）の形のものをすべて求めよ。
:::

::: solution
$r=|z|$ とすると $u_{x}=\varphi'(r)\frac xr$、$u_{xx}=\varphi''\frac{x^{2}}{r^{2}}+\varphi'\frac{r^{2}-x^{2}}{r^{3}}$。$y$ も同様で、足すと $\Delta u=\varphi''(r)+\frac{\varphi'(r)}{r}=\frac1r(r\varphi')'$。$\Delta u=0$ から $r\varphi'=a$（定数）、$\varphi=a\log r+b$。よって $u=a\log|z|+b$。
:::
