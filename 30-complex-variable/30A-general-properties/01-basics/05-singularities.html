# 孤立特異点とローラン展開 {#cx:page-singularities keywords="annulus, circle integrals independent of the radius, Laurent expansion, principal part, isolated singularity, removable singularity, Riemann's removable singularity theorem, pole, order of a pole, essential singularity, Casorati-Weierstrass theorem, meromorphic function, Riemann sphere, point at infinity, singularity at infinity, entire functions with a pole at infinity are polynomials, meromorphic functions on the Riemann sphere are rational"}

正則関数が一点のまわりだけで定義されていて、その点で正則かどうか分からない、という状況はよくある（$\frac{\sin z}{z}$, $\frac1z$, $e^{1/z}$ の原点）。このページでは、円環領域で正則な関数が、負の冪も許した冪級数（**ローラン級数**）に展開できることを示し、それによって孤立特異点を 3 種類（**除去可能・極・真性**）に分類する。有界なら除去可能（**リーマンの除去可能特異点定理**）、絶対値が無限大に発散するなら極、どちらでもなければ真性特異点で、そのまわりでは値があらゆる複素数に近づく（**カゾラーティ–ワイエルシュトラスの定理**）。最後に、無限遠点を付け加えた**リーマン球面**の上で考えると、無限遠点に極をもつ整関数は多項式であり、リーマン球面全体で有理型な関数は有理関数であることが分かる。

## 記法と定義の確認 {#cx:sec-sg-notation}

::: notation
- 正則関数 \ref{cx:holomorphic}、冪級数 \ref{cx:power-series-holomorphic}、係数の一意性 \ref{cx:power-series-uniqueness}、正則関数は解析的で導関数も正則 \tref{cx:holomorphic-analytic}、コーシー型積分 \ref{cx:cauchy-type-integral}、コーシーの評価式 \ref{cx:cauchy-estimates}、一致の定理と零点の\term[位数]{cx:zero-order} \tref{cx:identity-theorem}, \ref{cx:zero-order}、ワイエルシュトラスの収束定理 \tref{cx:weierstrass-convergence}。
- 複素線積分と円周の記法 \ref{cx:contour-integral}、長さによる評価 \tref{cx:ml-inequality}、一様収束と線積分 \ref{cx:uniform-limit-integral}、円周上の冪の積分 \ref{cx:circle-integral-powers}、曲線との合成の微分 \ref{cx:chain-rule-curve}、円周上の $\frac{1}{\zeta-z}$ の積分 \ref{cx:circle-kernel}。
- 積分記号下の微分 \ref{calc:differentiation-under-integral}（実部と虚部ごとに使う）。一点コンパクト化 \ref{top:one-point-compactification}, \ref{top:one-point-properties} と立体射影の例 \ref{top:rn-one-point}。
- $0\le r<R\le\infty$ について**円環領域** $A(a;r,R)\defeq\{z\mid r<|z-a|<R\}$。$r=0$ のとき $D^{*}(a,R)\defeq A(a;0,R)=D(a,R)\setminus\{a\}$（穴あき円板）。
- 両側無限級数 $\sum_{n\in\mathbb{Z}}w_{n}$ は、$\sum_{n\ge0}w_{n}$ と $\sum_{n\ge1}w_{-n}$ がともに収束するとき収束するといい、和はその二つの和とする。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## ローラン展開 {#cx:sec-sg-laurent}

::: lemma 円周積分の半径によらないこと {#cx:circle-integral-radius keywords="for f holomorphic on an annulus the integral over |z-a| = rho does not depend on rho" index=""}
$f$ が円環領域 $A(a;r,R)$ で正則なら、$I(\rho)\defeq\oint_{|\zeta-a|=\rho}f(\zeta)\,d\zeta$ は $\rho\in(r,R)$ によらない。
:::

::: proof
**Step 1（被積分関数）.** $w(\rho,t)\defeq a+\rho e^{it}$ とおくと $I(\rho)=\int_{0}^{2\pi}F(\rho,t)\,dt$、$F(\rho,t)\defeq f(w)\,i\rho e^{it}$。$f'$ は正則、とくに連続（\ref{cx:holomorphic-analytic.2}）。\ref{cx:chain-rule-curve}（$\rho$ を変数とする曲線と $t$ を変数とする曲線の両方に使う）から
$$
\begin{aligned}
\partial_{\rho}F&=f'(w)e^{it}\cdot i\rho e^{it}+f(w)\,ie^{it},\\
\partial_{t}\bigl(f(w)e^{it}\bigr)&=f'(w)\,i\rho e^{it}\cdot e^{it}+f(w)\,ie^{it}.
\end{aligned}
$$
両者は等しく、$(\rho,t)$ の連続関数である。

**Step 2（微分）.** 積分記号下の微分（\ref{calc:differentiation-under-integral.2}、実部・虚部ごとに、$\rho$ は開区間 $(r,R)$、積分範囲は $[0,2\pi]$）から
$$
I'(\rho)=\int_{0}^{2\pi}\partial_{t}\bigl(f(w)e^{it}\bigr)dt=f(a+\rho e^{2\pi i})e^{2\pi i}-f(a+\rho)=0.
$$
（微分積分学の基本定理、$e^{2\pi i}=1$。）$I$ の実部と虚部は導関数 $0$ なので、平均値の定理から定数。
:::

::: theorem ローラン展開 {#cx:laurent keywords="Laurent expansion: a function holomorphic on an annulus is the sum of a two-sided power series; coefficients given by circle integrals; uniqueness; locally uniform convergence" index="ローラン展開|ろーらんてんかい, ローラン級数|ろーらんきゅうすう"}
$f$ が $A\defeq A(a;r,R)$ で正則なら、$z\in A$ について
$$
f(z)=\sum_{n\in\mathbb{Z}}c_{n}(z-a)^{n},\qquad c_{n}=\frac{1}{2\pi i}\oint_{|\zeta-a|=\rho}\frac{f(\zeta)}{(\zeta-a)^{n+1}}\,d\zeta
$$
（$\rho\in(r,R)$ は任意で、$c_{n}$ は $\rho$ によらない）。級数 $\sum_{n\ge0}$ と $\sum_{n\ge1}c_{-n}(z-a)^{-n}$ は $A$ の中で絶対収束し、$r<\rho_{1}\le|z-a|\le\rho_{2}<R$ の上で一様収束する。逆に、$A$ の各点で $f(z)=\sum_{n\in\mathbb{Z}}d_{n}(z-a)^{n}$ が成り立ち、各円周 $|z-a|=\rho$ の上で一様収束するなら、$d_{n}=c_{n}$（**一意性**）。
:::

::: intuition
冪級数 $\sum_{n\ge0}$ の部分は「内側に向かって正則に延びる部分」、負の冪の部分 $\sum_{n\ge1}c_{-n}(z-a)^{-n}$ は「$1/(z-a)$ の冪級数」で外側（無限遠）に向かって正則に延びる部分である。円環で正則な関数は、この二つの和にちょうど分けられる。
:::

::: proof
$a=0$ とする。

**Step 1（係数が $\rho$ によらない）.** $\frac{f(\zeta)}{\zeta^{n+1}}$ は $A$ で正則なので \ref{cx:circle-integral-radius}。

**Step 2（円環のコーシーの積分公式）.** $z\in A$ を固定し、$r<\rho_{1}<|z|<\rho_{2}<R$ をとる。$g(\zeta)\defeq\frac{f(\zeta)-f(z)}{\zeta-z}$（$\zeta\neq z$）、$g(z)\defeq f'(z)$ とおく。$g$ は $A\setminus\{z\}$ で正則で、$z$ の近くでは $f$ のテイラー展開 $f(\zeta)=\sum_{k\ge0}b_{k}(\zeta-z)^{k}$（\ref{cx:holomorphic-analytic}）から $g(\zeta)=\sum_{k\ge1}b_{k}(\zeta-z)^{k-1}$ となるので、$z$ でも正則。よって $g$ は $A$ で正則で、\ref{cx:circle-integral-radius} から $\oint_{|\zeta|=\rho_{2}}g=\oint_{|\zeta|=\rho_{1}}g$。展開すると
$$
\oint_{|\zeta|=\rho_{2}}\frac{f(\zeta)}{\zeta-z}d\zeta-\oint_{|\zeta|=\rho_{1}}\frac{f(\zeta)}{\zeta-z}d\zeta=f(z)\Bigl(\oint_{|\zeta|=\rho_{2}}\frac{d\zeta}{\zeta-z}-\oint_{|\zeta|=\rho_{1}}\frac{d\zeta}{\zeta-z}\Bigr).
$$
右辺の第 1 の積分は $2\pi i$（\ref{cx:circle-kernel}、$|z|<\rho_{2}$）。第 2 の積分は、$|\zeta|=\rho_{1}<|z|$ で $\frac{1}{\zeta-z}=-\sum_{n\ge0}\frac{\zeta^{n}}{z^{n+1}}$（一様収束、比 $\rho_{1}/|z|<1$）と展開して項別に積分すると、\ref{cx:circle-integral-powers} から各項 $0$。よって
$$
f(z)=\frac{1}{2\pi i}\oint_{|\zeta|=\rho_{2}}\frac{f(\zeta)}{\zeta-z}d\zeta-\frac{1}{2\pi i}\oint_{|\zeta|=\rho_{1}}\frac{f(\zeta)}{\zeta-z}d\zeta.
$$

**Step 3（第 1 項）.** \ref{cx:cauchy-type-integral}（$\gamma=C(0,\rho_{2})$、中心 $0$、$D(0,\rho_{2})$ は円周と交わらない）から、第 1 項は $\sum_{n\ge0}c_{n}z^{n}$。

**Step 4（第 2 項）.** $|\zeta|=\rho_{1}$ で $-\frac{1}{\zeta-z}=\sum_{m\ge1}\frac{\zeta^{m-1}}{z^{m}}$（一様収束）。項別に積分すると、第 2 項は
$$
\sum_{m\ge1}\Bigl(\frac{1}{2\pi i}\oint_{|\zeta|=\rho_{1}}f(\zeta)\zeta^{m-1}d\zeta\Bigr)z^{-m}=\sum_{m\ge1}c_{-m}z^{-m}.
$$
以上で展開が得られた。

**Step 5（収束の様子）.** $\sum_{n\ge0}c_{n}z^{n}$ は $D(0,R)$ で収束する冪級数（Step 3 は $|z|<\rho_{2}$ の任意の $\rho_{2}<R$ で成り立つ）なので、\ref{cx:power-series-holomorphic} と \ref{cx:complex-cauchy-hadamard} から $|z|\le\rho_{2}$ で絶対かつ一様に収束する。負の冪の部分は $w=\frac1z$ の冪級数 $\sum_{m\ge1}c_{-m}w^{m}$ で、Step 4 から $|w|<\frac1r$ で収束するので、同様に $|w|\le\frac{1}{\rho_{1}}$、すなわち $|z|\ge\rho_{1}$ で絶対かつ一様に収束する。

**Step 6（一意性）.** $|z|=\rho$ の上で一様収束する $\sum d_{n}z^{n}$ に $\frac{z^{-k-1}}{2\pi i}$ を掛けても円周上で一様収束する（$|z^{-k-1}|=\rho^{-k-1}$ は定数）。項別に積分すると、\ref{cx:circle-integral-powers} から $n=k$ の項だけが残り、$c_{k}=d_{k}$。

::: hypcheck
- Step 2 で $g$ が $z$ で正則であることを、テイラー展開から直接確かめた（まだ除去可能特異点定理を使っていないので循環しない）。
- **$f$ は円環全体で正則**：Step 1・2 で円周積分が半径によらないことに使った。穴の中（$|z|\le r$）の振る舞いは何も仮定していない。
- Step 6 の一様収束：項別積分（\ref{cx:uniform-limit-integral}）に使った。
:::
:::

::: example
$f(z)=\frac{1}{z(z-1)}$ は二つの円環で異なるローラン展開をもつ。$0<|z|<1$ では $\frac{1}{z-1}=-\sum_{n\ge0}z^{n}$ から $f(z)=-\sum_{n\ge-1}z^{n}=-\frac1z-1-z-\cdots$。$|z|>1$ では $\frac{1}{z-1}=\frac1z\cdot\frac{1}{1-1/z}=\sum_{n\ge1}z^{-n}$ から $f(z)=\sum_{n\ge2}z^{-n}$。ローラン展開は円環ごとに一意であって、関数ごとに一意なのではない。
:::

## 孤立特異点の分類 {#cx:sec-sg-classification}

::: definition 孤立特異点と主要部 {#cx:isolated-singularity keywords="isolated singularity; removable singularity; pole of order m; essential singularity; principal part of the Laurent expansion" index="孤立特異点|こりつとくいてん, 除去可能な特異点|じょきょかのうなとくいてん, 極|きょく, 極の位数|きょくのいすう, 真性特異点|しんせいとくいてん, 主要部|しゅようぶ"}
$f$ が穴あき円板 $D^{*}(a,R)$（$R>0$）で正則なとき、$a$ を $f$ の**孤立特異点**という。$D^{*}(a,R)$ でのローラン展開 $\sum_{n\in\mathbb{Z}}c_{n}(z-a)^{n}$ の負の冪の部分 $\sum_{n\ge1}c_{-n}(z-a)^{-n}$ を**主要部**という。
1. すべての $n\ge1$ で $c_{-n}=0$ のとき、$a$ は**除去可能な特異点**であるという。このとき $f(a)\defeq c_{0}$ と定めれば $f$ は $D(a,R)$ で正則になる（冪級数なので）。
2. $c_{-n}\neq0$ となる $n\ge1$ が有限個しかなく、少なくとも一つあるとき、$a$ は**極**であるといい、その最大の $n$ を極の**位数**という。
3. $c_{-n}\neq0$ となる $n\ge1$ が無限個あるとき、$a$ は**真性特異点**であるという。
:::

::: theorem リーマンの除去可能特異点定理 {#cx:removable-singularity keywords="Riemann's removable singularity theorem: an isolated singularity near which f is bounded (or (z-a)f(z) -> 0) is removable" index="除去可能特異点定理|じょきょかのうとくいてんていり, リーマンの除去可能特異点定理|りーまんのじょきょかのうとくいてんていり" refname="リーマンの除去可能特異点定理"}
$f$ が $D^{*}(a,R)$ で正則とする。次は同値である。
1. $a$ は除去可能な特異点である。
2. $f$ は $a$ のある穴あき近傍で有界である。
3. $\lim_{z\to a}(z-a)f(z)=0$。
:::

::: proof
**Step 1（1 ⇒ 2 ⇒ 3）.** 1 なら $f$ は $a$ で連続に延びるので $a$ の近くで有界。2 なら $|(z-a)f(z)|\le M|z-a|\to0$。

**Step 2（3 ⇒ 1）.** $n\ge1$ とし、$0<\rho<R$ で $\varepsilon(\rho)\defeq\max_{|z-a|=\rho}|(z-a)f(z)|$ とおくと、3 から $\rho\to0$ で $\varepsilon(\rho)\to0$。\ref{cx:ml-inequality} から
$$
|c_{-n}|=\Bigl|\frac{1}{2\pi i}\oint_{|\zeta-a|=\rho}f(\zeta)(\zeta-a)^{n-1}d\zeta\Bigr|\le\frac{1}{2\pi}\cdot\frac{\varepsilon(\rho)}{\rho}\rho^{n-1}\cdot2\pi\rho=\varepsilon(\rho)\rho^{n-1}.
$$
$c_{-n}$ は $\rho$ によらない（\ref{cx:laurent}）ので、$\rho\to0$ として $c_{-n}=0$。

::: hypcheck
- **3 の条件**：外せない。$f(z)=\frac{1}{z}$ は $(z-0)f(z)=1\not\to0$ で、$0$ は除去可能でない。
- 有界性だけで（連続性も微分可能性も仮定せずに）一点の穴が埋まることは、実数の関数にはない現象である（$\sin\frac1x$ は有界だが $0$ で連続に延びない）。
:::
:::

::: theorem 極の特徴づけ {#cx:pole-characterization keywords="a is a pole of order m iff f(z) = g(z)/(z-a)^m with g holomorphic and g(a) != 0, iff 1/f has a zero of order m, iff |f(z)| -> infinity" index=""}
$f$ が $D^{*}(a,R)$ で正則とし、$m\ge1$ とする。次は同値である。
1. $a$ は\term[位数]{cx:isolated-singularity} $m$ の極である。
2. $D(a,R)$ で正則な $g$ で $g(a)\neq0$ のものがあって、$f(z)=\frac{g(z)}{(z-a)^{m}}$。
3. $a$ のある近傍で $f\neq0$ で、$\frac1f$（$a$ では $0$ とする）は $a$ で\term[位数]{cx:zero-order} $m$ の零点をもつ正則関数である。

また、$a$ が極であることと $\lim_{z\to a}|f(z)|=\infty$ は同値である。
:::

::: proof
**Step 1（1 ⇔ 2）.** 1 なら $g(z)\defeq\sum_{n\ge-m}c_{n}(z-a)^{n+m}$ は $D(a,R)$ で収束する冪級数（$D^{*}(a,R)$ で $(z-a)^{m}f(z)$ に等しい）で、$g(a)=c_{-m}\neq0$。逆に 2 なら $g$ のテイラー展開 $\sum b_{k}(z-a)^{k}$（$b_{0}\neq0$）から $f$ のローラン展開は $\sum_{k}b_{k}(z-a)^{k-m}$（一意性）で、最低次は $-m$。

**Step 2（2 ⇔ 3）.** 2 なら $g(a)\neq0$ と連続性から $a$ の近傍 $D(a,\delta)$ で $g\neq0$、$\frac1f=\frac{(z-a)^{m}}{g}$ は\term[位数]{cx:zero-order} $m$ の零点をもつ正則関数。逆に 3 なら \ref{cx:zero-order} から $\frac1f=(z-a)^{m}h$、$h(a)\neq0$、$a$ の近くで $h\neq0$ なので $f=\frac{1/h}{(z-a)^{m}}$。$\frac1h$ は $a$ の近くで正則で、$D(a,R)$ 全体の $g$ は $g\defeq(z-a)^{m}f$（$z\neq a$）、$g(a)\defeq\frac{1}{h(a)}$ と定めればよい。

**Step 3（発散）.** 2 から $|f(z)|=\frac{|g(z)|}{|z-a|^{m}}\to\infty$。逆に $|f(z)|\to\infty$ なら $a$ のある穴あき近傍で $|f|\ge1$、$\frac1f$ はそこで正則で有界（$\le1$）なので、除去可能特異点定理から $a$ で正則に延び、値は $0$（$\frac{1}{f}\to0$）。$\frac1f$ は恒等的に $0$ ではないので、零点の位数 $m$ が定まり（\ref{cx:zero-order}）、3 が成り立つ。
:::

::: theorem カゾラーティ–ワイエルシュトラスの定理 {#cx:casorati-weierstrass keywords="Casorati-Weierstrass theorem: near an essential singularity the image of every punctured neighborhood is dense in C" index="カゾラーティ–ワイエルシュトラスの定理|かぞらーてぃわいえるしゅとらすのていり" refname="カゾラーティ–ワイエルシュトラスの定理"}
$a$ が $f$ の真性特異点なら、任意の $0<\delta<R$ について $f(D^{*}(a,\delta))$ は $\C$ で稠密である。
:::

::: proof
**Step 1.** 稠密でないとすると、$w\in\C$ と $\varepsilon>0$ があって、$D^{*}(a,\delta)$ 上 $|f(z)-w|\ge\varepsilon$。$h(z)\defeq\frac{1}{f(z)-w}$ は $D^{*}(a,\delta)$ で正則で $|h|\le\frac1\varepsilon$。除去可能特異点定理から $h$ は $D(a,\delta)$ で正則に延びる。$h\not\equiv0$（値は $0$ にならない）。

**Step 2.** $h(a)\neq0$ なら $f=w+\frac1h$ は $a$ の近くで正則で、$a$ は除去可能。$h(a)=0$ なら、零点の\term[位数]{cx:zero-order}を $m$ として \ref{cx:pole-characterization.3} を $f-w$ に適用すると $a$ は $f-w$ の、したがって $f$ の\term[位数]{cx:isolated-singularity} $m$ の極（ローラン展開の主要部は定数 $w$ を足しても変わらない）。どちらも真性特異点であることに矛盾する。
:::

::: example
$f(z)=e^{1/z}$ は $0$ で真性特異点をもつ（ローラン展開 $\sum_{n\ge0}\frac{z^{-n}}{n!}$）。実際、任意の $w\neq0$ と $\delta>0$ について $e^{1/z}=w$ の解が $D^{*}(0,\delta)$ にある：$e^{\zeta}=w$ の解 $\zeta=\log|w|+i(\theta+2\pi k)$（\ref{cx:exp}）は $|k|$ を大きくすれば絶対値がいくらでも大きくなるので、$z=\frac1\zeta$ をいくらでも $0$ に近くとれる。値 $0$ だけはとらない。カゾラーティ–ワイエルシュトラスの定理（稠密）よりずっと強く、「高々 1 つの値を除いてすべての値を無限回とる」ことが一般に成り立つ（ピカールの大定理。未収録）。
:::

::: definition 有理型関数 {#cx:meromorphic keywords="meromorphic function on an open set: holomorphic except at isolated points which are poles" index="有理型関数|ゆうりけいかんすう"}
開集合 $U$ 上の関数 $f$ が**有理型**であるとは、$U$ の中で集積点をもたない集合 $P\subset U$ があって、$f$ は $U\setminus P$ で正則で、$P$ の各点が $f$ の極であることをいう。
:::

::: example
有理関数 $\frac{P}{Q}$（既約）は $\C$ で有理型で、極は $Q$ の根。$\frac{1}{\sin z}$ は $\C$ で有理型で、極は $\pi\mathbb{Z}$（すべて\term[位数]{cx:zero-order} 1：$\sin$ の零点はすべて位数 1、$\sin'(n\pi)=\cos n\pi\neq0$）。$\frac{\sin z}{z}$ は $0$ で除去可能で、整関数に延びる。
:::

## リーマン球面と無限遠点 {#cx:sec-sg-sphere}

::: definition リーマン球面 {#cx:riemann-sphere keywords="Riemann sphere: one-point compactification of C; neighborhoods of infinity; stereographic projection; singularity at infinity via f(1/w)" index="リーマン球面|りーまんきゅうめん, 無限遠点|むげんえんてん"}
$\C$ の一点コンパクト化 $\widehat{\C}\defeq\C\cup\{\infty\}$（\ref{top:one-point-compactification}）を**リーマン球面**という。$\infty$ の近傍の基本系は $\{|z|>R\}\cup\{\infty\}$（$R>0$）で、立体射影により $\widehat{\C}$ は球面 $S^{2}$ と同相である（\ref{top:rn-one-point}）。
$f$ が $\{|z|>R\}$ で正則なとき、$\infty$ を $f$ の孤立特異点といい、$g(w)\defeq f(1/w)$（$0<|w|<\frac1R$）の $0$ での特異点の種類（除去可能・位数 $m$ の極・真性）によって、$\infty$ の種類を定める。
:::

::: intuition
$z\mapsto\frac1z$ は $0$ と $\infty$ を入れ替える。無限遠点のまわりを調べるには、$w=\frac1z$ と座標を取り替えて原点のまわりを調べればよい。リーマン球面の上では $0$ と $\infty$ は対等で、「無限大に発散する」は「$\infty$ という点に連続に近づく」と言い直せる。
:::

::: theorem 無限遠点の特異点と整関数 {#cx:entire-at-infinity keywords="an entire function has a removable singularity at infinity iff it is constant, a pole of order m iff it is a polynomial of degree m, otherwise an essential singularity" index="超越整関数|ちょうえつせいかんすう"}
整関数 $f(z)=\sum_{n\ge0}a_{n}z^{n}$ について、
1. $\infty$ が除去可能 $\iff$ $f$ は定数。
2. $\infty$ が\term[位数]{cx:isolated-singularity} $m$ の極 $\iff$ $f$ は $m$ 次の多項式。
3. $\infty$ が真性特異点 $\iff$ $f$ は多項式でない（**超越整関数**）。
:::

::: proof
$g(w)=f(1/w)=\sum_{n\ge0}a_{n}w^{-n}$ は $w\neq0$ で絶対収束し、各円周 $|w|=\rho$ 上で一様収束する（$f$ のテイラー級数は $|z|\le1/\rho$ で一様収束）。ローラン展開の一意性から、これが $g$ の $D^{*}(0,\infty)$ でのローラン展開で、主要部は $\sum_{n\ge1}a_{n}w^{-n}$。除去可能 $\iff$ $a_{n}=0$（$n\ge1$）、\term[位数]{cx:isolated-singularity} $m$ の極 $\iff$ $a_{m}\neq0$ かつ $a_{n}=0$（$n>m$）、真性 $\iff$ 無限個の $a_{n}\neq0$。
:::

::: supplement
**リウヴィルの定理の言い換え.** 1 は「有界な整関数は定数」（\ref{cx:liouville}）の言い換えでもある（$\infty$ が除去可能 $\iff$ $f$ は $\infty$ の近くで有界、\ref{cx:removable-singularity}）。$e^{z}$, $\sin z$ は $\infty$ に真性特異点をもつので、カゾラーティ–ワイエルシュトラスの定理から、$|z|>R$ での値は $\C$ で稠密である。
:::

::: theorem リーマン球面上の有理型関数は有理関数 {#cx:meromorphic-sphere-rational keywords="a function meromorphic on C with at most a pole at infinity is rational; partial fraction decomposition" index="部分分数分解|ぶぶんぶんすうぶんかい"}
$f$ が $\C$ で有理型で、$\infty$ が $f$ の除去可能な特異点または極であるとする（ある $R$ について $f$ は $\{|z|>R\}$ で正則）。このとき $f$ は有理関数で、極を $p_{1},\dots,p_{k}$、その主要部を $Q_{j}\bigl(\frac{1}{z-p_{j}}\bigr)$（$Q_{j}$ は定数項のない多項式）とすると、多項式 $P$ があって
$$
f(z)=P(z)+\sum_{j=1}^{k}Q_{j}\Bigl(\frac{1}{z-p_{j}}\Bigr).
$$
:::

::: proof
**Step 1（極は有限個）.** 極の集合 $P_{f}$ は $\overline{D}(0,R)$ に含まれる。$P_{f}$ は $\C$ の中に集積点をもたないので、各 $z\in\overline{D}(0,R)$ には、$P_{f}$ の点を高々 1 つ（$z$ 自身）しか含まない開円板 $D(z,\delta_{z})$ がある。コンパクト集合 $\overline{D}(0,R)$ はそのうち有限個で覆えるので、$P_{f}$ は有限集合 $\{p_{1},\dots,p_{k}\}$ である。

**Step 2（主要部を引く）.** 各 $p_{j}$ での主要部 $S_{j}(z)\defeq Q_{j}\bigl(\frac{1}{z-p_{j}}\bigr)$ は $\C\setminus\{p_{j}\}$ で正則な有理関数。$h\defeq f-\sum_{j}S_{j}$ は、各 $p_{j}$ で主要部が消えるので除去可能（$S_{l}$, $l\neq j$ は $p_{j}$ で正則）、それ以外で正則。よって $h$ は整関数に延びる。

**Step 3（$\infty$ での振る舞い）.** 各 $S_{j}$ は $z\to\infty$ で $0$ に収束し、$f$ は $\infty$ で除去可能または極なので、$\infty$ の近くで $|f(z)|\le A|z|^{m}$（\ref{cx:pole-characterization.2} を $g(w)=f(1/w)$ に使う）。よって $|h(z)|\le A'+B|z|^{m}$（$|z|$ が大きいとき。小さい $|z|$ では連続性から有界）で、\ref{cx:liouville.2} から $h$ は多項式 $P$。
:::

## 問題 {#cx:sec-sg-problems}

::: problem {#cx:prob-sg-classify}
次の関数の孤立特異点をすべて求め、種類（除去可能・極（\term[位数]{cx:isolated-singularity}）・真性）を判定せよ。(a) $\dfrac{1-\cos z}{z^{2}}$　(b) $\dfrac{z}{e^{z}-1}$　(c) $z^{2}\sin\dfrac1z$　(d) $\dfrac{1}{z^{2}(z-1)^{3}}$
:::

::: solution
(a) $0$ のみ。$1-\cos z=\frac{z^{2}}{2}-\frac{z^{4}}{24}+\cdots$ なので $\frac{1-\cos z}{z^{2}}=\frac12-\frac{z^{2}}{24}+\cdots$、除去可能。
(b) $e^{z}=1\iff z\in2\pi i\mathbb{Z}$（\ref{cx:exp}）。$z=0$：$\frac{e^{z}-1}{z}=1+\frac z2+\cdots$ は $0$ で $1$ なので、$\frac{z}{e^{z}-1}$ は除去可能（値 $1$）。$z=2\pi ik$（$k\neq0$）：$e^{z}-1$ の微分 $e^{z}=1\neq0$ なので\term[位数]{cx:zero-order} 1 の零点、分子は $0$ でないので\term[位数]{cx:isolated-singularity} 1 の極。
(c) $0$ のみ。$z^{2}\sin\frac1z=\sum_{n\ge0}\frac{(-1)^{n}}{(2n+1)!}z^{1-2n}$ で負の冪が無限個あるので真性。
(d) $0$ で位数 2 の極、$1$ で位数 3 の極（\ref{cx:pole-characterization.2}：$g=\frac{1}{(z-1)^{3}}$, $g(0)\neq0$ など）。
:::

::: problem {#cx:prob-sg-laurent}
$f(z)=\dfrac{1}{(z-1)(z-2)}$ のローラン展開を、(a) $0<|z|<1$　(b) $1<|z|<2$　(c) $|z|>2$ で求めよ。
:::

::: solution
$f=\frac{1}{z-2}-\frac{1}{z-1}$。$|z|<1$：$\frac{1}{z-1}=-\sum z^{n}$。$|z|>1$：$\frac{1}{z-1}=\sum_{n\ge1}z^{-n}$。$|z|<2$：$\frac{1}{z-2}=-\sum\frac{z^{n}}{2^{n+1}}$。$|z|>2$：$\frac{1}{z-2}=\sum_{n\ge1}2^{n-1}z^{-n}$。
(a) $\sum_{n\ge0}(1-2^{-n-1})z^{n}$。(b) $-\sum_{n\ge0}\frac{z^{n}}{2^{n+1}}-\sum_{n\ge1}z^{-n}$。(c) $\sum_{n\ge1}(2^{n-1}-1)z^{-n}$。
:::

::: problem {#cx:prob-sg-bounded-by-power}
$f$ が $D^{*}(a,R)$ で正則で、ある実数 $\alpha$ と定数 $M$ について $|f(z)|\le M|z-a|^{-\alpha}$ なら、$a$ は除去可能か、\term[位数]{cx:isolated-singularity} $\lfloor\alpha\rfloor$ 以下の極であることを示せ。
:::

::: solution
$m\defeq\lfloor\alpha\rfloor$（$\alpha<0$ なら $m\defeq0$ としてよい）とすると $|(z-a)^{m+1}f(z)|\le M|z-a|^{m+1-\alpha}\to0$（$m+1>\alpha$）。除去可能特異点定理（3）から $(z-a)^{m}f(z)$ は $a$ で除去可能、つまり $(z-a)^{m}f(z)=g(z)$ は正則。$f=\frac{g}{(z-a)^{m}}$ で、$g$ の $a$ での零点の\term[位数]{cx:zero-order}を引くと、極の\term[位数]{cx:isolated-singularity}は $m$ 以下（または除去可能）。
:::
