# コーシーの積分公式と正則関数の性質 {#cx:page-cauchy-formula keywords="Cauchy integral formula, Cauchy-type integrals are analytic, holomorphic functions are analytic, Taylor expansion, radius of convergence and distance to the boundary, Cauchy integral formula for derivatives, Cauchy estimates, Liouville's theorem, fundamental theorem of algebra, Morera's theorem, Weierstrass convergence theorem, locally uniform convergence, identity theorem, order of a zero, isolated zeros, mean value property, maximum modulus principle"}

コーシーの積分定理（\ref{cx:cauchy-star}）から、正則関数の円板の中での値が、円周上の値の積分で表されることが分かる（**コーシーの積分公式**）。この公式は複素解析の中心で、ここから正則関数の驚くべき性質が次々に出てくる。正則関数は**解析的**で（冪級数で表され）、何回でも複素微分できる。有界な整関数は定数で（**リウヴィルの定理**）、その帰結として**代数学の基本定理**が得られる。積分が消えることから正則性が分かり（**モレラの定理**）、正則関数の広義一様極限は正則である。零点が集積する正則関数は恒等的に $0$ で（**一致の定理**）、絶対値は領域の内部で最大にならない（**最大値原理**）。

## 記法と定義の確認 {#cx:sec-cf-notation}

::: notation
- 正則関数 \ref{cx:holomorphic}、冪級数の正則性と項別微分 \ref{cx:power-series-holomorphic}、係数の一意性 \ref{cx:power-series-uniqueness}、解析関数 \ref{cx:analytic}, \ref{cx:analytic-holomorphic}、正則性の判定と定数になる条件 \ref{cx:cr-consequences}。
- 複素線積分 \ref{cx:contour-integral}、円周 $C(a,r)$ と $\oint_{|z-a|=r}$ の記法（同じ定義）、長さによる評価 \ref{cx:ml-inequality}、一様収束と線積分 \ref{cx:uniform-limit-integral}、円周上の冪の積分 \ref{cx:circle-integral-powers}。
- グルサの定理と星形領域のコーシーの定理 \ref{cx:goursat}, \ref{cx:goursat-exceptional}, \ref{cx:cauchy-star}、円板上の原始関数 \ref{cx:disk-primitive}。
- 距離空間のコンパクト集合と、交わらない閉集合の距離は正 \ref{top:compact-closed-distance}。コンパクト集合上の連続関数は最大値をとる。
- 開集合 $U$ 上の関数列 $f_{n}$ が $f$ に**広義一様収束**するとは、$U$ に含まれる任意のコンパクト集合の上で一様収束することをいう。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## コーシーの積分公式 {#cx:sec-cf-formula}

::: lemma 円周に沿った $\frac{1}{\zeta-z}$ の積分 {#cx:circle-kernel keywords="int over |zeta-a|=r of d zeta/(zeta - z) = 2 pi i for |z-a| < r" index=""}
$|z-a|<r$ なら $\displaystyle\oint_{|\zeta-a|=r}\frac{d\zeta}{\zeta-z}=2\pi i$。
:::

::: proof
$|\zeta-a|=r$ で $q\defeq\frac{|z-a|}{r}<1$ なので
$$
\frac{1}{\zeta-z}=\frac{1}{(\zeta-a)\bigl(1-\frac{z-a}{\zeta-a}\bigr)}=\sum_{n\ge0}\frac{(z-a)^{n}}{(\zeta-a)^{n+1}},
$$
第 $n$ 項の絶対値は $\frac{q^{n}}{r}$ 以下なので、M 判定法により $\zeta$ について円周上で一様収束する。項別に積分すると（\ref{cx:uniform-limit-integral}）、\ref{cx:circle-integral-powers} から $n=0$ の項だけが残り $2\pi i$。
:::

::: theorem コーシーの積分公式 {#cx:cauchy-formula keywords="Cauchy integral formula on a disk: f(z) = (1/2 pi i) int over |zeta-a|=r of f(zeta)/(zeta - z) d zeta" index="コーシーの積分公式|こーしーのせきぶんこうしき"}
$U\subset\C$ を開集合、$f$ を $U$ で正則とし、閉円板 $\overline{D}(a,r)\subset U$ とする。このとき $|z-a|<r$ なら
$$
f(z)=\frac{1}{2\pi i}\oint_{|\zeta-a|=r}\frac{f(\zeta)}{\zeta-z}\,d\zeta.
$$
:::

::: intuition
円板の内部の値が、境界の円周上の値だけで決まってしまう。実数の関数では、区間の両端の値から内部の値は決まらない。正則関数の「硬さ」がここに凝縮されている。$z=a$ とすると $f(a)=\frac{1}{2\pi}\int_{0}^{2\pi}f(a+re^{it})\,dt$、すなわち中心の値は円周上の平均である（\ref{cx:mean-value}）。
:::

::: proof
**Step 1（少し大きい円板）.** $\overline{D}(a,r)$ はコンパクトで、$\C\setminus U$ は閉集合なので、$U\neq\C$ なら \ref{top:compact-closed-distance} から $\varepsilon>0$ があって $\overline{D}(a,r)$ のどの点も $\C\setminus U$ から $\varepsilon$ 以上離れている。$r'\defeq r+\varepsilon$ とおくと $D(a,r')\subset U$（$U=\C$ なら $r'$ は何でもよい）。

**Step 2（補助関数）.** $z\in D(a,r)$ を固定し、$U$ 上の関数 $g$ を $g(\zeta)\defeq\frac{f(\zeta)-f(z)}{\zeta-z}$（$\zeta\neq z$）、$g(z)\defeq f'(z)$ と定める。$g$ は $U\setminus\{z\}$ で正則（商の微分）、$z$ では複素微分可能性の定義から連続である。

**Step 3（積分定理の適用）.** $D(a,r')$ は凸なので、\ref{cx:cauchy-star}（例外点 $z$）から $\oint_{|\zeta-a|=r}g(\zeta)\,d\zeta=0$。すなわち
$$
\oint_{|\zeta-a|=r}\frac{f(\zeta)}{\zeta-z}\,d\zeta=f(z)\oint_{|\zeta-a|=r}\frac{d\zeta}{\zeta-z}=2\pi i\,f(z)
$$
（最後は \ref{cx:circle-kernel}）。

::: hypcheck
- **前提「$\overline{D}(a,r)\subset U$」**：Step 1 で、円周を含む凸な開集合（円板 $D(a,r')$）の上で積分定理を使うために使った。開円板 $D(a,r)\subset U$ だけでは、円周上の値が定義されないか、円周の近くで $f$ が正則でないことがある。
- **前提「$|z-a|<r$」**：$|z-a|>r$ なら被積分関数 $\frac{f(\zeta)}{\zeta-z}$ は $\overline{D}(a,r)$ の近くで正則なので積分は $0$ になる（\ref{cx:cauchy-star}）。円周上の $z$ では積分が定義されない。
- $f'$ の連続性は使っていない（グルサの定理による）。
:::
:::

::: lemma コーシー型積分は解析的 {#cx:cauchy-type-integral keywords="for continuous phi on the trace of a curve, z -> int phi(zeta)/(zeta - z) d zeta is analytic off the trace with explicit power series and derivatives" index="コーシー型積分|こーしーがたせきぶん"}
$\gamma$ を曲線、$\varphi$ を $\gamma^{*}$ 上の連続関数とし、$\Phi(z)\defeq\int_{\gamma}\frac{\varphi(\zeta)}{\zeta-z}\,d\zeta$（$z\notin\gamma^{*}$）とおく。$a\notin\gamma^{*}$ と、$D(a,\rho)\cap\gamma^{*}=\varnothing$ を満たす $\rho>0$ について、$|z-a|<\rho$ なら
$$
\Phi(z)=\sum_{n\ge0}c_{n}(z-a)^{n},\qquad c_{n}\defeq\int_{\gamma}\frac{\varphi(\zeta)}{(\zeta-a)^{n+1}}\,d\zeta.
$$
したがって $\Phi$ は $\C\setminus\gamma^{*}$ で解析的・正則で、$\Phi^{(k)}(z)=k!\int_{\gamma}\frac{\varphi(\zeta)}{(\zeta-z)^{k+1}}\,d\zeta$。
:::

::: proof
**Step 1（展開）.** $|z-a|<\rho$ を固定し、$q\defeq|z-a|/\rho<1$ とする。$\zeta\in\gamma^{*}$ なら $|\zeta-a|\ge\rho$ なので
$$
\frac{\varphi(\zeta)}{\zeta-z}=\sum_{n\ge0}\frac{\varphi(\zeta)(z-a)^{n}}{(\zeta-a)^{n+1}},\qquad\Bigl|\frac{\varphi(\zeta)(z-a)^{n}}{(\zeta-a)^{n+1}}\Bigr|\le\frac{M}{\rho}q^{n}
$$
（$M\defeq\max_{\gamma^{*}}|\varphi|$）。M 判定法で $\gamma^{*}$ 上一様収束するので、項別に積分できて（\ref{cx:uniform-limit-integral}）主張の展開を得る。

**Step 2（解析性と導関数）.** Step 1 から $\Phi$ は $D(a,\rho)$ で収束する冪級数で表される。$\C\setminus\gamma^{*}$ は開集合（$\gamma^{*}$ はコンパクトで閉）で、その各点 $a$ について上の $\rho$ がとれるので $\Phi$ は解析的（\ref{cx:analytic}）で、\ref{cx:power-series-holomorphic} の 3 から $\Phi^{(k)}(a)=k!\,c_{k}$。$a$ は任意なので導関数の公式を得る。
:::

::: theorem 正則関数は解析的 {#cx:holomorphic-analytic keywords="every holomorphic function is analytic; the Taylor series at a converges on the largest open disk centered at a contained in the domain; holomorphic functions are infinitely differentiable; Cauchy integral formula for derivatives" index="テイラー展開（複素）|ていらーてんかいふくそ, 導関数のコーシーの積分公式|どうかんすうのこーしーのせきぶんこうしき"}
$U\subset\C$ を開集合、$f$ を $U$ で正則とする。
1. $D(a,R)\subset U$ なら、$D(a,R)$ の上で
$$
f(z)=\sum_{n\ge0}\frac{f^{(n)}(a)}{n!}(z-a)^{n}.
$$
とくにテイラー級数の収束半径は $a$ から $\C\setminus U$ までの距離以上である。
2. $f$ は $U$ で何回でも複素微分でき、導関数 $f',f'',\dots$ はすべて $U$ で正則である。
3. $\overline{D}(a,r)\subset U$, $|z-a|<r$ なら
$$
f^{(n)}(z)=\frac{n!}{2\pi i}\oint_{|\zeta-a|=r}\frac{f(\zeta)}{(\zeta-z)^{n+1}}\,d\zeta.
$$
:::

::: proof
**Step 1（3）.** \ref{cx:cauchy-formula} から $D(a,r)$ で $f=\frac{1}{2\pi i}\Phi$（$\gamma=C(a,r)$, $\varphi=f$）。\ref{cx:cauchy-type-integral} の導関数の公式。

**Step 2（1）.** $|z-a|<R$ をとり、$|z-a|<r<R$ となる $r$ をとると $\overline{D}(a,r)\subset D(a,R)\subset U$。\ref{cx:cauchy-formula} と \ref{cx:cauchy-type-integral}（$\rho=r$）から、$D(a,r)$ で $f(z)=\sum c_{n}(z-a)^{n}$、$c_{n}=\frac{1}{2\pi i}\oint\frac{f(\zeta)}{(\zeta-a)^{n+1}}d\zeta=\frac{f^{(n)}(a)}{n!}$（Step 1 で $z=a$）。係数は $r$ によらないので、展開は $D(a,R)$ 全体で成り立つ。

**Step 3（2）.** Step 2 から $f$ は解析的で、\ref{cx:analytic-holomorphic} を使う。

::: hypcheck
- 使ったのは、各点で複素微分可能であることだけ（$f'$ の連続性は仮定していない）。結論として $f'$ は正則、とくに連続になる。
- 1 の収束半径の評価は等号とは限らない（$U$ を小さくとれば距離はいくらでも小さくなる）。正確な収束半径は「$f$ を正則に延ばせる最大の円板」の半径である。
:::
:::

::: example
$f(x)=\frac{1}{1+x^{2}}$ は実数直線全体で滑らかなのに、$0$ のまわりのテイラー級数の収束半径は $1$ である（\ref{calc:power-series} の例）。複素数で見ると $\frac{1}{1+z^{2}}$ は $\pm i$ で正則でなく（$|f(z)|\to\infty$）、$D(0,1)$ で正則なので 1 から収束半径は $1$ 以上、$i$ に近づくと値が発散するので $1$ を超えない（収束半径 $R>1$ なら和は $\overline{D}(0,1)$ で連続、とくに $i$ の近くで有界になる）。実数の範囲では見えない「複素数の特異点」が、実数のテイラー級数の収束範囲を決めている。
:::

::: corollary コーシーの評価式 {#cx:cauchy-estimates keywords="Cauchy estimates |f^(n)(a)| <= n! M / r^n" index="コーシーの評価式|こーしーのひょうかしき"}
$\overline{D}(a,r)\subset U$ で $f$ が $U$ で正則、$M\defeq\max_{|\zeta-a|=r}|f(\zeta)|$ なら
$$
|f^{(n)}(a)|\le\frac{n!\,M}{r^{n}}.
$$
:::

::: proof
\ref{cx:holomorphic-analytic} の 3（$z=a$）と \ref{cx:ml-inequality}：$|f^{(n)}(a)|\le\frac{n!}{2\pi}\cdot\frac{M}{r^{n+1}}\cdot2\pi r$。
:::

## リウヴィルの定理と代数学の基本定理 {#cx:sec-cf-liouville}

::: theorem リウヴィルの定理 {#cx:liouville keywords="Liouville's theorem: a bounded entire function is constant; entire functions of polynomial growth are polynomials" index="リウヴィルの定理|りうゔぃるのていり"}
1. 有界な整関数は定数である。
2. より一般に、整関数 $f$ が定数 $A,B$ と自然数 $m$ について $|f(z)|\le A+B|z|^{m}$（すべての $z$）を満たせば、$f$ は次数 $m$ 以下の多項式である。
:::

::: proof
**Step 1（2）.** $n>m$ とする。任意の $r>0$ で \ref{cx:cauchy-estimates}（$a=0$）から $|f^{(n)}(0)|\le\frac{n!(A+Br^{m})}{r^{n}}$。$r\to\infty$ で右辺は $0$ なので $f^{(n)}(0)=0$。$f$ は整関数なので \ref{cx:holomorphic-analytic} の 1（$R=\infty$）から $f(z)=\sum_{n\le m}\frac{f^{(n)}(0)}{n!}z^{n}$。

**Step 2（1）.** $|f|\le A$ なら 2 で $m=0$ とする。
:::

::: theorem 代数学の基本定理 {#cx:fundamental-theorem-algebra keywords="every nonconstant complex polynomial has a root; C is algebraically closed" index="代数学の基本定理|だいすうがくのきほんていり"}
次数 $1$ 以上の複素係数の多項式は $\C$ に根をもつ。したがって $\C$ は代数的閉体である。
:::

::: proof
**Step 1.** $P(z)=c_{d}z^{d}+\dots+c_{0}$（$d\ge1$, $c_{d}\neq0$）が根をもたないと仮定する。$\frac1P$ は整関数（\ref{cx:derivative-rules} の 4）。

**Step 2（無限遠での振る舞い）.** $|z|\ge1$ なら
$$
|P(z)|\ge|c_{d}||z|^{d}-\sum_{k<d}|c_{k}||z|^{k}\ge|z|^{d-1}\Bigl(|c_{d}||z|-\sum_{k<d}|c_{k}|\Bigr).
$$
よって $|z|\ge R_{0}\defeq\max\bigl(1,\frac{1+\sum_{k<d}|c_{k}|}{|c_{d}|}\bigr)$ なら $|P(z)|\ge1$。

**Step 3.** $\overline{D}(0,R_{0})$ はコンパクトで $\frac1P$ は連続なので有界。Step 2 と合わせて $\frac1P$ は有界な整関数で、リウヴィルの定理から定数。すると $P$ も定数となり $d\ge1$ に矛盾する。

**Step 4.** 根 $\alpha$ があれば $P(z)=(z-\alpha)Q(z)$（割り算）で、帰納法により $P$ は一次式の積に分解する。
:::

::: supplement
**別証明.** ガロア理論による証明（実数体の性質と、2 冪位数の群のシローの定理を使う）は \ref{fld:fundamental-theorem-algebra} にある。位相的な証明（$|z|=R$ 上で $P(z)$ が原点のまわりを $d$ 回まわる）は回転数の議論でできる（\ref[留数定理と偏角の原理]{cx:page-residue-theorem}）。
:::

## モレラの定理と広義一様収束 {#cx:sec-cf-morera}

::: theorem モレラの定理 {#cx:morera keywords="Morera's theorem: a continuous function whose integrals over all triangles vanish is holomorphic" index="モレラの定理|もれらのていり"}
$U\subset\C$ を開集合、$f$ を $U$ 上の連続関数とし、$U$ に含まれるすべての三角形 $\Delta$ について $\int_{\partial\Delta}f\,dz=0$ とする。このとき $f$ は $U$ で正則である。
:::

::: proof
$a\in U$ と $D(a,r)\subset U$ をとる。$D(a,r)$ は凸で、そこに含まれる三角形の周の積分はすべて $0$ なので、\ref{cx:cauchy-star} の証明（Step 1–3。その hypcheck で注意したとおり、三角形上の積分が $0$ であることと連続性しか使わない）から、$F(z)\defeq\int_{[a,z]}f$ は $D(a,r)$ で正則で $F'=f$。\ref{cx:holomorphic-analytic} の 2 から $F'$ も正則なので、$f$ は $D(a,r)$ で正則。$a$ は任意。
:::

::: theorem ワイエルシュトラスの収束定理 {#cx:weierstrass-convergence keywords="the locally uniform limit of holomorphic functions is holomorphic and derivatives converge locally uniformly" index="ワイエルシュトラスの収束定理|わいえるしゅとらすのしゅうそくていり, 広義一様収束|こうぎいちようしゅうそく"}
開集合 $U$ 上の正則関数の列 $f_{n}$ が $f$ に広義一様収束すれば、$f$ は $U$ で正則で、各 $k$ について $f_{n}^{(k)}$ は $f^{(k)}$ に広義一様収束する。とくに、正則関数の級数 $\sum f_{n}$ が広義一様収束すれば、和は正則で項別に何回でも微分できる。
:::

::: proof
**Step 1（正則性）.** $f$ は連続（各点の近傍の閉円板の上で一様収束）。三角形 $\Delta\subset U$ はコンパクトなので $f_{n}\to f$ は $\Delta$ 上一様で、\ref{cx:uniform-limit-integral} とグルサの定理から $\int_{\partial\Delta}f\,dz=\lim\int_{\partial\Delta}f_{n}\,dz=0$。モレラの定理から $f$ は正則。

**Step 2（導関数の収束：円板の上）.** $\overline{D}(a,2r)\subset U$ とする。$|z-a|\le r$, $|\zeta-a|=2r$ なら $|\zeta-z|\ge r$ なので、\ref{cx:holomorphic-analytic} の 3 と \ref{cx:ml-inequality} から
$$
\sup_{\overline{D}(a,r)}|f_{n}^{(k)}-f^{(k)}|\le\frac{k!}{2\pi}\cdot\frac{\max_{|\zeta-a|=2r}|f_{n}-f|}{r^{k+1}}\cdot4\pi r\to0.
$$

**Step 3（コンパクト集合の上）.** $K\subset U$ をコンパクトとする。各 $a\in K$ に $\overline{D}(a,2r_{a})\subset U$ となる $r_{a}>0$ がある。ここで選択を避けるため、$K$ と $\C\setminus U$ の距離 $\varepsilon>0$（\ref{top:compact-closed-distance}、$U=\C$ なら $\varepsilon=1$）をとり、$r\defeq\varepsilon/3$ を共通にとる。開円板 $D(a,r)$（$a\in K$）は $K$ を覆うので有限個 $D(a_{1},r),\dots,D(a_{N},r)$ で覆える。各 $\overline{D}(a_{j},r)$ 上で Step 2 から一様収束するので、$K$ 上でも一様収束する。

::: hypcheck
- **「広義一様」**：Step 1 で三角形の上での一様収束、Step 2 で円周上の一様収束に使った。各点収束では足りないことが知られている（ルンゲの近似定理を使って、各点収束するが極限が正則でない多項式の列が作れる。未収録）。
- 実数の場合との違い：実数値関数では、一様収束しても極限が微分可能とは限らない（ワイエルシュトラスの近似定理により、連続関数はすべて多項式の一様極限）。複素数ではコーシーの積分公式が導関数を関数の値で制御するので、このようなことは起きない。
- 選択公理：有限部分被覆は、コンパクト性の定義から有限個を取り出すだけで、可算選択も使わない。
:::
:::

## 一致の定理 {#cx:sec-cf-identity}

::: theorem 一致の定理 {#cx:identity-theorem keywords="identity theorem: a holomorphic function on a domain whose zero set has an accumulation point in the domain vanishes identically; two holomorphic functions agreeing on such a set are equal" index="一致の定理（複素）|いっちのていりふくそ"}
$D$ を領域、$f$ を $D$ で正則とする。次は同値である。
1. $f\equiv0$。
2. ある $a\in D$ ですべての $f^{(n)}(a)=0$。
3. 零点の集合 $Z(f)\defeq\{z\in D\mid f(z)=0\}$ が $D$ の中に集積点をもつ。

とくに、$D$ で正則な $f,g$ が、$D$ の中に集積点をもつ集合の上で一致すれば、$f=g$ である。
:::

::: proof
**Step 1（1 ⇒ 3 ⇒ 2）.** 1 ⇒ 3 は明らか（$D$ の任意の点が集積点）。3 ⇒ 2：$a\in D$ を $Z(f)$ の集積点とし、$D(a,R)\subset D$ をとる。$D(a,R)$ で $f$ はテイラー級数で表される（\ref{cx:holomorphic-analytic}）。点列を選ぶ必要はなく、\ref{cx:power-series-uniqueness} の証明と同じ議論を集積点の定義のまま使う：ある係数が $0$ でないと仮定し、その最小の番号を $m$ とすると $f(z)=(z-a)^{m}h(z)$、$h(a)\neq0$ で、$a$ のある近傍 $D(a,\delta)$ で $h\neq0$、したがって $D(a,\delta)\setminus\{a\}$ に零点がなく、$a$ が集積点であることに矛盾する。よってすべての $f^{(n)}(a)=0$。

**Step 2（2 ⇒ 1）.** $A\defeq\{z\in D\mid\text{すべての }n\text{ で }f^{(n)}(z)=0\}$ とおく。2 から $A\neq\varnothing$。
- $A$ は $D$ の中で閉集合：各 $f^{(n)}$ は連続（\ref{cx:holomorphic-analytic} の 2）なので $\{f^{(n)}=0\}$ は閉で、$A$ はその共通部分。
- $A$ は開集合：$b\in A$ と $D(b,R)\subset D$ をとると、$D(b,R)$ で $f(z)=\sum\frac{f^{(n)}(b)}{n!}(z-b)^{n}=0$、よって $D(b,R)$ ですべての導関数も $0$、$D(b,R)\subset A$。

$D$ は連結なので $A=D$、とくに $f\equiv0$。

**Step 3（後半）.** $f-g$ に適用する。

::: hypcheck
- **前提「$D$ は連結」**：Step 2 に使った。$D=D(0,1)\cup D(3,1)$ で、片方で $0$、他方で $1$ となる関数は反例。
- **前提「集積点が $D$ の中」**：外せない。$\sin\frac{\pi}{z}$ は $D=\C\setminus\{0\}$ で正則で、零点 $\frac1n$ は $0\notin D$ に集積するが、恒等的に $0$ ではない。
:::
:::

::: corollary 零点の位数 {#cx:zero-order keywords="zeros of a nonzero holomorphic function on a domain are isolated and have finite order m: f(z) = (z-a)^m g(z), g(a) != 0" index="零点の位数|れいてんのいすう, 孤立零点|こりつれいてん"}
$D$ を領域、$f\not\equiv0$ を $D$ で正則、$f(a)=0$ とする。自然数 $m\ge1$ と $D$ で正則な $g$ があって
$$
f(z)=(z-a)^{m}g(z),\qquad g(a)\neq0.
$$
$m$ を零点 $a$ の**位数**という（$m=\min\{n\mid f^{(n)}(a)\neq0\}$）。とくに、$a$ のある近傍には $a$ 以外の零点がない（零点は**孤立**している）。
:::

::: proof
\ref{cx:identity-theorem} からある $f^{(n)}(a)\neq0$ で、その最小の $n$ を $m$ とする（$f(a)=0$ なので $m\ge1$）。$g(z)\defeq\frac{f(z)}{(z-a)^{m}}$（$z\neq a$）、$g(a)\defeq\frac{f^{(m)}(a)}{m!}$ とおく。$D(a,R)\subset D$ でテイラー展開すると $g(z)=\sum_{n\ge m}\frac{f^{(n)}(a)}{n!}(z-a)^{n-m}$ なので $g$ は $a$ の近くで正則、$a$ 以外では商として正則。$g(a)\neq0$ と連続性から、$a$ の近傍で $g\neq0$。
:::

::: supplement
**実数との違い.** 実解析関数にも一致の定理がある（\ref{calc:identity-theorem}）が、$C^{\infty}$ 級関数にはない（\ref{calc:non-analytic-smooth} は $(-\infty,0]$ で $0$ だが恒等的に $0$ でない）。正則関数は 1 回の複素微分可能性だけで解析的になるので、この「硬さ」を自動的にもつ。

**関数等式の延長.** 一致の定理により、実数で成り立つ恒等式は、両辺が正則な範囲で複素数に延びる。たとえば $\sin^{2}z+\cos^{2}z=1$ や $e^{z+w}=e^{z}e^{w}$ は、実数での等式から一致の定理だけで得られる。
:::

## 平均値の性質と最大値原理 {#cx:sec-cf-maximum}

::: proposition 平均値の性質 {#cx:mean-value keywords="mean value property: f(a) is the average of f over any circle centered at a inside the domain" index="平均値の性質|へいきんちのせいしつ"}
$f$ が $U$ で正則、$\overline{D}(a,r)\subset U$ なら $f(a)=\dfrac{1}{2\pi}\displaystyle\int_{0}^{2\pi}f(a+re^{it})\,dt$。
:::

::: proof
\ref{cx:cauchy-formula} で $z=a$、$\zeta=a+re^{it}$、$d\zeta=ire^{it}dt$ とすると $f(a)=\frac{1}{2\pi i}\int_{0}^{2\pi}\frac{f(a+re^{it})}{re^{it}}ire^{it}dt$。
:::

::: theorem 最大値原理 {#cx:maximum-principle keywords="maximum modulus principle: if |f| has a local maximum in a domain then f is constant; on a bounded domain the maximum of |f| over the closure is attained on the boundary" index="最大値原理|さいだいちげんり, 最大絶対値の原理|さいだいぜったいちのげんり"}
$D$ を領域、$f$ を $D$ で正則とする。
1. $|f|$ が $D$ のある点 $a$ で極大値をとる（$a$ のある近傍で $|f(z)|\le|f(a)|$）なら、$f$ は $D$ で定数である。
2. $D$ が有界で、$f$ が閉包 $\overline{D}$ で連続なら、$\max_{\overline{D}}|f|$ は境界 $\partial D=\overline{D}\setminus D$ の上でとられる。
:::

::: proof
**Step 1（局所的に $|f|$ が一定）.** $\overline{D}(a,\rho)\subset D$ の上で $|f|\le|f(a)|$ とし、$0<r\le\rho$ をとる。平均値の性質から
$$
|f(a)|\le\frac{1}{2\pi}\int_{0}^{2\pi}|f(a+re^{it})|\,dt\le|f(a)|.
$$
等号が成り立つので、連続関数 $|f(a)|-|f(a+re^{it})|\ge0$ の積分は $0$ で、この関数は恒等的に $0$（連続で非負な関数の積分が $0$ なら恒等的に $0$）。$r$ は任意なので $D(a,\rho)$ 上で $|f|=|f(a)|$。

**Step 2（定数）.** \ref{cx:cr-consequences} の 3 から $f$ は $D(a,\rho)$ で定数 $c$。$f-c$ は $D(a,\rho)$ で $0$ なので、一致の定理から $D$ 全体で $f=c$。

**Step 3（2）.** $\overline{D}$ は有界閉でコンパクトなので $|f|$ は $\overline{D}$ のどこかで最大値をとる。最大値をとる点がすべて $D$ の中にあるとする。$a\in D$ で最大なら 1 から $f$ は $D$ で定数 $c$ で、連続性から $\overline{D}$ でも $c$。$D$ は有界なので $\partial D\neq\varnothing$（$\C$ は連結で $D\neq\C$）、境界の点でも $|f|=|c|$ が最大値で、仮定に矛盾する。

::: hypcheck
- **1 の前提「$D$ は連結」**：Step 2 の一致の定理に使った。
- **2 の前提「$D$ は有界」**：外せない。帯 $D=\{|\operatorname{Im}z|<\frac\pi2\}$ で $f(z)=e^{e^{z}}$ は境界 $\operatorname{Im}z=\pm\frac\pi2$ では $|f|=|e^{\pm ie^{x}}|=1$ だが、実軸上で $e^{e^{x}}\to\infty$。
- Step 1 で使った「連続で非負な関数の積分が $0$ なら恒等的に $0$」は、正の値をとる点の近くで積分が正になることから。
:::
:::

::: supplement
**類似の定理.** $\frac1f$ に適用すると、零点のない正則関数の $|f|$ は内部で極小値をとらない（最小値原理）。実部 $\operatorname{Re}f$ についても、$e^{f}$ に適用すれば最大値原理が成り立つ。調和関数の最大値原理は \ref[調和関数]{cx:page-harmonic} で扱う。

**高い視点.** 最大値原理は、正則写像が開写像であること（定数でない正則関数は開集合を開集合に写す：\ref[留数定理と偏角の原理]{cx:page-residue-theorem}）から直ちに出る。$|f(a)|$ が極大なら、$f(a)$ のまわりの小円板の値はすべてとられるはずで、その中には $|f(a)|$ より絶対値の大きい値がある。
:::

## 問題 {#cx:sec-cf-problems}

::: problem {#cx:prob-cf-compute}
$\displaystyle\oint_{|z|=2}\frac{e^{z}}{(z-1)^{3}}\,dz$ と $\displaystyle\oint_{|z|=2}\frac{\cos z}{z^{2}+1}\,dz$ を求めよ。
:::

::: solution
1 つ目：\ref{cx:holomorphic-analytic} の 3 で $n=2$、$z=1$ とすると $\oint\frac{e^{\zeta}}{(\zeta-1)^{3}}d\zeta=\frac{2\pi i}{2!}e^{1}=\pi ie$。2 つ目：$\frac{1}{z^{2}+1}=\frac{1}{2i}\bigl(\frac{1}{z-i}-\frac{1}{z+i}\bigr)$ と分け、それぞれに \ref{cx:cauchy-formula}（$a=0$, $r=2$、$\pm i\in D(0,2)$）を使うと $\frac{1}{2i}\cdot2\pi i(\cos i-\cos(-i))=0$。
:::

::: problem {#cx:prob-cf-cos-radius}
$\frac{1}{\cos z}$ の $0$ のまわりのテイラー級数の収束半径を求めよ。
:::

::: solution
$\cos$ の零点は $\frac\pi2+\pi\mathbb{Z}$（\ref{cx:trig-properties} の 4）なので、$\frac{1}{\cos z}$ は $D(0,\frac\pi2)$ で正則で、\ref{cx:holomorphic-analytic} の 1 から収束半径は $\frac\pi2$ 以上。収束半径 $R>\frac\pi2$ なら、和 $S$ は $\overline{D}(0,\frac\pi2)$ で連続、とくに有界で、$D(0,\frac\pi2)$ では $S=\frac{1}{\cos z}$。ところが $x\in(0,\frac\pi2)$ で $x\to\frac\pi2$ とすると $\frac{1}{\cos x}\to\infty$ で矛盾。よって $\frac\pi2$。
:::

::: problem {#cx:prob-cf-real-part-bounded}
整関数 $f$ の実部が上に有界なら $f$ は定数であることを示せ。
:::

::: solution
$\operatorname{Re}f\le A$ とする。$g\defeq e^{f}$ は整関数で $|g|=e^{\operatorname{Re}f}\le e^{A}$。リウヴィルの定理から $g$ は定数で、$g'=f'e^{f}=0$、$e^{f}\neq0$ なので $f'=0$、$f$ は定数（\ref{cx:cr-consequences} の 2）。
:::

::: problem {#cx:prob-cf-zeta}
$\operatorname{Re}z>1$ で $\zeta(z)\defeq\sum_{n\ge1}n^{-z}$（$n^{-z}\defeq e^{-z\log n}$）とおく。この級数が半平面 $\{\operatorname{Re}z>1\}$ で広義一様収束し、$\zeta$ が正則で $\zeta'(z)=-\sum_{n\ge2}(\log n)\,n^{-z}$ となることを示せ。
:::

::: solution
$|n^{-z}|=e^{-\operatorname{Re}z\log n}=n^{-\operatorname{Re}z}$。コンパクト集合 $K\subset\{\operatorname{Re}z>1\}$ の上で連続関数 $\operatorname{Re}z$ は最小値 $\sigma_{0}>1$ をとるので、$K$ 上 $|n^{-z}|\le n^{-\sigma_{0}}$ で、$\sum n^{-\sigma_{0}}<\infty$。M 判定法で $K$ 上一様収束する。各項 $e^{-z\log n}$ は整関数なので、\ref{cx:weierstrass-convergence} から $\zeta$ は正則で、項別微分 $(e^{-z\log n})'=-(\log n)e^{-z\log n}$ から主張の式。
:::
