# 基本事項（Basics of Complex Analysis）

複素微分とコーシー–リーマンの方程式、複素冪級数、初等関数と対数の分枝、複素線積分、コーシーの積分定理と積分公式、正則関数の基本性質（リウヴィル・一致の定理・最大値原理）、孤立特異点とローラン展開、リーマン球面（杉浦『解析入門 II』第 IX 章 §1〜§5 を参考）。

<p class="mn-msc">MSC2020: 30A</p>

## 前提知識

- [実関数 › 一変数の微積分](../../../26-real-functions/26A-functions-of-one-variable/02-calculus/index.html)（全体、11 ページ）：冪級数・複素指数関数・三角関数
- [実関数 › 多変数解析](../../../26-real-functions/26B-functions-of-several-variables/01-multivariable-calculus/index.html)（全体、11 ページ）：全微分と連鎖律
- [位相空間の基本的な性質 › 分離公理・コンパクト性・連結性](../../../54-general-topology/54D-general-properties/01-separation-compactness/index.html)（全体、18 ページ）：連結性・コンパクト性
