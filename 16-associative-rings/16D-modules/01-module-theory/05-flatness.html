# 平坦性の判定 {#mod:page-flatness keywords="flat module, character module, ideal criterion for flatness, torsion-free, faithfully flat module"}

テンソル積は右完全だが、単射を単射に移すとは限らない（\ref{ha:tensor-right-exact}）。$M\otimes-$ が単射も保つ加群を**平坦**という（\ref{ha:flat}）。定義と、Tor による判定・射影加群が平坦であることは \ref{ha:page-tensor-tor} で示した。このページでは、平坦性を**イデアルだけで判定する方法**（\ref{mod:flat-ideal-criterion}）を、指標加群（\ref{mod:character-module}）を使って示し、$\Z$ 上では平坦であることとねじれがないことが同値であることを導く（\ref{mod:flat-z}）。最後に、テンソル積が完全性を「反映」する**忠実平坦**な加群を特徴付ける（\ref{mod:faithfully-flat}）。局所化が平坦であることは、加群の局所化を導入する \ref{ring:page-local-properties} で扱う。

> Anderson–Fuller 第 5 章 §19、Atiyah–Macdonald 第 2 章・第 3 章の演習、松村『可換環論』§7 を参考にした。

## 記法と定義の確認 {#mod:sec-fl-notation}

::: notation
- $R$ は環。平坦性は右 $R$ 加群 $M$ について「$M\otimes_{R}-$ が単射を保つ」こととして定義する（\ref{ha:flat}）。可換環 $A$ では左右の区別はない。テンソル積と $\Hom$ の随伴は \ref{ha:tensor-hom-adjunction}：アーベル群 $Q$ について
$$
\Hom_{\Z}(M\otimes_{R}N,Q)\cong\Hom_{R}(N,\Hom_{\Z}(M,Q))
$$
が $N$ について自然に成り立つ（左辺の $\Hom_{\Z}(M,Q)$ は $(r\varphi)(m)\defeq\varphi(mr)$ で左 $R$ 加群）。
- $\Q/\Z$ は可除群なので入射的な $\Z$ 加群（\ref{ha:injective-divisible}）。ベールの判定法は \tref{ha:baer-criterion}。テンソル積の計算は \ref{mod:page-tensor-products}。
- **選択公理**：ベールの判定法（\ref{mod:flat-ideal-criterion} の証明）と、極大イデアルの存在（\ref{mod:faithfully-flat}）で使う。
:::

## 指標加群 {#mod:sec-fl-character}

::: definition 指標加群 {#mod:character-module keywords="character module, Pontryagin dual, M^* = Hom_Z(M, Q/Z)" index="指標加群|しひょうかぐん"}
右 $R$ 加群 $M$ について、$M^{\vee}\defeq\Hom_{\Z}(M,\Q/\Z)$ を $(r\varphi)(m)\defeq\varphi(mr)$ で左 $R$ 加群とみたものを、$M$ の**指標加群**という。準同型 $f:M\to M'$ は $f^{\vee}:M'^{\vee}\to M^{\vee}$, $\varphi\mapsto\varphi\circ f$ を誘導する。
:::

::: lemma 指標加群は単射と全射を入れ替える {#mod:character-exact keywords="Q/Z detects exactness, f injective iff f^vee surjective" index="指標加群と完全性|しひょうかぐんとかんぜんせい"}
アーベル群の準同型 $f:X\to Y$ について、$f$ が単射であることと $f^{\vee}:Y^{\vee}\to X^{\vee}$ が全射であることは同値である。
:::

::: proof
**Step 1（⇒）.** $\Q/\Z$ は入射的なので、単射 $f$ と $\chi\in X^{\vee}$ について $\psi\circ f=\chi$ となる $\psi\in Y^{\vee}$ がある（入射性の定義 \ref{mod:injective}）。

**Step 2（⇐）.** $f$ が単射でないとし、$0\neq x\in\Ker f$ をとる。巡回群 $\Z x$ から $\Q/\Z$ への準同型 $h$ で $h(x)\neq 0$ となるものがある：$\Z x\cong\Z$ なら $h(kx)\defeq k/2+\Z$、$\Z x\cong\Z/n\Z$（$n\ge 2$）なら $h(kx)\defeq k/n+\Z$。$\Q/\Z$ の入射性から $h$ を $\chi\in X^{\vee}$ に拡張する。任意の $\psi\in Y^{\vee}$ について $(\psi\circ f)(x)=\psi(0)=0\neq\chi(x)$ なので、$\chi\notin\im f^{\vee}$。

::: hypcheck
- **$\Q/\Z$ の入射性**：Step 1・2 の両方で使った（\ref{ha:injective-divisible}。ベールの判定法を通して選択公理を使う）。
- **$\Q/\Z$ の大きさ**：Step 2 では、任意の巡回群を $0$ でない値で「見分けられる」ことを使った。$\Q$ では偽：有限群から $\Q$ への準同型は $0$ だけなので、$\Hom(-,\Q)$ は有限群を区別できない。
:::
:::

::: theorem 平坦性と指標加群 {#mod:flat-character keywords="M is flat iff its character module is injective" index="平坦性と指標加群|へいたんせいとしひょうかぐん"}
右 $R$ 加群 $M$ が平坦であることと、左 $R$ 加群 $M^{\vee}$ が入射的であることは同値である。
:::

::: proof
**Step 1.** 左 $R$ 加群の単射 $g:N'\to N$ について、随伴の自然な同型（記法の欄）から、次の二つの写像は同型で対応する：
$$
(1\otimes g)^{\vee}:(M\otimes N)^{\vee}\to(M\otimes N')^{\vee},\qquad g^{*}:\Hom_{R}(N,M^{\vee})\to\Hom_{R}(N',M^{\vee}).
$$

**Step 2.** \ref{mod:character-exact} から、$1\otimes g$ が単射 $\iff(1\otimes g)^{\vee}$ が全射 $\iff g^{*}$ が全射。左は平坦性の条件、右は入射性の条件（\ref{mod:injective-characterization}）なので、すべての単射 $g$ について比べて主張を得る。
:::

## イデアルによる判定 {#mod:sec-fl-ideal}

::: theorem 平坦性のイデアルによる判定 {#mod:flat-ideal-criterion keywords="ideal criterion for flatness, M is flat iff I tensor M -> M is injective for finitely generated ideals" index="平坦性の判定法|へいたんせいのはんていほう"}
（AC）右 $R$ 加群 $M$ について、次は同値である。
1. $M$ は平坦。
2. $R$ の任意の左イデアル $\mathfrak{a}$ について、包含から誘導される $M\otimes_{R}\mathfrak{a}\to M\otimes_{R}R\cong M$ は単射。
3. 2 が有限生成の左イデアル $\mathfrak{a}$ について成り立つ。
:::

::: proof
**Step 1（1⇒2⇒3）.** 平坦性の定義と、2 が 3 を含むことから。

**Step 2（3⇒2）.** $u\in M\otimes\mathfrak{a}$ が $M$ で $0$ に移るとする。$u=\sum_{k=1}^{n}m_{k}\otimes a_{k}$（$a_{k}\in\mathfrak{a}$）と書き、$\mathfrak{b}\defeq Ra_{1}+\dots+Ra_{n}\subset\mathfrak{a}$ とおく。$u'\defeq\sum m_{k}\otimes a_{k}\in M\otimes\mathfrak{b}$ は包含 $\mathfrak{b}\to\mathfrak{a}$ で $u$ に、$\mathfrak{b}\to R$ で $u$ と同じ元に移る。3 から $u'=0$ なので $u=0$。

**Step 3（2⇒1）.** 2 と \ref{mod:character-exact} から、$(M\otimes R)^{\vee}\to(M\otimes\mathfrak{a})^{\vee}$ は全射。随伴の同型（\ref{mod:flat-character} の Step 1）で、これは $\Hom_{R}(R,M^{\vee})\to\Hom_{R}(\mathfrak{a},M^{\vee})$ が全射であること、すなわち左イデアルからの準同型が $R$ に拡張できることに対応する。\ref{ha:baer-criterion}から $M^{\vee}$ は入射的で、\ref{mod:flat-character} から $M$ は平坦。

::: hypcheck
- **選択公理**：Step 3 のベールの判定法と、\ref{mod:character-exact} の $\Q/\Z$ の入射性で使う。
- **3 の「有限生成」**：Step 2 では、$M\otimes\mathfrak{a}$ の元が有限和であることだけを使った。
:::
:::

::: theorem 整数上の平坦加群 {#mod:flat-z keywords="a Z-module is flat iff torsion-free" index="ねじれのない加群|ねじれのないかぐん, ねじれなし|ねじれなし"}
（AC）可換群 $M$ が平坦な $\Z$ 加群であることと、ねじれがない（$nm=0$, $n\neq 0$ なら $m=0$）ことは同値である。
:::

::: proof
**Step 1（⇒）.** $n\neq 0$ について $\Z\xrightarrow{n}\Z$ は単射なので、平坦性から $M\otimes\Z\xrightarrow{1\otimes n}M\otimes\Z$、すなわち（$M\otimes\Z\cong M$ で）$M\xrightarrow{n}M$ が単射。

**Step 2（⇐）.** $\Z$ の $0$ でないイデアルは $n\Z$（$n\ge 1$。\ref{ring:ideals-of-z}）で、$\Z\xrightarrow{n}n\Z$ は同型。合成 $M\otimes\Z\cong M\otimes n\Z\to M\otimes\Z$ は $1\otimes(n\text{ 倍})$、すなわち $M\xrightarrow{n}M$ で、ねじれがなければ単射。$\mathfrak{a}=0$ のときは $M\otimes 0=0$ で自明。\ref{mod:flat-ideal-criterion} から平坦。

::: hypcheck
- 鍵は「$\Z$ のイデアルは単項」なことで、同じ証明で **PID 上の加群は平坦 $\iff$ ねじれなし** が示せる（\ref{ring:pid}）。一般の整域では「平坦 ⇒ ねじれなし」だけが成り立つ（Step 1 は整域で通る）。逆は偽：体 $K$ 上の $A=K[x,y]$ のイデアル $(x,y)$ はねじれのない $A$ 加群だが、平坦でない（理由は、ネーター局所環上の有限生成平坦加群が自由であることと、$(x,y)$ を $(x,y)$ で局所化したものが二つの元で極小に生成されるのに階数が $1$ であることによる。\ref{ring:page-local-properties} の後で扱う）。
:::
:::

::: example
1. $\Q$ は平坦な $\Z$ 加群だが、射影的でない（\ref{mod:prob-q-not-free-projective}）。平坦は射影より真に弱い。
2. $\Z/n\Z$（$n\ge 2$）は平坦でない（ねじれがある。\ref{ha:flat-tor.3} とも一致）。
3. 体上のベクトル空間はすべて平坦（自由加群なので）。
:::

## 忠実平坦 {#mod:sec-fl-faithful}

::: theorem 忠実平坦な加群 {#mod:faithfully-flat keywords="faithfully flat module, M tensor N = 0 implies N = 0, mM != M for maximal m" index="忠実平坦|ちゅうじつへいたん"}
（AC）$A$ を可換環、$M$ を平坦な $A$ 加群とする。次は同値であり、これをみたす $M$ を**忠実平坦**という。
1. $A$ 加群の列 $N'\to N\to N''$ が完全であることと、$M\otimes_{A}N'\to M\otimes_{A}N\to M\otimes_{A}N''$ が完全であることは同値。
2. $M\otimes_{A}N=0$ なら $N=0$。
3. すべての極大イデアル $\mathfrak{m}$ について $\mathfrak{m}M\neq M$。
:::

::: proof
**Step 1（1⇒2）.** $M\otimes N=0$ なら、列 $0\to N\to 0$ に $M\otimes-$ を施した $0\to M\otimes N\to 0$ は完全。1 から $0\to N\to 0$ も完全で、$N=0$。

**Step 2（2⇒3）.** $M/\mathfrak{m}M\cong A/\mathfrak{m}\otimes_{A}M$（\ref{mod:tensor-quotient}）で、$A/\mathfrak{m}\neq 0$ なので 2 から $M/\mathfrak{m}M\neq 0$。

**Step 3（3⇒2）.** $N\neq 0$ とし、$0\neq x\in N$ をとる。$Ax\cong A/I$（$I=\operatorname{Ann}(x)\neq A$。\ref{mod:cyclic-module}）で、$I$ を含む極大イデアル $\mathfrak{m}$ がある（\ref{ring:maximal-ideal-existence}）。$M\otimes A/I\cong M/IM$ は全射 $M/IM\to M/\mathfrak{m}M\neq 0$ をもつので $0$ でない。平坦性から $M\otimes Ax\to M\otimes N$ は単射なので $M\otimes N\neq 0$。

**Step 4（2⇒1）.** 平坦性から $M\otimes-$ は完全関手なので、核・像・剰余を保つ：準同型 $h$ について $M\otimes\Ker h\cong\Ker(1\otimes h)$、$M\otimes\im h\cong\im(1\otimes h)$（$0\to\Ker h\to N\to\im h\to 0$ と $0\to\im h\to N''$ に $M\otimes-$ を施す）。$f:N'\to N$, $g:N\to N''$ で $M\otimes-$ を施した列が完全とする。$M\otimes\im(gf)\cong\im((1\otimes g)(1\otimes f))=0$ なので 2 から $\im(gf)=0$、すなわち $\im f\subset\Ker g$。$H\defeq\Ker g/\im f$ について $M\otimes H\cong\Ker(1\otimes g)/\im(1\otimes f)=0$ なので $H=0$。逆向き（元が完全なら施した列も完全）は平坦性から。

::: hypcheck
- **選択公理**：Step 3 で極大イデアルの存在に使った。
- **前提「$M$ は平坦」**：Step 3 の単射性と Step 4 で使った。平坦でない加群について 2 と 3 は同値でも 1 とは同値でない。
:::
:::

::: example
1. $0$ でない自由加群は忠実平坦（$A^{(I)}\otimes N\cong N^{(I)}$）。特に多項式環 $A[x]$ は $A$ 上忠実平坦。
2. $\Q$ は平坦だが忠実平坦でない：$\Q\otimes_{\Z}\Z/2\Z=0$（\ref{mod:tensor-examples.2}）。同様に $\Z_{(p)}$ は $q\neq p$ について $\Z_{(p)}\otimes\Z/q\Z=0$ なので忠実平坦でない。
3. 局所環の準同型 $(A,\mathfrak{m})\to(B,\mathfrak{n})$ が局所的（$\mathfrak{m}B\subset\mathfrak{n}$）で $B$ が平坦なら、3 から $B$ は忠実平坦（$\mathfrak{m}B\subset\mathfrak{n}\neq B$ で、極大イデアルは $\mathfrak{m}$ だけ）。完備化 $\hat A$ はこの典型例になる（\ref{ring:page-completion}）。
:::

::: supplement
**ラザールの定理.** 平坦加群は、有限生成自由加群の有向余極限（帰納極限）としてちょうど特徴付けられる（ラザール、1969 年）。有限表示の平坦加群は射影的であり、特にネーター環上の有限生成平坦加群は射影的である（松村『可換環論』の平坦性の章）。

**高い視点.** 忠実平坦性は、代数幾何で「降下」（$A\to B$ が忠実平坦なら、$A$ 上の対象を $B$ 上の対象と降下データで復元できる）の基礎になる。$\Spec B\to\Spec A$ が全射であることと、$B$ が平坦で $\mathfrak{m}B\neq B$ をみたすことの関係が、3 の条件の幾何的な意味である。
:::

## 問題 {#mod:sec-fl-problems}

::: problem {#mod:prob-flat-direct-sum}
右 $R$ 加群の族 $(M_{i})$ について、$\bigoplus_{i}M_{i}$ が平坦であることと、各 $M_{i}$ が平坦であることは同値であることを示せ。
:::

::: solution
$(\bigoplus M_{i})\otimes g\cong\bigoplus(M_{i}\otimes g)$（\ref{ha:projective-flat.1}、自然性）で、準同型の直和が単射であることと各成分が単射であることは同値（成分ごとに考えればよい）。
:::

::: problem {#mod:prob-flat-ring-ext}
可換環の準同型 $A\to B$ で $B$ が平坦な $A$ 加群とする。$A$ のイデアル $I,J$ について $(I\cap J)B=IB\cap JB$ を示せ。（平坦でないと偽になる例：$A=\Z[x]$, $B=\Z[x]/(x)\cong\Z$, $I=(2)$, $J=(x+2)$ を調べよ。）
:::

::: solution
**Step 1.** 完全列 $0\to I\cap J\to A\to A/I\oplus A/J$（$a\mapsto(\bar a,\bar a)$）に $B\otimes_{A}-$ を施すと、平坦性から $0\to B\otimes(I\cap J)\to B\to B/IB\oplus B/JB$ が完全（\ref{mod:tensor-quotient} と \ref{mod:extension-of-scalars.3}）。最後の写像の核は $IB\cap JB$。また $B\otimes(I\cap J)\to B$ の像は $(I\cap J)B$。よって $(I\cap J)B=IB\cap JB$。

**Step 2（反例）.** $\Z[x]$ で $I\cap J=(2)\cap(x+2)=(2(x+2))$（$\Z[x]$ は UFD で $2$ と $x+2$ は互いに素な既約元。\ref{ring:polynomial-ufd}）。$x\mapsto 0$ で $B=\Z$ に送ると $(I\cap J)B=(4)$、$IB\cap JB=(2)\cap(2)=(2)$ で一致しない。
:::
