# 加群 {#mod:page-modules keywords="module, left module, right module, submodule, quotient module, module homomorphism, isomorphism theorems for modules, annihilator, cyclic module, finitely generated module, direct sum, direct product, free module, basis, rank"}

**加群**は、ベクトル空間のスカラーを体から一般の環に取り替えたものである（\ref{mod:module}）。可換群は $\Z$ 上の加群であり、環のイデアルや剰余環も加群になる。体上の線形写像を一つ固定したベクトル空間は多項式環上の加群とみなせる。このページでは、加群・部分加群・剰余加群・準同型を定義して同型定理（\ref{mod:isomorphism-theorems}）を述べ、生成系と有限生成性、零化イデアルと巡回加群（\ref{mod:cyclic-module}）、直積と直和の普遍性（\ref{mod:direct-sum-universal}）、自由加群（\ref{mod:free-module}）を調べる。最後に、可換環上の自由加群の階数が一意に定まることを示す（\ref{mod:rank-invariance}）。

> 雪江明彦『代数学 2』第 2 章 §2.3–2.5 と Anderson–Fuller *Rings and Categories of Modules* 第 2 章を参考にした。加群の同型定理は群の同型定理（\ref{grp:page-homomorphism-theorems}）から導き、スカラー倍についての部分だけを新しく確かめる。

## 記法と定義の確認 {#mod:sec-mo-notation}

::: notation
- この系列（加群論）では、$R$ は単位元をもつ環で、**可換とは限らない**（\ref{ring:ring}）。可換環を仮定するときは $A$ と書き、その都度断る。環準同型・部分環・単元・$\End(M)$ は \ref{ring:page-rings-ideals} のもの。
- 群論から、可換群・部分群・剰余群・準同型定理・対応定理・第二・第三同型定理（\ref{grp:abelian-group}, \ref{grp:quotient-group}, \ref{grp:first-isomorphism}, \ref{grp:correspondence}, \ref{grp:second-isomorphism}, \ref{grp:third-isomorphism}）を加法的記法で使う。
- 集合 $I$ を添字とする族を $(m_{i})_{i\in I}$ と書く。「有限個を除いて $0$」を「ほとんどすべて $0$」という。
- **選択公理**：自由加群の階数の一意性（\ref{mod:rank-invariance}）で極大イデアルの存在（\ref{ring:maximal-ideal-existence}）を使う。それ以外では使わない。
:::

## 加群と準同型 {#mod:sec-mo-modules}

::: definition 加群 {#mod:module keywords="left module, right module, R-module, scalar multiplication, bimodule" index="加群|かぐん, 左加群|ひだりかぐん, 右加群|みぎかぐん, スカラー倍|すからーばい, 両側加群|りょうがわかぐん"}
$R$ を環とする。可換群 $(M,+)$ と写像 $R\times M\to M$, $(r,m)\mapsto rm$（**スカラー倍**）の組が、すべての $r,s\in R$, $m,n\in M$ について
1. $r(m+n)=rm+rn$,
2. $(r+s)m=rm+sm$,
3. $(rs)m=r(sm)$,
4. $1m=m$

をみたすとき、$M$ を**左 $R$ 加群**という。スカラー倍を右から $m r$ と書き、3 を $m(rs)=(mr)s$ に替えたものを**右 $R$ 加群**という。$R$ が可換なら左右の区別はなく（$mr\defeq rm$ とすれば右加群になる）、単に **$R$ 加群**という。以下、とくに断らなければ「加群」は左加群を指す。
:::

::: intuition
加群は「環の元を係数として掛けられる可換群」である。$R$ が体ならベクトル空間そのものだが、一般の環では $rm=0$ でも $r=0$ とも $m=0$ とも限らない（例えば $\Z$ 加群 $\Z/2\Z$ で $2\cdot 1=0$）。この「割り算ができない」ことが、加群の理論をベクトル空間の理論より豊かにしている。
:::

::: proposition 加群と環準同型 {#mod:module-as-homomorphism keywords="module structure is a ring homomorphism to End(M)" index="加群の構造|かぐんのこうぞう"}
可換群 $M$ の上の左 $R$ 加群の構造と、環準同型 $\rho:R\to\End(M)$ とは、$\rho(r)(m)=rm$ によって一対一に対応する。特に $M$ 上の $\Z$ 加群の構造はただ一つで、$nm$ は加法群での $n$ 倍である。
:::

::: proof
**Step 1.** 加群の公理 1 は「各 $\rho(r)$ が $M$ の加法群の自己準同型である」こと、2 は $\rho(r+s)=\rho(r)+\rho(s)$、3 は $\rho(rs)=\rho(r)\circ\rho(s)$、4 は $\rho(1)=\id_{M}$ にそれぞれ同値である（$\End(M)$ の積は合成。\ref{ring:ring} の後の例 4）。よって公理 1〜4 は「$\rho$ が $\End(M)$ に値をとる環準同型」と同値。

**Step 2.** $\Z$ からの環準同型はただ一つ（\ref{ring:z-initial}）で、それは $n\mapsto n\cdot\id_{M}$ なので、$nm$ は $m$ の $n$ 倍。
:::

::: example 加群の例 {#mod:module-examples}
1. 体 $K$ 上の加群は $K$ 上のベクトル空間である。
2. 可換群は $\Z$ 加群と同じものである（\ref{mod:module-as-homomorphism}）。
3. 環 $R$ は左からの積で左 $R$ 加群（これを $_{R}R$ と書く）、右からの積で右 $R$ 加群になる。$R^{n}$（成分ごとの和とスカラー倍）も左 $R$ 加群。
4. 可換環 $A$ のイデアル $I$ と剰余環 $A/I$ は、$A$ の積で $A$ 加群になる（$a(b+I)\defeq ab+I$）。
5. 環準同型 $\varphi:R\to S$ があれば、左 $S$ 加群 $N$ は $rn\defeq\varphi(r)n$ で左 $R$ 加群になる（**スカラーの制限**）。特に $S$ 自身が左 $R$ 加群になる。
6. 体 $K$ 上のベクトル空間 $V$ と線形写像 $T:V\to V$ について、$f\cdot v\defeq f(T)(v)$（$f\in K[x]$）とおくと $V$ は $K[x]$ 加群になる。実際、\ref{ring:polynomial-universal} を $K\to\End_{K}(V)$ と $T$ に使えば（$\End_{K}(V)$ の中で $K$ の像と $T$ は可換なので、可換な部分環 $K[T]$ の中で考えてよい）環準同型 $K[x]\to\End(V)$ が得られ、\ref{mod:module-as-homomorphism} から加群の構造になる。逆に $K[x]$ 加群は、$K$ 上のベクトル空間と $x$ の作用という線形写像の組である。
:::

::: proposition 加群の計算規則 {#mod:module-basic keywords="basic properties of modules, 0m = 0" index="加群の計算規則|かぐんのけいさんきそく"}
左 $R$ 加群 $M$ と $r\in R$, $m\in M$ について、$0m=0$、$r0=0$、$(-r)m=-(rm)=r(-m)$。
:::

::: proof
$0m=(0+0)m=0m+0m$ から $0m=0$。$r0=r(0+0)=r0+r0$ から $r0=0$。$rm+(-r)m=(r+(-r))m=0m=0$ から $(-r)m=-(rm)$、$rm+r(-m)=r(m+(-m))=r0=0$ から $r(-m)=-(rm)$。（\ref{ring:ring-basic} の 1・2 と同じ計算。）
:::

::: definition 部分加群・剰余加群・準同型 {#mod:submodule-homomorphism keywords="submodule, quotient module, module homomorphism, R-linear map, isomorphism of modules, kernel, image, cokernel, Hom" index="部分加群|ぶぶんかぐん, 剰余加群|じょうよかぐん, 準同型|じゅんどうけい, 線形写像|せんけいしゃぞう, 余核|よかく, 左イデアル|ひだりいである"}
$M,N$ を左 $R$ 加群とする。
1. 加法群 $M$ の部分群 $N'$ が $rn\in N'$（$r\in R$, $n\in N'$）をみたすとき、$N'$ を $M$ の**部分加群**という。$_{R}R$ の部分加群を $R$ の**左イデアル**という（可換環ではイデアルと同じ）。
2. 部分加群 $N'\subset M$ について、剰余群 $M/N'$ に $r(m+N')\defeq rm+N'$ でスカラー倍を入れたものを**剰余加群**という。
3. 写像 $f:M\to N$ が $f(m+m')=f(m)+f(m')$, $f(rm)=rf(m)$ をみたすとき、$f$ を **$R$ 準同型**（**$R$ 線形写像**）という。全単射な準同型を**同型**という。$\Ker f$, $\im f$ を核・像、$\operatorname{Coker}f\defeq N/\im f$ を**余核**という。準同型 $M\to N$ 全体を $\Hom_{R}(M,N)$ と書く。
:::

::: proposition 部分加群・剰余加群・準同型の基本性質 {#mod:submodule-basic keywords="quotient module is well-defined, kernel and image are submodules, Hom is an abelian group" index="剰余加群|じょうよかぐん"}
$M,N$ を左 $R$ 加群とする。
1. 部分集合 $N'\subset M$ が部分加群であることと、「$0\in N'$、$m,n\in N'\Rightarrow m+n\in N'$、$r\in R$, $n\in N'\Rightarrow rn\in N'$」は同値である。部分加群の族（空でない）の共通部分は部分加群である。
2. 剰余加群のスカラー倍は代表元によらず矛盾なく定まり、$M/N'$ は左 $R$ 加群で、自然な射影 $\pi:M\to M/N'$ は核 $N'$ の全射準同型である。
3. 準同型 $f:M\to N$ の核と像は部分加群で、$f$ が単射 $\iff\Ker f=0$。全単射な準同型の逆写像は準同型である。
4. $\Hom_{R}(M,N)$ は和 $(f+g)(m)\defeq f(m)+g(m)$ で可換群になる。$R=A$ が可換なら、$(af)(m)\defeq af(m)$ で $A$ 加群になる。
:::

::: proof
**Step 1（1）.** 部分群の判定（\ref{grp:subgroup-criterion}）と、$-n=(-1)n$（\ref{mod:module-basic}）から。共通部分は各条件が共通部分に引き継がれるので部分加群。

**Step 2（2）.** $m+N'=m'+N'$ なら $m-m'\in N'$ で、$rm-rm'=r(m-m')\in N'$。加群の公理は代表元で計算して $M$ の公理に帰着する。$\pi$ は加法とスカラー倍を保ち、核は $N'$（\ref{grp:quotient-group} の 3）。

**Step 3（3）.** 核・像が部分群であることと単射の判定は群準同型の性質（\ref{grp:homomorphism-basic} の 2・3）。$m\in\Ker f$ なら $f(rm)=rf(m)=0$、$f(m)\in\im f$ なら $rf(m)=f(rm)\in\im f$。逆写像：$f(f^{-1}(rn))=rn=rf(f^{-1}(n))=f(rf^{-1}(n))$ と $f$ の単射性から $f^{-1}(rn)=rf^{-1}(n)$。加法も同様。

**Step 4（4）.** $f+g$ が準同型であることは $(f+g)(rm)=rf(m)+rg(m)=r(f+g)(m)$ から。零写像が零元、$-f$ が逆元。可換な $A$ では $(af)(bm)=abf(m)=b(af)(m)$ なので $af$ も準同型で、加群の公理は $N$ の公理から。

::: hypcheck
- **4 の前提「可換」**：$(af)(bm)=a\,b\,f(m)$ を $b\,(a f(m))$ と書き直すのに $ab=ba$ を使った。非可換環では $af$ は一般に左 $R$ 準同型でなく、$\Hom_{R}(M,N)$ は単に可換群である（$M$ や $N$ が両側加群なら、そこから加群の構造が入る）。
:::
:::

::: theorem 加群の同型定理 {#mod:isomorphism-theorems keywords="first isomorphism theorem for modules, second isomorphism theorem, third isomorphism theorem, correspondence theorem for submodules, universal property of quotient module" index="準同型定理|じゅんどうけいていり, 同型定理|どうけいていり, 対応定理|たいおうていり"}
$M,N$ を左 $R$ 加群とする。
1. （剰余加群の普遍性）準同型 $f:M\to N$ と部分加群 $L\subset\Ker f$ について、$f=\bar f\circ\pi$ をみたす準同型 $\bar f:M/L\to N$ がただ一つある。
2. （準同型定理）準同型 $f:M\to N$ について $M/\Ker f\cong\im f$。
3. （第二同型定理）部分加群 $L,L'\subset M$ について $L+L'\defeq\{l+l'\}$ は部分加群で、$L/(L\cap L')\cong(L+L')/L'$。
4. （対応定理・第三同型定理）部分加群 $L\subset M$ について、$L$ を含む $M$ の部分加群 $L'$ と $M/L$ の部分加群は $L'\mapsto L'/L$ で包含を保って一対一に対応し、$(M/L)/(L'/L)\cong M/L'$。
:::

::: proof
**Step 1（方針）.** どの主張も、加法群としての対応する主張（\ref{grp:factor-through-quotient}, \ref{grp:first-isomorphism}, \ref{grp:second-isomorphism}, \ref{grp:correspondence}, \ref{grp:third-isomorphism}）がすでに成り立っている。そこで現れる写像がスカラー倍と可換であること、現れる部分群が部分加群であることを確かめればよい。

**Step 2（1・2）.** $\bar f(m+L)=f(m)$ について $\bar f(r(m+L))=\bar f(rm+L)=f(rm)=rf(m)=r\bar f(m+L)$。2 の同型はこの $\bar f$（$L=\Ker f$）の値域を $\im f$ に制限したもの。

**Step 3（3）.** $L+L'$ が部分加群であることは $r(l+l')=rl+rl'$ から。$L\to(L+L')/L'$, $l\mapsto l+L'$ は準同型（スカラー倍を保つ）で全射、核は $L\cap L'$。2 から主張を得る。

**Step 4（4）.** $L'/L=\pi(L')$ は準同型の像なので部分加群、$M/L$ の部分加群 $\bar L$ の逆像 $\pi^{-1}(\bar L)$ は部分加群（$r\pi^{-1}(\bar L)\subset\pi^{-1}(r\bar L)\subset\pi^{-1}(\bar L)$）。あとは加法群の対応定理。第三同型定理は合成 $M\to M/L\to(M/L)/(L'/L)$ の核が $L'$ であることと 2 から。
:::

## 生成系と巡回加群 {#mod:sec-mo-generation}

::: definition 生成された部分加群・有限生成 {#mod:generated-submodule keywords="submodule generated by a set, finitely generated module, cyclic module, generating set, linear combination" index="生成された部分加群|せいせいされたぶぶんかぐん, 有限生成|ゆうげんせいせい, 巡回加群|じゅんかいかぐん, 生成系|せいせいけい, 一次結合|いちじけつごう"}
左 $R$ 加群 $M$ の部分集合 $X$ を含む部分加群全体の共通部分を $RX$ または $\sum_{x\in X}Rx$ と書き、$X$ で**生成された部分加群**という。これは $X$ の元の**一次結合** $\sum_{k=1}^{n}r_{k}x_{k}$（$n\in\N$, $r_{k}\in R$, $x_{k}\in X$）全体に等しい（\ref{ring:generated-ideal} と同じ証明）。$M=RX$ のとき $X$ を $M$ の**生成系**という。有限な生成系をもつ加群を**有限生成**、一つの元で生成される加群 $Rm$ を**巡回加群**という。
:::

::: definition 零化イデアル {#mod:annihilator keywords="annihilator of an element, annihilator of a module, faithful module" index="零化イデアル|れいかいである, 零化域|れいかいき, 忠実な加群|ちゅうじつなかぐん"}
左 $R$ 加群 $M$ の元 $m$ について $\operatorname{Ann}(m)\defeq\{r\in R : rm=0\}$ を $m$ の**零化イデアル**、$\operatorname{Ann}(M)\defeq\{r\in R : \text{すべての }m\text{ で }rm=0\}$ を $M$ の**零化イデアル**という。$\operatorname{Ann}(m)$ は $R$ の左イデアル、$\operatorname{Ann}(M)$ は両側イデアルである。$\operatorname{Ann}(M)=0$ のとき $M$ は**忠実**であるという。
:::

::: proposition 巡回加群の構造 {#mod:cyclic-module keywords="cyclic module is isomorphic to R/Ann(m)" index="巡回加群|じゅんかいかぐん"}
左 $R$ 加群 $M$ の元 $m$ について、$r\mapsto rm$ は全射準同型 $_{R}R\to Rm$ で、核は $\operatorname{Ann}(m)$。したがって $Rm\cong R/\operatorname{Ann}(m)$。特に、巡回加群は $R/L$（$L$ は左イデアル）の形の加群に同型であり、可換環 $A$ 上の巡回加群は $A/I$（$I$ はイデアル）に同型である。
:::

::: proof
$(r+s)m=rm+sm$, $(sr)m=s(rm)$ から左 $R$ 加群の準同型で、像は $Rm=\{rm\}$、核は $\operatorname{Ann}(m)$（これにより左イデアルであることもわかる）。準同型定理（\ref{mod:isomorphism-theorems} の 2）から主張を得る。$\operatorname{Ann}(M)=\bigcap_{m}\operatorname{Ann}(m)$ は左イデアルで、$r\in\operatorname{Ann}(M)$, $s\in R$ なら $(rs)m=r(sm)=0$ なので右からの積でも閉じる。
:::

::: example
1. $\Z$ 加群 $\Z/n\Z$ は巡回加群で $\operatorname{Ann}=n\Z$。$\Q$ は有限生成でない $\Z$ 加群である：有限個の $a_{k}/b_{k}$ で生成される部分加群の元の分母は $b_{1}\cdots b_{k}$ を割り切るので、$1/(2b_{1}\cdots b_{k})$ を含まない。
2. $K[x]$ 加群としての $(V,T)$（\ref{mod:module-examples} の 6）で、$\operatorname{Ann}(V)$ は $f(T)=0$ となる多項式全体であり、$V$ が有限次元なら $0$ でない（ケイリー＝ハミルトンの定理）。その単項生成元が $T$ の最小多項式である。
:::

## 直積と直和 {#mod:sec-mo-sums}

::: definition 直積・直和 {#mod:direct-sum keywords="direct product of modules, direct sum of modules, external direct sum, internal direct sum" index="直積|ちょくせき, 直和|ちょくわ, 外部直和|がいぶちょくわ, 内部直和|ないぶちょくわ"}
左 $R$ 加群の族 $(M_{i})_{i\in I}$ について、
1. 直積集合 $\prod_{i}M_{i}$ に成分ごとの和とスカラー倍を入れた加群を**直積**という。
2. その部分集合 $\bigoplus_{i}M_{i}\defeq\{(m_{i})_{i} : \text{ほとんどすべての }i\text{ で }m_{i}=0\}$ は部分加群で、これを**直和**という。$I$ が有限なら直積と直和は一致する。
3. 包含 $\iota_{k}:M_{k}\to\bigoplus_{i}M_{i}$（$k$ 成分だけ $m$、他は $0$）と射影 $p_{k}:\prod_{i}M_{i}\to M_{k}$ は準同型である。
4. 加群 $M$ の部分加群の族 $(N_{i})$ について、和写像 $\bigoplus_{i}N_{i}\to M$, $(n_{i})\mapsto\sum_{i}n_{i}$ が同型のとき、$M$ は $(N_{i})$ の（**内部**）**直和**であるといい、$M=\bigoplus_{i}N_{i}$ と書く。
:::

::: theorem 直和と直積の普遍性 {#mod:direct-sum-universal keywords="universal property of direct sum, universal property of direct product, coproduct and product of modules" index="直和の普遍性|ちょくわのふへんせい, 直積の普遍性|ちょくせきのふへんせい"}
1. 準同型の族 $f_{i}:M_{i}\to N$ について、$f\circ\iota_{i}=f_{i}$（すべての $i$）をみたす準同型 $f:\bigoplus_{i}M_{i}\to N$ がただ一つあり、$f((m_{i}))=\sum_{i}f_{i}(m_{i})$ で与えられる。
2. 準同型の族 $g_{i}:N\to M_{i}$ について、$p_{i}\circ g=g_{i}$ をみたす準同型 $g:N\to\prod_{i}M_{i}$ がただ一つあり、$g(n)=(g_{i}(n))_{i}$ で与えられる。
3. $M$ の部分加群 $N_{1},N_{2}$ について、$M=N_{1}\oplus N_{2}$（内部直和）であることと、$N_{1}+N_{2}=M$ かつ $N_{1}\cap N_{2}=0$ であることは同値である。
:::

::: proof
**Step 1（1）.** $(m_{i})\in\bigoplus M_{i}$ は有限個の $\iota_{i}(m_{i})$ の和なので、$f$ が存在すれば $f((m_{i}))=\sum f(\iota_{i}(m_{i}))=\sum f_{i}(m_{i})$（有限和）で一意。逆にこの式で定めた $f$ は準同型で、$f\circ\iota_{i}=f_{i}$。

**Step 2（2）.** $p_{i}\circ g=g_{i}$ は $g(n)$ の $i$ 成分が $g_{i}(n)$ であることなので、$g$ は一意でこの式で与えられ、成分ごとに準同型。

**Step 3（3）.** 和写像 $s:N_{1}\oplus N_{2}\to M$ は準同型で、像は $N_{1}+N_{2}$、核は $\{(n,-n) : n\in N_{1}\cap N_{2}\}$。よって $s$ が全単射 $\iff N_{1}+N_{2}=M$ かつ $N_{1}\cap N_{2}=0$。

::: hypcheck
- **1 で直和に限ること**：Step 1 で和が有限和になることに使った。直積からは一般にこの形の準同型は作れない（無限和は定義されない）。逆に 2 で直和を使うと、$g(n)$ がほとんどすべての成分で $0$ とは限らないので、$g$ が直和に値をとらない。
:::
:::

::: example
1. $\Z/6\Z=2\Z/6\Z\oplus 3\Z/6\Z$（内部直和）：$2\cdot 2+3\cdot(-1)=1$ なので和は全体で、共通部分は $6$ の倍数の類だけで $0$。これは中国剰余定理（\ref{ring:chinese-remainder}）の加群版である。
2. $\Z$ は二つの $0$ でない部分加群の直和にならない：$m\Z\cap n\Z\ni mn\neq 0$。
:::

## 自由加群 {#mod:sec-mo-free}

::: definition 一次独立・基底・自由加群 {#mod:free-module keywords="linearly independent, basis, free module, R^{(I)}" index="一次独立|いちじどくりつ, 基底|きてい, 自由加群|じゆうかぐん"}
左 $R$ 加群 $M$ の元の族 $(x_{i})_{i\in I}$ について、
1. 「ほとんどすべて $0$ の $(r_{i})$ について $\sum_{i}r_{i}x_{i}=0$ なら、すべての $r_{i}=0$」のとき、$(x_{i})$ は**一次独立**であるという。
2. 一次独立な生成系を**基底**という。基底をもつ加群を**自由加群**という。
3. 直和 $R^{(I)}\defeq\bigoplus_{i\in I}R$ の元 $e_{i}\defeq\iota_{i}(1)$ は基底をなす（**標準基底**）。$I=\{1,\dots,n\}$ のとき $R^{n}$ と書く。
:::

::: theorem 自由加群の普遍性 {#mod:free-module-universal keywords="universal property of free module, every module is a quotient of a free module" index="自由加群の普遍性|じゆうかぐんのふへんせい"}
$F$ を基底 $(x_{i})_{i\in I}$ をもつ自由左 $R$ 加群とする。
1. 任意の左 $R$ 加群 $N$ と元の族 $(n_{i})_{i\in I}$ について、$f(x_{i})=n_{i}$ をみたす準同型 $f:F\to N$ がただ一つある。
2. $F\cong R^{(I)}$（$x_{i}\leftrightarrow e_{i}$）。
3. 任意の左 $R$ 加群 $M$ は自由加群の剰余加群に同型である。$M$ が $n$ 個の元で生成されるなら、$R^{n}$ の剰余加群に同型である。
:::

::: proof
**Step 1（1）.** $F$ の元は $\sum r_{i}x_{i}$（ほとんどすべての $r_{i}=0$）と書け、一次独立性から係数 $(r_{i})$ は一意（$\sum r_{i}x_{i}=\sum r'_{i}x_{i}$ なら $\sum(r_{i}-r'_{i})x_{i}=0$）。よって $f(\sum r_{i}x_{i})\defeq\sum r_{i}n_{i}$ は矛盾なく定まる準同型で、一意性は $f$ が $x_{i}$ の値で決まることから。

**Step 2（2）.** 1 で $N=R^{(I)}$, $n_{i}=e_{i}$ として $f:F\to R^{(I)}$、逆向きに $g:R^{(I)}\to F$, $e_{i}\mapsto x_{i}$（$R^{(I)}$ も自由加群なので 1 が使える）を作ると、$g\circ f$ と $\id_{F}$ はともに $x_{i}\mapsto x_{i}$ をみたすので 1 の一意性から等しい。$f\circ g=\id$ も同様。

**Step 3（3）.** $M$ の生成系 $(m_{i})_{i\in I}$（例えば $M$ の元全体）をとり、1 で $f:R^{(I)}\to M$, $e_{i}\mapsto m_{i}$ を作る。像は $m_{i}$ を含む部分加群なので $M$ に等しく、準同型定理から $M\cong R^{(I)}/\Ker f$。
:::

::: example
1. 体上のベクトル空間は基底をもつ（有限生成なら有限の基底。一般の場合は選択公理を使う：\ref{mod:semisimple-closure} の 2）ので自由加群である。
2. $\Z/n\Z$（$n\ge 2$）は自由 $\Z$ 加群でない：$n\cdot x=0$ なので、どの元も一次独立でなく、基底は空集合しかありえないが、空集合は $0$ でない加群を生成しない。
3. $\Q$ は自由 $\Z$ 加群でない：二つの元 $a/b,c/d$ は $(bc)\frac{a}{b}-(ad)\frac{c}{d}=0$ をみたすので、基底は一元以下だが、一元 $q$ で生成される $\Z q$ は $q/2$ を含まない。
4. 可換環 $A$ のイデアル $I$ が自由 $A$ 加群であることと、$I=0$ または $I=aA$（$a$ は零因子でない）は同値である。二つの元 $a,b\in I$ は $b\cdot a-a\cdot b=0$ をみたすからである。例えば $\Z[x]$ のイデアル $(2,x)$ は自由でない（単項でないことは \ref{ring:page-euclid-pid-ufd} で示す）。
:::

::: theorem 可換環上の自由加群の階数 {#mod:rank-invariance keywords="invariant basis number, rank of a free module over a commutative ring" index="階数|かいすう, 自由加群の階数|じゆうかぐんのかいすう"}
（AC）$A$ を零環でない可換環とする。$A^{(I)}\cong A^{(J)}$ なら $I$ と $J$ の濃度は等しい。この濃度を自由加群の**階数**という。
:::

::: proof
**Step 1（剰余体に落とす）.** 極大イデアル $\mathfrak{m}$ をとり（\ref{ring:maximal-ideal-existence}）、$k=A/\mathfrak{m}$ とおく。$A$ 加群 $M$ について $\mathfrak{m}M\defeq\{\sum a_{l}m_{l} : a_{l}\in\mathfrak{m}\}$ は部分加群で、$M/\mathfrak{m}M$ は $(a+\mathfrak{m})(m+\mathfrak{m}M)\defeq am+\mathfrak{m}M$ により $k$ 上のベクトル空間になる（$a-a'\in\mathfrak{m}$ なら $am-a'm\in\mathfrak{m}M$）。同型 $\varphi:M\cong M'$ は $\varphi(\mathfrak{m}M)=\mathfrak{m}M'$ をみたすので、$k$ 上の線形同型 $M/\mathfrak{m}M\cong M'/\mathfrak{m}M'$ を誘導する。

**Step 2（$A^{(I)}/\mathfrak{m}A^{(I)}\cong k^{(I)}$）.** 成分ごとの射影 $A^{(I)}\to k^{(I)}$ は全射で、核は「すべての成分が $\mathfrak{m}$ に属する」元全体、すなわち $\mathfrak{m}A^{(I)}$（そのような元 $\sum a_{i}e_{i}$ は $a_{i}\in\mathfrak{m}$ なので $\mathfrak{m}A^{(I)}$ に属し、逆も明らか）。

**Step 3（ベクトル空間の次元）.** 以上から $k^{(I)}\cong k^{(J)}$（$k$ 上の線形同型）。体上のベクトル空間の基底の濃度は一定である（\ref{mod:vector-space-dimension}。その証明は階数の一意性を使わないので循環しない）ので、$\abs{I}=\abs{J}$。

::: hypcheck
- **前提「可換」**：Step 1 で $\mathfrak{m}M$ が部分加群で $M/\mathfrak{m}M$ が $A/\mathfrak{m}$ 上のベクトル空間になることに使った（$a(bm)=(ab)m$ を $\mathfrak{m}$ の元の位置を入れ替えて使う）。非可換環では偽：体 $K$ 上の可算無限次元ベクトル空間 $V$（基底 $e_{0},e_{1},\dots$）と $R=\End_{K}(V)$ について、左 $R$ 加群として $R\cong R^{2}$ となる。実際、$e_{n}\mapsto(e_{n/2},0)$（$n$ 偶数）、$(0,e_{(n-1)/2})$（$n$ 奇数）は線形同型 $\theta\colon V\to V\oplus V$ を定める。$f\mapsto f\circ\theta^{-1}$ は全単射 $\Hom_{K}(V,V)\to\Hom_{K}(V\oplus V,V)$、$g\mapsto(g\circ\iota_{1},g\circ\iota_{2})$ は全単射 $\Hom_{K}(V\oplus V,V)\to\Hom_{K}(V,V)^{2}$ で、どちらも左からの合成 $r\circ-$（$r\in R$）と可換なので、合成は左 $R$ 加群の同型 $R\cong R^{2}$ である。
- **前提「零環でない」**：零環上では $A^{(I)}=0$ がどの $I$ でも成り立つ。
- **選択公理**：Step 1 の極大イデアルの存在に使った。$I$ が有限なら、Step 3 は有限次元の線形代数で済む。
:::
:::

::: lemma 一次従属性 {#mod:span-dependence keywords="m+1 vectors in a space spanned by m vectors are linearly dependent" index="一次従属|いちじじゅうぞく"}
体 $k$ 上のベクトル空間 $V$ が $m$ 個の元 $u_{1},\dots,u_{m}$ で張られるなら、$V$ の $m+1$ 個の元は一次従属である。
:::

::: proof
$m$ についての帰納法。$m=0$ なら $V=0$ で、$v_{1}=0$ について $1\cdot v_{1}=0$。$m\ge 1$ とし、$v_{1},\dots,v_{m+1}\in V$ を $v_{i}=\sum_{l}c_{il}u_{l}$ と書く。

**Step 1（$u_{m}$ の係数がすべて $0$）.** $v_{1},\dots,v_{m}$ は $u_{1},\dots,u_{m-1}$ の張る空間に入り、帰納法の仮定から一次従属。$v_{m+1}$ の係数を $0$ とすればよい。

**Step 2（消去）.** 番号を付け替えて $c_{m+1,m}\neq 0$ とし、$w_{i}\defeq v_{i}-c_{i,m}c_{m+1,m}^{-1}v_{m+1}$（$i\le m$）とおくと、$w_{i}$ の $u_{m}$ の係数は $0$。帰納法の仮定から、すべては $0$ でない $\lambda_{1},\dots,\lambda_{m}$ で $\sum\lambda_{i}w_{i}=0$。すると $\sum_{i\le m}\lambda_{i}v_{i}-\bigl(\sum_{i\le m}\lambda_{i}c_{i,m}c_{m+1,m}^{-1}\bigr)v_{m+1}=0$ で、係数はすべては $0$ でない。
:::

::: theorem ベクトル空間の次元 {#mod:vector-space-dimension keywords="dimension of a vector space is well-defined, Steinitz exchange" index="次元|じげん, 交換定理|こうかんていり"}
体 $k$ 上のベクトル空間の二つの基底 $B,B'$ について $\abs{B}=\abs{B'}$。（無限の場合は選択公理を使う。）
:::

::: proof
**Step 1（有限の場合）.** $\abs{B}=m$ が有限なら、$B'$ の元はどの $m+1$ 個も一次独立なので、\ref{mod:span-dependence} から $B'$ は $m+1$ 個の元を含まない：$\abs{B'}\le m$。特に $B'$ も有限で、対称に $m\le\abs{B'}$。

**Step 2（無限の場合）.** Step 1 から $B,B'$ はともに無限。各 $b'\in B'$ を $B$ の一次結合で書いたとき係数が $0$ でない $B$ の元の有限集合を $F(b')$ とする。$\bigcup_{b'\in B'}F(b')=B$：そうでなければ $b\in B$ がどの $F(b')$ にも入らず、$B'$ は $B\setminus\{b\}$ の張る空間に含まれ、$b$ もそこに入るので $b$ は $B\setminus\{b\}$ の一次結合になり、$B$ の一次独立性に反する。

**Step 3（濃度の計算）.** 各 $F(b')$ は有限なので、$\abs{B}\le\abs{B'}\otimes\aleph_{0}\le\abs{B'}\otimes\abs{B'}=\abs{B'}$（選択公理で各 $F(b')$ の数え上げを選ぶ。ヘッセンベルクの定理 \ref{set:kappa-times-kappa}）。対称に $\abs{B'}\le\abs{B}$ で、カントール＝ベルンシュタインの定理から等しい。
:::

::: supplement
**高い視点.** 加群の圏 $R\text{-}\mathbf{Mod}$ で、直和は**余積**、直積は**積**である（\ref{mod:direct-sum-universal}。\ref{cat:product}, \ref{cat:coequalizer} の定義を参照）。自由加群 $R^{(I)}$ は集合 $I$ から作られる「自由な対象」で、忘却関手 $R\text{-}\mathbf{Mod}\to\mathbf{Set}$ の左随伴（\ref{cat:adjunction}）の値である（\ref{mod:free-module-universal} の 1 がまさに随伴の単位の普遍性）。\ref{mod:module-as-homomorphism} は「左 $R$ 加群とは、$R$ を一つの対象の前加法圏とみたときの、可換群の圏への加法関手である」とも言い換えられ、アーベル圏の埋め込み定理（\ref{ha:freyd-mitchell}）につながる。
:::

## 問題 {#mod:sec-mo-problems}

::: problem {#mod:prob-hom-z}
可換群（$\Z$ 加群）について、$\Hom_{\Z}(\Z/m\Z,\Z/n\Z)\cong\Z/\gcd(m,n)\Z$ を示せ。
:::

::: solution
**Step 1.** $\Z/m\Z$ は $1$ で生成される巡回加群なので、準同型 $f$ は $f(1)=y$ で決まり、$m y=f(m\cdot 1)=0$ が必要。逆に $my=0$ なら、$\Z\to\Z/n\Z$, $k\mapsto ky$ は $m\Z$ を $0$ に送るので、剰余加群の普遍性から $f$ ができる。よって $\Hom\cong\{y\in\Z/n\Z : my=0\}$（$f\mapsto f(1)$ は和を保つ）。

**Step 2.** $d=\gcd(m,n)$ とする。$y=c+n\Z$ について $my=0\iff n\mid mc\iff\frac{n}{d}\mid\frac{m}{d}c\iff\frac{n}{d}\mid c$（$\gcd(\frac{m}{d},\frac{n}{d})=1$ とユークリッドの補題）。よってこの部分群は $\frac{n}{d}$ の類で生成される位数 $d$ の巡回群で、$\Z/d\Z$ に同型。
:::

::: problem {#mod:prob-torsion-submodule}
$A$ を整域、$M$ を $A$ 加群とする。$T(M)\defeq\{m\in M : \operatorname{Ann}(m)\neq 0\}$（**ねじれ元**全体）は部分加群で、$M/T(M)$ のねじれ元は $0$ だけであることを示せ。整域でないと $T(M)$ が部分加群にならない例を挙げよ。
:::

::: solution
**Step 1.** $0\in T(M)$。$am=0$, $bn=0$（$a,b\neq 0$）なら $ab\neq 0$（整域）で $ab(m+n)=0$、$a(cm)=c(am)=0$。よって部分加群。

**Step 2.** $a(m+T(M))=0$（$a\neq 0$）なら $am\in T(M)$ で、$b(am)=0$（$b\neq 0$）。$ba\neq 0$ なので $m\in T(M)$。

**Step 3.** $A=\Z/6\Z$ 自身を $A$ 加群とみると、$2$（$3\cdot 2=0$）と $3$（$2\cdot 3=0$）はねじれ元だが、和 $5$ は単元なので $\operatorname{Ann}(5)=0$。
:::

::: problem {#mod:prob-k-x-modules}
体 $K$ 上の有限次元ベクトル空間 $V$ と線形写像 $T$ からなる $K[x]$ 加群 $(V,T)$, $(V',T')$ が同型であることと、$T'=\phi T\phi^{-1}$ となる線形同型 $\phi:V\to V'$ があることは同値であることを示せ。
:::

::: solution
$K[x]$ 準同型 $\phi:V\to V'$ は、$K$ 線形で $\phi(x\cdot v)=x\cdot\phi(v)$、すなわち $\phi T=T'\phi$ をみたす写像である（$x$ の作用で決まれば $f(x)$ の作用も保つ）。同型なら $T'=\phi T\phi^{-1}$。逆にこの条件をみたす線形同型は $K[x]$ 準同型で全単射なので同型。（したがって、行列の相似類の分類は $K[x]$ 加群の同型類の分類に帰着する。これが PID 上の加群の構造定理（\ref{mod:page-pid-modules}）からジョルダン標準形を導く道筋である。）
:::
