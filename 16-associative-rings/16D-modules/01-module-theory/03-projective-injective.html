# 射影加群と入射加群 {#mod:page-projective-injective keywords="projective module, injective module, Baer's criterion, divisible group, enough injectives, enough projectives, coinduced module"}

$\Hom_{R}(X,-)$ と $\Hom_{R}(-,X)$ は左完全だが右完全ではない（\ref{mod:hom-left-exact}, \ref{mod:hom-not-right-exact}）。これが完全になる特別な加群が**射影加群**（\ref{mod:projective}）と**入射加群**（\ref{mod:injective}）である。射影加群は自由加群の直和因子として特徴付けられ（\ref{mod:projective-characterization}）、入射加群はベールの判定法（\ref{mod:baer}）によってイデアルについての条件に帰着する。$\Z$ 上では入射加群は可除群のことで（\ref{mod:z-injective-divisible}）、これを使って任意の加群が入射加群に埋め込めることを示す（\ref{mod:enough-injectives}）。この二つの事実（射影加群・入射加群が「十分ある」こと）は、導来関手を定義する出発点である（\ref{ha:page-derived-functors}）。

> Anderson–Fuller 第 5 章 §16–18 と、雪江『代数学 3』のホモロジー代数の準備の流れを参考にした。ベールの判定法の証明は、ツォルンの補題の使い方を明示して書き直した。

## 記法と定義の確認 {#mod:sec-pi-notation}

::: notation
- $R$ は環（可換とは限らない）、加群は左 $R$ 加群。完全列・分裂補題・$\Hom$ の左完全性は \ref{mod:exact-sequence}, \ref{mod:splitting-lemma}, \ref{mod:hom-left-exact}、自由加群とその普遍性は \ref{mod:free-module}, \ref{mod:free-module-universal}、直和と直積は \ref{mod:direct-sum-universal}, \ref{mod:hom-sum-product}。
- **選択公理**：ベールの判定法（\ref{mod:baer}）と、それに依存する主張でツォルンの補題（\ref{set:zorn}）を使う。射影加群についての主張は使わない。
:::

## 射影加群 {#mod:sec-pi-projective}

::: definition 射影加群 {#mod:projective keywords="projective module, lifting property" index="射影加群|しゃえいかぐん, 持ち上げ|もちあげ"}
左 $R$ 加群 $P$ が次をみたすとき**射影加群**という：任意の全射準同型 $g:M\to N$ と準同型 $h:P\to N$ に対し、$g\circ\tilde h=h$ となる準同型 $\tilde h:P\to M$（$h$ の**持ち上げ**）がある。
$$
\begin{CD}
@. P\\
@. @VV{h}V\\
M @>{g}>> N @>>> 0
\end{CD}
$$
（$\tilde h$ は図式の $P$ から $M$ への斜めの矢印にあたる。）
:::

::: theorem 射影加群の特徴付け {#mod:projective-characterization keywords="characterizations of projective modules, direct summand of free module, Hom(P,-) exact" index="射影加群の特徴付け|しゃえいかぐんのとくちょうづけ"}
左 $R$ 加群 $P$ について、次は同値である。
1. $P$ は射影加群。
2. $\Hom_{R}(P,-)$ は完全：短完全列 $0\to L\to M\to N\to 0$ を短完全列に移す。
3. $P$ で終わる短完全列 $0\to L\to M\to P\to 0$ はすべて分裂する。
4. $P$ はある自由加群の直和因子である（ある加群 $Q$ で $P\oplus Q$ が自由加群になる）。
:::

::: proof
**Step 1（1⇔2）.** \ref{mod:hom-left-exact} の 1 から、2 は「$g_{*}:\Hom(P,M)\to\Hom(P,N)$ が全射」と同値で、これは 1 そのもの。

**Step 2（1⇒3）.** $0\to L\to M\xrightarrow{g}P\to 0$ について、1 を $h=\id_{P}$ に使うと $g\circ s=\id_{P}$ となる $s$ があり、分裂補題（\ref{mod:splitting-lemma}）から分裂する。

**Step 3（3⇒4）.** $P$ の元全体で生成系をとり、自由加群 $F=R^{(P)}$ からの全射 $g:F\to P$ を作る（\ref{mod:free-module-universal} の 3）。$0\to\Ker g\to F\to P\to 0$ は 3 から分裂し、分裂補題から $F\cong\Ker g\oplus P$。

**Step 4（自由加群は射影）.** 基底 $(x_{i})$ をもつ自由加群 $F$ と全射 $g:M\to N$、$h:F\to N$ について、各 $i$ で $g(m_{i})=h(x_{i})$ となる $m_{i}$ を選び、自由加群の普遍性で $\tilde h(x_{i})\defeq m_{i}$ とする。$g\tilde h$ と $h$ は基底上で一致するので等しい。

**Step 5（4⇒1）.** $F=P\oplus Q$ が自由とし、$\iota:P\to F$, $p:F\to P$ を包含と射影とする。$g:M\to N$ 全射、$h:P\to N$ について、Step 4 から $h\circ p:F\to N$ の持ち上げ $k:F\to M$（$gk=hp$）があり、$\tilde h\defeq k\circ\iota$ とおくと $g\tilde h=hp\iota=h$。

::: hypcheck
- **選択公理**：Step 4 で各 $i$ について $m_{i}$ を選ぶのに、基底が無限なら選択公理を使う。有限生成の自由加群なら有限個の選択で済む。（射影加群の理論を選択公理なしで展開すると、自由加群が射影的でないことが起こりうる。）
:::
:::

::: example 射影加群の例 {#mod:projective-examples}
1. 自由加群は射影加群（上の証明の Step 4）。
2. $\Z/6\Z\cong\Z/2\Z\oplus\Z/3\Z$（\ref{ring:crt-integers}）なので、$\Z/2\Z$ は $\Z/6\Z$ 上の射影加群だが、自由ではない（自由な $\Z/6\Z$ 加群の元の個数は $6^{n}$ か無限）。より一般に冪等元 $e$ について $Re$ は射影的な左 $R$ 加群（$R=Re\oplus R(1-e)$）。
3. $\Z/n\Z$（$n\ge 2$）は射影的な $\Z$ 加群でない：$0\to\Z\xrightarrow{n}\Z\to\Z/n\Z\to 0$ が分裂しない（\ref{mod:non-split-example} と同じ議論）。$\Q$ も射影的でない（問題 \ref{mod:prob-q-not-free-projective}）。
4. 射影加群の族の直和は射影加群（$\Hom(\bigoplus P_{i},-)\cong\prod\Hom(P_{i},-)$（\ref{mod:hom-sum-product}）で、全射の直積は全射）。
:::

::: supplement
**局所環と PID の場合.** 可換局所環上の有限生成射影加群は自由である（中山の補題を使う。\ref[分数加群と局所的性質]{ring:page-local-properties} の後に扱う）。PID 上の射影加群は自由である（有限生成なら \ref[PID 上の有限生成加群]{mod:page-pid-modules} の構造定理から）。体 $K$ 上の多項式環 $K[x_{1},\dots,x_{n}]$ 上の有限生成射影加群が自由であることはセールの問題として知られ、キレンとススリンが 1976 年に独立に肯定的に解決した。
:::

## 入射加群 {#mod:sec-pi-injective}

::: definition 入射加群 {#mod:injective keywords="injective module, extension property" index="入射加群|にゅうしゃかぐん, 単射加群|たんしゃかぐん, 拡張|かくちょう"}
左 $R$ 加群 $E$ が次をみたすとき**入射加群**という：任意の単射準同型 $f:L\to M$ と準同型 $h:L\to E$ に対し、$\tilde h\circ f=h$ となる準同型 $\tilde h:M\to E$（$h$ の**拡張**）がある。
:::

::: proposition 入射加群の特徴付け {#mod:injective-characterization keywords="Hom(-,E) exact, every exact sequence starting with E splits, product of injectives, direct summand of injective" index="入射加群の特徴付け|にゅうしゃかぐんのとくちょうづけ"}
左 $R$ 加群 $E$ について、次は同値である。
1. $E$ は入射加群。
2. $\Hom_{R}(-,E)$ は短完全列を短完全列に移す。

また、入射加群なら、$E$ で始まる短完全列 $0\to E\to M\to N\to 0$ はすべて分裂する（逆も成り立つ。\ref{mod:injective-split-criterion}）。入射加群の族の直積と、入射加群の直和因子は入射加群である。
:::

::: proof
**Step 1（1⇔2）.** \ref{mod:hom-left-exact} の 2 から、2 は「単射 $f$ について $f^{*}:\Hom(M,E)\to\Hom(L,E)$ が全射」と同値で、これは 1。

**Step 2（分裂）.** $0\to E\xrightarrow{f}M\to N\to 0$ について、1 を $h=\id_{E}$ に使うと $r\circ f=\id_{E}$ となる $r$ があり、分裂補題から分裂。

**Step 3（直和因子）.** $I=E\oplus E'$ が入射的とし、$\iota:E\to I$, $p:I\to E$ を包含と射影とする。単射 $f:L\to M$ と $h:L\to E$ について、$\iota\circ h$ の拡張 $k:M\to I$ をとり $\tilde h\defeq p\circ k$ とおくと $\tilde hf=p\iota h=h$。

**Step 4（直積）.** $\Hom(-,\prod E_{i})\cong\prod\Hom(-,E_{i})$（\ref{mod:hom-sum-product}）で、全射の直積は全射。
:::

::: theorem ベールの判定法 {#mod:baer keywords="Baer's criterion for injectivity" index="ベールの判定法|べーるのはんていほう"}
（AC）左 $R$ 加群 $E$ が入射加群であることと、次は同値である：$R$ の任意の左イデアル $\mathfrak{a}$ と準同型 $h:\mathfrak{a}\to E$ に対し、$h$ は準同型 $R\to E$ に拡張できる（すなわち $h(a)=ae$ となる $e\in E$ がある）。
:::

::: intuition
入射性は「すべての部分加群からの拡張」を要求するが、ベールの判定法は「$R$ の左イデアルからの拡張」だけを調べればよいと言っている。拡張を一つの元ずつ大きくしていき、ツォルンの補題で全体まで延ばすのが証明の筋道である。
:::

::: proof
**Step 1（⇒）.** 包含 $\mathfrak{a}\to R$ は単射なので、入射性の定義から。拡張 $\tilde h:R\to E$ について $e\defeq\tilde h(1)$ とおくと $h(a)=\tilde h(a\cdot 1)=a\tilde h(1)=ae$。

**Step 2（⇐：拡張の族）.** 単射 $f:L\to M$ と $h:L\to E$ が与えられたとする。$f(L)\cong L$ なので、$L\subset M$（部分加群）, $f$ は包含としてよい。$\Sigma$ を、$L\subset N\subset M$ となる部分加群 $N$ と $h$ の拡張 $k:N\to E$ の組 $(N,k)$ 全体とし、$(N,k)\le(N',k')\iff N\subset N'$ かつ $k'|_{N}=k$ で半順序を入れる。$(L,h)\in\Sigma$ なので空でない。

**Step 3（⇐：鎖の上界）.** $\Sigma$ の空でない鎖 $\{(N_{\lambda},k_{\lambda})\}$ について、$N\defeq\bigcup N_{\lambda}$ は（鎖の和集合なので）部分加群で、$k(x)\defeq k_{\lambda}(x)$（$x\in N_{\lambda}$）は鎖の条件から $\lambda$ の取り方によらず定まる準同型。$(N,k)$ は上界。ツォルンの補題（\ref{set:zorn}）から極大元 $(N_{0},k_{0})$ がある。

**Step 4（⇐：$N_{0}=M$）.** $N_{0}\neq M$ と仮定し、$m\in M\setminus N_{0}$ をとる。$\mathfrak{a}\defeq\{r\in R : rm\in N_{0}\}$ は $R$ の左イデアルで、$\phi:\mathfrak{a}\to E$, $\phi(r)\defeq k_{0}(rm)$ は準同型。仮定から $\phi(r)=re$ となる $e\in E$ がある。$N_{1}\defeq N_{0}+Rm$ 上で
$$
k_{1}(x+rm)\defeq k_{0}(x)+re\qquad(x\in N_{0},\ r\in R)
$$
とおく。矛盾なく定まること：$x+rm=x'+r'm$ なら $(r-r')m=x'-x\in N_{0}$ なので $r-r'\in\mathfrak{a}$ で、$(r-r')e=\phi(r-r')=k_{0}((r-r')m)=k_{0}(x'-x)$、よって $k_{0}(x)+re=k_{0}(x')+r'e$。$k_{1}$ は準同型で $k_{0}$ の拡張なので $(N_{1},k_{1})\in\Sigma$ は $(N_{0},k_{0})$ より真に大きく、極大性に反する。よって $N_{0}=M$ で、$k_{0}$ が求める拡張。

::: hypcheck
- **選択公理**：Step 3 でツォルンの補題を使った。$R$ が左ネーター環で $M$ が有限生成なら、Step 4 を有限回繰り返せばよいので不要である（加える元を生成系から順に取れる）。
- **仮定（イデアルからの拡張）**：Step 4 で $e$ を得るのに使った。
:::
:::

## 可除群と入射加群の存在 {#mod:sec-pi-divisible}

::: definition 可除群 {#mod:divisible keywords="divisible group, divisible module" index="可除群|かじょぐん, 可除加群|かじょかぐん"}
可換群 $D$ が、すべての $d\in D$ と $n\ge 1$ について $nx=d$ となる $x\in D$ をもつとき、**可除群**（**可除 $\Z$ 加群**）という。例：$\Q$、$\Q/\Z$、$\R$、$\C^{\times}$（乗法群）。可除群の剰余群・直和・直積は可除群である。$0$ でない有限群・$\Z$ は可除でない。
:::

::: theorem $\Z$ 上の入射加群 {#mod:z-injective-divisible keywords="injective Z-modules are divisible groups" index="入射的な可換群|にゅうしゃてきなかかんぐん"}
（AC）可換群が入射 $\Z$ 加群であることと、可除群であることは同値である。
:::

::: proof
**Step 1（⇒）.** $D$ が入射的で $d\in D$, $n\ge 1$ とする。$h:n\Z\to D$, $h(nk)\defeq kd$ は準同型で、$\Z$ への拡張 $\tilde h$ について $n\tilde h(1)=\tilde h(n)=d$。

**Step 2（⇐）.** $\Z$ のイデアルは $n\Z$（$n\ge 0$。\ref{ring:ideals-of-z}）。$h:n\Z\to D$ について、$n=0$ なら $e=0$ でよい。$n\ge 1$ なら、可除性から $ne=h(n)$ となる $e$ があり、$h(nk)=kh(n)=k\cdot ne=(nk)e$。ベールの判定法（\ref{mod:baer}）から $D$ は入射的。

::: hypcheck
- 同じ議論で、PID 上の加群が入射的 $\iff$ 可除（$0$ でないすべての $a\in A$ で $aM=M$）が示せる（PID のイデアルは単項なので）。整域一般では「入射 ⇒ 可除」だけが成り立つ。
- **選択公理**：Step 2 でベールの判定法を通して使った。
:::
:::

::: theorem 入射加群への埋め込み {#mod:enough-injectives keywords="every module embeds in an injective module, enough injectives, coinduced module Hom_Z(R,D)" index="入射加群への埋め込み|にゅうしゃかぐんへのうめこみ, 余誘導加群|よゆうどうかぐん"}
（AC）
1. 任意の可換群は可除群に埋め込める。
2. 可除群 $D$ について、$\Hom_{\Z}(R,D)$ は $(rf)(s)\defeq f(sr)$ によって入射的な左 $R$ 加群になる。
3. 任意の左 $R$ 加群 $M$ は入射加群に埋め込める（単射準同型 $M\to I$, $I$ は入射加群、がある）。
:::

::: proof
**Step 1（1）.** 可換群 $M$ を自由 $\Z$ 加群の剰余 $M\cong\Z^{(I)}/K$ と書く（\ref{mod:free-module-universal} の 3）。$\Z^{(I)}\subset\Q^{(I)}$ なので $M\cong\Z^{(I)}/K\subset\Q^{(I)}/K$。$\Q^{(I)}$ は可除群の直和で可除、その剰余群 $\Q^{(I)}/K$ も可除。

**Step 2（2：加群であること）.** $f\in\Hom_{\Z}(R,D)$ について $rf$ も加法的。$(r(r'f))(s)=(r'f)(sr)=f(srr')=((rr')f)(s)$ なので公理 3 が成り立ち、他の公理も明らか。

**Step 3（2：随伴の同型）.** 左 $R$ 加群 $M$ について
$$
\Phi:\Hom_{R}(M,\Hom_{\Z}(R,D))\to\Hom_{\Z}(M,D),\quad\Phi(\alpha)(m)\defeq\alpha(m)(1)
$$
は可換群の同型である。逆写像は $\Psi(\beta)(m)\defeq(s\mapsto\beta(sm))$：$\Psi(\beta)$ が $R$ 準同型であることは $\Psi(\beta)(rm)(s)=\beta(srm)=\Psi(\beta)(m)(sr)=(r\Psi(\beta)(m))(s)$ から。$\Phi\Psi(\beta)(m)=\beta(m)$、$\Psi\Phi(\alpha)(m)(s)=\alpha(sm)(1)=(s\alpha(m))(1)=\alpha(m)(s)$。この同型は $M$ について自然である（$M'\to M$ との合成と可換）。

**Step 4（2：入射性）.** 単射 $f:L\to M$ について、Step 3 の自然な同型で $f^{*}:\Hom_{R}(M,\Hom_{\Z}(R,D))\to\Hom_{R}(L,\Hom_{\Z}(R,D))$ は $f^{*}:\Hom_{\Z}(M,D)\to\Hom_{\Z}(L,D)$ に対応する。後者は $D$ が入射 $\Z$ 加群（\ref{mod:z-injective-divisible}）なので全射。よって前者も全射で、$\Hom_{\Z}(R,D)$ は入射的。

**Step 5（3）.** 1 から $M$（の加法群）を可除群 $D$ に埋め込む単射 $\Z$ 準同型 $\beta:M\to D$ をとる。$\alpha\defeq\Psi(\beta):M\to\Hom_{\Z}(R,D)$, $\alpha(m)(s)=\beta(sm)$ は $R$ 準同型で、$\alpha(m)=0$ なら $\beta(m)=\alpha(m)(1)=0$ なので $m=0$。よって単射で、2 から行き先は入射加群。

::: hypcheck
- **選択公理**：Step 4 で \ref{mod:z-injective-divisible}（ベールの判定法）を使った。Step 1 は自由加群の剰余として書くだけで選択公理は要らない。
- **2 の作用の向き**：$(rf)(s)=f(sr)$ と右から掛けるのは公理 3（$(rr')f=r(r'f)$）を成り立たせるため。$f(rs)$ とすると $R$ が非可換のとき右加群になってしまう。
:::
:::

::: corollary 分裂による入射性の判定 {#mod:injective-split-criterion keywords="E is injective iff every short exact sequence starting with E splits" index="入射加群の判定|にゅうしゃかぐんのはんてい"}
（AC）左 $R$ 加群 $E$ が入射加群であることと、$E$ で始まる短完全列 $0\to E\to M\to N\to 0$ がすべて分裂することは同値である。
:::

::: proof
⇒ は \ref{mod:injective-characterization}。⇐：\ref{mod:enough-injectives} の 3 から単射 $E\to I$（$I$ は入射加群）があり、$0\to E\to I\to I/E\to 0$ は仮定から分裂するので、$E$ は $I$ の直和因子（\ref{mod:splitting-lemma}）。入射加群の直和因子は入射加群（\ref{mod:injective-characterization}）。
:::

::: supplement
**入射包絡.** 加群 $M$ を含む入射加群のうち「最小」のもの（本質的拡大で入射的なもの）が同型を除いて一意に存在する（**入射包絡** $E(M)$。エックマン＝シェプフ）。例えば $E(\Z)=\Q$、$E(\Z/p\Z)=\Z[1/p]/\Z$（プリューファー $p$ 群）。

**高い視点.** \ref{mod:enough-injectives} の Step 3 の同型は、スカラーの制限 $R\text{-}\mathbf{Mod}\to\mathbf{Ab}$ の**右随伴**が $\Hom_{\Z}(R,-)$ であることを言っている（\ref{cat:adjunction}）。右随伴が単射を保つ左随伴をもつとき入射対象を入射対象に移す、という一般原理（\ref{cat:adjunction} と入射対象の定義から直ちに従う）の特別な場合である。双対に、左随伴 $R\otimes_{\Z}-$（\ref[テンソル積]{mod:page-tensor-products}）は射影対象を射影対象に移し、自由加群 $R^{(I)}=R\otimes_{\Z}\Z^{(I)}$ はその例である。
:::

## 問題 {#mod:sec-pi-problems}

::: problem {#mod:prob-q-not-free-projective}
$\Q$ は射影的な $\Z$ 加群でないことを、$\Hom_{\Z}(\Q,\Z)=0$ を使って示せ。
:::

::: solution
**Step 1（$\Hom(\Q,\Z)=0$）.** $f:\Q\to\Z$ について、$q\in\Q$ と $n\ge 1$ で $f(q)=nf(q/n)$ なので $f(q)$ はすべての $n$ で割り切れ、$f(q)=0$。

**Step 2.** $\Q$ が射影的なら自由加群 $F=\Z^{(I)}$ の直和因子で、包含 $\iota:\Q\to F$ は単射。$F$ の各成分への射影 $p_{i}\circ\iota\in\Hom(\Q,\Z)=0$ なので $\iota=0$ となり矛盾（$\Q\neq 0$）。
:::

::: problem {#mod:prob-q-z-cogenerator}
任意の可換群 $M$ と $0$ でない $m\in M$ について、$f(m)\neq 0$ となる準同型 $f:M\to\Q/\Z$ があることを示せ。
:::

::: solution
$\Z m$ は巡回群なので $\Z m\cong\Z$ または $\Z/n\Z$（$n\ge 2$）。前者なら $h(km)\defeq k/2+\Z$、後者なら $h(km)\defeq k/n+\Z$ とおくと、$h:\Z m\to\Q/\Z$ は矛盾なく定まる準同型で $h(m)\neq 0$。$\Q/\Z$ は可除なので入射的（\ref{mod:z-injective-divisible}）で、$h$ は $M$ 全体に拡張できる。（この性質を「$\Q/\Z$ は $\mathbf{Ab}$ の**余生成元**である」という。）
:::
