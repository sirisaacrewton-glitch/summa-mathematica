# 加群論（Module Theory）

加群と準同型、同型定理、直和と自由加群、完全列と Hom、射影・入射加群、テンソル積と平坦性、PID 上の有限生成加群の構造定理と有限生成アーベル群（雪江『代数学 2』第 2 章、Anderson–Fuller を参考にする）。導来関手（Ext・Tor）と一般のアーベル圏はホモロジー代数の系列にある。

<p class="mn-msc">MSC2020: 13C, 16D</p>
