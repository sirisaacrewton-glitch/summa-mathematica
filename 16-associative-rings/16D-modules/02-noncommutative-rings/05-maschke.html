# 群環とマシュケの定理 {#mod:page-maschke keywords="group ring, group algebra, representation of a finite group, Maschke's theorem, semisimplicity of k[G], sum of squares of dimensions of irreducible representations equals |G|, number of irreducible representations equals number of conjugacy classes"}

有限群 $G$ と体 $k$ から作る**群環** $k[G]$ は、$G$ の元を基底とし、積を群の積で定めた $k$ 代数である（\ref{mod:group-ring}）。$k[G]$ 加群は「$G$ が線形に作用する $k$ ベクトル空間」すなわち $G$ の**表現**と同じものである。**マシュケの定理**（\tref{mod:maschke}）は、$k$ の標数が $\abs{G}$ を割り切らなければ $k[G]$ が半単純環であること、すなわちすべての表現が既約表現の直和に分かれることを主張する。これとウェダーバーン＝アルティンの定理を合わせると、$k=\mathbb{C}$ のとき、既約表現の次元 $n_{1},\dots,n_{r}$ について $\abs{G}=n_{1}^{2}+\cdots+n_{r}^{2}$ で、$r$ は共役類の個数に等しい（\ref{mod:group-algebra-structure}）。

> 本棚に表現論の本がないので、標準的な内容を自分で組み立てた。マシュケの定理の証明は「射影を群で平均する」よく知られた議論である。

## 記法と定義の確認 {#mod:sec-ms-notation}

::: notation
- $G$ は有限群、$k$ は体、$\abs{G}$ は $G$ の位数。共役類は \ref{grp:conjugacy-class}。
- 半単純加群・半単純環・ジャコブソン根基・冪零イデアルは \ref{mod:semisimple-equivalent}, \ref{mod:jacobson-characterization}, \ref{mod:nil-in-radical}、半単純環の根基が $0$ であることは \ref{mod:page-jacobson-radical} の例 2。ウェダーバーン＝アルティンの定理と代数閉体上の形は \tref{mod:wedderburn-artin}, \ref{mod:semisimple-algebra-closed}、行列環の中心は \ref{mod:prob-nr-center-matrix}。
- $k$ 代数とは、$k\subset Z(R)$ となる環 $R$（$k$ ベクトル空間でもある）。
- **選択公理**：無限次元の表現で $k$ 線形な補空間を選ぶところ（ベクトル空間の基底の存在、\ref{mod:semisimple-closure.2}）で使う。有限次元の表現だけを考えるなら使わない。
:::

## 群環と表現 {#mod:sec-ms-group-ring}

::: definition 群環 {#mod:group-ring keywords="group ring k[G], group algebra, representations as k[G]-modules" index="群環|ぐんかん, 群多元環|ぐんたげんかん, 表現（群）|ひょうげんぐん"}
$k[G]$ を、$G$ の元を基底とする $k$ ベクトル空間 $\{\sum_{g\in G}a_{g}g : a_{g}\in k\}$ に、積
$$
\Bigl(\sum_{g}a_{g}g\Bigr)\Bigl(\sum_{h}b_{h}h\Bigr)\defeq\sum_{g,h}a_{g}b_{h}\,(gh)
$$
を入れた環とし、**群環**という。単位元は $G$ の単位元 $e$ で、$k=ke\subset Z(k[G])$ なので $k$ 代数である。$\dim_{k}k[G]=\abs{G}$。
:::

::: proposition 群環の加群と表現 {#mod:group-ring-modules keywords="k[G]-modules are k-vector spaces with a linear G-action" index="群の表現|ぐんのひょうげん"}
$k[G]$ 加群 $V$ を与えることと、$k$ ベクトル空間 $V$ と群準同型 $\rho\colon G\to\GL(V)$ を与えることは同じである（$gv=\rho(g)v$ とし、一般の元は線形に作用させる）。$k[G]$ 準同型は、$G$ の作用と可換な $k$ 線形写像のことである。
:::

::: proof
**Step 1（加群から表現）.** $V$ は $k\subset k[G]$ を通して $k$ ベクトル空間で、$g$ の作用 $\rho(g)$ は $k$ 線形（$k$ は中心にあるので $g(cv)=c(gv)$）、$\rho(gh)=\rho(g)\rho(h)$、$\rho(e)=\id$ で、$\rho(g^{-1})$ が逆写像なので $\rho(g)\in\GL(V)$。

**Step 2（表現から加群）.** $(\sum a_{g}g)v\defeq\sum a_{g}\rho(g)v$ と定めると、加群の公理（\ref{mod:module}）は $\rho$ が準同型であることと線形性から従う（積の公理は $\bigl((\sum a_{g}g)(\sum b_{h}h)\bigr)v=\sum a_{g}b_{h}\rho(g)\rho(h)v$ の計算）。二つの対応は互いに逆。

**Step 3（準同型）.** $k[G]$ 線形 $\iff$ $k$ 線形かつ各 $g$ の作用と可換。
:::

## マシュケの定理 {#mod:sec-ms-maschke}

::: theorem マシュケの定理 {#mod:maschke keywords="Maschke's theorem: k[G] is semisimple iff char k does not divide |G|" index="マシュケの定理|ましゅけのていり" refname="マシュケの定理"}
（AC）有限群 $G$ と体 $k$ について、次は同値である。
1. $k$ の標数は $\abs{G}$ を割り切らない（標数 $0$ を含む）。
2. $k[G]$ は半単純環。
3. すべての $k[G]$ 加群は半単純（すべての表現は既約表現の直和）。
:::

::: proof
**Step 1（1⇒3：平均化）.** $V$ を $k[G]$ 加群、$W\subset V$ を部分加群とする。$W$ の $k$ 上の基底を $V$ の基底に延ばして（\ref{mod:semisimple-closure.2} を $W$ と $V/W$ に使う）、$k$ 線形な射影 $p\colon V\to W$（$p|_{W}=\id_{W}$）をとる。$k$ の中で $\abs{G}\cdot 1\neq 0$（仮定 1）なので
$$
\tilde p\defeq\frac{1}{\abs{G}}\sum_{g\in G}g\,p\,g^{-1}\colon V\to W
$$
が定まる（$gpg^{-1}(v)=g\cdot p(g^{-1}v)\in W$ は $W$ が部分加群だから）。

**Step 2（$\tilde p$ の性質）.** $h\in G$ について
$$
h\tilde p h^{-1}=\frac{1}{\abs{G}}\sum_{g}(hg)p(hg)^{-1}=\tilde p
$$
（$g\mapsto hg$ は $G$ の全単射）なので $\tilde p$ は $k[G]$ 線形。$w\in W$ なら $g^{-1}w\in W$ で $p(g^{-1}w)=g^{-1}w$ なので $gpg^{-1}(w)=w$、$\tilde p(w)=\frac{1}{\abs{G}}\abs{G}w=w$。

**Step 3（直和因子）.** $\tilde p\colon V\to W$ は $W$ 上で恒等写像なので $V=W\oplus\operatorname{Ker}\tilde p$（$v=\tilde p(v)+(v-\tilde p(v))$、$W\cap\operatorname{Ker}\tilde p=0$）で、$\operatorname{Ker}\tilde p$ は部分加群。\ref{mod:semisimple-equivalent.3} から $V$ は半単純。

**Step 4（3⇒2）.** $V=k[G]$ に 3 を使う。

**Step 5（2⇒1）.** 標数 $p$ が $\abs{G}$ を割り切るとする。$N\defeq\sum_{g\in G}g\neq 0$ について $hN=N=Nh$（$h\in G$）なので、$kN$ は両側イデアル。$N^{2}=\sum_{h}hN=\abs{G}N=0$ なので $(kN)^{2}=0$。\ref{mod:nil-in-radical} から $0\neq kN\subset J(k[G])$。半単純環の根基は $0$（\ref{mod:page-jacobson-radical} の例 2）なので $k[G]$ は半単純でない。
:::

::: hypcheck
- **前提「標数が $\abs{G}$ を割り切らない」**：Step 1 で $1/\abs{G}$ を使った。外すと偽：Step 5（例えば $k=\mathbb{F}_{2}$, $G=\Z/2$ で $\mathbb{F}_{2}[G]\cong\mathbb{F}_{2}[x]/((x+1)^{2})$、\ref{mod:prob-ms-char-p}）。
- **前提「$G$ 有限」**：$k[G]$ の定義の和と平均化に使った。
- **選択公理**：Step 1 の補空間の選択（無限次元のとき）と、半単純加群の特徴付けで使った。$V$ が有限次元なら不要。
:::

## 複素数体上の構造 {#mod:sec-ms-complex}

::: lemma 群環の中心 {#mod:group-ring-center keywords="center of k[G] has basis of class sums; dimension = number of conjugacy classes" index="群環の中心|ぐんかんのちゅうしん, 類和|るいわ"}
$Z(k[G])$ は、共役類 $C$ ごとの**類和** $z_{C}\defeq\sum_{g\in C}g$ を基底にもつ。特に $\dim_{k}Z(k[G])$ は $G$ の共役類の個数。
:::

::: proof
**Step 1（中心の条件）.** $z=\sum a_{g}g$ が中心にある $\iff$ すべての $h$ で $hzh^{-1}=z$（$G$ が $k[G]$ を張り、$k$ は中心にあるので）。$hzh^{-1}=\sum_{g}a_{g}hgh^{-1}=\sum_{g}a_{h^{-1}gh}g$ なので、これは $a_{h^{-1}gh}=a_{g}$（すべての $g,h$）、すなわち $g\mapsto a_{g}$ が共役類の上で一定であることと同値。

**Step 2（基底）.** そのような $z$ は $\sum_{C}a_{C}z_{C}$ と一意に書ける（共役類は $G$ の分割）。
:::

::: theorem 複素群環の構造 {#mod:group-algebra-structure keywords="C[G] is a product of matrix algebras; |G| = sum of squares of dimensions of irreducible representations; number of irreducibles = number of conjugacy classes" index="既約表現の次元の二乗和|きやくひょうげんのじげんのにじょうわ"}
（AC）$k$ を代数閉体で、その標数は $\abs{G}$ を割り切らないとする（例えば $k=\mathbb{C}$）。$G$ の既約表現（単純 $k[G]$ 加群）の同型類を $V_{1},\dots,V_{r}$、$n_{i}\defeq\dim_{k}V_{i}$ とすると、
1. $k[G]\cong M_{n_{1}}(k)\times\cdots\times M_{n_{r}}(k)$。
2. $\abs{G}=n_{1}^{2}+\cdots+n_{r}^{2}$。
3. $r$ は $G$ の共役類の個数。
:::

::: proof
**Step 1（1・2）.** マシュケの定理から $k[G]$ は半単純で、$k$ 上 $\abs{G}$ 次元。\ref{mod:semisimple-algebra-closed} から 1 と、$\abs{G}=\dim k[G]=\sum n_{i}^{2}$、$r$ は単純加群の同型類の個数で $n_{i}=\dim V_{i}$。

**Step 2（3）.** 環の同型は中心を中心に写すので、$Z(k[G])\cong\prod_{i}Z(M_{n_{i}}(k))$（直積の中心は中心の直積）。$Z(M_{n}(k))=k\cdot I$（\ref{mod:prob-nr-center-matrix}）なので右辺は $r$ 次元。\ref{mod:group-ring-center} と比べて $r$ は共役類の個数。
:::

::: example
1. $G$ が可換群なら共役類は $\abs{G}$ 個なので $r=\abs{G}$、$\abs{G}=\sum n_{i}^{2}$ からすべて $n_{i}=1$：可換群の複素既約表現はすべて 1 次元で、$\mathbb{C}[G]\cong\mathbb{C}^{\abs{G}}$。
2. 対称群 $S_{3}$：共役類は巡回置換の型（\ref{grp:conjugacy-cycle-type}）$\{e\}$、互換、3-サイクルの 3 個。$6=n_{1}^{2}+n_{2}^{2}+n_{3}^{2}$ で、自明な表現が $n=1$ なので、解は $1+1+4$ だけ。既約表現の次元は $1,1,2$ で、$\mathbb{C}[S_{3}]\cong\mathbb{C}\times\mathbb{C}\times M_{2}(\mathbb{C})$。
3. 四元数群 $Q_{8}$（\ref{grp:quaternion-group}）：共役類は $\{1\},\{-1\},\{\pm\mathbf{i}\},\{\pm\mathbf{j}\},\{\pm\mathbf{k}\}$ の 5 個（$\mathbf{j}\mathbf{i}\mathbf{j}^{-1}=-\mathbf{i}$ など）。$8$ を $5$ 個の正の平方数の和に書く方法は $1+1+1+1+4$ だけなので、次元は $1,1,1,1,2$。2 次元の既約表現は \ref{grp:quaternion-group} の $\GL_{2}(\mathbb{C})$ への埋め込みである。
:::

## 問題 {#mod:sec-ms-problems}

::: problem {#mod:prob-ms-char-p}
素数 $p$ と $G=\Z/p\Z$ について $\mathbb{F}_{p}[G]\cong\mathbb{F}_{p}[x]/((x-1)^{p})$ を示し、$J(\mathbb{F}_{p}[G])$ を求めよ。
:::

::: solution
**Step 1.** 生成元 $\sigma$ について $\mathbb{F}_{p}[G]$ は $1,\sigma,\dots,\sigma^{p-1}$ を基底にもち、$x\mapsto\sigma$ は全射 $\mathbb{F}_{p}[x]\to\mathbb{F}_{p}[G]$ で核は $(x^{p}-1)$（次元比較）。$\mathbb{F}_{p}$ では $x^{p}-1=(x-1)^{p}$（二項係数 $\binom{p}{j}$, $0<j<p$ は $p$ の倍数）。

**Step 2.** $A=\mathbb{F}_{p}[x]/((x-1)^{p})$ は可換な局所環で極大イデアルは $(x-1)$（$A/(x-1)\cong\mathbb{F}_{p}$ で、$(x-1)$ は冪零なので、これを含まない元は単元）。よって $J=(\sigma-1)$ で、$J^{p}=0$、$A/J\cong\mathbb{F}_{p}$。
:::

::: problem {#mod:prob-ms-real}
$\mathbb{R}[\Z/3\Z]\cong\mathbb{R}\times\mathbb{C}$ を示し、\ref{mod:group-algebra-structure} が代数閉でない体では成り立たないことを確かめよ。
:::

::: solution
$\mathbb{R}[\Z/3]\cong\mathbb{R}[x]/(x^{3}-1)$（前問と同様）で、$x^{3}-1=(x-1)(x^{2}+x+1)$ は互いに素な既約因子の積なので、中国剰余定理から $\cong\mathbb{R}[x]/(x-1)\times\mathbb{R}[x]/(x^{2}+x+1)\cong\mathbb{R}\times\mathbb{C}$。単純加群は $\mathbb{R}$（1 次元）と $\mathbb{C}$（2 次元）の 2 個で、共役類は $3$ 個、次元の二乗和は $1^{2}+2^{2}=5\neq 3$。$\mathbb{C}=M_{1}(\mathbb{C})$ の可除環 $\mathbb{C}$ が $\mathbb{R}$ 上 2 次元なので、次元の式は $3=1+2$ となり、\ref{mod:group-algebra-structure.2}・\ref[3]{mod:group-algebra-structure.3} は成り立たない。
:::

::: supplement
**指標理論へ.** 群の表現論（指標・直交関係・指標表・誘導表現）は群論の側の系列で、このページと前のページ（\ref{mod:page-semisimple-modules}, \ref{mod:page-wedderburn-artin}）の環論的な結果を前提に展開する（\ref{rep:page-representations}, \ref{rep:page-characters}）。「$n_{i}$ は $\abs{G}$ の約数」（フロベニウス）は整拡大の理論（\ref{ring:page-integral-extensions}）を使ってそこで示す（\ref{rep:page-integrality}）。

**モジュラー表現.** 標数が $\abs{G}$ を割り切るとき（Step 5）、$k[G]$ は半単純でなく、表現は既約表現の直和に分かれるとは限らない。この場合の理論をモジュラー表現論といい、$k[G]/J(k[G])$ と $J$ の構造（\ref{mod:artinian-radical}）が中心的な対象になる。

**高い視点.** マシュケの定理の証明の平均化 $\frac{1}{\abs{G}}\sum_{g}g(\cdot)g^{-1}$ は、「群について不変なものを作る射影」で、コンパクト群ではハール測度による積分に置き換わる（ワイルのユニタリ・トリック）。ホモロジー代数の言葉では、$\abs{G}$ が可逆なら群コホモロジー $H^{n}(G,V)$ が $n\ge 1$ で消えることと同じ現象である（知られている事実）。
:::
