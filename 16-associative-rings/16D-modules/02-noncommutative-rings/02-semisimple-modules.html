# 単純加群と半単純加群 {#mod:page-semisimple-modules keywords="simple module, Schur's lemma, semisimple module, completely reducible, every submodule is a direct summand, multiplicity of simple summands, semisimple ring"}

$0$ と自分自身のほかに部分加群をもたない加群を**単純加群**という（\ref{mod:simple-module}）。単純加群どうしの準同型は $0$ か同型で、自己準同型環は可除環になる（**シューアの補題**、\tref{mod:schur-lemma}）。単純加群の直和で書ける加群を**半単純加群**といい、「単純部分加群の和」「単純部分加群の直和」「すべての部分加群が直和因子」の三条件が同値になる（\ref{mod:semisimple-equivalent}）。ベクトル空間がその典型で、この定理の特別な場合として「可除環上のベクトル空間は基底をもつ」ことも従う。最後に、有限個の単純加群への分解で各単純加群が現れる回数が分解によらないこと（\ref{mod:semisimple-multiplicity}）を、シューアの補題と可除環上の一次独立性から示す。

> Anderson–Fuller *Rings and Categories of Modules* §9 を参考にした。重複度の一意性は、組成列（ジョルダン＝ヘルダー）を使わず、$\Hom(T,M)$ の次元で数える形にした。

## 記法と定義の確認 {#mod:sec-ss-notation}

::: notation
- $R$ は環（可換とは限らない）、加群は左 $R$ 加群（\ref{mod:module}）。部分加群・剰余加群・同型定理は \tref{mod:isomorphism-theorems}、直和（内部直和を含む）は \ref{mod:direct-sum}、$\Hom$ と直和は \ref{mod:hom-sum-product}、左イデアルは \ref{mod:one-sided-ideal}、可除環は \ref{ring:domain-field-def} の後の注意。
- 部分加群の族 $(N_{i})_{i\in I}$ が**独立**であるとは、有限個の $i_{1},\dots,i_{k}$（相異なる）と $x_{j}\in N_{i_{j}}$ について $x_{1}+\dots+x_{k}=0$ なら $x_{1}=\dots=x_{k}=0$ となることをいう。これは和写像 $\bigoplus N_{i}\to\sum N_{i}$ が単射、すなわち $\sum N_{i}$ が $(N_{i})$ の内部直和であることと同じである。
- 可除環 $D$ 上の**右ベクトル空間**は右 $D$ 加群のこと。$D^{m}$ の元 $v_{1},\dots,v_{k}$ が**一次独立**とは、$\sum v_{i}\lambda_{i}=0$（$\lambda_{i}\in D$）なら $\lambda_{i}=0$ となること。
- **選択公理**：\ref{set:zorn}として、半単純加群の特徴付け（\ref{mod:semisimple-equivalent}）と極大左イデアルの存在（\ref{mod:simple-module} の 3）で使う。シューアの補題と重複度の一意性では使わない。
:::

## 単純加群とシューアの補題 {#mod:sec-ss-simple}

::: definition 単純加群 {#mod:simple-module keywords="simple module, irreducible module, maximal left ideal, R/L simple iff L maximal" index="単純加群|たんじゅんかぐん, 既約加群|きやくかぐん, 極大左イデアル|きょくだいひだりいである"}
左 $R$ 加群 $S$ が $S\neq 0$ で、部分加群が $0$ と $S$ だけのとき、**単純加群**という。真の左イデアルで、それを真に含む真の左イデアルがないものを**極大左イデアル**という。
:::

::: proposition 単純加群の特徴付け {#mod:simple-characterization keywords="S simple iff S = R/L for a maximal left ideal L; nonzero element generates" index="単純加群の特徴付け|たんじゅんかぐんのとくちょうづけ"}
1. $S\neq 0$ が単純であることと、$S$ の $0$ でないすべての元 $x$ が $S=Rx$ をみたすことは同値。
2. 左イデアル $L$ について、$R/L$ が単純 $\iff$ $L$ は極大左イデアル。単純加群は $R/L$（$L$ 極大左イデアル）の形の加群と同型。
3. （AC）$R\neq 0$ なら、真の左イデアル $L_{0}$ は極大左イデアルに含まれる。特に $R\neq 0$ なら単純加群が存在する。
:::

::: proof
**Step 1（1）.** $Rx$ は $x$ を含む部分加群なので、単純なら $Rx=S$。逆に $N\neq 0$ を部分加群とし $0\neq x\in N$ をとると $S=Rx\subset N$。

**Step 2（2）.** 対応定理（\ref{mod:isomorphism-theorems}）から、$R/L$ の部分加群は $L$ を含む左イデアルと対応する。よって $R/L$ が単純 $\iff$ $L\neq R$ で $L$ と $R$ の間に左イデアルがない $\iff L$ 極大。単純な $S$ と $0\neq x\in S$ について、$R\to S$, $r\mapsto rx$ は 1 から全射で、核 $L=\operatorname{Ann}(x)$ について $S\cong R/L$。$S$ が単純なので $L$ は極大。

**Step 3（3）.** $L_{0}$ を含む真の左イデアル全体を包含で順序づける。空でない鎖の和集合は左イデアルで、$1$ を含まない（含めばある元が $1$ を含み真でない）ので真。\ref{set:zorn}から極大元がある。$L_{0}=0$ とすれば $R/L$ は単純。
:::

::: theorem シューアの補題 {#mod:schur-lemma keywords="Schur's lemma: homomorphisms between simple modules are zero or isomorphisms; End of a simple module is a division ring" index="シューアの補題|しゅーあのほだい" refname="シューアの補題"}
$S,T$ を単純加群とする。
1. 準同型 $f\colon S\to T$ は $0$ か同型である。
2. $\End_{R}(S)$ は可除環である。
:::

::: proof
**Step 1（1）.** $\operatorname{Ker}f$ は $S$ の部分加群なので $0$ か $S$。$S$ なら $f=0$。$0$ なら $f$ は単射で、$\operatorname{Im}f\neq 0$ は $T$ の部分加群なので $T$、よって同型。

**Step 2（2）.** $S\neq 0$ なので $\End(S)$ で $1\neq 0$。$0$ でない $f$ は 1 から同型で、逆写像も $R$ 線形なので $\End(S)$ の単元。
:::

::: corollary 代数閉体上のシューアの補題 {#mod:schur-algebraically-closed keywords="End of a finite-dimensional simple module over an algebraically closed field is the field" index="シューアの補題（代数閉体）|しゅーあのほだいだいすうへいたい" refname="代数閉体上のシューアの補題"}
$k$ を代数閉体、$R$ を $k$ 代数（$k\subset Z(R)$ となる環）、$S$ を $k$ 上有限次元の単純 $R$ 加群とする。このとき $\End_{R}(S)=k\cdot\id_{S}$。
:::

::: proof
$f\in\End_{R}(S)$ は $k$ 線形写像でもあり、$S\neq 0$ は有限次元、$k$ は代数閉体なので固有値 $\lambda\in k$ をもつ（特性多項式の根）。$f-\lambda\id$ は $R$ 線形（$\lambda\in Z(R)$ なので $\lambda\id$ は $R$ 線形）で単射でないので、シューアの補題の 1 から $0$。よって $f=\lambda\id$。
:::

## 半単純加群 {#mod:sec-ss-semisimple}

::: lemma 直和補因子の存在 {#mod:semisimple-complement keywords="if M is a sum of simple submodules S_i and N is a submodule then M = N + direct sum of some S_j" index="直和補因子|ちょくわほいんし"}
（AC）$M=\sum_{i\in I}S_{i}$（$S_{i}$ は単純部分加群）と部分加群 $N$ について、$J\subset I$ で $M=N\oplus\bigoplus_{j\in J}S_{j}$ となるものがある。
:::

::: proof
**Step 1（ツォルン）.** $\mathcal{F}\defeq\{J\subset I : \text{族 }\{N\}\cup\{S_{j}\}_{j\in J}\text{ が独立}\}$ を包含で順序づける。$\varnothing\in\mathcal{F}$。鎖 $(J_{\lambda})$ の和集合 $J^{*}$ について、独立性の条件は有限個の元についての条件で、有限個の添字はある一つの $J_{\lambda}$ に入るので、$J^{*}\in\mathcal{F}$。ツォルンの補題から極大元 $J$ がある。

**Step 2（$P=M$）.** $P\defeq N\oplus\bigoplus_{j\in J}S_{j}$ とする。各 $i\in I$ について $S_{i}\cap P$ は $S_{i}$ の部分加群なので $0$ か $S_{i}$。$0$ なら $\{N\}\cup\{S_{j}\}_{j\in J\cup\{i\}}$ は独立（$x+s=0$, $x\in P$, $s\in S_{i}$ なら $s=-x\in S_{i}\cap P=0$）で、$J$ の極大性に反する（$i\notin J$ である。$i\in J$ なら $S_{i}\subset P$）。よって $S_{i}\subset P$ がすべての $i$ で成り立ち、$P=M$。
:::

::: theorem 半単純加群の特徴付け {#mod:semisimple-equivalent keywords="semisimple module: sum of simples iff direct sum of simples iff every submodule is a direct summand" index="半単純加群|はんたんじゅんかぐん, 完全可約|かんぜんかやく"}
（AC）左 $R$ 加群 $M$ について、次は同値である。
1. $M$ は単純部分加群の和（$M=0$ は空の和）。
2. $M$ は単純部分加群の（内部）直和。
3. $M$ のすべての部分加群は直和因子（$N\subset M$ について $M=N\oplus N'$ となる $N'$ がある）。

これらをみたす加群を**半単純加群**（**完全可約**）という。$R$ が左 $R$ 加群として半単純のとき、$R$ を**半単純環**という。
:::

::: proof
**Step 1（1⇒2, 1⇒3）.** \ref{mod:semisimple-complement} を $N=0$ と一般の $N$ に使う。2⇒1 は明らか。

**Step 2（3 は部分加群に遺伝する）.** $K\subset M$ と $U\subset K$ について、$M=U\oplus U'$ とすると $K=U\oplus(U'\cap K)$：$k\in K$ を $k=u+u'$ と書くと $u'=k-u\in K$。

**Step 3（3 なら $0$ でない部分加群は単純部分加群を含む）.** $0\neq x\in M$ について、$Rx\cong R/\operatorname{Ann}(x)$（$\operatorname{Ann}(x)\defeq\{r : rx=0\}$ は真の左イデアル）。\ref{mod:simple-characterization.3} から $\operatorname{Ann}(x)\subset L$ となる極大左イデアル $L$ があり、$Lx$ は $Rx$ の極大な真部分加群（$Rx/Lx\cong R/L$ は単純）。Step 2 から $Rx=Lx\oplus S$ と書け、$S\cong Rx/Lx$ は単純。

**Step 4（3⇒1）.** $N$ を $M$ の単純部分加群すべての和とし、$M=N\oplus N'$ とする。$N'\neq 0$ なら Step 3 から単純部分加群 $S\subset N'$ があるが、$S\subset N$ なので $S\subset N\cap N'=0$ で矛盾。よって $M=N$。
:::

::: hypcheck
- **選択公理**：Step 1 の \ref{mod:semisimple-complement}（ツォルン）と Step 3 の極大左イデアル（ツォルン）に使った。$M$ が有限生成（例えば有限個の単純加群の和）の場合は、Step 1 の $J$ を有限集合の中から選べばよく、選択公理は要らない。
- **独立性が有限的な条件であること**：ツォルンの補題で鎖の和集合が $\mathcal{F}$ に入ることに使った。
:::

::: corollary 部分加群・剰余加群・ベクトル空間 {#mod:semisimple-closure keywords="submodules and quotients of semisimple modules are semisimple; vector spaces over division rings have bases" index="半単純加群の部分加群|はんたんじゅんかぐんのぶぶんかぐん, 可除環上のベクトル空間の基底|かじょかんじょうのべくとるくうかんのきてい"}
（AC）
1. 半単純加群の部分加群・剰余加群は半単純。
2. 可除環 $D$ 上のベクトル空間（左 $D$ 加群）は基底をもつ。特に半単純で、$D$ は半単純環。
:::

::: proof
**Step 1（1）.** 部分加群は \ref{mod:semisimple-equivalent} の Step 2 から条件 3 をみたす。$M=\sum S_{i}$ の剰余 $M/N$ は単純加群の像 $(S_{i}+N)/N$ の和で、各像はシューアの補題の Step 1 と同じ理由で $0$ か単純なので、条件 1 をみたす。

**Step 2（2）.** $V$ を左 $D$ 加群、$0\neq v\in V$ とすると $Dv$ は単純：$0\neq\lambda v\in Dv$ なら $\lambda\neq 0$ で $v=\lambda^{-1}(\lambda v)$ なので $D(\lambda v)=Dv$（\ref{mod:simple-characterization.1}）。$V=\sum_{v\neq 0}Dv$ は単純部分加群の和なので、\ref{mod:semisimple-equivalent} から $V=\bigoplus_{v\in B}Dv$ となる $B$ があり、$B$ は基底。$V=D$ として $D$ は半単純環。
:::

::: example
1. $\Z$ 加群 $\Z$ は半単純でない：$0$ でない部分加群 $n\Z$ は $2n\Z\subsetneq n\Z$ を含むので単純でなく、$\Z$ は単純部分加群をもたない。
2. $\Z/4\Z$ は半単純でない：部分加群は $0$, $2\Z/4\Z$, $\Z/4\Z$ で、$2\Z/4\Z$ は直和因子でない（補因子は位数 $2$ の部分群のはずだが、位数 $2$ の部分群は $2\Z/4\Z$ だけ）。
3. 体 $k$ と $n\ge 1$ について、$M_{n}(k)$ は半単純環：第 $j$ 列以外が $0$ の行列のなす左イデアル $L_{j}$ は単純（\ref{mod:prob-nr-left-ideals-matrix}）で、$M_{n}(k)=L_{1}\oplus\dots\oplus L_{n}$。
:::

## 重複度の一意性 {#mod:sec-ss-uniqueness}

::: lemma 可除環上の一次従属性 {#mod:division-ring-dependence keywords="m+1 vectors in D^m are linearly dependent over a division ring" index="可除環上の一次独立|かじょかんじょうのいちじどくりつ"}
可除環 $D$ と $m\ge 0$ について、右ベクトル空間 $D^{m}$ の $m+1$ 個の元は一次従属である。したがって $D^{n}\cong D^{m}$（右 $D$ 加群として）なら $n=m$。
:::

::: proof
**Step 1（$m$ についての帰納法）.** $m=0$ では $D^{0}=0$ で、$v_{1}=0$ について $v_{1}\cdot 1=0$。$m\ge 1$ とし $v_{1},\dots,v_{m+1}\in D^{m}$ の最後の成分を $c_{1},\dots,c_{m+1}$ とする。すべて $0$ なら $v_{1},\dots,v_{m}$ は $D^{m-1}$ の元とみなせ、帰納法の仮定から一次従属（係数を $v_{m+1}$ について $0$ とすればよい）。

**Step 2（消去）.** 番号を付け替えて $c_{m+1}\neq 0$ とし、$w_{i}\defeq v_{i}-v_{m+1}c_{m+1}^{-1}c_{i}$（$i\le m$）とおくと、$w_{i}$ の最後の成分は $c_{i}-c_{m+1}c_{m+1}^{-1}c_{i}=0$。帰納法の仮定から、すべては $0$ でない $\lambda_{1},\dots,\lambda_{m}$ で $\sum_{i\le m}w_{i}\lambda_{i}=0$。すると $\sum_{i\le m}v_{i}\lambda_{i}+v_{m+1}\bigl(-\sum_{i\le m}c_{m+1}^{-1}c_{i}\lambda_{i}\bigr)=0$ で、係数はすべては $0$ でない。

**Step 3（後半）.** $n>m$ なら、$D^{n}$ の標準基底 $e_{1},\dots,e_{m+1}$ は一次独立で、同型で $D^{m}$ に写すと一次独立な $m+1$ 個の元になり、Step 1・2 に反する。対称に $m>n$ もない。
:::

::: theorem 単純成分の重複度 {#mod:semisimple-multiplicity keywords="multiplicity of a simple module T in a finite direct sum of simples equals dim over End(T) of Hom(T,M)" index="重複度（半単純加群）|ちょうふくどはんたんじゅんかぐん"}
$M=S_{1}\oplus\dots\oplus S_{n}$（$S_{i}$ は単純）とし、単純加群 $T$ について $D\defeq\End_{R}(T)$、$n_{T}\defeq\#\{i : S_{i}\cong T\}$ とする。$\Hom_{R}(T,M)$ は $(f\cdot d)\defeq f\circ d$ で右 $D$ ベクトル空間になり、$\Hom_{R}(T,M)\cong D^{n_{T}}$。したがって $n_{T}$ は $M$ の同型類だけで決まり、分解の取り方によらない。$n$ も $n=\sum_{T}n_{T}$（$T$ は単純加群の同型類を走る）で決まる。
:::

::: proof
**Step 1（右 $D$ 加群）.** $(f\cdot d)\cdot d'=f\circ d\circ d'=f\cdot(dd')$（$\End$ の積は合成）などは合成の結合法則から。$D$ はシューアの補題から可除環。

**Step 2（分解）.** \ref{mod:hom-sum-product}（有限直和は直積）から、$f\mapsto(\pi_{i}\circ f)_{i}$ は右 $D$ 加群の同型 $\Hom(T,M)\cong\bigoplus_{i}\Hom(T,S_{i})$（右からの合成と可換）。

**Step 3（各成分）.** $S_{i}\not\cong T$ ならシューアの補題から $\Hom(T,S_{i})=0$。$S_{i}\cong T$ なら同型 $u\colon T\to S_{i}$ をとると、$d\mapsto u\circ d$ は右 $D$ 加群の同型 $D\to\Hom(T,S_{i})$（逆は $g\mapsto u^{-1}\circ g$）。よって $\Hom(T,M)\cong D^{n_{T}}$。

**Step 4（一意性）.** $M\cong M'$ なら $\Hom(T,M)\cong\Hom(T,M')$（右 $D$ 加群として）。\ref{mod:division-ring-dependence} から $n_{T}$ は $\Hom(T,M)$ の同型類で決まる。
:::

## 問題 {#mod:sec-ss-problems}

::: problem {#mod:prob-ss-zn}
$n\ge 2$ について、$\Z$ 加群 $\Z/n\Z$ が半単純であることと、$n$ が平方因子をもたないことは同値であることを示せ。
:::

::: solution
**Step 1（⇐）.** $n=p_{1}\cdots p_{r}$（相異なる素数）なら、中国剰余定理から $\Z/n\Z\cong\bigoplus\Z/p_{i}\Z$ で、$\Z/p\Z$ は位数が素数なので部分群が自明、単純。

**Step 2（⇒）.** $p^{2}\mid n$ とする。単純な $\Z$ 加群は $\Z/L$（$L=p\Z$ は極大イデアル、\ref{mod:simple-characterization}）すなわち位数素数の巡回群で、それらの直和は各元の位数が平方因子をもたない。$\Z/n\Z$ の元 $1$ の位数 $n$ は $p^{2}$ で割り切れるので、$\Z/n\Z$ は単純加群の直和と同型でない。
:::

::: problem {#mod:prob-ss-schur-real}
$\mathbb{R}$ 代数 $R=\mathbb{C}$ について、単純 $R$ 加群 $\mathbb{C}$ の自己準同型環は $\mathbb{C}$ であり、$\mathbb{R}\cdot\id$ より大きいことを確かめよ（\ref{mod:schur-algebraically-closed} で「代数閉体」の仮定が必要な例）。
:::

::: solution
$\End_{\mathbb{C}}(\mathbb{C})\cong\mathbb{C}^{\mathrm{op}}=\mathbb{C}$（\ref{mod:endomorphism-opposite}）で、$\sqrt{-1}$ 倍は $\mathbb{R}\cdot\id$ に入らない。$\mathbb{R}$ は代数閉体でないので矛盾しない。
:::

::: supplement
**次のページへ.** 半単純環 $R$ は有限個の単純左イデアルの直和になり（$1$ が有限個の成分にしか分かれないので）、\ref{mod:semisimple-multiplicity} と \ref{mod:endomorphism-opposite} を合わせると $R\cong\End_{R}(R)^{\mathrm{op}}$ が行列環の直積として計算できる。これが\ref{mod:page-wedderburn-artin}である。

**高い視点.** 半単純加群の圏は「すべての短完全列が分裂する」アーベル圏で、ホモロジー代数的には自明（$\operatorname{Ext}^{1}=0$）である。単純加群はこの圏の「素粒子」で、シューアの補題は「異なる素粒子の間には相互作用（$0$ でない射）がない」ことを言う。線形代数の「基底の存在」と「次元の一意性」は、それぞれ \ref{mod:semisimple-equivalent} と \ref{mod:semisimple-multiplicity} の最も簡単な場合（$R=D$, 単純加群は $D$ だけ）である。
