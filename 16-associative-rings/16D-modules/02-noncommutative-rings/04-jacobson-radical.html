# ジャコブソン根基 {#mod:page-jacobson-radical keywords="Jacobson radical of a noncommutative ring, intersection of maximal left ideals, annihilator of simple modules, quasi-regular, Nakayama lemma, artinian ring radical nilpotent, R/J semisimple, Hopkins-Levitzki"}

環 $R$ の**ジャコブソン根基** $J(R)$ は、極大左イデアルすべての共通部分である（\ref{mod:jacobson-radical-def}）。非可換環では「左」を選んだことが気になるが、実は $J(R)$ は「すべての単純加群を消す元の全体」「$1-xyz$ が常に単元になる $y$ の全体」とも一致し、両側イデアルで、極大右イデアルの共通部分とも等しい（\ref{mod:jacobson-characterization}）。根基は「単純加群には見えない部分」で、\ref{mod:nakayama-noncommutative}が成り立つ。左アルティン環では $J(R)$ は冪零で、$R/J(R)$ は半単純環になる（\ref{mod:artinian-radical}）。これにより、アルティン環の研究は「半単純な部分（ウェダーバーン＝アルティン）」と「冪零な部分」に分かれる。

> Anderson–Fuller *Rings and Categories of Modules* 第 4 章（§15）を参考にした。可換環のジャコブソン根基 \ref{ring:jacobson-radical}（そこでは $\mathrm{rad}(A)$ と書いた）の非可換版である。

## 記法と定義の確認 {#mod:sec-jr-notation}

::: notation
- $R$ は環、加群は左 $R$ 加群。左・右・両側イデアルは \ref{mod:one-sided-ideal}、単純加群・極大左イデアル・その存在は \ref{mod:simple-module}, \ref{mod:simple-characterization}、半単純加群・半単純環は \ref{mod:semisimple-equivalent}, \ref{mod:semisimple-closure}。左アルティン環は \ref{mod:page-wedderburn-artin} の記法の欄。
- 加群 $M$ の**零化イデアル** $\operatorname{Ann}(M)\defeq\{r\in R : rM=0\}$ は両側イデアル（$rM=0$ なら $(sr)M=0$、$(rs)M\subset rM=0$）。
- 元 $u$ について、$vu=1$ となる $v$ を**左逆元**という。左逆元と右逆元をもつ元が単元。
- イデアル $I$ の積 $IK$ は $\{\sum a_{i}b_{i}\}$（$a_{i}\in I$, $b_{i}\in K$）、$I^{n}$ はその $n$ 乗。$I^{n}=0$ となる $n$ があるとき**冪零**、各元が冪零のとき**冪零元イデアル**（nil）という。
- **選択公理**：極大左イデアルの存在（ツォルン）を通して、根基の特徴付けで使う。アルティン環の部分では降鎖条件から極小元をとるのに従属選択公理を使う。
:::

## 定義と特徴付け {#mod:sec-jr-characterization}

::: definition ジャコブソン根基 {#mod:jacobson-radical-def keywords="Jacobson radical J(R) of a ring" index="ジャコブソン根基（非可換環）|じゃこぶそんこんきひかかんかん"}
環 $R\neq 0$ の極大左イデアルすべての共通部分を $J(R)$ と書き、$R$ の**ジャコブソン根基**という（$R=0$ なら $J(R)\defeq 0$）。
:::

::: theorem ジャコブソン根基の特徴付け {#mod:jacobson-characterization keywords="J(R) = intersection of annihilators of simple modules = {y : 1 - xy has a left inverse for all x}; two-sided; equals the right version" index="ジャコブソン根基の特徴付け（非可換）|じゃこぶそんこんきのとくちょうづけひかかん"}
（AC）$R\neq 0$、$y\in R$ について次は同値である。
1. $y\in J(R)$。
2. すべての $x\in R$ について $1-xy$ は左逆元をもつ。
3. すべての単純左 $R$ 加群 $S$ について $yS=0$。
4. すべての $x,z\in R$ について $1-xyz$ は単元。

特に $J(R)=\bigcap_{S}\operatorname{Ann}(S)$ は両側イデアルで、$J(R)$ は極大右イデアルすべての共通部分とも等しい。
:::

::: proof
**Step 1（1⇒2）.** $1-xy$ が左逆元をもたないとすると、$R(1-xy)$ は $1$ を含まない左イデアルで、極大左イデアル $L$ に含まれる（\ref{mod:simple-characterization.3}）。$y\in J(R)\subset L$ から $xy\in L$、$1=(1-xy)+xy\in L$ となり矛盾。

**Step 2（2⇒3）.** $s\in S$ で $ys\neq 0$ とする。$S$ は単純なので $R(ys)=S$（\ref{mod:simple-characterization.1}）で、$s=xys$ となる $x$ がある。$(1-xy)s=0$ に左逆元 $u$ を掛けると $s=0$、$ys\neq 0$ に反する。

**Step 3（3⇒1）.** 極大左イデアル $L$ について $R/L$ は単純（\ref{mod:simple-characterization.2}）で、$y(1+L)=y+L=0$ から $y\in L$。

**Step 4（両側イデアル）.** 1⇔3 から $J(R)=\bigcap_{S}\operatorname{Ann}(S)$ で、各 $\operatorname{Ann}(S)$ は両側イデアル。

**Step 5（$y\in J(R)\Rightarrow 1-y$ は単元）.** 2 から $u(1-y)=1$ となる $u$ がある。$u=1+uy$ で、$uy\in J(R)$（左イデアル）なので、再び 2 から $u=1-(-uy)$ も左逆元 $v$ をもつ：$vu=1$。$v=v\cdot u(1-y)=(vu)(1-y)=1-y$ なので $u(1-y)=(1-y)u=1$。

**Step 6（1⇔4）.** $y\in J(R)$ なら $xyz\in J(R)$（Step 4）で、Step 5 から $1-xyz$ は単元。逆に 4 なら $z=1$ として 2 が成り立つ。

**Step 7（右版）.** 極大右イデアルの共通部分 $J'$ について、Step 1–6 を左右入れ替えて（$R^{\mathrm{op}}$ に適用して）、$y\in J'\iff$ すべての $x,z$ で $1-xyz$ が単元。条件 4 は左右対称なので $J'=J(R)$。
:::

::: example
1. 可換環 $A$ では $J(A)=\mathrm{rad}(A)$（\ref{ring:jacobson-radical}）。$J(\Z)=0$、局所環 $(A,\mathfrak{m})$ では $J(A)=\mathfrak{m}$。
2. 半単純環 $R$ では $J(R)=0$：$R$ は単純左イデアル $L_{i}$ の和で、$J(R)$ は各 $L_{i}$ を消す（3）ので $J(R)=J(R)\cdot 1\subset J(R)R=0$。
3. 体 $k$ 上の上三角行列環 $T_{2}(k)=\left\{\begin{pmatrix}a&b\\0&c\end{pmatrix}\right\}$ では $J=\left\{\begin{pmatrix}0&b\\0&0\end{pmatrix}\right\}$（\ref{mod:prob-jr-triangular}）。
:::

::: proposition 冪零元イデアルは根基に含まれる {#mod:nil-in-radical keywords="nil one-sided ideals are contained in the Jacobson radical" index="冪零元イデアル|べきれいげんいである"}
（AC）左イデアル $I$ が冪零元イデアル（各元が冪零）なら $I\subset J(R)$。特に冪零な両側イデアルは $J(R)$ に含まれる。
:::

::: proof
$y\in I$, $x\in R$ について $xy\in I$ は冪零：$(xy)^{n}=0$。$(1+xy+\dots+(xy)^{n-1})(1-xy)=1-(xy)^{n}=1$ なので $1-xy$ は左逆元をもち、\ref{mod:jacobson-characterization.2} から $y\in J(R)$。$I^{n}=0$ なら各元は冪零。
:::

::: theorem 中山の補題（非可換） {#mod:nakayama-noncommutative keywords="Nakayama's lemma for noncommutative rings: J(R)M = M implies M = 0 for finitely generated M" index="中山の補題（非可換）|なかやまのほだいひかかん" refname="非可換環の中山の補題"}
（AC）$M$ を有限生成左 $R$ 加群とする。$J(R)M=M$ なら $M=0$。より一般に、部分加群 $N$ について $M=N+J(R)M$ なら $M=N$。
:::

::: proof
**Step 1.** $M\neq 0$ とし、生成元の個数が最小の生成系 $m_{1},\dots,m_{n}$（$n\ge 1$）をとる。$m_{n}\in M=J(R)M$ なので $m_{n}=\sum_{i}a_{i}m_{i}$（$a_{i}\in J(R)$。$J(R)M$ の元は $\sum_{k}j_{k}x_{k}$ で、各 $x_{k}$ を $m_{i}$ で書き直す）。$(1-a_{n})m_{n}=\sum_{i<n}a_{i}m_{i}$ で、$1-a_{n}$ は単元（\ref{mod:jacobson-characterization.4}）なので $m_{n}\in Rm_{1}+\dots+Rm_{n-1}$。これは最小性に反する（$n=1$ なら $m_{1}=0$ で $M=0$ に反する）。

**Step 2.** 一般の場合は $M/N$（有限生成）に Step 1 を使う：$J(R)(M/N)=(J(R)M+N)/N=M/N$。
:::

## アルティン環の根基 {#mod:sec-jr-artinian}

::: theorem アルティン環の根基 {#mod:artinian-radical keywords="for a left artinian ring, J(R) is nilpotent, R/J(R) is semisimple, J(R) is the largest nilpotent ideal" index="アルティン環の根基|あるてぃんかんのこんき"}
（AC）$R$ を左アルティン環とする。
1. $J(R)$ は有限個の極大左イデアルの共通部分で、$R/J(R)$ は半単純環。
2. $J(R)$ は冪零。したがって $J(R)$ は最大の冪零両側イデアルであり、冪零元からなる左イデアルはすべて $J(R)$ に含まれる。
:::

::: proof
**Step 1（有限個の共通部分）.** 有限個の極大左イデアルの共通部分全体は空でなく（$R\neq 0$ とする）、降鎖条件から極小元 $K=L_{1}\cap\dots\cap L_{m}$ がある（従属選択公理）。任意の極大左イデアル $L$ について $K\cap L$ も同じ形で $K$ に含まれるので、極小性から $K\cap L=K$、$K\subset L$。よって $K=J(R)$。

**Step 2（$R/J$ は半単純）.** $R/J(R)\to\bigoplus_{i}R/L_{i}$, $r+J\mapsto(r+L_{i})_{i}$ は左 $R$ 加群の単射で、右辺は単純加群の直和なので半単純。部分加群として $R/J(R)$ は半単純左 $R$ 加群（\ref{mod:semisimple-closure}）。$J(R)$ は $R/J(R)$ を消すので、その左 $R$ 部分加群と左 $R/J(R)$ 部分加群は同じで、$R/J(R)$ は半単純環。

**Step 3（冪零：安定化）.** $J\defeq J(R)$ とする。降鎖 $J\supset J^{2}\supset\cdots$ は止まり、$I\defeq J^{k}=J^{k+1}=\cdots$ となる $k$ がある。$I^{2}=J^{2k}=I$。$I\neq 0$ と仮定する。

**Step 4（冪零：極小元）.** $IK\neq 0$ となる左イデアル $K$ 全体は $I$ を含む（$I\cdot I=I\neq 0$）ので空でなく、極小元 $K$ がある（従属選択公理）。$IK\neq 0$ なので $Ia\neq 0$ となる $a\in K$ がある。$Ra\subset K$ で $I(Ra)=(IR)a=Ia\neq 0$（$I$ は両側イデアルで $IR=I$）なので、極小性から $Ra=K$。さらに $Ia\subset Ra$ は左イデアルで $I(Ia)=I^{2}a=Ia\neq 0$ なので、極小性から $Ia=Ra$。

**Step 5（冪零：矛盾）.** $a\in Ra=Ia$ から $a=ya$（$y\in I\subset J$）。$(1-y)a=0$ で $1-y$ は単元（\ref{mod:jacobson-characterization}）なので $a=0$、$Ia\neq 0$ に反する。よって $I=0$、$J^{k}=0$。

**Step 6（最大性）.** 冪零両側イデアルと冪零元からなる左イデアルは \ref{mod:nil-in-radical} から $J(R)$ に含まれ、$J(R)$ 自身が冪零。
:::

::: hypcheck
- **前提「左アルティン」**：Step 1・3・4 で降鎖条件を使った。外すと偽：$\Z$ では $J(\Z)=0$ で $\Z/J=\Z$ は半単純でない。$\Z_{(p)}$（局所環）では $J=p\Z_{(p)}$ は冪零でない。
- **選択公理**：特徴付け（ツォルン）と、降鎖条件からの極小元（従属選択公理）で使った。
:::

::: corollary ホプキンス＝レヴィツキの定理 {#mod:hopkins-levitzki keywords="Hopkins-Levitzki: left artinian rings are left noetherian" index="ホプキンス＝レヴィツキの定理|ほぷきんすれびつきのていり" refname="ホプキンス＝レヴィツキの定理"}
（AC）左アルティン環は左ネーター環である。
:::

::: proof
**Step 1（フィルトレーション）.** $J=J(R)$, $J^{n}=0$（\ref{mod:artinian-radical}）とし、$R=J^{0}\supset J\supset\cdots\supset J^{n}=0$ を考える。各 $J^{i}/J^{i+1}$ は $J$ に消される左 $R$ 加群なので左 $R/J$ 加群で、$R/J$ が半単純環なので半単純（$R/J$ 加群は $R/J$ の直和の商。\ref{mod:semisimple-closure}）。

**Step 2（各段）.** $J^{i}/J^{i+1}$ は $R$ の左イデアルの剰余なので、降鎖条件をみたす。半単純加群 $\bigoplus_{\lambda\in\Lambda}S_{\lambda}$ が降鎖条件をみたせば $\Lambda$ は有限（無限なら $\Lambda\supsetneq\Lambda_{1}\supsetneq\cdots$ に対応する真の降鎖 $\bigoplus_{\Lambda_{k}}S_{\lambda}$ が作れる）。有限個の単純加群の直和は昇鎖条件もみたす（部分加群の長さ $\ell$ が \ref{mod:semisimple-multiplicity} で定まり、\ref{mod:semisimple-ring-corollaries} の Step 4 と同じ議論で真の昇鎖の長さが有界）。

**Step 3（拡大）.** 短完全列 $0\to J^{i+1}\to J^{i}\to J^{i}/J^{i+1}\to 0$ で両端が昇鎖条件をみたせば中央もみたす（\ref{ring:noetherian-exact} の証明は可換性を使わない）。$J^{n}=0$ から下へ帰納して $R=J^{0}$ は昇鎖条件をみたす。
:::

## 問題 {#mod:sec-jr-problems}

::: problem {#mod:prob-jr-triangular}
体 $k$ 上の上三角行列環 $T=T_{2}(k)$ について、$N\defeq\left\{\begin{pmatrix}0&b\\0&0\end{pmatrix}\right\}$ が $J(T)$ に等しく、$T/J(T)\cong k\times k$ であることを示せ。
:::

::: solution
**Step 1（$N\subset J$）.** $N$ は両側イデアル（積を計算すると対角成分が $0$ のまま）で $N^{2}=0$。\ref{mod:nil-in-radical} から $N\subset J(T)$。

**Step 2（$T/N$）.** $\begin{pmatrix}a&b\\0&c\end{pmatrix}\mapsto(a,c)$ は全射な環準同型で核は $N$。よって $T/N\cong k\times k$ で、これは半単純環（\ref{mod:wedderburn-artin.2}）。

**Step 3（$J\subset N$）.** 単純 $T/N$ 加群は $T$ を通して単純 $T$ 加群で、$J(T)$ に消される（\ref{mod:jacobson-characterization.3}）。$T/N$ を左 $T/N$ 加群とみると単純加群の直和なので、$J(T)$ は $T/N$ を消す：$J(T)\cdot 1\subset N$。よって $J(T)=N$。
:::

::: problem {#mod:prob-jr-matrix}
可除環 $D$ について $J(M_{n}(D))=0$ を示せ。
:::

::: solution
$M_{n}(D)$ は半単純環（\ref{mod:column-module.2}）なので、例 2 から $J=0$。（別解：$J$ は両側イデアルで、$M_{n}(D)$ は単純環（\ref{mod:matrix-simple}）なので $J=0$ か全体。$1\notin J$（$1-1=0$ は単元でない）なので $J=0$。）
:::

::: supplement
**有限次元代数.** 体上の有限次元代数は左アルティン環なので、\ref{mod:artinian-radical} から $A/J(A)$ は半単純で、代数閉体上なら $\prod M_{n_{i}}(k)$（\ref{mod:semisimple-algebra-closed}）。さらに、$k$ が完全体（例えば標数 $0$）なら、$A/J(A)$ と同型な部分代数 $S$ があって $A=S\oplus J(A)$（ベクトル空間として）となる（ウェダーバーンの主定理。\tref{mod:wedderburn-principal}, \ref{mod:perfect-semisimple-separable}）。

**高い視点.** $J(R)$ は「すべての単純加群（既約表現）で $0$ として作用する部分」、すなわち表現論の目で見えない部分である。可換環の言葉では、極大イデアル（閉点）全体で消える関数の全体にあたる。アルティン環では、見えない部分 $J$ は冪零で「無限小の方向」に対応し、$R/J$ が「点の集まり」（行列環のブロック）を記述する。中山の補題は「見えない部分だけでは加群は作れない」という原理である。
:::
