# ウェダーバーンの主定理 {#mod:page-wedderburn-principal keywords="Wedderburn principal theorem, Wedderburn-Malcev, separable algebra, separability idempotent, Hochschild 2-cocycle, splitting of the radical, perfect field, central simple algebra D tensor D^op = End"}

体 $k$ 上の有限次元代数 $A$ の根基 $J$ について、$A/J$ は半単純である（\ref{mod:artinian-radical}）。**ウェダーバーンの主定理**（\ref{mod:wedderburn-principal}）は、$A/J$ が**分離的**（例えば $k$ が完全体）なら、$A/J$ と同型な部分代数 $S$ があって $A=S\oplus J$（ベクトル空間として）となる、すなわち「半単純な部分が $A$ の中に部分代数として取り出せる」ことを主張する。証明の鍵は、分離代数の「分離冪等元」を使って 2 余輪体を余境界にする計算（ホッホシルトコホモロジー $H^{2}=0$。\ref{mod:separable-cocycle}）で、$J^{2}=0$ の場合に帰着して帰納法で一般の場合を示す。完全体上の半単純代数が分離的であることは、ウェダーバーン＝アルティンの定理と稠密性定理から示す（\ref{mod:perfect-semisimple-separable}）。

> 資料によらず書いた（Pierce *Associative Algebras* などにあると言われる標準的な内容だが、本棚になく確認していない）。証明はすべてこのページで完結させ、使う事実は他のページの番号で示した。

## 記法と定義の確認 {#mod:sec-wp-notation}

::: notation
- $k$ は体、**代数**は $k$ 代数（$k\subset Z(A)$ となる環）、$\otimes=\otimes_{k}$。テンソル積は \ref{mod:page-tensor-products}（非可換な代数でも、$k$ 上のベクトル空間のテンソル積として同様に定義する）。
- 根基とアルティン環の根基、ウェダーバーン＝アルティンの定理、稠密性定理、行列単位 $E_{ij}$ は \ref{mod:artinian-radical}, \ref{mod:wedderburn-artin}, \ref{mod:density-theorem}, \ref{mod:matrix-ideals}。
- 代数 $S$ 上の**両側加群** $M$ は、左右から $S$ が作用し $(am)b=a(mb)$、$k$ の作用が左右で一致するもの。
- 完全体・分離拡大・原始元定理は \ref{fld:perfect-field}, \ref{fld:perfect-separable}, \ref{fld:primitive-element}。
- **選択公理**：使わない（すべて有限次元）。
:::

## 分離代数 {#mod:sec-wp-separable}

::: definition 分離代数 {#mod:separable-algebra keywords="separable algebra, separability idempotent" index="分離代数|ぶんりだいすう, 分離冪等元|ぶんりべきとうげん"}
代数 $S$ が**分離的**であるとは、$e=\sum_{i}x_{i}\otimes y_{i}\in S\otimes S$ で
1. $\sum_{i}x_{i}y_{i}=1$、
2. すべての $s\in S$ で $\sum_{i}sx_{i}\otimes y_{i}=\sum_{i}x_{i}\otimes y_{i}s$

をみたすもの（**分離冪等元**）があることをいう。
:::

::: lemma 2 余輪体は余境界 {#mod:separable-cocycle keywords="for a separable algebra every Hochschild 2-cocycle with values in a bimodule is a coboundary" index="ホッホシルト 2 余輪体|ほっほしるとにようりんたい"}
$S$ を分離代数、$M$ を $S$ 上の両側加群、$f\colon S\times S\to M$ を $k$ 双線形で
$$
af(b,c)-f(ab,c)+f(a,bc)-f(a,b)c=0\quad(a,b,c\in S)
$$
をみたすもの（**2 余輪体**）とする。$k$ 線形な $g\colon S\to M$ で $f(a,b)=ag(b)-g(ab)+g(a)b$ となるものがある。
:::

::: proof
**Step 1（定義）.** 分離冪等元 $e=\sum x_{i}\otimes y_{i}$ について $g(b)\defeq\sum_{i}x_{i}f(y_{i},b)$。

**Step 2（$ag(b)$ の書き換え）.** $b$ を固定すると $(u,v)\mapsto uf(v,b)$ は $k$ 双線形なので $S\otimes S\to M$ を誘導し、分離冪等元の 2 から $\sum ax_{i}f(y_{i},b)=\sum x_{i}f(y_{i}a,b)$。すなわち $ag(b)=\sum x_{i}f(y_{i}a,b)$。

**Step 3（計算）.** 余輪体条件を $(y_{i},a,b)$ に使うと $f(y_{i}a,b)-f(y_{i},ab)+f(y_{i},a)b=y_{i}f(a,b)$。よって
$$
\begin{aligned}
ag(b)-g(ab)+g(a)b&=\sum_{i}x_{i}\bigl(f(y_{i}a,b)-f(y_{i},ab)+f(y_{i},a)b\bigr)\\
&=\sum_{i}x_{i}y_{i}f(a,b)=f(a,b).
\end{aligned}
$$
:::

## 主定理 {#mod:sec-wp-theorem}

::: theorem ウェダーバーンの主定理 {#mod:wedderburn-principal keywords="Wedderburn principal theorem: if A/J is separable then A = S + J with S a subalgebra isomorphic to A/J" index="ウェダーバーンの主定理|うぇだーばーんのしゅていり"}
$A$ を有限次元代数、$J=J(A)$ とし、$A/J$ が分離的とする。部分代数 $S\subset A$ で、射影 $\pi\colon A\to A/J$ の制限が同型 $S\cong A/J$、したがって $A=S\oplus J$（ベクトル空間として）となるものがある。
:::

::: proof
**Step 1（$J^{2}=0$ の場合：余輪体）.** $\bar S\defeq A/J$ とし、$\pi$ の $k$ 線形な切断 $\sigma\colon\bar S\to A$（$\pi\sigma=\id$）をとる。$J^{2}=0$ なので、$J$ は $a\cdot j\defeq\sigma(a)j$, $j\cdot a\defeq j\sigma(a)$ で $\bar S$ 上の両側加群になる（$\sigma(a)$ の取り方の差は $J$ に入り $J$ を消すので、作用は $\pi$ の値だけで決まり、結合法則が成り立つ）。$f(a,b)\defeq\sigma(a)\sigma(b)-\sigma(ab)\in J$ とすると、展開して
$$
a\cdot f(b,c)-f(ab,c)+f(a,bc)-f(a,b)\cdot c=0
$$
（各項を $\sigma$ で書くとすべて打ち消し合う）。

**Step 2（$J^{2}=0$ の場合：切断の修正）.** \ref{mod:separable-cocycle} から $f(a,b)=\sigma(a)g(b)-g(ab)+g(a)\sigma(b)$ となる $g\colon\bar S\to J$ がある。$\sigma'\defeq\sigma-g$ とすると、$g(a)g(b)\in J^{2}=0$ なので
$$
\begin{aligned}
\sigma'(a)\sigma'(b)&=\sigma(a)\sigma(b)-\sigma(a)g(b)-g(a)\sigma(b)\\
&=\sigma(ab)+f(a,b)-f(a,b)-g(ab)=\sigma'(ab).
\end{aligned}
$$
$u\defeq\sigma'(1)$ は $u^{2}=u$, $u-1\in J$ で、$u=1+j$ とすると $1+2j=1+j$（$j^{2}=0$）から $j=0$。よって $\sigma'$ は代数の準同型で $\pi\sigma'=\id$、$S\defeq\sigma'(\bar S)$ が求める部分代数（$S\cap J=0$ は $\pi|_{S}$ が単射なことから、$S+J=A$ は $\pi$ の全射性から）。

**Step 3（一般の場合：帰納法）.** $\dim_{k}A$ についての帰納法。$J=0$ なら $S=A$。$J^{2}=0$ なら Step 1・2。$J^{2}\neq 0$ とする。$J$ は冪零（\ref{mod:artinian-radical}）なので $J^{2}\subsetneq J$（$J^{2}=J$ なら $J=J^{r}=0$）。$A'\defeq A/J^{2}$ の根基は $J/J^{2}$（$A'/(J/J^{2})\cong A/J$ は半単純で根基 $0$ なので $J(A')\subset J/J^{2}$、逆に冪零な両側イデアルは根基に含まれる。\ref{mod:nil-in-radical}）で、$(J/J^{2})^{2}=0$。Step 2 から部分代数 $B/J^{2}\subset A'$（$B\supset J^{2}$ は逆像）で $B/J^{2}\cong A/J$。

**Step 4（帰納法の適用）.** $B$ の根基は $J^{2}$（$B/J^{2}$ は半単純、$J^{2}$ は冪零な両側イデアル）で、$\dim B=\dim A/J+\dim J^{2}<\dim A$。帰納法の仮定から $B=S\oplus J^{2}$, $S\cong B/J^{2}\cong A/J$。$S\cap J\subset B\cap J=J^{2}$ と $S\cap J^{2}=0$ から $S\cap J=0$、次元から $A=S\oplus J$。$\pi|_{S}$ は単射な準同型で次元が等しいので同型。
:::

## 完全体上の半単純代数は分離的 {#mod:sec-wp-perfect}

::: lemma 分離代数の例と構成 {#mod:separable-constructions keywords="M_n(k) is separable; products, matrix algebras over separable algebras; finite separable field extensions are separable algebras" index="分離代数の構成|ぶんりだいすうのこうせい"}
1. 分離代数 $S_{1},S_{2}$ の直積 $S_{1}\times S_{2}$ は分離的。
2. $D$ が分離代数なら $M_{n}(D)$ も分離的。特に $M_{n}(k)$ は分離的。
3. 有限次分離拡大 $Z/k$ は（$k$ 代数として）分離的。
:::

::: proof
**Step 1（1）.** $e_{i}$ を $S_{i}$ の分離冪等元とし、$S_{i}\otimes S_{i}\subset(S_{1}\times S_{2})\otimes(S_{1}\times S_{2})$ とみて $e\defeq e_{1}+e_{2}$。$\mu(e)=(1,0)+(0,1)=1$。$s=(s_{1},s_{2})$ について $se=s_{1}e_{1}+s_{2}e_{2}$（$s_{1}$ は $S_{2}$ 成分を消す）$=e_{1}s_{1}+e_{2}s_{2}=es$。

**Step 2（2）.** $D$ の分離冪等元 $\sum_{j}x_{j}\otimes y_{j}$ について、$e\defeq\sum_{i,j}x_{j}E_{i1}\otimes E_{1i}y_{j}$（$D$ の元はスカラー行列として $E_{ij}$ と可換）。$\sum_{i,j}x_{j}E_{i1}E_{1i}y_{j}=\sum_{i}E_{ii}\sum_{j}x_{j}y_{j}=1$。$s=dE_{kl}$ について、$se=\sum_{j}dx_{j}E_{k1}\otimes E_{1l}y_{j}$ で、$(u,v)\mapsto uE_{k1}\otimes E_{1l}v$ に $D$ の分離冪等元の 2 を使うと $=\sum_{j}x_{j}E_{k1}\otimes E_{1l}y_{j}d$。一方 $es=\sum_{i,j}x_{j}E_{i1}\otimes E_{1i}y_{j}dE_{kl}=\sum_{j}x_{j}E_{k1}\otimes E_{1l}y_{j}d$。一般の $s$ は $dE_{kl}$ の和。

**Step 3（3）.** 原始元定理（\ref{fld:primitive-element}）から $Z=k(\theta)$、最小多項式 $f$ は分離的。$Z\otimes Z\cong Z[x]/(f)$（$z\otimes\theta^{i}\mapsto zx^{i}$）で、掛け算 $\mu$ は $x\mapsto\theta$ の代入に対応する。$Z[x]$ で $f=(x-\theta)h$、$h(\theta)\neq 0$（分離的）なので $(x-\theta)$ と $(h)$ は互いに素で、中国剰余定理から $Z[x]/(f)\cong Z\times Z[x]/(h)$。$e$ を $(1,0)$ に対応する冪等元とすると $\mu(e)=1$。$z=p(\theta)$ について $z\otimes 1-1\otimes z$ は $z-p(x)$ に対応し、$x=\theta$ で $0$ なので第 1 成分は $0$、$(z\otimes 1-1\otimes z)e=0$。
:::

::: lemma 中心的単純な可除代数 {#mod:central-division-separable keywords="D tensor_Z D^op = End_Z(D) for a division algebra with center Z; D is separable over Z" index="中心的単純代数|ちゅうしんてきたんじゅんだいすう"}
$D$ を中心 $Z$ 上有限次元の可除代数とする。$\Phi\colon D\otimes_{Z}D^{\mathrm{op}}\to\End_{Z}(D)$, $a\otimes b\mapsto(x\mapsto axb)$ は環同型で、$D$ は $Z$ 代数として分離的。
:::

::: proof
**Step 1（単純加群）.** $R\defeq D\otimes_{Z}D^{\mathrm{op}}$ は $(a\otimes b)\cdot x=axb$ で $D$ に作用し、$R$ 部分加群は $D$ の両側イデアルなので $0$ と $D$ だけ：$D$ は単純 $R$ 加群。$\varphi\in\End_{R}(D)$ は $\varphi(x)=\varphi(1)x=x\varphi(1)$ をみたすので $\varphi(1)\in Z$、$\End_{R}(D)=Z$。

**Step 2（同型）.** 稠密性定理（\ref{mod:density-theorem}）を $D$ の $Z$ 上の基底に使うと $\Phi$ は全射。$\dim_{Z}R=(\dim_{Z}D)^{2}=\dim_{Z}\End_{Z}(D)$ なので同型。

**Step 3（分離冪等元）.** $\lambda\colon D\to Z$ を $\lambda(1)=1$ となる $Z$ 線形写像とし、$\tau(x)\defeq\lambda(x)\in Z\subset D$ を $\tau=\Phi(e)$, $e=\sum x_{i}\otimes y_{i}$ と表す：$\sum x_{i}xy_{i}=\lambda(x)$。$x=1$ として $\sum x_{i}y_{i}=1$。$d\in D$ について、$e_{1}\defeq\sum dx_{i}\otimes y_{i}$ と $e_{2}\defeq\sum x_{i}\otimes y_{i}d$（どちらも $D\otimes_{Z}D^{\mathrm{op}}$ の元）は $\Phi(e_{1})(x)=d\lambda(x)$, $\Phi(e_{2})(x)=\lambda(x)d$ をみたし、$\lambda(x)\in Z$ なのでこれらは等しい。$\Phi$ は単射なので $e_{1}=e_{2}$。
:::

::: lemma 分離性の推移性 {#mod:separable-transitive keywords="if D is separable over Z and Z is a separable field extension of k then D is separable over k" index="分離性の推移性（代数）|ぶんりせいのすいいせいだいすう"}
$Z$ を体 $k$ の有限次分離拡大、$D$ を $Z$ 上分離的な代数（$Z\subset Z(D)$）とすると、$D$ は $k$ 上分離的。
:::

::: proof
$Z$ の分離冪等元 $\sum_{j}z_{j}\otimes w_{j}\in Z\otimes_{k}Z$ と、$D$ の $Z$ 上の分離冪等元の代表 $\sum_{i}x_{i}\otimes y_{i}$ をとり、$e\defeq\sum_{i,j}x_{i}z_{j}\otimes w_{j}y_{i}\in D\otimes_{k}D$。写像 $\beta(u,v)\defeq\sum_{j}uz_{j}\otimes w_{j}v$ は、$Z$ の分離冪等元の 2（$\sum zz_{j}\otimes w_{j}=\sum z_{j}\otimes w_{j}z$）から $\beta(uz,v)=\beta(u,zv)$ をみたすので $D\otimes_{Z}D\to D\otimes_{k}D$ を誘導し、$e$ は代表の取り方によらない。$\sum x_{i}z_{j}w_{j}y_{i}=\sum x_{i}y_{i}=1$。$d\in D$ について $\sum dx_{i}\otimes y_{i}=\sum x_{i}\otimes y_{i}d$（$D\otimes_{Z}D$）に $\beta$ を施すと $de=ed$。
:::

::: theorem 完全体上の半単純代数 {#mod:perfect-semisimple-separable keywords="a finite-dimensional semisimple algebra over a perfect field is separable" index="完全体上の半単純代数|かんぜんたいじょうのはんたんじゅんだいすう"}
完全体 $k$ 上の有限次元半単純代数は分離的。したがって、完全体上の有限次元代数 $A$ について、ウェダーバーンの主定理の結論が成り立つ。
:::

::: proof
ウェダーバーン＝アルティンの定理（\ref{mod:wedderburn-artin}）から $S\cong\prod_{i}M_{n_{i}}(D_{i})$ で、$D_{i}$ は $k$ 上有限次元の可除代数（$D_{i}\cong\End(T_{i})^{\mathrm{op}}$ は有限次元）。$D_{i}$ の中心 $Z_{i}$ は $k$ の有限次拡大で、$k$ が完全体なので分離的（\ref{fld:perfect-separable}）。\ref{mod:separable-constructions} の 3、\ref{mod:central-division-separable}、\ref{mod:separable-transitive} から $D_{i}$ は $k$ 上分離的で、\ref{mod:separable-constructions} の 2・1 から $S$ も分離的。後半は \ref{mod:wedderburn-principal}。
:::

::: hypcheck
- **前提「$A/J$ が分離的」**：\ref{mod:separable-cocycle} に使った。外すと偽：$k=\mathbb{F}_{p}(t)$, $A=k[x]/((x^{p}-t)^{2})$ では $J=(x^{p}-t)$, $A/J\cong k(t^{1/p})$（分離的でない）。$A/J$ と同型な部分代数があれば、$t^{1/p}$ に対応する元 $y=x+j$（$j\in J$）で $y^{p}=t$ となるはずだが、$y^{p}=x^{p}+j^{p}=x^{p}\neq t$（標数 $p$、$j^{2}=0$）。
- **前提「有限次元」**：根基の冪零性（帰納法）に使った。
- **選択公理**：使っていない。
:::

## 問題 {#mod:sec-wp-problems}

::: problem {#mod:prob-wp-triangular}
上三角行列環 $T_{2}(k)$ について、対角行列全体 $S$ が $A/J\cong k\times k$ と同型な部分代数で $T_{2}(k)=S\oplus J$ となることを確かめ、別の補部分代数 $S'=uSu^{-1}$（$u=1+E_{12}$）があることを示せ（$S$ は一意でない）。
:::

::: solution
$J=kE_{12}$（\ref{mod:prob-jr-triangular}）で、対角行列は $J$ と交わらず、次元 $2+1=3$。$u=1+E_{12}$ は単元（逆は $1-E_{12}$）で、$uSu^{-1}$ も部分代数、$\pi(uE_{11}u^{-1})=\pi(E_{11})$ なので $\pi$ で $A/J$ に同型に写る。$uE_{11}u^{-1}=(1+E_{12})E_{11}(1-E_{12})=E_{11}-E_{12}\notin S$ なので $S'\neq S$。
:::

::: supplement
**高い視点.** \ref{mod:separable-cocycle} は「分離代数のホッホシルトコホモロジー $H^{n}(S,M)$ は $n\ge 1$ で消える」ことの $n=2$ の場合で、ちょうど群環のマシュケの定理（$\abs{G}$ が可逆なら群コホモロジーが消える）と同じ形をしている：分離冪等元は $\frac{1}{\abs{G}}\sum_{g}g\otimes g^{-1}$ の一般化である。主定理は「代数の拡大 $0\to J\to A\to A/J\to 0$ が分裂する」ことを言い、$H^{2}$ が拡大の障害を測る。
:::
