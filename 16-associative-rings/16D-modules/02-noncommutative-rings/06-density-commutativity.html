# 稠密性定理とジェイコブソンの可換性定理 {#mod:page-density-commutativity keywords="Jacobson density theorem, primitive ring, subdirect product, Herstein lemma, Jacobson commutativity theorem x^n = x, rings without nilpotents"}

単純加群 $S$ の上で、環 $R$ は「$D=\End_{R}(S)$ 上の線形写像を、有限個の点で好きなように近似できる」ほど豊富に作用する。これが**ジェイコブソンの稠密性定理**（\tref{mod:density-theorem}）で、\ref{mod:wedderburn-artin}のアルティン性を外した一般化にあたる。応用として、すべての元 $x$ がある $n(x)\ge 2$ で $x^{n(x)}=x$ をみたす環は可換であるという**ジェイコブソンの可換性定理**（\tref{mod:jacobson-commutativity}）を示す。証明は、根基が $0$ であることから環を「単純加群に忠実に作用する環」の直積に埋め込み、稠密性定理でそれらが可除環であることを示し、最後に\ref{mod:wedderburn-little}に帰着させる。

> 稠密性定理は Anderson–Fuller 第 4 章の内容を参考にした。可換性定理の証明は、可除環の場合に「共役で元の冪になる元」を見つけるハーシュタインの議論を組み込んだ標準的なもの（Herstein *Noncommutative Rings*、書名のみ。本棚にない）を、使う事実を一つずつ確かめながら書いた。

## 記法と定義の確認 {#mod:sec-dc-notation}

::: notation
- $R$ は環、加群は左加群。単純加群・シューアの補題は \ref{mod:simple-module}, \tref{mod:schur-lemma}、ジャコブソン根基の特徴付け $J(R)=\bigcap_{S}\operatorname{Ann}(S)$ は \ref{mod:jacobson-characterization}、ウェダーバーンの小定理は \tref{mod:wedderburn-little}。
- 単純加群 $S$ について $D\defeq\End_{R}(S)$ は可除環（シューアの補題）。$d\in D$ と $s\in S$ について $d\cdot s\defeq d(s)$ で $S$ は左 $D$ 加群（ベクトル空間）になり、$R$ の作用と $D$ の作用は可換：$r(d(s))=d(rs)$。$D$ 上の一次独立・部分空間・次元はこの意味。
- 有限体と、その元の最小多項式の根が $a^{p^{j}}$ であることは \ref{fld:finite-field-automorphisms}。
- **選択公理**：使わない（ジャコブソン根基の特徴付けは単純加群全体で考え、極大左イデアルの存在は使わない向きだけを使う）。
:::

## 稠密性定理 {#mod:sec-dc-density}

::: lemma 部分空間を消す元 {#mod:density-lemma keywords="for a finite-dimensional D-subspace V of a simple module and v not in V there is r with rV = 0 and rv != 0" index="稠密性定理の補題|ちゅうみつせいていりのほだい"}
$S$ を単純加群、$D=\End_{R}(S)$、$V\subset S$ を有限次元の $D$ \term[部分空間]{lin:vector-space}、$v\in S\setminus V$ とする。$rV=0$, $rv\neq 0$ となる $r\in R$ がある。
:::

::: proof
$\dim_{D}V$ についての帰納法。$V=0$ なら $r=1$。$V=V'\oplus Du$（$u\notin V'$）とし、$V'$ では成り立つとする。$I\defeq\{r\in R : rV'=0\}$ は左イデアル。帰納法の仮定から $Iu\neq 0$ で、$Iu$ は部分加群なので $Iu=S$。

結論が偽、すなわち「$rV=0\Rightarrow rv=0$」と仮定する。$\varphi\colon S\to S$ を $\varphi(ru)\defeq rv$（$r\in I$）で定める。$ru=0$（$r\in I$）なら $r$ は $V'$ と $u$ を消すので $rV=0$、仮定から $rv=0$：矛盾なく定まる。$\varphi$ は $R$ 線形で $\varphi\in D$。$r\in I$ について $rv=\varphi(ru)=r\varphi(u)$ なので $r(v-\varphi\cdot u)=0$。すべての $r\in I$ で成り立つので、帰納法の仮定（$V'$ と元 $v-\varphi\cdot u$）から $v-\varphi\cdot u\in V'$、$v\in V'+Du=V$ となり矛盾。
:::

::: theorem ジェイコブソンの稠密性定理 {#mod:density-theorem keywords="Jacobson density theorem: R acts densely on a simple module over its endomorphism division ring" index="稠密性定理|ちゅうみつせいていり, ジェイコブソンの稠密性定理|じぇいこぶそんのちゅうみつせいていり" refname="ジェイコブソンの稠密性定理"}
$S$ を単純加群、$D=\End_{R}(S)$ とする。$D$ 上一次独立な $v_{1},\dots,v_{n}\in S$ と任意の $w_{1},\dots,w_{n}\in S$ について、$rv_{i}=w_{i}$（すべての $i$）となる $r\in R$ がある。
:::

::: proof
各 $i$ について、\ref{mod:density-lemma}（$V=\sum_{j\neq i}Dv_{j}$, $v=v_{i}$）から $r_{i}v_{j}=0$（$j\neq i$）, $r_{i}v_{i}\neq 0$ となる $r_{i}$ がある。$S$ は単純なので $Rr_{i}v_{i}=S$ で、$s_{i}r_{i}v_{i}=w_{i}$ となる $s_{i}$ がある。$r\defeq\sum_{i}s_{i}r_{i}$。
:::

::: corollary 忠実な単純加群をもつ環 {#mod:primitive-ring-cases keywords="a ring acting faithfully on a simple module S with dim_D S = 1 is a division ring; if dim >= 2 a subring maps onto M_2" index="原始環|げんしかん"}
環 $R$ が単純加群 $S$ に忠実に作用し（$\operatorname{Ann}(S)=0$）、$D=\End_{R}(S)$ とする。
1. $\dim_{D}S=1$ なら $R$ は可除環。
2. $\dim_{D}S\ge 2$ なら、$R$ の部分環 $T$ と全射環準同型 $T\to\End_{D}(V)$（$V$ は 2 次元の $D$ \term[部分空間]{lin:vector-space}）がある。特に $T$ の像に $\varphi\neq 0$, $\varphi^{2}=0$ となる元がある。
:::

::: proof
**Step 1（1）.** $S=Dv$ とする。$r\neq 0$ なら $rv\neq 0$（$rv=0$ なら $rS=rDv=D\,rv=0$ で忠実性に反する）。稠密性定理から $s(rv)=v$ となる $s$ があり、$(sr-1)v=0$ から $(sr-1)S=0$、$sr=1$。$0$ でない元がすべて左逆元をもつので、$s\neq 0$ の左逆元 $t$ について $t=t(sr)=(ts)r=r$、$rs=1$。$R\neq 0$（$S\neq 0$ に忠実）なので可除環。

**Step 2（2）.** 一次独立な $v_{1},v_{2}$ をとり $V=Dv_{1}+Dv_{2}$、$T\defeq\{r\in R : rV\subset V\}$（部分環）とする。$T\to\End_{D}(V)$, $r\mapsto r|_{V}$ は環準同型（$r$ は $D$ の作用と可換なので $r|_{V}$ は $D$ 線形）。$\psi\in\End_{D}(V)$ について、稠密性定理から $rv_{i}=\psi(v_{i})$ となる $r$ があり、$rV=D\psi(v_{1})+D\psi(v_{2})\subset V$ なので $r\in T$、$r|_{V}=\psi$。全射。$\varphi(v_{1})=0$, $\varphi(v_{2})=v_{1}$ で定まる $\varphi$ は $\varphi\neq 0$, $\varphi^{2}=0$。
:::

## ジェイコブソンの可換性定理 {#mod:sec-dc-jacobson}

::: lemma ハーシュタインの補題 {#mod:herstein-lemma keywords="in a division ring of characteristic p, a noncentral element a with a^{p^m refname="ハーシュタインの補題"} = a is conjugate to a different power a^{p^j}" index="ハーシュタインの補題|はーしゅたいんのほだい"}
$D$ を標数 $p>0$ の可除環、$a\in D$ を中心に属さず、$F\defeq\mathbb{F}_{p}[a]$ が $q=p^{m}$ 元の有限体であるような元とする。$xax^{-1}=a^{p^{j}}\neq a$ となる $x\in D^{\times}$ と $j$ がある。
:::

::: proof
**Step 1（作用素 $\delta$）.** $\delta(x)\defeq xa-ax$ とする。$f\in F$ は $a$ と可換なので $\delta(fx)=f\delta(x)$：$\delta$ は左 $F$ ベクトル空間 $D$ の $F$ 線形写像。$a$ が中心にないので $\delta\neq 0$。右からの $a$ 倍 $\rho$ と左からの $a$ 倍 $\lambda$ は可換で $\delta=\rho-\lambda$、標数 $p$ で $q$ は $p$ の冪なので $\delta^{q}=\rho^{q}-\lambda^{q}$（二項係数 $\binom{q}{k}$, $0<k<q$ は $p$ の倍数）$=\rho_{a^{q}}-\lambda_{a^{q}}=\delta$（$a^{q}=a$）。

**Step 2（固有ベクトル）.** $F$ の元 $\mu$ に対し $e_{\mu}\defeq\prod_{\nu\neq\mu}(\delta-\nu)(\mu-\nu)^{-1}$（$\nu$ は $F$ を動く。$\nu$ は左からの $\nu$ 倍）とおく。$x^{q}-x=\prod_{\nu\in F}(x-\nu)$ と $\delta^{q}=\delta$ から $(\delta-\mu)e_{\mu}=0$、また多項式の恒等式 $\sum_{\mu}\prod_{\nu\neq\mu}\frac{x-\nu}{\mu-\nu}=1$（次数 $<q$ で $q$ 点で $1$）から $\sum_{\mu}e_{\mu}=\id$。$\delta\neq 0$ なので、ある $\mu\neq 0$ で $e_{\mu}\neq 0$（すべての $\mu\neq 0$ で $e_{\mu}=0$ なら $\id=e_{0}$ で $\delta=\delta e_{0}=0$）。$e_{\mu}(y)\neq 0$ となる $y$ をとり $x\defeq e_{\mu}(y)$ とすると $\delta(x)=\mu x$。

**Step 3（共役）.** $xa-ax=\mu x$ から $xax^{-1}=a+\mu\in F$, $a+\mu\neq a$。$y\mapsto xyx^{-1}$ は $D$ の自己同型なので、$a+\mu$ は $a$ と同じ $\mathbb{F}_{p}$ 上の最小多項式をもつ。その根は $F$ の中で $a^{p^{j}}$ の形（\ref{fld:finite-field-automorphisms}：$F=\mathbb{F}_{p}(a)$ のフロベニウス冪による像は最小多項式の根で、次数個ある）なので $xax^{-1}=a^{p^{j}}$。
:::

::: theorem ジェイコブソンの可換性定理 {#mod:jacobson-commutativity keywords="Jacobson's theorem: if every x satisfies x^{n(x) refname="ジェイコブソンの可換性定理"} = x with n(x) >= 2 then R is commutative" index="ジェイコブソンの可換性定理|じぇいこぶそんのかかんせいていり"}
環 $R$ のすべての元 $x$ が、ある $n(x)\ge 2$ について $x^{n(x)}=x$ をみたすなら、$R$ は可換である。
:::

::: proof
**Step 1（冪零元がない）.** $x^{k}=0$ なら、$x=x^{n}=x^{n^{2}}=\cdots$ で $n^{i}\ge k$ となる $i$ をとると $x=0$。部分環・剰余環も同じ性質 $x^{n(x)}=x$ をもつ。

**Step 2（根基は $0$）.** $y\in J(R)$ について $n=n(y)$ とすると $y(1-y^{n-1})=0$。$y^{n-1}\in J(R)$ なので $1-y^{n-1}$ は単元（\ref{mod:jacobson-characterization.4}）で、$y=0$。

**Step 3（直積への埋め込み）.** $J(R)=\bigcap_{S}\operatorname{Ann}(S)=0$ なので、$R\to\prod_{S}R/\operatorname{Ann}(S)$ は単射（$S$ は単純加群の同型類を走る）。各 $R'\defeq R/\operatorname{Ann}(S)$ が可換であることを示せばよい。$R'$ は $S$ に忠実に作用し、$S$ は単純 $R'$ 加群。

**Step 4（$R'$ は可除環）.** \ref{mod:primitive-ring-cases.2} の場合なら、部分環 $T$ の元 $t$ で像が $\varphi\neq 0$, $\varphi^{2}=0$ となるものがあり、$t^{n}=t$ から $\varphi=\varphi^{n}=0$、矛盾。よって $\dim_{D}S=1$ で、1 から $R'$ は可除環。

**Step 5（標数）.** 可除環 $R'$ で $n=n(2\cdot 1)$ とすると $(2^{n}-2)\cdot 1=0$、$2^{n}-2>0$ なので標数は素数 $p$。各 $a\in R'$ は $x^{n(a)}-x\in\mathbb{F}_{p}[x]$ の根なので、$\mathbb{F}_{p}[a]$ は有限な整域、すなわち有限体。

**Step 6（可換）.** $a\in R'$ が中心にないとすると、\ref{mod:herstein-lemma}から $xax^{-1}=a^{i}\neq a$ となる $x\neq 0$ がある。$F=\mathbb{F}_{p}[a]$ について $xFx^{-1}\subset F$（$a$ の像 $a^{i}$ が $F$ に入る）で、$x^{n(x)-1}=1$ なので $x$ の冪は有限個。$W\defeq\sum_{j\ge 0}Fx^{j}$ は有限集合で、$x^{j}f=(x^{j}fx^{-j})x^{j}$ から積で閉じ、$1$ を含む部分環。有限な整域（可除環の部分環）は可除環なので、\ref{mod:wedderburn-little}から $W$ は可換で、$xa=ax$ となり矛盾。よって $R'$ は可換。
:::

::: hypcheck
- **前提「すべての元で $x^{n(x)}=x$」**：Step 1（冪零元がない）、Step 2（根基が $0$）、Step 4（$M_{2}$ 型の像の排除）、Step 5（標数と有限性）に使った。$n(x)$ が元によって違ってよいことに注意。$n$ が一定のときも主張は同じ。
- **有限性**：一般の環 $R$ は無限でよい。有限なのは Step 6 の部分環 $W$ だけで、そこでウェダーバーンの小定理を使った。
- **選択公理**：使っていない。
:::

## 問題 {#mod:sec-dc-problems}

::: problem {#mod:prob-dc-boolean}
すべての元が $x^{2}=x$ をみたす環（ブール環）は可換で、さらに $2x=0$ をみたすことを、\ref{mod:jacobson-commutativity} を使わずに直接示せ。
:::

::: solution
$(x+x)^{2}=x+x$ を展開して $4x=2x$、$2x=0$。$(x+y)^{2}=x+y$ を展開して $xy+yx=0$、すなわち $xy=-yx=yx$（$2yx=0$）。
:::

::: problem {#mod:prob-dc-artin-wedderburn}
$R$ を左アルティン環で、単純加群 $S$ に忠実に作用するものとする。稠密性定理から $R\cong M_{n}(D^{\mathrm{op}})$（$n=\dim_{D}S$）を導け（ウェダーバーン＝アルティンの単純環の場合）。
:::

::: solution
**Step 1（有限次元）.** $\dim_{D}S=\infty$ なら一次独立な列 $v_{1},v_{2},\dots$ について、$\operatorname{Ann}(v_{1},\dots,v_{k})$ は左イデアルの真の降鎖（稠密性定理から $v_{k+1}$ を消さない元が $\operatorname{Ann}(v_{1},\dots,v_{k})$ にある）で、アルティン性に反する。

**Step 2（同型）.** $n=\dim_{D}S<\infty$ なら、$R\to\End_{D}(S)$ は忠実性から単射、稠密性定理（基底に適用）から全射。$\End_{D}(S)\cong M_{n}(D^{\mathrm{op}})$（$D$ を左から作用させた $n$ 次元空間の自己準同型。\ref{mod:endomorphism-opposite} と同様の計算）。
:::

::: supplement
**高い視点.** 稠密性定理の「稠密」は、$R$ の像が $\End_{D}(S)$ の中で有限位相（各点収束の位相）について稠密であることを意味する。単純加群に忠実に作用する環を**原始環**といい、根基が $0$ の環は原始環の部分直積になる（Step 3 の議論）。可換性定理はこの「原始環への分解」と「可除環の有限性」の組み合わせで、ジェイコブソンの構造理論の典型的な応用である。
:::
