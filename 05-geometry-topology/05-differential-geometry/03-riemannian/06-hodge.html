# ホッジの星作用素とラプラシアン {#riem:page-hodge keywords="Hodge star operator on differential forms of an oriented Riemannian manifold, inner product on forms, conformal invariance in middle degree, interior product and star of 1-forms, divergence, codifferential delta as the formal adjoint of d, Hodge Laplacian, Laplace-Beltrami operator in coordinates, harmonic forms on compact manifolds, Hodge theorem"}

外微分 $d$・ウェッジ積・ストークスの定理は、可微分構造だけから決まった（多様体論）。そこに計量と向きを加えると、各点の外積代数にホッジの星作用素 $\star$（\ref{lin:hodge-star}）が入り、$k$ 形式と $(n-k)$ 形式が対応する。$\star$ を使うと、$d$ の「随伴」である**余微分** $\delta$ と、**ホッジのラプラシアン** $\Delta=d\delta+\delta d$ が定義できる。関数の上では $\Delta$ は勾配の発散（の符号を変えたもの）で、ユークリッド空間の $-\sum\partial_{i}^{2}$ の一般化である。このページでは、これらを定義し、コンパクトな多様体の上で $\delta$ が $d$ の随伴であること（\ref{riem:codifferential-adjoint}）と、調和形式の特徴づけを示す。$\star$ が計量と向きに依存することが、これらが多様体論ではなく微分幾何に属する理由である。

## 記法と定義の確認 {#riem:sec-hd-notation}

::: notation
- 外積代数の内積とホッジの星作用素（線形代数）は \ref{lin:exterior-inner-product}, \ref{lin:hodge-star}。微分形式・外微分は \ref{mfd:differential-form}, \ref{mfd:exterior-derivative}、内部積は \ref{mfd:interior-product}、さらに \ref{mfd:cartan-formula}、ストークスの定理とその帰結は \ref{mfd:stokes-theorem}, \ref{mfd:stokes-corollaries}。
- $(M,g)$ は向きづけられた $n$ 次元のリーマン多様体（$n\ge1$）、$\mathrm{vol}_{g}$ はリーマン体積形式（\ref{riem:volume-form}）、$\flat,\sharp$, $\operatorname{grad}$ は \ref{riem:musical-gradient}。$\Omega^{k}(M)$ は滑らかな $k$ 形式の全体。
- $T_{m}^{*}M$ には、$\flat$ で $T_{m}M$ の内積を移した内積 $\langle\eta,\zeta\rangle\defeq\langle\eta^{\sharp},\zeta^{\sharp}\rangle$（座標では $\sum g^{ij}\eta_{i}\zeta_{j}$）を入れる。正規直交基底 $(e_{i})$ の双対基底 $(\theta^{i})$ はこの内積で正規直交である（$\theta^{i}=e_{i}^{\flat}$）。$\Lambda^{k}T_{m}^{*}M$ には \ref{lin:exterior-inner-product} の内積を入れる。
:::

## 星作用素 {#riem:sec-hd-star}

::: definition 微分形式の星作用素 {#riem:hodge-star keywords="Hodge star on forms: (star alpha)_m is the linear-algebra Hodge star of alpha_m on the oriented inner product space T*_mM; alpha ^ star beta = <alpha, beta> vol_g" index="ホッジの星作用素（多様体）|ほっじのほしさようそたようたい, ホッジのスター作用素（微分形式）|ほっじのすたーさようそびぶんけいしき"}
$\alpha\in\Omega^{k}(M)$ について、各点 $m$ で、向きづけられた内積空間 $T_{m}^{*}M$（向きは $\mathrm{vol}_{g}$ の類）のホッジの星作用素を $\alpha_{m}$ に施したものを $(\star\alpha)_{m}$ とする。これを**星作用素**（ホッジの星作用素）という。
:::

::: proposition 星作用素の性質 {#riem:hodge-star-properties keywords="star maps smooth k-forms to smooth (n-k)-forms; star theta^I = sign(I, I^c) theta^{I^c} in a positive orthonormal coframe; star 1 = vol, star vol = 1, star star = (-1)^{k(n-k)}; alpha ^ star beta = <alpha,beta> vol" index="星作用素の性質|ほしさようそのせいしつ"}
1. 正の正規直交な局所フレーム $(e_{i})$ の双対 $(\theta^{i})$ について $\star\theta^{I}=\varepsilon(I,I^{c})\,\theta^{I^{c}}$。とくに $\star\alpha$ は滑らかで、$\star\colon\Omega^{k}(M)\to\Omega^{n-k}(M)$ は $C^{\infty}(M)$ 線形。
2. $\alpha\wedge\star\beta=\langle\alpha,\beta\rangle\,\mathrm{vol}_{g}$、$\star1=\mathrm{vol}_{g}$、$\star\mathrm{vol}_{g}=1$、$\star\star=(-1)^{k(n-k)}$（$\Omega^{k}$ 上）。
3. 正の定数 $\lambda$ について計量を $\lambda^{2}g$ に替えると、$k$ 形式の上の星作用素は $\lambda^{n-2k}$ 倍になる。とくに $n=2k$ なら $\star\colon\Omega^{k}\to\Omega^{k}$ は計量の定数倍で変わらない。
:::

::: proof
**1.** 各点の正規直交基底を作るため、正の座標フレームにグラム–シュミットを施した正規直交フレーム $(e_{i})$ を局所的にとる（\ref{mfd:reduction-orthogonal.1}。グラム–シュミットは向きを保つ）。その双対 $\theta^{i}$ は滑らかな 1 形式で、各点で $T_{m}^{*}M$ の正の正規直交基底になる（$\theta^{1}\wedge\cdots\wedge\theta^{n}(e_{1},\dots,e_{n})=1$ で、\ref{riem:volume-form} から $\theta^{1}\wedge\cdots\wedge\theta^{n}=\mathrm{vol}_{g}$）。\ref{lin:hodge-star.2} から公式が成り立つ。$\alpha=\sum_{I}a_{I}\theta^{I}$（$a_{I}$ は滑らか）なら $\star\alpha=\sum_{I}a_{I}\varepsilon(I,I^{c})\theta^{I^{c}}$ は滑らかで、$C^{\infty}$ 線形性も見てとれる。

**2.** 各点で \ref{lin:hodge-star} の 1・2 を使う。$\star1=\mathrm{vol}_{g}$ と $\star\mathrm{vol}_{g}=1$ は 1 の公式で $I=\varnothing$, $I=\{1,\dots,n\}$ の場合。

**3.** $\lambda^{2}g$ の正の正規直交フレームは $e_{i}/\lambda$ で、双対は $\lambda\theta^{i}$。1 の公式を $\lambda^{2}g$ について書くと $\star'(\lambda^{k}\theta^{I})=\varepsilon(I,I^{c})\lambda^{n-k}\theta^{I^{c}}$、つまり $\star'\theta^{I}=\lambda^{n-2k}\star\theta^{I}$。
:::

::: example 平面と空間の星作用素 {#riem:hodge-star-examples keywords="star on R^2: star dx = dy, star dy = -dx; on R^3: star dx = dy ^ dz, star dy = dz ^ dx, star dz = dx ^ dy; curl and divergence via d and star" index="回転と星作用素|かいてんとほしさようそ"}
1. $\mathbb{R}^{2}$（標準の向きと計量）では $\star dx=dy$, $\star dy=-dx$。
2. $\mathbb{R}^{3}$ では $\star dx=dy\wedge dz$, $\star dy=dz\wedge dx$, $\star dz=dx\wedge dy$。ベクトル場 $F$ について $\star d(F^{\flat})=(\operatorname{rot}F)^{\flat}$, $\star d\star(F^{\flat})=\operatorname{div}F$。
:::

::: proof
1・2 の星作用素は \ref{riem:hodge-star-properties.1} の公式（$\theta^{i}=dx_{i}$、$\varepsilon(\{1\},\{2,3\})=1$, $\varepsilon(\{2\},\{1,3\})=-1$ なので $\star dy=-dx\wedge dz=dz\wedge dx$ など）。2 の後半：$F^{\flat}=F_{1}dx+F_{2}dy+F_{3}dz$ について $dF^{\flat}=(\partial_{y}F_{3}-\partial_{z}F_{2})dy\wedge dz+\cdots$ で、$\star$ を施すと $\operatorname{rot}F$ の成分が並ぶ。$\star F^{\flat}=F_{1}dy\wedge dz+F_{2}dz\wedge dx+F_{3}dx\wedge dy$ で、$d$ を施すと $(\partial_{x}F_{1}+\partial_{y}F_{2}+\partial_{z}F_{3})\,dx\wedge dy\wedge dz$、$\star$ で関数 $\operatorname{div}F$ になる。
:::

## 発散と余微分 {#riem:sec-hd-codifferential}

::: lemma 1 形式の星と内部積 {#riem:star-interior keywords="star X^flat = i_X vol_g for a vector field X" index="星作用素と内部積|ほしさようそとないぶせき"}
ベクトル場 $X$ について $\star(X^{\flat})=i_{X}\mathrm{vol}_{g}$。
:::

::: proof
任意の 1 形式 $\alpha$ について、$\alpha\wedge\mathrm{vol}_{g}=0$（$n+1$ 形式）に内部積の反微分性（\ref{mfd:interior-product-properties}）を使うと $0=i_{X}(\alpha\wedge\mathrm{vol}_{g})=\alpha(X)\mathrm{vol}_{g}-\alpha\wedge i_{X}\mathrm{vol}_{g}$。一方 $\alpha\wedge\star X^{\flat}=\langle\alpha,X^{\flat}\rangle\mathrm{vol}_{g}=\alpha(X)\mathrm{vol}_{g}$。よって $\alpha\wedge(\star X^{\flat}-i_{X}\mathrm{vol}_{g})=0$ がすべての $\alpha$ で成り立ち、ウェッジ積の対 $\Lambda^{1}\times\Lambda^{n-1}\to\Lambda^{n}$ が完全な対である（\ref{lin:hodge-star} の証明の Step 1）ことから $\star X^{\flat}=i_{X}\mathrm{vol}_{g}$。
:::

::: definition 発散 {#riem:divergence keywords="divergence of a vector field: L_X vol = (div X) vol; div X = (1/sqrt g) sum d_i (sqrt g X^i)" index="発散（リーマン多様体）|はっさんりーまんたようたい"}
ベクトル場 $X$ について、$d(i_{X}\mathrm{vol}_{g})=(\operatorname{div}X)\,\mathrm{vol}_{g}$ で定まる関数 $\operatorname{div}X$ を $X$ の**発散**という。\ref{mfd:cartan-formula} と $d\mathrm{vol}_{g}=0$ から、$L_{X}\mathrm{vol}_{g}=(\operatorname{div}X)\mathrm{vol}_{g}$ でもある。
:::

正の座標近傍で $\mathrm{vol}_{g}=\sqrt{g}\,dx_{1}\wedge\cdots\wedge dx_{n}$（$\sqrt{g}\defeq\sqrt{\det(g_{ij})}$）、$X=\sum X^{i}\partial_{i}$ とすると、$i_{X}\mathrm{vol}_{g}=\sum_{i}(-1)^{i-1}\sqrt{g}X^{i}\,dx_{1}\wedge\cdots\widehat{dx_{i}}\cdots\wedge dx_{n}$ なので
$$
\operatorname{div}X=\frac{1}{\sqrt{g}}\sum_{i}\partial_{i}\bigl(\sqrt{g}\,X^{i}\bigr).
$$

::: definition 余微分とラプラシアン {#riem:codifferential keywords="codifferential delta = (-1)^{n(k+1)+1} star d star on k-forms; delta^2 = 0; Hodge Laplacian Delta = d delta + delta d; harmonic forms" index="余微分|よびぶん, ホッジのラプラシアン|ほっじのらぷらしあん, ラプラス–ベルトラミ作用素|らぷらすべるとらみさようそ, 調和形式|ちょうわけいしき"}
$k\ge1$ について $\delta\colon\Omega^{k}(M)\to\Omega^{k-1}(M)$ を
$$
\delta\defeq(-1)^{n(k+1)+1}\star d\star
$$
と定め（$\delta=0$ on $\Omega^{0}$）、**余微分**という。$\Delta\defeq d\delta+\delta d\colon\Omega^{k}\to\Omega^{k}$ を**ホッジのラプラシアン**、$\Delta\alpha=0$ となる $\alpha$ を**調和形式**という。関数の上の $\Delta=\delta d$ を**ラプラス–ベルトラミ作用素**ともいう。
:::

$\delta\delta=\pm\star d\star\star d\star=\pm\star dd\star=0$（$\star\star=\pm1$ と $dd=0$）。

::: proposition 関数のラプラシアン {#riem:laplace-beltrami keywords="on functions Delta f = -div grad f = -(1/sqrt g) sum d_i (sqrt g g^{ij} d_j f); on R^n Delta = -sum d_i^2; delta X^flat = -div X" index="ラプラシアンの座標表示|らぷらしあんのざひょうひょうじ"}
1. ベクトル場 $X$ について $\delta(X^{\flat})=-\operatorname{div}X$。
2. $f\in C^{\infty}(M)$ について
$$
\Delta f=-\operatorname{div}\operatorname{grad}f=-\frac{1}{\sqrt{g}}\sum_{i,j}\partial_{i}\bigl(\sqrt{g}\,g^{ij}\partial_{j}f\bigr).
$$
とくに $\mathbb{R}^{n}$ では $\Delta f=-\sum_{i}\partial_{i}^{2}f$。
:::

::: proof
**1.** $k=1$ では符号は $(-1)^{2n+1}=-1$ なので $\delta X^{\flat}=-\star d\star X^{\flat}=-\star d(i_{X}\mathrm{vol}_{g})$（\ref{riem:star-interior}）$=-\star((\operatorname{div}X)\mathrm{vol}_{g})=-\operatorname{div}X$（$\star\mathrm{vol}_{g}=1$ と $C^{\infty}$ 線形性）。

**2.** $\Delta f=\delta df$ で、$df=(\operatorname{grad}f)^{\flat}$ なので 1 から $-\operatorname{div}\operatorname{grad}f$。座標の式は $\operatorname{grad}f=\sum g^{ij}\partial_{j}f\,\partial_{i}$ と発散の式から。
:::

符号は、$\Delta$ が「非負」になるように選んである（次の命題の後の注意）。解析学で使う $\sum\partial_{i}^{2}$ とは符号が逆である。

::: theorem 余微分は外微分の随伴 {#riem:codifferential-adjoint keywords="on a compact oriented Riemannian manifold without boundary, (d alpha, beta) = (alpha, delta beta) for the L^2 inner product (alpha, beta) = int <alpha, beta> vol" index="余微分の随伴性|よびぶんのずいはんせい, L2 内積（微分形式）|えるにないせきびぶんけいしき"}
$M$ をコンパクトで境界のない、向きづけられたリーマン多様体とし、$k$ 形式の上の内積を $(\alpha,\beta)\defeq\int_{M}\langle\alpha,\beta\rangle\,\mathrm{vol}_{g}=\int_{M}\alpha\wedge\star\beta$ と定める。$\alpha\in\Omega^{k-1}(M)$, $\beta\in\Omega^{k}(M)$ について
$$
(d\alpha,\beta)=(\alpha,\delta\beta).
$$
:::

::: proof
**Step 1（ストークス）.** $\alpha\wedge\star\beta$ は $(n-1)$ 形式で、外微分のライプニッツ則から $d(\alpha\wedge\star\beta)=d\alpha\wedge\star\beta+(-1)^{k-1}\alpha\wedge d\star\beta$。$M$ はコンパクトで境界がないので、\ref{mfd:stokes-corollaries.1} から左辺の積分は $0$：
$$
(d\alpha,\beta)=\int_{M}d\alpha\wedge\star\beta=(-1)^{k}\int_{M}\alpha\wedge d\star\beta.
$$

**Step 2（$d\star\beta$ を星で書き直す）.** $d\star\beta$ は $(n-k+1)$ 形式で、$\star\star=(-1)^{j(n-j)}$（$j=n-k+1$）から $d\star\beta=(-1)^{(n-k+1)(k-1)}\star(\star d\star\beta)$。よって
$$
\alpha\wedge d\star\beta=(-1)^{(n-k+1)(k-1)}\alpha\wedge\star(\star d\star\beta)=(-1)^{(n-k+1)(k-1)}\langle\alpha,\star d\star\beta\rangle\mathrm{vol}_{g}.
$$

**Step 3（符号）.** Step 1・2 から $(d\alpha,\beta)=(-1)^{k+(n-k+1)(k-1)}(\alpha,\star d\star\beta)$。2 を法として、$(n-k+1)(k-1)=(n+1)(k-1)-k(k-1)\equiv(n+1)(k-1)$（$k(k-1)$ は連続する整数の積なので偶数）。よって指数は $k+(n+1)(k-1)=nk-n+2k-1\equiv n(k+1)+1$（$nk-n+2k-1$ と $nk+n+1$ の差 $-2n+2k-2$ は偶数）。これは $\delta$ の定義の符号 $(-1)^{n(k+1)+1}$ と一致し、$(d\alpha,\beta)=(\alpha,\delta\beta)$。

::: hypcheck
- **コンパクトで境界がない**：Step 1 で境界項が消えることに使った。$M$ が非コンパクトでも、$\alpha$ か $\beta$ の台がコンパクトなら、同じ議論が（台がコンパクトな形式についてのストークスの定理で）通る。境界があると境界項 $\int_{\partial M}\alpha\wedge\star\beta$ が残る。
- **向き**：$\star$ と積分の定義に使った。向き付け不可能な多様体でも、$\langle\alpha,\beta\rangle$ はリーマン測度で積分でき、$\delta$ は局所的には向きの取り方によらない（$\star$ が二回現れて符号が打ち消す）ので、同じ結論が成り立つ。
:::
:::

::: corollary 調和形式の特徴づけ {#riem:harmonic-forms keywords="on a compact oriented Riemannian manifold without boundary, (Delta alpha, alpha) = |d alpha|^2 + |delta alpha|^2, so Delta alpha = 0 iff d alpha = 0 and delta alpha = 0; harmonic functions are locally constant" index="調和形式の特徴づけ|ちょうわけいしきのとくちょうづけ, 調和関数（多様体）|ちょうわかんすうたようたい"}
\ref{riem:codifferential-adjoint} の状況で、$\alpha\in\Omega^{k}(M)$ について
$$
(\Delta\alpha,\alpha)=(d\alpha,d\alpha)+(\delta\alpha,\delta\alpha).
$$
したがって $\Delta\alpha=0$ と「$d\alpha=0$ かつ $\delta\alpha=0$」は同値である。とくに、連結な $M$ 上の調和関数は定数である。
:::

::: proof
$(\Delta\alpha,\alpha)=(d\delta\alpha,\alpha)+(\delta d\alpha,\alpha)=(\delta\alpha,\delta\alpha)+(d\alpha,d\alpha)$（随伴性を二回。$(\delta d\alpha,\alpha)=(\alpha,\delta d\alpha)=(d\alpha,d\alpha)$ は内積の対称性と随伴性）。$(\cdot,\cdot)$ は正定値（$h\defeq\langle\gamma,\gamma\rangle\ge0$ は連続で、$\gamma\neq0$ ならある開集合の上で正。正の座標近傍と 1 の分割による積分の定義から、$\int_{M}h\,\mathrm{vol}_{g}>0$）なので、$\Delta\alpha=0$ なら $d\alpha=0$ かつ $\delta\alpha=0$。逆は定義から。関数 $f$ について $\delta f=0$ なので、$\Delta f=0$ なら $df=0$、連結なら定数。
:::

この式から $(\Delta\alpha,\alpha)\ge0$ で、$\Delta$ は「非負」な作用素である。

::: fact ホッジの定理 {#riem:hodge-theorem keywords="Hodge theorem: on a compact oriented Riemannian manifold every de Rham class contains a unique harmonic form; Omega^k = H^k + d Omega^{k-1} + delta Omega^{k+1}; Poincare duality b_k = b_{n-k} via star" index="ホッジの定理|ほっじのていり, ホッジ分解|ほっじぶんかい"}
$M$ をコンパクトで境界のない、向きづけられたリーマン多様体とし、$\mathcal{H}^{k}$ を調和 $k$ 形式の空間とする。
1. $\mathcal{H}^{k}$ は有限次元で、$\Omega^{k}(M)=\mathcal{H}^{k}\oplus d\Omega^{k-1}(M)\oplus\delta\Omega^{k+1}(M)$（$L^{2}$ 内積で直交する直和、**ホッジ分解**）。
2. 各ド・ラーム・コホモロジー類（\ref{mfd:de-rham-cohomology}）は、ただ一つの調和形式を含む。したがって $H^{k}(M)\cong\mathcal{H}^{k}$。
3. $\star$ は $\mathcal{H}^{k}$ を $\mathcal{H}^{n-k}$ に同型に写す。とくに $\dim H^{k}(M)=\dim H^{n-k}(M)$（ポアンカレ双対性のベッチ数の版）。

（1・2 の証明には楕円型偏微分作用素の理論（正則性と、コンパクト作用素のスペクトル理論）が要る。たとえばワーナー『Foundations of Differentiable Manifolds and Lie Groups』第 6 章。3 は、$\star\Delta=\Delta\star$ と 2 から従う。）
:::

::: supplement
**高い視点：計量が入ると「随伴」が使える.** $d$ は可微分構造だけで決まる作用素で、ド・ラーム・コホモロジー $\ker d/\operatorname{im}d$ は位相不変量である。計量を入れると形式の空間に内積が入り、$d$ の随伴 $\delta$ が定まる。すると「コホモロジー類の中で、ノルムが最小の代表元」を選ぶことができ、それが調和形式である（$\alpha+d\beta$ のノルムを最小にする条件が $\delta\alpha=0$）。有限次元の線形代数で、部分空間による商 $V/W$ を直交補空間 $W^{\perp}$ と同一視するのと同じ発想で、ホッジの定理はその無限次元版である。比喩で言えば、位相（コホモロジー）は「どの穴を一周するか」だけを決め、計量はその中で「最もまっすぐな一周の仕方」を選ばせる。

**補足.** \ref{riem:hodge-star-properties.3} から、4 次元多様体の 2 形式の上の $\star$ は計量の定数倍（さらに一般に共形変換）で変わらず、$\star^{2}=1$ なので $\Omega^{2}=\Omega^{+}\oplus\Omega^{-}$（自己双対・反自己双対）に分かれる。これはヤン–ミルズ理論やドナルドソンの理論（\ref{mfd:smooth-structure-facts.2}）の出発点である。
:::

## 問題 {#riem:sec-hd-problems}

::: problem {#riem:prob-hd-hyperbolic-laplacian}
上半平面 $\mathbb{H}^{2}$（計量 $(dx^{2}+dy^{2})/y^{2}$）のラプラシアンが $\Delta f=-y^{2}(\partial_{x}^{2}f+\partial_{y}^{2}f)$ であることを示せ。
:::

::: solution
$g_{ij}=\delta_{ij}/y^{2}$ なので $\sqrt{g}=1/y^{2}$, $g^{ij}=y^{2}\delta_{ij}$, $\sqrt{g}g^{ij}=\delta_{ij}$。\ref{riem:laplace-beltrami.2} から $\Delta f=-y^{2}\sum_{i}\partial_{i}(\partial_{i}f)$。
:::

::: problem {#riem:prob-hd-volume-not-exact}
コンパクトで境界のない、向きづけられたリーマン多様体 $M\neq\varnothing$ について、$\mathrm{vol}_{g}$ は調和形式であることを示し、ホッジの定理を使わずに、$\mathrm{vol}_{g}$ が完全形式でないことを \ref{riem:codifferential-adjoint} から導け。
:::

::: solution
$d\mathrm{vol}_{g}=0$（$n+1$ 形式）、$\delta\mathrm{vol}_{g}=\pm\star d\star\mathrm{vol}_{g}=\pm\star d1=0$ なので調和。$\mathrm{vol}_{g}=d\eta$ とすると、$(\mathrm{vol}_{g},\mathrm{vol}_{g})=(d\eta,\mathrm{vol}_{g})=(\eta,\delta\mathrm{vol}_{g})=0$。一方 $(\mathrm{vol}_{g},\mathrm{vol}_{g})=\int_{M}\mathrm{vol}_{g}>0$（$\langle\mathrm{vol}_{g},\mathrm{vol}_{g}\rangle=1$）で矛盾。（\ref{mfd:stokes-corollaries.3} の別証明である。）
:::
