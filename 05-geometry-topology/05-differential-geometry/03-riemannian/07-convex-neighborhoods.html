# 凸近傍と良い被覆 {#riem:page-convex-neighborhoods keywords="uniformly normal neighbourhoods, the map v -> (pi v, exp v), Whitehead's theorem on convex balls, second derivative of the squared distance along geodesics, geodesically convex open sets, intersections of convex sets, convex sets are diffeomorphic to star-shaped sets, existence of good covers refining any open cover of a smooth manifold"}

\ref{mfd:de-rham-theorem} の証明では、多様体を、有限個の共通部分がすべて「単純な形」（$\mathbb{R}^{n}$ の星形の開集合と微分同相）になる開集合で覆う必要がある（**良い被覆**）。座標近傍の中の凸集合は、別の座標近傍の凸集合と交わると凸とは限らないので、座標によらない「凸性」が要る。このページでは、補助的にリーマン計量を一つ選び、十分小さな距離球が**測地的に凸**であること（ホワイトヘッドの定理、\ref{riem:convex-balls}）を示す。凸性は共通部分で保たれ、凸な開集合は指数写像で星形の開集合に移るので、どの開被覆も良い被覆で細分できる（\ref{riem:good-cover-exists}）。結論は計量によらない（計量は道具として使うだけ）。

## 記法と定義の確認 {#riem:sec-cx-notation}

::: notation
- 指数写像・正規球・ガウスの補題・局所的な最短性は \ref{riem:exponential-map}, \ref{riem:exponential-properties}, \ref{riem:geodesics-minimize}。リーマン距離が多様体の位相を与えることは \ref{riem:distance-metric}。リーマン計量の存在は \ref{mfd:fiber-metric-existence}。
- 逆関数定理は \ref{mfd:inverse-function-theorem}、接束の自然な座標は \ref{mfd:tangent-bundle-manifold}。第二可算な空間はリンデレーフ（\ref{top:second-countable-properties}）。ポアンカレの補題は \ref{mfd:poincare-lemma-manifold}。
- 多様体が連結でないときは、リーマン距離 $d$ は各連結成分の上で考える（異なる成分の点の距離は $\infty$ とする）。$B(p,r)\defeq\{q:d(p,q)<r\}$。$T_{q}M$ の開球を $B_{q}(0,\delta)$ と書く。
- 以下 $(M,g)$ は $n$ 次元のリーマン多様体（$n\ge1$）。
:::

## 一様な正規近傍 {#riem:sec-cx-uniform}

::: lemma 一様な正規近傍 {#riem:uniformly-normal keywords="for each p there are an open neighbourhood W and delta > 0 such that for every q in W, exp_q is a diffeomorphism from B_q(0, delta) onto an open set containing W" index="一様な正規近傍|いちようなせいききんぼう, 全正規近傍|ぜんせいききんぼう"}
各 $p\in M$ に、開近傍 $W$ と $\delta>0$ があって、すべての $q\in W$ について
1. $\exp_{q}$ は $B_{q}(0,\delta)$ 上で定義され、$B_{q}(0,\delta)$ から $M$ の開集合への微分同相写像である。
2. $W\subset\exp_{q}(B_{q}(0,\delta))$。
:::

::: proof
**Step 1（写像 $E$）.** $E\colon\mathcal{E}\to M\times M$, $E(v)\defeq(\pi(v),\exp(v))$ とする（$\mathcal{E}$ は指数写像の定義域で、開集合、\ref{riem:exponential-properties.1}）。$E$ は滑らか。【主張：$dE_{0_{p}}$ は同型】$p$ のまわりの座標 $x$ と、$TM$ の自然な座標 $(x,\xi)$ で見ると、$\exp(x,0)=x$（零ベクトルの測地線は定値）なので $\exp$ の $x$ についての偏微分は $(p,0)$ で単位行列、$\xi$ についての偏微分は $d(\exp_{p})_{0}=\mathrm{id}$（\ref{riem:exponential-properties.3}）を座標で書いたもので単位行列。よって $dE_{0_{p}}=\begin{pmatrix}I&0\\I&I\end{pmatrix}$ は可逆。

**Step 2（局所的な逆写像）.** 逆関数定理から、$0_{p}$ の開近傍 $\mathcal{V}\subset\mathcal{E}$ で、$E\restriction\mathcal{V}$ が開集合への微分同相写像になるものがある。【主張：開近傍 $U_{0}\ni p$ と $\delta>0$ で、$\mathcal{V}'\defeq\{v:\pi(v)\in U_{0},\ |v|<\delta\}\subset\mathcal{V}$ となるものがある】$\mathcal{V}$ は座標で見ると $(p,0)$ の近傍なので、$\{|x-p|<a,\ |\xi|<b\}$（ユークリッドノルム）を含む。$|x-p|\le a$ の上で $g_{ij}$ の最小固有値の平方根の最小値を $\lambda>0$ とすると（\ref{riem:distance-metric} の Step 2 と同じ）$|v|\ge\lambda|\xi|$ なので、$U_{0}\defeq\{|x-p|<a\}$, $\delta\defeq\lambda b$ とすればよい。$\mathcal{V}'$ は開集合。

**Step 3（1）.** $q\in U_{0}$ について、$\exp_{q}\restriction B_{q}(0,\delta)$ は $E\restriction\mathcal{V}'$ をファイバー $T_{q}M$ に制限して第 2 成分をとったもので、$E$ が単射なので単射。$v\in B_{q}(0,\delta)$ で $dE_{v}$ は同型で、ファイバー方向の接ベクトル $w$ について $dE_{v}(w)=(0,d(\exp_{q})_{v}w)$ なので、$d(\exp_{q})_{v}$ は単射、次元が等しいので同型。逆関数定理から $\exp_{q}\restriction B_{q}(0,\delta)$ は局所微分同相写像で、単射なので開集合への微分同相写像。

**Step 4（2）.** $E(\mathcal{V}')$ は $(p,p)$ を含む開集合なので、開近傍 $W\subset U_{0}$ で $W\times W\subset E(\mathcal{V}')$ となるものがある。$q,q'\in W$ なら $(q,q')=E(v)$ となる $v\in\mathcal{V}'$ があり、$\pi(v)=q$ なので $v\in B_{q}(0,\delta)$, $\exp_{q}(v)=q'$。
:::

以下、\ref{riem:uniformly-normal} の性質をもつ組 $(W,\delta)$ を**一様な正規近傍**という。$q,q'\in W$ について $v\defeq(\exp_{q}\restriction B_{q}(0,\delta))^{-1}(q')$ とおくと、\ref{riem:geodesics-minimize.3} から $|v|=d(q,q')$ で、測地線 $t\mapsto\exp_{q}(tv)$（$0\le t\le1$）は $q$ から $q'$ への長さ $d(q,q')$ の曲線である。これを $q$ から $q'$ への**動径測地線**と呼ぶ。

::: lemma 動径測地線は一つ {#riem:radial-geodesic-unique keywords="if (W_1, delta_1) and (W_2, delta_2) are uniformly normal and q, q' lie in W_1 cap W_2, the radial geodesics from q to q' defined by the two neighbourhoods coincide" index="動径測地線|どうけいそくちせん"}
$(W_{1},\delta_{1})$, $(W_{2},\delta_{2})$ を一様な正規近傍とし、$q,q'\in W_{1}\cap W_{2}$ とする。それぞれから定まる $q$ から $q'$ への動径測地線は一致する。
:::

::: proof
それぞれの初速度を $v_{1},v_{2}\in T_{q}M$ とすると、$|v_{1}|=|v_{2}|=d(q,q')$ で、$\exp_{q}(v_{1})=\exp_{q}(v_{2})=q'$。$\delta\defeq\max(\delta_{1},\delta_{2})$ とすると、$\exp_{q}$ は $B_{q}(0,\delta)$ 上で単射（$\delta=\delta_{i}$ となる方の正規近傍の性質 1）で、$v_{1},v_{2}$ はともにそこに属する（$|v_{i}|<\delta_{i}\le\delta$）。よって $v_{1}=v_{2}$。
:::

## 凸な球 {#riem:sec-cx-convex}

::: definition 測地的に凸な開集合 {#riem:convex-set keywords="an open set U is geodesically convex if U is contained in a uniformly normal neighbourhood (W, delta) and for all q, q' in U the radial geodesic from q to q' lies in U" index="測地的に凸|そくちてきにとつ, 凸な開集合（リーマン多様体）|とつなかいしゅうごうりーまんたようたい"}
開集合 $U\subset M$ が**測地的に凸**であるとは、ある一様な正規近傍 $(W,\delta)$ について $U\subset W$ で、任意の $q,q'\in U$ について $q$ から $q'$ への動径測地線が $U$ に含まれることをいう。\ref{riem:radial-geodesic-unique} から、この条件は $U$ を含む一様な正規近傍の選び方によらない。
:::

::: theorem 凸な球の存在（ホワイトヘッド） {#riem:convex-balls keywords="Whitehead: every point has a number beta > 0 such that metric balls B(p, r) with r < beta are geodesically convex; proof by the second derivative of |x|^2 along geodesics in normal coordinates" index="ホワイトヘッドの凸近傍定理|ほわいとへっどのとつきんぼうていり, 凸近傍|とつきんぼう"}
各 $p\in M$ に $\beta>0$ があって、$0<r<\beta$ なら距離球 $B(p,r)$ は測地的に凸である。
:::

::: intuition
中心 $p$ からの距離の 2 乗 $|x|^{2}$ は、ユークリッド空間では直線に沿って下に凸（2 階微分が正）なので、直線は球から出たら戻ってこない。リーマン多様体の正規座標では、測地線は直線から $\Gamma$（クリストッフェル記号）の分だけ曲がるが、中心の近くでは $|x|$ が小さいので曲がりの効果 $|x|\cdot|\Gamma|$ は $1$ より小さく、2 階微分は正のまま。だから小さな球の中の 2 点を結ぶ測地線は、球からはみ出せない。
:::

::: proof
**Step 1（定数）.** $p$ の一様な正規近傍 $(W,\delta)$ をとる（\ref{riem:uniformly-normal}）。$\varepsilon_{0}>0$ を、$\exp_{p}$ が $B_{p}(0,\varepsilon_{0})$ 上の微分同相写像になるようにとり、$T_{p}M$ の正規直交基底で $T_{p}M=\mathbb{R}^{n}$ と同一視した**正規座標** $x\defeq(\exp_{p}\restriction B_{p}(0,\varepsilon_{0}))^{-1}$ を使う。\ref{riem:geodesics-minimize.3} から、$|x|<\varepsilon_{0}$ の点 $q$ について $d(p,q)=|x(q)|$（ユークリッドノルム）。この座標のクリストッフェル記号について
$$
A\defeq\max_{|x|\le\varepsilon_{0}/2}\ \max_{|\xi|=1}\Bigl|\Bigl(\sum_{i,j}\Gamma^{k}_{ij}(x)\xi_{i}\xi_{j}\Bigr)_{k}\Bigr|
$$
とする（連続関数のコンパクト集合上の最大値）。$\beta>0$ を、$3\beta<\varepsilon_{0}/2$、$3A\beta\le1$、$2\beta<\delta$、$B(p,\beta)\subset W$ を満たすようにとる（最後は、距離球が $p$ の基本近傍系をなすこと \ref{riem:distance-metric} から可能）。

**Step 2（動径測地線は小さな球の中に留まる範囲を動く）.** $0<r<\beta$、$q,q'\in B(p,r)$, $q\neq q'$ とする（$q=q'$ なら動径測地線は定値で明らか）。$q,q'\in W$ なので動径測地線 $\gamma(t)=\exp_{q}(tv)$ が定まり、$|v|=d(q,q')\le d(q,p)+d(p,q')<2r$。$t\in[0,1]$ で $d(q,\gamma(t))\le t|v|$（$\gamma\restriction[0,t]$ の長さ）なので、$d(p,\gamma(t))<r+2r=3r<\varepsilon_{0}/2$。よって $\gamma$ は正規座標の定義域の中にあり、$x(t)\defeq x(\gamma(t))$ と書ける。

**Step 3（2 階微分）.** $F(t)\defeq|x(t)|^{2}=d(p,\gamma(t))^{2}$ とおく。測地線の方程式（\ref{riem:geodesic}）$x_{k}''=-\sum_{i,j}\Gamma^{k}_{ij}(x)x_{i}'x_{j}'$ から
$$
F''=2|x'|^{2}+2\langle x,x''\rangle\ge2|x'|^{2}-2|x|\,A|x'|^{2}=2|x'|^{2}\bigl(1-A|x|\bigr).
$$
（$\langle\ ,\ \rangle$, $|\cdot|$ は $\mathbb{R}^{n}$ のもの、$|x''|\le A|x'|^{2}$ は $A$ の定義から。）$|x(t)|<3r<3\beta$ で $A\cdot3\beta\le1$ なので $1-A|x|>0$。$\gamma$ は速さが一定で $0$ でない（$v\neq0$）ので $x'(t)\neq0$。よって $F''>0$ on $[0,1]$。

**Step 4（最大値の原理）.** $F(0)=d(p,q)^{2}<r^{2}$, $F(1)<r^{2}$。$F$ が $[0,1]$ のどこかで $r^{2}$ 以上になるとすると、最大値は内部の点 $t_{*}$ でとられ、$F''(t_{*})\le0$（極大点での 2 階微分の必要条件）。Step 3 に矛盾。よって $\gamma([0,1])\subset B(p,r)$。$B(p,r)\subset B(p,\beta)\subset W$ と合わせて、$B(p,r)$ は測地的に凸。

::: hypcheck
- **$r$ が小さいこと**：Step 1 の三つの条件を使った。$3A\beta\le1$ は Step 3 の符号に、$3\beta<\varepsilon_{0}/2$ は動径測地線が正規座標の中にあることに、$2\beta<\delta$ と $B(p,\beta)\subset W$ は動径測地線が定義されることに使った。大きな球は凸とは限らない（球面の半球より大きな球など）。
:::
:::

::: proposition 凸集合の性質 {#riem:convex-properties keywords="finite intersections of geodesically convex open sets are geodesically convex; a nonempty geodesically convex open set is diffeomorphic to a star-shaped open subset of R^n via exp_q^{-1}" index="凸集合の共通部分（リーマン）|とつしゅうごうのきょうつうぶぶんりーまん"}
1. 測地的に凸な開集合 $U_{1},U_{2}$ について、$U_{1}\cap U_{2}$ は測地的に凸である。
2. 空でない測地的に凸な開集合 $U$ と $q\in U$ について、$U$ を含む一様な正規近傍 $(W,\delta)$ をとると、$\tilde U\defeq(\exp_{q}\restriction B_{q}(0,\delta))^{-1}(U)$ は $T_{q}M$ の $0$ について星形の開集合で、$\exp_{q}\colon\tilde U\to U$ は微分同相写像。とくに $U$ は $\mathbb{R}^{n}$ の星形の開集合と微分同相である。
:::

::: proof
**1.** $U_{i}\subset W_{i}$ とする。$U_{1}\cap U_{2}\subset W_{1}$。$q,q'\in U_{1}\cap U_{2}$ について、$(W_{1},\delta_{1})$ から定まる動径測地線と $(W_{2},\delta_{2})$ から定まる動径測地線は一致し（\ref{riem:radial-geodesic-unique}）、前者は $U_{1}$ に、後者は $U_{2}$ に含まれるので、$U_{1}\cap U_{2}$ に含まれる。

**2.** $U\subset W\subset\exp_{q}(B_{q}(0,\delta))$ で $\exp_{q}\restriction B_{q}(0,\delta)$ は開集合への微分同相写像なので、$\tilde U$ は開集合で、$\exp_{q}\colon\tilde U\to U$ は微分同相写像。$v\in\tilde U$ と $t\in[0,1]$ について、$q'\defeq\exp_{q}(v)\in U$ への動径測地線は $s\mapsto\exp_{q}(sv)$ で、凸性から $\exp_{q}(tv)\in U$。$tv\in B_{q}(0,\delta)$ なので $tv\in\tilde U$。よって星形。$T_{q}M$ を基底で $\mathbb{R}^{n}$ と同一視すればよい。
:::

## 良い被覆 {#riem:sec-cx-good-cover}

::: theorem 良い被覆の存在 {#riem:good-cover-exists keywords="every open cover of a smooth manifold has a countable refinement by geodesically convex open sets (for an auxiliary Riemannian metric); all nonempty finite intersections are diffeomorphic to star-shaped open subsets of R^n, hence contractible with trivial de Rham cohomology in positive degrees" index="良い被覆の存在|よいひふくのそんざい"}
$M$ を $n$ 次元の可微分多様体（$n\ge1$）、$\mathcal{O}$ を $M$ の開被覆とする。$\mathcal{O}$ の細分（各元がどれかの $O\in\mathcal{O}$ に含まれる開被覆）$\mathcal{U}=\{U_{i}\}_{i\in\mathbb{N}}$ で、有限個の共通部分 $U_{i_{0}}\cap\cdots\cap U_{i_{p}}$ が空でなければ $\mathbb{R}^{n}$ の星形の開集合と微分同相であるものがある。とくに $\mathcal{U}$ は良い被覆（\ref{at:good-cover}）で、空でない有限個の共通部分 $U_{\sigma}$ について $H^{k}(U_{\sigma})=0$（$k\ge1$）、$H^{0}(U_{\sigma})\cong\mathbb{R}$（ド・ラーム・コホモロジー）。
:::

::: proof
**Step 1（凸な球による被覆）.** リーマン計量を一つ固定する（\ref{mfd:fiber-metric-existence}）。各 $p\in M$ について、$p\in O_{p}\in\mathcal{O}$ をとり、\ref{riem:convex-balls} の $\beta(p)$ と、$B(p,r_{p})\subset O_{p}$ となる $0<r_{p}<\beta(p)$ をとる（距離球は基本近傍系）。$\{B(p,r_{p})\}_{p\in M}$ は $M$ の開被覆で、各元は測地的に凸で、どれかの $O$ に含まれる。

**Step 2（可算化）.** $M$ は第二可算なのでリンデレーフで（\ref{top:second-countable-properties}）、可算個の $B(p_{i},r_{p_{i}})$ で $M$ が覆える。これを $\mathcal{U}$ とする（有限個で覆えるなら、同じものを繰り返して $\mathbb{N}$ で添字付ける）。

**Step 3（共通部分）.** \ref{riem:convex-properties.1} を繰り返し使うと、空でない有限個の共通部分は測地的に凸で、\ref{riem:convex-properties.2} から星形の開集合と微分同相。星形の開集合は可縮（中心への線分によるホモトピー）で、ド・ラーム・コホモロジーは \ref{mfd:poincare-lemma-manifold.1} から $k\ge1$ で $0$、連結なので $H^{0}\cong\mathbb{R}$（\ref{mfd:de-rham-properties.3}）。

::: hypcheck
- **補助的なリーマン計量**：凸性の定義に使った。結論（星形の開集合と微分同相な共通部分をもつ被覆の存在）は計量によらない。
- **第二可算性**：Step 2 で被覆を可算にするために使った。チェック複体の議論（\ref{at:cech-good-cover}）では、被覆の添字集合に整列順序が要り、可算なら選択公理なしに $\mathbb{N}$ の順序がとれる。
- **ホワイトヘッドの定理**：Step 3 で、異なる点を中心とする球の共通部分が良い形になることの鍵（\ref{riem:radial-geodesic-unique} で、動径測地線が被覆の元によらずに決まる）。
:::
:::

::: supplement
**高い視点：計量は補助線.** 良い被覆の存在は、位相的・微分的な主張なのに、証明ではリーマン計量を補助線として使った。これは、ユークリッド幾何の作図問題で補助線を引くのと同じで、計量がもたらす「凸性」という概念が、座標近傍の寄せ集めでは得られない、座標によらない形の制御を与えるからである。別の方法として、滑らかな多様体の三角形分割（ケアンズ–ホワイトヘッド、\ref{mfd:triangulation-higher-facts}）の重心細分の開星状体を使うこともできる（\ref{at:good-cover} の例 2）。比喩で言えば、どこでも「まっすぐ」の意味が決まる世界（計量）では、小さな部屋はみな凸にでき、凸な部屋どうしの共通部分もまた凸な部屋になる。

**補足.** 位相多様体についても、任意の開被覆は「コホモロジー的に良い」被覆で細分できることが知られている（\ref{at:cw-local-properties.2}）。滑らかな多様体についてはこのページで証明した。
:::

## 問題 {#riem:sec-cx-problems}

::: problem {#riem:prob-cx-euclidean}
$\mathbb{R}^{n}$ のユークリッド計量では、一様な正規近傍として $(\mathbb{R}^{n},\infty)$（$\delta$ を任意に大きく）がとれ、測地的に凸な開集合は通常の意味の凸な開集合であることを示せ。
:::

::: solution
$\exp_{q}(v)=q+v$ は $T_{q}\mathbb{R}^{n}=\mathbb{R}^{n}$ 全体で微分同相写像で、像は $\mathbb{R}^{n}$。動径測地線は線分 $t\mapsto q+t(q'-q)$。よって凸性の定義は「任意の 2 点を結ぶ線分が $U$ に含まれる」こと。
:::

::: problem {#riem:prob-cx-sphere-hemisphere}
単位球面 $S^{2}$ の開半球 $\{x_{3}>0\}$ は測地的に凸か。また、閉半球より大きな球 $B(N,r)$（$r>\pi/2$, $N$ は北極）はどうか。
:::

::: solution
開半球 $H$ は凸：$q\in H$ について $\exp_{q}$ は $B_{q}(0,\pi)$ 上の微分同相写像で、像は $S^{2}\setminus\{-q\}\supset H$（\ref{riem:prob-gd-injectivity-radius}）なので、$(H,\pi)$ は一様な正規近傍。$q\neq q'\in H$ の間の角を $\theta\in(0,\pi)$ とすると、動径測地線は大円の短い弧 $c(t)=\frac{\sin((1-t)\theta)\,q+\sin(t\theta)\,q'}{\sin\theta}$（$0\le t\le1$、\ref{riem:prob-gd-sphere}）で、係数は非負かつ両方同時には $0$ にならないので、第 3 成分は正。よって $c\subset H$。

$r>\pi/2$ の $B(N,r)$ は凸でない：$0<\varphi<r-\pi/2$ として $q=(\cos\varphi,0,-\sin\varphi)$, $q'=(-\cos\varphi,0,-\sin\varphi)$ をとると、$d(N,q)=d(N,q')=\pi/2+\varphi<r$。$q,q'$ の間の角は $\pi-2\varphi$ で、短い弧は $xz$ 平面の大円の南極 $S$ を通る弧（北極を通る弧の長さは $\pi+2\varphi$）。$d(N,S)=\pi>r$ なので、動径測地線は $B(N,r)$ から出る。
:::
