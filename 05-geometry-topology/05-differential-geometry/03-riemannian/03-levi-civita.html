# レビ–チビタ接続 {#riem:page-levi-civita keywords="tensoriality lemma, torsion of an affine connection, torsion-free iff symmetric Christoffel symbols, fundamental theorem of Riemannian geometry, Levi-Civita connection, Koszul formula, Christoffel symbols from the metric, naturality under isometries, Levi-Civita connection of a submanifold of Euclidean space as tangential projection, second fundamental form"}

接続は一つのベクトル束にいくらでもある（\ref{riem:connection-existence}）。しかしリーマン多様体の接束には、計量だけから決まる特別な接続がただ一つある。条件は二つで、計量と両立すること（平行移動が長さと角を保つ）と、**ねじれ**が $0$ であること（座標近傍で見てクリストッフェル記号が下の添字について対称）である。これが**レビ–チビタ接続**で、存在と一意性は**コシュールの公式**から従う（\ref{riem:levi-civita}）。このページでは、その証明と、クリストッフェル記号の公式、等長写像による自然性を示し、$\mathbb{R}^{N}$ の部分多様体では、レビ–チビタ接続が「普通の微分の接成分」であること（\ref{riem:submanifold-levi-civita}）を示す。曲面論の共変微分（\ref{surf:covariant-derivative}）は、その特別な場合である。

## 記法と定義の確認 {#riem:sec-lc-notation}

::: notation
- リーマン計量と勾配・音楽同型は \ref{riem:riemannian-metric}, \ref{riem:musical-gradient}。接続・接続形式・クリストッフェル記号・計量接続・曲線に沿った共変微分は \ref{riem:connection}, \ref{riem:connection-form}, \ref{riem:metric-connection}, \ref{riem:covariant-along-curve}。$\langle\ ,\ \rangle$ は計量。
- リー括弧とその性質は \ref{mfd:lie-bracket}, \ref{mfd:lie-bracket-properties}。座標では $[\partial_{i},\partial_{j}]=0$。
- 微分同相写像 $F\colon M\to N$ によるベクトル場の押し出しを $F_{*}X\defeq dF\circ X\circ F^{-1}$ と書く。$F_{*}[X,Y]=[F_{*}X,F_{*}Y]$（\ref{mfd:lie-bracket-properties}）。
:::

## テンソル性の補題 {#riem:sec-lc-tensor}

::: lemma テンソル性の補題 {#riem:tensoriality-lemma keywords="a C^infinity(M)-multilinear map of vector fields (and sections) into functions or sections is pointwise: its value at m depends only on the values at m" index="テンソル性の補題|てんそるせいのほだい, テンソル場（多重線形写像）|てんそるばたじゅうせんけいしゃぞう"}
$E_{1},\dots,E_{r},E$ をベクトル束とし、$\tau\colon\Gamma(E_{1})\times\cdots\times\Gamma(E_{r})\to\Gamma(E)$ が各変数について $C^{\infty}(M)$ 線形であるとする。このとき $\tau(s_{1},\dots,s_{r})(m)$ は $s_{1}(m),\dots,s_{r}(m)$ だけで決まる。したがって $\tau$ は、各点の多重線形写像 $\tau_{m}\colon(E_{1})_{m}\times\cdots\times(E_{r})_{m}\to E_{m}$ の族とみなせる。（$E$ が自明な直線束、つまり値が関数のときも同じ。）
:::

::: proof
各変数について、$s_{j}(m)=0$ なら値が $m$ で $0$ になることを示せばよい（多重線形性から、差に適用して値の一致が従う）。$s\defeq s_{j}$ とし、$m$ のまわりの局所フレーム $(e_{a})$ の定義域 $U$ と、$U$ の中の $m$ の隆起関数 $\beta$ をとる（\ref{riem:connection-local} の記法）。$U$ の上で $s=\sum_{a}s^{a}e_{a}$ とすると、$\beta^{2}s=\sum_{a}(\beta s^{a})(\beta e_{a})$ で、$\beta s^{a}\in C^{\infty}(M)$, $\beta e_{a}\in\Gamma(E_{j})$（$U$ の外で $0$）。$C^{\infty}$ 線形性から
$$
\beta(m)^{2}\,\tau(\dots,s,\dots)(m)=\tau(\dots,\beta^{2}s,\dots)(m)=\sum_{a}\beta(m)s^{a}(m)\,\tau(\dots,\beta e_{a},\dots)(m)=0
$$
（$s^{a}(m)=0$）。$\beta(m)=1$ なので $\tau(\dots,s,\dots)(m)=0$。
:::

この補題によって、$C^{\infty}(M)$ 多重線形な写像を「テンソル場」と同一視する。たとえば、二つの接続の差（\ref{riem:connection-existence.3}）はテンソル場である。

## ねじれと基本定理 {#riem:sec-lc-fundamental}

::: definition ねじれ {#riem:torsion keywords="torsion tensor T(X,Y) = nabla_X Y - nabla_Y X - [X,Y] of an affine connection; torsion-free (symmetric) connection; T(d_i, d_j) = sum_k (Gamma^k_ij - Gamma^k_ji) d_k" index="ねじれ（接続）|ねじれせつぞく, ねじれのない接続|ねじれのないせつぞく, 対称な接続|たいしょうなせつぞく"}
アフィン接続 $\nabla$ について
$$
T(X,Y)\defeq\nabla_{X}Y-\nabla_{Y}X-[X,Y]
$$
を $\nabla$ の**ねじれ**という。$T=0$ のとき、$\nabla$ は**ねじれがない**（対称ともいう）という。
:::

$T$ は交代的で、$X$ について $C^{\infty}(M)$ 線形である：$T(fX,Y)=f\nabla_{X}Y-(Yf)X-f\nabla_{Y}X-\bigl(f[X,Y]-(Yf)X\bigr)=fT(X,Y)$（$[fX,Y]=f[X,Y]-(Yf)X$ は \ref{mfd:lie-bracket-properties}）。交代性から $Y$ についても $C^{\infty}$ 線形で、\ref{riem:tensoriality-lemma} からテンソル場である。座標では $[\partial_{i},\partial_{j}]=0$ なので $T(\partial_{i},\partial_{j})=\sum_{k}(\Gamma^{k}_{ij}-\Gamma^{k}_{ji})\partial_{k}$。よって、ねじれがないことは、各座標近傍で $\Gamma^{k}_{ij}=\Gamma^{k}_{ji}$ となることと同値である。

::: theorem リーマン幾何の基本定理 {#riem:levi-civita keywords="fundamental theorem of Riemannian geometry: a Riemannian manifold has a unique torsion-free metric connection (Levi-Civita connection), given by the Koszul formula; Christoffel symbols Gamma^k_ij = (1/2) g^{kl}(d_i g_jl + d_j g_il - d_l g_ij)" index="レビ–チビタ接続|れびちびたせつぞく, リーマン接続|りーまんせつぞく, リーマン幾何の基本定理|りーまんきかのきほんていり, コシュールの公式|こしゅーるのこうしき"}
リーマン多様体 $(M,g)$ には、ねじれがなく計量と両立するアフィン接続 $\nabla$ がただ一つある。これを**レビ–チビタ接続**という。$\nabla$ は**コシュールの公式**
$$
2\langle\nabla_{X}Y,Z\rangle=X\langle Y,Z\rangle+Y\langle Z,X\rangle-Z\langle X,Y\rangle+\langle[X,Y],Z\rangle-\langle[Y,Z],X\rangle+\langle[Z,X],Y\rangle
$$
で特徴づけられ、そのクリストッフェル記号は
$$
\Gamma^{k}_{ij}=\frac12\sum_{l}g^{kl}\bigl(\partial_{i}g_{jl}+\partial_{j}g_{il}-\partial_{l}g_{ij}\bigr).
$$
:::

::: intuition
計量との両立は「平行移動で長さと角が変わらない」こと、ねじれがないことは「無限小の平行四辺形が閉じる」ことである。この二つで、計量の 1 階微分から接続が完全に決まる。コシュールの公式は、両立の式を三つの変数で巡回させて足し引きし、ねじれのなさで接続の項を一つにまとめたものである。
:::

::: proof
コシュールの公式の右辺を $K(X,Y,Z)$ と書く。

**Step 1（一意性：両立とねじれなしからコシュールの公式が従う）.** 両立の式を三通りに書く：
$$
X\langle Y,Z\rangle=\langle\nabla_{X}Y,Z\rangle+\langle Y,\nabla_{X}Z\rangle,\quad Y\langle Z,X\rangle=\langle\nabla_{Y}Z,X\rangle+\langle Z,\nabla_{Y}X\rangle,\quad Z\langle X,Y\rangle=\langle\nabla_{Z}X,Y\rangle+\langle X,\nabla_{Z}Y\rangle.
$$
第 1 式と第 2 式を足して第 3 式を引くと
$$
X\langle Y,Z\rangle+Y\langle Z,X\rangle-Z\langle X,Y\rangle=\langle\nabla_{X}Y+\nabla_{Y}X,Z\rangle+\langle\nabla_{X}Z-\nabla_{Z}X,Y\rangle+\langle\nabla_{Y}Z-\nabla_{Z}Y,X\rangle.
$$
ねじれがないので $\nabla_{Y}X=\nabla_{X}Y-[X,Y]$, $\nabla_{X}Z-\nabla_{Z}X=[X,Z]$, $\nabla_{Y}Z-\nabla_{Z}Y=[Y,Z]$。代入して整理すると $2\langle\nabla_{X}Y,Z\rangle=K(X,Y,Z)$（$-\langle[X,Z],Y\rangle=\langle[Z,X],Y\rangle$）。左辺の $\nabla_{X}Y$ は、すべての $Z$ との内積で決まる（内積の非退化性。$Z$ を座標ベクトル場の隆起関数倍にとれば、各点の成分が決まる）ので、そのような接続は高々一つ。

**Step 2（$K$ は $Z$ について $C^{\infty}$ 線形）.** $Z$ を $fZ$ に替えたときの $K$ の変化のうち、$f$ の微分を含む項は、$X\langle Y,fZ\rangle$ から $(Xf)\langle Y,Z\rangle$、$Y\langle fZ,X\rangle$ から $(Yf)\langle Z,X\rangle$、$-\langle[Y,fZ],X\rangle=-\langle f[Y,Z]+(Yf)Z,X\rangle$ から $-(Yf)\langle Z,X\rangle$、$\langle[fZ,X],Y\rangle=\langle f[Z,X]-(Xf)Z,Y\rangle$ から $-(Xf)\langle Z,Y\rangle$ で、合計は $0$。よって $K(X,Y,fZ)=fK(X,Y,Z)$。和についての線形性は明らか。

**Step 3（存在：定義）.** Step 2 と \ref{riem:tensoriality-lemma} から、$Z\mapsto\frac12K(X,Y,Z)$ は 1 形式で、$\nabla_{X}Y\defeq\bigl(\tfrac12K(X,Y,\cdot)\bigr)^{\sharp}$ と定める（\ref{riem:musical-gradient}）。つまり $\langle\nabla_{X}Y,Z\rangle=\frac12K(X,Y,Z)$。

**Step 4（接続の公理）.** $X$ についての $C^{\infty}$ 線形性：$X$ を $fX$ に替えたときの微分を含む項は、$Y\langle Z,fX\rangle$ から $(Yf)\langle Z,X\rangle$、$-Z\langle fX,Y\rangle$ から $-(Zf)\langle X,Y\rangle$、$\langle[fX,Y],Z\rangle=\langle f[X,Y]-(Yf)X,Z\rangle$ から $-(Yf)\langle X,Z\rangle$、$\langle[Z,fX],Y\rangle=\langle f[Z,X]+(Zf)X,Y\rangle$ から $(Zf)\langle X,Y\rangle$ で、合計 $0$。ライプニッツ則：$Y$ を $fY$ に替えたときの微分を含む項は、$X\langle fY,Z\rangle$ から $(Xf)\langle Y,Z\rangle$、$-Z\langle X,fY\rangle$ から $-(Zf)\langle X,Y\rangle$、$\langle[X,fY],Z\rangle=\langle f[X,Y]+(Xf)Y,Z\rangle$ から $(Xf)\langle Y,Z\rangle$、$-\langle[fY,Z],X\rangle=-\langle f[Y,Z]-(Zf)Y,X\rangle$ から $(Zf)\langle Y,X\rangle$ で、合計 $2(Xf)\langle Y,Z\rangle$。よって $\langle\nabla_{X}(fY),Z\rangle=\langle(Xf)Y+f\nabla_{X}Y,Z\rangle$。$\mathbb{R}$ 線形性は明らか。

**Step 5（ねじれなし）.** $K(X,Y,Z)-K(Y,X,Z)$ を計算すると、$X\langle Y,Z\rangle$ と $-X\langle Z,Y\rangle$、$Y\langle Z,X\rangle$ と $-Y\langle X,Z\rangle$、$-Z\langle X,Y\rangle$ と $Z\langle Y,X\rangle$ は打ち消し合い、括弧の項は
$$
\langle[X,Y],Z\rangle-\langle[Y,X],Z\rangle-\langle[Y,Z],X\rangle+\langle[X,Z],Y\rangle+\langle[Z,X],Y\rangle-\langle[Z,Y],X\rangle=2\langle[X,Y],Z\rangle
$$
（交代性 $[A,B]=-[B,A]$）。よって $\langle\nabla_{X}Y-\nabla_{Y}X,Z\rangle=\langle[X,Y],Z\rangle$ がすべての $Z$ で成り立ち、$T=0$。

**Step 6（計量との両立）.** $K(X,Y,Z)+K(X,Z,Y)$ を計算すると、$Y\langle Z,X\rangle$ と $-Y\langle X,Z\rangle$、$-Z\langle X,Y\rangle$ と $Z\langle Y,X\rangle$ が打ち消し合い、括弧の項も $\langle[X,Y],Z\rangle+\langle[X,Z],Y\rangle$ と $\langle[Z,X],Y\rangle+\langle[Y,X],Z\rangle$、$-\langle[Y,Z],X\rangle-\langle[Z,Y],X\rangle$ がそれぞれ打ち消し合って、$2X\langle Y,Z\rangle$ が残る。よって $\langle\nabla_{X}Y,Z\rangle+\langle Y,\nabla_{X}Z\rangle=X\langle Y,Z\rangle$。

**Step 7（クリストッフェル記号）.** $X=\partial_{i}$, $Y=\partial_{j}$, $Z=\partial_{l}$ とすると括弧はすべて $0$ で、$2\sum_{k}\Gamma^{k}_{ij}g_{kl}=\partial_{i}g_{jl}+\partial_{j}g_{il}-\partial_{l}g_{ij}$。両辺に $g^{lm}$ を掛けて $l$ について和をとれば式が得られる。

::: hypcheck
- **計量の正定値性**：Step 3 で $\sharp$（非退化性）を使った。非退化な不定値の計量（ローレンツ計量など）でも、正定値性は使っていないので同じ証明が通る。
- **ねじれなしと両立の両方**：Step 1 でどちらも使った。両立だけなら、計量接続は $\mathrm{End}(TM)$ 値の交代的な 1 形式の分だけ自由度がある（\ref{riem:connection-existence.3}）。
:::
:::

曲面片 $f$ について、\ref{riem:levi-civita} のクリストッフェル記号の式は、曲面論の \ref{surf:christoffel-metric} と同じ式である。

::: proposition レビ–チビタ接続の自然性 {#riem:levi-civita-natural keywords="isometries preserve Levi-Civita connections: F_*(nabla_X Y) = nabla'_{F_*X} F_*Y; isometries map geodesics to geodesics and commute with parallel transport" index="レビ–チビタ接続の自然性|れびちびたせつぞくのしぜんせい"}
$F\colon(M,g)\to(N,h)$ を等長写像とし、$\nabla$, $\nabla'$ をそれぞれのレビ–チビタ接続とする。$X,Y\in\mathfrak{X}(M)$ について
$$
F_{*}(\nabla_{X}Y)=\nabla'_{F_{*}X}F_{*}Y.
$$
:::

::: proof
$\tilde\nabla_{X}Y\defeq F^{-1}_{*}\bigl(\nabla'_{F_{*}X}F_{*}Y\bigr)$ とおく。【主張：$\tilde\nabla$ は $(M,g)$ のねじれがない計量接続】$F_{*}(fX)=(f\circ F^{-1})F_{*}X$ と $(F_{*}X)(f\circ F^{-1})=(Xf)\circ F^{-1}$ から接続の公理は $\nabla'$ の公理に移る。ねじれ：$F_{*}$ はリー括弧を保つので $\tilde\nabla_{X}Y-\tilde\nabla_{Y}X-[X,Y]=F^{-1}_{*}(T'(F_{*}X,F_{*}Y))=0$。両立：$F^{*}h=g$ から $\langle A,B\rangle_{g}=\langle F_{*}A,F_{*}B\rangle_{h}\circ F$ で、$X\langle Y,Z\rangle_{g}=\bigl((F_{*}X)\langle F_{*}Y,F_{*}Z\rangle_{h}\bigr)\circ F$ に $\nabla'$ の両立を使えばよい。基本定理の一意性から $\tilde\nabla=\nabla$。
:::

## 部分多様体のレビ–チビタ接続 {#riem:sec-lc-submanifold}

$M\subset\mathbb{R}^{N}$ を部分多様体、$g$ を誘導計量とする（\ref{riem:isometry}）。$T_{m}M$ を $\mathbb{R}^{N}$ の部分空間とみなし（\ref{mfd:submanifold-structure.2}）、$v\in\mathbb{R}^{N}$ の $T_{m}M$ への直交射影を $v^{\top}$、直交補空間への射影を $v^{\perp}$ と書く。$M$ 上のベクトル場 $Y$ を滑らかな写像 $Y\colon M\to\mathbb{R}^{N}$ とみなし、$X\in\mathfrak{X}(M)$ について $D_{X}Y\defeq dY(X)$（成分ごとに $X$ で微分したもの）とおく。

::: proposition 部分多様体のレビ–チビタ接続 {#riem:submanifold-levi-civita keywords="for a submanifold of Euclidean space with induced metric, the Levi-Civita connection is the tangential part of the ambient derivative; the normal part II(X,Y) is symmetric and C^infinity-bilinear (second fundamental form)" index="第二基本形式（部分多様体）|だいにきほんけいしきぶぶんたようたい, ガウスの公式（部分多様体）|がうすのこうしきぶぶんたようたい"}
1. $D_{X}Y-D_{Y}X=[X,Y]$（右辺は $\mathbb{R}^{N}$ のベクトルとみる）。
2. $\nabla_{X}Y\defeq(D_{X}Y)^{\top}$ は $(M,g)$ のレビ–チビタ接続である。
3. $\mathrm{II}(X,Y)\defeq(D_{X}Y)^{\perp}$ は $X,Y$ について $C^{\infty}(M)$ 双線形かつ対称である（**第二基本形式**）。したがって $D_{X}Y=\nabla_{X}Y+\mathrm{II}(X,Y)$（**ガウスの公式**）。
:::

::: proof
**1.** 座標近傍 $(U;x)$ の逆写像を $\Psi\defeq\iota\circ\varphi^{-1}$（$\mathbb{R}^{N}$ に値をとる）とすると、$\partial_{j}$ は $\mathbb{R}^{N}$ のベクトル $\partial\Psi/\partial x_{j}$（を $\varphi$ で引き戻したもの）である。$Y=\sum_{j}Y^{j}\partial_{j}$, $X=\sum_{i}X^{i}\partial_{i}$ なら
$$
D_{X}Y=\sum_{j}(XY^{j})\,\partial_{j}+\sum_{i,j}X^{i}Y^{j}\,\frac{\partial^{2}\Psi}{\partial x_{i}\partial x_{j}}.
$$
$X$ と $Y$ を入れ替えて引くと、第 2 項は 2 階偏微分の対称性で打ち消し、第 1 項の差 $\sum_{j}(XY^{j}-YX^{j})\partial_{j}$ は $[X,Y]$ の座標表示（\ref{mfd:lie-bracket}）。

**2.** 接続の公理：$D_{fX}Y=fD_{X}Y$、$D_{X}(fY)=(Xf)Y+fD_{X}Y$ は微分の性質で、射影 $\top$ は各点で線形なので保たれる（$Y$ はすでに接ベクトル）。滑らかさ：射影は、$T_{m}M$ の滑らかな局所フレームにグラム–シュミットを施した正規直交フレーム $\epsilon_{a}$ で $v^{\top}=\sum_{a}\langle v,\epsilon_{a}\rangle\epsilon_{a}$ と書けるので滑らか。ねじれなし：1 の両辺の接成分をとると $\nabla_{X}Y-\nabla_{Y}X=[X,Y]$（$[X,Y]$ は接ベクトル）。両立：$\langle Y,Z\rangle$ は $\mathbb{R}^{N}$ の内積なので、積の微分から $X\langle Y,Z\rangle=\langle D_{X}Y,Z\rangle+\langle Y,D_{X}Z\rangle$。$Z$ は接ベクトルなので $\langle D_{X}Y,Z\rangle=\langle(D_{X}Y)^{\top},Z\rangle$、もう一方も同様。基本定理の一意性から、これがレビ–チビタ接続。

**3.** $D_{X}Y$ の $X$ についての $C^{\infty}$ 線形性はそのまま。$Y$ について：$D_{X}(fY)=(Xf)Y+fD_{X}Y$ の第 1 項は接ベクトルなので法成分には現れない。対称性：1 から $\mathrm{II}(X,Y)-\mathrm{II}(Y,X)=[X,Y]^{\perp}=0$。
:::

曲面 $M\subset\mathbb{R}^{3}$ の場合、曲線に沿って同じことをしたものが曲面論の共変微分 \ref{surf:covariant-derivative}（接平面への直交射影）であり、\ref{riem:covariant-along-curve} の $D_{t}$ はそれと一致する（局所フレームでの式が \ref{surf:covariant-derivative-properties.1} と同じ）。$\mathrm{II}$ を単位法ベクトル $\nu$ と内積をとった $\langle\mathrm{II}(X,Y),\nu\rangle$ は、曲面論の第二基本形式である。

::: supplement
**高い視点：レビ–チビタ接続はなぜ一つか.** 接続の全体は $\mathrm{End}(TM)$ 値 1 形式、つまり $T^{*}M\otimes T^{*}M\otimes TM$ の切断の空間を平行移動の群とするアフィン空間である。計量で $TM\cong T^{*}M$ と同一視すると、差は $T^{*}M^{\otimes3}$ の切断 $A_{ijk}$ になる。計量との両立は「$A_{ijk}$ が後ろ二つの添字について交代」、ねじれがないことは「前二つの添字について対称」という線形条件で、両方を満たすテンソルは $0$ しかない（$A_{ijk}=-A_{ikj}=-A_{kij}=A_{kji}=A_{jki}=-A_{jik}=-A_{ijk}$）。つまり、対称テンソルと交代テンソルの空間 $S^{2}V^{*}\otimes V^{*}$ と $V^{*}\otimes\Lambda^{2}V^{*}$ の線形代数（両者は $V^{*\otimes3}$ の中で $0$ でしか交わらず、次元の和がちょうど $n^{3}$）が、基本定理の一意性と存在の本質である：存在は「任意のテンソルが一意に対称部分と交代部分の和に分かれる」ことに対応する。比喩で言えば、平行移動の「回転のさせ方」（交代部分）は計量が、「ねじり方」（対称部分のうち）はねじれなしが封じて、自由度が残らない。

**補足.** 基本定理は計量の正定値性を使わないので、ローレンツ計量（一般相対論の時空）にもレビ–チビタ接続がただ一つある。逆に、ねじれのある計量接続は、カルタンによる重力理論の拡張などで扱われる。
:::

## 問題 {#riem:sec-lc-problems}

::: problem {#riem:prob-lc-polar}
$\mathbb{R}^{2}\setminus\{0\}$ の極座標 $(r,\theta)$ でユークリッド計量は $dr^{2}+r^{2}d\theta^{2}$ である。レビ–チビタ接続のクリストッフェル記号を求めよ。
:::

::: solution
$g_{rr}=1$, $g_{r\theta}=0$, $g_{\theta\theta}=r^{2}$ で、0 でない微分は $\partial_{r}g_{\theta\theta}=2r$。公式から $\Gamma^{r}_{\theta\theta}=\frac12g^{rr}(-\partial_{r}g_{\theta\theta})=-r$、$\Gamma^{\theta}_{r\theta}=\Gamma^{\theta}_{\theta r}=\frac12g^{\theta\theta}\partial_{r}g_{\theta\theta}=\frac{1}{r}$。他はすべて $0$。
:::

::: problem {#riem:prob-lc-sphere-second-form}
単位球面 $S^{n}\subset\mathbb{R}^{n+1}$ について、$\mathrm{II}(X,Y)(p)=-\langle X,Y\rangle\,p$ であることを示せ。
:::

::: solution
$Y$ は $S^{n}$ 上で $\langle Y(p),p\rangle=0$ を満たす。これを $X$ 方向に微分すると $\langle D_{X}Y,p\rangle+\langle Y,X\rangle=0$（位置ベクトル $p$ の $X$ 方向の微分は $X$）。法空間は $p$ で張られ、$|p|=1$ なので $\mathrm{II}(X,Y)=\langle D_{X}Y,p\rangle p=-\langle X,Y\rangle p$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{riem:sec-lc-exercises} にまとめた。
