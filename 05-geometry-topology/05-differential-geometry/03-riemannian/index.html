# リーマン幾何（Riemannian Geometry）

リーマン計量と距離、ベクトル束の接続と共変微分・平行移動、レビ–チビタ接続、曲率テンソル・断面曲率・リッチ曲率、測地線と指数写像・ガウスの補題、ホッジの星作用素と余微分・ラプラシアン。

<p class="mn-msc">MSC2020: 53B20, 53C05, 53C20, 58A14</p>

## 前提知識

- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：可微分多様体・接束とベクトル場・リー括弧・微分形式とストークスの定理・流れ
- [多様体論 › ファイバー束](../../../05-geometry-topology/04-manifolds/03-fiber-bundles/index.html)（全体、4 ページ）：ベクトル束・局所フレーム・ファイバー計量・構造群の還元
- [微分幾何学 › 曲面論](../../../05-geometry-topology/05-differential-geometry/02-surfaces/index.html)（全体、7 ページ）：第一基本形式・曲面の共変微分と測地線・驚異の定理（動機と比較）
- [微分幾何学 › 曲線論](../../../05-geometry-topology/05-differential-geometry/01-curves/index.html)（全体、4 ページ）：線形常微分方程式の解の存在と一意性
