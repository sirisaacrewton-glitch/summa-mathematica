# リーマン計量と距離 {#riem:page-riemannian-metrics keywords="Riemannian metric, components g_ij, isometry, pullback metric by an immersion, induced metric on a submanifold, hyperbolic upper half space, length of piecewise smooth curves, Riemannian distance, distance induces the manifold topology, musical isomorphisms, gradient, Riemannian volume form sqrt(det g) dx"}

曲面論では、$\mathbb{R}^{3}$ の内積を接平面に制限したもの（第一基本形式）から、長さ・角・面積・曲率を測った。**リーマン計量**は、外側の空間を使わずに、各接空間に内積を一つずつ滑らかに与えたものである。多様体論の系列で見たとおり、これは接束のファイバー計量であり、構造群を $\mathrm{O}(n)$ に還元することと同じで、どの多様体にも存在する（\ref{mfd:fiber-metric-existence}）。このページでは、リーマン計量から曲線の長さと距離を定義し、その距離が多様体の位相を与えることを示す（\ref{riem:distance-metric}）。最後に、計量によって接ベクトルと余接ベクトルが同一視されること（勾配）と、向きと計量から決まる体積形式を扱う。

## 記法と定義の確認 {#riem:sec-rm-notation}

::: notation
- 可微分多様体・接空間・接束・滑らかな写像の微分は \ref{mfd:smooth-manifold}, \ref{mfd:tangent-space}, \ref{mfd:tangent-bundle}, \ref{mfd:differential}。はめ込み・部分多様体は \ref{mfd:immersion}, \ref{mfd:submanifold}。ベクトル束のファイバー計量は \ref{mfd:fiber-metric}。
- 座標近傍 $(U;x_{1},\dots,x_{n})$ の座標ベクトル場を $\partial_{i}\defeq\partial/\partial x_{i}$ と書く。向きと $n$ 形式は \ref{mfd:orientation}, \ref{mfd:orientable-equivalents}。
- 区間 $[a,b]$ 上の**区分的に滑らかな曲線**とは、連続写像 $\gamma\colon[a,b]\to M$ で、分割 $a=t_{0}<\cdots<t_{N}=b$ があって各 $[t_{k-1},t_{k}]$ への制限が（端点を含めて）滑らかなものをいう。
- 曲面論の第一基本形式は \ref{surf:first-fundamental-form}。
:::

## リーマン計量 {#riem:sec-rm-metric}

::: definition リーマン計量 {#riem:riemannian-metric keywords="Riemannian metric: smoothly varying inner products g_m on tangent spaces; components g_ij = g(d_i, d_j); Riemannian manifold (M, g)" index="リーマン計量|りーまんけいりょう, リーマン多様体|りーまんたようたい, 計量テンソル|けいりょうてんそる"}
可微分多様体 $M$ の**リーマン計量** $g$ とは、接束 $TM$ のファイバー計量、つまり各 $m$ に $T_{m}M$ の内積 $g_{m}=\langle\ ,\ \rangle_{m}$ を対応させたもので、各座標近傍の上で
$$
g_{ij}\defeq g(\partial_{i},\partial_{j})\colon U\to\mathbb{R}
$$
が滑らかになるものをいう。組 $(M,g)$ を**リーマン多様体**という。$v=\sum v^{i}\partial_{i}$, $w=\sum w^{j}\partial_{j}$ について $g(v,w)=\sum_{i,j}g_{ij}v^{i}w^{j}$ で、これを $g=\sum_{i,j}g_{ij}\,dx_{i}\,dx_{j}$ とも書く。$|v|\defeq\sqrt{g(v,v)}$。
:::

\ref{mfd:fiber-metric} の後の注意から、滑らかさは一つのアトラスの座標近傍で確かめればよい。座標変換 $y=y(x)$ のもとで成分は $g^{(x)}_{ij}=\sum_{k,l}\frac{\partial y_{k}}{\partial x_{i}}\frac{\partial y_{l}}{\partial x_{j}}g^{(y)}_{kl}$ と変わる（\ref{mfd:change-of-coordinates} と双線形性）。行列 $(g_{ij})$ は各点で正定値対称で、その逆行列の成分を $g^{ij}$ と書く（成分はクラメルの公式から滑らか）。

::: definition 等長写像と引き戻し計量 {#riem:isometry keywords="pullback metric F^*h along an immersion; isometry: diffeomorphism with F^*h = g; local isometry; induced metric on a submanifold" index="等長写像（リーマン多様体）|とうちょうしゃぞうりーまんたようたい, 引き戻し計量|ひきもどしけいりょう, 誘導計量|ゆうどうけいりょう, 局所等長写像|きょくしょとうちょうしゃぞう"}
$(N,h)$ をリーマン多様体、$F\colon M\to N$ をはめ込みとする。
1. $(F^{*}h)_{m}(v,w)\defeq h_{F(m)}(dF_{m}v,dF_{m}w)$ を $F$ による**引き戻し計量**という。$M\subset N$ が部分多様体で $F$ が包含写像のとき、$F^{*}h$ を**誘導計量**という。
2. リーマン多様体 $(M,g)$ から $(N,h)$ への微分同相写像 $F$ で $F^{*}h=g$ となるものを**等長写像**、局所微分同相写像で $F^{*}h=g$ となるものを**局所等長写像**という。
:::

::: proposition 引き戻し計量はリーマン計量 {#riem:pullback-metric keywords="the pullback of a Riemannian metric by an immersion is a Riemannian metric; components; first fundamental form as pullback of the Euclidean metric" index="引き戻し計量の成分|ひきもどしけいりょうのせいぶん"}
はめ込み $F\colon M\to(N,h)$ について、$F^{*}h$ は $M$ のリーマン計量で、座標近傍 $(U;x)$, $(V;y)$（$F(U)\subset V$）での成分は
$$
(F^{*}h)_{ij}=\sum_{k,l}\frac{\partial F^{k}}{\partial x_{i}}\frac{\partial F^{l}}{\partial x_{j}}\,h_{kl}\circ F\qquad(F^{k}\defeq y_{k}\circ F).
$$
とくに、曲面片 $f\colon U\to\mathbb{R}^{3}$ について、$\mathbb{R}^{3}$ の標準計量の引き戻しの成分は第一基本形式 $g_{ij}=\langle f_{i},f_{j}\rangle$ である。
:::

::: proof
各点で $(F^{*}h)_{m}$ は対称双線形。正定値性：$v\neq0$ なら、$F$ ははめ込みなので $dF_{m}v\neq0$（ここで $dF_{m}$ の単射性を使う）、よって $h(dF_{m}v,dF_{m}v)>0$。成分の式は $dF_{m}(\partial_{i})=\sum_{k}\frac{\partial F^{k}}{\partial x_{i}}\partial/\partial y_{k}$（\ref{mfd:df-in-coordinates}）と双線形性から。右辺は滑らかな関数の積と和なので、$F^{*}h$ はリーマン計量。曲面片では $y$ を $\mathbb{R}^{3}$ の標準座標にとると $h_{kl}=\delta_{kl}$, $\partial F^{k}/\partial x_{i}$ は $f_{i}$ の第 $k$ 成分なので、和は $\langle f_{i},f_{j}\rangle$。
:::

::: example リーマン計量の例 {#riem:metric-examples keywords="Euclidean metric, round sphere as induced metric, hyperbolic upper half space (dx^2 + dy^2)/y^2, product metric" index="ユークリッド計量|ゆーくりっどけいりょう, 双曲計量|そうきょくけいりょう, 上半空間モデル|じょうはんくうかんもでる, 積計量|せきけいりょう, 標準計量（球面）|ひょうじゅんけいりょうきゅうめん"}
1. **ユークリッド計量**：$\mathbb{R}^{n}$ の標準座標で $g_{ij}=\delta_{ij}$。
2. **球面**：$S^{n}\subset\mathbb{R}^{n+1}$ の誘導計量を**標準計量**という。
3. **双曲空間**：上半空間 $\mathbb{H}^{n}\defeq\{x\in\mathbb{R}^{n}:x_{n}>0\}$ の上の $g_{ij}\defeq\delta_{ij}/x_{n}^{2}$。
4. **積計量**：$(M_{1},g_{1})$, $(M_{2},g_{2})$ について、$T_{(m_{1},m_{2})}(M_{1}\times M_{2})=T_{m_{1}}M_{1}\oplus T_{m_{2}}M_{2}$ の上の $g_{1}\oplus g_{2}$。
:::

それぞれ、成分が滑らかで各点で正定値であることは定義からすぐ分かる（2 は \ref{riem:pullback-metric} を包含写像に使う。4 の直和の同一視は \ref{mfd:prob-sm-product-tangent}）。

## 曲線の長さと距離 {#riem:sec-rm-distance}

::: definition 曲線の長さと距離 {#riem:length-distance keywords="length of a piecewise smooth curve L(gamma) = int |gamma'(t)| dt; Riemannian distance d(p, q) = inf of lengths of curves from p to q" index="曲線の長さ（リーマン多様体）|きょくせんのながさりーまんたようたい, リーマン距離|りーまんきょり"}
$(M,g)$ をリーマン多様体とする。区分的に滑らかな曲線 $\gamma\colon[a,b]\to M$ の**長さ**を
$$
L(\gamma)\defeq\sum_{k}\int_{t_{k-1}}^{t_{k}}|\gamma'(t)|\,dt
$$
と定める（被積分関数は各小区間で連続）。$M$ が連結なとき、$p,q\in M$ について
$$
d(p,q)\defeq\inf\{L(\gamma):\gamma\text{ は }p\text{ から }q\text{ への区分的に滑らかな曲線}\}
$$
を**リーマン距離**という。
:::

長さは、区分的に滑らかで単調増加な全単射によるパラメータの取り替えで変わらない（各小区間で置換積分）。

::: lemma 区分的に滑らかな曲線による連結性 {#riem:piecewise-connected keywords="in a connected manifold any two points are joined by a piecewise smooth curve" index="区分的に滑らかな曲線での連結性|くぶんてきになめらかなきょくせんでのれんけつせい"}
連結な可微分多様体の任意の 2 点は、区分的に滑らかな曲線で結べる。
:::

::: proof
$p\in M$ を固定し、$p$ と区分的に滑らかな曲線で結べる点の全体を $A$ とする。【主張：$A$ も $M\setminus A$ も開集合】$q\in M$ を中心とし、像が開球 $B(0,\varepsilon)$ の座標近傍 $(U,\varphi)$ をとる（\ref{mfd:maximal-atlas.3}）。$U$ の点 $q'$ は、$t\mapsto\varphi^{-1}(t\varphi(q'))$（$t\in[0,1]$、像は開球の中の線分）という滑らかな曲線で $q$ と結べる。曲線をつなげ、逆向きにたどったものも区分的に滑らかなので、$q\in A$ なら $U\subset A$、$q\notin A$ なら $U\cap A=\varnothing$。$p\in A$ なので $A\neq\varnothing$ で、$M$ の連結性から $A=M$。
:::

::: theorem リーマン距離は位相と整合する {#riem:distance-metric keywords="the Riemannian distance of a connected Riemannian manifold is a metric inducing the manifold topology; local comparison with the Euclidean distance in a chart" index="リーマン距離の性質|りーまんきょりのせいしつ"}
$(M,g)$ を連結なリーマン多様体とする。$d$ は $M$ 上の距離関数で、$d$ の定める位相は $M$ の多様体としての位相に一致する。
:::

::: intuition
座標近傍のコンパクトな部分では、計量の成分は連続で正定値なので、ユークリッドの長さの $\lambda$ 倍から $\Lambda$ 倍の範囲に収まる。だから、近くでは $d$ はユークリッド距離と同程度の大きさになり、二つの位相は「同じ小ささ」を同じと判断する。
:::

::: proof
**Step 1（擬距離）.** \ref{riem:piecewise-connected} から $d(p,q)<\infty$。$d(p,p)=0$（定値曲線）、$d(p,q)=d(q,p)$（逆にたどる曲線は長さが同じ）、$d(p,r)\le d(p,q)+d(q,r)$（曲線をつなげると長さは和）。$d\ge0$ は明らか。

**Step 2（局所的な比較）.** $p\in M$ と、$p$ を中心とする座標近傍 $(U,\varphi)$ で、$\varphi(U)\supset\bar B(0,2r)$ となるものをとる（$r>0$）。【主張：$0<\lambda\le\Lambda$ があって、$|x|\le r$ と $\xi\in\mathbb{R}^{n}$ について $\lambda^{2}|\xi|^{2}\le\sum_{i,j}g_{ij}(\varphi^{-1}(x))\xi^{i}\xi^{j}\le\Lambda^{2}|\xi|^{2}$】関数 $(x,\xi)\mapsto\sum g_{ij}(\varphi^{-1}(x))\xi^{i}\xi^{j}$ はコンパクト集合 $\bar B(0,r)\times S^{n-1}$ の上で連続で、正定値性から正の値をとるので、正の最小値 $\lambda^{2}$ と最大値 $\Lambda^{2}$ をもつ。$\xi\neq0$ では $\xi/|\xi|$ に適用して $|\xi|^{2}$ 倍すればよい。

以下 $V_{\rho}\defeq\varphi^{-1}(B(0,\rho))$（$0<\rho\le r$）とし、$\gamma$ が $V_{r}$ の閉包の中にある区間では、$x(t)\defeq\varphi(\gamma(t))$ と書く。そこでは $|\gamma'(t)|\ge\lambda|x'(t)|$ なので、その区間 $[s,s']$ 上の長さは $\lambda\int_{s}^{s'}|x'|\,dt\ge\lambda|x(s')-x(s)|$ 以上（ベクトル値関数の積分のノルムの評価）。

**Step 3（下からの評価）.** 【主張：$q\in V_{r}$ なら $d(p,q)\ge\lambda|\varphi(q)|$、$q\notin V_{r}$ なら $d(p,q)\ge\lambda r$】$\gamma\colon[a,b]\to M$ を $p$ から $q$ への区分的に滑らかな曲線とする。$\gamma$ が $V_{r}$ の外に出ないなら、Step 2 から $L(\gamma)\ge\lambda|\varphi(q)-0|$。外に出るなら、$t_{1}\defeq\inf\{t:\gamma(t)\notin V_{r}\}$ とおく。$V_{r}$ は開集合なので $\gamma(t_{1})\notin V_{r}$、また $[a,t_{1})$ では $\gamma(t)\in V_{r}\subset K\defeq\varphi^{-1}(\bar B(0,r))$。$K$ はコンパクトで、$M$ はハウスドルフなので閉集合、よって $\gamma(t_{1})\in K\setminus V_{r}$、つまり $|x(t_{1})|=r$。Step 2 から $L(\gamma)\ge L(\gamma\restriction[a,t_{1}])\ge\lambda r$。いずれの場合も、$q\in V_{r}$ なら $L(\gamma)\ge\lambda\min(|\varphi(q)|,r)=\lambda|\varphi(q)|$、$q\notin V_{r}$ なら $L(\gamma)\ge\lambda r$（$q\notin V_{r}$ なら曲線は必ず外に出る）。下限をとれば主張が従う。

とくに $q\neq p$ なら $d(p,q)>0$。$p$ は任意なので、Step 1 と合わせて $d$ は距離関数。

**Step 4（上からの評価）.** 【主張：$q\in V_{r}$ なら $d(p,q)\le\Lambda|\varphi(q)|$】曲線 $\gamma(t)\defeq\varphi^{-1}(t\varphi(q))$（$t\in[0,1]$）は $V_{r}$ の中にあり、$x'(t)=\varphi(q)$ なので $L(\gamma)\le\int_{0}^{1}\Lambda|\varphi(q)|\,dt$。

**Step 5（位相の一致）.** Step 3・4 から、$0<\varepsilon\le\lambda r$ について
$$
\varphi^{-1}\bigl(B(0,\varepsilon/\Lambda)\bigr)\subset B_{d}(p,\varepsilon)\subset\varphi^{-1}\bigl(B(0,\varepsilon/\lambda)\bigr)
$$
（左：$|\varphi(q)|<\varepsilon/\Lambda\le r$ なら $d(p,q)<\varepsilon$。右：$d(p,q)<\varepsilon\le\lambda r$ なら Step 3 の第 2 の場合は起こらず $q\in V_{r}$ で、$\lambda|\varphi(q)|<\varepsilon$）。$\varphi$ は同相写像なので $\{\varphi^{-1}(B(0,\delta))\}_{\delta>0}$ は多様体の位相での $p$ の基本近傍系で、$\{B_{d}(p,\varepsilon)\}$ は距離位相での基本近傍系。上の包含から、各点で二つの基本近傍系は互いに相手の元を含むので、二つの位相の開集合は一致する（開集合とは、各点の基本近傍系の元を含む集合）。

::: hypcheck
- **計量の連続性と正定値性**：Step 2 の $\lambda>0$ と $\Lambda<\infty$ に使った。正定値でなく半正定値なら $\lambda=0$ になりえ、$d(p,q)=0$ となる $q\neq p$ が出うる。
- **ハウスドルフ性**：Step 3 で、コンパクト集合 $K$ が閉集合であることに使った。
- **連結性**：$d<\infty$ のため（\ref{riem:piecewise-connected}）。連結でなければ、成分ごとに距離を考える。
:::
:::

## 勾配と体積形式 {#riem:sec-rm-musical}

::: definition 音楽同型と勾配 {#riem:musical-gradient keywords="musical isomorphisms flat: TM -> T*M, v -> g(v, .), and sharp; gradient grad f = (df)^sharp, (grad f)^i = sum_j g^{ij} d_j f" index="音楽同型|おんがくどうけい, 勾配（リーマン多様体）|こうばいりーまんたようたい, フラット（計量）|ふらっとけいりょう, シャープ（計量）|しゃーぷけいりょう"}
リーマン多様体 $(M,g)$ について、$v\in T_{m}M$ に $v^{\flat}\defeq g_{m}(v,\cdot)\in T_{m}^{*}M$ を対応させる写像 $\flat$ は各ファイバーの上で線形同型（内積の非退化性）で、その逆を $\sharp$ と書く。座標では $(\sum v^{i}\partial_{i})^{\flat}=\sum_{i,j}g_{ij}v^{i}dx_{j}$, $(\sum\eta_{j}dx_{j})^{\sharp}=\sum_{i,j}g^{ij}\eta_{j}\partial_{i}$。$f\in C^{\infty}(M)$ の**勾配**を $\operatorname{grad}f\defeq(df)^{\sharp}$ と定める。つまり $g(\operatorname{grad}f,X)=Xf$ で、$\operatorname{grad}f=\sum_{i,j}g^{ij}\partial_{j}f\,\partial_{i}$。
:::

座標の式から、$\flat$ と $\sharp$ は滑らかなベクトル場と 1 形式の間の対応を与え、$\operatorname{grad}f$ は滑らかなベクトル場である。

::: proposition リーマン体積形式 {#riem:volume-form keywords="on an oriented Riemannian manifold there is a unique n-form vol_g taking value 1 on positive orthonormal bases; in a positive chart vol_g = sqrt(det g_ij) dx_1 ^ ... ^ dx_n" index="リーマン体積形式|りーまんたいせきけいしき, 体積要素|たいせきようそ"}
$(M,g)$ を向きづけられた $n$ 次元のリーマン多様体（$n\ge1$）とする。$n$ 形式 $\mathrm{vol}_{g}$ で、各点の正の正規直交基底 $(e_{1},\dots,e_{n})$ について $\mathrm{vol}_{g}(e_{1},\dots,e_{n})=1$ となるものがただ一つあり、正の座標近傍 $(U;x)$ の上で
$$
\mathrm{vol}_{g}=\sqrt{\det(g_{ij})}\;dx_{1}\wedge\cdots\wedge dx_{n}.
$$
:::

::: proof
**一意性.** $n$ 形式は各点で、一つの基底での値で決まる（$\Lambda^{n}T_{m}^{*}M$ は 1 次元で、基底の値 $\omega(e_{1},\dots,e_{n})$ は $\omega$ の座標）。

**存在.** 正の座標近傍の上で $\omega_{U}\defeq\sqrt{\det(g_{ij})}\,dx_{1}\wedge\cdots\wedge dx_{n}$ とおく（$\det(g_{ij})>0$ なので滑らか）。【主張：正の正規直交基底で $\omega_{U}$ の値は $1$】$e_{j}=\sum_{i}A_{ij}\partial_{i}$ とすると $dx_{1}\wedge\cdots\wedge dx_{n}(e_{1},\dots,e_{n})=\det A$。正規直交性 $g(e_{j},e_{l})=\delta_{jl}$ は $A^{\mathsf{T}}(g_{ij})A=I$ なので $(\det A)^{2}\det(g_{ij})=1$。$(e_{j})$ も $(\partial_{i})$ も正の基底なので $\det A>0$（$(dx_{1}\wedge\cdots\wedge dx_{n})_{m}$ は向きの類に属し、正の基底での値は正）。よって $\det A=1/\sqrt{\det(g_{ij})}$ で、$\omega_{U}(e_{1},\dots,e_{n})=1$。二つの正の座標近傍の重なりでは、$\omega_{U}$ と $\omega_{U'}$ は同じ基底で同じ値 $1$ をとるので一致する（一意性の議論）。正の座標近傍は $M$ を覆うので、貼り合わせて $\mathrm{vol}_{g}$ が得られる。各点に正の正規直交基底が存在すること（グラム–シュミット）も使った。
:::

$M$ がコンパクトなら、$\operatorname{vol}(M)\defeq\int_{M}\mathrm{vol}_{g}$ を $M$ の**体積**という。

::: supplement
**高い視点：構造群の還元としてのリーマン計量.** リーマン計量を与えることは、接束の構造群を $\mathrm{GL}(n)$ から $\mathrm{O}(n)$ に還元することと同じである（\ref{mfd:reduction-orthogonal}）。$\mathrm{O}(n)$ で保たれる量（内積、したがって長さ・角度）は地図によらずに意味をもち、さらに向きを固定して $\mathrm{SO}(n)$ まで還元すると、$\mathrm{SO}(n)$ で保たれる量（体積形式）が意味をもつ：\ref{riem:volume-form} は、$\mathrm{SO}(n)$ の不変量である行列式を束全体に広げたものである。比喩で言えば、地図帳の乗り換えを「回転だけ」に制限すると、どの地図で測っても同じ長さ・同じ面積になる。

**補足.** \ref{riem:distance-metric} の証明は、計量が連続で正定値であることしか使っていないので、連続なリーマン計量でも成り立つ。逆に、距離 $d$ から計量 $g$ を復元できる：$g_{m}(v,v)=\lim_{t\to0}d(\gamma(0),\gamma(t))^{2}/t^{2}$（$\gamma'(0)=v$）。これは測地線を扱った後で示すのが自然である（事実として述べるにとどめる）。リーマン多様体の間の距離を保つ全射は等長写像（滑らか）であることも知られている（マイヤーズ–スティーンロッドの定理）。
:::

## 問題 {#riem:sec-rm-problems}

::: problem {#riem:prob-rm-euclidean-distance}
$\mathbb{R}^{n}$ のユークリッド計量のリーマン距離は $|p-q|$ であることを示せ。
:::

::: solution
線分 $t\mapsto p+t(q-p)$ の長さは $|q-p|$ なので $d(p,q)\le|p-q|$。逆に区分的に滑らかな曲線 $\gamma$ について、各小区間で $\int|\gamma'|\ge|\int\gamma'|=|\gamma(t_{k})-\gamma(t_{k-1})|$ で、三角不等式から $L(\gamma)\ge|q-p|$。
:::

::: problem {#riem:prob-rm-hyperbolic-vertical}
上半平面 $\mathbb{H}^{2}$（\ref{riem:metric-examples.3}）で、点 $(0,a)$ と $(0,b)$（$0<a<b$）の距離は $\log(b/a)$ であることを示せ。とくに $\mathbb{H}^{2}$ の点は $x_{2}\to0$ で無限に遠い。
:::

::: solution
曲線 $\gamma(t)=(x_{1}(t),x_{2}(t))$ の長さは $\int\sqrt{x_{1}'^{2}+x_{2}'^{2}}/x_{2}\,dt\ge\int|x_{2}'|/x_{2}\,dt\ge\bigl|\int x_{2}'/x_{2}\,dt\bigr|=\log(b/a)$（$\log x_{2}$ の微分が $x_{2}'/x_{2}$）。線分 $t\mapsto(0,t)$（$a\le t\le b$）では等号が成り立つので、$d=\log(b/a)$。$a\to0$ で $\to\infty$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{riem:sec-rm-exercises} にまとめた。
