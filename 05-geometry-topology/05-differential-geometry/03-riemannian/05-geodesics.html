# 測地線と指数写像 {#riem:page-geodesics keywords="geodesic equation, geodesic spray as a vector field on TM, maximal geodesics, smooth dependence on initial velocity, rescaling, exponential map, normal neighbourhood, symmetry lemma for two-parameter maps, Gauss lemma, radial geodesics minimize length locally, distance in normal balls, Hopf-Rinow theorem"}

測地線は、加速度（速度ベクトルの共変微分）が $0$ の曲線、つまり「まっすぐ進む」曲線である。このページでは、測地線の方程式が接束 $TM$ 上のベクトル場（**測地流**）の積分曲線として書けることから、測地線の存在・一意性と初速度への滑らかな依存を導き、**指数写像** $\exp_{p}$ を定義する。主結果は、**ガウスの補題**（$\exp_{p}$ は動径方向と、それに直交する方向の直交性を保つ）と、その帰結として、測地線が局所的には 2 点を結ぶ最短の曲線であること（\ref{riem:geodesics-minimize}）である。曲面論の測地線（\ref{surf:geodesic}）の一般化で、曲面では外側の空間を使って示したことを、計量だけから示す。

## 記法と定義の確認 {#riem:sec-gd-notation}

::: notation
- レビ–チビタ接続とクリストッフェル記号は \ref{riem:levi-civita}、曲線に沿った共変微分 $D_{t}$ は \ref{riem:covariant-along-curve}、計量接続の性質は \ref{riem:metric-connection-properties}。長さとリーマン距離は \ref{riem:length-distance}, \ref{riem:distance-metric}。
- ベクトル場の流れの基本定理は \ref{mfd:flow-theorem}（流れの定義域が開集合で流れが滑らかであることは、常微分方程式の初期値に関する滑らかな依存性 \ref{surf:smooth-dependence} による事実として引用している）。逆関数定理は \ref{mfd:inverse-function-theorem}。
- 接束の自然な座標を $(x,\xi)$ と書く：$\xi=\sum\xi^{i}\partial_{i}$（\ref{mfd:tangent-bundle}）。曲線 $\gamma$ の速度を $\dot\gamma=\gamma'$ と書く。
:::

## 測地線と測地流 {#riem:sec-gd-geodesics}

::: definition 測地線 {#riem:geodesic keywords="geodesic: a curve with D_t gamma' = 0; geodesic equation in coordinates gamma^k'' + sum Gamma^k_ij gamma^i' gamma^j' = 0; geodesics have constant speed" index="測地線（リーマン多様体）|そくちせんりーまんたようたい, 測地線の方程式|そくちせんのほうていしき"}
滑らかな曲線 $\gamma\colon I\to M$ で $D_{t}\dot\gamma=0$ となるものを**測地線**という。座標近傍では、\ref{riem:covariant-along-curve} の式から
$$
\ddot\gamma^{k}+\sum_{i,j}\Gamma^{k}_{ij}(\gamma)\,\dot\gamma^{i}\dot\gamma^{j}=0\qquad(k=1,\dots,n).
$$
:::

計量との両立から $\frac{d}{dt}|\dot\gamma|^{2}=2\langle D_{t}\dot\gamma,\dot\gamma\rangle=0$ なので、測地線の速さは一定である。

::: proposition 測地流 {#riem:geodesic-flow keywords="there is a unique vector field G on TM (geodesic spray) whose integral curves are exactly the velocity curves (gamma, gamma') of geodesics; in natural coordinates G = sum xi^k d/dx_k - sum Gamma^k_ij xi^i xi^j d/dxi^k" index="測地流|そくちりゅう, 測地スプレー|そくちすぷれー"}
$TM$ 上のベクトル場 $\mathcal{G}$ で、その積分曲線がちょうど測地線の速度曲線 $t\mapsto\dot\gamma(t)\in TM$ であるものがただ一つある。自然な座標では
$$
\mathcal{G}=\sum_{k}\xi^{k}\frac{\partial}{\partial x_{k}}-\sum_{i,j,k}\Gamma^{k}_{ij}(x)\,\xi^{i}\xi^{j}\frac{\partial}{\partial\xi^{k}}.
$$
:::

::: proof
**局所.** 自然な座標近傍 $\pi^{-1}(U)$ の上で、式の右辺を $\mathcal{G}_{U}$ とする（係数は滑らか）。$\mathcal{G}_{U}$ の積分曲線 $t\mapsto(x(t),\xi(t))$ は $\dot x^{k}=\xi^{k}$, $\dot\xi^{k}=-\sum\Gamma^{k}_{ij}\xi^{i}\xi^{j}$ を満たし、これは $x(t)$ が測地線の方程式を満たし $\xi=\dot x$ であることと同値。

**貼り合わせ.** 二つの座標近傍の重なりで、$\mathcal{G}_{U}$ と $\mathcal{G}_{U'}$ の積分曲線はどちらも「測地線の速度曲線」（座標によらない概念）なので、各点 $v$ を通る積分曲線は（\ref{surf:picard-lindelof} の局所存在から存在し）、どちらも初速度 $v$ の測地線の速度曲線である。初速度が同じ二つの測地線は、一方の座標近傍で同じ方程式の解なので、\ref{surf:picard-lindelof} の一意性から $0$ の近くで一致する。ベクトル場の値は、その点を通る積分曲線の $t=0$ での速度なので、$\mathcal{G}_{U}(v)=\mathcal{G}_{U'}(v)$。よって $\mathcal{G}_{U}$ は貼り合わさって $TM$ 上のベクトル場になる。一意性も同じ理由。
:::

::: theorem 測地線の存在と一意性・初速度への依存 {#riem:geodesic-existence keywords="for each v in TM there is a unique maximal geodesic gamma_v with gamma_v'(0) = v; the set of (t, v) with t in the domain is open and (t, v) -> gamma_v(t) is smooth; rescaling gamma_{cv}(t) = gamma_v(ct)" index="測地線の存在と一意性（リーマン多様体）|そくちせんのそんざいといちいせいりーまんたようたい, 極大測地線|きょくだいそくちせん"}
1. 各 $v\in TM$ について、$\dot\gamma_{v}(0)=v$ となる測地線で、定義域 $I_{v}\ni0$ が最大のもの $\gamma_{v}$ がただ一つある。
2. $\mathcal{D}\defeq\{(t,v)\in\mathbb{R}\times TM:t\in I_{v}\}$ は開集合で、$(t,v)\mapsto\gamma_{v}(t)$ は滑らかである。
3. $c\in\mathbb{R}$ について、$I_{cv}=\{t:ct\in I_{v}\}$ で $\gamma_{cv}(t)=\gamma_{v}(ct)$。
:::

::: proof
**1・2.** \ref{mfd:flow-theorem} を $\mathcal{G}$ に適用する。$v$ を始点とする極大な積分曲線 $\Gamma_{v}$ は、\ref{riem:geodesic-flow} から測地線の速度曲線 $\Gamma_{v}=\dot\gamma$ で、$\gamma_{v}\defeq\pi\circ\Gamma_{v}$ とおく。測地線 $\gamma$ で $\dot\gamma(0)=v$ のものは、$\dot\gamma$ が $\mathcal{G}$ の積分曲線なので $\Gamma_{v}$ の制限で、$\gamma$ は $\gamma_{v}$ の制限。流れ $\phi$ の定義域は開集合で $\phi$ は滑らかなので、$(t,v)\mapsto\gamma_{v}(t)=\pi(\phi(t,v))$ も滑らか。

**3.** $c=0$ なら両辺とも定値曲線（$\gamma_{0_{p}}(t)=p$ は測地線）。$c\neq0$ のとき、$\beta(t)\defeq\gamma_{v}(ct)$ は $\dot\beta(t)=c\dot\gamma_{v}(ct)$, $D_{t}\dot\beta=c^{2}(D_{t}\dot\gamma_{v})(ct)=0$（座標の式で確かめられる）なので、$\dot\beta(0)=cv$ の測地線で、定義域は $\{t:ct\in I_{v}\}$。1 の最大性から $\beta$ は $\gamma_{cv}$ の制限で、逆に $\gamma_{cv}(t/c)$ に同じ議論を使うと $I_{cv}$ は $\{t:ct\in I_{v}\}$ に含まれる。
:::

## 指数写像 {#riem:sec-gd-exponential}

::: definition 指数写像 {#riem:exponential-map keywords="exponential map exp(v) = gamma_v(1) on the open set E of v with 1 in I_v; exp_p = exp restricted to T_pM; exp_p(tv) = gamma_v(t)" index="指数写像（リーマン多様体）|しすうしゃぞうりーまんたようたい"}
$\mathcal{E}\defeq\{v\in TM:1\in I_{v}\}$ とし、$\exp\colon\mathcal{E}\to M$, $\exp(v)\defeq\gamma_{v}(1)$ を**指数写像**という。$p\in M$ について $\mathcal{E}_{p}\defeq\mathcal{E}\cap T_{p}M$, $\exp_{p}\defeq\exp\restriction\mathcal{E}_{p}$ と書く。
:::

::: proposition 指数写像の基本性質 {#riem:exponential-properties keywords="E is open and contains the zero section; exp is smooth; E_p is star-shaped and exp_p(tv) = gamma_v(t); d(exp_p)_0 = id; exp_p is a diffeomorphism from a ball B(0, eps) onto an open neighbourhood of p (normal ball)" index="正規近傍|せいききんぼう, 正規座標|せいきざひょう, 測地球|そくちきゅう"}
1. $\mathcal{E}$ は $TM$ の開集合で、零切断 $\{0_{p}\}$ を含む。$\exp$ は滑らかである。
2. $v\in\mathcal{E}_{p}$, $0\le t\le1$ なら $tv\in\mathcal{E}_{p}$ で、$\exp_{p}(tv)=\gamma_{v}(t)$。
3. $T_{0}(T_{p}M)=T_{p}M$ と同一視すると、$d(\exp_{p})_{0}=\mathrm{id}_{T_{p}M}$。
4. $\varepsilon>0$ があって、$\exp_{p}$ は $B(0,\varepsilon)\defeq\{v\in T_{p}M:|v|<\varepsilon\}$ から $M$ の開集合 $\exp_{p}(B(0,\varepsilon))$ への微分同相写像である（**正規球**）。
:::

::: proof
**1.** $\mathcal{E}=\{v:(1,v)\in\mathcal{D}\}$ は開集合 $\mathcal{D}$ の切り口なので開集合。$I_{0_{p}}=\mathbb{R}$ なので零切断を含む。$\exp(v)=\gamma_{v}(1)$ は \ref{riem:geodesic-existence.2} から滑らか。

**2.** \ref{riem:geodesic-existence.3} から $I_{tv}=\{s:ts\in I_{v}\}\ni1$（$t\in I_{v}$、$I_{v}$ は $0$ と $1$ を含む区間）で、$\exp_{p}(tv)=\gamma_{tv}(1)=\gamma_{v}(t)$。

**3.** $v\in T_{p}M$ について、曲線 $t\mapsto tv$ の $\exp_{p}$ による像は $\gamma_{v}(t)$ で、$t=0$ での速度は $v$。よって $d(\exp_{p})_{0}(v)=v$。

**4.** $\mathcal{E}_{p}$ は $T_{p}M$ の開集合で、3 と逆関数定理（\ref{mfd:inverse-function-theorem}）から、$0$ の開近傍 $W$ で $\exp_{p}\restriction W$ が開集合への微分同相写像になるものがある。$B(0,\varepsilon)\subset W$ ととればよい（$T_{p}M$ のノルムは計量 $g_{p}$ によるもの）。
:::

正規球の上で、$T_{p}M$ の正規直交基底による座標を $\exp_{p}$ で移したものを**正規座標**という。

## ガウスの補題と最短性 {#riem:sec-gd-gauss-lemma}

::: lemma 対称性の補題 {#riem:symmetry-lemma keywords="for a smooth two-parameter map f(s,t), D_s d_t f = D_t d_s f (torsion-free); and d/ds <d_t f, d_t f> = 2 <D_s d_t f, d_t f>" index="対称性の補題（共変微分）|たいしょうせいのほだいきょうへんびぶん"}
$f\colon(-\delta,\delta)\times I\to M$ を滑らかな写像とし、$\partial_{s}f$, $\partial_{t}f$ をそれぞれ $s$ 曲線・$t$ 曲線の速度、$D_{s}$, $D_{t}$ をそれぞれの曲線に沿った共変微分とする。このとき $D_{s}\partial_{t}f=D_{t}\partial_{s}f$。
:::

::: proof
座標では、\ref{riem:covariant-along-curve} の式から
$$
D_{s}\partial_{t}f=\sum_{k}\Bigl(\frac{\partial^{2}f^{k}}{\partial s\,\partial t}+\sum_{i,j}\Gamma^{k}_{ij}(f)\,\frac{\partial f^{i}}{\partial s}\frac{\partial f^{j}}{\partial t}\Bigr)\partial_{k}.
$$
$s$ と $t$ を入れ替えると、第 1 項は 2 階偏微分の対称性で、第 2 項は $\Gamma^{k}_{ij}=\Gamma^{k}_{ji}$（ねじれがない）で変わらない。
:::

::: theorem ガウスの補題 {#riem:gauss-lemma keywords="Gauss lemma: for v in E_p and w in T_pM, <d(exp_p)_v(v), d(exp_p)_v(w)> = <v, w>; radial geodesics are orthogonal to geodesic spheres" index="ガウスの補題|がうすのほだい"}
$p\in M$, $v\in\mathcal{E}_{p}$, $w\in T_{p}M$ について（$T_{v}(T_{p}M)=T_{p}M$ と同一視して）
$$
\bigl\langle d(\exp_{p})_{v}(v),\ d(\exp_{p})_{v}(w)\bigr\rangle=\langle v,w\rangle.
$$
:::

::: intuition
指数写像は一般に長さを保たないが、動径方向（$v$ 方向）については、その長さと、動径方向との内積だけは保つ。中心から出る測地線は、測地球（中心から一定距離の点の集まり）と直交する。
:::

::: proof
**Step 1（変分）.** $\mathcal{E}_{p}$ は開集合で、$tv\in\mathcal{E}_{p}$（$0\le t\le1$）なので、コンパクト性から $\delta>0$ と開区間 $I\supset[0,1]$ があって、$|s|<\delta$, $t\in I$ について $t(v+sw)\in\mathcal{E}_{p}$。$f(s,t)\defeq\exp_{p}(t(v+sw))$ とおくと滑らかで、各 $s$ について $t\mapsto f(s,t)=\gamma_{v+sw}(t)$ は測地線（\ref{riem:exponential-properties.2}）。連鎖律から
$$
\partial_{t}f(0,1)=d(\exp_{p})_{v}(v),\qquad\partial_{s}f(0,t)=d(\exp_{p})_{tv}(tw).
$$
とくに $\partial_{s}f(0,1)=d(\exp_{p})_{v}(w)$, $\partial_{s}f(0,0)=0$。

**Step 2（内積の微分）.** $h(t)\defeq\langle\partial_{t}f,\partial_{s}f\rangle(0,t)$ とする。計量との両立（\ref{riem:metric-connection-properties.2}）と、$t$ 曲線が測地線であること（$D_{t}\partial_{t}f=0$）、対称性の補題から
$$
h'(t)=\langle D_{t}\partial_{t}f,\partial_{s}f\rangle+\langle\partial_{t}f,D_{t}\partial_{s}f\rangle=\langle\partial_{t}f,D_{s}\partial_{t}f\rangle=\frac12\frac{\partial}{\partial s}\langle\partial_{t}f,\partial_{t}f\rangle\Big|_{s=0}.
$$
測地線の速さは一定なので $|\partial_{t}f(s,t)|^{2}=|\partial_{t}f(s,0)|^{2}=|v+sw|^{2}$、その $s$ 微分の半分は $s=0$ で $\langle v,w\rangle$。よって $h'(t)=\langle v,w\rangle$、$h(0)=0$（$\partial_{s}f(0,0)=0$）なので $h(1)=\langle v,w\rangle$。$h(1)$ は求める左辺である。
:::

::: theorem 測地線の局所的な最短性 {#riem:geodesics-minimize keywords="in a normal ball B(0,eps), the radial geodesic from p to exp_p(v) has length |v| and every piecewise smooth curve from p to exp_p(v) has length at least |v|; d(p, exp_p v) = |v|; metric balls are normal balls" index="測地線の最短性|そくちせんのさいたんせい"}
$\exp_{p}$ が $B(0,\varepsilon)$ 上の微分同相写像であるとし、$v\in B(0,\varepsilon)$, $q\defeq\exp_{p}(v)$ とする。
1. 測地線 $t\mapsto\exp_{p}(tv)$（$0\le t\le1$）の長さは $|v|$。
2. $p$ から $q$ への任意の区分的に滑らかな曲線の長さは $|v|$ 以上である。
3. したがって $d(p,q)=|v|$ で、$0<r\le\varepsilon$ について $B_{d}(p,r)=\exp_{p}(B(0,r))$。
:::

::: proof
**1.** 速さは一定で $|\dot\gamma_{v}(0)|=|v|$ なので、長さは $\int_{0}^{1}|v|\,dt$。

**2.** $c\colon[a,b]\to M$ を $p$ から $q$ への区分的に滑らかな曲線とする。$v=0$ なら明らか。$v\neq0$ とし、$\rho\defeq|v|$。

【主張：$c$ が $U_{\rho}\defeq\exp_{p}(B(0,\rho))$ の中にある部分で、$|\dot c|\ge|\dot r|$】$c(t)\in U_{\varepsilon}\setminus\{p\}$ となる $t$ では、$c(t)=\exp_{p}(r(t)u(t))$, $r(t)>0$, $|u(t)|=1$ と一意に書け、$r=|\exp_{p}^{-1}\circ c|$, $u=\exp_{p}^{-1}\circ c/r$ は（区分的に）滑らか（$|\cdot|$ は $0$ 以外で滑らか）。$|u|^{2}=1$ を微分して $\langle u,\dot u\rangle=0$。連鎖律から $\dot c=d(\exp_{p})_{ru}(\dot r\,u+r\dot u)$。ガウスの補題を $v=ru$ と $w=u$, $w=\dot u$ に使うと（$d(\exp_{p})_{ru}(ru)$ と比べて $r$ で割る）
$$
\bigl|d(\exp_{p})_{ru}(u)\bigr|^{2}=\langle u,u\rangle=1,\qquad\bigl\langle d(\exp_{p})_{ru}(u),\ d(\exp_{p})_{ru}(\dot u)\bigr\rangle=\langle u,\dot u\rangle=0.
$$
よって $\dot c$ は直交する二つのベクトル $\dot r\,d(\exp_{p})_{ru}(u)$（長さ $|\dot r|$）と $r\,d(\exp_{p})_{ru}(\dot u)$ の和で、ピタゴラスの定理から $|\dot c|\ge|\dot r|$。

【主張：長さは $\rho$ 以上】$t_{0}\defeq\sup\{t:c(t)=p\}$ とする（$c(a)=p$ なので存在し、閉集合なので $c(t_{0})=p$）。$c$ が $t_{0}$ 以後 $U_{\rho}$ を出ないなら、$t\to t_{0}+$ で $r(t)\to0$（$\exp_{p}^{-1}$ の連続性）で、$(t_{0},b]$ の上で $r>0$。$\eta>0$ について $\int_{t_{0}+\eta}^{b}|\dot c|\,dt\ge\int_{t_{0}+\eta}^{b}\dot r\,dt=r(b)-r(t_{0}+\eta)$（各小区間で微積分の基本定理を使い、足す）。$r(b)=|v|=\rho$ で、$\eta\to0$ とすれば $L(c)\ge\rho$。$c$ が $t_{0}$ 以後に $U_{\rho}$ を出るなら、$t_{1}\defeq\inf\{t>t_{0}:c(t)\notin U_{\rho}\}$ とすると、$c(t_{1})\notin U_{\rho}$ で、$[t_{0},t_{1})$ では $c\in U_{\rho}$。$\exp_{p}$ は $B(0,\varepsilon)$ 上の同相写像で、$\bar B(0,\rho)\subset B(0,\varepsilon)$ の像 $\exp_{p}(\bar B(0,\rho))$ はコンパクトなので閉集合、よって $c(t_{1})\in\exp_{p}(\bar B(0,\rho))\setminus U_{\rho}$、つまり $r(t_{1})=\rho$。上と同じ議論を $[t_{0},t_{1}]$ で行えば $L(c)\ge\rho$。

**3.** 1・2 から $d(p,q)=|v|$。$q\in\exp_{p}(B(0,r))$ なら $d(p,q)<r$。逆に $d(p,q)<r\le\varepsilon$ なら、$q\notin U_{r}$ とすると、$q$ への曲線は $U_{r}$ を出るので、2 の証明の後半と同じ議論で長さが $r$ 以上になり矛盾。よって $q\in U_{r}$。

::: hypcheck
- **ガウスの補題**：$|\dot c|\ge|\dot r|$ の評価で使った。ここでレビ–チビタ接続のねじれのなさ（対称性の補題）と計量との両立の両方が効いている。
- **$\exp_{p}$ が $B(0,\varepsilon)$ 上で微分同相**：$r,u$ が一意に滑らかに定まることと、閉球の像が閉集合であることに使った。
:::
:::

::: fact ホップ–リノウの定理 {#riem:hopf-rinow keywords="Hopf-Rinow: for a connected Riemannian manifold, metric completeness, geodesic completeness and exp_p defined on all of T_pM are equivalent, and then any two points are joined by a minimizing geodesic" index="ホップ–リノウの定理|ほっぷりのうのていり, 測地的完備|そくちてきかんび, 完備なリーマン多様体|かんびなりーまんたようたい"}
連結なリーマン多様体 $(M,g)$ について、次は同値である。(a) $(M,d)$ は完備な距離空間。(b) すべての測地線が $\mathbb{R}$ 全体に延びる（**測地的完備**）。(c) ある点 $p$ で $\exp_{p}$ が $T_{p}M$ 全体で定義される。(d) 有界閉集合はコンパクト。さらにこのとき、任意の 2 点は長さがその距離に等しい測地線で結べる。とくにコンパクトなリーマン多様体は完備である。（証明は、たとえばドゥ・カルモ『Riemannian Geometry』第 7 章。本サイトではまだ扱っていない。）
:::

::: supplement
**高い視点：測地線は長さ（エネルギー）汎関数の臨界点.** 端点を固定した曲線の空間の上のエネルギー $E(c)=\frac12\int|\dot c|^{2}dt$ を考えると、その第一変分は $-\int\langle D_{t}\dot c,\partial_{s}c\rangle dt$ になり、測地線はちょうど $E$ の臨界点である（ラグランジュ力学で、ラグランジアンを運動エネルギー $\frac12g(\dot x,\dot x)$ としたときのオイラー–ラグランジュ方程式が測地線の方程式）。測地流 $\mathcal{G}$ は、計量で $TM\cong T^{*}M$ と同一視すると、ハミルトニアン $H=\frac12|\xi|^{2}$ のハミルトン流になる（シンプレクティック幾何の系列で扱う予定）。比喩で言えば、測地線は「曲がった世界で、ハンドルを切らずに進んだ道」で、局所的には最短の道である。ただし大域的には最短とは限らない（球面で、大円を半周より長く進むと、反対側を回る方が短い）。

**補足.** 二階微分方程式としての測地線の方程式は、2 点を結ぶ境界値問題としては一般に一意でない（球面の対蹠点を結ぶ大円は無数にある）。最短性が崩れる点（共役点・切断点）の研究は、曲率と大域的な位相を結ぶ比較定理（ボネ–マイヤーズ、カルタン–アダマールなど）につながる。
:::

## 問題 {#riem:sec-gd-problems}

::: problem {#riem:prob-gd-sphere}
単位球面 $S^{n}\subset\mathbb{R}^{n+1}$ で、$p\in S^{n}$ と単位ベクトル $u\in T_{p}S^{n}$（$u\perp p$）について、$\gamma(t)=\cos t\,p+\sin t\,u$ が測地線であることを示せ。これから $\exp_{p}$ が $T_{p}S^{n}$ 全体で定義され、$\exp_{p}(v)=\cos|v|\,p+\sin|v|\,v/|v|$（$v\neq0$）であることを導け。
:::

::: solution
$\gamma$ は $S^{n}$ 上の曲線（$|\gamma|^{2}=\cos^{2}t+\sin^{2}t=1$、$p\perp u$）。\ref{riem:submanifold-levi-civita} を曲線に沿って使うと、$D_{t}\dot\gamma=(\ddot\gamma)^{\top}$。$\ddot\gamma=-\gamma$ は法ベクトル（$\gamma$ での法空間は $\gamma$ で張られる）なので、接成分は $0$。よって測地線。$\dot\gamma(0)=u$ で、$\mathbb{R}$ 全体で定義される。\ref{riem:geodesic-existence.3} から $\gamma_{v}(t)=\gamma_{u}(|v|t)$（$u=v/|v|$）で、$t=1$ として式が得られる。
:::

::: problem {#riem:prob-gd-injectivity-radius}
前問の $S^{n}$ で、$\exp_{p}$ が $B(0,\varepsilon)$ 上で単射になる最大の $\varepsilon$ は $\pi$ であることを示せ。
:::

::: solution
$|v|=\pi$ なら $\exp_{p}(v)=-p$ で、$|v|=\pi$ の $v$ はすべて $-p$ に移るので、$\varepsilon>\pi$ では単射でない。$|v|,|v'|<\pi$ で $\exp_{p}(v)=\exp_{p}(v')$ とすると、$p$ との内積から $\cos|v|=\cos|v'|$、$[0,\pi)$ で $\cos$ は単射なので $|v|=|v'|$。$v\neq0$ なら $\sin|v|\neq0$ で、$p$ に直交する成分を比べて $v/|v|=v'/|v'|$、よって $v=v'$。
:::
