# 曲率 {#riem:page-curvature keywords="Riemann curvature tensor R(X,Y)Z, tensoriality, coordinate components, symmetries of the curvature tensor, first Bianchi identity, pair symmetry, sectional curvature, Ricci curvature, scalar curvature, constant curvature, Gauss equation for submanifolds of Euclidean space, curvature of the sphere and hyperbolic plane"}

曲面論では、ガウス曲率が第一基本形式だけで決まること（驚異の定理）を見た。一般のリーマン多様体では、外側の空間がないので、曲率はレビ–チビタ接続から直接定義する：二つの方向の共変微分が可換でない度合い $R(X,Y)Z=\nabla_{X}\nabla_{Y}Z-\nabla_{Y}\nabla_{X}Z-\nabla_{[X,Y]}Z$ である。このページでは、$R$ がテンソルであること、その対称性（ビアンキの第一恒等式と対の対称性）、断面曲率・リッチ曲率・スカラー曲率を定義する。最後に、$\mathbb{R}^{N}$ の部分多様体についてガウス方程式を示し、球面の断面曲率が $1$ であることを導き、上半平面の断面曲率が $-1$ であることを計算する。

## 記法と定義の確認 {#riem:sec-cv-notation}

::: notation
- レビ–チビタ接続とコシュールの公式は \ref{riem:levi-civita}、テンソル性の補題は \ref{riem:tensoriality-lemma}、部分多様体のガウスの公式と第二基本形式は \ref{riem:submanifold-levi-civita}。
- 以下、$(M,g)$ はリーマン多様体、$\nabla$ はそのレビ–チビタ接続、$\langle\ ,\ \rangle=g$。ヤコビ恒等式 $[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]=0$ は \ref{mfd:lie-bracket-properties}。
:::

## 曲率テンソル {#riem:sec-cv-tensor}

::: definition 曲率テンソル {#riem:curvature-tensor keywords="Riemann curvature tensor R(X,Y)Z = nabla_X nabla_Y Z - nabla_Y nabla_X Z - nabla_[X,Y] Z; R(X,Y,Z,W) = <R(X,Y)Z, W>; components R^l_kij" index="曲率テンソル（リーマン多様体）|きょくりつてんそるりーまんたようたい, リーマン曲率テンソル|りーまんきょくりつてんそる"}
$X,Y,Z,W\in\mathfrak{X}(M)$ について
$$
R(X,Y)Z\defeq\nabla_{X}\nabla_{Y}Z-\nabla_{Y}\nabla_{X}Z-\nabla_{[X,Y]}Z,\qquad R(X,Y,Z,W)\defeq\langle R(X,Y)Z,W\rangle
$$
と定め、$R$ を**曲率テンソル**という。座標では $R(\partial_{i},\partial_{j})\partial_{k}=\sum_{l}R^{l}{}_{kij}\partial_{l}$ と書く。
:::

::: proposition 曲率のテンソル性と座標表示 {#riem:curvature-tensorial keywords="R is C^infinity-trilinear hence a tensor; R^l_kij = d_i Gamma^l_jk - d_j Gamma^l_ik + sum_m (Gamma^m_jk Gamma^l_im - Gamma^m_ik Gamma^l_jm)" index="曲率テンソルの成分|きょくりつてんそるのせいぶん"}
1. $R(X,Y)Z$ は $X,Y,Z$ のそれぞれについて $C^{\infty}(M)$ 線形で、したがってテンソル場である。
2. $R^{l}{}_{kij}=\partial_{i}\Gamma^{l}_{jk}-\partial_{j}\Gamma^{l}_{ik}+\sum_{m}\bigl(\Gamma^{m}_{jk}\Gamma^{l}_{im}-\Gamma^{m}_{ik}\Gamma^{l}_{jm}\bigr)$。
:::

::: proof
**1.** $X$ について：$R(fX,Y)Z=f\nabla_{X}\nabla_{Y}Z-\nabla_{Y}(f\nabla_{X}Z)-\nabla_{f[X,Y]-(Yf)X}Z=f\nabla_{X}\nabla_{Y}Z-(Yf)\nabla_{X}Z-f\nabla_{Y}\nabla_{X}Z-f\nabla_{[X,Y]}Z+(Yf)\nabla_{X}Z=fR(X,Y)Z$（$[fX,Y]=f[X,Y]-(Yf)X$）。$Y$ については、$R(X,Y)=-R(Y,X)$（定義から）なので同じ。$Z$ について：
$$
\nabla_{X}\nabla_{Y}(fZ)=\nabla_{X}\bigl((Yf)Z+f\nabla_{Y}Z\bigr)=(XYf)Z+(Yf)\nabla_{X}Z+(Xf)\nabla_{Y}Z+f\nabla_{X}\nabla_{Y}Z.
$$
$X,Y$ を入れ替えたものを引き、$\nabla_{[X,Y]}(fZ)=([X,Y]f)Z+f\nabla_{[X,Y]}Z$ を引くと、$f$ の微分を含む項は $(XYf-YXf-[X,Y]f)Z=0$ となり、$fR(X,Y)Z$ が残る。\ref{riem:tensoriality-lemma} からテンソル場。

**2.** $[\partial_{i},\partial_{j}]=0$ なので $R(\partial_{i},\partial_{j})\partial_{k}=\nabla_{i}(\sum_{m}\Gamma^{m}_{jk}\partial_{m})-\nabla_{j}(\sum_{m}\Gamma^{m}_{ik}\partial_{m})$。$\nabla_{i}(\Gamma^{m}_{jk}\partial_{m})=(\partial_{i}\Gamma^{m}_{jk})\partial_{m}+\Gamma^{m}_{jk}\sum_{l}\Gamma^{l}_{im}\partial_{l}$ を代入し、$\partial_{l}$ の係数を集めればよい。
:::

曲面論の \ref{surf:curvature-tensor} の $R^{m}{}_{ijl}$ は、2 の式と比べると $R(\partial_{l},\partial_{j})\partial_{i}$ の $\partial_{m}$ 成分、つまりここでの $R^{m}{}_{ilj}$ にあたる（$\Gamma$ の下の添字の対称性を使う）。

::: proposition 曲率テンソルの対称性 {#riem:curvature-symmetries keywords="R(X,Y,Z,W) = -R(Y,X,Z,W) = -R(X,Y,W,Z); first Bianchi identity R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0; pair symmetry R(X,Y,Z,W) = R(Z,W,X,Y)" index="ビアンキの恒等式|びあんきのこうとうしき, 第一ビアンキ恒等式|だいいちびあんきこうとうしき, 曲率テンソルの対称性|きょくりつてんそるのたいしょうせい"}
1. $R(X,Y,Z,W)=-R(Y,X,Z,W)$。
2. $R(X,Y,Z,W)=-R(X,Y,W,Z)$。
3. （**ビアンキの第一恒等式**）$R(X,Y)Z+R(Y,Z)X+R(Z,X)Y=0$。
4. $R(X,Y,Z,W)=R(Z,W,X,Y)$。
:::

::: proof
**1.** 定義から（$[Y,X]=-[X,Y]$）。

**2.** 【主張：$\langle R(X,Y)Z,Z\rangle=0$】計量との両立から $\langle\nabla_{X}\nabla_{Y}Z,Z\rangle=X\langle\nabla_{Y}Z,Z\rangle-\langle\nabla_{Y}Z,\nabla_{X}Z\rangle=\frac12XY|Z|^{2}-\langle\nabla_{Y}Z,\nabla_{X}Z\rangle$（$\langle\nabla_{Y}Z,Z\rangle=\frac12Y|Z|^{2}$）。$X,Y$ を入れ替えたものを引き、$\langle\nabla_{[X,Y]}Z,Z\rangle=\frac12[X,Y]|Z|^{2}$ を引くと $\frac12(XY-YX-[X,Y])|Z|^{2}=0$ と、互いに打ち消す内積の項が残るので $0$。$Z$ を $Z+W$ に替えて展開すれば、$R(X,Y,Z,W)+R(X,Y,W,Z)=0$。

**3.** 三つの項の定義を並べ、ねじれのなさ $\nabla_{A}B-\nabla_{B}A=[A,B]$ を使って二つずつまとめると
$$
\sum_{\mathrm{cyc}}R(X,Y)Z=\nabla_{X}[Y,Z]+\nabla_{Y}[Z,X]+\nabla_{Z}[X,Y]-\nabla_{[Y,Z]}X-\nabla_{[Z,X]}Y-\nabla_{[X,Y]}Z
$$
（$\nabla_{X}\nabla_{Y}Z$ は $R(X,Y)Z$ から、$-\nabla_{X}\nabla_{Z}Y$ は $R(Z,X)Y$ から来て、和が $\nabla_{X}[Y,Z]$）。もう一度ねじれのなさを使うと、右辺は $[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]$ で、ヤコビ恒等式から $0$。

**4.** $R(X,Y,Z,W)$ を $R_{XYZW}$ と略す。3 を内積で書いた式を、$(X,Y,Z;W)$, $(Y,Z,W;X)$, $(Z,W,X;Y)$, $(W,X,Y;Z)$ の四通りに書いて足す：
$$
\begin{aligned}
&R_{XYZW}+R_{YZXW}+R_{ZXYW}=0,\qquad R_{YZWX}+R_{ZWYX}+R_{WYZX}=0,\\
&R_{ZWXY}+R_{WXZY}+R_{XZWY}=0,\qquad R_{WXYZ}+R_{XYWZ}+R_{YWXZ}=0.
\end{aligned}
$$
1・2 から $R_{XYWZ}=-R_{XYZW}$, $R_{YZXW}=-R_{YZWX}$, $R_{ZWYX}=-R_{ZWXY}$, $R_{WXZY}=-R_{WXYZ}$ なので、これら 8 項は打ち消し合う。残りは $R_{ZXYW}+R_{XZWY}+R_{WYZX}+R_{YWXZ}=0$ で、1・2 から $R_{XZWY}=R_{ZXYW}$, $R_{YWXZ}=R_{WYZX}$ なので $2R_{ZXYW}+2R_{WYZX}=0$。よって $R_{ZXYW}=-R_{WYZX}=R_{YWZX}$。文字を付け替えれば（$Z\to X$, $X\to Y$, $Y\to Z$, $W\to W$）$R_{XYZW}=R_{ZWXY}$。

::: hypcheck
- 2 では計量との両立を、3 ではねじれのなさを使った。一般の接続では 2・3・4 は成り立たない。
:::
:::

## 断面曲率・リッチ曲率・スカラー曲率 {#riem:sec-cv-sectional}

::: definition 断面曲率 {#riem:sectional-curvature keywords="sectional curvature K(sigma) = R(X,Y,Y,X)/(|X|^2|Y|^2 - <X,Y>^2) of a 2-plane sigma spanned by X, Y; independent of the basis" index="断面曲率|だんめんきょくりつ"}
$T_{m}M$ の 2 次元部分空間 $\sigma$ と、その基底 $X,Y$ について
$$
K(\sigma)\defeq\frac{R(X,Y,Y,X)}{|X|^{2}|Y|^{2}-\langle X,Y\rangle^{2}}
$$
を $\sigma$ の**断面曲率**という。これは基底の選び方によらない。
:::

::: proof
分母は $X,Y$ が一次独立なので正（コーシー–シュワルツの不等式の等号条件）。別の基底 $X'=aX+bY$, $Y'=cX+dY$ について、$Q(X,Y)\defeq R(X,Y,Y,X)$ は、1・2 から $X,Y$ について交代的な双線形形式 $(X,Y)\mapsto R(X,Y,\cdot,\cdot)$ を「同じ組」に二回使ったものなので、$R(X',Y',Y',X')=(ad-bc)^{2}R(X,Y,Y,X)$（$R(X',Y')=(ad-bc)R(X,Y)$ を前後の対に一回ずつ使う）。分母も $|X'|^{2}|Y'|^{2}-\langle X',Y'\rangle^{2}=(ad-bc)^{2}(|X|^{2}|Y|^{2}-\langle X,Y\rangle^{2})$（グラム行列式の基底変換）。比は変わらない。
:::

2 次元のリーマン多様体では $T_{m}M$ 自身が唯一の 2 次元部分空間で、$K(T_{m}M)$ を**ガウス曲率**という。曲面片の第一基本形式については、\ref{surf:theorema-egregium} の $K=R_{1221}/\det(g_{ij})$ と一致する（上の対応で $R_{1221}$ は $R(\partial_{1},\partial_{2},\partial_{2},\partial_{1})$）。

::: fact 断面曲率は曲率テンソルを決める {#riem:sectional-determines-curvature keywords="the sectional curvatures at a point determine the curvature tensor at that point" index="断面曲率と曲率テンソル|だんめんきょくりつときょくりつてんそる"}
各点で、すべての 2 次元部分空間の断面曲率が分かれば、その点の曲率テンソルが決まる。（\ref{riem:curvature-symmetries} の 1〜4 を満たす 4 重線形形式は、$Q(X,Y)=R(X,Y,Y,X)$ の値から分極によって復元できる。多くの教科書、たとえばドゥ・カルモ『Riemannian Geometry』第 4 章に証明がある。）
:::

::: definition リッチ曲率とスカラー曲率 {#riem:ricci-scalar keywords="Ricci curvature Ric(Y,Z) = trace of X -> R(X,Y)Z, symmetric; scalar curvature as the trace of Ric; Einstein metric" index="リッチ曲率|りっちきょくりつ, リッチテンソル|りっちてんそる, スカラー曲率|すからーきょくりつ, アインシュタイン計量|あいんしゅたいんけいりょう"}
$Y,Z\in T_{m}M$ について、線形写像 $X\mapsto R(X,Y)Z$ のトレースを $\mathrm{Ric}(Y,Z)$ と書き、**リッチ曲率**という。正規直交基底 $(e_{i})$ で $\mathrm{Ric}(Y,Z)=\sum_{i}R(e_{i},Y,Z,e_{i})$。$S\defeq\sum_{i}\mathrm{Ric}(e_{i},e_{i})$ を**スカラー曲率**という。$\mathrm{Ric}=\lambda g$（$\lambda$ は定数）となる計量を**アインシュタイン計量**という。
:::

\ref{riem:curvature-symmetries.4} から $\mathrm{Ric}(Y,Z)=\sum_{i}R(e_{i},Y,Z,e_{i})=\sum_{i}R(Z,e_{i},e_{i},Y)=\sum_{i}R(e_{i},Z,Y,e_{i})=\mathrm{Ric}(Z,Y)$（2 回目の等号で 1・2 を使って符号を二回反転）なので、$\mathrm{Ric}$ は対称である。単位ベクトル $Y$ について $\mathrm{Ric}(Y,Y)=\sum_{i}K(\mathrm{span}(e_{i},Y))$（$e_{1}=Y$ ととり、$i\ge2$ について和をとる）で、リッチ曲率は $Y$ を含む平面の断面曲率の和である。

::: proposition 定曲率の曲率テンソル {#riem:constant-curvature keywords="the tensor R(X,Y)Z = kappa (<Y,Z> X - <X,Z> Y) has all sectional curvatures kappa, Ric = (n-1) kappa g, S = n(n-1) kappa" index="定曲率|ていきょくりつ, 定断面曲率|ていだんめんきょくりつ"}
定数 $\kappa$ について $R(X,Y)Z=\kappa(\langle Y,Z\rangle X-\langle X,Z\rangle Y)$ が成り立つなら、すべての断面曲率は $\kappa$ で、$\mathrm{Ric}=(n-1)\kappa g$, $S=n(n-1)\kappa$ である。
:::

::: proof
$R(X,Y,Y,X)=\kappa(\langle Y,Y\rangle\langle X,X\rangle-\langle X,Y\rangle^{2})$ なので断面曲率は $\kappa$。$\mathrm{Ric}(Y,Z)=\sum_{i}\kappa(\langle Y,Z\rangle\langle e_{i},e_{i}\rangle-\langle e_{i},Z\rangle\langle Y,e_{i}\rangle)=\kappa(n\langle Y,Z\rangle-\langle Y,Z\rangle)$。トレースをとって $S=n(n-1)\kappa$。
:::

\ref{riem:sectional-determines-curvature} から、逆に、すべての断面曲率が $\kappa$ ならこの形になることが知られている（$n\ge2$）。

## ガウス方程式と例 {#riem:sec-cv-gauss}

::: theorem ガウス方程式 {#riem:gauss-equation keywords="Gauss equation for a submanifold of Euclidean space: R(X,Y,Z,W) = <II(X,W), II(Y,Z)> - <II(X,Z), II(Y,W)>; sectional curvature from the second fundamental form" index="ガウス方程式（部分多様体）|がうすほうていしきぶぶんたようたい"}
$M\subset\mathbb{R}^{N}$ を誘導計量をもつ部分多様体、$\mathrm{II}$ をその第二基本形式（\ref{riem:submanifold-levi-civita.3}）とする。
$$
R(X,Y,Z,W)=\langle\mathrm{II}(X,W),\mathrm{II}(Y,Z)\rangle-\langle\mathrm{II}(X,Z),\mathrm{II}(Y,W)\rangle.
$$
とくに $K(\mathrm{span}(X,Y))=\dfrac{\langle\mathrm{II}(X,X),\mathrm{II}(Y,Y)\rangle-|\mathrm{II}(X,Y)|^{2}}{|X|^{2}|Y|^{2}-\langle X,Y\rangle^{2}}$。
:::

::: proof
\ref{riem:submanifold-levi-civita} の記法で、$\mathbb{R}^{N}$ の微分 $D$ は可換：$D_{X}D_{Y}Z-D_{Y}D_{X}Z-D_{[X,Y]}Z=0$（$Z$ の成分ごとに、$XYf-YXf-[X,Y]f=0$）。【主張：$\langle\nabla_{X}\nabla_{Y}Z,W\rangle=\langle D_{X}D_{Y}Z,W\rangle+\langle\mathrm{II}(Y,Z),\mathrm{II}(X,W)\rangle$】ガウスの公式から $\nabla_{Y}Z=D_{Y}Z-\mathrm{II}(Y,Z)$。$W$ は接ベクトルなので $\langle\nabla_{X}\nabla_{Y}Z,W\rangle=\langle D_{X}(\nabla_{Y}Z),W\rangle=\langle D_{X}D_{Y}Z,W\rangle-\langle D_{X}(\mathrm{II}(Y,Z)),W\rangle$。$\langle\mathrm{II}(Y,Z),W\rangle=0$ を $X$ で微分すると $\langle D_{X}(\mathrm{II}(Y,Z)),W\rangle=-\langle\mathrm{II}(Y,Z),D_{X}W\rangle=-\langle\mathrm{II}(Y,Z),\mathrm{II}(X,W)\rangle$（$\mathrm{II}(Y,Z)$ は法ベクトルなので $D_{X}W$ の法成分とだけ内積が残る）。主張が従う。$X,Y$ を入れ替えたものを引き、$\langle\nabla_{[X,Y]}Z,W\rangle=\langle D_{[X,Y]}Z,W\rangle$ を引くと、$D$ の項は可換性から消え、式が得られる。断面曲率の式は $Z=Y$, $W=X$ と $\mathrm{II}$ の対称性から。
:::

::: example 球面と上半平面の曲率 {#riem:curvature-examples keywords="Euclidean space is flat; the unit sphere has constant sectional curvature 1; the hyperbolic upper half plane has curvature -1" index="球面の曲率|きゅうめんのきょくりつ, 双曲平面の曲率|そうきょくへいめんのきょくりつ, 平坦|へいたん"}
1. $\mathbb{R}^{n}$ のユークリッド計量では $\Gamma^{k}_{ij}=0$ なので $R=0$（**平坦**）。
2. 単位球面 $S^{n}$（$n\ge2$）の標準計量の断面曲率はすべて $1$ である。
3. 上半平面 $\mathbb{H}^{2}$ の計量 $(dx^{2}+dy^{2})/y^{2}$ のガウス曲率は $-1$ である。
:::

::: proof
**2.** \ref{riem:prob-lc-sphere-second-form} から $\mathrm{II}(X,Y)=-\langle X,Y\rangle p$（$|p|=1$）。ガウス方程式から $R(X,Y,Y,X)=\langle X,X\rangle\langle Y,Y\rangle-\langle X,Y\rangle^{2}$ で、断面曲率は $1$。

**3.** $g_{ij}=\delta_{ij}/y^{2}$ で、0 でない微分は $\partial_{y}g_{11}=\partial_{y}g_{22}=-2/y^{3}$。\ref{riem:levi-civita} の公式から、0 でないクリストッフェル記号は $\Gamma^{1}_{12}=\Gamma^{1}_{21}=-\frac1y$, $\Gamma^{2}_{11}=\frac1y$, $\Gamma^{2}_{22}=-\frac1y$（たとえば $\Gamma^{2}_{11}=\frac12g^{22}(-\partial_{y}g_{11})=\frac{y^{2}}{2}\cdot\frac{2}{y^{3}}$）。$\partial_{1}=\partial_{x}$, $\partial_{2}=\partial_{y}$ として
$$
\nabla_{2}\partial_{2}=-\tfrac1y\partial_{2},\quad\nabla_{1}\partial_{2}=\nabla_{2}\partial_{1}=-\tfrac1y\partial_{1},\quad\nabla_{1}\nabla_{2}\partial_{2}=-\tfrac1y\nabla_{1}\partial_{2}=\tfrac{1}{y^{2}}\partial_{1},
$$
$$
\nabla_{2}\nabla_{1}\partial_{2}=\nabla_{2}\bigl(-\tfrac1y\partial_{1}\bigr)=\tfrac{1}{y^{2}}\partial_{1}-\tfrac1y\nabla_{2}\partial_{1}=\tfrac{2}{y^{2}}\partial_{1}.
$$
よって $R(\partial_{1},\partial_{2})\partial_{2}=-\frac{1}{y^{2}}\partial_{1}$、$R(\partial_{1},\partial_{2},\partial_{2},\partial_{1})=-\frac{1}{y^{2}}g_{11}=-\frac{1}{y^{4}}$。分母は $g_{11}g_{22}-g_{12}^{2}=\frac{1}{y^{4}}$ なので $K=-1$。
:::

::: supplement
**高い視点：曲率は接続の「微分の非可換性」、ホロノミーの無限小版.** 曲率テンソルは、ベクトル束の接続一般について同じ式 $R^{\nabla}(X,Y)=[\nabla_{X},\nabla_{Y}]-\nabla_{[X,Y]}$ で定義でき（$\mathrm{End}(E)$ 値の 2 形式）、局所フレームでは $\Omega=d\omega+\omega\wedge\omega$（**カルタンの構造方程式**）と書ける。曲率が $0$ であることは、局所的に平行なフレームが存在すること、つまり平行移動が（局所的には）道によらないことと同値であることが知られている。小さな平行四辺形を一周する平行移動は恒等写像から $-R(X,Y)$ の分だけずれる。球面の緯線を一周したときの回転（\ref{surf:parallel-latitude}）は、このずれを有限の大きさで見たものである。比喩で言えば、接続が「隣への橋」なら、曲率は「橋を四本渡って一周したとき、元の場所でものが回っている量」である。

**補足.** ビアンキの第二恒等式 $(\nabla_{X}R)(Y,Z)+(\nabla_{Y}R)(Z,X)+(\nabla_{Z}R)(X,Y)=0$ も成り立つ（ここでは扱わない）。これをトレースすると縮約したビアンキ恒等式 $\operatorname{div}\mathrm{Ric}=\frac12dS$ が得られ、一般相対論のアインシュタイン方程式の左辺 $\mathrm{Ric}-\frac12Sg$ の発散が $0$ であることの根拠になる。
:::

## 問題 {#riem:sec-cv-problems}

::: problem {#riem:prob-cv-two-dim}
2 次元のリーマン多様体では、$R(X,Y)Z=K(\langle Y,Z\rangle X-\langle X,Z\rangle Y)$（$K$ はガウス曲率）が成り立つことを示せ。とくに $\mathrm{Ric}=Kg$, $S=2K$。
:::

::: solution
正規直交基底 $e_{1},e_{2}$ をとる。1・2 から、$R(X,Y,Z,W)$ は $(X,Y)$ と $(Z,W)$ のそれぞれで交代的で、2 次元では交代的な双線形形式は行列式の定数倍なので、$R(X,Y,Z,W)=c\det(X,Y)\det(Z,W)$（$\det$ は基底 $e_{1},e_{2}$ での成分の行列式）。$c=R(e_{1},e_{2},e_{1},e_{2})=-R(e_{1},e_{2},e_{2},e_{1})=-K$。一方 $\langle K(\langle Y,Z\rangle X-\langle X,Z\rangle Y),W\rangle=K(\langle Y,Z\rangle\langle X,W\rangle-\langle X,Z\rangle\langle Y,W\rangle)=-K\det(X,Y)\det(Z,W)$（2 次元のビネ–コーシーの公式 $\det(X,Y)\det(Z,W)=\langle X,Z\rangle\langle Y,W\rangle-\langle X,W\rangle\langle Y,Z\rangle$）。両者が一致する。後半は \ref{riem:constant-curvature} の証明と同じ計算（各点で $\kappa=K$）。
:::

::: problem {#riem:prob-cv-cylinder}
円柱 $S^{1}\times\mathbb{R}\subset\mathbb{R}^{3}$（半径 $1$）の誘導計量のガウス曲率は $0$ であることを、ガウス方程式から示せ。
:::

::: solution
点 $p=(\cos\theta,\sin\theta,z)$ での単位法ベクトルは $\nu=(\cos\theta,\sin\theta,0)$。接ベクトル $X=\partial_{\theta}=(-\sin\theta,\cos\theta,0)$, $Y=\partial_{z}=(0,0,1)$ について $D_{X}X=(-\cos\theta,-\sin\theta,0)=-\nu$, $D_{X}Y=D_{Y}X=D_{Y}Y=0$。よって $\mathrm{II}(X,X)=-\nu$, $\mathrm{II}(X,Y)=0$, $\mathrm{II}(Y,Y)=0$ で、ガウス方程式から $R(X,Y,Y,X)=\langle-\nu,0\rangle-0=0$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{riem:sec-cv-exercises} にまとめた。
