# 演習：リーマン幾何 {#riem:page-exercises-riemannian keywords="exercises, Riemannian Geometry"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な計量（球面・上半平面・回転面型の計量・積計量など）での計算と、いくつかのページの結果を組み合わせる問題である。各節の中は、基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#riem:sec-exrg-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
- 曲率テンソルは $R(X,Y)Z=\nabla_{X}\nabla_{Y}Z-\nabla_{Y}\nabla_{X}Z-\nabla_{[X,Y]}Z$、$R(X,Y,Z,W)=\langle R(X,Y)Z,W\rangle$ で、断面曲率は $K(\sigma)=R(X,Y,Y,X)/(|X|^{2}|Y|^{2}-\langle X,Y\rangle^{2})$（\ref{riem:curvature-tensor}, \ref{riem:sectional-curvature}）。この約束で単位球面の断面曲率は $1$ である。
- 余微分は $\delta=(-1)^{n(k+1)+1}\star d\star$（$k$ 形式の上）、ラプラシアンは $\Delta=d\delta+\delta d$ で、$\mathbb{R}^{n}$ の関数では $\Delta f=-\sum_{i}\partial_{i}^{2}f$（\ref{riem:codifferential}, \ref{riem:laplace-beltrami}）。
- 上半平面 $\mathbb{H}^{2}$ の点を $z=x+iy$（$y>0$）とも書き、計量は $(dx^{2}+dy^{2})/y^{2}$。そのクリストッフェル記号で $0$ でないものは $\Gamma^{1}_{12}=\Gamma^{1}_{21}=-\frac1y$, $\Gamma^{2}_{11}=\frac1y$, $\Gamma^{2}_{22}=-\frac1y$（\ref{riem:curvature-examples} の証明）。
:::

## リーマン計量と距離 {#riem:sec-rm-exercises}

対応するページ：\ref{riem:page-riemannian-metrics}

::: problem ★ 基本：球面座標 {#riem:ex-rm-1}
単位球面 $S^{2}\subset\mathbb{R}^{3}$ の球面座標 $f(\theta,\varphi)\defeq(\sin\theta\cos\varphi,\sin\theta\sin\varphi,\cos\theta)$（$0<\theta<\pi$, $0<\varphi<2\pi$）について、次を示せ。
1. 誘導計量は $d\theta^{2}+\sin^{2}\theta\,d\varphi^{2}$ で、この座標が正になる向きでの体積形式は $\sin\theta\,d\theta\wedge d\varphi$。
2. 緯線 $\varphi\mapsto f(\theta_{0},\varphi)$（$0\le\varphi\le2\pi$）の長さは $2\pi\sin\theta_{0}$。
3. 高さ関数 $h\defeq x_{3}\restriction S^{2}$ の勾配は、点 $p$ で $\operatorname{grad}h=e_{3}-\langle e_{3},p\rangle p$（$e_{3}=(0,0,1)$）で、球面座標では $-\sin\theta\,\partial_{\theta}$。とくに $|\operatorname{grad}h|^{2}=1-h^{2}$。
:::

::: solution
**1.** $f_{\theta}=(\cos\theta\cos\varphi,\cos\theta\sin\varphi,-\sin\theta)$, $f_{\varphi}=(-\sin\theta\sin\varphi,\sin\theta\cos\varphi,0)$ である。\ref{riem:pullback-metric} から誘導計量の成分は $\mathbb{R}^{3}$ の内積で
$$
g_{\theta\theta}=|f_{\theta}|^{2}=1,\qquad g_{\theta\varphi}=\langle f_{\theta},f_{\varphi}\rangle=0,\qquad g_{\varphi\varphi}=|f_{\varphi}|^{2}=\sin^{2}\theta.
$$
$\det(g_{ij})=\sin^{2}\theta$ で、$0<\theta<\pi$ では $\sin\theta>0$ なので、\ref{riem:volume-form} から $\mathrm{vol}_{g}=\sin\theta\,d\theta\wedge d\varphi$。

**2.** 曲線 $c(\varphi)=f(\theta_{0},\varphi)$ は $[0,2\pi]$ 上で滑らかな $\mathbb{R}^{3}$ 値の曲線で、$S^{2}$ に値をとる。誘導計量での速さは $\mathbb{R}^{3}$ のノルム $|c'(\varphi)|=|f_{\varphi}(\theta_{0},\varphi)|=\sin\theta_{0}$ なので、\ref{riem:length-distance} から $L(c)=\int_{0}^{2\pi}\sin\theta_{0}\,d\varphi=2\pi\sin\theta_{0}$。

**3.** $h$ は線形関数 $x_{3}$ の制限なので、$X\in T_{p}S^{2}$ について $Xh=\langle X,e_{3}\rangle$（方向微分）。$X\perp p$ なので $\langle X,e_{3}\rangle=\langle X,e_{3}-\langle e_{3},p\rangle p\rangle$ で、$e_{3}-\langle e_{3},p\rangle p$ は $p$ に直交するから $T_{p}S^{2}$ に属する。\ref{riem:musical-gradient} の特徴づけ $g(\operatorname{grad}h,X)=Xh$ と内積の非退化性から $\operatorname{grad}h=e_{3}-\langle e_{3},p\rangle p$。その長さの 2 乗は $1-2\langle e_{3},p\rangle^{2}+\langle e_{3},p\rangle^{2}=1-h(p)^{2}$。

座標では $h=\cos\theta$, $g^{\theta\theta}=1$, $g^{\theta\varphi}=0$ なので $\operatorname{grad}h=\sum g^{ij}\partial_{j}h\,\partial_{i}=-\sin\theta\,\partial_{\theta}$。実際 $-\sin\theta\,f_{\theta}=(-\sin\theta\cos\theta\cos\varphi,-\sin\theta\cos\theta\sin\varphi,\sin^{2}\theta)=e_{3}-\cos\theta\,f$ で、前半の式と一致する。
:::

::: problem ★★ 標準：上半平面の等長写像 {#riem:ex-rm-2}
1. 等長写像 $F\colon(M,g)\to(N,h)$（$M,N$ は連結）はリーマン距離を保つ：$d_{N}(F(p),F(q))=d_{M}(p,q)$ であることを示せ。
2. $\mathbb{H}^{2}$ の上の写像 $T_{b}(z)\defeq z+b$（$b\in\mathbb{R}$）、$S_{\lambda}(z)\defeq\lambda z$（$\lambda>0$）、$J(z)\defeq-1/z$ は、いずれも $\mathbb{H}^{2}$ の等長写像であることを示せ。
:::

::: solution
**1.** $\gamma$ を $M$ の区分的に滑らかな曲線とすると、$F\circ\gamma$ も区分的に滑らかで、各小区間で $|(F\circ\gamma)'(t)|_{h}=|dF(\gamma'(t))|_{h}=|\gamma'(t)|_{g}$（$F^{*}h=g$）。よって $L(F\circ\gamma)=L(\gamma)$ で、$p$ から $q$ への曲線の長さの下限をとると $d_{N}(F(p),F(q))\le d_{M}(p,q)$。$F^{-1}$ も滑らかで、$(F^{-1})^{*}g=(F^{-1})^{*}F^{*}h=h$ なので等長写像であり、同じ議論を $F^{-1}$ に使えば逆向きの不等式が得られる。

**2.** $\mathbb{H}^{2}=\{z:\operatorname{Im}z>0\}\subset\mathbb{C}=\mathbb{R}^{2}$ とみなすと、計量は $g_{z}(v,w)=\langle v,w\rangle/(\operatorname{Im}z)^{2}$（$\langle\ ,\ \rangle$ は $\mathbb{R}^{2}$ の内積）。対称双線形形式は 2 次形式で決まる（$g(v,w)=\frac14(g(v+w,v+w)-g(v-w,v-w))$）ので、各写像 $F$ について、$F$ が $\mathbb{H}^{2}$ からそれ自身への微分同相写像であることと、$|dF_{z}v|^{2}/(\operatorname{Im}F(z))^{2}=|v|^{2}/(\operatorname{Im}z)^{2}$ を示せばよい。

- $T_{b}$：逆写像 $T_{-b}$ をもつ微分同相写像で、$dT_{b}=\mathrm{id}$, $\operatorname{Im}T_{b}(z)=\operatorname{Im}z$。
- $S_{\lambda}$：逆写像 $S_{1/\lambda}$ をもち、$dS_{\lambda}=\lambda\,\mathrm{id}$, $\operatorname{Im}S_{\lambda}(z)=\lambda\operatorname{Im}z$ なので、比は $\lambda^{2}|v|^{2}/(\lambda^{2}(\operatorname{Im}z)^{2})$。
- $J$：$J(z)=-\bar z/|z|^{2}$ なので $\operatorname{Im}J(z)=\operatorname{Im}z/|z|^{2}>0$ で、$J$ は $\mathbb{H}^{2}$ をそれ自身に写す。$J\circ J=\mathrm{id}$ なので微分同相写像。$J$ は正則で $J'(z)=1/z^{2}$ なので、コーシー–リーマンの関係式から実線形写像 $dJ_{z}$ は複素数 $1/z^{2}$ を掛ける写像で、$|dJ_{z}v|=|v|/|z|^{2}$。よって
$$
\frac{|dJ_{z}v|^{2}}{(\operatorname{Im}J(z))^{2}}=\frac{|v|^{2}/|z|^{4}}{(\operatorname{Im}z)^{2}/|z|^{4}}=\frac{|v|^{2}}{(\operatorname{Im}z)^{2}}.
$$
:::

::: problem ★★★ 発展：上半平面の 2 点の距離 {#riem:ex-rm-3}
$\mathbb{H}^{2}$ の 2 点 $-1+i$ と $1+i$ の距離が $2\log(1+\sqrt2)$ であることを示せ。とくに、この 2 点を結ぶ水平な線分（長さ $2$）は最短ではないことを確かめよ。
:::

::: solution
前問の写像を合成した $G\defeq J\circ T_{-\sqrt2}$, $G(z)=-1/(z-\sqrt2)$ は等長写像で、前問 1 から距離を保つ。$w\neq0$ について $-1/w=-\bar w/|w|^{2}$ を使って計算する。

$1+i-\sqrt2=(1-\sqrt2)+i$ で、$|(1-\sqrt2)+i|^{2}=4-2\sqrt2=2\sqrt2(\sqrt2-1)$ なので
$$
G(1+i)=\frac{(\sqrt2-1)+i}{4-2\sqrt2}=\frac{1}{2\sqrt2}+\frac{i}{4-2\sqrt2}.
$$
$-1+i-\sqrt2=(-1-\sqrt2)+i$ で、$|(-1-\sqrt2)+i|^{2}=4+2\sqrt2=2\sqrt2(\sqrt2+1)$ なので
$$
G(-1+i)=\frac{(1+\sqrt2)+i}{4+2\sqrt2}=\frac{1}{2\sqrt2}+\frac{i}{4+2\sqrt2}.
$$
二つの像は同じ鉛直線 $\operatorname{Re}z=\frac{1}{2\sqrt2}$ の上にある。さらに等長写像 $T_{-1/(2\sqrt2)}$ で虚軸上の点 $ia$, $ib$（$a=\frac{1}{4+2\sqrt2}<b=\frac{1}{4-2\sqrt2}$）に移し、\ref{riem:prob-rm-hyperbolic-vertical} を使うと
$$
d(-1+i,1+i)=\log\frac{b}{a}=\log\frac{4+2\sqrt2}{4-2\sqrt2}=\log\frac{(2+\sqrt2)^{2}}{(2-\sqrt2)(2+\sqrt2)}=\log\frac{6+4\sqrt2}{2}=\log(3+2\sqrt2).
$$
$3+2\sqrt2=(1+\sqrt2)^{2}$ なので $d=2\log(1+\sqrt2)$。

水平な線分 $t\mapsto t+i$（$-1\le t\le1$）の長さは $\int_{-1}^{1}|1|/1\,dt=2$。一方 $e^{2}>(1+\sqrt2)^{2}$（$e>2.7>1+\sqrt2$ はたとえば $\sqrt2<1.42$ から）なので $2\log(1+\sqrt2)<2$ で、水平な線分は最短でない。
:::

## 接続と共変微分 {#riem:sec-cn-exercises}

対応するページ：\ref{riem:page-connections}

::: problem ★ 基本：直線束の平行移動 {#riem:ex-cn-1}
$M=\mathbb{R}^{2}\setminus\{0\}$ の自明な直線束 $E=M\times\mathbb{R}$ に、1 形式 $\omega\defeq(x\,dy-y\,dx)/(x^{2}+y^{2})$ を使って $\nabla_{X}s\defeq Xs+\omega(X)s$（$s\in C^{\infty}(M)=\Gamma(E)$）と定める。
1. $\nabla$ は接続で、フレーム $e=1$ に関する接続形式は $\omega$ であることを示せ。
2. 単位円 $\gamma(t)=(\cos t,\sin t)$ に沿った平行移動 $P_{0,2\pi}\colon E_{(1,0)}\to E_{(1,0)}$ を求めよ。また、$\nabla$ は標準的なファイバー計量 $\langle s,s'\rangle=ss'$ と両立しないことを確かめよ。
:::

::: solution
**1.** $A(X,s)\defeq\omega(X)s$ は $X$ についても $s$ についても $C^{\infty}(M)$ 線形なので、\ref{riem:trivial-connection} の接続 $X\mapsto Xs$ に加えた $\nabla$ は \ref{riem:connection-existence.3} から接続である。$\nabla_{X}1=\omega(X)\cdot1$ なので、\ref{riem:connection-form} の定義から接続形式は $\omega$。

**2.** $\gamma'(t)=(-\sin t,\cos t)$ なので $\omega(\gamma'(t))=\cos t\cdot\cos t-\sin t\cdot(-\sin t)=1$。\ref{riem:covariant-along-curve} の式から、$V(t)=v(t)\cdot1$ が平行であることは $v'+v=0$ と同値で、解は $v(t)=e^{-t}v(0)$。よって $P_{0,2\pi}$ は $e^{-2\pi}$ 倍の写像である（\ref{riem:parallel-transport}）。

$e=1$ は標準計量の正規直交フレームで、$1\times1$ の交代行列は $0$ だけなので、\ref{riem:metric-connection-properties.1} から、両立するには $\omega=0$ でなければならない。$\omega\neq0$ なので両立しない。実際、平行移動は長さを $e^{-2\pi}$ 倍に縮め、内積を保たない（同命題の 2 と整合する）。
:::

::: problem ★★ 標準：双対束の接続 {#riem:ex-cn-2}
ベクトル束 $E$ の接続 $\nabla$ について、双対束 $E^{*}$ の切断 $\eta$ に対し
$$
(\nabla^{*}_{X}\eta)(s)\defeq X\bigl(\eta(s)\bigr)-\eta(\nabla_{X}s)\qquad(s\in\Gamma(E))
$$
と定める。
1. 右辺は $s$ について $C^{\infty}(M)$ 線形で、$\nabla^{*}$ は $E^{*}$ の接続であることを示せ（\ref{riem:tensoriality-lemma} を先取りしてよい）。
2. 局所フレーム $e$ に関する $\nabla$ の接続形式を $\omega$ とすると、双対フレーム $(\theta^{b})$（$\theta^{b}(e_{a})=\delta^{b}_{a}$）に関する $\nabla^{*}$ の接続形式は $-\omega^{\mathsf{T}}$ であることを示せ。とくにアフィン接続について $\nabla^{*}_{\partial_{i}}dx_{k}=-\sum_{j}\Gamma^{k}_{ij}\,dx_{j}$。
:::

::: solution
**1.** $f\in C^{\infty}(M)$ について、ライプニッツ則から
$$
X\bigl(\eta(fs)\bigr)-\eta(\nabla_{X}(fs))=(Xf)\eta(s)+fX\bigl(\eta(s)\bigr)-(Xf)\eta(s)-f\eta(\nabla_{X}s)=f\bigl(X(\eta(s))-\eta(\nabla_{X}s)\bigr).
$$
加法性は明らか。よって \ref{riem:tensoriality-lemma}（値が関数の場合）から、各点 $m$ で右辺の値は $s(m)$ だけで決まり、$E_{m}$ 上の線形形式 $(\nabla^{*}_{X}\eta)_{m}$ を与える。滑らかさは 2 の局所表示（係数が滑らか）から従う。接続の公理：$X$ についての $C^{\infty}$ 線形性は、$\nabla_{fX}s=f\nabla_{X}s$ と $(fX)(\eta(s))=fX(\eta(s))$ から。$\eta$ についての $\mathbb{R}$ 線形性は明らか。ライプニッツ則は、$h\in C^{\infty}(M)$ について
$$
(\nabla^{*}_{X}(h\eta))(s)=X\bigl(h\eta(s)\bigr)-h\eta(\nabla_{X}s)=(Xh)\eta(s)+h(\nabla^{*}_{X}\eta)(s).
$$

**2.** フレームの定義域の上で（\ref{riem:connection-local.3} で制限して）計算すると、$\nabla_{X}e_{c}=\sum_{a}\omega^{a}{}_{c}(X)e_{a}$ と $\theta^{b}(e_{c})=\delta^{b}_{c}$（定数）から
$$
(\nabla^{*}_{X}\theta^{b})(e_{c})=X(\delta^{b}_{c})-\theta^{b}\Bigl(\sum_{a}\omega^{a}{}_{c}(X)e_{a}\Bigr)=-\omega^{b}{}_{c}(X).
$$
よって $\nabla^{*}_{X}\theta^{b}=-\sum_{c}\omega^{b}{}_{c}(X)\theta^{c}$。$\nabla^{*}$ の接続形式 $\omega^{*}$ は $\nabla^{*}_{X}\theta^{b}=\sum_{c}\omega^{*c}{}_{b}(X)\theta^{c}$ で定まるので $\omega^{*c}{}_{b}=-\omega^{b}{}_{c}$、つまり $\omega^{*}=-\omega^{\mathsf{T}}$。アフィン接続と座標フレームでは $\omega^{k}{}_{j}(\partial_{i})=\Gamma^{k}_{ij}$（\ref{riem:connection-form}）なので、$\nabla^{*}_{\partial_{i}}dx_{k}=-\sum_{j}\omega^{k}{}_{j}(\partial_{i})dx_{j}=-\sum_{j}\Gamma^{k}_{ij}dx_{j}$。
:::

::: problem ★★★ 発展：正方形を一周する平行移動 {#riem:ex-cn-3}
自明束 $\mathbb{R}^{2}\times\mathbb{R}^{2}$ に、標準フレーム $e$ に関する接続形式が
$$
\omega=\begin{pmatrix}0&-x\,dy\\x\,dy&0\end{pmatrix}
$$
である接続 $\nabla$（$\nabla s=e(ds+\omega s)$）を考える。区分的に滑らかな曲線に沿った平行移動は、各辺（開区間に延ばした滑らかな曲線）に沿った平行移動の合成と定める。
1. $\nabla$ は標準のファイバー計量と両立することを示せ。
2. 原点から $(1,0)$, $(1,1)$, $(0,1)$ を順に通って原点に戻る正方形の周に沿った平行移動は、角 $-1$（ラジアン）の回転であることを示せ。
3. 原点から $(1,1)$ への平行移動は、$(1,0)$ を経由する道と $(0,1)$ を経由する道とで異なることを示せ。
:::

::: solution
**1.** 標準フレームは正規直交で、$\omega$ は交代行列なので、\ref{riem:metric-connection-properties.1} から両立する。

**準備（1 辺の平行移動）.** $\mathcal{J}\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix}$, $R(\phi)\defeq\cos\phi\,I+\sin\phi\,\mathcal{J}$（角 $\phi$ の回転）とすると、$\mathcal{J}^{2}=-I$ から $\frac{d}{d\phi}R(\phi)=\mathcal{J}R(\phi)$。曲線 $\gamma$ に沿って $a(t)\defeq(x\,dy)(\gamma'(t))$ とおくと $\omega(\gamma'(t))=a(t)\mathcal{J}$ で、\ref{riem:covariant-along-curve} の式から平行の条件は $v'=-a(t)\mathcal{J}v$。$A(t)\defeq\int_{t_{0}}^{t}a$ について $v(t)\defeq R(-A(t))v_{0}$ は $v'=-a\mathcal{J}R(-A)v_{0}=-a\mathcal{J}v$, $v(t_{0})=v_{0}$ を満たすので、\ref{riem:parallel-transport} の一意性から平行移動は $P_{t_{0},t_{1}}=R\bigl(-\int_{t_{0}}^{t_{1}}a\bigr)$。

**2.** 各辺の $\int a$ は $\int x\,dy$ である。辺 $(s,0)$（$0\le s\le1$）と辺 $(1-s,1)$ では $y$ が一定なので $0$。辺 $(1,s)$ では $x=1$, $dy(\gamma')=1$ なので $1$。辺 $(0,1-s)$ では $x=0$ なので $0$。回転は可換なので、合成は $R(0)R(-1)R(0)R(0)=R(-1)$ で、角 $-1$ の回転である。

**3.** $(1,0)$ を経由する道の平行移動は、2 の最初の 2 辺の合成 $R(-1)R(0)=R(-1)$。$(0,1)$ を経由する道（辺 $(0,s)$ と辺 $(s,1)$）では、前者は $x=0$、後者は $y$ が一定なので、どちらも $\int a=0$ で、平行移動は $R(0)=I$。$R(-1)\neq I$ なので両者は異なる。

（一般に、閉曲線を一周する平行移動は $R\bigl(-\oint x\,dy\bigr)$ で、グリーンの定理から $\oint x\,dy$ は囲む領域の符号付き面積である。$\omega$ の「曲率」$d(x\,dy)=dx\wedge dy$ が面積に比例するずれを生むことの例になっている。）
:::

## レビ–チビタ接続 {#riem:sec-lc-exercises}

対応するページ：\ref{riem:page-levi-civita}

::: problem ★ 基本：球面のクリストッフェル記号 {#riem:ex-lc-1}
単位球面の球面座標（計量 $d\theta^{2}+\sin^{2}\theta\,d\varphi^{2}$）でのレビ–チビタ接続のクリストッフェル記号を求めよ。さらに、$\nabla_{\partial_{\varphi}}\partial_{\varphi}$ を \ref{riem:submanifold-levi-civita} の接成分としても計算し、一致を確かめよ。
:::

::: solution
$g_{\theta\theta}=1$, $g_{\theta\varphi}=0$, $g_{\varphi\varphi}=\sin^{2}\theta$ で、$0$ でない微分は $\partial_{\theta}g_{\varphi\varphi}=2\sin\theta\cos\theta$ だけ。\ref{riem:levi-civita} の公式で、$g$ が対角なので $\Gamma^{k}_{ij}=\frac{1}{2g_{kk}}(\partial_{i}g_{jk}+\partial_{j}g_{ik}-\partial_{k}g_{ij})$。これから
$$
\Gamma^{\theta}_{\varphi\varphi}=\tfrac12(-\partial_{\theta}g_{\varphi\varphi})=-\sin\theta\cos\theta,\qquad\Gamma^{\varphi}_{\theta\varphi}=\Gamma^{\varphi}_{\varphi\theta}=\frac{\partial_{\theta}g_{\varphi\varphi}}{2\sin^{2}\theta}=\frac{\cos\theta}{\sin\theta}.
$$
残りの $\Gamma^{\theta}_{\theta\theta}$, $\Gamma^{\theta}_{\theta\varphi}$, $\Gamma^{\varphi}_{\theta\theta}$, $\Gamma^{\varphi}_{\varphi\varphi}$ は、括弧の中のどの項も $g_{\theta\theta}$, $g_{\theta\varphi}$ の微分か $\partial_{\varphi}g_{\varphi\varphi}$ なので $0$。

接成分による計算：$f_{\varphi}=(-\sin\theta\sin\varphi,\sin\theta\cos\varphi,0)$ を $\varphi$ で微分して $D_{\partial_{\varphi}}\partial_{\varphi}=(-\sin\theta\cos\varphi,-\sin\theta\sin\varphi,0)$。$f_{\theta}=(\cos\theta\cos\varphi,\cos\theta\sin\varphi,-\sin\theta)$ と $f_{\varphi}/\sin\theta$ は接平面の正規直交基底で、$\langle D_{\partial_{\varphi}}\partial_{\varphi},f_{\theta}\rangle=-\sin\theta\cos\theta$, $\langle D_{\partial_{\varphi}}\partial_{\varphi},f_{\varphi}\rangle=0$。よって $\nabla_{\partial_{\varphi}}\partial_{\varphi}=(D_{\partial_{\varphi}}\partial_{\varphi})^{\top}=-\sin\theta\cos\theta\,\partial_{\theta}$ で、$\Gamma^{\theta}_{\varphi\varphi}=-\sin\theta\cos\theta$, $\Gamma^{\varphi}_{\varphi\varphi}=0$ と一致する。
:::

::: problem ★★ 標準：共形平坦な計量 {#riem:ex-lc-2}
$\mathbb{R}^{n}$ の開集合 $U$ 上の計量 $g=e^{2\phi}\sum_{i}dx_{i}^{2}$（$\phi\in C^{\infty}(U)$）について、$\phi_{i}\defeq\partial_{i}\phi$ と書くと
$$
\Gamma^{k}_{ij}=\delta_{jk}\phi_{i}+\delta_{ik}\phi_{j}-\delta_{ij}\phi_{k}
$$
であることを示せ。これを使って、上半空間 $\mathbb{H}^{n}$（\ref{riem:metric-examples.3}）で、$y\defeq x_{n}$ として
$$
\nabla_{\partial_{i}}\partial_{j}=\frac1y\bigl(\delta_{ij}\partial_{n}-\delta_{in}\partial_{j}-\delta_{jn}\partial_{i}\bigr)
$$
となることを示せ。
:::

::: solution
$g_{jl}=e^{2\phi}\delta_{jl}$, $g^{kl}=e^{-2\phi}\delta_{kl}$, $\partial_{i}g_{jl}=2\phi_{i}e^{2\phi}\delta_{jl}$。\ref{riem:levi-civita} の公式から
$$
\Gamma^{k}_{ij}=\frac12\sum_{l}e^{-2\phi}\delta_{kl}\cdot2e^{2\phi}\bigl(\phi_{i}\delta_{jl}+\phi_{j}\delta_{il}-\phi_{l}\delta_{ij}\bigr)=\phi_{i}\delta_{jk}+\phi_{j}\delta_{ik}-\phi_{k}\delta_{ij}.
$$
$\mathbb{H}^{n}$ では $e^{2\phi}=1/y^{2}$、つまり $\phi=-\log x_{n}$ で、$\phi_{i}=-\delta_{in}/y$。代入して
$$
\nabla_{\partial_{i}}\partial_{j}=\sum_{k}\Gamma^{k}_{ij}\partial_{k}=\phi_{i}\partial_{j}+\phi_{j}\partial_{i}-\delta_{ij}\sum_{k}\phi_{k}\partial_{k}=\frac1y\bigl(-\delta_{in}\partial_{j}-\delta_{jn}\partial_{i}+\delta_{ij}\partial_{n}\bigr).
$$
（$n=2$ では $\Gamma^{1}_{12}=-\frac1y$, $\Gamma^{2}_{11}=\frac1y$, $\Gamma^{2}_{22}=-\frac1y$, 他は $0$ で、\ref{riem:curvature-examples} の証明の値と一致する。）
:::

::: problem ★★★ 発展：ヘッセ形式 {#riem:ex-lc-3}
リーマン多様体の関数 $f$ について $\operatorname{Hess}f(X,Y)\defeq\langle\nabla_{X}\operatorname{grad}f,Y\rangle$ と定める。
1. $\operatorname{Hess}f(X,Y)=X(Yf)-(\nabla_{X}Y)f$ で、$\operatorname{Hess}f$ は対称な $C^{\infty}(M)$ 双線形形式であることを示せ。
2. 座標では $\operatorname{Hess}f(\partial_{i},\partial_{j})=\partial_{i}\partial_{j}f-\sum_{k}\Gamma^{k}_{ij}\partial_{k}f$ であることを示せ。
3. $\mathbb{H}^{2}$ の関数 $f=\log y$ について、$|\operatorname{grad}f|=1$ と $\operatorname{Hess}f=-g+df\otimes df$ を示せ。
:::

::: solution
**1.** \ref{riem:musical-gradient} から $Yf=\langle\operatorname{grad}f,Y\rangle$。これを $X$ で微分し、計量との両立を使うと
$$
X(Yf)=\langle\nabla_{X}\operatorname{grad}f,Y\rangle+\langle\operatorname{grad}f,\nabla_{X}Y\rangle=\operatorname{Hess}f(X,Y)+(\nabla_{X}Y)f.
$$
定義の式から $\operatorname{Hess}f$ は $X$ について（接続の公理 1）も $Y$ について（内積の線形性）も $C^{\infty}(M)$ 線形。対称性：ねじれがない（\ref{riem:torsion}）ので
$$
\operatorname{Hess}f(X,Y)-\operatorname{Hess}f(Y,X)=(XY-YX)f-(\nabla_{X}Y-\nabla_{Y}X)f=[X,Y]f-[X,Y]f=0.
$$

**2.** 1 で $X=\partial_{i}$, $Y=\partial_{j}$ とすると、$\nabla_{\partial_{i}}\partial_{j}=\sum_{k}\Gamma^{k}_{ij}\partial_{k}$ から従う。

**3.** $\partial_{x}f=0$, $\partial_{y}f=1/y$。$\operatorname{grad}f=\sum g^{ij}\partial_{j}f\,\partial_{i}=y^{2}\cdot\frac1y\partial_{y}=y\,\partial_{y}$ で、$|\operatorname{grad}f|^{2}=y^{2}\cdot g_{22}=1$。前問（$n=2$）のクリストッフェル記号で、$\Gamma^{2}_{11}=\frac1y$, $\Gamma^{2}_{12}=0$, $\Gamma^{2}_{22}=-\frac1y$ なので、2 から
$$
\operatorname{Hess}f(\partial_{x},\partial_{x})=0-\tfrac1y\cdot\tfrac1y=-\tfrac{1}{y^{2}},\quad\operatorname{Hess}f(\partial_{x},\partial_{y})=0-0=0,\quad\operatorname{Hess}f(\partial_{y},\partial_{y})=-\tfrac{1}{y^{2}}+\tfrac1y\cdot\tfrac1y=0.
$$
一方 $-g+df\otimes df=-\frac{dx^{2}+dy^{2}}{y^{2}}+\frac{dy^{2}}{y^{2}}=-\frac{dx^{2}}{y^{2}}$ で、成分が一致する。
:::

## 曲率 {#riem:sec-cv-exercises}

対応するページ：\ref{riem:page-curvature}

::: problem ★ 基本：回転面型の計量 {#riem:ex-cv-1}
開区間 $I$ 上の滑らかな正値関数 $f$ について、$I\times\mathbb{R}$（座標 $(r,\theta)$）の計量 $g=dr^{2}+f(r)^{2}d\theta^{2}$ のガウス曲率は $K=-f''/f$ であることを示せ。$f=\sin r$（$I=(0,\pi)$）、$f=r$、$f=\sinh r$（$I=(0,\infty)$）のときの $K$ を答えよ。
:::

::: solution
$g_{rr}=1$, $g_{r\theta}=0$, $g_{\theta\theta}=f^{2}$ で、$0$ でない微分は $\partial_{r}g_{\theta\theta}=2ff'$。\ref{riem:levi-civita} の公式から、$0$ でないクリストッフェル記号は
$$
\Gamma^{r}_{\theta\theta}=-ff',\qquad\Gamma^{\theta}_{r\theta}=\Gamma^{\theta}_{\theta r}=\frac{f'}{f}.
$$
よって $\nabla_{\partial_{r}}\partial_{r}=0$, $\nabla_{\partial_{r}}\partial_{\theta}=\nabla_{\partial_{\theta}}\partial_{r}=\frac{f'}{f}\partial_{\theta}$, $\nabla_{\partial_{\theta}}\partial_{\theta}=-ff'\partial_{r}$。$[\partial_{r},\partial_{\theta}]=0$ なので
$$
\nabla_{\partial_{r}}\nabla_{\partial_{\theta}}\partial_{\theta}=\nabla_{\partial_{r}}(-ff'\partial_{r})=-(f'^{2}+ff'')\partial_{r},\qquad\nabla_{\partial_{\theta}}\nabla_{\partial_{r}}\partial_{\theta}=\frac{f'}{f}\nabla_{\partial_{\theta}}\partial_{\theta}=-f'^{2}\partial_{r}
$$
（後者で、$f'/f$ は $\theta$ によらない）。差をとって $R(\partial_{r},\partial_{\theta})\partial_{\theta}=-ff''\partial_{r}$、$R(\partial_{r},\partial_{\theta},\partial_{\theta},\partial_{r})=-ff''$。分母は $g_{rr}g_{\theta\theta}-g_{r\theta}^{2}=f^{2}$ なので、\ref{riem:sectional-curvature} から $K=-f''/f$。

$f=\sin r$ なら $K=1$、$f=r$ なら $K=0$、$f=\sinh r$ なら $K=-1$。（$f=\sin r$ は前節 ★ の球面座標の計量で、\ref{riem:curvature-examples.2} と整合する。$f=r$ は平面の極座標である。）
:::

::: problem ★★ 標準：球面と直線の積 {#riem:ex-cv-2}
$M=S^{2}\times\mathbb{R}$ に、単位球面の標準計量と $\mathbb{R}$ の計量 $dt^{2}$ の積計量（\ref{riem:metric-examples.4}）を入れる。
1. $S^{2}$ の座標 $(x_{1},x_{2})$ と $x_{3}\defeq t$ を合わせた座標で、添字に $3$ を含むクリストッフェル記号と $R^{l}{}_{kij}$ はすべて $0$ で、他は $S^{2}$ のものと一致することを示せ。
2. $M$ の断面曲率は $[0,1]$ のすべての値をとり、それ以外の値はとらないことを示せ。
3. $\mathrm{Ric}$ と $S$ を求め、$M$ はアインシュタイン計量でないことを示せ。
:::

::: solution
**1.** 計量の成分は、$a,b\in\{1,2\}$ について $g_{ab}=g^{S^{2}}_{ab}(x_{1},x_{2})$、$g_{a3}=0$、$g_{33}=1$ で、逆行列も同じ形（$g^{a3}=0$, $g^{33}=1$）。どの成分も $x_{3}$ によらない。\ref{riem:levi-civita} の公式で、$k=3$ なら $\Gamma^{3}_{ij}=\frac12(\partial_{i}g_{j3}+\partial_{j}g_{i3}-\partial_{3}g_{ij})=0$（$g_{j3}$ は定数、$\partial_{3}$ は $0$）。$k\in\{1,2\}$ で $i=3$ なら、$l$ についての和は $l\in\{1,2\}$ だけで、$\partial_{3}g_{jl}=0$, $g_{3l}=0$ から $0$。$j=3$ も同様。残る $i,j,k\in\{1,2\}$ では、和に現れるのは $S^{2}$ の成分だけで、$S^{2}$ のクリストッフェル記号と一致する。

$R^{l}{}_{kij}$ は \ref{riem:curvature-tensorial.2} の式で計算する。$i=3$ なら $\partial_{3}\Gamma^{l}_{jk}=0$、$\Gamma^{l}_{3k}=0$, $\Gamma^{m}_{3k}=0$, $\Gamma^{l}_{3m}=0$ から全項 $0$。$j=3$ も同様。$k=3$ なら $\Gamma^{l}_{j3}=\Gamma^{l}_{i3}=\Gamma^{m}_{j3}=\Gamma^{m}_{i3}=0$ で $0$。$l=3$ なら $\Gamma^{3}_{\cdot\cdot}=0$ で $0$。残る添字が $\{1,2\}$ の項では、和の $m=3$ の項は $0$ なので $S^{2}$ の式と一致する。

したがって、$X=u+a\partial_{3}$, $Y=v+b\partial_{3}$, $Z=w+c\partial_{3}$（$u,v,w$ は $S^{2}$ 方向）について、多重線形性から $R(X,Y)Z=R^{S^{2}}(u,v)w$。

**2.** 平面 $\sigma$ の正規直交基底 $X=u+a\partial_{3}$, $Y=v+b\partial_{3}$ をとる。1 から $K(\sigma)=R(X,Y,Y,X)=R^{S^{2}}(u,v,v,u)$。$S^{2}$ のガウス曲率は $1$（\ref{riem:curvature-examples.2}）なので、\ref{riem:prob-cv-two-dim} から $R^{S^{2}}(u,v)v=\langle v,v\rangle u-\langle u,v\rangle v$、よって
$$
K(\sigma)=|u|^{2}|v|^{2}-\langle u,v\rangle^{2}.
$$
コーシー–シュワルツから $K(\sigma)\ge0$、また $|u|^{2}=1-a^{2}\le1$, $|v|^{2}\le1$ から $K(\sigma)\le|u|^{2}|v|^{2}\le1$。逆に、$S^{2}$ 方向の正規直交ベクトル $e_{1},e_{2}$ と $s\in[0,1]$ について $X=e_{1}$, $Y=\sqrt{s}\,e_{2}+\sqrt{1-s}\,\partial_{3}$ は正規直交で、$u=e_{1}$, $v=\sqrt{s}\,e_{2}$ なので $K=s$。よって値域はちょうど $[0,1]$。

**3.** 正規直交基底 $e_{1},e_{2},e_{3}=\partial_{3}$ で（\ref{riem:ricci-scalar}）、$Y=y+b\partial_{3}$, $Z=z+c\partial_{3}$ について
$$
\mathrm{Ric}(Y,Z)=\sum_{i=1}^{3}R(e_{i},Y,Z,e_{i})=\sum_{i=1}^{2}R^{S^{2}}(e_{i},y,z,e_{i})=\mathrm{Ric}^{S^{2}}(y,z)=\langle y,z\rangle
$$
（$i=3$ の項は 1 から $0$。最後は \ref{riem:prob-cv-two-dim} の $\mathrm{Ric}=Kg$）。つまり $\mathrm{Ric}$ は $S^{2}$ の計量を引き戻したもので、$S=\mathrm{Ric}(e_{1},e_{1})+\mathrm{Ric}(e_{2},e_{2})+\mathrm{Ric}(e_{3},e_{3})=1+1+0=2$。$\mathrm{Ric}=\lambda g$ なら $\lambda=\mathrm{Ric}(e_{1},e_{1})=1$ と $\lambda=\mathrm{Ric}(e_{3},e_{3})=0$ が同時に成り立つことになり矛盾するので、アインシュタイン計量でない。
:::

::: problem ★★★ 発展：双曲空間の曲率 {#riem:ex-cv-3}
上半空間 $\mathbb{H}^{n}$（$n\ge2$）の計量 $\sum_{i}dx_{i}^{2}/x_{n}^{2}$ について
$$
R(X,Y)Z=-\bigl(\langle Y,Z\rangle X-\langle X,Z\rangle Y\bigr)
$$
を示し、断面曲率がすべて $-1$、$\mathrm{Ric}=-(n-1)g$、$S=-n(n-1)$ であることを導け。
:::

::: solution
$y\defeq x_{n}$, $\nabla_{i}\defeq\nabla_{\partial_{i}}$ と書く。前節 ★★ の式 $y\nabla_{i}\partial_{j}=\delta_{ij}\partial_{n}-\delta_{in}\partial_{j}-\delta_{jn}\partial_{i}$ を使う。とくに $j=n$ として $y\nabla_{i}\partial_{n}=\delta_{in}\partial_{n}-\delta_{in}\partial_{n}-\partial_{i}=-\partial_{i}$。

**Step 1（$\nabla_{i}\nabla_{j}\partial_{k}$）.** $\partial_{i}(1/y)=-\delta_{in}/y^{2}$ とライプニッツ則から
$$
\nabla_{i}\nabla_{j}\partial_{k}=-\frac{\delta_{in}}{y^{2}}\bigl(\delta_{jk}\partial_{n}-\delta_{jn}\partial_{k}-\delta_{kn}\partial_{j}\bigr)+\frac1y\bigl(\delta_{jk}\nabla_{i}\partial_{n}-\delta_{jn}\nabla_{i}\partial_{k}-\delta_{kn}\nabla_{i}\partial_{j}\bigr).
$$
$y\nabla_{i}\partial_{n}=-\partial_{i}$, $y\nabla_{i}\partial_{k}=\delta_{ik}\partial_{n}-\delta_{in}\partial_{k}-\delta_{kn}\partial_{i}$, $y\nabla_{i}\partial_{j}=\delta_{ij}\partial_{n}-\delta_{in}\partial_{j}-\delta_{jn}\partial_{i}$ を代入して $y^{2}$ 倍すると
$$
y^{2}\nabla_{i}\nabla_{j}\partial_{k}=-\delta_{jk}\partial_{i}+S_{ijk},
$$
$$
S_{ijk}\defeq-\bigl(\delta_{in}\delta_{jk}+\delta_{jn}\delta_{ik}+\delta_{kn}\delta_{ij}\bigr)\partial_{n}+2\delta_{in}\delta_{jn}\partial_{k}+2\delta_{kn}\bigl(\delta_{in}\partial_{j}+\delta_{jn}\partial_{i}\bigr).
$$
（項を数えると：第 1 の括弧から $-\delta_{in}\delta_{jk}\partial_{n}+\delta_{in}\delta_{jn}\partial_{k}+\delta_{in}\delta_{kn}\partial_{j}$、$\delta_{jk}$ の項から $-\delta_{jk}\partial_{i}$、$\delta_{jn}$ の項から $-\delta_{jn}\delta_{ik}\partial_{n}+\delta_{jn}\delta_{in}\partial_{k}+\delta_{jn}\delta_{kn}\partial_{i}$、$\delta_{kn}$ の項から $-\delta_{kn}\delta_{ij}\partial_{n}+\delta_{kn}\delta_{in}\partial_{j}+\delta_{kn}\delta_{jn}\partial_{i}$。）$S_{ijk}$ は $i$ と $j$ の入れ替えで変わらない。

**Step 2（曲率）.** $[\partial_{i},\partial_{j}]=0$ なので、Step 1 で $i,j$ を入れ替えたものを引くと $S_{ijk}$ は打ち消し合い、
$$
R(\partial_{i},\partial_{j})\partial_{k}=\frac{1}{y^{2}}\bigl(-\delta_{jk}\partial_{i}+\delta_{ik}\partial_{j}\bigr)=-\bigl(g_{jk}\partial_{i}-g_{ik}\partial_{j}\bigr).
$$
両辺とも $X=\partial_{i}$, $Y=\partial_{j}$, $Z=\partial_{k}$ について $-(\langle Y,Z\rangle X-\langle X,Z\rangle Y)$ の形で、両辺は $C^{\infty}$ 三重線形（\ref{riem:curvature-tensorial.1}）なので、一般の $X,Y,Z$ について求める式が成り立つ。

**Step 3.** \ref{riem:constant-curvature} を $\kappa=-1$ で使えば、断面曲率はすべて $-1$、$\mathrm{Ric}=-(n-1)g$、$S=-n(n-1)$。（$n=2$ では \ref{riem:curvature-examples.3} と一致する。）
:::

## 測地線と指数写像 {#riem:sec-gd-exercises}

対応するページ：\ref{riem:page-geodesics}

::: problem ★ 基本：上半平面の測地線 {#riem:ex-gd-1}
$\mathbb{H}^{2}$ で、$\gamma_{1}(t)\defeq(x_{0},e^{t})$ と $\gamma_{2}(t)\defeq(\tanh t,\operatorname{sech}t)$（$t\in\mathbb{R}$）が速さ $1$ の測地線であることを示せ。（$\gamma_{2}$ は中心 $0$、半径 $1$ の半円をたどる。）
:::

::: solution
\ref{riem:geodesic} の方程式は、記法と定義の確認のクリストッフェル記号を使うと
$$
x''-\frac{2}{y}x'y'=0,\qquad y''+\frac1y x'^{2}-\frac1y y'^{2}=0.
$$
**$\gamma_{1}$.** $x'=0$ なので第 1 式は成り立つ。$y=y'=y''=e^{t}$ で、第 2 式は $e^{t}-e^{-t}e^{2t}=0$。速さは $|y'|/y=1$。

**$\gamma_{2}$.** $x=\tanh t$, $y=\operatorname{sech}t$ で、$x'=\operatorname{sech}^{2}t$, $y'=-\operatorname{sech}t\tanh t$, $x''=-2\operatorname{sech}^{2}t\tanh t$, $y''=\operatorname{sech}t\tanh^{2}t-\operatorname{sech}^{3}t$（$(\tanh t)'=\operatorname{sech}^{2}t$, $(\operatorname{sech}t)'=-\operatorname{sech}t\tanh t$）。第 1 式：
$$
-2\operatorname{sech}^{2}t\tanh t-\frac{2}{\operatorname{sech}t}\operatorname{sech}^{2}t\,(-\operatorname{sech}t\tanh t)=0.
$$
第 2 式：$\frac1y x'^{2}=\operatorname{sech}^{3}t$, $\frac1y y'^{2}=\operatorname{sech}t\tanh^{2}t$ なので
$$
(\operatorname{sech}t\tanh^{2}t-\operatorname{sech}^{3}t)+\operatorname{sech}^{3}t-\operatorname{sech}t\tanh^{2}t=0.
$$
速さの 2 乗は $(x'^{2}+y'^{2})/y^{2}=\operatorname{sech}^{2}t+\tanh^{2}t=1$。$x^{2}+y^{2}=\tanh^{2}t+\operatorname{sech}^{2}t=1$ なので単位円の上にある。
:::

::: problem ★★ 標準：クレローの関係式 {#riem:ex-gd-2}
「曲率」の節の ★ の計量 $g=dr^{2}+f(r)^{2}d\theta^{2}$ について、次を示せ。
1. 測地線 $\gamma(t)=(r(t),\theta(t))$ に沿って $f(r)^{2}\theta'$ は一定である。
2. 経線 $t\mapsto(t,\theta_{0})$ は測地線である。
3. 緯線 $t\mapsto(r_{0},ct)$（$c\neq0$）が測地線であることと $f'(r_{0})=0$ は同値である。単位球面（$f=\sin r$）では、測地線になる緯線は赤道だけである。
:::

::: solution
「曲率」の節の ★ の解のクリストッフェル記号から、測地線の方程式は
$$
r''-ff'(r)\,\theta'^{2}=0,\qquad\theta''+2\frac{f'(r)}{f(r)}r'\theta'=0.
$$
**1.** $(f(r)^{2}\theta')'=2ff'r'\theta'+f^{2}\theta''=f^{2}\bigl(\theta''+2\frac{f'}{f}r'\theta'\bigr)=0$。

**2.** $r=t$, $\theta=\theta_{0}$ なら $r''=0$, $\theta'=\theta''=0$ で、両式が成り立つ。

**3.** $r=r_{0}$, $\theta=ct$ なら第 2 式は $0=0$、第 1 式は $-f(r_{0})f'(r_{0})c^{2}=0$。$f>0$, $c\neq0$ なので $f'(r_{0})=0$ と同値。$f=\sin r$（$0<r<\pi$）では $\cos r_{0}=0$、つまり $r_{0}=\pi/2$（赤道）だけ。
:::

::: problem ★★★ 発展：測地極座標と球面の距離 {#riem:ex-gd-3}
1. 2 次元のリーマン多様体 $M$ と $p\in M$ について、$\exp_{p}$ が $B(0,\varepsilon)$ 上の微分同相写像で、$(e_{1},e_{2})$ が $T_{p}M$ の正規直交基底であるとする。$u(\theta)\defeq\cos\theta\,e_{1}+\sin\theta\,e_{2}$, $F(r,\theta)\defeq\exp_{p}(r\,u(\theta))$（$0<r<\varepsilon$）とすると、$F^{*}g=dr^{2}+G\,d\theta^{2}$（$G>0$）となることを示せ。
2. 単位球面 $S^{2}$ では、$\exp_{p}$ は $B(0,\pi)$ から $S^{2}\setminus\{-p\}$ への微分同相写像で、1 の $F$ について $G=\sin^{2}r$（$0<r<\pi$）であることを示せ。
3. $S^{2}$ のリーマン距離は $d(p,q)=\arccos\langle p,q\rangle$ であることを示せ。
:::

::: solution
**1.** 連鎖律から $\partial_{r}F=d(\exp_{p})_{ru}(u)$, $\partial_{\theta}F=d(\exp_{p})_{ru}(r\,u')$（$u'(\theta)=-\sin\theta\,e_{1}+\cos\theta\,e_{2}$ は $u$ に直交する単位ベクトル）。\ref{riem:gauss-lemma} を $v=ru$ と $w\in T_{p}M$ に使い、$d(\exp_{p})_{ru}(ru)=r\,\partial_{r}F$ で $r>0$ で割ると $\langle\partial_{r}F,d(\exp_{p})_{ru}(w)\rangle=\langle u,w\rangle$。$w=u$ として $|\partial_{r}F|^{2}=1$、$w=ru'$ として $\langle\partial_{r}F,\partial_{\theta}F\rangle=r\langle u,u'\rangle=0$。よって $F^{*}g=dr^{2}+G\,d\theta^{2}$, $G\defeq|\partial_{\theta}F|^{2}$。$d(\exp_{p})_{ru}$ は同型で $ru'\neq0$ なので $G>0$。

**2.** \ref{riem:prob-gd-sphere} から $\exp_{p}$ は $T_{p}S^{2}$ 全体で定義され、$F(r,\theta)=\cos r\,p+\sin r\,u(\theta)$。よって
$$
\partial_{r}F=-\sin r\,p+\cos r\,u,\qquad\partial_{\theta}F=\sin r\,u'.
$$
$p,u,u'$ は $\mathbb{R}^{3}$ の正規直交系なので、$|\partial_{r}F|=1$, $\langle\partial_{r}F,\partial_{\theta}F\rangle=0$, $|\partial_{\theta}F|^{2}=\sin^{2}r$。

【主張：$\exp_{p}\colon B(0,\pi)\to S^{2}\setminus\{-p\}$ は微分同相写像】単射性は \ref{riem:prob-gd-injectivity-radius}。全射性：$q\neq-p$ について $\alpha\defeq\arccos\langle p,q\rangle\in[0,\pi)$ とし、$\alpha>0$ なら $w\defeq(q-\cos\alpha\,p)/\sin\alpha$（$p$ に直交する単位ベクトル）とおくと $\exp_{p}(\alpha w)=q$。$\alpha=0$ なら $q=p=\exp_{p}(0)$。また $|v|<\pi$ なら $\langle p,\exp_{p}v\rangle=\cos|v|>-1$ なので像は $-p$ を含まない。微分：$v=0$ では \ref{riem:exponential-properties.3} から同型。$0<|v|<\pi$ では $v=r\,u(\theta_{0})$ と書け、極座標の写像 $P(r,\theta)\defeq r\,u(\theta)$ は $(r,\theta_{0})$ で微分が同型（ヤコビアン $r>0$）。$dF=d(\exp_{p})_{v}\circ dP$ で、$\partial_{r}F,\partial_{\theta}F$ は直交する $0$ でないベクトル（$\sin r>0$）なので $dF$ は階数 2、よって $d(\exp_{p})_{v}$ は全射で、次元が等しいので同型。逆関数定理（\ref{mfd:inverse-function-theorem}）から $\exp_{p}$ は局所微分同相写像で、全単射なので逆写像も滑らかになり、微分同相写像である。

$G=\sin^{2}r$ は上の計算から。（「曲率」の節の ★ から、この計量のガウス曲率は $1$ で、\ref{riem:curvature-examples.2} と整合する。）

**3.** 2 から、\ref{riem:geodesics-minimize} を $\varepsilon=\pi$ で使える。$q\neq-p$ なら、2 の全射性の証明の $v=\alpha w$（$|v|=\alpha<\pi$）について $q=\exp_{p}(v)$ なので $d(p,q)=|v|=\arccos\langle p,q\rangle$。$q=-p$ のとき、\ref{riem:geodesics-minimize.3} から $B_{d}(p,\pi)=\exp_{p}(B(0,\pi))=S^{2}\setminus\{-p\}$ なので $d(p,-p)\ge\pi$。一方、大円の半分 $t\mapsto\cos t\,p+\sin t\,e$（$0\le t\le\pi$、$e\in T_{p}S^{2}$ は単位ベクトル）の長さは $\pi$ なので $d(p,-p)=\pi=\arccos(-1)$。
:::

## ホッジの星作用素とラプラシアン {#riem:sec-hd-exercises}

対応するページ：\ref{riem:page-hodge}

::: problem ★ 基本：球面のラプラシアン {#riem:ex-hd-1}
単位球面 $S^{2}$ に、球面座標 $(\theta,\varphi)$ が正になる向きを入れる。
1. $\star d\theta$, $\star d\varphi$ を求めよ。
2. $\theta$ だけの関数 $f(\theta)$ について、$\Delta f=-\frac{1}{\sin\theta}\frac{d}{d\theta}\bigl(\sin\theta\,f'(\theta)\bigr)$ を、$\star$ を使う方法と \ref{riem:laplace-beltrami} の座標の式の両方で示せ。
3. 高さ関数 $h=x_{3}\restriction S^{2}$ について $\Delta h=2h$ を示し、これから $\int_{S^{2}}h\,\mathrm{vol}_{g}=0$ を導け。
:::

::: solution
**1.** 計量は $d\theta^{2}+\sin^{2}\theta\,d\varphi^{2}$（「リーマン計量と距離」の節の ★）なので、$\theta^{1}\defeq d\theta$, $\theta^{2}\defeq\sin\theta\,d\varphi$ は正規直交な余フレームで、$\theta^{1}\wedge\theta^{2}=\sin\theta\,d\theta\wedge d\varphi=\mathrm{vol}_{g}$ から正である。\ref{riem:hodge-star-properties.1} から $\star\theta^{1}=\theta^{2}$, $\star\theta^{2}=-\theta^{1}$（$\varepsilon(\{2\},\{1\})=-1$）。$C^{\infty}$ 線形性から
$$
\star d\theta=\sin\theta\,d\varphi,\qquad\star d\varphi=\frac{1}{\sin\theta}\star\theta^{2}=-\frac{d\theta}{\sin\theta}.
$$

**2.** （$\star$ による方法）$n=2$, $k=1$ で $\delta=-\star d\star$（\ref{riem:codifferential}）。$df=f'\,d\theta$, $\star df=f'\sin\theta\,d\varphi$, $d\star df=(\sin\theta\,f')'\,d\theta\wedge d\varphi$。$\star\mathrm{vol}_{g}=1$ と $d\theta\wedge d\varphi=\mathrm{vol}_{g}/\sin\theta$ から $\star(d\theta\wedge d\varphi)=1/\sin\theta$。よって $\Delta f=\delta df=-\frac{1}{\sin\theta}(\sin\theta\,f')'$。

（座標の式）$\sqrt{g}=\sin\theta$, $g^{\theta\theta}=1$, $g^{\theta\varphi}=0$, $\partial_{\varphi}f=0$ なので、\ref{riem:laplace-beltrami.2} から $\Delta f=-\frac{1}{\sin\theta}\partial_{\theta}(\sin\theta\,\partial_{\theta}f)$。

**3.** 座標近傍の上で $h=\cos\theta$ で、$\sin\theta\,h'=-\sin^{2}\theta$, $(-\sin^{2}\theta)'=-2\sin\theta\cos\theta$ なので $\Delta h=2\cos\theta=2h$。$\Delta h-2h$ は $S^{2}$ 上の連続関数で、座標近傍の定義域（$S^{2}$ から半大円を除いたもの、稠密）の上で $0$ なので、$S^{2}$ 全体で $0$。

\ref{riem:codifferential-adjoint} を $\alpha=1\in\Omega^{0}$, $\beta=dh$ に使うと $(1,\Delta h)=(1,\delta dh)=(d1,dh)=0$。よって $\int_{S^{2}}h\,\mathrm{vol}_{g}=\frac12(1,\Delta h)=0$。
:::

::: problem ★★ 標準：3 次元空間の 1 形式のラプラシアン {#riem:ex-hd-2}
$\mathbb{R}^{3}$（標準の計量と向き）で、ベクトル場 $F=(F_{1},F_{2},F_{3})$ について
$$
\Delta(F^{\flat})=(\operatorname{rot}\operatorname{rot}F-\operatorname{grad}\operatorname{div}F)^{\flat}=\sum_{i}(\Delta F_{i})\,dx_{i}
$$
を示せ（$\Delta F_{i}=-\sum_{j}\partial_{j}^{2}F_{i}$）。また $\alpha=x\,dy-y\,dx$ は $\Delta\alpha=0$ だが $d\alpha\neq0$ であることを確かめ、\ref{riem:harmonic-forms} との違いを説明せよ。
:::

::: solution
$n=3$ では $k(3-k)$ は常に偶数なので $\star\star=1$。$\delta$ の符号は、$k=1$ で $(-1)^{3\cdot2+1}=-1$、$k=2$ で $(-1)^{3\cdot3+1}=1$ なので、1 形式では $\delta=-\star d\star$、2 形式では $\delta=\star d\star$。

\ref{riem:hodge-star-examples.2} から $\star dF^{\flat}=(\operatorname{rot}F)^{\flat}$ なので $dF^{\flat}=\star\star dF^{\flat}=\star(\operatorname{rot}F)^{\flat}$。よって
$$
\delta dF^{\flat}=\star d\star\star(\operatorname{rot}F)^{\flat}=\star d(\operatorname{rot}F)^{\flat}=(\operatorname{rot}\operatorname{rot}F)^{\flat}
$$
（最後は同じ例を $\operatorname{rot}F$ に使った）。\ref{riem:laplace-beltrami.1} から $\delta F^{\flat}=-\operatorname{div}F$ で、$d(\operatorname{div}F)=(\operatorname{grad}\operatorname{div}F)^{\flat}$。合わせて $\Delta F^{\flat}=(\operatorname{rot}\operatorname{rot}F-\operatorname{grad}\operatorname{div}F)^{\flat}$。

成分では、たとえば第 1 成分は
$$
(\operatorname{rot}\operatorname{rot}F)_{1}=\partial_{y}(\partial_{x}F_{2}-\partial_{y}F_{1})-\partial_{z}(\partial_{z}F_{1}-\partial_{x}F_{3})=\partial_{x}(\partial_{y}F_{2}+\partial_{z}F_{3})-(\partial_{y}^{2}+\partial_{z}^{2})F_{1},
$$
これから $\partial_{x}\operatorname{div}F=\partial_{x}^{2}F_{1}+\partial_{x}(\partial_{y}F_{2}+\partial_{z}F_{3})$ を引くと $-\sum_{j}\partial_{j}^{2}F_{1}=\Delta F_{1}$。他の成分も同様（座標を巡回させる）。$F^{\flat}=\sum F_{i}dx_{i}$ なので主張が従う。

$\alpha=x\,dy-y\,dx$ の係数 $-y$, $x$, $0$ は 1 次式なので $\Delta\alpha=0$。一方 $d\alpha=dx\wedge dy-dy\wedge dx=2\,dx\wedge dy\neq0$。\ref{riem:harmonic-forms} は $M$ がコンパクトで境界がないことを仮定し、その証明は \ref{riem:codifferential-adjoint} の部分積分に基づく。$\mathbb{R}^{3}$ はコンパクトでなく、$\alpha$ の台もコンパクトでないので、$(\Delta\alpha,\alpha)=|d\alpha|^{2}+|\delta\alpha|^{2}$ は使えない（そもそも積分が発散する）。
:::

::: problem ★★★ 発展：星作用素とラプラシアンの可換性 {#riem:ex-hd-3}
向きづけられた $n$ 次元のリーマン多様体で、$\alpha\in\Omega^{k}(M)$ について
$$
\star\delta\alpha=(-1)^{k}d\star\alpha,\qquad\delta\star\alpha=(-1)^{k+1}\star d\alpha
$$
を示し、$\star\Delta=\Delta\star$ を導け。さらに $M$ がコンパクトで境界がなく連結なとき、$\star$ は調和 $k$ 形式の空間 $\mathcal{H}^{k}$ を $\mathcal{H}^{n-k}$ に同型に写し、$\mathcal{H}^{n}=\mathbb{R}\,\mathrm{vol}_{g}$ であることを示せ。
:::

::: solution
以下、指数は 2 を法として計算し、$\star\star=(-1)^{j(n-j)}$（$j$ 形式の上、\ref{riem:hodge-star-properties.2}）を使う。

**第 1 式.** $k=0$ なら左辺は $0$（$\Omega^{0}$ の上で $\delta=0$）、右辺は $n$ 形式 $\star\alpha$ の外微分で $0$。$k\ge1$ なら、$d\star\alpha$ は $(n-k+1)$ 形式なので
$$
\star\delta\alpha=(-1)^{n(k+1)+1}\star\star d\star\alpha=(-1)^{n(k+1)+1+(n-k+1)(k-1)}d\star\alpha.
$$
$(n-k+1)(k-1)\equiv(n+1)(k-1)$（$k(k-1)$ は偶数、\ref{riem:codifferential-adjoint} の証明の Step 3 と同じ）なので、指数は $nk+n+1+nk-n+k-1=2nk+k\equiv k$。

**第 2 式.** $k=n$ なら $\star\alpha$ は関数で左辺は $0$、$d\alpha=0$ なので右辺も $0$。$k<n$ なら、$\star\alpha$ は $(n-k)$ 形式なので
$$
\delta\star\alpha=(-1)^{n(n-k+1)+1}\star d\star\star\alpha=(-1)^{n(n-k+1)+1+k(n-k)}\star d\alpha.
$$
指数は $n^{2}-nk+n+1+nk-k^{2}=n(n+1)+1-k^{2}\equiv1+k$（$n(n+1)$ は偶数、$k^{2}\equiv k$）。

**可換性.** $\alpha\in\Omega^{k}$ とする。第 1 式を $d\alpha\in\Omega^{k+1}$ に使うと $\star\delta d\alpha=(-1)^{k+1}d\star d\alpha$、第 2 式から $\star d\alpha=(-1)^{k+1}\delta\star\alpha$ なので
$$
\star\delta d\alpha=(-1)^{k+1}(-1)^{k+1}d\delta\star\alpha=d\delta\star\alpha.
$$
第 2 式を $\delta\alpha\in\Omega^{k-1}$ に使うと（$k\ge1$）$\star d\delta\alpha=(-1)^{k}\delta\star\delta\alpha$、第 1 式から $\star\delta\alpha=(-1)^{k}d\star\alpha$ なので
$$
\star d\delta\alpha=(-1)^{k}(-1)^{k}\delta d\star\alpha=\delta d\star\alpha.
$$
（$k=0$ では $\delta\alpha=0$ で、$\star\alpha$ は $n$ 形式なので $d\star\alpha=0$、どちらも $0$。）足して $\star\Delta\alpha=d\delta\star\alpha+\delta d\star\alpha=\Delta\star\alpha$。

**調和形式.** $\Delta\alpha=0$ なら $\Delta\star\alpha=\star\Delta\alpha=0$ なので $\star(\mathcal{H}^{k})\subset\mathcal{H}^{n-k}$。$\star\star=\pm1$ なので、$\mathcal{H}^{n-k}\to\mathcal{H}^{k}$ の $\star$ と合わせて、$\star\colon\mathcal{H}^{k}\to\mathcal{H}^{n-k}$ は線形同型。\ref{riem:harmonic-forms} から、連結な $M$ では $\mathcal{H}^{0}$ は定数関数の全体 $\mathbb{R}$。$\star c=c\,\mathrm{vol}_{g}$（\ref{riem:hodge-star-properties.2}）なので $\mathcal{H}^{n}=\star\mathcal{H}^{0}=\mathbb{R}\,\mathrm{vol}_{g}$。
:::

## 凸近傍と良い被覆 {#riem:sec-cx-exercises}

対応するページ：\ref{riem:page-convex-neighborhoods}

::: problem ★ 基本：凸集合の内在的な距離 {#riem:ex-cx-1}
$U\subset M$ を空でない測地的に凸な開集合とし、$U$ に計量を制限したリーマン多様体の距離を $d_{U}$ とする。$U$ は連結で、$q,q'\in U$ について $d_{U}(q,q')=d(q,q')$ であることを示せ。
:::

::: solution
$U$ を含む一様な正規近傍 $(W,\delta)$ をとる（\ref{riem:convex-set}）。$q,q'\in U$ について、$q$ から $q'$ への動径測地線 $c$ は $U$ に含まれ、長さは $d(q,q')$ である（\ref{riem:uniformly-normal} の後の注意、\ref{riem:geodesics-minimize.3}）。とくに $U$ の任意の 2 点は $U$ の中の道で結べるので、$U$ は連結で、$d_{U}$ が定義される。

$U$ の中の区分的に滑らかな曲線は $M$ の曲線でもあり、長さは同じなので $d_{U}(q,q')\ge d(q,q')$。一方 $c$ は $U$ の中の曲線で $L(c)=d(q,q')$ なので $d_{U}(q,q')\le d(q,q')$。
:::

::: problem ★★ 標準：円周の良い被覆 {#riem:ex-cx-2}
単位円周 $S^{1}\subset\mathbb{R}^{2}$（誘導計量）の点を $e^{it}$ と書く。
1. $q=e^{it_{0}}$ について $\exp_{q}$ は $B_{q}(0,\pi)$ から $S^{1}\setminus\{-q\}$ への微分同相写像で、長さ $\ell\le\pi$ の開弧 $A=\{e^{it}:a<t<a+\ell\}$ について $(A,\pi)$ は一様な正規近傍、$A$ は測地的に凸であることを示せ。
2. $U_{k}\defeq\{e^{it}:\frac{2\pi k}{3}-\frac{5\pi}{12}<t<\frac{2\pi k}{3}+\frac{5\pi}{12}\}$（$k=0,1,2$）は $S^{1}$ の開被覆で、空でない有限個の共通部分は開区間と微分同相であることを示せ。
:::

::: solution
**1.** $T_{q}S^{1}=\mathbb{R}\,iq$（$iq$ は $q$ を $\pi/2$ 回転したもの）。\ref{riem:prob-gd-sphere}（$n=1$ の場合。証明は同じ）から、$v=s\,iq$ について $\exp_{q}(v)=\cos|s|\,q+\sin|s|\,\operatorname{sgn}(s)\,iq=\cos s\,q+\sin s\,iq=e^{i(t_{0}+s)}$。$|v|=|s|$ なので、$\exp_{q}\restriction B_{q}(0,\pi)$ は $s\mapsto e^{i(t_{0}+s)}$（$-\pi<s<\pi$）で、これは $S^{1}\setminus\{-q\}$ への微分同相写像（角度の座標の逆写像）。

$q\in A$, $t_{0}\in(a,a+\ell)$ とすると、$-q=e^{i(t_{0}+\pi)}$ で、$a+\ell\le a+\pi<t_{0}+\pi<a+\ell+\pi\le a+2\pi$ なので $-q\notin A$。よって $A\subset S^{1}\setminus\{-q\}=\exp_{q}(B_{q}(0,\pi))$ で、$(A,\pi)$ は一様な正規近傍（\ref{riem:uniformly-normal.1}・2）。$q'=e^{it_{1}}\in A$（$t_{1}\in(a,a+\ell)$）なら $|t_{1}-t_{0}|<\ell\le\pi$ なので、$q'$ の逆像は $v=(t_{1}-t_{0})iq$ で、動径測地線は $\tau\mapsto e^{i(t_{0}+\tau(t_{1}-t_{0}))}$（$0\le\tau\le1$）。角 $t_{0}+\tau(t_{1}-t_{0})$ は $t_{0}$ と $t_{1}$ の間にあるので $A$ に含まれる。よって $A$ は測地的に凸。

**2.** 各 $U_{k}$ は長さ $5\pi/6<\pi$ の開弧で、1 から測地的に凸。角度（度）で書くと $U_{0}=(-75^{\circ},75^{\circ})$, $U_{1}=(45^{\circ},195^{\circ})$, $U_{2}=(165^{\circ},315^{\circ})$ で、和は全周を覆う。共通部分は $U_{0}\cap U_{1}=(45^{\circ},75^{\circ})$, $U_{1}\cap U_{2}=(165^{\circ},195^{\circ})$, $U_{2}\cap U_{0}=(285^{\circ},315^{\circ})$ で、$U_{0}\cap U_{1}\cap U_{2}=\varnothing$（$(45^{\circ},75^{\circ})$ は $U_{2}$ と交わらない）。空でない共通部分は開弧（$U_{k}$ 自身を含む）で、角度の座標で開区間と微分同相。（\ref{riem:convex-properties.1}・2 からも、共通部分は凸で、星形の開集合と微分同相であることが分かる。）これは \ref{riem:good-cover-exists} の具体例である。
:::

::: problem ★★★ 発展：球面の小さな球は凸 {#riem:ex-cx-3}
単位球面 $S^{2}$ と北極 $N=(0,0,1)$、$0<r<\pi/2$ について、距離球 $B(N,r)$ は $\{q\in S^{2}:q_{3}>\cos r\}$ に等しく、測地的に凸であることを示せ。（\ref{riem:prob-cx-sphere-hemisphere} の開半球の場合の拡張である。）
:::

::: solution
**Step 1（距離球の形）.** 測地線の節の ★★★ の 3 から $d(N,q)=\arccos q_{3}$。よって $d(N,q)<r$ と $q_{3}>\cos r$ は同値（$\arccos$ は狭義単調減少）。

**Step 2（一様な正規近傍）.** $H\defeq\{q_{3}>0\}$ とする。測地線の節の ★★★ の 2 から、各 $q\in S^{2}$ について $\exp_{q}$ は $B_{q}(0,\pi)$ から $S^{2}\setminus\{-q\}$ への微分同相写像。$q\in H$ なら $-q\notin H$ なので $H\subset\exp_{q}(B_{q}(0,\pi))$。よって $(H,\pi)$ は一様な正規近傍で、$\cos r>0$ から $B(N,r)\subset H$。

**Step 3（動径測地線に沿った高さ）.** $q,q'\in B(N,r)$, $q\neq q'$ とし、$v\defeq(\exp_{q}\restriction B_{q}(0,\pi))^{-1}(q')$, $\ell\defeq|v|\in(0,\pi)$, $u\defeq v/\ell$ とおく。\ref{riem:prob-gd-sphere} から、動径測地線は弧長で $c(s)=\cos s\,q+\sin s\,u$（$0\le s\le\ell$）で、$c(\ell)=q'$。$h(s)\defeq\langle c(s),N\rangle=q_{3}\cos s+u_{3}\sin s$ とおくと $h''=-h$、$h(0)=q_{3}>\cos r$, $h(\ell)=q'_{3}>\cos r$。

【主張：$[0,\ell]$ 上で $h>0$】$\rho\defeq\sqrt{q_{3}^{2}+u_{3}^{2}}>0$ と $\psi$ をとって $h(s)=\rho\cos(s-\psi)$ と書く。$\{s\in\mathbb{R}:h(s)\le0\}$ は長さ $\pi$ の閉区間 $[\psi+\frac{\pi}{2}+2\pi m,\psi+\frac{3\pi}{2}+2\pi m]$（$m\in\mathbb{Z}$）の和である。ある $s_{0}\in[0,\ell]$ で $h(s_{0})\le0$ なら、$s_{0}$ を含むその閉区間 $J$ は、$h(0)>0$, $h(\ell)>0$ から $0$ も $\ell$ も含まず、連結なので $J\subset(0,\ell)$。すると $\pi\le\ell$ となり、$\ell<\pi$ に矛盾する。

【主張：$[0,\ell]$ 上で $h>\cos r$】前の主張から $h''=-h<0$ なので $h$ は $[0,\ell]$ 上で凹で、
$$
h(s)\ge\Bigl(1-\frac{s}{\ell}\Bigr)h(0)+\frac{s}{\ell}h(\ell)>\cos r.
$$

**Step 4（結論）.** Step 1・3 から動径測地線は $B(N,r)$ に含まれる（$q=q'$ なら定値で明らか）。Step 2 と合わせて、\ref{riem:convex-set} の意味で $B(N,r)$ は測地的に凸である。
:::
