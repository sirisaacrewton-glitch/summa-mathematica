# 演習：曲線論 {#surf:page-exercises-curves keywords="exercises, curves, curvature, torsion, helix, ellipse, rotation number, total curvature"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#surf:sec-excurves-notation}

## 曲線とフレネの公式 {#surf:sec-cf-exercises}

対応するページ：\ref{surf:page-curves-frenet}

::: problem ★ 基本：常螺旋の曲率と捩率 {#surf:ex-cf-1}
$a>0$, $b\in\mathbb{R}$ について、常螺旋 $c(t)=(a\cos t,a\sin t,bt)$ の曲率と捩率が $\kappa=\dfrac{a}{a^{2}+b^{2}}$, $\tau=\dfrac{b}{a^{2}+b^{2}}$ であることを、\ref{surf:curvature-torsion-formulas} で計算して確かめよ。
:::

::: solution
$c'=(-a\sin t,a\cos t,b)$, $c''=(-a\cos t,-a\sin t,0)$, $c'''=(a\sin t,-a\cos t,0)$。
$$
c'\times c''=(ab\sin t,\ -ab\cos t,\ a^{2}),\qquad|c'\times c''|=a\sqrt{a^{2}+b^{2}},\qquad|c'|=\sqrt{a^{2}+b^{2}}.
$$
よって $\kappa=a\sqrt{a^{2}+b^{2}}/(a^{2}+b^{2})^{3/2}=a/(a^{2}+b^{2})$。$\det(c',c'',c''')=\langle c''',c'\times c''\rangle=a^{2}b\sin^{2}t+a^{2}b\cos^{2}t=a^{2}b$ なので $\tau=a^{2}b/\bigl(a^{2}(a^{2}+b^{2})\bigr)=b/(a^{2}+b^{2})$。
:::

::: problem ★ 基本：楕円の曲率と頂点 {#surf:ex-cf-2}
$a>b>0$ とし、楕円 $c(t)=(a\cos t,b\sin t)$ の符号付き曲率を求め、頂点（\ref{surf:vertex}）が $[0,2\pi)$ にちょうど 4 つあることを示せ。
:::

::: solution
$c'=(-a\sin t,b\cos t)$, $c''=(-a\cos t,-b\sin t)$ で $\det(c',c'')=ab\sin^{2}t+ab\cos^{2}t=ab$。\ref{surf:plane-curvature-formula.2} から
$$
\kappa(t)=\frac{ab}{(a^{2}\sin^{2}t+b^{2}\cos^{2}t)^{3/2}}.
$$
$h(t)\defeq a^{2}\sin^{2}t+b^{2}\cos^{2}t$ について $h'(t)=2(a^{2}-b^{2})\sin t\cos t=(a^{2}-b^{2})\sin2t$ で、$\kappa'=-\frac{3}{2}ab\,h^{-5/2}h'$。$a\neq b$ なので $\kappa'(t)=0\iff\sin2t=0\iff t\in\{0,\pi/2,\pi,3\pi/2\}$。頂点はちょうど 4 つで、\ref{surf:four-vertex} の等号の場合にあたる。
:::

::: problem ★★ 標準：曲率一定で捩率 0 の空間曲線 {#surf:ex-cf-3}
$\mathbb{R}^{3}$ のフレネ曲線で、曲率が正の定数 $k$、捩率が恒等的に $0$ のものは、半径 $1/k$ の円の一部であることを示せ。
:::

::: solution
\ref{surf:planar-iff-torsion-zero} から曲線はある平面 $P$ に含まれる。$P$ の正規直交基底で座標をとると平面曲線とみなせ、空間曲線としての曲率と平面曲線としての符号付き曲率の絶対値は一致する（\ref{surf:curvature-torsion-formulas} の $|c'\times c''|$ は平面では $|\det(c',c'')|$、\ref{surf:plane-curvature-formula.2}）。符号付き曲率は連続で絶対値が $k\neq0$ なので符号は一定で、\ref{surf:line-circle-characterization.2} から半径 $1/k$ の円に含まれる。
:::

## 平面曲線の大域理論 {#surf:sec-pg-exercises}

対応するページ：\ref{surf:page-plane-curves-global}

::: problem ★★ 標準：8 の字の回転数 {#surf:ex-pg-1}
閉曲線 $c(t)=(\sin2t,\sin t)$（周期 $2\pi$）の回転数（\ref{surf:rotation-number}）が $0$ であることを示せ。
:::

::: solution
$c'(t)=(2\cos2t,\cos t)\neq0$（$\cos t=0$ なら $\cos2t=-1$）なので正則。$R(x,y)\defeq(x,-y)$ とすると $c(t+\pi)=(\sin2t,-\sin t)=Rc(t)$ なので $e_{1}(t+\pi)=Re_{1}(t)$。単位接ベクトルの連続な持ち上げ $\theta$（\ref{surf:angle-lifting}）について、$t\in[\pi,2\pi]$ で $\tilde{\theta}(t)\defeq-\theta(t-\pi)$ は $Re_{1}(t-\pi)=e_{1}(t)$ の連続な持ち上げ（鏡映 $R$ は角 $\phi$ の単位ベクトルを角 $-\phi$ に移す）。持ち上げは定数 $2\pi k$ の差を除いて一意なので $\theta(2\pi)-\theta(\pi)=\tilde{\theta}(2\pi)-\tilde{\theta}(\pi)=-(\theta(\pi)-\theta(0))$。よって $\theta(2\pi)-\theta(0)=0$ で回転数は $0$。
:::

## 全曲率とフェンチェルの定理 {#surf:sec-tc-exercises}

対応するページ：\ref{surf:page-total-curvature-fenchel}

::: problem ★★★ 発展：球に含まれる閉曲線の全曲率 {#surf:ex-tc-1}
弧長で径数づけられた長さ $L$ の $C^{\infty}$ 級閉曲線 $c$ が、原点を中心とする半径 $R$ の閉球に含まれるなら、全曲率について $\int_{0}^{L}\kappa\,ds\ge L/R$ であることを示せ。（$L>2\pi R$ なら\ref{surf:fenchel} より強い評価になる。）
:::

::: solution
$g(s)\defeq\frac{1}{2}|c(s)|^{2}$ とすると $g'=\langle c,c'\rangle$, $g''=|c'|^{2}+\langle c,c''\rangle=1+\langle c,c''\rangle$。コーシー–シュワルツの不等式と $|c''|=\kappa$（弧長、\ref{surf:curvature-torsion-formulas}）から $\langle c,c''\rangle\ge-|c|\,|c''|\ge-R\kappa$、よって $g''\ge1-R\kappa$。$g'$ は周期 $L$ なので $\int_{0}^{L}g''=g'(L)-g'(0)=0$（\ref{calc:fundamental-theorem.2}）。したがって $0\ge L-R\int_{0}^{L}\kappa\,ds$。
:::
