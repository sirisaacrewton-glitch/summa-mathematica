# 曲線論（Theory of Curves）

ℝⁿ の正則曲線、弧長、フレネ標構とフレネ–セレの公式、曲率・捩率、曲線論の基本定理（合同を除く一意性と存在）、平面曲線と空間曲線。

<p class="mn-msc">MSC2020: 53A04</p>

- [線形代数 › 行列式](../../../02-algebra/01-linear-algebra/02-determinants/index.html)（全体、4 ページ）：行列式の多重線形性・乗法性・転置
