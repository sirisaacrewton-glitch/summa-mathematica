# シンプレクティック幾何とケーラー幾何（Symplectic and Kähler Geometry）

シンプレクティック線形代数（シンプレクティック基底・ラグランジュ部分空間・両立する複素構造）、シンプレクティック多様体と余接束、ハミルトンベクトル場とポアソン括弧、モーザーの方法によるダルブーの定理、概複素構造・複素多様体・ケーラー多様体。

<p class="mn-msc">MSC2020: 53D05, 53D22, 37J39, 53C55, 32Q15</p>

## 前提知識

- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：微分形式・ド・ラーム・コホモロジー・ストークスの定理・流れ・リー微分・カルタンの公式
- [多様体論 › ド・ラームの定理](../../../05-geometry-topology/04-manifolds/04-de-rham/index.html)（全体、6 ページ）：ド・ラームの定理の帰結（球面のコホモロジー・体積形式の正規化）

- [微分幾何学 › リーマン幾何](../../../05-geometry-topology/05-differential-geometry/03-riemannian/index.html)（全体、8 ページ）：リーマン計量・テンソル性の補題・ホッジの定理（比較と事実の引用）
- [線形代数 › 多重線形代数](../../../02-algebra/01-linear-algebra/05-multilinear/index.html)（全体、4 ページ）：外積代数
- [線形代数 › 双線形形式と内積空間](../../../02-algebra/01-linear-algebra/04-forms/index.html)（全体、3 ページ）：スペクトル定理
