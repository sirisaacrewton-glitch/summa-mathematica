# 概複素構造とケーラー多様体 {#symp:page-kahler keywords="almost complex structure, compatible almost complex structures on symplectic manifolds, smooth square root of positive definite matrices, complex manifold, holomorphic atlas, integrable almost complex structure, Newlander-Nirenberg, Hermitian metric, fundamental 2-form, Kahler manifold, Kahler form, complex submanifolds, Fubini-Study metric, Hopf surface, Hodge decomposition"}

シンプレクティック形式 $\omega$・リーマン計量 $g$・概複素構造 $J$ の三つは、各点では両立する三つ組 $(\omega,J,g)$ としてつながっていた（\ref{symp:compatible-triple}）。このページでは、まず、どのシンプレクティック多様体にも両立する概複素構造があることを示す（\ref{symp:compatible-almost-complex}）。次に、正則な座標変換をもつ多様体（**複素多様体**）が自然に概複素構造をもつことを示し、複素構造・計量・シンプレクティック形式の三つが両立し、しかも $J$ が複素多様体から来て $\omega$ が閉じているもの、すなわち**ケーラー多様体**を定義する。ケーラー多様体は、リーマン幾何・シンプレクティック幾何・複素幾何が交わる場所で、射影代数多様体はすべてケーラー多様体である。

## 記法と定義の確認 {#symp:sec-kh-notation}

::: notation
- 両立する複素構造と三つ組は \ref{symp:compatible-triple}, \ref{symp:compatible-complex-structure}。シンプレクティック多様体は \ref{symp:symplectic-manifold}、その基本性質は \ref{symp:symplectic-manifold-basic}。
- リーマン計量の存在は \ref{mfd:fiber-metric-existence}、正規直交フレームは \ref{mfd:reduction-orthogonal}。さらに \ref{calc:inverse-function-theorem}。
- 正則関数とコーシー–リーマンの方程式は \ref{cx:holomorphic}, \ref{cx:cauchy-riemann}。$\mathbb{C}^{n}$ を $z_{j}=x_{j}+iy_{j}$ で $\mathbb{R}^{2n}$ と同一視し、$i$ 倍にあたる実線形変換を $J_{0}$ と書く（$J_{0}\partial_{x_{j}}=\partial_{y_{j}}$, $J_{0}\partial_{y_{j}}=-\partial_{x_{j}}$）。
- $\mathrm{Sym}_{m}^{+}$ は $m$ 次の正定値対称行列の全体で、対称行列の空間 $\mathrm{Sym}_{m}$ の開集合。
:::

## 両立する概複素構造 {#symp:sec-kh-almost-complex}

::: definition 概複素構造 {#symp:almost-complex-structure keywords="almost complex structure J on M: bundle endomorphism of TM with J^2 = -1; compatible with a symplectic form omega if omega(J., J.) = omega and omega(., J.) is positive definite" index="概複素構造|がいふくそこうぞう, 概複素多様体|がいふくそたようたい"}
$M$ 上の**概複素構造**とは、各点の線形変換 $J_{m}\colon T_{m}M\to T_{m}M$ の族で、$J_{m}^{2}=-\mathrm{id}$ を満たし、滑らかなベクトル場を滑らかなベクトル場に写すもの（つまり $TM$ の滑らかな自己準同型）をいう。シンプレクティック多様体 $(M,\omega)$ の概複素構造 $J$ が各点で $\omega_{m}$ と両立するとき（\ref{symp:compatible-triple}）、$\omega$ と**両立する**という。このとき $g_{J}(u,v)\defeq\omega(u,Jv)$ はリーマン計量である。
:::

概複素構造があれば各 $T_{m}M$ は複素ベクトル空間になるので、$\dim M$ は偶数である。

::: lemma 正定値行列の平方根の滑らかさ {#symp:smooth-square-root keywords="the square map Sym^+ -> Sym^+, Q -> Q^2 is a diffeomorphism; the positive square root depends smoothly on the matrix" index="正定値行列の平方根|せいていちぎょうれつのへいほうこん"}
$\mathrm{sq}\colon\mathrm{Sym}_{m}^{+}\to\mathrm{Sym}_{m}^{+}$, $Q\mapsto Q^{2}$ は微分同相写像である。とくに、正の平方根 $P\mapsto P^{1/2}$ は $\mathrm{Sym}_{m}^{+}$ 上の滑らかな写像である。
:::

::: proof
**Step 1（全単射）.** 存在：\ref{lin:spectral-theorem} で $P=U\mathrm{diag}(\mu_{i})U^{\mathsf{T}}$（$U$ は直交行列、$\mu_{i}>0$）と書き、$Q\defeq U\mathrm{diag}(\sqrt{\mu_{i}})U^{\mathsf{T}}$。一意性：$Q\in\mathrm{Sym}^{+}$, $Q^{2}=P$ なら、$Q$ は $P$ と可換なので $P$ の各固有空間 $E_{\mu}$ を保つ。$Q\restriction E_{\mu}$ は正定値対称で $(Q\restriction E_{\mu})^{2}=\mu$ なので、その固有値はすべて $\sqrt{\mu}$、よって $Q\restriction E_{\mu}=\sqrt{\mu}$。$Q$ は $P$ から決まる。

**Step 2（微分の単射性）.** $\mathrm{sq}$ は多項式写像で、$Q$ での微分は $H\mapsto QH+HQ$（$H\in\mathrm{Sym}_{m}$）。$Q$ を対角化する正規直交基底（$Q=\mathrm{diag}(q_{i})$, $q_{i}>0$）で見ると $(QH+HQ)_{ij}=(q_{i}+q_{j})H_{ij}$ なので、$QH+HQ=0$ なら $H=0$。

**Step 3.** 逆関数定理から $\mathrm{sq}$ は局所微分同相写像で、Step 1 から全単射なので、逆写像は各点の近くで局所的な逆写像と一致し、滑らか。
:::

::: theorem 両立する概複素構造の存在 {#symp:compatible-almost-complex keywords="every symplectic manifold admits an almost complex structure compatible with omega" index="両立する概複素構造の存在|りょうりつするがいふくそこうぞうのそんざい"}
どのシンプレクティック多様体 $(M,\omega)$ にも、$\omega$ と両立する概複素構造がある。
:::

::: proof
リーマン計量 $g$ を一つとる（\ref{mfd:fiber-metric-existence}）。各点で \ref{symp:compatible-complex-structure} の構成 $J=AP^{-1/2}$（$\omega(u,v)=g(Au,v)$, $P=-A^{2}$）を行う。各点で $J_{m}$ が $\omega_{m}$ と両立する複素構造であることは \ref{symp:compatible-complex-structure} で示した。【主張：$J$ は滑らか】$g$ の正規直交な局所フレーム（\ref{mfd:reduction-orthogonal.1}）をとると、$g$ は単位行列、$A$ は $\omega$ の成分の行列（の転置の符号違い）で滑らかな交代行列値関数、$P=-A^{2}=A^{\mathsf{T}}A$ は滑らかな $\mathrm{Sym}^{+}$ 値関数。\ref{symp:smooth-square-root} と逆行列の滑らかさから $P^{-1/2}$ は滑らかで、$J=AP^{-1/2}$ も滑らか。
:::

## 複素多様体 {#symp:sec-kh-complex}

::: definition 複素多様体 {#symp:complex-manifold keywords="complex manifold: a manifold with an atlas of charts into C^n whose transition maps are holomorphic; holomorphic maps; the induced almost complex structure J d/dx_j = d/dy_j; integrable almost complex structure" index="複素多様体|ふくそたようたい, 正則アトラス|せいそくあとらす, 可積分な概複素構造|かせきぶんながいふくそこうぞう"}
$2n$ 次元の可微分多様体 $M$ のアトラスで、各座標近傍を $\mathbb{C}^{n}$ への写像とみたとき座標変換がすべて正則（各成分が各変数について正則）なものを**正則アトラス**といい、正則アトラス（を含む極大なもの）を与えた $M$ を $n$ 次元の**複素多様体**という。概複素構造 $J$ が、ある複素多様体の構造から次の命題の意味で得られるとき、$J$ は**可積分**であるという。
:::

::: proposition 複素多様体の概複素構造 {#symp:complex-manifold-j keywords="on a complex manifold, J defined by J d/dx_j = d/dy_j in holomorphic coordinates is independent of the chart because the real Jacobian of a holomorphic map commutes with J_0 (Cauchy-Riemann)" index="複素多様体の概複素構造|ふくそたようたいのがいふくそこうぞう"}
複素多様体 $M$ の正則な座標近傍 $(U;z_{1},\dots,z_{n})$, $z_{j}=x_{j}+iy_{j}$ ごとに $J\partial_{x_{j}}\defeq\partial_{y_{j}}$, $J\partial_{y_{j}}\defeq-\partial_{x_{j}}$ と定めると、これは座標近傍によらず、$M$ の概複素構造を定める。
:::

::: proof
二つの正則な座標近傍の座標変換 $F=(F_{1},\dots,F_{n})$, $F_{k}=u_{k}+iv_{k}$ の実ヤコビ行列 $DF$ が $J_{0}$ と可換であることを示せばよい（座標ベクトルの変換行列が $DF$ なので、$J_{0}$ との可換性は、二つの座標近傍で定めた $J$ が一致することと同値）。コーシー–リーマンの方程式（\ref{cx:cauchy-riemann}）を各変数について使うと $\partial u_{k}/\partial x_{j}=\partial v_{k}/\partial y_{j}$, $\partial u_{k}/\partial y_{j}=-\partial v_{k}/\partial x_{j}$。これは
$$
DF(\partial_{y_{j}})=\sum_{k}\Bigl(\frac{\partial u_{k}}{\partial y_{j}}\partial_{u_{k}}+\frac{\partial v_{k}}{\partial y_{j}}\partial_{v_{k}}\Bigr)=\sum_{k}\Bigl(-\frac{\partial v_{k}}{\partial x_{j}}\partial_{u_{k}}+\frac{\partial u_{k}}{\partial x_{j}}\partial_{v_{k}}\Bigr)=J_{0}\,DF(\partial_{x_{j}})
$$
（最後は $J_{0}\partial_{u_{k}}=\partial_{v_{k}}$, $J_{0}\partial_{v_{k}}=-\partial_{u_{k}}$）と同じで、$DF\,J_{0}\partial_{x_{j}}=J_{0}DF\partial_{x_{j}}$。$\partial_{y_{j}}$ についても、$J_{0}^{2}=-1$ を使って同様。$J$ は座標で定数行列なので滑らかで、$J^{2}=-1$。
:::

::: fact ニューランダー–ニーレンバーグの定理 {#symp:newlander-nirenberg keywords="an almost complex structure is integrable iff its Nijenhuis tensor N(X,Y) = [JX,JY] - J[JX,Y] - J[X,JY] - [X,Y] vanishes" index="ニューランダー–ニーレンバーグの定理|にゅーらんだーにーれんばーぐのていり, ナイエンハイス・テンソル|ないえんはいすてんそる"}
概複素構造 $J$ が可積分であるための必要十分条件は、**ナイエンハイス・テンソル** $N(X,Y)\defeq[JX,JY]-J[JX,Y]-J[X,JY]-[X,Y]$ が $0$ になることである。（必要性は、正則座標の座標ベクトル場で $N$ を計算すれば直ちに分かる。十分性は偏微分方程式の深い結果。2 次元ではいつも $N=0$ で、どの概複素構造も可積分。）
:::

## ケーラー多様体 {#symp:sec-kh-kahler}

::: definition ケーラー多様体 {#symp:kahler-manifold keywords="Hermitian metric: J-invariant Riemannian metric on a complex manifold; fundamental 2-form omega(u, v) = g(Ju, v); Kahler manifold: d omega = 0; Kahler form" index="ケーラー多様体|けーらーたようたい, ケーラー形式|けーらーけいしき, エルミート計量|えるみーとけいりょう, 基本 2 形式|きほんにけいしき"}
複素多様体 $(M,J)$ 上のリーマン計量 $g$ で $g(Ju,Jv)=g(u,v)$ を満たすものを**エルミート計量**といい、$\omega(u,v)\defeq g(Ju,v)$ を**基本 2 形式**という。$d\omega=0$ のとき、$(M,J,g)$ を**ケーラー多様体**、$\omega$ を**ケーラー形式**という。
:::

::: proposition ケーラー多様体はシンプレクティック {#symp:kahler-symplectic keywords="the fundamental 2-form of a Hermitian metric is a nondegenerate alternating form compatible with J, and g = omega(., J.); a Kahler manifold is a symplectic manifold with an integrable compatible almost complex structure; compact Kahler manifolds have H^{2k} != 0" index="ケーラー多様体の性質|けーらーたようたいのせいしつ"}
$(M,J,g)$ をエルミート計量をもつ複素多様体、$\omega$ を基本 2 形式とする。
1. $\omega$ は交代的な非退化 2 形式で、$\omega(Ju,Jv)=\omega(u,v)$, $\omega(u,Jv)=g(u,v)$。つまり $(\omega,J,g)$ は各点で両立する三つ組。
2. したがって、ケーラー多様体はシンプレクティック多様体で、$J$ は $\omega$ と両立する可積分な概複素構造である。とくにコンパクトなケーラー多様体（$\dim_{\mathbb{C}}=n$）では $0\le k\le n$ について $H^{2k}(M)\neq0$。
3. 逆に、シンプレクティック多様体 $(M,\omega)$ と、$\omega$ と両立する可積分な概複素構造 $J$ について、$g_{J}=\omega(\cdot,J\cdot)$ はエルミート計量で、その基本 2 形式は $\omega$ である。
:::

::: proof
**1.** 交代性：$\omega(v,u)=g(Jv,u)=g(J^{2}v,Ju)=-g(v,Ju)=-g(Ju,v)=-\omega(u,v)$（$J$ 不変性と $J^{2}=-1$）。$\omega(u,Jv)=g(Ju,Jv)=g(u,v)$。$\omega(Ju,Jv)=g(J^{2}u,Jv)=-g(u,Jv)=-g(Ju,J^{2}v)=g(Ju,v)=\omega(u,v)$。非退化性：$u\neq0$ なら $\omega(u,Ju)=g(u,u)>0$。滑らかさは $g$, $J$ の滑らかさから。

**2.** $d\omega=0$ と 1 から $\omega$ はシンプレクティック形式で、$J$ は両立する（$g_{J}=g$ が正定値）。$J$ は複素多様体から来るので可積分。最後は \ref{symp:symplectic-manifold-basic.2}。

**3.** $g_{J}$ は \ref{symp:compatible-triple} からリーマン計量（滑らかさは $\omega$, $J$ から）。$J$ 不変性：$g_{J}(Ju,Jv)=\omega(Ju,J^{2}v)=\omega(u,Jv)=g_{J}(u,v)$（両立性）。基本 2 形式：$g_{J}(Ju,v)=\omega(Ju,Jv)=\omega(u,v)$。
:::

::: example ケーラー多様体の例 {#symp:kahler-examples keywords="C^n with the standard metric; every Riemann surface with any Hermitian metric; complex submanifolds of Kahler manifolds; complex projective space with the Fubini-Study metric (fact); Hopf surface is complex but not Kahler" index="フビニ–スタディ計量|ふびにすたでぃけいりょう, ホップ曲面|ほっぷきょくめん, リーマン面（ケーラー）|りーまんめんけーらー"}
1. $\mathbb{C}^{n}$ と標準計量：基本 2 形式は $\omega_{0}=\sum dx_{j}\wedge dy_{j}$（\ref{symp:symplectic-vector-space} の $\omega_{0}(u,v)=\langle J_{0}u,v\rangle$）で閉。
2. **リーマン面**（1 次元の複素多様体）の任意のエルミート計量はケーラー計量である。エルミート計量は存在する。
3. ケーラー多様体 $(M,J,g)$ の部分多様体 $N$ で、各点で $J(T_{p}N)=T_{p}N$ となるもの（**複素部分多様体**）は、誘導計量でケーラー多様体である（$N$ の複素多様体の構造は認める）。
4. （事実）複素射影空間 $\mathbb{CP}^{n}$ は**フビニ–スタディ計量**によってケーラー多様体である。3 と合わせて、$\mathbb{CP}^{n}$ の複素部分多様体（射影代数多様体）はすべてケーラー多様体である。
5. （事実）**ホップ曲面** $S^{1}\times S^{3}$ は（$\mathbb{C}^{2}\setminus\{0\}$ を $z\mapsto2z$ で割った商として）2 次元の複素多様体の構造をもつが、$H^{2}_{\mathrm{dR}}(S^{1}\times S^{3})=0$（\ref{mfd:de-rham-applications}）なので、2 からケーラー計量をもたない。
:::

::: proof
**2.** 基本 2 形式は実 2 次元の多様体上の 2 形式なので、$d\omega$ は 3 形式で $0$。存在：任意のリーマン計量 $h$ から $g(u,v)\defeq h(u,v)+h(Ju,Jv)$ とすると、正定値対称で $g(Ju,Jv)=h(Ju,Jv)+h(J^{2}u,J^{2}v)=g(u,v)$。

**3.** 誘導計量 $g_{N}$ は $J\restriction TN$ について不変で、基本 2 形式は $\iota^{*}\omega$（$\iota$ は包含写像）なので、$d\iota^{*}\omega=\iota^{*}d\omega=0$（\ref{mfd:pullback-properties}）。$N$ の概複素構造 $J\restriction TN$ が $N$ の複素多様体の構造から来ることは、ここでは仮定として認める（正則な陰関数定理による）。

**5.** $H^{2}(S^{1}\times S^{3})=0$ はキュネットの公式と\ref{at:sphere-homology}、ド・ラームの定理による事実として引用する。コンパクトなので 2 の $k=1$ に反する。
:::

::: fact ケーラー多様体の基本的な性質 {#symp:kahler-facts keywords="for an almost Hermitian manifold, Kahler iff nabla J = 0 for the Levi-Civita connection (holonomy in U(n)); Hodge decomposition H^k(M; C) = sum H^{p,q} with H^{p,q} = conj H^{q,p} on compact Kahler manifolds; odd Betti numbers are even; hard Lefschetz theorem" index="ホッジ分解（ケーラー）|ほっじぶんかいけーらー, ハード・レフシェッツの定理|はーどれふしぇっつのていり"}
1. エルミート計量をもつ概複素多様体 $(M,J,g)$ について、「$J$ が可積分で $d\omega=0$」と「レビ–チビタ接続について $\nabla J=0$」は同値である。とくにケーラー多様体の平行移動は $J$ と可換で、構造群は $\mathrm{U}(n)$ に還元され、ホロノミー群は $\mathrm{U}(n)$ に含まれる。
2. コンパクトなケーラー多様体では、複素係数のド・ラーム・コホモロジーが $H^{k}(M;\mathbb{C})=\bigoplus_{p+q=k}H^{p,q}(M)$, $\overline{H^{p,q}}=H^{q,p}$ と分解する（**ホッジ分解**）。とくに奇数次のベッチ数は偶数である。
3. （ハード・レフシェッツの定理）$[\omega]^{n-k}\wedge\colon H^{k}(M)\to H^{2n-k}(M)$ は同型である。

（いずれも、たとえばグリフィス–ハリス『Principles of Algebraic Geometry』第 0 章、ユイブレヒツ『Complex Geometry』第 3 章。証明にはホッジ理論（\ref{riem:hodge-theorem}）とケーラー恒等式を使う。）
:::

::: supplement
**高い視点：三つの幾何の交点.** ケーラー多様体では、リーマン幾何（$g$、構造群 $\mathrm{O}(2n)$）、シンプレクティック幾何（$\omega$、$\mathrm{Sp}(2n,\mathbb{R})$）、複素幾何（$J$、$\mathrm{GL}(n,\mathbb{C})$）の三つの構造が、各点では両立する三つ組として（構造群 $\mathrm{U}(n)$ への還元、\ref{mfd:page-reduction} の表）、さらに「積分可能性」の条件（$J$ の可積分性と $d\omega=0$）付きで重なっている。各点の両立だけなら、どのシンプレクティック多様体にも（\ref{symp:compatible-almost-complex}）、どの概複素多様体にも（計量の平均）、できる。ケーラー条件の本質は積分可能性で、これは \ref{symp:kahler-facts.1} のとおり「平行移動が三つの構造すべてを保つ」こと、つまり $\mathrm{U}(n)$ への還元が接続と整合することと同値である。比喩で言えば、三つ組は各点に置かれた「長さ・面積・90 度回転の三点セット」で、ケーラー条件は、そのセットが点から点へ平行移動しても崩れない、ということである。

**補足.** ホップ曲面の例（\ref{symp:kahler-examples.5}）は複素構造があってもケーラーでない例である。逆に、シンプレクティック形式をもつが、どの複素構造ともケーラー的に両立しないコンパクト多様体（サーストンの例など、奇数次のベッチ数が奇数になるもの）があることも知られている。
:::

## 問題 {#symp:sec-kh-problems}

::: problem {#symp:prob-kh-j-orientation}
概複素構造をもつ多様体は向き付け可能であることを示せ。（ヒント：各点で $(e_{1},Je_{1},\dots,e_{n},Je_{n})$ の形の基底の向きを考える。あるいは、計量を平均して両立する計量をとり、$\omega=g(J\cdot,\cdot)$ を考えよ。）
:::

::: solution
\ref{symp:kahler-examples} の 2 の証明と同じく、リーマン計量 $h$ から $g(u,v)\defeq h(u,v)+h(Ju,Jv)$ を作ると、$g$ は $J$ 不変なリーマン計量。$\omega(u,v)\defeq g(Ju,v)$ は \ref{symp:kahler-symplectic.1} の証明（$J$ 不変性と $J^{2}=-1$ だけを使い、可積分性や $d\omega=0$ は使っていない）から各点で非退化な交代形式で、滑らか。よって $\omega^{n}$ はどの点でも $0$ でない $2n$ 形式（\ref{symp:omega-power}）で、\ref{mfd:orientable-equivalents} から向き付け可能。
:::

::: problem {#symp:prob-kh-cn-fundamental-form}
$\mathbb{C}^{n}$ の標準のエルミート内積 $h(z,w)=\sum_{j}z_{j}\bar w_{j}$ について、$\operatorname{Re}h$ が標準内積 $g$ で、$\operatorname{Im}h=-\omega_{0}$ であることを示せ（$\omega_{0}(u,v)=g(J_{0}u,v)$）。
:::

::: solution
$z_{j}=a_{j}+ib_{j}$, $w_{j}=c_{j}+id_{j}$ とすると $z_{j}\bar w_{j}=(a_{j}c_{j}+b_{j}d_{j})+i(b_{j}c_{j}-a_{j}d_{j})$。実部の和は $g(z,w)$。$J_{0}z$ の成分は $iz_{j}=-b_{j}+ia_{j}$ なので $g(J_{0}z,w)=\sum(-b_{j}c_{j}+a_{j}d_{j})$。よって $\operatorname{Im}h=\sum(b_{j}c_{j}-a_{j}d_{j})=-g(J_{0}z,w)=-\omega_{0}(z,w)$。
:::
