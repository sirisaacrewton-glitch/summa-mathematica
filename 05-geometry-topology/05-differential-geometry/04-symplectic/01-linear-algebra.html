# シンプレクティック線形代数 {#symp:page-linear-algebra keywords="symplectic vector space, nondegenerate alternating bilinear form, symplectic basis, linear Darboux theorem, dimension is even, omega^n is a volume form, symplectic complement, isotropic coisotropic Lagrangian subspaces, symplectic group Sp(2n), compatible complex structure, polar decomposition, compatible triple"}

リーマン計量が各接空間の「内積」であるように、シンプレクティック形式は各接空間の「非退化な交代双線形形式」である。このページでは、その線形代数を準備する。内積が正規直交基底をもつのと同じく、シンプレクティック形式は**シンプレクティック基底**をもち、そこでは標準形 $\sum dx_{i}\wedge dy_{i}$ になる（\ref{symp:symplectic-basis}）。とくに次元は偶数で、$\omega^{n}$ は体積形式である。部分空間の「直交補空間」にあたるシンプレクティック補空間と、半分の次元の**ラグランジュ部分空間**を扱い、最後に、シンプレクティック形式と内積を結ぶ**両立する複素構造**の存在を示す（\ref{symp:compatible-complex-structure}）。これは次のページ以降のケーラー幾何の線形代数版である。

## 記法と定義の確認 {#symp:sec-la-notation}

::: notation
- $V$ は有限次元の実ベクトル空間。交代双線形形式と外積代数は \ref{lin:exterior-algebra}、$\Lambda^{2}V^{*}$ の元を交代双線形形式と同一視する（\ref{mfd:alternating-space}）。
- 実対称行列は直交行列で対角化できる（\ref{lin:spectral-theorem}）。
- $\mathbb{R}^{2n}$ の座標を $(x_{1},\dots,x_{n},y_{1},\dots,y_{n})$ とし、$J_{0}\defeq\begin{pmatrix}0&-I\\I&0\end{pmatrix}$ と書く。
:::

## シンプレクティック基底 {#symp:sec-la-basis}

::: definition シンプレクティックベクトル空間 {#symp:symplectic-vector-space keywords="symplectic form on a vector space: alternating, nondegenerate bilinear form; symplectic linear map; standard symplectic form on R^{2n}" index="シンプレクティック形式（線形）|しんぷれくてぃっくけいしきせんけい, シンプレクティックベクトル空間|しんぷれくてぃっくべくとるくうかん, 標準シンプレクティック形式|ひょうじゅんしんぷれくてぃっくけいしき"}
$V$ 上の交代双線形形式 $\omega$ が**非退化**（$\omega(u,v)=0$ がすべての $v$ で成り立てば $u=0$）であるとき、$\omega$ を**シンプレクティック形式**、$(V,\omega)$ を**シンプレクティックベクトル空間**という。線形同型 $A\colon(V,\omega)\to(V',\omega')$ で $\omega'(Au,Av)=\omega(u,v)$ となるものを**シンプレクティック同型**という。$\mathbb{R}^{2n}$ 上の
$$
\omega_{0}\defeq\sum_{i=1}^{n}dx_{i}\wedge dy_{i},\qquad\omega_{0}(u,v)=u^{\mathsf{T}}\begin{pmatrix}0&I\\-I&0\end{pmatrix}v=\langle J_{0}u,v\rangle
$$
を**標準シンプレクティック形式**という。
:::

非退化性は、$u\mapsto\omega(u,\cdot)$ が $V\to V^{*}$ の線形同型であること（次元が等しいので単射と同値）と同じである。

::: theorem シンプレクティック基底の存在 {#symp:symplectic-basis keywords="every symplectic vector space has a basis e_1..e_n, f_1..f_n with omega(e_i, f_j) = delta_ij, omega(e_i, e_j) = omega(f_i, f_j) = 0; dim V = 2n; (V, omega) is symplectically isomorphic to (R^{2n}, omega_0)" index="シンプレクティック基底|しんぷれくてぃっくきてい, 線形ダルブーの定理|せんけいだるぶーのていり"}
$(V,\omega)$ をシンプレクティックベクトル空間とする。$V$ の基底 $e_{1},\dots,e_{n},f_{1},\dots,f_{n}$ で
$$
\omega(e_{i},f_{j})=\delta_{ij},\qquad\omega(e_{i},e_{j})=\omega(f_{i},f_{j})=0
$$
となるもの（**シンプレクティック基底**）がある。とくに $\dim V$ は偶数で、$(V,\omega)$ は $(\mathbb{R}^{2n},\omega_{0})$ とシンプレクティック同型である。
:::

::: proof
$\dim V$ についての帰納法。$V=0$ なら空の基底でよい。$V\neq0$ とする。

**Step 1（一組を選ぶ）.** $e_{1}\neq0$ をとる。非退化性から $\omega(e_{1},v)\neq0$ となる $v$ があり、$f_{1}\defeq v/\omega(e_{1},v)$ とすると $\omega(e_{1},f_{1})=1$。$\omega(e_{1},e_{1})=0$（交代性）なので $f_{1}$ は $e_{1}$ の定数倍でなく、$W\defeq\mathrm{span}(e_{1},f_{1})$ は 2 次元。

**Step 2（補空間）.** $W^{\omega}\defeq\{v:\omega(v,e_{1})=\omega(v,f_{1})=0\}$ とする。【主張：$V=W\oplus W^{\omega}$ で、$\omega\restriction W^{\omega}$ は非退化】$v\in V$ について $v'\defeq v-\omega(v,f_{1})e_{1}+\omega(v,e_{1})f_{1}$ とおくと、$\omega(v',e_{1})=\omega(v,e_{1})+\omega(v,e_{1})\omega(f_{1},e_{1})=\omega(v,e_{1})-\omega(v,e_{1})=0$、$\omega(v',f_{1})=\omega(v,f_{1})-\omega(v,f_{1})\omega(e_{1},f_{1})=0$ なので $v'\in W^{\omega}$、よって $V=W+W^{\omega}$。$ae_{1}+bf_{1}\in W^{\omega}$ なら、$e_{1}$ との値から $b\,\omega(f_{1},e_{1})=-b=0$、$f_{1}$ との値から $a=0$ なので $W\cap W^{\omega}=0$。$u\in W^{\omega}$ が $W^{\omega}$ のすべての元と $\omega$ の値 $0$ をとれば、$W$ の元とも $0$（$W^{\omega}$ の定義）なので、$V$ のすべての元と $0$、非退化性から $u=0$。

**Step 3（帰納法）.** $W^{\omega}$ は次元が 2 小さいシンプレクティックベクトル空間なので、帰納法の仮定からシンプレクティック基底 $e_{2},\dots,f_{2},\dots$ をもつ。$e_{1},f_{1}$ を加えたものは、Step 2 の直和と $W^{\omega}$ の定義から $V$ のシンプレクティック基底。次元は $2+2(n-1)=2n$。最後の主張は、シンプレクティック基底を $\mathbb{R}^{2n}$ の標準基底 $\partial_{x_{i}},\partial_{y_{i}}$ に移す線形同型（$\omega_{0}(\partial_{x_{i}},\partial_{y_{j}})=\delta_{ij}$）。
:::

::: corollary 体積形式としての ω^n {#symp:omega-power keywords="an alternating form omega on a 2n-dimensional space is nondegenerate iff omega^n != 0; omega_0^n / n! = dx_1 ^ dy_1 ^ ... ^ dx_n ^ dy_n" index="シンプレクティック形式の冪|しんぷれくてぃっくけいしきのべき"}
$\dim V=2n$ の空間上の交代双線形形式 $\omega$ について、$\omega$ が非退化であることと $\omega^{n}\defeq\omega\wedge\cdots\wedge\omega\neq0$ は同値である。シンプレクティック基底の双対基底 $(e^{i},f^{i})$ では $\omega=\sum e^{i}\wedge f^{i}$ で、$\omega^{n}/n!=e^{1}\wedge f^{1}\wedge\cdots\wedge e^{n}\wedge f^{n}$。
:::

::: proof
**非退化なとき.** シンプレクティック基底で $\omega=\sum_{i}e^{i}\wedge f^{i}$（両辺の基底での値を比べる）。2 形式 $\sigma_{i}\defeq e^{i}\wedge f^{i}$ は互いに可換（偶数次）で $\sigma_{i}\wedge\sigma_{i}=0$ なので、多項定理から $\omega^{n}=n!\,\sigma_{1}\wedge\cdots\wedge\sigma_{n}\neq0$。

**退化しているとき.** $u\neq0$ で $\omega(u,\cdot)=0$ となるものがある。$u$ を含む基底 $u=b_{1},b_{2},\dots,b_{2n}$ をとると、$\omega$ をその双対基底 $b^{i}$ で書いたとき $b^{1}$ を含む項はない（$b^{1}$ を含む項は $u$ との値に現れる）。よって $\omega^{n}$ は $b^{2},\dots,b^{2n}$ だけで書けた $2n$ 形式で、$2n-1$ 個の 1 形式から作った $2n$ 次の積は $0$。
:::

## 部分空間 {#symp:sec-la-subspaces}

::: definition シンプレクティック補空間とラグランジュ部分空間 {#symp:lagrangian-subspace keywords="symplectic complement W^omega; isotropic (W in W^omega), coisotropic (W^omega in W), Lagrangian (W = W^omega), symplectic subspace" index="シンプレクティック補空間|しんぷれくてぃっくほくうかん, ラグランジュ部分空間|らぐらんじゅぶぶんくうかん, 等方部分空間|とうほうぶぶんくうかん, 余等方部分空間|よとうほうぶぶんくうかん"}
$(V,\omega)$ の部分空間 $W$ について、$W^{\omega}\defeq\{v:\omega(v,w)=0\ (w\in W)\}$ を**シンプレクティック補空間**という。$W\subset W^{\omega}$ なら**等方的**、$W^{\omega}\subset W$ なら**余等方的**、$W=W^{\omega}$ なら**ラグランジュ部分空間**、$W\cap W^{\omega}=0$ なら**シンプレクティック部分空間**という。
:::

::: proposition 補空間の次元とラグランジュ部分空間 {#symp:complement-dimension keywords="dim W + dim W^omega = dim V; (W^omega)^omega = W; isotropic subspaces have dim <= n; Lagrangian iff isotropic of dimension n; span(e_1..e_n) is Lagrangian" index="ラグランジュ部分空間の次元|らぐらんじゅぶぶんくうかんのじげん"}
$\dim V=2n$ とし、$W$ を部分空間とする。
1. $\dim W+\dim W^{\omega}=2n$、$(W^{\omega})^{\omega}=W$。
2. 等方的な部分空間の次元は $n$ 以下。$W$ がラグランジュ部分空間であることと、$W$ が等方的で $\dim W=n$ であることは同値。
3. シンプレクティック基底について $\mathrm{span}(e_{1},\dots,e_{n})$ と $\mathrm{span}(f_{1},\dots,f_{n})$ はラグランジュ部分空間である。
:::

::: proof
**1.** $\Phi\colon V\to V^{*}$, $v\mapsto\omega(v,\cdot)$ は同型。$W^{\omega}=\Phi^{-1}(W^{\perp})$（$W^{\perp}\subset V^{*}$ は $W$ を消す線形形式の空間）で、$\dim W^{\perp}=2n-\dim W$（\ref{lin:dual-properties.4}）。$W\subset(W^{\omega})^{\omega}$ は定義と交代性（$w\in W$, $v\in W^{\omega}$ なら $\omega(w,v)=-\omega(v,w)=0$）から、次元は前半を二回使って等しい。

**2.** $W\subset W^{\omega}$ なら $\dim W\le\dim W^{\omega}=2n-\dim W$ なので $\dim W\le n$。ラグランジュなら $\dim W=\dim W^{\omega}$ で $\dim W=n$。逆に等方的で $\dim W=n$ なら、$W\subset W^{\omega}$ で次元が等しいので一致。

**3.** 基底の性質から等方的で、次元 $n$。
:::

::: definition シンプレクティック群 {#symp:symplectic-group keywords="symplectic group Sp(2n, R) = {A : A^T J_0 A = J_0}; det A = 1" index="シンプレクティック群|しんぷれくてぃっくぐん"}
$(\mathbb{R}^{2n},\omega_{0})$ のシンプレクティック同型の全体 $\mathrm{Sp}(2n,\mathbb{R})\defeq\{A\in\mathrm{GL}(2n,\mathbb{R}):A^{\mathsf{T}}\Omega_{0}A=\Omega_{0}\}$（$\Omega_{0}\defeq\begin{pmatrix}0&I\\-I&0\end{pmatrix}$ は $\omega_{0}$ の行列）を**シンプレクティック群**という。
:::

$A\in\mathrm{Sp}(2n,\mathbb{R})$ について、$A^{*}\omega_{0}=\omega_{0}$ から $A^{*}(\omega_{0}^{n})=\omega_{0}^{n}$ で、$A^{*}$ は $2n$ 形式に $\det A$ を掛ける（\ref{lin:exterior-determinant}）ので $\det A=1$。

## 両立する複素構造 {#symp:sec-la-complex}

::: definition 複素構造と両立性 {#symp:compatible-triple keywords="linear complex structure J with J^2 = -1; J compatible with omega if omega(Ju, Jv) = omega(u, v) and g_J(u,v) = omega(u, Jv) is positive definite; compatible triple (omega, J, g)" index="複素構造（線形）|ふくそこうぞうせんけい, 両立する複素構造|りょうりつするふくそこうぞう, 両立する三つ組|りょうりつするみっつぐみ"}
$V$ の線形変換 $J$ で $J^{2}=-\mathrm{id}$ となるものを**複素構造**という。シンプレクティックベクトル空間 $(V,\omega)$ の複素構造 $J$ が**両立する**とは、
$$
\omega(Ju,Jv)=\omega(u,v),\qquad g_{J}(u,v)\defeq\omega(u,Jv)\text{ が正定値}
$$
となることをいう。このとき $g_{J}$ は内積で（対称性は $\omega(v,Ju)=\omega(Jv,J^{2}u)=-\omega(Jv,u)=\omega(u,Jv)$ から）、$(\omega,J,g_{J})$ を**両立する三つ組**という。
:::

$(\mathbb{R}^{2n},\omega_{0})$ では、$J_{0}$ は両立する複素構造で、$g_{J_{0}}$ は標準内積である（$\omega_{0}(u,J_{0}v)=u^{\mathsf{T}}\Omega_{0}J_{0}v$, $\Omega_{0}J_{0}=I$）。$J_{0}$ は $\mathbb{R}^{2n}=\mathbb{C}^{n}$（$z_{j}=x_{j}+iy_{j}$）の $i$ 倍にあたる。

::: theorem 両立する複素構造の存在 {#symp:compatible-complex-structure keywords="given a symplectic form omega and any inner product g, J = A (-A^2)^{-1/2} with omega(u,v) = g(Au, v) is a compatible complex structure; it depends smoothly on (omega, g)" index="両立する複素構造の存在|りょうりつするふくそこうぞうのそんざい, 極分解（シンプレクティック）|きょくぶんかいしんぷれくてぃっく"}
$(V,\omega)$ をシンプレクティックベクトル空間、$g$ を $V$ の任意の内積とする。$\omega(u,v)=g(Au,v)$ で線形変換 $A$ を定めると、$P\defeq-A^{2}$ は $g$ について正定値対称で、$J\defeq A\,P^{-1/2}$（$P^{-1/2}$ は $P$ の正の平方根の逆）は $\omega$ と両立する複素構造である。
:::

::: proof
**Step 1（$A$ の性質）.** $\omega$ の非退化性と $g$ の非退化性から $A$ は可逆。交代性から $g(Au,v)=\omega(u,v)=-\omega(v,u)=-g(Av,u)=-g(u,Av)$ なので、$A$ は $g$ について交代的（$A^{*}=-A$、$A^{*}$ は $g$ による随伴）。よって $P=-A^{2}=A^{*}A$ は対称で、$g(Pu,u)=g(Au,Au)>0$（$u\neq0$）なので正定値。

**Step 2（平方根）.** \ref{lin:spectral-theorem} から、$g$ の正規直交基底で $P=\mathrm{diag}(\mu_{1},\dots,\mu_{2n})$（$\mu_{i}>0$）と書け、$P^{1/2}\defeq\mathrm{diag}(\sqrt{\mu_{i}})$ は正定値対称で $(P^{1/2})^{2}=P$。【主張：$A$ は $P^{1/2}$ と可換】$A$ は $P=-A^{2}$ と可換なので、$P$ の各固有空間 $E_{\mu}$ を保つ（$Pu=\mu u$ なら $P(Au)=APu=\mu Au$）。$P^{1/2}$ は $E_{\mu}$ の上で $\sqrt{\mu}$ 倍なので、$A$ と可換。

**Step 3（$J$ が両立する複素構造）.** $J=AP^{-1/2}$ について、可換性から $J^{2}=A^{2}P^{-1}=-PP^{-1}=-\mathrm{id}$。$\omega(Ju,Jv)=g(AJu,Jv)$ で、$J^{*}=P^{-1/2}A^{*}=-P^{-1/2}A=-J$（$P^{-1/2}$ は対称、可換性）なので $g(AJu,Jv)=-g(JAJu,v)=-g(J^{2}Au,v)=g(Au,v)=\omega(u,v)$（$A$ と $J$ も可換）。最後に $\omega(u,Ju)=g(Au,Ju)=g(Au,AP^{-1/2}u)=g(A^{*}AP^{-1/2}u,u)=g(P^{1/2}u,u)>0$（$u\neq0$、$P^{1/2}$ は正定値）。$g_{J}$ の対称性は定義の後の注意から。

::: hypcheck
- **$g$ の正定値性**：Step 1 で $P$ が正定値であることに使い、Step 2 の平方根の存在に効いている。
- 結論の $J$ は $g$ の選び方に依存する。$g$ がすでに両立する複素構造 $J'$ の $g_{J'}$ なら、$g_{J'}(J'u,v)=\omega(J'u,J'v)=\omega(u,v)$ なので $A=J'$、$P=-J'^{2}=I$ で、構成は $J'$ 自身を返す。
:::
:::

::: supplement
**高い視点：三つの群の交わり.** 両立する三つ組 $(\omega,J,g)$ は、三つの構造群の関係として要約される：
$$
\mathrm{Sp}(2n,\mathbb{R})\cap\mathrm{O}(2n)=\mathrm{O}(2n)\cap\mathrm{GL}(n,\mathbb{C})=\mathrm{GL}(n,\mathbb{C})\cap\mathrm{Sp}(2n,\mathbb{R})=\mathrm{U}(n).
$$
三つの構造（シンプレクティック形式・内積・複素構造）のうち両立する二つを保つ変換は、自動的に三つ目も保つ（「2 out of 3」性）。これは $g$, $\omega$, $J$ の間の関係式 $g(u,v)=\omega(u,Jv)$ が、二つを決めると三つ目を決めることの言い換えである。\ref{symp:compatible-complex-structure} の構成は、線形代数の**極分解**（可逆行列 $=$ 直交行列 $\times$ 正定値対称行列）の、交代行列 $A$ への適用である：$A=JP^{1/2}$ の「直交部分」が $J$ になる。比喩で言えば、シンプレクティック形式は「面積」の測り方だけを、内積は「長さ」の測り方を決め、両立する複素構造は両者をつなぐ「90 度回転」である。

**補足.** 両立する複素構造の全体は可縮であることが知られている（ジーゲル上半空間 $\mathrm{Sp}(2n)/\mathrm{U}(n)$ と同一視できる）。これが、シンプレクティック多様体の上に両立する概複素構造がいつも存在し、その選び方が位相的には一意である理由である（\ref{mfd:page-reduction} の還元の言葉で、$\mathrm{Sp}(2n)$ から $\mathrm{U}(n)$ への還元がいつもできる）。
:::

## 問題 {#symp:sec-la-problems}

::: problem {#symp:prob-la-two-dim}
2 次元のベクトル空間の上では、0 でない交代双線形形式はすべて非退化であることを示せ。また、$\mathrm{Sp}(2,\mathbb{R})=\mathrm{SL}(2,\mathbb{R})$ であることを示せ。
:::

::: solution
基底 $b_{1},b_{2}$ について $\omega=c\,b^{1}\wedge b^{2}$（$\Lambda^{2}$ は 1 次元）で、$c\neq0$ なら $\omega^{1}=\omega\neq0$、\ref{symp:omega-power} から非退化。$A$ について $A^{*}(b^{1}\wedge b^{2})=\det A\,b^{1}\wedge b^{2}$ なので、$A^{*}\omega_{0}=\omega_{0}\iff\det A=1$。
:::

::: problem {#symp:prob-la-graph-lagrangian}
$n\times n$ 実行列 $S$ について、$L_{S}\defeq\{(x,Sx):x\in\mathbb{R}^{n}\}\subset(\mathbb{R}^{2n},\omega_{0})$ がラグランジュ部分空間であることと、$S$ が対称であることは同値であることを示せ。
:::

::: solution
$\dim L_{S}=n$ なので、\ref{symp:complement-dimension.2} から、等方的であることと同値。$\omega_{0}((x,Sx),(x',Sx'))=\sum_{i}(x_{i}(Sx')_{i}-(Sx)_{i}x'_{i})=x^{\mathsf{T}}Sx'-x^{\mathsf{T}}S^{\mathsf{T}}x'=x^{\mathsf{T}}(S-S^{\mathsf{T}})x'$。これがすべての $x,x'$ で $0$ になるのは $S=S^{\mathsf{T}}$ のとき。
:::
