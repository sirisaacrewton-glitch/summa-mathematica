# シンプレクティック多様体とハミルトン力学 {#symp:page-symplectic-manifolds keywords="symplectic manifold, closed nondegenerate 2-form, Liouville volume form, orientability, area forms on surfaces, canonical symplectic form on the cotangent bundle, tautological 1-form, cohomology class [omega]^k nonzero on compact symplectic manifolds, Hamiltonian vector field, Hamilton's equations, conservation of energy, symplectic flows, Liouville theorem, Poisson bracket, Jacobi identity"}

**シンプレクティック多様体**は、閉じた非退化 2 形式 $\omega$ をもつ多様体である。リーマン計量が「長さ」の幾何であるのに対し、シンプレクティック形式は「（向きのついた）面積」の幾何で、古典力学の相空間の幾何でもある。このページでは、定義と例（とくに余接束の標準的なシンプレクティック形式、\ref{symp:cotangent-canonical}）を述べ、コンパクトなシンプレクティック多様体のコホモロジーへの制約を示す。後半では、関数 $H$ から $i_{X_{H}}\omega=dH$ で**ハミルトンベクトル場**を作り、その流れが $\omega$ と $H$ を保つこと（エネルギー保存とリウヴィルの定理）、関数の間の**ポアソン括弧**がリー環になることを示す。

## 記法と定義の確認 {#symp:sec-sm-notation}

::: notation
- シンプレクティックベクトル空間・シンプレクティック基底・$\omega^{n}$ は \ref{symp:symplectic-vector-space}, \ref{symp:symplectic-basis}, \ref{symp:omega-power}。
- 微分形式・外微分・引き戻し・ド・ラーム・コホモロジーは \ref{mfd:differential-form}, \ref{mfd:exterior-derivative}, \ref{mfd:pullback-properties}, \ref{mfd:de-rham-cohomology}。流れ・リー微分・内部積は \ref{mfd:flow-theorem}, \ref{mfd:lie-derivative}, \ref{mfd:lie-derivative-bracket}, \ref{mfd:interior-product-properties}、さらに \ref{mfd:cartan-formula}。リー微分は $\mathcal{L}_{X}$ と書く。
- 向きと体積形式・ストークスの定理の帰結は \ref{mfd:orientable-equivalents}, \ref{mfd:stokes-corollaries}。余接束は \ref{mfd:cotangent-bundle}。
:::

## シンプレクティック多様体 {#symp:sec-sm-definition}

::: definition シンプレクティック多様体 {#symp:symplectic-manifold keywords="symplectic form on a manifold: closed 2-form which is nondegenerate at every point; symplectomorphism; Liouville volume form omega^n / n!" index="シンプレクティック多様体|しんぷれくてぃっくたようたい, シンプレクティック形式|しんぷれくてぃっくけいしき, シンプレクティック同相写像|しんぷれくてぃっくどうそうしゃぞう, リウヴィル体積形式|りうゔぃるたいせきけいしき"}
可微分多様体 $M$ 上の 2 形式 $\omega$ で、$d\omega=0$ かつ各点で $\omega_{m}$ が $T_{m}M$ のシンプレクティック形式（非退化）であるものを**シンプレクティック形式**といい、$(M,\omega)$ を**シンプレクティック多様体**という。シンプレクティック多様体の間の微分同相写像 $F$ で $F^{*}\omega'=\omega$ となるものを**シンプレクティック同相写像**という。
:::

::: proposition シンプレクティック多様体の基本性質 {#symp:symplectic-manifold-basic keywords="a symplectic manifold has even dimension 2n and omega^n is a volume form, so it is orientable; on a compact symplectic manifold [omega]^k != 0 in H^{2k} for 0 <= k <= n" index="シンプレクティック多様体の向き|しんぷれくてぃっくたようたいのむき"}
$(M,\omega)$ をシンプレクティック多様体とする。
1. $\dim M=2n$ は偶数で、$\omega^{n}$ はどの点でも $0$ にならない $2n$ 形式。とくに $M$ は向き付け可能。
2. $M$ がコンパクトで境界がなく、$M\neq\varnothing$ なら、$0\le k\le n$ について $\omega^{k}$ は閉形式で完全形式でない。とくに $H^{2k}(M)\neq0$。
:::

::: proof
**1.** 各点で \ref{symp:symplectic-basis} と \ref{symp:omega-power}。向き付け可能性は \ref{mfd:orientable-equivalents} の 3 ⇒ 1。

**2.** $d(\omega^{k})=0$ はライプニッツ則と $d\omega=0$ から。$\omega^{k}=d\eta$ とすると、$\omega^{n}=\omega^{k}\wedge\omega^{n-k}=d(\eta\wedge\omega^{n-k})$（$d\omega^{n-k}=0$）で、体積形式 $\omega^{n}$ が完全形式になり、\ref{mfd:stokes-corollaries.3} に反する（1 の向きを入れる）。
:::

たとえば、$H^{2}(S^{2n})=0$（$n\ge2$）であることが知られている（\ref{mfd:de-rham-applications}）ので、2 から、$n\ge2$ の球面 $S^{2n}$ にはシンプレクティック形式がない。

::: example シンプレクティック多様体の例 {#symp:symplectic-examples keywords="R^{2n} with omega_0; any area form on an orientable surface; products of symplectic manifolds" index="面積形式|めんせきけいしき"}
1. $(\mathbb{R}^{2n},\omega_{0})$、$\omega_{0}=\sum dx_{i}\wedge dy_{i}$（係数が定数なので閉）。
2. 向き付け可能な曲面 $\Sigma$ の体積形式（**面積形式**）は、シンプレクティック形式である（3 形式は 0 なので閉で、0 でない 2 次元の 2 形式は非退化：\ref{symp:prob-la-two-dim}）。とくに $S^{2}$ の標準計量の体積形式。
3. シンプレクティック多様体 $(M_{1},\omega_{1})$, $(M_{2},\omega_{2})$ の直積の上の $\mathrm{pr}_{1}^{*}\omega_{1}+\mathrm{pr}_{2}^{*}\omega_{2}$。
:::

3 の非退化性は、$T(M_{1}\times M_{2})=TM_{1}\oplus TM_{2}$ の上で行列がブロック対角になることから。

::: theorem 余接束の標準形式 {#symp:cotangent-canonical keywords="tautological 1-form lambda on T*M, lambda_(m,xi)(v) = xi(d pi(v)); in natural coordinates lambda = sum p_i dq_i; omega = -d lambda = sum dq_i ^ dp_i is a symplectic form; pullback of lambda by a 1-form alpha seen as a section is alpha" index="余接束のシンプレクティック形式|よせっそくのしんぷれくてぃっくけいしき, 同語反復形式|どうごはんぷくけいしき, リウヴィル形式|りうゔぃるけいしき, 正準座標|せいじゅんざひょう"}
$M$ を $n$ 次元の可微分多様体、$\pi\colon T^{*}M\to M$ を余接束とする。
1. $\lambda_{(m,\xi)}(v)\defeq\xi\bigl(d\pi_{(m,\xi)}(v)\bigr)$（$v\in T_{(m,\xi)}T^{*}M$）は $T^{*}M$ 上の滑らかな 1 形式（**同語反復形式**）で、$M$ の座標 $(q_{1},\dots,q_{n})$ から作った $T^{*}M$ の自然な座標 $(q,p)$（$\xi=\sum p_{i}dq_{i}$）で $\lambda=\sum_{i}p_{i}\,dq_{i}$。
2. $\omega\defeq-d\lambda=\sum_{i}dq_{i}\wedge dp_{i}$ は $T^{*}M$ のシンプレクティック形式である。
3. $M$ 上の 1 形式 $\alpha$ を切断 $s_{\alpha}\colon M\to T^{*}M$ とみなすと $s_{\alpha}^{*}\lambda=\alpha$。
:::

::: proof
**1.** 自然な座標で $\pi(q,p)=q$ なので、$v=\sum_{i}(a_{i}\partial_{q_{i}}+b_{i}\partial_{p_{i}})$ について $d\pi(v)=\sum a_{i}\partial_{q_{i}}$、$\lambda(v)=\xi(\sum a_{i}\partial_{q_{i}})=\sum p_{i}a_{i}$。これは $\sum p_{i}dq_{i}$ の $v$ での値。係数が滑らかなので $\lambda$ は滑らか。定義は座標を使っていないので、各座標近傍での式は貼り合う。

**2.** $-d(\sum p_{i}dq_{i})=-\sum dp_{i}\wedge dq_{i}=\sum dq_{i}\wedge dp_{i}$。閉形式（完全形式）で、各点で標準形 $\omega_{0}$ と同じ行列なので非退化。

**3.** $s_{\alpha}(m)=(m,\alpha_{m})$, $\pi\circ s_{\alpha}=\mathrm{id}$ なので、$u\in T_{m}M$ について $(s_{\alpha}^{*}\lambda)(u)=\lambda(ds_{\alpha}(u))=\alpha_{m}(d\pi(ds_{\alpha}(u)))=\alpha_{m}(u)$。
:::

3 から $s_{\alpha}^{*}\omega=-d\alpha$ なので、閉じた 1 形式のグラフ $s_{\alpha}(M)$ は $\omega$ が $0$ に制限される $n$ 次元部分多様体（**ラグランジュ部分多様体**）である。

## ハミルトンベクトル場 {#symp:sec-sm-hamiltonian}

::: definition ハミルトンベクトル場 {#symp:hamiltonian-vector-field keywords="Hamiltonian vector field X_H defined by i_{X_H} omega = dH; symplectic vector field: L_X omega = 0; Hamilton's equations q' = dH/dp, p' = -dH/dq in canonical coordinates" index="ハミルトンベクトル場|はみるとんべくとるば, ハミルトンの運動方程式|はみるとんのうんどうほうていしき, ハミルトニアン|はみるとにあん, シンプレクティックベクトル場|しんぷれくてぃっくべくとるば"}
$(M,\omega)$ をシンプレクティック多様体、$H\in C^{\infty}(M)$ とする。$i_{X_{H}}\omega=dH$ で定まるベクトル場 $X_{H}$ を、**ハミルトニアン** $H$ の**ハミルトンベクトル場**という。$\mathcal{L}_{X}\omega=0$ となるベクトル場 $X$ を**シンプレクティックベクトル場**という。
:::

$\omega$ の非退化性から、各点で $v\mapsto i_{v}\omega$ は $T_{m}M\to T_{m}^{*}M$ の同型で、その逆を $dH_{m}$ に施したものが $X_{H}(m)$ である。座標で $\omega=\sum\omega_{ij}dx_{i}\wedge dx_{j}$（$i<j$ の和を交代行列 $(\omega_{ij})$ で書く）とすると、$X_{H}$ の成分は滑らかな行列 $(\omega_{ij})^{-1}$ と $dH$ の成分の積で、$X_{H}$ は滑らか。座標 $(q,p)$ で $\omega=\sum dq_{i}\wedge dp_{i}$ なら、$X=\sum(a_{i}\partial_{q_{i}}+b_{i}\partial_{p_{i}})$ について $i_{X}\omega=\sum(a_{i}dp_{i}-b_{i}dq_{i})$ なので
$$
X_{H}=\sum_{i}\Bigl(\frac{\partial H}{\partial p_{i}}\frac{\partial}{\partial q_{i}}-\frac{\partial H}{\partial q_{i}}\frac{\partial}{\partial p_{i}}\Bigr),
$$
積分曲線は**ハミルトンの運動方程式** $\dot q_{i}=\partial H/\partial p_{i}$, $\dot p_{i}=-\partial H/\partial q_{i}$ を満たす。

::: lemma 流れによる引き戻しの微分 {#symp:flow-pullback-derivative keywords="d/dt phi_t^* omega = phi_t^* L_X omega for the flow phi of X; hence L_X omega = 0 iff the flow preserves omega" index="流れによる引き戻しの微分|ながれによるひきもどしのびぶん"}
$X$ の流れを $\phi$ とする。$(t,m)$ が流れの定義域にあるとき
$$
\frac{d}{dt}(\phi_{t}^{*}\omega)_{m}=\bigl(\phi_{t}^{*}\mathcal{L}_{X}\omega\bigr)_{m}.
$$
したがって、$\mathcal{L}_{X}\omega=0$ なら、定義される範囲で $\phi_{t}^{*}\omega=\omega$。
:::

::: proof
$s$ が小さいとき、$m$ の近くで $\phi_{t+s}=\phi_{s}\circ\phi_{t}$（\ref{mfd:flow-theorem.3}）なので、$(\phi_{t+s}^{*}\omega)_{m}=(\phi_{t})_{m}^{*}\bigl((\phi_{s}^{*}\omega)_{\phi_{t}(m)}\bigr)$。ここで $(\phi_{t})_{m}^{*}\colon\Lambda^{k}T_{\phi_{t}(m)}^{*}M\to\Lambda^{k}T_{m}^{*}M$ は $s$ によらない線形写像なので、$s$ で微分して $s=0$ とおくと、右辺は $(\phi_{t})_{m}^{*}\bigl((\mathcal{L}_{X}\omega)_{\phi_{t}(m)}\bigr)$（リー微分の定義）。後半：$t\mapsto(\phi_{t}^{*}\omega)_{m}$ は定義区間で導関数が $0$ なので定数で、$t=0$ の値 $\omega_{m}$ に等しい（定義区間は $0$ を含む区間）。
:::

::: theorem ハミルトン流の保存則 {#symp:hamiltonian-conservation keywords="Hamiltonian vector fields are symplectic; H is constant along the flow of X_H (conservation of energy); the Hamiltonian flow preserves omega and the Liouville volume (Liouville theorem); closed 1-forms give symplectic vector fields" index="エネルギー保存則|えねるぎーほぞんそく, リウヴィルの定理（ハミルトン力学）|りうゔぃるのていりはみるとんりきがく"}
$X_{H}$ の流れを $\phi$ とする。
1. $X_{H}H=0$。したがって $H$ は $X_{H}$ の積分曲線に沿って一定である（**エネルギー保存**）。
2. $\mathcal{L}_{X_{H}}\omega=0$。したがって $\phi_{t}^{*}\omega=\omega$、$\phi_{t}^{*}\omega^{n}=\omega^{n}$（**リウヴィルの定理**：ハミルトン流は体積を保つ）。
3. ベクトル場 $X$ がシンプレクティックであることと、$i_{X}\omega$ が閉形式であることは同値である。
:::

::: proof
**1.** $X_{H}H=dH(X_{H})=\omega(X_{H},X_{H})=0$（交代性）。積分曲線 $\gamma$ に沿って $\frac{d}{dt}H(\gamma(t))=dH(\dot\gamma)=(X_{H}H)(\gamma(t))=0$。

**2.** カルタンの公式から $\mathcal{L}_{X_{H}}\omega=d(i_{X_{H}}\omega)+i_{X_{H}}d\omega=d(dH)+0=0$。\ref{symp:flow-pullback-derivative} から $\phi_{t}^{*}\omega=\omega$、引き戻しはウェッジ積と可換なので $\phi_{t}^{*}\omega^{n}=(\phi_{t}^{*}\omega)^{n}=\omega^{n}$。

**3.** $\mathcal{L}_{X}\omega=d(i_{X}\omega)$（$d\omega=0$）なので。
:::

## ポアソン括弧 {#symp:sec-sm-poisson}

::: lemma リー微分と内部積の交換 {#symp:lie-interior-commutator keywords="L_X i_Y - i_Y L_X = i_{[X,Y]} on differential forms" index="リー微分と内部積の交換関係|りーびぶんとないぶせきのこうかんかんけい"}
$X,Y\in\mathfrak{X}(M)$ と微分形式 $\omega$ について $\mathcal{L}_{X}(i_{Y}\omega)-i_{Y}(\mathcal{L}_{X}\omega)=i_{[X,Y]}\omega$。
:::

::: proof
$D\defeq\mathcal{L}_{X}i_{Y}-i_{Y}\mathcal{L}_{X}-i_{[X,Y]}$ とおき、$D=0$ を示す。

**Step 1（$C^{\infty}$ 線形性）.** $\mathcal{L}_{X}(f\eta)=(Xf)\eta+f\mathcal{L}_{X}\eta$（カルタンの公式の後半で $\omega=f$ とし、$\mathcal{L}_{X}f=Xf$）を使うと、$\mathcal{L}_{X}i_{Y}(f\omega)=(Xf)i_{Y}\omega+f\mathcal{L}_{X}i_{Y}\omega$、$i_{Y}\mathcal{L}_{X}(f\omega)=(Xf)i_{Y}\omega+fi_{Y}\mathcal{L}_{X}\omega$ で、差では $Xf$ の項が消える。よって $D(f\omega)=fD\omega$。\ref{riem:tensoriality-lemma} と同じ議論で、$(D\omega)_{m}$ は $\omega_{m}$ だけで決まり、とくに座標近傍の上で計算してよい。

**Step 2（反微分性）.** $\mathcal{L}_{X}$ はウェッジ積の微分（次数 0）、$i_{Y}$, $i_{[X,Y]}$ は次数 $-1$ の反微分なので、$\omega\in\Omega^{k}$ について
$$
D(\omega\wedge\eta)=D\omega\wedge\eta+(-1)^{k}\omega\wedge D\eta
$$
（$\mathcal{L}_{X}i_{Y}(\omega\wedge\eta)$ と $i_{Y}\mathcal{L}_{X}(\omega\wedge\eta)$ を展開すると、$\mathcal{L}_{X}\omega\wedge i_{Y}\eta$ 型の項が両方に同じ符号 $(-1)^{k}$ で現れて打ち消し合う）。

**Step 3（1 形式と関数）.** 関数 $f$ について $Df=0$（内部積は $0$）。$df$ について $\mathcal{L}_{X}(i_{Y}df)=X(Yf)$, $i_{Y}\mathcal{L}_{X}df=i_{Y}d(Xf)=Y(Xf)$（$\mathcal{L}_{X}$ と $d$ は可換）、$i_{[X,Y]}df=[X,Y]f$ なので $D(df)=0$。座標近傍の上では $k$ 形式は $\sum f_{I}dx_{i_{1}}\wedge\cdots\wedge dx_{i_{k}}$ と書けるので、Step 1・2 から $D=0$。
:::

::: definition ポアソン括弧 {#symp:poisson-bracket keywords="Poisson bracket {F, G} = omega(X_F, X_G) = X_G F; in canonical coordinates sum dF/dq dG/dp - dF/dp dG/dq; dF/dt = {F, H} along the Hamiltonian flow" index="ポアソン括弧|ぽあそんかっこ"}
$F,G\in C^{\infty}(M)$ について $\{F,G\}\defeq\omega(X_{F},X_{G})$ を**ポアソン括弧**という。$\omega(X_{F},X_{G})=dF(X_{G})=X_{G}F$ で、座標 $(q,p)$ では
$$
\{F,G\}=\sum_{i}\Bigl(\frac{\partial F}{\partial q_{i}}\frac{\partial G}{\partial p_{i}}-\frac{\partial F}{\partial p_{i}}\frac{\partial G}{\partial q_{i}}\Bigr).
$$
$X_{H}$ の積分曲線に沿って $\frac{d}{dt}F=X_{H}F=\{F,H\}$。
:::

::: theorem ポアソン括弧はリー環 {#symp:poisson-lie-algebra keywords="the Poisson bracket is bilinear, antisymmetric, satisfies the Leibniz rule and the Jacobi identity; [X_F, X_G] = -X_{F,G}; F is a conserved quantity of H iff {F,H} = 0" index="ポアソン括弧のヤコビ恒等式|ぽあそんかっこのやこびこうとうしき, 保存量|ほぞんりょう"}
1. $\{\ ,\ \}$ は双線形・交代的で、$\{F,GH\}=\{F,G\}H+G\{F,H\}$。
2. $[X_{F},X_{G}]=-X_{\{F,G\}}$。
3. （ヤコビ恒等式）$\{F,\{G,H\}\}+\{G,\{H,F\}\}+\{H,\{F,G\}\}=0$。

したがって $(C^{\infty}(M),\{\ ,\ \})$ はリー環である。また、$F$ が $X_{H}$ の積分曲線に沿って一定（$H$ の**保存量**）であることと $\{F,H\}=0$ は同値である。
:::

::: proof
**1.** $\omega$ の双線形性と交代性、$X_{F}$ の $F$ についての線形性（$dF$ について線形）から。ライプニッツ則：$\{F,GH\}=X_{GH}F$ で、$d(GH)=GdH+HdG$ から $X_{GH}=GX_{H}+HX_{G}$。

**2.** \ref{symp:lie-interior-commutator} と $\mathcal{L}_{X_{F}}\omega=0$（\ref{symp:hamiltonian-conservation.2}）から
$$
i_{[X_{F},X_{G}]}\omega=\mathcal{L}_{X_{F}}(i_{X_{G}}\omega)=\mathcal{L}_{X_{F}}dG=d(X_{F}G)=d\{G,F\}=-d\{F,G\}.
$$
非退化性から $[X_{F},X_{G}]=-X_{\{F,G\}}$。

**3.** $\{F,\{G,H\}\}=X_{\{G,H\}}F=-[X_{G},X_{H}]F=-X_{G}X_{H}F+X_{H}X_{G}F=-X_{G}\{F,H\}+X_{H}\{F,G\}=-\{\{F,H\},G\}+\{\{F,G\},H\}$。交代性で書き直すと $-\{\{F,H\},G\}=-\{G,\{H,F\}\}$, $\{\{F,G\},H\}=-\{H,\{F,G\}\}$ なので、移項すればヤコビ恒等式。保存量の主張は定義の後の式から。
:::

::: supplement
**高い視点：対称性と保存量、シンプレクティック幾何としての力学.** ハミルトン形式の力学では、状態の空間（相空間）はシンプレクティック多様体で、時間発展はハミルトニアン $H$ の流れ、観測量は関数で、その時間変化は $\dot F=\{F,H\}$ で与えられる。ポアソン括弧の反対称性から、「$F$ が $H$ の保存量」と「$H$ が $F$ の流れで不変」は同じことである（$\{F,H\}=0=\{H,F\}$）。これがネーターの定理のハミルトン形式での姿で、たとえば $\mathbb{R}^{3}$ の回転に対応する関数（角運動量）が $H$ の保存量であることは、$H$ が回転不変であることと同値である。量子力学では、ポアソン括弧が作用素の交換子 $\frac{1}{i\hbar}[\hat F,\hat G]$ に置き換わる（正準量子化）。比喩で言えば、シンプレクティック形式は「位置と運動量を対にする」規則で、この規則が保存される限り、相空間の体積（可能な状態の量）は時間発展で増えも減りもしない。

**補足.** リーマン多様体の測地流（\ref{riem:geodesic-flow}）は、計量で $TM\cong T^{*}M$ と同一視すると、$T^{*}M$ の標準形式とハミルトニアン $H(q,p)=\frac12\sum g^{ij}(q)p_{i}p_{j}$ のハミルトン流になることが知られている。
:::

## 問題 {#symp:sec-sm-problems}

::: problem {#symp:prob-sm-harmonic-oscillator}
$(\mathbb{R}^{2},dq\wedge dp)$ で $H=\frac12(q^{2}+p^{2})$ のハミルトン流を求め、それが原点のまわりの回転で、面積を保つことを確かめよ。
:::

::: solution
$X_{H}=p\,\partial_{q}-q\,\partial_{p}$ で、方程式 $\dot q=p$, $\dot p=-q$ の解は $q(t)=q_{0}\cos t+p_{0}\sin t$, $p(t)=-q_{0}\sin t+p_{0}\cos t$。これは角 $-t$ の回転で、行列式は $1$ なので面積を保つ（\ref{symp:hamiltonian-conservation.2} とも整合）。$q^{2}+p^{2}$ は一定。
:::

::: problem {#symp:prob-sm-angular-momentum}
$(T^{*}\mathbb{R}^{2}=\mathbb{R}^{4},\sum dq_{i}\wedge dp_{i})$ で $L\defeq q_{1}p_{2}-q_{2}p_{1}$（角運動量）とする。$H=\frac12(p_{1}^{2}+p_{2}^{2})+V(q_{1}^{2}+q_{2}^{2})$（$V$ は滑らか）について $\{L,H\}=0$ を示せ。
:::

::: solution
$\partial L/\partial q_{1}=p_{2}$, $\partial L/\partial q_{2}=-p_{1}$, $\partial L/\partial p_{1}=-q_{2}$, $\partial L/\partial p_{2}=q_{1}$。$\partial H/\partial p_{i}=p_{i}$, $\partial H/\partial q_{i}=2q_{i}V'$。よって $\{L,H\}=p_{2}p_{1}-p_{1}p_{2}-(-q_{2})(2q_{1}V')-q_{1}(2q_{2}V')=0$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{symp:sec-ssm-exercises} にまとめた。
