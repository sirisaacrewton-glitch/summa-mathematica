# ガウスの驚異の定理 {#surf:page-theorema-egregium keywords="Gauss formula, Weingarten formula, Christoffel symbols of the first and second kind, Gauss equation, Codazzi-Mainardi equations, integrability conditions, Riemann curvature tensor of a surface, Theorema Egregium, Gauss curvature is intrinsic, orthogonal coordinates, Brioschi formula, isothermal coordinates, fundamental theorem of surface theory, Bonnet theorem"}

前のページ（\ref{surf:page-second-fundamental-form}）では、ガウス曲率 $K=\det h/\det g$ を第二基本形式、すなわち曲面が空間の中でどう曲がっているかを使って定義した。このページの主定理は、それにもかかわらず $K$ は**第一基本形式とその偏微分だけで書ける**というガウスの**驚異の定理**（Theorema Egregium）である。とくに、等長な曲面（曲面の上で測れる長さが同じ曲面）はガウス曲率も同じであり、球面の一部をゆがめずに平面に写す地図は存在しない。証明では、ガウス標構 $(f_{1},f_{2},n)$ の偏微分を同じ標構で表す式（ガウスの公式とワインガルテンの公式）を書き、3 階の偏微分の順序交換から**ガウス方程式**と**コダッツィ＝マイナルディ方程式**を導く。

> 資料：Klingenberg『A Course in Differential Geometry』第 3 章 3.8 と同じ標準的な内容。添字の付け方は資料と変えてあり、ガウス方程式とコダッツィ＝マイナルディ方程式は 3 階の偏微分の順序交換から自分で導き直した。直交座標でのガウス曲率の公式は、驚異の定理の式から計算して導いた。曲面論の基本定理（存在）は偏微分方程式の可積分性を要するので、事実として述べる。

## 記法と定義の確認 {#surf:sec-te-notation}

::: notation
- 曲面片 $f\colon U\to\mathbb{R}^{3}$、$f_{i}=\partial f/\partial u^{i}$、$f_{ij}$、単位法ベクトル $n$ \ref{surf:surface-patch}。第一基本形式 $g_{ij}=\langle f_{i},f_{j}\rangle$ とその逆行列 $(g^{ij})$ \ref{surf:first-fundamental-form}、第二基本形式 $h_{ij}=\langle f_{ij},n\rangle$ \ref{surf:second-fundamental-form}、ワインガルテンの式 $n_{i}=-\sum_{k,l}g^{kl}h_{li}f_{k}$ \ref{surf:shape-operator-self-adjoint.2}、ガウス曲率 $K=\det(h_{ij})/\det(g_{ij})$ \ref{surf:curvature-formulas}、局所等長 \ref{surf:local-isometry}。
- 添字 $i,j,k,l,m,p$ は $1,2$ を動く。偏微分は $\partial_{l}\defeq\partial/\partial u^{l}$ と書き、関数 $\varphi$ について $\varphi_{,l}\defeq\partial_{l}\varphi$ とも書く。$(u^{1},u^{2})=(u,v)$ のとき $E_{u}=\partial_{1}E$ などと書く。
- 偏微分の順序交換 \ref{calc:ck-symmetric}（$f$ は $C^{\infty}$ 級なので、何階の偏微分でも順序によらない）。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## ガウスの公式とクリストッフェル記号 {#surf:sec-te-gauss-formula}

::: theorem ガウスの公式 {#surf:gauss-formula keywords="Gauss formula f_ij = sum_k Gamma^k_ij f_k + h_ij n; Christoffel symbols of the second kind; Weingarten formula; structure equations of a surface" index="ガウスの公式|がうすのこうしき, クリストッフェル記号|くりすとっふぇるきごう, 構造方程式|こうぞうほうていしき" refname="ガウスの公式"}
曲面片 $f$ について、$C^{\infty}$ 級の関数 $\Gamma^{k}_{ij}$（$=\Gamma^{k}_{ji}$）がただ一組あって
$$
f_{ij}=\sum_{k}\Gamma^{k}_{ij}f_{k}+h_{ij}\,n,\qquad n_{i}=-\sum_{k,l}g^{kl}h_{li}f_{k}.
\label{surf:eq-gauss-weingarten}
$$
$\Gamma^{k}_{ij}$ を（第 2 種の）**クリストッフェル記号**という。
:::

::: intuition
曲面の座標方向の速度ベクトルをもう一度微分したもの（加速度）は、接平面の成分と法線の成分に分けられ、法線の成分が第二基本形式、接平面の成分の係数がクリストッフェル記号である。法ベクトルの微分は接平面の中にあり、形作用素で表される。
:::

::: proof
各点で $(f_{1},f_{2},n)$ は $\mathbb{R}^{3}$ の基底（\ref{surf:regularity-cross-product}）なので、$f_{ij}=\sum_{k}\Gamma^{k}_{ij}f_{k}+c_{ij}n$ と一意に書ける。$n$ との内積から $c_{ij}=\langle f_{ij},n\rangle=h_{ij}$。接成分 $f_{ij}-h_{ij}n$ は $C^{\infty}$ 級の接ベクトル場なので、係数は $C^{\infty}$ 級（\ref{surf:tangent-field-coefficients}）。$f_{ij}=f_{ji}$ から $\Gamma^{k}_{ij}=\Gamma^{k}_{ji}$。$n_{i}$ の式は \ref{surf:shape-operator-self-adjoint.2}。
:::

::: proposition クリストッフェル記号は第一基本形式で決まる {#surf:christoffel-metric keywords="Gamma^k_ij = (1/2) sum_l g^{kl} (g_{jl,i} + g_{il,j} - g_{ij,l}); Christoffel symbols of the first kind Gamma_{ij,l} = <f_ij, f_l>" index="クリストッフェル記号の公式|くりすとっふぇるきごうのこうしき, 第 1 種のクリストッフェル記号|だいいっしゅのくりすとっふぇるきごう"}
$\Gamma_{ij,l}\defeq\langle f_{ij},f_{l}\rangle$（第 1 種のクリストッフェル記号）とおくと
$$
\Gamma_{ij,l}=\frac12\bigl(g_{jl,i}+g_{il,j}-g_{ij,l}\bigr),\qquad\Gamma^{k}_{ij}=\sum_{l}g^{kl}\Gamma_{ij,l}.
$$
とくに $\Gamma^{k}_{ij}$ は $g_{ij}$ とその 1 階の偏微分だけで書ける。
:::

::: proof
**Step 1.** 【主張：$g_{jl,i}=\Gamma_{ij,l}+\Gamma_{il,j}$】$g_{jl}=\langle f_{j},f_{l}\rangle$ を $u^{i}$ で微分すると $\langle f_{ji},f_{l}\rangle+\langle f_{j},f_{li}\rangle$ で、$f_{ji}=f_{ij}$, $f_{li}=f_{il}$。

**Step 2.** 【主張：$\Gamma_{ij,l}$ の式】Step 1 の式を添字を入れ替えて三つ並べると $g_{jl,i}=\Gamma_{ij,l}+\Gamma_{il,j}$、$g_{il,j}=\Gamma_{ji,l}+\Gamma_{jl,i}$、$g_{ij,l}=\Gamma_{li,j}+\Gamma_{lj,i}$。$\Gamma_{ij,l}$ は前の二つの添字について対称なので、第 1 式と第 2 式の和から第 3 式を引くと $2\Gamma_{ij,l}$ が残る。

**Step 3.** 【主張：$\Gamma^{k}_{ij}=\sum_{l}g^{kl}\Gamma_{ij,l}$】\eqref{surf:eq-gauss-weingarten} と $f_{l}$ の内積をとると、$\langle n,f_{l}\rangle=0$ から $\Gamma_{ij,l}=\sum_{m}\Gamma^{m}_{ij}g_{ml}$。両辺に $g^{lk}$ を掛けて $l$ について足す。
:::

::: example
**平面の極座標** $f(r,\theta)=(r\cos\theta,r\sin\theta,0)$：$E=1$, $F=0$, $G=r^{2}$（\ref{surf:page-regular-surfaces} の例）。$0$ でない偏微分は $G_{r}=2r$ だけなので、$\Gamma^{1}_{22}=-\frac12g^{11}G_{r}=-r$、$\Gamma^{2}_{12}=\Gamma^{2}_{21}=\frac12g^{22}G_{r}=\frac1r$、ほかは $0$。実際 $f_{\theta\theta}=-(r\cos\theta,r\sin\theta,0)=-rf_{r}$、$f_{r\theta}=(-\sin\theta,\cos\theta,0)=\frac1rf_{\theta}$。平面でもクリストッフェル記号は $0$ とは限らない（座標の選び方による）。
:::

## ガウス方程式とコダッツィ＝マイナルディ方程式 {#surf:sec-te-gauss-codazzi}

::: theorem ガウス方程式とコダッツィ＝マイナルディ方程式 {#surf:gauss-codazzi keywords="Gauss equation R^m_{ijl} = h_ij a^m_l - h_il a^m_j and Codazzi-Mainardi equations h_{ij,l} - h_{il,j} + sum_k (Gamma^k_ij h_kl - Gamma^k_il h_kj) = 0 from f_ijl = f_ilj" index="ガウス方程式|がうすほうていしき, コダッツィ＝マイナルディ方程式|こだっつぃまいなるでぃほうていしき, コダッツィ方程式|こだっつぃほうていしき, 可積分条件|かせきぶんじょうけん" refname="ガウス方程式とコダッツィ＝マイナルディ方程式"}
$a^{m}{}_{l}\defeq\sum_{q}g^{mq}h_{ql}$（形作用素の行列の成分）とし、
$$
R^{m}{}_{ijl}\defeq\Gamma^{m}_{ij,l}-\Gamma^{m}_{il,j}+\sum_{k}\bigl(\Gamma^{k}_{ij}\Gamma^{m}_{kl}-\Gamma^{k}_{il}\Gamma^{m}_{kj}\bigr)
$$
とおくと、すべての $i,j,l,m$ について
$$
R^{m}{}_{ijl}=h_{ij}\,a^{m}{}_{l}-h_{il}\,a^{m}{}_{j}\qquad\text{（ガウス方程式）},
\label{surf:eq-gauss-equation}
$$
$$
h_{ij,l}-h_{il,j}+\sum_{k}\bigl(\Gamma^{k}_{ij}h_{kl}-\Gamma^{k}_{il}h_{kj}\bigr)=0\qquad\text{（コダッツィ＝マイナルディ方程式）}.
\label{surf:eq-codazzi}
$$
:::

::: intuition
曲面の第一基本形式と第二基本形式は勝手には選べず、二つの間には、偏微分の順序を入れ替えても同じになるという条件から来る関係式がある。それがガウス方程式とコダッツィ＝マイナルディ方程式である。
:::

::: proof
**Step 1（3 階の偏微分の展開）.** 【主張：$f_{ijl}$ の $f_{m}$ 成分は $\Gamma^{m}_{ij,l}+\sum_{k}\Gamma^{k}_{ij}\Gamma^{m}_{kl}-h_{ij}a^{m}{}_{l}$、$n$ 成分は $h_{ij,l}+\sum_{k}\Gamma^{k}_{ij}h_{kl}$】\eqref{surf:eq-gauss-weingarten} の第 1 式を $u^{l}$ で微分すると
$$
f_{ijl}=\sum_{k}\Gamma^{k}_{ij,l}f_{k}+\sum_{k}\Gamma^{k}_{ij}f_{kl}+h_{ij,l}\,n+h_{ij}\,n_{l}.
$$
右辺の $f_{kl}$ に再び第 1 式を、$n_{l}$ に第 2 式 $n_{l}=-\sum_{m}a^{m}{}_{l}f_{m}$ を代入し、$f_{1},f_{2},n$ について係数をまとめる。

**Step 2（順序交換）.** 【主張：ガウス方程式とコダッツィ＝マイナルディ方程式が成り立つ】$f_{ijl}=f_{ilj}$（\ref{calc:ck-symmetric}）。$(f_{1},f_{2},n)$ は基底なので、両辺の各成分が等しい。Step 1 の式で $j$ と $l$ を入れ替えたものとの差をとると、$f_{m}$ 成分から $R^{m}{}_{ijl}-h_{ij}a^{m}{}_{l}+h_{il}a^{m}{}_{j}=0$、$n$ 成分から \eqref{surf:eq-codazzi}。

::: hypcheck
- **滑らかさ**：Step 2 の順序交換に $f$ が $C^{3}$ 級であることを使った。
- **前提「曲面片（正則）」**：$(f_{1},f_{2},n)$ が基底であること（成分の比較）に使った。
:::
:::

::: definition 曲率テンソル {#surf:curvature-tensor keywords="Riemann curvature tensor of a surface patch R_{pijl} = sum_m g_{pm} R^m_{ijl}, expressed by the first fundamental form" index="曲率テンソル|きょくりつてんそる, リーマンの曲率テンソル|りーまんのきょくりつてんそる"}
$R_{pijl}\defeq\sum_{m}g_{pm}R^{m}{}_{ijl}$ を曲面片 $f$ の**曲率テンソル**（の成分）という。定義の式と \ref{surf:christoffel-metric} から、$R_{pijl}$ は $g_{ij}$ とその 2 階までの偏微分だけで書ける。
:::

::: intuition
曲率テンソルは、クリストッフェル記号とその微分から作った量で、曲面の上での「微分の順序を入れ替えたときのずれ」を測る。定義の上では第一基本形式だけで決まる。
:::

::: corollary 曲率テンソルと第二基本形式 {#surf:curvature-tensor-second-form keywords="R_{pijl} = h_ij h_pl - h_il h_pj; R_{1221} = det(h_ij); the only independent component" index="曲率テンソルの成分|きょくりつてんそるのせいぶん"}
$R_{pijl}=h_{ij}h_{pl}-h_{il}h_{pj}$。とくに $R_{1221}=\det(h_{ij})$ で、$R_{pijl}$ はすべて $\pm R_{1221}$ か $0$ である。
:::

::: proof
ガウス方程式 \eqref{surf:eq-gauss-equation} に $g_{pm}$ を掛けて $m$ について足し、$\sum_{m}g_{pm}a^{m}{}_{l}=\sum_{m,q}g_{pm}g^{mq}h_{ql}=h_{pl}$ を使う。$(p,i,j,l)=(1,2,2,1)$ では $h_{22}h_{11}-h_{21}h_{12}=\det h$。式 $h_{ij}h_{pl}-h_{il}h_{pj}$ は $j\leftrightarrow l$ で符号を変え、$p\leftrightarrow i$ でも符号を変える（$h$ は対称）ので、$j=l$ または $p=i$ なら $0$。残るのは $\{p,i\}=\{j,l\}=\{1,2\}$ の 4 通りで、値は $\pm\det h$。
:::

## 驚異の定理 {#surf:sec-te-egregium}

::: theorem ガウスの驚異の定理 {#surf:theorema-egregium keywords="Theorema Egregium: the Gauss curvature K = R_{1221}/det(g_ij) depends only on the first fundamental form and its derivatives up to order two; isometric surfaces have the same Gauss curvature" index="驚異の定理|きょういのていり, ガウスの驚異の定理|がうすのきょういのていり, テオレマ・エグレギウム|ておれまえぐれぎうむ" refname="ガウスの驚異の定理"}
曲面片 $f$ のガウス曲率は
$$
K=\frac{R_{1221}}{\det(g_{ij})}
$$
で与えられ、右辺は第一基本形式 $g_{ij}$ とその 2 階までの偏微分だけで書ける。とくに、同じ $U$ 上の等長な曲面片 $f,\tilde f$（$g_{ij}=\tilde g_{ij}$）のガウス曲率は等しい。
:::

::: intuition
ガウス曲率は曲面が空間の中でどう曲がっているかから定義したのに、実は曲面の上で長さを測るだけで計算できる。だから、曲面を伸び縮みさせずに曲げても（紙を丸めるように）ガウス曲率は変わらない。
:::

::: proof
**Step 1.** 【主張：$K=R_{1221}/\det g$】$K=\det h/\det g$（\ref{surf:curvature-formulas}）と $R_{1221}=\det h$（\ref{surf:curvature-tensor-second-form}）。

**Step 2.** 【主張：右辺は $g_{ij}$ とその 2 階までの偏微分で書ける】$R_{1221}=\sum_{m}g_{1m}R^{m}{}_{221}$ で、$R^{m}{}_{221}$ は $\Gamma^{k}_{ij}$ とその 1 階の偏微分の多項式。$\Gamma^{k}_{ij}$ は $g_{ij}$, $g^{ij}$ と $g_{ij}$ の 1 階の偏微分で書け（\ref{surf:christoffel-metric}）、$g^{ij}$ は $g_{ij}$ の有理式（\ref{calc:ck-composition}）。

**Step 3.** 【主張：等長な曲面片のガウス曲率は等しい】$g_{ij}=\tilde g_{ij}$ が $U$ 上で成り立てば、偏微分も等しいので、Step 2 の式から $K=\tilde K$。

::: hypcheck
- **前提「同じ $U$ 上で $g_{ij}=\tilde g_{ij}$」**：Step 3 で偏微分まで一致することに使った。1 点で第一基本形式が一致するだけでは足りない（その点のまわりで一致する必要がある）。
- **逆は成り立たない**：二つの曲面片のガウス曲率が対応する点で等しくても、その対応が長さを保つとは限らない（\ref{surf:prob-te-converse}）。
:::
:::

::: corollary 球面の地図 {#surf:no-isometric-map-sphere keywords="no open piece of a sphere is isometric to a piece of the plane; there is no map preserving all distances" index="球面と平面の等長性|きゅうめんとへいめんのとうちょうせい, 地図の不可能性|ちずのふかのうせい"}
半径 $r$ の球面の局所パラメータ表示 $f\colon U\to\mathbb{R}^{3}$ について、同じ $U$ 上の平面の曲面片 $\tilde f$（像が平面に含まれるもの）で $f$ と等長なものは存在しない。
:::

::: proof
平面の曲面片では $n$ が定数なので $h_{ij}=0$、$\tilde K=0$。球面では $K=\frac1{r^{2}}$（\ref{surf:page-second-fundamental-form} の例）。驚異の定理から等長なら $K=\tilde K$ で、矛盾。
:::

::: intuition
地球の表面の一部を、長さの比をどこでも正しく保ったまま平らな紙の地図に描くことはできない。どの地図も、どこかで長さをゆがめている。
:::

::: proposition 直交座標でのガウス曲率 {#surf:orthogonal-curvature-formula keywords="Gauss curvature in orthogonal coordinates F = 0: K = -1/(2 sqrt(EG)) [ (E_v/sqrt(EG))_v + (G_u/sqrt(EG))_u ]; E = 1: K = -(sqrt G)_uu / sqrt G; isothermal coordinates E = G = lambda: K = -Delta log lambda / (2 lambda)" index="直交座標でのガウス曲率|ちょっこうざひょうでのがうすきょくりつ, 等温座標|とうおんざひょう"}
$F\equiv0$ なら
$$
K=-\frac{1}{2\sqrt{EG}}\left[\Bigl(\frac{E_{v}}{\sqrt{EG}}\Bigr)_{v}+\Bigl(\frac{G_{u}}{\sqrt{EG}}\Bigr)_{u}\right].
$$
とくに
1. $E\equiv1$, $F\equiv0$ なら $K=-\dfrac{(\sqrt{G})_{uu}}{\sqrt{G}}$。
2. $E=G=\lambda$, $F\equiv0$（**等温座標**）なら $K=-\dfrac{\Delta\log\lambda}{2\lambda}$（$\Delta=\partial_{u}^{2}+\partial_{v}^{2}$）。
:::

::: proof
**Step 1（クリストッフェル記号）.** 【主張：$\Gamma^{1}_{11}=\frac{E_{u}}{2E}$, $\Gamma^{1}_{12}=\frac{E_{v}}{2E}$, $\Gamma^{1}_{22}=-\frac{G_{u}}{2E}$, $\Gamma^{2}_{11}=-\frac{E_{v}}{2G}$, $\Gamma^{2}_{12}=\frac{G_{u}}{2G}$, $\Gamma^{2}_{22}=\frac{G_{v}}{2G}$】$g=\operatorname{diag}(E,G)$, $g^{-1}=\operatorname{diag}(\frac1E,\frac1G)$ を \ref{surf:christoffel-metric} に代入する。たとえば $\Gamma^{1}_{22}=\frac{1}{2E}(g_{21,2}+g_{21,2}-g_{22,1})=-\frac{G_{u}}{2E}$。

**Step 2（$R_{1221}$）.** 【主張：$R_{1221}=-\frac12(E_{vv}+G_{uu})+\frac{E_{u}G_{u}}{4E}+\frac{E_{v}^{2}}{4E}+\frac{E_{v}G_{v}}{4G}+\frac{G_{u}^{2}}{4G}$】$g_{12}=0$ なので $R_{1221}=E\,R^{1}{}_{221}$ で、定義から
$$
\begin{aligned}
R^{1}{}_{221}={}&\Gamma^{1}_{22,1}-\Gamma^{1}_{21,2}+\Gamma^{1}_{22}\Gamma^{1}_{11}+\Gamma^{2}_{22}\Gamma^{1}_{21}\\
&-\Gamma^{1}_{21}\Gamma^{1}_{12}-\Gamma^{2}_{21}\Gamma^{1}_{22}.
\end{aligned}
$$
Step 1 を代入すると、$E\,\Gamma^{1}_{22,1}=-\frac12G_{uu}+\frac{G_{u}E_{u}}{2E}$、$-E\,\Gamma^{1}_{21,2}=-\frac12E_{vv}+\frac{E_{v}^{2}}{2E}$、残りの 4 項に $E$ を掛けたものは $-\frac{G_{u}E_{u}}{4E}+\frac{G_{v}E_{v}}{4G}-\frac{E_{v}^{2}}{4E}+\frac{G_{u}^{2}}{4G}$。足して整理する。

**Step 3（公式との比較）.** 【主張：主張の右辺は $R_{1221}/(EG)$ に等しい】$W\defeq\sqrt{EG}$ とすると $W_{u}=\frac{E_{u}G+EG_{u}}{2W}$ なので
$$
-\frac{1}{2W}\Bigl(\frac{G_{u}}{W}\Bigr)_{u}=-\frac{G_{uu}}{2EG}+\frac{G_{u}E_{u}}{4E^{2}G}+\frac{G_{u}^{2}}{4EG^{2}},
$$
同様に $-\frac{1}{2W}(\frac{E_{v}}{W})_{v}=-\frac{E_{vv}}{2EG}+\frac{E_{v}^{2}}{4E^{2}G}+\frac{E_{v}G_{v}}{4EG^{2}}$。和は Step 2 の $R_{1221}$ を $EG$ で割ったもので、驚異の定理から $K$ に等しい。

**Step 4（特別な場合）.** 【主張：1 と 2 の式】1：$E=1$ なら $E_{v}=0$ で、$\frac{G_{u}}{\sqrt G}=2(\sqrt G)_{u}$ から $K=-\frac{1}{2\sqrt G}\cdot2(\sqrt G)_{uu}$。2：$E=G=\lambda$ なら $\sqrt{EG}=\lambda$ で、$\frac{\lambda_{u}}{\lambda}=(\log\lambda)_{u}$ などから $K=-\frac{1}{2\lambda}\bigl((\log\lambda)_{uu}+(\log\lambda)_{vv}\bigr)$。

::: hypcheck
- **前提「$F\equiv0$」**：Step 1 で $g$ が対角であることに使った（1 点でなく近傍で $F=0$ である必要がある。微分するため）。
:::
:::

::: example
1. **球面**（緯度 $\theta$ を弧長にとる）：$t=r\theta$ とすると $E=1$, $F=0$, $G=r^{2}\cos^{2}(t/r)$。$\sqrt G=r\cos(t/r)$, $(\sqrt G)_{tt}=-\frac1r\cos(t/r)$ なので $K=\frac{1}{r^{2}}$。第二基本形式を使わずに求まった。
2. **回転面**（母線を弧長で径数づけ）：$E=1$, $F=0$, $G=\rho^{2}$ なので $K=-\rho''/\rho$。\ref{surf:revolution-curvature} と一致する。
3. **円柱・円錐**：円錐 $f(s,\varphi)=(s\sin\alpha\cos\varphi,s\sin\alpha\sin\varphi,s\cos\alpha)$（$s>0$, $0<\alpha<\frac\pi2$）は $E=1$, $F=0$, $G=s^{2}\sin^{2}\alpha$ で $(\sqrt G)_{ss}=0$、$K=0$。円柱・円錐は（局所的に）平面と等長で、紙で作れる。
:::

::: fact 曲面論の基本定理 {#surf:fundamental-theorem-surfaces keywords="Bonnet's fundamental theorem of surface theory: given g positive definite and h symmetric on a simply connected domain satisfying the Gauss and Codazzi-Mainardi equations, there is a surface patch with these fundamental forms, unique up to orientation preserving rigid motions" index="曲面論の基本定理|きょくめんろんのきほんていり, ボネの定理|ぼねのていり" refname="曲面論の基本定理"}
$U\subset\mathbb{R}^{2}$ を単連結な開集合、$(g_{ij})$ を $C^{\infty}$ 級の正定値対称行列値関数、$(h_{ij})$ を $C^{\infty}$ 級の対称行列値関数とし、$g$ から \ref{surf:christoffel-metric} の式で定めた $\Gamma^{k}_{ij}$ について \eqref{surf:eq-gauss-equation}・\eqref{surf:eq-codazzi} が成り立つとする。このとき、第一基本形式が $g$、第二基本形式が $h$ である曲面片 $f\colon U\to\mathbb{R}^{3}$ が存在し、向きを保つ合同変換を除いて一意である。（Klingenberg 第 3 章 3.8 に証明がある。存在には、$f_{1},f_{2},n$ についての連立偏微分方程式 \eqref{surf:eq-gauss-weingarten} の解の存在（可積分条件がガウス方程式とコダッツィ＝マイナルディ方程式）を使う。）
:::

::: intuition
曲線の形が曲率と捩率で決まったように、曲面の形は第一基本形式と第二基本形式で決まる。ただし曲面では、二つの基本形式はガウス方程式とコダッツィ＝マイナルディ方程式をみたさなければならず、みたせば実際にその曲面が作れる。
:::

::: supplement
**一意性の部分.** 一意性は存在よりやさしく、\ref{surf:fundamental-theorem-curves.2} と同じ方法で示せる：二つの解のガウス標構を合同変換で初期点でそろえると、両者は \eqref{surf:eq-gauss-weingarten} の同じ解になる（$U$ の点を結ぶ曲線に沿って線形常微分方程式 \ref{surf:linear-ode} の一意性を使う）。

**高い視点.** 驚異の定理は、ガウス曲率が「曲面に住む者だけで測れる量」であることを示し、空間を忘れて第一基本形式（リーマン計量）だけから幾何を展開するリーマン幾何学の出発点になった。曲率テンソル $R$ は、一般の次元のリーマン多様体で定義される曲率の、2 次元での形である（2 次元では独立な成分は一つで、それがガウス曲率）。ガウス方程式とコダッツィ＝マイナルディ方程式は、$\mathbb{R}^{3}$ が平坦であることを、曲面の標構に沿って書いた式と解釈される。
:::

## 問題 {#surf:sec-te-problems}

::: problem {#surf:prob-te-stereographic}
★ 基本：単位球面の立体射影のパラメータ表示（\ref{surf:prob-rs-stereographic}）では $E=G=\lambda\defeq4/(1+u^{2}+v^{2})^{2}$, $F=0$ である。\ref{surf:orthogonal-curvature-formula.2} を使って $K=1$ を確かめよ。
:::

::: solution
$\log\lambda=\log4-2\log(1+u^{2}+v^{2})$。$s\defeq1+u^{2}+v^{2}$ とすると $(\log s)_{u}=\frac{2u}{s}$, $(\log s)_{uu}=\frac{2}{s}-\frac{4u^{2}}{s^{2}}$、同様に $v$ について。和は $\Delta\log s=\frac4s-\frac{4(u^{2}+v^{2})}{s^{2}}=\frac{4}{s^{2}}$。よって $\Delta\log\lambda=-\frac{8}{s^{2}}$ で、$K=-\frac{\Delta\log\lambda}{2\lambda}=\frac{8/s^{2}}{8/s^{2}}=1$。
:::

::: problem {#surf:prob-te-not-realizable}
★ 基本：$E=G=1$, $F=0$, $L=N=1$, $M=0$（$U=\mathbb{R}^{2}$ 上の定数）を第一・第二基本形式にもつ曲面片は存在しないことを示せ。
:::

::: solution
存在すれば、第二基本形式から $K=\frac{LN-M^{2}}{EG-F^{2}}=1$。一方 $E,F,G$ は定数なので、クリストッフェル記号はすべて $0$（\ref{surf:christoffel-metric}）で、$R_{1221}=0$、驚異の定理から $K=0$。矛盾。（ガウス方程式が成り立たない。）
:::

::: problem {#surf:prob-te-revolution-constant}
★★ 標準：母線を弧長で径数づけた回転面（$E=1$, $F=0$, $G=\rho(t)^{2}$）のガウス曲率が定数 $K_{0}$ であるための条件は $\rho''+K_{0}\rho=0$ であることを示し、$K_{0}=1$ で $\rho(t)=a\cos t$（$0<a$）のとき、母線 $(\rho,z)$ を求めよ。$a=1$ では何か。
:::

::: solution
$K=-\rho''/\rho$（\ref{surf:orthogonal-curvature-formula.1}）なので $K\equiv K_{0}\iff\rho''+K_{0}\rho=0$。$\rho=a\cos t$ なら弧長の条件 $\rho'^{2}+z'^{2}=1$ から $z'=\pm\sqrt{1-a^{2}\sin^{2}t}$（$a\le1$ なら全区間で、$a>1$ なら $|\sin t|\le1/a$ の範囲で定義される）、$z(t)=\int_{0}^{t}\sqrt{1-a^{2}\sin^{2}s}\,ds$。$a=1$ では $z=\sin t$ で、母線は単位円、曲面は単位球面。$a\neq1$ でも $K=1$ の回転面が得られる（$z$ は楕円積分）。これは球面の一部ではない：\ref{surf:revolution-curvature} の主曲率 $\kappa_{a}=\rho'z''-\rho''z'$, $\kappa_{b}=z'/\rho$ について、臍点 $\kappa_{a}=\kappa_{b}$ なら $\kappa_{b}^{2}=\kappa_{a}\kappa_{b}=K=1$ で $z'^{2}=\rho^{2}$、すなわち $1-a^{2}\sin^{2}t=a^{2}\cos^{2}t$、$a^{2}=1$ となる。よって $a\neq1$ では臍点が一つもなく、臍点だけからなる球面（\ref{surf:totally-umbilic}）の一部ではない。
:::

::: problem {#surf:prob-te-converse}
★★★ 発展：$f(u,v)=(u\cos v,u\sin v,\log u)$（$u>0$）と常らせん面 $\tilde f(u,v)=(u\cos v,u\sin v,v)$ について、$K(u,v)=\tilde K(u,v)=-\frac{1}{(1+u^{2})^{2}}$ であることを示せ（対応する点でガウス曲率は等しい）。さらに、この対応 $f(u,v)\mapsto\tilde f(u,v)$ は長さを保たないことを示せ（ガウス曲率が等しくても、この対応は等長写像ではない）。
:::

::: solution
$f$：$f_{u}=(\cos v,\sin v,\frac1u)$, $f_{v}=(-u\sin v,u\cos v,0)$ で $E=1+\frac{1}{u^{2}}$, $F=0$, $G=u^{2}$。$\tilde f$：$\tilde f_{u}=(\cos v,\sin v,0)$, $\tilde f_{v}=(-u\sin v,u\cos v,1)$ で $\tilde E=1$, $\tilde F=0$, $\tilde G=u^{2}+1$。第一基本形式が違う（$E\neq\tilde E$）ので、この対応は $u$ 方向の長さを保たない。$f$ は回転面（母線 $(u,\log u)$）なので、\ref{surf:orthogonal-curvature-formula} を $E=1+u^{-2}$, $G=u^{2}$ に使う：$\sqrt{EG}=\sqrt{u^{2}+1}$、$G_{u}/\sqrt{EG}=2u/\sqrt{1+u^{2}}$、その $u$ 微分は $\frac{2}{(1+u^{2})^{3/2}}$ なので $K=-\frac{1}{2\sqrt{1+u^{2}}}\cdot\frac{2}{(1+u^{2})^{3/2}}=-\frac{1}{(1+u^{2})^{2}}$。$\tilde f$ では $E=1$ の公式で $\sqrt{\tilde G}=\sqrt{1+u^{2}}$, $(\sqrt{\tilde G})_{uu}=(1+u^{2})^{-3/2}$ なので $\tilde K=-\frac{1}{(1+u^{2})^{2}}$。
:::
