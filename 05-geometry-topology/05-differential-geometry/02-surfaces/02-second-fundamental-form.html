# ガウス写像と曲率 {#surf:page-second-fundamental-form keywords="second fundamental form, L M N, Weingarten map, shape operator, normal curvature, Meusnier's theorem, principal curvatures, principal directions, Euler's formula, Rodrigues, Gauss curvature, mean curvature, elliptic point, hyperbolic point, parabolic point, umbilic, totally umbilic surface, surface of revolution, catenoid, helicoid, minimal surface"}

前のページ（\ref{surf:page-regular-surfaces}）の第一基本形式は曲面の上の長さを測ったが、曲面が空間の中でどう曲がっているかはわからない。このページでは、単位法ベクトル $n$ が動く様子から**第二基本形式**と**形作用素**（ワインガルテン写像）を定める。曲面上の曲線の曲率の法線成分は第二基本形式で決まり（**ムーニエの定理**）、方向ごとの曲がり方（法曲率）の最大と最小が**主曲率**になる。主曲率の積と平均が**ガウス曲率**と**平均曲率**であり、ガウス曲率の符号は曲面が接平面の片側にあるか両側にまたがるかを決める。最後に、すべての点で全方向に同じように曲がる曲面は平面か球面の一部に限ることを示す。

> 資料：Klingenberg『A Course in Differential Geometry』第 3 章 3.3〜3.5 と同じ標準的な内容。主曲率の特徴づけは、資料のラグランジュの未定乗数法の代わりに、自己随伴な形作用素の対角化とオイラーの公式で示した。曲面が接平面の片側にあるかどうかの判定（点の分類）と、ガウス写像の面積の拡大率がガウス曲率であることは、標準的な事実を補って書いた。

## 記法と定義の確認 {#surf:sec-sf-notation}

::: notation
- 曲面片 $f\colon U\to\mathbb{R}^{3}$、接平面 $T_{u}f$、単位法ベクトル $n=f_{1}\times f_{2}/|f_{1}\times f_{2}|$ \ref{surf:surface-patch}、パラメータ変換と法ベクトル \ref{surf:reparametrization-tangent}、接ベクトル場の係数 \ref{surf:tangent-field-coefficients}、第一基本形式 $(g_{ij})$, $E,F,G$ \ref{surf:first-fundamental-form}・\ref{surf:first-form-properties}。$(g^{ij})$ は $(g_{ij})$ の逆行列。
- 曲線のフレネ標構 $e_{1},e_{2}$ と曲率 $\kappa$ \ref{surf:curvature-torsion}、空間曲線の曲率の公式 \ref{surf:curvature-torsion-formulas}。
- 内積空間の自己随伴作用素と、実対称行列の直交行列による対角化 \ref{lin:adjoint}・\ref{lin:spectral-theorem.3}、正規直交基底 \ref{lin:gram-schmidt}。
- \ref{calc:multivariable-taylor}（ペアノの剰余項を含む）、連結開集合で微分が $0$ なら定数 \ref{calc:zero-derivative-constant}、偏微分の順序交換 \ref{calc:ck-symmetric}。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 第二基本形式と形作用素 {#surf:sec-sf-second-form}

::: lemma ガウス写像の微分 {#surf:gauss-map-derivative keywords="the derivatives n_i of the unit normal are tangent; h_ij = <f_ij, n> = -<f_i, n_j> is symmetric" index="ガウス写像の微分|がうすしゃぞうのびぶん"}
曲面片 $f$ の単位法ベクトル $n$ について
1. $n_{i}(u)\in T_{u}f$（$i=1,2$）。
2. $\langle f_{ij},n\rangle=-\langle f_{i},n_{j}\rangle$ で、これは $i,j$ について対称。
:::

::: proof
**1.** $\langle n,n\rangle=1$ を $u^{i}$ で微分して $2\langle n_{i},n\rangle=0$。$T_{u}f$ は $n(u)$ の直交補空間。

**2.** $\langle f_{i},n\rangle=0$ を $u^{j}$ で微分して $\langle f_{ij},n\rangle+\langle f_{i},n_{j}\rangle=0$。$f_{ij}=f_{ji}$（\ref{calc:ck-symmetric}）なので対称。
:::

::: definition 第二基本形式と形作用素 {#surf:second-fundamental-form keywords="second fundamental form h_ij = <f_ij, n>, Gauss notation L, M, N; Weingarten map (shape operator) L = -dn o df^{-1}; II(X,Y) = <L X, Y>" index="第二基本形式|だいにきほんけいしき, 形作用素|かたちさようそ, ワインガルテン写像|わいんがるてんしゃぞう, 型作用素|かたさようそ"}
曲面片 $f\colon U\to\mathbb{R}^{3}$ について
1. $h_{ij}(u)\defeq\langle f_{ij}(u),n(u)\rangle=-\langle f_{i}(u),n_{j}(u)\rangle$ とし、$\mathrm{II}_{u}(X,Y)\defeq\sum_{i,j}h_{ij}(u)X^{i}Y^{j}$（$X,Y\in\mathbb{R}^{2}$）を**第二基本形式**という。ガウスの記法で $L\defeq h_{11}$, $M\defeq h_{12}=h_{21}$, $N\defeq h_{22}$ と書く（形作用素の記号と紛れるときは $h_{ij}$ を使う）。
2. 線形写像 $\mathcal{S}_{u}\colon T_{u}f\to T_{u}f$ を $\mathcal{S}_{u}(f_{i}(u))\defeq-n_{i}(u)$（$i=1,2$）で定め、**形作用素**（ワインガルテン写像）という。すなわち $\mathcal{S}_{u}=-Dn(u)\circ Df(u)^{-1}$（$Df(u)\colon\mathbb{R}^{2}\to T_{u}f$ の逆写像との合成）。
:::

::: intuition
第二基本形式は、曲面が各方向にどれだけ法ベクトルの側へ曲がっているかを測る。形作用素は、曲面の上を少し動いたとき法ベクトルがどの向きにどれだけ傾くかを表す線形写像で、その傾き方が曲面の曲がり方そのものである。
:::

::: proposition 形作用素は自己随伴 {#surf:shape-operator-self-adjoint keywords="the shape operator is self-adjoint with respect to the first fundamental form: <S X, Y> = <X, S Y> = II(X, Y); matrix of S is G^{-1} h" index="形作用素の自己随伴性|かたちさようそのじこずいはんせい"}
$X,Y\in\mathbb{R}^{2}$、$\hat X\defeq Df(u)X$, $\hat Y\defeq Df(u)Y$ とすると
1. $\langle\mathcal{S}_{u}\hat X,\hat Y\rangle=\mathrm{II}_{u}(X,Y)=\langle\hat X,\mathcal{S}_{u}\hat Y\rangle$。とくに $\mathcal{S}_{u}$ は内積 $\langle\ ,\ \rangle$ に関して自己随伴。
2. $\mathcal{S}_{u}f_{i}=\sum_{k}a^{k}{}_{i}f_{k}$ と書くと、行列 $(a^{k}{}_{i})$ は $(g^{kl})(h_{li})$、すなわち $G^{-1}h$ である（**ワインガルテンの式** $n_{i}=-\sum_{k,l}g^{kl}h_{li}f_{k}$）。
:::

::: proof
**1.** $\langle\mathcal{S}f_{i},f_{j}\rangle=-\langle n_{i},f_{j}\rangle=h_{ji}=h_{ij}$。両辺は $\hat X,\hat Y$ について双線形なので、$\hat X=\sum X^{i}f_{i}$, $\hat Y=\sum Y^{j}f_{j}$ を代入して左の等式。右の等式は $h$ の対称性。

**2.** $\langle\mathcal{S}f_{i},f_{j}\rangle=\sum_{k}a^{k}{}_{i}g_{kj}=h_{ij}$ なので、行列で ${}^{t}A\,G=h$、$G$, $h$ は対称なので $A=G^{-1}h$。
:::

::: proposition 第二基本形式の不変性 {#surf:second-form-invariance keywords="the second fundamental form is invariant under orientation preserving changes of parameters and rigid motions, and changes sign under orientation reversing ones" index="第二基本形式の変換則|だいにきほんけいしきのへんかんそく"}
1. パラメータ変換 $\tilde f=f\circ\phi$, $u=\phi(v)$ について、$\varepsilon\defeq\operatorname{sgn}\det D\phi$ とすると $\tilde h_{ij}(v)=\varepsilon\sum_{k,l}\frac{\partial u^{k}}{\partial v^{i}}\frac{\partial u^{l}}{\partial v^{j}}h_{kl}(u)$、$\tilde{\mathcal{S}}_{v}=\varepsilon\,\mathcal{S}_{u}$。
2. 合同変換 $B(x)=Rx+b$ について、$B\circ f$ の第二基本形式は $(\det R)\,h_{ij}$、形作用素は $(\det R)\,R\,\mathcal{S}_{u}R^{-1}$。
:::

::: proof
**1.** $\tilde n=\varepsilon\,n\circ\phi$（\ref{surf:reparametrization-tangent.2}。$\varepsilon$ は $V$ の連結成分ごとに一定だが、点ごとの式なので問題ない）。$\tilde n_{i}=\varepsilon\sum_{k}\frac{\partial u^{k}}{\partial v^{i}}n_{k}$、$\tilde f_{j}=\sum_{l}\frac{\partial u^{l}}{\partial v^{j}}f_{l}$ から $\tilde h_{ij}=-\langle\tilde f_{i},\tilde n_{j}\rangle$ の式。形作用素は $\tilde{\mathcal{S}}\tilde f_{i}=-\tilde n_{i}=\varepsilon\sum_{k}\frac{\partial u^{k}}{\partial v^{i}}\mathcal{S}f_{k}=\varepsilon\mathcal{S}\tilde f_{i}$。

**2.** $(B\circ f)_{i}=Rf_{i}$ で、$Rf_{1}\times Rf_{2}=(\det R)R(f_{1}\times f_{2})$（$\langle Ra\times Rb,Rc\rangle=\det(Ra,Rb,Rc)=\det R\det(a,b,c)=\det R\langle a\times b,c\rangle=\langle(\det R)R(a\times b),Rc\rangle$）。よって法ベクトルは $(\det R)Rn$ で、$\langle Rf_{ij},(\det R)Rn\rangle=(\det R)h_{ij}$。
:::

## 曲面上の曲線と法曲率 {#surf:sec-sf-normal-curvature}

::: theorem ムーニエの定理 {#surf:meusnier keywords="Meusnier's theorem: for a unit speed curve c = f o gamma on a surface, <c'', n> = II(gamma', gamma'); if c has curvature kappa > 0 then kappa cos theta = normal curvature" index="ムーニエの定理|むーにえのていり, 法曲率|ほうきょくりつ" refname="ムーニエの定理"}
曲面片 $f$ の上の曲線 $c\defeq f\circ\gamma$（$\gamma\colon I\to U$ は $C^{\infty}$ 級）が弧長で径数づけられているとする。
1. $\langle c''(t),n(\gamma(t))\rangle=\mathrm{II}_{\gamma(t)}(\gamma'(t),\gamma'(t))$。とくに、この値は $c'(t)$（$=Df\,\gamma'(t)$）だけで決まる。
2. $c$ が $\mathbb{R}^{3}$ のフレネ曲線（曲率 $\kappa>0$）なら、$\theta(t)$ を主法線 $e_{2}(t)$ と $n(\gamma(t))$ のなす角として $\kappa(t)\cos\theta(t)=\mathrm{II}(\gamma'(t),\gamma'(t))$。
:::

::: intuition
曲面の上を進む曲線が法線の方向にどれだけ曲がるかは、通る点と進む向きだけで決まり、曲線そのものの選び方によらない。曲線の曲がり方のうち、曲面の法線の方向の成分は曲面が決め、残り（接平面の中の成分）が曲線の自由に選べる部分である。
:::

::: proof
**1.** $\langle c',n\circ\gamma\rangle=0$ を微分して $\langle c'',n\circ\gamma\rangle=-\langle c',(n\circ\gamma)'\rangle$。連鎖律から $c'=\sum_{i}\gamma^{i\prime}f_{i}$, $(n\circ\gamma)'=\sum_{j}\gamma^{j\prime}n_{j}$ なので、右辺は $-\sum_{i,j}\gamma^{i\prime}\gamma^{j\prime}\langle f_{i},n_{j}\rangle=\sum h_{ij}\gamma^{i\prime}\gamma^{j\prime}$。

**2.** 弧長パラメータでは $c''=\kappa e_{2}$（\ref{surf:curvature-torsion-formulas}）なので、1 から $\kappa\langle e_{2},n\rangle=\kappa\cos\theta=\mathrm{II}(\gamma',\gamma')$。

::: hypcheck
- **前提「弧長」**：一般のパラメータでは $\langle c'',n\rangle=\mathrm{II}(\gamma',\gamma')$ はそのまま成り立つ（1 の証明は弧長を使わない）が、$c''=\kappa e_{2}$ は弧長のときだけなので、2 は $\kappa|c'|^{2}\cos\theta=\mathrm{II}(\gamma',\gamma')$ に変わる。
:::
:::

::: definition 法曲率 {#surf:normal-curvature keywords="normal curvature in the direction of a unit tangent vector: kappa_n(X) = II(X, X)/I(X, X)" index="法曲率|ほうきょくりつ"}
$X\in\mathbb{R}^{2}\setminus\{0\}$ について $\kappa_{n}(X)\defeq\mathrm{II}_{u}(X,X)/\mathrm{I}_{u}(X,X)$ を、接ベクトル $Df(u)X$ の方向の**法曲率**という。$X$ を正の数倍しても $-X$ にしても値は変わらない。
:::

::: intuition
法曲率とは、その向きに曲面の上をまっすぐ進むと、法線の側へどれだけ曲がるかを表す数である。法線と接ベクトルを含む平面で曲面を切った切り口の曲線の、符号つきの曲率にあたる。
:::

## 主曲率・ガウス曲率・平均曲率 {#surf:sec-sf-curvatures}

::: theorem 主曲率とオイラーの公式 {#surf:principal-curvatures keywords="principal curvatures are the eigenvalues of the shape operator, principal directions are orthogonal eigenvectors; Euler's formula kappa_n = kappa_1 cos^2 + kappa_2 sin^2; max and min of normal curvature; Rodrigues" index="主曲率|しゅきょくりつ, 主方向|しゅほうこう, オイラーの公式（曲面）|おいらーのこうしき, ロドリゲスの公式|ろどりげすのこうしき" refname="主曲率とオイラーの公式"}
$u\in U$ を固定する。
1. 形作用素 $\mathcal{S}_{u}$ は、$T_{u}f$ の正規直交基底 $(e_{1},e_{2})$ で $\mathcal{S}_{u}e_{i}=\kappa_{i}e_{i}$、$\kappa_{1}\ge\kappa_{2}$ となるものをもつ。$\kappa_{1},\kappa_{2}$ を**主曲率**、$e_{1},e_{2}$ の方向を**主方向**という。
2. **（オイラーの公式）** 単位接ベクトル $\hat X=\cos\theta\,e_{1}+\sin\theta\,e_{2}$ の方向の法曲率は $\kappa_{1}\cos^{2}\theta+\kappa_{2}\sin^{2}\theta$。
3. 法曲率の最大値は $\kappa_{1}$、最小値は $\kappa_{2}$。$\kappa_{1}>\kappa_{2}$ なら、最大・最小をとる方向はそれぞれ $\pm e_{1}$, $\pm e_{2}$ だけで、法曲率を単位接ベクトルの関数とみたときの臨界点も $\pm e_{1},\pm e_{2}$ だけである。
:::

::: intuition
曲面のどの点にも、最も強く曲がる向きと最も弱く曲がる向きがあり、この二つの向きは直交する。ほかの向きの曲がり方は、この二つの曲がり方を角度に応じて混ぜたものになる。
:::

::: proof
**Step 1（1）.** 【主張：$\mathcal{S}_{u}$ は正規直交な固有ベクトルの基底をもつ】$T_{u}f$ の正規直交基底 $(b_{1},b_{2})$（\ref{lin:gram-schmidt}）について、$\mathcal{S}_{u}$ の表現行列 $(\langle\mathcal{S}b_{j},b_{i}\rangle)$ は自己随伴性（\ref{surf:shape-operator-self-adjoint.1}）から実対称行列。直交行列で対角化でき（\ref{lin:spectral-theorem.3}）、その直交行列で $(b_{i})$ を取り替えた正規直交基底が固有ベクトルからなる。固有値の大きい方を $\kappa_{1}$ とする。

**Step 2（2）.** 【主張：$\langle\mathcal{S}\hat X,\hat X\rangle=\kappa_{1}\cos^{2}\theta+\kappa_{2}\sin^{2}\theta$】$\mathcal{S}\hat X=\kappa_{1}\cos\theta\,e_{1}+\kappa_{2}\sin\theta\,e_{2}$ と正規直交性。$|\hat X|=1$ なので、\ref{surf:shape-operator-self-adjoint.1} から左辺は法曲率。

**Step 3（3）.** 【主張：最大は $\kappa_{1}$、最小は $\kappa_{2}$ で、$\kappa_{1}>\kappa_{2}$ なら臨界点は $\theta\in\frac\pi2\mathbb{Z}$ だけ】$\kappa_{1}\cos^{2}\theta+\kappa_{2}\sin^{2}\theta=\kappa_{2}+(\kappa_{1}-\kappa_{2})\cos^{2}\theta$ は $\cos^{2}\theta=1$ で最大 $\kappa_{1}$、$\cos^{2}\theta=0$ で最小 $\kappa_{2}$。$\theta$ について微分すると $-(\kappa_{1}-\kappa_{2})\sin2\theta$ で、$\kappa_{1}>\kappa_{2}$ なら $0$ になるのは $\sin2\theta=0$ のとき、すなわち $\hat X=\pm e_{1},\pm e_{2}$。

::: hypcheck
- **自己随伴性**：Step 1 で対称行列になることに使った。これは $f_{ij}=f_{ji}$（\ref{surf:gauss-map-derivative.2}）から来ている。
- **$\kappa_{1}=\kappa_{2}$ の場合**：法曲率はどの方向でも同じで、すべての方向が主方向になる（**臍点**、\ref{surf:umbilic}）。
:::
:::

::: definition ガウス曲率と平均曲率 {#surf:gauss-mean-curvature keywords="Gauss curvature K = kappa_1 kappa_2 = det S, mean curvature H = (kappa_1 + kappa_2)/2 = tr S / 2; umbilic point" index="ガウス曲率|がうすきょくりつ, 平均曲率|へいきんきょくりつ, 全曲率（ガウス）|ぜんきょくりつ"}
主曲率 $\kappa_{1},\kappa_{2}$ について、$K\defeq\kappa_{1}\kappa_{2}=\det\mathcal{S}_{u}$ を**ガウス曲率**、$H\defeq\frac12(\kappa_{1}+\kappa_{2})=\frac12\operatorname{tr}\mathcal{S}_{u}$ を**平均曲率**という。
:::

::: intuition
ガウス曲率は二つの主曲率の積で、二方向とも同じ側に曲がっていれば正（お椀の底）、反対側に曲がっていれば負（鞍の真ん中）になる。平均曲率は二つの主曲率の平均で、石けん膜のように面積を小さくしようとする曲面では 0 になる。
:::

::: proposition 曲率の計算公式 {#surf:curvature-formulas keywords="K = (LN - M^2)/(EG - F^2), H = (EN - 2FM + GL)/(2(EG - F^2)); K and H are smooth; principal curvatures are H +- sqrt(H^2 - K)" index="ガウス曲率の公式|がうすきょくりつのこうしき, 平均曲率の公式|へいきんきょくりつのこうしき"}
$$
K=\frac{LN-M^{2}}{EG-F^{2}},\qquad H=\frac{EN-2FM+GL}{2(EG-F^{2})},\qquad\kappa_{1,2}=H\pm\sqrt{H^{2}-K}.
$$
とくに $K$, $H$ は $U$ 上の $C^{\infty}$ 級関数で、$\kappa_{1},\kappa_{2}$ は連続である。
:::

::: proof
\ref{surf:shape-operator-self-adjoint.2} から $\mathcal{S}$ の表現行列は $G^{-1}h$ で、$\det(G^{-1}h)=\det h/\det G=(LN-M^{2})/(EG-F^{2})$。$G^{-1}=\frac{1}{EG-F^{2}}\begin{pmatrix}G&-F\\-F&E\end{pmatrix}$ なので $\operatorname{tr}(G^{-1}h)=\frac{GL-2FM+EN}{EG-F^{2}}$。主曲率は特性多項式 $\lambda^{2}-2H\lambda+K$ の根。$E,\dots,N$ は $C^{\infty}$ 級で $EG-F^{2}>0$ なので $K,H$ は $C^{\infty}$ 級、$H^{2}-K=\frac14(\kappa_{1}-\kappa_{2})^{2}\ge0$ の平方根は連続。
:::

::: proposition 曲率の不変性 {#surf:surface-curvature-invariance keywords="Gauss curvature is invariant under all changes of parameters and all isometries of R^3; mean curvature and principal curvatures change sign with orientation" index="ガウス曲率の不変性|がうすきょくりつのふへんせい"}
パラメータ変換 $\tilde f=f\circ\phi$ について $\tilde K=K\circ\phi$、$\tilde H=\varepsilon\,H\circ\phi$（$\varepsilon=\operatorname{sgn}\det D\phi$）。合同変換 $B$ について $B\circ f$ のガウス曲率は $K$、平均曲率は $(\det R)H$。したがって正則曲面のガウス曲率は、局所パラメータ表示と法ベクトルの向きの選び方によらずに定まり、平均曲率は符号を除いて定まる。
:::

::: proof
\ref{surf:second-form-invariance} から形作用素は $\varepsilon\mathcal{S}$（または $(\det R)R\mathcal{S}R^{-1}$）に変わる。$2\times2$ の線形写像について $\det(\varepsilon\mathcal{S})=\varepsilon^{2}\det\mathcal{S}=\det\mathcal{S}$、$\operatorname{tr}(\varepsilon\mathcal{S})=\varepsilon\operatorname{tr}\mathcal{S}$ で、相似な写像の行列式と跡は等しい。正則曲面については、二つの局所パラメータ表示は座標変換（\ref{surf:transition-smooth}）で結ばれるので、この結果から従う。
:::

::: proposition ガウス写像の面積の拡大率 {#surf:gauss-map-area keywords="n_1 x n_2 = K f_1 x f_2: the Gauss curvature is the signed area distortion of the Gauss map" index="ガウス写像と面積|がうすしゃぞうとめんせき"}
$n_{1}\times n_{2}=K\,f_{1}\times f_{2}$。とくに、$D\subset U$ がコンパクトなジョルダン可測集合なら、ガウス写像 $n\restriction D$ の面積（\ref{vec:k-area}。$n$ が正則でない点も含めて同じ式で定める）は $\int_{D}|K|\sqrt{EG-F^{2}}\,du^{1}du^{2}$。
:::

::: proof
$n_{i}=-\mathcal{S}f_{i}$ で、$\mathcal{S}$ の表現行列を $A=(a^{k}{}_{i})$ とすると $n_{1}\times n_{2}=(a^{1}{}_{1}f_{1}+a^{2}{}_{1}f_{2})\times(a^{1}{}_{2}f_{1}+a^{2}{}_{2}f_{2})=\det A\;f_{1}\times f_{2}$（$(-1)^{2}=1$。計算は \ref{surf:reparametrization-tangent.2} と同じ）。$\det A=K$。面積は $\int|n_{1}\times n_{2}|$（\ref{vec:gram-cauchy-binet}）。
:::

::: example
1. **平面**：$n$ は定数なので $\mathcal{S}=0$、$\kappa_{1}=\kappa_{2}=K=H=0$。
2. **球面**（半径 $r$、中心 $m$）：局所パラメータ表示で $f-m=\pm rn$（法ベクトルは半径方向）なので、$n_{i}=\pm f_{i}/r$、$\mathcal{S}=\mp\frac1r\mathrm{id}$。外向きの法ベクトルなら $\kappa_{1}=\kappa_{2}=-\frac1r$、内向きなら $\frac1r$。いずれも $K=\frac{1}{r^{2}}$。
3. **円柱** $f(\varphi,z)=(r\cos\varphi,r\sin\varphi,z)$：$f_{1}\times f_{2}=r(\cos\varphi,\sin\varphi,0)$ で $n=(\cos\varphi,\sin\varphi,0)$、$n_{1}=f_{1}/r$, $n_{2}=0$。主曲率は $-\frac1r$ と $0$ で、$K=0$, $H=-\frac{1}{2r}$。円柱は平面と等長（\ref{surf:page-regular-surfaces} の例）で、ガウス曲率も平面と同じ $0$ である。
:::

::: proposition 回転面の曲率 {#surf:revolution-curvature keywords="for a surface of revolution with arc length profile (rho(t), z(t)): principal curvatures rho'z'' - rho''z' and z'/rho, Gauss curvature K = -rho''/rho" index="回転面の曲率|かいてんめんのきょくりつ"}
母線 $(\rho(t),z(t))$（$\rho>0$）が弧長で径数づけられている（$\rho'^{2}+z'^{2}=1$）回転面 $f(t,\varphi)=(\rho\cos\varphi,\rho\sin\varphi,z)$ について、座標方向は主方向で、主曲率は $\rho'z''-\rho''z'$（母線の符号付き曲率）と $z'/\rho$、ガウス曲率は $K=-\rho''/\rho$。
:::

::: proof
$E=1$, $F=0$, $G=\rho^{2}$（\ref{surf:page-regular-surfaces} の例）。$f_{1}\times f_{2}=(-\rho z'\cos\varphi,-\rho z'\sin\varphi,\rho\rho')$ の長さは $\rho$ なので $n=(-z'\cos\varphi,-z'\sin\varphi,\rho')$。$f_{11}=(\rho''\cos\varphi,\rho''\sin\varphi,z'')$, $f_{12}=(-\rho'\sin\varphi,\rho'\cos\varphi,0)$, $f_{22}=(-\rho\cos\varphi,-\rho\sin\varphi,0)$ から $L=-\rho''z'+z''\rho'$, $M=0$, $N=\rho z'$。$G^{-1}h=\operatorname{diag}(L,N/\rho^{2})$ は対角なので、座標方向が主方向で主曲率は $L$ と $z'/\rho$。$K=Lz'/\rho$ で、$\rho'^{2}+z'^{2}=1$ を微分した $\rho'\rho''+z'z''=0$ から $(\rho'z''-\rho''z')z'=\rho'(-\rho'\rho'')-\rho''z'^{2}=-\rho''$。
:::

::: example
**トーラス**（$\rho=R+r\cos\theta$, $z=r\sin\theta$、母線の弧長は $t=r\theta$）：$\rho''=\frac{d^{2}\rho}{dt^{2}}=-\frac{\cos\theta}{r}$ なので $K=\dfrac{\cos\theta}{r(R+r\cos\theta)}$。外側（$|\theta|<\frac\pi2$）で $K>0$、内側で $K<0$、上下の円（$\theta=\pm\frac\pi2$）で $K=0$。
:::

## 点の分類と臍点 {#surf:sec-sf-classification}

::: definition 点の分類 {#surf:point-classification keywords="elliptic point K > 0, hyperbolic point K < 0, parabolic point K = 0 with S != 0, planar point S = 0, umbilic kappa_1 = kappa_2" index="楕円点|だえんてん, 双曲点|そうきょくてん, 放物点|ほうぶつてん, 平坦点|へいたんてん"}
曲面片 $f$ の点 $u$ は、$K(u)>0$ のとき**楕円点**、$K(u)<0$ のとき**双曲点**、$K(u)=0$ かつ $\mathcal{S}_{u}\neq0$ のとき**放物点**、$\mathcal{S}_{u}=0$ のとき**平坦点**という。
:::

::: intuition
楕円点はお椀の底のような点、双曲点は鞍（峠）のような点、放物点は円柱のように一方向にだけ曲がった点、平坦点は二次の範囲では平らな点である。
:::

::: proposition 接平面との位置関係 {#surf:tangent-plane-side keywords="near an elliptic point the surface lies on one side of its tangent plane; near a hyperbolic point it meets both sides; height function = (1/2) II + o(|Delta|^2)" index="接平面との位置関係|せっへいめんとのいちかんけい"}
$u_{0}\in U$ とし、$\eta(u)\defeq\langle f(u)-f(u_{0}),n(u_{0})\rangle$（接平面からの高さ）とする。
1. $\eta(u_{0}+\Delta)=\frac12\mathrm{II}_{u_{0}}(\Delta,\Delta)+o(|\Delta|^{2})$（$\Delta\to0$）。
2. $u_{0}$ が楕円点なら、$u_{0}$ の近傍 $U_{0}$ があって、$u\in U_{0}\setminus\{u_{0}\}$ で $\eta(u)$ は $0$ でなく符号が一定（曲面は接平面の片側にある）。
3. $u_{0}$ が双曲点なら、$u_{0}$ のどの近傍にも $\eta>0$ の点と $\eta<0$ の点がある。
:::

::: proof
**Step 1（1）.** 【主張：$\eta(u_{0}+\Delta)=\frac12\sum h_{ij}(u_{0})\Delta^{i}\Delta^{j}+o(|\Delta|^{2})$】$\eta$ は $C^{\infty}$ 級で、$\eta(u_{0})=0$、$\eta_{i}(u_{0})=\langle f_{i}(u_{0}),n(u_{0})\rangle=0$、$\eta_{ij}(u_{0})=\langle f_{ij}(u_{0}),n(u_{0})\rangle=h_{ij}(u_{0})$。\ref{calc:multivariable-taylor}（2 次、ペアノの剰余項）。

**Step 2（2）.** 【主張：楕円点では $|\mathrm{II}_{u_{0}}(\Delta,\Delta)|\ge c|\Delta|^{2}$（$c>0$）で、符号は一定】$K>0$ は $\det h>0$（\ref{surf:curvature-formulas}）と同じ。$2\times2$ の実対称行列 $h$ の固有値の積 $\det h$ が正なので、二つの固有値は同符号で、絶対値の小さい方を $c$ とすると $\mathrm{II}(\Delta,\Delta)$ は $\Delta\neq0$ で同じ符号、絶対値は $c|\Delta|^{2}$ 以上（\ref{lin:spectral-theorem.3} で対角化）。1 から、$|\Delta|$ が小さければ $o(|\Delta|^{2})$ の項の絶対値は $\frac c4|\Delta|^{2}$ 未満なので、$\eta$ の符号は $\mathrm{II}$ と同じ。

**Step 3（3）.** 【主張：双曲点では、$\mathrm{II}(\Delta_{+},\Delta_{+})>0>\mathrm{II}(\Delta_{-},\Delta_{-})$ となる $\Delta_{\pm}$ があり、$\eta(u_{0}+s\Delta_{\pm})$ は小さい $s\neq0$ で符号 $\pm$】$\det h<0$ なので固有値は異符号で、それぞれの固有ベクトルを $\Delta_{\pm}$ とする。1 から $\eta(u_{0}+s\Delta_{\pm})=\frac{s^{2}}{2}\mathrm{II}(\Delta_{\pm},\Delta_{\pm})+o(s^{2})$。

::: hypcheck
- **放物点・平坦点**：2 次の項だけでは判定できない。円柱の点（放物点）は接平面の片側にあるが、$f(u)=(u^{1},u^{2},(u^{1})^{3})$ の原点（平坦点）では両側にまたがり、$f(u)=(u^{1},u^{2},(u^{1})^{4}+(u^{2})^{4})$ の原点（平坦点）では片側にある。
:::
:::

::: definition 臍点 {#surf:umbilic keywords="umbilic point: kappa_1 = kappa_2, equivalently the shape operator is a multiple of the identity" index="臍点|さいてん, へそ点|へそてん"}
$\kappa_{1}(u)=\kappa_{2}(u)$、すなわち $\mathcal{S}_{u}=\lambda\,\mathrm{id}$（$\lambda\in\mathbb{R}$）となる点 $u$ を**臍点**という。
:::

::: intuition
臍点とは、どの向きにも同じだけ曲がっている点である。球面の点や平面の点がその例である。
:::

::: theorem 全臍的な曲面 {#surf:totally-umbilic keywords="a connected surface patch all of whose points are umbilics lies in a plane or a sphere" index="全臍的曲面|ぜんさいてききょくめん" refname="全臍的な曲面の分類"}
$U$ が連結で、曲面片 $f\colon U\to\mathbb{R}^{3}$ のすべての点が臍点なら、$f(U)$ は一つの平面か一つの球面に含まれる。
:::

::: intuition
どの点でもどの向きにも同じだけ曲がっている曲面は、平らな面か球面の一部しかない。
:::

::: proof
**Step 1.** 【主張：$\mathcal{S}=\lambda\,\mathrm{id}$ の $\lambda$ は $U$ 上の定数】$\lambda=H$ は $C^{\infty}$ 級（\ref{surf:curvature-formulas}）で、$n_{i}=-\lambda f_{i}$。これを微分すると $n_{ij}=-\lambda_{j}f_{i}-\lambda f_{ij}$。$n_{12}=n_{21}$, $f_{12}=f_{21}$（\ref{calc:ck-symmetric}）から $\lambda_{2}f_{1}=\lambda_{1}f_{2}$ で、$f_{1},f_{2}$ の一次独立性から $\lambda_{1}=\lambda_{2}=0$。$U$ は連結なので $\lambda$ は定数（\ref{calc:zero-derivative-constant}）。

**Step 2.** 【主張：$\lambda=0$ なら $f(U)$ は平面に含まれる】$n_{i}=0$ なので $n$ は定数 $n_{0}$。$\langle f,n_{0}\rangle_{i}=\langle f_{i},n_{0}\rangle=0$ なので $\langle f,n_{0}\rangle$ は定数 $d$（連結性）で、$f(U)\subset\{x\mid\langle x,n_{0}\rangle=d\}$。

**Step 3.** 【主張：$\lambda\neq0$ なら $f(U)$ は半径 $1/|\lambda|$ の球面に含まれる】$(f+\lambda^{-1}n)_{i}=f_{i}-f_{i}=0$ なので $f+\lambda^{-1}n$ は定数 $m$（連結性）。$|f-m|=|\lambda^{-1}n|=1/|\lambda|$。

::: hypcheck
- **前提「連結」**：Step 1〜3 で、微分が $0$ の関数が定数になることに使った。外すと、平面の一部と球面の一部を離して並べた曲面片が反例になる。
- **滑らかさ**：Step 1 で $n$ の 2 階の偏微分の順序交換に使った（$f$ が $C^{3}$ 級なら足りる）。
:::
:::

::: supplement
**類似の定理.** 曲線では「曲率が一定 $\kappa>0$ の平面曲線は円の一部」（\ref{surf:line-circle-characterization}）だったが、曲面では「主曲率が一定」でも球面とは限らない（円柱は主曲率 $-\frac1r$, $0$ が一定）。球面を特徴づけるのは「臍点だけからなる」という条件である。また、閉じた（コンパクトな）曲面については、ガウス曲率が一定、あるいは平均曲率が一定で埋め込まれていれば球面である（それぞれリープマンの定理、アレクサンドロフの定理として知られる。本サイトでは扱わない）。

**高い視点.** 形作用素はガウス写像 $n\colon U\to S^{2}$ の微分（の $-1$ 倍）を、$T_{u}f$ と $T_{n(u)}S^{2}=n(u)^{\perp}=T_{u}f$ を同一視して見たものである。ガウス曲率はその行列式なので、\ref{surf:gauss-map-area} のとおり「ガウス写像が面積を何倍にするか（向きも込めて）」を表す。曲線で曲率が接ベクトルの写像（\ref{surf:page-plane-curves-global} の回転数）の速さだったことの、曲面での類似である。
:::

## 問題 {#surf:sec-sf-problems}

::: problem {#surf:prob-sf-graph}
★ 基本：グラフ $f(u)=(u^{1},u^{2},h(u))$ で $h(0)=0$, $\nabla h(0)=0$ のとき、原点での第二基本形式はヘッセ行列 $(h_{ij}(0))$ に等しく、$K(0)=\det(h_{ij}(0))$, $H(0)=\frac12(h_{11}(0)+h_{22}(0))$ であることを示せ。$h=(u^{1})^{2}-(u^{2})^{2}$ の原点は何点か。
:::

::: solution
$f_{1}=(1,0,h_{1})$, $f_{2}=(0,1,h_{2})$, $n=(-h_{1},-h_{2},1)/\sqrt{1+|\nabla h|^{2}}$。原点では $n=(0,0,1)$, $g_{ij}=\delta_{ij}$, $f_{ij}=(0,0,h_{ij})$ なので $h_{ij}^{\mathrm{II}}=h_{ij}(0)$。$G=I$ から $K=\det$, $H=\frac12\operatorname{tr}$。$h=(u^{1})^{2}-(u^{2})^{2}$ ではヘッセ行列 $\operatorname{diag}(2,-2)$、$K=-4<0$ で双曲点（鞍点）。
:::

::: problem {#surf:prob-sf-catenoid-helicoid}
★★ 標準：懸垂面 $f(u,v)=(\cosh u\cos v,\cosh u\sin v,u)$ と常らせん面 $\tilde f(u,v)=(\sinh u\cos v,\sinh u\sin v,v)$ について、$H=0$（**極小曲面**）で、ガウス曲率がともに $K=-1/\cosh^{4}u$ であることを示せ（両者は等長だった：\ref{surf:prob-rs-catenoid-helicoid}）。
:::

::: solution
懸垂面：$E=G=\cosh^{2}u$, $F=0$。$f_{u}\times f_{v}=(-\cosh u\cos v,-\cosh u\sin v,\sinh u\cosh u)$ の長さは $\cosh^{2}u$ なので $n=(-\cos v,-\sin v,\sinh u)/\cosh u$。$f_{uu}=(\cosh u\cos v,\cosh u\sin v,0)$, $f_{uv}=(-\sinh u\sin v,\sinh u\cos v,0)$, $f_{vv}=(-\cosh u\cos v,-\cosh u\sin v,0)$ から $L=-1$, $M=0$, $N=1$。$H=\frac{EN+GL}{2EG}=0$, $K=\frac{LN}{EG}=-\frac{1}{\cosh^{4}u}$。

常らせん面：$\tilde E=\tilde G=\cosh^{2}u$, $\tilde F=0$。$\tilde f_{u}\times\tilde f_{v}=(\cosh u\sin v,-\cosh u\cos v,\sinh u\cosh u)$ で $\tilde n=(\sin v,-\cos v,\sinh u)/\cosh u$。$\tilde f_{uu}=(\sinh u\cos v,\sinh u\sin v,0)$, $\tilde f_{uv}=(-\cosh u\sin v,\cosh u\cos v,0)$, $\tilde f_{vv}=(-\sinh u\cos v,-\sinh u\sin v,0)$ から $\tilde L=0$, $\tilde M=-1$, $\tilde N=0$。$\tilde H=0$, $\tilde K=\frac{-1}{\cosh^{4}u}$。等長な曲面のガウス曲率が一致するのは偶然ではない（\see[ガウスの驚異の定理]{surf:page-theorema-egregium}）。
:::

::: problem {#surf:prob-sf-third-form}
★★ 標準：**第三基本形式** $\mathrm{III}_{u}(X,Y)\defeq\langle Dn(u)X,Dn(u)Y\rangle$ について、$\mathrm{III}-2H\,\mathrm{II}+K\,\mathrm{I}=0$ を示せ。
:::

::: solution
$\hat X=Df\,X$ とすると $Dn\,X=-\mathcal{S}\hat X$ なので、$\mathrm{III}(X,Y)=\langle\mathcal{S}^{2}\hat X,\hat Y\rangle$（自己随伴性）、$\mathrm{II}(X,Y)=\langle\mathcal{S}\hat X,\hat Y\rangle$、$\mathrm{I}(X,Y)=\langle\hat X,\hat Y\rangle$。ケイリー–ハミルトンの定理（$2\times2$ では直接確かめられる）から $\mathcal{S}^{2}-2H\mathcal{S}+K\,\mathrm{id}=0$（特性多項式は $\lambda^{2}-2H\lambda+K$）。
:::

::: problem {#surf:prob-sf-compact-elliptic}
★★★ 発展：$S$ をコンパクトな正則曲面とする。$S$ には楕円点（$K>0$ の点）があることを示せ。
:::

::: solution
$|x|^{2}$ は $S$ 上で最大値をとる（\ref{top:extreme-value}）。最大点を $p$、$r\defeq|p|>0$ とすると $S$ は球面 $|x|\le r$ の内側にあり、$p$ で接する。$p$ のまわりの局所パラメータ表示 $f$（$f(u_{0})=p$）について $\varphi\defeq|f|^{2}$ は $u_{0}$ で最大なので $\langle f_{i},p\rangle=0$（$\varphi_{i}(u_{0})=2\langle f_{i},p\rangle=0$。よって $T_{p}S=p^{\perp}$、$n(u_{0})=\pm p/r$）、2 階の条件から $(\varphi_{ij}(u_{0}))=2(g_{ij}+\langle f_{ij},p\rangle)$ は半負定値（\ref{calc:second-derivative-test}）。必要なら $u^{1}$ と $u^{2}$ を入れ替えて（法ベクトルの符号が変わる）$n(u_{0})=-p/r$ とすると $\langle f_{ij},p\rangle=-rh_{ij}$ なので、$rh-G$ は半正定値、すなわち $\mathrm{II}\ge\frac1r\mathrm{I}$。$X$ を $\mathcal{S}$ の固有ベクトルにとると主曲率は $\ge\frac1r$ で、$K\ge\frac{1}{r^{2}}>0$。
:::
