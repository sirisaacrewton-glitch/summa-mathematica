# ガウス＝ボネの定理（局所版） {#surf:page-gauss-bonnet-local keywords="local Gauss-Bonnet theorem, orthonormal frame, connection form, structure equation, total geodesic curvature, exterior angles, turning tangent theorem for curved triangles, geodesic triangle, angle excess, Gauss theorema elegantissimum, Girard's theorem"}

曲面の上の三角形について、内部のガウス曲率の積分、辺の測地的曲率の積分、角での外角の和を足すと、いつも $2\pi$ になる。これが**ガウス＝ボネの定理**（局所版）である。とくに辺が測地線なら、内角の和は $\pi$ と内部のガウス曲率の積分の和に等しく、球面上の三角形の内角の和は $\pi$ より大きい。平面（$K=0$）では外角の和が $2\pi$、すなわち「接ベクトルは一周でちょうど一回転する」という \ref{surf:page-plane-curves-global} の回転定理の内容になり、ガウス＝ボネの定理はその曲面版である。証明では、曲面上の正規直交標構の回転を表す**接続形式**を導入し、その外微分がガウス曲率であること（構造方程式）とグリーンの定理を使う。境界の接ベクトルの回転については、計量と三角形を連続に変形して、平面のまっすぐな三角形の場合に帰着させる。

> 資料：Klingenberg『A Course in Differential Geometry』第 6 章 6.3 と同じ内容。資料は測地座標と計量の変形を使うが、ここでは任意の座標で正規直交標構（第一基本形式によるグラム–シュミット）を使い、構造方程式 $\partial_{1}\omega_{2}-\partial_{2}\omega_{1}=-K\sqrt{\det g}$ を直接導いた。三角形の境界の回転が $2\pi$ であること（区分的に滑らかな曲線の回転定理の三角形の場合）は、計量の変形に加えて三角形の線形化による変形を使い、角度の持ち上げで連続性を確かめる形で書き下ろした。

## 記法と定義の確認 {#surf:sec-gb-notation}

::: notation
- 曲面片 $f\colon U\to\mathbb{R}^{3}$、$f_{i}$、単位法ベクトル $n$ \ref{surf:surface-patch}、第一基本形式 $g=(g_{ij})$ と面積要素 $\sqrt{\det g}\,du^{1}du^{2}$ \ref{surf:first-form-properties}・\ref{surf:length-angle-area}、ガウス曲率 $K$ と $n_{1}\times n_{2}=K\,f_{1}\times f_{2}$ \ref{surf:gauss-map-area}、共変微分 \ref{surf:covariant-derivative}・\ref{surf:covariant-derivative-properties}、測地的曲率 $\kappa_{g}$ と曲率の分解 \ref{surf:geodesic-curvature}・\ref{surf:curvature-decomposition}、測地線 \ref{surf:geodesic}。
- 角度：$\mathbf{u}(\alpha)=(\cos\alpha,\sin\alpha)$、向きのついた角 $\angle(v,w)\in(-\pi,\pi)$ \ref{surf:oriented-angle}、凸コンパクト集合上の角度の持ち上げ \ref{surf:angle-lifting}、線形常微分方程式の一意性 \ref{surf:linear-ode}。
- グリーンの定理 \tref{vec:green-theorem}、立方体の像で分割される領域 \ref{vec:cube-decomposed-region}、線積分とパラメータの取り替え \ref{vec:line-integral}・\ref{vec:line-integral-reparametrization}。
- $\mathbb{R}^{3}$ の正の向きの正規直交基底 $(a,b,c)$（$\det(a,b,c)=1$）については $a\times b=c$, $b\times c=a$, $c\times a=b$（標準基底を写す行列式 $1$ の直交行列 $R$ について $Ra\times Rb=R(a\times b)$、\ref{surf:second-form-invariance} の証明の計算）。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 正規直交標構と接続形式 {#surf:sec-gb-frame}

::: definition 正規直交標構と接続形式 {#surf:connection-form keywords="adapted orthonormal frame E_1, E_2 from Gram-Schmidt of f_1, f_2; connection form omega_i = <d_i E_1, E_2>" index="正規直交標構|せいきちょっこうひょうこう, 接続形式|せつぞくけいしき"}
曲面片 $f\colon U\to\mathbb{R}^{3}$ について、$f_{1},f_{2}$ にグラム–シュミットの直交化を施した正規直交な接ベクトル場を $E_{1},E_{2}$ とする：
$$
E_{1}\defeq\frac{f_{1}}{|f_{1}|},\qquad E_{2}\defeq\frac{f_{2}-\langle f_{2},E_{1}\rangle E_{1}}{|f_{2}-\langle f_{2},E_{1}\rangle E_{1}|}.
$$
$\omega_{i}\defeq\langle\partial_{i}E_{1},E_{2}\rangle$（$i=1,2$）とおき、1 形式 $\omega=\omega_{1}du^{1}+\omega_{2}du^{2}$ を**接続形式**という。
:::

::: intuition
曲面の各点に、接平面の中の直交する二本の単位ベクトル（標構）を滑らかに立てる。接続形式は、曲面の上を少し動いたとき、この標構が曲面の上で見てどれだけ回るかを表す。
:::

::: lemma 構造方程式 {#surf:structure-equation keywords="E_1, E_2, n is a positive orthonormal frame; d_i E_1 = omega_i E_2 + a_i n, d_i E_2 = -omega_i E_1 + b_i n; d_1 omega_2 - d_2 omega_1 = -K sqrt(det g)" index="構造方程式|こうぞうほうていしき"}
1. $(E_{1},E_{2},n)$ は各点で正の向きの正規直交基底で、$E_{1}\times E_{2}=n$, $n\times E_{1}=E_{2}$, $E_{2}\times n=E_{1}$。
2. $C^{\infty}$ 級の関数 $a_{i},b_{i}$ があって、$\partial_{i}E_{1}=\omega_{i}E_{2}+a_{i}n$, $\partial_{i}E_{2}=-\omega_{i}E_{1}+b_{i}n$, $\partial_{i}n=-a_{i}E_{1}-b_{i}E_{2}$。
3. $\partial_{1}\omega_{2}-\partial_{2}\omega_{1}=-K\sqrt{\det g}$。
:::

::: proof
**Step 1（1）.** 【主張：$E_{1}\times E_{2}=n$】$E_{1},E_{2}$ は $C^{\infty}$ 級（\ref{surf:distinguished-frame-exists} の Step 1 と同じ式）の正規直交な接ベクトル場。$f_{1}=|f_{1}|E_{1}$, $f_{2}=\langle f_{2},E_{1}\rangle E_{1}+\beta E_{2}$（$\beta>0$）なので $f_{1}\times f_{2}=|f_{1}|\beta\,E_{1}\times E_{2}$。$E_{1}\times E_{2}$ は長さ $1$（ラグランジュの恒等式）で $f_{1}\times f_{2}$ の正の倍なので $n$ に等しい。$\det(E_{1},E_{2},n)=\langle E_{1}\times E_{2},n\rangle=1$ で、残りの式は記法の最後の項目から。

**Step 2（2）.** 【主張：三つの微分の式】$|E_{1}|=1$ を微分して $\langle\partial_{i}E_{1},E_{1}\rangle=0$ なので、$\partial_{i}E_{1}$ の $E_{1}$ 成分は $0$、$E_{2}$ 成分は定義から $\omega_{i}$、$n$ 成分を $a_{i}$ とする。$\langle\partial_{i}E_{2},E_{1}\rangle=-\langle E_{2},\partial_{i}E_{1}\rangle=-\omega_{i}$、$\langle\partial_{i}E_{2},E_{2}\rangle=0$、$n$ 成分を $b_{i}$ とする。$\langle\partial_{i}n,E_{1}\rangle=-\langle n,\partial_{i}E_{1}\rangle=-a_{i}$、同様に $E_{2}$ 成分は $-b_{i}$、$n$ 成分は $0$。

**Step 3（3）.** 【主張：$\partial_{1}\omega_{2}-\partial_{2}\omega_{1}=a_{2}b_{1}-a_{1}b_{2}$】2 から $\partial_{j}\partial_{i}E_{1}=\partial_{j}\omega_{i}\,E_{2}+\omega_{i}\partial_{j}E_{2}+\partial_{j}a_{i}\,n+a_{i}\partial_{j}n$ の $E_{2}$ 成分は $\partial_{j}\omega_{i}-a_{i}b_{j}$。$\partial_{1}\partial_{2}E_{1}=\partial_{2}\partial_{1}E_{1}$（\ref{calc:ck-symmetric}）の $E_{2}$ 成分を比べて $\partial_{1}\omega_{2}-a_{2}b_{1}=\partial_{2}\omega_{1}-a_{1}b_{2}$。

**Step 4（3）.** 【主張：$a_{1}b_{2}-a_{2}b_{1}=K\sqrt{\det g}$】2 から $n_{1}\times n_{2}=(a_{1}E_{1}+b_{1}E_{2})\times(a_{2}E_{1}+b_{2}E_{2})=(a_{1}b_{2}-a_{2}b_{1})\,n$。一方 \ref{surf:gauss-map-area} から $n_{1}\times n_{2}=K\,f_{1}\times f_{2}=K|f_{1}\times f_{2}|\,n$ で、$|f_{1}\times f_{2}|=\sqrt{\det g}$（\ref{surf:first-form-properties.1}）。Step 3 と合わせて 3。

::: hypcheck
- **滑らかさ**：Step 3 で $E_{1}$ の 2 階の偏微分の順序交換に使った（$f$ が $C^{3}$ 級なら足りる）。
- **標構の選び方**：3 の左辺は標構の選び方に依存しうるが、右辺は依存しない。別の正規直交標構 $E_{1}'=\cos\phi E_{1}+\sin\phi E_{2}$ では $\omega'=\omega+d\phi$ となり、$d\omega'=d\omega$（問題 \ref{surf:prob-gb-frame-change}）。
:::
:::

::: lemma 測地的曲率と標構の回転 {#surf:geodesic-curvature-angle keywords="for a unit speed curve on a surface, c' = cos theta E_1 + sin theta E_2 with smooth theta and kappa_g = theta' + omega(gamma')" index="測地的曲率と回転角|そくちてききょくりつとかいてんかく"}
$c=f\circ\gamma\colon[a,b]\to\mathbb{R}^{3}$ を弧長で径数づけられた曲面上の曲線とする。$C^{\infty}$ 級の $\theta$ で $c'=\cos\theta\,E_{1}(\gamma)+\sin\theta\,E_{2}(\gamma)$ となるものがあり（$2\pi$ の整数倍の定数を除いて一意）、
$$
\kappa_{g}=\theta'+\omega(\gamma'),\qquad\omega(\gamma')\defeq\sum_{i}\omega_{i}(\gamma)\gamma^{i\prime}.
$$
:::

::: proof
$\alpha\defeq\langle c',E_{1}\rangle$, $\beta\defeq\langle c',E_{2}\rangle$ とすると $\alpha^{2}+\beta^{2}=1$。\ref{surf:structure-equation.1} から $e_{2}=n\times c'=\alpha E_{2}-\beta E_{1}$。$E_{1}(\gamma)$ の共変微分は、\ref{surf:structure-equation.2} の接成分から $\frac{\nabla E_{1}}{ds}=\omega(\gamma')E_{2}$、同様に $\frac{\nabla E_{2}}{ds}=-\omega(\gamma')E_{1}$。\ref{surf:covariant-derivative-properties.3} と $\frac{\nabla c'}{ds}=\kappa_{g}e_{2}$（\ref{surf:curvature-decomposition}）から
$$
\alpha'=\kappa_{g}\langle e_{2},E_{1}\rangle+\langle c',\omega E_{2}\rangle=-(\kappa_{g}-\omega(\gamma'))\beta,\qquad\beta'=(\kappa_{g}-\omega(\gamma'))\alpha.
$$
$\theta(s)\defeq\theta_{0}+\int_{a}^{s}(\kappa_{g}-\omega(\gamma'))$（$\mathbf{u}(\theta_{0})=(\alpha(a),\beta(a))$）とすると $(\cos\theta,\sin\theta)$ も同じ線形方程式をみたし、$s=a$ で一致するので、\ref{surf:linear-ode} から $(\alpha,\beta)=(\cos\theta,\sin\theta)$。$\theta$ は $C^{\infty}$ 級で $\theta'=\kappa_{g}-\omega(\gamma')$。一意性は \ref{surf:angle-lifting.2}。
:::

## 曲面上の三角形と境界の回転 {#surf:sec-gb-triangle}

::: definition 曲面上の三角形と外角 {#surf:surface-triangle keywords="triangle on a surface patch: image f(Phi(Delta)) of a plane triangle under an orientation preserving diffeomorphism; edges, positively oriented boundary, exterior angles" index="曲面上の三角形|きょくめんじょうのさんかくけい, 外角|がいかく, 内角|ないかく"}
$\Delta\subset\mathbb{R}^{2}$ を頂点 $V_{1},V_{2},V_{3}$ の閉三角形で $\det(V_{2}-V_{1},V_{3}-V_{1})>0$（反時計回り）とし、$\Phi$ を $\Delta$ の開近傍から $U$ の開集合への $C^{\infty}$ 級の微分同相写像で $\det D\Phi>0$ とする。$P\defeq f(\Phi(\Delta))$ を曲面上の**三角形**という。
1. **辺**：$j=1,2,3$（添字は $3$ を法として考える）について、$\sigma_{j}(s)\defeq\Phi(V_{j}+s(V_{j+1}-V_{j}))$（$0\le s\le1$）とし、$c_{j}\defeq f\circ\sigma_{j}$。
2. **外角**：$t_{j}^{-}\defeq c_{j}'(1)/|c_{j}'(1)|$（頂点 $f(\Phi(V_{j+1}))$ に入る向き）、$t_{j+1}^{+}\defeq c_{j+1}'(0)/|c_{j+1}'(0)|$（出る向き）を、正規直交基底 $(E_{1},E_{2})$ に関する成分で $\mathbf{u}(\cdot)$ の形に書いたものの間の向きのついた角 $\alpha_{j+1}\defeq\angle(t_{j}^{-},t_{j+1}^{+})\in(-\pi,\pi)$ を外角、$\beta_{j+1}\defeq\pi-\alpha_{j+1}$ を**内角**という。
:::

::: intuition
曲面の上の三角形とは、平面の三角形を、折れ目もつぶれもなく、向きを保って曲面に貼りつけたものである。外角は、頂点で進む向きを変える角度で、内角はその頂点での三角形の開き具合である。
:::

::: remark
外角は $\pm\pi$ にならない（したがって $\angle$ が定義される）：頂点 $V_{j+1}$ で、入る辺と出る辺の向き $V_{j+1}-V_{j}$, $V_{j+2}-V_{j+1}$ は一次独立で、$D(f\circ\Phi)$ は単射なので、$t_{j}^{-}$ と $t_{j+1}^{+}$ も一次独立。とくに $t_{j+1}^{+}\neq-t_{j}^{-}$。
:::

::: lemma 三角形の境界の回転 {#surf:triangle-turning keywords="turning tangent theorem for curved triangles: total rotation of the boundary tangent relative to an orthonormal frame plus the exterior angles equals 2 pi; proof by deforming the metric and linearizing the triangle" index="三角形の境界の回転|さんかくけいのきょうかいのかいてん"}
曲面上の三角形 $P=f(\Phi(\Delta))$ の各辺 $c_{j}$ を弧長で径数づけ、\ref{surf:geodesic-curvature-angle} の $\theta_{j}$（辺 $c_{j}$ の接ベクトルの、標構 $(E_{1},E_{2})$ に対する角）をとると
$$
\sum_{j=1}^{3}\bigl(\theta_{j}(\text{終点})-\theta_{j}(\text{始点})\bigr)+\sum_{j=1}^{3}\alpha_{j}=2\pi.
$$
:::

::: intuition
三角形の境界を一周すると、進む向きは、辺に沿った回転と角での向きの変化を合わせて、ちょうど一回転する。平面のまっすぐな三角形では外角の和が 360 度であることの、曲がった三角形と曲がった曲面への一般化である。
:::

::: proof
**Step 0（一般化した設定）.** $U$ 上の $C^{\infty}$ 級の正定値対称行列値関数 $\mathsf{g}$（計量）と、$\Delta$ の開近傍から $U$ への $C^{1}$ 級写像 $\Psi$ で $D\Psi$ がいつも可逆かつ $\det D\Psi>0$ となるものの組について、$T(\mathsf{g},\Psi)$ を次のように定める。$v\in\mathbb{R}^{2}\setminus\{0\}$ と $u\in U$ について、$\mathsf{g}_{u}$ に関して標準基底 $\partial_{1},\partial_{2}$ にグラム–シュミットを施した正規直交基底を $(\mathcal{E}_{1},\mathcal{E}_{2})$ とし、$e(u,v)\defeq(\mathsf{g}_{u}(v,\mathcal{E}_{1}),\mathsf{g}_{u}(v,\mathcal{E}_{2}))/|v|_{\mathsf{g}_{u}}\in S^{1}$。辺 $\sigma_{j}(s)=\Psi(V_{j}+s(V_{j+1}-V_{j}))$ について、$s\mapsto e(\sigma_{j}(s),\sigma_{j}'(s))$ の $[0,1]$ 上の持ち上げを $\vartheta_{j}$ とし、$\alpha_{j+1}\defeq\angle\bigl(e(\sigma_{j}(1),\sigma_{j}'(1)),e(\sigma_{j+1}(0),\sigma_{j+1}'(0))\bigr)$、$T(\mathsf{g},\Psi)\defeq\sum_{j}(\vartheta_{j}(1)-\vartheta_{j}(0))+\sum_{j}\alpha_{j}$。$\mathsf{g}=g$（第一基本形式）、$\Psi=\Phi$ のとき、$Df$ は $\mathsf{g}$ の正規直交基底を $(E_{1},E_{2})$ に写すので、$e(\sigma_{j},\sigma_{j}')$ は $c_{j}'/|c_{j}'|$ の $(E_{1},E_{2})$ 成分で、$T(g,\Phi)$ は主張の左辺（パラメータの取り替えで $\vartheta_{j}$ の端点の値は変わらない）。

**Step 1（$2\pi$ の倍数）.** 【主張：$T(\mathsf{g},\Psi)\in2\pi\mathbb{Z}$】$\angle$ の性質（\ref{surf:oriented-angle.2}）から $\alpha_{j+1}\equiv\vartheta_{j+1}(0)-\vartheta_{j}(1)\pmod{2\pi}$。足すと $T\equiv\sum_{j}(\vartheta_{j}(1)-\vartheta_{j}(0))+\sum_{j}(\vartheta_{j+1}(0)-\vartheta_{j}(1))=\sum_{j}(\vartheta_{j+1}(0)-\vartheta_{j}(0))=0$（$j$ について巡回的に打ち消し合う）。外角が定義されることは注意と同じ理由（$e(u,\cdot)$ は可逆な線形写像の後で正規化したものなので、$e(u,v)=-e(u,w)$ なら $v$ と $w$ は逆向きに平行）。

**Step 2（計量の変形）.** 【主張：$T(g,\Phi)=T(\delta,\Phi)$（$\delta$ は標準内積）】$\mathsf{g}_{\tau}\defeq(1-\tau)g+\tau\delta$（$0\le\tau\le1$）は正定値で、グラム–シュミットの式から $(\tau,u,v)\mapsto e_{\tau}(u,v)$ は連続。各 $j$ について $(\tau,s)\mapsto e_{\tau}(\sigma_{j}(s),\sigma_{j}'(s))$ は凸コンパクト集合 $[0,1]^{2}$ 上の連続写像なので、連続な持ち上げ $\vartheta_{j}(\tau,s)$ がある（\ref{surf:angle-lifting.1}）。外角 $\alpha_{j}(\tau)$ は $\angle$ の連続性（\ref{surf:oriented-angle.1}）から $\tau$ について連続。よって $\tau\mapsto T(\mathsf{g}_{\tau},\Phi)$ は連続で、Step 1 から $2\pi\mathbb{Z}$ に値をとるので、中間値の定理から定数。

**Step 3（三角形の線形化）.** 【主張：$T(\delta,\Phi)=T(\delta,L)$、$L(x)\defeq\Phi(V_{1})+D\Phi(V_{1})(x-V_{1})$】$0<\lambda\le1$ について $\Psi_{\lambda}(x)\defeq\Phi(V_{1})+\lambda^{-1}\bigl(\Phi(V_{1}+\lambda(x-V_{1}))-\Phi(V_{1})\bigr)$、$\Psi_{0}\defeq L$ とする（$\Psi_{\lambda}$ は $\Delta$ の近傍で定義され、$\Delta$ は凸なので $V_{1}+\lambda(x-V_{1})\in\Delta$）。$D\Psi_{\lambda}(x)=D\Phi(V_{1}+\lambda(x-V_{1}))$ は可逆で行列式は正、$(\lambda,x)\mapsto D\Psi_{\lambda}(x)$ は $[0,1]\times\Delta$ 上で連続。$\delta$ では $e(u,v)=v/|v|$ なので、辺の速度 $\sigma_{j,\lambda}'(s)=D\Psi_{\lambda}(\cdot)(V_{j+1}-V_{j})$ だけで $T$ が決まり、Step 2 と同じく $\lambda\mapsto T(\delta,\Psi_{\lambda})$ は連続で $2\pi\mathbb{Z}$ に値をとるので定数。$\Psi_{1}=\Phi$。

**Step 4（まっすぐな三角形）.** 【主張：$T(\delta,L)=2\pi$】$L$ はアフィンで $\det DL>0$。辺の速度 $d_{j}\defeq DL(V_{j+1}-V_{j})$ は一定なので $\vartheta_{j}$ は定数で、$T=\sum_{j}\angle(\hat d_{j},\hat d_{j+1})$（$\hat d=d/|d|$）。$\det(d_{j},d_{j+1})=\det DL\cdot\det(V_{j+1}-V_{j},V_{j+2}-V_{j+1})$ で、三角形について $\det(V_{2}-V_{1},V_{3}-V_{2})=\det(V_{3}-V_{2},V_{1}-V_{3})=\det(V_{1}-V_{3},V_{2}-V_{1})=\det(V_{2}-V_{1},V_{3}-V_{1})>0$（行列式の多重線形性と交代性）。\ref{surf:oriented-angle} の式で分子 $\det>0$ なので各外角は $(0,\pi)$ にあり、$0<T<3\pi$。Step 1 から $T=2\pi$。

::: hypcheck
- **前提「$\Phi$ は向きを保つ（$\det D\Phi>0$）」**：Step 4 で $\det DL>0$ に使った。向きを逆にすると $-2\pi$ になる。
- **前提「$\Phi$ は微分同相」**：Step 0 と Step 3 で $D\Phi$ が可逆であること（外角が $\pm\pi$ にならず、変形の途中でも定義されること）に使った。単射性はこの補題では使わない（グリーンの定理で使う）。
- **三角形に限ったこと**：Step 4 で外角の和を直接求めるのに使った。区分的に滑らかな単純閉曲線一般でも同じ結論（ホップの回転定理の一般形）が成り立つが、本サイトでは三角形の場合だけを証明した（\ref{surf:page-plane-curves-global} の補足）。
:::
:::

## ガウス＝ボネの定理 {#surf:sec-gb-theorem}

::: theorem ガウス＝ボネの定理（局所版） {#surf:gauss-bonnet-local keywords="local Gauss-Bonnet: for a triangle on a surface, the integral of K over the interior plus the integral of the geodesic curvature over the boundary plus the sum of exterior angles equals 2 pi" index="ガウス＝ボネの定理|がうすぼねのていり, ガウス・ボネの定理|がうすぼねのていり" refname="ガウス＝ボネの定理（局所版）"}
曲面上の三角形 $P=f(\Phi(\Delta))$ について、$D\defeq\Phi(\Delta)$、辺 $c_{j}$ の長さを $\ell_{j}$、弧長で径数づけた $c_{j}$ の測地的曲率を $\kappa_{g}$、外角を $\alpha_{j}$ とすると
$$
\iint_{P}K\,dA+\sum_{j=1}^{3}\int_{0}^{\ell_{j}}\kappa_{g}\,ds+\sum_{j=1}^{3}\alpha_{j}=2\pi.
$$
ここで $\iint_{P}K\,dA\defeq\int_{D}K\sqrt{\det g}\,du^{1}du^{2}$。
:::

::: intuition
曲面の上の三角形では、内部の曲がり方（ガウス曲率の合計）、辺の曲がり方（測地的曲率の合計）、角での曲がり方（外角の和）を全部足すと、いつもちょうど一回転分（360 度）になる。
:::

::: proof
**Step 1（グリーンの定理）.** 【主張：$\int_{D}K\sqrt{\det g}\,du=-\sum_{j}\int_{0}^{\ell_{j}}\omega(\gamma_{j}')\,ds$（$\gamma_{j}$ は弧長で径数づけた $\sigma_{j}$）】$\kappa(s,t)\defeq V_{1}+s(V_{2}-V_{1})+st(V_{3}-V_{2})$ は $I^{2}$ を $\Delta$ の上に写し、$\operatorname{int}I^{2}$ で単射、$\det D\kappa=s\det(V_{2}-V_{1},V_{3}-V_{2})>0$。よって特異 2 立方体 $\Phi\circ\kappa$ は $D$ を分割する（\ref{vec:cube-decomposed-region}）。その境界は、面 $s=0$（1 点、線積分 $0$）を除くと、$\sigma_{1},\sigma_{2}$ と、$\sigma_{3}$ を逆向きにしたものの $-1$ 倍、すなわち $\sigma_{1}+\sigma_{2}+\sigma_{3}$（\ref{vec:line-integral-reparametrization}）。\ref{vec:green-theorem}（$P=\omega_{1}$, $Q=\omega_{2}$）と \ref{surf:structure-equation.3} から
$$
-\int_{D}K\sqrt{\det g}=\int_{D}(\partial_{1}\omega_{2}-\partial_{2}\omega_{1})=\sum_{j}\int_{\sigma_{j}}\omega_{1}du^{1}+\omega_{2}du^{2}.
$$
右辺の線積分は弧長に取り替えても変わらない（向きを保つ取り替え）。

**Step 2（辺の測地的曲率）.** 【主張：$\int_{0}^{\ell_{j}}\kappa_{g}\,ds=\theta_{j}(\ell_{j})-\theta_{j}(0)+\int_{0}^{\ell_{j}}\omega(\gamma_{j}')\,ds$】\ref{surf:geodesic-curvature-angle} を積分する。

**Step 3（合計）.** 【主張：主張の等式】Step 1 と Step 2 を足すと、$\iint_{P}K\,dA+\sum_{j}\int\kappa_{g}\,ds=\sum_{j}(\theta_{j}(\ell_{j})-\theta_{j}(0))$。\ref{surf:triangle-turning} から右辺は $2\pi-\sum_{j}\alpha_{j}$。

::: hypcheck
- **前提「$\Phi$ は単射な微分同相で向きを保つ」**：Step 1 で $\Phi\circ\kappa$ が $D$ を分割すること（単射と行列式の正）、\ref{surf:triangle-turning} で回転が $2\pi$ になることに使った。
- **滑らかさ**：構造方程式（\ref{surf:structure-equation}）で $f$ の 3 階の偏微分を、グリーンの定理で $\omega_{i}$ が $C^{1}$ 級であることを使った。
- **一つの曲面片に入ること**：三角形が一つの局所パラメータ表示の像に入ることを仮定した。大きな領域や閉曲面では、三角形に分けて足し合わせる（\ref{surf:page-gauss-bonnet-global}）。
:::
:::

::: corollary 測地三角形の内角の和 {#surf:geodesic-triangle-angles keywords="Gauss: for a geodesic triangle the sum of interior angles equals pi plus the integral of K; on the unit sphere the angle excess equals the area (Girard); for K < 0 the angle sum is less than pi" index="測地三角形|そくちさんかくけい, 内角の和|ないかくのわ, 角過剰|かくかじょう, ジラールの定理|じらーるのていり"}
辺がすべて測地線の三角形（**測地三角形**）では、内角 $\beta_{1},\beta_{2},\beta_{3}$ について
$$
\beta_{1}+\beta_{2}+\beta_{3}=\pi+\iint_{P}K\,dA.
$$
とくに $K\equiv K_{0}$（定数）なら $\beta_{1}+\beta_{2}+\beta_{3}-\pi=K_{0}\cdot(P\text{ の面積})$。$K>0$ なら内角の和は $\pi$ より大きく、$K<0$ なら小さく、$K=0$ なら $\pi$ に等しい。
:::

::: intuition
測地線を辺とする三角形の内角の和は、平らな面では 180 度、球面のように正に曲がった面では 180 度より大きく、鞍のように負に曲がった面では 180 度より小さい。そのずれは、三角形が囲むガウス曲率の合計に等しい。
:::

::: proof
測地線は弧長で径数づけると $\kappa_{g}=0$（\ref{surf:geodesic-characterization.3}）。\ref{surf:gauss-bonnet-local} で $\sum\alpha_{j}=3\pi-\sum\beta_{j}$ とする。$K\equiv K_{0}$ なら $\iint K\,dA=K_{0}\int_{D}\sqrt{\det g}$ は $K_{0}$ と面積の積（\ref{surf:length-angle-area.3}）。
:::

::: example
半径 $r$ の球面の、北極と赤道上の経度 $0$, $\frac\pi2$ の点を頂点とし、二本の子午線と赤道の弧を辺とする測地三角形（球面の 8 分の 1）は、内角がすべて $\frac\pi2$、面積は $\frac18\cdot4\pi r^{2}=\frac{\pi r^{2}}{2}$。$K=\frac1{r^{2}}$ なので、系の右辺は $\pi+\frac{1}{r^{2}}\cdot\frac{\pi r^{2}}{2}=\frac{3\pi}{2}$ で、内角の和に一致する（この三角形が曲面上の三角形の定義をみたすこと、すなわち適当な局所パラメータ表示と $\Phi$ で書けることは認める）。
:::

::: supplement
**一般化.** 三角形に限らず、局所パラメータ表示の中の、区分的に滑らかな単純閉曲線で囲まれた（円板と同相な）領域についても同じ等式が成り立つ（境界の回転が $2\pi$ であること、すなわち区分的に滑らかな曲線の回転定理を使う。Klingenberg 第 6 章 6.3）。平面の領域（$K=0$, $\omega=0$ にとれる）では、これは回転定理（\ref{surf:umlaufsatz}）そのものである。

**平行移動との関係.** 境界に沿って一周する平行移動は、接ベクトルを $\iint_{P}K\,dA$ だけ回す（\ref{surf:prob-gd-parallel-geodesic} の $\theta'=\kappa_{g}$ と本定理の証明から）。球面の緯線に沿った平行移動の回転（\ref{surf:parallel-latitude}）はその例である。

**高い視点.** 構造方程式 $d\omega=-K\,dA$ は、標構の回転を表す接続形式の外微分が曲率であることを述べ、ガウス＝ボネの定理は、これにストークスの定理（ここではグリーンの定理）を使ったものである。大域版では、三角形に分けて足すと内部の辺の寄与が打ち消し合い、角の寄与がオイラー標数になる。曲率という局所的な量の積分が、位相的な不変量に等しいという、微分幾何と位相幾何をつなぐ最初の定理である。
:::

## 問題 {#surf:sec-gb-problems}

::: problem {#surf:prob-gb-frame-change}
★ 基本：$\phi\colon U\to\mathbb{R}$ を $C^{\infty}$ 級とし、$E_{1}'\defeq\cos\phi\,E_{1}+\sin\phi\,E_{2}$, $E_{2}'\defeq-\sin\phi\,E_{1}+\cos\phi\,E_{2}$ とする。$\omega_{i}'\defeq\langle\partial_{i}E_{1}',E_{2}'\rangle$ について $\omega_{i}'=\omega_{i}+\partial_{i}\phi$、したがって $\partial_{1}\omega_{2}'-\partial_{2}\omega_{1}'=\partial_{1}\omega_{2}-\partial_{2}\omega_{1}$ を示せ。
:::

::: solution
$\partial_{i}E_{1}'=\partial_{i}\phi(-\sin\phi E_{1}+\cos\phi E_{2})+\cos\phi\,\partial_{i}E_{1}+\sin\phi\,\partial_{i}E_{2}$。$E_{2}'$ との内積をとり、$\langle\partial_{i}E_{1},E_{1}\rangle=\langle\partial_{i}E_{2},E_{2}\rangle=0$、$\langle\partial_{i}E_{1},E_{2}\rangle=\omega_{i}=-\langle\partial_{i}E_{2},E_{1}\rangle$ を使うと $\partial_{i}\phi+\cos^{2}\phi\,\omega_{i}+\sin^{2}\phi\,\omega_{i}=\omega_{i}+\partial_{i}\phi$。$\partial_{1}\partial_{2}\phi=\partial_{2}\partial_{1}\phi$ から後半。
:::

::: problem {#surf:prob-gb-plane}
★ 基本：平面 $f(u)=(u^{1},u^{2},0)$ では $E_{1},E_{2}$ は標準基底で $\omega=0$ であることを確かめ、ガウス＝ボネの定理が \ref{surf:triangle-turning} の平面の場合（$\sum\int\kappa\,ds+\sum\alpha_{j}=2\pi$）になることを述べよ。とくに直線の辺をもつ三角形の内角の和は $\pi$。
:::

::: solution
$f_{1},f_{2}$ は標準基底で一定なので $E_{i}$ も一定、$\partial_{i}E_{1}=0$ から $\omega=0$、$K=0$。定理は $\sum_{j}\int\kappa_{g}\,ds+\sum\alpha_{j}=2\pi$ で、$\kappa_{g}$ は平面曲線の符号付き曲率（\ref{surf:curvature-decomposition}）。直線の辺では $\kappa_{g}=0$ なので $\sum\alpha_{j}=2\pi$、$\sum\beta_{j}=3\pi-2\pi=\pi$。
:::

::: problem {#surf:prob-gb-negative}
★★ 標準：$K<0$ の曲面片の上には、二本の測地線が二点で交わってできる「測地二角形」（二つの頂点と二本の測地線の辺からなり、平面の多角形の微分同相像として表せる領域）は存在しないことを、ガウス＝ボネの定理（多角形版。補足の一般化を認めてよい）から示せ。
:::

::: solution
多角形版のガウス＝ボネの定理を二角形に使うと、$\kappa_{g}=0$ なので $\iint K\,dA+\alpha_{1}+\alpha_{2}=2\pi$。外角は $\alpha_{j}<\pi$ なので $\alpha_{1}+\alpha_{2}<2\pi$、よって $\iint K\,dA>0$。一方 $K<0$ なので $\iint K\,dA<0$（面積は正）。矛盾。
:::

::: problem {#surf:prob-gb-sphere-area}
★★ 標準：単位球面上の測地三角形の面積は、内角の和から $\pi$ を引いたもの（**角過剰**）に等しいことを示せ（ジラールの定理）。内角がすべて $\frac{2\pi}{3}$ の測地三角形の面積を求めよ。
:::

::: solution
$K=1$ なので \ref{surf:geodesic-triangle-angles} から面積 $=\beta_{1}+\beta_{2}+\beta_{3}-\pi$。内角がすべて $\frac{2\pi}3$ なら面積は $2\pi-\pi=\pi$（球面全体の 4 分の 1。正四面体を球面に射影したときの面の一つにあたる）。
:::
