# 共変微分と測地線 {#surf:page-geodesics keywords="covariant derivative along a curve on a surface, parallel transport, holonomy, geodesic curvature, geodesic, geodesic equation, Picard-Lindelof theorem, existence and uniqueness of geodesics, great circles, exponential map, Clairaut relation, surfaces of revolution"}

平面では、曲線に沿ったベクトル場を普通に微分すればよく、加速度が $0$ の曲線は直線である。曲面の上では、接ベクトル場を微分すると一般に接平面からはみ出すので、接平面に射影したもの（**共変微分**）を使う。共変微分はクリストッフェル記号で書けるので第一基本形式だけで決まり（内在的）、共変微分が $0$ のベクトル場として**平行移動**が、速度ベクトルの共変微分が $0$ の曲線として**測地線**（曲面の上の「まっすぐな」曲線）が定まる。曲面上の曲線の曲率は、法線方向の**法曲率**と接平面内の**測地的曲率**に分かれ、測地線とは測地的曲率が $0$ の曲線である。測地線の存在と一意性のために、常微分方程式の解の局所存在と一意性（ピカール–リンデレーフ）をこのページで証明し、最後に**指数写像**を定める。

> 資料：Klingenberg『A Course in Differential Geometry』第 4 章 4.1〜4.3 と同じ標準的な内容。ピカール–リンデレーフの定理は資料では引用だけなので、証明を補った。指数写像に必要な「解の初期値に関する滑らかな依存性」は事実として引用する。球面の緯線に沿った平行移動の計算と、緯線の測地的曲率は自分で計算し直した。

## 記法と定義の確認 {#surf:sec-gd-notation}

::: notation
- 曲面片 $f\colon U\to\mathbb{R}^{3}$、$f_{i}$、単位法ベクトル $n$ \ref{surf:surface-patch}、第一基本形式 $g_{ij}$ \ref{surf:first-fundamental-form}、ガウスの公式 $f_{ij}=\sum_{k}\Gamma^{k}_{ij}f_{k}+h_{ij}n$ とクリストッフェル記号 \tref{surf:gauss-formula}・\ref{surf:christoffel-metric}、ムーニエの定理 \tref{surf:meusnier}、局所等長 \ref{surf:local-isometry}。
- **曲面上の曲線**：$C^{\infty}$ 級の $\gamma=(\gamma^{1},\gamma^{2})\colon I\to U$ について $c\defeq f\circ\gamma$。$c'=\sum_{i}\gamma^{i\prime}f_{i}(\gamma)$。**$c$ に沿った接ベクトル場**とは、$C^{\infty}$ 級の $X\colon I\to\mathbb{R}^{3}$ で $X(t)\in T_{\gamma(t)}f$ となるもので、$X=\sum_{k}\xi^{k}f_{k}(\gamma)$（$\xi^{k}$ は $C^{\infty}$ 級、\ref{surf:tangent-field-coefficients} と同じ理由）と書ける。
- $\mathbb{R}^{3}$ のベクトル $Z$ の、接平面 $T_{u}f$ への直交射影を $Z^{\top}\defeq Z-\langle Z,n(u)\rangle n(u)$ と書く。
- 線形常微分方程式の解の存在と一意性 \ref{surf:linear-ode}、作用素ノルム \ref{calc:operator-norm}、\ref{calc:mean-value-inequality}、一様収束の基本定理 \ref{calc:uniform-limit-theorems}、微分積分学の基本定理 \tref{calc:fundamental-theorem}、ベクトル値積分の不等式 \ref{vec:vector-integral-inequality}、\ref{top:extreme-value}、ハイネ–ボレル \ref{top:heine-borel}、逆関数定理 \tref{calc:inverse-function-theorem}。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 共変微分と平行移動 {#surf:sec-gd-covariant}

::: definition 曲線に沿った共変微分 {#surf:covariant-derivative keywords="covariant derivative of a tangent vector field along a curve on a surface: tangential projection of the ordinary derivative; coordinate formula with Christoffel symbols" index="共変微分|きょうへんびぶん, 共変導関数|きょうへんどうかんすう"}
曲面上の曲線 $c=f\circ\gamma$ に沿った接ベクトル場 $X$ について
$$
\frac{\nabla X}{dt}(t)\defeq\Bigl(\frac{dX}{dt}(t)\Bigr)^{\top}
$$
（$T_{\gamma(t)}f$ への直交射影）を $X$ の**共変微分**という。
:::

::: intuition
共変微分とは、曲面の上に住む者が見たベクトル場の変化である。空間で見た変化のうち、曲面から飛び出す向きの成分は曲面の上からは見えないので捨てる。
:::

::: proposition 共変微分の座標表示と性質 {#surf:covariant-derivative-properties keywords="nabla X/dt = sum_k (xi^k' + sum_ij Gamma^k_ij xi^i gamma^j') f_k; linearity, Leibniz rule, compatibility with the metric; intrinsic" index="共変微分の性質|きょうへんびぶんのせいしつ"}
$X=\sum_{k}\xi^{k}f_{k}(\gamma)$, $Y$ を $c=f\circ\gamma$ に沿った接ベクトル場、$\varphi$ を $I$ 上の $C^{\infty}$ 級関数とする。
1. $\displaystyle\frac{\nabla X}{dt}=\sum_{k}\Bigl(\xi^{k\prime}+\sum_{i,j}\Gamma^{k}_{ij}(\gamma)\,\xi^{i}\gamma^{j\prime}\Bigr)f_{k}(\gamma)$。とくに共変微分は第一基本形式とその 1 階の偏微分だけで決まる。
2. $\frac{\nabla(X+Y)}{dt}=\frac{\nabla X}{dt}+\frac{\nabla Y}{dt}$、$\frac{\nabla(\varphi X)}{dt}=\varphi'X+\varphi\frac{\nabla X}{dt}$。
3. $\dfrac{d}{dt}\langle X,Y\rangle=\Bigl\langle\dfrac{\nabla X}{dt},Y\Bigr\rangle+\Bigl\langle X,\dfrac{\nabla Y}{dt}\Bigr\rangle$。
:::

::: proof
**1.** $\frac{dX}{dt}=\sum_{k}\xi^{k\prime}f_{k}(\gamma)+\sum_{i}\xi^{i}\sum_{j}\gamma^{j\prime}f_{ij}(\gamma)$（連鎖律）に、ガウスの公式 $f_{ij}=\sum_{k}\Gamma^{k}_{ij}f_{k}+h_{ij}n$ を代入して、$n$ の成分を除く。$\Gamma^{k}_{ij}$ は第一基本形式で決まる（\ref{surf:christoffel-metric}）。

**2.** 射影の線形性と積の微分。

**3.** $Y$ は接ベクトルなので $\langle Z,Y\rangle=\langle Z^{\top},Y\rangle$。$\frac{d}{dt}\langle X,Y\rangle=\langle X',Y\rangle+\langle X,Y'\rangle$ にこれを使う。
:::

::: definition 平行 {#surf:parallel keywords="parallel vector field along a curve: nabla X/dt = 0" index="平行（ベクトル場）|へいこう, 平行なベクトル場|へいこうなべくとるば"}
$c$ に沿った接ベクトル場 $X$ が $\frac{\nabla X}{dt}\equiv0$ をみたすとき、$X$ は $c$ に沿って**平行**であるという。
:::

::: intuition
平行なベクトル場とは、曲面の上に住む者から見て、向きも長さも変えずに運ばれていくベクトルのことである。
:::

::: theorem 平行移動 {#surf:parallel-transport keywords="parallel transport along a curve on a surface exists uniquely and is a linear isometry between tangent planes; path dependence (holonomy)" index="平行移動|へいこういどう, ホロノミー|ほろのみー" refname="平行移動の存在と等長性"}
$c=f\circ\gamma\colon I\to\mathbb{R}^{3}$ を曲面上の曲線、$t_{0},t_{1}\in I$ とする。
1. 各 $X_{0}\in T_{\gamma(t_{0})}f$ について、$c$ に沿った平行な接ベクトル場 $X$ で $X(t_{0})=X_{0}$ となるものが、$I$ 全体の上でただ一つある。
2. $P_{t_{0},t_{1}}\colon X_{0}\mapsto X(t_{1})$ は $T_{\gamma(t_{0})}f$ から $T_{\gamma(t_{1})}f$ への線形な等長写像（内積を保つ線形同型）である。
:::

::: intuition
曲面の上の曲線に沿って、どの接ベクトルも平行に運ぶことができ、運び方はただ一通りである。運んでも長さと角は変わらない。ただし、行き先で得られるベクトルは、途中の道筋によって変わりうる。
:::

::: proof
**Step 1（1）.** 【主張：平行であることは $\xi=(\xi^{1},\xi^{2})$ についての線形常微分方程式 $\xi'=A(t)\xi$ と同値で、その解は $I$ 全体でただ一つ】\ref{surf:covariant-derivative-properties.1} から、$X=\sum\xi^{k}f_{k}$ が平行 $\iff\xi^{k\prime}=-\sum_{i,j}\Gamma^{k}_{ij}(\gamma)\gamma^{j\prime}\xi^{i}$。係数 $A(t)_{ki}\defeq-\sum_{j}\Gamma^{k}_{ij}(\gamma(t))\gamma^{j\prime}(t)$ は $C^{\infty}$ 級なので、\ref{surf:linear-ode} から初期値 $\xi(t_{0})$ に対して $I$ 全体の解がただ一つあり、$C^{\infty}$ 級。

**Step 2（2）.** 【主張：$P_{t_{0},t_{1}}$ は線形で内積を保つ】解の一意性から、初期値の線形結合の解は解の線形結合なので、$P$ は線形。$X$, $Y$ が平行なら \ref{surf:covariant-derivative-properties.3} から $\frac{d}{dt}\langle X,Y\rangle=0$ で、$\langle X(t_{1}),Y(t_{1})\rangle=\langle X_{0},Y_{0}\rangle$。内積を保つ線形写像は単射で、次元が等しいので同型。
:::

::: example 球面の緯線に沿った平行移動 {#surf:parallel-latitude keywords="parallel transport around a latitude circle of the unit sphere rotates vectors by 2 pi sin a" index="緯線に沿った平行移動|いせんにそったへいこういどう"}
単位球面 $f(u,v)=(\cos u\cos v,\cos u\sin v,\sin u)$（$|u|<\frac\pi2$）では $E=1$, $F=0$, $G=\cos^{2}u$ で、\ref{surf:christoffel-metric} から $0$ でないクリストッフェル記号は $\Gamma^{1}_{22}=\cos u\sin u$, $\Gamma^{2}_{12}=\Gamma^{2}_{21}=-\tan u$。緯線 $\gamma(t)=(a,t)$（$0<a<\frac\pi2$, $0\le t\le2\pi$）に沿った平行移動の方程式は
$$
\xi^{1\prime}+\cos a\sin a\,\xi^{2}=0,\qquad\xi^{2\prime}-\tan a\,\xi^{1}=0.
$$
初期値 $X(0)=f_{v}/|f_{v}|$（$\xi^{1}(0)=0$, $\xi^{2}(0)=\frac{1}{\cos a}$）の解は $\xi^{1}(t)=-\sin(t\sin a)$, $\xi^{2}(t)=\frac{\cos(t\sin a)}{\cos a}$（代入して確かめられる。解は一意）。正規直交な標構 $e_{1}\defeq f_{u}$, $e_{2}\defeq f_{v}/\cos a$ で書くと
$$
X(t)=-\sin(t\sin a)\,e_{1}+\cos(t\sin a)\,e_{2},
$$
すなわち $X$ は標構に対して角 $t\sin a$ だけ回る。一周して戻ると $X(2\pi)$ は $X(0)$ を角 $2\pi\sin a$ だけ回したもので、$a\neq0$ なら $X(0)$ と一致しない。平行移動は道筋による（赤道 $a=0$ では一致する）。
:::

## 測地的曲率と測地線 {#surf:sec-gd-geodesics}

::: definition 測地的曲率 {#surf:geodesic-curvature keywords="geodesic curvature of a unit speed curve on a surface: kappa_g = <c'', n x c'>; nabla c'/ds = kappa_g (n x c')" index="測地的曲率|そくちてききょくりつ, 測地曲率|そくちきょくりつ"}
曲面上の曲線 $c=f\circ\gamma$ が弧長で径数づけられているとき、$e_{1}\defeq c'$, $e_{2}\defeq n(\gamma)\times c'$ とし、
$$
\kappa_{g}\defeq\Bigl\langle\frac{\nabla c'}{ds},e_{2}\Bigr\rangle=\langle c'',\,n(\gamma)\times c'\rangle
$$
を $c$ の**測地的曲率**という。
:::

::: intuition
測地的曲率とは、曲面の上に住む者から見た曲線の曲がり方で、接平面の中で進行方向から左右どちらへどれだけ曲がっているかを表す。平面の上では、平面曲線の符号付き曲率そのものである。
:::

::: proposition 曲率の分解 {#surf:curvature-decomposition keywords="c'' = kappa_g e_2 + kappa_n n; nabla c'/ds = kappa_g e_2; kappa^2 = kappa_g^2 + kappa_n^2; plane curves" index="曲率の分解（曲面上の曲線）|きょくりつのぶんかい"}
弧長で径数づけられた曲面上の曲線について、$e_{1}=c'$, $e_{2}=n\times c'$, $n$ は各点で正規直交基底で、
$$
c''=\kappa_{g}e_{2}+\kappa_{n}n,\qquad\frac{\nabla c'}{ds}=\kappa_{g}e_{2},\qquad|c''|^{2}=\kappa_{g}^{2}+\kappa_{n}^{2}.
$$
ここで $\kappa_{n}=\mathrm{II}(\gamma',\gamma')$ は $c'$ の方向の法曲率（\ref{surf:normal-curvature}）。とくに $c$ がフレネ曲線なら、曲率 $\kappa$ について $\kappa^{2}=\kappa_{g}^{2}+\kappa_{n}^{2}$。平面 $f(u)=(u^{1},u^{2},0)$ では $\kappa_{g}$ は平面曲線の符号付き曲率（\ref{surf:signed-curvature}）に等しい。
:::

::: proof
$|n\times c'|^{2}=|n|^{2}|c'|^{2}-\langle n,c'\rangle^{2}=1$（ラグランジュの恒等式）で、$e_{2}$ は $n$ と $c'$ に直交するので、三つは正規直交。$\langle c'',c'\rangle=\frac12(|c'|^{2})'=0$ なので $c''$ の $e_{1}$ 成分は $0$、$e_{2}$ 成分は定義から $\kappa_{g}$、$n$ 成分は\ref{surf:meusnier.1} から $\kappa_{n}$。接平面への射影は $e_{2}$ 成分だけを残す。フレネ曲線なら $|c''|=\kappa$（\ref{surf:curvature-torsion-formulas}）。平面では $n=(0,0,1)$ で、$n\times(x,y,0)=(-y,x,0)$ は 90 度の回転 $J$ なので、$\kappa_{g}=\langle c'',Jc'\rangle$ は \ref{surf:plane-curvature-formula} の符号付き曲率。
:::

::: example
単位球面の緯線（上の例の $u=a$）を弧長で径数づけると、$c''=-\frac{1}{\cos a}(\cos v,\sin v,0)$、$n=-f$（この $f$ では $f_{u}\times f_{v}=-\cos u\,f$）、$e_{2}=n\times c'=(\sin a\cos v,\sin a\sin v,-\cos a)$。よって $\kappa_{g}=-\tan a$, $\kappa_{n}=1$ で、$\kappa_{g}^{2}+\kappa_{n}^{2}=\frac{1}{\cos^{2}a}$ は半径 $\cos a$ の円の曲率の 2 乗に等しい。赤道（$a=0$）だけが $\kappa_{g}=0$ である。
:::

::: definition 測地線 {#surf:geodesic keywords="geodesic on a surface: a curve whose velocity is parallel, nabla c'/dt = 0" index="測地線|そくちせん"}
曲面上の曲線 $c=f\circ\gamma$ で $\dfrac{\nabla c'}{dt}\equiv0$ となるものを**測地線**という。
:::

::: intuition
測地線とは、曲面の上でまっすぐ進む曲線、すなわち曲面に住む者から見て加速も曲がりもしない曲線である。空間から見ると、加速度はいつも曲面に垂直になっている。
:::

::: proposition 測地線の特徴づけ {#surf:geodesic-characterization keywords="geodesics have constant speed; the geodesic equation gamma^k'' + sum Gamma^k_ij gamma^i' gamma^j' = 0; c'' is normal to the surface; a regular curve reparametrized by arc length is a geodesic iff kappa_g = 0; geodesics are intrinsic" index="測地線の方程式|そくちせんのほうていしき"}
$c=f\circ\gamma$ を曲面上の曲線とする。
1. $c$ が測地線 $\iff c''(t)$ がいつも $n(\gamma(t))$ に平行 $\iff$ **測地線の方程式**
$$
\gamma^{k\prime\prime}+\sum_{i,j}\Gamma^{k}_{ij}(\gamma)\,\gamma^{i\prime}\gamma^{j\prime}=0\qquad(k=1,2).
$$
2. 測地線の速さ $|c'|$ は一定。
3. 正則な曲線 $c$ を弧長で径数づけ直したものが測地線であることと、$\kappa_{g}\equiv0$ は同値。
4. 等長な曲面片 $f,\tilde f$（同じ $U$ 上で $g=\tilde g$）について、$f\circ\gamma$ が測地線 $\iff\tilde f\circ\gamma$ が測地線。
:::

::: proof
**1.** $c'$ の $\xi^{k}$ は $\gamma^{k\prime}$ なので、\ref{surf:covariant-derivative-properties.1} から $\frac{\nabla c'}{dt}=\sum_{k}(\gamma^{k\prime\prime}+\sum\Gamma^{k}_{ij}\gamma^{i\prime}\gamma^{j\prime})f_{k}$。これが $0$ であることと、$c''$ の接成分が $0$ であることは同じ。

**2.** \ref{surf:covariant-derivative-properties.3} から $(|c'|^{2})'=2\langle\frac{\nabla c'}{dt},c'\rangle=0$。

**3.** 弧長パラメータでは \ref{surf:curvature-decomposition} から $\frac{\nabla c'}{ds}=\kappa_{g}e_{2}$。

**4.** 1 の方程式は $\Gamma^{k}_{ij}$ だけで決まり、$\Gamma^{k}_{ij}$ は第一基本形式で決まる（\ref{surf:christoffel-metric}）。
:::

::: example 球面の大円 {#surf:great-circles keywords="great circles parametrized proportionally to arc length are geodesics of the sphere" index="大円|だいえん"}
半径 $r$ の球面（中心 $0$）上の大円 $c(t)=r(\cos(\omega t)\,a+\sin(\omega t)\,b)$（$a,b$ は正規直交、$\omega\neq0$）は測地線である。実際 $c''=-\omega^{2}c$ は法ベクトル $\pm c/r$ に平行（\ref{surf:geodesic-characterization.1}。球面上の点 $p$ での法ベクトルは $\pm p/r$）。後の \ref{surf:geodesic-existence} から、球面の測地線は大円（を一定の速さでたどったもの）と定値曲線に限る：各点と各接ベクトル $X\neq0$ に、その方向の大円 $r(\cos(\omega t)a+\sin(\omega t)b)$（$a=p/r$, $b=X/|X|$, $\omega=|X|/r$）が測地線としてあり、一意性から測地線はそれに一致する。
:::

## 測地線の存在と一意性 {#surf:sec-gd-existence}

::: lemma ピカール–リンデレーフの定理 {#surf:picard-lindelof keywords="Picard-Lindelof: local existence and uniqueness of solutions of x' = F(x) for C^1 vector fields; uniqueness on intervals; smoothness of solutions" index="ピカール–リンデレーフの定理|ぴかーるりんでれーふのていり, 常微分方程式の解の存在と一意性|じょうびぶんほうていしきのかいのそんざいとこういつせい" refname="ピカール–リンデレーフの定理"}
$W\subset\mathbb{R}^{N}$ を開集合、$F\colon W\to\mathbb{R}^{N}$ を $C^{1}$ 級とする。
1. **（局所存在）** 各 $x_{0}\in W$ に $\varepsilon>0$ があって、$C^{1}$ 級の $x\colon(-\varepsilon,\varepsilon)\to W$ で $x'=F(x)$, $x(0)=x_{0}$ となるものがある。
2. **（一意性）** 区間 $I$ と $t_{0}\in I$ について、$x'=F(x)$ の $I$ 上の二つの解 $x,y$ が $x(t_{0})=y(t_{0})$ なら、$I$ 上で $x=y$。
3. $F$ が $C^{\infty}$ 級なら解は $C^{\infty}$ 級。
:::

::: intuition
常微分方程式 x′=F(x) は、F が滑らかなら、初期値を決めると少なくとも短い時間は解をもち、その解はただ一つである。
:::

::: proof
**Step 1（定数の準備）.** 【主張：$r>0$ と $M,\Lambda$ で、$\bar B\defeq\bar B(x_{0},r)\subset W$ 上 $|F|\le M$、$|F(x)-F(y)|\le\Lambda|x-y|$ となるものがある】$W$ は開なので $\bar B\subset W$ となる $r$ がある。$\bar B$ はコンパクト（\ref{top:heine-borel}）で、$|F|$ と $\|DF\|$（作用素ノルムは $M_{N}(\mathbb{R})$ 上のノルムなので連続、\ref{calc:operator-norm-properties.5}）は連続なので最大値 $M$, $\Lambda$ をとる（\ref{top:extreme-value}）。$\bar B$ は凸なので\ref{calc:mean-value-inequality} から $\Lambda$ がリプシッツ定数。

**Step 2（逐次近似）.** 【主張：$\varepsilon\defeq r/(M+1)$、$|t|<\varepsilon$ について $x_{0}(t)\defeq x_{0}$、$x_{j+1}(t)\defeq x_{0}+\int_{0}^{t}F(x_{j}(s))\,ds$ は $\bar B$ に値をとり、$|x_{j+1}(t)-x_{j}(t)|\le M\Lambda^{j}|t|^{j+1}/(j+1)!$】$x_{j}$ が $\bar B$ に値をとれば $|x_{j+1}(t)-x_{0}|\le M|t|<r$（\ref{vec:vector-integral-inequality}）。評価は $j$ についての帰納法：$j=0$ では $|x_{1}(t)-x_{0}|\le M|t|$、$j$ から $j+1$ へは $|x_{j+2}(t)-x_{j+1}(t)|\le|\int_{0}^{t}\Lambda|x_{j+1}-x_{j}||\le\Lambda\cdot M\Lambda^{j}|t|^{j+2}/(j+2)!$。

**Step 3（1）.** 【主張：$x_{j}$ は一様収束し、極限は解】$[-\varepsilon',\varepsilon']$（$\varepsilon'<\varepsilon$）の上で Step 2 の評価の和は収束するので、M 判定法（\ref{calc:uniform-limit-theorems.3}）から $x_{j}\to x$ は一様。$x$ は連続で $\bar B$ に値をとり、$|F(x_{j})-F(x)|\le\Lambda|x_{j}-x|$ から $F(x_{j})\to F(x)$ も一様で、\ref{calc:uniform-limit-theorems.4} から $x(t)=x_{0}+\int_{0}^{t}F(x)$。基本定理から $x$ は $C^{1}$ 級で $x'=F(x)$。$\varepsilon'$ は任意なので $(-\varepsilon,\varepsilon)$ 上の解を得る（$\varepsilon'$ を変えても構成は同じ関数の制限）。

**Step 4（局所一意性）.** 【主張：$x(t_{0})=y(t_{0})$ なら、$t_{0}$ を含むある区間で $x=y$】$x(t_{0})$ を中心に Step 1 の $r,M,\Lambda$ をとる。連続性から、$t_{0}$ を含む有界閉区間 $J$ で $x,y$ はともに $\bar B$ に値をとる。$D\defeq|x-y|$ は $D(t)\le|\int_{t_{0}}^{t}\Lambda D|$ をみたし、$J$ 上 $D\le C$。帰納的に $D(t)\le C\Lambda^{j}|t-t_{0}|^{j}/j!\to0$。

**Step 5（2）.** 【主張：$I$ 全体で $x=y$】$t_{0}$ より右について、$t_{1}\defeq\sup\{t\in I\mid t\ge t_{0},\ [t_{0},t]\text{ 上で }x=y\}$ とする。$t_{1}$ が $I$ の右端でなければ、連続性から $x(t_{1})=y(t_{1})$ で、Step 4 から $t_{1}$ の右にも一致が延び、$t_{1}$ の定義に反する。左についても同様。

**Step 6（3）.** 【主張：$F$ が $C^{\infty}$ 級なら解は $C^{\infty}$ 級】$x$ が $C^{k}$ 級なら $x'=F\circ x$ は $C^{k}$ 級（\ref{calc:ck-composition}）なので $x$ は $C^{k+1}$ 級。

::: hypcheck
- **前提「$F$ は $C^{1}$ 級」**：Step 1 のリプシッツ定数に使った。連続なだけでは一意性が崩れる：$x'=2\sqrt{|x|}$, $x(0)=0$ は $x\equiv0$ と $x=t^{2}$（$t\ge0$）の二つの解をもつ。
- **局所性**：非線形なので解は $I$ 全体に延びるとは限らない（$x'=x^{2}$ の解 $1/(1-t)$ は $t=1$ で発散）。線形の場合（\ref{surf:linear-ode}）との違い。
- **公理**：選択公理は使わない。
:::
:::

::: theorem 測地線の存在と一意性 {#surf:geodesic-existence keywords="for each point and tangent vector there is a unique geodesic with these initial data, defined on a small interval; two geodesics with the same initial data agree on their common interval" index="測地線の存在と一意性|そくちせんのそんざいとこういつせい" refname="測地線の存在と一意性"}
曲面片 $f\colon U\to\mathbb{R}^{3}$、$u_{0}\in U$、$X=\sum_{i}w^{i}f_{i}(u_{0})\in T_{u_{0}}f$ とする。
1. $\varepsilon>0$ と測地線 $c=f\circ\gamma\colon(-\varepsilon,\varepsilon)\to\mathbb{R}^{3}$ で、$\gamma(0)=u_{0}$, $c'(0)=X$ となるものがある。
2. 同じ初期条件をもつ二つの測地線は、共通の定義区間の上で一致する。
:::

::: intuition
曲面の各点から各方向へ、まっすぐ進む曲線（測地線）が少なくとも少しの間は存在し、出発点と初速度を決めればただ一つに決まる。
:::

::: proof
**Step 1.** 【主張：測地線の方程式は 1 階の系 $(\gamma,\beta)'=F(\gamma,\beta)$ と同値】$W\defeq U\times\mathbb{R}^{2}$ 上で $F(u,w)\defeq\bigl(w,\,-\sum_{i,j}\Gamma^{\cdot}_{ij}(u)w^{i}w^{j}\bigr)$ とすると、$F$ は $C^{\infty}$ 級で、$\gamma$ が測地線の方程式（\ref{surf:geodesic-characterization.1}）をみたすことと $(\gamma,\gamma')$ が $(\gamma,\beta)'=F(\gamma,\beta)$ をみたすことは同値。

**Step 2.** 【主張：1 と 2 が成り立つ】\ref{surf:picard-lindelof.1}（初期値 $(u_{0},w)$）から 1。一意性は \ref{surf:picard-lindelof.2} を $(\gamma,\gamma')$ に使う。$c'(0)=\sum w^{i}f_{i}(u_{0})=X$。

**Step 3.** 【主張：解は $C^{\infty}$ 級】\ref{surf:picard-lindelof.3}。
:::

## 指数写像 {#surf:sec-gd-exponential}

::: fact 解の初期値に関する滑らかな依存性 {#surf:smooth-dependence keywords="smooth dependence of solutions of ODEs on initial conditions: the local flow is smooth" index="初期値に関する依存性|しょきちにかんするいぞんせい, 局所流れ|きょくしょながれ"}
$W\subset\mathbb{R}^{N}$ を開集合、$F\colon W\to\mathbb{R}^{N}$ を $C^{\infty}$ 級とする。各 $x_{0}\in W$ に、$\delta>0$ と $x_{0}$ の開近傍 $V$ があって、各 $y\in V$ について $x'=F(x)$, $x(0)=y$ の解 $x(t;y)$ が $(-\delta,\delta)$ 上で存在し、$(t,y)\mapsto x(t;y)$ は $(-\delta,\delta)\times V$ 上で $C^{\infty}$ 級である。（常微分方程式の標準的な結果。出典：Hirsch–Smale『Differential Equations, Dynamical Systems, and Linear Algebra』。）
:::

::: definition 指数写像 {#surf:exponential-map keywords="exponential map exp_u(X) = c_X(1) where c_X is the geodesic with initial velocity X; defined near 0" index="指数写像|しすうしゃぞう"}
$u_{0}\in U$ と $X\in T_{u_{0}}f$ について、初速度 $X$ の測地線 $c_{X}$ が $[0,1]$ を含む区間で定義されるとき、$\exp_{u_{0}}(X)\defeq c_{X}(1)$ と定める。$\exp_{u_{0}}$ を $u_{0}$ での**指数写像**という。
:::

::: intuition
指数写像とは、出発点からある方向へ、ある速さでまっすぐ（測地線に沿って）単位時間だけ進んだ先の点を与える写像である。接平面の矢印を、曲面の上の点に写す。
:::

::: proposition 指数写像は局所微分同相 {#surf:exponential-local-diffeo keywords="the exponential map is defined and smooth on a neighborhood of 0, its differential at 0 is the identity, hence it is a local diffeomorphism near 0; c_{lambda X}(t) = c_X(lambda t)" index="指数写像の性質|しすうしゃぞうのせいしつ"}
$u_{0}\in U$ とし、$T_{u_{0}}f$ を基底 $f_{1}(u_{0}),f_{2}(u_{0})$ で $\mathbb{R}^{2}$ と同一視する。
1. $c_{\lambda X}(t)=c_{X}(\lambda t)$（両辺が定義される範囲）。
2. $\eta>0$ があって、$|w|<\eta$ なら $\exp_{u_{0}}(w)$ が定義され、$w\mapsto\gamma_{w}(1)$（$c_{w}=f\circ\gamma_{w}$）は $B(0,\eta)$ 上で $C^{\infty}$ 級。
3. その微分は $0$ で恒等写像。したがって $0$ のある近傍から $u_{0}$ のある近傍への微分同相写像である。
:::

::: proof
**Step 1（1）.** 【主張：$t\mapsto c_{X}(\lambda t)$ は初速度 $\lambda X$ の測地線】$\gamma(\lambda t)$ を測地線の方程式に代入すると、各項に $\lambda^{2}$ が掛かるだけなので方程式をみたし、初速度は $\lambda X$。一意性（\ref{surf:geodesic-existence.2}）。

**Step 2（2）.** 【主張：$\exp_{u_{0}}$ は $0$ の近くで定義され $C^{\infty}$ 級】\ref{surf:geodesic-existence} の Step 1 の $F$ と初期値 $(u_{0},0)$ に \ref{surf:smooth-dependence} を使い、$\delta$ と $V$ をとる。$V\supset\{u_{0}\}\times B(0,\eta_{0})$ となる $\eta_{0}>0$ がある。$s\defeq\delta/2$, $\eta\defeq s\eta_{0}$ とする。$|w|<\eta$ なら $|w/s|<\eta_{0}$ で、$\gamma_{w/s}$ は $(-\delta,\delta)$ 上で定義され、1 から $\gamma_{w}(t)=\gamma_{w/s}(st)$ は $|t|<2$ で定義される。$w\mapsto\gamma_{w/s}(s)$ は \ref{surf:smooth-dependence} から $C^{\infty}$ 級。

**Step 3（3）.** 【主張：微分は $0$ で恒等写像】$w$ を固定すると、1 から $\gamma_{\lambda w}(1)=\gamma_{w}(\lambda)$。$\lambda$ について $0$ で微分すると $\gamma_{w}'(0)=w$。よって $0$ での方向微分は $w$ で、微分は恒等写像。逆関数定理から局所微分同相。
:::

::: supplement
**前のページとのつながり.** 測地線は第一基本形式だけで決まる（\ref{surf:geodesic-characterization.4}）ので、紙を丸めて作る円柱の測地線は、展開した平面の直線（を巻きつけたもの）、すなわち円柱の母線・円・常らせんである。

**平行移動と曲率.** 緯線に沿って一周する平行移動の回転角 $2\pi\sin a$ は、$2\pi$ の整数倍を除いて、緯線の北側の球冠の面積 $2\pi(1-\sin a)$ の $-1$ 倍に等しい。単位球面では $K=1$ なので、これは「一周の平行移動の回転角は、囲む領域でのガウス曲率の積分で決まる」ことの例であり、\ref{surf:page-gauss-bonnet-local} の内容である。

**高い視点.** 共変微分は、曲面の接ベクトル場に作用する「微分」で、平行移動はそれを積分したものである（線形常微分方程式の解）。平行移動が道筋によることがホロノミーで、無限小のホロノミーが曲率にあたる。指数写像から、測地線を座標曲線にとる座標（正規座標・測地極座標）が作られ、曲面の内在的な幾何の基本的な道具になる。
:::

## 問題 {#surf:sec-gd-problems}

::: problem {#surf:prob-gd-plane}
★ 基本：平面 $f(u)=(u^{1},u^{2},0)$ の測地線は直線（を一定の速さでたどったもの）と定値曲線であり、極座標 $f(r,\theta)=(r\cos\theta,r\sin\theta,0)$ で書いた測地線の方程式 $r''-r\theta'^{2}=0$, $\theta''+\frac2r r'\theta'=0$ が直線の方程式であることを確かめよ。
:::

::: solution
デカルト座標では $\Gamma=0$ なので方程式は $\gamma''=0$、解は $\gamma(t)=a+tb$。極座標では \ref{surf:christoffel-metric} の例から $\Gamma^{1}_{22}=-r$, $\Gamma^{2}_{12}=\frac1r$ なので、方程式は $r''-r\theta'^{2}=0$, $\theta''+\frac2rr'\theta'=0$。$c=(r\cos\theta,r\sin\theta)$ について $c''=(r''-r\theta'^{2})\mathbf{u}+(r\theta''+2r'\theta')J\mathbf{u}$（$\mathbf{u}=(\cos\theta,\sin\theta)$）なので、方程式は $c''=0$ と同値。
:::

::: problem {#surf:prob-gd-cylinder}
★ 基本：円柱 $f(u,v)=(\cos u,\sin u,v)$ の測地線は、$\gamma(t)=(at+b,ct+d)$ を $f$ で写したもの（母線・円・常らせん）であることを示せ。
:::

::: solution
$E=G=1$, $F=0$ は定数なので $\Gamma=0$（\ref{surf:christoffel-metric}）、測地線の方程式は $\gamma''=0$。解は一次関数 $\gamma(t)=(at+b,ct+d)$ で、$f\circ\gamma=(\cos(at+b),\sin(at+b),ct+d)$ は $a=0$ なら母線、$c=0$ なら円、どちらも $0$ でなければ常らせん。
:::

::: problem {#surf:prob-gd-clairaut}
★★ 標準：**（クレローの関係式）** 回転面 $f(t,\varphi)=(\rho(t)\cos\varphi,\rho(t)\sin\varphi,z(t))$（母線は弧長で径数づけ、$\rho>0$）の弧長で径数づけられた測地線 $c=f\circ(t(s),\varphi(s))$ について、$\rho^{2}\varphi'$ は一定であることを示せ。$\psi$ を $c'$ と緯線（$\varphi$ 方向）のなす角とすると、$\rho\cos\psi$ が一定であることを示せ。とくに子午線（$\varphi$ が一定）は測地線であることを確かめよ。
:::

::: solution
$E=1$, $F=0$, $G=\rho(t)^{2}$。\ref{surf:orthogonal-curvature-formula} の Step 1 から $\Gamma^{2}_{12}=\frac{G_{t}}{2G}=\frac{\rho'}{\rho}$, $\Gamma^{2}_{11}=\Gamma^{2}_{22}=0$（$G_{\varphi}=0$, $E_{\varphi}=0$）。$\varphi$ の方程式は $\varphi''+2\frac{\rho'}{\rho}t'\varphi'=0$ で、$(\rho^{2}\varphi')'=2\rho\rho't'\varphi'+\rho^{2}\varphi''=0$。$\cos\psi=\langle c',f_{\varphi}\rangle/|f_{\varphi}|=\rho^{2}\varphi'/\rho=\rho\varphi'$ なので $\rho\cos\psi=\rho^{2}\varphi'$ は一定。子午線 $\gamma(s)=(s,\varphi_{0})$：$\varphi$ の方程式は自明、$t$ の方程式は $t''+\Gamma^{1}_{11}t'^{2}+\cdots=0$ で、$\Gamma^{1}_{11}=\frac{E_{t}}{2E}=0$、$\varphi'=0$ なので $t''=0$ をみたす。
:::

::: problem {#surf:prob-gd-parallel-geodesic}
★★ 標準：測地線 $c$ に沿って平行な接ベクトル場 $X$ は、$c'$ と一定の角をなすことを示せ。また、曲面上の弧長で径数づけられた曲線 $c$ に沿って平行な単位ベクトル場 $X$ をとり、$c'$ と $X$ のなす角を $\theta(s)$（連続に選ぶ）とすると $\theta'=\kappa_{g}$ となる（符号は $X$ から $c'$ へ $n$ のまわりに測る）ことを示せ。
:::

::: solution
前半：$c'$ も $X$ も平行なので、\ref{surf:parallel-transport} の Step 2 と同じく $\langle c',X\rangle$ と $|c'|$, $|X|$ は一定。

後半：$Y\defeq n\times X$ とする。$Y$ は単位接ベクトルで $X$ に直交し（ラグランジュの恒等式）、$\langle\frac{\nabla Y}{ds},Y\rangle=\frac12(|Y|^{2})'=0$、$\langle\frac{\nabla Y}{ds},X\rangle=\langle Y,X\rangle'-\langle Y,\frac{\nabla X}{ds}\rangle=0$ なので、接ベクトル $\frac{\nabla Y}{ds}$ は $0$、すなわち $Y$ も平行。$\alpha\defeq\langle c',X\rangle$, $\beta\defeq\langle c',Y\rangle$ とすると $c'=\alpha X+\beta Y$、$e_{2}=n\times c'=\alpha Y+\beta\,n\times Y=\alpha Y-\beta X$（$n\times(n\times X)=-X$ は成分で確かめられる公式 $a\times(b\times c)=\langle a,c\rangle b-\langle a,b\rangle c$ による）。\ref{surf:curvature-decomposition} から $\frac{\nabla c'}{ds}=\kappa_{g}e_{2}$ なので、$\alpha'=\langle\frac{\nabla c'}{ds},X\rangle=-\kappa_{g}\beta$, $\beta'=\kappa_{g}\alpha$。$\tilde\theta(s)\defeq\theta(0)+\int_{0}^{s}\kappa_{g}$ について $(\cos\tilde\theta,\sin\tilde\theta)$ も同じ線形方程式をみたし、$s=0$ で $(\alpha,\beta)$ と一致するので、\ref{surf:linear-ode} から $(\alpha,\beta)=(\cos\tilde\theta,\sin\tilde\theta)$。$\theta$ と $\tilde\theta$ はともに $(\alpha,\beta)$ の連続な持ち上げなので差は定数（\ref{surf:angle-lifting.2}）で、$\theta'=\tilde\theta'=\kappa_{g}$。
:::
