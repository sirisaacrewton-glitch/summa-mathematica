# 微分幾何学（Differential Geometry）

曲線と曲面の微分幾何、ガウス＝ボネの定理。リーマン計量（接続・曲率・測地線・ホッジ理論）、シンプレクティック形式・ケーラー構造などの付加構造（幾何構造）を入れた多様体の幾何。

<p class="mn-msc">MSC2020: 53A, 53B, 53C, 53D</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-curves/index.html"><span class="mn-card-title">曲線論</span><span class="mn-card-en">Theory of Curves</span><span class="mn-card-desc">ℝⁿ の正則曲線、弧長、フレネ標構とフレネ–セレの公式、曲率・捩率、曲線論の基本定理（合同を除く一意性と存在）、平面曲線と空間曲線。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="02-surfaces/index.html"><span class="mn-card-title">曲面論</span><span class="mn-card-en">Theory of Surfaces</span><span class="mn-card-desc">ℝ³ の曲面片と正則曲面、接平面、第一基本形式（長さ・角・面積）、ガウス写像と第二基本形式、主曲率・ガウス曲率・平均曲率、ガウスの驚異の定理、共変微分と測地線、ガウス＝ボネの定理。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="03-riemannian/index.html"><span class="mn-card-title">リーマン幾何</span><span class="mn-card-en">Riemannian Geometry</span><span class="mn-card-desc">リーマン計量と距離、ベクトル束の接続と共変微分・平行移動、レビ–チビタ接続、曲率テンソル・断面曲率・リッチ曲率、測地線と指数写像・ガウスの補題、ホッジの星作用素と余微分・ラプラシアン。</span><span class="mn-card-count">6 ページ</span></a>
