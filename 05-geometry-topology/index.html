# 幾何・位相（Geometry and Topology）

一般位相、代数的位相幾何、代数幾何、微分幾何、リー群。

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-general-topology/index.html"><span class="mn-card-title">一般位相</span><span class="mn-card-en">General Topology</span><span class="mn-card-desc">位相空間と連続写像、部分空間・直積・商、分離公理、コンパクト性とチコノフの定理、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性、距離空間と距離化、関数空間とアスコリ–アルツェラの定理、超空間とフラクタル集合、一様空間、局所連結性とカントール集合、完全写像。</span><span class="mn-card-count">54 ページ</span></a>
<a class="mn-card" href="02-algebraic-topology/index.html"><span class="mn-card-title">代数的位相幾何学</span><span class="mn-card-en">Algebraic Topology</span><span class="mn-card-desc">ホモトピー、ホモロジー、コホモロジー。</span><span class="mn-card-count">26 ページ</span></a>
<a class="mn-card" href="03-algebraic-geometry/index.html"><span class="mn-card-title">代数幾何学</span><span class="mn-card-en">Algebraic Geometry</span><span class="mn-card-desc">アフィン・射影多様体、次元と非特異性、代数曲線、スキームと層、コホモロジー、曲線のリーマン–ロッホの定理。</span><span class="mn-card-count">16 ページ</span></a>
<a class="mn-card" href="04-manifolds/index.html"><span class="mn-card-title">多様体論</span><span class="mn-card-en">Manifolds</span><span class="mn-card-desc">位相多様体と可微分多様体。位相多様体の基本性質、平面のシェーンフリースの定理、ラドーの三角形分割定理と閉曲面の分類、可微分構造・接空間・微分形式・ストークスの定理など、多様体であるというだけで（計量などの付加構造なしに）定まる理論。</span><span class="mn-card-count">16 ページ</span></a>
<a class="mn-card" href="05-differential-geometry/index.html"><span class="mn-card-title">微分幾何学</span><span class="mn-card-en">Differential Geometry</span><span class="mn-card-desc">曲線と曲面の微分幾何、ガウス＝ボネの定理。リーマン計量・シンプレクティック形式などの付加構造（幾何構造）を入れた多様体の幾何。</span><span class="mn-card-count">11 ページ</span></a>
<a class="mn-card" href="06-lie-groups/index.html"><span class="mn-card-title">位相群とリー群</span><span class="mn-card-en">Topological Groups and Lie Groups</span><span class="mn-card-desc">位相群とその一様構造・距離化、リー群とリー代数、指数写像、閉部分群定理、等質空間。</span><span class="mn-card-count">3 ページ</span></a>
</div>
