# 代数幾何学（Algebraic Geometry）

アフィン・射影多様体、次元と非特異性、代数曲線、スキームと層、コホモロジー、曲線のリーマン–ロッホの定理。

<p class="mn-msc">MSC2020: 14</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-varieties/index.html"><span class="mn-card-title">代数多様体</span><span class="mn-card-en">Algebraic Varieties</span><span class="mn-card-desc">アフィン代数的集合とザリスキ位相、アフィン多様体と射、射影多様体、次元、有理写像と双有理同値、非特異性、非特異曲線と関数体。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="02-schemes/index.html"><span class="mn-card-title">スキーム</span><span class="mn-card-en">Schemes</span><span class="mn-card-desc">環のスペクトルと構造層、スキームと環の圏の反同値、スキームの性質とファイバー積、分離射と固有射、準連接層、Proj、因子と直線束、コホモロジー、曲線のリーマン–ロッホの定理。グロタンディークの定義の意図と永田の反例への対処にも触れる。</span><span class="mn-card-count">9 ページ</span></a>
