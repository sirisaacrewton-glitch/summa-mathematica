# 射影多様体 {#ag:page-projective-varieties keywords="projective space, homogeneous polynomials, homogeneous ideals, irrelevant ideal, projective algebraic sets, Zariski topology on projective space, projective Nullstellensatz, affine cone, standard affine charts, homogenization and dehomogenization, projective and quasi-projective varieties, regular functions on P^n are constant"}

アフィン空間に「無限遠の点」を付け加えたものが**射影空間** $\mathbb{P}^{n}$ である。$\mathbb{P}^{n}$ の点は $k^{n+1}$ の原点を通る直線で、斉次座標 $(a_{0}:\dots:a_{n})$ で表される。斉次多項式の零点集合が**射影代数的集合**で、**射影零点定理**により、根基な斉次イデアル（ただし「無関係なイデアル」$S_{+}$ を除く）と一対一に対応する。$\mathbb{P}^{n}$ は $n+1$ 個のアフィン空間 $U_{i}\cong\mathbb{A}^{n}$ で覆われ、射影多様体は「アフィン多様体を貼り合わせたもの」として扱える。


## 記法と定義の確認 {#ag:sec-pv-notation}

::: notation
- $k$ は代数閉体。$S\defeq k[x_{0},\dots,x_{n}]$、$S_{d}$ は $d$ 次の斉次多項式（と $0$）の空間で $S=\bigoplus_{d\ge0}S_{d}$。$S_{+}\defeq\bigoplus_{d>0}S_{d}=(x_{0},\dots,x_{n})$ を**無関係なイデアル**という。
- アフィン代数的集合・零点定理による対応・既約性・ネーター空間・アフィン多様体と射は \ref{ag:algebraic-set}, \ref{ag:algebraic-radical-correspondence}, \ref{ag:irreducible-prime}, \ref{ag:irreducible-decomposition}, \ref{ag:morphisms-coordinate-rings}。アフィンの零点集合を $V^{\mathrm{a}}$、イデアルを $I^{\mathrm{a}}$ と書いて区別する。
- **選択公理**：使わない。
:::

## 射影空間と斉次イデアル {#ag:sec-pv-homogeneous}

::: definition 射影空間 {#ag:projective-space keywords="projective space as lines through the origin, homogeneous coordinates" index="射影空間|しゃえいくうかん, 斉次座標|せいじざひょう"}
$k^{n+1}\setminus\{0\}$ に $a\sim\lambda a$（$\lambda\in k^{\times}$）で同値関係を入れた商集合を $n$ 次元の**射影空間** $\mathbb{P}^{n}$ といい、$a$ の類を $(a_{0}:\dots:a_{n})$（**斉次座標**）と書く。$f\in S_{d}$ について $f(\lambda a)=\lambda^{d}f(a)$ なので、「$f(a)=0$」は類だけで決まる。
:::

::: definition 斉次イデアル {#ag:homogeneous-ideal keywords="homogeneous ideal: generated by homogeneous elements, equivalently closed under homogeneous components" index="斉次イデアル|せいじいである"}
$S$ のイデアル $\mathfrak{a}$ が**斉次**であるとは、$\mathfrak{a}=\bigoplus_{d}(\mathfrak{a}\cap S_{d})$、すなわち $f\in\mathfrak{a}$ の斉次成分 $f_{d}$ がすべて $\mathfrak{a}$ に入ることをいう。
:::

::: lemma 斉次イデアルの性質 {#ag:homogeneous-ideal-properties keywords="homogeneous iff generated by homogeneous elements; sums, products, intersections, radicals of homogeneous ideals are homogeneous; primality can be tested on homogeneous elements" index="斉次イデアルの性質|せいじいであるのせいしつ"}
1. $\mathfrak{a}$ が斉次 $\iff$ 斉次元で生成される。
2. 斉次イデアルの和・積・共通部分・根基は斉次。
3. 斉次イデアル $\mathfrak{p}\neq S$ が素であることは、斉次元 $f,g$ について $fg\in\mathfrak{p}\Rightarrow f\in\mathfrak{p}$ または $g\in\mathfrak{p}$ を確かめれば十分。
:::

::: proof
**Step 1（1）.** $\Rightarrow$：斉次成分の全体が生成する。$\Leftarrow$：斉次元 $h_{\lambda}$ で生成されるとき、$f=\sum a_{\lambda}h_{\lambda}$ の $d$ 次成分は $\sum(a_{\lambda})_{d-\deg h_{\lambda}}h_{\lambda}\in\mathfrak{a}$。

**Step 2（2：和・積・共通部分）.** 和と積は斉次な生成元の和・積で生成される。共通部分：$f\in\mathfrak{a}\cap\mathfrak{b}$ の斉次成分は両方に入る。

**Step 3（2：根基）.** $f\in\sqrt{\mathfrak{a}}$ の最高次の斉次成分 $f_{e}$ について、$f^{m}\in\mathfrak{a}$ の最高次成分は $f_{e}^{m}$ で、$\mathfrak{a}$ は斉次なので $f_{e}^{m}\in\mathfrak{a}$、$f_{e}\in\sqrt{\mathfrak{a}}$。$f-f_{e}\in\sqrt{\mathfrak{a}}$ に同じ議論を繰り返す（次数の帰納法）。

**Step 4（3）.** $fg\in\mathfrak{p}$, $f,g\notin\mathfrak{p}$ とする。$f$ から、$\mathfrak{p}$ に入る斉次成分の和 $f'$ を引いても $f-f'\notin\mathfrak{p}$ で $(f-f')g=fg-f'g\in\mathfrak{p}$。$g$ も同様にすると、$f,g$ の $0$ でない斉次成分はどれも $\mathfrak{p}$ に入らないとしてよい。最高次の成分を $f_{a}$, $g_{b}$ とすると、$fg$ の $a+b$ 次成分は $f_{a}g_{b}$ で、$\mathfrak{p}$ は斉次なので $f_{a}g_{b}\in\mathfrak{p}$。仮定から $f_{a}$ か $g_{b}$ が $\mathfrak{p}$ に入り、矛盾。
:::

::: definition 射影代数的集合 {#ag:projective-algebraic-set keywords="projective algebraic set, Zariski topology on P^n, homogeneous ideal of a subset" index="射影代数的集合|しゃえいだいすうてきしゅうごう"}
斉次元の集合 $T\subset S$ について $V(T)\defeq\{P\in\mathbb{P}^{n} : f(P)=0\ (f\in T)\}$ を**射影代数的集合**という。斉次イデアル $\mathfrak{a}$ について $V(\mathfrak{a})\defeq V(\mathfrak{a}\text{ の斉次元})$。部分集合 $Y\subset\mathbb{P}^{n}$ について、$Y$ のすべての点で消える斉次多項式が生成するイデアルを $I(Y)$ とする（斉次イデアル）。射影代数的集合を閉集合とする位相（\ref{ag:zero-set-properties} と同じ議論）を $\mathbb{P}^{n}$ の**ザリスキ位相**という。既約な射影代数的集合を**射影多様体**、射影多様体の空でない開集合を**準射影多様体**という。
:::

## 射影零点定理 {#ag:sec-pv-nullstellensatz}

::: theorem 射影零点定理 {#ag:projective-nullstellensatz keywords="projective Nullstellensatz: V(a) empty iff sqrt(a) contains S_+; otherwise I(V(a)) = sqrt(a); affine cone" index="射影零点定理|しゃえいれいてんていり, アフィン錐|あふぃんすい" refname="射影零点定理"}
$\mathfrak{a}\subset S$ を斉次イデアルとする。
1. $V(\mathfrak{a})=\emptyset$ $\iff$ $\sqrt{\mathfrak{a}}\supset S_{+}$。
2. $V(\mathfrak{a})\neq\emptyset$ なら $I(V(\mathfrak{a}))=\sqrt{\mathfrak{a}}$。
3. したがって $V$ と $I$ は、$\mathbb{P}^{n}$ の射影代数的集合と、$S_{+}$ を含まない（すなわち $S_{+}$ と $S$ 以外の）根基な斉次イデアルの間の、包含を逆にする一対一対応。射影多様体は斉次素イデアル（$S_{+}$ 以外）に対応する。
:::

::: proof
**Step 1（アフィン錐）.** 射影代数的集合 $Y=V(\mathfrak{a})$ について、$\pi:k^{n+1}\setminus\{0\}\to\mathbb{P}^{n}$ による逆像に原点を加えた $C(Y)\defeq\pi^{-1}(Y)\cup\{0\}$ を**アフィン錐**という。$\mathfrak{a}$ が斉次なので、$\mathfrak{a}\neq S$ なら $V^{\mathrm{a}}(\mathfrak{a})=C(Y)$（$f\in\mathfrak{a}$ の斉次成分は $\mathfrak{a}$ に入り、$a$ と $\lambda a$ で同時に消える；原点は $\mathfrak{a}\subset S_{+}$ の元で消える）。

**Step 2（1）.** $V(\mathfrak{a})=\emptyset$ $\iff$ $V^{\mathrm{a}}(\mathfrak{a})\subset\{0\}$ $\iff$ $\sqrt{\mathfrak{a}}=I^{\mathrm{a}}(V^{\mathrm{a}}(\mathfrak{a}))\supset I^{\mathrm{a}}(\{0\})=S_{+}$（アフィンの零点定理 \tref{ring:nullstellensatz}；$V^{\mathrm{a}}(\mathfrak{a})=\emptyset$ の場合は $\sqrt{\mathfrak{a}}=S$）。

**Step 3（2）.** $V(\mathfrak{a})\neq\emptyset$ なら、斉次多項式 $f$ が $V(\mathfrak{a})$ で消えること $\iff$ $C(V(\mathfrak{a}))=V^{\mathrm{a}}(\mathfrak{a})$ で消えること（$\deg f>0$；$\deg f=0$ の $0$ でない定数は消えない）$\iff$ $f\in\sqrt{\mathfrak{a}}$。$I(V(\mathfrak{a}))$ も $\sqrt{\mathfrak{a}}$ も斉次（\ref{ag:homogeneous-ideal-properties}）なので、斉次元が一致すれば一致する。

**Step 4（3）.** 1・2 と、根基な斉次イデアル $\mathfrak{b}\neq S$ が $S_{+}\subset\mathfrak{b}$ なら $\mathfrak{b}=S_{+}$（$S_{+}$ は極大）から。既約性⇔素はアフィンの場合（\ref{ag:irreducible-prime}）と同じ議論を斉次元について行う（\ref{ag:homogeneous-ideal-properties.3}）。
:::

## 標準アフィン被覆 {#ag:sec-pv-charts}

::: theorem 標準アフィン被覆 {#ag:standard-affine-charts keywords="U_i = D_+(x_i) is homeomorphic to A^n via dehomogenization; P^n is covered by n+1 affine spaces" index="標準アフィン被覆|ひょうじゅんあふぃんひふく, 斉次化|せいじか, 非斉次化|ひせいじか"}
$U_{i}\defeq\mathbb{P}^{n}\setminus V(x_{i})$ は開集合で、$\mathbb{P}^{n}=U_{0}\cup\cdots\cup U_{n}$。写像
$$
\varphi_{i}:U_{i}\to\mathbb{A}^{n},\qquad(a_{0}:\dots:a_{n})\mapsto\Bigl(\tfrac{a_{0}}{a_{i}},\dots,\widehat{\tfrac{a_{i}}{a_{i}}},\dots,\tfrac{a_{n}}{a_{i}}\Bigr)
$$
はザリスキ位相についての同相写像。
:::

::: proof
$i=0$ とし、$y_{j}\defeq x_{j}/x_{0}$, $B\defeq k[y_{1},\dots,y_{n}]$ とする。

**Step 1（全単射）.** 逆写像は $(b_{1},\dots,b_{n})\mapsto(1:b_{1}:\dots:b_{n})$。

**Step 2（非斉次化と斉次化）.** $d$ 次の斉次 $f\in S$ に $\alpha(f)\defeq f(1,y_{1},\dots,y_{n})\in B$（**非斉次化**）を、$g\in B$（次数 $e$）に $\beta(g)\defeq x_{0}^{e}g(x_{1}/x_{0},\dots,x_{n}/x_{0})\in S_{e}$（**斉次化**）を対応させる。$P\in U_{0}$ について $f(P)=0\iff\alpha(f)(\varphi_{0}(P))=0$（$f(a)=a_{0}^{d}\alpha(f)(a/a_{0})$）、$b\in\mathbb{A}^{n}$ について $g(b)=0\iff\beta(g)(\varphi_{0}^{-1}(b))=0$。

**Step 3（同相）.** $U_{0}$ の閉集合は $V(T)\cap U_{0}$（$T$ は斉次元の集合）で、Step 2 から $\varphi_{0}(V(T)\cap U_{0})=V^{\mathrm{a}}(\alpha(T))$ は閉。逆に $\mathbb{A}^{n}$ の閉集合 $V^{\mathrm{a}}(T')$ について $\varphi_{0}^{-1}(V^{\mathrm{a}}(T'))=V(\beta(T'))\cap U_{0}$ は閉。よって $\varphi_{0}$ と逆写像はどちらも閉写像（閉集合を閉集合に写す）で、同相。
:::

::: definition 正則関数と射（準射影多様体） {#ag:quasi-projective-regular keywords="regular functions on quasi-projective varieties: locally quotients of homogeneous polynomials of the same degree" index="準射影多様体の正則関数|じゅんしゃえいたようたいのせいそくかんすう"}
準射影多様体 $Y$ の開集合 $U$ 上の関数 $\varphi$ が**正則**であるとは、各点の近傍で、同じ次数の斉次多項式 $g,h$（$h$ はその近傍で $0$ にならない）により $\varphi=g/h$ と書けることをいう（同じ次数なので値は斉次座標の取り方によらない）。射は \ref{ag:morphism-varieties} と同じく定義する。$U_{i}$ の上では、$g/h$ は非斉次化 $\alpha(g)/\alpha(h)$ と同じ関数で、正則関数・射の概念はアフィンの場合と一致する（\ref{ag:standard-affine-charts} の Step 2）。とくに $\varphi_{i}$ は多様体の同型 $U_{i}\cong\mathbb{A}^{n}$。
:::

::: proposition 射影空間上の正則関数 {#ag:regular-functions-projective-space keywords="global regular functions on P^n are constant" index="射影空間上の正則関数|しゃえいくうかんじょうのせいそくかんすう"}
$\mathcal{O}(\mathbb{P}^{n})=k$（$n\ge1$）。
:::

::: proof
$\varphi\in\mathcal{O}(\mathbb{P}^{n})$ の $U_{i}$ への制限は $\mathcal{O}(U_{i})\cong k[x_{0}/x_{i},\dots,x_{n}/x_{i}]$（\ref{ag:regular-functions-principal}）の元で、$G_{i}/x_{i}^{d_{i}}$（$G_{i}\in S_{d_{i}}$, $x_{i}\nmid G_{i}$）と一意に書ける（有理関数体 $k(x_{0},\dots,x_{n})$ の次数 0 の元として）。$U_{0}\cap U_{1}$ の上で一致するので（一致の原理）、$k(x_{0},\dots,x_{n})$ の中で $G_{0}x_{1}^{d_{1}}=G_{1}x_{0}^{d_{0}}$。$x_{0}$ は素元で $x_{0}\nmid G_{0}x_{1}^{d_{1}}$ なので $d_{0}=0$、すなわち $\varphi|_{U_{0}}=G_{0}$ は次数 0、定数。一致の原理（$\mathbb{P}^{n}$ は既約）から $\varphi$ は定数。
:::

::: example 射影多様体の例 {#ag:projective-examples}
1. **射影直線** $\mathbb{P}^{1}=U_{0}\cup U_{1}$ は二つの $\mathbb{A}^{1}$ を $U_{0}\cap U_{1}\cong\mathbb{A}^{1}\setminus\{0\}$ で $t\mapsto1/t$ により貼り合わせたもの。
2. **2 次曲線**：$C=V(xz-y^{2})\subset\mathbb{P}^{2}$ は、$\nu:\mathbb{P}^{1}\to\mathbb{P}^{2}$, $(s:t)\mapsto(s^{2}:st:t^{2})$（**ヴェロネーゼ埋め込み**の $n=1$, $d=2$ の場合）の像で、$\nu$ は $\mathbb{P}^{1}$ と $C$ の同型。逆は $U_{x}$ 上 $(x:y:z)\mapsto(x:y)$、$U_{z}$ 上 $(y:z)$（$xz=y^{2}$ から両者は $U_{x}\cap U_{z}$ で一致）。
3. **射影閉包**：アフィン多様体 $Y\subset\mathbb{A}^{n}\cong U_{0}$ の $\mathbb{P}^{n}$ での閉包 $\bar Y$ は射影多様体で、$I(\bar Y)$ は $I^{\mathrm{a}}(Y)$ の元の斉次化で生成される（$\bar Y=V(\beta(I^{\mathrm{a}}(Y)))$。生成元だけを斉次化しても一般には足りない：ねじれ 3 次曲線で $y-x^{2}$, $z-x^{3}$ の斉次化だけでは無限遠に余分な成分が出る）。
:::

::: hypcheck
- **選択公理**：使わない。
- **$k$ が代数閉体**：射影零点定理（アフィンの零点定理を通して）に使った。
- **$n\ge1$**：\ref{ag:regular-functions-projective-space} で二つのアフィン被覆 $U_{0},U_{1}$ を使った。$n=0$ では $\mathbb{P}^{0}$ は 1 点で $\mathcal{O}=k$ は自明に成り立つ。
- \ref{ag:homogeneous-ideal-properties.3} は斉次素イデアルの判定で、射影多様体⇔斉次素イデアルに使った。
:::

::: supplement
**一般の射影多様体の大域的な正則関数.** 任意の射影多様体 $Y$ について $\mathcal{O}(Y)=k$ である。証明には、斉次座標環 $S/I(Y)$ の整性に関する議論か、射影多様体の「完備性」を使う。本サイトでは後者（消去法の主定理 \tref{ag:elimination-theorem}）で \ref{ag:projective-regular-constant} として示す。

**グロタンディークの Proj.** 斉次座標環 $S(Y)=S/I(Y)$ から $Y$ を復元する構成を、一般の次数付き環に拡げたものが $\operatorname{Proj}$（\ref{ag:page-proj}）である。「$S_{+}$ を含む素イデアルを除く」ことが射影零点定理の「無関係なイデアル」に対応する。

**計算の観点.** 射影閉包のイデアル（斉次化イデアル）は、次数付き辞書式順序のグレブナー基底を斉次化すれば得られることが知られている（本サイト未収録）。
:::

## 高い視点 {#ag:sec-pv-viewpoint}

::: remark 無限遠を加えると閉じる
射影空間は、アフィン空間の「遠くへ逃げる方向」をすべて点として付け加えたものである。そのおかげで、射影平面の 2 直線は（平行でも）必ず交わり、射影多様体の上の正則関数は定数しかない（コンパクトなリーマン面上の正則関数が定数であることの代数版）。比喩で言えば、アフィン多様体は地図の一枚、射影多様体は地球儀で、地球儀は有限枚の地図（$U_{i}$）を貼り合わせてできる。地図の上には多くの関数があるが、地球儀全体で矛盾なく定義される関数は定数だけである。
:::

## 問題 {#ag:sec-pv-problems}

::: problem {#ag:prob-pv-two-lines}
$\mathbb{P}^{2}$ の相異なる 2 直線 $V(a_{0}x_{0}+a_{1}x_{1}+a_{2}x_{2})$, $V(b_{0}x_{0}+b_{1}x_{1}+b_{2}x_{2})$ はちょうど 1 点で交わることを示せ。
:::

::: solution
交点は、斉次連立 1 次方程式 $a\cdot x=b\cdot x=0$ の $0$ でない解の類。係数ベクトル $a,b$ は比例しない（相異なる直線）ので係数行列の階数は 2、解空間は $k^{3}$ の 1 次元部分空間で、その $0$ でない元の類は $\mathbb{P}^{2}$ のちょうど 1 点。例：$U_{2}$（座標 $(x_{0}/x_{2},x_{1}/x_{2})$）で平行な 2 直線 $x_{1}/x_{2}=0$, $x_{1}/x_{2}=1$ の閉包 $V(x_{1})$, $V(x_{1}-x_{2})$ の交点は $x_{1}=x_{2}=0$ の $(1:0:0)$ で、$U_{2}$ の「無限遠直線」$V(x_{2})$ の上にある。
:::
