# スキームのコホモロジー {#ag:page-scheme-cohomology keywords="Cech complex of a quasi-coherent sheaf for a principal open cover is exact, Cartan lemma, Serre vanishing on affine schemes, higher cohomology of quasi-coherent sheaves on affine schemes vanishes, Cech cohomology computes sheaf cohomology on separated schemes, cohomology and closed immersions, cohomology of O(m) on P^1, H^1(P^1, O(-2)), A^2 minus origin, cohomology of projective space, Grothendieck vanishing, Serre finiteness, Tohoku"}

層コホモロジー（\ref{cat:sheaf-cohomology}）をスキームの準連接層に使う。中心は**セールの消滅定理**：アフィンスキーム上の準連接層の高次コホモロジーは消える。証明は、主開集合の被覆のチェック複体が完全であるという代数的な計算と、それを導来関手のコホモロジーに移す「カルタンの補題」型の帰納法による（ネーター性は使わない）。系として、分離スキームではアフィン開被覆のチェック複体でコホモロジーが計算でき、$\mathbb{P}^{1}_{A}$ 上の $\mathcal{O}(m)$ のコホモロジーを具体的に求める。


## 記法と定義の確認 {#ag:sec-co-notation}

::: notation
- 層コホモロジー $H^{q}(X,F)$（アーベル群の層の圏での $\Gamma$ の右導来関手）と長完全列は \ref{cat:sheaf-cohomology}, \ref{cat:sheaf-cohomology-basic}。脆弱層とその非輪状性、入射層は脆弱、開集合への制限・順像は脆弱性を保つことは \ref{cat:flasque}, \ref{cat:flasque-acyclic}, \ref{cat:flasque-examples}。非輪状分解による計算は \ref{cat:acyclic-resolution}。
- チェック複体 $C^{\bullet}(\mathcal{U},F)$（**すべての**添字の列 $(i_{0},\dots,i_{p})$ をとるもの）とその基本性質、ルレイの定理、二つの開集合の被覆は \ref{cat:cech-complex}, \ref{cat:cech-basic}, \tref{cat:leray-theorem}, \ref{cat:cech-two-cover}。複体の短完全列の長完全列は \ref{ha:long-exact-sequence}。
- 準連接層・$\widetilde{M}$ は \ref{ag:quasi-coherent}, \ref{ag:tilde-properties}, \ref{ag:qc-affine}。分離スキームのアフィン開集合の交わりはアフィン（\ref{ag:separated-affine-intersection}）。$\mathbb{P}^{n}_{A}$ と $\mathcal{O}(m)$ は \ref{ag:proj-projective-space}, \ref{ag:twisting-sheaf-properties}。
- $\mathcal{O}_{X}$ 加群のコホモロジーも、アーベル群の層としてのコホモロジーで定義する（$\mathcal{O}_{X}$ 加群の圏での導来関手と一致することが知られている）。
- **選択公理**：層コホモロジーの定義（入射分解の存在、\ref{cat:ab-sheaves-enough-injectives}）と、\ref{ag:qc-affine} を通して使う。
:::

## アフィンスキームでの消滅 {#ag:sec-co-affine}

::: lemma 主開集合の被覆のチェック複体 {#ag:cech-principal-exact keywords="for f_1,...,f_r generating the unit ideal, the Cech complex of M tilde for the cover D(f_i) is a resolution of M" index="チェック複体の完全性（主開集合）|ちぇっくふくたいのかんぜんせいしゅかいしゅうごう"}
（AC）$f_{1},\dots,f_{r}\in A$ が単位イデアルを生成し、$\mathcal{U}=\{D(f_{i})\}$ とする。$A$ 加群 $M$ について、$0\to M\to C^{0}(\mathcal{U},\widetilde{M})\to C^{1}(\mathcal{U},\widetilde{M})\to\cdots$ は完全。とくに $p\ge1$ で $\check{H}^{p}(\mathcal{U},\widetilde{M})=0$。
:::

::: proof
**Step 1（複体の形）.** $D(f_{i_{0}})\cap\cdots\cap D(f_{i_{p}})=D(f_{\sigma})$（$f_{\sigma}\defeq f_{i_{0}}\cdots f_{i_{p}}$）なので、\ref{ag:tilde-properties.3} から $C^{p}=\prod_{\sigma\in\{1,\dots,r\}^{p+1}}M_{f_{\sigma}}$（有限積）で、微分は局所化の写像の交代和。$M\to C^{0}$ を $m\mapsto(m/1)_{i}$ として、増大複体 $C^{\bullet}_{+}$（$C^{-1}_{+}\defeq M$）を考える。

**Step 2（局所化しても同じ形）.** $j$ を固定する。局所化は完全で有限積と交換するので、$(C^{\bullet}_{+})_{f_{j}}$ は $\prod_{\sigma}M_{f_{\sigma}f_{j}}$ からなり、これは $A_{f_{j}}$ 加群 $M_{f_{j}}$ と被覆 $\{D(f_{i}f_{j})\}_{i}$（$\operatorname{Spec}A_{f_{j}}$ の被覆）の増大チェック複体である。この被覆では $i=j$ の成分が全体 $D(f_{j})$ に等しい。

**Step 3（全体を含む被覆の複体は可縮）.** 一般に、被覆 $\{V_{i}\}$ のある成分 $V_{j}$ が全体 $V$ に等しいとき、前層 $F$ の増大チェック複体は可縮：$h:C^{p}\to C^{p-1}$ を $(hc)_{i_{0}\cdots i_{p-1}}\defeq c_{j\,i_{0}\cdots i_{p-1}}$（$p\ge1$）、$h:C^{0}\to C^{-1}=F(V)$ を $c\mapsto c_{j}$ と定めると、$V_{j}\cap V_{\tau}=V_{\tau}$ なので制限は不要で、
$$
(dhc+hdc)_{i_{0}\cdots i_{p}}=\sum_{k}(-1)^{k}c_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}+\Bigl(c_{i_{0}\cdots i_{p}}-\sum_{k}(-1)^{k}c_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}\Bigr)=c_{i_{0}\cdots i_{p}}
$$
（$(dc)_{j i_{0}\cdots i_{p}}$ の第 0 項が $c_{i_{0}\cdots i_{p}}$、残りは添字 $i_{k}$ を除いた項で符号が一つずれる）。$p=-1,0$ の端でも同様に $dh+hd=1$。恒等写像がホモトピックに $0$ なので、コホモロジーは $0$。

**Step 4（局所から大域へ）.** Step 2・3 から、増大複体の各位置のコホモロジー加群 $H$ は $H_{f_{j}}=0$（局所化は完全なのでコホモロジーと交換：\ref{ring:localization-exact}）をすべての $j$ でみたす。各素イデアル $\mathfrak{p}$ はある $D(f_{j})$ に入るので $H_{\mathfrak{p}}=(H_{f_{j}})_{\mathfrak{p}}=0$、\ref{ring:local-properties.1} から $H=0$。
:::

::: theorem アフィンスキーム上の消滅（セール） {#ag:serre-vanishing-affine keywords="H^q(Spec A, F) = 0 for q >= 1 and F quasi-coherent; Cartan lemma" index="セールの消滅定理（アフィン）|せーるのしょうめつていりあふぃん"}
（AC）$X=\operatorname{Spec}A$ 上の準連接層 $\mathcal{F}$ について、$q\ge1$ で $H^{q}(X,\mathcal{F})=0$。
:::

::: proof
**Step 1（帰納法の対象）.** $\mathfrak{B}$ を $X$ の主開集合全体とする。$X$ 上のアーベル群の層 $F$ が**条件 (C)** をみたすとは、任意の $V\in\mathfrak{B}$ と、$V$ の主開集合による任意の有限被覆 $\mathcal{V}$ について、$p\ge1$ で $\check{H}^{p}(\mathcal{V},F)=0$ となることとする。準連接層 $\mathcal{F}$ は (C) をみたす：$V=D(g)\cong\operatorname{Spec}A_{g}$ で $\mathcal{F}|_{V}\cong(M_{g})^{\sim}$（\ref{ag:qc-affine}, \ref{ag:tilde-properties.4}）、$V$ の主開集合 $D(gh)$ は $\operatorname{Spec}A_{g}$ の主開集合 $D(h)$ で、有限個で覆うことは $h$ たちが $A_{g}$ の単位イデアルを生成すること（\ref{ag:spec-topology.4}）なので、\ref{ag:cech-principal-exact} が使える。以下、(C) をみたす任意の層 $F$ について、すべての $V\in\mathfrak{B}$ と $q\ge1$ で $H^{q}(V,F)=0$ を $q$ についての帰納法で示す。

**Step 2（入射層への埋め込み）.** $F\to I$ を入射層への単射とし、$0\to F\to I\to Q\to0$ を短完全列とする。$I|_{V}$ は脆弱（\ref{cat:flasque-acyclic.1} と \ref{cat:flasque-examples.2}）なので、$q\ge1$ で $H^{q}(V,I)=0$。長完全列から
$$
H^{1}(V,F)\cong Q(V)/\operatorname{im}I(V),\qquad H^{q}(V,F)\cong H^{q-1}(V,Q)\quad(q\ge2).
$$

**Step 3（$H^{1}$ の消滅）.** $V\in\mathfrak{B}$ と $s\in Q(V)$ をとる。$I\to Q$ は茎で全射なので、$s$ は $V$ のある開被覆の上で局所的に持ち上がり、$V$ は準コンパクトで主開集合が開基なので、主開集合による有限被覆 $\mathcal{V}=\{V_{i}\}$ と $t_{i}\in I(V_{i})$ で $t_{i}\mapsto s|_{V_{i}}$ となるものがとれる。$c_{ij}\defeq t_{j}|-t_{i}|$ は $Q$ で $0$ に写るので $F(V_{ij})$ の元で、$(c_{ij})$ はチェックの 1 コサイクル。(C) から $c=db$、すなわち $c_{ij}=b_{j}|-b_{i}|$（$b_{i}\in F(V_{i})$）。$t_{i}-b_{i}$ は重なりで一致するので $t\in I(V)$ に貼り合わさり、$t\mapsto s$。よって $I(V)\to Q(V)$ は全射、Step 2 から $H^{1}(V,F)=0$。

**Step 4（$Q$ も (C) をみたす）.** $W\in\mathfrak{B}$ と主開集合による有限被覆 $\mathcal{V}$ をとる。被覆の各交わり $V_{\sigma}$ は主開集合なので、Step 3 から $0\to F(V_{\sigma})\to I(V_{\sigma})\to Q(V_{\sigma})\to0$ は完全で、チェック複体の短完全列 $0\to C^{\bullet}(\mathcal{V},F)\to C^{\bullet}(\mathcal{V},I)\to C^{\bullet}(\mathcal{V},Q)\to0$ を得る。$I|_{W}$ は脆弱なので $p\ge1$ で $\check{H}^{p}(\mathcal{V},I)=0$（\ref{cat:cech-basic.3}）。長完全列から $p\ge1$ で $\check{H}^{p}(\mathcal{V},Q)\cong\check{H}^{p+1}(\mathcal{V},F)=0$。

**Step 5（帰納法）.** $q=1$ は Step 3。$q\ge2$ で、$q-1$ まで (C) をみたすすべての層について成り立つとすると、Step 4 から $Q$ は (C) をみたすので $H^{q-1}(V,Q)=0$、Step 2 から $H^{q}(V,F)=0$。$V=X=D(1)$ として定理を得る。
:::

::: corollary 分離スキームのチェック計算 {#ag:cech-separated keywords="on a separated scheme, Cech cohomology of an affine open cover computes the cohomology of a quasi-coherent sheaf" index="チェック計算（分離スキーム）|ちぇっくけいさんぶんりすきーむ"}
（AC）$X$ を分離スキーム、$\mathcal{U}$ をアフィン開被覆、$\mathcal{F}$ を準連接層とすると、すべての $p$ で $\check{H}^{p}(\mathcal{U},\mathcal{F})\cong H^{p}(X,\mathcal{F})$。
:::

::: proof
$X$ は $\operatorname{Spec}\mathbb{Z}$ 上分離的なので、アフィン開集合の有限個の交わりはアフィン（\ref{ag:separated-affine-intersection} を繰り返す）。各交わり $U_{\sigma}$ 上で $\mathcal{F}|_{U_{\sigma}}$ は準連接なので、\ref{ag:serre-vanishing-affine} から $q\ge1$ で $H^{q}(U_{\sigma},\mathcal{F})=0$。\ref{cat:leray-theorem} から結論。（$U_{\sigma}$ でのコホモロジーは $U_{\sigma}$ 上の層 $\mathcal{F}|_{U_{\sigma}}$ のものとして読む。）
:::

::: proposition 閉埋め込みとコホモロジー {#ag:cohomology-closed-immersion keywords="for a closed immersion i, i_* is exact and H^q(X, i_* F) = H^q(Z, F)" index="閉埋め込みとコホモロジー|へいうめこみとこほもろじー"}
（AC）閉埋め込み $i:Z\to X$ と $Z$ 上のアーベル群の層 $F$ について、$H^{q}(X,i_{*}F)\cong H^{q}(Z,F)$。
:::

::: proof
**Step 1（$i_{*}$ は完全）.** $i$ は閉集合への同相なので、$(i_{*}F)_{i(z)}=F_{z}$、$i(Z)$ の外では茎は $0$（\ref{ag:closed-immersion-affine} の Step 2 と同じ議論）。層の列の完全性は茎で判定できるので、$i_{*}$ は完全。

**Step 2（脆弱分解を移す）.** $Z$ 上の脆弱分解 $0\to F\to\mathcal{G}^{\bullet}$（\ref{cat:acyclic-resolution.2}）をとると、$0\to i_{*}F\to i_{*}\mathcal{G}^{\bullet}$ は完全で、$i_{*}\mathcal{G}^{p}$ は脆弱（\ref{cat:flasque-examples.2}）。$\Gamma(X,i_{*}\mathcal{G}^{p})=\Gamma(Z,\mathcal{G}^{p})$ なので、\ref{cat:acyclic-resolution.1} から両辺は同じ複体のコホモロジー。
:::

## 計算例 {#ag:sec-co-examples}

::: example 射影直線の $\mathcal{O}(m)$ {#ag:cohomology-p1 keywords="H^0(P^1, O(m)) = S_m, H^1(P^1, O(m)) is free with basis x_0^a x_1^b with a, b <= -1, a + b = m; H^1(P^1, O(-2)) = A" index="射影直線のコホモロジー|しゃえいちょくせんのこほもろじー"}
（AC）$S=A[x_{0},x_{1}]$, $X=\mathbb{P}^{1}_{A}$ とする。
1. $H^{0}(X,\mathcal{O}(m))\cong S_{m}$（$m<0$ なら $0$）。
2. $H^{1}(X,\mathcal{O}(m))$ は、$a,b\le-1$, $a+b=m$ をみたす $x_{0}^{a}x_{1}^{b}$ を基底とする自由 $A$ 加群。とくに $m\ge-1$ なら $0$、$H^{1}(X,\mathcal{O}(-2))\cong A$、階数は $\max(0,-m-1)$。
:::

::: proof
**Step 1（チェック計算に帰着）.** $X$ は分離的（\ref{ag:proj-separated}）で、$\mathcal{U}=\{D_{+}(x_{0}),D_{+}(x_{1})\}$ はアフィン開被覆、$\mathcal{O}(m)$ は準連接なので、\ref{ag:cech-separated} からチェックコホモロジーで計算できる。

**Step 2（各片の切断）.** \ref{ag:twisting-sheaf-properties} の Step 2 と同じく、$\Gamma(D_{+}(x_{i}),\mathcal{O}(m))=(S_{x_{i}})_{m}$、$\Gamma(D_{+}(x_{0}x_{1}),\mathcal{O}(m))=(S_{x_{0}x_{1}})_{m}$ で、これらは $A[x_{0}^{\pm1},x_{1}^{\pm1}]_{m}$ の中で、それぞれ「$x_{1}$ の指数 $\ge0$」「$x_{0}$ の指数 $\ge0$」「制限なし」の単項式 $x_{0}^{a}x_{1}^{b}$（$a+b=m$）で張られる自由 $A$ 加群。

**Step 3（1・2）.** 1 は \ref{ag:twisting-sheaf-properties.2}。\ref{cat:cech-two-cover} から $\check{H}^{1}(\mathcal{U},\mathcal{O}(m))\cong(S_{x_{0}x_{1}})_{m}/((S_{x_{0}})_{m}+(S_{x_{1}})_{m})$。単項式の基底で見ると、分母は「$a\ge0$ または $b\ge0$」の単項式で張られるので、剰余は $a\le-1$ かつ $b\le-1$ の単項式を基底とする自由加群。$a+b=m$, $a,b\le-1$ の組の数は $m\le-2$ なら $-m-1$（$a=-1,\dots,m+1$）、$m\ge-1$ なら $0$。
:::

::: remark 高次のコホモロジー
$\mathbb{P}^{1}_{A}$ で $q\ge2$ の $H^{q}(\mathcal{O}(m))$ が消えることは、交代チェック複体（2 つの開集合の被覆では $p\ge2$ の項がない）で計算すれば直ちに従うが、本サイトでは「交代チェック複体でも同じコホモロジー」（\ref{cat:cech-complex} の注意で未収録とした）を証明していないので、知られている事実として引用するに留める。より一般に、ネーターな位相空間 $X$ 上のアーベル群の層について、$q>\dim X$ で $H^{q}(X,F)=0$（**グロタンディークの消滅定理**）が知られている（本サイト未収録）。
:::

::: example 原点を除いた平面 {#ag:cohomology-punctured-plane keywords="H^1(A^2 - 0, O) is infinite dimensional; A^2 minus the origin is not affine" index="原点を除いた平面のコホモロジー|げんてんをのぞいたへいめんのこほもろじー"}
$k$ を体、$U=\mathbb{A}^{2}_{k}\setminus\{(x,y)\}=D(x)\cup D(y)$ とする。$U$ は分離的（\ref{ag:separated-criterion}：$D(x)\cap D(y)=D(xy)$ はアフィンで、$k[x,y]_{x}\otimes_{k}k[x,y]_{y}\to k[x,y]_{xy}$ は全射）なので、\ref{ag:cech-separated} と \ref{cat:cech-two-cover} から
$$
H^{1}(U,\mathcal{O}_{U})\cong k[x^{\pm1},y^{\pm1}]/(k[x,y]_{x}+k[x,y]_{y}),
$$
これは $x^{a}y^{b}$（$a,b\le-1$）を基底とする無限次元の空間。とくに \ref{ag:serre-vanishing-affine} から $U$ はアフィンでない（\ref{ag:affine-examples.2} の別証明）。
:::

::: remark 射影空間のコホモロジー
一般に $X=\mathbb{P}^{r}_{A}$（$r\ge1$）、$S=A[x_{0},\dots,x_{r}]$ について、(a) $H^{0}(X,\mathcal{O}(m))\cong S_{m}$、(b) $0<q<r$ で $H^{q}(X,\mathcal{O}(m))=0$、(c) $H^{r}(X,\mathcal{O}(m))$ は $x_{0}^{a_{0}}\cdots x_{r}^{a_{r}}$（すべての $a_{i}\le-1$, $\sum a_{i}=m$）を基底とする自由 $A$ 加群で、とくに $H^{r}(X,\mathcal{O}(-r-1))\cong A$、(d) $H^{r}(\mathcal{O}(m))\times H^{0}(\mathcal{O}(-m-r-1))\to H^{r}(\mathcal{O}(-r-1))\cong A$ は完全な対（セール双対性の原型）であることが知られている（本サイトでは (a) を \ref{ag:twisting-sheaf-properties} で、$r=1$ の (c) を \ref{ag:cohomology-p1} で示した。一般の場合の証明は交代チェック複体と $r$ についての帰納法による）。
:::

::: remark セールの FAC とグロタンディークの東北論文
1. **セール（FAC, 1955 年）**は、代数多様体の連接層のコホモロジーを**チェックコホモロジー**で定義し、アフィン上の消滅と射影空間の計算を行った。ザリスキ位相は粗く、導来関手の一般論が整っていなかった時期の選択である。
2. **グロタンディーク（東北論文, 1957 年）**は、層の圏が十分な入射対象をもつアーベル圏であることを示し、層コホモロジーを導来関手として**任意の位相空間・任意の層**について定義した（本サイトの \ref{cat:sheaf-cohomology} はこの流儀）。セールの消滅定理は、この一般的な定義とチェックによる計算を結ぶ橋になる（\ref{ag:cech-separated}）。
3. 準連接層に限ることが本質的である理由：\ref{ag:serre-vanishing-affine} の証明で準連接性を使うのは Step 1 の条件 (C) だけで、それは \ref{ag:cech-principal-exact}（加群の局所化の完全性）から来る。逆に、ネーターなスキーム $X$ で、すべての準連接層（連接なイデアル層で十分）について $H^{1}=0$ なら $X$ はアフィンである（**セールの判定法**）ことが知られている（本サイト未収録）。
:::

::: hypcheck
- **準連接性**：\ref{ag:serre-vanishing-affine} の Step 1（条件 (C)）だけで使い、Step 2〜5 は (C) をみたす任意の層について成り立つ（カルタンの補題の形）。
- **アフィン性**：主開集合が開基で、交わりが主開集合であること（Step 1・4）と、準コンパクト性（Step 3 の有限被覆）に使う。
- **分離性**：\ref{ag:cech-separated} で、アフィン開集合の交わりがアフィンであることに使う（ルレイの定理の仮定）。分離的でない原点が二重の直線などでは、二つのアフィンの交わりがアフィンでないことがあり、そのままでは使えない。
- **ネーター性**：使わない。ハーツホーンの教科書は、入射加群の $\widetilde{I}$ が脆弱であることを経由する証明のためにネーター性を仮定するが、上の証明はチェック複体の完全性から直接示すので一般の環で通る。
- **選択公理**：入射分解の存在（層コホモロジーの定義）と、\ref{ag:qc-affine} を通して使う。
:::

::: supplement
**前提を変えると.** セールの消滅定理の逆（セールの判定法）と、射影的なスキーム上の連接層についての**セールの有限性・消滅定理**（$H^{q}(X,\mathcal{F})$ は有限生成、$n\gg0$ で $H^{q}(X,\mathcal{F}(n))=0$（$q\ge1$））が知られている（本サイト未収録）。

**似た定理.** 複素解析では、シュタイン多様体上の連接解析層について $H^{q}=0$（$q\ge1$、カルタンの定理 B）が成り立つことが知られており、アフィンスキームの消滅定理はその代数版にあたる。射影多様体では、セールの GAGA により代数的な連接層のコホモロジーと解析的なものが一致することが知られている。

**計算の観点.** 分離スキームのコホモロジーは、有限個のアフィン開集合の被覆のチェック複体（各項は加群の局所化）で計算でき、計算機代数でも扱える（次数付き加群の局所コホモロジーとして計算するのが一般的）。
:::

## 高い視点 {#ag:sec-co-viewpoint}

::: remark アフィンは「コホモロジー的に点」
アフィンスキームは、準連接層について高次コホモロジーをもたない点で「コホモロジー的には点と同じ」であり、大域切断関手 $\Gamma$ が完全な関手として加群の圏との同値（\ref{ag:qc-affine}）を与える。一般のスキームのコホモロジーは、アフィンの貼り合わせの「重なりの仕方」だけを測る：チェック複体は被覆の神経の上のコチェインで、準連接層の場合には各頂点（アフィン）での係数が非輪状なので、神経の組み合わせがそのまま答えになる。比喩で言えば、アフィン開集合はどれも平らな板で、コホモロジーはそれらを貼り合わせた構造物の「穴」——$\mathbb{P}^{1}$ では $H^{1}(\mathcal{O}(-2))=A$ という一つの穴——だけを数える。
:::

## 問題 {#ag:sec-co-problems}

::: problem {#ag:prob-co-p1-euler}
$k$ を体とし、$\chi(\mathcal{O}(m))\defeq\dim_{k}H^{0}(\mathbb{P}^{1}_{k},\mathcal{O}(m))-\dim_{k}H^{1}(\mathbb{P}^{1}_{k},\mathcal{O}(m))$ とする。すべての $m\in\mathbb{Z}$ で $\chi(\mathcal{O}(m))=m+1$ を示せ。
:::

::: solution
\ref{ag:cohomology-p1} から、$m\ge0$ なら $h^{0}=\dim S_{m}=m+1$（$x_{0}^{a}x_{1}^{m-a}$, $a=0,\dots,m$）、$h^{1}=0$。$m=-1$ なら両方 $0$ で $\chi=0=m+1$。$m\le-2$ なら $h^{0}=0$, $h^{1}=-m-1$ で $\chi=m+1$。
:::

::: problem {#ag:prob-co-two-points}
$k$ を体、$Z=\{P,Q\}\subset\mathbb{P}^{1}_{k}$ を二つの $k$ 有理点からなる被約な閉部分スキームとし、$\mathcal{I}$ をそのイデアル層とする。$0\to\mathcal{I}\to\mathcal{O}\to i_{*}\mathcal{O}_{Z}\to0$ の長完全列から $H^{1}(\mathbb{P}^{1},\mathcal{I})\cong k$ を示せ（$\mathcal{I}\cong\mathcal{O}(-2)$ を使ってよい：\ref{ag:pic-projective-space}）。
:::

::: solution
$H^{0}(\mathcal{O})=k$, $H^{0}(i_{*}\mathcal{O}_{Z})=H^{0}(Z,\mathcal{O}_{Z})=k\times k$（\ref{ag:cohomology-closed-immersion}、$Z$ はアフィンで 2 点）, $H^{1}(\mathcal{O})=0$（\ref{ag:cohomology-p1.2} で $m=0$）, $H^{0}(\mathcal{I})=H^{0}(\mathcal{O}(-2))=0$。長完全列 $0\to0\to k\to k\times k\to H^{1}(\mathcal{I})\to0$ から $H^{1}(\mathcal{I})\cong(k\times k)/k\cong k$（$k\to k\times k$ は対角）。これは \ref{ag:cohomology-p1} の $H^{1}(\mathcal{O}(-2))\cong k$ と一致する。
:::
