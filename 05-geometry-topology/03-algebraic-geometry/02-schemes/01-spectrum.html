# 環のスペクトルと構造層 {#ag:page-spectrum keywords="prime spectrum Spec A, Zariski topology on Spec, principal open sets D(f), quasi-compactness, closed points and generic points, sober spaces, functoriality of Spec, structure sheaf, O(D(f)) = A_f, stalks are localizations, Spec Z, dual numbers, why prime ideals"}

可換環 $A$ の素イデアル全体 $\operatorname{Spec}A$ に、零点集合 $V(\mathfrak{a})$ を閉集合とする位相を入れ、その上に「局所的に分数 $a/f$ で書ける切断」の層 $\mathcal{O}$ を作る。アフィン多様体の場合（\ref{ag:page-affine-varieties}）と同じく、主開集合 $D(f)$ 上の切断は局所化 $A_{f}$、点 $\mathfrak{p}$ での茎は局所環 $A_{\mathfrak{p}}$ になる。違いは、点が極大イデアルだけでなくすべての素イデアルであること、$A$ が任意の可換環（冪零元・整数環を含む）であることで、これがグロタンディークの**スキーム**の局所的なモデルになる。なぜ素イデアルを点にとるのか、その理由をまず説明する。


## 記法と定義の確認 {#ag:sec-sp-notation}

::: notation
- 環は単位元をもつ可換環。素イデアル・極大イデアル・素イデアルの逆像は素・根基＝素イデアルの共通部分は \ref{ring:prime-maximal-def}, \ref{ring:prime-preimage}, \ref{ring:nilradical}, \ref{ring:radical-properties}。局所化とその普遍性・素イデアルの対応は \ref{ring:localization}, \ref{ring:localization-universal}, \ref{ring:localization-primes}, \ref{ring:localization-at-prime}。
- 層・茎・前層の茎は \ref{cat:sheaf-space}, \ref{cat:stalk}。
- **選択公理**：「零環でない環は素イデアルをもつ」「根基は素イデアルの共通部分」（\ref{ring:nilradical}）を使う箇所に（AC）と書く。
:::

## なぜ素イデアルか {#ag:sec-sp-why}

::: remark 点としての素イデアル
1. **関手性**：環準同型 $\varphi:A\to B$ について、素イデアルの逆像は素イデアル（\ref{ring:prime-preimage}）だが、極大イデアルの逆像は極大とは限らない（$\mathbb{Z}\hookrightarrow\mathbb{Q}$ で $0$ の逆像 $0$ は $\mathbb{Z}$ で極大でない）。素イデアルを点にとると、$\operatorname{Spec}$ はすべての環準同型について関手になる。体上の有限生成代数では、極大イデアルの逆像は極大（零点定理）なので、古典的な多様体ではこの問題は表に出なかった。
2. **生成点**：素イデアル $\mathfrak{p}$ の閉包は $V(\mathfrak{p})$ で、$\mathfrak{p}$ は既約閉集合 $V(\mathfrak{p})$ の「どこにでもある点」（生成点）になる（\ref{ag:spec-topology.3}）。古典的な多様体では既約閉集合そのものを考えていたものを、一つの点として扱える。
3. **算術との統一**：$\operatorname{Spec}\mathbb{Z}$ の閉点は素数 $p$、生成点は $(0)$ で、整数 $n$ は「各点 $p$ での値 $n\bmod p\in\mathbb{F}_{p}$」をもつ関数とみなせる。数論と幾何が同じ言葉で書ける。
4. **冪零元**：$k[x]/(x^{2})$ の Spec は 1 点だが、構造層は $k$ ではなく $k[x]/(x^{2})$ で、「接ベクトルの方向」を記録する。根基でないイデアルを区別するには、点の集合ではなく環の層が必要である。
:::

## スペクトルの位相 {#ag:sec-sp-topology}

::: definition 素スペクトル {#ag:spectrum keywords="Spec A, V(a), D(f), Zariski topology" index="素スペクトル|そすぺくとる, スペクトル（環）|すぺくとるかん"}
$\operatorname{Spec}A$ を $A$ の素イデアルの集合とする。部分集合 $T\subset A$ について $V(T)\defeq\{\mathfrak{p} : \mathfrak{p}\supset T\}$、$f\in A$ について $D(f)\defeq\operatorname{Spec}A\setminus V(f)=\{\mathfrak{p} : f\notin\mathfrak{p}\}$ とする。点 $\mathfrak{p}$ を $x$ と書くとき、その素イデアルを $\mathfrak{p}_{x}$、剰余体 $A_{\mathfrak{p}}/\mathfrak{p}A_{\mathfrak{p}}$ を $\kappa(x)$ とし、$f\in A$ の $x$ での「値」を $\kappa(x)$ での $f$ の像 $f(x)$ とする（$f(x)=0\iff f\in\mathfrak{p}_{x}$）。
:::

::: proposition スペクトルの位相 {#ag:spec-topology keywords="V defines a topology; D(f) form a basis; D(f) cap D(g) = D(fg); D(f) subset D(g) iff f in rad(g); Spec A is quasi-compact; closure of a point; generic points of irreducible closed sets" index="スペクトルの位相|すぺくとるのいそう, 生成点|せいせいてん, 閉点|へいてん" refname="スペクトル Spec A の位相" refscope="field"}
1. $V(\mathfrak{a})\cup V(\mathfrak{b})=V(\mathfrak{a}\mathfrak{b})$, $\bigcap V(\mathfrak{a}_{\lambda})=V(\sum\mathfrak{a}_{\lambda})$, $V(0)=\operatorname{Spec}A$, $V(1)=\emptyset$。$V(\mathfrak{a})$ を閉集合とする位相（**ザリスキ位相**）が定まる。
2. $D(f)$ は開基をなし、$D(f)\cap D(g)=D(fg)$。（AC）$D(f)\subset D(g)\iff f\in\sqrt{(g)}$、$V(\mathfrak{a})\subset V(\mathfrak{b})\iff\sqrt{\mathfrak{b}}\subset\sqrt{\mathfrak{a}}$。
3. 点 $\mathfrak{p}$ の閉包は $V(\mathfrak{p})$。$\mathfrak{p}$ が閉点 $\iff$ 極大。（AC）既約な閉集合は、ちょうど一つの点（**生成点**）の閉包で、既約閉集合と素イデアルは一対一に対応する。
4. （AC）$D(f)=\bigcup_{\lambda}D(f_{\lambda})\iff f\in\sqrt{(f_{\lambda})_{\lambda}}$。とくに $\operatorname{Spec}A$ と各 $D(f)$ は準コンパクト。
:::

::: proof
**Step 1（1）.** \ref{ag:zero-set-properties} の Step 3・4 と同じ（素イデアル $\mathfrak{p}\supset\mathfrak{a}\mathfrak{b}$ なら $\mathfrak{p}\supset\mathfrak{a}$ または $\mathfrak{p}\supset\mathfrak{b}$）。

**Step 2（2）.** 閉集合 $V(\mathfrak{a})$ の補集合は $\bigcup_{f\in\mathfrak{a}}D(f)$ なので開基。$fg\notin\mathfrak{p}\iff f\notin\mathfrak{p}$ かつ $g\notin\mathfrak{p}$。$V(\mathfrak{b})\supset V(\mathfrak{a})$ は「$\mathfrak{a}$ を含む素イデアルはすべて $\mathfrak{b}$ を含む」で、（AC）根基は素イデアルの共通部分なので $\sqrt{\mathfrak{a}}\supset\mathfrak{b}$、すなわち $\sqrt{\mathfrak{a}}\supset\sqrt{\mathfrak{b}}$。逆は明らか。$D(f)\subset D(g)$ は $V(f)\supset V(g)$。

**Step 3（3）.** $\{\mathfrak{p}\}$ を含む閉集合 $V(\mathfrak{a})$ は $\mathfrak{a}\subset\mathfrak{p}$、すなわち $V(\mathfrak{a})\supset V(\mathfrak{p})$ なので、閉包は $V(\mathfrak{p})$。$\{\mathfrak{p}\}$ が閉 $\iff V(\mathfrak{p})=\{\mathfrak{p}\}\iff\mathfrak{p}$ を真に含む素イデアルがない $\iff$（AC：極大イデアルの存在）極大。既約な閉集合 $Z=V(\mathfrak{a})$ について $\mathfrak{p}\defeq\sqrt{\mathfrak{a}}$ は素：$fg\in\mathfrak{p}$ なら $Z\subset V(fg)=V(f)\cup V(g)$ で、既約性から $Z\subset V(f)$ などとなり、2 から $f\in\sqrt{\mathfrak{a}}$。$Z=V(\mathfrak{p})$ は $\mathfrak{p}$ の閉包。一意性：$V(\mathfrak{p})=V(\mathfrak{q})$ なら 2 から $\mathfrak{p}=\mathfrak{q}$。

**Step 4（4）.** 2 から $\bigcup D(f_{\lambda})=\operatorname{Spec}A\setminus V((f_{\lambda}))$ なので、$D(f)\subset\bigcup D(f_{\lambda})\iff V((f_{\lambda}))\subset V(f)\iff f\in\sqrt{(f_{\lambda})}$。このとき $f^{m}=\sum_{i=1}^{r}a_{i}f_{\lambda_{i}}$（有限和）なので有限個の $D(f_{\lambda_{i}})$ で覆える。
:::

::: proposition スペクトルの関手性 {#ag:spec-functor keywords="a ring homomorphism induces a continuous map of spectra; Spec of a quotient and of a localization" index="スペクトルの関手性|すぺくとるのかんしゅせい"}
環準同型 $\varphi:A\to B$ について、$\varphi^{\#}:\operatorname{Spec}B\to\operatorname{Spec}A$, $\mathfrak{q}\mapsto\varphi^{-1}(\mathfrak{q})$ は連続で、$(\varphi^{\#})^{-1}(D(f))=D(\varphi(f))$。$A\to A/\mathfrak{a}$ は同相 $\operatorname{Spec}A/\mathfrak{a}\cong V(\mathfrak{a})$ を、$A\to A_{f}$ は同相 $\operatorname{Spec}A_{f}\cong D(f)$ を誘導する。
:::

::: proof
$f\notin\varphi^{-1}(\mathfrak{q})\iff\varphi(f)\notin\mathfrak{q}$。剰余と局所化の素イデアルの対応（\ref{ring:localization-primes}）は包含を保つ全単射で、$V$ と $D$ を対応する $V$, $D$ に写すので同相。
:::

::: example スペクトルの例 {#ag:spec-examples}
1. **$\operatorname{Spec}\mathbb{Z}$**：閉点 $(p)$（素数ごと）と生成点 $(0)$。閉集合は有限個の閉点の集合と全体。
2. **$\operatorname{Spec}k[x]$**（$k$ 代数閉）：閉点 $(x-a)$（$\mathbb{A}^{1}$ の点）と生成点 $(0)$。$k=\mathbb{R}$ なら閉点は実数と、共役な複素数の組。
3. **DVR** $R$：$\operatorname{Spec}R=\{\mathfrak{m},0\}$、閉点 $\mathfrak{m}$ と開点 $0$（$D(t)=\{0\}$、$t$ は一意化元）。
4. **$\operatorname{Spec}k[x,y]$**（$k$ 代数閉）：閉点 $(x-a,y-b)$、既約曲線 $V(f)$ の生成点 $(f)$、全体の生成点 $(0)$ の三種類。
5. **双対数** $k[\varepsilon]=k[x]/(x^{2})$：1 点 $(\varepsilon)$。
:::

## 構造層 {#ag:sec-sp-structure-sheaf}

::: definition 構造層 {#ag:structure-sheaf keywords="structure sheaf of Spec A: sections locally of the form a/f" index="構造層|こうぞうそう"}
開集合 $U\subset\operatorname{Spec}A$ について、$\mathcal{O}(U)$ を、写像 $s:U\to\coprod_{\mathfrak{p}\in U}A_{\mathfrak{p}}$（$s(\mathfrak{p})\in A_{\mathfrak{p}}$）で、各点 $\mathfrak{p}\in U$ に近傍 $V\subset U$ と $a,f\in A$ があって、$V\subset D(f)$ かつ $V$ の各点 $\mathfrak{q}$ で $s(\mathfrak{q})=a/f\in A_{\mathfrak{q}}$ となるものの全体とする。点ごとの和・積で環になり、制限は写像の制限。
:::

::: theorem 構造層の基本性質 {#ag:structure-sheaf-properties keywords="O is a sheaf of rings; the stalk at p is A_p; O(D(f)) = A_f; global sections O(Spec A) = A" index="構造層の基本性質|こうぞうそうのきほんせいしつ" refname="構造層の基本性質" refscope="field"}
1. $\mathcal{O}$ は環の層。
2. 茎 $\mathcal{O}_{\mathfrak{p}}$ は局所環 $A_{\mathfrak{p}}$ と同型。
3. （AC）$A_{f}\to\mathcal{O}(D(f))$, $a/f^{n}\mapsto(\mathfrak{p}\mapsto a/f^{n})$ は環の同型。とくに $\mathcal{O}(\operatorname{Spec}A)\cong A$。
:::

::: proof
**Step 1（1）.** 条件は局所的なので、写像の層の部分層。

**Step 2（2）.** 芽 $s_{\mathfrak{p}}$ に $s(\mathfrak{p})\in A_{\mathfrak{p}}$ を対応させる。全射：$a/f\in A_{\mathfrak{p}}$（$f\notin\mathfrak{p}$）は $D(f)$ 上の切断 $\mathfrak{q}\mapsto a/f$ の芽の像。単射：$s,t$ が近傍 $V$ 上でそれぞれ $a/f$, $b/g$ で表され $a/f=b/g$ in $A_{\mathfrak{p}}$ なら、$h\notin\mathfrak{p}$ で $h(ag-bf)=0$。$D(fgh)\cap V$ の各点 $\mathfrak{q}$ で $a/f=b/g$ in $A_{\mathfrak{q}}$ なので、$s,t$ は $\mathfrak{p}$ の近傍で一致し、芽が等しい。

**Step 3（3：単射）.** $a/f^{n}$ が $D(f)$ の各点 $\mathfrak{p}$ で $0$ in $A_{\mathfrak{p}}$ とする。すなわち $\operatorname{Ann}(a)\not\subset\mathfrak{p}$。よって $V(\operatorname{Ann}a)\cap D(f)=\emptyset$、$V(\operatorname{Ann}a)\subset V(f)$ で、（AC）$f\in\sqrt{\operatorname{Ann}a}$、$f^{m}a=0$、$a/f^{n}=0$ in $A_{f}$。

**Step 4（3：主開集合による被覆）.** $s\in\mathcal{O}(D(f))$ をとる。点 $\mathfrak{p}$ の近傍で $s=a/g$（$g\notin$ 近傍の点）と書け、近傍を $D(h)\subset D(g)\cap V$ に縮めると $h\in\sqrt{(g)}$、$h^{n}=cg$ で $a/g=ca/h^{n}$。よって $s$ は $D(h)$ 上 $a'/h'$（$h'=h^{n}$, $D(h')=D(h)$）と書ける。$D(f)$ は準コンパクト（\ref{ag:spec-topology.4}、$D(f)\cong\operatorname{Spec}A_{f}$）なので、有限個の $D(h_{i})$ で覆え、$D(h_{i})$ 上 $s=a_{i}/h_{i}$。

**Step 5（3：分母の調整）.** $D(h_{i})\cap D(h_{j})=D(h_{i}h_{j})$ 上で $a_{i}/h_{i}$ と $a_{j}/h_{j}$ は同じ切断なので、Step 3（環 $A$、元 $h_{i}h_{j}$）から $A_{h_{i}h_{j}}$ で等しく、$(h_{i}h_{j})^{n}(h_{j}a_{i}-h_{i}a_{j})=0$（$n$ は共通にとる）。$a_{i}$ を $a_{i}h_{i}^{n}$、$h_{i}$ を $h_{i}^{n+1}$ に取り替える（$D(h_{i}^{n+1})=D(h_{i})$ 上の同じ切断）と、$h_{j}a_{i}=h_{i}a_{j}$ がすべての $i,j$ で成り立つ。

**Step 6（3：貼り合わせ）.** $D(f)=\bigcup D(h_{i})$ から（AC）$f^{m}=\sum b_{i}h_{i}$。$a\defeq\sum b_{i}a_{i}$ とおくと $h_{j}a=\sum b_{i}a_{i}h_{j}=\sum b_{i}h_{i}a_{j}=f^{m}a_{j}$ なので、$D(h_{j})$ 上 $a/f^{m}=a_{j}/h_{j}=s$。よって $s$ は $a/f^{m}$ の像。
:::

::: example 構造層の例
1. $\operatorname{Spec}k[\varepsilon]$ は 1 点で、構造層の唯一の茎は $k[\varepsilon]$。$\operatorname{Spec}k$ も 1 点で茎は $k$。位相空間は同じだが構造層が違う。
2. DVR $R$ では、$\mathcal{O}(\operatorname{Spec}R)=R$、$\mathcal{O}(\{0\})=\mathcal{O}(D(t))=R_{t}=\operatorname{Frac}R$。
3. 被約化 $A\to A_{\mathrm{red}}\defeq A/\mathrm{nil}(A)$ は同相 $\operatorname{Spec}A_{\mathrm{red}}\cong\operatorname{Spec}A$ を誘導する（\ref{ag:spec-functor}、（AC）冪零根基はすべての素イデアルに含まれる）が、構造層は異なる。
:::

::: hypcheck
- **選択公理**：根基が素イデアルの共通部分であること（\ref{ag:spec-topology.2}・\ref[4]{ag:spec-topology.4}、\ref{ag:structure-sheaf-properties} の Step 3・6）と、閉点＝極大イデアル（極大イデアルの存在）に使った。$A$ が体上の有限生成代数なら、零点定理で選択公理なしに済む部分が多い。
- 構造層の定義は「点ごとの局所化の値をもつ関数」で、関数としての値（剰余体の値）ではない：冪零元 $\varepsilon$ はすべての点で値 $0$ だが、切断としては $0$ でない。
- **準コンパクト性**（Step 4）：$\operatorname{Spec}A$ は一般にネーター空間ではないが、準コンパクト性は根基の言い換えから従う。
:::

::: supplement
**前提を変えると.** 非可換環のスペクトルは同じようには関手的にならない（素イデアルの逆像が素とは限らない）ことが知られており、非可換代数幾何は別の方法（圏そのものを空間とみなす）をとる。

**計算の観点.** 体上の有限生成代数 $A$ について、$\operatorname{Spec}A$ の閉点と既約成分（極小素イデアル）は準素分解で計算できる（\ref{ag:page-affine-sets} の補足）。$\operatorname{Spec}\mathbb{Z}[x]$ のような算術的な場合は、素数ごとの分解の計算を含む。
:::

## 高い視点 {#ag:sec-sp-viewpoint}

::: remark すべての環は空間である
$\operatorname{Spec}$ は環の圏から「局所環付き空間」の圏への反変関手で、次ページで見るように可換環の圏と（アフィンスキームの圏の）反対圏は同値になる。比喩で言えば、すべての可換環は、ある空間の上の「関数の環」として読める。体は 1 点、DVR は「点とその周り」、$\mathbb{Z}$ は「素数を点とする曲線」、双対数は「1 点と、その点での接方向」である。ゲルファント双対性（コンパクト空間と C* 環）が「点の値」だけで空間を復元するのに対し、スキームは「局所化」で復元するので、冪零元という「無限小の情報」も失われない。
:::

## 問題 {#ag:sec-sp-problems}

::: problem {#ag:prob-sp-spec-zx}
$\operatorname{Spec}\mathbb{Z}[x]$ の点を分類せよ（素イデアルの形を列挙せよ）。
:::

::: solution
素イデアル $\mathfrak{P}\subset\mathbb{Z}[x]$ について $\mathfrak{p}\defeq\mathfrak{P}\cap\mathbb{Z}$ は $\mathbb{Z}$ の素イデアル $(0)$ か $(p)$。
1. $\mathfrak{p}=(0)$：$\mathfrak{P}$ は $\mathbb{Q}[x]$ の素イデアル $0$ か $(f)$（$f$ は既約）に対応し（$\mathbb{Z}\setminus0$ での局所化）、$\mathfrak{P}=(0)$ または $\mathfrak{P}=(f)$（$f$ は $\mathbb{Z}[x]$ の原始的な既約多項式、ガウスの補題）。
2. $\mathfrak{p}=(p)$：$\mathfrak{P}\supset p\mathbb{Z}[x]$ で、$\mathbb{F}_{p}[x]$ の素イデアル $0$ か $(\bar g)$（$\bar g$ は既約）に対応し、$\mathfrak{P}=(p)$ または $\mathfrak{P}=(p,g)$（$g$ は $\bar g$ の持ち上げ）。後者は極大（剰余環は有限体）。

\term[次元]{ring:krull-dimension}は 2（\ref{ring:polynomial-dimension}）で、鎖 $0\subsetneq(p)\subsetneq(p,g)$ などがある。絵としては、素数 $p$ ごとの縦の直線 $V(p)\cong\operatorname{Spec}\mathbb{F}_{p}[x]$ と、横に走る曲線 $V(f)$ からなる「算術曲面」である。
:::
