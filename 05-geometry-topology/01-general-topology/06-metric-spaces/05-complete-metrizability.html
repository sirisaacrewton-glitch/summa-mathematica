# 完備距離化可能性 {#top:page-complete-metrizability keywords="completely metrizable space, G-delta subsets, Alexandroff's theorem, Mazurkiewicz, Lavrentiev, Kuratowski, Polish space, irrational numbers, Baire space"}

完備性は距離の性質であって位相の性質ではない（$(0,1)$ は通常の距離では完備でないが、$\mathbb{R}$ と同相である）。そこで、位相を変えずに完備な距離を選び直せる空間を**完備距離化可能**という（\ref{top:completely-metrizable}）。本ページの主定理は、完備距離空間の部分空間が完備距離化可能であることと、$G_{\delta}$ 集合であることが同値であることである（\ref{top:alexandroff-gdelta}, \ref{top:completely-metrizable-is-gdelta}）。これから、無理数全体は完備距離化可能で、有理数全体はそうでないことが分かる。最後に、可分で完備距離化可能な**ポーランド空間**（\ref{top:polish-space}）の基本的な閉性を示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた（\ref{top:page-completeness} の補足で予告していた内容である）。

## 記法と定義の確認 {#top:sec-cmz-notation}

::: notation
- 距離空間・距離位相・完備性・完備な部分空間・ベールのカテゴリー定理は \ref{top:metric-topology}, \ref{top:complete-metric}, \ref{top:complete-closed}, \ref{top:baire-category} のとおり。$G_{\delta}$ 集合は \ref{top:page-baire} の記法のとおり（可算個の開集合の共通部分）。
- 距離空間 $(X,d)$ の空でない部分集合 $F$ について $d(x,F)\defeq\inf_{y\in F}d(x,y)$ で、$\lvert d(x,F)-d(y,F)\rvert\le d(x,y)$（$1$-リプシッツ）、$d(x,F)=0\iff x\in\overline{F}$。
- 同じ集合上の二つの距離が**同値**とは、同じ位相を定めることをいう。
- 点列や関数を可算個選ぶ箇所では可算選択公理を使う（証明の hypcheck に明記する）。
:::

::: definition 完備距離化可能 {#top:completely-metrizable keywords="completely metrizable space, topologically complete" index="完備距離化可能|かんびきょりかかのう"}
位相空間 $X$ が**完備距離化可能**であるとは、$X$ の位相を定める完備な距離があることをいう。
:::

::: intuition
位相はそのままで、物差しを取り替えれば、コーシー列がすべて収束するようにできる空間のことである。
:::

## $G_{\delta}$ 集合は完備距離化可能 {#top:sec-cmz-alexandroff}

::: lemma 開集合の完備な距離 {#top:open-subset-complete-metric keywords="an open subset of a complete metric space admits an equivalent complete metric" index="開集合の完備距離|かいしゅうごうのかんびきょり"}
$(X,d)$ を完備距離空間、$U\subsetneq X$ を開集合とし、$f(x)\defeq1/d(x,X\setminus U)$（$x\in U$）とする。$U$ 上の距離
$$
d_{U}(x,y)\defeq d(x,y)+\lvert f(x)-f(y)\rvert
$$
は $d$ と同値で、完備である。
:::

::: proof
**距離.** $x\in U$ なら、$U$ は開で $X\setminus U$ は閉なので $d(x,X\setminus U)>0$ であり、$f$ は $U$ 上で正の実数値をとる。$\lvert f(x)-f(y)\rvert$ は非負・対称で\term[三角不等式]{top:metric-topology}を満たすので、$d_{U}$ も非負・対称で同じ不等式を満たす。$d_{U}(x,y)=0$ なら $d(x,y)=0$ なので $x=y$ である。よって $d_{U}$ は距離である。

**同値.** $d\le d_{U}$ なので、$d$ の開集合は $d_{U}$ でも開である。逆に、$f$ は $U$ 上で $d$ について連続である（$d(\cdot,X\setminus U)$ が連続で正）。よって $x\in U$ と $\varepsilon>0$ に対し、$d(x,y)<\delta$ なら $y\in U$ かつ $\lvert f(x)-f(y)\rvert<\varepsilon/2$ となる $\delta>0$ がある。このとき $d(x,y)<\min(\delta,\varepsilon/2)$ なら $d_{U}(x,y)<\varepsilon$ なので、$\min(\delta,\varepsilon/2)$ の $d$ 球は $\varepsilon$ の $d_{U}$ 球に含まれる。ゆえに $d_{U}$ の開集合は $d$ でも開である。

**完備.** $(x_{n})$ を $d_{U}$ のコーシー列とする。$d\le d_{U}$ から $d$ のコーシー列であり、$X$ の点 $x$ に収束する。また $\lvert f(x_{n})-f(x_{m})\rvert\le d_{U}(x_{n},x_{m})$ なので、$(f(x_{n}))$ は実数のコーシー列であり有界である。そこで $f(x_{n})\le M$（$M>0$）とすると、$d(x_{n},X\setminus U)\ge1/M$ であり、$d(\cdot,X\setminus U)$ の連続性から $d(x,X\setminus U)\ge1/M>0$ となる。$X\setminus U$ は閉なので $x\notin X\setminus U$、すなわち $x\in U$ である。$d$ と $d_{U}$ は同値なので、$x_{n}\to x$ は $d_{U}$ でも成り立ち、$d_{U}(x_{n},x)\to0$ である。
:::

::: theorem $G_{\delta}$ 集合の完備距離化（アレクサンドロフ） {#top:alexandroff-gdelta keywords="Alexandroff's theorem: G-delta subsets of completely metrizable spaces are completely metrizable" index="アレクサンドロフの定理（G_δ）|あれくさんどろふのていりじーでるた"}
完備距離化可能な空間 $X$ の $G_{\delta}$ 集合は（部分空間として）完備距離化可能である。
:::

::: intuition
完備な距離をもつ空間から、可算個の開集合の共通部分として切り出した集合には、位相を変えずに完備な距離を入れ直せる。取り除いた部分への距離の逆数を足して、取り除いた所を無限の彼方に押しやればよい。
:::

::: proof
$d$ を $X$ の完備な距離、$G=\bigcap_{n\ge1}U_{n}$（$U_{n}$ 開）とする。$U_{n}=X$ のものは除いてよく、すべて除かれるなら $G=X$ で主張は成り立つ。残りに番号を付け直し（有限個なら下の和も有限和）、$f_{n}(x)\defeq1/d(x,X\setminus U_{n})$ とおいて、$G$ 上に
$$
d_{G}(x,y)\defeq d(x,y)+\sum_{n\ge1}2^{-n}\min\{1,\lvert f_{n}(x)-f_{n}(y)\rvert\}
$$
を定める。$\min\{1,\lvert f_{n}(x)-f_{n}(y)\rvert\}$ は、$\lvert a-c\rvert\le\lvert a-b\rvert+\lvert b-c\rvert$ と $\min\{1,s+t\}\le\min\{1,s\}+\min\{1,t\}$ から\term[三角不等式]{top:metric-topology}を満たす。よって $d_{G}$ は非負・対称で同じ不等式を満たし、$d_{G}(x,y)=0$ なら $d(x,y)=0$ なので、$d_{G}$ は距離である。

**Step 1.** 【主張：$d_{G}$ は $G$ 上で $d$ と同値である】 $d\le d_{G}$ なので、$d$ の開集合は $d_{G}$ でも開である。逆に $x\in G$, $\varepsilon>0$ について、$2^{-N}<\varepsilon/3$ となる $N$ をとる。$f_{1},\dots,f_{N}$ の $x$ での連続性から、$\delta<\varepsilon/3$ で、$y\in G$, $d(x,y)<\delta$ なら $\lvert f_{n}(x)-f_{n}(y)\rvert<\varepsilon/3$（$n\le N$）となるものがある。このとき $n\le N$ の項の和は $\sum_{n\le N}2^{-n}\varepsilon/3<\varepsilon/3$、$n>N$ の項の和は $2^{-N}<\varepsilon/3$ なので、$d_{G}(x,y)<\varepsilon/3+\varepsilon/3+\varepsilon/3=\varepsilon$ となる。よって $d_{G}$ の開球は $d$ について開である。

**Step 2.** 【主張：$d_{G}$ のコーシー列 $(x_{k})$ は、$d$ について $G$ の点に収束する】 $d\le d_{G}$ から $(x_{k})$ は $d$ のコーシー列であり、$X$ の点 $x$ に収束する。各 $n$ について、$\min\{1,\lvert f_{n}(x_{k})-f_{n}(x_{l})\rvert\}\le2^{n}d_{G}(x_{k},x_{l})$ である。右辺が $1$ 未満になる $k,l$ では左辺の最小値は $\lvert f_{n}(x_{k})-f_{n}(x_{l})\rvert$ のほうなので、$(f_{n}(x_{k}))_{k}$ はコーシー列であり有界である。\ref{top:open-subset-complete-metric} の証明（完備）と同じ議論で $x\in U_{n}$ となる。これがすべての $n$ で成り立つので、$x\in G$ である。

**Step 3.** 【主張：$d_{G}$ は完備である】 Step 2 の $x$ について $d(x_{k},x)\to0$ であり、Step 1 の同値性から $d_{G}(x_{k},x)\to0$ となる。

::: hypcheck
- **$X$ の距離の完備性**：Step 2 で、$d$ のコーシー列の極限 $x$ を $X$ の中にとるのに使った。
- **$G_{\delta}$**：可算個の $f_{n}$ を重み $2^{-n}$ で足し合わせるのに使った。非可算個の開集合の共通部分ではこの和がとれない。
:::
:::

## 完備距離化可能な部分空間は $G_{\delta}$ {#top:sec-cmz-converse}

::: theorem 完備距離化可能な部分空間 {#top:completely-metrizable-is-gdelta keywords="a completely metrizable subspace of a metric space is a G-delta (Lavrentiev, Kuratowski)" index="完備距離化可能な部分空間|かんびきょりかかのうなぶぶんくうかん"}
距離空間 $(X,d)$ の部分空間 $A$ が完備距離化可能なら、$A$ は $X$ の $G_{\delta}$ 集合である。
:::

::: intuition
完備な距離を入れられる部分集合は、まわりの空間の中で、可算個の開集合の共通部分として切り出せる形をしている。前の定理の逆である。
:::

::: proof
$\rho$ を $A$ の位相を定める完備な距離とする。$A=\varnothing$ なら $A$ は開集合なので、$A\ne\varnothing$ とする。

**Step 1.** 【主張：$\overline{A}$ は $X$ の $G_{\delta}$ 集合である】 $d(x,A)=0\iff x\in\overline{A}$ なので、$\overline{A}=\bigcap_{n}\{x:d(x,A)<1/n\}$ である。$d(\cdot,A)$ は連続なので、各集合は開である。

**Step 2.** $n\ge1$ について、$G_{n}$ を、$x\in\overline{A}$ で、$x$ の $d$ についての開近傍 $V$ で $\operatorname{diam}_{\rho}(V\cap A)<1/n$ となるものがある点の全体とする。$O_{n}$ を「$\operatorname{diam}_{\rho}(V\cap A)<1/n$ となる $X$ の開集合 $V$ 全体の和」とおく。【主張：$O_{n}$ は開集合で、$G_{n}=O_{n}\cap\overline{A}$ である】 $O_{n}$ は開集合の和なので開である。$x\in G_{n}$ ならその $V$ が $O_{n}$ に含まれるので、$x\in O_{n}\cap\overline{A}$ である。逆に $x\in O_{n}\cap\overline{A}$ なら、$x$ を含む $V$（$\operatorname{diam}_{\rho}(V\cap A)<1/n$）があるので、$x\in G_{n}$ である。

**Step 3.** 【主張：すべての $n$ について $A\subseteq G_{n}$ である】 $a\in A$ とする。$\rho$ と $d$ は $A$ 上で同じ位相を定めるので、$a$ を中心とする半径 $1/(3n)$ の $\rho$ 球は $A$ の $d$ についての開集合であり、$X$ の $d$ 開集合 $V$ で $V\cap A$ がその $\rho$ 球に等しいものがある。よって $\operatorname{diam}_{\rho}(V\cap A)\le2/(3n)<1/n$ であり、$a\in G_{n}$ となる。

**Step 4.** 【主張：$\bigcap_{n}G_{n}\subseteq A$ である】 $x\in\bigcap_{n}G_{n}$ とし、$x$ の開近傍 $V_{n}$ で $\operatorname{diam}_{\rho}(V_{n}\cap A)<1/n$ となるものを選ぶ。$W_{n}\defeq V_{1}\cap\cdots\cap V_{n}\cap B_{d}(x,1/n)$ は $x$ の開近傍で、$x\in\overline{A}$ なので $a_{n}\in W_{n}\cap A$ が選べる。$m\ge n$ なら $a_{m},a_{n}\in V_{n}\cap A$ なので $\rho(a_{m},a_{n})<1/n$ であり、$(a_{n})$ は $\rho$ のコーシー列である。$\rho$ は完備なので、$(a_{n})$ はある $a\in A$ に $\rho$ で収束する。$\rho$ と $d$ は $A$ 上で同じ位相を定めるので、$d$ でも $a_{n}\to a$ である。一方 $d(a_{n},x)<1/n$ なので $a_{n}\to x$ である。距離空間での極限の一意性から $x=a\in A$ となる。

Step 3, 4 から $A=\bigcap_{n}G_{n}$ であり、Step 2 から $A=\overline{A}\cap\bigcap_{n}O_{n}$ となる。Step 1 から $\overline{A}$ は $G_{\delta}$ なので、$A$ も $G_{\delta}$ である。

::: hypcheck
- **$\rho$ の完備性**：Step 4 で、$\rho$ のコーシー列 $(a_{n})$ が $A$ の中に極限をもつことに使った。
- **$\rho$ と $d$ が $A$ 上で同値**：Step 3（$\rho$ 球を $d$ 開集合で切り出す）と Step 4（$\rho$ の収束を $d$ の収束に移す）で使った。
- $X$ の完備性は使っていない。
- **可算選択**：Step 4 で $V_{n}$ と $a_{n}$ を選ぶのに使った。
:::
:::

::: corollary $G_{\delta}$ による特徴づけ {#top:gdelta-characterization keywords="a subspace of a completely metrizable space is completely metrizable iff it is G-delta; irrationals are completely metrizable, rationals are not" index="無理数の完備距離化|むりすうのかんびきょりか"}
完備距離空間 $X$ の部分空間 $A$ について、$A$ が完備距離化可能であることと $A$ が $G_{\delta}$ 集合であることは同値である。特に、無理数全体 $\mathbb{R}\setminus\mathbb{Q}$ は完備距離化可能で、有理数全体 $\mathbb{Q}$ はそうでない。
:::

::: proof
前半は \ref{top:alexandroff-gdelta} と \ref{top:completely-metrizable-is-gdelta} から従う。$\mathbb{R}\setminus\mathbb{Q}=\bigcap_{q\in\mathbb{Q}}(\mathbb{R}\setminus\{q\})$ は可算個の開集合の共通部分なので、$G_{\delta}$ である。$\mathbb{Q}$ は $\mathbb{R}$ の $G_{\delta}$ 集合でない（\ref{top:page-baire} の例）ので、完備距離化可能でない。
:::

## ポーランド空間 {#top:sec-cmz-polish}

::: definition ポーランド空間 {#top:polish-space keywords="Polish space: separable completely metrizable space" index="ポーランド空間|ぽーらんどくうかん"}
可分で完備距離化可能な位相空間を**ポーランド空間**という。
:::

::: intuition
可算個の点で近似でき、位相を変えずに完備な距離を入れられる空間のこと。実数直線・カントール集合・無理数全体などの扱いやすい空間を、まとめて扱うための枠組みである。
:::

::: proposition ポーランド空間の閉性 {#top:polish-closure keywords="G-delta subspaces and countable products of Polish spaces are Polish; examples" index="ポーランド空間の閉性|ぽーらんどくうかんのへいせい"}
1. ポーランド空間の $G_{\delta}$ 部分空間（特に開集合と閉集合）はポーランド空間である。
2. ポーランド空間の可算個の直積はポーランド空間である。
3. $\mathbb{R}^{n}$, $[0,1]^{\N}$, $\N^{\N}$, $2^{\N}$, $\mathbb{R}\setminus\mathbb{Q}$ はポーランド空間である。
4. ポーランド空間はベール空間である。
:::

::: proof
**1.** 完備距離化可能性は \ref{top:alexandroff-gdelta} から従う。可分性は、可分距離空間が可算な開基をもち（\ref{top:metric-countability}）、それが部分空間に移ることから従う。開集合は $G_{\delta}$ である。空でない閉集合 $F$ は $\bigcap_{n}\{d(\cdot,F)<1/n\}$ と書けるので $G_{\delta}$ である（$F=\varnothing$ は開集合）。

**2.** ある $X_{n}$ が空なら直積は空でポーランド空間なので、すべて空でないとする。$X_{n}$ の完備な距離 $d_{n}$ を $\min\{1,d_{n}\}$ に取り替えておく（同値で完備）。$\prod X_{n}$ 上の $d(x,y)\defeq\sum_{n}2^{-n}d_{n}(x_{n},y_{n})$ は、$\min\{1,d_{n}\}=d_{n}$ なので \ref{top:countable-product-metrizable} の距離そのものであり、直積位相を定める。完備性：$d$ のコーシー列は、$d_{n}\le2^{n}d$ から各成分でコーシー列であり、成分ごとの極限 $x$ をもつ。$\varepsilon>0$ に対し $2^{-N}<\varepsilon/2$ となる $N$ をとり、$n\le N$ の成分を $\varepsilon/2$ 未満に近づければ、残りの和は $2^{-N}$ で抑えられるので、点列は $x$ に $d$ で収束する。可分性：各 $X_{n}$ の稠密な可算集合 $D_{n}$ と点 $p_{n}\in X_{n}$ をとる。有限個の成分だけ $D_{n}$ から選び残りを $p_{n}$ とする点全体は可算であり、基本開集合は有限個の成分しか制限しないので稠密である。

**3.** $\mathbb{R}$ は完備で可分であり、$[0,1]$ は閉集合である。$\N$, $\{0,1\}$ は離散距離で完備かつ可算である。よって 1 と 2 から主張の空間（$\mathbb{R}\setminus\mathbb{Q}$ 以外）はポーランド空間である。$\mathbb{R}\setminus\mathbb{Q}$ は \ref{top:gdelta-characterization} の証明から $G_{\delta}$ なので、1 からポーランド空間である。

**4.** 完備な距離をとって \ref{top:baire-category} を使えばよい。ベール空間であることは位相の性質である。
:::

## 問題 {#top:sec-cmz-problems}

::: problem {#top:prob-cmz-open-interval}
\ref{top:open-subset-complete-metric} の距離 $d_{U}$ を、$X=\mathbb{R}$, $U=(0,1)$ について具体的に書き、コーシー列 $x_{n}=1/n$（$n\ge2$）が $d_{U}$ ではコーシー列でないことを確かめよ。
:::

::: solution
$d(x,\mathbb{R}\setminus(0,1))=\min\{x,1-x\}$ なので、$d_{U}(x,y)=\lvert x-y\rvert+\lvert1/\min\{x,1-x\}-1/\min\{y,1-y\}\rvert$ である。$x_{n}=1/n$（$n\ge2$）では $1/n\le1/2\le1-1/n$ から $\min=1/n$ なので、$n\ne m$ なら $d_{U}(x_{n},x_{m})\ge\lvert n-m\rvert\ge1$ であり、コーシー列でない。端に近づく点列は、$d_{U}$ では「無限遠に逃げる」ことになる。
:::

::: problem {#top:prob-cmz-compact-gdelta}
距離空間のコンパクト部分集合は $G_{\delta}$ 集合であることを、\ref{top:completely-metrizable-is-gdelta} を使って示せ。
:::

::: solution
コンパクト距離空間は完備である（\ref{top:compact-metric-equivalents}）。よってコンパクト部分集合 $K$ は部分空間の距離で完備であり、したがって完備距離化可能である。\ref{top:completely-metrizable-is-gdelta} から、$K$ は $G_{\delta}$ である。（直接には、$K$ は閉集合なので、Step 1 の議論から $G_{\delta}$ である。）
:::

::: supplement
**前提を変えると.** 完備距離化可能性は $G_{\delta}$ 部分空間（\ref{top:alexandroff-gdelta}）と可算直積（\ref{top:polish-closure.2} の証明の、可分性以外の部分がそのまま使える）で保たれるが、連続像では保たれない（$\mathbb{Q}$ は離散空間 $\N$ の連続像）。距離化可能という仮定を外すと、「チェック完備」（あるコンパクト化の $G_{\delta}$ 集合）という概念が対応し、距離化可能空間では完備距離化可能性と一致する（\see{top:cech-complete-metric}）。

**似た定理.** すべての空でないポーランド空間は $\N^{\N}$ の連続像であり（\see{top:polish-image-of-nn}）、無理数全体は $\N^{\N}$ と同相である（\see{top:irrationals-nn}。連分数展開でも具体的に与えられることが知られている）。$2^{\N}$ はカントール集合と同相で（\ref{top:cantor-set-maps}）、コンパクト距離空間はすべてその連続像である（\ref{top:alexandroff-hausdorff}）。ポーランド空間は記述集合論の舞台であり、ボレル集合や解析集合が研究される（\see{comp:page-analytical-hierarchy} の系列と関わる）。

**高い視点から：完備性は「穴の場所を遠くに押しやる」.** $(0,1)$ の通常の距離は、端点 $0,1$ という「穴」を近くに見せる。$d_{U}$ は、穴までの距離の逆数を加えることで、穴に近づく点どうしを遠ざけ、穴を無限の彼方に押しやる。比喩で言えば、地図の縮尺を穴の近くほど大きくして、穴に向かう道がいつまでも終わらないように描き直す作業である。$G_{\delta}$ 集合は可算個の開集合の共通部分、つまり可算段階で穴を取り除いたものなので、可算個の縮尺の補正を重ね合わせれば完備にできる。有理数全体のように、それ自身は $G_{\delta}$ でなく、取り除かれた穴（無理数）が稠密に散らばっている集合は、どう描き直しても完備にはならない。
