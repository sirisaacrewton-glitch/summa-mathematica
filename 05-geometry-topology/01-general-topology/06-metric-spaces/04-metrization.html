# 距離化定理とストーンの定理 {#top:page-metrization keywords="metrizable space, countable products of metric spaces, Hilbert cube, regular second countable spaces are normal, Urysohn metrization theorem, Stone theorem, metric spaces are paracompact, Nagata-Smirnov"}

位相空間の位相が、ある距離から定まるとき、その空間を**距離化可能**という（\ref{top:metrizable}）。どのような位相空間が距離化可能かを位相的な条件で特徴づけるのが距離化の問題である。**ウリゾーンの距離化定理**は、第二可算な $T_{3}$ 空間が距離化可能であることを、ヒルベルト立方体 $[0,1]^{\N}$ への埋め込みによって示す（\tref{top:urysohn-metrization}）。逆向きの性質として、距離空間はパラコンパクトである（**ストーンの定理**、\tref{top:stone-paracompact}）。本ページでは M. E. Rudin による短い証明を書き下ろす。

> 資料：内田伏一『集合と位相』§21、小山晃『位相空間論』第 7 章を参考に、証明は本サイトで書き下ろした。ストーンの定理の証明は M. E. Rudin, "A new proof that metric spaces are paracompact", *Proc. Amer. Math. Soc.* 20 (1969) の方針による。

## 記法と定義の確認 {#top:sec-mz-notation}

::: notation
- 距離位相は \ref{top:metric-topology}。直積位相とその開基は \ref{top:product-topology}, \ref{top:product-base}。埋め込みは \ref{top:homeomorphism.3}。
- 分離公理・ウリゾーンの補題・パラコンパクト性は \ref{top:separation-axioms}, \tref{top:urysohn-lemma}, \ref{top:paracompact}。
- 第二可算（可算な開基をもつ）は \ref{top:second-countable}。
- 議論は $\ZF$ で行い、選択公理を使う箇所は明記する。
:::

::: definition 距離化可能 {#top:metrizable keywords="metrizable topological space" index="距離化可能|きょりかかのう"}
位相空間 $(X,\mathcal{O})$ が**距離化可能**であるとは、$X$ 上の距離 $d$ で、距離位相 $\mathcal{O}_{d}$ が $\mathcal{O}$ に一致するものがあることをいう。
:::

::: intuition
位相を変えずに、点と点の離れ具合を測る物差し（距離）を入れられる空間が、距離化可能な空間である。そうすると、どの開集合も小さな球を集めたものとして見えるようになる。
:::

距離化可能な空間は $T_{4}$（\ref{top:metric-normal}）で、第一可算であり（\ref{top:metric-countability}）、部分空間も距離化可能（距離の制限）である。

## 可算個の直積 {#top:sec-mz-products}

::: proposition 距離空間の可算直積 {#top:countable-product-metrizable keywords="countable products of metrizable spaces are metrizable; the Hilbert cube" index="可算直積の距離化|かさんちょくせきのきょりか, ヒルベルト立方体|ひるべるとりっぽうたい"}
$(X_{n},d_{n})_{n\ge1}$ を距離空間とし、$X\defeq\prod_{n}X_{n}$ に直積位相を入れる。
$$
d(x,y)\defeq\sum_{n\ge1}2^{-n}\min\{1,\ d_{n}(x_{n},y_{n})\}
$$
は $X$ 上の距離で、その距離位相は直積位相に一致する。とくに**ヒルベルト立方体** $[0,1]^{\N}$ は距離化可能である。
:::

::: proof
**距離.** 第 $n$ 項は $2^{-n}$ 以下なので、級数は $\sum_{n}2^{-n}=1$ で抑えられて収束する。$d(x,y)=0$ なら各 $d_{n}(x_{n},y_{n})=0$ なので、$x=y$ である。\term[三角不等式]{top:metric-topology}は各項で成り立つ：$\min\{1,\cdot\}$ は単調で $\min\{1,a+b\}\le\min\{1,a\}+\min\{1,b\}$ を満たすので、$\min\{1,d_{n}(x_{n},z_{n})\}\le\min\{1,d_{n}(x_{n},y_{n})\}+\min\{1,d_{n}(y_{n},z_{n})\}$ である。これに $2^{-n}$ を掛けて和をとればよい。

**距離位相 ⊆ 直積位相.** 開球 $B(x,\varepsilon)$ の点 $y$ について、$y$ を含み $B(x,\varepsilon)$ に含まれる基本開集合を見つければよい。$\delta\defeq\varepsilon-d(x,y)>0$ とし、$N$ を $2^{-N}<\delta/2$ ととる。
$$
W\defeq\bigcap_{n\le N}p_{n}^{-1}\bigl[B_{d_{n}}(y_{n},\delta/2)\bigr]
$$
は基本開集合であり、$y\in W$ である。$z\in W$ なら、$n\le N$ の項の和は $\sum_{n\le N}2^{-n}\cdot\delta/2<\delta/2$、$n>N$ の項の和は $2^{-N}<\delta/2$ なので $d(y,z)<\delta$ であり、よって $d(x,z)<\varepsilon$ となる。

**直積位相 ⊆ 距離位相.** 準開基の元 $p_{n}^{-1}[U]$（$U$ は $X_{n}$ で開）が $d$ について開であることを示せばよい（\ref{top:subbase-generates}）。$x\in p_{n}^{-1}[U]$ について、$B_{d_{n}}(x_{n},r)\subseteq U$ となる $0<r\le1$ をとる。$d(x,y)<2^{-n}r$ なら $2^{-n}\min\{1,d_{n}(x_{n},y_{n})\}<2^{-n}r$ である。このとき $\min\{1,d_{n}(x_{n},y_{n})\}<r\le1$ なので最小値は $d_{n}(x_{n},y_{n})$ のほうであり、$d_{n}(x_{n},y_{n})<r$ となる。よって $y\in p_{n}^{-1}[U]$ である。
:::

::: corollary カントール集合の自己同相 {#top:cantor-products keywords="C is homeomorphic to C^N, to {0,...,k}^N, and to C x C" index="カントール集合の積|かんとーるしゅうごうのせき"}
$\mathcal{C}\cong\mathcal{C}\times\mathcal{C}\cong\mathcal{C}^{\N}\cong\{0,1,\dots,k\}^{\N}$（$k\ge1$、有限離散空間の可算直積）。
:::

::: proof
三つの空間がどれも、空でなく、コンパクトで距離化可能で、完全不連結で、孤立点をもたないことを示せば、\ref{top:brouwer-cantor} からどれも $\mathcal{C}$ と同相になる。

- **コンパクトで距離化可能.** $\mathcal{C}$ と有限離散空間はコンパクトな距離空間である。その可算直積は \ref{top:tychonoff} からコンパクトであり、\ref{top:countable-product-metrizable} から距離化可能である。$\mathcal{C}\times\mathcal{C}$ は、第 3 成分以降を一点空間とした可算直積と同相なので、同じ命題に含まれる。
- **完全不連結.** 直積の連結な部分集合 $S$ をとると、各射影 $p_{n}[S]$ は完全不連結な空間の連結な部分集合なので一点である。座標がすべて一つに決まるので、$S$ は一点である。
- **孤立点をもたない.** 空でない基本開集合は、$\{0,\dots,k\}^{\N}$ と $\mathcal{C}^{\N}$ では有限個の座標しか制限しないので、残りの座標を動かして無限個の点を含む。$\mathcal{C}\times\mathcal{C}$ では $U\times V$（$U,V$ は $\mathcal{C}$ の空でない開集合）の形で、$\mathcal{C}$ が孤立点をもたないので $U$ は無限集合であり、$U\times V$ も無限個の点を含む。
:::

## 第二可算な正則空間 {#top:sec-mz-normal}

::: lemma 第二可算な正則空間は正規 {#top:regular-second-countable-normal keywords="regular second countable spaces are normal (Tychonoff)" index="第二可算正則空間の正規性|だいにかさんせいそくくうかんのせいきせい"}
第二可算な正則空間は正規である。
:::

::: proof
可算な開基 $\mathcal{B}$ を固定し、その数え上げを一つ固定する。交わらない閉集合 $A,B$ をとる。$A=\varnothing$ なら $\varnothing$ と $X$ で分離されるので、$A,B$ はともに空でないとしてよい。$\mathcal{B}_{A}\defeq\{U\in\mathcal{B}:\overline{U}\cap B=\varnothing\}$、$\mathcal{B}_{B}\defeq\{V\in\mathcal{B}:\overline{V}\cap A=\varnothing\}$ とおき、$\mathcal{B}$ の数え上げの順に $U_{1},U_{2},\ldots$, $V_{1},V_{2},\ldots$ と並べる（有限なら同じ元をくり返す。下の被覆性から、どちらも空でない）。

**被覆.** $a\in A$ について、正則性（\ref{top:regular-normal-characterization.1}）から $a\in O\subseteq\overline{O}\subseteq X\setminus B$ となる開集合 $O$ があり、開基の元 $U$ で $a\in U\subseteq O$ となるものがある。$\overline{U}\subseteq\overline{O}$ は $B$ と交わらないので、$U\in\mathcal{B}_{A}$ である。よって $\bigcup_{n}U_{n}\supseteq A$ である。同様に $\bigcup_{n}V_{n}\supseteq B$ である。

**分離.** 
$$
U'_{n}\defeq U_{n}\setminus\bigcup_{k\le n}\overline{V_{k}},\qquad V'_{n}\defeq V_{n}\setminus\bigcup_{k\le n}\overline{U_{k}}
$$
とおく（有限個の閉集合を除くので開）。$\overline{V_{k}}\cap A=\varnothing$ なので $U'_{n}\cap A=U_{n}\cap A$ であり、よって $U'\defeq\bigcup_{n}U'_{n}\supseteq A$ となる。同様に $V'\defeq\bigcup_{n}V'_{n}\supseteq B$ である。$U'_{n}\cap V'_{m}=\varnothing$ を示す。$n\le m$ の場合、$V'_{m}$ は $\overline{U_{n}}\supseteq U_{n}\supseteq U'_{n}$ を除いている。$m\le n$ の場合、$U'_{n}$ は $\overline{V_{m}}\supseteq V_{m}\supseteq V'_{m}$ を除いている。よって $U'\cap V'=\varnothing$ である。

::: hypcheck
- **正則性**：$A$ の点の近傍で、閉包ごと $B$ を避けるものをとるのに使った。
- **第二可算性**：被覆を可算個に揃え、番号順に「先に出たものの閉包を除く」操作をするのに使った。リンデレーフ性でも同じ議論ができるが、そのときは可算部分被覆の選択に選択公理を使う。
- **選択公理**：使っていない（開基の数え上げを一つ固定しただけ）。
:::
:::

## ウリゾーンの距離化定理 {#top:sec-mz-urysohn}

::: theorem ウリゾーンの距離化定理 {#top:urysohn-metrization keywords="Urysohn metrization theorem: second countable T3 spaces embed in the Hilbert cube and are metrizable" index="ウリゾーンの距離化定理|うりぞーんのきょりかていり, 距離化定理|きょりかていり" refname="ウリゾーンの距離化定理"}
第二可算な $T_{3}$ 空間はヒルベルト立方体 $[0,1]^{\N}$ に埋め込める。したがって距離化可能である（DC を使う）。
:::

::: intuition
可算な開基をもち、点と閉集合を開集合で分けられる（ハウスドルフな）空間には、必ず距離が入る。空間を、可算個の座標をもつ立方体の中に形を崩さずに描き込めるからである。
:::

::: proof
$X$ を第二可算な $T_{3}$ 空間とし、可算な開基 $\mathcal{B}=\{B_{1},B_{2},\ldots\}$ を固定する。\ref{top:regular-second-countable-normal} から $X$ は正規であり、$T_{1}$ なので $T_{4}$ である。

**Step 1（ウリゾーン関数を選ぶ）.** 【主張：$P\defeq\{(m,n):\overline{B_{m}}\subseteq B_{n}\}$ は可算であり、各 $(m,n)\in P$ に連続関数 $g_{m,n}\colon X\to[0,1]$ で、$\overline{B_{m}}$ 上 $1$、$X\setminus B_{n}$ 上 $0$ となるものがとれる】 $P\subseteq\N\times\N$ なので可算である。$(m,n)\in P$ なら $\overline{B_{m}}$ と $X\setminus B_{n}$ は交わらない閉集合なので、正規性とウリゾーンの補題（\tref{top:urysohn-lemma}）から、$\overline{B_{m}}$ 上 $0$、$X\setminus B_{n}$ 上 $1$ の連続関数がある。それを $1$ から引いたものを $g_{m,n}$ とすればよい（可算回の選択と補題自体で DC を使う）。

**Step 2.** 【主張：$F\colon X\to[0,1]^{P}$, $F(x)\defeq(g_{m,n}(x))_{(m,n)\in P}$ は連続であり、$[0,1]^{P}$ は距離化可能である】 各成分が連続なので、$F$ は連続である（\ref{top:product-maps}）。$P$ は可算なので、$[0,1]^{P}$ は $[0,1]^{\N}$ の閉部分空間（$P$ が有限なら、残りの座標を $0$ に固定した部分）と同相であり、\ref{top:countable-product-metrizable} から距離化可能である。

**Step 3（開写像性）.** 開集合 $U\subseteq X$ について $P_{U}\defeq\{(m,n)\in P:B_{n}\subseteq U\}$ とおく。【主張：次が成り立つ。とくに $F[U]$ は $F[X]$ の開集合である】
$$
F[U]=F[X]\cap\bigcup_{(m,n)\in P_{U}}p_{(m,n)}^{-1}\bigl[(0,1]\bigr]
$$
「$\supseteq$」：$(m,n)\in P_{U}$ について $g_{m,n}(y)>0$ なら、$g_{m,n}$ は $X\setminus B_{n}$ 上 $0$ なので $y\in B_{n}\subseteq U$ である。「$\subseteq$」：$x\in U$ なら、$x\in B_{n}\subseteq U$ となる $n$ がある。正則性（\ref{top:regular-normal-characterization.1}）から $x\in O\subseteq\overline{O}\subseteq B_{n}$ となる開集合 $O$ があり、さらに $x\in B_{m}\subseteq O$ となる $m$ がある。$\overline{B_{m}}\subseteq\overline{O}\subseteq B_{n}$ なので $(m,n)\in P_{U}$ であり、$g_{m,n}(x)=1>0$ となる。$(0,1]$ は $[0,1]$ の開集合なので、右辺は $F[X]$ の開集合である。

**Step 4.** 【主張：$F$ は単射である】 $x\neq y$ とする。$T_{1}$ から $U\defeq X\setminus\{y\}$ は $x$ を含む開集合であり、Step 3 の「$\subseteq$」の議論から $g_{m,n}(x)=1$ となる $(m,n)\in P_{U}$ がある。$y\notin B_{n}$ なので $g_{m,n}(y)=0$ であり、$F(x)\ne F(y)$ となる。

Step 2〜4 から、$F$ は連続な単射で、開集合を $F[X]$ の開集合に写すので、$X$ から $F[X]$ への同相写像、すなわち埋め込みである（\ref{top:homeomorphism.3}）。よって $X$ は距離化可能な空間 $[0,1]^{P}$ の部分空間と同相であり、距離の制限によって距離化可能である。

::: hypcheck
- **第二可算性**：Step 1 で関数の族を可算個にとり、Step 2 で可算直積（距離化可能）に埋め込むのに使った。
- **正則性**：正規性（\ref{top:regular-second-countable-normal}）と、Step 3 で $\overline{B_{m}}\subseteq B_{n}$ となる組が十分あることに使った。
- **$T_{1}$**：Step 4 の単射性に使った。$T_{1}$ でない正則空間（2 点以上の密着空間など）は距離化可能でない。
- **DC**：Step 1 のウリゾーン関数の選択。
:::
:::

::: corollary 第二可算と可分距離化可能 {#top:separable-metrizable}
位相空間について、「第二可算な $T_{3}$ 空間」であることと「可分な距離化可能空間」であることは同値である（可算選択公理と DC を使う）。とくに可分な距離空間はヒルベルト立方体に埋め込める。
:::

::: proof
前者なら、\ref{top:urysohn-metrization} から距離化可能であり、第二可算なので可分である（\ref{top:second-countable-properties}）。後者なら、距離空間として第二可算であり（\ref{top:metric-countability}）、$T_{3}$ である（\ref{top:metric-normal}）。
:::

::: corollary コンパクトハウスドルフ空間の距離化 {#top:compact-metrizable keywords="a compact Hausdorff space is metrizable iff it is second countable" index="コンパクトハウスドルフ空間の距離化|こんぱくとはうすどるふくうかんのきょりか"}
コンパクトハウスドルフ空間 $X$ について、$X$ が距離化可能であることと、第二可算であることは同値である（可算選択公理と DC を使う）。
:::

::: proof
距離化可能なら、コンパクト距離空間は第二可算である（\ref{top:compact-metric-second-countable}）。第二可算なら、コンパクトハウスドルフ空間は $T_{4}$（\ref{top:compact-hausdorff-normal}）、とくに $T_{3}$ なので、\ref{top:urysohn-metrization} から距離化可能である。
:::

::: theorem 完全写像の像の距離化可能性 {#top:perfect-image-metrizable keywords="a perfect image of a separable metric space is metrizable; quotients of compact metric spaces by closed equivalence relations are compact metrizable" index="完全写像の像の距離化|かんぜんしゃぞうのぞうのきょりか"}
可分距離空間 $X$ から空間 $Y$ への完全写像があれば、$Y$ は距離化可能である。特に、コンパクト距離空間 $X$ 上の閉な同値関係 $R$ について、$X/R$ はコンパクトで距離化可能である。
:::

::: intuition
可分な距離空間を、コンパクトなかたまりを一点ずつに潰すような行儀のよい写像（完全写像）で写すと、写した先にもまた距離が入る。
:::

::: proof
可分距離空間は可算な開基をもつ（\ref{top:metric-countability}。稠密な可算集合を中心とする有理数半径の開球）。距離空間は正則かつ $T_{1}$ である（\ref{top:metric-normal}）。よって \ref{top:perfect-preserves.2}, \ref[4]{top:perfect-preserves.4} から $Y$ は第二可算な $T_{3}$ 空間であり、\ref{top:urysohn-metrization} から距離化可能である。

後半：コンパクト距離空間は可分である（\ref{top:compact-metric-second-countable}）。$R$ が閉なので、定義（\ref{top:perfect-map.1}）から射影 $p$ は閉写像である。$\{p(x)\}=p[\{x\}]$ は閉写像による閉集合 $\{x\}$ の像なので閉であり、その逆像である同値類はコンパクト空間の閉集合なので、コンパクトである。よって $p$ は完全写像であり、前半から $X/R$ は距離化可能である。$X/R$ はコンパクト空間の連続像なので、コンパクトでもある。
:::

## ストーンの定理 {#top:sec-mz-stone}

::: theorem ストーンの定理 {#top:stone-paracompact keywords="A. H. Stone: every metric space is paracompact; M. E. Rudin's proof" index="ストーンの定理（パラコンパクト）|すとーんのていりぱらこんぱくと" refname="ストーンの定理"}
距離空間はパラコンパクトである（選択公理を使う）。
:::

::: intuition
距離空間のどんな開被覆も、各点の近くでは有限個しか重ならない、より細かい開被覆に取り替えられる。
:::

::: proof
$(X,d)$ を距離空間、$\mathcal{U}$ を開被覆とする。選択公理により $\mathcal{U}$ を整列し、$\mathcal{U}=\{U_{s}:s<\kappa\}$（$\kappa$ は順序数）と添字づける。各点 $x$ について、$x\in U_{s}$ となる最小の $s$ を $s(x)$ と書く。

**Step 1（構成）.** $n\ge1$ についての帰納法で、開集合 $D_{s,n}$（$s<\kappa$）を次のように定める。$E_{n}\defeq\bigcup_{t<\kappa,\,j<n}D_{t,j}$（$n$ より前に作った集合の和。$E_{1}=\varnothing$）とし、
$$
C_{s,n}\defeq\bigl\{x\in X:s(x)=s,\ x\notin E_{n},\ B(x,3\cdot2^{-n})\subseteq U_{s}\bigr\}
$$
$$
D_{s,n}\defeq\bigcup_{x\in C_{s,n}}B(x,2^{-n})
$$
とおく。各段は明示的に定義されているので、ここでは選択を使わない。【主張：各 $D_{s,n}$ は開集合で、$D_{s,n}\subseteq U_{s}$ である】 $D_{s,n}$ は開球の和なので開である。$x\in C_{s,n}$ なら $B(x,2^{-n})\subseteq B(x,3\cdot2^{-n})\subseteq U_{s}$ なので、$D_{s,n}\subseteq U_{s}$ となる。

**Step 2.** 【主張：$\mathcal{D}\defeq\{D_{s,n}:s<\kappa,\ n\ge1\}$ は $X$ を被覆する】 $x\in X$ をとり、$s\defeq s(x)$ とおく。$U_{s}$ は開なので、$B(x,3\cdot2^{-n})\subseteq U_{s}$ となる $n$ がある。$x\in E_{n}$ の場合、$x$ はある $D_{t,j}$ に属する。そうでない場合、$x\in C_{s,n}\subseteq D_{s,n}$ である。

**Step 3.** $x\in X$ をとる。Step 2 から $x\in D_{s,n}$ となる $(s,n)$ があるので、一つ固定する（どれでもよい）。$D_{s,n}$ は開なので、$B(x,2^{-j})\subseteq D_{s,n}$ となる $j\ge1$ をとり、$W\defeq B(x,2^{-n-j})$ とおく。【主張：$i\ge n+j$ なら、$W$ はどの $D_{t,i}$ とも交わらない】 $D_{t,i}$ を作る球 $B(y,2^{-i})$ の中心 $y\in C_{t,i}$ は、$n<i$ なので $y\notin E_{i}\supseteq D_{s,n}$ である。よって $y\notin B(x,2^{-j})$、すなわち $d(x,y)\ge2^{-j}$ である。一方 $n\ge1$, $i\ge n+j\ge j+1$ から $2^{-n-j}+2^{-i}\le2^{-j-1}+2^{-j-1}=2^{-j}$ なので、\term[三角不等式]{top:metric-topology}から $W$ と $B(y,2^{-i})$ は交わらない。

**Step 4.** 【主張：$i<n+j$ なら、$W$ と交わる $D_{t,i}$（$t<\kappa$）は高々一つである】 $t<u$ として、$p\in W\cap D_{t,i}$, $q\in W\cap D_{u,i}$ があるとする。$p\in B(y,2^{-i})$, $q\in B(z,2^{-i})$（$y\in C_{t,i}$, $z\in C_{u,i}$）とすると、$B(y,3\cdot2^{-i})\subseteq U_{t}$ であり、$s(z)=u>t$ なので $z\notin U_{t}$ である。よって $d(y,z)\ge3\cdot2^{-i}$ である。しかし $i\le n+j-1$ から $2\cdot2^{-n-j}\le2^{-i}$ なので、
$$
\begin{aligned}
d(y,z)&\le d(y,p)+d(p,x)+d(x,q)+d(q,z)\\
&<2^{-i}+2\cdot2^{-n-j}+2^{-i}\le3\cdot2^{-i}
\end{aligned}
$$
となり、矛盾する。

Step 3, 4 から、$W$ と交わる $\mathcal{D}$ の元は高々 $n+j-1$ 個であり、$\mathcal{D}$ は局所有限である。Step 1, 2 と合わせて、$\mathcal{D}$ は $\mathcal{U}$ の局所有限な開細分である。$X$ はハウスドルフ（\ref{top:metric-hausdorff}）なので、$X$ はパラコンパクトである。

::: hypcheck
- **整列（選択公理）**：$s(x)$ を定め、Step 4 で「中心 $z$ は $U_{t}$ に入らない」を使うのに必要だった。整列したあとの構成は明示的で、点ごとの選択は使っていない。
- **距離**：球の半径 $2^{-n}$ と $3\cdot2^{-n}$ の比較による Step 3, 4 の評価に使った。
- **Step 3 で $n\ge1$**：$2^{-n-j}\le2^{-j-1}$ のために使った。
:::
:::

::: supplement
**距離化定理の一般形.** 位相空間が距離化可能であることは、次のそれぞれと同値であることが知られている（R. Engelking, *General Topology* の距離化定理の節）。
- $T_{3}$ で、σ局所有限な開基（可算個の局所有限な族の和である開基）をもつ（**長田–スミルノフの距離化定理**）。
- $T_{3}$ で、σ離散的な開基をもつ（**ビングの距離化定理**。本サイトでは証明しない）。

前者は \see{top:page-nagata-smirnov} で証明する。ウリゾーンの距離化定理は、可算な開基（一点ずつの族は局所有限）の場合として含まれる。

これらの同値条件とは別に、距離化可能であるための十分条件を与える定理として、パラコンパクトなハウスドルフ空間が局所的に距離化可能なら距離化可能である（**スミルノフの距離化定理**）ことも知られている。

**前提を変えると.** 第二可算性を外すと、ウリゾーンの距離化定理の結論は成り立たない。$\omega_{1}$（順序位相）は $T_{4}$ だがパラコンパクトでない（\see{top:imp-omega-one}）ので、\ref{top:stone-paracompact} から距離化可能でない。その一点コンパクト化 $\omega_{1}+1$ はコンパクトハウスドルフ（したがってパラコンパクトで $T_{4}$）だが、第一可算でない（\ref{top:omega-one-space.2}）ので距離化可能でない（\ref{top:metric-countability}）。コンパクト性があれば、第二可算性と距離化可能性は同値になる（\ref{top:compact-metrizable}）。
:::

::: intuition 高い視点から：可算個の温度計
ウリゾーンの距離化定理の証明は、空間の点を「可算個の連続関数の値の列」で記録する。比喩で言えば、空間のあちこちに可算個の温度計 $g_{m,n}$ を置き、各点をその読みの列 $(g_{m,n}(x))$ で表す。温度計が十分多ければ（正則性と第二可算性）、読みの列から点と近さが復元でき、空間はヒルベルト立方体の部分空間として「座標づけ」される。ヒルベルト立方体は、可分距離空間すべてを収める**普遍的な**空間である（\ref{top:separable-metrizable}）。

\ref{top:tychonoff-embedding}も同じ発想だが、そちらは温度計を非可算個許すので、距離の代わりにコンパクト化が得られる。
:::

## 問題 {#top:sec-mz-problems}

::: problem {#top:prob-uncountable-product-not-metrizable}
$[0,1]^{\R}$ は第一可算でなく、したがって距離化可能でないことを示せ（可算選択公理を使ってよい）。
:::

::: solution
点 $0$（すべての座標が $0$）に可算な基本近傍系 $(N_{k})$ があると仮定する。各 $N_{k}$ に含まれる基本開集合 $W_{k}\ni0$ を選ぶ（可算選択）。$W_{k}$ は有限個の座標 $J_{k}$ だけを制限する（\ref{top:product-base}）。$J\defeq\bigcup_{k}J_{k}$ は可算なので、$i\in\R\setminus J$ がとれる。$O\defeq p_{i}^{-1}[[0,1/2)]$ は $0$ の開近傍だが、どの $N_{k}$ も $O$ に含まれない。実際、$W_{k}\subseteq N_{k}$ は座標 $i$ を制限しないので、座標 $i$ だけが $1$ で残りが $0$ の点を含み、その点は $O$ に属さない。これは基本近傍系であることに反する。距離化可能な空間は第一可算なので（\ref{top:metric-countability}）、$[0,1]^{\R}$ は距離化可能でない。
:::

::: problem {#top:prob-one-point-uncountable-discrete}
非可算な離散空間 $D$ の一点コンパクト化 $D^{\ast}$ は、コンパクトハウスドルフだが距離化可能でないことを示せ。
:::

::: solution
$D$ は局所コンパクトハウスドルフ（一点 $\{x\}$ がコンパクトな近傍）なので、$D^{\ast}$ はコンパクトハウスドルフである（\ref{top:one-point-properties}）。距離化可能と仮定すると、$D^{\ast}$ は第二可算であり（\ref{top:compact-metrizable}）、開部分空間 $D$ も第二可算になる。しかし $D$ の開基は各一点集合 $\{x\}$ を含まなければならず（$\{x\}$ が開で、それに含まれる空でない開集合は $\{x\}$ だけ）、非可算である。これは矛盾である。
:::
