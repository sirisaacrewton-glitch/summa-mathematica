# 至るところ微分不可能な連続関数 {#top:page-nowhere-differentiable keywords="nowhere differentiable continuous functions, Banach's category argument, Baire category theorem in C[0,1], residual sets, sawtooth functions, piecewise linear approximation, Weierstrass function"}

至るところ微分不可能な連続関数を具体的に書くこと（ワイエルシュトラスの例）は計算を要するが、\ref{top:baire-category}を使えば、そのような関数が**存在する**だけでなく、連続関数全体の空間 $C[0,1]$ の中で「ほとんどすべて」（第一類集合の補集合）であることが示せる（**バナッハの定理**、\tref{top:nowhere-differentiable-generic}）。鍵は、ある点でリプシッツ的な増加の評価をもつ関数の集合 $E_{n}$（\ref{top:lipschitz-at-point-sets}）が閉かつ内部をもたないことで、内部をもたないことは、折れ線で近似してから急な鋸歯を加えることで示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論（バナッハ、1931 による）に従って組み立てた。

## 記法と定義の確認 {#top:sec-nd-notation}

::: notation
- $C[0,1]$ は連続関数 $[0,1]\to\R$ の全体で、距離 $\lVert f-g\rVert\defeq\sup\lvert f-g\rvert$ により完備な距離空間（\ref{top:uniform-space-complete}）。
- 疎集合・第一類集合・ベールのカテゴリー定理（完備距離空間はベール空間）は \ref{top:first-category}, \tref{top:baire-category}。ハイネ–カントールの定理（コンパクト集合上の連続関数は一様連続）は \tref{top:heine-cantor}。
- $f$ が $x\in[0,1]$ で**微分可能**とは、極限 $\lim_{y\to x,\,y\in[0,1]}\frac{f(y)-f(x)}{y-x}$ が存在する（有限）ことをいう（端点では片側極限）。
:::

## 補助的な集合 {#top:sec-nd-sets}

::: definition 一点でのリプシッツ評価 {#top:lipschitz-at-point-sets keywords="E_n: functions with |f(y)-f(x)| <= n|y-x| for some x and all y" index="一点でのリプシッツ評価|いってんでのりぷしっつひょうか"}
$n\ge1$ について、$E_{n}\defeq\{f\in C[0,1]:\text{ある }x\in[0,1]\text{ で、すべての }y\in[0,1]\text{ について }\lvert f(y)-f(x)\rvert\le n\lvert y-x\rvert\}$。
:::

::: intuition
$E_{n}$ は、グラフ上のどこか一点を頂点として、傾き $\pm n$ の二本の直線ではさんだ「くさび」の中にグラフ全体が収まる関数の集まりである。どこか一点で微分できる関数は、$n$ を大きくとればこのどれかに入る。
:::

::: lemma 微分可能ならどれかの E_n に属する {#top:differentiable-in-en keywords="a function differentiable at some point lies in some E_n" index="微分可能性と E_n|びぶんかのうせいといーえぬ"}
$f\in C[0,1]$ がある点 $x$ で微分可能なら、ある $n$ で $f\in E_{n}$。
:::

::: proof
$x$ での微分係数を $a$ とする。微分係数の定義（$\varepsilon=1$ の場合）から、$\delta>0$ があって、$0<\lvert y-x\rvert<\delta$ なら $\lvert f(y)-f(x)\rvert\le(\lvert a\rvert+1)\lvert y-x\rvert$ が成り立つ。一方 $\lvert y-x\rvert\ge\delta$ なら、$\lvert f(y)-f(x)\rvert\le2\lVert f\rVert\le(2\lVert f\rVert/\delta)\lvert y-x\rvert$ である。$y=x$ なら両辺は $0$ である。ゆえに、整数 $n\ge\max(\lvert a\rvert+1,2\lVert f\rVert/\delta,1)$ をとれば、すべての $y$ で $\lvert f(y)-f(x)\rvert\le n\lvert y-x\rvert$ となり、$f\in E_{n}$ である。
:::

::: lemma E_n は閉 {#top:en-closed keywords="E_n is closed in C[0,1]" index="E_n の閉性|いーえぬのへいせい"}
$E_{n}$ は $C[0,1]$ の閉集合である。
:::

::: proof
$f_{k}\in E_{n}$, $f_{k}\to f$（一様）とし、$f_{k}$ の評価の点を $x_{k}$ とする。$[0,1]$ は**コンパクト**なので、部分列をとって $x_{k}\to x$ としてよい（\tref{top:bolzano-weierstrass}。部分列でも $f_{k}\to f$ は変わらない）。$y\in[0,1]$ を固定すると、三角不等式と $f_{k}\in E_{n}$ から次が成り立つ：
$$
\begin{aligned}
\lvert f(y)-f(x)\rvert&\le\lvert f(y)-f_{k}(y)\rvert+\lvert f_{k}(y)-f_{k}(x_{k})\rvert\\
&\qquad+\lvert f_{k}(x_{k})-f(x_{k})\rvert+\lvert f(x_{k})-f(x)\rvert\\
&\le2\lVert f-f_{k}\rVert+n\lvert y-x_{k}\rvert+\lvert f(x_{k})-f(x)\rvert.
\end{aligned}
$$
$k\to\infty$ とすると、一様収束から $\lVert f-f_{k}\rVert\to0$、$x_{k}\to x$ から $n\lvert y-x_{k}\rvert\to n\lvert y-x\rvert$、$f$ の連続性から $\lvert f(x_{k})-f(x)\rvert\to0$ なので、右辺は $n\lvert y-x\rvert$ に収束する。ゆえに $\lvert f(y)-f(x)\rvert\le n\lvert y-x\rvert$ である。$y$ は任意なので $f\in E_{n}$ であり、閉集合の点列による特徴づけ（距離空間）から $E_{n}$ は閉である。
:::

::: lemma E_n は内部をもたない {#top:en-nowhere-dense keywords="E_n has empty interior: perturb a piecewise linear approximation by a steep sawtooth" index="E_n の疎性|いーえぬのそせい"}
$E_{n}$ は内部をもたない。したがって（閉なので）疎集合である。
:::

::: proof
$f\in C[0,1]$ と $\varepsilon>0$ について、$\lVert f-g\rVert<\varepsilon$ で $g\notin E_{n}$ となる $g$ を作る。

**Step 1（折れ線近似）.** 【主張：折れ線 $p$ と $M\ge0$ で、$\lVert f-p\rVert<\varepsilon/2$ かつすべての $x,y\in[0,1]$ で $\lvert p(y)-p(x)\rvert\le M\lvert y-x\rvert$ となるものがある】 **ハイネ–カントールの定理**から $f$ は一様連続なので、$\lvert s-t\rvert\le1/m$ なら $\lvert f(s)-f(t)\rvert<\varepsilon/2$ となる正の整数 $m$ がある。$p$ を、点 $k/m$（$k=0,\dots,m$）で $f$ と一致し、各区間 $[k/m,(k+1)/m]$ で一次関数である折れ線と定める。区間 $[k/m,(k+1)/m]$ の中の $t$ では $p(t)$ は両端の値 $f(k/m)$, $f((k+1)/m)$ の間にあり、その両方が $f(t)$ と $\varepsilon/2$ 未満しか違わないので、$\lvert f(t)-p(t)\rvert<\varepsilon/2$ である。区間は有限個なので最大値をとって $\lVert f-p\rVert<\varepsilon/2$ を得る。各区間の傾きの絶対値の最大値を $M$ とおくと、$x<y$ を結ぶ区間を折れ線の節点で分けて足し合わせることで、$\lvert p(y)-p(x)\rvert\le M\lvert y-x\rvert$ が成り立つ。

**Step 2（鋸歯）.** $L\defeq n+M+1$, $h\defeq\varepsilon/L$ とおき、$s(t)\defeq L\cdot\mathrm{dist}(t,h\mathbb{Z})$ と定める。$g\defeq p+s$ とおく。【主張：$\lVert f-g\rVert<\varepsilon$ であり、$s$ は各区間 $J_{j}\defeq[jh/2,(j+1)h/2]$（$j\in\mathbb{Z}$）の上で傾き $+L$ か $-L$ の一次関数である】 $t\in[mh,mh+h/2]$（$m\in\mathbb{Z}$）なら $\mathrm{dist}(t,h\mathbb{Z})=t-mh$、$t\in[mh+h/2,(m+1)h]$ なら $\mathrm{dist}(t,h\mathbb{Z})=(m+1)h-t$ なので、後半が従う。また $0\le\mathrm{dist}(t,h\mathbb{Z})\le h/2$ から $0\le s\le Lh/2=\varepsilon/2$ である。ゆえに $\lVert f-g\rVert\le\lVert f-p\rVert+\lVert s\rVert<\varepsilon/2+\varepsilon/2=\varepsilon$ である。

**Step 3.** 【主張：どの $x\in[0,1]$ にも、$\lvert g(y)-g(x)\rvert>n\lvert y-x\rvert$ となる $y\in[0,1]$ がある。したがって $g\notin E_{n}$】 $x<1$ の場合、$jh/2\le x<(j+1)h/2$ となる $j$ をとり、$x<y\le\min((j+1)h/2,1)$ となる $y$ をとる。$x=1$ の場合、$jh/2<1\le(j+1)h/2$ となる $j$ をとり、$\max(jh/2,0)\le y<1$ となる $y$ をとる。どちらの場合も $x,y$ は同じ区間 $J_{j}$ に属し $y\ne x$ なので、Step 2 から $\lvert s(y)-s(x)\rvert=L\lvert y-x\rvert$ である。Step 1 の $\lvert p(y)-p(x)\rvert\le M\lvert y-x\rvert$ と合わせて
$$
\lvert g(y)-g(x)\rvert\ge L\lvert y-x\rvert-M\lvert y-x\rvert=(n+1)\lvert y-x\rvert>n\lvert y-x\rvert
$$
を得る。$x$ は任意なので、どの点を評価の点にしても $E_{n}$ の条件は破れ、$g\notin E_{n}$ である。$\varepsilon$ と $f$ は任意なので、$E_{n}$ はどの開球も含まず、内部をもたない。
:::

## バナッハの定理 {#top:sec-nd-theorem}

::: theorem バナッハの定理 {#top:nowhere-differentiable-generic keywords="the set of continuous functions differentiable at no point is residual (comeager) and dense in C[0,1]" index="至るところ微分不可能な連続関数|いたるところびぶんふかのうなれんぞくかんすう, バナッハの定理（微分不可能）|ばなっはのていりびぶんふかのう" refname="バナッハの定理"}
（DC）$[0,1]$ のどの点でも微分可能でない連続関数の全体 $N$ は、$C[0,1]$ の第一類集合の補集合で、稠密である。特に、至るところ微分不可能な連続関数が存在する。
:::

::: intuition
連続関数をでたらめに選ぶと、ほぼ確実に（カテゴリーの意味で）どの点でも微分できない関数が出てくる。滑らかな関数のほうが例外である。
:::

::: proof
\ref{top:differentiable-in-en} から $C[0,1]\setminus N\subseteq\bigcup_{n}E_{n}$ である。\ref{top:en-closed}, \ref{top:en-nowhere-dense} から各 $E_{n}$ は疎集合である。疎集合の部分集合は疎（閉包の内部が小さくなる）なので、$C[0,1]\setminus N=\bigcup_{n}\bigl((C[0,1]\setminus N)\cap E_{n}\bigr)$ は疎集合の可算和、すなわち第一類集合である。ゆえに $N$ は第一類集合の補集合である。$C[0,1]$ は完備距離空間なので、ベールのカテゴリー定理から第一類集合の補集合は稠密であり、とくに空でない。

::: hypcheck
- **$C[0,1]$ の完備性**：ベールのカテゴリー定理を使うのに必要とした。
- **$[0,1]$ のコンパクト性**：\ref{top:en-closed} で評価の点の部分列をとるのと、\ref{top:en-nowhere-dense} の Step 1 の一様連続性に使った。
- **鋸歯の傾きが近似の傾きより大きいこと**：\ref{top:en-nowhere-dense} の Step 3 で、近似 $p$ の変化が鋸歯の変化を打ち消さないことに使った。
- **選択**：ベールのカテゴリー定理に従属選択公理（DC）を使う。それ以外は $\ZF$ で済む。
:::
:::

## 問題 {#top:sec-nd-problems}

::: problem {#top:prob-nd-monotone}
$[0,1]$ 上の単調増加な連続関数全体 $\mathcal{M}$ は $C[0,1]$ の閉集合で、内部をもたないことを示せ。
:::

::: solution
**閉であること.** $f_{k}\in\mathcal{M}$ が $f$ に一様収束するとする。$x\le y$ なら $f_{k}(x)\le f_{k}(y)$ であり、$k\to\infty$ とすると（一様収束なら各点収束するので）$f(x)\le f(y)$ を得る。ゆえに $f\in\mathcal{M}$ であり、$\mathcal{M}$ は閉である。

**内部をもたないこと.** $f\in\mathcal{M}$ と $\varepsilon>0$ をとる。\ref{top:en-nowhere-dense} の Step 1 の折れ線近似 $p$（$\lVert f-p\rVert<\varepsilon/2$、$\lvert p(y)-p(x)\rvert\le M\lvert y-x\rvert$）をとり、Step 2 と同じ式で $L\defeq M+1$, $h\defeq\varepsilon/L$ として鋸歯 $s$（$0\le s\le\varepsilon/2$）を作り、$g\defeq p-s$ とおく。このとき $\lVert f-g\rVert<\varepsilon$ である。$0\le x<y\le\min(h/2,1)$ なら $s(t)=Lt$ なので
$$
g(y)-g(x)\le M(y-x)-L(y-x)=-(y-x)<0
$$
となり、$g$ は $[0,\min(h/2,1)]$ で狭義減少する。ゆえに $g\notin\mathcal{M}$ であり、$f$ の $\varepsilon$ 近傍は $\mathcal{M}$ に含まれない。（したがって単調な連続関数全体は疎集合である。単調関数はほとんど至るところ微分可能であり（\see{meas:monotone-differentiable}）、それは \ref{top:nowhere-differentiable-generic} と矛盾しない。）
:::

::: problem {#top:prob-nd-en-not-open}
$E_{1}$ は開集合でないことを示せ。
:::

::: solution
定数関数 $0$ は（どの $x$ でも $\lvert0-0\rvert\le\lvert y-x\rvert$ なので）$E_{1}$ に属する。$\varepsilon>0$ をとり、\ref{top:en-nowhere-dense} の構成で $f=0$（$p=0$, $M=0$）、$n=1$ とした $g$ を考えると、$\lVert g\rVert<\varepsilon$ かつ $g\notin E_{1}$ である。ゆえに $0$ のどの近傍も $E_{1}$ に含まれず、$E_{1}$ は開集合でない。
:::

::: supplement
**前提を変えると.** 同じ議論で、$[0,1)$ のどの点でも右微分係数が有限にならない連続関数の集合も第一類集合の補集合であることが示せる。実際、$E_{n}^{+}\defeq\{f:\text{ある }x\in[0,1-1/n]\text{ で、すべての }y\in[x,1]\text{ について }\lvert f(y)-f(x)\rvert\le n(y-x)\}$ とおく。$x<1$ で有限な右微分係数 $a$ をもてば、\ref{top:differentiable-in-en} と同じ評価で $n\ge\max(\lvert a\rvert+1,2\lVert f\rVert/\delta,1/(1-x))$ のとき $f\in E_{n}^{+}$ となる。$E_{n}^{+}$ が閉であることは \ref{top:en-closed} と同じ（$[0,1-1/n]$ がコンパクト）で、内部をもたないことは \ref{top:en-nowhere-dense} の Step 3 で $x<1$ の場合の $y>x$ をとればよい。左微分係数も対称である。一方、「どの点でも片側微分係数が（$\pm\infty$ を含めて）存在しない」連続関数（ベシコビッチの関数）の集合は、逆に第一類集合であることが知られている（サックス、1932。ここでは証明しない）。

**似た定理.** 具体例としては、ワイエルシュトラスの関数 $\sum_{k}a^{k}\cos(b^{k}\pi x)$ が、$0<a<1$、$b$ が奇数の整数で $ab>1+3\pi/2$ のとき至るところ微分不可能であることが知られている（これはワイエルシュトラスの元の十分条件で、ハーディ（1916）により $b>1$, $ab\ge1$ に弱められた）。カテゴリー論法は、ほかにも「ほとんどすべての」対象が病的であることや、ある性質が一様に成り立つことを示すのに使われる（たとえば、ベールの定理の応用である \ref{top:uniform-boundedness-baire}）。\ref{top:page-stone-weierstrass}が「よい関数が稠密である」ことを述べるのと対照的に、本定理は「悪い関数が稠密で、しかも大部分を占める」ことを述べる。

**高い視点から：典型的な関数は荒々しい.** 教科書に現れる関数（多項式、三角関数）は滑らかだが、連続関数全体の中では例外的である。どの連続関数も、ごく小さな振れ幅の急な鋸歯を加えるだけで、どの点でも微分不可能に近づけられ、しかもその性質は小さな変形で壊れない。比喩で言えば、紙の上に定規で引いた滑らかな線は、拡大鏡で見るとどこもギザギザしている「典型的な線」の中では稀な存在である。
:::
