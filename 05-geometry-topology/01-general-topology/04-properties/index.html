# 基本性質 I（Fundamental Properties I）

分離公理、コンパクト空間、チコノフの定理、局所コンパクトと一点コンパクト化、連結性、ウリゾーンの補題とティーツェの拡張定理、ストーン–チェックのコンパクト化、パラコンパクト性と 1 の分割、局所連結性と弧状連結性。性質の保存表・操作の可換性・含意の地図は「基本性質 II」にある。（内田『集合と位相』§21–§25、小山『位相空間論』第 7 章を参考）

<p class="mn-msc">MSC2020: 54D10, 54D15, 54D30, 54D35, 54D45, 54D05, 54D20</p>
