# 基本性質 II（Fundamental Properties II）

ストーン双対性、カントール集合、完全写像、商写像と直積（ホワイトヘッドの定理）、可算コンパクト性・点列コンパクト性・擬コンパクト性、βℕ の濃度と点列、有理数の位相的特徴づけ（シェルピンスキーの定理）、マイケルの定理（σ 局所有限な細分とパラコンパクト性、正則リンデレーフ空間）、マイケルの選択定理。後半は、分離公理・コンパクト性・可算性・連結性・距離化可能性などが、部分空間・直積・直和・商・連続像・開写像・閉写像・完全写像で保たれるかの一覧表、閉包・内部・直積・商などの操作の可換性、性質の組み合わせから別の性質が導かれる関係の地図。各欄に証明または反例への参照を付ける。

<p class="mn-msc">MSC2020: 54D30, 54D20, 54C10, 54B, 54C, 54G</p>
