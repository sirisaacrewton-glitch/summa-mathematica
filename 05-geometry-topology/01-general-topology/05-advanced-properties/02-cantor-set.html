# カントール集合の普遍性 {#top:page-cantor-set keywords="Cantor space, zero-dimensional, quasi-component, retraction onto closed subsets of Cantor space, Alexandroff-Hausdorff theorem, every compact metric space is a continuous image of the Cantor set, Brouwer's characterization of the Cantor set"}

カントール集合 $\mathcal{C}$（\ref{top:cantor-set-maps}）は、小さく見えて驚くほど「大きい」空間である。本ページでは、(1) 空でないコンパクト距離空間はすべて $\mathcal{C}$ の連続像であること（**アレクサンドロフ–ハウスドルフの定理**、\tref{top:alexandroff-hausdorff}）と、(2) 空でなく、孤立点をもたず、完全不連結なコンパクト距離化可能空間はすべて $\mathcal{C}$ と同相であること（**ブラウワーの特徴づけ**、\ref{top:brouwer-cantor}）を示す。準備として、完全不連結なコンパクトハウスドルフ空間は閉開集合の基をもつこと（\ref{top:totally-disconnected-zero-dim}）と、$\mathcal{C}$ の空でない閉集合は $\mathcal{C}$ の**レトラクト**であること（\ref{top:cantor-retract}）を示す。

> 資料：小山晃『位相空間論』第 8 章の発展（カントール集合とその性質）を参考にした（本文は写していない）。同書で問題とされているブラウワーの特徴づけと、レトラクトによるアレクサンドロフ–ハウスドルフの定理の証明は、二進木を使う形で自分で組み立てた。

## 記法と定義の確認 {#top:sec-cs-notation}

::: notation
- $2^{\N}\defeq\{0,1\}^{\N}$ に直積位相を入れた空間（**カントール空間**）は、カントール集合 $\mathcal{C}$ と同相である（\ref{top:cantor-set-maps.1}）。有限の $0,1$ 列 $s$ について $[s]\defeq\{x\in2^{\N}:x\text{ は }s\text{ で始まる}\}$（**筒集合**）は閉開集合で、筒集合全体は基をなす。$d(x,y)\defeq2^{-\min\{i:x_{i}\ne y_{i}\}}$（$x\ne y$）は直積位相を定める距離で、$d(x,y)\le2^{-k}$ と「$x,y$ が最初の $k$ 項で一致する」は同値。
- 連結成分・完全不連結は \ref{top:components}、ストーン空間（閉開集合の基をもつコンパクトハウスドルフ空間）は \ref{top:stone-space} のとおり。空間が**完全**（孤立点をもたない）であるとは、どの一点集合も開でないことをいう。
- コンパクト距離空間は第二可算（\ref{top:compact-metric-second-countable}）。コンパクトからハウスドルフへの連続な単射は埋め込み、全単射は同相（\ref{top:compact-to-hausdorff}）。
:::

## 準備 {#top:sec-cs-lemmas}

::: lemma 完全不連結なコンパクト空間は零次元 {#top:totally-disconnected-zero-dim keywords="a totally disconnected compact Hausdorff space has a base of clopen sets; quasi-components" index="零次元|れいじげん, 準成分|じゅんせいぶん"}
完全不連結なコンパクトハウスドルフ空間 $X$ は閉開集合からなる基をもつ（したがってストーン空間である）。
:::

::: proof
**Step 1（準成分は連結）.** $x\in X$ について、$x$ を含む閉開集合全体の共通部分を $Q$ とする。$Q$ は閉。$Q=A\cup B$（$A,B$ は $Q$ の互いに交わらない閉集合、したがって $X$ の閉集合）と分け、$x\in A$ とする（$x\in B$ なら $A$ と $B$ を入れ替える）。$B=\emptyset$ を示せばよい。$X$ は正規（\ref{top:compact-hausdorff-normal}）なので、交わらない開集合 $U\supseteq A$, $V\supseteq B$ がある。$X\setminus(U\cup V)$ はコンパクトで、$x$ を含む閉開集合の補集合たちで覆われる（共通部分が $Q\subseteq U\cup V$ なので）。有限部分被覆をとると、$x$ を含む閉開集合 $C_{1},\dots,C_{n}$ で $C\defeq\bigcap C_{i}\subseteq U\cup V$ となる。$C\cap U$ は開である。$C\subseteq U\cup V$, $U\cap V=\emptyset$ から $C\cap U=C\setminus V$ なので、$C\cap U$ は閉でもあり、$x$ を含む。よって $Q$ の定義から $Q\subseteq C\cap U\subseteq U$ であり、$B\subseteq Q\cap V\subseteq U\cap V=\emptyset$ となる。したがって $Q$ は連結である。

**Step 2（基）.** $Q$ は $x$ を含む連結集合なので $x$ の連結成分に含まれ、$X$ は完全不連結なので $Q=\{x\}$ である。$x\in W$（$W$ は開）とすると、コンパクト集合 $X\setminus W$ は $x$ を含む閉開集合の補集合で覆われる（共通部分が $Q=\{x\}\subseteq W$ なので）。有限部分被覆をとると、有限個の閉開集合の共通部分 $C\ni x$ で $C\subseteq W$ となるものが得られ、$C$ は閉開である。

::: hypcheck
- **コンパクト性**：Step 1・2 で、閉開集合の補集合による被覆から有限個を取り出すのに使った。コンパクトでなければ準成分は連結成分より大きくなりうる。
- **ハウスドルフ性**：Step 1 で正規性（\ref{top:compact-hausdorff-normal}）を通じて使った。
- **完全不連結**：Step 2 で $Q=\{x\}$ を導くのに使った。
:::
:::

::: lemma カントール空間のレトラクト {#top:cantor-retract keywords="every nonempty closed subset of Cantor space is a retract" index="レトラクト（カントール空間）|れとらくとかんとーるくうかん"}
$F\subseteq2^{\N}$ が空でない閉集合なら、連続写像 $r\colon2^{\N}\to F$ で $r|_{F}=1_{F}$ となるもの（\term[レトラクション]{at:homotopy-equivalent}）がある。
:::

::: proof
$T\defeq\{x\restriction n:x\in F,n\ge0\}$（$F$ の元の最初の有限項の列全体）とおく。$F$ が閉なので、$x\in F$ とすべての $n$ で $x\restriction n\in T$ となることは同値である（$x\notin F$ なら $x$ のある筒集合 $[x\restriction n]$ が $F$ と交わらず、$x\restriction n\notin T$ となる）。また $T$ の各元 $s$ は $T$ の中で延長できる（$s=y\restriction n$, $y\in F$ なら $y\restriction(n+1)\in T$ であり、これは $s0$ か $s1$ である）。

$x\in2^{\N}$ について、$x\in F$ なら $r(x)\defeq x$。$x\notin F$ なら、$x\restriction m\in T$, $x\restriction(m+1)\notin T$ となる $m$ がある（$x\restriction0$ は空列で $T$ に属する）。$s_{m}\defeq x\restriction m$ から始めて、$s_{k}0\in T$ のときは $s_{k+1}\defeq s_{k}0$、そうでないときは $s_{k+1}\defeq s_{k}1$ と延ばす。$s_{k}\in T$ なら $s_{k}0,s_{k}1$ の少なくとも一方は $T$ に属するので、帰納的にすべての $s_{k}$ が $T$ に属する。$r(x)$ をすべての $s_{k}$ を延長する無限列と定めると、その最初の有限項の列はすべて $T$ に属するので、$r(x)\in F$ である。

**連続性.** $x\in F$ のとき、$x$ と最初の $k$ 項で一致する $x'$ について、$x'\in F$ なら $r(x')=x'$、そうでなければ $x'\restriction k=x\restriction k\in T$ なので $x'$ が $T$ から外れる位置 $m'$ は $k$ 以上で、$r(x')$ は $x'\restriction m'$ を延ばしたもの。いずれの場合も $r(x')$ は $x=r(x)$ と最初の $k$ 項で一致する。$x\notin F$ のとき、$x$ と最初の $m+1$ 項で一致する $x'$ は同じ位置 $m$ で $T$ から外れ、同じ $s_{m}$ から同じ規則で延ばすので、$r(x')=r(x)$ である。よって $r$ は各点で連続である。

::: hypcheck
- **$F$ が閉**：「$x\in F$ とすべての $x\restriction n\in T$ が同値」に使い、これで $r(x)\in F$ が保証される。閉でなければ $r(x)$ は $\overline{F}$ にしか入らない。
- **$F\neq\emptyset$**：空列が $T$ に属すること（$m$ の存在）に使った。
:::
:::

## アレクサンドロフ–ハウスドルフの定理 {#top:sec-cs-ah}

::: theorem アレクサンドロフ–ハウスドルフの定理 {#top:alexandroff-hausdorff keywords="every nonempty compact metric space is a continuous image of the Cantor set" index="アレクサンドロフ–ハウスドルフの定理|あれくさんどろふはうすどるふのていり" refname="アレクサンドロフ–ハウスドルフの定理"}
空でないコンパクト距離空間 $X$ について、カントール集合からの連続な全射 $\mathcal{C}\to X$ がある。
:::

::: intuition
空でないコンパクト距離空間はどれも、カントール集合を連続に写して全体を覆うことで得られる。カントール集合は、コンパクト距離空間すべての「もと」になる空間である。
:::

::: proof
**Step 1（ヒルベルト立方体への埋め込み）.** 【主張：$X$ はヒルベルト立方体 $[0,1]^{\N}$ の閉集合 $e[X]$ と同相】 $X$ は第二可算（\ref{top:compact-metric-second-countable}）なので可分であり、稠密な点列 $(p_{n})$ がある。$e\colon X\to[0,1]^{\N}$, $e(x)\defeq(\min\{1,d(x,p_{n})\})_{n}$ とおくと、各成分が連続なので $e$ は連続である。$e$ は単射である。実際、$x\ne y$ なら $\varepsilon\defeq\min\{1,d(x,y)\}/2$ に対し $d(x,p_{n})<\varepsilon$ となる $n$ があり、$d(y,p_{n})\ge d(x,y)-d(x,p_{n})>2\varepsilon-\varepsilon=\varepsilon$ なので、$e(x)_{n}<\varepsilon<e(y)_{n}$ である。$X$ はコンパクト、$[0,1]^{\N}$ はハウスドルフなので、\ref{top:compact-to-hausdorff} から $e$ は埋め込みであり、像 $e[X]$ はコンパクトなので閉集合である（\ref{top:compact-hausdorff-closed}）。

**Step 2（$\mathcal{C}$ から立方体への全射）.** 【主張：連続な全射 $\Psi\colon\mathcal{C}\to[0,1]^{\N}$ がある】 $\varphi\colon\mathcal{C}\to[0,1]$ を \ref{top:cantor-set-maps.2} の連続な全射とする。$\N\times\N$ と $\N$ の全単射により座標を並べ替えると $2^{\N}\cong(2^{\N})^{\N}$ となる（座標の並べ替えは同相写像）ので、$\mathcal{C}\cong\mathcal{C}^{\N}$ である。$\Psi\colon\mathcal{C}\cong\mathcal{C}^{\N}\xrightarrow{\varphi^{\N}}[0,1]^{\N}$ とおくと、各成分が連続な全射なので、$\Psi$ は連続な全射である。

**Step 3（レトラクト）.** 【主張：$e^{-1}\circ\Psi\circ r\colon\mathcal{C}\to X$ は連続な全射】 $F\defeq\Psi^{-1}[e[X]]$ とおくと、$e[X]$ は空でない閉集合で $\Psi$ は連続な全射なので、$F$ は $\mathcal{C}$ の空でない閉集合である。\ref{top:cantor-retract}（$\mathcal{C}\cong2^{\N}$ で移す）の\term[レトラクション]{at:homotopy-equivalent} $r\colon\mathcal{C}\to F$ をとる。$\Psi$ の全射性から $\Psi[F]=e[X]$ であり、$r$ は全射なので $\Psi\circ r$ は $\mathcal{C}$ から $e[X]$ への連続な全射である。$e$ は埋め込みなので $e^{-1}\colon e[X]\to X$ は連続であり、合成 $e^{-1}\circ\Psi\circ r$ は連続な全射である。

::: hypcheck
- **コンパクト性**：Step 1 で $e$ が埋め込みで像が閉であることに使った。
- **距離化可能性（可分性）**：Step 1 で可算個の座標で埋め込むのに使った。距離化可能でないコンパクトハウスドルフ空間 $X$ でも、$X$ を $[0,1]^{I}$ に埋め込み（\ref{top:page-stone-cech} の議論）、Step 2 と同様に $2^{I\times\N}\to[0,1]^{I}$ の連続な全射をとれば、$X$ は $2^{I\times\N}$ のある閉集合の連続像になる。しかし Step 3 のレトラクトが一般には使えず、$2^{I}$ 全体の連続像になるとは限らない。たとえば非可算離散空間の一点コンパクト化は、交わらない空でない開集合（孤立点）を非可算個もつが、$2^{I}$ の交わらない空でない開集合の族はつねに可算であることが知られている（可算鎖条件）ので、その連続像にはならない（連続な全射による逆像は交わらない空でない開集合を与えるため）。
- **レトラクト**：Step 3 で、$\Psi$ の制限ではなく $\mathcal{C}$ 全体からの全射を得るのに使った。
:::
:::

## ブラウワーの特徴づけ {#top:sec-cs-brouwer}

::: theorem ブラウワーの特徴づけ {#top:brouwer-cantor keywords="Brouwer's theorem: every nonempty perfect totally disconnected compact metrizable space is homeomorphic to the Cantor set" index="ブラウワーの特徴づけ|ぶらうわーのとくちょうづけ"}
空でないコンパクト距離空間 $X$ が完全不連結で孤立点をもたないなら、$X$ はカントール集合と同相である。
:::

::: intuition
空でなく、コンパクトで、ばらばら（つながった部分が一点だけ）で、どの点も孤立していない距離空間は、見かけによらず、すべてカントール集合と同じ形をしている。
:::

::: proof
**Step 1（分割の補題）.** 【主張：$X$ の空でない閉開集合 $U$ と $\varepsilon>0$ について、$U$ は直径 $<\varepsilon$ の空でない閉開集合 $k\ge2$ 個の和に交わりなく分割できる】 \ref{top:totally-disconnected-zero-dim} から $U$ の各点に直径 $<\varepsilon$ の閉開近傍があり（閉開集合と $U$ の共通部分）、$U$ はコンパクトなので有限個 $W_{1},\dots,W_{n}\subseteq U$ で覆われる。$W'_{j}\defeq W_{j}\setminus(W_{1}\cup\cdots\cup W_{j-1})$ とおくと、その空でないものが分割になる。空でないものが 1 個（$k=1$）の場合は、$U$ は空でない開集合で $X$ は孤立点をもたないので $U$ は二点 $a\ne b$ を含み、$a$ を含み $b$ を含まない閉開集合 $W$（\ref{top:totally-disconnected-zero-dim} とハウスドルフ性による）で $U$ を $U\cap W$, $U\setminus W$ に分ければよい（どちらも直径 $\le\operatorname{diam}U<\varepsilon$）。

**Step 2（二進木）.** 【主張：有限の $0,1$ 列 $s$ に空でない閉開集合 $U_{s}$ を、$U_{\emptyset}=X$, $U_{s}=U_{s0}\sqcup U_{s1}$、各無限列 $x$ について $\operatorname{diam}U_{x\restriction n}\to0$ となるように割り当てられる】 有限の $0,1$ 列 $s$ に $X$ の空でない閉開集合 $U_{s}$ を、$U_{\emptyset}=X$, $U_{s}=U_{s0}\sqcup U_{s1}$ となるように割り当て、さらに各無限列 $x$ について $\operatorname{diam}U_{x\restriction n}\to0$ となるようにする。それには、「段階 $k$」で、すでに割り当てた葉 $U_{s}$ のそれぞれを Step 1 で直径 $<2^{-k}$ の $P_{1},\dots,P_{m}$（$m\ge2$）に分け、$U_{s0}\defeq P_{1}$, $U_{s1}\defeq P_{2}\cup\cdots\cup P_{m}$、$m\ge3$ なら $U_{s1}$ をさらに $U_{s10}\defeq P_{2}$, $U_{s11}\defeq P_{3}\cup\cdots\cup P_{m}$ と分け、…と二つずつに分けていき、新しい葉がすべて $P_{j}$ のどれかになるまで続ける。どの無限列 $x$ についても、$U_{x\restriction n}$ は各段階を有限回で通過し、段階 $k$ を通過した後は直径 $<2^{-k}$。

**Step 3（同相写像）.** 【主張：$x\mapsto\bigcap_{n}U_{x\restriction n}$ の唯一の点は、$2^{\N}$ から $X$ への同相写像を与える】 $x\in2^{\N}$ に、$\bigcap_{n}U_{x\restriction n}$ の唯一の点 $h(x)$ を対応させる（空でない閉集合の減少列でコンパクト性から共通部分は空でなく、直径 $\to0$ なので一点）。$h$ は連続である（$\varepsilon>0$ に対し $\operatorname{diam}U_{x\restriction n}<\varepsilon$ となる $n$ をとると、$x$ と最初の $n$ 項で一致する $x'$ について $h(x),h(x')\in U_{x\restriction n}$ なので $d(h(x),h(x'))<\varepsilon$）。また $h$ は単射（$x\ne x'$ が第 $n$ 項で初めて異なれば、$U_{x\restriction(n+1)}$ と $U_{x'\restriction(n+1)}$ は交わらない）、全射（各 $y\in X$ は各段で二つの子のちょうど一方に属し、その列 $x$ について $h(x)=y$）。$2^{\N}$ はコンパクト、$X$ はハウスドルフなので、\ref{top:compact-to-hausdorff} から $h$ は同相写像である。

::: hypcheck
- **完全不連結**：Step 1 で、\ref{top:totally-disconnected-zero-dim} を通じて閉開集合の分割を作るのに使った。
- **孤立点がない**：Step 1 で、どの葉も二つ以上に分けられること（木が本当に二分岐し続けること）に使った。孤立点 $p$ があると、$\{p\}$ は閉開でそれ以上分けられない。
- **コンパクト・距離化可能**：Step 1 の有限被覆と直径、Step 3 の共通部分の空でなさに使った。
:::
:::

## 問題 {#top:sec-cs-problems}

::: problem {#top:prob-cs-not-locally-connected}
カントール集合はどの点でも局所連結でないことを示し、アレクサンドロフ–ハウスドルフの定理の連続な全射 $\mathcal{C}\to[0,1]$ が商写像であることと、\ref{top:quotient-locally-connected} が矛盾しないことを説明せよ。
:::

::: solution
$\mathcal{C}$ は完全不連結なので、連結な部分集合は一点集合（と空集合）だけである。一点集合は開でない（孤立点がない）ので、どの点にも連結な開近傍はなく、どの点でも局所連結でない。\ref{top:quotient-locally-connected} は「局所連結な空間の商は局所連結」であって、逆向き（商が局所連結なら元も局所連結）は主張しない。$\mathcal{C}\to[0,1]$ はコンパクトからハウスドルフへの連続な全射なので商写像である（\ref{top:compact-to-hausdorff}）が、元の $\mathcal{C}$ が局所連結でないので、定理の仮定を満たさず、矛盾はない。
:::

::: problem {#top:prob-cs-rationals}
$\mathbb{Q}\cap[0,1]$ は完全不連結で孤立点をもたないが、カントール集合と同相でないことを示し、ブラウワーの特徴づけでどの仮定が欠けているかを答えよ。
:::

::: solution
$\mathbb{Q}\cap[0,1]$ は可算で、$\mathcal{C}$ は非可算（$2^{\N}$ と全単射）なので同相でない。完全不連結（任意の二点の間に無理数 $c$ があり、$c$ の左右で分けられる）、孤立点なし（有理数は稠密）だが、コンパクトでない（$\mathbb{R}$ で閉でない、たとえば $1/\sqrt{2}$ に収束する有理数列は $\mathbb{Q}\cap[0,1]$ で収束しない）。欠けているのはコンパクト性である。
:::

::: supplement
**前提を変えると.** コンパクト性を外すと、空でなく孤立点をもたない可算距離空間はすべて $\mathbb{Q}$ と同相であること（\ref{top:sierpinski-q}。可算距離空間は自動的に完全不連結である：点 $x$ からの距離の値は可算個なので、その値をとらない $r>0$ をいくらでも小さくとれ、球 $\{y:d(x,y)<r\}$ は閉開になる）や、空でない零次元のポーランド空間で、すべてのコンパクト部分集合の内部が空であるものは $\N^{\N}$ と同相であること（\ref{top:alexandrov-urysohn-nn}）が成り立つ。とくに無理数全体は $\N^{\N}$ と同相である（\ref{top:irrationals-nn}）。

**似た定理.** ハーン–マズルキェヴィチの定理は、空でないコンパクト距離空間が $[0,1]$ の連続像であるための必要十分条件は、連結かつ局所連結であることだと述べる（範囲外）。十分性の標準的な証明の一つはアレクサンドロフ–ハウスドルフの定理を使う：$\mathcal{C}\subseteq[0,1]$ とみて全射 $g\colon\mathcal{C}\to X$ をとり、$[0,1]\setminus\mathcal{C}$ の各区間の上では、両端の像を結ぶ道で $g$ を延長する。延長が連続になるには、近い 2 点を直径の小さい道で結べること（連結かつ局所連結なコンパクト距離空間の性質）が要る。ペアノ曲線（\ref{top:peano-curve}）は $X=[0,1]^{2}$ の場合にあたる。記述集合論では、$2^{\N}$ と $\N^{\N}$ が基本的な空間として使われ、空でないポーランド空間はすべて $\N^{\N}$ の連続像である（\see{top:polish-image-of-nn}）。

**高い視点から：カントール集合は「すべての可能な二択の木」.** $2^{\N}$ の点は「左か右か」の選択の無限列であり、カントール集合はその選択の全体を幾何学的に描いたものである。コンパクト距離空間はどれも、有限の精度で見れば有限個の小片に分けられ、精度を上げるたびに小片をさらに分けることで「二択の木」で番地付けできる。アレクサンドロフ–ハウスドルフの定理はこの番地付けが連続な全射として実現できることを、ブラウワーの特徴づけは、分け方が常に二つ以上に分かれ続け、ばらばらな空間なら番地付けがちょうど一対一になることを言っている。比喩で言えば、カントール集合は「住所録の雛形」で、どんなコンパクト距離空間の住所録もその雛形から作れる。
