# ブール代数とストーンの表現定理 {#top:page-stone-duality keywords="Stone representation theorem, Stone space, Boolean space, ultrafilters of a Boolean algebra, clopen algebra, field of sets, Stone duality, zero-dimensional compact Hausdorff space"}

有限集合の部分集合全体はブール代数である。逆に、すべてのブール代数は、ある集合の部分集合からなるブール代数（**集合体**）と同型である——これが**ストーンの表現定理**（\tref{top:stone-representation}）である。表現に使う集合は、ブール代数の超フィルター全体 $S(\mathbb{B})$ で、これには自然な位相が入り、コンパクトハウスドルフで開かつ閉な集合の基をもつ空間（**ストーン空間**）になる（\ref{top:stone-space-of-ba}）。$\mathbb{B}$ は $S(\mathbb{B})$ の開かつ閉な集合の全体として復元され、逆にストーン空間は開かつ閉な集合のブール代数から復元される（\ref{top:stone-space-recovered}）。この往復は、ブール代数の圏とストーン空間の圏の反変な圏同値（**ストーン双対性**、\ref{top:stone-duality}）を与える。

> 資料：内田『集合と位相』、小山『位相空間論』にはこの話題の扱いがないため、標準的な構成を本サイトで組み立てた。

## 記法と定義の確認 {#top:sec-sd-notation}

::: notation
- ブール代数 $\mathbb{B}$（$\mathbf{0}\neq\mathbf{1}$ を仮定する）、補元 $-a$、その基本性質は \ref{set:boolean-algebra}, \ref{set:boolean-algebra-basic} のとおり。フィルター・超フィルターは \ref{set:boolean-ccc-filter}、その性質（上に閉じ $\wedge$ で閉じる、超フィルター $U$ は各 $b$ について $b$ と $-b$ のちょうど一方を含む）は \ref{set:boolean-filter-basic}、超フィルターの存在（\term[有限交叉性]{set:boolean-ultrafilter}をもつ集合は超フィルターに含まれる。$\mathrm{AC}$ を使う）は \ref{set:boolean-ultrafilter} のとおり。
- ブール代数の**準同型**は、$\wedge$, $\vee$, $-$, $\mathbf{0}$, $\mathbf{1}$ を保つ写像。全単射な準同型を**同型**という。
- 位相空間 $X$ の開かつ閉な集合（**閉開集合**）全体を $\mathrm{Clop}(X)$ と書く。これは $\cap$, $\cup$, 補集合で閉じ、$X\neq\varnothing$ ならブール代数である。
- コンパクト、ハウスドルフ、コンパクトからハウスドルフへの連続な全単射は同相（\ref{top:compact}, \ref{top:hausdorff}, \ref{top:compact-to-hausdorff}）。閉集合族の有限交叉性による特徴づけは \ref{top:compact-equivalents}。
- 体系は $\ZFC$（選択公理を使う箇所は明記する）。
:::

## ストーン空間 {#top:sec-sd-stone-space}

::: definition ストーン空間 {#top:stone-space keywords="Stone space, Boolean space, zero-dimensional compact Hausdorff space" index="ストーン空間|すとーんくうかん, 閉開集合|へいかいしゅうごう, 零次元|れいじげん"}
コンパクトハウスドルフ空間で、閉開集合全体が開基をなすもの（**零次元**）を**ストーン空間**という。
:::

::: intuition
ストーン空間とは、コンパクトでハウスドルフで、しかも「開かつ閉な集合」だけで点を細かく切り分けられる空間のことである。つながった部分をもたない、ばらばらなコンパクト空間と思えばよい。
:::

::: example
1. 有限離散空間、カントール集合 $2^{\mathbb{N}}$（\ref{top:product-topology} の積位相）はストーン空間である。$2^{\mathbb{N}}$ については、コンパクト性は \ref{top:tychonoff} から、ハウスドルフ性はハウスドルフ空間の\term[直積]{top:product-topology}であることから従い、最初の $n$ 座標を指定して得られる集合（筒集合）は、補集合が有限個の筒集合の和なので閉開で、直積位相の開基をなす。
2. $[0,1]$ はコンパクトハウスドルフだが、閉開集合は $\varnothing$ と全体だけ（連結、\ref{top:connected}）なのでストーン空間でない。
:::

::: definition ブール代数のストーン空間 {#top:stone-space-of-ba-def keywords="space of ultrafilters of a Boolean algebra, basic clopen sets [b]" index="超フィルターの空間|ちょうふぃるたーのくうかん"}
ブール代数 $\mathbb{B}$ の超フィルター全体を $S(\mathbb{B})$ とし、$b\in\mathbb{B}$ について $[b]\defeq\{U\in S(\mathbb{B}):b\in U\}$ とおく。
:::

::: intuition
ブール代数の各元 $b$ を、「$b$ を含む超フィルター全体」という集合 $[b]$ に置き換える。元を集合に変えることで、ブール代数の演算を集合の演算として見られるようにする。
:::

::: lemma 基本集合の演算 {#top:stone-basic-sets keywords="b -> [b] preserves meets, joins and complements" index="ストーン写像|すとーんしゃぞう"}
$[b\wedge c]=[b]\cap[c]$、$[b\vee c]=[b]\cup[c]$、$[-b]=S(\mathbb{B})\setminus[b]$、$[\mathbf{0}]=\varnothing$、$[\mathbf{1}]=S(\mathbb{B})$。さらに（$\mathrm{AC}$）$b\neq\mathbf{0}$ なら $[b]\neq\varnothing$。
:::

::: proof
超フィルター $U$ について示す。

**Step 1（交わり）.** $b\wedge c\in U$ なら、$b\wedge c\le b$, $b\wedge c\le c$ で $U$ は上に閉じているので $b,c\in U$ である。逆に $b,c\in U$ なら $b\wedge c\in U$ である（\ref{set:boolean-filter-basic.2}）。

**Step 2（補元・$\mathbf{0}$・$\mathbf{1}$）.** \ref{set:boolean-filter-basic.3} から、$-b\in U$ と $b\notin U$ は同値である。$U\subseteq\mathbb{B}^{+}$ なので $\mathbf{0}\notin U$ である。$U\neq\varnothing$ で上に閉じているので $\mathbf{1}\in U$ である。

**Step 3（結び）.** $b\in U$ なら、$b\le b\vee c$ から $b\vee c\in U$ である（$c\in U$ の場合も同様）。逆に $b\vee c\in U$ かつ $b\notin U$ と仮定する。Step 2 から $-b\in U$ であり、Step 1 から $(b\vee c)\wedge-b\in U$ である。分配律から次が成り立つ：
$$
(b\vee c)\wedge-b=(b\wedge-b)\vee(c\wedge-b)=c\wedge-b\le c.
$$
$U$ は上に閉じているので、$c\in U$ である。

**Step 4（空でないこと）.** $b\neq\mathbf{0}$ なら $\{b\}$ は\term[有限交叉性]{set:boolean-ultrafilter}をもつので、$b$ を含む超フィルターがある（\ref{set:boolean-ultrafilter}）。

::: hypcheck
- **分配律**：Step 3 で使った。分配束でない束では「結びに属するなら片方に属する」は成り立たない。例：$\mathbf{0}<a,b,c<\mathbf{1}$ で $a,b,c$ のどの 2 つも交わりが $\mathbf{0}$、結びが $\mathbf{1}$ となる 5 元の束 $M_{3}$ では、$F\defeq\{a,\mathbf{1}\}$ は $\mathbf{0}$ を含まない極大なフィルターである（$a$ 以外の元 $b$ または $c$ を加えると交わり $\mathbf{0}$ を含む）が、$b\vee c=\mathbf{1}\in F$ なのに $b,c\notin F$ である。
- **選択公理**：Step 4 の超フィルターの存在だけに使った（ブール素イデアル定理と呼ばれる、$\mathrm{AC}$ より真に弱い原理で足りることが知られている）。
:::
:::

::: theorem ストーン空間であること {#top:stone-space-of-ba keywords="the ultrafilter space of a Boolean algebra is a Stone space; clopen sets are exactly the [b]" index="ストーン空間の構成|すとーんくうかんのこうせい"}
（$\mathrm{AC}$）$\{[b]:b\in\mathbb{B}\}$ を開基とする位相で、$S(\mathbb{B})$ はストーン空間であり、その閉開集合はちょうど $[b]$（$b\in\mathbb{B}$）の形の集合である。
:::

::: intuition
ブール代数の超フィルター全体に、集合 $[b]$ を基本の開集合とする位相を入れると、コンパクトでハウスドルフなばらばらの空間（ストーン空間）になる。しかも、その空間の開かつ閉な集合は、もとのブール代数の元から来る $[b]$ だけである。
:::

::: proof
**Step 1.** 【主張：$\{[b]:b\in\mathbb{B}\}$ はある位相の開基になる】 \ref{top:stone-basic-sets} から、$\{[b]\}$ は $S(\mathbb{B})=[\mathbf{1}]$ を覆い、$[b]\cap[c]=[b\wedge c]$ なので交わりで閉じる。よって \ref{top:base-criterion} から開基になる。

**Step 2（零次元）.** 【主張：各 $[b]$ は閉開集合で、閉開集合全体は開基をなす】 \ref{top:stone-basic-sets} から $[b]$ の補集合は $[-b]$ であり、これは開なので、$[b]$ は閉開集合である。開基 $\{[b]\}$ が閉開集合からなるので、閉開集合全体も開基をなす。

**Step 3（ハウスドルフ）.** 【主張：$U\neq V$ なら、$U\in[b]$, $V\in[-b]$ となる $b$ があり、$[b]\cap[-b]=\varnothing$】 $U\neq V$ とする。$U\subseteq V$ なら $U$ の極大性から $U=V$ となるので、$U\not\subseteq V$ であり、$b\in U\setminus V$ がとれる。$b\notin V$ なので \ref{set:boolean-filter-basic.3} から $-b\in V$ である。よって $U\in[b]$, $V\in[-b]$ であり、$[b]\cap[-b]=[b\wedge-b]=[\mathbf{0}]=\varnothing$ なので、$U$ と $V$ は交わらない開集合で分離される。

**Step 4（コンパクト）.** 【主張：開基の元からなる $S(\mathbb{B})$ の被覆 $\{[b_{i}]\}_{i\in I}$ は有限部分被覆をもつ】 開基の元による被覆について示せば十分である（任意の開被覆の各開集合を開基の元の和に分け、得られた被覆の有限部分被覆の各元をそれを含む元の開集合で置き換えればよい）。$\{[b_{i}]\}_{i\in I}$ が $S(\mathbb{B})$ を覆い、有限部分被覆をもたないと仮定する。任意の有限個 $i_{1},\dots,i_{n}$ について $[b_{i_{1}}]\cup\cdots\cup[b_{i_{n}}]\neq S(\mathbb{B})$ なので、補集合をとると \ref{top:stone-basic-sets} から次が成り立つ：
$$
[-b_{i_{1}}\wedge\cdots\wedge-b_{i_{n}}]=S(\mathbb{B})\setminus\bigl([b_{i_{1}}]\cup\cdots\cup[b_{i_{n}}]\bigr)\neq\varnothing.
$$
$[\mathbf{0}]=\varnothing$ なので、とくに $-b_{i_{1}}\wedge\cdots\wedge-b_{i_{n}}\neq\mathbf{0}$ である。よって $\{-b_{i}\}$ は\term[有限交叉性]{set:boolean-ultrafilter}をもち、それを含む超フィルター $U$ がある（\ref{set:boolean-ultrafilter}）。各 $i$ について $-b_{i}\in U$ なので $b_{i}\notin U$ であり（\ref{set:boolean-filter-basic.3}）、$U$ はどの $[b_{i}]$ にも属さない。これは被覆であることに反する。

**Step 5（閉開集合の形）.** 【主張：閉開集合 $C$ は、ある $c\in\mathbb{B}$ について $C=[c]$ と書ける】 $C$ を閉開集合とする。$C$ は開なので、開基の元の和 $C=\bigcup_{j}[c_{j}]$ と書ける。$C$ は閉なので、コンパクト空間の閉集合としてコンパクトであり、有限個で覆える。よって \ref{top:stone-basic-sets} から $C=[c_{1}]\cup\cdots\cup[c_{m}]=[c_{1}\vee\cdots\vee c_{m}]$ である。逆に各 $[b]$ が閉開であることは Step 2 で示した。

::: hypcheck
- **超フィルターの極大性**：Step 3（$b\in U\setminus V$ の存在）と、$[-b]$ が補集合であること（\ref{set:boolean-filter-basic.3}）に使った。
- **選択公理**：Step 4（有限交叉性から超フィルター）に使った。
- **コンパクト性**：Step 5 で、閉開集合が有限個の基本集合の和であることに使った。
:::
:::

## ストーンの表現定理 {#top:sec-sd-representation}

::: theorem ストーンの表現定理 {#top:stone-representation keywords="Stone representation theorem: every Boolean algebra is isomorphic to a field of sets" index="ストーンの表現定理|すとーんのひょうげんていり, 集合体|しゅうごうたい" refname="ストーンの表現定理"}
（$\mathrm{AC}$）$b\mapsto[b]$ は、ブール代数の同型 $\mathbb{B}\cong\mathrm{Clop}(S(\mathbb{B}))$ である。とくに、すべてのブール代数は、ある集合の部分集合からなり $\cap,\cup$, 補集合で閉じたブール代数（**集合体**）と同型である。
:::

::: intuition
どんなブール代数も、ある集合の部分集合の集まりで、交わり・和・補集合をとる演算を考えたものと同じである。抽象的なブール代数の計算は、いつでも集合の計算に置き換えられる。
:::

::: proof
**Step 1.** 【主張：$b\mapsto[b]$ は $\mathbb{B}$ から $\mathrm{Clop}(S(\mathbb{B}))$ への準同型】 \ref{top:stone-space-of-ba} から各 $[b]$ は閉開集合であり、\ref{top:stone-basic-sets} の等式は、この写像が $\wedge,\vee,-,\mathbf{0},\mathbf{1}$ を保つことそのものである。

**Step 2.** 【主張：$b\neq c$ なら $[b]\neq[c]$】 $b\neq c$ とする。$b\wedge-c=\mathbf{0}$ かつ $c\wedge-b=\mathbf{0}$ と仮定すると、\ref{set:boolean-algebra-basic.2} から $b\le-(-c)=c$ かつ $c\le b$ となり（$-(-c)=c$ は補元の一意性 \ref{set:boolean-algebra-basic.1} による）、$b=c$ となって矛盾する。よって、たとえば $b\wedge-c\neq\mathbf{0}$ であり（他方の場合は $b$ と $c$ を入れ替える）、\ref{top:stone-basic-sets} から $[b]\setminus[c]=[b\wedge-c]\neq\varnothing$ である。ゆえに $[b]\neq[c]$ である。

**Step 3.** 【主張：$\mathrm{Clop}(S(\mathbb{B}))$ のすべての元は $[b]$ の形】 これは \ref{top:stone-space-of-ba} の後半（閉開集合の形）そのものである。

::: hypcheck
- **選択公理**：Step 2 の $[b\wedge-c]\neq\varnothing$（超フィルターの存在）に使った。これがないと、超フィルターが少なすぎて異なる元を区別できない可能性がある。
:::
:::

::: theorem ストーン空間の復元 {#top:stone-space-recovered keywords="a Stone space is homeomorphic to the ultrafilter space of its clopen algebra" index="ストーン空間の復元|すとーんくうかんのふくげん"}
空でないストーン空間 $X$ について、$x\mapsto U_{x}\defeq\{C\in\mathrm{Clop}(X):x\in C\}$ は同相写像 $X\to S(\mathrm{Clop}(X))$ である。
:::

::: intuition
ストーン空間の点は、「その点を含む開かつ閉な集合の全体」で完全に決まり、逆にそうした集合の一貫した選び方はどれも、ちょうど一つの点から来る。だから、空間は開かつ閉な集合のブール代数だけから組み立て直せる。
:::

::: proof
**Step 1.** 【主張：$U_{x}$ は $\mathrm{Clop}(X)$ の超フィルター】 $X\in U_{x}$ なので $U_{x}$ は空でない。$U_{x}$ は $\varnothing$ を含まず、上に閉じ、$\cap$ で閉じるので、\ref{set:boolean-filter-basic.2} からフィルターである。各 $C$ について、$x\in C$ と $x\in X\setminus C$ のちょうど一方が成り立つ。この性質をもつ空でないフィルターは超フィルターである。実際、真に大きいフィルター $V$ があったとすると、$C\in V\setminus U_{x}$ について $X\setminus C\in U_{x}\subseteq V$ となり、$\varnothing=C\cap(X\setminus C)\in V$ となって矛盾する。

**Step 2.** 【主張：$x\neq y$ なら $U_{x}\neq U_{y}$】 $x\neq y$ とする。ハウスドルフなので $y$ を含まない $x$ の開近傍があり、閉開集合が開基なので、その中に $x\in C$ となる閉開集合 $C$ がある。よって $C\in U_{x}\setminus U_{y}$ であり、$U_{x}\neq U_{y}$ である。

**Step 3.** 【主張：$S(\mathrm{Clop}(X))$ の各元 $V$ は、ある $x$ について $V=U_{x}$】 $V\in S(\mathrm{Clop}(X))$ とする。$V$ は閉集合の族で、$\cap$ で閉じ $\varnothing$ を含まないので有限交叉性をもつ。よってコンパクト性から $\bigcap V\neq\varnothing$ である（\ref{top:compact-equivalents}）。$x\in\bigcap V$ をとると $V\subseteq U_{x}$ であり、$V$ の極大性から $V=U_{x}$ である。

**Step 4.** 【主張：$x\mapsto U_{x}$ は同相写像】 基本集合 $[C]$ の逆像は $\{x:C\in U_{x}\}=C$ で開なので、この写像は連続である。$X$ はコンパクト、$S(\mathrm{Clop}(X))$ はハウスドルフ（\ref{top:stone-space-of-ba}）なので、連続な全単射は同相（\ref{top:compact-to-hausdorff}）。

::: hypcheck
- **零次元性**：Step 2 で、点を閉開集合で分けるのに使った。$[0,1]$ では $\mathrm{Clop}=\{\varnothing,[0,1]\}$ で、$S(\mathrm{Clop})$ は一点になる。
- **コンパクト性**：Step 3（超フィルターに対応する点の存在）と Step 4 に使った。
- **選択公理は使っていない**：\ref{top:stone-space-of-ba} のハウスドルフ性（Step 4 で使う）は選択公理なしで示されている。
:::
:::

::: theorem ストーン双対性 {#top:stone-duality keywords="Stone duality: the category of Boolean algebras is dually equivalent to the category of Stone spaces" index="ストーン双対性|すとーんそうついせい"}
（$\mathrm{AC}$）ブール代数と準同型の圏 $\mathbf{Bool}$ と、空でないストーン空間と連続写像の圏 $\mathbf{Stone}$ について、$\mathbf{Bool}^{\mathrm{op}}$ と $\mathbf{Stone}$ は圏同値である。関手は
$$
\begin{aligned}
S&\colon\mathbf{Bool}^{\mathrm{op}}\to\mathbf{Stone},\ \ S(f)(U)\defeq f^{-1}(U),\\
\mathrm{Clop}&\colon\mathbf{Stone}\to\mathbf{Bool}^{\mathrm{op}},\ \ \mathrm{Clop}(g)(C)\defeq g^{-1}(C).
\end{aligned}
$$
:::

::: intuition
ブール代数とストーン空間は、同じものを代数の言葉と空間の言葉で書いたものである。ブール代数の準同型は、向きを逆にしたストーン空間の連続写像とちょうど対応する。
:::

::: proof
**Step 1.** 【主張：$S$ は $\mathbf{Bool}^{\mathrm{op}}$ から $\mathbf{Stone}$ への関手】 \ref{top:stone-space-of-ba} から $S(\mathbb{B})$ はストーン空間であり、$\mathbf{0}\neq\mathbf{1}$ と \ref{set:boolean-ultrafilter} から空でない。準同型 $f\colon\mathbb{A}\to\mathbb{B}$ と $U\in S(\mathbb{B})$ について、$f^{-1}(U)$ は超フィルターである：$\mathbf{0}\notin f^{-1}(U)$（$f\mathbf{0}=\mathbf{0}$）、上に閉じる（$a\le a'$ なら $fa\le fa'$）、$\wedge$ で閉じる、各 $a$ について $fa$ と $f(-a)=-fa$ のちょうど一方が $U$ に入る（\ref{top:stone-space-recovered} の Step 1 と同じ理由で超フィルター）。連続性：$S(f)^{-1}([a])=\{U:fa\in U\}=[fa]$ は開。恒等射と合成を保つことは逆像の性質。

**Step 2.** 【主張：$\mathrm{Clop}$ は $\mathbf{Stone}$ から $\mathbf{Bool}^{\mathrm{op}}$ への関手】 空でない $X$ について $\mathrm{Clop}(X)$ は $\varnothing\neq X$ をもつブール代数である。連続写像の逆像は閉開集合を閉開集合に移し、$\cap,\cup$, 補集合を保つので準同型。

**Step 3.** 【主張：$\sigma_{\mathbb{B}}\colon b\mapsto[b]$ と $\tau_{X}\colon x\mapsto U_{x}$ は自然同型】 $\sigma_{\mathbb{B}}\colon\mathbb{B}\to\mathrm{Clop}(S(\mathbb{B}))$, $b\mapsto[b]$ は同型（\ref{top:stone-representation}）。自然性：$f\colon\mathbb{A}\to\mathbb{B}$ について $\mathrm{Clop}(S(f))([a])=S(f)^{-1}([a])=[fa]=\sigma_{\mathbb{B}}(fa)$。$\tau_{X}\colon X\to S(\mathrm{Clop}(X))$, $x\mapsto U_{x}$ は同相（\ref{top:stone-space-recovered}）。自然性：$g\colon X\to Y$ について $S(\mathrm{Clop}(g))(U_{x})=\{C:g^{-1}(C)\in U_{x}\}=\{C:gx\in C\}=U_{gx}$。

よって $\mathrm{Clop}\circ S\cong1$, $S\circ\mathrm{Clop}\cong1$ であり、\ref{cat:equivalence-of-categories} から圏同値である。

::: hypcheck
- **選択公理**：Step 1 で $S(\mathbb{B})$ が空でないこと、Step 3 で $\sigma_{\mathbb{B}}$ が同型であること（\ref{top:stone-representation}）に使った。$\tau_{X}$ の側は選択公理を使わない。
- **空でないこと**：$\mathbf{0}\neq\mathbf{1}$ の約束と、$\mathbf{Stone}$ を空でない空間に限ることが対応している（空の空間の閉開集合は一元しかなく、$\mathbf{0}\neq\mathbf{1}$ のブール代数にならない）。
:::
:::

::: supplement
**一般化.** 分配束とスペクトル空間・プリーストリー空間の双対性、可換 C* 環とコンパクトハウスドルフ空間の双対性（ゲルファント–ナイマルク）など、「代数の圏」と「空間の圏」の反変な同値は数多く知られており、ストーン双対性はその原型とされる。

**前提を変えると.** 選択公理（の弱い形）を外すと、超フィルターをもたない（あるいは少ない）ブール代数がありうるため、表現定理は証明できない。「すべてのブール代数は集合体と同型である」という形の表現定理は、ブール素イデアル定理と（$\ZF$ 上で）同値であることが知られている（範囲外）。

**類似の定理.** 命題論理の完全性定理（\ref{logic:page-prop-completeness}）は、\term[論理式]{logic:prop-formula}を\term[証明可能]{logic:prop-deduction}な同値で割ったリンデンバウム代数（ブール代数）の超フィルターが「付値」に当たることから、表現定理とほぼ同じ内容になる：導けない論理式 $\varphi$ について $-[\varphi]\neq\mathbf{0}$ を含む超フィルターが、$\varphi$ を偽にする付値を与える。また、離散空間 $X$ のストーン–チェックのコンパクト化（\ref{top:page-stone-cech}）は、冪集合のブール代数 $\mathcal{P}(X)$ のストーン空間 $S(\mathcal{P}(X))$（$X$ 上の超フィルター全体）として作れる。

**高い視点から：点は超フィルター.** ストーン双対性は、「空間の点」を「閉開集合のどれに属するかの一貫した判断」（超フィルター）で置き換えられることを言う。比喩で言えば、ブール代数は「はい／いいえで答えられる質問の体系」、超フィルターは「すべての質問への矛盾のない回答表」で、ストーン空間は「回答表の全体」である。圏論的には、二元ブール代数 $\mathbf{2}$ と二点離散空間 $2$ が両方の圏に住む「双対化対象」で、$S(\mathbb{B})\cong\mathbf{Bool}(\mathbb{B},\mathbf{2})$（超フィルター $U$ は特性関数 $\mathbb{B}\to\mathbf{2}$）、$\mathrm{Clop}(X)\cong\mathbf{Stone}(X,2)$ と書ける。
:::

## 問題 {#top:sec-sd-problems}

::: problem {#top:prob-sd-finite}
有限ブール代数は、ある有限集合の冪集合と同型であることを示せ。とくに元の個数は $2^{n}$ の形である。
:::

::: solution
有限ブール代数 $\mathbb{B}$ について、$S(\mathbb{B})\subseteq\mathcal{P}(\mathbb{B})$ は有限である。有限なハウスドルフ空間では一点集合が閉なので、すべての部分集合が有限個の閉集合の和として閉であり、空間は離散である。よって $S(\mathbb{B})$ の閉開集合はすべての部分集合であり、表現定理から $\mathbb{B}\cong\mathcal{P}(S(\mathbb{B}))$ である。$n\defeq\lvert S(\mathbb{B})\rvert$ とおくと、元の個数は $2^{n}$ である。（有限の場合、超フィルターの存在には選択公理は要らない：$b\neq\mathbf{0}$ について、$b$ 以下の非零元のうち極小なもの $a$（原子）をとる（有限なのでとれる）。各 $c$ について $a\wedge c\le a$ は $a$ か $\mathbf{0}$ であり、前者なら $a\le c$、後者なら $a\le-c$ である（\ref{set:boolean-algebra-basic.2}）。よって $\{c:a\le c\}$ はフィルターで、各 $c$ について $c$ と $-c$ の一方を含むので超フィルターであり、$b$ を含む。）
:::

::: problem {#top:prob-sd-cantor}
有限集合と補有限集合からなる $\mathbb{N}$ の部分集合のブール代数 $\mathbb{F}$ のストーン空間は、$\mathbb{N}$ の一点コンパクト化（\ref{top:one-point-compactification}）と同相であることを示せ。
:::

::: solution
$\mathbb{F}$ の超フィルターは、各 $n$ についての単項超フィルター $U_{n}=\{A:n\in A\}$ と、補有限集合全体 $U_{\infty}$ だけである（超フィルター $U$ が有限集合 $A$ を含めば、$A$ のある一点 $\{n\}$ を含み（$A=\bigcup_{n\in A}\{n\}$ と \ref{top:stone-basic-sets} の結び）$U=U_{n}$。有限集合を含まなければ補有限集合をすべて含み $U=U_{\infty}$）。基本集合 $[\{n\}]=\{U_{n}\}$ は開なので $U_{n}$ は孤立点、$U_{\infty}$ の基本近傍は $[A]$（$A$ 補有限）$=\{U_{\infty}\}\cup\{U_{n}:n\in A\}$。逆に $U_{n}$ は相異なり、$U_{\infty}$ も（どの有限集合も含まない）超フィルターである。よって $n\mapsto U_{n}$, $\infty\mapsto U_{\infty}$ は $\mathbb{N}\cup\{\infty\}$ から $S(\mathbb{F})$ への全単射であり、$\infty$ の基本近傍（補有限集合と $\infty$ の和。$\mathbb{N}$ のコンパクト集合は有限集合なので）と孤立点 $\{n\}$ を、それぞれ $[A]$ と $[\{n\}]$ に移す。ゆえにこの全単射は一点コンパクト化 $\mathbb{N}\cup\{\infty\}$ からの同相写像である。
:::
