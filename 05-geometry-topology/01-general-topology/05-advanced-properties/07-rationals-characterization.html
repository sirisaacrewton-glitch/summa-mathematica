# 有理数の位相的特徴づけ {#top:page-rationals-characterization keywords="Sierpinski's theorem: every countable metrizable space without isolated points is homeomorphic to Q, zero-dimensional countable metric spaces, clopen partitions, lexicographic order, Cantor's back-and-forth theorem"}

有理数全体 $\mathbb{Q}$ は、可算・距離化可能・孤立点がない、という三つの性質で位相的に特徴づけられる（**シェルピンスキーの定理**、\tref{top:sierpinski-q}）。たとえば $\mathbb{Q}\times\mathbb{Q}$ や $\mathbb{Q}$ の中のカントール集合の有理点なども、すべて $\mathbb{Q}$ と同相である。証明は、空間を細かい開かつ閉な集合（**閉開集合**）に入れ子に分割していき（\ref{top:clopen-partitions}）、その分割に沿った辞書式順序で空間を**端点のない可算な稠密線形順序**にし（\ref{top:partition-order}）、その順序位相がもとの位相と一致することを示して、\ref{model:cantor-dlo}で $\mathbb{Q}$ と順序同型にする、という流れで行う。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論の一つに従って組み立てた。

## 記法と定義の確認 {#top:sec-sq-notation}

::: notation
- $(X,d)$ は距離空間、$\mathrm{diam}\,A\defeq\sup\{d(x,y):x,y\in A\}$。開かつ閉な集合を**閉開集合**という。
- 順序位相とその開基は \ref{top:order-topology}, \ref{top:order-topology-base}。$(\mathbb{Q},<)$ の順序位相は通常の位相（距離位相）と一致する（有理数 $a<b$ の開区間 $(a,b)$ は中心 $(a+b)/2$・半径 $(b-a)/2$ の開球であり、逆に $q$ を中心とする半径 $\varepsilon$ の開球は、有理数 $a\in(q-\varepsilon,q)$, $b\in(q,q+\varepsilon)$ をとると $q\in(a,b)$ となる開区間 $(a,b)$ を含む。開半直線も同様）。順序同型 $h$ は開区間・開半直線を開区間・開半直線に移し、$h^{-1}$ も同様なので、$h$ は順序位相の同相写像である。
- カントールの定理：端点のない可算な稠密線形順序は $(\mathbb{Q},<)$ と順序同型（\ref{model:cantor-dlo}）。
:::

## 閉開集合の入れ子の分割 {#top:sec-sq-partitions}

::: lemma 可算距離空間の閉開基 {#top:countable-metric-clopen keywords="a countable metric space has a base of clopen balls" index="可算距離空間の閉開基|かさんきょりくうかんのへいかいき"}
可算な距離空間 $X$ の各点 $x$ と $r>0$ について、閉開集合 $C$ で $x\in C\subseteq\{y:d(x,y)<r\}$ となるものがある。
:::

::: proof
$\{d(x,y):y\in X\}$ は可算で区間 $(0,r)$ は非可算なので、それに属さない $r'\in(0,r)$ がある。$C\defeq\{y:d(x,y)<r'\}$ とおく。$x$ からの距離がちょうど $r'$ の点はないので $C=\{y:d(x,y)\le r'\}$ であり、$C$ は開球として開、閉球として閉である。ゆえに $C$ は閉開集合で、$x\in C\subseteq\{y:d(x,y)<r\}$ である。
:::

::: lemma 閉開集合の入れ子の分割 {#top:clopen-partitions keywords="refining sequence of countable clopen partitions with mesh tending to 0, each piece split into at least three, chosen point placed in a middle piece" index="閉開集合の分割|へいかいしゅうごうのぶんかつ"}
$X$ を孤立点のない可算な距離空間（空でない）とし、$X$ の点を $x_{0},x_{1},\ldots$ と並べる（重複可、各点が無限回現れるように）。次を満たす分割の列 $\mathcal{P}_{0}=\{X\},\mathcal{P}_{1},\ldots$ と、各分割の元の子への線形順序がある。
1. $\mathcal{P}_{n+1}$ の元は $\mathcal{P}_{n}$ のある元（**親**）に含まれる空でない閉開集合で、各 $A\in\mathcal{P}_{n}$ は $\mathcal{P}_{n+1}$ の自分の**子**（可算個、$3$ 個以上）の和である。子には順序型が有限か $\omega$ の線形順序が与えられている。
2. $\mathcal{P}_{n+1}$ の元の直径は $1/(n+1)$ 未満。
3. $x_{n}$ を含む $\mathcal{P}_{n+1}$ の元は、親の子の中で**最初でも最後でもない**。
:::

::: proof
$\mathcal{P}_{n}$ まで作ったとして、$A\in\mathcal{P}_{n}$ を分割する。空でない開集合は無限集合である（有限な開集合 $A$ の点 $a$ について、距離空間では有限集合は閉なので $\{a\}=A\setminus(A\setminus\{a\})$ が開になり、$a$ が孤立点になる）。ゆえに空でない閉開集合 $A$ は無限集合である。$A$ の点を $a_{0},a_{1},\ldots$ と並べる。各 $j$ について、$A$ は開なので、$a_{j}$ を中心とする半径 $\rho_{j}$ の開球が $A$ に含まれるような $\rho_{j}<1/(2(n+1))$ がある。\ref{top:countable-metric-clopen} で閉開集合 $C_{j}$ を $a_{j}$ と、その開球の間にとる。このとき $C_{j}\subseteq A$ であり、$C_{j}$ の二点はどちらも $a_{j}$ からの距離が $\rho_{j}$ 未満なので $\mathrm{diam}\,C_{j}\le2\rho_{j}<1/(n+1)$ である。$D_{j}\defeq C_{j}\setminus\bigcup_{i<j}C_{i}$ とおくと、閉開集合の有限個の和と差なので $D_{j}$ は閉開であり、$D_{j}$ どうしは交わらず、$a_{j}\in\bigcup_{i\le j}D_{i}$ なので $\bigcup_{j}D_{j}=A$ である。ゆえに空でない $D_{j}$ を添字の順に並べると、$A$ の閉開集合による可算個の分割が得られ、その順序型は有限か $\omega$ である。

個数が $3$ 未満の場合は、ある元 $D$ を二つの空でない閉開集合に分けることを、個数が $3$ になるまで繰り返す。分け方は次のとおりである：$D$ は空でない閉開集合なので上と同じ理由で無限集合であり、相異なる二点 $u,v$ をもつ。\ref{top:countable-metric-clopen} で $u\in E\subseteq\{y:d(u,y)<d(u,v)\}$ となる閉開集合 $E$ をとり、$D$ を $E\cap D$ と $D\setminus E$ に分ける。どちらも閉開で、$u\in E\cap D$, $v\in D\setminus E$ なので空でなく、直径は $D$ の直径以下である。こうして $3$ 個以上の子を得て、1 と 2 が成り立つ。

$x_{n}\in A$ の場合は、$x_{n}$ を含む子を二番目に移す（順序型は変わらない）。子は $3$ 個以上あるので、二番目の子は最初の子でも最後の子でもない。ゆえに 3 も成り立つ。
:::

## 辞書式順序 {#top:sec-sq-order}

各 $x\in X$ と $n$ について、$x$ を含む $\mathcal{P}_{n}$ の元を $A_{n}(x)$ と書く。$x\ne y$ とする。すべての $n\ge1$ で $A_{n}(x)=A_{n}(y)$ なら、$\mathrm{diam}\,A_{n}(x)<1/n$ から $d(x,y)<1/n$ がすべての $n$ で成り立ち、$x=y$ となって矛盾する。ゆえに $A_{n}(x)\ne A_{n}(y)$ となる最小の $n\ge1$ があり（これを $x,y$ が**初めて分かれる段**という）、$A_{n-1}(x)=A_{n-1}(y)$（$A_{0}(x)=X$）なので、$A_{n}(x)$, $A_{n}(y)$ は同じ親の異なる子である。その子の順序で $A_{n}(x)$ が先のとき $x\prec y$ と定める。

::: lemma 分割による順序 {#top:partition-order keywords="the lexicographic order along the partitions is a countable dense linear order without endpoints whose order topology is the metric topology" index="分割による順序|ぶんかつによるじゅんじょ"}
$\prec$ は $X$ 上の線形順序で、端点がなく\term[稠密]{model:dlo}で、その順序位相は $X$ の距離位相と一致する。さらに、各 $A\in\mathcal{P}_{n}$ は $\prec$ について凸（$x\prec z\prec y$, $x,y\in A$ なら $z\in A$）である。
:::

::: proof
**線形順序.** $x\prec x$ とならないことと、$x\ne y$ なら $x\prec y$ と $y\prec x$ のちょうど一方が成り立つことは、子の順序が線形順序であることと定義から従う。推移律を示す。$x\prec y\prec z$ とし、$x,y$ が初めて分かれる段を $n$、$y,z$ が初めて分かれる段を $m$ とする。$n<m$ の場合、$A_{k}(y)=A_{k}(z)$（$k\le n$）なので、$x$ と $z$ も段 $n$ で初めて分かれ、$A_{n}(x)$ は $A_{n}(y)=A_{n}(z)$ より先であるから $x\prec z$ である。$m<n$ の場合も同様に、$x$ と $z$ は段 $m$ で初めて分かれ、$A_{m}(x)=A_{m}(y)$ は $A_{m}(z)$ より先であるから $x\prec z$ である。$n=m$ の場合、$A_{n}(x),A_{n}(y),A_{n}(z)$ は同じ親の子で、$A_{n}(x)$ は $A_{n}(y)$ より、$A_{n}(y)$ は $A_{n}(z)$ より先なので、$A_{n}(x)$ は $A_{n}(z)$ より先であり（特に異なり）、$x\prec z$ である。

**凸性.** $x,y\in A\in\mathcal{P}_{n}$, $x\prec z\prec y$ とし、$z\notin A$ と仮定する。$z$ と $x$ が初めて分かれる段を $k$ とすると、$A_{n}(z)\ne A=A_{n}(x)$ なので $k\le n$ である。$A_{k}(x)$ と $A_{k}(y)$ はどちらも $A$ を含む $\mathcal{P}_{k}$ の元なので等しく、$z$ と $y$ も段 $k$ で初めて分かれる。$x\prec z$ から $A_{k}(x)$ は $A_{k}(z)$ より先、$z\prec y$ から $A_{k}(z)$ は $A_{k}(y)=A_{k}(x)$ より先となり、矛盾する。ゆえに $z\in A$ である。

**最初・最後に居続けない.** 各点 $x$ は無限個の $n$ で $x=x_{n}$ となり、その $n$ では \ref{top:clopen-partitions.3} から $A_{n+1}(x)$ は親の子の最初でも最後でもない。ゆえに、そのような段は無限個ある。

**間に点があること・端点がないこと.** $x\prec y$ とし、初めて分かれる段を $n$ とする。前段から、$A_{m}(x)$ が親 $A_{m-1}(x)$ の子の中で最後でないような段 $m>n$ がある。$A_{m}(x)$ より後の兄弟 $B$ の点 $z$ をとると、$A_{m-1}(z)=A_{m-1}(x)$ なので $x$ と $z$ は段 $m$ で初めて分かれ、$x\prec z$ である。また $z\in A_{m-1}(x)\subseteq A_{n}(x)$ なので $A_{n}(z)=A_{n}(x)$ であり、$z$ と $y$ は段 $n$ で初めて分かれるので $z\prec y$ である。端点がないことも同様に示せる：任意の $x$ について、$A_{m}(x)$ が最後の子でない段 $m$ をとると、後の兄弟の点は $x$ より大きく、$A_{m}(x)$ が最初の子でない段をとると、前の兄弟の点は $x$ より小さい。

**位相の一致.** (a) 距離位相の開集合が順序位相で開であることを示す。$A\in\mathcal{P}_{n}$ と $x\in A$ をとる。$A_{m}(x)$ が最初の子でない段 $m>n$ をとり、前の兄弟の点 $a$ をとると、$a\prec x$ かつ $a\in A_{m-1}(x)\subseteq A$ であり、凸性から $(a,x]\subseteq A$ である。同様に $x\prec b$, $b\in A$ となる $b$ があり、$[x,b)\subseteq A$ である。ゆえに $x\in(a,b)\subseteq A$ であり、$A$ は順序位相で開である。距離位相の開集合 $U$ と $x\in U$ について、$x$ を中心とする半径 $1/n$ の開球が $U$ に含まれる $n\ge1$ をとると、$\mathrm{diam}\,A_{n}(x)<1/n$ から $A_{n}(x)\subseteq U$ である。ゆえに $U$ は順序位相の開集合 $A_{n}(x)$（$x\in U$）の和であり、順序位相で開である。(b) 順序位相の開集合が距離位相で開であることを示す。開区間 $(a,b)$ と $x\in(a,b)$ をとる。$a\ne x$, $b\ne x$ なので、十分大きい段 $n$ で $a,b\notin A_{n}(x)$ である。$A_{n}(x)$ の点 $w$ で $w\preceq a$ のものがあれば、$w\preceq a\prec x$ と凸性から $a\in A_{n}(x)$ となり矛盾する。$w\succeq b$ の点も同様にないので、$A_{n}(x)\subseteq(a,b)$ である。$A_{n}(x)$ は距離位相で開なので、$(a,b)$ は距離位相で開である。開半直線も同様であり、順序位相の開集合はこれらの和なので（\ref{top:order-topology-base}）、距離位相で開である。
:::

## シェルピンスキーの定理 {#top:sec-sq-theorem}

::: theorem シェルピンスキーの定理 {#top:sierpinski-q keywords="every nonempty countable metrizable space without isolated points is homeomorphic to Q" index="シェルピンスキーの定理（有理数）|しぇるぴんすきーのていりゆうりすう" refname="シェルピンスキーの定理"}
（AC）空でない可算な距離化可能空間で孤立点をもたないものは、$\mathbb{Q}$ と同相である。
:::

::: proof
距離を一つ固定し、\ref{top:clopen-partitions} の分割と \ref{top:partition-order} の順序 $\prec$ をとる。$(X,\prec)$ は端点のない可算な稠密線形順序なので、\ref{model:cantor-dlo}から順序同型 $h\colon(X,\prec)\to(\mathbb{Q},<)$ がある。順序同型は順序位相の同相写像である（記法の項）。$X$ の順序位相は距離位相に一致し（\ref{top:partition-order}）、$\mathbb{Q}$ の順序位相は通常の位相に一致する（記法の項）。ゆえに $h$ は $X$ から $\mathbb{Q}$ への同相写像である。

::: hypcheck
- **可算性**：\ref{top:countable-metric-clopen}（距離の値が可算）と、カントールの定理に使った。
- **孤立点がないこと**：分割の各元が無限で、$3$ 個以上の子に分けられることに使った。孤立点があれば、その点だけからなる閉開集合はそれ以上分けられない。
- **3 個以上の子と「最初でも最後でもない」配置**：順序の\term[稠密性]{model:dlo}と端点がないことに使った。$2$ 個ずつの分割では、ある点が最後の子に居続けて隣との間に隙間ができうる。
- **公理**：引用したカントールの定理（\ref{model:cantor-dlo}）に合わせて（AC）と書いた。$X$ の列挙を一つ固定すれば、本ページの構成で選ぶもの（$r'$、$\rho_{j}$、二点 $u,v$、子の並べ方）は列挙や有理数の列挙の順で最初のものとして選べ、往復論法も両方の列挙の順に進められるので、実際には選択公理は要らない。
:::
:::

## 問題 {#top:sec-sq-problems}

::: problem {#top:prob-sq-qq}
$\mathbb{Q}\times\mathbb{Q}$ と、$\mathbb{Q}$ から一点を除いた空間が $\mathbb{Q}$ と同相であることを確かめよ。
:::

::: solution
どちらも可算で、距離化可能（$\R^{2}$, $\R$ の部分空間）で、孤立点をもたない（$\mathbb{Q}\times\mathbb{Q}$ の点の任意の近傍に他の有理点がある。$\mathbb{Q}\setminus\{q\}$ も同様）ので、\ref{top:sierpinski-q} から $\mathbb{Q}$ と同相。
:::

::: problem {#top:prob-sq-not-q}
$\mathbb{Q}\cap[0,1]$ が $\mathbb{Q}$ と同相であることと、$\N$ や $\{0\}\cup\{1/n:n\ge1\}$ が $\mathbb{Q}$ と同相でないことを説明せよ。
:::

::: solution
$\mathbb{Q}\cap[0,1]$ は可算・距離化可能で、端点 $0,1$ も含めて孤立点がない（$0$ の近傍に正の有理数がある）ので同相。$\N$ はすべての点が孤立点、$\{0\}\cup\{1/n\}$ は $1/n$ が孤立点なので、孤立点のない $\mathbb{Q}$ とは同相でない。
:::

::: supplement
**前提を変えると.** 距離化可能性を外すと結論は成り立たない。たとえば $K$ 位相の実数直線（\ref{top:k-topology}）の $\mathbb{Q}$ 上の相対位相を $\mathbb{Q}_{K}$ とすると、$\mathbb{Q}_{K}$ は可算でハウスドルフで孤立点をもたないが、$\mathbb{Q}$ と同相でない。実際、開基の元 $U$ または $U\setminus K$（$U$ は通常の開集合）が空でなければ、その $\mathbb{Q}$ との共通部分は無限個の有理数を含むので、孤立点はない。また $K\subseteq\mathbb{Q}$ は閉集合で、$0$ と $K$ は \ref{top:k-topology} と同じ議論（区間の中の $K$ に属さない点を有理数にとる）により開集合で分離できないので、$\mathbb{Q}_{K}$ は正則でない。距離化可能な空間は正則なので、$\mathbb{Q}_{K}$ は距離化可能でなく、$\mathbb{Q}$ と同相でない。非可算な空間についても似た特徴づけが知られている：空でない零次元のポーランド空間（可分で完備距離化可能な空間）で、コンパクト集合がすべて内部をもたないものは、無理数全体（$\N^{\N}$ と同相）と同相である（アレクサンドロフ–ウリゾーンの定理。ここでは証明しない）。カントール集合の特徴づけは下の「似た定理」を見よ。

**似た定理.** カントール集合の特徴づけ（ブラウワーの定理、\ref{top:brouwer-cantor}）は、コンパクト・距離化可能・完全不連結・孤立点なしという条件で、同じ「入れ子の閉開分割」の方法で示される。本ページでは、コンパクト性がない代わりに、カントールの往復論法（\tref{model:cantor-dlo}）で順序を介して同型を作った。

**高い視点から：位相を順序に翻訳する.** 可算な距離空間は、閉開集合で何度でも細かく切り分けられる。切り分けた破片を左右に並べ、その並べ方を入れ子にしていくと、空間の点が一列に並ぶ。並べ方を工夫して隙間も端もないようにすれば、それは有理数の大小と同じ順序になる。比喩で言えば、粉々に砕いた有理数の粒を、元の位置を知らずに、破片の入れ子構造だけを頼りに一列に並べ直したら、元の数直線上の並びが（同型を除いて）復元できる、ということである。
:::
