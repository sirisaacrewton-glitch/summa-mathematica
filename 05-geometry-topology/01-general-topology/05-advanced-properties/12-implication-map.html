# 位相的性質の含意の地図 {#top:page-implication-map keywords="implications between topological properties, map of separation axioms and compactness, combinations of properties, counterexamples to converses, characterizations of Cantor set, rationals, Baire space"}

位相空間の性質のあいだには「$A$ なら $B$」という含意と、「$A$ と $B$ を合わせると $C$」という組み合わせの含意がある。このページでは、これまでのページで証明した含意を地図（\ref{top:sec-imp-map}）と表（\ref{top:implication-table}）にまとめ、どの矢印も逆向きには成り立たないことを反例の表（\ref{top:non-implication-table}）で確かめる。最後に、性質の組み合わせで空間が一つに決まってしまう特徴づけ（\ref{top:characterization-table}）を並べる。

> 反例のうち、これまでのページにない小さな空間は \ref{top:sec-imp-examples} で作る。

## 記法と定義の確認 {#top:sec-imp-notation}

::: notation
- 性質の定義と記号は \ref{top:page-preservation-table} の記法による。LCH は局所コンパクトなハウスドルフ空間。
- 「$A+B\Rightarrow C$」は「$A$ と $B$ をともに満たす空間は $C$ を満たす」の意味。
- **σ コンパクト**は、可算個のコンパクト集合の和であること。**零次元**は閉開集合からなる開基をもつこと（\ref{top:stone-space}）。**完全不連結**は連結成分がすべて一点であること（\ref{top:components}）。
- 公理：$\ZF$ に従属選択公理（DC）を加えて議論する。各定理の選択公理の使い方は引用先に書いてある。
:::

::: intuition
地図の矢印は二種類に分かれる。一つは「定義からすぐ」の矢印（コンパクト ⇒ リンデレーフ、第二可算 ⇒ 可分 など）で、もう一つは「関数や距離を作る」重い矢印（ウリゾーンの補題による $T_{4}\Rightarrow$ チコノフ、ウリゾーンの距離化定理など）である。重い矢印は、開集合しか与えられていない空間から $[0,1]$ や $\R$ への連続関数を組み立てるという、位相の議論の中心的な技術を使っている。

組み合わせの矢印（点線の枠）は、「局所的な情報を大域的に貼り合わせる」型が多い。正則性（各点のまわりでの分離）をリンデレーフ性（可算個への削減）で貼り合わせるとパラコンパクト性（局所有限な細分）が出る。可算コンパクト性（点列の集積点）を第一可算性（点列で近づける）と合わせると点列コンパクト性が出る。
:::

| 可算コンパクト ＋ パラコンパクト | コンパクト | \ref{top:imp-omega-one.4} | パラコンパクトを外す：$[0,\omega_{1})$ |
| 距離化可能 ＋ 可算コンパクト | コンパクト（点列コンパクトとも同値） | 可算コンパクト ⇔ ボルツァーノ–ワイエルシュトラス性（\ref{top:countably-compact-equivalents.4}）と \ref{top:compact-metric-equivalents} | 距離化可能を外す：$[0,\omega_{1})$ |
| 距離空間で 完備 ＋ 全有界 | コンパクト（同値） | \ref{top:compact-metric-equivalents} | 完備を外す：$(0,1)$。全有界を外す：$\R$ |
| 連結 ＋ 局所弧状連結 | 弧状連結 | \ref{top:path-components-open} | 局所弧状連結を外す：位相幾何学者のサイン曲線（\ref{top:topologist-sine}） |
| コンパクト $T_{2}$ ＋ 完全不連結 | 零次元 | \ref{top:totally-disconnected-zero-dim} | コンパクトを外す：零次元でない完全不連結な距離空間がある（エルデシュ空間などが知られている。このサイトでは扱わない） |
| 完備距離化可能 | ベール空間 | \ref{top:baire-category.1} | 逆の反例：$[0,\omega_{1}]$（コンパクト $T_{2}$ なのでベール空間だが距離化可能でない） |
| LCH（より一般にチェック完備） | ベール空間 | \ref{top:baire-category.2}、\ref{top:cech-complete-baire} | — |
| パラコンパクト × コンパクト $T_{2}$ | パラコンパクト | \ref{top:paracompact-times-compact} | コンパクトを外す：ゾルゲンフライ平面（\ref{top:sorgenfrey-plane}） |
:::

::: fact 正則だが完全正則でない空間 {#top:fact-regular-not-tychonoff keywords="regular T1 space that is not completely regular (Tychonoff corkscrew, Mysior example)" index="正則だが完全正則でない空間|せいそくだがかんぜんせいそくでないくうかん"}
$T_{3}$ 空間で、完全正則でないものがある。そのような空間では、ある点 $x$ と閉集合 $F\not\ni x$ について、$x$ で $0$、$F$ 上で $1$ となる連続関数がない（出典：R. Engelking, *General Topology*。チコノフの「コルク抜き」などの構成がある）。
:::

## 反例に使う小さな空間 {#top:sec-imp-examples}

::: proposition 小さな反例 {#top:imp-small-spaces keywords="Sierpinski space, cofinite topology, one-point compactification of an uncountable discrete space" index="シェルピンスキー空間|しぇるぴんすきーくうかん, 補有限位相|ほゆうげんいそう"}
1. **シェルピンスキー空間** $\{0,1\}$（開集合は $\emptyset,\{1\},\{0,1\}$）は $T_{0}$ だが $T_{1}$ でない。
2. 無限集合 $X$ 上の**補有限位相**（開集合は $\emptyset$ と、補集合が有限な集合）はコンパクトで $T_{1}$ だが、ハウスドルフでも正規でもない。
3. 非可算な離散空間 $D$ の一点コンパクト化 $D^{*}$ はコンパクトハウスドルフ（したがってリンデレーフ）だが、可分でない。
:::

::: proof
**Step 1（1）.** 開集合 $\{1\}$ が $1$ を含み $0$ を含まないので $T_{0}$。$0$ を含む開集合は $\{0,1\}$ だけで、$1$ を含むので $T_{1}$ でない。

**Step 2（2）.** 有限集合の有限和と任意の共通部分は有限なので、補有限集合の族は位相をなす。一点集合は補集合が開なので閉で、$T_{1}$。開被覆から空でない元 $U$ を一つとると、補集合 $X\setminus U$ は有限なので、その各点を含む元を一つずつ加えれば有限部分被覆になり、コンパクト。空でない二つの開集合 $U,V$ について $U\cap V$ の補集合 $(X\setminus U)\cup(X\setminus V)$ は有限で $X$ は無限なので $U\cap V\neq\emptyset$。よって異なる二点を交わらない開集合で分けられず、ハウスドルフでない。二点集合 $\{a\}$, $\{b\}$ は閉集合で、同じ理由で分離できないので、正規でもない。

**Step 3（3）.** $D$ は離散なので LCH で、$D^{*}$ はコンパクトハウスドルフ（\ref{top:one-point-properties}）。コンパクトなのでリンデレーフ。$D$ の各点 $d$ について $\{d\}$ は $D$ で開なので $D^{*}$ でも開（\ref{top:one-point-properties.1}）。稠密集合は空でない開集合 $\{d\}$ とすべて交わるので $D$ を含み、非可算。
:::

::: proposition $K$ 位相の $\R$ は第二可算 {#top:imp-k-topology keywords="the K-topology on R is second countable and Hausdorff but not regular, hence not metrizable" index="K 位相の性質|けーいそうのせいしつ"}
$K$ 位相の $\R$（\ref{top:k-topology}）は第二可算なハウスドルフ空間だが、正則でない。したがってリンデレーフだが、パラコンパクトでも距離化可能でもない。
:::

::: proof
**Step 1（第二可算）.** $\mathcal{B}\defeq\{(a,b):a<b,\ a,b\in\mathbb{Q}\}\cup\{(a,b)\setminus K:a<b,\ a,b\in\mathbb{Q}\}$ は可算で、開基である：開集合 $U$（通常の位相）と $x\in U$ に $x\in(a,b)\subseteq U$ となる有理数 $a,b$ があり、$x\in U\setminus K$ なら同じ $(a,b)$ について $x\in(a,b)\setminus K\subseteq U\setminus K$。

**Step 2（正則でない、帰結）.** 正則でないことは \ref{top:k-topology}。第二可算なのでリンデレーフ（\ref{top:second-countable-properties}）。パラコンパクト空間は正規でハウスドルフなので正則（$T_{4}\Rightarrow T_{3}$：\ref{top:separation-implications}）であり、距離化可能空間も正則（\ref{top:metric-normal}）なので、どちらでもない。
:::

::: proposition 可算順序数の空間 {#top:imp-omega-one keywords="omega_1 is normal, countably compact, locally compact, but neither paracompact nor Lindelof" index="ω₁ の空間の性質|おめがわんのくうかんのせいしつ"}
$[0,\omega_{1})$（順序位相）について次が成り立つ。
1. 交わらない二つの閉集合のうち、少なくとも一方は有界（ある $\alpha<\omega_{1}$ について $[0,\alpha]$ に含まれる）である。
2. $T_{4}$ で、LCH である。
3. 可算コンパクトだが、コンパクトでもリンデレーフでもない。
4. 可算コンパクトなパラコンパクト空間はコンパクトである。したがって $[0,\omega_{1})$ はパラコンパクトでない。
:::

::: proof
**Step 1（1）.** 交わらない閉集合 $A,B$ がどちらも非有界だとする。$a_{0}\in A$ をとり、帰納的に $b_{n}\in B$, $a_{n+1}\in A$ を $a_{n}<b_{n}<a_{n+1}$ となるように選ぶ（非有界性と DC）。$\gamma\defeq\sup_{n}a_{n}=\sup_{n}b_{n}$ は可算順序数の可算個の上限なので $\gamma<\omega_{1}$（可算選択公理）。$\gamma$ の任意の近傍 $(\beta,\gamma]$（$\beta<\gamma$）は十分大きい $n$ の $a_{n}$ と $b_{n}$ を含むので、$\gamma\in\overline{A}\cap\overline{B}=A\cap B$。矛盾。

**Step 2（2）.** 順序位相はハウスドルフ（\ref{top:order-hausdorff}）なので $T_{1}$。各 $\alpha<\omega_{1}$ について $[0,\alpha]=[0,\alpha+1)$ は開集合で、順序数の空間としてコンパクト（\ref{top:ordinal-compact}）なので、$\alpha$ のコンパクトな近傍。よって LCH。正規性：交わらない閉集合 $A,B$ について、1 から $A\subseteq[0,\alpha]$ としてよい。$[0,\alpha]$ はコンパクトハウスドルフなので $T_{4}$（\ref{top:compact-hausdorff-normal}）で、閉集合 $A$ と $B\cap[0,\alpha]$ を分ける $[0,\alpha]$ の開集合 $U,V$ がある。$[0,\alpha]$ は開なので $U,V$ は $[0,\omega_{1})$ でも開で、$U$ と $V\cup(\alpha,\omega_{1})$ が $A$ と $B$ を分ける。

**Step 3（3）.** 点列コンパクト（\ref{top:omega-one-space.3}）なので可算コンパクト（\ref{top:compactness-variants.2}）。リンデレーフでないこと（したがってコンパクトでないこと）は \ref{top:pres-omega-one}。

**Step 4（4）.** $X$ を可算コンパクトなパラコンパクト空間、$\mathcal{U}$ を開被覆とし、局所有限な開細分 $\mathcal{V}$ をとる。$\mathcal{V}$ の空でない元が無限個あるとすると、その中から異なる $V_{n}$ と点 $x_{n}\in V_{n}$ を選べる（DC）。局所有限性から、各点は $\{V_{n}\}$ の有限個としか交わらない近傍をもつので、$\{x_{n}\}$ の任意の部分集合 $S$ は閉集合（$S$ の外の点 $y$ の近傍 $W$ が有限個の $V_{n}$ としか交わらなければ、$W$ から有限個の $x_{n}$（$y$ と異なる）を除いた $y$ の近傍は $S$ と交わらない：$T_{1}$ を使う）。とくに $x_{n}$ は相異なるとしてよく、$\{x_{n}\}$ は無限な閉離散集合である。$U_{n}\defeq X\setminus\{x_{m}:m\neq n\}$ は可算開被覆で、各 $U_{n}$ は $x_{n}$ 以外の $x_{m}$ を含まないので有限部分被覆をもたず、可算コンパクト性に反する。よって $\mathcal{V}$ の空でない元は有限個で、それぞれを含む $\mathcal{U}$ の元を選べば有限部分被覆になる。

::: hypcheck
- **Step 4 の $x_{n}$ が相異なること**：同じ点 $x$ が無限個の $V_{n}$ に入ると、$x$ のどの近傍も無限個の $V_{n}$ と交わり、局所有限性に反する。したがって $x_{n}$ の値は有限回ずつしか重ならず、部分列をとって相異なるとしてよい。
- **Step 1 の DC**：$a_{n},b_{n}$ を交互に選ぶのに使った。
:::
:::

::: supplement
**地図の読み方.** 地図の性質はすべて位相不変量（同相写像で保たれる）なので、二つの空間が同相でないことを示すには、地図のどれか一つの性質が一方にあって他方にないことを示せばよい。例：$[0,1]$ と $(0,1)$（コンパクト性）、$\R$ と $\R^{2}$（一点を除いた連結性。\ref{top:connected} の考え方）、$[0,\omega_{1}]$ と $[0,1]$（第一可算性）。

**他の分野との関係.** 関数解析では、ノルム空間の弱位相が距離化可能でないこと（無限次元のとき）や、弱 * 位相の単位球がコンパクトであること（バナッハ–アラオグル）など、この地図の「距離化可能でないがコンパクト」の領域がそのまま現れる。
:::

## 問題 {#top:sec-imp-problems}

::: problem {#top:prob-imp-sorgenfrey-not-metrizable}
ゾルゲンフライ直線が距離化可能でないことを、地図の二つの経路で示せ。(a) 可分な距離化可能空間は第二可算。(b) ゾルゲンフライ平面は正規でないが、距離化可能空間の直積は距離化可能。
:::

::: solution
(a) $\R_{\ell}$ は可分（$\mathbb{Q}$ が稠密）だが第二可算でない（\ref{top:sorgenfrey-not-second-countable}）。距離化可能なら \ref{top:metric-countability} から第二可算になるので矛盾。(b) $\R_{\ell}$ が距離化可能なら、$\R_{\ell}\times\R_{\ell}$ も距離化可能（\ref{top:countable-product-metrizable}）で、距離化可能空間は正規（\ref{top:metric-normal}）だが、ゾルゲンフライ平面は正規でない（\ref{top:sorgenfrey-plane}）。矛盾。
:::

::: problem {#top:prob-imp-which-space}
次の性質をもつ空間を地図から探せ（またはないことを示せ）。(1) コンパクトハウスドルフで第一可算だが距離化可能でない。(2) 可算コンパクトで、リンデレーフで、コンパクトでない。(3) 連結な可算距離空間で二点以上のもの。
:::

::: solution
(1) 二重矢印空間（\ref{top:double-arrow-properties}：コンパクトハウスドルフ、第一可算、第二可算でない）。コンパクトハウスドルフなら距離化可能 ⇔ 第二可算（\ref{top:compact-metrizable}）なので距離化可能でない。(2) ない：可算コンパクト ＋ リンデレーフ ⇒ コンパクト（\ref{top:compactness-variants.4}）。(3) ない：距離空間 $(X,d)$ の異なる二点 $x,y$ について、値の集合 $\{d(x,z):z\in X\}$ は可算なので、$0<r<d(x,y)$ で値域に入らない $r$ がある。$\{z:d(x,z)<r\}$ と $\{z:d(x,z)>r\}$ は交わらない空でない開集合で、和が $X$ なので、$X$ は連結でない。
:::
