# 一般位相（General Topology）

位相空間と連続写像、部分空間・直積・商、分離公理、コンパクト性とチコノフの定理、連結性、ウリゾーンの補題とティーツェの拡張定理、パラコンパクト性、距離空間と距離化、関数空間とアスコリ–アルツェラの定理、超空間とフラクタル集合、一様空間、局所連結性とカントール集合、完全写像、位相群。

<p class="mn-msc">MSC2020: 54A–54H</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-topological-spaces/index.html"><span class="mn-card-title">位相空間</span><span class="mn-card-en">Topological Spaces</span><span class="mn-card-desc">位相の定義と例、近傍系、閉包・内部・境界、開基・準開基・可算公理、連続写像と同相、ネットとフィルターによる収束。（内田伏一『集合と位相』§15–§18 を参考）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="02-constructions/index.html"><span class="mn-card-title">部分空間・直積・商</span><span class="mn-card-en">Subspaces, Products and Quotients</span><span class="mn-card-desc">相対位相、直積位相とその普遍性、箱位相、商位相と接着、順序位相。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="03-function-spaces/index.html"><span class="mn-card-title">関数空間の位相</span><span class="mn-card-en">Topologies on Function Spaces</span><span class="mn-card-desc">各点収束位相・コンパクト開位相・一様収束位相とその比較、コンパクト集合上の一様収束、指数写像と評価写像、アスコリ–アルツェラの定理、ストーン–ワイエルシュトラスの定理、一般形のアスコリの定理。（小山『位相空間論』第 10 章を参考）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="04-properties/index.html"><span class="mn-card-title">基本性質 I</span><span class="mn-card-en">Fundamental Properties I</span><span class="mn-card-desc">分離公理、コンパクト空間、チコノフの定理、局所コンパクトと一点コンパクト化、連結性、ウリゾーンの補題とティーツェの拡張定理、ストーン–チェックのコンパクト化、パラコンパクト性と 1 の分割、局所連結性と弧状連結性。性質の保存表・操作の可換性・含意の地図は「基本性質 II」にある。（内田『集合と位相』§21–§25、小山『位相空間論』第 7 章を参考）</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="05-advanced-properties/index.html"><span class="mn-card-title">基本性質 II</span><span class="mn-card-en">Fundamental Properties II</span><span class="mn-card-desc">ストーン双対性、カントール集合、完全写像、商写像と直積（ホワイトヘッドの定理）、可算コンパクト性・点列コンパクト性・擬コンパクト性、βℕ の濃度と点列、有理数の位相的特徴づけ（シェルピンスキーの定理）、マイケルの定理（σ 局所有限な細分とパラコンパクト性、正則リンデレーフ空間）、マイケルの選択定理。後半は、分離公理・コンパクト性・可算性・連結性・距離化可能性などが、部分空間・直積・直和・商・連続像・開写像・閉写像・完全写像で保たれるかの一覧表、閉包・内部・直積・商などの操作の可換性、性質の組み合わせから別の性質が導かれる関係の地図。各欄に証明または反例への参照を付ける。</span><span class="mn-card-count">12 ページ</span></a>
<a class="mn-card" href="06-metric-spaces/index.html"><span class="mn-card-title">距離空間</span><span class="mn-card-en">Metric Spaces</span><span class="mn-card-desc">距離と距離位相、完備性と完備化、ベールのカテゴリー定理、全有界性とコンパクト性、ウリゾーンの距離化定理、ストーンの定理と長田–スミルノフの距離化定理、完備距離化可能性とポーランド空間、至るところ微分不可能な連続関数（ベールの定理の応用）、デュグンジの拡張定理（ノルム空間値の延長と線形拡張作用素）、ℕ^ℕ の特徴づけ（アレクサンドロフ–ウリゾーンの定理、無理数、ポーランド空間は ℕ^ℕ の連続像）、チェック完備性（コンパクト化によらないこと、ベール性、距離化可能空間での完備距離化可能性との一致）、超空間（ハウスドルフ距離・ヴィートリス位相）とフラクタル集合（縮小写像の不動点）。（内田『集合と位相』§26–§27、小山『位相空間論』を参考）</span><span class="mn-card-count">12 ページ</span></a>
<a class="mn-card" href="07-uniform-spaces/index.html"><span class="mn-card-title">一様空間</span><span class="mn-card-en">Uniform Spaces</span><span class="mn-card-desc">近縁による一様構造、一様構造の定める位相、一様連続写像と始一様構造、擬距離による一様構造と距離化補題、完全正則性との対応、完備性と完備化、普遍一様構造とデュドネの完備化（パラコンパクト空間はデュドネ完備）。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="08-counterexamples/index.html"><span class="mn-card-title">位相空間の反例</span><span class="mn-card-en">Counterexamples in Topology</span><span class="mn-card-desc">ニェミツキ平面（完全正則だが正規でない可分空間、ジョーンズの補題）、ゾルゲンフライ直線と平面、チコノフの板、アレクサンドロフの二重矢印空間など、一般位相の性質を区別する代表的な空間。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="09-topological-groups/index.html"><span class="mn-card-title">位相群</span><span class="mn-card-en">Topological Groups</span><span class="mn-card-desc">位相群の定義と例、単位元の近傍による記述、部分群と商空間、分離性、左一様構造と完全正則性、バーコフ–角谷の距離化定理。</span><span class="mn-card-count">2 ページ</span></a>
</div>
