# 可微分構造の存在と一意性 {#mfd:page-smooth-structures keywords="smooth structures on a topological manifold, pullback of a smooth structure by a homeomorphism, uncountably many distinct but diffeomorphic smooth structures on R, counting smooth structures up to diffeomorphism, classification of 1-manifolds, exotic spheres, exotic R^4, TOP PL DIFF"}

一つの位相多様体に、可微分構造はいくつ入るか。このページではまず、問いの立て方を整える。同相写像で可微分構造を引き戻すと、別の可微分構造が得られるが、それは元の構造と微分同相である。したがって、可微分構造を「集合として」数えると $\mathbb{R}$ にさえ非可算個あり、意味のある数え方は「微分同相を除いて」である。そのうえで、微分同相を除いた個数について知られている事実（3 次元以下の一意性、エキゾチック球面、エキゾチックな $\mathbb{R}^{4}$）をまとめる。三角形分割（区分線形構造）についての事実は \ref{mfd:triangulation-higher-facts}、$C^{r}$ 級の構造と $C^{\infty}$ 級の構造の関係は \ref{mfd:cr-structure-facts}。

## 記法と定義の確認 {#mfd:sec-ss-notation}

::: notation
- 可微分構造（極大アトラス）は \ref{mfd:smooth-manifold}, \ref{mfd:maximal-atlas}。このページでは $C^{\infty}$ 級だけを扱う。位相多様体 $M$ とその上の可微分構造 $\mathcal{A}$ の組を $(M,\mathcal{A})$ と書く。
- 滑らかな写像と微分同相写像は \ref{mfd:smooth-map}, \ref{mfd:diffeomorphism}、滑らかさの判定は \ref{mfd:smooth-map-criteria}。
- $\mathcal{A}_{\mathrm{std}}$ は $\mathbb{R}$ の標準的な可微分構造（恒等写像 $\mathrm{id}_{\mathbb{R}}$ だけからなるアトラスを含むもの）。
- 事実（fact）として述べるものは、証明を本サイトに収録していない。出典の年は広く知られている文献情報に基づくが、原典では確認していない。
:::

## 同相写像による引き戻し {#mfd:sec-ss-pullback}

::: proposition 可微分構造の引き戻し {#mfd:pullback-structure keywords="pullback h^*A of a smooth structure by a homeomorphism h is a smooth structure, h is a diffeomorphism (M,h^*A) -> (M,A), and h^*A = A iff h is a self-diffeomorphism of (M,A)" index="可微分構造の引き戻し|かびぶんこうぞうのひきもどし"}
$(M,\mathcal{A})$ を $d$ 次元の可微分多様体、$h\colon M\to M$ を同相写像とし、
$$
h^{*}\mathcal{A}\defeq\{(h^{-1}(U),\ \varphi\circ h):(U,\varphi)\in\mathcal{A}\}
$$
とおく。
1. $h^{*}\mathcal{A}$ は $M$ の可微分構造（極大アトラス）である。
2. $h$ は $(M,h^{*}\mathcal{A})$ から $(M,\mathcal{A})$ への微分同相写像である。
3. $h^{*}\mathcal{A}=\mathcal{A}$ であることと、$h$ が $(M,\mathcal{A})$ から自分自身への微分同相写像であることは同値である。
:::

::: intuition
可微分構造は「どの関数を滑らかと呼ぶか」の取り決めである。同相写像 $h$ で点を動かしてから元の取り決めを使えば、新しい取り決めができる。新しい取り決めのもとで滑らかな関数は、$h$ で運ぶと元の取り決めで滑らかになるので、二つは「名前の付け替え」で移り合う（2）。取り決めそのものが変わらないのは、$h$ が元から滑らかに動かす写像だったときに限る（3）。
:::

::: proof
**1.** 【主張：$h^{*}\mathcal{A}$ はアトラスである】$h$ は連続なので $h^{-1}(U)$ は開集合、$h$ は全射なので $h^{-1}(U)$ の全体は $M$ を覆う（$\{U\}$ が $M$ を覆うことを使う）。$\varphi\circ h\colon h^{-1}(U)\to\varphi(U)$ は同相写像の合成なので同相写像で、像は $\mathbb{R}^{d}$ の開集合 $\varphi(U)$ である。二つの座標近傍 $(h^{-1}(U),\varphi\circ h)$, $(h^{-1}(V),\psi\circ h)$ の座標変換は、$h$ が全単射であることから
$$
(\varphi\circ h)\circ(\psi\circ h)^{-1}=\varphi\circ h\circ h^{-1}\circ\psi^{-1}=\varphi\circ\psi^{-1}
$$
で、定義域は $(\psi\circ h)(h^{-1}(U)\cap h^{-1}(V))=\psi(U\cap V)$ である。$\mathcal{A}$ はアトラスなのでこれは $C^{\infty}$ 級である。

【主張：極大である】座標近傍 $(W,\chi)$ が $h^{*}\mathcal{A}$ のすべての座標近傍と両立するとする。$(h(W),\chi\circ h^{-1})$ は座標近傍で（$h$ は開写像）、任意の $(U,\varphi)\in\mathcal{A}$ との座標変換は
$$
(\chi\circ h^{-1})\circ\varphi^{-1}=\chi\circ(\varphi\circ h)^{-1},\qquad\varphi\circ(\chi\circ h^{-1})^{-1}=(\varphi\circ h)\circ\chi^{-1}
$$
で、仮定からどちらも $C^{\infty}$ 級である。$\mathcal{A}$ の極大性（\ref{mfd:maximal-atlas.1}）から $(h(W),\chi\circ h^{-1})\in\mathcal{A}$。よって $(W,\chi)=(h^{-1}(h(W)),(\chi\circ h^{-1})\circ h)\in h^{*}\mathcal{A}$。

**2.** $h^{*}\mathcal{A}$ の座標近傍 $(h^{-1}(U),\varphi\circ h)$ と $\mathcal{A}$ の座標近傍 $(U,\varphi)$ による $h$ の局所表示は
$$
\varphi\circ h\circ(\varphi\circ h)^{-1}=\mathrm{id}_{\varphi(U)}
$$
で $C^{\infty}$ 級。$(h^{-1}(U),\varphi\circ h)$ の形の座標近傍は $M$ の各点を含むので、\ref{mfd:smooth-map-criteria.1}（を各座標成分に使ったもの）から $h$ は滑らかである。同じ計算で $h^{-1}$ の局所表示 $(\varphi\circ h)\circ h^{-1}\circ\varphi^{-1}=\mathrm{id}_{\varphi(U)}$ も $C^{\infty}$ 級なので $h^{-1}$ も滑らか。よって $h$ は微分同相写像。

**3.** 「⇒」：$h^{*}\mathcal{A}=\mathcal{A}$ なら、2 の $h\colon(M,h^{*}\mathcal{A})\to(M,\mathcal{A})$ がそのまま $(M,\mathcal{A})$ の微分同相写像である。

「⇐」：$h$ が $(M,\mathcal{A})$ の微分同相写像とし、$(U,\varphi)\in\mathcal{A}$ をとる。任意の $(V,\psi)\in\mathcal{A}$ について
$$
\psi\circ(\varphi\circ h)^{-1}=\psi\circ h^{-1}\circ\varphi^{-1},\qquad(\varphi\circ h)\circ\psi^{-1}=\varphi\circ h\circ\psi^{-1}
$$
はそれぞれ $h^{-1}$, $h$ の局所表示なので $C^{\infty}$ 級（ここで $h$, $h^{-1}$ が滑らかであることを使う）。よって $(h^{-1}(U),\varphi\circ h)$ は $\mathcal{A}$ のすべての座標近傍と両立し、極大性から $\mathcal{A}$ に属する。これで $h^{*}\mathcal{A}\subset\mathcal{A}$。逆に $\mathcal{A}$ の座標近傍は、$h^{*}\mathcal{A}\subset\mathcal{A}$ のすべての座標近傍と（$\mathcal{A}$ の中で）両立するので、1 で示した $h^{*}\mathcal{A}$ の極大性から $h^{*}\mathcal{A}$ に属する。よって $h^{*}\mathcal{A}=\mathcal{A}$。

::: hypcheck
- **$h$ が同相写像**：1 で、$h^{-1}(U)$ が開集合で $M$ を覆うこと（連続性と全射性）、$\varphi\circ h$ が同相写像であること、$h(W)$ が開集合であること（開写像）に使った。
- **$\mathcal{A}$ が極大**：1 の極大性と 3 の「⇐」で使った。極大でないアトラスについても 1・2 は（極大性の部分を除いて）同じ計算で成り立つ。
:::
:::

::: example 互いに異なるが微分同相な $\mathbb{R}$ の可微分構造 {#mfd:distinct-structures-on-r keywords="for a in R, h_a(t) = (t-a)^3 + a^3 gives smooth structures h_a^*A_std on R that are pairwise distinct but all diffeomorphic to the standard one" index="異なる可微分構造（実数直線）|ことなるかびぶんこうぞうじっすうちょくせん"}
$a\in\mathbb{R}$ について $h_{a}(t)\defeq(t-a)^{3}+a^{3}$ とおき、$\mathcal{A}_{a}\defeq h_{a}^{*}\mathcal{A}_{\mathrm{std}}$ とする。
1. $(\mathbb{R},\mathcal{A}_{a})$ はどれも $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ と微分同相である。
2. $a\neq b$ なら $\mathcal{A}_{a}\neq\mathcal{A}_{b}$。とくに $\mathbb{R}$ には、互いに異なる可微分構造が非可算個ある。
:::

::: proof
**Step 0.** 【主張：$h_{a}$ は同相写像で、$h_{a}^{-1}(u)=a+(u-a^{3})^{1/3}$】$h_{a}$ は連続な狭義単調増加関数で、$t\to\pm\infty$ で $\pm\infty$ に発散するので全単射。逆写像は $(t-a)^{3}=u-a^{3}$ を解いて得られる上の式で、実数の 3 乗根 $s\mapsto s^{1/3}$ は連続なので連続である。

**1.** \ref{mfd:pullback-structure.2}（Step 0 で $h_{a}$ が同相写像であることを使う）。

**2.** \ref{mfd:pullback-structure} を使うために、まず【主張：$\mathcal{A}_{a}=\mathcal{A}_{b}$ なら $h_{a}\circ h_{b}^{-1}$ は $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ の微分同相写像】を示す。$\mathcal{A}_{a}=\mathcal{A}_{b}$ とすると、\ref{mfd:pullback-structure.2} から $h_{a}\colon(\mathbb{R},\mathcal{A}_{b})\to(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ と $h_{b}\colon(\mathbb{R},\mathcal{A}_{b})\to(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ はどちらも微分同相写像。微分同相写像の合成と逆は微分同相写像（\ref{mfd:smooth-map-criteria.4}）なので、$h_{a}\circ h_{b}^{-1}$ は $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ の微分同相写像、とくに通常の意味で $C^{\infty}$ 級（標準構造での局所表示は関数そのもの）。

【主張：$a\neq b$ なら $g\defeq h_{a}\circ h_{b}^{-1}$ は $u_{0}\defeq b^{3}$ で微分可能でない】$c\defeq b-a\neq0$ とおくと、Step 0 から
$$
g(u)=\bigl(c+(u-b^{3})^{1/3}\bigr)^{3}+a^{3}.
$$
$s\defeq u-b^{3}$ とすると $g(u)-g(u_{0})=(c+s^{1/3})^{3}-c^{3}=3c^{2}s^{1/3}+3c\,s^{2/3}+s$ なので、$s\neq0$ で
$$
\frac{g(u)-g(u_{0})}{u-u_{0}}=3c^{2}s^{-2/3}+3c\,s^{-1/3}+1=s^{-2/3}\bigl(3c^{2}+3c\,s^{1/3}+s^{2/3}\bigr).
$$
$s\to0$ で括弧の中は $3c^{2}>0$ に収束し（$c\neq0$ を使う）、$s^{-2/3}\to+\infty$ なので、差分商は $+\infty$ に発散する。よって $g$ は $u_{0}$ で微分可能でなく、前の主張と矛盾する。したがって $\mathcal{A}_{a}\neq\mathcal{A}_{b}$。$a\mapsto\mathcal{A}_{a}$ が $\mathbb{R}$ からの単射なので、異なる可微分構造は非可算個ある。

::: hypcheck
- **$c\neq0$**：差分商の発散に使った。$a=b$ なら $g=\mathrm{id}$ で、当然 $\mathcal{A}_{a}=\mathcal{A}_{b}$。
- 1 では微分同相写像 $h_{a}$ は $\mathcal{A}_{a}$ ごとに異なる。「同じ可微分構造」と「微分同相」は別の関係で、後者の方が粗い。
:::
:::

::: intuition
\ref{mfd:prob-sm-cube-chart} の $t\mapsto t^{3}$ は、原点で目盛りが「止まる」座標だった。$h_{a}$ は止まる場所を $a$ にずらしたものである。止まる場所が違う二つの目盛りの間の換算は、一方が止まる場所で無限に急になるので滑らかでない。それでも各目盛りは、それ自身の換算 $h_{a}$ で標準の目盛りに付け替えられる。
:::

この例から、可微分構造の「個数」は、集合として数えるのではなく、次の意味で数えるのが自然である。

::: definition 可微分構造の個数 {#mfd:count-smooth-structures keywords="the number of smooth structures on a topological manifold up to diffeomorphism; uniqueness of smooth structure" index="可微分構造の個数|かびぶんこうぞうのこすう, 可微分構造が一意|かびぶんこうぞうがいちい"}
位相多様体 $M$ について、$M$ 上の可微分構造 $\mathcal{A}$, $\mathcal{B}$ を、$(M,\mathcal{A})$ と $(M,\mathcal{B})$ が微分同相であるとき同値とする。この同値類の個数を、$M$ 上の**可微分構造の個数**（微分同相を除いた個数）という。それが $1$ のとき、$M$ の可微分構造は（微分同相を除いて）**一意**であるという。
:::

\ref{mfd:pullback-structure.2} から、この同値類は、同相写像 $h$ による引き戻し $\mathcal{A}\mapsto h^{*}\mathcal{A}$ で移り合うものを一つにまとめたものになっている：$(M,\mathcal{A})$ と $(M,\mathcal{B})$ が微分同相写像 $F$ をもつなら、$F$ は $M$ の同相写像で、$\mathcal{A}=F^{*}\mathcal{B}$ である（$F$ による局所表示が滑らかであることから、\ref{mfd:pullback-structure.3} の証明と同じ計算で $\mathcal{A}\subset F^{*}\mathcal{B}$、極大性から等号）。

## 知られている事実 {#mfd:sec-ss-facts}

::: fact 1 次元の多様体の分類 {#mfd:one-manifold-classification keywords="every connected smooth 1-manifold without boundary is diffeomorphic to R or S^1; uniqueness of smooth structures in dimension 1" index="1 次元多様体の分類|いちじげんたようたいのぶんるい"}
連結な 1 次元の可微分多様体（境界なし。ハウスドルフかつ第二可算）は、$\mathbb{R}$ か $S^{1}$ のどちらかと微分同相である（コンパクトなら $S^{1}$）。とくに、1 次元の位相多様体の可微分構造は一意である。証明は、ミルナー『Topology from the Differentiable Viewpoint』の付録に、弧長によるパラメータ付けを使った形で与えられている。
:::

::: fact 可微分構造の存在と一意性 {#mfd:smooth-structure-facts keywords="smooth structures: unique in dimensions <= 3; E8 manifold has none; exotic R^4; exotic 7-spheres (Milnor), 28 oriented smooth structures on S^7 (Kervaire-Milnor)" index="エキゾチック球面|えきぞちっくきゅうめん, エキゾチックな R⁴|えきぞちっくなあーるよん, 可微分構造の一意性|かびぶんこうぞうのいちいせい"}
1. 3 次元以下の位相多様体は可微分構造をもち、それは微分同相を除いて一意である（2 次元はラドーの定理（\ref{mfd:rado-triangulation}）、3 次元はモイーズの定理を出発点として示されることが知られている）。
2. 4 次元では、可微分構造をもたない閉位相多様体がある（フリードマンの $E_{8}$ 多様体。ドナルドソンの定理による）。$\mathbb{R}^{4}$ には、互いに微分同相でない可微分構造が非可算個ある（タウベス）。$n\neq4$ では $\mathbb{R}^{n}$ の可微分構造は一意である。
3. 5 次元以上では、可微分構造（や区分線形構造）の存在には障害（カービー–ジーベンマン不変量など）があり、コンパクトな位相多様体の可微分構造は、存在すれば有限個である（カービー–ジーベンマン）。
4. **エキゾチック球面**：$S^{7}$ と同相だが微分同相でない可微分多様体がある（ミルナー、1956 年）。向きを込めて、$S^{7}$ と同相な可微分多様体の微分同相類はちょうど 28 個である（ケルヴェア–ミルナー、1963 年）。
:::

ここでの個数はすべて \ref{mfd:count-smooth-structures} の意味（微分同相を除く）である。\ref{mfd:distinct-structures-on-r} のとおり、集合として数えれば $\mathbb{R}$ にさえ非可算個の構造があるので、2 の「$\mathbb{R}^{4}$ に非可算個」は、それとはまったく異なる主張である。

::: supplement
**高い視点：三つの圏.** 多様体には、位相多様体の圏 TOP、区分線形多様体の圏 PL、可微分多様体の圏 DIFF があり、忘却関手 DIFF → PL → TOP がある（滑らかな多様体の三角形分割が PL 構造を与える。\ref{mfd:triangulation-higher-facts}）。\ref{mfd:count-smooth-structures} は、忘却関手 DIFF → TOP の「ファイバー」（与えられた位相多様体の上にある対象を、DIFF の同型で割ったもの）の大きさを数えている：\ref{mfd:pullback-structure} が示すのは、構造そのものではなく同型類を数えるべきだということである。2 次元と 3 次元では、この関手は対象の同型類の上で全単射になる。4 次元では TOP と PL（= DIFF）が大きく離れ、5 次元以上では差が障害理論（ホモトピー群の計算）で測れる、という構図が知られている。比喩で言えば、同じ「形」に対して、粘土（TOP）、折り紙（PL）、滑らかな布（DIFF）のどの素材で作れるか、作り方が何通りあるかが次元によって違う、ということである。

**補足.** \ref{mfd:pullback-structure} は位相多様体である必要もなく、任意の位相空間と同相写像について同じ証明で成り立つ。また、$C^{r}$ 級（$1\le r\le\infty$）の構造についても、「$C^{\infty}$ 級」を「$C^{r}$ 級」に読み替えて同じ証明が通る。
:::

## 問題 {#mfd:sec-ss-problems}

::: problem {#mfd:prob-ss-odd-power}
$k\ge1$ について $p_{k}(t)\defeq t^{2k+1}$ とする。$p_{k}^{*}\mathcal{A}_{\mathrm{std}}$ と $p_{l}^{*}\mathcal{A}_{\mathrm{std}}$（$k\neq l$）は等しいか。
:::

::: solution
等しくない。\ref{mfd:distinct-structures-on-r} の 2 の証明と同じく、等しければ $g\defeq p_{k}\circ p_{l}^{-1}$, $g(u)=u^{(2k+1)/(2l+1)}$ と、その逆 $g^{-1}(u)=u^{(2l+1)/(2k+1)}$ が $C^{\infty}$ 級でなければならない。$k<l$ なら指数 $(2k+1)/(2l+1)<1$ なので、$g$ の $0$ での差分商 $u^{(2k+1)/(2l+1)-1}$ は $u\to0$ で絶対値が $+\infty$ に発散し、$g$ は $0$ で微分可能でない。$k>l$ なら $g^{-1}$ について同じことが言える。
:::

::: problem {#mfd:prob-ss-circle-rotation}
$S^{1}\subset\mathbb{R}^{2}$ に立体射影による標準的な可微分構造 $\mathcal{A}$ を入れる（\ref{mfd:manifold-examples}）。回転 $R_{\theta}(x,y)=(x\cos\theta-y\sin\theta,\ x\sin\theta+y\cos\theta)$ について $R_{\theta}^{*}\mathcal{A}=\mathcal{A}$ を示せ。
:::

::: solution
\ref{mfd:pullback-structure.3} から、$R_{\theta}$ が $(S^{1},\mathcal{A})$ の微分同相写像であることを示せばよい。立体射影 $p_{N}(x,y)=x/(1-y)$, $p_{S}(x,y)=x/(1+y)$ とその逆 $p_{N}^{-1}(u)=(2u,\ u^{2}-1)/(u^{2}+1)$, $p_{S}^{-1}(u)=(2u,\ 1-u^{2})/(u^{2}+1)$（\ref{mfd:manifold-examples} の Step 2 の $d=1$ の場合）を使うと、$R_{\theta}$ の局所表示 $p_{\bullet}\circ R_{\theta}\circ p_{\circ}^{-1}$（$\bullet,\circ\in\{N,S\}$）は、$C^{\infty}$ 級の写像 $p_{\circ}^{-1}$、線形写像 $R_{\theta}$、分母が $0$ にならない範囲の有理式 $p_{\bullet}$ の合成なので、定義域の上で $C^{\infty}$ 級である（$R_{-\theta}$ も同様）。よって $R_{\theta}$, $R_{-\theta}$ はともに滑らかで、$R_{\theta}$ は微分同相写像。
:::
