# 流れとリー微分 {#mfd:page-flows-lie-derivative keywords="integral curves, maximal integral curve, flow of a vector field, complete vector fields, Lie derivative of functions, vector fields and forms, L_X Y = [X,Y], interior product, Cartan's magic formula, formula for d of a 1-form"}

ベクトル場は「各点での速度の指定」なので、その速度で流れる点の動き（**流れ**）が考えられる。流れを使うと、関数・ベクトル場・微分形式を、流れに沿って運んでから元と比べる微分（**リー微分**）が定義できる。リー微分は計量などの付加構造を一切使わずに定まり、ベクトル場のリー微分はリー括弧に、微分形式のリー微分は外微分と内部積で表される（**カルタンの公式** $\mathcal{L}_{X}=d\,i_{X}+i_{X}\,d$）。

## 記法と定義の確認 {#mfd:sec-fl-notation}

::: notation
- 接束・ベクトル場・リー括弧は \ref{mfd:page-tangent-bundle}、微分形式・外微分・引き戻しは \ref{mfd:page-forms-on-manifolds}。$\mathfrak{X}(M)$ はベクトル場の全体、$\Omega^{k}(M)$ は $k$ 形式の全体。
- 曲線 $\gamma\colon I\to M$ の速度ベクトルは \ref{mfd:velocity}。常微分方程式の解の局所的な存在と一意性、ユークリッド空間の開集合上の流れの性質は \ref{ode:local-existence-uniqueness}, \ref{ode:integral-equation}, \ref{ode:flow-theorem}。
- 交代形式の外積は行列式の規約（\ref{mfd:abstract-wedge.2}）。
- 本ページは Warner『Foundations of Differentiable Manifolds and Lie Groups』第 1・2 章を参考にした。
:::

## 積分曲線と流れ {#mfd:sec-fl-flows}

::: definition 積分曲線 {#mfd:integral-curve keywords="integral curve of a vector field: gamma'(t) = X_{gamma(t)}" index="積分曲線|せきぶんきょくせん"}
$X\in\mathfrak{X}(M)$ とする。開区間 $I\ni0$ 上の滑らかな曲線 $\gamma\colon I\to M$ で $\gamma'(t)=X_{\gamma(t)}$（すべての $t\in I$）となるものを、$\gamma(0)$ を始点とする $X$ の**積分曲線**という。座標近傍では、成分 $X=\sum X^{i}\partial_{i}$ について常微分方程式 $\frac{d}{dt}(x_{i}\circ\gamma)=X^{i}\circ\gamma$ になる。
:::

::: theorem 流れの基本定理 {#mfd:flow-theorem keywords="maximal integral curves exist and are unique; flow domain is open and the flow is smooth; group law phi_s o phi_t = phi_{s+t}; compactly supported vector fields are complete" index="流れ（ベクトル場の）|ながれべくとるばの, 完備なベクトル場|かんびなべくとるば, 1 パラメータ変換群|いちぱらめーたへんかんぐん"}
$X\in\mathfrak{X}(M)$ とする。
1. 各 $m\in M$ について、$m$ を始点とする積分曲線で、定義域 $I_{m}\ni0$ が最大のもの $\gamma_{m}\colon I_{m}\to M$ がただ一つある（ほかの積分曲線はその制限）。
2. $\mathcal{D}\defeq\{(t,m):t\in I_{m}\}$ は $\mathbb{R}\times M$ の開集合で、$\phi\colon\mathcal{D}\to M$, $\phi(t,m)\defeq\gamma_{m}(t)$ は滑らか。$\phi$ を $X$ の**流れ**といい、$\phi_{t}\defeq\phi(t,\cdot)$ と書く。
3. $t\in I_{m}$ なら $I_{\phi_{t}(m)}=I_{m}-t$ で、$s\in I_{\phi_{t}(m)}$ について $\phi_{s}(\phi_{t}(m))=\phi_{s+t}(m)$。$M_{t}\defeq\{m:(t,m)\in\mathcal{D}\}$ は開集合で、$\phi_{t}\colon M_{t}\to M_{-t}$ は微分同相写像（逆写像は $\phi_{-t}$）。
4. $X$ の台 $\overline{\{X\neq0\}}$ がコンパクトなら（とくに $M$ がコンパクトなら）、$\mathcal{D}=\mathbb{R}\times M$（$X$ は**完備**）で、$t\mapsto\phi_{t}$ は加法群 $\mathbb{R}$ から微分同相写像の群への準同型になる。
:::

::: intuition
ベクトル場を川の流れの速度とみると、各点に置いた木の葉は流れに乗って動き、その軌跡が積分曲線、時間 $t$ だけ流したときの位置の対応が流れ $\phi_{t}$ である。$s$ だけ流してから $t$ だけ流すのは、$s+t$ だけ流すのと同じ。
:::

::: proof
**Step 1（局所存在と局所一意性）.** 座標近傍 $(U,\psi)$ の上で、$X$ の成分を並べた $\psi(U)$ 上の $C^{\infty}$ 級のベクトル場を $F$ とすると、曲線 $\gamma$ が（$U$ の中で）$X$ の積分曲線であることと、$\psi\circ\gamma$ が $x'=F(x)$ の解であることは同値（\ref{mfd:integral-curve} の座標表示）。\ref{ode:local-existence-uniqueness} から、各点を始点とする解が短い時間存在し、同じ区間上の二つの解は一点で一致すれば一致する。

**Step 2（一意性の大域化）.** 【主張：積分曲線 $\gamma,\delta\colon I\to M$（$I$ は区間）が一点 $t_{0}$ で一致すれば $I$ 上で一致する】$A\defeq\{t\in I:\gamma(t)=\delta(t)\}$ は $M$ のハウスドルフ性から閉集合（$(\gamma,\delta)$ による対角線の逆像）。$t\in A$ なら、$\gamma(t)$ を含む座標近傍の中で Step 1 の一意性から $t$ の近傍で一致するので $A$ は開集合。$I$ は連結で $t_{0}\in A$ なので $A=I$。

**Step 3（1）.** $m$ を始点とする積分曲線の定義域の和を $I_{m}$ とすると、Step 2 から各曲線は共通部分で一致し、$I_{m}$ 上の積分曲線 $\gamma_{m}$ が定まる。最大性と一意性は構成から。$I_{m}$ は開区間：右端 $b\in I_{m}$ なら、$\gamma_{m}(b)$ を始点とする積分曲線（Step 1）をつなぐと延長でき（つないだ曲線は座標近傍の中で積分方程式を満たし、\ref{ode:integral-equation} から積分曲線）、最大性に反する。

**Step 4（3 の群の性質）.** $t\in I_{m}$ について $s\mapsto\gamma_{m}(s+t)$ は $\phi_{t}(m)$ を始点とする積分曲線で、定義域は $I_{m}-t$。最大性から $I_{m}-t\subset I_{\phi_{t}(m)}$。逆に $u\mapsto\gamma_{\phi_{t}(m)}(u-t)$ は $I_{\phi_{t}(m)}+t$ 上の積分曲線で、時刻 $t$ に $\gamma_{m}(t)$ を通るので、Step 2 と最大性から $\gamma_{m}$ の制限で、$I_{\phi_{t}(m)}+t\subset I_{m}$。よって $I_{\phi_{t}(m)}=I_{m}-t$、$\phi_{s}(\phi_{t}(m))=\gamma_{m}(s+t)=\phi_{s+t}(m)$。

**Step 5（2：局所版）.** 【主張：各 $p\in M$ に $\varepsilon>0$ と開近傍 $V$ があって、$(-\varepsilon,\varepsilon)\times V\subset\mathcal{D}$ で、$\phi$ はその上で滑らか】$p$ を含む座標近傍 $(U,\psi)$ と Step 1 の $F$ をとり、$F$ の流れを $\Phi$ とする（\ref{ode:flow-theorem}）。その定義域 $\mathcal{D}_{F}$ は開集合で $(0,\psi(p))$ を含むので、$\varepsilon>0$ と $\psi(p)$ の開近傍 $V'\subset\psi(U)$ で $(-\varepsilon,\varepsilon)\times V'\subset\mathcal{D}_{F}$ となるものがある。$V\defeq\psi^{-1}(V')$ とする。$m\in V$ について、$t\mapsto\psi^{-1}(\Phi_{t}(\psi(m)))$（$|t|<\varepsilon$）は $m$ を始点とする積分曲線なので $\gamma_{m}$ の制限で、$(-\varepsilon,\varepsilon)\subset I_{m}$、$\phi(t,m)=\psi^{-1}(\Phi(t,\psi(m)))$。右辺は $C^{\infty}$ 級の写像の合成（\ref{ode:flow-theorem.1}）。

**Step 6（2：大域版）.** $m_{0}\in M$ を固定し、$b\defeq\sup I_{m_{0}}$ とする。$T\defeq\{t\in[0,b):\ [0,t]\text{ を含む開区間 }J\text{ と }m_{0}\text{ の開近傍 }U_{0}\text{ で、}J\times U_{0}\subset\mathcal{D}\text{ かつ }\phi\text{ が }J\times U_{0}\text{ 上で滑らかなものがある}\}$ とし、$\tau\defeq\sup T$ とする。Step 5 から $0\in T$。【主張：$\tau=b$】$\tau<b$ とする。$q\defeq\phi(\tau,m_{0})$ に Step 5 を使って $\varepsilon$, $V$ をとる。$\gamma_{m_{0}}$ の連続性から、$t_{1}\in T$ で $\tau-\varepsilon/2<t_{1}\le\tau$ かつ $\phi(t_{1},m_{0})\in V$ となるものがある（$T$ は区間 $[0,\tau)$ を含む。$\tau\in T$ のときは $t_{1}=\tau$ でもよい）。$t_{1}\in T$ に対する $J$, $U_{0}$ をとり、$\phi_{t_{1}}$ の連続性から $U_{0}$ を小さくして $\phi_{t_{1}}(U_{0})\subset V$ とする。$m\in U_{0}$, $|t-t_{1}|<\varepsilon$ なら、$\phi_{t_{1}}(m)\in V$ なので $t-t_{1}\in I_{\phi_{t_{1}}(m)}$（Step 5）、Step 4 から $t\in I_{m}$ で
$$
\phi(t,m)=\phi\bigl(t-t_{1},\phi(t_{1},m)\bigr).
$$
右辺は $(t,m)$ について滑らか（$\phi(t_{1},\cdot)$ は $U_{0}$ 上で滑らか、$\phi$ は $(-\varepsilon,\varepsilon)\times V$ 上で滑らか）。よって $\bigl(J\cup(t_{1}-\varepsilon,t_{1}+\varepsilon)\bigr)\times U_{0}\subset\mathcal{D}$ で、その上で $\phi$ は滑らか。この開区間は $[0,t_{1}+\varepsilon/2]$ を含み、$t_{1}+\varepsilon/2>\tau$ なので（$t_{1}+\varepsilon/2<b$ の範囲で）$\tau$ の定義に反する。よって $\tau=b$ で、各 $t\in[0,b)$ について $(t,m_{0})$ の近傍で $\mathcal{D}$ は開で $\phi$ は滑らか。$t\le0$ も同様。$m_{0}$ は任意なので 2 が示された。

**Step 7（3 の残り）.** $M_{t}$ は開集合 $\mathcal{D}$ の切り口なので開集合。$m\in M_{t}$ なら Step 4 から $\phi_{t}(m)\in M_{-t}$ で $\phi_{-t}(\phi_{t}(m))=m$。対称に $\phi_{t}\circ\phi_{-t}=\mathrm{id}_{M_{-t}}$。両方滑らか（2）なので微分同相写像。

**Step 8（4）.** 台 $K$ の外の点では $X=0$ で、$\gamma_{m}$ は定値曲線、$I_{m}=\mathbb{R}$。$\mathcal{D}$ は $\{0\}\times K$ を含む開集合で $K$ はコンパクトなので、ある $\varepsilon>0$ で $(-\varepsilon,\varepsilon)\times K\subset\mathcal{D}$、したがってすべての $m$ で $(-\varepsilon,\varepsilon)\subset I_{m}$。$I_{m}\neq\mathbb{R}$ で例えば $\sup I_{m}=b<\infty$ とすると、$t\in(b-\varepsilon,b)$ について 3 から $I_{\phi_{t}(m)}\supset(-\varepsilon,\varepsilon)$ かつ $I_{m}\supset t+I_{\phi_{t}(m)}\ni t+\varepsilon/2>b$ で矛盾。$\inf$ も同様。準同型であることは 3 から。

::: hypcheck
- **ハウスドルフ性**：Step 2 で、一致する点の集合が閉集合であることに使った。原点が二つある直線では、積分曲線が一意にならない。
- **ユークリッド空間の流れの定理**（\ref{ode:flow-theorem}）：Step 5 で、局所的な滑らかさに使った。これは常微分方程式の解の初期値への $C^{\infty}$ 依存性（\ref{ode:ck-dependence}）による。
- **Step 6 の継続の議論**：局所的な滑らかさを、群の性質で時間方向につないだ。$\mathcal{D}$ が開集合であることは、この議論の副産物である。
:::
:::

## リー微分 {#mfd:sec-fl-lie-derivative}

::: definition リー微分 {#mfd:lie-derivative keywords="Lie derivative of functions, vector fields and differential forms along the flow of X" index="リー微分|りーびぶん"}
$X\in\mathfrak{X}(M)$ の流れを $\phi$ とする。$m\in M$ について、$|t|$ が小さければ $\phi_{t}$ は $m$ の近傍で定義された微分同相写像である（\ref{mfd:flow-theorem.3}）。
1. $f\in C^{\infty}(M)$ について $(\mathcal{L}_{X}f)(m)\defeq\frac{d}{dt}\big|_{t=0}f(\phi_{t}(m))$。
2. $Y\in\mathfrak{X}(M)$ について $(\mathcal{L}_{X}Y)_{m}\defeq\frac{d}{dt}\big|_{t=0}\,d(\phi_{-t})_{\phi_{t}(m)}\bigl(Y_{\phi_{t}(m)}\bigr)$（$T_{m}M$ の中の曲線の微分）。
3. $\omega\in\Omega^{k}(M)$ について $(\mathcal{L}_{X}\omega)_{m}\defeq\frac{d}{dt}\big|_{t=0}(\phi_{t}^{*}\omega)_{m}$（$\Lambda^{k}T_{m}^{*}M$ の中の曲線の微分）。

これらを $X$ による**リー微分**という。\ref{mfd:flow-theorem.2} から、座標で見ると被微分関数は $(t,m)$ について滑らかで、結果は滑らかな関数・ベクトル場・形式になる。
:::

::: intuition
リー微分は、流れに乗って少し先の値を見て、それを流れで手元に運び戻し、手元の値と比べた変化率である。関数なら流れの方向の微分、ベクトル場なら「流れで運んだときにどれだけ曲がるか」になる。
:::

::: proposition リー微分とリー括弧 {#mfd:lie-derivative-bracket keywords="L_X f = X f and L_X Y = [X, Y]" index="リー微分とリー括弧|りーびぶんとりーかっこ"}
$\mathcal{L}_{X}f=Xf$、$\mathcal{L}_{X}Y=[X,Y]$。
:::

::: proof
**Step 1（関数）.** $t\mapsto\phi_{t}(m)$ は積分曲線なので、$\frac{d}{dt}|_{0}f(\phi_{t}(m))=df_{m}(\gamma_{m}'(0))=X_{m}f$。

**Step 2（ベクトル場）.** 【主張：$(\mathcal{L}_{X}Y)_{m}f=X_{m}(Yf)-Y_{m}(Xf)$】$m$ の近くの関数 $f$ について $g(t,s)\defeq\bigl(Y(f\circ\phi_{s})\bigr)(\phi_{t}(m))$ とおくと、$(t,s)$ が $0$ の近くで定義され、\ref{mfd:flow-theorem.2} から滑らか。$d(\phi_{-t})(Y_{\phi_{t}(m)})f=Y_{\phi_{t}(m)}(f\circ\phi_{-t})=g(t,-t)$ なので、求める値は $\partial_{t}g(0,0)-\partial_{s}g(0,0)$。$\partial_{t}g(0,0)$ は関数 $Y(f\circ\phi_{0})=Yf$ の積分曲線に沿った微分で、Step 1 から $X_{m}(Yf)$。$\partial_{s}g(0,0)$：座標近傍で $Y(f\circ\phi_{s})(p)=\sum_{i}Y^{i}(p)\,\partial_{i}\bigl(f(\phi_{s}(p))\bigr)$ で、$(s,p)\mapsto f(\phi_{s}(p))$ は滑らかなので $\partial_{s}$ と $\partial_{i}$ は交換し、$\partial_{s}f(\phi_{s}(p))|_{s=0}=(Xf)(p)$。よって $\partial_{s}g(0,0)=\sum_{i}Y^{i}(m)\partial_{i}(Xf)(m)=Y_{m}(Xf)$。リー括弧の定義（\ref{mfd:lie-bracket}）から主張が従う。
:::

## 内部積とカルタンの公式 {#mfd:sec-fl-cartan}

::: definition 内部積 {#mfd:interior-product keywords="interior product i_X omega (v_1, ..., v_{k-1}) = omega(X, v_1, ..., v_{k-1}); antiderivation of degree -1" index="内部積|ないぶせき, 内積（形式とベクトル場）|ないせきけいしきとべくとるば"}
$X\in\mathfrak{X}(M)$, $\omega\in\Omega^{k}(M)$（$k\ge1$）について、$(k-1)$ 形式 $i_{X}\omega$ を $(i_{X}\omega)_{m}(v_{1},\dots,v_{k-1})\defeq\omega_{m}(X_{m},v_{1},\dots,v_{k-1})$ で定め、$i_{X}f\defeq0$（$f\in\Omega^{0}$）とする。$X$ による**内部積**という。
:::

::: proposition 内部積の性質 {#mfd:interior-product-properties keywords="i_X is C^infinity linear, an antiderivation of degree -1, and i_X i_X = 0" index="内部積の性質|ないぶせきのせいしつ"}
1. $i_{X}\omega$ は滑らかで、$i_{X}$ は $C^{\infty}(M)$ 線形（$i_{fX}=f\,i_{X}$, $i_{X}(f\omega)=f\,i_{X}\omega$）。
2. $i_{X}(\omega\wedge\eta)=i_{X}\omega\wedge\eta+(-1)^{k}\omega\wedge i_{X}\eta$（$\omega\in\Omega^{k}$）。
3. $i_{X}\circ i_{X}=0$、$i_{X}df=Xf$。
:::

::: proof
**1.** 座標で $\omega=\sum f_{I}dx_{I}$、$X=\sum X^{j}\partial_{j}$ とすると、$i_{X}\omega$ の係数は $f_{I}$ と $X^{j}$ の積和で滑らか。線形性は定義から。

**2.** 両辺は $\omega,\eta$ について双線形なので、各点で $\omega=\theta_{1}\wedge\cdots\wedge\theta_{k}$, $\eta=\theta_{k+1}\wedge\cdots\wedge\theta_{k+l}$（$\theta_{a}\in T_{m}^{*}M$）の場合に示せばよい（\ref{mfd:abstract-wedge.3}）。行列式の規約から $(\theta_{1}\wedge\cdots\wedge\theta_{p})(X,v_{2},\dots,v_{p})$ を第 1 列で展開すると
$$
i_{X}(\theta_{1}\wedge\cdots\wedge\theta_{p})=\sum_{a=1}^{p}(-1)^{a-1}\theta_{a}(X)\,\theta_{1}\wedge\cdots\widehat{\theta_{a}}\cdots\wedge\theta_{p}.
$$
$p=k+l$ でこの和を $a\le k$ と $a>k$ に分けると、前者は $i_{X}\omega\wedge\eta$、後者は符号 $(-1)^{a-1}=(-1)^{k}(-1)^{a-k-1}$ から $(-1)^{k}\omega\wedge i_{X}\eta$。

**3.** $(i_{X}i_{X}\omega)(v,\dots)=\omega(X,X,\dots)=0$（交代性）。$i_{X}df=df(X)=Xf$。
:::

::: theorem カルタンの公式 {#mfd:cartan-formula keywords="Cartan's magic formula L_X = d i_X + i_X d on differential forms; L_X commutes with d; L_X is a derivation of the wedge product" index="カルタンの公式|かるたんのこうしき, カルタンの魔法の公式|かるたんのまほうのこうしき" refname="カルタンの公式"}
$X\in\mathfrak{X}(M)$, $\omega\in\Omega^{k}(M)$ について
$$
\mathcal{L}_{X}\omega=d(i_{X}\omega)+i_{X}(d\omega).
$$
とくに $\mathcal{L}_{X}\circ d=d\circ\mathcal{L}_{X}$、$\mathcal{L}_{X}(\omega\wedge\eta)=\mathcal{L}_{X}\omega\wedge\eta+\omega\wedge\mathcal{L}_{X}\eta$。
:::

::: intuition
形式を流れで運んだときの変化は、「先に $X$ を差し込んでから外微分する」ものと「先に外微分してから $X$ を差し込む」ものの和に分かれる。計量も接続も使わず、可微分構造だけから決まる普遍的な等式である。
:::

::: proof
$P\defeq d\,i_{X}+i_{X}\,d$ とおく。

**Step 1（$\mathcal{L}_{X}$ の性質）.** 【主張：$\mathcal{L}_{X}$ は (a) $\mathcal{L}_{X}f=Xf$、(b) $\wedge$ について導分、(c) $d$ と交換、(d) 局所的（$\omega$ が開集合 $W$ で $0$ なら $\mathcal{L}_{X}\omega$ も $W$ で $0$）】(a) は \ref{mfd:lie-derivative-bracket}。(b)：$\phi_{t}^{*}(\omega\wedge\eta)=\phi_{t}^{*}\omega\wedge\phi_{t}^{*}\eta$（\ref{mfd:pullback-properties}）で、$m$ ごとに有限次元空間の双線形写像の値の $t$ 微分に積の法則を使う。(c)：$\phi_{t}^{*}d\omega=d\phi_{t}^{*}\omega$（\ref{mfd:exterior-derivative.5}）。座標で $\phi_{t}^{*}\omega$ の係数は $(t,x)$ について滑らかで（\ref{mfd:flow-theorem.2}）、$d$ は係数の $x$ 偏微分なので、$t$ 微分と交換する。(d)：$m\in W$ なら小さい $t$ で $\phi_{t}(m)\in W$ で、$(\phi_{t}^{*}\omega)_{m}=0$。

**Step 2（$P$ の性質）.** 【主張：$P$ も (a)〜(d) を満たす】(a)：$Pf=i_{X}df=Xf$（\ref{mfd:interior-product-properties.3}）。(b)：$d$ と $i_{X}$ はそれぞれ次数 $+1$, $-1$ の反導分（\ref{mfd:exterior-derivative.2}, \ref{mfd:interior-product-properties.2}）なので、$\omega\in\Omega^{k}$ について
$$
d\,i_{X}(\omega\wedge\eta)=d(i_{X}\omega)\wedge\eta+(-1)^{k-1}i_{X}\omega\wedge d\eta+(-1)^{k}d\omega\wedge i_{X}\eta+\omega\wedge d\,i_{X}\eta,
$$
$$
i_{X}d(\omega\wedge\eta)=i_{X}d\omega\wedge\eta+(-1)^{k+1}d\omega\wedge i_{X}\eta+(-1)^{k}i_{X}\omega\wedge d\eta+\omega\wedge i_{X}d\eta.
$$
足すと中央の 4 項が打ち消し合い、$P(\omega\wedge\eta)=P\omega\wedge\eta+\omega\wedge P\eta$。(c)：$dP=d\,i_{X}\,d=Pd$（$d\circ d=0$）。(d)：$d$ と $i_{X}$ は局所的。

**Step 3（一致）.** 【主張：(a)〜(d) を満たす $\mathbb{R}$ 線形な作用素 $Q$ は $\mathcal{L}_{X}$ と一致する】$Q\defeq\mathcal{L}_{X}-P$ は (b)〜(d) を満たし $Qf=0$。(d) から、点 $m$ の近くで $\omega$ に一致する形式で計算してよい。$m$ を含む座標近傍で $\omega=\sum f_{I}dx_{i_{1}}\wedge\cdots\wedge dx_{i_{k}}$ とし、隆起関数で $f_{I}$, $x_{i}$ を $m$ の近くで一致する $M$ 上の関数 $\tilde f_{I}$, $\tilde x_{i}$ に延ばす（\ref{mfd:smooth-urysohn}）。$\tilde\omega\defeq\sum\tilde f_{I}\,d\tilde x_{i_{1}}\wedge\cdots\wedge d\tilde x_{i_{k}}$ は $m$ の近くで $\omega$ に一致し、(b) と $Q\tilde f_{I}=0$、$Q\,d\tilde x_{i}=d\,Q\tilde x_{i}=0$ から $Q\tilde\omega=0$。よって $(Q\omega)_{m}=0$。

**Step 4（とくに）.** 交換と導分の性質は Step 1 の (b), (c)。

::: hypcheck
- **流れの滑らかさ**：Step 1 (c) で $t$ 微分と $x$ 偏微分を交換するのに使った（\ref{mfd:flow-theorem.2}）。
- **局所性と隆起関数**：Step 3 で、座標関数を多様体全体の関数に延ばすのに使った。
:::
:::

::: corollary 1 形式の外微分の公式 {#mfd:d-one-form keywords="d omega(X, Y) = X omega(Y) - Y omega(X) - omega([X, Y]) for 1-forms; interior product and Lie derivative commutator" index="外微分の不変な公式|がいびぶんのふへんなこうしき"}
$\omega\in\Omega^{1}(M)$, $X,Y\in\mathfrak{X}(M)$ について
$$
d\omega(X,Y)=X\bigl(\omega(Y)\bigr)-Y\bigl(\omega(X)\bigr)-\omega([X,Y]).
$$
:::

::: proof
**Step 1（$\mathcal{L}_{X}$ と $i_{Y}$ の交換子）.** 【主張：$\mathcal{L}_{X}(\omega(Y))=(\mathcal{L}_{X}\omega)(Y)+\omega([X,Y])$】点 $m$ で $(\phi_{t}^{*}\omega)_{m}\bigl(d(\phi_{-t})Y_{\phi_{t}(m)}\bigr)=\omega_{\phi_{t}(m)}(Y_{\phi_{t}(m)})$（$d\phi_{t}\circ d\phi_{-t}=\mathrm{id}$）。左辺は二つの曲線 $\alpha(t)\in T_{m}^{*}M$, $v(t)\in T_{m}M$ の対 $\alpha(t)(v(t))$ で、$t=0$ で微分すると積の法則から $(\mathcal{L}_{X}\omega)_{m}(Y_{m})+\omega_{m}((\mathcal{L}_{X}Y)_{m})$。右辺の微分は $X_{m}(\omega(Y))$。\ref{mfd:lie-derivative-bracket} を使う。

**Step 2.** カルタンの公式から $(\mathcal{L}_{X}\omega)(Y)=(d\,i_{X}\omega)(Y)+(i_{X}d\omega)(Y)=Y(\omega(X))+d\omega(X,Y)$。Step 1 に代入して整理すればよい。
:::

::: supplement
**高い視点：作用素の代数.** $d$（次数 $+1$）、$i_{X}$（次数 $-1$）、$\mathcal{L}_{X}$（次数 $0$）は、$\Omega^{\bullet}(M)$ の上の次数つき導分で、次数つき交換子について
$$
[d,d]=2d^{2}=0,\quad[i_{X},i_{Y}]=0,\quad[d,i_{X}]=\mathcal{L}_{X},\quad[\mathcal{L}_{X},i_{Y}]=i_{[X,Y]},\quad[\mathcal{L}_{X},\mathcal{L}_{Y}]=\mathcal{L}_{[X,Y]}
$$
を満たすことが知られている（第 1 式と第 3 式はこのページで示した。ほかも同じ型の議論で示せる）。カルタンの公式は「$d$ と $i_{X}$ の交換子がリー微分」という一行の主張で、比喩で言えば、「無限小の動き $X$」に対する微分形式の変化が、「$X$ を差し込む」と「境界をとる（$d$）」という二つの基本操作の組み合わせで完全に書ける、ということである。いずれも計量を使わない（関手的な）操作なので、多様体論の基本的な道具に属する。

**前提を変えると.** カルタンの公式は、流れを使わずに $\mathcal{L}_{X}\defeq d\,i_{X}+i_{X}\,d$ と代数的に定義することもでき、その場合は流れの滑らかさ（事実）を使わずに済む。ただし、そのときは「流れに沿った変化率」という意味づけが失われる。
:::

## 問題 {#mfd:sec-fl-problems}

::: problem {#mfd:prob-fl-rotation}
$\mathbb{R}^{2}$ 上のベクトル場 $X=-y\,\partial_{x}+x\,\partial_{y}$ の流れを求め、$\omega=dx\wedge dy$ について $\mathcal{L}_{X}\omega=0$ を、流れを使う方法とカルタンの公式の両方で確かめよ。
:::

::: solution
$\phi_{t}(x,y)=(x\cos t-y\sin t,\ x\sin t+y\cos t)$（回転）は $\phi_{0}=\mathrm{id}$ で、$t$ で微分すると $(-\phi_{t}^{2},\phi_{t}^{1})$、つまり $X_{\phi_{t}}$ なので流れ。回転のヤコビ行列式は $1$ なので $\phi_{t}^{*}(dx\wedge dy)=dx\wedge dy$（\ref{mfd:pullback-properties} と行列式）、よって $\mathcal{L}_{X}\omega=0$。カルタンの公式では $d\omega=0$ で、$i_{X}\omega=-y\,dy-x\,dx$（$\omega(X,\cdot)=X^{1}dy-X^{2}dx$）、$d(i_{X}\omega)=-dy\wedge dy-dx\wedge dx=0$。
:::

::: problem {#mfd:prob-fl-incomplete}
$\mathbb{R}$ 上のベクトル場 $X=t^{2}\,\partial_{t}$ は完備でないことを示せ。
:::

::: solution
始点 $a>0$ の積分曲線は $\gamma'=\gamma^{2}$ を解いて $\gamma(s)=a/(1-as)$ で、$s\to1/a$ で発散するので $I_{a}=(-\infty,1/a)\neq\mathbb{R}$。台はコンパクトでなく（$t\neq0$ で $X\neq0$）、\ref{mfd:flow-theorem.4} の仮定を満たさない。
:::
