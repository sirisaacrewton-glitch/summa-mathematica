# 演習：可微分多様体 {#mfd:page-exercises-manifolds keywords="exercises, smooth manifolds, regular values, differential forms, exterior derivative, Stokes theorem, Brouwer fixed point theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#mfd:sec-exmanifolds-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$\mathbb{R}^{n}$ の座標を $x_{1},\dots,x_{n}$（$n=3$ では $x,y,z$）とも書く。
:::

## 可微分多様体と接空間 {#mfd:sec-sm-exercises}

対応するページ：\ref{mfd:page-smooth-manifolds}

::: problem ★ 基本：トーラスへの写像 {#mfd:ex-sm-1}
$S^{1}\subset\mathbb{R}^{2}$ と $T^{2}\defeq S^{1}\times S^{1}$（積多様体）について、$F\colon\mathbb{R}^{2}\to T^{2}$, $F(s,t)=\bigl((\cos s,\sin s),(\cos t,\sin t)\bigr)$ は滑らかで、各点で $dF$ が線形同型であることを示せ。
:::

::: solution
$\mathbb{R}\to S^{1}$, $s\mapsto(\cos s,\sin s)$ を $e$ とすると $F=e\times e$。$e$ は $\mathbb{R}^{2}$ への写像として滑らかで像が $S^{1}$ に入るので、$S^{1}$ への写像として滑らか（\ref{mfd:submanifold-structure.3}。$S^{1}$ は正則値定理から部分多様体）。$e'(s)=(-\sin s,\cos s)\neq0$ で $T_{e(s)}S^{1}$ は 1 次元（\ref{mfd:regular-value-theorem}）なので $de_{s}$ は同型。積写像の微分は成分ごとの微分の直和（\ref{mfd:prob-sm-product-tangent}）なので $dF$ も同型。
:::

## 1 の分割と部分多様体 {#mfd:sec-ps-exercises}

対応するページ：\ref{mfd:page-partitions-submanifolds}

::: problem ★ 基本：一葉双曲面 {#mfd:ex-ps-1}
$f(x,y,z)=x^{2}+y^{2}-z^{2}$ とする。$f^{-1}(1)$ は $\mathbb{R}^{3}$ の 2 次元の部分多様体であることを示せ。また $0$ は $f$ の正則値でないことを示せ。
:::

::: solution
$df_{p}(v)=2(xv_{1}+yv_{2}-zv_{3})$（\ref{mfd:differential-properties.4}）は $p\neq0$ なら $0$ でなく、1 次元への線形写像として全射。$f^{-1}(1)$ は原点を含まないので $1$ は正則値で、\ref{mfd:regular-value-theorem} から 2 次元の部分多様体。$0\in f^{-1}(0)$ で $df_{0}=0$ は全射でないので、$0$ は正則値でない（$f^{-1}(0)$ は原点で尖った円錐）。
:::

::: problem ★★ 標準：コンパクトな台の関数 {#mfd:ex-ps-2}
空でない可微分多様体 $M$（$\dim M\ge1$）上の滑らかな関数の空間 $C^{\infty}(M)$ は無限次元であることを示せ。
:::

::: solution
$M$ の一つの座標近傍 $(U,\varphi)$ で $\varphi(U)\supset B(0,3)$ のものをとる（\ref{mfd:manifold-topology.1}）。$k=1,2,\dots$ について $\mathbb{R}^{d}$ の点 $a_{k}\defeq(1/k,0,\dots,0)$ のまわりの、互いに交わらない小さい球に台をもつ隆起関数（\ref{mfd:bump-function} を縮小・平行移動したもの）$\beta_{k}$ をとり、$g_{k}\defeq\beta_{k}\circ\varphi$（$U$ の外では $0$）とする。台が交わらないので $g_{1},\dots,g_{N}$ は任意の $N$ で一次独立（$\sum c_{k}g_{k}=0$ を $\varphi^{-1}(a_{j})$ で評価すると $c_{j}=0$）。
:::

## 多様体上の微分形式 {#mfd:sec-fm-exercises}

対応するページ：\ref{mfd:page-forms-on-manifolds}

::: problem ★ 基本：外微分の計算 {#mfd:ex-fm-1}
$\mathbb{R}^{3}$ 上の $\omega=x\,dy\wedge dz+y\,dz\wedge dx+z\,dx\wedge dy$ について $d\omega=3\,dx\wedge dy\wedge dz$ を示せ。また $\eta=yz\,dx+zx\,dy+xy\,dz$ は閉形式であることを示し、$\eta=dg$ となる関数 $g$ を求めよ。
:::

::: solution
\ref{mfd:exterior-derivative.4} から $d\omega=dx\wedge dy\wedge dz+dy\wedge dz\wedge dx+dz\wedge dx\wedge dy$。$dy\wedge dz\wedge dx$ と $dz\wedge dx\wedge dy$ は $dx\wedge dy\wedge dz$ を巡回置換（偶置換）で並べ替えたものなので、どちらも $dx\wedge dy\wedge dz$。よって $d\omega=3\,dx\wedge dy\wedge dz$。$\eta$ について $d\eta=(z\,dy+y\,dz)\wedge dx+(z\,dx+x\,dz)\wedge dy+(y\,dx+x\,dy)\wedge dz$ で、$dy\wedge dx$ の項 $z$ と $dx\wedge dy$ の項 $z$ が打ち消し合い（同様に他の 2 組も）、$d\eta=0$。$g=xyz$ とすると $dg=yz\,dx+xz\,dy+xy\,dz=\eta$。
:::

## 向き・積分とストークスの定理 {#mfd:sec-is-exercises}

対応するページ：\ref{mfd:page-integration-stokes}

::: problem ★★ 標準：球面の面積 {#mfd:ex-is-1}
$D\subset\mathbb{R}^{3}$ を閉単位球、$\omega$ を \ref{mfd:ex-fm-1} の 2 形式とする。$D$ は境界つき領域で $\partial D=S^{2}$ であることを確かめ、ストークスの定理を使って $\int_{S^{2}}\omega=4\pi$ を示せ。また $\omega$ の $S^{2}$ への引き戻しは体積形式であることを示せ。
:::

::: solution
$|x|<1$ の点は内点、$|x|>1$ は外点。$|p|=1$ の点では、$h(x)\defeq|x|^{2}-1$ の微分が $p$ で $0$ でないので、\ref{mfd:normal-forms.2} から $p$ のまわりに座標近傍で最後の座標が $h$ になるものがあり、$D=\{h\le0\}$ なので半空間型（\ref{mfd:regular-domain}）。よって $\partial D=S^{2}$。$D$ はコンパクトなので台の条件は問題なく（$\omega$ に $D$ の近くで $1$ の隆起関数を掛けてよい）、\ref{mfd:stokes-theorem} から $\int_{S^{2}}\omega=\int_{D}3\,dx\wedge dy\wedge dz=3\cdot\frac{4\pi}{3}=4\pi$（\ref{calc:ball-volume}）。体積形式であること：$p\in S^{2}$ と $T_{p}S^{2}=p^{\perp}$ の基底 $v,w$ について $\omega_{p}(v,w)=\det(p,v,w)$（$\omega_{p}(v,w)$ は $p$ と $v\times w$ の内積）で、$p,v,w$ は一次独立なので $0$ でない。
:::

::: problem ★★★ 発展：ブラウワーの不動点定理（滑らかな場合） {#mfd:ex-is-2}
$B\subset\mathbb{R}^{n}$ を閉単位球（$n\ge2$）とする。$B$ の開近傍で定義された滑らかな写像 $r$ で、$r(B)\subset S^{n-1}$ かつ $S^{n-1}$ 上で恒等写像となるもの（**滑らかなレトラクション**）はないことを、ストークスの定理を使って示せ。（これから、滑らかな写像 $B\to B$ が不動点をもつことが従う。）
:::

::: solution
$\sigma\defeq\sum_{i}(-1)^{i-1}x_{i}\,dx_{1}\wedge\cdots\widehat{dx_{i}}\cdots\wedge dx_{n}$ とすると $d\sigma=n\,dx_{1}\wedge\cdots\wedge dx_{n}$ で、ストークスの定理から $\int_{S^{n-1}}\sigma=n\,v(B)\neq0$。$\iota\colon S^{n-1}\to\mathbb{R}^{n}$ を包含、$\sigma_{0}\defeq\iota^{*}\sigma$ を $S^{n-1}$ 上の $(n-1)$ 形式とする。$r$ があるとし、$r$ を $S^{n-1}$ への写像とみると（\ref{mfd:submanifold-structure.3}）、$r\circ\iota=\mathrm{id}$ なので $\iota^{*}(r^{*}\sigma_{0})=\sigma_{0}$。ストークスの定理から
$$
\int_{S^{n-1}}\sigma_{0}=\int_{\partial B}r^{*}\sigma_{0}=\int_{B}d(r^{*}\sigma_{0})=\int_{B}r^{*}(d\sigma_{0}).
$$
$d\sigma_{0}$ は $(n-1)$ 次元多様体上の $n$ 形式なので $0$（\ref{mfd:de-rham-properties.4} の証明）。よって左辺は $0$ で矛盾。不動点：$g\colon B\to B$ が不動点をもたなければ、$g(x)$ から $x$ へ向かう半直線と $S^{n-1}$ の交点として滑らかなレトラクションが作れることが知られている（$g$ が $B$ の開近傍で定義され滑らかな場合、交点の公式は二次方程式の解で、根号の中は正）。
:::

## 接束とベクトル場 {#mfd:sec-tb-exercises}

対応するページ：\ref{mfd:page-tangent-bundle}

::: problem ★ 基本：回転のベクトル場のリー括弧 {#mfd:ex-tb-1}
$\mathbb{R}^{3}$ 上のベクトル場
$$
X\defeq-z\,\partial_{y}+y\,\partial_{z},\qquad Y\defeq z\,\partial_{x}-x\,\partial_{z},\qquad Z\defeq-y\,\partial_{x}+x\,\partial_{y}
$$
について、$[X,Y]$, $[Y,Z]$, $[Z,X]$ を求め、ヤコビ恒等式が成り立つことを直接確かめよ。また $r^{2}\defeq x^{2}+y^{2}+z^{2}$ について $Xr^{2}=Yr^{2}=Zr^{2}=0$ を示せ。
:::

::: solution
成分を $X=(0,-z,y)$, $Y=(z,0,-x)$, $Z=(-y,x,0)$ と並べ、\ref{mfd:lie-bracket} の座標表示 $[X,Y]^{j}=\sum_{i}(X^{i}\partial_{i}Y^{j}-Y^{i}\partial_{i}X^{j})=X(Y^{j})-Y(X^{j})$ を使う。

**$[X,Y]$.** $X(Y^{1})=X(z)=y$, $X(Y^{2})=0$, $X(Y^{3})=X(-x)=0$。$Y(X^{1})=0$, $Y(X^{2})=Y(-z)=-(-x)=x$, $Y(X^{3})=Y(y)=0$。よって
$$
[X,Y]=(y,-x,0)=y\,\partial_{x}-x\,\partial_{y}=-Z.
$$

**$[Y,Z]$.** $Y(Z^{1})=Y(-y)=0$, $Y(Z^{2})=Y(x)=z$, $Y(Z^{3})=0$。$Z(Y^{1})=Z(z)=0$, $Z(Y^{2})=0$, $Z(Y^{3})=Z(-x)=y$。よって $[Y,Z]=(0,z,-y)=-X$。

**$[Z,X]$.** $Z(X^{1})=0$, $Z(X^{2})=Z(-z)=0$, $Z(X^{3})=Z(y)=x$。$X(Z^{1})=X(-y)=z$, $X(Z^{2})=X(x)=0$, $X(Z^{3})=0$。よって $[Z,X]=(-z,0,x)=-Y$。

**ヤコビ恒等式.** 双線形性と反対称性（\ref{mfd:lie-bracket-properties.1}）から $[X,[Y,Z]]=-[X,X]=0$、同様に $[Y,[Z,X]]=-[Y,Y]=0$, $[Z,[X,Y]]=-[Z,Z]=0$ なので、和は $0$ である。

**$r^{2}$ の微分.** $Xr^{2}=-z\cdot2y+y\cdot2z=0$, $Yr^{2}=z\cdot2x-x\cdot2z=0$, $Zr^{2}=-y\cdot2x+x\cdot2y=0$。（三つのベクトル場は原点を中心とする球面に接する。括弧の符号は、交換子 $XY-YX$ を使う \ref{mfd:lie-bracket} の約束による。）
:::

::: problem ★★ 標準：極座標と $F$ 関係 {#mfd:ex-tb-2}
$W\defeq(0,\infty)\times\mathbb{R}$（座標 $(r,\theta)$）から $\mathbb{R}^{2}\setminus\{0\}$ への写像 $F(r,\theta)\defeq(r\cos\theta,r\sin\theta)$ と、$\rho\defeq\sqrt{x^{2}+y^{2}}$ について、$\mathbb{R}^{2}\setminus\{0\}$ 上のベクトル場
$$
\tilde X\defeq\frac{x}{\rho}\,\partial_{x}+\frac{y}{\rho}\,\partial_{y},\qquad\tilde Y\defeq-y\,\partial_{x}+x\,\partial_{y}
$$
を考える。
1. $\partial_{r}\sim_{F}\tilde X$, $\partial_{\theta}\sim_{F}\tilde Y$ を示し、これから $[\tilde X,\tilde Y]=0$ を導け。
2. $[\tilde X,\tilde Y]=0$ を座標表示で直接確かめよ。
3. $[\tilde X,\rho\tilde Y]$ を求めよ。
:::

::: solution
**1.** \ref{mfd:differential-properties.4} から $dF_{(r,\theta)}$ はヤコビ行列 $\begin{pmatrix}\cos\theta&-r\sin\theta\\ \sin\theta&r\cos\theta\end{pmatrix}$ で、
$$
dF(\partial_{r})=(\cos\theta,\sin\theta),\qquad dF(\partial_{\theta})=(-r\sin\theta,r\cos\theta).
$$
点 $F(r,\theta)=(x,y)$ では $\rho=r$ なので、これらはそれぞれ $\tilde X_{F(r,\theta)}=(x/\rho,y/\rho)$, $\tilde Y_{F(r,\theta)}=(-y,x)$ に等しい。よって $\partial_{r}\sim_{F}\tilde X$, $\partial_{\theta}\sim_{F}\tilde Y$。$\partial_{r}$, $\partial_{\theta}$ の成分は定数なので、\ref{mfd:lie-bracket} の座標表示から $[\partial_{r},\partial_{\theta}]=0$。\ref{mfd:lie-bracket-properties.3} から $[\partial_{r},\partial_{\theta}]\sim_{F}[\tilde X,\tilde Y]$、すなわち各点 $(r,\theta)$ で $[\tilde X,\tilde Y]_{F(r,\theta)}=dF(0)=0$。$F$ は $\mathbb{R}^{2}\setminus\{0\}$ への全射なので $[\tilde X,\tilde Y]=0$。

**2.** $\partial_{x}(x/\rho)=1/\rho-x^{2}/\rho^{3}=y^{2}/\rho^{3}$, $\partial_{y}(x/\rho)=-xy/\rho^{3}$, $\partial_{x}(y/\rho)=-xy/\rho^{3}$, $\partial_{y}(y/\rho)=x^{2}/\rho^{3}$。よって
$$
\tilde Y(x/\rho)=-y\cdot\frac{y^{2}}{\rho^{3}}+x\cdot\frac{-xy}{\rho^{3}}=-\frac{y}{\rho},\qquad\tilde Y(y/\rho)=-y\cdot\frac{-xy}{\rho^{3}}+x\cdot\frac{x^{2}}{\rho^{3}}=\frac{x}{\rho}.
$$
一方 $\tilde X(-y)=-y/\rho$, $\tilde X(x)=x/\rho$。座標表示から $[\tilde X,\tilde Y]=\bigl(\tilde X(-y)-\tilde Y(x/\rho)\bigr)\partial_{x}+\bigl(\tilde X(x)-\tilde Y(y/\rho)\bigr)\partial_{y}=0$。

**3.** \ref{mfd:lie-bracket-properties.2}（$f=1$, $g=\rho$）から $[\tilde X,\rho\tilde Y]=\rho[\tilde X,\tilde Y]+(\tilde X\rho)\tilde Y=(\tilde X\rho)\tilde Y$。$\tilde X\rho=\frac{x}{\rho}\cdot\frac{x}{\rho}+\frac{y}{\rho}\cdot\frac{y}{\rho}=1$ なので $[\tilde X,\rho\tilde Y]=\tilde Y$。
:::

::: problem ★★★ 発展：球面の接束 {#mfd:ex-tb-3}
$n\ge1$ とし、$S^{n}$ を \ref{mfd:regular-value-theorem} による $\mathbb{R}^{n+1}$ の部分多様体として考え、$\iota\colon S^{n}\to\mathbb{R}^{n+1}$ を包含写像、$E\defeq\{(p,v)\in\mathbb{R}^{n+1}\times\mathbb{R}^{n+1}:|p|=1,\ \langle p,v\rangle=0\}$ とする。
1. $E$ は $\mathbb{R}^{2n+2}$ の $2n$ 次元の部分多様体で、$\Phi\colon TS^{n}\to E$, $\Phi(p,v)\defeq(p,d\iota_{p}v)$ は微分同相写像であることを示せ（$T_{p}\mathbb{R}^{n+1}=\mathbb{R}^{n+1}$ と同一視する）。
2. $\mathbb{R}^{4}$ 上の線形なベクトル場
$$
\tilde X_{1}(x)\defeq(-x_{2},x_{1},-x_{4},x_{3}),\quad\tilde X_{2}(x)\defeq(-x_{3},x_{4},x_{1},-x_{2}),\quad\tilde X_{3}(x)\defeq(-x_{4},-x_{3},x_{2},x_{1})
$$
を使い、$TS^{3}$ は $S^{3}\times\mathbb{R}^{3}$ と微分同相であることを示せ（ファイバー上で線形なものを作れ）。
:::

::: solution
**1. Step 1（$E$ は部分多様体）.** $G\colon\mathbb{R}^{n+1}\times\mathbb{R}^{n+1}\to\mathbb{R}^{2}$, $G(p,v)\defeq(|p|^{2},\langle p,v\rangle)$ とすると、$DG(p,v)$ の 2 行は $(2p^{\mathsf{T}},0)$ と $(v^{\mathsf{T}},p^{\mathsf{T}})$。$\alpha(2p,0)+\beta(v,p)=0$ なら後半の成分から $\beta p=0$ で、$p\neq0$ なら $\beta=0$、すると $\alpha=0$。よって $p\neq0$ で $DG$ は全射。$G^{-1}(1,0)=E$ の点では $|p|=1$ なので $(1,0)$ は正則値で、\ref{mfd:regular-value-theorem} から $E$ は $(2n+2)-2=2n$ 次元の部分多様体。

**Step 2（$\Phi$ は well-defined な全単射）.** $f(x)\defeq|x|^{2}$ について $S^{n}=f^{-1}(1)$ で、$df_{p}(w)=2\langle p,w\rangle$ なので、\ref{mfd:regular-value-theorem} から $d\iota_{p}(T_{p}S^{n})=\ker df_{p}=p^{\perp}$。$d\iota_{p}$ は単射（\ref{mfd:submanifold-structure.2}）なので、$v\mapsto d\iota_{p}v$ は $T_{p}S^{n}$ から $p^{\perp}$ への線形同型。よって $\Phi$ は $E$ への全単射。

**Step 3（$\Phi$ は滑らかで、微分が単射）.** $T\mathbb{R}^{n+1}$ を恒等写像の座標近傍の自然な座標近傍（\ref{mfd:tangent-bundle-manifold.2}）で $\mathbb{R}^{n+1}\times\mathbb{R}^{n+1}$ と同一視すると、$\Phi$ は $d\iota\colon TS^{n}\to T\mathbb{R}^{n+1}$ そのもので、\ref{mfd:tangent-map} から滑らか。像は $E$ に入るので、$E$ への写像としても滑らか（\ref{mfd:submanifold-structure.3}）。$S^{n}$ の座標近傍 $(U,\varphi)$ の自然な座標で見ると、$\hat\iota\defeq\iota\circ\varphi^{-1}$ について $d\iota$ は $(a,\xi)\mapsto(\hat\iota(a),D\hat\iota(a)\xi)$（\ref{mfd:differential-properties.3}）で、そのヤコビ行列は
$$
\begin{pmatrix}D\hat\iota(a)&0\\ \ast&D\hat\iota(a)\end{pmatrix}.
$$
$D\hat\iota(a)$ は単射（$\iota$ ははめ込み）なので、$(\alpha,\beta)$ がこの行列で $0$ に移れば、上の行から $\alpha=0$、下の行から $\beta=0$。よって $d\iota$ の微分は単射。$j\colon E\to\mathbb{R}^{2n+2}$ を包含とすると $d\iota=j\circ\Phi$ なので、連鎖律（\ref{mfd:differential-properties.1}）から $d\Phi$ も各点で単射。

**Step 4（微分同相）.** $\dim TS^{n}=2n=\dim E$ なので $d\Phi$ は各点で線形同型で、\ref{mfd:inverse-function-theorem} から $\Phi$ は局所微分同相写像。全単射なので、逆写像は各点の近くで局所的な逆写像に一致し、滑らか。よって $\Phi$ は微分同相写像。

**2. Step 1（正規直交性）.** $p\in\mathbb{R}^{4}$ について直接計算すると
$$
\langle\tilde X_{1}(p),p\rangle=-p_{2}p_{1}+p_{1}p_{2}-p_{4}p_{3}+p_{3}p_{4}=0,
$$
同様に $\langle\tilde X_{2}(p),p\rangle=-p_{3}p_{1}+p_{4}p_{2}+p_{1}p_{3}-p_{2}p_{4}=0$, $\langle\tilde X_{3}(p),p\rangle=-p_{4}p_{1}-p_{3}p_{2}+p_{2}p_{3}+p_{1}p_{4}=0$。また
$$
\langle\tilde X_{1},\tilde X_{2}\rangle=p_{2}p_{3}+p_{1}p_{4}-p_{4}p_{1}-p_{3}p_{2}=0,\quad\langle\tilde X_{1},\tilde X_{3}\rangle=p_{2}p_{4}-p_{1}p_{3}-p_{4}p_{2}+p_{3}p_{1}=0,
$$
$\langle\tilde X_{2},\tilde X_{3}\rangle=p_{3}p_{4}-p_{4}p_{3}+p_{1}p_{2}-p_{2}p_{1}=0$ で、各 $|\tilde X_{i}(p)|=|p|$。よって $|p|=1$ なら $\tilde X_{1}(p),\tilde X_{2}(p),\tilde X_{3}(p)$ は 3 次元の空間 $p^{\perp}$ の正規直交基底。

**Step 2（$S^{3}\times\mathbb{R}^{3}\cong E$）.** $\Psi\colon S^{3}\times\mathbb{R}^{3}\to E$, $\Psi(p,c)\defeq(p,\sum_{i}c_{i}\tilde X_{i}(p))$ と $\Lambda\colon E\to S^{3}\times\mathbb{R}^{3}$, $\Lambda(p,v)\defeq\bigl(p,(\langle v,\tilde X_{i}(p)\rangle)_{i}\bigr)$ を考える。Step 1 から $\Psi$ の値は $E$ に入り、$\Lambda\circ\Psi=\mathrm{id}$（$\langle\sum_{j}c_{j}\tilde X_{j},\tilde X_{i}\rangle=c_{i}$）、$\Psi\circ\Lambda=\mathrm{id}$（$v\in p^{\perp}$ は正規直交基底で $v=\sum_{i}\langle v,\tilde X_{i}\rangle\tilde X_{i}$）。$\Psi$ は、射影と包含 $S^{3}\to\mathbb{R}^{4}$ の合成で書ける座標の多項式なので $\mathbb{R}^{8}$ への写像として滑らかで、\ref{mfd:submanifold-structure.3} から $E$ への写像として滑らか。$\Lambda$ の第 1 成分 $E\to S^{3}$ は $\mathbb{R}^{8}\to\mathbb{R}^{4}$ の射影の制限で像が $S^{3}$ に入るので滑らか（\ref{mfd:submanifold-structure.3}）、第 2 成分は多項式の制限で滑らか。成分が滑らかなら積多様体への写像は滑らか（積座標近傍での局所表示が成分の局所表示を並べたもの）。よって $\Psi$ は微分同相写像。

**Step 3（結論）.** 1 から $\Phi^{-1}\circ\Psi\colon S^{3}\times\mathbb{R}^{3}\to TS^{3}$ は微分同相写像で、$(p,c)\mapsto\sum_{i}c_{i}(d\iota_{p})^{-1}\tilde X_{i}(p)\in T_{p}S^{3}$ はファイバー上で線形。
:::

## 流れとリー微分 {#mfd:sec-fl-exercises}

対応するページ：\ref{mfd:page-flows-lie-derivative}

::: problem ★ 基本：流れとカルタンの公式 {#mfd:ex-fl-1}
$\mathbb{R}^{2}$ 上のベクトル場 $X\defeq x\,\partial_{x}+2y\,\partial_{y}$ の流れを求めよ。$\omega\defeq dx\wedge dy$, $\eta\defeq y\,dx-x\,dy$ について、$\mathcal{L}_{X}\omega$ と $\mathcal{L}_{X}\eta$ を、流れによる定義とカルタンの公式の両方で計算せよ。
:::

::: solution
**流れ.** $\phi_{t}(x,y)\defeq(e^{t}x,e^{2t}y)$ は $\phi_{0}=\mathrm{id}$ で、$\frac{d}{dt}\phi_{t}(x,y)=(e^{t}x,2e^{2t}y)=X_{\phi_{t}(x,y)}$ なので、$t\mapsto\phi_{t}(x,y)$ は $\mathbb{R}$ 全体で定義された積分曲線。\ref{mfd:flow-theorem.1} の一意性と最大性から、これが $X$ の流れで、$X$ は完備。

**流れによる計算.** \ref{mfd:pullback-properties.2}, \ref{mfd:pullback-properties.3} から
$$
\phi_{t}^{*}\omega=d(e^{t}x)\wedge d(e^{2t}y)=e^{3t}\,dx\wedge dy,\qquad\phi_{t}^{*}\eta=e^{2t}y\,d(e^{t}x)-e^{t}x\,d(e^{2t}y)=e^{3t}\eta.
$$
\ref{mfd:lie-derivative.3} から $\mathcal{L}_{X}\omega=\frac{d}{dt}\big|_{t=0}e^{3t}\omega=3\omega$, $\mathcal{L}_{X}\eta=3\eta$。

**カルタンの公式による計算.** 行列式の規約（\ref{mfd:abstract-wedge.2}）から $(dx\wedge dy)(X,v)=dx(X)dy(v)-dy(X)dx(v)$ なので $i_{X}\omega=x\,dy-2y\,dx$。$d\omega=0$（$\mathbb{R}^{2}$ 上の 3 形式）なので、\ref{mfd:cartan-formula} から
$$
\mathcal{L}_{X}\omega=d(x\,dy-2y\,dx)=dx\wedge dy-2\,dy\wedge dx=3\,dx\wedge dy.
$$
$\eta$ について、$i_{X}\eta=y\cdot x-x\cdot2y=-xy$ で $d(i_{X}\eta)=-y\,dx-x\,dy$。$d\eta=dy\wedge dx-dx\wedge dy=-2\,dx\wedge dy$ で $i_{X}d\eta=-2(x\,dy-2y\,dx)=4y\,dx-2x\,dy$。和は $3y\,dx-3x\,dy=3\eta$ で、流れによる計算と一致する。
:::

::: problem ★★ 標準：ベクトル場のリー微分の符号 {#mfd:ex-fl-2}
$\mathbb{R}^{2}$ 上で $X\defeq-y\,\partial_{x}+x\,\partial_{y}$, $Y\defeq\partial_{x}$, $\omega\defeq x\,dy$ とする。
1. $\mathcal{L}_{X}Y$ を \ref{mfd:lie-derivative.2} の定義から直接計算し、$[X,Y]$ と一致することを確かめよ。
2. \ref{mfd:d-one-form} の等式 $d\omega(X,Y)=X(\omega(Y))-Y(\omega(X))-\omega([X,Y])$ の両辺を計算して一致を確かめよ。
:::

::: solution
**1.** $X$ の流れは回転 $\phi_{t}=R_{t}$, $R_{t}(x,y)=(x\cos t-y\sin t,\ x\sin t+y\cos t)$ である（\ref{mfd:prob-fl-rotation}）。$\phi_{-t}=R_{-t}$ は線形なので、\ref{mfd:differential-properties.4} から各点で $d(\phi_{-t})=R_{-t}$。$Y$ は定ベクトル $e_{1}=(1,0)$ なので、点 $m$ で
$$
d(\phi_{-t})_{\phi_{t}(m)}\bigl(Y_{\phi_{t}(m)}\bigr)=R_{-t}e_{1}=(\cos t,-\sin t).
$$
$t=0$ で微分すると $(0,-1)$、すなわち $\mathcal{L}_{X}Y=-\partial_{y}$。一方 \ref{mfd:lie-bracket} の座標表示で、$Y$ の成分は定数なので $[X,Y]^{j}=-Y(X^{j})=-\partial_{x}X^{j}$、$X^{1}=-y$, $X^{2}=x$ から $[X,Y]=-\partial_{y}$。\ref{mfd:lie-derivative-bracket} のとおり一致する。

**2.** 左辺：$d\omega=dx\wedge dy$ で、行列式の規約から $d\omega(X,Y)=X^{1}Y^{2}-X^{2}Y^{1}=(-y)\cdot0-x\cdot1=-x$。右辺：$\omega(Y)=x\,dy(\partial_{x})=0$、$\omega(X)=x\cdot X^{2}=x^{2}$、1 から $\omega([X,Y])=x\,dy(-\partial_{y})=-x$。よって右辺は $X(0)-\partial_{x}(x^{2})-(-x)=-2x+x=-x$ で、左辺と一致する。
:::

::: problem ★★★ 発展：発散が 0 の流れは体積を保つ {#mfd:ex-fl-3}
1. $X\in\mathfrak{X}(M)$ は完備で流れを $\phi$ とし、$\omega\in\Omega^{k}(M)$ とする。すべての $t\in\mathbb{R}$ について $\frac{d}{dt}(\phi_{t}^{*}\omega)_{m}=(\phi_{t}^{*}\mathcal{L}_{X}\omega)_{m}$ を示し、$\mathcal{L}_{X}\omega=0$ なら $\phi_{t}^{*}\omega=\omega$（すべての $t$）であることを示せ。
2. $\mathbb{R}^{n}$ 上で $\Omega\defeq dx_{1}\wedge\cdots\wedge dx_{n}$, $X=\sum_{i}X^{i}\partial_{i}$ とする。$\mathcal{L}_{X}\Omega=(\operatorname{div}X)\,\Omega$（$\operatorname{div}X\defeq\sum_{i}\partial_{i}X^{i}$）を示せ。
3. $X$ が $\mathbb{R}^{n}$ 上の完備なベクトル場で $\operatorname{div}X=0$ なら、流れのヤコビ行列式は $\det D\phi_{t}(x)=1$（すべての $t,x$）であることを示せ。
:::

::: solution
**1.** $X$ は完備なので、\ref{mfd:flow-theorem.4} から $\phi_{t+s}=\phi_{s}\circ\phi_{t}$ で、\ref{mfd:pullback-properties.2} から $\phi_{t+s}^{*}\omega=\phi_{t}^{*}(\phi_{s}^{*}\omega)$。点 $m$ で \ref{mfd:pullback} の定義を書くと
$$
(\phi_{t+s}^{*}\omega)_{m}=(d\phi_{t})_{m}^{*}\bigl((\phi_{s}^{*}\omega)_{\phi_{t}(m)}\bigr).
$$
$t$ を固定すると $(d\phi_{t})_{m}^{*}\colon\Lambda^{k}T_{\phi_{t}(m)}^{*}M\to\Lambda^{k}T_{m}^{*}M$ は $s$ によらない線形写像（有限次元空間の間）なので、$s=0$ で微分すると、\ref{mfd:lie-derivative.3} から
$$
\frac{d}{dt}(\phi_{t}^{*}\omega)_{m}=(d\phi_{t})_{m}^{*}\bigl((\mathcal{L}_{X}\omega)_{\phi_{t}(m)}\bigr)=(\phi_{t}^{*}\mathcal{L}_{X}\omega)_{m}.
$$
（左辺の微分は存在する：座標で見ると $(\phi_{t}^{*}\omega)_{m}$ の成分は $t$ について滑らか（\ref{mfd:flow-theorem.2}）。）$\mathcal{L}_{X}\omega=0$ なら、有限次元空間 $\Lambda^{k}T_{m}^{*}M$ の中の曲線 $t\mapsto(\phi_{t}^{*}\omega)_{m}$ の微分がいたるところ $0$ なので、成分ごとに平均値の定理を使うと定数で、$t=0$ の値 $\omega_{m}$ に等しい。

**2.** $d\Omega=0$（$n+1$ 形式）なので、\ref{mfd:cartan-formula} から $\mathcal{L}_{X}\Omega=d(i_{X}\Omega)$。行列式の規約（\ref{mfd:abstract-wedge.2}）で $\Omega(X,v_{2},\dots,v_{n})$ を第 1 列について展開すると
$$
i_{X}\Omega=\sum_{i=1}^{n}(-1)^{i-1}X^{i}\,dx_{1}\wedge\cdots\wedge\widehat{dx_{i}}\wedge\cdots\wedge dx_{n}.
$$
\ref{mfd:exterior-derivative.4} から $d(i_{X}\Omega)=\sum_{i}(-1)^{i-1}\sum_{j}\partial_{j}X^{i}\,dx_{j}\wedge dx_{1}\wedge\cdots\widehat{dx_{i}}\cdots\wedge dx_{n}$ で、$j\neq i$ の項は $dx_{j}$ が 2 回現れて $0$。$j=i$ の項で $dx_{i}$ を $i-1$ 個の 1 形式の後ろへ移すと符号 $(-1)^{i-1}$ が出るので、$d(i_{X}\Omega)=\sum_{i}\partial_{i}X^{i}\,\Omega$。

**3.** 2 から $\mathcal{L}_{X}\Omega=0$ なので、1 から $\phi_{t}^{*}\Omega=\Omega$。一方、点 $x$ で $(\phi_{t}^{*}\Omega)_{x}(e_{1},\dots,e_{n})=\Omega(D\phi_{t}(x)e_{1},\dots,D\phi_{t}(x)e_{n})=\det\bigl(dx_{a}(D\phi_{t}(x)e_{b})\bigr)_{a,b}=\det D\phi_{t}(x)$（\ref{mfd:pullback}, \ref{mfd:differential-properties.4}, \ref{mfd:abstract-wedge.2}）。$\Omega_{x}(e_{1},\dots,e_{n})=1$ なので $\det D\phi_{t}(x)=1$。

（確認：\ref{mfd:prob-fl-rotation} の回転のベクトル場は発散 $0$ で、流れは回転。\ref{mfd:ex-fl-1} の $X=x\,\partial_{x}+2y\,\partial_{y}$ は発散 $3$ で、$\det D\phi_{t}=e^{3t}$、$\mathcal{L}_{X}\Omega=3\Omega$ と合う。）
:::

## サードの定理 {#mfd:sec-sd-exercises}

対応するページ：\ref{mfd:page-sard}

::: problem ★ 基本：カスプ写像の臨界値 {#mfd:ex-sd-1}
$F\colon\mathbb{R}^{2}\to\mathbb{R}^{2}$, $F(x,y)\defeq(x,\ y^{3}+xy)$ の臨界点の集合 $C$ と臨界値の集合 $F(C)$ を求め、$F(C)=\{(u,v):4u^{3}+27v^{2}=0\}$ であること、$F(C)$ が測度 $0$ であることを確かめよ。また正則値 $(a,b)$ で $a>0$ のものの逆像は 1 点であること、正則値 $(-3,0)$ の逆像は 3 点であることを示せ。
:::

::: solution
**臨界点.** $DF(x,y)=\begin{pmatrix}1&0\\ y&3y^{2}+x\end{pmatrix}$ で、$\det DF=3y^{2}+x$。同じ次元の間の線形写像は行列式が $0$ でないときに限り全射なので（\ref{mfd:differential-properties.4}）、$C=\{(x,y):x=-3y^{2}\}$。

**臨界値.** $(-3s^{2},s)\in C$ の像は $(-3s^{2},\ s^{3}-3s^{3})=(-3s^{2},-2s^{3})$。$u=-3s^{2}$, $v=-2s^{3}$ なら $4u^{3}+27v^{2}=-108s^{6}+108s^{6}=0$。逆に $4u^{3}+27v^{2}=0$ なら $u\le0$ で、$s_{0}\defeq\sqrt{-u/3}$ とすると $v^{2}=-4u^{3}/27=4s_{0}^{6}$、$v=\mp2s_{0}^{3}$ なので $s=\pm s_{0}$ で $(u,v)=(-3s^{2},-2s^{3})$。よって $F(C)=\{4u^{3}+27v^{2}=0\}$。これは滑らかな曲線 $s\mapsto(-3s^{2},-2s^{3})$ の像なので、\ref{mfd:sard-corollaries.1}（$1<2$）から測度 $0$ で、\ref{mfd:sard} と合う。

**逆像の個数.** $F(x,y)=(a,b)$ は $x=a$, $y^{3}+ay-b=0$ と同値。$a>0$ なら $g(y)\defeq y^{3}+ay-b$ は $g'(y)=3y^{2}+a>0$ で狭義単調増加、$y\to\pm\infty$ で $\pm\infty$ に発散するので、中間値の定理と単調性から解はちょうど 1 つ。$(a,b)$ は $4a^{3}+27b^{2}>0$ なので正則値。$(-3,0)$ は $4(-27)+0\neq0$ なので正則値で、$y^{3}-3y=y(y^{2}-3)=0$ から $y=0,\pm\sqrt{3}$ の 3 点。逆像の点の個数は、臨界値の曲線をまたぐと変わりうる。
:::

::: problem ★★ 標準：正則値の逆像の個数 {#mfd:ex-sd-2}
$M$, $N$ を同じ次元 $n$ の可微分多様体、$M$ はコンパクト、$F\colon M\to N$ を滑らかな写像とし、$R\subset N$ を正則値の全体とする。
1. $R$ は $N$ の稠密な開集合であることを示せ。
2. $q\in R$ なら $F^{-1}(q)$ は有限集合であることを示せ。
3. $q\mapsto\#F^{-1}(q)$ は $R$ の上で局所定数であることを示せ。
:::

::: solution
**1.** 次元が等しいので、$m$ が正則点であることは、座標近傍での $dF_{m}$ のヤコビ行列式（\ref{mfd:differential-properties.3}）が $0$ でないことと同値。ヤコビ行列式は座標近傍の上で連続なので、正則点の全体は開集合で、臨界点の集合 $C$ は閉集合。$M$ はコンパクトなので $C$ はコンパクトで、$F(C)$ はコンパクト、したがってハウスドルフ空間 $N$ の閉集合。よって $R=N\setminus F(C)$ は開集合。稠密であることは \ref{mfd:sard}。

**2.** $p\in F^{-1}(q)$ では $dF_{p}$ は全射で、次元が等しいので線形同型。\ref{mfd:inverse-function-theorem} から $p$ の開近傍 $U_{p}$ で $F$ が単射なものがあり、$U_{p}\cap F^{-1}(q)=\{p\}$。$F^{-1}(q)$ はコンパクトな $M$ の閉集合なのでコンパクトで、開被覆 $\{U_{p}\}$ の有限部分被覆をとると、各 $U_{p}$ は $F^{-1}(q)$ の点を 1 つしか含まないので $F^{-1}(q)$ は有限。

**3.** $q\in R$, $F^{-1}(q)=\{p_{1},\dots,p_{k}\}$（$k\ge0$）とする。2 と同様に \ref{mfd:inverse-function-theorem} から開近傍 $U_{i}\ni p_{i}$ で、$V_{i}\defeq F(U_{i})$ が開集合、$F\restriction U_{i}\colon U_{i}\to V_{i}$ が微分同相写像となるものをとる。$M$ はハウスドルフなので、$U_{i}$ を小さくして互いに交わらないようにしてよい（$U_{i}$ を開部分集合 $U'_{i}$ に縮めても $F(U'_{i})$ は開集合で、制限は微分同相写像）。$K\defeq M\setminus\bigcup_{i}U_{i}$ は閉集合なのでコンパクトで、$F(K)$ は閉集合で $q$ を含まない。
$$
W\defeq\Bigl(\bigcap_{i}V_{i}\Bigr)\setminus F(K)\quad(k=0\text{ なら }W\defeq N\setminus F(M))
$$
は $q$ の開近傍。$q'\in W$ の逆像の点は $K$ に入らないので、どれかの $U_{i}$ に入り、$F\restriction U_{i}$ は $V_{i}\ni q'$ への全単射なので各 $U_{i}$ にちょうど 1 点ある。よって $\#F^{-1}(q')=k$（とくに $W\subset R$）。
:::

::: problem ★★★ 発展：代数学の基本定理 {#mfd:ex-sd-3}
$P(z)=z^{d}+a_{d-1}z^{d-1}+\cdots+a_{0}$（$d\ge1$, $a_{j}\in\mathbb{C}$）を $\mathbb{C}=\mathbb{R}^{2}$ から自分自身への滑らかな写像とみる。\ref{mfd:ex-sd-2} の議論を使って、$P$ は全射であること（とくに $P$ は根をもつこと）を示せ。
:::

::: solution
**Step 1（臨界点）.** 二項展開から $P(z+w)=P(z)+P'(z)w+w^{2}Q(z,w)$（$Q$ は多項式）なので、実の微分 $DP(z)$ は複素数 $P'(z)$ を掛ける写像 $w\mapsto P'(z)w$。これは $P'(z)\neq0$ なら可逆、$P'(z)=0$ なら $0$。$P'$ は最高次の係数が $d\neq0$ の $d-1$ 次多項式なので、零点は有限個。よって臨界値の集合 $W$ は有限集合で、正則値の集合 $R=\mathbb{C}\setminus W$ は開集合。

**Step 2（$R$ は連結）.** $a,b\in R$ をとり、$a$ も $b$ も通らない直線 $L$ を一つとる。$c\in\mathbb{C}$ について、線分 $[a,c]$ が $w\in W$ を通るのは、$c$ が $a$ から $w$ の方向に出る半直線の上にあるときに限る（$a\notin W$ なので $w\neq a$）。この半直線は $a\notin L$ を含むので $L$ に含まれず、$L$ とは高々 1 点で交わる。$[c,b]$ についても同様。よって $L$ の点 $c$ のうち、$[a,c]$ または $[c,b]$ が $W$ と交わるものは有限個で、$L$ は無限集合なので、折れ線 $a\to c\to b$ が $W$ を避ける $c\in L$ がある。したがって $R$ は弧状連結で、連結である（\ref{top:path-connected-connected}）。

**Step 3（固有性）.** $A\defeq\sum_{j}|a_{j}|$ とし、$|z|\ge\max(1,2A)$ なら $|P(z)|\ge|z|^{d}\bigl(1-\sum_{j}|a_{j}||z|^{j-d}\bigr)\ge|z|^{d}(1-A/|z|)\ge|z|^{d}/2$。よって有界集合の逆像は有界で、コンパクト集合の逆像は（閉かつ有界なので）コンパクト。

**Step 4（個数は局所定数）.** $q\in R$ について $P^{-1}(q)$ は $P(z)-q=0$ の根なので高々 $d$ 個、$\{p_{1},\dots,p_{k}\}$ とする。\ref{mfd:ex-sd-2.3} と同じく、互いに交わらない開近傍 $U_{i}\ni p_{i}$ で $P\restriction U_{i}$ が開集合 $V_{i}$ への微分同相写像となるものをとる。$D\defeq\{w:|w-q|\le1\}$ とし、$K\defeq P^{-1}(D)\setminus\bigcup_{i}U_{i}$ は Step 3 からコンパクト、$P(K)$ はコンパクトで $q$ を含まない。$W'\defeq\bigl(\bigcap_{i}V_{i}\cap\{|w-q|<1\}\bigr)\setminus P(K)$ は $q$ の開近傍で、$q'\in W'$ の逆像の点は $P^{-1}(D)$ に入り $K$ に入らないので $\bigcup_{i}U_{i}$ に入り、各 $U_{i}$ にちょうど 1 点。よって $\#P^{-1}(q')=k$。

**Step 5（結論）.** $q\mapsto\#P^{-1}(q)$ は $R$ 上の局所定数関数なので、各値の等位集合は $R$ の開集合で、$R$ を互いに交わらない開集合に分ける。Step 2 から $R$ は連結なので、この関数は定数 $k_{0}$。Step 3 から $P$ の像は非有界で無限集合なので、有限集合 $W$ に入らない像の点 $q$ があり、$q\in R$ で $\#P^{-1}(q)\ge1$。よって $k_{0}\ge1$ で、すべての正則値は像に入る。臨界値は定義から像に入る。したがって $P$ は全射で、とくに $P(z)=0$ となる $z$ がある。
:::

## ホイットニーの埋め込み定理 {#mfd:sec-wh-exercises}

対応するページ：\ref{mfd:page-whitney}

::: problem ★ 基本：円の射影の悪い方向 {#mfd:ex-wh-1}
$j\colon S^{1}\to\mathbb{R}^{3}$, $j(x,y)\defeq(x,y,0)$ とする。単位ベクトル $a\in S^{2}$ のうち、$P_{a}\circ j\colon S^{1}\to a^{\perp}$ が埋め込みでないものの集合は、赤道 $\{a\in S^{2}:a_{3}=0\}$ であることを示せ。これは \ref{mfd:generic-projection} のどの部分と合っているか。
:::

::: solution
$j$ は包含 $S^{1}\to\mathbb{R}^{2}$（埋め込み、\ref{mfd:submanifold-structure.2}）と線形な単射 $(x,y)\mapsto(x,y,0)$ の合成なので埋め込みで、$dj_{p}v=(v,0)$（水平なベクトル）。

**$a_{3}\neq0$ のとき.** $P_{a}(j(p))=P_{a}(j(q))$ は $j(p)-j(q)\in\mathbb{R}a$ と同値。$j(p)-j(q)$ の第 3 成分は $0$ で $a_{3}\neq0$ なので、$j(p)-j(q)=0$、つまり $p=q$。同様に $d(P_{a}\circ j)_{p}v=P_{a}(dj_{p}v)=0$ なら $dj_{p}v\in\mathbb{R}a$ から $dj_{p}v=0$、$v=0$。よって $P_{a}\circ j$ は単射なはめ込みで、$S^{1}$ はコンパクトなので像への同相写像（\ref{top:compact-to-hausdorff}）、すなわち埋め込み。

**$a_{3}=0$ のとき.** $a=(\cos\alpha,\sin\alpha,0)$ とすると、$p\defeq(\cos\alpha,\sin\alpha)$ について $j(p)-j(-p)=2a$ なので $P_{a}(j(p))=P_{a}(j(-p))$ で、単射でない。（さらに $p'\defeq(-\sin\alpha,\cos\alpha)$ では $T_{p'}S^{1}=p'^{\perp}$ が $(\cos\alpha,\sin\alpha)$ で張られ、$dj$ の像が $\mathbb{R}a$ なので、はめ込みでもない。）

**比較.** 赤道は滑らかな曲線の像なので $S^{2}$ の測度 $0$ の集合（\ref{mfd:sard-corollaries.1}）。$N=3>2=2n$ なので \ref{mfd:generic-projection.1}（ほとんどすべての方向ではめ込み）と合っている。$N=3$ は $2n+1$ より大きくないので \ref{mfd:generic-projection.2} の仮定は満たさないが、この例では単射でない方向も測度 $0$ になっている。
:::

::: problem ★★ 標準：トーラスの $\mathbb{R}^{3}$ への埋め込み {#mfd:ex-wh-2}
$T^{2}\defeq S^{1}\times S^{1}$（積多様体）の点を $((a,b),(c,d))$ と書き、$G\colon T^{2}\to\mathbb{R}^{3}$, $G((a,b),(c,d))\defeq\bigl((2+c)a,(2+c)b,d\bigr)$ とする。$G$ は埋め込みで、$G(T^{2})$ は $\mathbb{R}^{3}$ の 2 次元の部分多様体であることを示せ。（\ref{mfd:whitney-embedding} が保証する次元 $2n+1=5$ より小さい。）
:::

::: solution
**Step 1（滑らかさ）.** 射影 $T^{2}\to S^{1}$ と包含 $S^{1}\to\mathbb{R}^{2}$ は滑らかなので、$a,b,c,d$ は $T^{2}$ 上の滑らかな関数で、$G$ の成分はその多項式なので $G$ は滑らか。

**Step 2（はめ込み）.** \ref{mfd:ex-sm-1} の $F\colon\mathbb{R}^{2}\to T^{2}$, $F(s,t)=((\cos s,\sin s),(\cos t,\sin t))$ は全射で、各点で $dF$ は線形同型。$H\defeq G\circ F$ は
$$
H(s,t)=\bigl((2+\cos t)\cos s,\ (2+\cos t)\sin s,\ \sin t\bigr),
$$
$$
\partial_{s}H=(2+\cos t)(-\sin s,\cos s,0),\qquad\partial_{t}H=\bigl(-\sin t\cos s,\ -\sin t\sin s,\ \cos t\bigr).
$$
$\alpha\,\partial_{s}H+\beta\,\partial_{t}H=0$ とする。第 3 成分から $\beta\cos t=0$。水平成分は $\alpha(2+\cos t)(-\sin s,\cos s)-\beta\sin t(\cos s,\sin s)=0$ で、二つのベクトル $(-\sin s,\cos s)$, $(\cos s,\sin s)$ は直交する単位ベクトルなので $\alpha(2+\cos t)=0$, $\beta\sin t=0$。$2+\cos t\ge1$ から $\alpha=0$、$\beta\cos t=\beta\sin t=0$ から $\beta=0$。よって $dH$ は単射で、$dG_{F(s,t)}=dH_{(s,t)}\circ(dF_{(s,t)})^{-1}$（連鎖律、\ref{mfd:differential-properties.1}）も単射。$F$ は全射なので $G$ ははめ込み。

**Step 3（単射）.** $G((a,b),(c,d))=(X,Y,Z)$ なら $a^{2}+b^{2}=1$ から $X^{2}+Y^{2}=(2+c)^{2}$ で、$2+c\ge1>0$ なので $2+c=\sqrt{X^{2}+Y^{2}}$。よって $c$, $(a,b)=(X,Y)/(2+c)$, $d=Z$ は像から決まり、$G$ は単射。

**Step 4（結論）.** $T^{2}$ はコンパクト（コンパクト空間の積）なので、単射なはめ込み $G$ は像への同相写像（\ref{top:compact-to-hausdorff}）で埋め込み。\ref{mfd:embedding-image-submanifold} から $G(T^{2})$ は 2 次元の部分多様体。
:::

::: problem ★★★ 発展：接束の埋め込み {#mfd:ex-wh-3}
$M$ をコンパクトな $n$ 次元可微分多様体とする。$TM$ は $\mathbb{R}^{4n+2}$ に埋め込めることを示せ。（$TM$ はコンパクトでないことに注意。）
:::

::: solution
**Step 0（写像）.** \ref{mfd:whitney-embedding} から埋め込み $F\colon M\to\mathbb{R}^{N}$（$N\defeq2n+1$）がある。$T\mathbb{R}^{N}$ を恒等写像の自然な座標近傍（\ref{mfd:tangent-bundle-manifold.2}）で $\mathbb{R}^{N}\times\mathbb{R}^{N}$ と同一視し、$\Phi\defeq dF\colon TM\to\mathbb{R}^{2N}$, $\Phi(m,v)=(F(m),dF_{m}v)$ とする。\ref{mfd:tangent-map} から $\Phi$ は滑らか。

**Step 1（単射）.** $\Phi(m,v)=\Phi(m',v')$ なら $F(m)=F(m')$ から $m=m'$、$dF_{m}v=dF_{m}v'$ と $dF_{m}$ の単射性から $v=v'$。

**Step 2（はめ込み）.** $M$ の座標近傍 $(U,\varphi)$ の自然な座標で、$\hat F\defeq F\circ\varphi^{-1}$ とすると $\Phi$ は $(a,\xi)\mapsto(\hat F(a),D\hat F(a)\xi)$（\ref{mfd:differential-properties.3}）。ヤコビ行列は下三角のブロック行列 $\begin{pmatrix}D\hat F(a)&0\\ \ast&D\hat F(a)\end{pmatrix}$ で、$D\hat F(a)$ は単射なので、\ref{mfd:ex-tb-3.1} の Step 3 と同じ議論でこれも単射。

**Step 3（像への同相）.** 像は距離空間なので、逆写像の連続性は点列で確かめればよい。$\Phi(m_{k},v_{k})\to\Phi(m,v)$ とする。$F(m_{k})\to F(m)$ で $F$ は像への同相写像なので $m_{k}\to m$。$m$ を含む座標近傍 $(U,\varphi)$ をとり、十分大きい $k$ で $m_{k}\in U$、$a_{k}\defeq\varphi(m_{k})\to a\defeq\varphi(m)$、$v_{k}$, $v$ の成分を $\xi_{k}$, $\xi$ とする。$A(a')\defeq D\hat F(a')$ は $a'$ について連続で、$A(a)$ は単射なので、単位球面のコンパクト性から $c\defeq\min_{|\eta|=1}|A(a)\eta|>0$。$\|A(a')-A(a)\|<c/2$ となる $a'$ では、すべての $\eta$ について $|A(a')\eta|\ge|A(a)\eta|-\|A(a')-A(a)\||\eta|\ge(c/2)|\eta|$。十分大きい $k$ でこれを $a'=a_{k}$ に使うと
$$
|\xi_{k}-\xi|\le\frac{2}{c}\bigl|A(a_{k})\xi_{k}-A(a_{k})\xi\bigr|\le\frac{2}{c}\Bigl(\bigl|A(a_{k})\xi_{k}-A(a)\xi\bigr|+\|A(a)-A(a_{k})\||\xi|\Bigr).
$$
$A(a_{k})\xi_{k}=dF_{m_{k}}v_{k}\to dF_{m}v=A(a)\xi$ と $A(a_{k})\to A(a)$ から右辺は $0$ に収束する。よって自然な座標で $(a_{k},\xi_{k})\to(a,\xi)$、すなわち $(m_{k},v_{k})\to(m,v)$。

以上から $\Phi$ は単射なはめ込みで像への同相写像、すなわち $TM$ の $\mathbb{R}^{2N}=\mathbb{R}^{4n+2}$ への埋め込みである。
:::

## 可微分構造の存在と一意性 {#mfd:sec-ds-exercises}

対応するページ：\ref{mfd:page-smooth-structures}

::: problem ★ 基本：引き戻しが変わるかどうか {#mfd:ex-ds-1}
$h_{1}(t)\defeq t^{3}+t$, $h_{2}(t)\defeq t^{3}$ とする。$i=1,2$ について、$h_{i}^{*}\mathcal{A}_{\mathrm{std}}=\mathcal{A}_{\mathrm{std}}$ かどうかを判定せよ。また $(\mathbb{R},h_{2}^{*}\mathcal{A}_{\mathrm{std}})$ と $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ は微分同相か。
:::

::: solution
どちらも連続な狭義単調増加関数で $t\to\pm\infty$ で $\pm\infty$ に発散するので全単射、逆写像も単調で連続であり、同相写像である。\ref{mfd:pullback-structure.3} から、$h_{i}^{*}\mathcal{A}_{\mathrm{std}}=\mathcal{A}_{\mathrm{std}}$ は $h_{i}$ が $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ の微分同相写像であること、つまり $h_{i}$ と $h_{i}^{-1}$ が通常の意味で $C^{\infty}$ 級であることと同値（標準構造での局所表示は関数そのもの）。

**$h_{1}$.** $h_{1}$ は多項式で、$h_{1}'(t)=3t^{2}+1>0$。\ref{calc:inverse-function-theorem}（1 変数の場合）から、各点の近くで $h_{1}^{-1}$ は $C^{\infty}$ 級。よって $h_{1}^{*}\mathcal{A}_{\mathrm{std}}=\mathcal{A}_{\mathrm{std}}$。

**$h_{2}$.** $h_{2}^{-1}(u)=u^{1/3}$ は、差分商 $u^{1/3}/u=u^{-2/3}\to+\infty$（$u\to0$）なので $0$ で微分可能でない。よって $h_{2}^{*}\mathcal{A}_{\mathrm{std}}\neq\mathcal{A}_{\mathrm{std}}$。$h_{2}^{*}\mathcal{A}_{\mathrm{std}}$ は座標近傍 $(\mathbb{R},t\mapsto t^{3})$ を含むので、\ref{mfd:prob-sm-cube-chart} の構造そのものである。

**微分同相か.** \ref{mfd:pullback-structure.2} から $h_{2}\colon(\mathbb{R},h_{2}^{*}\mathcal{A}_{\mathrm{std}})\to(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ は微分同相写像。構造としては異なるが、微分同相である。
:::

::: problem ★★ 標準：引き戻しで得られる構造と剰余類 {#mfd:ex-ds-2}
$(M,\mathcal{A})$ を可微分多様体、$\mathrm{Homeo}(M)$ を $M$ の同相写像の群、$\mathrm{Diff}(M,\mathcal{A})$ をその部分群である $(M,\mathcal{A})$ の微分同相写像の群とする。
1. 同相写像 $h,k$ について $(h\circ k)^{*}\mathcal{A}=k^{*}(h^{*}\mathcal{A})$ を示せ。
2. $h^{*}\mathcal{A}=k^{*}\mathcal{A}$ と $h\circ k^{-1}\in\mathrm{Diff}(M,\mathcal{A})$ は同値であることを示せ。
3. $(M,\mathcal{B})$ が $(M,\mathcal{A})$ と微分同相となる可微分構造 $\mathcal{B}$ の集合を $S(\mathcal{A})$ とする。$\mathrm{Diff}(M,\mathcal{A})\circ h\mapsto h^{*}\mathcal{A}$ は、剰余類の集合 $\mathrm{Diff}(M,\mathcal{A})\backslash\mathrm{Homeo}(M)$ から $S(\mathcal{A})$ への全単射を定めることを示せ。
:::

::: solution
**1.** 定義から $k^{*}(h^{*}\mathcal{A})=\{(k^{-1}(h^{-1}(U)),\ \varphi\circ h\circ k):(U,\varphi)\in\mathcal{A}\}$ で、$k^{-1}(h^{-1}(U))=(h\circ k)^{-1}(U)$ なので、これは $(h\circ k)^{*}\mathcal{A}$ に等しい。また $\mathrm{id}^{*}\mathcal{A}=\mathcal{A}$。

**2.** 1 は任意の可微分構造について成り立つので、$(k^{-1})^{*}(k^{*}\mathcal{B})=(k\circ k^{-1})^{*}\mathcal{B}=\mathcal{B}$、同様に $k^{*}((k^{-1})^{*}\mathcal{B})=\mathcal{B}$。よって $(k^{-1})^{*}$ は可微分構造の集合の上の全単射で、
$$
h^{*}\mathcal{A}=k^{*}\mathcal{A}\iff(k^{-1})^{*}h^{*}\mathcal{A}=\mathcal{A}\iff(h\circ k^{-1})^{*}\mathcal{A}=\mathcal{A}.
$$
\ref{mfd:pullback-structure.3} から、最後の条件は $h\circ k^{-1}\in\mathrm{Diff}(M,\mathcal{A})$ と同値。

**3.** **well-defined かつ単射**：2 から、$h^{*}\mathcal{A}=k^{*}\mathcal{A}$ は $h\in\mathrm{Diff}(M,\mathcal{A})\circ k$、つまり剰余類が等しいことと同値。また \ref{mfd:pullback-structure.2} から $h^{*}\mathcal{A}\in S(\mathcal{A})$。**全射**：$\mathcal{B}\in S(\mathcal{A})$ とし、$F\colon(M,\mathcal{B})\to(M,\mathcal{A})$ を微分同相写像とする。$(U,\varphi)\in\mathcal{A}$ について、$(F^{-1}(U),\varphi\circ F)$ は座標近傍で、任意の $(V,\psi)\in\mathcal{B}$ との座標変換 $(\varphi\circ F)\circ\psi^{-1}$, $\psi\circ(\varphi\circ F)^{-1}=\psi\circ F^{-1}\circ\varphi^{-1}$ はそれぞれ $F$, $F^{-1}$ の局所表示なので $C^{\infty}$ 級。$\mathcal{B}$ の極大性から $F^{*}\mathcal{A}\subset\mathcal{B}$。$\mathcal{B}$ の座標近傍は $F^{*}\mathcal{A}\subset\mathcal{B}$ のすべての座標近傍と両立するので、$F^{*}\mathcal{A}$ の極大性（\ref{mfd:pullback-structure.1}）から $\mathcal{B}\subset F^{*}\mathcal{A}$。よって $\mathcal{B}=F^{*}\mathcal{A}$ は $F$ の剰余類の像。

（$\mathbb{R}$ では、\ref{mfd:distinct-structures-on-r} の $h_{a}$ たちが互いに異なる剰余類に属し、$S(\mathcal{A}_{\mathrm{std}})$ は非可算集合である。一方 \ref{mfd:count-smooth-structures} の意味では、$S(\mathcal{A})$ 全体が一つに数えられる。）
:::

::: problem ★★★ 発展：実数直線の可微分構造の一意性 {#mfd:ex-ds-3}
$\mathcal{B}$ を位相多様体 $\mathbb{R}$ の上の（1 次元の）任意の可微分構造とする。$\mathbb{R}$ 上の至るところ $0$ でないベクトル場の流れを使って、$(\mathbb{R},\mathcal{B})$ は $(\mathbb{R},\mathcal{A}_{\mathrm{std}})$ と微分同相であることを示せ。（\ref{mfd:one-manifold-classification} の特別な場合である。）
:::

::: solution
**Step 1（区間上の座標近傍と向き）.** 各点は、定義域が開区間であるような $\mathcal{B}$ の座標近傍に含まれる（座標近傍の定義域の、その点を含む連結成分（開区間）に制限する。\ref{mfd:maximal-atlas.2}）。そのような座標近傍 $(U,\varphi)$ 全体を $\mathcal{U}$ とする。$\varphi\colon U\to\varphi(U)$ は区間の間の同相写像なので狭義単調で、増加なら $\varepsilon_{\varphi}\defeq1$、減少なら $\varepsilon_{\varphi}\defeq-1$ とおく。$U$ 上のベクトル場 $X_{\varphi}\defeq\varepsilon_{\varphi}\,\partial/\partial\varphi$（成分は定数で滑らか、\ref{mfd:vector-field-derivation.1}）を考える。

**Step 2（向きがそろう）.** 【主張：$(U,\varphi),(V,\psi)\in\mathcal{U}$, $m\in U\cap V$ なら、$X_{\varphi,m}=c\,X_{\psi,m}$（$c>0$）】$U\cap V$ は開区間で、$\tau\defeq\psi\circ\varphi^{-1}$ は区間 $\varphi(U\cap V)$ 上で $C^{\infty}$ 級の逆をもつ $C^{\infty}$ 級の写像なので、$(\tau^{-1})'(\tau(u))\tau'(u)=1$ から $\tau'\neq0$。また $\tau$ は単調性の型 $\varepsilon_{\varphi}$ の $\varphi^{-1}$ と型 $\varepsilon_{\psi}$ の $\psi$ の合成なので、増加なら $\varepsilon_{\varphi}\varepsilon_{\psi}=1$、減少なら $-1$。よって $\varepsilon_{\varphi}\varepsilon_{\psi}\tau'>0$。\ref{mfd:change-of-coordinates} から $\partial/\partial\varphi|_{m}=\tau'(\varphi(m))\,\partial/\partial\psi|_{m}$ なので、$X_{\varphi,m}=\varepsilon_{\varphi}\varepsilon_{\psi}\tau'(\varphi(m))\,X_{\psi,m}$。

**Step 3（貼り合わせ）.** 開被覆 $\{U\}_{(U,\varphi)\in\mathcal{U}}$ に従属する滑らかな 1 の分割 $(\rho_{U})$ をとり（\ref{mfd:smooth-partition-of-unity.2}）、$X\defeq\sum_{U}\rho_{U}X_{\varphi}$ とする（各項は $U$ の上では滑らかで、$\mathbb{R}\setminus\operatorname{supp}\rho_{U}$ の上では $0$ なので $\mathbb{R}$ 全体で滑らか、和は局所有限）。$m$ を含む $(V,\psi)\in\mathcal{U}$ を一つ固定すると、Step 2 から $X_{m}=\bigl(\sum_{U}\rho_{U}(m)c_{U}\bigr)X_{\psi,m}$（$c_{U}>0$、$\sum_{U}\rho_{U}(m)=1$）で、係数は正。よって $V$ 上で $X(\psi)=\varepsilon_{\psi}g$（$g>0$）。とくに $X$ は至るところ $0$ でない。

**Step 4（積分曲線は単調増加）.** $p\in\mathbb{R}$ を固定し、$\gamma\colon I\to\mathbb{R}$ を $p$ を始点とする $X$ の極大な積分曲線とする（\ref{mfd:flow-theorem.1}。$I$ は開区間）。$s_{0}\in I$ と $\gamma(s_{0})$ を含む $(V,\psi)\in\mathcal{U}$ について、$s_{0}$ の近くで $(\psi\circ\gamma)'(s)=\gamma'(s)(\psi)=(X\psi)(\gamma(s))$（\ref{mfd:velocity}）は符号 $\varepsilon_{\psi}$ をもつので、$\psi\circ\gamma$ は型 $\varepsilon_{\psi}$ の狭義単調。$\psi^{-1}$ も型 $\varepsilon_{\psi}$ なので、$\gamma=\psi^{-1}\circ(\psi\circ\gamma)$ は $s_{0}$ の近くで狭義単調増加。$s<s'$ を $I$ からとると、$[s,s']$ をこのような開区間の有限個で覆い、ルベーグ数より細かい分点 $s=u_{0}<\cdots<u_{r}=s'$ をとれば、隣り合う分点は同じ開区間に入るので $\gamma(u_{i})<\gamma(u_{i+1})$。よって $\gamma$ は狭義単調増加で連続、像 $J\defeq\gamma(I)$ は開区間 $(\alpha,\beta)$（$-\infty\le\alpha<\beta\le+\infty$）。

**Step 5（$J=\mathbb{R}$）.** $\beta<+\infty$ と仮定する。$\delta\colon I_{\beta}\to\mathbb{R}$ を $\beta$ を始点とする極大な積分曲線とすると、Step 4 から $\delta$ は狭義単調増加で連続なので、$s<0$ が $0$ に十分近ければ $\alpha<\delta(s)<\beta$、つまり $q\defeq\delta(s)\in J$ で、$q=\gamma(u)$ となる $u\in I$ がある。流れを $\phi$ と書くと、\ref{mfd:flow-theorem.3} から（$s\in I_{\beta}$, $q=\phi_{s}(\beta)$ に使って）$-s\in I_{q}$, $\phi_{-s}(q)=\beta$。同じく（$u\in I$, $q=\phi_{u}(p)$ に使って）$I_{q}=I-u$ なので $u-s\in I$ で、$\gamma(u-s)=\phi_{-s}(\phi_{u}(p))=\phi_{-s}(q)=\beta$。これは $\beta\notin J$ に反する。よって $\beta=+\infty$。同様に $\alpha=-\infty$ で、$\gamma\colon I\to\mathbb{R}$ は全単射。

**Step 6（微分同相）.** $\gamma\colon I\to(\mathbb{R},\mathcal{B})$ は滑らかで、$d\gamma_{s}(d/dr|_{s})=\gamma'(s)=X_{\gamma(s)}\neq0$ なので $d\gamma_{s}$ は 1 次元の間の線形同型。\ref{mfd:inverse-function-theorem} から局所微分同相写像で、全単射なので逆写像は局所的な逆写像に一致して滑らか、すなわち $\gamma$ は微分同相写像（$I$ には $\mathbb{R}$ の開部分多様体の構造を入れる）。最後に、開区間 $I$ は標準的な $\mathbb{R}$ と微分同相である：$I=(a,b)$ なら $t\mapsto\tan\bigl(\pi(t-a)/(b-a)-\pi/2\bigr)$、$I=(a,\infty)$ なら $t\mapsto\log(t-a)$、$I=(-\infty,b)$ なら $t\mapsto-\log(b-t)$ が、逆写像（$\arctan$, $\exp$ で書ける）とともに $C^{\infty}$ 級の全単射。この微分同相写像を $g\colon I\to\mathbb{R}$ とすると、$\gamma\circ g^{-1}\colon(\mathbb{R},\mathcal{A}_{\mathrm{std}})\to(\mathbb{R},\mathcal{B})$ は微分同相写像である。
:::
