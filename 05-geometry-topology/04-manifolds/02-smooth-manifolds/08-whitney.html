# ホイットニーの埋め込み定理 {#mfd:page-whitney keywords="smooth embedding of compact manifolds into Euclidean space, reduction of the dimension by generic projections, Sard's theorem, Whitney embedding theorem 2n+1, immersion into R^{2n}, strong Whitney theorem"}

可微分多様体は外側の空間を使わずに定義したが、実はどれもユークリッド空間の部分多様体として実現できる（**ホイットニーの埋め込み定理**）。このページでは、コンパクトな $n$ 次元多様体を、まず十分大きな $\mathbb{R}^{N}$ に埋め込み、次に「一般の方向」への射影で次元を一つずつ下げて、$\mathbb{R}^{2n+1}$ に埋め込めること、$\mathbb{R}^{2n}$ にはめ込めることを示す。「一般の方向」を選ぶところでサードの定理を使う。

## 記法と定義の確認 {#mfd:sec-wh-notation}

::: notation
- 使う結果：\ref{mfd:immersion}（はめ込み・埋め込み）、\ref{mfd:bump-function}、\ref{mfd:regular-value-theorem}、\ref{mfd:tangent-bundle}、\ref{mfd:sard} とその系 \ref{mfd:sard-corollaries}。
- $S^{N-1}\subset\mathbb{R}^{N}$ は単位球面。単位ベクトル $a$ について $P_{a}(z)\defeq z-\langle z,a\rangle a$ は直交補空間 $a^{\perp}\cong\mathbb{R}^{N-1}$ への直交射影。
- 本ページの証明は、ギユマン–ポラック『Differential Topology』やミルナーの講義に見られる標準的な方針（大きな次元への埋め込みと一般の射影）に従い、細部をここで書き下ろした。
:::

## 大きな次元への埋め込み {#mfd:sec-wh-large}

::: lemma コンパクトな多様体の大きな次元への埋め込み {#mfd:compact-embedding-large keywords="a compact smooth manifold covered by k charts embeds smoothly into R^{k(n+1)}" index="多様体の埋め込み（大きな次元）|たようたいのうめこみおおきなじげん"}
コンパクトな $n$ 次元可微分多様体 $M$ は、ある $\mathbb{R}^{N}$ への（滑らかな）埋め込みをもつ。
:::

::: proof
**Step 1（座標近傍と隆起関数）.** \ref{mfd:manifold-topology.1} から、各点に、像が $\overline{B(0,3)}$ を含む中心つきの座標近傍がとれ、$\tau^{-1}(B(0,1))$ たちが $M$ を覆う。コンパクト性から有限個 $(V_{i},\tau_{i})$（$i=1,\dots,k$）で覆える。\ref{mfd:bump-function} の $\beta$ について $\rho_{i}\defeq\beta\circ\tau_{i}$（$V_{i}$ の外で $0$）は $M$ 上の滑らかな関数で（$\tau_{i}^{-1}(\overline{B(0,2)})$ の外で $0$、それはコンパクトで閉）、$\tau_{i}^{-1}(\overline{B(0,1)})$ の上で $1$。

**Step 2（写像）.** $F\defeq(\rho_{1}\tau_{1},\dots,\rho_{k}\tau_{k},\rho_{1},\dots,\rho_{k})\colon M\to\mathbb{R}^{kn+k}$（$\rho_{i}\tau_{i}$ は $V_{i}$ の外で $0$）は滑らか。

**Step 3（はめ込み）.** $m\in\tau_{i}^{-1}(B(0,1))$ なら、$m$ の近くで $\rho_{i}=1$ なので $F$ の成分 $\rho_{i}\tau_{i}=\tau_{i}$ で、$d(\tau_{i})_{m}$ は同型。よって $dF_{m}$ は単射。

**Step 4（単射と埋め込み）.** $F(m)=F(m')$ で $m\in\tau_{i}^{-1}(B(0,1))$ なら $\rho_{i}(m')=\rho_{i}(m)=1$ なので $m'\in V_{i}$、$\tau_{i}(m)=\tau_{i}(m')$ から $m=m'$。コンパクトからハウスドルフへの連続な単射なので像への同相写像（\ref{top:compact-to-hausdorff}）。
:::

## 一般の射影で次元を下げる {#mfd:sec-wh-projection}

::: lemma 射影による次元の引き下げ {#mfd:generic-projection keywords="if a compact n-manifold embeds (immerses) in R^N with N > 2n+1 (N > 2n), then projecting along a generic direction gives an embedding (immersion) into R^{N-1}" index="一般の射影|いっぱんのしゃえい"}
$M$ をコンパクトな $n$ 次元可微分多様体、$F\colon M\to\mathbb{R}^{N}$ をはめ込みとする。
1. $N>2n$ なら、測度 $0$ の集合を除くすべての $a\in S^{N-1}$ について $P_{a}\circ F\colon M\to a^{\perp}$ ははめ込み。
2. $F$ が埋め込みで $N>2n+1$ なら、測度 $0$ の集合を除くすべての $a\in S^{N-1}$ について $P_{a}\circ F$ は埋め込み。
:::

::: proof
**Step 1（はめ込みでなくなる方向）.** 【主張：$P_{a}\circ F$ がはめ込みでないのは、$a=\pm\tau(v)$ となる $v$ があるときに限る。ここで $SM\defeq\{v\in TM:|dF(v)|=1\}$、$\tau\colon SM\to S^{N-1}$, $\tau(v)\defeq dF(v)$】$d(P_{a}\circ F)_{x}v=P_{a}(dF_{x}v)$ は、$dF_{x}v\in\mathbb{R}a$ のとき、つまり $v=0$ か $dF_{x}v/|dF_{x}v|=\pm a$ のときだけ $0$。$dF_{x}v/|dF_{x}v|\in\tau(SM)$。

**Step 2（$SM$ は $2n-1$ 次元の多様体）.** $TM\setminus\{0\}$（零ベクトルの集合の補集合）は $TM$ の開集合で、$g(v)\defeq|dF(v)|^{2}$ はその上の滑らかな関数（自然な座標で $dF$ は成分の線形写像）。$g(\lambda v)=\lambda^{2}g(v)$ なので、$v$ でのファイバー方向の曲線 $\lambda\mapsto\lambda v$ に沿った微分は $2g(v)=2\neq0$（$g(v)=1$ のとき）で、$dg_{v}\neq0$。$F$ ははめ込みなので $SM\subset TM\setminus\{0\}$ で、$1$ は $g$ の正則値。\ref{mfd:regular-value-theorem} から $SM=g^{-1}(1)$ は $2n-1$ 次元の部分多様体で、$\tau$ は滑らか。

**Step 3（1）.** $\dim SM=2n-1<N-1=\dim S^{N-1}$ なので、\ref{mfd:sard-corollaries.1} から $\tau(SM)$ と $-\tau(SM)$ は測度 $0$。それ以外の $a$ について Step 1 から $P_{a}\circ F$ ははめ込み。

**Step 4（2）.** $\Delta$ を対角線として、$M\times M\setminus\Delta$ は $2n$ 次元の多様体（積多様体の開集合）で、$\sigma(x,y)\defeq(F(x)-F(y))/|F(x)-F(y)|$ は滑らか（$F$ は単射）。$P_{a}(F(x))=P_{a}(F(y))$ は $F(x)-F(y)\in\mathbb{R}a$、つまり $\sigma(x,y)=\pm a$ と同値。$2n<N-1$ なので $\sigma$ の像は測度 $0$。$a$ を $\pm\sigma(M\times M\setminus\Delta)$ と $\pm\tau(SM)$ の外にとれば（測度 $0$ の集合の和は測度 $0$ で、$S^{N-1}$ は測度 $0$ でない）、$P_{a}\circ F$ は単射なはめ込みで、$M$ はコンパクトなので埋め込み。
:::

::: theorem ホイットニーの埋め込み定理（コンパクトな場合） {#mfd:whitney-embedding keywords="Whitney: every compact smooth n-manifold embeds in R^{2n+1} and immerses in R^{2n}" index="ホイットニーの埋め込み定理|ほいっとにーのうめこみていり, ホイットニーのはめ込み定理|ほいっとにーのはめこみていり" refname="ホイットニーの埋め込み定理"}
コンパクトな $n$ 次元可微分多様体 $M$ は $\mathbb{R}^{2n+1}$ に埋め込め、$\mathbb{R}^{2n}$ にはめ込める。
:::

::: intuition
大きな空間に置いた多様体を、壁に影を落とすように一つ低い空間へ射影する。たいていの方向から照らせば、影は自分と重ならず（単射）、折れ曲がりもしない（はめ込み）。重なりや折れ曲がりを起こす方向は、多様体の次元が空間の次元の半分より小さい限り「細い集合」にしかならないので、次元を $2n+1$ まで下げられる。
:::

::: proof
\ref{mfd:compact-embedding-large} の埋め込み $F\colon M\to\mathbb{R}^{N}$ から始め、$N>2n+1$ の間は \ref{mfd:generic-projection.2} で $a^{\perp}\cong\mathbb{R}^{N-1}$ への埋め込みに取り替える（線形同型 $a^{\perp}\cong\mathbb{R}^{N-1}$ との合成は埋め込みを保つ）。$\mathbb{R}^{2n+1}$ への埋め込みが得られたら、$2n+1>2n$ なので \ref{mfd:generic-projection.1} から $\mathbb{R}^{2n}$ へのはめ込みが得られる。

::: hypcheck
- **コンパクト性**：単射なはめ込みが埋め込みになること、有限個の座標近傍で最初の埋め込みを作ることに使った。
- **サードの定理**：\ref{mfd:generic-projection} で、悪い方向の集合が測度 $0$ であることに使った。$2n<N-1$ という次元の条件が、サードの定理の系（像が測度 $0$）を使える条件である。
:::
:::

::: fact ホイットニーの定理の強い形 {#mfd:whitney-strong keywords="strong Whitney embedding into R^{2n} via the Whitney trick; noncompact manifolds embed as closed submanifolds of R^{2n+1}; Whitney immersion into R^{2n-1}" index="強いホイットニーの埋め込み定理|つよいほいっとにーのうめこみていり"}
1. コンパクトでない（第二可算な）$n$ 次元可微分多様体も、$\mathbb{R}^{2n+1}$ の閉部分多様体として埋め込める（固有な写像を使って同様に示せる）。
2. （強いホイットニーの埋め込み定理）$n\ge1$ のとき、$n$ 次元可微分多様体は $\mathbb{R}^{2n}$ に埋め込める（ホイットニー、1944 年。「ホイットニーのトリック」で自己交差を消す）。$n\ge2$ なら $\mathbb{R}^{2n-1}$ にはめ込める。$\mathbb{RP}^{n}$（$n$ が 2 の冪）は $\mathbb{R}^{2n-1}$ に埋め込めないので、$2n$ は一般には改善できない。
:::

::: supplement
**高い視点：内在的と外在的.** 多様体の定義は内在的（外側の空間なし）だが、ホイットニーの定理によって、抽象的な可微分多様体の圏と、ユークリッド空間の部分多様体の圏とは、対象の上では違いがない。比喩で言えば、地図帳（アトラス）だけで記述した世界も、必ずどこかの十分広い部屋に模型として置ける。ただし模型の置き方は一通りではなく、置き方の違い（たとえば結び目）を調べるのが埋め込みの理論である。リーマン計量まで込めて等長的に埋め込めるかはナッシュの埋め込み定理の問題で、微分幾何の側の話題になる。
:::

## 問題 {#mfd:sec-wh-problems}

::: problem {#mfd:prob-wh-circle}
\ref{mfd:whitney-embedding} は $S^{1}$ が $\mathbb{R}^{3}$ に埋め込めることを主張するが、実際には $\mathbb{R}^{2}$ に埋め込める。$2n+1$ が最良でない例として、$n$ 次元球面 $S^{n}$ が $\mathbb{R}^{n+1}$ に埋め込めることを確かめよ。
:::

::: solution
$S^{n}$ は $\mathbb{R}^{n+1}$ の部分多様体（正則値定理で $|x|^{2}=1$）として定義したので、包含写像が埋め込み。
:::

::: problem {#mfd:prob-wh-figure-eight}
\ref{mfd:figure-eight} の 8 の字は、$\mathbb{R}$（$1$ 次元）から $\mathbb{R}^{2}$ への単射なはめ込みだが埋め込みでない。\ref{mfd:generic-projection} の証明で $M$ のコンパクト性がどこで必要だったかを、この例と比べて説明せよ。
:::

::: solution
単射なはめ込みが埋め込み（像への同相）になることに、コンパクトからハウスドルフへの連続な全単射は同相、を使った。8 の字では定義域 $\mathbb{R}$ がコンパクトでなく、像の中で「無限の遠方」が交点に近づくため、像への写像の逆写像が連続でない。
:::
