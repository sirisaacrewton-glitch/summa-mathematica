# 接束とベクトル場 {#mfd:page-tangent-bundle keywords="manifold structure from charts on a set, tangent bundle TM via Jacobian gluing, cotangent bundle, tangent map dF: TM -> TN, vector fields as smooth sections, vector fields as derivations, Lie bracket, F-related vector fields"}

これまで接空間 $T_{m}M$ は点ごとに別々のベクトル空間だった。このページでは、すべての接空間を束ねた**接束** $TM=\bigsqcup_{m}T_{m}M$ に可微分多様体の構造を入れる。構成は具体的で、座標近傍ごとに $TM$ の一部を $U\times\mathbb{R}^{n}$ と同一視し、重なりをヤコビ行列で貼り合わせる。これにより、各点に接ベクトルを滑らかに対応させるもの（**ベクトル場**）が「$M\to TM$ の滑らかな切断」として定義でき、二つのベクトル場から**リー括弧**という新しいベクトル場が作れる。

接束の構成は、のちのファイバー束の一般論で「フレーム束に付随するベクトル束」として見直す（予定）。ここでは、その具体例として必要なことだけを、座標を使って直接示す。

## 記法と定義の確認 {#mfd:sec-tb-notation}

::: notation
- 可微分多様体・座標近傍・滑らかな写像は \ref{mfd:page-smooth-manifolds}。接空間 $T_{m}M$、座標ベクトル $\partial/\partial x_{i}|_{m}$、その変換則（\ref{mfd:change-of-coordinates}）、写像の微分 $dF_{m}$（\ref{mfd:differential}）、余接空間と $dx_{i}$（\ref{mfd:cotangent-space}, \ref{mfd:df-in-coordinates}）を使う。
- 多様体の次元を $n$ とする。$\mathbb{R}^{n}$ の開集合の間の写像 $\tau$ の $a$ におけるヤコビ行列を $D\tau(a)$ と書く。
- 位相多様体（ハウスドルフかつ第二可算）は \ref{mfd:topological-manifold}。
- 本ページは Warner『Foundations of Differentiable Manifolds and Lie Groups』第 1 章の後半を参考にし、接束の構成を「集合と貼り合わせ写像から多様体を作る補題」として独立させた。
:::

## 集合に多様体の構造を入れる {#mfd:sec-tb-construction}

::: lemma 貼り合わせによる多様体の構成 {#mfd:manifold-from-charts keywords="a set with a countable family of bijections onto open subsets of R^n with smooth transition maps and a separation condition has a unique topology and smooth structure making them charts" index="貼り合わせによる多様体|はりあわせによるたようたい"}
$X$ を集合とし、$X$ の部分集合 $U_{\alpha}$ と単射 $\varphi_{\alpha}\colon U_{\alpha}\to\mathbb{R}^{n}$ の可算族 $\{(U_{\alpha},\varphi_{\alpha})\}_{\alpha}$ が次を満たすとする。
1. $X=\bigcup_{\alpha}U_{\alpha}$、各 $\varphi_{\alpha}(U_{\alpha})$ と $\varphi_{\alpha}(U_{\alpha}\cap U_{\beta})$ は $\mathbb{R}^{n}$ の開集合。
2. $\varphi_{\beta}\circ\varphi_{\alpha}^{-1}\colon\varphi_{\alpha}(U_{\alpha}\cap U_{\beta})\to\varphi_{\beta}(U_{\alpha}\cap U_{\beta})$ は $C^{\infty}$ 級。
3. $X$ の相異なる 2 点 $p,q$ は、同じ $U_{\alpha}$ に含まれるか、交わらない $U_{\alpha}\ni p$, $U_{\beta}\ni q$ に含まれる。

このとき $X$ の位相で、各 $U_{\alpha}$ が開集合で各 $\varphi_{\alpha}$ が像への同相写像になるものがただ一つあり、$X$ は $\{(U_{\alpha},\varphi_{\alpha})\}$ をアトラスとする $n$ 次元の可微分多様体になる。
:::

::: proof
**Step 1（位相）.** 【主張：$\mathcal{B}\defeq\{\varphi_{\alpha}^{-1}(W):\alpha,\ W\subset\varphi_{\alpha}(U_{\alpha})\text{ は開集合}\}$ は $X$ のある位相の開基】$\mathcal{B}$ は $X$ を覆う。$\varphi_{\alpha}^{-1}(W)\cap\varphi_{\beta}^{-1}(W')=\varphi_{\alpha}^{-1}\bigl(W\cap(\varphi_{\alpha}\circ\varphi_{\beta}^{-1})^{-1}(W')\bigr)$ で、$\varphi_{\alpha}\circ\varphi_{\beta}^{-1}$ は 2 から連続（$C^{\infty}$ 級）で定義域 $\varphi_{\beta}(U_{\alpha}\cap U_{\beta})$ は開集合なので、括弧の中は $\varphi_{\alpha}(U_{\alpha}\cap U_{\beta})$ の開集合、したがって $\mathbb{R}^{n}$ の開集合。よって $\mathcal{B}$ は共通部分について閉じており、開基になる。

**Step 2（座標近傍）.** この位相で $U_{\alpha}=\varphi_{\alpha}^{-1}(\varphi_{\alpha}(U_{\alpha}))$ は開集合。$\varphi_{\alpha}\colon U_{\alpha}\to\varphi_{\alpha}(U_{\alpha})$ は全単射で、開集合 $W$ の逆像は $\mathcal{B}$ の元なので連続、$U_{\alpha}$ の開集合は $\mathcal{B}$ の元の和で、その像は Step 1 の計算から開集合なので開写像。よって同相写像。位相の一意性：各 $\varphi_{\alpha}$ が同相写像になる位相では $\mathcal{B}$ の元はすべて開で、逆にどの開集合 $O$ も $O=\bigcup_{\alpha}\varphi_{\alpha}^{-1}(\varphi_{\alpha}(O\cap U_{\alpha}))$ と $\mathcal{B}$ の元の和なので、位相は $\mathcal{B}$ の生成する位相に一致する。

**Step 3（ハウスドルフ・第二可算・可微分構造）.** 3 から、相異なる 2 点は同じ $U_{\alpha}$（$\mathbb{R}^{n}$ の開集合と同相でハウスドルフ）の中で分離されるか、交わらない開集合 $U_{\alpha},U_{\beta}$ で分離される。各 $U_{\alpha}$ は第二可算で、可算個の和なので $X$ は第二可算。座標変換は 2 から $C^{\infty}$ 級なので、\ref{mfd:maximal-atlas.1} から可微分構造が定まる。
:::

## 接束と余接束 {#mfd:sec-tb-bundles}

::: definition 接束 {#mfd:tangent-bundle keywords="tangent bundle TM: disjoint union of tangent spaces with charts (x, dx) glued by Jacobian matrices; projection pi; local trivialization" index="接束|せっそく, 接ベクトル束|せっべくとるそく, 自然な座標（接束）|しぜんなざひょうせっそく"}
$M$ を $n$ 次元の可微分多様体とする。
1. $TM\defeq\bigsqcup_{m\in M}T_{m}M$（元は組 $(m,v)$, $v\in T_{m}M$。しばしば $v$ と略す）、$\pi\colon TM\to M$, $\pi(m,v)\defeq m$ とする。
2. 座標近傍 $(U,\varphi)=(U;x_{1},\dots,x_{n})$ について
$$
\tilde\varphi\colon\pi^{-1}(U)\to\varphi(U)\times\mathbb{R}^{n},\qquad\tilde\varphi(m,v)\defeq\bigl(\varphi(m),\ (v(x_{1}),\dots,v(x_{n}))\bigr)
$$
と定める（\ref{mfd:tangent-basis.2} から $v=\sum_{i}v(x_{i})\,\partial/\partial x_{i}|_{m}$ なので、第 2 成分は $v$ の座標ベクトルによる成分）。$(\pi^{-1}(U),\tilde\varphi)$ を $TM$ の**自然な座標近傍**という。
:::

::: proposition 接束は可微分多様体 {#mfd:tangent-bundle-manifold keywords="TM is a smooth 2n-manifold; transition maps (a, xi) -> (tau(a), D tau(a) xi); pi is a smooth submersion; local trivializations are linear on fibres" index="接束の可微分構造|せっそくのかびぶんこうぞう"}
$M$ の可算な開基（\ref{mfd:topological-manifold}）の元のうち、ある座標近傍の定義域に含まれるもの $U_{\alpha}$ をすべてとり、座標近傍をそこに制限したものを $(U_{\alpha},\varphi_{\alpha})$ とする（可算個で、$U_{\alpha}$ の全体も $M$ の開基になる）。
1. $\{(\pi^{-1}(U_{\alpha}),\tilde\varphi_{\alpha})\}$ は \ref{mfd:manifold-from-charts} の条件を満たし、$TM$ は $2n$ 次元の可微分多様体になる。座標変換は、$\tau\defeq\varphi_{\beta}\circ\varphi_{\alpha}^{-1}$ について
$$
\tilde\varphi_{\beta}\circ\tilde\varphi_{\alpha}^{-1}(a,\xi)=\bigl(\tau(a),\ D\tau(a)\,\xi\bigr).
$$
2. この可微分構造は可算個の座標近傍の選び方によらず、$M$ の任意の座標近傍の自然な座標近傍はこの構造に属する。
3. $\pi$ は滑らかな沈め込みで、$\pi^{-1}(U)\to U\times\mathbb{R}^{n}$, $(m,v)\mapsto(m,(v(x_{i}))_{i})$ は微分同相写像で、各ファイバー $T_{m}M$ の上で線形同型（**局所自明化**）。
:::

::: proof
**Step 1（座標変換）.** $(m,v)\in\pi^{-1}(U_{\alpha}\cap U_{\beta})$ で、$x_{i}$, $y_{i}$ をそれぞれの座標関数とする。\ref{mfd:change-of-coordinates} から $\partial/\partial x_{j}|_{m}=\sum_{i}\frac{\partial y_{i}}{\partial x_{j}}(m)\,\partial/\partial y_{i}|_{m}$ なので、$v=\sum_{j}\xi_{j}\,\partial/\partial x_{j}|_{m}$ なら $v(y_{i})=\sum_{j}\frac{\partial y_{i}}{\partial x_{j}}(m)\xi_{j}$。係数は $D\tau(\varphi_{\alpha}(m))$ の成分なので式が成り立つ。右辺は $(a,\xi)$ について $C^{\infty}$ 級（$\tau$ が $C^{\infty}$ 級で、第 2 成分は $D\tau$ の成分と $\xi$ の多項式）。

**Step 2（\ref{mfd:manifold-from-charts} の条件）.** $\tilde\varphi_{\alpha}$ は単射（$m$ は $\varphi_{\alpha}(m)$ で、$v$ はその成分で決まる）で、像 $\varphi_{\alpha}(U_{\alpha})\times\mathbb{R}^{n}$ と $\tilde\varphi_{\alpha}(\pi^{-1}(U_{\alpha}\cap U_{\beta}))=\varphi_{\alpha}(U_{\alpha}\cap U_{\beta})\times\mathbb{R}^{n}$ は開集合。座標変換は Step 1 から $C^{\infty}$ 級。分離条件：$(m,v)\neq(m',v')$ のとき、$m=m'$ なら同じ $\pi^{-1}(U_{\alpha})$ に含まれる。$m\neq m'$ なら、$M$ のハウスドルフ性から交わらない開近傍をとり、その中に $m$, $m'$ を含む $U_{\alpha}$, $U_{\beta}$ をとれば（$U_{\alpha}$ の全体は開基）、$\pi^{-1}(U_{\alpha})$ と $\pi^{-1}(U_{\beta})$ は交わらない。

**Step 3（2 と 3）.** 任意の座標近傍 $(U,\varphi)$ の自然な座標近傍と $\tilde\varphi_{\alpha}$ の座標変換も Step 1 の形で $C^{\infty}$ 級なので、極大性から構造に属し、二つの可算族から得られる構造は互いの座標近傍を含むので一致する（\ref{mfd:maximal-atlas.1}）。自然な座標では $\pi$ は $(a,\xi)\mapsto a$ で、滑らかな沈め込み。局所自明化は自然な座標で見ると $(a,\xi)\mapsto(\varphi^{-1}(a),\xi)$ に $\varphi$ を合成したもので微分同相写像、ファイバー上では成分を取り出す線形同型。
:::

::: intuition
接束は、多様体の各点に、その点の接平面を一枚ずつ立てて束ねたものである。座標の中では「点の座標 $n$ 個とベクトルの成分 $n$ 個」で $2n$ 個の座標をもち、座標を取り替えると、点は座標変換で、ベクトルの成分はそのヤコビ行列で移る。
:::

::: proposition 写像の微分と接束 {#mfd:tangent-map keywords="the differential of a smooth map is a smooth map dF: TM -> TN, linear on fibres; T is a functor" index="接写像|せっしゃぞう"}
滑らかな写像 $F\colon M\to N$ について、$dF\colon TM\to TN$, $(m,v)\mapsto(F(m),dF_{m}v)$ は滑らかで、各ファイバーの上で線形。$d(G\circ F)=dG\circ dF$, $d(\mathrm{id}_{M})=\mathrm{id}_{TM}$。
:::

::: proof
自然な座標近傍で見ると、\ref{mfd:differential-properties.3} から $dF$ は $(a,\xi)\mapsto\bigl(\hat F(a),D\hat F(a)\xi\bigr)$（$\hat F$ は $F$ の局所表示）で、$C^{\infty}$ 級。残りは \ref{mfd:differential-properties.1}。
:::

::: definition 余接束 {#mfd:cotangent-bundle keywords="cotangent bundle T*M with charts (x, dx components), glued by the inverse transpose of the Jacobian; bundle of alternating k-forms" index="余接束|よせっそく"}
$T^{*}M\defeq\bigsqcup_{m}T_{m}^{*}M$ に、座標近傍 $(U;x_{1},\dots,x_{n})$ ごとに $(m,\lambda)\mapsto\bigl(\varphi(m),(\lambda(\partial/\partial x_{1}|_{m}),\dots,\lambda(\partial/\partial x_{n}|_{m}))\bigr)$ を座標近傍として入れたものを**余接束**という。座標変換は $(a,\eta)\mapsto\bigl(\tau(a),\ (D\tau(a)^{-1})^{\mathsf{T}}\eta\bigr)$ で（\ref{mfd:df-in-coordinates} と双対基底の変換）、\ref{mfd:manifold-from-charts} から $2n$ 次元の可微分多様体になる。同様に、$\Lambda^{k}T^{*}M\defeq\bigsqcup_{m}\Lambda^{k}T^{*}_{m}M$ は、成分 $(\omega(\partial/\partial x_{i_{1}},\dots,\partial/\partial x_{i_{k}}))_{i_{1}<\cdots<i_{k}}$ を座標として可微分多様体になる。
:::

\ref{mfd:differential-form} の「滑らかな $k$ 形式」は、ちょうど写像 $M\to\Lambda^{k}T^{*}M$, $m\mapsto\omega_{m}$ が滑らかなことと同じである（自然な座標で見ると、成分 $f_{I}$ が滑らかであること）。

## ベクトル場 {#mfd:sec-tb-vector-fields}

::: definition ベクトル場 {#mfd:vector-field keywords="smooth vector field: smooth section of the tangent bundle; components in a chart; X f; the space of vector fields" index="ベクトル場（多様体）|べくとるばたようたい, 切断（接束）|せつだんせっそく, 𝔛(M)|かいえむ"}
$M$ の開集合 $W$ 上の**ベクトル場**とは、写像 $X\colon W\to TM$ で $\pi\circ X=\mathrm{id}_{W}$（つまり各点 $m$ に $X_{m}\in T_{m}M$ を対応させるもの）であって、滑らかなものをいう。その全体を $\mathfrak{X}(W)$ と書く。座標近傍 $(U;x_{1},\dots,x_{n})$ の上で $X=\sum_{i}X^{i}\,\partial/\partial x_{i}$（$X^{i}(m)\defeq X_{m}(x_{i})$）を $X$ の**成分**表示という。$f\in C^{\infty}(W)$ について、関数 $Xf$ を $(Xf)(m)\defeq X_{m}(f)$ で定める。
:::

::: proposition ベクトル場の判定と導分 {#mfd:vector-field-derivation keywords="a section is smooth iff its components are smooth iff Xf is smooth for every smooth f; vector fields correspond to derivations of C^infinity(M)" index="ベクトル場と導分|べくとるばとどうぶん"}
$M$ を可微分多様体とする。
1. 写像 $X\colon M\to TM$ で $\pi\circ X=\mathrm{id}$ となるものについて、次は同値：(a) $X$ は滑らか。(b) 各座標近傍で成分 $X^{i}$ は滑らか。(c) すべての $f\in C^{\infty}(M)$ について $Xf\in C^{\infty}(M)$。
2. $X\in\mathfrak{X}(M)$ について、$f\mapsto Xf$ は $C^{\infty}(M)$ の**導分**（$\mathbb{R}$ 線形で $X(fg)=f\,Xg+g\,Xf$）である。逆に、$C^{\infty}(M)$ の任意の導分 $D$ について、$D=X$（$Df=Xf$）となる $X\in\mathfrak{X}(M)$ がただ一つある。
:::

::: proof
**1.** (a)⇔(b)：自然な座標近傍で $X$ は $a\mapsto(a,(X^{i}\circ\varphi^{-1}(a))_{i})$。(b)⇒(c)：座標近傍で $Xf=\sum_{i}X^{i}\,\partial f/\partial x_{i}$ は滑らか。(c)⇒(b)：$m$ を含む座標近傍で、\ref{mfd:bump-function} の隆起関数を使って、$m$ の近くで $x_{i}$ に一致する $\tilde x_{i}\in C^{\infty}(M)$ をとると（\ref{mfd:smooth-urysohn}）、$m$ の近くで $X^{i}=X\tilde x_{i}$ は滑らか（$X_{p}$ は芽にしかよらない）。

**2.** 前半は各点のライプニッツ則。後半：$m$ と $f\in C^{\infty}(M)$ について $X_{m}(f)\defeq(Df)(m)$ とおく。**局所性**：$f$ が $m$ の近傍 $O$ で $0$ なら、$m$ の近くで $1$、$O$ の外で $0$ の滑らかな関数 $h$（\ref{mfd:smooth-urysohn}）について $hf=0$ なので、$0=D(hf)(m)=h(m)Df(m)+f(m)Dh(m)=Df(m)$。よって $(Df)(m)$ は $f$ の $m$ での芽にしかよらず、$m$ の近くだけで定義された関数も隆起関数で延ばして代入できるので、$X_{m}$ は芽の上の導分、すなわち $X_{m}\in T_{m}M$。$Xf=Df$ は滑らかなので、1 から $X$ は滑らか。一意性は $X_{m}$ が $Df(m)$ で決まることから。
:::

::: intuition
ベクトル場とは、多様体の各点に矢印を一本ずつ滑らかに立てたもので、関数に作用させると「その矢印の方向に微分した関数」を返す。逆に、関数を微分する操作（積の微分法則を満たすもの）はどれもベクトル場から来る。
:::

## リー括弧 {#mfd:sec-tb-bracket}

::: definition リー括弧 {#mfd:lie-bracket keywords="Lie bracket of vector fields [X,Y] f = X(Yf) - Y(Xf); coordinate formula" index="リー括弧|りーかっこ, ベクトル場の括弧積|べくとるばのかっこせき"}
$X,Y\in\mathfrak{X}(M)$ について、$f\mapsto X(Yf)-Y(Xf)$ は $C^{\infty}(M)$ の導分で、\ref{mfd:vector-field-derivation.2} から $[X,Y]\in\mathfrak{X}(M)$ が定まる。これを**リー括弧**という。座標近傍で $X=\sum X^{i}\partial_{i}$, $Y=\sum Y^{j}\partial_{j}$（$\partial_{i}=\partial/\partial x_{i}$）なら
$$
[X,Y]=\sum_{j}\Bigl(\sum_{i}\bigl(X^{i}\partial_{i}Y^{j}-Y^{i}\partial_{i}X^{j}\bigr)\Bigr)\partial_{j}.
$$
:::

導分であること：$X(Y(fg))=X(f\,Yg+g\,Yf)=Xf\,Yg+f\,XYg+Xg\,Yf+g\,XYf$ で、$X,Y$ を入れ替えたものを引くと $Xf\,Yg+Xg\,Yf$ の項が消え、$f[X,Y]g+g[X,Y]f$ が残る。座標表示は、$X(Yf)=\sum_{i,j}X^{i}\partial_{i}(Y^{j}\partial_{j}f)$ を展開し、2 階偏微分 $\partial_{i}\partial_{j}f$ の項が対称性で打ち消し合うことから。

::: proposition リー括弧の性質 {#mfd:lie-bracket-properties keywords="bilinear, antisymmetric, Jacobi identity, [X, fY] = (Xf) Y + f [X,Y], naturality under diffeomorphisms and F-related fields" index="ヤコビ恒等式（ベクトル場）|やこびこうとうしきべくとるば, F 関係（ベクトル場）|えふかんけいべくとるば"}
$X,Y,Z\in\mathfrak{X}(M)$, $f,g\in C^{\infty}(M)$ とする。
1. $[\,,\,]$ は $\mathbb{R}$ 双線形で反対称、ヤコビ恒等式 $[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]=0$ を満たす。すなわち $\mathfrak{X}(M)$ は実リー代数である。
2. $[fX,gY]=fg[X,Y]+f(Xg)Y-g(Yf)X$。
3. 滑らかな写像 $F\colon M\to N$ と $\tilde X,\tilde Y\in\mathfrak{X}(N)$ について、各点で $dF_{m}X_{m}=\tilde X_{F(m)}$ のとき $X$ と $\tilde X$ は **$F$ 関係**にあるという。$X\sim_{F}\tilde X$, $Y\sim_{F}\tilde Y$ なら $[X,Y]\sim_{F}[\tilde X,\tilde Y]$。
:::

::: proof
**1.** 双線形と反対称は定義から。ヤコビ恒等式は、作用素として $[X,[Y,Z]]=XYZ-XZY-YZX+ZYX$ を巡回的に足すと、12 項がすべて打ち消し合うことから。

**2.** $fX(gYh)-gY(fXh)=fg\,XYh+f(Xg)Yh-gf\,YXh-g(Yf)Xh$。

**3.** $X\sim_{F}\tilde X$ は、$N$ 上の滑らかな $g$ について $X(g\circ F)=(\tilde Xg)\circ F$ と同値（$X_{m}(g\circ F)=dF_{m}X_{m}(g)$）。よって $XY(g\circ F)=X((\tilde Yg)\circ F)=(\tilde X\tilde Yg)\circ F$ で、入れ替えて引けば $[X,Y](g\circ F)=([\tilde X,\tilde Y]g)\circ F$。$g$ として $N$ の座標関数（を隆起関数で延ばしたもの）をとれば $dF_{m}[X,Y]_{m}=[\tilde X,\tilde Y]_{F(m)}$。
:::

::: supplement
**高い視点.** \ref{mfd:vector-field-derivation} により、$\mathfrak{X}(M)$ は可換環 $C^{\infty}(M)$ の導分全体 $\mathrm{Der}_{\mathbb{R}}(C^{\infty}(M))$ と同じもので、リー括弧は「導分の交換子は導分」という代数的な事実そのものである。比喩で言えば、ベクトル場は空間の「無限小の動き」で、二つの動きを交互に少しずつ行ったときの食い違いがリー括弧である（次のページの流れで正確になる）。接束 $TM\to M$ は、各ファイバーが $\mathbb{R}^{n}$ で、座標変換がヤコビ行列（$GL_{n}(\mathbb{R})$ の元）で貼り合わさる構造をもつ。この「$GL_{n}(\mathbb{R})$ で貼り合わさるファイバー $\mathbb{R}^{n}$ の束」という形が、ファイバー束の一般論での**構造群**の考えの原型になる。
:::

## 問題 {#mfd:sec-tb-problems}

::: problem {#mfd:prob-tb-circle}
$S^{1}\subset\mathbb{R}^{2}$ について、$TS^{1}$ は $S^{1}\times\mathbb{R}$ と微分同相であることを示せ（ファイバー上で線形な微分同相写像を作れ）。
:::

::: solution
$S^{1}$ 上のベクトル場 $\Theta\defeq-y\,\partial_{x}+x\,\partial_{y}$ を考える。$\mathbb{R}^{2}$ 上のこのベクトル場は $S^{1}$ の各点で接し（$x^{2}+y^{2}$ を微分すると $0$）、包含写像に関して $S^{1}$ 上のベクトル場 $\Theta$ と $\iota$ 関係にあるものが一意に定まる（$d\iota_{m}$ は単射）。$\Theta_{m}\neq0$ なので $T_{m}S^{1}=\mathbb{R}\Theta_{m}$。$S^{1}\times\mathbb{R}\to TS^{1}$, $(m,t)\mapsto t\Theta_{m}$ は全単射で、自然な座標で見ると $(a,t)\mapsto(a,t\Theta^{1}(a))$（$\Theta^{1}$ は成分で $0$ にならない）なので滑らかで、逆も $(a,\xi)\mapsto(a,\xi/\Theta^{1}(a))$ で滑らか。
:::

::: problem {#mfd:prob-tb-bracket-coordinates}
$\mathbb{R}^{2}$ 上のベクトル場 $X=\partial_{x}$, $Y=x\,\partial_{y}$ について $[X,Y]$ を求め、$[X,Y]\neq0$ であることを確かめよ。
:::

::: solution
座標表示の公式で $X^{1}=1$, $X^{2}=0$, $Y^{1}=0$, $Y^{2}=x$。$[X,Y]^{2}=X^{1}\partial_{x}Y^{2}=1$、$[X,Y]^{1}=0$ なので $[X,Y]=\partial_{y}\neq0$。直接には $X(Yf)-Y(Xf)=\partial_{x}(x\partial_{y}f)-x\partial_{y}\partial_{x}f=\partial_{y}f$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{mfd:sec-tb-exercises} にまとめた。
