# 向き・積分とストークスの定理 {#mfd:page-integration-stokes keywords="orientation of a vector space, orientable manifold, oriented atlas, volume form, regular domain, boundary, outward vector, induced boundary orientation, integration of n-forms, change of variables, Stokes' theorem on manifolds, divergence theorem, de Rham cohomology top degree"}

$\mathbb{R}^{n}$ の開集合の上では、$n$ 形式 $f\,dr_{1}\wedge\cdots\wedge dr_{n}$ の積分を $f$ の重積分として定義でき、座標を取り替えると変数変換公式のヤコビアン $\det D\tau$ が現れる（\ref{calc:pullback-properties.5}）。重積分の変数変換では $|\det D\tau|$ が現れるので、二つが一致するのは $\det D\tau>0$ のときである。このため、多様体の上で $n$ 形式を積分するには、座標近傍の「向き」をそろえておく必要がある。このページでは、**向き**を定義し、向きづけられた多様体の**境界つき領域**の上で $n$ 形式の積分を定義する。主定理は**多様体上のストークスの定理**
$$
\int_{D}d\omega=\int_{\partial D}\omega
$$
で、微分積分学の基本定理・グリーンの定理・ガウスの発散定理を一つにまとめたものである。

## 記法と定義の確認 {#mfd:sec-is-notation}

::: notation
- 可微分多様体・座標近傍・部分多様体・滑らかな 1 の分割は \ref{mfd:page-smooth-manifolds}・\ref{mfd:page-partitions-submanifolds}、微分形式・局所表示 $\omega^{\varphi}$・引き戻し・外微分は \ref{mfd:page-forms-on-manifolds} のとおり。$\mathbb{R}^{n}$ の座標は $r_{1},\dots,r_{n}$。
- 重積分・ジョルダン可測集合と、その上の積分（$\chi_{E}$ を掛けて零延長した関数の積分）は \ref{calc:box-integral}・\ref{calc:jordan-measurable}、\ref{calc:change-of-variables}、連続関数の累次積分は \ref{calc:fubini-continuous}。
- 閉半空間を $\mathbb{H}^{n}\defeq\{r\in\mathbb{R}^{n}:r_{n}\le0\}$ とする（境界 $\{r_{n}=0\}$ の外向きが $+e_{n}$ になるように、下半分をとる）。
- 微分形式 $\omega$ の**台** $\operatorname{supp}\omega$ は $\{m:\omega_{m}\neq0\}$ の閉包。
- 本ページは Warner『Foundations of Differentiable Manifolds and Lie Groups』4.1〜4.9 を参考にした。Warner は正則な単体を使って積分を定義するが、ここでは座標近傍と半空間の上の重積分で直接定義した。
:::

## 向き {#mfd:sec-is-orientation}

::: definition ベクトル空間の向き {#mfd:vector-space-orientation keywords="orientation of a finite dimensional vector space as a component of nonzero top forms; oriented bases" index="向き（ベクトル空間）|むきべくとるくうかん, 正の基底|せいのきてい"}
$V$ を $n$ 次元の実ベクトル空間（$n\ge1$）とする。$\Lambda^{n}V^{*}$ は $1$ 次元（\ref{mfd:abstract-wedge.3}）なので、$0$ でない元は「正の実数倍で移り合う」という同値関係で二つの類に分かれる。その一方を選ぶことを $V$ の**向き**という。向き $o$ について、順序のついた基底 $(b_{1},\dots,b_{n})$ が**正の基底**であるとは、双対基底 $(\theta_{i})$ について $\theta_{1}\wedge\cdots\wedge\theta_{n}\in o$ となることをいう。$0$ 次元のベクトル空間の向きは符号 $\pm1$ の選択とする。
:::

::: intuition
ベクトル空間の向きとは、基底の並べ方を「右手系」と「左手系」の二組に分け、どちらを正とするかを決めることである。
:::

二つの基底 $(b_{j})$, $(b'_{j})$ について、$b'_{j}=\sum_{i}P_{ij}b_{i}$ なら双対基底は $\theta'=({}^{t}P)^{-1}$ で変わるので、$\theta'_{1}\wedge\cdots\wedge\theta'_{n}=\det(P)^{-1}\theta_{1}\wedge\cdots\wedge\theta_{n}$（\ref{mfd:abstract-wedge.2} の行列式の式を基底 $b'$ で評価する）。よって二つの基底が同じ向きで正であることは $\det P>0$ と同値である。

::: definition 多様体の向き {#mfd:orientation keywords="orientation of a manifold: continuous choice of orientations of tangent spaces; positively oriented charts; orientable; orientation preserving maps" index="向き（多様体）|むきたようたい, 向き付け可能|むきづけかのう, 向きを保つ|むきをたもつ, 正の座標近傍|せいのざひょうきんぼう"}
$M$ を $n$ 次元の可微分多様体（$n\ge1$）とする。
1. 各点 $m$ に $T_{m}M$ の向き $o_{m}$ を選んだもの $o=(o_{m})$ が $M$ の**向き**であるとは、各点 $m$ に、$m$ を含む座標近傍 $(U;x_{1},\dots,x_{n})$ で、$U$ のすべての点 $p$ で $(dx_{1}\wedge\cdots\wedge dx_{n})_{p}\in o_{p}$ となるもの（**正の座標近傍**）があることをいう。向きをもちうる多様体を**向き付け可能**という。
2. 向きづけられた多様体の間の局所微分同相写像 $F\colon M\to N$ が**向きを保つ**とは、各点で $dF_{m}$ が正の基底を正の基底に移すことをいう。
3. $\mathbb{R}^{n}$ とその開集合には、$dr_{1}\wedge\cdots\wedge dr_{n}$ の類による**標準的な向き**を入れる。
:::

::: intuition
多様体の向きとは、各点の接空間の向きを、近くの点どうしで食い違わないように選んだものである。向き付け可能とは、そういう選び方が全体で一つでもあることである。
:::

::: proposition 向き付け可能性の言い換え {#mfd:orientable-equivalents keywords="orientable iff there is an atlas with positive Jacobians iff there is a nowhere vanishing n-form" index="向き付け可能性の言い換え|むきづけかのうせいのいいかえ, 体積形式|たいせきけいしき"}
$n$ 次元の可微分多様体 $M$（$n\ge1$）について、次は同値である。
1. $M$ は向き付け可能。
2. 座標変換のヤコビ行列式がすべて正であるアトラスがある。
3. どの点でも $0$ にならない $n$ 形式（**体積形式**）がある。

さらに、向き $o$ を固定すると、連結な定義域をもつ座標近傍 $(U;x)$ は、正の座標近傍であるか、$x_{1}$ を $-x_{1}$ に取り替えると正の座標近傍になるかのどちらかである。
:::

::: proof
**Step 1（符号は局所的に一定）.** 【主張：二つの座標近傍 $(U;x)$, $(V;y)$ の共通部分で $dx_{1}\wedge\cdots\wedge dx_{n}=\det\bigl(\partial x_{i}/\partial y_{j}\bigr)\,dy_{1}\wedge\cdots\wedge dy_{n}$】\ref{mfd:df-in-coordinates} から $dx_{i}=\sum_{j}\frac{\partial x_{i}}{\partial y_{j}}dy_{j}$。両辺の $n$ 形式を基底 $(\partial/\partial y_{1},\dots,\partial/\partial y_{n})$ で評価すると、\ref{mfd:abstract-wedge.2} の行列式の式から、左辺は $\det(\partial x_{i}/\partial y_{j})$、右辺は $\det(\partial x_{i}/\partial y_{j})\cdot1$。$n$ 形式は一つの基底での値で決まる（$\Lambda^{n}$ は 1 次元）。

**Step 2（最後の主張）.** 【主張：連結な $U$ の上で $(dx_{1}\wedge\cdots\wedge dx_{n})_{p}\in o_{p}$ となる点の全体は、空か $U$ 全体】そのような点の集合を $A$ とする。$p\in U$ と、$p$ を含む正の座標近傍 $(V;y)$ をとると、$U\cap V$ の上で Step 1 の行列式 $\delta$ は連続で $0$ にならない（座標変換のヤコビ行列式）ので、$p$ の近くで符号が一定。$p\in A\iff\delta(p)>0$ なので、$A$ と $U\setminus A$ はともに開集合。$U$ は連結なので一方は空。$A=\varnothing$ なら、$x_{1}$ を $-x_{1}$ にすると $dx_{1}\wedge\cdots\wedge dx_{n}$ の符号が変わり（\ref{mfd:maximal-atlas.3}）、正の座標近傍になる。

**1 ⇒ 2.** 各点のまわりに、像が開球（連結）の正の座標近傍をとる。二つの正の座標近傍の共通部分の各点で、Step 1 の式の両辺の $n$ 形式はともに $o_{p}$ に属するので $\det(\partial x_{i}/\partial y_{j})>0$。

**2 ⇒ 3.** 2 のアトラス $\{(U_{\alpha};x^{\alpha})\}$ に従属する滑らかな 1 の分割 $(\phi_{\alpha})$（\ref{mfd:smooth-partition-of-unity.2}）をとり、$\Theta\defeq\sum_{\alpha}\phi_{\alpha}\,dx^{\alpha}_{1}\wedge\cdots\wedge dx^{\alpha}_{n}$（各項は $U_{\alpha}$ の外で $0$ とする）とおく。台の族が局所有限なので、各点の近くで有限和となり滑らか。点 $p$ と、$p$ を含む一つの $U_{\beta}$ について、Step 1 から $\Theta_{p}=\bigl(\sum_{\alpha}\phi_{\alpha}(p)\det(\partial x^{\alpha}_{i}/\partial x^{\beta}_{j})(p)\bigr)(dx^{\beta}_{1}\wedge\cdots)_{p}$ で、係数は正の数の和（$\sum\phi_{\alpha}(p)=1$ で、行列式は正）なので $0$ でない。

**3 ⇒ 1.** 体積形式 $\Theta$ について、$o_{p}$ を $\Theta_{p}$ の類とする。各点のまわりの連結な座標近傍 $(U;x)$ で $\Theta=f\,dx_{1}\wedge\cdots\wedge dx_{n}$ と書くと $f$ は連続で $0$ にならないので、符号が一定（中間値の定理を連結な $U$ 上の連続関数に使う、\ref{top:connected}）。$f<0$ なら $x_{1}$ を $-x_{1}$ に取り替えて、正の座標近傍を得る。
:::

::: example
1. 球面 $S^{n}$ は向き付け可能：立体射影の座標変換 $u\mapsto u/|u|^{2}$ のヤコビ行列式は $-|u|^{-2n}$（$n\ge1$）で負なので、片方の座標の $u_{1}$ を $-u_{1}$ に取り替えると、ヤコビ行列式が正のアトラスになる（行列式の計算は問題）。
2. メビウスの帯は向き付け不可能であることが知られている（帯を一周すると基底の向きが反転する）。
3. 向き付け可能な連結多様体の向きはちょうど二つある（\ref{mfd:orientable-equivalents} の Step 2 と同じ議論で、二つの向きが一致する点の集合は開かつ閉）。
:::

## 境界つき領域 {#mfd:sec-is-domains}

::: definition 境界つき領域 {#mfd:regular-domain keywords="regular domain in a manifold, interior and boundary points, half-space charts" index="境界つき領域|きょうかいつきりょういき, 正則領域|せいそくりょういき, 境界（正則領域）|きょうかいせいそくりょういき, 半空間型の座標近傍|はんくうかんがたのざひょうきんぼう"}
$n$ 次元の可微分多様体 $M$（$n\ge1$）の部分集合 $D$ が**境界つき領域**（**正則領域**）であるとは、各点 $m\in M$ が次のどれかを満たすことをいう。
1. $m$ の開近傍で $M\setminus D$ に含まれるものがある（**外点**）。
2. $m$ の開近傍で $D$ に含まれるものがある（**内点**）。
3. $m$ を中心とする座標近傍 $(U,\varphi)$ で $\varphi(U\cap D)=\varphi(U)\cap\mathbb{H}^{n}$ となるもの（**半空間型の座標近傍**）がある（**境界点**）。

境界点の全体を $\partial D$ と書く。$D=M$ のとき $\partial D=\varnothing$。
:::

::: intuition
境界つき領域とは、各点のまわりで、外にあるか、内にあるか、平らな壁で内と外に分かれているかのどれかになっている部分集合である。
:::

::: proposition 境界の性質 {#mfd:boundary-properties keywords="the three kinds of points are exclusive; the boundary is a closed (n-1)-submanifold; outward vectors are well defined; D is closed" index="外向きのベクトル|そとむきのべくとる, 境界の性質（正則領域）|きょうかいのせいしつせいそくりょういき"}
$D$ を境界つき領域とする。
1. 各点は 1〜3 のうちちょうど一つを満たす。半空間型の座標近傍 $(U,\varphi)$ の中では、$U\cap\partial D=\varphi^{-1}(\{r_{n}=0\})$、$U\cap\operatorname{int}D=\varphi^{-1}(\{r_{n}<0\})$。$D$ は閉集合で $D=\operatorname{int}D\sqcup\partial D$。
2. $\partial D$ は $M$ の $(n-1)$ 次元の部分多様体で、閉集合である。
3. $m\in\partial D$ と $v\in T_{m}M$ について、ある半空間型の座標近傍で $dx_{n}(v)>0$ なら、どの半空間型の座標近傍でも $dx_{n}(v)>0$。このような $v$ を**外向き**という。
:::

::: proof
**1.** 半空間型の座標近傍 $(U,\varphi)$ の点 $p$ で $\varphi(p)_{n}=0$ のとき、$p$ のどの開近傍 $W$ についても、$\varphi(W\cap U)$ は $\varphi(p)$ の近傍なので $r_{n}>0$ の点（$D$ の外）と $r_{n}\le0$ の点（$D$ の中）を含む。よって $p$ は外点でも内点でもない。$\varphi(p)_{n}<0$ なら $\varphi^{-1}(\varphi(U)\cap\{r_{n}<0\})$ は $D$ に含まれる開近傍なので内点、$\varphi(p)_{n}>0$ なら同様に外点。外点と内点は明らかに両立しない（内点は $D$ に、外点は $M\setminus D$ に属する）。よって 3 だけを満たす点は、その座標近傍の $r_{n}=0$ の点と一致し、主張の式が成り立つ。外点の全体は開集合で、その補集合が $D$ なので $D$ は閉。

**2.** 半空間型の座標近傍に、座標の順番を $(r_{n},r_{1},\dots,r_{n-1})$ に並べ替える線形同型を合成すると（\ref{mfd:maximal-atlas.3}）、1 から $\varphi'(U\cap\partial D)=\varphi'(U)\cap(\{0\}\times\mathbb{R}^{n-1})$。これは最後の $n-1$ 個の座標のスライスで、座標の並べ替えでスライス座標近傍（\ref{mfd:submanifold}）になる。$\partial D=D\setminus\operatorname{int}D$ は閉集合と開集合の差なので閉。

**3.** 二つの半空間型の座標近傍 $(U;x)$, $(V;y)$ の座標変換 $\tau=\psi\circ\varphi^{-1}$ は、$\{r_{n}\le0\}$ を $\{r_{n}\le0\}$ に、$\{r_{n}=0\}$ を $\{r_{n}=0\}$ に移す（1）。よって $a=\varphi(m)$ で、$\tau_{n}$ は $r_{n}=0$ の上で $0$ なので $\partial_{j}\tau_{n}(a)=0$（$j<n$）、$r_{n}<0$ で $\tau_{n}<0$ なので $\partial_{n}\tau_{n}(a)=\lim_{t\to0^{-}}\tau_{n}(a+te_{n})/t\ge0$。$D\tau(a)$ は可逆で、第 $n$ 行は $(0,\dots,0,\partial_{n}\tau_{n}(a))$ なので $\partial_{n}\tau_{n}(a)>0$。$dy_{n}(v)=\sum_{j}\frac{\partial y_{n}}{\partial x_{j}}(m)dx_{j}(v)=\partial_{n}\tau_{n}(a)\,dx_{n}(v)$ なので符号は一致する。
:::

::: definition 境界の向き {#mfd:boundary-orientation keywords="induced (Stokes) orientation on the boundary: outward vector first" index="境界の向き|きょうかいのむき, 誘導された向き|ゆうどうされたむき"}
$M$ を向きづけられた $n$ 次元の多様体、$D$ を境界つき領域、$m\in\partial D$、$v$ を外向きのベクトルとする。$T_{m}\partial D$ の基底 $(v_{1},\dots,v_{n-1})$ を、$(v,v_{1},\dots,v_{n-1})$ が $T_{m}M$ の正の基底であるとき正と定める（$n=1$ では、$v$ が正の基底なら $+1$、そうでなければ $-1$）。これを $\partial D$ の**誘導された向き**という。
:::

正の半空間型の座標近傍 $(U;x)$ では $\partial/\partial x_{n}$ が外向きで、$(\partial/\partial x_{n},\partial/\partial x_{1},\dots,\partial/\partial x_{n-1})$ は $(\partial/\partial x_{1},\dots,\partial/\partial x_{n})$ を $n-1$ 回の互換で並べ替えたものなので、境界の座標近傍 $(U\cap\partial D;x_{1},\dots,x_{n-1})$ は $(-1)^{n-1}$ が正のとき正、負のとき負である。とくに誘導された向きは向きの定義（\ref{mfd:orientation.1}）を満たす。これが基底の選び方によらないことは、外向きのベクトルの取り替え $v'=cv+w$（$c>0$, $w\in T_{m}\partial D$。\ref{mfd:boundary-properties.3}）で、基底変換の行列式が $c>0$ になることから従う。

## 積分 {#mfd:sec-is-integral}

::: lemma 半空間を保つ変数変換 {#mfd:half-space-change-of-variables keywords="change of variables for compactly supported continuous functions on open sets and half-spaces under orientation preserving diffeomorphisms" index="半空間での変数変換|はんくうかんでのへんすうへんかん"}
$O,O'\subset\mathbb{R}^{n}$ を開集合、$\tau\colon O\to O'$ を $C^{\infty}$ 微分同相写像で $\det D\tau>0$、$S$ は $\mathbb{R}^{n}$ または $\mathbb{H}^{n}$ で $\tau(O\cap S)=O'\cap S$ とする。$g\colon O'\to\mathbb{R}$ を連続で、台 $K$ がコンパクトとする（$O'$ の外では $0$ と延ばす）。$\int_{S}g\defeq\int_{R\cap S}g$（$R$ は $K$ を含む閉直方体）と定めると、これは $R$ によらず
$$
\int_{S}g=\int_{S}(g\circ\tau)\det D\tau.
$$
:::

::: proof
**Step 1（定義の確かさ）.** 【主張：$\int_{R\cap S}g$ は $R$ によらない】$R\cap S$ は直方体（$S=\mathbb{H}^{n}$ なら第 $n$ 辺を $r_{n}\le0$ の側で切る）で、$g$ はその上で連続なので積分可能。二つの $R$ について、共通部分の直方体に \ref{calc:integral-zero-extension} を使えばよい（$g$ は $K$ の外で $0$）。

**Step 2（よい近似集合）.** 【主張：コンパクトでジョルダン可測な $E$ で、$\tau^{-1}(K)\cap S\subset E\subset O\cap S$ となるものがある】$L\defeq\tau^{-1}(K)$ はコンパクトで $O$ に含まれるので、$\delta>0$ を $L$ の各点から $\mathbb{R}^{n}\setminus O$ までの距離の最小値より小さく、かつ $\delta\sqrt{n}$ もそれより小さくとる（$O=\mathbb{R}^{n}$ なら任意）。$\delta\mathbb{Z}^{n}$ を頂点とする一辺 $\delta$ の閉立方体のうち $L$ と交わるもの（有限個）の和を $E_{0}$ とし、$E\defeq E_{0}\cap S$ とおく。各立方体の直径は $\delta\sqrt{n}$ なので $E_{0}\subset O$。$S=\mathbb{H}^{n}$ のとき、各立方体と $\mathbb{H}^{n}$ の共通部分は立方体か空か面なので、$E$ は有限個の閉直方体の和で、コンパクトかつジョルダン可測（境界は有限個の面に含まれ測度 0、\ref{calc:jordan-measurable}）。

**Step 3（変数変換）.** 【主張：結論の式】\ref{calc:change-of-variables} を $E$ と $\tau$ に使うと（$\tau$ は $O$ 上の単射で $\det D\tau\neq0$）、$\tau(E)$ はコンパクトでジョルダン可測で、$\int_{\tau(E)}g=\int_{E}(g\circ\tau)\det D\tau$。$\tau(E)\subset O'\cap S$ かつ $\tau(E)\supset\tau(L\cap S)=K\cap S$ なので、$g\chi_{\tau(E)}=g\chi_{S}$（どちらも $K\cap S$ の外で $0$）。よって左辺は $\int_{S}g$。同様に $(g\circ\tau)\det D\tau$ は $L$ の外で $0$ で、$L\cap S\subset E\subset S$ なので右辺は $\int_{S}(g\circ\tau)\det D\tau$。

::: hypcheck
- **$\det D\tau>0$**：結論の式で $|\det D\tau|=\det D\tau$ とするのに使った。負なら符号が逆になる。
- **$\tau(O\cap S)=O'\cap S$**：Step 3 で $\tau(E)\subset S$ と $\tau(L\cap S)=K\cap S$ に使った。
- **台がコンパクト**：Step 1 で直方体に収め、Step 2 で有限個の立方体で覆うのに使った。
:::
:::

::: definition 多様体上の積分 {#mfd:integral keywords="integral of a compactly supported n-form over a regular domain of an oriented manifold via positive charts and a partition of unity" index="積分（多様体上の微分形式）|せきぶんたようたいじょうのびぶんけいしき, 微分形式の積分|びぶんけいしきのせきぶん"}
$M$ を向きづけられた $n$ 次元の多様体、$D$ を境界つき領域、$\omega$ を台がコンパクトな連続な $n$ 形式とする。
1. $\omega$ の台が、一つの**正の**座標近傍 $(U,\varphi)$ に含まれ、$U$ が外点だけ・内点だけからなるか、$U$ が半空間型であるとき、$\omega^{\varphi}=g\,dr_{1}\wedge\cdots\wedge dr_{n}$ について
$$
\int_{D}\omega\defeq\int_{S}g,\qquad S=\begin{cases}\varnothing&(U\subset M\setminus D)\\\mathbb{R}^{n}&(U\subset\operatorname{int}D)\\\mathbb{H}^{n}&(\text{半空間型})\end{cases}
$$
と定める（$S=\varnothing$ なら値は $0$）。
2. 一般には、上の型の正の座標近傍 $U_{1},\dots,U_{k}$ で $\operatorname{supp}\omega$ を覆い、開被覆 $\{U_{1},\dots,U_{k},M\setminus\operatorname{supp}\omega\}$ に従属する滑らかな 1 の分割 $(\rho_{1},\dots,\rho_{k},\rho_{0})$ をとって、$\int_{D}\omega\defeq\sum_{i}\int_{D}\rho_{i}\omega$ と定める。$D=M$ のとき $\int_{M}\omega$ と書く。
:::

::: intuition
多様体上の積分は、全体を向きのそろった目盛りの小片に分け、各小片の上で普通の重積分をして足し合わせたものである。分け方や目盛りの選び方によらずに値が決まる。
:::

::: proposition 積分が定義によらないこと {#mfd:integral-well-defined keywords="the integral of forms is independent of charts and partitions of unity; linearity; orientation reversal changes the sign; diffeomorphism invariance" index="積分の基本性質（多様体）|せきぶんのきほんせいしつたようたい"}
1. 定義 1・2 の値は、座標近傍と 1 の分割の選び方によらない。また、上の型の座標近傍がとれ、2 の構成が可能である。
2. $\omega\mapsto\int_{D}\omega$ は線形である。
3. $M$ の向きを逆にすると（$\partial D$ の向きも逆になり）積分の符号が変わる。
4. 向きを保つ微分同相写像 $F\colon M'\to M$ について $\int_{F^{-1}(D)}F^{*}\omega=\int_{D}\omega$（$F^{-1}(D)$ は境界つき領域）。
:::

::: proof
**Step 1（座標近傍がとれる）.** 【主張：各点に、上の三つの型のどれかの正の座標近傍がある】外点・内点には、その開近傍に含まれる座標近傍をとり（\ref{mfd:maximal-atlas.2}）、像を開球にして連結にし、\ref{mfd:orientable-equivalents} の最後の主張で正にする（$x_{1}\mapsto-x_{1}$ は内点・外点の性質を変えない）。境界点の半空間型の座標近傍も、像の開球と $\mathbb{H}^{n}$ の形が $x_{1}\mapsto-x_{1}$ で保たれるので、同じように正にできる。$\operatorname{supp}\omega$ はコンパクトなので有限個で覆える。

**Step 2（一つの座標近傍の場合の一意性）.** 【主張：$\omega$ の台が二つの正の座標近傍 $(U,\varphi)$, $(V,\psi)$（ともに上の型）に含まれれば、1 の値は一致する】台は $U\cap V$ に含まれるので、$U\cap V$ に制限して考えてよい。座標変換 $\tau=\psi\circ\varphi^{-1}\colon\varphi(U\cap V)\to\psi(U\cap V)$ は、$\det D\tau>0$（二つとも正、\ref{mfd:orientable-equivalents} の Step 1）。$\omega^{\psi}=g\,dr_{1}\wedge\cdots\wedge dr_{n}$ なら、\ref{mfd:local-representative-change.2} と \ref{calc:pullback-properties.5} から $\omega^{\varphi}=\tau^{*}\omega^{\psi}=(g\circ\tau)\det D\tau\,dr_{1}\wedge\cdots\wedge dr_{n}$。$S$ を共通に選べることを確かめる。台の点のうち内点は、半空間型の座標近傍では $r_{n}<0$ の側に、外点は $r_{n}>0$ の側に写る（\ref{mfd:boundary-properties.1}）。したがって、台が境界点を含まなければ、関数に $\chi_{\mathbb{H}^{n}}$ を掛けるかどうかで積分の値は変わらず（内点だけなら掛けても同じ、外点だけなら掛けると $0$ で、外点だけの型の定義とも一致）、台が境界点を含めば二つとも半空間型である。いずれの場合も共通の $S$ について $\tau(\varphi(U\cap V)\cap S)=\psi(U\cap V)\cap S$ で、\ref{mfd:half-space-change-of-variables} から $\int_{S}g=\int_{S}(g\circ\tau)\det D\tau$。外点だけの場合は両方 $0$。

**Step 3（一般の場合）.** 【主張：二組の選び方 $(U_{i},\rho_{i})$, $(V_{j},\sigma_{j})$ で値が一致する】$\operatorname{supp}\omega$ の上で $\sum_{i}\rho_{i}=\sum_{j}\sigma_{j}=1$ なので、$\rho_{i}\omega=\sum_{j}\sigma_{j}\rho_{i}\omega$。$\sigma_{j}\rho_{i}\omega$ の台は $U_{i}\cap V_{j}$ に含まれるコンパクト集合で、1 の値は、一つの座標近傍の場合の積分の線形性（重積分の線形性）から加法的なので
$$
\sum_{i}\int_{D}\rho_{i}\omega=\sum_{i}\sum_{j}\int_{D}\sigma_{j}\rho_{i}\omega=\sum_{j}\int_{D}\sigma_{j}\omega,
$$
ここで真ん中の各項は Step 2 により $U_{i}$ と $V_{j}$ のどちらで計算しても同じ。

**2〜4.** 2 は重積分の線形性から。3：向きを逆にすると正の座標近傍は $x_{1}\mapsto-x_{1}$ を合成したものになり、$\det D\tau=-1$ の線形変換で \ref{mfd:half-space-change-of-variables} と同じ計算をすると（$|\det|=1$ の変数変換）符号が変わる。4：$(U,\varphi)$ が $M$ の正の座標近傍なら $(F^{-1}(U),\varphi\circ F)$ は $M'$ の正の座標近傍で、同じ型をもち、$(F^{*}\omega)^{\varphi\circ F}=\omega^{\varphi}$（\ref{mfd:pullback-properties.1}、局所表示 $H$ は恒等写像）。1 の分割も $F$ で引き戻せばよい。
:::

## ストークスの定理 {#mfd:sec-is-stokes}

$\partial D$ は部分多様体なので、包含写像 $\iota\colon\partial D\to M$ による引き戻し $\iota^{*}\omega$ は $\partial D$ 上の形式である。$\partial D$ には誘導された向きを入れ、$\int_{\partial D}\omega\defeq\int_{\partial D}\iota^{*}\omega$ と書く（$\partial D$ 全体を境界つき領域とみる。$n=1$ のとき $\partial D$ は離散的な点の集合で、$0$ 形式 $f$ の積分は $\sum_{p}\pm f(p)$、符号は誘導された向き）。

::: theorem 多様体上のストークスの定理 {#mfd:stokes-theorem keywords="Stokes' theorem on manifolds: int_D d omega = int_{partial D} omega for compactly supported (n-1)-forms on regular domains of oriented manifolds" index="ストークスの定理（多様体）|すとーくすのていりたようたい, 一般化されたストークスの定理|いっぱんかされたすとーくすのていり" refname="多様体上のストークスの定理"}
$M$ を向きづけられた $n$ 次元の可微分多様体（$n\ge1$）、$D$ を境界つき領域、$\omega$ を台がコンパクトな滑らかな $(n-1)$ 形式とする。$\partial D$ に誘導された向きを入れると
$$
\int_{D}d\omega=\int_{\partial D}\omega.
$$
:::

::: intuition
領域の内部で、ある形式の外微分を積分したものは、その形式を領域の縁の上で積分したものに等しい。内部での細かい変化を全部足すと、縁での出入りだけが残る。
:::

::: proof
**Step 1（一つの座標近傍に帰着）.** 【主張：$\omega$ の台が、上の型の一つの正の座標近傍に含まれる場合に示せば十分】\ref{mfd:integral} の 2 の $(U_{i},\rho_{i})$ をとる。$\rho_{0}$ の台は $M\setminus\operatorname{supp}\omega$ に含まれるので $\rho_{0}\omega=0$、したがって $M$ 全体で $\omega=\sum_{i\ge1}\rho_{i}\omega$。よって $d\omega=\sum_{i\ge1}d(\rho_{i}\omega)$、$\iota^{*}\omega=\sum_{i\ge1}\iota^{*}(\rho_{i}\omega)$ で、両辺の積分は線形（\ref{mfd:integral-well-defined.2}）。各 $\rho_{i}\omega$ は台がコンパクトで $U_{i}$ に含まれ、$d(\rho_{i}\omega)$ の台も $U_{i}$ に含まれる。

**Step 2（局所表示）.** 【主張：$\omega^{\varphi}=\sum_{j=1}^{n}f_{j}\,dr_{1}\wedge\cdots\wedge\widehat{dr_{j}}\wedge\cdots\wedge dr_{n}$ と書くと、$(d\omega)^{\varphi}=\bigl(\sum_{j}(-1)^{j-1}\partial_{j}f_{j}\bigr)dr_{1}\wedge\cdots\wedge dr_{n}$】$\widehat{dr_{j}}$ はその因子を除くこと。$f_{j}$ は台がコンパクトな $C^{\infty}$ 級関数（$\varphi(U)$ の外で $0$ と延ばす）。\ref{mfd:exterior-derivative.4} から $(d\omega)^{\varphi}=\sum_{j}\sum_{i}\partial_{i}f_{j}\,dr_{i}\wedge dr_{1}\wedge\cdots\widehat{dr_{j}}\cdots$ で、$i\neq j$ の項は同じ因子が二度現れて $0$、$i=j$ の項は $dr_{j}$ を $j-1$ 回の互換で $j$ 番目に動かして符号 $(-1)^{j-1}$。

**Step 3（外点・内点の場合）.** 【主張：$U$ が外点だけなら両辺 $0$、内点だけなら両辺 $0$】外点だけなら定義から両辺 $0$（$\partial D\cap U=\varnothing$）。内点だけなら右辺は $0$（$\iota^{*}\omega$ の台は $\partial D\cap U=\varnothing$）。左辺は、$\operatorname{supp}f_{j}$ を含む直方体 $R=\prod[a_{i},b_{i}]$ で \ref{calc:fubini-continuous} により $r_{j}$ の積分を最も内側にすると、$\int_{a_{j}}^{b_{j}}\partial_{j}f_{j}\,dr_{j}=f_{j}(\dots,b_{j},\dots)-f_{j}(\dots,a_{j},\dots)=0$（\ref{calc:fundamental-theorem.2}、端では $f_{j}=0$）。

**Step 4（半空間型の場合の左辺）.** 【主張：$\int_{D}d\omega=(-1)^{n-1}\int_{\mathbb{R}^{n-1}}f_{n}(r',0)\,dr'$】$R=\prod_{i<n}[a_{i},b_{i}]\times[a_{n},0]$ を $\operatorname{supp}f_{j}\cap\mathbb{H}^{n}$ を含むようにとる。$j<n$ の項は Step 3 と同じく $0$（$r_{j}$ の両端で $f_{j}=0$）。$j=n$ の項は $\int_{a_{n}}^{0}\partial_{n}f_{n}\,dr_{n}=f_{n}(r',0)-f_{n}(r',a_{n})=f_{n}(r',0)$ で、残りを $r'=(r_{1},\dots,r_{n-1})$ について積分する。

**Step 5（半空間型の場合の右辺）.** 【主張：$\int_{\partial D}\omega=(-1)^{n-1}\int_{\mathbb{R}^{n-1}}f_{n}(r',0)\,dr'$】$\partial D\cap U$ の座標近傍 $(x_{1},\dots,x_{n-1})$、すなわち $j\colon r'\mapsto(r',0)$ を通した $\varphi$ の制限を使う。包含写像の局所表示は $j$ なので、\ref{mfd:pullback-properties.1} から $(\iota^{*}\omega)$ の局所表示は $j^{*}\omega^{\varphi}$。$j^{*}dr_{n}=0$、$j^{*}dr_{i}=dr_{i}$（$i<n$）なので $j^{*}\omega^{\varphi}=f_{n}(r',0)\,dr_{1}\wedge\cdots\wedge dr_{n-1}$。境界の向きについての注意（\ref{mfd:boundary-orientation} の後）から、この座標近傍は $(-1)^{n-1}$ の符号で正なので、積分は $(-1)^{n-1}\int f_{n}(r',0)\,dr'$（負の座標近傍では \ref{mfd:integral-well-defined.3} と同じく符号が変わる。$n=1$ では $\partial D\cap U$ は一点 $\varphi^{-1}(0)$ で、外向きの $\partial/\partial x_{1}$ は正なので値は $+f_{1}(0)$）。

Step 4 と Step 5 から半空間型の場合も等式が成り立ち、Step 1 と合わせて定理が従う。

::: hypcheck
- **向き**：積分の定義（\ref{mfd:integral}）と Step 5 の符号に使った。向き付け不可能な多様体では $n$ 形式の積分は定義されない（密度の積分にすればよいが、ストークスの定理の形は変わる）。
- **台がコンパクト**：積分が有限和で定義できることと、Step 3・Step 4 で直方体の端で $f_{j}=0$ となることに使った。外すと偽：$M=D=\mathbb{R}$, $\omega=f$ を $f(t)=\arctan t$ とすると $\int_{\mathbb{R}}df=\pi$（広義積分）だが $\partial D=\varnothing$。
- **境界つき領域であること**：Step 1 で三つの型の座標近傍で覆えることに使った。角のある領域（正方形など）は境界つき領域でないが、角が測度 0 の集合に収まることを使って同じ等式が示せることが知られている（\see{calc:stokes-chains} は立方体の場合）。
- **$\omega$ の滑らかさ**：$C^{1}$ 級で十分（Step 2・Step 3 で一階の偏導関数の連続性だけを使った）。
:::
:::

::: corollary ストークスの定理の帰結 {#mfd:stokes-corollaries keywords="integral of an exact form over a closed manifold vanishes; top de Rham cohomology of a compact oriented manifold is nonzero; integrals of closed forms depend only on the class" index="閉多様体上の完全形式の積分|へいたようたいじょうのかんぜんけいしきのせきぶん"}
$M$ をコンパクトな向きづけられた $n$ 次元の多様体（$\partial M=\varnothing$）とする。
1. 任意の $\eta\in\Omega^{n-1}(M)$ について $\int_{M}d\eta=0$。
2. 積分は線形写像 $\int_{M}\colon H^{n}(M)\to\mathbb{R}$ を定める。$M\neq\varnothing$ ならこれは全射で、とくに $H^{n}(M)\neq0$。
3. $M\neq\varnothing$ なら、$M$ 上の体積形式は完全形式でない。
:::

::: proof
**1.** \ref{mfd:stokes-theorem} を $D=M$（$\partial D=\varnothing$）に使う。台はコンパクト（$M$ がコンパクト）。

**2.** 1 から完全形式の積分は $0$ なので、類 $[\omega]\mapsto\int_{M}\omega$ は well-defined で線形。全射性：正の座標近傍 $(U,\varphi)$ と、台が $U$ に含まれ $\varphi$ による表示が $g\,dr_{1}\wedge\cdots\wedge dr_{n}$（$g\ge0$, $g\not\equiv0$ の隆起関数、\ref{mfd:bump-function}）の $n$ 形式をとると、積分は $\int g>0$（$g$ は連続で非負、ある点で正）。$n$ 形式は自動的に閉（$\Omega^{n+1}=0$）なので、その類の像は $0$ でなく、線形性から全射。

**3.** 正の向きの体積形式（\ref{mfd:orientable-equivalents}）の積分は、各正の座標近傍で正の関数の積分の和なので正。1 から完全形式ではない。
:::

::: example
1. **$n=1$.** $M=\mathbb{R}$, $D=[a,b]$ は境界つき領域で、$\partial D=\{a,b\}$ の誘導された向きは $b$ で $+$、$a$ で $-$（$b$ では外向きの $+e_{1}$ が正、$a$ では外向きの $-e_{1}$ が負）。台がコンパクトな関数 $f$ について、ストークスの定理は $\int_{a}^{b}f'=f(b)-f(a)$（微分積分学の基本定理）。
2. **円周.** $\omega=-y\,dx+x\,dy$ を $S^{1}$ に引き戻したものは体積形式で、$\int_{S^{1}}\omega=2\pi$（立体射影の座標で $\int_{\mathbb{R}}\frac{2\,du}{u^{2}+1}$、\ref{mfd:prob-fm-sphere-form}。一点を除いた集合の上で積分してよいことは問題）。よって $H^{1}(S^{1})\neq0$ で、この形式は $S^{1}$ 上で完全でない。
3. **発散定理.** $M=\mathbb{R}^{3}$, $D$ を境界つき領域でコンパクトなもの、$F=(P,Q,R)$ を滑らかなベクトル場とし、$\omega\defeq P\,dy\wedge dz+Q\,dz\wedge dx+R\,dx\wedge dy$ とすると $d\omega=\operatorname{div}F\,dx\wedge dy\wedge dz$ で、ストークスの定理は $\int_{D}\operatorname{div}F=\int_{\partial D}\langle F,\nu\rangle\,dA$（\see{vec:gauss-divergence}）にあたる（右辺の書き換えには面積要素の議論が要る）。
:::

::: supplement
**一般化.** 境界つき多様体（座標近傍の像として $\mathbb{H}^{n}$ の開集合を許す抽象的な多様体）の上でも同じ定理が成り立つ。本ページの境界つき領域は、多様体の中に置かれた境界つき多様体である。角のある多様体や、特異鎖の上のストークスの定理（\ref{calc:stokes-chains}）とも、1 の分割と変数変換で同じ形になる。

**ポアンカレ双対性との関係.** コンパクトで向きづけられた連結な $n$ 次元多様体では $\int_{M}\colon H^{n}(M)\to\mathbb{R}$ は同型で、外積と積分による $H^{k}(M)\times H^{n-k}(M)\to\mathbb{R}$ は非退化であることが知られている（**ポアンカレ双対性**のド・ラーム版）。特異ホモロジーでの形は \see{at:page-orientation}。

**高い視点.** ストークスの定理は、「積分 $\int$ は、鎖の境界作用素 $\partial$ と微分形式の外微分 $d$ が互いに随伴になるような対」であることを言っている：$\langle d\omega,D\rangle=\langle\omega,\partial D\rangle$。$d^{2}=0$ と $\partial^{2}=0$ がこの随伴で対応し、そこからド・ラームの定理（ド・ラームコホモロジーと特異コホモロジーの同型）が生まれる。
:::

## 問題 {#mfd:sec-is-problems}

::: problem {#mfd:prob-is-sphere-orientation}
立体射影の座標変換 $\tau(u)=u/|u|^{2}$（$u\in\mathbb{R}^{n}\setminus\{0\}$）について $\det D\tau(u)=-|u|^{-2n}$ を示し、$S^{n}$ が向き付け可能であることを確かめよ。
:::

::: solution
$\partial_{j}\tau_{i}=\delta_{ij}|u|^{-2}-2u_{i}u_{j}|u|^{-4}$ なので $D\tau(u)=|u|^{-2}\bigl(I-2\hat{u}\,{}^{t}\hat{u}\bigr)$（$\hat{u}=u/|u|$）。$I-2\hat{u}\,{}^{t}\hat{u}$ は $\hat{u}$ に直交する超平面に関する鏡映で、固有値は $-1$（$\hat{u}$ 方向）と $1$（$n-1$ 重）なので行列式は $-1$。よって $\det D\tau=|u|^{-2n}\cdot(-1)$。$p_{S}$ を $T\circ p_{S}$（$T$ は第 1 座標の符号を変える）に取り替えると、座標変換 $T\circ\tau$ の行列式は $|u|^{-2n}>0$ となり、\ref{mfd:orientable-equivalents} の 2 が満たされる。
:::

::: problem {#mfd:prob-is-measure-zero}
$M$ を向きづけられた多様体、$\omega$ を台がコンパクトな連続な $n$ 形式とし、正の座標近傍 $(U,\varphi)$ で $M\setminus U$ が一点 $p$ からなるとする。$\int_{M}\omega=\int_{\varphi(U)}g$（$\omega^{\varphi}=g\,dr_{1}\wedge\cdots\wedge dr_{n}$、右辺は広義積分）を、$n\ge1$ のとき示せ。（例 2 の計算の正当化。）
:::

::: solution
$p$ を含む正の座標近傍 $(V,\psi)$ で $\psi(p)=0$ のものをとり、$\varepsilon>0$ について、$\psi^{-1}(\overline{B(0,\varepsilon)})$ の近くで $1$、台が $\psi^{-1}(B(0,2\varepsilon))$ に含まれる隆起関数 $h_{\varepsilon}=\beta(\psi/\varepsilon)$ をとる（$2\varepsilon$ の球が $\psi(V)$ に入るとする）。$\omega=h_{\varepsilon}\omega+(1-h_{\varepsilon})\omega$ で、$(1-h_{\varepsilon})\omega$ の台はコンパクトで $U$ に含まれるので、その積分は $\int_{\varphi(U)}(1-h_{\varepsilon}\circ\varphi^{-1})g$。$\int_{M}h_{\varepsilon}\omega$ の絶対値は、$\psi$ による表示の係数の上界 $C$ を使って $C\cdot v(B(0,2\varepsilon))\to0$（$\varepsilon\to0$）。また $\int_{\varphi(U)}(1-h_{\varepsilon}\circ\varphi^{-1})g$ は、$\varepsilon\to0$ で広義積分 $\int_{\varphi(U)}g$ に収束する（差は $\varphi(\psi^{-1}(B(0,2\varepsilon))\setminus\{p\})$ の上の $|g|$ の積分で抑えられ、変数変換でこれは $\psi$ 側の小さい球の上の積分に等しく $0$ に収束する）。よって $\int_{M}\omega=\int_{\varphi(U)}g$。
:::

::: problem {#mfd:prob-is-boundary-closed}
コンパクトな向きづけられた多様体 $M$ の中のコンパクトな境界つき領域 $D$ と、閉形式 $\omega\in\Omega^{n-1}(M)$ について $\int_{\partial D}\omega=0$ を示せ。
:::

::: solution
ストークスの定理（\ref{mfd:stokes-theorem}。$M$ はコンパクトなので台はコンパクト）から $\int_{\partial D}\omega=\int_{D}d\omega=\int_{D}0=0$。
:::
