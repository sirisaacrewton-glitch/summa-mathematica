# 多角形の貼り合わせ {#mfd:page-polygon-schemes keywords="words and polygon schemes, realization by gluing sides of polygons, models of polygons, rotation and inversion, cut and paste, folding adjacent inverse sides, from a triangulation to a single polygon, vertex points"}

閉曲面の分類定理（次のページ）は、閉曲面を「一枚の多角形の辺を対にして貼り合わせたもの」として表し、その貼り合わせ方を表す**語**を書き換えて標準形にする、という形で証明する。このページでは、その準備として

- 語の組（**貼り合わせ図式**）から空間を作る方法（**実現**）、
- 実現を同相写像で変えない語の書き換え（回転・反転・**切り貼り**・**折り畳み**）、
- ラドーの定理を使って、コンパクトな連結曲面を一つの語の実現として表すこと

を示す。

## 記法と定義の確認 {#mfd:sec-ps2-notation}

::: notation
- 凸体と錐による延長は \ref{mfd:convex-body}。凸体 $K$ の境界 $\partial K$ はジョルダン曲線で、内点 $c$ からの方向 $\pi\colon\partial K\to S^{1}$ は同相写像（\ref{mfd:convex-body.2}）。$\partial K$ の点の**反時計回り**の順序は、$\pi$ で $S^{1}$ の反時計回りの順序に移して定める（内点 $c$ の取り方によらないことは \ref{mfd:ccw-order} で示す）。
- 商空間と商写像の普遍性は \ref{top:quotient-universal}、閉写像は商写像であること、コンパクトからハウスドルフへの連続写像は閉写像であることを使う（\ref{top:compact-to-hausdorff}）。
- 単体複体は \ref{at:simplicial-complex}、ラドーの定理は \ref{mfd:rado-triangulation}。
- 手元の資料にこの部分を扱う本がないため、証明はここで書き下ろした。語の書き換えで閉曲面を分類する方針は標準的なものである。
:::

## 貼り合わせ図式とその実現 {#mfd:sec-ps2-schemes}

::: lemma 反時計回りの順序 {#mfd:ccw-order keywords="the counterclockwise cyclic order of boundary points of a convex body does not depend on the interior point from which it is seen" index="反時計回りの順序（凸体）|はんとけいまわりのじゅんじょとつたい"}
凸体 $K$ と内点 $c,c'$ について、$\partial K$ の相異なる点の列が $c$ から見て反時計回りに並ぶことと、$c'$ から見て反時計回りに並ぶことは同値。とくに、閉円板の内部のどの点から見ても、円周上の点の反時計回りの順序は通常の偏角の順序と一致する。
:::

::: proof
3 点 $x_{1},x_{2},x_{3}$ の巡回的な順序について示せば十分（$n$ 点の巡回的な順序は 3 点ずつの順序で決まる）。$S^{1}$ の相異なる 3 点 $(u_{1},u_{2},u_{3})$ が反時計回りであることは、$u_{2}/u_{1}$, $u_{3}/u_{1}$ の偏角を $(0,2\pi)$ でとったとき前者が小さいことで、偏角は相異なる 2 点の上で連続なので、反時計回りの組全体も時計回りの組全体も、相異なる 3 点の組の空間の開集合で、互いに補集合。$c_{t}\defeq(1-t)c+tc'$ は内点（$K^{\circ}$ は凸）で、$u_{j}(t)\defeq(x_{j}-c_{t})/|x_{j}-c_{t}|$ は $t$ について連続、各 $t$ で相異なる（\ref{mfd:convex-body.1}：$c_{t}$ からの半直線は $\partial K$ とただ一度交わる）。よって $\{t:(u_{j}(t))\text{ は反時計回り}\}$ は $[0,1]$ の開かつ閉な集合で、$[0,1]$ は連結なので、$t=0$ と $t=1$ で同じ。円板では中心 $0$ から見た順序が通常の偏角の順序。
:::


::: definition 語と貼り合わせ図式 {#mfd:polygon-scheme keywords="word in letters and their inverses read cyclically; polygon scheme: finitely many words in which every letter occurs exactly twice" index="語（貼り合わせ）|ごはりあわせ, 貼り合わせ図式|はりあわせずしき"}
1. 文字の集合を固定する。文字 $x$ と符号 $\varepsilon=\pm1$ の組 $x^{\varepsilon}$（$x^{1}$ は $x$、$x^{-1}$ とも書く）を長さ $n\ge2$ だけ並べたものを**語**という。語は巡回的に読む（最後の文字の次は最初の文字）。語 $W=x_{1}^{\varepsilon_{1}}\cdots x_{n}^{\varepsilon_{n}}$ の**逆**を $W^{-1}\defeq x_{n}^{-\varepsilon_{n}}\cdots x_{1}^{-\varepsilon_{1}}$ とする。
2. 語の有限列 $\mathcal{W}=(W_{1},\dots,W_{r})$（$r\ge1$）で、各文字がすべての語を通してちょうど 2 回現れるものを**貼り合わせ図式**という。文字 $x$ の 2 回の出現の符号が等しいとき $x$ を**ねじれた対**、異なるとき**ねじれていない対**という。
:::

::: definition 模型と実現 {#mfd:scheme-realization keywords="model of an n-gon: a convex body with n marked boundary arcs and parametrizations; realization X(W) of a polygon scheme by identifying paired sides" index="多角形の模型|たかくけいのもけい, 実現（貼り合わせ図式）|じつげんはりあわせずしき"}
1. 長さ $n$ の語の**模型**とは、凸体 $K\subset\mathbb{R}^{2}$、$\partial K$ の相異なる点 $p_{0},p_{1},\dots,p_{n-1}$（反時計回りの順、$p_{n}\defeq p_{0}$）、各 $k=1,\dots,n$ についての同相写像 $\tau_{k}\colon[0,1]\to\partial K$ の組で、$\tau_{k}$ の像が $p_{k-1}$ から $p_{k}$ への反時計回りの弧（**$k$ 番目の辺**）、$\tau_{k}(0)=p_{k-1}$, $\tau_{k}(1)=p_{k}$ となるものをいう。$p_{k}$ を模型の**頂点**という。たとえば閉単位円板で $p_{k}=e^{2\pi ik/n}$, $\tau_{k}(t)=e^{2\pi i(k-1+t)/n}$ としたものを**標準模型**という。
2. 語 $W$ の $k$ 番目の文字が $x^{\varepsilon}$ のとき、$s\in[0,1]$ について「$k$ 番目の辺の上の $x$ のパラメータ $s$ の点」を $\tau_{k}(s)$（$\varepsilon=1$）、$\tau_{k}(1-s)$（$\varepsilon=-1$）とする。
3. 貼り合わせ図式 $\mathcal{W}=(W_{1},\dots,W_{r})$ の各語に模型 $K_{i}$ を一つずつとり、直和 $\bigsqcup_{i}K_{i}$ の上で、各文字 $x$ と各 $s\in[0,1]$ について、$x$ の二つの出現の辺の上のパラメータ $s$ の点どうしを同一視して生成される同値関係 $\sim$ による商空間を $X(\mathcal{W})$ と書き、$\mathcal{W}$ の**実現**という。商写像を $q$ と書く。$q$ による模型の頂点の像を $X(\mathcal{W})$ の**頂点点**という。$r=1$ のときは $X(W)$ とも書く。
:::

::: intuition
語は「多角形の辺を一周しながら、各辺にどの名前を、どちら向きの矢印でつけたか」を記録したものである。同じ名前の二つの辺を、矢印の向きをそろえて貼り合わせると、空間ができる。たとえば正方形の辺に $aba^{-1}b^{-1}$ と名前をつけて貼るとトーラス、$abab$ と名前をつけて貼ると射影平面になる。
:::

::: lemma 実現は模型によらない {#mfd:realization-model-independent keywords="the realization of a polygon scheme does not depend on the choice of models up to homeomorphism preserving vertex points" index="実現の模型によらなさ|じつげんのもけいによらなさ"}
同じ貼り合わせ図式に対して二通りの模型の族をとったとき、それぞれの実現の間に、頂点点を頂点点に移す同相写像がある。
:::

::: proof
**Step 1（模型の間の同相）.** 【主張：同じ長さ $n$ の二つの模型 $(K,p,\tau)$, $(K',p',\tau')$ について、同相写像 $g\colon K\to K'$ で $g\circ\tau_{k}=\tau'_{k}$（すべての $k$）となるものがある】$\partial K$ は $n$ 個の辺の和で、隣り合う辺は頂点でだけ交わり、隣り合わない辺は交わらない（$\pi$ で $S^{1}$ の反時計回りの弧に移して考える）。辺ごとに $\tau'_{k}\circ\tau_{k}^{-1}$ と定めた写像 $\partial K\to\partial K'$ は、有限個の閉集合の上で連続で頂点で一致するので連続（\ref{top:pasting-lemma}）、全単射なので同相写像（\ref{top:compact-to-hausdorff}）。\ref{mfd:convex-body.3} から同相写像 $g\colon K\to K'$ に延びる。

**Step 2（実現の同相）.** 各語について Step 1 の $g_{i}$ をとり、$\bigsqcup g_{i}$ と商写像の合成 $\bigsqcup K_{i}\to X'$ を考える。$g_{i}$ は辺の上のパラメータ $s$ の点をパラメータ $s$ の点に移すので、$\sim$ の生成元を $\sim'$ で同値な点に移し、\ref{top:quotient-universal} から連続写像 $X\to X'$ を誘導する。$g_{i}^{-1}$ から同様に逆向きの連続写像が得られ、二つの合成は生成元の上で恒等写像なので恒等写像。頂点は頂点に移る。
:::

以下、実現の同相類だけを問題にするので、模型は都合のよいものを選ぶ。

## 実現を変えない書き換え {#mfd:sec-ps2-moves}

::: lemma 回転・反転・名前の付け替え {#mfd:scheme-relabel keywords="rotating or inverting a word, renaming letters, and replacing a letter by its inverse at both occurrences do not change the realization" index="語の回転と反転|ごのかいてんとはんてん"}
貼り合わせ図式 $\mathcal{W}$ の一つの語を巡回的に回転させても、逆 $W_{i}^{-1}$ に取り替えても、文字の名前を付け替えても、ある文字 $x$ の二つの出現をともに $x^{-1}$ の向きに取り替えても、実現は（頂点点を頂点点に移す同相写像で）変わらない。
:::

::: proof
**回転.** 語 $x_{1}^{\varepsilon_{1}}\cdots x_{n}^{\varepsilon_{n}}$ の模型の頂点と辺の番号を $j$ だけずらしたものは、回転した語 $x_{j+1}^{\varepsilon_{j+1}}\cdots x_{j}^{\varepsilon_{j}}$ の模型で、同一視の規則は同じ。

**反転.** 模型 $(K,p,\tau)$ を複素共役 $\kappa(z)\defeq\bar z$ で移す。$\kappa$ は向きを反転させるので、$K'\defeq\kappa(K)$, $p'_{k}\defeq\kappa(p_{n-k})$, $\tau'_{k}(t)\defeq\kappa(\tau_{n+1-k}(1-t))$ は、反時計回りの順に並んだ模型になる。$W^{-1}$ の $k$ 番目の文字は $x_{n+1-k}^{-\varepsilon_{n+1-k}}$ で、その辺の上の $x_{n+1-k}$ のパラメータ $s$ の点は、$-\varepsilon=1$ なら $\tau'_{k}(s)=\kappa(\tau_{n+1-k}(1-s))$、$-\varepsilon=-1$ なら $\tau'_{k}(1-s)=\kappa(\tau_{n+1-k}(s))$ で、どちらも元の模型でのパラメータ $s$ の点の $\kappa$ による像。よって $\kappa$ は同一視を保ち、実現の同相写像を誘導する。

**名前の付け替え・向きの取り替え.** 前者は明らか。後者では、パラメータ $s$ の点がパラメータ $1-s$ の点に変わるだけで、二つの出現の間の同一視は同じ。
:::

::: lemma 切り貼り {#mfd:cut-paste keywords="cutting a polygon along a diagonal: a word UV may be replaced by the two words Uc and c^{-1}V with a new letter c, and conversely (pasting)" index="切り貼り|きりばり, 切断と貼り合わせ|せつだんとはりあわせ"}
貼り合わせ図式 $\mathcal{W}$ が語 $UV$（$U,V$ は空でない文字の列）を含み、$c$ を $\mathcal{W}$ に現れない文字とする。$UV$ を二つの語 $Uc$, $c^{-1}V$ に取り替えた図式 $\mathcal{W}'$ について、$X(\mathcal{W})$ と $X(\mathcal{W}')$ の間に頂点点を頂点点に移す同相写像がある。逆向きに読めば、語 $Uc$ と $c^{-1}V$（$c$ はほかに現れない）を一つの語 $UV$ にまとめてもよい（**貼り合わせ**）。
:::

::: intuition
多角形を対角線で二つに切り、切り口に新しい名前 $c$ をつけておけば、あとで $c$ どうしを貼り合わせると元に戻る。逆に、別々の多角形の同じ名前の辺を貼り合わせて、一つの大きな多角形にしてもよい。
:::

::: proof
$m\defeq|U|$, $n\defeq|U|+|V|$ とし、$UV$ の模型を標準模型（閉円板 $D$、$p_{k}=e^{2\pi ik/n}$）にとる。$U$ の辺は $p_{0}$ から $p_{m}$ まで、$V$ の辺は $p_{m}$ から $p_{n}=p_{0}$ まで。$1\le m\le n-1$ なので $p_{0}\neq p_{m}$。

**Step 1（二つの模型）.** \ref{mfd:ccw-order} から、$K_{1}$ の内点から見ると、$\partial K_{1}$ のうち円周の部分は通常の偏角の順に並び、残りの弦がその両端を結ぶ。$K_{2}$ も同様。弦 $d\defeq[p_{m},p_{0}]$ を含む直線の閉半平面のうち、$U$ の辺の側のものと $D$ の共通部分を $K_{1}$、他方を $K_{2}$ とする。どちらも凸体で、$K_{1}\cup K_{2}=D$, $K_{1}\cap K_{2}=d$。$K_{1}$ の境界は $U$ の辺と $d$ からなり、頂点 $p_{0},\dots,p_{m}$ と、$p_{m}$ から $p_{0}$ への辺 $\tau_{c}(t)\defeq p_{m}+t(p_{0}-p_{m})$ をとると $Uc$ の模型。$K_{2}$ の境界は $d$ と $V$ の辺からなり、$p_{0}$ から $p_{m}$ への辺 $\tau'(t)\defeq p_{0}+t(p_{m}-p_{0})$ と $V$ の辺をとると $c^{-1}V$ の模型。$K_{2}$ の上の $c$ のパラメータ $s$ の点は $\tau'(1-s)=p_{m}+s(p_{0}-p_{m})=\tau_{c}(s)$ で、$c$ による同一視は $d$ の各点の二つの写しを同一視する。

**Step 2（実現の同相）.** 包含写像を合わせた $K_{1}\sqcup K_{2}\sqcup(\text{ほかの模型})\to D\sqcup(\text{ほかの模型})$ と商写像の合成は、$\mathcal{W}'$ の同一視の生成元（$c$ と、ほかの文字）を $\mathcal{W}$ で同値な点に移すので、連続写像 $F\colon X(\mathcal{W}')\to X(\mathcal{W})$ を誘導する（\ref{top:quotient-universal}）。逆に、$D$ の点をそれが属する $K_{1}$ か $K_{2}$ の点の類に送る写像は、閉集合 $K_{1}$, $K_{2}$ の共通部分 $d$ の上で（$c$ による同一視から）一致するので連続（\ref{top:pasting-lemma}）で、同一視を保ち、連続写像 $G\colon X(\mathcal{W})\to X(\mathcal{W}')$ を誘導する。$F\circ G$, $G\circ F$ は代表元の上で恒等写像なので恒等写像。頂点点の集合はどちらも $p_{0},\dots,p_{n-1}$ とほかの模型の頂点の像。
:::

::: lemma 折り畳み {#mfd:fold keywords="folding: a word U x x^{-1} with |U| >= 2 may be replaced by U, removing one vertex point" index="折り畳み（語）|おりたたみご, 消去（語）|しょうきょご"}
貼り合わせ図式 $\mathcal{W}$ が語 $Ux\,x^{-1}$（$|U|\ge2$、文字 $x$ はほかに現れない）を含むとする。この語を $U$ に取り替えた図式 $\mathcal{W}'$ について、同相写像 $X(\mathcal{W})\to X(\mathcal{W}')$ がある。これは $x$ と $x^{-1}$ の間の頂点の像を除く頂点点を、$\mathcal{W}'$ の頂点点に全単射に移す。
:::

::: intuition
隣り合う 2 辺に同じ名前を逆向きにつけて貼ることは、2 辺の共有点を中心にファスナーを閉じることにあたる。閉じた後も円板のままで、その 2 辺は内部に消える。
:::

::: proof
$m\defeq|U|\ge2$。

**Step 1（半円板の模型）.** \ref{mfd:ccw-order} から、内点 $\frac{i}{2}$ から見ると、$\partial H_{+}$ の半円の部分は偏角の順に並び、直径 $[-1,1]$ がその両端を結ぶ（$-1$ から $0$ を経て $1$ へ）。$H_{+}\defeq\{z:|z|\le1,\ \operatorname{Im}z\ge0\}$ は凸体。頂点を $p_{k}\defeq e^{\pi ik/m}$（$k=0,\dots,m$）と $0$ にとり、$U$ の $k$ 番目の辺を $\tau_{k}(t)\defeq e^{\pi i(k-1+t)/m}$、$x$ の辺を $-1$ から $0$ へ $t\mapsto-1+t$、$x^{-1}$ の辺を $0$ から $1$ へ $t\mapsto t$ とすると、$Ux\,x^{-1}$ の模型。$x$ のパラメータ $s$ の点は、一つ目の辺で $-1+s$、二つ目の辺で $\tau(1-s)=1-s$ なので、$x$ による同一視は実軸上の $y$ と $-y$（$-1\le y\le1$）を同一視する。

**Step 2（平方写像）.** $\mathrm{sq}(z)\defeq z^{2}$ は $H_{+}$ を閉円板 $\overline{\mathbb{D}}$ の上に写し（$re^{i\theta}$, $0\le\theta\le\pi$ が $r^{2}e^{2i\theta}$ に）、$z\neq w$ で $z^{2}=w^{2}$ となるのは $w=-z$ のときで、$z,-z\in H_{+}$ から $z$ は実数。よって $\mathrm{sq}$ は $H_{+}$ の点のうち $y$ と $-y$（実数）だけを同一視する閉写像で、商写像。$\mathrm{sq}\circ\tau_{k}(t)=e^{2\pi i(k-1+t)/m}$ なので、$\mathrm{sq}$ は $U$ の辺を $\overline{\mathbb{D}}$ の標準模型（長さ $m$）の辺にパラメータごと移す（$m\ge2$ なので各辺の像は円周全体でない弧）。

**Step 3（実現の同相）.** \ref{mfd:cut-paste} の Step 2 と同じく、$\mathrm{sq}$ と恒等写像（ほかの模型）を合わせた写像は同一視を保って連続写像 $X(\mathcal{W})\to X(\mathcal{W}')$ を誘導し、逆向きには、$\overline{\mathbb{D}}$ の点 $w$ を $\mathrm{sq}^{-1}(w)$ の類に送る写像が、Step 2 から（商写像 $\mathrm{sq}$ の普遍性で）連続で同一視を保つ。二つは互いに逆。頂点 $0$ は円板の中心に移り、$\pm1$ と $p_{k}$ は標準模型の頂点に移る。
:::

::: proposition 頂点点の数 {#mfd:vertex-classes keywords="for a single word, vertex points correspond to classes of polygon vertices; cut and paste preserve the set of vertex points" index="頂点の類|ちょうてんのるい"}
1. 一つの語 $W$ の実現 $X(W)$ では、模型の二つの頂点 $p_{j},p_{k}$ が同じ頂点点に移るのは、次の操作を繰り返して $p_{j}$ から $p_{k}$ に行けるときに限る：頂点 $p$ が文字 $x$ のある出現の辺の始点（終点）なら、$x$ のもう一方の出現の辺の始点（終点）に移る（始点・終点は $x$ の向き、つまりパラメータ $0$, $1$ の点で決める）。この同値類を**頂点の類**という。
2. \ref{mfd:scheme-relabel} と \ref{mfd:cut-paste} の同相写像は頂点点の集合を頂点点の集合に移す。さらに、新しい図式の模型の各頂点は、それと平面の同じ点（\ref{mfd:cut-paste} では $K_{1},K_{2}$ の頂点は $D$ の頂点 $p_{k}$）にある元の模型の頂点の像に移る。とくに頂点点の数（一つの語では頂点の類の数）は変わらない。\ref{mfd:fold} では頂点点の数がちょうど 1 減る。
:::

::: proof
**1.** $\sim$ は辺の上の点を辺の上の同じパラメータの点とだけ結びつける。頂点は辺のパラメータ $0$ か $1$ の点なので、頂点と同値な点は、この操作でたどれる頂点だけ。

**2.** 前半は各補題の証明の最後の文。\ref{mfd:fold} では、$x$ と $x^{-1}$ の間の頂点 $0$ は、$x$ の両方の出現でパラメータ $1$ の点（自分自身）とだけ同一視され、ほかのどの頂点とも同値でないので、それ自体で一つの頂点点をなす。この点は円板の中心に移り頂点点でなくなり、ほかの頂点点は 1 対 1 に移る。
:::

::: proposition 実現は閉曲面 {#mfd:realization-surface keywords="the realization of any polygon scheme is a compact surface: Hausdorff via the closed quotient map, and locally Euclidean at interior, edge and vertex points" index="実現は閉曲面|じつげんはへいきょくめん"}
任意の貼り合わせ図式 $\mathcal{W}$ について、$X(\mathcal{W})$ はコンパクトな位相曲面である。$\mathcal{W}$ が一つの語なら連結。
:::

::: proof
**Step 0（長さ 3 以上にしてよい）.** 長さ 2 の語 $W$ は、\ref{mfd:fold} を逆向きに使って、新しい文字 $y$ による $Wy\,y^{-1}$（長さ 4）に取り替えても実現は同相。よってすべての語の長さは 3 以上としてよく、模型として、一辺の長さ 1 の正多角形（辺は線分、$\tau_{k}$ は線形）をとる。$\bigsqcup K_{i}$ はコンパクト距離空間で、$X\defeq X(\mathcal{W})$ はその像なのでコンパクト。一つの語なら連結な $K_{1}$ の像なので連結。

**Step 1（同値類と飽和）.** 辺の内部の点の同値類は、その点と相手の辺の同じパラメータの点の 2 点（同じ辺どうしは同一視されない）。頂点の同値類は \ref{mfd:vertex-classes.1} の頂点の類（有限）。閉集合 $C\subset\bigsqcup K_{i}$ の飽和 $q^{-1}(q(C))$ は、$C$ と、各文字 $x$ について一方の辺の $C$ との共通部分を相手の辺へ移した像（辺の間のパラメータを保つ同相写像による、コンパクト集合の像）と、$C$ に含まれる頂点の類（有限集合）の和なので閉集合。よって $q$ は閉写像。

**Step 2（ハウスドルフ性）.** $X$ の相異なる 2 点 $x,y$ の逆像 $q^{-1}(x)$, $q^{-1}(y)$ は交わらない有限集合なので、交わらない開集合 $U\supset q^{-1}(x)$, $V\supset q^{-1}(y)$ がある。$U'\defeq X\setminus q(\bigsqcup K_{i}\setminus U)$ は Step 1 から開集合で $x$ を含み、$q^{-1}(U')\subset U$。$V'$ も同様。$q^{-1}(U'\cap V')\subset U\cap V=\varnothing$ なので $U'\cap V'=\varnothing$。

**Step 3（局所的に平面）.** 飽和した開集合 $O$ について $q\restriction O\colon O\to q(O)$ は商写像で、$q(O)$ は開集合。
- *模型の内部の点*：$O=K_{i}^{\circ}$ は飽和しており $q\restriction O$ は単射なので、$q(O)$ は開円板と同相な開集合。
- *辺の内部の点*：パラメータ $s_{0}\in(0,1)$ の点とその相手について、$\rho>0$ を小さくとり、それぞれの辺の上でパラメータが $|s-s_{0}|<\rho$ の点から内向きの法線方向に距離 $<\rho$ の点の集合（模型の中の長方形 $R_{1}$, $R_{2}$、辺の側の一辺を含む）をとる。$O\defeq R_{1}\sqcup R_{2}$ は飽和した開集合で、$R_{1}$ を $(s,t)\mapsto(s,t)$、$R_{2}$ を $(s,t)\mapsto(s,-t)$（$t$ は辺からの距離、$s$ は $x$ のパラメータ）で $\mathbb{R}^{2}$ に移すと、同一視と両立して開長方形 $(s_{0}-\rho,s_{0}+\rho)\times(-\rho,\rho)$ への連続な全単射を誘導し、逆写像も連続なので同相。
- *頂点点*：頂点の類の角（模型の頂点とそこに集まる 2 辺の組）を $\chi_{1},\dots,\chi_{m}$ とする。各角の 2 辺のそれぞれについて、相手の辺の対応する端（同じパラメータ $0$ か $1$）はこの類の角なので、角を頂点とし辺の対を辺とするグラフは、各頂点の次数が 2 で、類の定義から連結、したがって一つの閉路（$m=1$ なら自己ループ 1 本）。$0<\rho<\frac12$ について、各角の頂点を中心とする半径 $\rho$ の開扇形（角の部分、模型の中）の直和を $O$ とすると、飽和した開集合で、辺の上の点は頂点からの距離が等しい点と同一視される（辺の長さは 1 で、パラメータは頂点からの距離）。閉路の順に、$j$ 番目の扇形を、中心角を線形に伸縮し（必要なら折り返して）平面の扇形 $\{re^{i\varphi}:0\le r<\rho,\ 2\pi(j-1)/m\le\varphi\le2\pi j/m\}$ に移すと、同一視される半径どうしが同じ半径に移り、開円板 $B(0,\rho)$ への連続な全単射を誘導し、逆写像も連続なので同相。
:::

## コンパクトな連結曲面と一枚の多角形 {#mfd:sec-ps2-surfaces}

::: proposition 曲面は一つの語の実現 {#mfd:surface-one-word keywords="every compact connected surface is homeomorphic to the realization of a single word: triangulate, take one word per triangle, and paste along shared edges" index="曲面の多角形表示|きょくめんのたかくけいひょうじ"}
空でないコンパクトな連結位相曲面 $S$ について、長さ 3 以上の語 $W$ で $S\cong X(W)$ となるものがある。
:::

::: intuition
曲面を三角形に分け（ラドーの定理）、辺を共有する三角形を一枚ずつ貼り足していくと、すべての三角形が一枚の大きな多角形にまとまる。残った辺は、多角形の周の上で対になって貼り合わされる。
:::

::: proof
**Step 1（三角形分割）.** \ref{mfd:rado-triangulation} から、有限単体複体 $K$ と同相写像 $|K|\to S$ がある。\ref{mfd:prob-rd-two-triangles} から、$K$ の単体はすべて 2 単体の面で、各 1 単体はちょうど二つの 2 単体の面。\ref{at:surface-complex-criterion} から、各頂点 $v$ のまつわり複体は閉路なので、$v$ を含む 2 単体は $\sigma_{1},\dots,\sigma_{l}$ と巡回的に並び、隣り合うものは $v$ を含む 1 単体を共有する。

**Step 2（三角形の図式）.** 各 1 単体 $e$ に文字 $x_{e}$ と向き（どちらの頂点を始点とするか）を一つ決める。各 2 単体 $\sigma$ について、頂点を $u,v,w$ と巡回的に並べ、語 $W_{\sigma}$ を、辺 $[u,v],[v,w],[w,u]$ の文字に、たどる向きが決めた向きと同じなら $+1$、逆なら $-1$ の符号をつけて並べたものとする。各文字はちょうど二つの語に一回ずつ現れるので、$\mathcal{W}\defeq(W_{\sigma})_{\sigma}$ は貼り合わせ図式。$W_{\sigma}$ の模型として、平面の三角形 $T_{\sigma}$（頂点 $P_{u},P_{v},P_{w}$ を反時計回りに並べたもの、辺のパラメータは線形）をとり、$P_{u}\mapsto u$ などとなるアフィン写像 $\lambda_{\sigma}\colon T_{\sigma}\to\sigma$ をとる。

**Step 3（$X(\mathcal{W})\cong|K|$）.** 辺 $e$ の上の $x_{e}$ のパラメータ $s$ の点は、$e$ を含むどちらの三角形でも、$\lambda$ によって $e$ の始点から比 $s$ の点に移る。よって $\bigsqcup\lambda_{\sigma}$ は同一視を保ち、連続写像 $\Lambda\colon X(\mathcal{W})\to|K|$ を誘導する。$|K|$ は 2 単体の和なので全射。単射：$|K|$ の点が 2 単体の内部にあれば逆像は 1 点。1 単体 $e$ の内部にあれば、逆像は $e$ を含む二つの三角形の辺の上の同じパラメータの点で、同一視されている。頂点 $v$ なら、逆像は $v$ を含む三角形の角で、Step 1 の巡回的な並びの隣り合う三角形の角は、共有する 1 単体の文字による同一視（パラメータ $0$ か $1$ の点）で同値なので、すべて同値。$X(\mathcal{W})$ はコンパクト（有限個のコンパクト集合の像）、$|K|$ はハウスドルフなので、$\Lambda$ は同相写像（\ref{top:compact-to-hausdorff}）。

**Step 4（一つの語へのまとめ）.** 【主張：図式の語が二つ以上なら、二つの異なる語が文字を共有する】そうでないとすると、2 単体を、互いに 1 単体を共有しない空でない二組 $\mathcal{A}$, $\mathcal{B}$ に分けられる。$A\defeq\bigcup\mathcal{A}$, $B\defeq\bigcup\mathcal{B}$ は閉集合で $A\cup B=|K|$。$S$ は連結なので $A\cap B\neq\varnothing$ で、共通点は $\sigma\in\mathcal{A}$, $\tau\in\mathcal{B}$ の共通の面、つまり共通の頂点 $v$ にある。$v$ のまわりの巡回的な並び（Step 1）で $\sigma$ から $\tau$ へたどると、どこかで $\mathcal{A}$ から $\mathcal{B}$ へ移り、そこで 1 単体を共有して矛盾。そこで、文字 $x$ を共有する二つの語を \ref{mfd:scheme-relabel} で回転・反転して $Ux$, $x^{-1}V$ の形にし（$U,V$ は空でない）、\ref{mfd:cut-paste}（貼り合わせ）で一つの語 $UV$ にまとめる。語の数が 1 減り、各文字はやはりちょうど 2 回現れ、まとめた語は文字を共有する関係で同じ組にある。2 単体が $F$ 個なら、最後の語の長さは $3F-2(F-1)=F+2\ge3$。
:::

::: supplement
**高い視点：圏論的な見方.** 実現 $X(\mathcal{W})$ は、多角形の直和から、辺の対ごとの同一視という図式の余極限（押し出しの繰り返し）として得られる。切り貼りは「余極限を計算する順序を変えても結果は同じ」という事実の具体例で、対角線で切ることは、一枚の円板を二枚の円板の押し出しとして表し直すことにあたる。比喩で言えば、語は「型紙」、実現は「縫い上げた服」で、型紙の描き方が違っても縫い上がりが同じになる書き換えが、この節の補題である。

**前提を変えると.** 語の長さを 1 にしたもの（一辺だけの多角形）は許していない。$x$ と $x^{-1}$ を折り畳む操作は、残りの辺が 1 本だと円周全体が一つの辺になってしまうので、\ref{mfd:fold} は $|U|\ge2$ を仮定している。
:::

## 問題 {#mfd:sec-ps2-problems}

::: problem {#mfd:prob-ps2-vertex-count}
語 $aba^{-1}b^{-1}$, $abab$, $aabb$, $abc\,a^{-1}b^{-1}c^{-1}$ のそれぞれについて、頂点の類の数を求めよ。
:::

::: solution
\ref{mfd:vertex-classes.1} の操作で頂点をたどる。頂点を $p_{0},p_{1},\dots$（$k$ 番目の辺は $p_{k-1}$ から $p_{k}$）とする。
- $aba^{-1}b^{-1}$：$a$ の始点 $p_{0}$ と、3 番目の辺（$a^{-1}$、$p_{3}$ が始点）の $p_{3}$ が同値。$a$ の終点 $p_{1}$ と $p_{2}$、$b$ の始点 $p_{1}$ と 4 番目の辺の始点 $p_{0}$、$b$ の終点 $p_{2}$ と $p_{3}$ が同値。すべて同値で、類は 1 個。
- $abab$：$a$ の始点 $p_{0}\sim p_{2}$、終点 $p_{1}\sim p_{3}$、$b$ の始点 $p_{1}\sim p_{3}$、終点 $p_{2}\sim p_{0}$。類は $\{p_{0},p_{2}\}$, $\{p_{1},p_{3}\}$ の 2 個。
- $aabb$：$a$ の始点 $p_{0}\sim p_{1}$、終点 $p_{1}\sim p_{2}$、$b$ の始点 $p_{2}\sim p_{3}$。類は 1 個。
- $abc\,a^{-1}b^{-1}c^{-1}$：$a$ の始点 $p_{0}\sim p_{4}$（4 番目の辺 $a^{-1}$ は $p_{4}$ から $p_{3}$ へ $a$ が向く）、終点 $p_{1}\sim p_{3}$、$b$ の始点 $p_{1}\sim p_{5}$、終点 $p_{2}\sim p_{4}$、$c$ の始点 $p_{2}\sim p_{0}$、終点 $p_{3}\sim p_{5}$。類は $\{p_{0},p_{2},p_{4}\}$, $\{p_{1},p_{3},p_{5}\}$ の 2 個。
:::

::: problem {#mfd:prob-ps2-two-gons}
語 $aa^{-1}$ の実現は 2 次元球面 $S^{2}$ と同相であることを示せ。
:::

::: solution
\ref{mfd:cut-paste} を $U=a$, $V=a^{-1}$ に使うと、$X(aa^{-1})\cong X(ac,\,c^{-1}a^{-1})$。これは二枚の閉円板 $D_{1},D_{2}$ を、境界の円周の間の同相写像 $h\colon\partial D_{1}\to\partial D_{2}$（辺 $a$ どうし、$c$ どうしをパラメータで対応させたもの）で貼り合わせた空間。\ref{mfd:convex-body.3} で $h$ を同相写像 $H\colon D_{1}\to D_{2}$ に延ばし、$D_{1}$ の点 $z$ を北半球の点、$D_{2}$ の点 $w$ を $H^{-1}(w)$ に対応する南半球の点に送る（上半球と下半球を円板と同一視する）と、貼り合わせと両立する連続な全単射 $X\to S^{2}$ が得られる。$X$ はコンパクトで $S^{2}$ はハウスドルフなので同相写像。
:::
