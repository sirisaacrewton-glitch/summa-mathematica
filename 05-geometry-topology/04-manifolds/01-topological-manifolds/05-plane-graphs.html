# 平面の有限グラフの馴らし {#mfd:page-plane-graphs keywords="finite plane graph, polygonal graph, faces, cycles, Mayer-Vietoris connectivity lemma, crosscut replacement, straightening stars at vertices, every finite plane graph is tame, brick tiling polygon, convex subdivision of faces"}

前のページでは、平面の弧を平面全体の同相写像で線分に移せることを示した。このページでは、これを**有限グラフ**（有限個の弧を端点で貼り合わせたもの）に拡張する。

- 任意の有限平面グラフは、平面の同相写像で折れ線のグラフに移せる（**有限平面グラフの馴らし**）。
- 折れ線のグラフの面は、線分を足して凸多角形の内部に分けられる。
- 与えられたコンパクト集合を囲み、折れ線のグラフと有限個の点でしか交わらない多角形がとれる。

この三つが、次のページのラドーの三角形分割定理の局所的な部分になる。

## 記法と定義の確認 {#mfd:sec-gr-notation}

::: notation
- 弧・ジョルダン曲線・$\operatorname{int}J$・θ 補題・凸体は \ref{mfd:page-polygonal-schoenflies}。シェーンフリースの定理と、境界の同相写像の延長（\ref{mfd:prob-sch-two-curves}）は \ref{mfd:page-schoenflies}。弧の馴らしと到達可能性は \ref{mfd:page-tame-arcs}。
- 弧 $A$ の端点 $x,y$ について、$A$ を $[0,1]$ と同一視して得られる部分弧を $A[x,y]$ と書く（$A$ の点 $x',y'$ についても同様）。
- $\widehat{\C}$ はリーマン球面（$S^{2}$ と同相）。$\mathbb{R}^{2}$ の部分集合を $\widehat{\C}$ の部分集合ともみる。\ref{at:mayer-vietoris}（被約版）と \ref{at:singular-h0-point} を使う。開集合の連結成分は弧状連結成分と一致する。
- $B(p,r)$ は開円板、$\overline{B}(p,r)$ は閉円板、$\operatorname{dist}$ は集合の間の距離。
- 手元の資料にこの部分を扱う本がないため、証明はすべてここで書き下ろした。
:::

## 有限グラフ {#mfd:sec-gr-graphs}

::: definition 有限グラフと面 {#mfd:plane-graph keywords="finite graph in a Hausdorff space: finitely many vertices and arcs (edges) meeting only at common endpoints; plane graph, polygonal graph, faces, cycles" index="有限グラフ（空間の中の）|ゆうげんぐらふくうかんのなかの, 有限平面グラフ|ゆうげんへいめんぐらふ, 平面グラフ|へいめんぐらふ, 折れ線グラフ|おれせんぐらふ, 面（平面グラフ）|めんへいめんぐらふ, 閉路（平面グラフ）|へいろへいめんぐらふ"}
$X$ をハウスドルフ空間とする。
1. 有限集合 $V\subset X$ と、$X$ の弧の有限集合 $E$ の組 $\Gamma=(V,E)$ が $X$ の**有限グラフ**であるとは、次を満たすことをいう：各 $\varepsilon\in E$ の端点は $V$ の相異なる 2 点で、$\varepsilon$ の内部 $\varepsilon^{\circ}$ は $V$ と交わらず、相異なる $\varepsilon,\varepsilon'\in E$ は共通の端点でだけ交わる。$V$ の元を**頂点**、$E$ の元を**辺**という。頂点 $v$ を端点にもつ辺の数を $v$ の**次数**という。$|\Gamma|\defeq V\cup\bigcup E$ と書く。
2. $X=\mathbb{R}^{2}$ のとき**有限平面グラフ**という。$\mathbb{R}^{2}\setminus|\Gamma|$ の連結成分を $\Gamma$ の**面**という。すべての辺が折れ線の弧であるとき、**折れ線グラフ**という。
3. $|\Gamma|$ に含まれるジョルダン曲線を $\Gamma$ の**閉路**という。
:::

::: intuition
有限グラフとは、有限個の点（頂点）を、互いに交わらない曲がった線（辺）で結んだものである。平面グラフの面は、グラフで平面を切り分けたときの各部分である。
:::

::: lemma 閉路は辺の和 {#mfd:cycle-edges keywords="a Jordan curve contained in a finite graph contains k >= 2 vertices in cyclic order and is the union of the k edges joining consecutive ones" index="閉路の辺|へいろのへん"}
$\Gamma=(V,E)$ をハウスドルフ空間 $X$ の有限グラフ、$J$ をその閉路とする。$J$ は $k\ge2$ 個の頂点を含み、それらを $J$ の上の巡回的な順に $v_{1},\dots,v_{k}$（$v_{k+1}\defeq v_{1}$）と並べると、各 $j$ について $v_{j}$ と $v_{j+1}$ を端点とする辺 $\varepsilon_{j}\subset J$ があり、$J=\varepsilon_{1}\cup\cdots\cup\varepsilon_{k}$。
:::

::: proof
**Step 1（辺の内部は開集合）.** 【主張：各辺の内部 $\varepsilon^{\circ}$ は $|\Gamma|\setminus V$ の開集合で、$|\Gamma|\setminus V$ は互いに交わらない $\varepsilon^{\circ}$ の和】$|\Gamma|\setminus V=\bigsqcup_{\varepsilon}\varepsilon^{\circ}$ は定義から。$\varepsilon^{\circ}$ の補集合 $\bigcup_{\varepsilon'\neq\varepsilon}\varepsilon'\setminus V$ は $|\Gamma|\setminus V$ の閉集合（有限個の閉集合 $\varepsilon'$ の和との共通部分）。

**Step 2（頂点の数）.** 【主張：$J\cap V$ は $k\ge1$ 個の点からなり、$J\setminus V$ の各連結成分はある辺の内部と一致する】$J\cap V=\varnothing$ なら、$J$ は連結なので Step 1 からある $\varepsilon^{\circ}$ に含まれる。$\varepsilon^{\circ}$ は開区間 $(0,1)$ と同相で、そのコンパクトな連結部分集合は閉区間か 1 点だが、$S^{1}$ はどの 1 点を除いても連結なので、閉区間とも 1 点とも同相でない。よって $k\ge1$。$J$ から $k$ 点を除いた集合は、$S^{1}$ から $k$ 点を除いたものと同相なので、$k$ 個の連結成分をもち、各成分 $\omega$ は開区間と同相。$\omega$ は連結なので Step 1 からある $\varepsilon^{\circ}$ に含まれる。$\varepsilon^{\circ}$ を $(0,1)$ と同一視すると、$\omega$ は開区間から $(0,1)$ への連続な単射の像で、連続な単射は中間値の定理から狭義単調なので、$\omega$ は開区間、つまり $\varepsilon^{\circ}$ の開集合。$\omega$ の閉包は $\omega$ に $J\cap V$ の点を加えたものなので、$\omega$ は $\varepsilon^{\circ}$ の閉集合でもある。$\varepsilon^{\circ}$ は連結なので $\omega=\varepsilon^{\circ}$。

**Step 3（結論）.** 【主張：$k\ge2$ で、成分は隣り合う頂点を結ぶ辺の内部】Step 2 の $\omega=\varepsilon^{\circ}$ について、$J$ での $\omega$ の閉包は $\omega$ に $\omega$ の両側の頂点を加えたもので、これは $\varepsilon$ の閉包 $\varepsilon$ と一致する。$\varepsilon$ の端点は相異なるので、$\omega$ の両側の頂点は相異なり、$k\ge2$。$J\cap V$ の点を巡回的に並べると、$J\setminus V$ の成分は隣り合う 2 点の間の開いた弧で、その閉包が $v_{j}$, $v_{j+1}$ を結ぶ辺 $\varepsilon_{j}$。
:::

## 平面の位相の補題 {#mfd:sec-gr-lemmas}

::: lemma 補集合の連結性 {#mfd:complement-connected keywords="Janiszewski type lemma via Mayer-Vietoris: if two closed sets meeting in at most a point or an arc do not separate x and y, neither does their union; corollary for an arc in a connected open set" index="ヤニシェフスキの補題|やにしぇふすきのほだい"}
1. $A_{1},A_{2}\subset\widehat{\C}$ を閉集合で、$A_{1}\cap A_{2}$ が空集合・1 点・弧のいずれかであるものとする。$x,y\in\widehat{\C}\setminus(A_{1}\cup A_{2})$ が $\widehat{\C}\setminus A_{1}$ の同じ連結成分にあり、$\widehat{\C}\setminus A_{2}$ の同じ連結成分にもあれば、$\widehat{\C}\setminus(A_{1}\cup A_{2})$ の同じ連結成分にある。
2. $F\subset\widehat{\C}$ を連結な開集合、$\lambda$ を弧で $\lambda\setminus F$ が高々 1 点のものとすると、$F\setminus\lambda$ は連結。
:::

::: proof
**1.** $U_{i}\defeq\widehat{\C}\setminus A_{i}$ は開集合で、$U_{1}\cup U_{2}=\widehat{\C}\setminus(A_{1}\cap A_{2})$、$U_{1}\cap U_{2}=\widehat{\C}\setminus(A_{1}\cup A_{2})$。$\tilde H_{1}(U_{1}\cup U_{2})=0$：$A_{1}\cap A_{2}=\varnothing$ なら $\widehat{\C}\cong S^{2}$（\ref{at:sphere-homology}）、1 点なら $\mathbb{R}^{2}$ と同相で可縮（\ref{at:singular-homotopy-invariance}）、弧なら \ref{mfd:arc-nonseparating}。被約版のマイヤー–ヴィートリス完全列（\ref{at:mayer-vietoris}）
$$
\tilde H_{1}(U_{1}\cup U_{2})\to\tilde H_{0}(U_{1}\cap U_{2})\to\tilde H_{0}(U_{1})\oplus\tilde H_{0}(U_{2})
$$
から、右の写像は単射。$[x]-[y]\in\tilde H_{0}(U_{1}\cap U_{2})$ の像は、各成分が $\tilde H_{0}(U_{i})$ での $\pm([x]-[y])$ で、$x,y$ は $U_{i}$ の同じ弧状連結成分にあるので $0$（\ref{at:singular-h0-point}）。よって $[x]=[y]$ で、$x,y$ は $U_{1}\cap U_{2}$ の同じ弧状連結成分にある。

**2.** $A_{1}\defeq\widehat{\C}\setminus F$, $A_{2}\defeq\lambda$ に 1 を使う。$A_{1}\cap A_{2}=\lambda\setminus F$ は空集合か 1 点。$F\setminus\lambda$ の 2 点は、$\widehat{\C}\setminus A_{1}=F$ の中でも、$\widehat{\C}\setminus\lambda$（連結、\ref{mfd:arc-nonseparating}）の中でも同じ成分にあるので、$F\setminus\lambda$ の同じ成分にある。
:::

::: lemma 折れ線の弧 {#mfd:polygonal-arc keywords="points of a connected open set are joined by polygonal paths; a polygonal path with the fewest segments is an arc" index="折れ線の道|おれせんのみち"}
1. $F\subset\mathbb{R}^{2}$ を連結な開集合とする。$F$ の 2 点は、$F$ に含まれる折れ線の道（有限個の線分を順につないだもの）で結べる。
2. $x\neq y$ を折れ線の道 $\gamma$ で結ぶ。$\gamma$ の点集合を $|\gamma|$ と書く。$x,y$ を結ぶ折れ線の弧で、$|\gamma|$ に含まれるものがある。
:::

::: proof
**1.** $x\in F$ と $F$ の中の折れ線の道で結べる $F$ の点全体を $R$ とする。$z\in F$ について、円板 $B(z,r)\subset F$ をとると、$B(z,r)$ の 2 点は線分で結べるので、$B(z,r)$ は $R$ に含まれるか $R$ と交わらない。よって $R$ と $F\setminus R$ は開集合で、$F$ は連結、$x\in R$ なので $R=F$。

**2.** 点集合が $|\gamma|$ に含まれる、$x$ から $y$ への折れ線の道 $[z_{0},z_{1}]\cup\cdots\cup[z_{n-1},z_{n}]$（$z_{0}=x$, $z_{n}=y$）のうち、線分の数 $n$ が最小のものをとる。最小性から $z_{i-1}\neq z_{i}$。$i<j$ について $s_{i}\defeq[z_{i-1},z_{i}]$ と $s_{j}$ が、$j=i+1$ のときの共有点 $z_{i}$ 以外に共通点 $w$ をもつとする。$j\ge i+2$ なら、$z_{0},\dots,z_{i-1},w,z_{j},\dots,z_{n}$ は $|\gamma|$ に含まれる道（$[z_{i-1},w]\subset s_{i}$, $[w,z_{j}]\subset s_{j}$）で線分の数は $n-(j-i)+1<n$。$j=i+1$ なら $s_{i}$ と $s_{i+1}$ は $z_{i}$ と $w$ を共有するので同じ直線上で、$z_{i}$ から同じ向きに伸びている。このとき $[z_{i-1},z_{i+1}]\subset s_{i}\cup s_{i+1}$ で、線分を一つ減らせる。いずれも最小性に反するので、各線分は前後の線分と共有点でだけ交わり、それ以外とは交わらない。よって $[0,n]$ から道への区分的に線形な写像は単射で、\ref{top:compact-to-hausdorff} から弧。
:::

2 の弧は $x$ を始点としてしか通らない（単射）。とくに $|\gamma|\setminus\{x,y\}$ がある集合 $F$ に含まれれば、弧の端点以外の点も $F$ に含まれる。また、折れ線の弧 $\pi$ が閉集合 $M$ と交わるとき、$\pi$ を始点からたどって最初に $M$ に属する点がある（$\pi$ をパラメータ表示したとき、$M$ の逆像はコンパクト）。これを $\pi$ の $M$ への**最初の到達点**という。

::: lemma 横断弧の取り替え {#mfd:crosscut-replacement keywords="two crosscuts of a Jordan domain with the same endpoints are exchanged by a homeomorphism of the plane that is the identity outside the domain and prescribed on the crosscut" index="横断弧の取り替え|おうだんこのとりかえ"}
$Z\subset\mathbb{R}^{2}$ をジョルダン曲線、$U\defeq\operatorname{int}Z$ とする。弧 $\kappa,\kappa'$ が同じ端点 $u\neq v\in Z$ をもち、$\kappa^{\circ},\kappa'^{\circ}\subset U$ とする。同相写像 $f\colon\kappa\to\kappa'$ で $f(u)=u$, $f(v)=v$ となるものについて、$\mathbb{R}^{2}$ の同相写像 $k$ で、$\kappa$ の上で $f$ に一致し、$\mathbb{R}^{2}\setminus U$ の上で恒等写像となるものがある。
:::

::: proof
$Z$ を $u,v$ で分けた弧を $Z_{1},Z_{2}$ とする。

**Step 1（分割）.** \ref{mfd:theta-lemma} から、$C_{i}\defeq Z_{i}\cup\kappa$, $C'_{i}\defeq Z_{i}\cup\kappa'$ について、$\overline{U}=\overline{\operatorname{int}C_{1}}\cup\overline{\operatorname{int}C_{2}}$ で共通部分は $\kappa$、同様に $\overline{U}=\overline{\operatorname{int}C'_{1}}\cup\overline{\operatorname{int}C'_{2}}$ で共通部分は $\kappa'$。

**Step 2（各部分の同相）.** 【主張：同相写像 $G_{i}\colon\overline{\operatorname{int}C_{i}}\to\overline{\operatorname{int}C'_{i}}$ で、$Z_{i}$ の上で恒等写像、$\kappa$ の上で $f$ となるものがある】$g_{i}\colon C_{i}\to C'_{i}$ を $Z_{i}$ の上で恒等写像、$\kappa$ の上で $f$ と定めると、二つの閉集合の共通部分 $\{u,v\}$ で一致するので連続（\ref{top:pasting-lemma}）、全単射（$Z_{i}\cap\kappa'=\{u,v\}$）なので同相写像（\ref{top:compact-to-hausdorff}）。\ref{mfd:prob-sch-two-curves} から $G_{i}$ に延びる。

**Step 3（貼り合わせ）.** 【主張：$k\defeq G_{1}\cup G_{2}\cup\mathrm{id}_{\mathbb{R}^{2}\setminus U}$ は求める同相写像】三つの閉集合 $\overline{\operatorname{int}C_{1}}$, $\overline{\operatorname{int}C_{2}}$, $\mathbb{R}^{2}\setminus U$ の共通部分は、最初の二つでは $\kappa$（どちらも $f$）、$\overline{\operatorname{int}C_{i}}$ と $\mathbb{R}^{2}\setminus U$ では $Z_{i}$（どちらも恒等写像）なので、$k$ は矛盾なく定まり連続（\ref{top:pasting-lemma}）。Step 1 の分割が対応するので $k$ は全単射で、逆写像も $G_{i}^{-1}$ と恒等写像の貼り合わせとして連続。
:::

## 有限平面グラフの馴らし {#mfd:sec-gr-taming}

::: lemma 頂点のまわりの直線化 {#mfd:star-straightening keywords="near a vertex, the edges of a finite plane graph can be made straight radii by a homeomorphism supported in a small disk" index="頂点のまわりの直線化|ちょうてんのまわりのちょくせんか"}
$\Gamma$ を有限平面グラフ、$p$ を次数 $d\ge1$ の頂点、$r>0$ を、$\overline{B}(p,r)$ が $p$ 以外の頂点を含まず、$p$ を端点にもつ辺 $\varepsilon_{1},\dots,\varepsilon_{d}$ 以外の辺と交わらないようにとる。$\mathbb{R}^{2}$ の同相写像 $g$ で、$B(p,r)$ の外で恒等写像、$g(p)=p$ であり、ある $r'\in(0,r)$ と相異なる単位ベクトル $u_{1},\dots,u_{d}$ について
$$
g(\varepsilon_{j})\cap B(p,r')=\{p+tu_{j}:0\le t<r'\}\quad(j=1,\dots,d)
$$
となるものがある。
:::

::: intuition
頂点に集まる辺は、頂点のすぐ近くでは激しく揺れているかもしれない。頂点のまわりの小さな円板の中だけを動かして、それらをまっすぐな放射状の線分にそろえられる。
:::

::: proof
$B\defeq B(p,r)$ とおく。

**Step 1（最初の出口）.** 【主張：各 $\varepsilon_{j}$ の部分弧 $\alpha_{j}$ で、$p$ と円周上の点 $q_{j}$ を結び、$\alpha_{j}\setminus\{q_{j}\}\subset B$ となるものがあり、$\alpha_{j}$ どうしは $p$ でだけ交わり、$q_{j}$ は相異なる】$\varepsilon_{j}$ を $p$ から始まるようにパラメータ表示する。もう一方の端点は $\overline{B}(p,r)$ の外にあるので、$|\varepsilon_{j}(t)-p|=r$ となる最初の $t_{j}$ がある。$\alpha_{j}\defeq\varepsilon_{j}([0,t_{j}])$, $q_{j}\defeq\varepsilon_{j}(t_{j})$。$\alpha_{j}\cap\alpha_{l}\subset\varepsilon_{j}\cap\varepsilon_{l}$ は共通の端点だけで、$p$ 以外の端点は $\overline{B}$ の外。

**Step 2（$d=1$ のときの補助の腕）.** 【主張：$d=1$ なら、弧 $\alpha_{0}$ で $p$ と円周上の点 $q_{0}\neq q_{1}$ を結び、$\alpha_{0}\setminus\{q_{0}\}\subset B$、$\alpha_{0}\cap\alpha_{1}=\{p\}$ となるものがある】\ref{mfd:arc-consequences.2} から、弧 $L\subset B(p,r/2)$ で $p$ を端点とし $L\cap\alpha_{1}=\{p\}$ となるものがある。$\alpha_{1}\setminus B=\{q_{1}\}$ なので、\ref{mfd:complement-connected.2} から $B\setminus\alpha_{1}$ は連結。円周上の点 $x\neq q_{1}$ と、半径 $[p,x]$ の上で $x$ に近い点 $x_{0}$ を、$[x_{0},x]$ が $\alpha_{1}$ と交わらないようにとる（$x$ と $\alpha_{1}$ の距離は正）。$L$ の端点以外の点 $c$ をとり、\ref{mfd:polygonal-arc.1} で $x_{0}$ と $c$ を $B\setminus\alpha_{1}$ の中の折れ線の道で結び、$[x,x_{0}]$ を前につないで \ref{mfd:polygonal-arc.2} を使うと、$x$ と $c$ を結ぶ折れ線の弧 $\pi$ で、$\pi\setminus\{x\}\subset B\setminus\alpha_{1}$ となるものが得られる。$\pi$ の $L$ への最初の到達点を $w$ とすると、$w\neq p$（$\pi$ は $\alpha_{1}\ni p$ と交わらない）。$\alpha_{0}\defeq\pi[x,w]\cup L[w,p]$, $q_{0}\defeq x$ とすればよい。

**Step 3（扇形への分割）.** 【主張：腕 $\alpha_{j}$（$j\in I$, $|I|\ge2$）の端点 $q_{j}$ を円周上で反時計回りに $q_{j_{1}},\dots,q_{j_{m}}$ と並べ、$\tau_{l}$ を $q_{j_{l}}$ から $q_{j_{l+1}}$ への円周の閉じた弧（反時計回り、$j_{m+1}\defeq j_{1}$）とする。$Z_{l}\defeq\alpha_{j_{l}}\cup\tau_{l}\cup\alpha_{j_{l+1}}$ はジョルダン曲線で、$B\setminus\bigcup_{j}\alpha_{j}=\bigsqcup_{l}\operatorname{int}Z_{l}$、$\operatorname{int}Z_{l}\subset B$】腕の数についての帰納法。2 本のとき $\alpha_{j_{1}}\cup\alpha_{j_{2}}$ は $q_{j_{1}}$ と $q_{j_{2}}$ を結ぶ弧で、内部は $B$ に入るので、\ref{mfd:theta-lemma} から主張が成り立つ（円板 $B$ は円周の内側）。腕を一本 $\alpha$ 加えるとき、その端点 $q$ はある $\tau_{l}$ の内部にある。$\alpha\setminus\{p,q\}$ は連結で他の腕と交わらないので、ある $\operatorname{int}Z_{l'}$ に含まれ、その閉包は $q$ を含むので $q\in Z_{l'}$、したがって $l'=l$。$\alpha$ は $\operatorname{int}Z_{l}$ の横断弧（端点 $p,q\in Z_{l}$）なので、\ref{mfd:theta-lemma} から $\operatorname{int}Z_{l}$ は、$\tau_{l}$ を $q$ で分けた二つの弧に対応する二つのジョルダン領域に分かれる。半径 $\rho_{j}\defeq[p,q_{j}]$ についても同じことが成り立つ。

**Step 4（同相写像）.** 【主張：$g$ が作れる】腕の集合を、$d\ge2$ なら $\{\alpha_{1},\dots,\alpha_{d}\}$、$d=1$ なら $\{\alpha_{0},\alpha_{1}\}$ とする。各腕について同相写像 $f_{j}\colon\alpha_{j}\to\rho_{j}$ で $p\mapsto p$, $q_{j}\mapsto q_{j}$ となるものを固定する。Step 3 の $Z_{l}$ と、半径に対する $Z^{\rho}_{l}\defeq\rho_{j_{l}}\cup\tau_{l}\cup\rho_{j_{l+1}}$ について、$f_{j_{l}}\cup\mathrm{id}_{\tau_{l}}\cup f_{j_{l+1}}\colon Z_{l}\to Z^{\rho}_{l}$ は同相写像で（端点で一致し、全単射）、\ref{mfd:prob-sch-two-curves} から同相写像 $G_{l}\colon\overline{\operatorname{int}Z_{l}}\to\overline{\operatorname{int}Z^{\rho}_{l}}$ に延びる。$g$ を $\overline{\operatorname{int}Z_{l}}$ の上で $G_{l}$、$\mathbb{R}^{2}\setminus B$ の上で恒等写像と定める。これらの閉集合どうしの共通部分は腕・円周の弧・それらの点で、そこではどの定義も $f_{j}$ か恒等写像なので、$g$ は矛盾なく定まり連続（\ref{top:pasting-lemma}）。Step 3 の分割が対応するので全単射で、逆写像も同様に連続。

**Step 5（結論）.** 【主張：$g$ は求める性質をもつ】$g(\alpha_{j})=\rho_{j}$。$\beta_{j}\defeq\varepsilon_{j}\setminus(\alpha_{j}\setminus\{q_{j}\})$ はコンパクトで $p$ を含まず、$g(p)=p$ なので $g(\beta_{j})$ も $p$ を含まない。$r'>0$ を $r$ と、すべての $\operatorname{dist}(p,g(\beta_{j}))$ より小さくとると、$g(\varepsilon_{j})\cap B(p,r')=\rho_{j}\cap B(p,r')$。$u_{j}\defeq(q_{j}-p)/r$ は相異なる。

::: hypcheck
- **$\overline{B}(p,r)$ がほかの頂点・辺と交わらない**：Step 1 で腕が $p$ でだけ交わることと、$g$ が $p$ を端点にもたない辺を動かさないことに使った（それらは $B$ の外にある）。$p$ を端点にもつ辺は $q_{j}$ で $B$ を出た後に再び $B$ に入ることがあり、その部分は $g$ で動くが、Step 3・4 で使うのは腕 $\alpha_{j}$ だけで、Step 5 は $\operatorname{dist}(p,g(\beta_{j}))$ でこれを処理している。
- **$d=1$ の場合**：腕が 1 本だけでは $B$ が扇形に分かれないので、\ref{mfd:arc-consequences.2}（弧の端点への到達）で補助の腕を作った。
:::
:::

::: theorem 有限平面グラフの馴らし {#mfd:tame-graph keywords="every finite plane graph is tame: a homeomorphism of the plane carries it onto a polygonal graph" index="有限平面グラフの馴らし|ゆうげんへいめんぐらふのならし" refname="有限平面グラフの馴らし"}
任意の有限平面グラフ $\Gamma$ について、$\mathbb{R}^{2}$ の同相写像 $\psi$ で、$\psi(\Gamma)\defeq(\psi(V),\{\psi(\varepsilon)\})$ が折れ線グラフになるものがある。
:::

::: intuition
曲がりくねった線で描いたグラフも、平面全体をうまくゆがめれば、まっすぐな線分をつないだグラフになる。頂点の近くを放射状にそろえてから、各辺の真ん中の部分を一本ずつまっすぐにしていく。
:::

::: proof
同相写像で移した $\Gamma$ をまた $\Gamma$ と書き、有限回の操作を合成する。同相写像で移した有限平面グラフは有限平面グラフである。

**Step 1（頂点のまわり）.** 【主張：$s>0$ があって、各頂点 $p$ と $p$ を端点にもつ各辺 $\varepsilon$ について、$\varepsilon\cap B(p,2s)$ は半径 $\{p+tu_{\varepsilon}:0\le t<2s\}$ になるようにできる】$r>0$ を、閉円板 $\overline{B}(p,r)$（$p\in V$）が互いに交わらず、それぞれ $p$ 以外の頂点と $p$ を端点にもたない辺に交わらないようにとる（有限個のコンパクト集合と点の距離は正）。次数 1 以上の各頂点に \ref{mfd:star-straightening} の $g_{p}$ をとる（次数 0 の頂点では $g_{p}\defeq\mathrm{id}$ とし、主張は空）。$g_{p}$ は $B(p,r)$ の外で恒等写像で、これらの円板は交わらないので、すべてを合成しても、各 $p$ のまわりでは $g_{p}$ だけが働く。$p$ を端点にもたない辺は $B(p,r)$ に入らないままである。$2s$ を各 $r'$ より小さくとればよい。

**Step 2（辺の中央の準備）.** 【主張：辺 $\varepsilon$（端点 $p\neq p'$）の部分弧 $m\defeq\varepsilon[c,c']$、$c\defeq p+su_{\varepsilon}$, $c'\defeq p'+su'_{\varepsilon}$ について、ジョルダン曲線 $Z$ で、$Z\cap|\Gamma|=\{c,c'\}$、$\operatorname{int}Z\cap|\Gamma|=m\setminus\{c,c'\}$ となるものがある】$c_{-}\defeq p+\frac{s}{2}u_{\varepsilon}$, $c'_{-}\defeq p'+\frac{s}{2}u'_{\varepsilon}$ とし、$\tilde\varepsilon\defeq\varepsilon[c_{-},c'_{-}]$（$m$ を含む）とする。$X\defeq|\Gamma|\setminus(\tilde\varepsilon\setminus\{c_{-},c'_{-}\})$ はほかの辺と $\varepsilon$ の両端の部分の和なので閉集合で、$X\cap\tilde\varepsilon=\{c_{-},c'_{-}\}$。$\tilde\varepsilon$ のパラメータ表示 $\alpha$ を $\alpha(0)=c_{-}$, $\alpha(\frac14)=c$, $\alpha(\frac34)=c'$, $\alpha(1)=c'_{-}$ となるようにとり、\ref{mfd:tame-arc.2} の $H$ をとる：$H(\alpha(t))=(2t-1,0)$。$H(X)$ は閉集合で、$[-1,1]\times\{0\}$ とは $(\pm1,0)$ でだけ交わるので、コンパクト集合 $[-\frac12,\frac12]\times\{0\}$ との距離 $\delta$ は正。$0<\eta<\delta$ について $R\defeq[-\frac12,\frac12]\times[-\eta,\eta]$ とすると $R\cap H(|\Gamma|)=[-\frac12,\frac12]\times\{0\}=H(m)$。$Z\defeq H^{-1}(\partial R)$ はジョルダン曲線で、$H^{-1}(R^{\circ})$ は有界で（閉包 $H^{-1}(R)$ がコンパクト）$\mathbb{R}^{2}\setminus Z$ の連結成分なので $\operatorname{int}Z$。$H(c)=(-\frac12,0)$, $H(c')=(\frac12,0)$ は $\partial R$ の上にあるので、主張が従う。

**Step 3（中央を折れ線に）.** 【主張：$\varepsilon$ を折れ線の弧に取り替え、ほかの辺を動かさない同相写像がある】$\varepsilon\cap B(p,2s)$ は $p$ を含む $\varepsilon$ の連結部分集合（半径）なので、$\varepsilon$ の $p$ からの最初の部分弧であり、$m$ は $c$ の近くで線分 $[c,c+tu_{\varepsilon}]$（$0<t<s/2$）を含み、その $c$ 以外の点は $\operatorname{int}Z$ に入る。$c'$ の近くも同様。\ref{mfd:polygonal-arc.1} で $c+tu_{\varepsilon}$ と $c'+tu'_{\varepsilon}$ を $\operatorname{int}Z$ の中の折れ線の道で結び、両端に二つの線分をつないで \ref{mfd:polygonal-arc.2} を使うと、$c$ と $c'$ を結ぶ折れ線の弧 $\kappa'$ で $\kappa'\setminus\{c,c'\}\subset\operatorname{int}Z$ となるものが得られる。\ref{mfd:crosscut-replacement} を $Z$, $\kappa\defeq m$, $\kappa'$ に使うと、同相写像 $k$ で、$\operatorname{int}Z$ の外で恒等写像、$k(m)=\kappa'$ となるものがある。Step 2 から $\operatorname{int}Z$ は $m$ 以外の $|\Gamma|$ の点を含まないので、ほかの辺と $\varepsilon[p,c]$, $\varepsilon[c',p']$ は動かない。$k(\varepsilon)=[p,c]\cup\kappa'\cup[c',p']$ は折れ線の弧。

**Step 4（すべての辺）.** Step 2・3 を辺ごとに順に行う。各段階でほかの辺は動かないので、すでに折れ線になった辺は折れ線のまま、まだ処理していない辺の両端の半径の部分（Step 2 で使う）もそのまま残る。なお、新しい折れ線 $\kappa'$ はほかの頂点のまわりの円板 $B(q,2s)$ に入ることがあるので、「各円板と $|\Gamma|$ の共通部分が半径の和」という性質は保たれないが、Step 2・3 で使うのは処理する辺それ自身の両端の半径の部分だけである。

::: hypcheck
- **辺が有限個**：Step 1 で頂点のまわりの円板の半径を正にとることと、Step 4 で操作が有限回で終わることに使った。
- **辺の端点が相異なる**：Step 2 で $c$ と $c'$ が辺の別々の端の近くにあることに使った。
- **弧の馴らし**：Step 2 で、辺の中央の部分だけを含み、ほかの辺と交わらないジョルダン領域を作るのに使った。
:::
:::

## 多角形による囲み込みと面の凸分割 {#mfd:sec-gr-polygons}

::: lemma 煉瓦積みの多角形 {#mfd:brick-polygon keywords="a compact connected set inside an open set is surrounded by a polygon in the open set, made of horizontal and vertical segments in general position with respect to finitely many given segments" index="煉瓦積みの多角形|れんがづみのたかくけい"}
$K\subset\mathbb{R}^{2}$ を空でないコンパクトな連結集合、$O\supset K$ を開集合、$s_{1},\dots,s_{N}$ を線分とする。多角形 $Z\subset O\setminus K$ で、$K\subset\operatorname{int}Z$ かつ各 $Z\cap s_{l}$ が有限集合となるものがある。
:::

::: intuition
レンガを互い違いに積んだ模様で平面を敷き詰め、$K$ に触れるレンガを集める。互い違いに積むと、どの角でもレンガが三つしか集まらないので、集めたレンガの外周は自分と交わらない多角形になる。
:::

::: proof
$\delta>0$ を $2\delta<\operatorname{dist}(K,\mathbb{R}^{2}\setminus O)$ となるようにとる（$O=\mathbb{R}^{2}$ なら任意）。

**Step 1（煉瓦積み）.** 実数 $a,b$ について、$n$ 行目（$n\in\mathbb{Z}$）の煉瓦を
$$
T_{m,n}\defeq[a_{n}+m\delta,\,a_{n}+(m+1)\delta]\times[b+n\delta,\,b+(n+1)\delta],\quad a_{n}\defeq a+\tfrac{\delta}{2}(n\bmod2)
$$
とする。これらは平面を覆い、異なる二つの共通部分は空集合か共通の辺（長さ $\delta$ の縦の辺か、長さ $\delta/2$ の横の辺）のいずれか（共有点があれば、それを含む頂点か辺を通して辺を共有する）。**頂点**（煉瓦の角）$v$ はちょうど三つの煉瓦に含まれる：$v$ が $n$ 行目の縦の区切りの下端なら、$n$ 行目の左右の二つと、$v$ を上辺の内部に含む $n-1$ 行目の一つ（上端の場合も同様）。$v$ から出る辺はちょうど三本で、三つの煉瓦のうちの二つずつの境になっている。横の辺の乗る直線 $y=b+n\delta$ と縦の辺の乗る直線 $x=a_{n}+m\delta$ が、$s_{l}$ を含む直線と一致しないように $a,b$ をとる（避けるべき値は $\delta$ や $\delta/2$ を法として有限個）。すると、煉瓦の辺はどの $s_{l}$ とも高々 1 点で交わる。

**Step 2（外周）.** 【主張：$K$ と交わる煉瓦の和 $Q$ について、「$Q$ の煉瓦と $Q$ にない煉瓦の境の辺」の和 $\partial_{Q}$ は、互いに交わらない有限個の多角形の和】$Q$ は有限個の煉瓦の和で、各煉瓦の直径 $\sqrt2\delta<2\delta$ なので $Q\subset O$。頂点 $v$ を含む三つの煉瓦のうち $Q$ に属するものの数が 1 か 2 なら、$v$ から出る $\partial_{Q}$ の辺はちょうど 2 本、0 か 3 なら 0 本。したがって $\partial_{Q}$ の各連結成分は、どの頂点でも辺が 2 本ずつ出る有限グラフで、辺をたどると同じ頂点に戻る閉じた折れ線になり、自分と交わらないので多角形。

**Step 3（$Q$ の連結性）.** 【主張：$Q$ の煉瓦は、辺を共有する隣り合いでつながっている】$Q$ は連結（各煉瓦は連結で $K$ と交わり、$K$ は連結）。$Q$ の煉瓦を、辺を共有する隣り合いでつながる組に分けたとき二組以上あれば、異なる組の煉瓦は交わらない（共有点があれば、それはどちらにも含まれる頂点で、その頂点の三つの煉瓦は互いに辺を共有する）。すると $Q$ は交わらない二つの空でない閉集合の和になり矛盾。

**Step 4（多角形の選択）.** 【主張：$\partial_{Q}$ の多角形 $Z$ で $K\subset\operatorname{int}Z$ となるものがある】$\Omega$ を $\mathbb{R}^{2}\setminus Q$ の非有界な連結成分とする。$\Omega\neq\mathbb{R}^{2}$ なので、境界点 $z\in\partial\Omega$ がある。$z\notin\Omega$ で、$z$ のまわりの小円板は $\Omega$ と交わるので、$z\in Q$（$z\notin Q$ なら $z$ のまわりの小円板は $\mathbb{R}^{2}\setminus Q$ に含まれ、$\Omega$ と交わる連結集合なので $\Omega$ に含まれる）。$z$ を含む煉瓦に $Q$ のものとそうでないものがあるので、$z$ は $\partial_{Q}$ のある多角形 $Z$ の上にある。$z$ の小円板 $B$ は $Z$ で二つの扇形に分かれ、一方は $Q$ の煉瓦の部分、他方は $Q$ にない煉瓦の部分である（$\partial_{Q}$ のほかの多角形は $z$ から離れている）。$\Omega$ は連結で $Z$ と交わらず非有界なので $\Omega\subset\operatorname{ext}Z$。$\Omega$ は $B$ と交わり、その点は $Q$ にない側の扇形にあるので、その扇形は $\operatorname{ext}Z$ に含まれ、$Q$ の側の扇形は $\operatorname{int}Z$ に含まれる（$z$ は $\operatorname{int}Z$ と $\operatorname{ext}Z$ の両方の境界の点）。$Q$ の煉瓦の内部と、$Q$ の二つの煉瓦の共有する辺の内部は $\partial_{Q}$ と交わらないので、Step 3 から、$Q$ の煉瓦の内部はすべて $Z$ の同じ側、つまり $\operatorname{int}Z$ にある。$\partial_{Q}$ の辺は $Q$ にない煉瓦に含まれ、その煉瓦は $K$ と交わらないので $Z\cap K=\varnothing$。$K$ の点は $Q$ の煉瓦の内部の閉包、つまり $\operatorname{int}Z\cup Z$ に入り、$Z$ には入らないので $K\subset\operatorname{int}Z$。$Z\subset Q\subset O$ で、Step 1 から $Z\cap s_{l}$ は有限。
:::

::: proposition 面の凸分割 {#mfd:convex-subdivision keywords="a bounded face of a polygonal plane graph can be subdivided by adding segments so that every new face is the interior of a convex polygon which is a cycle" index="面の凸分割|めんのとつぶんかつ"}
$\Gamma$ を折れ線グラフ、$F$ をその有界な面とする。折れ線グラフ $\Gamma^{+}$ で、$\Gamma$ の頂点はすべて $\Gamma^{+}$ の頂点、$\Gamma$ の各辺は $\Gamma^{+}$ の辺の和、$|\Gamma^{+}|\setminus|\Gamma|\subset F$ であり、$F$ に含まれる $\Gamma^{+}$ の面はすべて、$\Gamma^{+}$ の閉路である凸多角形の内部になるものがある。
:::

::: proof
**Step 1（直線による分割）.** $\Gamma$ の辺を構成する線分を含む直線と、$\Gamma$ の各孤立頂点（次数 0 の頂点）を通る水平な直線の全体を $\mathcal{L}$（有限集合）とする。$F$ が有界な面なので $\Gamma$ には辺があり（有限個の点の補集合は連結）、$\mathcal{L}\neq\varnothing$。孤立頂点を通る直線を加えたので $|\Gamma|\subset\bigcup\mathcal{L}$。（これを加えないと、三角形とその内部の 1 点からなるグラフでは、面「三角形の内部から 1 点を除いた集合」が凸多角形の内部にならない。）$\mathbb{R}^{2}\setminus\bigcup\mathcal{L}$ の連結成分（**胞**）は、各直線のどちら側にあるかを指定した開半平面の共通部分のうち空でないもので、有限個の開凸集合。各胞 $C$ は $|\Gamma|\subset\bigcup\mathcal{L}$ と交わらず連結なので、$F$ に含まれるか $F$ と交わらない。$F$ は有界なので、$F$ に含まれる胞は有界な開凸集合で、閉包 $\overline{C}$ は有限個の閉半平面の共通部分（凸体）、境界 $\partial\overline{C}$ は有限個の線分の和で、\ref{mfd:convex-body.2} から凸多角形であり $C=\operatorname{int}\partial\overline{C}$。

**Step 2（グラフ）.** 【主張：$|\Gamma|$ と、$F$ に含まれる胞の境界 $\partial\overline{C}$ の和は、ある折れ線グラフ $\Gamma^{+}$ の $|\Gamma^{+}|$ で、主張の包含関係を満たす】この集合は有限個の線分の和である。同じ直線上で重なる線分はまとめて一つの線分にし、$\Gamma$ の頂点・各線分の端点・異なる直線上の 2 線分の交点を頂点、各線分を頂点で区切った小線分を辺とすると、辺は頂点でだけ交わる折れ線グラフ $\Gamma^{+}$ になる。$\Gamma$ の線分の端点は $\Gamma^{+}$ の頂点なので、$\Gamma$ の各辺は $\Gamma^{+}$ の辺の和。$\partial\overline{C}\subset\overline{F}=F\cup\partial F$ で $\partial F\subset|\Gamma|$ なので、$|\Gamma^{+}|\setminus|\Gamma|\subset F$。

**Step 3（面）.** 【主張：$F\setminus|\Gamma^{+}|$ は $F$ に含まれる胞の和】胞は互いに交わらず、ほかの胞の境界とも $|\Gamma|$ とも交わらないので、$F$ に含まれる胞は $F\setminus|\Gamma^{+}|$ に含まれる。逆に、$x\in F$ が $\mathcal{L}$ のある直線の上にあるとする。胞の閉包の和は $\mathbb{R}^{2}$ なので $x\in\overline{C}$ となる胞 $C$ があり、$x$ の近傍で $F$ に含まれるものは $C$ と交わるので $C\subset F$、$x\in\overline{C}\setminus C=\partial\overline{C}\subset|\Gamma^{+}|$。よって $F\setminus|\Gamma^{+}|=F\setminus\bigcup\mathcal{L}$ は $F$ に含まれる胞の和で、各胞は連結な開集合で互いに交わらないので、$F\setminus|\Gamma^{+}|$ の連結成分、つまり $F$ に含まれる $\Gamma^{+}$ の面はちょうどこれらの胞。各胞 $C$ は凸多角形 $\partial\overline{C}\subset|\Gamma^{+}|$（$\Gamma^{+}$ の閉路）の内部。
:::

::: supplement
**高い視点：位相的な構造と区分線形な構造.** 平面の場合、このページの結果は「位相的に埋め込まれた 1 次元の図形は、すべて区分線形（PL）な図形と同値」と言い換えられる。比喩で言えば、平面では「ひも」をどんなにもつれさせても、平面ごとゆがめれば直線の部品の組み合わせに戻る。3 次元では、弧についてさえ、これが成り立たない（\ref{mfd:page-tame-arcs} の補足の野性的な弧）。

**似た定理.** 有限平面グラフについては、ここで示した馴らしのほか、2 連結な平面グラフの面の境界はすべて閉路であること、平面グラフの組合せ的な性質（オイラーの公式など）が知られている。ここでは面の境界を直接調べる代わりに、馴らしてから直線で切る方法をとった。
:::

## 問題 {#mfd:sec-gr-problems}

::: problem {#mfd:prob-gr-theta}
ジョルダン曲線 $J\subset\mathbb{R}^{2}$ と、端点が $J$ の上にあり内部が $\operatorname{int}J$ に入る弧 $P$ について、$J\cup P$ は 3 本の辺からなる有限平面グラフ（θ 形）とみなせる。このグラフを平面の同相写像で、正三角形の周と一本の中線からなる図形に移せることを示せ。
:::

::: solution
$P$ の端点を $a,b$ とし、$J$ を $a,b$ で分けた弧を $J_{1},J_{2}$ とする。正三角形 $T$ の頂点 $A$ と対辺の中点 $M$ を結ぶ中線を $P'$、$T$ の周を $A,M$ で分けた折れ線の弧を $J'_{1},J'_{2}$ とする。\ref{mfd:plane-schoenflies}（凸体 $T$）から、平面の同相写像 $H_{1}$ で $J$ を $\partial T$ に、$a,b,J_{1},J_{2}$ を $A,M,J'_{1},J'_{2}$ に移すものがある（$J$ から $\partial T$ への同相写像を $J_{i}\to J'_{i}$ の同相写像を貼り合わせて作る）。$H_{1}(P)$ と $P'$ は $\operatorname{int}\partial T$ の同じ端点の横断弧なので、\ref{mfd:crosscut-replacement} の $k$ について $k\circ H_{1}$ が求めるもの。
:::

::: problem {#mfd:prob-gr-tree}
有限平面グラフ $\Gamma$ が木（連結で閉路をもたない）なら、$\mathbb{R}^{2}\setminus|\Gamma|$ は連結であることを示せ。
:::

::: solution
辺の数についての帰納法。辺がなければ、連結な木なので $|\Gamma|$ は空集合か 1 点で、空集合なら明らか。1 点のとき、$\mathbb{R}^{2}$ から 1 点を除いた集合は連結（2 点は、除いた点を通らない二本の線分で結べる）。辺が 1 本以上の木には次数 1 の頂点 $v$ がある（辺の数が最大の道の端点）。$v$ を端点とする辺 $\varepsilon$ を除いた $\Gamma'$（頂点 $v$ も除く）は木で、帰納法の仮定から $\mathbb{R}^{2}\setminus|\Gamma'|$ は連結。\ref{mfd:complement-connected.1} を $\widehat{\C}$ の閉集合 $A_{1}\defeq|\Gamma'|\cup\{\infty\}$, $A_{2}\defeq\varepsilon$ に使う。$A_{1}\cap A_{2}$ は $\varepsilon$ のもう一方の端点の 1 点。$\widehat{\C}\setminus A_{1}=\mathbb{R}^{2}\setminus|\Gamma'|$ は連結、$\widehat{\C}\setminus\varepsilon$ も連結（\ref{mfd:arc-nonseparating}）なので、$\widehat{\C}\setminus(A_{1}\cup A_{2})=\mathbb{R}^{2}\setminus|\Gamma|$ の 2 点は同じ連結成分にある。
:::
