# 平面のジョルダン曲線と多角形のシェーンフリースの定理 {#mfd:page-polygonal-schoenflies keywords="Jordan curve, arc, theta lemma, convex body, cone extension, polygon, diagonal, Schoenflies theorem for polygons"}

ここから三つのページで、位相多様体の側の結果として、2 次元の位相多様体（曲面）がつねに三角形分割できること（**ラドーの三角形分割定理**）を証明する。道具は平面のジョルダン曲線の理論である。\ref{at:jordan-curve}は、平面の単純閉曲線が平面を内側と外側の二つに分けることを言うが、内側が円板と同相であること（**シェーンフリースの定理**）までは言わない。このページでは、その準備として、ジョルダン曲線の内側を弧で二つに分ける補題（θ 補題）を示し、曲線が**多角形**（有限個の線分の和）の場合にシェーンフリースの定理を証明する。一般の場合は次のページで扱う。

## 記法と定義の確認 {#mfd:sec-pg2-notation}

::: notation
- \ref{at:jordan-curve}：平面の単純閉曲線 $C$ について、$\mathbb{R}^{2}\setminus C$ はちょうど 2 つの連結成分をもち、一方は有界、他方は非有界で、どちらの境界も $C$。それぞれを $\operatorname{int}C$、$\operatorname{ext}C$ と書く。これらは開集合で弧状連結（\ref{at:jordan-brouwer}）。
- ホモロジーの道具：埋め込まれた円板の補集合（\ref{at:complement-disk}）、マイヤー–ヴィートリス完全列（\ref{at:mayer-vietoris}、被約版）、$H_{0}$ と弧状連結成分（\ref{at:singular-h0-point}）。$\mathbb{R}^{2}$ は立体射影で $S^{2}\setminus\{N\}$ と同一視する。
- 位相の道具：コンパクト空間からハウスドルフ空間への連続な全単射は同相写像（\ref{top:compact-to-hausdorff}）、有限個の閉集合での貼り合わせ（\ref{top:pasting-lemma}）。
- $\overline{X}$ は閉包、$X^{\circ}$ は内部。$B(p,r)$ は開円板。線分 $[a,b]=\{a+t(b-a):0\le t\le1\}$ の端点を除いた部分を $(a,b)$ と書く。
- 手元の資料にこの部分を扱う本がないため、証明はすべてここで書き下ろした。多角形を対角線で分けて帰納法を使う方針と、θ 補題をマイヤー–ヴィートリス完全列で示す方針は標準的なものである。
:::

## 弧とジョルダン曲線 {#mfd:sec-pg2-arcs}

::: definition 弧とジョルダン曲線 {#mfd:arc-jordan-curve keywords="arc: homeomorphic image of [0,1]; Jordan curve: homeomorphic image of S^1; endpoints and interior of an arc; polygonal arc, polygon" index="弧|こ, ジョルダン曲線|じょるだんきょくせん, 単純閉曲線|たんじゅんへいきょくせん, 多角形（ジョルダン曲線）|たかくけいじょるだんきょくせん, 折れ線の弧|おれせんのこ"}
1. 位相空間の部分集合で $[0,1]$ と同相なものを**弧**という。同相写像による $0,1$ の像を**端点**、それ以外の点の全体を弧の**内部**といい $A^{\circ}$ と書く（位相的な内部とは別の記号の約束）。$S^{1}$ と同相な部分集合を**ジョルダン曲線**（単純閉曲線）という。
2. 平面の弧（ジョルダン曲線）で有限個の線分の和であるものを**折れ線の弧**（**多角形**）という。多角形 $P$ の**頂点**とは、$P$ のどの近傍でも $P$ が一本の線分にならない点である（有限個）。頂点で $P$ を区切ると有限個の線分（**辺**）に分かれ、各頂点はちょうど二つの辺の端点で、異なる辺は共通の頂点でだけ交わる。
:::

::: intuition
弧は端のある一本の曲がった線、ジョルダン曲線は自分と交わらない輪である。多角形は、まっすぐな辺をつないだ輪である。
:::

ジョルダン曲線 $J$ の異なる 2 点 $a,b$ は、$J$ を $a,b$ を端点とする二つの弧に分ける（$S^{1}$ の 2 点が円周を二つの弧に分けることを同相写像で移す）。

::: lemma 弧は平面を分けない {#mfd:arc-nonseparating keywords="the complement of an arc in the plane or in S^2 is connected" index="弧の補集合|このほしゅうごう"}
$A\subset S^{2}$ が弧なら $S^{2}\setminus A$ は空でなく弧状連結で、すべての $i$ で $\tilde H_{i}(S^{2}\setminus A)=0$。
:::

::: proof
$[0,1]$ は $D^{1}$ と同相なので、\ref{at:complement-disk}（$k=1$, $n=2$）から被約ホモロジーはすべて $0$。$A\neq S^{2}$（$S^{2}$ はどの点を除いても連結だが、弧は端点でない一点を除くと連結でないので同相でない）なので空でなく、$\tilde H_{0}=0$ から弧状連結成分はただ一つ（\ref{at:singular-h0-point}）。
:::

::: lemma θ 補題 {#mfd:theta-lemma keywords="theta lemma: an arc inside a Jordan curve joining two of its points splits the interior into exactly two components bounded by the two new Jordan curves" index="θ 補題|しーたほだい, シータ補題|しーたほだい"}
$J$ を平面のジョルダン曲線、$U\defeq\operatorname{int}J$ とする。弧 $P$ の端点 $a\neq b$ が $J$ 上にあり、$P^{\circ}\subset U$ とする。$J$ を $a,b$ で分けた二つの弧を $J_{1},J_{2}$ とし、$C_{i}\defeq J_{i}\cup P$（ジョルダン曲線）とおく。このとき
1. $\operatorname{int}C_{1}$, $\operatorname{int}C_{2}$ は $U\setminus P$ に含まれ、交わらない。
2. $U\setminus P=\operatorname{int}C_{1}\sqcup\operatorname{int}C_{2}$。
3. $\overline{U}=\overline{\operatorname{int}C_{1}}\cup\overline{\operatorname{int}C_{2}}$ で、$\overline{\operatorname{int}C_{1}}\cap\overline{\operatorname{int}C_{2}}=P$。
:::

::: intuition
輪の内側に、輪の 2 点を結ぶ線を引くと、内側はちょうど二つの部分に分かれ、それぞれは新しくできた二つの輪の内側になる。
:::

::: proof
$C_{i}$ がジョルダン曲線であることは、$J_{i}\cap P=\{a,b\}$（$P^{\circ}\subset U$ は $J$ と交わらない）から、二つの弧を端点で貼り合わせたものが $S^{1}$ と同相であることによる。

**Step 1（内側の位置）.** 【主張：$\operatorname{ext}J\subset\operatorname{ext}C_{i}$、$J_{3-i}^{\circ}\subset\operatorname{ext}C_{i}$、$\operatorname{int}C_{i}\subset U\setminus P$】$C_{i}\subset J\cup P\subset J\cup U$ なので、連結な非有界集合 $\operatorname{ext}J$ は $C_{i}$ と交わらず、$\mathbb{R}^{2}\setminus C_{i}$ の一つの成分に含まれる。有界な $\operatorname{int}C_{i}$ には含まれないので $\operatorname{ext}J\subset\operatorname{ext}C_{i}$。$J_{3-i}^{\circ}$ の各点は $\operatorname{ext}J$ の閉包の点（$J$ は $\operatorname{ext}J$ の境界）で、$C_{i}$ に属さないので、$\overline{\operatorname{ext}C_{i}}\setminus C_{i}=\operatorname{ext}C_{i}$ に入る。したがって $\operatorname{int}C_{i}$ は $\operatorname{ext}J$, $J_{3-i}^{\circ}$, $C_{i}$ と交わらず、$\mathbb{R}^{2}=U\sqcup J\sqcup\operatorname{ext}J$ から $\operatorname{int}C_{i}\subset U\setminus P$。

**Step 2（交わらない）.** 【主張：$\operatorname{int}C_{1}\cap\operatorname{int}C_{2}=\varnothing$】交わるとする。$\operatorname{int}C_{2}$ は連結で、$C_{1}=J_{1}\cup P$ と交わらない（Step 1 から $J_{1}^{\circ}\subset\operatorname{ext}C_{2}$、$P\subset C_{2}$）ので、$\operatorname{int}C_{1}$ と交わることから $\operatorname{int}C_{2}\subset\operatorname{int}C_{1}$。すると $C_{2}=\partial\operatorname{int}C_{2}\subset\overline{\operatorname{int}C_{1}}=\operatorname{int}C_{1}\cup C_{1}$ で、とくに $J_{2}^{\circ}\subset\operatorname{int}C_{1}$。これは Step 1 の $J_{2}^{\circ}\subset\operatorname{ext}C_{1}$ に反する。

**Step 3（成分の数）.** 【主張：$S^{2}\setminus(J\cup P)$ の連結成分はちょうど 3 つ】$S^{2}$ の開集合 $A\defeq S^{2}\setminus C_{1}$, $B\defeq S^{2}\setminus C_{2}$ について $A\cup B=S^{2}\setminus P$, $A\cap B=S^{2}\setminus(J\cup P)$（$C_{1}\cap C_{2}=P$、$C_{1}\cup C_{2}=J\cup P$）。被約版のマイヤー–ヴィートリス完全列（\ref{at:mayer-vietoris}）
$$
\tilde H_{1}(A\cup B)\to\tilde H_{0}(A\cap B)\to\tilde H_{0}(A)\oplus\tilde H_{0}(B)\to\tilde H_{0}(A\cup B)
$$
で、両端は \ref{mfd:arc-nonseparating} から $0$、$\tilde H_{0}(A)\cong\tilde H_{0}(B)\cong\mathbb{Z}$（ジョルダン–ブラウワー、\ref{at:jordan-brouwer}）。よって $\tilde H_{0}(A\cap B)\cong\mathbb{Z}^{2}$ で、弧状連結成分はちょうど 3 つ（\ref{at:singular-h0-point}）。$A\cap B$ は $S^{2}$ の開集合なので、弧状連結成分と連結成分は一致する。

**Step 4（2 と 3）.** 【主張：3 つの成分は $\operatorname{ext}J\cup\{N\}$, $\operatorname{int}C_{1}$, $\operatorname{int}C_{2}$】この三つは互いに交わらず（Step 1・2）、連結で（$\operatorname{ext}J\cup\{N\}$ は連結集合 $\operatorname{ext}J$ とその閉包の点 $N$ の和）、$S^{2}\setminus(J\cup P)$ の中で開かつ閉（開：$S^{2}$ の開集合。閉：$\operatorname{int}C_{i}$ の閉包は $\operatorname{int}C_{i}\cup C_{i}$ で、$C_{i}\subset J\cup P$）。開かつ閉な連結集合は連結成分なので、Step 3 からこれで全部。よって $U\setminus P=\operatorname{int}C_{1}\sqcup\operatorname{int}C_{2}$。3：$\overline{\operatorname{int}C_{i}}=\operatorname{int}C_{i}\cup C_{i}$ と 2 から和は $U\cup J\cup P=\overline{U}$、共通部分は $C_{1}\cap C_{2}=P$。

::: hypcheck
- **$P^{\circ}\subset U$**：Step 1 で $C_{i}\cap\operatorname{ext}J=\varnothing$ に使った。
- **$P$ が弧（端点以外で自分と交わらない）**：$C_{i}$ がジョルダン曲線であることと、Step 3 で $S^{2}\setminus P$ の被約ホモロジーが $0$ であることに使った。
:::
:::

## 凸体 {#mfd:sec-pg2-convex}

::: lemma 凸体の錐構造 {#mfd:convex-body keywords="compact convex sets with interior points: rays from an interior point meet the boundary once, the boundary is a Jordan curve, and boundary homeomorphisms extend by coning" index="凸体|とつたい, 錐による延長|すいによるえんちょう"}
$K,K'\subset\mathbb{R}^{2}$ をコンパクト凸集合で内点 $c\in K^{\circ}$, $c'\in K'^{\circ}$ をもつもの（**凸体**）とし、$\partial K$ を位相的な境界とする。
1. 各単位ベクトル $u$ について、半直線 $\{c+tu:t\ge0\}$ は $\partial K$ とちょうど一点 $c+\rho(u)u$（$\rho(u)>0$）で交わり、$0\le t<\rho(u)$ の点は $K^{\circ}$ に、$t>\rho(u)$ の点は $K$ の外にある。
2. $\pi\colon\partial K\to S^{1}$, $y\mapsto(y-c)/|y-c|$ は同相写像。とくに $\partial K$ はジョルダン曲線で、$K^{\circ}=\operatorname{int}\partial K$, $K=\overline{\operatorname{int}\partial K}$。
3. 任意の同相写像 $g\colon\partial K\to\partial K'$ は、同相写像 $G\colon K\to K'$ で $G(c)=c'$ となるものに延びる（$K=K'$ で $g=\mathrm{id}$ なら、$K$ の内点 $c$ を内点 $c'$ に移し境界を動かさない同相写像が得られる）。
:::

::: proof
**1.** $\{t\ge0:c+tu\in K\}$ は凸でコンパクト、$0$ を含むので区間 $[0,\rho]$（$K$ は有界なので $\rho<\infty$、$B(c,r)\subset K$ から $\rho\ge r>0$）。$0\le t<\rho$ なら、$K$ は $B(c,r)$ と点 $q\defeq c+\rho u$ を含み凸なので、$s\defeq t/\rho<1$ について $(1-s)B(c,r)+sq=B(c+tu,(1-s)r)\subset K$。よって $c+tu\in K^{\circ}$。$t>\rho$ なら $c+tu\notin K$。$q\in K$ は $K$ の外の点の極限なので $q\in\partial K$。

**2.** 1 から $\pi$ は全単射で連続。$\partial K$ は閉集合 $K$ の閉部分集合なのでコンパクトで、\ref{top:compact-to-hausdorff} から同相写像。$\mathbb{R}^{2}\setminus\partial K=K^{\circ}\sqcup(\mathbb{R}^{2}\setminus K)$ で、$K^{\circ}$ は有界で凸（凸集合の内部は凸）なので連結、$\mathbb{R}^{2}\setminus K$ は 1 により「$c$ からの半直線の $\rho$ より先の部分」の和で、$K$ を含む大きな円の外側とつながるので連結。よってこれが二つの成分で、有界な方が $K^{\circ}$。

**3.** $q\colon\partial K\times[0,1]\to K$, $q(y,t)\defeq c+t(y-c)$ は 1 から全射で、$q(y,t)=q(y',t')$ となるのは $(y,t)=(y',t')$ または $t=t'=0$ のときだけ。$q$ は連続で、定義域はコンパクト、値域はハウスドルフなので閉写像、したがって商写像で、$\partial K\times\{0\}$ を一点に潰す。$G(c+t(y-c))\defeq c'+t(g(y)-c')$ と定めると（$t=0$ から $G(c)=c'$）、$G\circ q=q'\circ(g\times\mathrm{id})$ は連続なので $G$ は連続（\ref{top:quotient-universal}）。同じ式の逆向きが逆写像を与えるので全単射で、\ref{top:compact-to-hausdorff} から同相写像。
:::

## 多角形の場合のシェーンフリースの定理 {#mfd:sec-pg2-polygons}

::: lemma 多角形の対角線 {#mfd:polygon-diagonal keywords="every polygon with at least four vertices has a diagonal: a segment between two non-adjacent vertices whose interior lies in the interior of the polygon" index="対角線（多角形）|たいかくせんたかくけい"}
頂点が 4 つ以上の多角形 $P$ には、隣り合わない二つの頂点 $a,b$ で、線分の内部 $(a,b)$ が $\operatorname{int}P$ に含まれるもの（**対角線**）がある。
:::

::: proof
**Step 1（端の頂点）.** 【主張：第 1 座標が最小、その中で第 2 座標が最小の頂点 $v$ と、その隣の頂点 $u,w$ について、角 $\angle uvw$ は $\pi$ より小さく、$v$ の小さい近傍の中で、この角の内側の扇形は $\operatorname{int}P$ に含まれる】$P$ は半平面 $\{x\ge v_{1}\}$ に含まれ、直線 $x=v_{1}$ の上の $P$ の点は $v$ より上にある。半直線 $vu$, $vw$ はこの閉半平面に入り、一致せず（辺は頂点でしか交わらない）、向きが反対でもない（反対なら一方が下向きの鉛直方向か、左向きになる）ので、角は $0$ と $\pi$ の間。$r>0$ を、$v$ を含まない辺と $v$ の距離より小さくとると、$P\cap B(v,r)$ は $v$ から出る二本の半径で、$B(v,r)$ からそれを除くと二つの扇形 $S_{\mathrm{in}}$（角の内側）と $S_{\mathrm{out}}$ に分かれる。$S_{\mathrm{out}}$ は点 $v-(r/2,0)$ を含み、そこから左へ伸ばした半直線は $P$ と交わらず有界でないので、$S_{\mathrm{out}}\subset\operatorname{ext}P$。$v\in\partial(\operatorname{int}P)$（\ref{at:jordan-curve}）なので $\operatorname{int}P$ は $B(v,r)$ と交わり、交わるのは $S_{\mathrm{in}}$ だけ。$S_{\mathrm{in}}$ は連結で $P$ と交わらないので $S_{\mathrm{in}}\subset\operatorname{int}P$。

**Step 2（三角形の中に頂点がない場合）.** 【主張：閉三角形 $T\defeq\operatorname{conv}\{u,v,w\}$ が $u,v,w$ 以外の頂点を含まなければ、$[u,w]$ は対角線】$u,w$ は隣り合わない（隣り合えば $P$ は三角形）。$[u,v]$, $[v,w]$ 以外の辺 $e$ が $T$ と交わらないことを示す。$e$ が $u$ を端点にもつ場合、もう一方の端点は $T$ の外にあり、$e$ が $T^{\circ}$ に入ると、$T$ から出るときに $\partial T$ を横切るが、$[u,v]$, $[v,w]$ は横切れず（辺は頂点でしか交わらない）、$u$ を通る直線 $uw$ に戻ることもできない。$e$ が $[u,w]$ に沿うなら $w$ を含んでしまう。よって $e\cap T=\{u\}$。$w$ についても同様。$e$ が $u,v,w$ を端点にもたないとき、$e\cap T$ が空でなければ、それは両端が $\partial T$ にある線分で、両端は $[u,w]$ の上にある（$[u,v]$, $[v,w]$ には乗れない）ので $e\cap T\subset[u,w]$。$e$ が直線 $uw$ に沿うなら、$e$ の端点は $T$ の外なので $e\supset[u,w]$ となり $u$ を含むことになって矛盾。直線 $uw$ を一点 $s\in(u,w)$ で横切るなら、$s$ の近くで $v$ の側の $e$ の点は $T^{\circ}$ に入り矛盾。$s\in\{u,w\}$ は $e$ が $u,w$ を含まないので起こらない。以上から $P\cap T=[u,v]\cup[v,w]$。$T^{\circ}$ は連結で $P$ と交わらず、$S_{\mathrm{in}}$ と交わるので $T^{\circ}\subset\operatorname{int}P$。$(u,w)$ の各点は $P$ と交わらない小円板をもち、それは $T^{\circ}$ と交わるので、その点も $\operatorname{int}P$ に入る。

**Step 3（三角形の中に頂点がある場合）.** 【主張：$T$ が $u,v,w$ 以外の頂点を含むなら、その中で直線 $uw$ から最も遠い頂点 $x$ について $[v,x]$ は対角線】$h$ を、直線 $uw$ 上で $0$、$v$ で $1$ となるアフィン関数とし、$x$ を $T\setminus\{u,v,w\}$ の頂点で $h$ を最大にするものとする（$T\cap\{h=1\}=\{v\}$ なので $h(x)<1$）。$T'\defeq T\cap\{h\ge h(x)\}$ は $v$ を頂点とする三角形で、その内部には頂点がない。$P$ が $T'^{\circ}$ と交わらないことを示す：辺 $e$ が $T'^{\circ}$ と交わるなら、$e$ の端点は $T'^{\circ}$ にないので、$e\cap T'$ の両端は $\partial T'$ にある。$[u,v]$, $[v,w]$ の上には乗れない（$v$ を端点とする辺はこの二つだけ）ので、両端は底辺 $T\cap\{h=h(x)\}$ にあり、$e$ は直線 $h=h(x)$ に沿うことになって $T'^{\circ}$ と交わらない。矛盾。$x$ は底辺の内部の点（底辺の両端は辺 $[u,v]$, $[v,w]$ の内部の点で、頂点ではない）なので $(v,x)\subset T'^{\circ}$。$T'^{\circ}$ は連結で $P$ と交わらず $S_{\mathrm{in}}$ と交わるので $\operatorname{int}P$ に含まれる。$x$ は $v$ の隣の頂点 $u,w$ ではない。
:::

::: theorem 多角形のシェーンフリースの定理 {#mfd:polygonal-schoenflies keywords="Schoenflies theorem for polygons: the closed interior of a polygon is homeomorphic to a disk, and every homeomorphism from the polygon to the boundary of a convex body extends" index="多角形のシェーンフリースの定理|たかくけいのしぇーんふりーすのていり"}
$P$ を多角形、$K$ を凸体とする。任意の同相写像 $\phi\colon P\to\partial K$ は、同相写像 $\Phi\colon\overline{\operatorname{int}P}\to K$ に延びる。とくに $\overline{\operatorname{int}P}$ は閉円板と同相で、$P$ はその境界円に対応する。
:::

::: intuition
まっすぐな辺でできた輪の内側は、輪も含めて、ゆがんだ円板と同じ形をしている。しかも、輪の上で円周への対応を勝手に決めても、内側の対応がそれに合わせて作れる。
:::

::: proof
頂点の数 $n$ についての帰納法。\ref{mfd:convex-body.3} から、$K$ を閉単位円板 $D$ に取り替えてよい（$D\to K$ の同相写像で $\partial D$ を $\partial K$ に移すものを合成する）。

**Step 1（三角形）.** 【主張：$n=3$ なら成り立つ】$P$ を三角形の周、$T$ を閉三角形とする。$T$ は凸体で $\partial T=P$、\ref{mfd:convex-body.2} から $\overline{\operatorname{int}P}=T$。\ref{mfd:convex-body.3} を $g=\phi$ に使えばよい。

**Step 2（分割）.** 【主張：$n\ge4$ なら、多角形 $C_{1},C_{2}$（頂点は $n$ 個より少ない）で、$\overline{\operatorname{int}P}=\overline{\operatorname{int}C_{1}}\cup\overline{\operatorname{int}C_{2}}$、共通部分は線分 $d$ となるものがある】\ref{mfd:polygon-diagonal} の対角線 $d=[a,b]$ をとり、$P$ を $a,b$ で分けた折れ線の弧を $P_{1},P_{2}$ とする。$a,b$ は隣り合わないので、どちらの弧も内部に頂点を含む。$C_{i}\defeq P_{i}\cup d$ は多角形で、頂点は $P_{i}$ の頂点（$a,b$ を含む）の一部なので $n$ 個より少ない。\ref{mfd:theta-lemma.3} から主張が従う。

**Step 3（行き先の分割）.** 【主張：$D$ を弦 $e\defeq[\phi(a),\phi(b)]$ で二つの凸体 $K_{1},K_{2}$ に分け、$\phi(P_{i})\subset\partial K_{i}$ とできる】$\phi(a)\neq\phi(b)$ は単位円周上の点で、弦の内部は開円板に含まれる。弦を含む直線の両側の閉半平面と $D$ の共通部分を $K_{1},K_{2}$ とすると、それぞれ内点をもつ凸体で、境界は弦と円周の一方の弧。$\phi(P_{i})$ は $\phi(a),\phi(b)$ を端点とする円周の弧（連結で、$\phi$ は単射）なので、番号を付け替えて $\partial K_{i}=\phi(P_{i})\cup e$ とできる。

**Step 4（貼り合わせ）.** 【主張：帰納法の仮定から $\Phi$ が作れる】$\ell\colon d\to e$ を $a\mapsto\phi(a)$, $b\mapsto\phi(b)$ となる線形な同相写像とし、$\phi_{i}\defeq\phi\restriction P_{i}\cup\ell\colon C_{i}\to\partial K_{i}$ とする（二つの閉集合の上で連続で、$\{a,b\}$ で一致するので連続、全単射なので同相）。帰納法の仮定から同相写像 $\Phi_{i}\colon\overline{\operatorname{int}C_{i}}\to K_{i}$ で $\phi_{i}$ の延長であるものがある。$\Phi\defeq\Phi_{1}\cup\Phi_{2}$ は、二つの閉集合の共通部分 $d$ の上で $\ell$ として一致するので連続（\ref{top:pasting-lemma}）。像は $K_{1}\cup K_{2}=D$。$\Phi_{1}$, $\Phi_{2}$ はそれぞれ単射で、定義域の共通部分 $d$ を値域の共通部分 $e$ に移すので $\Phi$ は単射。\ref{top:compact-to-hausdorff} から同相写像。

::: hypcheck
- **多角形であること**：Step 2 で対角線の存在に使った。一般のジョルダン曲線では「内側に入る弦」が直接とれないので、次のページで別の議論を使う。
- **$K$ が凸体であること**：Step 1 の錐による延長と、Step 3 で弦による分割の両側がまた凸体であることに使った（ここで円板に取り替えたのは、弦の内部が開円板に入ることを保証するため）。
:::
:::

::: supplement
**一般の場合.** 次のページで、多角形に限らない任意のジョルダン曲線について同じ結論（**シェーンフリースの定理**）を示す。そこでは、内側を細かい多角形の網で埋め、それぞれの多角形に本ページの定理を使って極限をとる。

**高次元.** 3 次元以上では、埋め込まれた球面の内側が球体と同相とは限らない（アレクサンダーの角付き球面）ことが知られている（\see{at:jordan-brouwer} の hypcheck）。多角形（多面体）に相当する「局所平坦」な球面については、内側が球体と同相であることが知られている（一般化されたシェーンフリースの定理、ブラウン、1960 年）。
:::

## 問題 {#mfd:sec-pg2-problems}

::: problem {#mfd:prob-pg2-triangulate-polygon}
多角形 $P$ の内側の閉包 $\overline{\operatorname{int}P}$ は、互いの内部が交わらない有限個の閉三角形の和で、どの二つの共通部分も空か共通の頂点か共通の辺であるもの（三角形分割）に分けられることを示せ。
:::

::: solution
頂点の数 $n$ についての帰納法。$n=3$ なら $P$ の閉三角形一つ。$n\ge4$ なら対角線 $d$（\ref{mfd:polygon-diagonal}）で二つの多角形 $C_{1},C_{2}$ に分け（頂点は $n$ 個より少ない）、帰納法の仮定から $\overline{\operatorname{int}C_{i}}$ の三角形分割をとる。二つを合わせると、\ref{mfd:theta-lemma.3} から和は $\overline{\operatorname{int}P}$ で、異なる側の三角形は $d$ の上でだけ交わる。ただし $d$ の上で両側の三角形の辺の分点がずれることがあるので、ずれた分点を両側の三角形の辺に頂点として加え、その頂点から対辺へ線分を引いて三角形を分け直す（有限回）と、共通部分の条件が満たされる。
:::
