# 球面のシェーンフリースの定理と弧の馴らし {#mfd:page-tame-arcs keywords="Schoenflies theorem on the sphere, extension to the whole plane, accessibility, homogeneity of the plane, branched double cover z^2, every arc in the plane is tame"}

前のページのシェーンフリースの定理は、ジョルダン曲線の**内側**が円板と同相であることを言う。曲面の三角形分割（ラドーの定理）では、曲面の座標近傍の中に描かれた曲線を扱うので、次の二つが必要になる。

- 内側と外側の両方を合わせて、平面**全体**の同相写像を作れること。
- 曲線が閉じていない**弧**でも、平面全体の同相写像でまっすぐな線分に移せること（**弧の馴らし**）。

このページではこの二つを示す。前者は、外側を一次分数変換で内側に移して前のページの定理を使う。後者には、平方写像 $z\mapsto z^{2}$ で弧を「開いて」ジョルダン曲線にする方法を使う。

## 記法と定義の確認 {#mfd:sec-ta-notation}

::: notation
- 弧・ジョルダン曲線・$\operatorname{int}J$, $\operatorname{ext}J$・凸体と錐による延長は \ref{mfd:page-polygonal-schoenflies}。前のページの \ref{mfd:schoenflies}。
- $\mathbb{R}^{2}=\C$ と同一視する。$\widehat{\C}\defeq\C\cup\{\infty\}$ はリーマン球面で、$S^{2}$ と同相（\ref{cx:riemann-sphere}）。$\infty$ の近傍の基本系は $\{|z|>R\}\cup\{\infty\}$。$\widehat{\C}$ の同相写像として、一次分数変換（\ref{cx:mobius-basic}）を使う。相異なる 3 点を相異なる 3 点に移す一次分数変換がある（\ref{cx:mobius-three-points}）。
- \ref{at:jordan-brouwer}：ジョルダン曲線 $J\subset\widehat{\C}$ について、$\widehat{\C}\setminus J$ はちょうど二つの連結成分をもち、それぞれ開集合で、境界は $J$。弧 $A\subset\widehat{\C}$ について $\widehat{\C}\setminus A$ は連結（\ref{mfd:arc-nonseparating}）。
- $\mathbb{D}\defeq\{|z|<1\}$、$\overline{\mathbb{D}}$ は閉円板、$\mathbb{H}\defeq\{\operatorname{Im}z>0\}$ は上半平面。$\widehat{\mathbb{R}}\defeq\mathbb{R}\cup\{\infty\}\subset\widehat{\C}$、$\overline{\mathbb{H}}\defeq\mathbb{H}\cup\widehat{\mathbb{R}}$（$\widehat{\C}$ での閉包）。$\widehat{\C}$ で $-\infty\defeq\infty$、$\sqrt{\infty}\defeq\infty$ と約束する。
- $p(s)\defeq e^{2\pi is}$ と \ref{at:lifting-lemma}。\ref{cx:open-mapping}。商写像の普遍性（\ref{top:quotient-universal}）、\ref{top:pasting-lemma}、コンパクトからハウスドルフへの連続な全単射は同相（\ref{top:compact-to-hausdorff}）。
- 手元の資料にこの部分を扱う本がないため、証明はすべてここで書き下ろした。とくに弧の馴らしの証明（平方写像による二重被覆を使う方法）は、このサイトの道具に合わせて組み立てたもので、文献の証明と同じかどうかは確かめていない。
:::

## 球面と平面全体のシェーンフリースの定理 {#mfd:sec-ta-schoenflies}

::: theorem 球面のシェーンフリースの定理 {#mfd:sphere-schoenflies keywords="Schoenflies theorem on the Riemann sphere: the closure of each complementary component of a Jordan curve is a closed disk, with any prescribed boundary homeomorphism" index="球面のシェーンフリースの定理|きゅうめんのしぇーんふりーすのていり"}
$J\subset\widehat{\C}$ をジョルダン曲線、$D$ を $\widehat{\C}\setminus J$ の連結成分の一つ、$K$ を凸体とする。任意の同相写像 $\phi\colon J\to\partial K$ は、同相写像 $\Phi\colon D\cup J\to K$ に延び、$\Phi(D)=K^{\circ}$ となる。
:::

::: intuition
球面の上では内側と外側の区別がない。輪で球面を二つに分けると、どちらの側も、輪を込めて円板と同じ形をしている。
:::

::: proof
$D'$ を $\widehat{\C}\setminus J$ のもう一つの成分とする。

**Step 1（無限遠点を反対側へ）.** 【主張：一次分数変換 $T$ で、$T(J)\subset\C$ かつ $T(D)=\operatorname{int}T(J)$ となるものがある】$D'$ は空でない開集合なので、点 $q\in D'\setminus\{\infty\}$ がとれる。$T(z)\defeq1/(z-q)$ は $\widehat{\C}$ の同相写像で $T(q)=\infty$（\ref{cx:mobius-basic.2}）。$q\notin J$ なので $T(J)$ は $\C$ のジョルダン曲線。$D$ の閉包は $D\cup J$（$D$ の境界は $J$）で $q$ を含まないので、$T(D)$ の閉包 $T(D)\cup T(J)$ は $\infty$ を含まない $\widehat{\C}$ のコンパクト集合、つまり $\C$ の有界閉集合。$T(D)$ は連結で $T(J)$ と交わらず、$\C\setminus T(J)$ の中で開（$\C$ の開集合）かつ閉（閉包との差は $T(J)$ の点だけ）なので、$\C\setminus T(J)$ の連結成分の一つで、有界なので $\operatorname{int}T(J)$（\ref{at:jordan-curve}）。

**Step 2（延長）.** 【主張：$\Phi$ が作れる】\ref{mfd:schoenflies} を $T(J)$ と同相写像 $\phi\circ T^{-1}\colon T(J)\to\partial K$ に使うと、同相写像 $\Phi_{0}\colon T(J)\cup\operatorname{int}T(J)\to K$ で $\Phi_{0}(\operatorname{int}T(J))=K^{\circ}$ となる延長がある。$\Phi\defeq\Phi_{0}\circ T\restriction(D\cup J)$ は Step 1 から $D\cup J$ を $K$ に同相に移し、$J$ の上で $\phi$、$\Phi(D)=K^{\circ}$。

::: hypcheck
- **$J$ がジョルダン曲線**：Step 1 で $D$ の境界が $J$ であること（\ref{at:jordan-brouwer}）と、Step 2 で \ref{mfd:schoenflies} に使った。
- **$K$ が凸体**：\ref{mfd:schoenflies} の仮定としてだけ使った。
:::
:::

::: theorem 平面全体への延長 {#mfd:plane-schoenflies keywords="Schoenflies theorem for the whole plane: every homeomorphism of a Jordan curve onto the boundary of a convex body extends to a homeomorphism of the plane" index="平面のシェーンフリースの定理|へいめんのしぇーんふりーすのていり"}
$J\subset\mathbb{R}^{2}$ をジョルダン曲線、$K$ を凸体とする。任意の同相写像 $\phi\colon J\to\partial K$ は $\mathbb{R}^{2}$ の同相写像 $H$ に延び、$H(\operatorname{int}J)=K^{\circ}$、$H(\operatorname{ext}J)=\mathbb{R}^{2}\setminus K$ となる。
:::

::: intuition
平面に描いた輪は、平面全体をうまくゆがめると、ちょうど円周に重ねられる。しかも輪の各点を円周のどこへ送るかは自由に決めてよい。
:::

::: proof
**Step 1（円板に取り替える）.** 【主張：$K=\overline{\mathbb{D}}$ の場合に示せばよい】$c\in K^{\circ}$ をとり、\ref{mfd:convex-body.1} の $\rho\colon S^{1}\to(0,\infty)$ を使う。\ref{mfd:convex-body.2} の同相写像 $\pi$ について $\rho(u)=|\pi^{-1}(u)-c|$ なので $\rho$ は連続で、$S^{1}$ はコンパクトなので $0<m\le\rho\le M$ となる定数がある。$R(0)\defeq c$、$R(z)\defeq c+\rho(z/|z|)\,z$（$z\neq0$）と定めると、$R$ は $z\neq0$ で連続、$|R(z)-c|\le M|z|$ から $0$ でも連続。逆写像 $w\mapsto(w-c)/\rho\bigl((w-c)/|w-c|\bigr)$（$w=c$ では $0$）も同様に連続なので、$R$ は $\mathbb{R}^{2}$ の同相写像。\ref{mfd:convex-body.1} から、$R$ は $S^{1}$ を $\partial K$ に、$\mathbb{D}$ を $K^{\circ}$ に、$\{|z|>1\}$ を $\mathbb{R}^{2}\setminus K$ に移す。$K=\overline{\mathbb{D}}$ の場合の結果を $R^{-1}\circ\phi$ に使って得た $H_{0}$ について、$H\defeq R\circ H_{0}$ が求めるもの。以下 $K=\overline{\mathbb{D}}$ とする。

**Step 2（内側）.** \ref{mfd:schoenflies} から、同相写像 $\Phi_{1}\colon J\cup\operatorname{int}J\to\overline{\mathbb{D}}$ で、$\phi$ の延長であり $\Phi_{1}(\operatorname{int}J)=\mathbb{D}$ となるものがある。

**Step 3（外側）.** 【主張：同相写像 $\Phi_{2}\colon J\cup D_{e}\to E$ で、$\phi$ の延長であり $\Phi_{2}(\infty)=\infty$ となるものがある。ここで $D_{e}\defeq\operatorname{ext}J\cup\{\infty\}$、$E\defeq\{|z|\ge1\}\cup\{\infty\}$】$J$ は有界なので、$R$ を大きくとると $\{|z|>R\}$ は $J$ と交わらない連結な非有界集合で、$\operatorname{ext}J$ に含まれる。よって $D_{e}=\widehat{\C}\setminus(J\cup\operatorname{int}J)$ は $\widehat{\C}$ の開集合で、連結（連結集合 $\operatorname{ext}J$ とその閉包の点 $\infty$ の和）なので、$\widehat{\C}\setminus J$ の連結成分。$\iota(z)\defeq1/z$ は $\widehat{\C}$ の同相写像（\ref{cx:mobius-basic.2}）で、$S^{1}$ を $S^{1}$ に、$E$ を $\overline{\mathbb{D}}$ に移し、$\iota\circ\iota=\mathrm{id}$。\ref{mfd:sphere-schoenflies} を $D_{e}$ と $\iota\circ\phi\colon J\to S^{1}$ に使うと、同相写像 $\Psi\colon J\cup D_{e}\to\overline{\mathbb{D}}$ で $\Psi(D_{e})=\mathbb{D}$ となるものがある。$q\defeq\Psi(\infty)\in\mathbb{D}$ とし、\ref{mfd:convex-body.3}（$K=K'=\overline{\mathbb{D}}$、内点 $q$ と $0$、$g=\mathrm{id}$）から、同相写像 $G\colon\overline{\mathbb{D}}\to\overline{\mathbb{D}}$ で $S^{1}$ の上で恒等写像、$G(q)=0$ となるものをとる。$\Phi_{2}\defeq\iota\circ G\circ\Psi$ は $J\cup D_{e}$ から $\iota(\overline{\mathbb{D}})=E$ への同相写像で、$J$ の上では $\iota\circ\mathrm{id}\circ\iota\circ\phi=\phi$、$\Phi_{2}(\infty)=\iota(0)=\infty$。

**Step 4（貼り合わせ）.** 【主張：$\Phi_{1}$ と $\Phi_{2}$ を合わせた $\widetilde H\colon\widehat{\C}\to\widehat{\C}$ は同相写像で、$\widetilde H(\infty)=\infty$】$J\cup\operatorname{int}J$ と $J\cup D_{e}$ は $\widehat{\C}$ の閉集合（補集合はそれぞれ開集合 $D_{e}$, $\operatorname{int}J$）で、和は $\widehat{\C}$、共通部分 $J$ の上で $\Phi_{1}=\Phi_{2}=\phi$。よって $\widetilde H$ は連続（\ref{top:pasting-lemma}）。$\Phi_{1}$ は $\operatorname{int}J$ を $\mathbb{D}$ に、$\Phi_{2}$ は $D_{e}$ を $E\setminus S^{1}$ に、どちらも $J$ を $S^{1}$ に全単射に移し、$\mathbb{D}$, $S^{1}$, $E\setminus S^{1}$ は $\widehat{\C}$ を分割するので、$\widetilde H$ は全単射。\ref{top:compact-to-hausdorff} から同相写像。$\widetilde H(\infty)=\infty$ なので、$H\defeq\widetilde H\restriction\mathbb{R}^{2}$ は $\mathbb{R}^{2}$ の同相写像で、$H(\operatorname{int}J)=\mathbb{D}$、$H(\operatorname{ext}J)=\{|z|>1\}$。

::: hypcheck
- **$J\subset\mathbb{R}^{2}$（有界）**：Step 3 で $\infty$ が外側の成分に入ることに使った。
- **中心の付け替え**：Step 3 で $G$ を挟まないと、$\Phi_{2}(\infty)$ が有限の点になり、平面の同相写像にならない。
:::
:::

::: corollary ジョルダン曲線の点への到達 {#mfd:jordan-access keywords="every point of a Jordan curve is accessible from both sides by short arcs; any two points of a Jordan curve are joined by an arc through the interior (a crosscut)" index="到達可能性（ジョルダン曲線）|とうたつかのうせいじょるだんきょくせん, 横断弧|おうだんこ"}
$J\subset\mathbb{R}^{2}$ をジョルダン曲線とする。
1. $p\in J$ と $p$ の任意の近傍 $W$ について、弧 $L\subset W$ で、$p$ を端点の一つとし $L\setminus\{p\}\subset\operatorname{int}J$ となるものがある。$\operatorname{ext}J$ についても同じ。
2. $J$ の相異なる 2 点 $a,b$ について、$a,b$ を端点とする弧 $L$ で $L^{\circ}\subset\operatorname{int}J$ となるもの（**横断弧**）がある。$\operatorname{ext}J$ についても同じ。
:::

::: proof
\ref{mfd:plane-schoenflies} を $K=\overline{\mathbb{D}}$ と同相写像 $\phi\colon J\to S^{1}$ に使い、$H$ をとる。
1. $u\defeq H(p)\in S^{1}$。$H(W)$ は $u$ の近傍なので、$\varepsilon\in(0,1)$ を小さくとると線分 $\{(1-s)u:0\le s\le\varepsilon\}$ と $\{(1+s)u:0\le s\le\varepsilon\}$ は $H(W)$ に入る。前者は $u$ 以外で $\mathbb{D}$ に、後者は $u$ 以外で $\{|z|>1\}$ に入るので、$H^{-1}$ による像が求める弧。
2. 内側：線分 $[H(a),H(b)]$ は端点以外で $\mathbb{D}$ に入る（\ref{mfd:convex-body.1}）ので、$H^{-1}([H(a),H(b)])$ が求める弧。外側：$H(a)=e^{i\theta_{1}}$, $H(b)=e^{i\theta_{2}}$ とし、$\{2e^{i\theta}:\theta\text{ は }\theta_{1}\text{ と }\theta_{2}\text{ の間}\}$ と線分 $[e^{i\theta_{k}},2e^{i\theta_{k}}]$（$k=1,2$）をつないだ弧は端点以外で $\{|z|>1\}$ に入るので、その $H^{-1}$ による像。
:::

## 平面の均質性 {#mfd:sec-ta-homogeneity}

::: lemma 平面の均質性 {#mfd:homogeneity keywords="homogeneity: any two points of a connected open set of the plane are exchanged by a homeomorphism of the plane supported in a compact subset of that set" index="平面の均質性|へいめんのきんしつせい"}
$\Omega\subset\mathbb{R}^{2}$ を連結な開集合、$p,q\in\Omega$ とする。$\mathbb{R}^{2}$ の同相写像 $g$ で、$g(p)=q$ であり、$\Omega$ のあるコンパクト部分集合の外で恒等写像となるものがある。
:::

::: proof
$p\sim q$ を「そのような $g$ がある」で定める。

**Step 1（同値関係）.** 【主張：$\sim$ は同値関係】$g=\mathrm{id}$ から反射的。$g$ が条件を満たせば $g^{-1}$ も同じコンパクト集合の外で恒等写像なので対称的。$g_{1}$（コンパクト集合 $S_{1}$ の外で恒等写像）と $g_{2}$（$S_{2}$ の外で恒等写像）について、$g_{2}\circ g_{1}$ はコンパクト集合 $S_{1}\cup S_{2}\subset\Omega$ の外で恒等写像なので推移的。

**Step 2（円板の中での移動）.** 【主張：閉円板 $B\subset\Omega$ の内部の 2 点は $\sim$ で同値】$B$ の内部の 2 点 $p',q'$ について、\ref{mfd:convex-body.3}（$K=K'=B$、内点 $p'$ と $q'$、$g=\mathrm{id}_{\partial B}$）から、同相写像 $G\colon B\to B$ で $\partial B$ の上で恒等写像、$G(p')=q'$ となるものがある。$B$ の外では恒等写像として延ばすと、閉集合 $B$ と $\mathbb{R}^{2}\setminus B^{\circ}$ の共通部分 $\partial B$ の上で一致するので連続（\ref{top:pasting-lemma}）で、逆写像も同様に作れるので $\mathbb{R}^{2}$ の同相写像。$B$ の外で恒等写像。

**Step 3（連結性）.** 【主張：$\Omega$ の 2 点はすべて同値】各同値類 $Q$ は開集合：$x\in Q$ の近くに閉円板 $B\subset\Omega$ で $x$ を内部に含むものがあり、Step 2 から $B^{\circ}\subset Q$。$\Omega$ は互いに交わらない開集合である同値類の和で、連結なので、同値類はただ一つ。
:::

## 弧の馴らし {#mfd:sec-ta-arcs}

弧 $A\subset\widehat{\C}$ の端点を一次分数変換で $0$ と $\infty$ に移しておく。平方写像 $\pi(z)\defeq z^{2}$（$\pi(\infty)\defeq\infty$）は $\widehat{\C}$ の連続写像で、$0$, $\infty$ 以外の点はちょうど二つの逆像 $\pm z$ をもつ。$A$ の逆像 $\pi^{-1}(A)$ は、$A$ を「行って、符号を変えて戻る」閉じた曲線になる。次の補題はこれを確かめ、$\widehat{\C}\setminus A$ が $\pi^{-1}(A)$ の片側と同相であることを示す。$\sigma(z)\defeq-z$（$\sigma(\infty)\defeq\infty$）とおくと $\pi\circ\sigma=\pi$。

::: lemma 平方写像による二重被覆 {#mfd:arc-double-cover keywords="for an arc A from 0 to infinity, the preimage under z^2 is a Jordan curve; each complementary component maps homeomorphically onto the complement of A" index="平方写像による二重被覆|へいほうしゃぞうによるにじゅうひふく"}
$A\subset\widehat{\C}$ を端点が $0$ と $\infty$ の弧、$\alpha\colon[0,1]\to A$ を同相写像で $\alpha(0)=0$, $\alpha(1)=\infty$ とするもの、$\Omega\defeq\widehat{\C}\setminus A$ とする。
1. 連続写像 $\beta\colon(0,1)\to\C\setminus\{0\}$ で $\beta(t)^{2}=\alpha(t)$ となるものがある。
2. $\widetilde J\defeq\pi^{-1}(A)$ はジョルダン曲線で、$\gamma\colon[0,2]\to\widehat{\C}$、$\gamma(0)=\gamma(2)=0$、$\gamma(t)=\beta(t)$（$0<t<1$）、$\gamma(1)=\infty$、$\gamma(t)=-\beta(2-t)$（$1<t<2$）は連続で、$[0,2)$ の上で単射、像は $\widetilde J$。
3. $\widehat{\C}\setminus\widetilde J$ の二つの連結成分 $D_{1}$, $D_{2}$ について $\sigma(D_{1})=D_{2}$ で、$\pi\restriction D_{1}\colon D_{1}\to\Omega$ は同相写像。
:::

::: intuition
$\sqrt{z}$ のリーマン面の作り方と同じで、弧に沿って球面を切り開き、二枚を貼り合わせる。切り口の弧は、上から見ると「行きと帰り」の二本の縁になり、それがつながって一つの輪になる。輪の片側は、切り開いた球面の一枚と同じ形をしている。
:::

::: proof
**Step 1（平方根の連続な選択）.** 【主張：1 が成り立つ】$n\ge3$ について $I_{n}\defeq[1/n,1-1/n]$ とし、$\alpha$ は $I_{n}$ の上で $0$ でも $\infty$ でもない（$\alpha$ は単射）ので、$u(t)\defeq\alpha(t)/|\alpha(t)|\in S^{1}$ は $(0,1)$ で連続。$I_{n}$ は点 $1/2$ について星形でコンパクトなので、\ref{at:lifting-lemma} から連続写像 $\theta_{n}\colon I_{n}\to\mathbb{R}$ で $p\circ\theta_{n}=u$, $\theta_{n}(1/2)=s_{0}$ となるものがただ一つある（$s_{0}$ は $p(s_{0})=u(1/2)$ となる実数を一つ固定しておく）。一意性から $\theta_{n+1}\restriction I_{n}=\theta_{n}$ なので、これらは $(0,1)$ 上の連続写像 $\theta$ を定める。$\beta(t)\defeq|\alpha(t)|^{1/2}\,p(\theta(t)/2)$ とおくと、$\beta(t)^{2}=|\alpha(t)|\,p(\theta(t))=\alpha(t)$。

**Step 2（逆像の記述）.** 【主張：$\widetilde J=\{0,\infty\}\cup\beta((0,1))\cup(-\beta((0,1)))$ で、$\gamma$ は 2 の性質をもつ】$z\in\widetilde J$ とする。$z^{2}=0$ なら $z=0$、$z^{2}=\infty$ なら $z=\infty$。それ以外では $z^{2}=\alpha(t)$（$0<t<1$）で、$z^{2}=\beta(t)^{2}$ から $z=\pm\beta(t)$。逆の包含は $\pi(\pm\beta(t))=\alpha(t)$ から。連続性：$t\to0$ で $|\beta(t)|=|\alpha(t)|^{1/2}\to0$、$t\to1$ で $\alpha(t)\to\infty$ なので $|\beta(t)|\to\infty$（$\widehat{\C}$ での収束）。単射性：$\beta(s)=\beta(t)$ なら平方して $\alpha(s)=\alpha(t)$ で $s=t$。$\beta(s)=-\beta(t)$ なら同様に $s=t$ で、$\beta(t)=0$ となり矛盾。$0,\infty$ は $\pm\beta$ の値にならない。よって $\gamma$ は $[0,2)$ で単射。$\gamma$ は $[0,2]$ で $0$ と $2$ を同一視した円周からの連続な単射を与え、コンパクトからハウスドルフへの写像なので像の上への同相写像（\ref{top:compact-to-hausdorff}）。よって $\widetilde J$ はジョルダン曲線。

**Step 3（成分の入れ替え）.** 【主張：$\sigma(D_{1})=D_{2}$】$\widetilde J=\pi^{-1}(A)$ なので $\pi^{-1}(\Omega)=\widehat{\C}\setminus\widetilde J=D_{1}\sqcup D_{2}$。$0,\infty\in\widetilde J$ なので $D_{1},D_{2}\subset\C\setminus\{0\}$。$\Omega$ の点 $w$ は $\C\setminus\{0\}$ に平方根 $z$ をもち、$z,-z\in\pi^{-1}(\Omega)$。$\sigma$ は $\widehat{\C}$ の同相写像で $\sigma(\widetilde J)=\widetilde J$ なので、$\widehat{\C}\setminus\widetilde J$ の連結成分を連結成分に移す。$\sigma(D_{1})=D_{1}$（したがって $\sigma(D_{2})=D_{2}$）と仮定する。$w\in\pi(D_{1})\cap\pi(D_{2})$ なら $w=z_{1}^{2}=z_{2}^{2}$（$z_{i}\in D_{i}$）で $z_{2}=\pm z_{1}$ だが、$z_{2}=z_{1}$ は $D_{1}\cap D_{2}=\varnothing$ に、$z_{2}=-z_{1}=\sigma(z_{1})\in D_{1}$ も同じことに反する。よって $\Omega=\pi(D_{1})\sqcup\pi(D_{2})$（各 $w$ の平方根 $z$ は $D_{1}$ か $D_{2}$ にある）。$\pi$ は $\C$ 上の定数でない正則関数なので、$\pi(D_{i})$ は開集合（\ref{cx:open-mapping}）。$D_{i}$ は空でないので、$\Omega$ が二つの交わらない空でない開集合に分かれ、$\Omega$ の連結性（\ref{mfd:arc-nonseparating}）に反する。よって $\sigma(D_{1})\neq D_{1}$ で、$\sigma(D_{1})=D_{2}$。

**Step 4（同相）.** 【主張：$\pi\restriction D_{1}\colon D_{1}\to\Omega$ は同相写像】全射：$w\in\Omega$ の平方根 $z$ と $-z=\sigma(z)$ の一方は $D_{1}$ にある（Step 3 から、$z$ と $\sigma(z)$ は異なる成分にある）。単射：$z,z'\in D_{1}$ で $z^{2}=z'^{2}$ なら $z'=\pm z$ で、$-z\in D_{2}$ なので $z'=z$。$\pi$ は連続で、Step 3 と同じく開写像なので、逆写像も連続。

::: hypcheck
- **$A$ が弧（単射の像）**：Step 2 で $\gamma$ の単射性に、Step 3 で $\Omega$ の連結性（\ref{mfd:arc-nonseparating}）に使った。
- **端点が $0$ と $\infty$**：$\pi$ の分岐点（逆像が一つの点）がちょうど弧の端点になることを使っている。端点がほかの点なら、$\pi^{-1}(A)$ は二つの交わらない弧になる。
:::
:::

::: theorem 弧の馴らし {#mfd:tame-arc keywords="every arc in the sphere or the plane is tame: a homeomorphism of the plane carries it onto a straight segment, with any prescribed parametrization" index="弧の馴らし|このならし, 馴らされた弧|ならされたこ" refname="弧の馴らし"}
1. $A\subset\widehat{\C}$ を弧、$\alpha\colon[0,1]\to A$ を同相写像とする。$\widehat{\C}$ の同相写像 $h$ で、$h(\alpha(t))=\tau(t)$（$t\in[0,1]$）となるものがある。ここで $\tau(t)\defeq t/(1-t)$（$t<1$）、$\tau(1)\defeq\infty$。とくに $h(A)=[0,\infty]\defeq[0,\infty)\cup\{\infty\}$。
2. $A\subset\mathbb{R}^{2}$ を弧、$\alpha\colon[0,1]\to A$ を同相写像とする。$\mathbb{R}^{2}$ の同相写像 $H$ で、$H(\alpha(t))=(2t-1,0)$（$t\in[0,1]$）となるものがある。
:::

::: intuition
平面に描いた弧は、どんなに激しく曲がりくねっていても、平面全体をゆがめれば一本のまっすぐな線分になる。しかも弧の上の各点を線分のどこへ送るかも自由に決められる。
:::

::: proof
**Step 1（端点の正規化）.** 【主張：1 は $\alpha(0)=0$, $\alpha(1)=\infty$ の場合に示せばよい】\ref{cx:mobius-three-points} から、一次分数変換 $T$ で $T(\alpha(0))=0$, $T(\alpha(1))=\infty$ となるものがある（3 点目は $\alpha(0),\alpha(1)$ と異なる任意の点と $1$）。$T\circ\alpha$ に対する $h_{0}$ について $h\defeq h_{0}\circ T$ が求めるもの。以下 $\alpha(0)=0$, $\alpha(1)=\infty$ とし、\ref{mfd:arc-double-cover} の $\beta$, $\gamma$, $\widetilde J$, $D_{1}$, $\Omega$ を使う。

**Step 2（境界の対応）.** 【主張：同相写像 $\phi\colon\widetilde J\to\widehat{\mathbb{R}}$ で、$\phi(-z)=-\phi(z)$ かつ $\phi(\beta(t))=\sqrt{\tau(t)}$（$0<t<1$）となるものがある】$f\colon[0,2]\to\widehat{\mathbb{R}}$ を $f(t)\defeq\sqrt{\tau(t)}$（$0\le t\le1$）、$f(t)\defeq-\sqrt{\tau(2-t)}$（$1\le t\le2$）と定める。$t=1$ ではどちらも $\infty$ で、$f$ は連続、$f(0)=f(2)=0$、$[0,2)$ の上で単射で像は $\widehat{\mathbb{R}}$（$[0,1]$ で $[0,\infty]$ を、$[1,2)$ で $[-\infty,0)$ を動く）。\ref{mfd:arc-double-cover.2} の $\gamma$ と同様に、$\phi\defeq f\circ\gamma^{-1}$ は円周 $[0,2]/(0\sim2)$ を経由する連続な全単射 $\widetilde J\to\widehat{\mathbb{R}}$ で、\ref{top:compact-to-hausdorff} から同相写像。$-\gamma(t)=\gamma(2-t)$（$0<t<1$）で $f(2-t)=-f(t)$、$0,\infty$ では $-0=0$, $-\infty=\infty$ なので、$\phi(-z)=-\phi(z)$。

**Step 3（片側の円板化）.** 【主張：同相写像 $\Phi\colon D_{1}\cup\widetilde J\to\overline{\mathbb{H}}$ で、$\widetilde J$ の上で $\phi$ に一致し、$\Phi(D_{1})=\mathbb{H}$ となるものがある】$\kappa(z)\defeq i(1+z)/(1-z)$ は一次分数変換で、$z=e^{i\theta}$（$\theta\neq0$）なら $\kappa(z)=-\cot(\theta/2)\in\mathbb{R}$、$\kappa(1)=\infty$ なので $\kappa(S^{1})\subset\widehat{\mathbb{R}}$。逆写像も一次分数変換で、同様に $\kappa^{-1}(\widehat{\mathbb{R}})\subset S^{1}$ なので $\kappa(S^{1})=\widehat{\mathbb{R}}$。$\kappa(\mathbb{D})$ は連結で $\widehat{\mathbb{R}}$ と交わらず $\kappa(0)=i$ を含むので $\mathbb{H}$ に含まれ、同様に $\kappa(\widehat{\C}\setminus\overline{\mathbb{D}})$ は $\kappa(\infty)=-i$ を含むので下半平面に含まれる。$\kappa$ は全単射なので $\kappa(\mathbb{D})=\mathbb{H}$、$\kappa(\overline{\mathbb{D}})=\overline{\mathbb{H}}$。\ref{mfd:sphere-schoenflies} を $D_{1}$ と $\kappa^{-1}\circ\phi\colon\widetilde J\to S^{1}$ に使って得た $\Phi_{0}$ について、$\Phi\defeq\kappa\circ\Phi_{0}$。

**Step 4（平方写像の性質）.** 【主張：$s(w)\defeq w^{2}$（$s(\infty)=\infty$）は $\overline{\mathbb{H}}$ を $\widehat{\C}$ の上に写し、$x\neq y$ が $\overline{\mathbb{H}}$ の点で $s(x)=s(y)$ となるのは、$x\in\mathbb{R}\setminus\{0\}$, $y=-x$ のときだけ】全射：$w=re^{i\psi}$（$r>0$, $0\le\psi<2\pi$）の平方根 $\sqrt{r}e^{i\psi/2}$ は偏角が $[0,\pi)$ にあり $\overline{\mathbb{H}}$ に入る。$0,\infty$ は自分自身の像。$s(x)=s(y)$, $x\neq y$ なら $y=-x$, $x\neq0,\infty$ で、$x,-x\in\overline{\mathbb{H}}$ から $\operatorname{Im}x\ge0$ かつ $-\operatorname{Im}x\ge0$、つまり $x\in\mathbb{R}$。

**Step 5（球面の同相写像）.** 【主張：$h(\pi(z))\defeq s(\Phi(z))$（$z\in D_{1}\cup\widetilde J$）は $\widehat{\C}$ の同相写像 $h$ を定め、$h\circ\alpha=\tau$】$\pi$ は $D_{1}\cup\widetilde J$ を $\widehat{\C}$ の上に写す（$D_{1}$ を $\Omega$ に（\ref{mfd:arc-double-cover.3}）、$\widetilde J$ を $A$ に）。
- *矛盾なく定まる*：$z\neq z'$ が $D_{1}\cup\widetilde J$ の点で $\pi(z)=\pi(z')$ なら $z'=-z$。$z\in D_{1}$ なら $-z\in D_{2}$（\ref{mfd:arc-double-cover.3}）は $D_{1}\cup\widetilde J$ にないので、$z,z'\in\widetilde J$。Step 2 から $\Phi(z')=\phi(-z)=-\phi(z)$ なので $s(\Phi(z'))=s(\Phi(z))$。
- *連続*：$\pi\restriction(D_{1}\cup\widetilde J)$ はコンパクト空間（$\widehat{\C}$ の閉集合）からハウスドルフ空間への連続な全射なので閉写像、したがって商写像。$h\circ\pi=s\circ\Phi$ は連続なので、$h$ は連続（\ref{top:quotient-universal}）。
- *単射*：$s(\Phi(z))=s(\Phi(z'))$ で $\Phi(z)\neq\Phi(z')$ なら、Step 4 から $\Phi(z)\in\mathbb{R}\setminus\{0\}$, $\Phi(z')=-\Phi(z)$。$\Phi$ は $\widetilde J$ だけを $\widehat{\mathbb{R}}$ に写すので $z,z'\in\widetilde J$ で、$\phi(z')=-\phi(z)=\phi(-z)$ から $z'=-z$、よって $\pi(z)=\pi(z')$。
- *全射*：Step 3・4 から $s\circ\Phi$ は全射。

\ref{top:compact-to-hausdorff} から $h$ は同相写像。$0<t<1$ なら $h(\alpha(t))=h(\pi(\beta(t)))=s(\sqrt{\tau(t)})=\tau(t)$、$t=0,1$ では $h(0)=s(\phi(0))=0$, $h(\infty)=\infty$。

**Step 6（平面の場合）.** 【主張：2 が成り立つ】$\infty\notin A$ なので、1 の $h$ について $q\defeq h(\infty)\notin h(A)=[0,\infty]$、つまり $q\in\Omega'\defeq\C\setminus[0,\infty)$。$\Omega'$ は開集合で、$-1$ について星形（$z\in\Omega'$ と $-1$ を結ぶ線分は、$\operatorname{Im}z\neq0$ なら $-1$ 以外で虚部が $0$ でなく、$\operatorname{Im}z=0$ なら負の実軸の上にある）なので連結。\ref{mfd:homogeneity} から、$\C$ の同相写像 $g$ で $g(q)=-1$、$\Omega'$ のコンパクト部分集合 $S$ の外で恒等写像となるものがある。$g(\infty)\defeq\infty$ とすると、$g$ は $\infty$ の近傍 $\widehat{\C}\setminus S$ で恒等写像なので $\widehat{\C}$ の同相写像で、$[0,\infty]$ の各点を動かさない。$M(z)\defeq(z-1)/(z+1)$ は一次分数変換で $M(-1)=\infty$、$M(\tau(t))=2t-1$（$\tau(t)+1=1/(1-t)$, $\tau(t)-1=(2t-1)/(1-t)$。$t=1$ では $M(\infty)=1$）。$\widetilde H\defeq M\circ g\circ h$ は $\widehat{\C}$ の同相写像で、$\widetilde H(\infty)=M(g(q))=M(-1)=\infty$、$\widetilde H(\alpha(t))=M(\tau(t))=2t-1$。$H\defeq\widetilde H\restriction\mathbb{R}^{2}$ が求めるもの。

::: hypcheck
- **$A$ が弧**：\ref{mfd:arc-double-cover} を通して使った。単射でない曲線の像は一般に線分と同相でないので、この仮定は結論の意味のために必要である。証明の中では、$\widetilde J$ がジョルダン曲線になることと $\Omega$ の連結性に効いている。
- **境界の対応の対称性 $\phi(-z)=-\phi(z)$**：Step 5 で $h$ が矛盾なく定まることに本質的に使った。シェーンフリースの定理で境界の対応を自由に選べることが、ここで効いている。
- **$\infty\notin A$（2 の場合）**：Step 6 で $q\neq$ 弧の点であることに使った。
:::
:::

::: corollary 弧の帰結 {#mfd:arc-consequences keywords="every arc in the plane lies on a Jordan curve; every point of an arc is accessible from the complement by a short arc" index="到達可能性（弧）|とうたつかのうせいこ"}
$A\subset\mathbb{R}^{2}$ を弧とする。
1. $A$ は、あるジョルダン曲線の部分弧である。
2. $p\in A$ と $p$ の任意の近傍 $W$ について、弧 $L\subset W$ で、$p$ を端点の一つとし $L\cap A=\{p\}$ となるものがある。
:::

::: proof
\ref{mfd:tame-arc.2} の $H$ をとる（$H(A)=[-1,1]\times\{0\}$）。
1. $Q\defeq[-1,1]\times[0,1]$ の境界 $\partial Q$ はジョルダン曲線（\ref{mfd:convex-body.2}）で $[-1,1]\times\{0\}$ を含むので、$H^{-1}(\partial Q)$ が求める曲線。
2. $H(p)=(x_{0},0)$ とし、$\varepsilon>0$ を線分 $\{x_{0}\}\times[0,\varepsilon]$ が $H(W)$ に入るようにとる。この線分と $[-1,1]\times\{0\}$ の共通部分は $\{(x_{0},0)\}$ なので、$L\defeq H^{-1}(\{x_{0}\}\times[0,\varepsilon])$ が求める弧。
:::

::: supplement
**高い視点：分岐被覆と商空間.** 証明の骨格は、$\pi\colon\widehat{\C}\to\widehat{\C}$, $z\mapsto z^{2}$ が $0,\infty$ で分岐する二重の分岐被覆で、$\widehat{\C}$ が $\sigma$ による商空間 $\widehat{\C}/\{\pm1\}$ と同一視できることにある。$D_{1}\cup\widetilde J$ は $\sigma$ の作用の「基本領域」で、$\widehat{\C}$ はこの閉円板の境界の点 $z$ と $-z$ を貼り合わせたものである。同じ貼り合わせを標準的な円板 $\overline{\mathbb{H}}$ の上で行うと、標準的な弧 $[0,\infty]$ をもつ $\widehat{\C}$ になる。シェーンフリースの定理は二つの基本領域を同相に対応させ、それが商空間の同相写像 $h$ を誘導する（商の普遍性）。比喩で言えば、弧を「ファスナー」とみて開くと輪になり、輪ならシェーンフリースの定理で標準形に直せるので、直してからファスナーを閉じ直す、という議論である。

**前提を変えると.** 3 次元では、$\mathbb{R}^{3}$ の弧で、$\mathbb{R}^{3}$ のどんな同相写像でも線分に移せないもの（野性的な弧）がある（フォックスとアルティン、1948 年）。したがって、このページの結論は 2 次元に特有である。2 次元でも、弧を「閉集合」や「連結集合」に弱めると結論は成り立たない（たとえば円周は線分に移せない）。

**似た定理.** このページの結果と θ 補題（\ref{mfd:theta-lemma}）を組み合わせると、平面の有限グラフ（有限個の弧を端点で貼り合わせたもの）も、平面の同相写像で折れ線のグラフに移せることが示せる。次のページでこれを示し、ラドーの定理の局所的な部分に使う。
:::

## 問題 {#mfd:sec-ta-problems}

::: problem {#mfd:prob-ta-complement-disk}
弧 $A\subset\widehat{\C}$ について、$\widehat{\C}\setminus A$ は開円板 $\mathbb{D}$ と同相であることを示せ。
:::

::: solution
一次分数変換で端点を $0,\infty$ に移してよい（\ref{cx:mobius-three-points}）。\ref{mfd:arc-double-cover.3} から $\widehat{\C}\setminus A$ は $D_{1}$ と同相で、\ref{mfd:sphere-schoenflies}（$K=\overline{\mathbb{D}}$）の $\Phi$ は $D_{1}$ を $\mathbb{D}$ に同相に移す。
:::

::: problem {#mfd:prob-ta-two-arcs}
平面の弧 $A,A'$ と同相写像 $g\colon A\to A'$ について、$\mathbb{R}^{2}$ の同相写像で $A$ の上で $g$ に一致するものがあることを示せ。
:::

::: solution
同相写像 $\alpha\colon[0,1]\to A$ をとり、$\alpha'\defeq g\circ\alpha\colon[0,1]\to A'$ とする。\ref{mfd:tame-arc.2} の $H$（$\alpha$ に対するもの）と $H'$（$\alpha'$ に対するもの）について、$H'^{-1}\circ H$ は $\alpha(t)$ を $H'^{-1}((2t-1,0))=\alpha'(t)=g(\alpha(t))$ に移す。
:::
