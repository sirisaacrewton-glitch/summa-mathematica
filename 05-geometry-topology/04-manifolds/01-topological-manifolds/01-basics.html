# 位相多様体の定義と基本性質 {#mfd:page-topological-manifold-basics keywords="locally Euclidean space, chart, topological manifold, Hausdorff, second countable, invariance of dimension, local compactness, local path connectedness, components, second countable iff paracompact iff sigma-compact iff metrizable for connected manifolds, line with two origins, long line, embedding compact manifolds"}

このページでは、多様体論の出発点として**位相多様体**を定義し、その基本的な性質を調べる。位相多様体は「各点のまわりが $\mathbb{R}^{n}$ と同相な空間」に、ハウスドルフ性と第二可算性という二つの大域的な条件を課したものである。可微分多様体（\ref{mfd:page-smooth-manifolds}）は、位相多様体に座標変換の滑らかさという追加の構造を与えたものとして定義する。

中心となる結果は、連結な「広義の多様体」（ハウスドルフで局所ユークリッドな空間）について、第二可算性・σ コンパクト性・パラコンパクト性・距離化可能性がすべて同値であること（\ref{mfd:second-countable-equivalents}）である。多様体の定義に第二可算性を課すかパラコンパクト性を課すかは本によって違うが、連結成分ごとに見れば同じことになる。

## 記法と定義の確認 {#mfd:sec-tmb-notation}

::: notation
- 位相の言葉：ハウスドルフ空間（\ref{top:hausdorff}）、第二可算（\ref{top:second-countable}）、局所コンパクト（\ref{top:locally-compact}）、パラコンパクト（\ref{top:paracompact}）、距離化可能（\ref{top:metrizable}）。空間 $X$ が **σ コンパクト**とは、可算個のコンパクト集合の和であることをいう。
- 使う定理：局所コンパクトでσ コンパクトなハウスドルフ空間はパラコンパクト（\ref{top:sigma-compact-paracompact}）、正則で第二可算な空間は距離化可能（\ref{top:urysohn-metrization}）、距離空間はパラコンパクト（\ref{top:stone-paracompact}）、第二可算な空間はリンデレーフ（\ref{top:second-countable-properties}）。
- 次元の不変性（\ref{at:invariance-of-dimension}）：$\mathbb{R}^{m}$ と $\mathbb{R}^{n}$ の空でない開集合が同相なら $m=n$。
- $B(a,r)$ は開球、$\overline{B}(a,r)$ は閉球。位相空間 $X$ から $Y$ への**埋め込み**とは、$X$ からその像（部分空間）への同相写像のことである。
- 手元の資料にこの部分を扱う本がないため、証明はここで書き下ろした。結果はいずれも標準的なものである。
:::

## 位相多様体 {#mfd:sec-tmb-definition}

::: definition 座標近傍 {#mfd:chart keywords="locally Euclidean space, chart, coordinate system, coordinate map, coordinate functions" index="座標近傍|ざひょうきんぼう, 局所座標系|きょくしょざひょうけい, チャート|ちゃーと, 座標関数|ざひょうかんすう, 局所ユークリッド空間|きょくしょゆーくりっどくうかん"}
$M$ を位相空間、$d\ge0$ を整数とし、$r_{i}\colon\mathbb{R}^{d}\to\mathbb{R}$ を $i$ 番目の座標を取り出す関数とする。
1. $M$ の開集合 $U$ と、$U$ から $\mathbb{R}^{d}$ のある開集合 $\varphi(U)$ への同相写像 $\varphi$ の組 $(U,\varphi)$ を、$M$ の（$d$ 次元の）**座標近傍**という。$x_{i}\defeq r_{i}\circ\varphi\colon U\to\mathbb{R}$ を**座標関数**といい、$(U,\varphi)$ を $(U;x_{1},\dots,x_{d})$ とも書く。$m\in U$ で $\varphi(m)=0$ のとき、$m$ を**中心とする**座標近傍という。
2. $M$ の各点が $d$ 次元の座標近傍に含まれるとき、$M$ を **$d$ 次元の局所ユークリッド空間**という。
:::

::: intuition
座標近傍とは、空間の一部分に、平らな空間の座標を目盛りとして貼り付けたものである。局所ユークリッド空間とは、どの点のまわりにもそのような目盛りが貼れる空間である。
:::

座標近傍 $(U,\varphi)$ と $m\in U$ について、$\varphi$ に平行移動を合成し、$\varphi(m)$ を中心とする開球に制限すれば、$m$ を中心とし像が開球 $B(0,\varepsilon)$ の座標近傍が得られる。開球 $B(0,\varepsilon)$ は $\mathbb{R}^{d}$ と同相（$y\mapsto y/(\varepsilon-|y|)$）なので、局所ユークリッド空間の各点は $\mathbb{R}^{d}$ と同相な開近傍をもつ。

::: definition 位相多様体 {#mfd:topological-manifold keywords="topological manifold: Hausdorff, second countable, locally Euclidean; manifold in the wide sense without second countability" index="位相多様体|いそうたようたい, 広義の多様体|こうぎのたようたい"}
1. ハウスドルフな $d$ 次元の局所ユークリッド空間を **$d$ 次元の広義の多様体**という（\ref{at:topological-manifold} の「位相多様体」はこれにあたる）。
2. 第二可算な広義の多様体を **$d$ 次元の位相多様体**という。$M^{d}$ と書いて次元を示すこともある。
:::

::: intuition
位相多様体とは、どの点のまわりも平らな空間と同じ形をしていて、さらに「点を開集合で分けられる」「大きすぎない」という二つの大域的な条件を満たす空間である。
:::

::: example 条件を外した例 {#mfd:manifold-axiom-examples}
1. **ハウスドルフ性を外した例**：$\mathbb{R}\times\{0,1\}$ で $(t,0)\sim(t,1)$（$t\neq0$）と同一視した商空間（原点が二つある直線）は、二つの座標近傍（それぞれの原点を含む直線）で覆われる第二可算な 1 次元の局所ユークリッド空間だが、二つの原点を開集合で分離できない。
2. **第二可算性を外した例**：$\mathbb{R}$ を、離散位相の集合 $\mathbb{R}$ で添字づけて並べた $\mathbb{R}\times\mathbb{R}_{\text{離散}}$ は、1 次元の広義の多様体だが、非可算個の互いに交わらない空でない開集合 $\mathbb{R}\times\{s\}$ をもつので第二可算でない（開基 $\mathcal{B}$ があれば、各 $s$ について空でない $B_{s}\in\mathcal{B}$ で $B_{s}\subset\mathbb{R}\times\{s\}$ となるものがあり、$s\neq s'$ なら $B_{s}\neq B_{s'}$）。これは連結でない。連結だが第二可算でない広義の多様体としては、**長い直線**（第一非可算順序数 $\omega_{1}$ と $[0,1)$ の辞書式順序の直積の順序位相）が知られている（本サイトでは証明しない）。
:::

::: proposition 位相多様体の基本的な性質 {#mfd:topological-manifold-properties keywords="dimension of a topological manifold is well defined; manifolds are locally compact and locally path connected; components are open; open subsets, products, spheres are manifolds" index="位相多様体の性質|いそうたようたいのせいしつ"}
$M$ を $d$ 次元の広義の多様体とする。
1. $M\neq\varnothing$ なら、$M$ が $e$ 次元の広義の多様体でもあるとき $d=e$（**次元**は一意に定まる）。
2. $M$ は局所コンパクトで、各点は弧状連結な開近傍の基本系をもつ（局所弧状連結）。とくに、$M$ の連結成分は弧状連結成分と一致し、開集合である。
3. $M$ の開集合は $d$ 次元の広義の多様体、$d'$ 次元の広義の多様体 $M'$ との直積 $M\times M'$ は $d+d'$ 次元の広義の多様体。$M$ が位相多様体なら、開集合も、位相多様体との直積も位相多様体。
4. $\mathbb{R}^{d}$、$d$ 次元球面 $S^{d}\subset\mathbb{R}^{d+1}$ は $d$ 次元の位相多様体。
:::

::: proof
**1.** $m\in M$ を含む $d$ 次元の座標近傍 $(U,\varphi)$ と $e$ 次元の座標近傍 $(V,\psi)$ をとると、$\psi\circ\varphi^{-1}$ は $\mathbb{R}^{d}$ の空でない開集合 $\varphi(U\cap V)$ から $\mathbb{R}^{e}$ の開集合 $\psi(U\cap V)$ への同相写像なので、\ref{at:invariance-of-dimension} から $d=e$。

**2.** $m$ を中心とする座標近傍 $(U,\varphi)$ と、$\overline{B}(0,\varepsilon)\subset\varphi(U)$ となる $\varepsilon>0$ をとる。$K\defeq\varphi^{-1}(\overline{B}(0,\varepsilon))$ はコンパクト（コンパクト集合の連続像）で、$\varphi^{-1}(B(0,\varepsilon))\subset K$ は $m$ の開近傍なので、$K$ は $m$ のコンパクトな近傍。また $\varphi^{-1}(B(0,\delta))$（$0<\delta\le\varepsilon$）は弧状連結な開近傍で、$m$ の任意の近傍 $W$ について $\varphi(W\cap U)$ は $0$ の近傍なので、小さい $\delta$ で $W$ に含まれる。局所弧状連結な空間では、弧状連結成分は開集合（各点の弧状連結な開近傍を含む）で、補集合もほかの弧状連結成分の和なので開集合。よって弧状連結成分は開かつ閉な連結集合で、連結成分と一致する。

**3.** 開集合 $W$ の点 $m$ について、$m$ を含む座標近傍 $(U,\varphi)$ を $U\cap W$ に制限すれば $W$ の座標近傍。直積では $(U\times U',\varphi\times\varphi')$ が $\mathbb{R}^{d+d'}$ の開集合 $\varphi(U)\times\varphi'(U')$ への同相写像。ハウスドルフ性は部分空間と直積で保たれ（\ref{top:hausdorff-properties.1}）、第二可算性も同様（可算な開基の制限、可算な開基の直積が開基）。

**4.** $\mathbb{R}^{d}$ は恒等写像を座標近傍にもつ。$S^{d}$ は北極 $N$ と南極からの立体射影 $S^{d}\setminus\{N\}\to\mathbb{R}^{d}$ などが同相写像（\ref{top:rn-one-point}）で覆われ、$\mathbb{R}^{d+1}$ の部分空間なのでハウスドルフかつ第二可算。
:::

## 第二可算性とパラコンパクト性 {#mfd:sec-tmb-paracompact}

::: theorem 連結な多様体での同値な条件 {#mfd:second-countable-equivalents keywords="for a connected Hausdorff locally Euclidean space: second countable iff sigma-compact iff paracompact iff metrizable" index="第二可算とパラコンパクトの同値|だいにかさんとぱらこんぱくとのどうち, 多様体のパラコンパクト性|たようたいのぱらこんぱくとせい"}
連結な広義の多様体 $M$ について、次は同値である。
1. $M$ は第二可算（つまり位相多様体）。
2. $M$ は σ コンパクト。
3. $M$ はパラコンパクト。
4. $M$ は距離化可能。
連結でない場合は、1 ⇔ 2 ⇒ 3 ⇔ 4 が成り立ち、3 ⇒ 1 は「各連結成分が第二可算」に弱まる（連結成分が非可算個ありうる）。
:::

::: intuition
多様体は小さな円板を貼り合わせたものなので、「全体が大きすぎない」ことの言い方がいくつかあり、連結なら全部同じことになる。円板を可算個で覆える、可算個のコンパクト集合で覆える、うまく局所有限な覆いがとれる、距離が入る、の四つである。
:::

::: proof
**Step 1（1 ⇒ 2）.** 【主張：第二可算なら σ コンパクト】可算な開基 $\mathcal{B}$ のうち、閉包がコンパクトなものの全体 $\mathcal{B}'$ も開基である：$m$ とその開近傍 $W$ について、\ref{mfd:topological-manifold-properties.2} の証明の $K$ を $W$ の中にとると、$m\in B\subset\varphi^{-1}(B(0,\varepsilon))$ となる $B\in\mathcal{B}$ の閉包は閉集合 $K$（ハウスドルフ空間のコンパクト集合）に含まれるのでコンパクト。よって $M=\bigcup_{B\in\mathcal{B}'}\overline{B}$ は可算個のコンパクト集合の和。

**Step 2（2 ⇒ 1）.** 【主張：σ コンパクトなら第二可算】$M=\bigcup_{n}K_{n}$（$K_{n}$ はコンパクト）。各 $K_{n}$ は有限個の座標近傍の定義域で覆え、座標近傍の定義域 $U$ は $\varphi(U)\subset\mathbb{R}^{d}$ と同相なので第二可算。可算個の第二可算な開集合 $U_{j}$ で $M$ を覆い、各 $U_{j}$ の可算な開基（$U_{j}$ の開集合は $M$ の開集合）を合わせると、$M$ の可算な開基になる。

**Step 3（2 ⇒ 3）.** 局所コンパクト（\ref{mfd:topological-manifold-properties.2}）で σ コンパクトなハウスドルフ空間なので、\ref{top:sigma-compact-paracompact} からパラコンパクト。

**Step 4（3 ⇒ 2、連結な場合）.** 【主張：連結でパラコンパクトなら σ コンパクト】各点の、閉包がコンパクトな開近傍からなる開被覆の局所有限な開細分 $\mathcal{U}$ をとる。各 $V\in\mathcal{U}$ の閉包はコンパクト（コンパクト集合の閉部分集合）。コンパクト集合 $C$ は局所有限な族 $\mathcal{U}$ の有限個とだけ交わる（$C$ の各点の、有限個とだけ交わる近傍で $C$ を有限個覆う）。空でない $V_{0}\in\mathcal{U}$ をとり、$W_{0}\defeq V_{0}$、$W_{k+1}\defeq\bigcup\{V\in\mathcal{U}:V\cap\overline{W_{k}}\neq\varnothing\}$ とする。帰納法で $\overline{W_{k}}$ はコンパクト（有限個の $V$ の閉包の和）なので $W_{k+1}$ は有限個の $V$ の和で、閉包はコンパクト。$W\defeq\bigcup_{k}W_{k}$ は開集合。$m\in\overline{W}$ なら、$m$ を含む $V\in\mathcal{U}$ は $W$ と交わり、ある $W_{k}$ と交わるので $V\subset W_{k+1}\subset W$、よって $m\in W$ で $W$ は閉集合。$M$ は連結で $W\neq\varnothing$ なので $W=M=\bigcup_{k}\overline{W_{k}}$ は σ コンパクト。

**Step 5（1 ⇒ 4 と 4 ⇒ 3）.** 局所コンパクトなハウスドルフ空間は正則（点 $m$ と閉集合 $F\not\ni m$ について、$m$ のコンパクトな近傍 $K\subset M\setminus F$ をとり、$K$ の内部と $M\setminus K$ が分離する開集合）なので、第二可算なら \ref{top:urysohn-metrization} から距離化可能。距離化可能なら \ref{top:stone-paracompact} からパラコンパクト。

**Step 6（連結でない場合）.** Step 1・2・3・5 は連結性を使っていない。パラコンパクトなら、各連結成分（開集合なので閉かつ開、\ref{mfd:topological-manifold-properties.2}）はパラコンパクトな連結な広義の多様体なので、Step 4 から σ コンパクト、Step 2 から第二可算。\ref{mfd:manifold-axiom-examples.2} は、非可算個の連結成分をもつパラコンパクト（距離化可能）だが第二可算でない例。

::: hypcheck
- **ハウスドルフ性**：Step 1 でコンパクト集合が閉集合であること、Step 3・5 で引用した定理の仮定に使った。原点が二つある直線（\ref{mfd:manifold-axiom-examples.1}）は第二可算で σ コンパクトだがハウスドルフでなく、距離化可能でない。
- **連結性**：Step 4 で $W=M$ を結論するのに使った。
- **局所ユークリッド性**：局所コンパクト性（Step 1・3・5）と、座標近傍の第二可算性（Step 2）に使った。
:::
:::

## コンパクトな位相多様体の埋め込み {#mfd:sec-tmb-embedding}

::: theorem コンパクトな位相多様体の埋め込み {#mfd:compact-manifold-embedding keywords="a compact topological n-manifold covered by m charts embeds into R^{m(n+1)}" index="位相多様体の埋め込み|いそうたようたいのうめこみ"}
$M$ をコンパクトな $n$ 次元位相多様体とする。$M$ は $m$ 個の開集合 $U_{i}$ と同相写像 $h_{i}\colon U_{i}\to\mathbb{R}^{n}$ で $M=\bigcup_{i}h_{i}^{-1}(B(0,1))$ となるものをもち、このとき $M$ は $\mathbb{R}^{m(n+1)}$ に埋め込める。
:::

::: intuition
曲がった空間でも、有限個の地図で覆えるなら、各地図の座標を「その地図の中心に近いほど強く効く重み」をかけて全部並べれば、点を区別できるだけの座標がそろう。
:::

::: proof
**Step 1（座標近傍の有限個の被覆）.** 各点 $x$ は $\mathbb{R}^{n}$ と同相な開近傍 $U_{x}$ をもち、同相写像 $h_{x}\colon U_{x}\to\mathbb{R}^{n}$ に平行移動を合成して $h_{x}(x)=0$ とできる。開集合 $h_{x}^{-1}(B(0,1))$ は $M$ を覆い、$M$ はコンパクトなので有限個 $h_{1},\dots,h_{m}$ で覆える。

**Step 2（重み）.** 【主張：連続関数 $\lambda_{i}\colon M\to[0,1]$ で、$h_{i}^{-1}(\overline{B}(0,1))$ の上で $1$、$h_{i}^{-1}(B(0,2))$ の外で $0$ となるものがある】$\rho(r)\defeq\min(1,\max(0,2-r))$ とし、$U_{i}$ の上で $\lambda_{i}\defeq\rho(|h_{i}|)$、$M\setminus h_{i}^{-1}(\overline{B}(0,2))$ の上で $\lambda_{i}\defeq0$ とする。$h_{i}^{-1}(\overline{B}(0,2))$ はコンパクトなので $M$ の閉集合で、二つの開集合 $U_{i}$ と $M\setminus h_{i}^{-1}(\overline{B}(0,2))$ は $M$ を覆い、共通部分では $|h_{i}|>2$ なのでどちらの定義も $0$。よって $\lambda_{i}$ は矛盾なく定まり連続（\ref{top:pasting-lemma}）。

**Step 3（写像）.** $F\colon M\to(\mathbb{R}^{n}\times\mathbb{R})^{m}=\mathbb{R}^{m(n+1)}$ を
$$
F(x)\defeq\bigl(\lambda_{1}(x)h_{1}(x),\lambda_{1}(x),\ \dots,\ \lambda_{m}(x)h_{m}(x),\lambda_{m}(x)\bigr)
$$
と定める。ここで $\lambda_{i}h_{i}$ は $U_{i}$ の外で $0$ と定める。$\lambda_{i}h_{i}$ は $U_{i}$ の上で連続で、$M\setminus h_{i}^{-1}(\overline{B}(0,2))$ の上で $0$ なので、Step 2 と同じく連続。

**Step 4（単射）.** 【主張：$F$ は単射】$F(x)=F(y)$ とする。$x\in h_{i}^{-1}(B(0,1))$ となる $i$ をとると $\lambda_{i}(x)=1$ なので $\lambda_{i}(y)=1$、とくに $y\in h_{i}^{-1}(B(0,2))\subset U_{i}$。$\lambda_{i}(x)h_{i}(x)=\lambda_{i}(y)h_{i}(y)$ から $h_{i}(x)=h_{i}(y)$ で、$h_{i}$ は単射なので $x=y$。

**Step 5（埋め込み）.** $M$ はコンパクト、$\mathbb{R}^{m(n+1)}$ はハウスドルフなので、連続な単射 $F$ は像の上への同相写像（\ref{top:compact-to-hausdorff}）。

::: hypcheck
- **コンパクト性**：Step 1 で座標近傍を有限個にすることと、Step 5 で像への同相を得ることに使った。コンパクトでなくても、第二可算なら可算個の座標近傍で同様の構成ができ、$\mathbb{R}^{2n+1}$ への埋め込みが存在することが知られている。
- **ハウスドルフ性**：Step 2 でコンパクト集合が閉集合であることと、Step 5 に使った（値域のハウスドルフ性は自動だが、$F$ が単射になるには $M$ がハウスドルフであることが必要：ハウスドルフでない空間はユークリッド空間の部分空間と同相にならない）。
:::
:::

::: corollary コンパクトな多様体の距離化可能性 {#mfd:compact-manifold-metrizable keywords="compact topological manifolds are metrizable and second countable" index="多様体の距離化可能性|たようたいのきょりかかのうせい"}
コンパクトな位相多様体は距離化可能で、第二可算である。
:::

::: proof
\ref{mfd:compact-manifold-embedding} から $\mathbb{R}^{N}$ の部分空間と同相で、ユークリッド距離の制限が位相を定める。$\mathbb{R}^{N}$ は第二可算（有理数の中心と有理数の半径の開球が開基）で、部分空間も第二可算。
:::

::: remark
2 次元では、コンパクトな連結曲面は \ref{mfd:classification-surfaces} の $S^{2}$, $M_{g}$, $N_{h}$ のどれかと同相で、$M_{g}$ は $\mathbb{R}^{3}$ に（取っ手のついた球面として）、$N_{h}$ は $\mathbb{R}^{4}$ に埋め込めることが知られている。$N_{h}$ は $\mathbb{R}^{3}$ には埋め込めないことも知られている（本サイト未収録）。
:::

## 問題 {#mfd:sec-tmb-problems}

::: problem {#mfd:prob-tmb-countable-components}
位相多様体の連結成分は高々可算個であることを示せ。
:::

::: solution
連結成分は互いに交わらない空でない開集合（\ref{mfd:topological-manifold-properties.2}）。可算な開基 $\mathcal{B}$ について、各成分 $C$ は $\mathcal{B}$ の空でない元 $B_{C}\subset C$ を含み、成分が異なれば $B_{C}$ も異なるので、成分は高々可算個。
:::

::: problem {#mfd:prob-tmb-open-cover}
位相多様体 $M$ の任意の開被覆は可算な部分被覆をもつことを示せ。
:::

::: solution
第二可算な空間はリンデレーフ（\ref{top:second-countable-properties}）。直接には、可算な開基 $\mathcal{B}$ のうち被覆のある元に含まれるものをとり、そのそれぞれについて含む被覆の元を一つずつ選べば、可算個で $M$ を覆う。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{mfd:sec-tbx-exercises} にまとめた。
