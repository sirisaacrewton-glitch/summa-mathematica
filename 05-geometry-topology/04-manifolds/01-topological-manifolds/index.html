# 位相多様体（Topological Manifolds）

位相多様体の定義と基本性質（連結なら第二可算・パラコンパクト・距離化可能が同値、コンパクト多様体の埋め込み）、平面のジョルダン曲線とシェーンフリースの定理、弧と有限平面グラフの馴らし、ラドーの三角形分割定理、多角形の貼り合わせと閉曲面の分類定理、三角形分割と可微分構造に関する事実。

<p class="mn-msc">MSC2020: 57N05, 57K20, 57Q</p>

## 前提知識

- [一般位相 › 位相空間](../../../05-geometry-topology/01-general-topology/01-topological-spaces/index.html)（全体、5 ページ）：開基・第二可算・部分空間
- [一般位相 › 基本性質 I](../../../05-geometry-topology/01-general-topology/04-properties/index.html)（全体、9 ページ）：ハウスドルフ空間・コンパクト性・連結性・パラコンパクト性
- [一般位相 › 距離空間](../../../05-geometry-topology/01-general-topology/06-metric-spaces/index.html)（全体、12 ページ）：ウリゾーンの距離化定理・ストーンの定理
- [代数的位相幾何学 › ホモロジー論](../../../05-geometry-topology/02-algebraic-topology/02-homology/index.html)（全体、14 ページ）：ジョルダンの曲線定理・埋め込まれた円板の補集合・マイヤー–ヴィートリス完全列・単体複体
- [複素解析 › 大域的な理論](../../../04-analysis/02-complex-analysis/03-global/index.html)（全体、7 ページ）：リーマンの写像定理（シェーンフリースの定理の証明）
