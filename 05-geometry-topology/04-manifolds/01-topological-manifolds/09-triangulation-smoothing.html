# 三角形分割と可微分構造の事実 {#mfd:page-topological-manifolds keywords="topological manifolds, triangulations in higher dimensions, Hauptvermutung, existence and uniqueness of smooth structures, exotic spheres, exotic R^4"}

このページでは、ここまでの系列で 2 次元について証明した「三角形分割の存在」と「分類」が、高い次元でどうなるかを、事実としてまとめる。高い次元では、位相多様体・三角形分割（区分線形構造）・可微分構造の三つが一般には一致しない。コンパクトな位相多様体のユークリッド空間への埋め込みは \ref{mfd:compact-manifold-embedding} で示した。

## 記法と定義の確認 {#mfd:sec-tm-notation}

::: notation
- 位相多様体は \ref{at:topological-manifold}：ハウスドルフ空間で、各点が $\mathbb{R}^{n}$ と同相な開近傍（座標近傍）をもつもの。可微分多様体は \ref{mfd:smooth-manifold}。三角形分割は \ref{at:simplicial-complex}。
- 位相空間 $X$ から $Y$ への**埋め込み**とは、$X$ からその像（部分空間）への同相写像のことである。
- このページの事実（fact）は、証明を本サイトに収録していないものである。出典の年は、広く知られている文献情報に基づくが、原典では確認していない。
:::

## 高い次元の事実 {#mfd:sec-tm-facts}

::: fact 三角形分割と区分線形構造 {#mfd:triangulation-higher-facts keywords="triangulability in dimensions <= 3 (Rado, Moise), non-triangulable manifolds in dimension 4 and >= 5, failure of the Hauptvermutung" index="ハウプトフェアムートゥング|はうぷとふぇあむーとぅんぐ, 基本予想（三角形分割）|きほんよそうさんかくけいぶんかつ"}
1. 3 次元以下の位相多様体は三角形分割できる（2 次元はラドー（\ref{mfd:rado-triangulation} はコンパクトな場合）、3 次元はモイーズ、1952 年頃）。4 次元以上では三角形分割できない位相多様体がある（\ref{at:manifold-triangulation-facts}）。
2. **ハウプトフェアムートゥング（基本予想）**：同相な二つの多面体は、細分すると組合せ的に同型になるか、という問い。3 次元以下の多様体では成り立つ。一般の多面体では成り立たない（ミルナー、1961 年）。多様体についても、高い次元では成り立たない（カービー–ジーベンマン、1969 年頃）。
3. 滑らかな多様体は三角形分割でき、その三角形分割は区分線形構造として本質的に一意である（ケアンズ、ホワイトヘッド）。
:::

::: fact 可微分構造の存在と一意性 {#mfd:smooth-structure-facts keywords="smooth structures: unique in dimensions <= 3; E8 manifold has none; exotic R^4; exotic 7-spheres (Milnor), 28 oriented smooth structures on S^7 (Kervaire-Milnor)" index="エキゾチック球面|えきぞちっくきゅうめん, エキゾチックな R⁴|えきぞちっくなあーるよん, 可微分構造の一意性|かびぶんこうぞうのいちいせい"}
1. 3 次元以下の位相多様体は可微分構造をもち、それは微分同相を除いて一意である（2 次元はラドーの定理、3 次元はモイーズの定理を出発点として示されることが知られている）。
2. 4 次元では、可微分構造をもたない閉位相多様体がある（フリードマンの $E_{8}$ 多様体。ドナルドソンの定理による）。$\mathbb{R}^{4}$ には、互いに微分同相でない可微分構造が非可算個ある（タウベス）。$n\neq4$ では $\mathbb{R}^{n}$ の可微分構造は一意である。
3. 5 次元以上では、可微分構造（や区分線形構造）の存在には障害（カービー–ジーベンマン不変量など）があり、コンパクトな位相多様体の可微分構造は、存在すれば有限個である（カービー–ジーベンマン）。
4. **エキゾチック球面**：$S^{7}$ と同相だが微分同相でない可微分多様体がある（ミルナー、1956 年）。向きを込めて、$S^{7}$ と同相な可微分多様体の微分同相類はちょうど 28 個である（ケルヴェア–ミルナー、1963 年）。
:::

::: supplement
**高い視点：三つの圏.** 多様体には、位相多様体の圏 TOP、区分線形多様体の圏 PL、可微分多様体の圏 DIFF があり、忘却関手 DIFF → PL → TOP がある（滑らかな多様体の三角形分割が PL 構造を与える）。2 次元と 3 次元では、この関手はどちらも「対象の同型類の上で全単射」になる：このシリーズのラドーの定理と分類定理は、その 2 次元の部分（存在の側）を示したことにあたる。4 次元では TOP と PL（= DIFF）が大きく離れ、5 次元以上では差が障害理論（ホモトピー群の計算）で測れる、という構図が知られている。比喩で言えば、同じ「形」に対して、粘土（TOP）、折り紙（PL）、滑らかな布（DIFF）のどの素材で作れるか、作り方が何通りあるかが次元によって違う、ということである。
:::

## 問題 {#mfd:sec-tm-problems}

::: problem {#mfd:prob-tm-sphere-embedding}
立体射影による 2 枚の座標近傍を使って、\ref{mfd:compact-manifold-embedding} の証明の写像 $F$ が $S^{n}$ を $\mathbb{R}^{2(n+1)}$ に埋め込むことを確かめよ。ただし、二つの座標近傍の単位開球の逆像が $S^{n}$ を覆うように、立体射影をスケーリングしておく。
:::

::: solution
北極 $N$ と南極 $S$ からの立体射影 $\sigma_{N}\colon S^{n}\setminus\{N\}\to\mathbb{R}^{n}$, $\sigma_{S}$ は同相写像（\ref{top:rn-one-point}）。$\sigma_{N}^{-1}(B(0,1))$ は南半球の内部、$\sigma_{S}^{-1}(B(0,1))$ は北半球の内部で、赤道が覆われないので、$h_{1}\defeq\frac12\sigma_{N}$, $h_{2}\defeq\frac12\sigma_{S}$ とすると、$h_{i}^{-1}(B(0,1))=\sigma^{-1}(B(0,2))$ は赤道を含んで $S^{n}$ を覆う。$m=2$ なので、\ref{mfd:compact-manifold-embedding} から $F$ は $S^{n}$ を $\mathbb{R}^{2(n+1)}$ に埋め込む。
:::
