# 演習：位相多様体 {#mfd:page-exercises-topological keywords="exercises, Topological Manifolds"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#mfd:sec-extm-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
- $\mathbb{R}^{2}=\mathbb{C}$ と同一視する。$B(p,r)$ は開円板、$\overline{\mathbb{D}}$ は閉単位円板、$\mathbb{D}$ は開単位円板、$S^{1}=\partial\mathbb{D}$。ジョルダン曲線 $J$ の内側・外側を $\operatorname{int}J$, $\operatorname{ext}J$ と書く。
- 単体複体 $K$ について、$V$, $E$, $F$ はそれぞれ 0 単体・1 単体・2 単体の数を表すことがある（節ごとに断る）。
:::

## 位相多様体の定義と基本性質 {#mfd:sec-tbx-exercises}

対応するページ：\ref{mfd:page-topological-manifold-basics}

::: problem ★ 基本：穴のあいた空間と円柱 {#mfd:ex-tbx-1}
$n\ge1$ とする。$\mathbb{R}^{n}\setminus\{0\}$ と $S^{n-1}\times\mathbb{R}$ は同相であることを、同相写像を具体的に書いて示せ。また、両者が $n$ 次元の位相多様体であることを確かめよ。
:::

::: solution
$\Phi\colon S^{n-1}\times\mathbb{R}\to\mathbb{R}^{n}\setminus\{0\}$, $\Phi(u,t)\defeq e^{t}u$ と、$\Psi\colon\mathbb{R}^{n}\setminus\{0\}\to S^{n-1}\times\mathbb{R}$, $\Psi(x)\defeq(x/|x|,\log|x|)$ を考える。$|e^{t}u|=e^{t}>0$ なので $\Phi$ の値は $\mathbb{R}^{n}\setminus\{0\}$ にあり、$x\neq0$ なので $\Psi$ も定義される。どちらも連続関数の積・商・合成なので連続である。

$$
\Psi(\Phi(u,t))=\Bigl(\frac{e^{t}u}{e^{t}},\ \log e^{t}\Bigr)=(u,t),\qquad\Phi(\Psi(x))=e^{\log|x|}\frac{x}{|x|}=x
$$
なので、$\Phi$ と $\Psi$ は互いに逆の同相写像である。

$\mathbb{R}^{n}\setminus\{0\}$ は $\mathbb{R}^{n}$ の開集合なので、\ref{mfd:topological-manifold-properties.3} と \ref{mfd:topological-manifold-properties.4} から $n$ 次元の位相多様体である。$S^{n-1}\times\mathbb{R}$ も、$(n-1)$ 次元の位相多様体 $S^{n-1}$ と 1 次元の位相多様体 $\mathbb{R}$ の直積なので、同じ命題から $n$ 次元の位相多様体である（同相なので片方から他方も従う）。
:::

::: problem ★★ 標準：コンパクトな多様体は一枚の地図に収まらない {#mfd:ex-tbx-2}
$n\ge1$ とし、$M$ を空でないコンパクトな $n$ 次元位相多様体とする。
1. $M$ は $\mathbb{R}^{n}$ のどの開集合とも同相でないことを示せ。
2. \ref{mfd:compact-manifold-embedding} の座標近傍の個数 $m$ は $2$ 以上であることを示せ。
3. $n=0$ では 1 が成り立たない例を挙げよ。
:::

::: solution
**1.** 同相写像 $f\colon M\to V$（$V\subset\mathbb{R}^{n}$ は開集合）があるとする。$V=f(M)$ はコンパクト集合の連続像なのでコンパクトで、ハウスドルフ空間 $\mathbb{R}^{n}$ のコンパクト集合なので閉集合である（\ref{top:compact-hausdorff-closed}）。$\mathbb{R}^{n}$ は凸なので弧状連結、したがって連結である（\ref{top:path-connected-connected}）。$V$ は空でなく開かつ閉なので $V=\mathbb{R}^{n}$ となる。しかし $n\ge1$ では $\mathbb{R}^{n}$ は有界でないのでコンパクトでない（\ref{top:heine-borel}）。これは矛盾である。

**2.** $m=1$ とすると、$M=h_{1}^{-1}(B(0,1))\subset U_{1}$ なので $U_{1}=M$ で、$h_{1}\colon M\to\mathbb{R}^{n}$ は同相写像になる。これは 1（$V=\mathbb{R}^{n}$）に反する。$M\neq\varnothing$ なので $m\ge1$ であり、よって $m\ge2$。

**3.** $\mathbb{R}^{0}$ は 1 点で、それ自身の開集合である。1 点空間はコンパクトな 0 次元位相多様体で、$\mathbb{R}^{0}$ の開集合 $\mathbb{R}^{0}$ と同相である。1 の証明では「$\mathbb{R}^{n}$ はコンパクトでない」に $n\ge1$ を使った。
:::

::: problem ★★★ 発展：コンパクト集合による近似列 {#mfd:ex-tbx-3}
位相多様体 $M$ には、コンパクト集合の列 $K_{1},K_{2},\dots$ で
$$
K_{i}\subset\operatorname{int}K_{i+1}\quad(i\ge1),\qquad\bigcup_{i}K_{i}=M
$$
となるもの（$\operatorname{int}$ は $M$ での内部）があることを示せ。
:::

::: solution
$M=\varnothing$ なら $K_{i}\defeq\varnothing$ でよい。以下 $M\neq\varnothing$ とする。

**Step 1（閉包がコンパクトな開集合からなる可算な開基）.** 【主張：$M$ の可算な開基 $\mathcal{B}$ のうち、閉包がコンパクトな元の全体 $\mathcal{B}'$ も開基である】$m\in M$ とその開近傍 $W$ をとる。$m$ を中心とする座標近傍 $(U,\varphi)$ と、$\overline{B}(0,\varepsilon)\subset\varphi(U\cap W)$ となる $\varepsilon>0$ をとる。$L\defeq\varphi^{-1}(\overline{B}(0,\varepsilon))$ はコンパクト集合の連続像なのでコンパクトで、$M$ はハウスドルフなので $L$ は閉集合である（\ref{top:compact-hausdorff-closed}）。$\varphi^{-1}(B(0,\varepsilon))$ は $m$ の開近傍なので、$m\in B\subset\varphi^{-1}(B(0,\varepsilon))$ となる $B\in\mathcal{B}$ がある。$\overline{B}\subset L$ なので $\overline{B}$ はコンパクト（コンパクト集合の閉部分集合）で、$B\in\mathcal{B}'$, $B\subset W$。よって $\mathcal{B}'$ は開基で、可算である。$M\neq\varnothing$ なので $\mathcal{B}'$ の空でない元があり、（有限なら同じ元を繰り返して）$\mathcal{B}'=\{B_{1},B_{2},\dots\}$ と番号をつける。

**Step 2（列の構成）.** $N_{1}\defeq1$, $K_{1}\defeq\overline{B_{1}}$ とする。$K_{i}=\overline{B_{1}}\cup\cdots\cup\overline{B_{N_{i}}}$ まで定めたとする。$K_{i}$ は有限個のコンパクト集合の和なのでコンパクトで、開被覆 $\{B_{j}\}_{j}$（$\mathcal{B}'$ は開基なので $M$ を覆う）の有限個 $B_{j_{1}},\dots,B_{j_{s}}$ で覆える。$N_{i+1}\defeq\max(N_{i}+1,j_{1},\dots,j_{s})$ とし、$K_{i+1}\defeq\overline{B_{1}}\cup\cdots\cup\overline{B_{N_{i+1}}}$ とおく。

**Step 3（性質の確認）.** $K_{i+1}$ はコンパクトである。$K_{i}\subset B_{j_{1}}\cup\cdots\cup B_{j_{s}}\subset B_{1}\cup\cdots\cup B_{N_{i+1}}$ で、右辺は開集合で $K_{i+1}$ に含まれるので、$K_{i}\subset\operatorname{int}K_{i+1}$。また $N_{i}\ge i$（$N_{i+1}\ge N_{i}+1$）なので、各 $B_{j}$ は $K_{j}$ に含まれ、$\bigcup_{i}K_{i}\supset\bigcup_{j}B_{j}=M$。
:::

## 平面のジョルダン曲線と多角形のシェーンフリースの定理 {#mfd:sec-pgs-exercises}

対応するページ：\ref{mfd:page-polygonal-schoenflies}

::: problem ★ 基本：正方形の錐構造 {#mfd:ex-pgs-1}
$\|x\|_{\infty}\defeq\max(|x_{1}|,|x_{2}|)$ とし、正方形 $K\defeq\{x\in\mathbb{R}^{2}:\|x\|_{\infty}\le1\}$ と内点 $c=0$ について、\ref{mfd:convex-body.1} の $\rho(u)$ を求めよ。さらに
$$
G(x)\defeq\frac{\|x\|_{\infty}}{|x|}\,x\quad(x\neq0),\qquad G(0)\defeq0
$$
が $\mathbb{R}^{2}$ の同相写像で、$G(K)=\overline{\mathbb{D}}$, $G(\partial K)=S^{1}$ となることを示せ。
:::

::: solution
**$\rho(u)$.** $\|\cdot\|_{\infty}$ は連続なので $\{\|x\|_{\infty}<1\}$ は開集合で $K$ の内部に含まれる。$\|x\|_{\infty}=1$ の点 $x$ は $K$ の外の点 $(1+1/k)x$ の極限なので内点でない。よって $K^{\circ}=\{\|x\|_{\infty}<1\}$, $\partial K=\{\|x\|_{\infty}=1\}$。単位ベクトル $u$ について $\|tu\|_{\infty}=t\|u\|_{\infty}$（$t\ge0$）で、$\|u\|_{\infty}\ge1/\sqrt{2}>0$ なので、半直線 $\{tu\}$ が $\partial K$ と交わるのは $t=1/\|u\|_{\infty}$ のときだけである。よって
$$
\rho(u)=\frac{1}{\|u\|_{\infty}}=\frac{1}{\max(|u_{1}|,|u_{2}|)}
$$
で、たとえば $u=(1,0)$ では $1$、$u=(1,1)/\sqrt{2}$ では $\sqrt{2}$ である。

**$G$ が同相写像であること.** $\|x\|_{\infty}\le|x|\le\sqrt{2}\|x\|_{\infty}$ を使う。$x\neq0$ では $G$ は連続関数の積・商で連続、$|G(x)|=\|x\|_{\infty}\le|x|$ なので $x\to0$ で $G(x)\to0$ となり、$0$ でも連続。$H(y)\defeq\frac{|y|}{\|y\|_{\infty}}y$（$y\neq0$）、$H(0)\defeq0$ とおくと、同様に $x\neq0$ で連続で、$|H(y)|=|y|^{2}/\|y\|_{\infty}\le\sqrt{2}|y|$ から $0$ でも連続。$x\neq0$, $\lambda\defeq\|x\|_{\infty}/|x|>0$ について $G(x)=\lambda x$ で、正の定数倍は $|\cdot|$ と $\|\cdot\|_{\infty}$ の比を変えないので
$$
H(G(x))=\frac{|\lambda x|}{\|\lambda x\|_{\infty}}\lambda x=\frac{1}{\lambda}\lambda x=x.
$$
同様に $G(H(y))=y$。よって $G$ は同相写像で $G^{-1}=H$。

**像.** $|G(x)|=\|x\|_{\infty}$ なので、$x\in K\iff|G(x)|\le1$、$x\in\partial K\iff|G(x)|=1$。$G$ は全単射なので $G(K)=\overline{\mathbb{D}}$, $G(\partial K)=S^{1}$。$G$ は各半直線 $\{tu:t\ge0\}$ をそれ自身に $t\mapsto t\|u\|_{\infty}$ で移す、つまり \ref{mfd:convex-body.3} の「錐による延長」の具体例になっている。
:::

::: problem ★★ 標準：内側を何本もの弧で切る {#mfd:ex-pgs-2}
$J$ をジョルダン曲線、$U\defeq\operatorname{int}J$ とし、$P_{1},\dots,P_{k}$ を互いに交わらない弧で、各 $P_{i}$ の二つの端点は $J$ の上にあり、$P_{i}^{\circ}\subset U$ とする。$U\setminus(P_{1}\cup\cdots\cup P_{k})$ の連結成分はちょうど $k+1$ 個であり、そのそれぞれは、$J\cup P_{1}\cup\cdots\cup P_{k}$ に含まれるあるジョルダン曲線 $C$ の内側 $\operatorname{int}C$ であることを示せ。
:::

::: solution
$k$ についての帰納法で示す。$k=0$ なら $U=\operatorname{int}J$ は連結（\ref{at:jordan-curve}）で、主張は正しい。

$k\ge1$ とし、$X\defeq P_{1}\cup\cdots\cup P_{k-1}$ について、$U\setminus X$ の連結成分が $\operatorname{int}C_{1},\dots,\operatorname{int}C_{k}$（$C_{j}\subset J\cup X$ はジョルダン曲線）であるとする。

**Step 1（$P_{k}$ の入る成分）.** $P_{k}^{\circ}$ は開区間と同相なので連結で、$U$ に含まれ、$X$ と交わらない。よって $P_{k}^{\circ}$ はある一つの成分 $\operatorname{int}C$（$C$ は $C_{j}$ のどれか）に含まれる。

**Step 2（端点は $C$ の上にある）.** $P_{k}$ の端点 $a$ は $P_{k}^{\circ}$ の閉包に入るので $\overline{\operatorname{int}C}$ に入る。\ref{at:jordan-curve} から $\operatorname{int}C$ の境界は $C$ なので $\overline{\operatorname{int}C}=\operatorname{int}C\cup C$。一方 $a\in J$ で $\operatorname{int}C\subset U$, $U\cap J=\varnothing$ なので $a\notin\operatorname{int}C$。よって $a\in C$。もう一方の端点 $b\neq a$ も同様に $C$ の上にある。

**Step 3（θ 補題）.** $C$ を $a,b$ で分けた二つの弧を $C^{1}$, $C^{2}$ とし、$C'\defeq C^{1}\cup P_{k}$, $C''\defeq C^{2}\cup P_{k}$ とおく。\ref{mfd:theta-lemma.2} から
$$
\operatorname{int}C\setminus P_{k}=\operatorname{int}C'\sqcup\operatorname{int}C''
$$
で、$C',C''\subset J\cup X\cup P_{k}$ はジョルダン曲線である。

**Step 4（成分の数）.** $P_{k}$ は $\operatorname{int}C$ 以外の成分 $\operatorname{int}C_{j}$ と交わらない（$P_{k}^{\circ}\subset\operatorname{int}C$、端点は $J$ の上）。よって
$$
U\setminus(X\cup P_{k})=\operatorname{int}C'\sqcup\operatorname{int}C''\sqcup\bigsqcup_{C_{j}\neq C}\operatorname{int}C_{j}
$$
は $k+1$ 個の、空でなく連結で互いに交わらない開集合の和である。各集合は和集合の中で開集合で、補集合もほかの開集合の和なので閉集合でもある。連結で開かつ閉なので、これらがちょうど連結成分であり、個数は $k+1$。
:::

::: problem ★★★ 発展：折れ線で切った多角形 {#mfd:ex-pgs-3}
$Z$ を多角形、$Q$ を折れ線の弧で、端点 $a\neq b$ が $Z$ の上にあり $Q^{\circ}\subset\operatorname{int}Z$ となるものとする。同相写像 $\Phi\colon\overline{\operatorname{int}Z}\to\overline{\mathbb{D}}$ で、$\Phi(Z)=S^{1}$ かつ $\Phi(Q)=[-1,1]\times\{0\}$ となるものがあることを示せ。
:::

::: solution
$Z$ を $a,b$ で分けた弧を $J_{1},J_{2}$ とし、$C_{i}\defeq J_{i}\cup Q$ とおく。$C_{i}$ はジョルダン曲線（\ref{mfd:theta-lemma}）で、有限個の線分の和（$J_{i}$ は $Z$ の辺の有限個の部分線分の和、$Q$ は折れ線）なので多角形である。$K_{1}\defeq\overline{\mathbb{D}}\cap\{\operatorname{Im}z\ge0\}$, $K_{2}\defeq\overline{\mathbb{D}}\cap\{\operatorname{Im}z\le0\}$ は内点をもつコンパクト凸集合（凸体）で、$\partial K_{i}$ は半円周 $S_{i}$ と線分 $I\defeq[-1,1]\times\{0\}$ の和、$S_{i}\cap I=\{\pm1\}$ である。

**Step 1（境界の同相写像）.** 同相写像 $\psi\colon Q\to I$ で $\psi(a)=-1$, $\psi(b)=1$ となるもの、$\alpha_{i}\colon J_{i}\to S_{i}$ で $\alpha_{i}(a)=-1$, $\alpha_{i}(b)=1$ となるものをとる（どれも $[0,1]$ と同相な弧の間の、端点を指定した同相写像）。$J_{i}\cap Q=\{a,b\}$（$Q^{\circ}\cap Z=\varnothing$）で、$a,b$ では値が一致するので、$\phi_{i}\defeq\alpha_{i}\cup\psi\colon C_{i}\to\partial K_{i}$ は閉集合 $J_{i}$, $Q$ の上の連続写像の貼り合わせとして連続（\ref{top:pasting-lemma}）で、全単射である。$C_{i}$ はコンパクトなので $\phi_{i}$ は同相写像（\ref{top:compact-to-hausdorff}）。

**Step 2（各半分の延長）.** \ref{mfd:polygonal-schoenflies} から、$\phi_{i}$ は同相写像 $\Phi_{i}\colon\overline{\operatorname{int}C_{i}}\to K_{i}$ に延びる。$\Phi_{i}$ は全単射で $\Phi_{i}(Q)=\psi(Q)=I$ なので、$\Phi_{i}^{-1}(I)=Q$ である。

**Step 3（貼り合わせ）.** \ref{mfd:theta-lemma.3} から $\overline{\operatorname{int}Z}=\overline{\operatorname{int}C_{1}}\cup\overline{\operatorname{int}C_{2}}$ で、共通部分は $Q$。$Q$ の上では $\Phi_{1}=\Phi_{2}=\psi$ なので、$\Phi\defeq\Phi_{1}\cup\Phi_{2}$ は矛盾なく定まり、二つの閉集合の上で連続なので連続（\ref{top:pasting-lemma}）。像は $K_{1}\cup K_{2}=\overline{\mathbb{D}}$。単射であること：$\Phi(x)=\Phi(y)$ で $x\in\overline{\operatorname{int}C_{1}}$, $y\in\overline{\operatorname{int}C_{2}}$ なら、共通の値は $K_{1}\cap K_{2}=I$ にあるので、Step 2 から $x,y\in Q$ で、$\psi(x)=\psi(y)$ から $x=y$。同じ側の 2 点なら $\Phi_{i}$ の単射性による。$\overline{\operatorname{int}Z}$ はコンパクトなので $\Phi$ は同相写像（\ref{top:compact-to-hausdorff}）。

**Step 4（像の確認）.** $\Phi(Z)=\Phi(J_{1})\cup\Phi(J_{2})=S_{1}\cup S_{2}=S^{1}$, $\Phi(Q)=I$。
:::

## カラテオドリの定理とシェーンフリースの定理 {#mfd:sec-scf-exercises}

対応するページ：\ref{mfd:page-schoenflies}

::: problem ★ 基本：ジョルダン領域の不動点 {#mfd:ex-scf-1}
$J$ を平面のジョルダン曲線、$D\defeq J\cup\operatorname{int}J$ とする。
1. 連続写像 $f\colon D\to D$ は不動点をもつことを示せ。
2. $D$ から $J$ へのレトラクション（$J$ の上で恒等写像となる連続写像 $D\to J$）は存在しないことを示せ。
:::

::: solution
$J$ は $S^{1}$ と同相なので同相写像 $\phi\colon J\to S^{1}$ がある。$\overline{\mathbb{D}}$ は凸体で $\partial\overline{\mathbb{D}}=S^{1}$ なので、\ref{mfd:schoenflies} から $\phi$ は同相写像 $\Phi\colon D\to\overline{\mathbb{D}}$ に延びる。

**1.** $g\defeq\Phi\circ f\circ\Phi^{-1}\colon\overline{\mathbb{D}}\to\overline{\mathbb{D}}$ は連続なので、\ref{at:brouwer-2} から $g(y)=y$ となる $y$ がある。$x\defeq\Phi^{-1}(y)$ とすると $\Phi(f(x))=y=\Phi(x)$ で、$\Phi$ は単射なので $f(x)=x$。

**2.** レトラクション $r\colon D\to J$ があるとし、$s\defeq\Phi\circ r\circ\Phi^{-1}\colon\overline{\mathbb{D}}\to\Phi(J)=S^{1}$ とおく。$y\in S^{1}$ なら $\Phi^{-1}(y)\in J$ で $r$ はそれを動かさないので $s(y)=y$。よって $s$ は $\overline{\mathbb{D}}$ から $S^{1}$ へのレトラクションで、\ref{at:no-retraction-disk} に反する。
:::

::: problem ★★ 標準：境界を止めて内部の点を動かす {#mfd:ex-scf-2}
$J$ を平面のジョルダン曲線、$p,q\in\operatorname{int}J$ とする。$\mathbb{R}^{2}$ の同相写像 $h$ で、$h(p)=q$ であり、$\operatorname{ext}J\cup J$ の上で恒等写像となるものがあることを示せ。
:::

::: solution
**Step 1（閉円板への移し替え）.** \ref{mfd:schoenflies} を凸体 $\overline{\mathbb{D}}$ と同相写像 $\phi\colon J\to S^{1}$ に使い、同相写像 $\Phi\colon J\cup\operatorname{int}J\to\overline{\mathbb{D}}$ で $\Phi(J)=S^{1}$, $\Phi(\operatorname{int}J)=\mathbb{D}$ となるものをとる。$c\defeq\Phi(p)$, $c'\defeq\Phi(q)$ は $\mathbb{D}$ の点、つまり $\overline{\mathbb{D}}$ の内点である。

**Step 2（円板の中で動かす）.** \ref{mfd:convex-body.3} を $K=K'=\overline{\mathbb{D}}$、内点 $c$, $c'$、$g=\mathrm{id}_{S^{1}}$ に使うと、同相写像 $G\colon\overline{\mathbb{D}}\to\overline{\mathbb{D}}$ で $G(c)=c'$、$S^{1}$ の上で恒等写像となるものがある。$h_{0}\defeq\Phi^{-1}\circ G\circ\Phi$ は $J\cup\operatorname{int}J$ の同相写像で、$h_{0}(p)=q$。$x\in J$ なら $\Phi(x)\in S^{1}$ なので $h_{0}(x)=\Phi^{-1}(\Phi(x))=x$。

**Step 3（平面全体へ）.** $h\defeq h_{0}$（$J\cup\operatorname{int}J$ の上）、$h\defeq\mathrm{id}$（$J\cup\operatorname{ext}J$ の上）とおく。二つの集合は閉集合（\ref{at:jordan-curve} から、それぞれ $\operatorname{int}J$, $\operatorname{ext}J$ の閉包）で、和は $\mathbb{R}^{2}$、共通部分は $J$ で、そこでは両方の定義が恒等写像なので、$h$ は矛盾なく定まり連続（\ref{top:pasting-lemma}）。$h_{0}$ は $J\cup\operatorname{int}J$ の全単射なので $h$ は全単射で、逆写像は $h_{0}^{-1}$ と $\mathrm{id}$ を同じように貼り合わせたものだから連続。よって $h$ は求める同相写像である。
:::

::: problem ★★★ 発展：弧を共有する二つの円板 {#mfd:ex-scf-3}
$J_{1},J_{2}$ を平面のジョルダン曲線とし、$J_{1}\cap J_{2}=A$ は弧、$\operatorname{int}J_{1}\cap\operatorname{int}J_{2}=\varnothing$ とする。$A$ の端点を $a,b$、$J_{i}=A\cup B_{i}$（$B_{i}$ は $a,b$ を端点とするもう一方の弧）とし、$D_{i}\defeq J_{i}\cup\operatorname{int}J_{i}$ とおく。同相写像 $\Phi\colon D_{1}\cup D_{2}\to\overline{\mathbb{D}}$ で $\Phi(B_{1}\cup B_{2})=S^{1}$, $\Phi(A)=[-1,1]\times\{0\}$ となるものがあることを示せ。
:::

::: solution
**Step 1（$D_{1}\cap D_{2}=A$）.** まず $\operatorname{int}J_{1}\cap J_{2}=\varnothing$ を示す。$A\subset J_{1}$ なので $A\cap\operatorname{int}J_{1}=\varnothing$。$B_{2}\cap J_{1}\subset J_{2}\cap J_{1}=A$ と $B_{2}\cap A=\{a,b\}$ から、$B_{2}^{\circ}$（端点を除いた部分）は $J_{1}$ と交わらない連結集合で、$\operatorname{int}J_{1}$ か $\operatorname{ext}J_{1}$ のどちらかに含まれる。$B_{2}^{\circ}\subset\operatorname{int}J_{1}$ とすると、$x\in B_{2}^{\circ}$ は $J_{2}=\partial(\operatorname{int}J_{2})$（\ref{at:jordan-curve}）の点なので、$x$ の開近傍 $\operatorname{int}J_{1}$ は $\operatorname{int}J_{2}$ と交わり、仮定に反する。よって $B_{2}^{\circ}\subset\operatorname{ext}J_{1}$ で、$\operatorname{int}J_{1}\cap J_{2}=\varnothing$。同様に $\operatorname{int}J_{2}\cap J_{1}=\varnothing$。これと仮定から
$$
D_{1}\cap D_{2}=(J_{1}\cap J_{2})\cup(\operatorname{int}J_{1}\cap J_{2})\cup(J_{1}\cap\operatorname{int}J_{2})\cup(\operatorname{int}J_{1}\cap\operatorname{int}J_{2})=A.
$$

**Step 2（各円板の同相写像）.** 凸体 $K_{1}\defeq\overline{\mathbb{D}}\cap\{\operatorname{Im}z\ge0\}$, $K_{2}\defeq\overline{\mathbb{D}}\cap\{\operatorname{Im}z\le0\}$ をとり、$I\defeq[-1,1]\times\{0\}$、$S_{i}$ を $\partial K_{i}$ の半円周とする（$\partial K_{i}=S_{i}\cup I$, $S_{i}\cap I=\{\pm1\}$）。同相写像 $\psi\colon A\to I$（$a\mapsto-1$, $b\mapsto1$）と $\alpha_{i}\colon B_{i}\to S_{i}$（$a\mapsto-1$, $b\mapsto1$）を貼り合わせた $\phi_{i}\defeq\alpha_{i}\cup\psi\colon J_{i}\to\partial K_{i}$ は連続な全単射（\ref{top:pasting-lemma}）で、$J_{i}$ はコンパクトなので同相写像（\ref{top:compact-to-hausdorff}）。\ref{mfd:schoenflies} から同相写像 $\Phi_{i}\colon D_{i}\to K_{i}$ で $\phi_{i}$ の延長になっているものがある。$\Phi_{i}$ は全単射で $\Phi_{i}(A)=I$ なので $\Phi_{i}^{-1}(I)=A$。

**Step 3（貼り合わせ）.** $D_{i}$ は閉集合（$\operatorname{int}J_{i}$ の閉包）で、共通部分 $A$ の上で $\Phi_{1}=\Phi_{2}=\psi$ なので、$\Phi\defeq\Phi_{1}\cup\Phi_{2}$ は連続（\ref{top:pasting-lemma}）で、像は $K_{1}\cup K_{2}=\overline{\mathbb{D}}$。$\Phi(x)=\Phi(y)$, $x\in D_{1}$, $y\in D_{2}$ なら、値は $K_{1}\cap K_{2}=I$ にあるので $x,y\in A$ で、$\psi$ の単射性から $x=y$。よって $\Phi$ は単射で、$D_{1}\cup D_{2}$ はコンパクトなので同相写像（\ref{top:compact-to-hausdorff}）。$\Phi(B_{1}\cup B_{2})=S_{1}\cup S_{2}=S^{1}$, $\Phi(A)=I$。
:::

## 球面のシェーンフリースの定理と弧の馴らし {#mfd:sec-tar-exercises}

対応するページ：\ref{mfd:page-tame-arcs}

::: problem ★ 基本：弧の補集合 {#mfd:ex-tar-1}
平面の弧 $A$ について、$\mathbb{R}^{2}\setminus A$ は弧状連結で、$A$ は $\mathbb{R}^{2}$ の内点をもたないことを示せ。
:::

::: solution
\ref{mfd:tame-arc.2} から、$\mathbb{R}^{2}$ の同相写像 $H$ で $H(A)=I\defeq[-1,1]\times\{0\}$ となるものがある。同相写像は弧状連結性と「内点をもたない」ことを保つので、$I$ について示せばよい。

**弧状連結.** $\mathbb{R}^{2}\setminus I$ の点 $z=(x,y)$ を点 $(0,2)$ と結ぶ。$y>0$ なら、開いた上半平面は凸なので線分で結べる。$y=0$ なら $|x|>1$ で、線分 $[(x,0),(x,1)]$ は $I$ と交わらず、$(x,1)$ から上の場合に帰着する。$y<0$ なら、下半平面の中で $(2,-2)$ と線分で結び、線分 $[(2,-2),(2,2)]$（$x=2$ なので $I$ と交わらない）で $(2,2)$ に移り、上の場合に帰着する。

**内点をもたない.** $(x,0)\in I$ のどの近傍も点 $(x,\varepsilon)$（$\varepsilon\neq0$ が小さい）を含み、それは $I$ に属さない。
:::

::: problem ★★ 標準：弧の補集合は穴のあいた平面 {#mfd:ex-tar-2}
平面の弧 $A$ について、$\mathbb{R}^{2}\setminus A$ は $\mathbb{R}^{2}\setminus\{0\}$ と同相であることを示せ。（ジューコフスキー変換 $j(z)\defeq z+1/z$ を使う。）
:::

::: solution
**Step 1（線分への帰着）.** \ref{mfd:tame-arc.2} の同相写像 $H$ と、$z\mapsto2z$ を合成すると、$\mathbb{R}^{2}$ の同相写像で $A$ を $[-2,2]\subset\mathbb{R}\subset\mathbb{C}$ に移すものが得られる。よって $\mathbb{R}^{2}\setminus A\cong\mathbb{C}\setminus[-2,2]$。

**Step 2（$j$ は $E\defeq\{|z|>1\}$ から $\mathbb{C}\setminus[-2,2]$ への全単射）.** $c\in\mathbb{C}$ について、$z\neq0$ が $j(z)=c$ を満たすことは $z^{2}-cz+1=0$ と同値で、この二次方程式の二根 $z_{1},z_{2}$ は $z_{1}z_{2}=1$, $z_{1}+z_{2}=c$ を満たす。
- $c\in[-2,2]$ なら $c=2\cos\theta$ と書け、二根は $e^{\pm i\theta}$ で絶対値 $1$。よって $j(z)=c$ となる $z\in E$ はなく、$j(E)\subset\mathbb{C}\setminus[-2,2]$。
- $c\notin[-2,2]$ とする。$|z_{1}|=1$ なら $z_{2}=1/z_{1}=\overline{z_{1}}$ で $c=2\operatorname{Re}z_{1}\in[-2,2]$ となり矛盾。よって $|z_{1}|\neq1$ で、$|z_{1}||z_{2}|=1$ から一方の根は $E$ に入る。したがって $j$ は $E$ から $\mathbb{C}\setminus[-2,2]$ への全射。
- $j(z)=j(w)$（$z,w\in E$）なら $(z-w)(1-\frac{1}{zw})=0$ で、$|zw|>1$ なので $z=w$。よって単射。

**Step 3（逆写像の連続性）.** $j$ は連結な開集合 $E$ の上の定数でない正則関数なので開写像（\ref{cx:open-mapping}）。よって $j\colon E\to\mathbb{C}\setminus[-2,2]$ は連続な開写像である全単射で、同相写像。

**Step 4（$E\cong\mathbb{C}\setminus\{0\}$）.** $k(z)\defeq(|z|-1)\frac{z}{|z|}$ は $E$ から $\mathbb{C}\setminus\{0\}$ への連続写像で、$l(w)\defeq(|w|+1)\frac{w}{|w|}$ が連続な逆写像（$|k(z)|=|z|-1$, $k(z)/|k(z)|=z/|z|$ から $l(k(z))=z$、同様に $k(l(w))=w$）。

以上から $\mathbb{R}^{2}\setminus A\cong\mathbb{C}\setminus[-2,2]\cong E\cong\mathbb{C}\setminus\{0\}$。
:::

::: problem ★★★ 発展：有限個の点の同時の移動 {#mfd:ex-tar-3}
$\Omega\subset\mathbb{R}^{2}$ を連結な開集合、$p_{1},\dots,p_{n}$ を $\Omega$ の相異なる点、$q_{1},\dots,q_{n}$ も $\Omega$ の相異なる点とする。$\mathbb{R}^{2}$ の同相写像 $g$ で、$g(p_{i})=q_{i}$（$i=1,\dots,n$）であり、$\Omega$ のあるコンパクト部分集合の外で恒等写像となるものがあることを示せ。
:::

::: solution
**Step 1（1 点を除いても連結）.** 【主張：連結な開集合 $\Omega'\subset\mathbb{R}^{2}$ と $x\in\Omega'$ について、$\Omega'\setminus\{x\}$ は連結】$B(x,r)\subset\Omega'$ をとる。$B(x,r)\setminus\{x\}$ は弧状連結である：その 2 点 $y_{1},y_{2}$ は、$x$ から $y_{i}$ への向きの半径の線分を通って円周 $|z-x|=r/2$ に移り、その円周に沿って結べる。$\Omega'\setminus\{x\}=V_{1}\sqcup V_{2}$（空でない開集合）と分かれたとすると、連結な $B(x,r)\setminus\{x\}$ は一方、たとえば $V_{1}$ に含まれ、$V_{1}\cup\{x\}=V_{1}\cup B(x,r)$ は開集合で、$\Omega'=(V_{1}\cup\{x\})\sqcup V_{2}$ は空でない開集合への分割になり、$\Omega'$ の連結性に反する。帰納的に、連結な開集合から有限個の点を除いても連結な開集合である。

**Step 2（台の性質）.** 同相写像 $g$ がコンパクト集合 $L\subset\Omega$ の外で恒等写像なら、$g(\mathbb{R}^{2}\setminus L)=\mathbb{R}^{2}\setminus L$ と全単射性から $g(L)=L$、とくに $g(\Omega)=\Omega$。

**Step 3（帰納法）.** $n=1$ は \ref{mfd:homogeneity} そのものである。$n\ge2$ とし、$g_{n-1}$ が $g_{n-1}(p_{i})=q_{i}$（$i<n$）を満たし、コンパクト集合 $L\subset\Omega$ の外で恒等写像であるとする。$p'\defeq g_{n-1}(p_{n})$ は Step 2 から $\Omega$ の点で、$g_{n-1}$ の単射性と $p_{n}\neq p_{i}$ から $p'\neq q_{i}$（$i<n$）。$\Omega'\defeq\Omega\setminus\{q_{1},\dots,q_{n-1}\}$ は Step 1 から連結な開集合で、$p',q_{n}\in\Omega'$。\ref{mfd:homogeneity} から、同相写像 $h$ で $h(p')=q_{n}$、コンパクト集合 $L'\subset\Omega'$ の外で恒等写像となるものがある。$q_{i}\notin L'$（$i<n$）なので $h(q_{i})=q_{i}$。$g\defeq h\circ g_{n-1}$ とおくと
$$
g(p_{i})=h(q_{i})=q_{i}\ (i<n),\qquad g(p_{n})=h(p')=q_{n}
$$
で、$g$ はコンパクト集合 $L\cup L'\subset\Omega$ の外で恒等写像である。
:::

## 平面の有限グラフの馴らし {#mfd:sec-pgr-exercises}

対応するページ：\ref{mfd:page-plane-graphs}

::: problem ★ 基本：横断弧で切った内側 {#mfd:ex-pgr-1}
$Z$ をジョルダン曲線、$U\defeq\operatorname{int}Z$ とし、弧 $\kappa,\kappa'$ は同じ端点 $u\neq v\in Z$ をもち、$\kappa^{\circ},\kappa'^{\circ}\subset U$ とする。$U\setminus\kappa$ と $U\setminus\kappa'$ は同相であることを示せ。
:::

::: solution
$\kappa,\kappa'$ はどちらも $u,v$ を端点とする弧なので、同相写像 $\alpha\colon[0,1]\to\kappa$, $\alpha'\colon[0,1]\to\kappa'$ で $\alpha(0)=\alpha'(0)=u$, $\alpha(1)=\alpha'(1)=v$ となるものがあり、$f\defeq\alpha'\circ\alpha^{-1}\colon\kappa\to\kappa'$ は $u,v$ を止める同相写像である。\ref{mfd:crosscut-replacement} から、$\mathbb{R}^{2}$ の同相写像 $k$ で、$\kappa$ の上で $f$ に一致し、$\mathbb{R}^{2}\setminus U$ の上で恒等写像となるものがある。$k(\mathbb{R}^{2}\setminus U)=\mathbb{R}^{2}\setminus U$ と全単射性から $k(U)=U$。$k(\kappa)=\kappa'$ なので $k(U\setminus\kappa)=U\setminus\kappa'$ で、$k$ の制限が求める同相写像である。
:::

::: problem ★★ 標準：頂点のまわりの面の数 {#mfd:ex-pgr-2}
$\Gamma$ を有限平面グラフ、$p$ を次数 $d\ge1$ の頂点とする。$p$ の任意の近傍 $W$ に対し、$p$ の開近傍 $N\subset W$ で、$N\setminus|\Gamma|$ がちょうど $d$ 個の連結成分をもつものがあることを示せ。
:::

::: solution
**Step 1（半径の選択）.** $p$ 以外の頂点は有限個で $p$ と異なり、$p$ を端点にもたない辺はコンパクトで $p$ を含まないので、どれも $p$ から正の距離にある。よって $r>0$ を、$\overline{B}(p,r)\subset W$ であり、$\overline{B}(p,r)$ が $p$ 以外の頂点を含まず、$p$ を端点にもつ辺 $\varepsilon_{1},\dots,\varepsilon_{d}$ 以外の辺と交わらないようにとれる。\ref{mfd:star-straightening} の同相写像 $g$、$r'\in(0,r)$、相異なる単位ベクトル $u_{1},\dots,u_{d}$ をとる。

**Step 2（近傍）.** $N\defeq g^{-1}(B(p,r'))$ とおく。$g$ は $B(p,r)$ の外で恒等写像なので $g(B(p,r))=B(p,r)$、よって $N\subset B(p,r)\subset W$。$g(p)=p$ なので $N$ は $p$ の開近傍。

**Step 3（像の中のグラフ）.** $p$ を端点にもたない辺 $\varepsilon$ と $p$ 以外の頂点は $\overline{B}(p,r)$ の外にあり、そこで $g$ は恒等写像なので、像も $B(p,r')$ と交わらない。よって
$$
g(|\Gamma|)\cap B(p,r')=R\defeq\bigcup_{j=1}^{d}\{p+tu_{j}:0\le t<r'\}
$$
で、$g$ は $N\setminus|\Gamma|$ を $B(p,r')\setminus R$ に同相に移す。

**Step 4（扇形）.** $u_{j}=e^{i\theta_{j}}$, $\theta_{1}<\dots<\theta_{d}<\theta_{1}+2\pi$ と並べ、$\theta_{d+1}\defeq\theta_{1}+2\pi$ とする。
$$
S_{j}\defeq\{p+te^{i\theta}:0<t<r',\ \theta_{j}<\theta<\theta_{j+1}\}\quad(j=1,\dots,d)
$$
は連結な $(0,r')\times(\theta_{j},\theta_{j+1})$ の連続像なので連結。$S_{j}$ は、$B(p,r')\setminus\{p\}$ の上の連続写像 $z\mapsto(z-p)/|z-p|$ による、$S^{1}$ の開いた円弧 $\{e^{i\theta}:\theta_{j}<\theta<\theta_{j+1}\}$ の逆像なので開集合。$S_{1},\dots,S_{d}$ は互いに交わらず、和は $B(p,r')\setminus R$ である（$d=1$ では $S_{1}$ は半径を一本除いた円板）。空でなく連結で互いに交わらない開集合の有限個の和なので、各 $S_{j}$ は開かつ閉で、これらがちょうど連結成分である。よって $N\setminus|\Gamma|$ の連結成分はちょうど $d$ 個。
:::

::: problem ★★★ 発展：閉路と補集合の連結性 {#mfd:ex-pgr-3}
有限平面グラフ $\Gamma$ について、$\mathbb{R}^{2}\setminus|\Gamma|$ が連結であることと、$\Gamma$ が閉路をもたないことは同値であることを示せ。
:::

::: solution
**Step 1（$|\Gamma|$ は内点をもたない）.** 各辺（弧）は \ref{mfd:tame-arc.2} の同相写像で線分 $[-1,1]\times\{0\}$ に移り、線分は内点をもたないので、内点をもたない。1 点も内点をもたない。有限個の閉集合 $F_{1},\dots,F_{s}$ がどれも内点をもたなければ和も内点をもたない：空でない開集合 $O\subset F_{1}\cup\cdots\cup F_{s}$ があれば、$O\setminus F_{1}$ は開集合で、空なら $O\subset F_{1}$ となり矛盾なので空でなく、$F_{2}\cup\cdots\cup F_{s}$ に含まれる。これを繰り返すと矛盾する。

**Step 2（閉路があれば連結でない）.** 閉路 $J\subset|\Gamma|$ があるとする。$\operatorname{int}J$, $\operatorname{ext}J$ は空でない開集合なので、Step 1 から $x\in\operatorname{int}J\setminus|\Gamma|$, $y\in\operatorname{ext}J\setminus|\Gamma|$ がとれる。$\mathbb{R}^{2}\setminus|\Gamma|$ の $x$ を含む連結成分は $\mathbb{R}^{2}\setminus J$ の連結集合なので $\operatorname{int}J$ に含まれ（\ref{at:jordan-curve}）、$y$ を含まない。よって $\mathbb{R}^{2}\setminus|\Gamma|$ は連結でない。

**Step 3（閉路がなければ連結）.** $|\Gamma|$ は有限個の連結集合（頂点と辺）の和なので、連結成分 $X_{1},\dots,X_{c}$ は有限個で、各頂点・各辺はどれか一つの $X_{i}$ に含まれる。$X_{i}$ に含まれる頂点と辺からなる $\Gamma_{i}$ は有限平面グラフ（辺の端点も $X_{i}$ に入る）で、$|\Gamma_{i}|=X_{i}$ は連結、$\Gamma_{i}$ の閉路は $\Gamma$ の閉路なので $\Gamma_{i}$ は閉路をもたない。よって $\Gamma_{i}$ は木で、\ref{mfd:prob-gr-tree} から $\mathbb{R}^{2}\setminus X_{i}$ は連結。$X_{i}$ はコンパクトなので $\mathbb{R}^{2}\setminus X_{i}$ は有界でなく、$\widehat{\mathbb{C}}$ での閉包は $\infty$ を含む。連結集合とその閉包の点の和は連結なので、$\widehat{\mathbb{C}}\setminus X_{i}$ は連結である。

$Y_{i}\defeq\{\infty\}\cup X_{1}\cup\cdots\cup X_{i}$ とおき、$\widehat{\mathbb{C}}\setminus Y_{i}$ が連結であることを $i$ の帰納法で示す。$i=0$ では $\mathbb{R}^{2}$ で連結。$i\ge1$ では、閉集合 $A_{1}\defeq Y_{i-1}$, $A_{2}\defeq X_{i}$ の共通部分は空で、$\widehat{\mathbb{C}}\setminus A_{1}$ は帰納法の仮定から、$\widehat{\mathbb{C}}\setminus A_{2}$ は上で示したことから連結。よって \ref{mfd:complement-connected.1} から、$\widehat{\mathbb{C}}\setminus Y_{i}$ の任意の 2 点は同じ連結成分にあり、$\widehat{\mathbb{C}}\setminus Y_{i}$ は連結。$i=c$ として $\mathbb{R}^{2}\setminus|\Gamma|=\widehat{\mathbb{C}}\setminus Y_{c}$ は連結である。
:::

## ラドーの三角形分割定理 {#mfd:sec-rad-exercises}

対応するページ：\ref{mfd:page-rado}

::: problem ★ 基本：胞体分割のオイラー標数 {#mfd:ex-rad-1}
コンパクトな位相曲面 $S$ の胞体分割 $G=(V,E)$ の頂点の数を $n_{0}$、辺の数を $n_{1}$、面の数を $n_{2}$ とする。\ref{mfd:cell-to-triangulation} の証明で作った単体複体 $K$ について $\chi(K)=n_{0}-n_{1}+n_{2}$ であることを示せ。とくに $n_{0}-n_{1}+n_{2}$ は胞体分割の取り方によらない。
:::

::: solution
各面 $O$ について、$J_{O}$ に含まれる辺の数を $k_{O}$ とする（$J_{O}$ の頂点の数も $k_{O}$）。

**Step 1（$\sum_{O}k_{O}=2n_{1}$）.** 1 単体 $[e_{v},e_{m_{\varepsilon}}]$ を面にもつ 2 単体は $\sigma(O,v,\varepsilon)$ の形で、$\varepsilon\subset J_{O}$ となる面 $O$ ごとにちょうど一つである。$|K|$ は曲面 $S$ と同相なので、\ref{mfd:prob-rd-two-triangles} からそれはちょうど二つ。よって各辺はちょうど二つの $J_{O}$ に含まれ、$\sum_{O}k_{O}=2n_{1}$。

**Step 2（単体の数）.** 0 単体：各頂点 $v$ はある辺の端点である（\ref{mfd:cell-to-triangulation} の証明の Step 2 から $v$ はある $J_{O}$、つまりある辺に含まれ、頂点は辺の内部にない）。各辺はある $J_{O}$ に含まれる。よって $K$ の頂点は $e_{v}$, $e_{m_{\varepsilon}}$, $e_{c_{O}}$ のすべてで、$n_{0}+n_{1}+n_{2}$ 個。1 単体：$[e_{c_{O}},e_{v}]$ と $[e_{c_{O}},e_{m_{\varepsilon}}]$ が面ごとに $k_{O}$ 個ずつ、$[e_{v},e_{m_{\varepsilon}}]$ が辺ごとに 2 個で、合計 $2\sum_{O}k_{O}+2n_{1}=6n_{1}$ 個。2 単体：$(O,\varepsilon,v)$（$\varepsilon\subset J_{O}$, $v$ は $\varepsilon$ の端点）ごとに一つで $2\sum_{O}k_{O}=4n_{1}$ 個。頂点の組が異なるので、これらはすべて異なる。

**Step 3.**
$$
\chi(K)=(n_{0}+n_{1}+n_{2})-6n_{1}+4n_{1}=n_{0}-n_{1}+n_{2}.
$$
\ref{at:simplicial-topological-invariance.1} から $\chi(K)$ は $|K|\cong S$ の同相類だけで決まるので、$n_{0}-n_{1}+n_{2}$ は胞体分割によらない。
:::

::: problem ★★ 標準：球面の三角形分割の数え上げ {#mfd:ex-rad-2}
$K$ を有限単体複体で $|K|\cong S^{2}$ となるものとし、0・1・2 単体の数を $V$, $E$, $F$ とする。
1. $E=3V-6$, $F=2V-4$ を示せ。
2. $V\ge4$ を示せ。
3. ある頂点の次数（その頂点を含む 1 単体の数）は $5$ 以下であることを示せ。
:::

::: solution
**1.** \ref{mfd:prob-rd-two-triangles} から各 1 単体はちょうど二つの 2 単体の面で、各 2 単体はちょうど三つの 1 単体を面にもつ。（2 単体, その面の 1 単体）の組を二通りに数えて $3F=2E$。\ref{at:simplicial-topological-invariance.2} から $V-E+F=2$。$F=2E/3$ を代入して $V-E/3=2$、よって $E=3V-6$, $F=2E/3=2V-4$。

**2.** \ref{mfd:prob-rd-two-triangles} から $K$ のすべての単体は 2 単体の面で、$|K|\neq\varnothing$ なので 2 単体があり、$V\ge3$。$V=3$ とすると、3 個の頂点が張る 2 単体は高々 1 個なので $F\le1$ だが、1 から $F=2\cdot3-4=2$ となり矛盾。よって $V\ge4$（四面体の境界がこの値を実現する）。

**3.** 各 1 単体は二つの頂点を含むので、次数の和は $2E=6V-12<6V$。よって次数の平均は $6$ より小さく、次数が $5$ 以下の頂点がある。
:::

::: problem ★★★ 発展：トーラスの三角形分割の頂点数 {#mfd:ex-rad-3}
$K$ を有限単体複体、$V$ をその頂点の数とする。
1. $|K|$ がトーラス $M_{1}$ と同相なら $V\ge7$ であることを示せ。
2. $|K|$ が射影平面 $N_{1}$ と同相なら $V\ge6$ であることを示せ。
:::

::: solution
どちらの場合も $|K|$ はコンパクトな位相曲面と同相である（\ref{mfd:classification-surfaces}）。1・2 単体の数を $E$, $F$ とする。

**Step 1（一般の不等式）.** \ref{mfd:prob-rd-two-triangles} から各 1 単体はちょうど二つの 2 単体の面で、各 2 単体は三つの 1 単体を面にもつので、$3F=2E$。$\chi\defeq V-E+F$ とおくと $\chi=V-E/3$、つまり $E=3(V-\chi)$。1 単体は二つの頂点で決まるので $E\le V(V-1)/2$。よって
$$
3(V-\chi)\le\frac{V(V-1)}{2},\qquad\text{つまり}\qquad V^{2}-7V+6\chi\ge0.
$$

**Step 2（$\chi$ の値）.** \ref{at:simplicial-topological-invariance.1} から $\chi(K)$ は $|K|$ の同相類で決まり、\ref{at:euler-poincare} からベッチ数の交代和に等しい。\ref{at:prob-euler-surfaces} から $\chi(M_{1})=0$, $\chi(N_{1})=1$。

**1.** $\chi=0$ なので $V(V-7)\ge0$。$V>0$ なので $V\ge7$。

**2.** $\chi=1$ なので $V^{2}-7V+6=(V-1)(V-6)\ge0$ で、$V\le1$ か $V\ge6$。$|K|$ は 2 単体を含む（\ref{mfd:prob-rd-two-triangles} から $K$ のすべての単体は 2 単体の面で、$K\neq\varnothing$）ので $V\ge3$。よって $V\ge6$。

なお、頂点 7 個のトーラスの三角形分割と、頂点 6 個の射影平面の三角形分割が実際に存在することが知られている。
:::

## 多角形の貼り合わせ {#mfd:sec-pgw-exercises}

対応するページ：\ref{mfd:page-polygon-schemes}

::: problem ★ 基本：折り畳みで球面に {#mfd:ex-pgw-1}
語 $abb^{-1}a^{-1}$ の実現は $S^{2}$ と同相であることを示せ。また、$abb^{-1}a^{-1}$ と $aa^{-1}$ の頂点の類の数を求め、\ref{mfd:vertex-classes.2} と合っていることを確かめよ。
:::

::: solution
**同相.** \ref{mfd:scheme-relabel} で回転して $a^{-1}a\,bb^{-1}$ とする。これは $U\,x\,x^{-1}$（$U=a^{-1}a$, $|U|=2$, $x=b$）の形なので、\ref{mfd:fold} から $X(abb^{-1}a^{-1})\cong X(a^{-1}a)$。回転して $aa^{-1}$ で、\ref{mfd:prob-ps2-two-gons} から $S^{2}$ と同相。

**頂点の類.** \ref{mfd:vertex-classes.1} の操作で数える。頂点を $p_{0},p_{1},\dots$（$k$ 番目の辺は $p_{k-1}$ から $p_{k}$）とし、文字 $x^{-1}$ の辺では $x$ の始点が $p_{k}$、終点が $p_{k-1}$ であることに注意する。
- $abb^{-1}a^{-1}$：$a$ は 1 番目（始点 $p_{0}$, 終点 $p_{1}$）と 4 番目（始点 $p_{0}$, 終点 $p_{3}$）なので $p_{1}\sim p_{3}$。$b$ は 2 番目（始点 $p_{1}$, 終点 $p_{2}$）と 3 番目（始点 $p_{3}$, 終点 $p_{2}$）なので $p_{1}\sim p_{3}$。類は $\{p_{0}\}$, $\{p_{1},p_{3}\}$, $\{p_{2}\}$ の 3 個。
- $aa^{-1}$：$a$ は 1 番目（始点 $p_{0}$, 終点 $p_{1}$）と 2 番目（始点 $p_{0}$, 終点 $p_{1}$）で、類は $\{p_{0}\}$, $\{p_{1}\}$ の 2 個。

回転は頂点点の数を変えず、折り畳みはちょうど 1 減らす（\ref{mfd:vertex-classes.2}）ので、$3-1=2$ で合っている。
:::

::: problem ★★ 標準：切り貼りだけでクラインの壺を書き換える {#mfd:ex-pgw-2}
\ref{mfd:cut-paste} と \ref{mfd:scheme-relabel} だけを使って、$X(aba^{-1}b)\cong X(aacc)$ を示せ。両方の語の頂点の類の数も求めよ。
:::

::: solution
**書き換え.** $aba^{-1}b$ を $U\defeq ab$, $V\defeq a^{-1}b$ に切ると（\ref{mfd:cut-paste}）、図式 $(abc,\ c^{-1}a^{-1}b)$ になる。前者を回転して $ca\,b$。後者を逆にすると $(c^{-1}a^{-1}b)^{-1}=b^{-1}ac$（\ref{mfd:scheme-relabel}）で、$b^{-1}\,ac$ の形。文字 $b$ はこの二か所にしか現れないので、\ref{mfd:cut-paste} の貼り合わせ（$Ub$ と $b^{-1}V$ を $UV$ に、$U=ca$, $V=ac$）で一つの語 $caac$ になる。回転して $aacc$。各段階は実現を同相写像で移すので $X(aba^{-1}b)\cong X(aacc)$。

**頂点の類.**
- $aba^{-1}b$：$a$ は 1 番目（始点 $p_{0}$, 終点 $p_{1}$）と 3 番目（始点 $p_{3}$, 終点 $p_{2}$）、$b$ は 2 番目（$p_{1}$, $p_{2}$）と 4 番目（$p_{3}$, $p_{0}$）。$p_{0}\sim p_{3}$, $p_{1}\sim p_{2}$, $p_{1}\sim p_{3}$, $p_{2}\sim p_{0}$ で、類は 1 個。
- $aacc$：$a$ から $p_{0}\sim p_{1}$, $p_{1}\sim p_{2}$、$c$ から $p_{2}\sim p_{3}$, $p_{3}\sim p_{0}$ で、類は 1 個。

切り貼りと回転・反転は頂点点の数を変えない（\ref{mfd:vertex-classes.2}）ことと合っている。
:::

::: problem ★★★ 発展：交換子型の語の頂点の類 {#mfd:ex-pgw-3}
$n\ge1$ について、語
$$
W_{n}\defeq a_{1}a_{2}\cdots a_{n}\,a_{1}^{-1}a_{2}^{-1}\cdots a_{n}^{-1}
$$
の頂点の類の数は、$n$ が奇数なら $2$、偶数なら $1$ であることを示せ。
:::

::: solution
頂点を $p_{0},\dots,p_{2n-1}$ とし、添字は $\mathbb{Z}/2n\mathbb{Z}$ で考える（$p_{2n}=p_{0}$）。$k=1,\dots,n$ について、$k$ 番目の辺は $a_{k}$ で始点 $p_{k-1}$、終点 $p_{k}$。$n+k$ 番目の辺は $a_{k}^{-1}$ で、$a_{k}$ の始点は $p_{n+k}$、終点は $p_{n+k-1}$。\ref{mfd:vertex-classes.1} の操作は
$$
p_{k-1}\sim p_{n+k},\qquad p_{k}\sim p_{n+k-1}\qquad(k=1,\dots,n)
$$
を生成する同値関係を与える。

**Step 1（関係の書き直し）.** 前者は $i\defeq k-1\in\{0,\dots,n-1\}$ について $p_{i}\sim p_{i+n+1}$。後者は $i\defeq n+k-1\in\{n,\dots,2n-1\}$ について $p_{i}\sim p_{i-n+1}$ で、$-n+1\equiv n+1\pmod{2n}$ なので $p_{i}\sim p_{i+n+1}$。よって、関係はすべての $i\in\mathbb{Z}/2n\mathbb{Z}$ についての $p_{i}\sim p_{i+n+1}$ である。

**Step 2（数える）.** この関係が生成する同値類は、$\mathbb{Z}/2n\mathbb{Z}$ の $n+1$ による平行移動の軌道、つまり $n+1$ が生成する部分群 $\langle n+1\rangle$ の剰余類である。$\langle n+1\rangle=\langle\gcd(n+1,2n)\rangle$ の位数は $2n/\gcd(n+1,2n)$ なので、類の数は $\gcd(n+1,2n)$。
$$
\gcd(n+1,2n)=\gcd(n+1,\,2n-2(n+1))=\gcd(n+1,2)
$$
で、$n$ が奇数なら $2$、偶数なら $1$。

**確認.** $n=1$（$aa^{-1}$）で 2 個、$n=2$（$aba^{-1}b^{-1}$）で 1 個、$n=3$ で 2 個となり、前の二つの問題と、このページの問題の計算に一致する。
:::

## 閉曲面の分類定理 {#mfd:sec-cls-exercises}

対応するページ：\ref{mfd:page-classification-surfaces}

::: problem ★ 基本：取っ手を作る {#mfd:ex-cls-1}
語 $aba^{-1}cb^{-1}c^{-1}$ の実現はどの標準形と同相か。
:::

::: solution
$aba^{-1}cb^{-1}c^{-1}$ は $a\,A\,b\,B\,a^{-1}\,C\,b^{-1}\,D$ で $A=B=\varnothing$（空の列）、$C=c$, $D=c^{-1}$ としたものなので、\ref{mfd:handle-move} から
$$
aba^{-1}cb^{-1}c^{-1}\simeq ded^{-1}e^{-1}\,ADCB=ded^{-1}e^{-1}\,c^{-1}c.
$$
$c$ の二つの出現をともに逆向きにすると $ded^{-1}e^{-1}\,cc^{-1}$（\ref{mfd:scheme-relabel}）。$U=ded^{-1}e^{-1}$（$|U|=4$）として \ref{mfd:fold} から $\simeq ded^{-1}e^{-1}=[d,e]$。これは $g=1$ の標準形なので、実現はトーラス $M_{1}$ と同相である（\ref{mfd:classification-surfaces}）。

**確認.** 頂点の類は $\{p_{0},p_{3}\}$, $\{p_{1},p_{2},p_{4},p_{5}\}$ の 2 個（$a$ から $p_{0}\sim p_{3}$, $p_{1}\sim p_{2}$、$b$ から $p_{1}\sim p_{5}$, $p_{2}\sim p_{4}$、$c$ から $p_{3}\sim p_{0}$, $p_{4}\sim p_{5}$）。この語の多角形は頂点 2・辺 3・面 1 を与え、$2-3+1=0=\chi(M_{1})$ とも合う。
:::

::: problem ★★ 標準：クロスキャップを二回 {#mfd:ex-cls-2}
語 $abcab^{-1}c^{-1}$ の実現はどの標準形と同相か。
:::

::: solution
$a$ はねじれた対なので、\ref{mfd:crosscap-move} を $P=bc$, $Q=b^{-1}c^{-1}$（$Q^{-1}=cb$）に使うと
$$
abcab^{-1}c^{-1}\simeq bc\,dd\,cb.
$$
回転して $c\,dd\,c\,bb$ とし、ねじれた対 $c$ に \ref{mfd:crosscap-move} を $P=dd$, $Q=bb$（$Q^{-1}=b^{-1}b^{-1}$）で使うと $\simeq dd\,ee\,b^{-1}b^{-1}$。$b$ の二つの出現をともに逆向きにして（\ref{mfd:scheme-relabel}）$ddeebb$。これは $h=3$ の標準形なので、実現は $N_{3}$ と同相で、\ref{mfd:classification-surfaces} からほかのどの標準形とも同相でない。

**確認.** 頂点の類：$a$ から $p_{0}\sim p_{3}$, $p_{1}\sim p_{4}$、$b$ から $p_{1}\sim p_{5}$, $p_{2}\sim p_{4}$、$c$ から $p_{2}\sim p_{0}$, $p_{3}\sim p_{5}$ で、すべて同値、類は 1 個。$1-3+1=-1=2-3=\chi(N_{3})$ と合う。
:::

::: problem ★★★ 発展：二度読む語 {#mfd:ex-cls-3}
$n\ge1$ について、語 $a_{1}a_{2}\cdots a_{n}\,a_{1}a_{2}\cdots a_{n}$ の実現は射影平面 $N_{1}$ と同相であることを示せ。また、この語の頂点の類の数は $n$ であることを示せ。
:::

::: solution
**Step 1（$n=1$）.** 語は $a_{1}a_{1}$ で、$h=1$ の標準形そのもの。

**Step 2（クロスキャップ）.** $n\ge2$ とし、$Y\defeq a_{2}\cdots a_{n}$ とおく。語は $a_{1}\,Y\,a_{1}\,Y$ なので、\ref{mfd:crosscap-move}（$P=Q=Y$）から
$$
a_{1}Ya_{1}Y\simeq Y\,cc\,Y^{-1}\simeq cc\,Y^{-1}Y
$$
（後者は回転）。

**Step 3（折り畳みの繰り返し）.** 【主張：相異なる文字 $y_{1},\dots,y_{k}$（$c$ と異なる）の列 $Y=y_{1}\cdots y_{k}$ について $cc\,Y^{-1}Y\simeq cc$】$k$ の帰納法。$k=0$ は明らか。$k\ge1$ なら、語は
$$
cc\,y_{k}^{-1}\cdots y_{2}^{-1}\,y_{1}^{-1}y_{1}\,y_{2}\cdots y_{k}.
$$
回転して $y_{2}\cdots y_{k}\,cc\,y_{k}^{-1}\cdots y_{2}^{-1}\,y_{1}^{-1}y_{1}$ とし、$y_{1}$ の二つの出現をともに逆向きにすると末尾は $y_{1}y_{1}^{-1}$（\ref{mfd:scheme-relabel}）。残りの部分の長さは $2k\ge2$ なので、\ref{mfd:fold} で $y_{1}y_{1}^{-1}$ を消せて、回転すると $cc\,Y'^{-1}Y'$（$Y'=y_{2}\cdots y_{k}$）。帰納法の仮定から $\simeq cc$。

Step 2・3 から語は $cc$ と $\simeq$ で、$h=1$ の標準形なので実現は $N_{1}$ と同相（\ref{mfd:classification-surfaces}）。

**Step 4（頂点の類）.** 頂点を $p_{0},\dots,p_{2n-1}$（添字は $\mathbb{Z}/2n\mathbb{Z}$）とする。$a_{k}$ は $k$ 番目（始点 $p_{k-1}$, 終点 $p_{k}$）と $n+k$ 番目（始点 $p_{n+k-1}$, 終点 $p_{n+k}$）に現れるので、\ref{mfd:vertex-classes.1} の関係は $p_{i}\sim p_{i+n}$（$i=0,\dots,2n-1$）。類は $\{p_{i},p_{i+n}\}$（$i=0,\dots,n-1$）の $n$ 個。

したがって、頂点の類の数（多角形の上の胞体の数）が異なる語でも、実現は同じ閉曲面になりうる。実際、頂点 $n$・辺 $n$・面 $1$ で $n-n+1=1=\chi(N_{1})$ となり、オイラー標数は一致している。
:::

## 高い次元の三角形分割 {#mfd:sec-thd-exercises}

対応するページ：\ref{mfd:page-topological-manifolds}

::: problem ★ 基本：球面の三角形分割のオイラー標数 {#mfd:ex-thd-1}
$n\ge0$ とし、$\Sigma^{n}\defeq\partial\overline{\Delta^{n+1}}$（$(n+1)$ 単体の真の面の全体）とする。$\Sigma^{n}$ の単体の数を数えて $\chi(\Sigma^{n})=1+(-1)^{n}$ を示し、\ref{at:sphere-simplicial-homology} から求めたベッチ数の交代和と一致することを確かめよ。さらに、$|K|\cong S^{n}$ となる任意の有限単体複体 $K$ について $\chi(K)=1+(-1)^{n}$ であることを示せ。
:::

::: solution
**数え上げ.** $\Delta^{n+1}$ の頂点は $n+2$ 個で、$k$ 次元の面は $k+1$ 個の頂点の選び方と 1 対 1 に対応する。真の面は $k=0,\dots,n$ なので
$$
\chi(\Sigma^{n})=\sum_{k=0}^{n}(-1)^{k}\binom{n+2}{k+1}=-\sum_{j=1}^{n+1}(-1)^{j}\binom{n+2}{j}.
$$
二項定理から $\sum_{j=0}^{n+2}(-1)^{j}\binom{n+2}{j}=(1-1)^{n+2}=0$ なので、$\sum_{j=1}^{n+1}(-1)^{j}\binom{n+2}{j}=-1-(-1)^{n+2}=-1-(-1)^{n}$。よって $\chi(\Sigma^{n})=1+(-1)^{n}$。

**ベッチ数.** \ref{at:sphere-simplicial-homology} から、$n\ge1$ なら $H_{0}(\Sigma^{n})\cong\mathbb{Z}$, $H_{n}(\Sigma^{n})\cong\mathbb{Z}$、ほかは $0$。$n=0$ なら $H_{0}\cong\mathbb{Z}^{2}$（被約で $\mathbb{Z}$）。どれも自由アーベル群なので、ベッチ数は階数で、$n\ge1$ では $b_{0}=b_{n}=1$、$n=0$ では $b_{0}=2$。交代和はどちらも $1+(-1)^{n}$ で、\ref{at:euler-poincare} と一致する。

**一般の三角形分割.** $|\Sigma^{n}|\cong S^{n}$（\ref{at:sphere-simplicial-homology}）なので、$|K|\cong S^{n}$ なら $|K|\cong|\Sigma^{n}|$ で、\ref{at:simplicial-topological-invariance.1} から $\chi(K)=\chi(\Sigma^{n})=1+(-1)^{n}$。$n=2$ では $V-E+F=2$ である。
:::

::: problem ★★ 標準：多様体の三角形分割は純次元的 {#mfd:ex-thd-2}
$K$ を有限単体複体で、$|K|$ が空でない $n$ 次元位相多様体と同相なものとする。$K$ のどの単体もある $n$ 単体の面であり、$K$ の次元は $n$ であることを示せ。
:::

::: solution
**Step 1（極大な単体の内部の点）.** $\sigma\in K$ を、$K$ のほかの単体の真の面にならない（極大な）単体とし、$k\defeq\dim\sigma$、$x$ を $\sigma$ の相対的な内部 $\sigma^{\circ}$（すべての重心座標が正の点）の点とする。$x\in\tau\in K$ なら、$\tau\cap\sigma$ は $\sigma$ の面（\ref{at:simplicial-complex} の (b)）で $x$ を含むが、$\sigma^{\circ}$ の点を含む $\sigma$ の面は $\sigma$ 自身だけなので $\tau\cap\sigma=\sigma$、つまり $\sigma$ は $\tau$ の面である。$\sigma$ は極大なので $\tau=\sigma$。

**Step 2（$x$ の近傍）.** $x$ を含まない $K$ の単体の和 $C$ は有限個の閉集合の和なので閉集合で、$O\defeq|K|\setminus C$ は $x$ の開近傍。Step 1 から $O\subset\sigma$。$\sigma^{\circ}$ は $\sigma$ の開集合なので、$O'\defeq O\cap\sigma^{\circ}$ は $O$ の開集合、したがって $|K|$ の開集合で、$x\in O'$。

**Step 3（次元の比較）.** $\sigma$ の頂点を $\mathbb{R}^{k}$ の $0,e_{1},\dots,e_{k}$ に移すアフィン写像は $\sigma$ から標準単体への同相写像で、$\sigma^{\circ}$ を $\mathbb{R}^{k}$ の開集合 $\{y:y_{i}>0,\ \sum_{i}y_{i}<1\}$ に移す。よって $O'$ は $\mathbb{R}^{k}$ の空でない開集合と同相で、$k$ 次元の位相多様体である。一方 $O'$ は $n$ 次元位相多様体と同相な $|K|$ の空でない開集合なので、\ref{mfd:topological-manifold-properties.3} から $n$ 次元の位相多様体でもある。\ref{mfd:topological-manifold-properties.1} から $k=n$。

**Step 4（結論）.** $K$ は有限なので、どの単体も、それを面にもつ単体のうち次元が最大のもの（これは極大）の面である。Step 3 から極大な単体はすべて $n$ 単体なので、どの単体もある $n$ 単体の面である。$|K|\neq\varnothing$ なので $K$ は単体を含み、$K$ の次元は $n$ である。
