# ド・ラームの定理 {#mfd:page-de-rham-theorem keywords="Cech-de Rham double complex, generalized Mayer-Vietoris sequence for differential forms via partitions of unity, Mayer-Vietoris sequence for de Rham cohomology, de Rham theorem H_dR(M) = H_sing(M; R) via a good cover, topological invariance of de Rham cohomology"}

ド・ラーム・コホモロジー（\ref{mfd:de-rham-cohomology}）は、微分形式と外微分という「解析的な」データから作られる。一方、特異コホモロジー（\ref{at:singular-cohomology}）は、単体からの連続写像という「位相的な」データから作られる。\ref{mfd:de-rham-theorem} は、実数係数では両者が一致することを主張する。とくに、ド・ラーム・コホモロジーは可微分構造によらず、位相空間としての多様体だけで決まる。

証明（Bott–Tu の方法）は、良い被覆 $\mathcal{U}$（\ref{riem:good-cover-exists}）の上で、チェック方向（被覆の重なり方）と微分形式の方向をもつ**チェック–ド・ラーム二重複体**を考えるものである。1 の分割を使うと行が完全になり（一般化されたマイヤー–ヴィートリス完全列、\ref{mfd:generalized-mv-forms}）、ポアンカレの補題で列が完全になる。二重複体の比較（\ref{at:double-complex-comparison}）から、ド・ラーム・コホモロジーは被覆のチェックコホモロジーに一致し、それは代数的位相幾何で示した特異コホモロジーとの一致（\ref{at:cech-good-cover}）につながる。

## 記法と定義の確認 {#mfd:sec-dr-notation}

::: notation
- 微分形式・外微分・引き戻し・ド・ラーム・コホモロジーとその基本性質は \ref{mfd:differential-form}, \ref{mfd:exterior-derivative}, \ref{mfd:pullback-properties}, \ref{mfd:de-rham-cohomology}, \ref{mfd:de-rham-properties}。ポアンカレの補題は \ref{mfd:poincare-lemma-manifold}。滑らかな 1 の分割は \ref{mfd:smooth-partition-of-unity}。
- 良い被覆の存在は \ref{riem:good-cover-exists}（補助的にリーマン計量を使うが、結論は計量によらない）。
- チェック複体（添字はすべての組を使う）は \ref{cat:cech-complex}、二重複体と全複体、その比較は \ref{at:double-complex}, \ref{at:double-complex-comparison}、良い被覆のチェックコホモロジーと特異コホモロジーの一致は \ref{at:cech-good-cover}。$\underline{\mathbb{R}}$ は局所定数関数の層。
- 開被覆 $\mathcal{U}=\{U_{i}\}_{i\in I}$ について $U_{i_{0}\cdots i_{p}}\defeq U_{i_{0}}\cap\cdots\cap U_{i_{p}}$。$\Omega^{q}(\varnothing)\defeq0$。
:::

## 一般化されたマイヤー–ヴィートリス完全列 {#mfd:sec-dr-mv}

::: definition チェック–ド・ラーム複体 {#mfd:cech-de-rham-complex keywords="K^{p,q} = prod over (i_0, ..., i_p) of Omega^q(U_{i_0...i_p}); Cech differential delta with (delta omega)_{i_0...i_{p+1}} = sum (-1)^k omega_{i_0...hat i_k...i_{p+1}} restricted; exterior derivative d; restriction map r: Omega^q(M) -> prod Omega^q(U_i)" index="チェック–ド・ラーム複体|ちぇっくどらーむふくたい"}
開被覆 $\mathcal{U}=\{U_{i}\}_{i\in I}$ について、$K^{p,q}\defeq\prod_{(i_{0},\dots,i_{p})\in I^{p+1}}\Omega^{q}(U_{i_{0}\cdots i_{p}})$ とし、**チェックの微分** $\check\delta\colon K^{p,q}\to K^{p+1,q}$ を
$$
(\check\delta\omega)_{i_{0}\cdots i_{p+1}}\defeq\sum_{k=0}^{p+1}(-1)^{k}\,\omega_{i_{0}\cdots\widehat{i_{k}}\cdots i_{p+1}}\restriction U_{i_{0}\cdots i_{p+1}}
$$
と定める（\ref{cat:cech-complex} の式を、層 $\Omega^{q}$ に適用したもの）。また $r\colon\Omega^{q}(M)\to K^{0,q}$, $r(\omega)\defeq(\omega\restriction U_{i})_{i}$ とする。外微分 $d$ を成分ごとに $K^{p,q}\to K^{p,q+1}$ に施す。
:::

制限は外微分と可換（\ref{mfd:pullback-properties}、包含写像による引き戻し）なので、$d\check\delta=\check\delta d$, $dr=rd$。$\check\delta\check\delta=0$ と $\check\delta r=0$ はチェック複体の場合と同じ計算（\ref{cat:cech-complex}）。よって $(K^{\bullet,\bullet},\check\delta,d)$ は二重複体（\ref{at:double-complex}）である。

::: theorem 一般化されたマイヤー–ヴィートリス完全列 {#mfd:generalized-mv-forms keywords="for any open cover, 0 -> Omega^q(M) -> prod Omega^q(U_i) -> prod Omega^q(U_ij) -> ... is exact; a contracting homotopy is built from a partition of unity" index="一般化されたマイヤー–ヴィートリス完全列（微分形式）|いっぱんかされたまいやーびーとりすかんぜんれつびぶんけいしき"}
可微分多様体 $M$ の任意の開被覆 $\mathcal{U}$ と $q\ge0$ について、
$$
0\to\Omega^{q}(M)\xrightarrow{r}K^{0,q}\xrightarrow{\check\delta}K^{1,q}\xrightarrow{\check\delta}K^{2,q}\to\cdots
$$
は完全である。
:::

::: intuition
各 $U_{i}$ の上の形式が重なりで整合していれば、張り合わせて大域的な形式になる（$K^{0,q}$ での完全性）。高い次数では、1 の分割 $\rho_{j}$ で「$j$ 番目の開集合に責任を押し付ける」ことで、コサイクルを明示的に境界として書く。チェックの微分が一つの添字を落とす操作なのに対し、1 の分割は一つの添字を付け加える操作で、両者がちょうど打ち消し合う。
:::

::: proof
**Step 1（$\Omega^{q}(M)$ と $K^{0,q}$ での完全性）.** $r$ は単射：$\omega\restriction U_{i}=0$ がすべての $i$ で成り立てば、各点の値が $0$。$\ker\check\delta=\operatorname{im}r$：$(\omega_{i})\in K^{0,q}$ が $\check\delta(\omega)=0$、つまり $U_{ij}$ の上で $\omega_{j}-\omega_{i}=0$ なら、$x\in U_{i}$ について $\omega(x)\defeq\omega_{i}(x)$ は $i$ によらず、各点の近くで $\omega_{i}$ に一致するので滑らかな形式で、$r(\omega)=(\omega_{i})$。$\check\delta r=0$ は $\omega_{j}\restriction U_{ij}-\omega_{i}\restriction U_{ij}=0$ から。

**Step 2（ホモトピー作用素）.** $\{U_{j}\}$ に従属する滑らかな 1 の分割 $\{\rho_{j}\}_{j\in I}$ をとる（\ref{mfd:smooth-partition-of-unity.2}：$\operatorname{supp}\rho_{j}\subset U_{j}$、台は局所有限、$\sum\rho_{j}=1$）。$p\ge1$ について $h\colon K^{p,q}\to K^{p-1,q}$ を
$$
(h\omega)_{i_{0}\cdots i_{p-1}}\defeq\sum_{j\in I}\rho_{j}\,\omega_{j\,i_{0}\cdots i_{p-1}}
$$
と定める。ここで $\rho_{j}\omega_{j\,i_{0}\cdots i_{p-1}}$ は $U_{j\,i_{0}\cdots i_{p-1}}$ 上の形式で、$U_{i_{0}\cdots i_{p-1}}\setminus\operatorname{supp}\rho_{j}$ の上では $0$ とおいて $U_{i_{0}\cdots i_{p-1}}$ 全体の滑らかな形式に延ばす（二つの開集合 $U_{j\,i_{0}\cdots i_{p-1}}$ と $U_{i_{0}\cdots i_{p-1}}\setminus\operatorname{supp}\rho_{j}$ は $U_{i_{0}\cdots i_{p-1}}$ を覆い、重なりでは両方 $0$。$\operatorname{supp}\rho_{j}$ は $M$ の閉集合で $U_{j}$ に含まれることを使う）。台の局所有限性から、和は各点の近くで有限和で、滑らか。

**Step 3（$\check\delta h+h\check\delta=\mathrm{id}$, $p\ge1$）.** $\omega\in K^{p,q}$ について、$(h\check\delta\omega)_{i_{0}\cdots i_{p}}=\sum_{j}\rho_{j}(\check\delta\omega)_{j\,i_{0}\cdots i_{p}}$。チェックの微分の定義で、添字の列 $(j,i_{0},\dots,i_{p})$ の第 $0$ 項は $\omega_{i_{0}\cdots i_{p}}$、第 $k+1$ 項は $(-1)^{k+1}\omega_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}$ なので
$$
(h\check\delta\omega)_{i_{0}\cdots i_{p}}=\Bigl(\sum_{j}\rho_{j}\Bigr)\omega_{i_{0}\cdots i_{p}}-\sum_{k=0}^{p}(-1)^{k}\sum_{j}\rho_{j}\,\omega_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}.
$$
一方 $(\check\delta h\omega)_{i_{0}\cdots i_{p}}=\sum_{k=0}^{p}(-1)^{k}(h\omega)_{i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}=\sum_{k}(-1)^{k}\sum_{j}\rho_{j}\,\omega_{j\,i_{0}\cdots\widehat{i_{k}}\cdots i_{p}}$（$U_{i_{0}\cdots i_{p}}$ に制限）。足すと、$\sum_{j}\rho_{j}=1$ から $\omega_{i_{0}\cdots i_{p}}$。

**Step 4（$K^{p,q}$, $p\ge1$ での完全性）.** $\check\delta\omega=0$ なら、Step 3 から $\omega=\check\delta(h\omega)$。

::: hypcheck
- **1 の分割**：Step 2・3 で使った。これは $\Omega^{q}$ が「細かい層」（1 の分割を掛けられる層）であることの表れで、局所定数関数の層 $\underline{\mathbb{R}}$ では同じ議論は使えない（定数関数に $\rho_{j}$ を掛けると定数でなくなる）。
- **パラコンパクト性（第二可算性）**：1 の分割の存在の中で使われている。
:::
:::

::: corollary ド・ラーム・コホモロジーのマイヤー–ヴィートリス完全列 {#mfd:de-rham-mayer-vietoris keywords="for M = U cup V open, 0 -> Omega(M) -> Omega(U) + Omega(V) -> Omega(U cap V) -> 0 is exact, giving the long exact Mayer-Vietoris sequence in de Rham cohomology" index="マイヤー–ヴィートリス完全列（ド・ラーム）|まいやーびーとりすかんぜんれつどらーむ"}
$M=U\cup V$（$U,V$ は開集合）について、$\omega\mapsto(\omega\restriction U,\omega\restriction V)$, $(\alpha,\beta)\mapsto\beta\restriction U\cap V-\alpha\restriction U\cap V$ による
$$
0\to\Omega^{q}(M)\to\Omega^{q}(U)\oplus\Omega^{q}(V)\to\Omega^{q}(U\cap V)\to0
$$
は完全で、ド・ラーム・コホモロジーの長完全列 $\cdots\to H^{q}(M)\to H^{q}(U)\oplus H^{q}(V)\to H^{q}(U\cap V)\xrightarrow{\partial}H^{q+1}(M)\to\cdots$ を誘導する。
:::

::: proof
左と中央の完全性は \ref{mfd:generalized-mv-forms} の Step 1 と同じ。右の全射性：$\{\rho_{U},\rho_{V}\}$ を $\{U,V\}$ に従属する 1 の分割とし、$\gamma\in\Omega^{q}(U\cap V)$ について $\alpha\defeq-\rho_{V}\gamma$（$U$ の上の形式。$U\setminus\operatorname{supp}\rho_{V}$ で $0$ とおく）、$\beta\defeq\rho_{U}\gamma$（$V$ の上）とすると、$U\cap V$ で $\beta-\alpha=(\rho_{U}+\rho_{V})\gamma=\gamma$。各写像は $d$ と可換なので、余鎖複体の短完全列の長完全列（\ref{ha:long-exact-sequence}）が得られる。
:::

## ド・ラームの定理 {#mfd:sec-dr-theorem}

::: theorem ド・ラームの定理 {#mfd:de-rham-theorem keywords="de Rham theorem: for a smooth manifold M, H^k_dR(M) is isomorphic to singular cohomology H^k(M; R) for all k; proof via the Cech-de Rham double complex of a good cover" index="ド・ラームの定理|どらーむのていり" refname="ド・ラームの定理"}
可微分多様体 $M$ について、すべての $k\ge0$ で
$$
H^{k}_{\mathrm{dR}}(M)\cong\check H^{k}(\mathcal{U},\underline{\mathbb{R}})\cong H^{k}_{\mathrm{sing}}(M;\mathbb{R})
$$
（$\mathcal{U}$ は \ref{riem:good-cover-exists} の良い被覆）。
:::

::: proof
$\dim M=0$ なら $M$ は離散な可算集合で、両辺は $k=0$ で $\prod_{M}\mathbb{R}$、$k\ge1$ で $0$。以下 $n\defeq\dim M\ge1$。

**Step 1（良い被覆）.** \ref{riem:good-cover-exists} から、$M$ の開被覆 $\mathcal{U}=\{U_{i}\}_{i\in\mathbb{N}}$ で、空でない有限個の共通部分 $U_{\sigma}$ がすべて $\mathbb{R}^{n}$ の星形の開集合と微分同相であるものをとる。

**Step 2（二重複体）.** \ref{mfd:cech-de-rham-complex} の二重複体 $K^{p,q}$ を考える（行の微分は $\check\delta$、列の微分は $d$）。

**Step 3（行）.** \ref{mfd:generalized-mv-forms} から、$R^{q}\defeq\Omega^{q}(M)$ と $\eta\defeq r$ で添加した各行は完全。

**Step 4（列）.** $p$ を固定すると、列は $\prod_{\sigma}\Omega^{\bullet}(U_{\sigma})$（$\sigma=(i_{0},\dots,i_{p})$）。$C^{p}\defeq\prod_{\sigma}\underline{\mathbb{R}}(U_{\sigma})$（$U_{\sigma}\neq\varnothing$ なら $U_{\sigma}$ は連結で $\underline{\mathbb{R}}(U_{\sigma})=\mathbb{R}$ は定数関数、空なら $0$）で、定数関数を $0$ 形式とみる包含 $\iota$ で添加した列
$$
0\to C^{p}\xrightarrow{\iota}K^{p,0}\xrightarrow{d}K^{p,1}\xrightarrow{d}\cdots
$$
が完全であることを示す。成分ごとに見ると、$U_{\sigma}\neq\varnothing$ では $0\to\mathbb{R}\to\Omega^{0}(U_{\sigma})\to\Omega^{1}(U_{\sigma})\to\cdots$ で、$\Omega^{0}$ での完全性は「$df=0$ なら $f$ は定数」（$U_{\sigma}$ は連結、\ref{mfd:de-rham-properties.3}）、$\Omega^{q}$（$q\ge1$）での完全性は $H^{q}(U_{\sigma})=0$（\ref{mfd:poincare-lemma-manifold.1}）。直積の完全性は、各成分で原像を一つずつ選べばよい（添字 $\sigma$ は可算個）。$C^{p}$ は \ref{at:cech-good-cover} の Step 3 の $C^{p}(\mathcal{U},\underline{\mathbb{R}})$ と同じもので、$\iota$ は $\check\delta$ と可換（定数関数の制限）、$d\iota=0$。

**Step 5（比較）.** \ref{at:double-complex-comparison}（その行の微分をチェックの微分 $\check\delta$ に、列の微分を外微分 $d$ に読み替える）から、$\eta$ と $\iota$ はともに全複体へのコホモロジーの同型を誘導し、$H^{k}_{\mathrm{dR}}(M)=H^{k}(\Omega^{\bullet}(M))\cong H^{k}(\mathrm{Tot}K)\cong H^{k}(C^{\bullet}(\mathcal{U},\underline{\mathbb{R}}))=\check H^{k}(\mathcal{U},\underline{\mathbb{R}})$。

**Step 6（特異コホモロジー）.** $\mathcal{U}$ の空でない有限個の共通部分は星形の開集合と同相で可縮なので、$\mathcal{U}$ は良い被覆（\ref{at:good-cover}）で、添字集合 $\mathbb{N}$ は整列順序をもつ。\ref{at:cech-good-cover} を $A=\mathbb{R}$ で使うと $\check H^{k}(\mathcal{U},\underline{\mathbb{R}})\cong H^{k}_{\mathrm{sing}}(M;\mathbb{R})$。

::: hypcheck
- **良い被覆**：Step 4（列の完全性にポアンカレの補題）と Step 6（特異コホモロジーとの比較）の両方で使った。良い被覆の存在には補助的なリーマン計量（凸な球）を使った。
- **1 の分割**：Step 3（行の完全性）で使った。特異コチェインの側では、代わりに小さいコチェイン（\ref{at:cohomology-sheaf-facts}）が同じ役割を果たした。
- **選択公理**：Step 4 で、可算個の成分ごとに原像を選ぶのに可算選択公理を使う（星形の開集合については、ポアンカレの補題の積分公式で原像が明示的に書けるので、微分同相写像を固定すれば選択は不要になる）。
- **係数が実数**：微分形式は実数値なので、得られるのは実係数の特異コホモロジーである。整数係数のねじれの情報（たとえば $\mathbb{RP}^{2}$ の $H^{2}(\,\cdot\,;\mathbb{Z})=\mathbb{Z}/2$）はド・ラーム・コホモロジーには現れない。
:::
:::

::: corollary ド・ラーム・コホモロジーの位相不変性 {#mfd:de-rham-topological-invariance keywords="homeomorphic smooth manifolds have isomorphic de Rham cohomology; de Rham cohomology is independent of the smooth structure; homotopy equivalent manifolds have isomorphic de Rham cohomology" index="ド・ラーム・コホモロジーの位相不変性|どらーむこほもろじーのいそうふへんせい"}
1. 同相な可微分多様体（たとえば、一つの位相多様体に入った二つの可微分構造）のド・ラーム・コホモロジーは同型である。
2. ホモトピー同値な可微分多様体のド・ラーム・コホモロジーは同型である。とくに可縮な多様体では $H^{k}=0$（$k\ge1$）。
:::

::: proof
\ref{mfd:de-rham-theorem} の右辺は、特異コホモロジーのホモトピー不変性（\ref{at:cohomology-axioms}）から、位相空間のホモトピー型だけで決まる。
:::

::: remark
\ref{mfd:de-rham-theorem} の同型は、二重複体を経由した抽象的なもので、この証明だけからは、良い被覆の選び方によらないことや、滑らかな写像の誘導写像との両立（自然性）はわからない。具体的な同型は「閉形式をサイクルの上で積分する写像」で与えられ、それが同型であることがド・ラームのもとの定理である。これは滑らかな特異コホモロジー（\ref{mfd:page-smooth-singular}）を経由した別証明として \see{mfd:de-rham-integration-theorem} で示し、そこで同型が被覆によらないこと、自然であることも示す。ウェッジ積がカップ積に対応すること（同型が環の同型であること）は \see{mfd:de-rham-cup} で示す。
:::

::: supplement
**高い視点：細かい層の分解.** 層の言葉で言えば、$0\to\underline{\mathbb{R}}\to\Omega^{0}\xrightarrow{d}\Omega^{1}\xrightarrow{d}\cdots$ はポアンカレの補題から層の完全列（**ド・ラーム分解**）で、各 $\Omega^{q}$ は 1 の分割を掛けられる細かい層なので、層コホモロジーを計算するのに使える非輪状な分解である。よって $H^{k}(M,\underline{\mathbb{R}})=H^{k}(\Omega^{\bullet}(M))$。同じく特異コチェインの層も $\underline{\mathbb{R}}$ の細かい（柔らかい）分解を与えるので、両者は同じ層コホモロジーを計算する。チェック–ド・ラーム二重複体の議論は、この「二つの分解が同じものを計算する」ことを、良い被覆のチェック複体を仲立ちにして具体的に実行したものである。比喩で言えば、局所定数関数という「硬い」層は直接扱いにくいので、柔らかい層（微分形式・特異コチェイン）の列で近似し、どちらの近似も同じ答えを出すことを示した。

**補足.** 同じ二重複体で係数をコンパクト台の形式に替えると、コンパクト台のド・ラーム・コホモロジーとコンパクト台の特異コホモロジーの一致が得られ、ポアンカレ双対性（\ref{at:poincare-duality}）のド・ラーム版 $H^{k}(M)\cong H^{n-k}_{c}(M)^{*}$（向き付け可能な $M$、$\int\alpha\wedge\beta$ による対）につながることが知られている。
:::

## 問題 {#mfd:sec-dr-problems}

::: problem {#mfd:prob-dr-circle-mv}
$S^{1}=U\cup V$（$U,V$ は二つの開弧、$U\cap V$ は二つの開弧の非交和）にマイヤー–ヴィートリス完全列（\ref{mfd:de-rham-mayer-vietoris}）を使い、$H^{1}(S^{1})\cong\mathbb{R}$ を示せ。
:::

::: solution
$U,V$ は開区間と微分同相で $H^{0}=\mathbb{R}$, $H^{1}=0$。$U\cap V$ は 2 成分で $H^{0}=\mathbb{R}^{2}$, $H^{1}=0$。完全列 $0\to H^{0}(S^{1})\to\mathbb{R}^{2}\to\mathbb{R}^{2}\xrightarrow{\partial}H^{1}(S^{1})\to0$ で、$H^{0}(S^{1})=\mathbb{R}$（連結）、$\mathbb{R}^{2}\to\mathbb{R}^{2}$, $(a,b)\mapsto(b-a,b-a)$ の像は 1 次元なので、$\partial$ の像は $\mathbb{R}^{2}/\text{(1 次元)}\cong\mathbb{R}$、$H^{1}(S^{1})\cong\mathbb{R}$。
:::

::: problem {#mfd:prob-dr-rp2}
$\mathbb{RP}^{2}$ の実係数の特異コホモロジーは $H^{0}=\mathbb{R}$, $H^{1}=H^{2}=0$ である（$H_{1}(\mathbb{RP}^{2};\mathbb{Z})=\mathbb{Z}/2$, $H_{2}=0$ と普遍係数定理）。ここから、$\mathbb{RP}^{2}$ の上の閉 2 形式はすべて完全であることを導け。$\mathbb{RP}^{2}$ が向き付け不可能であることと整合することを確かめよ。
:::

::: solution
ド・ラームの定理から $H^{2}_{\mathrm{dR}}(\mathbb{RP}^{2})\cong H^{2}(\mathbb{RP}^{2};\mathbb{R})=0$ なので、閉 2 形式は完全。向き付け可能なコンパクト 2 次元多様体なら体積形式は完全でない（\ref{mfd:stokes-corollaries.3}）ので $H^{2}_{\mathrm{dR}}\neq0$ のはずで、$H^{2}_{\mathrm{dR}}=0$ は向き付け不可能性と整合する（実際、\ref{mfd:orientable-equivalents} から、どこでも $0$ でない 2 形式は存在しない）。
:::
