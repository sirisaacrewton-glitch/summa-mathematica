# 演習：ド・ラームの定理 {#mfd:page-exercises-de-rham keywords="exercises, The de Rham Theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#mfd:sec-exdr-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$H^{k}(M)$ はド・ラーム・コホモロジー $H^{k}_{\mathrm{dR}}(M)$ を表し、$b_{k}(M)\defeq\dim_{\mathbb{R}}H^{k}(M)$ はベッチ数である。
- $\mathbb{R}^{2}\setminus\{0\}$ の上の 1 形式
$$
\omega_{0}\defeq\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}
$$
を**角度形式**という。$S^{1}$ に制限すると、\ref{mfd:prob-di-circle-period} や \ref{mfd:torus-cup-product} の $\omega=(-y\,dx+x\,dy)\restriction S^{1}$ に一致する（$S^{1}$ の上で $x^{2}+y^{2}=1$）。
- $S^{2}\subset\mathbb{R}^{3}$ の上の 2 形式 $\mu\defeq(x_{1}\,dx_{2}\wedge dx_{3}+x_{2}\,dx_{3}\wedge dx_{1}+x_{3}\,dx_{1}\wedge dx_{2})\restriction S^{2}$ を使う。
:::

## ド・ラームの定理 {#mfd:sec-drt-exercises}

対応するページ：\ref{mfd:page-de-rham-theorem}

::: problem ★ 基本：穴のあいた平面 {#mfd:ex-drt-1}
$H^{k}(\mathbb{R}^{2}\setminus\{0\})$ をすべての $k\ge0$ について求めよ。$S^{1}$ のコホモロジーは \ref{mfd:prob-dr-circle-mv} の結果を使ってよい。
:::

::: solution
**Step 1（ホモトピー同値）.** 包含 $i\colon S^{1}\to\mathbb{R}^{2}\setminus\{0\}$ と $\rho(v)\defeq v/|v|$ を考える。$\rho\circ i=1_{S^{1}}$ である。また $G(v,t)\defeq(1-t)v+t\,v/|v|$ は $v$ の正の数倍（係数 $(1-t)+t/|v|>0$）なので $0$ にならず、$\mathbb{R}^{2}\setminus\{0\}$ の中の連続なホモトピーで、$G(\cdot,0)=1$, $G(\cdot,1)=i\circ\rho$。よって $\mathbb{R}^{2}\setminus\{0\}$ と $S^{1}$ はホモトピー同値である。

**Step 2.** \ref{mfd:de-rham-topological-invariance.2} から $H^{k}(\mathbb{R}^{2}\setminus\{0\})\cong H^{k}(S^{1})$。$S^{1}$ は連結なので $H^{0}(S^{1})\cong\mathbb{R}$（\ref{mfd:de-rham-properties.3}）、$H^{1}(S^{1})\cong\mathbb{R}$（\ref{mfd:prob-dr-circle-mv}）、$k\ge2$ では $k>\dim S^{1}$ なので $0$（\ref{mfd:de-rham-properties.4}）。よって
$$
H^{k}(\mathbb{R}^{2}\setminus\{0\})\cong\begin{cases}\mathbb{R}&(k=0,1)\\0&(k\ge2).\end{cases}
$$
:::

::: problem ★★ 標準：2 点を除いた平面 {#mfd:ex-drt-2}
$p\defeq(-1,0)$, $q\defeq(1,0)$, $M\defeq\mathbb{R}^{2}\setminus\{p,q\}$ とする。マイヤー–ヴィートリス完全列を使って、$H^{0}(M)\cong\mathbb{R}$, $H^{1}(M)\cong\mathbb{R}^{2}$, $H^{k}(M)=0$（$k\ge2$）を示せ。
:::

::: solution
**Step 1（被覆）.** $U\defeq\{(x,y):x<\tfrac12\}\setminus\{p\}$, $V\defeq\{(x,y):x>-\tfrac12\}\setminus\{q\}$ とおく。$q$ は $x=1$ なので $U$ に入らず、$p$ は $x=-1$ なので $V$ に入らない。$M$ の点は $x<\frac12$ なら $U$ に、$x\ge\frac12$ なら $V$ に入るので $M=U\cup V$。また $U\cap V=\{-\tfrac12<x<\tfrac12\}$（帯）である。

**Step 2（各開集合のコホモロジー）.** 帯 $U\cap V$ は凸なので星形で、連結。よって $H^{0}(U\cap V)\cong\mathbb{R}$、$k\ge1$ で $H^{k}(U\cap V)=0$（\ref{mfd:poincare-lemma-manifold.1}）。$\varphi(x)\defeq\log\tfrac32-\log(\tfrac12-x)$ は $(-\infty,\tfrac12)$ から $\mathbb{R}$ への微分同相写像（導関数 $1/(\frac12-x)>0$、値域は $\mathbb{R}$ 全体）で $\varphi(-1)=0$。$(x,y)\mapsto(\varphi(x),y)$ は半平面 $\{x<\frac12\}$ から $\mathbb{R}^{2}$ への微分同相写像で $p$ を $0$ に写すので、$U\cong\mathbb{R}^{2}\setminus\{0\}$。$V$ も同様（$x\mapsto-x$ と合成する）。\ref{mfd:ex-drt-1} と \ref{mfd:de-rham-properties.1} から、$U$, $V$ の $H^{0}$, $H^{1}$ は $\mathbb{R}$、$k\ge2$ の $H^{k}$ は $0$。

**Step 3（$H^{0}$, $H^{1}$）.** $M$ は弧状連結（有限個の点を除いた平面）なので $H^{0}(M)\cong\mathbb{R}$。\ref{mfd:de-rham-mayer-vietoris} の長完全列の始めの部分は
$$
0\to H^{0}(M)\to H^{0}(U)\oplus H^{0}(V)\xrightarrow{\ \beta\ }H^{0}(U\cap V)\xrightarrow{\ \partial\ }H^{1}(M)\to H^{1}(U)\oplus H^{1}(V)\to H^{1}(U\cap V)=0
$$
で、次元は $1,2,1$ と続く。$\beta$ の核は $1$ 次元の $H^{0}(M)$ の像なので、$\beta$ の像は $2-1=1$ 次元で、$\beta$ は全射。よって $\partial=0$ で、$H^{1}(M)\to H^{1}(U)\oplus H^{1}(V)\cong\mathbb{R}^{2}$ は単射、かつ右端が $0$ なので全射。$H^{1}(M)\cong\mathbb{R}^{2}$。

**Step 4（$k\ge2$）.** 完全列 $H^{k-1}(U\cap V)\to H^{k}(M)\to H^{k}(U)\oplus H^{k}(V)$ で、左は $k-1\ge1$ なので $0$、右は $k\ge2$ なので $0$。よって $H^{k}(M)=0$。
:::

::: problem ★★★ 発展：マイヤー–ヴィートリスによる球面の計算 {#mfd:ex-drt-3}
$n\ge1$ について、$H^{k}(S^{n})\cong\mathbb{R}$（$k=0,n$）、$0$（それ以外）であることを、特異コホモロジーの計算を使わずに、マイヤー–ヴィートリス完全列と $n$ についての帰納法で示せ（ホモトピー不変性 \ref{mfd:de-rham-topological-invariance.2} は使ってよい）。
:::

::: solution
**Step 1（$n=1$）.** $S^{1}$ は連結なので $H^{0}\cong\mathbb{R}$、\ref{mfd:prob-dr-circle-mv} から $H^{1}\cong\mathbb{R}$、$k\ge2$ では \ref{mfd:de-rham-properties.4} から $0$。

**Step 2（被覆）.** $n\ge2$ とし、$N\defeq(0,\dots,0,1)$, $S\defeq(0,\dots,0,-1)$、$U\defeq S^{n}\setminus\{N\}$, $V\defeq S^{n}\setminus\{S\}$ とおく。立体射影は標準的な可微分構造の座標近傍（\ref{mfd:manifold-examples.4}）なので、$U$, $V$ は $\mathbb{R}^{n}$ と微分同相で、連結、$H^{k}(U)=H^{k}(V)=0$（$k\ge1$、\ref{mfd:poincare-lemma-manifold.1}）。$U\cap V=\{x\in S^{n}:|x_{n+1}|<1\}$ で、$x=(x',x_{n+1})$ と書くと $|x'|=\sqrt{1-x_{n+1}^{2}}>0$ なので
$$
U\cap V\to S^{n-1}\times(-1,1),\quad x\mapsto\bigl(x'/|x'|,\ x_{n+1}\bigr),\qquad (u,t)\mapsto\bigl(\sqrt{1-t^{2}}\,u,\ t\bigr)
$$
は互いに逆な滑らかな写像である。$S^{n-1}\times(-1,1)$ は、射影 $(u,t)\mapsto u$ と包含 $u\mapsto(u,0)$ およびホモトピー $((u,t),s)\mapsto(u,(1-s)t)$ によって $S^{n-1}$ とホモトピー同値。よって \ref{mfd:de-rham-properties.1} と \ref{mfd:de-rham-topological-invariance.2} から $H^{k}(U\cap V)\cong H^{k}(S^{n-1})$ で、$U\cap V$ は連結（$n-1\ge1$ なので $S^{n-1}$ は連結）。

**Step 3（$k=0,1$）.** $S^{n}$ は連結で $H^{0}(S^{n})\cong\mathbb{R}$。\ref{mfd:de-rham-mayer-vietoris} の列
$$
0\to H^{0}(S^{n})\to H^{0}(U)\oplus H^{0}(V)\to H^{0}(U\cap V)\xrightarrow{\partial}H^{1}(S^{n})\to H^{1}(U)\oplus H^{1}(V)=0
$$
で次元は $1,2,1$。\ref{mfd:ex-drt-2} の Step 3 と同じく $H^{0}(U)\oplus H^{0}(V)\to H^{0}(U\cap V)$ は全射なので $\partial=0$、一方 $\partial$ は全射なので $H^{1}(S^{n})=0$。

**Step 4（$k\ge2$）.** 完全列
$$
0=H^{k-1}(U)\oplus H^{k-1}(V)\to H^{k-1}(U\cap V)\xrightarrow{\partial}H^{k}(S^{n})\to H^{k}(U)\oplus H^{k}(V)=0
$$
（$k-1\ge1$）から $H^{k}(S^{n})\cong H^{k-1}(U\cap V)\cong H^{k-1}(S^{n-1})$。帰納法の仮定から、これは $k-1=n-1$（$k-1\ge1$ なので $k-1=0$ は起こらない）、すなわち $k=n$ のとき $\mathbb{R}$、それ以外で $0$。Step 3 と合わせて主張が従う。
:::

## 滑らかな特異ホモロジー {#mfd:sec-ssm-exercises}

対応するページ：\ref{mfd:page-smooth-singular}

::: problem ★ 基本：滑らかなコチェインの 0 次コホモロジー {#mfd:ex-ssm-1}
$M$ を空でない連結な可微分多様体、$G$ をアーベル群とする。\ref{mfd:smooth-singular-iso} を使わずに、$H^{0}(S^{\bullet}_{\infty}(M;G))$ が定数関数の全体で、$G$ と同型であることを示せ。
:::

::: solution
**Step 1（0 単体）.** $k=0$ では $\Delta^{0}=\mathbb{R}^{0}$ は 1 点で、写像 $\Delta^{0}\to M$ はそれ自身が延長なので、すべての 0 単体（点）は滑らか（\ref{mfd:smooth-singular-simplex}）。よって $S^{0}_{\infty}(M;G)$ は $M$ 上の $G$ 値関数の全体で、次数 $-1$ の項はないので $H^{0}=\ker\delta$。滑らかな 1 単体 $\tau$ について $\partial\tau=\tau(e_{1})-\tau(e_{0})$ なので、$(\delta\varphi)(\tau)=\varphi(\tau(e_{1}))-\varphi(\tau(e_{0}))$。とくに定数関数は $\ker\delta$ に入る。

**Step 2（座標球の中の線分）.** $\varphi\in\ker\delta$ とし、$y\in M$ のまわりの座標近傍 $(W,\psi)$ で $\psi(W)$ が開球 $B$ であるものをとる（\ref{mfd:maximal-atlas.3}）。$z\in W$ について $\ell(s)\defeq(1-s)\psi(y)+s\psi(z)$ とおくと、$O\defeq\{s\in\mathbb{R}:\ell(s)\in B\}$ は開集合で、$B$ が凸なので $[0,1]\subset O$。$\tau\defeq\psi^{-1}\circ\ell\restriction[0,1]$ は $O$ 上の滑らかな写像 $\psi^{-1}\circ\ell$ に延びるので滑らかな 1 単体で、$\tau(e_{0})=y$, $\tau(e_{1})=z$。よって $0=(\delta\varphi)(\tau)=\varphi(z)-\varphi(y)$。

**Step 3（連結性）.** Step 2 から $\varphi$ は各点の近傍で定数、すなわち局所定数。$c\in G$ について $\varphi^{-1}(c)$ は開集合で、その補集合も（他の値の逆像の和なので）開集合。$M$ は連結なので、$\varphi$ のとる値は一つで、$\varphi$ は定数。よって $H^{0}(S^{\bullet}_{\infty}(M;G))$ は定数関数の全体で、$c\mapsto(\text{値 }c\text{ の定数関数})$ により $G$ と同型（$M\neq\varnothing$ なので単射）。
:::

::: problem ★★ 標準：滑らかなホモトピー不変性 {#mfd:ex-ssm-2}
$H\colon M\times\mathbb{R}\to N$ を滑らかな写像とし、$f\defeq H(\cdot,0)$, $g\defeq H(\cdot,1)$ とおく。任意のアーベル群 $G$ について、$f^{*}=g^{*}\colon H^{q}(S^{\bullet}_{\infty}(N;G))\to H^{q}(S^{\bullet}_{\infty}(M;G))$ であることを示せ。
:::

::: solution
**Step 1（鎖ホモトピー）.** \ref{mfd:smooth-operators.2} から、プリズム作用素 $P\colon S^{\infty}_{k}(M)\to S^{\infty}_{k+1}(N)$ があり、$S^{\infty}(M)$ の上で $\partial P+P\partial=g_{\#}-f_{\#}$（次数 $0$ では $P\partial$ の項はなく、$\partial P=g_{\#}-f_{\#}$）。$f$, $g$ は滑らかなので、$f^{\#}$, $g^{\#}$ は滑らかなコチェインの余鎖写像を与える（\ref{mfd:smooth-simplex-basics.3}）。

**Step 2（双対）.** $q\ge1$ と $\varphi\in S^{q}_{\infty}(N;G)$ について $P^{*}\varphi\defeq\varphi\circ P\in S^{q-1}_{\infty}(M;G)$ とおく。$c\in S^{\infty}_{q}(M)$ について
$$
(\delta P^{*}\varphi+P^{*}\delta\varphi)(c)=\varphi(P\partial c)+\varphi(\partial Pc)=\varphi(g_{\#}c-f_{\#}c)=(g^{\#}\varphi-f^{\#}\varphi)(c).
$$
$q=0$ では同様に $P^{*}\delta\varphi=g^{\#}\varphi-f^{\#}\varphi$。

**Step 3.** $\varphi$ がコサイクル（$\delta\varphi=0$）なら、$q\ge1$ では $g^{\#}\varphi-f^{\#}\varphi=\delta(P^{*}\varphi)$ は余境界、$q=0$ では $g^{\#}\varphi-f^{\#}\varphi=0$。いずれの場合も $g^{*}[\varphi]=f^{*}[\varphi]$。
:::

::: problem ★★★ 発展：滑らかに可縮な多様体の滑らかなホモロジー {#mfd:ex-ssm-3}
$U$ を滑らかに可縮な可微分多様体（\ref{mfd:smoothly-contractible}）とする。$H_{0}(S^{\infty}(U))\cong\mathbb{Z}$、$k\ge1$ で $H_{k}(S^{\infty}(U))=0$ であることを、\ref{mfd:smooth-singular-homology-iso} を使わずに鎖のレベルで示せ。
:::

::: solution
**Step 1（鎖ホモトピー）.** $(x_{0},H)$ を滑らかな可縮化、$c\colon U\to\ast$, $j\colon\ast\to U$（$\ast\mapsto x_{0}$）とする。$H(\cdot,0)=j\circ c$, $H(\cdot,1)=1_{U}$ なので、\ref{mfd:smooth-operators.2} から $S^{\infty}(U)$ の上で
$$
\partial P+P\partial=1-j_{\#}c_{\#}\qquad(\text{次数 }0\text{ では }\partial P=1-j_{\#}c_{\#}).
$$
$j_{\#}$ は定値単体を $x_{0}$ での定値単体に写し、それは滑らか（\ref{mfd:smooth-simplex-basics.3}, \ref{mfd:smooth-simplex-basics.5}）。

**Step 2（1 点の鎖複体）.** $\ast$ の $k$ 単体は定値写像 $\kappa_{k}$ ただ一つで、$\partial\kappa_{k}=\sum_{i=0}^{k}(-1)^{i}\kappa_{k-1}$ は $k$ が正の偶数なら $\kappa_{k-1}$、奇数なら $0$。

**Step 3（$k\ge1$）.** $z\in S^{\infty}_{k}(U)$ をサイクルとすると、Step 1 から $z=\partial(Pz)+j_{\#}c_{\#}z$。$c_{\#}z=m\kappa_{k}$（$m\in\mathbb{Z}$）は $S(\ast)$ のサイクル。$k$ が偶数なら $0=\partial(m\kappa_{k})=m\kappa_{k-1}$ から $m=0$ で、$z=\partial(Pz)$。$k$ が奇数なら $\kappa_{k}=\partial\kappa_{k+1}$（$k+1$ は正の偶数）なので $j_{\#}c_{\#}z=\partial(m\,j_{\#}\kappa_{k+1})$ で、$z=\partial(Pz+m\,j_{\#}\kappa_{k+1})$。括弧の中は滑らかな鎖なので、$z$ は $S^{\infty}(U)$ の境界。よって $H_{k}(S^{\infty}(U))=0$。

**Step 4（$k=0$）.** $\varepsilon\colon S^{\infty}_{0}(U)\to\mathbb{Z}$ を係数の和とする。滑らかな 1 単体 $\tau$ について $\varepsilon(\partial\tau)=1-1=0$ なので、$\varepsilon$ は $H_{0}$ からの準同型を与え、$\varepsilon(x_{0})=1$ から全射。$\varepsilon(z)=0$ なら $j_{\#}c_{\#}z=\varepsilon(z)\,x_{0}=0$ なので $z=\partial(Pz)$。よって $\varepsilon$ は同型 $H_{0}(S^{\infty}(U))\cong\mathbb{Z}$ を誘導する。
:::

## 積分によるド・ラームの同型（別証明） {#mfd:sec-dri-exercises}

対応するページ：\ref{mfd:page-de-rham-integration}

::: problem ★ 基本：角度形式の周期 {#mfd:ex-dri-1}
$r>0$ について $\sigma_{r}(t)\defeq(r\cos2\pi t,\,r\sin2\pi t)$（$t\in\Delta^{1}=[0,1]$）とする。
1. 角度形式 $\omega_{0}$ が閉形式で、$\int_{\sigma_{r}}\omega_{0}=2\pi$（$r$ によらない）であることを示せ。
2. $\mathbb{R}^{2}\setminus\{0\}$ の任意の閉 1 形式 $\alpha$ について、$c\defeq\int_{\sigma_{1}}\alpha$ とおくと $\alpha-\frac{c}{2\pi}\omega_{0}$ は完全であることを示せ（\ref{mfd:ex-drt-1} を使ってよい）。
:::

::: solution
**1.** $\rho\defeq x^{2}+y^{2}$ とおく。$\partial_{y}(-y/\rho)=(2y^{2}-\rho)/\rho^{2}$, $\partial_{x}(x/\rho)=(\rho-2x^{2})/\rho^{2}$ なので
$$
d\omega_{0}=\Bigl(\frac{\rho-2x^{2}}{\rho^{2}}-\frac{2y^{2}-\rho}{\rho^{2}}\Bigr)dx\wedge dy=\frac{2\rho-2x^{2}-2y^{2}}{\rho^{2}}\,dx\wedge dy=0.
$$
$\sigma_{r}$ は $\mathbb{R}$ 全体の滑らかな写像の制限なので滑らかな 1 単体で、$\partial\sigma_{r}=\sigma_{r}(1)-\sigma_{r}(0)=0$。$\sigma_{r}^{*}dx=-2\pi r\sin2\pi t\,dt$, $\sigma_{r}^{*}dy=2\pi r\cos2\pi t\,dt$ から
$$
\sigma_{r}^{*}\omega_{0}=\frac{2\pi r^{2}(\sin^{2}2\pi t+\cos^{2}2\pi t)}{r^{2}}\,dt=2\pi\,dt,\qquad\int_{\sigma_{r}}\omega_{0}=2\pi.
$$

**2.** \ref{mfd:ex-drt-1} から $H^{1}(\mathbb{R}^{2}\setminus\{0\})$ は 1 次元。$[\omega_{0}]\neq0$：$\omega_{0}=df$ なら \ref{mfd:stokes-simplex} から $\int_{\sigma_{1}}\omega_{0}=\int_{\partial\sigma_{1}}f=0$ となり 1 に反する。よって $[\omega_{0}]$ は基底で、$[\alpha]=t[\omega_{0}]$ となる $t\in\mathbb{R}$ がある。周期は類だけで決まる（\ref{mfd:integration-cochain-map}）ので、$c=\int_{\sigma_{1}}\alpha=t\int_{\sigma_{1}}\omega_{0}=2\pi t$。したがって $[\alpha-\frac{c}{2\pi}\omega_{0}]=0$。
:::

::: problem ★★ 標準：2 点を除いた平面の周期 {#mfd:ex-dri-2}
\ref{mfd:ex-drt-2} の記号（$p=(-1,0)$, $q=(1,0)$, $M=\mathbb{R}^{2}\setminus\{p,q\}$）で、平行移動 $T_{a}(v)\defeq v-a$ を使って $\omega_{p}\defeq T_{p}^{*}\omega_{0}$, $\omega_{q}\defeq T_{q}^{*}\omega_{0}$ を $M$ の上の 1 形式とみる。$\sigma_{p}(t)\defeq p+\frac12(\cos2\pi t,\sin2\pi t)$, $\sigma_{q}(t)\defeq q+\frac12(\cos2\pi t,\sin2\pi t)$ とする。
1. $\int_{\sigma_{a}}\omega_{b}=2\pi\delta_{ab}$（$a,b\in\{p,q\}$）を示せ。
2. $[\omega_{p}]$, $[\omega_{q}]$ が $H^{1}(M)$ の基底であることを示し、$M$ の閉 1 形式 $\alpha$ について、$\alpha-\frac{A}{2\pi}\omega_{p}-\frac{B}{2\pi}\omega_{q}$（$A\defeq\int_{\sigma_{p}}\alpha$, $B\defeq\int_{\sigma_{q}}\alpha$）が完全であることを示せ。
:::

::: solution
**1.** $\omega_{p}$ は閉形式の引き戻しなので閉（\ref{mfd:exterior-derivative}）、$\omega_{q}$ も同様。$\sigma_{p}$ はサイクルで、$\sigma_{p}^{*}\omega_{p}=(T_{p}\circ\sigma_{p})^{*}\omega_{0}=\sigma_{1/2}^{*}\omega_{0}$（\ref{mfd:pullback-properties}、$\sigma_{1/2}$ は \ref{mfd:ex-dri-1} のもの）なので $\int_{\sigma_{p}}\omega_{p}=2\pi$。$\int_{\sigma_{q}}\omega_{q}=2\pi$ も同様。

次に、$p$ を中心とする半径 $1$ の開円板 $D$ は凸で、$|p-q|=2$ なので $q\notin D$、とくに $D\subset\mathbb{R}^{2}\setminus\{q\}$。$\omega_{q}\restriction D$ は閉で、$D$ は星形なので $\omega_{q}\restriction D=dg$ となる $g\in\Omega^{0}(D)$ がある（\ref{mfd:poincare-lemma-manifold.1}）。$\sigma_{p}$ の像は $D$ に含まれ、$D$ の滑らかな単体でもある（\ref{mfd:smooth-simplex-basics.4}）。積分は引き戻し $\sigma_{p}^{*}\omega_{q}$ だけで決まるので、\ref{mfd:stokes-simplex} から $\int_{\sigma_{p}}\omega_{q}=\int_{\sigma_{p}}dg=\int_{\partial\sigma_{p}}g=0$。$\int_{\sigma_{q}}\omega_{p}=0$ も同様。

**2.** $a[\omega_{p}]+b[\omega_{q}]=0$ なら、周期は類だけで決まる（\ref{mfd:integration-cochain-map}）ので、$\sigma_{p}$, $\sigma_{q}$ の上で積分して 1 から $2\pi a=0$, $2\pi b=0$。よって二つの類は線形独立で、$\dim H^{1}(M)=2$（\ref{mfd:ex-drt-2}）から基底。$\beta\defeq\alpha-\frac{A}{2\pi}\omega_{p}-\frac{B}{2\pi}\omega_{q}$ は閉で、1 から $\int_{\sigma_{p}}\beta=A-A=0$, $\int_{\sigma_{q}}\beta=0$。$[\beta]=x[\omega_{p}]+y[\omega_{q}]$ と書いて同じく積分すると $2\pi x=2\pi y=0$、よって $[\beta]=0$。
:::

::: problem ★★★ 発展：周期がすべて 0 の閉 1 形式 {#mfd:ex-dri-3}
可微分多様体 $M$ の閉 1 形式 $\omega$ について、$\omega$ が完全であることと、すべての滑らかな 1 サイクル $z\in S^{\infty}_{1}(M)$ について $\int_{z}\omega=0$ であることが同値であることを示せ。
:::

::: solution
**Step 1（必要性）.** $\omega=df$ なら $\int_{z}df=\int_{\partial z}f=0$（\ref{mfd:integration-cochain-map}）。

**Step 2（積分コチェイン）.** 逆に周期がすべて $0$ とする。$\varphi\defeq I(\omega)\in S^{1}_{\infty}(M;\mathbb{R})$ は $\delta\varphi=I(d\omega)=0$ なのでコサイクル（\ref{mfd:integration-cochain-map}）。

**Step 3（普遍係数定理）.** $S^{\infty}_{k}(M)$ は滑らかな単体を基底とする自由アーベル群なので、$S^{\infty}(M)$ は自由な鎖複体で、$S^{\bullet}_{\infty}(M;\mathbb{R})=\mathrm{Hom}(S^{\infty}(M),\mathbb{R})$。\ref{at:algebraic-uct-cohomology} から完全列
$$
0\to\mathrm{Ext}^{1}_{\mathbb{Z}}(H_{0}(S^{\infty}(M)),\mathbb{R})\to H^{1}(S^{\bullet}_{\infty}(M;\mathbb{R}))\xrightarrow{h}\mathrm{Hom}(H_{1}(S^{\infty}(M)),\mathbb{R})\to0,\qquad h[\varphi]([z])=\varphi(z)
$$
がある。$\mathbb{R}$ は可除なので入射的（\ref{ha:injective-divisible.1}）で、$\mathrm{Ext}^{1}(-,\mathbb{R})=0$（\ref{ha:ext-vanish-injective}）。よって $h$ は単射。

**Step 4（結論）.** 仮定から $h[\varphi]([z])=\int_{z}\omega=0$ がすべてのサイクル $z$ で成り立つので $h[\varphi]=0$、したがって $I^{*}[\omega]=[\varphi]=0$。\ref{mfd:de-rham-integration-theorem.1} から $I^{*}$ は単射なので $[\omega]=0$、すなわち $\omega$ は完全である。
:::

## ド・ラームの定理の帰結 {#mfd:sec-drc-exercises}

対応するページ：\ref{mfd:page-de-rham-consequences}

::: problem ★ 基本：実射影空間 {#mfd:ex-drc-1}
$n\ge1$ について $H^{k}(\mathbb{RP}^{n})$ を求めよ。また、$n$ が偶数なら $\mathbb{RP}^{n}$ は向き付け可能でないことを導け。
:::

::: solution
**Step 1.** \ref{mfd:de-rham-theorem} と \ref{mfd:real-cohomology-dual} から $H^{k}(\mathbb{RP}^{n})\cong\mathrm{Hom}(H_{k}(\mathbb{RP}^{n};\mathbb{Z}),\mathbb{R})$。\ref{at:projective-space-homology.1} から $H_{k}$ は $k=0$ と（$n$ が奇数のとき）$k=n$ で $\mathbb{Z}$、$0<k<n$ の奇数 $k$ で $\mathbb{Z}/2$、それ以外で $0$。$\mathrm{Hom}(\mathbb{Z},\mathbb{R})\cong\mathbb{R}$、$\mathrm{Hom}(\mathbb{Z}/2,\mathbb{R})=0$（$\mathbb{R}$ に位数 $2$ の元はない）なので
$$
H^{k}(\mathbb{RP}^{n})\cong\begin{cases}\mathbb{R}&(k=0,\ \text{または }k=n\text{ が奇数})\\0&(\text{それ以外}).\end{cases}
$$

**Step 2.** $n$ が偶数（$n\ge2$）なら Step 1 から $H^{n}(\mathbb{RP}^{n})=0$。$\mathbb{RP}^{n}$ はコンパクトで空でないので、向き付け可能なら \ref{mfd:stokes-corollaries.2} から $H^{n}(\mathbb{RP}^{n})\neq0$ となり矛盾する。
:::

::: problem ★★ 標準：球面上の 2 形式が完全になる条件 {#mfd:ex-drc-2}
$S^{2}$ に $\mu$（記法を参照）が正となる向きを入れる。
1. $\mu$ はどの点でも $0$ にならないことを示せ。
2. $x_{3}\mu$ は完全であることを示せ。
3. $(x_{3}^{2}-c)\mu$ が完全であるための $c\in\mathbb{R}$ の条件を求めよ。
:::

::: solution
**1.** $x\in S^{2}$, $u,v\in T_{x}S^{2}=x^{\perp}$ について、定義から $\mu_{x}(u,v)=x_{1}(u_{2}v_{3}-u_{3}v_{2})+x_{2}(u_{3}v_{1}-u_{1}v_{3})+x_{3}(u_{1}v_{2}-u_{2}v_{1})=\det(x,u,v)$。$u,v$ が $T_{x}S^{2}$ の基底なら $x,u,v$ は $\mathbb{R}^{3}$ の基底なので、これは $0$ でない。よって $\mu$ は体積形式で、\ref{mfd:orientable-equivalents} から $\mu$ が正となる向きが入る。

**2.** $R(x)\defeq(x_{1},-x_{2},-x_{3})$ は $S^{2}$ の微分同相写像で、
$$
R^{*}\mu=x_{1}\,dx_{2}\wedge dx_{3}+(-x_{2})\,d(-x_{3})\wedge dx_{1}+(-x_{3})\,dx_{1}\wedge d(-x_{2})=\mu.
$$
よって $R$ は向きを保ち、$R^{*}(x_{3}\mu)=-x_{3}\mu$。\ref{mfd:integral-well-defined.4} から $\int_{S^{2}}x_{3}\mu=\int_{S^{2}}R^{*}(x_{3}\mu)=-\int_{S^{2}}x_{3}\mu$、よって積分は $0$。$S^{2}$ はコンパクトで連結なので、\ref{mfd:top-de-rham} から $x_{3}\mu$ は完全。

**3.** $P(x)\defeq(x_{2},x_{3},x_{1})$ も $S^{2}$ の微分同相写像で、
$$
P^{*}\mu=x_{2}\,dx_{3}\wedge dx_{1}+x_{3}\,dx_{1}\wedge dx_{2}+x_{1}\,dx_{2}\wedge dx_{3}=\mu.
$$
よって $P$ は向きを保ち、$P^{*}(x_{3}^{2}\mu)=x_{1}^{2}\mu$, $P^{*}(x_{1}^{2}\mu)=x_{2}^{2}\mu$ なので、\ref{mfd:integral-well-defined.4} から $\int x_{1}^{2}\mu=\int x_{2}^{2}\mu=\int x_{3}^{2}\mu$。$S^{2}$ の上で $x_{1}^{2}+x_{2}^{2}+x_{3}^{2}=1$ なので、これらの和は $\int\mu$ で、$\int x_{3}^{2}\mu=\frac13\int\mu$。よって
$$
\int_{S^{2}}(x_{3}^{2}-c)\mu=\Bigl(\frac13-c\Bigr)\int_{S^{2}}\mu.
$$
$\mu$ は体積形式なので完全でなく（\ref{mfd:stokes-corollaries.3}）、\ref{mfd:top-de-rham} から $\int\mu\neq0$。したがって、\ref{mfd:top-de-rham} から $(x_{3}^{2}-c)\mu$ が完全であることと $c=\frac13$ は同値。
:::

::: problem ★★★ 発展：$S^{2}\times S^{4}$ にはシンプレクティック形式がない {#mfd:ex-drc-3}
$S^{2}\times S^{4}$ は向き付け可能で $b_{2}\neq0$ であるが、シンプレクティック形式をもたないことを示せ。
:::

::: solution
**Step 1（$b_{2}=1$）.** \ref{mfd:sphere-de-rham} から $b_{0}=b_{2}=1$, $b_{1}=0$（$S^{2}$）、$b_{0}=1$, $b_{1}=b_{2}=0$（$S^{4}$）。\ref{mfd:de-rham-kunneth} から $b_{2}(S^{2}\times S^{4})=b_{0}(S^{2})b_{2}(S^{4})+b_{1}(S^{2})b_{1}(S^{4})+b_{2}(S^{2})b_{0}(S^{4})=1$。

**Step 2（生成元）.** $\mathrm{pr}_{1}\colon S^{2}\times S^{4}\to S^{2}$ を射影とし、$a\defeq\mathrm{pr}_{1}^{*}[\mu]\in H^{2}(S^{2}\times S^{4})$ とおく。$y_{0}\in S^{4}$ を固定し $s(x)\defeq(x,y_{0})$ とすると $\mathrm{pr}_{1}\circ s=1_{S^{2}}$ なので $s^{*}a=[\mu]$（\ref{mfd:de-rham-properties.1}）。$\mu$ は体積形式（\ref{mfd:ex-drc-2}）なので $[\mu]\neq0$（\ref{mfd:stokes-corollaries.3}）、よって $a\neq0$ で、Step 1 から $a$ は $H^{2}$ を生成する。

**Step 3（$a^{3}=0$）.** $a^{3}=[\mathrm{pr}_{1}^{*}(\mu\wedge\mu\wedge\mu)]$ で、$\mu\wedge\mu$ は 2 次元多様体 $S^{2}$ の上の 4 形式なので $0$。よって $a^{3}=0$（すでに $a^{2}=0$）。

**Step 4（結論）.** シンプレクティック形式 $\omega$ があれば、Step 2 から $[\omega]=ta$（$t\in\mathbb{R}$）で、$[\omega^{3}]=[\omega]^{3}=t^{3}a^{3}=0$。一方 $S^{2}\times S^{4}$ はコンパクトで境界がなく、$\dim=6=2\cdot3$ なので、\ref{symp:symplectic-manifold-basic.2} から $\omega^{3}$ は完全でない。矛盾。

（向き付け可能性は、$\mathrm{pr}_{1}^{*}\mu\wedge\mathrm{pr}_{2}^{*}\nu$（$\nu$ は $S^{4}$ の体積形式）がどこでも $0$ にならないことからわかる。したがって \ref{mfd:de-rham-applications} のような「$H^{2}=0$」による議論はここでは使えず、積の構造が必要になる。）
:::

## ド・ラームの同型と積 {#mfd:sec-drp-exercises}

対応するページ：\ref{mfd:page-de-rham-products}

::: problem ★ 基本：トーラスの 1 次の類の積 {#mfd:ex-drp-1}
\ref{mfd:torus-cup-product} の記号で、$\alpha\defeq a\omega_{1}+b\omega_{2}$, $\beta\defeq c\omega_{1}+d\omega_{2}$（$a,b,c,d\in\mathbb{R}$）とする。$\Psi[\alpha]\cup\Psi[\beta]=(ad-bc)\,\Psi[\omega_{1}\wedge\omega_{2}]$ を示し、$\Psi[\alpha]\cup\Psi[\beta]=0$ となるのは $ad=bc$ のときに限ることを示せ。
:::

::: solution
1 形式どうしの外積は $\omega_{i}\wedge\omega_{i}=0$, $\omega_{2}\wedge\omega_{1}=-\omega_{1}\wedge\omega_{2}$ をみたすので
$$
\alpha\wedge\beta=ad\,\omega_{1}\wedge\omega_{2}+bc\,\omega_{2}\wedge\omega_{1}=(ad-bc)\,\omega_{1}\wedge\omega_{2}.
$$
\ref{mfd:de-rham-cup} から $\Psi[\alpha]\cup\Psi[\beta]=\Psi[\alpha\wedge\beta]=(ad-bc)\Psi[\omega_{1}\wedge\omega_{2}]$。\ref{mfd:torus-cup-product} から $[\omega_{1}\wedge\omega_{2}]\neq0$ で、$\Psi$ は単射なので $\Psi[\omega_{1}\wedge\omega_{2}]\neq0$。よって積が $0$ であることと $ad-bc=0$ は同値。（\ref{mfd:torus-cup-product} の 2 サイクル $c$ の上の積分で見ると、$\int_{c}\alpha\wedge\beta=4\pi^{2}(ad-bc)$ である。）
:::

::: problem ★★ 標準：$S^{2}\times S^{2}$ のコホモロジー環 {#mfd:ex-drp-2}
$X\defeq S^{2}\times S^{2}$, $\mu_{i}\defeq\mathrm{pr}_{i}^{*}\mu$, $a\defeq[\mu_{1}]$, $b\defeq[\mu_{2}]$ とする。
1. $a^{2}=b^{2}=0$, $ab=ba\neq0$ を示し、$a,b$ が $H^{2}(X)$ の基底であることを示せ。
2. $x\in H^{2}_{\mathrm{sing}}(X;\mathbb{R})$ について、$x\cup x=0$ となるのは $x$ が $\Psi a$ または $\Psi b$ の実数倍のときに限ることを示せ。
3. $X$ のシンプレクティック形式 $\omega$ について、$[\omega]=sa+tb$ と書くと $st\neq0$ であることを示せ。
:::

::: solution
**1.** $a^{2}=[\mathrm{pr}_{1}^{*}(\mu\wedge\mu)]=0$（$\mu\wedge\mu$ は $S^{2}$ の上の 4 形式で $0$）、$b^{2}=0$ も同様。2 形式どうしは外積で可換なので $ab=ba$。$(x,y)\in X$ で $T_{x}S^{2}$ の基底 $u_{1},u_{2}$、$T_{y}S^{2}$ の基底 $v_{1},v_{2}$ をとると、$\mu_{1}$ は $(0,v)$ の形のベクトルを、$\mu_{2}$ は $(u,0)$ の形のベクトルを含む値を $0$ にするので、外積の交代和のうち残る項は一つで
$$
(\mu_{1}\wedge\mu_{2})\bigl((u_{1},0),(u_{2},0),(0,v_{1}),(0,v_{2})\bigr)=\mu(u_{1},u_{2})\,\mu(v_{1},v_{2})\neq0
$$
（\ref{mfd:ex-drc-2} の 1）。よって $\mu_{1}\wedge\mu_{2}$ はコンパクトな $X$ の体積形式で、完全でない（\ref{mfd:stokes-corollaries.3}）。すなわち $ab\neq0$。$sa+tb=0$ なら、$a$ を掛けて $t\,ab=0$、$b$ を掛けて $s\,ab=0$ なので $s=t=0$。\ref{mfd:de-rham-kunneth} と \ref{mfd:sphere-de-rham} から $b_{2}(X)=1\cdot1+0\cdot0+1\cdot1=2$ なので、$a,b$ は基底。

**2.** $\Psi$ は線形同型なので $x=s\Psi a+t\Psi b$ と書ける。\ref{mfd:de-rham-cup} から $x\cup x=\Psi\bigl((sa+tb)^{2}\bigr)=\Psi(s^{2}a^{2}+st(ab+ba)+t^{2}b^{2})=2st\,\Psi(ab)$。$\Psi$ は単射で $ab\neq0$ なので、$x\cup x=0$ と $st=0$ は同値。

**3.** \ref{symp:symplectic-manifold-basic.2}（$\dim X=4$, $k=2$）から $\omega\wedge\omega$ は完全でないので $[\omega]^{2}=(sa+tb)^{2}=2st\,ab\neq0$、よって $st\neq0$。
:::

::: problem ★★★ 発展：3 次元トーラスのコホモロジー環 {#mfd:ex-drp-3}
$T^{3}=(S^{1})^{3}$ の上で $\omega_{i}\defeq\mathrm{pr}_{i}^{*}(\omega_{0}\restriction S^{1})$（$i=1,2,3$）とおく。
1. $\omega_{1}\wedge\omega_{2}\wedge\omega_{3}$ は完全でないことを示せ。
2. $\{[\omega_{i}]\}$ が $H^{1}(T^{3})$ の、$\{[\omega_{i}\wedge\omega_{j}]\}_{i<j}$ が $H^{2}(T^{3})$ の基底であることを示せ。
3. $x,y,z\in H^{1}_{\mathrm{sing}}(T^{3};\mathbb{R})$ について、$x\cup y\cup z\neq0$ と、$x,y,z$ が線形独立であることが同値であることを示せ。
:::

::: solution
**1.** 各 $\omega_{i}$ は閉（$S^{1}$ の 2 形式は $0$、$d$ は引き戻しと可換）。点 $(w_{1},w_{2},w_{3})\in T^{3}$（$w_{i}=(x_{i},y_{i})\in S^{1}$）で、$i$ 番目の成分だけが $(-y_{i},x_{i})\in T_{w_{i}}S^{1}$ である接ベクトルを $V_{i}$ とすると、$\omega_{i}(V_{j})=\delta_{ij}(y_{i}^{2}+x_{i}^{2})=\delta_{ij}$。よって $(\omega_{1}\wedge\omega_{2}\wedge\omega_{3})(V_{1},V_{2},V_{3})=\det(\delta_{ij})=1$ で、$\omega_{123}\defeq\omega_{1}\wedge\omega_{2}\wedge\omega_{3}$ はコンパクトな $T^{3}$ の体積形式。\ref{mfd:stokes-corollaries.3} から完全でない。

**2.** \ref{mfd:prob-dc-torus} から $b_{1}(T^{3})=b_{2}(T^{3})=3$ なので、線形独立性を示せばよい。1 形式について $\omega_{i}\wedge\omega_{i}=0$, $\omega_{i}\wedge\omega_{j}=-\omega_{j}\wedge\omega_{i}$ を使う。$\sum_{i}c_{i}[\omega_{i}]=0$ なら、右から $[\omega_{2}\wedge\omega_{3}]$ を掛けると、$\omega_{2}$ または $\omega_{3}$ が重なる項は $0$ なので $c_{1}[\omega_{123}]=0$、1 から $c_{1}=0$。$[\omega_{3}\wedge\omega_{1}]$, $[\omega_{1}\wedge\omega_{2}]$ を掛けると同様に $c_{2}=c_{3}=0$（$\omega_{2}\wedge\omega_{3}\wedge\omega_{1}=\omega_{3}\wedge\omega_{1}\wedge\omega_{2}=\omega_{123}$）。次に $c_{12}[\omega_{1}\wedge\omega_{2}]+c_{13}[\omega_{1}\wedge\omega_{3}]+c_{23}[\omega_{2}\wedge\omega_{3}]=0$ なら、右から $[\omega_{3}]$, $[\omega_{2}]$, $[\omega_{1}]$ を掛けて、それぞれ $c_{12}[\omega_{123}]=0$, $-c_{13}[\omega_{123}]=0$, $c_{23}[\omega_{123}]=0$。よって $c_{12}=c_{13}=c_{23}=0$。

**3.** $\Psi$ は線形同型なので、2 から $\{\Psi[\omega_{i}]\}$ は $H^{1}_{\mathrm{sing}}(T^{3};\mathbb{R})$ の基底。$x=\sum_{i}a_{i}\Psi[\omega_{i}]$, $y=\sum_{j}b_{j}\Psi[\omega_{j}]$, $z=\sum_{k}c_{k}\Psi[\omega_{k}]$ と書くと、\ref{mfd:de-rham-cup} から
$$
x\cup y\cup z=\Psi\Bigl[\sum_{i,j,k}a_{i}b_{j}c_{k}\,\omega_{i}\wedge\omega_{j}\wedge\omega_{k}\Bigr]=\det\begin{pmatrix}a_{1}&a_{2}&a_{3}\\b_{1}&b_{2}&b_{3}\\c_{1}&c_{2}&c_{3}\end{pmatrix}\Psi[\omega_{123}].
$$
（添字が重なる項は $0$、$(i,j,k)$ が置換なら $\omega_{i}\wedge\omega_{j}\wedge\omega_{k}=\operatorname{sgn}\cdot\omega_{123}$。）1 と $\Psi$ の単射性から $\Psi[\omega_{123}]\neq0$ なので、$x\cup y\cup z\neq0$ と行列式が $0$ でないこと、すなわち係数ベクトル（したがって $x,y,z$）が線形独立であることは同値。
:::
