# ド・ラームの同型と積 {#mfd:page-de-rham-products keywords="multiplicative structure of the de Rham theorem: the de Rham isomorphism carries wedge product to cup product; product on the Cech double complex with sign (-1)^{qp'}, Leibniz rule for the total differential, augmentations are multiplicative, cohomology ring of the torus, torus is not homotopy equivalent to a wedge"}

ド・ラーム・コホモロジーには外積による積 $[\omega]\cdot[\eta]=[\omega\wedge\eta]$（\ref{mfd:de-rham-properties.2}）があり、特異コホモロジーにはカップ積（\ref{at:cup-product}）がある。このページでは、\ref{mfd:de-rham-theorem} の同型（\ref{mfd:de-rham-integration-theorem} の $\Psi$ と同じもの）が**積を保つ**ことを示す：
$$
\Psi([\omega]\cdot[\eta])=\Psi[\omega]\cup\Psi[\eta].
$$

鎖のレベルでは $\int_{\sigma}\omega\wedge\eta$ と $\bigl(I(\omega)\cup I(\eta)\bigr)(\sigma)$ は一致しないので、積分写像を直接調べるのではなく、二重複体の比較に積の構造をのせる。チェック–ド・ラーム二重複体とチェック–特異二重複体のどちらにも、チェック複体のカップ積とたての積を組み合わせた積が入り、二つの添加（形式・特異コチェインの側と、局所定数関数のチェック複体の側）がどちらも積を保つ。比較の同型は二つの添加の合成なので、積を保つ。

## 記法と定義の確認 {#mfd:sec-dp-notation}

::: notation
- 外積と外微分のライプニッツ則は \ref{mfd:exterior-derivative}、ド・ラーム・コホモロジーの積は \ref{mfd:de-rham-properties}。
- カップ積・そのライプニッツ則 $\delta(\varphi\cup\psi)=\delta\varphi\cup\psi+(-1)^{p}\varphi\cup\delta\psi$・コホモロジー環は \ref{at:cup-product}, \ref{at:cup-leibniz}, \ref{at:cohomology-ring}。
- 良い被覆 $\mathcal{U}=\{U_{i}\}_{i\in\mathbb{N}}$（\ref{riem:good-cover-exists}）、$U_{\sigma}\defeq U_{i_{0}}\cap\cdots\cap U_{i_{p}}$（$\sigma=(i_{0},\dots,i_{p})$）。チェックの微分 $(dc)_{i_{0}\cdots i_{p+1}}=\sum_{k}(-1)^{k}c_{i_{0}\cdots\widehat{i_{k}}\cdots i_{p+1}}\restriction U_{i_{0}\cdots i_{p+1}}$。
- 二重複体の全複体の微分は $D=d+(-1)^{p}\delta$（$d$ はチェックの微分、$\delta$ はたての微分。\ref{at:double-complex-comparison}）。
- 比較の同型 $\alpha_{X}=(\iota_{X}^{*})^{-1}\eta_{X}^{*}$ と、\ref{mfd:de-rham-theorem} の同型 $\Phi_{\mathcal{U}}=(\rho^{*})^{-1}\alpha_{K'}^{-1}\alpha_{K}$、$\Phi_{\mathcal{U}}=\Psi$ は \ref{mfd:de-rham-integration-theorem} の証明（Step 3・5）。$K$ はチェック–ド・ラーム、$K'$ はチェック–特異（実係数）の二重複体、$\rho\colon S^{\bullet}(M;\mathbb{R})\to S^{\bullet}_{\mathcal{U}}(M;\mathbb{R})$ は $\mathcal{U}$ 小な単体への制限。
- 積の写像 $f$ が**乗法的**とは $f(xy)=f(x)f(y)$ のこと。乗法的な全単射の逆写像は乗法的である（$f^{-1}(ab)=f^{-1}(f(f^{-1}a)f(f^{-1}b))=f^{-1}(a)f^{-1}(b)$）。
:::

## 二重複体の積 {#mfd:sec-dp-product}

::: definition 乗法的な係数系 {#mfd:multiplicative-coefficients keywords="a system assigning to each open set a cochain complex with a bilinear product satisfying the Leibniz rule, with restrictions that are multiplicative cochain maps; differential forms with wedge; singular cochains with cup product" index="乗法的な係数系|じょうほうてきなけいすうけい"}
$M$ の開集合 $V$ ごとに、実ベクトル空間の余鎖複体 $A^{\bullet}(V)$（次数 $\ge0$、微分 $\delta$）と双線形な積 $A^{q}(V)\times A^{q'}(V)\to A^{q+q'}(V)$ が与えられ、
1. （ライプニッツ則）$\delta(xy)=\delta x\cdot y+(-1)^{q}x\cdot\delta y$（$x\in A^{q}(V)$）、
2. 開集合 $V'\subset V$ への制限 $A^{\bullet}(V)\to A^{\bullet}(V')$ が余鎖写像で積を保ち、$V''\subset V'\subset V$ について制限の合成は制限、

を満たすとき、**乗法的な係数系**という。結合法則や可換性は仮定しない。
:::

::: example
1. $A^{\bullet}(V)=\Omega^{\bullet}(V)$、積は外積、$\delta$ は外微分。ライプニッツ則は \ref{mfd:exterior-derivative.2}、制限が外微分と可換なのは \ref{mfd:exterior-derivative.4}、外積と可換なのは引き戻しの性質（\ref{mfd:pullback-properties}）。
2. $A^{\bullet}(V)=S^{\bullet}(V;\mathbb{R})$、積はカップ積。ライプニッツ則は \ref{at:cup-leibniz}。制限は包含 $j\colon V'\to V$ の $j^{\#}$ で、$(j^{\#}(\varphi\cup\psi))(\sigma)=\varphi(\text{前面}(j\sigma))\psi(\text{後面}(j\sigma))=(j^{\#}\varphi\cup j^{\#}\psi)(\sigma)$（$j\sigma$ の前面・後面は $\sigma$ の前面・後面を $j$ で写したもの）。
:::

::: lemma 全複体の積とライプニッツ則 {#mfd:tot-product-leibniz keywords="on K^{p,q} = prod A^q(U_sigma) define (a.b)_{i_0...i_{p+p'}} = (-1)^{q p'} a_{i_0...i_p} b_{i_p...i_{p+p'}}; then D(ab) = Da.b + (-1)^{p+q} a.Db for D = d + (-1)^p delta; the product descends to H(Tot K)" index="二重複体の積|にじゅうふくたいのせき"}
乗法的な係数系 $A$ について $K^{p,q}\defeq\prod_{\sigma\in\mathbb{N}^{p+1}}A^{q}(U_{\sigma})$ とし、$a\in K^{p,q}$, $b\in K^{p',q'}$ について
$$
(a\cdot b)_{i_{0}\cdots i_{p+p'}}\defeq(-1)^{qp'}\,a_{i_{0}\cdots i_{p}}\restriction U_{i_{0}\cdots i_{p+p'}}\cdot b_{i_{p}\cdots i_{p+p'}}\restriction U_{i_{0}\cdots i_{p+p'}}
$$
と定め、全複体に双線形に延ばす。このとき
$$
D(a\cdot b)=Da\cdot b+(-1)^{p+q}a\cdot Db,
$$
したがってこの積は $H(\mathrm{Tot}K)$ の双線形な積を誘導する。
:::

::: proof
符号のない積 $(a\smile b)_{i_{0}\cdots i_{p+p'}}\defeq a_{i_{0}\cdots i_{p}}b_{i_{p}\cdots i_{p+p'}}$（制限は省略）を使うと $a\cdot b=(-1)^{qp'}a\smile b$。以下、成分の積はすべて $U_{i_{0}\cdots i_{N}}$ に制限してとる（制限は積を保ち、制限の合成は制限なので、どの順で制限してもよい）。

**Step 1（チェック方向）.** 【主張：$d(a\smile b)=da\smile b+(-1)^{p}a\smile db$】$N\defeq p+p'+1$ とする。
$$
d(a\smile b)_{i_{0}\cdots i_{N}}=\sum_{k=0}^{N}(-1)^{k}(a\smile b)_{i_{0}\cdots\widehat{i_{k}}\cdots i_{N}}.
$$
$k\le p$ の項は $a_{i_{0}\cdots\widehat{i_{k}}\cdots i_{p+1}}b_{i_{p+1}\cdots i_{N}}$、$k\ge p+1$ の項は $a_{i_{0}\cdots i_{p}}b_{i_{p}\cdots\widehat{i_{k}}\cdots i_{N}}$ である。一方
$$
(da\smile b)_{i_{0}\cdots i_{N}}=\sum_{k=0}^{p+1}(-1)^{k}a_{i_{0}\cdots\widehat{i_{k}}\cdots i_{p+1}}b_{i_{p+1}\cdots i_{N}}
$$
は、$k\le p$ の項で上と一致し、余分な項 $(-1)^{p+1}a_{i_{0}\cdots i_{p}}b_{i_{p+1}\cdots i_{N}}$ をもつ。また
$$
(-1)^{p}(a\smile db)_{i_{0}\cdots i_{N}}=\sum_{l=0}^{p'+1}(-1)^{p+l}a_{i_{0}\cdots i_{p}}b_{i_{p}\cdots\widehat{i_{p+l}}\cdots i_{N}}
$$
は、$l\ge1$ の項が上の $k=p+l$ の項と一致し、$l=0$ の項 $(-1)^{p}a_{i_{0}\cdots i_{p}}b_{i_{p+1}\cdots i_{N}}$ が余分な項を打ち消す。

**Step 2（たて方向）.** $\delta$ は成分ごとで制限と可換なので、成分ごとのライプニッツ則から $\delta(a\smile b)=\delta a\smile b+(-1)^{q}a\smile\delta b$。

**Step 3（符号の照合）.** $D(a\cdot b)$ と右辺を、$da\smile b$, $a\smile db$, $\delta a\smile b$, $a\smile\delta b$ の係数で比べる。$a\cdot b\in K^{p+p',q+q'}$ なので
$$
D(a\cdot b)=(-1)^{qp'}\bigl(da\smile b+(-1)^{p}a\smile db\bigr)+(-1)^{p+p'+qp'}\bigl(\delta a\smile b+(-1)^{q}a\smile\delta b\bigr).
$$
右辺は、$da\in K^{p+1,q}$, $\delta a\in K^{p,q+1}$, $db\in K^{p'+1,q'}$, $\delta b\in K^{p',q'+1}$ に注意して
$$
\begin{aligned}
Da\cdot b&=(-1)^{qp'}da\smile b+(-1)^{p}(-1)^{(q+1)p'}\delta a\smile b,\\
(-1)^{p+q}a\cdot Db&=(-1)^{p+q}(-1)^{q(p'+1)}a\smile db+(-1)^{p+q}(-1)^{p'}(-1)^{qp'}a\smile\delta b.
\end{aligned}
$$
係数はそれぞれ $da\smile b$：$(-1)^{qp'}$、$a\smile db$：$(-1)^{p+qp'}$、$\delta a\smile b$：$(-1)^{p+p'+qp'}$、$a\smile\delta b$：$(-1)^{p+q+p'+qp'}$ で、両辺で一致する。

**Step 4（コホモロジーへ）.** $Da=Db=0$ なら $D(a\cdot b)=0$。$a=Dx$, $Db=0$ なら $a\cdot b=D(x\cdot b)$、$Da=0$, $b=Dy$ なら $a\cdot b=\pm D(a\cdot y)$。よって $[a]\cdot[b]\defeq[a\cdot b]$ は代表元によらない（全次数ごとに双線形に延ばしたものに同じ議論を使う）。

::: hypcheck
- 符号 $(-1)^{qp'}$ は、$b$ のチェック次数 $p'$ と $a$ のたての次数 $q$ を「入れ替える」符号で、Step 3 の照合でちょうど必要になる。符号をつけない積ではライプニッツ則は一般に成り立たない（$\delta a\smile b$ の係数がずれる）。
- 積の結合法則や可換性は使っていない。
:::
:::

::: lemma 添加は積を保つ {#mfd:augmentations-multiplicative keywords="eta: A(M) -> K^{0,*} and iota: C(U, R) -> K^{*,0} are multiplicative cochain maps; the product on the Cech complex of locally constant functions" index="添加と積|てんかとせき"}
$A$ を乗法的な係数系、$K$ を上の二重複体とする。
1. 大域的な $R^{\bullet}$（$A^{\bullet}(M)$、または $A=S^{\bullet}(-;\mathbb{R})$ のときは $\mathcal{U}$ 小なコチェイン $S^{\bullet}_{\mathcal{U}}(M;\mathbb{R})$ とカップ積）から各 $U_{i}$ への制限 $\eta\colon R^{\bullet}\to K^{0,\bullet}$ は積を保つ。
2. $A^{0}(V)$ が「$V$ 上の実数値関数」を含み、定数関数 $1$ が単位元で、局所定数関数どうしの積が値の積であるとき（例 1・2 はどちらもそう：特異 $0$ コチェインは点の上の関数で、$0$ コチェインどうしのカップ積は値の積）、$C^{p}\defeq\prod_{\sigma}\underline{\mathbb{R}}(U_{\sigma})$ は積で閉じ、包含 $\iota\colon C^{\bullet}\to K^{\bullet,0}$ は積を保つ。$C^{\bullet}$ 上の積は
$$
(c\cdot c')_{i_{0}\cdots i_{p+p'}}=c_{i_{0}\cdots i_{p}}c'_{i_{p}\cdots i_{p+p'}}
$$
（局所定数関数の値の積を制限したもの）で、$A$ によらない。
:::

::: proof
**1.** $\eta(x)\in K^{0,q}$, $\eta(y)\in K^{0,q'}$ で $p'=0$ なので符号は $+1$、成分 $i_{0}$ は $(x\restriction U_{i_{0}})(y\restriction U_{i_{0}})=(xy)\restriction U_{i_{0}}$（制限は積を保つ）。$\mathcal{U}$ 小なコチェインについては、$\mathcal{U}$ 小な単体の前面・後面も $\mathcal{U}$ 小なので、カップ積が同じ式で定義され、$\rho$ と $\eta$ はどちらも積を保つ。

**2.** $q=q'=0$ なので符号は $+1$。局所定数関数の制限は局所定数関数で、積も局所定数関数なので $C$ は閉じていて、式はそのまま $\iota$ が積を保つことを言っている。
:::

## 積の保存 {#mfd:sec-dp-theorem}

::: theorem ド・ラームの同型は積を保つ {#mfd:de-rham-cup keywords="the de Rham isomorphism H_dR(M) -> H(M;R) is a ring isomorphism: it carries the wedge product to the cup product" index="ド・ラームの同型と積|どらーむのどうけいとせき, 外積とカップ積|がいせきとかっぷせき"}
可微分多様体 $M$ について、\ref{mfd:de-rham-integration-theorem} の同型 $\Psi\colon H^{\bullet}_{\mathrm{dR}}(M)\to H^{\bullet}_{\mathrm{sing}}(M;\mathbb{R})$ は環の同型である：
$$
\Psi([\omega]\cdot[\eta])=\Psi[\omega]\cup\Psi[\eta],\qquad\Psi(1)=1.
$$
:::

::: proof
$\dim M=0$ なら、どちらの環も $M$ 上の実数値関数の環（値ごとの積）で $\Psi$ は恒等写像（0 コチェインのカップ積は値の積）。以下 $\dim M\ge1$ とし、\ref{riem:good-cover-exists} の良い被覆 $\mathcal{U}$ を一つとる。

**Step 1（二つの二重複体の積）.** 例 1 から $K^{p,q}=\prod\Omega^{q}(U_{\sigma})$ に、例 2 から $K'^{p,q}=\prod S^{q}(U_{\sigma};\mathbb{R})$ に、\ref{mfd:tot-product-leibniz} の積が入り、$H(\mathrm{Tot}K)$, $H(\mathrm{Tot}K')$ の積を誘導する。$C^{\bullet}$ はどちらにも \ref{mfd:augmentations-multiplicative.2} の同じ積で入る。$C^{\bullet}$ 上の積は全複体の積の制限なので $C^{\bullet}$ のライプニッツ則をみたし、$H(C)$ の積を誘導する。

**Step 2（$\alpha$ は乗法的）.** \ref{mfd:augmentations-multiplicative} から、$\eta_{K}\colon\Omega^{\bullet}(M)\to\mathrm{Tot}K$, $\iota_{K}\colon C^{\bullet}\to\mathrm{Tot}K$, $\eta_{K'}\colon S^{\bullet}_{\mathcal{U}}(M;\mathbb{R})\to\mathrm{Tot}K'$, $\iota_{K'}\colon C^{\bullet}\to\mathrm{Tot}K'$ は積を保つ余鎖写像なので、コホモロジーでも積を保つ（$\eta^{*}([x][y])=[\eta(xy)]=[\eta x\cdot\eta y]=\eta^{*}[x]\cdot\eta^{*}[y]$）。どれも同型（\ref{at:double-complex-comparison}）なので、$\alpha_{K}=(\iota_{K}^{*})^{-1}\eta_{K}^{*}$ と $\alpha_{K'}=(\iota_{K'}^{*})^{-1}\eta_{K'}^{*}$ は乗法的な全単射（乗法的な全単射の逆は乗法的）。

**Step 3（$\rho$ は乗法的）.** $\rho$ はカップ積を保つ（\ref{mfd:augmentations-multiplicative.1}）同型なので、$\rho^{*}$ は乗法的な全単射。

**Step 4（結論）.** $\Psi=\Phi_{\mathcal{U}}=(\rho^{*})^{-1}\alpha_{K'}^{-1}\alpha_{K}$（\ref{mfd:de-rham-integration-theorem.3}）は乗法的な全単射の合成なので乗法的。単位元：定数関数 $1\in\Omega^{0}(M)$ も、すべての点で $1$ をとる $0$ コチェインも、それぞれの単位元で、$\alpha_{K}$, $\alpha_{K'}$ はどちらも $1$ を $C^{0}$ の $(1)_{i}$ に写す。

::: hypcheck
- **良い被覆**：二重複体の比較（\ref{at:double-complex-comparison}）が同型であることに使った。積の構造そのものは任意の開被覆で定義できる。
- **実係数**：外積が実数値なので。特異コチェインの側の議論（\ref{mfd:tot-product-leibniz}）は任意の可換環の係数で通る。
- 鎖のレベルでは $I(\omega\wedge\eta)\neq I(\omega)\cup I(\eta)$ である（$I$ は余鎖写像だが積を保たない）。この証明は $I$ を経由せず、$\Psi=\Phi_{\mathcal{U}}$ を使って二重複体の側で積を比べた。
- 結合法則・可換性は使っていない。とくに、コホモロジーのカップ積が次数付き可換であること（\ref{at:cup-graded-commutative}）は、外積の次数付き可換性から（実係数では）この定理によっても従う。
:::
:::

::: example トーラスの積 {#mfd:torus-cup-product keywords="on the torus T^2 the classes of the angle forms d theta_1, d theta_2 have nonzero product; the corresponding singular classes have nonzero cup product" index="トーラスのコホモロジー環|とーらすのこほもろじーかん"}
$\omega\defeq(-y\,dx+x\,dy)\restriction S^{1}$ とし、$T^{2}=S^{1}\times S^{1}$ の上で $\omega_{i}\defeq\mathrm{pr}_{i}^{*}\omega$（$i=1,2$）とおく。$\omega_{i}$ は閉形式（$S^{1}$ 上の 2 形式は $0$ なので $d\omega=0$、$d$ は引き戻しと可換）で、$[\omega_{1}]\cdot[\omega_{2}]=[\omega_{1}\wedge\omega_{2}]\neq0$。したがって $\Psi[\omega_{1}]\cup\Psi[\omega_{2}]\neq0$（$H^{2}_{\mathrm{sing}}(T^{2};\mathbb{R})$ の中で）。
:::

::: proof
**Step 1（滑らかな 2 サイクル）.** $F\colon\mathbb{R}^{2}\to T^{2}$, $F(s,t)\defeq\bigl((\cos2\pi s,\sin2\pi s),(\cos2\pi t,\sin2\pi t)\bigr)$ は滑らかで、$F(s+1,t)=F(s,t+1)=F(s,t)$。$\mathbb{R}^{2}$ の点 $0$, $e_{1}$, $e_{2}$, $e_{12}\defeq e_{1}+e_{2}$ と、頂点を順に写すアフィン単体を使い
$$
c\defeq F\circ[0,e_{1},e_{12}]-F\circ[0,e_{2},e_{12}]
$$
とおく（滑らかな 2 鎖、\ref{mfd:smooth-simplex-basics.1}）。$\partial[a,b,c]=[b,c]-[a,c]+[a,b]$ から
$$
\partial c=F[e_{1},e_{12}]+F[0,e_{1}]-F[e_{2},e_{12}]-F[0,e_{2}].
$$
周期性から $F[e_{1},e_{12}](u)=F(1,u)=F(0,u)=F[0,e_{2}](u)$、$F[e_{2},e_{12}](u)=F(u,1)=F(u,0)=F[0,e_{1}](u)$ なので $\partial c=0$。

**Step 2（積分）.** $(\cos2\pi s,\sin2\pi s)$ による $\omega$ の引き戻しは $2\pi\,ds$（\ref{mfd:prob-di-circle-period} の計算）なので、$F^{*}(\omega_{1}\wedge\omega_{2})=4\pi^{2}\,ds\wedge dt$。$\lambda(x_{1},x_{2})\defeq x_{1}e_{1}+x_{2}e_{12}=(x_{1}+x_{2},x_{2})$ は行列式 $1$、$\mu(x_{1},x_{2})\defeq x_{1}e_{2}+x_{2}e_{12}=(x_{2},x_{1}+x_{2})$ は行列式 $-1$ のアフィン写像で、$\Delta^{2}$ の面積は $\frac12$。よって
$$
\int_{c}\omega_{1}\wedge\omega_{2}=4\pi^{2}\cdot\tfrac12-4\pi^{2}\cdot\bigl(-\tfrac12\bigr)=4\pi^{2}\neq0.
$$

**Step 3（結論）.** $\omega_{1}\wedge\omega_{2}=d\theta$ なら、単体上のストークスの定理（\ref{mfd:stokes-simplex}）から $\int_{c}d\theta=\int_{\partial c}\theta=0$ となり矛盾。よって $[\omega_{1}\wedge\omega_{2}]\neq0$ で、\ref{mfd:de-rham-cup} と $\Psi$ の単射性から $\Psi[\omega_{1}]\cup\Psi[\omega_{2}]=\Psi[\omega_{1}\wedge\omega_{2}]\neq0$。
:::

::: supplement
**高い視点：可換な模型.** 特異コチェインのカップ積は結合的だが、鎖のレベルでは次数付き可換ではなく、可換性はコホモロジーで初めて成り立つ（\ref{at:cup-graded-commutative}）。$\mathbb{Z}/2$ 係数では、この「可換性のずれ」からスティーンロッドの平方作用素が生まれ、どう工夫しても可換な鎖のレベルの模型は作れないことが知られている。実係数では、微分形式の外積は鎖のレベルで厳密に次数付き可換であり、ド・ラームの定理（と積の保存）は、特異コチェインの代数を「厳密に可換な代数」$\Omega^{\bullet}(M)$ で置き換えてよいことを言っている。この考えを推し進めて、有理係数の可換な模型から空間の有理ホモトピー型を読み取るのがサリヴァンの理論である（知られている。本サイト未収録）。比喩で言えば、カップ積は「左右の手で持ち方が違う掛け算」で、外積は「どちらの手で持っても同じ掛け算」であり、ド・ラームの定理は、実数の世界ではこの持ち替えのずれが目に見える結果を何も生まないことを保証する。

**別の証明.** 積分写像 $I$ が、コホモロジーのレベルで積を保つことを直接示す方法もある：$\Omega^{\bullet}\otimes\Omega^{\bullet}$ と $S^{\bullet}_{\infty}\otimes S^{\bullet}_{\infty}$ を比較する非輪状模型の議論（Bredon『Topology and Geometry』V.9 など）。ここでは二重複体の比較をそのまま使った。
:::

## 問題 {#mfd:sec-dp-problems}

::: problem {#mfd:prob-dp-torus-h1}
\ref{mfd:torus-cup-product} の記号で、$\gamma_{1}\defeq F\circ[0,e_{1}]$, $\gamma_{2}\defeq F\circ[0,e_{2}]$ は滑らかな 1 サイクルで、$\int_{\gamma_{i}}\omega_{j}=2\pi\delta_{ij}$ であることを示せ。これから $[\omega_{1}]$, $[\omega_{2}]$ が $H^{1}_{\mathrm{dR}}(T^{2})$ で線形独立であることを導け。
:::

::: solution
$\partial\gamma_{1}=F(e_{1})-F(0)=0$（周期性）、$\gamma_{2}$ も同様。$\gamma_{1}(u)=F(u,0)$ で、$\mathrm{pr}_{1}\circ\gamma_{1}(u)=(\cos2\pi u,\sin2\pi u)$, $\mathrm{pr}_{2}\circ\gamma_{1}$ は定値。$\gamma_{1}^{*}\omega_{1}=(\mathrm{pr}_{1}\circ\gamma_{1})^{*}\omega=2\pi\,du$、$\gamma_{1}^{*}\omega_{2}=(\mathrm{pr}_{2}\circ\gamma_{1})^{*}\omega=0$（定値写像の引き戻し）。よって $\int_{\gamma_{1}}\omega_{1}=2\pi$, $\int_{\gamma_{1}}\omega_{2}=0$。$\gamma_{2}$ も同様。$a[\omega_{1}]+b[\omega_{2}]=0$ なら $a\omega_{1}+b\omega_{2}=df$ で、$\gamma_{i}$ の上の積分は $\int_{\partial\gamma_{i}}f=0$（\ref{mfd:stokes-simplex}）なので、$2\pi a=2\pi b=0$。
:::

::: problem {#mfd:prob-dp-torus-wedge}
$X\defeq S^{1}\vee S^{1}\vee S^{2}$ は、$T^{2}$ と実係数のベッチ数（$1,2,1$）が等しいが、$T^{2}$ とホモトピー同値でないことを示せ。$X$ の胞体構造（0 胞体 1 個、1 胞体 2 個、2 胞体 1 個）と胞体コホモロジー（\ref{at:cellular-singular}）を使ってよい。
:::

::: solution
$X$ の胞体鎖複体は、0 胞体が 1 個で 2 胞体の接着写像が定値なので境界写像がすべて $0$ で、$H^{0}=\mathbb{R}$, $H^{1}=\mathbb{R}^{2}$, $H^{2}=\mathbb{R}$。同様に $Y\defeq S^{1}\vee S^{1}$ では $H^{1}(Y;\mathbb{R})=\mathbb{R}^{2}$, $H^{2}(Y;\mathbb{R})=0$。$S^{2}$ を基点に潰す写像 $R\colon X\to Y$ と包含 $J\colon Y\to X$ は $R\circ J=1_{Y}$ をみたすので、$J^{*}R^{*}=1$ で $R^{*}\colon H^{1}(Y)\to H^{1}(X)$ は単射、次元が等しいので同型。よって任意の $x,y\in H^{1}(X;\mathbb{R})$ は $x=R^{*}x'$, $y=R^{*}y'$ と書け、カップ積の自然性（\ref{at:cohomology-ring}）から $x\cup y=R^{*}(x'\cup y')=0$（$H^{2}(Y)=0$）。ホモトピー同値 $h\colon T^{2}\to X$ があれば $h^{*}$ はカップ積を保つ同型なので、$T^{2}$ でも 1 次の類どうしのカップ積がすべて $0$ になるが、これは \ref{mfd:torus-cup-product} に矛盾する。
:::
