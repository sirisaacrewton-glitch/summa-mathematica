# 積分によるド・ラームの同型（別証明） {#mfd:page-de-rham-integration keywords="integration of forms over smooth chains, Stokes theorem for simplices, the integration map Omega(M) -> smooth singular cochains is a cochain map, de Rham's original theorem: integration induces the isomorphism, periods, comparison of three double complexes, independence of the good cover, naturality of the de Rham isomorphism"}

\ref{mfd:de-rham-theorem} は、二重複体を経由した抽象的な同型として示した。ド・ラームのもとの定理は、より具体的に、**閉形式をサイクルの上で積分する写像**がコホモロジーの同型を与える、というものである。このページでは、その写像を定義し、単体上のストークスの定理（\ref{mfd:stokes-simplex}）から余鎖写像になることを示したうえで、それが同型であることを証明する（\ref{mfd:de-rham-integration-theorem}）。滑らかな特異コホモロジーと特異コホモロジーの一致（\ref{mfd:smooth-singular-iso}）を使うので、これはド・ラームの定理の別証明になり、同時に、二重複体で作った同型が良い被覆の選び方によらないこと、滑らかな写像と両立すること（自然性）もわかる。

## 記法と定義の確認 {#mfd:sec-di-notation}

::: notation
- 標準単体 $\Delta^{k}$ と面の埋め込み $\delta^{i}\colon\Delta^{k-1}\to\Delta^{k}$、特異鎖複体と特異コホモロジー（余境界は $\delta\varphi=\varphi\circ\partial$）は \ref{at:simplex}, \ref{at:singular-cohomology}。
- $\Delta^{k}$ を、$(t_{0},\dots,t_{k})\mapsto(t_{1},\dots,t_{k})$ によって $\mathbb{R}^{k}$ の単体 $\{x:x_{i}\ge0,\ \sum x_{i}\le1\}$（頂点 $0,e_{1},\dots,e_{k}$）と同一視し、$\mathbb{R}^{k}$ の標準的な向きを入れる。$k=0$ では $\Delta^{0}$ は 1 点で、$0$ 形式（関数）の 1 点上の積分はその値とする。
- 滑らかな特異単体 $S^{\infty}(M)$、滑らかなコチェイン $S^{\bullet}_{\infty}(M;G)$、制限 $r$、$\mathcal{U}$ 小なもの $S^{\bullet}_{\infty,\mathcal{U}}(M;G)$ は \ref{mfd:smooth-singular-simplex}。$r^{*}$ が同型であることは \ref{mfd:smooth-singular-iso}。
- チェック–ド・ラーム二重複体とその行・列の完全性は \ref{mfd:cech-de-rham-complex}, \ref{mfd:de-rham-theorem} の証明。二重複体の比較は \ref{at:double-complex-comparison}。
- 外微分・引き戻し・ストークスの定理は \ref{mfd:exterior-derivative}, \ref{mfd:pullback-properties}, \ref{mfd:stokes-theorem}。多重積分と変数変換は \ref{calc:fubini}, \ref{calc:change-of-variables}。
:::

## 単体上の積分とストークスの定理 {#mfd:sec-di-stokes}

::: definition 鎖の上の積分 {#mfd:integral-over-chain keywords="integral of a k-form over a smooth singular simplex and over smooth chains; independent of the smooth extension" index="鎖の上の積分|くさりのうえのせきぶん"}
可微分多様体 $M$ の滑らかな特異 $k$ 単体 $\sigma$（\ref{mfd:smooth-singular-simplex}）と $\omega\in\Omega^{k}(M)$ について、延長 $\tilde\sigma\colon W\to M$ をとり
$$
\int_{\sigma}\omega\defeq\int_{\Delta^{k}}\tilde\sigma^{*}\omega,\qquad\int_{\sum a_{j}\sigma_{j}}\omega\defeq\sum_{j}a_{j}\int_{\sigma_{j}}\omega
$$
と定める（右辺は、$\tilde\sigma^{*}\omega=g\,dx_{1}\wedge\cdots\wedge dx_{k}$ のとき $\int_{\Delta^{k}}g$。$g$ は $\Delta^{k}$ の近傍で滑らかで、$\Delta^{k}$ はジョルダン可測なので積分は定義される）。$\Delta^{k}$ の内部の点では $\tilde\sigma$ の微分は $\sigma$ だけで決まり（内部の点の近くで $\tilde\sigma=\sigma$）、境界は測度 $0$ なので、積分は延長の選び方によらない。以下 $\tilde\sigma^{*}\omega$ を $\sigma^{*}\omega$ と書く。$k=0$ では $\int_{\sigma}f=f(\sigma(\ast))$。
:::

::: theorem 単体上のストークスの定理 {#mfd:stokes-simplex keywords="Stokes for smooth simplices: int_sigma d omega = int_{boundary sigma} omega; proof on the standard simplex by Fubini and the fundamental theorem of calculus, face by face" index="単体上のストークスの定理|たんたいじょうのすとーくすのていり"}
$\sigma$ を滑らかな特異 $k$ 単体（$k\ge1$）、$\omega\in\Omega^{k-1}(M)$ とすると
$$
\int_{\sigma}d\omega=\int_{\partial\sigma}\omega.
$$
:::

::: proof
**Step 1（標準単体への帰着）.** $\eta\defeq\sigma^{*}\omega$ は $\Delta^{k}$ の近傍の $(k-1)$ 形式で、$\sigma^{*}d\omega=d\eta$、$(\sigma\circ\delta^{i})^{*}\omega=(\delta^{i})^{*}\eta$。よって示すべきは
$$
\int_{\Delta^{k}}d\eta=\sum_{i=0}^{k}(-1)^{i}\int_{\Delta^{k-1}}(\delta^{i})^{*}\eta.
$$
両辺は $\eta$ について線形なので、$\eta=f\,dx_{1}\wedge\cdots\wedge\widehat{dx_{j}}\wedge\cdots\wedge dx_{k}$（$1\le j\le k$）の場合に示せばよい。$k=1$ では $\eta=f$ は関数で、左辺は $\int_{0}^{1}f'=f(1)-f(0)$、右辺は $\delta^{0}$（$1$ への写像）と $\delta^{1}$（$0$ への写像）から $f(1)-f(0)$。以下 $k\ge2$。

**Step 2（左辺）.** $d\eta=(-1)^{j-1}\partial_{j}f\,dx_{1}\wedge\cdots\wedge dx_{k}$。$x'\defeq(x_{l})_{l\neq j}$ は $\Delta'\defeq\{x'\in\mathbb{R}^{k-1}:x'_{l}\ge0,\ \sum x'_{l}\le1\}$ を動き、$x_{j}$ は $0$ から $1-\sum x'_{l}$ まで動く。\ref{calc:fubini} と微分積分学の基本定理から
$$
\int_{\Delta^{k}}d\eta=(-1)^{j-1}\int_{\Delta'}\Bigl(f\bigl(x_{j}=1-\textstyle\sum x'_{l}\bigr)-f\bigl(x_{j}=0\bigr)\Bigr)dx'.
$$

**Step 3（右辺の各項）.** 面の埋め込み $\delta^{i}$ は、$\Delta^{k-1}$ の頂点を、$\Delta^{k}$ の頂点のうち $e_{i}$ 以外に順に写すアフィン写像である（$\mathbb{R}^{k}$ の座標では、頂点 $e_{0}=0$）。
- $i\notin\{0,j\}$：$\delta^{i}$ の像は超平面 $x_{i}=0$ に含まれ、$(\delta^{i})^{*}dx_{i}=0$。$\eta$ は $dx_{i}$ を含むので（$i\neq j$）、$(\delta^{i})^{*}\eta=0$。
- $i=j$：$\delta^{j}(s)=(s_{1},\dots,s_{j-1},0,s_{j},\dots,s_{k-1})$ なので $(\delta^{j})^{*}\eta=f(x_{j}=0)\,ds_{1}\wedge\cdots\wedge ds_{k-1}$。この項は $(-1)^{j}\int_{\Delta^{k-1}}f(x_{j}=0)\,ds$ で、$s=x'$ なので $(-1)^{j}\int_{\Delta'}f(x_{j}=0)dx'$。
- $i=0$：$\delta^{0}(s)=(1-\sum s_{m},s_{1},\dots,s_{k-1})$（頂点 $e_{0},\dots,e_{k-1}$ を $e_{1},\dots,e_{k}$ に）。$x_{1}=1-\sum s_{m}$, $x_{l}=s_{l-1}$（$l\ge2$）。$j=1$ なら $(\delta^{0})^{*}\eta=f\,ds_{1}\wedge\cdots\wedge ds_{k-1}$。$j\ge2$ なら $dx_{1}=-\sum ds_{m}$ のうち、残りの $dx_{l}$（$l\neq1,j$）に含まれない $ds_{j-1}$ の項だけが残り、$-ds_{j-1}\wedge ds_{1}\wedge\cdots\widehat{ds_{j-1}}\cdots\wedge ds_{k-1}=-(-1)^{j-2}ds_{1}\wedge\cdots\wedge ds_{k-1}$。いずれの場合も $(\delta^{0})^{*}\eta=(-1)^{j-1}f(\delta^{0}(s))\,ds$。像の点では $x_{j}=1-\sum_{l\neq j}x_{l}$ なので、$s\mapsto x'$（$\delta^{0}(s)$ の第 $j$ 以外の座標）は $\Delta^{k-1}$ から $\Delta'$ へのアフィンな全単射で、ヤコビ行列式の絶対値は $1$（座標の置換と $1-\sum$ の形の変換の合成）。変数変換（\ref{calc:change-of-variables}）から、この項は $(-1)^{j-1}\int_{\Delta'}f(x_{j}=1-\sum x'_{l})dx'$。

**Step 4.** Step 3 の項の和は Step 2 の右辺に等しい（$(-1)^{j}=-(-1)^{j-1}$）。
:::

## 積分写像 {#mfd:sec-di-map}

::: proposition 積分写像は余鎖写像 {#mfd:integration-cochain-map keywords="I: Omega^k(M) -> Hom(S^infinity_k(M), R), I(omega)(sigma) = int_sigma omega commutes with differentials: I(d omega) = delta I(omega); it induces I: H^k_dR(M) -> H^k(S^infinity(M); R); integration of closed forms over cycles depends only on classes" index="積分写像（ド・ラーム）|せきぶんしゃぞうどらーむ, 周期（微分形式）|しゅうきびぶんけいしき"}
$I\colon\Omega^{k}(M)\to S^{k}_{\infty}(M;\mathbb{R})=\mathrm{Hom}(S^{\infty}_{k}(M),\mathbb{R})$, $I(\omega)(c)\defeq\int_{c}\omega$ は余鎖写像である：$I(d\omega)=\delta I(\omega)$。したがって $I$ はコホモロジーの線形写像 $H^{k}_{\mathrm{dR}}(M)\to H^{k}(S^{\bullet}_{\infty}(M;\mathbb{R}))$ を誘導する。とくに、閉形式 $\omega$ の滑らかなサイクル $z$ の上の積分 $\int_{z}\omega$（**周期**）は、$\omega$ のコホモロジー類と $z$ のホモロジー類だけで決まる。
:::

::: proof
$I(d\omega)(\sigma)=\int_{\sigma}d\omega=\int_{\partial\sigma}\omega=I(\omega)(\partial\sigma)=(\delta I(\omega))(\sigma)$（\ref{mfd:stokes-simplex}）。余鎖写像はコホモロジーの写像を誘導する。周期：$\omega=d\eta$ なら $\int_{z}d\eta=\int_{\partial z}\eta=0$、$z=\partial c$ なら $\int_{\partial c}\omega=\int_{c}d\omega=0$。
:::

::: theorem ド・ラームの定理（積分の形） {#mfd:de-rham-integration-theorem keywords="the integration map induces an isomorphism H^k_dR(M) -> H^k(S_infinity(M); R), hence H^k_dR(M) = H^k(M; R) via restriction of singular cochains; it agrees with the double complex isomorphism for every good cover, which is therefore independent of the cover" index="ド・ラームの定理（積分の形）|どらーむのていりせきぶんのかたち"}
可微分多様体 $M$ について、
1. $I\colon\Omega^{\bullet}(M)\to S^{\bullet}_{\infty}(M;\mathbb{R})$ はすべての次数でコホモロジーの同型を誘導する。
2. したがって $\Psi\defeq(r^{*})^{-1}\circ I^{*}\colon H^{k}_{\mathrm{dR}}(M)\to H^{k}_{\mathrm{sing}}(M;\mathbb{R})$ は同型である。$[\omega]$ の像は「滑らかなサイクルの上の積分で決まる類」：$\Psi[\omega]$ を $r^{*}$ で移したものは $[\sigma\mapsto\int_{\sigma}\omega]$。
3. $\Psi$ は、\ref{riem:good-cover-exists} のどの良い被覆 $\mathcal{U}$ から作った \ref{mfd:de-rham-theorem} の同型とも一致する。とくに \ref{mfd:de-rham-theorem} の同型は $\mathcal{U}$ の選び方によらない。
:::

::: proof
$\dim M=0$ なら、$\Omega^{0}(M)$ も $S^{0}_{\infty}(M;\mathbb{R})=S^{0}(M;\mathbb{R})$ も $M$ 上の関数全体で $I$ は恒等写像、$k\ge1$ では両辺とも $0$（$\Omega^{k}=0$、また $M$ の単体は定値なので $S^{\bullet}(M;\mathbb{R})$ は 1 点の複体の直積で、高次のコホモロジーは $0$）。3 は、\ref{mfd:de-rham-theorem} の証明の $\dim M=0$ の場合も同じ同一視なので成り立つ。以下 $n\defeq\dim M\ge1$。

**Step 1（三つの二重複体）.** \ref{riem:good-cover-exists} の良い被覆 $\mathcal{U}=\{U_{i}\}_{i\in\mathbb{N}}$ を一つとり、
- $K^{p,q}\defeq\prod_{\sigma}\Omega^{q}(U_{\sigma})$（チェック–ド・ラーム、\ref{mfd:cech-de-rham-complex}）、
- $L^{p,q}\defeq\prod_{\sigma}S^{q}_{\infty}(U_{\sigma};\mathbb{R})$（チェック–滑らかな特異、\ref{mfd:smooth-singular-iso} の証明）、
- $K'^{p,q}\defeq\prod_{\sigma}S^{q}(U_{\sigma};\mathbb{R})$（チェック–特異、\ref{at:cech-good-cover} の証明）

とおく（$\sigma\in\mathbb{N}^{p+1}$）。行の添加は順に $R_{K}=\Omega^{\bullet}(M)$, $R_{L}=S^{\bullet}_{\infty,\mathcal{U}}(M;\mathbb{R})$, $R_{K'}=S^{\bullet}_{\mathcal{U}}(M;\mathbb{R})$（各 $U_{i}$ への制限 $\eta$ で）、列の添加はどれも $C^{p}=\prod_{\sigma}\underline{\mathbb{R}}(U_{\sigma})$（定数関数）である。三つとも、添加した行と列は完全：$K$ は \ref{mfd:de-rham-theorem} の Step 3・4、$L$ と $K'$ は \ref{mfd:smooth-singular-iso} の Step 3・5。

**Step 2（$I$ は二重複体の写像）.** 成分ごとの積分 $I_{\sigma}\colon\Omega^{q}(U_{\sigma})\to S^{q}_{\infty}(U_{\sigma};\mathbb{R})$ を並べた $I\colon K\to L$ を考える。
- 列の微分と可換：\ref{mfd:integration-cochain-map} を多様体 $U_{\sigma}$ に使う。
- 行の微分と可換：チェックの微分は制限の符号付きの和で、$I$ は線形なので、制限と可換であればよい。開集合 $V'\subset V$、$\omega\in\Omega^{q}(V)$、$V'$ の滑らかな単体 $\tau$ について、$\tau^{*}(\omega\restriction V')=\tau^{*}\omega$（引き戻しは $\tau$ の像の近くの値だけで決まる）なので $\int_{\tau}(\omega\restriction V')=\int_{\tau}\omega$。
- 添加と可換：$R_{K}\to R_{L}$ を $r'\circ I_{M}$（$r'\colon S^{\bullet}_{\infty}(M;\mathbb{R})\to S^{\bullet}_{\infty,\mathcal{U}}(M;\mathbb{R})$ は $\mathcal{U}$ 小な単体への制限）とすると、上と同じ理由で $\eta\circ r'\circ I_{M}=I\circ\eta$。$C^{p}$ の上では、定数関数 $c$ の $0$ 単体（点）の上の積分は $c$ なので、$I\circ\iota_{K}=\iota_{L}$。

同様に、成分ごとの制限 $r\colon K'\to L$ は二重複体の写像で、$\eta\circ r_{\mathcal{U}}=r\circ\eta$, $r\circ\iota_{K'}=\iota_{L}$（\ref{mfd:smooth-singular-iso} の Step 3・4）。

**Step 3（比較の写像）.** $X=K,L,K'$ について、$\alpha_{X}\defeq(\iota_{X}^{*})^{-1}\circ\eta_{X}^{*}\colon H(R_{X})\to H(C)$ とおく（\ref{at:double-complex-comparison} から同型）。Step 2 から $\mathrm{Tot}(I)\circ\eta_{K}=\eta_{L}\circ r'I_{M}$, $\mathrm{Tot}(I)\circ\iota_{K}=\iota_{L}$ なので
$$
\alpha_{L}\circ(r'I_{M})^{*}=(\iota_{L}^{*})^{-1}\mathrm{Tot}(I)^{*}\eta_{K}^{*}=(\iota_{L}^{*})^{-1}\mathrm{Tot}(I)^{*}\iota_{K}^{*}\alpha_{K}=(\iota_{L}^{*})^{-1}\iota_{L}^{*}\alpha_{K}=\alpha_{K}.
$$
同様に $\alpha_{L}\circ r_{\mathcal{U}}^{*}=\alpha_{K'}$。

**Step 4（1 と 2）.** Step 3 から $(r'I_{M})^{*}=\alpha_{L}^{-1}\alpha_{K}$ は同型。$r'^{*}$ は \ref{mfd:smooth-small-simplices.2} から同型なので、$I_{M}^{*}=(r'^{*})^{-1}(r'I_{M})^{*}$ も同型。$r^{*}$ は \ref{mfd:smooth-singular-iso} から同型なので、$\Psi$ は同型。像の記述は定義そのもの。

**Step 5（3）.** \ref{mfd:de-rham-theorem} の同型は、$\rho\colon S^{\bullet}(M;\mathbb{R})\to S^{\bullet}_{\mathcal{U}}(M;\mathbb{R})$ を制限として
$$
\Phi_{\mathcal{U}}\defeq(\rho^{*})^{-1}\circ\alpha_{K'}^{-1}\circ\alpha_{K}
$$
である（その Step 5 が $\alpha_{K}$、Step 6 で使った \ref{at:cech-good-cover} の証明が $\alpha_{K'}$ と (S) の $\rho^{*}$）。制限どうしの合成として $r_{\mathcal{U}}\circ\rho=r'\circ r$ なので、Step 3 から
$$
\alpha_{K'}\circ\rho^{*}=\alpha_{L}\circ r_{\mathcal{U}}^{*}\circ\rho^{*}=\alpha_{L}\circ r'^{*}\circ r^{*},\qquad\alpha_{K}=\alpha_{L}\circ r'^{*}\circ I_{M}^{*}.
$$
よって
$$
\Phi_{\mathcal{U}}=(\alpha_{L}r'^{*}r^{*})^{-1}\alpha_{L}r'^{*}I_{M}^{*}=(r^{*})^{-1}I_{M}^{*}=\Psi.
$$
右辺は $\mathcal{U}$ によらない。

::: hypcheck
- **良い被覆**：Step 1 の三つの二重複体の列の完全性（ポアンカレの補題、滑らかな可縮化、可縮性）に使った。結論の $\Psi$ は被覆を含まない式で、被覆は証明の道具にすぎない（3）。
- **ストークスの定理**：Step 2 で $I$ が列の微分と可換であることに使った。これがこの証明の「解析の部分」で、残りはすべてホモロジー代数。
- **係数が実数**：積分の値が実数なので、得られるのは実係数。
- **選択公理**：\ref{mfd:de-rham-theorem} と \ref{mfd:smooth-singular-iso} の中で可算選択公理を使う（可縮化の選択）。
:::
:::

::: corollary ド・ラームの同型の自然性 {#mfd:de-rham-naturality keywords="the de Rham isomorphism commutes with pullback along smooth maps: Psi_M o f^* = f^* o Psi_N" index="ド・ラームの同型の自然性|どらーむのどうけいのしぜんせい"}
滑らかな写像 $f\colon M\to N$ について、$\Psi_{M}\circ f^{*}=f^{*}\circ\Psi_{N}\colon H^{k}_{\mathrm{dR}}(N)\to H^{k}_{\mathrm{sing}}(M;\mathbb{R})$（左の $f^{*}$ は形式の引き戻し、右の $f^{*}$ は特異コホモロジーの誘導写像）。
:::

::: proof
$\omega\in\Omega^{k}(N)$ と $M$ の滑らかな単体 $\sigma$ について、$\sigma^{*}f^{*}\omega=(f\circ\sigma)^{*}\omega$（\ref{mfd:pullback-properties}）なので $\int_{\sigma}f^{*}\omega=\int_{f\circ\sigma}\omega$、すなわち余鎖のレベルで $I_{M}\circ f^{*}=f^{\#}\circ I_{N}$。また $r\circ f^{\#}=f^{\#}\circ r$（\ref{mfd:smooth-simplex-basics.3}）。コホモロジーに移ると $I_{M}^{*}f^{*}=f^{*}I_{N}^{*}$, $r_{M}^{*}f^{*}=f^{*}r_{N}^{*}$ で、後者から $(r_{M}^{*})^{-1}f^{*}=f^{*}(r_{N}^{*})^{-1}$。合わせて $\Psi_{M}f^{*}=(r_{M}^{*})^{-1}I_{M}^{*}f^{*}=(r_{M}^{*})^{-1}f^{*}I_{N}^{*}=f^{*}(r_{N}^{*})^{-1}I_{N}^{*}=f^{*}\Psi_{N}$。
:::

::: supplement
**高い視点：ストークスの定理は双対性.** 積分は、鎖 $c$ と形式 $\omega$ の対 $\langle c,\omega\rangle\defeq\int_{c}\omega$ で、ストークスの定理 $\langle\partial c,\omega\rangle=\langle c,d\omega\rangle$ は、境界作用素 $\partial$ と外微分 $d$ がこの対について互いの随伴であることを言っている。ド・ラームの定理（積分の形）は、この対がホモロジーとコホモロジーの間の非退化な対 $H_{k}(M;\mathbb{R})\times H^{k}_{\mathrm{dR}}(M)\to\mathbb{R}$ を誘導すること、言い換えると「閉形式はその周期で決まり、任意の周期の組を実現する閉形式がある」ことである。比喩で言えば、形式は「各道や各面に通行料を課す料金表」で、閉形式は「形を少し変えても料金が変わらない料金表」、ド・ラームの定理は「料金表の本質的な違いは、穴の周りを一周するときの料金（周期）だけで測れる」と言っている。

**積.** 鎖のレベルでは $\int_{\sigma}\omega\wedge\eta$ と $(I\omega\cup I\eta)(\sigma)$ は一致しないが、$\Psi$ はコホモロジーのレベルでウェッジ積をカップ積に写す。これは二重複体に積をのせて \see{mfd:de-rham-cup} で示す。
:::

## 問題 {#mfd:sec-di-problems}

::: problem {#mfd:prob-di-circle-period}
$S^{1}\subset\mathbb{R}^{2}$ 上の 1 形式 $\omega=(-y\,dx+x\,dy)$（の制限）について、滑らかな 1 単体 $\sigma(t)=(\cos2\pi t,\sin2\pi t)$（$t\in[0,1]=\Delta^{1}$）はサイクルで、$\int_{\sigma}\omega=2\pi$ であることを示せ。これから $\omega$ は完全でないことを導け。
:::

::: solution
$\partial\sigma=\sigma(1)-\sigma(0)=0$ なのでサイクル。$\sigma^{*}\omega=(\sin^{2}2\pi t+\cos^{2}2\pi t)2\pi\,dt=2\pi\,dt$ で、積分は $2\pi$。$\omega=df$ なら $\int_{\sigma}df=\int_{\partial\sigma}f=0$（\ref{mfd:stokes-simplex}）で矛盾。
:::
