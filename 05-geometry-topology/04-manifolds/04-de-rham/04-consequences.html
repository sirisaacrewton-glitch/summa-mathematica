# ド・ラームの定理の帰結 {#mfd:page-de-rham-consequences keywords="de Rham cohomology of spheres, finite dimensionality for compact manifolds, top degree cohomology of a compact connected oriented manifold is R via integration, a top form is exact iff its integral vanishes, Kunneth formula for Betti numbers, applications: no symplectic form on S^{2n} for n >= 2, Hopf surface is not Kahler"}

\ref{mfd:de-rham-theorem} によって、代数的位相幾何で計算した特異コホモロジーの結果を、微分形式の言葉に移せる。このページでは、球面のド・ラーム・コホモロジー、コンパクトな多様体のコホモロジーの有限次元性、向きづけられたコンパクト連結多様体の最高次のコホモロジーが積分で $\mathbb{R}$ と同一視されること（\ref{mfd:top-de-rham}）、積の多様体のベッチ数（キュネット）を示す。これらは、これまで事実として引用していた主張（\ref{symp:symplectic-manifold-basic} の後の注意、\ref{symp:kahler-examples.5}、\ref{symp:prob-db-volume-moser}）の証明を与える。

## 記法と定義の確認 {#mfd:sec-dc-notation}

::: notation
- \ref{mfd:de-rham-theorem} と \ref{mfd:de-rham-topological-invariance}。良い被覆の存在は \ref{riem:good-cover-exists}。積分とストークスの定理の帰結は \ref{mfd:stokes-corollaries}。
- \ref{at:sphere-homology}、普遍係数定理は \ref{at:uct-cohomology}、閉多様体の最高次ホモロジーは \ref{at:top-homology-closed-manifold}、体係数の \ref{at:kunneth}、係数付きホモロジーは \ref{at:homology-coefficients}。
- $b_{k}(M)\defeq\dim_{\mathbb{R}}H^{k}_{\mathrm{dR}}(M)$（有限のとき）を $k$ 次の**ベッチ数**という。
:::

## 球面と有限次元性 {#mfd:sec-dc-spheres}

::: lemma 実係数のコホモロジーとホモロジー {#mfd:real-cohomology-dual keywords="for any space, H^k(X; R) = Hom(H_k(X; Z), R); in particular dim H^k(X; R) = rank H_k(X; Z) when H_k is finitely generated" index="実係数コホモロジー|じっけいすうこほもろじー"}
任意の空間 $X$ について $H^{k}(X;\mathbb{R})\cong\mathrm{Hom}_{\mathbb{Z}}(H_{k}(X;\mathbb{Z}),\mathbb{R})$。
:::

::: proof
普遍係数定理（\ref{at:uct-cohomology}）の $\mathrm{Ext}^{1}_{\mathbb{Z}}(H_{k-1}(X),\mathbb{R})$ は、$\mathbb{R}$ が可除群（単射的 $\mathbb{Z}$ 加群）なので $0$。
:::

::: proposition 球面のド・ラーム・コホモロジー {#mfd:sphere-de-rham keywords="H^k_dR(S^n) = R for k = 0, n and 0 otherwise (n >= 1); the class of the volume form generates H^n" index="球面のド・ラーム・コホモロジー|きゅうめんのどらーむこほもろじー"}
$n\ge1$ について $H^{k}_{\mathrm{dR}}(S^{n})\cong\mathbb{R}$（$k=0,n$）、$0$（それ以外）。$H^{n}_{\mathrm{dR}}(S^{n})$ は標準計量の体積形式の類で生成される。
:::

::: proof
\ref{mfd:de-rham-theorem} と \ref{mfd:real-cohomology-dual} から $H^{k}_{\mathrm{dR}}(S^{n})\cong\mathrm{Hom}(H_{k}(S^{n}),\mathbb{R})$。\ref{at:sphere-homology} から $H_{k}(S^{n})$ は $k=0,n$ で $\mathbb{Z}$、それ以外で $0$。体積形式は完全でない（\ref{mfd:stokes-corollaries.3}）ので、1 次元の $H^{n}_{\mathrm{dR}}(S^{n})$ の $0$ でない元で、生成元。
:::

::: proposition コンパクトな多様体のコホモロジーは有限次元 {#mfd:compact-finite-dimensional keywords="a compact manifold has a finite good cover, so its de Rham cohomology is finite dimensional; b_k(M) is finite" index="ベッチ数（ド・ラーム）|べっちすうどらーむ, コホモロジーの有限次元性|こほもろじーのゆうげんじげんせい"}
コンパクトな可微分多様体 $M$ のド・ラーム・コホモロジーは、各次数で有限次元である。
:::

::: proof
\ref{riem:good-cover-exists} の証明の Step 2 で、リンデレーフ性の代わりにコンパクト性を使うと、有限個の凸な球からなる良い被覆 $\mathcal{U}=\{U_{0},\dots,U_{N}\}$ がとれる。チェック複体 $C^{p}(\mathcal{U},\underline{\mathbb{R}})=\prod_{(i_{0},\dots,i_{p})}\underline{\mathbb{R}}(U_{i_{0}\cdots i_{p}})$ は各次数で有限次元（成分は $(N+1)^{p+1}$ 個で、各成分は $\mathbb{R}$ か $0$）なので、そのコホモロジーも有限次元。\ref{mfd:de-rham-theorem} の Step 5 から $H^{k}_{\mathrm{dR}}(M)\cong\check H^{k}(\mathcal{U},\underline{\mathbb{R}})$。
:::

## 最高次のコホモロジー {#mfd:sec-dc-top}

::: theorem 最高次のド・ラーム・コホモロジー {#mfd:top-de-rham keywords="for a compact connected oriented n-manifold, integration induces an isomorphism H^n_dR(M) -> R; an n-form is exact iff its integral is zero" index="最高次のド・ラーム・コホモロジー|さいこうじのどらーむこほもろじー"}
$M$ をコンパクトで連結な、境界のない向きづけられた $n$ 次元の可微分多様体（$n\ge1$）とする。積分 $\int_{M}\colon H^{n}_{\mathrm{dR}}(M)\to\mathbb{R}$ は同型である。とくに、$n$ 形式 $\omega$ が完全であることと $\int_{M}\omega=0$ は同値である。
:::

::: proof
**Step 1（次元は 1 以下）.** \ref{mfd:de-rham-theorem} と \ref{mfd:real-cohomology-dual} から $H^{n}_{\mathrm{dR}}(M)\cong\mathrm{Hom}(H_{n}(M;\mathbb{Z}),\mathbb{R})$。$M$ は連結な閉 $n$ 次元（位相）多様体なので、\ref{at:top-homology-closed-manifold} から、$\mathbb{Z}$ 向き付け可能なら $H_{n}(M;\mathbb{Z})\cong\mathbb{Z}$（2 で $R=\mathbb{Z}$）、そうでなければ $H_{n}(M;\mathbb{Z})=0$（3）。いずれにしても $\dim H^{n}_{\mathrm{dR}}(M)\le1$。

**Step 2（積分は全射）.** \ref{mfd:stokes-corollaries.2} から、積分は $H^{n}_{\mathrm{dR}}(M)$ から $\mathbb{R}$ への well-defined な全射（$M\neq\varnothing$）。

**Step 3.** 次元が 1 以下の空間から $\mathbb{R}$ への全射な線形写像は同型。後半は、$\omega$ の類が $0$ であることと積分が $0$ であることの同値性。

::: hypcheck
- **向き**：積分の定義と、Step 2 の全射性（体積形式の積分が正）に使った。向き付け不可能なら $H^{n}_{\mathrm{dR}}(M)=0$ であることも知られている（滑らかな向きと $\mathbb{Z}$ 向きの一致を示す必要がある。ここでは扱わない）。
- **コンパクト性と連結性**：\ref{at:top-homology-closed-manifold} の仮定。連結でなければ、各成分ごとに $\mathbb{R}$ が一つずつある。
- Step 1 で、滑らかな向きと位相的な $\mathbb{Z}$ 向きの関係は使っていない（どちらの場合も次元は 1 以下）。
:::
:::

::: corollary 体積形式の正規化 {#mfd:volume-forms-cohomologous keywords="two volume forms of equal total volume on a compact connected oriented manifold differ by an exact form" index="体積形式のコホモロジー類|たいせきけいしきのこほもろじーるい"}
コンパクトで連結な向きづけられた多様体の上の $n$ 形式 $\mu_{0},\mu_{1}$ について、$\int_{M}\mu_{0}=\int_{M}\mu_{1}$ なら、$\mu_{1}-\mu_{0}=d\sigma$ となる $(n-1)$ 形式 $\sigma$ がある。
:::

::: proof
$\int_{M}(\mu_{1}-\mu_{0})=0$ と \ref{mfd:top-de-rham}。
:::

これで、モーザーの定理の問題（\ref{symp:prob-db-volume-moser}）で仮定していた $\sigma$ の存在が示された。

## キュネットの公式と応用 {#mfd:sec-dc-kunneth}

::: proposition ベッチ数のキュネットの公式 {#mfd:de-rham-kunneth keywords="for compact manifolds M, N: b_k(M x N) = sum_{i+j=k} b_i(M) b_j(N)" index="キュネットの公式（ド・ラーム）|きゅねっとのこうしきどらーむ"}
コンパクトな可微分多様体 $M,N$ について、$b_{k}(M\times N)=\sum_{i+j=k}b_{i}(M)\,b_{j}(N)$。
:::

::: proof
体 $\mathbb{R}$ 係数の普遍係数定理（\ref{at:uct-cohomology}：体係数では $H^{k}$ は $H_{k}$ の双対）と \ref{mfd:de-rham-theorem} から、$b_{k}(X)=\dim H_{k}(X;\mathbb{R})$（$X=M,N,M\times N$。有限次元性は \ref{mfd:compact-finite-dimensional}、$M\times N$ もコンパクト）。体係数の \ref{at:kunneth} から $H_{k}(M\times N;\mathbb{R})\cong\bigoplus_{i+j=k}H_{i}(M;\mathbb{R})\otimes H_{j}(N;\mathbb{R})$ で、次元を比べればよい。
:::

::: example 応用：シンプレクティック構造とケーラー構造の障害 {#mfd:de-rham-applications keywords="S^{2n} (n >= 2) has no symplectic form since H^2_dR = 0; S^1 x S^3 has H^2_dR = 0 so it carries no Kahler metric" index="シンプレクティック形式の障害|しんぷれくてぃっくけいしきのしょうがい"}
1. $n\ge2$ なら $H^{2}_{\mathrm{dR}}(S^{2n})=0$ なので、$S^{2n}$ にはシンプレクティック形式がない（\ref{symp:symplectic-manifold-basic.2}）。
2. $H^{2}_{\mathrm{dR}}(S^{1}\times S^{3})=0$ なので、$S^{1}\times S^{3}$ にはケーラー計量がない（\ref{symp:kahler-symplectic.2}。複素構造をもつことは \ref{symp:kahler-examples.5} の事実）。
:::

::: proof
**1.** \ref{mfd:sphere-de-rham}（$2\neq0,2n$）。コンパクトなシンプレクティック多様体では $[\omega]\neq0$ in $H^{2}$。

**2.** \ref{mfd:de-rham-kunneth} と \ref{mfd:sphere-de-rham} から $b_{2}(S^{1}\times S^{3})=b_{0}b_{2}+b_{1}b_{1}+b_{2}b_{0}$（$S^{1}$ の $b_{2}=0$, $S^{3}$ の $b_{1}=b_{2}=0$）$=0$。
:::

::: supplement
**高い視点：解析と位相の橋.** ド・ラームの定理の帰結は、二方向に使える。位相から解析へ：特異コホモロジーの計算（球面、積、ポアンカレ双対性）から、「どの閉形式が完全か」「どんな微分方程式 $d\eta=\omega$ が解けるか」が分かる（\ref{mfd:top-de-rham} は $d\eta=\omega$ が解ける条件が積分条件一つだけであることを言う）。解析から位相へ：微分形式の構成（体積形式、シンプレクティック形式 $\omega^{k}$、ケーラー形式）から、コホモロジーが $0$ でないことが分かり、空間の位相に制約がつく（球面にシンプレクティック形式がない）。比喩で言えば、ド・ラームの定理は解析と位相の間の辞書で、片方の言語で易しい問題をもう片方の言語に翻訳できる。

**補足.** \ref{mfd:top-de-rham} は、コンパクト台のド・ラーム・コホモロジーについての $H^{n}_{c}(M)\cong\mathbb{R}$（連結で向き付け可能、コンパクトでなくてもよい）に一般化され、ポアンカレ双対性 $H^{k}(M)\cong H^{n-k}_{c}(M)^{*}$ のド・ラーム版の一部であることが知られている（Bott–Tu 第 5 章）。
:::

## 問題 {#mfd:sec-dc-problems}

::: problem {#mfd:prob-dc-torus}
トーラス $T^{n}=(S^{1})^{n}$ のベッチ数が $b_{k}=\binom{n}{k}$ であることを示せ。
:::

::: solution
$S^{1}$ のベッチ数は $b_{0}=b_{1}=1$（\ref{mfd:sphere-de-rham}）。\ref{mfd:de-rham-kunneth} を帰納的に使うと、$b_{k}(T^{n})=b_{k}(T^{n-1})+b_{k-1}(T^{n-1})$ で、パスカルの三角形の漸化式から $\binom{n}{k}$。
:::

::: problem {#mfd:prob-dc-closed-one-form-sphere}
$n\ge2$ について、$S^{n}$ 上の閉 1 形式はすべて完全であることを示せ。$S^{1}$ では成り立たないことの例を挙げよ。
:::

::: solution
\ref{mfd:sphere-de-rham} から $H^{1}_{\mathrm{dR}}(S^{n})=0$（$n\ge2$）。$S^{1}$ では $H^{1}\cong\mathbb{R}$ で、角度形式 $-y\,dx+x\,dy$ は積分が $2\pi\neq0$ なので完全でない（\ref{mfd:prob-di-circle-period}）。
:::
