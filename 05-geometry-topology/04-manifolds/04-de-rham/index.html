# ド・ラームの定理（The de Rham Theorem）

チェック–ド・ラーム二重複体と一般化されたマイヤー–ヴィートリス完全列、良い被覆によるド・ラームの定理（ド・ラーム・コホモロジーと実係数特異コホモロジーの同型）、積分による同型（補足）、球面・最高次・キュネットなどの帰結。

<p class="mn-msc">MSC2020: 58A12, 55N05, 57R19</p>

## 前提知識

- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：微分形式・ド・ラーム・コホモロジー・ポアンカレの補題・1 の分割・ストークスの定理
- [微分幾何学 › リーマン幾何](../../../05-geometry-topology/05-differential-geometry/03-riemannian/index.html)（全体、7 ページ）：凸近傍と良い被覆の存在（補助的なリーマン計量）
- [代数的位相幾何学 › コホモロジー論](../../../05-geometry-topology/02-algebraic-topology/03-cohomology/index.html)（全体、6 ページ）：二重複体の比較・良い被覆のチェックコホモロジー・普遍係数定理・閉多様体の最高次ホモロジー
- [代数的位相幾何学 › ホモロジー論](../../../05-geometry-topology/02-algebraic-topology/02-homology/index.html)（全体、14 ページ）：球面のホモロジー・キュネットの定理
- [圏論 › 層のコホモロジー](../../../01-foundations/06-category-theory/08-sheaf-cohomology/index.html)（全体、6 ページ）：チェック複体
