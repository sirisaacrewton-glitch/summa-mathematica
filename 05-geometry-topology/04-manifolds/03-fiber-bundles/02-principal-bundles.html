# 主束と付随束 {#mfd:page-principal-bundles keywords="principal G-bundle, right action of the structure group, free and fibre-transitive action, local sections and trivializations, s_beta = s_alpha g_{alpha beta}, principal bundle is trivial iff it has a global section, associated bundle P x_G F, sections of associated bundles as equivariant maps, correspondence between G-bundles and principal G-bundles"}

前のページでは、構造群 $G$ をもつファイバー束が、推移関数（コサイクル）で決まることを見た。推移関数はファイバー $F$ に依存せず、$G$ に値をとる関数の族にすぎない。そこで、コサイクルだけを取り出した「最も普遍的な」束として、ファイバーが $G$ そのものである**主束**を考える。主束 $P$ と、$G$ が作用する多様体 $F$ があれば、$P$ と同じ貼り合わせでファイバーを $F$ に取り替えた**付随束** $P\times_{G}F$ が作れる。このページの主結果は、構造群 $G$ とファイバー $F$ をもつ束が、主束の付随束として一意に表されること（\ref{mfd:bundle-principal-correspondence}）と、付随束の切断が主束上の同変写像と同じものであること（\ref{mfd:sections-equivariant}）である。

## 記法と定義の確認 {#mfd:sec-pb-notation}

::: notation
- リー群・滑らかな作用・効果的な作用は \ref{lie:lie-group}。ファイバー束・$G$ アトラス・推移関数は \ref{mfd:fiber-bundle}, \ref{mfd:g-bundle}、コサイクル条件は \ref{mfd:cocycle-condition}。
- コサイクル $g$ から作った束を $E(g)$ と書き（\ref{mfd:bundle-from-cocycle}）、ファイバーを明示するときは $E(g;F)$ と書く。$G$ 束の同型とコホモロガスなコサイクルは \ref{mfd:g-bundle-isomorphism}, \ref{mfd:cocycle-isomorphism}。
- 開被覆の添字集合は、必要なら可算な部分被覆に取り替えて、可算とする（$M$ は第二可算）。
:::

## 主束 {#mfd:sec-pb-principal}

::: definition 主束 {#mfd:principal-bundle keywords="principal G-bundle: a G-bundle with fibre G on which G acts by left multiplication" index="主束|しゅそく, 主 G 束|しゅじーそく, 主ファイバー束|しゅふぁいばーそく"}
$G$ をリー群とする。$G$ が自分自身に左からの積 $g\cdot k\defeq gk$ で作用するとき、ファイバー $G$ の $G$ 束を**主 $G$ 束**という。
:::

左からの積は滑らかで（\ref{lie:lie-group.1}）、効果的である（$gk=k$ がすべての $k$ で成り立てば $k=e$ として $g=e$）。

::: proposition 主束への右作用と局所切断 {#mfd:principal-right-action keywords="a principal G-bundle carries a smooth right G-action, free and transitive on fibres; local trivializations correspond to local sections s_alpha with s_beta = s_alpha g_{alpha beta}" index="主束の右作用|しゅそくのみぎさよう, 局所切断|きょくしょせつだん"}
$\pi\colon P\to M$ を、$G$ アトラス $\{(U_{\alpha},\Phi_{\alpha})\}$ と推移関数 $g_{\alpha\beta}$ をもつ主 $G$ 束とする。
1. $p\in\pi^{-1}(U_{\alpha})$, $\Phi_{\alpha}(p)=(m,k)$, $h\in G$ について $p\cdot h\defeq\Phi_{\alpha}^{-1}(m,kh)$ と定めると、これは $\alpha$ によらず、$P\times G\to P$ の滑らかな右作用（$p\cdot e=p$, $(p\cdot h)\cdot h'=p\cdot(hh')$）を定める。
2. $\pi(p\cdot h)=\pi(p)$ で、この作用は各ファイバーの上で**自由**（$p\cdot h=p$ なら $h=e$）かつ**推移的**（$\pi(p)=\pi(p')$ なら $p'=p\cdot h$ となる $h$ がただ一つある）である。
3. $s_{\alpha}(m)\defeq\Phi_{\alpha}^{-1}(m,e)$ は $U_{\alpha}$ の上の滑らかな**局所切断**（$\pi\circ s_{\alpha}=\mathrm{id}$）で、$\Phi_{\alpha}^{-1}(m,k)=s_{\alpha}(m)\cdot k$、また
$$
s_{\beta}(m)=s_{\alpha}(m)\cdot g_{\alpha\beta}(m)\qquad(m\in U_{\alpha}\cap U_{\beta}).
$$
:::

::: intuition
主束のファイバーは $G$ と同じ形をしているが、「どこが単位元か」は決まっていない（局所自明化を取り替えると、左から $g_{\alpha\beta}$ が掛かって単位元の位置が動く）。それでも、右から $h$ を掛ける操作は、左から何を掛けても可換なので、どの局所自明化で見ても同じ操作になる。これが右作用である。原点を忘れたアフィン空間で、平行移動だけが意味をもつのと同じ状況である。
:::

::: proof
**1.** 【主張：$\alpha$ によらない】$p\in\pi^{-1}(U_{\alpha}\cap U_{\beta})$ で $\Phi_{\beta}(p)=(m,k')$ とすると、$\Phi_{\alpha}(p)=(m,g_{\alpha\beta}(m)k')$ なので $k=g_{\alpha\beta}(m)k'$。$\beta$ で定めた $\Phi_{\beta}^{-1}(m,k'h)$ を $\Phi_{\alpha}$ で移すと $(m,g_{\alpha\beta}(m)k'h)=(m,kh)$ なので、$\Phi_{\alpha}^{-1}(m,kh)$ に等しい（群の結合律 $(g_{\alpha\beta}k')h=g_{\alpha\beta}(k'h)$ を使った）。

作用の公理は、$\Phi_{\alpha}$ で移すと $G$ の中の $ke=k$, $(kh)h'=k(hh')$ になる。滑らかさ：$\pi^{-1}(U_{\alpha})\times G$ の上で $(p,h)\mapsto p\cdot h$ は $\Phi_{\alpha}^{-1}\circ(\mathrm{id}_{U_{\alpha}}\times\mu)\circ((\Phi_{\alpha})\times\mathrm{id}_{G})$（$\mu$ は $G$ の積で、$(m,k,h)\mapsto(m,kh)$）なので滑らかな写像の合成。

**2.** $\Phi_{\alpha}$ で見ると、$\pi(p\cdot h)=m$ は定義から。$kh=k$ なら $h=e$（自由）。$\Phi_{\alpha}(p)=(m,k)$, $\Phi_{\alpha}(p')=(m,k')$ なら $h=k^{-1}k'$ がただ一つの解（推移的）。

**3.** $s_{\alpha}$ は滑らかな写像 $m\mapsto(m,e)$ と $\Phi_{\alpha}^{-1}$ の合成。1 の定義で $p=s_{\alpha}(m)$, $k=e$ とすると $s_{\alpha}(m)\cdot k=\Phi_{\alpha}^{-1}(m,k)$。最後の式：$\Phi_{\alpha}(s_{\beta}(m))=\Phi_{\alpha}\circ\Phi_{\beta}^{-1}(m,e)=(m,g_{\alpha\beta}(m))$ なので $s_{\beta}(m)=\Phi_{\alpha}^{-1}(m,g_{\alpha\beta}(m))=s_{\alpha}(m)\cdot g_{\alpha\beta}(m)$。

::: hypcheck
- **ファイバーが $G$ で作用が左からの積**：1 の well-definedness は、左からの積と右からの積が可換であること（結合律）だけを使っている。一般のファイバー $F$ では右作用は定義できない。
:::
:::

::: proposition 主束が自明であることと大域切断 {#mfd:principal-trivial-section keywords="a principal G-bundle is isomorphic to the trivial bundle M x G iff it admits a global smooth section" index="主束の自明性|しゅそくのじめいせい, 大域切断|たいいきせつだん"}
主 $G$ 束 $\pi\colon P\to M$ が自明束 $M\times G$ と $G$ 束として同型であるための必要十分条件は、滑らかな大域切断 $s\colon M\to P$（$\pi\circ s=\mathrm{id}_{M}$）が存在することである。
:::

::: proof
自明束 $M\times G$ には、$P$ と同じ開被覆の上の $G$ アトラス $\{(U_{\alpha},\mathrm{id})\}$（推移関数 $e$）を考える。

「⇒」：$\Theta\colon M\times G\to P$ を同型とすると、$s(m)\defeq\Theta(m,e)$ は滑らかで、$\pi(\Theta(m,e))=m$。

「⇐」：$\Theta(m,h)\defeq s(m)\cdot h$ とおく（\ref{mfd:principal-right-action.1} の作用）。滑らかで $\pi\circ\Theta=\mathrm{pr}_{1}$。$\lambda_{\alpha}(m)\defeq\mathrm{pr}_{2}(\Phi_{\alpha}(s(m)))$ とおくと $\lambda_{\alpha}\colon U_{\alpha}\to G$ は滑らかで、$s(m)=\Phi_{\alpha}^{-1}(m,\lambda_{\alpha}(m))=s_{\alpha}(m)\cdot\lambda_{\alpha}(m)$。よって
$$
\Phi_{\alpha}\circ\Theta(m,h)=\Phi_{\alpha}\bigl(s_{\alpha}(m)\cdot\lambda_{\alpha}(m)h\bigr)=\bigl(m,\lambda_{\alpha}(m)h\bigr).
$$
これは \ref{mfd:g-bundle-isomorphism} の形で、$(m,k)\mapsto(m,\lambda_{\alpha}(m)^{-1}k)$ を使えば $\pi^{-1}(U_{\alpha})$ の上の滑らかな逆写像が得られるので、$\Theta$ は微分同相写像で $G$ 束の同型。
:::

## 付随束 {#mfd:sec-pb-associated}

::: definition 付随束 {#mfd:associated-bundle keywords="associated bundle P x_G F: quotient of P x F by (p, f) ~ (p h, h^{-1} f)" index="付随束|ふずいそく, 同伴束|どうはんそく, 随伴束（ファイバー束）|ずいはんそくふぁいばーそく"}
$\pi\colon P\to M$ を主 $G$ 束、$G$ の可微分多様体 $F$ への滑らかで効果的な左作用を固定する。$P\times F$ の上で
$$
(p,f)\sim(p\cdot h,\ h^{-1}\cdot f)\qquad(h\in G)
$$
で生成される関係（これは $G$ の右作用 $(p,f)\cdot h\defeq(p\cdot h,h^{-1}\cdot f)$ の軌道への分割なので、同値関係）による商集合を $P\times_{G}F$ と書き、$(p,f)$ の類を $[p,f]$、$\pi_{F}([p,f])\defeq\pi(p)$ とする。これを $P$ に**付随する**、ファイバー $F$ の束（**付随束**）という。
:::

$[p\cdot h,f]=[p,h\cdot f]$ である（$(p\cdot h,f)\sim(p\cdot hh^{-1},h\cdot f)$）。$\pi_{F}$ は well-defined（$\pi(p\cdot h)=\pi(p)$）。

::: theorem 付随束の構造 {#mfd:associated-bundle-structure keywords="P x_G F is a G-bundle with fibre F whose local trivializations [s_alpha(m) h, f] -> (m, h f) have the same transition functions as P; the quotient map P x F -> P x_G F is smooth" index="付随束の構造|ふずいそくのこうぞう"}
記号は \ref{mfd:associated-bundle} のとおりとし、$P$ の $G$ アトラスを $\{(U_{\alpha},\Phi_{\alpha})\}$、局所切断を $s_{\alpha}$（\ref{mfd:principal-right-action.3}）、推移関数を $g_{\alpha\beta}$ とする。
1. $\pi_{F}^{-1}(U_{\alpha})$ の各元は $[s_{\alpha}(m),f]$（$m\in U_{\alpha}$, $f\in F$）の形にただ一通りに書ける。$\Psi_{\alpha}([s_{\alpha}(m),f])\defeq(m,f)$ とおくと
$$
\Psi_{\alpha}\circ\Psi_{\beta}^{-1}(m,f)=\bigl(m,\ g_{\alpha\beta}(m)\cdot f\bigr).
$$
2. $P\times_{G}F$ には、各 $\Psi_{\alpha}$ が微分同相写像になる可微分多様体の構造がただ一つあり、この構造で $P\times_{G}F$ は $\{(U_{\alpha},\Psi_{\alpha})\}$ を $G$ アトラスとし、$P$ と同じ推移関数 $g_{\alpha\beta}$ をもつ $G$ 束である。
3. 商写像 $q\colon P\times F\to P\times_{G}F$, $(p,f)\mapsto[p,f]$ は滑らかである。
:::

::: proof
**1.** 【主張：一意な表示】$[p,f]\in\pi_{F}^{-1}(U_{\alpha})$, $m\defeq\pi(p)$ とする。\ref{mfd:principal-right-action.2} から $p=s_{\alpha}(m)\cdot k$ となる $k$ がただ一つあり、$[p,f]=[s_{\alpha}(m)\cdot k,f]=[s_{\alpha}(m),k\cdot f]$。表示の一意性：$[s_{\alpha}(m),f]=[s_{\alpha}(m),f']$ なら、ある $h$ で $(s_{\alpha}(m),f')=(s_{\alpha}(m)\cdot h,h^{-1}\cdot f)$。作用が自由なので $h=e$、よって $f'=f$。したがって $\Psi_{\alpha}$ は well-defined な全単射 $\pi_{F}^{-1}(U_{\alpha})\to U_{\alpha}\times F$。

【主張：推移関数】$\Psi_{\beta}^{-1}(m,f)=[s_{\beta}(m),f]=[s_{\alpha}(m)\cdot g_{\alpha\beta}(m),f]=[s_{\alpha}(m),g_{\alpha\beta}(m)\cdot f]$（\ref{mfd:principal-right-action.3}）なので、$\Psi_{\alpha}$ を施すと式が得られる。

**2.** $\Lambda\colon P\times_{G}F\to E(g;F)$ を、$\pi_{F}^{-1}(U_{\alpha})$ の上で $\Lambda\defeq\Phi^{g}_{\alpha}{}^{-1}\circ\Psi_{\alpha}$（$\Phi^{g}_{\alpha}$ は $E(g;F)$ の局所自明化、つまり $[s_{\alpha}(m),f]\mapsto[\alpha,m,f]$）と定める。1 の式と \ref{mfd:bundle-from-cocycle} の Step 2 の式は同じ形なので、$U_{\alpha}\cap U_{\beta}$ の上で二つの定義は一致し、$\Lambda$ は well-defined な全単射（各 $\pi_{F}^{-1}(U_{\alpha})$ の上で全単射で、ファイバーを保つ）。$E(g;F)$ の構造を $\Lambda$ で移したものが求める構造で、$\Psi_{\alpha}=\Phi^{g}_{\alpha}\circ\Lambda$ は微分同相写像。一意性は \ref{mfd:bundle-from-cocycle} の Step 5 と同じ（各 $\Psi_{\alpha}$ が微分同相写像になる構造では、$\Psi_{\alpha}$ から作った座標近傍がすべて属するので、極大性から構造が決まる）。$G$ アトラスであることと推移関数は 1 から。

**3.** $\pi^{-1}(U_{\alpha})\times F$ の上で、$\Phi_{\alpha}(p)=(m,k)$ とすると $p=s_{\alpha}(m)\cdot k$ なので $q(p,f)=[s_{\alpha}(m),k\cdot f]$、つまり
$$
\Psi_{\alpha}\circ q(p,f)=(m,\ k\cdot f)\qquad\bigl((m,k)=\Phi_{\alpha}(p)\bigr).
$$
右辺は $\Phi_{\alpha}$ と作用の合成で滑らか。$\Psi_{\alpha}$ は微分同相写像なので $q$ は滑らか。

::: hypcheck
- **作用が自由で推移的**：1 の表示の存在（推移的）と一意性（自由）に使った。
- **ファイバー $F$ への作用が効果的**：$G$ 束の定義（推移関数が一意に定まること）のために仮定した。構成そのものには使っていない。
- 構造は $P$ の $G$ アトラスの選び方によらない：別の $G$ アトラスの局所切断から作った $\Psi'_{\gamma}$ も、1 と同じ計算で $\Psi_{\alpha}$ との座標変換が $(m,f)\mapsto(m,\lambda(m)\cdot f)$ の形になり、滑らかだからである。
:::
:::

::: theorem $G$ 束と主束の対応 {#mfd:bundle-principal-correspondence keywords="every G-bundle E with fibre F is isomorphic to P(E) x_G F where P(E) is the principal bundle with the same cocycle; iso classes of G-bundles with fibre F correspond to iso classes of principal G-bundles" index="主束と付随束の対応|しゅそくとふずいそくのたいおう"}
$G$ をリー群、$G$ の $F$ への滑らかで効果的な作用を固定する。
1. 推移関数 $g$ をもつ $G$ 束 $E$（ファイバー $F$）について、$P(E)\defeq E(g;G)$ は主 $G$ 束で、$E$ と $P(E)\times_{G}F$ は $G$ 束として同型である。
2. 主 $G$ 束 $P$ について、$P(P\times_{G}F)$ と $P$ は $G$ 束として同型である。
3. したがって、$P\mapsto P\times_{G}F$ と $E\mapsto P(E)$ は、主 $G$ 束の同型類の全体と、ファイバー $F$ の $G$ 束の同型類の全体の間の、互いに逆な全単射を与える。
:::

::: proof
**1.** $P(E)=E(g;G)$ の推移関数は $g$（\ref{mfd:bundle-from-cocycle}）。\ref{mfd:associated-bundle-structure.2} から $P(E)\times_{G}F$ の推移関数も $g$。$E$ も同じ被覆の上で推移関数 $g$ をもつので、\ref{mfd:cocycle-isomorphism.1} を $\lambda_{\alpha}=e$ で使うと $E\cong P(E)\times_{G}F$。

**2.** $P\times_{G}F$ の推移関数は $P$ と同じ $g$ なので、$P(P\times_{G}F)=E(g;G)$。\ref{mfd:cocycle-isomorphism.2} から $P\cong E(g;G)$。

**3.** 【主張：二つの対応は同型類の上で well-defined】主束 $P\cong P'$ なら、推移関数はコホモロガス（\ref{mfd:cocycle-isomorphism.1}）で、付随束の推移関数は主束と同じなので、$P\times_{G}F$ と $P'\times_{G}F$ の推移関数もコホモロガス、よって同型。$E\cong E'$ のときも同様に $P(E)\cong P(E')$。互いに逆であることは 1 と 2。

::: hypcheck
- **効果的な作用**：\ref{mfd:cocycle-isomorphism.1} の「⇒」で使っている。効果的でない作用では、異なる主束から同型な付随束ができうる（たとえば自明な作用では付随束はいつも自明束）。
:::
:::

::: intuition
主束は「貼り合わせの規則だけ」を記録した束で、付随束はその規則でファイバー $F$ を貼り合わせたものである。同じ規則で $F$ をいろいろに取り替えれば、いろいろな束ができる。規則（主束）とファイバーを決めれば束は決まり、逆に束から規則を読み取れる（作用が効果的なら）。
:::

## 切断と同変写像 {#mfd:sec-pb-sections}

::: proposition 付随束の切断と同変写像 {#mfd:sections-equivariant keywords="smooth sections of P x_G F correspond bijectively to smooth G-equivariant maps phi: P -> F with phi(p h) = h^{-1} phi(p)" index="同変写像（主束）|どうへんしゃぞうしゅそく, 付随束の切断|ふずいそくのせつだん"}
記号は \ref{mfd:associated-bundle-structure} のとおりとする。滑らかな写像 $\phi\colon P\to F$ で
$$
\phi(p\cdot h)=h^{-1}\cdot\phi(p)\qquad(p\in P,\ h\in G)
$$
を満たすもの（**同変写像**）と、$P\times_{G}F$ の滑らかな切断 $\sigma\colon M\to P\times_{G}F$ は、$\sigma(\pi(p))=[p,\phi(p)]$ によって一対一に対応する。
:::

::: proof
**同変写像から切断.** $\sigma(m)\defeq[p,\phi(p)]$（$p\in\pi^{-1}(m)$）とおく。$p$ によらない：$[p\cdot h,\phi(p\cdot h)]=[p\cdot h,h^{-1}\cdot\phi(p)]=[p,\phi(p)]$（\ref{mfd:principal-right-action.2} からファイバーの任意の点は $p\cdot h$ の形）。滑らか：$U_{\alpha}$ の上で $p=s_{\alpha}(m)$ をとると $\Psi_{\alpha}(\sigma(m))=(m,\phi(s_{\alpha}(m)))$ で、滑らかな写像の合成。

**切断から同変写像.** $\sigma$ を滑らかな切断とし、$p\in P$ に対して、$\sigma(\pi(p))=[p,f]$ となる $f$ を $\phi(p)$ とする。そのような $f$ はただ一つ：\ref{mfd:associated-bundle-structure.1} の証明と同じく、$[p,f]=[p,f']$ なら作用の自由性から $f=f'$。存在は $\sigma(\pi(p))$ の代表元 $(p',f'')$ を $p'=p\cdot h$ と書いて $[p',f'']=[p,h\cdot f'']$ とすればよい。同変性：$[p,\phi(p)]=[p\cdot h,h^{-1}\cdot\phi(p)]$ なので $\phi(p\cdot h)=h^{-1}\cdot\phi(p)$。滑らかさ：$\Psi_{\alpha}(\sigma(m))=(m,\tau_{\alpha}(m))$ とおくと $\tau_{\alpha}$ は滑らか。$\Phi_{\alpha}(p)=(m,k)$ なら $p=s_{\alpha}(m)\cdot k$ で、$\sigma(m)=[s_{\alpha}(m),\tau_{\alpha}(m)]=[s_{\alpha}(m)\cdot k,k^{-1}\cdot\tau_{\alpha}(m)]$ なので
$$
\phi(p)=k^{-1}\cdot\tau_{\alpha}(m),\qquad(m,k)=\Phi_{\alpha}(p),
$$
これは滑らかな写像（$\Phi_{\alpha}$、$G$ の逆元、作用、$\tau_{\alpha}$）の合成。

二つの対応が互いに逆であることは、どちらも $\sigma(\pi(p))=[p,\phi(p)]$ という同じ関係で定まることから。
:::

この対応は、微分幾何で「束に値をとる微分形式」を主束の上の同変な形式として扱うときの基本である（接続と曲率の議論で使う）。

::: supplement
**高い視点：テンソル積としての付随束.** $P\times_{G}F$ は、右 $G$ 空間 $P$ と左 $G$ 空間 $F$ の「$G$ 上のテンソル積」である：環 $R$ 上の右加群 $A$ と左加群 $B$ から $A\otimes_{R}B$ を作るとき $ar\otimes b=a\otimes rb$ とするのと同じく、$[p\cdot h,f]=[p,h\cdot f]$ と「$h$ を左右に通す」関係で割っている。\ref{mfd:sections-equivariant} は、テンソル積からの写像が「双線形で釣り合った写像」と対応するのと同じ形の普遍性である。主束は $G$ の**トーサー**（自由かつ推移的に作用される空間）を底空間の上で連続的に並べたもので、各ファイバーは「原点を忘れた $G$」である。

**補足（事実）.** 位相的な範疇では、主 $G$ 束の同型類は、ある空間 $BG$（**分類空間**）へのホモトピー類 $[M,BG]$ と一対一に対応することが知られている（ミルナーの構成など）。本サイトでは証明を扱わない。
:::

## 問題 {#mfd:sec-pb-problems}

::: problem {#mfd:prob-pb-mobius-principal}
メビウスの帯のコサイクル（\ref{mfd:mobius-bundle}）から作った主 $\mathrm{O}(1)$ 束 $P=E(g;\mathrm{O}(1))$ は、大域切断をもたないことを示せ。
:::

::: solution
大域切断があれば、\ref{mfd:principal-trivial-section} から $P$ は自明束と同型で、\ref{mfd:cocycle-isomorphism.1} から $g$ は自明なコサイクル $1$ とコホモロガスになる。\ref{mfd:mobius-bundle} の証明の後半はファイバーによらず、コサイクルがコホモロガスでないことを示しているので矛盾。（証明は省くが、$P$ は全空間が円周で、$S^{1}\to S^{1}$, $z\mapsto z^{2}$ と同一視できる二重被覆になる。）
:::

::: problem {#mfd:prob-pb-trivial-associated}
主 $G$ 束 $P$ が自明なら、どの付随束 $P\times_{G}F$ も自明束 $M\times F$ と $G$ 束として同型であることを示せ。逆は成り立つか（ヒント：$G$ が効果的に作用する $F$ について考えよ）。
:::

::: solution
$P\cong M\times G$ なら、推移関数は自明なコサイクルとコホモロガスで、付随束の推移関数は $P$ と同じなので、$P\times_{G}F$ の推移関数も自明なコサイクルとコホモロガス。\ref{mfd:cocycle-isomorphism.1} から自明束と同型。逆：$P\times_{G}F$ が $G$ 束として自明なら、その推移関数は自明なコサイクルとコホモロガスで、作用が効果的なので \ref{mfd:bundle-principal-correspondence.1} から $P\cong P(P\times_{G}F)\cong P(M\times F)=M\times G$。よって、効果的な作用については逆も成り立つ（ただし「$G$ 束として」自明であることが必要。単にファイバー束として $M\times F$ と微分同相というだけでは足りない）。
:::
