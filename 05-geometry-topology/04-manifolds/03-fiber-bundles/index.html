# ファイバー束（Fiber Bundles）

ファイバー束と構造群、推移関数とコサイクル条件、コサイクルからの束の構成と同型の判定、主束と付随束、付随束の切断と同変写像、ベクトル束とフレーム束、接束・余接束・形式の束をフレーム束の付随束として捉え直すこと、構造群の還元（向きと GL⁺(n)、ファイバー計量と O(k)）。

<p class="mn-msc">MSC2020: 55R10, 55R25, 57R22</p>

## 前提知識

- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：可微分多様体・部分多様体と正則値定理・1 の分割・向き・接束と余接束
- [位相群とリー群 › リー群](../../../05-geometry-topology/06-lie-groups/02-lie-groups/index.html) [§1](../../../05-geometry-topology/06-lie-groups/02-lie-groups/01-lie-group-basics.html)（リー群の定義と古典群）：リー群の定義・行列群と古典群（§1 だけ。リー群の一般論は使わない）
- [線形代数 › 多重線形代数](../../../02-algebra/01-linear-algebra/05-multilinear/index.html)（全体、4 ページ）：外冪（形式の束の推移関数）
