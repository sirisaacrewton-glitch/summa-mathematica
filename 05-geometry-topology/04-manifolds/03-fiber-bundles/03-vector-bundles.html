# ベクトル束とフレーム束 {#mfd:page-vector-bundles keywords="vector bundle of rank k, vector bundle charts linear on fibres, vector bundles are GL(k)-bundles with fibre R^k, sections and local frames, frame bundle Fr(E) as a principal GL(k)-bundle, E = Fr(E) x_GL R^k, tangent bundle as the bundle associated to the frame bundle, associated vector bundles of representations, cotangent bundle and form bundles as associated bundles"}

可微分多様体の系列では、接束 $TM$ と余接束 $T^{*}M$ を、ヤコビ行列による貼り合わせで具体的に構成した（\ref{mfd:tangent-bundle}, \ref{mfd:cotangent-bundle}）。このページでは、ファイバーがベクトル空間で局所自明化が線形な束（**ベクトル束**）を一般に扱い、ベクトル束 $E$ から、各点の基底の全体として**フレーム束** $\mathrm{Fr}(E)$ という主 $\mathrm{GL}(k,\mathbb{R})$ 束を作る。主結果は、$E$ がフレーム束の付随束 $\mathrm{Fr}(E)\times_{\mathrm{GL}(k)}\mathbb{R}^{k}$ に同型であること（\ref{mfd:vector-bundle-frame-associated}）である。とくに $TM$ はフレーム束 $\mathrm{Fr}(M)$ の付随束であり、$T^{*}M$ や微分形式の束 $\Lambda^{k}T^{*}M$ は、同じ $\mathrm{Fr}(M)$ に $\mathrm{GL}(n)$ の別の表現を付随させたものとして統一的に理解できる（\ref{mfd:tangent-bundle-frame}）。これが、接束をアドホックに定義したことの「伏線回収」である。

## 記法と定義の確認 {#mfd:sec-vb-notation}

::: notation
- ファイバー束・$G$ 束・推移関数・同型は \ref{mfd:fiber-bundle}, \ref{mfd:g-bundle}, \ref{mfd:cocycle-isomorphism}。主束・付随束は \ref{mfd:principal-bundle}, \ref{mfd:associated-bundle}, \ref{mfd:associated-bundle-structure}。
- $\mathrm{GL}(k)\defeq\mathrm{GL}(k,\mathbb{R})$ は $\mathbb{R}^{k}$（列ベクトル）に左から掛け算で作用する（\ref{lie:matrix-lie-groups.4}）。$e_{1},\dots,e_{k}$ は標準基底。
- 群の**表現**とは、リー群の準同型 $\rho\colon G\to\mathrm{GL}(N)$ で滑らかなものをいう。
:::

## ベクトル束 {#mfd:sec-vb-vector-bundles}

::: definition ベクトル束 {#mfd:vector-bundle keywords="smooth real vector bundle of rank k: fibre bundle with vector space fibres and local trivializations linear on fibres; line bundle" index="ベクトル束|べくとるそく, 階数（ベクトル束）|かいすうべくとるそく, 直線束|ちょくせんそく, ベクトル束の局所自明化|べくとるそくのきょくしょじめいか"}
$\pi\colon E\to M$ をファイバー $\mathbb{R}^{k}$ のファイバー束とし、各ファイバー $E_{m}$ に実ベクトル空間の構造が与えられているとする。$M$ の各点が、その上の局所自明化 $\Phi\colon\pi^{-1}(U)\to U\times\mathbb{R}^{k}$ で、各 $m\in U$ について $\mathrm{pr}_{2}\circ\Phi\restriction E_{m}\colon E_{m}\to\mathbb{R}^{k}$ が線形同型であるもの（**ベクトル束の局所自明化**）をもつ開近傍をもつとき、$E$ を階数 $k$ の**ベクトル束**という。階数 $1$ のものを**直線束**という。
:::

::: proposition ベクトル束は GL(k) 束 {#mfd:vector-bundle-gl keywords="vector bundle charts have smooth GL(k)-valued transition functions; conversely a GL(k)-bundle with fibre R^k carries a unique vector bundle structure making its trivializations linear" index="ベクトル束の推移関数|べくとるそくのすいいかんすう"}
1. ベクトル束の局所自明化の族 $\{(U_{\alpha},\Phi_{\alpha})\}$ で $M$ を覆うものは $\mathrm{GL}(k)$ アトラスである。つまり、滑らかな $g_{\alpha\beta}\colon U_{\alpha}\cap U_{\beta}\to\mathrm{GL}(k)$ があって $\Phi_{\alpha}\circ\Phi_{\beta}^{-1}(m,v)=(m,g_{\alpha\beta}(m)v)$ となる。
2. 逆に、ファイバー $\mathbb{R}^{k}$（標準的な作用）の $\mathrm{GL}(k)$ 束 $E$ の各ファイバーには、各 $\mathrm{pr}_{2}\circ\Phi_{\alpha}\restriction E_{m}$ が線形同型になるベクトル空間の構造がただ一つあり、$E$ はベクトル束になる。
:::

::: proof
**1.** $m\in U_{\alpha}\cap U_{\beta}$ について、$g_{\alpha\beta}(m)\defeq(\mathrm{pr}_{2}\circ\Phi_{\alpha}\restriction E_{m})\circ(\mathrm{pr}_{2}\circ\Phi_{\beta}\restriction E_{m})^{-1}$ は線形同型の合成なので $\mathrm{GL}(k)$ の元で、定義の式を満たす。【主張：$g_{\alpha\beta}$ は滑らか】$g_{\alpha\beta}(m)$ の第 $j$ 列は $g_{\alpha\beta}(m)e_{j}=\mathrm{pr}_{2}\circ\Phi_{\alpha}\circ\Phi_{\beta}^{-1}(m,e_{j})$ で、滑らかな写像の合成なので、行列の成分は $m$ の滑らかな関数。$\mathrm{GL}(k)$ は $M_{k}(\mathbb{R})$ の開部分多様体なので、$g_{\alpha\beta}$ は $\mathrm{GL}(k)$ への滑らかな写像。

**2.** $m\in U_{\alpha}$ について、全単射 $\mathrm{pr}_{2}\circ\Phi_{\alpha}\restriction E_{m}$ で $\mathbb{R}^{k}$ のベクトル空間の構造を $E_{m}$ に移す。$m\in U_{\alpha}\cap U_{\beta}$ なら、二つの全単射の違い $g_{\alpha\beta}(m)$ は線形同型なので、移した構造は一致する。一意性は、線形同型になるという条件が構造を決めることから。
:::

::: definition 切断と局所フレーム {#mfd:local-frame keywords="smooth sections Gamma(E) of a vector bundle form a C^infinity(M)-module; local frame: k sections forming a basis at each point" index="切断（ベクトル束）|せつだんべくとるそく, 局所フレーム|きょくしょふれーむ, 標構（ベクトル束）|ひょうこうべくとるそく"}
ベクトル束 $\pi\colon E\to M$ と開集合 $U$ について、滑らかな写像 $\sigma\colon U\to E$ で $\pi\circ\sigma=\mathrm{id}_{U}$ となるものを $U$ の上の（滑らかな）**切断**といい、その全体を $\Gamma(U,E)$ と書く。$U$ の上の切断の組 $(\sigma_{1},\dots,\sigma_{k})$ が、各 $m\in U$ で $E_{m}$ の基底になるとき、**局所フレーム**という。
:::

$\Gamma(U,E)$ は、ファイバーごとの和とスカラー倍で $C^{\infty}(U)$ 加群になる（和が滑らかなことは、局所自明化で見ると成分の和になることから）。

::: proposition 局所フレームと局所自明化 {#mfd:local-frame-trivialization keywords="a local frame on U gives a vector bundle trivialization U x R^k -> E|_U, (m, v) -> sum v_i sigma_i(m), and conversely" index="局所フレームと局所自明化|きょくしょふれーむときょくしょじめいか"}
ベクトル束 $E$ の $U$ の上の局所フレーム $(\sigma_{1},\dots,\sigma_{k})$ について、
$$
\Theta\colon U\times\mathbb{R}^{k}\to\pi^{-1}(U),\qquad\Theta(m,v)\defeq\sum_{i}v_{i}\,\sigma_{i}(m)
$$
は微分同相写像で、$\Theta^{-1}$ はベクトル束の局所自明化である。逆に、ベクトル束の局所自明化 $\Phi$ について $\sigma_{i}(m)\defeq\Phi^{-1}(m,e_{i})$ は局所フレームである。
:::

::: proof
**前半.** $\Theta$ は各ファイバーの上で線形で、$\sigma_{i}(m)$ が基底なので全単射。【主張：$\Theta$ は微分同相写像】$m_{0}\in U$ を含むベクトル束の局所自明化 $(U_{\alpha},\Phi_{\alpha})$ をとる。$U\cap U_{\alpha}$ の上で、$B(m)$ を第 $i$ 列が $\mathrm{pr}_{2}\Phi_{\alpha}(\sigma_{i}(m))$ である行列とすると、成分は滑らかで、$\sigma_{i}(m)$ が基底で $\mathrm{pr}_{2}\Phi_{\alpha}\restriction E_{m}$ が線形同型なので $B(m)\in\mathrm{GL}(k)$。線形性から
$$
\Phi_{\alpha}\circ\Theta(m,v)=\bigl(m,\ B(m)v\bigr)
$$
で、これは滑らか。逆写像 $(m,w)\mapsto(m,B(m)^{-1}w)$ も、$\mathrm{GL}(k)$ の逆元の滑らかさから滑らか。よって $\Theta$ は $(U\cap U_{\alpha})\times\mathbb{R}^{k}$ の上で微分同相写像で、$m_{0}$ は任意なので、全体で（全単射かつ局所的に微分同相写像なので）微分同相写像。$\mathrm{pr}_{1}\circ\Theta^{-1}=\pi$ とファイバー上の線形性は作り方から。

**後半.** $\sigma_{i}$ は滑らかな写像 $m\mapsto(m,e_{i})$ と $\Phi^{-1}$ の合成で、$\Phi^{-1}\restriction\{m\}\times\mathbb{R}^{k}$ が線形同型なので、$\sigma_{i}(m)$ は基底の像として基底。
:::

\ref{mfd:tangent-bundle-gl} の局所自明化は、座標ベクトル場 $\partial/\partial x_{1},\dots,\partial/\partial x_{n}$ という局所フレームに対応している（$\Phi_{\alpha}^{-1}(m,e_{i})=\partial/\partial x^{\alpha}_{i}|_{m}$）。よって $TM$, $T^{*}M$ は階数 $n$ のベクトル束である。

## フレーム束 {#mfd:sec-vb-frame}

::: definition フレーム束 {#mfd:frame-bundle keywords="frame bundle Fr(E): pairs (m, u) with u: R^k -> E_m a linear isomorphism (an ordered basis of E_m); right action u . A = u o A; Fr(M) = Fr(TM)" index="フレーム束|ふれーむそく, 標構束|ひょうこうそく, 枠束|わくそく"}
$\pi\colon E\to M$ を階数 $k$ のベクトル束とする。
$$
\mathrm{Fr}(E)\defeq\{(m,u):m\in M,\ u\colon\mathbb{R}^{k}\to E_{m}\text{ は線形同型}\}
$$
とし（$u$ は $E_{m}$ の順序付き基底 $(u(e_{1}),\dots,u(e_{k}))$ と同じもの）、$\hat\pi(m,u)\defeq m$、$A\in\mathrm{GL}(k)$ について $(m,u)\cdot A\defeq(m,u\circ A)$ とする。ベクトル束の局所自明化 $(U_{\alpha},\Phi_{\alpha})$ について、$\phi_{\alpha,m}\defeq\mathrm{pr}_{2}\circ\Phi_{\alpha}\restriction E_{m}$ とおき、
$$
\hat\Phi_{\alpha}\colon\hat\pi^{-1}(U_{\alpha})\to U_{\alpha}\times\mathrm{GL}(k),\qquad\hat\Phi_{\alpha}(m,u)\defeq(m,\ \phi_{\alpha,m}\circ u)
$$
と定める（$\phi_{\alpha,m}\circ u$ は $\mathbb{R}^{k}$ の線形同型で、行列とみなす）。$\mathrm{Fr}(E)$ を $E$ の**フレーム束**という。$\mathrm{Fr}(M)\defeq\mathrm{Fr}(TM)$ を $M$ のフレーム束という。
:::

::: proposition フレーム束は主束 {#mfd:frame-bundle-principal keywords="Fr(E) is a principal GL(k)-bundle with the same transition functions as E; its right action is precomposition; local sections are local frames" index="フレーム束の構造|ふれーむそくのこうぞう"}
$E$ のベクトル束の局所自明化の族 $\{(U_{\alpha},\Phi_{\alpha})\}$（可算、$M$ を覆う）の推移関数を $g_{\alpha\beta}$ とする。
1. $\hat\Phi_{\alpha}$ は全単射で、$\hat\Phi_{\alpha}\circ\hat\Phi_{\beta}^{-1}(m,A)=(m,g_{\alpha\beta}(m)A)$。
2. $\mathrm{Fr}(E)$ には各 $\hat\Phi_{\alpha}$ が微分同相写像になる可微分多様体の構造がただ一つあり、これで $\mathrm{Fr}(E)$ は推移関数 $g_{\alpha\beta}$ の主 $\mathrm{GL}(k)$ 束になる。
3. この主束の右作用（\ref{mfd:principal-right-action.1}）は $(m,u)\cdot A=(m,u\circ A)$ で、局所切断 $\hat s_{\alpha}(m)=(m,\phi_{\alpha,m}^{-1})$ は局所フレーム $(\Phi_{\alpha}^{-1}(m,e_{i}))_{i}$ である。
:::

::: proof
**1.** $u\mapsto\phi_{\alpha,m}\circ u$ は、$E_{m}$ への線形同型の全体から $\mathrm{GL}(k)$ への全単射（逆は $A\mapsto\phi_{\alpha,m}^{-1}\circ A$）。$\hat\Phi_{\beta}^{-1}(m,A)=(m,\phi_{\beta,m}^{-1}\circ A)$ なので、$\hat\Phi_{\alpha}\circ\hat\Phi_{\beta}^{-1}(m,A)=(m,\phi_{\alpha,m}\circ\phi_{\beta,m}^{-1}\circ A)=(m,g_{\alpha\beta}(m)A)$（\ref{mfd:vector-bundle-gl.1} の証明の $g_{\alpha\beta}$ の定義）。

**2.** 1 の式は、$\mathrm{GL}(k)$ が自分自身に左からの積で作用するときの、\ref{mfd:bundle-from-cocycle} の Step 2 の式と同じ形である。したがって、\ref{mfd:associated-bundle-structure.2} の証明と同じく、$\hat\pi^{-1}(U_{\alpha})$ の上で $(\Phi^{g}_{\alpha})^{-1}\circ\hat\Phi_{\alpha}$ と定めた写像は重なりで一致し、全単射 $\mathrm{Fr}(E)\to E(g;\mathrm{GL}(k))$ を与える。この全単射で構造を移せばよい。一意性も同じ議論。

**3.** $\hat\Phi_{\alpha}((m,u)\cdot A)=(m,\phi_{\alpha,m}\circ u\circ A)$ で、$\hat\Phi_{\alpha}(m,u)=(m,K)$ なら右辺は $(m,KA)$。これは \ref{mfd:principal-right-action.1} の右作用の定義そのもの。$\hat s_{\alpha}(m)=\hat\Phi_{\alpha}^{-1}(m,I)=(m,\phi_{\alpha,m}^{-1})$ で、その基底は $\phi_{\alpha,m}^{-1}(e_{i})=\Phi_{\alpha}^{-1}(m,e_{i})$。
:::

::: theorem ベクトル束はフレーム束の付随束 {#mfd:vector-bundle-frame-associated keywords="a vector bundle E is isomorphic to Fr(E) x_GL(k) R^k via [u, v] -> u(v)" index="フレーム束の付随束|ふれーむそくのふずいそく"}
階数 $k$ のベクトル束 $E$ について、
$$
\mathrm{ev}\colon\mathrm{Fr}(E)\times_{\mathrm{GL}(k)}\mathbb{R}^{k}\to E,\qquad[(m,u),v]\mapsto u(v)
$$
は well-defined で、$\mathrm{GL}(k)$ 束の同型であり、各ファイバーの上で線形同型である。
:::

::: proof
**Step 1（well-defined と全単射）.** $[(m,u)\cdot A,A^{-1}v]=[(m,u\circ A),A^{-1}v]\mapsto u(AA^{-1}v)=u(v)$ なので well-defined。全射：$w\in E_{m}$ について、任意の $u\in\mathrm{Fr}(E)_{m}$ をとれば $w=u(u^{-1}(w))$。単射：$u(v)=u'(v')$（同じ $E_{m}$ の中）なら、$A\defeq u^{-1}\circ u'\in\mathrm{GL}(k)$ について $u'=u\circ A$, $v=Av'$ なので、$[(m,u'),v']=[(m,u)\cdot A,v']=[(m,u),Av']=[(m,u),v]$。

**Step 2（局所自明化で見ると恒等写像）.** 付随束の局所自明化は $\Psi_{\alpha}([\hat s_{\alpha}(m),v])=(m,v)$（\ref{mfd:associated-bundle-structure.1}）。\ref{mfd:frame-bundle-principal.3} から $\hat s_{\alpha}(m)=(m,\phi_{\alpha,m}^{-1})$ なので
$$
\Phi_{\alpha}\circ\mathrm{ev}\circ\Psi_{\alpha}^{-1}(m,v)=\Phi_{\alpha}\bigl(\phi_{\alpha,m}^{-1}(v)\bigr)=(m,v).
$$
よって $\mathrm{ev}$ は各 $\pi^{-1}(U_{\alpha})$ の上で微分同相写像の合成 $\Phi_{\alpha}^{-1}\circ\Psi_{\alpha}$ に等しく、全単射なので微分同相写像。\ref{mfd:g-bundle-isomorphism} の $\lambda_{\alpha}=I$ の同型で、ファイバー上では恒等写像を線形同型で挟んだものなので線形。
:::

::: intuition
ベクトル $w\in E_{m}$ を「基底 $u$ とその基底での成分 $v$ の組」と見る。基底を $A$ で取り替えると成分は $A^{-1}$ で変わるので、組 $(u,v)$ と $(u\circ A,A^{-1}v)$ は同じベクトルを表す。付随束の同値関係はちょうどこの「基底の取り替えと成分の変換の打ち消し合い」である。
:::

## 表現に付随するベクトル束と伏線回収 {#mfd:sec-vb-representations}

::: proposition 表現に付随するベクトル束 {#mfd:associated-vector-bundle keywords="for a representation rho: G -> GL(N), P x_rho R^N is a vector bundle of rank N with transition functions rho(g_{alpha beta})" index="表現に付随するベクトル束|ひょうげんにふずいするべくとるそく"}
$P$ を推移関数 $g_{\alpha\beta}$ の主 $G$ 束、$\rho\colon G\to\mathrm{GL}(N)$ を表現とし、$G$ を $\mathbb{R}^{N}$ に $h\cdot v\defeq\rho(h)v$ で作用させる。このとき $P\times_{\rho}\mathbb{R}^{N}\defeq P\times_{G}\mathbb{R}^{N}$ は、$[p,v]+[p,w]\defeq[p,v+w]$, $c[p,v]\defeq[p,cv]$ によって階数 $N$ のベクトル束になり、\ref{mfd:associated-bundle-structure.1} の $\Psi_{\alpha}$ はベクトル束の局所自明化で、推移関数は $\rho\circ g_{\alpha\beta}$ である。
:::

::: proof
\ref{mfd:associated-bundle-structure} の 1・2 の証明は作用の効果性を使っていない（その hypcheck）ので、$\rho$ が単射でなくても、$P\times_{G}\mathbb{R}^{N}$ は各 $\Psi_{\alpha}$ が微分同相写像になる多様体で、$\Psi_{\alpha}\circ\Psi_{\beta}^{-1}(m,v)=(m,\rho(g_{\alpha\beta}(m))v)$。作用 $(h,v)\mapsto\rho(h)v$ は滑らか（$\rho$ と行列の積の合成）。演算の well-defined 性：$p$ を $p\cdot h$ に取り替えると $[p\cdot h,\rho(h)^{-1}v]+[p\cdot h,\rho(h)^{-1}w]=[p\cdot h,\rho(h)^{-1}(v+w)]=[p,v+w]$（$\rho(h)$ の線形性）。ファイバーの各元は固定した $p$ を使って $[p,v]$ と一意に書けるので（\ref{mfd:associated-bundle-structure.1}）、これはベクトル空間の構造で、$\Psi_{\alpha}$ はファイバー上で $[s_{\alpha}(m),v]\mapsto v$ なので線形同型。推移関数 $\rho\circ g_{\alpha\beta}$ は滑らかな写像の合成で、$\mathrm{GL}(N)$ への写像として滑らか。
:::

::: theorem 接束・余接束・形式の束はフレーム束の付随束 {#mfd:tangent-bundle-frame keywords="TM = Fr(M) x_GL(n) R^n (standard representation), T*M = Fr(M) x_rho R^n with rho(A) = (A^{-1})^T, Lambda^k T*M = Fr(M) x Lambda^k rho; the Jacobian gluing of TM is recovered" index="接束とフレーム束|せっそくとふれーむそく"}
$M$ を $n$ 次元の可微分多様体、$\mathrm{Fr}(M)$ をそのフレーム束とする。$M$ のアトラス $\{(U_{\alpha},\varphi_{\alpha})\}$ について、$\mathrm{Fr}(M)$ の推移関数はヤコビ行列 $J_{\alpha\beta}(m)\defeq D(\varphi_{\alpha}\circ\varphi_{\beta}^{-1})(\varphi_{\beta}(m))$ である。さらに、ベクトル束として次の同型がある（いずれも $\lambda_{\alpha}=I$ の同型、つまり推移関数がそのまま一致する）。
1. $TM\cong\mathrm{Fr}(M)\times_{\mathrm{GL}(n)}\mathbb{R}^{n}$（標準表現）。
2. $T^{*}M\cong\mathrm{Fr}(M)\times_{\rho^{*}}\mathbb{R}^{n}$、ただし $\rho^{*}(A)\defeq(A^{-1})^{\mathsf{T}}$（双対表現）。
3. $\Lambda^{k}T^{*}M\cong\mathrm{Fr}(M)\times_{\Lambda^{k}\rho^{*}}\mathbb{R}^{\binom{n}{k}}$、ただし $\Lambda^{k}\rho^{*}(A)$ は、$\rho^{*}(A)$ が $\Lambda^{k}(\mathbb{R}^{n})$ の基底 $e_{i_{1}}\wedge\cdots\wedge e_{i_{k}}$（$i_{1}<\cdots<i_{k}$）に引き起こす線形変換の行列。
:::

::: proof
**推移関数.** \ref{mfd:tangent-bundle-gl.1} から、座標ベクトル場による $TM$ の局所自明化の推移関数は $J_{\alpha\beta}$。\ref{mfd:frame-bundle-principal.2} から、$\mathrm{Fr}(M)$ の推移関数も $J_{\alpha\beta}$。

**1.** \ref{mfd:vector-bundle-frame-associated} を $E=TM$ に使う。

**2.** \ref{mfd:associated-vector-bundle} から、右辺の推移関数は $\rho^{*}(J_{\alpha\beta})=(J_{\alpha\beta}^{-1})^{\mathsf{T}}$。\ref{mfd:tangent-bundle-gl.2} から $T^{*}M$ の推移関数も $(J_{\alpha\beta}^{-1})^{\mathsf{T}}$。同じ被覆の上で推移関数が一致するので、\ref{mfd:cocycle-isomorphism.1}（$\mathrm{GL}(n)$ の標準作用で見て、$\lambda_{\alpha}=I$）から同型。具体的には、二つの局所自明化を合成した写像 $\Phi^{-1}_{\alpha}\circ\Psi_{\alpha}$ が重なりで一致して同型を与え、これはファイバー上で線形。

**3.** 【主張：$\Lambda^{k}T^{*}M$ の推移関数は $\Lambda^{k}\rho^{*}(J_{\alpha\beta})$】$\Lambda^{k}T^{*}M$ の局所自明化を、基底 $dx^{\alpha}_{I}\defeq dx^{\alpha}_{i_{1}}\wedge\cdots\wedge dx^{\alpha}_{i_{k}}$ に関する成分で定める（\ref{mfd:cotangent-bundle} の後の注意）。$T_{m}^{*}M$ の中で、基底 $(dx^{\beta}_{j})_{j}$ に関する成分を $(dx^{\alpha}_{i})_{i}$ に関する成分に変換する行列は、2 から $B\defeq\rho^{*}(J_{\alpha\beta}(m))$。成分の変換が $B$ であることは、$\eta=\sum_{j}\eta^{\beta}_{j}dx^{\beta}_{j}$ のとき $dx^{\beta}_{j}=\sum_{i}B_{ij}dx^{\alpha}_{i}$ であることと同じ。すると
$$
dx^{\beta}_{J}=\bigwedge_{r=1}^{k}\Bigl(\sum_{i}B_{ij_{r}}dx^{\alpha}_{i}\Bigr)=\sum_{I}\det\bigl(B_{IJ}\bigr)\,dx^{\alpha}_{I}
$$
（$B_{IJ}$ は行 $I$・列 $J$ の小行列。ウェッジ積の多重線形性と交代性で展開し、同じ $I$ の項を並べ替えて集めると行列式になる）。$\det(B_{IJ})$ は、$B$ が $\Lambda^{k}\mathbb{R}^{n}$ の基底 $e_{J}\mapsto\sum_{I}\det(B_{IJ})e_{I}$ に引き起こす変換の行列成分そのものなので、成分の変換は $\Lambda^{k}B=\Lambda^{k}\rho^{*}(J_{\alpha\beta})$。$\Lambda^{k}\rho^{*}$ は準同型（$\Lambda^{k}(AB)=\Lambda^{k}A\,\Lambda^{k}B$、これは同じ展開を二回行えばよい）で、成分は小行列式なので滑らか。あとは 2 と同じ。

::: hypcheck
- 同型は「推移関数が同じ被覆の上で一致する」ことだけから従う（\ref{mfd:cocycle-isomorphism.1}）。このため、それぞれのアトラスを可算にとり、共通の被覆を使った。
:::
:::

::: remark 伏線回収
可微分多様体の系列では、$TM$ を「座標近傍ごとの $U\times\mathbb{R}^{n}$ をヤコビ行列で貼り合わせたもの」として、$T^{*}M$ を「ヤコビ行列の逆転置で貼り合わせたもの」として、それぞれアドホックに定義した。\ref{mfd:tangent-bundle-frame} は、これらが一つの主束 $\mathrm{Fr}(M)$（ヤコビ行列というコサイクルだけを記録したもの）に、$\mathrm{GL}(n)$ の異なる表現（標準表現・双対表現・外冪）を付随させたものであることを示している。座標変換でテンソルの成分がどう変わるか、という古典的な「変換則」は、どの表現を付随させるかの選択にほかならない。
:::

::: supplement
**高い視点：表現から束への関手.** 主 $G$ 束 $P$ を固定すると、$\rho\mapsto P\times_{\rho}\mathbb{R}^{N}$ は、$G$ の有限次元表現の圏から $M$ 上のベクトル束の圏への関手になり、直和・テンソル積・双対・外冪と可換である（推移関数が $\rho\circ g$ で、これらの演算は推移関数の上では表現の演算になるから）。とくに $TM$ から作られるすべてのテンソル束は、$\mathrm{GL}(n)$ の表現論の言葉で一度に記述できる。比喩で言えば、$\mathrm{Fr}(M)$ は「座標の取り替え方そのもの」で、表現は「その取り替えでどう変わる量か」の指定である。ベクトル・共ベクトル・密度（$\rho(A)=|\det A|^{-1}$）などは、同じ取り替えに対する異なる反応の仕方である。

**補足.** \ref{mfd:vector-bundle-frame-associated} と \ref{mfd:bundle-principal-correspondence} を合わせると、階数 $k$ のベクトル束の同型類と、主 $\mathrm{GL}(k)$ 束の同型類が一対一に対応する。
:::

## 問題 {#mfd:sec-vb-problems}

::: problem {#mfd:prob-vb-frame-section}
ベクトル束 $E$ について、$U$ の上の局所フレームと、$\mathrm{Fr}(E)$ の $U$ の上の滑らかな局所切断が一対一に対応することを示せ。これから、$E\restriction U$ が自明（$U\times\mathbb{R}^{k}$ とベクトル束として同型）であることと、$\mathrm{Fr}(E)\restriction U$ が大域切断をもつことは同値であることを導け。
:::

::: solution
局所切断 $s(m)=(m,u_{m})$ に $(u_{m}(e_{1}),\dots,u_{m}(e_{k}))$ を対応させる。$\hat\Phi_{\alpha}(s(m))=(m,K(m))$ とすると、$u_{m}(e_{i})=\Phi_{\alpha}^{-1}(m,K(m)e_{i})$ なので、$s$ が滑らかなことと各 $u_{m}(e_{i})$ が滑らかな切断であることは同値（$K$ の成分の滑らかさに帰着）。基底になることは $u_{m}$ が線形同型であることと同値。後半：局所フレームがあれば \ref{mfd:local-frame-trivialization} から $E\restriction U$ は自明、逆に自明化 $\Phi$ があれば $\Phi^{-1}(m,e_{i})$ が局所フレーム。
:::

::: problem {#mfd:prob-vb-dual-bundle}
階数 $k$ のベクトル束 $E$ の推移関数を $g_{\alpha\beta}$ とする。$E^{*}\defeq\mathrm{Fr}(E)\times_{\rho^{*}}\mathbb{R}^{k}$（$\rho^{*}(A)=(A^{-1})^{\mathsf{T}}$）のファイバー $E^{*}_{m}$ が、$E_{m}$ の双対空間と自然に同一視できることを示せ（**双対束**）。
:::

::: solution
$[(m,u),\eta]\in E^{*}_{m}$（$\eta\in\mathbb{R}^{k}$ を列ベクトルとみる）に、線形形式 $\ell\colon E_{m}\to\mathbb{R}$, $\ell(w)\defeq\eta^{\mathsf{T}}u^{-1}(w)$ を対応させる。well-defined：$[(m,u\circ A),\rho^{*}(A)^{-1}\eta]=[(m,u\circ A),A^{\mathsf{T}}\eta]$ に対しては $(A^{\mathsf{T}}\eta)^{\mathsf{T}}(u\circ A)^{-1}(w)=\eta^{\mathsf{T}}AA^{-1}u^{-1}(w)=\eta^{\mathsf{T}}u^{-1}(w)$。$u$ を固定すると $\eta\mapsto\ell$ は $\mathbb{R}^{k}\to E_{m}^{*}$ の線形同型（$\ell\circ u$ の行列が $\eta^{\mathsf{T}}$）なので、ファイバーごとの線形同型である。
:::
