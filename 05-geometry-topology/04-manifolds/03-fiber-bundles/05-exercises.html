# 演習：ファイバー束 {#mfd:page-exercises-bundles keywords="exercises, Fiber Bundles"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#mfd:sec-exfb-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。開被覆の添字集合はいつも可算とする。
- $S^{1}$ の開被覆 $U_{+}$, $U_{-}$ と、$U_{+}\cap U_{-}$ の連結成分 $C_{1}$（$x>0$ の部分）, $C_{2}$（$x<0$ の部分）は \ref{mfd:mobius-bundle} のとおりとする。$U_{\pm}$, $C_{1}$, $C_{2}$ はどれも開円弧で、連結である。$\mathrm{O}(1)=\{\pm1\}$ は $\mathbb{R}$ に掛け算で作用させる。
- 「$G$ 束として同型」は \ref{mfd:g-bundle-isomorphism} の意味で、二つの $G$ 束を比べるときは同じ開被覆の上の $G$ アトラスを使う。$M$ 上の自明束 $M\times F$ には、どの開被覆 $\{U_{\alpha}\}$ についても $G$ アトラス $\{(U_{\alpha},\mathrm{id})\}$（推移関数はすべて $e$）を考える。
- 連続写像で、離散集合（$\{\pm1\}$ など）に値をとるものは、連結集合の上で定数である。
:::

## ファイバー束と推移関数 {#mfd:sec-fb-exercises}

対応するページ：\ref{mfd:page-fiber-bundles}

::: problem ★ 基本：角度座標による接束の推移関数 {#mfd:ex-fb-1}
$S^{1}$ に二つの座標近傍
$$
U_{1}\defeq S^{1}\setminus\{(-1,0)\},\quad\varphi_{1}^{-1}(t)=(\cos t,\sin t)\ (t\in(-\pi,\pi)),\qquad U_{2}\defeq S^{1}\setminus\{(1,0)\},\quad\varphi_{2}^{-1}(t)=(\cos t,\sin t)\ (t\in(0,2\pi))
$$
を入れる（これらが $S^{1}$ の可微分構造に属することは認めてよい）。\ref{mfd:tangent-bundle-gl} の $\mathrm{GL}(1,\mathbb{R})$ アトラスについて $TS^{1}$ の推移関数 $g_{12}$ を求め、$TS^{1}$ が $\mathrm{GL}(1,\mathbb{R})$ 束として自明であることを示せ。また、$\Phi_{1}^{-1}(m,1)$ と $\Phi_{2}^{-1}(m,1)$ が貼り合わさって、どこでも $0$ にならない滑らかなベクトル場を与えることを示せ。
:::

::: solution
$U_{1}\cap U_{2}=S^{1}\setminus\{(\pm1,0)\}$ は、上半分 $\{y>0\}$ と下半分 $\{y<0\}$ からなる。上半分の点 $m=(\cos t,\sin t)$（$t\in(0,\pi)$）では $\varphi_{1}(m)=\varphi_{2}(m)=t$。下半分の点 $m=(\cos t,\sin t)$（$t\in(\pi,2\pi)$）では $\varphi_{2}(m)=t$, $\varphi_{1}(m)=t-2\pi\in(-\pi,0)$。よって
$$
\varphi_{1}\circ\varphi_{2}^{-1}(t)=\begin{cases}t&(t\in(0,\pi))\\t-2\pi&(t\in(\pi,2\pi))\end{cases}
$$
で、どちらの区間でも導関数は $1$ である。\ref{mfd:tangent-bundle-gl.1} から
$$
g_{12}(m)=D(\varphi_{1}\circ\varphi_{2}^{-1})(\varphi_{2}(m))=1\qquad(m\in U_{1}\cap U_{2}),
$$
また \ref{mfd:cocycle-condition} から $g_{21}=g_{12}^{-1}=1$, $g_{11}=g_{22}=1$。

**自明であること.** 自明束 $S^{1}\times\mathbb{R}$ の $G$ アトラス $\{(U_{i},\mathrm{id})\}$ の推移関数もすべて $1$ なので、$\lambda_{1}=\lambda_{2}\defeq1$ とおけば $1=\lambda_{1}g_{12}\lambda_{2}^{-1}$ が成り立つ。\ref{mfd:cocycle-isomorphism.1} から、$TS^{1}$ と $S^{1}\times\mathbb{R}$ は $\mathrm{GL}(1,\mathbb{R})$ 束として同型である。

**ベクトル場.** $X_{i}(m)\defeq\Phi_{i}^{-1}(m,1)$（$m\in U_{i}$）は、滑らかな写像 $m\mapsto(m,1)$ と $\Phi_{i}^{-1}$ の合成なので滑らかで、$\pi\circ X_{i}=\mathrm{id}$。$m\in U_{1}\cap U_{2}$ では
$$
\Phi_{1}(X_{2}(m))=\Phi_{1}\circ\Phi_{2}^{-1}(m,1)=(m,g_{12}(m)\cdot1)=(m,1)=\Phi_{1}(X_{1}(m))
$$
で、$\Phi_{1}$ は単射なので $X_{1}(m)=X_{2}(m)$。よって $X_{1}$, $X_{2}$ は $S^{1}$ 全体の滑らかなベクトル場 $X$ に貼り合わさる。$\Phi_{i}$ はファイバーの上で線形同型（$v\mapsto(v(x^{i}))$）なので、$X(m)$ は $(m,1)$ の逆像として $0$ でない。
:::

::: problem ★★ 標準：円周上の O(1) 束の分類 {#mfd:ex-fb-2}
被覆 $\{U_{+},U_{-}\}$ の上の $\mathrm{O}(1)$ 値のコサイクル（ファイバー $\mathbb{R}$、掛け算の作用）をすべて求めよ。さらに、二つのコサイクルがコホモロガスであるための必要十分条件を求め、この被覆の上の $\mathrm{O}(1)$ アトラスをもつ $S^{1}$ 上の $\mathrm{O}(1)$ 束は、同型を除いて、自明束と \ref{mfd:mobius-bundle} の束のちょうど二つであることを示せ。
:::

::: solution
**コサイクルの決定.** コサイクル $g$ について、\ref{mfd:bundle-from-cocycle} の証明の Step 1 と同じ計算で $g_{++}=g_{--}=1$, $g_{-+}=g_{+-}^{-1}=g_{+-}$（$\{\pm1\}$ の元は自分自身の逆元）。$g_{+-}\colon U_{+}\cap U_{-}\to\{\pm1\}$ は連続なので、連結な $C_{1}$, $C_{2}$ の上でそれぞれ定数で、その値を $a$, $b\in\{\pm1\}$ とする。このコサイクルを $g^{(a,b)}$ と書く。逆に、どの $(a,b)$ についても $g^{(a,b)}$ はコサイクルである：局所定数関数は滑らかで、添字は二つなので三つの添字の少なくとも二つが一致し、$g_{\alpha\alpha}=1$ と $g_{+-}g_{-+}=g_{+-}^{2}=1$ からコサイクル条件のすべての場合が従う（\ref{mfd:mobius-bundle} の証明と同じ）。こうして、コサイクルは $g^{(a,b)}$ の 4 通りである。$g^{(1,1)}$ は自明束の、$g^{(1,-1)}$ は \ref{mfd:mobius-bundle} の束の推移関数である。

**コホモロガスである条件.** 【主張：$g^{(a,b)}$ と $g^{(a',b')}$ がコホモロガス $\iff$ $ab=a'b'$】

「⇒」：滑らかな $\lambda_{\pm}\colon U_{\pm}\to\{\pm1\}$ で $g^{(a',b')}_{+-}=\lambda_{+}g^{(a,b)}_{+-}\lambda_{-}^{-1}$ となるものがあるとする。$U_{\pm}$ は連結なので $\lambda_{\pm}$ は定数 $l_{\pm}$ で、$l_{-}^{-1}=l_{-}$ だから、$C_{1}$, $C_{2}$ の上で見て $a'=l_{+}l_{-}a$, $b'=l_{+}l_{-}b$。よって $a'b'=(l_{+}l_{-})^{2}ab=ab$。

「⇐」：$ab=a'b'$ なら、$a'=a$ かつ $b'=b$ であるか、$a'=-a$ かつ $b'=-b$ である（$a'=a$ なら $b'=ab/a'=b$、$a'=-a$ なら $b'=-b$）。前者は $\lambda_{\pm}\defeq1$ で、後者は $\lambda_{+}\defeq-1$, $\lambda_{-}\defeq1$ で、$\lambda_{+}g^{(a,b)}_{+-}\lambda_{-}^{-1}=g^{(a',b')}_{+-}$ となる（$g_{-+}$ についても値が $g_{+-}$ と同じなので同じ式、$g_{\pm\pm}$ については $\lambda_{\pm}1\lambda_{\pm}^{-1}=1$）。

**分類.** この被覆の上の $\mathrm{O}(1)$ アトラスをもつ $\mathrm{O}(1)$ 束の推移関数は、ある $g^{(a,b)}$ である。\ref{mfd:cocycle-isomorphism.1} から、二つの束が同型 $\iff$ 推移関数がコホモロガス $\iff$ $ab$ が等しい。$ab=1$ の類は自明束 $g^{(1,1)}$ の類、$ab=-1$ の類はメビウスの帯 $g^{(1,-1)}$ の類で、これらは異なる。よって同型類はちょうど二つである（どちらの類も実際に現れることは \ref{mfd:bundle-from-cocycle} から）。
:::

::: problem ★★ 標準：コサイクルの引き戻し {#mfd:ex-fb-3}
$f\colon N\to M$ を可微分多様体の間の滑らかな写像、$g$ を $M$ の開被覆 $\{U_{\alpha}\}$ の上の $G$ 値のコサイクルとする。$V_{\alpha}\defeq f^{-1}(U_{\alpha})$ とおく。
1. $(f^{*}g)_{\alpha\beta}\defeq g_{\alpha\beta}\circ f\colon V_{\alpha}\cap V_{\beta}\to G$ は、$N$ の開被覆 $\{V_{\alpha}\}$ の上のコサイクルであることを示せ。
2. $g$ と $g'$ がコホモロガスなら、$f^{*}g$ と $f^{*}g'$ もコホモロガスであることを示せ。したがって、束 $E(f^{*}g)$ の同型類は $E(g)$ の同型類だけで決まる。
3. $f$ が定値写像（$f(n)=m_{0}$）なら、$E(f^{*}g)$ は自明束 $N\times F$ と $G$ 束として同型であることを示せ。
:::

::: solution
**1.** $V_{\alpha}$ は連続写像による開集合の逆像なので開集合で、$\bigcup_{\alpha}V_{\alpha}=f^{-1}(M)=N$。$V_{\alpha}\cap V_{\beta}=f^{-1}(U_{\alpha}\cap U_{\beta})$ なので $g_{\alpha\beta}\circ f$ はそこで定義され、滑らかな写像の合成なので滑らか。$n\in V_{\alpha}\cap V_{\beta}\cap V_{\gamma}$ なら $f(n)\in U_{\alpha}\cap U_{\beta}\cap U_{\gamma}$ なので
$$
(f^{*}g)_{\alpha\beta}(n)(f^{*}g)_{\beta\gamma}(n)=g_{\alpha\beta}(f(n))g_{\beta\gamma}(f(n))=g_{\alpha\gamma}(f(n))=(f^{*}g)_{\alpha\gamma}(n).
$$

**2.** $g'_{\alpha\beta}=\lambda_{\alpha}g_{\alpha\beta}\lambda_{\beta}^{-1}$（$\lambda_{\alpha}\colon U_{\alpha}\to G$ は滑らか）とする。$\mu_{\alpha}\defeq\lambda_{\alpha}\circ f\colon V_{\alpha}\to G$ は滑らかで、$n\in V_{\alpha}\cap V_{\beta}$ で $f(n)$ を代入すると $(f^{*}g')_{\alpha\beta}(n)=\mu_{\alpha}(n)(f^{*}g)_{\alpha\beta}(n)\mu_{\beta}(n)^{-1}$。後半は \ref{mfd:cocycle-isomorphism.1} から：$E(g)\cong E(g')$ なら $g$ と $g'$ はコホモロガスで、いま示したことから $f^{*}g$ と $f^{*}g'$ もコホモロガス、よって $E(f^{*}g)\cong E(f^{*}g')$。

**3.** $V_{\alpha}$ は、$m_{0}\in U_{\alpha}$ なら $N$、そうでなければ空集合である。$m_{0}\in U_{\alpha_{0}}$ となる $\alpha_{0}$ を一つ選ぶ。$V_{\alpha}\neq\emptyset$ のとき $m_{0}\in U_{\alpha_{0}}\cap U_{\alpha}$ なので、定数写像 $\lambda_{\alpha}\defeq g_{\alpha_{0}\alpha}(m_{0})\colon V_{\alpha}\to G$ が定義でき（$V_{\alpha}=\emptyset$ のときは空写像）、滑らかである。$n\in V_{\alpha}\cap V_{\beta}$ で、\ref{mfd:cocycle-condition}（$g_{\beta\alpha_{0}}=g_{\alpha_{0}\beta}^{-1}$ とコサイクル条件）を $m_{0}$ で使うと
$$
\lambda_{\alpha}(f^{*}g)_{\alpha\beta}(n)\lambda_{\beta}^{-1}=g_{\alpha_{0}\alpha}(m_{0})\,g_{\alpha\beta}(m_{0})\,g_{\beta\alpha_{0}}(m_{0})=g_{\alpha_{0}\alpha_{0}}(m_{0})=e.
$$
よって $f^{*}g$ は自明なコサイクルとコホモロガスで、\ref{mfd:cocycle-isomorphism.1} から $E(f^{*}g)$ は（同じ被覆の上の $G$ アトラス $\{(V_{\alpha},\mathrm{id})\}$ をもつ）自明束 $N\times F$ と同型である。
:::

::: problem ★★★ 発展：可換な構造群とコホモロジー群 {#mfd:ex-fb-4}
$G$ を可換なリー群とし、$M$ の開被覆 $\mathfrak{U}=\{U_{\alpha}\}$ を固定する。
1. 二つのコサイクル $g$, $g'$ の各点ごとの積 $(gg')_{\alpha\beta}(m)\defeq g_{\alpha\beta}(m)g'_{\alpha\beta}(m)$ はコサイクルであり、この積でコサイクルの全体は可換群になることを示せ。
2. この積は「コホモロガス」の類の上で well-defined であり、類の全体 $\check H^{1}(\mathfrak{U};G)$ は可換群になること、その単位元の類は自明束の推移関数の類であることを示せ。
3. $M=S^{1}$, $\mathfrak{U}=\{U_{+},U_{-}\}$, $G=\mathrm{O}(1)$ のとき、$\check H^{1}(\mathfrak{U};\mathrm{O}(1))$ は位数 $2$ の群であることを示せ（前節の ★★ の問題「円周上の O(1) 束の分類」の結果を使ってよい）。
:::

::: solution
**1.** $gg'$ の各成分は、滑らかな写像 $m\mapsto(g_{\alpha\beta}(m),g'_{\alpha\beta}(m))$ と $G$ の積（\ref{lie:lie-group.1} から滑らか）の合成なので滑らか。三つの添字が重なる点で、$G$ の可換性を使って
$$
(gg')_{\alpha\beta}(gg')_{\beta\gamma}=g_{\alpha\beta}g'_{\alpha\beta}g_{\beta\gamma}g'_{\beta\gamma}=(g_{\alpha\beta}g_{\beta\gamma})(g'_{\alpha\beta}g'_{\beta\gamma})=g_{\alpha\gamma}g'_{\alpha\gamma}=(gg')_{\alpha\gamma}.
$$
結合律と可換性は $G$ のものから各点で従う。単位元は自明なコサイクル $e_{\alpha\beta}\equiv e$。逆元は $(g^{-1})_{\alpha\beta}(m)\defeq g_{\alpha\beta}(m)^{-1}$ で、逆元をとる写像の滑らかさから滑らか、コサイクルであることは
$$
g_{\alpha\beta}^{-1}g_{\beta\gamma}^{-1}=(g_{\beta\gamma}g_{\alpha\beta})^{-1}=(g_{\alpha\beta}g_{\beta\gamma})^{-1}=g_{\alpha\gamma}^{-1}
$$
（2 番目の等号で可換性）から。

**2.** $g'=\lambda g\lambda^{-1}$, $h'=\mu h\mu^{-1}$（$\lambda_{\alpha}$, $\mu_{\alpha}\colon U_{\alpha}\to G$ は滑らか）とする。可換性から $g'_{\alpha\beta}h'_{\alpha\beta}=(\lambda_{\alpha}\mu_{\alpha})(g_{\alpha\beta}h_{\alpha\beta})(\lambda_{\beta}\mu_{\beta})^{-1}$ で、$\lambda_{\alpha}\mu_{\alpha}$ は滑らかなので、$g'h'$ と $gh$ はコホモロガス。よって積は類の上で well-defined で、群の公理は代表元の上の公理から従う。単位元の類は自明なコサイクル $e$ の類で、これは自明束 $M\times F$ の $G$ アトラス $\{(U_{\alpha},\mathrm{id})\}$ の推移関数である。

**3.** 円周上の O(1) 束の分類の問題（この節の ★★）から、コサイクルは $g^{(a,b)}$ の 4 通りで、$g^{(a,b)}$ と $g^{(a',b')}$ がコホモロガス $\iff$ $ab=a'b'$。よって $[g^{(a,b)}]\mapsto ab$ は $\check H^{1}(\mathfrak{U};\mathrm{O}(1))$ から $\{\pm1\}$ への well-defined な全単射である。積は各点ごとなので $g^{(a,b)}g^{(a',b')}=g^{(aa',bb')}$ で、$(aa')(bb')=(ab)(a'b')$ だから、この全単射は群の同型。よって位数 $2$ の群で、非自明な元はメビウスの帯の類である。
:::

## 主束と付随束 {#mfd:sec-pb-exercises}

対応するページ：\ref{mfd:page-principal-bundles}

::: problem ★ 基本：左からの積に付随する束 {#mfd:ex-pb-1}
主 $G$ 束 $P$ について、$G$ を $G$ 自身に左からの積で作用させた付随束 $P\times_{G}G$ を考える。$\Theta([p,k])\defeq p\cdot k$ が well-defined で、$P\times_{G}G$ から $P$ への $G$ 束の同型であることを示せ。
:::

::: solution
左からの積は滑らかで効果的なので（\ref{mfd:principal-bundle} の後の注意）、\ref{mfd:associated-bundle-structure} が使える。

**well-defined.** $[p,k]$ の別の代表元は $(p\cdot h,h^{-1}k)$ の形で、\ref{mfd:principal-right-action.1} の作用の公理から $(p\cdot h)\cdot(h^{-1}k)=p\cdot(hh^{-1}k)=p\cdot k$。

**局所自明化で見ると恒等写像.** $P$ の $G$ アトラスを $\{(U_{\alpha},\Phi_{\alpha})\}$、局所切断を $s_{\alpha}$ とし、$P\times_{G}G$ の局所自明化を $\Psi_{\alpha}([s_{\alpha}(m),k])=(m,k)$（\ref{mfd:associated-bundle-structure.1}）とする。\ref{mfd:principal-right-action.3} から
$$
\Theta\circ\Psi_{\alpha}^{-1}(m,k)=s_{\alpha}(m)\cdot k=\Phi_{\alpha}^{-1}(m,k),
\qquad\text{つまり}\qquad\Phi_{\alpha}\circ\Theta\circ\Psi_{\alpha}^{-1}=\mathrm{id}_{U_{\alpha}\times G}.
$$
よって $\Theta$ は $\pi_{G}^{-1}(U_{\alpha})$ の上で微分同相写像 $\Phi_{\alpha}^{-1}\circ\Psi_{\alpha}$ に等しく、$\pi_{G}^{-1}(U_{\alpha})$ を $\pi^{-1}(U_{\alpha})$ の上に全単射に写す。$\pi\circ\Theta=\pi_{G}$（$\pi(p\cdot k)=\pi(p)$）なのでファイバーを保ち、$\Theta$ は全体で全単射、局所的に微分同相写像なので微分同相写像である。上の式は \ref{mfd:g-bundle-isomorphism} で $\lambda_{\alpha}=e$ とした形なので、$\Theta$ は $G$ 束の同型である。
:::

::: problem ★★ 標準：主束の自明性と同変写像 {#mfd:ex-pb-2}
主 $G$ 束 $\pi\colon P\to M$ が自明束 $M\times G$ と $G$ 束として同型であるための必要十分条件は、滑らかな写像 $\phi\colon P\to G$ で $\phi(p\cdot h)=h^{-1}\phi(p)$（$p\in P$, $h\in G$）を満たすものが存在することであることを示せ。このとき、大域切断を $\phi$ で具体的に書け。
:::

::: solution
前問の同型 $\Theta\colon P\times_{G}G\to P$ を使う。

**切断の対応.** $\pi\circ\Theta=\pi_{G}$ なので、$P\times_{G}G$ の滑らかな切断 $\sigma$ に対して $\Theta\circ\sigma$ は $P$ の滑らかな切断で、逆に $P$ の滑らかな切断 $s$ に対して $\Theta^{-1}\circ s$ は $P\times_{G}G$ の滑らかな切断である。この二つの対応は互いに逆である。

**同変写像との対応.** $G$ が $G$ に左からの積で作用するとき、\ref{mfd:sections-equivariant} の条件は $\phi(p\cdot h)=h^{-1}\phi(p)$ である。よって \ref{mfd:sections-equivariant} から、そのような滑らかな $\phi$ と $P\times_{G}G$ の滑らかな切断 $\sigma$ が、$\sigma(\pi(p))=[p,\phi(p)]$ で一対一に対応する。

**結論.** 以上から、$\phi$ が存在する $\iff$ $P\times_{G}G$ が滑らかな切断をもつ $\iff$ $P$ が滑らかな大域切断をもつ $\iff$ $P\cong M\times G$（最後は \ref{mfd:principal-trivial-section}）。対応する $P$ の切断は
$$
s(\pi(p))=\Theta([p,\phi(p)])=p\cdot\phi(p)
$$
である。実際、これが $p\in\pi^{-1}(m)$ の選び方によらないことは直接にも確かめられる：$(p\cdot h)\cdot\phi(p\cdot h)=p\cdot(hh^{-1}\phi(p))=p\cdot\phi(p)$。
:::

::: problem ★★ 標準：メビウスの帯の切断は零点をもつ {#mfd:ex-pb-3}
$g$ を \ref{mfd:mobius-bundle} のコサイクル、$P\defeq E(g;\mathrm{O}(1))$ を主 $\mathrm{O}(1)$ 束とし、$E\defeq P\times_{\mathrm{O}(1)}\mathbb{R}$（掛け算の作用）とする。
1. $z_{m}\defeq[p,0]$（$p\in\pi^{-1}(m)$）は $p$ によらないことを示せ。
2. $E$ の滑らかな切断 $\sigma$ は、$\sigma(m)=z_{m}$ となる点 $m$（零点）を必ずもつことを示せ。
3. 滑らかな写像 $\phi\colon P\to\mathbb{R}$ で $\phi(p\cdot(-1))=-\phi(p)$ を満たすものは、必ず零点をもつことを示せ。
:::

::: solution
**1.** $\pi^{-1}(m)$ の点は $p\cdot h$（$h=\pm1$）の形で（\ref{mfd:principal-right-action.2}）、$[p\cdot h,0]=[p,h\cdot0]=[p,0]$。

**2.** $E$ の局所自明化 $\Psi_{\pm}([s_{\pm}(m),f])=(m,f)$ は、\ref{mfd:associated-bundle-structure.2} から推移関数 $g$ の $\mathrm{O}(1)$ アトラスで、$\Psi_{+}\circ\Psi_{-}^{-1}(m,f)=(m,g_{+-}(m)f)$。$\tau_{\pm}\defeq\mathrm{pr}_{2}\circ\Psi_{\pm}\circ\sigma\colon U_{\pm}\to\mathbb{R}$ は滑らかで、$m\in U_{+}\cap U_{-}$ では
$$
(m,\tau_{+}(m))=\Psi_{+}(\sigma(m))=\Psi_{+}\circ\Psi_{-}^{-1}(m,\tau_{-}(m))=(m,g_{+-}(m)\tau_{-}(m)),
$$
つまり $\tau_{+}=g_{+-}\tau_{-}$。また 1 から $z_{m}=[s_{\pm}(m),0]$ なので、$\tau_{\pm}(m)=0\iff\sigma(m)=z_{m}$。

零点がないとすると、$\tau_{\pm}$ は連結な $U_{\pm}$ の上の $0$ にならない連続関数なので、符号は一定で、それを $\varepsilon_{\pm}\in\{\pm1\}$ とする。$C_{1}$ の点では $g_{+-}=1$ なので $\varepsilon_{+}=\varepsilon_{-}$、$C_{2}$ の点では $g_{+-}=-1$ なので $\varepsilon_{+}=-\varepsilon_{-}$。$C_{1}$, $C_{2}$ はどちらも空でないので矛盾する。

**3.** $\mathrm{O}(1)$ では $h^{-1}=h$ なので、条件 $\phi(p\cdot h)=h^{-1}\cdot\phi(p)$（$h=\pm1$）は $\phi(p\cdot(-1))=-\phi(p)$ と同じである（$h=1$ では自明）。\ref{mfd:sections-equivariant} から、$\phi$ に対応する滑らかな切断 $\sigma$ で $\sigma(\pi(p))=[p,\phi(p)]$ となるものがある。2 から $\sigma(m)=z_{m}$ となる $m$ があり、$p\in\pi^{-1}(m)$ をとると $[p,\phi(p)]=[p,0]$。\ref{mfd:associated-bundle-structure.1} の証明と同じく（作用の自由性から）、同じ $p$ を代表元にもつ二つの表示は第 2 成分が一致するので、$\phi(p)=0$。
:::

::: problem ★★★ 発展：主 O(1) 束の全空間の連結性 {#mfd:ex-pb-4}
前節の ★★ の問題「円周上の O(1) 束の分類」の記号で、$P^{(a,b)}\defeq E(g^{(a,b)};\mathrm{O}(1))$ を $S^{1}$ 上の主 $\mathrm{O}(1)$ 束とする。$P^{(a,b)}$ が連結であるための必要十分条件は $ab=-1$ であることを示せ。これから、メビウスの帯の主束 $P^{(1,-1)}$ が自明束 $S^{1}\times\mathrm{O}(1)$ と同型でないことを、コサイクルを使わずに結論せよ。
:::

::: solution
$\Phi_{\pm}$ を $P^{(a,b)}$ の局所自明化とし、$\varepsilon,\delta\in\{\pm1\}$ について
$$
A_{\varepsilon}\defeq\Phi_{+}^{-1}(U_{+}\times\{\varepsilon\}),\qquad B_{\delta}\defeq\Phi_{-}^{-1}(U_{-}\times\{\delta\})
$$
とおく。

**各部分の性質.** $\mathrm{O}(1)$ は $0$ 次元の多様体（離散空間）なので $U_{+}\times\{\varepsilon\}$ は $U_{+}\times\mathrm{O}(1)$ の開集合で、$\Phi_{+}$ は開集合 $\pi^{-1}(U_{+})$ からの同相写像なので、$A_{\varepsilon}$ は $P^{(a,b)}$ の開集合で、連結な $U_{+}$ と同相なので連結。$B_{\delta}$ も同様。$\pi^{-1}(U_{+})=A_{1}\cup A_{-1}$, $\pi^{-1}(U_{-})=B_{1}\cup B_{-1}$ なので、四つの集合は $P^{(a,b)}$ を覆い、$A_{1}\cap A_{-1}=B_{1}\cap B_{-1}=\emptyset$。

**交わりの判定.** 【主張：$A_{\varepsilon}\cap B_{\delta}\neq\emptyset\iff\varepsilon\delta\in\{a,b\}$】$p\in B_{\delta}$ で $\pi(p)=m\in U_{+}\cap U_{-}$ なら $\Phi_{-}(p)=(m,\delta)$ で、$\Phi_{+}(p)=\Phi_{+}\circ\Phi_{-}^{-1}(m,\delta)=(m,g_{+-}(m)\delta)$。よって $p\in A_{\varepsilon}\iff g_{+-}(m)\delta=\varepsilon\iff g_{+-}(m)=\varepsilon\delta$。$g_{+-}$ の値域は $\{a,b\}$（$C_{1}$ で $a$, $C_{2}$ で $b$）なので主張が従う。

**$ab=-1$ のとき.** $\{a,b\}=\{1,-1\}$ なので、四つの交わり $A_{\varepsilon}\cap B_{\delta}$ はすべて空でない。連結集合の和は、共通点があれば連結なので、$A_{1}\cup B_{1}$, それに $B_{-1}$（$A_{1}$ と交わる）、さらに $A_{-1}$（$B_{1}$ と交わる）を順に加えた $P^{(a,b)}=A_{1}\cup B_{1}\cup B_{-1}\cup A_{-1}$ は連結。

**$ab=1$ のとき.** $a=b\defeq c$ で、$A_{\varepsilon}\cap B_{\delta}\neq\emptyset\iff\varepsilon\delta=c$。$X\defeq A_{1}\cup B_{c}$, $Y\defeq A_{-1}\cup B_{-c}$ とおくと、どちらも空でない開集合で $P^{(a,b)}=X\cup Y$。$X\cap Y$ は $A_{1}\cap A_{-1}$, $A_{1}\cap B_{-c}$, $B_{c}\cap A_{-1}$, $B_{c}\cap B_{-c}$ の和で、$1\cdot(-c)=-c\neq c$, $(-1)\cdot c\neq c$ なので、すべて空。よって $P^{(a,b)}$ は連結でない。

**結論.** $G$ 束の同型は微分同相写像、とくに同相写像なので、連結性を保つ。$P^{(1,-1)}$ は連結で、自明束 $S^{1}\times\mathrm{O}(1)=P^{(1,1)}$ は連結でないので、同型でない。
:::

## ベクトル束とフレーム束 {#mfd:sec-vb-exercises}

対応するページ：\ref{mfd:page-vector-bundles}

::: problem ★ 基本：極座標と余接束・2 形式の束の推移関数 {#mfd:ex-vb-1}
$M\defeq\mathbb{R}^{2}\setminus\{(x,0):x\le0\}$ に、二つの座標近傍（定義域はどちらも $M$）
$$
\varphi_{\beta}(m)\defeq(x,y),\qquad\varphi_{\alpha}(m)\defeq(r,\theta)\quad(x=r\cos\theta,\ y=r\sin\theta,\ r>0,\ \theta\in(-\pi,\pi))
$$
を入れる。
1. $\mathrm{GL}(n)$ の任意の $A$ について、$\Lambda^{n}\rho^{*}(A)=1/\det A$（$1\times1$ 行列）を示せ。
2. \ref{mfd:tangent-bundle-frame} を使って、$T^{*}M$ と $\Lambda^{2}T^{*}M$ の推移関数 $g_{\alpha\beta}$ を $r,\theta$ で表せ。
3. 2 の結果を、$dx$, $dy$ を $dr$, $d\theta$ で直接書き表す計算と照合せよ。
:::

::: solution
**1.** $k=n$ では添字の組は $I=J=\{1,\dots,n\}$ だけで、\ref{mfd:tangent-bundle-frame} の証明の式から $\Lambda^{n}B$ の唯一の成分は $\det B$。$B=\rho^{*}(A)=(A^{-1})^{\mathsf{T}}$ とすると $\det B=\det(A^{-1})=1/\det A$。

**2.** $J_{\alpha\beta}=D(\varphi_{\alpha}\circ\varphi_{\beta}^{-1})=\partial(r,\theta)/\partial(x,y)$ は、$\varphi_{\beta}\circ\varphi_{\alpha}^{-1}$ のヤコビ行列
$$
J_{\alpha\beta}^{-1}=\frac{\partial(x,y)}{\partial(r,\theta)}=\begin{pmatrix}\cos\theta&-r\sin\theta\\\sin\theta&r\cos\theta\end{pmatrix}
$$
の逆行列である（連鎖律）。\ref{mfd:tangent-bundle-frame.2} と \ref{mfd:associated-vector-bundle} から $T^{*}M$ の推移関数は
$$
\rho^{*}(J_{\alpha\beta})=(J_{\alpha\beta}^{-1})^{\mathsf{T}}=\begin{pmatrix}\cos\theta&\sin\theta\\-r\sin\theta&r\cos\theta\end{pmatrix}.
$$
\ref{mfd:tangent-bundle-frame.3} と 1 から、$\Lambda^{2}T^{*}M$ の推移関数は $1/\det J_{\alpha\beta}=\det(J_{\alpha\beta}^{-1})=r\cos^{2}\theta+r\sin^{2}\theta=r$。

**3.** $dx=\cos\theta\,dr-r\sin\theta\,d\theta$, $dy=\sin\theta\,dr+r\cos\theta\,d\theta$。$\eta=\eta^{\beta}_{1}dx+\eta^{\beta}_{2}dy$ を $dr$, $d\theta$ で書くと
$$
\eta=(\cos\theta\,\eta^{\beta}_{1}+\sin\theta\,\eta^{\beta}_{2})\,dr+(-r\sin\theta\,\eta^{\beta}_{1}+r\cos\theta\,\eta^{\beta}_{2})\,d\theta
$$
で、$\beta$ 成分から $\alpha$ 成分への変換の行列は 2 の $\rho^{*}(J_{\alpha\beta})$ に一致する。また
$$
dx\wedge dy=(\cos\theta\cdot r\cos\theta-(-r\sin\theta)\sin\theta)\,dr\wedge d\theta=r\,dr\wedge d\theta
$$
なので、$\omega=c_{\beta}\,dx\wedge dy$ の $\alpha$ 成分は $c_{\alpha}=r\,c_{\beta}$ で、推移関数 $r$ に一致する。
:::

::: problem ★★ 標準：二重双対と行列式束 {#mfd:ex-vb-2}
$E$ を階数 $k$ のベクトル束、$\rho^{*}(A)\defeq(A^{-1})^{\mathsf{T}}$ とし、$E^{*}\defeq\mathrm{Fr}(E)\times_{\rho^{*}}\mathbb{R}^{k}$, $E^{**}\defeq\mathrm{Fr}(E^{*})\times_{\rho^{*}}\mathbb{R}^{k}$ とおく。また $\det E\defeq\mathrm{Fr}(E)\times_{\det}\mathbb{R}$ とおく。
1. $E^{**}$ と $E$ は $\mathrm{GL}(k)$ 束として同型であることを示せ。
2. $n$ 次元の可微分多様体 $M$ について、$\det(T^{*}M)$ と $\Lambda^{n}T^{*}M$ は $\mathrm{GL}(1)$ 束として同型であることを示せ。
:::

::: solution
$\rho^{*}$ と $\det$ は表現である：$\rho^{*}(AB)=((AB)^{-1})^{\mathsf{T}}=(B^{-1}A^{-1})^{\mathsf{T}}=(A^{-1})^{\mathsf{T}}(B^{-1})^{\mathsf{T}}=\rho^{*}(A)\rho^{*}(B)$、$\det(AB)=\det A\det B$ で、成分は有理式・多項式なので滑らか（\ref{lie:matrix-lie-groups.1}）。

**1.** $E$ のベクトル束の局所自明化の推移関数を $g_{\alpha\beta}$ とする。\ref{mfd:frame-bundle-principal.2} から $\mathrm{Fr}(E)$ の推移関数は $g_{\alpha\beta}$、\ref{mfd:associated-vector-bundle} から $E^{*}$ はベクトル束の局所自明化 $\Psi_{\alpha}$ をもち、推移関数は $\rho^{*}\circ g_{\alpha\beta}$。同じ二つの命題を $E^{*}$ に使うと、$\mathrm{Fr}(E^{*})$ の推移関数は $\rho^{*}\circ g_{\alpha\beta}$、$E^{**}$ の推移関数は $\rho^{*}\circ\rho^{*}\circ g_{\alpha\beta}$。ここで
$$
\bigl((A^{-1})^{\mathsf{T}}\bigr)^{-1}=\bigl((A^{-1})^{-1}\bigr)^{\mathsf{T}}=A^{\mathsf{T}},\qquad\rho^{*}(\rho^{*}(A))=\bigl(A^{\mathsf{T}}\bigr)^{\mathsf{T}}=A
$$
（逆行列と転置は可換：$(B^{\mathsf{T}})^{-1}=(B^{-1})^{\mathsf{T}}$）なので、$E^{**}$ と $E$ は同じ被覆の上で同じ推移関数 $g_{\alpha\beta}$ をもつ。\ref{mfd:cocycle-isomorphism.1}（$\lambda_{\alpha}=I$）から $\mathrm{GL}(k)$ 束として同型で、その同型は局所自明化で見ると $(m,v)\mapsto(m,v)$ なので、各ファイバーの上で線形である。

**2.** $M$ のアトラス $\{(U_{\alpha},\varphi_{\alpha})\}$ をとり、$J_{\alpha\beta}$ をヤコビ行列とする。\ref{mfd:tangent-bundle-gl.2} から $T^{*}M$ の局所自明化（$dx^{\alpha}_{i}$ に関する成分）の推移関数は $\rho^{*}(J_{\alpha\beta})$ で、\ref{mfd:frame-bundle-principal.2} から $\mathrm{Fr}(T^{*}M)$ の推移関数も $\rho^{*}(J_{\alpha\beta})$、\ref{mfd:associated-vector-bundle} から $\det(T^{*}M)$ の推移関数は
$$
\det\rho^{*}(J_{\alpha\beta})=\det\bigl((J_{\alpha\beta}^{-1})^{\mathsf{T}}\bigr)=\frac{1}{\det J_{\alpha\beta}}.
$$
一方、\ref{mfd:tangent-bundle-frame.3} の証明から $\Lambda^{n}T^{*}M$ の局所自明化（$dx^{\alpha}_{1}\wedge\cdots\wedge dx^{\alpha}_{n}$ に関する成分）の推移関数は $\Lambda^{n}\rho^{*}(J_{\alpha\beta})$ で、前問の 1 からこれも $1/\det J_{\alpha\beta}$。同じ被覆の上で推移関数が一致するので、\ref{mfd:cocycle-isomorphism.1} から $\mathrm{GL}(1)$ 束として同型。
:::

::: problem ★★★ 発展：直線束の 2 乗は自明 {#mfd:ex-vb-3}
1. 開被覆 $\{U_{\alpha}\}$ の上の $\mathrm{GL}(1)$ 値のコサイクル $c$ で、すべての値が正（$c_{\alpha\beta}>0$）のものは、自明なコサイクル $1$ とコホモロガスであることを、滑らかな 1 の分割を使って示せ。
2. 直線束 $L$ と表現 $\rho_{2}\colon\mathrm{GL}(1)\to\mathrm{GL}(1)$, $\rho_{2}(a)\defeq a^{2}$ について、$\mathrm{Fr}(L)\times_{\rho_{2}}\mathbb{R}$ は自明束 $M\times\mathbb{R}$ と $\mathrm{GL}(1)$ 束として同型であることを示せ。
:::

::: solution
**1.** 【主張：対数の加法的な分解】$\{U_{\alpha}\}$ に従属する滑らかな 1 の分割 $\{\phi_{\gamma}\}$ をとる（\ref{mfd:smooth-partition-of-unity.2}）。$c_{\alpha\gamma}>0$ なので $\log c_{\alpha\gamma}$ は $U_{\alpha}\cap U_{\gamma}$ の上の滑らかな関数で、コサイクル条件 $c_{\alpha\gamma}=c_{\alpha\beta}c_{\beta\gamma}$ から
$$
\log c_{\alpha\gamma}-\log c_{\beta\gamma}=\log c_{\alpha\beta}\qquad(U_{\alpha}\cap U_{\beta}\cap U_{\gamma}\text{ の上}).
$$
$U_{\alpha}$ の上の関数 $\mu_{\alpha}\defeq\sum_{\gamma}\phi_{\gamma}\log c_{\alpha\gamma}$ を考える。ただし第 $\gamma$ 項は $U_{\alpha}\cap U_{\gamma}$ の上では $\phi_{\gamma}\log c_{\alpha\gamma}$、$U_{\alpha}\setminus\operatorname{supp}\phi_{\gamma}$ の上では $0$ と定める。$\operatorname{supp}\phi_{\gamma}$ は $M$ の閉集合で $U_{\gamma}$ に含まれるので、この二つの開集合は $U_{\alpha}$ を覆い、重なりでは $\phi_{\gamma}=0$ なので両方の定義は一致し、各項は $U_{\alpha}$ の上で滑らかである。台の族は局所有限なので、各点の近傍で $0$ でない項は有限個で、$\mu_{\alpha}$ は滑らか（\ref{mfd:fiber-metric-existence} の証明の Step 3 と同じ議論）。$m\in U_{\alpha}\cap U_{\beta}$ では、$\phi_{\gamma}(m)\neq0$ となる $\gamma$ について $m\in U_{\gamma}$ なので上の式が使えて
$$
\mu_{\alpha}(m)-\mu_{\beta}(m)=\sum_{\gamma}\phi_{\gamma}(m)\bigl(\log c_{\alpha\gamma}(m)-\log c_{\beta\gamma}(m)\bigr)=\Bigl(\sum_{\gamma}\phi_{\gamma}(m)\Bigr)\log c_{\alpha\beta}(m)=\log c_{\alpha\beta}(m).
$$
$\lambda_{\alpha}\defeq e^{-\mu_{\alpha}}\colon U_{\alpha}\to\mathrm{GL}(1)$ は滑らかで、
$$
\lambda_{\alpha}c_{\alpha\beta}\lambda_{\beta}^{-1}=\exp\bigl(-\mu_{\alpha}+\log c_{\alpha\beta}+\mu_{\beta}\bigr)=e^{0}=1.
$$

**2.** $\rho_{2}$ は準同型（$(ab)^{2}=a^{2}b^{2}$）で滑らかなので表現である。$L$ のベクトル束の局所自明化の推移関数を $g_{\alpha\beta}$（$\mathrm{GL}(1)=\mathbb{R}\setminus\{0\}$ 値）とすると、\ref{mfd:frame-bundle-principal.2} から $\mathrm{Fr}(L)$ の推移関数も $g_{\alpha\beta}$ で、\ref{mfd:associated-vector-bundle} から $\mathrm{Fr}(L)\times_{\rho_{2}}\mathbb{R}$ の推移関数は $c_{\alpha\beta}\defeq g_{\alpha\beta}^{2}>0$。1 から $c$ は自明なコサイクルとコホモロガスなので、\ref{mfd:cocycle-isomorphism.1} から自明束と同型である。

（たとえばメビウスの帯では $g_{+-}=\pm1$ なので $c\equiv1$ で、1 を使うまでもない。）
:::

## 構造群の還元 {#mfd:sec-rd-exercises}

対応するページ：\ref{mfd:page-reduction}

::: problem ★ 基本：グラム–シュミットによる正規直交フレーム {#mfd:ex-rd-1}
$M=\mathbb{R}$ 上の自明なベクトル束 $E=\mathbb{R}\times\mathbb{R}^{2}$ に、
$$
\langle v,w\rangle_{x}\defeq v^{\mathsf{T}}G(x)\,w,\qquad G(x)\defeq\begin{pmatrix}1&x\\x&1+x^{2}\end{pmatrix}
$$
を考える。
1. これがファイバー計量であることを示せ。
2. 局所フレーム $(e_{1},e_{2})$（定数切断）にグラム–シュミットの直交化を施して正規直交フレーム $(\epsilon_{1},\epsilon_{2})$ を求めよ。
3. 正規直交フレームから作った局所自明化 $\Phi$（\ref{mfd:local-frame-trivialization}）を具体的に書き、$\langle v,w\rangle_{x}=\mathrm{pr}_{2}\Phi(x,v)\cdot\mathrm{pr}_{2}\Phi(x,w)$ を確かめよ。
:::

::: solution
**1.** $G(x)$ は対称で、
$$
v^{\mathsf{T}}G(x)v=v_{1}^{2}+2xv_{1}v_{2}+(1+x^{2})v_{2}^{2}=(v_{1}+xv_{2})^{2}+v_{2}^{2}
$$
は $v\neq0$ なら正（$v_{2}=0$ なら $v_{1}\neq0$）。よって各ファイバーの内積。局所フレーム $(e_{1},e_{2})$ のグラム行列 $G(x)$ は滑らかで、これは $M$ 全体を覆う局所フレームなので、\ref{mfd:fiber-metric} の後の注意から、ファイバー計量である。

**2.** $\langle e_{1},e_{1}\rangle=1$ なので $\epsilon_{1}=e_{1}$。$\langle e_{2},\epsilon_{1}\rangle=x$ なので $\tilde\epsilon_{2}=e_{2}-x\,e_{1}=(-x,1)^{\mathsf{T}}$。$G(x)(-x,1)^{\mathsf{T}}=(-x+x,\ -x^{2}+1+x^{2})^{\mathsf{T}}=(0,1)^{\mathsf{T}}$ なので $\langle\tilde\epsilon_{2},\tilde\epsilon_{2}\rangle=(-x)\cdot0+1\cdot1=1$、よって $\epsilon_{2}=(-x,1)^{\mathsf{T}}$。検算：$\langle\epsilon_{1},\epsilon_{2}\rangle=e_{1}^{\mathsf{T}}(0,1)^{\mathsf{T}}=0$。

**3.** \ref{mfd:local-frame-trivialization} の $\Theta(x,a)=a_{1}\epsilon_{1}+a_{2}\epsilon_{2}=(x,(a_{1}-xa_{2},\ a_{2}))$ の逆が $\Phi$ である。$v=(a_{1}-xa_{2},a_{2})$ を解いて $a_{2}=v_{2}$, $a_{1}=v_{1}+xv_{2}$、つまり
$$
\Phi(x,v)=\bigl(x,\ (v_{1}+xv_{2},\ v_{2})\bigr)=\Bigl(x,\ \begin{pmatrix}1&x\\0&1\end{pmatrix}v\Bigr).
$$
$\mathrm{pr}_{2}\Phi(x,v)\cdot\mathrm{pr}_{2}\Phi(x,w)=(v_{1}+xv_{2})(w_{1}+xw_{2})+v_{2}w_{2}=v_{1}w_{1}+x(v_{1}w_{2}+v_{2}w_{1})+(1+x^{2})v_{2}w_{2}=v^{\mathsf{T}}G(x)w$。これは \ref{mfd:reduction-orthogonal.2} の形の表示で、元の自明化 $\mathrm{id}$ とは $\lambda(x)=\begin{pmatrix}1&x\\0&1\end{pmatrix}$ で移り合う。
:::

::: problem ★★ 標準：直線束の自明性の言い換え {#mfd:ex-rd-2}
$L$ を $M$ 上の直線束とし、ベクトル束の局所自明化からなる $\mathrm{GL}(1)$ アトラスで $\mathrm{GL}(1)$ 束とみる。次の三つが同値であることを示せ。
1. $L$ は自明束 $M\times\mathbb{R}$ と $\mathrm{GL}(1)$ 束として同型。
2. $L$ の構造群は $\mathrm{GL}^{+}(1)=(0,\infty)$ に還元できる。
3. $L$ は、どこでも $0$ にならない滑らかな切断をもつ。

さらに、$n\ge1$ 次元の可微分多様体 $M$ が向き付け可能であることと、$\Lambda^{n}T^{*}M$ が自明であることが同値であることを導け。
:::

::: solution
**1 ⇒ 2.** 自明束の推移関数 $1$ は $\mathrm{GL}^{+}(1)$ に値をとるので、\ref{mfd:structure-group-reduction} の定義そのもの。

**2 ⇒ 3.** \ref{mfd:structure-group-reduction} から、$L$ のベクトル束の局所自明化 $\{(U_{\alpha},\Phi_{\alpha})\}$ とその推移関数 $g_{\alpha\beta}$、滑らかな $\lambda_{\alpha}\colon U_{\alpha}\to\mathrm{GL}(1)$ で $h_{\alpha\beta}\defeq\lambda_{\alpha}g_{\alpha\beta}\lambda_{\beta}^{-1}>0$ となるものがある。$\Phi'_{\alpha}(e)\defeq(m,\lambda_{\alpha}(m)\,\mathrm{pr}_{2}\Phi_{\alpha}(e))$（$m=\pi(e)$）とおくと、$\Phi'_{\alpha}$ もベクトル束の局所自明化で（$\lambda_{\alpha}^{-1}$ を使った逆写像も滑らか）、
$$
\Phi'_{\alpha}\circ\Phi'^{-1}_{\beta}(m,v)=\bigl(m,\ \lambda_{\alpha}g_{\alpha\beta}\lambda_{\beta}^{-1}v\bigr)=(m,h_{\alpha\beta}(m)v).
$$
$h$ はコサイクルである：$h_{\gamma\beta}h_{\beta\alpha}=\lambda_{\gamma}g_{\gamma\beta}\lambda_{\beta}^{-1}\lambda_{\beta}g_{\beta\alpha}\lambda_{\alpha}^{-1}=\lambda_{\gamma}g_{\gamma\alpha}\lambda_{\alpha}^{-1}=h_{\gamma\alpha}$。$\{U_{\alpha}\}$ に従属する滑らかな 1 の分割 $\{\phi_{\alpha}\}$（\ref{mfd:smooth-partition-of-unity.2}）をとり、
$$
\tau_{\beta}\defeq\sum_{\alpha}\phi_{\alpha}h_{\beta\alpha}\colon U_{\beta}\to\mathbb{R}
$$
とおく（各項は $U_{\beta}\setminus\operatorname{supp}\phi_{\alpha}$ で $0$ と延ばす。前節の ★★★ の問題「直線束の 2 乗は自明」の 1 と同じ議論で $\tau_{\beta}$ は滑らか）。$m\in U_{\beta}$ では、$\phi_{\alpha}(m)>0$ となる $\alpha$ が少なくとも一つあり（和が $1$）、その $\alpha$ では $m\in U_{\alpha}$, $h_{\beta\alpha}(m)>0$、他の項は $\ge0$ なので $\tau_{\beta}(m)>0$。$U_{\beta}\cap U_{\gamma}$ では
$$
h_{\gamma\beta}\tau_{\beta}=\sum_{\alpha}\phi_{\alpha}h_{\gamma\beta}h_{\beta\alpha}=\sum_{\alpha}\phi_{\alpha}h_{\gamma\alpha}=\tau_{\gamma}.
$$
$\sigma_{\beta}(m)\defeq\Phi'^{-1}_{\beta}(m,\tau_{\beta}(m))$ は $U_{\beta}$ の上の滑らかな切断で、$\Phi'_{\gamma}(\sigma_{\beta}(m))=(m,h_{\gamma\beta}\tau_{\beta})=(m,\tau_{\gamma})=\Phi'_{\gamma}(\sigma_{\gamma}(m))$ なので、重なりで一致して大域切断 $\sigma$ を定める。$\Phi'_{\beta}$ はファイバーの上で線形同型で $\tau_{\beta}\neq0$ なので、$\sigma(m)\neq0$。

**3 ⇒ 1.** $\sigma$ をどこでも $0$ にならない切断とすると、$(\sigma)$ は $M$ 全体の局所フレームである（階数 $1$ では $0$ でないベクトルが基底）。\ref{mfd:local-frame-trivialization} から $\Theta\colon M\times\mathbb{R}\to L$, $\Theta(m,v)\defeq v\,\sigma(m)$ は微分同相写像で、$\pi\circ\Theta=\mathrm{pr}_{1}$。その証明のとおり、各 $\alpha$ で $\Phi_{\alpha}\circ\Theta(m,v)=(m,B_{\alpha}(m)v)$、$B_{\alpha}(m)\defeq\mathrm{pr}_{2}\Phi_{\alpha}(\sigma(m))$ は滑らかで $\mathrm{GL}(1)$ に値をとる。これは自明束の $G$ アトラス $\{(U_{\alpha},\mathrm{id})\}$ との間の、$\lambda_{\alpha}=B_{\alpha}$ の \ref{mfd:g-bundle-isomorphism} の同型である。

**向き付け可能性.** \ref{mfd:cotangent-bundle} の後の注意から、滑らかな $n$ 形式は $\Lambda^{n}T^{*}M$ の滑らかな切断と同じもので、$\Lambda^{n}T^{*}M$ は直線束である（推移関数は前節の ★ の問題の 1 から $1/\det J_{\alpha\beta}$）。\ref{mfd:orientable-equivalents} の 1 ⇔ 3 から、$M$ が向き付け可能 $\iff$ どこでも $0$ にならない $n$ 形式がある $\iff$（3 ⇔ 1）$\Lambda^{n}T^{*}M$ が自明。
:::

::: problem ★★★ 発展：向き付けられた曲面の概複素構造 {#mfd:ex-rd-3}
$2$ 次元の可微分多様体 $M$ の**概複素構造**とは、各点の線形写像 $J_{m}\colon T_{m}M\to T_{m}M$ の族で、$J_{m}^{2}=-\mathrm{id}$ を満たし、$TM$ のどのベクトル束の局所自明化 $\Phi$ で見ても、行列 $\phi_{m}\circ J_{m}\circ\phi_{m}^{-1}$（$\phi_{m}\defeq\mathrm{pr}_{2}\circ\Phi\restriction T_{m}M$）の成分が $m$ の滑らかな関数になるものをいう。向き付け可能な $2$ 次元の可微分多様体には概複素構造があることを示せ。
:::

::: solution
$J_{0}\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ とおく。$J_{0}^{2}=-I$ である。

**Step 1（$\mathrm{SO}(2)$ の元は $J_{0}$ と可換）.** $A\in\mathrm{SO}(2)$ の列は正規直交基底をなす（$A^{\mathsf{T}}A=I$）。第 1 列を $(c,s)^{\mathsf{T}}$（$c^{2}+s^{2}=1$）とすると、第 2 列はそれに直交する単位ベクトルなので $\pm(-s,c)^{\mathsf{T}}$ で、$\det A=1$ から $+$ の方。よって $A=\begin{pmatrix}c&-s\\s&c\end{pmatrix}$ で、
$$
AJ_{0}=\begin{pmatrix}-s&-c\\c&-s\end{pmatrix}=J_{0}A.
$$

**Step 2（$\mathrm{SO}(2)$ 値の自明化）.** \ref{mfd:reduction-so} の証明のとおり、リーマン計量（\ref{mfd:fiber-metric-existence}）と正の座標近傍から作った正の正規直交フレームによって、$M$ を覆う $TM$ のベクトル束の局所自明化の族 $\{(U_{\alpha},\Phi_{\alpha})\}$ で、推移関数 $g_{\alpha\beta}$ が $\mathrm{SO}(2)$ に値をとるものがとれる。$\phi_{\alpha,m}\defeq\mathrm{pr}_{2}\circ\Phi_{\alpha}\restriction T_{m}M$ とする。

**Step 3（$J$ の定義と well-defined 性）.** $m\in U_{\alpha}$ について $J_{m}\defeq\phi_{\alpha,m}^{-1}\circ J_{0}\circ\phi_{\alpha,m}$ とおく。$m\in U_{\alpha}\cap U_{\beta}$ なら $\phi_{\alpha,m}=g_{\alpha\beta}(m)\phi_{\beta,m}$ なので、Step 1 から
$$
\phi_{\alpha,m}^{-1}J_{0}\phi_{\alpha,m}=\phi_{\beta,m}^{-1}g_{\alpha\beta}^{-1}J_{0}g_{\alpha\beta}\phi_{\beta,m}=\phi_{\beta,m}^{-1}J_{0}\phi_{\beta,m}.
$$
よって $J_{m}$ は $\alpha$ によらない。$J_{m}^{2}=\phi_{\alpha,m}^{-1}J_{0}^{2}\phi_{\alpha,m}=-\mathrm{id}$。

**Step 4（滑らかさ）.** 任意のベクトル束の局所自明化 $\Phi$ と $m_{0}\in U_{\alpha}$ をとる。\ref{mfd:vector-bundle-gl.1} を二つの局所自明化 $\Phi$, $\Phi_{\alpha}$ に使うと、$m_{0}$ の近くで $\phi_{m}=C(m)\phi_{\alpha,m}$（$C$ は滑らかな $\mathrm{GL}(2)$ 値関数）と書けるので、
$$
\phi_{m}J_{m}\phi_{m}^{-1}=C(m)\,J_{0}\,C(m)^{-1},
$$
その成分は $C$ の成分と（\ref{lie:matrix-lie-groups.1} から滑らかな）逆行列の成分の多項式で、滑らか。よって $J$ は概複素構造である。

（注意：向きを使わずに $\mathrm{O}(2)$ 値の自明化だけで同じことをすると、$\mathrm{diag}(1,-1)J_{0}=-J_{0}\,\mathrm{diag}(1,-1)$ なので、重なりで $J_{m}$ の符号が反転しうる。向きの還元が、この符号の食い違いを消している。）
:::
