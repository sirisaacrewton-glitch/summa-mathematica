# 多様体論（Manifolds）

位相多様体・可微分多様体・ファイバー束・ド・ラームの定理。位相多様体の基本性質、平面のシェーンフリースの定理、ラドーの三角形分割定理と閉曲面の分類、可微分構造・接束とベクトル場・微分形式・ストークスの定理・サードの定理・ホイットニーの埋め込み定理、主束・付随束・ベクトル束と構造群の還元、ド・ラームの定理など、多様体であるというだけで（計量などの付加構造なしに）定まる理論。

<p class="mn-msc">MSC2020: 57N, 57K20, 57Q, 57R, 58A</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-topological-manifolds/index.html"><span class="mn-card-title">位相多様体</span><span class="mn-card-en">Topological Manifolds</span><span class="mn-card-desc">位相多様体の定義と基本性質（連結なら第二可算・パラコンパクト・距離化可能が同値、コンパクト多様体の埋め込み）、平面のジョルダン曲線とシェーンフリースの定理、弧と有限平面グラフの馴らし、ラドーの三角形分割定理、多角形の貼り合わせと閉曲面の分類定理、高い次元の三角形分割に関する事実。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="02-smooth-manifolds/index.html"><span class="mn-card-title">可微分多様体</span><span class="mn-card-en">Smooth Manifolds</span><span class="mn-card-desc">座標近傍と可微分構造、滑らかな写像、導分としての接空間と写像の微分、1 の分割と部分多様体、多様体上の微分形式と外微分、向きと積分、多様体上のストークスの定理、接束とベクトル場、流れ・リー微分・カルタンの公式、サードの定理、ホイットニーの埋め込み定理、可微分構造の存在と一意性。Warner『Foundations of Differentiable Manifolds and Lie Groups』第 1・2・4 章に対応。</span><span class="mn-card-count">10 ページ</span></a>
<a class="mn-card" href="03-fiber-bundles/index.html"><span class="mn-card-title">ファイバー束</span><span class="mn-card-en">Fiber Bundles</span><span class="mn-card-desc">ファイバー束と構造群、推移関数とコサイクル条件、コサイクルからの束の構成と同型の判定、主束と付随束、付随束の切断と同変写像、ベクトル束とフレーム束、接束・余接束・形式の束をフレーム束の付随束として捉え直すこと、構造群の還元（向きと GL⁺(n)、ファイバー計量と O(k)）。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="04-de-rham/index.html"><span class="mn-card-title">ド・ラームの定理</span><span class="mn-card-en">The de Rham Theorem</span><span class="mn-card-desc">チェック–ド・ラーム二重複体と一般化されたマイヤー–ヴィートリス完全列、良い被覆によるド・ラームの定理（ド・ラーム・コホモロジーと実係数特異コホモロジーの同型）、滑らかな特異ホモロジーと特異ホモロジーの一致、積分による同型（別証明・被覆によらないこと・自然性）、球面・最高次・キュネットなどの帰結、ド・ラームの同型が外積をカップ積に写すこと（トーラスの積）。</span><span class="mn-card-count">5 ページ</span></a>
</div>
