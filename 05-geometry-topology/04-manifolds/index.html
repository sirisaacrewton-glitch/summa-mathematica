# 多様体論（Manifolds）

位相多様体と可微分多様体。位相多様体の基本性質、平面のシェーンフリースの定理、ラドーの三角形分割定理と閉曲面の分類、可微分構造・接空間・微分形式・ストークスの定理など、多様体であるというだけで（計量などの付加構造なしに）定まる理論。

<p class="mn-msc">MSC2020: 57N, 57K20, 57Q, 57R, 58A</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-topological-manifolds/index.html"><span class="mn-card-title">位相多様体</span><span class="mn-card-en">Topological Manifolds</span><span class="mn-card-desc">位相多様体の定義と基本性質（連結なら第二可算・パラコンパクト・距離化可能が同値、コンパクト多様体の埋め込み）、平面のジョルダン曲線とシェーンフリースの定理、弧と有限平面グラフの馴らし、ラドーの三角形分割定理、多角形の貼り合わせと閉曲面の分類定理、三角形分割と可微分構造に関する事実。</span><span class="mn-card-count">9 ページ</span></a>
<a class="mn-card" href="02-smooth-manifolds/index.html"><span class="mn-card-title">可微分多様体</span><span class="mn-card-en">Smooth Manifolds</span><span class="mn-card-desc">座標近傍と可微分構造、滑らかな写像、導分としての接空間と写像の微分、1 の分割と部分多様体、多様体上の微分形式と外微分、向きと積分、多様体上のストークスの定理。Warner『Foundations of Differentiable Manifolds and Lie Groups』第 1・2・4 章に対応。</span><span class="mn-card-count">7 ページ</span></a>
