# 閉曲面の分類定理 {#mfd:page-classification-surfaces keywords="classification of compact surfaces: sphere, connected sums of tori M_g, connected sums of projective planes N_h; normal form of words, crosscaps, handles, vertex classes"}

空でないコンパクトな連結位相曲面（**閉曲面**）は、球面 $S^{2}$、種数 $g\ge1$ の向き付け可能な閉曲面 $M_{g}$、種数 $h\ge1$ の向き付け不可能な閉曲面 $N_{h}$ のどれか一つとちょうど同相である（**閉曲面の分類定理**）。前のページで、閉曲面は一つの語の実現として表せることを示した。このページでは、その語を切り貼りで**標準形**
$$
aa^{-1},\qquad a_{1}b_{1}a_{1}^{-1}b_{1}^{-1}\cdots a_{g}b_{g}a_{g}^{-1}b_{g}^{-1},\qquad a_{1}a_{1}\cdots a_{h}a_{h}
$$
に書き換え、標準形どうしが同相でないことを基本群で確かめる。

## 記法と定義の確認 {#mfd:sec-cs-notation}

::: notation
- 語・貼り合わせ図式・実現 $X(W)$・頂点の類・切り貼り・折り畳みは \ref{mfd:page-polygon-schemes}。語の書き換えで実現の同相類が変わらないとき $W\simeq W'$ と書く。$W\simeq W'$ は同値関係である。
- 語の中の大文字 $A,B,C,\dots,P,Q,Y$ は、空かもしれない文字の列を表す。$A^{-1}$ は列の逆。
- $M_{g}$, $N_{h}$ は \ref{at:surfaces-distinguished} の前の例のとおり、円周のブーケに語 $\prod_{i}[a_{i},b_{i}]$（$[a,b]\defeq aba^{-1}b^{-1}$）や $a_{1}^{2}\cdots a_{h}^{2}$ を読む閉道に沿って 2 胞体を貼った空間とする。胞体の貼り付けは接着空間（\ref{top:adjunction-space}）。
- 手元の資料にこの部分を扱う本がないため、証明はここで書き下ろした。語の書き換えの手順は標準的なものだが、細部はこのサイトの補題に合わせて組み立てた。
:::

## 三つの書き換え {#mfd:sec-cs-moves}

::: lemma ねじれた対を隣り合わせる {#mfd:crosscap-move keywords="a word aPaQ is equivalent to P c c Q^{-1}" index="クロスキャップ|くろすきゃっぷ"}
語 $a\,P\,a\,Q$（文字 $a$ は $P,Q$ に現れない）について、新しい文字 $c$ で $a\,P\,a\,Q\simeq P\,c\,c\,Q^{-1}$。
:::

::: proof
\ref{mfd:cut-paste} で $U\defeq aP$, $V\defeq aQ$ に切ると、$aPc$ と $c^{-1}aQ$。後者を逆にして $Q^{-1}a^{-1}c$（\ref{mfd:scheme-relabel}）。前者を $Pc\,a$、後者を $a^{-1}\,cQ^{-1}$ と回転し、$a$ で貼り合わせる（$Pc$, $cQ^{-1}$ は空でない）と $Pc\,cQ^{-1}$。
:::

::: lemma 取っ手を作る {#mfd:handle-move keywords="a word aAbBa^{-1}Cb^{-1}D is equivalent to a commutator followed by ADCB" index="取っ手（曲面）|とってきょくめん"}
語 $a\,A\,b\,B\,a^{-1}\,C\,b^{-1}\,D$（文字 $a,b$ はほかに現れない）について、新しい文字 $d,e$ で
$$
a\,A\,b\,B\,a^{-1}\,C\,b^{-1}\,D\simeq d\,e\,d^{-1}e^{-1}\,A\,D\,C\,B.
$$
:::

::: proof
**Step 1.** 回転した語 $A\,b\,B\,a^{-1}\,C\,b^{-1}\,D\,a$ を $U\defeq AbB$ と $V\defeq a^{-1}Cb^{-1}Da$ に切ると $AbBc$ と $c^{-1}a^{-1}Cb^{-1}Da$。前者を $BcA\,b$、後者を $b^{-1}\,Dac^{-1}a^{-1}C$ と回転して $b$ で貼り合わせると、$BcADac^{-1}a^{-1}C$。

**Step 2.** これを $c^{-1}a^{-1}CBcADa$ と回転し、$U\defeq c^{-1}a^{-1}CB$ と $V\defeq cADa$ に切ると $c^{-1}a^{-1}CBe$ と $e^{-1}cADa$。後者を $e^{-1}cAD\,a$、前者を $a^{-1}\,CBec^{-1}$ と回転して $a$ で貼り合わせると、$e^{-1}cADCBec^{-1}$。

**Step 3.** 回転すると $e\,c^{-1}e^{-1}c\,ADCB$。文字 $c$ の二つの出現をともに逆向きにした $f\defeq c^{-1}$ で書けば $e\,f\,e^{-1}f^{-1}\,ADCB$（\ref{mfd:scheme-relabel}）。名前を $d\defeq e$, $e\defeq f$ に付け替えればよい。
:::

::: lemma 取っ手とクロスキャップ {#mfd:handle-crosscap keywords="a crosscap next to a handle: xxaba^{-1}b^{-1}Y is equivalent to abcY^{-1}bac, three twisted pairs" index="取っ手とクロスキャップ|とってとくろすきゃっぷ"}
語 $x\,x\,a\,b\,a^{-1}b^{-1}\,Y$ について、新しい文字 $c$ で $x\,x\,a\,b\,a^{-1}b^{-1}\,Y\simeq a\,b\,c\,Y^{-1}\,b\,a\,c$。
:::

::: proof
回転した語 $x\,a\,b\,a^{-1}b^{-1}\,Y\,x$ を $U\defeq xab$ と $V\defeq a^{-1}b^{-1}Yx$ に切ると $xabc$ と $c^{-1}a^{-1}b^{-1}Yx$。$x$ はどちらでも $+1$ なので後者を逆にして $x^{-1}Y^{-1}bac$。前者を $abc\,x$ と回転し、$x$ で貼り合わせると $abc\,Y^{-1}bac$。
:::

## 標準形 {#mfd:sec-cs-normal-form}

::: theorem 語の標準形 {#mfd:word-normal-form keywords="every word is equivalent to aa^{-1}, a product of g commutators, or a product of h squares" index="語の標準形|ごのひょうじゅんけい"}
各文字がちょうど 2 回現れる任意の語 $W$ は、次のどれかと $\simeq$ である。
$$
aa^{-1},\qquad [a_{1},b_{1}]\cdots[a_{g},b_{g}]\ (g\ge1),\qquad a_{1}a_{1}\cdots a_{h}a_{h}\ (h\ge1).
$$
後の二つは頂点の類が 1 個の語である。
:::

::: intuition
曲面を一枚の多角形に切り開いたとき、辺の名前の並び方には、向きが逆の対（ねじれていない対）と同じ向きの対（ねじれた対）がある。切り貼りを繰り返すと、ねじれた対は「$cc$」（クロスキャップ）に、ねじれていない対は交差する二組で「$aba^{-1}b^{-1}$」（取っ手）にまとまる。両方が残るときは、取っ手一つとクロスキャップ一つがクロスキャップ三つになる。
:::

::: proof
語の長さを $n$ とする。

**Step 1（消去）.** 【主張：$n\ge4$ で、隣り合う $xx^{-1}$ または $x^{-1}x$（巡回的に）があれば、それを取り除いた語と $\simeq$】回転し、必要なら $x$ の向きを取り替えて $Uxx^{-1}$（$|U|=n-2\ge2$）の形にし、\ref{mfd:fold} を使う。$n=2$ の語は $aa^{-1}$, $a^{-1}a$, $aa$, $a^{-1}a^{-1}$ で、名前の付け替えで $aa^{-1}$ か $aa$ になり、これは標準形（$aa$ は $h=1$）。

**Step 2（隣り合う逆向きの対と頂点の類）.** 【主張：隣り合う $xx^{-1}$ の間の頂点は、ほかのどの頂点とも同じ類にない】$xx^{-1}$ の間の頂点を $p$ とすると、$p$ は二つの辺のどちらでも $x$ のパラメータ $1$ の点なので、\ref{mfd:vertex-classes.1} の操作で $p$ から移れるのは $p$ 自身だけ。とくに、頂点の類が 1 個で $n\ge4$ の語には、隣り合う逆向きの対はない。

**Step 3（頂点の類を 1 個にする）.** 【主張：$W$ は、長さ 2 の語か、頂点の類が 1 個の語と $\simeq$】$n\ge4$ で類が 2 個以上あるとする。Step 1 の消去ができるならして $n$ を減らす。できないとき、最も頂点の少ない類 $P$ をとる。
- *$|P|=1$ のとき.* $P=\{v\}$ とし、$v$ で終わる辺を $\beta$、$v$ から始まる辺を $\alpha$ とする。$\beta$ の文字のもう一方の出現の辺の、$v$ に対応する端も類 $P$ の頂点なので $v$ であり、その辺は $\alpha$ か $\beta$。$\beta$ 自身ではないので $\alpha$。$\alpha$ と $\beta$ が同じ向き（$yy$）なら、$\beta$ の終点 $v$ と $\alpha$ の終点が同じ類で、$\alpha$ の終点は $v$ と異なる（$n\ge3$）ので $|P|\ge2$ に反する。よって $\beta\alpha$ は $yy^{-1}$ か $y^{-1}y$ で、消去できることになり矛盾。したがってこの場合は起こらない。
- *$|P|\ge2$ のとき.* 類が 2 個以上なので、類 $P$ の頂点 $v$ で、辺 $\alpha$ でつながる隣の頂点 $w$ が別の類 $Q$ にあるものがある。回転と反転で、$v$ で終わる辺 $\beta$、$v$ から $w$ への辺 $\alpha$ について $W=\beta\,\alpha\,X$ とする。$\beta$ と $\alpha$ は同じ文字ではない：$\beta\alpha$ が $yy^{-1}$ 型なら消去でき、$yy$ 型なら $\beta$ の終点 $v$ と $\alpha$ の終点 $w$ が同じ類になる。よって $\beta$ の文字のもう一方の出現は $X$ の中にある。$U\defeq\beta\alpha$, $V\defeq X$ で切ると、三角形 $\beta\alpha c$（頂点は $\beta$ の始点 $u$、$v$、$w$）と $c^{-1}X$（頂点は $v$ を除く元の頂点）。$\beta$ で貼り合わせると、三角形の $\beta$ の辺は $X$ の中の $\beta$ の辺と重なって内部に入り、新しい語は長さ $n$ で、その頂点は「元の頂点から $v$ を除き、三角形の頂点 $w$ を加えたもの」になる（$u$, $v$ は $\beta$ の辺の端点と重なる）。\ref{mfd:vertex-classes.2} から頂点点の集合は変わらないので、類 $P$ の頂点は 1 個減り、$Q$ の頂点は 1 個増える。

$(n,\ \text{最小の類の頂点数})$ は辞書式順序で減少するので、有限回で類が 1 個になるか、$n=2$ になる。

**Step 4（ねじれた対をすべて隣り合わせる）.** 【主張：頂点の類が 1 個の語は、頂点の類が 1 個で、ねじれた対がすべて隣り合う（$cc$ の形）語と $\simeq$】ねじれた対 $a$ で隣り合っていないものがあれば、$W=aPaQ$ と書いて \ref{mfd:crosscap-move} で $PccQ^{-1}$ に取り替える。$P$, $Q$ の中にあった隣り合うねじれた対は、$Q^{-1}$ の中でも隣り合うねじれた対のまま（$xx$ が $x^{-1}x^{-1}$ になる）で、新たに $cc$ が加わる。よって隣り合うねじれた対の数は 1 増え、語の長さは変わらないので、有限回で終わる。頂点の類の数は \ref{mfd:vertex-classes.2} から 1 のまま。

**Step 5（取っ手を作る）.** 【主張：Step 4 の形の語 $W$（$n\ge4$）は、「$cc$」と「$[d,e]$」の形の区画を巡回的に並べた語と $\simeq$】$W$ のうち、すでにある区画（はじめは $cc$ の区画だけ）に属さない文字はねじれていない。そのような文字 $a$ があれば、$W=aXa^{-1}Y$ と書く。$X$ の中にちょうど 1 回現れる文字（$a$ と**交差する**文字）がなければ、$a$ の辺の終点から $X$ を通って $a^{-1}$ の辺の始点までの頂点の集合 $S_{X}$ と、$a^{-1}$ の辺の終点から $Y$ を通って $a$ の辺の始点までの頂点の集合 $S_{Y}$ は交わらず、どの文字の同一視もそれぞれの中の頂点どうしを結ぶ（$a$ は $a$ の始点と $a^{-1}$ の辺の終点（どちらも $S_{Y}$）、$a$ の終点と $a^{-1}$ の辺の始点（どちらも $S_{X}$）を結ぶ）ので、類が 2 個以上になって矛盾。交差する文字 $b$ は、隣り合うねじれた対ではなく、$[d,e]$ の区画にも属さない（区画の文字はその区画の中に 2 回現れる）ので、ねじれていない。$b$ の向きを必要なら取り替えて $W=aAbBa^{-1}Cb^{-1}D$ とし、\ref{mfd:handle-move} で $[d,e]\,ADCB$ に取り替える。既存の区画は $a,b$ を含まないので $A,B,C,D$ のどれか一つに収まり、$ADCB$ の中でも連続した区画のまま。区画に属さない文字は 2 個減る。頂点の類は 1 個のまま。

**Step 6（取っ手とクロスキャップが両方あるとき）.** 【主張：$cc$ と $[d,e]$ の区画が両方あれば、$[d,e]$ の区画の数を 1 減らせる】巡回的に並んだ区画のうち、$cc$ の区画の直後に $[d,e]$ の区画が来る箇所があるので、$W=x\,x\,a\,b\,a^{-1}b^{-1}\,Y$ と書ける。\ref{mfd:handle-crosscap} から $W\simeq abcY^{-1}bac$。$Y^{-1}$ の中で $cc$ の区画は隣り合うねじれた対のまま、$[d,e]$ の区画は $[d,e]^{-1}=ede^{-1}d^{-1}=[e,d]$ でやはり取っ手の区画。$a,b,c$ はねじれた対になる。Step 4 の操作を行うと、区画を分断しないので（区画の文字は $P$ か $Q$ の一方に収まる）、ねじれた対がすべて隣り合い、$[d,e]$ の区画は一つ減っている。頂点の類は 1 個のまま。

**Step 7（結論）.** Step 1・3 から $n=2$（標準形）か、類が 1 個の語になる。Step 4・5 で区画の並びにし、Step 6 を繰り返して、区画がすべて $cc$ 型かすべて $[d,e]$ 型になる。巡回的な回転と名前の付け替えで $a_{1}a_{1}\cdots a_{h}a_{h}$ か $[a_{1},b_{1}]\cdots[a_{g},b_{g}]$。これらの頂点の類が 1 個であることは、Step 3 以降で類の数が 1 のまま保たれることから。
:::

## 分類定理 {#mfd:sec-cs-theorem}

::: lemma 標準形と胞体の貼り付け {#mfd:one-vertex-word-cell keywords="the realization of a word with one vertex class is a wedge of circles with a 2-cell attached along the loop reading the word" index="語の実現と 2 胞体|ごのじつげんとにほうたい"}
頂点の類が 1 個の語 $W=x_{1}^{\varepsilon_{1}}\cdots x_{n}^{\varepsilon_{n}}$ について、$W$ に現れる文字ごとの円周のブーケ $\bigvee_{x}S^{1}_{x}$（基点 $1$）と、閉道 $\varphi_{W}\colon S^{1}\to\bigvee_{x}S^{1}_{x}$、
$$
\varphi_{W}(e^{2\pi i(k-1+t)/n})\defeq\begin{cases}e^{2\pi it}\in S^{1}_{x_{k}}&(\varepsilon_{k}=1)\\ e^{2\pi i(1-t)}\in S^{1}_{x_{k}}&(\varepsilon_{k}=-1)\end{cases}\qquad(0\le t\le1)
$$
（語を読む閉道）について、$X(W)$ は接着空間 $\bigvee_{x}S^{1}_{x}\cup_{\varphi_{W}}\overline{\mathbb{D}}$ と同相。
:::

::: proof
$X(W)$ を標準模型 $\overline{\mathbb{D}}$ で作る。$\varphi_{W}$ は $k$ 番目の辺の上の $x_{k}$ のパラメータ $s$ の点を $e^{2\pi is}\in S^{1}_{x_{k}}$ に送る写像で、各辺の端点では、頂点はすべて基点 $1$ に移るので矛盾なく連続。

**Step 1（$X(W)$ から接着空間へ）.** $j\colon\overline{\mathbb{D}}\to\bigvee S^{1}_{x}\cup_{\varphi_{W}}\overline{\mathbb{D}}$ は、$x$ の二つの出現の辺の上のパラメータ $s$ の点を、どちらも $\varphi_{W}$ で $e^{2\pi is}\in S^{1}_{x}$ の像に送るので、同一視を保ち、連続写像 $F\colon X(W)\to\bigvee S^{1}_{x}\cup_{\varphi_{W}}\overline{\mathbb{D}}$ を誘導する（\ref{top:quotient-universal}）。

**Step 2（逆向き）.** $S^{1}_{x}$ の点 $e^{2\pi is}$ を「$x$ のパラメータ $s$ の点」の $X(W)$ での像に送る写像 $g$ は、$s=0,1$ でどちらも頂点点（類は 1 個なので同じ点）になり、二つの出現のどちらで定めても同じ点なので、矛盾なく定まり連続。ブーケの基点でも一致する。$h\defeq q\colon\overline{\mathbb{D}}\to X(W)$ について $h\restriction S^{1}=g\circ\varphi_{W}$ なので、\ref{top:adjunction-universal} から連続写像 $G$ が得られる。$F\circ G$ と $G\circ F$ は、それぞれ $\overline{\mathbb{D}}$ とブーケの点（ブーケの点は $\varphi_{W}$ の像なので $\overline{\mathbb{D}}$ の点の像）の上で恒等写像なので恒等写像。
:::

::: theorem 閉曲面の分類定理 {#mfd:classification-surfaces keywords="classification of closed surfaces: every compact connected surface is homeomorphic to exactly one of S^2, M_g (g >= 1), N_h (h >= 1), and all of these are compact surfaces" index="閉曲面の分類定理|へいきょくめんのぶんるいていり, 曲面の分類|きょくめんのぶんるい" refname="閉曲面の分類定理"}
空でないコンパクトな連結位相曲面 $S$ は、$S^{2}$、$M_{g}$（$g\ge1$）、$N_{h}$（$h\ge1$）のうちちょうど一つと同相である。逆に、これらはすべてコンパクトな連結位相曲面である。
:::

::: intuition
閉じた曲面は、球面に取っ手をいくつか付けたものか、球面にクロスキャップ（メビウスの帯を縫い付けた穴）をいくつか付けたもののどちらかで、取っ手やクロスキャップの数で形が完全に決まる。
:::

::: proof
**Step 1（存在）.** \ref{mfd:surface-one-word} から語 $W$ で $S\cong X(W)$ となるものがあり、\ref{mfd:word-normal-form} から $X(W)$ は標準形の実現と同相。$X(aa^{-1})\cong S^{2}$（\ref{mfd:prob-ps2-two-gons}）。$g\ge1$ の標準形は頂点の類が 1 個なので、\ref{mfd:one-vertex-word-cell} から $X([a_{1},b_{1}]\cdots[a_{g},b_{g}])$ は $M_{g}$ と同相、同様に $X(a_{1}a_{1}\cdots a_{h}a_{h})\cong N_{h}$。

**Step 2（一意性）.** 同相な空間はホモトピー同値なので、\ref{at:surfaces-distinguished} から $M_{g}$, $N_{h}$（$g,h\ge1$）はどの二つも同相でない。$S^{2}$ は単連結（\ref{at:sphere-simply-connected}）だが、$\pi_{1}(M_{g})$, $\pi_{1}(N_{h})$ のアーベル化は $\mathbb{Z}^{2g}\neq0$, $\mathbb{Z}^{h-1}\oplus\mathbb{Z}/2\mathbb{Z}\neq0$（\ref{at:surfaces-distinguished}）なので、$S^{2}$ はどれとも同相でない。

**Step 3（逆）.** \ref{mfd:realization-surface} から標準形の実現はコンパクトな連結位相曲面で、Step 1 からそれぞれ $S^{2}$, $M_{g}$, $N_{h}$ と同相。

::: hypcheck
- **コンパクト性**：ラドーの定理（有限の三角形分割）を通して、語が有限の長さになることに使った。コンパクトでない曲面には無限の種数などがあり、分類はもっと複雑になる。
- **連結性**：\ref{mfd:surface-one-word} の Step 4 で、三角形を一枚の多角形にまとめることに使った。連結でなければ、各連結成分を分類すればよい。
- **ハウスドルフ性**：ラドーの定理の中で使った。ハウスドルフでない「曲面」（原点を二重にした直線の類似）は分類の対象外である。
:::
:::

::: supplement
**高い視点：連結和の半群.** 二つの閉曲面からそれぞれ小さな円板を除き、境界の円周どうしを貼り合わせる操作を**連結和** $\#$ という。$[a,b]$ の区画は連結和の因子としてのトーラス $T^{2}$、$cc$ の区画は射影平面 $\mathbb{RP}^{2}$ にあたり、$M_{g}=T^{2}\#\cdots\#T^{2}$、$N_{h}=\mathbb{RP}^{2}\#\cdots\#\mathbb{RP}^{2}$ である（ここでは証明していない）。\ref{mfd:handle-crosscap} は $T^{2}\#\mathbb{RP}^{2}\cong\mathbb{RP}^{2}\#\mathbb{RP}^{2}\#\mathbb{RP}^{2}$ にあたる。閉曲面の同相類は、連結和を演算とし $S^{2}$ を単位元とする可換モノイドをなし、$T^{2}$ と $\mathbb{RP}^{2}$ で生成され、関係 $T^{2}\#\mathbb{RP}^{2}=3\mathbb{RP}^{2}$ だけをもつ。比喩で言えば、閉曲面は「取っ手」と「ねじれた穴」という二種類の部品の組み立てで、部品の数を数えれば形が決まる。

**オイラー標数と向き付け可能性.** 標準形の多角形は頂点の類 1 個（$aa^{-1}$ では 2 個）・辺 $n/2$ 本・面 1 枚の胞体分割を与えるので、オイラー標数は $\chi(S^{2})=2$, $\chi(M_{g})=2-2g$, $\chi(N_{h})=2-h$。閉曲面はオイラー標数と向き付け可能性（ねじれた対があるかどうか）で完全に決まる。ここでのオイラー標数の不変性は、ホモロジーによる（\ref{at:simplicial-topological-invariance}）。

**似た定理.** 境界つきのコンパクト曲面は、閉曲面から有限個の開円板を除いたものとして分類されることが知られている。3 次元の閉多様体には、これほど単純な分類はなく、幾何化定理（ペレルマン）が構造を記述する（本サイト未収録）。
:::

## 問題 {#mfd:sec-cs-problems}

::: problem {#mfd:prob-cs-klein}
クラインの壺 $X(aba^{-1}b)$ は $N_{2}$ と同相であることを、語の書き換えで示せ。
:::

::: solution
$aba^{-1}b$ では $b$ がねじれた対。回転して $b\,a^{-1}\,b\,a$ とし、\ref{mfd:crosscap-move}（$P=a^{-1}$, $Q=a$）で $a^{-1}cc\,a^{-1}$。回転して $a^{-1}a^{-1}cc$、$a$ の向きを取り替えて $aacc$。これは $h=2$ の標準形で、\ref{mfd:classification-surfaces} の Step 1 から $N_{2}$ と同相。
:::

::: problem {#mfd:prob-cs-identify}
語 $abc\,a^{-1}b^{-1}c^{-1}$ の実現はどの標準形と同相か。
:::

::: solution
切り貼りを二回と折り畳みを一回行う。
- $U\defeq ab$, $V\defeq ca^{-1}b^{-1}c^{-1}$ で切ると $abd$ と $d^{-1}ca^{-1}b^{-1}c^{-1}$。$da\,b$ と $b^{-1}\,c^{-1}d^{-1}ca^{-1}$ と回転して $b$ で貼り合わせると $da\,c^{-1}d^{-1}ca^{-1}$。
- $U\defeq dac^{-1}$, $V\defeq d^{-1}ca^{-1}$ で切ると $dac^{-1}e$ と $e^{-1}d^{-1}ca^{-1}$。$c^{-1}ed\,a$ と $a^{-1}\,e^{-1}d^{-1}c$ と回転して $a$ で貼り合わせると $c^{-1}ed\,e^{-1}d^{-1}c$。
- 回転して $ede^{-1}d^{-1}\,cc^{-1}$ とし、\ref{mfd:fold} で $ede^{-1}d^{-1}=[e,d]$。

これは $g=1$ の標準形なので、実現はトーラス $M_{1}$ と同相（\ref{mfd:classification-surfaces} の Step 1）。
:::
