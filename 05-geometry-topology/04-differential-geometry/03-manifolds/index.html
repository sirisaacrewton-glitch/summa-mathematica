# 可微分多様体（Smooth Manifolds）

座標近傍と可微分構造、滑らかな写像、導分としての接空間と写像の微分、1 の分割と部分多様体、多様体上の微分形式、向きと積分、多様体上のストークスの定理。平面のシェーンフリースの定理、弧と有限平面グラフの馴らし、曲面のラドーの三角形分割定理、閉曲面の分類定理、位相多様体の埋め込みと高次元の事実。Warner『Foundations of Differentiable Manifolds and Lie Groups』第 1・2・4 章に対応（位相多様体の部分は書き下ろし）。

<p class="mn-msc">MSC2020: 58A05, 58A10, 57R</p>

## 前提知識

- [実解析 › 多変数解析](../../../04-analysis/01-real-analysis/03-multivariable-calculus/index.html)（全体、11 ページ）：C^k 級写像・連鎖律・逆関数定理・積分記号下の微分
- [一般位相 › 位相空間](../../../05-geometry-topology/01-general-topology/01-topological-spaces/index.html)（全体、5 ページ）：開基・第二可算・部分空間
- [一般位相 › 基本性質 I](../../../05-geometry-topology/01-general-topology/04-properties/index.html)（全体、9 ページ）：ハウスドルフ空間・連結性・パラコンパクト性
- [線形代数 › ベクトル空間と線形写像](../../../02-algebra/01-linear-algebra/01-vector-spaces/index.html)（全体、4 ページ）：双対空間・双対基底
- [代数的位相幾何学 › ホモロジー論](../../../05-geometry-topology/02-algebraic-topology/02-homology/index.html)（全体、14 ページ）：ジョルダンの曲線定理・埋め込まれた円板の補集合・マイヤー–ヴィートリス完全列（位相多様体の部分）
- [複素解析 › 大域的な理論](../../../04-analysis/02-complex-analysis/03-global/index.html)（全体、7 ページ）：リーマンの写像定理（シェーンフリースの定理の証明）
