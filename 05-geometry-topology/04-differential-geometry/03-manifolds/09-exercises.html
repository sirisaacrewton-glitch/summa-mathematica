# 演習：可微分多様体 {#mfd:page-exercises-manifolds keywords="exercises, smooth manifolds, regular values, differential forms, exterior derivative, Stokes theorem, Brouwer fixed point theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#mfd:sec-exmanifolds-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$\mathbb{R}^{n}$ の座標を $x_{1},\dots,x_{n}$（$n=3$ では $x,y,z$）とも書く。
:::

## 可微分多様体と接空間 {#mfd:sec-sm-exercises}

対応するページ：\ref{mfd:page-smooth-manifolds}

::: problem ★ 基本：トーラスへの写像 {#mfd:ex-sm-1}
$S^{1}\subset\mathbb{R}^{2}$ と $T^{2}\defeq S^{1}\times S^{1}$（積多様体）について、$F\colon\mathbb{R}^{2}\to T^{2}$, $F(s,t)=\bigl((\cos s,\sin s),(\cos t,\sin t)\bigr)$ は滑らかで、各点で $dF$ が線形同型であることを示せ。
:::

::: solution
$\mathbb{R}\to S^{1}$, $s\mapsto(\cos s,\sin s)$ を $e$ とすると $F=e\times e$。$e$ は $\mathbb{R}^{2}$ への写像として滑らかで像が $S^{1}$ に入るので、$S^{1}$ への写像として滑らか（\ref{mfd:submanifold-structure.3}。$S^{1}$ は正則値定理から部分多様体）。$e'(s)=(-\sin s,\cos s)\neq0$ で $T_{e(s)}S^{1}$ は 1 次元（\ref{mfd:regular-value-theorem}）なので $de_{s}$ は同型。積写像の微分は成分ごとの微分の直和（\ref{mfd:prob-sm-product-tangent}）なので $dF$ も同型。
:::

## 1 の分割と部分多様体 {#mfd:sec-ps-exercises}

対応するページ：\ref{mfd:page-partitions-submanifolds}

::: problem ★ 基本：一葉双曲面 {#mfd:ex-ps-1}
$f(x,y,z)=x^{2}+y^{2}-z^{2}$ とする。$f^{-1}(1)$ は $\mathbb{R}^{3}$ の 2 次元の部分多様体であることを示せ。また $0$ は $f$ の正則値でないことを示せ。
:::

::: solution
$df_{p}(v)=2(xv_{1}+yv_{2}-zv_{3})$（\ref{mfd:differential-properties.4}）は $p\neq0$ なら $0$ でなく、1 次元への線形写像として全射。$f^{-1}(1)$ は原点を含まないので $1$ は正則値で、\ref{mfd:regular-value-theorem} から 2 次元の部分多様体。$0\in f^{-1}(0)$ で $df_{0}=0$ は全射でないので、$0$ は正則値でない（$f^{-1}(0)$ は原点で尖った円錐）。
:::

::: problem ★★ 標準：コンパクトな台の関数 {#mfd:ex-ps-2}
空でない可微分多様体 $M$（$\dim M\ge1$）上の滑らかな関数の空間 $C^{\infty}(M)$ は無限次元であることを示せ。
:::

::: solution
$M$ の一つの座標近傍 $(U,\varphi)$ で $\varphi(U)\supset B(0,3)$ のものをとる（\ref{mfd:manifold-topology.1}）。$k=1,2,\dots$ について $\mathbb{R}^{d}$ の点 $a_{k}\defeq(1/k,0,\dots,0)$ のまわりの、互いに交わらない小さい球に台をもつ隆起関数（\ref{mfd:bump-function} を縮小・平行移動したもの）$\beta_{k}$ をとり、$g_{k}\defeq\beta_{k}\circ\varphi$（$U$ の外では $0$）とする。台が交わらないので $g_{1},\dots,g_{N}$ は任意の $N$ で一次独立（$\sum c_{k}g_{k}=0$ を $\varphi^{-1}(a_{j})$ で評価すると $c_{j}=0$）。
:::

## 多様体上の微分形式 {#mfd:sec-fm-exercises}

対応するページ：\ref{mfd:page-forms-on-manifolds}

::: problem ★ 基本：外微分の計算 {#mfd:ex-fm-1}
$\mathbb{R}^{3}$ 上の $\omega=x\,dy\wedge dz+y\,dz\wedge dx+z\,dx\wedge dy$ について $d\omega=3\,dx\wedge dy\wedge dz$ を示せ。また $\eta=yz\,dx+zx\,dy+xy\,dz$ は閉形式であることを示し、$\eta=dg$ となる関数 $g$ を求めよ。
:::

::: solution
\ref{mfd:exterior-derivative.4} から $d\omega=dx\wedge dy\wedge dz+dy\wedge dz\wedge dx+dz\wedge dx\wedge dy$。$dy\wedge dz\wedge dx$ と $dz\wedge dx\wedge dy$ は $dx\wedge dy\wedge dz$ を巡回置換（偶置換）で並べ替えたものなので、どちらも $dx\wedge dy\wedge dz$。よって $d\omega=3\,dx\wedge dy\wedge dz$。$\eta$ について $d\eta=(z\,dy+y\,dz)\wedge dx+(z\,dx+x\,dz)\wedge dy+(y\,dx+x\,dy)\wedge dz$ で、$dy\wedge dx$ の項 $z$ と $dx\wedge dy$ の項 $z$ が打ち消し合い（同様に他の 2 組も）、$d\eta=0$。$g=xyz$ とすると $dg=yz\,dx+xz\,dy+xy\,dz=\eta$。
:::

## 向き・積分とストークスの定理 {#mfd:sec-is-exercises}

対応するページ：\ref{mfd:page-integration-stokes}

::: problem ★★ 標準：球面の面積 {#mfd:ex-is-1}
$D\subset\mathbb{R}^{3}$ を閉単位球、$\omega$ を \ref{mfd:ex-fm-1} の 2 形式とする。$D$ は境界つき領域で $\partial D=S^{2}$ であることを確かめ、ストークスの定理を使って $\int_{S^{2}}\omega=4\pi$ を示せ。また $\omega$ の $S^{2}$ への引き戻しは体積形式であることを示せ。
:::

::: solution
$|x|<1$ の点は内点、$|x|>1$ は外点。$|p|=1$ の点では、$h(x)\defeq|x|^{2}-1$ の微分が $p$ で $0$ でないので、\ref{mfd:normal-forms.2} から $p$ のまわりに座標近傍で最後の座標が $h$ になるものがあり、$D=\{h\le0\}$ なので半空間型（\ref{mfd:regular-domain}）。よって $\partial D=S^{2}$。$D$ はコンパクトなので台の条件は問題なく（$\omega$ に $D$ の近くで $1$ の隆起関数を掛けてよい）、\ref{mfd:stokes-theorem} から $\int_{S^{2}}\omega=\int_{D}3\,dx\wedge dy\wedge dz=3\cdot\frac{4\pi}{3}=4\pi$（\ref{calc:ball-volume}）。体積形式であること：$p\in S^{2}$ と $T_{p}S^{2}=p^{\perp}$ の基底 $v,w$ について $\omega_{p}(v,w)=\det(p,v,w)$（$\omega_{p}(v,w)$ は $p$ と $v\times w$ の内積）で、$p,v,w$ は一次独立なので $0$ でない。
:::

::: problem ★★★ 発展：ブラウワーの不動点定理（滑らかな場合） {#mfd:ex-is-2}
$B\subset\mathbb{R}^{n}$ を閉単位球（$n\ge2$）とする。$B$ の開近傍で定義された滑らかな写像 $r$ で、$r(B)\subset S^{n-1}$ かつ $S^{n-1}$ 上で恒等写像となるもの（**滑らかなレトラクション**）はないことを、ストークスの定理を使って示せ。（これから、滑らかな写像 $B\to B$ が不動点をもつことが従う。）
:::

::: solution
$\sigma\defeq\sum_{i}(-1)^{i-1}x_{i}\,dx_{1}\wedge\cdots\widehat{dx_{i}}\cdots\wedge dx_{n}$ とすると $d\sigma=n\,dx_{1}\wedge\cdots\wedge dx_{n}$ で、ストークスの定理から $\int_{S^{n-1}}\sigma=n\,v(B)\neq0$。$\iota\colon S^{n-1}\to\mathbb{R}^{n}$ を包含、$\sigma_{0}\defeq\iota^{*}\sigma$ を $S^{n-1}$ 上の $(n-1)$ 形式とする。$r$ があるとし、$r$ を $S^{n-1}$ への写像とみると（\ref{mfd:submanifold-structure.3}）、$r\circ\iota=\mathrm{id}$ なので $\iota^{*}(r^{*}\sigma_{0})=\sigma_{0}$。ストークスの定理から
$$
\int_{S^{n-1}}\sigma_{0}=\int_{\partial B}r^{*}\sigma_{0}=\int_{B}d(r^{*}\sigma_{0})=\int_{B}r^{*}(d\sigma_{0}).
$$
$d\sigma_{0}$ は $(n-1)$ 次元多様体上の $n$ 形式なので $0$（\ref{mfd:de-rham-properties.4} の証明）。よって左辺は $0$ で矛盾。不動点：$g\colon B\to B$ が不動点をもたなければ、$g(x)$ から $x$ へ向かう半直線と $S^{n-1}$ の交点として滑らかなレトラクションが作れることが知られている（$g$ が $B$ の開近傍で定義され滑らかな場合、交点の公式は二次方程式の解で、根号の中は正）。
:::
