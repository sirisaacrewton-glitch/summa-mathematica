# カラテオドリの定理とシェーンフリースの定理 {#mfd:page-schoenflies keywords="Jordan domain, Riemann mapping, length-area principle, crosscut, Caratheodory's theorem, boundary extension of conformal maps, Schoenflies theorem"}

前のページでは、多角形の内側が円板と同相であることを示した。このページでは、任意のジョルダン曲線 $J$ について、内側の閉包 $J\cup\operatorname{int}J$ が閉円板と同相であること（**シェーンフリースの定理**）を示す。方法は複素解析を使う：\ref{cx:riemann-mapping}で単位円板 $\mathbb{D}$ から $\operatorname{int}J$ への双正則写像 $f$ をとり、それが閉円板の同相写像に延びること（**カラテオドリの定理**）を示す。延長の連続性は、面積を使って「短い横断線」を見つける議論（長さと面積の議論）と、前のページの θ 補題による。純粋に位相的な証明も知られているが（多角形の網で内側を細かく分ける方法）、ここでは本サイトにすでにある道具がそろっている解析的な方法をとる。

## 記法と定義の確認 {#mfd:sec-sch-notation}

::: notation
- ジョルダン曲線・弧・$\operatorname{int}J$, $\operatorname{ext}J$・θ 補題・凸体の錐による延長は \ref{mfd:page-polygonal-schoenflies}。
- 複素解析：\ref{cx:riemann-mapping}と単連結性の言い換え（\ref{cx:simply-connected-equivalents}）、回転数（\ref{cx:winding-number-properties}）、\ref{cx:maximum-principle}、\ref{cx:identity-theorem}、コーシー–リーマンの方程式と $\det Df=|f'|^{2}$（\ref{cx:cauchy-riemann}）。
- 積分：\ref{calc:change-of-variables}、縦線集合上の積分（\ref{calc:normal-domain-integral}）、積分のヘルダー（コーシー–シュワルツ）の不等式（\ref{calc:holder-integral}）、$C^{1}$ 級曲線の長さ（\ref{vec:c1-curve-length}）。$v(E)$ はジョルダン可測集合の面積。
- $\mathbb{D}\defeq\{|z|<1\}$、$\overline{\mathbb{D}}$ は閉円板。$\operatorname{diam}X$ は直径。
- 手元の資料にこの部分を扱う本がないため、証明はここで書き下ろした。カラテオドリの定理を長さと面積の議論で示す方針は標準的なものである。
:::

## ジョルダン領域の準備 {#mfd:sec-sch-prep}

::: lemma ジョルダン曲線の一様な局所弧 {#mfd:jordan-uniform keywords="two nearby points of a Jordan curve are joined by a small subarc" index="ジョルダン曲線の小さい部分弧|じょるだんきょくせんのちいさいぶぶんこ"}
$J$ をジョルダン曲線とする。任意の $\eta>0$ に対し $\nu>0$ があって、$w_{1},w_{2}\in J$ が $0<|w_{1}-w_{2}|<\nu$ なら、$J$ を $w_{1},w_{2}$ で分けた二つの弧の一方は直径が $\eta$ より小さい。
:::

::: proof
同相写像 $\gamma\colon S^{1}\to J$ をとる。$\gamma$ は一様連続なので、角の長さが $\lambda$ より短い $S^{1}$ の弧の像の直径は $\eta$ より小さくなる $\lambda\in(0,\pi)$ がある。$\gamma^{-1}$ も（コンパクト集合上の連続写像なので）一様連続で、$|w_{1}-w_{2}|<\nu$ なら $|\gamma^{-1}(w_{1})-\gamma^{-1}(w_{2})|<2\sin(\lambda/2)$ となる $\nu$ がある。このとき $\gamma^{-1}(w_{1}),\gamma^{-1}(w_{2})$ を結ぶ短い方の弧の角の長さは $\lambda$ 未満で、その像が求める弧。
:::

::: lemma 有界な開集合の直径 {#mfd:diameter-boundary keywords="the diameter of a bounded open set equals the diameter of its boundary" index="開集合と境界の直径|かいしゅうごうときょうかいのちょっけい"}
$V\subset\mathbb{R}^{2}$ が有界な空でない開集合なら $\operatorname{diam}V\le\operatorname{diam}\partial V$。
:::

::: proof
$x,y\in V$ とする。$y$ から $x$ の向きの半直線 $\{x+t(x-y):t\ge0\}$ を進むと、$V$ は有界なので $V$ から出る最初の点 $x'\in\partial V$ がある。同様に逆向きの $y'\in\partial V$ をとると、$x,y$ は線分 $[y',x']$ の上にあり $|x-y|\le|x'-y'|\le\operatorname{diam}\partial V$。
:::

::: lemma ジョルダン領域の単連結性 {#mfd:jordan-domain-simply-connected keywords="the interior of a Jordan curve satisfies the hypothesis of the Riemann mapping theorem" index="ジョルダン領域の単連結性|じょるだんりょういきのたんれんけつせい"}
ジョルダン曲線 $J\subset\C$ の内側 $U\defeq\operatorname{int}J$ について、双正則写像 $f\colon\mathbb{D}\to U$ がある。$f'$ はどの点でも $0$ でない。
:::

::: proof
$U$ は領域で $U\neq\C$。$U$ 内の閉曲線 $\gamma$ と $a\notin U$ について、$\C\setminus U=J\cup\operatorname{ext}J$ は連結（連結集合 $\operatorname{ext}J$ とその閉包の点の和）で非有界、$\gamma^{*}$ と交わらないので、$\C\setminus\gamma^{*}$ の非有界な成分に含まれ、\ref{cx:winding-number-properties.3} から $n(\gamma,a)=0$。\ref{cx:simply-connected-equivalents} の 2 ⇒ 6 と\ref{cx:riemann-mapping}から、双正則写像 $g\colon U\to\mathbb{D}$ があり、$f\defeq g^{-1}$。$g\circ f=\mathrm{id}$ を微分すると $g'(f(z))f'(z)=1$ なので $f'(z)\neq0$。
:::

## 長さと面積 {#mfd:sec-sch-length-area}

$\zeta\in\partial\mathbb{D}$ と $0<r<2$ について、円 $|z-\zeta|=r$ の $\mathbb{D}$ に入る部分を $C_{r}$ と書く。$z=\zeta-re^{i\psi}\zeta$（$\psi$ は $-\zeta$ の方向から測った角）とおくと $|z|^{2}=1-2r\cos\psi+r^{2}$ なので、$C_{r}$ は $|\psi|<\arccos(r/2)$（$<\pi/2$）の開いた円弧で、その両端は $\partial\mathbb{D}$ 上にある。

::: lemma 長さと面積の議論 {#mfd:length-area keywords="length-area lemma: for a bounded conformal map of the disk, some circle arc |z - zeta| = r with delta^2 < r < delta has image of length at most sqrt(pi A / log(1/delta))" index="長さと面積の議論|ながさとめんせきのぎろん"}
$f\colon\mathbb{D}\to\C$ を単射な正則関数で、像が面積 $A$ の正方形に含まれるものとし、$\ell(r)\in[0,\infty]$ を曲線 $f(C_{r})$ の長さとする。$0<\delta<1$ と $L>0$ について $L^{2}\log(1/\delta)>\pi A$ なら、$\ell(r)\le L$ となる $r\in[\delta^{2},\delta]$ がある。
:::

::: proof
$\psi$ で $C_{r}$ を径数づけると、$\ell(r)=\int_{|\psi|<\arccos(r/2)}|f'(z(\psi))|\,r\,d\psi$（\ref{vec:c1-curve-length}、端では広義積分）。$0<s<1$ について、$|z(\psi)|\le s$ の部分 $|\psi|\le a_{s}(r)$（$\cos a_{s}(r)=\min\{1,(1+r^{2}-s^{2})/2r\}$）に制限した積分を $\ell_{s}(r)$ とすると、$\ell_{s}(r)$ は $s$ について単調に増加して $\ell(r)$ に近づき、$r$ について連続（積分の端点と被積分関数が連続）。

**Step 1（面積の評価）.** 【主張：$\int_{\delta^{2}}^{\delta}\ell_{s}(r)^{2}\,\frac{dr}{r}\le\pi A$】\ref{calc:holder-integral}（$p=q=2$）と $2a_{s}(r)<\pi$ から $\ell_{s}(r)^{2}\le\pi r\int_{|\psi|\le a_{s}(r)}|f'|^{2}r\,d\psi$。両辺を $r$ で割って $r$ について積分すると、右辺は極座標 $z=\zeta-re^{i\psi}\zeta$ で書いた $\pi\int_{R_{s}}|f'|^{2}$（$R_{s}\defeq\{z:\delta^{2}\le|z-\zeta|\le\delta,|z|\le s\}$ は縦線集合で、\ref{calc:normal-domain-integral}・\ref{calc:change-of-variables}）。\ref{cx:cauchy-riemann} から $|f'|^{2}=\det Df$ なので、変数変換公式から $\int_{R_{s}}|f'|^{2}=v(f(R_{s}))\le A$（$f$ は単射で $f'\neq0$）。

**Step 2（短い円弧）.** 【主張：$\ell(r)\le L$ となる $r$ がある】すべての $r\in[\delta^{2},\delta]$ で $\ell(r)>L$ とする。各 $r$ について $\ell_{s}(r)>L$ となる $s<1$ があり、$\ell_{s}$ は $r$ について連続なので、$r$ のある開近傍で $\ell_{s}>L$。$[\delta^{2},\delta]$ のコンパクト性から有限個の $s$ で覆え、その最大の $s$ について（$\ell_{s}$ は $s$ について単調）すべての $r$ で $\ell_{s}(r)>L$。すると Step 1 から $\pi A\ge L^{2}\int_{\delta^{2}}^{\delta}dr/r=L^{2}\log(1/\delta)$ で、仮定に反する。
:::

## カラテオドリの定理 {#mfd:sec-sch-caratheodory}

::: theorem カラテオドリの定理 {#mfd:caratheodory keywords="Caratheodory's theorem: a conformal map of the disk onto the interior of a Jordan curve extends to a homeomorphism of the closed disk onto the closed Jordan domain" index="カラテオドリの定理|からておどりのていり, 境界対応|きょうかいたいおう" refname="カラテオドリの定理"}
$J$ をジョルダン曲線、$f\colon\mathbb{D}\to\operatorname{int}J$ を双正則写像とする。$f$ は同相写像 $F\colon\overline{\mathbb{D}}\to J\cup\operatorname{int}J$ に延び、$F(\partial\mathbb{D})=J$。
:::

::: intuition
円板を、ふちが自分と交わらない輪で囲まれた領域に等角に写すと、その写像はふちまで込めて一対一で連続に延び、円周を輪にぴったり重ねる。
:::

::: proof
$U\defeq\operatorname{int}J$。$U$ は有界なので、ある正方形（面積 $A$）に含まれる。

**Step 1（境界へ逃げる）.** 【主張：$|z_{n}|\to1$ なら $f(z_{n})$ の集積点はすべて $J$ 上にある】$f^{-1}$ は連続なので、$U$ のコンパクト集合 $K$ の逆像 $f^{-1}(K)$ はコンパクトで $\mathbb{D}$ に含まれ、$|z|$ は $1$ より小さい値で抑えられる。よって $f(z_{n})$ は $U$ のどのコンパクト集合にも最終的には入らず、集積点は $\overline{U}\setminus U=J$ にある。

**Step 2（境界の近くで振動が小さい）.** 【主張：$\zeta\in\partial\mathbb{D}$ と、$0<\varepsilon<\operatorname{dist}(f(0),J)$ について、$r>0$ があって $\operatorname{diam}f(\mathbb{D}\cap B(\zeta,r))<\varepsilon$】\ref{mfd:jordan-uniform} の $\nu$ を $\eta=\varepsilon/3$ でとり、$L<\min\{\nu,\varepsilon/3\}$、$\delta<1/2$ を $L^{2}\log(1/\delta)>\pi A$ となるようにとる。\ref{mfd:length-area} から $\ell(r)\le L$ となる $r\in[\delta^{2},\delta]$ がある。長さが有限なので、$f(C_{r})$ は両端で極限 $w_{1},w_{2}$ をもち（コーシーの判定法：曲線上の二点の距離は間の長さ以下）、Step 1 から $w_{1},w_{2}\in J$、$|w_{1}-w_{2}|\le L<\nu$。$\mathbb{D}\setminus C_{r}$ は二つの連結集合 $\Omega_{1}\defeq\mathbb{D}\cap B(\zeta,r)$ と $\Omega_{2}\defeq\mathbb{D}\setminus\overline{B(\zeta,r)}$ に分かれる（$\zeta$ からの極座標で、どちらも連続関数の間の縦線集合の像）。$f$ は同相写像なので、$U\setminus f(C_{r})$ はちょうど二つの連結成分 $f(\Omega_{1})$, $f(\Omega_{2})$ をもち、$f(0)\in f(\Omega_{2})$。

- $w_{1}\neq w_{2}$ のとき：$P\defeq f(C_{r})\cup\{w_{1},w_{2}\}$ は弧（閉区間からの連続単射の像）で $P^{\circ}\subset U$。$J$ を $w_{1},w_{2}$ で分けた弧のうち直径が $\varepsilon/3$ 未満のもの $\sigma$ と $C\defeq\sigma\cup P$ について、θ 補題（\ref{mfd:theta-lemma.2}）から $\operatorname{int}C$ は $U\setminus P$ の成分。$\operatorname{diam}C\le\operatorname{diam}\sigma+\operatorname{diam}P<\varepsilon/3+L<\varepsilon$（共通点 $w_{1}$ をもつ二つの集合）で、\ref{mfd:diameter-boundary} から $\operatorname{diam}(\operatorname{int}C)<\varepsilon$。$\operatorname{int}C$ の点は $C$（$J$ と交わる）から $\varepsilon$ 未満の距離にあるので $f(0)\notin\operatorname{int}C$。よって $\operatorname{int}C=f(\Omega_{1})$。
- $w_{1}=w_{2}\eqqcolon w$ のとき：$\Gamma\defeq f(C_{r})\cup\{w\}$ はジョルダン曲線。$\operatorname{ext}J\cup(J\setminus\{w\})$ は連結で非有界、$\Gamma$ と交わらないので $\operatorname{ext}\Gamma$ に含まれ、$\operatorname{int}\Gamma\subset U\setminus f(C_{r})$。$\operatorname{int}\Gamma$ は $U\setminus f(C_{r})$ の中で開かつ閉で連結なので成分の一つで、直径は $\operatorname{diam}\Gamma\le L<\varepsilon$。上と同じく $f(0)\notin\operatorname{int}\Gamma$ なので $\operatorname{int}\Gamma=f(\Omega_{1})$。

いずれの場合も $\operatorname{diam}f(\Omega_{1})<\varepsilon$。

**Step 3（連続な延長）.** 【主張：$F(\zeta)\defeq\lim_{z\to\zeta,z\in\mathbb{D}}f(z)$ が存在し、$F$（$\mathbb{D}$ 上は $f$）は $\overline{\mathbb{D}}$ 上で連続で、$F(\partial\mathbb{D})\subset J$】Step 2 からコーシーの判定法で極限が存在し、Step 1 から $J$ に入る。連続性：$\zeta$ と $\varepsilon$ について Step 2 の $r$ をとると、$\overline{\mathbb{D}}\cap B(\zeta,r)$ の点 $\zeta'$ での値は $f(\Omega_{1})$ の点の極限なので、$|F(\zeta')-F(\zeta)|\le\varepsilon$。

**Step 4（境界で単射）.** 【主張：$\zeta_{1}\neq\zeta_{2}\in\partial\mathbb{D}$ なら $F(\zeta_{1})\neq F(\zeta_{2})$】$F(\zeta_{1})=F(\zeta_{2})\eqqcolon w$ とする。半径 $\rho_{i}\defeq[0,\zeta_{i}]$ について $\Gamma'\defeq F(\rho_{1}\cup\rho_{2})$ はジョルダン曲線（$\rho_{1}\cup\rho_{2}$ の端点を同一視した円周からの連続単射の像）。Step 2 の後半と同じく $\operatorname{int}\Gamma'\subset U\setminus f(\rho_{1}\cup\rho_{2})$。$\mathbb{D}\setminus(\rho_{1}\cup\rho_{2})$ は二つの扇形 $S_{a},S_{b}$ に分かれ、$f(S_{a})$, $f(S_{b})$ は $U\setminus f(\rho_{1}\cup\rho_{2})$ を覆う連結集合なので、空でない開集合 $\operatorname{int}\Gamma'$ と交わる方（$S_{a}$ とする）は $\operatorname{int}\Gamma'$ に含まれる。$S_{a}$ の閉包に含まれる円周の弧 $\alpha$ の点 $\zeta$ について、$F(\zeta)\in\overline{\operatorname{int}\Gamma'}\cap J\subset(\operatorname{int}\Gamma'\cup\Gamma')\cap J=\{w\}$。よって $g\defeq F-w$ は $\alpha$ の上で $0$。$\alpha$ の角の長さを $\theta_{0}>0$ とし、$2\pi/n<\theta_{0}$ となる $n$ をとると、$h(z)\defeq\prod_{k=0}^{n-1}g(e^{2\pi ik/n}z)$ は $\overline{\mathbb{D}}$ で連続、$\mathbb{D}$ で正則で、円周のどの点も回転で $\alpha$ に入るので $\partial\mathbb{D}$ 上で $0$。\ref{cx:maximum-principle.2}から $h\equiv0$。$\mathbb{D}$ は有限個の閉集合 $Z_{k}\defeq\{z:g(e^{2\pi ik/n}z)=0\}$ の和なので、ある $Z_{k}$ は内点をもち（どれも内点をもたなければ、閉集合で内点をもたない集合の有限和も内点をもたない）、\ref{cx:identity-theorem}から $g\equiv0$、すなわち $f$ は定数で、単射性に反する。

**Step 5（同相）.** 【主張：$F$ は $\overline{\mathbb{D}}$ から $J\cup U$ への同相写像で $F(\partial\mathbb{D})=J$】$F$ は $\mathbb{D}$ 上で単射で像は $U$、$\partial\mathbb{D}$ 上で単射で像は $J$ に含まれる（Step 3・4）ので単射。$F(\overline{\mathbb{D}})$ はコンパクトで $U$ を含むので $\overline{U}=U\cup J$ を含み、$F(\partial\mathbb{D})=J$。\ref{top:compact-to-hausdorff} から同相写像。

::: hypcheck
- **$J$ がジョルダン曲線（自分と交わらない）**：Step 2 で、近い 2 点を小さい弧で結ぶこと（\ref{mfd:jordan-uniform}）と θ 補題に使い、Step 4 で $J\setminus\{w\}$ が連結であることに使った。境界が自分と交わる領域（たとえば円板から半径を一本除いたもの）では、写像は閉円板に連続に延びるが単射でない。
- **単射性（双正則）**：Step 1 で $f^{-1}$ の連続性、長さと面積の議論で面積の評価、Step 4 の結論に使った。
- **$U$ が有界**：長さと面積の議論で面積が有限であることに使った（非有界なジョルダン領域は、リーマン球面の上で考えれば同じ議論になる）。
:::
:::

## シェーンフリースの定理 {#mfd:sec-sch-schoenflies}

::: theorem シェーンフリースの定理 {#mfd:schoenflies keywords="Schoenflies theorem: the closed interior of a Jordan curve is homeomorphic to the closed disk; every homeomorphism of the curve onto the boundary of a convex body extends" index="シェーンフリースの定理|しぇーんふりーすのていり, ジョルダン–シェーンフリースの定理|じょるだんしぇーんふりーすのていり" refname="シェーンフリースの定理"}
$J\subset\mathbb{R}^{2}$ をジョルダン曲線、$K$ を凸体とする。任意の同相写像 $\phi\colon J\to\partial K$ は、同相写像 $\Phi\colon J\cup\operatorname{int}J\to K$ に延びる。とくに $J\cup\operatorname{int}J$ は閉円板と同相で、$J$ は境界の円に、$\operatorname{int}J$ は開円板に対応する。
:::

::: intuition
自分と交わらない輪の内側は、どんなに入り組んでいても、輪も込めて円板と同じ形をしている。しかも輪の上の対応は勝手に決めてよい。
:::

::: proof
\ref{mfd:jordan-domain-simply-connected} と \ref{mfd:caratheodory} から、同相写像 $F\colon\overline{\mathbb{D}}\to J\cup\operatorname{int}J$ で $F(\partial\mathbb{D})=J$ のものがある。$\psi\defeq\phi\circ F\restriction\partial\mathbb{D}\colon\partial\mathbb{D}\to\partial K$ は同相写像で、\ref{mfd:convex-body.3} から同相写像 $\Psi\colon\overline{\mathbb{D}}\to K$ に延びる。$\Phi\defeq\Psi\circ F^{-1}$ は求める延長。 同相写像は補集合を補集合に移すので $\Phi(\operatorname{int}J)=K\setminus\partial K=K^{\circ}$。
:::

::: supplement
**位相的な証明.** シェーンフリースの定理には、複素解析を使わない証明も知られている（内側の点から境界の各点へ弧で到達できること、内側が境界の近くで一様に局所連結であることを示し、多角形の網で内側を細かく分けて、前のページの多角形の場合から極限をとる）。本ページの証明は、リーマンの写像定理という強い道具を使う代わりに短く済んでいる。

**前提を変えると.** 3 次元では対応する主張が成り立たない（\see{at:jordan-brouwer} の hypcheck のアレクサンダーの角付き球面）。2 次元でも、境界がジョルダン曲線でない単連結領域では、リーマン写像は閉円板に同相には延びない（境界が局所連結なら連続に延びることが知られている）。
:::

## 問題 {#mfd:sec-sch-problems}

::: problem {#mfd:prob-sch-two-curves}
平面のジョルダン曲線 $J_{1},J_{2}$ について、$J_{1}\cup\operatorname{int}J_{1}$ から $J_{2}\cup\operatorname{int}J_{2}$ への同相写像で、与えられた同相写像 $g\colon J_{1}\to J_{2}$ の延長になっているものがあることを示せ。
:::

::: solution
\ref{mfd:schoenflies} を $K=\overline{\mathbb{D}}$ に使い、同相写像 $\phi_{1}\colon J_{1}\to S^{1}$ を一つとって延長 $\Phi_{1}$ を作る。$\phi_{2}\defeq\phi_{1}\circ g^{-1}\colon J_{2}\to S^{1}$ の延長を $\Phi_{2}$ とすると、$\Phi_{2}^{-1}\circ\Phi_{1}$ は $J_{1}$ の上で $\phi_{2}^{-1}\circ\phi_{1}=g$ に一致する同相写像。
:::
