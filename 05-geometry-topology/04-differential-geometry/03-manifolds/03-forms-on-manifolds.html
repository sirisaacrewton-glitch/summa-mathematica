# 多様体上の微分形式 {#mfd:page-forms-on-manifolds keywords="alternating forms on a vector space, exterior algebra, differential forms on a manifold, local representative, pullback, exterior derivative, existence and uniqueness of d, closed and exact forms, de Rham cohomology, Poincare lemma on manifolds, angle form"}

多変数の微分積分では、$\mathbb{R}^{n}$ の開集合の上で微分形式・外積・外微分・引き戻しを座標を使って定義した（\ref{calc:page-differential-forms}）。このページでは、それを可微分多様体の上に移す。要点は二つある。一つは、各点の接空間（座標の決まっていないベクトル空間）の上で外積を定義すること。もう一つは、座標近傍ごとに $\mathbb{R}^{n}$ の微分形式として定義した外微分が座標近傍の選び方によらないことで、これは「外微分は引き戻しと可換」（\ref{calc:pullback-properties.4}）から従う。外微分は、いくつかの性質だけで一意に特徴づけられることも示す。最後に、閉形式を完全形式で割った**ド・ラームコホモロジー**を定義する。

## 記法と定義の確認 {#mfd:sec-fm-notation}

::: notation
- 可微分多様体・座標近傍 $(U;x_{1},\dots,x_{n})$・接空間 $T_{m}M$・写像の微分 $dF_{m}$・余接空間と関数の微分 $df$ は \ref{mfd:page-smooth-manifolds} のとおり。$(dx_{1})_{m},\dots,(dx_{n})_{m}$ は座標ベクトルの双対基底（\ref{mfd:df-in-coordinates}）。
- $\mathbb{R}^{n}$ の開集合上の微分形式・外積・外微分・引き戻しは \ref{calc:page-differential-forms} のとおり。ただし本ページでは $\mathbb{R}^{n}$ の座標を $r_{1},\dots,r_{n}$ と書き、そこでの基本形式を $dr_{I}$ と書く（$x_{i}$ は多様体の座標関数に使うため）。$\mathcal{I}_{k}$ は長さ $k$ の狭義増加な添字の列の全体。
- $\mathbb{R}^{n}$ の上の**定数係数**の $k$ 形式は、$(\mathbb{R}^{n})^{k}$ 上の交代 $k$ 重線形形式と同じもの（\ref{calc:dx-properties.4}）である。
- 多様体の間の滑らかな写像は単に写像と書くことがある。
- 本ページは Warner『Foundations of Differentiable Manifolds and Lie Groups』2.14〜2.23 を参考にした。外積代数を抽象的に構成する代わりに、本サイトの $\mathbb{R}^{n}$ 上の外積を線形同型で運ぶ形にした。
:::

## ベクトル空間上の交代形式 {#mfd:sec-fm-alternating}

::: definition 交代形式の空間 {#mfd:alternating-space keywords="space of alternating k-linear forms on a vector space, pullback by a linear map" index="交代形式の空間|こうたいけいしきのくうかん, 線形写像による引き戻し（交代形式）|せんけいしゃぞうによるひきもどしこうたいけいしき"}
$V$ を $n$ 次元の実ベクトル空間、$k\ge0$ とする。$V^{k}$ 上の交代 $k$ 重線形形式の全体を $\Lambda^{k}V^{*}$ と書く（$\Lambda^{0}V^{*}=\mathbb{R}$、$\Lambda^{1}V^{*}=V^{*}$）。線形写像 $L\colon V'\to V$ と $\alpha\in\Lambda^{k}V^{*}$ について、$L^{*}\alpha\in\Lambda^{k}V'^{*}$ を $(L^{*}\alpha)(v_{1},\dots,v_{k})\defeq\alpha(Lv_{1},\dots,Lv_{k})$ で定める（$k=0$ では $L^{*}c=c$）。
:::

$V=\mathbb{R}^{n}$ のとき、線形写像 $T\colon\mathbb{R}^{n}\to\mathbb{R}^{n}$ による定数係数の形式の引き戻し（\ref{calc:pullback}）は、各点の式（\ref{calc:pullback-properties.1}）と $DT(p)=T$ から、ここでの $T^{*}$ と一致する。

::: proposition 抽象的なベクトル空間の外積 {#mfd:abstract-wedge keywords="wedge product on alternating forms of an abstract vector space, transported from R^n; independence of the basis; naturality; basis theta_I" index="外積（ベクトル空間の交代形式）|がいせきべくとるくうかんのこうたいけいしき"}
$\alpha\in\Lambda^{k}V^{*}$, $\beta\in\Lambda^{l}V^{*}$ について、線形同型 $L\colon V\to\mathbb{R}^{n}$ を一つとり
$$
\alpha\wedge\beta\defeq L^{*}\bigl((L^{-1})^{*}\alpha\wedge(L^{-1})^{*}\beta\bigr)
$$
（右辺の内側の $\wedge$ は $\mathbb{R}^{n}$ の定数係数の形式の外積）と定める。
1. $\alpha\wedge\beta$ は $L$ の選び方によらない。
2. $\wedge$ は双線形で結合的、$\alpha\wedge\beta=(-1)^{kl}\beta\wedge\alpha$。$\theta_{1},\dots,\theta_{k}\in V^{*}$ について $(\theta_{1}\wedge\cdots\wedge\theta_{k})(v_{1},\dots,v_{k})=\det(\theta_{a}(v_{b}))_{a,b}$。
3. $(\theta_{1},\dots,\theta_{n})$ が $V^{*}$ の基底なら、$\theta_{I}\defeq\theta_{i_{1}}\wedge\cdots\wedge\theta_{i_{k}}$（$I\in\mathcal{I}_{k}$）は $\Lambda^{k}V^{*}$ の基底で、$(b_{j})$ をその双対基底とすると $\theta_{I}(b_{j_{1}},\dots,b_{j_{k}})=\delta_{IJ}$（$J\in\mathcal{I}_{k}$）。$k>n$ なら $\Lambda^{k}V^{*}=0$。
4. 任意の線形写像 $L\colon V'\to V$ について $L^{*}(\alpha\wedge\beta)=L^{*}\alpha\wedge L^{*}\beta$。
:::

::: proof
**Step 1（1）.** 【主張：別の線形同型 $L'$ でも同じ値になる】$T\defeq L'\circ L^{-1}$ は $\mathbb{R}^{n}$ の線形同型で、$(L'^{-1})^{*}=(T^{-1})^{*}(L^{-1})^{*}$（引き戻しは合成の順を逆にする：$(AB)^{*}=B^{*}A^{*}$ は定義から）。$\mathbb{R}^{n}$ の外積は線形写像 $T^{-1}$ の引き戻しと可換なので（\ref{calc:pullback-properties.2} と上の注意）
$$
L'^{*}\bigl((T^{-1})^{*}a\wedge(T^{-1})^{*}b\bigr)=L'^{*}(T^{-1})^{*}(a\wedge b)=L^{*}(a\wedge b),
$$
ここで $a=(L^{-1})^{*}\alpha$, $b=(L^{-1})^{*}\beta$、最後は $T^{-1}L'=L$ から。

**2・3.** $L^{*}$ と $(L^{-1})^{*}$ は互いに逆の線形同型で、外積をそれぞれの側の外積に移す（定義と 1）。よって \ref{calc:wedge-properties} の性質（双線形・結合的・符号の交換則・1 形式の外積の行列式の式）がそのまま移る。3：$L$ として $b_{j}\mapsto e_{j}$ をとると $(L^{-1})^{*}\theta_{i}=dr_{i}$、$(L^{-1})^{*}\theta_{I}=dr_{I}$ で、\ref{calc:dx-properties.3}・\ref{calc:dx-properties.4} から主張が従う。

**Step 2（4）.** 【主張：$L^{*}$ は外積と可換】両辺は $\alpha$, $\beta$ について双線形なので、3 の基底 $\alpha=\theta_{I}$, $\beta=\theta_{J}$ で確かめればよい。2 の行列式の式から、$v_{1},\dots,v_{k+l}\in V'$ について
$$
L^{*}(\theta_{I}\wedge\theta_{J})(v)=\det\bigl(\theta_{c_{a}}(Lv_{b})\bigr)=\det\bigl((L^{*}\theta_{c_{a}})(v_{b})\bigr)
$$
（$(c_{1},\dots,c_{k+l})$ は $I$ と $J$ をつなげた列）で、右辺は $(L^{*}\theta_{i_{1}}\wedge\cdots\wedge L^{*}\theta_{j_{l}})(v)=(L^{*}\theta_{I}\wedge L^{*}\theta_{J})(v)$（$V'$ での 2 の式と結合性）。
:::

## 多様体上の微分形式 {#mfd:sec-fm-forms}

::: definition 多様体上の微分形式 {#mfd:differential-form keywords="differential k-form on a manifold: smooth assignment of alternating forms on tangent spaces; Omega^k(M); wedge product of forms" index="微分形式（多様体上）|びぶんけいしきたようたいじょう, k 形式（多様体）|けーけいしきたようたい, Ωk(M)|おめがけーえむ"}
$M$ を $n$ 次元の可微分多様体、$W\subset M$ を開集合とする。各点 $m\in W$ に $\omega_{m}\in\Lambda^{k}T_{m}^{*}M$ を対応させるもの $\omega$ を、$W$ 上の **$k$ 形式**という。座標近傍 $(U;x_{1},\dots,x_{n})$ の上では、\ref{mfd:abstract-wedge.3} により関数 $f_{I}\colon U\cap W\to\mathbb{R}$ がただ一通りに定まって
$$
\omega=\sum_{I\in\mathcal{I}_{k}}f_{I}\,dx_{I},\qquad dx_{I}\defeq dx_{i_{1}}\wedge\cdots\wedge dx_{i_{k}}
$$
（各点で）と書ける。すべての座標近傍で係数 $f_{I}$ が滑らかなとき、$\omega$ は滑らかであるという。$W$ 上の滑らかな $k$ 形式の全体を $\Omega^{k}(W)$ と書く（$\Omega^{0}(W)=C^{\infty}(W)$）。外積 $\omega\wedge\eta$ と、関数との積 $f\omega$ は各点で定める。
:::

::: intuition
多様体上の微分形式とは、各点の接ベクトルをいくつか入れると数を返す交代的な多重線形の規則を、点ごとに滑らかに並べたものである。
:::

座標近傍ごとの係数を $\mathbb{R}^{n}$ の形式として読むと、多変数の微分積分の結果がそのまま使える。

::: definition 局所表示 {#mfd:local-representative keywords="local representative of a form in a chart, omega^phi = (phi^{-1})^* omega" index="微分形式の局所表示|びぶんけいしきのきょくしょひょうじ"}
座標近傍 $(U,\varphi)$ の上で $\omega=\sum_{I}f_{I}dx_{I}$ のとき、$\mathbb{R}^{n}$ の開集合 $\varphi(U\cap W)$ 上の形式
$$
\omega^{\varphi}\defeq\sum_{I}(f_{I}\circ\varphi^{-1})\,dr_{I}
$$
を $\omega$ の $\varphi$ に関する**局所表示**という。$\omega$ は $(U\cap W)$ の上では $\omega^{\varphi}$ で決まる。
:::

::: lemma 局所表示の変換則 {#mfd:local-representative-change keywords="local representatives transform by pullback: omega^phi = tau^* omega^psi; pullback by a smooth map in local coordinates" index="局所表示の変換則|きょくしょひょうじのへんかんそく"}
1. $a=\varphi(m)$ と $w_{1},\dots,w_{k}\in\mathbb{R}^{n}$ について $\omega^{\varphi}_{a}(w_{1},\dots,w_{k})=\omega_{m}\bigl(d(\varphi^{-1})_{a}w_{1},\dots,d(\varphi^{-1})_{a}w_{k}\bigr)$（$T_{a}\mathbb{R}^{n}=\mathbb{R}^{n}$ と同一視、\ref{mfd:differential-properties.4}）。
2. 二つの座標近傍 $(U,\varphi)$, $(V,\psi)$ の座標変換を $\tau\defeq\psi\circ\varphi^{-1}$ とすると、$\varphi(U\cap V\cap W)$ 上で $\omega^{\varphi}=\tau^{*}(\omega^{\psi})$（\ref{calc:pullback} の引き戻し）。
3. したがって、$\omega$ が滑らかであることは、$M$ の各点のまわりのある座標近傍で係数が滑らかであることと同値である。
:::

::: proof
**1.** $\varphi^{-1}$ の局所表示は恒等写像なので、\ref{mfd:differential-properties.3} から $d(\varphi^{-1})_{a}(e_{j})=\left.\partial/\partial x_{j}\right|_{m}$。両辺は $w$ について交代多重線形なので、$w=(e_{j_{1}},\dots,e_{j_{k}})$（$J\in\mathcal{I}_{k}$）で比べればよい（\ref{calc:dx-properties.4} の一意性）。左辺は $\sum_{I}f_{I}(m)dr_{I}(e_{J})=f_{J}(m)$、右辺は $\sum_{I}f_{I}(m)(dx_{I})_{m}(\partial/\partial x_{j_{1}},\dots)=f_{J}(m)$（\ref{mfd:abstract-wedge.3}）。

**2.** $b\in\varphi(U\cap V\cap W)$, $m\defeq\varphi^{-1}(b)$ について、$\varphi^{-1}=\psi^{-1}\circ\tau$ と連鎖律（\ref{mfd:differential-properties.1}・\ref{mfd:differential-properties.4}）から $d(\varphi^{-1})_{b}=d(\psi^{-1})_{\tau(b)}\circ D\tau(b)$。1 を両方の座標近傍に使うと
$$
\omega^{\varphi}_{b}(w)=\omega_{m}\bigl(d(\psi^{-1})_{\tau(b)}D\tau(b)w\bigr)=\omega^{\psi}_{\tau(b)}\bigl(D\tau(b)w\bigr)
$$
（$w$ は $k$ 個の組、各成分に施す）で、右辺は \ref{calc:pullback-properties.1} により $(\tau^{*}\omega^{\psi})_{b}(w)$。

**3.** 2 と \ref{calc:pullback} の式から、$\tau^{*}\omega^{\psi}$ の係数は $\omega^{\psi}$ の係数と $\tau$ の偏導関数の積の和なので、$\omega^{\psi}$ の係数が $C^{\infty}$ 級なら $\omega^{\varphi}$ の係数も $C^{\infty}$ 級。$f_{I}$ が滑らかなことは $f_{I}\circ\varphi^{-1}$ が $C^{\infty}$ 級であることと同値（\ref{mfd:smooth-map-criteria.1}）。
:::

::: definition 写像による引き戻し {#mfd:pullback keywords="pullback of differential forms by a smooth map between manifolds" index="引き戻し（多様体上の微分形式）|ひきもどしたようたいじょうのびぶんけいしき"}
滑らかな写像 $F\colon M\to N$ と $N$ 上の $k$ 形式 $\omega$ について、$M$ 上の $k$ 形式 $F^{*}\omega$ を
$$
(F^{*}\omega)_{m}\defeq(dF_{m})^{*}\omega_{F(m)},\quad\text{すなわち}\quad(F^{*}\omega)_{m}(v_{1},\dots,v_{k})=\omega_{F(m)}(dF_{m}v_{1},\dots,dF_{m}v_{k})
$$
で定め、$\omega$ の $F$ による**引き戻し**という。関数（$0$ 形式）では $F^{*}f=f\circ F$。
:::

::: intuition
引き戻しとは、行き先の形式に、出発点の接ベクトルを写像の微分で運んでから入れることで、出発点の形式を作る操作である。
:::

::: proposition 引き戻しの性質 {#mfd:pullback-properties keywords="pullback preserves smoothness and wedge products, is contravariantly functorial, and in charts is the Euclidean pullback of local representatives" index="引き戻しの性質（多様体）|ひきもどしのせいしつたようたい"}
$F\colon M\to N$, $G\colon N\to P$ を滑らかな写像とする。
1. （局所表示）$m$ を含む座標近傍 $(U,\varphi)$ と $F(m)$ を含む座標近傍 $(V,\psi)$ で $F(U)\subset V$ のものについて、$H\defeq\psi\circ F\circ\varphi^{-1}$ とすると $(F^{*}\omega)^{\varphi}=H^{*}(\omega^{\psi})$。とくに $\omega$ が滑らかなら $F^{*}\omega$ も滑らか。
2. $F^{*}(\omega\wedge\eta)=F^{*}\omega\wedge F^{*}\eta$、$F^{*}(f\omega)=(f\circ F)F^{*}\omega$、$(G\circ F)^{*}=F^{*}G^{*}$、$\mathrm{id}^{*}=\mathrm{id}$。
3. 関数 $f$ について $F^{*}(df)=d(f\circ F)$。
:::

::: proof
**1.** $a=\varphi(m)$ とする。\ref{mfd:local-representative-change.1} を両側に使い、$F\circ\varphi^{-1}=\psi^{-1}\circ H$ と連鎖律から $dF_{m}\circ d(\varphi^{-1})_{a}=d(\psi^{-1})_{H(a)}\circ DH(a)$ なので
$$
(F^{*}\omega)^{\varphi}_{a}(w)=\omega_{F(m)}\bigl(d(\psi^{-1})_{H(a)}DH(a)w\bigr)=\omega^{\psi}_{H(a)}(DH(a)w),
$$
これは \ref{calc:pullback-properties.1} から $(H^{*}\omega^{\psi})_{a}(w)$。$H$ は $C^{\infty}$ 級なので、\ref{mfd:local-representative-change.3} と同じ理由で係数は滑らか。

**2.** 各点で \ref{mfd:abstract-wedge.4} を $L=dF_{m}$ に使う。関数との積は定義から。合成は $d(G\circ F)_{m}=dG_{F(m)}\circ dF_{m}$（\ref{mfd:differential-properties.1}）と $(AB)^{*}=B^{*}A^{*}$ から。

**3.** $v\in T_{m}M$ について $(F^{*}df)_{m}(v)=df_{F(m)}(dF_{m}v)=dF_{m}(v)(f)=v(f\circ F)=d(f\circ F)_{m}(v)$。
:::

## 外微分 {#mfd:sec-fm-exterior}

::: theorem 外微分の存在と一意性 {#mfd:exterior-derivative keywords="existence and uniqueness of the exterior derivative on a manifold: linear antiderivation of degree 1 with d^2 = 0 extending the differential of functions; locality; commutes with pullback" index="外微分（多様体）|がいびぶんたようたい, 反導分|はんどうぶん" refname="外微分の存在と一意性"}
$M$ を可微分多様体とする。$\mathbb{R}$ 線形写像の族 $d\colon\Omega^{k}(M)\to\Omega^{k+1}(M)$（$k\ge0$）で、次を満たすものがただ一つ存在する。
1. $f\in\Omega^{0}(M)$ について $df$ は関数の微分（\ref{mfd:cotangent-space}）。
2. （ライプニッツ則）$\omega\in\Omega^{k}(M)$ について $d(\omega\wedge\eta)=d\omega\wedge\eta+(-1)^{k}\omega\wedge d\eta$。
3. $d\circ d=0$。

さらに、この $d$ は次を満たす。
4. （局所性・座標表示）開集合 $W$ について $(d\omega)\restriction W=d(\omega\restriction W)$（右辺は開部分多様体 $W$ の $d$）。座標近傍 $(U,\varphi)$ の上で $(d\omega)^{\varphi}=d(\omega^{\varphi})$（右辺は \ref{calc:exterior-derivative}）、すなわち $d\bigl(\sum_{I}f_{I}dx_{I}\bigr)=\sum_{I}df_{I}\wedge dx_{I}$。
5. 滑らかな写像 $F\colon M\to N$ について $F^{*}(d\omega)=d(F^{*}\omega)$。
:::

::: intuition
多様体上の微分形式にも、座標の選び方によらない外微分がただ一通りに定まる。それは、関数については普通の微分で、積については積の微分法則（符号つき）に従い、二回施すと 0 になる操作として特徴づけられ、写像で引き戻す操作と順番を入れ替えてよい。
:::

::: proof
**Step 1（座標近傍ごとの定義が一致する）.** 【主張：二つの座標近傍 $(U,\varphi)$, $(V,\psi)$ の共通部分の上で、$d(\omega^{\varphi})$ と $d(\omega^{\psi})$ は同じ $(k+1)$ 形式の局所表示である】\ref{mfd:local-representative-change.2} から $\omega^{\varphi}=\tau^{*}\omega^{\psi}$（$\tau=\psi\circ\varphi^{-1}$）。$\tau$ は $C^{\infty}$ 級なので \ref{calc:pullback-properties.4} から $d(\omega^{\varphi})=d(\tau^{*}\omega^{\psi})=\tau^{*}d(\omega^{\psi})$。局所表示の間の関係が $\tau^{*}$ であることは、\ref{mfd:local-representative-change.1} により、同じ形式の二つの局所表示であることと同値（各点で、接空間の基底を $d(\varphi^{-1})$, $d(\psi^{-1})$ で移したものが一致する）。

**Step 2（存在）.** 【主張：$(d\omega)^{\varphi}\defeq d(\omega^{\varphi})$ で定めた $d\omega$ は 1〜5 を満たす】Step 1 から $d\omega$ は well-defined で、係数は $C^{\infty}$ 級。1：$d(f\circ\varphi^{-1})=\sum_{j}\partial_{j}(f\circ\varphi^{-1})dr_{j}$ は、$df=\sum_{j}\frac{\partial f}{\partial x_{j}}dx_{j}$（\ref{mfd:df-in-coordinates}）の局所表示。2・3：局所表示は和・外積と可換で（定義から）、\ref{calc:exterior-derivative-properties.2}・\ref{calc:exterior-derivative-properties.3} を使う（係数は $C^{\infty}$ 級）。4：定義が座標近傍ごとなので局所的で、$d(\sum f_{I}dx_{I})$ の局所表示は $\sum d(f_{I}\circ\varphi^{-1})\wedge dr_{I}$（\ref{calc:exterior-derivative-properties.1}）。5：\ref{mfd:pullback-properties.1} と \ref{calc:pullback-properties.4} から $(F^{*}d\omega)^{\varphi}=H^{*}(d\omega^{\psi})=d(H^{*}\omega^{\psi})=d((F^{*}\omega)^{\varphi})=(dF^{*}\omega)^{\varphi}$。

**Step 3（一意性の準備：局所性）.** 【主張：1〜3 を満たす族 $d'$ について、$\omega$ が点 $m$ の開近傍 $W$ の上で $0$ なら $(d'\omega)_{m}=0$】\ref{mfd:manifold-topology.1}（$O=W$）から、$m$ の開近傍 $W'$ で $\overline{W'}\subset W$ となるものをとり、\ref{mfd:smooth-urysohn.1} を $A=\overline{W'}$, $G=W$ に使って $h$ をとる。$g\defeq1-h$ は $W'$ の上で $0$、$M\setminus W$ の上で $1$。すると $g\omega=\omega$ で、2 から $d'\omega=d'(g\omega)=dg\wedge\omega+g\,d'\omega$（$g$ は $0$ 形式）。$m$ で $\omega_{m}=0$, $g(m)=0$ なので $(d'\omega)_{m}=0$。

**Step 4（一意性）.** 【主張：$d'\omega=d\omega$】$m\in M$ と、$m$ を含む座標近傍 $(U;x_{1},\dots,x_{n})$ をとり、$U$ 上 $\omega=\sum_{I}f_{I}dx_{I}$ とする。\ref{mfd:smooth-urysohn.2} から、$M$ 上の滑らかな関数 $\tilde{f}_{I}$, $\tilde{x}_{i}$ で、$m$ のある開近傍 $W$ の上で $f_{I}$, $x_{i}$ と一致するものがとれる（$W$ は有限個の近傍の共通部分）。$\tilde{\omega}\defeq\sum_{I}\tilde{f}_{I}\,d\tilde{x}_{i_{1}}\wedge\cdots\wedge d\tilde{x}_{i_{k}}\in\Omega^{k}(M)$ は $W$ の上で $\omega$ と一致する（$d\tilde{x}_{i}=dx_{i}$ は $W$ 上で成り立つ：関数の微分は芽で決まる）。Step 3 から $(d'\omega)_{m}=(d'\tilde{\omega})_{m}$。2 と 3（$d'd\tilde{x}_{i}=d'd'\tilde{x}_{i}=0$、1 から $d\tilde{x}_{i}=d'\tilde{x}_{i}$）を繰り返し使うと
$$
d'\tilde{\omega}=\sum_{I}d\tilde{f}_{I}\wedge d\tilde{x}_{i_{1}}\wedge\cdots\wedge d\tilde{x}_{i_{k}},
$$
これを $m$ で評価すると、4 から $(d\omega)_{m}=\sum_{I}(df_{I})_{m}\wedge(dx_{I})_{m}$ に等しい。$m$ は任意なので $d'\omega=d\omega$。

::: hypcheck
- **1（関数の微分との一致）**：Step 4 で $d'\tilde{x}_{i}$, $d'\tilde{f}_{I}$ を決めるのに使った。外すと一意性は失われる：定数 $c\neq1$ について $d'\defeq c\,d$ は線形で 2・3 を満たす（2 の両辺がともに $c$ 倍になる）が、1 を満たさない。
- **2（ライプニッツ則）**：Step 3 の局所性と Step 4 の展開に使った。
- **3（$d\circ d=0$）**：Step 4 で $d'(d\tilde{x}_{i})=0$ に使った（1 と 2 だけでは $d'(dx_{i})$ が決まらない）。
- **1 の分割（ハウスドルフ性・第二可算性）**：Step 3・Step 4 で、局所的な関数を大域的な関数に延ばすのに使った（\ref{mfd:smooth-urysohn}）。存在の Step 1・Step 2 は座標近傍だけで済む。
- **$C^{\infty}$ 級**：Step 1 で \ref{calc:pullback-properties.4} を使うのに座標変換が $C^{2}$ 級であることが要る。
:::
:::

## 閉形式とド・ラームコホモロジー {#mfd:sec-fm-de-rham}

::: definition ド・ラームコホモロジー {#mfd:de-rham-cohomology keywords="closed and exact forms on a manifold, de Rham cohomology H^k(M), induced maps F^*, cup product by wedge" index="ド・ラームコホモロジー|どらーむこほもろじー, 閉形式（多様体）|へいけいしきたようたい, 完全形式（多様体）|かんぜんけいしきたようたい"}
$\omega\in\Omega^{k}(M)$ が $d\omega=0$ を満たすとき**閉形式**、ある $\eta\in\Omega^{k-1}(M)$ で $\omega=d\eta$ と書けるとき**完全形式**という（$k=0$ では完全形式は $0$ だけとする）。閉形式の全体 $Z^{k}(M)$ は完全形式の全体 $B^{k}(M)$ を含む（$d\circ d=0$）。商ベクトル空間
$$
H^{k}(M)\defeq Z^{k}(M)/B^{k}(M)
$$
を $M$ の $k$ 次の**ド・ラームコホモロジー**という。
:::

::: intuition
ド・ラームコホモロジーとは、外微分が 0 になる形式のうち、別の形式の外微分としては書けないものがどれだけあるかを測る量で、多様体の「穴」を微分形式で検出する。
:::

::: proposition ド・ラームコホモロジーの基本性質 {#mfd:de-rham-properties keywords="functoriality of de Rham cohomology, wedge product on cohomology, H^0 is locally constant functions, H^k = 0 for k > dim M" index="ド・ラームコホモロジーの性質|どらーむこほもろじーのせいしつ"}
1. 滑らかな写像 $F\colon M\to N$ は線形写像 $F^{*}\colon H^{k}(N)\to H^{k}(M)$, $[\omega]\mapsto[F^{*}\omega]$ を定め、$(G\circ F)^{*}=F^{*}G^{*}$、$\mathrm{id}^{*}=\mathrm{id}$。とくに微分同相写像は同型を誘導する。
2. 外積は $[\omega]\cdot[\eta]\defeq[\omega\wedge\eta]$ により $H^{k}(M)\times H^{l}(M)\to H^{k+l}(M)$ を定める。
3. $H^{0}(M)$ は $M$ 上の局所定数関数（各点の近傍で定数の関数）の空間に等しい。とくに $M$ が連結で空でなければ $H^{0}(M)\cong\mathbb{R}$。
4. $k>\dim M$ なら $H^{k}(M)=0$。
:::

::: proof
**1.** $F^{*}$ は $d$ と可換（\ref{mfd:exterior-derivative.5}）なので、閉形式を閉形式に、完全形式 $d\eta$ を完全形式 $d(F^{*}\eta)$ に移す。よって商の上の線形写像が定まる。合成の性質は \ref{mfd:pullback-properties.2} から。微分同相写像 $F$ については $F^{*}$ と $(F^{-1})^{*}$ が互いに逆。

**2.** 閉形式どうしの外積は、ライプニッツ則から閉。$\omega$ が閉で $\eta'=\eta+d\zeta$ なら $\omega\wedge\eta'=\omega\wedge\eta+(-1)^{k}d(\omega\wedge\zeta)$（ライプニッツ則と $d\omega=0$）なので類は代表元によらない。左側の取り替えも同様。

**3.** $B^{0}=0$ なので $H^{0}=Z^{0}=\{f:df=0\}$。$df=0$ は各点で $df_{m}=0$、すなわち $f$ の\term[微分]{mfd:cotangent-space}が $0$ ということ（$f\colon M\to\mathbb{R}$ の写像の微分は $v\mapsto v(f)$）。各点 $m$ のまわりの、像が開球の座標近傍は連結なので、\ref{mfd:zero-differential-constant} から $f$ はそこで定数。逆に局所定数関数は各点で微分が $0$。$M$ が連結なら局所定数関数は定数（ある値の逆像は開かつ閉）。

**4.** $\Lambda^{k}T_{m}^{*}M=0$（\ref{mfd:abstract-wedge.3}）なので $\Omega^{k}(M)=0$。
:::

::: theorem 多様体上のポアンカレの補題 {#mfd:poincare-lemma-manifold keywords="closed forms are locally exact; de Rham cohomology of a manifold diffeomorphic to a star-shaped open subset of R^n vanishes in positive degrees" index="ポアンカレの補題（多様体）|ぽあんかれのほだいたようたい, 局所完全|きょくしょかんぜん"}
1. $M$ が $\mathbb{R}^{n}$ の星形の開集合と微分同相なら、$k\ge1$ で $H^{k}(M)=0$。
2. 任意の可微分多様体 $M$ 上の閉形式 $\omega\in\Omega^{k}(M)$（$k\ge1$）は**局所的に完全**である：各点 $m$ に開近傍 $U$ と $\eta\in\Omega^{k-1}(U)$ があって、$U$ 上で $\omega=d\eta$。
:::

::: intuition
閉形式は、各点の十分小さな近くでは必ず別の形式の外微分として書ける。閉形式が全体で外微分として書けるかどうかは、多様体全体の形だけで決まる。
:::

::: proof
**1.** $F\colon M\to U$ を星形の開集合 $U$ への微分同相写像とする。\ref{calc:poincare-lemma} から $H^{k}(U)=0$（$C^{\infty}$ 級の閉形式 $\omega$ について、$K\omega$ の係数は $\int_{0}^{1}t^{k-1}f_{A}(tx)\,dt$ と $x_{a}$ の積で、\ref{mfd:hadamard-lemma} の証明の Step 2 と同じく積分記号下の微分により $C^{\infty}$ 級）。\ref{mfd:de-rham-properties.1} から $H^{k}(M)\cong H^{k}(U)=0$。

**2.** $m$ を中心とし像が開球の座標近傍 $(U,\varphi)$ をとる（\ref{mfd:maximal-atlas.3}）。$\varphi\colon U\to\varphi(U)$ は微分同相写像で、開球は星形。$\omega\restriction U$ は閉（\ref{mfd:exterior-derivative.4}）なので、1 から $\omega\restriction U=d\eta$ となる $\eta\in\Omega^{k-1}(U)$ がある。
:::

::: example
$M=\mathbb{R}^{2}\setminus\{0\}$ 上の $1$ 形式 $\omega=\dfrac{-y\,dx+x\,dy}{x^{2}+y^{2}}$ は閉形式だが完全形式でない（\ref{calc:exact-closed-curve.2}）。よって $H^{1}(\mathbb{R}^{2}\setminus\{0\})\neq0$ で、$\mathbb{R}^{2}\setminus\{0\}$ は $\mathbb{R}^{2}$ の星形の開集合と微分同相でない（\ref{mfd:poincare-lemma-manifold.1}）。一方、ポアンカレの補題の 2 から、$\omega$ は原点以外の各点の近くでは完全で、実際、原点を通らない半直線を除いた領域では偏角関数 $\theta$ について $\omega=d\theta$。
:::

::: supplement
**ベクトル束としての見方.** 各点の $\Lambda^{k}T_{m}^{*}M$ を集めた $\Lambda^{k}T^{*}M\defeq\bigsqcup_{m}\Lambda^{k}T_{m}^{*}M$ は、座標近傍ごとの係数を座標にして $n+\binom{n}{k}$ 次元の可微分多様体になり（$k=0$ なら $M\times\mathbb{R}$、$k=1$ なら余接束）、滑らかな $k$ 形式はその滑らかな切断（各点 $m$ に $\Lambda^{k}T_{m}^{*}M$ の元を選ぶ滑らかな写像）と同じものである。Warner はこの順に定義している。

**一般化.** 外微分は、ベクトル場との内部積 $\iota_{X}$ とリー微分 $\mathcal{L}_{X}$ と合わせて、カルタンの公式 $\mathcal{L}_{X}=d\iota_{X}+\iota_{X}d$ を満たすことが知られている（本サイト未収録）。

**ド・ラームの定理.** $H^{k}(M)$ は、実数係数の特異コホモロジー $H^{k}(M;\mathbb{R})$ と同型である（**ド・ラームの定理**）ことが知られている。証明は、ポアンカレの補題（局所的には完全）と 1 の分割を使い、層のコホモロジーの言葉では「滑らかな微分形式の層は細層で、ド・ラーム複体は定数層 $\mathbb{R}$ の分解」という形にまとまる（\see{cat:page-flasque-cech}）。

**高い視点.** \ref{mfd:abstract-wedge} の構成は、「$\mathbb{R}^{n}$ で定義した構造が $GL_{n}(\mathbb{R})$ の作用と可換なら、基底の選び方によらずに任意の $n$ 次元ベクトル空間へ移せる」という一般原理の例である。多様体上の対象（微分形式・計量など）を座標近傍ごとに定義して貼り合わせる議論は、この原理を座標変換の群（微分同相写像の芽）に広げたものと見られる。
:::

## 問題 {#mfd:sec-fm-problems}

::: problem {#mfd:prob-fm-sphere-form}
$\iota\colon S^{1}\to\mathbb{R}^{2}$ を包含写像、$\omega=-y\,dx+x\,dy$ とする。立体射影の逆写像 $q(u)=\bigl(2u,u^{2}-1\bigr)/(u^{2}+1)$（\ref{mfd:manifold-examples.4}、$d=1$）について、$q^{*}\omega$ を計算せよ。
:::

::: solution
$x=2u/(u^{2}+1)$, $y=(u^{2}-1)/(u^{2}+1)$ とすると、$dx=\dfrac{2(1-u^{2})}{(u^{2}+1)^{2}}du$, $dy=\dfrac{4u}{(u^{2}+1)^{2}}du$。よって
$$
q^{*}\omega=\frac{-(u^{2}-1)\cdot2(1-u^{2})+2u\cdot4u}{(u^{2}+1)^{3}}\,du=\frac{2(u^{2}+1)^{2}}{(u^{2}+1)^{3}}\,du=\frac{2\,du}{u^{2}+1}.
$$
（$q$ は $\mathbb{R}\to S^{1}\setminus\{N\}\subset\mathbb{R}^{2}$ なので、\ref{mfd:pullback-properties.2} から $q^{*}\iota^{*}\omega=(\iota\circ q)^{*}\omega$ を $\mathbb{R}^{2}$ の引き戻しとして計算してよい。）$\int_{\mathbb{R}}\frac{2\,du}{u^{2}+1}=2\pi$ は、$\omega$ の円周上の積分が $2\pi$ であることに対応する（積分は次のページ）。
:::

::: problem {#mfd:prob-fm-h0-components}
$M$ が連結成分 $M_{1},\dots,M_{r}$（それぞれ開集合）をもつとき、$H^{0}(M)\cong\mathbb{R}^{r}$ を示せ。また $H^{k}(M)\cong\bigoplus_{i}H^{k}(M_{i})$ を示せ。
:::

::: solution
局所定数関数は各 $M_{i}$ の上で定数（\ref{mfd:de-rham-properties.3}、$M_{i}$ は連結）で、逆に各成分で任意の定数をとった関数は局所定数（$M_{i}$ は開）。よって $H^{0}(M)\cong\mathbb{R}^{r}$。一般に、包含 $\iota_{i}\colon M_{i}\to M$ による引き戻しを並べた $\Omega^{k}(M)\to\bigoplus_{i}\Omega^{k}(M_{i})$ は全単射（形式は各点ごとに決まり、滑らかさは局所的）で、$d$ と可換なので、閉形式・完全形式を対応させ、商の同型を与える。
:::

::: problem {#mfd:prob-fm-wedge-closed}
$\omega\in\Omega^{k}(M)$ が閉、$\eta\in\Omega^{l}(M)$ が完全なら、$\omega\wedge\eta$ は完全であることを示せ。
:::

::: solution
$\eta=d\zeta$ とすると、ライプニッツ則と $d\omega=0$ から $d(\omega\wedge\zeta)=d\omega\wedge\zeta+(-1)^{k}\omega\wedge d\zeta=(-1)^{k}\omega\wedge\eta$。よって $\omega\wedge\eta=d\bigl((-1)^{k}\omega\wedge\zeta\bigr)$。
:::
