# ガウス＝ボネの定理（大域版） {#surf:page-gauss-bonnet-global keywords="global Gauss-Bonnet theorem, compact oriented surface, orientation, unit normal field, triangulation, Euler characteristic, total curvature, sphere, torus, genus, Radó theorem"}

前のページ（\ref{surf:page-gauss-bonnet-local}）の局所版を、閉じた（コンパクトな）曲面全体に広げる。曲面を曲面上の三角形に分けて局所版を足し合わせると、隣り合う三角形の辺の寄与は打ち消し合い、角の寄与は頂点・辺・面の数で書ける。結果は、ガウス曲率の全積分が $2\pi$ と**オイラー標数** $\chi=V-E+F$ の積に等しいという**ガウス＝ボネの定理**である。左辺は計量で決まる量、右辺は曲面の形（位相）だけで決まる数で、たとえば球面と同相な曲面は、どう曲げてもガウス曲率の全積分が $4\pi$ になる。三角形分割の存在など、曲面の位相に関する事実は証明せずに引用し、それを使ってよい範囲を明示する。

> 資料：Klingenberg『A Course in Differential Geometry』第 6 章 6.3 と同じ内容。三角形分割の存在（ラドーの定理）、頂点のまわりの内角の和、曲面上の積分が分割によらないことは、資料と同じく証明せずに使う（本ページでは fact として明示した）。辺の寄与の打ち消し合いと角の数え上げは書き下ろした。

## 記法と定義の確認 {#surf:sec-gg-notation}

::: notation
- 正則曲面 \ref{surf:regular-surface}、局所パラメータ表示と座標変換 \ref{surf:transition-smooth}、曲面上の三角形・外角・内角 \ref{surf:surface-triangle}、ガウス＝ボネの定理（局所版） \tref{surf:gauss-bonnet-local}、測地的曲率 \ref{surf:geodesic-curvature}、ガウス曲率 \ref{surf:gauss-mean-curvature} とその不変性 \ref{surf:surface-curvature-invariance}。
- コンパクト：$\mathbb{R}^{3}$ の部分集合として有界閉（\ref{top:heine-borel}）。
- **体系**：$\mathsf{ZF}$。選択公理は使わない（下の fact の証明には使われるかもしれないが、それについては述べない）。
:::

## 向きと三角形分割 {#surf:sec-gg-triangulation}

::: definition 向きのついた曲面 {#surf:oriented-surface keywords="orientation of a regular surface: a continuous unit normal field N; positively oriented local parametrizations" index="向きのついた曲面|むきのついたきょくめん, 向き付け可能|むきづけかのう, 単位法ベクトル場|たんいほうべくとるば"}
正則曲面 $S$ の上の連続写像 $N\colon S\to S^{2}$ で、各 $p\in S$ で $N(p)\perp T_{p}S$ となるものを $S$ の**向き**（単位法ベクトル場）といい、向きをもつ曲面を**向き付け可能**という。局所パラメータ表示 $f$ は、その単位法ベクトルが $n=N\circ f$ をみたすとき**正の向き**であるという。
:::

::: intuition
向きとは、曲面の各点で「表」の側を連続に選ぶことである。メビウスの帯のように、一周すると表と裏が入れ替わる曲面では、これができない。
:::

::: remark
向き $N$ があれば、どの点のまわりにも正の向きの局所パラメータ表示がある：$f$ の単位法ベクトル $n$ は $N\circ f$ か $-N\circ f$ で、$\langle n,N\circ f\rangle$ は連続で $\pm1$ の値をとるので、連結な定義域（たとえば円板）では一定。$-N\circ f$ なら座標 $u^{1},u^{2}$ を入れ替える（\ref{surf:reparametrization-tangent.2}）。
:::

::: definition 三角形分割とオイラー標数 {#surf:triangulation keywords="triangulation of a compact oriented surface by surface triangles; Euler characteristic chi = V - E + F" index="三角形分割|さんかくけいぶんかつ, オイラー標数|おいらーひょうすう, オイラー数|おいらーすう"}
$S$ を向き $N$ のついたコンパクトな正則曲面とする。有限個の曲面上の三角形 $T_{1},\dots,T_{F}$ の組が $S$ の**三角形分割**であるとは、次をみたすことをいう。
1. 各 $T_{k}=f_{k}(\Phi_{k}(\Delta_{k}))$ は、正の向きの局所パラメータ表示 $f_{k}$ による曲面上の三角形（\ref{surf:surface-triangle}）である。
2. $S=\bigcup_{k}T_{k}$ で、$k\neq l$ なら $T_{k}\cap T_{l}$ は空集合か、共通の頂点 1 つか、共通の辺 1 本（辺の像として）である。
3. 各辺はちょうど 2 つの三角形の辺である。

頂点（点として）の個数を $V$、辺（集合として）の本数を $E$、三角形の個数を $F$ とし、$\chi\defeq V-E+F$ をこの三角形分割の**オイラー標数**という。
:::

::: intuition
三角形分割とは、曲面を、きちんと辺どうし・頂点どうしで貼り合わさった有限個の曲がった三角形に切り分けることである。オイラー標数は、頂点の数から辺の数を引き、面の数を足したもので、曲面の形（穴の数）を表す。
:::

::: fact 三角形分割に関する事実 {#surf:triangulation-facts keywords="Rado: every compact surface admits a triangulation; angles around a vertex sum to 2 pi; neighbouring triangles induce opposite orientations on a common edge; integral over S independent of triangulation" index="ラドーの定理|らどーのていり, 三角形分割の存在|さんかくけいぶんかつのそんざい"}
$S$ を向きのついたコンパクトな正則曲面とする。
1. **（存在）** $S$ は三角形分割をもつ（ラドーの三角形分割定理の滑らかな版。Klingenberg 第 6 章 6.3 でも証明なしに使われている。位相的な三角形分割の存在は多様体の系列で証明する予定：\see[ラドーの三角形分割定理]{mfd:rado-triangulation}）。
2. **（頂点のまわり）** 三角形分割の各頂点 $p$ で、$p$ を頂点にもつ三角形の $p$ での内角の和は $2\pi$ である。
3. **（辺の向き）** 共通の辺をもつ 2 つの三角形は、その辺に互いに逆の向きを与える（正の向きの境界としてたどる向きが逆になる）。
4. **（積分）** 連続関数 $\varphi\colon S\to\mathbb{R}$ について、$\sum_{k}\iint_{T_{k}}\varphi\,dA$ は三角形分割の選び方によらない。この値を $\iint_{S}\varphi\,dA$ と書く。

（2・3 は、三角形分割の各点のまわりの様子が平面の扇形の並びと同じであることから従い、4 は曲面上の積分の一般論（1 の分割など）から従う。本サイトではこれらを証明しない。なお、オイラー標数が三角形分割によらないことは、ホモロジーの位相不変性とオイラー–ポアンカレの公式（\see{at:euler-poincare}）からも従う。）
:::

## ガウス＝ボネの定理 {#surf:sec-gg-theorem}

::: theorem ガウス＝ボネの定理（大域版） {#surf:gauss-bonnet-global keywords="global Gauss-Bonnet theorem: for a compact oriented regular surface and any triangulation, the total Gauss curvature equals 2 pi times the Euler characteristic; the Euler characteristic is independent of the triangulation" index="ガウス＝ボネの定理（大域版）|がうすぼねのていりたいいきばん, 全曲率|ぜんきょくりつ" refname="ガウス＝ボネの定理（大域版）"}
$S$ を向きのついたコンパクトな正則曲面とし、三角形分割 $T_{1},\dots,T_{F}$ をとる。このとき
$$
\iint_{S}K\,dA=2\pi\chi.
$$
とくに、オイラー標数 $\chi$ は三角形分割の選び方によらない。
:::

::: intuition
閉じた曲面のガウス曲率をすべて足し合わせると、曲面の細かい形にはよらず、穴の数だけで決まる値（オイラー標数の $2\pi$ 倍）になる。曲面をどんなに曲げたりへこませたりしても、ガウス曲率の合計は変わらない。
:::

::: proof
**Step 1（局所版の和）.** 【主張：$\iint_{S}K\,dA+\sum_{k}\sum_{\text{辺}}\int\kappa_{g}\,ds+\sum_{k}\sum_{j}\alpha_{k,j}=2\pi F$】各 $T_{k}$ に局所版（\ref{surf:gauss-bonnet-local}）を使って $k$ について足す。$K$ の積分の和は \ref{surf:triangulation-facts.4} の定義で $\iint_{S}K\,dA$。ここで $\kappa_{g}$ は $f_{k}$ の法ベクトル $n_{k}=N\circ f_{k}$ で測る。

**Step 2（辺の打ち消し合い）.** 【主張：辺についての測地的曲率の積分の和は $0$】各辺はちょうど 2 つの三角形に属し（三角形分割の条件 3）、2 つは逆の向きにたどる（\ref{surf:triangulation-facts.3}）。両方とも法ベクトルは同じ $N$ なので、弧長パラメータ $c(s)$ と逆向きの $\tilde c(s)\defeq c(\ell-s)$ について $\tilde c''(s)=c''(\ell-s)$, $\tilde c'(s)=-c'(\ell-s)$、よって $\tilde\kappa_{g}(s)=\langle\tilde c'',N\times\tilde c'\rangle=-\kappa_{g}(\ell-s)$ で、積分は打ち消し合う。

**Step 3（角の数え上げ）.** 【主張：$\sum_{k}\sum_{j}\alpha_{k,j}=3\pi F-2\pi V$】外角は $\alpha_{k,j}=\pi-\beta_{k,j}$ で、三角形は $F$ 個、各 3 つの角をもつので $\sum\alpha=3\pi F-\sum\beta$。内角を頂点ごとにまとめると、各頂点で和は $2\pi$（\ref{surf:triangulation-facts.2}）なので $\sum\beta=2\pi V$。

**Step 4（結論）.** 【主張：$\iint_{S}K\,dA=2\pi(V-E+F)$】各三角形は 3 本の辺をもち、各辺はちょうど 2 つの三角形に属するので $3F=2E$。Step 1〜3 から $\iint_{S}K\,dA=2\pi F-(3\pi F-2\pi V)=2\pi V-\pi F=2\pi V-2\pi E+2\pi F$（$\pi F=2\pi E-2\pi F$）。左辺は三角形分割によらない（\ref{surf:triangulation-facts.4}）ので、$\chi$ もよらない。

::: hypcheck
- **前提「向きがついている」**：Step 2 で、隣り合う三角形が同じ法ベクトル $N$ で測地的曲率を測ること（打ち消し合いの符号）に使った。
- **前提「コンパクト」**：三角形分割が有限個であること（\ref{surf:triangulation-facts.1}）と、和が有限であることに使った。
- **事実の使用**：三角形分割の存在（オイラー標数の定義のため）、頂点のまわりの角の和、辺の向き、積分の分割によらなさ（\ref{surf:triangulation-facts}）を証明せずに使った。局所版（\ref{surf:gauss-bonnet-local}）は本サイトで証明してある。
:::
:::

::: corollary 球面とトーラスのオイラー標数 {#surf:euler-sphere-torus keywords="Euler characteristic of the sphere is 2 and of the torus is 0, computed from the Gauss-Bonnet theorem" index="球面のオイラー標数|きゅうめんのおいらーひょうすう, トーラスのオイラー標数|とーらすのおいらーひょうすう"}
半径 $r$ の球面のオイラー標数は $2$、トーラス $\bigl(\sqrt{x^{2}+y^{2}}-R\bigr)^{2}+z^{2}=r^{2}$（$0<r<R$）のオイラー標数は $0$ である（ともに外向きの法ベクトルで向きをつける）。
:::

::: proof
球面では $K=\frac{1}{r^{2}}$ で面積は $4\pi r^{2}$（\ref{surf:page-regular-surfaces} の例。面積を \ref{surf:triangulation-facts.4} の積分として計算してよいことも認める）なので、$\iint K\,dA=4\pi$、$\chi=2$。トーラスでは、角度座標 $(\theta,\varphi)$ で $K=\frac{\cos\theta}{r(R+r\cos\theta)}$（\ref{surf:page-second-fundamental-form} の例）、面積要素は $r(R+r\cos\theta)\,d\theta\,d\varphi$ なので $\iint K\,dA=\int_{0}^{2\pi}\int_{0}^{2\pi}\cos\theta\,d\theta\,d\varphi=0$、$\chi=0$。
:::

::: example
球面に内接する正四面体を中心から球面に射影すると、4 つの曲面上の三角形への分割が得られ、$V=4$, $E=6$, $F=4$、$\chi=2$。トーラスを 3 本の子午線と 3 本の緯線で 9 つの四辺形に分け、各四辺形を対角線で 2 つの三角形に分けると、$V=9$, $E=27$, $F=18$、$\chi=0$。どちらも系と一致する（これらが三角形分割の条件をみたすことは認める）。
:::

::: corollary 曲率の符号とオイラー標数 {#surf:curvature-sign-euler keywords="if K > 0 everywhere then chi > 0; if K <= 0 everywhere then chi <= 0; a compact surface with chi = 0 has points of positive and negative curvature or is flat; every compact surface has an elliptic point" index="曲率の符号とオイラー標数|きょくりつのふごうとおいらーひょうすう"}
$S$ を向きのついたコンパクトな正則曲面とする。
1. $K>0$ が至る所で成り立てば $\chi>0$。
2. $\chi\le0$ なら $K\le0$ となる点がある。$\chi<0$ なら $K<0$ となる点がある。
3. $\chi=0$（たとえばトーラスと同じオイラー標数）なら、$K$ は正の値と負の値の両方をとる。
:::

::: proof
**1, 2.** $K>0$ なら $\iint K\,dA>0$（連続な正の関数の積分。各三角形で正）で、定理から $\chi>0$。2 は 1 と同様に、$K>0$（または $K\ge0$）が至る所なら $\chi>0$（または $\ge0$）であることの対偶。

**3.** コンパクトな正則曲面には $K>0$ の点がある（\ref{surf:prob-sf-compact-elliptic}）。$\chi=0$ なら $\iint K\,dA=0$ なので、$K<0$ の点もなければならない（$K\ge0$ で一点で正なら、その近くの三角形で積分は正）。
:::

::: supplement
**位相との関係.** 向き付け可能なコンパクトな曲面は、球面に $g$ 個の取っ手をつけたもの（種数 $g$ の曲面）と同相であり、そのオイラー標数は $2-2g$ である（曲面の分類定理。本サイトでは扱わない）。ガウス＝ボネの定理と合わせると $\iint_{S}K\,dA=4\pi(1-g)$。とくに $K>0$ のコンパクトな曲面は球面と同相で、$K\equiv0$ ならトーラスと同相、$K<0$ なら種数 $2$ 以上である。オイラー標数は位相不変量で、ホモロジーを使うと $\chi=\sum(-1)^{i}\operatorname{rank}H_{i}$ と三角形分割なしに定義できる（\see{at:page-manifold-complexes} などの代数的位相幾何学の系列）。

**一般化.** 境界をもつコンパクトな曲面では、境界の測地的曲率の積分と角の外角が加わる：$\iint K\,dA+\int_{\partial S}\kappa_{g}\,ds+\sum\alpha_{j}=2\pi\chi$。高次元では、偶数次元の閉リーマン多様体についてガウス＝ボネ＝チャーンの定理がある（本サイトでは扱わない）。

**高い視点.** 左辺は計量（局所的な量）、右辺は位相（大域的な量）であり、ガウス＝ボネの定理は「曲率の積分は位相不変量」という形の定理の原型である。ガウス写像を使うと、$\mathbb{R}^{3}$ の閉曲面では $\iint K\,dA$ はガウス写像 $N\colon S\to S^{2}$ の写像度の $4\pi$ 倍でもある（\ref{surf:gauss-map-area} で $K$ はガウス写像の面積の拡大率）。
:::

## 問題 {#surf:sec-gg-problems}

::: problem {#surf:prob-gg-ellipsoid}
★ 基本：楕円面 $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}+\frac{z^{2}}{c^{2}}=1$ のガウス曲率の全積分を、ガウス＝ボネの定理を使って求めよ（楕円面のオイラー標数が球面と同じ $2$ であることは認めてよい）。
:::

::: solution
$\iint K\,dA=2\pi\cdot2=4\pi$。曲率を直接積分しなくても、球面と同じ値になる。
:::

::: problem {#surf:prob-gg-polyhedron}
★ 基本：凸多面体の頂点・辺・面の数について $V-E+F=2$（オイラーの多面体定理）が成り立つことを、多面体を内部の点から外接球面に射影した三角形分割（面を三角形に分けておく）とガウス＝ボネの定理から説明せよ（射影が三角形分割を与えることは認めてよい）。
:::

::: solution
面を対角線で三角形に分けても $V-E+F$ は変わらない（$m$ 角形の面を $m-2$ 個の三角形に分けると、面が $m-3$ 個、辺が $m-3$ 本増える）。射影で得た球面の三角形分割について、定理と \ref{surf:euler-sphere-torus} から $V-E+F=\chi=2$。
:::

::: problem {#surf:prob-gg-no-negative-sphere}
★★ 標準：球面と同じオイラー標数 $2$ をもつコンパクトな正則曲面では、$\iint_{S}|K|\,dA\ge4\pi$ であることを示せ。また、$K<0$ となる点をもつことはあるか。
:::

::: solution
$\iint|K|\ge\iint K=2\pi\cdot2=4\pi$。等号は $K\ge0$ のとき。$K<0$ となる点はあってよい：球面の一部を内側にへこませた曲面（へこみの縁の近くに負の曲率の部分がある）では、正の曲率の積分が $4\pi$ より大きくなって、負の部分を打ち消す。
:::

::: problem {#surf:prob-gg-torus-curvature}
★★ 標準：トーラスを \ref{surf:triangulation-facts} を使わずに角度座標 $(\theta,\varphi)\in[0,2\pi]^{2}$ の長方形の像とみて、$\int_{0}^{2\pi}\int_{0}^{2\pi}K\sqrt{EG-F^{2}}\,d\theta\,d\varphi=0$ を直接計算し、正の曲率の部分（外側）と負の曲率の部分（内側）の積分がそれぞれ $4\pi$, $-4\pi$ であることを示せ。
:::

::: solution
$K\sqrt{EG-F^{2}}=\frac{\cos\theta}{r(R+r\cos\theta)}\cdot r(R+r\cos\theta)=\cos\theta$。$\int_{0}^{2\pi}\int_{0}^{2\pi}\cos\theta\,d\theta\,d\varphi=0$。正の部分は $|\theta|<\frac\pi2$ で $\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta\cdot2\pi=4\pi$、負の部分は $-4\pi$。（全曲率 $\pm4\pi$ は、外側半分のガウス写像が単位球面を一回覆うことに対応する。）
:::
