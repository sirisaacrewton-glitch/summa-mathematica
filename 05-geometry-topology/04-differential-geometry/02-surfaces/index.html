# 曲面論（Theory of Surfaces）

ℝ³ の曲面片と正則曲面、接平面、第一基本形式（長さ・角・面積）、ガウス写像と第二基本形式、主曲率・ガウス曲率・平均曲率、ガウスの驚異の定理、共変微分と測地線、ガウス＝ボネの定理。

<p class="mn-msc">MSC2020: 53A05</p>

## 前提知識

- [微分幾何学 › 曲線論](../../../05-geometry-topology/04-differential-geometry/01-curves/index.html)（全体、2 ページ）：曲線の曲率とフレネ–セレの公式・ベクトル積・回転数
- [実解析 › 多変数解析](../../../04-analysis/01-real-analysis/03-multivariable-calculus/index.html)（全体、11 ページ）：連鎖律・逆関数定理・陰関数定理・微分同相写像
- [実解析 › ベクトル解析](../../../04-analysis/01-real-analysis/04-vector-analysis/index.html)（全体、4 ページ）：パラメータ曲面の面積とパラメータの取り替え
- [線形代数 › 双線形形式と内積空間](../../../02-algebra/01-linear-algebra/04-forms/index.html)（全体、3 ページ）：対称双線形形式・内積・正定値
