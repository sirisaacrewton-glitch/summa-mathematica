# 演習：曲面論 {#surf:page-exercises-surfaces keywords="exercises, surfaces, first fundamental form, Gauss curvature, mean curvature, helicoid, torus, geodesics, Gauss-Bonnet"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#surf:sec-exsurfaces-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。第一基本形式の成分を $E,F,G$、第二基本形式の成分を $L,M,N$（$f_{ij}$ と単位法ベクトル $n$ の内積）と書く。
:::

## 正則曲面と第一基本形式 {#surf:sec-rs-exercises}

対応するページ：\ref{surf:page-regular-surfaces}

::: problem ★ 基本：球面の第一基本形式 {#surf:ex-rs-1}
$f(\theta,\varphi)=(\cos\theta\cos\varphi,\cos\theta\sin\varphi,\sin\theta)$（$|\theta|<\pi/2$）について $E=1$, $F=0$, $G=\cos^{2}\theta$ を示し、$\theta_{1}\le\theta\le\theta_{2}$, $0\le\varphi\le2\pi$ の部分の面積が $2\pi(\sin\theta_{2}-\sin\theta_{1})$ であることを示せ（アルキメデス）。
:::

::: solution
$f_{\theta}=(-\sin\theta\cos\varphi,-\sin\theta\sin\varphi,\cos\theta)$, $f_{\varphi}=(-\cos\theta\sin\varphi,\cos\theta\cos\varphi,0)$ なので $E=|f_{\theta}|^{2}=1$, $F=\langle f_{\theta},f_{\varphi}\rangle=\sin\theta\cos\theta\cos\varphi\sin\varphi-\sin\theta\cos\theta\sin\varphi\cos\varphi=0$, $G=\cos^{2}\theta$。面積要素は $\sqrt{EG-F^{2}}=\cos\theta$（\ref{surf:length-angle-area}）で、面積は $\int_{0}^{2\pi}\int_{\theta_{1}}^{\theta_{2}}\cos\theta\,d\theta\,d\varphi=2\pi(\sin\theta_{2}-\sin\theta_{1})$。
:::

## ガウス写像と曲率 {#surf:sec-sf-exercises}

対応するページ：\ref{surf:page-second-fundamental-form}

::: problem ★★ 標準：常螺旋面は極小曲面 {#surf:ex-sf-1}
常螺旋面 $f(u,v)=(v\cos u,v\sin u,u)$ について、平均曲率が $H=0$、ガウス曲率が $K=-\dfrac{1}{(1+v^{2})^{2}}$ であることを示せ。
:::

::: solution
$f_{u}=(-v\sin u,v\cos u,1)$, $f_{v}=(\cos u,\sin u,0)$ で $E=1+v^{2}$, $F=0$, $G=1$。$f_{u}\times f_{v}=(-\sin u,\cos u,-v)$ なので $n=(-\sin u,\cos u,-v)/\sqrt{1+v^{2}}$。$f_{uu}=(-v\cos u,-v\sin u,0)$, $f_{uv}=(-\sin u,\cos u,0)$, $f_{vv}=0$ から
$$
L=\frac{v\sin u\cos u-v\sin u\cos u}{\sqrt{1+v^{2}}}=0,\qquad M=\frac{1}{\sqrt{1+v^{2}}},\qquad N=0.
$$
\ref{surf:curvature-formulas} から $H=\dfrac{EN-2FM+GL}{2(EG-F^{2})}=0$, $K=\dfrac{LN-M^{2}}{EG-F^{2}}=-\dfrac{1}{(1+v^{2})^{2}}$。
:::

::: problem ★★ 標準：トーラスの曲率 {#surf:ex-sf-2}
$R>r>0$ とし、母線 $\rho(t)=R+r\cos(t/r)$, $z(t)=r\sin(t/r)$ の回転面（トーラス）のガウス曲率を \ref{surf:revolution-curvature} で求め、$K>0$, $K=0$, $K<0$ となる部分を答えよ。
:::

::: solution
$\rho'=-\sin(t/r)$, $z'=\cos(t/r)$ で $\rho'^{2}+z'^{2}=1$（弧長）。$\rho''=-\cos(t/r)/r$ なので $K=-\rho''/\rho=\dfrac{\cos(t/r)}{r\bigl(R+r\cos(t/r)\bigr)}$。分母は正なので、外側（$\cos(t/r)>0$）で $K>0$、上端と下端の円（$\cos(t/r)=0$）で $K=0$、内側で $K<0$。
:::

::: problem ★★★ 発展：コンパクトな曲面には $K>0$ の点がある {#surf:ex-sf-3}
$S\subset\mathbb{R}^{3}$ をコンパクトな正則曲面とする。原点からの距離が最大になる点 $p$（$R\defeq|p|>0$）で、ガウス曲率が $K(p)\ge1/R^{2}$ であることを示せ。とくに $K>0$ となる点がある。
:::

::: solution
$p$ を含む曲面片 $f$ をとる。$S$ 上の任意の曲線 $\gamma$（弧長、$\gamma(0)=p$）について $g(s)=|\gamma(s)|^{2}$ は $s=0$ で最大なので $g'(0)=2\langle p,\gamma'(0)\rangle=0$, $g''(0)=2(1+\langle p,\gamma''(0)\rangle)\le0$。前者から $p$ は接平面に直交し、単位法ベクトルを $n(p)\defeq-p/R$ ととれる。後者から $\langle\gamma''(0),n(p)\rangle=-\langle p,\gamma''(0)\rangle/R\ge1/R$。左辺は $\gamma'(0)$ の方向の法曲率（\ref{surf:meusnier}）なので、すべての方向の法曲率が $1/R$ 以上で、オイラーの公式（\ref{surf:principal-curvatures.2}）から主曲率はともに $1/R$ 以上、$K=\kappa_{1}\kappa_{2}\ge1/R^{2}$。（$n$ の向きを逆にすると主曲率の符号は両方変わるが $K$ は変わらない。）
:::

## ガウスの驚異の定理 {#surf:sec-te-exercises}

対応するページ：\ref{surf:page-theorema-egregium}

::: problem ★★ 標準：常螺旋面と懸垂面 {#surf:ex-te-1}
常螺旋面（\ref{surf:ex-sf-1}）の $u$ を任意の実数、$v=\sinh w$ と置き換えた曲面片 $\tilde{f}(u,w)\defeq f(u,\sinh w)$ の第一基本形式が $E=\cosh^{2}w$, $F=0$, $G=\cosh^{2}w$ となることを確かめ、懸垂面 $h(\varphi,w)\defeq(\cosh w\cos\varphi,\cosh w\sin\varphi,w)$ の第一基本形式と一致することを示せ。このことと驚異の定理（\ref{surf:theorema-egregium}）から、二つの曲面の対応する点でガウス曲率が等しいことを確かめよ。
:::

::: solution
$\tilde{f}_{u}=f_{u}$, $\tilde{f}_{w}=\cosh w\,f_{v}$ なので $E=1+\sinh^{2}w=\cosh^{2}w$, $F=0$, $G=\cosh^{2}w\cdot1$。懸垂面は $h_{\varphi}=(-\cosh w\sin\varphi,\cosh w\cos\varphi,0)$, $h_{w}=(\sinh w\cos\varphi,\sinh w\sin\varphi,1)$ で $E=\cosh^{2}w$, $F=0$, $G=\sinh^{2}w+1=\cosh^{2}w$。第一基本形式の成分が同じ関数なので、驚異の定理から $K$ も同じ関数で、\ref{surf:ex-sf-1} から $K=-1/(1+\sinh^{2}w)^{2}=-1/\cosh^{4}w$。
:::

## 共変微分と測地線 {#surf:sec-gd-exercises}

対応するページ：\ref{surf:page-geodesics}

::: problem ★★ 標準：回転面の子午線は測地線 {#surf:ex-gd-1}
母線 $(\rho(t),z(t))$ が弧長で径数づけられた回転面 $f(t,\varphi)=(\rho\cos\varphi,\rho\sin\varphi,z)$ について、子午線 $t\mapsto f(t,\varphi_{0})$ は測地線であることを示せ。
:::

::: solution
$c(t)=f(t,\varphi_{0})$ は弧長で径数づけられている。$c''=(\rho''\cos\varphi_{0},\rho''\sin\varphi_{0},z'')$。接平面は $f_{t}=(\rho'\cos\varphi_{0},\rho'\sin\varphi_{0},z')$ と $f_{\varphi}=(-\rho\sin\varphi_{0},\rho\cos\varphi_{0},0)$ で張られ、$\langle c'',f_{\varphi}\rangle=0$、$\langle c'',f_{t}\rangle=\rho'\rho''+z'z''=\frac{1}{2}(\rho'^{2}+z'^{2})'=0$。よって $c''$ は法線に平行で、\ref{surf:geodesic-characterization.1} から測地線。
:::

## ガウス＝ボネの定理 {#surf:sec-gb-exercises}

対応するページ：\ref{surf:page-gauss-bonnet-local}・\ref{surf:page-gauss-bonnet-global}

::: problem ★ 基本：球面三角形の面積 {#surf:ex-gb-1}
単位球面上で、北極と赤道上の 2 点（経度の差 $\alpha$）を頂点とする測地三角形の面積を、\ref{surf:geodesic-triangle-angles} で求めよ。
:::

::: solution
赤道と経線は直交するので、赤道上の二つの内角は $\pi/2$、北極の内角は $\alpha$。$K=1$ なので面積 $A$ は $\pi/2+\pi/2+\alpha=\pi+A$ から $A=\alpha$（球面全体 $4\pi$ のうち、経度 $\alpha$ の北半球の部分 $2\pi\cdot\alpha/(2\pi)=\alpha$ と一致）。
:::

::: problem ★★ 標準：$K\le0$ のコンパクト曲面はない {#surf:ex-gb-2}
$\mathbb{R}^{3}$ のコンパクトな正則曲面で、至る所 $K\le0$ となるものはないことを示せ。また、向きのついたコンパクトな正則曲面でオイラー標数が $\chi\le0$ のもの（トーラスなど）には、$K>0$ の点と $K<0$ の点がともにあることを示せ（$\chi<0$ のとき）。
:::

::: solution
前半は \ref{surf:ex-sf-3} から（$K\ge1/R^{2}>0$ の点がある）。後半：$\chi<0$ なら \ref{surf:curvature-sign-euler.2} から $K<0$ の点があり、前半から $K>0$ の点もある。$\chi=0$ でも、\ref{surf:gauss-bonnet-global} から $\iint K\,dA=0$ で、$K>0$ の点があるので連続性から $K<0$ の点もある。
:::
