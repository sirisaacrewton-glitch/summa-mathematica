# 位相群とリー群（Topological Groups and Lie Groups）

位相群とその一様構造・距離化、リー群とリー代数、指数写像、閉部分群定理、等質空間。

<p class="mn-msc">MSC2020: 22A, 22E</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-topological-groups/index.html"><span class="mn-card-title">位相群</span><span class="mn-card-en">Topological Groups</span><span class="mn-card-desc">位相群の定義と例、単位元の近傍による記述、部分群と商空間、分離性、左一様構造と完全正則性、バーコフ–角谷の距離化定理。 群対象としての位相群・リー群、位相群の圏の極限とハウスドルフ化の随伴。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="02-lie-groups/index.html"><span class="mn-card-title">リー群</span><span class="mn-card-en">Lie Groups</span><span class="mn-card-desc">リー群の定義と古典群、左不変ベクトル場とリー環、準同型の微分、1 パラメータ部分群と指数写像、随伴表現、積公式と閉部分群定理、剰余空間の可微分構造と主束、推移的な作用と等質空間（球面・グラスマン多様体）。</span><span class="mn-card-count">6 ページ</span></a>
</div>
