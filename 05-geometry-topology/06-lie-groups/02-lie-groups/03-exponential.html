# 指数写像 {#lie:page-exponential keywords="one-parameter subgroups, left-invariant vector fields are complete, integral curves are one-parameter subgroups, exponential map of a Lie group, smoothness and d exp_0 = id, matrix exponential, naturality phi o exp = exp o phi_*, connected groups are generated by a neighbourhood of e, homomorphisms determined by their differentials, adjoint representation Ad and ad"}

リー環 $\mathfrak{g}$ の元 $X$ は、左不変ベクトル場として群全体に広がっている。その積分曲線をたどると、群の中の「まっすぐな道」、すなわち 1 パラメータ部分群 $t\mapsto\exp(tX)$ が得られる。このページでは、左不変ベクトル場がいつも完備であることを示し、**指数写像** $\exp\colon\mathfrak{g}\to G$ を定義する。$\exp$ は滑らかで $0$ の近くで微分同相写像であり、$\mathrm{GL}(n,\mathbb{R})$ では行列の指数関数 $e^{X}$ に一致する（\ref{lie:exp-gl}）。帰結として、連結なリー群は単位元の任意の近傍で生成され、連結なリー群からの準同型はリー環への微分だけで決まる（\ref{lie:homomorphism-determined}）。最後に随伴表現 $\mathrm{Ad}$ を導入する。

## 記法と定義の確認 {#lie:sec-ex-notation}

::: notation
- リー環・左不変ベクトル場 $X^{v}$・リー群の準同型とその微分 $\phi_{*}$ は \ref{lie:lie-algebra-of-group}, \ref{lie:homomorphism-differential}。以下 $\mathfrak{g}$ の元 $X$ を左不変ベクトル場とも同一視する。
- 積分曲線と流れの基本定理は \ref{mfd:integral-curve}, \ref{mfd:flow-theorem}（流れの滑らかさは常微分方程式の初期値への滑らかな依存性 \ref{ode:ck-dependence} による）。逆関数定理は \ref{mfd:inverse-function-theorem}。
- 行列の指数関数 $e^{X}=\sum X^{m}/m!$ とその性質は \ref{lin:matrix-exponential}。位相群の開部分群は閉であること・連結な群は単位元の近傍で生成されることは \ref{top:tg-subgroups}。
:::

## 1 パラメータ部分群と指数写像 {#lie:sec-ex-one-parameter}

::: definition 1 パラメータ部分群 {#lie:one-parameter-subgroup keywords="one-parameter subgroup: a smooth homomorphism R -> G" index="1 パラメータ部分群|いちぱらめーたぶぶんぐん"}
加法群 $\mathbb{R}$ からリー群 $G$ への滑らかな準同型 $c\colon\mathbb{R}\to G$ を **1 パラメータ部分群**という。
:::

::: theorem 左不変ベクトル場の積分曲線 {#lie:invariant-field-complete keywords="left-invariant vector fields are complete; the integral curve of X through e is a one-parameter subgroup; every one-parameter subgroup is the integral curve of X^{c'(0)}; the integral curve through g is g gamma" index="1 パラメータ部分群と左不変ベクトル場|いちぱらめーたぶぶんぐんとひだりふへんべくとるば"}
$X\in\mathfrak{g}$ とし、$\gamma_{X}$ を $e$ を始点とする $X$ の極大な積分曲線（\ref{mfd:flow-theorem.1}）とする。
1. $g\in G$ について $t\mapsto g\gamma_{X}(t)$ は $g$ を始点とする $X$ の積分曲線である。
2. $\gamma_{X}$ は $\mathbb{R}$ 全体で定義され、1 パラメータ部分群である。とくに $X$ は完備で、その流れは $\phi_{t}(g)=g\gamma_{X}(t)=R_{\gamma_{X}(t)}(g)$。
3. 逆に、1 パラメータ部分群 $c$ は $X\defeq c'(0)$ について $c=\gamma_{X}$ を満たす。
:::

::: proof
**1.** $\frac{d}{dt}(g\gamma_{X}(t))=d(L_{g})(\gamma_{X}'(t))=d(L_{g})(X_{\gamma_{X}(t)})=X_{g\gamma_{X}(t)}$（左不変性）。

**2.** 【主張：定義域 $I$ は $\mathbb{R}$】$\gamma_{X}$ は $(-\varepsilon,\varepsilon)$ を含む区間 $I$ で定義される。$t_{0}\in I$ について、1 から $t\mapsto\gamma_{X}(t_{0})\gamma_{X}(t)$ は $\gamma_{X}(t_{0})$ を始点とする積分曲線で、$(-\varepsilon,\varepsilon)$ で定義される。一方 $t\mapsto\gamma_{X}(t_{0}+t)$ も同じ始点の積分曲線（定義域 $I-t_{0}$）。極大な積分曲線の一意性（\ref{mfd:flow-theorem.3}：$I_{\gamma_{X}(t_{0})}=I-t_{0}$）から、$I-t_{0}\supset(-\varepsilon,\varepsilon)$、つまり $(t_{0}-\varepsilon,t_{0}+\varepsilon)\subset I$。$\varepsilon$ は $t_{0}$ によらないので、$I$ は上にも下にも有界でなく、$I=\mathbb{R}$。

【主張：準同型】$s$ を固定すると、$t\mapsto\gamma_{X}(s+t)$ と $t\mapsto\gamma_{X}(s)\gamma_{X}(t)$ はどちらも $\gamma_{X}(s)$ を始点とする積分曲線（1）なので、一意性から一致する：$\gamma_{X}(s+t)=\gamma_{X}(s)\gamma_{X}(t)$。流れの式は 1 から。

**3.** $c(t+s)=c(t)c(s)$ を $s$ で微分して $s=0$ とおくと $c'(t)=d(L_{c(t)})_{e}c'(0)=X_{c(t)}$。$c(0)=e$ なので $c$ は $e$ を始点とする積分曲線で、$\mathbb{R}$ 全体で定義されるから $\gamma_{X}$ に一致する。
:::

::: definition 指数写像 {#lie:exponential-map keywords="exponential map exp: g -> G, exp X = gamma_X(1)" index="指数写像（リー群）|しすうしゃぞうりーぐん"}
$\exp\colon\mathfrak{g}\to G$, $\exp(X)\defeq\gamma_{X}(1)$ を $G$ の**指数写像**という。
:::

::: proposition 指数写像の性質 {#lie:exponential-properties keywords="exp(tX) = gamma_X(t); exp((s+t)X) = exp(sX) exp(tX); exp is smooth; d exp_0 = id, so exp is a diffeomorphism near 0" index="指数写像の性質（リー群）|しすうしゃぞうのせいしつりーぐん"}
1. $\exp(tX)=\gamma_{X}(t)$。とくに $\exp((s+t)X)=\exp(sX)\exp(tX)$、$\exp(-X)=\exp(X)^{-1}$。
2. $\exp$ は滑らかで、$d\exp_{0}=\mathrm{id}_{\mathfrak{g}}$（$T_{0}\mathfrak{g}=\mathfrak{g}$）。
3. $0$ の開近傍 $U$ で、$\exp\restriction U$ が $e$ の開近傍への微分同相写像になるものがある。
:::

::: proof
**1.** $s$ を固定すると $t\mapsto\gamma_{X}(st)$ は、$\frac{d}{dt}\gamma_{X}(st)=sX_{\gamma_{X}(st)}=(sX)_{\gamma_{X}(st)}$ なので $sX$ の $e$ を始点とする積分曲線で、$\gamma_{sX}(t)=\gamma_{X}(st)$。$t=1$ として $\exp(sX)=\gamma_{X}(s)$。後半は \ref{lie:invariant-field-complete.2}。

**2.** $G\times\mathfrak{g}$ 上のベクトル場 $\mathcal{V}_{(g,X)}\defeq(X_{g},0)$ を考える（$X_{g}=d(L_{g})_{e}X$ は \ref{lie:lie-algebra-of-group.1} の証明と同じく $(g,X)$ について滑らか）。その積分曲線は $t\mapsto(g\gamma_{X}(t),X)$ で、$\mathbb{R}$ 全体で定義される。流れ $\Theta$ は滑らかなので（\ref{mfd:flow-theorem.2}）、$\exp(X)=\mathrm{pr}_{G}\Theta_{1}(e,X)$ は滑らか。$d\exp_{0}(X)=\frac{d}{dt}\exp(tX)|_{t=0}=\gamma_{X}'(0)=X$（1 を使った）。

**3.** 2 と逆関数定理。
:::

::: theorem GL(n) の指数写像 {#lie:exp-gl keywords="for GL(n,R) the exponential map is the matrix exponential; for a Lie subgroup H of GL(n), h = {X : e^{tX} in H for all t}" index="行列の指数写像|ぎょうれつのしすうしゃぞう"}
$G=\mathrm{GL}(n,\mathbb{R})$ では $\exp(X)=e^{X}$（行列の指数関数）である。
:::

::: proof
$c(t)\defeq e^{tX}$ は可逆で（\ref{lin:matrix-exponential.3}）、$tX$ と $sX$ は可換なので $c(s+t)=c(s)c(t)$。成分はべき級数なので滑らかで、$c'(0)=X$（\ref{lin:matrix-exponential.5}）。よって $c$ は 1 パラメータ部分群で、\ref{lie:invariant-field-complete.3} から $c=\gamma_{X}$、$\exp(X)=c(1)=e^{X}$。
:::

## 自然性と生成 {#lie:sec-ex-naturality}

::: proposition 指数写像の自然性 {#lie:exp-natural keywords="for a Lie group homomorphism phi, phi(exp X) = exp(phi_* X); for a Lie subgroup H of G, exp_H is the restriction of exp_G" index="指数写像の自然性|しすうしゃぞうのしぜんせい"}
リー群の準同型 $\phi\colon G\to H$ と $X\in\mathfrak{g}$ について $\phi(\exp X)=\exp(\phi_{*}X)$。とくに、部分群かつ部分多様体 $H\subset G$ について、$H$ の指数写像は $G$ の指数写像の $\mathfrak{h}$ への制限である。
:::

::: proof
$t\mapsto\phi(\exp(tX))$ は滑らかな準同型の合成で 1 パラメータ部分群、$t=0$ での微分は $\phi_{*}X$。\ref{lie:invariant-field-complete.3} から $\phi(\exp(tX))=\exp(t\phi_{*}X)$。後半は包含写像に適用する。
:::

これと \ref{lie:exp-gl} から、$\mathrm{GL}(n,\mathbb{R})$ の部分群かつ部分多様体（$\mathrm{SL}(n)$, $\mathrm{O}(n)$ など）の指数写像も行列の指数関数である。たとえば $X\in\mathfrak{so}(n)$ なら $e^{X}\in\mathrm{SO}(n)$。

::: theorem 連結なリー群と準同型 {#lie:homomorphism-determined keywords="a connected Lie group is generated by exp(U) for any neighbourhood U of 0; two homomorphisms from a connected Lie group with the same differential at e are equal" index="連結なリー群の生成|れんけつなりーぐんのせいせい"}
$G$ を連結なリー群とする。
1. $\mathfrak{g}$ の $0$ の任意の近傍 $U$ について、$\exp(U)$ は $G$ を生成する。
2. リー群の準同型 $\phi,\psi\colon G\to H$ について $\phi_{*}=\psi_{*}$ なら $\phi=\psi$。
:::

::: proof
**1.** \ref{lie:exponential-properties.3} から、$\exp(U)$ は $e$ の開近傍を含む。連結な位相群は単位元の任意の近傍で生成される（\ref{top:tg-subgroups.3}）。

**2.** \ref{lie:exp-natural} から $\phi(\exp X)=\exp(\phi_{*}X)=\exp(\psi_{*}X)=\psi(\exp X)$。$\phi,\psi$ は準同型なので、$\exp(\mathfrak{g})$ で生成される部分群の上で一致し、1 からそれは $G$ 全体。
:::

::: definition 随伴表現 {#lie:adjoint-representation keywords="conjugation C_g(h) = g h g^{-1}; adjoint representation Ad(g) = (C_g)_*; g exp(X) g^{-1} = exp(Ad(g) X); for GL(n), Ad(g) X = g X g^{-1}; ad = Ad_*, ad(X) Y = [X, Y]" index="随伴表現|ずいはんひょうげん, Ad|あど, ad|あど（小文字）"}
$g\in G$ について $C_{g}(h)\defeq ghg^{-1}$ はリー群の自己同型で、$\mathrm{Ad}(g)\defeq(C_{g})_{*}\in\mathrm{GL}(\mathfrak{g})$ と定める。$\mathrm{Ad}\colon G\to\mathrm{GL}(\mathfrak{g})$ を**随伴表現**という。
:::

::: proposition 随伴表現の性質 {#lie:adjoint-properties keywords="Ad is a Lie group homomorphism; g exp(X) g^{-1} = exp(Ad(g)X); Ad(g) is a Lie algebra automorphism; for matrix groups Ad(g)X = gXg^{-1} and d Ad_e(X) = ad X = [X, .]" index="随伴表現の性質|ずいはんひょうげんのせいしつ"}
1. $\mathrm{Ad}(gh)=\mathrm{Ad}(g)\mathrm{Ad}(h)$、各 $\mathrm{Ad}(g)$ はリー環の自己同型、$g\exp(X)g^{-1}=\exp(\mathrm{Ad}(g)X)$。
2. $G\subset\mathrm{GL}(n,\mathbb{R})$ が部分群かつ部分多様体なら $\mathrm{Ad}(g)X=gXg^{-1}$。$t\mapsto\mathrm{Ad}(\exp tX)Y$ の $t=0$ での微分は $XY-YX=[X,Y]$。
:::

::: proof
**1.** $C_{gh}=C_{g}\circ C_{h}$ と連鎖律。自己同型は \ref{lie:homomorphism-differential.1}（逆は $\mathrm{Ad}(g^{-1})$）。最後は \ref{lie:exp-natural} を $C_{g}$ に使う。

**2.** $C_{g}$ は線形写像 $X\mapsto gXg^{-1}$ の制限なので、その微分も同じ式。$\mathrm{Ad}(e^{tX})Y=e^{tX}Ye^{-tX}$ を積の微分で $t=0$ において微分すると $XY-YX$（\ref{lin:matrix-exponential.5}）。
:::

一般のリー群でも、$\mathrm{Ad}$ は滑らかなリー群の準同型 $G\to\mathrm{GL}(\mathfrak{g})$ で、その微分 $\mathrm{ad}\defeq\mathrm{Ad}_{*}\colon\mathfrak{g}\to\mathfrak{gl}(\mathfrak{g})$ は $\mathrm{ad}(X)Y=[X,Y]$ を満たすことが知られている（2 は行列群の場合の証明）。

::: supplement
**高い視点：リー群の指数写像とリーマン幾何の指数写像.** 両側不変なリーマン計量をもつリー群（たとえばコンパクトなリー群には、計量を群で平均して作れる）では、単位元を通る測地線はちょうど 1 パラメータ部分群で、リー群の指数写像はリーマン幾何の指数写像 $\exp_{e}$（\ref{riem:exponential-map}）に一致することが知られている。一方、$\mathrm{SL}(2,\mathbb{R})$ のように両側不変な正定値計量をもたない群では、$\exp$ は全射でない（$\begin{pmatrix}-1&1\\0&-1\end{pmatrix}$ は $\exp$ の像にない）。比喩で言えば、リー環の元は「一定の速度で、一定のハンドルの切り方で進む」指示で、指数写像はその指示に 1 単位時間従ったときの到着点である。群の構造があるおかげで、どこから出発しても同じ指示は同じ形の道を与える（左移動）。
:::

## 問題 {#lie:sec-ex-problems}

::: problem {#lie:prob-ex-so2}
$\mathfrak{so}(2)$ の元 $X=\begin{pmatrix}0&-\theta\\\theta&0\end{pmatrix}$ について $e^{X}$ を求め、$\exp\colon\mathfrak{so}(2)\to\mathrm{SO}(2)$ が全射な準同型で、核が $2\pi\mathbb{Z}$（$\theta$ について）であることを示せ。
:::

::: solution
$J\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ は $J^{2}=-I$ なので、級数を偶数次と奇数次に分けて $e^{\theta J}=\cos\theta\,I+\sin\theta\,J$。$\mathfrak{so}(2)$ は 1 次元で可換なので $\exp$ は準同型（\ref{lin:matrix-exponential.3}）。$\mathrm{SO}(2)$ の元は $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$, $a^{2}+b^{2}=1$ の形（列が正規直交で行列式 $1$）なので、$a=\cos\theta$, $b=\sin\theta$ となる $\theta$ をとれば全射。核は $\cos\theta=1$, $\sin\theta=0$、つまり $\theta\in2\pi\mathbb{Z}$。
:::

::: problem {#lie:prob-ex-sl2-not-surjective}
$\mathrm{SL}(2,\mathbb{R})$ で、$A=\begin{pmatrix}-1&1\\0&-1\end{pmatrix}$ は $\exp(\mathfrak{sl}(2,\mathbb{R}))$ に属さないことを示せ。（ヒント：$X\in\mathfrak{sl}(2)$ の固有値は $\pm\lambda$（$\lambda\in\mathbb{R}$ または $i\mathbb{R}$）で、$e^{X}$ のトレースは $e^{\lambda}+e^{-\lambda}$ または $2\cos|\lambda|$。）
:::

::: solution
$\operatorname{tr}X=0$ なので固有値は $\pm\lambda$, $\lambda^{2}=-\det X\in\mathbb{R}$。$\lambda\neq0$ なら $X$ は対角化可能（固有値が異なる）で、$e^{X}$ の固有値は $e^{\pm\lambda}$（\ref{lin:matrix-exponential.2}）。$\lambda$ が実数なら $\operatorname{tr}e^{X}=e^{\lambda}+e^{-\lambda}\ge2$、純虚数 $\lambda=i\mu$ なら $\operatorname{tr}e^{X}=2\cos\mu$ で、$=-2$ となるのは $e^{X}=e^{i\mu}I$ 型（固有値がともに $-1$ で対角化可能）なので $e^{X}=-I$。$\lambda=0$ なら $X$ はべき零で $X^{2}=0$、$e^{X}=I+X$ のトレースは $2$。$A$ はトレース $-2$ で $A\neq-I$ なので、どの場合にも当てはまらない。
:::
