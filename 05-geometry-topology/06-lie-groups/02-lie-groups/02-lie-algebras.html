# リー群とリー環 {#lie:page-lie-algebras keywords="Lie group examples SL(n), U(n), SU(n), Sp(2n), tori, left translation, left-invariant vector fields, Lie algebra of a Lie group, isomorphism with the tangent space at the identity, F-related vector fields, Lie algebra of GL(n) is gl(n) with the commutator, differential of a homomorphism is a Lie algebra homomorphism, Lie algebras of matrix groups"}

リー群は、群であって同時に可微分多様体であり、演算が滑らかなものである（\ref{lie:lie-group}。圏論的には可微分多様体の圏の群対象 \ref{top:group-object-examples}）。群の構造があるので、単位元の近くの情報を左移動で全体に運べる。そのため、単位元での接空間 $T_{e}G$ が群全体の「無限小の姿」を担う。このページでは、左移動で不変なベクトル場の空間がリー括弧で閉じ、$T_{e}G$ と同一視されることを示し、これを $G$ の**リー環**と定める。$\mathrm{GL}(n,\mathbb{R})$ のリー環は行列の交換子 $AB-BA$ をもつ $M_{n}(\mathbb{R})$ であり（\ref{lie:gl-lie-algebra}）、リー群の準同型の微分はリー環の準同型になる（\ref{lie:homomorphism-differential}）。

## 記法と定義の確認 {#lie:sec-la-notation}

::: notation
- リー群・滑らかな作用の定義、行列群と古典群がリー群であることは \ref{lie:lie-group}, \ref{lie:matrix-lie-groups}, \ref{lie:classical-groups}。
- ベクトル場・導分・リー括弧とその性質は \ref{mfd:vector-field}, \ref{mfd:vector-field-derivation}, \ref{mfd:lie-bracket}, \ref{mfd:lie-bracket-properties}。部分多様体は \ref{mfd:submanifold-structure}、さらに \ref{mfd:regular-value-theorem}。
- $L_{g}(h)\defeq gh$（**左移動**）、$R_{g}(h)\defeq hg$。どちらも微分同相写像（逆は $L_{g^{-1}}$, $R_{g^{-1}}$）。
- **リー環**とは、実ベクトル空間 $\mathfrak{g}$ と双線形写像 $[\ ,\ ]\colon\mathfrak{g}\times\mathfrak{g}\to\mathfrak{g}$ で、交代的（$[X,X]=0$）かつヤコビ恒等式を満たすものをいう。
- $\mathrm{GL}(n,\mathbb{R})$ は $M_{n}(\mathbb{R})=\mathbb{R}^{n^{2}}$ の開集合なので、各点の接空間を $M_{n}(\mathbb{R})$ と同一視する。
:::

## 左不変ベクトル場とリー環 {#lie:sec-la-invariant}

::: definition 左不変ベクトル場 {#lie:left-invariant-field keywords="left-invariant vector field: d(L_g)_h X_h = X_{gh}; the space L(G) of left-invariant vector fields" index="左不変ベクトル場|ひだりふへんべくとるば"}
リー群 $G$ 上のベクトル場 $X$ が、すべての $g,h\in G$ について $d(L_{g})_{h}(X_{h})=X_{gh}$ を満たすとき、**左不変**という。その全体を $\mathfrak{L}(G)$ と書く。
:::

::: lemma 関係するベクトル場とリー括弧 {#lie:related-fields keywords="F-related vector fields: dF o X = Y o F; brackets of F-related fields are F-related" index="関係するベクトル場|かんけいするべくとるば, F 関係|えふかんけい"}
$F\colon M\to N$ を滑らかな写像とし、$X\in\mathfrak{X}(M)$, $Y\in\mathfrak{X}(N)$ が $dF_{m}(X_{m})=Y_{F(m)}$（すべての $m$）を満たすとき、$X$ と $Y$ は **$F$ 関係**にあるという。$X_{i}$ と $Y_{i}$（$i=1,2$）が $F$ 関係にあれば、$[X_{1},X_{2}]$ と $[Y_{1},Y_{2}]$ も $F$ 関係にある。
:::

::: proof
$g\in C^{\infty}(N)$ について、$X(g\circ F)(m)=dF_{m}(X_{m})g=Y_{F(m)}g$、つまり $X(g\circ F)=(Yg)\circ F$。これを二回使うと $X_{1}X_{2}(g\circ F)=X_{1}((Y_{2}g)\circ F)=(Y_{1}Y_{2}g)\circ F$。入れ替えて引けば $[X_{1},X_{2}](g\circ F)=([Y_{1},Y_{2}]g)\circ F$。左辺の $m$ での値は $dF_{m}([X_{1},X_{2}]_{m})g$、右辺は $[Y_{1},Y_{2}]_{F(m)}g$。$g$ は任意なので（$F(m)$ の近くの関数は隆起関数で $N$ 全体に延ばせる）、二つの接ベクトルは一致する。
:::

::: theorem リー群のリー環 {#lie:lie-algebra-of-group keywords="left-invariant vector fields form a Lie subalgebra of X(G); X -> X_e is a linear isomorphism L(G) -> T_eG, inverse v -> X^v with X^v_g = d(L_g)_e v; Lie algebra g of G; dim g = dim G" index="リー環（リー群の）|りーかんりーぐんの, リー代数|りーだいすう"}
$G$ をリー群とする。
1. $v\in T_{e}G$ について $X^{v}_{g}\defeq d(L_{g})_{e}(v)$ は滑らかな左不変ベクトル場で、$v\mapsto X^{v}$ と $X\mapsto X_{e}$ は $T_{e}G$ と $\mathfrak{L}(G)$ の間の互いに逆な線形同型である。
2. $X,Y\in\mathfrak{L}(G)$ なら $[X,Y]\in\mathfrak{L}(G)$。
3. したがって、$T_{e}G$ に $[v,w]\defeq[X^{v},X^{w}]_{e}$ と括弧を入れたものはリー環で、これを $G$ の**リー環**といい $\mathfrak{g}$ と書く（$\dim\mathfrak{g}=\dim G$）。
:::

::: proof
**1.** 左不変性：連鎖律と $L_{g}\circ L_{h}=L_{gh}$ から $d(L_{g})_{h}(X^{v}_{h})=d(L_{g})_{h}d(L_{h})_{e}v=d(L_{gh})_{e}v=X^{v}_{gh}$。【主張：$X^{v}$ は滑らか】積 $\mu\colon G\times G\to G$ について $L_{g}=\mu(g,\cdot)$ なので、$X^{v}_{g}=d\mu_{(g,e)}(0_{g},v)$（$T_{(g,e)}(G\times G)=T_{g}G\oplus T_{e}G$）。$g\mapsto(0_{g},v)\in T(G\times G)$ は滑らかで、$d\mu\colon T(G\times G)\to TG$ は滑らか（\ref{mfd:tangent-map}）なので、合成 $g\mapsto X^{v}_{g}$ は滑らか。$(X^{v})_{e}=v$。逆に左不変な $X$ は $X_{g}=d(L_{g})_{e}X_{e}=X^{X_{e}}_{g}$ なので $X=X^{X_{e}}$。線形性は明らか。

**2.** 左不変性は「各 $g$ について、$X$ と $X$ が $L_{g}$ 関係にある」ことと同じなので、\ref{lie:related-fields} から $[X,Y]$ と $[X,Y]$ も $L_{g}$ 関係にある。

**3.** ベクトル場のリー括弧は双線形・交代的でヤコビ恒等式を満たす（\ref{mfd:lie-bracket-properties}）ので、その部分空間 $\mathfrak{L}(G)$ もリー環で、1 の同型で $T_{e}G$ に移す。
:::

::: theorem GL(n) のリー環 {#lie:gl-lie-algebra keywords="left-invariant vector fields on GL(n,R) are X^A(g) = gA; the Lie algebra of GL(n,R) is gl(n,R) = M_n(R) with [A,B] = AB - BA" index="一般線形リー環|いっぱんせんけいりーかん, gl(n)|じーえるえぬ"}
$G=\mathrm{GL}(n,\mathbb{R})$ について、$T_{e}G=M_{n}(\mathbb{R})$ と同一視すると、$X^{A}_{g}=gA$ で、リー環の括弧は $[A,B]=AB-BA$ である。このリー環を $\mathfrak{gl}(n,\mathbb{R})$ と書く。
:::

::: proof
**Step 1（左不変ベクトル場）.** $L_{g}$ は線形写像 $h\mapsto gh$ の制限なので、その微分は $H\mapsto gH$。よって $X^{A}_{g}=gA$。

**Step 2（開集合上のベクトル場の括弧）.** 【主張：$\mathbb{R}^{N}$ の開集合上のベクトル場 $V,W$（$\mathbb{R}^{N}$ 値の関数とみる）について $[V,W]=DW\cdot V-DV\cdot W$】リー括弧の座標表示 $[V,W]=\sum_{j}(VW^{j}-WV^{j})\partial_{j}$（\ref{mfd:lie-bracket}）で、$VW^{j}=\sum_{i}V^{i}\partial_{i}W^{j}=(DW\cdot V)^{j}$。

**Step 3.** $X^{B}(g)=gB$ は $g$ について線形なので $DX^{B}_{g}(H)=HB$。Step 2 から $[X^{A},X^{B}]_{g}=DX^{B}_{g}(X^{A}_{g})-DX^{A}_{g}(X^{B}_{g})=gAB-gBA$。$g=e$ で $AB-BA$。
:::

## 準同型と部分群 {#lie:sec-la-homomorphisms}

::: theorem 準同型の微分はリー環の準同型 {#lie:homomorphism-differential keywords="for a Lie group homomorphism phi: G -> H, X^v and X^{d phi v} are phi-related, so d phi_e: g -> h is a Lie algebra homomorphism; for an embedded Lie subgroup, T_eH is a Lie subalgebra" index="リー群の準同型|りーぐんのじゅんどうけい, リー環の準同型|りーかんのじゅんどうけい, リー部分環|りーぶぶんかん"}
1. 滑らかな群準同型 $\phi\colon G\to H$（**リー群の準同型**）について、$\phi_{*}\defeq d\phi_{e}\colon\mathfrak{g}\to\mathfrak{h}$ はリー環の準同型である：$\phi_{*}[v,w]=[\phi_{*}v,\phi_{*}w]$。
2. リー群 $G$ の部分群 $H$ が部分多様体なら、$H$ は部分多様体の構造でリー群で、$T_{e}H\subset\mathfrak{g}$ は括弧で閉じた部分空間（**リー部分環**）であり、$H$ のリー環と一致する。
:::

::: proof
**1.** 準同型なので $\phi\circ L_{g}=L_{\phi(g)}\circ\phi$。微分すると $d\phi_{g}(X^{v}_{g})=d\phi_{g}d(L_{g})_{e}v=d(L_{\phi(g)})_{e}d\phi_{e}v=X^{\phi_{*}v}_{\phi(g)}$。つまり $X^{v}$ と $X^{\phi_{*}v}$ は $\phi$ 関係にある。\ref{lie:related-fields} から $[X^{v},X^{w}]$ と $[X^{\phi_{*}v},X^{\phi_{*}w}]$ も $\phi$ 関係にあり、$e$ で評価すると $\phi_{*}[v,w]=[\phi_{*}v,\phi_{*}w]$。

**2.** リー群であることは \ref{lie:matrix-lie-groups.2} と同じ証明（包含写像は滑らかで、\ref{mfd:submanifold-structure.3} で値域を $H$ に制限する）。包含写像 $\iota$ はリー群の準同型で、$d\iota_{e}$ は単射（埋め込み）なので、1 から $T_{e}H=d\iota_{e}(\mathfrak{h})$ は括弧で閉じ、$\mathfrak{h}$ と同型。
:::

::: example 古典群のリー環 {#lie:classical-lie-algebras keywords="sl(n) = trace zero matrices, o(n) = so(n) = skew-symmetric, u(n) = skew-Hermitian, su(n), sp(2n) = {X : X^T Omega + Omega X = 0}" index="特殊線形リー環|とくしゅせんけいりーかん, 直交リー環|ちょっこうりーかん, ユニタリリー環|ゆにたりりーかん"}
$\mathfrak{gl}(n,\mathbb{R})$ の部分リー環として
1. $\mathfrak{sl}(n,\mathbb{R})=\{X:\operatorname{tr}X=0\}$。
2. $\mathfrak{o}(n)=\mathfrak{so}(n)=\{X:X^{\mathsf{T}}=-X\}$。
3. $\mathfrak{u}(n)=\{X\in M_{n}(\mathbb{C}):X^{*}=-X\}$, $\mathfrak{su}(n)=\mathfrak{u}(n)\cap\{\operatorname{tr}=0\}$。
4. $\mathfrak{sp}(2n,\mathbb{R})=\{X:X^{\mathsf{T}}\Omega+\Omega X=0\}$。
:::

::: proof
\ref{mfd:regular-value-theorem} の $T_{p}S=\ker dF_{p}$を単位元 $I$ で使う。1：$d\det_{I}(H)=\operatorname{tr}H$。2：$d\Phi_{I}(H)=H+H^{\mathsf{T}}$（\ref{lie:matrix-lie-groups.3} の $\Phi$）、$\mathrm{SO}(n)$ は $\mathrm{O}(n)$ の開集合なので同じ接空間。3：同様に $H+H^{*}$、$\mathrm{SU}(n)$ では $\det$ の微分 $\operatorname{tr}$ の核と交わる。4：$d\Psi_{I}(H)=H^{\mathsf{T}}\Omega+\Omega H$。次元は \ref{lie:classical-groups} と一致する。括弧で閉じることは \ref{lie:homomorphism-differential.2} から（直接にも確かめられる：たとえば $X,Y$ が交代行列なら $(XY-YX)^{\mathsf{T}}=YX-XY$）。
:::

::: supplement
**高い視点：リー環は群の「1 次の近似」、そして関手.** $G\mapsto\mathfrak{g}$, $\phi\mapsto\phi_{*}$ は、リー群の圏からリー環の圏への関手である（連鎖律が関手性 $(\psi\circ\phi)_{*}=\psi_{*}\circ\phi_{*}$）。リー環の括弧は群の非可換性の 2 次の効果を測る：交換子 $ghg^{-1}h^{-1}$ を $g=\exp(sX)$, $h=\exp(tY)$ で展開すると、$e+st[X,Y]+\cdots$ になる（指数写像を扱った後で確かめられる）。リーの第三定理によれば、有限次元の実リー環はすべて、ある単連結リー群のリー環であり、単連結なリー群の圏と有限次元リー環の圏はこの関手で圏同値になることが知られている。比喩で言えば、リー環は群の「設計図の 1 ページ目」で、単連結性という条件のもとでは、その 1 ページから群全体が復元できる。
:::

## 問題 {#lie:sec-la-problems}

::: problem {#lie:prob-la-right-invariant}
右不変ベクトル場（$d(R_{g})_{h}(Y_{h})=Y_{hg}$）の空間も $T_{e}G$ と同型なリー環になる。$\mathrm{GL}(n,\mathbb{R})$ で右不変ベクトル場 $Y^{A}_{g}=Ag$ の括弧を計算し、$[Y^{A},Y^{B}]=Y^{BA-AB}$ となること、つまり右不変ベクトル場からは逆の符号の括弧が得られることを示せ。
:::

::: solution
$DY^{B}_{g}(H)=BH$。\ref{lie:gl-lie-algebra} の Step 2 から $[Y^{A},Y^{B}]_{g}=DY^{B}(Y^{A})-DY^{A}(Y^{B})=BAg-ABg=Y^{BA-AB}_{g}$。
:::

::: problem {#lie:prob-la-so3}
$\mathfrak{so}(3)$ の基底 $E_{1}=e_{3}e_{2}^{\mathsf{T}}-e_{2}e_{3}^{\mathsf{T}}$, $E_{2}=e_{1}e_{3}^{\mathsf{T}}-e_{3}e_{1}^{\mathsf{T}}$, $E_{3}=e_{2}e_{1}^{\mathsf{T}}-e_{1}e_{2}^{\mathsf{T}}$ について $[E_{1},E_{2}]=E_{3}$ を示し、$v\mapsto\sum v_{i}E_{i}$ が $(\mathbb{R}^{3},\times)$（ベクトル積）から $\mathfrak{so}(3)$ へのリー環の同型であることを確かめよ。
:::

::: solution
$E_{i}w=e_{i}\times w$ であることを確かめる（たとえば $E_{3}w=e_{2}w_{1}-e_{1}w_{2}=(-w_{2},w_{1},0)=e_{3}\times w$）。すると $[E_{i},E_{j}]w=e_{i}\times(e_{j}\times w)-e_{j}\times(e_{i}\times w)=(e_{i}\times e_{j})\times w$（ベクトル積のヤコビ恒等式）。$e_{1}\times e_{2}=e_{3}$ なので $[E_{1},E_{2}]=E_{3}$。一般に $\sum v_{i}E_{i}=(v\times\cdot)$ で、上の式から括弧は $v\times w$ に対応する。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lie:sec-lgl-exercises} にまとめた。
