# リー群（Lie Groups）

リー群の定義と古典群、左不変ベクトル場とリー環、準同型の微分、1 パラメータ部分群と指数写像、随伴表現、積公式と閉部分群定理、剰余空間の可微分構造と主束、推移的な作用と等質空間（球面・グラスマン多様体）。

<p class="mn-msc">MSC2020: 22E10, 22E15, 22E60, 57S25</p>

## 前提知識

- [位相群とリー群 › 位相群](../../../05-geometry-topology/06-lie-groups/01-topological-groups/index.html)（全体、3 ページ）：位相群・開部分群・剰余空間
- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：接束とベクトル場・リー括弧・流れ・部分多様体と正則値定理・サードの定理
- [多様体論 › ファイバー束](../../../05-geometry-topology/04-manifolds/03-fiber-bundles/index.html)（全体、5 ページ）：主束（§5 の剰余空間）
- [線形代数 › 固有値とジョルダン標準形](../../../02-algebra/01-linear-algebra/03-eigen/index.html)（全体、4 ページ）：行列の指数関数
