# 等質空間 {#lie:page-homogeneous-spaces keywords="coset manifold G/H for a closed subgroup, smooth structure, the projection is a submersion with local sections, smooth action of G on G/H, G -> G/H is a principal H-bundle, homogeneous spaces, equivariant bijection G/H -> M is a diffeomorphism (via Sard), spheres SO(n)/SO(n-1), Grassmannians, projective spaces"}

閉部分群 $H\subset G$ による剰余類の集合 $G/H$ は、位相空間としてはすでに扱った（\ref{top:tg-quotient}）。このページでは、$G/H$ にただ一つの可微分多様体の構造が入り、射影 $\pi\colon G\to G/H$ が沈め込みで、$G$ が $G/H$ に滑らかに作用することを示す（\ref{lie:coset-manifold}）。さらに $\pi$ は、右からの $H$ の作用によって**主 $H$ 束**になる（\ref{lie:coset-principal-bundle}）。リー群が多様体 $M$ に推移的に作用するとき、$M$ は等方部分群による剰余空間 $G/H$ と微分同相になる（\ref{lie:homogeneous-diffeo}）。その証明ではサードの定理を使う。例として、球面 $S^{n-1}=\mathrm{SO}(n)/\mathrm{SO}(n-1)$ と、グラスマン多様体を扱う。

## 記法と定義の確認 {#lie:sec-hs-notation}

::: notation
- 閉部分群定理とその証明の記号 $\mathfrak{m}=\mathfrak{h}^{\perp}$, $\Phi(Y,X)=\exp(Y)\exp(X)$, $W_{\mathfrak{m}}$, $W_{\mathfrak{h}}$, $U=\Phi(W_{\mathfrak{m}}\times W_{\mathfrak{h}})$ と、$U\cap H=\exp(W_{\mathfrak{h}})$ は \ref{lie:closed-subgroup-theorem}。
- 剰余空間 $G/H$ の商位相、$\pi$ が開写像であること、$H$ が閉なら $G/H$ がハウスドルフであることは \ref{top:tg-quotient}。
- 主束は \ref{mfd:principal-bundle}、$G$ 束と推移関数は \ref{mfd:g-bundle}。\ref{mfd:sard}, \ref{mfd:regular-value-theorem}。
:::

## 剰余空間の多様体の構造 {#lie:sec-hs-coset}

::: theorem 剰余空間の可微分構造 {#lie:coset-manifold keywords="for a closed subgroup H of a Lie group G, G/H has a unique smooth structure such that pi: G -> G/H is a smooth submersion; dim G/H = dim G - dim H; the action G x G/H -> G/H is smooth; pi has smooth local sections" index="剰余多様体|じょうよたようたい, 等質空間|とうしつくうかん"}
$H$ をリー群 $G$ の閉部分群とする。
1. $G/H$ には、$\pi\colon G\to G/H$ が滑らかな沈め込みになる可微分多様体の構造がただ一つあり、$\dim G/H=\dim G-\dim H$。
2. 各点 $q\in G/H$ のまわりに、$\pi$ の滑らかな局所切断（$\pi\circ s=\mathrm{id}$）がある。
3. 作用 $G\times G/H\to G/H$, $(a,gH)\mapsto agH$ は滑らかである。
:::

::: proof
**Step 1（小さな横断面）.** $\mathfrak{m}$ の $0$ の開近傍 $W'\subset W_{\mathfrak{m}}$ を、$Y,Y'\in W'$ なら $\exp(-Y')\exp(Y)\in U$ となるようにとる（$(Y,Y')\mapsto\exp(-Y')\exp(Y)$ は連続で $(0,0)$ で $e\in U$）。【主張：$Y\mapsto\pi(\exp Y)$ は $W'$ の上で単射】$\exp(Y)H=\exp(Y')H$ なら $h\defeq\exp(-Y')\exp(Y)\in U\cap H=\exp(W_{\mathfrak{h}})$ なので $h=\exp X$（$X\in W_{\mathfrak{h}}$）で、$\Phi(Y,0)=\exp(Y)=\exp(Y')\exp(X)=\Phi(Y',X)$。$\Phi$ の単射性から $Y=Y'$。

**Step 2（座標近傍）.** $g\in G$ について $V_{g}\defeq\pi(g\exp(W'))$、$\sigma_{g}\colon W'\to V_{g}$, $Y\mapsto\pi(g\exp Y)$ とする。$\sigma_{g}$ は Step 1 から全単射（左移動 $L_{g}$ は剰余類を剰余類に移す全単射）。$V_{g}=\pi(g\Phi(W'\times W_{\mathfrak{h}}))$（$\exp(W_{\mathfrak{h}})\subset H$）で、$g\Phi(W'\times W_{\mathfrak{h}})$ は開集合、$\pi$ は開写像なので $V_{g}$ は開集合。$\sigma_{g}$ は連続写像の合成で連続。逆写像 $\psi_{g}\defeq\sigma_{g}^{-1}$ の連続性：$O_{g}\defeq g\Phi(W'\times W_{\mathfrak{h}})$ の上で、$x=g\exp(Y)\exp(X)\mapsto Y$ は $\mathrm{pr}_{\mathfrak{m}}\circ\Phi^{-1}\circ L_{g^{-1}}$ で連続で、$\psi_{g}\circ\pi\restriction O_{g}$ に等しい。$\pi\restriction O_{g}\colon O_{g}\to V_{g}$ は開写像な連続全射なので商写像で、$\psi_{g}$ は連続。よって $(V_{g},\psi_{g})$（$\mathfrak{m}\cong\mathbb{R}^{d-k}$）は $G/H$ の座標近傍の候補。

**Step 3（座標変換）.** $q_{0}\in V_{g}\cap V_{g'}$ をとり、$q_{0}=\pi(g\exp Y_{0})=\pi(g'\exp Y'_{0})$, $g\exp Y_{0}=g'\exp(Y'_{0})h_{0}$（$h_{0}\in H$）とする。$Y$ が $Y_{0}$ に近ければ $g\exp(Y)h_{0}^{-1}$ は $g'\exp(Y'_{0})$ に近く、開集合 $O_{g'}$ に入る。そのとき $g\exp(Y)h_{0}^{-1}=g'\exp(Y')\exp(X)$ と書け、$\pi(g\exp Y)=\pi(g'\exp Y')$ なので
$$
\psi_{g'}\circ\sigma_{g}(Y)=\mathrm{pr}_{\mathfrak{m}}\,\Phi^{-1}\bigl(g'^{-1}g\exp(Y)h_{0}^{-1}\bigr),
$$
これは $Y$ について滑らか。よって座標変換は滑らか。

**Step 4（多様体であること）.** $G/H$ はハウスドルフ（\ref{top:tg-quotient.2}、$H$ は閉）。$G$ の可算な開基の $\pi$ による像は、$\pi$ が開写像なので $G/H$ の開基で可算。Step 2・3 から $\{(V_{g},\psi_{g})\}_{g\in G}$ はアトラスで、$G/H$ は $\dim\mathfrak{m}=\dim G-\dim H$ 次元の可微分多様体。

**Step 5（沈め込みと切断）.** $O_{g}$ の上で、座標 $\Phi^{-1}\circ L_{g^{-1}}$ と $\psi_{g}$ で見た $\pi$ は $(Y,X)\mapsto Y$ で、滑らかな沈め込み。$s_{g}\defeq L_{g}\circ\exp\circ\psi_{g}\colon V_{g}\to G$ は滑らかな局所切断（$\pi(g\exp\psi_{g}(q))=q$）。一意性：別の構造 $\mathcal{A}'$ でも $\pi$ が滑らかな沈め込みだとする。恒等写像 $(G/H,\mathcal{A})\to(G/H,\mathcal{A}')$ は、$V_{g}$ の上で $\pi\circ s_{g}$ と書けるので滑らか。逆向きも、$\mathcal{A}'$ についての $\pi$ の局所切断（沈め込みの標準形 \ref{mfd:normal-forms.2} から得られる）を使って同様に滑らか。よって二つの構造は一致する。

**Step 6（作用）.** $\tau(a,q)\defeq\pi(a\,s_{g}(q))$（$q\in V_{g}$）は、積と $\pi$ と $s_{g}$ の合成で滑らか。$\pi(a\,s_{g}(q))$ は $a$ と剰余類 $q$ だけで決まる（$s_{g}(q)\in q$）ので、これは作用 $(a,q)\mapsto aq$ に一致する。
:::

::: theorem 剰余空間は主束 {#lie:coset-principal-bundle keywords="pi: G -> G/H is a principal H-bundle with right action of H by multiplication; local trivializations x -> (pi(x), s(pi x)^{-1} x) from local sections" index="剰余空間の主束|じょうよくうかんのしゅそく"}
$H$ をリー群 $G$ の閉部分群とする。$\pi\colon G\to G/H$ は、局所切断 $s_{g}$（\ref{lie:coset-manifold.2}）から作った局所自明化
$$
\Psi_{g}\colon\pi^{-1}(V_{g})\to V_{g}\times H,\qquad x\mapsto\bigl(\pi(x),\ s_{g}(\pi(x))^{-1}x\bigr)
$$
を $H$ アトラスとする主 $H$ 束である。主束としての右作用（\ref{mfd:principal-right-action}）は $H$ の右からの積 $x\cdot h=xh$ である。
:::

::: proof
**局所自明化.** $x\in\pi^{-1}(V_{g})$ なら $s_{g}(\pi x)$ と $x$ は同じ剰余類に属するので、$s_{g}(\pi x)^{-1}x\in H$。写像 $x\mapsto s_{g}(\pi x)^{-1}x$ は $G$ への滑らかな写像で値が $H$ に入り、$H$ は部分多様体なので $H$ への写像としても滑らか（\ref{mfd:submanifold-structure.3}）。逆写像 $(q,h)\mapsto s_{g}(q)h$ も滑らか。$\mathrm{pr}_{1}\circ\Psi_{g}=\pi$。

**推移関数.** $\Psi_{g}\circ\Psi_{g'}^{-1}(q,h)=\bigl(q,\ s_{g}(q)^{-1}s_{g'}(q)\,h\bigr)$ で、$q\mapsto s_{g}(q)^{-1}s_{g'}(q)$ は $V_{g}\cap V_{g'}$ から $H$ への滑らかな写像（同じ理由で値は $H$）。これは $H$ の左からの積による推移関数なので、$\{\Psi_{g}\}$ は主 $H$ 束の $H$ アトラス（\ref{mfd:principal-bundle}）。

**右作用.** \ref{mfd:principal-right-action.1} の定義で、$\Psi_{g}(x)=(q,k)$ なら $x\cdot h=\Psi_{g}^{-1}(q,kh)=s_{g}(q)kh=xh$。
:::

## 推移的な作用と等質空間 {#lie:sec-hs-homogeneous}

::: theorem 推移的な作用と剰余空間 {#lie:homogeneous-diffeo keywords="if a Lie group G acts smoothly and transitively on a manifold M, then for p in M the map G/G_p -> M, gG_p -> g p is an equivariant diffeomorphism; proof by constant rank, Sard and the regular value theorem" index="等質空間の特徴づけ|とうしつくうかんのとくちょうづけ, 推移的な作用|すいいてきなさよう"}
リー群 $G$ が可微分多様体 $M\neq\varnothing$ に滑らかに推移的に作用するとし、$p\in M$, $H\defeq G_{p}$（等方部分群。閉部分群、\ref{lie:closed-subgroup-corollaries.3}）とする。$F\colon G/H\to M$, $F(gH)\defeq g\cdot p$ は $G$ 同変な微分同相写像である。
:::

::: proof
**Step 1（well-defined・全単射・滑らか）.** $gH=g'H$ なら $g^{-1}g'\in H$ で $g'\cdot p=g\cdot p$。全射は推移性、単射は $g\cdot p=g'\cdot p\Rightarrow g^{-1}g'\in G_{p}$。滑らかさ：局所切断 $s$ を使うと $F(q)=s(q)\cdot p$（\ref{lie:coset-manifold.2}）。同変性 $F(aq)=a\cdot F(q)$ は定義から。

**Step 2（階数が一定）.** $a\in G$ について、$\tau_{a}\colon G/H\to G/H$ と $\theta_{a}\colon M\to M$（$a$ の作用）はどちらも微分同相写像（逆は $a^{-1}$ の作用）で、$F\circ\tau_{a}=\theta_{a}\circ F$。微分すると $dF_{aq}\circ d(\tau_{a})_{q}=d(\theta_{a})_{F(q)}\circ dF_{q}$ で、同型を掛けても階数は変わらないので $\operatorname{rank}dF_{aq}=\operatorname{rank}dF_{q}$。$G$ は $G/H$ に推移的に作用するので、階数は一定値 $r$。

**Step 3（$F$ は沈め込み）.** $r<\dim M$ とすると、すべての点が臨界点で、$F$ は全射なので $M$ のすべての点が臨界値。\ref{mfd:sard}から臨界値の全体 $M$ は測度 $0$ で、正則値が稠密であることに反する（$M\neq\varnothing$）。よって $r=\dim M$ で、$F$ は沈め込み。

**Step 4（次元が等しい）.** $\dim G/H>\dim M$ とすると、$p$ は正則値なので、\ref{mfd:regular-value-theorem}から $F^{-1}(p)$ は $\dim G/H-\dim M>0$ 次元の部分多様体。しかし $F$ は単射なので $F^{-1}(p)$ は 1 点で、正の次元のスライス座標近傍をもちえない（$\varphi(U\cap S)=\varphi(U)\cap(\mathbb{R}^{k}\times\{0\})$ は $\mathbb{R}^{k}$ の空でない開集合で、無限個の点を含む）。よって次元は等しく、$dF$ は各点で同型。

**Step 5.** 逆関数定理から $F$ は局所微分同相写像で、全単射なので微分同相写像（逆写像は各点の近くで局所的な逆写像と一致し、滑らか）。

::: hypcheck
- **サードの定理**：Step 3 で、全射な写像の階数が最大であることを導くのに使った。$G$ が第二可算であること（したがって $G/H$ も）がサードの定理の前提に含まれる。
- **作用の滑らかさと推移性**：Step 2 の階数一定性に使った。
:::
:::

::: example 球面とグラスマン多様体 {#lie:homogeneous-examples keywords="S^{n-1} = SO(n)/SO(n-1) and O(n)/O(n-1); SO(n) -> S^{n-1} is a principal SO(n-1)-bundle; Grassmannian Gr(k,n) = O(n)/(O(k) x O(n-k)) as a smooth manifold of dimension k(n-k); real projective space RP^{n-1} = Gr(1,n)" index="グラスマン多様体|ぐらすまんたようたい, 実射影空間（等質空間）|じつしゃえいくうかんとうしつくうかん"}
1. $n\ge2$ について、$\mathrm{SO}(n)$ は $S^{n-1}$ に $(A,u)\mapsto Au$ で推移的に作用し、$e_{n}$ の等方部分群は $\mathrm{SO}(n-1)$（左上のブロック）である。よって $S^{n-1}\cong\mathrm{SO}(n)/\mathrm{SO}(n-1)$ で、$\mathrm{SO}(n)\to S^{n-1}$, $A\mapsto Ae_{n}$ は主 $\mathrm{SO}(n-1)$ 束である。
2. $\mathbb{R}^{n}$ の $k$ 次元部分空間の全体 $\mathrm{Gr}(k,n)$ には $\mathrm{O}(n)$ が $(A,W)\mapsto A(W)$ で推移的に作用し、$\mathrm{span}(e_{1},\dots,e_{k})$ の等方部分群は $\mathrm{O}(k)\times\mathrm{O}(n-k)$（ブロック対角）である。$\mathrm{Gr}(k,n)$ に、全単射 $\mathrm{O}(n)/(\mathrm{O}(k)\times\mathrm{O}(n-k))\to\mathrm{Gr}(k,n)$ で可微分構造を移したものを**グラスマン多様体**といい、次元は $k(n-k)$。$k=1$ のとき**実射影空間** $\mathbb{RP}^{n-1}$。
:::

::: proof
**1.** 推移性：単位ベクトル $u$ について、$u$ を最後の元とする正規直交基底をとり（グラム–シュミット）、行列式が負なら最初の元の符号を変えると、その基底を列に並べた $A\in\mathrm{SO}(n)$ は $Ae_{n}=u$。等方部分群：$Ae_{n}=e_{n}$ なら、$A$ の最後の列は $e_{n}$ で、直交性から最後の行も $e_{n}^{\mathsf{T}}$、残りのブロックは直交行列で行列式 $1$。作用は行列の積の制限で滑らか（$S^{n-1}$ は部分多様体）。\ref{lie:homogeneous-diffeo} と \ref{lie:coset-principal-bundle} から結論が従う（主束の構造は微分同相写像で移す）。

**2.** 推移性：$k$ 次元部分空間 $W$ の正規直交基底を $\mathbb{R}^{n}$ の正規直交基底に延ばし、それを列に並べた $A$ は $A(\mathrm{span}(e_{1},\dots,e_{k}))=W$。等方部分群：$A$ が $W_{0}\defeq\mathrm{span}(e_{1},\dots,e_{k})$ を保てば直交補空間 $W_{0}^{\perp}$ も保つので、$A$ はブロック対角で各ブロックは直交行列。ブロック対角の直交行列の全体 $\mathrm{O}(k)\times\mathrm{O}(n-k)$ は、ブロックの外の成分が $0$ という閉条件で定まる $\mathrm{O}(n)$ の閉部分群なので、\ref{lie:coset-manifold} から剰余空間は多様体で、次元は $\frac{n(n-1)}{2}-\frac{k(k-1)}{2}-\frac{(n-k)(n-k-1)}{2}=k(n-k)$。
:::

::: supplement
**高い視点：クラインのエルランゲン・プログラム.** クラインは 1872 年に、「幾何学とは、変換群のもとで不変な性質を調べることである」と提唱した。等質空間 $G/H$ は、その考え方を多様体の言葉にしたもので、ユークリッド幾何（$\mathbb{R}^{n}=\mathrm{E}(n)/\mathrm{O}(n)$）、球面幾何（$S^{n}=\mathrm{O}(n+1)/\mathrm{O}(n)$）、双曲幾何（$\mathbb{H}^{n}=\mathrm{O}^{+}(n,1)/\mathrm{O}(n)$）、射影幾何（$\mathbb{RP}^{n}=\mathrm{PGL}(n+1)/(\text{放物型部分群})$）が同じ形で並ぶ。\ref{lie:coset-principal-bundle} はこの描像に束の言葉を与える：$G\to G/H$ は主 $H$ 束で、$H$ の表現に付随するベクトル束（\ref{mfd:associated-vector-bundle}）として、等質空間の接束やテンソル束が得られることが知られている（たとえば $T(G/H)\cong G\times_{H}(\mathfrak{g}/\mathfrak{h})$）。比喩で言えば、$G$ は舞台を動かす装置の全体、$H$ は一点を固定する装置で、舞台そのもの $G/H$ は「装置を、同じ効果をもつものどうしで同一視したもの」である。

**補足.** カルタン幾何は、等質空間 $G/H$ を「曲げた」ものとして一般の幾何構造を捉える。リーマン幾何は $\mathrm{E}(n)/\mathrm{O}(n)$ をモデルとするカルタン幾何で、その曲率はモデルからのずれを測る、という見方が知られている。
:::

## 問題 {#lie:sec-hs-problems}

::: problem {#lie:prob-hs-rp-dimension}
$\mathbb{RP}^{n-1}=\mathrm{Gr}(1,n)$ は $S^{n-1}/\{\pm1\}$ と同一視できることを、$\mathrm{O}(n)$ の作用で確かめよ（$u\mapsto\mathbb{R}u$ が $\mathrm{O}(n)$ 同変な全射 $S^{n-1}\to\mathbb{RP}^{n-1}$ で、各ファイバーが $\{\pm u\}$ であること）。
:::

::: solution
$\mathbb{R}(Au)=A(\mathbb{R}u)$ なので同変。全射：直線 $W$ の単位ベクトル $u$ について $\mathbb{R}u=W$。$\mathbb{R}u=\mathbb{R}u'$（$|u|=|u'|=1$）なら $u'=\pm u$。
:::

::: problem {#lie:prob-hs-u1-s3}
$\mathrm{SU}(2)$ は $S^{3}=\{(z,w)\in\mathbb{C}^{2}:|z|^{2}+|w|^{2}=1\}$ と微分同相であることを、$\mathrm{SU}(2)$ の $\mathbb{C}^{2}$ への作用を使って示せ。
:::

::: solution
$\mathrm{SU}(2)$ は $\mathbb{C}^{2}$ に行列の積で作用し、ノルムを保つので $S^{3}$ に作用する。$e_{1}$ の行き先 $Ae_{1}$ は $A$ の第 1 列 $(z,w)$ で、$A=\begin{pmatrix}z&-\bar w\\w&\bar z\end{pmatrix}$ は $\mathrm{SU}(2)$ の元（$\det A=|z|^{2}+|w|^{2}=1$、列は正規直交）なので推移的。$Ae_{1}=e_{1}$ なら第 1 列が $e_{1}$ で、ユニタリ性から第 2 列は $(0,\lambda)$, $|\lambda|=1$、$\det=1$ から $\lambda=1$、よって等方部分群は自明。\ref{lie:homogeneous-diffeo} から $\mathrm{SU}(2)=\mathrm{SU}(2)/\{e\}\cong S^{3}$。
:::
