# リー群の定義と古典群 {#lie:page-lie-group-basics keywords="Lie group, smooth action, effective action, GL(n,R) as an open submanifold, a subgroup that is a submanifold of GL(n) is a Lie group, O(n), SO(n) via the regular value theorem, classical groups SL(n), U(n), SU(n), Sp(2n), tori"}

**リー群**は、群であって同時に可微分多様体であり、群の演算が滑らかなものである。位相群（\ref{top:topological-group}）のうち、位相が可微分多様体の構造から来ていて、演算が連続より強く滑らかであるものと言ってもよい。このページでは定義と、行列の群（**古典群**）がリー群であることを、\ref{mfd:regular-value-theorem} を使って示す。

このページは可微分多様体の基本（部分多様体と正則値定理）だけを使い、リー群の系列のほかのページも、ファイバー束の系列も使わない。ファイバー束の系列（主束の構造群）はこのページだけを前提にする。

## 記法と定義の確認 {#lie:sec-lb-notation}

::: notation
- 可微分多様体は $C^{\infty}$ 級でハウスドルフかつ第二可算（\ref{mfd:smooth-manifold}）。滑らかな写像は \ref{mfd:smooth-map}、直積多様体などの例は \ref{mfd:manifold-examples}、部分多様体は \ref{mfd:submanifold}, \ref{mfd:submanifold-structure}、さらに \ref{mfd:regular-value-theorem}。
- 位相群は \ref{top:topological-group}。
- $M_{n}(\mathbb{R})$ は実 $n$ 次正方行列の全体で、成分によって $\mathbb{R}^{n^{2}}$ と同一視する。$\mathrm{Sym}_{n}$ は対称行列の全体（$\frac{n(n+1)}{2}$ 次元の部分空間）。$A^{\mathsf{T}}$ は転置、$A^{*}$ は共役転置。$M_{n}(\mathbb{C})$ は実部と虚部によって $\mathbb{R}^{2n^{2}}$ と同一視する。
:::

## リー群と滑らかな作用 {#lie:sec-lb-definition}

::: definition リー群と滑らかな作用 {#lie:lie-group keywords="Lie group: a group with a smooth manifold structure such that multiplication and inversion are smooth; smooth left action; effective action" index="リー群|りーぐん, 滑らかな作用|なめらかなさよう, 効果的な作用|こうかてきなさよう, 忠実な作用（リー群）|ちゅうじつなさようりーぐん"}
1. 群 $G$ が可微分多様体でもあり、積 $G\times G\to G$, $(g,h)\mapsto gh$ と逆元 $G\to G$, $g\mapsto g^{-1}$ がともに滑らかであるとき、$G$ を**リー群**という。単位元を $e$ と書く。
2. リー群 $G$ の可微分多様体 $F$ への（左からの）**滑らかな作用**とは、滑らかな写像 $G\times F\to F$, $(g,f)\mapsto g\cdot f$ で、$e\cdot f=f$, $g\cdot(h\cdot f)=(gh)\cdot f$ を満たすものをいう。
3. 作用が**効果的**（忠実）であるとは、すべての $f\in F$ について $g\cdot f=f$ となる $g$ は $e$ だけであることをいう。
:::

::: remark
リー群は位相群である：可微分多様体の位相について、滑らかな写像は連続なので、積と逆元は連続（\ref{top:topological-group}）。逆に、位相群がいつリー群の構造をもつかは深い問題で（ヒルベルトの第 5 問題）、本サイトでは扱わない。
:::

## 行列群 {#lie:sec-lb-matrix}

::: proposition 行列群はリー群 {#lie:matrix-lie-groups keywords="GL(n,R) is open in M_n(R); GL^+(n), O(n), SO(n) are Lie groups; O(n) is a compact submanifold of dimension n(n-1)/2 via the regular value theorem" index="一般線形群（リー群）|いっぱんせんけいぐんりーぐん, 直交群（リー群）|ちょっこうぐんりーぐん, 行列群|ぎょうれつぐん"}
1. $\mathrm{GL}(n,\mathbb{R})\defeq\{A\in M_{n}(\mathbb{R}):\det A\neq0\}$ と $\mathrm{GL}^{+}(n,\mathbb{R})\defeq\{\det A>0\}$ は $M_{n}(\mathbb{R})$ の開集合で、開部分多様体としてリー群である。
2. $G\subset\mathrm{GL}(n,\mathbb{R})$ が部分群かつ部分多様体なら、部分多様体の構造で $G$ はリー群である。
3. $\mathrm{O}(n)\defeq\{A:A^{\mathsf{T}}A=I\}$ は $\mathrm{GL}(n,\mathbb{R})$ の $\frac{n(n-1)}{2}$ 次元のコンパクトな部分多様体で、2 からリー群。$\mathrm{SO}(n)\defeq\mathrm{O}(n)\cap\mathrm{GL}^{+}(n,\mathbb{R})$ は $\mathrm{O}(n)$ の開集合で、やはりリー群。
4. $\mathrm{GL}(n,\mathbb{R})$ の $\mathbb{R}^{n}$ への作用 $(A,v)\mapsto Av$ は滑らかで効果的。$\mathrm{O}(1)=\{\pm1\}$ である。
:::

::: proof
**1.** $\det$ は成分の多項式なので連続で、$\mathrm{GL}=\det^{-1}(\mathbb{R}\setminus\{0\})$, $\mathrm{GL}^{+}=\det^{-1}((0,\infty))$ は開集合。積の成分 $(AB)_{ij}=\sum_{k}A_{ik}B_{kj}$ は多項式なので積は $C^{\infty}$ 級。クラメルの公式 $A^{-1}=\frac{1}{\det A}\,\widetilde{A}$（$\widetilde{A}$ は余因子行列で、成分は $A$ の成分の多項式）から、逆元の成分は分母が $0$ にならない有理式で $C^{\infty}$ 級。$\mathrm{GL}^{+}$ は積と逆元で閉じている（$\det(AB)=\det A\det B$, $\det A^{-1}=(\det A)^{-1}$）ので部分群で、演算は $\mathrm{GL}$ の演算の制限として滑らか。

**2.** 包含写像 $\iota\colon G\to\mathrm{GL}$ は滑らか（\ref{mfd:submanifold-structure.2}）なので、$G\times G\to\mathrm{GL}$, $(g,h)\mapsto\iota(g)\iota(h)$ は滑らかな写像の合成として滑らかで、値は $G$ に入る（部分群）。\ref{mfd:submanifold-structure.3} から $G\times G\to G$ として滑らか。逆元も同様。

**3.** 【主張：$I$ は $\Phi\colon\mathrm{GL}\to\mathrm{Sym}_{n}$, $\Phi(A)=A^{\mathsf{T}}A$ の正則値】$\Phi$ の成分は多項式なので滑らかで、$A$ における微分は、$t\mapsto(A+tH)^{\mathsf{T}}(A+tH)$ の $t=0$ での微分係数から
$$
d\Phi_{A}(H)=A^{\mathsf{T}}H+H^{\mathsf{T}}A\qquad(H\in M_{n}(\mathbb{R})).
$$
$A\in\Phi^{-1}(I)=\mathrm{O}(n)$ と $S\in\mathrm{Sym}_{n}$ について $H\defeq\frac12AS$ とおくと、$A^{\mathsf{T}}A=I$, $S^{\mathsf{T}}=S$ から $d\Phi_{A}(H)=\frac12S+\frac12S^{\mathsf{T}}=S$。よって $d\Phi_{A}$ は全射。\ref{mfd:regular-value-theorem} から $\mathrm{O}(n)$ は $n^{2}-\frac{n(n+1)}{2}=\frac{n(n-1)}{2}$ 次元の部分多様体。$\mathrm{O}(n)$ は部分群（$(AB)^{\mathsf{T}}AB=B^{\mathsf{T}}B=I$, $A^{-1}=A^{\mathsf{T}}$ で $(A^{\mathsf{T}})^{\mathsf{T}}A^{\mathsf{T}}=AA^{\mathsf{T}}=I$）なので 2 からリー群。$\{A\in M_{n}(\mathbb{R}):A^{\mathsf{T}}A=I\}$ は連続写像 $M_{n}\to M_{n}$, $A\mapsto A^{\mathsf{T}}A$ による 1 点の逆像なので $M_{n}(\mathbb{R})$ の閉集合で、$A^{\mathsf{T}}A=I$ なら $(\det A)^{2}=1$ なので、この集合は $\mathrm{O}(n)$ に等しい。各列が単位ベクトルなので有界でもあり、よってコンパクト。$\mathrm{SO}(n)$ は $\mathrm{O}(n)$ の中で $\det>0$ という開条件で定まる部分群で、開部分多様体としてリー群（演算は $\mathrm{O}(n)$ の演算の制限）。

**4.** 作用の成分 $(Av)_{i}=\sum_{j}A_{ij}v_{j}$ は多項式。すべての $v$ で $Av=v$ なら $A=I$（$v$ を標準基底にとる）。$n=1$ では $a^{2}=1\iff a=\pm1$。

::: hypcheck
- **正則値**：3 で $\Phi^{-1}(I)$ の各点で微分が全射であることを確かめた。$\Phi$ の値域を $M_{n}$ にすると全射にならない（像は対称行列）ので、値域を $\mathrm{Sym}_{n}$ にとることが本質的。
:::
:::

::: proposition 古典群 {#lie:classical-groups keywords="SL(n,R), U(n), SU(n), Sp(2n,R) are Lie groups (regular value theorem); the circle U(1) and tori T^n = U(1)^n" index="特殊線形群|とくしゅせんけいぐん, ユニタリ群|ゆにたりぐん, 特殊ユニタリ群|とくしゅゆにたりぐん, トーラス（リー群）|とーらすりーぐん, 古典群|こてんぐん"}
次はいずれも、$\mathrm{GL}(n,\mathbb{R})$（または $\mathrm{GL}(n,\mathbb{C})\subset\mathrm{GL}(2n,\mathbb{R})$）の部分群かつ部分多様体で、したがってリー群である。
1. $\mathrm{SL}(n,\mathbb{R})\defeq\{A:\det A=1\}$（次元 $n^{2}-1$）。
2. $\mathrm{U}(n)\defeq\{A\in M_{n}(\mathbb{C}):A^{*}A=I\}$（次元 $n^{2}$）、$\mathrm{SU}(n)\defeq\mathrm{U}(n)\cap\{\det=1\}$。
3. $\mathrm{Sp}(2n,\mathbb{R})\defeq\{A:A^{\mathsf{T}}\Omega A=\Omega\}$, $\Omega\defeq\begin{pmatrix}0&I\\-I&0\end{pmatrix}$（次元 $n(2n+1)$）。
4. リー群の直積はリー群で、とくに**トーラス** $T^{n}\defeq\mathrm{U}(1)^{n}$（$\mathrm{U}(1)=\{z\in\mathbb{C}:|z|=1\}$）。
:::

::: proof
部分群であることは定義から（$\det$ の乗法性、$(AB)^{*}AB=B^{*}A^{*}AB$ など）。部分群かつ部分多様体ならリー群であることは \ref{lie:matrix-lie-groups.2}（$\mathrm{GL}(n,\mathbb{C})$ は $M_{n}(\mathbb{C})=\mathbb{R}^{2n^{2}}$ の開集合で、積と逆元の成分は多項式と有理式なので、同じ証明が通る）。部分多様体であることを、\ref{mfd:regular-value-theorem} で示す。

**1.** $\det\colon\mathrm{GL}(n,\mathbb{R})\to\mathbb{R}\setminus\{0\}$ の $A$ での微分は $H\mapsto\frac{d}{dt}\det(A+tH)|_{t=0}=\det A\cdot\operatorname{tr}(A^{-1}H)$（$\det(A+tH)=\det A\det(I+tA^{-1}H)$ と、$\det(I+tK)=1+t\operatorname{tr}K+O(t^{2})$）。$H=A$ で値 $n\det A\neq0$ なので全射。$1$ は正則値。

**2.** $\Phi(A)\defeq A^{*}A$ をエルミート行列の空間（実 $n^{2}$ 次元）への写像とみる。$A\in\mathrm{U}(n)$ で $d\Phi_{A}(H)=A^{*}H+H^{*}A$ で、エルミート行列 $S$ について $H\defeq\frac12AS$ とすると $d\Phi_{A}(H)=S$（\ref{lie:matrix-lie-groups.3} の証明と同じ）。次元は $2n^{2}-n^{2}=n^{2}$。$\mathrm{SU}(n)$ については、$\det\colon\mathrm{U}(n)\to\mathrm{U}(1)$ を考える。$A\in\mathrm{U}(n)$ を通る曲線 $c(t)\defeq e^{it}A\in\mathrm{U}(n)$ について $\det c(t)=e^{int}\det A$ の $t=0$ での微分は $in\det A\neq0$ なので、$\det$ の微分は 1 次元の $T\,\mathrm{U}(1)$ への全射。\ref{mfd:regular-value-theorem} から $\mathrm{SU}(n)=\det^{-1}(1)$ は $\mathrm{U}(n)$ の部分多様体（次元 $n^{2}-1$）。

**3.** $\Psi(A)\defeq A^{\mathsf{T}}\Omega A$ を交代行列の空間（$\frac{2n(2n-1)}{2}$ 次元）への写像とみる。$A\in\mathrm{Sp}$ で $d\Psi_{A}(H)=H^{\mathsf{T}}\Omega A+A^{\mathsf{T}}\Omega H$。交代行列 $S$ について $H\defeq-\frac12A\Omega S$ とおくと、$A^{\mathsf{T}}\Omega A=\Omega$ と $\Omega^{2}=-I$, $\Omega^{\mathsf{T}}=-\Omega$ から $A^{\mathsf{T}}\Omega H=-\frac12\Omega^{2}S=\frac12S$、$H^{\mathsf{T}}\Omega A=-\frac12S^{\mathsf{T}}\Omega^{\mathsf{T}}A^{\mathsf{T}}\Omega A=-\frac12S^{\mathsf{T}}\Omega^{\mathsf{T}}\Omega=-\frac12S^{\mathsf{T}}=\frac12S$。和は $S$ で全射。次元は $4n^{2}-n(2n-1)=n(2n+1)$。

**4.** 直積多様体の上で、積と逆元は成分ごとで滑らか。$\mathrm{U}(1)=\mathrm{U}(n)$ の $n=1$ の場合。
:::

::: supplement
**高い視点：群対象.** リー群は、可微分多様体と滑らかな写像の圏 $\mathbf{Diff}$ の**群対象**である（\ref{top:group-object-examples}）。行列群がリー群であることの証明（\ref{lie:matrix-lie-groups.2}）は、「群対象の部分対象で、群の演算で閉じているものは群対象」という一般的な形をしていて、そこで本質的なのは「部分多様体への写像は、値域を制限しても滑らか」（\ref{mfd:submanifold-structure.3}）という、部分対象の普遍性である。比喩で言えば、部分多様体は「中から見ても外から見ても同じ滑らかさをもつ部屋」で、部屋の中で閉じた演算は、部屋の中の演算として滑らかになる。
:::

## 問題 {#lie:sec-lb-problems}

::: problem {#lie:prob-lb-so2-u1}
写像 $\phi\colon\mathrm{U}(1)\to\mathrm{SO}(2)$, $\phi(a+bi)\defeq\begin{pmatrix}a&-b\\b&a\end{pmatrix}$ が、リー群の同型（滑らかな群同型で、逆も滑らか）であることを示せ。
:::

::: solution
$a+bi\in\mathrm{U}(1)$ なら $a^{2}+b^{2}=1$ なので $\phi(a+bi)^{\mathsf{T}}\phi(a+bi)=(a^{2}+b^{2})I=I$、$\det=a^{2}+b^{2}=1>0$ で、値は $\mathrm{SO}(2)$ に入る。$(a+bi)(c+di)=(ac-bd)+(ad+bc)i$ と行列の積を比べて準同型。逆に $A=\begin{pmatrix}p&q\\r&s\end{pmatrix}\in\mathrm{SO}(2)$ は、列が正規直交で $\det=1$ なので $(p,r)=(a,b)$ と書けば $(q,s)=(-b,a)$（$(p,r)$ に直交する単位ベクトルは $\pm(-b,a)$ で、$\det=1$ から $+$）。よって全単射で、逆は $A\mapsto p+ri$。$\phi$ と逆写像は、$\mathbb{R}^{2}\to M_{2}(\mathbb{R})$ と $M_{2}(\mathbb{R})\to\mathbb{R}^{2}$ の線形写像の制限なので、部分多様体の間の写像として滑らか（\ref{mfd:submanifold-structure}）。
:::

::: problem {#lie:prob-lb-on-components}
$\mathrm{O}(n)$（$n\ge1$）は連結でないことを示せ。
:::

::: solution
$\det\colon\mathrm{O}(n)\to\mathbb{R}$ は連続で、$(\det A)^{2}=\det(A^{\mathsf{T}}A)=1$ から値は $\{1,-1\}$。$\det I=1$、$\det\operatorname{diag}(-1,1,\dots,1)=-1$ で、どちらの値もとる。連結集合の連続像は連結なので、$\mathrm{O}(n)$ が連結なら $\{1,-1\}$ が連結になり矛盾。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lie:sec-lgb-exercises} にまとめた。
