# 演習：リー群 {#lie:page-exercises-groups keywords="exercises, Lie Groups"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは具体的な群やリー環についての計算と、いくつかのページの結果を組み合わせる問題である。各節の中は、基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#lie:sec-exlg-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
- $E_{ij}$ は $(i,j)$ 成分だけが $1$ で他が $0$ の行列（行列単位）。$E_{ij}E_{kl}=\delta_{jk}E_{il}$。
- $N\defeq\{I+xE_{12}+yE_{23}+zE_{13}:x,y,z\in\mathbb{R}\}\subset\mathrm{GL}(3,\mathbb{R})$（**ハイゼンベルク群**）。その元を $n(x,y,z)\defeq I+xE_{12}+yE_{23}+zE_{13}$ と書く。
- $\mathfrak{su}(2)$ の基底として
$$
X_{1}\defeq\frac12\begin{pmatrix}0&-i\\-i&0\end{pmatrix},\qquad X_{2}\defeq\frac12\begin{pmatrix}0&-1\\1&0\end{pmatrix},\qquad X_{3}\defeq\frac12\begin{pmatrix}-i&0\\0&i\end{pmatrix}
$$
を使う。$\mathfrak{so}(3)$ の基底 $E_{1},E_{2},E_{3}$ は \ref{lie:prob-la-so3} のもの（$E_{k}w=e_{k}\times w$）。
:::

## リー群の定義と古典群 {#lie:sec-lgb-exercises}

対応するページ：\ref{lie:page-lie-group-basics}

::: problem ★ 基本：ハイゼンベルク群 {#lie:ex-lgb-1}
$N$ が $\mathrm{GL}(3,\mathbb{R})$ の 3 次元の部分群かつ部分多様体であり、したがってリー群であることを示せ。さらに $N$ は可換でなく、その中心が $\{I+zE_{13}:z\in\mathbb{R}\}$ であることを示せ。
:::

::: solution
**部分群.** 行列の積を計算すると
$$
n(x,y,z)\,n(x',y',z')=n(x+x',\ y+y',\ z+z'+xy')
$$
で、$N$ は積で閉じている。$n(0,0,0)=I$ で、この式から $n(x,y,z)\,n(-x,-y,xy-z)=n(0,0,xy-z+z-xy)=I$ なので、$n(x,y,z)^{-1}=n(-x,-y,xy-z)\in N$。

**部分多様体.** 線形同型 $\varphi\colon M_{3}(\mathbb{R})\to\mathbb{R}^{9}$ を
$$
\varphi(A)\defeq(A_{12},A_{23},A_{13},A_{11}-1,A_{22}-1,A_{33}-1,A_{21},A_{31},A_{32})
$$
で定める（平行移動と成分の並べ替えなので微分同相写像）。$N=\varphi^{-1}(\mathbb{R}^{3}\times\{0\})$ で、$N$ の元は上三角で対角成分が $1$ なので $\det=1$、$N\subset\mathrm{GL}(3,\mathbb{R})$。よって $(\mathrm{GL}(3,\mathbb{R}),\varphi\restriction\mathrm{GL}(3,\mathbb{R}))$ は $N$ の各点でのスライス座標近傍で、$N$ は 3 次元の部分多様体（\ref{mfd:submanifold}）。\ref{lie:matrix-lie-groups.2} から $N$ はリー群である。

**中心.** 積の式から、$n(x,y,z)$ と $n(x',y',z')$ が可換であることは $xy'=x'y$ と同値。$(x',y')=(1,0)$ とすると $y=0$、$(x',y')=(0,1)$ とすると $x=0$ が必要で、逆に $x=y=0$ ならすべての $(x',y')$ で $xy'=x'y=0$。よって中心は $\{n(0,0,z)\}$。とくに $n(1,0,0)$ と $n(0,1,0)$ は可換でなく、$N$ は可換でない。
:::

::: problem ★★ 標準：不定値直交群 {#lie:ex-lgb-2}
$p,q\ge0$, $n\defeq p+q$, $J\defeq\operatorname{diag}(I_{p},-I_{q})$ とし、$\mathrm{O}(p,q)\defeq\{A\in M_{n}(\mathbb{R}):A^{\mathsf{T}}JA=J\}$ とおく。$\mathrm{O}(p,q)$ が $\mathrm{GL}(n,\mathbb{R})$ の $\frac{n(n-1)}{2}$ 次元の部分群かつ部分多様体（したがってリー群）であること、さらに $p,q\ge1$ ならコンパクトでないことを示せ。
:::

::: solution
**部分群.** $A^{\mathsf{T}}JA=J$ なら $(\det A)^{2}\det J=\det J$、$\det J=\pm1\neq0$ から $\det A=\pm1$ で、$\mathrm{O}(p,q)\subset\mathrm{GL}(n,\mathbb{R})$。$A,B\in\mathrm{O}(p,q)$ なら $(AB)^{\mathsf{T}}J(AB)=B^{\mathsf{T}}(A^{\mathsf{T}}JA)B=B^{\mathsf{T}}JB=J$。$A^{\mathsf{T}}JA=J$ の両辺に左から $(A^{-1})^{\mathsf{T}}$、右から $A^{-1}$ を掛けると $J=(A^{-1})^{\mathsf{T}}JA^{-1}$ なので $A^{-1}\in\mathrm{O}(p,q)$。$I\in\mathrm{O}(p,q)$ は明らか。

**部分多様体.** $\Phi\colon\mathrm{GL}(n,\mathbb{R})\to\mathrm{Sym}_{n}$, $\Phi(A)\defeq A^{\mathsf{T}}JA$ を考える（$J^{\mathsf{T}}=J$ なので値は対称行列）。成分は多項式なので滑らかで、$t\mapsto\Phi(A+tH)$ を $t=0$ で微分して
$$
d\Phi_{A}(H)=H^{\mathsf{T}}JA+A^{\mathsf{T}}JH.
$$
$A\in\Phi^{-1}(J)=\mathrm{O}(p,q)$ と $S\in\mathrm{Sym}_{n}$ について $H\defeq\frac12AJS$ とおく。$J^{2}=I$, $J^{\mathsf{T}}=J$, $S^{\mathsf{T}}=S$, $A^{\mathsf{T}}JA=J$ から
$$
A^{\mathsf{T}}JH=\frac12(A^{\mathsf{T}}JA)JS=\frac12J^{2}S=\frac12S,\qquad H^{\mathsf{T}}JA=\frac12SJ(A^{\mathsf{T}}JA)=\frac12SJ^{2}=\frac12S
$$
で、$d\Phi_{A}(H)=S$。よって $d\Phi_{A}$ は全射で、$J$ は $\Phi$ の正則値。\ref{mfd:regular-value-theorem} から $\mathrm{O}(p,q)$ は $n^{2}-\frac{n(n+1)}{2}=\frac{n(n-1)}{2}$ 次元の部分多様体で、\ref{lie:matrix-lie-groups.2} からリー群である。

**非コンパクト性.** $p,q\ge1$ とし、$t\in\mathbb{R}$ について $A_{t}\defeq I+(\cosh t-1)(E_{11}+E_{nn})+\sinh t\,(E_{1n}+E_{n1})$ とおく。$A_{t}$ は $e_{1},e_{n}$ の張る平面に $B_{t}\defeq\begin{pmatrix}\cosh t&\sinh t\\\sinh t&\cosh t\end{pmatrix}$ として作用し、他の基底ベクトルを固定する。$J$ はこの平面に $\operatorname{diag}(1,-1)$ として作用するので（$e_{1}$ は最初の $p$ 個、$e_{n}$ は最後の $q$ 個に属する）、$A_{t}^{\mathsf{T}}JA_{t}=J$ は
$$
B_{t}^{\mathsf{T}}\begin{pmatrix}1&0\\0&-1\end{pmatrix}B_{t}=\begin{pmatrix}\cosh^{2}t-\sinh^{2}t&0\\0&\sinh^{2}t-\cosh^{2}t\end{pmatrix}=\begin{pmatrix}1&0\\0&-1\end{pmatrix}
$$
に帰着し、成り立つ。$(A_{t})_{11}=\cosh t\to\infty$（$t\to\infty$）なので $\mathrm{O}(p,q)$ は $M_{n}(\mathbb{R})=\mathbb{R}^{n^{2}}$ の有界集合でなく、コンパクトでない（コンパクト集合は連続関数 $A\mapsto A_{11}$ の値を有界にする）。
:::

::: problem ★★★ 発展：U(n) と SU(n) × U(1) {#lie:ex-lgb-3}
$n\ge1$ とし、$z\in\mathrm{U}(1)$ について $D(z)\defeq\operatorname{diag}(z,1,\dots,1)$ とおく。
1. $\Phi\colon\mathrm{SU}(n)\times\mathrm{U}(1)\to\mathrm{U}(n)$, $\Phi(A,z)\defeq AD(z)$ は微分同相写像であることを示せ。
2. $m\colon\mathrm{SU}(n)\times\mathrm{U}(1)\to\mathrm{U}(n)$, $m(A,z)\defeq zA$ は全射なリー群の準同型で、核が $\{(\bar\omega I,\omega):\omega^{n}=1\}$（位数 $n$）であることを示せ。
:::

::: solution
$\mathrm{U}(n)$, $\mathrm{SU}(n)$, $\mathrm{U}(1)$ は $M_{n}(\mathbb{C})$ や $\mathbb{C}$ の部分多様体である（\ref{lie:classical-groups}）。部分多様体の間の写像は、外側の空間の滑らかな写像の制限で値が部分多様体に入れば滑らかである（包含写像が滑らかなこと \ref{mfd:submanifold-structure.2} と、\ref{mfd:submanifold-structure.3}）。これを繰り返し使う。

**1.** $D(z)$ はユニタリで $\det D(z)=z$。$A\in\mathrm{SU}(n)$ なら $AD(z)$ はユニタリ行列の積でユニタリなので、$\Phi$ の値は $\mathrm{U}(n)$ に入る。$\Phi$ の成分は $A$ と $z$ の成分（の実部・虚部）の多項式なので、$\Phi$ は滑らか。逆の候補として
$$
\Psi\colon\mathrm{U}(n)\to\mathrm{SU}(n)\times\mathrm{U}(1),\qquad\Psi(B)\defeq\bigl(B\,D(\overline{\det B}),\ \det B\bigr)
$$
を考える。$B\in\mathrm{U}(n)$ なら $|\det B|=1$ なので $\det B\in\mathrm{U}(1)$ で、$D(\overline{\det B})$ はユニタリ、$\det\bigl(BD(\overline{\det B})\bigr)=\det B\cdot\overline{\det B}=1$。よって値は $\mathrm{SU}(n)\times\mathrm{U}(1)$ に入る。各成分は $B$ の成分の実部・虚部の多項式なので、$\Psi$ の各成分は滑らかで、$\Psi$ は滑らか。$\det A=1$, $D(z)D(\bar z)=I$（$|z|=1$）から
$$
\Psi(\Phi(A,z))=\bigl(AD(z)D(\bar z),\ \det A\cdot z\bigr)=(A,z),\qquad\Phi(\Psi(B))=BD(\overline{\det B})D(\det B)=B.
$$
よって $\Phi$ は微分同相写像。次元を比べると $(n^{2}-1)+1=n^{2}$ で、\ref{lie:classical-groups} と整合する。

**2.** スカラー $z$ は行列と可換なので $m(A,z)m(A',z')=zAz'A'=(zz')(AA')=m(AA',zz')$ で準同型。成分は多項式なので滑らかで、値は $\mathrm{U}(n)$ に入る。全射：$B\in\mathrm{U}(n)$ について $z^{n}=\det B$ となる $z\in\mathrm{U}(1)$ をとり（$\det B=e^{i\theta}$ なら $z=e^{i\theta/n}$）、$A\defeq\bar zB$ とすると $A$ はユニタリで $\det A=\bar z^{n}\det B=1$、$m(A,z)=B$。核：$zA=I$ なら $A=\bar zI$ で、$\det A=\bar z^{n}=1$、つまり $z^{n}=1$。逆に $\omega^{n}=1$ なら $\bar\omega I\in\mathrm{SU}(n)$ で $m(\bar\omega I,\omega)=I$。よって核は $\{(\bar\omega I,\omega):\omega^{n}=1\}$ で、$1$ の $n$ 乗根の個数から位数 $n$。とくに $n\ge2$ では $m$ は単射でなく、リー群の同型ではない（1 の $\Phi$ は多様体としての同一視を与えるが、$m$ とは別の写像である）。
:::

## リー群とリー環 {#lie:sec-lgl-exercises}

対応するページ：\ref{lie:page-lie-algebras}

::: problem ★ 基本：ハイゼンベルク群のリー環 {#lie:ex-lgl-1}
$N$ のリー環 $\mathfrak{n}$ が $\mathrm{span}(E_{12},E_{23},E_{13})$（狭義上三角行列の全体）であることを示し、その括弧をすべて計算せよ。さらに $\mathfrak{n}$ の中心（すべての元と括弧が $0$ になる元の全体）を求めよ。
:::

::: solution
\ref{lie:ex-lgb-1} から $N$ は $\mathrm{GL}(3,\mathbb{R})$ の部分群かつ 3 次元の部分多様体なので、\ref{lie:homomorphism-differential.2} から $T_{I}N\subset\mathfrak{gl}(3,\mathbb{R})$ は $N$ のリー環で、括弧は \ref{lie:gl-lie-algebra} の交換子である。曲線 $t\mapsto I+tE_{12}$, $I+tE_{23}$, $I+tE_{13}$ は $N$ の中にあり、$t=0$ での速度は $E_{12},E_{23},E_{13}$ なので、これらは $T_{I}N$ に属する。一次独立で $\dim T_{I}N=3$ なので $\mathfrak{n}=\mathrm{span}(E_{12},E_{23},E_{13})$。

$E_{ij}E_{kl}=\delta_{jk}E_{il}$ から
$$
[E_{12},E_{23}]=E_{13}-0=E_{13},\qquad[E_{12},E_{13}]=0-0=0,\qquad[E_{23},E_{13}]=0-0=0.
$$
（交代性から、残りの括弧はこれらの符号を変えたものと $[E,E]=0$。）$X=aE_{12}+bE_{23}+cE_{13}$, $Y=a'E_{12}+b'E_{23}+c'E_{13}$ について、双線形性から
$$
[X,Y]=(ab'-a'b)E_{13}.
$$
$X$ が中心に属することは、すべての $(a',b')$ で $ab'-a'b=0$ となることで、$(a',b')=(1,0),(0,1)$ から $b=a=0$。逆に $a=b=0$ なら中心に属する。よって中心は $\mathbb{R}E_{13}$ で、\ref{lie:ex-lgb-1} の群の中心 $\{I+zE_{13}\}$ の接空間と一致する。
:::

::: problem ★★ 標準：su(2) と so(3) {#lie:ex-lgl-2}
記法の節の $X_{1},X_{2},X_{3}$ が $\mathfrak{su}(2)$ の基底で、
$$
[X_{1},X_{2}]=X_{3},\qquad[X_{2},X_{3}]=X_{1},\qquad[X_{3},X_{1}]=X_{2}
$$
を満たすことを示せ。これを使って、$X_{k}\mapsto E_{k}$ で定まる線形写像が、リー環の同型 $\mathfrak{su}(2)\to\mathfrak{so}(3)$ であることを示せ。
:::

::: solution
**基底であること.** \ref{lie:classical-lie-algebras.3} から $\mathfrak{su}(2)=\{X\in M_{2}(\mathbb{C}):X^{*}=-X,\ \operatorname{tr}X=0\}$。$X_{1},X_{2},X_{3}$ はそれぞれ歪エルミートでトレース $0$ なので $\mathfrak{su}(2)$ に属する。実係数で $a_{1}X_{1}+a_{2}X_{2}+a_{3}X_{3}=\frac12\begin{pmatrix}-ia_{3}&-ia_{1}-a_{2}\\-ia_{1}+a_{2}&ia_{3}\end{pmatrix}=0$ なら $a_{3}=0$ で、$(1,2)$ 成分の実部・虚部から $a_{2}=a_{1}=0$。よって一次独立。$\dim\mathfrak{su}(2)=\dim\mathrm{SU}(2)=2^{2}-1=3$（\ref{lie:classical-groups}, \ref{lie:lie-algebra-of-group.3}）なので基底である。

**括弧.** 括弧は交換子である（\ref{lie:gl-lie-algebra}, \ref{lie:homomorphism-differential.2}）。直接計算すると
$$
X_{1}X_{2}=\frac14\begin{pmatrix}0&-i\\-i&0\end{pmatrix}\begin{pmatrix}0&-1\\1&0\end{pmatrix}=\frac14\begin{pmatrix}-i&0\\0&i\end{pmatrix},\qquad X_{2}X_{1}=\frac14\begin{pmatrix}0&-1\\1&0\end{pmatrix}\begin{pmatrix}0&-i\\-i&0\end{pmatrix}=\frac14\begin{pmatrix}i&0\\0&-i\end{pmatrix}
$$
で、$[X_{1},X_{2}]=\frac12\begin{pmatrix}-i&0\\0&i\end{pmatrix}=X_{3}$。同様に
$$
X_{2}X_{3}=\frac14\begin{pmatrix}0&-i\\-i&0\end{pmatrix},\quad X_{3}X_{2}=\frac14\begin{pmatrix}0&i\\i&0\end{pmatrix},\quad X_{3}X_{1}=\frac14\begin{pmatrix}0&-1\\1&0\end{pmatrix},\quad X_{1}X_{3}=\frac14\begin{pmatrix}0&1\\-1&0\end{pmatrix}
$$
から $[X_{2},X_{3}]=\frac12\begin{pmatrix}0&-i\\-i&0\end{pmatrix}=X_{1}$、$[X_{3},X_{1}]=\frac12\begin{pmatrix}0&-1\\1&0\end{pmatrix}=X_{2}$。

**同型.** \ref{lie:prob-la-so3} から $[E_{i},E_{j}]$ はベクトル積 $e_{i}\times e_{j}$ に対応し、$e_{1}\times e_{2}=e_{3}$, $e_{2}\times e_{3}=e_{1}$, $e_{3}\times e_{1}=e_{2}$ なので
$$
[E_{1},E_{2}]=E_{3},\qquad[E_{2},E_{3}]=E_{1},\qquad[E_{3},E_{1}]=E_{2}.
$$
$E_{1},E_{2},E_{3}$ は $\mathfrak{so}(3)$（3 次元）の基底なので、$f(X_{k})\defeq E_{k}$ で定まる線形写像 $f$ は線形同型。双線形性と交代性から、括弧を保つことは基底の対 $(X_{i},X_{j})$ について確かめれば十分で、$i=j$ では両辺 $0$、$i\neq j$ では上の二つの表が同じ形なので $f[X_{i},X_{j}]=[E_{i},E_{j}]=[f X_{i},f X_{j}]$。よって $f$ はリー環の同型である。
:::

::: problem ★★★ 発展：sl(2,R) は so(3) と同型でない {#lie:ex-lgl-3}
$\mathfrak{sl}(2,\mathbb{R})$ と $\mathfrak{so}(3)$ はどちらも 3 次元の実リー環であるが、同型でないことを示せ。（ヒント：$H\defeq\operatorname{diag}(1,-1)$, $E\defeq E_{12}$ について $[H,E]=2E$。）
:::

::: solution
$H,E\in\mathfrak{sl}(2,\mathbb{R})$（トレース $0$、\ref{lie:classical-lie-algebras.1}）で、$HE=E_{12}$, $EH=-E_{12}$ なので $[H,E]=HE-EH=2E$。

リー環の同型 $f\colon\mathfrak{sl}(2,\mathbb{R})\to\mathfrak{so}(3)$ があったとする。\ref{lie:prob-la-so3} の同型 $(\mathbb{R}^{3},\times)\to\mathfrak{so}(3)$ と合成すると、リー環の同型 $g\colon\mathfrak{sl}(2,\mathbb{R})\to(\mathbb{R}^{3},\times)$ が得られる。$h\defeq g(H)$, $e\defeq g(E)$ とおくと、$g$ は括弧を保つので
$$
h\times e=g([H,E])=2e,
$$
$g$ は単射で $E\neq0$ なので $e\neq0$。両辺と $e$ の内積をとると、$h\times e$ は $e$ に直交するので $0=2|e|^{2}$ となり、$e\neq0$ に矛盾する。よって同型は存在しない。

（言い換えると、$\mathfrak{so}(3)$ では各 $\mathrm{ad}(v)\colon w\mapsto v\times w$ の実固有値は $0$ だけであり、$\mathfrak{sl}(2,\mathbb{R})$ では $\mathrm{ad}(H)\colon Y\mapsto[H,Y]$ が実固有値 $2$ をもつ。リー環の同型 $g$ は $\mathrm{ad}(g(X))=g\circ\mathrm{ad}(X)\circ g^{-1}$ を満たすので、$\mathrm{ad}$ の固有値は同型で保たれる。）\ref{lie:ex-lgl-2} と合わせると、3 次元の実リー環 $\mathfrak{su}(2)\cong\mathfrak{so}(3)$ と $\mathfrak{sl}(2,\mathbb{R})$ は互いに同型でない。
:::

## 指数写像 {#lie:sec-lgx-exercises}

対応するページ：\ref{lie:page-exponential}

::: problem ★ 基本：ハイゼンベルク群の指数写像 {#lie:ex-lgx-1}
$X=aE_{12}+bE_{23}+cE_{13}\in\mathfrak{n}$ について $\exp X$ を求め、$\exp\colon\mathfrak{n}\to N$ が全単射であることを示せ。さらに $X,Y\in\mathfrak{n}$ について
$$
\exp X\exp Y=\exp\Bigl(X+Y+\frac12[X,Y]\Bigr)
$$
を確かめよ。
:::

::: solution
$N$ は $\mathrm{GL}(3,\mathbb{R})$ の部分群かつ部分多様体（\ref{lie:ex-lgb-1}）なので、\ref{lie:exp-natural} と \ref{lie:exp-gl} から $\exp X=e^{X}$（行列の指数関数）。$E_{ij}E_{kl}=\delta_{jk}E_{il}$ から、9 個の積 $E_{ab}E_{cd}$（$E_{ab},E_{cd}\in\{E_{12},E_{23},E_{13}\}$）のうち $0$ でないのは $E_{12}E_{23}=E_{13}$ だけで、
$$
X^{2}=abE_{13},\qquad X^{3}=X\cdot abE_{13}=ab(aE_{12}E_{13}+bE_{23}E_{13}+cE_{13}E_{13})=0.
$$
よって
$$
\exp X=I+X+\frac12X^{2}=I+aE_{12}+bE_{23}+\Bigl(c+\frac{ab}{2}\Bigr)E_{13}=\begin{pmatrix}1&a&c+\frac{ab}{2}\\0&1&b\\0&0&1\end{pmatrix}.
$$
**全単射.** $n(x,y,z)\in N$ について $\exp X=n(x,y,z)$ は $a=x$, $b=y$, $c+\frac{ab}{2}=z$ と同値で、これは $(a,b,c)=(x,y,z-\frac{xy}{2})$ というただ一つの解をもつ。

**積の公式.** $Y=a'E_{12}+b'E_{23}+c'E_{13}$ とする。\ref{lie:ex-lgb-1} の積の式から、$\exp X\exp Y=n\bigl(a,b,c+\frac{ab}{2}\bigr)\,n\bigl(a',b',c'+\frac{a'b'}{2}\bigr)$ の $(1,3)$ 成分は
$$
c+c'+\frac{ab}{2}+\frac{a'b'}{2}+ab'
$$
で、$(1,2)$, $(2,3)$ 成分は $a+a'$, $b+b'$。一方 \ref{lie:ex-lgl-1} から $[X,Y]=(ab'-a'b)E_{13}$ なので、$Z\defeq X+Y+\frac12[X,Y]$ の係数は $(a+a',\ b+b',\ c+c'+\frac12(ab'-a'b))$ で、上の公式から $\exp Z$ の $(1,3)$ 成分は
$$
c+c'+\frac12(ab'-a'b)+\frac12(a+a')(b+b')=c+c'+\frac{ab}{2}+\frac{a'b'}{2}+ab'.
$$
$(1,2)$, $(2,3)$ 成分も一致するので、$\exp X\exp Y=\exp Z$。
:::

::: problem ★★ 標準：回転の指数表示 {#lie:ex-lgx-2}
単位ベクトル $u\in\mathbb{R}^{3}$ について $K\defeq\sum_{k}u_{k}E_{k}$（つまり $Kw=u\times w$）とおく。
1. $\theta\in\mathbb{R}$ について $e^{\theta K}=I+\sin\theta\,K+(1-\cos\theta)K^{2}$ を示せ。
2. $\exp\colon\mathfrak{so}(3)\to\mathrm{SO}(3)$ が全射であることを示せ。
:::

::: solution
**1.** $w\in\mathbb{R}^{3}$ について、ベクトル三重積の公式 $u\times(u\times w)=u(u\cdot w)-w(u\cdot u)$ と $|u|=1$ から $K^{2}w=u(u\cdot w)-w$。さらに $u\times u=0$ から
$$
K^{3}w=u\times\bigl(u(u\cdot w)-w\bigr)=-u\times w=-Kw.
$$
よって $K^{3}=-K$ で、帰納的に $K^{2m+1}=(-1)^{m}K$（$m\ge0$）、$K^{2m}=(-1)^{m-1}K^{2}$（$m\ge1$）。$e^{\theta K}$ の級数は成分ごとに絶対収束する（\ref{lin:matrix-exponential.1}）ので、奇数次と偶数次に分けて
$$
e^{\theta K}=I+\Bigl(\sum_{m\ge0}\frac{(-1)^{m}\theta^{2m+1}}{(2m+1)!}\Bigr)K+\Bigl(\sum_{m\ge1}\frac{(-1)^{m-1}\theta^{2m}}{(2m)!}\Bigr)K^{2}=I+\sin\theta\,K+(1-\cos\theta)K^{2}.
$$

**2.** $\mathfrak{so}(3)$ の指数写像は行列の指数関数である（\ref{lie:exp-natural}, \ref{lie:exp-gl}）。$A\in\mathrm{SO}(3)$ をとる。

【主張：$A$ は固有値 $1$ をもつ】$A^{\mathsf{T}}A=I$ から $A-I=A(I-A^{\mathsf{T}})$ で、$\det A=1$ から
$$
\det(A-I)=\det(I-A^{\mathsf{T}})=\det\bigl((I-A)^{\mathsf{T}}\bigr)=\det(I-A)=(-1)^{3}\det(A-I),
$$
よって $\det(A-I)=0$。$Au=u$, $|u|=1$ となる $u$ をとる。

【主張：基底の選び方】$u$ に直交する単位ベクトル $v_{1}$ をとり、$v_{2}\defeq u\times v_{1}$ とする。$(v_{1},v_{2},u)$ は正規直交基底で、三重積の公式から $v_{1}\times v_{2}=v_{1}\times(u\times v_{1})=u$。よって $P\defeq(v_{1}\ v_{2}\ u)$（列に並べた行列）は直交行列で $\det P=(v_{1}\times v_{2})\cdot u=1$。

【主張：$P^{\mathsf{T}}AP=\operatorname{diag}(R,1)$, $R\in\mathrm{SO}(2)$】$A$ は直交行列で $u$ を固定するので、$w\perp u$ なら $Aw\cdot u=Aw\cdot Au=w\cdot u=0$。よって $P^{\mathsf{T}}AP$ の第 3 列は $e_{3}$、第 1, 2 列の第 3 成分は $0$ で、$P^{\mathsf{T}}AP=\operatorname{diag}(R,1)$ と書ける。$P^{\mathsf{T}}AP$ は直交行列なので $R\in\mathrm{O}(2)$、$\det R=\det A=1$ から $R\in\mathrm{SO}(2)$。\ref{lie:prob-lb-so2-u1} の解答から $R=\begin{pmatrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{pmatrix}$ となる $\theta$ がある。

【主張：$e^{\theta K}=A$】$Kv_{1}=u\times v_{1}=v_{2}$, $Kv_{2}=u\times(u\times v_{1})=u(u\cdot v_{1})-v_{1}=-v_{1}$, $Ku=0$ なので、$J\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ について $P^{\mathsf{T}}KP=\operatorname{diag}(J,0)$。\ref{lin:matrix-exponential.2}（$P^{-1}=P^{\mathsf{T}}$）と、ブロック対角行列の冪がブロックごとの冪であることから
$$
P^{\mathsf{T}}e^{\theta K}P=e^{\theta P^{\mathsf{T}}KP}=\operatorname{diag}(e^{\theta J},1)=\operatorname{diag}(R,1)=P^{\mathsf{T}}AP.
$$
ここで $e^{\theta J}=\cos\theta\,I+\sin\theta\,J=R$ は \ref{lie:prob-ex-so2} の計算。よって $A=e^{\theta K}=\exp(\theta K)$ で、$\theta K\in\mathfrak{so}(3)$。$A$ は任意なので $\exp$ は全射。
:::

::: problem ★★★ 発展：SU(2) から SO(3) への二重被覆 {#lie:ex-lgx-3}
$\mathfrak{su}(2)$ に $\langle X,Y\rangle\defeq-2\operatorname{tr}(XY)$ を入れ、$g\in\mathrm{SU}(2)$ について $\rho(g)\in M_{3}(\mathbb{R})$ を、$\mathrm{Ad}(g)X=gXg^{-1}$ の基底 $X_{1},X_{2},X_{3}$ に関する行列とする。$\rho$ は $\mathrm{SU}(2)$ から $\mathrm{SO}(3)$ への全射なリー群の準同型で、核が $\{\pm I\}$ であることを示せ。
:::

::: solution
**Step 1（内積）.** 記法の節の行列から $X_{k}^{2}=-\frac14I$、$j\neq k$ では $X_{j}X_{k}$ の対角成分は $0$（\ref{lie:ex-lgl-2} の解答の計算）なので、$\operatorname{tr}(X_{j}X_{k})=-\frac12\delta_{jk}$。よって $X=\sum a_{j}X_{j}$, $Y=\sum b_{k}X_{k}$（$a_{j},b_{k}\in\mathbb{R}$）について $\langle X,Y\rangle=\sum_{k}a_{k}b_{k}$ で、$\langle\ ,\ \rangle$ は $X_{1},X_{2},X_{3}$ を正規直交基底とする内積である。

**Step 2（$\rho$ は $\mathrm{O}(3)$ への滑らかな準同型）.** $g\in\mathrm{SU}(2)$ では $g^{-1}=g^{*}$ で、$X\in\mathfrak{su}(2)$ なら $(gXg^{*})^{*}=gX^{*}g^{*}=-gXg^{*}$, $\operatorname{tr}(gXg^{-1})=\operatorname{tr}X=0$ なので、$\mathrm{Ad}(g)$ は $\mathfrak{su}(2)$ の線形変換（\ref{lie:adjoint-properties.2}）。$\operatorname{tr}(gXg^{-1}gYg^{-1})=\operatorname{tr}(XY)$ から $\mathrm{Ad}(g)$ は内積を保ち、正規直交基底に関する行列 $\rho(g)$ は直交行列。$\mathrm{Ad}(gh)=\mathrm{Ad}(g)\mathrm{Ad}(h)$ なので $\rho$ は準同型。成分 $\rho(g)_{jk}=\langle X_{j},gX_{k}g^{*}\rangle$ は $g$ の成分の実部・虚部の多項式なので、$\rho\colon\mathrm{SU}(2)\to\mathrm{GL}(3,\mathbb{R})$ は滑らか。

**Step 3（微分）.** $X\in\mathfrak{su}(2)$ について、$M_{2}(\mathbb{C})=\mathbb{R}^{8}$ と同一視して $\mathrm{SU}(2)\subset\mathrm{GL}(2,\mathbb{C})\subset\mathrm{GL}(4,\mathbb{R})$ とみると、$\mathrm{SU}(2)$ の指数写像は行列の指数関数（\ref{lie:exp-natural} の後の注意）で、$t\mapsto e^{tX}$ の $t=0$ での速度は $X$（\ref{lie:exponential-properties.2}）。連鎖律と \ref{lie:adjoint-properties.2} から、$\rho_{*}X=\frac{d}{dt}\rho(e^{tX})\big|_{t=0}$ は線形写像 $Y\mapsto[X,Y]$ の行列である。\ref{lie:ex-lgl-2} の括弧の表と、$E_{k}e_{j}=e_{k}\times e_{j}$ の表が同じ形なので、$\rho_{*}X_{k}=E_{k}$。よって $\rho_{*}\colon\mathfrak{su}(2)\to\mathfrak{so}(3)$ は線形同型で、\ref{lie:ex-lgl-2} の同型そのものである。

**Step 4（像は $\mathrm{SO}(3)$ に含まれる）.** $\mathrm{SU}(2)$ の元 $g$ の第 1 列 $(a,b)$ は単位ベクトルで、第 2 列はそれにエルミート内積で直交する単位ベクトルなので $\lambda(-\bar b,\bar a)$（$|\lambda|=1$）の形、$\det g=\lambda(|a|^{2}+|b|^{2})=\lambda=1$。よって
$$
\mathrm{SU}(2)=\Bigl\{\begin{pmatrix}a&-\bar b\\b&\bar a\end{pmatrix}:|a|^{2}+|b|^{2}=1\Bigr\}
$$
で、$g\mapsto(a,b)$ は $\mathrm{SU}(2)$ から $S^{3}\subset\mathbb{C}^{2}$ への同相写像（逆も連続）。$S^{3}$ は弧状連結（対蹠点でない 2 点は線分を正規化した道で結べ、対蹠点は第 3 の点を経由する）なので $\mathrm{SU}(2)$ も弧状連結。$\det\circ\rho$ は連続で値は $\{\pm1\}$（Step 2）、$\det\rho(I)=1$ なので、$\det\rho\equiv1$。よって $\rho(\mathrm{SU}(2))\subset\mathrm{SO}(3)$。

**Step 5（全射）.** $A\in\mathrm{SO}(3)$ について、\ref{lie:ex-lgx-2} から $A=e^{Z}$ となる $Z\in\mathfrak{so}(3)$ がある。Step 3 から $Z=\rho_{*}X$ となる $X\in\mathfrak{su}(2)$ があり、\ref{lie:exp-natural}（$\rho$ を $\mathrm{GL}(3,\mathbb{R})$ への準同型とみる）と \ref{lie:exp-gl} から $\rho(e^{X})=e^{\rho_{*}X}=e^{Z}=A$。

**Step 6（核）.** $\rho(g)=I$ は、すべての $k$ で $gX_{k}g^{-1}=X_{k}$、つまり $g$ が $X_{1},X_{3}$（と $X_{2}$）と可換であることと同値。$2iX_{3}=\operatorname{diag}(1,-1)$ と可換なら、$(1,2)$ 成分を比べて $-g_{12}=g_{12}$、$(2,1)$ 成分から $g_{21}=-g_{21}$ で、$g=\operatorname{diag}(p,q)$。$2iX_{1}=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ と可換なら $\begin{pmatrix}0&p\\q&0\end{pmatrix}=\begin{pmatrix}0&q\\p&0\end{pmatrix}$ で $p=q$。$\det g=p^{2}=1$ から $g=\pm I$。逆に $\pm I$ はすべての行列と可換なので核に属する。よって核は $\{\pm I\}$。
:::

## 閉部分群定理 {#lie:sec-lgc-exercises}

対応するページ：\ref{lie:page-closed-subgroups}

::: problem ★ 基本：ベクトルの等方部分群 {#lie:ex-lgc-1}
$H\defeq\{A\in\mathrm{GL}(n,\mathbb{R}):Ae_{1}=e_{1}\}$ はリー群で、そのリー環が $\{X\in M_{n}(\mathbb{R}):Xe_{1}=0\}$（次元 $n^{2}-n$）であることを示せ。
:::

::: solution
$\mathrm{GL}(n,\mathbb{R})$ の $\mathbb{R}^{n}$ への作用 $(A,v)\mapsto Av$ は滑らか（\ref{lie:matrix-lie-groups.4}）で、$H$ は $e_{1}$ の等方部分群なので、\ref{lie:closed-subgroup-corollaries.3} から閉部分群でリー群。\ref{lie:closed-subgroup-corollaries.1} から、そのリー環は $\{X:\text{すべての }t\text{ で }e^{tX}e_{1}=e_{1}\}$ である。

$Xe_{1}=0$ なら $m\ge1$ で $X^{m}e_{1}=0$ なので、$e^{tX}e_{1}=\sum_{m\ge0}\frac{t^{m}}{m!}X^{m}e_{1}=e_{1}$。逆にすべての $t$ で $e^{tX}e_{1}=e_{1}$ なら、$t=0$ で微分して（\ref{lin:matrix-exponential.5}）$Xe_{1}=0$。よってリー環は $\{X:Xe_{1}=0\}$、つまり第 1 列が $0$ の行列の全体で、次元は $n^{2}-n$。
:::

::: problem ★★ 標準：ユークリッド運動群 {#lie:ex-lgc-2}
$\mathrm{E}(n)\defeq\Bigl\{\begin{pmatrix}A&b\\0&1\end{pmatrix}:A\in\mathrm{O}(n),\ b\in\mathbb{R}^{n}\Bigr\}\subset\mathrm{GL}(n+1,\mathbb{R})$ は閉部分群で、そのリー環は
$$
\mathfrak{e}(n)=\Bigl\{\begin{pmatrix}X&v\\0&0\end{pmatrix}:X^{\mathsf{T}}=-X,\ v\in\mathbb{R}^{n}\Bigr\}
$$
（次元 $\frac{n(n+1)}{2}$）であることを示せ。
:::

::: solution
$[A,b]\defeq\begin{pmatrix}A&b\\0&1\end{pmatrix}$ と書く。$\det[A,b]=\det A=\pm1$ なので $\mathrm{E}(n)\subset\mathrm{GL}(n+1,\mathbb{R})$。

**部分群.** $[A,b][A',b']=[AA',Ab'+b]$、$[A,b][A^{-1},-A^{-1}b]=[I,0]$ で、$\mathrm{O}(n)$ が部分群であることから $\mathrm{E}(n)$ も部分群。

**閉.** $[A_{k},b_{k}]\to C$（$C\in\mathrm{GL}(n+1,\mathbb{R})$）なら、$C$ の最後の行は $(0,\dots,0,1)$ で、左上のブロックは $A_{k}$ の極限。$\mathrm{O}(n)$ は閉集合（\ref{lie:matrix-lie-groups.3} の証明）なのでその極限は $\mathrm{O}(n)$ に属し、$C\in\mathrm{E}(n)$。

**リー環.** \ref{lie:closed-subgroup-corollaries.1} から、リー環は $\{Z:\text{すべての }t\text{ で }e^{tZ}\in\mathrm{E}(n)\}$。

$\supset$：$Z=\begin{pmatrix}X&v\\0&0\end{pmatrix}$, $X^{\mathsf{T}}=-X$ とする。帰納法で $m\ge1$ について $Z^{m}=\begin{pmatrix}X^{m}&X^{m-1}v\\0&0\end{pmatrix}$ なので
$$
e^{tZ}=\begin{pmatrix}e^{tX}&\sum_{m\ge1}\frac{t^{m}}{m!}X^{m-1}v\\0&1\end{pmatrix}.
$$
\ref{lie:orthogonal-via-cartan} から $e^{tX}\in\mathrm{O}(n)$ なので $e^{tZ}\in\mathrm{E}(n)$。

$\subset$：すべての $t$ で $e^{tZ}=[A(t),b(t)]\in\mathrm{E}(n)$ とする。$Z=\frac{d}{dt}e^{tZ}\big|_{t=0}$（\ref{lin:matrix-exponential.5}）で、最後の行は定数 $(0,\dots,0,1)$ なのでその微分は $0$。$A(t)$ は $A(0)=I$ を満たす $\mathrm{O}(n)$ の中の滑らかな曲線で、$A(t)^{\mathsf{T}}A(t)=I$ を $t=0$ で微分すると $A'(0)^{\mathsf{T}}+A'(0)=0$。よって $Z=\begin{pmatrix}A'(0)&b'(0)\\0&0\end{pmatrix}\in\mathfrak{e}(n)$。

次元は $\dim\mathfrak{so}(n)+n=\frac{n(n-1)}{2}+n=\frac{n(n+1)}{2}$。
:::

::: problem ★★★ 発展：R と U(1) の閉部分群 {#lie:ex-lgc-3}
1. 加法群 $\mathbb{R}$ の閉部分群は $\{0\}$, $c\mathbb{Z}$（$c>0$）, $\mathbb{R}$ のいずれかであることを、\ref{lie:closed-subgroup-theorem} を使って示せ。
2. $\mathrm{U}(1)$ の閉部分群は、$\mathrm{U}(1)$ 自身と、$1$ の $n$ 乗根の群 $\mu_{n}\defeq\{\omega:\omega^{n}=1\}$（$n\ge1$）だけであることを示せ。
:::

::: solution
**1.** $\mathbb{R}$ は 1 次元のリー群で、リー環は $T_{0}\mathbb{R}=\mathbb{R}$。$X\in\mathbb{R}$ について $t\mapsto tX$ は滑らかな準同型で $t=0$ での速度は $X$ なので、\ref{lie:invariant-field-complete.3} から $\exp(tX)=tX$。$H$ を閉部分群とし、$\mathfrak{h}\defeq\{X:\text{すべての }t\text{ で }tX\in H\}$ とする。$X\neq0$ が $\mathfrak{h}$ に属せば $H\supset\{tX\}=\mathbb{R}$。よって $\mathfrak{h}\neq0$ なら $H=\mathbb{R}$。

$\mathfrak{h}=0$ とする。\ref{lie:closed-subgroup-theorem.2} から $H$ は $0$ 次元の部分多様体で、スライス座標近傍の条件（$k=0$）から、各 $h\in H$ に開近傍 $V_{h}$ で $V_{h}\cap H=\{h\}$ となるものがある。$M>0$ について $H\cap[-M,M]$ はコンパクト（有界閉集合）で、開被覆 $\{V_{h}\}_{h\in H\cap[-M,M]}$ の有限部分被覆があり、各 $V_{h}$ は $H$ の点を一つしか含まないので、$H\cap[-M,M]$ は有限集合。$H=\{0\}$ でなければ、$h\neq0$ と $-h$ のどちらかが正なので $H\cap(0,\infty)\neq\varnothing$。$M$ を大きくとれば $H\cap(0,M]$ は空でない有限集合で、その最小元 $c>0$ は $H\cap(0,\infty)$ の最小元である。$h\in H$ について $m\defeq\lfloor h/c\rfloor$ とすると $h-mc\in H\cap[0,c)$ で、$c$ の最小性から $h-mc=0$。よって $H\subset c\mathbb{Z}$、$c\in H$ から $H=c\mathbb{Z}$。

**2.** $p\colon\mathbb{R}\to\mathrm{U}(1)$, $p(t)\defeq e^{it}$ は連続な全射準同型で、$\ker p=2\pi\mathbb{Z}$。$K\subset\mathrm{U}(1)$ を閉部分群とすると、$p^{-1}(K)$ は $2\pi\mathbb{Z}$ を含む $\mathbb{R}$ の閉部分群で、1 から $\mathbb{R}$ か $c\mathbb{Z}$（$\{0\}$ は $2\pi$ を含まないので除かれる）。$p^{-1}(K)=\mathbb{R}$ なら、$p$ は全射なので $K=p(p^{-1}(K))=\mathrm{U}(1)$。$p^{-1}(K)=c\mathbb{Z}$ なら $2\pi\in c\mathbb{Z}$ から $2\pi=nc$（$n\ge1$）で、
$$
K=p(c\mathbb{Z})=\{e^{2\pi ik/n}:k\in\mathbb{Z}\}=\mu_{n}.
$$
逆に $\mathrm{U}(1)$ と $\mu_{n}$ は閉部分群（$\mu_{n}$ は有限集合）。
:::

## 等質空間 {#lie:sec-lgh-exercises}

対応するページ：\ref{lie:page-homogeneous-spaces}

::: problem ★ 基本：穴あき空間 {#lie:ex-lgh-1}
$\mathbb{R}^{n}\setminus\{0\}$ が $\mathrm{GL}(n,\mathbb{R})/H$（$H$ は \ref{lie:ex-lgc-1} の等方部分群）と微分同相であることを示し、次元が一致することを確かめよ。
:::

::: solution
$\mathbb{R}^{n}\setminus\{0\}$ は $\mathbb{R}^{n}$ の開集合で可微分多様体。$A$ は可逆なので $v\neq0$ なら $Av\neq0$ で、作用 $(A,v)\mapsto Av$（\ref{lie:matrix-lie-groups.4}）は $\mathbb{R}^{n}\setminus\{0\}$ への滑らかな作用を与える。推移性：$v\neq0$ を第 1 元とする $\mathbb{R}^{n}$ の基底をとり、それを列に並べた行列 $A$ は可逆で $Ae_{1}=v$。$e_{1}$ の等方部分群は定義から $H$。\ref{lie:homogeneous-diffeo} から $\mathrm{GL}(n,\mathbb{R})/H\to\mathbb{R}^{n}\setminus\{0\}$, $AH\mapsto Ae_{1}$ は微分同相写像。次元は \ref{lie:coset-manifold.1} と \ref{lie:ex-lgc-1} から $n^{2}-(n^{2}-n)=n$ で、$\dim(\mathbb{R}^{n}\setminus\{0\})=n$ と一致する。
:::

::: problem ★★ 標準：上半平面 {#lie:ex-lgh-2}
$\mathbb{H}\defeq\{z\in\mathbb{C}:\operatorname{Im}z>0\}$ とし、$g=\begin{pmatrix}a&b\\c&d\end{pmatrix}\in\mathrm{SL}(2,\mathbb{R})$ について $g\cdot z\defeq\frac{az+b}{cz+d}$ とする。これが $\mathrm{SL}(2,\mathbb{R})$ の $\mathbb{H}$ への滑らかで推移的な作用であり、$\mathbb{H}\cong\mathrm{SL}(2,\mathbb{R})/\mathrm{SO}(2)$ であることを示せ。
:::

::: solution
**well-defined.** $z=x+iy$, $y>0$ とする。$c\neq0$ なら $\operatorname{Im}(cz+d)=cy\neq0$、$c=0$ なら $ad=1$ から $d\neq0$。よって $cz+d\neq0$。さらに
$$
\operatorname{Im}(g\cdot z)=\frac{\operatorname{Im}\bigl((az+b)(c\bar z+d)\bigr)}{|cz+d|^{2}}=\frac{\operatorname{Im}(adz+bc\bar z)}{|cz+d|^{2}}=\frac{(ad-bc)\,y}{|cz+d|^{2}}=\frac{y}{|cz+d|^{2}}>0
$$
（$ac|z|^{2}$, $bd$ は実数）なので $g\cdot z\in\mathbb{H}$。

**作用.** $I\cdot z=z$。$g\begin{pmatrix}z\\1\end{pmatrix}=\begin{pmatrix}az+b\\cz+d\end{pmatrix}=(cz+d)\begin{pmatrix}g\cdot z\\1\end{pmatrix}$ である。$h\in\mathrm{SL}(2,\mathbb{R})$ について、これを二回使うと
$$
hg\begin{pmatrix}z\\1\end{pmatrix}=(cz+d)\,h\begin{pmatrix}g\cdot z\\1\end{pmatrix}=(cz+d)\lambda\begin{pmatrix}h\cdot(g\cdot z)\\1\end{pmatrix}\qquad(\lambda\neq0)
$$
で、左辺は同じ式から $\mu\begin{pmatrix}(hg)\cdot z\\1\end{pmatrix}$（$\mu\neq0$）。第 2 成分を比べて $\mu=(cz+d)\lambda$、第 1 成分から $(hg)\cdot z=h\cdot(g\cdot z)$。

**滑らかさ.** $g\cdot z$ の実部と虚部は $\frac{(az+b)(c\bar z+d)}{|cz+d|^{2}}$ の実部と虚部で、$(a,b,c,d,x,y)$ の多項式を $0$ にならない多項式 $|cz+d|^{2}$ で割ったもの。よって $\mathrm{SL}(2,\mathbb{R})\times\mathbb{H}\to\mathbb{H}$ は滑らか（$\mathrm{SL}(2,\mathbb{R})\subset M_{2}(\mathbb{R})$ は部分多様体で、包含写像は滑らか）。

**推移性.** $x+iy\in\mathbb{H}$ について $g\defeq\begin{pmatrix}\sqrt y&x/\sqrt y\\0&1/\sqrt y\end{pmatrix}$ は $\det g=1$ で、$g\cdot i=\frac{\sqrt y\,i+x/\sqrt y}{1/\sqrt y}=x+iy$。

**等方部分群.** $g\cdot i=i$ は $ai+b=i(ci+d)=-c+di$、つまり $a=d$, $b=-c$ と同値。このとき $\det g=a^{2}+b^{2}=1$ で $g=\begin{pmatrix}a&b\\-b&a\end{pmatrix}$。$\mathrm{SO}(2)$ の元は $\begin{pmatrix}p&-q\\q&p\end{pmatrix}$, $p^{2}+q^{2}=1$ の形（\ref{lie:prob-lb-so2-u1} の解答）なので、$p=a$, $q=-b$ として等方部分群は $\mathrm{SO}(2)$ に等しい。

\ref{lie:homogeneous-diffeo} から $\mathrm{SL}(2,\mathbb{R})/\mathrm{SO}(2)\to\mathbb{H}$, $g\,\mathrm{SO}(2)\mapsto g\cdot i$ は微分同相写像。次元は $3-1=2$ で（\ref{lie:classical-groups.1}, \ref{lie:coset-manifold.1}）、$\mathbb{H}\subset\mathbb{R}^{2}$ の次元と一致する。
:::

::: problem ★★★ 発展：ホップ・ファイブレーション {#lie:ex-lgh-3}
\ref{lie:ex-lgx-3} の $\rho$ によって $\mathrm{SU}(2)$ は $S^{2}\subset\mathbb{R}^{3}$ に $(g,y)\mapsto\rho(g)y$ で作用する。$T\defeq\{\operatorname{diag}(\lambda,\bar\lambda):|\lambda|=1\}$ とおく。$S^{2}\cong\mathrm{SU}(2)/T$ を示し、$g=\begin{pmatrix}a&-\bar b\\b&\bar a\end{pmatrix}$ について
$$
\rho(g)e_{3}=\bigl(2\operatorname{Re}(\bar ab),\ 2\operatorname{Im}(\bar ab),\ |a|^{2}-|b|^{2}\bigr)
$$
を確かめよ。これから、$S^{3}\to S^{2}$, $(a,b)\mapsto\bigl(2\operatorname{Re}(\bar ab),2\operatorname{Im}(\bar ab),|a|^{2}-|b|^{2}\bigr)$ が主 $\mathrm{U}(1)$ 束であることを導け。
:::

::: solution
**作用.** $\rho(g)\in\mathrm{SO}(3)$ は長さを保つので $S^{2}$ を $S^{2}$ に移し、$\rho$ は準同型なので作用の公理を満たす。$(g,y)\mapsto\rho(g)y$ は $\mathrm{SU}(2)\times\mathbb{R}^{3}\to\mathbb{R}^{3}$ として滑らか（$\rho$ は滑らか、\ref{lie:ex-lgx-3}）で、値が部分多様体 $S^{2}$ に入るので $\mathrm{SU}(2)\times S^{2}\to S^{2}$ として滑らか（\ref{mfd:submanifold-structure.3}）。

**推移性.** $\mathrm{SO}(3)$ は $S^{2}$ に推移的に作用し（\ref{lie:homogeneous-examples.1} で $n=3$）、$\rho$ は $\mathrm{SO}(3)$ への全射（\ref{lie:ex-lgx-3}）なので、$\mathrm{SU}(2)$ も推移的に作用する。

**等方部分群.** $e_{3}$ は $X_{3}$ の座標なので、$\rho(g)e_{3}=e_{3}$ は $gX_{3}g^{-1}=X_{3}$、つまり $g$ が $2iX_{3}=\operatorname{diag}(1,-1)$ と可換であることと同値。\ref{lie:ex-lgx-3} の Step 6 と同じ計算で、これは $g$ が対角であることと同値で、$g=\operatorname{diag}(\lambda,\mu)\in\mathrm{SU}(2)$ なら $|\lambda|=1$, $\lambda\mu=1$ から $\mu=\bar\lambda$。よって等方部分群は $T$。

\ref{lie:homogeneous-diffeo} から $F\colon\mathrm{SU}(2)/T\to S^{2}$, $gT\mapsto\rho(g)e_{3}$ は微分同相写像で、次元は $3-1=2$。

**公式.** $\rho(g)e_{3}=(y_{1},y_{2},y_{3})$ は $gX_{3}g^{-1}=\sum_{k}y_{k}X_{k}$ で定まる。$2i\sum_{k}y_{k}X_{k}=\begin{pmatrix}y_{3}&y_{1}-iy_{2}\\y_{1}+iy_{2}&-y_{3}\end{pmatrix}$ で、$2iX_{3}=\operatorname{diag}(1,-1)$, $g^{-1}=g^{*}=\begin{pmatrix}\bar a&\bar b\\-b&a\end{pmatrix}$ から
$$
g\begin{pmatrix}1&0\\0&-1\end{pmatrix}g^{*}=\begin{pmatrix}a&\bar b\\b&-\bar a\end{pmatrix}\begin{pmatrix}\bar a&\bar b\\-b&a\end{pmatrix}=\begin{pmatrix}|a|^{2}-|b|^{2}&2a\bar b\\2\bar ab&|b|^{2}-|a|^{2}\end{pmatrix}.
$$
$(1,1)$ 成分と $(2,1)$ 成分を比べて $y_{3}=|a|^{2}-|b|^{2}$, $y_{1}+iy_{2}=2\bar ab$。

**主束.** \ref{lie:coset-principal-bundle} から $\pi\colon\mathrm{SU}(2)\to\mathrm{SU}(2)/T$ は主 $T$ 束で、微分同相写像 $F$ で移すと $F\circ\pi\colon\mathrm{SU}(2)\to S^{2}$, $g\mapsto\rho(g)e_{3}$ は主 $T$ 束（局所自明化 $\Psi_{g}$ を $F$ で移したものがアトラスになる）。$T\cong\mathrm{U}(1)$（$\operatorname{diag}(\lambda,\bar\lambda)\mapsto\lambda$ はリー群の同型）。\ref{lie:ex-lgx-3} の Step 4 の同相写像 $g\mapsto(a,b)$ は、$\mathrm{SU}(2)$ と $S^{3}\subset\mathbb{C}^{2}$ の間の微分同相写像でもある（両向きとも成分の実部・虚部の一次式の制限）。これで $\mathrm{SU}(2)$ を $S^{3}$ と同一視すると、$F\circ\pi$ はちょうど問題の写像 $(a,b)\mapsto\bigl(2\operatorname{Re}(\bar ab),2\operatorname{Im}(\bar ab),|a|^{2}-|b|^{2}\bigr)$ で、右作用は $g\cdot\operatorname{diag}(\lambda,\bar\lambda)$ の第 1 列 $(\lambda a,\lambda b)$、つまり $(a,b)\mapsto(\lambda a,\lambda b)$ である。よってこの写像は主 $\mathrm{U}(1)$ 束で、各ファイバーは円周 $\{(\lambda a,\lambda b):|\lambda|=1\}$ である。
:::
