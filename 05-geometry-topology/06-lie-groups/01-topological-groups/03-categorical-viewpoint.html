# 位相群とリー群の圏論的な見方 {#top:page-tg-categorical keywords="group object in a category with finite products, topological groups as group objects in Top, Lie groups as group objects in smooth manifolds, abelian groups as group objects in Grp, group objects represent group-valued functors, limits of topological groups, Hausdorff quotient as a reflection"}

群の定義は、集合と写像の言葉だけでなく「直積と、直積から出る射の可換図式」だけで書ける。そこで、有限直積をもつ任意の圏で**群対象**が定義でき、集合の圏では群、位相空間の圏では位相群、可微分多様体の圏ではリー群、群の圏ではアーベル群になる。このページでは、この見方を述べ、位相群の圏の極限と、ハウスドルフ化が随伴（反映）であることを示す。

## 記法と定義の確認 {#top:sec-tgc-notation}

::: notation
- 圏・関手・極限・直積・終対象は \ref{cat:limit}、\ref{cat:product}。\ref{cat:yoneda-lemma}、表現可能関手は \ref{cat:representable-functor}、反映的部分圏は \ref{cat:reflective-subcategory}、極限の創出は \ref{cat:create-limits}。モノイダル圏のモノイドは \ref{cat:monoid-object}。
- $\mathbf{Set}$, $\mathbf{Top}$, $\mathbf{Grp}$ は集合・位相空間・群の圏。$\mathbf{Diff}$ は可微分多様体（\ref{mfd:smooth-manifold}）と滑らかな写像（\ref{mfd:smooth-map}）の圏。$\mathbf{Diff}$ の直積は積多様体（\ref{mfd:manifold-examples.5}）、終対象は 1 点（0 次元の多様体）。
- 位相群は \ref{top:topological-group}。$\mathbf{TopGrp}$ は位相群と連続な準同型の圏。
- 有限直積をもつ圏 $\mathbf{C}$ で、$1$ を終対象、$!_{X}\colon X\to1$ を唯一の射、$\Delta_{X}=(\mathrm{id},\mathrm{id})\colon X\to X\times X$ を対角射とする。
:::

## 群対象 {#top:sec-tgc-group-objects}

::: definition 群対象 {#top:group-object keywords="group object in a category with finite products: multiplication, unit, inverse satisfying associativity, unit and inverse laws as commutative diagrams; homomorphism of group objects" index="群対象|ぐんたいしょう, 内部群|ないぶぐん"}
有限直積をもつ圏 $\mathbf{C}$ の**群対象**とは、対象 $G$ と射 $\mu\colon G\times G\to G$（積）、$\eta\colon1\to G$（単位元）、$\iota\colon G\to G$（逆元）の組で、
$$
\mu\circ(\mu\times\mathrm{id})=\mu\circ(\mathrm{id}\times\mu),\quad\mu\circ(\eta\circ!_{G},\mathrm{id})=\mathrm{id}=\mu\circ(\mathrm{id},\eta\circ!_{G}),\quad\mu\circ(\iota,\mathrm{id})=\eta\circ!_{G}=\mu\circ(\mathrm{id},\iota)
$$
を満たすものをいう（最初の式は $(G\times G)\times G\cong G\times(G\times G)$ で同一視する）。つまり、直積を積とするモノイダル圏 $(\mathbf{C},\times,1)$ のモノイド（\ref{cat:monoid-object}）で、逆元の射をもつものである。群対象の**準同型**とは、射 $f\colon G\to H$ で $f\circ\mu_{G}=\mu_{H}\circ(f\times f)$ を満たすものをいう。群対象の圏を $\mathbf{Grp}(\mathbf{C})$ と書く。
:::

::: intuition
群の公理「結合法則・単位元・逆元」を、元を一つも使わずに、写像の合成の等式として書いたものである。そう書けば、集合以外の「空間の圏」の中でも群が考えられる。
:::

::: proposition 群対象の例 {#top:group-object-examples keywords="group objects in Set are groups, in Top are topological groups, in Diff are Lie groups, in Grp are abelian groups" index="リー群|りーぐん"}
1. $\mathbf{Grp}(\mathbf{Set})$ は群の圏 $\mathbf{Grp}$ と同じものである。
2. $\mathbf{Grp}(\mathbf{Top})$ は $\mathbf{TopGrp}$ と同じものである。
3. $\mathbf{Grp}(\mathbf{Diff})$ の対象は、群 $G$ と $G$ 上の可微分多様体の構造の組で、積 $G\times G\to G$ と逆元 $G\to G$ が滑らかなもの、すなわち**リー群**である。
4. $\mathbf{Grp}(\mathbf{Grp})$ はアーベル群の圏と同じものである。
:::

::: proof
**1.** $\mathbf{Set}$ の終対象は 1 点集合で、$\eta$ は元 $e\defeq\eta(\ast)$ を選ぶことと同じ。定義の等式を元 $(x,y,z)$, $x$ で評価すると、$(xy)z=x(yz)$、$ex=x=xe$、$x^{-1}x=e=xx^{-1}$ になる（$\iota(x)=x^{-1}$）。準同型の条件は $f(xy)=f(x)f(y)$ で、単位元の保存はそこから従う。

**2.** $\mathbf{Top}$ の直積は直積位相をもつ直積集合で、忘却関手 $\mathbf{Top}\to\mathbf{Set}$ は直積を保つ（\ref{cat:top-forgetful-preserves}）。よって $\mathbf{Top}$ の群対象は、群であって $\mu,\iota$（と $\eta$。1 点からの写像は自動的に連続）が連続なもの、つまり位相群で、準同型は連続な準同型。

**3.** $\mathbf{Diff}$ の直積は積多様体で、その下の集合は直積集合なので、2 と同様。

**4.** \ref{cat:monoid-in-monoids.2}（エックマン–ヒルトンの議論）。
:::

::: proposition 群対象と群値関手 {#top:group-object-yoneda keywords="an object G is a group object iff the representable functor Hom(-,G) lifts to a group-valued functor; homomorphisms correspond to natural transformations" index="群値関手|ぐんちかんしゅ"}
有限直積をもつ局所小な圏 $\mathbf{C}$ の対象 $G$ について、$G$ 上の群対象の構造と、関手 $\mathbf{C}^{\mathrm{op}}\to\mathbf{Grp}$ で、忘却関手と合成すると $\mathbf{C}(-,G)$ になるものとは、一対一に対応する。
:::

::: proof
**Step 1（群対象から関手へ）.** $X$ について、$\mathbf{C}(X,G)$ に積 $a\cdot b\defeq\mu\circ(a,b)$、単位元 $\eta\circ!_{X}$、逆元 $\iota\circ a$ を入れる。群の公理は、群対象の等式に右から $(a,b,c)$ などを合成して得られる。$h\colon Y\to X$ について $(a\cdot b)\circ h=\mu\circ(ah,bh)=(ah)\cdot(bh)$ なので、$h^{*}\defeq-\circ h$ は準同型で、群値関手になる。

**Step 2（関手から群対象へ）.** 群値関手 $F$ が与えられたとき、$\mathbf{C}(-,G)\times\mathbf{C}(-,G)\cong\mathbf{C}(-,G\times G)$ なので、$F$ の積は自然変換 $\mathbf{C}(-,G\times G)\to\mathbf{C}(-,G)$ で、\ref{cat:yoneda-lemma} からある射 $\mu\colon G\times G\to G$ との合成で与えられる（$\mu$ は $F(G\times G)$ の中の積 $p_{1}\cdot p_{2}$。$p_{1},p_{2}$ は射影）。同様に単位元から $\eta$、逆元から $\iota$ が得られる。群の公理は、$X=G\times G\times G$, $G$ などの普遍的な元（射影の組）で評価すると群対象の等式になる。

**Step 3（互いに逆）.** Step 1 の構成で $X=G\times G$ の元 $(p_{1},p_{2})$ の積は $\mu\circ(p_{1},p_{2})=\mu$ なので、Step 2 で元の $\mu$ が戻る。逆に Step 2 の $\mu$ から Step 1 で作った積は、自然性から $F$ の積と一致する（$a\cdot b=(a,b)^{*}(p_{1}\cdot p_{2})$）。
:::

::: intuition
対象 $G$ が群対象であるとは、「どの空間 $X$ から $G$ への写像の全体」も自然に群になっていることだ、と言い換えられる。たとえば位相群 $G$ への連続写像は、値ごとに掛け算でき、その積はまた連続写像になる。
:::

## 位相群の圏 {#top:sec-tgc-topgrp}

::: proposition 位相群の圏の極限 {#top:topgrp-limits keywords="TopGrp has all small limits, created by the forgetful functor to Top: products with product topology and equalizers as closed-subgroup-like subspaces" index="位相群の極限|いそうぐんのきょくげん"}
$\mathbf{TopGrp}$ は小さい極限をすべてもち、忘却関手 $U\colon\mathbf{TopGrp}\to\mathbf{Top}$ は極限を創出する。とくに、位相群の族の直積は、直積群に直積位相を入れたもので、二つの連続準同型 $f,g\colon G\to H$ の等化子は部分群 $\{x:f(x)=g(x)\}$ に部分空間位相を入れたものである（$H$ がハウスドルフなら閉部分群）。
:::

::: proof
**Step 1（直積）.** 【主張：$\prod_{i}G_{i}$ に成分ごとの積と直積位相を入れたものは位相群で、$\mathbf{TopGrp}$ の直積】積写像 $\prod G_{i}\times\prod G_{i}\to\prod G_{i}$ は、各成分への射影との合成が $\mu_{i}\circ(p_{i}\times p_{i})$ で連続なので連続（直積位相の普遍性）。逆元も同様。射影は連続な準同型。連続な準同型 $f_{i}\colon X\to G_{i}$ の族について、$(f_{i})\colon X\to\prod G_{i}$ は連続（直積位相）で準同型（成分ごと）で、一意。

**Step 2（等化子）.** 【主張：$E\defeq\{x:f(x)=g(x)\}$ は部分群で、部分空間位相で位相群になり、等化子】$f,g$ は準同型なので $E$ は部分群。積と逆元は $G$ のものの制限で連続。連続な準同型 $k\colon X\to G$ で $fk=gk$ となるものは $E$ を通り、$X\to E$ は部分空間位相について連続。$H$ がハウスドルフなら、$E$ は連続写像 $(f,g)\colon G\to H\times H$ による閉集合（対角線）の逆像なので閉。

**Step 3（創出）.** 任意の小さい極限は直積と等化子から作れる（\ref{cat:limits-from-products-equalizers}）。Step 1・2 の構成は $U$ で見ると $\mathbf{Top}$ の直積・等化子そのもので、$U$ で極限になる錐の頂点に群の構造が一意に入り、それが $\mathbf{TopGrp}$ の極限になる。
:::

::: proposition ハウスドルフ化は反映 {#top:hausdorff-reflection keywords="Hausdorff topological groups form a reflective subcategory of TopGrp; the reflection is G -> G/closure{e}" index="位相群のハウスドルフ化|いそうぐんのはうすどるふか"}
ハウスドルフな位相群のなす $\mathbf{TopGrp}$ の充満部分圏は反映的（\ref{cat:reflective-subcategory}）で、位相群 $G$ の反映は $N\defeq\overline{\{e\}}$ による商群 $G/N$ と射影 $\pi\colon G\to G/N$ である。
:::

::: proof
**Step 1（$G/N$ はハウスドルフな位相群）.** $\{e\}$ は正規部分群なので、その閉包 $N$ は閉正規部分群（\ref{top:tg-subgroups.1}）。\ref{top:tg-quotient.3} から $G/N$ は位相群、\ref{top:tg-quotient.2} からハウスドルフ。

**Step 2（普遍性）.** 【主張：ハウスドルフな位相群 $H$ への連続準同型 $f\colon G\to H$ は、連続準同型 $\bar f\colon G/N\to H$ でただ一つ $f=\bar f\circ\pi$ と分解する】$H$ はハウスドルフなので $\{e_{H}\}$ は閉で、$\ker f=f^{-1}(e_{H})$ は $e$ を含む閉集合、よって $N\subset\ker f$。群の準同型定理から準同型 $\bar f$ がただ一つ定まり、$\pi$ は商写像なので $\bar f$ は連続（\ref{top:quotient-universal}）。
:::

::: intuition
位相群がハウスドルフでないのは、単位元と「区別できない」元があるからで、それを全部単位元とみなして潰すと、ハウスドルフな群になる。ハウスドルフな群への準同型はもともとそれらを区別できないので、潰した後の群を必ず経由する。
:::

::: supplement
**高い視点：群対象としての統一.** 群対象の言葉では、「位相群の基本群は可換」（\ref{cat:topological-group-pi1-abelian}）も同じ型の議論で理解できる：位相群は、ホモトピー圏の群対象（H 空間）を与え、$\pi_{1}$ の上に二つの演算（道の結合と群の積）が交換則を満たすので、エックマン–ヒルトンの議論から一致して可換になる。同様に、群の圏の群対象は可換群である（\ref{top:group-object-examples.4}）。比喩で言えば、「群である」ことは対象の材質（集合・空間・多様体）によらない骨組みで、材質を変えるたびに、その材質にふさわしい群（位相群・リー群）が現れる。

**リー群への関手.** リー群 $G$ にその単位元での接空間に括弧積を入れたリー代数 $\mathfrak{g}$ を対応させると、$\mathbf{Grp}(\mathbf{Diff})$ から実リー代数の圏への関手（**リー関手**）が得られ、単連結なリー群の圏と有限次元実リー代数の圏の圏同値を与えることが知られている（本サイトのリー群の系列で扱う予定）。局所コンパクトなアーベル群の圏では、指標群をとる関手 $G\mapsto\mathrm{Hom}(G,S^{1})$ が自分自身との反変な圏同値を与える（ポントリャーギン双対性）ことが知られている。

**前提を変えると.** $\mathbf{Grp}(\mathbf{C})$ の定義には $\mathbf{C}$ の有限直積しか使わない。直積をもたない圏では、モノイダル圏のモノイドやホップ代数（余積が対角射の代わりになる）が群の代わりを務める。
:::

## 問題 {#top:sec-tgc-problems}

::: problem {#top:prob-tgc-group-object-maps}
$G$ を位相群、$X$ を位相空間とする。連続写像 $X\to G$ の全体 $C(X,G)$ は、値ごとの積で群になり、連続写像 $h\colon Y\to X$ による引き戻し $C(X,G)\to C(Y,G)$ は準同型であることを、\ref{top:group-object-yoneda} を使わずに直接確かめよ。
:::

::: solution
$a,b\in C(X,G)$ の積 $x\mapsto a(x)b(x)$ は $\mu\circ(a,b)$ で、連続写像 $(a,b)\colon X\to G\times G$ と連続な $\mu$ の合成なので連続。単位元は定値写像 $e$、逆元は $\iota\circ a$ で連続。群の公理は値ごとに成り立つ。$(ab)\circ h=(a\circ h)(b\circ h)$ なので引き戻しは準同型。
:::

::: problem {#top:prob-tgc-indiscrete}
密着位相の群 $G$（開集合が $\varnothing$ と $G$ だけ）は位相群であり、そのハウスドルフ化は自明群であることを示せ。
:::

::: solution
密着空間への写像はどれも連続なので、積と逆元は連続。$\{e\}$ の閉包は $G$ 全体（$G$ を含まない閉集合は $\varnothing$ だけ）なので、$G/\overline{\{e\}}$ は自明群（\ref{top:hausdorff-reflection}）。
:::
