# 位相群（Topological Groups）

位相群の定義と例、単位元の近傍による記述、部分群と商空間、分離性、左一様構造と完全正則性、バーコフ–角谷の距離化定理。 群対象としての位相群・リー群、位相群の圏の極限とハウスドルフ化の随伴。

<p class="mn-msc">MSC2020: 54H11, 22A05</p>

- [一般位相 › 一様空間](../../../05-geometry-topology/01-general-topology/07-uniform-spaces/index.html)（全体、4 ページ）：一様構造と距離化補題

- [圏論 › モノイダル圏](../../../01-foundations/06-category-theory/02-monoidal-categories/index.html) [§3](../../../01-foundations/06-category-theory/02-monoidal-categories/03-simplicial.html)（単体圏と普遍モノイド）：モノイダル圏のモノイド（§3）
- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html) [§3](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/03-forms-on-manifolds.html)（多様体上の微分形式）：可微分多様体と積多様体（§3 のリー群）
