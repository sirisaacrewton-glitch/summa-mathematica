# 特異ホモロジー {#at:page-singular-homology keywords="singular simplex, singular chain complex, singular homology, induced homomorphism, path components and H_0, homology of a point, reduced singular homology, homotopy invariance, prism operator, relative homology, long exact sequence of a pair, long exact sequence of a triple, Hurewicz homomorphism pi_1 -> H_1"}

\ref{at:page-simplicial-homology}は空間の分割に依存する。**特異ホモロジー**は、標準単体からの**すべての**連続写像を単体として使うことで分割の選び方をなくし、定義からただちに位相不変（同相写像で同型）になる。代わりに鎖群は巨大になり、計算には道具が要る。このページでは定義と基本性質、とくに**ホモトピー不変性**（プリズム作用素による）と**対の長完全列**を示す。切除と計算は次ページ（\ref[切除とマイヤー–ヴィートリス]{at:page-excision}）で扱う。層の理論のページ（\ref{cat:page-singular-comparison}）で「55N で証明予定」として引用した (H) は、ここで示すホモトピー不変性から従う（コホモロジー版は \ref[特異コホモロジーとカップ積]{at:page-singular-cohomology}）。

> 資料：Massey『Singular Homology Theory』第 II〜III 章、Fulton『Algebraic Topology』第 9 章などに対応する標準的な内容。証明（プリズム作用素の符号計算を含む）は自分で書き下ろした。訳語は小松・中岡・菅原（特異単体・特異チェイン・特異ホモロジー・プリズム）。

## 記法と定義の確認 {#at:sec-si-notation}

::: notation
- 標準単体 $\Delta^{n}$ と面の埋め込み $\delta^{i}\colon\Delta^{n-1}\to\Delta^{n}$ は \ref{at:simplex}、Δ 複体と $\partial\partial=0$ は \ref{at:delta-complex}, \ref{at:boundary-squared}。
- 鎖複体・ホモロジー・鎖ホモトピーとそのホモロジーへの作用は \ref{ha:chain-complex}, \ref{ha:homology}, \ref{ha:chain-homotopy}, \ref{ha:homotopy-invariance}、短完全列から長完全列と連結射の自然性は \ref{ha:long-exact-sequence}, \ref{ha:connecting-natural}。
- ホモトピー・道・基本群は \ref{at:homotopy}, \ref{at:path}, \ref{at:fundamental-group}、正方形の補題 \ref{at:square-lemma}。
- **アフィン単体**：$\mathbb{R}^{N}$ の点 $p_{0},\dots,p_{k}$（アフィン独立でなくてよい）について、$[p_{0},\dots,p_{k}]\colon\Delta^{k}\to\mathbb{R}^{N}$ を $\sum t_{j}e_{j}\mapsto\sum t_{j}p_{j}$ で定める。凸集合 $C$ の点なら値は $C$ に入る。アフィン写像 $\alpha$ について $\alpha\circ[p_{0},\dots,p_{k}]=[\alpha p_{0},\dots,\alpha p_{k}]$、また $[p_{0},\dots,p_{k}]\circ\delta^{i}=[p_{0},\dots,\widehat{p_{i}},\dots,p_{k}]$。
- **選択公理**：使わない。
:::

## 定義と基本性質 {#at:sec-si-definition}

::: definition 特異ホモロジー {#at:singular-homology keywords="singular n-simplex, singular chain group S_n(X), boundary, singular homology H_n(X), induced chain map f_#" index="特異単体|とくいたんたい, 特異鎖|とくいさ, 特異チェイン|とくいちぇいん, 特異ホモロジー|とくいほもろじー"}
位相空間 $X$ について、連続写像 $\sigma\colon\Delta^{n}\to X$ を**特異 $n$ 単体**、その全体 $\operatorname{Sing}_{n}(X)$ 上の自由アーベル群 $S_{n}(X)$ を**特異 $n$ 鎖**の群という。$d_{i}\sigma\defeq\sigma\circ\delta^{i}$ とおくと $\operatorname{Sing}(X)$ は Δ 複体で（$\delta^{j}\delta^{i}=\delta^{i}\delta^{j-1}$（$i<j$）を座標で確かめると $d_{i}d_{j}=d_{j-1}d_{i}$）、
$$
\partial\sigma\defeq\sum_{i=0}^{n}(-1)^{i}\sigma\circ\delta^{i}
$$
は $\partial\partial=0$ を満たす（\ref{at:boundary-squared}）。そのホモロジー $H_{n}(X)$ を $X$ の**特異ホモロジー**という。連続写像 $f\colon X\to Y$ は $f_{\#}\sigma\defeq f\circ\sigma$ で鎖写像を定め（$f\circ(\sigma\circ\delta^{i})=(f\circ\sigma)\circ\delta^{i}$）、$f_{*}\colon H_{n}(X)\to H_{n}(Y)$ を誘導する。$(g\circ f)_{*}=g_{*}f_{*}$, $1_{*}=1$。添加写像 $\varepsilon\colon S_{0}(X)\to\mathbb{Z}$ による**被約特異ホモロジー** $\tilde H_{n}(X)$ も \ref{at:simplicial-chains} と同様に定める。
:::

::: example
1. $\delta^{j}\delta^{i}=\delta^{i}\delta^{j-1}$（$i<j$）：どちらも $(t_{0},\dots,t_{n-2})$ に、最終的な位置 $i$ と $j$ に $0$ を挿入する。
2. **同相不変性.** 同相写像 $f$ について $f_{*}$ は同型（逆写像 $(f^{-1})_{*}$）。単体的ホモロジーと違い、定義は空間の位相だけによる。
:::

::: proposition 1 点と 0 次の特異ホモロジー {#at:singular-h0-point keywords="H_0 of singular homology is free on path components; homology of a point; homology is additive on path components" index="1 点のホモロジー|いってんのほもろじー, 弧状連結成分と 0 次ホモロジー|こじょうれんけつせいぶんとぜろじほもろじー" refname="1 点と 0 次の特異ホモロジー" refscope="field"}
1. $X$ の弧状連結成分を $X_{\lambda}$ とすると $H_{n}(X)\cong\bigoplus_{\lambda}H_{n}(X_{\lambda})$。
2. $X$ が弧状連結で空でなければ $\varepsilon$ は同型 $H_{0}(X)\cong\mathbb{Z}$ を誘導する。したがって $H_{0}(X)$ は弧状連結成分の集合上の自由アーベル群。
3. 1 点 $\ast$ について $H_{0}(\ast)\cong\mathbb{Z}$、$n\ge1$ で $H_{n}(\ast)=0$。
:::

::: proof
**Step 1（1）.** $\Delta^{n}$ は弧状連結（凸）なので、特異単体の像はちょうど 1 つの $X_{\lambda}$ に入り、$S_{n}(X)=\bigoplus_{\lambda}S_{n}(X_{\lambda})$ は $\partial$ と両立する直和分解。

**Step 2（2）.** $x_{0}\in X$ を固定する。$\varepsilon$ は全射で $\varepsilon\partial=0$。$\ker\varepsilon\subset B_{0}$ を示す：$c=\sum n_{x}x$（$\sum n_{x}=0$）について、各 $x$ に $x_{0}$ から $x$ への道 $\gamma_{x}$ を（$c$ に現れる有限個だけ）とり、$\Delta^{1}\cong I$（$(1-s)e_{0}+se_{1}\leftrightarrow s$）で 1 単体と見ると $\partial\gamma_{x}=x-x_{0}$。$c=\sum n_{x}(x-x_{0})=\partial\sum n_{x}\gamma_{x}$。

**Step 3（3）.** $\operatorname{Sing}_{n}(\ast)$ は 1 元 $\sigma_{n}$ で、$\partial\sigma_{n}=\sum_{i=0}^{n}(-1)^{i}\sigma_{n-1}$ は $n$ が偶数で $n\ge2$ なら $\sigma_{n-1}$、奇数なら $0$。鎖複体は $\cdots\xrightarrow{0}\mathbb{Z}\xrightarrow{1}\mathbb{Z}\xrightarrow{0}\mathbb{Z}\to0$（$\partial_{1}=0$, $\partial_{2}=1$, $\partial_{3}=0$, …）で、$n\ge1$ では $Z_{n}=B_{n}$（奇数 $n$：$Z_{n}=\mathbb{Z}=\operatorname{im}\partial_{n+1}$、偶数 $n\ge2$：$Z_{n}=0$）。
:::

## ホモトピー不変性 {#at:sec-si-homotopy}

::: theorem ホモトピー不変性 {#at:singular-homotopy-invariance keywords="homotopic maps induce the same map on singular homology; prism operator gives a chain homotopy; homotopy equivalences induce isomorphisms; contractible spaces have trivial reduced homology" index="特異ホモロジーのホモトピー不変性|とくいほもろじーのほもとぴーふへんせい, プリズム作用素|ぷりずむさようそ" refname="特異ホモロジーのホモトピー不変性" refscope="field"}
$f\simeq g\colon X\to Y$ なら $f_{*}=g_{*}\colon H_{n}(X)\to H_{n}(Y)$。より詳しく、ホモトピー $H$ から作る**プリズム作用素** $P\colon S_{n}(X)\to S_{n+1}(Y)$ は
$$
\partial P+P\partial=g_{\#}-f_{\#}
$$
を満たす。とくにホモトピー同値写像は特異ホモロジーの同型を誘導し、可縮な空間の被約特異ホモロジーは $0$。
:::

::: intuition
$\Delta^{n}\times I$ は $n+1$ 個の $(n+1)$ 単体 $[v_{0},\dots,v_{i},w_{i},\dots,w_{n}]$ に分割できる（$v_{j}=(e_{j},0)$ は底、$w_{j}=(e_{j},1)$ は天井）。$P\sigma$ はこの分割を $H\circ(\sigma\times1)$ で $Y$ に写したもの（$\sigma$ がホモトピーで掃く「角柱」）で、角柱の境界は「天井 $-$ 底 $-$ 側面」、側面は $\partial\sigma$ の角柱である。
:::

::: proof
**Step 1（定義）.** $\Delta^{n}\times I\subset\mathbb{R}^{n+1}\times\mathbb{R}$ の点 $v_{j}\defeq(e_{j},0)$, $w_{j}\defeq(e_{j},1)$ をとる。特異単体 $\sigma$ について $F_{\sigma}\defeq H\circ(\sigma\times1_{I})\colon\Delta^{n}\times I\to Y$ とし、
$$
P\sigma\defeq\sum_{i=0}^{n}(-1)^{i}F_{\sigma}\circ[v_{0},\dots,v_{i},w_{i},\dots,w_{n}]
$$
とおく（$\Delta^{n}\times I$ は凸なのでアフィン単体はその中に値をとる）。以下 $F_{\sigma}\circ[\cdots]$ を $F[\cdots]$ と略す。

**Step 2（$\partial P\sigma$ の展開）.** $[v_{0},\dots,v_{i},w_{i},\dots,w_{n}]$ の頂点の位置は $0,\dots,n+1$ で、位置 $j\le i$ を除くと $v_{j}$ が、位置 $j+1$（$j\ge i$）を除くと $w_{j}$ が消える。よって
$$
\begin{aligned}
\partial P\sigma&=\sum_{j\le i}(-1)^{i+j}F[v_{0},\dots,\widehat{v_{j}},\dots,v_{i},w_{i},\dots,w_{n}]\\
&\quad+\sum_{j\ge i}(-1)^{i+j+1}F[v_{0},\dots,v_{i},w_{i},\dots,\widehat{w_{j}},\dots,w_{n}].
\end{aligned}
$$

**Step 3（$j=i$ の項は伸縮和）.** $A_{i}\defeq F[v_{0},\dots,v_{i-1},w_{i},\dots,w_{n}]$（$i=0,\dots,n+1$）とおくと、第 1 の和の $j=i$ の項は $A_{i}$、第 2 の和の $j=i$ の項は $-A_{i+1}$。和は $\sum_{i=0}^{n}(A_{i}-A_{i+1})=A_{0}-A_{n+1}$。$A_{0}=F[w_{0},\dots,w_{n}]=g\circ\sigma$（$F_{\sigma}(x,1)=g(\sigma(x))$）、$A_{n+1}=F[v_{0},\dots,v_{n}]=f\circ\sigma$。

**Step 4（$P\partial\sigma$ の展開）.** $F_{\sigma\circ\delta^{k}}=F_{\sigma}\circ(\delta^{k}\times1)$ で、$\delta^{k}\times1$ はアフィンで $v_{j}\mapsto v_{j}$（$j<k$）, $v_{j}\mapsto v_{j+1}$（$j\ge k$）（$w$ も同様）。よって
$$
\begin{aligned}
P\partial\sigma&=\sum_{k}(-1)^{k}P(\sigma\circ\delta^{k})\\
&=\sum_{i<k}(-1)^{i+k}F[v_{0},\dots,v_{i},w_{i},\dots,\widehat{w_{k}},\dots,w_{n}]\\
&\quad+\sum_{i\ge k}(-1)^{i+k}F[v_{0},\dots,\widehat{v_{k}},\dots,v_{i+1},w_{i+1},\dots,w_{n}].
\end{aligned}
$$

**Step 5（残りの項の打ち消し）.** Step 2 の第 2 の和の $j>i$ の部分は、Step 4 の第 1 の和（$k=j$）の $-1$ 倍。Step 2 の第 1 の和の $j<i$ の部分は、$i=i'+1$（$i'\ge j$）と書き直すと $(-1)^{i'+1+j}F[v_{0},\dots,\widehat{v_{j}},\dots,v_{i'+1},w_{i'+1},\dots,w_{n}]$ で、Step 4 の第 2 の和（$k=j$, $i=i'$）の $-1$ 倍。よって $\partial P\sigma=g\circ\sigma-f\circ\sigma-P\partial\sigma$。

**Step 6（結論）.** $P$ は鎖ホモトピーなので $f_{*}=g_{*}$（\ref{ha:homotopy-invariance}）。ホモトピー同値 $f$, ホモトピー逆 $g$ について $g_{*}f_{*}=(gf)_{*}=1_{*}$, $f_{*}g_{*}=1$。可縮なら $X\to\ast$ がホモトピー同値なので $H_{n}(X)\cong H_{n}(\ast)$ で、\ref{at:singular-h0-point} から被約ホモロジーは $0$。

::: hypcheck
- ホモトピー $H$ の連続性は $F_{\sigma}$ の連続性（Step 1）にだけ使った。基点や\term[部分空間]{top:subspace}を止める必要はない（基本群と違い、ホモロジーには基点がない）。
- Step 4 で $\delta^{k}\times1$ がアフィンであること（頂点の行き先だけで決まる）を使った。
- $P$ は $\sigma$ について自然：$\phi\colon X'\to X$ について $P_{H\circ(\phi\times1)}=P_{H}\circ\phi_{\#}$（$F_{\sigma}$ の定義から）。相対版（次節）に使う。
:::
:::

::: supplement
**層の理論との関係.** \ref{cat:page-singular-comparison} の (H)（可縮な $U$ の特異コホモロジーは次数 $0$ の $A$ だけ）は、この定理の鎖ホモトピー $P$ の双対 $P^{*}$ が特異コチェインの鎖ホモトピーを与えることから従う（\ref[特異コホモロジーとカップ積]{at:page-singular-cohomology} で述べる）。

**高い視点.** $\operatorname{Sing}(X)$ は Δ 複体（実は単体的集合）で、$H_{*}$ は「位相空間 → Δ 複体 → 鎖複体 → 次数付きアーベル群」という関手の合成である。ホモトピー不変性は、この関手がホモトピー圏 $\mathrm{h}\mathbf{Top}$ を経由することを意味する。証明の要点は「$\Delta^{n}\times I$ の三角形分割が、$n$ について両立するように（$\partial$ と可換に）選べる」ことで、これは鎖複体の圏での $\Delta^{n}\times I$ の「アイレンバーグ–ジルバーの写像」の最初の例である（\ref[アイレンバーグ–スティーンロッドの公理と一意性]{at:page-homology-axioms} のキュネットの定理で再び現れる）。比喩で言えば、ホモトピーは空間の中で写像を動かす「時間」で、プリズム作用素はその時間方向に単体を引き伸ばしてできる角柱であり、ホモロジーではこの角柱が「始めと終わりの差」を境界として吸収してしまう。
:::

## 相対ホモロジーと長完全列 {#at:sec-si-relative}

::: definition 相対ホモロジー {#at:relative-homology keywords="pair of spaces (X,A), relative singular chains S(X)/S(A), relative homology H_n(X,A), maps of pairs" index="相対ホモロジー|そうたいほもろじー, 空間対|くうかんつい, 対の写像|ついのしゃぞう"}
$A\subset X$ のとき $(X,A)$ を**空間対**という。$S(A)\subset S(X)$ は部分鎖複体で、商 $S(X,A)\defeq S(X)/S(A)$ のホモロジー $H_{n}(X,A)$ を**相対ホモロジー**という。**対の写像** $f\colon(X,A)\to(Y,B)$（$f(A)\subset B$）は $f_{*}\colon H_{n}(X,A)\to H_{n}(Y,B)$ を誘導する。$H_{n}(X,\varnothing)=H_{n}(X)$。
:::

::: intuition
相対サイクルは「境界が $A$ に入っている鎖」、相対境界は「$A$ の鎖を除いて境界になっているもの」。$A$ の中は見ないことにして $X$ を調べる（あとで $A$ を 1 点に潰した空間と比べる）。
:::

::: theorem 対の長完全列 {#at:pair-long-exact keywords="long exact sequence of a pair in singular homology, connecting homomorphism, naturality; reduced version; long exact sequence of a triple" index="対の長完全列|ついのちょうかんぜんれつ, 連結射（特異ホモロジー）|れんけつしゃとくいほもろじー"}
空間対 $(X,A)$ について、自然な長完全列
$$
\cdots\to H_{n}(A)\xrightarrow{i_{*}}H_{n}(X)\xrightarrow{j_{*}}H_{n}(X,A)\xrightarrow{\partial_{*}}H_{n-1}(A)\to\cdots\to H_{0}(X,A)\to0
$$
がある。$\partial_{*}[z]=[\partial z]$（$z$ は境界が $A$ に入る $X$ の鎖）。$A\ne\varnothing$ なら被約ホモロジーでも同じ形の完全列が成り立つ。三つ組 $B\subset A\subset X$ についても
$$
\cdots\to H_{n}(A,B)\to H_{n}(X,B)\to H_{n}(X,A)\to H_{n-1}(A,B)\to\cdots
$$
が完全。
:::

::: proof
**Step 1.** $0\to S(A)\to S(X)\to S(X,A)\to0$ は鎖複体の短完全列（各次数で $S_{n}(A)$ は $S_{n}(X)$ の基底の部分集合が生成する直和因子）。\ref{ha:long-exact-sequence} から長完全列、連結射の式と自然性は \ref{ha:connecting-natural}。$H_{-1}(A)=0$ で列は $H_{0}(X,A)\to0$ で終わる。

**Step 2（被約）.** 次数 $-1$ に $\mathbb{Z}$ を足した $\tilde S(A)\to\tilde S(X)$ は、次数 $-1$ で恒等（$A\ne\varnothing$ なので添加写像は両方全射で両立）。商は $S(X,A)$ のまま（次数 $-1$ で $0$）なので、同じ議論。

**Step 3（三つ組）.** $0\to S(A)/S(B)\to S(X)/S(B)\to S(X)/S(A)\to0$ も短完全（第三同型定理）。
:::

::: corollary 相対版のホモトピー不変性 {#at:relative-homotopy-invariance keywords="homotopic maps of pairs induce the same map on relative homology; H_n(X,x_0) = reduced H_n(X)" index="相対ホモロジーのホモトピー不変性|そうたいほもろじーのほもとぴーふへんせい"}
1. 対の写像 $f,g\colon(X,A)\to(Y,B)$ が、各時刻で $A$ を $B$ に写すホモトピー（$H(A\times I)\subset B$）で結ばれるなら $f_{*}=g_{*}\colon H_{n}(X,A)\to H_{n}(Y,B)$。
2. $x_{0}\in X$ について $H_{n}(X,\{x_{0}\})\cong\tilde H_{n}(X)$。
:::

::: proof
1：プリズム作用素は $S(A)$ を $S(B)$ に写す（$\sigma$ の像が $A$ にあれば $F_{\sigma}$ の像は $B$ に入る）ので、商の鎖ホモトピーを誘導する。2：被約の長完全列で $\tilde H_{n}(\{x_{0}\})=0$（\ref{at:singular-h0-point.3}）なので $\tilde H_{n}(X)\to H_{n}(X,x_{0})$ は同型。
:::

## フレヴィッツ準同型 {#at:sec-si-hurewicz}

::: proposition フレヴィッツ準同型 {#at:hurewicz-homomorphism keywords="Hurewicz homomorphism pi_1(X,x_0) -> H_1(X), loops as singular 1-cycles; homotopic paths are homologous; concatenation is the sum; factors through the abelianization" index="フレヴィッツ準同型|ふれびっつじゅんどうけい"}
$\Delta^{1}$ と $I$ を $(1-s)e_{0}+se_{1}\leftrightarrow s$ で同一視し、道を特異 1 単体と見る。
1. 道 $\gamma\simeq\delta$（道のホモトピー）なら $\gamma-\delta\in B_{1}(X)$。定値道は $B_{1}$ に入る。
2. 道 $\alpha,\beta$（$\alpha(1)=\beta(0)$）について $\alpha\cdot\beta-\alpha-\beta\in B_{1}(X)$。
3. したがって $x_{0}$ を基点とする閉道 $\gamma$（$\partial\gamma=x_{0}-x_{0}=0$ なので 1 サイクル）について $h[\gamma]\defeq[\gamma]\in H_{1}(X)$ は準同型 $h\colon\pi_{1}(X,x_{0})\to H_{1}(X)$ を定め、$H_{1}(X)$ は可換なので $h$ はアーベル化 $\pi_{1}(X,x_{0})^{\mathrm{ab}}$ を経由する。
:::

::: proof
**Step 1（定値道）.** 定値 2 単体 $\kappa_{x}$ について $\partial\kappa_{x}=c_{x}-c_{x}+c_{x}=c_{x}$。

**Step 2（1）.** $F$ を $\gamma$ から $\delta$ への道のホモトピーとし（$F(s,0)=\gamma(s)$, $F(s,1)=\delta(s)$, $F(0,t)=x$, $F(1,t)=y$）、正方形 $I\times I$ の 2 つのアフィン 2 単体 $\sigma_{1}\defeq F\circ[(0,0),(1,0),(1,1)]$, $\sigma_{2}\defeq F\circ[(0,0),(0,1),(1,1)]$ をとる。対角線の道を $D\defeq F\circ[(0,0),(1,1)]$ とすると
$$
\partial\sigma_{1}=c_{y}-D+\gamma,\qquad\partial\sigma_{2}=\delta-D+c_{x}
$$
（$F\circ[(1,0),(1,1)]$ は $t\mapsto F(1,t)=y$ で定値、など）。よって $\gamma-\delta=\partial\sigma_{1}-\partial\sigma_{2}-c_{y}+c_{x}\in B_{1}$（Step 1）。

**Step 3（2）.** アフィン写像 $\rho\colon\Delta^{2}\to I$, $\rho(t_{0},t_{1},t_{2})\defeq\frac{t_{1}}{2}+t_{2}$ を考える（値は $[0,1]$ に入る）。$\tau\defeq(\alpha\cdot\beta)\circ\rho$ とすると、面 $\tau\circ\delta^{2}$（辺 $[e_{0},e_{1}]$、$s\mapsto(1-s,s,0)$）は $s\mapsto(\alpha\cdot\beta)(\frac{s}{2})=\alpha(s)$、面 $\tau\circ\delta^{0}$（辺 $[e_{1},e_{2}]$、$s\mapsto(0,1-s,s)$）は $s\mapsto(\alpha\cdot\beta)(\frac{1+s}{2})=\beta(s)$、面 $\tau\circ\delta^{1}$（辺 $[e_{0},e_{2}]$）は $s\mapsto(\alpha\cdot\beta)(s)$。よって $\partial\tau=\beta-\alpha\cdot\beta+\alpha$。

**Step 4（3）.** 1 から $h$ は well-defined、2 から $h([\alpha][\beta])=h[\alpha]+h[\beta]$。アーベル群への準同型は交換子部分群を核に含む（\ref{grp:commutator-properties}）。

::: hypcheck
- 道のホモトピーが端点を止めることは Step 2 の $c_{x}$, $c_{y}$（左右の辺が定値）に使った。端点を動かすホモトピーでも、閉道の自由ホモトピー（各時刻が閉道）なら左右の辺が同じ道になり、$\gamma-\delta=\partial\sigma_{1}-\partial\sigma_{2}$ に左右の辺の差 $0$ が加わるだけなので、やはり $\gamma-\delta\in B_{1}$：$H_{1}$ は基点を気にしない。
:::
:::

::: supplement
**一般化.** $X$ が弧状連結なら $h$ は同型 $\pi_{1}(X,x_{0})^{\mathrm{ab}}\cong H_{1}(X)$ を与える（フレヴィッツの定理の $n=1$ の場合、\ref[フレヴィッツとホワイトヘッドの定理]{at:page-hurewicz-whitehead}）。これと \ref{at:fundamental-group-circle} から $H_{1}(S^{1})\cong\mathbb{Z}$ がただちに従うが、本系列では球面のホモロジーを切除から独立に計算する（\ref[切除とマイヤー–ヴィートリス]{at:page-excision}）。
:::

::: supplement 計算の観点
$S_{n}(X)$ は（$X$ が 1 点でなければ）非可算階数の自由アーベル群で、定義から直接ホモロジーを計算することはできない。計算は、ホモトピー不変性・長完全列・切除を使って有限の鎖複体（単体的・胞体的鎖複体）に帰着して行う（\ref[CW 複体と胞体ホモロジー]{at:page-cellular-homology}, \ref[単体的ホモロジーと特異ホモロジーの一致]{at:page-simplicial-singular}）。
:::

## 問題 {#at:sec-si-problems}

::: problem {#at:prob-retract-homology}
$A$ が $X$ のレトラクトなら、$i_{*}\colon H_{n}(A)\to H_{n}(X)$ は単射で、$H_{n}(X)\cong H_{n}(A)\oplus H_{n}(X,A)$ となることを示せ。
:::

::: solution
$r\circ i=1_{A}$ から $r_{*}i_{*}=1$ なので $i_{*}$ は単射で、対の長完全列の $i_{*}$ はすべて単射。よって連結射 $\partial_{*}$ は $0$（$\partial_{*}$ の像 $=\ker i_{*}=0$）で、$0\to H_{n}(A)\xrightarrow{i_{*}}H_{n}(X)\to H_{n}(X,A)\to0$ は完全。$r_{*}$ が左逆なので分裂し、$H_{n}(X)\cong H_{n}(A)\oplus H_{n}(X,A)$。
:::

::: problem {#at:prob-deformation-retract-relative}
$A$ が $X$ の変位レトラクトなら $H_{n}(X,A)=0$（すべての $n$）を示せ。
:::

::: solution
包含 $i$ はホモトピー同値なので $i_{*}$ は同型（\ref{at:singular-homotopy-invariance}）。長完全列 $H_{n}(A)\xrightarrow{\cong}H_{n}(X)\to H_{n}(X,A)\to H_{n-1}(A)\xrightarrow{\cong}H_{n-1}(X)$ で、$H_{n}(X)\to H_{n}(X,A)$ は $0$（その核 $=\operatorname{im}i_{*}$ が全体）、$\partial_{*}$ は $0$（像 $=\ker i_{*}=0$）なので $H_{n}(X,A)=0$。
:::

::: problem {#at:prob-five-lemma-pairs}
対の写像 $f\colon(X,A)\to(Y,B)$ で、$f\colon X\to Y$ と $f\restriction A\colon A\to B$ がともにホモトピー同値なら、$f_{*}\colon H_{n}(X,A)\to H_{n}(Y,B)$ は同型であることを示せ。
:::

::: solution
対の長完全列の自然性（\ref{at:pair-long-exact}）から可換図式ができ、$H_{n}(A)\to H_{n}(B)$ と $H_{n}(X)\to H_{n}(Y)$ はすべて同型。\ref{ha:five-lemma}から $H_{n}(X,A)\to H_{n}(Y,B)$ も同型。
:::

::: problem {#at:prob-h1-free-homotopy}
2 つの閉道が（基点を動かしてよい）閉道のホモトピーで結ばれていれば、$H_{1}$ で同じ類を定めることを示せ。とくに $S^{1}$ の閉道 $\omega_{n}$ について $h[\omega_{n}]=n\,h[\omega_{1}]$。
:::

::: solution
前半は \ref{at:hurewicz-homomorphism} の hypcheck の議論。後半は $[\omega_{n}]=[\omega_{1}]^{n}$（\ref{at:fundamental-group-circle}：写像度が同じ閉道はホモトープ）と $h$ が準同型であることから。
:::
