# ジョルダン–ブラウワーの分離定理と領域不変性 {#at:page-jordan-brouwer keywords="compact supports of singular chains, homology of the complement of an embedded disk and of an embedded sphere, Jordan-Brouwer separation theorem, Jordan curve theorem, invariance of domain, no continuous injection R^m -> R^n for m > n"}

球面 $S^{n}$ に埋め込まれた円板の補集合はホモロジー的に自明で、埋め込まれた $k$ 次元球面の補集合は $S^{n-k-1}$ と同じホモロジーをもつ。埋め込みがどんなに複雑（フラクタル的な曲線や、アレクサンダーの角付き球面のような野性的な埋め込み）でも成り立つのが要点である。系として、$S^{n}$ の中の $(n-1)$ 次元球面は補集合をちょうど 2 つの成分に分け（**ジョルダン–ブラウワーの分離定理**。$n=2$ がジョルダンの曲線定理）、$\mathbb{R}^{n}$ の開集合からの連続単射の像は開である（**領域不変性**）。

> 資料：標準的な内容（Massey『Singular Homology Theory』の応用の章などにある）。マイヤー–ヴィートリスと区間の二分法を組み合わせる議論を、自分で書き下ろした。

## 記法と定義の確認 {#at:sec-jb-notation}

::: notation
- 特異ホモロジーと被約ホモロジー \ref{at:singular-homology}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}、球面のホモロジー \tref{at:sphere-homology}、ホモトピー不変性 \tref{at:singular-homotopy-invariance}、0 次ホモロジーと弧状連結成分 \ref{at:singular-h0-point}。
- 局所弧状連結な空間の弧状連結成分は開で連結成分と一致する（\ref{top:path-components-open}）。$S^{n}$ の開集合は局所弧状連結（球面は局所的に $\mathbb{R}^{n}$ と同相）。コンパクト空間からハウスドルフ空間への連続単射は像への同相写像（\ref{top:compact-to-hausdorff}）。
- 立体射影 $\sigma\colon S^{n}\setminus\{N\}\to\mathbb{R}^{n}$ は \ref{at:sphere-simply-connected} の Step 1。$|\sigma(x)|^{2}=\frac{1+x_{n+1}}{1-x_{n+1}}$ は $x_{n+1}$ について単調増加。
- 被約ホモロジーの約束：$\tilde H_{i}(\varnothing)=0$（$i\ge0$）。
- **選択公理**：使わない。
:::

## コンパクト台 {#at:sec-jb-compact}

::: lemma 鎖のコンパクト台 {#at:compact-support keywords="singular chains have compact support; a cycle that bounds in an increasing union of open sets bounds in one of them" index="コンパクト台|こんぱくとだい"}
$Y=\bigcup_{m}Y_{m}$ を開集合の増大列 $Y_{1}\subset Y_{2}\subset\cdots$ の和とする。$Y_{1}$ の（被約）サイクル $z$ が $Y$ で境界なら、ある $m$ で $Y_{m}$ の中の境界である。
:::

::: proof
$z=\partial c$（$c\in S(Y)$）とする。$c$ は有限個の特異単体の整数係数の和なので、それらの像の和 $K$ はコンパクトである（$\Delta^{n}$ のコンパクト性と、コンパクト集合の連続像・有限個の和がコンパクトであること）。$\{Y_{m}\}$ は $K$ の開被覆なので有限部分被覆 $Y_{m_{1}},\dots,Y_{m_{r}}$ があり、増大列なので $m\defeq\max_{j}m_{j}$ とおくと $K\subset Y_{m}$ である。ゆえに $c$ に現れる特異単体はすべて $Y_{m}$ に値をとるので $c\in S(Y_{m})$ であり、$z=\partial c$ は $Y_{m}$ の中の境界である（$c=0$ なら $K=\varnothing$ で、どの $m$ でもよい）。
:::

## 埋め込まれた円板と球面の補集合 {#at:sec-jb-complements}

::: lemma 立方体と円板 {#at:cube-disk keywords="the cube [-1,1]^k is homeomorphic to the disk D^k; closed hemispheres are disks" index="立方体と円板|りっぽうたいとえんばん"}
1. $\varphi\colon[-1,1]^{k}\to D^{k}$, $\varphi(x)\defeq\frac{|x|_{\infty}}{|x|}x$（$x\ne0$）, $\varphi(0)=0$ は同相写像（$|x|_{\infty}=\max_{i}|x_{i}|$）。
2. 閉半球 $D_{\pm}\defeq\{x\in S^{k}:\pm x_{k+1}\ge0\}$ は $(x_{1},\dots,x_{k+1})\mapsto(x_{1},\dots,x_{k})$ で $D^{k}$ と同相で、$D_{+}\cap D_{-}=S^{k-1}\times\{0\}$。
:::

::: proof
1：$|\varphi(x)|=|x|_{\infty}\le1$ なので値は $D^{k}$ に入る。$x\ne0$ では連続関数の積と商なので連続であり、$x\to0$ のとき $|\varphi(x)|=|x|_{\infty}\to0$ なので $0$ でも連続である。$\psi(y)\defeq\frac{|y|}{|y|_{\infty}}y$（$\psi(0)=0$）とおくと、$|\psi(y)|_{\infty}=|y|\le1$ なので $\psi$ は $D^{k}$ を $[-1,1]^{k}$ に写し、同じ理由で連続である。さらに $\psi\varphi(x)=\frac{|\varphi x|}{|\varphi x|_{\infty}}\varphi(x)=\frac{|x|_{\infty}}{(|x|_{\infty}/|x|)|x|_{\infty}}\cdot\frac{|x|_{\infty}}{|x|}x=x$ であり、同様に $\varphi\psi=1$ である。2：射影 $D_{\pm}\to D^{k}$ は連続な全単射で、逆写像 $y\mapsto(y,\pm\sqrt{1-|y|^{2}})$ も連続である。$D_{+}\cap D_{-}$ は $x_{k+1}=0$ の点、すなわち $S^{k-1}\times\{0\}$ である。
:::

::: theorem 埋め込まれた円板の補集合 {#at:complement-disk keywords="the complement of an embedded k-disk in S^n has trivial reduced homology" index="埋め込まれた円板の補集合|うめこまれたえんばんのほしゅうごう"}
$h\colon D^{k}\to S^{n}$ が連続単射（したがって埋め込み）なら、すべての $i$ で $\tilde H_{i}(S^{n}\setminus h(D^{k}))=0$。
:::

::: proof
\ref{at:cube-disk} から $D^{k}$ を $I^{k}=I^{k-1}\times I$（$I\defeq[-1,1]$）に替えてよい。$k$ についての帰納法で示す。

**Step 1（$k=0$）.** 【主張：$k=0$ なら $\tilde H_{*}(S^{n}\setminus h(D^{0}))=0$】 $h(D^{0})$ は 1 点なので、$S^{n}$ からそれを除いたものは立体射影で $\mathbb{R}^{n}$ と同相であり、可縮である。ゆえに被約ホモロジーは $0$ である（\ref{at:singular-homotopy-invariance}）。

**Step 2（二分）.** $k\ge1$ とし、閉区間 $J\subset I$ について $X_{J}\defeq S^{n}\setminus h(I^{k-1}\times J)$ とおく。コンパクト集合の像はコンパクトで、ハウスドルフ空間 $S^{n}$ の中で閉なので、$X_{J}$ は開集合である。ある $i$ で $0\ne\alpha\in\tilde H_{i}(X_{I})$ があると仮定して矛盾を導く。$J=[a,b]$ について $t\defeq\frac{a+b}{2}$、$J_{1}\defeq[a,t]$, $J_{2}\defeq[t,b]$ とおく。【主張：$\alpha$ の $\tilde H_{i}(X_{J})$ での像が $0$ でなければ、$\tilde H_{i}(X_{J_{1}})$ か $\tilde H_{i}(X_{J_{2}})$ での像も $0$ でない】 $h$ の単射性から $X_{J_{1}}\cap X_{J_{2}}=X_{J}$ と $X_{J_{1}}\cup X_{J_{2}}=S^{n}\setminus h(I^{k-1}\times\{t\})$ が成り立つ。$\alpha$ の像が $\tilde H_{i}(X_{J})$ で $0$ でないなら、$\tilde H_{i}(\varnothing)=0$ の約束から $X_{J}\ne\varnothing$ なので、被約マイヤー–ヴィートリス（\ref{at:mayer-vietoris}）の完全列
$$
\tilde H_{i+1}(X_{J_{1}}\cup X_{J_{2}})\to\tilde H_{i}(X_{J})\to\tilde H_{i}(X_{J_{1}})\oplus\tilde H_{i}(X_{J_{2}})
$$
がある。$I^{k-1}\times\{t\}\cong I^{k-1}$ なので帰納法の仮定から左端は $0$ であり、右の写像は単射である。ゆえに $\alpha$ の像は $\tilde H_{i}(X_{J_{1}})$ か $\tilde H_{i}(X_{J_{2}})$ で $0$ でない（$X_{I}\subset X_{J}\subset X_{J_{\nu}}$ なので、像は包含で順に送ったものである）。

**Step 3（縮小列）.** 【主張：閉区間の減少列 $I=J_{(0)}\supset J_{(1)}\supset\cdots$ で、$\alpha$ の像が各 $\tilde H_{i}(X_{J_{(m)}})$ で $0$ でなく、$\bigcap_{m}J_{(m)}$ がただ 1 点 $p$ からなるものがある】 Step 2 を繰り返す。各段で「$J_{1}$ で $0$ でなければ $J_{1}$、そうでなければ $J_{2}$」と決めるので、選択は要らない。$J_{(m)}$ の長さは $2^{1-m}$ で $0$ に近づくので、閉区間の減少列の共通部分はただ 1 点 $p$ からなる。

**Step 4（極限）.** 【主張：$Y\defeq S^{n}\setminus h(I^{k-1}\times\{p\})$ は開集合の増大列 $X_{J_{(m)}}$ の和で、$\alpha$ の像はある $\tilde H_{i}(X_{J_{(m)}})$ で $0$ になる】 $J_{(m)}$ が減少列なので、$X_{J_{(m)}}$ は開集合の増大列である。$x$ がすべての $m$ で $x\notin X_{J_{(m)}}$ を満たすなら、$x\in\bigcap_{m}h(I^{k-1}\times J_{(m)})=h(I^{k-1}\times\{p\})$ である（$h$ の単射性）。ゆえに $Y=\bigcup_{m}X_{J_{(m)}}$ である。帰納法の仮定から $\tilde H_{i}(Y)=0$ なので、$\alpha$ を代表する（被約）サイクルは $Y$ で境界であり、\ref{at:compact-support} からある $X_{J_{(m)}}$ ですでに境界である。

Step 4 の結論は Step 3 に反するので、$\tilde H_{i}(X_{I})=0$ である。

::: hypcheck
- **単射性**：Step 2（共通部分と和の計算）と Step 4 に使った。
- **連続性**：像がコンパクト（したがって閉）であることと、$X_{J}$ が開であること（マイヤー–ヴィートリスに必要。Step 2）に使った。
- 円板の次元 $k$ は $n$ 以下でも以上でもよい（$k>n$ の連続単射 $D^{k}\to S^{n}$ は存在しないことが後で分かる：\ref{at:no-injection-higher}）。
:::
:::

::: theorem 埋め込まれた球面の補集合 {#at:complement-sphere keywords="the complement of an embedded k-sphere in S^n (k < n) has the homology of S^{n-k-1}" index="埋め込まれた球面の補集合|うめこまれたきゅうめんのほしゅうごう"}
$0\le k<n$ で $h\colon S^{k}\to S^{n}$ が連続単射なら、$\tilde H_{i}(S^{n}\setminus h(S^{k}))\cong\mathbb{Z}$（$i=n-k-1$）、$0$（それ以外）。
:::

::: proof
$k$ についての帰納法で示す。

**Step 1（$k=0$）.** 【主張：$\tilde H_{i}(S^{n}\setminus h(S^{0}))$ は $i=n-1$ で $\mathbb{Z}$、それ以外で $0$】 $h(S^{0})$ は 2 点なので、$S^{n}$ からそれを除いたものは（一方の点からの立体射影で）$\mathbb{R}^{n}$ から 1 点を除いたものと同相であり、$S^{n-1}$ とホモトピー同値である。ゆえに \ref{at:sphere-homology} から結論が従う。

**Step 2（二つの開集合）.** $k\ge1$ とし、$D_{\pm}$ を $S^{k}$ の閉半球とする（\ref{at:cube-disk.2}）。【主張：$A\defeq S^{n}\setminus h(D_{+})$, $B\defeq S^{n}\setminus h(D_{-})$ は被約ホモロジーが $0$ の開集合で、$A\cap B=S^{n}\setminus h(S^{k})$、$A\cup B=S^{n}\setminus h(S^{k-1})$】 $D_{\pm}\cong D^{k}$ なので、\ref{at:complement-disk} から $\tilde H_{*}(A)=\tilde H_{*}(B)=0$ である。$h(D_{\pm})$ はコンパクトなので閉で、$A,B$ は開である。$D_{+}\cup D_{-}=S^{k}$ から $A\cap B=S^{n}\setminus h(S^{k})$ である。$h$ の単射性から $h(D_{+})\cap h(D_{-})=h(D_{+}\cap D_{-})=h(S^{k-1}\times\{0\})$ なので、$A\cup B=S^{n}\setminus h(S^{k-1})$ である。

**Step 3（$A\cap B\ne\varnothing$）.** 【主張：$A\cap B\ne\varnothing$】 空だと仮定すると $A\cup B=A\sqcup B$（開集合の非交和）なので、$j\ge1$ で $H_{j}(A\cup B)=H_{j}(A)\oplus H_{j}(B)=0$ となる。ところが $h\restriction S^{k-1}$ への帰納法の仮定から $\tilde H_{n-k}(A\cup B)\cong\mathbb{Z}$ であり、$n-k\ge1$ なので矛盾する。

**Step 4（マイヤー–ヴィートリス）.** 【主張：$\tilde H_{i}(A\cap B)\cong\tilde H_{i+1}(A\cup B)$ であり、これは $i=n-k-1$ のときだけ $\mathbb{Z}$、それ以外で $0$】 Step 3 から被約マイヤー–ヴィートリス（\ref{at:mayer-vietoris}）が使え、Step 2 から $\tilde H_{*}(A)\oplus\tilde H_{*}(B)=0$ なので、連結射 $\partial_{*}\colon\tilde H_{i+1}(A\cup B)\to\tilde H_{i}(A\cap B)$ は同型である。帰納法の仮定（$k-1<n$）から、左辺は $i+1=n-(k-1)-1$、すなわち $i=n-k-1$ のときだけ $\mathbb{Z}$ で、それ以外では $0$ である。

::: hypcheck
- **単射性**：Step 2（$A\cup B$ の計算）に使った。
- **連続性**：像がコンパクト（したがって閉）で、$A,B$ が開であること（マイヤー–ヴィートリスに必要）に使った。
- **$k<n$**：Step 3 で $n-k\ge1$ に使った。$k=n$ では恒等写像 $S^{n}\to S^{n}$ の補集合は空で、主張の形は成り立たない。
:::
:::

## 分離定理と領域不変性 {#at:sec-jb-applications}

::: theorem ジョルダン–ブラウワーの分離定理 {#at:jordan-brouwer keywords="an embedded (n-1)-sphere separates S^n into exactly two components, each open with boundary the sphere" index="ジョルダン–ブラウワーの分離定理|じょるだんぶらうわーのぶんりていり, ジョルダンの曲線定理|じょるだんのきょくせんていり" refname="ジョルダン–ブラウワーの分離定理"}
$n\ge1$ で $h\colon S^{n-1}\to S^{n}$ が連続単射なら、$S^{n}\setminus h(S^{n-1})$ はちょうど 2 つの連結成分 $U,V$ をもち、$U,V$ は開で弧状連結、それぞれの境界は $h(S^{n-1})$ に一致する。
:::

::: proof
**Step 1（2 成分）.** 【主張：$S^{n}\setminus h(S^{n-1})$ の連結成分はちょうど 2 つ $U,V$ で、どちらも開で弧状連結】 \ref{at:complement-sphere}（$k=n-1$, $i=0$）から $\tilde H_{0}\cong\mathbb{Z}$ なので $H_{0}\cong\mathbb{Z}^{2}$ であり、弧状連結成分はちょうど 2 つである（\ref{at:singular-h0-point}）。$S^{n}\setminus h(S^{n-1})$ は開集合で局所弧状連結なので、弧状連結成分 $U,V$ は開で、連結成分と一致する（\ref{top:path-components-open}）。

**Step 2（境界は $C$ に含まれる）.** $C\defeq h(S^{n-1})$ とおく。【主張：$\partial U\subset C$ かつ $\partial V\subset C$】 $V$ は開で $U$ と交わらないので $\overline{U}\cap V=\varnothing$ であり、$U$ は開なので $\partial U=\overline{U}\setminus U\subset S^{n}\setminus(U\cup V)=C$ である。$V$ も同様である。

**Step 3（$C$ の各点は両方の閉包に入る）.** 【主張：$C\subset\overline{U}\cap\overline{V}$】 $x=h(y)\in C$ とその開近傍 $W$ をとる。$h^{-1}(W)$ は $y$ の開近傍なので、$y$ の周りの閉じた帽子 $D\defeq\{z\in S^{n-1}:\langle z,y\rangle\ge1-\varepsilon\}$ を $h(D)\subset W$ となるよう小さくとれる。$S^{n-1}\setminus\operatorname{int}D=\{\langle z,y\rangle\le1-\varepsilon\}$ は、$y$ からの立体射影で閉球に写る（$|\sigma(z)|^{2}$ は $\langle z,y\rangle$ について単調）ので、$D^{n-1}$ と同相である（$n=1$ では 1 点）。ゆえに \ref{at:complement-disk} から $S^{n}\setminus h(S^{n-1}\setminus\operatorname{int}D)$ の $\tilde H_{0}$ は $0$ であり、この集合は $U\cup V$ を含むので空でなく、弧状連結である。$u\in U$, $v\in V$ をこの集合の中の道 $\gamma$ で結ぶ。$U$ と $V$ は $S^{n}\setminus C$ の異なる成分なので $\gamma$ は $C$ と交わる。$\gamma^{-1}(C)$ は空でない閉集合で $0$ を含まないので、$t_{0}\defeq\min\gamma^{-1}(C)>0$ がある。$\gamma([0,t_{0}))$ は $S^{n}\setminus C$ の連結集合で $u$ を含むので $U$ に入り、ゆえに $\gamma(t_{0})\in\overline{U}$ である。$\gamma$ は $h(S^{n-1}\setminus\operatorname{int}D)$ を避けるので、$\gamma(t_{0})\in C\setminus h(S^{n-1}\setminus\operatorname{int}D)=h(\operatorname{int}D)\subset W$ である。$W$ は $\gamma(t_{0})\in\overline{U}$ の開近傍なので、$W\cap U\ne\varnothing$ である。同様に（$v$ から逆にたどって）$W\cap V\ne\varnothing$ である。$W$ は任意なので $x\in\overline{U}\cap\overline{V}$ である。

$C\cap U=\varnothing$ なので、Step 2・3 から $\partial U=\overline{U}\setminus U=C$ であり、$V$ についても同様である。

::: hypcheck
- 単射性は \ref{at:complement-sphere} と Step 3（$C\setminus h(S^{n-1}\setminus\operatorname{int}D)=h(\operatorname{int}D)$）に使った。単射でない閉曲線（8 の字など）は 3 つ以上の成分を作りうる。
- 分離される 2 成分がそれぞれ「円板と同相」とは限らない：$n=2$ では成り立つ（シェーンフリースの定理として知られている。本サイト未収録）が、$n=3$ ではアレクサンダーの角付き球面の外側の成分は単連結でないことが知られている（本サイト未収録）。この定理と \ref{at:complement-sphere} が与えるのは、成分の数が 2 であることと、補集合全体の被約ホモロジーが $S^{0}$ と同じであることだけで、各成分のホモロジーについては何も主張していない。
:::
:::

::: corollary ジョルダンの曲線定理 {#at:jordan-curve keywords="a simple closed curve in the plane separates it into a bounded and an unbounded component, with the curve as common boundary" index="ジョルダンの曲線定理（平面）|じょるだんのきょくせんていりへいめん" refname="ジョルダンの曲線定理"}
平面の単純閉曲線（連続単射 $S^{1}\to\mathbb{R}^{2}$ の像）$C$ について、$\mathbb{R}^{2}\setminus C$ はちょうど 2 つの連結成分をもち、一方は有界（ある円板に含まれる）、他方は非有界で、どちらの境界も $C$ である。
:::

::: proof
$\mathbb{R}^{2}$ を立体射影の逆で $S^{2}\setminus\{N\}$ と同一視する。$N\notin C$ なので、$S^{2}\setminus C$ の 2 つの成分（\ref{at:jordan-brouwer}）のうち $N$ を含むものを $U$、他方を $V$ とおく。このとき $\mathbb{R}^{2}\setminus C=(U\setminus\{N\})\sqcup V$ である。$U\setminus\{N\}$ が弧状連結であることを示す。$a,b\in U\setminus\{N\}$ を $U$ の道 $\gamma$ で結ぶ（$U$ は弧状連結）。$U$ は開なので、$N$ を中心とする閉円板 $B'$（$S$ からの立体射影の座標で）を、$B'\subset U$ かつ $a,b\notin B'$ となるようにとれる。$\gamma$ が $B'$ と交わる場合、最初に $B'$ に入る時刻 $t_{1}$ と最後に $B'$ から出る時刻 $t_{2}$ について $\gamma(t_{1}),\gamma(t_{2})$ は $B'$ の境界の円周上にあるので、$\gamma\restriction[t_{1},t_{2}]$ を円周に沿う道に取り替えれば、$N$ を避ける $U$ の中の道が得られる。ゆえに $U\setminus\{N\}$ と $V$ は $\mathbb{R}^{2}\setminus C$ の互いに交わらない弧状連結な開集合で、和が $\mathbb{R}^{2}\setminus C$ なので、これがちょうど 2 つの連結成分である。$N$ の近傍は $\mathbb{R}^{2}$ の有界集合の補集合に対応し、$U\setminus\{N\}$ は $N$ のどの近傍とも交わるので非有界である。$N\in U$ で $U$ は開なので、$V$ は $N$ のある近傍と交わらず、有界である。$\mathbb{R}^{2}$ での閉包は $S^{2}$ での閉包と $\mathbb{R}^{2}$ の共通部分なので、定理から $V$ の境界は $C$ であり、$U\setminus\{N\}$ の境界は $(\overline{U}\setminus U)\cap\mathbb{R}^{2}=C$ である（$\overline{U\setminus\{N\}}=\overline{U}$）。
:::

::: theorem 領域不変性 {#at:invariance-of-domain keywords="invariance of domain: a continuous injection from an open subset of R^n to R^n is open, hence an embedding" index="領域不変性|りょういきふへんせい"}
$U\subset\mathbb{R}^{n}$ が開集合で $h\colon U\to\mathbb{R}^{n}$ が連続単射なら、$h(U)$ は開で、$h$ は $U$ から $h(U)$ への同相写像。
:::

::: proof
$n=0$ なら $\mathbb{R}^{0}$ は 1 点で主張は明らかなので、$n\ge1$ とする。$\mathbb{R}^{n}$ を $S^{n}\setminus\{N\}$（$S^{n}$ の開集合）と同一視する。$x\in U$ をとり、$x$ を中心とし $U$ に含まれる閉球 $D$ と、その境界の球面 $S$ をとる（$U$ は開）。$D\cong D^{n}$, $S\cong S^{n-1}$ なので、$h\restriction D$, $h\restriction S$ はそれぞれ $D^{n}$, $S^{n-1}$ から $S^{n}$ への連続単射とみなせる。

**Step 1（補集合の分解）.** 【主張：$S^{n}\setminus h(S)$ はちょうど 2 つの成分 $P,Q$ をもち、$S^{n}\setminus h(S)=h(\operatorname{int}D)\sqcup(S^{n}\setminus h(D))$ の右辺の 2 つは空でない連結集合】 \ref{at:jordan-brouwer} から $S^{n}\setminus h(S)$ はちょうど 2 つの成分 $P,Q$ をもつ。$D=\operatorname{int}D\sqcup S$ と $h$ の単射性から、上の分解が成り立つ。$h(\operatorname{int}D)$ は連結集合 $\operatorname{int}D$ の連続像なので連結で、$h(x)$ を含むので空でない。$S^{n}\setminus h(D)$ は \ref{at:complement-disk} から $\tilde H_{0}=0$ なので弧状連結であり、$N$ を含むので空でない。

**Step 2（像は開）.** 【主張：$h(\operatorname{int}D)$ は $P$ か $Q$ に一致し、$S^{n}$ の開集合である】 連結集合はどれか 1 つの成分に含まれる。Step 1 の 2 つの集合が同じ成分（たとえば $P$）に入ると $Q=\varnothing$ となり矛盾するので、一方は $P$ に、他方は $Q$ に含まれる。両者の和は $P\sqcup Q$ なので、$h(\operatorname{int}D)=P$（あるいは $Q$）である。成分は開（\ref{at:jordan-brouwer}）なので、$h(\operatorname{int}D)$ は $S^{n}$ の開集合で、$h(x)$ を含み $h(U)$ に含まれる。$x\in U$ は任意だったので、$h(U)$ は $S^{n}$ の開集合であり、$\mathbb{R}^{n}$ でも開である。

**Step 3（同相）.** 【主張：$h$ は開写像で、$U$ から $h(U)$ への同相写像】 $U$ の開部分集合 $U'$ に $h\restriction U'$ で同じ議論を使うと $h(U')$ は開なので、$h$ は開写像である。連続な開単射の逆写像は連続なので（開集合の逆像が像そのもの）、$h$ は像への同相写像である。

::: hypcheck
- **次元が同じ**：冒頭と Step 1（$S$ が $S^{n-1}$ と同相で、分離定理が使えること）に使った。次元が違うと偽：$\mathbb{R}\to\mathbb{R}^{2}$, $t\mapsto(t,0)$ は連続単射だが像は開でない。
- **単射**：Step 1 の分解に使った。外すと偽（$\mathbb{R}\to\mathbb{R}$, $x\mapsto x^{2}$ の像 $[0,\infty)$ は開でない）。
:::
:::

::: corollary 高次元からの単射の非存在 {#at:no-injection-higher keywords="there is no continuous injection from R^m (or from a nonempty open subset) to R^n for m > n" index="連続単射の非存在|れんぞくたんしゃのひそんざい"}
$m>n$ なら、$\mathbb{R}^{m}$ の空でない開集合から $\mathbb{R}^{n}$ への連続単射は存在しない。
:::

::: proof
$U\subset\mathbb{R}^{m}$ を空でない開集合とし、$h\colon U\to\mathbb{R}^{n}$ が連続単射だと仮定する。$\mathbb{R}^{n}=\mathbb{R}^{n}\times\{0\}\subset\mathbb{R}^{m}$ との合成 $U\to\mathbb{R}^{m}$ も連続単射なので、領域不変性からその像は $\mathbb{R}^{m}$ の空でない開集合である。しかし像は $\mathbb{R}^{n}\times\{0\}$ に含まれ、$m>n$ なので $\mathbb{R}^{n}\times\{0\}$ は $\mathbb{R}^{m}$ の空でない開集合を含まない（どの点の周りの球も、最後の座標が $0$ でない点を含む）。これは矛盾である。
:::

::: supplement
**一般化.** 領域不変性から、境界付き多様体の（多様体としての）\term[境界点]{at:manifold-with-boundary}と内点が位相的に区別されること（「境界の不変性」）が従う。この系列では局所ホモロジーを使って示す（\see{at:boundary-invariance}）。補集合のホモロジーの計算は、空でないコンパクト集合 $K\subsetneq S^{n}$ についてのアレクサンダー双対性 $\tilde H_{i}(S^{n}\setminus K)\cong\tilde{\check{H}}{}^{n-i-1}(K)$ に一般化されることが知られている（本サイト未収録）。ここで右辺は**被約**チェックコホモロジーで、$K$ は局所可縮とは限らない（チェックコホモロジーについては \see{at:page-cech-comparison}）。被約でないチェックコホモロジーでは成り立たない：$K$ が 1 点なら左辺はすべての $i$ で $0$ だが、$\check H^{0}(K)=\mathbb{Z}$ である。$K$ が円板・球面なら右辺は被約特異コホモロジーと一致し、上の 2 定理を再現する。

**高い視点.** 二分法の議論（\ref{at:complement-disk} の Step 2〜4）は、「ホモロジーの元は有限の情報（コンパクトな台）で決まる」こと（\ref{at:compact-support}：開集合の増大列の和で境界になるサイクルは、ある段ですでに境界になる）と、マイヤー–ヴィートリスによる「局所から大域へ」の貼り合わせを組み合わせたものである。比喩で言えば、埋め込まれた円板は「どんなにくしゃくしゃに押し込んでも、周りの空間に穴を開けられない紙片」で、球面は「ちょうど 1 つの次元の穴を囲む膜」である。
:::

## 問題 {#at:sec-jb-problems}

::: problem {#at:prob-circle-in-s3}
$S^{3}$ に埋め込まれた円周 $C$（結び目）の補集合について、$H_{1}(S^{3}\setminus C)\cong\mathbb{Z}$, $\tilde H_{i}(S^{3}\setminus C)=0$（$i\ne1$）を示せ。（基本群は結び目ごとに異なりうるが、ホモロジーは結び目を区別しない。）
:::

::: solution
\ref{at:complement-sphere} で $n=3$, $k=1$ とおくと $n-k-1=1$ なので、$\tilde H_{1}(S^{3}\setminus C)\cong\mathbb{Z}$ であり、$i\ne1$ では $\tilde H_{i}(S^{3}\setminus C)=0$ である。$i=1$ では $H_{1}=\tilde H_{1}$ である。
:::

::: problem {#at:prob-sphere-no-embedding}
$n\ge1$ のとき、$S^{n}$ は $\mathbb{R}^{n}$ に埋め込めない（連続単射 $S^{n}\to\mathbb{R}^{n}$ はない）ことを示せ。
:::

::: solution
連続単射 $f\colon S^{n}\to\mathbb{R}^{n}$ があると仮定する。座標の番号 $\nu=1,\dots,n+1$ と符号 $\pm$ について、開半球 $O\defeq\{x\in S^{n}:\pm x_{\nu}>0\}$ は、第 $\nu$ 座標を除く射影で開球 $\mathring D^{n}\subset\mathbb{R}^{n}$ と同相である（逆写像は第 $\nu$ 座標に $\pm\sqrt{1-|y|^{2}}$ を入れる写像で、\ref{at:cube-disk.2} と同じ）。この同相の逆 $p\colon\mathring D^{n}\to O$ との合成 $f\circ p$ は、$\mathbb{R}^{n}$ の開集合 $\mathring D^{n}$ からの連続単射なので、領域不変性から $f(O)=f(p(\mathring D^{n}))$ は $\mathbb{R}^{n}$ の開集合である。$S^{n}$ の各点はどれかの座標が $0$ でないので、$S^{n}$ はこうした $2(n+1)$ 個の開半球で覆われる。ゆえに $f(S^{n})$ は開集合の和として開である。一方 $f(S^{n})$ はコンパクトなので閉で、空でない。$\mathbb{R}^{n}$ は連結なので $f(S^{n})=\mathbb{R}^{n}$ となり、$\mathbb{R}^{n}$ がコンパクトでないこと（$n\ge1$）に反する。
:::
