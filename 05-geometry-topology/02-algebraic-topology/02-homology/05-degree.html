# 球面の写像度 {#at:page-degree keywords="degree of a map of spheres, homotopy invariance of degree, suspension preserves degree, reflection has degree -1, antipodal map has degree (-1)^{n+1}, fixed points, hairy ball theorem, tangent vector fields on spheres, degree on the circle equals winding number, generator of H_1(S^1), two-hemisphere formula, relative degree on (D^m, boundary)"}

$\tilde H_{n}(S^{n})\cong\mathbb{Z}$（\ref{at:sphere-homology}）なので、連続写像 $f\colon S^{n}\to S^{n}$ は $\tilde H_{n}$ 上の整数倍として働く。この整数が**写像度**で、円周では閉道の回転数（\ref{at:degree-loop}）と一致する。このページでは写像度の基本性質を示し、鏡映の写像度が $-1$、対蹠写像の写像度が $(-1)^{n+1}$ であることから、不動点の存在と「偶数次元の球面には至る所 $0$ でない接ベクトル場がない」こと（**毛の生えた球面の定理**）を導く。最後に、胞体境界の計算（\ref[CW 複体と胞体ホモロジー]{at:page-cellular-homology}）で使う「二つの半球の公式」を示す。

> 資料：標準的な内容（Massey『Singular Homology Theory』、Fulton『Algebraic Topology』の写像度の章など）。鏡映の写像度を懸垂で帰納的に計算する議論と、二つの半球の公式は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-deg-notation}

::: notation
- 球面と円板のホモロジー \tref{at:sphere-homology}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}（$U=S^{n}\setminus\{N\}$, $V=S^{n}\setminus\{S\}$ による）、良い対と商空間 \ref{at:good-pair}、ホモトピー不変性 \tref{at:singular-homotopy-invariance}、連結射の自然性 \ref{ha:connecting-natural}。
- $N\defeq e_{n+1}$, $S\defeq-e_{n+1}$。$x\in\mathbb{R}^{n+1}$ を $(x',x_{n+1})$（$x'\in\mathbb{R}^{n}$）と書く。赤道 $E\defeq\{x_{n+1}=0\}\cap S^{n}=S^{n-1}\times\{0\}$。閉半球 $D_{\pm}\defeq\{\pm x_{n+1}\ge0\}$ と同相写像 $p_{\pm}\colon D^{n}\to D_{\pm}$, $p_{\pm}(y)\defeq(y,\pm\sqrt{1-|y|^{2}})$（\ref{at:cube-disk}）。
- 閉道の写像度（回転数）\ref{at:degree-loop}、$\omega_{k}(s)=e^{2\pi iks}$、円周の基本群 \tref{at:fundamental-group-circle}、フレヴィッツ準同型 \ref{at:hurewicz-homomorphism}。
- **選択公理**：使わない。
:::

## 定義と基本性質 {#at:sec-deg-definition}

::: definition 写像度 {#at:degree keywords="degree of a continuous map S^n -> S^n defined by the action on reduced H_n" index="写像度|しゃぞうど"}
$n\ge0$ と連続写像 $f\colon S^{n}\to S^{n}$ について、$f_{*}\colon\tilde H_{n}(S^{n})\to\tilde H_{n}(S^{n})$ は無限巡回群からそれ自身への準同型なので、ある整数 $d$ による $d$ 倍写像である（生成元 $u$ について $f_{*}u=du$ で、$d$ は $u$ の選び方によらない：$-u$ についても $f_{*}(-u)=d(-u)$）。$d$ を $f$ の**写像度**といい $\deg f$ と書く。
:::

::: proposition 写像度の基本性質 {#at:degree-properties keywords="deg id = 1, deg(fg) = deg f deg g, homotopic maps have the same degree, homotopy equivalences have degree +-1, non-surjective maps have degree 0" index="写像度の基本性質|しゃぞうどのきほんせいしつ"}
1. $\deg1=1$、$\deg(g\circ f)=\deg g\cdot\deg f$。
2. $f\simeq g$ なら $\deg f=\deg g$。ホモトピー同値（とくに同相写像）の写像度は $\pm1$。
3. $f$ が全射でなければ $\deg f=0$。
4. 同相写像 $h\colon S^{n}\to S^{n}$ について $\deg(h^{-1}fh)=\deg f$。
:::

::: proof
1：関手性 $(g\circ f)_{*}=g_{*}f_{*}$, $1_{*}=1$ から従う。2：前半は \ref{at:singular-homotopy-invariance} から $f_{*}=g_{*}$ となることによる。$f$ がホモトピー同値でホモトピー逆写像が $g$ なら $gf\simeq1$ なので、1 と前半から $\deg g\deg f=1$ であり、整数なので $\deg f=\pm1$ である。3：$y\notin f(S^{n})$ なら $f$ は包含 $S^{n}\setminus\{y\}\to S^{n}$ を経由し、$S^{n}\setminus\{y\}\cong\mathbb{R}^{n}$ は可縮なので $\tilde H_{n}(S^{n}\setminus\{y\})=0$ である。ゆえに $f_{*}=0$ であり、$\deg f=0$ である。4：1 から $\deg(h^{-1}fh)=\deg h^{-1}\deg f\deg h$ であり、整数の積は可換で $\deg h^{-1}\deg h=\deg1=1$ なので、これは $\deg f$ に等しい。
:::

::: lemma 懸垂と写像度 {#at:suspension-degree keywords="the suspension of f: S^{n-1} -> S^{n-1} has the same degree; every integer is a degree" index="懸垂と写像度|けんすいとしゃぞうど"}
$n\ge1$ と $f\colon S^{n-1}\to S^{n-1}$ について、
$$
\Sigma f(x',x_{n+1})\defeq\Bigl(|x'|\,f\bigl(x'/|x'|\bigr),\ x_{n+1}\Bigr)\quad(x'\ne0),\qquad\Sigma f(\pm e_{n+1})\defeq\pm e_{n+1}
$$
は連続写像 $S^{n}\to S^{n}$ で、$\deg\Sigma f=\deg f$。
:::

::: proof
**Step 1（連続性）.** 【主張：$\Sigma f$ は $S^{n}$ から $S^{n}$ への連続写像】 $|\Sigma f(x)|^{2}=|x'|^{2}+x_{n+1}^{2}=1$ なので、値は $S^{n}$ に入る。$x'\ne0$ では連続関数の合成なので連続である。極の近くでは $|x'|\to0$ なので、第 1 成分（ノルムは $|x'|$）は $0$ に、第 2 成分は $\pm1$ に近づき、極でも連続である。

**Step 2（マイヤー–ヴィートリスの自然性）.** 【主張：連結射 $\partial_{*}\colon\tilde H_{n}(S^{n})\to\tilde H_{n-1}(U\cap V)$ は同型で、$\partial_{*}(\Sigma f)_{*}=(\Sigma f\restriction U\cap V)_{*}\partial_{*}$】 $\Sigma f$ は第 $n+1$ 座標を保つので、$\Sigma f(x)=N$ となるのは $x=N$ のときだけであり、$S$ についても同様である。ゆえに $\Sigma f$ は $U$, $V$, $U\cap V$ をそれぞれ自分自身に写す。被約マイヤー–ヴィートリスの連結射は同型であり（\ref{at:sphere-homology} の証明）、$U,V$ を保つ写像について自然である（短完全列 $0\to S(U\cap V)\to S(U)\oplus S(V)\to S(U)+S(V)\to0$ の写像と \ref{ha:connecting-natural}）。

**Step 3（赤道への引き込み）.** 【主張：$(\Sigma f\restriction U\cap V)_{*}$ は $\tilde H_{n-1}(U\cap V)\cong\mathbb{Z}$ 上の $\deg f$ 倍】 $\rho\colon U\cap V\to E$, $\rho(x)\defeq(x'/|x'|,0)$ とおく。これは包含 $i\colon E\to U\cap V$ のホモトピー逆写像である：$\rho i=1$ であり、$i\rho\simeq1$ は $\bigl(((1-t)+t/|x'|)x',(1-t)x_{n+1}\bigr)$ を正規化したホモトピーで与えられる（ベクトルは $x'\ne0$ なので $0$ でなく、第 1 成分が $0$ でないので極を通らない）。さらに $\rho\circ\Sigma f=\Sigma f\circ\rho$ であり、$E\cong S^{n-1}$ の上で $\Sigma f\restriction E=f$ である。ゆえに
$$
(\Sigma f\restriction U\cap V)_{*}=(\Sigma f\restriction U\cap V)_{*}i_{*}\rho_{*}=i_{*}f_{*}\rho_{*}
$$
であり、$i_{*}$ と $\rho_{*}$ は互いに逆の同型なので、これは $f_{*}$ と同じく $\deg f$ 倍である。

Step 2・3 から、$\tilde H_{n}(S^{n})$ の生成元 $u$ について $\partial_{*}(\Sigma f)_{*}u=(\deg f)\,\partial_{*}u$ であり、$\partial_{*}$ は単射なので $(\Sigma f)_{*}u=(\deg f)u$、すなわち $\deg\Sigma f=\deg f$ である（$n=1$ では $U\cap V\simeq S^{0}$ の被約 $\tilde H_{0}$ の上で同じ議論をする）。
:::

::: proposition 鏡映と対蹠写像 {#at:degree-reflection keywords="a reflection of S^n has degree -1, the antipodal map has degree (-1)^{n+1}, orthogonal maps have degree det" index="鏡映の写像度|きょうえいのしゃぞうど, 対蹠写像の写像度|たいせきしゃぞうのしゃぞうど"}
1. 座標の鏡映 $r_{i}(x)\defeq(x_{1},\dots,-x_{i},\dots,x_{n+1})$ の写像度は $-1$。
2. 対蹠写像 $a(x)\defeq-x$ の写像度は $(-1)^{n+1}$。
:::

::: proof
**Step 1（$i=1$）.** 【主張：$\deg r_{1}=-1$】 $n$ についての帰納法で示す。$n=0$ の場合、$S^{0}=\{\pm1\}$ で $r_{1}$ は 2 点を入れ替え、$\tilde H_{0}(S^{0})$ の生成元 $[1]-[-1]$ を $[-1]-[1]$ に送るので、$\deg r_{1}=-1$ である。$n\ge1$ の場合、\ref{at:suspension-degree} の式に代入すると $\Sigma r_{1}(x',x_{n+1})=(r_{1}x',x_{n+1})$ となるので、$S^{n}$ の $r_{1}$ は $S^{n-1}$ の $r_{1}$ の懸垂である。ゆえに帰納法の仮定と \ref{at:suspension-degree} から $\deg r_{1}=-1$ である。

**Step 2（一般の $i$）.** 【主張：$\deg r_{i}=-1$】 座標 $1$ と $i$ を入れ替える同相写像 $h$ について $r_{i}=h^{-1}r_{1}h$ なので、\ref{at:degree-properties.4} から $\deg r_{i}=\deg r_{1}=-1$ である。

**Step 3（対蹠写像）.** 【主張：$\deg a=(-1)^{n+1}$】 $a=r_{1}\circ\cdots\circ r_{n+1}$ なので、\ref{at:degree-properties.1} と Step 2 から $\deg a=(-1)^{n+1}$ である。
:::

::: theorem 不動点と写像度 {#at:degree-fixed-points keywords="a map without fixed points is homotopic to the antipodal map; a map with f(x) != -x for all x is homotopic to the identity" index="写像度と不動点|しゃぞうどとふどうてん"}
$f\colon S^{n}\to S^{n}$ について、
1. $f$ が不動点をもたなければ $f\simeq a$ で、$\deg f=(-1)^{n+1}$。
2. すべての $x$ で $f(x)\ne-x$ なら $f\simeq1$ で、$\deg f=1$。
とくに $n$ が偶数なら、任意の $f$ は不動点をもつか、ある $x$ を $-x$ に送る。
:::

::: proof
1：$H(x,t)\defeq\frac{(1-t)f(x)-tx}{|(1-t)f(x)-tx|}$ とおく。分母が $0$ になったとすると $(1-t)f(x)=tx$ であり、ノルムをとると $1-t=t$、すなわち $t=\frac12$ となるので $f(x)=x$ が従い、仮定に反する。ゆえに $H$ は連続で、$H(x,0)=f(x)$, $H(x,1)=-x$ なので、$f$ から $a$ へのホモトピーである。よって \ref{at:degree-properties.2} と \ref{at:degree-reflection.2} から $\deg f=(-1)^{n+1}$ である。2：$\frac{(1-t)f(x)+tx}{|(1-t)f(x)+tx|}$ を使えば同様である（分母が $0$ なら $f(x)=-x$ となる）。最後の主張：$n$ が偶数なら $(-1)^{n+1}=-1\ne1$ なので、1 と 2 の仮定は同時には成り立たない。
:::

::: theorem 毛の生えた球面の定理 {#at:hairy-ball keywords="S^n admits a nowhere vanishing continuous tangent vector field iff n is odd" index="毛の生えた球面の定理|けのはえたきゅうめんのていり, 接ベクトル場|せつべくとるば" refname="毛の生えた球面の定理"}
$S^{n}$ 上の連続写像 $v\colon S^{n}\to\mathbb{R}^{n+1}$ で、すべての $x$ で $v(x)\perp x$ かつ $v(x)\ne0$ となるもの（至る所 $0$ でない接ベクトル場）が存在するための必要十分条件は、$n$ が奇数であること。
:::

::: proof
**Step 1（奇数次元の構成）.** $n=2m-1$ なら $v(x)\defeq(-x_{2},x_{1},-x_{4},x_{3},\dots,-x_{2m},x_{2m-1})$ とおくと $\langle v(x),x\rangle=0$, $|v(x)|=|x|=1$ である。

**Step 2（偶数次元では存在しない）.** $v$ があると仮定し、$w\defeq v/|v|$, $H(x,t)\defeq\cos(\pi t)x+\sin(\pi t)w(x)$ とおく。$x\perp w(x)$ で両方とも単位ベクトルなので $|H(x,t)|=1$ であり、$H$ は $1$ から $a$ へのホモトピーである。ゆえに \ref{at:degree-properties.2} と \ref{at:degree-reflection.2} から $1=\deg a=(-1)^{n+1}$ となり、$n$ は奇数である。
:::

::: supplement
**一般化.** 閉多様体上の孤立零点をもつ接ベクトル場について、零点の指数の和はオイラー標数に等しい（ポアンカレ–ホップの定理。知られている。多様体論の系列で扱う予定）。$n$ が偶数なら $\chi(S^{n})=1+(-1)^{n}=2\ne0$ なので、この定理からも零点のない接ベクトル場は存在しないことが分かる。奇数次元の球面上で各点で一次独立な接ベクトル場が最大何本とれるかは、アダムズによりラドン–フルヴィッツ数で決定されたことが知られている（本サイト未収録）。
:::

## 円周の写像度と回転数 {#at:sec-deg-circle}

::: proposition 円周の 1 次ホモロジーの生成元 {#at:circle-h1-generator keywords="the loop omega_1 generates H_1(S^1); degree on S^1 equals the winding number; z^k has degree k" index="円周の 1 次ホモロジー|えんしゅうのいちじほもろじー"}
1. 標準的な閉道 $\omega_{1}$ の類は $H_{1}(S^{1})\cong\mathbb{Z}$ の生成元。
2. $f\colon S^{1}\to S^{1}$ で $f(1)=1$ なら、写像度 $\deg f$ は閉道 $f\circ\omega_{1}$ の回転数（\ref{at:degree-loop}）に等しい。とくに $\deg(z\mapsto z^{k})=k$ で、\ref{at:suspension-degree} からすべての $n\ge1$ と $k\in\mathbb{Z}$ について写像度 $k$ の写像 $S^{n}\to S^{n}$ がある。
:::

::: proof
**Step 1（四分割）.** $q_{j}$（$j=1,2,3,4$）を $\omega_{1}$ の $[\frac{j-1}{4},\frac{j}{4}]$ の部分（$1\to i\to-1\to-i\to1$）とする。【主張：$H_{1}(S^{1})$ で $[\omega_{1}]=[q_{1}+q_{2}+q_{3}+q_{4}]$】 \ref{at:path-subdivision} と \ref{at:hurewicz-homomorphism.1}・\ref[2]{at:hurewicz-homomorphism.2} から従う。

**Step 2（マイヤー–ヴィートリス）.** 【主張：$[\omega_{1}]$ は $H_{1}(S^{1})$ の生成元】 $U\defeq S^{1}\setminus\{-1\}$, $V\defeq S^{1}\setminus\{1\}$ とおく。これらは開弧で可縮であり、$U\cap V$ は上の開弧と下の開弧の非交和である。$H_{1}(U)\oplus H_{1}(V)=0$ と $\tilde H_{0}(U)\oplus\tilde H_{0}(V)=0$ から、マイヤー–ヴィートリスの連結射は同型 $\partial_{*}\colon H_{1}(S^{1})\cong\tilde H_{0}(U\cap V)\cong\mathbb{Z}$ であり、右辺は $[i]-[-i]$ で生成される（\ref{at:singular-h0-point}）。連結射の構成から、サイクル $z=a+b$（$a\in S(U)$, $b\in S(V)$）について $\partial_{*}[z]=[\partial a]$ である。$a\defeq q_{1}+q_{4}\in S(U)$, $b\defeq q_{2}+q_{3}\in S(V)$ とおくと、$\partial a=(i-1)+(1-(-i))=i-(-i)$ であり、その類は $[i]-[-i]$ である。よって $\partial_{*}[\omega_{1}]$ は生成元であり、$[\omega_{1}]$ も生成元である。

**Step 3（2）.** 【主張：$f(1)=1$ なら、$f\circ\omega_{1}$ の回転数 $d$ について $f_{*}[\omega_{1}]=d[\omega_{1}]$】 \ref{at:fundamental-group-circle} から、回転数が等しい閉道はホモトープなので $f\circ\omega_{1}\simeq\omega_{d}$ である。フレヴィッツ準同型 $h\colon\pi_{1}(S^{1},1)\to H_{1}(S^{1})$（\ref{at:hurewicz-homomorphism}）は準同型で $[\omega_{d}]=[\omega_{1}]^{d}$ なので、$f_{*}[\omega_{1}]=[f\circ\omega_{1}]=[\omega_{d}]=d[\omega_{1}]$ である。

とくに $z\mapsto z^{k}$ は $\omega_{1}$ を $\omega_{k}$ に写すので写像度 $k$ をもち、\ref{at:suspension-degree} で懸垂を繰り返せば、各 $n\ge1$ で写像度 $k$ の写像 $S^{n}\to S^{n}$ が得られる。
:::

::: supplement
**写像度の二つの定義.** $f(1)\ne1$ の場合も、回転 $\rho$（$\rho\simeq1$ で写像度 $1$）を合成して $f(1)=1$ にすれば、ホモロジーの写像度と回転数は一致する。こうして \ref{at:degree-loop} の「閉道の持ち上げの終点のずれ」と、ここでの「$H_{1}$ への作用」という全く異なる定義が同じ整数を与える。

**高い視点.** 写像度はホモトピー類の集合 $[S^{n},S^{n}]$ から $\mathbb{Z}$ への全単射を与える（$n\ge1$）。全射は \ref{at:circle-h1-generator.2} の最後の主張で、単射（写像度が等しい写像はホモトープであること）は \see{at:hopf-degree-theorem} の内容である。基点を保つホモトピー類で考えると、写像度は群の同型 $\pi_{n}(S^{n})\cong\mathbb{Z}$ を与える（\see{at:pin-sn-hopf}）。比喩で言えば、写像度は「球面で球面を何重に包むか（向きを込めて）」の数え上げで、包み方の細部は連続変形で変わるが、重なりの総数は変わらない。
:::

## 二つの半球の公式 {#at:sec-deg-hemispheres}

::: lemma 円板の対の写像度 {#at:relative-degree keywords="for a map A: (D^m, boundary) -> (D^m, boundary), the action on H_m(D^m, boundary) equals the degree of the restriction to the boundary sphere" index="相対写像度|そうたいしゃぞうど"}
$m\ge1$ と、$A(\partial D^{m})\subset\partial D^{m}$ となる連続写像 $A\colon D^{m}\to D^{m}$ について、$A_{*}$ は $H_{m}(D^{m},\partial D^{m})\cong\mathbb{Z}$ 上で $\deg(A\restriction\partial D^{m})$ 倍。とくに $y\mapsto-y$ は $(-1)^{m}$ 倍。
:::

::: proof
被約の長完全列の連結射 $\partial\colon H_{m}(D^{m},\partial D^{m})\to\tilde H_{m-1}(\partial D^{m})$ は同型（\ref{at:sphere-homology}）で、対の写像について自然なので、$\partial A_{*}=(A\restriction\partial D^{m})_{*}\partial$ である。ゆえに生成元 $u$ について $\partial A_{*}u=\deg(A\restriction\partial D^{m})\,\partial u$ であり、$\partial$ は単射なので $A_{*}u=\deg(A\restriction\partial D^{m})\,u$ である。最後の主張は、$y\mapsto-y$ の $\partial D^{m}=S^{m-1}$ への制限が対蹠写像で、その写像度が $(-1)^{m}$ であること（\ref{at:degree-reflection.2}）による。
:::

::: theorem 二つの半球の公式 {#at:two-hemispheres keywords="if f: S^m -> S^m collapses the equator to a point, then deg f = +-(deg g_+ - deg g_-), with a sign independent of f" index="二つの半球の公式|ふたつのはんきゅうのこうしき"}
$m\ge1$ とし、$\pi\colon D^{m}\to S^{m}$ を、$\partial D^{m}$ を 1 点 $y_{0}$ に写し、商 $D^{m}/\partial D^{m}\to S^{m}$ が同相となる連続写像として 1 つ固定する。$f\colon S^{m}\to S^{m}$ が赤道 $E$ を $y_{0}$ に写すとき、$f\circ p_{\pm}=g_{\pm}\circ\pi$ となる連続写像 $g_{\pm}\colon S^{m}\to S^{m}$ がただ一つずつあり、
$$
\deg f=\epsilon\,(\deg g_{+}-\deg g_{-})
$$
が成り立つ。ここで $\epsilon\in\{\pm1\}$ は $\pi$ だけで決まり、$f$ によらない。
:::

::: proof
**Step 1（$g_{\pm}$）.** 【主張：$f\circ p_{\pm}=g_{\pm}\circ\pi$ となる連続写像 $g_{\pm}$ がただ一つずつある】 $p_{\pm}(\partial D^{m})=E$ なので、$f\circ p_{\pm}$ は $\partial D^{m}$ を $y_{0}$ に写す。ゆえに商写像の普遍性（\ref{top:quotient-universal}）と同相 $D^{m}/\partial D^{m}\cong S^{m}$ から $g_{\pm}$ が定まり、$\pi$ は全射なので一意である。

**Step 2（$H_{m}(S^{m},E)$ の分解）.** $u$ を $H_{m}(D^{m},\partial D^{m})\cong\mathbb{Z}$ の生成元とする。$(D^{m},\partial D^{m})$ は良い対なので、\ref{at:good-pair} から $\pi_{*}\colon H_{m}(D^{m},\partial D^{m})\to H_{m}(S^{m},y_{0})\cong\tilde H_{m}(S^{m})$ は同型である。$s\defeq\pi_{*}u$ とおく。【主張：$H_{m}(S^{m},E)$ は $u_{+}\defeq p_{+*}u$ と $u_{-}\defeq p_{-*}u$ を基底とする階数 2 の自由アーベル群】 ここで $p_{\pm}$ は対の写像 $(D^{m},\partial D^{m})\to(S^{m},E)$ とみる。$(S^{m},E)$ は良い対で、$S^{m}/E$ は $D_{+}/E$ と $D_{-}/E$（ともに $S^{m}$ と同相）のウェッジ和である。ウェッジ和の被約ホモロジーは、各成分の包含が誘導する同型で各成分の和になる（問題 \ref{at:prob-wedge-spheres}）。$u_{+}$ の像は、同相 $D^{m}/\partial D^{m}\cong D_{+}/E$ を通して $\tilde H_{m}(D_{+}/E)$ の生成元を包含で送ったものであり、$u_{-}$ も同様である。

**Step 3（$\tilde H_{m}(S^{m})$ の像）.** 【主張：$j(s)=\epsilon(u_{+}-u_{-})$ となる符号 $\epsilon\in\{\pm1\}$ があり、$\epsilon$ は $\pi$ だけで決まる】 被約の長完全列
$$
0=\tilde H_{m}(E)\to\tilde H_{m}(S^{m})\xrightarrow{j}H_{m}(S^{m},E)\xrightarrow{\partial}\tilde H_{m-1}(E)\to\tilde H_{m-1}(S^{m})=0
$$
がある。$p_{\pm}\restriction\partial D^{m}$ はどちらも $y\mapsto(y,0)$ なので、連結射の自然性から $\partial u_{+}=\partial u_{-}$ であり、これは $\tilde H_{m-1}(E)$ の生成元である（\ref{at:relative-degree} の証明の連結射の同型）。ゆえに $\partial(au_{+}+bu_{-})=(a+b)\partial u_{+}$ から $\ker\partial=\mathbb{Z}(u_{+}-u_{-})$ である。完全性から $j$ は単射で像は $\ker\partial$ なので、$j$ は $\tilde H_{m}(S^{m})$ から $\ker\partial$ への同型であり、生成元 $s$ は $\epsilon(u_{+}-u_{-})$（$\epsilon=\pm1$）に写る。$u$ を $-u$ に替えると $s,u_{+},u_{-}$ がすべて符号を変えるので、$\epsilon$ は $\pi$ だけで決まる。

**Step 4（$f$ の分解）.** 【主張：$f_{*}s=\epsilon(\deg g_{+}-\deg g_{-})s$】 $f$ は $E$ を $y_{0}$ に写すので対の写像 $f\colon(S^{m},E)\to(S^{m},y_{0})$ を与え、$f_{*}\colon\tilde H_{m}(S^{m})\to\tilde H_{m}(S^{m})\cong H_{m}(S^{m},y_{0})$ は $j$ の後に対の写像 $f$ の誘導写像を合成した $f_{*}\circ j$ と一致する。$g_{\pm}(y_{0})=g_{\pm}(\pi(\partial D^{m}))=f(E)=y_{0}$ なので、$g_{\pm}$ は $H_{m}(S^{m},y_{0})\cong\tilde H_{m}(S^{m})$ に $\deg g_{\pm}$ 倍で働く。ゆえに $f_{*}u_{\pm}=(f\circ p_{\pm})_{*}u=(g_{\pm}\circ\pi)_{*}u=g_{\pm*}s=(\deg g_{\pm})s$ である。よって
$$
f_{*}s=f_{*}j(s)=\epsilon(f_{*}u_{+}-f_{*}u_{-})=\epsilon(\deg g_{+}-\deg g_{-})s
$$
であり、$\deg f=\epsilon(\deg g_{+}-\deg g_{-})$ である。

::: hypcheck
- 符号 $\epsilon$ を決めないのは、$D^{m}$ と $S^{m}$ の「向き」を比べる必要があるため。胞体ホモロジーでの応用（射影空間）では、絶対値 $|\deg g_{+}-\deg g_{-}|$ だけで群の構造が決まるので、$\epsilon$ は要らない。
:::
:::

::: example 射影空間の貼り付け写像の写像度
$k\ge2$ とし、$q\colon S^{k-1}\to\mathbb{R}P^{k-1}$ を商写像、$c\colon\mathbb{R}P^{k-1}\to\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ を\term[部分空間]{top:subspace} $\mathbb{R}P^{k-2}$（$x_{k}=0$ の点の像）を潰す写像とする。$\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ は、$\pi\defeq c\circ q\circ p_{+}\colon D^{k-1}\to\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ により $D^{k-1}/\partial D^{k-1}$ と同相である。実際、$\pi$ は $\partial D^{k-1}$ を 1 点（$\mathbb{R}P^{k-2}$ の像）に写すので、連続写像 $\bar\pi\colon D^{k-1}/\partial D^{k-1}\to\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ を誘導する。逆向きに、$x=(x',x_{k})\in S^{k-1}$ を、$x_{k}\ge0$ なら $x'$ の類に、$x_{k}\le0$ なら $-x'$ の類に送る写像 $S^{k-1}\to D^{k-1}/\partial D^{k-1}$ を考える。$x_{k}=0$ では $|x'|=1$ なのでどちらも基点で一致し、2 つの閉集合の上で連続なので連続である。これは $x$ と $-x$ で同じ値をとり、$x_{k}=0$ の点を基点に送るので、商写像の普遍性（\ref{top:quotient-universal}）を 2 回使って $\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}\to D^{k-1}/\partial D^{k-1}$ を誘導し、これが $\bar\pi$ の逆写像である。この同相で $\mathbb{R}P^{k-1}/\mathbb{R}P^{k-2}$ を $S^{k-1}$ と同一視し、\ref{at:two-hemispheres} の $\pi$ とする。$f\defeq c\circ q$ は赤道 $E$ を 1 点に写し、$f\circ p_{+}=\pi$ なので $g_{+}=1$ である。$q(-x)=q(x)$ と $p_{-}(y)=-p_{+}(-y)$ から $f\circ p_{-}(y)=f(p_{+}(-y))=\pi(-y)$ となるので、$g_{-}$ は $y\mapsto-y$ が $D^{k-1}/\partial D^{k-1}$ に誘導する写像である。ゆえに \ref{at:relative-degree} と、$\pi$ が誘導する同型 $H_{k-1}(D^{k-1},\partial D^{k-1})\cong\tilde H_{k-1}(S^{k-1})$ から $\deg g_{-}=(-1)^{k-1}$ である。\ref{at:two-hemispheres}（$m=k-1\ge1$）から
$$
|\deg f|=|1-(-1)^{k-1}|=1+(-1)^{k}
$$
である。この計算は $\mathbb{R}P^{n}$ の胞体ホモロジーで使う。
:::

## 問題 {#at:sec-deg-problems}

::: problem {#at:prob-odd-map-even}
$n$ が偶数のとき、連続写像 $f\colon\mathbb{R}P^{n}\to\mathbb{R}P^{n}$ の持ち上げ $\tilde f\colon S^{n}\to S^{n}$（$q\tilde f=fq$）が存在するなら、$\tilde f$ は不動点をもつか、ある $x$ を $-x$ に送ることを示せ。これから、$n$ が偶数なら $\mathbb{R}P^{n}$ の自己写像で持ち上げをもつものは不動点をもつことを導け。
:::

::: solution
前半は \ref{at:degree-fixed-points} の最後の主張である。後半：前半からある $x$ で $\tilde f(x)=x$ または $\tilde f(x)=-x$ であり、どちらの場合も $f(q(x))=q(\tilde f(x))=q(x)$ なので、$q(x)$ は $f$ の不動点である。
:::

::: problem {#at:prob-degree-reflection-composition}
直交行列 $Q\in O(n+1)$ による写像 $x\mapsto Qx$ の写像度は $\det Q$ であることを示せ（内積は \ref{lin:page-inner-product}）。
:::

::: solution
超平面に関する鏡映 $R_{v}(x)=x-2\langle x,v\rangle v$（$|v|=1$）は、$v$ を $e_{1}$ に移す直交行列 $P$ について $R_{v}=P^{-1}r_{1}P$ であり、$\deg R_{v}=\deg r_{1}=-1$ である（\ref{at:degree-properties.4}、\ref{at:degree-reflection}）。$Q$ は鏡映の積である：$Qe_{1}\ne e_{1}$ なら $v\defeq(Qe_{1}-e_{1})/|Qe_{1}-e_{1}|$ とすると、$\langle Qe_{1},Qe_{1}-e_{1}\rangle=1-\langle Qe_{1},e_{1}\rangle=\frac12|Qe_{1}-e_{1}|^{2}$ から $R_{v}Qe_{1}=e_{1}$ となる。$R_{v}Q$（または $Qe_{1}=e_{1}$ なら $Q$）は $e_{1}$ を固定し $e_{1}^{\perp}$ を保つ直交変換なので、次元についての帰納法で $e_{1}^{\perp}$ の鏡映（$e_{1}$ に直交する $v$ による $R_{v}$）の積である。$R_{v}$ は対合なので $Q=R_{v}(R_{v}Q)$ も鏡映の積（高々 $n+1$ 個）である。$Q$ を $k$ 個の鏡映の積に書くと、写像度と行列式はともに乗法的で、鏡映の行列式は $-1$ なので、$\deg Q=(-1)^{k}=\det Q$ である。
:::

::: problem {#at:prob-degree-not-surjective-circle}
写像度 $0$ の写像 $S^{1}\to S^{1}$ は定値写像とホモトープであることを示せ。
:::

::: solution
回転 $\rho$ は恒等写像とホモトープなので、$f$ を $\rho\circ f$ に替えて $f(1)=1$ としてよい。\ref{at:circle-h1-generator.2} から $f\circ\omega_{1}$ の回転数は $\deg f=0$ であり、その持ち上げ $\tilde\gamma$（$\tilde\gamma(0)=0$）は $\tilde\gamma(1)=0$ を満たす。$p(t)\defeq e^{2\pi it}$ とおくと $f(e^{2\pi is})=p(\tilde\gamma(s))$ である。$\tilde\gamma(0)=\tilde\gamma(1)$ なので、$\tilde\gamma$ は商写像 $I\to S^{1}$ を通して連続写像 $\tilde f\colon S^{1}\to\mathbb{R}$ を与え（\ref{at:prob-nullhomotopic-extends} の解答と同じ）、$f=p\circ\tilde f$ となる。$H(z,t)\defeq p((1-t)\tilde f(z))$ とおくと、$H$ は $f$ から定値写像 $1$ へのホモトピーである。
:::
