# ホモロジー論（Homology Theory）

単体的・特異・胞体ホモロジー、ホモトピー不変性、相対ホモロジーと切除、マイヤー–ヴィートリス、球面のホモロジーと領域不変性・ジョルダン–ブラウワーの分離定理、CW 複体、単体的・胞体・特異ホモロジーの一致、アイレンバーグ–スティーンロッドの公理と一意性（無限 CW 複体を含む）、普遍係数定理とキュネットの定理。局所ホモロジーと境界の不変性、まつわり複体による局所ホモロジーの計算と、単体複体・CW 複体が多様体になる条件。

<p class="mn-msc">MSC2020: 55N</p>
