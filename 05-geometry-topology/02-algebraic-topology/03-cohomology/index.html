# コホモロジー論（Cohomology Theory）

特異コホモロジーと普遍係数定理、ボルスク–ウラム、カップ積と次数付き可換性、チェック・層・特異コホモロジーの CW 複体での一致、理論が一致しない空間（ワルシャワの円・カントール集合・ハワイの耳飾り）、キャップ積とポアンカレ双対性。

<p class="mn-msc">MSC2020: 55N, 55U</p>

## 前提知識

- [代数的位相幾何学 › ホモロジー論](../../../05-geometry-topology/02-algebraic-topology/02-homology/index.html)（全体、13 ページ）：特異ホモロジー・切除・胞体ホモロジー・公理
- [ホモロジー代数 › 導来関手](../../../02-algebra/06-homological-algebra/02-derived-functors/index.html)（全体、9 ページ）：Ext と Tor
- [圏論 › 層のコホモロジー](../../../01-foundations/06-category-theory/08-sheaf-cohomology/index.html)（全体、6 ページ）：証明・主張で使う：チェック複体・層コホモロジーと特異コホモロジー・軟層の基本補題 など
