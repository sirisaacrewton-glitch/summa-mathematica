# カップ積 {#at:page-cup-product keywords="cup product of singular cochains, front face and back face, Leibniz rule, cohomology ring, graded commutativity via acyclic models, relative cup product, simplicial cochains of Delta-complexes, cohomology ring of the torus, Z/2 cohomology of RP^2, torus versus wedge of circles and a sphere, cup products in wedge sums and suspensions"}

コホモロジーには、コチェインを「単体の前の面で一方、後ろの面で他方を評価して掛ける」ことで積が入る。これが**カップ積**で、$H^{*}(X;R)$ は次数付き可換環になる。ホモロジー群が同じでも、カップ積で区別できる空間がある：トーラス $S^{1}\times S^{1}$ と $S^{1}\vee S^{1}\vee S^{2}$ はホモロジー群がすべて等しいが、前者では 1 次の類の積が $0$ でなく、後者では $0$ である。

> 資料：標準的な内容（Massey『Singular Homology Theory』、Fulton『Algebraic Topology』のカップ積の章など）。次数付き可換性は非輪状モデルによる証明を、Δ 複体での計算は自分で書き下ろした。

## 記法と定義の確認 {#at:sec-cp-notation}

::: notation
- 特異コホモロジー・普遍係数定理・ホモロジー同型からのコホモロジー同型は \ref{at:singular-cohomology}, \ref{at:uct-cohomology}, \ref{at:homology-iso-cohomology-iso}、公理 \ref{at:cohomology-axioms}。
- 非輪状モデルの定理 \tref{at:acyclic-models}。Δ 複体と単体的鎖複体、特異鎖複体との比較写像 $\theta$ は \ref{at:delta-complex}, \ref{at:simplicial-chains}, \ref{at:simplicial-singular-iso}。トーラスと実射影平面の Δ 複体は \ref{at:delta-complex} の例 2・3。
- $R$ は可換環（単位元 $1$ をもつ）。特異単体 $\sigma\colon\Delta^{n}\to X$ と $0\le i_{0}<\dots<i_{k}\le n$ について、$\sigma\restriction[e_{i_{0}},\dots,e_{i_{k}}]\defeq\sigma\circ[e_{i_{0}},\dots,e_{i_{k}}]$（アフィン単体との合成）。
- **選択公理**：次数付き可換性の証明（非輪状モデルの定理）で従属選択公理を使う。それ以外は使わない。
:::

## 定義と基本性質 {#at:sec-cp-definition}

::: definition カップ積 {#at:cup-product keywords="cup product (phi cup psi)(sigma) = phi(front p-face) psi(back q-face)" index="カップ積|かっぷせき, 前面|ぜんめん, 後面|こうめん"}
$\varphi\in S^{p}(X;R)$, $\psi\in S^{q}(X;R)$ について、$\varphi\cup\psi\in S^{p+q}(X;R)$ を
$$
(\varphi\cup\psi)(\sigma)\defeq\varphi\bigl(\sigma\restriction[e_{0},\dots,e_{p}]\bigr)\,\psi\bigl(\sigma\restriction[e_{p},\dots,e_{p+q}]\bigr)
$$
で定める（$\sigma$ の**前面**と**後面**）。
:::

::: lemma ライプニッツ則 {#at:cup-leibniz keywords="delta(phi cup psi) = delta phi cup psi + (-1)^p phi cup delta psi" index="ライプニッツ則（カップ積）|らいぷにっつそくかっぷせき"}
$\delta(\varphi\cup\psi)=\delta\varphi\cup\psi+(-1)^{p}\varphi\cup\delta\psi$。
:::

::: proof
$n=p+q+1$ とし、$\sigma\colon\Delta^{n}\to X$ について $[i_{0},\dots]$ で $\sigma\restriction[e_{i_{0}},\dots]$ を表す。
$$
\begin{aligned}
(\delta\varphi\cup\psi)(\sigma)&=\sum_{i=0}^{p+1}(-1)^{i}\varphi([0,\dots,\hat i,\dots,p+1])\,\psi([p+1,\dots,n]),\\
(-1)^{p}(\varphi\cup\delta\psi)(\sigma)&=\sum_{i=p}^{n}(-1)^{i}\varphi([0,\dots,p])\,\psi([p,\dots,\hat i,\dots,n]).
\end{aligned}
$$
第 1 式の $i=p+1$ の項 $(-1)^{p+1}\varphi([0..p])\psi([p+1..n])$ と第 2 式の $i=p$ の項 $(-1)^{p}\varphi([0..p])\psi([p+1..n])$ は打ち消し合う。残りの和は $\sum_{i=0}^{n}(-1)^{i}(\varphi\cup\psi)([0,\dots,\hat i,\dots,n])=(\varphi\cup\psi)(\partial\sigma)=\delta(\varphi\cup\psi)(\sigma)$（$i\le p$ の面の前面は $[0..\hat i..p+1]$、後面は $[p+1..n]$。$i\ge p+1$ の面の前面は $[0..p]$、後面は $[p..\hat i..n]$）。
:::

::: theorem コホモロジー環 {#at:cohomology-ring keywords="cup product makes H^*(X;R) an associative unital graded ring, natural in X" index="コホモロジー環|こほもろじーかん"}
カップ積は $H^{p}(X;R)\times H^{q}(X;R)\to H^{p+q}(X;R)$ を well-defined に定め、$H^{*}(X;R)\defeq\bigoplus_{n}H^{n}(X;R)$ は結合的で単位元 $1$（値 $1$ の 0 コチェイン）をもつ次数付き環になる。連続写像について $f^{*}(a\cup b)=f^{*}a\cup f^{*}b$。
:::

::: proof
ライプニッツ則から、コサイクルどうしの積はコサイクル、コサイクルとコバウンダリの積はコバウンダリ（$\delta\eta\cup\psi=\delta(\eta\cup\psi)$ など）。結合律はコチェインのレベルで成り立つ（$((\varphi\cup\psi)\cup\chi)(\sigma)$ と $(\varphi\cup(\psi\cup\chi))(\sigma)$ はどちらも $\varphi([0..p])\psi([p..p+q])\chi([p+q..n])$）。$1\cup\psi=\psi$（0 次の前面は頂点 $e_{0}$ で値 $1$）。自然性は $f_{\#}(\sigma\restriction[\dots])=(f\sigma)\restriction[\dots]$ から。
:::

::: theorem 次数付き可換性 {#at:cup-graded-commutative keywords="a cup b = (-1)^{pq} b cup a in cohomology, proved with the reversal chain map rho and acyclic models" index="次数付き可換性|じすうつきかかんせい"}
$a\in H^{p}(X;R)$, $b\in H^{q}(X;R)$ について $a\cup b=(-1)^{pq}\,b\cup a$。
:::

::: proof
**Step 1（反転写像）.** $\bar\sigma\defeq\sigma\restriction[e_{n},e_{n-1},\dots,e_{0}]$（頂点の順序を逆にした特異単体）、$\epsilon_{n}\defeq(-1)^{n(n+1)/2}$ とし、$\rho(\sigma)\defeq\epsilon_{n}\bar\sigma$ とおく。$\bar\sigma\circ\delta^{i}=\overline{\sigma\circ\delta^{n-i}}$ と $\epsilon_{n}=(-1)^{n}\epsilon_{n-1}$ から
$$
\partial\rho\sigma=\epsilon_{n}\sum_{i}(-1)^{i}\overline{\sigma\delta^{n-i}}=\sum_{j}\epsilon_{n-1}(-1)^{n}(-1)^{n-j}\overline{\sigma\delta^{j}}=\sum_{j}(-1)^{j}\epsilon_{n-1}\overline{\sigma\delta^{j}}=\rho\partial\sigma
$$
（$j=n-i$）。$\rho$ は自然な添加鎖写像（次数 $0$ で恒等）。

**Step 2（$\rho\simeq1$）.** $S$ は $\mathbf{Top}$ 上の関手としてモデル $\{\Delta^{n}\}$（元 $\iota_{n}$）の上で自由で、$\Delta^{n}$ は可縮なので非輪状。\ref{at:acyclic-models.2} から $\rho$ と $1$ は自然に鎖ホモトープで、$\rho^{*}=1$（コホモロジー上）。

**Step 3（反転とカップ積）.** $\bar\sigma\restriction[e_{0},\dots,e_{q}]=\overline{\sigma\restriction[e_{p},\dots,e_{n}]}$, $\bar\sigma\restriction[e_{q},\dots,e_{n}]=\overline{\sigma\restriction[e_{0},\dots,e_{p}]}$（$n=p+q$）なので
$$
\begin{aligned}\rho^{*}(\psi\cup\varphi)(\sigma)&=\epsilon_{n}\,\psi\bigl(\overline{\sigma[p..n]}\bigr)\varphi\bigl(\overline{\sigma[0..p]}\bigr),\\(\rho^{*}\varphi\cup\rho^{*}\psi)(\sigma)&=\epsilon_{p}\epsilon_{q}\,\varphi\bigl(\overline{\sigma[0..p]}\bigr)\psi\bigl(\overline{\sigma[p..n]}\bigr).\end{aligned}
$$
$\frac{n(n+1)}{2}=\frac{p(p+1)}{2}+\frac{q(q+1)}{2}+pq$ から $\epsilon_{p}\epsilon_{q}=(-1)^{pq}\epsilon_{n}$。$R$ は可換なので $\rho^{*}\varphi\cup\rho^{*}\psi=(-1)^{pq}\rho^{*}(\psi\cup\varphi)$。

**Step 4.** コホモロジーで $\rho^{*}=1$ なので $a\cup b=(-1)^{pq}b\cup a$。

::: hypcheck
- **$R$ の可換性**：Step 3 で値の積の順序を入れ替えるのに使った。非可換環では成り立たない。
- コチェインのレベルでは $\varphi\cup\psi\ne\pm\psi\cup\varphi$ が一般で、可換性はホモトピーを除いてしか成り立たない（Step 2 の鎖ホモトピーが必要）。
:::
:::

::: supplement
**相対カップ積.** $A,B$ が $X$ の開集合なら、$S^{p}(X,A)\cup S^{q}(X,B)\subset\mathrm{Hom}(S(X)/(S(A)+S(B)),R)$ で、小さい単体の定理（\ref{at:small-simplices}）から右辺のコホモロジーは $H^{p+q}(X,A\cup B;R)$ に同型。こうして $H^{p}(X,A)\times H^{q}(X,B)\to H^{p+q}(X,A\cup B)$ が定まる。応用：$X=A\cup B$ で $A,B$ が開かつ可縮なら、正の次数の 2 つの類の積は $0$（$a,b$ は $H^{*}(X,A)$, $H^{*}(X,B)$ から来て、積は $H^{*}(X,X)=0$ を経由する）。とくに懸垂 $\Sigma X$ の正の次数のカップ積はすべて $0$。

**高い視点.** カップ積は、対角写像 $\Delta\colon X\to X\times X$ と、アイレンバーグ–ジルバーの同値（\tref{at:eilenberg-zilber}）の一方向であるアレクサンダー–ホイットニー写像の合成を双対にしたもの：$a\cup b=\Delta^{*}(a\times b)$。対角写像が「ホモトピーを除いて可換」であることが次数付き可換性の源で、鎖のレベルで可換性を強制できないことの精密な記録がスティーンロッド平方である（知られている）。比喩で言えば、カップ積は「2 つの測定器を同じ単体に前後半で当てる」操作で、前後の分け方の違いを連続変形で吸収できるのがホモロジーのレベルである。
:::

## Δ 複体での計算 {#at:sec-cp-delta}

::: proposition 単体的コチェインのカップ積 {#at:simplicial-cup keywords="cup product on simplicial cochains of a Delta-complex computes the cup product of the realization" index="単体的コチェインのカップ積|たんたいてきこちぇいんのかっぷせき"}
有限 Δ 複体 $X$ の単体的コチェイン $C^{n}(X;R)\defeq\mathrm{Hom}(C_{n}(X),R)$ に、同じ式（$x\in X_{p+q}$ の前面 $d_{p+1}\cdots d_{p+q}x$ と後面 $d_{0}\cdots d_{0}x$（$d_{0}$ を $p$ 回））でカップ積を定めると、$\theta^{*}\colon H^{*}(|X|;R)\to H^{*}(C^{\bullet}(X;R))$ はカップ積を保つ同型。
:::

::: proof
$\theta(x)=\sigma_{x}$（特性写像）で、$\sigma_{x}\restriction[e_{0},\dots,e_{p}]=\sigma_{\text{前面}}$、$\sigma_{x}\restriction[e_{p},\dots,e_{n}]=\sigma_{\text{後面}}$（実現の同値関係から）なので、$\theta^{\#}(\varphi\cup\psi)=\theta^{\#}\varphi\cup\theta^{\#}\psi$。$\theta$ は自由鎖複体のホモロジー同型（\ref{at:simplicial-singular-iso}）なので、\ref{at:homology-iso-cohomology-iso} から $\theta^{*}$ は同型。
:::

::: example トーラスのコホモロジー環
トーラス $T$ の Δ 複体（頂点 $v$、辺 $a,b,c$、三角形 $U,L$。$U$ の前面の辺 $=d_{2}U=a$、後面の辺 $=d_{0}U=b$；$L$ の前面 $=d_{2}L=b$、後面 $=d_{0}L=a$）で $R=\mathbb{Z}$ とする。
1. 1 コチェイン $\varphi$ について $\delta\varphi(U)=\varphi(\partial U)=\varphi(a)+\varphi(b)-\varphi(c)=\delta\varphi(L)$。よってコサイクルは $\varphi(c)=\varphi(a)+\varphi(b)$ を満たすもので、基底 $\alpha$（$a\mapsto1,b\mapsto0,c\mapsto1$）、$\beta$（$a\mapsto0,b\mapsto1,c\mapsto1$）。0 コチェインの余境界は $0$（辺の両端が同じ頂点）なので $H^{1}=\mathbb{Z}\alpha\oplus\mathbb{Z}\beta$。
2. 2 コバウンダリは $\{\psi:\psi(U)=\psi(L)\}$ なので、$H^{2}\cong\mathbb{Z}$ で同型は $\psi\mapsto\psi(U)-\psi(L)$。
3. $(\alpha\cup\beta)(U)=\alpha(a)\beta(b)=1$, $(\alpha\cup\beta)(L)=\alpha(b)\beta(a)=0$ なので $\alpha\cup\beta$ は $H^{2}$ の生成元。同様に $\beta\cup\alpha\mapsto0-1=-1$、$\alpha\cup\alpha\mapsto0-0=0$、$\beta\cup\beta\mapsto0$。
よって $H^{*}(T;\mathbb{Z})$ は $\alpha,\beta$ で生成され $\alpha^{2}=\beta^{2}=0$, $\alpha\beta=-\beta\alpha$ を満たす外積代数 $\Lambda_{\mathbb{Z}}[\alpha,\beta]$（\ref{lin:page-exterior}）。
:::

::: example 実射影平面の $\mathbb{Z}/2$ コホモロジー環
実射影平面 $P$ の Δ 複体（頂点 $v,w$、辺 $a,b$（$v\to w$）、$c$（$v\to v$）、三角形 $U,L$。$U$ の前面 $d_{2}U=c$、後面 $d_{0}U=b$；$L$ の前面 $d_{2}L=c$、後面 $d_{0}L=a$）で $R=\mathbb{Z}/2$ とする。
1. 1 コサイクル：$\delta\varphi(U)=\varphi(a)+\varphi(b)+\varphi(c)=\delta\varphi(L)$（$\mathbb{Z}/2$ で符号は無関係）なので、$\varphi(a)+\varphi(b)+\varphi(c)=0$。1 コバウンダリ：$\delta f(a)=\delta f(b)=f(w)-f(v)$, $\delta f(c)=0$ から $\{a\mapsto t,b\mapsto t,c\mapsto0\}$。$H^{1}(P;\mathbb{Z}/2)\cong\mathbb{Z}/2$ は $x$（$a\mapsto1,b\mapsto0,c\mapsto1$）で生成される。
2. 2 コバウンダリは $\{\psi(U)=\psi(L)\}$ なので $H^{2}\cong\mathbb{Z}/2$ で、$\psi\mapsto\psi(U)+\psi(L)$。
3. $(x\cup x)(U)=x(c)x(b)=0$, $(x\cup x)(L)=x(c)x(a)=1$ なので $x\cup x\ne0$。
よって $H^{*}(\mathbb{R}P^{2};\mathbb{Z}/2)\cong\mathbb{Z}/2[x]/(x^{3})$。一般の $\mathbb{R}P^{n}$ と $\mathbb{C}P^{n}$ の環構造はポアンカレ双対性を使って求める（\ref[ポアンカレ双対性]{at:page-poincare-duality}）。
:::

## 応用 {#at:sec-cp-applications}

::: proposition トーラスとブーケの区別 {#at:torus-not-wedge keywords="S^1 x S^1 and S^1 v S^1 v S^2 have isomorphic homology but are not homotopy equivalent; cup products of degree-one classes vanish in the wedge" index="トーラスとブーケの区別|とーらすとぶーけのくべつ"}
$T=S^{1}\times S^{1}$ と $W\defeq S^{1}\vee S^{1}\vee S^{2}$ はすべての次数で同型なホモロジー群（とコホモロジー群）をもつが、ホモトピー同値でない。
:::

::: proof
**Step 1（群）.** $W$ のホモロジーは各成分の被約ホモロジーの和（\ref{at:prob-wedge-spheres} の議論）で、$H_{1}=\mathbb{Z}^{2}$, $H_{2}=\mathbb{Z}$。$T$ と同じ（\ref{at:surface-homology}）。普遍係数定理からコホモロジーも同じ。

**Step 2（$W$ の積は $0$）.** $j\colon S^{2}\to W$ を包含とする。$H^{2}(W)\to H^{2}(S^{2})$ は同型（$W$ の $H^{2}$ は $S^{2}$ 成分から来る：レトラクション $W\to S^{2}$（円周を基点に潰す）と合わせて）。$a,b\in H^{1}(W)$ について $j^{*}(a\cup b)=j^{*}a\cup j^{*}b=0$（$H^{1}(S^{2})=0$）なので $a\cup b=0$。

**Step 3.** ホモトピー同値 $f\colon T\to W$ があれば $f^{*}$ はカップ積を保つ環同型だが、$T$ では $\alpha\cup\beta\ne0$（トーラスの例）、$W$ では 1 次の積がすべて $0$。矛盾。
:::

::: supplement
**一般化.** 同じ議論で $S^{2}\times S^{2}$ と $S^{2}\vee S^{2}\vee S^{4}$ も区別できる（前者では 2 次の 2 つの生成元の積が $H^{4}$ の生成元になる。これはコホモロジーのキュネットの定理 $H^{*}(X\times Y)\cong H^{*}(X)\otimes H^{*}(Y)$（$H^{*}$ が有限生成自由なとき）から従い、知られている）。カップ積の非自明性は、ホップ不変量（$S^{2n-1}\to S^{n}$ の写像を区別する）や、リュステルニク–シュニレルマン圏数の下界（カップ長）にも使われる（本サイト未収録）。
:::

## 問題 {#at:sec-cp-problems}

::: problem {#at:prob-cup-suspension}
懸垂 $\Sigma X$（\ref{at:prob-suspension}）の正の次数の 2 つのコホモロジー類のカップ積は $0$ であることを、相対カップ積を使って示せ。
:::

::: solution
$\Sigma X=A\cup B$（$A,B$ はそれぞれ頂点を含む開錐で可縮）とする。$a\in H^{p}(\Sigma X)$（$p\ge1$）は、長完全列 $H^{p}(\Sigma X,A)\to H^{p}(\Sigma X)\to H^{p}(A)=0$ から $H^{p}(\Sigma X,A)$ の元 $a'$ の像。同様に $b$ は $b'\in H^{q}(\Sigma X,B)$ の像。$a\cup b$ は相対カップ積 $a'\cup b'\in H^{p+q}(\Sigma X,A\cup B)=H^{p+q}(\Sigma X,\Sigma X)=0$ の像なので $0$。
:::

::: problem {#at:prob-klein-cup}
クラインの壺（\ref{at:prob-klein-bottle} の Δ 複体）の $\mathbb{Z}/2$ コホモロジー環を計算し、$H^{1}$ のある元の平方が $0$ でないことを確かめよ。
:::

::: solution
$\mathbb{Z}/2$ 係数で $\partial U=a+b+c=\partial L$ なので、1 コサイクルは $\varphi(a)+\varphi(b)+\varphi(c)=0$、1 コバウンダリは $0$（頂点は 1 つ）。$H^{1}$ は $\xi$（$a\mapsto1,b\mapsto0,c\mapsto1$）と $\eta$（$a\mapsto0,b\mapsto1,c\mapsto1$）で生成される。$H^{2}\cong\mathbb{Z}/2$ は $\psi\mapsto\psi(U)+\psi(L)$。前面・後面は $U$：$d_{2}U=c$, $d_{0}U=b$；$L$：$d_{2}L=b$, $d_{0}L=a$。$\xi\cup\xi\mapsto\xi(c)\xi(b)+\xi(b)\xi(a)=0+0=0$、$\eta\cup\eta\mapsto\eta(c)\eta(b)+\eta(b)\eta(a)=1+0=1$、$\xi\cup\eta\mapsto\xi(c)\eta(b)+\xi(b)\eta(a)=1+0=1$。よって $\eta^{2}\ne0$。（トーラスの $\mathbb{Z}/2$ コホモロジーでは 1 次の元の平方はすべて $0$ なので、$\mathbb{Z}/2$ 係数のカップ積でもクラインの壺とトーラスは区別できる。）
:::
