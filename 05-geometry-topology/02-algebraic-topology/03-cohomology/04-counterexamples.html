# ホモロジー理論が一致しない空間 {#at:page-homology-counterexamples keywords="spaces where singular and Cech (sheaf) cohomology differ: topologist's sine curve, Cantor set, Warsaw circle, Hawaiian earring; exponential sheaf sequence; continuity of Cech cohomology; local pathologies" index="ホモロジー理論の不一致|ほもろじーりろんのふいっち"}

前ページまでで、CW 複体や多様体のような局所的に良い空間では、特異・チェック・層コホモロジーが一致することを見た（\ref{at:cohomology-agreement}）。このページでは、局所的に悪い空間でこれらが食い違う例を、証明付きで挙げる。特異理論は**道**（連続写像）で空間を探るので、道でたどれない構造（振動する曲線の極限など）を見落とす。チェック理論と層理論は**開集合の重なり**で探るので、そうした構造を捉える一方、無限に細かい構造（カントール集合の各点）を「連続性」でまとめてしまう。

> ワルシャワの円の特異ホモロジーはマイヤー–ヴィートリス完全列で、層コホモロジーは指数層の完全列で計算する。

## 記法と定義の確認 {#at:sec-hc-notation}

::: notation
- 位相幾何学者のサイン曲線 $T=S\cup J$（$S\defeq\{(x,\sin(1/x)):0<x\le1\}$, $J\defeq\{0\}\times[-1,1]$）は連結だが弧状連結でない（\ref{top:topologist-sine}）。
- 特異ホモロジーと弧状連結成分 \tref{at:singular-h0-point}、マイヤー–ヴィートリス \ref{at:mayer-vietoris}、普遍係数定理 \tref{at:uct-cohomology}、ホモトピー不変性 \tref{at:singular-homotopy-invariance}。
- 層コホモロジーは層の圏の大域切断の右導来関手で、短完全列から長完全列が得られる（\ref{ha:derived-long-exact}）。チェック複体の $\check H^{0}(\mathcal{U},F)=F(X)$（\ref{cat:cech-basic}）。軟層：パラコンパクト空間上の実数値連続関数の層 $\mathcal{C}_{X}$ は軟で、軟層は非輪状（\ref{cat:soft-examples}, \ref{cat:soft-surjective}）。
- 偏角の差 $\theta$ と $p(s)=e^{2\pi is}$ は \ref{at:angle-difference}。
- **選択公理**：層コホモロジーの議論（\ref{cat:soft-surjective}）で使う。特異ホモロジーの計算では使わない。
:::

## 位相幾何学者のサイン曲線と 0 次 {#at:sec-hc-sine}

::: proposition サイン曲線の 0 次コホモロジー {#at:sine-curve-h0 keywords="topologist's sine curve: singular H^0 = Z^2, Cech and sheaf H^0 = Z" index="サイン曲線の 0 次コホモロジー|さいんきょくせんのぜろじこほもろじー"}
$T$ について、$H^{0}_{\mathrm{sing}}(T;\mathbb{Z})\cong\mathbb{Z}^{2}$ だが、$\check H^{0}(T;\mathbb{Z})\cong H^{0}(T,\underline{\mathbb{Z}})\cong\mathbb{Z}$。
:::

::: proof
**Step 1（特異）.** $T$ の弧状連結成分は $S$ と $J$ の 2 つ（\ref{top:topologist-sine}。$S$ は $(0,1]$ の連続像、$J$ は線分）。$H_{0}(T)\cong\mathbb{Z}^{2}$ で、普遍係数定理から $H^{0}=\mathrm{Hom}(H_{0},\mathbb{Z})\cong\mathbb{Z}^{2}$。

**Step 2（層・チェック）.** $H^{0}(T,\underline{\mathbb{Z}})=\underline{\mathbb{Z}}(T)$ は局所定数関数 $T\to\mathbb{Z}$ の群で、$T$ は連結なので定数関数だけ（\ref{top:connected-equivalents}）。任意の被覆で $\check H^{0}(\mathcal{U},\underline{\mathbb{Z}})=\underline{\mathbb{Z}}(T)$ なので、余極限も $\mathbb{Z}$。
:::

::: proposition カントール集合の 0 次 {#at:cantor-h0 keywords="Cantor set: singular H_0 is free on uncountably many points, singular H^0 is all functions to Z, Cech H^0 is the countable group of locally constant functions" index="カントール集合のコホモロジー|かんとーるしゅうごうのこほもろじー"}
カントール集合 $K$ について、$H_{0}^{\mathrm{sing}}(K)$ は $K$（非可算集合）上の自由アーベル群、$H^{0}_{\mathrm{sing}}(K;\mathbb{Z})$ は $K$ から $\mathbb{Z}$ への**すべての**関数の群（非可算）、$H^{n}_{\mathrm{sing}}=0$（$n\ge1$）。一方 $\check H^{0}(K;\mathbb{Z})=H^{0}(K,\underline{\mathbb{Z}})$ は連続（局所定数）関数 $K\to\mathbb{Z}$ の群で可算。
:::

::: proof
$K$ は完全不連結なので弧状連結成分は 1 点ずつ（道の像は連結なので 1 点）。各成分は 1 点なので $H_{n}(K)=\bigoplus_{K}H_{n}(\ast)$。普遍係数定理で $H^{0}=\mathrm{Hom}(\bigoplus_{K}\mathbb{Z},\mathbb{Z})=\mathbb{Z}^{K}$。局所定数関数 $K\to\mathbb{Z}$ はコンパクト性から有限個の値をとり、各値の逆像は開かつ閉。$K$ の開かつ閉な集合は可算個（標準的な区間の有限和）なので、局所定数関数は可算個。
:::

## ワルシャワの円 {#at:sec-hc-warsaw}

::: definition ワルシャワの円 {#at:warsaw-circle keywords="Warsaw circle: topologist's sine curve closed up by an arc" index="ワルシャワの円|わるしゃわのえん, 擬円周|ぎえんしゅう"}
$T=S\cup J$ に、$(0,-1)$ から $(0,-2)$、$(1,-2)$、$(1,\sin1)$ へ折れ線で進む弧 $C$ を加えた $W\defeq T\cup C\subset\mathbb{R}^{2}$ を**ワルシャワの円**という。$C$ は $T$ と端点 $(0,-1)\in J$, $(1,\sin1)\in S$ だけで交わる。$W$ はコンパクトで弧状連結（$J$ と $S$ は $C$ で結ばれる）。
:::

::: lemma ワルシャワの円の部分集合の弧状連結成分 {#at:warsaw-components keywords="path components of Warsaw circle minus points: no path enters the oscillating part from the limit segment" index="ワルシャワの円の弧状連結成分|わるしゃわのえんのこじょうれんけつせいぶん"}
$Y\subset W$ を $J$ を含む部分集合とし、$P\subset Y$ を $J$ を含む（$Y$ の）閉集合、$Q\defeq Y\setminus P$ とする。$Q$ の点のうち $J$ からの距離が $\frac12$ 未満のものはすべて $S$ に属し、$\overline{Q}\cap P\subset J$（閉包は $Y$ の中でとる）なら、$P$ の点と $Q$ の点を結ぶ $Y$ の中の道はない。
:::

::: proof
道 $\gamma\colon I\to Y$ で $\gamma(0)\in P$, $\gamma(1)\in Q$ とする。$\tau\defeq\sup\gamma^{-1}(P)$ とおくと、$P$ は閉なので $\gamma(\tau)\in P$、$t>\tau$ で $\gamma(t)\in Q$。よって $\gamma(\tau)\in\overline{Q}\cap P\subset J$。$\gamma(\tau)=(0,y_{0})$ の近くの $Q$ の点は仮定から $S$ の点なので、$\tau$ に近い $t>\tau$ で $\gamma(t)\in S$。あとは \ref{top:topologist-sine} の「弧状連結でない」の議論（第 1 成分の中間値の定理で第 2 成分が $\pm1$ をとる）がそのまま適用でき、矛盾。
:::

::: theorem ワルシャワの円の特異ホモロジー {#at:warsaw-singular keywords="the Warsaw circle has the singular homology of a point" index="ワルシャワの円の特異ホモロジー|わるしゃわのえんのとくいほもろじー"}
$\tilde H_{n}(W)=0$（すべての $n$）。したがって $\tilde H^{n}_{\mathrm{sing}}(W;G)=0$（すべての $n$, $G$）。
:::

::: proof
**Step 1（被覆）.** $a\defeq(\frac12,-2)\in C$（下の線分の点）、$b\defeq(\frac12,\sin2)\in S$ とし、$U\defeq W\setminus\{a\}$, $V\defeq W\setminus\{b\}$ とする（開集合で $U\cup V=W$）。$C\setminus\{a\}$ は $J$ 側の開弧 $c_{1}$ と $S$ 側の開弧 $c_{2}$ に分かれ、$S\setminus\{b\}$ は $x<\frac12$ の部分 $S_{<}$ と $x>\frac12$ の部分 $S_{>}$ に分かれる。

**Step 2（弧状連結成分）.** \ref{at:warsaw-components} と、各部分が弧（区間と同相）であることから：
- $U$ の成分は $P_{1}\defeq J\cup c_{1}$ と $P_{2}\defeq S\cup c_{2}$。
- $V$ の成分は $S_{<}$ と $Q\defeq J\cup C\cup S_{>}$。
- $U\cap V$ の成分は $P_{1}$, $S_{<}$, $S_{>}\cup c_{2}$。
いずれも区間と同相（$J\cup c_{1}$ は線分に弧をつないだもの、$S$ や $S_{<}$ はグラフで $x$ 座標の区間と同相、など）なので可縮。（\ref{at:warsaw-components} を、$U$ では $P=P_{1}$、$V$ では $P=Q$（補集合は $S_{<}$。$b\notin V$ なので $V$ の中での閉包の共通部分は $J$）、$U\cap V$ では $P=P_{1}$ に使う。$U\cap V$ の残りの 2 成分 $S_{<}$ と $S_{>}\cup c_{2}$ は、$U\cap V$ の互いに素な開集合（$S$ の点の十分小さい近傍は $S$ の点しか含まない）なので、道で結べない。）

**Step 3（マイヤー–ヴィートリス）.** 各成分が可縮なので、$U$, $V$, $U\cap V$ の $H_{n}$（$n\ge1$）は $0$、$H_{0}$ は成分の数の階数の自由アーベル群。マイヤー–ヴィートリスから $n\ge2$ で $H_{n}(W)\cong H_{n-1}(U\cap V)=0$。次数 $1$ と $0$ では
$$
0\to H_{1}(W)\to H_{0}(U\cap V)\xrightarrow{\ \Phi\ }H_{0}(U)\oplus H_{0}(V)\to H_{0}(W)\to0
$$
で、$\Phi$ は成分をそれを含む成分に送る（$V$ 側は $-1$ 倍）：基底 $(P_{1},P_{2}\mid S_{<},Q)$ で $P_{1}\mapsto(1,0\mid0,-1)$、$S_{<}\mapsto(0,1\mid-1,0)$、$S_{>}\cup c_{2}\mapsto(0,1\mid0,-1)$。この 3 つのベクトルは一次独立なので $\Phi$ は単射、$H_{1}(W)=0$。$H_{0}(W)=\mathbb{Z}$（弧状連結）。

**Step 4.** 普遍係数定理から被約特異コホモロジーも $0$。
:::

::: theorem ワルシャワの円の層コホモロジー {#at:warsaw-sheaf keywords="the Warsaw circle has sheaf (Cech) cohomology H^1 = Z-nonzero: the collapse map to the circle has no continuous logarithm; exponential sheaf sequence" index="ワルシャワの円の層コホモロジー|わるしゃわのえんのそうこほもろじー, 指数層の完全列|しすうそうのかんぜんれつ"}
$H^{1}(W,\underline{\mathbb{Z}})\ne0$。より詳しく、$H^{1}(W,\underline{\mathbb{Z}})\cong C(W,S^{1})/p\circ C(W,\mathbb{R})$（連続写像 $W\to S^{1}$ の群を、連続な対数をもつものの部分群で割ったもの）で、$J$ を 1 点に潰す写像 $\kappa\colon W\to W/J\cong S^{1}$ の類は $0$ でない。
:::

::: proof
**Step 1（指数層の完全列）.** 位相空間 $X$ 上の層の列 $0\to\underline{\mathbb{Z}}\to\mathcal{C}_{X}\xrightarrow{p}\mathcal{C}(-,S^{1})\to0$（$\mathcal{C}_{X}$ は実数値連続関数の層、$p(f)=e^{2\pi if}$）は完全：$e^{2\pi if}=1$ となる連続関数は局所定数の整数値。全射性は茎で示す：$g\colon U\to S^{1}$ と $x\in U$ について、$x$ の近傍 $V$ で $g(V)\subset S^{1}\setminus\{-g(x)\}$ となるものをとり、$f(y)\defeq s_{0}+\theta(g(x),g(y))$（$p(s_{0})=g(x)$）とすると $p\circ f=g$ が $V$ 上で成り立つ（\ref{at:angle-difference}）。

**Step 2（長完全列）.** $W$ はコンパクト距離空間でパラコンパクトなので $\mathcal{C}_{W}$ は軟で $H^{1}(W,\mathcal{C}_{W})=0$（\ref{cat:soft-examples}, \ref{cat:soft-surjective}）。長完全列 $C(W,\mathbb{R})\xrightarrow{p}C(W,S^{1})\to H^{1}(W,\underline{\mathbb{Z}})\to H^{1}(W,\mathcal{C}_{W})=0$ から主張の同型。

**Step 3（$\kappa$ は対数をもたない）.** $\kappa$ を、$J$ を 1 点 $1\in S^{1}$ に写し、$C$ と $S$ を合わせた道（$(0,-1)$ から $C$ を通って $(1,\sin1)$ へ、そこから $S$ を $x\to0$ の向きに）で $S^{1}$ をちょうど 1 周するように具体的に作る（$C\cup S$ は $(0,1]$ と $[0,1]$ の和の半開区間と同相で、その径数で $p$ を合成する）。$\kappa=p\circ f$ となる連続関数 $f$ があるとする。$J$ は連結で $\kappa(J)=\{1\}$ なので $f$ は $J$ の上で整数値の定数 $m$。$C\cup S$ を径数付けた道 $\gamma\colon[0,1)\to W$（$\gamma(0)=(0,-1)$、$t\to1$ で $S$ を $x\to0$ に進む）について、$f\circ\gamma$ は $\kappa\circ\gamma$ の持ち上げで、構成から $f(\gamma(t))-f(\gamma(0))\to1$（$t\to1$）。一方 $t\to1$ で $\gamma(t)$ は $J$ に集積し、$W$ はコンパクトなので $f$ は一様連続で、$J$ の点に近い $\gamma(t)$ では $f(\gamma(t))$ は $m$ に近い。$f(\gamma(0))=m$（$\gamma(0)\in J$）なので $f(\gamma(t))-f(\gamma(0))\to0$。矛盾。

::: hypcheck
- **パラコンパクト**：Step 2 の軟層の非輪状性に使った（コンパクト距離空間なので成り立つ）。
- Step 3 では、$S$ の点が $J$ のすべての点に集積すること（$\gamma(t)$ と $J$ の距離 $\to0$）と $f$ の一様連続性を使った。
:::
:::

::: corollary ワルシャワの円での不一致 {#at:warsaw-disagreement keywords="for the Warsaw circle singular H^1 = 0 but sheaf and Cech H^1 are nonzero; the collapse map W -> S^1 does not lift to R although pi_1(W) is trivial" index="ワルシャワの円での不一致|わるしゃわのえんでのふいっち"}
$H^{1}_{\mathrm{sing}}(W;\mathbb{Z})=0$ だが $H^{1}(W,\underline{\mathbb{Z}})\ne0$。パラコンパクト・ハウスドルフ空間ではチェックコホモロジーと層コホモロジーが一致する（\ref{at:cw-local-properties.3}）ので、$\check H^{1}(W;\mathbb{Z})\ne0$ でもある。また $\kappa\colon W\to S^{1}$ は $\mathbb{R}$ に持ち上がらない（Step 3）。
:::

::: supplement
**持ち上げの基準との関係.** $W$ は弧状連結で、基本群は自明であることが知られている（閉道の像はある弧 $W_{\epsilon}$ に入る：問題 \ref{at:prob-warsaw-pi1}）。それでも $\kappa$ は持ち上がらないので、\ref{at:lifting-criterion} の「局所弧状連結」の仮定は外せない。チェック理論では $W$ は円周と同じ $\check H^{1}=\mathbb{Z}$ をもつことが知られている（$W$ は円環の減少列の共通部分で、チェックコホモロジーの連続性による）。
:::

## ハワイの耳飾り {#at:sec-hc-hawaiian}

::: proposition ハワイの耳飾りの 1 次ホモロジー {#at:hawaiian-h1 keywords="the singular H_1 of the Hawaiian earring surjects onto the product of countably many copies of Z, hence is uncountable; Cech cohomology is the countable direct sum" index="ハワイの耳飾りのホモロジー|はわいのみみかざりのほもろじー"}
ハワイの耳飾り $\mathbb{H}=\bigcup_{n\ge1}C_{n}$（\ref{at:universal-necessary}）について、レトラクション $r_{n}\colon\mathbb{H}\to C_{n}$ の誘導写像を並べた $H_{1}(\mathbb{H})\to\prod_{n\ge1}H_{1}(C_{n})\cong\mathbb{Z}^{\mathbb{N}}$ は全射。とくに $H_{1}(\mathbb{H})$ は非可算。
:::

::: proof
**Step 1（無限の積の閉道）.** 整数列 $(k_{n})$ について、閉道 $\gamma\colon I\to\mathbb{H}$ を、$[\frac{1}{n+1},\frac{1}{n}]$ では $C_{n}$ を（その区間を径数として）$k_{n}$ 回まわり、$\gamma(0)=0$ とする。$s\to0$ では $\gamma(s)$ は $C_{n}$（$n\to\infty$）にあり、$C_{n}$ の直径 $\frac{2}{n}\to0$ なので $\gamma(s)\to0$：$\gamma$ は連続。

**Step 2.** $r_{n}\circ\gamma$ は、$[\frac{1}{n+1},\frac1n]$ で $C_{n}$ を $k_{n}$ 回まわり、他では基点にとどまる閉道で、回転数は $k_{n}$。\ref{at:circle-h1-generator} から $r_{n*}[\gamma]=k_{n}$ 倍の生成元。よって $[\gamma]\mapsto(k_{n})_{n}$。$\mathbb{Z}^{\mathbb{N}}$ は非可算。
:::

::: fact ハワイの耳飾りについて知られていること {#at:hawaiian-facts keywords="Cech cohomology of the Hawaiian earring is a countable direct sum, its fundamental group is not free, the map from singular to Cech homology is not injective" index="ハワイの耳飾りについての事実|はわいのみみかざりについてのじじつ"}
1. $\check H^{1}(\mathbb{H};\mathbb{Z})\cong\bigoplus_{n\ge1}\mathbb{Z}$（可算）。$\mathbb{H}$ は有限個の円周のブーケ $\bigvee_{n\le N}C_{n}$ の逆極限で、コンパクト空間のチェックコホモロジーは逆極限を余極限に移す（連続性）ことによる。
2. $\pi_{1}(\mathbb{H})$ は自由群でなく、非可算である。
3. 特異ホモロジーからチェックホモロジーへの自然な写像 $H_{1}(\mathbb{H})\to\check H_{1}(\mathbb{H})\cong\mathbb{Z}^{\mathbb{N}}$ は全射だが単射でないとされる（イーダ–川村による。詳細は未確認）。
本サイトではこれらを証明していない。
:::

## まとめ {#at:sec-hc-summary}

::: table 理論ごとの値
| 空間 | 特異 | チェック・層 | 食い違いの原因 |
|---|---|---|---|
| サイン曲線 $T$ | $H^{0}=\mathbb{Z}^{2}$ | $H^{0}=\mathbb{Z}$ | 連結だが弧状連結でない |
| カントール集合 $K$ | $H^{0}=\mathbb{Z}^{K}$（非可算） | $H^{0}$ は可算 | 道は点しかたどれない／連続性 |
| ワルシャワの円 $W$ | $\tilde H^{*}=0$ | $H^{1}\ne0$ | 振動部分を道で通り抜けられない |
| ハワイの耳飾り $\mathbb{H}$ | $H_{1}$ は非可算 | $\check H^{1}$ は可算 | 無限に小さい輪 |
:::

::: supplement
**連続性の公理.** チェックコホモロジーは、コンパクト・ハウスドルフ空間の逆極限 $X=\varprojlim X_{i}$ について $\check H^{*}(X)\cong\varinjlim\check H^{*}(X_{i})$ を満たす（連続性）ことが知られている。特異理論はこれを満たさない：$K=\varprojlim\{0,1\}^{n}$ で $\varinjlim H^{0}(\{0,1\}^{n})$ は可算だが $H^{0}_{\mathrm{sing}}(K)$ は非可算、$W$ は円環の共通部分だが $H^{1}_{\mathrm{sing}}(W)=0$。逆に特異理論は加法性（任意の非交和）と、ホモトピーの道による探索に適合している。どちらも CW 複体の上では公理を満たし、比較定理（\tref{at:comparison-theorem} のコホモロジー版）により一致する。

**高い視点.** 二つの理論の違いは「空間を何で調べるか」の違いである：特異理論は標準単体からの写像（外から差し込む探針）、チェック・層理論は開被覆と局所的な関数（空間の上に広げた網）。局所的に良い空間では探針と網が同じ情報を得るが、ワルシャワの円では探針が振動部分の奥に届かず、網はそれを一周する輪として捉える。比喩で言えば、迷路の壁が無限に細かく折れ曲がっていると、歩いて（道で）一周することはできないが、上から網をかぶせると輪の形が見える。
:::

## 問題 {#at:sec-hc-problems}

::: problem {#at:prob-warsaw-pi1}
ワルシャワの円 $W$ の任意の閉道は、$W$ のある可縮な部分集合の中に入ることを示し、$\pi_{1}(W)=1$ を導け。
:::

::: solution
**Step 1.** 道 $\gamma\colon I\to W$ の像は、$x\to0$ に集積する $S$ の点を含まない：$\gamma(t_{k})\in S$ で $x(\gamma(t_{k}))\to0$ なら、部分列で $t_{k}\to t^{*}$、$\gamma(t^{*})=(0,y_{0})\in J$。$\delta$ を $|t-t^{*}|\le\delta$ で第 2 成分が $y_{0}$ から $\frac12$ 未満しか動かないようにとる。この範囲で $x>0$ の $W$ の点は $S$ の点に限る（$C$ の下の線分は $y=-2$ で $|y-y_{0}|\ge1$）。$|t_{k}-t^{*}|\le\delta$ となる $k$ について、$t^{*}$ と $t_{k}$ の間で第 1 成分は $0$ と $x(\gamma(t_{k}))$ の間のすべての値をとり（中間値の定理）、その中に $\sin(1/x)=\pm1$ の点があるので、第 2 成分が $1$ と $-1$ の両方をとる。矛盾。

**Step 2.** よって閉道の像はある $\epsilon>0$ について $W_{\epsilon}\defeq J\cup C\cup\{(x,\sin(1/x)):x\ge\epsilon\}$ に入る。$W_{\epsilon}$ は弧（閉区間と同相）で可縮なので、閉道は $W_{\epsilon}$ の中で定値道とホモトープ。よって $\pi_{1}(W)=1$。
:::

::: problem {#at:prob-cantor-cech-vs-singular}
カントール集合 $K$ について $H^{0}_{\mathrm{sing}}(K;\mathbb{Z})$ の濃度が $2^{\aleph_{0}}$ より大きい（$2^{2^{\aleph_{0}}}$）ことを示せ。
:::

::: solution
$H^{0}_{\mathrm{sing}}(K;\mathbb{Z})=\mathbb{Z}^{K}$ で、$|K|=2^{\aleph_{0}}$ なので濃度は $\aleph_{0}^{2^{\aleph_{0}}}=2^{2^{\aleph_{0}}}$（$2\le\aleph_{0}\le2^{\aleph_{0}}$ から $2^{2^{\aleph_{0}}}\le\aleph_{0}^{2^{\aleph_{0}}}\le(2^{\aleph_{0}})^{2^{\aleph_{0}}}=2^{2^{\aleph_{0}}}$）。
:::
