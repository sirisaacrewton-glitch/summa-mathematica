# ホモトピー論（Homotopy Theory）

ホモトピーと道、基本群とその関手性・ホモトピー不変性、円周の基本群と写像度、ブラウワーの不動点定理（2 次元）、被覆空間とその分類、ファン・カンペンの定理。高次ホモトピー群と相対ホモトピー群、対の長完全列、k<n での π_k(Sⁿ)=0、ファイブレーションとその長完全列、ホップ写像、フレヴィッツの定理とホワイトヘッドの定理（§4 以降）。

<p class="mn-msc">MSC2020: 55Q05, 57M10, 55R05, 55P10</p>

- [一般位相 › 距離空間](../../../05-geometry-topology/01-general-topology/06-metric-spaces/index.html)（全体、12 ページ）：ルベーグ数・一様連続性
