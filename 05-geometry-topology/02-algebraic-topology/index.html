# 代数的位相幾何学（Algebraic Topology）

ホモトピー、ホモロジー、コホモロジー。

<p class="mn-msc">MSC2020: 55N, 55P, 55Q</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-homotopy/index.html"><span class="mn-card-title">ホモトピー論</span><span class="mn-card-en">Homotopy Theory</span><span class="mn-card-desc">ホモトピーと道、基本群とその関手性・ホモトピー不変性、円周の基本群と写像度、ブラウワーの不動点定理（2 次元）、被覆空間とその分類、ファン・カンペンの定理。高次ホモトピー群と相対ホモトピー群、対の長完全列、k&lt;n での π_k(Sⁿ)=0、ファイブレーションとその長完全列、ホップ写像、フレヴィッツの定理とホワイトヘッドの定理（§4 以降）。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="02-homology/index.html"><span class="mn-card-title">ホモロジー論</span><span class="mn-card-en">Homology Theory</span><span class="mn-card-desc">単体的・特異・胞体ホモロジー、ホモトピー不変性、相対ホモロジーと切除、マイヤー–ヴィートリス、球面のホモロジーと領域不変性・ジョルダン–ブラウワーの分離定理、CW 複体、単体的・胞体・特異ホモロジーの一致、アイレンバーグ–スティーンロッドの公理と一意性（無限 CW 複体を含む）、普遍係数定理とキュネットの定理。局所ホモロジーと境界の不変性、まつわり複体による局所ホモロジーの計算と、単体複体・CW 複体が多様体になる条件。</span><span class="mn-card-count">14 ページ</span></a>
<a class="mn-card" href="03-cohomology/index.html"><span class="mn-card-title">コホモロジー論</span><span class="mn-card-en">Cohomology Theory</span><span class="mn-card-desc">特異コホモロジーと普遍係数定理、ボルスク–ウラム、カップ積と次数付き可換性、チェック・層・特異コホモロジーの CW 複体での一致、理論が一致しない空間（ワルシャワの円・カントール集合・ハワイの耳飾り）、キャップ積とポアンカレ双対性。</span><span class="mn-card-count">6 ページ</span></a>
</div>
