# 基礎論（Foundations）

論理・集合・計算・証明と、数学全体の言葉としての圏論。

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-general-logic/index.html"><span class="mn-card-title">一般論理</span><span class="mn-card-en">General Logic</span><span class="mn-card-desc">命題論理と一階述語論理の構文・意味論・証明体系と完全性定理、様相論理（クリプキ意味論・完全性・決定可能性）、計算機科学の様相論理（双模倣・PDL・時相論理・μ 計算・ホーア論理）。</span><span class="mn-card-count">37 ページ</span></a>
<a class="mn-card" href="02-model-theory/index.html"><span class="mn-card-title">モデル理論</span><span class="mn-card-en">Model Theory</span><span class="mn-card-desc">構造と理論、コンパクト性、初等部分構造、ヴォートの判定法、量化子消去、型と可算モデル、飽和モデル、識別不能列、超積、安定性と非可算範疇性（モーリーの範疇性定理）。</span><span class="mn-card-count">28 ページ</span></a>
<a class="mn-card" href="03-computation/index.html"><span class="mn-card-title">計算理論</span><span class="mn-card-en">Theory of Computation</span><span class="mn-card-desc">オートマトンと形式言語、計算可能性理論（プログラミング言語 L、原始再帰関数と一般再帰関数、レジスタ機械とチューリング機械、決定可能性と還元、万能プログラム・smn 定理・再帰定理）、その発展（論理的理論の決定可能性、チューリング還元と算術的階層）、計算複雑性、コルモゴロフ複雑性とアルゴリズム的ランダムネス、型なしラムダ計算。</span><span class="mn-card-count">60 ページ</span></a>
<a class="mn-card" href="04-set-theory/index.html"><span class="mn-card-title">集合論</span><span class="mn-card-en">Set Theory</span><span class="mn-card-desc">公理的集合論。基礎事項から無限組合せ論・構成可能集合・強制法まで。章立ては Kunen『Set Theory』(1980) を参考にしている。</span><span class="mn-card-count">61 ページ</span></a>
<a class="mn-card" href="05-proof-theory/index.html"><span class="mn-card-title">証明論と型理論</span><span class="mn-card-en">Proof Theory &amp; Type Theory</span><span class="mn-card-desc">シーケント計算とカット除去、算術の形式化とゲーデルの不完全性定理、証明可能性論理、二階算術とその部分体系、逆数学、順序数解析（ε₀ と PA）、型理論（カリー＝ハワード＝ランベック対応、ホモトピー型理論）。</span><span class="mn-card-count">58 ページ</span></a>
<a class="mn-card" href="06-category-theory/index.html"><span class="mn-card-title">圏論</span><span class="mn-card-en">Category Theory</span><span class="mn-card-desc">圏・関手・自然変換、極限と随伴、モノイダル圏、モナド、カン拡張とエンド、高次圏、豊穣圏と双対性、オペラッドと反復ループ空間、層のコホモロジー、トポスとサイト。</span><span class="mn-card-count">68 ページ</span></a>
</div>
