# 算術の上のホーア論理 {#logic:page-hoare-arithmetic keywords="Hoare logic over the standard model of arithmetic, expressiveness of N, compiling while programs into L, valid Hoare triples are not recursively enumerable"}

前のページ（\ref{logic:page-hoare-logic}）のクックの相対完全性定理は、構造が**表現的**（最弱事前条件がいつも論理式で書ける）であることを仮定していた。このページでは、算術の言語 $\mathcal{L}_{\mathrm{ar}}=\{0,S,+,\times,<\}$ と自然数の標準構造 $\mathcal{N}$ の上の while プログラムについて、(1) $\mathcal{N}$ が表現的であること、したがってホーア論理が $\mathrm{Th}(\mathcal{N})$ を神託として完全であること、(2) 一方、$\mathcal{N}$ で妥当な三つ組の全体は**帰納的に枚挙できない**こと、を示す。(2) から、$\mathcal{N}$ 上の部分正当性について、健全で完全な「機械的に検査できる」証明体系は存在しない。相対完全性で神託が必要だったのはこのためである。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。証明には計算可能性の系列のプログラミング言語 L（\ref{comp:page-language-L}）と燃料つきの実行（\ref{comp:fuel-semantics}）、表現可能性定理（\ref{comp:decidable-representable}）、停止問題（\ref{comp:halting-L}）を使う。

## 記法と定義の確認 {#logic:sec-ha-notation}

::: notation
- while プログラム・操作的意味論・三つ組・最弱事前条件・表現性・局所性は \ref{logic:page-hoare-logic} のとおり。ここでは言語を $\mathcal{L}_{\mathrm{ar}}$、構造を $\mathcal{N}$（\ref{logic:structure} の例）とする。変数は $x_{0},x_{1},\dots$ で、L の変数と同一視する。状態は変数から $\mathbb{N}$ への写像で、L の状態と同じものである。
- L のプログラム・意味 $\Downarrow$・for プログラムは停止すること・略記（$x:=y+z$, $x:=y\mathbin{\dot{-}}z$, $x:=y\cdot z$, $x:=c$, $\mathtt{if}\ x\ne0$ など）は \ref{comp:L-syntax}, \ref{comp:L-semantics}, \ref{comp:for-total}, \ref{comp:L-macros} のとおり。
- 自然数 $n$ の数項 $\underline{n}\defeq S(\cdots S(0)\cdots)$ の値は $n$。
- 三つ組・論理式・プログラムは、自然数で符号化しておく（論理式の符号化と同様に、記号列を数に写す）。「三つ組の集合が帰納的に枚挙できる」はこの符号化についていう。
- **公理系**：$\ZF$。
:::

## while プログラムの L への翻訳 {#logic:sec-ha-compile}

::: lemma 項と条件の計算 {#logic:ha-term-test keywords="computing terms and quantifier-free conditions by for-programs of L"}
$\mathcal{L}_{\mathrm{ar}}$ の項 $t$、量化子のない論理式 $B$ と、$t,B$ に現れない変数 $z$ について、L の for プログラム $T_{t,z}$, $C_{B,z}$ で次を満たすものがある：どの状態 $\sigma$ から実行しても止まり、止まった状態では $z$ の値が $t^{\mathcal{N},\sigma}$（$C_{B,z}$ では、$\mathcal{N},\sigma\models B$ なら $1$、そうでなければ $0$）で、$z$ と（プログラムごとに新しくとった）補助の変数以外の値は変わらない。
:::

::: proof
**Step 1.** 【主張：項】 $t$ の構成についての帰納法。$0$：$z:=0$。変数 $x$：$z:=x$。$S(t_{1})$：$T_{t_{1},z}$ の後 $z:=z+1$。$t_{1}+t_{2}$, $t_{1}\times t_{2}$：新しい $z_{1},z_{2}$ について $T_{t_{1},z_{1}};T_{t_{2},z_{2}}$ の後 $z:=z_{1}+z_{2}$（$z:=z_{1}\cdot z_{2}$）。\ref{comp:L-macros} の各略記は新しい変数以外を変えず、$T_{t_{2},z_{2}}$ は $z_{1}$ を変えないので、値は帰納法の仮定から正しい。

**Step 2.** 【主張：条件】 $B$ の構成についての帰納法で、値を $0,1$ で計算する。$s=t$：$a,b$ に $s,t$ を計算し、$z:=(a\mathbin{\dot{-}}b)+(b\mathbin{\dot{-}}a)$ の後 $z:=1\mathbin{\dot{-}}z$。$s<t$：$z:=b\mathbin{\dot{-}}a$ の後 $z:=1\mathbin{\dot{-}}(1\mathbin{\dot{-}}z)$。$\bot$：$z:=0$。$B_{1}\to B_{2}$：$z_{1},z_{2}$ に計算して $z:=1\mathbin{\dot{-}}(z_{1}\cdot(1\mathbin{\dot{-}}z_{2}))$。（ほかの結合子は略記。途中の $1\mathbin{\dot{-}}\cdot$ などは \ref{comp:L-macros} の 2・4 の組み合わせ。）どれも for プログラムなので止まる（\ref{comp:for-total}）。
:::

::: proposition while プログラムの L への翻訳 {#logic:ha-compile keywords="translation of while programs over the arithmetic language into L preserving the big-step semantics" index="L への翻訳（while プログラム）|えるへのほんやくほわいるぷろぐらむ"}
while プログラム $P$ に L のプログラム $P^{\circ}$ を対応させ、$\mathrm{var}(P^{\circ})$ が $\mathrm{var}(P)$ と補助の変数の集合 $\mathrm{Aux}(P)$（$\mathrm{var}(P)$ と交わらない有限集合）の和になるようにできる。さらに、どの状態 $\sigma$ についても
$$
\langle P,\sigma\rangle\Downarrow\tau\ \text{となる}\ \tau\ \text{がある}\iff\langle P^{\circ},\sigma\rangle\Downarrow\tau'\ \text{となる}\ \tau'\ \text{がある}
$$
で、このとき $\tau$ と $\tau'$ は $\mathrm{Aux}(P)$ の外で一致する。
:::

::: proof
$P$ の構成についての再帰で、各段で新しい補助の変数をとって定める。$\mathtt{skip}^{\circ}\defeq(u:=u)$（$u$ は補助）。$(x:=t)^{\circ}\defeq T_{t,z};\ x:=z$。$(P;Q)^{\circ}\defeq P^{\circ};Q^{\circ}$。$(\mathtt{if}\ B\ \mathtt{then}\ P\ \mathtt{else}\ Q\ \mathtt{fi})^{\circ}\defeq C_{B,z};\ \mathtt{if}\ z\ne0\ \mathtt{then}\ P^{\circ}\ \mathtt{fi};\ \mathtt{if}\ z=0\ \mathtt{then}\ Q^{\circ}\ \mathtt{fi}$。$(\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od})^{\circ}\defeq C_{B,z};\ \mathtt{while}\ z\ne0\ \mathtt{do}\ P^{\circ};\ C_{B,z}\ \mathtt{od}$。ここで $z$ はその段で新しくとる補助の変数で、$P^{\circ},Q^{\circ}$ に現れない。

**Step 1.** 【主張：⇒】 $\langle P,\sigma\rangle\Downarrow\tau$ の導出についての帰納法で、「$\langle P^{\circ},\sigma\rangle\Downarrow\tau'$ となる $\tau'$ があって $\mathrm{Aux}(P)$ の外で $\tau$ と一致する」を、すべての $\sigma$（補助の変数の値は任意）について示す。代入と skip は \ref{logic:ha-term-test}。合成と条件分岐は帰納法の仮定と、$z$ が $P^{\circ},Q^{\circ}$ で変わらないこと（局所性、\ref{comp:L-locality}）。while：$\langle W,\sigma\rangle\Downarrow\tau$ の導出の最後が $\sigma\models\neg B$ なら、$C_{B,z}$ の後 $z=0$ でループは回らない。$\sigma\models B$、$\langle P,\sigma\rangle\Downarrow\rho$、$\langle W,\rho\rangle\Downarrow\tau$ なら、$z=1$ で一周目に入り、$P^{\circ}$ の後（帰納法の仮定）$\rho$ と補助の外で一致する状態で $C_{B,z}$ を計算する。その後の L のループの残りの実行は、$\rho$ から $W^{\circ}$ を実行したときの $C_{B,z}$ の後と同じ状態から始まるので、$\langle W,\rho\rangle\Downarrow\tau$ についての帰納法の仮定が使える。

**Step 2.** 【主張：⇐】 L の導出についての帰納法で同様に示す（while の場合は L の規則 6 の導出についての帰納法で、ループの各周回が $W$ の一周に対応する）。$\tau$ と $\tau'$ が補助の外で一致することも同時に運ぶ。
:::

## N の表現性 {#logic:sec-ha-expressive}

::: theorem N は表現的 {#logic:n-expressive keywords="the standard model of arithmetic is expressive for while programs" index="表現性（自然数の標準構造）|ひょうげんせいしぜんすうのひょうじゅんこうぞう" refname="N の表現性"}
$\mathcal{N}$ は $\mathcal{L}_{\mathrm{ar}}$ について表現的である。したがって \ref{logic:cook-completeness} から、$\mathcal{N}$ で妥当な三つ組はすべて $\vdash_{\mathcal{N}}$ で導ける。
:::

::: proof
while プログラム $P$ と論理式 $\psi$ をとる。$\mathrm{var}(P)=\{x_{0},\dots,x_{n}\}$ と番号を付け替え、$\mathrm{Aux}(P)=\{x_{n+1},\dots,x_{m}\}$ とする。

**Step 1.** 【主張：実行の関係は決定可能な関係の射影】 $\vec{a},\vec{b}\in\mathbb{N}^{n+1}$, $t\in\mathbb{N}$ について、$R(\vec{a},\vec{b},t)$ を「$D^{P^{\circ}}(\vec{a},\vec{0},t)=1$ かつ $i\le n$ で $G^{P^{\circ}}_{i}(\vec{a},\vec{0},t)=b_{i}$」とする（$\vec{0}$ は補助の変数の値、$D,G$ は \ref{comp:fuel-pr}）。$R$ は原始再帰的で、とくに決定可能。状態 $\sigma$ で $x_{i}$ の値が $a_{i}$（$i\le n$）のとき、
$$
\langle P,\sigma\rangle\Downarrow\tau\iff\text{ある }t\text{ で }R(\vec{a},\vec{b},t)\text{、ここで }\tau\text{ は }\sigma[x_{i}\mapsto b_{i}\ (i\le n)]
$$
となる：\ref{logic:while-determinism-locality} の 2・3 で、補助の変数を $0$ にした $\sigma_{0}$ に取り替えても止まるかどうかと $\mathrm{var}(P)$ の上の結果は変わらず、\ref{logic:ha-compile} で $P^{\circ}$ に移し、\ref{comp:fuel-adequacy} で燃料の言葉に直す。

**Step 2.** 【主張：$R$ は論理式で定義される】 \ref{comp:decidable-representable} で、$R$ は論理式 $\rho(\vec{x},\vec{y},w)$ によって $\mathsf{Q}$ で表現される。$\mathcal{N}\models\mathsf{Q}$ なので、$R(\vec{a},\vec{b},t)$ なら $\mathcal{N}\models\rho(\underline{\vec{a}},\underline{\vec{b}},\underline{t})$、そうでなければ $\mathcal{N}\models\neg\rho(\underline{\vec{a}},\underline{\vec{b}},\underline{t})$。意味論的代入補題（\ref{logic:semantic-substitution}。数項は閉じた項なので代入可能）で、状態 $v$ について $v\models\rho(\vec{x},\vec{y},w)\iff R(v(\vec{x}),v(\vec{y}),v(w))$。

**Step 3.** 【主張：最弱事前条件を書く】 $\vec{y}=y_{0},\dots,y_{n}$ と $w$ を $\psi$, $\rho$ に現れない相異なる新しい変数とし、
$$
\omega\defeq\forall\vec{y}\,\forall w\,\bigl(\rho(\vec{x},\vec{y},w)\to\psi[y_{0}/x_{0}]\cdots[y_{n}/x_{n}]\bigr)
$$
とおく。新しい変数は代入可能で（\ref{logic:fresh-renaming}）、代入補題をくり返すと $v\models\psi[y_{0}/x_{0}]\cdots[y_{n}/x_{n}]\iff v[x_{i}\mapsto v(y_{i})\ (i\le n)]\models\psi$。よって $v\models\omega\iff$ すべての $\vec{b},t$ で $R(v(\vec{x}),\vec{b},t)$ なら $v[x_{i}\mapsto b_{i}]\models\psi$（$\psi$ の $\vec{y},w$ 以外の変数の値は $v$ のまま）$\iff$ Step 1 から、$\langle P,v\rangle\Downarrow\tau$ となるすべての $\tau$ で $\tau\models\psi$。すなわち $\llbracket\omega\rrbracket=\mathrm{wlp}(P,\psi)$。
:::

## 妥当な三つ組は枚挙できない {#logic:sec-ha-incompleteness}

::: lemma レジスタ機械の模倣 {#logic:ha-simulate-rm keywords="every register machine run on an input can be simulated by a while program over the arithmetic language"}
レジスタ機械 $M$（\ref{comp:register-machine}）と $n\in\mathbb{N}$ について、while プログラム $P_{M,n}$ で、「どの状態から実行しても、$P_{M,n}$ が止まる $\iff$ $M$ が入力状態 $\sigma_{n}$ から停止する」を満たすものがあり、$(M,n)$ から $P_{M,n}$ は計算可能に得られる。
:::

::: proof
$M=I_{0},\dots,I_{N-1}$ が使うレジスタを $x_{0},\dots,x_{r}$、$p,q$ を新しい変数とする。$P_{M,n}$ は、まず $x_{0}:=0;\ x_{1}:=\underline{n};\ x_{2}:=0;\cdots;x_{r}:=0;\ p:=0$ とし、次に $\mathtt{while}\ p<\underline{N}\ \mathtt{do}\ \mathit{Body}\ \mathtt{od}$ とする。$\mathit{Body}$ は「$p=\underline{0}$ なら $I_{0}^{\ast}$、そうでなく $p=\underline{1}$ なら $I_{1}^{\ast}$、…」と条件分岐を入れ子にしたもの（最後の else は skip）で、
- $\mathtt{inc}(k)^{\ast}\defeq x_{k}:=S(x_{k});\ p:=S(p)$、
- $\mathtt{dec}(k)^{\ast}\defeq\mathtt{if}\ x_{k}=0\ \mathtt{then}\ p:=S(p)\ \mathtt{else}\ q:=0;\ \mathtt{while}\ \neg(S(q)=x_{k})\ \mathtt{do}\ q:=S(q)\ \mathtt{od};\ x_{k}:=q;\ p:=S(p)\ \mathtt{fi}$、
- $\mathtt{jz}(k,l)^{\ast}\defeq\mathtt{if}\ x_{k}=0\ \mathtt{then}\ p:=\underline{l}\ \mathtt{else}\ p:=S(p)\ \mathtt{fi}$。

$\mathtt{dec}$ の内側のループは $x_{k}\ge1$ のとき $x_{k}-1$ 周で止まり、$q=x_{k}-1$ になる。よって、$p=k<N$ でレジスタの値が $\sigma$ の状態から $\mathit{Body}$ を一度実行すると、$M$ の一歩 $(k,\sigma)\to_{M}(k',\sigma')$ の $(k',\sigma')$ に対応する状態になる（$q$ の値を除く）。外側のループが止まる $\iff$ ある時点で $p\ge N$ $\iff$ $M$ が停止する様相に達する（⇐ は停止までの歩数についての帰納法で導出を作り、⇒ は外側のループの導出についての帰納法）。初めの代入で、出発する状態によらず $M$ の入力状態 $\sigma_{n}$ から始まる。$P_{M,n}$ の記号列は $M$ のコードと $n$ から明らかな手続きで書き下せる。
:::

::: theorem 妥当な三つ組は帰納的に枚挙できない {#logic:hoare-n-not-re keywords="the set of Hoare triples valid in N is not recursively enumerable" index="ホーア論理の不完全性|ほーあろんりのふかんぜんせい" refname="N で妥当な三つ組の非枚挙性"}
$\mathcal{N}$ で妥当なホーアの三つ組の全体は帰納的に枚挙できない。とくに、三つ組の導出を機械的に検査できる（導出の全体が帰納的に枚挙できる）証明体系で、$\mathcal{N}$ について健全かつ完全なものはない。
:::

::: proof
**Step 1.** 【主張：停止しないことが三つ組の妥当性になる】 $K\defeq\{e:\varphi_{e}(e)\downarrow\}$（\ref{comp:halting-L}）とし、$e$ に $M_{e}$（指数 $e$ のレジスタ機械、\ref{comp:index}）をとって $P_{e}\defeq P_{M_{e},e}$ とする。三つ組 $\{\top\}P_{e}\{\bot\}$ が $\mathcal{N}$ で妥当 $\iff$ どの状態からも $P_{e}$ は止まらない $\iff$ $M_{e}$ は $\sigma_{e}$ から停止しない $\iff$ $e\notin K$（\ref{logic:ha-simulate-rm}）。

**Step 2.** 【主張：枚挙できれば $K$ が決定可能になる】 妥当な三つ組の全体が帰納的に枚挙できれば、計算可能な写像 $e\mapsto\{\top\}P_{e}\{\bot\}$ による逆像として、$K$ の補集合も帰納的に枚挙できる（Σ₁）。$K$ 自身も計算可能な部分関数の定義域なので Σ₁（\ref{comp:halting-L}、\ref{comp:sigma1-recognizable.1}）。両方が Σ₁ なら $K$ は Δ₁ で、\ref{comp:sigma1-recognizable.2} から決定可能となり、\ref{comp:halting-L} に反する。

最後の主張：そのような体系があれば、導出の列挙から妥当な三つ組が枚挙できてしまう。
:::

::: remark
1. \ref{logic:n-expressive} と合わせると、ホーア論理は $\mathrm{Th}(\mathcal{N})$ を神託として完全だが、$\mathrm{Th}(\mathcal{N})$ そのものが帰納的に枚挙できないので（Step 2 と同じ議論でも、ゲーデルの不完全性定理からも分かる）、矛盾はない。
2. 逆に、帰結規則の前提を「$\PA\vdash\varphi\to\varphi'$」に制限した体系は機械的に検査できるが、上の定理から $\mathcal{N}$ について完全ではない。
:::

::: intuition
**部分正当性は「止まらないこと」を含む。** $\{\top\}P\{\bot\}$ は「$P$ はどこからも止まらない」という主張で、これは停止問題の否定、すなわち Π₁ の性質である。帰納的に枚挙できるのは Σ₁ の性質だけなので、どんな機械的な証明体系も部分正当性をすべて捉えることはできない。相対完全性は、この困難を「算術の真理」という神託にすべて押しつけた上で、プログラムの構造についての推論はホーアの規則で尽くせる、と言っている。

**高い視点：表現性と算術化。** $\mathcal{N}$ が表現的である理由は、プログラムの実行（有限の計算の列）を数で符号化し、その正しさを算術の論理式で書けること、すなわち不完全性定理と同じ**算術化**である。ホーア論理の相対完全性は、「計算についての推論」を「数についての推論」に移すゲーデルの方法の、プログラム検証での現れと見ることができる。
:::

## 問題 {#logic:sec-ha-problems}

::: problem {#logic:prob-ha-wlp-example}
$P\defeq\mathtt{while}\ \neg(x=0)\ \mathtt{do}\ x:=x+x\ \mathtt{od}$ について、$\mathrm{wlp}(P,\bot)$ を求め、それを表す $\mathcal{L}_{\mathrm{ar}}$ の論理式を直接書け。
:::

::: solution
$x=0$ ならループは回らずに止まり、$x\ne0$ なら $x$ は倍々に増えて $0$ にならず止まらない。よって $\mathrm{wlp}(P,\bot)=\{v:v(x)\ne0\}$（止まらない状態だけ）で、論理式 $\neg(x=0)$ が表す。\ref{logic:n-expressive} の一般の構成ではもっと複雑な論理式になるが、$\mathcal{N}$ で同値である。
:::

::: problem {#logic:prob-ha-total-not-re}
「$\{\top\}P\{\top\}$ が妥当」は自明に成り立つ。では、「$P$ はどの状態からも止まる」（全正当性 $[\top]P[\top]$）が成り立つ while プログラム $P$ の全体は帰納的に枚挙できるか。
:::

::: solution
できない。$e\mapsto P'_{e}$ を、「$x_{1}$ の値 $n$ を読み、$M_{e}$ を入力 $n$ で模倣する」（\ref{logic:ha-simulate-rm} の初めの代入から $x_{1}:=\underline{n}$ を除いたもの）とすると、$P'_{e}$ がどこからも止まる $\iff$ $\varphi_{e}$ がすべての入力で定義される。すべての入力で定義される関数の指数の集合は帰納的に枚挙できない（\ref{comp:prob-total-not-decidable} を参照。そこでは決定不能性が示されているが、同じ対角線論法で枚挙不能性も示せる：枚挙 $e_{0},e_{1},\dots$ があれば $k\mapsto\varphi_{e_{k}}(k)+1$ はすべての入力で定義される計算可能な関数で、どの $e_{k}$ とも異なる）。
:::
