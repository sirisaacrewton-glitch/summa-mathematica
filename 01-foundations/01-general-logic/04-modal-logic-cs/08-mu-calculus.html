# 様相 μ 計算：構文・代入・意味論 {#logic:page-mu-calculus keywords="modal mu-calculus, least fixed point, greatest fixed point, positivity, free and bound variables, capture-avoiding substitution, alpha-equivalence, substitution lemma, unfolding, Knaster-Tarski"}

PDL の $[\alpha^{\ast}]A$、LTL の $A\,\mathbf{U}\,B$、CTL の $\mathbf{E}(A\,\mathbf{U}\,B)$ は、どれも状態の集合の上の単調な写像の最小・最大の不動点だった（\ref{logic:pdl-valid}, \ref{logic:ltl-valid}, \ref{logic:ctl-fixpoints}）。**様相 μ 計算**（Kozen 1983）は、不動点を作る演算子 $\mu X.A$（最小）・$\nu X.A$（最大）を論理式の中に直接書けるようにした論理である。$\mu X.A$ は変数 $X$ を**束縛**するので、ラムダ計算や一階述語論理と同じく、**代入は自明でない**：素朴に置き換えると、代入する論理式の自由変数が束縛されてしまう（捕獲）。このページでは、構文・自由変数・**正値性**（$X$ が否定の偶数個の下にしか現れないこと）を定義し、**捕獲を避ける代入**を束縛変数の付け替えを込めて定め、代入が論理式であることと正値性を保つことを示す。次に意味論をクナスター–タルスキの不動点定理で定め、**代入補題** $\lVert A[B/X]\rVert_{V}=\lVert A\rVert_{V[X\mapsto\lVert B\rVert_{V}]}$、**α 同値**な論理式の意味が等しいこと、**展開則** $\lVert\mu X.A\rVert=\lVert A[\mu X.A/X]\rVert$ を証明する。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。μ 計算は Kozen, *Results on the propositional μ-calculus*, Theoret. Comput. Sci. 27 (1983) による。代入の扱いは一階述語論理の代入（\ref{logic:page-substitution}）と同じ考え方で、ここでは束縛変数を付け替える形の定義を採った。

## 記法と定義の確認 {#logic:sec-mu-notation}

::: notation
- **変数**の可算集合 $\mathrm{VAR}$ を一つ固定し、その元を一列に並べておく（$v_{0},v_{1},\dots$）。「**新しい変数**」とは、与えられた有限集合に属さない変数のうち、この並びで最初のものをいう。$X,Y,Z,W,p,q$ などで変数を表す（命題変数と不動点の変数を区別しない）。
- **動作**の可算集合 $\mathrm{Act}$ を固定する。**ラベル付き遷移系** $\mathcal{M}=(S,\{R_{a}\}_{a\in\mathrm{Act}})$ は、空でない集合 $S$ と関係 $R_{a}\subset S\times S$ からなる。**付値**は写像 $V\colon\mathrm{VAR}\to\mathcal{P}(S)$。$V[X\mapsto T]$ は $X$ だけを $T$ に変えた付値。$X\ne Y$ なら $V[X\mapsto T][Y\mapsto U]=V[Y\mapsto U][X\mapsto T]$。
- $\mathcal{P}(S)$ 上の写像 $f$ が**単調**とは $T\subset T'\Rightarrow f(T)\subset f(T')$。$f(T)\subset T$ となる $T$ を**前不動点**、$T\subset f(T)$ となる $T$ を**後不動点**という。
- **公理系**：$\ZF$ で行う。選択公理は使わない。
:::

## 構文 {#logic:sec-mu-syntax}

::: definition 前論理式・自由変数・深さ {#logic:mu-preformula keywords="pre-formulas of the modal mu-calculus, free variables, depth" index="様相 μ 計算|ようそうみゅーけいさん, μ 計算|みゅーけいさん, 自由変数（μ 計算）|じゆうへんすうみゅーけいさん"}
**前論理式**を次で帰納的に定める：変数 $X$ は前論理式。$A,B$ が前論理式なら $\neg A$、$A\wedge B$、$\langle a\rangle A$（$a\in\mathrm{Act}$）、$\mu X.A$（$X\in\mathrm{VAR}$）は前論理式。$\mu X.A$ の $X$ を**束縛変数**、$A$ をその**作用域**という。**自由変数**の集合 $\mathrm{FV}$ と**深さ** $d$ を
$$
\begin{aligned}
&\mathrm{FV}(X)=\{X\},\quad\mathrm{FV}(\neg A)=\mathrm{FV}(\langle a\rangle A)=\mathrm{FV}(A),\quad\mathrm{FV}(A\wedge B)=\mathrm{FV}(A)\cup\mathrm{FV}(B),\quad\mathrm{FV}(\mu X.A)=\mathrm{FV}(A)\setminus\{X\},\\
&d(X)=0,\quad d(\neg A)=d(\langle a\rangle A)=d(\mu X.A)=d(A)+1,\quad d(A\wedge B)=\max\{d(A),d(B)\}+1
\end{aligned}
$$
で定める。
:::

::: definition 正値性 {#logic:mu-positivity keywords="positive and negative occurrences of a variable; X occurs only positively in A" index="正値性（μ 計算）|せいちせいみゅーけいさん, 正にしか現れない|せいにしかあらわれない"}
変数 $W$ と前論理式 $A$ について、述語 $\mathrm{pos}(W,A)$（「$W$ は $A$ に**正にしか現れない**」）と $\mathrm{neg}(W,A)$（「**負にしか現れない**」）を同時に再帰で定める。
- $\mathrm{pos}(W,X)$ はいつも真。$\mathrm{neg}(W,X)\iff W\ne X$。
- $\mathrm{pos}(W,\neg A)\iff\mathrm{neg}(W,A)$、$\mathrm{neg}(W,\neg A)\iff\mathrm{pos}(W,A)$。
- $\wedge$ は両方について成り立つとき、$\langle a\rangle A$ は $A$ について成り立つとき。
- $\mathrm{pos}(W,\mu Y.A)$, $\mathrm{neg}(W,\mu Y.A)$ は、$W=Y$ なら真、$W\ne Y$ なら $\mathrm{pos}(W,A)$, $\mathrm{neg}(W,A)$。

$W\notin\mathrm{FV}(A)$ なら $\mathrm{pos}(W,A)$ と $\mathrm{neg}(W,A)$ はどちらも真である（$A$ の構成についての帰納法）。
:::

::: definition μ 計算の論理式 {#logic:mu-formula keywords="formulas of the modal mu-calculus: every mu X.A has X positive in A; abbreviations nu, box, bottom" index="μ 計算の論理式|みゅーけいさんのろんりしき"}
前論理式 $A$ のどの部分 $\mu Y.C$ についても $\mathrm{pos}(Y,C)$ が成り立つとき、$A$ を（μ 計算の）**論理式**という。略記：$A\vee B\defeq\neg(\neg A\wedge\neg B)$、$A\to B\defeq\neg A\vee B$、$[a]A\defeq\neg\langle a\rangle\neg A$、$\bot\defeq\mu v_{0}.v_{0}$、$\top\defeq\neg\bot$。最大不動点 $\nu X.A$ は代入を定めた後で \ref{logic:mu-nu} で定義する。
:::

::: remark
正値性の条件は意味論で写像 $T\mapsto\lVert A\rVert_{V[X\mapsto T]}$ を単調にするためのもので（\ref{logic:mu-monotone}）、これがないと不動点が存在しないことがある（\ref{logic:prob-mu-positivity}）。
:::

## 捕獲を避ける代入 {#logic:sec-mu-substitution}

::: definition 捕獲を避ける代入 {#logic:mu-substitution keywords="capture-avoiding substitution A[B/X] with renaming of bound variables" index="捕獲を避ける代入|ほかくをさけるだいにゅう, 代入（μ 計算）|だいにゅうみゅーけいさん"}
前論理式 $A,B$ と変数 $X$ について、$A$ の $X$ に $B$ を**代入**した前論理式 $A[B/X]$ を、$A$ の深さ $n$ についての再帰で（すべての $B$ について同時に）定める。同時に、「$B$ が変数なら $d(A[B/X])=d(A)$」も深さ $n$ まで示しておく。
1. $Y[B/X]\defeq B$（$Y=X$）、$\defeq Y$（$Y\ne X$）。
2. $(\neg C)[B/X]\defeq\neg(C[B/X])$、$(C\wedge D)[B/X]\defeq C[B/X]\wedge D[B/X]$、$(\langle a\rangle C)[B/X]\defeq\langle a\rangle(C[B/X])$。
3. $(\mu Y.C)[B/X]$ は次の三つの場合に分けて定める。
   - (i) $X\notin\mathrm{FV}(\mu Y.C)$ なら $\mu Y.C$。
   - (ii) $X\in\mathrm{FV}(\mu Y.C)$ かつ $Y\notin\mathrm{FV}(B)$ なら $\mu Y.(C[B/X])$。
   - (iii) $X\in\mathrm{FV}(\mu Y.C)$ かつ $Y\in\mathrm{FV}(B)$ なら、$Z$ を $\mathrm{FV}(B)\cup\mathrm{FV}(C)\cup\{X\}$ に対する新しい変数として $\mu Z.(C[Z/Y][B/X])$。

(iii) の $C[Z/Y]$ は深さ $d(C)<n$ の代入で定まっていて、変数の代入なので $d(C[Z/Y])=d(C)<n$。よって $C[Z/Y][B/X]$ も定まっている。深さの主張は各場合で帰納法の仮定から従う。
:::

::: remark
(i) で $X\in\mathrm{FV}(\mu Y.C)$ なら $Y\ne X$ である。(iii) が束縛変数の**付け替え**で、$B$ の自由変数 $Y$ が $\mu Y$ に捕まるのを避ける。$Z\ne Y$（$Y\in\mathrm{FV}(B)$, $Z\notin\mathrm{FV}(B)$ なので）。例えば $A=\mu Y.(X\vee\langle a\rangle Y)$、$B=Y$ のとき、素朴に置き換えた $\mu Y.(Y\vee\langle a\rangle Y)$ では代入した $Y$ が束縛されてしまうが、定義では (iii) で $\mu Z.(Y\vee\langle a\rangle Z)$ になる（\ref{logic:prob-mu-capture}）。
:::

::: lemma 代入の構文的な性質 {#logic:mu-substitution-syntax keywords="syntactic properties of substitution: no-op when X is not free, free variables, polarity, substitution yields formulas"}
前論理式 $A,B$、変数 $X$ について：
1. $X\notin\mathrm{FV}(A)$ ならば $A[B/X]=A$。
2. $\mathrm{FV}(A[B/X])\subset(\mathrm{FV}(A)\setminus\{X\})\cup\mathrm{FV}(B)$。
3. 変数 $W$ について、$Q\defeq$「$W\notin\mathrm{FV}(B)$、または $\mathrm{pos}(X,A)$ かつ $\mathrm{pos}(W,B)$、または $\mathrm{neg}(X,A)$ かつ $\mathrm{neg}(W,B)$」、$Q'\defeq$「$W\notin\mathrm{FV}(B)$、または $\mathrm{pos}(X,A)$ かつ $\mathrm{neg}(W,B)$、または $\mathrm{neg}(X,A)$ かつ $\mathrm{pos}(W,B)$」とおくと、
$$
(W=X\text{ または }\mathrm{pos}(W,A))\text{ かつ }Q\ \Longrightarrow\ \mathrm{pos}(W,A[B/X]),
$$
$$
(W=X\text{ または }\mathrm{neg}(W,A))\text{ かつ }Q'\ \Longrightarrow\ \mathrm{neg}(W,A[B/X]).
$$
4. $A,B$ が論理式ならば $A[B/X]$ も論理式。
:::

::: proof
すべて $A$ の深さについての帰納法（すべての $B$, $X$, $W$ について同時に）。(iii) の場合は、深さ $d(C)$ の $C$ と、同じ深さの $C[Z/Y]$ に帰納法の仮定を使う。

**Step 1.** 【主張：$X$ が自由でなければ代入しても変わらない】 変数は $Y\ne X$ なので変わらない。$\neg,\wedge,\langle a\rangle$ は帰納法の仮定。$\mu Y.C$ は (i) の場合なので変わらない。

**Step 2.** 【主張：代入の結果の自由変数は、$X$ 以外の $A$ の自由変数と $B$ の自由変数に限られる】 変数・$\neg,\wedge,\langle a\rangle$ は直接。(ii)：$\mathrm{FV}(C[B/X])\setminus\{Y\}\subset((\mathrm{FV}(C)\setminus\{X\})\cup\mathrm{FV}(B))\setminus\{Y\}$ で、$Y\notin\mathrm{FV}(B)$ なので右辺は $(\mathrm{FV}(\mu Y.C)\setminus\{X\})\cup\mathrm{FV}(B)$ に含まれる。(iii)：帰納法の仮定を 2 回使うと $\mathrm{FV}(C[Z/Y][B/X])\subset(((\mathrm{FV}(C)\setminus\{Y\})\cup\{Z\})\setminus\{X\})\cup\mathrm{FV}(B)$。$Z$ を除くと、$Z\notin\mathrm{FV}(B)$ なので $(\mathrm{FV}(C)\setminus\{Y,X\})\cup\mathrm{FV}(B)$ に含まれる。

**Step 3.** 【主張：代入の結果での $W$ の極性は、$A$ での $W$ の極性と、$X$ の位置に入る $B$ での $W$ の極性で決まる】 pos と neg を同時に示す。変数 $Y$：$Y=X$ なら $A[B/X]=B$ で、$Q$ の三つの場合のどれでも $\mathrm{pos}(W,B)$（$\mathrm{neg}(X,X)$ は偽なので三つ目は起きない）。$Y\ne X$ なら $A[B/X]=Y$ で、$W=X$ のときも $\mathrm{pos}(X,Y)$ は真。$\neg C$：$\mathrm{pos}(W,\neg C)=\mathrm{neg}(W,C)$ で、$Q$（$A=\neg C$）は $Q'$（$A=C$）と同じなので、$C$ の neg の主張に帰着。$\wedge,\langle a\rangle$：各成分で仮定が成り立つ。$\mu Y.C$：(i) なら結果は $A$ で、$W\ne X$ なら仮定の $\mathrm{pos}(W,A)$、$W=X$ なら $X\notin\mathrm{FV}(A)$ から。(ii) なら結果は $\mu Y.(C[B/X])$ で、$W=Y$ なら真、$W\ne Y$ なら $C$ についての帰納法の仮定（$Y\ne X$ なので $\mathrm{pos}(X,A)=\mathrm{pos}(X,C)$ など）。(iii) なら結果は $\mu Z.D$（$D=C[Z/Y][B/X]$）で、$W=Z$ なら真。$W\ne Z$ のとき、まず $C$ に帰納法の仮定（$B$ を $Z$、$X$ を $Y$ として、$W\notin\mathrm{FV}(Z)$ なので $Q$ は真）を使うと、「$W=Y$ または $\mathrm{pos}(W,C)$」から $\mathrm{pos}(W,C[Z/Y])$、同様に $\mathrm{pos}(X,C)\Rightarrow\mathrm{pos}(X,C[Z/Y])$（$X\ne Y,Z$）、$\mathrm{neg}$ も同じ。次に $C[Z/Y]$ に帰納法の仮定を使えば $\mathrm{pos}(W,D)$。neg も同じ。

**Step 4.** 【主張：代入の結果も正値性の条件を満たす】 $A[B/X]$ の部分 $\mu$ が正値性を満たすことを示す。新しく現れる $\mu$ は (ii)・(iii) の結果の先頭だけで、それ以外は帰納法の仮定。(ii)：$\mathrm{pos}(Y,C[B/X])$ は 3（$W=Y\ne X$、$\mathrm{pos}(Y,C)$、$Y\notin\mathrm{FV}(B)$）から。(iii)：3 を $C$, $B=Z$, $X=Y$, $W=Z$ に使うと（$\mathrm{pos}(Z,C)$ は $Z\notin\mathrm{FV}(C)$ から、$Q$ は $\mathrm{pos}(Y,C)$ と $\mathrm{pos}(Z,Z)$ から）$\mathrm{pos}(Z,C[Z/Y])$。もう一度 3 を $W=Z$（$Z\ne X$, $Z\notin\mathrm{FV}(B)$）に使って $\mathrm{pos}(Z,C[Z/Y][B/X])$。

::: hypcheck
- **(iii) の $Z$ の条件**：$Z\notin\mathrm{FV}(B)$ は Step 2・4 で（代入した $B$ の中の $Z$ が新しい $\mu Z$ に捕まらないため）、$Z\notin\mathrm{FV}(C)$ は Step 4 で（$\mu Z$ の作用域にもとの自由な $Z$ が残らないため）、$Z\ne X$ は Step 3 で使った。
- **3 の $Q$ の一つ目の場合**（$W\notin\mathrm{FV}(B)$）：Step 4 では $X$ が $C$ に正負両方で現れる場合もあり、二つ目・三つ目の場合は使えない。$W$ が $B$ に自由に現れなければ $X$ の現れ方によらない、という一つ目の場合が要る。
:::
:::

## 意味論 {#logic:sec-mu-semantics}

::: lemma 冪集合の上の不動点（クナスター–タルスキ） {#logic:mu-knaster-tarski keywords="Knaster-Tarski on a power set: least fixed point is the intersection of pre-fixed points, greatest is the union of post-fixed points" index="クナスター–タルスキの定理（冪集合）|くなすたーたるすきのていりべきしゅうごう"}
$f\colon\mathcal{P}(S)\to\mathcal{P}(S)$ を単調とする。
1. $\mathrm{lfp}(f)\defeq\bigcap\{T:f(T)\subset T\}$ は $f$ の不動点で、すべての前不動点に含まれる（とくに最小の不動点）。
2. $\mathrm{gfp}(f)\defeq\bigcup\{T:T\subset f(T)\}$ は $f$ の不動点で、すべての後不動点を含む（とくに最大の不動点）。
3. $g(T)\defeq S\setminus f(S\setminus T)$ も単調で、$\mathrm{lfp}(g)=S\setminus\mathrm{gfp}(f)$。
:::

::: proof
**Step 1.** 【主張：前不動点の共通部分は最小の不動点】 \ref{comp:knaster-tarski} と同じ証明である。$M\defeq\mathrm{lfp}(f)$。前不動点 $T$ について $M\subset T$ なので $f(M)\subset f(T)\subset T$、よって $f(M)\subset M$。すると $f(f(M))\subset f(M)$ で $f(M)$ も前不動点、$M\subset f(M)$。（$S$ 自身が前不動点なので共通部分は空でない族についてとっている。）

**Step 2.** 【主張：後不動点の和は最大の不動点】 1 の包含を逆にする。$N\defeq\mathrm{gfp}(f)$。後不動点 $T$ について $T\subset N$ なので $T\subset f(T)\subset f(N)$、よって $N\subset f(N)$。$f(N)\subset f(f(N))$ で $f(N)$ も後不動点、$f(N)\subset N$。

**Step 3.** 【主張：補集合で最小と最大が入れ替わる】 補集合をとる写像は包含を逆にする全単射なので $g$ は単調。$g(T)\subset T\iff S\setminus T\subset f(S\setminus T)$ で、前不動点 $T$ と後不動点 $S\setminus T$ が対応する。共通部分の補集合は補集合の和なので $\mathrm{lfp}(g)=S\setminus\mathrm{gfp}(f)$。
:::

::: definition μ 計算の意味論 {#logic:mu-semantics keywords="semantics of mu-calculus formulas: ||A||_V subset of S; mu as intersection of pre-fixed points" index="μ 計算の意味論|みゅーけいさんのいみろん"}
ラベル付き遷移系 $\mathcal{M}$ と写像 $V\colon\mathrm{VAR}\to\mathcal{P}(S)$（**付値**）について、前論理式 $A$ の**真理集合** $\lVert A\rVert_{V}\subset S$ を再帰で定める。
$$
\lVert X\rVert_{V}=V(X),\quad\lVert\neg A\rVert_{V}=S\setminus\lVert A\rVert_{V},\quad\lVert A\wedge B\rVert_{V}=\lVert A\rVert_{V}\cap\lVert B\rVert_{V},\quad\lVert\langle a\rangle A\rVert_{V}=\{s:sR_{a}t\text{ かつ }t\in\lVert A\rVert_{V}\text{ となる }t\text{ がある}\},
$$
$$
\lVert\mu X.A\rVert_{V}=\bigcap\{T\subset S:\lVert A\rVert_{V[X\mapsto T]}\subset T\}.
$$
$s\in\lVert A\rVert_{V}$ を $\mathcal{M},s\models_{V}A$ とも書く。すべてのラベル付き遷移系と付値で $\lVert A\rVert_{V}=S$ なら $A$ は**妥当**、ある遷移系と付値で $\lVert A\rVert_{V}\ne\varnothing$ なら**充足可能**という。
:::

::: lemma 一致の補題と単調性 {#logic:mu-monotone keywords="coincidence lemma and monotonicity in positive variables" index="単調性（μ 計算）|たんちょうせいみゅーけいさん"}
1. （一致）$V,V'$ が $\mathrm{FV}(A)$ の上で一致すれば $\lVert A\rVert_{V}=\lVert A\rVert_{V'}$。
2. （単調性）$T\subset T'$ とする。$\mathrm{pos}(X,A)$ なら $\lVert A\rVert_{V[X\mapsto T]}\subset\lVert A\rVert_{V[X\mapsto T']}$、$\mathrm{neg}(X,A)$ なら逆の包含。
3. $\mathrm{pos}(X,A)$ なら $f(T)\defeq\lVert A\rVert_{V[X\mapsto T]}$ は単調で、$\lVert\mu X.A\rVert_{V}=\mathrm{lfp}(f)$ は $f$ の最小の不動点。
:::

::: proof
**Step 1.** 【主張：真理集合は自由変数の値だけで決まる】 $A$ の構成についての帰納法。$\mu Y.C$ では、$V[Y\mapsto U]$ と $V'[Y\mapsto U]$ が $\mathrm{FV}(C)\subset\mathrm{FV}(\mu Y.C)\cup\{Y\}$ の上で一致するので、前不動点の族が同じ。

**Step 2.** 【主張：正にしか現れない変数について真理集合は単調】 $A$ の構成についての帰納法で pos と neg を同時に示す。変数：$A=X$ なら $T\subset T'$、$A\ne X$ なら等号（neg の場合は $A\ne X$ に限られる）。$\neg$ は補集合で包含が逆になり pos と neg が入れ替わる。$\wedge$, $\langle a\rangle$ は単調な操作。$\mu Y.C$：$Y=X$ なら $X\notin\mathrm{FV}(A)$ で 1 から等号。$Y\ne X$ なら、各 $U$ について帰納法の仮定で $\lVert C\rVert_{V[X\mapsto T][Y\mapsto U]}\subset\lVert C\rVert_{V[X\mapsto T'][Y\mapsto U]}$（付値の更新の順序は入れ替えてよい）。よって $T'$ についての前不動点 $U$ は $T$ についても前不動点で、共通部分は $T$ のほうが小さい。

**Step 3.** 【主張：$\lVert\mu X.A\rVert_{V}$ は最小の不動点】 2 と \ref{logic:mu-knaster-tarski.1}。
:::

::: theorem 代入補題 {#logic:mu-substitution-lemma keywords="substitution lemma for the mu-calculus: ||A[B/X]||_V = ||A||_{V[X -> ||B||_V]}" index="代入補題（μ 計算）|だいにゅうほだいみゅーけいさん" refname="代入補題（μ 計算）"}
すべての前論理式 $A,B$、変数 $X$、付値 $V$ について
$$
\lVert A[B/X]\rVert_{V}=\lVert A\rVert_{V[X\mapsto\lVert B\rVert_{V}]}.
$$
:::

::: proof
$A$ の深さについての帰納法（すべての $B,X,V$ について同時に）。$b\defeq\lVert B\rVert_{V}$ とおく。変数は定義から（$Y=X$ なら両辺 $b$、$Y\ne X$ なら両辺 $V(Y)$）。$\neg,\wedge,\langle a\rangle$ は帰納法の仮定。$\mu Y.C$ の場合：

**Step 1（(i)）.** 【主張：$X\notin\mathrm{FV}(\mu Y.C)$ なら成り立つ】 左辺は $\lVert\mu Y.C\rVert_{V}$ で、$V$ と $V[X\mapsto b]$ は $\mathrm{FV}(\mu Y.C)$ の上で一致するので \ref{logic:mu-monotone.1}。

**Step 2（(ii)）.** 【主張：$Y\notin\mathrm{FV}(B)$ なら成り立つ】 $Y\ne X$。各 $U$ について、帰納法の仮定（付値 $V[Y\mapsto U]$）で $\lVert C[B/X]\rVert_{V[Y\mapsto U]}=\lVert C\rVert_{V[Y\mapsto U][X\mapsto\lVert B\rVert_{V[Y\mapsto U]}]}$。$Y\notin\mathrm{FV}(B)$ と一致の補題で $\lVert B\rVert_{V[Y\mapsto U]}=b$、$X\ne Y$ で更新の順序を入れ替えると、右辺は $\lVert C\rVert_{V[X\mapsto b][Y\mapsto U]}$。よって左辺と右辺で前不動点の族が同じ。

**Step 3（(iii)）.** 【主張：付け替えた場合も成り立つ】 $Z$ は $\mathrm{FV}(B)\cup\mathrm{FV}(C)\cup\{X\}$ に対する新しい変数で、$Z\ne Y$。各 $U$ について、帰納法の仮定を $C[Z/Y]$（深さ $d(C)$）と $B$ に、次に $C$ と変数 $Z$ に使うと
$$
\begin{aligned}
\lVert C[Z/Y][B/X]\rVert_{V[Z\mapsto U]}&=\lVert C[Z/Y]\rVert_{V[Z\mapsto U][X\mapsto b]}\qquad(Z\notin\mathrm{FV}(B)\text{ と一致の補題})\\
&=\lVert C\rVert_{V[Z\mapsto U][X\mapsto b][Y\mapsto U]}\qquad(\lVert Z\rVert_{V[Z\mapsto U][X\mapsto b]}=U,\ Z\ne X)\\
&=\lVert C\rVert_{V[X\mapsto b][Y\mapsto U]}\qquad(Z\notin\mathrm{FV}(C)\text{ と一致の補題、}X\ne Y).
\end{aligned}
$$
よって $\lVert\mu Z.(C[Z/Y][B/X])\rVert_{V}$ と $\lVert\mu Y.C\rVert_{V[X\mapsto b]}$ は同じ前不動点の族の共通部分。

::: hypcheck
- **捕獲が起きると成り立たない**：Step 2 の $\lVert B\rVert_{V[Y\mapsto U]}=b$ は $Y\notin\mathrm{FV}(B)$ を使っている。素朴な代入で $Y\in\mathrm{FV}(B)$ のまま $\mu Y$ の中に入れると、$B$ の中の $Y$ が $U$ と読まれてしまう（\ref{logic:prob-mu-capture}）。(iii) の付け替えはこれを避けるためにある。
- 単調性（正値性）はこの補題では使っていない。前論理式についての等式である。
:::
:::

::: definition α 同値 {#logic:mu-alpha keywords="alpha-equivalence: renaming bound variables" index="α 同値（μ 計算）|あるふぁどうちみゅーけいさん"}
前論理式の中の一つの部分 $\mu Y.C$ を、$Z\notin\mathrm{FV}(C)$ となる変数 $Z$ について $\mu Z.(C[Z/Y])$ に置き換える操作を **α 変換**という。α 変換とその逆を有限回くり返して移り合う二つの前論理式を **α 同値**という。
:::

::: theorem α 同値な論理式は同じ意味をもつ {#logic:mu-alpha-invariance keywords="alpha-equivalent formulas have the same free variables, polarities and meaning" index="α 同値の不変性|あるふぁどうちのふへんせい"}
$A$ と $A'$ が α 同値ならば、$\mathrm{FV}(A)=\mathrm{FV}(A')$、すべての $W$ で $\mathrm{pos}(W,A)\iff\mathrm{pos}(W,A')$ と $\mathrm{neg}(W,A)\iff\mathrm{neg}(W,A')$、すべての付値で $\lVert A\rVert_{V}=\lVert A'\rVert_{V}$ が成り立つ。とくに一方が論理式なら他方も論理式。
:::

::: proof
α 変換一回について示せば、くり返しと逆についても成り立つ。

**Step 1.** 【主張：$W\notin\{Y,Z\}$ なら、$W\in\mathrm{FV}(C)$・$\mathrm{pos}(W,C)$・$\mathrm{neg}(W,C)$ は、$C$ を $C[Z/Y]$ に変えても変わらない】 $C$ の深さについての帰納法（すべての $Y,Z,W$ について同時に）。変数：$Y$ は $Z$ に変わるが、$W\ne Y,Z$ なので $W$ はどちらにも自由に現れず、$\mathrm{pos}(W,Y)=\mathrm{pos}(W,Z)$、$\mathrm{neg}(W,Y)=\mathrm{neg}(W,Z)$（どちらも真）。ほかの変数は変わらない。$\neg,\wedge,\langle a\rangle$ は帰納法の仮定。$\mu U.E$：(i) なら変わらない。(ii) なら $\mu U.(E[Z/Y])$ で、$W=U$ なら両方で束縛されていて三つとも同じ（自由でなく、極性は真）、$W\ne U$ なら帰納法の仮定。(iii) なら $U=Z$ で、結果は $\mu U'.(E[U'/U][Z/Y])$（$U'$ は $\{Z\}\cup\mathrm{FV}(E)\cup\{Y\}$ に対する新しい変数）。$W=U'$ なら、$U'\notin\mathrm{FV}(E)$ なので両方で自由でなく極性は真。$W\ne U'$ なら、$W\ne Y,Z$ と $W\ne U(=Z)$, $W\ne U'$ から、帰納法の仮定を $E[U'/U]$（変数 $Y,Z$）と $E$（変数 $U,U'$）に使えばよい。

**Step 2.** 【主張：置き換える部分そのもので成り立つ】 $D=\mu Y.C$, $D'=\mu Z.(C[Z/Y])$、$Z\notin\mathrm{FV}(C)$ とする（$Z=Y$ なら $C[Z/Y]=C$ なので $Z\ne Y$ とする）。$W\in\{Y,Z\}$ は $D,D'$ のどちらにも自由に現れない（$Y$ は $D$ で束縛、$Z\notin\mathrm{FV}(C)$。$Z$ は $D'$ で束縛、$Y\notin\mathrm{FV}(C[Z/Y])$ は \ref{logic:mu-substitution-syntax.2}）ので、極性はどれも真。$W\notin\{Y,Z\}$ では Step 1 から自由変数かどうかと極性が同じ。意味：各 $U$ について代入補題で $\lVert C[Z/Y]\rVert_{V[Z\mapsto U]}=\lVert C\rVert_{V[Z\mapsto U][Y\mapsto U]}=\lVert C\rVert_{V[Y\mapsto U]}$（$Z\notin\mathrm{FV}(C)$ と一致の補題）なので、前不動点の族が同じ。

**Step 3.** 【主張：外側の構成で保たれる】 $\neg,\wedge,\langle a\rangle,\mu W$ のどれも、成分の自由変数・極性・（すべての付値についての）意味だけで全体の自由変数・極性・意味が決まる（定義の形から）。置き換えた部分から外側へ構成についての帰納法。論理式であることは、外側の $\mu W.E$ について $\mathrm{pos}(W,E)$ が保たれることから従う。
:::

::: definition 最大不動点 ν {#logic:mu-nu keywords="greatest fixed point nu X.A defined as not mu X. not A[not X/X]" index="ν（最大不動点）|にゅーさいだいふどうてん"}
論理式 $A$ と $\mathrm{pos}(X,A)$ について $\nu X.A\defeq\neg\mu X.\neg(A[\neg X/X])$ とおく。
:::

::: theorem 不動点の展開則 {#logic:mu-unfolding keywords="unfolding: mu X.A is equivalent to A[mu X.A/X]; nu X.A is the greatest fixed point and equivalent to A[nu X.A/X]" index="展開則（μ 計算）|てんかいそくみゅーけいさん" refname="μ 計算の展開則"}
$A$ を論理式、$\mathrm{pos}(X,A)$、$f(T)\defeq\lVert A\rVert_{V[X\mapsto T]}$ とする。
1. $\nu X.A$ は論理式で、$\lVert\nu X.A\rVert_{V}=\mathrm{gfp}(f)$。
2. $A[\mu X.A/X]$ と $A[\nu X.A/X]$ は論理式で、$\lVert\mu X.A\rVert_{V}=\lVert A[\mu X.A/X]\rVert_{V}$、$\lVert\nu X.A\rVert_{V}=\lVert A[\nu X.A/X]\rVert_{V}$。
3. $\lVert A\rVert_{V[X\mapsto T]}\subset T$ なら $\lVert\mu X.A\rVert_{V}\subset T$。$T\subset\lVert A\rVert_{V[X\mapsto T]}$ なら $T\subset\lVert\nu X.A\rVert_{V}$。
:::

::: proof
**Step 1.** 【主張：$\nu X.A$ は論理式】 \ref{logic:mu-substitution-syntax.4} で $A[\neg X/X]$ は論理式。\ref{logic:mu-substitution-syntax.3} の neg の式を $W=X$, $B=\neg X$ に使うと、$\mathrm{pos}(X,A)$ と $\mathrm{neg}(X,\neg X)$ から $\mathrm{neg}(X,A[\neg X/X])$、よって $\mathrm{pos}(X,\neg(A[\neg X/X]))$。

**Step 2.** 【主張：$\nu X.A$ の意味は最大の不動点】 代入補題で $\lVert\neg(A[\neg X/X])\rVert_{V[X\mapsto T]}=S\setminus\lVert A\rVert_{V[X\mapsto S\setminus T]}=S\setminus f(S\setminus T)$。この写像を $g$ とすると、\ref{logic:mu-monotone.3} で $\lVert\mu X.\neg(A[\neg X/X])\rVert_{V}=\mathrm{lfp}(g)$、\ref{logic:mu-knaster-tarski.3} でその補集合は $\mathrm{gfp}(f)$。

**Step 3.** 【主張：展開しても意味は変わらず、前・後不動点との比較が成り立つ】 $\mathrm{FV}(\mu X.A)\not\ni X$ などから、\ref{logic:mu-substitution-syntax.4} で $A[\mu X.A/X]$ は論理式。代入補題で $\lVert A[\mu X.A/X]\rVert_{V}=f(\lVert\mu X.A\rVert_{V})=f(\mathrm{lfp}(f))=\mathrm{lfp}(f)$。$\nu$ も同様（1 を使う）。3 は \ref{logic:mu-knaster-tarski} の 1・2。
:::

::: example 到達可能性と不変性 {#logic:mu-examples keywords="mu X.(p or <a>X) is reachability; nu X.(p and [a]X) is invariance"}
1. $\lVert\mu X.(p\vee\langle a\rangle X)\rVert_{V}$ は、$R_{a}$ を有限回たどって $V(p)$ に着ける状態の集合 $E$ である。実際 $f(T)=V(p)\cup\{s:sR_{a}t\in T\}$ について $f(E)\subset E$（$E$ の元の前者は $E$ に属する）、また $f(T)\subset T$ なら、$p$ までの歩数についての帰納法で $E\subset T$。\ref{logic:mu-knaster-tarski.1} で $\mathrm{lfp}(f)=E$。CTL の $\mathbf{EF}p$、PDL の $\langle a^{\ast}\rangle p$ にあたる。
2. $\lVert\nu X.(p\wedge[a]X)\rVert_{V}$ は、$R_{a}$ を何回たどっても $V(p)$ から出ない状態の集合 $G$ である。$G\subset f(G)$ で、後不動点 $T$ は歩数についての帰納法で $G$ に含まれる。PDL の $[a^{\ast}]p$、CTL の $\mathbf{AG}p$ にあたる。
:::

::: intuition
**束縛変数は「名前のついた穴」である。** $\mu X.A$ の $X$ は「今まさに定義している集合」を指す局所的な名前で、外の世界から見えない。代入 $A[B/X]$ は「$A$ の自由な穴 $X$ に $B$ を差し込む」操作で、差し込む $B$ が外の世界の名前 $Y$ を使っているとき、たまたま $A$ の中で局所的な名前 $Y$ が使われていると、$B$ の $Y$ が局所的な $Y$ と取り違えられる。付け替え (iii) は、差し込む前に局所的な名前を誰も使っていない名前に変えておくことで、取り違えを防ぐ。α 同値は「局所的な名前の付け方だけが違う」ことで、意味を変えない（\ref{logic:mu-alpha-invariance}）。

**高い視点：完備束の上の不動点と代入の関手性。** 意味論は、論理式 $A$ と変数 $X$ に「付値の $X$ 成分を動かす写像」$T\mapsto\lVert A\rVert_{V[X\mapsto T]}$ を対応させる。代入補題は、構文の代入が意味論では「この写像に $B$ の値を入れる」ことに対応することを言う。ラムダ計算でいえば $\beta$ 簡約の健全性、圏論でいえば「構文の代入が意味論での値の入れ込みに写る」という意味論の関手性である。展開則は、$\mu X.A$ の意味がこの写像の不動点であることを、構文の代入の言葉で言い直したものである。
:::

## 問題 {#logic:sec-mu-problems}

::: problem {#logic:prob-mu-capture}
$A\defeq\mu Y.(X\vee\langle a\rangle Y)$、$B\defeq Y$ とする。(1) 定義の $A[B/X]$ を求めよ。(2) 素朴に置き換えた $A'\defeq\mu Y.(Y\vee\langle a\rangle Y)$ について、$\lVert A'\rVert_{V}\ne\lVert A\rVert_{V[X\mapsto V(Y)]}$ となる例を挙げよ。
:::

::: solution
(1) $X\in\mathrm{FV}(A)$、$Y\in\mathrm{FV}(B)$ なので (iii)。$\mathrm{FV}(B)\cup\mathrm{FV}(X\vee\langle a\rangle Y)\cup\{X\}=\{X,Y\}$ に対する新しい変数を $Z$ とすると、$A[B/X]=\mu Z.((X\vee\langle a\rangle Y)[Z/Y][Y/X])=\mu Z.(Y\vee\langle a\rangle Z)$。\ref{logic:mu-examples} の 1 と同じく、これは「$R_{a}$ をたどって $V(Y)$ に着ける状態」で、代入補題の右辺 $\lVert A\rVert_{V[X\mapsto V(Y)]}$ と一致する。(2) 状態 $\{0\}$、$R_{a}=\varnothing$、$V(Y)=\{0\}$ とする。右辺は $V(Y)$ に 0 歩で着くので $\{0\}$。一方 $A'$ の写像は $f(T)=T\cup\{s:sR_{a}t\in T\}=T$ で、$\varnothing$ が前不動点なので $\lVert A'\rVert_{V}=\varnothing$。束縛された $Y$ は付値の $V(Y)$ を見ないので、捕獲によって意味が変わった。
:::

::: problem {#logic:prob-mu-positivity}
前論理式 $\mu X.\neg X$（論理式ではない）について、$S\ne\varnothing$ なら $T\mapsto\lVert\neg X\rVert_{V[X\mapsto T]}$ に不動点がないことを示し、$\lVert\mu X.\neg X\rVert_{V}$ が展開則を満たさないことを確かめよ。
:::

::: solution
$f(T)=S\setminus T$。$f(T)=T$ なら $T=S\setminus T$ で、$s\in S$ について $s\in T\iff s\notin T$ となり矛盾。前不動点は $S\setminus T\subset T$、すなわち $T=S$ だけなので $\lVert\mu X.\neg X\rVert_{V}=S$。一方 $\lVert(\neg X)[\mu X.\neg X/X]\rVert_{V}=\lVert\neg\mu X.\neg X\rVert_{V}=\varnothing\ne S$。\ref{logic:mu-unfolding} の証明で正値性（単調性）を使ったのは $f(\mathrm{lfp}(f))=\mathrm{lfp}(f)$ のところである。
:::

::: problem {#logic:prob-mu-nu-pdl}
$\lVert\nu X.(p\wedge[a]X)\rVert_{V}$ が、\ref{logic:mu-examples} の 2 の集合 $G$ に等しいことを、後不動点の言葉で詳しく示せ。
:::

::: solution
$f(T)\defeq V(p)\cap\{s:sR_{a}t\Rightarrow t\in T\}$。$s\in G$ なら $s\in V(p)$（0 歩）で、$sR_{a}t$ なら $t$ から何歩たどっても $s$ からの歩数が 1 増えるだけなので $t\in G$。よって $G\subset f(G)$。逆に $T\subset f(T)$、$s\in T$ とし、$s=s_{0}R_{a}s_{1}\cdots R_{a}s_{n}$ について $k$ の帰納法で $s_{k}\in T$（$s_{k}\in T\subset f(T)$ から $s_{k+1}\in T$）、よって $s_{n}\in T\subset V(p)$。したがって $T\subset G$。\ref{logic:mu-knaster-tarski.2} と \ref{logic:mu-unfolding.1} で $\lVert\nu X.(p\wedge[a]X)\rVert_{V}=\mathrm{gfp}(f)=G$。
:::
