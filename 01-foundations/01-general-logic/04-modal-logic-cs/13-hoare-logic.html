# ホーア論理 {#logic:page-hoare-logic keywords="Hoare logic, while programs, big-step semantics, partial correctness, Hoare triple, assignment axiom, while rule, consequence rule, soundness, weakest liberal precondition, expressiveness, Cook relative completeness"}

**ホーア論理**（Hoare 1969）は、プログラム $P$ と一階述語論理の論理式 $\varphi,\psi$ の組 $\{\varphi\}P\{\psi\}$（**ホーアの三つ組**）を、「$\varphi$ が成り立つ状態から $P$ を実行して止まれば、止まった状態で $\psi$ が成り立つ」（**部分正当性**）と読み、それを導く推論規則の体系である。このページでは、一階の構造の上の while プログラムとその操作的意味論を定め、ホーア論理の規則が**健全**であることを示す。次に**最弱事前条件**を定義し、それが論理式で書ける（構造が**表現的**である）ならば、妥当な三つ組はすべて導ける（**クックの相対完全性定理**）ことを証明する。自然数の標準構造が表現的であることと、そこでは妥当な三つ組の全体が帰納的に枚挙できないことは、次のページ（\see[算術の上のホーア論理]{logic:page-hoare-arithmetic}）で扱う。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。相対完全性は Cook, *Soundness and completeness of an axiom system for program verification*, SIAM J. Comput. 7 (1978) による。ここでは代入の公理を、代入可能性の条件が要らない形 $\{\exists y\,(y=t\wedge\psi[y/x])\}\ x:=t\ \{\psi\}$ にした。

## 記法と定義の確認 {#logic:sec-hoare-notation}

::: notation
- 一階述語論理の言語・項・論理式・\term[代入]{logic:substitution} $\psi[t/x]$・代入可能性・構造・割り当て・充足・意味論的代入補題・一致補題は \ref{logic:page-substitution}, \ref{logic:page-semantics} のとおり。言語は等号をもつとする。
- 構造 $\mathfrak{A}$ を固定する。**状態**とは $\mathfrak{A}$ の割り当て（変数から領域への写像）のことで、$v,w$ などで表す。$\mathfrak{A},v\models\varphi$ を $v\models\varphi$ と略す。$\mathfrak{A}\models\varphi$ は、すべての $v$ で $v\models\varphi$ となること。$\llbracket\varphi\rrbracket\defeq\{v:v\models\varphi\}$。
- プログラムの操作的意味論の考え方（規則で閉じた最小の関係、導出についての帰納法）は、プログラミング言語 L の場合（\ref{comp:L-semantics}）と同じである。
- **公理系**：$\ZF$。選択公理は使わない。
:::

## while プログラム {#logic:sec-hoare-programs}

::: definition while プログラム {#logic:while-program keywords="while programs over a first-order signature: skip, assignment, composition, conditional, while loop" index="while プログラム|ほわいるぷろぐらむ"}
**while プログラム**（以下単に**プログラム**という）を次で帰納的に定める（$x$ は変数、$t$ は項、$B$ は量化子を含まない論理式）：$\mathtt{skip}$、$x:=t$、$P;Q$（**合成**）、$\mathtt{if}\ B\ \mathtt{then}\ P\ \mathtt{else}\ Q\ \mathtt{fi}$、$\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od}$。$P$ の中の変数（$x:=t$ の左辺と、項・条件の中の変数）の集合を $\mathrm{var}(P)$ とする。
:::

::: definition while プログラムの意味 {#logic:while-semantics keywords="big-step operational semantics of while programs" index="操作的意味論（while プログラム）|そうさてきいみろんほわいるぷろぐらむ"}
状態の間の関係 $\langle P,v\rangle\Downarrow w$ を、次の規則で閉じた最小の関係とする。
1. $\langle\mathtt{skip},v\rangle\Downarrow v$。$\langle x:=t,v\rangle\Downarrow v[x\mapsto t^{\mathfrak{A},v}]$。
2. $\langle P,v\rangle\Downarrow u$ かつ $\langle Q,u\rangle\Downarrow w$ なら $\langle P;Q,v\rangle\Downarrow w$。
3. $v\models B$ かつ $\langle P,v\rangle\Downarrow w$ なら $\langle\mathtt{if}\ B\ \mathtt{then}\ P\ \mathtt{else}\ Q\ \mathtt{fi},v\rangle\Downarrow w$。$v\models\neg B$ かつ $\langle Q,v\rangle\Downarrow w$ なら同じく。
4. $W\defeq\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od}$ とする。$v\models\neg B$ なら $\langle W,v\rangle\Downarrow v$。$v\models B$、$\langle P,v\rangle\Downarrow u$、$\langle W,u\rangle\Downarrow w$ なら $\langle W,v\rangle\Downarrow w$。
:::

::: lemma 決定性と局所性 {#logic:while-determinism-locality keywords="determinism and locality of while programs"}
1. $\langle P,v\rangle\Downarrow w$ かつ $\langle P,v\rangle\Downarrow w'$ なら $w=w'$。
2. $\langle P,v\rangle\Downarrow w$ なら、$\mathrm{var}(P)$ の外の変数で $w$ と $v$ は一致する。
3. $v,v'$ が $\mathrm{var}(P)$ の上で一致し、$\langle P,v\rangle\Downarrow w$ なら、$\langle P,v'\rangle\Downarrow w'$ となる $w'$ があり、$w'$ は $\mathrm{var}(P)$ の上で $w$ と、その外で $v'$ と一致する。
:::

::: proof
三つとも導出についての帰納法。1 は L の場合（\ref{comp:L-determinism}）と同じ証明（最後の規則はプログラムの形と、条件 $B$ が真か偽かで決まる）。2 は、代入 $x:=t$ で変わるのは $x\in\mathrm{var}(P)$ だけであることから。3 は、項と条件の値が $\mathrm{var}(P)$ の上の値だけで決まる（\ref{logic:coincidence}）ので、同じ規則で $v'$ からの導出が作れることから。
:::

## ホーアの三つ組と規則 {#logic:sec-hoare-rules}

::: definition ホーアの三つ組と部分正当性 {#logic:hoare-triple keywords="Hoare triple, partial correctness, validity of a triple in a structure" index="ホーアの三つ組|ほーあのみつぐみ, 部分正当性|ぶぶんせいとうせい"}
論理式 $\varphi,\psi$ と while プログラム $P$ の組 $\{\varphi\}P\{\psi\}$ を**ホーアの三つ組**という。すべての状態 $v,w$ について「$v\models\varphi$ かつ $\langle P,v\rangle\Downarrow w$ なら $w\models\psi$」が成り立つとき、三つ組は $\mathfrak{A}$ で**妥当**であるといい、$\mathfrak{A}\models\{\varphi\}P\{\psi\}$ と書く。
:::

::: definition ホーア論理の規則 {#logic:hoare-rules keywords="rules of Hoare logic relative to a structure: skip, assignment, composition, conditional, while, consequence" index="ホーア論理|ほーあろんり, while 規則|ほわいるきそく, 帰結規則|きけつきそく"}
次の公理と規則で導かれる三つ組を $\vdash_{\mathfrak{A}}\{\varphi\}P\{\psi\}$ と書く。
- （skip）$\{\varphi\}\ \mathtt{skip}\ \{\varphi\}$。
- （代入）$\{\exists y\,(y=t\wedge\psi[y/x])\}\ x:=t\ \{\psi\}$。ただし $y$ は $\psi$, $t$ に現れず $x$ と異なる変数。
- （合成）$\{\varphi\}P\{\chi\}$ と $\{\chi\}Q\{\psi\}$ から $\{\varphi\}P;Q\{\psi\}$。
- （条件分岐）$\{\varphi\wedge B\}P\{\psi\}$ と $\{\varphi\wedge\neg B\}Q\{\psi\}$ から $\{\varphi\}\mathtt{if}\ B\ \mathtt{then}\ P\ \mathtt{else}\ Q\ \mathtt{fi}\{\psi\}$。
- （while）$\{\varphi\wedge B\}P\{\varphi\}$ から $\{\varphi\}\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od}\{\varphi\wedge\neg B\}$。$\varphi$ を**ループ不変条件**という。
- （帰結）$\mathfrak{A}\models\varphi\to\varphi'$、$\{\varphi'\}P\{\psi'\}$、$\mathfrak{A}\models\psi'\to\psi$ から $\{\varphi\}P\{\psi\}$。
:::

::: remark
1. 帰結規則の前提 $\mathfrak{A}\models\varphi\to\varphi'$ は三つ組ではなく、$\mathfrak{A}$ で真な論理式であることを求める。つまりこの体系は $\mathfrak{A}$ の理論 $\mathrm{Th}(\mathfrak{A})$ を「神託」として使う。完全性が「相対」完全性と呼ばれるのはこのためである。
2. 代入の公理を通常の $\{\psi[t/x]\}\ x:=t\ \{\psi\}$ にすると、$t$ が $\psi$ の中で $x$ に代入可能という条件が要り、完全性の証明で束縛変数の付け替えを扱う必要がある。ここでの形は、新しい変数 $y$ は必ず代入可能（\ref{logic:fresh-renaming}）なので、その手間を省く。
:::

::: lemma 代入の公理の事前条件 {#logic:hoare-assignment-pre keywords="meaning of the precondition of the assignment axiom"}
$y$ が $\psi$, $t$ に現れず $x$ と異なるとき、$v\models\exists y\,(y=t\wedge\psi[y/x])\iff v[x\mapsto t^{\mathfrak{A},v}]\models\psi$。
:::

::: proof
$b\defeq t^{\mathfrak{A},v}$。左辺 $\iff$ ある $c$ で $v[y\mapsto c]\models y=t$ かつ $v[y\mapsto c]\models\psi[y/x]$。$y\notin\mathrm{var}(t)$ なので一致補題で $t^{\mathfrak{A},v[y\mapsto c]}=b$、よって $c=b$。$y$ は $\psi$ の中で $x$ に代入可能（\ref{logic:fresh-renaming}）なので、\ref{logic:semantic-substitution.2} で $v[y\mapsto b]\models\psi[y/x]\iff v[y\mapsto b][x\mapsto b]\models\psi$、$y\notin\mathrm{FV}(\psi)$ と一致補題で $\iff v[x\mapsto b]\models\psi$。
:::

::: theorem ホーア論理の健全性 {#logic:hoare-soundness keywords="soundness of Hoare logic" index="健全性（ホーア論理）|けんぜんせいほーあろんり" refname="ホーア論理の健全性"}
$\vdash_{\mathfrak{A}}\{\varphi\}P\{\psi\}$ ならば $\mathfrak{A}\models\{\varphi\}P\{\psi\}$。
:::

::: proof
三つ組の導出についての帰納法。

**Step 1.** 【主張：skip・代入・合成・条件分岐・帰結は妥当性を保つ】 skip は $\langle\mathtt{skip},v\rangle\Downarrow w$ なら $w=v$（決定性）。代入は \ref{logic:hoare-assignment-pre} と、$\langle x:=t,v\rangle\Downarrow w$ なら $w=v[x\mapsto t^{\mathfrak{A},v}]$ から。合成は、$\langle P;Q,v\rangle\Downarrow w$ の導出の最後の規則から $\langle P,v\rangle\Downarrow u$, $\langle Q,u\rangle\Downarrow w$ となる $u$ があり、帰納法の仮定を二回。条件分岐は $v\models B$ かどうかで場合分け。帰結は定義から。

**Step 2.** 【主張：while 規則は妥当性を保つ】 $W=\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od}$、$\mathfrak{A}\models\{\varphi\wedge B\}P\{\varphi\}$ とする。$\langle W,v\rangle\Downarrow w$ の導出についての帰納法で、「$v\models\varphi$ なら $w\models\varphi\wedge\neg B$」を示す。最後の規則が 4 の前半なら $w=v$ で $v\models\neg B$。後半なら $v\models B$、$\langle P,v\rangle\Downarrow u$、$\langle W,u\rangle\Downarrow w$ で、仮定から $u\models\varphi$、帰納法の仮定（より短い導出）で $w\models\varphi\wedge\neg B$。
:::

## 最弱事前条件と相対完全性 {#logic:sec-hoare-completeness}

::: definition 最弱事前条件と表現性 {#logic:wlp keywords="weakest liberal precondition wlp(P, psi); expressive structure" index="最弱事前条件|さいじゃくじぜんじょうけん, 表現的（構造）|ひょうげんてきこうぞう"}
$\mathrm{wlp}(P,\psi)\defeq\{v:\langle P,v\rangle\Downarrow w$ となるすべての $w$ で $w\models\psi\}$ を、$P$ と $\psi$ の**最弱事前条件**という。すべての $P,\psi$ について $\llbracket\chi\rrbracket=\mathrm{wlp}(P,\psi)$ となる論理式 $\chi$ があるとき、$\mathfrak{A}$ は（その言語について）**表現的**であるという。
:::

::: lemma 最弱事前条件の性質 {#logic:wlp-props keywords="wlp is the weakest precondition; wlp of composition, conditional and while"}
1. $\mathfrak{A}\models\{\varphi\}P\{\psi\}\iff\llbracket\varphi\rrbracket\subset\mathrm{wlp}(P,\psi)$。
2. $\mathrm{wlp}(P;Q,\psi)=\{v:\langle P,v\rangle\Downarrow u$ となるすべての $u$ で $u\in\mathrm{wlp}(Q,\psi)\}$。
3. $W=\mathtt{while}\ B\ \mathtt{do}\ P\ \mathtt{od}$、$I\defeq\mathrm{wlp}(W,\psi)$ とすると、$I\cap\llbracket\neg B\rrbracket\subset\llbracket\psi\rrbracket$、かつ $I\cap\llbracket B\rrbracket\subset\{v:\langle P,v\rangle\Downarrow u$ となるすべての $u$ で $u\in I\}$。
:::

::: proof
1 は定義の言い換え。2：$\langle P;Q,v\rangle\Downarrow w\iff$ ある $u$ で $\langle P,v\rangle\Downarrow u$ かつ $\langle Q,u\rangle\Downarrow w$（規則 2 と、導出の最後の規則）。3：$v\in I$, $v\models\neg B$ なら $\langle W,v\rangle\Downarrow v$ なので $v\models\psi$。$v\in I$, $v\models B$, $\langle P,v\rangle\Downarrow u$ とし、$\langle W,u\rangle\Downarrow w$ なら規則 4 の後半で $\langle W,v\rangle\Downarrow w$、よって $w\models\psi$。したがって $u\in I$。
:::

::: theorem クックの相対完全性定理 {#logic:cook-completeness keywords="Cook's relative completeness theorem for Hoare logic: expressive structures" index="相対完全性|そうたいかんぜんせい, クックの相対完全性定理|くっくのそうたいかんぜんせいていり" refname="クックの相対完全性定理"}
$\mathfrak{A}$ が表現的ならば、すべての三つ組について $\mathfrak{A}\models\{\varphi\}P\{\psi\}\iff\vdash_{\mathfrak{A}}\{\varphi\}P\{\psi\}$。
:::

::: proof
⇐ は \ref{logic:hoare-soundness}。⇒ のため、各 $P,\psi$ について $\mathrm{wlp}(P,\psi)$ を表す論理式を一つ選んで $\omega_{P,\psi}$ とし（表現性。選び方は、論理式を一列に並べて最初のものとすればよい）、まず「すべての $\psi$ で $\vdash_{\mathfrak{A}}\{\omega_{P,\psi}\}P\{\psi\}$」を $P$ の構成についての帰納法で示す。最後に、妥当な $\{\varphi\}P\{\psi\}$ について 1 から $\mathfrak{A}\models\varphi\to\omega_{P,\psi}$ なので、帰結規則で $\vdash_{\mathfrak{A}}\{\varphi\}P\{\psi\}$。

**Step 1（skip・代入）.** 【主張：公理と帰結規則で導ける】 $\mathrm{wlp}(\mathtt{skip},\psi)=\llbracket\psi\rrbracket$ なので $\mathfrak{A}\models\omega\to\psi$、skip の公理と帰結規則。代入：$\mathrm{wlp}(x:=t,\psi)=\{v:v[x\mapsto t^{\mathfrak{A},v}]\models\psi\}$ で、\ref{logic:hoare-assignment-pre} からこれは代入の公理の事前条件の真理集合に等しい。よって $\mathfrak{A}\models\omega\to\exists y\,(y=t\wedge\psi[y/x])$、代入の公理と帰結規則。

**Step 2（合成・条件分岐）.** 【主張：帰納法の仮定と帰結規則で導ける】 合成：$\chi\defeq\omega_{Q,\psi}$ とすると帰納法の仮定で $\vdash\{\chi\}Q\{\psi\}$ と $\vdash\{\omega_{P,\chi}\}P\{\chi\}$。\ref{logic:wlp-props.2} で $\llbracket\omega_{P,\chi}\rrbracket=\mathrm{wlp}(P,\chi)=\mathrm{wlp}(P;Q,\psi)$ なので、合成規則と帰結規則。条件分岐：$\mathfrak{A}\models\omega\wedge B\to\omega_{P,\psi}$ と $\mathfrak{A}\models\omega\wedge\neg B\to\omega_{Q,\psi}$（$v\models B$ なら $\langle\mathtt{if}\cdots,v\rangle\Downarrow w\iff\langle P,v\rangle\Downarrow w$）なので、帰納法の仮定に帰結規則を使ってから条件分岐の規則。

**Step 3（while）.** 【主張：最弱事前条件そのものがループ不変条件になる】 $I\defeq\omega_{W,\psi}$ とする。帰納法の仮定で $\vdash\{\omega_{P,I}\}P\{I\}$。\ref{logic:wlp-props.3} の後半から $\mathfrak{A}\models I\wedge B\to\omega_{P,I}$ なので、帰結規則で $\vdash\{I\wedge B\}P\{I\}$。while 規則で $\vdash\{I\}W\{I\wedge\neg B\}$。\ref{logic:wlp-props.3} の前半から $\mathfrak{A}\models I\wedge\neg B\to\psi$ で、帰結規則で $\vdash\{I\}W\{\psi\}$。

::: hypcheck
- **表現性を使った場所**：Step 1〜3 で $\omega_{P,\psi}$ が論理式として存在することだけを使った。とくに Step 3 では、ループ不変条件 $I$ を「論理式で書ける」形で手に入れることが本質である。最弱事前条件が論理式で書けない構造もあり（\ref{logic:prob-hoare-not-expressive}）、そのような構造で妥当だが導けない三つ組がある例が知られている（Wand, *A new incompleteness result for Hoare's system*, J. ACM 25 (1978)）。このサイトではその例は扱わない。
- **帰結規則**：$\mathfrak{A}\models\cdots$ の形の前提を何度も使った。この体系で三つ組を「機械的に」導くには $\mathrm{Th}(\mathfrak{A})$ を判定できる必要がある。
:::
:::

::: intuition
**最弱事前条件は「プログラムを逆向きに読んだ論理式」である。** $\mathrm{wlp}(P,\psi)$ は、ゴール $\psi$ から出発してプログラムを後ろから読み、「ここでは何が成り立っていればよいか」を計算したものである。代入では「$x$ を $t$ に変えた後で $\psi$」、合成では二段階の逆読み、ループでは「何周しても、止まったら $\psi$」となる。相対完全性の証明は、この逆読みがそのまま証明になることを言っている。ループの不変条件を探す難しさは、最弱事前条件を論理式で書く難しさ（表現性）に集約される。

**高い視点：述語変換子と様相。** $\mathrm{wlp}(P,\cdot)$ は状態の集合の上の写像で、PDL の $[\alpha]$ の意味 $[R_{\alpha}]$（\ref{logic:pdl-to-mu-correct}）と同じ形をしている：$\mathrm{wlp}(P,\psi)=[R_{P}]\llbracket\psi\rrbracket$（$R_{P}$ は $\Downarrow$ の関係）。三つ組 $\{\varphi\}P\{\psi\}$ は様相論理式 $\varphi\to[P]\psi$ にあたり、while 規則は PDL の帰納の公理、wlp の while の性質は $[\alpha^{\ast}]$ の不動点の性質にあたる。この対応は次のページ以降でより正確に述べる（\see[全正当性と動的論理]{logic:page-hoare-dynamic}）。
:::

## 問題 {#logic:sec-hoare-problems}

::: problem {#logic:prob-hoare-sum}
自然数の標準構造で、$\{\top\}\ s:=0;\ i:=0;\ \mathtt{while}\ i<n\ \mathtt{do}\ i:=i+1;\ s:=s+i\ \mathtt{od}\ \{2s=n(n+1)\}$ を導け（$\mathcal{N}$ は自然数の標準構造、$2s$ は $s+s$、$n(n+1)$ は $n\times S(n)$、$i\le n$ は $i<n\vee i=n$ の略記。ループ不変条件として $2s=i(i+1)\wedge i\le n$ を使え）。
:::

::: solution
$I\defeq2s=i(i+1)\wedge i\le n$。本体 $i:=i+1;\ s:=s+i$ について、代入の公理を後ろから二回使うと、事前条件は（\ref{logic:hoare-assignment-pre} で読み替えて）「$2(s+i+1)=(i+1)(i+2)\wedge i+1\le n$」と $\mathcal{N}$ で同値。$\mathcal{N}\models I\wedge i<n\to$ この論理式（$2s=i(i+1)$ なら $2(s+i+1)=i(i+1)+2(i+1)=(i+1)(i+2)$、$i<n$ なら $i+1\le n$）なので、帰結規則で $\vdash\{I\wedge i<n\}$ 本体 $\{I\}$。while 規則で $\vdash\{I\}$ ループ $\{I\wedge\neg(i<n)\}$。$\mathcal{N}\models I\wedge\neg(i<n)\to2s=n(n+1)$（$i\le n$ かつ $i\ge n$ で $i=n$）。初期化は代入の公理二回で事前条件が $2\cdot0=0\cdot1\wedge0\le n$ と同値になり、$\mathcal{N}\models\top\to$ これ（$0\le n$ は $0<n\vee0=n$ の略記で真）。合成規則と帰結規則でまとめる。
:::

::: problem {#logic:prob-hoare-not-total}
$\vdash_{\mathfrak{A}}\{\top\}\ \mathtt{while}\ \top\ \mathtt{do}\ \mathtt{skip}\ \mathtt{od}\ \{\bot\}$ を導き、この三つ組が妥当である理由を意味論で説明せよ。
:::

::: solution
ループ不変条件 $\top$：skip の公理 $\{\top\}\mathtt{skip}\{\top\}$ と帰結規則（$\mathfrak{A}\models\top\wedge\top\to\top$）で $\{\top\wedge\top\}\mathtt{skip}\{\top\}$。while 規則で $\{\top\}W\{\top\wedge\neg\top\}$、帰結規則で $\{\bot\}$。意味論：$\langle W,v\rangle\Downarrow w$ となる $w$ はない（最短の導出をとると、規則 4 の後半で同じ形のより短い導出が要り矛盾）ので、部分正当性は自明に成り立つ。部分正当性は停止を保証しない。
:::

::: problem {#logic:prob-hoare-not-expressive}
表現的でない構造の例として、言語 $\{0,S\}$（$S$ は後者関数）と構造 $(\mathbb{N},0,S)$ を考える。この構造で量化子のない論理式と while プログラムを使って、$\mathrm{wlp}$ がこの言語の論理式で書けない例を挙げよ（$(\mathbb{N},0,S)$ で定義できる $\mathbb{N}$ の部分集合は有限集合か補有限集合に限られる、という事実を使ってよい）。
:::

::: solution
$P\defeq y:=0;\ \mathtt{while}\ \neg(y=x)\ \mathtt{do}\ y:=S(S(y))\ \mathtt{od}$、$\psi\defeq\bot$ とする。$x$ の値が偶数 $2k$ なら $k$ 周で止まり、奇数なら $y$ は $x$ を飛び越して止まらない。よって $\mathrm{wlp}(P,\bot)=\{v:v(x)$ は奇数$\}$（止まらない状態だけ）。これを表す論理式 $\chi$ があれば、$x$ 以外の自由変数に $0$ を代入した論理式は $x$ だけで奇数全体を定義し、有限でも補有限でもなく、前提の事実に反する。（前提の事実は量化子消去で示せることが知られている。このサイトでは示していない。）
:::
