# μ 計算の近似列・双模倣不変性・翻訳 {#logic:page-mu-approximants keywords="approximants of fixed points, ordinal stages, bisimulation invariance of the mu-calculus, translation of PDL and CTL into the mu-calculus"}

前のページ（\ref{logic:page-mu-calculus}）では、$\mu X.A$ の意味を前不動点の共通部分として「上から」定めた。このページではまず、空集合から写像をくり返し（極限では和をとって）適用する**近似列** $\mu^{\alpha}$ で最小不動点を「下から」作れることを、順序数を使って示す。モデルが有限なら $\lvert S\rvert$ 段で止まるが、一般には $\omega$ 段では足りない例がある。次に、近似列を使って μ 計算の論理式が**双模倣で不変**であることを示す。最後に、PDL と CTL の論理式を μ 計算に**翻訳**し、意味が保たれることを証明する。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。

## 記法と定義の確認 {#logic:sec-mua-notation}

::: notation
- μ 計算の論理式・付値・真理集合 $\lVert A\rVert_{V}$・代入・展開則は \ref{logic:page-mu-calculus} のとおり。
- 順序数・超限再帰（\ref{set:transfinite-recursion}）と、すべての順序数の集合が存在しないこと（\ref{set:burali-forti}）を使う。
- 関係 $R\subset S\times S$ と $Y\subset S$ について $\langle R\rangle Y\defeq\{s:sRt\in Y\text{ となる }t\text{ がある}\}$、$[R]Y\defeq\{s:sRt\text{ ならば }t\in Y\}$。
- **公理系**：$\ZF$。選択公理は使わない（\ref{logic:sec-mua-ctl} の $\mathbf{A}(C\,\mathbf{U}\,D)$ だけは、CTL の意味論の約束どおり DC を使う）。
:::

## 近似列 {#logic:sec-mua-approximants}

::: definition 近似列 {#logic:mu-approximant keywords="ordinal approximants mu^alpha and nu^alpha of fixed points" index="近似列（不動点）|きんじれつふどうてん"}
$f\colon\mathcal{P}(S)\to\mathcal{P}(S)$ を単調とする。順序数 $\alpha$ についての超限再帰で
$$
\mu^{0}\defeq\varnothing,\quad\mu^{\alpha+1}\defeq f(\mu^{\alpha}),\quad\mu^{\lambda}\defeq\bigcup_{\beta<\lambda}\mu^{\beta}\ (\lambda\text{ は極限}),
$$
$$
\nu^{0}\defeq S,\quad\nu^{\alpha+1}\defeq f(\nu^{\alpha}),\quad\nu^{\lambda}\defeq\bigcap_{\beta<\lambda}\nu^{\beta}
$$
と定め、**近似列**という。論理式 $\mu X.A$（または $\nu X.A$）と付値 $V$ については $f(T)=\lVert A\rVert_{V[X\mapsto T]}$ の近似列を考える。
:::

::: theorem 近似列は不動点に達する {#logic:mu-approximant-theorem keywords="approximants are increasing, bounded by the least fixed point, and stabilize at the least fixed point; finite case stabilizes within |S| steps" index="近似列の定理|きんじれつのていり" refname="近似列の定理"}
$f$ を単調とする。
1. $\beta\le\alpha$ なら $\mu^{\beta}\subset\mu^{\alpha}\subset\mathrm{lfp}(f)$、$\nu^{\beta}\supset\nu^{\alpha}\supset\mathrm{gfp}(f)$。
2. ある順序数 $\alpha$ で $\mu^{\alpha}=\mu^{\alpha+1}$ となり、そのとき $\mu^{\alpha}=\mathrm{lfp}(f)$。$\nu$ についても同様。
3. $S$ が有限なら、$\alpha=\lvert S\rvert$ でとれる。
:::

::: proof
**Step 1.** 【主張：近似列は単調で、最小不動点を超えない】 $\alpha$ についての超限帰納法で、「すべての $\beta\le\alpha$ で $\mu^{\beta}\subset\mu^{\alpha}$」と「$\mu^{\alpha}\subset\mathrm{lfp}(f)$」を示す。$0$ は自明。後者：$\mu^{\alpha}\subset\mathrm{lfp}(f)$ なら $\mu^{\alpha+1}=f(\mu^{\alpha})\subset f(\mathrm{lfp}(f))=\mathrm{lfp}(f)$。$\mu^{\alpha}\subset\mu^{\alpha+1}$ は、$\alpha=0$ なら自明、$\alpha=\gamma+1$ なら $\mu^{\gamma}\subset\mu^{\alpha}$ に $f$ をかけて、$\alpha$ が極限なら各 $\beta<\alpha$ で $\mu^{\beta}\subset\mu^{\beta+1}\subset\mu^{\alpha+1}$（$\mu^{\beta}\subset\mu^{\alpha}$ に $f$ をかけて $\mu^{\beta+1}\subset\mu^{\alpha+1}$）から。極限では和なので両方とも保たれる。$\nu$ は包含を逆にして同じ。

**Step 2.** 【主張：どこかで止まる】 止まらない、すなわちすべての $\alpha$ で $\mu^{\alpha}\subsetneq\mu^{\alpha+1}$ とする。すると $\alpha<\beta$ なら $\mu^{\alpha}\subsetneq\mu^{\alpha+1}\subset\mu^{\beta}$ で、$\alpha\mapsto\mu^{\alpha}$ は単射。$\mathcal{X}\defeq\{T\in\mathcal{P}(S):$ ある順序数 $\alpha$ で $T=\mu^{\alpha}\}$ は分出公理で集合で、各 $T\in\mathcal{X}$ にただ一つの $\alpha$ を対応させる写像の像は、置換公理で集合になり、すべての順序数を含む。これは \ref{set:burali-forti} に反する。

**Step 3.** 【主張：止まったところが最小不動点】 $\mu^{\alpha}=\mu^{\alpha+1}=f(\mu^{\alpha})$ なので $\mu^{\alpha}$ は不動点で、\ref{logic:mu-knaster-tarski.1} から $\mathrm{lfp}(f)\subset\mu^{\alpha}$。Step 1 と合わせて等号。

**Step 4.** 【主張：有限なら $\lvert S\rvert$ 段】 自然数の段では、真に増えるたびに元が 1 個以上増えるので、$\mu^{0}\subset\cdots\subset\mu^{\lvert S\rvert}$ のどこかで等号になる（\ref{logic:finite-fixpoint} と同じ）。
:::

::: example ω 段では足りない例 {#logic:mu-approximant-omega keywords="mu X.[a]X needs omega+1 approximation stages on an infinitely branching model"}
状態の集合を $S\defeq\{r\}\cup\{(n,k):0\le k\le n\}$ とし、$R_{a}\defeq\{(r,(n,n)):n\in\mathbb{N}\}\cup\{((n,k),(n,k-1)):1\le k\le n\}$ とする（根 $r$ から長さ $n$ の鎖が各 $n$ について一本ずつ出る）。$A\defeq\mu X.[a]X$、$f(T)=[R_{a}]T$ とする。$k$ についての帰納法で $\mu^{k+1}=\{(n,j):j\le k\}$（$(n,j)$ からは $j$ 歩で行き止まり）で、$r$ は $\mu^{k+1}$ に入らない（後続 $(k+1,k+1)\notin\mu^{k+1}$）。$\mu^{\omega}=\bigcup_{k}\mu^{k}=S\setminus\{r\}$、$\mu^{\omega+1}=[R_{a}]\mu^{\omega}=S$。よって最小不動点に達するのは $\omega+1$ 段目である。（$\lVert\mu X.[a]X\rVert$ は、無限の $a$ の道が出ない状態の集合である。）
:::

## 双模倣不変性 {#logic:sec-mua-bisimulation}

::: definition ラベル付き遷移系の双模倣 {#logic:lts-bisimulation keywords="bisimulation between labelled transition systems compatible with valuations" index="双模倣（ラベル付き遷移系）|そうもほうらべるつきせんいけい"}
ラベル付き遷移系 $\mathcal{M}=(S,\{R_{a}\})$, $\mathcal{M}'=(S',\{R'_{a}\})$ の間の関係 $Z\subset S\times S'$ が**双模倣**であるとは、$sZs'$ となるすべての組とすべての $a$ について、\ref{logic:bisimulation} の行きの条件と戻りの条件（$R$ を $R_{a}$, $R'_{a}$ として）が成り立つことをいう。集合 $T\subset S$, $T'\subset S'$ が **$Z$ と両立する**とは、$sZs'$ なら $s\in T\iff s'\in T'$ となることをいい、付値 $V,V'$ が $Z$ と両立するとは、すべての変数 $X$ で $V(X),V'(X)$ が $Z$ と両立することをいう。
:::

::: theorem μ 計算の双模倣不変性 {#logic:mu-bisimulation-invariance keywords="mu-calculus formulas are invariant under bisimulation" index="双模倣不変性（μ 計算）|そうもほうふへんせいみゅーけいさん" refname="μ 計算の双模倣不変性"}
$Z$ を双模倣、$V,V'$ を $Z$ と両立する付値とする。すべての論理式 $A$ について、$\lVert A\rVert_{V}$ と $\lVert A\rVert'_{V'}$ は $Z$ と両立する。
:::

::: proof
$A$ の構成についての帰納法で、すべての両立する付値の組について同時に示す。変数は仮定、$\neg$ と $\wedge$ は両立が補集合と共通部分で保たれることから。

**Step 1（$\langle a\rangle C$）.** 【主張：行きと戻りの条件で両立が保たれる】 $sZs'$ で $s\in\lVert\langle a\rangle C\rVert_{V}$ とし、$sR_{a}t$, $t\in\lVert C\rVert_{V}$ をとる。行きの条件で $s'R'_{a}t'$, $tZt'$ となる $t'$ があり、帰納法の仮定で $t'\in\lVert C\rVert'_{V'}$、よって $s'\in\lVert\langle a\rangle C\rVert'_{V'}$。逆は戻りの条件。

**Step 2（$\mu X.C$）.** 【主張：近似列の各段が両立する】 $f(T)=\lVert C\rVert_{V[X\mapsto T]}$, $f'(T')=\lVert C\rVert'_{V'[X\mapsto T']}$ の近似列を $\mu^{\alpha}$, $\mu'^{\alpha}$ とし、$\alpha$ についての超限帰納法で $\mu^{\alpha}$ と $\mu'^{\alpha}$ が両立することを示す。$0$：どちらも空。後続：$V[X\mapsto\mu^{\alpha}]$ と $V'[X\mapsto\mu'^{\alpha}]$ は両立するので、帰納法の仮定（$C$ について）で $f(\mu^{\alpha})$ と $f'(\mu'^{\alpha})$ は両立。極限：両立する集合の族の和は両立する。

\ref{logic:mu-approximant-theorem.2} で $f$, $f'$ の近似列が止まる段 $\alpha_{1}$, $\alpha_{2}$ をとり、$\alpha\defeq\max\{\alpha_{1},\alpha_{2}\}$ とすると（止まった後は一定なので）$\mu^{\alpha}=\mathrm{lfp}(f)=\lVert\mu X.C\rVert_{V}$、$\mu'^{\alpha}=\lVert\mu X.C\rVert'_{V'}$ で、これらは両立する。

::: hypcheck
- **近似列を使った理由**：$\lVert\mu X.C\rVert_{V}$ を前不動点の共通部分のまま扱うと、$\mathcal{M}$ の前不動点と $\mathcal{M}'$ の前不動点を対応させる必要があるが、両立する前不動点の組がうまくとれるとは限らない。近似列は両方のモデルで「同じ手順」で作るので、段ごとに両立を運べる。
- 正値性（単調性）は、近似列が最小不動点に達すること（\ref{logic:mu-approximant-theorem}）で使った。
:::
:::

::: corollary {#logic:mu-not-definable-loop keywords="having a self-loop is not definable in the mu-calculus"}
「$sR_{a}s$」（自分自身への $a$ の矢がある）という性質を表す論理式 $A$（すべてのモデルと付値で $\lVert A\rVert_{V}=\{s:sR_{a}s\}$）はない。
:::

::: proof
$\mathcal{M}$：一点 $\{0\}$、$R_{a}=\{(0,0)\}$。$\mathcal{M}'$：$\mathbb{N}$、$R'_{a}=\{(n,n+1)\}$。ほかの動作の関係は空、付値はすべての変数を空集合とする。$Z\defeq\{0\}\times\mathbb{N}$ は双模倣で、付値は両立する（\ref{logic:page-bisimulation} の例と同じ）。$A$ があれば、\ref{logic:mu-bisimulation-invariance} で $0\in\lVert A\rVert\iff 0\in\lVert A\rVert'$ だが、左は真、右は偽。
:::

## PDL の翻訳 {#logic:sec-mua-pdl}

以下、PDL の原子プログラムを動作、PDL の命題変数を μ 計算の変数とみなす。PDL のモデル $(W,\{R_{a}\},V_{0})$ には、ラベル付き遷移系 $(W,\{R_{a}\})$ と付値 $V(p)\defeq\{w:(w,p)\in V_{0}\}$（$p$ が命題変数のとき。ほかの変数は任意）が対応する。プログラム $\alpha$ の中のテストに現れる命題変数の集合を $\mathrm{PV}(\alpha)$ とする。

::: definition PDL から μ 計算への翻訳 {#logic:pdl-to-mu keywords="translation of PDL into the modal mu-calculus: [alpha*]A as nu X.(A and [alpha]X)" index="PDL の翻訳（μ 計算）|ぴーでぃーえるのほんやくみゅーけいさん"}
PDL の論理式 $A$ に μ 計算の論理式 $t(A)$ を、プログラム $\alpha$ と μ 計算の論理式 $F$ に論理式 $T(\alpha,F)$ を、構成についての同時の再帰で対応させる。
$$
t(p)=p,\quad t(\bot)=\bot,\quad t(A\to B)=t(A)\to t(B),\quad t([\alpha]A)=T(\alpha,t(A)),
$$
$$
T(a,F)=[a]F,\quad T(\alpha;\beta,F)=T(\alpha,T(\beta,F)),\quad T(\alpha\cup\beta,F)=T(\alpha,F)\wedge T(\beta,F),\quad T(B?,F)=t(B)\to F,
$$
$$
T(\alpha^{\ast},F)=\nu X.(F\wedge T(\alpha,X))\quad(X\text{ は }\mathrm{FV}(F)\cup\mathrm{PV}(\alpha)\text{ に対する新しい変数}).
$$
:::

::: lemma 翻訳は論理式で、$F$ について正 {#logic:pdl-to-mu-wellformed keywords="the translation is well formed and positive in F"}
1. $\mathrm{FV}(t(A))$ は $A$ の命題変数の集合に含まれ、$\mathrm{FV}(T(\alpha,F))\subset\mathrm{FV}(F)\cup\mathrm{PV}(\alpha)$。
2. 変数 $Y\notin\mathrm{PV}(\alpha)$ について、$\mathrm{pos}(Y,F)$ なら $\mathrm{pos}(Y,T(\alpha,F))$。
3. $t(A)$ と $T(\alpha,F)$（$F$ が論理式のとき）は論理式である。
:::

::: proof
三つとも $\alpha$, $A$ の構成についての同時の帰納法。$\nu$ については、$Y\ne X$ のとき $\mathrm{pos}(Y,E)\Rightarrow\mathrm{pos}(Y,\nu X.E)$ と $\mathrm{FV}(\nu X.E)\subset\mathrm{FV}(E)\setminus\{X\}$ を使う（$\nu X.E=\neg\mu X.\neg(E[\neg X/X])$ に \ref{logic:mu-substitution-syntax} の 2・3 を $W=Y$, $Y\notin\mathrm{FV}(\neg X)$ で使う）。

**Step 1.** 【主張：$\to$ と $[a]$ の形で極性が正しく運ばれる】 $t(B)\to F$ は略記を展開すると $\neg(\neg\neg t(B)\wedge\neg F)$ で、$F$ の上の否定は 2 個。また$Y\notin\mathrm{PV}(\alpha)\supset$ $B$ の命題変数なので $Y\notin\mathrm{FV}(t(B))$。$[a]F=\neg\langle a\rangle\neg F$ も $F$ の上の否定は 2 個。合成と選択は帰納法の仮定。

**Step 2.** 【主張：反復の形が論理式になる】 $X\notin\mathrm{PV}(\alpha)$ なので 2（帰納法の仮定）で $\mathrm{pos}(X,T(\alpha,X))$、$X\notin\mathrm{FV}(F)$ なので $\mathrm{pos}(X,F\wedge T(\alpha,X))$。よって $\nu X.(\cdots)$ が定義され論理式（\ref{logic:mu-unfolding.1}）。$Y\ne X$ についての 2 は上の注意から。
:::

::: theorem PDL の翻訳の正しさ {#logic:pdl-to-mu-correct keywords="correctness of the translation of PDL into the mu-calculus" index="翻訳の正しさ（PDL から μ 計算）|ほんやくのただしさぴーでぃーえるからみゅーけいさん" refname="PDL の μ 計算への翻訳の正しさ"}
PDL のモデルと対応する付値 $V$ について、
1. すべての PDL の論理式 $A$ で $\lVert t(A)\rVert_{V}=\{w:w\models A\}$。
2. すべてのプログラム $\alpha$、論理式 $F$、$\mathrm{PV}(\alpha)$ の上で $V$ と一致する付値 $U$ について $\lVert T(\alpha,F)\rVert_{U}=[R_{\alpha}]\lVert F\rVert_{U}$。
:::

::: proof
1 と 2 を構成についての同時の帰納法で示す。1 の $[\alpha]A$ は 2（$U=V$）と 1 の $A$ から。2 の $B?$ は 1 の $B$ を使う（$U$ と $V$ は $B$ の命題変数の上で一致するので一致の補題で $\lVert t(B)\rVert_{U}=\lVert t(B)\rVert_{V}$）。

**Step 1.** 【主張：原子・合成・選択・テストで 2 が成り立つ】 $[R_{a}]$ は $[a]$ の意味そのもの。$[R_{\alpha}\circ R_{\beta}]Y=[R_{\alpha}][R_{\beta}]Y$、$[R_{\alpha}\cup R_{\beta}]Y=[R_{\alpha}]Y\cap[R_{\beta}]Y$、$[R_{B?}]Y=(W\setminus\{w:w\models B\})\cup Y$ は \ref{logic:pdl-valid} の 2〜4 の証明と同じ集合の計算。

**Step 2.** 【主張：反復で 2 が成り立つ】 $Y\defeq\lVert F\rVert_{U}$、$g(T)\defeq\lVert F\wedge T(\alpha,X)\rVert_{U[X\mapsto T]}$ とする。$X\notin\mathrm{FV}(F)$ と一致の補題、$U[X\mapsto T]$ も $\mathrm{PV}(\alpha)$ の上で $V$ と一致すること（$X\notin\mathrm{PV}(\alpha)$）と帰納法の仮定から $g(T)=Y\cap[R_{\alpha}]T$。\ref{logic:mu-unfolding.1} で $\lVert T(\alpha^{\ast},F)\rVert_{U}=\mathrm{gfp}(g)$。$P\defeq[R_{\alpha^{\ast}}]Y$ とすると、$P\subset g(P)$（$0$ 歩で $Y$、$\alpha$ の一歩の後も $\alpha^{\ast}$ の後続は $\alpha^{\ast}$ の後続）、逆に $T\subset g(T)$ なら歩数についての帰納法で $T\subset P$（\ref{logic:prob-mu-nu-pdl} と同じ）。\ref{logic:mu-knaster-tarski.2} で $\mathrm{gfp}(g)=P$。
:::

## CTL の翻訳 {#logic:sec-mua-ctl}

CTL のモデル $(S,R,V_{0})$ には、動作 $a$ ただ一つのラベル付き遷移系 $(S,\{R_{a}\})$（$R_{a}=R$）と、PDL の場合と同じ付値 $V$ が対応する。

::: definition CTL から μ 計算への翻訳 {#logic:ctl-to-mu keywords="translation of CTL into the mu-calculus: EU and AU as least fixed points" index="CTL の翻訳（μ 計算）|しーてぃーえるのほんやくみゅーけいさん"}
$t(p)=p$、$t(\bot)=\bot$、$t(A\to B)=t(A)\to t(B)$、$t(\mathbf{AX}A)=[a]t(A)$、
$$
t(\mathbf{E}(A\,\mathbf{U}\,B))=\mu X.(t(B)\vee(t(A)\wedge\langle a\rangle X)),\qquad t(\mathbf{A}(A\,\mathbf{U}\,B))=\mu X.(t(B)\vee(t(A)\wedge[a]X)),
$$
ただし $X$ は $\mathrm{FV}(t(A))\cup\mathrm{FV}(t(B))$ に対する新しい変数。
:::

::: theorem CTL の翻訳の正しさ {#logic:ctl-to-mu-correct keywords="correctness of the translation of CTL into the mu-calculus" refname="CTL の μ 計算への翻訳の正しさ"}
$t(A)$ は論理式で、CTL のモデルと対応する付値 $V$ について $\lVert t(A)\rVert_{V}=\{s:s\models A\}$。
:::

::: proof
$X$ は $t(A),t(B)$ に自由に現れないので、$X$ の上の否定は $\vee$ と $[a]$ の展開による偶数個で、論理式になる。真理集合は $A$ の構成についての帰納法。$\mathbf{AX}$ は定義どおり。

**Step 1.** 【主張：$\mathbf{EU}$, $\mathbf{AU}$ の集合はそれぞれの写像の最小不動点】 $X_{A}\defeq\{s:s\models A\}$ などとおくと、帰納法の仮定と一致の補題で、写像は $\tau_{\mathbf{E}}(T)=X_{B}\cup(X_{A}\cap\langle R\rangle T)$、$\tau_{\mathbf{A}}(T)=X_{B}\cup(X_{A}\cap[R]T)$。$\{s:s\models\mathbf{E}(A\,\mathbf{U}\,B)\}$ は \ref{logic:ctl-valid.2} で $\tau_{\mathbf{E}}$ の不動点で、\ref{logic:ctl-valid.3} の証明（列を後ろからたどる）は「$C$ が真な状態の集合」を任意の前不動点 $T$ に置き換えても通るので、すべての前不動点に含まれる。$\mathbf{A}$ も \ref{logic:ctl-valid.2}・\ref{logic:ctl-valid.4} で同じ（\ref{logic:ctl-valid.4} の証明は DC を使う）。\ref{logic:mu-monotone.3} で $\lVert\mu X.(\cdots)\rVert_{V}$ は最小不動点なので一致する。
:::

::: remark
1. 翻訳 $T(\alpha^{\ast},F)$ と $t(\mathbf{EU})$, $t(\mathbf{AU})$ はどれも不動点を一つずつしか使わず、$\nu$ の中で $\mu$ を（同じ変数を通じて）使うような**交代**はない。CTL* や、「ある経路で $p$ が無限回真」のような性質は交代のある論理式で書ける（例えば $\nu X.\mu Y.(\langle a\rangle(p\wedge X)\vee\langle a\rangle Y)$）ことが知られているが、このサイトではこの例の正しさは確かめていない。
2. 逆向き（μ 計算の論理式を PDL や CTL に翻訳すること）は一般にはできないことが知られている（例えば「無限の $a$ の道が出ない」$\mu X.[a]X$ は PDL で書けない。Harel–Kozen–Tiuryn『Dynamic Logic』を参照）。このサイトでは証明していない。
:::

::: intuition
**近似列は「何手で決着がつくか」の記録である。** $s\in\mu^{\alpha}$ の最小の $\alpha$ は、$s$ で $\mu X.A$ が成り立つことを示すのに要る「展開の回数」で、有限のモデルなら自然数だが、無限に分岐するモデルでは \ref{logic:mu-approximant-omega} のように「どの有限回でも足りないが、どの枝も有限で終わる」ために $\omega$ 回を超える。これは整礎な木の高さを順序数で測るのと同じ現象である。

**高い視点：双模倣不変性と van Benthem–Rosen 型の定理。** 双模倣は「外から観測できる振る舞いが同じ」ことで、μ 計算の論理式は振る舞いしか見ない。逆に、双模倣で不変な単項二階論理の性質はちょうど μ 計算で書ける性質である、という Janin–Walukiewicz (1996) の定理が知られている（このサイトでは証明していない）。様相論理と一階述語論理の関係（van Benthem の定理）の不動点版にあたる。
:::

## 問題 {#logic:sec-mua-problems}

::: problem {#logic:prob-mua-approximants-ef}
$f(T)=V(p)\cup\langle R_{a}\rangle T$（$\mu X.(p\vee\langle a\rangle X)$ の写像）について、近似列 $\mu^{k}$（$k\in\mathbb{N}$）が「$k-1$ 歩以内で $V(p)$ に着ける状態の集合」であることを示し、$\mu^{\omega}$ が最小不動点であることを示せ。
:::

::: solution
$k$ についての帰納法。$\mu^{0}=\varnothing$。$\mu^{k}$ が「$k-1$ 歩以内」なら、$\mu^{k+1}=V(p)\cup\langle R_{a}\rangle\mu^{k}$ は「0 歩、または一歩進んで $k-1$ 歩以内」で「$k$ 歩以内」。$\mu^{\omega}=\bigcup_{k}\mu^{k}$ は「有限歩で着ける」集合 $E$ で、$f(E)\subset E$（\ref{logic:mu-examples} の 1）なので $\mu^{\omega+1}=f(\mu^{\omega})\subset\mu^{\omega}$、単調性と合わせて $\mu^{\omega}=\mu^{\omega+1}$、\ref{logic:mu-approximant-theorem.2} で最小不動点。$\langle R_{a}\rangle$ は和と可換なので、分岐が無限でも $\omega$ 段で足りる（\ref{logic:mu-approximant-omega} との違いは、$[R_{a}]$ が和と可換でないこと）。
:::

::: problem {#logic:prob-mua-pdl-example}
PDL の $[(a;a)^{\ast}]p$ の翻訳を書き下し、それが「$a$ を偶数回たどって着く状態ではいつも $p$」を表すことを確かめよ。
:::

::: solution
$T(a;a,F)=T(a,T(a,F))=[a][a]F$ なので、$t([(a;a)^{\ast}]p)=\nu X.(p\wedge[a][a]X)$（$X$ は $p$ と異なる新しい変数）。\ref{logic:pdl-to-mu-correct.2} で、その意味は $[R_{(a;a)^{\ast}}]V(p)$、すなわち $R_{a}$ を $2n$ 回（$n\ge0$）たどって着く状態がすべて $V(p)$ に属する状態の集合。
:::

::: problem {#logic:prob-mua-unravelling}
\ref{logic:unravelling} の木への展開（動作が一つの場合）について、μ 計算の論理式の真理が展開の根ともとの状態で一致することを示せ。
:::

::: solution
\ref{logic:unravelling-bisimilar} で、展開の頂点 $(w_{0},\dots,w_{n})$ を最後の状態 $w_{n}$ に対応させる関係は双模倣（命題変数の条件も含む）。付値を「展開の頂点 $\mapsto$ 最後の状態の付値」で引き戻すと両立する。\ref{logic:mu-bisimulation-invariance} から、根 $(w)$ と $w$ で同じ論理式が真になる。
:::
