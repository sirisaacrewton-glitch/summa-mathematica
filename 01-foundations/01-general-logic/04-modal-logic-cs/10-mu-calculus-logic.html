# μ 計算の公理系と決定可能性 {#logic:page-mu-calculus-logic keywords="Kozen axiomatization of the modal mu-calculus, fixpoint axiom, Park induction rule, soundness, derived rules, completeness (Walukiewicz), finite model property, decidability, alternation"}

様相 μ 計算（\ref{logic:page-mu-calculus}）の**コーゼンの公理系**は、様相論理の公理に、最小不動点についての二つの原理――「$\mu X.A$ は前不動点である」（不動点公理）と「どの前不動点よりも小さい」（**パークの帰納規則**）――を加えたものである。このページでは、この公理系が**健全**であることを、前のページの代入補題を使って示す。次に、変数 $X$ が不動点演算子の内側に自由に現れない論理式について、単調性・展開の逆向き・$\nu$ の不動点公理と余帰納規則を導き、PDL の反復の公理が導けることを確かめる。一方、コーゼンの公理系の**完全性**（Walukiewicz）、**有限モデル性**（Kozen）、\term[充足可能]{logic:mu-semantics}性の **EXPTIME 完全性**は、このサイトでは証明せずに事実として述べる。証明できる範囲として、有限のモデルでの真理が計算できることを示し、これらの事実から決定可能性が従うことを導く。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。公理系は Kozen, *Results on the propositional μ-calculus*, Theoret. Comput. Sci. 27 (1983) による（ここでは ⟨a⟩ についての公理を単調性の規則の形にした）。

## 記法と定義の確認 {#logic:sec-mul-notation}

::: notation
- μ 計算の論理式・自由変数・正値性・捕獲を避ける代入 $A[B/X]$・意味論・代入補題・α 同値・$\nu$・展開則は \ref{logic:page-mu-calculus} のとおり。近似列は \ref{logic:page-mu-approximants} のとおり。
- 妥当・充足可能は \ref{logic:mu-semantics} のとおり。
- 「原子的な形」：変数、$\langle a\rangle B$、$\mu Y.B$ の形の論理式。**μ 計算の恒真式**とは、原子的な形の論理式を命題変数とみなして（$\neg,\wedge$ で組み立てた）命題論理の恒真式になるものをいう（\ref{logic:pdl-tautology} と同じ考え方）。
- **公理系**：$\ZF$。選択公理は使わない（無限のモデルを扱う問題 \ref{logic:prob-kozen-nu-diamond} の解答の一か所だけ、従属選択公理 DC を使う）。
:::

## 公理系と健全性 {#logic:sec-mul-axioms}

::: definition コーゼンの公理系 {#logic:kozen-axioms keywords="Kozen's axiom system: tautologies, diamond axioms, fixpoint axiom, alpha axiom, modus ponens, monotonicity rule, Park induction rule" index="コーゼンの公理系|こーぜんのこうりけい, パークの帰納規則|ぱーくのきのうきそく"}
次の論理式を**公理**とする（$A,B$ は論理式、$\mathrm{pos}(X,A)$）。
1. μ 計算の恒真式。
2. $\langle a\rangle(A\vee B)\to\langle a\rangle A\vee\langle a\rangle B$ と $\neg\langle a\rangle\bot$。
3. （**不動点公理**）$A[\mu X.A/X]\to\mu X.A$。
4. （α 公理）$A\leftrightarrow A'$（$A$ と $A'$ が α 同値な論理式）。

推論規則は次の三つとする。
- モーダスポネンス：$A$ と $A\to B$ から $B$。
- ⟨a⟩ の単調性：$A\to B$ から $\langle a\rangle A\to\langle a\rangle B$。
- **パークの帰納規則**：$A[B/X]\to B$ から $\mu X.A\to B$（$\mathrm{pos}(X,A)$, $B$ は論理式）。

定理・$\vdash$ は \ref{logic:pdl-axioms} と同じく定める。
:::

::: theorem コーゼンの公理系の健全性 {#logic:kozen-soundness keywords="soundness of Kozen's axiomatization" index="健全性（μ 計算）|けんぜんせいみゅーけいさん" refname="コーゼンの公理系の健全性"}
$\vdash A$ ならば $A$ は妥当である。
:::

::: proof
導出の長さについての帰納法。各公理が妥当で、各推論規則が妥当性を保つことを示す。

**Step 1.** 【主張：公理 1・2・4 は妥当】 公理 1 について。状態 $s$ と付値 $V$ を固定し、原子的な形 $P$ に $s\in\lVert P\rVert_{V}$ かどうかを対応させる命題的付値をとる。$\neg,\wedge$ の真理集合の定義から、その延長はすべての論理式で「$s\in\lVert\cdot\rVert_{V}$ かどうか」に一致する（\ref{logic:pdl-soundness} の Step 1 と同じ）。恒真式はこの付値で真なので、$s$ はその真理集合に属する。公理 2 の一つ目は $\langle a\rangle$ の意味の定義から従う（$sR_{a}t$, $t\in\lVert A\vee B\rVert_{V}$ なら $t$ は $\lVert A\rVert_{V}$ か $\lVert B\rVert_{V}$ に属する）。二つ目は、$\bot=\mu v_{0}.v_{0}$ で恒等写像の前不動点 $\varnothing$ が \ref{logic:mu-semantics} の共通部分に入るので $\lVert\bot\rVert_{V}=\varnothing$ であり、したがって $\lVert\langle a\rangle\bot\rVert_{V}=\varnothing$ となることから従う。公理 4 は \ref{logic:mu-alpha-invariance} から従う。

**Step 2.** 【主張：不動点公理は妥当】 \ref{logic:mu-unfolding.2} から $\lVert A[\mu X.A/X]\rVert_{V}=\lVert\mu X.A\rVert_{V}$ である。とくに左辺は右辺に含まれるので、$A[\mu X.A/X]\to\mu X.A$ はどの状態でも真である。

**Step 3.** 【主張：推論規則は妥当性を保つ】 モーダスポネンスと ⟨a⟩ の単調性が妥当性を保つことは、意味の定義から従う（$\lVert A\rVert_{V}\subset\lVert B\rVert_{V}$ なら $\lVert\langle a\rangle A\rVert_{V}\subset\lVert\langle a\rangle B\rVert_{V}$）。パークの帰納規則について。$A[B/X]\to B$ が妥当なら、各 $V$ で $\lVert A[B/X]\rVert_{V}\subset\lVert B\rVert_{V}$ である。\ref{logic:mu-substitution-lemma} から左辺は $\lVert A\rVert_{V[X\mapsto\lVert B\rVert_{V}]}$ に等しいので、$\lVert B\rVert_{V}$ は $T\mapsto\lVert A\rVert_{V[X\mapsto T]}$ の前不動点である。ゆえに \ref{logic:mu-unfolding.3} から $\lVert\mu X.A\rVert_{V}\subset\lVert B\rVert_{V}$ となり、$\mu X.A\to B$ は妥当である。

::: hypcheck
- **代入補題の使いどころ**：Step 2・3 はどちらも、構文の代入 $A[B/X]$ の意味を「$X$ に $\lVert B\rVert_{V}$ を入れた $A$ の意味」に読み替えている。$B$ が $X$ 以外の変数を自由に含み、それが $A$ の中の $\mu$ に捕まると、この読み替えは成り立たない（\ref{logic:prob-mu-capture}）。捕獲を避ける代入で公理と規則を述べたのはこのためである。
- **α 公理**：捕獲を避ける代入は束縛変数の名前を新しいものに変えるので、同じ論理式を二通りに導くと α 同値な別の論理式になりうる。それらを同一視するために公理 4 を置いた。
:::
:::

## 導出できる原理 {#logic:sec-mul-derived}

::: lemma 導出の基本性質（μ 計算） {#logic:kozen-normality keywords="derived modal rules in Kozen's system: necessitation, K, monotonicity of box"}
$[a]A=\neg\langle a\rangle\neg A$ について：
1. $\vdash A$ ならば $\vdash[a]A$。$\vdash A\to B$ ならば $\vdash[a]A\to[a]B$。
2. $\vdash[a](A\to B)\to([a]A\to[a]B)$、$\vdash[a]A\wedge[a]B\to[a](A\wedge B)$。
:::

::: proof
**Step 1.** 【主張：必然化と単調性】 $\vdash A$ とする。恒真式 $A\to(\neg A\to\bot)$ とモーダスポネンスから $\vdash\neg A\to\bot$ である。単調性の規則から $\vdash\langle a\rangle\neg A\to\langle a\rangle\bot$ となり、公理 2 の $\neg\langle a\rangle\bot$ と恒真式から $\vdash\neg\langle a\rangle\neg A$、すなわち $\vdash[a]A$ を得る。$\vdash A\to B$ とすると、恒真式から $\vdash\neg B\to\neg A$ であり、単調性の規則から $\vdash\langle a\rangle\neg B\to\langle a\rangle\neg A$ となる。対偶をとれば $\vdash[a]A\to[a]B$ である。

**Step 2.** 【主張：K】 恒真式 $\neg B\to\neg(A\to B)\vee\neg A$ に単調性の規則を使い、公理 2 の一つ目と合わせると $\vdash\langle a\rangle\neg B\to\langle a\rangle\neg(A\to B)\vee\langle a\rangle\neg A$ を得る。この対偶が一つ目の式である。二つ目も、恒真式 $\neg(A\wedge B)\to\neg A\vee\neg B$ から同じように得られる（対偶は $[a]A\wedge[a]B\to[a](A\wedge B)$）。
:::

::: definition X について単純な論理式 {#logic:x-simple keywords="X-simple formula: X does not occur free inside any fixpoint subformula" index="単純な論理式（μ 計算）|たんじゅんなろんりしきみゅーけいさん"}
論理式 $A$ の部分 $\mu Y.E$ のどれについても $X\notin\mathrm{FV}(\mu Y.E)$ となるとき、$A$ は **$X$ について単純**であるという（$X$ は不動点演算子の内側に自由に現れない）。
:::

::: remark
$X$ について単純な $A$ では、代入 $A[C/X]$ は \ref[定義の 3(i)]{logic:mu-substitution.3} しか使わず、$\mu$ の部分を変えずに $X$ の現れを $C$ に置き換えるだけである。とくに付け替えは起きず、$A[C/X][D/X]=A[C[D/X]/X]$（$A$ の構成についての帰納法：$X$ の現れでは両辺 $C[D/X]$、$\mu$ の部分は両辺とも変わらない）。$A$ が $X$ について単純なら $\neg(A[\neg X/X])$ もそうである。
:::

::: proposition 単純な論理式についての導出原理 {#logic:kozen-simple-rules keywords="for X-simple formulas: monotonicity of substitution, converse unfolding, nu-fixpoint and coinduction rule are derivable" index="余帰納規則|よきのうきそく"}
$A$ を $X$ について単純な論理式とする。
1. （代入の単調性）$\vdash C\to D$ とする。$\mathrm{pos}(X,A)$ なら $\vdash A[C/X]\to A[D/X]$、$\mathrm{neg}(X,A)$ なら $\vdash A[D/X]\to A[C/X]$。
2. （展開の逆向き）$\mathrm{pos}(X,A)$ なら $\vdash\mu X.A\to A[\mu X.A/X]$。よって $\vdash\mu X.A\leftrightarrow A[\mu X.A/X]$。
3. （$\nu$ の不動点）$\mathrm{pos}(X,A)$ なら $\vdash\nu X.A\to A[\nu X.A/X]$。
4. （**余帰納規則**）$\mathrm{pos}(X,A)$ で $\vdash B\to A[B/X]$ ならば $\vdash B\to\nu X.A$。
:::

::: proof
**Step 1.** 【主張：1】 $A$ の構成についての帰納法で、pos の場合と neg の場合を同時に示す（$X$ について単純な論理式の部分もまた $X$ について単純である）。$A=X$ の場合、示す式は仮定そのものである（$\mathrm{neg}(X,X)$ は偽なので neg の場合はない）。$A$ が $X$ 以外の変数、または $\mu Y.E$ の場合、単純さから $X\notin\mathrm{FV}(A)$ なので、\ref{logic:mu-substitution-syntax.1} から両辺とも $A$ になり、示す式は恒真式 $A\to A$ である。$A=\neg E$ の場合、$E$ についての帰納法の仮定を向きを入れ替えて使い、対偶をとる。$A=E_{1}\wedge E_{2}$ の場合、二つの帰納法の仮定を恒真式でまとめる。$A=\langle a\rangle E$ の場合、帰納法の仮定に単調性の規則を使う。

**Step 2.** 【主張：2】 $M\defeq\mu X.A$、$B\defeq A[M/X]$ とおく。不動点公理から $\vdash B\to M$ である。これと 1 から $\vdash A[B/X]\to A[M/X]$ であり、右辺は $B$ である。よってパークの帰納規則から $\vdash M\to B$ を得る。

**Step 3.** 【主張：3】 $E\defeq\neg(A[\neg X/X])$、$N\defeq\nu X.A=\neg\mu X.E$ とおく（\ref{logic:mu-nu}）。\ref{logic:mu-unfolding.1} で $N$ は論理式なので $\mathrm{pos}(X,E)$ であり、上の remark から $E$ も $X$ について単純である。不動点公理から $\vdash E[\mu X.E/X]\to\mu X.E$ である。上の remark の等式から $E[\mu X.E/X]=\neg(A[\neg\mu X.E/X])=\neg(A[N/X])$ なので、対偶をとって $\vdash N\to A[N/X]$ を得る。

**Step 4.** 【主張：4】 パークの帰納規則を $\mu X.E$ と論理式 $\neg B$ に使うため、前提 $\vdash E[\neg B/X]\to\neg B$ を導く。remark の等式から $E[\neg B/X]=\neg(A[\neg\neg B/X])$ である。恒真式 $B\to\neg\neg B$ と 1 から $\vdash A[B/X]\to A[\neg\neg B/X]$ であり、仮定 $\vdash B\to A[B/X]$ と合わせて $\vdash B\to A[\neg\neg B/X]$ を得る。この対偶が前提である。よってパークの帰納規則から $\vdash\mu X.E\to\neg B$ であり、対偶をとって $\vdash B\to N$ を得る。

::: hypcheck
- **単純さを使った場所**：Step 1 の $\mu$ の場合（$X$ が自由に現れないので両辺が同じ）と、Step 3・4 で代入を続けて行った $A[\neg X/X][M/X]=A[\neg M/X]$。$X$ が $\mu$ の内側に自由に現れる一般の場合も、1〜4 はコーゼンの公理系で導けることが知られているが、続けて行った代入を α 同値を込めて扱う必要があり、このサイトでは示していない。
:::
:::

::: proposition PDL の反復の公理の導出 {#logic:kozen-derives-pdl-star keywords="Kozen's system derives the translations of the PDL iteration and induction axioms for an atomic program"}
PDL の翻訳（\ref{logic:pdl-to-mu}）で $t([a^{\ast}]p)=\nu X.(p\wedge[a]X)$ である（$X\ne p$）。$N\defeq\nu X.(p\wedge[a]X)$, $J\defeq\nu Y.((p\to[a]p)\wedge[a]Y)$ とおくと、コーゼンの公理系で
1. $\vdash N\leftrightarrow p\wedge[a]N$（PDL の反復の公理 6 の翻訳）。
2. $\vdash p\wedge J\to N$（PDL の帰納の公理 7 の翻訳）。
:::

::: proof
$p\wedge[a]X$ と $(p\to[a]p)\wedge[a]Y$ はそれぞれ $X$, $Y$ について単純で、正。

**Step 1.** 【主張：1】 → は \ref{logic:kozen-simple-rules.3} である。← を示すため、余帰納規則を $B\defeq p\wedge[a]N$ に使う。$\vdash B\to p$ は恒真式である。また → から $\vdash N\to B$ なので、\ref{logic:kozen-normality.1} から $\vdash[a]N\to[a]B$ である。よって $\vdash B\to p\wedge[a]B$ となり、余帰納規則 \ref{logic:kozen-simple-rules.4} から $\vdash B\to N$ を得る。

**Step 2.** 【主張：2】 余帰納規則を $B\defeq p\wedge J$ に使う。\ref{logic:kozen-simple-rules.3} から $\vdash J\to(p\to[a]p)\wedge[a]J$ である。よって恒真式から $\vdash p\wedge J\to p\wedge[a]p\wedge[a]J$ となる。\ref{logic:kozen-normality.2} の二つ目から $\vdash[a]p\wedge[a]J\to[a](p\wedge J)$ なので、$\vdash B\to p\wedge[a]B$ を得る。ゆえに余帰納規則から $\vdash B\to N$ である。
:::

## 完全性・有限モデル性・決定可能性（事実） {#logic:sec-mul-facts}

::: remark
次のことが知られている。このサイトではどれも証明していない。
1. （**完全性**）妥当な論理式はすべてコーゼンの公理系の定理である（Walukiewicz, *Completeness of Kozen's axiomatisation of the propositional μ-calculus*, Inform. and Comput. 157 (2000)）。Kozen 1983 は、論理式の形を制限した部分（非連言的な論理式）について完全性を示していた。
2. （**有限モデル性**）\term[充足可能]{logic:mu-semantics}な論理式は、有限のラベル付き遷移系で充足される（Kozen, *A finite model theorem for the propositional μ-calculus*, Studia Logica 47 (1988)）。
3. （**計算量**）\term[充足可能]{logic:mu-semantics}性は EXPTIME 完全である（EXPTIME に属することは Emerson–Jutla 1988 の木オートマトンによる方法、EXPTIME 困難であることは PDL の場合と同じ）。
4. （**交代の階層**）$\mu$ と $\nu$ を互いに依存させて入れ子にする回数（交代の深さ）を増やすと、真に多くの性質が書ける（Bradfield, *The modal mu-calculus alternation hierarchy is strict*, Theoret. Comput. Sci. 195 (1998)。Lenzi 1996 も独立に示した）。
:::

::: lemma 有限のモデルでの真理は計算できる（μ 計算） {#logic:mu-finite-evaluation keywords="truth sets of mu-calculus formulas in finite models are computable"}
有限のラベル付き遷移系（動作は有限個だけが空でない関係をもつ）と、論理式 $A$ の自由変数の値を与えた付値 $V$ について、$\lVert A\rVert_{V}$ は計算できる。
:::

::: proof
$A$ の構成についての帰納法で、「自由変数の値を入力として真理集合を出力する手続き」を作る。変数・$\neg$・$\wedge$・$\langle a\rangle$ の場合、真理集合は有限集合の演算で求まる。$\mu X.C$ の場合、$f(T)\defeq\lVert C\rVert_{V[X\mapsto T]}$ とおき、$C$ の手続きを $X$ の値 $\mu^{0}=\varnothing$, $\mu^{1}=f(\mu^{0}),\dots$ について順に呼ぶ（$X$ 以外の自由変数の値は \ref{logic:mu-monotone.1} から $V$ のものだけを使えばよい）。$f$ は単調なので（\ref{logic:mu-monotone.3}）、\ref{logic:mu-approximant-theorem.3} から $\mu^{\lvert S\rvert}=\mathrm{lfp}(f)=\lVert\mu X.C\rVert_{V}$ が答えである。
:::

::: corollary μ 計算の決定可能性 {#logic:mu-decidable keywords="validity of the mu-calculus is decidable, assuming completeness and the finite model property"}
上の remark の 1・2 を認めると、μ 計算の論理式が妥当かどうか（したがって定理かどうか）は決定可能である。
:::

::: proof
1 と健全性から、妥当な論理式の全体は定理の全体で、導出の列挙で帰納的に枚挙できる。2 から、妥当でない $A$ は、$\neg A$ がある有限のモデルのある状態で真になる。自由変数の値まで含めて有限のモデルを順に列挙し、\ref{logic:mu-finite-evaluation} で検査すれば、妥当でない論理式の全体も帰納的に枚挙できる。二つを交互に進める（\ref{logic:ctl-decidable} と同じ）。
:::

::: intuition
**パークの帰納規則は「最小」の公理化である。** 不動点公理は「$\mu X.A$ は前不動点」を、パークの規則は「論理式で書けるどの前不動点よりも小さい」を言う。意味論の $\mathrm{lfp}$ は「**すべての**前不動点よりも小さい」なので、規則は意味論より弱いことしか言っていないように見えるが、完全性定理（Walukiewicz）は、それで妥当な論理式がすべて導けることを保証する。PDL の帰納の公理はこの規則から導ける（\ref{logic:kozen-derives-pdl-star}）。LTL の $\mathbf{U}$ の\term[帰納規則]{logic:ltl-axioms}や CTL の\term[帰納規則]{logic:ctl-axioms}も、「前不動点なら最小不動点より大きい」という同じ形をしている。

**高い視点：帰納と余帰納。** パークの規則（最小不動点への帰納）と余帰納規則（最大不動点への余帰納）は、代数とその双対の余代数の言葉では、始代数からの射の存在（帰納的な定義と証明）と終余代数への射の存在（双模倣による同一視）にあたる。最小不動点の性質は「有限回で決着がつく」約束、最大不動点の性質は「いつまでも破られない」不変条件で、前者は帰納で、後者は余帰納で証明する。
:::

## 問題 {#logic:sec-mul-problems}

::: problem {#logic:prob-kozen-ef}
$E\defeq\mu X.(p\vee\langle a\rangle X)$（$X\ne p$）について、$\vdash\langle a\rangle E\to E$ と $\vdash E\to p\vee\langle a\rangle E$ を導け。
:::

::: solution
$A\defeq p\vee\langle a\rangle X$ とおく。$A$ は $X$ について単純で正であり、$A[E/X]=p\vee\langle a\rangle E$ である。不動点公理から $\vdash p\vee\langle a\rangle E\to E$ であり、恒真式から $\vdash\langle a\rangle E\to E$ を得る。二つ目は \ref{logic:kozen-simple-rules.2} から従う。
:::

::: problem {#logic:prob-kozen-mu-bot}
パークの帰納規則を使って $\vdash\mu X.\langle a\rangle X\to\bot$ を導け。また、この論理式が妥当であることを意味論から確かめよ。
:::

::: solution
$A\defeq\langle a\rangle X$、$B\defeq\bot$ とおくと、$A[B/X]=\langle a\rangle\bot$ である。公理 2 から $\vdash\neg\langle a\rangle\bot$ であり、恒真式から $\vdash\langle a\rangle\bot\to\bot$ を得る。よってパークの帰納規則から $\vdash\mu X.\langle a\rangle X\to\bot$ である。意味論について。$f(T)\defeq\lVert\langle a\rangle X\rVert_{V[X\mapsto T]}$ とおくと $f(\varnothing)=\varnothing$ なので、$\varnothing$ は前不動点であり、$\lVert\mu X.\langle a\rangle X\rVert_{V}=\varnothing$ となる。$\lVert\bot\rVert_{V}=\varnothing$ なので、$\mu X.\langle a\rangle X\to\bot$ はどの状態でも真である。
:::

::: problem {#logic:prob-kozen-nu-diamond}
$G\defeq\nu X.\langle a\rangle X$ について、意味論では $\lVert G\rVert_{V}$ が「無限の $a$ の道が出る状態」の集合であることを示し、公理系で $\vdash G\to\langle a\rangle G$ を導け。
:::

::: solution
意味論について。$f(T)\defeq\lVert\langle a\rangle X\rVert_{V[X\mapsto T]}$（$T$ の中に $a$ の後続をもつ状態の集合）とおき、無限の $a$ の道が出る状態の集合を $P$ とする。道の次の状態も $P$ に属するので、$P\subset f(P)$ である。逆に $T\subset f(T)$ なら、$T$ のどの元にも $T$ の中の $a$ の後続がある。このとき DC により $s\in T$ から $T$ の中の後続を選び続けて無限の道が作れるので、$T\subset P$ である（モデルが有限なら状態の順序で選べて DC は要らない）。ゆえに \ref{logic:mu-unfolding.1} と \ref{logic:mu-knaster-tarski.2} から $\lVert G\rVert_{V}=\mathrm{gfp}(f)=P$ である。公理系について。$\langle a\rangle X$ は $X$ について単純で正なので、\ref{logic:kozen-simple-rules.3} から $\vdash G\to\langle a\rangle G$ を得る。
:::
