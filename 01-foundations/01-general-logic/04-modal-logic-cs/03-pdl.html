# 命題動的論理 PDL {#logic:page-pdl keywords="propositional dynamic logic, PDL, programs, composition, choice, iteration, test, Kleene star, while program, Fischer-Ladner closure, small model property, filtration, non-compactness"}

様相論理の $\Box A$ は「次のどの状態でも $A$」を表した。プログラムが何種類もあるなら、プログラム $\alpha$ ごとに様相 $[\alpha]$ を用意し、「$\alpha$ を実行して止まったどの状態でも $A$」を $[\alpha]A$ と書けばよい。さらにプログラムを、順に実行する（$\alpha;\beta$）、どちらかを実行する（$\alpha\cup\beta$）、何回か繰り返す（$\alpha^{\ast}$）、条件を確かめる（$A?$）という操作で組み立てると、`if` 文や `while` 文が表せる。これが**命題動的論理**（PDL、Fischer–Ladner 1979）である。テスト $A?$ を通じて論理式がプログラムの中に現れるので、プログラムと論理式は**同時に**定義される。このページでは構文と意味論、基本的な妥当式を述べ、**フィッシャー–ラドナー閉包**という有限集合を通したフィルトレーションで、充足可能な論理式は $2^{\lvert A\rvert}$ 個以下の状態のモデルで充足されること（**小モデル定理**）を示す。公理系と完全性は次のページ（\see[PDL の公理系と完全性]{logic:page-pdl-completeness}）で扱う。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。フィッシャー–ラドナー閉包の大きさの評価とフィルトレーションは Harel–Kozen–Tiuryn『Dynamic Logic』第 6 章を参照した。

## 記法と定義の確認 {#logic:sec-pdl-notation}

::: notation
- 関係 $R\subset W\times W$ について、$R^{0}$ は恒等関係、$R^{n+1}\defeq R^{n}\circ R$（$wR^{n+1}v\iff wR^{n}u$ かつ $uRv$ となる $u$ がある）、$R^{\ast}\defeq\bigcup_{n\ge0}R^{n}$（**反射推移閉包**）。二つの関係の合成は $w(R\circ S)v\iff wRu$ かつ $uSv$ となる $u$ がある、とする（左から順に）。
- 様相論理の\term[クリプキモデル]{logic:kripke-model}・真理・フィルトレーションの考え方は \ref{logic:page-kripke-semantics}, \ref{logic:page-bisimulation} のとおり。ここでは関係がプログラムごとにある。
- 論理式の**大きさ** $\lvert A\rvert$ は、下の定義の記号の個数（\ref{logic:pdl-size}）。
- **公理系**：$\ZF$ で行う。選択公理は使わない（モデルの構成で選ぶものはいつも明示的に定まる）。
:::

## 構文と意味論 {#logic:sec-pdl-syntax}

::: definition PDL のプログラムと論理式 {#logic:pdl-syntax keywords="PDL syntax: programs and formulas defined by simultaneous induction" index="命題動的論理|めいだいどうてきろんり, PDL|ぴーでぃーえる, プログラム（PDL）|ぷろぐらむぴーでぃーえる, テスト（PDL）|てすとぴーでぃーえる"}
命題変数の可算集合 $\mathrm{PV}$ と、**原子プログラム**の可算集合 $\Pi_{0}$ を固定する。**プログラム**と**論理式**を次の規則で同時に帰納的に定める。
1. 原子プログラム $a\in\Pi_{0}$ はプログラム。$\alpha,\beta$ がプログラムなら、$\alpha;\beta$（**合成**）、$\alpha\cup\beta$（**選択**）、$\alpha^{\ast}$（**反復**）はプログラム。$A$ が論理式なら $A?$（**テスト**）はプログラム。
2. 命題変数と $\bot$ は論理式。$A,B$ が論理式なら $A\to B$ は論理式。$\alpha$ がプログラムで $A$ が論理式なら $[\alpha]A$ は論理式。

$\neg,\wedge,\vee,\top$ は様相論理と同じ略記、$\langle\alpha\rangle A\defeq\neg[\alpha]\neg A$。
:::

::: definition PDL のモデルと真理 {#logic:pdl-semantics keywords="PDL model, labelled transition system, semantics of programs and formulas" index="PDL のモデル|ぴーでぃーえるのもでる"}
**PDL のモデル** $\mathcal{M}=(W,\{R_{a}\}_{a\in\Pi_{0}},V)$ は、空でない集合 $W$（**状態**）、原子プログラムごとの関係 $R_{a}\subset W\times W$、\term[付値]{logic:kripke-model} $V\subset W\times\mathrm{PV}$ からなる。プログラム $\alpha$ の関係 $R_{\alpha}$ と真理 $\mathcal{M},w\models A$ を、プログラムと論理式の構成について同時に帰納的に定める。
$$
R_{\alpha;\beta}\defeq R_{\alpha}\circ R_{\beta},\qquad R_{\alpha\cup\beta}\defeq R_{\alpha}\cup R_{\beta},\qquad R_{\alpha^{\ast}}\defeq(R_{\alpha})^{\ast},\qquad R_{A?}\defeq\{(w,w):\mathcal{M},w\models A\},
$$
$w\models p\iff(w,p)\in V$、$w\not\models\bot$、$w\models A\to B\iff w\not\models A$ または $w\models B$、
$$
w\models[\alpha]A\iff wR_{\alpha}v\text{ となるすべての }v\text{ で }v\models A.
$$
$A$ が $\mathcal{M}$ のすべての状態で真なら $\mathcal{M}\models A$、すべての PDL のモデルで真なら $A$ は**妥当**、あるモデルのある状態で真なら**充足可能**という。
:::

::: remark
$R_{A?}$ は $A$ の真理を使い、$[\alpha]A$ の真理は $R_{\alpha}$ を使うので、二つは同時に定義する必要がある。定義が循環しないのは、右辺がいつも構成の上でより小さいプログラム・論理式だけを使うからである。$w\models\langle\alpha\rangle A\iff wR_{\alpha}v$ かつ $v\models A$ となる $v$ がある（$[\alpha]$ と $\langle\alpha\rangle$ は $\Box$ と $\Diamond$ と同じ関係）。
:::

::: example 条件分岐と繰り返し {#logic:pdl-while keywords="if-then-else and while programs in PDL"}
1. $\mathbf{if}\ A\ \mathbf{then}\ \alpha\ \mathbf{else}\ \beta\defeq(A?;\alpha)\cup(\neg A?;\beta)$。$wR v$ となるのは、$w\models A$ で $wR_{\alpha}v$ のとき、または $w\models\neg A$ で $wR_{\beta}v$ のときである。
2. $\mathbf{while}\ A\ \mathbf{do}\ \alpha\defeq(A?;\alpha)^{\ast};\neg A?$。$wRv$ となるのは、$w=w_{0}R_{\alpha}w_{1}R_{\alpha}\cdots R_{\alpha}w_{n}=v$（$n\ge0$）で、$w_{0},\dots,w_{n-1}$ では $A$ が真、$v$ では偽のときである。ループが止まらない場合は後続がない。
3. したがって $[\mathbf{while}\ A\ \mathbf{do}\ \alpha]B$ は「ループが止まったなら、止まった状態で $B$」（**部分正当性**）、$\langle\mathbf{while}\ A\ \mathbf{do}\ \alpha\rangle\top$ は「止まる実行がある」を表す。
:::

::: proposition PDL の基本的な妥当式 {#logic:pdl-valid keywords="valid PDL principles: composition, choice, test, iteration (fixed point), induction axiom" index="PDL の妥当式|ぴーでぃーえるのだとうしき"}
すべてのプログラム $\alpha,\beta$ と論理式 $A,B$ について、次は妥当である。
1. $[\alpha](A\to B)\to([\alpha]A\to[\alpha]B)$。また $A$ が妥当なら $[\alpha]A$ も妥当。
2. $[\alpha;\beta]A\leftrightarrow[\alpha][\beta]A$。
3. $[\alpha\cup\beta]A\leftrightarrow[\alpha]A\wedge[\beta]A$。
4. $[B?]A\leftrightarrow(B\to A)$。
5. $[\alpha^{\ast}]A\leftrightarrow A\wedge[\alpha][\alpha^{\ast}]A$。
6. （**帰納の公理**）$A\wedge[\alpha^{\ast}](A\to[\alpha]A)\to[\alpha^{\ast}]A$。
:::

::: proof
1 は様相論理の場合（\ref{logic:kripke-k-sound}）と同じ。2：$wR_{\alpha;\beta}v\iff wR_{\alpha}u$ かつ $uR_{\beta}v$ となる $u$ がある、なので「$R_{\alpha}\circ R_{\beta}$ の後続すべてで $A$」は「$R_{\alpha}$ の後続 $u$ すべてについて、$u$ の $R_{\beta}$ の後続すべてで $A$」と同じ。3：$R_{\alpha}\cup R_{\beta}$ の後続は $R_{\alpha}$ の後続か $R_{\beta}$ の後続。4：$w$ の $R_{B?}$ の後続は、$w\models B$ なら $w$ だけ、そうでなければない。

5：$R_{\alpha}^{\ast}=R^{0}\cup(R_{\alpha}\circ R_{\alpha}^{\ast})$（$R^{n+1}=R_{\alpha}\circ R_{\alpha}^{n}$ とも書けることを $n$ の帰納法で確かめる）なので、$R_{\alpha^{\ast}}$ の後続は $w$ 自身と、$R_{\alpha}$ の後続 $u$ の $R_{\alpha^{\ast}}$ の後続。2・3 と同じ計算で 5 になる。

6：$w\models A$ かつ $w\models[\alpha^{\ast}](A\to[\alpha]A)$ とし、$wR_{\alpha}^{n}v$ なら $v\models A$ を $n$ の帰納法で示す。$n=0$ は $v=w$。$wR_{\alpha}^{n}uR_{\alpha}v$ なら、帰納法の仮定で $u\models A$、$wR_{\alpha^{\ast}}u$ なので $u\models A\to[\alpha]A$、よって $u\models[\alpha]A$ で $v\models A$。
:::

::: remark
6 は「$A$ が最初に成り立ち、$\alpha$ の一歩で保たれるなら、何歩後でも成り立つ」という数学的帰納法そのもので、ループ不変条件による正当性の証明（ホーア論理の while 規則）にあたる。5 は $[\alpha^{\ast}]A$ が「$X\leftrightarrow A\wedge[\alpha]X$」の解であることを言う。さらに、$X\to A\wedge[\alpha]X$ が（あるモデルで）すべての状態で真なら $X\to[\alpha^{\ast}]A$ もそうである（6 の証明と同じ、歩数についての帰納法）。つまり $[\alpha^{\ast}]A$ はこの式の最大の解で、これが μ 計算の不動点の見方につながる。
:::

## PDL はコンパクトでない {#logic:sec-pdl-noncompact}

::: proposition PDL はコンパクトでない {#logic:pdl-not-compact keywords="PDL is not compact; strong completeness fails" index="PDL の非コンパクト性|ぴーでぃーえるのひこんぱくとせい"}
$a\in\Pi_{0}$、$p\in\mathrm{PV}$ とし、$[a]^{n}$ を $[a]$ を $n$ 個並べたものとする。論理式の集合
$$
\Gamma\defeq\{\langle a^{\ast}\rangle p\}\cup\{[a]^{n}\neg p:n\ge0\}=\{\langle a^{\ast}\rangle p,\ \neg p,\ [a]\neg p,\ [a][a]\neg p,\dots\}
$$
は、どの有限部分集合も充足可能だが、$\Gamma$ 全体は充足可能でない。
:::

::: proof
有限部分集合が $[a]^{n}\neg p$ を $n<N$ についてしか含まないとする。状態 $0,1,\dots,N$、$R_{a}=\{(k,k+1):k<N\}$、$p$ は $N$ でだけ真、とすると、状態 $0$ で $\langle a^{\ast}\rangle p$（$0R_{a}^{N}N$）と、$n<N$ の $[a]^{n}\neg p$（$0$ から $n$ 歩で着くのは $n$ だけ）が真。一方、ある状態 $w$ で $\Gamma$ のすべてが真なら、$\langle a^{\ast}\rangle p$ から $wR_{a}^{n}v$ かつ $v\models p$ となる $n,v$ があるが、$[a]^{n}\neg p$ から $v\models\neg p$ となり矛盾する。
:::

::: remark
したがって PDL には「$\Gamma\models A$ なら有限個の前提から導ける」という意味の**強い完全性**をもつ有限的な公理系はない。完全性は「妥当な論理式はすべて証明できる」（弱い完全性）の形で示す（\see[PDL の公理系と完全性]{logic:page-pdl-completeness}）。
:::

## フィッシャー–ラドナー閉包 {#logic:sec-pdl-fl}

::: definition 大きさ {#logic:pdl-size keywords="size of PDL formulas and programs" index="大きさ（PDL）|おおきさぴーでぃーえる"}
$\lvert p\rvert=\lvert\bot\rvert=\lvert a\rvert\defeq1$、$\lvert A\to B\rvert\defeq1+\lvert A\rvert+\lvert B\rvert$、$\lvert[\alpha]A\rvert\defeq\lvert\alpha\rvert+\lvert A\rvert$、$\lvert\alpha;\beta\rvert=\lvert\alpha\cup\beta\rvert\defeq1+\lvert\alpha\rvert+\lvert\beta\rvert$、$\lvert\alpha^{\ast}\rvert\defeq1+\lvert\alpha\rvert$、$\lvert B?\rvert\defeq1+\lvert B\rvert$。
:::

::: definition フィッシャー–ラドナー閉包 {#logic:fischer-ladner keywords="Fischer-Ladner closure FL(A)" index="フィッシャー–ラドナー閉包|ふぃっしゃーらどなーへいほう"}
論理式の集合 $\Sigma$ が **FL 閉**であるとは、次の各行で、左の論理式が $\Sigma$ に属すれば右の論理式も $\Sigma$ に属することをいう。

| 左 | 右 |
|---|---|
| $B\to C$ | $B$, $C$ |
| $[\alpha]B$ | $B$ |
| $[\alpha;\beta]B$ | $[\alpha][\beta]B$ |
| $[\alpha\cup\beta]B$ | $[\alpha]B$, $[\beta]B$ |
| $[\alpha^{\ast}]B$ | $[\alpha][\alpha^{\ast}]B$ |
| $[C?]B$ | $C$ |

論理式 $A$ を含む最小の FL 閉集合を $\mathrm{FL}(A)$ と書き、$A$ の**フィッシャー–ラドナー閉包**という（FL 閉集合の共通部分は FL 閉なので存在する）。
:::

::: remark
部分論理式の集合と違うのは、$[\alpha^{\ast}]B$ から $[\alpha][\alpha^{\ast}]B$ のように、部分論理式でない（むしろ長い）論理式が入ることである。そのため $\mathrm{FL}(A)$ が有限であることは自明でない。次の定理がそれを保証する。
:::

::: theorem フィッシャー–ラドナー閉包の大きさ {#logic:fl-size keywords="|FL(A)| <= |A|" index="フィッシャー–ラドナー閉包の大きさ|ふぃっしゃーらどなーへいほうのおおきさ"}
すべての論理式 $A$ について $\lvert\mathrm{FL}(A)\rvert\le\lvert A\rvert$。
:::

::: proof
論理式 $A$ に集合 $S(A)$ を、論理式 $[\alpha]B$ に集合 $T(\alpha,B)$ を、次の再帰で対応させる。
$$
S(p)=\{p\},\quad S(\bot)=\{\bot\},\quad S(B\to C)=\{B\to C\}\cup S(B)\cup S(C),\quad S([\alpha]B)=T(\alpha,B)\cup S(B),
$$
$$
\begin{aligned}
&T(a,B)=\{[a]B\},\qquad T(\alpha\cup\beta,B)=\{[\alpha\cup\beta]B\}\cup T(\alpha,B)\cup T(\beta,B),\\
&T(\alpha;\beta,B)=\{[\alpha;\beta]B\}\cup T(\alpha,[\beta]B)\cup T(\beta,B),\qquad T(\alpha^{\ast},B)=\{[\alpha^{\ast}]B\}\cup T(\alpha,[\alpha^{\ast}]B),\\
&T(C?,B)=\{[C?]B\}\cup S(C).
\end{aligned}
$$
$T(\alpha,B)$ の右辺は $\alpha$ より小さいプログラム（と、テストの中の論理式 $C$ の $S$）だけを使うので、$T$ は $\alpha$ についての再帰で（すべての $B$ について同時に）定まり、$S$ は $A$ についての再帰で定まる。

**Step 1.** 【主張：$\lvert T(\alpha,B)\rvert\le\lvert\alpha\rvert$、$\lvert S(A)\rvert\le\lvert A\rvert$】 構成についての帰納法。$T(a,B)$ は 1 個。$\lvert T(\alpha\cup\beta,B)\rvert\le1+\lvert\alpha\rvert+\lvert\beta\rvert$、$\lvert T(\alpha;\beta,B)\rvert\le1+\lvert\alpha\rvert+\lvert\beta\rvert$（$T(\alpha,[\beta]B)$ の評価は二つ目の引数によらない）、$\lvert T(\alpha^{\ast},B)\rvert\le1+\lvert\alpha\rvert$、$\lvert T(C?,B)\rvert\le1+\lvert C\rvert$。$S$ についても同様に $\lvert S([\alpha]B)\rvert\le\lvert\alpha\rvert+\lvert B\rvert$ など。

**Step 2.** 論理式 $\sigma$ について、表の右の列の論理式（$\sigma$ が左の列の形のとき）の集合を $\mathrm{req}(\sigma)$ と書く。【主張：すべての $\alpha,B$ と $\sigma\in T(\alpha,B)$ について、$\mathrm{req}(\sigma)\subset T(\alpha,B)\cup S(B)$。ただし $\alpha$ の中のテスト $C?$ については $S(C)$ が FL 閉であるとする】 $\alpha$ についての帰納法。$\sigma$ が $T(\alpha,B)$ の先頭の元 $[\alpha]B$ なら、要るのは $B\in S(B)$ と、$\alpha$ の形に応じて $[\alpha_{1}]B,[\alpha_{2}]B$（選択）、$[\alpha_{1}][\alpha_{2}]B$（合成）、$[\alpha_{1}][\alpha_{1}^{\ast}]B$（反復）、$C$（テスト）で、どれも定義から $T(\alpha,B)$ に属する。$\sigma$ がそれ以外の元なら、$\sigma\in T(\alpha',B')$（$\alpha'$ は $\alpha$ の直接の部分プログラム）で、帰納法の仮定から $\mathrm{req}(\sigma)\subset T(\alpha',B')\cup S(B')$。ここで $B'=B$ か、合成のとき $B'=[\alpha_{2}]B$（$S([\alpha_{2}]B)=T(\alpha_{2},B)\cup S(B)$）、反復のとき $B'=[\alpha_{1}^{\ast}]B$（$S([\alpha_{1}^{\ast}]B)=T(\alpha_{1}^{\ast},B)\cup S(B)$）なので、いずれも $T(\alpha,B)\cup S(B)$ に含まれる。テストの $S(C)$ の元は仮定から要るものを $S(C)\subset T(\alpha,B)$ の中にもつ。

**Step 3.** 【主張：$S(A)$ は $A$ を含む FL 閉集合】 $A$ についての帰納法。$A\in S(A)$ は定義から。$A=p,\bot$ は明らか。$A=B\to C$ なら、要るのは $B,C$ で、$S(B),S(C)$ は帰納法の仮定で FL 閉。$A=[\alpha]B$ なら、$S(B)$ は帰納法の仮定で FL 閉、$\alpha$ の中のテスト $C?$ の $C$ は $A$ より小さいので $S(C)$ も FL 閉で、Step 2 から $T(\alpha,B)$ の元の要るものは $T(\alpha,B)\cup S(B)=S(A)$ に入る。

したがって $\mathrm{FL}(A)\subset S(A)$ で、Step 1 から $\lvert\mathrm{FL}(A)\rvert\le\lvert A\rvert$。

::: hypcheck
- **反復の行 $[\alpha^{\ast}]B\Rightarrow[\alpha][\alpha^{\ast}]B$**：論理式は長くなるが、Step 1 の評価は二つ目の引数によらないので、$T(\alpha,[\alpha^{\ast}]B)$ の個数は $\lvert\alpha\rvert$ で抑えられる。$T$ を「$\alpha$ についての再帰で、すべての $B$ について同時に」定めたのはこのためである。
- **テスト**：$S(C)$ を $T(C?,B)$ にまるごと入れるので、Step 2 では $S(C)$ の FL 閉性を（$C$ が小さいことによる外側の帰納法で）仮定した。
:::
:::

## 小モデル定理 {#logic:sec-pdl-small-model}

::: definition FL 閉包によるフィルトレーション {#logic:pdl-filtration keywords="filtration of a PDL model through the Fischer-Ladner closure" index="フィルトレーション（PDL）|ふぃるとれーしょんぴーでぃーえる"}
PDL のモデル $\mathcal{M}=(W,\{R_{a}\},V)$ と有限の FL 閉集合 $\Sigma$ について、$w\equiv_{\Sigma}v\iff$ すべての $B\in\Sigma$ で $(w\models B\iff v\models B)$ とし、$[w]$ を同値類とする。$\mathcal{M}^{f}=(W^{f},\{R^{f}_{a}\},V^{f})$ を
- $W^{f}\defeq\{[w]:w\in W\}$、
- $[u]R^{f}_{a}[v]\iff u\equiv_{\Sigma}u'$, $v\equiv_{\Sigma}v'$, $u'R_{a}v'$ となる $u',v'$ がある、
- $([w],p)\in V^{f}\iff p\in\Sigma$ かつ $w\models p$

で定める（$V^{f}$ と $R^{f}_{a}$ は代表元の選び方によらない）。複合プログラムの関係 $R^{f}_{\alpha}$ は、$\mathcal{M}^{f}$ の中で \ref{logic:pdl-semantics} の規則で定まるものとする。
:::

::: remark
$R^{f}_{\alpha^{\ast}}$ は $(R^{f}_{\alpha})^{\ast}$ であり、$R_{\alpha^{\ast}}$ の同値類への像（\ref{logic:filtration} の最小フィルトレーション）とは一般に異なる。原子プログラムだけをフィルトレーションし、複合プログラムは $\mathcal{M}^{f}$ の中で組み立て直すのが要点である。
:::

::: lemma PDL のフィルトレーションの補題 {#logic:pdl-filtration-lemma keywords="filtration lemma for PDL" index="フィルトレーションの補題（PDL）|ふぃるとれーしょんのほだいぴーでぃーえる"}
$\Sigma$ を有限の FL 閉集合とする。
1. すべての $B\in\Sigma$ と $w$ について、$\mathcal{M},w\models B\iff\mathcal{M}^{f},[w]\models B$。
2. $[\alpha]B\in\Sigma$ ならば、(a) $uR_{\alpha}v$ なら $[u]R^{f}_{\alpha}[v]$。(b) $[u]R^{f}_{\alpha}[v]$ かつ $\mathcal{M},u\models[\alpha]B$ なら $\mathcal{M},v\models B$。
:::

::: proof
1 を論理式について、2 をプログラム $\alpha$ について（すべての $B$ について同時に）、構成についての同時の帰納法で示す。2 は $\alpha$ の部分プログラムについての 2 と、$\alpha$ の中のテストの論理式についての 1 だけを使い、1 の $[\alpha]B$ の場合は 2 と $B$ についての 1 だけを使うので、帰納法は構成の上で下に向かう。以下、$\Sigma$ の元の真理は同値類の中で一定であることをくり返し使う。

**Step 1（1 の場合）.** 【主張：2 を仮定すれば 1 が成り立つ】 命題変数は $V^{f}$ の定義、$\bot$ は両辺とも偽、$B\to C$ は $B,C\in\Sigma$（FL 閉）と帰納法の仮定。$[\alpha]B$：⇒ $\mathcal{M},u\models[\alpha]B$ で $[u]R^{f}_{\alpha}[v]$ なら、2(b) で $\mathcal{M},v\models B$、$B\in\Sigma$ と帰納法の仮定で $\mathcal{M}^{f},[v]\models B$。⇐ $\mathcal{M}^{f},[u]\models[\alpha]B$ で $uR_{\alpha}v$ なら、2(a) で $[u]R^{f}_{\alpha}[v]$、よって $\mathcal{M}^{f},[v]\models B$、帰納法の仮定で $\mathcal{M},v\models B$。

**Step 2（原子・選択・合成）.** 【主張：$\alpha=a,\ \alpha_{1}\cup\alpha_{2},\ \alpha_{1};\alpha_{2}$ で 2 が成り立つ】 原子：(a) は $R^{f}_{a}$ の定義。(b) $u'R_{a}v'$（$u'\equiv u$, $v'\equiv v$）なら、$[a]B\in\Sigma$ から $u'\models[a]B$、$v'\models B$、$B\in\Sigma$ から $v\models B$。選択：$[\alpha_{1}]B,[\alpha_{2}]B\in\Sigma$ なので、どちらの関係の矢かに応じて帰納法の仮定を使う。合成：$[\alpha_{1}][\alpha_{2}]B,[\alpha_{2}]B\in\Sigma$。(a) $uR_{\alpha_{1}}wR_{\alpha_{2}}v$ を、$\alpha_{1}$（論理式 $[\alpha_{2}]B$）と $\alpha_{2}$（論理式 $B$）の (a) で写す。(b) $[u]R^{f}_{\alpha_{1}}[w]R^{f}_{\alpha_{2}}[v]$ で $u\models[\alpha_{1};\alpha_{2}]B$ なら、\ref{logic:pdl-valid.2} で $u\models[\alpha_{1}][\alpha_{2}]B$、$\alpha_{1}$ の (b) で $w\models[\alpha_{2}]B$、$\alpha_{2}$ の (b) で $v\models B$。

**Step 3（テスト）.** 【主張：$\alpha=C?$ で 2 が成り立つ】 $[C?]B\in\Sigma$ から $C,B\in\Sigma$。(a) $uR_{C?}v$ なら $u=v$, $u\models C$、1（$C$ は小さい）で $\mathcal{M}^{f},[u]\models C$、よって $[u]R^{f}_{C?}[u]$。(b) $[u]R^{f}_{C?}[v]$ なら $[u]=[v]$ かつ $\mathcal{M}^{f},[u]\models C$、1 で $u\models C$。$u\models[C?]B$ と \ref{logic:pdl-valid.4} で $u\models B$、$u\equiv v$ で $v\models B$。

**Step 4（反復）.** 【主張：$\alpha=\gamma^{\ast}$ で 2 が成り立つ】 $[\gamma^{\ast}]B\in\Sigma$ から $[\gamma][\gamma^{\ast}]B\in\Sigma$ と $B\in\Sigma$。(a) $u=w_{0}R_{\gamma}w_{1}\cdots R_{\gamma}w_{n}=v$ なら、$\gamma$（論理式 $[\gamma^{\ast}]B$）の (a) で $[w_{k}]R^{f}_{\gamma}[w_{k+1}]$、よって $[u](R^{f}_{\gamma})^{\ast}[v]$。(b) $[u]=[w_{0}]R^{f}_{\gamma}[w_{1}]\cdots R^{f}_{\gamma}[w_{n}]=[v]$ で $u\models[\gamma^{\ast}]B$ とする。$k$ についての帰納法で $w_{k}\models[\gamma^{\ast}]B$：$w_{k}\models[\gamma^{\ast}]B$ なら \ref{logic:pdl-valid.5} で $w_{k}\models[\gamma][\gamma^{\ast}]B$、$\gamma$ の (b) で $w_{k+1}\models[\gamma^{\ast}]B$。よって $w_{n}\models[\gamma^{\ast}]B$、5 で $w_{n}\models B$、$v\equiv w_{n}$ と $B\in\Sigma$ で $v\models B$。

::: hypcheck
- **FL 閉性**：Step 1〜4 で、$[\alpha]B\in\Sigma$ から部品（$B$、$[\alpha_{1}][\alpha_{2}]B$、$[\gamma][\gamma^{\ast}]B$、$C$ など）が $\Sigma$ に属することを、表の行ごとに使った。部分論理式で閉じているだけでは Step 4 の $[\gamma][\gamma^{\ast}]B$ が $\Sigma$ に入らず、議論が通らない。
- **Step 4 の (b)**：$[\gamma^{\ast}]B$ そのもの（$B$ ではなく）を一歩ずつ運ぶのが要点。$B$ だけを運ぼうとすると、$\gamma$ の (b) を使うための $[\gamma]B$ が手に入らない。
- **代表元**：$R^{f}_{\gamma}$ の矢の各端で代表元を取り直してよいのは、(b) が「同値類のどの代表元についても」の形で述べられているからである。
:::
:::

::: theorem 小モデル定理（フィッシャー–ラドナー） {#logic:pdl-small-model keywords="small model property of PDL: a satisfiable formula A is satisfiable in a model with at most 2^|A| states" index="小モデル定理（PDL）|しょうもでるていりぴーでぃーえる" refname="PDL の小モデル定理"}
PDL の論理式 $A$ が充足可能ならば、状態の数が $2^{\lvert A\rvert}$ 以下のモデルで充足される。
:::

::: proof
$\mathcal{M},w\models A$ とし、$\Sigma\defeq\mathrm{FL}(A)$ とする。\ref{logic:fl-size} から $\Sigma$ は有限で $\lvert\Sigma\rvert\le\lvert A\rvert$。$[u]\mapsto\{B\in\Sigma:\mathcal{M},u\models B\}$ は $\equiv_{\Sigma}$ の定義から単射なので、$\lvert W^{f}\rvert\le2^{\lvert\Sigma\rvert}\le2^{\lvert A\rvert}$。$A\in\Sigma$ なので \ref{logic:pdl-filtration-lemma.1} から $\mathcal{M}^{f},[w]\models A$。
:::

::: corollary PDL の妥当性は決定可能 {#logic:pdl-decidable keywords="validity of PDL is decidable" index="PDL の決定可能性|ぴーでぃーえるのけっていかのうせい"}
PDL の論理式が妥当かどうかは決定可能である。
:::

::: proof
$A$ が妥当でないことは $\neg A$ が充足可能であることで、\ref{logic:pdl-small-model} から、状態が $2^{\lvert\neg A\rvert}$ 個以下のモデルで $\neg A$ が充足されることと同値である。そのようなモデルは、$A$ に現れる原子プログラムと命題変数だけを考えれば（ほかは真理に影響しない）有限個で、各モデルで $\neg A$ が真な状態があるかは、関係の合成・和・反射推移閉包を有限集合の上で計算して決められる。
:::

::: remark
この素朴な手続きは状態の数が指数的なモデルをすべて調べるので、二重指数時間かかる。PDL の充足可能性は EXPTIME 完全であることが知られている（EXPTIME に属することはプラット 1978、EXPTIME 困難であることはフィッシャー–ラドナー 1979）。完全性と合わせた扱いは \see[PDL の公理系と完全性]{logic:page-pdl-completeness} で行う。
:::

## 問題 {#logic:sec-pdl-problems}

::: problem {#logic:prob-pdl-while-fixpoint}
$w\equiv\mathbf{while}\ A\ \mathbf{do}\ \alpha$ とする。$[w]B\leftrightarrow(\neg A\to B)\wedge(A\to[\alpha][w]B)$ が妥当であることを示せ。
:::

::: solution
$w=(A?;\alpha)^{\ast};\neg A?$ なので、\ref{logic:pdl-valid.2} から $[w]B\leftrightarrow[(A?;\alpha)^{\ast}][\neg A?]B$、\ref{logic:pdl-valid.4} から $[\neg A?]B\leftrightarrow(\neg A\to B)$。\ref{logic:pdl-valid.5} を $(A?;\alpha)^{\ast}$ に使うと
$$
[(A?;\alpha)^{\ast}]C\leftrightarrow C\wedge[A?;\alpha][(A?;\alpha)^{\ast}]C\leftrightarrow C\wedge(A\to[\alpha][(A?;\alpha)^{\ast}]C)
$$
（2 と 4 を使った）。$C\defeq[\neg A?]B$ とすれば、右辺の $[(A?;\alpha)^{\ast}]C$ は $[w]B$ に戻るので、$[w]B\leftrightarrow(\neg A\to B)\wedge(A\to[\alpha][w]B)$。
:::

::: problem {#logic:prob-pdl-fl-example}
$A\defeq[a^{\ast}]p$ のフィッシャー–ラドナー閉包を書き出せ。
:::

::: solution
$[a^{\ast}]p$ から $[a][a^{\ast}]p$ と $p$（表の反復の行と $[\alpha]B\Rightarrow B$ の行）。$[a][a^{\ast}]p$ から $[a^{\ast}]p$（すでにある）。よって $\mathrm{FL}(A)=\{[a^{\ast}]p,\ [a][a^{\ast}]p,\ p\}$ で、$\lvert A\rvert=\lvert a^{\ast}\rvert+\lvert p\rvert=3$ と一致する。
:::

::: problem {#logic:prob-pdl-not-generated}
$(R^{f}_{a})^{\ast}$ が、$R_{a^{\ast}}$ を同値類へ写した関係 $\{([u],[v]):uR_{a^{\ast}}v\}$ と一致しない例を挙げよ。
:::

::: solution
状態 $0,1,2,3$、$R_{a}\defeq\{(0,1),(2,3)\}$、$p$ は $1,2$ でだけ真、$q$ は $3$ でだけ真とし、$\Sigma\defeq\{p,q\}$（FL 閉）とする。同値類は $X=\{0\}$（$p,q$ とも偽）、$Y=\{1,2\}$（$p$ だけ真）、$Z=\{3\}$（$q$ だけ真）。$R^{f}_{a}=\{(X,Y),(Y,Z)\}$ なので $(R^{f}_{a})^{\ast}$ は $(X,Z)$ を含む。一方 $R_{a^{\ast}}$ は恒等関係に $(0,1),(2,3)$ を加えたもので、$0$ から $3$ への道はないので、その像は $(X,Z)$ を含まない。\ref{logic:pdl-filtration-lemma.2} の (a) は像が $(R^{f}_{a})^{\ast}$ に含まれることだけを言い、等しいとは言っていない。
:::
