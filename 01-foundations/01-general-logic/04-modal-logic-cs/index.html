# 計算機科学の様相論理（Modal Logics in Computer Science）

双模倣と有限モデル性・計算量、ギーチ論理、命題動的論理 PDL、時相論理 LTL・CTL とモデル検査、様相 μ 計算とパリティゲーム、ホーア論理。各体系について健全性・完全性・決定可能性（と計算量）を示す（参考：『コンピュータサイエンスにおける様相論理』）。

<p class="mn-msc">MSC2020: 03B45</p>

## 前提知識

- [一般論理 › 様相論理](../../../01-foundations/01-general-logic/03-modal-logic/index.html)（全体、7 ページ）：クリプキ意味論・健全性・完全性・カノニカルモデル
- [計算理論 › 計算複雑性](../../../01-foundations/03-computation/04-complexity/index.html)（全体、16 ページ）：NP・PSPACE・多項式時間還元（計算量の節）
- [集合論 › 基礎事項](../../../01-foundations/04-set-theory/01-basics/index.html)（全体、13 ページ）：順序数・超限再帰・ブラリ＝フォルティ（μ 計算の近似列）
- [計算理論 › 計算可能性理論](../../../01-foundations/03-computation/02-computability/index.html)（全体、13 ページ）：言語 L・燃料つきの実行・レジスタ機械・停止問題（ホーア論理の表現性と非枚挙性）
- [計算理論 › 計算可能性の発展](../../../01-foundations/03-computation/03-advanced-computability/index.html)（全体、14 ページ）：Σ₁ と認識可能性（ホーア論理の非枚挙性）
- [証明論と型理論 › 算術と不完全性定理](../../../01-foundations/05-proof-theory/02-incompleteness/index.html)（全体、10 ページ）：決定可能な関係の Q での表現（N の表現性）
