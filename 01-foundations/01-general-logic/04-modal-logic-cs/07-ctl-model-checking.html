# CTL のモデル検査 {#logic:page-ctl-model-checking keywords="CTL model checking, labelling algorithm, fixed point characterization, EU, EG, linear time, O(|phi|(|S|+|R|)), fairness"}

**モデル検査**とは、有限のモデル $\mathcal{M}$ と CTL の論理式 $F$ が与えられたとき、$F$ が真な状態の集合を求める問題である。システムを有限の状態遷移系として書き、仕様を CTL（\ref{logic:page-ctl}）で書けば、仕様の検証はモデル検査になる。このページでは、$\mathbf{E}(C\,\mathbf{U}\,D)$ と $\mathbf{EG}C$ が状態の集合の上の単調な写像の最小・最大の不動点であることを示し、それをもとに、部分論理式ごとに真な状態に印をつける**ラベル付けアルゴリズム**を与え、その正しさと計算量 $O(\lvert F\rvert\cdot(\lvert S\rvert+\lvert R\rvert))$ を証明する（Clarke–Emerson–Sistla 1986）。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。アルゴリズムは Clarke–Emerson–Sistla, *Automatic verification of finite-state concurrent systems using temporal logic specifications*, ACM TOPLAS 8 (1986) の方法に沿うが、$\mathbf{EG}$ は強連結成分を使わず、後続を数えて消していく方法で計算する。

## 記法と定義の確認 {#logic:sec-ctlmc-notation}

::: notation
- CTL の論理式・モデル・真理と略記 $\mathbf{EX},\mathbf{EF},\mathbf{AF},\mathbf{EG},\mathbf{AG}$ は \ref{logic:page-ctl} のとおり。このページのモデル $\mathcal{M}=(S,R,V)$ は**有限**とする（$R$ は全域的）。
- $\llbracket F\rrbracket\defeq\{s\in S:\mathcal{M},s\models F\}$。$Z\subset S$ について
$$
\mathrm{pre}_{\exists}(Z)\defeq\{s:sRt\text{ となる }t\in Z\text{ がある}\},\qquad\mathrm{pre}_{\forall}(Z)\defeq\{s:sRt\text{ となるすべての }t\text{ が }Z\text{ に属する}\}.
$$
$\llbracket\mathbf{EX}F\rrbracket=\mathrm{pre}_{\exists}(\llbracket F\rrbracket)$、$\llbracket\mathbf{AX}F\rrbracket=\mathrm{pre}_{\forall}(\llbracket F\rrbracket)$。
- 写像 $\tau\colon\mathcal{P}(S)\to\mathcal{P}(S)$ が**単調**とは $Z\subset Z'\Rightarrow\tau(Z)\subset\tau(Z')$。$\tau(Z)=Z$ となる $Z$ を**不動点**という。
- **計算のモデル**：モデルは、各状態の後続のリストと前者（$tRs$ となる $t$）のリストで与えられるとする。状態の集合は長さ $\lvert S\rvert$ の 0–1 の配列で表す。「基本操作」は配列の一つの成分の読み書き、リストの一歩、整数の比較・加減とする。$\lvert R\rvert$ は矢の本数。
- **公理系**：$\ZF$。モデルが有限なので、経路は状態の順序で最初の後続を選んで作れ、選択公理も DC も要らない。
:::

## 不動点による特徴づけ {#logic:sec-ctlmc-fixpoints}

::: lemma 有限集合の上の不動点 {#logic:finite-fixpoint keywords="least and greatest fixed points of a monotone map on the power set of a finite set, computed by iteration" index="不動点（有限集合の冪集合上）|ふどうてんゆうげんしゅうごうのべきしゅうごうじょう"}
$S$ を有限集合、$\tau\colon\mathcal{P}(S)\to\mathcal{P}(S)$ を単調とする。
1. $Z_{0}\defeq\varnothing$, $Z_{k+1}\defeq\tau(Z_{k})$ とすると $Z_{0}\subset Z_{1}\subset\cdots$ で、$Z_{\lvert S\rvert}$ は $\tau$ の最小の不動点である。さらに $\tau(Y)\subset Y$ となるすべての $Y$ について $Z_{\lvert S\rvert}\subset Y$。
2. $Z'_{0}\defeq S$, $Z'_{k+1}\defeq\tau(Z'_{k})$ とすると $Z'_{0}\supset Z'_{1}\supset\cdots$ で、$Z'_{\lvert S\rvert}$ は $\tau$ の最大の不動点である。さらに $Y\subset\tau(Y)$ となるすべての $Y$ について $Y\subset Z'_{\lvert S\rvert}$。
:::

::: proof
**Step 1.** 【主張：列は単調で、$\lvert S\rvert$ 回以内に止まる】 $Z_{0}=\varnothing\subset Z_{1}$。$Z_{k}\subset Z_{k+1}$ なら単調性で $Z_{k+1}=\tau(Z_{k})\subset\tau(Z_{k+1})=Z_{k+2}$。真に増えるたびに元が 1 個以上増えるので、真に増えるのは $\lvert S\rvert$ 回以下。一度 $Z_{k}=Z_{k+1}$ となればその後は一定なので、$Z_{\lvert S\rvert}=Z_{\lvert S\rvert+1}=\tau(Z_{\lvert S\rvert})$。

**Step 2.** 【主張：$\tau(Y)\subset Y$ なら $Z_{k}\subset Y$】 $k$ についての帰納法。$Z_{0}=\varnothing\subset Y$。$Z_{k}\subset Y$ なら $Z_{k+1}=\tau(Z_{k})\subset\tau(Y)\subset Y$。不動点は $\tau(Y)\subset Y$ を満たすので、$Z_{\lvert S\rvert}$ は最小の不動点。

2 は包含を逆にして同じ。
:::

::: theorem CTL の演算子の不動点による特徴づけ {#logic:ctl-fixpoints keywords="E(C U D) is the least fixed point of D cup (C cap pre_exists Z); EG C is the greatest fixed point of C cap pre_exists Z; A(C U D) least fixed point with pre_forall" index="不動点による特徴づけ（CTL）|ふどうてんによるとくちょうづけしーてぃーえる"}
有限のモデルで、$\llbracket C\rrbracket=X_{C}$, $\llbracket D\rrbracket=X_{D}$ とする。
1. $\llbracket\mathbf{E}(C\,\mathbf{U}\,D)\rrbracket$ は $\tau(Z)\defeq X_{D}\cup(X_{C}\cap\mathrm{pre}_{\exists}(Z))$ の最小の不動点。
2. $\llbracket\mathbf{A}(C\,\mathbf{U}\,D)\rrbracket$ は $\tau(Z)\defeq X_{D}\cup(X_{C}\cap\mathrm{pre}_{\forall}(Z))$ の最小の不動点。
3. $\llbracket\mathbf{EG}C\rrbracket$ は $\tau(Z)\defeq X_{C}\cap\mathrm{pre}_{\exists}(Z)$ の最大の不動点。また $s\models\mathbf{EG}C\iff s$ からの経路で、すべての位置で $C$ が真なものがある。
:::

::: proof
三つの $\tau$ は単調である（$\mathrm{pre}_{\exists}$, $\mathrm{pre}_{\forall}$ が単調なので）。

**Step 1.** 【主張：1・2 の集合は不動点で、$\tau(Y)\subset Y$ となる $Y$ に含まれる】 不動点であることは \ref{logic:ctl-valid.2}（一歩分の展開）。後半：$\tau(Y)\subset Y$ とし、$Y$ を真理集合とする新しい命題変数 $q$ を考えると、$D\vee(C\wedge\mathbf{EX}q)\to q$（2 では $\mathbf{AX}q$）がこのモデルのすべての状態で真。\ref{logic:ctl-valid.3}・\ref{logic:ctl-valid.4} の証明はこのモデルの中だけで通る（4 の経路はモデルが有限なので順序で選べる）ので、$\mathbf{E}(C\,\mathbf{U}\,D)\to q$（2 では $\mathbf{A}$）もすべての状態で真、すなわち集合が $Y$ に含まれる。\ref{logic:finite-fixpoint.1} と合わせて最小の不動点。

**Step 2.** 【主張：$P\defeq\{s:s$ から $C$ がずっと真な経路がある$\}$ は 3 の最大の不動点】 $P\subset\tau(P)$：$s\in P$ の経路 $\pi$ で $s\in X_{C}$、$\pi(1)\in P$（$\pi$ の 1 以降）なので $s\in\mathrm{pre}_{\exists}(P)$。逆に $Y\subset\tau(Y)$ なら、$s\in Y$ から、$Y$ の中で $Y$ に属する後続を（順序で最初のものを）選び続けて経路を作れ、その上で $C$ はずっと真なので $Y\subset P$。とくに $\tau(P)\subset\tau(\tau(P))$ から $\tau(P)\subset P$ で、$P$ は不動点。\ref{logic:finite-fixpoint.2} と合わせて最大の不動点。

**Step 3.** 【主張：$\llbracket\mathbf{EG}C\rrbracket=P$】 $\mathbf{EG}C=\neg\mathbf{AF}\neg C$ で、$s\not\models\mathbf{AF}\neg C\iff s$ からのある経路で、どの位置でも $\neg C$ が偽 $\iff s\in P$。
:::

::: proposition 基本演算子への書き換え {#logic:ctl-adequate keywords="A(C U D) is equivalent to not E(not D U (not C and not D)) and not EG not D" index="CTL の基本演算子|しーてぃーえるのきほんえんざんし"}
すべてのモデル（有限とは限らない）で
$$
\mathbf{A}(C\,\mathbf{U}\,D)\leftrightarrow\neg\mathbf{E}(\neg D\,\mathbf{U}\,(\neg C\wedge\neg D))\wedge\neg\mathbf{EG}\neg D.
$$
:::

::: proof
**Step 1.** 【主張：$s\not\models\mathbf{A}(C\,\mathbf{U}\,D)\iff$ (a) または (b)】 (a) $s=s_{0}R\cdots Rs_{k}$ で、$i\le k$ で $D$ が偽、$i<k$ で $C$ が真、$s_{k}$ で $C$ が偽となる列がある。(b) $s$ からの経路で $D$ がずっと偽なものがある。⇐：(a) の列を（全域性で）延ばした経路でも (b) の経路でも、「$\pi(n)\models D$ かつ $i<n$ で $C$」となる $n$ はない。⇒：条件を満たさない経路 $\pi$ をとる。$D$ が真な最初の位置 $m$ があれば、条件が $m$ で満たされないので $m$ より前に $C$ が偽な位置があり、その最初の位置 $k$ までの列が (a)。$D$ がずっと偽なら (b)。

**Step 2.** 【主張：(a)$\iff s\models\mathbf{E}(\neg D\,\mathbf{U}\,(\neg C\wedge\neg D))$、(b)$\iff s\models\mathbf{EG}\neg D$】 前者は $\mathbf{E}\mathbf{U}$ の定義そのもの（列の各位置で $\neg D$、最後で $\neg C\wedge\neg D$）。後者は \ref{logic:ctl-fixpoints.3} の後半と同じ議論（$\mathbf{EG}\neg D=\neg\mathbf{AF}D$）。

::: hypcheck
- 有限性は使っていない。ただし Step 1 の ⇐ で (a) の列を経路に延ばすところで、無限のモデルでは DC を使う（\ref{logic:page-ctl} の約束どおり）。有限のモデルでは状態の順序で後続を選べばよい。
:::
:::

## ラベル付けアルゴリズム {#logic:sec-ctlmc-labelling}

::: definition 二つの手続き {#logic:ctl-eu-eg-procedures keywords="linear-time procedures CheckEU (backward search) and CheckEG (counting successors and deleting)" index="ラベル付けアルゴリズム|らべるづけあるごりずむ"}
$X_{C},X_{D}\subset S$ を入力とする。
- **CheckEU**$(X_{C},X_{D})$：$Z\defeq X_{D}$、待ち行列 $Q$ に $X_{D}$ の元をすべて入れる。$Q$ が空でないあいだ、$t$ を取り出し、$t$ の各前者 $s$ について、$s\in X_{C}$ かつ $s\notin Z$ なら $s$ を $Z$ に加えて $Q$ に入れる。最後の $Z$ を返す。
- **CheckEG**$(X_{C})$：$Z\defeq X_{C}$。各 $s\in Z$ について $c(s)\defeq\lvert\{t\in Z:sRt\}\rvert$ を後続のリストを数えて求める。$c(s)=0$ の $s$ をすべて $Q$ に入れる。$Q$ が空でないあいだ、$t$ を取り出して $Z$ から除き、$t$ の各前者 $s$ で $s\in Z$ なものについて $c(s)$ を 1 減らし、$0$ になったら $Q$ に入れる。最後の $Z$ を返す。
:::

::: theorem 二つの手続きの正しさと計算量 {#logic:ctl-eu-eg-correct keywords="correctness and linear running time of CheckEU and CheckEG"}
1. CheckEU$(\llbracket C\rrbracket,\llbracket D\rrbracket)$ は $\llbracket\mathbf{E}(C\,\mathbf{U}\,D)\rrbracket$ を返す。
2. CheckEG$(\llbracket C\rrbracket)$ は $\llbracket\mathbf{EG}C\rrbracket$ を返す。
3. どちらも基本操作 $O(\lvert S\rvert+\lvert R\rvert)$ 回で止まる。
:::

::: proof
**Step 1.** 【主張：1】 $E\defeq\llbracket\mathbf{E}(C\,\mathbf{U}\,D)\rrbracket$ とする。$Z$ に入るのは、$X_{D}$ の元か、$Z$ の元 $t$ の前者で $X_{C}$ に属するものだけなので、入った順の帰納法で $Z\subset E$（$sRt$, $s\models C$, $t\in E$ なら $s\in E$）。逆に $s\in E$ の列 $s=s_{0}R\cdots Rs_{k}$ について、$j=k,k-1,\dots,0$ の順に $s_{j}\in Z$ を示す：$s_{k}\in X_{D}\subset Z$。$s_{j+1}\in Z$ なら $s_{j+1}$ はいつか $Q$ に入って取り出され、そのとき前者 $s_{j}\in X_{C}$ は（まだなら）$Z$ に加えられる。

**Step 2.** 【主張：2】 $P\defeq\llbracket\mathbf{EG}C\rrbracket$ とする。(i) 不変条件「$c(s)=\lvert\{t\in Z:sRt\}\rvert$（$s\in Z$）」は、$t$ を $Z$ から除くときに $Z$ に残る前者の $c$ だけを 1 減らすことで保たれる。(ii) 不変条件「$P\subset Z$」：$Q$ に入るのは $c(t)=0$、すなわち $Z$ の中に後続がない $t$ である。$Z\supset P$ で、$t\in P$ なら \ref{logic:ctl-fixpoints.3} の Step 2 から $P$ の中に後続があるので、$t\notin P$。よって $P$ の元は除かれない。(iii) 終了時には $Q$ が空なので、$Z$ のどの元も $Z$ の中に後続をもつ（$c$ が $0$ になった元は $Q$ に入れられ、取り出されて除かれている）。$Z\subset X_{C}$ と合わせて $Z\subset\tau(Z)$（\ref{logic:ctl-fixpoints.3} の $\tau$）、\ref{logic:finite-fixpoint.2} で $Z\subset P$。(ii) と合わせて $Z=P$。

**Step 3.** 【主張：3】 CheckEU：各状態は高々 1 回 $Q$ に入る（$Z$ に入るときだけ）ので、取り出しは $\lvert S\rvert$ 回以下、前者のリストを見る総歩数は各矢について 1 回で $\lvert R\rvert$ 以下。CheckEG：$c$ の初期化は後続のリストの総歩数 $\lvert R\rvert$。各状態は高々 1 回 $Q$ に入る（$c$ が $0$ になる瞬間は一度だけ）ので、除かれるのは $\lvert S\rvert$ 回以下、前者のリストの総歩数は $\lvert R\rvert$ 以下。配列の初期化は $\lvert S\rvert$ 回。
:::

::: example CheckEG の動き {#logic:ctlmc-eg-example}
状態 $0,1,2,3$、$R=\{(0,1),(0,3),(1,2),(2,1),(3,3)\}$、$\llbracket C\rrbracket=\{0,1,3\}$ とする。初め $Z=\{0,1,3\}$、$c(0)=2$（後続 $1,3$）、$c(1)=0$（後続 $2\notin Z$）、$c(3)=1$。$Q=\{1\}$。$1$ を除き、前者 $0\in Z$ の $c(0)$ を $1$ に減らす。$Q$ は空になり、$\llbracket\mathbf{EG}C\rrbracket=\{0,3\}$。実際、$0$ からは $0,3,3,\dots$ で $C$ がずっと真、$1$ からは必ず $2$（$C$ が偽）に行く。
:::

::: theorem ラベル付けアルゴリズム {#logic:ctl-labelling keywords="CTL model checking in time O(|F|(|S|+|R|))" index="CTL のモデル検査|しーてぃーえるのもでるけんさ, モデル検査|もでるけんさ" refname="CTL のモデル検査の計算量"}
有限のモデル $\mathcal{M}=(S,R,V)$ と CTL の論理式 $F$ について、$F$ の部分論理式を小さい順に並べ、各部分論理式 $G$ について $\llbracket G\rrbracket$ を次で計算する。
- $p$：$V$ から。$\bot$：$\varnothing$。$G_{1}\to G_{2}$：$(S\setminus\llbracket G_{1}\rrbracket)\cup\llbracket G_{2}\rrbracket$。
- $\mathbf{AX}G_{1}$：各 $s$ の後続がすべて $\llbracket G_{1}\rrbracket$ に属するかを調べる。
- $\mathbf{E}(G_{1}\,\mathbf{U}\,G_{2})$：CheckEU$(\llbracket G_{1}\rrbracket,\llbracket G_{2}\rrbracket)$。
- $\mathbf{A}(G_{1}\,\mathbf{U}\,G_{2})$：$X_{1}\defeq$ CheckEU$(S\setminus\llbracket G_{2}\rrbracket,\ (S\setminus\llbracket G_{1}\rrbracket)\cap(S\setminus\llbracket G_{2}\rrbracket))$、$X_{2}\defeq$ CheckEG$(S\setminus\llbracket G_{2}\rrbracket)$ として $S\setminus(X_{1}\cup X_{2})$。

このとき最後に得られる集合は $\llbracket F\rrbracket$ で、全体の基本操作の回数は $O(\lvert F\rvert\cdot(\lvert S\rvert+\lvert R\rvert))$ である。
:::

::: proof
**Step 1.** 【主張：各部分論理式で正しい集合が得られる】 部分論理式の大きさについての帰納法。命題変数・$\bot$・$\to$ は真理の定義。$\mathbf{AX}$ は定義。$\mathbf{EU}$ は \ref{logic:ctl-eu-eg-correct.1}。$\mathbf{AU}$ は \ref{logic:ctl-adequate} と \ref{logic:ctl-eu-eg-correct} の 1・2（$\llbracket\neg G\rrbracket=S\setminus\llbracket G\rrbracket$）。

**Step 2.** 【主張：計算量】 部分論理式は $\lvert F\rvert$ 個以下。各部分論理式で行う処理は、補集合・和・共通部分（$O(\lvert S\rvert)$）、後続のリストの走査（$O(\lvert S\rvert+\lvert R\rvert)$）、CheckEU・CheckEG を高々 2 回（\ref{logic:ctl-eu-eg-correct.3}）で、どれも $O(\lvert S\rvert+\lvert R\rvert)$。合計 $O(\lvert F\rvert\cdot(\lvert S\rvert+\lvert R\rvert))$。
:::

::: remark
1. 計算量は CTL の論理式の大きさとモデルの大きさの**積**で、どちらについても線形である。実際の検証では $\lvert S\rvert$ が状態爆発で巨大になるので、状態の集合を二分決定図（BDD）で表し、\ref{logic:finite-fixpoint} のくり返しをそのまま集合の演算で行う**記号的モデル検査**（McMillan 1993）が使われる。このサイトでは扱わない。
2. **公平性**：「無限回 $f$ を通る経路だけを考える」という制約（公平性制約）のもとでの CTL のモデル検査も、強連結成分を使って多項式時間（CTL の論理式・モデル・制約の個数の積の程度）でできることが知られている（Clarke–Emerson–Sistla 1986, Emerson–Lei 1986）。このサイトでは証明していない。
3. LTL のモデル検査（「すべての経路で $\varphi$」の判定）は PSPACE 完全で（Sistla–Clarke 1985）、CTL* のモデル検査も PSPACE 完全であることが知られている。CTL が線形時間で済むのは、各部分論理式が状態の集合として独立に計算できる（経路の記憶が要らない）からである。
:::

::: intuition
**印をつけて広げる。** CheckEU は「ゴールから逆向きに、条件を満たす状態へ印を広げる」探索、CheckEG は「行き止まりを順に刈り取る」除去である。前者は最小不動点を下から（空集合から）積み上げ、後者は最大不動点を上から（$X_{C}$ から）削っている。\ref{logic:finite-fixpoint} のくり返しを素直に行うと各段で全体を見直すので $O(\lvert S\rvert\cdot(\lvert S\rvert+\lvert R\rvert))$ かかるが、変化した場所の周りだけを見直す（待ち行列）ことで線形になる。

**高い視点：不動点の計算と束。** 状態の集合 $\mathcal{P}(S)$ は完備束で、CTL の各演算子はこの束の上の単調な写像の最小・最大の不動点である。モデル検査はこの束の中での不動点の計算であり、どの不動点も束の高さ（$\lvert S\rvert$）回のくり返しで求まる。最小と最大の不動点を入れ子にした一般の式（μ 計算）では、入れ子の深さに応じてくり返しが掛け算で増え、それをどう減らすかが μ 計算のモデル検査（パリティゲーム）の問題になる。
:::

## 問題 {#logic:sec-ctlmc-problems}

::: problem {#logic:prob-ctlmc-af}
有限のモデルで $\llbracket\mathbf{AF}C\rrbracket$ を $O(\lvert S\rvert+\lvert R\rvert)$ で直接計算する手続きを、CheckEG と同じく後続の個数を数える方法で作り、正しさを示せ。
:::

::: solution
$\llbracket\mathbf{AF}C\rrbracket$ は $\tau(Z)=X_{C}\cup\mathrm{pre}_{\forall}(Z)$ の最小の不動点（\ref{logic:ctl-fixpoints.2} で $D=C$, $C=\top$）。手続き：$Z\defeq X_{C}$、$Q\defeq X_{C}$、各 $s$ について $d(s)\defeq$（後続の個数）。$Q$ から $t$ を取り出し、$t$ の各前者 $s\notin Z$ について $d(s)$ を 1 減らし、$0$ になったら $s$ を $Z$ と $Q$ に加える。$Z$ の元はちょうど一度 $Q$ に入って取り出されるので、$s\notin Z$ について $d(s)$ は「まだ取り出されていない後続の個数」に等しい。よって $s$ が加えられるのはすべての後続が取り出された、つまり $Z$ に入ったときで、$s\in\mathrm{pre}_{\forall}(Z)$。加えた順の帰納法で $Z\subset\llbracket\mathbf{AF}C\rrbracket$（$X_{C}$ の元と、後続がすべて $\llbracket\mathbf{AF}C\rrbracket$ に属する元は $\llbracket\mathbf{AF}C\rrbracket$ に属する）。終了時には $Z$ の元はすべて取り出されているので、$s\notin Z$ なら $d(s)>0$ から、取り出されていない、すなわち $Z$ の外の後続がある。よって $\mathrm{pre}_{\forall}(Z)\subset Z$、$X_{C}\subset Z$ と合わせて $\tau(Z)\subset Z$ で、\ref{logic:finite-fixpoint.1} から $\llbracket\mathbf{AF}C\rrbracket\subset Z$。各状態は 1 回だけ取り出され、各矢で $d$ は高々 1 回減るので $O(\lvert S\rvert+\lvert R\rvert)$。
:::

::: problem {#logic:prob-ctlmc-iteration-length}
\ref{logic:finite-fixpoint.2} のくり返し $Z'_{k}$ で $\llbracket\mathbf{EG}C\rrbracket$ を求めるとき、$\lvert S\rvert-1$ 回近くのくり返しが必要になるモデルの例を挙げよ。
:::

::: solution
状態 $0,1,\dots,n$、$R=\{(i,i+1):i<n\}\cup\{(n,n)\}$、$C$ は $0,\dots,n-1$ で真、$n$ で偽とする。$\tau(Z)=X_{C}\cap\mathrm{pre}_{\exists}(Z)$ で、$Z'_{1}=\{0,\dots,n-1\}$、$Z'_{2}=\{0,\dots,n-2\}$、…、$Z'_{k}=\{0,\dots,n-k\}$ と一つずつ減り、$Z'_{n+1}=\varnothing$ で止まる（$\llbracket\mathbf{EG}C\rrbracket=\varnothing$）。くり返しは $n+1=\lvert S\rvert$ 回要る。CheckEG では $n-1$ を除いた後に $n-2$ の $c$ が $0$ になり…と、同じ順で除かれるが、各段で全体を見直さないので合計 $O(n)$ で済む。
:::
