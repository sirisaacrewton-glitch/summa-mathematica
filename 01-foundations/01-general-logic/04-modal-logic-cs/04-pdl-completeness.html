# PDL の公理系と完全性 {#logic:page-pdl-completeness keywords="axiomatization of PDL, Segerberg axioms, induction axiom, soundness, completeness, Kozen-Parikh, finite canonical model, decidability, complexity of PDL"}

前のページ（\ref{logic:page-pdl}）では PDL の意味論と小モデル定理を扱った。このページでは**セガーバーグの公理系**を与え、それが**健全**であること（定理はすべて妥当）と**完全**であること（妥当な論理式はすべて定理）を示す。完全性の証明は**コーゼン–パリク**の方法による：示したい論理式のフィッシャー–ラドナー閉包の上の「極大な集合」を状態とする有限のモデルを作る。様相論理の有限の\term[極大無矛盾集合]{logic:modal-mcs}による完全性の証明（\ref{logic:page-modal-completeness}）と同じ形だが、反復 $\alpha^{\ast}$ の扱いで**帰納の公理**を使うところが新しい。最後に、定理であるかどうかが決定可能であることと、素朴な決定手続きの計算量を述べる。

> 参考：『コンピュータサイエンスにおける様相論理』（ユーザー指定の参考書。本文のテキストは未入手のため、構成は標準的な内容によった）。公理系はセガーバーグ（1977）、完全性の証明は Kozen–Parikh, *An elementary proof of the completeness of PDL*, Theoret. Comput. Sci. 14 (1981) の方法による。Harel–Kozen–Tiuryn『Dynamic Logic』第 7 章も参照した。

## 記法と定義の確認 {#logic:sec-pdlc-notation}

::: notation
- PDL のプログラム・論理式・モデル・真理、妥当式（\ref{logic:pdl-valid}）、大きさ $\lvert A\rvert$、フィッシャー–ラドナー閉包 $\mathrm{FL}(A)$ とその大きさの評価（\ref{logic:fl-size}）は \ref{logic:page-pdl} のとおり。$\langle\alpha\rangle A\defeq\neg[\alpha]\neg A$。
- 有限個の論理式の連言 $A_{1}\wedge\cdots\wedge A_{n}$ と選言 $A_{1}\vee\cdots\vee A_{n}$ は、括弧のつけ方と順序によらず恒真式として同値なので、どれか一つに決めて書く。空の連言は $\top$、空の選言は $\bot$。有限集合 $X$ の元の連言を $\bigwedge X$、選言を $\bigvee X$ と書く。
- **公理系**：$\ZF$ で行う。選択公理は使わない（作る集合はすべて有限で、明示的に定まる）。
:::

## 公理系と健全性 {#logic:sec-pdlc-axioms}

::: definition PDL の恒真式 {#logic:pdl-tautology keywords="tautology instance in PDL, propositional valuation of PDL formulas" index="恒真式（PDL）|こうしんしきぴーでぃーえる"}
$[\alpha]B$ の形の論理式全体を $\mathrm{Box}$ とする。写像 $V\colon\mathrm{PV}\cup\mathrm{Box}\to\{0,1\}$ を命題的付値という。論理式の構成についての再帰で
$$
\bar{V}(p)=V(p),\qquad\bar{V}(\bot)=0,\qquad\bar{V}([\alpha]B)=V([\alpha]B),\qquad\bar{V}(B\to C)=\max\{1-\bar{V}(B),\bar{V}(C)\}
$$
と延長する。すべての命題的付値 $V$ で $\bar{V}(A)=1$ となる論理式 $A$ を **PDL の恒真式**という。$[\alpha]B$ は中身を見ずに一つの命題変数のように扱う（様相論理の場合の \ref{logic:modal-tautology} と同じ）。
:::

::: definition セガーバーグの公理系 {#logic:pdl-axioms keywords="Segerberg's axiom system for PDL" index="セガーバーグの公理系|せがーばーぐのこうりけい, PDL の公理系|ぴーでぃーえるのこうりけい"}
次の論理式（すべてのプログラム $\alpha,\beta$ と論理式 $A,B$ について）を**公理**とする。
1. PDL の恒真式。
2. （K）$[\alpha](A\to B)\to([\alpha]A\to[\alpha]B)$。
3. （合成）$[\alpha;\beta]A\leftrightarrow[\alpha][\beta]A$。
4. （選択）$[\alpha\cup\beta]A\leftrightarrow[\alpha]A\wedge[\beta]A$。
5. （テスト）$[B?]A\leftrightarrow(B\to A)$。
6. （反復）$[\alpha^{\ast}]A\leftrightarrow A\wedge[\alpha][\alpha^{\ast}]A$。
7. （帰納）$A\wedge[\alpha^{\ast}](A\to[\alpha]A)\to[\alpha^{\ast}]A$。

推論規則はモーダスポネンス（$A$ と $A\to B$ から $B$）と**必然化**（$A$ から $[\alpha]A$。$\alpha$ はどのプログラムでもよい）の二つとする。公理から推論規則で得られる論理式を**定理**といい、$\vdash A$ と書く。$\vdash\neg\bigwedge X$ でない有限集合 $X$ を**無矛盾**という。
:::

::: remark
公理はすべて図式で、\term[一様代入]{logic:modal-substitution}の規則はない（どの $\alpha,A,B$ についての形も最初から公理である）。2〜7 は \ref{logic:pdl-valid} の 1〜6 の論理式をそのまま公理にしたものである。
:::

::: theorem PDL の健全性 {#logic:pdl-soundness keywords="soundness of PDL: theorems are valid" index="健全性（PDL）|けんぜんせいぴーでぃーえる" refname="PDL の健全性"}
$\vdash A$ ならば $A$ は妥当である。
:::

::: proof
**Step 1.** 【主張：PDL の恒真式は妥当】 モデル $\mathcal{M}$ と状態 $w$ を固定し、$X\in\mathrm{PV}\cup\mathrm{Box}$ について $V_{w}(X)\defeq1$（$\mathcal{M},w\models X$ のとき）、$\defeq0$（そうでないとき）とおく。$\mathrm{PV}\cup\mathrm{Box}$ の元と $\bot$ から $\to$ で組み立てた形について帰納法で、$\bar{V}_{w}(B)=1\iff\mathcal{M},w\models B$：$p$ と $[\alpha]B$ は $V_{w}$ の定義、$\bot$ は両辺とも偽、$B\to C$ は真理の定義の $\to$ の行と $\bar{V}$ の $\to$ の行が同じ形だから。恒真式 $A$ では $\bar{V}_{w}(A)=1$ なので $\mathcal{M},w\models A$。

**Step 2.** 【主張：公理 2〜7 は妥当】 \ref{logic:pdl-valid} の 1〜6。

**Step 3.** 【主張：推論規則は妥当性を保つ】 $A$ と $A\to B$ がすべての状態で真なら、真理の定義の $\to$ の行から $B$ もすべての状態で真。$A$ がすべてのモデルのすべての状態で真なら、どの状態 $w$ のどの $R_{\alpha}$ の後続 $v$ でも $A$ が真なので、$w\models[\alpha]A$。

定理の導出の長さについての帰納法で、定理はすべて妥当である。
:::

::: lemma 導出の基本性質 {#logic:pdl-normality keywords="derived rules of PDL: tautological consequence, monotonicity of [alpha] and <alpha>, distribution over disjunction, duals of the axioms" index="導出の基本性質（PDL）|どうしゅつのきほんせいしつぴーでぃーえる"}
1. $\vdash A_{1},\dots,\vdash A_{n}$ で $A_{1}\wedge\cdots\wedge A_{n}\to B$ が PDL の恒真式ならば $\vdash B$。
2. $\vdash A\to B$ ならば $\vdash[\alpha]A\to[\alpha]B$ かつ $\vdash\langle\alpha\rangle A\to\langle\alpha\rangle B$。
3. $\vdash\neg[\alpha]A\leftrightarrow\langle\alpha\rangle\neg A$。また $\vdash\neg A$ ならば $\vdash\neg\langle\alpha\rangle A$。
4. $n\ge0$ について $\vdash\langle\alpha\rangle(A_{1}\vee\cdots\vee A_{n})\leftrightarrow\langle\alpha\rangle A_{1}\vee\cdots\vee\langle\alpha\rangle A_{n}$。とくに $\vdash\neg\langle\alpha\rangle\bot$。
5. $\vdash\langle\alpha;\beta\rangle A\leftrightarrow\langle\alpha\rangle\langle\beta\rangle A$、$\vdash\langle\alpha\cup\beta\rangle A\leftrightarrow\langle\alpha\rangle A\vee\langle\beta\rangle A$、$\vdash\langle B?\rangle A\leftrightarrow B\wedge A$。
:::

::: proof
**Step 1.** 【主張：恒真式による推論と、$[\alpha]$・$\langle\alpha\rangle$ の単調性】 1：$A_{1}\to(A_{2}\to\cdots(A_{n}\to B)\cdots)$ も PDL の恒真式（$\bar{V}$ の値は同じ）なので公理で、モーダスポネンスを $n$ 回使う。2：必然化で $\vdash[\alpha](A\to B)$、公理 K とモーダスポネンスで $\vdash[\alpha]A\to[\alpha]B$。後半は、$\vdash\neg B\to\neg A$（1）から前半で $\vdash[\alpha]\neg B\to[\alpha]\neg A$、対偶をとって（1）$\vdash\neg[\alpha]\neg A\to\neg[\alpha]\neg B$。これが $\langle\alpha\rangle A\to\langle\alpha\rangle B$ である。

**Step 2.** 【主張：$\neg[\alpha]$ と $\langle\alpha\rangle\neg$ は同値で、矛盾は $\langle\alpha\rangle$ の中でも矛盾】 $\langle\alpha\rangle\neg A=\neg[\alpha]\neg\neg A$ で、$\vdash A\leftrightarrow\neg\neg A$ と 2 から $\vdash[\alpha]A\leftrightarrow[\alpha]\neg\neg A$。1 で前半。後半：$\vdash\neg A$ に必然化で $\vdash[\alpha]\neg A$、$\neg\langle\alpha\rangle A=\neg\neg[\alpha]\neg A$ なので 1。

**Step 3.** 【主張：$\langle\alpha\rangle$ は有限の選言に分配する】 $\leftarrow$ は各 $A_{i}\to A_{1}\vee\cdots\vee A_{n}$ に 2 を使い、1 でまとめる。$\to$ は対偶 $[\alpha]\neg A_{1}\wedge\cdots\wedge[\alpha]\neg A_{n}\to[\alpha]\neg(A_{1}\vee\cdots\vee A_{n})$ を示せばよい。恒真式 $\neg A_{1}\to(\neg A_{2}\to\cdots(\neg A_{n}\to\neg(A_{1}\vee\cdots\vee A_{n}))\cdots)$ に必然化をかけ、公理 K とモーダスポネンスを $n$ 回使うと $[\alpha]\neg A_{1}\to(\cdots\to[\alpha]\neg(A_{1}\vee\cdots\vee A_{n}))$。$n=0$ のときは恒真式 $\neg\bot$ に必然化をかけた $\vdash[\alpha]\neg\bot$ で、これは 1 により $\vdash\neg\langle\alpha\rangle\bot$ と同じ。

**Step 4.** 【主張：公理 3〜5 の $\langle\alpha\rangle$ 版】 公理 3〜5 の $A$ に $\neg A$ を入れて否定をとる。合成：$\neg[\alpha;\beta]\neg A\leftrightarrow\neg[\alpha][\beta]\neg A$ で、$\langle\alpha\rangle\langle\beta\rangle A=\neg[\alpha]\neg\neg[\beta]\neg A$ と 2（$\neg\neg[\beta]\neg A\leftrightarrow[\beta]\neg A$）。選択：$\neg([\alpha]\neg A\wedge[\beta]\neg A)\leftrightarrow\langle\alpha\rangle A\vee\langle\beta\rangle A$ は恒真式。テスト：$\neg(B\to\neg A)\leftrightarrow B\wedge A$ は恒真式。
:::

## 極大な集合 {#logic:sec-pdlc-atoms}

以下この節と次の節では、論理式 $A$ を一つ固定し、$\Sigma\defeq\mathrm{FL}(A)$、$\Phi\defeq\Sigma\cup\{\neg B:B\in\Sigma\}$ とおく。\ref{logic:fl-size} から $\Sigma$ は有限で $\lvert\Sigma\rvert\le\lvert A\rvert$。

::: definition 極大な集合 {#logic:pdl-atoms keywords="maximal consistent subsets of the Fischer-Ladner closure (atoms)" index="極大な集合（PDL）|きょくだいなしゅうごうぴーでぃーえる"}
$X\subset\Phi$ が無矛盾で、各 $B\in\Sigma$ について $B\in X$ または $\neg B\in X$ となるとき、$X$ を**極大**という。極大な集合全体を $W$ とする。$w\in W$ について $\widehat{w}\defeq\bigwedge w$、$Y\subset W$ について $\widehat{Y}\defeq\bigvee\{\widehat{w}:w\in Y\}$（$\widehat{\varnothing}=\bot$）とおく。
:::

::: lemma 極大な集合の性質 {#logic:pdl-atom-properties keywords="properties of maximal sets: exclusive, exhaustive, B is equivalent to the disjunction of the maximal sets containing B"}
1. $w\in W$、$B\in\Sigma$ について、$B\in w$ と $\neg B\in w$ のちょうど一方が成り立つ。
2. $w\in W$、$C_{1},\dots,C_{m}\in w$、$\vdash C_{1}\wedge\cdots\wedge C_{m}\to D$、$D\in\Phi$ ならば $D\in w$。
3. 無矛盾な $X\subset\Phi$ は、ある $w\in W$ に含まれる。
4. $\vdash\widehat{W}$。また $w\neq v$ なら $\vdash\neg(\widehat{w}\wedge\widehat{v})$。とくに $Y\subset W$ について $\vdash\neg\widehat{Y}\leftrightarrow\widehat{W\setminus Y}$。
5. $B\in\Sigma$ ならば、$Y_{B}\defeq\{w\in W:B\in w\}$ について $\vdash B\leftrightarrow\widehat{Y_{B}}$ かつ $\vdash\neg B\leftrightarrow\widehat{W\setminus Y_{B}}$。
:::

::: proof
1〜3 は様相論理の場合（\ref{logic:modal-mcs-properties}）と同じ証明で、そこで使ったのは「定理から恒真式で導ける論理式は定理」（\ref{logic:pdl-normality.1}）だけである。念のため書くと次のとおり。

**Step 1.** 【主張：$B,\neg B$ のちょうど一方を含み、定理で閉じ、無矛盾な集合は極大な集合に広がる】 1：極大性から少なくとも一方が属し、両方属すると $\bigwedge w$ から恒真式で $\bot$ が従うので $\vdash\neg\widehat{w}$ となり無矛盾性に反する。2：$D\notin w$ とする。$D\in\Sigma$ なら 1 で $\neg D\in w$。$D=\neg D'$（$D'\in\Sigma$）なら極大性で $D'\in w$。どちらでも $w$ に $\neg D$ と恒真式で同値な元があり、仮定と合わせて $\vdash\neg\widehat{w}$ となり矛盾。3：$\Sigma=\{B_{1},\dots,B_{k}\}$ と並べ、$X_{0}\defeq X$、$X_{i}\cup\{B_{i+1}\}$ が無矛盾なら $X_{i+1}\defeq X_{i}\cup\{B_{i+1}\}$、そうでなければ $X_{i+1}\defeq X_{i}\cup\{\neg B_{i+1}\}$ とする。両方とも矛盾すると $\vdash\neg(\bigwedge X_{i}\wedge B_{i+1})$ と $\vdash\neg(\bigwedge X_{i}\wedge\neg B_{i+1})$ から恒真式で $\vdash\neg\bigwedge X_{i}$ となるので、帰納法で各 $X_{i}$ は無矛盾。$X_{k}$ が求めるもの。

**Step 2.** 【主張：$\vdash\widehat{W}$】 符号 $\varepsilon\in\{+,-\}^{k}$ ごとに $X_{\varepsilon}\defeq\{\varepsilon_{i}B_{i}:i\le k\}$（$+B\defeq B$, $-B\defeq\neg B$）とおく。$\bigvee_{\varepsilon}\bigwedge X_{\varepsilon}$ は PDL の恒真式（どの命題的付値でも、各 $i$ で $\bar{V}(\varepsilon_{i}B_{i})=1$ となる $\varepsilon$ がある）。$X_{\varepsilon}$ が無矛盾なら $X_{\varepsilon}\in W$、矛盾するなら $\vdash\neg\bigwedge X_{\varepsilon}$。\ref{logic:pdl-normality.1} でこれらをまとめると $\vdash\bigvee\{\bigwedge X_{\varepsilon}:X_{\varepsilon}\in W\}$ で、これは $\widehat{W}$ の選言項の一部からなるので $\vdash\widehat{W}$。

**Step 3.** 【主張：4 の残りと 5】 $w\neq v$ なら一方にだけ属する $C\in\Phi$ がある。$C\in w\setminus v$ とし、$C=B_{j}$ なら極大性で $\neg B_{j}\in v$、$C=\neg B_{j}$ なら $B_{j}\in v$。どちらも $\widehat{w}\wedge\widehat{v}$ が $B_{j}$ と $\neg B_{j}$ を含むので $\vdash\neg(\widehat{w}\wedge\widehat{v})$。$\vdash\widehat{W}$ と合わせ、恒真式で $\vdash\neg\widehat{Y}\leftrightarrow\widehat{W\setminus Y}$。5：$w\in Y_{B}$ なら $\vdash\widehat{w}\to B$、$w\notin Y_{B}$ なら 1 で $\neg B\in w$ なので $\vdash\widehat{w}\to\neg B$。$\vdash\widehat{W}$ と合わせて恒真式で両方が従う。
:::

## 完全性 {#logic:sec-pdlc-completeness}

::: definition 有限のカノニカルモデル {#logic:pdl-canonical keywords="finite canonical model of PDL built from maximal subsets of FL(A)" index="有限のカノニカルモデル（PDL）|ゆうげんのかのにかるもでるぴーでぃーえる"}
$W$ が空でないとき、PDL のモデル $\mathcal{M}^{c}=(W,\{R_{a}\}_{a\in\Pi_{0}},V)$ を
$$
wR_{a}v\iff\widehat{w}\wedge\langle a\rangle\widehat{v}\text{ が無矛盾},\qquad(w,p)\in V\iff p\in w
$$
で定める。複合プログラムの関係 $R_{\alpha}$ は $\mathcal{M}^{c}$ の中で \ref{logic:pdl-semantics} の規則で定まるものとする。
:::

::: remark
原子プログラムの関係だけを「無矛盾性」で定め、$\alpha;\beta$, $\alpha\cup\beta$, $\alpha^{\ast}$, $B?$ の関係は意味論の規則で組み立てる。これはフィルトレーション（\ref{logic:pdl-filtration}）と同じ方針である。とくに $R_{\alpha^{\ast}}$ は $(R_{\alpha})^{\ast}$ そのものなので、反復の意味論が正しく扱えるかどうかは、次の補題の Step 4 にかかっている。
:::

::: lemma コーゼン–パリクの補題 {#logic:pdl-kozen-parikh keywords="Kozen-Parikh lemma: truth lemma for the finite canonical model of PDL" index="コーゼン–パリクの補題|こーぜんぱりくのほだい" refname="コーゼン–パリクの補題"}
$W$ が空でないとし、$\mathcal{M}^{c}$ で考える。
1. （真理補題）すべての $B\in\Sigma$ と $w\in W$ について、$B\in w\iff\mathcal{M}^{c},w\models B$。
2. $[\alpha]B\in\Sigma$ ならば、すべての $w,v\in W$ について
   - (a) $wR_{\alpha}v$ かつ $[\alpha]B\in w$ ならば $B\in v$。
   - (b) $\widehat{w}\wedge\langle\alpha\rangle\widehat{v}$ が無矛盾ならば $wR_{\alpha}v$。
:::

::: proof
自然数 $n$ についての帰納法で、「大きさ $n$ の論理式 $B$ についての 1」と「大きさ $n$ のプログラム $\alpha$ についての 2」を同時に示す。1 の $[\alpha]B$ の場合は 2 の $\alpha$（$\lvert\alpha\rvert<\lvert[\alpha]B\rvert$）と 1 の $B$ だけを使い、2 の $\alpha$ は 2 の $\alpha$ の直接の部分プログラムと、1 の $\alpha$ の中のテスト $C?$ の $C$（$\lvert C\rvert<\lvert C?\rvert\le\lvert\alpha\rvert$）だけを使うので、帰納法の仮定の範囲に収まる。以下、$\Sigma$ が FL 閉であることを、使うたびに表の行で示す。

**Step 1（1 の場合）.** 【主張：2 を仮定すれば 1 が成り立つ】 命題変数は $V$ の定義。$\bot$：$\bot\in w$ なら $\vdash\neg\widehat{w}$ となるので $\bot\notin w$、両辺とも偽。$B\to C$：$B,C\in\Sigma$（表の $\to$ の行）で、\ref{logic:pdl-atom-properties.2} から $(B\to C)\in w\iff B\notin w$ または $C\in w$（$\vdash(B\to C)\wedge B\to C$, $\vdash\neg B\to(B\to C)$, $\vdash C\to(B\to C)$ と 1 による）、帰納法の仮定で真理の定義と一致する。$[\alpha]B$（$B\in\Sigma$）：

- ⇒：$[\alpha]B\in w$、$wR_{\alpha}v$ なら 2(a) で $B\in v$、帰納法の仮定で $v\models B$。よって $w\models[\alpha]B$。
- ⇐：$[\alpha]B\notin w$ とすると $\neg[\alpha]B\in w$。\ref{logic:pdl-normality.3} と \ref{logic:pdl-atom-properties.5}（$\vdash\neg B\leftrightarrow\widehat{W\setminus Y_{B}}$）と \ref{logic:pdl-normality.2}・\ref{logic:pdl-normality.4} から
$$
\vdash\widehat{w}\to\langle\alpha\rangle\neg B,\qquad\vdash\langle\alpha\rangle\neg B\leftrightarrow\bigvee\{\langle\alpha\rangle\widehat{v}:v\in W,\ B\notin v\}.
$$
すべての $v\notin Y_{B}$ で $\widehat{w}\wedge\langle\alpha\rangle\widehat{v}$ が矛盾するなら、恒真式で $\vdash\neg\widehat{w}$ となり矛盾。よって $B\notin v$ かつ $\widehat{w}\wedge\langle\alpha\rangle\widehat{v}$ が無矛盾な $v$ がある。2(b) で $wR_{\alpha}v$、帰納法の仮定で $v\not\models B$。よって $w\not\models[\alpha]B$。

**Step 2（原子・選択・合成）.** 【主張：$\alpha=a,\ \alpha_{1}\cup\alpha_{2},\ \alpha_{1};\alpha_{2}$ で 2 が成り立つ】

- 原子：(b) は $R_{a}$ の定義。(a) $B\notin v$ なら $\neg B\in v$ で $\vdash\widehat{v}\to\neg B$、\ref{logic:pdl-normality.2} で $\vdash\langle a\rangle\widehat{v}\to\langle a\rangle\neg B$。一方 $[a]B\in w$ と \ref{logic:pdl-normality.3} で $\vdash\widehat{w}\to\neg\langle a\rangle\neg B$。合わせて $\vdash\neg(\widehat{w}\wedge\langle a\rangle\widehat{v})$ となり、$wR_{a}v$ に反する。
- 選択：$[\alpha_{1}]B,[\alpha_{2}]B\in\Sigma$（表の選択の行）。(a) $[\alpha_{1}\cup\alpha_{2}]B\in w$ なら公理 4 と \ref{logic:pdl-atom-properties.2} で $[\alpha_{1}]B,[\alpha_{2}]B\in w$。$wR_{\alpha_{i}}v$ に応じて $\alpha_{i}$ の (a)。(b) \ref{logic:pdl-normality.5} で $\langle\alpha_{1}\cup\alpha_{2}\rangle\widehat{v}\leftrightarrow\langle\alpha_{1}\rangle\widehat{v}\vee\langle\alpha_{2}\rangle\widehat{v}$ なので、$\widehat{w}\wedge\langle\alpha_{i}\rangle\widehat{v}$ のどちらかが無矛盾（両方矛盾なら恒真式で全体も矛盾）。$\alpha_{i}$ の (b) で $wR_{\alpha_{i}}v$。
- 合成：$[\alpha_{1}][\alpha_{2}]B\in\Sigma$（表の合成の行）、$[\alpha_{2}]B\in\Sigma$（$[\alpha_{1}][\alpha_{2}]B$ に $[\alpha]B\Rightarrow B$ の行）。(a) $wR_{\alpha_{1}}uR_{\alpha_{2}}v$、$[\alpha_{1};\alpha_{2}]B\in w$ なら公理 3 で $[\alpha_{1}][\alpha_{2}]B\in w$、$\alpha_{1}$ の (a)（論理式 $[\alpha_{2}]B$）で $[\alpha_{2}]B\in u$、$\alpha_{2}$ の (a) で $B\in v$。(b) \ref{logic:pdl-normality.5} で $\widehat{w}\wedge\langle\alpha_{1}\rangle\langle\alpha_{2}\rangle\widehat{v}$ が無矛盾。\ref{logic:pdl-atom-properties.4} の $\vdash\widehat{W}$ から $\vdash\langle\alpha_{2}\rangle\widehat{v}\leftrightarrow\bigvee_{u\in W}(\widehat{u}\wedge\langle\alpha_{2}\rangle\widehat{v})$、\ref{logic:pdl-normality.2}・\ref{logic:pdl-normality.4} で $\langle\alpha_{1}\rangle$ を各項に配ると、ある $u$ で $\widehat{w}\wedge\langle\alpha_{1}\rangle(\widehat{u}\wedge\langle\alpha_{2}\rangle\widehat{v})$ が無矛盾。すると $\widehat{w}\wedge\langle\alpha_{1}\rangle\widehat{u}$ は無矛盾（\ref{logic:pdl-normality.2} で $\langle\alpha_{1}\rangle(\widehat{u}\wedge\cdots)\to\langle\alpha_{1}\rangle\widehat{u}$）、$\widehat{u}\wedge\langle\alpha_{2}\rangle\widehat{v}$ も無矛盾（矛盾なら \ref{logic:pdl-normality.3} で $\vdash\neg\langle\alpha_{1}\rangle(\widehat{u}\wedge\langle\alpha_{2}\rangle\widehat{v})$）。$\alpha_{1}$ と $\alpha_{2}$ の (b) で $wR_{\alpha_{1}}uR_{\alpha_{2}}v$。

**Step 3（テスト）.** 【主張：$\alpha=C?$ で 2 が成り立つ】 $C\in\Sigma$（表のテストの行）。(a) $wR_{C?}v$ なら $v=w$ かつ $w\models C$、1（$C$ は小さい）で $C\in w$。$[C?]B\in w$ と公理 5 で $C\to B$ が $w$ から導け、$B\in\Sigma$ と \ref{logic:pdl-atom-properties.2} で $B\in w$。(b) \ref{logic:pdl-normality.5} で $\widehat{w}\wedge C\wedge\widehat{v}$ が無矛盾。\ref{logic:pdl-atom-properties.4} から $w=v$。$C\notin w$ なら $\neg C\in w$ で矛盾するので $C\in w$、1 で $w\models C$、よって $wR_{C?}w$。

**Step 4（反復）.** 【主張：$\alpha=\gamma^{\ast}$ で 2 が成り立つ】 $[\gamma][\gamma^{\ast}]B\in\Sigma$（表の反復の行）と $B\in\Sigma$。

- (a) $w=w_{0}R_{\gamma}w_{1}\cdots R_{\gamma}w_{n}=v$ とする。$[\gamma^{\ast}]B\in w_{k}$ なら、公理 6 で $[\gamma][\gamma^{\ast}]B\in w_{k}$、$\gamma$ の (a)（論理式 $[\gamma^{\ast}]B$）で $[\gamma^{\ast}]B\in w_{k+1}$。$k$ についての帰納法で $[\gamma^{\ast}]B\in v$、公理 6 で $B\in v$。
- (b) $Z\defeq\{z\in W:w(R_{\gamma})^{\ast}z\}$ とおく。まず $\vdash\widehat{Z}\to[\gamma]\widehat{Z}$ を示す。そうでないとすると $\widehat{Z}\wedge\neg[\gamma]\widehat{Z}$ が無矛盾で、\ref{logic:pdl-normality.3}・\ref{logic:pdl-atom-properties.4}（$\vdash\neg\widehat{Z}\leftrightarrow\widehat{W\setminus Z}$）・\ref{logic:pdl-normality.2}・\ref{logic:pdl-normality.4} から $\widehat{Z}\wedge\bigvee_{t\notin Z}\langle\gamma\rangle\widehat{t}$ が無矛盾。よって $z\in Z$、$t\notin Z$ で $\widehat{z}\wedge\langle\gamma\rangle\widehat{t}$ が無矛盾なものがあり、$\gamma$ の (b) で $zR_{\gamma}t$、つまり $t\in Z$ となり矛盾する。次に必然化で $\vdash[\gamma^{\ast}](\widehat{Z}\to[\gamma]\widehat{Z})$、公理 7（$A$ に $\widehat{Z}$）とモーダスポネンスで $\vdash\widehat{Z}\to[\gamma^{\ast}]\widehat{Z}$。$w\in Z$ なので $\vdash\widehat{w}\to[\gamma^{\ast}]\widehat{Z}$。ここで $v\notin Z$ とすると、\ref{logic:pdl-atom-properties.4} で $\vdash\widehat{Z}\to\neg\widehat{v}$、\ref{logic:pdl-normality.2} で $\vdash[\gamma^{\ast}]\widehat{Z}\to[\gamma^{\ast}]\neg\widehat{v}$、これは $\neg\langle\gamma^{\ast}\rangle\widehat{v}$ と恒真式で同値なので $\vdash\neg(\widehat{w}\wedge\langle\gamma^{\ast}\rangle\widehat{v})$ となり仮定に反する。よって $v\in Z$、すなわち $wR_{\gamma^{\ast}}v$。

::: hypcheck
- **FL 閉性**：Step 1〜4 で、$[\alpha]B\in\Sigma$ から部品（$B$、$[\alpha_{i}]B$、$[\alpha_{1}][\alpha_{2}]B$、$[\gamma][\gamma^{\ast}]B$、$C$）が $\Sigma$ に属することを使った。部品が $\Sigma$ にないと、それが極大な集合に属するかどうかが決まらず、\ref{logic:pdl-atom-properties.2} が使えない。
- **帰納の公理**：使ったのは Step 4 の (b) だけである。到達できる極大な集合の全体 $Z$ が「$\gamma$ の一歩で閉じている」ことは各 $z$ ごとの有限の情報からわかるが、それを「何歩進んでも出られない」に変えるのに公理 7 が要る。
- **(b) の形**：(b) を「$\widehat{w}\wedge\langle\alpha\rangle\widehat{v}$ が無矛盾」で述べたのは、Step 4 で $\widehat{z}\wedge\langle\gamma\rangle\widehat{t}$ の形の仮定から $zR_{\gamma}t$ を引き出すためである。「$\neg[\alpha]B\in w$ なら $B\notin v$ となる $v$ がある」の形だけでは、$\widehat{Z}$ のような $\Sigma$ に属さない論理式を扱えない。
:::
:::

::: theorem PDL の完全性 {#logic:pdl-completeness keywords="completeness of PDL: valid formulas are theorems; counter-models of size at most 2^|A|" index="完全性（PDL）|かんぜんせいぴーでぃーえる" refname="PDL の完全性定理"}
PDL の論理式 $A$ について、$\vdash A\iff A$ は妥当。さらに $\nvdash A$ ならば、状態の数が $2^{\lvert A\rvert}$ 以下のモデルで $A$ は偽になる。
:::

::: proof
⇒ は \ref{logic:pdl-soundness}。⇐ の対偶を示す。$\nvdash A$ とすると $\{\neg A\}\subset\Phi$ は無矛盾（$\vdash\neg\neg A$ なら恒真式で $\vdash A$）。\ref{logic:pdl-atom-properties.3} で $\neg A\in w$ となる $w\in W$ があり、$W$ は空でない。\ref{logic:pdl-atom-properties.1} で $A\notin w$、$A\in\Sigma$ と \ref{logic:pdl-kozen-parikh.1} で $\mathcal{M}^{c},w\not\models A$。極大な集合は各 $B\in\Sigma$ で $B,\neg B$ のどちらを含むかで決まるので $\lvert W\rvert\le2^{\lvert\Sigma\rvert}\le2^{\lvert A\rvert}$。
:::

::: remark
1. 後半は \ref{logic:pdl-small-model} を、公理系を通して示し直したものになっている。
2. この完全性は「妥当な論理式は定理」という**弱い完全性**である。\ref{logic:pdl-not-compact} から、「$\Gamma$ のすべてが真な状態で $A$ も真なら、$\Gamma$ の有限個から $A$ が導ける」という強い完全性は成り立たない（\ref{logic:pdl-not-compact} の $\Gamma$ と $A=\bot$ が反例）。
:::

## 決定可能性と計算量 {#logic:sec-pdlc-decidability}

::: corollary PDL の定理は決定可能 {#logic:pdl-theorems-decidable keywords="the set of theorems of PDL is decidable" index="決定可能性（PDL の定理）|けっていかのうせいぴーでぃーえるのていり"}
論理式 $A$ が PDL の定理かどうかは決定可能である。
:::

::: proof
\ref{logic:pdl-completeness} から $\vdash A\iff A$ は妥当、\ref{logic:pdl-decidable} から妥当性は決定可能。
:::

::: proposition 素朴な決定手続きの計算量 {#logic:pdl-naive-bound keywords="naive decision procedure for PDL runs in doubly exponential time" index="PDL の決定手続き|ぴーでぃーえるのけっていてつづき"}
$n\defeq\lvert A\rvert$ とする。$A$ が定理かどうかは、$2^{c\cdot n\cdot4^{n}}$ 回（$c$ は $A$ によらない定数）の基本操作で判定できる。
:::

::: proof
**Step 1.** 【主張：調べるモデルは $2^{2n\cdot4^{n}}$ 個以下】 \ref{logic:pdl-completeness} から、$\nvdash A\iff$ 状態の集合が $\{1,\dots,N\}$（$N\le2^{n}$）のモデルのどこかで $A$ が偽。$A$ に現れる原子プログラムと命題変数はそれぞれ $n$ 個以下で、ほかのものの関係・付値は $A$ の真理に影響しない（真理の定義の帰納法による）。$N$ を固定すると、関係の選び方は各原子プログラムで $2^{N^{2}}$ 通り、\term[付値]{logic:pdl-semantics}は各命題変数で $2^{N}$ 通りなので、全部で $2^{n(N^{2}+N)}\le2^{2n\cdot4^{n}}$ 通り以下、$N=1,\dots,2^{n}$ を合わせても $2^{n}\cdot2^{2n\cdot4^{n}}$ 通り以下。

**Step 2.** 【主張：一つのモデルの検査は $N$ と $n$ の多項式回】 $A$ の部分プログラム（$n$ 個以下）の関係を $N\times N$ の 0–1 行列として小さい順に計算する：合成は行列の積（$N^{3}$ 回程度）、和は成分ごと、反復は反射推移閉包（ワーシャルの方法で $N^{3}$ 回程度）、テストは対角成分。$A$ の部分論理式（$n$ 個以下）の真理の集合も小さい順に計算する（$[\alpha]B$ は各 $w$ で $R_{\alpha}$ の行を見る）。全体で $n\cdot N^{3}$ の定数倍で、$N\le2^{n}$ から $2^{c'n}$ 回以下。

Step 1 と Step 2 の積は $2^{c\cdot n\cdot4^{n}}$ 回以下である。
:::

::: remark
これは二重指数時間の手続きである。実際には、PDL の充足可能性（したがって定理であるかどうか）は **EXPTIME 完全**であることが知られている：EXPTIME に属することはプラット（1978）が、極大な集合を条件を満たさないものから順に取り除く「消去法」で示し、EXPTIME 困難であることはフィッシャー–ラドナー（1979）が示した（Harel–Kozen–Tiuryn『Dynamic Logic』第 8 章）。このサイトではどちらも証明していない。
:::

::: intuition
**帰納の公理は「不変集合」の言葉である。** 証明の Step 4 で使った $\widehat{Z}$ は、「$w$ から $\gamma$ を何回か実行して着ける極大な集合のどれか」という論理式で、$\vdash\widehat{Z}\to[\gamma]\widehat{Z}$ は「$Z$ は $\gamma$ の一歩で閉じた**不変集合**」を証明系の中で言ったものである。帰納の公理はこれを「何歩でも閉じている」に引き上げる。プログラムの正当性の証明でループ不変条件を探すのと同じ形で、実際、ホーア論理の while 規則はこの公理から導ける（\ref{logic:prob-pdl-while-rule}）。

**高い視点：最大不動点としての $[\alpha^{\ast}]$。** $X\mapsto A\wedge[\alpha]X$ は（意味論では状態の集合の上の）単調な写像で、公理 6 は $[\alpha^{\ast}]A$ がその不動点であること、公理 7 は（必然化と合わせて）「$\vdash X\to A\wedge[\alpha]X$ を満たすどの $X$ についても $\vdash X\to[\alpha^{\ast}]A$」、つまり最大の不動点であることを、有限の論理式の言葉で言っている。順序集合の言葉では、公理 6 が「不動点である」、公理 7 が「最大である」という**普遍性**にあたり、自然数の帰納法が「$\mathbb{N}$ は $0$ を含み後者で閉じた最小の集合」という普遍性であるのと、最小と最大を入れ替えた同じ構造をしている。この見方を一般の単調な写像に広げたのが様相 μ 計算で、そこでは不動点を作る演算子 $\mu,\nu$ が論理式の中に直接書ける（後のページで扱う予定）。
:::

## 問題 {#logic:sec-pdlc-problems}

::: problem {#logic:prob-pdl-star-star}
公理系で $\vdash[\alpha^{\ast}]A\to[\alpha^{\ast}][\alpha^{\ast}]A$ を導け。
:::

::: solution
$C\defeq[\alpha^{\ast}]A$ とおく。公理 6 で $\vdash C\to A\wedge[\alpha]C$、\ref{logic:pdl-normality.1} で $\vdash C\to[\alpha]C$。必然化で $\vdash[\alpha^{\ast}](C\to[\alpha]C)$。公理 7 の $A$ に $C$ を入れた $C\wedge[\alpha^{\ast}](C\to[\alpha]C)\to[\alpha^{\ast}]C$ と合わせ、\ref{logic:pdl-normality.1} で $\vdash C\to[\alpha^{\ast}]C$、つまり $\vdash[\alpha^{\ast}]A\to[\alpha^{\ast}][\alpha^{\ast}]A$。
:::

::: problem {#logic:prob-pdl-while-rule}
$\vdash I\wedge B\to[\alpha]I$ ならば $\vdash I\to[\mathbf{while}\ B\ \mathbf{do}\ \alpha](I\wedge\neg B)$ であることを示せ（\ref{logic:pdl-while}。$I$ を**ループ不変条件**という）。
:::

::: solution
$\beta\defeq B?;\alpha$ とおくと $\mathbf{while}\ B\ \mathbf{do}\ \alpha=\beta^{\ast};\neg B?$。公理 3・5 で $\vdash[\beta]I\leftrightarrow[B?][\alpha]I\leftrightarrow(B\to[\alpha]I)$ で、仮定と恒真式から $\vdash I\to(B\to[\alpha]I)$、よって $\vdash I\to[\beta]I$。必然化と公理 7 で $\vdash I\to[\beta^{\ast}]I$。一方 $I\to(\neg B\to I\wedge\neg B)$ は恒真式なので、\ref{logic:pdl-normality.2} で $\vdash[\beta^{\ast}]I\to[\beta^{\ast}](\neg B\to I\wedge\neg B)$、公理 5 で右辺は $[\beta^{\ast}][\neg B?](I\wedge\neg B)$ と同値（\ref{logic:pdl-normality.2} で中身を置き換える）、公理 3 で $[\beta^{\ast};\neg B?](I\wedge\neg B)$ と同値。まとめて $\vdash I\to[\mathbf{while}\ B\ \mathbf{do}\ \alpha](I\wedge\neg B)$。
:::

::: problem {#logic:prob-pdl-least-witness}
$\vdash\langle\alpha^{\ast}\rangle A\to A\vee\langle\alpha^{\ast}\rangle(\neg A\wedge\langle\alpha\rangle A)$ を示せ。意味論ではどういう主張か。
:::

::: solution
公理 7 の $A$ に $\neg A$ を入れると $\vdash\neg A\wedge[\alpha^{\ast}](\neg A\to[\alpha]\neg A)\to[\alpha^{\ast}]\neg A$。対偶をとり（\ref{logic:pdl-normality.1}。$\neg\neg A$ は $A$ に直す）、$\neg[\alpha^{\ast}]\neg A$ は定義から $\langle\alpha^{\ast}\rangle A$ なので $\vdash\langle\alpha^{\ast}\rangle A\to A\vee\neg[\alpha^{\ast}](\neg A\to[\alpha]\neg A)$。\ref{logic:pdl-normality.3} で $\neg[\alpha^{\ast}](\neg A\to[\alpha]\neg A)\leftrightarrow\langle\alpha^{\ast}\rangle\neg(\neg A\to[\alpha]\neg A)$、中身は恒真式で $\neg A\wedge\neg[\alpha]\neg A=\neg A\wedge\langle\alpha\rangle A$ と同値なので \ref{logic:pdl-normality.2} で置き換えられる。意味論では「$\alpha$ を何回か実行して $A$ に着けるなら、今 $A$ であるか、$A$ でない状態で次の一歩で $A$ に着けるところまで行ける」、すなわち $A$ に初めて着く直前の状態がある、という主張で、自然数の最小元の原理にあたる。
:::
