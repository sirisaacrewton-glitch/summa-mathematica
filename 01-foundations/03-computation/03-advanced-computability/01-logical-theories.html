# 論理的理論の決定可能性 {#comp:page-logical-theories keywords="decidable theory, Presburger arithmetic, Th(N,+) decidable, automata on binary columns, Th(N,+,×) undecidable, Tarski's undefinability, arithmetization of Turing machines"}

構造 $\mathcal{M}$ の理論 $\mathrm{Th}(\mathcal{M})$（真な文全体）が決定可能であるとは、文が $\mathcal{M}$ で真かどうかをアルゴリズムで判定できることである。本ページでは、自然数の加法だけの理論 $\mathrm{Th}(\N,+)$ が決定可能であること（\ref{comp:presburger}）を、各論理式を二進表記の列を読む有限オートマトンに翻訳して示す。一方、乗法を加えた $\mathrm{Th}(\N,+,\cdot)$ は決定可能でない（\ref{comp:arithmetic-undecidable}）。こちらは、認識可能な集合が算術の $\Sigma$ 論理式で定義できること（\ref{comp:tm-sigma-definable}）と、不完全性定理の系列の \ref{pt:tarski-undefinability}（真な文の全体は算術で定義できない）から従う。

## 記法と定義の確認 {#comp:sec-lt-notation}

::: notation
- DFA・NFA、\term[部分集合構成]{comp:nfa-dfa-equivalence}、直積構成は \ref{comp:page-finite-automata} のとおり。TM、決定可能・認識可能、符号化は \ref{comp:page-turing-machines} のとおり。
- 構造・充足・文・論理式は \ref{logic:page-semantics} のとおり。$\mathrm{Th}(\mathcal{M})\defeq\{\sigma:\mathcal{M}\models\sigma\}$。文は有限の記号列なので、固定したアルファベット上の文字列として符号化でき、$\mathrm{Th}(\mathcal{M})$ を言語とみなして決定可能性を問える。
- 算術の言語、標準モデル $\mathcal{N}$、$\Sigma$ 論理式、有限列のコード、再帰で定義される関数の $\Sigma$ 定義可能性、タルスキの定理は不完全性定理の系列（\ref{pt:page-peano-arithmetic}, \ref{pt:page-sequence-coding}, \ref{pt:sigma-recursion}, \ref{pt:tarski-undefinability}）のとおり。
- 自然数の集合 $D\subseteq\N$ が認識可能であるとは、ある計算可能な部分関数の定義域であることをいう。これはどの計算模型で定めても同じ意味である（\ref{comp:undecidability-model-independent}）。不完全性定理の系列ではこれを半決定可能と呼び、$\mathcal{N}$ で狭義の Σ 論理式により定義できることと同値であることを示した（\ref{comp:sigma-semidecidable.1}）。
:::

## 加法の理論は決定可能 {#comp:sec-presburger}

言語を、3 項関係記号 $P$ だけからなるものとし、構造 $\mathcal{N}_{+}\defeq(\N,P^{\mathcal{N}_{+}})$, $P^{\mathcal{N}_{+}}\defeq\{(a,b,c):a+b=c\}$ を考える（加法を関数記号 $+$ で書いた理論は、これに帰着する。実際、原子論理式 $t_{1}=t_{2}$ の中で、両辺が変数である部分項 $s+s'$ を新しい変数 $u$ で置き換えて $P(s,s',u)$ を連言で添え、$\exists u$ で束ねることを内側から繰り返せば、同値な $P$ の論理式が得られる。この翻訳は\term[計算可能]{comp:mapping-reducible}で、文の真偽を保つ）。

::: definition 列の二進表記 {#comp:column-strings}
$i\ge0$ について、アルファベット $\Sigma_{i}\defeq\{0,1\}^{i}$（$i$ 段の列）上の文字列 $w=c_{0}c_{1}\cdots c_{m-1}$ の第 $j$ 段を**下位の桁から**読んだ数を
$$
\mathrm{val}_{j}(w)\defeq\sum_{k<m}c_{k}(j)\,2^{k}
$$
とし、$\mathrm{val}(w)\defeq(\mathrm{val}_{1}(w),\dots,\mathrm{val}_{i}(w))\in\N^{i}$ と書く。任意の $\vec{a}\in\N^{i}$ と十分大きい $m$ について、$\mathrm{val}(w)=\vec{a}$ となる長さ $m$ の $w$ がちょうど一つある。$i=0$ のとき $\Sigma_{0}$ は一点（空の列）からなる。
:::

::: lemma 論理式のオートマトン {#comp:formula-automaton}
変数 $x_{1},\dots,x_{i}$ の論理式 $\varphi$（$\mathrm{FV}(\varphi)\subseteq\{x_{1},\dots,x_{i}\}$）に対し、$\Sigma_{i}$ 上の DFA $A_{\varphi}$ で、すべての $w\in\Sigma_{i}^{\ast}$ について
$$
w\in L(A_{\varphi})\iff\mathcal{N}_{+}\models\varphi(\mathrm{val}(w))
$$
となるものが、$\varphi$ から機械的に構成できる。
:::

::: proof
$\varphi$ の構成に関する帰納法（基本記号は $\bot$, $=$, $P$, $\to$, $\forall$ で、$\forall x\,\alpha$ は $\neg\exists x\,\neg\alpha$ として扱う）。変数の個数 $i$ は、必要なら使わない段を加えて揃える（段を加えても $\mathrm{val}$ の他の成分は変わらない）。量化される変数は、束縛変数の名前を付け替えて（真偽は変わらない）、すでに使っている変数の次の $x_{i+1}$ としてよい。

**原子論理式.** $\bot$ は何も受理しない DFA。$x_{j}=x_{k}$ は「すべての列で第 $j$ 段と第 $k$ 段が等しい」を確かめる 2 状態の DFA。$P(x_{j},x_{k},x_{l})$ は、繰り上がり $e\in\{0,1\}$ を状態にもつ DFA で、列 $c$ を読むと $c(j)+c(k)+e$ の下位ビットが $c(l)$ に等しいかを確かめ（等しくなければ拒否状態に移り、そこに留まる）、新しい繰り上がりを $\lfloor(c(j)+c(k)+e)/2\rfloor$ とする。受理状態は「繰り上がり $0$」。読み終えたとき、下位から $m$ 桁の加算が正しく、最後の繰り上がりが $0$ であることと $\mathrm{val}_{j}+\mathrm{val}_{k}=\mathrm{val}_{l}$ は同値である（桁ごとの加算の性質）。

**$\to$.** $\alpha\to\beta$ は $\neg\alpha\vee\beta$ と同値なので、補集合と直積構成（\ref{comp:dfa-boolean}）。

**$\exists x_{i+1}\,\alpha$（$\alpha$ は $x_{1},\dots,x_{i+1}$ の論理式）.** $A_{\alpha}=(Q,\Sigma_{i+1},\delta,q_{0},F)$ から、$\Sigma_{i}$ 上の NFA $N$ を次のように作る：状態・開始状態は同じで、$c\in\Sigma_{i}$ を読むと、$b\in\{0,1\}$ を推測して $\delta(q,(c,b))$ に移る（$(c,b)$ は $c$ の下に $b$ を付けた $i+1$ 段の列）。受理状態は
$$
\begin{aligned}
F'\defeq\{q\in Q:\ &\text{ある }k\ge0\text{ と }b_{1},\dots,b_{k}\in\{0,1\}\text{ で}\\
&\hat{\delta}(q,(\vec{0},b_{1})\cdots(\vec{0},b_{k}))\in F\}
\end{aligned}
$$
とする（$\vec{0}$ は $i$ 段の $0$ の列。$F'$ は、$q$ から $(\vec{0},0)$, $(\vec{0},1)$ による遷移だけで $F$ に到達できるかという有限グラフの到達可能性として計算できる）。$N$ が $w$ を読み終えた状態が $F'$ に入ることを $F'$ の定義で書き直すと、次が成り立つ：
$$
\begin{aligned}
w\in L(N)\iff\ &\text{ある }u\in\{0,1\}^{\lvert w\rvert},\ k\ge0,\ v\in\{0,1\}^{k}\text{ で}\\
&(w,u)(\vec{0}^{k},v)\in L(A_{\alpha})
\end{aligned}
$$
ここで $(w,u)$ は $w$ の各列の下に $u$ の各ビットを付けたものである。右辺の文字列の $\mathrm{val}$ は $(\mathrm{val}(w),y)$（$y$ は $uv$ を下位から読んだ数）なので、帰納法の仮定より右辺は「ある $y$ で $\mathcal{N}_{+}\models\alpha(\mathrm{val}(w),y)$」と同値である（逆に、任意の $y$ は、$2^{\lvert w\rvert+k}>y$ となる $k$ をとれば長さ $\lvert w\rvert+k$ の二進表記をもつ）。最後に $N$ を\ref[部分集合構成]{comp:nfa-dfa-equivalence}で DFA にし、これを $A_{\exists x_{i+1}\alpha}$ とする。
:::

::: theorem 加法の理論の決定可能性 {#comp:presburger keywords="Th(N,+) is decidable, Presburger arithmetic" index="プレスブルガー算術|ぷれすぶるがーさんじゅつ, 加法の理論の決定可能性|かほうのりろんのけっていかのうせい"}
$\mathrm{Th}(\mathcal{N}_{+})$ は決定可能である。
:::

::: proof
文 $\sigma$（$i=0$）に対し、\ref{comp:formula-automaton} の $A_{\sigma}$ を構成し、空文字列（$\Sigma_{0}$ 上の長さ $0$ の文字列。$\mathrm{val}$ は空の組）を受理するかどうかを調べる。\ref{comp:formula-automaton} を $w=\varepsilon$ に使えば、$\varepsilon\in L(A_{\sigma})\iff\mathcal{N}_{+}\models\sigma$ である。$A_{\sigma}$ の構成は $\sigma$ の構成に沿った有限の手続きで、$\varepsilon$ を受理するかどうかは開始状態が受理状態かどうかを見ればわかる。ゆえにこの手順は、$\sigma$ が真かどうかをつねに有限の時間で判定する。

::: hypcheck
- **下位の桁から読むこと**：加算の繰り上がりを左から右へ（読む方向へ）伝えられるので、$P$ の DFA が作れた。
- **$\exists$ の受理状態 $F'$**：証人 $y$ が他の数より多くの桁を必要とする場合に、$0$ の列を補って読み続ける分を扱うために必要だった。
- **乗法がないこと**：原子論理式が有限オートマトンで扱える（有限の繰り上がりだけを記憶すればよい）のは加法だからである。乗法の組 $\{w\in\Sigma_{3}^{\ast}:\mathrm{val}_{1}(w)\cdot\mathrm{val}_{2}(w)=\mathrm{val}_{3}(w)\}$ は正規言語でない。実際、正規言語なら同じ構成で $\mathrm{Th}(\N,+,\cdot)$ が決定可能になり（$0$ と $S$ は $+$ で定義できる）、\see{comp:arithmetic-undecidable} に反する。
:::
:::

## 乗法を加えた理論は決定不能 {#comp:sec-arith-undecidable}

::: lemma チューリング機械の計算の Σ 定義可能性 {#comp:tm-sigma-definable keywords="Turing-recognizable sets of numbers are Sigma-definable in arithmetic" index="計算の算術化|けいさんのさんじゅつか"}
自然数の集合 $D\subseteq\N$ が認識可能（ある計算可能な部分関数の定義域。チューリング機械で定めても同じ）なら、算術の狭義の $\Sigma$ 論理式 $\theta(x)$ で、すべての $n$ について $n\in D\iff\mathcal{N}\models\theta(\underline{n})$ となるものがある。
:::

::: proof
$D$ は半決定可能なので、\ref{comp:sigma-semidecidable.1} より、$\mathcal{N}$ で $D$ を定義する狭義の Σ 論理式 $\theta(x)$ がある。すなわち、すべての $n$ について $n\in D\iff\mathcal{N}\models\theta[n]$ である。数項 $\underline{n}$ の $\mathcal{N}$ での値は $n$ なので、$\mathcal{N}\models\theta[n]\iff\mathcal{N}\models\theta(\underline{n})$ が成り立ち、主張を得る。なお、狭義の Σ 論理式はそれ自身と同値なので Σ 論理式でもある（\ref{pt:sigma-formula.2}）。
:::

::: theorem 算術の理論の決定不能性 {#comp:arithmetic-undecidable keywords="Th(N,+,×) is undecidable, Church's theorem" index="算術の真理の決定不能性|さんじゅつのしんりのけっていふのうせい"}
$\mathrm{Th}(\N,0,S,+,\cdot)$ は決定可能でない。
:::

::: proof
$\mathrm{Th}(\N,0,S,+,\cdot)$ が決定可能であると仮定する。不完全性定理の系列の算術の言語は $<$ も含むが、$x<y$ を $\exists z\,(x+S(z)=y)$ で置き換える翻訳は\term[計算可能]{comp:mapping-reducible}で、$\mathcal{N}$ での真偽を保つ。また、算術の文のゲーデル数（不完全性定理の系列の算術化 \ref{pt:page-arithmetization} によるもの）から文の文字列への変換と、その逆は計算可能である。ゆえに、この変換と翻訳を判定の前に施せば、$T\defeq\{\Godel{\sigma}:\sigma\text{ は算術の文で }\mathcal{N}\models\sigma\}\subseteq\N$ の特性関数 $\chi_{T}$ が計算可能になる。

このとき、$\chi_{T}(n)=1$ なら $0$ を返し、そうでなければ止まらない部分関数は計算可能で、その定義域は $T$ である。よって $T$ は認識可能であり、\ref{comp:tm-sigma-definable} より、算術の論理式 $\theta(x)$ で、すべての $n$ について $\mathcal{N}\models\theta(\underline{n})\iff n\in T$ となるものがある。とくにすべての文 $\sigma$ について $\mathcal{N}\models\sigma\leftrightarrow\theta(\Godel{\sigma})$ となる。これは \ref{pt:tarski-undefinability.1} に反する。

::: hypcheck
- **タルスキの定理**：真な文のゲーデル数の集合が算術で定義できないこと。証明は対角化定理によるもので、計算論を使わないので、循環はない。
- **\ref{comp:tm-sigma-definable}**：$T$ を算術で定義するために使った。使ったのは $T$ が認識可能であることだけで、補集合の側は使っていない。
- **符号化の互換性**：ゲーデル数と文字列の符号化の変換が計算可能であることと、$<$ を消す翻訳が計算可能であることを使った。
:::
:::

## 問題 {#comp:sec-lt-problems}

::: problem {#comp:prob-presburger-example}
2 段の列のアルファベット $\Sigma_{2}$ 上で、$\{w:\mathrm{val}_{2}(w)=2\,\mathrm{val}_{1}(w)\}$（論理式 $P(x_{1},x_{1},x_{2})$ に当たる）を認識する DFA を、\ref{comp:formula-automaton} の一般の構成を使わずに直接作れ。
:::

::: solution
下位の桁から読むと、$y=2x$ は「$y$ の第 $0$ 桁は $0$、第 $k$ 桁（$k\ge1$）は $x$ の第 $k-1$ 桁」と同値で、さらに $x$ の最上位（読んだ最後の列）の桁は $0$ でなければならない（そうでないと $y$ の桁が足りない）。状態 $s_{0},s_{1}$（直前に読んだ $x$ の桁が $0$, $1$）と拒否状態 $d$ を用意し、開始 $s_{0}$、受理 $\{s_{0}\}$ とする。$s_{b}$ で列 $(c_{1},c_{2})$ を読んだとき、$c_{2}=b$ なら $s_{c_{1}}$ に、そうでなければ $d$ に移る。$d$ からはどこにも行かない（$d$ に留まる）。読み終えて $s_{0}$ にいることは、各桁で $y_{k}=x_{k-1}$（$x_{-1}\defeq0$）が成り立ち、最後の $x$ の桁が $0$ であることと同値である。
:::

::: problem {#comp:prob-theory-of-n-successor}
$\mathrm{Th}(\N,<)$ も決定可能であることを、\ref{comp:presburger} から導け。
:::

::: solution
$x<y$ は $\exists z\,(P(x,z,y)\wedge\neg P(z,z,z))$ で表せる（$z\neq0$ は $z+z\neq z$ と同値）。この翻訳は計算可能で真偽を保つので、$\mathrm{Th}(\N,<)$ の文を $\mathrm{Th}(\mathcal{N}_{+})$ の文に変換して \ref{comp:presburger} の判定機に渡せばよい。
:::

::: supplement
**前提の検討.**
- \ref{comp:presburger} の判定手順は、量化子の入れ子ごとに部分集合構成で状態数が指数的に増えるので、非常に遅い。実際、フィッシャーとラビン（1974）は、ある定数 $c>0$ について、$\mathrm{Th}(\N,+)$ の任意の判定手順（非決定性のものも含む）が、無限に多くの $n$ で長さ $n$ のある文に $2^{2^{cn}}$ 段以上を要することを示した（二重指数の下界）。上界としては、量化子消去による三重指数時間の手順が知られている（オッペン）。
- \ref{comp:tm-sigma-definable} は不完全性定理の系列の \ref{comp:sigma-semidecidable} を使って示した。直接示すこともできる：チューリング機械の時点表示を有限列のコード（\ref{pt:finseq}）で数に表すと、一段の動きは列の操作（\ref{pt:sequence-operations}）と\term[遷移関数]{comp:turing-machine}の有限の表による場合分けで書け、$t$ 段後の時点表示は再帰で定義される関数（\ref{pt:sigma-recursion}）として Σ 定義可能になる。「ある $t$ で受理状態に達する」はその存在量化である。

**関連する結果.**
- *プレスブルガー算術.* 加法の理論はプレスブルガーにより量化子消去で決定可能と示された（1929）。量化子消去には、各 $k\ge2$ と $0\le r<k$ についての「$k$ で割った余りが $r$」（合同式 $x\equiv r\pmod{k}$）という述語をすべて言語に加える必要がある（モデル理論の量化子消去 \ref{model:page-quantifier-elimination} を参照）。たとえば言語 $\{0,1,+,<\}$ の量化子のない論理式が定める $\N$ の部分集合は有限集合か補有限集合なので、「$x$ は偶数」$\exists y\,(x=y+y)$ はそのような論理式と同値にならない。
- *チャーチの定理.* 一階述語論理の妥当な文の全体（2 項関係記号を一つ含む言語ならすでに）は決定可能でない。算術の言語の場合は、\ref{comp:arithmetic-undecidable} と同様の考え方と、有限公理化された算術の部分体系 \ref{pt:robinson-q} を使って示される（\see{comp:prob-pa-undecidable}）。
- *実閉体.* 実数の順序体の理論 $\mathrm{Th}(\R,+,\cdot,<)$ は決定可能である（タルスキ）。自然数では乗法が加わると決定不能になるのに、実数では決定可能であるという対比は、自然数の離散性（整数性）が算術の難しさの源であることを示している。

**高い視点から：自動的な構造.** \ref{comp:formula-automaton} は、$(\N,+)$ の定義可能な関係がすべて「二進表記の正規言語」であることを示している。このように、領域を文字列で表し、基本関係が有限オートマトンで認識される構造を**自動構造**といい、その理論は \ref{comp:formula-automaton} と同じ構成によりつねに決定可能になる。量化子 $\exists$ は射影（一段を忘れること）、論理結合子は和・補集合に対応し、正規言語がこれらで閉じていることが決定可能性の源である。乗法はこの枠に収まらず、そこから計算の全体（チューリング機械）が算術の中に入り込む（\ref{comp:tm-sigma-definable}）。
:::
