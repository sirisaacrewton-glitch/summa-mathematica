# フリードバーグ–ムチニクの定理 {#comp:page-friedberg-muchnik keywords="Turing degrees, Post's problem, Kleene-Post theorem, finite extension method, Friedberg-Muchnik theorem, priority argument, finite injury, restraint, witness, incomparable c.e. degrees"}

$\varnothing$ と $\varnothing'$ の間に、どちらともチューリング還元で同値にならない（$\equiv_{\mathrm{T}}$ でない）集合はあるか。ポスト（1944）はこれを**認識可能な**集合について問うた（**ポストの問題**）。本ページでは、まず神託 $\varnothing'$ を使って互いに比較不能な二つの集合を作る**クリーネ–ポストの定理**（\tref{comp:kleene-post}）を有限延長法で示し、次に、神託を使わずに**認識可能な**比較不能な集合を作る**フリードバーグ–ムチニクの定理**（\tref{comp:friedberg-muchnik}）を、**優先論法**（有限損傷法）で証明する。どちらの集合もチューリング次数で $\mathbf{0}$ と $\mathbf{0}'$ の真の間にあり、ポストの問題が肯定的に解かれる。

> 資料：新井『数学基礎論』§6.4（定理 6.4.1, 6.4.3）を参考にした（本文は写していない）。優先論法の証明では、要求が「注意を要する」条件、証人の選び方、制限を明示的に定め、各要求が有限回しか作用しないことを優先度に関する帰納法で示した。

## 記法と定義の確認 {#comp:sec-fm-notation}

::: notation
- 神託機械、チューリング還元 $\le_{\mathrm{T}}$、ジャンプは \ref{comp:oracle-tm}, \ref{comp:turing-reduction-basic}, \ref{comp:jump} のとおり。$A\equiv_{\mathrm{T}}B$ は $A\le_{\mathrm{T}}B\le_{\mathrm{T}}A$、$A<_{\mathrm{T}}B$ は $A\le_{\mathrm{T}}B\not\le_{\mathrm{T}}A$。同値類を**チューリング次数**といい、$\varnothing$, $\varnothing'$ の次数を $\mathbf{0}$, $\mathbf{0}'$ と書く。
- 神託機械を $M_{0},M_{1},\dots$ と並べる。集合 $X$ と入力 $x$ について、$M_{e}^{X}$ が $x$ を受理して止まれば $\Phi_{e}^{X}(x)=1$、拒否して止まれば $0$、止まらなければ $\Phi_{e}^{X}(x)\uparrow$ と書く。$\Phi_{e,s}^{X}(x)$ は $s$ 段以内に止まった場合の値。止まる計算で問い合わせた数の最大値 $+1$（問い合わせがなければ $0$）を**使用量**という。
- 有限の $0,1$ 列 $\sigma$ について、$\Phi_{e}^{\sigma}(x)\downarrow$ は「問い合わせ $y$ に $\sigma(y)$ で答えて $M_{e}$ が $x$ の上で止まり、問い合わせはすべて $y<\lvert\sigma\rvert$」を表す。$\sigma\subseteq X$ は $\sigma$ が $\chi_{X}$ の始切片であることを表す。
- **保存の原理**：$\Phi_{e,s}^{X}(x)=v$ で使用量が $u$ のとき、$X$ と $Y$ が $u$ 未満で一致すれば $\Phi_{e,s}^{Y}(x)=v$（計算は同じ問い合わせに同じ答えを受け取るので、同じ道筋をたどる）。$\sigma$ についても同様。
- $\langle y,i\rangle$ は対の符号で、$\omega^{[i]}\defeq\{\langle y,i\rangle:y\in\N\}$ を第 $i$ 列という。
:::

::: lemma 比較不能性の要求 {#comp:incomparability-requirements keywords="A not Turing reducible to B iff for every e there is x with A(x) != Phi_e^B(x)" index="比較不能性の要求|ひかくふのうせいのようきゅう"}
$A\not\le_{\mathrm{T}}B$ であることは、すべての $e$ について次の要求 $P_{e}$ が成り立つことと同値である：「ある $x$ で $\Phi_{e}^{B}(x)\uparrow$ または $\Phi_{e}^{B}(x)\ne\chi_{A}(x)$」。
:::

::: proof
$A\le_{\mathrm{T}}B$ は、すべての入力で止まり $\chi_{A}$ を計算する神託機械 $M_{e}^{B}$ があること、すなわち、ある $e$ で $P_{e}$ が成り立たないことである。対偶をとれば主張を得る。
:::

## クリーネ–ポストの定理 {#comp:sec-fm-kleene-post}

::: theorem クリーネ–ポストの定理 {#comp:kleene-post keywords="Kleene-Post theorem: there are incomparable sets below 0', finite extension method" index="クリーネ–ポストの定理|くりーねぽすとのていり, 有限延長法|ゆうげんえんちょうほう" refname="クリーネ–ポストの定理"}
$A,B\le_{\mathrm{T}}\varnothing'$ で、$A\not\le_{\mathrm{T}}B$ かつ $B\not\le_{\mathrm{T}}A$ となるものがある。特に $\mathbf{0}<_{\mathrm{T}}\deg A,\deg B<_{\mathrm{T}}\mathbf{0}'$。
:::

::: intuition
停止問題 $\varnothing'$ を神託に使ってよければ、互いに相手を使っても計算できない二つの集合を、有限の情報を少しずつ延ばしながら作れる。どちらも決定可能ではなく、停止問題ほど強くもない。
:::

::: proof
有限の $0,1$ 列 $\alpha_{s},\beta_{s}$ を、$\alpha_{s}\subseteq\alpha_{s+1}$, $\beta_{s}\subseteq\beta_{s+1}$ で長さが $s$ 以上になるように作り、$A\defeq\bigcup_{s}\alpha_{s}$, $B\defeq\bigcup_{s}\beta_{s}$（特性関数として）とおく。$\alpha_{0}=\beta_{0}=$ 空列とする。

**段 $s+1=2e+1$（$A$ の側の要求 $P_{e}$：$A\ne\Phi_{e}^{B}$）.** $n\defeq\lvert\alpha_{s}\rvert$ とおく。「$\beta_{s}\subseteq\sigma$ かつ $\Phi_{e}^{\sigma}(n)\downarrow$ となる有限列 $\sigma$ がある」は $\Sigma_{1}$ の問いなので、神託 $\varnothing'$ で判定できる（\ref{comp:sigma1-recognizable} と \ref{comp:jump-properties.3}）。
- ある場合：組 $(\sigma,t)$ を決まった順に調べて $\Phi_{e,t}^{\sigma}(n)\downarrow$ となる最初の組を見つけ（あることが分かっているので、この探索は止まる）、その $\sigma$ について $\beta_{s+1}\defeq\sigma0$、$\alpha_{s+1}\defeq\alpha_{s}\,i$（$i\defeq1-\Phi_{e}^{\sigma}(n)$）と定める。
- ない場合：$\beta_{s+1}\defeq\beta_{s}0$、$\alpha_{s+1}\defeq\alpha_{s}0$ と定める。

どちらの場合も $\alpha_{s+1}$, $\beta_{s+1}$ はそれぞれ $\alpha_{s}$, $\beta_{s}$ より長いので、長さは $s+1$ 以上になる。

**段 $s+1=2e+2$.** $A$ と $B$ の役割を入れ替えて同様に行う（要求は $B\ne\Phi_{e}^{A}$）。

**Step 1.** 【主張：$A,B\le_{\mathrm{T}}\varnothing'$】 構成の各段は、$\varnothing'$ への一回の問い合わせと、止まることが分かっている探索とで行えるので、$s\mapsto(\alpha_{s},\beta_{s})$ は $\varnothing'$ で計算できる。$\alpha_{x+1}$ の長さは $x+1$ 以上なので、$x\in A$ かどうかは $\alpha_{x+1}(x)$ を見れば判定できる。$B$ も同様である。

**Step 2.** 【主張：$s+1=2e+1$, $n=\lvert\alpha_{s}\rvert$ のとき、$\Phi_{e}^{B}(n)\uparrow$ または $\Phi_{e}^{B}(n)\ne\chi_{A}(n)$ である。したがって $P_{e}$ が成り立つ】 ある場合、$\sigma\subseteq\beta_{s+1}\subseteq B$ なので、保存の原理から $\Phi_{e}^{B}(n)=\Phi_{e}^{\sigma}(n)$ である。ゆえに $\chi_{A}(n)=\alpha_{s+1}(n)=1-\Phi_{e}^{\sigma}(n)\ne\Phi_{e}^{B}(n)$ となる（値は $0$ か $1$ なので $1-v\ne v$）。ない場合、$\Phi_{e}^{B}(n)\downarrow$ と仮定し、その計算の使用量を $u$ とする。$\sigma\defeq\chi_{B}\restriction\max(u,\lvert\beta_{s}\rvert)$ とおくと、$\beta_{s}\subseteq B$ なので $\sigma$ は $\beta_{s}$ を延長し、問い合わせはすべて $u$ 未満で $u\le\lvert\sigma\rvert$ なので $\Phi_{e}^{\sigma}(n)\downarrow$ となって、「ない」に反する。よって $\Phi_{e}^{B}(n)\uparrow$ である。

**Step 3.** 【主張：$A\not\le_{\mathrm{T}}B$, $B\not\le_{\mathrm{T}}A$ で、$\mathbf{0}<_{\mathrm{T}}\deg A,\deg B<_{\mathrm{T}}\mathbf{0}'$】 Step 2 がすべての $e$ について成り立つので、\ref{comp:incomparability-requirements} から $A\not\le_{\mathrm{T}}B$ である。段 $2e+2$ について同じ議論をすれば $B\not\le_{\mathrm{T}}A$ を得る。$A$ が決定可能なら $A\le_{\mathrm{T}}B$ となって矛盾するので、$\mathbf{0}<_{\mathrm{T}}\deg A$ である。$\varnothing'\le_{\mathrm{T}}A$ なら Step 1 から $B\le_{\mathrm{T}}\varnothing'\le_{\mathrm{T}}A$ となって矛盾するので、$\deg A<_{\mathrm{T}}\mathbf{0}'$ である。$B$ も同様である。

::: hypcheck
- **神託 $\varnothing'$**：構成の各段（Step 1）で、「延長して止まる $\sigma$ があるか」という $\Sigma_{1}$ の問いに答えるのに使った。この問いを神託なしで決めることはできないので、この構成で作った $A,B$ は認識可能とは限らない。
- **保存の原理**：Step 2 で、一度止まった計算がその後の延長で変わらないことと、$B$ の十分長い始切片の上で計算が止まることに使った。
:::
:::

## フリードバーグ–ムチニクの定理 {#comp:sec-fm-theorem}

::: theorem フリードバーグ–ムチニクの定理 {#comp:friedberg-muchnik keywords="Friedberg-Muchnik theorem: there are Turing incomparable c.e. sets; solution of Post's problem" index="フリードバーグ–ムチニクの定理|ふりーどばーぐむちにくのていり, ポストの問題|ぽすとのもんだい, 優先論法|ゆうせんろんぽう" refname="フリードバーグ–ムチニクの定理"}
認識可能な集合 $A,B$ で、$A\not\le_{\mathrm{T}}B$ かつ $B\not\le_{\mathrm{T}}A$ となるものがある。特に $\mathbf{0}<_{\mathrm{T}}\deg A,\deg B<_{\mathrm{T}}\mathbf{0}'$ で、ポストの問題の答えは肯定的である。
:::

::: intuition
神託を使わず数を入れていくだけで作れる（認識可能な）二つの集合で、どちらも相手を神託にしても計算できないものがある。要求に順位を付け、上位の要求は下位の要求の仕事を壊してよいが、壊すのは有限回で済む、という約束（優先論法）で作る。
:::

::: proof
要求を $R_{2e}$：「$A$ と $\Phi_{e}^{B}$ は異なる」（\ref{comp:incomparability-requirements} の $P_{e}$）、$R_{2e+1}$：「$B$ と $\Phi_{e}^{A}$ は異なる」とし、番号が小さいほど**優先度が高い**とする。$R_{2e}$ は $A$ に、$R_{2e+1}$ は $B$ に数を入れ、どちらも自分の列 $\omega^{[i]}$ の数しか入れない。$R_{i}$ と対になる集合（$R_{2e}$ なら $B$、$R_{2e+1}$ なら $A$）を $R_{i}$ の**相手**、入れる先を**自分の集合**と呼ぶ。

**構成.** 段 $s$ で、有限集合 $A_{s},B_{s}$、各 $R_{i}$（$i\le s$）の**証人** $x_{i,s}\in\omega^{[i]}$、**制限** $r_{i,s}\in\N$、**達成済み**かどうかの印を定める。段 $0$ では $A_{0}=B_{0}=\emptyset$ とし、$R_{0}$ の証人を $\omega^{[0]}$ の最小元、制限を $0$ とし、印は付けない。

段 $s+1$：$R_{i}$（$i\le s$, $i=2e$ の場合。奇数は役割を入れ替える）が**注意を要する**とは、$R_{i}$ が達成済みでなく、$\Phi_{e,s}^{B_{s}}(x_{i,s})=0$ となることをいう。
1. 注意を要する $R_{i}$ がなければ何もしない。
2. あれば、その中で番号最小の $R_{i}$ が**作用する**：$x_{i,s}$ を自分の集合に入れ（$A_{s+1}=A_{s}\cup\{x_{i,s}\}$）、制限 $r_{i,s+1}$ をその計算の使用量とし、$R_{i}$ を達成済みにする。さらに $j>i$ のすべての $R_{j}$ を**損傷させる**：達成済みの印と制限を外し、証人を取り消す。
3. 証人のない $R_{j}$（$j\le s+1$。損傷したものと新しく加わった $R_{s+1}$）に、自分の列の数で、ここまでに現れたすべての数（証人・使用量・$s+1$）より大きい最小のものを新しい証人として与える。

変化しなかったものは前の段の値を引き継ぐ。新しい証人はそれまでに現れたどの数よりも大きいので、同じ数が二度証人になることはない。

**Step 1.** 【主張：$A,B$ は認識可能である】 各段で調べるのは、有限個の要求の $s$ 段以内の計算だけなので、構成は計算可能である。よって $x\in A\iff\exists s\,x\in A_{s}$ の右辺の $s$ を順に探せば $A$ を認識でき、$B$ も同様である。

以下、各 $R_{i}$ について「$R_{i}$ は有限回しか作用せず、証人 $x_{i}\defeq\lim_{s}x_{i,s}$ が存在し、$R_{i}$ は成り立つ」ことを $i$ に関する帰納法で示す。$i=2e$ とする（$i$ が奇数のときは $A$ と $B$ を入れ替えて同じ議論が成り立つ）。

**Step 2.** 【主張：ある段 $t_{0}$ があって、$t_{0}$ より後に $R_{i}$ は損傷せず、証人 $x\defeq x_{i,t_{0}}$ は以後変わらない】 帰納法の仮定から、優先度の高い $R_{j}$（$j<i$）はどれも有限回しか作用しないので、それらの最後の作用の段を $s_{0}$ とおく（なければ $s_{0}=0$）。$R_{i}$ が損傷するのは優先度の高いものが作用したときだけなので、$t_{0}\defeq\max(s_{0},i)$ とおけば、$t_{0}$ より後に $R_{i}$ は損傷しない。証人が取り替えられるのは損傷したときだけなので、$s\ge t_{0}$ なら $x_{i,s}=x$ であり、$x_{i}=x$ となる。

**Step 3.** 【主張：$R_{i}$ がある段 $s+1$ で証人 $x$ について作用したなら、$\Phi_{e}^{B}(x)=0\ne1=\chi_{A}(x)$ であり、$R_{i}$ は段 $s+1$ より後に作用しない】 作用により $x\in A$ となり、$\Phi_{e,s}^{B_{s}}(x)=0$ で、その使用量は $r\defeq r_{i,s+1}$ である。$x$ はその後も証人なので、$R_{i}$ は段 $s+1$ より後に損傷しておらず、したがって優先度の高い要求はその後作用していない。$B$ に数を入れるのは奇数番の要求の作用だけで、優先度の低いもの（$j>i$）は段 $s+1$ で損傷し、その後に与えられる証人はすべて $r$ より大きい（手順 3）。$R_{i}$ 自身は $A$ にしか入れない。ゆえに段 $s+1$ 以降に $B$ に入る数はすべて $r$ 以上で、$B$ と $B_{s}$ は $r$ 未満で一致する。保存の原理から $\Phi_{e}^{B}(x)=0\ne1=\chi_{A}(x)$ である。また $R_{i}$ は達成済みのまま損傷しないので、以後注意を要さず、作用しない。

**Step 4.** 【主張：$R_{i}$ が証人 $x$ について一度も作用しないなら、$\Phi_{e}^{B}(x)\ne0=\chi_{A}(x)$ である】 $x$ を $A$ に入れうるのは $R_{i}$ だけで（列が別で、同じ数は二度証人にならない）、$R_{i}$ は $x$ について作用しないので、$x\notin A$ である。$\Phi_{e}^{B}(x)=0$ と仮定し、その計算の段数を $t$、使用量を $u$ とする。$B$ は増加列 $B_{s}$ の和で、$u$ 未満の数は有限個なので、十分大きい $s\ge\max(t,t_{0})$ で $B_{s}$ と $B$ は $u$ 未満で一致し、保存の原理から $\Phi_{e,s}^{B_{s}}(x)=0$ となる。$R_{i}$ は証人 $x$ を受け取ったときには印がなく、印が付くのは $x$ について作用したときだけなので、$R_{i}$ は達成済みでない。ゆえに $R_{i}$ は段 $s+1$ で注意を要する。このとき優先度の高いものは注意を要さない（要すれば、そのうち番号最小のものが作用して $s_{0}$ の定義に反する）ので、$R_{i}$ が作用することになり、仮定に反する。よって $\Phi_{e}^{B}(x)\ne0$（止まらないか $1$）である。

**Step 5.** 【主張：$R_{i}$ は有限回しか作用せず、成り立つ】 $t_{0}$ 以前の作用は有限回である。$t_{0}$ より後の作用は証人 $x$ についての作用なので、Step 3 から高々一回である。$R_{i}$ が $x$ について作用したことがあれば Step 3 から、なければ Step 4 から $R_{i}$ は成り立つ。これで帰納法が完結する。

**結論.** すべての $R_{i}$ が成り立つので、\ref{comp:incomparability-requirements} から $A\not\le_{\mathrm{T}}B$, $B\not\le_{\mathrm{T}}A$ である。$A,B$ は認識可能なので $A,B\le_{\mathrm{m}}\varnothing'$ であり（\ref{comp:jump-properties.3}）、次数の不等式は \ref{comp:kleene-post} の証明の Step 3 と同様に従う。

::: hypcheck
- **優先度と損傷**：高い優先度の要求は低いものを損傷させてよいが、逆は許さない。これにより、帰納法で「高いものが有限回しか作用しない」ことから「低いものも有限回」が言える（Step 2・5。**有限損傷**）。
- **新しい証人を十分大きくとる（手順 3）**：Step 3 で、優先度の低い要求が相手の集合の使用量より下を変えないことに使い、Step 4 で、証人が二度使われないことに使った。
- **列を分けること**：Step 4 で、$x$ を自分の集合に入れうるのが $R_{i}$ だけであることに使った。
- **保存の原理**：Step 3 と Step 4 で、止まった計算が、使用量より下の神託が変わらない限り変わらないことに使った。
:::
:::

## 問題 {#comp:sec-fm-problems}

::: problem {#comp:prob-fm-noncomputable-ce}
フリードバーグ–ムチニクの定理の構成で、要求を $R_{e}$：「$\overline{A}\ne W_{e}$」（$W_{e}$ は $e$ 番目の認識可能な集合）だけにして、認識可能だが決定可能でない集合を作る構成を考えよ（優先度も損傷も不要であることを確かめよ）。
:::

::: solution
各 $e$ について証人 $x_{e}\defeq\langle0,e\rangle$（第 $e$ 列の最小元）を固定する。段 $s+1$ で、$x_{e}\in W_{e,s}$ かつ $x_{e}\notin A_{s}$ となる $e\le s$ があれば、その最小の $e$ について $x_{e}$ を $A$ に入れる。構成は計算可能なので $A$ は認識可能である。各 $R_{e}$ は高々一回しか作用しない（作用すると $x_{e}\in A_{s}$ となり、以後条件を満たさない）。

$x_{e}\in W_{e}$ の場合、$x_{e}\in W_{e,s}$ となる段 $s\ge e$ 以降、$x_{e}\notin A_{s}$ である限り $R_{e}$ は条件を満たす。番号の小さい要求に先を越されることはあるが、それらは合わせて高々 $e$ 回しか作用しないので、いずれ $x_{e}$ が $A$ に入る。ゆえに $x_{e}\in W_{e}\setminus\overline{A}$ であり、$\overline{A}\ne W_{e}$ である。$x_{e}\notin W_{e}$ の場合、$x_{e}$ を入れうるのは $R_{e}$ だけ（$x_{e}$ は第 $e$ 列の数）なので $x_{e}\notin A$ であり、$x_{e}\in\overline{A}\setminus W_{e}$ となる。

要求はどれも $A$ に数を入れるだけで、各要求の成否（$x_{e}$ が $W_{e}$ に入るかどうか）は $A$ によらないので、互いの成立を壊さない。したがって制限も損傷も要らない（番号最小を選ぶのは一段に一つずつ入れるための便宜で、条件を満たすものを同じ段にすべて入れてもよい）。すべての $e$ で $\overline{A}\ne W_{e}$ であり、$W_{e}$ は認識可能な集合をすべて動くので、$\overline{A}$ は認識可能でない。$A$ が決定可能なら $\overline{A}$ も決定可能で、とくに認識可能になるので、$A$ は決定可能でない。
:::

::: problem {#comp:prob-fm-why-injury}
フリードバーグ–ムチニクの構成で、制限を設けない（$R_{2e+1}$ が $R_{2e}$ の使用量より下に数を入れてもよい）と、なぜ証明が破綻するかを説明せよ。
:::

::: solution
$R_{2e}$ が $\Phi_{e}^{B_{s}}(x)=0$ を見て $x$ を $A$ に入れた後、別の要求が $B$ に使用量未満の数 $y$ を入れると、神託が変わり、$\Phi_{e}^{B}(x)$ が $1$ になったり止まらなくなったりしうる。すると $\chi_{A}(x)=1$ と $\Phi_{e}^{B}(x)$ が一致する可能性があり、$R_{2e}$ は成り立たない。しかも $x$ はもう $A$ から取り除けない（$A$ は認識可能になるよう、数を入れるだけで構成している）。制限は、この「入れた後の神託の変化」を防ぐためのもので、優先度の低い要求にだけ課すことで、全体として有限回の衝突に抑えている。
:::

::: supplement
**前提を変えると.** クリーネ–ポストの方法（神託 $\varnothing'$ を使う有限延長）は、比較不能性以外にも多くの性質を $\varnothing'$ 以下で実現できるが、作られる集合は一般に認識可能でない。認識可能性を保つには、神託の代わりに「近似と修正」を行う優先論法が必要になる。損傷が無限回起こりうるが各要求の結果はなお極限で定まる「無限損傷法」もあり、サックスの稠密性定理（認識可能な次数は稠密）などに使われることが知られている（ここでは扱わない）。

**似た定理.** \ref{comp:prob-fm-noncomputable-ce} の構成はポストの単純集合（\see{comp:simple-set}）の構成に近い。ポスト（1944）は単純集合を作り、それが $\varnothing'$ と $m$ 同値でない（$m$ 完全でない）ことを示した（\see{comp:simple-not-complete}）。しかし単純集合には $\varnothing'$ と $T$ 同値なものもあり（\see{comp:simple-t-complete}）、単純性だけでは $T$ 完全でないことは言えない。決定可能でない認識可能集合で $\varnothing'$ と $T$ 同値でないものがあるかという問いがポストの問題そのもので、フリードバーグ–ムチニクの定理がそれを初めて解いた。フリードバーグ–ムチニクの定理は、認識可能な次数の半順序が線形順序でないことも示している。

**高い視点から：優先度は「譲り合いの規則」.** 要求どうしは、相手の集合を変えることで互いの成立を壊しうる。優先論法は、全員に順位を付け、「上位は下位を壊してよいが、壊すたびに下位はやり直す」という規則で、無限個の要求を同時に満たす。比喩で言えば、一車線の道を無限台の車が順に通る場面で、上位の車が来るたびに下位の車は後退するが、上位の車は有限台しかないので、どの車もいずれ最後の後退を終えて目的地に着く。帰納法で「上の者は有限回しか動かない」ことから「自分も有限回」が導けることが、この方法の核心である。
:::
