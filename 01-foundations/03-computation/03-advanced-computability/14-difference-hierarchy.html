# 差の階層 {#comp:page-difference-hierarchy keywords="Ershov difference hierarchy, n-c.e. sets, d.c.e. sets, omega-c.e. sets, number of mind changes, limit computable sets, properness of the hierarchy, Delta_2 sets that are not omega-c.e."}

\ref{comp:limit-lemma}は、$\varnothing'$ で計算できる集合を「計算可能な近似 $g(x,s)$ が有限回だけ値を変えて正しい値に落ち着く」集合として特徴づけた。近似が値を変える回数（**心変わりの回数**）に上限を付けると、認識可能な集合（$1$ 回）から $\Delta_{2}$ の集合（有限回）までの間に**差の階層**（エルショフ、1968）が並ぶ。本ページでは $n$ 回（$n$-c.e.）と、計算可能な上限で抑えられる回数（$\omega$-c.e.）を定義し、2-c.e. 集合が認識可能集合の差であること（\ref{comp:dce-difference}）を確かめたうえで、階層が真に増えていくこと（\ref{comp:difference-hierarchy-proper}）を対角線論法で示す。

> 資料：本ページは特定の教科書の記述によらず、標準的な定義と議論に従って組み立てた。

## 記法と定義の確認 {#comp:sec-dh-notation}

::: notation
- $\varphi^{(2)}_{e}$ は指数 $e$ の二変数の計算可能な部分関数（\ref{comp:index}）。$\varphi^{(2)}_{e,s}(x,t)\downarrow$ は「$s$ 段以内に止まる」ことで、$(e,x,t,s)$ について決定可能。
- 認識可能（c.e.）・補認識可能・$\varnothing'$・極限補題は \ref{comp:page-low-simple}, \tref{comp:limit-lemma}。$K\defeq\{x:x\in W_{x}\}$ は認識可能だが補集合は認識可能でない（\ref{comp:productive-basic}）。
- 集合を特性関数と同一視し、$A(x)\in\{0,1\}$ と書く。
:::

::: definition n-c.e. 集合と ω-c.e. 集合 {#comp:n-ce keywords="n-c.e. set: limit of a computable approximation starting at 0 with at most n changes; omega-c.e. with a computable bound on the number of changes" index="n-c.e. 集合|えぬしーいーしゅうごう, 差の階層|さのかいそう, ω-c.e. 集合|おめがしーいーしゅうごう"}
集合 $A$ の**近似**とは、全域で計算可能な $g\colon\N^{2}\to\{0,1\}$ で、$g(x,0)=0$ かつ各 $x$ について $\lim_{s}g(x,s)=A(x)$（ある段以降一定でその値）となるものをいう。$x$ における**変化の回数**を $\#\{s:g(x,s+1)\neq g(x,s)\}$ とする。
1. $n\ge1$ について、すべての $x$ で変化の回数が $\le n$ となる近似をもつ $A$ を **$n$-c.e.** という。2-c.e. を **d.c.e.** ともいう。
2. 計算可能な $h$ で、すべての $x$ で変化の回数が $\le h(x)$ となる近似をもつ $A$ を **$\omega$-c.e.** という。
:::

::: intuition
$n$-c.e. 集合とは、「$x$ は入るか」という問いに、最初は「いいえ」と答え、意見を高々 $n$ 回だけ変えて最後には正しい答えに落ち着く計算手続きがある集合のことである。$\omega$-c.e. では、意見を変えてよい回数が $x$ ごとに前もって計算できる。
:::

## 基本性質 {#comp:sec-dh-basic}

::: proposition 差の階層の基本性質 {#comp:difference-hierarchy-basic keywords="1-c.e. = c.e.; co-c.e. sets are 2-c.e.; n-c.e. contained in (n+1)-c.e. contained in omega-c.e. contained in Delta_2; complements" index="差の階層の基本性質|さのかいそうのきほんせいしつ"}
1. 1-c.e. 集合はちょうど認識可能な集合である。
2. $A$ が $n$-c.e. なら、補集合 $\overline{A}$ は $(n+1)$-c.e. である。とくに補認識可能な集合は 2-c.e.。
3. $n$-c.e. $\subseteq$ $(n+1)$-c.e. $\subseteq$ $\omega$-c.e. $\subseteq$ $\{A:A\le_{\mathrm{T}}\varnothing'\}$。
:::

::: proof
**1.** 変化 $\le1$ の近似 $g$ をとる。$g(x,0)=0$ なので、$x\in A$ なら $g(x,\cdot)$ は $0$ から $1$ に一度変わるだけであり、$x\notin A$ なら常に $0$ である。よって $x\in A\iff\exists s\,g(x,s)=1$ が成り立ち、$A$ は認識可能である。逆に $A=W_{e}$ なら、$g(x,s)\defeq1$（$x\in W_{e,s}$ のとき）、$0$（それ以外）とおくと、$W_{e,s}$ は $s$ について増加するので、これは変化 $\le1$ の近似である（$W_{e,0}=\varnothing$ とする）。

**2.** $g$ を $A$ の変化 $\le n$ の近似とし、$g'(x,0)\defeq0$, $g'(x,s+1)\defeq1-g(x,s)$ とおく。$g'$ の極限は $1-A(x)$ なので $g'$ は $\overline{A}$ の近似であり、その変化は $s=0\to1$ の一回（$g'(x,1)=1-g(x,0)=1$）と $g$ の変化だけなので、回数は $\le n+1$ である。

**3.** 最初の二つの包含は定義から従う（$n$-c.e. の近似は変化 $\le n+1$ でもあり、$h\equiv n+1$ とおけばよい）。最後の包含は\ref{comp:limit-lemma}による。
:::

::: proposition d.c.e. 集合は差 {#comp:dce-difference keywords="a set is 2-c.e. iff it is a difference of two c.e. sets" index="d.c.e. 集合|でぃーしーいーしゅうごう"}
$A$ が 2-c.e. であることと、認識可能な集合 $B\supseteq C$ で $A=B\setminus C$ となるものがあることは同値である。
:::

::: proof
**⇒.** 2-c.e. の近似 $g$ をとり、$B\defeq\{x:\exists s\,g(x,s)=1\}$、$C\defeq\{x:\exists s<t\,(g(x,s)=1\wedge g(x,t)=0)\}$ とおく。どちらも認識可能で $C\subseteq B$ である。変化が $\le2$ 回で初期値が $0$ なので、$x$ の値の列は $0^{\infty}$、$0^{\ast}1^{\infty}$、$0^{\ast}1^{+}0^{\infty}$ のいずれかであり、$x\in A$ となるのはちょうど二番目の場合、すなわち $x\in B\setminus C$ の場合である。

**⇐.** $B=W_{b}$, $C=W_{c}$ について、$g(x,s)\defeq1$（$x\in W_{b,s}$ かつ $x\notin W_{c,s}$ のとき）、$0$（それ以外）とおく。$x$ が $C$ に入る段より前に $B$ に入れば、値は $B$ に入った段で $1$ になり、$C$ に入った段で $0$ に戻る。$C$ に入る段が $B$ に入る段以前なら、値はずっと $0$ である。いずれの場合も変化は $\le2$ である。極限は、$x\in B\setminus C$ なら $1$、$x\in C$ または $x\notin B$ なら $0$ であり（$C\subseteq B$）、$B\setminus C$ の特性関数に等しい。
:::

::: example
$K\oplus\overline{K}\defeq\{2x:x\in K\}\cup\{2x+1:x\notin K\}$ は 2-c.e. だが、認識可能でも補認識可能でもない。実際、これは認識可能な $\{2x:x\in K\}\cup\{2x+1:x\in\N\}$ から、その部分集合で認識可能な $\{2x+1:x\in K\}$ を除いたものなので、\ref{comp:dce-difference} から 2-c.e. である。認識可能なら $\overline{K}=\{x:2x+1\in K\oplus\overline{K}\}$ が認識可能になり、補認識可能なら補集合の偶数部分 $\{2x:x\notin K\}$ から $\overline{K}$ が認識可能になって、いずれも矛盾する。
:::

## 階層が真に増えること {#comp:sec-dh-proper}

::: theorem 差の階層は真の階層 {#comp:difference-hierarchy-proper keywords="for each n there is an (n+1)-c.e. set that is not n-c.e.; there is a Delta_2 set that is not omega-c.e." index="差の階層の真性|さのかいそうのしんせい"}
1. 各 $n\ge1$ について、$(n+1)$-c.e. だが $n$-c.e. でない集合がある。
2. $A\le_{\mathrm{T}}\varnothing'$ だが $\omega$-c.e. でない集合がある。
:::

::: intuition
意見を変えてよい回数を一回増やすと、真に多くの集合が扱えるようになる。回数の上限を前もって計算できない場合まで許すと、さらに多くの集合が扱える。
:::

::: proof
**1.** $\varphi^{(2)}_{e}$ が $n$-c.e. の近似の**候補**であるとは、全域で $\{0,1\}$ 値、$\varphi^{(2)}_{e}(x,0)=0$、各 $x$ で変化 $\le n$ であることとする。すべての $n$-c.e. 集合は、ある候補の極限である。点 $e$ を、$e$ 番目の候補と食い違わせるための**証拠**として使う。

$a(e,s)$ を次で定める。段 $s$ で、$t=0,1,\dots$ の順に $\varphi^{(2)}_{e,s}(e,t)\downarrow$ を調べ、$0$ から連続して止まった最後の $t$ を $t_{s}$ とする（$t=0$ で止まらなければ $t_{s}$ は未定義）。$\varphi^{(2)}_{e,s}$ の停止は $s$ について単調なので、$t_{s}$ は $s$ について減らない。
- $t_{s}$ が未定義の場合、$a(e,s)\defeq0$ とする。
- $\varphi^{(2)}_{e}(e,0),\dots,\varphi^{(2)}_{e}(e,t_{s})$ の中に $\{0,1\}$ 以外の値があるか、$\varphi^{(2)}_{e}(e,0)\neq0$ であるか、この列の変化が $n$ 回を超えている場合（**凍結**）、$a(e,s)\defeq a(e,s-1)$ とする。$t_{s}$ が減らず、見えている値は変わらないので、一度凍結すれば以後ずっと凍結する。
- それ以外の場合、$a(e,s)\defeq1-\varphi^{(2)}_{e}(e,t_{s})$ とする。

段 $0$ では何も止まらないとして $a(e,0)=0$ であり、$a$ は計算可能である。

**Step 1.** 【主張：$A(e)\defeq\lim_{s}a(e,s)$ の集合 $A$ は $(n+1)$-c.e.】$a(e,\cdot)$ は、凍結されずに初めて値を定める段で高々一回（$0\to1$）変わる。以後凍結されるまでは、$t_{s}$ が $t$ から $t'>t$ に増えて $a$ の値が変わるのは $\varphi^{(2)}_{e}(e,t)\neq\varphi^{(2)}_{e}(e,t')$ のときだけで、そのとき $t$ と $t'$ の間で列 $\varphi^{(2)}_{e}(e,\cdot)$ が少なくとも一回変化している。凍結されていない間この列の変化は $\le n$ 回なので、それ以降の $a$ の変化は $\le n$ 回であり、凍結後は変わらない。よって $a(e,\cdot)$ の変化は $\le n+1$ 回で、極限が存在し、$a$ は $A$ の変化 $\le n+1$ の近似である。

**Step 2.** 【主張：$A$ は $n$-c.e. でない】$B$ を $n$-c.e. とし、$e$ をその近似となる候補の指数とする。$\varphi^{(2)}_{e}$ は全域なので $t_{s}\to\infty$ であり、候補なので凍結は起きない。よって $\lim_{s}a(e,s)=1-\lim_{t}\varphi^{(2)}_{e}(e,t)=1-B(e)$ となり、$A(e)\neq B(e)$、すなわち $A\neq B$ である。

**2.** 候補を、二つの指数の組 $\langle i,j\rangle$（$\varphi^{(2)}_{i}$ が近似、$\varphi_{j}$ が変化の回数の上限）とし、点 $x=\langle i,j\rangle$ を証拠にする。段 $s$ で $\varphi_{j}(x)$ がまだ止まっていなければ $a(x,s)\defeq0$ とする。止まって値 $m$ を得たら、以後は 1 と同じ規則で、$\varphi^{(2)}_{i}(x,\cdot)$ の見えている部分が $\{0,1\}$ 値・初期値 $0$・変化 $\le m$ である限り $a(x,s)\defeq1-\varphi^{(2)}_{i}(x,t_{s})$ とし、そうでなくなったら凍結する。Step 1 と同様に変化の回数は $\le m+1$ で有限なので、極限 $A(x)$ が存在する。$a$ は計算可能なので、極限補題から $A\le_{\mathrm{T}}\varnothing'$ である。一方、$\omega$-c.e. な $B$ の近似の指数 $i$ と上限の指数 $j$ をとると、$x=\langle i,j\rangle$ では凍結は起きず、Step 2 と同様に $A(x)=1-B(x)$ となる。よって $A$ は $\omega$-c.e. でない。

::: hypcheck
- **近似の初期値 $g(x,0)=0$**：1-c.e. が認識可能と一致すること（\ref{comp:difference-hierarchy-basic.1}）と、変化の回数の数え方の基準に使った。Step 2 では候補の初期値 $0$ を、Step 1 では $a(e,0)=0$ を使う。初期値を自由にすると、補認識可能な集合が 1 回の変化で書けてしまう。
- **候補の一様な枚挙**：Step 2 で、すべての $n$-c.e. 集合の近似が $\varphi^{(2)}_{e}$ のどれかとして現れること（万能関数の存在）に使った。
- **凍結**：Step 1 で、候補でない $e$（全域でない、値が不正、変化が多すぎる）で $a(e,\cdot)$ の変化が増えすぎないようにするのに使った。候補かどうかは決定可能でないが、「いま見えている範囲で候補をやめた」ことは有限の段で分かる。
:::
:::

## 真理表還元との関係 {#comp:sec-dh-tt}

::: definition 真理表還元 {#comp:tt-reducibility keywords="truth-table reducibility: x in A iff a computable Boolean combination of finitely many computable queries to B holds" index="真理表還元|しんりひょうかんげん"}
集合 $A,B$ について、$A$ が $B$ に**真理表還元可能**（$A\le_{\mathrm{tt}}B$）であるとは、計算可能な関数があって、各 $x$ に有限個の数 $q_{1},\dots,q_{m}$（問い合わせ）とブール関数 $\beta\colon\{0,1\}^{m}\to\{0,1\}$（真理表）を与え、
$$
A(x)=\beta\bigl(B(q_{1}),\dots,B(q_{m})\bigr)
$$
となることをいう（$m,q_{i},\beta$ は $x$ から計算され、$B$ の答えに依存しない）。$A\le_{\mathrm{tt}}B$ なら $A\le_{\mathrm{T}}B$。
:::

::: intuition
真理表還元とは、問い合わせる場所と、答えの組み合わせから結論を出す規則とを、神託に尋ねる前にすべて決めてしまうチューリング還元のことである。
:::

::: theorem ω-c.e. と真理表還元 {#comp:omega-ce-tt keywords="a set is omega-c.e. iff it is truth-table reducible to the halting set" index="ω-c.e. と真理表還元|おめがしーいーとしんりひょうかんげん"}
集合 $A$ について、$A$ が $\omega$-c.e. であることと $A\le_{\mathrm{tt}}\varnothing'$ であることは同値である。
:::

::: intuition
意見を変える回数を前もって計算できる集合とは、停止問題に、尋ねる前に決めた有限個の質問をするだけで判定できる集合のことである。
:::

::: proof
**⇒.** 近似 $g$ と変化の回数の上限 $h$ をとる。$k\ge1$ について「$g(x,\cdot)$ は少なくとも $k$ 回変化する」は、$\exists s_{1}<\dots<s_{k}$ で各 $s_{j}$ で値が変わる、という $\Sigma_{1}$ の条件である。よって $\varnothing'$ への計算可能な写像還元 $r$（\ref{comp:jump-properties.3}）で、$r(x,k)\in\varnothing'\iff$「少なくとも $k$ 回変化」となるものがある。問い合わせを $q_{k}\defeq r(x,k)$（$k=1,\dots,h(x)$）とし、真理表を「答えが $1$ の個数が奇数なら $1$」とする。$g(x,0)=0$ であり、値は変化のたびに $0,1$ を入れ替えるので、$A(x)$ は変化の回数が奇数なら $1$、偶数なら $0$ である。変化の回数は $\le h(x)$ なので、それは「答えが $1$ となる $k$ の個数」に等しい。よってこの真理表は $A(x)$ を与える。

**⇐.** $A\le_{\mathrm{tt}}\varnothing'$ を与える $x\mapsto(q_{1},\dots,q_{m},\beta)$ をとる。$\varnothing'_{s}$ を、$s$ 段以内に $\varnothing'$ に入ることが確かめられる $s$ 以下の数の集合とする（$\varnothing'$ は認識可能、\ref{comp:jump-properties.1}）。$g(x,0)\defeq0$、$s\ge1$ で $g(x,s)\defeq\beta(\varnothing'_{s}(q_{1}),\dots,\varnothing'_{s}(q_{m}))$ とおく。各 $\varnothing'_{s}(q_{i})$ は $s$ について $0\to1$ に高々一回変わり、その極限は $\varnothing'(q_{i})$ である。よって $g(x,s)$ は極限 $A(x)$ をもち、$g(x,\cdot)$ の変化は、段 $0\to1$ の一回と、いずれかの $q_{i}$ の答えが変わる段（高々 $m$ 回）でしか起きないので、$h(x)\defeq m+1$（$x$ から計算できる）で抑えられる。
:::

## 問題 {#comp:sec-dh-problems}

::: problem {#comp:prob-dh-union}
$A,B$ が認識可能なら、$A\cup\overline{B}$ は 3-c.e. で、その補集合は 2-c.e. であることを示せ。
:::

::: solution
**補集合.** $\overline{A\cup\overline{B}}=\overline{A}\cap B=B\setminus(A\cap B)$ が成り立ち、$A\cap B\subseteq B$ はどちらも認識可能なので、\ref{comp:dce-difference} から補集合は 2-c.e. である。

**3-c.e.** $A\cup\overline{B}$ は 2-c.e. 集合の補集合なので、\ref{comp:difference-hierarchy-basic.2} から 3-c.e. である。直接には、$g(x,0)\defeq0$、$s\ge1$ で $g(x,s)\defeq1$（$x\in A_{s}$ または $x\notin B_{s}$）、$0$（それ以外）とおくと、値の列は $0$ から始まり、$x\notin B_{s}$ の間は $1$、$B$ に入って $A$ にまだ入っていなければ $0$、$A$ に入れば $1$ で、変化は高々 $0\to1\to0\to1$ の 3 回。
:::

::: problem {#comp:prob-dh-truth-table}
\ref{comp:omega-ce-tt} と \ref{comp:difference-hierarchy-proper.2} から、$\varnothing'$ でチューリング計算できるが $\varnothing'$ から真理表還元できない集合があることを結論せよ。また、$K\oplus\overline{K}$ が $\varnothing'$ から真理表還元できることを直接確かめよ。
:::

::: solution
\ref{comp:difference-hierarchy-proper.2} の $A$ は $A\le_{\mathrm{T}}\varnothing'$ で $\omega$-c.e. でないので、\ref{comp:omega-ce-tt} から $A\not\le_{\mathrm{tt}}\varnothing'$。後半：$K\le_{\mathrm{m}}\varnothing'$（\ref{comp:jump-properties.3}）を与える $r$ をとる。$2x$ には問い合わせ $r(x)$ と真理表「答えそのもの」を、$2x+1$ には同じ問い合わせと真理表「答えの否定」を対応させると、$2x\in K\oplus\overline{K}\iff r(x)\in\varnothing'$、$2x+1\in K\oplus\overline{K}\iff r(x)\notin\varnothing'$ となり、真理表還元が得られる。
:::

::: supplement
**前提を変えると.**
- **超限の階層.** 変化の回数を順序数 $\alpha$ で数える（変化のたびに順序数を減らす）と、$\alpha$-c.e. 集合の階層が $\Delta_{2}$ の中に超限に続くことが知られている（エルショフの階層。計算可能な順序数の記法を使う。ここでは扱わない）。$\alpha$-c.e. 集合は計算可能な近似の極限なのでどれも $\Delta_{2}$ に属し、逆に $\Delta_{2}$ の集合はすべて、計算可能な順序数（の適当な記法）$\alpha$ について $\alpha$-c.e. であることが知られている（どの $\alpha$ が要るかは記法の選び方に依存する）。
- **次数.** 差の階層の各段は、チューリング次数の意味でも真に増えることが知られている：各 $n\ge1$ について、$(n+1)$-c.e. な集合の次数で、$n$-c.e. な集合を一つも含まないものがある（$n=1$ の場合は、認識可能な次数でない 2-c.e. な次数があるというクーパーの定理。ここでは扱わない）。

**似た定理.** 算術的階層（\ref{comp:post-theorem}）は「量化子の交代の回数」で集合を分類し、差の階層は「心変わりの回数」で $\Delta_{2}$ の内側を分類する。極限補題は、この二つをつなぐ（$\Delta_{2}$ は極限で計算できる）。

**高い視点から.** 近似 $g(x,s)$ は、「$x$ は $A$ に入るか」という問いに対して、時間とともに意見を述べ続ける観測者である。認識可能な集合では、観測者は「はい」と一度言ったら撤回しない。差の階層は、撤回を何回まで許すかの段階であり、比喩で言えば、判決を何回まで覆せるかの規則の違いである。対角線論法は、相手が使える撤回の回数より一回多く撤回できる者が、必ず相手と違う結論に到達できることを示している。
