# 低基底定理 {#comp:page-low-basis keywords="low basis theorem, Jockusch-Soare, computable binary trees, Pi^0_1 classes, forcing the jump, computable tree without computable paths, recursively inseparable sets, weak Konig lemma"}

計算可能な無限二分木は道（無限の枝）をもつ（弱ケーニッヒの補題、\ref{comp:nested-trees-path}）が、計算可能な道をもつとは限らない（\ref{comp:tree-no-computable-path}）。では道はどれほど複雑でなければならないか。**低基底定理**（ヨックシュ–ソーア、\tref{comp:low-basis}）は、道として**低い**もの（ジャンプが $\varnothing'$ で計算できるもの、\ref{comp:low-set}）がとれることを示す。証明は、神託機械の停止・非停止を一つずつ $\varnothing'$ の助けで「強制」しながら部分木を絞っていく方法である。

> 資料：本ページは特定の教科書の記述によらず、標準的な議論に従って組み立てた。逆数学のページ（\ref{logic:page-rm-wkl0}）と二階算術のページで引用していた定理を、ここで証明する。

## 記法と定義の確認 {#comp:sec-lb-notation}

::: notation
- $2^{<\omega}$ は有限の $0,1$ 列（文字列）全体、$\sigma\preceq\tau$ は接頭辞、$\lvert\sigma\rvert$ は長さ。**二分木**は接頭辞で閉じた $T\subseteq2^{<\omega}$、その**道**は $X\in2^{\omega}$ ですべての $X\restr n$ が $T$ に属するもの。道全体を $[T]$ と書く。$T$ が**計算可能**とは、$\sigma\in T$ が決定可能であること。
- 神託機械、ジャンプ $B'=\{\langle M,w\rangle:M^{B}\text{ は }w\text{ を受理}\}$、使用の原理は \ref{comp:oracle-tm}, \ref{comp:jump}, \ref{comp:use-principle-sets} のとおり。低集合は \ref{comp:low-set}。
- 文字列 $\sigma$ を神託とする計算 $M^{\sigma}$：$y<\lvert\sigma\rvert$ への問い合わせには $\sigma(y)$ で答え、$y\ge\lvert\sigma\rvert$ を問い合わせたら止まらないとする。「$M^{\sigma}$ は $w$ を $s$ 段以内に受理する」は $(M,w,\sigma,s)$ について決定可能で、$\sigma\preceq\tau$, $s\le t$ なら $M^{\tau}$ も $t$ 段以内に受理する（**単調性**）。使用の原理から、$M^{X}$ が $w$ を受理する $\iff$ ある $n$ で $M^{X\restr n}$ が $w$ を $n$ 段以内に受理する。
- $\Pi_{1}$ の問いは $\varnothing'$ で決定できる（$\Sigma_{1}$ の集合は認識可能で $\varnothing'$ に写像還元される：\ref{comp:sigma1-recognizable}, \ref{comp:jump-properties.3}）。
- $\varphi_{e}$ は指数 $e$ の一変数の計算可能な部分関数（\ref{comp:index}）。集合 $B,X$ の**結合**を $B\oplus X\defeq\{2y:y\in B\}\cup\{2y+1:y\in X\}$ と書く。
:::

## 準備 {#comp:sec-lb-prelim}

::: lemma 無限性は Π₁ {#comp:tree-infinite-pi1 keywords="for a computable binary tree, being infinite is a Pi_1 property decidable from 0'" index="木の無限性|きのむげんせい"}
計算可能な二分木 $T$（の計算する機械の符号）について、「$T$ は無限」は $\Pi_{1}$ で、$\varnothing'$ で決定できる。
:::

::: proof
各長さの元は有限個なので、$T$ が無限なら任意に長い元をもち、接頭辞で閉じていることから各長さ $n$ の元をもつ。逆に各長さの元をもてば無限である。よって $T$ が無限 $\iff$ すべての $n$ で長さ $n$ の元をもつ、が成り立つ。「長さ $n$ の元がある」は $2^{n}$ 個の $\sigma$ の検査で決定可能なので、全体は $\forall n\,(\text{決定可能})$ の形で $\Pi_{1}$ である。$\varnothing'$ で決定できることは記法の項の最後の注意による。
:::

::: lemma 減少する木の列の共通の道 {#comp:nested-trees-path keywords="a decreasing sequence of infinite binary trees has a common path; weak Konig lemma" index="減少する木の列|げんしょうするきのれつ, 弱ケーニッヒの補題|じゃくけーにっひのほだい"}
無限二分木の減少列 $T_{0}\supseteq T_{1}\supseteq\cdots$ について、すべての $e$ で $X\in[T_{e}]$ となる $X\in2^{\omega}$ がある。とくに（すべての $T_{e}$ を同じ $T$ にとれば）無限二分木は道をもつ（**弱ケーニッヒの補題**）。
:::

::: proof
$\sigma$ を延長する $T_{e}$ の元（$\sigma\preceq\tau\in T_{e}$ となる $\tau$）が無限個あることを「$\sigma$ は $T_{e}$ で延びる」と言い、$S\defeq\{\sigma:\text{すべての }e\text{ で }\sigma\text{ は }T_{e}\text{ で延びる}\}$ とおく。

**Step 1.** 【主張：$\sigma\in S$ なら、$\sigma0$ と $\sigma1$ の一方は $S$ に属する】$i=0,1$ について $E_{i}\defeq\{e:\sigma i\text{ は }T_{e}\text{ で延びる}\}$ とおく。$\sigma$ の延長は $\sigma$ 自身を除けば $\sigma0$ か $\sigma1$ の延長なので、各 $e$ で $e\in E_{0}\cup E_{1}$ となる。また $T_{e+1}\subseteq T_{e}$ なので、$T_{e+1}$ で延びれば $T_{e}$ でも延び、$E_{i}$ は下に閉じている。$E_{0}\cup E_{1}=\N$ なので一方は無限であり、下に閉じた無限集合は $\N$ である。よって $E_{0}=\N$ または $E_{1}=\N$ である。

**Step 2.** 【主張：すべての $n$ で $X\restr n\in S$ となる $X$ がある】各 $T_{e}$ は無限なので空列は $S$ に属する。$X\restr(n+1)$ を、$(X\restr n)0\in S$ なら $(X\restr n)0$、そうでなければ $(X\restr n)1$ と定めると、Step 1 と $n$ に関する帰納法から $X\restr n\in S$ が成り立つ。

$T_{e}$ は接頭辞で閉じているので、$T_{e}$ で延びる $\sigma$ は $T_{e}$ に属する。よってすべての $e,n$ で $X\restr n\in T_{e}$ であり、$X\in[T_{e}]$ である。
:::

::: remark
位相の言葉では、$[T_{e}]$ はカントール空間 $2^{\omega}$ の空でない閉集合の減少列であり、\ref{comp:nested-trees-path} は $2^{\omega}$ のコンパクト性（\see{top:tychonoff}）の言い換えである。上の証明は位相を使わずに直接示した。
:::

::: theorem 計算可能な道をもたない木 {#comp:tree-no-computable-path keywords="there is an infinite computable binary tree with no computable path (Kleene)" index="計算可能な道をもたない木|けいさんかのうなみちをもたないき"}
計算可能な無限二分木で、計算可能な道をもたないものがある。
:::

::: intuition
計算で作れる無限の二分木には必ず無限の枝があるが、その枝を一本も計算で書き出せないような木がある。
:::

::: proof
$A\defeq\{e:\varphi_{e}(e)\simeq0\}$, $B\defeq\{e:\varphi_{e}(e)\simeq1\}$ は交わらない認識可能な集合である。段階 $s$ までに列挙される部分を $A_{s}$, $B_{s}$ とし、
$$
T\defeq\{\sigma:\forall y<\lvert\sigma\rvert\ \bigl[(y\in A_{\lvert\sigma\rvert}\to\sigma(y)=1)\wedge(y\in B_{\lvert\sigma\rvert}\to\sigma(y)=0)\bigr]\}
$$
とおく。$T$ は計算可能な二分木である（$\tau\preceq\sigma$ なら $A_{\lvert\tau\rvert}\subseteq A_{\lvert\sigma\rvert}$, $B_{\lvert\tau\rvert}\subseteq B_{\lvert\sigma\rvert}$ なので、$\tau$ の検査は $\sigma$ の検査に含まれ、接頭辞で閉じる）。$A$ の特性関数は道なので、$T$ は無限である。道 $X$ は $A\subseteq X$, $X\cap B=\emptyset$ を満たす（$y\in A$ なら十分大きい $n$ で $y\in A_{n}$ となり、$X\restr n\in T$ から $X(y)=1$。$B$ も同様）。$X$ が計算可能だと仮定すると、特性関数 $\chi_{X}=\varphi_{e}$（全域）となる $e$ がある。$\varphi_{e}(e)\in\{0,1\}$ であり、$\varphi_{e}(e)=0$ なら $e\in A\subseteq X$ から $\chi_{X}(e)=1$ となり、$\varphi_{e}(e)=1$ なら $e\in B$ から $\chi_{X}(e)=0$ となる。いずれも矛盾である。
:::

## 低基底定理 {#comp:sec-lb-theorem}

::: theorem 低基底定理 {#comp:low-basis keywords="Jockusch-Soare low basis theorem: every infinite computable binary tree has a low path" index="低基底定理|ていきていていり" refname="低基底定理"}
計算可能な無限二分木 $T$ は低い道をもつ：$X\in[T]$ で $X'\le_{\mathrm{T}}\varnothing'$ となるものがある。
:::

::: intuition
計算可能な無限二分木には、停止問題の神託があれば、その枝を神託とする計算が止まるかどうかまで分かるような、単純な枝がある。
:::

::: proof
組 $\langle M,w\rangle$ 全体を $q_{0},q_{1},\ldots$ と計算可能に並べ、計算可能な無限二分木の列 $T=T_{0}\supseteq T_{1}\supseteq\cdots$ を次のように作る。$q_{e}=\langle M,w\rangle$ について
$$
U_{e}\defeq\{\sigma\in T_{e}:M^{\sigma}\text{ は }w\text{ を }\lvert\sigma\rvert\text{ 段以内に受理しない}\}
$$
とおく。**単調性**から $U_{e}$ は接頭辞で閉じており、計算可能な二分木である。
- $U_{e}$ が無限なら $T_{e+1}\defeq U_{e}$ とおく（「拒否を強制」）。
- $U_{e}$ が有限なら $T_{e+1}\defeq T_{e}$ とおく（「受理を強制」）。

どちらの場合も $T_{e+1}$ は無限である。

**Step 1（各段の効果）.** 【主張：$X\in[T_{e+1}]$ なら、拒否を強制した場合 $M^{X}$ は $w$ を受理せず、受理を強制した場合 $M^{X}$ は $w$ を受理する】拒否を強制した場合、すべての $n$ で $X\restr n\in U_{e}$ なので、どの $n$ でも $M^{X\restr n}$ は $w$ を $n$ 段以内に受理しない。よって使用の原理（記法の項）から $M^{X}$ は $w$ を受理しない。受理を強制した場合、$U_{e}$ は有限なので、ある $n$ 以上の長さの $U_{e}$ の元はない。$X\restr n\in T_{e+1}=T_{e}$ だが $X\restr n\notin U_{e}$ なので、$M^{X\restr n}$ は $w$ を $n$ 段以内に受理し、単調性から $M^{X}$ は $w$ を受理する。

**Step 2（道の存在）.** 【主張：すべての $e$ で $X\in[T_{e}]$ となる $X$ がある】各 $T_{e}$ は無限で $T_{0}\supseteq T_{1}\supseteq\cdots$ なので、\ref{comp:nested-trees-path} から従う。

**Step 3（$\varnothing'$ による計算）.** 【主張：$X'\le_{\mathrm{T}}\varnothing'$】各段の選択は「$U_{e}$ は無限か」という $\Pi_{1}$ の問いの答えで決まり、これは $\varnothing'$ で決定できる（\ref{comp:tree-infinite-pi1}）。$T_{e}$ を計算する機械の符号は、それまでの答えの列から計算可能に得られる。よって $\varnothing'$ は $e=0,1,\dots$ について順に選択の列を計算できる。Step 1 から、$q_{e}\in X'$ $\iff$ 第 $e$ 段で受理を強制した、が成り立つので、$X'\le_{\mathrm{T}}\varnothing'$ である。
:::

::: hypcheck
- **単調性（使用の原理）**：$U_{e}$ が木であること、Step 1 の両方の場合に使った。
- **$\Pi_{1}$ の問いを $\varnothing'$ で決定できること**：Step 3 の核心で、ここで神託 $\varnothing'$ が必要になる。
- **減少する木の列の共通の道（カントール空間のコンパクト性）**：Step 2 で、無限に多くの段の後にも道が残ることに使った。各 $T_{e}$ が無限であることだけでは、共通部分の木 $\bigcap_{e}T_{e}$ が無限であることは直ちには分からない（\ref{comp:nested-trees-path} は「すべての $T_{e}$ で延びる」元を選んで示した）。
- **$T$ が計算可能**：Step 3 で、各 $U_{e}$ が計算可能で、その無限性が $\Pi_{1}$ になることに使った。$T$ が $B$ で計算可能なだけなら、同じ議論で \ref{comp:low-basis-relative} が得られる。
:::

::: corollary 相対化された低基底定理 {#comp:low-basis-relative keywords="relativized low basis theorem: a B-computable infinite binary tree has a path X with (B join X)' <=_T B'" index="相対化された低基底定理|そうたいかされたていきていていり"}
集合 $B$ で計算可能な無限二分木 $T$ は、$(B\oplus X)'\le_{\mathrm{T}}B'$ となる道 $X$ をもつ。とくに $X'\le_{\mathrm{T}}B'$ である。
:::

::: proof
\ref{comp:low-basis} の証明で、神託を $B\oplus X$ に置き換える。文字列 $\sigma$ について、神託 $B\oplus\sigma$ は $2y$ への問い合わせに $B(y)$ で、$2y+1$（$y<\lvert\sigma\rvert$）への問い合わせに $\sigma(y)$ で答え、$2y+1$（$y\ge\lvert\sigma\rvert$）を問い合わせたら止まらないとする。$q_{e}=\langle M,w\rangle$ について $U_{e}\defeq\{\sigma\in T_{e}:M^{B\oplus\sigma}\text{ は }w\text{ を }\lvert\sigma\rvert\text{ 段以内に受理しない}\}$ とおくと、$U_{e}$ は $B$ で計算可能な二分木で、単調性と使用の原理（\ref{comp:use-principle-sets}）は同じ形で成り立つ。よって Step 1 と Step 2 はそのまま通り、$q_{e}\in(B\oplus X)'\iff$ 第 $e$ 段で受理を強制した、となる。Step 3 では、「$U_{e}$ は有限」すなわち「ある $n$ で $U_{e}$ に長さ $n$ の元がない」は $B$ で認識可能なので、\ref{comp:jump-properties.3} から $B'$ への写像還元で判定でき、$T_{e}$ の符号も $B'$ で順に計算できる。よって $(B\oplus X)'\le_{\mathrm{T}}B'$ である。後半は、$X\le_{\mathrm{T}}B\oplus X$ と \ref{comp:low-degree.1} から $X'\le_{\mathrm{T}}(B\oplus X)'$ となることによる。
:::

::: corollary 低い道と完全でない次数 {#comp:low-basis-corollary keywords="the low path is not of degree 0'; computable trees without computable paths have paths of degree strictly between 0 and 0'" index="低基底定理の系|ていきていていりのけい"}
\ref{comp:tree-no-computable-path} の木の低い道 $X$ は、$\varnothing<_{\mathrm{T}}X<_{\mathrm{T}}\varnothing'$ を満たす（$\varnothing'$ より真に低い非計算的な次数）。
:::

::: proof
\ref{comp:tree-no-computable-path} から $X$ は計算可能でないので、$\varnothing<_{\mathrm{T}}X$ である。$X$ は $X$ で認識可能なので、\ref{comp:jump-properties.3} から $X\le_{\mathrm{m}}X'$ であり、$X'\le_{\mathrm{T}}\varnothing'$ と合わせて $X\le_{\mathrm{T}}\varnothing'$ を得る。$\varnothing'\le_{\mathrm{T}}X$ だと仮定すると、ジャンプの単調性（\ref{comp:low-degree.1}）から $\varnothing''\le_{\mathrm{T}}X'\le_{\mathrm{T}}\varnothing'$ となり、\ref{comp:jump-properties.2} に反する。よって $X<_{\mathrm{T}}\varnothing'$ である。
:::

## 問題 {#comp:sec-lb-problems}

::: problem {#comp:prob-lb-computable-path}
計算可能な無限二分木が**孤立した道**（ある $\sigma$ について、$\sigma$ を延長する道がただ一つ）をもてば、その道は計算可能であることを示せ。
:::

::: solution
$\sigma$ を延長する道がただ一つ $X$ だとする。$\tau$ について $T_{\tau}\defeq\{\rho\in T:\rho\preceq\tau\text{ または }\tau\preceq\rho\}$ とおくと、これは計算可能な二分木で、「$\tau$ を延長する道がある」$\iff$ $T_{\tau}$ が無限、が成り立つ（⇐ は \ref{comp:nested-trees-path}。⇒ は道の始切片が無限個あるから）。$n\ge\lvert\sigma\rvert$ について $X\restr n$ が分かっているとし、その二つの延長を $\tau_{0}=(X\restr n)0$, $\tau_{1}=(X\restr n)1$ とおく。$X\restr(n+1)$ は一方であり、もう一方を延長する道は $\sigma$ を延長する $X$ 以外の道になるので存在しない。よって $T_{\tau_{0}}$ と $T_{\tau_{1}}$ のちょうど一方が有限であり、有限な木はある長さ $m$ の元をもたない。そこで $m=0,1,2,\dots$ について「$T_{\tau_{0}}$ が長さ $m$ の元をもたない」と「$T_{\tau_{1}}$ が長さ $m$ の元をもたない」を同時に調べ、先に成り立った方でない $\tau_{i}$ を $X\restr(n+1)$ とする。この探索は必ず終わり、$X\restr\lvert\sigma\rvert=\sigma$ から始めて繰り返せば $X$ が計算できる。
:::

::: problem {#comp:prob-lb-pa}
算術の言語の文を $\psi_{0},\psi_{1},\dots$ と計算可能に並べ、$\psi^{1}\defeq\psi$, $\psi^{0}\defeq\neg\psi$ とする。
1. $T\defeq\{\sigma\in2^{<\omega}:\PA\cup\{\psi_{i}^{\sigma(i)}:i<\lvert\sigma\rvert\}\text{ から }\bot\text{ を導く符号 }\lvert\sigma\rvert\text{ 未満の証明がない}\}$ は計算可能な二分木であり、その道 $X$ と $\PA$ の完全な\term[無矛盾]{logic:derivability}拡大 $\{\psi_{i}:X(i)=1\}$ が一対一に対応することを示せ。
2. $\PA$ の完全な無矛盾拡大で低いものがあることを示せ。
:::

::: solution
**1.** 証明の符号を見て正しい証明かどうかを判定することは決定可能（\ref{pt:bew-sigma}）であり、符号 $\lvert\sigma\rvert$ 未満の証明は有限個なので、$T$ は計算可能である。$\tau\preceq\sigma$ なら $\tau$ の前提は $\sigma$ の前提に含まれ、調べる証明も少ないので、$T$ は接頭辞で閉じている。$X$ を道とし、$\Gamma_{X}\defeq\PA\cup\{\psi_{i}^{X(i)}:i\in\N\}$ とおく。$\Gamma_{X}$ から $\bot$ を導く証明があれば、それは有限個の前提しか使わず、ある $n$ でその符号は $n$ 未満で、前提は $X\restr n$ の分に含まれるので、$X\restr n\notin T$ となって矛盾する。よって $\Gamma_{X}$ は\term[無矛盾]{logic:derivability}で、各文かその否定を含むので完全である。$\Gamma_{X}\vdash\psi_{j}$ なら $\psi_{j}^{0}=\neg\psi_{j}\notin\Gamma_{X}$ なので $X(j)=1$ となり、$\{\psi_{i}:X(i)=1\}$ は $\PA$ を含み導出で閉じた、完全で無矛盾な理論である。逆に $\PA$ の完全な無矛盾拡大 $\Sigma$ について $X(i)\defeq1$（$\psi_{i}\in\Sigma$）、$0$（それ以外）とおくと、各 $X\restr n$ の前提は $\Sigma$ に含まれ、$\Sigma$ は無矛盾なので $X\restr n\in T$ である。二つの対応は互いに逆である。

**2.** 標準モデル $\mathcal{N}$ で真な文全体は、$\PA$ を含む完全な無矛盾拡大である（モデルをもつ文の集合は無矛盾）。よって 1 から $T$ は道をもち、とくに無限である。（$\PA$ が無矛盾であることだけを使うなら、\ref{logic:lindenbaum-via-konig} から完全な無矛盾拡大があることを使えばよい。）\ref{comp:low-basis} から $T$ の低い道 $X$ があり、1 からそれに対応する $\PA$ の完全な無矛盾拡大は、集合として（文の番号で見て）$X$ と同じなので低い。
:::

::: supplement
**前提を変えると.** 同じ方法を相対化すると、$B$ で計算可能な無限二分木は $(B\oplus X)'\le_{\mathrm{T}}B'$ を満たす道 $X$ をもつ（\ref{comp:low-basis-relative}）。低基底定理とは別の強制の議論で、道として「**ハイパー免疫自由**」なもの（ハイパー免疫自由基底定理）や、与えられた計算可能でない集合 $C$ を計算しないもの（錐の回避）もとれることが知られている（ヨックシュ–ソーア。ここでは扱わない）。計算可能な道は一般にとれない（\ref{comp:tree-no-computable-path}）ので、低さは「道をどこまで単純にできるか」の一つの最良の答えである。

**似た定理.** 二階算術では、\ref{comp:low-basis-relative} を繰り返し使うと $\mathsf{WKL}_{0}$ の ω モデルで、すべての元が低いものが作れる：$A_{0}\defeq\varnothing$ から始め、ある $A_{k}$ で計算可能な無限二分木がすべてどこかの段で取り上げられるように順に並べ、段 $k$ で取り上げた（$A_{k}$ で計算可能な）木について、その道 $X$ で $(A_{k}\oplus X)'\le_{\mathrm{T}}A_{k}'$ となるものをとり $A_{k+1}\defeq A_{k}\oplus X$ とすると、帰納法で $A_{k}'\le_{\mathrm{T}}\varnothing'$ であり、ある $A_{k}$ で計算できる集合全体がその ω モデルになる（低い集合で計算できる集合は、\ref{comp:low-degree.1} から低い）。$\varnothing'$ は低くないので含まれず、$\mathsf{WKL}_{0}$ が $\mathsf{ACA}_{0}$ を証明しないことが分かる（\see{logic:page-rm-wkl0}）。単純な低集合の存在（\ref{comp:low-simple-set}）も低さを「強制」する議論で、優先論法を使う点が異なる。

**高い視点から：問いに一つずつ答えを決めて道を絞る.** $X'$ を計算するには、$X$ を神託とする各計算が止まるかどうかを知る必要がある。低基底定理の証明は、各計算について「止まらないようにできるなら止まらない側の木に絞り、できないなら止まる」と決めていく。どちらにできるかの判定がちょうど $\varnothing'$ の一回の問い合わせで済むので、最後に残る道のジャンプは $\varnothing'$ で読める。比喩で言えば、迷路の分かれ道ごとに「この先にまだ出口へ通じる道があるか」を神託に一度だけ尋ね、通じる側を選び続けることで、神託の答えの記録そのものが道の性質の完全な記録になる。
