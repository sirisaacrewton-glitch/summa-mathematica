# アッカーマン関数と while の必要性 {#comp:page-ackermann keywords="Ackermann function, Ackermann-Peter function, not primitive recursive, loop programs bounded, Meyer-Ritchie bounding lemma, while loop necessary"}

for プログラムはすべての入力で停止する（\ref{comp:for-total}）。では、全域的な計算可能関数はすべて for プログラムで計算できるだろうか。本ページでは、そうでないことを**アッカーマン関数** $A$（\ref{comp:ackermann}）で示す。for プログラムが状態の値をどこまで大きくできるかは、入れ子の深さに応じた $A(k,\cdot)$ で抑えられ（\ref{comp:loop-bound}）、対角線 $A(y,y)$ はそのどれよりも速く増えるので原始再帰的でない（\ref{comp:ackermann-not-pr}）。一方 $A$ は、スタックを使えば while ループ一つで計算できる（\ref{comp:ackermann-computable}）。したがって L の while は、全域的な関数の範囲でも本質的に計算能力を広げる。

## 記法と定義の確認 {#comp:sec-ack-notation}

::: notation
- L、$\mathrm{L}_{\mathrm{for}}$、意味 $[\![P]\!]$、局所性（\ref{comp:L-locality}）、略記（\ref{comp:L-macros}）、サブルーチン呼び出し（\ref{comp:L-composition}）は \ref{comp:page-language-L} のとおり。
- 原始再帰関数と for 計算可能関数の一致（\ref{comp:pr-equals-for}）、対関数 $\pi,\pi_{1},\pi_{2}$（\ref{comp:pairing-pr}）を使う。
- 関数 $g\colon\N\to\N$ の $t$ 回の合成を $g^{t}$ と書く（$g^{0}=\mathrm{id}$）。
- プログラム $P$ と状態 $\sigma$ について $\lvert\sigma\rvert_{P}\defeq\max\{\sigma(v):v\in\mathrm{var}(P)\}$ とする。
:::

## アッカーマン関数 {#comp:sec-ackermann}

::: definition アッカーマン関数 {#comp:ackermann keywords="Ackermann function, Ackermann-Peter" index="アッカーマン関数|あっかーまんかんすう"}
$A\colon\N^{2}\to\N$ を次で定める。
$$
\begin{aligned}
A(0,y)&=y+1,\\
A(x+1,0)&=A(x,1),\\
A(x+1,y+1)&=A(x,A(x+1,y)).
\end{aligned}
$$
これは $x$ に関する帰納法で、各 $x$ について関数 $A(x,\cdot)$ を定める：$A(0,\cdot)$ は後者関数で、$A(x+1,\cdot)$ は $A(x,\cdot)$ から $y$ に関する原始再帰で決まる。したがって $A$ はただ一つの全域的な関数である。
:::

::: remark
この形はペーテルとロビンソンによるもので（アッカーマン–ペーテル関数とも呼ばれる）、アッカーマン自身の 3 変数の関数を簡略化したものとして知られている。$A(1,y)=y+2$、$A(2,y)=2y+3$（\ref{comp:ackermann-growth.5}）、$A(3,y)=2^{y+3}-3$（問題 \ref{comp:prob-ack-3}）である。$A(4,y)+3$ は $2$ を $y+3$ 個積み上げた累乗の塔 $2^{2^{\cdot^{\cdot^{2}}}}$ に等しい。実際、$A(4,0)=A(3,1)=13=2^{2^{2}}-3$ であり、$A(4,y+1)=A(3,A(4,y))=2^{A(4,y)+3}-3$ なので、$A(4,y)+3$ が $y+3$ 段の塔なら $A(4,y+1)+3=2^{A(4,y)+3}$ は $y+4$ 段の塔である。
:::

::: lemma アッカーマン関数の増大 {#comp:ackermann-growth keywords="monotonicity of Ackermann function" index="アッカーマン関数の単調性|あっかーまんかんすうのたんちょうせい"}
すべての $x,y$ について次が成り立つ。
1. $A(x,y)>y$。
2. $A(x,y+1)>A(x,y)$。したがって $y<y'$ なら $A(x,y)<A(x,y')$。
3. $A(x+1,y)\ge A(x,y+1)$。
4. $A(x+1,y)>A(x,y)$。したがって $x\le x'$ なら $A(x,y)\le A(x',y)$。
5. $A(1,y)=y+2$、$A(2,y)=2y+3$。
6. $A(x,A(x,y))<A(x+2,y)$。
:::

::: proof
1. $x$ に関する帰納法で示し、各 $x$ では $y$ に関する帰納法を使う。$x=0$ の場合、$A(0,y)=y+1>y$ である。$x+1$ で $y=0$ の場合、$x$ についての仮定から $A(x+1,0)=A(x,1)>1>0$ である。$x+1$ で $y+1$ の場合、$A(x+1,y+1)=A(x,A(x+1,y))>A(x+1,y)>y$（前者は $x$ についての仮定、後者は $y$ についての仮定）なので、$A(x+1,y+1)\ge y+2>y+1$ である。
2. $x=0$ の場合、$A(0,y+1)=y+2>y+1=A(0,y)$ である。$x+1$ の場合、1 を $x$ と $A(x+1,y)$ に使うと $A(x+1,y+1)=A(x,A(x+1,y))>A(x+1,y)$ である。後半は、前半を $y,y+1,\dots,y'-1$ について順に使えばよい。
3. $y$ に関する帰納法。$y=0$ の場合、定義 $A(x+1,0)=A(x,1)$ から等号が成り立つ。$A(x+1,y)\ge A(x,y+1)$ と仮定すると、1 より $A(x+1,y)\ge A(x,y+1)\ge y+2$ である。よって 2 から次が成り立ち、これが $y+1$ の場合の主張である：
$$
A(x+1,y+1)=A(x,A(x+1,y))\ge A(x,y+2).
$$
4. 3 と 2 から $A(x+1,y)\ge A(x,y+1)>A(x,y)$ である。後半は、前半を $x,x+1,\dots,x'-1$ について順に使えばよい。
5. $A(1,0)=A(0,1)=2$ と $A(1,y+1)=A(0,A(1,y))=A(1,y)+1$ から、$y$ に関する帰納法で $A(1,y)=y+2$ である。$A(2,0)=A(1,1)=3$ と $A(2,y+1)=A(1,A(2,y))=A(2,y)+2$ から、同様に $A(2,y)=2y+3$ である。
6. 4 と 2 から $A(x,A(x,y))<A(x,A(x+1,y))=A(x+1,y+1)$ であり、さらに 3 から $A(x+1,y+1)\le A(x+2,y)$ である。
:::

::: lemma 反復の評価 {#comp:ackermann-iteration keywords="iterating Ackermann function"}
$A_{k}\defeq A(k,\cdot)$ とすると、すべての $m,t$ について $A_{k}^{t}(m)<A(k+1,m+t)$。また $k\ge2$ なら $A(k,2m)<A(k+2,m)$。
:::

::: proof
$t$ に関する帰納法。$t=0$ の場合、$A_{k}^{0}(m)=m<A(k+1,m)$ は \ref{comp:ackermann-growth.1} による。$A_{k}^{t}(m)<A(k+1,m+t)$ と仮定すると、\ref{comp:ackermann-growth.2} から次が成り立つ：
$$
A_{k}^{t+1}(m)=A_{k}(A_{k}^{t}(m))<A_{k}(A(k+1,m+t))=A(k+1,m+t+1).
$$
後半：$k\ge2$ なら、\ref{comp:ackermann-growth.5}・\ref[4]{comp:ackermann-growth.4} から $2m<2m+3=A(2,m)\le A(k,m)$ である。よって \ref{comp:ackermann-growth.2}・\ref[6]{comp:ackermann-growth.6} から $A(k,2m)<A(k,A(k,m))<A(k+2,m)$ である。
:::

## for プログラムの増大の上限 {#comp:sec-loop-bound}

::: theorem for プログラムの上限 {#comp:loop-bound keywords="bounding lemma for loop programs, Meyer-Ritchie" index="for プログラムの上限|ふぉーぷろぐらむのじょうげん"}
各 $P\in\mathrm{L}_{\mathrm{for}}$ について、ある $k\ge1$ があって、すべての状態 $\sigma$ で
$$
\lvert[\![P]\!](\sigma)\rvert_{P}<A(k,\lvert\sigma\rvert_{P}).
$$
:::

::: intuition
for プログラムが値を大きくする速さには、プログラムごとに決まるアッカーマン関数の一段 $A(k,\cdot)$ という上限がある。
:::

::: proof
このような $k$ を $P$ の**上限の指数**と呼ぶ。\ref{comp:ackermann-growth.4} より、上限の指数より大きい数も上限の指数である。$P$ の構成に関する帰納法で示す。状態 $\sigma$ をとり、$m\defeq\lvert\sigma\rvert_{P}$ とおく。$[\![\cdot]\!]$ の値が定義されることは \ref{comp:for-total} による。

**Step 1（基本命令）.** 【主張：基本命令 $P$ では $k=1$ が上限の指数である】 書き換えた変数の値は $m+1$ 以下で、他の変数の値は変わらない。ゆえに $\lvert[\![P]\!](\sigma)\rvert_{P}\le m+1<m+2=A(1,m)$ である（\ref{comp:ackermann-growth.5}）。

**Step 2（逐次実行 $P=P_{1};P_{2}$）.** 【主張：$P_{1},P_{2}$ の上限の指数の大きい方を $k$ とすると、$k+2$ が $P$ の上限の指数である】 $\sigma_{1}\defeq[\![P_{1}]\!](\sigma)$ とおく。$\lvert\sigma\rvert_{P_{1}}\le m$ なので、$\mathrm{var}(P_{1})$ 上の $\sigma_{1}$ の値は $A(k,\lvert\sigma\rvert_{P_{1}})\le A(k,m)$ 未満である（\ref{comp:ackermann-growth.2}）。$\mathrm{var}(P)\setminus\mathrm{var}(P_{1})$ 上の値は変わらない（\ref{comp:L-locality.1}）ので $m$ 以下であり、$m<A(k,m)$ である。よって $m_{1}\defeq\lvert\sigma_{1}\rvert_{P}<A(k,m)$ となる。同じ議論を $P_{2}$ と $\sigma_{1}$ に使うと、\ref{comp:ackermann-growth.2}・\ref[6]{comp:ackermann-growth.6} から次が成り立つ：
$$
\lvert[\![P]\!](\sigma)\rvert_{P}<A(k,m_{1})<A(k,A(k,m))<A(k+2,m).
$$

**Step 3（for ループ $P=\mathtt{for}\ x\ \mathtt{do}\ Q\ \mathtt{od}$）.** 【主張：$Q$ の上限の指数を $k$ とすると、$k+3$ が $P$ の上限の指数である】 $n\defeq\sigma(x)$ とおくと、$x\in\mathrm{var}(P)$ なので $n\le m$ である。規則 5 の列 $\sigma_{0}=\sigma,\dots,\sigma_{n}$ について $m_{t}\defeq\lvert\sigma_{t}\rvert_{P}$ とおく。Step 2 と同じ議論（$\mathrm{var}(Q)$ の上は $Q$ の上限で抑え、それ以外の変数は変わらない）で $m_{t+1}<A(k,m_{t})$ となる。よって $t$ に関する帰納法と \ref{comp:ackermann-growth.2} から $m_{t}\le A_{k}^{t}(m)$ である。$k\ge1$ なので $k+1\ge2$ であり、\ref{comp:ackermann-iteration} の前半、$n\le m$ と \ref{comp:ackermann-growth.2}、\ref{comp:ackermann-iteration} の後半をこの順に使うと、次が成り立つ：
$$
\begin{aligned}
\lvert[\![P]\!](\sigma)\rvert_{P}=m_{n}&\le A_{k}^{n}(m)<A(k+1,m+n)\\
&\le A(k+1,2m)<A(k+3,m).
\end{aligned}
$$
:::

::: corollary アッカーマン関数は原始再帰的でない {#comp:ackermann-not-pr keywords="Ackermann function is not primitive recursive" index="アッカーマン関数は原始再帰的でない|あっかーまんかんすうはげんしさいきてきでない"}
1. 原始再帰関数 $f\colon\N^{l}\to\N$ のそれぞれに対し、ある $k$ があって、すべての $\vec{m}$ で $f(\vec{m})<A(k,\max\vec{m})$（$l=0$ なら $\max\vec{m}\defeq0$）。
2. $g(y)\defeq A(y,y)$ は原始再帰的でない。したがって $A$ も原始再帰的でない。
:::

::: proof
1. \ref{comp:pr-equals-for} により $f$ を計算する for プログラム $P$ がある。$\mathrm{var}(P)$ に $x_{0},x_{1},\dots,x_{l}$ が含まれない場合は、それらを現れるようにする（例えば先頭に $x_{i}:=x_{i}$ を付ける。意味は変わらない）。入力状態 $\sigma_{\vec{m}}$ では $\lvert\sigma_{\vec{m}}\rvert_{P}=\max\vec{m}$ なので、\ref{comp:loop-bound} の $k$ について $f(\vec{m})=[\![P]\!](\sigma_{\vec{m}})(x_{0})<A(k,\max\vec{m})$ となる。
2. $g$ が原始再帰的なら、1 の $k$ で $g(k)<A(k,k)=g(k)$ となり矛盾する。$A$ が原始再帰的なら、$g(y)=A(U^{1}_{1}(y),U^{1}_{1}(y))$ も原始再帰的になる。
:::

## アッカーマン関数の計算 {#comp:sec-ackermann-computable}

スタック（数の有限列）を数でコード化する：空のスタックを $0$、スタック $s$ の上に $a$ を積んだものを $\mathrm{push}(a,s)\defeq\pi(a,s)+1$ とする。$\pi$ が全単射なので、正の数はどれもただ一通りに $\mathrm{push}(a,s)$ と書ける。$\mathrm{top}(c)\defeq\pi_{1}(c\mathbin{\dot{-}}1)$、$\mathrm{pop}(c)\defeq\pi_{2}(c\mathbin{\dot{-}}1)$ とすると、$\mathrm{top}(\mathrm{push}(a,s))=a$、$\mathrm{pop}(\mathrm{push}(a,s))=s$ で、これらはすべて原始再帰的（\ref{comp:pairing-pr}）、したがって for プログラムで計算できる（\ref{comp:pr-equals-for}）。スタック $a_{1},\dots,a_{r}$（$a_{r}$ が一番上）を $[a_{1},\dots,a_{r}]$ と書く。

::: theorem アッカーマン関数は計算可能 {#comp:ackermann-computable keywords="Ackermann function is computable, stack machine" index="アッカーマン関数の計算|あっかーまんかんすうのけいさん"}
$A$ を計算する L のプログラムで、while ループを一つだけ含むものがある。
:::

::: intuition
アッカーマン関数の再帰呼び出しで「後で計算する仕事」をスタックに積んで持ち歩けば、while ループ一つで計算できる。
:::

::: proof
**プログラム.** 変数 $c$（スタック）、$a$、$y$ を使い、サブルーチン呼び出し（\ref{comp:L-composition}）と条件文（\ref{comp:L-macros.5}）を略記として使う。
```python アッカーマン関数を計算するプログラム（while ループは一つ）
c = push(x1, 0)          # スタック。push, top, pop は for プログラムで計算できる
y = x2
while c != 0:
    a = top(c)
    c = pop(c)
    if a == 0:
        y += 1
    elif y == 0:
        c = push(a - 1, c)
        y = 1
    else:
        c = push(a - 1, c)
        c = push(a, c)
        y = y - 1
x0 = y
```
表示は \ref{comp:L-python-display} の約束による。`if … elif … else` の三つの場合のうちちょうど一つが実行されるように、条件は周回の初めの $a,y$ の値で判定する（L では、判定結果を新しい変数に保存してから三つの条件文 $\mathtt{if}\ u\neq0\ \mathtt{then}\ \cdots$ を並べる）。条件 $a\neq0\wedge y=0$ などは、特性関数（原始再帰的）を計算して条件文に使えばよい。

**Step 1（一周の働き）.** 【主張：周回の初めの $(c,y)$ が $([s_{1},\dots,s_{r},a],y)$ なら、周回の終わりは $a$ と $y$ による三つの場合に応じて下のとおりである】 ここで $s_{1},\dots,s_{r}$ は残りのスタックである。周回の初めに一番上の $a$ を取り除き、条件文のうち $(a,y)$ に応じた一つだけを実行するので、次のようになる。
- $a=0$ の場合、周回の終わりは $([s_{1},\dots,s_{r}],y+1)$ である。
- $a\ge1$, $y=0$ の場合、周回の終わりは $([s_{1},\dots,s_{r},a-1],1)$ である。
- $a\ge1$, $y\ge1$ の場合、周回の終わりは $([s_{1},\dots,s_{r},a-1,a],y-1)$ である。

**Step 2（停止と正しさ）.** 【主張：任意のスタック $s$ と $(a,y)$ について、$(c,y)=(s\text{ の上に }a\text{ を積んだもの},y)$ から周回を有限回繰り返すと $(c,y)=(s,A(a,y))$ になり、しかもそれまでの各周回の終わりでは、$c$ は $s$ の上に一つ以上の数を積んだスタックである】 $(a,y)$ に関する辞書式順序（$\N^{2}$ 上の整礎な順序）の帰納法で示す。
- $a=0$ の場合：一周で $(s,y+1)=(s,A(0,y))$。途中の周回はない。
- $a=a'+1$, $y=0$ の場合：一周で $(s\cdot[a'],1)$（$s$ の上に $a'$ を積んだもの）。$(a',1)$ は辞書式に $(a,0)$ より小さいので、帰納法の仮定でさらに有限回の周回で $(s,A(a',1))=(s,A(a,0))$。
- $a=a'+1$, $y=y'+1$ の場合：一周で $(s\cdot[a',a],y')$。$(a,y')<(a,y)$ なので、帰納法の仮定（スタック $s\cdot[a']$ について）で $(s\cdot[a'],A(a,y'))$ になる。$(a',A(a,y'))<(a,y)$ なので、さらに $(s,A(a',A(a,y')))=(s,A(a,y))$ になる。どの途中の段階でも、スタックは $s\cdot[a']$ か、その上にさらに積んだものなので、後半も成り立つ（$y=0$ の場合も同様）。

**Step 3（出力）.** 【主張：入力 $(m_{1},m_{2})$ から実行するとプログラムは停止し、出力は $A(m_{1},m_{2})$ である】 最初に $(c,y)=([m_{1}],m_{2})$ となる。$s$ を空として Step 2 の主張を使うと、有限回の周回で $(c,y)=(0,A(m_{1},m_{2}))$ になる。Step 2 の主張の後半から、それより前の周回の終わりでは $c\neq0$ なので、ループはちょうどそこで止まる。L の意味では、周回の回数 $N$ に関する帰納法で「$N$ 周後に $c=0$ となり、それより前は $c\neq0$ なら、while ループはその状態で停止する」が規則 6 から従う。最後に $x_{0}:=y$ で出力は $A(m_{1},m_{2})$。
:::

::: corollary for 計算可能関数は計算可能関数の真部分クラス {#comp:for-proper keywords="loop computable proper subclass of total computable" index="while の必要性|ほわいるのひつようせい"}
原始再帰関数（＝for 計算可能関数）全体は、全域的な計算可能関数全体の真部分集合である。
:::

::: proof
包含は定義から（for プログラムは L のプログラム）。$A$ は全域的で計算可能（\ref{comp:ackermann-computable}）だが原始再帰的でない（\ref{comp:ackermann-not-pr}）。
:::

::: hypcheck
- **for の回数が入口の値で決まること**：\ref{comp:loop-bound} の Step 3 で、繰り返し回数 $n$ を $n\le m$ と評価するのに使った。回数が本体の実行中に増えうる while ループでは、この評価ができない。
- **局所性**（\ref{comp:L-locality}）：書き換えられない変数の値が $m$ のままであることに使った。
- **辞書式順序の整礎性**：\ref{comp:ackermann-computable} の停止の証明に本質的である。アッカーマン関数の定義が「二重の帰納法」であることが、for ループ（一重の回数）で足りない理由の直感的な説明になる。
- **定義の全域性**：\ref{comp:ackermann} の定義が $x$ についての帰納法で正当化されることを使い、$A$ がただ一つの全域的な関数であるとした。
:::

## 問題 {#comp:sec-ack-problems}

::: problem {#comp:prob-ack-3}
$A(3,y)=2^{y+3}-3$ を示せ。
:::

::: solution
$y$ に関する帰納法。$y=0$ の場合、$A(3,0)=A(2,1)=5=2^{3}-3$ である。$A(3,y)=2^{y+3}-3$ と仮定すると、\ref{comp:ackermann-growth.5} から次が成り立つ：
$$
A(3,y+1)=A(2,A(3,y))=2(2^{y+3}-3)+3=2^{y+4}-3.
$$
:::

::: problem {#comp:prob-ack-rows-pr}
各 $x$ について、$1$ 変数関数 $A(x,\cdot)$ は原始再帰的であることを示せ。
:::

::: solution
$x$ に関する帰納法。$x=0$ の場合、$A(0,\cdot)=S$ は原始再帰的である。$A(x,\cdot)$ が原始再帰的なら、$f(0)=A(x,1)$, $f(y+1)=A(x,f(y))$ はパラメータのない原始再帰で、定義から $f=A(x+1,\cdot)$。（ここで $x$ は固定した数で、$x$ についての帰納法は「各 $x$ ごとに原始再帰の定義がある」ことを示すメタな帰納法である。これらを $x$ について一様にまとめた $A$ は原始再帰的でない。）
:::

::: problem {#comp:prob-ack-dominate}
$1$ 変数の原始再帰関数 $f$ のそれぞれについて、ある $y_{0}$ があり、$y\ge y_{0}$ ならつねに $f(y)<A(y,y)$ となることを示せ。
:::

::: solution
\ref{comp:ackermann-not-pr.1} の $k$ をとる。$y\ge k$ なら、\ref{comp:ackermann-growth.4} から $f(y)<A(k,y)\le A(y,y)$ である。したがって $y_{0}\defeq k$ とおけばよい。
:::

::: problem {#comp:prob-ack-graph}
関係 $\{(x,y,z):A(x,y)=z\}$（$A$ のグラフ）が原始再帰的であることを示せ。（ヒント：$A(x,y)$ を定義の等式で計算するとき、現れる値はすべて $A(x,y)$ 以下である。）
:::

::: solution
三つ組の有限集合 $S$ が**正当化されている**とは、$S$ の各元 $(a,b,v)$ について次のどれかが成り立つことをいう。
- (i) $a=0$ かつ $v=b+1$。
- (ii) $a\ge1$, $b=0$ かつ $(a-1,1,v)\in S$。
- (iii) $a\ge1$, $b\ge1$ で、ある $w$ について $(a,b-1,w)\in S$ かつ $(a-1,w,v)\in S$。

**Step 1.** 【主張：すべての $a,b$ について $A(a,b)\ge a+b+1$】 $a$ に関する帰納法。$a=0$ の場合は等号である。$a\ge1$ の場合、\ref{comp:ackermann-growth.3} と帰納法の仮定から $A(a,b)\ge A(a-1,b+1)\ge(a-1)+(b+1)+1=a+b+1$ である。

**Step 2.** 【主張：$S$ が正当化されていれば、$S$ のすべての元 $(a,b,v)$ は $v=A(a,b)$ を満たす】 $(a,b)$ の辞書式順序に関する帰納法（整礎）。(i) の場合、$v=b+1=A(0,b)$ である。(ii) の場合、$(a-1,1)$ は辞書式に $(a,b)$ より小さいので、帰納法の仮定から $v=A(a-1,1)=A(a,0)$ である。(iii) の場合、$(a,b-1)$ と $(a-1,w)$ はどちらも辞書式に $(a,b)$ より小さいので、帰納法の仮定から $w=A(a,b-1)$ かつ $v=A(a-1,w)=A(a-1,A(a,b-1))=A(a,b)$ である。

**Step 3.** 【主張：$A(x,y)=z$ なら、$S_{z}\defeq\{(a,b,A(a,b)):A(a,b)\le z\}$ は $\{0,\dots,z\}^{3}$ に含まれる正当化された集合で、$(x,y,z)$ を含む】 Step 1 から、$(a,b,v)\in S_{z}$ なら $a,b<v\le z$ である。正当化されていることを確かめる。$(a,b,v)\in S_{z}$ で $a\ge1$, $b=0$ の場合、$A(a-1,1)=A(a,0)=v\le z$ なので $(a-1,1,v)\in S_{z}$ である。$a\ge1$, $b\ge1$ の場合、$w\defeq A(a,b-1)$ とおくと \ref{comp:ackermann-growth.2} から $w<v\le z$ であり、$A(a-1,w)=v$ なので $(a,b-1,w)$ と $(a-1,w,v)$ は $S_{z}$ に属する。

**Step 4.** 【主張：$A$ のグラフは原始再帰的である】 $\{0,\dots,z\}^{3}$ の部分集合を、$(a,b,v)$ に位置 $\iota_{z}(a,b,v)\defeq a(z+1)^{2}+b(z+1)+v<(z+1)^{3}$ を割り当て、各位置の 2 進の桁で表す。すなわち
$$
\mathrm{In}(c,z,a,b,v)\iff a,b,v\le z\wedge\bigl\lfloor c/2^{\iota_{z}(a,b,v)}\bigr\rfloor\bmod2=1
$$
とおくと、$c<2^{(z+1)^{3}}$ が $\{0,\dots,z\}^{3}$ の部分集合をちょうど一つずつ表す。$\mathrm{In}$ は問題 \ref{comp:prob-pr-div}、指数関数（\ref{comp:prob-L-examples.c} と \ref{comp:pr-equals-for}）と \ref{comp:pr-closure} により原始再帰的である。「$c$ の表す集合が正当化されている」ことを表す関係 $\mathrm{Just}(c,z)$ は、(i)〜(iii) の $\mathrm{In}$ による書き換えを $\forall a,b,v\le z$ で束ねたもので（(iii) の $w$ は $\exists w\le z$ でよい。$\mathrm{In}$ が成り立つなら $w\le z$ なので）、\ref{comp:pr-closure.1}・\ref[3]{comp:pr-closure.3}・\ref[6]{comp:pr-closure.6} により原始再帰的である。すると
$$
A(x,y)=z\iff\exists c<2^{(z+1)^{3}}\,\bigl(\mathrm{Just}(c,z)\wedge\mathrm{In}(c,z,x,y,z)\bigr)
$$
が成り立つ。⇒ は Step 3 の $S_{z}$ を表す $c$ をとればよく、⇐ は Step 2 による。右辺は、上限 $2^{(z+1)^{3}}$ を代入した有界な量化（\ref{comp:pr-closure.3}・\ref[6]{comp:pr-closure.6}）なので原始再帰的である。
:::

::: supplement
**前提の検討.**
- \ref{comp:loop-bound} は値の上限を述べるだけで、for プログラムの「実行時間」を直接扱ってはいない。しかし実行時間も同じ定理から抑えられる。$P$ の各基本命令の直後に、$P$ に現れない新しい変数 $c$ について $c:=c+1$ を挟んだプログラムを $P'$ とする。$P'$ も for プログラムであり、$P$ の構成に関する帰納法で、$[\![P']\!](\sigma)(c)-\sigma(c)$ は $P$ の実行で行われる基本命令の回数に等しい。$\sigma(c)=0$ なら $\lvert\sigma\rvert_{P'}=\lvert\sigma\rvert_{P}$ なので、$P'$ の上限の指数 $k'$ について、基本命令の回数は $A(k',\lvert\sigma\rvert_{P})$ 未満である。$A(k',\cdot)$ は原始再帰的（問題 \ref{comp:prob-ack-rows-pr}）なので、for プログラムの実行時間は原始再帰関数で抑えられる。
- 原始再帰的でない全域的計算可能関数の存在は、万能プログラムを使った対角線論法でも示せる（すべての for プログラムを数え上げ、$n$ 番目の for プログラムの入力 $n$ での値に $1$ を足す。\see{comp:page-universal-smn}）。アッカーマン関数による証明は、具体的な関数を与える点と、増大の速さという理由を示す点で異なる。

**関連する結果.**
- *アッカーマン関数のグラフ.* 関係 $A(x,y)=z$ は原始再帰的である（問題 \ref{comp:prob-ack-graph}。計算に現れる値がすべて $z$ 以下であることを使う）。したがって「グラフが原始再帰的でも関数が原始再帰的とは限らない」。グラフから値を探す $\mu z\,(A(x,y)=z)$ は、探索の上限を原始再帰関数で与えられないので有界な最小化にならない。
- *証明論との関係.* $\PA$ で全域性が証明できる計算可能関数は、$\varepsilon_{0}$ より小さい順序数で添え字付けた高速増加関数のどれかで抑えられることが知られている（クライゼルによる $\varepsilon_{0}$ 未満の順序数の再帰による特徴づけ、シュヴィヒテンベルクとワイナーによる高速増加関数での特徴づけ）。この階層で、原始再帰関数はそれぞれ $\omega$ より小さい（有限の）段階の関数で抑えられ、アッカーマン関数は段階 $\omega$ に当たる。本サイトでは示していない。

**高い視点から：二重の帰納法と演算の塔.** $A(1,\cdot)$, $A(2,\cdot)$, $A(3,\cdot)$, $A(4,\cdot)$ は、ほぼ「足し算、掛け算、累乗、累乗の塔」に当たり、$A(x+1,\cdot)$ は $A(x,\cdot)$ の反復である。for ループ一つは「既にある関数を、入力で決まる回数だけ反復する」ことしかできないので、一つひとつの for プログラムはこの塔のある有限の段 $A(k,\cdot)$ で抑えられる（\ref{comp:loop-bound}）。アッカーマン関数は塔の段数そのものを入力にとるので、どの有限の段にも収まらない。本ページの証明で言えば、for プログラムの停止は一つの自然数（繰り返しの回数）に沿った帰納法で分かる（\ref{comp:for-total}）のに対し、アッカーマン関数を計算するプログラムの停止には $\N^{2}$ の辞書式順序（順序型 $\omega^{2}$）に沿った帰納法を使った（\ref{comp:ackermann-computable}）。while ループは「いつ終わるか分からない反復」を許すことで、このような整礎な順序に沿った再帰も表せるようになる。（増大の速さを順序数で測る高速増加関数の言葉では、上の証明論の項のとおり、アッカーマン関数は段階 $\omega$ に当たる。）
:::
