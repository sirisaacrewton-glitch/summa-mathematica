# 写像還元とポストの対応問題 {#comp:page-mapping-reducibility keywords="computable function, mapping reducibility, many-one reducibility, EQ_TM not recognizable, Post correspondence problem, PCP undecidable, modified PCP"}

前のページの還元を**写像還元**として定式化する：$A\le_{\mathrm{m}}B$ とは、入力を変換する計算可能関数 $f$ で「$w\in A\iff f(w)\in B$」となるものがあることである（\ref{comp:mapping-reducible}）。写像還元は決定可能性だけでなく認識可能性も伝えるので、$EQ_{\mathsf{TM}}$ が認識可能でも補認識可能でもないことが示せる（\ref{comp:eqtm-neither}）。後半では、ドミノを並べるだけの組合せ的な問題である**ポストの対応問題**が決定不能であること（\ref{comp:pcp-undecidable}）を、計算履歴をドミノで組み立てる還元で示す。

## 記法と定義の確認 {#comp:sec-map-notation}

::: notation
- TM、判定機、認識可能・決定可能、$A_{\mathsf{TM}}$, $E_{\mathsf{TM}}$ とその決定不能性、時点表示、計算履歴は \ref{comp:page-decidability}, \ref{comp:page-reducibility} のとおり。
- 認識可能な言語の補集合が認識可能なら決定可能（問題 \ref{comp:prob-decidable-complement}）。補集合が認識可能な言語を**補認識可能**という。
:::

## 写像還元 {#comp:sec-mapping}

::: definition 計算可能関数と写像還元 {#comp:mapping-reducible keywords="computable function, mapping reducibility, many-one reduction" index="計算可能関数|けいさんかのうかんすう, 写像還元|しゃぞうかんげん"}
1. 関数 $f\colon\Sigma^{\ast}\to\Sigma^{\ast}$ が**計算可能**であるとは、すべての入力 $w$ の上で停止し、そのとき\term[テープ]{comp:turing-machine}に $f(w)$ だけを残す TM があることをいう。
2. 言語 $A,B$ について、計算可能な $f$ で、すべての $w$ について $w\in A\iff f(w)\in B$ となるものがあるとき、$A$ は $B$ に**写像還元可能**であるといい、$A\le_{\mathrm{m}}B$ と書く。$f$ を $A$ から $B$ への**還元**という。
:::

::: proposition 写像還元の基本性質 {#comp:mapping-basic}
1. $\le_{\mathrm{m}}$ は反射的かつ推移的である。$A\le_{\mathrm{m}}B$ なら $\overline{A}\le_{\mathrm{m}}\overline{B}$。
2. $A\le_{\mathrm{m}}B$ で $B$ が決定可能なら $A$ も決定可能。
3. $A\le_{\mathrm{m}}B$ で $B$ が認識可能なら $A$ も認識可能。
:::

::: proof
1. 反射性は、恒等関数 $w\mapsto w$ が $A$ から $A$ への還元であることから従う。推移性：$f$ が $A$ から $B$ への還元、$g$ が $B$ から $C$ への還元なら、$w\in A\iff f(w)\in B\iff g(f(w))\in C$ なので $g\circ f$ が $A$ から $C$ への還元である（$g\circ f$ は、$f$ を計算する機械を動かし、\term[テープ]{comp:turing-machine}に残った $f(w)$ の上で $g$ を計算する機械を動かせば計算できる）。後半は、同じ $f$ について $w\notin A\iff f(w)\notin B$ となることから従う。
2. $B$ の判定機 $M$ と還元 $f$ について、「$f(w)$ を計算し、$M$ を $f(w)$ の上で動かしてその答えを出す」機械は判定機で $A$ を決定する。
3. 同じ構成で、$M$ を $B$ を認識する機械にする。
:::

::: example
\ref{comp:etm-undecidable} の証明の $\langle M,w\rangle\mapsto\langle M_{1}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{E_{\mathsf{TM}}}$ を与える（$M$ が $w$ を受理する $\iff L(M_{1})\neq\varnothing$）。符号でない入力は、$\overline{E_{\mathsf{TM}}}$ に属さない固定の文字列（たとえばすべて拒否する機械の符号）に送ればよい。
:::

::: theorem $EQ_{\mathsf{TM}}$ は認識可能でも補認識可能でもない {#comp:eqtm-neither keywords="EQ_TM is neither Turing-recognizable nor co-Turing-recognizable" index="EQ_TM の認識不能性|いーきゅーてぃーえむのにんしきふのうせい"}
$EQ_{\mathsf{TM}}$ はチューリング認識可能でなく、その補集合 $\overline{EQ_{\mathsf{TM}}}$ もチューリング認識可能でない。
:::

::: proof
\ref{comp:co-atm-unrecognizable} より $\overline{A_{\mathsf{TM}}}$ は認識可能でない。\ref{comp:mapping-basic.1}, \ref[3]{comp:mapping-basic.3} より、$A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$ を示せば $EQ_{\mathsf{TM}}$ は認識可能でなく、$A_{\mathsf{TM}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ を示せば $\overline{EQ_{\mathsf{TM}}}$ は認識可能でない（$\overline{A_{\mathsf{TM}}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$ と $\overline{A_{\mathsf{TM}}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ になるので）。入力 $\langle M,w\rangle$ に対し、

> $M_{1}$：すべての入力を拒否する。$M_{2}$：すべての入力を受理する。$M_{3}$：入力を無視して $M$ を $w$ の上で動かし、$M$ が受理すれば受理する。

とする。$M$ が $w$ を受理するなら $L(M_{3})=\Sigma^{\ast}$ であり、そうでなければ $L(M_{3})=\varnothing$ である。よって $M$ が $w$ を受理する $\iff L(M_{1})\neq L(M_{3})$、かつ $M$ が $w$ を受理する $\iff L(M_{2})=L(M_{3})$ が成り立つ。ゆえに $\langle M,w\rangle\mapsto\langle M_{1},M_{3}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}\overline{EQ_{\mathsf{TM}}}$ を、$\langle M,w\rangle\mapsto\langle M_{2},M_{3}\rangle$ は $A_{\mathsf{TM}}\le_{\mathrm{m}}EQ_{\mathsf{TM}}$ を与える。ただし符号でない入力（$A_{\mathsf{TM}}$ に属さない）は、前者では $\langle M_{1},M_{1}\rangle$（$\overline{EQ_{\mathsf{TM}}}$ に属さない）に、後者では $\langle M_{1},M_{2}\rangle$（$EQ_{\mathsf{TM}}$ に属さない）に送る。どちらの写像も、$\langle M_{3}\rangle$ を $\langle M\rangle$ と $w$ から書き下せるので計算可能である。
:::

## ポストの対応問題 {#comp:sec-pcp}

::: definition ポストの対応問題 {#comp:pcp keywords="Post correspondence problem, PCP, dominos, match" index="ポストの対応問題|ぽすとのたいおうもんだい"}
**ドミノ**とは空でない文字列の組 $\bigl[\tfrac{t}{b}\bigr]$（$t$ を上、$b$ を下という）のことである。ドミノの有限集合 $P=\{[t_{1}/b_{1}],\dots,[t_{k}/b_{k}]\}$ の**一致**とは、添字の空でない列 $i_{1},\dots,i_{l}$（重複可）で $t_{i_{1}}\cdots t_{i_{l}}=b_{i_{1}}\cdots b_{i_{l}}$ となるものをいう。$\mathit{PCP}\defeq\{\langle P\rangle:P\text{ は一致をもつ}\}$。

**修正版**（MPCP）は、一致が最初のドミノ $[t_{1}/b_{1}]$ から始まる（$i_{1}=1$）ことを要求するもので、$\mathit{MPCP}\defeq\{\langle P\rangle:P\text{ は }1\text{ から始まる一致をもつ}\}$。
:::

::: example
$P=\{[b/ca],\ [a/ab],\ [ca/a],\ [abc/c]\}$ では、列 $2,1,3,2,4$ が一致を与える：上は $a\cdot b\cdot ca\cdot a\cdot abc=abcaaabc$、下は $ab\cdot ca\cdot a\cdot ab\cdot c=abcaaabc$。
:::

::: lemma TM の受理から MPCP へ {#comp:atm-to-mpcp}
$A_{\mathsf{TM}}\le_{\mathrm{m}}\mathit{MPCP}$。
:::

::: proof
**左端の仮定.** TM $M=(Q,\Sigma,\Gamma,\delta,q_{0},q_{\mathrm{acc}},q_{\mathrm{rej}})$ は、左端で左に動こうとしないと仮定してよい。実際、$M$ から次の機械 $\tilde{M}$ を作ると、$\tilde{M}$ は左端で左に動こうとせず、$\tilde{M}$ が $w$ を受理する $\iff$ $M$ が $w$ を受理する。$\tilde{M}$ は新しい記号 $\triangleright$ を使い、まず入力を一升右にずらして左端の升に $\triangleright$ を書き（ずらすときは右向きに一文字ずつ運び、戻るときは $\triangleright$ を読んだところで止まる）、ヘッドを $\triangleright$ のすぐ右の升に置いて状態 $q_{0}$ に入る。以後は $M$ の遷移をそのまま使い、加えて、停止状態でない各状態 $q$ で $\triangleright$ を読んだら $\triangleright$ をそのまま書いて右に動き、状態 $q$ に戻る。$M$ は左端で左に動こうとするとその場に留まる（\ref{comp:tm-configuration.2}）ので、$\tilde{M}$ は $M$ の各段を、左端で左に動く段だけは「$\triangleright$ に入って戻る」二段に分けて、そのままなぞる。$\tilde{M}$ の左端の升には $\triangleright$ があり、そこでは右にしか動かない。$\langle M\rangle\mapsto\langle\tilde{M}\rangle$ は遷移表を書き足すだけなので計算可能であり、以下 $M$ を $\tilde{M}$ に置き換えて考える。

**ドミノの集合.** 入力 $\langle M,w\rangle$（$w=w_{1}\cdots w_{n}$）から、記号 $\#\notin\Gamma\cup Q$ を使って次のドミノの集合 $P'$ を作る。$C_{1}\defeq q_{0}w_{1}\cdots w_{n}$ とおく（$n=0$ のときは $C_{1}\defeq q_{0}\sqcup$ とおく。\ref{comp:tm-configuration.2} の約束で $q_{0}$ と同じ時点表示を表し、状態記号の右に読む文字がある形にするため）。
1. 最初のドミノ：$[\ \#\ /\ \#C_{1}\#\ ]$。
2. $q\neq q_{\mathrm{rej}}$, $\delta(q,a)=(r,b,\mathrm{R})$ ごとに $[\ qa\ /\ br\ ]$。
3. $q\neq q_{\mathrm{rej}}$, $\delta(q,a)=(r,b,\mathrm{L})$ と各 $c\in\Gamma$ について $[\ cqa\ /\ rcb\ ]$。
4. 各 $a\in\Gamma$ について $[\ a\ /\ a\ ]$。
5. $[\ \#\ /\ \#\ ]$ と $[\ \#\ /\ \sqcup\#\ ]$。
6. 各 $a\in\Gamma$ について $[\ aq_{\mathrm{acc}}\ /\ q_{\mathrm{acc}}\ ]$ と $[\ q_{\mathrm{acc}}a\ /\ q_{\mathrm{acc}}\ ]$。
7. 締めくくりのドミノ $[\ q_{\mathrm{acc}}\#\#\ /\ \#\ ]$。

2・3 では $q\neq q_{\mathrm{acc}}$ でもある（$\delta$ は停止状態で定義されない）。$\langle P'\rangle$ は $M$ の遷移表と $w$ から順に書き出せるので、$\langle M,w\rangle\mapsto\langle P'\rangle$ は計算可能である（符号でない入力は、一致をもたない固定の集合、たとえば $\{[\,a/b\,]\}$ の符号に送る）。

**$M$ が $w$ を受理するなら一致がある.** 受理計算履歴 $C_{1},C_{2},\dots,C_{l}$ をとる（$C_{1}$ は上で定めた開始時点表示）。最初のドミノの後、下が上より $C_{1}\#$ だけ長い状態から始め、各 $C_{i}$ について、上に $C_{i}\#$ を読み進めながら下に $C_{i+1}\#$ を書くようにドミノを選ぶ：ヘッドの周り（状態記号を含む二〜三文字）は 2 または 3 のドミノ、それ以外の文字は 4、区切りは 5（ヘッドが右端の空白に進む場合は $[\#/\sqcup\#]$ で空白を補う）。こうして下が上より $C_{i+1}\#$ だけ長い状態になる。$C_{l}$ に $q_{\mathrm{acc}}$ が現れた後は、6 で $q_{\mathrm{acc}}$ の隣の文字を一つずつ消した時点表示を下に書いていき、下が上より $q_{\mathrm{acc}}\#$ だけ長くなったところで 7 を置くと、上と下が一致する。

**一致があるなら $M$ は $w$ を受理する.** $1$ から始まる一致をとり、その上と下の共通の文字列を $X$ とする。$j$ 枚目までを置いたときの上と下の文字列を $T_{j}$, $B_{j}$ とおくと、どちらも $X$ の接頭辞である。ドミノの「下の長さ − 上の長さ」は、1 では $\lvert C_{1}\rvert+1\ge2$、2〜4 では $0$、5 では $0$ か $1$、6 では $-1$、7 では $-2$ である。
- (i) 6・7 を一枚も使わないうちは $\lvert B_{j}\rvert-\lvert T_{j}\rvert\ge2$ であり、このとき $T_{j}$ は $B_{j}$ の真の接頭辞である。一致の最後では $T=B=X$ なので、6 か 7 がどこかで使われる。最初に使われるものを $j_{0}$ 枚目とする。
- (ii) $j_{0}$ 枚目より前に下に書かれる時点表示（$\#$ で区切られた部分）は、どれも $C_{1}$ から $M$ の有限段で到達できる時点表示（の右端に空白を補ったもの）である。実際、上は下の接頭辞なので、上は下にすでに書かれた文字列を左からなぞるしかない。上が $\#$ をなぞるのは 1 か 5 で、1 を使うと下に $C_{1}$ がもう一度書かれる。上が下の時点表示 $C$ を一つなぞる間には、次のように下に新しい時点表示が書かれる。状態記号を上に含むドミノは 2・3 だけで、$C$ の状態記号 $q$ の直後の文字を $a$ とすると、$\delta(q,a)$ が右に動くなら（$q$ の直前に文字があればそれを 4 でなぞった後）$qa$ を 2 でなぞり、左に動くなら直前の文字 $c$ と合わせて $cqa$ を 3 でなぞるしかない（$q$ が左端にあって左に動く場合は、左端の仮定により起こらない。$q$ の直後が $\#$ の場合と $q=q_{\mathrm{rej}}$ の場合は、なぞれるドミノがない）。他の文字は 4 でなぞるしかない。これらのドミノの下を並べると、$C$ に \ref{comp:tm-configuration.2} の一段を施した時点表示になる（$C$ の後の $\#$ を $[\#/\sqcup\#]$ でなぞった場合は、その右端に空白が足される）。したがって、書かれた順の帰納法で主張が成り立つ。
- (iii) $j_{0}$ 枚目の上にある $q_{\mathrm{acc}}$ は、$X$ の中で位置 $\lvert T_{j_{0}-1}\rvert$ か $\lvert T_{j_{0}-1}\rvert+1$ にあり、(i) からこの位置は $\lvert B_{j_{0}-1}\rvert$ より前である。したがってこの $q_{\mathrm{acc}}$ は、$j_{0}$ 枚目より前のドミノ（1〜5）の下にすでに書かれている。1〜5 の下に $q_{\mathrm{acc}}$ が現れるのは、$r=q_{\mathrm{acc}}$ である 2・3 だけである。

(ii)・(iii) から、$q_{\mathrm{acc}}$ を含む時点表示、すなわち受理時点表示に $C_{1}$ から到達できる。よって $M$ は $w$ を受理する。

以上から $\langle M,w\rangle\mapsto\langle P'\rangle$ は $A_{\mathsf{TM}}$ から $\mathit{MPCP}$ への写像還元である。
:::

::: lemma MPCP から PCP へ {#comp:mpcp-to-pcp}
$\mathit{MPCP}\le_{\mathrm{m}}\mathit{PCP}$。
:::

::: proof
新しい記号 $\star,\diamond$ を使う。文字列 $u=u_{1}\cdots u_{m}$ について $\star u\defeq\star u_{1}\star u_{2}\cdots\star u_{m}$、$u\star\defeq u_{1}\star\cdots u_{m}\star$、$\star u\star\defeq\star u_{1}\star\cdots\star u_{m}\star$ とする。$P'=\{[t_{1}/b_{1}],\dots,[t_{k}/b_{k}]\}$ に対し、
$$
P\defeq\{[\star t_{1}/\star b_{1}\star],\ [\star t_{i}/b_{i}\star]\ (1\le i\le k),\ [\star\diamond/\diamond]\}
$$
とする（$\langle P'\rangle\mapsto\langle P\rangle$ は各ドミノに $\star$ を書き足し、二枚のドミノを加えるだけなので計算可能であり、符号でない入力は $\{[\,a/b\,]\}$ の符号に送る）。

**$P$ の一致から $P'$ の $1$ から始まる一致へ.** $P$ の一致をとり、その共通の文字列を $X$ とする。
- (i) $P$ のドミノの上はすべて $\star$ で始まり（$t_{i}$ は空でない）、下が $\star$ で始まるのは $[\star t_{1}/\star b_{1}\star]$ だけである（他の下は $b_{i}$ の最初の文字か $\diamond$ で始まる）。$X$ の最初の文字は最初のドミノの上と下で一致するので、最初のドミノは $[\star t_{1}/\star b_{1}\star]$ である。
- (ii) $[\star\diamond/\diamond]$ 以外のドミノは、上が $\star$ でない文字（$t_{i}$ の最後の文字）で終わり、下が $\star$ で終わる。$X$ の最後の文字は最後のドミノの上と下で一致するので、最後のドミノは $[\star\diamond/\diamond]$ である。その最初の出現を $m$ 枚目とする（(i) から $m\ge2$）。
- (iii) $\diamond$ は $[\star\diamond/\diamond]$ にしか現れないので、上でも下でも、$X$ の最初の $\diamond$ は $m$ 枚目のドミノの末尾にある。よって $m$ 枚目までの上と下はどちらも「$X$ の最初の $\diamond$ までの接頭辞」で、等しい。この上と下から $\star$ と $\diamond$ を取り除くと、それぞれ $t_{1}t_{k_{2}}\cdots t_{k_{m-1}}$ と $b_{1}b_{k_{2}}\cdots b_{k_{m-1}}$ になる（$k_{s}$ は $s$ 枚目のドミノのもとの番号）。等しい文字列から同じ記号を取り除いたものなので両者は等しく、$1,k_{2},\dots,k_{m-1}$ は $P'$ の $1$ から始まる一致である。

**逆向き.** $P'$ の $1$ から始まる一致 $1,k_{2},\dots,k_{l}$ があり、共通の文字列を $u=u_{1}\cdots u_{N}$ とする。このとき $[\star t_{1}/\star b_{1}\star],[\star t_{k_{2}}/b_{k_{2}}\star],\dots,[\star t_{k_{l}}/b_{k_{l}}\star],[\star\diamond/\diamond]$ を並べると、上も下も $\star u_{1}\star u_{2}\cdots\star u_{N}\star\diamond$ になるので、$P$ の一致である。
:::

::: theorem ポストの対応問題の決定不能性 {#comp:pcp-undecidable keywords="PCP is undecidable" index="ポストの対応問題の決定不能性|ぽすとのたいおうもんだいのけっていふのうせい"}
$\mathit{PCP}$ は決定可能でない。
:::

::: proof
\ref{comp:atm-to-mpcp}, \ref{comp:mpcp-to-pcp} と \ref{comp:mapping-basic.1} より $A_{\mathsf{TM}}\le_{\mathrm{m}}\mathit{PCP}$ である。$\mathit{PCP}$ が決定可能なら \ref{comp:mapping-basic.2} より $A_{\mathsf{TM}}$ も決定可能となり、\ref{comp:atm-undecidable} に反する。

::: hypcheck
- **計算履歴**：\ref{comp:atm-to-mpcp} のドミノは、受理計算履歴を「上が一つ遅れて下を追いかける」形で書くためのものである。
- **修正版を経由すること**：最初のドミノを強制しないと、たとえば $[a/a]$ だけで一致ができてしまう。\ref{comp:mpcp-to-pcp} の $\star$ の工夫が最初のドミノを強制する。
- **左端の仮定**：3 のドミノは状態記号の左に文字 $c$ があることを前提とするので、左端で左に動かない機械に修正しておいた。
- **空でないドミノ**：\ref{comp:mpcp-to-pcp} の (i)・(ii) で、$t_{i}$ が空でないこと（上が $\star$ で始まり、$\star$ でない文字で終わること）を使った。空の文字列を許すと、たとえば $P'=\{[\,a/b\,],[\,\varepsilon/\varepsilon\,]\}$ は $1$ から始まる一致をもたないのに、$P$ は $[\,\varepsilon/\varepsilon\,]$ だけで一致をもつ。
- **空の入力**：$w=\varepsilon$ のとき最初のドミノを $[\#/\#q_{0}\#]$ にすると、上で $q_{0}\#$ をなぞるドミノがなく、$M$ が $\varepsilon$ を受理しても一致ができない。そのため $C_{1}=q_{0}\sqcup$ とした。
:::
:::

## 問題 {#comp:sec-map-problems}

::: problem {#comp:prob-pcp-unary}
文字が $1$ だけの場合（$\Sigma=\{1\}$）のポストの対応問題は決定可能であることを示せ。
:::

::: solution
ドミノ $[1^{a_{i}}/1^{b_{i}}]$ の差を $d_{i}\defeq a_{i}-b_{i}$ とおく。上と下はどちらも $1$ の並びなので、長さが等しければ一致する。したがって一致があることは、各ドミノの使用回数 $n_{i}\ge0$（総和が正）で $\sum n_{i}d_{i}=0$ となるものがあることと同値である（並べ方は関係ない）。$d_{i}=0$ のドミノがあれば、それ一枚が一致である。そうでない場合、正の $d_{i}$ と負の $d_{j}$ が両方あれば、$n_{i}=-d_{j}$, $n_{j}=d_{i}$（他は $0$）とおくと $n_{i}d_{i}+n_{j}d_{j}=0$ となって一致があり、どちらか一方の符号しかなければ $\sum n_{i}d_{i}\neq0$ なので一致はない。この場合分けは $d_{i}$ の符号を見るだけなので決定可能である。
:::

::: problem {#comp:prob-mapping-atm-complete}
任意のチューリング認識可能な言語 $A$ について $A\le_{\mathrm{m}}A_{\mathsf{TM}}$ であることを示せ。
:::

::: solution
$A=L(M)$ とし、$f(w)\defeq\langle M,w\rangle$ とおく。$f$ は $w$ の前に固定の $\langle M\rangle$ を書き足すだけなので計算可能であり、$w\in A\iff M$ が $w$ を受理する $\iff f(w)\in A_{\mathsf{TM}}$ が成り立つ。
:::

::: supplement
**前提の検討.**
- 写像還元は「一回だけ相手の問題を呼び出し、その答えをそのまま使う」還元である。答えを反転したり、何度も呼び出したりするより一般の還元はチューリング還元（\see{comp:page-turing-reducibility}）で、たとえば $\overline{A_{\mathsf{TM}}}$ は $A_{\mathsf{TM}}$ にチューリング還元できるが写像還元はできない（\ref{comp:mapping-basic.3} と \ref{comp:co-atm-unrecognizable}）。
- ドミノの種類の数を固定したポストの対応問題は、$2$ 種類以下なら決定可能で、$5$ 種類以上なら決定不能であることが知られている（決定不能となる種類数の上限は、長く $7$ であったものが近年 $5$ まで下げられた）。

**関連する結果.**
- *完全性.* 問題 \ref{comp:prob-mapping-atm-complete} より、$A_{\mathsf{TM}}$ は認識可能な言語の中で $\le_{\mathrm{m}}$ について最大（**完全**）である。$\mathit{HALT}_{\mathsf{TM}}$ や $\mathit{PCP}$ も同じ意味で完全である。実際、どちらも認識可能であり（$\mathit{PCP}$ は添字の列を短い順にすべて試せばよい）、$A_{\mathsf{TM}}$ が還元される：$\mathit{PCP}$ へは \ref{comp:pcp-undecidable} の証明の還元、$\mathit{HALT}_{\mathsf{TM}}$ へは $\langle M,w\rangle\mapsto\langle M',w\rangle$（$M'$ は $M$ が拒否するところでループに入るよう変えた機械）による。よって推移性（\ref{comp:mapping-basic.1}）から、認識可能な言語はすべてこれらに還元される。
- *形式言語への応用.* ポストの対応問題から、二つの文脈自由文法の生成する言語が交わるか、文脈自由文法が曖昧か、などが決定不能であることが導かれる。

**高い視点から：前順序としての難しさ.** $\le_{\mathrm{m}}$ は言語全体の上の前順序で、その同値類（多対一次数）は「同じだけ難しい問題の類」である。$\varnothing$ と $\Sigma^{\ast}$ はそれぞれ単独で類をなし（$w\in\varnothing\iff f(w)\in\Sigma^{\ast}$ となる $f$ はない）、それ以外の決定可能な言語は全体で一つの類をなす。実際、$B\neq\varnothing,\Sigma^{\ast}$ なら $b\in B$, $b'\notin B$ をとり、決定可能な $A$ を「$w\in A$ なら $b$、そうでなければ $b'$」という計算可能関数で $B$ に還元できる。この類は $\varnothing,\Sigma^{\ast}$ 以外のすべての言語の類の下にあり、$A_{\mathsf{TM}}$ の類は認識可能な言語の中で最大である。その間に認識可能な言語の類があるか（認識可能だが決定可能でも完全でもない言語があるか）という問いには、ポスト自身が単純集合で肯定的に答えた（\see{comp:simple-not-complete}）。同じ問いをチューリング還元について立てたものが**ポストの問題**で、優先論法によって肯定的に解かれた（\see{comp:friedberg-muchnik}）。ポストの対応問題は、機械とは無関係に見える「ドミノ並べ」の中に計算の全体が埋め込まれていることを示しており、たとえるなら、パズルの盤面の上で計算機の動きを再現する、という仕掛けである。
:::
