# L と NL {#comp:page-logspace keywords="logarithmic space, L, NL, read-only input tape, log-space reduction, log-space transducer, PATH is NL-complete, configuration graph, Immerman-Szelepcsenyi theorem, NL = coNL, inductive counting"}

線形未満の領域を扱うために、入力は**読み取り専用**のテープに置き、作業用テープの升目だけを数える（\ref{comp:logspace-model}）。対数領域 $O(\log n)$ は、入力の位置を指す数（ポインタ）を定数個持てる程度の記憶である。本ページでは、決定性・非決定性の対数領域のクラス L, NL を定め（\ref{comp:class-l-nl}）、$\mathrm{NL}\subseteq\mathrm{P}$（\ref{comp:nl-in-p}）、グラフの到達可能性 PATH が対数領域還元について NL 完全であること（\ref{comp:path-nl-complete}）、そして**イマーマン–セレプチェーニの定理** $\mathrm{NL}=\mathrm{coNL}$（\tref{comp:immerman-szelepcsenyi}）を示す。最後の定理は、到達できる頂点の**個数を数える**ことで、到達できないことの証拠を非決定的に検証するという工夫による。

## 記法と定義の確認 {#comp:sec-logspace-notation}

::: notation
- TM、非決定性 TM、時点表示、P、PATH とその多項式時間アルゴリズム（\ref{comp:path-in-p}）、領域計算量、\ref{comp:savitch}は \ref{comp:page-time-complexity}, \ref{comp:page-space-complexity} のとおり。
- $\log$ は底 $2$。$n$ 以下の数は $\lceil\log(n+1)\rceil$ ビットで書ける。
:::

## 対数領域 {#comp:sec-logspace-model}

::: definition 読み取り専用の入力をもつ機械 {#comp:logspace-model keywords="read-only input tape, work tape, sublinear space" index="読み取り専用入力テープ|よみとりせんようにゅうりょくてーぷ"}
**2 テープの判定機**とは、入力テープ（書き換えできない。入力の両端に端の記号を置き、ヘッドはその間だけを動く）と作業テープ（通常のテープ）をもつ TM である。その**使用領域**を、長さ $n$ の入力の上で作業テープのヘッドが訪れる升目の数の最大値（非決定性なら、すべての計算の枝についての最大値）とする。この模型で使用領域 $O(f(n))$ の決定性（非決定性）判定機で決定できる言語全体を、改めて $\mathrm{SPACE}(f(n))$（$\mathrm{NSPACE}(f(n))$）と書く（$f(n)\ge n$ では \ref{comp:space-class} と一致する）。
:::

::: intuition
入力は読むだけで記憶に数えず、計算のための「メモ用紙」の大きさだけを測る。こうすると、入力より小さな記憶で済む計算を区別できる。
:::

::: definition L と NL {#comp:class-l-nl keywords="L, NL, logspace" index="L（計算量クラス）|えるけいさんりょうくらす, NL|えぬえる"}
$\mathrm{L}\defeq\mathrm{SPACE}(\log n)$、$\mathrm{NL}\defeq\mathrm{NSPACE}(\log n)$。補集合が NL に属する言語全体を $\mathrm{coNL}$ と書く。
:::

::: intuition
L は、入力の位置を指す番号を定数個だけ覚えて解ける問題、NL は、それに加えて道を「当て推量で」選んでよい問題である。迷路の出口を探すことは NL の典型である。
:::

::: example
1. $\{0^{k}1^{k}:k\ge0\}\in\mathrm{L}$：入力が $0^{\ast}1^{\ast}$ の形かを一度の走査で調べ、$0$ と $1$ の個数を作業テープ上の二進の計数器で数えて比べる。計数器は $O(\log n)$ ビットで足りる。
2. $\mathrm{PATH}\in\mathrm{NL}$：「現在の頂点」を作業テープに書き（$O(\log n)$ ビット）、$s$ から始めて、辺で結ばれた次の頂点を非決定的に選ぶことを繰り返し、$t$ に着いたら受理する。選んだ回数を数え、頂点数 $m$ を超えたら拒否する（どの枝も停止する）。$t$ に至る路があれば、長さ $m$ 未満の路をたどる枝が受理する。
:::

::: theorem 対数領域は多項式時間に含まれる {#comp:nl-in-p keywords="NL subset P, configuration graph" index="時点表示のグラフ|じてんひょうじのぐらふ"}
$\mathrm{L}\subseteq\mathrm{NL}\subseteq\mathrm{P}$。
:::

::: intuition
対数領域の機械がとりうる「全体の様子」は多項式個しかないので、その様子をすべて頂点に並べたグラフで到達可能性を調べれば、多項式時間で答えが出る。
:::

::: proof
$\mathrm{L}\subseteq\mathrm{NL}$ は、決定性の判定機が非決定性の判定機の特別な場合であることから従う。$\mathrm{NL}\subseteq\mathrm{P}$ を示す。$N$ を使用領域 $f(n)=O(\log n)$ の非決定性判定機とし、状態の集合を $Q$、作業テープの記号の集合を $\Gamma$ とする。入力 $w$ の上の $N$ の**時点表示**は、状態、入力ヘッドの位置（$n+2$ 通り）、作業テープの内容とヘッドの位置で決まる（入力自体は変わらないので含めない）。ゆえに、その個数は高々
$$
\lvert Q\rvert\cdot(n+2)\cdot f(n)\cdot\lvert\Gamma\rvert^{f(n)}\le(n+2)\cdot2^{O(\log n)}=n^{O(1)}
$$
である。**時点表示のグラフ** $G_{N,w}$（頂点は時点表示、$c\vdash c'$ のとき辺 $c\to c'$）を作り、開始時点表示から受理時点表示（受理状態をもつもの）のどれかへの路があるかを \ref{comp:path-in-p} で判定する。$N$ の受理する計算の枝は開始時点表示から受理時点表示への路にほかならないので、$w\in L(N)$ であることと、そのような路があることは同値である。グラフの大きさは $n$ の多項式で、頂点の一覧は長さ $O(\log n)$ の文字列をすべて調べて作れ、辺の有無は $N$ の遷移表（定数の大きさ）で調べられる。よって全体の計算は多項式時間で済む。
:::

## 対数領域還元と NL 完全性 {#comp:sec-nl-complete}

::: definition 対数領域還元 {#comp:logspace-reduction keywords="log-space transducer, log-space reduction" index="対数領域還元|たいすうりょういきかんげん"}
**対数領域の変換機**とは、読み取り専用の入力テープ、作業テープ、書き込み専用の出力テープ（ヘッドは右にしか動かない）をもつ決定性 TM で、作業テープの使用領域が $O(\log n)$ のものである。停止したとき出力テープに $f(w)$ を残すとき、$f$ を**対数領域で計算可能**という。そのような $f$ で $w\in A\iff f(w)\in B$ となるとき $A\le_{\mathrm{L}}B$ と書く。$B\in\mathrm{NL}$ で、すべての $A\in\mathrm{NL}$ について $A\le_{\mathrm{L}}B$ となるとき、$B$ は **NL 完全**という。
:::

::: lemma 対数領域還元の合成 {#comp:logspace-composition keywords="composition of log-space reductions, recomputation" index="再計算の技法|さいけいさんのぎほう"}
$f,g$ が対数領域で計算可能なら $g\circ f$ もそうである。とくに $\le_{\mathrm{L}}$ は推移的で、$A\le_{\mathrm{L}}B$ かつ $B\in\mathrm{L}$（$\mathrm{NL}$）なら $A\in\mathrm{L}$（$\mathrm{NL}$）。
:::

::: proof
$f$ の変換機 $M_{f}$ の時点表示（出力テープの内容は含めない）の個数は、\ref{comp:nl-in-p} と同じ計算で $n$ の多項式で抑えられる。$M_{f}$ は決定性で停止するので同じ時点表示を二度通らず、ゆえにある定数 $c$ について段数は $n^{c}$ 以下であり、$\lvert f(w)\rvert\le n^{c}$ となる。$f(w)$ を作業テープに書き出すと領域が多すぎるので、書き出さない。$g$ の変換機 $M_{g}$ を動かし、$M_{g}$ が入力の第 $i$ 記号を読もうとするたびに、$M_{f}$ を $w$ の上で最初から動かし、出力の記号を数えて（出力は捨てる）第 $i$ 記号だけを取り出す（$M_{f}$ が第 $i$ 記号を出す前に停止したら、$M_{g}$ の入力ヘッドは右端の記号の上にあるとみなす）。記録するのは $M_{g}$ の作業テープ（$O(\log n^{c})=O(\log n)$）、$i$（$O(\log n)$ ビット）、$M_{f}$ の作業テープ（$O(\log n)$）だけである。よって $g\circ f$ は対数領域で計算できる。後半は、$B$ の判定機（決定性または非決定性）を $M_{g}$ の代わりに置き、同じように対数領域還元と組み合わせればよい。

::: hypcheck
- **時点表示の個数が多項式**：$\lvert f(w)\rvert\le n^{c}$ を導くのに使った。これにより $i$ も $M_{g}$ の作業テープも $O(\log n)$ ビットに収まる。
- **再計算**：中間の出力 $f(w)$ を記憶する代わりに、必要な記号だけを毎回計算し直した。時間は増えるが領域は増えない。
- **入力が読み取り専用で数えないこと**：対数領域が意味をもつための模型の約束。$f(w)$ を作業テープに写すことはできない。
:::
:::

::: theorem PATH は NL 完全 {#comp:path-nl-complete keywords="PATH is NL-complete" index="NL 完全|えぬえるかんぜん"}
PATH は NL 完全である。
:::

::: proof
PATH $\in$ NL は例の 2 で示した。$A\in\mathrm{NL}$ を使用領域 $O(\log n)$ の非決定性判定機 $N$ が決定するとし、受理時点表示が一つになるようにしておく（受理する前に作業テープを消し、両ヘッドを左端に戻す）。$w\mapsto\langle G_{N,w},c_{\mathrm{start}},c_{\mathrm{acc}}\rangle$（\ref{comp:nl-in-p} の時点表示のグラフ）が対数領域で計算できることを示せばよい。すると $N$ が $w$ を受理することと、$G_{N,w}$ に $c_{\mathrm{start}}$ から $c_{\mathrm{acc}}$ への路があることは同値である（\ref{comp:nl-in-p} の証明）。時点表示は $O(\log n)$ ビットの文字列で表せる。変換機は、長さ $O(\log n)$ のすべての文字列を辞書式に作業テープ上で数え上げ、時点表示を表すものを出力して頂点の一覧を書く。次に、すべての対 $(c,c')$ を数え上げ、$c\vdash c'$ なら辺 $(c,c')$ を出力する。$c\vdash c'$ の判定には、$c$ の入力ヘッドの位置を計数器で数えて入力テープのその記号を読み、$N$ の遷移表（定数）と照合すればよい。使う領域は二つの時点表示と補助の計数器だけなので $O(\log n)$ である。
:::

::: corollary
$\mathrm{NL}\subseteq\mathrm{SPACE}(\log^{2}n)$。
:::

::: proof
サヴィッチの定理の証明（\tref{comp:savitch}）は、入力を読み取り専用のテープに置く模型でもそのまま使える。時点表示の長さが $O(\log n)$ なので、再帰の深さ $O(\log n)$ と各段の時点表示 $O(\log n)$ ビットを掛けて、$O(\log^{2}n)$ の領域で済む（時点表示の長さの上限を決める $f(n)=\lceil\log(n+1)\rceil$ は、入力の長さを二進で数えて領域 $O(\log n)$ で計算できる）。
:::

## NL = coNL {#comp:sec-immerman}

::: theorem イマーマン–セレプチェーニの定理 {#comp:immerman-szelepcsenyi keywords="Immerman-Szelepcsenyi theorem, NL = coNL, inductive counting" index="イマーマン–セレプチェーニの定理|いまーまんせれぷちぇーにのていり" refname="イマーマン–セレプチェーニの定理"}
$\mathrm{NL}=\mathrm{coNL}$。
:::

::: intuition
「到達できない」ことは、非決定的な当て推量だけでは証明しにくい。しかし到達できる頂点の個数が分かっていれば、その個数だけの頂点を実際に見つけてみせ、その中に目的地がないことを示せばよい。その個数自体も、路の長さの上限を一つずつ伸ばしながら対数領域で数えられる。
:::

::: proof
**Step 1（補集合の PATH への帰着）.** 【主張：$\overline{\mathrm{PATH}}\in\mathrm{NL}$ なら $\mathrm{NL}=\mathrm{coNL}$ である】 $A\in\mathrm{coNL}$ とすると $\overline{A}\in\mathrm{NL}$ であり、PATH は NL 完全（\ref{comp:path-nl-complete}）なので、ある対数領域還元 $h$ で $\overline{A}\le_{\mathrm{L}}\mathrm{PATH}$ となる。$w\in\overline{A}\iff h(w)\in\mathrm{PATH}$ の両辺を否定すると $w\in A\iff h(w)\in\overline{\mathrm{PATH}}$ なので、同じ $h$ で $A\le_{\mathrm{L}}\overline{\mathrm{PATH}}$ である。ゆえに \ref{comp:logspace-composition} から $A\in\mathrm{NL}$ となり、$\mathrm{coNL}\subseteq\mathrm{NL}$ を得る。逆に $A\in\mathrm{NL}$ なら $\overline{A}\in\mathrm{coNL}\subseteq\mathrm{NL}$ なので $A\in\mathrm{coNL}$ である。

以下、$\overline{\mathrm{PATH}}\in\mathrm{NL}$ を示す。入力を $\langle G,s,t\rangle$、頂点数を $m$ とし、$R_{i}$ を $s$ から長さ $i$ 以下の路で到達できる頂点の集合、$c_{i}\defeq\lvert R_{i}\rvert$ とおく。$R_{0}=\{s\}$, $c_{0}=1$ であり、到達できる頂点には長さ $m-1$ 以下の路（頂点を繰り返さない路）があるので、$R_{m-1}$ は到達できる頂点全体である。非決定性機械は、「拒否されない枝では必ず正しい値を計算する」という意味で、次の手続きを実行する。

**Step 2（手続き 1：$v\in R_{i}$ の確認）.** 【主張：手続き 1 が成功する枝があるのは $v\in R_{i}$ のときに限る】 手続き 1 は、$s$ から始めて辺に沿って次の頂点を非決定的に選ぶことを高々 $i$ 回繰り返し（現在の頂点と歩数だけを記録する）、$v$ に着いたら成功とする。成功した枝のたどった頂点の列は $s$ から $v$ への長さ $i$ 以下の路なので $v\in R_{i}$ である。逆に $v\in R_{i}$ なら、その路の頂点を順に選ぶ枝が成功する。

**Step 3（手続き 2：$c_{i}$ から $c_{i+1}$ を求める）.** 【主張：$c_{i}$ を与えると、手続き 2 の拒否されない枝はすべて $c_{i+1}$ を出力し、拒否されない枝が少なくとも一つある】 手続き 2 は次のとおりである。計数器 $d\gets0$ とおく。各頂点 $v$ について、$v\in R_{i+1}$ かどうかを次のように決める：計数器 $e\gets0$、フラグ $\mathrm{in}\gets$ 偽とおく。各頂点 $u$ について、非決定的に「$u\in R_{i}$ と推測する」か「推測しない」を選び、推測したら手続き 1 で確認する（失敗したらこの枝を拒否する）。確認できたら $e\gets e+1$ とし、$u=v$ または $(u,v)$ が辺なら $\mathrm{in}\gets$ 真とする。すべての $u$ を調べた後、$e\neq c_{i}$ ならこの枝を拒否する。拒否しなければ、$\mathrm{in}$ が真のとき $d\gets d+1$ とする。すべての $v$ を調べた後の $d$ を出力する。
拒否されない枝では、確認できた $u$ はすべて $R_{i}$ に属し（Step 2）、その個数が $e=c_{i}=\lvert R_{i}\rvert$ なので、$R_{i}$ の元を**すべて**推測し確認している。したがって $\mathrm{in}$ が真であることは「$v\in R_{i}$ か、$R_{i}$ のある元から $v$ へ辺がある」こと、すなわち $v\in R_{i+1}$ と同値であり、出力は $d=c_{i+1}$ となる。また、$R_{i}$ の元をちょうどすべて推測し、Step 2 の成功する枝で確認する枝は拒否されない。

**Step 4（手続き 3：$t\notin R_{m-1}$ の確認）.** 【主張：手続き 3 が受理する枝があるのは $t$ に到達できないときに限る】 手続き 3 は、$c_{0}=1$ から始めて手続き 2 を $m-1$ 回繰り返し（各回の $c_{i}$ は前の回の出力とする）、$c_{m-1}$ を得る。最後に、手続き 2 の内側と同じ方法で各頂点 $u$ について $u\in R_{m-1}$ を推測・確認し、確認できた個数が $c_{m-1}$ に一致し、確認した頂点の中に $t$ がなければ受理する。Step 3 から、拒否されない枝の得た $c_{m-1}$ は正しい。$t$ に到達できないなら、$R_{m-1}$ の元をちょうどすべて推測・確認する枝は $t$ を確認せずに受理する。$t$ に到達できるなら、個数が $c_{m-1}$ に一致した枝は $R_{m-1}$ の元をすべて確認しており、その中に $t\in R_{m-1}$ があるので受理しない。個数が一致しない枝は拒否する。

**Step 5（領域）.** 【主張：この非決定性機械の使用領域は $O(\log n)$ である】 記録するのは $c_{i}$, $d$, $e$, $i$, $u$, $v$ と手続き 1 の現在の頂点と歩数、フラグ $\mathrm{in}$ だけであり、どれも $m$ 以下の数か 1 ビットなので、合わせて $O(\log n)$ ビットである。$R_{i}$ そのものは記録しない。また、手続き 1 の歩数は $i$ 以下、繰り返しの回数も有限なので、どの枝も停止する。よって $\overline{\mathrm{PATH}}\in\mathrm{NL}$ である。

::: hypcheck
- **PATH の NL 完全性**：Step 1 で使った。NL の言語を一つの言語 $\overline{\mathrm{PATH}}$ に集約するためで、\ref{comp:logspace-composition}（対数領域還元の合成）も合わせて使った。
- **個数 $c_{i}$**：Step 3・Step 4 の本質で、「$R_{i}$ の元をすべて列挙した」ことを、個数が合うかどうかで検証可能にした。個数を知らなければ、非決定的な推測で一部の元を見落としても気づけない。
- **非決定性の受理条件（受理する枝が一つでもあればよい）**：Step 3・Step 4 で、誤った推測をした枝を拒否するだけで済むことに使った。決定性の機械ではこの議論はそのままでは使えず、L $=$ NL かどうかは未解決である。
- **頂点数 $m$ で路の長さを抑えること**：Step 1 の後の段落で、$R_{m-1}$ が到達できる頂点全体になることに使った。
:::
:::

## 問題 {#comp:sec-logspace-problems}

::: problem {#comp:prob-l-in-p-direct}
$\mathrm{L}\subseteq\mathrm{P}$ を、時点表示のグラフを使わずに直接示せ。
:::

::: solution
使用領域 $O(\log n)$ の決定性判定機の時点表示は $n^{O(1)}$ 個である（\ref{comp:nl-in-p} の計算）。決定性の判定機の計算は同じ時点表示を二度通らない（通れば同じ動きを繰り返して停止しない）ので、計算の長さは時点表示の個数以下、すなわち多項式である。よって、その判定機をそのまま多項式時間の判定機として使える。
:::

::: problem {#comp:prob-2sat-nl}
$\overline{\mathrm{2SAT}}$（充足不能な 2CNF）が NL に属することを示し、$\mathrm{2SAT}\in\mathrm{NL}$ を導け。
:::

::: solution
問題 \ref{comp:prob-2sat-p} の含意グラフ $G$（リテラルを頂点とし、節 $a\vee b$ ごとに辺 $\neg a\to b$ と $\neg b\to a$ を引いたもの）を使う。$\ell\leadsto\ell'$ で $G$ の有向路（長さ $0$ を含む）の存在を表す。

**主張.** 2CNF $\varphi$ が充足不能であることと、ある変数 $p$ について $p\leadsto\neg p$ かつ $\neg p\leadsto p$ であることは同値である。

(⇐) は問題 \ref{comp:prob-2sat-p} の解答で示した。(⇒) の対偶を示す。どの変数 $p$ についても $p\leadsto\neg p$ と $\neg p\leadsto p$ の少なくとも一方が成り立たないと仮定する。まず、辺 $\neg a\to b$ と $\neg b\to a$ は同じ節から対で引かれるので、辺 $\ell\to\ell'$ があれば辺 $\neg\ell'\to\neg\ell$ もある。ゆえに $\ell\leadsto\ell'$ なら $\neg\ell'\leadsto\neg\ell$ である（対称性）。「真」としたリテラルの集合 $T$ を、次の二条件を保ちながら大きくしていく：(i) $T$ はあるリテラルとその否定を同時に含まない、(ii) $\ell\in T$ かつ $\ell\leadsto\ell'$ なら $\ell'\in T$。最初は $T=\emptyset$ とする。$p$ も $\neg p$ も $T$ に属さない変数 $p$ があれば、$\ell\in\{p,\neg p\}$ を $\ell\leadsto\neg\ell$ でないように選び（仮定からどちらかは選べる）、$T$ に $\ell$ から到達できるリテラルをすべて加える。新しい $T$ が (i) を満たすことを確かめる。$\ell\leadsto m$ かつ $\ell\leadsto\neg m$ となる $m$ があったとすると、対称性から $m\leadsto\neg\ell$ なので $\ell\leadsto\neg\ell$ となり、$\ell$ の選び方に反する。$\ell\leadsto m$ で $\neg m$ が前の $T$ に属していたとすると、対称性から $\neg m\leadsto\neg\ell$ なので (ii) から $\neg\ell$ が前の $T$ に属し、$p$ が未定だったことに反する。(ii) は、前の $T$ と新しく加えた集合がどちらも到達について閉じていることから従う。これを変数がなくなるまで繰り返し、$T$ の元を真とする付値を定める（どの変数も $p$ か $\neg p$ の一方が $T$ に属する）。各節 $a\vee b$ について、$a$ が偽なら $\neg a\in T$ であり、辺 $\neg a\to b$ と (ii) から $b\in T$ なので、節は充足される（$a=b$ の節も同じ）。よって $\varphi$ は充足可能である。

**$\overline{\mathrm{2SAT}}\in\mathrm{NL}$.** 主張から、非決定性機械は変数 $p$ を推測し、$p\leadsto\neg p$ と $\neg p\leadsto p$ の二つの路を例の 2 と同じ方法でたどればよい。$G$ の辺は入力の節から直接読み取れるので、$G$ を書き出す必要はない。記録するのは $p$、現在のリテラル、歩数（リテラルの個数以下）だけなので、領域は $O(\log n)$ である。よって $\overline{\mathrm{2SAT}}\in\mathrm{NL}$ となる。したがって $\mathrm{2SAT}\in\mathrm{coNL}$ であり、\ref{comp:immerman-szelepcsenyi} から $\mathrm{2SAT}\in\mathrm{NL}$ を得る。
:::

::: supplement
**前提の検討.**
- \ref{comp:immerman-szelepcsenyi} の証明は、領域構成可能（\see{comp:space-constructible}）で $f(n)\ge\log n$ を満たす $f$ について $\mathrm{NSPACE}(f(n))=\mathrm{coNSPACE}(f(n))$ を与える。実際、$\mathrm{NSPACE}(f(n))$ の判定機の時点表示のグラフは頂点が $2^{O(f(n))}$ 個で、各頂点は $O(f(n))$ ビットで書ける。$f(n)$ を先に計算して時点表示の長さの上限を決めれば、このグラフの上で Step 2〜Step 4 の手続きを、PATH の入力の代わりに遷移表を直接参照して実行でき、数はどれも $O(f(n))$ ビットに収まる。とくに $f(n)=n$ とすると、線形有界オートマトンが\term[認識する言語]{comp:recognizable-decidable}（文脈依存言語と一致することが知られている）の族は補集合で閉じる。これはクロダの「第二の LBA 問題」の解決として知られている。
- L と NL が等しいか、NL と P が等しいかは未解決である。

**関連する結果.**
- *無向グラフの到達可能性.* 無向グラフの PATH は L に属する（ラインゴールド 2005）ことが知られている。
- *記述計算量.* 順序付きの有限構造の上で、NL は推移閉包を加えた一階論理、P は最小不動点を加えた一階論理で定義できる性質と一致することが知られている（イマーマン、ヴァルディ）。

**高い視点から：数えることの力.** 非決定性の計算は「存在の証拠」は示せても「非存在の証拠」は一般に示せない。NP と coNP の関係が未解決なのはこのためである。イマーマン–セレプチェーニの定理は、対数領域では「到達できる頂点の個数」という小さな情報が「非存在の証拠」の代わりになることを示した。個数さえ分かっていれば、「全部見つけた」ことを確かめられ、そこに $t$ がなければ到達できないと言える。比喩で言えば、出席者の人数が分かっていれば、出席者を全員見つけ出したとき、そこにいない人は欠席だと断言できる。この「数えて閉じる」技法は、帰納的に $c_{i}$ を伸ばしていく点で、最小不動点 $R_{0}\subseteq R_{1}\subseteq\cdots$（\ref{comp:kleene-fixed-point}）を数で追跡することに当たる。
:::
