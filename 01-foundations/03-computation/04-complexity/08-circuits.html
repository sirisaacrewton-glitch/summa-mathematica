# ブール回路と回路計算量 {#comp:page-circuits keywords="Boolean circuit, gates, circuit size, circuit depth, size complexity, Shannon lower bound, parity, circuits simulate Turing machines, P/poly, CIRCUIT-SAT is NP-complete, alternative proof of Cook-Levin"}

チューリング機械は任意の長さの入力を一台で処理するが、**ブール回路**（\ref{comp:boolean-circuit}）は入力の長さごとに別の「配線図」を用意する計算モデルである。回路の大きさ（ゲートの個数）は計算の難しさの組合せ的な物差しになる。本ページでは、すべての関数が指数的な大きさの回路で計算でき、しかも**ほとんどすべての関数は指数的な大きさを必要とする**こと（シャノンの下界、\ref{comp:shannon-lower-bound}）、時間 $t(n)$ のチューリング機械は大きさ $O(t(n)^{2})$ の回路で模倣できること（\ref{comp:time-to-size}）を示す。応用として、回路の充足可能性問題 CIRCUIT-SAT が NP 完全であること（\ref{comp:circuit-sat-complete}）を示し、\ref{comp:cook-levin}の別証明を得る。

> 資料：M. Sipser, *Introduction to the Theory of Computation*, 3rd ed., §9.3 を参考にした（本文は写していない）。シャノンの下界は同書では演習なので、数え上げを具体的な不等式で示した。チューリング機械の模倣は、本サイトのクック–レヴィンの定理の証明で使った「一段の動きは局所的」（\ref{comp:local-step}）を決定性の機械に合わせて言い直して使った。

## 記法と定義の確認 {#comp:sec-cir-notation}

::: notation
- チューリング機械、時点表示、一段の動きは \ref{comp:turing-machine}, \ref{comp:tm-configuration} のとおり。時間計算量、P、NP（検証機による定義）、多項式時間還元、NP 完全は \ref{comp:running-time}, \ref{comp:class-p}, \ref{comp:class-np}, \ref{comp:poly-reduction}, \ref{comp:np-complete}。
- クック–レヴィンの定理の証明の記号（記号の集合 $C=Q\cup\Gamma$、左端の記号 $\triangleright$、時点表示を長さ $m$ の記号列で表すこと）と、一段の動きの局所性 $c'_{j}=g_{\tau}(c_{j-1},c_{j},c_{j+1},c_{j+2})$ は \ref{comp:cook-levin} の前の記述と \ref{comp:local-step} のとおり。ツァイティン変換は \ref{comp:tseitin}。
:::

## ブール回路 {#comp:sec-cir-definition}

::: definition ブール回路 {#comp:boolean-circuit keywords="Boolean circuit, AND OR NOT gates, size, depth, circuit family, size complexity" index="ブール回路|ぶーるかいろ, ゲート|げーと, 回路の大きさ|かいろのおおきさ, 回路計算量|かいろけいさんりょう"}
1. $n$ 入力の**ブール回路** $C$ は、ゲートの列 $g_{1},\dots,g_{s}$ で、各ゲート $g_{i}$ は種類（AND, OR, NOT）と入力（AND・OR は二つ、NOT は一つ）をもち、入力は入力変数 $x_{1},\dots,x_{n}$、定数 $0,1$、またはより前のゲート $g_{1},\dots,g_{i-1}$ のいずれかであるものとする。最後のゲート $g_{s}$ を**出力ゲート**という。$s$ を $C$ の**大きさ**、入力から出力までの最長の道のゲートの個数を**深さ**という。
2. 入力 $x\in\{0,1\}^{n}$ について各ゲートの値を順に計算し、出力ゲートの値を $C(x)$ とする。$C$ は関数 $\{0,1\}^{n}\to\{0,1\}$ を**計算する**。
3. **回路族** $(C_{n})_{n\ge0}$（$C_{n}$ は $n$ 入力）が言語 $A\subseteq\{0,1\}^{\ast}$ を**決定する**とは、すべての $w$ について $w\in A\iff C_{\lvert w\rvert}(w)=1$ となることをいう。$A$ を決定する回路族の $C_{n}$ の大きさの最小値を $\mathrm{SIZE}_{A}(n)$ と書き、$A$ の**大きさ計算量**という。
:::

::: intuition
ブール回路は、AND・OR・NOT の素子を配線した、入力の長さが決まった計算の「配線図」である。素子の個数が、その長さの入力を処理する手間の物差しになる。
:::

::: example
1. **パリティ.** $x_{1}\oplus\cdots\oplus x_{n}$（$1$ の個数の偶奇）は、$a\oplus b=(a\wedge\neg b)\vee(\neg a\wedge b)$（ゲート 5 個）を $n-1$ 回つないで、大きさ $5(n-1)$ の回路で計算できる。
2. **任意の関数.** $f\colon\{0,1\}^{n}\to\{0,1\}$ は、$f(a)=1$ となる各 $a$ について「$x=a$」を表す連言（$x_{i}$ または $\neg x_{i}$ の AND）を作り、それらを OR でつなげば計算できる（選言標準形）。NOT ゲートは $n$ 個を共有し、連言一つにつき AND が $n-1$ 個、連言は $2^{n}$ 個以下で、OR が $2^{n}-1$ 個以下なので、大きさは $n+2^{n}(n-1)+2^{n}\le n2^{n}+n$ 以下（$f$ が恒等的に $0$ なら定数 $0$ と $0$ の AND ゲート一つ）。
:::

## シャノンの下界 {#comp:sec-cir-shannon}

::: theorem シャノンの下界 {#comp:shannon-lower-bound keywords="Shannon counting lower bound: most Boolean functions require circuits of size about 2^n/n" index="シャノンの下界|しゃのんのかかい"}
$n\ge3$ について、大きさ $2^{n}/(4n)$ 以下の回路で計算できる関数 $\{0,1\}^{n}\to\{0,1\}$ の個数は $2^{2^{n}}$ より少ない。とくに、大きさ $2^{n}/(4n)$ を超える回路を必要とする関数が存在する（$n$ が大きいとき、関数の大部分がそうである）。
:::

::: intuition
小さな回路の配線の仕方は、関数の総数に比べてずっと少ない。だから、ほとんどすべての関数は小さな回路では計算できない。ただし、どの関数がそうなのかを具体的に示すのは難しい。
:::

::: proof
$s\defeq\lfloor2^{n}/(4n)\rfloor$ とおく。$s=0$ の場合、大きさ $0$ の回路はない（出力ゲートが要る）ので、計算できる関数は $0$ 個であり、主張は成り立つ。以下 $s\ge1$ とする。

**Step 1.** 【主張：大きさ $s$ 以下の回路で計算できる関数の個数は、大きさちょうど $s$ の回路の個数以下である】 大きさ $s'<s$ の回路は、出力ゲート $g$ の後に「$g$ AND $g$」のゲートを $s-s'$ 個つなげば、同じ関数を計算する大きさちょうど $s$ の回路になる。ゆえに、大きさ $s$ 以下の回路で計算できる関数は、どれも大きさちょうど $s$ の回路で計算でき、その個数は大きさちょうど $s$ の回路の個数以下である。

**Step 2（回路の数え上げ）.** 【主張：大きさ $s$ の回路は $\bigl(3(n+2+s)^{2}\bigr)^{s}$ 個以下である】 各ゲートの種類は $3$ 通りであり、各入力は入力変数・定数・ゲートのいずれかなので $n+2+s$ 通り以下である（NOT の二つ目の入力は使わないものとして多めに数える）。ゲートは $s$ 個なので、回路の個数は $\bigl(3(n+2+s)^{2}\bigr)^{s}$ 以下である。

**Step 3（評価）.** 【主張：$\bigl(3(n+2+s)^{2}\bigr)^{s}<2^{2^{n}}$ である】 $n\ge2$ なら $n+2\le2^{n}$ であり、また $s\le2^{n}$ なので、$n+2+s\le2^{n+1}$ である。よって
$$
\begin{aligned}
\log_{2}\Bigl(\bigl(3(n+2+s)^{2}\bigr)^{s}\Bigr)&\le s\,(\log_{2}3+2n+2)<s\,(2n+4)\\
&\le\frac{2^{n}}{4n}(2n+4)<2^{n}
\end{aligned}
$$
が成り立つ（最後の不等式は、$n\ge3$ で $2n+4<4n$ となることによる）。

Step 1〜3 から、大きさ $2^{n}/(4n)$ 以下の回路で計算できる関数は $2^{2^{n}}$ 個より少なく、関数 $\{0,1\}^{n}\to\{0,1\}$ は全部で $2^{2^{n}}$ 個あるので、そのような回路で計算できない関数がある。さらに Step 3 の評価から、計算できる関数の割合は $2^{2^{n}(2n+4)/(4n)}/2^{2^{n}}=2^{-2^{n}(1/2-1/n)}$ 以下であり、$n\to\infty$ で $0$ に近づく。

::: hypcheck
- **数え上げの上界**：Step 2 で、ゲートの入力の選び方を「入力変数・定数・すべてのゲート」から選ぶとして多めに数えた。前のゲートだけに制限しても上界は成り立つ。
- **$n\ge3$**：Step 3 の最後の不等式 $2n+4<4n$ に使った。
- **評価の細部**：Step 3 で $n+2+s\le2^{n+1}$ を使って対数を $n+1$ で抑えた。漸近的には $2^{n}/n$ の定数倍が正しい桁で、上の $1/4$ は改善できる。
:::
:::

## チューリング機械の模倣 {#comp:sec-cir-simulation}

::: lemma 決定性の機械の一段 {#comp:deterministic-local-step keywords="deterministic local step function for tableaux" index="一段の局所関数（決定性）|いちだんのきょくしょかんすうけっていせい"}
$M$ を決定性の単一テープ機械とする。写像 $g\colon(C\cup\{\triangleright\})^{4}\to C$ で、時点表示 $c$（長さ $m$ の記号列。位置 $0$ に $\triangleright$、位置 $m+1,m+2$ に空白）について、$c$ が停止時点表示でなければ次の時点表示 $c'$ が、停止時点表示なら $c'\defeq c$ が、すべての $1\le j\le m$ で $c'_{j}=g(c_{j-1},c_{j},c_{j+1},c_{j+2})$ を満たすものがある。
:::

::: proof
$g$ を次のように定める。窓 $(s_{-1},s_{0},s_{1},s_{2})$ で、状態の記号 $q$ が位置 $l\in\{-1,0,1\}$ にあり、その次 $s_{l+1}$ がテープ記号 $a$ である場合、$q$ が停止状態なら $g\defeq s_{0}$ とし、そうでなければ遷移 $\tau=\delta(q,a)$ の $g_{\tau}$（\ref{comp:local-step}）を使って $g\defeq g_{\tau}(s_{-1},s_{0},s_{1},s_{2})$ とする。それ以外の窓では $g\defeq s_{0}$ とする。

正しさを示す。$c$ の状態の記号の位置を $p$ とする。\ref{comp:local-step} の証明から、一段の動きで変わりうるのは位置 $p-1,p,p+1$ だけである。$j\in\{p-1,p,p+1\}$ なら、窓 $(c_{j-1},\dots,c_{j+2})$ は位置 $p$ と $p+1$ を両方含む（$l=p-j\in\{-1,0,1\}$）ので、$g$ は正しい遷移の $g_{\tau}$ を使い、$c'_{j}$ を返す。それ以外の $j$ では $c'_{j}=c_{j}$ であり、窓に状態の記号があるのは $p=j+2$ の場合（$l=2$）だけで、これは場合分けに入らないので、$g$ は $s_{0}=c_{j}$ を返す。停止時点表示の場合は、状態が停止状態なので、すべての窓で $g$ は $s_{0}$ を返し、$c'=c$ と一致する。
:::

::: theorem 時間から回路の大きさへ {#comp:time-to-size keywords="TIME(t) is contained in SIZE(O(t^2))" index="時間と回路の大きさ|じかんとかいろのおおきさ" refname="時間計算量から回路の大きさへ" refscope="field"}
$t(n)\ge n$ とし、$A\subseteq\{0,1\}^{\ast}$ が時間 $t(n)$ の決定性単一テープ機械 $M$ で決定されるなら、$\mathrm{SIZE}_{A}(n)=O(t(n)^{2})$。さらに、$1^{n}$ から $t(n)$ を $t(n)$ の多項式時間で計算できる（たとえば $t$ が多項式）なら、$1^{n}$ から $C_{n}$ を $t(n)$ の多項式時間で書き出せる。
:::

::: intuition
時間 $t$ の計算は、時点表示を $t$ 行並べた表で書け、各升は前の行の近くの升だけで決まる。その依存関係を配線すれば、大きさ $t^{2}$ 程度の回路になる。
:::

::: proof
$n$ を固定し、$T\defeq t(n)$, $m\defeq T+2$ とする。記号 $C\cup\{\triangleright\}$ を固定の長さ $k$ のビット列で符号化する。

**回路の構成.** 「升」$(i,j)$（$0\le i\le T$, $1\le j\le m$）ごとに $k$ 本の線（ゲートの出力）を用意し、表の第 $i$ 行の位置 $j$ の記号の符号を運ばせる。
- 第 $0$ 行：開始時点表示 $q_{0}w_{1}\cdots w_{n}\sqcup\cdots\sqcup$。位置 $1$ は定数 $q_{0}$ の符号、位置 $j+1$（$1\le j\le n$）は $w_{j}\in\{0,1\}$ の符号で、各ビットは定数、$x_{j}$、$\neg x_{j}$ のいずれか（$0$ と $1$ の符号のそのビットの値で決まる）、位置 $n+2,\dots,m$ は空白の符号（定数）。
- 第 $i+1$ 行の升 $(i+1,j)$：\ref{comp:deterministic-local-step} の $g$ は $4k$ ビットから $k$ ビットへの固定の関数なので、それを計算する固定の大きさ $G$ の回路（例 2）を、第 $i$ 行の升 $(i,j-1),\dots,(i,j+2)$ の線（位置 $0$ と $m+1,m+2$ は定数の符号）につなぐ。
- 出力：第 $T$ 行の各位置で「記号が $q_{\mathrm{acc}}$ か」を判定する固定の回路（$k$ ビットの比較）を作り、$m$ 個の結果を OR でつなぐ。

**大きさ.** 升は $(T+1)m=O(T^{2})$ 個であり、各升は定数個（$M$ だけで決まる）のゲートを使い、出力の判定も $O(m)$ 個のゲートで済む。よって大きさは $O(t(n)^{2})$ である。後半の仮定のもとでは、$T=t(n)$ を $t(n)$ の多項式時間で計算でき、その後は升ごとに同じ部品を番号を付けて並べるだけなので、$C_{n}$ は $t(n)$ の多項式時間で書き出せる。

**正しさ.** $i$ に関する帰納法で、第 $i$ 行の線は、$M$ を $w$ の上で $i$ 段動かした時点表示（それより前に停止していれば停止時点表示）の符号を運ぶことを示す。$i=0$ の場合は第 $0$ 行の作り方による。第 $i$ 行について成り立てば、第 $i+1$ 行は \ref{comp:deterministic-local-step} の $g$ で計算されるので、次の時点表示（停止していればそのまま）の符号を運ぶ。ここで、$T$ 段以内ではヘッドは位置 $T+1=m-1$ より右へ行かないので、時点表示を長さ $m$ の記号列で表せる。$M$ は $T$ 段以内に停止するので、第 $T$ 行は停止時点表示であり、それが $q_{\mathrm{acc}}$ を含むのは $M$ が $w$ を受理するときに限る。よって $C_{n}(w)=1\iff w\in A$ である。

::: hypcheck
- **決定性**：\ref{comp:deterministic-local-step} で次の行が前の行の関数として決まることに使った。非決定性の機械では選択を表す入力が別に要る（次の CIRCUIT-SAT では証明書がその役をする）。
- **時間 $t(n)$**：表の大きさ $(T+1)\times m$ と、第 $T$ 行が停止時点表示であることに使った。
- **$t(n)\ge n$**：第 $0$ 行に入力 $w$ 全体を書くのに、$m=T+2\ge n+1$ が要る。
:::
:::

::: remark
\ref{comp:time-to-size} から、$\mathrm{P}$ に属する言語は多項式の大きさの回路族をもつ。逆は成り立たない：大きさの小さい回路族は、入力の長さごとに任意の情報（「助言」）を埋め込めるので、決定不能な言語も決定できる。たとえば $\{1^{n}:n\text{ を符号とする機械が空テープで停止する}\}$ は、その機械が停止する $n$ では $C_{n}\defeq x_{1}\wedge\cdots\wedge x_{n}$（$1^{n}$ だけで $1$ を出す、大きさ $n-1$ の回路。$n\le1$ なら入力そのものか定数 $1$）、停止しない $n$ では定数 $0$ を出す回路をとる回路族で決定される。多項式の大きさの回路族をもつ言語のクラスを $\mathrm{P}/\mathrm{poly}$ という。
:::

## CIRCUIT-SAT {#comp:sec-cir-sat}

::: theorem CIRCUIT-SAT は NP 完全 {#comp:circuit-sat-complete keywords="circuit satisfiability is NP-complete" index="CIRCUIT-SAT|さーきっとさっと, 回路の充足可能性|かいろのじゅうそくかのうせい"}
$\mathrm{CIRCUIT\text{-}SAT}\defeq\{\langle C\rangle:C\text{ はある入力 }x\text{ で }C(x)=1\text{ となる回路}\}$ は NP 完全である。
:::

::: intuition
「この回路に $1$ を出させる入力はあるか」という問いは、NP のどの問題も書き込める万能の問いである。検証機の計算を回路に展開し、証明書の部分だけを入力として残せばよいからである。
:::

::: proof
**NP に属する.** 証明書は入力 $x$ とする。回路の値をゲートの順に計算すれば、$C(x)=1$ かどうかを多項式時間で確かめられる。

**NP 困難.** $A\in\mathrm{NP}$ とし、時間 $n^{k}$ の検証機 $V$ をとる（\ref{comp:class-np}）。$\lvert w\rvert=n$ の $w\in A$ には長さ $n^{k}$ 以下の証明書がある。証明書を（必要なら符号化して）長さちょうど $L$（$n$ の多項式）の $0,1$ 列 $c$ で表し、$\langle w,c\rangle$ を $w$ と $c$ のビットを固定の規則で並べた長さ $N$（$n$ だけで決まる）の $0,1$ 列にそろえる。$V$ をそれに合わせて作り直しても、長さ $N$ の入力について $N$ の多項式時間で停止する決定性の単一テープ機械のままである（多テープで作り直した場合も、\ref{comp:multitape-time} で単一テープに直せば多項式時間のままである）。\ref{comp:time-to-size} で、$V$ の長さ $N$ の入力に対する回路 $C_{N}$ を作り、$w$ のビットに対応する入力を定数 $w_{j}$ に置き換えた回路を $C_{w}$（入力は $c$ の $L$ ビット）とする。$C_{w}$ は $w$ から多項式時間で書き出せる（\ref{comp:time-to-size} の後半。時間の上界は多項式）。そして
$$
C_{w}\text{ が充足可能}\iff\text{ある }c\text{ で }V\text{ が }\langle w,c\rangle\text{ を受理する}\iff w\in A
$$
である。よって $A\le_{\mathrm{P}}\mathrm{CIRCUIT\text{-}SAT}$ である。
:::

::: corollary クック–レヴィンの定理の別証明 {#comp:cook-levin-via-circuits keywords="3SAT is NP-complete via circuits" index="クック–レヴィンの定理（回路による）|くっくれゔぃんのていりかいろによる"}
$\mathrm{CIRCUIT\text{-}SAT}\le_{\mathrm{P}}3\mathrm{SAT}$。したがって 3SAT は NP 完全である。
:::

::: proof
回路 $C$ のゲート $g_{i}$ ごとに変数 $z_{i}$ を用意し、ツァイティン変換（\ref{comp:tseitin}）と同じく、$z_{i}$ がゲートの値に等しいことを表す長さ $3$ 以下の節（NOT は 2 節、AND・OR は 3 節）を作る（定数 $0,1$ の入力は、節を簡約するか、真の定数を表す変数 $u$ と節 $(u)$ を加えて表す）。さらに出力の節 $(z_{s})$ を加える。長さが $3$ 未満の節は、同じリテラルを重ねて 3 リテラルにする。節の数は回路の大きさの定数倍なので、この 3CNF は多項式時間で書き出せる。ゲートの節をすべて充足する付値では、各 $z_{i}$ は入力の値から決まるゲート $g_{i}$ の値に等しいので、この 3CNF を充足する付値は、$C(x)=1$ となる入力 $x$ と一対一に対応する。ゆえに $C$ が充足可能であることと、この 3CNF が充足可能であることは同値である。3SAT は NP に属し（証明書は付値）、CIRCUIT-SAT は NP 完全（\ref{comp:circuit-sat-complete}）なので、$\le_{\mathrm{P}}$ の推移性から 3SAT は NP 完全である。
:::

## 問題 {#comp:sec-cir-problems}

::: problem {#comp:prob-cir-majority}
$3$ 入力の多数決関数 $\mathrm{MAJ}(a,b,c)$（$1$ が 2 個以上なら $1$）を計算する、大きさ $4$ の回路を作れ。
:::

::: solution
$\mathrm{MAJ}(a,b,c)=(a\wedge b)\vee(c\wedge(a\vee b))$ と書けることを使う。ゲートは $g_{1}=a\wedge b$, $g_{2}=a\vee b$, $g_{3}=c\wedge g_{2}$, $g_{4}=g_{1}\vee g_{3}$ の 4 個。正しさを確かめる。$a=b=1$ なら $g_{1}=1$ なので出力は $1$ である。$a,b$ の一方だけが $1$ なら $g_{1}=0$, $g_{2}=1$ なので出力は $c$ に等しく、$1$ が 2 個以上であることと一致する。$a=b=0$ なら $g_{1}=g_{2}=0$ なので出力は $0$ である。
:::

::: problem {#comp:prob-cir-depth}
$n$ 入力のパリティは、深さ $O(\log n)$、大きさ $O(n)$ の回路で計算できることを示せ。
:::

::: solution
$x_{1},\dots,x_{n}$ を二つずつ組にして $\oplus$（深さ 3、大きさ 5 の回路）で結合し、これを木状に $\lceil\log_{2}n\rceil$ 段繰り返す。各段で項の数は $\lceil\cdot/2\rceil$ になるので、$\lceil\log_{2}n\rceil$ 段で一つになる。二つを一つにまとめるたびに部品を一つ使うので、$\oplus$ の部品は全部で $n-1$ 個である。よって大きさは $5(n-1)$、深さは $3\lceil\log_{2}n\rceil$ である。
:::

::: supplement
**前提を変えると.** シャノンの下界は「ほとんどの関数」について指数的な下界を与えるが、NP に属する具体的な言語について超多項式の回路の下界を示すことは未解決である。$\mathrm{NP}\not\subseteq\mathrm{P}/\mathrm{poly}$ が示されれば $\mathrm{P}\neq\mathrm{NP}$ が従う（\ref{comp:time-to-size}）。制限された回路（深さ一定の $\mathrm{AC}^{0}$、単調回路）では、パリティが $\mathrm{AC}^{0}$ に入らないこと（ファースト–サックス–シプサー、アイタイ、ハスタード）や、クリークの単調回路計算量が超多項式であること（ラズボロフ。のちにアロン–ボッパナが指数的な下界に改良した）が知られている（ここでは証明しない）。

**似た定理.** $\mathrm{NP}\subseteq\mathrm{P}/\mathrm{poly}$ なら多項式階層が第 2 層で崩壊する（\see{comp:karp-lipton}。多項式階層は \see{comp:page-alternation} で扱う）。回路の深さは並列計算の時間に対応する。ある $k$ について多項式の大きさで深さ $O(\log^{k}n)$ の一様な回路族で決定できる言語のクラス $\mathrm{NC}$ は \see{comp:page-parallel} で扱う。

**高い視点から：回路は「展開されたプログラム」.** チューリング機械の計算を時間方向に展開すると、時点表示の列が並んだ表になり、各升は直前の行の近くの升だけで決まる。この依存関係をそのまま配線したものが \ref{comp:time-to-size} の回路で、比喩で言えば、ループのあるプログラムを入力の長さに合わせて「ループ展開」し、分岐のない一本道の計算にしたものである。一本道になった計算では、「ある入力で $1$ を出すか」という問いが\term[論理式]{logic:prop-formula}の充足可能性そのものになり、これがクック–レヴィンの定理の本質である。
:::
