# 階層定理と相対化 {#comp:page-hierarchy keywords="space hierarchy theorem, time hierarchy theorem, space constructible, time constructible, diagonalization, NL ≠ PSPACE, P ≠ EXPTIME, relativization, oracle, Baker-Gill-Solovay"}

資源を増やせば、真に多くの問題が解けるようになる。これを述べるのが**階層定理**（領域は \tref{comp:space-hierarchy}、時間は \ref{comp:time-hierarchy}）で、証明は停止問題と同じ**対角線論法**を、資源を制限して行う。系として $\mathrm{NL}\subsetneq\mathrm{PSPACE}$、$\mathrm{P}\subsetneq\mathrm{EXPTIME}$ が得られる（\ref{comp:hierarchy-separations}）。一方で、P 対 NP 問題は対角線論法では解けないことが、**相対化**の議論で示される：神託 $A$ で $\mathrm{P}^{A}=\mathrm{NP}^{A}$ となるもの（\ref{comp:bgs-equal}）と、神託 $B$ で $\mathrm{P}^{B}\neq\mathrm{NP}^{B}$ となるもの（\ref{comp:bgs-separate}）がある（ベイカー–ギル–ソロヴェイ）。

## 記法と定義の確認 {#comp:sec-hier-notation}

::: notation
- $\mathrm{TIME}$、$\mathrm{SPACE}$（読み取り専用入力をもつ模型、\ref{comp:logspace-model}）、P、NP、PSPACE、EXPTIME、L、NL、サヴィッチの定理、TQBF の PSPACE 完全性（\ref{comp:tqbf-complete}）は \ref{comp:page-time-complexity}, \ref{comp:page-np}, \ref{comp:page-space-complexity}, \ref{comp:page-logspace} のとおり。
- 神託機械（\ref{comp:oracle-tm}）は \ref{comp:page-turing-reducibility} のとおり。神託への問い合わせは一段で答えが得られる。
- $\mathrm{EXPSPACE}\defeq\bigcup_{k}\mathrm{SPACE}(2^{n^{k}})$。
:::

## 領域階層定理 {#comp:sec-space-hierarchy}

::: definition 領域構成可能 {#comp:space-constructible keywords="space constructible function" index="領域構成可能|りょういきこうせいかのう"}
$f\colon\N\to\N$ が**領域構成可能**とは、$f(n)\ge\log n$ で、入力 $1^{n}$ から $f(n)$ の二進表記を領域 $O(f(n))$ で計算する決定性の機械があることをいう。$\log n$, $n^{k}$, $2^{n}$ などはどれも領域構成可能である。
:::

::: intuition
自分に許された領域の大きさを、その領域の中で測り取れる関数のこと。階層定理の対角化では、まず使ってよい範囲に印を付ける必要がある。
:::

::: theorem 領域階層定理 {#comp:space-hierarchy keywords="space hierarchy theorem" index="領域階層定理|りょういきかいそうていり" refname="領域階層定理"}
$f$ が領域構成可能なら、領域 $O(f(n))$ で決定できるが、領域 $o(f(n))$ では決定できない言語がある。
:::

::: intuition
使ってよい記憶を本質的に増やせば、必ず新しく解ける問題が現れる。少ない記憶の機械をすべて相手にして、それぞれと逆の答えを出す機械を、少し多い記憶で作れるからである。
:::

::: proof
判定機 $D$ を次で定める（\ref{comp:logspace-model} の模型）。入力 $w$（長さ $n$）について：
1. $f(n)$ の二進表記を計算し（入力の記号をすべて $1$ と読む）、作業テープを 3 本のトラックに分けて $2f(n)$ 升の範囲に印を付ける。以後この範囲を出ようとしたら拒否する。
2. $w$ が $\langle M\rangle10^{j}$（$M$ は \ref{comp:logspace-model} の 2 テープの判定機の符号、$j\ge0$）の形でなければ拒否する（この検査は入力テープを読みながら $O(\log n)$ ビットの計数器で行える）。
3. $M$ を $w$ の上で模倣する。第 1 トラックに $M$ の作業テープを（$M$ の記号を $D$ の記号の列に符号化して）、第 2 トラックに模倣の段数の計数器（$2f(n)$ ビット）を、第 3 トラックに $M$ の状態と入力ヘッドの位置を書く。$M$ の遷移は入力テープの $\langle M\rangle$ の部分を読んで調べ、そのたびに記録した位置へ入力ヘッドを戻す。段数が $2^{2f(n)}$ を超えたら拒否する。
4. $M$ が受理したら拒否、拒否したら受理する。

**Step 1（$D$ の資源）.** 【主張：$D$ はどの入力でも停止し、使用領域は $O(f(n))$ である】 1 は $f$ の領域構成可能性から領域 $O(f(n))$ で行え、2 は $O(\log n)\le O(f(n))$ の領域で行える。3 は印を付けた $2f(n)$ 升の 3 本のトラックの中で行い、出ようとしたら拒否する。段数の計数器が尽きれば拒否するので、$D$ はどの入力でも停止する。よって $A\defeq L(D)$ とおくと $A\in\mathrm{SPACE}(f(n))$ である。

**Step 2（模倣が最後まで届く）.** 【主張：使用領域 $g(n)=o(f(n))$ の判定機 $M$ について、$n$ が十分大きければ、$D$ は $w=\langle M\rangle10^{j}$（長さ $n$）の上で $M$ の計算を最後まで模倣する】 $M$ の作業テープの 1 升を書くのに第 1 トラックの $c_{M}$ 升を使う（$c_{M}$ は $M$ のテープ記号の数だけで決まる）。$M$ の状態の符号の長さは $\lvert\langle M\rangle\rvert$ 以下で $n$ によらず、入力ヘッドの位置は $\log(n+2)\le f(n)+1$ ビットで書ける（$f(n)\ge\log n$ を使う）。また、$M$ は決定性で停止するので同じ時点表示を二度通らず、計算の段数は時点表示の個数
$$
\lvert Q_{M}\rvert\cdot(n+2)\cdot g(n)\cdot\lvert\Gamma_{M}\rvert^{g(n)}=2^{\log(n+2)+O(g(n))}
$$
以下である（\ref{comp:nl-in-p} の計算）。$g=o(f)$ かつ $\log(n+2)\le f(n)+1$ なので、十分大きい $n$ では $c_{M}g(n)\le2f(n)$、第 3 トラックの内容が $2f(n)$ 升に収まり、段数が $2^{2f(n)}$ 以下となる。ゆえに $D$ は $M$ の計算を最後まで模倣する。

**Step 3（対角化）.** 【主張：$A$ は領域 $o(f(n))$ の判定機では決定できない】 領域 $g(n)=o(f(n))$ の判定機 $M$ が $A$ を決定すると仮定する。$j$ を大きくとって $w\defeq\langle M\rangle10^{j}$ の長さ $n$ を Step 2 の条件を満たすほど大きくすると、$D$ は $M$ の $w$ の上の計算を最後まで模倣し、手順 4 で $M$ と逆の答えを出す。よって $w\in A\iff w\notin L(M)$ となり、$M$ が $A$ を決定することに矛盾する。

::: hypcheck
- **領域構成可能性**：Step 1 で、$D$ が $f(n)$ を領域 $O(f(n))$ で計算して範囲を区切るのに使った。構成可能でない関数では、階層定理が成り立たない場合がある（ボロディンのギャップ定理）ことが知られている。
- **$f(n)\ge\log n$**：Step 2 で、入力ヘッドの位置と時点表示の個数の因子 $n+2$ を $f(n)$ の範囲に収めるのに使った。
- **$g=o(f)$**：Step 2 で、符号化の定数倍 $c_{M}$ と時点表示の個数の $2^{O(g(n))}$ を吸収するのに使った。$g=O(f)$ では足りない（$D$ 自身が領域 $O(f(n))$ の機械である）。
- **計数器**：$M$ が止まらない場合に備えるためではなく（$M$ は判定機）、$D$ 自身がどの入力でも停止するために置いた。
:::
:::

## 時間階層定理 {#comp:sec-time-hierarchy}

::: definition 時間構成可能 {#comp:time-constructible keywords="time constructible function" index="時間構成可能|じかんこうせいかのう"}
$t\colon\N\to\N$ が**時間構成可能**とは、$t(n)\ge n\log n$ で、入力 $1^{n}$ から $t(n)$ の二進表記を時間 $O(t(n))$ で計算する決定性の単一テープの機械があることをいう。
:::

::: intuition
自分に許された時間の長さを、その時間の中で計算できる関数のこと。$n\log n$, $n^{k}$, $2^{n}$ など、ふつうに現れる関数はこの性質をもつ。
:::

::: theorem 時間階層定理 {#comp:time-hierarchy keywords="time hierarchy theorem" index="時間階層定理|じかんかいそうていり" refname="時間階層定理"}
$t$ が時間構成可能なら、時間 $O(t(n))$ で決定できるが、時間 $o(t(n)/\log t(n))$ では決定できない言語がある。
:::

::: intuition
使ってよい時間を対数の因子より多く増やせば、必ず新しく解ける問題が現れる。対数の因子は、模倣のたびに時計と遷移表を持ち運ぶ手間の分である。
:::

::: proof
\ref{comp:space-hierarchy} と同じ対角化を、単一テープの判定機 $D$ で行う。$b(n)$ を $t(n)$ の二進表記の桁数とする（$t(n)\ge2$ なら $b(n)\le2\log t(n)$）。$D$ のテープは定数本のトラックに分ける。$M$ のテープの内容を書くトラックとは別に、**作業区画**（$M$ のヘッドの位置から右へ続く長さ $O(b(n))$ の区間）を置き、そこに $x$（$M$ の符号）の写し、$M$ の現在の状態、段数の計数器、$M$ のヘッドの位置 $p$、入力の長さ $n$ を、数は桁をそろえた別々のトラックに書く。入力 $w$（長さ $n$）について、$D$ は次を行う。
1. $n$ と $t(n)$ の二進表記を計算し（$t(n)$ は、入力の記号をすべて $1$ と読んで時間構成可能性の機械を別のトラックで動かす）、$b(n)$ と $K\defeq\lfloor t(n)/b(n)\rfloor$ を求める。
2. $w$ が $x10^{j}$（$j\ge0$）の形でなければ拒否する。$\lvert x\rvert>b(n)$ のとき、または $x$ が単一テープの TM の符号でないときも拒否する。そうでなければ、計数器を $K$ に設定して作業区画を作る。
3. $M=M_{x}$ を $w$ の上で模倣する。$M$ のテープの 1 升は $M$ の記号を符号化した $c_{M}$ 升（$c_{M}\le\lvert x\rvert$）のブロックで表し、まだ訪れていないブロックの内容は、元の入力を見に行かずに作業区画の $x$, $n$, $p$ から決める（$p\le\lvert x\rvert$ なら $x$ の第 $p$ 記号、$p=\lvert x\rvert+1$ なら $1$、$\lvert x\rvert+1<p\le n$ なら $0$、それ以外は空白）。模倣の作業は、作業区画を一往復しながら定数個の操作をする「回」に分け、回ごとに計数器を $1$ 減らす。計数器が $0$ になったら拒否する。
4. $M$ が受理したら拒否、拒否したら受理する。

**Step 1（$D$ の時間）.** 【主張：$D$ はどの入力でも時間 $O(t(n))$ で停止する】 1 で $n$ を二進で数えるのは、計数器をヘッドとともに運んで $O(n\log n)$ 段であり、$t(n)\ge n\log n$ からこれは $O(t(n))$ である。$t(n)$ の計算は時間構成可能性から $O(t(n))$ 段（使ったトラックの消去も同じ）、$b(n)$ と $K$ の計算は $b(n)$ ビットの数の演算なので $b(n)$ の多項式の段数で、$b(n)=O(\log t(n))$ からこれも $O(t(n))$ である。2 は、$w$ を一度走査し、$x$ と $t(n)$ の表記を桁をそろえて比べれば $O(n+b(n))$ 段で済み、符号の検査と作業区画の準備は $\lvert x\rvert\le b(n)$ と $b(n)$ の多項式の時間で済む。3 の各回は長さ $O(b(n))$ の作業区画の一往復と定数個の操作なので $O(b(n))$ 段であり、回の数は $K$ 以下なので、合わせて $O(K\cdot b(n))=O(t(n))$ 段である。よって $L(D)\in\mathrm{TIME}(t(n))$ である。

**Step 2（一段の模倣の回数）.** 【主張：$M$ の一段の模倣は、$M$ だけで決まる回数 $r_{M}$ 回以内で済む】 $M$ の一段の模倣に要るのは、ヘッドの下のブロックの読み取り（まだ訪れていなければ、$p$ を $\lvert x\rvert+1$ や $n$ と比べ、必要なら $x$ の第 $p$ 記号を取り出す）、状態と記号の組を作業区画の $x$ の中の遷移表と照合すること、ブロックの書き換え、作業区画を $c_{M}$ 升左右に動かして $p$ を $1$ 増減することである。桁をそろえた数の比較・増減は一往復で済み、照合は $x$ の記号を一つずつ比べて $O(\lvert x\rvert^{2})$ 回、作業区画を $1$ 升動かすのは一往復で済むので、$c_{M}$ 升動かすのは $c_{M}$ 回である。どれも回数が $\lvert x\rvert$ と $c_{M}$ だけで決まり、$n$ によらない。

**Step 3（対角化）.** 【主張：時間 $o(t(n)/\log t(n))$ の単一テープの判定機は $L(D)$ を決定しない】 単一テープの判定機 $M$ が時間 $g(n)=o(t(n)/\log t(n))$ で $L(D)$ を決定すると仮定し、$x\defeq\langle M\rangle$ とおく。$b(n)\le2\log t(n)$ なので $K\ge t(n)/(2\log t(n))-1$ であり、Step 2 から $M$ の計算全体の模倣は $r_{M}\,g(n)$ 回以内で済む。$g=o(t/\log t)$ なので、十分大きい $n$ では $r_{M}\,g(n)\le K$ かつ $\lvert x\rvert\le b(n)$ である。そのような長さ $n$ の $w\defeq x10^{j}$ をとると、$D$ は計数器の範囲内で $M$ の $w$ の上の計算を最後まで模倣し、$M$ と逆の答えを出す。よって $w\in L(D)\iff w\notin L(M)$ となり、矛盾する。

::: hypcheck
- **時間構成可能性**：Step 1 で、$t(n)$ を時間 $O(t(n))$ で計算して計数器を設定するのに使った。$t(n)\ge n\log n$ は、入力の長さ $n$ を二進で数える $O(n\log n)$ 段を $O(t(n))$ に収めるのに使った。
- **作業区画を運ぶこと**：Step 1・Step 2 で、単一テープでも遷移表と計数器をヘッドの近くに置き、一回を $O(b(n))$ 段に抑えるのに使った。これが $\log t(n)$ の損失の由来である。領域では計数器を同じ升目で再利用できるので、損失がない。
- **$\lvert x\rvert\le b(n)$ の制限**：Step 1 で、作業区画の長さを $M$ によらず $O(b(n))$ に抑え、$D$ の時間を入力によらず一様に $O(t(n))$ にするのに使った。固定した $M$ については $n$ を大きくすれば満たされるので、Step 3 の対角化を妨げない。
- **まだ訪れていないブロックを作業区画から決めること**：Step 1 で、入力を $c_{M}$ 倍に引き伸ばす（単一テープでは $n^{2}$ 程度の時間がかかる）のを避けるのに使った。
:::
:::

::: corollary 階層定理による分離 {#comp:hierarchy-separations keywords="NL ≠ PSPACE, P ≠ EXPTIME, PSPACE ≠ EXPSPACE" index="計算量クラスの分離|けいさんりょうくらすのぶんり"}
$\mathrm{NL}\subsetneq\mathrm{PSPACE}\subsetneq\mathrm{EXPSPACE}$、$\mathrm{P}\subsetneq\mathrm{EXPTIME}$。
:::

::: proof
サヴィッチの定理から $\mathrm{NL}\subseteq\mathrm{SPACE}(\log^{2}n)$ である（\ref{comp:page-logspace} の系）。領域階層定理（$f(n)=n$）から、$\mathrm{SPACE}(n)$ には領域 $o(n)$ で決定できない言語があり、$\log^{2}n=o(n)$ なのでその言語は $\mathrm{SPACE}(\log^{2}n)$ に属さない。ゆえに $\mathrm{NL}\subseteq\mathrm{SPACE}(\log^{2}n)\subsetneq\mathrm{SPACE}(n)\subseteq\mathrm{PSPACE}$ である。同様に、領域階層定理（$f(n)=2^{n}$）から $\mathrm{SPACE}(2^{n})\subseteq\mathrm{EXPSPACE}$ に領域 $o(2^{n})$ で決定できない言語があり、どの $n^{k}$ も $o(2^{n})$ なので、その言語は $\mathrm{PSPACE}=\bigcup_{k}\mathrm{SPACE}(n^{k})$ に属さない。よって $\mathrm{PSPACE}\subsetneq\mathrm{EXPSPACE}$ である。時間については、$t(n)=2^{2n}$ は時間構成可能（二進表記は $1$ の後に $0$ を $2n$ 個並べたもので、$O(n^{2})$ 段で書ける）なので、時間階層定理から $\mathrm{TIME}(2^{2n})\subseteq\mathrm{EXPTIME}$ に時間 $o(2^{2n}/2n)$ で決定できない言語がある。$\mathrm{P}$ のどの言語も、ある $k$ について時間 $O(n^{k})$ で決定でき、$n^{k}=o(2^{2n}/2n)$ なので、その言語は P に属さない。よって $\mathrm{P}\subsetneq\mathrm{EXPTIME}$ である。
:::

## 相対化 {#comp:sec-relativization}

::: definition 神託付きの計算量クラス {#comp:oracle-classes keywords="relativized complexity classes, P^A, NP^A" index="相対化|そうたいか"}
言語 $A$ について、$\mathrm{P}^{A}$（$\mathrm{NP}^{A}$）を、神託 $A$ をもつ決定性（非決定性）の神託機械が多項式時間で決定できる言語全体とする。
:::

::: intuition
「$A$ に属するかどうか」を一手で教えてくれる助っ人を付けたときに、多項式時間で解ける問題のクラスである。どの助っ人を付けても成り立つ議論は「相対化する」という。
:::

::: theorem 神託 A で P と NP が一致する {#comp:bgs-equal keywords="Baker-Gill-Solovay, oracle with P^A = NP^A"}
$\mathrm{P}^{\mathrm{TQBF}}=\mathrm{NP}^{\mathrm{TQBF}}$。
:::

::: intuition
助っ人が十分に強い（PSPACE の問題を一手で答える）と、非決定性の力は助っ人の力に吸収され、P と NP の差が消える。
:::

::: proof
$\mathrm{P}^{\mathrm{TQBF}}\subseteq\mathrm{NP}^{\mathrm{TQBF}}$ は定義から成り立つ。次に $\mathrm{NP}^{\mathrm{TQBF}}\subseteq\mathrm{NPSPACE}$ を示す。多項式時間の神託機械は多項式長の問い合わせしかしないので、各問い合わせに神託の代わりに TQBF $\in$ PSPACE（\ref{comp:tqbf-complete}）の判定を直接計算して答えれば、多項式領域の非決定性機械になる。サヴィッチの定理から $\mathrm{NPSPACE}=\mathrm{PSPACE}$ である。最後に $\mathrm{PSPACE}\subseteq\mathrm{P}^{\mathrm{TQBF}}$ を示す。TQBF は PSPACE 完全なので、$B\in\mathrm{PSPACE}$ の入力を多項式時間で TQBF の問いに変換し、神託に一度尋ねればよい。以上を合わせて $\mathrm{P}^{\mathrm{TQBF}}\subseteq\mathrm{NP}^{\mathrm{TQBF}}\subseteq\mathrm{PSPACE}\subseteq\mathrm{P}^{\mathrm{TQBF}}$ となり、すべて等しい。
:::

::: theorem 神託 B で P と NP が異なる {#comp:bgs-separate keywords="Baker-Gill-Solovay, oracle with P^B ≠ NP^B" index="ベイカー–ギル–ソロヴェイの定理|べいかーぎるそろゔぇいのていり"}
$\{0,1\}$ 上の言語 $B$ で $\mathrm{P}^{B}\neq\mathrm{NP}^{B}$ となるものがある。
:::

::: intuition
助っ人の答えをうまく隠すと、「どこかに当たりがあるか」を当て推量なら一手で確かめられるのに、決定性の機械は多項式回の問い合わせでは当たりを見つけられない。
:::

::: proof
$L_{B}\defeq\{1^{n}:B\text{ は長さ }n\text{ の文字列を含む}\}$ とおく。

**Step 1.** 【主張：どの $B$ についても $L_{B}\in\mathrm{NP}^{B}$ である】 入力 $1^{n}$ について、長さ $n$ の文字列を非決定的に選び、神託に尋ねて、$B$ に属すれば受理する機械は、多項式時間で $L_{B}$ を決定する。

**Step 2（機械の列と $B$ の構成）.** 【主張：どの $i$ についても、最終的な $B$ のもとで $M_{i}$ は入力 $1^{n_{i}}$ に誤った答えを出す】 神託機械を $N_{1},N_{2},\dots$ と並べ、各 $N_{k}$ が無限に多くの番号 $i$ で $N_{k(i)}=N_{k}$ となるように番号 $k(i)$ を割り当てる。$M_{i}$ を、$N_{k(i)}$ に時計を付けて $n^{i}$ 段で止め（止めたら拒否する）たものとする。$B$ を段階的に決める。段階 $i$ で、長さ $n_{i}$ を、(a) それまでの段階で尋ねられた文字列や $B$ に入れた文字列のどれよりも長く、(b) $n_{i}\ge2$ かつ $n_{i}^{i}<2^{n_{i}}$ となるように選ぶ。$M_{i}$ を入力 $1^{n_{i}}$ の上で動かし、神託の問い合わせには、それまでに決めた $B$ の部分で答える（まだ決めていない文字列は $B$ に入れないと決める）。
- $M_{i}$ が受理した場合、長さ $n_{i}$ の文字列は $B$ に入れない。すると $1^{n_{i}}\notin L_{B}$ なのに $M_{i}$ は受理する。
- $M_{i}$ が拒否した場合、長さ $n_{i}$ の文字列で $M_{i}$ が尋ねなかったものを一つ $B$ に入れる（$M_{i}$ は高々 $n_{i}^{i}<2^{n_{i}}$ 個しか尋ねないので、そのような文字列はある）。尋ねた文字列への答えは変えていないので $M_{i}$ の計算は変わらず、$1^{n_{i}}\in L_{B}$ なのに $M_{i}$ は拒否する。

以後の段階 $i'>i$ で $B$ に入れる文字列の長さ $n_{i'}$ は、(a) により段階 $i$ で尋ねられたどの文字列よりも長いので、$M_{i}$ の $1^{n_{i}}$ の上の計算は最終的な $B$ についても同じであり、誤った答えのままである。

**Step 3.** 【主張：$L_{B}\notin\mathrm{P}^{B}$ である】 神託 $B$ のもとで、ある神託機械 $N_{k}$ が多項式時間 $q(n)$ で $L_{B}$ を決定したと仮定する。$q(n)\le c\,n^{d}$ とすると、$i\ge d+\log c$ なら $n\ge2$ で $q(n)\le n^{i}$ である。$k(i)=k$ となる $i\ge d+\log c$ をとると、$n_{i}\ge2$ なので $M_{i}$ は入力 $1^{n_{i}}$ の上で時計に止められずに $N_{k}$ と同じ答えを出す。これは Step 2 に矛盾する。Step 1 と合わせて $L_{B}\in\mathrm{NP}^{B}\setminus\mathrm{P}^{B}$ である。

::: hypcheck
- **神託への問い合わせの数が多項式**：Step 2 で、尋ねられない文字列があること（$n_{i}^{i}<2^{n_{i}}$）に使った。
- **(a) 長さを増やしていくこと**：Step 2 で、後の段階が前の段階の計算を変えないことに使った。
- **各機械を無限回並べること**：Step 3 で、時計 $n^{i}$ が $N_{k}$ の実行時間を上回る番号 $i$ をとるのに使った。
- **対角化は相対化する**：階層定理の証明は、神託機械に対してもそのまま通る（$D$ も同じ神託をもてばよい）。\ref{comp:bgs-equal} とこの定理から、相対化する議論だけでは P 対 NP 問題は解けない。
:::
:::

## 問題 {#comp:sec-hier-problems}

::: problem {#comp:prob-nl-ne-pspace-direct}
$\mathrm{L}\neq\mathrm{PSPACE}$ を示せ。また、L と P、P と PSPACE のうち少なくとも一方は異なることを示せ。
:::

::: solution
$\mathrm{L}\subseteq\mathrm{NL}$ と \ref{comp:hierarchy-separations} から $\mathrm{L}\subseteq\mathrm{NL}\subsetneq\mathrm{PSPACE}$ であり、ゆえに $\mathrm{L}\neq\mathrm{PSPACE}$ である。また $\mathrm{L}\subseteq\mathrm{P}\subseteq\mathrm{PSPACE}$ であり、二つの包含がどちらも等号なら $\mathrm{L}=\mathrm{PSPACE}$ となって矛盾する。よって少なくとも一方は真の包含である。
:::

::: problem {#comp:prob-exptime-complete}
$\mathrm{E}\defeq\{\langle M,w,1^{k}\rangle:\text{決定性 TM }M\text{ は }w\text{ を }2^{k}\text{ 段以内に受理する}\}$ は EXPTIME に属し P に属さないことを示せ（EXPTIME の言語はすべて $\mathrm{E}$ に多項式時間還元できることを使ってよい）。
:::

::: solution
まず $\mathrm{E}\in\mathrm{EXPTIME}$ を示す。$M$ を $w$ の上で $2^{k}$ 段まで模倣すればよく、入力の長さ $N\ge k$ について、一段の模倣は $N$ と $2^{k}$ の多項式の時間で済むので、全体で時間 $2^{O(N)}$ である。次に、$\mathrm{E}\in\mathrm{P}$ と仮定する。EXPTIME のすべての言語は $\mathrm{E}$ に多項式時間で還元されるので P に属し、$\mathrm{P}=\mathrm{EXPTIME}$ となって \ref{comp:hierarchy-separations} に矛盾する。よって $\mathrm{E}\notin\mathrm{P}$ である。（還元は、$A\in\mathrm{TIME}(2^{n^{c}})$ を時間 $2^{\lvert w\rvert^{c}+d}$ 以内で決める $M$ について、$w\mapsto\langle M,w,1^{\lvert w\rvert^{c}+d}\rangle$ とすればよい。）
:::

::: supplement
**前提の検討.**
- 非決定性の時間階層定理も成り立つことが知られている（クック、セイフェラス–フィッシャー–マイヤー）。非決定性の機械の答えを反転するには「すべての枝が拒否する」ことを確かめる必要があり、それは補集合をとることなので、同じ程度の時間の非決定性の機械では一般にできない。そのため、反転を遠い入力に先送りする遅延対角化などの工夫を要する。
- 時間階層定理の $\log t(n)$ の損失は、上の証明では、模倣の一段ごとに計数器と遷移表（作業区画）をヘッドとともに運ぶ費用に由来する。テープの本数を固定した多テープ機械の時間で測ると、この損失なしに階層が成り立つことが知られている（フューラー）。

**関連する結果.**
- *自然な証明の壁*（ラズボロフ–ルーディック）と*代数化の壁*（アーロンソン–ウィグダーソン）：相対化の壁のほかにも、P 対 NP を解くのに使えない手法の範囲が知られている。前者は「自然な証明」と呼ばれる形の回路の下界の証明（一方向関数の存在などの暗号の仮定のもとで）を、後者は「代数化する」証明（相対化する議論と、相対化しない議論の一部を含む）を排除する。どちらも特定の形の手法を排除するもので、相対化しない議論すべてを排除するわけではない。
- *多項式階層* $\mathrm{PH}$：$\Sigma_{k}^{\mathrm{P}}=\mathrm{NP}^{\Sigma_{k-1}^{\mathrm{P}}}$ で定める階層で、算術的階層（\ref{comp:arithmetical-hierarchy}）の多項式時間版である（\see{comp:page-alternation}）。$\mathrm{PH}\subseteq\mathrm{PSPACE}$ が成り立つ。実際、$\Sigma_{0}^{\mathrm{P}}=\mathrm{P}\subseteq\mathrm{PSPACE}$ であり、$\Sigma_{k-1}^{\mathrm{P}}\subseteq\mathrm{PSPACE}$ なら、\ref{comp:bgs-equal} の証明と同じく神託への問い合わせを多項式領域で直接計算して $\Sigma_{k}^{\mathrm{P}}\subseteq\mathrm{NPSPACE}=\mathrm{PSPACE}$ となる。

**高い視点から：対角線論法の射程.** 階層定理は、停止問題の決定不能性（\ref{comp:halting-L}）と同じ対角線論法を「時計付き」で行ったものである：資源の上限 $f$ を決めると、上限内の機械はすべて数え上げられ、それらと逆の答えを出す機械は、上限内では作れないが少し多くの資源では作れる。ベイカー–ギル–ソロヴェイの定理は、この論法が「神託の中身を見ない」ことを利用して、その限界を示した。比喩で言えば、対角線論法は「どんな鍵のかかった箱にも同じように働く道具」で、だからこそ、箱の中身（計算の具体的な構造）に依存する問題には使えない。P 対 NP を解くには、計算の中身を見る（相対化しない）技法が必要だと考えられている。
:::
