# 層のコホモロジー（Sheaf Cohomology）

位相空間上の前層と層・茎と芽、層化とエタール空間、順像と逆像の随伴と 0 拡張、アーベル群の層の圏と層コホモロジー、脆弱層・ゴドマン分解・チェックコホモロジーとルレイの定理、軟層と特異コホモロジーとの比較。サイト上の層と層の圏のトポスとしての性質は「トポスとサイト」にある。

<p class="mn-msc">MSC2020: 18F20, 55N30</p>

## 前提知識

- [圏論 › 圏論の基礎](../../../01-foundations/06-category-theory/01-basics/index.html)（全体、12 ページ）：圏・関手・極限・随伴
- [圏論 › カン拡張とエンド](../../../01-foundations/06-category-theory/04-kan-extensions/index.html)（全体、5 ページ）：証明・主張で使う：Set のフィルター付き余極限・有限の極限とフィルター付き余極限の交換・群の忘却関手とフィルター付き余極限
- [圏論 › モノイダル圏](../../../01-foundations/06-category-theory/02-monoidal-categories/index.html)（全体、11 ページ）：証明・主張で使う：単体圏（チェック複体の面写像）
- [ホモロジー代数 › 導来関手](../../../02-algebra/06-homological-algebra/02-derived-functors/index.html)（全体、9 ページ）：証明・主張で使う：アーベル群の入射性・可除群への埋め込み・左導来関手 など
- [ホモロジー代数 › アーベル圏](../../../02-algebra/06-homological-algebra/01-abelian-categories/index.html)（全体、5 ページ）：証明・主張で使う：ホモロジーの長完全列・アーベル圏・左完全性の言い換え など
- [一般位相 › 基本性質 I](../../../05-geometry-topology/01-general-topology/04-properties/index.html)（全体、9 ページ）：証明・主張で使う：デュドネの定理（パラコンパクトなら正規）・縮小補題・局所有限な族の閉包 など
