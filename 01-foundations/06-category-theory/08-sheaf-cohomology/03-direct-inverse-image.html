# 順像と逆像 {#cat:page-direct-inverse-image keywords="direct image of a sheaf f_*, inverse image f^{-1}, adjunction between inverse and direct image, stalks of inverse image, pullback of etale spaces, restriction to an open set, extension by zero j_!, closed embedding"}

連続写像 $f:X\to Y$ は層を二方向に運ぶ。$X$ 上の層 $F$ の**順像** $f_{*}F$ は $V\mapsto F(f^{-1}V)$ で、定義はすぐだが茎は簡単に計算できない。$Y$ 上の層 $G$ の**逆像** $f^{-1}G$ は「$G$ の切断を $f$ で引き戻したもの」で、定義には層化が要るが、茎は $G_{f(x)}$ と簡単に計算でき、エタール空間の引き戻しとしても記述できる。二つは随伴 $f^{-1}\dashv f_{*}$ をなす。開集合への制限、1 点への制限（茎）、大域切断、摩天楼層、定数層はすべてこの二つの特別な場合である。最後に、アーベル群の層について、開集合の外では 0 に延ばす**0 拡張** $j_{!}$ を作る。


## 記法と定義の確認 {#cat:sec-di-notation}

::: notation
- 前層・層・茎・芽・層の射の茎による判定は \ref{cat:sheaf-space}, \ref{cat:stalk}, \ref{cat:germs-determine-sections}, \ref{cat:stalkwise-criteria}。前層の圏 $\widehat{\mathcal{O}(X)}$、層の圏 $\mathbf{Sh}(X)$。
- 層化 $F^{+}$、$\eta:F\to F^{+}$ とその普遍性、茎を保つことは \ref{cat:sheafification}, \ref{cat:sheafification-properties}。局所同相 $p:E\to X$ の切断の層 $\Gamma(-,E)$ の茎がファイバー $p^{-1}(x)$ と一致することは \ref{cat:sheaves-etale-equivalence} の証明の Step 2（写像 $\Theta$）。
- 集合のフィルター付き余極限の明示的な記述は \ref{cat:filtered-colimit-set}。随伴の一意性・合成は \ref{cat:adjoint-unique}, \ref{cat:adjunction-composition}。\term[部分空間]{top:subspace}の位相は \ref{top:subspace}。
- $f:X\to Y$ は連続写像。$V\subset Y$ が開なら $f^{-1}V$ は開。
- **選択公理**：使わない。
:::

## 順像 {#cat:sec-di-direct}

::: definition 順像 {#cat:direct-image keywords="direct image (pushforward) of a presheaf f_* F(V)=F(f^{-1}V)" index="順像|じゅんぞう, 押し出し（層）|おしだしそう"}
$X$ 上の前層 $F$ の $f$ による**順像** $f_{*}F$ を、$Y$ の開集合 $V$ について $(f_{*}F)(V)\defeq F(f^{-1}V)$、制限を $F$ の制限 $F(f^{-1}V)\to F(f^{-1}V')$（$V'\subset V$）で定める。前層の射 $\varphi$ には $(f_{*}\varphi)_{V}\defeq\varphi_{f^{-1}V}$ を対応させる。
:::

::: proposition 順像の基本性質 {#cat:direct-image-basic keywords="direct image of a sheaf is a sheaf; (gf)_* = g_* f_*" index="順像の基本性質|じゅんぞうのきほんせいしつ"}
1. $F$ が層なら $f_{*}F$ は層。よって関手 $f_{*}:\mathbf{Sh}(X)\to\mathbf{Sh}(Y)$ が定まる。
2. 連続写像 $g:Y\to Z$ について $(g\circ f)_{*}=g_{*}\circ f_{*}$（等号）。
:::

::: proof
**Step 1（1）.** $V=\bigcup V_{i}$ が $Y$ の開被覆なら、$f^{-1}V=\bigcup f^{-1}V_{i}$ は $X$ の開被覆で、$f^{-1}(V_{i}\cap V_{j})=f^{-1}V_{i}\cap f^{-1}V_{j}$。よって $f_{*}F$ の $V$ 上の両立する族は、$F$ の $f^{-1}V$ 上の被覆 $\{f^{-1}V_{i}\}$ に関する両立する族そのもので、$F$ の層の条件から一意に貼り合わさる。
**Step 2（2）.** $(g\circ f)^{-1}W=f^{-1}(g^{-1}W)$ から、両辺は開集合 $W\subset Z$ に同じ集合 $F(f^{-1}g^{-1}W)$ を、同じ制限写像とともに対応させる。
:::

::: example 順像の例 {#cat:direct-image-examples}
1. **大域切断**：$Y=\{*\}$（1 点）への写像 $c$ について、$c_{*}F$ は集合 $F(X)$（1 点空間上の層は、$\emptyset$ 上の値が 1 点なので、1 つの集合と同じ）。
2. **摩天楼層**：1 点空間 $\{*\}$ から $X$ への写像 $i_{x}:*\mapsto x$ と集合 $A$ について、$(i_{x})_{*}A$ は $x\in U$ なら $A$、そうでなければ $A(\emptyset)=\{*\}$。これは \ref{cat:presheaf-examples.5} の摩天楼層 $x_{*}A$ である（記号の由来）。
3. **茎は保たれない**：1 の $c_{*}F$ の唯一の茎は $F(X)$ で、$F$ の茎たちとは一般に関係しない。たとえば $X=\mathbb{R}\setminus\{0\}$, $F=\underline{\mathbb{Z}}$ なら $F(X)=\mathbb{Z}^{2}$（連結成分が 2 つ）だが、$F$ の茎はすべて $\mathbb{Z}$。
:::

## 逆像 {#cat:sec-di-inverse}

::: definition 逆像 {#cat:inverse-image keywords="inverse image (pullback) of a sheaf f^{-1}G, presheaf inverse image colim over V containing f(U)" index="逆像（層）|ぎゃくぞうそう, 引き戻し（層）|ひきもどしそう"}
$Y$ 上の前層 $G$ について、$X$ の開集合 $U$ に対し、$f(U)\subset V$ となる開集合 $V\subset Y$ の族は包含の逆で有向（$V,V'$ がそうなら $V\cap V'$ もそう）なので、
$$
(f^{\mathrm{p}}G)(U)\defeq\operatorname*{colim}_{V\supset f(U)}G(V)
$$
が定まる。$U'\subset U$ なら $f(U')\subset f(U)$ なので、$V\supset f(U)$ の族は $V\supset f(U')$ の族に含まれ、余極限の間の写像（制限）が誘導される。こうして前層 $f^{\mathrm{p}}G$（**前層の逆像**）を得る。その層化 $f^{-1}G\defeq(f^{\mathrm{p}}G)^{+}$ を $G$ の $f$ による**逆像**という。$t\in G(V)$, $V\supset f(U)$ の $(f^{\mathrm{p}}G)(U)$ での類を $[t]_{U}$ と書く。
:::

::: theorem 逆像と順像の随伴 {#cat:inverse-direct-adjunction keywords="inverse image is left adjoint to direct image: Hom(f^{-1}G,F) = Hom(G,f_*F)" index="逆像と順像の随伴|ぎゃくぞうとじゅんぞうのずいはん"}
1. 前層 $G$（$Y$ 上）と前層 $F$（$X$ 上）について、自然な全単射 $\operatorname{Hom}(f^{\mathrm{p}}G,F)\cong\operatorname{Hom}(G,f_{*}F)$ がある。
2. 層 $G$, $F$ について、自然な全単射 $\operatorname{Hom}_{\mathbf{Sh}(X)}(f^{-1}G,F)\cong\operatorname{Hom}_{\mathbf{Sh}(Y)}(G,f_{*}F)$ がある。すなわち $f^{-1}\dashv f_{*}$。
3. 連続写像 $g:Y\to Z$ と $Z$ 上の層 $H$ について、$(g\circ f)^{-1}H\cong f^{-1}g^{-1}H$（自然同型）。
:::

::: proof
**Step 1（1：$\psi\mapsto\psi^{\flat}$）.** $\psi:G\to f_{*}F$ は、開集合 $V\subset Y$ ごとの写像 $\psi_{V}:G(V)\to F(f^{-1}V)$ で制限と両立するもの。$X$ の開集合 $U$ と $V\supset f(U)$ について $U\subset f^{-1}V$ なので、$G(V)\xrightarrow{\psi_{V}}F(f^{-1}V)\to F(U)$（制限）を考える。$V'\subset V$ のとき、$\psi$ の自然性から $\psi_{V}(t)|_{f^{-1}V'}=\psi_{V'}(t|_{V'})$ で、さらに $U$ に制限すると等しいので、これらは余極限の写像
$$
\psi^{\flat}_{U}:(f^{\mathrm{p}}G)(U)\to F(U),\qquad [t]_{U}\mapsto\psi_{V}(t)|_{U}
$$
を定める（\ref{cat:filtered-colimit-set}）。$U'\subset U$ での制限との両立は定義から明らか。

**Step 2（1：$\varphi\mapsto\varphi^{\sharp}$）.** $\varphi:f^{\mathrm{p}}G\to F$ について、$V\subset Y$ に対し $f(f^{-1}V)\subset V$ なので $t\in G(V)$ は類 $[t]_{f^{-1}V}$ をもつ。$\varphi^{\sharp}_{V}(t)\defeq\varphi_{f^{-1}V}([t]_{f^{-1}V})$ とおく。$V'\subset V$ なら $[t]_{f^{-1}V}$ の $f^{-1}V'$ への制限は $[t]_{f^{-1}V'}=[t|_{V'}]_{f^{-1}V'}$（$V'\supset f(f^{-1}V')$ で同じ類）なので、$\varphi^{\sharp}$ は前層の射 $G\to f_{*}F$。

**Step 3（1：互いに逆）.** $(\psi^{\flat})^{\sharp}_{V}(t)=\psi^{\flat}_{f^{-1}V}([t]_{f^{-1}V})=\psi_{V}(t)|_{f^{-1}V}=\psi_{V}(t)$。逆に、$[t]_{U}$（$t\in G(V)$, $V\supset f(U)$）は $[t]_{f^{-1}V}$ の $U$ への制限なので、$\varphi$ の自然性から
$$
\begin{aligned}
(\varphi^{\sharp})^{\flat}_{U}([t]_{U})&=\varphi^{\sharp}_{V}(t)|_{U}=\varphi_{f^{-1}V}([t]_{f^{-1}V})|_{U}\\
&=\varphi_{U}([t]_{f^{-1}V}|_{U})=\varphi_{U}([t]_{U}).
\end{aligned}
$$
$G$, $F$ についての自然性は、定義の式が制限と射の合成だけでできていることから従う。

**Step 4（2）.** $F$ が層なら、層化の普遍性（\ref{cat:sheafification-properties.2}）から $\operatorname{Hom}(f^{-1}G,F)=\operatorname{Hom}((f^{\mathrm{p}}G)^{+},F)\cong\operatorname{Hom}(f^{\mathrm{p}}G,F)$（$\eta$ との合成）。これと 1 を合わせる。

**Step 5（3）.** \ref{cat:direct-image-basic.2} から $(g\circ f)_{*}=g_{*}f_{*}$。2 により、左辺の右随伴は $(g\circ f)_{*}$、右辺 $f^{-1}g^{-1}$ は随伴の合成（\ref{cat:adjunction-composition}）から $g_{*}f_{*}$ の左随伴。左随伴の一意性（\ref{cat:adjoint-unique}）から自然同型。
:::

::: proposition 逆像の茎 {#cat:inverse-image-stalk keywords="stalk of the inverse image (f^{-1}G)_x = G_{f(x)}" index="逆像の茎|ぎゃくぞうのくき"}
$Y$ 上の前層 $G$ と $x\in X$ について、$t_{f(x)}\mapsto([t]_{f^{-1}V})_{x}$（$t\in G(V)$, $f(x)\in V$）は全単射 $G_{f(x)}\to(f^{\mathrm{p}}G)_{x}$ を定める。したがって $(f^{-1}G)_{x}\cong G_{f(x)}$。
:::

::: proof
**Step 1（well-defined）.** $t\in G(V)$, $t'\in G(V')$ が $f(x)$ で同じ芽をもつなら、$f(x)\in W\subset V\cap V'$ で $t|_{W}=t'|_{W}$。$f^{-1}W\ni x$ 上で $[t]_{f^{-1}V}|_{f^{-1}W}=[t|_{W}]_{f^{-1}W}=[t'|_{W}]_{f^{-1}W}$ なので、$x$ での芽が等しい。

**Step 2（全射）.** $(f^{\mathrm{p}}G)_{x}$ の元は、$x\in U$ と $[t]_{U}$（$t\in G(V)$, $V\supset f(U)$）の芽。$U\subset f^{-1}V$ で $[t]_{U}=[t]_{f^{-1}V}|_{U}$ なので、これは $t_{f(x)}$ の像（$f(x)\in f(U)\subset V$）。

**Step 3（単射）.** $t\in G(V)$, $t'\in G(V')$ の像の芽が等しいとする。芽の定義から、$x$ の開近傍 $U\subset f^{-1}V\cap f^{-1}V'$ で $(f^{\mathrm{p}}G)(U)$ の中で $[t]_{U}=[t']_{U}$。フィルター付き余極限の中で等しいので（\ref{cat:filtered-colimit-set}）、開集合 $W$ で $f(U)\subset W\subset V\cap V'$ かつ $t|_{W}=t'|_{W}$ となるものがある。$f(x)\in W$ なので $t_{f(x)}=t'_{f(x)}$。

**Step 4.** 層化は茎を保つ（\ref{cat:sheafification-properties.1}）ので $(f^{-1}G)_{x}\cong(f^{\mathrm{p}}G)_{x}\cong G_{f(x)}$。
:::

::: proposition エタール空間の引き戻し {#cat:inverse-image-etale keywords="inverse image corresponds to pullback of etale spaces X x_Y Et(G)" index="エタール空間の引き戻し|えたーるくうかんのひきもどし"}
局所同相 $p:E\to Y$ について、ファイバー積 $X\times_{Y}E\defeq\{(x,e) : f(x)=p(e)\}$（$X\times E$ の\term[部分空間]{top:subspace}）の第 1 射影 $q$ は局所同相である。$Y$ 上の層 $G$ について、$f^{-1}G\cong\Gamma(-,X\times_{Y}\operatorname{Et}(G))$。
:::

::: proof
**Step 1（$q$ は局所同相）.** $(x,e)\in X\times_{Y}E$ について、$e$ の開近傍 $V$ で $p|_{V}:V\to p(V)$ が同相（$p(V)$ は開）なものをとる。$N\defeq f^{-1}(p(V))$ は $x$ の開近傍で、$\widetilde{N}\defeq(N\times V)\cap(X\times_{Y}E)$ は $(x,e)$ の開近傍。$q|_{\widetilde{N}}:\widetilde{N}\to N$ は連続で、$x'\mapsto(x',(p|_{V})^{-1}(f(x')))$ が連続な逆写像（$(x',e')\in\widetilde{N}$ なら $e'\in V$, $p(e')=f(x')$ から $e'=(p|_{V})^{-1}(f(x'))$）。よって $q|_{\widetilde{N}}$ は開集合 $N$ への同相。

**Step 2（射の構成）.** $E=\operatorname{Et}(G)$, $H\defeq\Gamma(-,X\times_{Y}E)$ とおく。$H$ は層（\ref{cat:presheaf-examples.2}）。$t\in G(V)$, $V\supset f(U)$ について、$\hat t:V\to E$（\ref{cat:etale-space-properties.3}）は連続なので、$U\to X\times_{Y}E$, $x\mapsto(x,\hat t(f(x)))=(x,t_{f(x)})$ は $q$ の連続な切断。$V$ を小さくしても芽は変わらないので、これは $(f^{\mathrm{p}}G)(U)\to H(U)$ を定め、制限と両立する。層化の普遍性から層の射 $\theta:f^{-1}G\to H$ を得る。

**Step 3（茎で全単射）.** $H$ の $x$ での茎は、$\sigma_{x}\mapsto\sigma(x)$ によりファイバー $q^{-1}(x)=\{x\}\times G_{f(x)}$ と全単射（\ref{cat:sheaves-etale-equivalence} の証明の Step 2）。\ref{cat:inverse-image-stalk} の同一視 $G_{f(x)}\cong(f^{-1}G)_{x}$ と合わせると、$\theta_{x}$ は $t_{f(x)}\mapsto(x,t_{f(x)})$ で全単射。茎で全単射な層の射は同型（\ref{cat:stalkwise-criteria.2}）。
:::

::: example 逆像の例 {#cat:inverse-image-examples}
1. **開集合への制限**：開集合の包含 $j:U\to X$ について、$U$ の開集合 $W$ は $X$ でも開なので、$V\supset j(W)$ の族は最小元 $W$ をもち、$(j^{\mathrm{p}}G)(W)=G(W)$。これは層なので $j^{-1}G=G|_{U}$（$W\mapsto G(W)$, $W\subset U$）。
2. **茎**：$i_{x}:\{*\}\to X$ について、$i_{x}^{-1}G$ は（1 点空間上の層として）集合 $G_{x}$。$\{*\}$ の開集合 $\{*\}$ では余極限が茎の定義そのもの。
3. **定数層**：$c:X\to\{*\}$ と集合 $A$ について、$c^{-1}A$ は定数層 $\underline{A}$。$c^{\mathrm{p}}A$ は（$U\neq\emptyset$ で）定数前層 $A$ で、その層化は \ref{cat:sheafification-properties} の後の例の 1。随伴 $c^{-1}\dashv c_{*}$ は「$\underline{A}\to F$ の射 ＝ 写像 $A\to F(X)$」を表す。
4. **閉集合への制限と順像**：閉集合 $Z\subset X$ の包含 $i$ と $Z$ 上の層 $F$ について、$(i_{*}F)_{x}$ は $x\in Z$ なら $F_{x}$、$x\notin Z$ なら 1 点集合（$X\setminus Z$ が $x$ の近傍で、その逆像は $\emptyset$）。$x\in Z$ の場合：$Z$ の開集合は $V\cap Z$（$V$ は $X$ の開集合）の形なので、写像 $\operatorname*{colim}_{V\ni x}F(V\cap Z)\to F_{x}$ は全射で、$s,t\in F(V\cap Z)$ が $Z$ の開集合 $W\cap Z\ni x$ 上で一致すれば $V\cap W$ 上で一致するので単射。
:::

## 0 拡張 {#cat:sec-di-extension-by-zero}

この節では、値をアーベル群にとる前層・層（\ref{cat:page-presheaves-sheaves} の記法）を考え、射は各 $F(U)$ で準同型な自然変換とする。

::: lemma アーベル群の前層の層化 {#cat:abelian-sheafification keywords="sheafification of a presheaf of abelian groups is a sheaf of abelian groups" index="アーベル群の前層の層化|あーべるぐんのぜんそうのそうか"}
アーベル群の前層 $F$ について、$F^{+}(U)$ は点ごとの和 $(\sigma+\tau)(x)\defeq\sigma(x)+\tau(x)$（茎 $F_{x}$ の和）でアーベル群になり、$F^{+}$ はアーベル群の層、$\eta$ は準同型。アーベル群の層 $G$ への準同型 $\varphi:F\to G$ について、\ref{cat:sheafification-properties.2} の $\varphi^{+}$ も準同型。
:::

::: proof
**Step 1.** $\sigma,\tau\in F^{+}(U)$ と $x\in U$ について、\ref{cat:sheafification-properties} の証明の Step 3 から、$x$ の近傍 $W$ と $s,t\in F(W)$ で $\sigma|_{W}=\hat s$, $\tau|_{W}=\hat t$ となるものがある（二つの近傍の共通部分に制限する）。茎の和の定義から $W$ 上 $\sigma+\tau=\widehat{s+t}$ で、これは連続。$0$ と $-\sigma$ も同様。よって $F^{+}(U)$ は群で、制限は準同型、$\eta(s+t)=\hat s+\hat t$。

**Step 2.** $\varphi^{+}(\sigma)$ は、$\sigma|_{W_{i}}=\hat t_{i}$ のとき $\varphi(t_{i})$ を貼り合わせたもの。$\sigma,\tau$ について共通の被覆をとれば $\sigma+\tau$ には $t_{i}+t'_{i}$ が使え、$\varphi$ が準同型なので $\varphi^{+}(\sigma+\tau)$ と $\varphi^{+}(\sigma)+\varphi^{+}(\tau)$ は各 $W_{i}$ 上一致、$G$ の分離性から等しい。
:::

::: definition 0 拡張 {#cat:extension-by-zero keywords="extension by zero j_! F for an open embedding" index="0 拡張|ぜろかくちょう"}
開集合 $U\subset X$ の包含を $j$ とし、$U$ 上のアーベル群の層 $F$ について、$X$ 上の前層 $P$ を、$V\subset U$ なら $P(V)\defeq F(V)$、そうでなければ $P(V)\defeq0$ とし、制限は $V'\subset V\subset U$ なら $F$ の制限、それ以外は $0$ と定める（$V'\subset V$ で $V\subset U$ なら $V'\subset U$ なので、これで矛盾しない）。その層化 $j_{!}F\defeq P^{+}$ を $F$ の **0 拡張**という。
:::

::: theorem 0 拡張の性質 {#cat:extension-by-zero-properties keywords="stalks of extension by zero; j_! is left adjoint to restriction j^{-1}" index="0 拡張の性質|ぜろかくちょうのせいしつ"}
1. $(j_{!}F)_{x}\cong F_{x}$（$x\in U$）、$(j_{!}F)_{x}=0$（$x\notin U$）。
2. $X$ 上のアーベル群の層 $G$ について、自然な同型 $\operatorname{Hom}(j_{!}F,G)\cong\operatorname{Hom}(F,G|_{U})$。すなわち $j_{!}\dashv j^{-1}$。
3. $(j_{!}F)|_{U}\cong F$。
:::

::: proof
**Step 1（1）.** $x\in U$ なら、$U$ に含まれる $x$ の開近傍は、$x$ の開近傍の族の中で共終（任意の $V\ni x$ に対し $V\cap U\subset V$）なので、$P_{x}=\operatorname*{colim}_{x\in V\subset U}F(V)=F_{x}$。$x\notin U$ なら、$x$ のどの開近傍 $V$ も $U$ に含まれないので $P(V)=0$、$P_{x}=0$。層化は茎を保つ（\ref{cat:sheafification-properties.1}、和も茎の和なので群として）。

**Step 2（2）.** 準同型の自然変換 $\varphi:P\to G$ は、$V\subset U$ での準同型 $\varphi_{V}:F(V)\to G(V)$（制限と両立）と、それ以外の $V$ での $0$ からなる。後者との両立は自動的（$P(V)=0$ から $P(V')$ への制限は $0$ で、$0$ はどの準同型でも $0$ に移る）。よって $\operatorname{Hom}(P,G)\cong\operatorname{Hom}(F,G|_{U})$。\ref{cat:abelian-sheafification} により層化の普遍性が準同型のまま使えるので、$\operatorname{Hom}(j_{!}F,G)\cong\operatorname{Hom}(P,G)$。自然性は構成から。

**Step 3（3）.** $V\subset U$ では $P(V)=F(V)$ なので、$P|_{U}=F$ は層。$\eta:P\to P^{+}$ を $U$ に制限した $F\to(j_{!}F)|_{U}$ は、茎の上で 1 の同型なので同型（\ref{cat:stalkwise-criteria.2}）。
:::

::: remark 開集合と閉集合への分解
閉集合 $Z\defeq X\setminus U$ の包含を $i$ とし、$X$ 上のアーベル群の層 $G$ を考える。随伴の単位・余単位から射 $j_{!}(G|_{U})\to G\to i_{*}(i^{-1}G)$ が得られ、茎で見ると（単位・余単位を Step 2 の構成に従って元で追うと）、$x\in U$ では $G_{x}\xrightarrow{\mathrm{id}}G_{x}\to0$、$x\in Z$ では $0\to G_{x}\xrightarrow{\mathrm{id}}G_{x}$ となる（\ref{cat:extension-by-zero-properties.1}、\ref{cat:inverse-image-examples.4}、\ref{cat:inverse-image-stalk}）。どの茎でも短完全列 $0\to j_{!}(G|_{U})_{x}\to G_{x}\to(i_{*}i^{-1}G)_{x}\to0$ になる。これが層の短完全列であること（完全性が茎で判定できること）は \ref{cat:page-abelian-sheaves} で扱う。
:::

::: hypcheck
- 選択公理は使っていない。茎の元の代表の選択（\ref{cat:inverse-image-stalk} の Step 2 など）は、存在が言えている元を一つとって議論するだけで、選択関数は作っていない。\ref{cat:abelian-sheafification} の Step 2 の「共通の被覆」も、各点で存在する近傍をとり、得られる値が選び方によらないことを示している（\ref{cat:sheafification-properties} の Step 4 と同じ）。
- 連続性は、$f^{-1}V$ が開であること（順像・逆像の定義）と、エタール空間の引き戻しの局所同相性（Step 1 の $f^{-1}(p(V))$ が開）で使った。
- $j$ が**開**埋め込みであることは、$U$ の開集合が $X$ でも開であること（\ref{cat:inverse-image-examples.1}）と、0 拡張の茎の計算（$U$ に含まれる近傍が共終）で使った。閉埋め込みについては $i_{!}=i_{*}$ と見なせることが知られている（本サイト未収録）。
:::

::: supplement
**$f_{*}$ と $f^{-1}$ の完全性.** $f^{-1}$ は左随伴なので余極限を保ち、さらに茎が $G_{f(x)}$ で、茎をとる操作が有限の極限と交換するので有限の極限も保つ（完全）。$f_{*}$ は右随伴なので極限を保つが、余極限は一般に保たない。アーベル群の層では $f_{*}$ は左完全だが右完全でなく、その右導来関手 $R^{q}f_{*}$（**高次順像**）が層コホモロジーの相対版になる。これらは知られている（本サイト未収録）。$f^{-1}$ が有限の極限を保つことは、$(f^{-1}\dashv f_{*})$ がトポスの間の**幾何学的射**であることを意味し、トポスの点（\ref{cat:page-sheaf-topos}）は $\{*\}$ からの幾何学的射、すなわち茎をとる関手 $G\mapsto G_{x}$ の一般化である。

**$f_{!}$ と $f^{!}$.** 一般の連続写像（局所コンパクト空間の間）について、台がコンパクトな順像 $f_{!}$ と、導来圏でのその右随伴 $f^{!}$ がある（ヴェルディエ双対性）。0 拡張は開埋め込みの場合の $f_{!}$ である（本サイト未収録）。
:::

## 問題 {#cat:sec-di-problems}

::: problem {#cat:prob-di-extension-zero-global}
$j:U=(0,\infty)\to\mathbb{R}$ を包含、$F=\underline{\mathbb{Z}}$（$U$ 上の定数層）とする。$(j_{!}F)(\mathbb{R})=0$、$(j_{*}F)(\mathbb{R})=\mathbb{Z}$ を示せ。
:::

::: solution
$j_{*}F$：$(j_{*}F)(\mathbb{R})=F(j^{-1}\mathbb{R})=F(U)=\mathbb{Z}$（$U$ は連結。\ref{cat:presheaf-examples.4}）。

$j_{!}F$：$\sigma\in(j_{!}F)(\mathbb{R})$ は、$\sigma(x)\in P_{x}$（$x>0$ で $\mathbb{Z}$、$x\le0$ で $0$）で、各点の近傍で $\hat t$（$t\in P(V)$）の形に書ける写像。$0$ のどの開近傍 $V$ も $U$ に含まれないので $P(V)=0$、よってある $\varepsilon>0$ について $(-\varepsilon,\varepsilon)$ 上 $\sigma=0$。$U$ 上では $\sigma$ は局所的に $F$ の切断の芽、すなわち局所定数な $\mathbb{Z}$ 値関数で、$U$ は連結なので定数、$(0,\varepsilon)$ で $0$ だから $U$ 上 $0$。$x<0$ では $\sigma(x)\in P_{x}=0$。よって $\sigma=0$。

$j_{!}F$ の茎は $U$ 上で $\mathbb{Z}$ なのに大域切断は $0$：$U$ 上の切断で、台（$0$ でない点の集合）の閉包が $\mathbb{R}$ の中で $U$ に含まれるものだけが $j_{!}F$ の切断に延びる。
:::
