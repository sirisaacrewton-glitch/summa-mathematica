# 層化とエタール空間 {#cat:page-sheafification keywords="etale space of a presheaf, espace etale, local homeomorphism, sheafification, universal property, left adjoint to the inclusion of sheaves into presheaves, sheaves are etale spaces"}

前層は一般に層でないが、「芽を貼り合わせて」最も近い層に直すことができる（**層化** $F^{+}$）。そのために、前層 $F$ のすべての茎を並べた空間 $\operatorname{Et}(F)=\bigsqcup_{x}F_{x}$ に位相を入れた**エタール空間**を作り、その連続な切断の層を $F^{+}$ とする。層化は、層から前層への包含関手の左随伴で、茎を変えない。逆に、層はそのエタール空間の切断の層として復元でき、層の圏は「$X$ 上の局所同相写像」の圏と同値になる。層を「$X$ の上に広がった空間」として見ることができる。


## 記法と定義の確認 {#cat:sec-sf-notation}

::: notation
- 前層・層・茎・芽・層の射の茎による判定は \ref{cat:sheaf-space}, \ref{cat:stalk}, \ref{cat:germs-determine-sections}, \ref{cat:stalkwise-criteria}。連続写像の切断の前層が層であることは \ref{cat:presheaf-examples.2}。
- 開基は \ref{top:base}, \ref{top:base-criterion}。連続写像 $p:E\to X$ が**局所同相**であるとは、各 $e\in E$ に開近傍 $V$ があり、$p(V)$ が開で $p|_{V}:V\to p(V)$ が同相となることをいう。
- 普遍射からの左随伴の構成は \ref{cat:adjunction-from-universal}。
- **選択公理**：使わない。
:::

## エタール空間 {#cat:sec-sf-etale}

::: definition エタール空間 {#cat:etale-space keywords="etale space of a presheaf, espace etale" index="エタール空間|えたーるくうかん"}
前層 $F$ について、集合 $\operatorname{Et}(F)\defeq\bigsqcup_{x\in X}F_{x}$ と、射影 $p:\operatorname{Et}(F)\to X$（$F_{x}$ を $x$ に送る）を考える。開集合 $U$ と $s\in F(U)$ について $[U,s]\defeq\{s_{x} : x\in U\}$ とおき、これらを開基とする位相を入れたものを $F$ の**エタール空間**という。
:::

::: proposition エタール空間の性質 {#cat:etale-space-properties keywords="the sets [U,s] form a basis; p is a local homeomorphism; x -> s_x is a continuous section" index="局所同相|きょくしょどうそう"}
1. $[U,s]$ の全体は開基をなす。
2. $p$ は局所同相で、$p|_{[U,s]}:[U,s]\to U$ は同相。
3. $s\in F(U)$ について、$\hat s:U\to\operatorname{Et}(F)$, $x\mapsto s_{x}$ は $p$ の連続な切断。
:::

::: proof
**Step 1（1）.** $\operatorname{Et}(F)$ は $[U,s]$ たちで覆われる（各芽はある $(U,s)$ の類）。$\sigma\in[U,s]\cap[V,t]$, $\sigma\in F_{x}$ なら $s_{x}=t_{x}=\sigma$ で、$x\in W\subset U\cap V$ で $s|_{W}=t|_{W}$ となる開集合がある。すると $\sigma\in[W,s|_{W}]\subset[U,s]\cap[V,t]$（$y\in W$ で $s_{y}=(s|_{W})_{y}=t_{y}$）。開基の判定条件（\ref{top:base-criterion}）。

**Step 2（3）.** $[V,t]$ の $\hat s$ による逆像は $W\defeq\{x\in U\cap V : s_{x}=t_{x}\}$。$x\in W$ なら $s,t$ は $x$ の近傍 $W'$ 上で一致し、$W'$ の点でも芽が一致するので $W'\subset W$。よって $W$ は開で、$\hat s$ は連続。$p\circ\hat s=\mathrm{id}_{U}$。

**Step 3（2）.** $p$ は連続：開集合 $V\subset X$ の逆像は $\bigcup_{(U,s)}[U\cap V,s|_{U\cap V}]$。$p|_{[U,s]}$ は $U$ への全単射で（各 $x\in U$ でちょうど $s_{x}$）、連続、逆写像は $\hat s$ で連続（Step 2）。よって同相で、$[U,s]$ は開なので局所同相。
:::

## 層化 {#cat:sec-sf-sheafification}

::: definition 層化 {#cat:sheafification keywords="sheafification F^+, the sheaf of continuous sections of the etale space" index="層化|そうか, 付随する層|ふずいするそう"}
前層 $F$ の**層化** $F^{+}$ を、エタール空間の連続な切断の層 $F^{+}(U)\defeq\Gamma(U,\operatorname{Et}(F))$ とし、$\eta_{U}:F(U)\to F^{+}(U)$, $s\mapsto\hat s$ と定める（\ref{cat:etale-space-properties.3}）。$\eta$ は前層の射。具体的には、$F^{+}(U)$ は、$\sigma(x)\in F_{x}$ をみたす写像 $\sigma$ で、各点の近傍で $x\mapsto t_{x}$（$t\in F(V)$）の形に書けるもの全体である。
:::

::: theorem 層化の性質 {#cat:sheafification-properties keywords="sheafification preserves stalks, has the universal property, is left adjoint to the inclusion; eta is an isomorphism for sheaves" index="層化の普遍性|そうかのふへんせい"}
前層 $F$ について、
1. $F^{+}$ は層で、各 $x$ で $\eta_{x}:F_{x}\to F^{+}_{x}$ は全単射。
2. （普遍性）層 $G$ への前層の射 $\varphi:F\to G$ に対し、$\varphi=\varphi^{+}\circ\eta$ となる層の射 $\varphi^{+}:F^{+}\to G$ がただ一つある。
3. $F$ が層なら $\eta:F\to F^{+}$ は同型。
4. $F\mapsto F^{+}$ は関手 $\widehat{\mathcal{O}(X)}\to\mathbf{Sh}(X)$ で、包含 $\mathbf{Sh}(X)\to\widehat{\mathcal{O}(X)}$ の左随伴。
:::

::: proof
**Step 1（1：層）.** 連続写像 $p$ の連続な切断の前層なので層（\ref{cat:presheaf-examples.2}）。

**Step 2（1：茎の単射）.** $\eta(s)_{x}=\eta(t)_{x}$（$s\in F(U)$, $t\in F(V)$）なら、$x$ の近傍上で $\hat s=\hat t$、特に $s_{x}=\hat s(x)=\hat t(x)=t_{x}$。

**Step 3（1：茎の全射）.** $\sigma\in F^{+}(U)$, $x\in U$ について、$\sigma(x)=t_{x}$（$t\in F(V)$）と書く。$\sigma$ は連続なので $\sigma^{-1}([V,t])$ は $x$ の開近傍 $W$ で、$W$ 上 $\sigma(y)\in[V,t]\cap F_{y}=\{t_{y}\}$、すなわち $\sigma|_{W}=\hat t|_{W}$。よって $\sigma_{x}=\eta(t)_{x}$。

**Step 4（2：存在）.** $\sigma\in F^{+}(U)$ について、Step 3 から開被覆 $U=\bigcup W_{i}$ と $t_{i}\in F(W_{i})$ で $\sigma|_{W_{i}}=\hat t_{i}$ となるものがとれる。$W_{ij}$ 上で $\hat t_{i}=\hat t_{j}$ なので、各 $x\in W_{ij}$ で $(t_{i})_{x}=(t_{j})_{x}$、したがって $\varphi(t_{i})_{x}=\varphi(t_{j})_{x}$。$G$ は分離的なので $\varphi(t_{i})|_{W_{ij}}=\varphi(t_{j})|_{W_{ij}}$（\ref{cat:germs-determine-sections}）、貼り合わせて $\varphi^{+}(\sigma)\in G(U)$ を得る。これは被覆と $t_{i}$ の選び方によらない（二つの選び方の共通の細分で、同じ芽から同じ値になる）。制限と両立し、$\sigma=\hat s$ なら被覆 $\{U\}$ と $t=s$ がとれて $\varphi^{+}(\hat s)=\varphi(s)$。

**Step 5（2：一意性）.** $\psi\circ\eta=\varphi$ なら、上の $\sigma$ について $\psi(\sigma)|_{W_{i}}=\psi(\hat t_{i})=\varphi(t_{i})$ で、$G$ の分離性から $\psi(\sigma)=\varphi^{+}(\sigma)$。

**Step 6（3）.** $\eta$ は層の射で、1 から茎の上で全単射。\ref{cat:stalkwise-criteria.2} から同型。

**Step 7（4）.** 2 は、$\eta_{F}:F\to F^{+}$ が $F$ から包含関手への普遍射であることを述べている。普遍射の族から左随伴が得られる（\ref{cat:adjunction-from-universal}）。
:::

::: example
1. 定数前層 $A$ の層化は定数層 $\underline{A}$（局所定数関数の層。\ref{cat:presheaf-examples.4}）：$F_{x}=A$ で、エタール空間は $X\times A$（$A$ は離散）、その連続な切断は局所定数関数。
2. 層の射 $\varphi:F\to G$ の像の前層 $U\mapsto\varphi(F(U))$ は一般に層でなく（\ref{cat:page-presheaves-sheaves} の 2 乗写像の例では $z$ が局所的には像に入るが大域的には入らない）、その層化が**像層**である。
:::

## 層とエタール空間の同値 {#cat:sec-sf-equivalence}

::: theorem 層と局所同相 {#cat:sheaves-etale-equivalence keywords="the category of sheaves on X is equivalent to the category of local homeomorphisms over X" index="層と局所同相の同値|そうときょくしょどうそうのどうち"}
$X$ 上の局所同相 $p:E\to X$ の圏（射は $X$ 上の連続写像）を $\mathbf{Et}/X$ と書く。$F\mapsto\operatorname{Et}(F)$ と $E\mapsto\Gamma(-,E)$ は、$\mathbf{Sh}(X)$ と $\mathbf{Et}/X$ の圏同値を与える。
:::

::: proof
**Step 1（層 → 局所同相 → 層）.** 層 $F$ について $\Gamma(-,\operatorname{Et}(F))=F^{+}\cong F$（\ref{cat:sheafification-properties.3}）。

**Step 2（局所同相 → 層 → 局所同相）.** 局所同相 $p:E\to X$ と $G\defeq\Gamma(-,E)$ について、$\Theta:\operatorname{Et}(G)\to E$, $s_{x}\mapsto s(x)$ を考える。well-defined：同じ芽の代表は $x$ の近傍で一致する。全射：$e\in E$ の近傍 $V$ で $p|_{V}$ が同相なら、$(p|_{V})^{-1}$ は $e$ を通る切断。単射：$s(x)=t(x)$ なら、$s(x)$ の近傍 $V$ で $p|_{V}$ が同相なものをとると、$x$ の近傍で $s,t$ はどちらも $V$ に値をとり、$p\circ s=p\circ t=\mathrm{id}$ から $s=t$、すなわち芽が等しい。同相：基本開集合 $[U,s]$ は $s(U)$（開集合。$p$ は局所同相で $s$ はその局所的な逆）に移り、逆も同様。$X$ 上の写像であることは定義から。

**Step 3（射と自然性）.** 層の射 $\varphi$ は茎の写像 $\varphi_{x}$ を通して $\operatorname{Et}(F)\to\operatorname{Et}(G)$ を与え（$[U,s]$ を $[U,\varphi(s)]$ に移すので連続）、局所同相の射 $f:E\to E'$ は切断の合成 $s\mapsto f\circ s$ を与える。Step 1・2 の同型はこれらと可換（定義に従って元を追う）。
:::

::: supplement
**層化の別の構成.** 前層 $F$ に対し、$F^{\dagger}(U)\defeq\operatorname*{colim}_{\mathcal{U}}\{\text{被覆 }\mathcal{U}\text{ 上の両立する族}\}/\sim$（被覆の細分についての余極限）とすると、$F^{\dagger}$ は分離的になり、もう一度施した $F^{\dagger\dagger}$ が層化になる。この「+ 構成」はエタール空間を使わないので、一般のサイト上の層（\ref{cat:page-sites}）にもそのまま一般化される。

**有限の極限の保存.** 層化は有限の極限を保つ（左完全）ことが知られている。茎をとる操作がフィルター付き余極限で、それが有限の極限と交換すること（集合の場合）から従う（本サイト未収録の確認）。この性質が、層の圏がトポスであること（\ref{cat:page-sheaf-topos}）やアーベル群の層の圏がアーベル圏であること（\tref{cat:page-abelian-sheaves}）の鍵になる。
:::

## 問題 {#cat:sec-sf-problems}

::: problem {#cat:prob-sf-skyscraper-etale}
$X=\mathbb{R}$, $x=0$ の摩天楼層 $x_{*}A$（$A$ は 2 元以上）のエタール空間を記述し、それがハウスドルフでないことを示せ。
:::

::: solution
茎は $0$ で $A$、それ以外で 1 点 $\{*\}$。エタール空間は $\{(y,*) : y\neq0\}\sqcup\{(0,a) : a\in A\}$ で、$a\in A$ について $U\ni0$ 上の切断 $a$ の芽の集合 $[U,a]=\{(0,a)\}\cup\{(y,*) : y\in U\setminus\{0\}\}$ が $(0,a)$ の基本近傍。$a\neq b$ について $(0,a),(0,b)$ のどの近傍も $(y,*)$（$y$ は $0$ に近い）を共有するので、二点を分離できない。局所同相の全空間は一般にハウスドルフとは限らない。
:::
