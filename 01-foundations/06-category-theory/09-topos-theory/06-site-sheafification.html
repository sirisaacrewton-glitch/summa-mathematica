# サイト上の層化とグロタンディーク・トポス {#cat:page-site-sheafification keywords="plus construction on a site, sheafification on a site, associated sheaf functor is left exact left adjoint, closed sieves, subobject classifier of sheaves on a site, Grothendieck topos"}

一般のサイト $(\mathbf{C},J)$ には点がないので、空間のときのようにエタール空間を使って層化することはできない。代わりに、被覆ふるい上の両立する族を「被覆を細かくする」方向に余極限をとる **+ 構成** $P\mapsto P^{+}$ を使う。これを 2 回施した $P^{++}$ が層化で、包含 $\mathbf{Sh}(\mathbf{C},J)\to\widehat{\mathbf{C}}$ の左随伴であり、有限の極限を保つ。さらに、**閉じたふるい**の前層 $\Omega_{J}$ が層の部分対象分類子になることを示し、$\mathbf{Sh}(\mathbf{C},J)$ がトポスであることを結論する（\ref{cat:page-sites} で残した部分）。

> 代表元の選択を避けるため、証明の一部は通常の書き方と変えてある（hypcheck 参照）。

## 記法と定義の確認 {#cat:sec-ssf-notation}

::: notation
- サイト、被覆ふるい、両立する族、貼り合わせ、$J$ 層は \ref{cat:grothendieck-topology}, \ref{cat:site-sheaf}。被覆ふるいは上に閉じ、共通部分で閉じる（\ref{cat:covering-sieve-basic}）。両立する族は射 $S\to P$ と同じもの（\ref{cat:site-sheaf-yoneda}）。$S$ 上の両立する族の集合を $\operatorname{Match}(S,P)$ と書く。
- $\mathbf{Sh}(\mathbf{C},J)$ は極限と冪対象で閉じる（\ref{cat:site-sheaves-limits-exponentials}）。
- ふるいの引き戻し $f^{*}S$ と $f\in S\iff f^{*}S=t_{d}$ は \ref{cat:sieve-basic}。前層のモノ射は成分ごとに単射（\ref{cat:presheaf-mono}）。トポスの定義は \ref{cat:elementary-topos}。
- 集合のフィルター付き余極限の記述と、有限の極限との交換は \ref{cat:filtered-colimit-set}, \ref{cat:filtered-finite-interchange}。普遍射からの左随伴は \ref{cat:adjunction-from-universal}。
- **選択公理**：使わない。
:::

## + 構成 {#cat:sec-ssf-plus}

::: definition + 構成 {#cat:plus-construction keywords="plus construction P^+ as colimit over covering sieves of matching families" index="+ 構成|ぷらすこうせい"}
前層 $P$ と対象 $c$ について、$J(c)$ を逆包含で順序づけると有向（$S,S'\in J(c)$ なら $S\cap S'\in J(c)$）。$S'\subset S$ のとき族を制限する写像 $\operatorname{Match}(S,P)\to\operatorname{Match}(S',P)$ について、
$$
P^{+}(c)\defeq\operatorname*{colim}_{S\in J(c)}\operatorname{Match}(S,P)
$$
とおく。族 $x=(x_{g})_{g\in S}$ の類を $[x]$ と書く。\ref{cat:filtered-colimit-set} から、$x\in\operatorname{Match}(S,P)$, $x'\in\operatorname{Match}(S',P)$ について、$[x]=[x']$ は「被覆ふるい $T\subset S\cap S'$ があって $T$ 上で $x_{g}=x'_{g}$」と同値。

$f:d\to c$ について、$f^{*}x\defeq(x_{f\circ h})_{h\in f^{*}S}\in\operatorname{Match}(f^{*}S,P)$ とし、$[x]\cdot f\defeq[f^{*}x]$ と定める。$\eta_{c}:P(c)\to P^{+}(c)$ を $x\mapsto[(x\cdot g)_{g\in t_{c}}]$ で定める。
:::

::: lemma + 構成の基本性質 {#cat:plus-basic keywords="P^+ is a presheaf, eta is natural, representatives restrict to eta" index="+ 構成の基本性質|ぷらすこうせいのきほんせいしつ"}
1. $P^{+}$ は前層、$\eta:P\to P^{+}$ は前層の射、$P\mapsto P^{+}$ は関手。
2. $x\in\operatorname{Match}(S,P)$ と $g\in S$（$g:e\to c$）について $[x]\cdot g=\eta_{e}(x_{g})$。
3. $\eta_{c}(y)=\eta_{c}(y')$ $\iff$ ある $T\in J(c)$ のすべての $g\in T$ で $y\cdot g=y'\cdot g$。
:::

::: proof
**Step 1（1）.** $f^{*}x$ は両立する族（$x_{fh}\cdot k=x_{fhk}$）で、$f^{*}S\in J(d)$（公理 2）。$x$ と $x'$ が $T$ 上で一致すれば $f^{*}x$ と $f^{*}x'$ は $f^{*}T\in J(d)$ 上で一致するので、$[x]\cdot f$ は代表のとり方によらない。$(f\circ f')^{*}x=f'^{*}(f^{*}x)$ と $1^{*}x=x$ から前層。$\eta$ の自然性：$\eta(y)\cdot f=[(y\cdot fh)_{h}]=\eta(y\cdot f)$。前層の射 $\varphi:P\to Q$ は族を成分ごとに写して $\varphi^{+}:P^{+}\to Q^{+}$ を与え、$\varphi^{+}\eta_{P}=\eta_{Q}\varphi$。

**Step 2（2）.** $g\in S$ なので $g^{*}S=t_{e}$（\ref{cat:sieve-basic.3}）で、$g^{*}x=(x_{gh})_{h}=(x_{g}\cdot h)_{h}$。これは $\eta_{e}(x_{g})$ の代表そのもの。

**Step 3（3）.** 定義の後の注意で $S=S'=t_{c}$ とした場合。
:::

::: lemma + 構成と分離性 {#cat:plus-separated keywords="P^+ is separated; P separated iff eta injective; P separated implies P^+ sheaf; P sheaf implies eta iso" index="分離前層（サイト）|ぶんりぜんそうさいと"}
前層 $P$ が**分離的**であるとは、被覆ふるい上の両立する族の貼り合わせが高々一つであることをいう。
1. $P$ が分離的 $\iff$ $\eta$ が単射。
2. $P^{+}$ はつねに分離的。
3. $P$ が分離的なら $P^{+}$ は層。
4. $P$ が層なら $\eta:P\to P^{+}$ は同型。
:::

::: proof
**Step 1（1）.** \ref{cat:plus-basic.3} から、$\eta(y)=\eta(y')$ は「$y$, $y'$ がともにある被覆ふるい上の同じ族の貼り合わせ」と同値。分離的ならそのとき $y=y'$、逆に $\eta$ が単射なら貼り合わせは一つ。

**Step 2（2）.** $\xi=[x]$, $\xi'=[x']\in P^{+}(c)$ を、共通部分に制限して同じ $S\in J(c)$ 上の族で表しておく。$R\in J(c)$ のすべての $f\in R$ で $\xi\cdot f=\xi'\cdot f$ とする。
$$
T\defeq\{h\in S : x_{h}=x'_{h}\}
$$
はふるい（$x_{hk}=x_{h}\cdot k$）。$f\in R$（$f:d\to c$）について、$[f^{*}x]=[f^{*}x']$ なので、ある $T_{f}\in J(d)$, $T_{f}\subset f^{*}S$ の上で $x_{fh}=x'_{fh}$、すなわち $T_{f}\subset f^{*}T$。被覆ふるいは上に閉じるので $f^{*}T\in J(d)$。公理 3 から $T\in J(c)$ で、$x$, $x'$ は $T$ 上で一致するから $\xi=\xi'$。（$T_{f}$ は存在を使うだけで、選ばない。）

**Step 3（3：族の構成）.** $P$ は分離的なので $\eta$ は単射（1）。$R\in J(c)$ 上の $P^{+}$ の両立する族 $(\xi_{f})_{f\in R}$ をとり、
$$
T\defeq\{h\in R : \xi_{h}\in\operatorname{im}\eta\},\qquad z_{h}\defeq\eta^{-1}(\xi_{h})\quad(h\in T)
$$
とおく。$T$ はふるい（$\xi_{hk}=\xi_{h}\cdot k=\eta(z_{h})\cdot k=\eta(z_{h}\cdot k)$）で、同じ式と $\eta$ の単射性から $z_{hk}=z_{h}\cdot k$、すなわち $z\in\operatorname{Match}(T,P)$。

**Step 4（3：$T$ は被覆）.** $f\in R$（$f:d\to c$）について、$\xi_{f}=[y]$（$y\in\operatorname{Match}(S_{f},P)$）と表すと、$g\in S_{f}$ について $\xi_{fg}=\xi_{f}\cdot g=\eta(y_{g})$（\ref{cat:plus-basic.2}）なので $fg\in T$。よって $S_{f}\subset f^{*}T$ で $f^{*}T\in J(d)$。公理 3 から $T\in J(c)$。

**Step 5（3：貼り合わせ）.** $\xi\defeq[z]\in P^{+}(c)$ とする。$f\in R$ について、$g\in f^{*}T$ なら $fg\in T$ で、\ref{cat:plus-basic.2} から $(\xi\cdot f)\cdot g=[z]\cdot(fg)=\eta(z_{fg})=\xi_{fg}=\xi_{f}\cdot g$。$\xi\cdot f$ と $\xi_{f}$ は被覆ふるい $f^{*}T$ 上で一致するので、2（$P^{+}$ は分離的）から $\xi\cdot f=\xi_{f}$。一意性も 2 から。

**Step 6（4）.** $P$ は分離的なので $\eta$ は単射。$[x]$（$x\in\operatorname{Match}(S,P)$）について、貼り合わせ $y\in P(c)$ をとると、$x$ と $(y\cdot g)_{g}$ は $S$ 上で一致するので $[x]=\eta(y)$。よって全射。
:::

## 層化 {#cat:sec-ssf-sheafification}

::: theorem サイト上の層化 {#cat:site-sheafification keywords="a = (-)^{++} is left adjoint to the inclusion of sheaves and preserves finite limits" index="層化（サイト）|そうかさいと, 付随する層関手|ふずいするそうかんしゅ"}
$\mathbf{a}(P)\defeq P^{++}$, $\eta^{2}\defeq\eta_{P^{+}}\circ\eta_{P}:P\to\mathbf{a}(P)$ とおく。
1. $\mathbf{a}(P)$ は層で、$J$ 層 $Q$ への任意の射 $\varphi:P\to Q$ は $\varphi=\psi\circ\eta^{2}$ となる $\psi:\mathbf{a}(P)\to Q$ をただ一つもつ。したがって $\mathbf{a}$ は包含 $\mathbf{Sh}(\mathbf{C},J)\to\widehat{\mathbf{C}}$ の左随伴。
2. $(-)^{+}$ と $\mathbf{a}$ は有限の極限を保つ。
3. $\mathbf{Sh}(\mathbf{C},J)$ は余完備で、余極限は前層の余極限の層化。
:::

::: proof
**Step 1（層）.** \ref{cat:plus-separated.2} で $P^{+}$ は分離的、3 で $P^{++}$ は層。

**Step 2（$J$ 層への射は $\eta$ との合成で決まる）.** 前層 $R$ と $J$ 層 $Q$ と $\psi,\psi':R^{+}\to Q$ について、$\psi\eta_{R}=\psi'\eta_{R}$ なら $\psi=\psi'$：$\xi=[x]$（$x\in\operatorname{Match}(S,R)$）と $g\in S$ について $\psi(\xi)\cdot g=\psi(\xi\cdot g)=\psi(\eta(x_{g}))=\psi'(\xi)\cdot g$（\ref{cat:plus-basic.2}）で、$Q$ は分離的なので $\psi(\xi)=\psi'(\xi)$。

**Step 3（存在）.** $\varphi^{++}:P^{++}\to Q^{++}$ について $\varphi^{++}\eta^{2}_{P}=\eta^{2}_{Q}\varphi$（自然性）。$Q$ は層なので $\eta_{Q}$, $\eta_{Q^{+}}$ は同型（\ref{cat:plus-separated.4}。$Q^{+}\cong Q$ も層）。$\psi\defeq(\eta^{2}_{Q})^{-1}\varphi^{++}$ が求めるもの。

**Step 4（一意性）.** $\psi\eta_{P^{+}}\eta_{P}=\psi'\eta_{P^{+}}\eta_{P}$ なら、Step 2 を $R=P$ に使って $\psi\eta_{P^{+}}=\psi'\eta_{P^{+}}$、さらに $R=P^{+}$ に使って $\psi=\psi'$。左随伴は \ref{cat:adjunction-from-universal} から。

**Step 5（2）.** $\operatorname{Match}(S,-)=\widehat{\mathbf{C}}(S,-)$ は極限を保ち、前層の極限は各点ごと、$P^{+}(c)$ は有向集合 $J(c)$ 上のフィルター付き余極限なので、\ref{cat:filtered-finite-interchange} から $(-)^{+}$ は有限の極限を保つ（各 $c$ で、有限の極限と余極限を交換）。$\mathbf{a}$ は 2 回の合成。層の有限の極限は前層の極限（\ref{cat:site-sheaves-limits-exponentials}）なので、$\mathbf{a}$ は $\widehat{\mathbf{C}}\to\mathbf{Sh}(\mathbf{C},J)$ として有限の極限を保つ。

**Step 6（3）.** 層の図式 $D$ の前層での余極限 $L$ について、$\mathbf{a}L$ は、層 $Q$ について $\mathbf{Sh}(\mathbf{a}L,Q)\cong\widehat{\mathbf{C}}(L,Q)\cong\lim\widehat{\mathbf{C}}(D_{j},Q)$ をみたすので、$\mathbf{Sh}(\mathbf{C},J)$ での余極限。
:::

::: example
空間 $(\mathcal{O}(X),J_{X})$ では、$\mathbf{a}$ は \ref{cat:sheafification} の層化 $F\mapsto F^{+}$ と自然同型（どちらも包含の左随伴なので、\ref{cat:adjoint-unique}）。エタール空間による構成は一度で層になるが、+ 構成は一般に 2 回要る（1 回目で分離的になり、2 回目で層になる）。
:::

## 部分対象分類子 {#cat:sec-ssf-omega}

::: definition 閉じたふるい {#cat:closed-sieve keywords="J-closed sieve, presheaf of closed sieves Omega_J" index="閉じたふるい|とじたふるい"}
$c$ 上のふるい $S$ が **$J$ 閉**であるとは、$f:d\to c$ について $f^{*}S\in J(d)$ なら $f\in S$ となることをいう。$\Omega_{J}(c)\defeq\{c\text{ 上の }J\text{ 閉ふるい}\}$, $\Omega_{J}(f)\defeq f^{*}$, $\mathrm{true}_{c}\defeq t_{c}$。
:::

::: theorem 層のトポス {#cat:site-topos keywords="Omega_J is a sheaf and the subobject classifier of Sh(C,J); sheaves on a site form a topos" index="グロタンディーク・トポス|ぐろたんでぃーくとぽす, 層のトポス（サイト）|そうのとぽすさいと"}
1. $\Omega_{J}$ は前層で、$\mathrm{true}:1\to\Omega_{J}$ は前層の射。
2. $\Omega_{J}$ は $J$ 層。
3. $(\Omega_{J},\mathrm{true})$ は $\mathbf{Sh}(\mathbf{C},J)$ の部分対象分類子。部分層 $A\subset P$ の特性射は $\chi(x)\defeq\{f : x\cdot f\in A\}$。
4. $\mathbf{Sh}(\mathbf{C},J)$ はトポス。
:::

::: proof
**Step 1（1）.** $S$ が閉、$f:d\to c$ とする。$g:e\to d$ で $g^{*}(f^{*}S)=(fg)^{*}S\in J(e)$ なら、$S$ が閉なので $fg\in S$、すなわち $g\in f^{*}S$。よって $f^{*}S$ は閉。$t_{c}$ は閉で $f^{*}t_{c}=t_{d}$。

**Step 2（2：分離性）.** 閉ふるい $S,S'$ が $R\in J(c)$ のすべての $f\in R$ で $f^{*}S=f^{*}S'$ をみたすとする。$g\in S$（$g:d\to c$）について、$h\in g^{*}R$ なら $gh\in R$ かつ $gh\in S$ なので $(gh)^{*}S'=(gh)^{*}S=t$、すなわち $gh\in S'$。よって $g^{*}R\subset g^{*}S'$ で、$g^{*}R\in J(d)$ から $g^{*}S'\in J(d)$、$S'$ が閉なので $g\in S'$。対称性から $S=S'$。

**Step 3（2：貼り合わせ）.** $R\in J(c)$ 上の両立する族 $(S_{f})_{f\in R}$（$S_{f}\in\Omega_{J}(d)$, $g^{*}S_{f}=S_{fg}$）について、$h:e\to c$ ごとに
$$
U_{h}\defeq\{k : hk\in R\text{ かつ }S_{hk}=t\},\qquad S\defeq\{h : U_{h}\in J(e)\}
$$
とおく。$U_{hl}=l^{*}U_{h}$ なので $S$ はふるい。
- $f\in R$ について $f^{*}S=S_{f}$：$hk\in R$ は自動的に成り立ち、$S_{fhk}=(hk)^{*}S_{f}=t\iff hk\in S_{f}$ なので $U_{fh}=h^{*}S_{f}$。よって $h\in f^{*}S\iff h^{*}S_{f}\in J\iff h\in S_{f}$（$S_{f}$ は閉、逆は $h\in S_{f}$ なら $h^{*}S_{f}=t$）。
- $S$ は閉：$g^{*}S\in J(e)$ とする。$l\in g^{*}S$ なら $U_{gl}=l^{*}U_{g}\in J$。公理 3 から $U_{g}\in J(e)$、すなわち $g\in S$。

よって $S\in\Omega_{J}(c)$ が貼り合わせ。一意性は Step 2。

**Step 4（3：特性射は閉ふるい）.** $P$ を層、$A\subset P$ を部分層とする。$\chi(x)$ はふるいで、閉：$g^{*}\chi(x)=\{h : x\cdot gh\in A\}\in J(e)$ なら、族 $(x\cdot gh)_{h}$ は $A$ の両立する族で、$A$ で貼り合わせた $a$ と $P$ での貼り合わせ $x\cdot g$ は、$P$ の一意性から等しい。よって $x\cdot g\in A$、$g\in\chi(x)$。$\chi$ は自然（$\chi(x\cdot f)=f^{*}\chi(x)$）で、$\chi(x)=t\iff x\in A$。

**Step 5（3：射から部分層）.** 層の射 $\varphi:P\to\Omega_{J}$ について、$A\defeq\{x : \varphi(x)=t\}$ は部分前層。$x\in P(c)$ が被覆ふるい $R$ のすべての $f$ で $x\cdot f\in A$ をみたせば、$f^{*}\varphi(x)=t$ すなわち $f\in\varphi(x)$ なので $R\subset\varphi(x)$、$\varphi(x)\in J(c)$。$\varphi(x)$ は閉なので $1_{c}^{*}\varphi(x)\in J$ から $1_{c}\in\varphi(x)$、$\varphi(x)=t$、$x\in A$。よって $A$ の両立する族の $P$ での貼り合わせは $A$ に入り、$A$ は層。さらに $f\in\varphi(x)\iff\varphi(x\cdot f)=t\iff x\cdot f\in A$ なので $\varphi=\chi_{A}$。

**Step 6（3：まとめ）.** $\mathbf{Sh}(\mathbf{C},J)$ のモノ射は、包含関手が（右随伴なので）引き戻しを保つことから前層のモノ射で、成分ごとに単射（\ref{cat:presheaf-mono}）。よって $P$ の部分対象は部分層。Step 4・5 から、部分層 $A$ と射 $P\to\Omega_{J}$ は $A=\chi^{-1}(\mathrm{true})$ により一対一で、$A$ は $\mathrm{true}$ の $\chi$ に沿った引き戻し（前層の引き戻しは各点ごと）。

**Step 7（4）.** 有限の極限とデカルト閉は \ref{cat:site-sheaves-limits-exponentials}、部分対象分類子は 3。
:::

::: definition グロタンディーク・トポス {#cat:grothendieck-topos keywords="Grothendieck topos: category equivalent to sheaves on a small site" index="グロタンディーク・トポス|ぐろたんでぃーくとぽす"}
ある小さいサイト $(\mathbf{C},J)$ について $\mathbf{Sh}(\mathbf{C},J)$ と圏同値な圏を**グロタンディーク・トポス**という。\ref{cat:site-topos} から、グロタンディーク・トポスは（初等）トポスで、さらに完備・余完備。
:::

::: hypcheck
- **選択公理**：使わない。通常の証明では、\ref{cat:plus-separated} の Step 2・3 で、各 $f\in R$ について代表 $(S_{f},y)$ や被覆 $T_{f}$ を選んで新しい族を組み立てるが、ここでは族を「条件をみたす $h$ 全体」（$T=\{h : x_{h}=x'_{h}\}$, $T=\{h : \xi_{h}\in\operatorname{im}\eta\}$）として定義し、$S_{f}$ や $T_{f}$ は被覆性を示すために存在を使うだけにした。Step 3 で $z_{h}=\eta^{-1}(\xi_{h})$ は $\eta$ の単射性から一意に決まる。
- 公理 1：$t_{c}\in J(c)$（$\eta$ の定義）。公理 2：$f^{*}S\in J(d)$（制限の定義）。公理 3：\ref{cat:plus-separated} の Step 2・4 と \ref{cat:site-topos} の Step 3。被覆ふるいの共通部分（\ref{cat:covering-sieve-basic}）は $J(c)$ が有向であることに使った。
- $\mathbf{C}$ が小さいことは、$J(c)$ と $\operatorname{Match}(S,P)$ が集合であることに使った。
:::

::: supplement
**層化は 1 回で済むことがある.** $P$ が分離的なら $P^{+}$ がすでに層（\ref{cat:plus-separated.3}）。空間の場合はエタール空間の切断が直接層になる。

**ローヴェア–ティアニー位相との対応.** 閉包 $S\mapsto\bar S\defeq\{f : f^{*}S\in J\}$ は前層の射 $j:\Omega\to\Omega$（$\Omega$ は全ふるいの前層、\ref{cat:presheaf-subobject-classifier}）を定め、$j\circ\mathrm{true}=\mathrm{true}$, $jj=j$, $j\circ\wedge=\wedge\circ(j\times j)$ をみたす。$\Omega_{J}$ は $j$ の不動点（閉ふるい）で、$J(c)=\{S : \bar S=t_{c}\}$ と復元できる。この対応がグロタンディーク位相と $\widehat{\mathbf{C}}$ のローヴェア–ティアニー位相の一対一対応を与えることが知られている（本サイト未収録）。
:::

## 高い視点 {#cat:sec-ssf-viewpoint}

::: remark 2 回の + 構成
1 回目の + 構成は「局所的に等しいものを同一視する」（分離化）、2 回目は「局所的に与えられたものを貼り合わせる」（完備化）。距離空間の完備化で、まず距離 0 の点を同一視し、次にコーシー列の極限を付け加えるのに似ている。圏論的には、$\mathbf{a}$ は完全な（有限の極限を保つ）反射であり、これがグロタンディーク・トポスを「前層トポスの左完全な局所化」として特徴づける（ジローの定理への道。\ref{cat:page-giraud-theorem}）。
:::

## 問題 {#cat:sec-ssf-problems}

::: problem {#cat:prob-ssf-closed-open}
空間のサイト $(\mathcal{O}(X),J_{X})$ で、$U$ 上の $J_{X}$ 閉ふるいは $\{V : V\subset W\}$（$W\subset U$ は開）の形のものに限ることを示し、$\Omega_{J_{X}}$ と \ref{cat:open-subobject-classifier} の $\Omega_{X}$ が同型であることを確かめよ。
:::

::: solution
$S$ を閉ふるい、$W\defeq\bigcup S$ とする。$V\in S$ なら $V\subset W$。逆に $V\subset W$ なら、$\{V\cap V' : V'\in S\}\subset f^{*}S$（$f:V\to U$）の和は $V\cap W=V$ なので $f^{*}S\in J_{X}(V)$、閉なので $V\in S$。よって $S=\{V\subset W\}$。逆に $\{V\subset W\}$ は閉：$f^{*}\{V'\subset W\}=\{V''\subset V\cap W\}$ が $V$ を覆えば $V\subset W$。対応 $S\mapsto\bigcup S$ は制限 $f^{*}$ と $W\mapsto W\cap V$ を対応させるので、前層の同型 $\Omega_{J_{X}}\cong\Omega_{X}$。
:::
