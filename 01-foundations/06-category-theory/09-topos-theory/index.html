# トポスとサイト（Toposes and Sites）

前層の圏のトポス、空間上の層の圏のトポス、部分対象分類子と初等トポス、ハイティング代数と量化子、サイトとグロタンディーク位相、サイト上の層化とグロタンディーク・トポス、ジローの公理と定理、エタール位相（体のエタール層＝ガロア集合）。

<p class="mn-msc">MSC2020: 18B25, 18F10, 18F20</p>

## 前提知識

- [圏論 › 圏論の基礎](../../../01-foundations/06-category-theory/01-basics/index.html)（全体、12 ページ）：証明・主張で使う：関手圏の極限は各点ごと・Set は完備かつ余完備・モノ射の引き戻し など
- [圏論 › モノイダル圏](../../../01-foundations/06-category-theory/02-monoidal-categories/index.html) [§4](../../../01-foundations/06-category-theory/02-monoidal-categories/04-cartesian-closed.html)（デカルト閉圏とローヴェアの不動点定理）：デカルト閉圏・評価射による言い換え
- [圏論 › カン拡張とエンド](../../../01-foundations/06-category-theory/04-kan-extensions/index.html)（全体、5 ページ）：証明・主張で使う：Set のフィルター付き余極限・有限の極限とフィルター付き余極限の交換
- [圏論 › 層のコホモロジー](../../../01-foundations/06-category-theory/08-sheaf-cohomology/index.html)（全体、6 ページ）：空間上の層・層化・順像と逆像
- [体論と多項式 › ガロア理論の展開](../../../02-algebra/05-field-theory/03-advanced-galois-theory/index.html)（全体、4 ページ）：証明・主張で使う：グロタンディークのガロア理論（有限版）・二つの関手・有限次ガロア部分拡大による近似 など
