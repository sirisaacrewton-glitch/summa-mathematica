# ジローの定理（2）：サイトによる表示 {#cat:page-giraud-theorem keywords="Giraud's theorem, canonical topology on a generating subcategory, every category satisfying Giraud's axioms is a Grothendieck topos, E(-,X) restricted to generators is a sheaf"}

ジローの公理（\ref{cat:giraud-axioms}）をみたす圏 $\mathbf{E}$ は、その小さい生成系 $\mathcal{G}$ のなす充満部分圏 $\mathbf{C}$ に「エピ射の族で覆う」位相 $J$ を入れたサイト上の層の圏と同値である。同値は $X\mapsto\mathbf{E}(-,X)|_{\mathbf{C}}$ で与えられる。前ページ（\ref{cat:sheaves-giraud}）と合わせて、**グロタンディーク・トポス ⇔ ジローの公理をみたす圏** という内在的な特徴づけが得られる。

> 証明は、本質的全射性を部分対象の対応と有効な同値関係に帰着する形に分けた。

## 記法と定義の確認 {#cat:sec-gt-notation}

::: notation
- $\mathbf{E}$ はジローの公理をみたす圏、$\mathcal{G}$ はその小さい生成系、$\mathbf{C}$ は $\mathcal{G}$ を対象とする $\mathbf{E}$ の充満部分圏（小さい）。
- ジローの公理と一般的な帰結（強い始対象、エピ射の余積と合成、生成系による被覆 $e_{X}:\coprod_{(c,x)}c\to X$、像の分解、正則エピ射と核対・直交性）は \ref{cat:giraud-axioms}, \ref{cat:giraud-basic}, \ref{cat:regular-epi-kernel-pair}。
- サイト上の層、層化 $\mathbf{a}$（左完全な左随伴）、稠密なモノ射に沿った延長は \ref{cat:site-sheaf}, \ref{cat:site-sheafification}, \ref{cat:dense-mono-extension}。$\mathbf{Sh}(\mathbf{C},J)$ はジローの公理をみたし、エピ射は局所全射（\ref{cat:sheaves-giraud}）、トポスなので平衡（\ref{cat:topos-balanced}）。
- 圏同値の特徴づけ（充満忠実かつ本質的全射）は \ref{cat:equivalence-characterization}。
- **選択公理**：最後の圏同値の構成（各層に $\mathbf{E}$ の対象を一つずつ対応させる）でだけ使う。
:::

## 位相と関手 {#cat:sec-gt-topology}

::: definition 生成系上の位相 {#cat:generator-topology keywords="topology on generators: a sieve covers if the induced map from the coproduct is epic" index="生成系上の位相|せいせいけいじょうのいそう"}
$c\in\mathbf{C}$ 上のふるい $S$ について、$e_{S}\defeq[f]_{f\in S}:\coprod_{f\in S}\operatorname{dom}f\to c$（$\mathbf{E}$ での余積）がエピのとき、$S\in J(c)$ とする。関手 $\Phi:\mathbf{E}\to\widehat{\mathbf{C}}$ を $\Phi X\defeq\mathbf{E}(-,X)|_{\mathbf{C}}$ で定める。
:::

::: lemma 位相であること {#cat:generator-topology-is-topology keywords="the epimorphic-sieve topology is a Grothendieck topology" index="生成系上の位相の公理|せいせいけいじょうのいそうのこうり"}
$J$ はグロタンディーク位相である。
:::

::: proof
**Step 1（最大）.** $1_{c}\in t_{c}$ なので $e_{t_{c}}$ は分裂エピ（$1_{c}$ 成分への入射が切断）。

**Step 2（安定）.** $S\in J(c)$, $g:d\to c$ とする。(G2) と (G3) から、$e_{S}$ の $g$ に沿った引き戻し $\coprod_{f\in S}(d\times_{c}\operatorname{dom}f)\to d$ はエピ。各 $d\times_{c}\operatorname{dom}f$ を生成系で覆うエピ $e_{d\times_{c}\operatorname{dom}f}$ の余積（\ref{cat:giraud-basic.2}・\ref[3]{cat:giraud-basic.3} からエピ）と合成すると、エピ $\coprod_{f}\coprod_{(c',u)}c'\to d$ を得る。その成分 $p_{1}u:c'\to d$ は $g p_{1}u=fp_{2}u\in S$ をみたすので $p_{1}u\in g^{*}S$。よってこのエピは $e_{g^{*}S}$ を経由し、$e_{g^{*}S}$ はエピ（\ref{cat:giraud-basic.2}）。

**Step 3（推移）.** $S\in J(c)$ で、各 $f\in S$ について $f^{*}R\in J(\operatorname{dom}f)$ とする。$\coprod_{f\in S}\coprod_{h\in f^{*}R}\operatorname{dom}h\to\coprod_{f\in S}\operatorname{dom}f\xrightarrow{e_{S}}c$ はエピの合成でエピ。成分 $fh$ は $R$ に入るので、これは $e_{R}$ を経由し、$e_{R}$ はエピ。
:::

::: proposition 表現される前層は層 {#cat:generator-hom-sheaf keywords="E(-,X) restricted to generators is a J-sheaf; Phi is fully faithful and preserves finite limits" index="ジローの関手|じろーのかんしゅ"}
1. $\Phi X$ は $J$ 層。とくに $\Phi c=\mathbf{y}c$ は層。
2. $\Phi:\mathbf{E}\to\mathbf{Sh}(\mathbf{C},J)$ は充満忠実で、有限の極限を保つ。
3. $\Phi$ はエピ射をエピ射に写す。
:::

::: proof
**Step 1（生成系による等式の判定）.** 以下くり返し使う：$\mathbf{E}$ の二つの射 $u,v:W\to X$ が、すべての $c\in\mathcal{G}$ と $w:c\to W$ について $uw=vw$ なら $u=v$（生成系の定義）。

**Step 2（1）.** $S\in J(c)$ と両立する族 $(x_{f}:\operatorname{dom}f\to X)_{f\in S}$ をとる。$[x_{f}]:\coprod_{f}\operatorname{dom}f\to X$ が $e_{S}$ の核対を余等化することを示す。(G2) を 2 回使うと核対は $\coprod_{f,f'\in S}(\operatorname{dom}f\times_{c}\operatorname{dom}f')$ で、二つの射影は成分ごとに $p:\operatorname{dom}f\times_{c}\operatorname{dom}f'\to\operatorname{dom}f$, $p'$ に入射を合成したもの。$x_{f}p=x_{f'}p'$ を示せばよい。生成系の元 $c'$ からの $w$ について、$k\defeq fpw=f'p'w$ は $S$ に入り（ふるい）、両立性から $x_{f}pw=x_{fpw}=x_{k}=x_{f'p'w}=x_{f'}p'w$。Step 1 から $x_{f}p=x_{f'}p'$。$e_{S}$ は (G3) から余等化子で、\ref{cat:regular-epi-kernel-pair.1} から核対の余等化子なので、$xe_{S}=[x_{f}]$、すなわち $xf=x_{f}$（$f\in S$）となる $x:c\to X$ がただ一つある（一意性は $e_{S}$ のエピ性）。$\mathbf{C}$ は充満なので $\Phi c=\mathbf{C}(-,c)=\mathbf{y}c$。

**Step 3（忠実）.** $\Phi u=\Phi v$ なら、生成系からのすべての $x$ で $ux=vx$、Step 1 から $u=v$。

**Step 4（充満）.** 自然変換 $\theta:\Phi X\to\Phi Y$ をとる。$e_{X}:\coprod_{(c,x)}c\to X$ はエピ（\ref{cat:giraud-basic.3}）で、(G3) と \ref{cat:regular-epi-kernel-pair.1} から核対の余等化子。$[\theta(x)]:\coprod c\to Y$ が核対を余等化すること：核対の成分 $c\times_{X}c'$（$x:c\to X$, $x':c'\to X$）と生成系からの $w$ について、$xpw=x'p'w$ なので自然性から $\theta(x)pw=\theta(xpw)=\theta(x'p'w)=\theta(x')p'w$、Step 1 から $\theta(x)p=\theta(x')p'$。よって $ge_{X}=[\theta(x)]$ となる $g:X\to Y$ があり、$gx=\theta(x)$、すなわち $\Phi g=\theta$。

**Step 5（有限の極限）.** hom 関手 $\mathbf{E}(c,-)$ は極限を保ち、層の極限は各点ごと。

**Step 6（3）.** エピ $e:X\to Y$ と $y\in\Phi Y(c)$ について、引き戻し $c\times_{Y}X\to c$ はエピ（(G3)）。生成系による被覆と合成したエピ $\coprod_{(c',u)}c'\to c\times_{Y}X\to c$ の成分 $p_{1}u$ は $y p_{1}u=e p_{2}u$ をみたすので、ふるい $\{f : yf\in\operatorname{im}\Phi e\}$ は $e$ に関する被覆を含み、被覆ふるいは上に閉じる（\ref{cat:covering-sieve-basic}）ので $J(c)$ に入る。すなわち $\Phi e$ は局所全射で、\ref{cat:sheaves-giraud} からエピ。
:::

## 余積と部分対象 {#cat:sec-gt-coproducts}

::: lemma 局所全単射の判定 {#cat:locally-bijective-iso keywords="a locally surjective and locally injective map from a presheaf to a sheaf induces an isomorphism after sheafification" index="局所全単射|きょくしょぜんたんしゃ"}
前層 $P$ と層 $Q$ と射 $\varphi:P\to Q$ が次をみたすとき、$\varphi$ が誘導する $\bar\varphi:\mathbf{a}P\to Q$ は同型。
- 局所全射：各 $y\in Q(c)$ について $\{f : y\cdot f\in\operatorname{im}\varphi\}\in J(c)$。
- 局所単射：$x,x'\in P(c)$ が $\varphi(x)=\varphi(x')$ なら $\{f : x\cdot f=x'\cdot f\}\in J(c)$。
:::

::: proof
**Step 1（稠密な部分前層と層化）.** 部分前層 $A\subset B$ が $J$ 稠密なら $\mathbf{a}A\to\mathbf{a}B$ は同型：層 $Q'$ について $\mathbf{Sh}(\mathbf{a}B,Q')\cong\widehat{\mathbf{C}}(B,Q')\to\widehat{\mathbf{C}}(A,Q')\cong\mathbf{Sh}(\mathbf{a}A,Q')$ は全単射（\ref{cat:dense-mono-extension}）で、これは $\mathbf{a}A\to\mathbf{a}B$ との合成なので、米田の補題から同型。

**Step 2（エピ）.** 局所全射は $\operatorname{im}\varphi\subset Q$ が稠密ということなので、Step 1 から $\mathbf{a}(\operatorname{im}\varphi)\cong\mathbf{a}Q=Q$。$P\to\operatorname{im}\varphi$ は成分ごとに全射なのでエピで、$\mathbf{a}$ はエピを保つ。よって $\bar\varphi$ はエピ。

**Step 3（モノ）.** $\varphi$ の核対 $P\times_{Q}P$ について、局所単射は対角 $\Delta_{P}\subset P\times_{Q}P$ が稠密ということ。$\mathbf{a}$ は引き戻しを保ち $\mathbf{a}Q=Q$ なので、$\bar\varphi$ の核対は $\mathbf{a}(P\times_{Q}P)\cong\mathbf{a}\Delta_{P}$ で、これは $\mathbf{a}P$ の対角。核対が対角ならモノ。

**Step 4.** トポスは平衡なので $\bar\varphi$ は同型。
:::

::: proposition 余積を保つ {#cat:giraud-functor-coproducts keywords="Phi preserves small coproducts" index="ジローの関手と余積|じろーのかんしゅとよせき"}
$\Phi(\coprod_{i}X_{i})\cong\coprod_{i}^{\mathbf{Sh}}\Phi X_{i}=\mathbf{a}\bigl(\coprod_{i}^{\widehat{\mathbf{C}}}\Phi X_{i}\bigr)$。
:::

::: proof
前層の射 $\varphi:\coprod^{\widehat{\mathbf{C}}}_{i}\Phi X_{i}\to\Phi(\coprod X_{i})$, $(i,y)\mapsto\iota_{i}y$ に \ref{cat:locally-bijective-iso} を使う。

**Step 1（局所全射）.** $y:c\to\coprod X_{i}$ について、(G2) から $c\cong\coprod_{i}(c\times_{\coprod X}X_{i})$。各成分を生成系で覆ったエピ $\coprod_{i}\coprod_{(c',u)}c'\to c$ の成分 $f$ について $yf$ はある $\iota_{i}$ を経由する。よって $\{f : yf\in\operatorname{im}\varphi\}$ は被覆。

**Step 2（局所単射）.** $\iota_{i}y=\iota_{j}y'$（$y:c\to X_{i}$, $y':c\to X_{j}$）とする。$i=j$ なら入射はモノなので $y=y'$。$i\neq j$ なら $(y,y'):c\to X_{i}\times_{\coprod X}X_{j}$ で、右辺は始対象なので $c$ も始対象（\ref{cat:giraud-basic.1}）。このとき空のふるいについて $e_{\emptyset}:0\to c$ は同型でエピ、空のふるいは被覆で、その上で $(i,y)$ と $(j,y')$ は（空虚に）一致する。
:::

::: proposition 部分対象の対応 {#cat:giraud-functor-subobjects keywords="Phi induces a bijection between subobjects of X and subsheaves of Phi X" index="ジローの関手と部分対象|じろーのかんしゅとぶぶんたいしょう"}
各 $Z\in\mathbf{E}$ について、$W\mapsto\Phi W$ は $Z$ の部分対象と $\Phi Z$ の部分層の間の順序同型。
:::

::: proof
**Step 1（順序を保ち、反映する）.** $\Phi$ は引き戻しを保つのでモノを保つ。$W\le W'$（$W\to Z$ が $W'$ を経由）なら $\Phi W\le\Phi W'$。逆に $\Phi W\le\Phi W'$ なら、射 $\Phi W\to\Phi W'$ は充満性から $\Phi k$ と書け、忠実性から $k$ は $Z$ 上の射。よって単射。

**Step 2（全射）.** 部分層 $U\subset\Phi Z$ をとり、$Y\defeq\coprod_{(c,u)}c$（$u\in U(c)$ の全体）, $h\defeq[u]:Y\to Z$ とする。\ref{cat:giraud-basic.4} で $h=me$（$e$ はエピ、$m:W\to Z$ はモノ）。$\Phi h=\Phi m\circ\Phi e$ で、$\Phi e$ はエピ（\ref{cat:generator-hom-sheaf.3}）、$\Phi m$ はモノ。一方、\ref{cat:giraud-functor-coproducts} から $\Phi Y\cong\mathbf{a}(\coprod\mathbf{y}c)$ で、$\Phi h$ は $\mathbf{a}(\coprod\mathbf{y}c)\to U\subset\Phi Z$ と分解し、前半は（層化前に成分ごとに全射なので）エピ。$\mathbf{Sh}(\mathbf{C},J)$ のエピは核対の余等化子（\ref{cat:sheaves-giraud}）なので、エピとモノへの分解の一意性（\ref{cat:regular-epi-kernel-pair.3}）から $\Phi W\cong U$（$\Phi Z$ の部分対象として）。
:::

## ジローの定理 {#cat:sec-gt-theorem}

::: lemma 同値関係の内部的な言い換え {#cat:equivalence-relation-internal keywords="reflexivity, symmetry, transitivity of a relation via the diagonal, the twist and R x_A R" index="同値関係の内部的な言い換え|どうちかんけいのないぶてきないいかえ"}
モノ $m=(r_{1},r_{2}):R\to A\times A$ が同値関係であることは、次の三つと同値：
- (i) 対角 $A\to A\times A$ が $m$ を経由する
- (ii) $\tau\circ m$（$\tau$ は成分の入れ替え）が $m$ を経由する
- (iii) $(r_{1}p_{1},r_{2}p_{2}):R\times_{A}R\to A\times A$（引き戻しは $r_{2}$ と $r_{1}$ について）が $m$ を経由する
:::

::: proof
$T$ からの射 $(u,v)$ が $R$ に入るとは、$(u,v):T\to A\times A$ が $m$ を経由すること。(i)(ii)(iii) から、$(u,u)$、$(u,v)\Rightarrow(v,u)$、$(u,v),(v,w)\Rightarrow(u,w)$（$T\to R\times_{A}R$ を経由）。逆は、$T=A$ と $(1,1)$、$T=R$ と $(r_{1},r_{2})$、$T=R\times_{A}R$ と $(r_{1}p_{1},r_{2}p_{1}),(r_{1}p_{2},r_{2}p_{2})$ を考えればよい。
:::

::: theorem ジローの定理 {#cat:giraud-theorem keywords="Giraud's theorem: a category is a Grothendieck topos iff it satisfies Giraud's axioms" index="ジローの定理|じろーのていり" refname="ジローの定理"}
ジローの公理をみたす圏 $\mathbf{E}$ について、$\Phi:\mathbf{E}\to\mathbf{Sh}(\mathbf{C},J)$ は圏同値である。したがって、局所的に小さい圏がグロタンディーク・トポスであることと、ジローの公理をみたすことは同値。
:::

::: proof
**Step 1.** $\Phi$ は充満忠実（\ref{cat:generator-hom-sheaf}）。本質的全射を示す。層 $P$ について $A\defeq\coprod_{(c,x)}c$（$x\in P(c)$ の全体）とおく。\ref{cat:giraud-functor-coproducts} から $\Phi A\cong\mathbf{a}(\coprod^{\widehat{\mathbf{C}}}\mathbf{y}c)$ で、元 $x$ たちが定める $\coprod\mathbf{y}c\to P$ は成分ごとに全射なので、層化して得られる $\pi:\Phi A\to P$ はエピ。

**Step 2（核対を $\mathbf{E}$ に持ち上げる）.** $\pi$ の核対 $R\subset\Phi A\times\Phi A=\Phi(A\times A)$ は部分層なので、\ref{cat:giraud-functor-subobjects} から $R=\Phi R_{\mathbf{E}}$ となる部分対象 $R_{\mathbf{E}}\subset A\times A$ がある。$R$ は同値関係（核対）なので \ref{cat:equivalence-relation-internal.i}–(iii) をみたす。$R_{\mathbf{E}}$ も (i)–(iii) をみたすことを (iii) で示す（(i)(ii) も同様）。$g\defeq(r_{1}p_{1},r_{2}p_{2}):R_{\mathbf{E}}\times_{A}R_{\mathbf{E}}\to A\times A$ について、$\Phi$ は引き戻しを保つので $\Phi g$ は $R\times_{\Phi A}R\to\Phi A\times\Phi A$ で、$R$ の推移性から $\Phi g=\Phi m\circ\psi$（$m:R_{\mathbf{E}}\to A\times A$）となる $\psi$ がある。充満性から $\psi=\Phi k$、忠実性から $g=mk$。

**Step 3（商をとる）.** (G4) から、$R_{\mathbf{E}}$ の余等化子 $q:A\to Q$ があり、その核対は $R_{\mathbf{E}}$。$\Phi q$ はエピで（\ref{cat:generator-hom-sheaf.3}）、核対は $\Phi R_{\mathbf{E}}=R$（$\Phi$ は引き戻しを保つ）。$\pi$ と $\Phi q$ はどちらもエピで、$\mathbf{Sh}(\mathbf{C},J)$ ではエピは核対の余等化子（\ref{cat:sheaves-giraud}）なので、同じ核対 $R$ の余等化子として $P\cong\Phi Q$。

**Step 4（結論）.** 充満忠実かつ本質的全射なので圏同値（\ref{cat:equivalence-characterization}）。後半は、$\Leftarrow$ がこの定理、$\Rightarrow$ が \ref{cat:sheaves-giraud}（ジローの公理は圏同値で保たれる）。
:::

::: corollary グロタンディーク・トポスの性質
ジローの公理をみたす圏はトポスで、完備かつ余完備（\ref{cat:site-topos}, \ref{cat:site-sheafification}）。生成系 $\mathcal{G}$ を大きくとり直しても（小さいまま）、得られるサイトの層の圏はすべて互いに同値（どれも $\mathbf{E}$ と同値）である。一つのトポスを表すサイトは一意ではない。
:::

::: hypcheck
- **選択公理**：本質的全射から圏同値を得るとき（\ref{cat:equivalence-characterization}）、各層 $P$ に $\Phi Q\cong P$ となる $Q$ と同型を一つずつ選ぶ。ここで（クラス上の）選択を使う。それ以外は、余積・像・余等化子など普遍性で決まる対象と、存在を述べるだけの議論。
- (G1)：余積 $e_{S}$, $e_{X}$ と引き戻しの存在。(G2)：位相の安定性（\ref{cat:generator-topology-is-topology} の Step 2）、核対の計算（\ref{cat:generator-hom-sheaf} の Step 2）、余積の保存（\ref{cat:giraud-functor-coproducts}）。(G3)：$e_{S}$, $e_{X}$ が余等化子であること、エピの引き戻し。(G4)：Step 3 の商と像の分解。(G5)：生成系による等式の判定と被覆。
- $\mathbf{C}$ が小さいことは、$\widehat{\mathbf{C}}$ と層化の存在に使う。$\mathbf{E}$ が局所的に小さいことは $\Phi X(c)=\mathbf{E}(c,X)$ が集合であることに使う。
:::

::: supplement
**標準位相.** 圏 $\mathbf{C}$ の**標準位相**は、すべての表現可能前層が層になる最大の位相である。ジロー圏の生成系上の上の位相 $J$ は、$\mathbf{C}$ の上の標準位相と一致することが知られている（本サイト未収録。$\Phi c=\mathbf{y}c$ が層であることは示した）。

**幾何学的射.** グロタンディーク・トポスの間の**幾何学的射** $f:\mathcal{F}\to\mathcal{E}$ は、左完全な左随伴 $f^{*}$ をもつ関手 $f_{*}$ のこと。連続写像 $X\to Y$ は $\mathbf{Sh}(X)\to\mathbf{Sh}(Y)$ の幾何学的射を誘導する（\ref{cat:inverse-direct-adjunction}）。ジローの定理と同じ方法で、「$\mathcal{E}$ から $\widehat{\mathbf{C}}$ への幾何学的射 ＝ $\mathbf{C}$ 上の平坦関手」（ディアコネスクの定理）が示されることが知られている（本サイト未収録）。
:::

## 高い視点 {#cat:sec-gt-viewpoint}

::: remark 座標を選ぶこと
ジローの定理は、トポスという「空間」に対して、生成系という「座標近傍の系」を選ぶと、トポスがそれらの上の層として書けることを述べている。多様体が座標近傍と貼り合わせで決まり、しかも座標の選び方によらないのと同じく、トポスはサイトの選び方によらず、サイトは計算のための座標にすぎない。生成系 $c$ に対する $\mathbf{E}(c,X)$ は「$X$ を $c$ という座標から見た像」で、層の条件はエピの族で覆う座標どうしの貼り合わせの整合性である。
:::

## 問題 {#cat:sec-gt-problems}

::: problem {#cat:prob-gt-set-generator}
$\mathbf{E}=\mathbf{Set}$、$\mathcal{G}=\{1\}$（1 点集合）のとき、本ページの $\mathbf{C}$ と $J$ を求め、$\Phi$ が圏同値 $\mathbf{Set}\simeq\mathbf{Sh}(\mathbf{C},J)$ を与えることを直接確かめよ。
:::

::: solution
$\mathbf{C}$ は対象 $1$ と恒等射だけの圏。ふるいは $\emptyset$ と $t_{1}=\{1_{1}\}$ で、$e_{\emptyset}:\emptyset\to1$ はエピでない（異なる二つの写像 $1\rightrightarrows\{0,1\}$ は、$\emptyset$ からの写像と合成すると等しくなる）ので $J(1)=\{t_{1}\}$。自明な位相なので層はすべての前層、すなわち集合（\ref{cat:page-sites} の例の 1）。$\Phi X=\mathbf{Set}(1,X)\cong X$ で、$\Phi$ は（同型を除いて）恒等関手。
:::
