# 随伴と極限の保存 {#cat:page-adjoints-limits keywords="preservation of limits, continuous functor, creation of limits, limits in functor categories are pointwise, hom functors preserve limits, right adjoints preserve limits, left adjoints preserve colimits, limit functor right adjoint to diagonal"}

関手が極限をどう扱うかを調べる。関手が極限錐を極限錐に移すとき、極限を**保存する**という（\ref{cat:preserve-limits}）。本ページの主定理は「**右随伴は極限を保存し、左随伴は余極限を保存する**」（\ref{cat:adjoints-preserve-limits}）である。その準備として、hom 関手が極限を保存すること（\ref{cat:hom-preserves-limits}）、関手圏の極限が各点ごとに計算できること（\ref{cat:pointwise-limits}）、群の忘却関手が極限を**創出する**こと（\ref{cat:grp-creates-limits}）を示す。また、極限を対角関手の右随伴として捉え直す（\ref{cat:lim-adjoint-diagonal}）。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 V 章 §1, §3–§5。

## 記法と定義の確認 {#cat:sec-al-notation}

::: notation
- 錐・極限・余極限・積・等化子、極限の一意性と「射は成分で決まる」こと、$\mathbf{Set}$ の完備性は \ref{cat:page-limits} のとおり（\ref{cat:cone}, \ref{cat:limit}, \ref{cat:colimit}, \ref{cat:limit-basic}, \ref{cat:set-complete}）。
- 随伴、転置 $\varphi$、普遍射からの左随伴の構成は \ref{cat:page-adjunctions} のとおり（\ref{cat:adjunction}, \ref{cat:adjunction-from-universal}）。
- 関手圏 $\mathbf{X}^{\mathbf{P}}$、双関手とカリー化は \ref{cat:page-constructions} のとおり（\ref{cat:functor-category}, \ref{cat:prob-currying}）。
- 添字の圏 $\mathbf{J}$ は小さく、圏はすべて局所小とする。錐 $\tau\colon\Delta c\Rightarrow F$ を $\tau\colon c\to F$ と略記することがある。
:::

## 極限の保存と創出 {#cat:sec-al-preserve}

::: definition 極限の保存 {#cat:preserve-limits keywords="preserves limits, continuous functor, reflects limits" index="極限の保存|きょくげんのほぞん, 連続関手|れんぞくかんしゅ"}
関手 $H\colon\mathbf{C}\to\mathbf{D}$ が図式 $F\colon\mathbf{J}\to\mathbf{C}$ の極限を**保存する**とは、$F$ の任意の極限錐 $\lambda\colon L\to F$ について、$H\lambda\colon HL\to HF$（成分 $H\lambda_{j}$）が $HF$ の極限錐になることをいう。すべての小さい図式の極限を保存する関手を**連続**という。余極限についても同様に定める。
:::

::: intuition
関手で写したあとも、極限は極限のままであるということ。極限を先にとってから写しても、写してから極限をとっても同じになる。
:::

::: theorem hom 関手は極限を保存する {#cat:hom-preserves-limits keywords="covariant hom functors preserve limits; contravariant hom functors turn colimits into limits" index="hom 関手と極限|ほむかんしゅときょくげん"}
1. 各 $c\in\mathbf{C}$ について、$\mathbf{C}(c,-)\colon\mathbf{C}\to\mathbf{Set}$ は（存在するすべての）極限を保存する。
2. 各 $c$ について、$\mathbf{C}(-,c)\colon\mathbf{C}^{\mathrm{op}}\to\mathbf{Set}$ は $\mathbf{C}$ の余極限を $\mathbf{Set}$ の極限に移す。とくに $\mathbf{C}\bigl(\coprod_{i}a_{i},c\bigr)\cong\prod_{i}\mathbf{C}(a_{i},c)$。
:::

::: intuition
極限への射を与えることは、図式の各対象への両立する射の族を与えることと同じである。余極限からの射についても同様である。
:::

::: proof
**1.** $\lambda\colon L\to F$ を極限錐とする。$\lambda_{*}\defeq\mathbf{C}(c,\lambda)$ とおくと、これは錐 $\mathbf{C}(c,L)\to\mathbf{C}(c,F-)$ である（関手は錐を錐に移す）。$\mathbf{Set}$ の錐 $\tau\colon X\to\mathbf{C}(c,F-)$ をとる。各 $x\in X$ について、$u\colon j\to k$ に対し $Fu\circ\tau_{j}(x)=\tau_{k}(x)$ が $\tau$ が錐であることから成り立つので、$(\tau_{j}(x))_{j}$ は $\mathbf{C}$ の錐 $c\to F$ である。ゆえに極限の性質から、$\lambda_{j}\circ k(x)=\tau_{j}(x)$ となる $k(x)\colon c\to L$ が一意にある。こうして定めた $k\colon X\to\mathbf{C}(c,L)$ は $\lambda_{*j}\circ k=\tau_{j}$ を満たし、$k(x)$ の一意性から $k$ も一意である。よって $\lambda_{*}$ は極限錐である。

**2.** $\mathbf{C}(-,c)=\mathbf{C}^{\mathrm{op}}(c,-)$ であり、$\mathbf{C}$ の余極限は $\mathbf{C}^{\mathrm{op}}$ の極限なので、1 を $\mathbf{C}^{\mathrm{op}}$ に適用すればよい。
:::

::: definition 極限の創出 {#cat:create-limits keywords="creation of limits" index="極限の創出|きょくげんのそうしゅつ"}
関手 $V\colon\mathbf{A}\to\mathbf{X}$ が図式 $F\colon\mathbf{J}\to\mathbf{A}$ の極限を**創出する**とは、$VF$ の任意の極限錐 $\sigma\colon x\to VF$ に対し、$\mathbf{A}$ の錐 $\tau\colon a\to F$ で $V\tau=\sigma$（$Va=x$, $V\tau_{j}=\sigma_{j}$）となるものがちょうど一つあり、しかもその $\tau$ が極限錐であることをいう。
:::

::: intuition
下の圏で極限が見つかれば、それを上の圏の極限にただ一通りに持ち上げられるということ。群の極限は、台集合の極限に群の構造をただ一通りに入れて得られる。
:::

::: theorem 群の忘却関手は極限を創出する {#cat:grp-creates-limits keywords="the forgetful functor from groups to sets creates limits; Grp is complete" index="群の圏の完備性|ぐんのけんのかんびせい"}
忘却関手 $U\colon\mathbf{Grp}\to\mathbf{Set}$ は小さい図式の極限を創出する。とくに $\mathbf{Grp}$ は完備で、$U$ は連続である。
:::

::: intuition
群の図式の極限は、台集合の極限に成分ごとの演算を入れれば得られ、そのような群の構造はほかにない。
:::

::: proof
**Step 1（群構造の一意な持ち上げ）.** $F\colon\mathbf{J}\to\mathbf{Grp}$ と、$UF$ の極限錐 $\sigma\colon X\to UF$ をとる。【主張：$X$ 上の群構造で、すべての $\sigma_{j}$ が準同型になるものがちょうど一つある】 \ref{cat:set-complete.1} の構成により、$X$ は（同型を除いて）両立する族 $(x_{j})_{j}$ の集合 $L$ と射影とみなせるので、まず $X=L$ の場合を示す。$L$ に成分ごとの積 $(x_{j})(y_{j})\defeq(x_{j}y_{j})$、単位 $(1)$、逆元 $(x_{j}^{-1})$ を入れる。各 $Fu$ は準同型なので、$Fu(x_{j}y_{j})=Fu(x_{j})Fu(y_{j})=x_{k}y_{k}$ となり、両立する族の積は両立する。同様に $Fu(x_{j}^{-1})=Fu(x_{j})^{-1}=x_{k}^{-1}$、$Fu(1)=1$ なので、逆元と単位も両立する族である。群の公理はどれも元の間の等式なので、成分ごとに成り立つ。射影 $\sigma_{j}$ は定義から準同型である。逆に、$\sigma_{j}$ がすべて準同型になる群構造では $\sigma_{j}((x)(y))=x_{j}y_{j}$ なので積の各成分が決まり、族は成分で決まるので、積はこの構造の積に限る（単位と逆元は積で決まる）。一般の極限錐 $X$ は $L$ と全単射 $\theta$ で結ばれる（$\sigma=\sigma^{L}\circ\theta$）ので、群構造を $\theta$ で移せば同じ結論が得られる。

**Step 2（極限錐であること）.** 【主張：Step 1 の群の錐 $\sigma\colon L\to F$ は $\mathbf{Grp}$ の極限錐である】 $\tau\colon G\to F$ を群の錐とする。$U\tau$ は集合の錐なので、写像 $t\colon UG\to L$ で $\sigma_{j}\circ t=\tau_{j}$ となるものが一意にあり、$t(g)=(\tau_{j}(g))_{j}$ である。$\tau_{j}$ が準同型なので、$t$ も成分ごとに準同型である。$\sigma_{j}\circ t'=\tau_{j}$ となる準同型 $t'$ は写像としても同じ条件を満たすので、写像としての一意性から $t'=t$ である。

**Step 3.** 【主張：$\mathbf{Grp}$ は完備で、$U$ は連続】 $\mathbf{Set}$ は完備（\ref{cat:set-complete}）なので、すべての小さい $F$ について $UF$ の極限があり、Step 1, 2 から $F$ の極限がある。$F$ の任意の極限錐 $\lambda$ は、構成した極限錐 $\sigma$ と同型 $\theta$ で $\lambda=\sigma\circ\theta$ と結ばれる（\ref{cat:limit-basic}）。ゆえに $U\lambda=U\sigma\circ U\theta$ は $\mathbf{Set}$ の極限錐 $U\sigma$ と同型射 $U\theta$ の合成なので、極限錐である。よって $U$ は極限を保存する。

::: hypcheck
- **群の公理が等式だけからなること**：Step 1 で、群構造が成分ごとに定まり、両立性が保たれることに使った。体の圏では逆元の公理が「$x\neq0$ なら」という条件付きで、成分ごとの構造が体にならない。実際、体の積は存在するとは限らない：$\mathbb{F}_{2}$ と $\mathbb{F}_{3}$ の積 $P$ があれば射影 $P\to\mathbb{F}_{2}$, $P\to\mathbb{F}_{3}$ があるが、体の準同型は標数を保つので、そのような体 $P$ はない。
- **余極限は創出しない**：$U$ は余積を保たない（自由積）。創出は極限側だけの性質である。
:::
:::

## 関手圏の極限 {#cat:sec-al-pointwise}

::: theorem 関手圏の極限は各点ごと {#cat:pointwise-limits keywords="limits in functor categories are computed pointwise" index="各点ごとの極限|かくてんごとのきょくげん"}
$S\colon\mathbf{J}\to\mathbf{X}^{\mathbf{P}}$ とし、各 $p\in\mathbf{P}$ について、$E_{p}S\colon\mathbf{J}\to\mathbf{X}$（$j\mapsto(Sj)(p)$）が極限 $L_{p}$ と極限錐 $\tau^{p}\colon L_{p}\to E_{p}S$ をもつとする。このとき、対象関数 $p\mapsto L_{p}$ をもつ関手 $L\colon\mathbf{P}\to\mathbf{X}$ で、$\tau_{j}\colon L\Rightarrow Sj$（成分 $(\tau_{j})_{p}=\tau^{p}_{j}$）が自然変換になるものがちょうど一つあり、$\tau$ は $S$ の極限錐である。とくに、$\mathbf{X}$ が完備なら $\mathbf{X}^{\mathbf{P}}$ も完備である。
:::

::: intuition
関手の図式の極限は、各点で極限をとって並べれば得られる。
:::

::: proof
**Step 1（$L$ の射）.** $h\colon p\to q$ をとる。【主張：$\tau^{q}_{j}\circ Lh=(Sj)(h)\circ\tau^{p}_{j}$（すべての $j$）となる $Lh\colon L_{p}\to L_{q}$ がただ一つある】 $(Sj)(h)\circ\tau^{p}_{j}\colon L_{p}\to(Sj)(q)$ が $j$ について錐をなすことを示せばよい。$u\colon j\to k$ について、$Su\colon Sj\Rightarrow Sk$ の自然性と $\tau^{p}$ が錐であることから次が成り立つ。
$$
\begin{aligned}
(Su)_{q}\circ(Sj)(h)\circ\tau^{p}_{j}&=(Sk)(h)\circ(Su)_{p}\circ\tau^{p}_{j}\\
&=(Sk)(h)\circ\tau^{p}_{k}.
\end{aligned}
$$
ゆえに錐であり、$\tau^{q}$ が極限錐なので主張の $Lh$ がただ一つある。

**Step 2（関手性と自然性）.** 【主張：$L$ は関手で、各 $\tau_{j}\colon L\Rightarrow Sj$ は自然変換。このような $L$ はただ一つ】 $L(1_{p})$ と $1_{L_{p}}$ はどちらも Step 1 の条件を満たすので一致する。$h'\colon q\to r$ について、Step 1 を 2 回使うと $\tau^{r}_{j}\circ Lh'\circ Lh=(Sj)(h')\circ\tau^{q}_{j}\circ Lh=(Sj)(h'\circ h)\circ\tau^{p}_{j}$ となる。ゆえに $L(h'\circ h)$ と $Lh'\circ Lh$ はどちらも同じ錐を経由させる射なので一致する（極限への射は成分で決まる、\ref{cat:limit-basic.2}）。Step 1 の式は $\tau_{j}$ の自然性そのものである。一意性について：$\tau_{j}$ が自然変換になる $L$ では $Lh$ は Step 1 の式を満たさなければならないので、Step 1 の一意性から $L$ は決まる。

**Step 3（極限錐）.** 【主張：$\tau$ は $S$ の極限錐】 $\mathbf{X}^{\mathbf{P}}$ の錐 $\sigma\colon M\to S$ をとる。各 $p$ で $\sigma^{p}\defeq((\sigma_{j})_{p})_{j}$ は $M(p)\to E_{p}S$ の錐なので、$\tau^{p}_{j}\circ\theta_{p}=(\sigma_{j})_{p}$ となる $\theta_{p}\colon M(p)\to L_{p}$ が一意にある。$\theta$ の自然性を示す。$h\colon p\to q$ について、$\theta_{q}\circ Mh$ と $Lh\circ\theta_{p}$ に $\tau^{q}_{j}$ を合成すると、どちらも $(Sj)(h)\circ(\sigma_{j})_{p}$ になる（前者は $\sigma_{j}$ の自然性、後者は Step 1 による）。ゆえに \ref{cat:limit-basic.2} から両者は一致する。$\tau_{j}\cdot\theta=\sigma_{j}$ は構成から成り立ち、$\theta$ の一意性は各成分 $\theta_{p}$ の一意性から従う。
:::

::: remark
双対的に、関手圏の余極限も各点ごとに計算できる。とくに、小さい圏 $\mathbf{C}$ 上の前層の圏 $[\mathbf{C}^{\mathrm{op}},\mathbf{Set}]$ は完備かつ余完備である（$\mathbf{Set}$ の完備性・余完備性 \ref{cat:set-complete} による）。
:::

## 極限関手と対角関手 {#cat:sec-al-lim-adjoint}

::: theorem 極限は対角関手の右随伴 {#cat:lim-adjoint-diagonal keywords="lim is right adjoint to the diagonal functor; colim is left adjoint" index="極限関手|きょくげんかんしゅ"}
$\mathbf{C}$ がすべての $F\colon\mathbf{J}\to\mathbf{C}$ の極限をもつとする。各 $F$ に極限 $\lim F$ と極限錐を一つずつ選ぶと、$F\mapsto\lim F$ は関手 $\lim\colon\mathbf{C}^{\mathbf{J}}\to\mathbf{C}$ に一意に延び、$\Delta\dashv\lim$ となる。双対的に、余極限をすべてもてば $\operatorname{colim}\dashv\Delta$。
:::

::: intuition
対象 $c$ から図式 $F$ への錐は、$c$ から $\lim F$ への射と同じである。この対応が随伴 $\Delta\dashv\lim$ の全単射になる。
:::

::: proof
極限錐 $\lambda^{F}\colon\Delta(\lim F)\Rightarrow F$ は、定義（\ref{cat:limit}）から $\Delta$ から $F$ への普遍射である。\ref{cat:adjunction-from-universal} の双対（各対象 $F$ に $\Delta$ から $F$ への普遍射があれば、右随伴が一意に延びる）を適用する。選択は、各 $F$ に極限を一つずつ選ぶところで使う（具体的に構成できる場合は不要）。
:::

## 右随伴は極限を保存する {#cat:sec-al-adjoints}

::: theorem 右随伴は極限を保存する {#cat:adjoints-preserve-limits keywords="right adjoints preserve limits, left adjoints preserve colimits (RAPL)" index="右随伴は極限を保存|みぎずいはんはきょくげんをほぞん, 左随伴は余極限を保存|ひだりずいはんはよきょくげんをほぞん"}
$G\colon\mathbf{A}\to\mathbf{X}$ が左随伴 $F$ をもつなら、$G$ は $\mathbf{A}$ に存在するすべての極限を保存する。双対的に、右随伴をもつ関手はすべての余極限を保存する。
:::

::: intuition
右随伴の関手は極限と交換し、左随伴の関手は余極限と交換する。関手が随伴の一方であることがわかれば、極限・余極限との交換が一斉にわかる。
:::

::: proof
$\tau\colon a\to T$ を $T\colon\mathbf{J}\to\mathbf{A}$ の極限錐とする。関手は錐を錐に移すので、$G\tau\colon Ga\to GT$ は錐である。これが極限錐であることを示す。

**Step 1（錐の転置）.** $\mathbf{X}$ の錐 $\sigma\colon x\to GT$ をとる。【主張：転置 $\sigma_{j}^{\flat}\defeq\varphi^{-1}(\sigma_{j})\colon Fx\to Tj$ は錐 $Fx\to T$ をなす】 随伴の自然性（\ref{cat:adjunction} の注意）から、$u\colon j\to k$ について $\varphi^{-1}(GTu\circ\sigma_{j})=Tu\circ\varphi^{-1}(\sigma_{j})$ である。$\sigma$ は錐なので $GTu\circ\sigma_{j}=\sigma_{k}$ であり、ゆえに $Tu\circ\sigma_{j}^{\flat}=\varphi^{-1}(\sigma_{k})=\sigma_{k}^{\flat}$ が成り立つ。

**Step 2（存在）.** 【主張：$G\tau_{j}\circ h^{\sharp}=\sigma_{j}$（すべての $j$）となる $h^{\sharp}\colon x\to Ga$ がある】 $\tau$ は極限錐なので、Step 1 の錐について $\tau_{j}\circ h=\sigma_{j}^{\flat}$ となる $h\colon Fx\to a$ が一意にある。$h^{\sharp}\defeq\varphi(h)\colon x\to Ga$ とおくと、自然性から次が成り立つ。
$$
G\tau_{j}\circ h^{\sharp}=\varphi(\tau_{j}\circ h)=\varphi(\sigma_{j}^{\flat})=\sigma_{j}.
$$

**Step 3（一意性）.** 【主張：$G\tau_{j}\circ k=\sigma_{j}$（すべての $j$）となる $k$ は $h^{\sharp}$ に限る】 そのような $k\colon x\to Ga$ について $\varphi^{-1}$ をとると、自然性から $\tau_{j}\circ\varphi^{-1}(k)=\varphi^{-1}(G\tau_{j}\circ k)=\sigma_{j}^{\flat}$ である。$h$ の一意性から $\varphi^{-1}(k)=h$、すなわち $k=h^{\sharp}$ である。ゆえに $G\tau$ は極限錐である。双対の主張は、反対圏をとって $F^{\mathrm{op}}$ が $G^{\mathrm{op}}$ の右随伴になることから従う。

::: hypcheck
- **随伴の自然性**：Step 1 で錐の転置が錐になること、Step 2, 3 で転置と合成が交換することに使った。
- **極限が $\mathbf{A}$ に存在すること**：定理は保存を述べるだけで、極限の存在は仮定である。
- **逆は成り立たない**：極限を保存しても左随伴をもつとは限らない。左随伴の存在には、さらに「解集合条件」が要る（\see{cat:freyd-aft}。反例は \see{cat:aft-counterexample}）。
:::
:::

::: example
1. **忘却関手と自由関手.** $U\colon\mathbf{Grp}\to\mathbf{Set}$ は左随伴（自由群。存在は \ref{cat:adjunction} の例 1 と同じく群論の事実とする）をもつので極限を保存する（\ref{cat:grp-creates-limits} と一致）。自由群関手 $F\colon\mathbf{Set}\to\mathbf{Grp}$ は左随伴なので余極限を保存する：$F(X\sqcup Y)\cong F(X)*F(Y)$（自由積）。しかし $F$ は極限を保存しない。実際、$F$ が終対象 $\{0\}$（空の図式の極限）を保存するなら $F(\{0\})\cong\mathbb{Z}$ が $\mathbf{Grp}$ の終対象（自明群）でなければならないが、そうではない。
2. **\term[直積]{set:cartesian-product}は余極限を保存する.** $\mathbf{Set}$ で $-\times B$ は右随伴 $\mathbf{Set}(B,-)$ をもつ（\ref{cat:adjunction} の例 3）ので、余極限を保存する：$(\coprod_{i}X_{i})\times B\cong\coprod_{i}(X_{i}\times B)$（分配律）。
3. **右随伴をもたない関手.** \ref{cat:prob-no-right-adjoint} は、余積を保存しないことから右随伴がないことを示した。同様に、$U\colon\mathbf{Grp}\to\mathbf{Set}$ は余積を保存しない（$U(\mathbb{Z}*\mathbb{Z})$ は可算無限集合だが、$U\mathbb{Z}\sqcup U\mathbb{Z}$ との間の標準的な写像 $U\mathbb{Z}\sqcup U\mathbb{Z}\to U(\mathbb{Z}*\mathbb{Z})$ は全射でない：$ab$ の形の元は像に入らない）ので、右随伴をもたない。
:::

::: supplement
**一般化.** 「随伴は関手圏に持ち上がる」：$F\dashv G$ なら、各 $\mathbf{J}$ について $F^{\mathbf{J}}\dashv G^{\mathbf{J}}$（合成で作用させる。単位 $\eta T\colon T\Rightarrow GFT$ と余単位 $\varepsilon S\colon FGS\Rightarrow S$ が各点ごとに三角等式を満たすので、\ref{cat:adjunction-equivalent-forms.3} による）。$\mathbf{A}$ と $\mathbf{X}$ が $\mathbf{J}$ 型の極限をすべてもつときは、これと $\Delta\dashv\lim$ から \ref{cat:adjoints-preserve-limits} の別証明の筋が得られる。随伴の合成（\ref{cat:adjunction-composition}）から $\Delta_{\mathbf{A}}\circ F\dashv G\circ\lim_{\mathbf{A}}$ と $F^{\mathbf{J}}\circ\Delta_{\mathbf{X}}\dashv\lim_{\mathbf{X}}\circ G^{\mathbf{J}}$ であり、左辺の二つの関手 $\Delta_{\mathbf{A}}\circ F$ と $F^{\mathbf{J}}\circ\Delta_{\mathbf{X}}$ は等しい（どちらも $x$ を値 $Fx$ の定数図式に移す）。ゆえに随伴の一意性（\ref{cat:adjoint-unique}）から $G\circ\lim_{\mathbf{A}}\cong\lim_{\mathbf{X}}\circ G^{\mathbf{J}}$ である。ただしこの議論は極限の存在を仮定する点で、上の定理より弱い。

**類似の定理.** 極限と余極限は一般には交換しないが、有限の極限と**フィルター余極限**は $\mathbf{Set}$ の中で交換する（Mac Lane 第 IX 章 §2）。代数系（有限個の引数をとる演算と等式で定義される構造）の圏の忘却関手がフィルター余極限を創出し、とくに保存するのは、これを使って示される：演算 $X^{n}\to X$ は有限積からの写像で、$\mathbf{Set}$ では有限積がフィルター余極限と交換するので、台集合のフィルター余極限に演算がただ一通りに入る。

**高い視点から：RAPL.** 「右随伴は極限を保存する」（Right Adjoints Preserve Limits）は、圏論で最も使われる定理の一つである。具体的な計算では、ある関手が随伴の一方であることが分かれば、その関手と極限・余極限の交換が一斉に分かる。比喩で言えば、随伴は二つの世界の間の「通訳」で、右随伴の通訳は「共通部分をとる」操作（極限）を、左随伴の通訳は「寄せ集める」操作（余極限）を、意味を変えずに訳せる。どちら向きの通訳かによって、正確に訳せる操作の種類が決まっている。
:::

## 問題 {#cat:sec-al-problems}

::: problem {#cat:prob-continuous-from-products-equalizers}
$\mathbf{C}$ が完備で、$H\colon\mathbf{C}\to\mathbf{D}$ が小さい積と等化子を保存するなら、$H$ は連続であることを示せ。
:::

::: solution
小さい $F\colon\mathbf{J}\to\mathbf{C}$ の極限を、\ref{cat:limits-from-products-equalizers} の方法で積 $\prod_{j}Fj$, $\prod_{u}F(\operatorname{cod}u)$ と等化子 $m\colon L\to\prod_{j}Fj$ から作る（どの極限錐も同型を除いてこれと一致するので、この極限錐について示せばよい）。$H$ は積と射影を保存するので、$H(\prod_{j}Fj)$ は射影 $Hp_{j}$ とともに $\prod_{j}HFj$ であり、$H(\prod_{u}F(\operatorname{cod}u))$ も同様である。このとき $Hf,Hg$ は、$HF$ について同じ定理で作る射 $f,g$ になる（射影との合成が $H$ で写したものになるため）。$H$ は等化子を保存するので、$Hm$ は $Hf,Hg$ の等化子である。ゆえに同定理を $\mathbf{D}$ と $HF$ に適用すると、$H\lambda_{j}=Hp_{j}\circ Hm$ は $HF$ の極限錐である。
:::

::: problem {#cat:prob-free-abelian-not-continuous}
集合 $X$ に $X$ が生成する自由可換群 $\mathbb{Z}^{(X)}$ を対応させる関手 $\mathbf{Set}\to\mathbf{Ab}$ は連続でないことを示せ。
:::

::: solution
$\mathbf{Set}$ の終対象 $\{0\}$（空の積）の行き先は $\mathbb{Z}^{(\{0\})}\cong\mathbb{Z}$ である。$\mathbf{Ab}$ の終対象は零群で、$\mathbb{Z}$ は零群と同型でないので、この関手は空の積を保存しない。ゆえに連続でない。
:::
