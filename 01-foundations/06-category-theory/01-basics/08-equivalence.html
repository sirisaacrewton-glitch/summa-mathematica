# 反射部分圏と圏同値 {#cat:page-equivalence keywords="reflective subcategory, reflector, coreflective subcategory, full and faithful right adjoints, counit is epi, adjoint equivalence, equivalence of categories, skeleton, essentially surjective"}

随伴 $F\dashv G$ の右随伴 $G$ がどれだけ「単射的」かは、余単位 $\varepsilon$ の性質で測れる：$G$ が忠実であることは $\varepsilon$ の成分がエピ射であることと、充満忠実であることは $\varepsilon$ が同型であることと同値である（\ref{cat:right-adjoint-full-faithful}）。部分圏の包含が左随伴をもつとき、その部分圏を**反射的**という（\ref{cat:reflective-subcategory}）。アーベル化は群の圏の中の可換群の圏への反射である。後半では、圏同値（\ref{cat:equivalence-of-categories}）が「充満忠実かつ本質的全射」と同値で、さらに単位と余単位がともに同型である随伴（**随伴同値**）に改良できることを示す（\ref{cat:equivalence-characterization}）。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 IV 章 §3–§4。

## 記法と定義の確認 {#cat:sec-eqv-notation}

::: notation
- 随伴、単位と余単位、三角等式、普遍射からの左随伴の構成は \ref{cat:page-adjunctions} のとおり（\ref{cat:adjunction}, \ref{cat:triangle-identities}, \ref{cat:adjunction-equivalent-forms}, \ref{cat:adjunction-from-universal}）。
- 圏同値、充満・忠実、本質的全射、圏同値は充満忠実であること（\ref{cat:equivalence-of-categories}, \ref{cat:full-faithful}, \ref{cat:equivalence-fully-faithful}）、モノ射・エピ射・分裂は \ref{cat:monic-epic} のとおり。
- 圏はすべて局所小とする。
:::

## 右随伴が充満・忠実である条件 {#cat:sec-eqv-full-faithful}

::: theorem 右随伴の充満性・忠実性と余単位 {#cat:right-adjoint-full-faithful keywords="a right adjoint is faithful iff counits are epi, full iff counits are split monic, fully faithful iff counit is an isomorphism" index="右随伴の充満忠実性|みぎずいはんのじゅうまんちゅうじつせい"}
随伴 $(F,G,\eta,\varepsilon)\colon\mathbf{X}\rightharpoonup\mathbf{A}$（$F\dashv G$）について次が成り立つ。
1. $G$ が忠実であることと、すべての $\varepsilon_{a}$ がエピ射であることは同値。
2. $G$ が充満であることと、すべての $\varepsilon_{a}$ が分裂モノであることは同値。
3. したがって、$G$ が充満忠実であることと、$\varepsilon$ が自然同型であることは同値。

双対的に、$F$ が充満忠実であることと、$\eta$ が自然同型であることは同値。
:::

::: intuition
右随伴が射を区別する（忠実）か、射をすべて拾う（充満）かは、余単位の成分を見ればわかる。右随伴が充満忠実であることは、余単位がすべて同型であることと同じである。
:::

::: proof
**Step 1（鍵の等式）.** $a,c\in\mathbf{A}$ について、合成
$$
\mathbf{A}(a,c)\xrightarrow{\ G_{a,c}\ }\mathbf{X}(Ga,Gc)\xrightarrow{\ \varphi^{-1}\ }\mathbf{A}(FGa,c)
$$
を考える。【主張：この合成は $h\mapsto h\circ\varepsilon_{a}$ に等しい。ゆえに $G_{a,c}$ が単射（全射）であることと、$h\mapsto h\circ\varepsilon_{a}$ が単射（全射）であることは同値】 実際、\ref{cat:triangle-identities.2} と $\varepsilon$ の自然性から $\varphi^{-1}(Gh)=\varepsilon_{c}\circ FGh=h\circ\varepsilon_{a}$ である。$\varphi^{-1}$ は全単射なので、後半が従う。

**Step 2（1）.** 【主張：$G$ が忠実 $\iff$ すべての $\varepsilon_{a}$ がエピ射】 $G$ が忠実であることは、すべての $a,c$ で $G_{a,c}$ が単射であることである。Step 1 から、これは「すべての $a,c$ で $h\mapsto h\circ\varepsilon_{a}$ が単射」と同値で、後者は各 $\varepsilon_{a}$ がエピ射であることの定義そのものである。

**Step 3（2）.** 【主張：$G$ が充満 $\iff$ すべての $\varepsilon_{a}$ が分裂モノ】 Step 1 から、$G$ が充満であることは「すべての $a,c$ で $h\mapsto h\circ\varepsilon_{a}$ が全射」と同値である。これが成り立つなら、$c=FGa$ とおいて $1_{FGa}=h_{0}\circ\varepsilon_{a}$ となる $h_{0}\colon a\to FGa$ をとれる。ゆえに $\varepsilon_{a}$ は分裂モノである。逆に $r\circ\varepsilon_{a}=1_{FGa}$ となる $r$ があるなら、任意の $k\colon FGa\to c$ は $k=(k\circ r)\circ\varepsilon_{a}$ と書けるので、全射である。

**Step 4（3）.** 【主張：$G$ が充満忠実 $\iff$ $\varepsilon$ が自然同型】 1, 2 から、$G$ が充満忠実であることは、すべての $\varepsilon_{a}$ がエピ射かつ分裂モノであることと同値である。\ref{cat:monic-epic-basic.4} から、エピ射かつ分裂モノである射は同型射であり、逆に同型射はエピ射かつ分裂モノである。自然変換が自然同型であることは、成分がすべて同型であることと同じなので、主張が従う。

**双対.** 反対圏をとると、$F^{\mathrm{op}}$ が $G^{\mathrm{op}}$ の右随伴になり、その余単位は $\eta^{\mathrm{op}}$ になる（\ref{cat:duality-principle}）。$F$ が充満忠実であることと $F^{\mathrm{op}}$ が充満忠実であることは同値なので、3 から双対の主張が従う。
:::

## 反射部分圏 {#cat:sec-eqv-reflective}

::: definition 反射部分圏 {#cat:reflective-subcategory keywords="reflective subcategory, reflector, reflection, coreflective subcategory, coreflector" index="反射部分圏|はんしゃぶぶんけん, 反射子|はんしゃし, 余反射部分圏|よはんしゃぶぶんけん"}
圏 $\mathbf{B}$ の部分圏 $\mathbf{A}$ が**反射的**であるとは、包含関手 $K\colon\mathbf{A}\to\mathbf{B}$ が左随伴 $R\colon\mathbf{B}\to\mathbf{A}$（**反射子**）をもつことをいう。双対的に、$K$ が右随伴をもつとき**余反射的**という。
:::

::: intuition
大きな圏のどの対象にも、部分圏の中に「最良の近似」があるということ。群をアーベル化すると、その群から可換群への準同型がすべてアーベル化を経由する。
:::

::: proposition 反射部分圏の基本性質 {#cat:reflective-basic keywords="reflections via universal arrows; for full reflective subcategories the counit is an isomorphism" index="反射の特徴づけ|はんしゃのとくちょうづけ"}
1. $\mathbf{A}\subseteq\mathbf{B}$ が反射的であることと、各 $b\in\mathbf{B}$ に $\mathbf{A}$ の対象 $Rb$ と射 $\eta_{b}\colon b\to Rb$ があって、$\mathbf{A}$ の対象 $a$ への任意の射 $g\colon b\to a$ が、$\mathbf{A}$ の射 $f\colon Rb\to a$ により $g=f\circ\eta_{b}$ と一意に書けることは同値。
2. 反射の余単位 $\varepsilon_{a}\colon RKa\to a$ はエピ射である。$\mathbf{A}$ が充満部分圏なら、$\varepsilon$ は自然同型で、$Ra\cong a$（$a\in\mathbf{A}$）。
:::

::: proof
**1.** 条件は「各 $b$ に $b$ から $K$ への普遍射 $(Rb,\eta_{b})$ がある」ことの言い換えである。ゆえに \ref{cat:adjunction-from-universal} から、これは $K$ が左随伴をもつことと同値である。

**2.** 包含関手は忠実なので、\ref{cat:right-adjoint-full-faithful.1} から $\varepsilon_{a}$ はエピ射である。充満部分圏の包含は充満忠実なので、\ref{cat:right-adjoint-full-faithful.3} から $\varepsilon$ は自然同型であり、とくに $Ra=RKa\cong a$ である。
:::

::: example
1. **アーベル化.** $\mathbf{Ab}$ は $\mathbf{Grp}$ の反射的な充満部分圏で、反射子はアーベル化 $G\mapsto G^{\mathrm{ab}}$（\ref{cat:functor} の例 3）。商への全射 $p_{G}\colon G\to G^{\mathrm{ab}}$ が 1 の普遍射である：可換群 $A$ への準同型 $g\colon G\to A$ は交換子を潰すので、$G^{\mathrm{ab}}\to A$ を誘導し、$p_{G}$ が全射なので誘導される射は一意である。
2. **ねじれ部分群.** 可換群 $A$ の\term[位数]{grp:element-order}有限の元全体 $TA$ は部分群で、ねじれ群（すべての元の位数が有限な可換群）の充満部分圏は $\mathbf{Ab}$ の中で余反射的である（余反射子は $A\mapsto TA$）：ねじれ群 $B$ からの準同型 $B\to A$ の像は\term[位数]{grp:element-order}有限の元からなるので、$TA$ を経由する。
3. **完備化（事実）.** 距離空間と一様連続写像の圏の中で、完備距離空間の充満部分圏は反射的で、反射子は完備化である。完全正則ハウスドルフ空間の圏の中で、コンパクトハウスドルフ空間の充満部分圏は反射的で、反射子はストーン–チェックのコンパクト化である（Mac Lane 第 IV 章 §3。\see{top:page-stone-cech}）。完備化が反射になるのは射を一様連続写像にとるからで、連続写像の圏ではそうならない。
4. **半順序化.** 前順序と単調写像の圏の中で、半順序の充満部分圏は反射的：前順序 $P$ を同値関係 $p\le q\le p$ で割った半順序が反射（問題 \ref{cat:prob-partial-order-reflective}）。
:::

## 圏同値の特徴づけ {#cat:sec-eqv-equivalence}

::: definition 随伴同値 {#cat:adjoint-equivalence keywords="adjoint equivalence" index="随伴同値|ずいはんどうち"}
随伴 $(T,S,\eta,\varepsilon)$（$T\dashv S$）で、単位 $\eta$ と余単位 $\varepsilon$ がともに自然同型であるものを**随伴同値**という。
:::

::: intuition
二つの圏を行き来する関手の組で、行って戻ると元と同型になり、しかもその同型が随伴として整合しているもの。
:::

::: theorem 圏同値の特徴づけ {#cat:equivalence-characterization keywords="equivalence iff fully faithful and essentially surjective iff part of an adjoint equivalence" index="圏同値の特徴づけ|けんどうちのとくちょうづけ"}
関手 $S\colon\mathbf{A}\to\mathbf{C}$ について、次は同値である。
1. $S$ は圏同値である（\ref{cat:equivalence-of-categories}）。
2. $S$ はある随伴同値 $(T,S,\eta,\varepsilon)$ の右随伴である。
3. $S$ は充満忠実かつ本質的全射である。

3 ⇒ 2 には選択公理を使う。
:::

::: intuition
関手が圏同値であることは、射をちょうど一対一に移し（充満忠実）、どの対象も同型を除いて像に現れる（本質的全射）ことと同じである。このとき逆向きの関手は、随伴の形でとり直せる。
:::

::: proof
**2 ⇒ 1.** 随伴同値の単位と余単位は自然同型 $1_{\mathbf{C}}\cong ST$, $TS\cong1_{\mathbf{A}}$ を与えるので、$T$ は $S$ の擬逆であり、$S$ は圏同値である（定義から）。

**1 ⇒ 3.** \ref{cat:equivalence-fully-faithful} による。

**3 ⇒ 2, Step 1（普遍射）.** 本質的全射なので、各 $c\in\mathbf{C}$ に、対象 $T_{0}c\in\mathbf{A}$ と同型射 $\eta_{c}\colon c\to S(T_{0}c)$ を一つずつ選ぶ（選択公理）。【主張：$\eta_{c}$ は $c$ から $S$ への普遍射である】 $f\colon c\to Sa$ をとる。$f\circ\eta_{c}^{-1}\colon ST_{0}c\to Sa$ は、$S$ が充満なので $Sg$（$g\colon T_{0}c\to a$）と書け、$S$ が忠実なのでこの $g$ は一意である。$\eta_{c}$ が同型射なので、$f=Sg\circ\eta_{c}$ と $f\circ\eta_{c}^{-1}=Sg$ は同値である。ゆえに $g$ は $Sg\circ\eta_{c}=f$ を満たす唯一の射である。

**Step 2（随伴）.** 【主張：$T_{0}$ は関手 $T$ に延び、$T\dashv S$ で、単位 $\eta$ は自然同型】 Step 1 と \ref{cat:adjunction-from-universal} から、$T_{0}$ は一意に関手 $T$ に延び、$T\dashv S$ で単位は $\eta$ である。$\eta$ の成分はすべて同型なので、$\eta$ は自然同型である。

**Step 3（余単位）.** 【主張：余単位 $\varepsilon$ も自然同型で、$(T,S,\eta,\varepsilon)$ は随伴同値】 三角等式 $S\varepsilon_{a}\circ\eta_{Sa}=1_{Sa}$（\ref{cat:triangle-identities.3}）から、$S\varepsilon_{a}=\eta_{Sa}^{-1}$ は同型射である。$S$ は充満忠実なので同型射を反映し（\ref{cat:fully-faithful-reflects}）、$\varepsilon_{a}$ は同型射である。よって $\varepsilon$ は自然同型で、$(T,S,\eta,\varepsilon)$ は随伴同値である。

::: hypcheck
- **充満性・忠実性**：Step 1 で、$\eta_{c}$ の普遍性（存在と一意性）に使った。Step 3 では同型射の反映に再び使った。
- **本質的全射**：Step 1 で $\eta_{c}$ の存在に使った。
- **選択公理**：Step 1 で、$\mathbf{C}$ のすべての対象について同型を一斉に選んだ。$\mathbf{C}$ が大きいと、これは宇宙 $\mathcal{U}$ の部分集合で添字付けた選択で、$\ZFC$ の選択公理で足りる（$\mathbf{C}$ は宇宙の方法では集合なので）。
:::
:::

::: remark
随伴同値 $(T,S,\eta,\varepsilon)$ では、$(S,T,\varepsilon^{-1},\eta^{-1})$ も随伴になる。実際、三角等式 $\varepsilon T\cdot T\eta=1_{T}$, $S\varepsilon\cdot\eta S=1_{S}$ の両辺の逆をとると $T\eta^{-1}\cdot\varepsilon^{-1}T=1_{T}$, $\eta^{-1}S\cdot S\varepsilon^{-1}=1_{S}$ となり、これは $S\dashv T$（単位 $\varepsilon^{-1}$、余単位 $\eta^{-1}$）の三角等式である（\ref{cat:adjunction-equivalent-forms.3}）。したがって擬逆 $T$ は $S$ の左随伴であると同時に右随伴でもある。
:::

::: definition 骨格 {#cat:skeleton keywords="skeleton of a category, skeletal category" index="骨格|こっかく, 骨格的|こっかくてき"}
圏 $\mathbf{C}$ の充満部分圏 $\mathbf{A}$ で、$\mathbf{C}$ の各対象がちょうど一つの $\mathbf{A}$ の対象と同型であるものを、$\mathbf{C}$ の**骨格**という。同型な対象が等しい圏を**骨格的**という。
:::

::: intuition
同型な対象を一つの代表にまとめた部分圏のこと。同型類ごとに代表を一つずつ残し、射はそのまま残す。
:::

::: proposition 圏はその骨格と同値 {#cat:skeleton-equivalent keywords="every category has a skeleton and is equivalent to it; full subcategories meeting every isomorphism class are reflective" index="骨格との同値|こっかくとのどうち"}
1. （選択公理）すべての圏は骨格をもつ。
2. $\mathbf{A}\subseteq\mathbf{C}$ が充満部分圏で、$\mathbf{C}$ の各対象が $\mathbf{A}$ のある対象と同型なら、包含関手 $K$ は圏同値で、余単位が恒等変換である随伴同値 $(T,K,\eta,1)$ の一部になる。とくに $\mathbf{A}$ は反射的である。
3. 圏はその骨格と同値である。
:::

::: proof
**1.** 同型の関係 $\cong$ は $\operatorname{Ob}\mathbf{C}$ 上の同値関係である（\ref{cat:isomorphism-basic}）。各同値類から代表元を一つずつ選び（選択公理）、その全体を対象とする充満部分圏をとると、これは骨格である。

**2.** $K$ は充満忠実で本質的全射なので、\ref{cat:equivalence-characterization.3} ⇒ \ref[2]{cat:equivalence-characterization.2} を適用する。その Step 1 の選択で、$a\in\mathbf{A}$ については $T_{0}a\defeq a$, $\eta_{a}\defeq1_{a}$ と選んでおく。三角等式から $K\varepsilon_{a}=\eta_{Ka}^{-1}=1_{a}$ であり、$K$ は包含なので $\varepsilon_{a}=1_{a}$ である。$K$ が左随伴 $T$ をもつので、$\mathbf{A}$ は反射的である。

**3.** 1 の骨格に 2 を適用すればよい。
:::

::: example
1. 有限集合の圏 $\mathbf{Fin}$ の骨格として、有限順序数の充満部分圏 $\mathbf{FinOrd}$ がとれる（\ref{cat:equivalence-of-categories} の例）。
2. 体 $K$ 上の有限次元線形空間の圏の骨格として、$K^{n}$（$n\ge0$）の充満部分圏がとれ、これは行列の圏 $\mathbf{Mat}_{K}$（に対象 $0$ を加えたもの）と同型である。「有限次元の線形代数は行列の計算と同じ」ことの圏論的な表現である。
3. **双対定理（事実）.** ポントリャーギン双対（局所コンパクト可換群とその指標群）やゲルファント–ナイマルクの定理（コンパクトハウスドルフ空間と連続写像の圏と、単位的可換 C* 環と単位的 * 準同型の圏）は、ある圏と別の圏の反対圏の同値として述べられる（Mac Lane 第 IV 章 §4）。
:::

::: supplement
**前提を変えると.**
- *忠実だが充満でない右随伴.* 忘却関手 $U\colon\mathbf{Grp}\to\mathbf{Set}$ は忠実で、余単位 $\varepsilon_{G}\colon F(UG)\to G$（$G$ の元を生成元とする自由群から $G$ への標準的な全射）は全射なのでエピ射だが、一般には同型ではない（たとえば $G=\{e\}$ なら $F(UG)\cong\mathbb{Z}$）。「すべての群は自由群の商である」という事実は、この余単位が全射であることの言い換えである。
- *選択公理なしの圏同値.* 選択公理がないと、「充満忠実かつ本質的全射」から擬逆が作れないことがある。そのため、選択公理を仮定しない圏論（構成的な圏論、\term[ホモトピー型理論]{logic:page-hott}の中の圏論）では、二つの概念を区別して扱う。

**類似の定理.** 反射部分圏は「最良の近似で $\mathbf{A}$ に入れる」方法を与える。次のように、「ある性質をもつ最良のもの」を作る構成の多くは反射である。ただし、どの圏の中での反射かが本質的である。
- 層化：位相空間上の前層の圏の中の、層の充満部分圏への反射。
- $T_{0}$ 化（コルモゴロフ商）：$\mathbf{Top}$ の中の、$T_{0}$ 空間の充満部分圏への反射（\see{cat:prob-adt-kolmogorov}）。
- 可換化（アーベル化）：$\mathbf{Grp}$ の中の $\mathbf{Ab}$ への反射（上の例 1）。
- 完備化：距離空間と**一様連続写像**の圏の中の、完備距離空間の充満部分圏への反射（上の例 3）。連続写像の圏では反射にならない。

**高い視点から：圏同値は「同型の同型」.** 対象の同型は「名前の付け替え」、圏の同型は「対象と射の名前の付け替え」だが、圏同値は「同型な対象を区別しない」水準での同じさである。比喩で言えば、骨格は辞書の見出し語の一覧で、元の圏は同じ意味の言い換えをすべて並べた辞書である。どちらを使っても、言える内容（圏論的な性質）は変わらない。圏論的な性質とは、圏同値で保たれる性質のことで、「対象の個数」のように同値で保たれない性質は、圏論的でない性質である。
:::

## 問題 {#cat:sec-eqv-problems}

::: problem {#cat:prob-skeletons-isomorphic}
圏 $\mathbf{C}$ の二つの骨格 $\mathbf{A}_{1},\mathbf{A}_{2}$ は圏として同型であることを示せ。
:::

::: solution
各 $a\in\mathbf{A}_{1}$ に、$a$ と同型な $\mathbf{A}_{2}$ の唯一の対象 $\theta a$ と、同型射 $e_{a}\colon a\to\theta a$ を選ぶ。$f\colon a\to a'$ に $\theta f\defeq e_{a'}\circ f\circ e_{a}^{-1}$ を対応させると、$\theta$ は関手である（$\theta(f'\circ f)=e_{a''}\circ f'\circ e_{a'}^{-1}\circ e_{a'}\circ f\circ e_{a}^{-1}=\theta f'\circ\theta f$。\ref{cat:equivalence-of-categories} の例と同じ計算）。対象について、$\theta$ は単射である：$\theta a=\theta a'$ なら $a\cong\theta a=\theta a'\cong a'$ であり、$\mathbf{A}_{1}$ は骨格なので $a=a'$ である。また全射である：$b\in\mathbf{A}_{2}$ と同型な $\mathbf{A}_{1}$ の対象 $a$ をとると $\theta a\cong a\cong b$ であり、$\mathbf{A}_{2}$ は骨格なので $\theta a=b$ である。射について、骨格は充満なので hom 集合は $\mathbf{C}$ と同じであり、$f\mapsto e_{a'}\circ f\circ e_{a}^{-1}$ は $\mathbf{C}(a,a')\to\mathbf{C}(\theta a,\theta a')$ の全単射である（逆は $g\mapsto e_{a'}^{-1}\circ g\circ e_{a}$）。ゆえに \ref{cat:isomorphism-of-categories} から $\theta$ は圏の同型である。
:::

::: problem {#cat:prob-partial-order-reflective}
前順序と単調写像の圏 $\mathbf{Preord}$ の中で、半順序の充満部分圏 $\mathbf{Pos}$ が反射的であることを示せ。
:::

::: solution
前順序 $P$ に、$p\approx q\iff(p\le q\land q\le p)$ による商 $P/{\approx}$ に $[p]\le[q]\iff p\le q$（代表元によらない）を入れたものを対応させ、$\eta_{P}\colon P\to P/{\approx}$ を商への全射 $p\mapsto[p]$ とする。$[p]\le[q]$ が代表元によらないのは、$p\approx p'$, $q\approx q'$ なら推移律から $p\le q\iff p'\le q'$ となるからである。$P/{\approx}$ の順序は $P$ から反射律と推移律を受け継ぎ、$[p]\le[q]\le[p]$ なら $p\approx q$ すなわち $[p]=[q]$ なので反対称律も満たす。ゆえに $P/{\approx}$ は半順序で、$\eta_{P}$ は単調である。半順序 $Q$ への単調写像 $g\colon P\to Q$ をとる。$p\approx q$ なら $g(p)\le g(q)\le g(p)$ であり、反対称律から $g(p)=g(q)$ である。よって $\bar{g}([p])\defeq g(p)$ は代表元によらず定まり、$[p]\le[q]$ なら $p\le q$ から $\bar{g}([p])\le\bar{g}([q])$ なので単調で、$g=\bar{g}\circ\eta_{P}$ を満たす。$\eta_{P}$ は全射なので、このような $\bar{g}$ は一意である。ゆえに \ref{cat:reflective-basic.1} から $\mathbf{Pos}$ は反射的である。
:::
