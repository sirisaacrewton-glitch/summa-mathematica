# リボン圏とタングル {#cat:page-ribbon-tangles keywords="twist, balanced braided category, ribbon category, tangles, Temperley-Lieb category, Kauffman bracket, Reidemeister moves, writhe, Jones polynomial, Reshetikhin-Turaev"}

組紐をもつ剛性モノイダル圏に、線の「ねじれ」$\theta$ を加えたものが**リボン圏**で、そのストリング図式は帯（リボン）の図式として 3 次元のアイソトピーで不変になる。結び目や絡み目は「入力も出力もない」図式なので、リボン圏の中で値（スカラー）をもち、結び目の不変量が得られる。本ページでは、具体的なリボン構造の源として**テンパリー–リーブ圏**と**カウフマン括弧**の組紐を構成し、ライデマイスター移動での不変性を計算で確かめて**ジョーンズ多項式**を導く。

> カウフマン括弧は L. Kauffman (1987) による。

## 記法と定義の確認 {#cat:sec-tng-notation}

::: notation
- 厳密なモノイダル圏、ストリング図式、カップとキャップ、交差とライデマイスター移動は \ref{cat:string-diagram}, \ref{cat:cups-caps}, \ref{cat:crossings-reidemeister}。組紐モノイダル圏とヤン–バクスター方程式は \ref{cat:braided-monoidal}, \ref{cat:yang-baxter}。右双対・左双対・ピボタル構造・トレースは \ref{cat:right-left-dual}, \ref{cat:pivotal-trace}。
- $k\defeq\mathbb{Z}[A,A^{-1}]$（ローラン多項式環）、$\delta\defeq-A^{2}-A^{-2}\in k$。
- **選択公理**：使わない。
:::

## リボン圏 {#cat:sec-tng-ribbon}

::: definition リボン圏 {#cat:ribbon-category keywords="twist, balanced category, ribbon category" index="ねじれ（リボン圏）|ねじれりぼんけん, リボン圏|りぼんけん"}
剛性な組紐モノイダル圏 $(\mathbf{M},\otimes,I,\gamma)$ の**ねじれ**とは、自然同型 $\theta_{a}:a\to a$ で
$$
\theta_{a\otimes b}=\gamma_{b,a}\circ\gamma_{a,b}\circ(\theta_{a}\otimes\theta_{b}),\qquad\theta_{I}=1_{I},\qquad(\theta_{a})^{*}=\theta_{a^{*}}
$$
をみたすものをいう。ねじれをもつ剛性な組紐モノイダル圏を**リボン圏**という。図式では $\theta_{a}$ は線 $a$ を帯とみたときの $2\pi$ の回転で、第一式は「二本の帯をまとめて一回ねじることは、一本ずつねじって全体を一周させることと同じ」を表す。
:::

::: example
1. 対称な剛性モノイダル圏で $\theta=1$ とするとリボン圏（第一式は $\gamma_{b,a}\gamma_{a,b}=1$）。たとえば有限次元ベクトル空間の圏。
2. 超ベクトル空間の圏（符号つきの対称性）でも $\theta=1$ はリボン構造。$\theta_{V}=(-1)^{|v|}$（パリティ）もリボン構造で、こちらでは量子次元が通常の次元になる（\ref{cat:pivotal-trace} の例 2 と比べよ）。
3. リボン圏は自然にピボタルかつ球面的になることが知られている（組紐とねじれから $a\cong a^{**}$ を作る。本サイト未収録）。
:::

## テンパリー–リーブ圏 {#cat:sec-tng-tl}

::: definition テンパリー–リーブ圏 {#cat:temperley-lieb keywords="Temperley-Lieb category: planar matchings, composition by stacking, loops evaluate to delta" index="テンパリー–リーブ圏|てんぱりーりーぶけん"}
$n,m\in\mathbb{N}$ について、帯 $\mathbb{R}\times[0,1]$ の下端に $n$ 点、上端に $m$ 点を並べ、これら $n+m$ 点を交わらない弧で対にしたもの（**平面的な対合わせ**。アイソトピーで同じものは同一視）の集合を $P(n,m)$ とする（$n+m$ が奇数なら空）。**テンパリー–リーブ圏** $\mathbf{TL}$ は、対象を $\mathbb{N}$、$\mathbf{TL}(n,m)$ を $P(n,m)$ を基底とする自由 $k$ 加群とし、合成を「$D\in P(n,m)$ の上に $E\in P(m,l)$ を積み、中央の $m$ 点でつないで、できた閉じた輪 $c$ 個を消して $\delta^{c}$ を掛ける」の $k$ 双線形な延長とする。テンソル積は横の並置（$n\otimes m=n+m$）。
:::

::: proposition テンパリー–リーブ圏の構造 {#cat:temperley-lieb-structure keywords="TL is a strict monoidal k-linear category; the object 1 is self-dual; e = coev ev satisfies e^2 = delta e and e_1 e_2 e_1 = e_1" index="テンパリー–リーブ代数|てんぱりーりーぶだいすう"}
1. $\mathbf{TL}$ は $k$ 線形な厳密モノイダル圏。
2. 対象 $1$ は自己双対：$\cup\in P(0,2)$ を $\mathrm{coev}$、$\cap\in P(2,0)$ を $\mathrm{ev}$ とするとジグザグ等式が成り立つ。$\cap\circ\cup=\delta\cdot1_{0}$。
3. $e\defeq\cup\circ\cap\in\mathbf{TL}(2,2)$ について $e^{2}=\delta e$。$\mathbf{TL}(3,3)$ で $e_{1}\defeq e\otimes1_{1}$, $e_{2}\defeq1_{1}\otimes e$ とすると $e_{1}e_{2}e_{1}=e_{1}$, $e_{2}e_{1}e_{2}=e_{2}$。
:::

::: proof
**Step 1（1）.** 積み重ねた図形は、輪を除けば再び平面的な対合わせで（交わらない弧をつないでも交わらない）、三つを積む順序によらず同じ図形・同じ輪の個数になるので、合成は結合的。恒等射は縦の $n$ 本の線。並置は合成と両立し（輪の個数は加法的）、厳密に結合的。

**Step 2（2）.** ジグザグ $(1_{1}\otimes\cap)(\cup\otimes1_{1})$ は、S 字に曲がった 1 本の弧で、輪はできないので、アイソトピーで縦の線 $1_{1}$ と同じ。$\cap\circ\cup$ は 1 個の輪だけなので $\delta$。

**Step 3（3）.** $e^{2}=\cup\circ(\cap\circ\cup)\circ\cap=\delta e$。$e_{1}e_{2}e_{1}$ は、図形をたどると輪ができず、$e_{1}$ と同じ対合わせになる（中央の弧はジグザグでまっすぐになる）。$e_{2}e_{1}e_{2}$ も対称。
:::

## カウフマン括弧と組紐 {#cat:sec-tng-kauffman}

::: definition カウフマンの交差 {#cat:kauffman-crossing keywords="Kauffman bracket crossing sigma = A + A^{-1} e" index="カウフマン括弧|かうふまんかっこ"}
$\sigma\defeq A\cdot1_{2}+A^{-1}\cdot e\in\mathbf{TL}(2,2)$、$\bar\sigma\defeq A^{-1}\cdot1_{2}+A\cdot e$ とする。図式では、上を越える交差を、二通りの「ほどき方」（縦に分ける $1_{2}$ と横に分ける $e$）の重みつき和に置き換えている。
:::

::: theorem ライデマイスター移動 {#cat:kauffman-reidemeister keywords="the Kauffman crossing satisfies Reidemeister II and III in TL, and a kink equals -A^3" index="カウフマン括弧の不変性|かうふまんかっこのふへんせい"}
1. （第 II 移動）$\sigma\bar\sigma=\bar\sigma\sigma=1_{2}$。
2. （第 III 移動）$\mathbf{TL}(3,3)$ で $\sigma_{1}\defeq\sigma\otimes1_{1}$, $\sigma_{2}\defeq1_{1}\otimes\sigma$ とすると $\sigma_{1}\sigma_{2}\sigma_{1}=\sigma_{2}\sigma_{1}\sigma_{2}$。
3. （第 I 移動のずれ）$(1_{1}\otimes\cap)(\sigma\otimes1_{1})(1_{1}\otimes\cup)=-A^{3}\cdot1_{1}$、$\bar\sigma$ では $-A^{-3}\cdot1_{1}$。
:::

::: proof
**Step 1（1）.** $e^{2}=\delta e$ を使うと
$$
\sigma\bar\sigma=1+A^{2}e+A^{-2}e+e^{2}=1+(A^{2}+A^{-2}+\delta)e=1.
$$
$\bar\sigma\sigma$ も同じ。

**Step 2（2）.** $a\defeq A$, $b\defeq A^{-1}$（$ab=1$）として、$e_{1}^{2}=\delta e_{1}$, $e_{1}e_{2}e_{1}=e_{1}$ を使って展開すると
$$
\begin{aligned}
\sigma_{1}\sigma_{2}\sigma_{1}&=a^{3}+a(2e_{1}+e_{2})+b(e_{1}e_{2}+e_{2}e_{1}+\delta e_{1})+b^{3}e_{1},\\
\sigma_{2}\sigma_{1}\sigma_{2}&=a^{3}+a(2e_{2}+e_{1})+b(e_{2}e_{1}+e_{1}e_{2}+\delta e_{2})+b^{3}e_{2}.
\end{aligned}
$$
差は $(a+b\delta+b^{3})(e_{1}-e_{2})$ で、$a+b\delta+b^{3}=A+A^{-1}(-A^{2}-A^{-2})+A^{-3}=0$。

**Step 3（3）.** $(1\otimes\cap)(1_{2}\otimes1)(1\otimes\cup)$ は縦の線に 1 個の輪が付いたもので $\delta\cdot1_{1}$、$(1\otimes\cap)(e\otimes1)(1\otimes\cup)$ はジグザグでまっすぐな線 $1_{1}$。よって値は $A\delta+A^{-1}=-A^{3}$。$\bar\sigma$ では $A^{-1}\delta+A=-A^{-3}$。
:::

::: remark テンパリー–リーブ圏のリボン構造（本サイト未収録）
$\sigma$ を対象 $1,1$ の組紐とし、一般の対象の組紐を $\sigma$ の積で定めると、$\mathbf{TL}$ は組紐モノイダル圏になり、ねじれ $\theta_{1}=-A^{3}$（の符号を調整したもの）でリボン圏になることが知られている。上の定理はその核心（組紐の可逆性とヤン–バクスター方程式）にあたる。組紐の自然性（カップ・キャップを交差の向こうへすべらせること）も、同様の有限の計算で確かめられる。
:::

## ジョーンズ多項式 {#cat:sec-tng-jones}

::: definition カウフマン括弧と正規化 {#cat:kauffman-bracket keywords="Kauffman bracket of a link diagram, writhe, normalized bracket f(D)" index="ねじれ数|ねじれすう, カウフマン括弧（絡み目）|かうふまんかっこからみめ"}
平面上の絡み目の図式 $D$（有限個の交点で、各交点で上下が指定された閉曲線の族）について、各交点を \ref{cat:kauffman-crossing} の二通りにほどいたすべての**状態** $s$ をとり、
$$
\langle D\rangle\defeq\sum_{s}A^{\alpha(s)-\beta(s)}\,\delta^{\lvert s\rvert-1}
$$
とおく（$\alpha(s)$, $\beta(s)$ は $1_{2}$ 型・$e$ 型にほどいた交点の数、$\lvert s\rvert$ はほどいた結果の輪の数）。向きのついた $D$ について、交点の符号（右手系で $+1$）の和を**ねじれ数** $w(D)$ とし、$f(D)\defeq(-A^{3})^{-w(D)}\langle D\rangle$ とおく。
:::

::: theorem 絡み目の不変量 {#cat:jones-invariant keywords="the normalized Kauffman bracket is invariant under Reidemeister moves, hence a link invariant; Jones polynomial" index="ジョーンズ多項式|じょーんずたこうしき"}
$f(D)$ はライデマイスター移動 I・II・III で不変。したがって、ライデマイスターの定理（同じ絡み目の図式は移動の有限列で移りあう。本サイト未収録）のもとで、$f$ は向きのついた絡み目の不変量で、$V(t)\defeq f(D)|_{A=t^{-1/4}}$ を**ジョーンズ多項式**という。
:::

::: proof
**Step 1（局所性）.** $\langle D\rangle$ は、$D$ の一部分（円板の中）を $\mathbf{TL}$ の元に置き換えて計算できる：円板の境界の $2n$ 点について、円板の中の状態の和は $\mathbf{TL}(n,n)$ の元（平面的な対合わせの $k$ 係数の和。輪は $\delta$）で、外側の状態と合わせると全体の状態の和になる。よって、円板の中の二つの図式が $\mathbf{TL}$ で同じ元を与えれば $\langle D\rangle$ は等しい。

**Step 2（II・III）.** 第 II・III 移動は円板の中の置き換えで、\ref{cat:kauffman-reidemeister.1}・\ref[2]{cat:kauffman-reidemeister.2} から $\langle D\rangle$ は不変。交点の符号の和も変わらない（第 II 移動は符号の逆な二つの交点を消し、第 III 移動は交点の符号を保つ）。第 III 移動の他の向き・上下の組み合わせは、第 II 移動と上の形の組み合わせで得られることが知られている。

**Step 3（I）.** 第 I 移動（輪の付いたねじれを消す）は、3 から $\langle D\rangle$ を $-A^{\pm3}$ 倍し、同時に $w(D)$ を $\pm1$ だけ変える。正規化の因子 $(-A^{3})^{-w}$ がちょうど打ち消す。
:::

::: example ジョーンズ多項式の計算 {#cat:jones-examples}
組紐 $\beta\in B_{2}$ の閉包（上端と下端をつなぐ）の括弧は、$\mathbf{TL}(2,2)$ の元 $x\cdot1_{2}+y\cdot e$ の閉包 $(x\delta^{2}+y\delta)/\delta$ で計算できる（$1_{2}$ の閉包は 2 個の輪、$e$ の閉包は 1 個の輪）。
1. **ホップ絡み目** $\overline{\sigma^{2}}$：$\sigma^{2}=A^{2}+2e+A^{-2}e^{2}=A^{2}+(2+A^{-2}\delta)e$ から $\langle D\rangle=-A^{4}-A^{-4}$、$w=2$ で $f=-A^{-2}-A^{-10}$、$V(t)=-t^{1/2}-t^{5/2}$。
2. **三葉結び目** $\overline{\sigma^{3}}$：$\langle D\rangle=-A^{5}-A^{-3}+A^{-7}$、$w=3$ で $f=A^{-4}+A^{-12}-A^{-16}$、$V(t)=t+t^{3}-t^{4}$。
3. **鏡像**：交点の上下をすべて入れ替えると $A\leftrightarrow A^{-1}$（$t\leftrightarrow t^{-1}$）になる。三葉結び目の $V$ は $t\leftrightarrow t^{-1}$ で不変でないので、三葉結び目は鏡像と同じでない（ライデマイスターの定理のもとで）。

（これらの計算は計算機代数システムで検算した。）
:::

::: remark タングルの圏とレシェティキン–チューラエフの定理（本サイト未収録）
向きとフレーム（帯の幅の方向）のついたタングル（帯 $\mathbb{R}^{2}\times[0,1]$ の中の、端点を上下の面にもつ曲線の族）のアイソトピー類は、端点の符号列を対象とするリボン圏 $\mathbf{Tang}$ をなし、$\mathbf{Tang}$ は 1 つの対象から生成される自由なリボン圏である（V. Turaev, 1989; N. Reshetikhin–V. Turaev, 1990）。したがって、リボン圏 $\mathbf{M}$ の対象 $a$ を一つ選ぶと、リボン関手 $\mathbf{Tang}\to\mathbf{M}$ が一意に定まり、絡み目（端点のないタングル）に $\operatorname{End}(I)$ の元を対応させる不変量が得られる。上のジョーンズ多項式は、量子群 $U_{q}(\mathfrak{sl}_{2})$ の 2 次元表現（あるいはテンパリー–リーブ圏の対象 $1$）の場合にあたる。
:::

::: hypcheck
- **選択公理**：使わない。
- **$\delta=-A^{2}-A^{-2}$**：第 II 移動（Step 1。$\sigma$ の逆が上下を入れ替えた交差 $\bar\sigma$ になること）と第 III 移動（$a+b\delta+b^{3}=0$）でちょうどこの値が必要になる。
- 絡み目の不変量であることは、ライデマイスターの定理（本サイト未収録）に依存する。本ページで証明したのは「三つの移動で $f(D)$ が不変」という部分。
:::

::: supplement
**計算の観点.** 状態和の定義では $2^{c}$ 個（$c$ は交点の数）の状態を数えるので指数時間。組紐の閉包として表せば $\mathbf{TL}(n,n)$（次元はカタラン数 $C_{n}$）の中の積で計算できる。ジョーンズ多項式の計算は一般に #P 困難であることが知られている（F. Jaeger–D. Vertigan–D. Welsh, 1990。本サイト未収録）が、交点の数を固定した木幅の小さい図式では多項式時間で計算できる。

**前提を変えると.** $\delta$ を $k$ の一般の元にした $\mathbf{TL}$ も $k$ 線形な剛性モノイダル圏だが、$\sigma\bar\sigma=1+(A^{2}+A^{-2}+\delta)e$ なので、$\bar\sigma$ が $\sigma$ の逆になる（交差の上下の入れ替えが逆を与える）のは $\delta=-A^{2}-A^{-2}$ のときに限る。第 III 移動も同じ条件で成り立つ。
:::

## 高い視点 {#cat:sec-tng-viewpoint}

::: remark 結び目は「何も入らず何も出ない」射
リボン圏では、どの図式も射を表し、閉じた図式（絡み目）は $I\to I$、すなわちスカラーである。結び目の不変量とは、「空間の中の紐の絡み方」という幾何学的な対象を、代数（リボン圏の構造の公理）だけで評価したものである。比喩で言えば、リボン圏の公理は「紐を連続に動かしても計算結果が変わらない」ための最小限の交通規則で、テンパリー–リーブ圏はその規則を満たす具体的な計算機である。$U_{q}(\mathfrak{g})$ の表現圏（\ref{cat:page-hopf}）を使えば、ジョーンズ多項式の一般化（HOMFLY、カウフマン多項式など）が同じ枠組みで得られる。
:::

## 問題 {#cat:sec-tng-problems}

::: problem {#cat:prob-tng-unlink}
二つの輪が離れている図式（自明な 2 成分絡み目）の $f$ と $V$ を求め、ホップ絡み目と区別できることを確かめよ。
:::

::: solution
交点がないので状態は一つで、輪は 2 個：$\langle D\rangle=\delta^{2-1}=\delta=-A^{2}-A^{-2}$、$w=0$ で $f=-A^{2}-A^{-2}$、$V(t)=-t^{-1/2}-t^{1/2}$。ホップ絡み目の $V(t)=-t^{1/2}-t^{5/2}$（\ref{cat:jones-examples.1}）とは異なるので、（ライデマイスターの定理のもとで）ホップ絡み目はほどけない。
:::
