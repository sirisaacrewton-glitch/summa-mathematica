# モノイダル圏のモノイドと作用 {#cat:page-monoids-in-monoidal keywords="monoid in a monoidal category, monoid object, general associative law, free monoid in a monoidal category, tensor algebra, action of a monoid, module over a monoid, free action"}

モノイダル圏 $(\mathbf{B},\square,e)$（\ref{cat:page-monoidal}）の中で、乗法 $\mu\colon c\square c\to c$ と単位 $\eta\colon e\to c$ が結合と単位の等式を満たす対象を**モノイド**という（\ref{cat:monoid-object}）。集合の圏ではふつうのモノイド、アーベル群のテンソル積では環、自己関手の合成ではモナド（\see{cat:monad}）になる。本ページでは、コヒーレンス定理（\tref{cat:coherence}）を使って一般の結合律（\ref{cat:general-associative-law}）を示し、可算の余積が $\square$ と両立するとき**自由モノイド**が「すべての長さの積の余積」として作れること（\ref{cat:free-monoid-monoidal}）を示す。最後にモノイドの**作用**（加群の一般化）を扱う。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 VII 章 §3–§4。自由モノイドの構成で Mac Lane が「大きいが型どおりの図式」として略した結合律と普遍性の確認は、コヒーレンス定理に帰着させて補った。

## 記法と定義の確認 {#cat:sec-ma-notation}

::: notation
- モノイダル圏、結合子 $\alpha$、単位子 $\lambda,\varrho$、二項語、基本射、コヒーレンス定理は \ref{cat:monoidal-category}, \ref{cat:binary-words}, \ref{cat:coherence} のとおり。二項語 $v,w$（同じ長さ）の間の基本射の道の合成を、対象 $b$ を代入したものとして $\mathrm{can}_{b}(v,w)\colon v_{b}\to w_{b}$ と書く（道によらない）。$\mathrm{can}$ は基本射の合成なので、$b$ について自然である：$f\colon b\to b'$ について $w_{f}\circ\mathrm{can}_{b}=\mathrm{can}_{b'}\circ v_{f}$（$v_{f}$ は語の空欄に $f$ を、$e$ に $1_{e}$ を入れた射）。
- 左に括弧を寄せた冪を $b^{0}\defeq e$, $b^{1}\defeq b$, $b^{n+1}\defeq b^{n}\square b$ と書く。射についても同様に $f^{n}$。
- 余積・余極限の保存は \ref{cat:product}（の双対）, \ref{cat:preserve-limits}（の双対）のとおり。
:::

## モノイド {#cat:sec-ma-monoids}

::: definition モノイダル圏のモノイド {#cat:monoid-object keywords="monoid in a monoidal category, monoid object, morphism of monoids" index="モノイド（モノイダル圏の）|ものいどものいだるけんの, モノイド対象|ものいどたいしょう"}
モノイダル圏 $\mathbf{B}$ の**モノイド** $(c,\mu,\eta)$ は、対象 $c$ と射 $\mu\colon c\square c\to c$, $\eta\colon e\to c$ で
$$
\mu\circ(\mu\square1)\circ\alpha_{c,c,c}=\mu\circ(1\square\mu),\qquad\mu\circ(\eta\square1)=\lambda_{c},\qquad\mu\circ(1\square\eta)=\varrho_{c}
$$
を満たすものである。モノイドの**準同型** $f\colon(c,\mu,\eta)\to(c',\mu',\eta')$ は $f\mu=\mu'(f\square f)$, $f\eta=\eta'$ を満たす射。モノイドの圏を $\mathbf{Mon}(\mathbf{B})$ と書く。
:::

::: table モノイダル圏とそのモノイド {#cat:table-monoids}
| モノイダル圏 | モノイド |
|---|---|
| $(\mathbf{Set},\times,1)$ | ふつうのモノイド |
| $(\mathbf{Top},\times,\ast)$ | 位相モノイド |
| $(\mathbf{Ab},\otimes,\mathbb{Z})$ | 環（単位元をもつ） |
| $(K\text{-}\mathbf{Mod},\otimes_{K},K)$ | $K$ 代数 |
| 自己関手の圏（合成） | モナド（\see{cat:monad}） |
| $(\mathbf{B}^{\mathrm{op}},\square,e)$ | $\mathbf{B}$ の余モノイド（余代数など） |
| $(\mathbf{Cat},\times,\mathbf{1})$ | 厳密モノイダル圏 |
:::

::: proposition 一般の結合律 {#cat:general-associative-law keywords="general associative law for monoids in monoidal categories" index="一般結合律（モノイダル圏）|いっぱんけつごうりつものいだるけん"}
モノイド $(c,\mu,\eta)$ と二項語 $w$ について、$\mu_{w}\colon w_{c}\to c$ を $\mu_{e}\defeq\eta$, $\mu_{\mathtt{x}}\defeq1_{c}$, $\mu_{u\square v}\defeq\mu\circ(\mu_{u}\square\mu_{v})$ で定める。同じ長さの語 $v,w$ について
$$
\mu_{w}\circ\mathrm{can}_{c}(v,w)=\mu_{v}.
$$
:::

::: proof
$\mathrm{can}$ は基本射の合成なので、各基本射 $\beta\colon v\to w$ について $\mu_{w}\circ\beta=\mu_{v}$ を示せばよい（逆向きの基本射 $\beta^{-1}\colon w\to v$ については、$\mu_{w}\circ\beta=\mu_{v}$ の両辺に右から $\beta^{-1}$ を合成すれば $\mu_{w}=\mu_{v}\circ\beta^{-1}$ を得る）。$\beta$ の作り方に関する帰納法で示す。

**Step 1（囲まれた基本射）.** 【主張：$\beta'$ について等式が成り立てば、$\beta'\square1_{t}$ と $1_{t}\square\beta'$ についても成り立つ】 $\beta=\beta'\square1_{t}$（$\beta'\colon u\to u'$）なら、帰納法の仮定 $\mu_{u'}\beta'=\mu_{u}$ から $\mu_{u'\square t}\circ\beta=\mu\circ(\mu_{u'}\beta'\square\mu_{t})=\mu\circ(\mu_{u}\square\mu_{t})=\mu_{u\square t}$ となる。$1_{t}\square\beta'$ も同様である。

**Step 2（結合子）.** 【主張：$\mu_{(x\square y)\square z}\circ\alpha_{x,y,z}=\mu_{x\square(y\square z)}$】 $\alpha$ の自然性とモノイドの\term[結合律]{cat:monoid-object}から、次が成り立つ。
$$
\begin{aligned}
\mu_{(x\square y)\square z}\circ\alpha&=\mu\circ(\mu\square1)\circ((\mu_{x}\square\mu_{y})\square\mu_{z})\circ\alpha\\
&=\mu\circ(\mu\square1)\circ\alpha_{c,c,c}\circ(\mu_{x}\square(\mu_{y}\square\mu_{z}))\\
&=\mu\circ(1\square\mu)\circ(\mu_{x}\square(\mu_{y}\square\mu_{z}))=\mu_{x\square(y\square z)}.
\end{aligned}
$$

**Step 3（単位子）.** 【主張：$\mu_{x}\circ\lambda_{x_{c}}=\mu_{e\square x}$ かつ $\mu_{x}\circ\varrho_{x_{c}}=\mu_{x\square e}$】 $\lambda$ の自然性とモノイドの単位の等式から $\mu_{x}\circ\lambda_{x_{c}}=\lambda_{c}\circ(1_{e}\square\mu_{x})=\mu\circ(\eta\square1)\circ(1\square\mu_{x})=\mu_{e\square x}$ である。同様に $\varrho$ の自然性から $\mu_{x}\circ\varrho_{x_{c}}=\varrho_{c}\circ(\mu_{x}\square1_{e})=\mu\circ(1\square\eta)\circ(\mu_{x}\square1)=\mu_{x\square e}$ である。
:::

::: example
$\mu^{(n)}\defeq\mu_{w^{(n)}}\colon c^{n}\to c$（左に括弧を寄せた $n$ 重積）について、命題から
$$
\mu^{(n)}\circ(\mu^{(k_{1})}\square\cdots\square\mu^{(k_{n})})=\mu^{(k_{1}+\cdots+k_{n})}\circ\mathrm{can}
$$
が成り立つ（$\mathrm{can}$ は括弧の付け替え）。$\mathbf{Set}$ では、「$k_{1}+\cdots+k_{n}$ 個の積は、どこで区切って先に計算しても同じ」というふつうの一般結合律である。
:::

## 自由モノイド {#cat:sec-ma-free}

::: theorem モノイダル圏の自由モノイド {#cat:free-monoid-monoidal keywords="construction of free monoids in a monoidal category with countable coproducts preserved by tensoring, tensor algebra" index="自由モノイド（モノイダル圏）|じゆうものいどものいだるけん, テンソル代数|てんそるだいすう"}
モノイダル圏 $\mathbf{B}$ が可算の余積をもち、各対象 $a$ について $a\square-$ と $-\square a$ が可算の余積を保存するとする。このとき忘却関手 $U\colon\mathbf{Mon}(\mathbf{B})\to\mathbf{B}$ は左随伴をもつ。$a$ 上の自由モノイドは $Ta\defeq\coprod_{n\ge0}a^{n}$ で、乗法は「並べる」ことで与えられる。
:::

::: proof
余積の入射を $i_{n}\colon a^{n}\to Ta$ と書く。

**Step 1（分配）.** 【主張：$Ta\square Ta$ は、射の族 $i_{m}\square i_{n}$ を入射とする $a^{m}\square a^{n}$（$m,n\ge0$）の余積である。三つの積 $Ta\square(Ta\square Ta)$ や $e\square Ta$, $Ta\square e$ についても同様】 $-\square Ta$ は余積を保存するので、$Ta\square Ta$ は $i_{m}\square1_{Ta}$ を入射とする $a^{m}\square Ta$ の余積である。各 $a^{m}\square-$ も余積を保存するので、$a^{m}\square Ta$ は $1\square i_{n}$ を入射とする $a^{m}\square a^{n}$ の余積である。余積の余積は余積なので、合成 $(i_{m}\square1)\circ(1\square i_{n})=i_{m}\square i_{n}$ を入射として主張が従う。三つの積も同じ議論を繰り返せばよく、$e\square Ta$, $Ta\square e$ は $e\square-$, $-\square e$ が余積を保存することから従う。とくに $Ta\square Ta$ からの射は、成分 $a^{m}\square a^{n}\to\cdot$ で決まる。

**Step 2（乗法と単位）.** $\mu\colon Ta\square Ta\to Ta$ を成分
$$
\mu\circ(i_{m}\square i_{n})\defeq i_{m+n}\circ\mathrm{can}_{m,n},\qquad\mathrm{can}_{m,n}\colon a^{m}\square a^{n}\to a^{m+n}
$$
（括弧の付け替え。\ref{cat:coherence} により一つに決まる）で定め、$\eta\defeq i_{0}\colon e=a^{0}\to Ta$ とおく。【主張：$(Ta,\mu,\eta)$ はモノイドである】 Step 1 から、結合の等式の両辺を各成分 $a^{m}\square(a^{n}\square a^{k})$ で比べればよい。$\alpha$ の自然性で入射を外に出すと、両辺は $i_{m+n+k}$ に
$$
\mathrm{can}_{m+n,k}\circ(\mathrm{can}_{m,n}\square1)\circ\alpha\quad\text{と}\quad\mathrm{can}_{m,n+k}\circ(1\square\mathrm{can}_{n,k})
$$
を合成したものになる。どちらも $a^{m}\square(a^{n}\square a^{k})$ から $a^{m+n+k}$ への基本射の道の合成なので、コヒーレンス定理（\tref{cat:coherence}）から等しい。単位の等式 $\mu\circ(\eta\square1)=\lambda_{Ta}$ は、Step 1 から成分 $e\square a^{n}$ で比べればよい。$\lambda_{a^{n}}\colon e\square a^{n}\to a^{n}$ は基本射なので $\mathrm{can}_{0,n}=\lambda_{a^{n}}$ であり、$\lambda$ の自然性から
$$
\mu\circ(i_{0}\square i_{n})=i_{n}\circ\lambda_{a^{n}}=\lambda_{Ta}\circ(1_{e}\square i_{n})
$$
が成り立つ。右の単位の等式も、$\mathrm{can}_{m,0}=\varrho_{a^{m}}$ と $\varrho$ の自然性から同様である。

**Step 3（普遍射）.** モノイド $(c,\mu_{c},\eta_{c})$ と射 $f\colon a\to c$ について、$f'\colon Ta\to c$ を成分 $f'\circ i_{n}\defeq\mu_{c}^{(n)}\circ f^{n}$ で定める。【主張：$f'$ は $f'\circ i_{1}=f$ を満たす唯一のモノイドの準同型である。ゆえに $i_{1}\colon a\to UTa$ は普遍射である】
- *準同型であること.* 成分 $a^{m}\square a^{n}$ において $f'\circ\mu=\mu_{c}\circ(f'\square f')$ を示す。左辺は $\mu_{c}^{(m+n)}\circ f^{m+n}\circ\mathrm{can}_{m,n}=\mu_{c}^{(m+n)}\circ\mathrm{can}\circ(f^{m}\square f^{n})$（$\mathrm{can}$ の自然性）。右辺は $\mu_{c}\circ(\mu_{c}^{(m)}\square\mu_{c}^{(n)})\circ(f^{m}\square f^{n})=\mu_{c,w}\circ(f^{m}\square f^{n})$（$w=w^{(m)}\square w^{(n)}$）。一般の結合律（\ref{cat:general-associative-law}）$\mu_{c}^{(m+n)}\circ\mathrm{can}=\mu_{c,w}$ から、両辺は等しい。単位については $f'\circ\eta=f'\circ i_{0}=\mu_{c}^{(0)}=\eta_{c}$ である。
- *$f'\circ i_{1}=f$*：$\mu_{c}^{(1)}=1$ なので $f'\circ i_{1}=f^{1}=f$ である。
- *一意性.* 準同型 $g$ が $g\circ i_{1}=f$ を満たせば、$i_{n+1}=\mu\circ(i_{n}\square i_{1})$（$\mathrm{can}_{n,1}=1$、$a^{n+1}=a^{n}\square a$ なので）から、帰納法で $g\circ i_{n+1}=\mu_{c}\circ(g i_{n}\square g i_{1})=\mu_{c}\circ(\mu_{c}^{(n)}f^{n}\square f)=\mu_{c}^{(n+1)}f^{n+1}$ を得る。また $g$ は単位を保つので $g\circ i_{0}=g\eta=\eta_{c}$ である。ゆえに $g$ と $f'$ はすべての成分で一致し、余積の一意性から $g=f'$ である。

普遍射の族から左随伴が得られる（\ref{cat:adjunction-from-universal}）。

::: hypcheck
- **余積の保存**：Step 1 で、$Ta\square Ta$ や三重の積からの射を成分で決めるのに使った。保存しないと、乗法が成分から定まらない。
- **コヒーレンス定理**：Step 2 で、$\mathrm{can}$ が一つに決まることと結合の等式に使った。Mac Lane の「大きな図式」はこの一行に集約される。
- **一般の結合律**：Step 3 で、$f'$ が乗法を保つことに使った。
:::
:::

::: example
1. $\mathbf{Set}$ では $Ta=\bigsqcup_{n}a^{n}$ は語のモノイド（\ref{cat:free-monoid}）。
2. $K\text{-}\mathbf{Mod}$ では $Ta=\bigoplus_{n}a^{\otimes n}$ は**テンソル代数**で、$a$ 上の自由な $K$ 代数（結合的、単位元つき）。$a\otimes-$ は右随伴 $\mathrm{Hom}_{K}(a,-)$ をもつので余積を保存する。
:::

## 作用 {#cat:sec-ma-actions}

::: definition モノイドの作用 {#cat:monoid-action keywords="left action of a monoid in a monoidal category, module over a monoid" index="作用（モノイドの）|さようものいどの, 加群（モノイド上の）|かぐんものいどじょうの"}
モノイド $(c,\mu,\eta)$ の対象 $a$ への**左作用**は、射 $\nu\colon c\square a\to a$ で
$$
\nu\circ(1\square\nu)=\nu\circ(\mu\square1)\circ\alpha_{c,c,a},\qquad\nu\circ(\eta\square1)=\lambda_{a}
$$
を満たすものである。作用の射 $f\colon(a,\nu)\to(a',\nu')$ は $\nu'\circ(1\square f)=f\circ\nu$ を満たす射。左作用の圏を $c\text{-}\mathbf{Act}$ と書く。
:::

::: example
$(\mathbf{Set},\times)$ ではモノイドの集合への作用、$(\mathbf{Ab},\otimes)$ では環上の左加群。$\mu$ 自身は $c$ の自分自身への作用（左正則表現）。
:::

::: proposition 自由な作用 {#cat:free-action keywords="free action c tensor b, left adjoint to the forgetful functor from actions" index="自由な作用|じゆうなさよう"}
忘却関手 $c\text{-}\mathbf{Act}\to\mathbf{B}$ は左随伴 $b\mapsto(c\square b,\ \nu_{b})$、$\nu_{b}\defeq(\mu\square1)\circ\alpha_{c,c,b}$ をもつ。
:::

::: proof
**Step 1（作用であること）.** 【主張：$(c\square b,\nu_{b})$ は左作用である】 単位の等式は次のように確かめられる：$\nu_{b}\circ(\eta\square1_{c\square b})=(\mu\square1)\circ\alpha\circ(\eta\square1)=(\mu\square1)\circ((\eta\square1)\square1)\circ\alpha_{e,c,b}=(\lambda_{c}\square1)\circ\alpha_{e,c,b}=\lambda_{c\square b}$（最後の等号は \ref{cat:monoidal-derived-triangles}）。結合の等式については、$\square$ の関手性と $\alpha$ の自然性で $\mu$ を外に出すと、次が成り立つ。
$$
\begin{aligned}
\nu_{b}\circ(1\square\nu_{b})&=((\mu\circ(1\square\mu))\square1)\circ\alpha_{c,c\square c,b}\circ(1\square\alpha_{c,c,b}),\\
\nu_{b}\circ(\mu\square1)\circ\alpha_{c,c,c\square b}&=((\mu\circ(\mu\square1))\square1)\circ\alpha_{c\square c,c,b}\circ\alpha_{c,c,c\square b}.
\end{aligned}
$$
第一式にモノイドの結合律 $\mu\circ(1\square\mu)=\mu\circ(\mu\square1)\circ\alpha_{c,c,c}$ を代入すると、第一式の右辺は $((\mu\circ(\mu\square1))\square1)\circ(\alpha_{c,c,c}\square1)\circ\alpha_{c,c\square c,b}\circ(1\square\alpha_{c,c,b})$ となる。五角形の等式 $(c,c,c,b)$ から、これは第二式の右辺に等しい。

**Step 2（随伴）.** 【主張：作用の射 $c\square b\to a$ と $\mathbf{B}$ の射 $b\to a$ は、次の対応で自然に一対一に対応する】 射 $g\colon b\to a$（$(a,\nu)$ は作用）に $\hat{g}\defeq\nu\circ(1\square g)\colon c\square b\to a$ を、作用の射 $h\colon c\square b\to a$ に $\check{h}\defeq h\circ(\eta\square1)\circ\lambda_{b}^{-1}\colon b\to a$ を対応させる。
- $\hat{g}$ は作用の射：$\nu\circ(1\square\hat{g})=\nu\circ(1\square\nu)\circ(1\square(1\square g))=\nu\circ(\mu\square1)\circ\alpha\circ(1\square(1\square g))=\nu\circ(1\square g)\circ(\mu\square1)\circ\alpha=\hat{g}\circ\nu_{b}$（作用の結合の等式、$\alpha$ と $\square$ の自然性）。
- $\check{\hat{g}}=\nu\circ(1\square g)\circ(\eta\square1)\circ\lambda^{-1}=\nu\circ(\eta\square1)\circ(1\square g)\circ\lambda^{-1}=\lambda_{a}\circ(1\square g)\circ\lambda_{b}^{-1}=g$（$\lambda$ の自然性）。
- $\hat{\check{h}}=\nu\circ(1\square h)\circ(1\square(\eta\square1))\circ(1\square\lambda^{-1})=h\circ\nu_{b}\circ(1\square(\eta\square1))\circ(1\square\lambda^{-1})$（$h$ は作用の射）$=h\circ(\mu\square1)\circ((1\square\eta)\square1)\circ\alpha_{c,e,b}\circ(1\square\lambda^{-1})=h\circ(\varrho_{c}\square1)\circ\alpha_{c,e,b}\circ(1\square\lambda_{b}^{-1})=h$（単位律と三角形の等式）。

ゆえに二つの対応は互いに逆である。自然性は次のとおり。$k\colon b'\to b$ について $\widehat{g\circ k}=\nu\circ(1\square g)\circ(1\square k)=\hat{g}\circ(1_{c}\square k)$ であり、作用の射 $f\colon(a,\nu)\to(a',\nu')$ について $\widehat{f\circ g}=\nu'\circ(1\square f)\circ(1\square g)=f\circ\nu\circ(1\square g)=f\circ\hat{g}$ である。
:::

::: supplement
**一般化.** モノイドの右作用と、両側の作用（両側加群）も同様に定義できる。余等化子があれば、右作用 $b\square c\to b$ と左作用 $c\square a\to a$ から「テンソル積」$b\square_{c}a$ を二つの射 $b\square(c\square a)\rightrightarrows b\square a$ の余等化子として作れ、環上の加群のテンソル積 $\otimes_{R}$ の一般化になる（Mac Lane 第 VII 章 §4 演習 6）。モナドの代数（\see{cat:t-algebra}）は、本ページの意味の作用そのものではない。作用される $x$ が自己関手ではなく圏 $\mathbf{X}$ の対象だからである。正確には、自己関手の圏（合成で厳密モノイダル圏）が圏 $\mathbf{X}$ に $(S,x)\mapsto Sx$ で「作用」するとみて、その中のモノイド $T$ の $\mathbf{X}$ の対象 $x$ への作用 $Tx\to x$ を、\ref{cat:monoid-action} と同じ形の二つの等式で定めたものがモナドの代数である（Mac Lane 第 VII 章 §4 演習 1・2 の考え方）。

**類似の定理.** \ref{cat:free-monoid-monoidal} は、$\mathbf{Set}$ での語のモノイド、加群のテンソル代数、位相空間の自由位相モノイドなどを一度に与える。$(\mathbf{Top},\times,\ast)$ でも定理の仮定は満たされる：$X\times\coprod_{i}Y_{i}$ は互いに交わらない開集合 $X\times Y_{i}$ の和で、各 $X\times Y_{i}$ の部分空間の位相は積位相に一致するので、$X\times-$ は余積（直和）を保存する。ゆえに $\coprod_{n}X^{n}$ が $X$ 上の自由位相モノイドである。どれも「長さ $n$ の積を全部並べ、並べることで掛ける」という同じ形をしている。

**高い視点から：モノイドは「代数の型」の最小単位.** 環が「アーベル群の圏の中のモノイド」であるという見方は、代数的構造を「どのモノイダル圏の中で考えるか」と「その中でどの図式を課すか」に分解する。比喩で言えば、モノイダル圏は「材料と組み立て方の規格」、モノイドは「その規格で作れる最も単純な機械」であり、同じ設計図（モノイドの公理）が規格を変えるだけで群・環・代数・モナドとして実現する。
:::

## 問題 {#cat:sec-ma-problems}

::: problem {#cat:prob-ma-products}
$\mathbf{B}=(\mathbf{Set},\times,1)$ で、モノイド $(c,\mu,\eta)$ の定義はふつうのモノイドの定義と一致することを確かめよ。
:::

::: solution
$\mu(x,y)\defeq xy$ と書き、$\eta\colon1\to c$ をその値 $1_{c}\in c$ と同一視する。$\alpha(x,(y,z))=((x,y),z)$ なので、結合の等式を元 $(x,(y,z))$ で評価すると $(xy)z=x(yz)$ となる。$\lambda(\ast,y)=y$ なので、左の単位の等式を $(\ast,y)$ で評価すると $1_{c}y=y$ となり、右の単位の等式からは同様に $y1_{c}=y$ を得る。ゆえにモノイドの等式は、ふつうのモノイドの二つの条件（積の結合性と単位元の存在）と同じである。逆に、ふつうのモノイドから $\mu(x,y)=xy$, $\eta(\ast)=1_{c}$ とおけば同じ計算でモノイドになる。準同型の条件 $f\mu=\mu'(f\times f)$, $f\eta=\eta'$ は、積と単位元を保つことそのものである。
:::

::: problem {#cat:prob-ma-rings}
$(\mathbf{Ab},\otimes,\mathbb{Z})$ のモノイドが単位元をもつ環と同じであることを確かめよ。
:::

::: solution
テンソル積の普遍性から、$\mu\colon c\otimes c\to c$ は双線形写像 $c\times c\to c$、すなわち分配律を満たす積 $xy\defeq\mu(x\otimes y)$ と同じである。$\eta\colon\mathbb{Z}\to c$ は加法群の準同型なので、元 $1\defeq\eta(1)$ で決まる。$c\otimes(c\otimes c)$ は $x\otimes(y\otimes z)$ の形の元で生成されるので、結合の等式はそこで評価すれば十分で、$(xy)z=x(yz)$ と同じである。単位の等式を $n\otimes x$ で評価すると $(n1)x=nx$ で、これは $n=1$ の場合の $1x=x$ と同値である（双線形性から）。右も同様に $x1=x$ と同値である。逆に、単位元をもつ環からは $\mu(x\otimes y)=xy$、$\eta(n)=n1$ とおけばよい。
:::
