# 組紐群と組紐圏 {#cat:page-braids keywords="Artin braid group, braid relations, braid category, free braided monoidal category, Joyal-Street, coherence for braided monoidal categories, underlying braid, graded vector spaces with bicharacter braiding"}

対称モノイダル圏では、$\alpha,\lambda,\varrho,\gamma$ から組み立てた射は文字の**置換**だけで決まった（\ref{cat:symmetric-coherence-general}）。対称性 $\gamma_{b,a}\gamma_{a,b}=1$ を外した組紐モノイダル圏（\ref{cat:braided-monoidal}）では、置換の代わりに**組紐**が現れる。本ページでは、アルティンの**組紐群** $B_{n}$（\ref{cat:braid-group}）を生成元と関係で定義し、それらを集めた**組紐圏** $\mathbf{B}$ が組紐モノイダル圏であること（\ref{cat:braid-category-braided}）を示す。主定理は、$\mathbf{B}$ が一つの対象で生成される**自由な**厳密組紐モノイダル圏であること（\ref{cat:braid-category-free}、ジョイヤル–ストリート）と、組紐のコヒーレンス（\ref{cat:braided-coherence}）：$\alpha,\lambda,\varrho,\gamma$ から組み立てた二つの射がすべての組紐モノイダル圏で等しいのは、それらの組紐が等しいときに限る。

> 資料：Mac Lane, *Categories for the Working Mathematician* 第 XI 章 §4–§6。Mac Lane は組紐圏が組紐モノイダル圏であることを図で示すだけなので、組紐の関係式から代数的に確かめた（\ref{cat:braid-category-braided}）。また Mac Lane は $B_{n}$ を「相異なる $n$ 点の組の空間」の基本群としているが、これは順序つきの点の組なので、その基本群は純組紐群になる。$B_{n}$ は順序のない $n$ 点集合の空間の基本群である（Fox–Neuwirth, 1962 とされる）。本ページでは $B_{n}$ を生成元と関係で定義し、幾何的な解釈は直感のためだけに使う。コヒーレンス定理（Mac Lane の定理 2）は証明が書かれていないので、前ページの議論を組紐に移して証明した。

## 記法と定義の確認 {#cat:sec-br-notation}

::: notation
- 組紐モノイダル圏、六角形の等式 (H1)(H2)、厳密な場合の形、ヤン–バクスター方程式、組紐モノイダル関手は \ref{cat:braided-monoidal}, \ref{cat:yang-baxter}, \ref{cat:braided-monoidal-functor} のとおり。厳密化への組紐の移送、番号つき語、基本移動、基本射の共役は \ref{cat:braiding-strictification}, \ref{cat:labelled-words}, \ref{cat:symmetric-moves}, \ref{cat:basic-arrows-to-moves} のとおり。
- **群の表示.** 集合 $X$ と、$X$ の元とその逆の語の集合 $R$ について、$\langle X\mid R\rangle$ は $X$ 上の自由群を $R$ の正規閉包で割った群である。普遍性：群 $K$ の元 $k_{x}$（$x\in X$）が $R$ のすべての関係を満たせば、$x\mapsto k_{x}$ となる\term[準同型]{grp:homomorphism} $\langle X\mid R\rangle\to K$ がただ一つある。また二つの語が $\langle X\mid R\rangle$ で等しいことは、一方から他方へ、$xx^{-1}$, $x^{-1}x$ や $R$ の元とその逆を部分語として挿入・削除する操作を有限回行って移れることと同値である（正規閉包の定義から）。
- 対称群 $\mathfrak{S}_{n}$ と隣接互換 $t_{i}$ は \ref{cat:coxeter-presentation} のとおり。
:::

## 組紐群 {#cat:sec-br-group}

::: definition 組紐群 {#cat:braid-group keywords="Artin braid group, braid relations, pure braid group" index="組紐群|くみひもぐん, アルティンの組紐群|あるてぃんのくみひもぐん, 純組紐群|じゅんくみひもぐん"}
$n\ge1$ について、**組紐群** $B_{n}$ を
$$
B_{n}\defeq\bigl\langle\sigma_{1},\dots,\sigma_{n-1}\bigm|\sigma_{i}\sigma_{i+1}\sigma_{i}=\sigma_{i+1}\sigma_{i}\sigma_{i+1},\ \sigma_{i}\sigma_{j}=\sigma_{j}\sigma_{i}\ (|i-j|\ge2)\bigr\rangle
$$
で定める。$B_{0}=B_{1}$ は自明な群とする。$\sigma_{i}\mapsto t_{i}$ は\term[準同型]{grp:homomorphism} $\pi\colon B_{n}\to\mathfrak{S}_{n}$ を定め（隣接互換は二つの関係を満たす。\ref{cat:coxeter-presentation} の Step 2）、その核を**純組紐群**という。
:::

::: intuition
組紐群は、隣り合う二本の紐を交差させる操作を、組紐の関係と離れた交差の可換性だけを課して集めた群である。対称群と違い、同じ交差を 2 回しても元に戻らない。
:::

::: remark
直感的には、$B_{n}$ の元は、平面上の $n$ 点から出て時間とともに互いにぶつからずに動き、同じ $n$ 点の集合に戻る $n$ 本の紐（3 次元空間内の曲線）を、連続変形で同一視したものである。$\sigma_{i}$ は $i$ 番目の紐が $i+1$ 番目の紐の下（一方の側）をくぐって入れ替わる操作、$\sigma_{i}^{-1}$ は逆側をくぐる操作。組紐の関係は「三本の紐で、外側の二本を交差させる二通りの順序は同じ絡み方になる」ことを表す。これを $B_{n}$ の正式な定義にしないのは、生成元と関係で表示されることの証明（アルティンの定理）がこのページの範囲を超えるからである。$\sigma_{i}^{2}=1$ が課されていないことが、置換との違いである。
:::

::: proposition 組紐群は無限群 {#cat:braid-group-infinite keywords="abelianization of the braid group, braid group is infinite" index="組紐群の次数|くみひもぐんのじすう"}
$n\ge2$ について、$\sigma_{i}\mapsto1$ は全射\term[準同型]{grp:homomorphism} $\deg\colon B_{n}\to\mathbb{Z}$ を定める。とくに $\sigma_{1}$ の\term[位数]{grp:element-order}は無限で、$\sigma_{1}^{2}\neq1$。$B_{2}\cong\mathbb{Z}$。
:::

::: proof
すべての $\sigma_{i}$ を $1\in\mathbb{Z}$ に送ると、$\mathbb{Z}$ で組紐の関係の両辺はともに $1+1+1=3$、可換性の両辺はともに $2$ になるので、表示の普遍性から\term[準同型]{grp:homomorphism} $\deg$ が定まる。$\deg(\sigma_{1}^{k})=k$ なので、$k\neq0$ なら $\sigma_{1}^{k}\neq1$ であり、$\deg$ は全射である。$B_{2}$ は一つの生成元 $\sigma_{1}$ と空の関係で表示されるので、一つの元の上の自由群、すなわち $\mathbb{Z}$ である。
:::

## 組紐圏 {#cat:sec-br-category}

::: definition 組紐圏 {#cat:braid-category keywords="braid category" index="組紐圏|くみひもけん"}
**組紐圏** $\mathbf{B}$ は、対象を自然数 $n=0,1,2,\dots$ とし、$\mathbf{B}(n,n)\defeq B_{n}$、$n\neq m$ なら $\mathbf{B}(n,m)\defeq\varnothing$、合成を群の積 $\eta\circ\xi\defeq\eta\xi$ とする圏である（右の因子を先に施すと読む）。
:::

::: intuition
組紐圏は、紐の本数ごとに組紐群を一つずつ並べた圏で、本数の違う組紐の間に射はない。
:::

$\mathbf{B}$ の積を「組紐を横に並べる」ことで定める。\term[準同型]{grp:homomorphism} $\iota^{m,n}_{1}\colon B_{m}\to B_{m+n}$, $\sigma_{i}\mapsto\sigma_{i}$ と $\iota^{m,n}_{2}\colon B_{n}\to B_{m+n}$, $\sigma_{j}\mapsto\sigma_{m+j}$ は、関係を関係に移すので well-defined である。$\iota_{1}$ の生成元 $\sigma_{i}$（$i\le m-1$）と $\iota_{2}$ の生成元 $\sigma_{m+j}$（$m+j\ge m+1$）は添字が 2 以上離れているので可換で、したがって $\iota_{1}(\xi)$ と $\iota_{2}(\eta)$ はつねに可換である。

::: proposition 組紐圏は厳密モノイダル圏 {#cat:braid-category-monoidal keywords="braid category is strict monoidal under juxtaposition" index="組紐の並置|くみひものへいち"}
対象について $m+n$、射について $\xi+\eta\defeq\iota_{1}(\xi)\,\iota_{2}(\eta)\in B_{m+n}$（$\xi\in B_{m}$, $\eta\in B_{n}$）とすると、$\mathbf{B}$ は $+$ と単位 $0$ で厳密モノイダル圏になる。
:::

::: proof
**双関手性.** $\iota_{1}(\xi')$ と $\iota_{2}(\eta)$ の可換性から $(\xi'+\eta')\circ(\xi+\eta)=\iota_{1}(\xi')\iota_{2}(\eta')\iota_{1}(\xi)\iota_{2}(\eta)=\iota_{1}(\xi'\xi)\iota_{2}(\eta'\eta)=(\xi'\xi)+(\eta'\eta)$ である。また $\iota_{1},\iota_{2}$ は単位元を保つので $1_{m}+1_{n}=1_{m+n}$ である。

**結合律.** $(\xi+\eta)+\zeta$ と $\xi+(\eta+\zeta)$（$\zeta\in B_{p}$）は、どちらも $B_{m+n+p}$ の中で $\xi$ の $\sigma_{i}$ を $\sigma_{i}$ に、$\eta$ の $\sigma_{j}$ を $\sigma_{m+j}$ に、$\zeta$ の $\sigma_{k}$ を $\sigma_{m+n+k}$ に移した三つの元の積である（それぞれの $\iota$ の合成が生成元の上で一致し、\term[準同型]{grp:homomorphism}は生成元で決まる）。$B_{0}$ は自明なので $\xi+1_{0}=\xi=1_{0}+\xi$。よって結合子・単位子を恒等射として厳密モノイダル圏。
:::

$1_{k}+\sigma_{j}+1_{l}=\sigma_{k+j}$（$B_{k+n+l}$ の中で）に注意する。次に組紐を定める：
$$
\begin{gathered}
\gamma_{1,n}\defeq\sigma_{n}\sigma_{n-1}\cdots\sigma_{1}\in B_{1+n},\qquad\gamma_{0,n}\defeq1,\\
\gamma_{m+1,n}\defeq(\gamma_{1,n}+1_{m})\circ(1_{1}+\gamma_{m,n}).
\end{gathered}
$$
$\gamma_{1,n}$ は 1 本目の紐を残りの $n$ 本の向こうへ一本ずつ越えさせる組紐、$\gamma_{m,n}$ は最初の $m$ 本の束を後ろの $n$ 本の束の向こうへ越えさせる組紐である。$\gamma_{1,0}=1$（空の積）で、帰納法で $\gamma_{m,0}=1$。

::: theorem 組紐圏は組紐モノイダル圏 {#cat:braid-category-braided keywords="the braid category is braided monoidal but not symmetric" index="組紐圏の組紐|くみひもけんのくみひも"}
$\gamma_{m,n}\colon m+n\to n+m$ は厳密モノイダル圏 $\mathbf{B}$ の組紐である。$\gamma_{1,1}=\sigma_{1}$ で $\gamma_{1,1}\circ\gamma_{1,1}\neq1$ なので、$\mathbf{B}$ は対称ではない。
:::

::: intuition
紐の束を別の束の向こうへ越えさせる組紐は、束ごとに動かしても一本ずつ動かしても同じで、組紐の入れ替えとして働く。ただし 2 回越えさせても元の組紐には戻らない。
:::

::: proof
**Step 1.** $c\defeq\sigma_{n}\cdots\sigma_{1}$ と $d\defeq\sigma_{1}\sigma_{2}\cdots\sigma_{n}$（$B_{n+1}$ の元）とおく。【主張：$1\le j\le n-1$ について次が成り立つ】
$$
c\,\sigma_{j+1}=\sigma_{j}\,c,\qquad d\,\sigma_{j}=\sigma_{j+1}\,d.
$$
前者を示す。$\sigma_{j+1}$ は $\sigma_{j-1},\dots,\sigma_{1}$ と可換なので $c\sigma_{j+1}=\sigma_{n}\cdots\sigma_{j+2}(\sigma_{j+1}\sigma_{j}\sigma_{j+1})\sigma_{j-1}\cdots\sigma_{1}$。組紐の関係で括弧を $\sigma_{j}\sigma_{j+1}\sigma_{j}$ に替え、$\sigma_{j}$ が $\sigma_{n},\dots,\sigma_{j+2}$ と可換なことから左端へ出すと $\sigma_{j}c$ になる。後者も同様に、$\sigma_{j}$ を右から入れて $(\sigma_{j}\sigma_{j+1}\sigma_{j})=(\sigma_{j+1}\sigma_{j}\sigma_{j+1})$ を使い、$\sigma_{j+1}$ を左端へ出す。

**Step 2.** 【主張：$\gamma_{m+m',n}=(\gamma_{m,n}+1_{m'})\circ(1_{m}+\gamma_{m',n})$（厳密な (H1)）】 $m$ に関する帰納法で示す。$m=0$ なら両辺は $\gamma_{m',n}$ であり、$m=1$ なら定義そのものである。$m+1$ について、定義と帰納法の仮定、$+$ の結合律と双関手性から
$$
\begin{aligned}
\gamma_{m+1+m',n}&=(\gamma_{1,n}+1_{m+m'})\circ(1_{1}+\gamma_{m+m',n})\\
&=(\gamma_{1,n}+1_{m+m'})\circ(1_{1}+\gamma_{m,n}+1_{m'})\circ(1_{1+m}+\gamma_{m',n})\\
&=(\gamma_{m+1,n}+1_{m'})\circ(1_{m+1}+\gamma_{m',n}).
\end{aligned}
$$

**Step 3.** 【主張：$\gamma_{m,n+n'}=(1_{n}+\gamma_{m,n'})\circ(\gamma_{m,n}+1_{n'})$（厳密な (H2)）】 $m$ に関する帰納法で示す。$m=0$ なら両辺は恒等射である。$m=1$ の場合、$1_{n}+\sigma_{k}=\sigma_{n+k}$, $\sigma_{k}+1_{n'}=\sigma_{k}$ から
$$
\gamma_{1,n+n'}=(\sigma_{n+n'}\cdots\sigma_{n+1})(\sigma_{n}\cdots\sigma_{1})=(1_{n}+\gamma_{1,n'})\circ(\gamma_{1,n}+1_{n'}).
$$
$m+1$ の場合、定義に $m=1$ の場合と帰納法の仮定を代入すると
$$
\begin{aligned}
\gamma_{m+1,n+n'}&=(1_{n}+\gamma_{1,n'}+1_{m})\circ(\gamma_{1,n}+1_{n'+m})\\
&\qquad\circ(1_{1+n}+\gamma_{m,n'})\circ(1_{1}+\gamma_{m,n}+1_{n'}).
\end{aligned}
$$
中央の二つは別々の紐の束に作用するので交換でき（双関手性：$(f+1)\circ(1+g)=f+g=(1+g)\circ(f+1)$）、交換したものをまとめ直すと $(1_{n}+\gamma_{m+1,n'})\circ(\gamma_{m+1,n}+1_{n'})$ になる。

**Step 4（第 2 変数の自然性）.** 【主張：$\eta\in B_{n}$ について $\gamma_{m,n}\circ(1_{m}+\eta)=(\eta+1_{m})\circ\gamma_{m,n}$】 $m$ に関する帰納法で示す（$m=0$ なら両辺は $\eta$）。この等式を満たす $\eta$ の全体は $B_{n}$ の部分群なので、$\eta=\sigma_{j}$ で示せばよい。$m=1$ の場合、$1_{1}+\sigma_{j}=\sigma_{j+1}$, $\sigma_{j}+1_{1}=\sigma_{j}$ なので、これは Step 1 の前者そのものである。$m+1$ の場合、定義、帰納法の仮定、$m=1$ の場合を順に使って
$$
\begin{aligned}
\gamma_{m+1,n}\circ(1_{m+1}+\sigma_{j})&=(\gamma_{1,n}+1_{m})\circ(1_{1}+(\sigma_{j}+1_{m})\gamma_{m,n})\\
&=\bigl(\gamma_{1,n}(1_{1}+\sigma_{j})+1_{m}\bigr)\circ(1_{1}+\gamma_{m,n})\\
&=(\sigma_{j}+1_{m+1})\circ\gamma_{m+1,n}.
\end{aligned}
$$

**Step 5（第 1 変数の自然性）.** 【主張：$\xi\in B_{m}$ について $\gamma_{m,n}\circ(\xi+1_{n})=(1_{n}+\xi)\circ\gamma_{m,n}$】 Step 4 と同様に $\xi=\sigma_{i}$（$1\le i\le m-1$）で示せばよく、$n$ に関する帰納法による（$n=0$ なら両辺は $\xi$）。$n=1$ の場合、定義から帰納法で $\gamma_{m,1}=\sigma_{1}\sigma_{2}\cdots\sigma_{m}$ である（$\gamma_{m+1,1}=(\sigma_{1}+1_{m})(1_{1}+\gamma_{m,1})=\sigma_{1}\sigma_{2}\cdots\sigma_{m+1}$）。よって Step 1 の後者から $\gamma_{m,1}\sigma_{i}=\sigma_{i+1}\gamma_{m,1}$ であり、$\sigma_{i}+1_{1}=\sigma_{i}$, $1_{1}+\sigma_{i}=\sigma_{i+1}$ なので、これが求める等式である。$n+1$ の場合、Step 3 の $\gamma_{m,n+1}=(1_{n}+\gamma_{m,1})\circ(\gamma_{m,n}+1_{1})$ と、帰納法の仮定、$n=1$ の場合を順に使うと
$$
\begin{aligned}
\gamma_{m,n+1}\circ(\sigma_{i}+1_{n+1})&=(1_{n}+\gamma_{m,1})\circ\bigl((1_{n}+\sigma_{i})\gamma_{m,n}+1_{1}\bigr)\\
&=\bigl(1_{n}+\gamma_{m,1}(\sigma_{i}+1_{1})\bigr)\circ(\gamma_{m,n}+1_{1})\\
&=(1_{n+1}+\sigma_{i})\circ\gamma_{m,n+1}
\end{aligned}
$$
となる。

**Step 6.** 【主張：$\gamma$ は自然な同型で、組紐である】 $\xi\in B_{m}$, $\eta\in B_{n}$ について $\xi+\eta=(\xi+1_{n})\circ(1_{m}+\eta)$ なので、Step 5, 4 から $\gamma_{m,n}\circ(\xi+\eta)=(1_{n}+\xi)\circ(\eta+1_{m})\circ\gamma_{m,n}=(\eta+\xi)\circ\gamma_{m,n}$ であり、$\gamma$ は自然である（$\gamma_{m,n}$ は群の元なので同型）。Step 2, 3 は厳密な場合の (H1)(H2) である。最後に $\gamma_{1,1}=\sigma_{1}$ であり、\ref{cat:braid-group-infinite} から $\sigma_{1}^{2}\neq1$ である。
:::

::: hypcheck
- **組紐の関係**：Step 1 でだけ使った（自然性の基礎）。可換性の関係は Step 1 と、$\iota_{1},\iota_{2}$ の像の可換性（双関手性）に使った。
- **$\sigma_{i}^{2}=1$ がないこと**：非対称性の証明に \ref{cat:braid-group-infinite} として使った。
:::

## 自由性とコヒーレンス {#cat:sec-br-free}

::: theorem 組紐圏の自由性（ジョイヤル–ストリート） {#cat:braid-category-free keywords="the braid category is the free strict braided monoidal category on one object, Joyal-Street" index="自由組紐モノイダル圏|じゆうくみひもものいだるけん, ジョイヤル–ストリートの定理|じょいやるすとりーとのていり"}
$\mathbf{S}$ を厳密な組紐モノイダル圏とする。
1. $\mathbf{S}$ の各対象 $a$ について、厳密な組紐モノイダル関手 $F\colon\mathbf{B}\to\mathbf{S}$ で $F(1)=a$ となるものがただ一つある。
2. そのような関手 $F,G$ と射 $f\colon F(1)\to G(1)$ について、モノイダル自然変換 $\theta\colon F\Rightarrow G$ で $\theta_{1}=f$ となるものがただ一つある。

したがって、厳密な組紐モノイダル関手 $\mathbf{B}\to\mathbf{S}$ とモノイダル自然変換のなす圏は、「$1$ での値」によって $\mathbf{S}$ と同型である。
:::

::: intuition
厳密な組紐モノイダル圏の対象を一つ選べば、組紐の一本一本の交差をその対象の組紐 $\gamma_{a,a}$ に置き換えることで、あらゆる組紐がただ一通りに射として実現される。
:::

::: proof
**1. 一意性.** $F$ が厳密なら $F(n)=a^{n}$（$a$ の $n$ 個の積）、$F(1_{k}+\xi+1_{l})=1\cdot F(\xi)\cdot1$ である。組紐モノイダル関手の条件（$F_{2}=1$）から $F(\sigma_{1})=F(\gamma_{1,1})=\gamma_{a,a}$。$\sigma_{i}=1_{i-1}+\sigma_{1}+1_{n-i-1}$ なので
$$
F(\sigma_{i})=1_{a^{i-1}}\cdot\gamma_{a,a}\cdot1_{a^{n-i-1}}\colon a^{n}\to a^{n}
$$
が決まり、$B_{n}$ は $\sigma_{i}$ で生成されるので $F$ は決まる。

**1. 存在.** 上の式で $F(\sigma_{i})$ を定める。これは組紐の関係を満たす：$|i-j|\ge2$ の可換性は $\cdot$ の双関手性、$\sigma_{i}\sigma_{i+1}\sigma_{i}=\sigma_{i+1}\sigma_{i}\sigma_{i+1}$ はヤン–バクスター方程式（\ref{cat:yang-baxter}、$a=b=c$）を $1\cdot-\cdot1$ で囲んだもの（左辺・右辺の合成の順序は \ref{cat:strict-symmetric-coherence} の Step 2 の計算と同じ）。$F(\sigma_{i})$ は同型なので、表示の普遍性から準同型 $B_{n}\to\mathrm{Aut}(a^{n})$ が定まり、$F$ は関手。積の保存 $F(\xi+\eta)=F(\xi)\cdot F(\eta)$：$\xi\mapsto F(\iota_{1}\xi)$ と $\xi\mapsto F(\xi)\cdot1_{a^{n}}$ はともに\term[準同型]{grp:homomorphism}で生成元の上で一致し、$\iota_{2}$ も同様なので、$F(\xi+\eta)=F(\iota_{1}\xi)F(\iota_{2}\eta)=(F\xi\cdot1)\circ(1\cdot F\eta)=F\xi\cdot F\eta$。組紐の保存 $F(\gamma_{m,n})=\gamma_{a^{m},a^{n}}$：$F(\gamma_{1,n})=F(\sigma_{n})\circ\cdots\circ F(\sigma_{1})$ は、$\mathbf{S}$ の (H2) を繰り返すと $\gamma_{a,a^{n}}$ に等しく、$\gamma_{m+1,n}$ の定義と $\mathbf{S}$ の (H1) から $m$ に関する帰納法で一般の場合が出る。帰納法の出発点 $m=0$ と、$n=0$ の場合には、$F(\gamma_{0,n})=1=\gamma_{e,a^{n}}$, $F(\gamma_{m,0})=1=\gamma_{a^{m},e}$ を使う。厳密な組紐モノイダル圏で $\gamma_{e,c}=\gamma_{c,e}=1$ となることは、(H1) を $a=b=e$ に、(H2) を $b=c=e$ に使えば \ref{cat:strict-symmetric-coherence} の証明の Step 1 と同じくわかる。

**2.** モノイダル自然変換は $\theta_{m+n}=\theta_{m}\cdot\theta_{n}$（$F_{2},G_{2}$ が恒等射なので）と $\theta_{0}=1$ を満たすので、$\theta_{n}=f\cdot f\cdots f=f^{n}$ と決まる。逆にこの $\theta$ は自然である。実際、$\theta_{n}\circ F(\sigma_{i})=G(\sigma_{i})\circ\theta_{n}$ は $\gamma$ の自然性 $\gamma_{a',a'}\circ(f\cdot f)=(f\cdot f)\circ\gamma_{a,a}$ を $f^{i-1}\cdot-\cdot f^{n-i-1}$ で囲んだものであり、この等式を満たす $\xi$ の全体は部分群なので、生成元で成り立てば $B_{n}$ 全体で成り立つ。モノイダル性は $\theta_{m+n}=\theta_{m}\cdot\theta_{n}$, $\theta_{0}=1$ の定義そのものである。最後の主張は、1 と 2 が「対象の対応」と「射の対応」がともに全単射であることを言っており、合成と恒等射は $\theta\mapsto\theta_{1}$ で保たれる。
:::

::: remark
Mac Lane（第 XI 章 §5 定理 1）は、厳密とは限らない組紐モノイダル圏 $\mathbf{M}$ について、強い組紐モノイダル関手 $\mathbf{B}\to\mathbf{M}$ の圏が $\mathbf{M}$ と（同型ではなく）圏同値になると述べ、厳密化（\ref{cat:braiding-strictification}）で上の厳密な場合に帰着させている。この帰着の細部（関手圏の同値への持ち上げ）は Mac Lane でも略されており、ここでは確かめていない。
:::

対称な場合（\ref{cat:symmetric-coherence-general}）と同様に、組紐モノイダル圏で $\alpha,\lambda,\varrho,\gamma$ から組み立てた射に組紐を対応させる。

::: definition 道の組紐 {#cat:underlying-braid keywords="underlying braid of a composite of structural maps" index="道の組紐|みちのくみひも"}
番号つき語（\ref{cat:labelled-words}）の間の基本射に、$n$ をその長さとして、組紐 $\mathrm{br}(\beta)\in B_{n}$ を次のように対応させる：$\alpha,\lambda,\varrho$ 型なら $1$；$\gamma_{u,z}$ を左に長さ $k$ の語、右に長さ $l$ の語の恒等射で囲んだもの（$u,z$ の長さを $m,m'$ とする）なら $1_{k}+\gamma_{m,m'}+1_{l}$；その逆なら逆元。道 $\beta_{r}\circ\cdots\circ\beta_{1}$ の組紐を $\mathrm{br}(\beta_{r})\cdots\mathrm{br}(\beta_{1})$ とする（語の長さは $e$ を数えない文字の数）。
:::

::: intuition
入れ替えの射をたどるとき、どの文字がどの文字の向こうへどちら向きに越えたかを記録したものが道の組紐である。
:::

::: theorem 組紐モノイダル圏のコヒーレンス {#cat:braided-coherence keywords="coherence theorem for braided monoidal categories, Joyal-Street" index="組紐モノイダル圏のコヒーレンス定理|くみひもものいだるけんのこひーれんすていり"}
番号つき語 $v,w$ の間の基本射の二つの道 $P,Q$ について、次は同値である。
1. すべての組紐モノイダル圏 $\mathbf{M}$ と対象 $b_{1},\dots,b_{n}$ で、$P$ と $Q$ の合成は $\mathbf{M}$ の射 $v\langle b\rangle\to w\langle b\rangle$ として等しい。
2. $\mathrm{br}(P)=\mathrm{br}(Q)$。
:::

::: intuition
組紐モノイダル圏で、結合・単位・入れ替えの同型だけを組み合わせて作った二つの射がいつでも等しいのは、文字の越え方を記録した組紐が等しいときに限る。
:::

::: proof
**1 ⇒ 2.** $\mathbf{M}=\mathbf{B}$, $b_{i}=1$ とする。$\mathbf{B}$ は厳密なので $\alpha,\lambda,\varrho$ 型の基本射は恒等射、$\gamma_{u,z}$ 型は $1_{k}+\gamma_{m,m'}+1_{l}$ で、道の合成はちょうど $\mathrm{br}$ である。よって $\mathrm{br}(P)=\mathrm{br}(Q)$。

**2 ⇒ 1.** $\mathbf{M}$ を組紐モノイダル圏、$\mathbf{S}$ をその厳密化（\ref{cat:braiding-strictification} で組紐をもつ）、$a_{i}\defeq[b_{i}]$ とし、並べ替え $p$ に対する $a_{p}$、ブロック移動、基本移動 $\tau_{i}^{p}$ を \ref{cat:symmetric-moves} と同じく $\mathbf{S}$ で定める。並べ替え $p$ と $\xi\in B_{n}$ について $p\ast\xi\defeq p\circ\pi(\xi)^{-1}$ とおく。$\pi$ は\term[準同型]{grp:homomorphism}なので $p\ast(\eta\xi)=(p\ast\xi)\ast\eta$ であり、$p\ast\sigma_{i}=p\circ t_{i}$ である。

*Step 1（$\mathbf{S}$ への移動）.* 【主張：$P=\beta_{r}\circ\cdots\circ\beta_{1}$ のとき、各 $N_{v_{k}}\beta_{k}N_{v_{k-1}}^{-1}$ は、$\beta_{k}$ が $\alpha,\lambda,\varrho$ 型なら恒等射、$\gamma_{u,z}$ を左に $k'$ 文字、右に $l$ 文字の語で囲んだ型なら $1_{a_{x}}\cdot\gamma_{a_{s},a_{t}}\cdot1_{a_{y}}$（$|x|=k'$, $|s|,|t|$ は $u,z$ の長さ、$|y|=l$）、その逆の型ならその逆である】 \ref{cat:basic-arrows-to-moves} の証明は、$\gamma$ の自然性と $\gamma^{\mathbf{S}}$ の定義だけを使い、対称性は $\gamma^{-1}$ 型の扱いにしか使っていない。組紐の場合も同じ計算で $\gamma$ 型はブロック移動に写り、$\gamma^{-1}$ 型はその逆に写る。区間の長さは、囲む語の文字の数を数えればわかる。

*Step 2（組紐群の作用）.* 【主張：並べ替え $p$ と $\xi\in B_{n}$ ごとに同型 $\Phi_{p}(\xi)\colon a_{p}\to a_{p\ast\xi}$ が定まり、$\Phi_{p}(\sigma_{i})=\tau_{i}^{p}$, $\Phi_{p}(1)=1$, $\Phi_{p}(\eta\xi)=\Phi_{p\ast\xi}(\eta)\circ\Phi_{p}(\xi)$ を満たす】 $\sigma_{i}^{\pm1}$ の語 $x_{r}\cdots x_{1}$（右の文字から施す）について、$p_{0}\defeq p$, $p_{j}\defeq p_{j-1}\circ t_{i_{j}}$（$x_{j}=\sigma_{i_{j}}^{\pm1}$）とおき、$x_{j}=\sigma_{i_{j}}$ なら $\phi_{j}\defeq\tau_{i_{j}}^{p_{j-1}}$、$x_{j}=\sigma_{i_{j}}^{-1}$ なら $\phi_{j}\defeq(\tau_{i_{j}}^{p_{j}})^{-1}$ とし、合成 $\phi_{r}\circ\cdots\circ\phi_{1}\colon a_{p}\to a_{p_{r}}$ を考える。この合成が $B_{n}$ の元だけで決まることを示せばよい（残りの性質は語の連結から従う）。記法の確認の「群の表示」から、語の中に $xx^{-1}$, $x^{-1}x$ や関係を挿入・削除しても合成が変わらないことを示せばよい。$\sigma_{i}\sigma_{i}^{-1}$, $\sigma_{i}^{-1}\sigma_{i}$ に対応する合成は、射とその逆の合成なので恒等射である。組紐の関係と可換性については、両辺に対応する合成が、どの並べ替えから始めても等しい（\ref{cat:strict-symmetric-coherence} の証明の Step 2 の後の二つ。そこで使ったのはヤン–バクスター方程式（\ref{cat:yang-baxter}。(H1) だけを使う）と双関手性だけである）。挿入する位置の前の部分で並べ替えが決まり、関係の両辺で $\pi$ の値が等しいので後ろの部分の並べ替えも変わらない。よって関係（とその逆）の挿入・削除で合成は変わらない。

*Step 3（ブロック移動は組紐で決まる）.* 【主張：ブロック移動 $1_{a_{x}}\cdot\gamma_{a_{s},a_{t}}\cdot1_{a_{y}}\colon a_{p}\to a_{p'}$ は、$\xi\defeq1_{|x|}+\gamma_{|s|,|t|}+1_{|y|}\in B_{n}$ について $\Phi_{p}(\xi)$ に等しく、$p'=p\ast\xi$ である】 $|s|+|t|$ に関する帰納法で示す。$s$ か $t$ が空なら、$\mathbf{S}$ で $\gamma_{e,c}=\gamma_{c,e}=1$（\ref{cat:strict-symmetric-coherence} の証明の Step 1 と同じ）、$\mathbf{B}$ で $\gamma_{0,m}=\gamma_{m,0}=1$ なので、両辺とも恒等射である。$|s|=|t|=1$ なら、ブロック移動は $\tau_{|x|+1}^{p}$ で、$\xi=\sigma_{|x|+1}$ である。$|s|\ge2$ なら、$\mathbf{S}$ の (H1) によるブロック移動の分解（\ref{cat:strict-symmetric-coherence} の証明の Step 1）と、$\mathbf{B}$ での $\gamma_{1+m',m''}=(\gamma_{1,m''}+1_{m'})\circ(1_{1}+\gamma_{m',m''})$（$\gamma$ の定義）が同じ形をしているので、帰納法の仮定と Step 2 の $\Phi_{p}(\eta\xi)=\Phi_{p\ast\xi}(\eta)\circ\Phi_{p}(\xi)$ から主張が従う。$|s|=1$, $|t|\ge2$ なら、$\mathbf{S}$ の (H2) による分解と、$\mathbf{B}$ での $\gamma_{1,1+m''}=(1_{1}+\gamma_{1,m''})\circ(\gamma_{1,1}+1_{m''})$（\ref{cat:braid-category-braided} の証明の Step 3）を同じように使う。

*Step 4.* 【主張：$v$ の並びを $p$ とすると $N_{w}\circ P\circ N_{v}^{-1}=\Phi_{p}(\mathrm{br}(P))$】 Step 1 と Step 3 から、$\gamma$ 型の $\beta_{j}$ について $N_{v_{j}}\beta_{j}N_{v_{j-1}}^{-1}=\Phi_{p_{j-1}}(\mathrm{br}(\beta_{j}))$ である（$p_{j-1}$ は $v_{j-1}$ の並び）。逆の型では、Step 2 から $\Phi_{p'}(\xi^{-1})=\Phi_{p}(\xi)^{-1}$ なので同じ式が成り立ち、$\alpha,\lambda,\varrho$ 型では両辺とも恒等射である。$N_{w}PN_{v}^{-1}$ はこれらの合成なので、Step 2 の積の式から $\Phi_{p}(\mathrm{br}(\beta_{r})\cdots\mathrm{br}(\beta_{1}))=\Phi_{p}(\mathrm{br}(P))$ に等しい。

$Q$ についても同様なので、仮定 $\mathrm{br}(P)=\mathrm{br}(Q)$ から $N_{w}PN_{v}^{-1}=N_{w}QN_{v}^{-1}$ であり、$N_{v},N_{w}$ は同型なので $P=Q$ である。
:::

::: hypcheck
- **$\mathbf{B}$ が組紐モノイダル圏であること**（\ref{cat:braid-category-braided}）：1 ⇒ 2 で、$\mathbf{B}$ を試験の圏として使うために必要。
- **組紐の厳密化**：2 ⇒ 1 の Step 1 で、$\alpha,\lambda,\varrho$ を消すために使った。単位の公理は使っていない（\ref{cat:braided-unit-redundant}）。
- **表示による $B_{n}$ の定義**：2 ⇒ 1 の Step 2 で、「$B_{n}$ で等しい語は関係の挿入・削除で移り合う」ことに使った。対称の場合の \ref{cat:coxeter-presentation} にあたる部分は、ここでは定義から直ちに従う（その代わり、幾何的な組紐との一致はアルティンの定理に依存し、ここでは使っていない）。
:::

::: example 組紐であって対称でない例
複素数体上の $\mathbb{Z}$ 次数つきベクトル空間の圏（$V=(V_{k})_{k\in\mathbb{Z}}$、$(V\otimes W)_{k}=\bigoplus_{i+j=k}V_{i}\otimes W_{j}$）と $\zeta\in\mathbb{C}^{\times}$ について、斉次元 $x\in V_{i}$, $y\in W_{j}$ に対し
$$
\gamma_{V,W}(x\otimes y)\defeq\zeta^{ij}\,y\otimes x
$$
とすると組紐である：(H1) は斉次元の上で $\zeta^{(i+j)k}=\zeta^{ik}\zeta^{jk}$、(H2) は $\zeta^{i(j+k)}=\zeta^{ij}\zeta^{ik}$ から（結合子は標準的なもの）。$\gamma_{W,V}\gamma_{V,W}$ は $x\otimes y\mapsto\zeta^{2ij}x\otimes y$ なので、対称であるのは $\zeta^{2}=1$ すなわち $\zeta=\pm1$ のときに限る（$\zeta=-1$ は符号つきの対称の $\mathbb{Z}$ 版）。たとえば $\zeta=i$ のとき、\ref{cat:braid-category-free} の関手 $\mathbf{B}\to(\text{この圏})$ で $1\mapsto V=\mathbb{C}$（次数 $1$）とすると、$\sigma_{1}\mapsto\zeta=i$ 倍で、$\sigma_{1}$ の像の\term[位数]{grp:element-order}は 4 である。
:::

## 問題 {#cat:sec-br-problems}

::: problem {#cat:prob-br-pure}
$\pi\colon B_{n}\to\mathfrak{S}_{n}$ は全射であることを示せ。また $\sigma_{1}^{2}$ は純組紐群の自明でない元であることを示せ。
:::

::: solution
$\mathfrak{S}_{n}$ は隣接互換で生成される（\ref{cat:coxeter-presentation} の Step 2）ので、$\pi(\sigma_{i})=t_{i}$ から $\pi$ は全射である。$\pi(\sigma_{1}^{2})=t_{1}^{2}=1$ なので $\sigma_{1}^{2}$ は核に属し、$\deg(\sigma_{1}^{2})=2\neq0$（\ref{cat:braid-group-infinite}）から $\sigma_{1}^{2}\neq1$ である。
:::

::: problem {#cat:prob-br-double-braiding}
$\mathbf{S}$ を厳密な対称モノイダル圏とし、組紐モノイダル圏とみる。$a\in\mathbf{S}$ について \ref{cat:braid-category-free} の関手 $F\colon\mathbf{B}\to\mathbf{S}$ をとると、\term[準同型]{grp:homomorphism} $B_{n}\to\mathrm{Aut}(a^{n})$, $\xi\mapsto F(\xi)$ は $\pi\colon B_{n}\to\mathfrak{S}_{n}$ を経由することを示せ。
:::

::: solution
対称性 $\gamma_{a,a}\gamma_{a,a}=1$ から $F(\sigma_{i})^{2}=1\cdot\gamma_{a,a}\gamma_{a,a}\cdot1=1$ である。よって $s_{i}\mapsto F(\sigma_{i})$ は \ref{cat:coxeter-presentation} の三つの関係（$s_{i}^{2}$, 組紐の関係, 可換性）をすべて満たし、語の同値類の群 $G_{n}$ からの\term[準同型]{grp:homomorphism} $\Phi\colon G_{n}\to\mathrm{Aut}(a^{n})$ を定める（関係の置き換えで合成が変わらないため）。\ref{cat:coxeter-presentation} から $G_{n}\cong\mathfrak{S}_{n}$（$\pi$ による）なので、$\Phi\circ\pi^{-1}\colon\mathfrak{S}_{n}\to\mathrm{Aut}(a^{n})$ が得られ、$B_{n}\to\mathfrak{S}_{n}\to\mathrm{Aut}(a^{n})$ は生成元 $\sigma_{i}$ で $F$ と一致するので、$F$ に等しい。
:::

::: supplement
**前提を変えると.** 組紐の代わりに、さらに「ひねり」$\theta_{a}\colon a\to a$ を加えて紐をリボンに置き換えたものがリボン圏で、そのコヒーレンスにはリボン（枠つきの組紐やタングル）が現れるとされる（Mac Lane 第 XI 章 §6 の展望。Shum 1994 などとされる。ここでは確かめていない）。

**似た定理.** \ref{cat:braid-category-free} は \ref{cat:free-monoidal-category}（自由モノイダル圏は語の圏）の組紐版で、対称版（自由な厳密対称モノイダル圏は置換の圏。\ref{cat:permutation-category-free}）とあわせて、「自由な構造つき圏は、その構造の『形』を記録する群（自明群・対称群・組紐群）で記述される」という系列をなす。

**高い視点から：次元が上がると交換が記憶される.** 比喩で言えば、モノイダル圏の積は「一列に並んだ点」の並置、組紐モノイダル圏は「平面上の点」の並置、対称モノイダル圏は「3 次元以上の空間の点」の並置である。一列では点は互いを越えられない（積は可換でない）。平面では越えられるが、時計回りか反時計回りかの区別が残り、越え方の履歴が組紐として記憶される（$\gamma_{b,a}\gamma_{a,b}\neq1$）。3 次元以上では越え方の区別も連続変形で消え、置換だけが残る（$\gamma_{b,a}\gamma_{a,b}=1$）。これは、平面内の順序を区別しない $n$ 点集合の配置空間の基本群が組紐群 $B_{n}$、3 次元以上ではそれが対称群 $\mathfrak{S}_{n}$ になることの圏論的な影である（点に順序をつけた配置空間の基本群は、平面では純組紐群、3 次元以上では自明群）。ホモトピー論では、圏の中の $E_{1}$ 代数がモノイダル圏、$E_{2}$ 代数が組紐モノイダル圏、$E_{n}$ 代数（$n\ge3$。圏では $E_{\infty}$ と同じ）が対称モノイダル圏にあたる、という形で一般化されるとされる（ここでは扱わない）。
:::
