# 対称モノイダル閉圏 {#cat:page-symmetric-monoidal-closed keywords="symmetric monoidal closed category, internal hom, currying, tensor preserves colimits, self-enrichment, dualizable object, compact closed category, trace, dimension, finitely generated projective modules are the dualizable modules"}

対称モノイダル閉圏（閉圏。\ref{cat:closed-category}）は、「テンソル積 $\otimes$」と「準同型の空間 $[b,c]$」が随伴 $\mathbf{V}(a\otimes b,c)\cong\mathbf{V}(a,[b,c])$ で結ばれた圏で、集合と写像・加群とテンソル積・ベクトル空間の線形代数に共通する構造を抜き出したものである。このページでは、内部 hom の計算規則（カリー化・余極限の保存）を示し、加群のテンソル積が右完全であることがこの随伴だけから従うことを見る（ホモロジー代数との接点）。後半では**双対対象**を定義し、可換環上の加群では双対対象がちょうど有限生成射影加群であることを示す。双対対象の自己準同型には**トレース**が定義でき、ベクトル空間の通常のトレースと次元、表現の指標がその例になる。

> 定義は Mac Lane, *Categories for the Working Mathematician* 第 VII 章 §7 による（\ref{cat:page-closed-categories}）。内部 hom の計算と双対対象の部分は資料によらず書いた。記号は $\square$ の代わりに $\otimes$、単位対象 $e$ の代わりに $I$ を使う。

## 記法と定義の確認 {#cat:sec-smc-notation}

::: notation
- $(\mathbf{V},\otimes,I,\alpha,\lambda,\varrho,\gamma)$ は対称モノイダル圏（\ref{cat:monoidal-category}, \ref{cat:symmetric-monoidal}）。コヒーレンス定理（\tref{cat:coherence}, \ref{cat:symmetric-coherence}）により、$\alpha,\lambda,\varrho$ を省略して書くことがある（省略した等式はコヒーレンスで保証される）。
- **閉**：各 $b$ について $-\otimes b$ が右随伴 $[b,-]$ をもつ（\ref{cat:closed-category}）。随伴の余単位（**評価射**）を $\mathrm{ev}_{b,c}\colon[b,c]\otimes b\to c$、射 $f\colon a\otimes b\to c$ の**転置**を $\tilde f\colon a\to[b,c]$ と書く（$\mathrm{ev}\circ(\tilde f\otimes1)=f$）。
- 随伴・米田の補題・右随伴が極限を保つこと（双対に左随伴は余極限を保つ）は \ref{cat:adjunction}, \tref{cat:yoneda-lemma}, \ref{cat:adjoints-preserve-limits}。
- **選択公理**：使わない。
:::

## 内部 hom の計算規則 {#cat:sec-smc-internal-hom}

::: proposition 内部 hom の基本性質 {#cat:internal-hom-basic keywords="internal hom is a bifunctor, [I,c] = c, internal currying [a tensor b, c] = [a,[b,c]], tensor preserves colimits, internal hom sends colimits to limits" index="内部 hom の性質|ないぶほむのせいしつ, カリー化|かりーか"}
$\mathbf{V}$ を対称モノイダル閉圏とする。
1. $[-,-]$ は関手 $\mathbf{V}^{\mathrm{op}}\times\mathbf{V}\to\mathbf{V}$ に一意に拡張され、$\mathbf{V}(a\otimes b,c)\cong\mathbf{V}(a,[b,c])$ は $a,b,c$ のすべてについて自然になる。
2. $[I,c]\cong c$。
3. （内部カリー化）$[a\otimes b,c]\cong[a,[b,c]]$（$a,b,c$ について自然）。
4. $a\otimes-$ と $-\otimes b$ は、$\mathbf{V}$ に存在する余極限をすべて保つ。$[b,-]$ は極限を保ち、$[-,c]$ は余極限を極限に移す。
:::

::: proof
**Step 1（1）.** $f\colon b'\to b$ について $[f,c]\colon[b,c]\to[b',c]$ を、$[b,c]\otimes b'\xrightarrow{1\otimes f}[b,c]\otimes b\xrightarrow{\mathrm{ev}}c$ の転置と定める。$[1,c]=1$、$[f\circ f',c]=[f',c]\circ[f,c]$ は転置の一意性から（両辺の転置をもとに戻すと同じ射 $\mathrm{ev}\circ(1\otimes f\circ f')$ になる）。$b$ についての自然性 $\mathbf{V}(a\otimes b,c)\to\mathbf{V}(a\otimes b',c)$ と $\mathbf{V}(a,[b,c])\to\mathbf{V}(a,[b',c])$ の可換性も、転置を戻して $\mathrm{ev}\circ(\tilde g\otimes1)\circ(1\otimes f)=g\circ(1\otimes f)$ を確かめればよい。このような拡張は、自然性を要求すると転置の一意性から一つに決まる（パラメーター付きの随伴）。

**Step 2（2）.** 任意の $x$ について、自然に $\mathbf{V}(x,[I,c])\cong\mathbf{V}(x\otimes I,c)\cong\mathbf{V}(x,c)$（後者は $\varrho_{x}$ を合成）。\ref{cat:yoneda-lemma}から $[I,c]\cong c$。

**Step 3（3）.** 任意の $x$ について、自然な全単射の列
$$
\begin{aligned}
\mathbf{V}(x,[a\otimes b,c])&\cong\mathbf{V}(x\otimes(a\otimes b),c)\cong\mathbf{V}((x\otimes a)\otimes b,c)\\
&\cong\mathbf{V}(x\otimes a,[b,c])\cong\mathbf{V}(x,[a,[b,c]])
\end{aligned}
$$
（2 番目は $\alpha$ を合成）があるので、米田の補題から $[a\otimes b,c]\cong[a,[b,c]]$。

**Step 4（4）.** $-\otimes b$ は左随伴なので余極限を保つ。$a\otimes-$ は対称射 $\gamma$ により $-\otimes a$ と自然同型。$[b,-]$ は右随伴なので極限を保つ。$[-,c]$：余極限 $b=\operatorname{colim}b_{i}$ について、任意の $x$ で
$$
\mathbf{V}(x,[b,c])\cong\mathbf{V}(x\otimes b,c)\cong\mathbf{V}(\operatorname{colim}(x\otimes b_{i}),c)\cong\lim\mathbf{V}(x\otimes b_{i},c)\cong\lim\mathbf{V}(x,[b_{i},c])
$$
で、最後は $\mathbf{V}(x,\lim[b_{i},c])$ の普遍性そのものなので、$[b,c]$ は $[b_{i},c]$ の極限。
:::

::: example 閉圏と閉でない圏
1. $(\mathbf{Set},\times,1)$：$[b,c]=c^{b}$（写像全体）。デカルト閉圏（\ref{cat:cartesian-closed}）。
2. 可換環 $R$ 上の $(R\text{-}\mathbf{Mod},\otimes_{R},R)$：$[b,c]=\Hom_{R}(b,c)$。$R=\Z$ で $\mathbf{Ab}$、$R$ が体でベクトル空間の圏。
3. $R$ 上の鎖複体の圏：$(C\otimes D)_{n}=\bigoplus_{p+q=n}C_{p}\otimes D_{q}$、対称射に符号 $x\otimes y\mapsto(-1)^{pq}y\otimes x$（コシュルの符号規則）を入れると対称モノイダル閉圏で、内部 hom は「次数 $n$ の写像」の複体である（本サイト未収録の計算）。
4. **閉でない例**：$(\mathbf{Ab},\oplus,0)$ は対称モノイダル圏だが閉でない。$-\oplus B$ が左随伴なら始対象 $0$ を保つはずだが、$0\oplus B=B\neq0$（$B\neq0$）。$(\mathbf{Top},\times)$ も閉でない（\ref{cat:page-closed-categories} の補足）。
:::

::: corollary テンソル積の右完全性 {#cat:tensor-right-exact-closed keywords="tensor product is right exact because it is a left adjoint" index="テンソル積の右完全性（随伴から）|てんそるせきのみぎかんぜんせいずいはんから"}
可換環 $R$ 上で、$-\otimes_{R}N$ は直和と余核を保つ。特に右完全で、$(\bigoplus M_{i})\otimes N\cong\bigoplus(M_{i}\otimes N)$。
:::

::: proof
\ref{cat:internal-hom-basic.4} を例 2 に使う。余核は余極限、直和は余積である。右完全性：$M'\to M\to M''\to0$ が完全なら $M''$ は $M'\to M$ の余核で、$-\otimes N$ はそれを余核に移す。
:::

::: remark ホモロジー代数との関係
\ref{cat:tensor-right-exact-closed} は、ホモロジー代数の \ref{ha:tensor-right-exact}（テンソル積と $\Hom$ の随伴 \ref{ha:tensor-hom-adjunction} から示した）の圏論的な言い換えである。逆に、左完全でないこと（$\Z\xrightarrow{2}\Z$ に $\otimes\Z/2\Z$）は、左随伴が極限（核）を保つとは限らないことの例で、そのずれを測るのが導来関手 $\operatorname{Tor}$（\ref{ha:tor}）である。
:::

::: proposition 自分自身への豊穣化 {#cat:self-enrichment keywords="a closed symmetric monoidal category is enriched over itself, internal composition" index="自己豊穣化|じこほうじょうか, 内部合成|ないぶごうせい"}
$\mathbf{V}$ を対称モノイダル閉圏とし、**内部合成** $m\colon[b,c]\otimes[a,b]\to[a,c]$ を
$$
([b,c]\otimes[a,b])\otimes a\cong[b,c]\otimes([a,b]\otimes a)\xrightarrow{1\otimes\mathrm{ev}}[b,c]\otimes b\xrightarrow{\mathrm{ev}}c
$$
の転置、**単位** $j\colon I\to[a,a]$ を $\lambda_{a}\colon I\otimes a\to a$ の転置と定める。このとき $\mathbf{V}$ は hom 対象 $[a,b]$ により $\mathbf{V}$ 上の豊穣圏（\ref{cat:closed-category.2}）になり、$\mathbf{V}(I,[a,b])\cong\mathbf{V}(a,b)$（ふつうの射に戻る）。
:::

::: proof
（概略）結合律 $m\circ(m\otimes1)=m\circ(1\otimes m)\circ\alpha$ は、両辺の転置（$\otimes a$ を付けて評価したもの）がどちらも「三つの評価射を順に施す射」$([c,d]\otimes[b,c]\otimes[a,b])\otimes a\to d$ になることから、転置の一意性で従う（$\alpha$ の挿入はコヒーレンスで正当化される）。単位律も同様。最後の同型は $\mathbf{V}(I,[a,b])\cong\mathbf{V}(I\otimes a,b)\cong\mathbf{V}(a,b)$。
:::

## 双対対象 {#cat:sec-smc-duals}

::: definition 双対対象・コンパクト閉圏 {#cat:dual-object keywords="dual object, dualizable object, evaluation and coevaluation, zigzag identities, compact closed category" index="双対対象|そうついたいしょう, 双対化可能|そうついかかのう, コンパクト閉圏|こんぱくとへいけん, ジグザグ等式|じぐざぐとうしき"}
対称モノイダル圏 $\mathbf{V}$ の対象 $a$ について、対象 $a^{*}$ と射 $\varepsilon\colon a^{*}\otimes a\to I$、$\eta\colon I\to a\otimes a^{*}$ で、次の二つの合成が恒等射になるもの（**ジグザグ等式**）があるとき、$a$ は**双対化可能**で $a^{*}$ をその**双対**という：
$$
\begin{aligned}
&a\cong I\otimes a\xrightarrow{\eta\otimes1}a\otimes a^{*}\otimes a\xrightarrow{1\otimes\varepsilon}a\otimes I\cong a,\\
&a^{*}\cong a^{*}\otimes I\xrightarrow{1\otimes\eta}a^{*}\otimes a\otimes a^{*}\xrightarrow{\varepsilon\otimes1}I\otimes a^{*}\cong a^{*}.
\end{aligned}
$$
すべての対象が双対化可能な対称モノイダル圏を**コンパクト閉圏**という。
:::

::: proposition 双対と内部 hom {#cat:dual-internal-hom keywords="if a is dualizable then [a,c] = c tensor a*, a* = [a,I]; compact closed categories are closed" index="双対と内部 hom|そうついとないぶほむ"}
$a$ が双対 $a^{*}$ をもつなら、すべての $x,c$ について自然な全単射 $\mathbf{V}(x\otimes a,c)\cong\mathbf{V}(x,c\otimes a^{*})$ がある。したがって $-\otimes a$ は右随伴 $-\otimes a^{*}$ をもち、$\mathbf{V}$ が閉なら $[a,c]\cong c\otimes a^{*}$、特に $a^{*}\cong[a,I]$。コンパクト閉圏は閉である。
:::

::: proof
**Step 1（写像）.** $f\colon x\otimes a\to c$ に $\Phi(f)\defeq(f\otimes1_{a^{*}})\circ(1_{x}\otimes\eta)\colon x\to x\otimes a\otimes a^{*}\to c\otimes a^{*}$ を、$g\colon x\to c\otimes a^{*}$ に $\Psi(g)\defeq(1_{c}\otimes\varepsilon)\circ(g\otimes1_{a})\colon x\otimes a\to c\otimes a^{*}\otimes a\to c$ を対応させる（単位子・結合子は省略）。どちらも $x,c$ について自然。

**Step 2（互いに逆）.** $\Psi\Phi(f)=(1\otimes\varepsilon)\circ(f\otimes1\otimes1)\circ(1\otimes\eta\otimes1)$。$f$ と $1\otimes\varepsilon$ は別の成分に作用するので入れ替えられ（$\otimes$ の関手性）、$=f\circ(1_{x}\otimes[(1\otimes\varepsilon)\circ(\eta\otimes1)])=f\circ(1_{x}\otimes1_{a})=f$（第 1 のジグザグ等式）。$\Phi\Psi(g)=g$ も第 2 のジグザグ等式から同様。

**Step 3（結論）.** 全単射が $x$ について自然なので随伴 $-\otimes a\dashv-\otimes a^{*}$ を得る。右随伴の一意性（\ref{cat:adjoint-unique}）から $[a,-]\cong-\otimes a^{*}$。$c=I$ として $[a,I]\cong I\otimes a^{*}\cong a^{*}$。
:::

::: theorem 双対化可能な加群 {#cat:dualizable-modules keywords="a module over a commutative ring is dualizable iff it is finitely generated projective; finite-dimensional vector spaces" index="双対化可能な加群|そうついかかのうなかぐん, 双対基底|そうついきてい"}
可換環 $R$ について、$(R\text{-}\mathbf{Mod},\otimes_{R},R)$ の対象 $M$ が双対化可能であることと、$M$ が有限生成射影加群であることは同値で、このとき $M^{*}=\Hom_{R}(M,R)$。特に体上では、双対化可能なのは有限次元のベクトル空間で、有限次元ベクトル空間の圏はコンパクト閉圏である。
:::

::: proof
**Step 1（$\Rightarrow$）.** $\eta(1)=\sum_{k=1}^{n}m_{k}\otimes\lambda_{k}\in M\otimes M^{*}$ と書き、$\lambda_{k}'\defeq\varepsilon(\lambda_{k}\otimes-)\colon M\to R$ とおく。第 1 のジグザグ等式を $m\in M$ に施すと $m\mapsto\sum_{k}m_{k}\otimes\lambda_{k}\otimes m\mapsto\sum_{k}\lambda_{k}'(m)m_{k}$ で、これが $m$ に等しい。よって $p\colon R^{n}\to M$, $e_{k}\mapsto m_{k}$ と $s\colon M\to R^{n}$, $m\mapsto(\lambda'_{k}(m))_{k}$ は $p\circ s=1_{M}$ をみたし、$R^{n}=s(M)\oplus\Ker p$ で $M$ は自由加群の直和因子、すなわち有限生成射影加群（\ref{mod:projective-characterization.4}）。

**Step 2（$\Leftarrow$）.** $M$ が有限生成射影なら、$p\colon R^{n}\to M$ と $s\colon M\to R^{n}$ で $p\circ s=1_{M}$ となるものがある（\ref{mod:projective-characterization}）。$e_{k}^{*}$ を座標関数として、$M^{*}=\Hom_{R}(M,R)$、$\varepsilon(\lambda\otimes m)\defeq\lambda(m)$、$\eta(1)\defeq\sum_{k}p(e_{k})\otimes(e_{k}^{*}\circ s)$ とおく。第 1 のジグザグ：$m\mapsto\sum_{k}e_{k}^{*}(s(m))\,p(e_{k})=p(s(m))=m$。第 2 のジグザグ：$\lambda\mapsto\sum_{k}\lambda(p(e_{k}))\,(e_{k}^{*}\circ s)$ で、これを $m$ で評価すると $\lambda(p(\sum_{k}e_{k}^{*}(s(m))e_{k}))=\lambda(p(s(m)))=\lambda(m)$。

**Step 3（体の場合）.** 体上の加群はすべて自由（\ref{lin:basis-existence}）で、有限生成射影 $\iff$ 有限次元。
:::

::: example 集合の圏
$(\mathbf{Set},\times,1)$ で双対化可能な対象は 1 点集合だけである。実際、$\eta\colon1\to a\times a^{*}$ が点 $(u,v)$ を選ぶとすると、第 1 のジグザグは $x\mapsto((u,v),x)\mapsto(u,\varepsilon(v,x))\mapsto u$ で、これが恒等写像なのですべての $x$ が $u$ に等しく、$a$ は高々 1 点。空集合では $\eta\colon1\to\emptyset\times a^{*}=\emptyset$ がとれないので双対化可能でない。1 点集合は自分自身を双対にもつ（$\varepsilon,\eta$ は唯一の写像）。
:::

::: definition トレースと次元 {#cat:trace-dimension keywords="categorical trace of an endomorphism of a dualizable object, dimension, Euler characteristic" index="トレース（圏論）|とれーすけんろん, 次元（双対化可能な対象）|じげんそうついかかのうなたいしょう"}
双対化可能な $a$ の自己射 $f\colon a\to a$ について、
$$
\operatorname{tr}(f)\colon I\xrightarrow{\eta}a\otimes a^{*}\xrightarrow{f\otimes1}a\otimes a^{*}\xrightarrow{\gamma}a^{*}\otimes a\xrightarrow{\varepsilon}I
$$
を $f$ の**トレース**、$\dim a\defeq\operatorname{tr}(1_{a})\in\mathbf{V}(I,I)$ を $a$ の**次元**という。
:::

::: example
1. 有限次元ベクトル空間 $V$（基底 $v_{i}$、双対基底 $v_{i}^{*}$、$\eta(1)=\sum v_{i}\otimes v_{i}^{*}$）では、$\operatorname{tr}(f)(1)=\sum_{i}v_{i}^{*}(f(v_{i}))$ は通常のトレースで、$\dim V$ は通常の次元（$\mathbf{V}(k,k)=k$ の元とみる）。
2. 群 $G$ の表現の圏（テンソル積 \ref{rep:constructions}）で、$g$ の作用のトレースは指標の値 $\chi_{V}(g)$（\ref{rep:character}）である。
3. 鎖複体の圏（例 3 の符号つきの対称射）では、次元は次数ごとの次元の交代和、すなわちオイラー標数になる（対称射の符号 $(-1)^{pq}$ が奇数次に $-1$ を与える。本サイト未収録の計算）。
:::

::: supplement
**一般化.** 対称でないモノイダル閉圏（左右の内部 hom が異なる **双閉圏**。例えば両側加群のテンソル積）、豊穣圏論（\ref{cat:page-closed-categories} の補足）、線形論理のモデルとしての $*$ 自律圏、が知られている（本サイト未収録）。

**ストリング図式.** モノイダル圏の射は、平面上の線と箱の図（ストリング図式）で描け、ジグザグ等式は「曲がった線を伸ばすことができる」ことになる。コンパクト閉圏の計算は、図の位相的な変形で行える（ジョイヤル＝ストリートなど。本サイト未収録）。2 次元のボルディズム圏からベクトル空間の圏への対称モノイダル関手（位相的場の理論）は可換フロベニウス代数と対応することが知られている（本サイト未収録）。

**高い視点.** \ref{cat:dualizable-modules} は、「有限生成射影加群」という環論の条件が、テンソル積に関する双対性という圏論的な条件と一致することを示している。ベクトル束（\ref{ring:local-projective-free} の補足：局所自由加群）を「双対化可能な加群」と言い換えると、トレース・次元・オイラー標数が統一的に扱える。
:::

## 問題 {#cat:sec-smc-problems}

::: problem {#cat:prob-smc-dual-of-dual}
双対化可能な $a$ について、$a^{*}$ も双対化可能で $a^{**}\cong a$ であることを示せ。
:::

::: solution
$a^{*}$ の双対として $a$ をとり、$\varepsilon'\defeq\varepsilon\circ\gamma_{a,a^{*}}\colon a\otimes a^{*}\to I$、$\eta'\defeq\gamma_{a,a^{*}}\circ\eta\colon I\to a^{*}\otimes a$ とおく。ジグザグ等式は、もとのジグザグ等式を対称射で入れ替えたものになる（対称モノイダル圏のコヒーレンス \ref{cat:symmetric-coherence} により、$\gamma$ を挟んだ図式は置換が同じなら可換）。\ref{cat:dual-internal-hom} の証明から、$a^{*}$ の双対 $d$ について $-\otimes d$ は $-\otimes a^{*}$ の右随伴で、右随伴の一意性（\ref{cat:adjoint-unique}）から双対は同型を除いて一意。よって $a^{**}\cong a$。
:::
