# 圏論（Category Theory）

圏・関手・自然変換、極限と随伴、モノイダル圏、モナド、カン拡張とエンド、高次圏、豊穣圏と双対性、オペラッドと反復ループ空間、層のコホモロジー、トポスとサイト。

<p class="mn-msc">MSC2020: 18A, 18B, 18F, 18M</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-basics/index.html"><span class="mn-card-title">圏論の基礎</span><span class="mn-card-en">Basic Category Theory</span><span class="mn-card-desc">圏・関手・自然変換、米田の補題、極限と余極限、随伴、圏同値、随伴関手定理、位相空間の圏の随伴（始位相・終位相、完備性、ハウスドルフ化）、特殊随伴関手定理。（Mac Lane『Categories for the Working Mathematician』第 I〜V 章に対応）</span><span class="mn-card-count">12 ページ</span></a>
<a class="mn-card" href="02-monoidal-categories/index.html"><span class="mn-card-title">モノイダル圏</span><span class="mn-card-en">Monoidal Categories</span><span class="mn-card-desc">モノイダル圏とコヒーレンス定理、モノイドと作用、単体圏（普遍モノイド）、デカルト閉圏とローヴェアの不動点定理、閉圏とコンパクト生成空間、モノイダル関手と厳密化、対称・組紐モノイダル圏のコヒーレンスと組紐群、強モノイダルな左随伴の右随伴（ドクトリン的随伴）、ローヴェアの距離空間（[0,∞] 上の豊穣圏と米田の補題）、対称モノイダル閉圏。（主に Mac Lane 第 IV 章 §6・§10、第 VII 章、第 XI 章に対応。ループ空間と懸垂は「オペラッドと反復ループ空間」にある）</span><span class="mn-card-count">11 ページ</span></a>
<a class="mn-card" href="03-monads/index.html"><span class="mn-card-title">モナドと代数</span><span class="mn-card-en">Monads and Algebras</span><span class="mn-card-desc">モナドとアイレンバーグ–ムーア代数、比較関手、クライスリ圏、分裂余等化子とベックのモナド性定理、普遍代数とコンパクトハウスドルフ空間のモナド性、余モナドと棒分解・群のコホモロジー。（Mac Lane 第 VI 章と §VII.6 に対応）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="04-kan-extensions/index.html"><span class="mn-card-title">カン拡張とエンド</span><span class="mn-card-en">Special Limits and Kan Extensions</span><span class="mn-card-desc">フィルター付き余極限と有限極限の交換、終関手、エンドとコエンド、カン拡張（各点カン拡張・コエンドによる公式）、稠密性、元の圏と離散ファイブレーション（前層との同値、前層の圏のスライス）。（主に Mac Lane 第 IX・X 章に対応。神経と実現の随伴は「高次圏と単体的方法」にある）</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="05-higher-categories/index.html"><span class="mn-card-title">高次圏と単体的方法</span><span class="mn-card-en">Structures in Categories</span><span class="mn-card-desc">内部圏と内部の図式、圏の神経、神経と実現の随伴、2 圏と 2 圏の中の随伴、2 関手と変形、単一集合による n 圏、双圏（両側加群とスパン）、交差加群と群の中の圏、神経の特徴づけ（セガール条件）。（主に Mac Lane 第 X 章 §6・第 XII 章に対応）</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="06-enriched-rigid/index.html"><span class="mn-card-title">豊穣圏と双対性</span><span class="mn-card-en">Enriched and Rigid Monoidal Categories</span><span class="mn-card-desc">豊穣圏・豊穣関手・基礎の変換、エンドと豊穣米田の補題、デイ畳み込み、ストリング図式、剛性・ピボタル・リボン圏、タングルとジョーンズ多項式、ホップ代数と表現圏、淡中再構成。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="07-operads/index.html"><span class="mn-card-title">オペラッドと反復ループ空間</span><span class="mn-card-en">Operads and Loop Spaces</span><span class="mn-card-desc">スマッシュ積と懸垂・ループ空間の随伴、オペラッドとその代数、小区間オペラッドとループ空間、小円板オペラッドと Eₙ 代数、エックマン–ヒルトンの議論、E₂ と組紐、対称モノイダル圏と無限ループ空間。</span><span class="mn-card-count">7 ページ</span></a>
<a class="mn-card" href="08-sheaf-cohomology/index.html"><span class="mn-card-title">層のコホモロジー</span><span class="mn-card-en">Sheaf Cohomology</span><span class="mn-card-desc">位相空間上の前層と層・茎と芽、層化とエタール空間、順像と逆像の随伴と 0 拡張、アーベル群の層の圏と層コホモロジー、脆弱層・ゴドマン分解・チェックコホモロジーとルレイの定理、軟層と特異コホモロジーとの比較。サイト上の層と層の圏のトポスとしての性質は「トポスとサイト」にある。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="09-topos-theory/index.html"><span class="mn-card-title">トポスとサイト</span><span class="mn-card-en">Toposes and Sites</span><span class="mn-card-desc">前層の圏のトポス、空間上の層の圏のトポス、部分対象分類子と初等トポス、ハイティング代数と量化子、サイトとグロタンディーク位相、サイト上の層化とグロタンディーク・トポス、ジローの公理と定理、エタール位相（体のエタール層＝ガロア集合）。</span><span class="mn-card-count">9 ページ</span></a>
</div>
