# 小円板オペラッドと Eₙ {#cat:page-little-disks keywords="little n-cubes operad, little disks operad, E_n operad, n-fold loop space is a C_n-algebra, stabilization C_n -> C_{n+1}, C_n(k) is path connected for n >= 2, higher homotopy groups, pi_n is abelian for n >= 2, configuration spaces"}

小区間を $n$ 次元の小さな立方体（または円板）に替えると、**小 $n$ 立方体オペラッド** $\mathcal{C}_{n}$ が得られ、$n$ 重ループ空間 $\Omega^{n}X$ はその代数になる。$n\ge2$ では立方体どうしが互いのまわりを回り込めるので、$\mathcal{C}_{n}(k)$ は弧状連結になり、連結成分をとると可換オペラッド $\mathrm{Com}$ になる。その結果、**高次ホモトピー群** $\pi_{n}(X)=\pi_{0}(\Omega^{n}X)$ は $n\ge2$ で可換である。$\mathcal{C}_{n}$ と（適切な意味で）同値なオペラッドを **$E_{n}$ オペラッド**という。

> 小立方体オペラッドは J. M. Boardman–R. Vogt による。

## 記法と定義の確認 {#cat:sec-ldk-notation}

::: notation
- 小区間オペラッド・ループ空間の作用・基本群は \ref{cat:little-intervals-operad}, \ref{cat:little-intervals-properties}, \ref{cat:loop-space-c1-algebra}, \ref{cat:fundamental-group-loops}。オペラッドとその代数・$\mathrm{Com}$ とその代数（可換モノイド）は \ref{cat:operad-algebra}, \ref{cat:ass-com-algebras}。
- $I^{n}$ は $n$ 次元の単位立方体、$\partial I^{n}$ はその境界。$\Omega^{n}X$ は $\partial I^{n}$ を基点 $\ast$ に写す連続写像 $I^{n}\to X$ の空間（コンパクト開位相の\term[部分空間]{top:subspace}）。$I^{n}$ はコンパクトハウスドルフなので、評価写像の連続性と指数の連続性（\ref{top:evaluation-continuous}, \ref{top:exponential-continuous}）が使える。
- $\lVert x\rVert_{\infty}=\max_{r}\lvert x_{r}\rvert$。
- **選択公理**：使わない（有限個の実数の選択だけ）。
:::

## 小立方体オペラッド {#cat:sec-ldk-operad}

::: definition 小立方体オペラッド {#cat:little-cubes-operad keywords="little n-cubes operad C_n, stabilization map C_n -> C_{n+1}" index="小立方体オペラッド|しょうりっぽうたいおぺらっど, 小円板オペラッド|しょうえんばんおぺらっど"}
**小 $n$ 立方体**とは、$c=c^{1}\times\cdots\times c^{n}:I^{n}\to I^{n}$（各 $c^{r}$ は小区間 $t\mapsto a_{r}+(b_{r}-a_{r})t$）の形の写像のこと。$\mathcal{C}_{n}(k)$ を、小 $n$ 立方体の $k$ 個組で像の内部が互いに交わらないものの空間（$\mathbb{R}^{2nk}$ の\term[部分空間]{top:subspace}）とし、$\Sigma_{k}$ の作用・単位・合成を \ref{cat:little-intervals-operad} と同じ式で定める。$c\mapsto c\times\mathrm{id}_{I}$ は**安定化**の写像 $\mathcal{C}_{n}(k)\to\mathcal{C}_{n+1}(k)$ を定める。
:::

::: proposition 小立方体オペラッドの性質 {#cat:little-cubes-properties keywords="C_n is an operad; stabilization is a map of operads; Omega^n X is a C_n-algebra" index="n 重ループ空間|えぬじゅうるーぷくうかん"}
1. $\mathcal{C}_{n}$ は位相空間の対称オペラッドで、安定化はオペラッドの射。$\mathcal{C}_{1}$ は \ref{cat:little-intervals-operad}。
2. $\theta(c;\ell_{1},\dots,\ell_{k})(t)\defeq\ell_{i}(c_{i}^{-1}(t))$（$t\in c_{i}(I^{n})$）、それ以外で $\ast$ とおくと、$\Omega^{n}X$ は $\mathcal{C}_{n}$ 代数。
:::

::: proof
**Step 1（1）.** \ref{cat:little-intervals-properties} の Step 1 と同じ：小立方体の合成は小立方体で、内部の非交差は保たれる。安定化は合成と単位と作用を保つ（最後の座標で恒等写像を合成するだけ）。

**Step 2（2）.** \ref{cat:loop-space-c1-algebra} の証明と同じ。連続性は、閉集合 $A_{i}\defeq\{(c,\ell,t) : t\in c_{i}(I^{n})\}$（座標ごとの不等式）と $B\defeq\{t\text{ がどの }c_{i}\text{ の像の内部にもない}\}$ による有限の閉被覆と貼り合わせ補題。$A_{i}\cap A_{j}$ と $A_{i}\cap B$ では $t$ は $c_{i}(\partial I^{n})$ に入り、そこで $\ell_{i}$ は $\ast$。
:::

## $n\ge2$ での連結性 {#cat:sec-ldk-connected}

::: theorem 小立方体の空間の連結性 {#cat:little-cubes-connected keywords="for n >= 2, C_n(k) is path connected; pi_0 C_n is the commutative operad" index="小立方体の空間の連結性|しょうりっぽうたいのくうかんのれんけつせい"}
$n\ge2$ なら、すべての $k$ で $\mathcal{C}_{n}(k)$ は弧状連結。したがって $\pi_{0}\mathcal{C}_{n}\cong\mathrm{Com}$。
:::

::: proof
$c=(c_{1},\dots,c_{k})\in\mathcal{C}_{n}(k)$ を、立方体 $c_{i}$ の中心 $p_{i}$ と辺の長さ（座標ごと）で表す。「列型」の配置 $L_{\pi}$（並び順 $\pi\in\Sigma_{k}$ の $\mathcal{C}_{1}(k)$ の元に、残りの座標で $I^{n-1}$ 全体を掛けたもの）を考える。

**Step 1（縮める）.** 各 $c_{i}$ を中心 $p_{i}$ を固定して、すべての辺の長さを $\varepsilon$（すべての辺の長さより小さい正の数）まで線形に縮める道は、途中の立方体が元の $c_{i}$ に含まれるので $\mathcal{C}_{n}(k)$ の中にある。縮めたあとの立方体は辺 $\varepsilon$ で、元の内部が交わらないことから中心は $\lVert p_{i}-p_{j}\rVert_{\infty}\ge\varepsilon$（$i\neq j$）をみたす。さらに辺を $\varepsilon/3$ まで縮める。

**Step 2（第 1 座標をずらす）.** 中心の第 1 座標 $p_{i}^{1}$ たちを、それぞれ $\varepsilon/6$ 未満だけ動かして互いに異なる値 $q_{i}^{1}$ にできる（有限個の実数）。中心を直線で動かす道を考えると、途中で中心どうしの $\lVert\cdot\rVert_{\infty}$ 距離は $\varepsilon-2\cdot\varepsilon/6>\varepsilon/3$ 以上なので辺 $\varepsilon/3$ の立方体の内部は交わらず、各立方体は（元の辺 $\varepsilon$ の立方体の $\varepsilon/6$ 近傍が辺 $\varepsilon/3$ のずれを吸収するので）$I^{n}$ の中にある。

**Step 3（列型にする）.** 第 1 座標の中心が互いに異なるので、辺の第 1 座標の長さをさらに小さくして、第 1 座標の区間が互いに交わらないようにする。このとき、第 2 座標以降の区間をどう動かしても内部は交わらないので、第 2 座標以降の区間を $[0,1]$ まで線形に広げる道は $\mathcal{C}_{n}(k)$ の中にある。こうして $c$ は列型の配置 $L_{\pi}$ のどれか（第 1 座標の並び順を $\pi$ とする）と結ばれる。並び順 $\pi$ を固定した列型の配置の全体は凸集合（\ref{cat:little-intervals-properties.2}）なので、$L_{\pi}$ の取り方によらない。

**Step 4（隣の二つを入れ替える）.** 列型の配置で、第 1 座標で隣り合う二つの立方体 $c_{i}$（区間 $[a,b]$）と $c_{i'}$（区間 $[a',b']$, $b\le a'$）を考える。(a) 第 2 座標を、$c_{i}$ は $[0,\tfrac12]$、$c_{i'}$ は $[\tfrac12,1]$ まで縮める。(b) 第 2 座標の区間が交わらないので、第 1 座標を自由に動かせる：$c_{i}$ を $[b'-(b-a),b']$ へ、$c_{i'}$ を $[a,a+(b'-a')]$ へ線形に動かす（どちらも $[a,b']$ の中で、他の立方体の第 1 座標の区間とは交わらない）。(c) 第 2 座標を $[0,1]$ に戻す。こうして並び順 $\pi$ の列型と、$\pi$ に隣接互換を合成した並び順の列型が結ばれる（ここで $n\ge2$、すなわち第 2 座標の存在を使った）。

**Step 5（まとめ）.** 隣接互換は $\Sigma_{k}$ を生成するので、すべての列型は一つの弧状連結成分に入り、Step 3 からすべての配置がそこに入る。$\pi_{0}\mathcal{C}_{n}(k)$ は 1 点で、1 点のオペラッドは $\mathrm{Com}$。
:::

::: corollary 高次ホモトピー群 {#cat:higher-homotopy-groups keywords="pi_n(X) = pi_0 Omega^n X is a group for n >= 1 and abelian for n >= 2" index="高次ホモトピー群|こうじほもとぴーぐん, ホモトピー群|ほもとぴーぐん"}
$\pi_{n}(X,\ast)\defeq\pi_{0}(\Omega^{n}X)$ は $n\ge1$ で群、$n\ge2$ で可換群。
:::

::: proof
**Step 1（群）.** 第 1 座標についてのつなぎ合わせ（$\mathcal{C}_{1}\to\mathcal{C}_{n}$ の安定化の像の元）と、第 1 座標の反転 $\bar\ell(t_{1},t_{2},\dots)\defeq\ell(1-t_{1},t_{2},\dots)$ について、\ref{cat:fundamental-group-loops} の証明が第 1 座標についてそのまま使える（他の座標はパラメータ）。

**Step 2（可換）.** $\pi_{0}$ は有限積を保つので $\pi_{0}\Omega^{n}X$ は $\pi_{0}\mathcal{C}_{n}$ 代数で、$n\ge2$ なら \ref{cat:little-cubes-connected} から $\mathrm{Com}$ 代数、すなわち可換モノイド（\ref{cat:ass-com-algebras.2}）。その積は Step 1 の積と同じ（$\mathcal{C}_{n}(2)$ は弧状連結で、積はどの点でとっても同じ）なので、群の積が可換。
:::

::: example 配置空間と $E_{n}$ オペラッド（本サイト未収録の事実を含む）
1. 中心をとる写像 $\mathcal{C}_{n}(k)\to\operatorname{Conf}_{k}(\mathbb{R}^{n})$（相異なる $k$ 点の配置空間）はホモトピー同値であることが知られている。とくに $\mathcal{C}_{n}(2)\simeq S^{n-1}$。$n=1$ では $\operatorname{Conf}_{k}(\mathbb{R})$ は $k!$ 個の可縮な成分（\ref{cat:little-intervals-properties}）、$n\ge2$ では弧状連結（上の定理）。
2. 小 $n$ 円板（立方体の代わりに円板）のオペラッドも同様に定義でき、$\mathcal{C}_{n}$ と同値である。各 $k$ で $\Sigma_{k}$ 同変なホモトピー同値を通じて $\mathcal{C}_{n}$ と結ばれるオペラッドを **$E_{n}$ オペラッド**という。$E_{1}$ は $A_{\infty}$、$E_{\infty}$（$\mathcal{C}_{\infty}=\bigcup_{n}\mathcal{C}_{n}$、各 $\mathcal{C}_{\infty}(k)$ が可縮で $\Sigma_{k}$ が自由に作用）は「ホモトピーを除いて可換」の完全な形。
3. **認識定理**（メイ, 1972）：$\pi_{0}$ が群になる $\mathcal{C}_{n}$ 代数は $n$ 重ループ空間とホモトピー同値である。
:::

::: hypcheck
- **選択公理**：使わない。Step 2 の値 $q_{i}^{1}$ は、$i=1,2,\dots,k$ の順に、$(p_{i}^{1}-\varepsilon/6,p_{i}^{1}+\varepsilon/6)$ から、すでに決めた有限個の値を避けて一つずつとるだけ（有限回の選択）なので、選択公理は要らない。
- **$n\ge2$** は Step 4（入れ替えに第 2 座標を使う）だけで使った。$n=1$ では Step 4 が不可能で、実際 $\mathcal{C}_{1}(k)$ は $k!$ 個の成分をもつ。
- **アフィン性（立方体）**：合成が閉じること、縮める道が元の立方体に含まれることに使った。
:::

::: supplement
**前提を変えると.** 安定化 $\mathcal{C}_{n}\to\mathcal{C}_{n+1}$ に沿って、$\mathcal{C}_{n+1}$ 代数は $\mathcal{C}_{n}$ 代数になる（$\Omega^{n+1}X=\Omega^{n}(\Omega X)$ と両立）。$\mathcal{C}_{n}(k)$ の高次のホモトピー（たとえば $\mathcal{C}_{2}(2)\simeq S^{1}$ の基本群 $\mathbb{Z}$）は、可換性のホモトピーの「巻き数」を記録し、$E_{2}$ 代数は可換でも厳密に対称でもなく「組紐」的になる（\ref{cat:page-e2-braided}）。

**計算の観点.** $\pi_{n}(S^{m})$（球面のホモトピー群）は、どの有限個も計算可能（E. Brown, 1957）だが、一般的な公式は知られておらず、計算は非常に難しい（本サイト未収録）。
:::

## 高い視点 {#cat:sec-ldk-viewpoint}

::: remark 次元が上がると可換になる（再び）
ストリング図式で「動ける次元が増えると並び順が意味を失う」と述べた（\tref{cat:page-string-diagrams}）のと同じことが、ここでは空間の言葉で起こる。1 次元の区間の中の小区間は互いを追い越せないので順序が残る（$\pi_{0}\mathcal{C}_{1}=\mathrm{Ass}$）が、2 次元の正方形の中の小正方形は互いを回り込めるので順序は消える（$\pi_{0}\mathcal{C}_{2}=\mathrm{Com}$）。ただし「回り込み方」には右回り・左回りの区別が残り（$\pi_{1}\mathcal{C}_{2}(2)=\mathbb{Z}$）、3 次元以上でその区別も消える（$\pi_{1}\mathcal{C}_{n}(2)=\pi_{1}S^{n-1}=0$）。この階層 $E_{1}\subset E_{2}\subset\cdots\subset E_{\infty}$ が、モノイダル圏 ⊂ 組紐モノイダル圏 ⊂ 対称モノイダル圏の階層に対応する。
:::

## 問題 {#cat:sec-ldk-problems}

::: problem {#cat:prob-ldk-swap-path}
$\mathcal{C}_{2}(2)$ で、配置 $c=([0,\tfrac12]\times I,[\tfrac12,1]\times I)$ から $c\cdot(12)=([\tfrac12,1]\times I,[0,\tfrac12]\times I)$ への道を具体的に書け。
:::

::: solution
\ref{cat:little-cubes-connected} の Step 4 に従う。$s\in[0,1]$ について：(a) $c_{1}^{s}=[0,\tfrac12]\times[0,1-\tfrac s2]$, $c_{2}^{s}=[\tfrac12,1]\times[\tfrac s2,1]$（$s=1$ で $c_{1}$ は下半分、$c_{2}$ は上半分）。(b) $c_{1}^{s}=[\tfrac s2,\tfrac{1+s}2]\times[0,\tfrac12]$, $c_{2}^{s}=[\tfrac{1-s}2,1-\tfrac s2]\times[\tfrac12,1]$（第 2 座標の区間は端点だけで接するので内部は交わらない）。(c) $c_{1}^{s}=[\tfrac12,1]\times[0,\tfrac12+\tfrac s2]$, $c_{2}^{s}=[0,\tfrac12]\times[\tfrac12-\tfrac s2,1]$（第 1 座標の区間が端点だけで接する）。三つをつなげると求める道。
:::
