# 対称モノイダル圏と無限ループ空間 {#cat:page-infinite-loop keywords="Grothendieck group, group completion of a commutative monoid, K_0 of a symmetric monoidal category, K_0 of a ring, nerve, classifying space of a category, natural transformations give homotopies, E-infinity spaces, Segal's theorem, infinite loop spaces, Barratt-Priddy-Quillen, algebraic K-theory"}

$E_{n}$ の階層の終点 $E_{\infty}$ には、**対称モノイダル圏**が対応する（\ref{cat:page-e2-braided} の表）。対称モノイダル圏の対象の同型類は可換モノイドをなし、それを群にしたもの（**グロタンディーク群**）が $K_{0}$ である。たとえば有限生成射影加群の圏からは環の $K_{0}$ が得られる。さらに圏の**分類空間** $B\mathbf{C}$ をとると、対称モノイダル圏は $E_{\infty}$ 空間を与え、その群完備化は**無限ループ空間**になる（セガールの定理）。本ページでは、グロタンディーク群の構成と普遍性、$K_{0}$ の例、分類空間の基本性質（自然変換はホモトピーを与える）を証明し、無限ループ空間の理論は知られている事実として整理する。

> セガールの定理などの位相的な主定理は本サイト未収録。

## 記法と定義の確認 {#cat:sec-ilp-notation}

::: notation
- 対称モノイダル圏・コヒーレンスは \ref{cat:symmetric-monoidal}, \ref{cat:symmetric-coherence-general}。可換モノイドは \ref{cat:ass-com-algebras.2}。
- 単体的対象・単体的集合と神経 $N\mathbf{C}$（$N_{n}\mathbf{C}$ は長さ $n$ の合成可能な射の列）は \ref{cat:simplicial-object}, \ref{cat:page-internal-categories}。関手のテンソル積（コエンド）は \ref{cat:tensor-as-coend}。
- 有限生成射影加群と PID 上の加群の構造は \ref{mod:page-pid-modules} の記法。
- **選択公理**：グロタンディーク群の構成では使わない。分類空間の性質（本サイト未収録の部分）については述べない。
:::

## グロタンディーク群 {#cat:sec-ilp-grothendieck}

::: definition グロタンディーク群 {#cat:grothendieck-group keywords="Grothendieck group (group completion) of a commutative monoid" index="グロタンディーク群|ぐろたんでぃーくぐん, 群完備化|ぐんかんびか"}
可換モノイド $(M,+,0)$ について、$M\times M$ 上の関係 $(a,b)\sim(c,d)\iff$ ある $e\in M$ で $a+d+e=b+c+e$ は同値関係で、商 $K(M)\defeq(M\times M)/{\sim}$ は成分ごとの和で可換群になる（$[a,b]$ は「$a-b$」を表し、$-[a,b]=[b,a]$）。$\iota:M\to K(M)$, $a\mapsto[a,0]$ はモノイドの準同型。$K(M)$ を $M$ の**グロタンディーク群**（**群完備化**）という。
:::

::: theorem グロタンディーク群の普遍性 {#cat:grothendieck-group-universal keywords="universal property of the Grothendieck group; iota is injective iff M is cancellative" index="グロタンディーク群の普遍性|ぐろたんでぃーくぐんのふへんせい"}
1. 可換モノイドから可換群（アーベル群）$A$ への準同型 $f:M\to A$ は、$\bar f\circ\iota=f$ となる群準同型 $\bar f:K(M)\to A$ をただ一つもつ。すなわち $K$ は忘却関手 $\mathbf{Ab}\to\mathbf{CMon}$ の左随伴。
2. $\iota$ が単射 $\iff$ $M$ が簡約的（$a+e=b+e\Rightarrow a=b$）。
:::

::: proof
**Step 1（同値関係）.** 反射・対称は明らか。推移：$a+d+e=b+c+e$, $c+h+e'=d+g+e'$ なら、二式を足して $c+d$ を（$e''\defeq c+d+e+e'$ として）吸収すると $a+h+e''=b+g+e''$。

**Step 2（群）.** 和は代表のとり方によらず（$e$ を足し合わせる）、$[a,b]+[b,a]=[a+b,a+b]=[0,0]$（$(a+b)+0+0=0+(a+b)+0$）。

**Step 3（1）.** $\bar f[a,b]\defeq f(a)-f(b)$ は well-defined（$a+d+e=b+c+e$ なら $f(a)+f(d)=f(b)+f(c)$、$A$ では $f(e)$ を消せる）で、準同型。一意性：$[a,b]=\iota(a)-\iota(b)$ なので $\bar f$ は $\iota$ の像で決まる。

**Step 4（2）.** $\iota(a)=\iota(b)\iff a+0+e=b+0+e$（ある $e$）。簡約的ならこれは $a=b$、逆に簡約的でなければ $a+e=b+e$, $a\neq b$ となる組で $\iota(a)=\iota(b)$。
:::

::: example
1. $K(\mathbb{N})=\mathbb{Z}$。$K(\mathbb{N}_{>0},\times)=\mathbb{Q}_{>0}^{\times}$（正の有理数の乗法群）。
2. $M=\mathbb{N}\cup\{\infty\}$（$a+\infty=\infty$）なら、すべての $(a,b)$ が $e=\infty$ で $(0,0)$ と同値なので $K(M)=0$。吸収元は群完備化ですべてを消す。
:::

## 対称モノイダル圏の $K_{0}$ {#cat:sec-ilp-k0}

::: definition $K_{0}$ {#cat:k0-symmetric-monoidal keywords="K_0 of an essentially small symmetric monoidal category: Grothendieck group of isomorphism classes" index="K₀（対称モノイダル圏）|けーぜろたいしょうものいだるけん"}
本質的に小さい対称モノイダル圏 $(\mathbf{C},\otimes,I,\gamma)$ について、対象の同型類の集合 $\pi_{0}^{\cong}\mathbf{C}$ は $[a]+[b]\defeq[a\otimes b]$, $0\defeq[I]$ で可換モノイド（結合・単位は $\alpha,\lambda,\varrho$、可換は $\gamma$ による同型から）。$K_{0}(\mathbf{C})\defeq K(\pi_{0}^{\cong}\mathbf{C})$ とおく。
:::

::: example $K_{0}$ の例 {#cat:k0-examples}
1. 有限集合と写像の圏（$\sqcup$）：同型類は濃度 $\mathbb{N}$、$K_{0}=\mathbb{Z}$。
2. 体 $k$ 上の有限次元ベクトル空間（$\oplus$）：同型類は次元 $\mathbb{N}$、$K_{0}=\mathbb{Z}$。$\otimes$ をモノイダル構造にすると $(\mathbb{N}_{>0}\cup\{0\},\times)$ の群完備化で、$0$ が吸収元なので $K_{0}=0$（例 2 と同じ現象）。
3. **環の $K_{0}$**：環 $R$ の有限生成射影加群の圏（$\oplus$）の $K_{0}$ を $K_{0}(R)$ と書く。$R$ が PID なら、有限生成射影加群は自由（射影加群は自由加群の直和因子、したがって部分加群で、PID 上の自由加群の部分加群は自由。\ref{mod:pid-submodule-free}）で同型類は階数 $\mathbb{N}$、$K_{0}(R)=\mathbb{Z}$。$R=R_{1}\times R_{2}$ なら射影加群は $P_{1}\times P_{2}$ の形で、$K_{0}(R)=K_{0}(R_{1})\oplus K_{0}(R_{2})$、たとえば $K_{0}(\mathbb{Z}\times\mathbb{Z})=\mathbb{Z}^{2}$。
4. **安定同型**：$[P]=[Q]$ in $K_{0}(R)$ $\iff$ ある $n$ で $P\oplus R^{n}\cong Q\oplus R^{n}$（ある射影加群 $E$ で $P\oplus E\cong Q\oplus E$ で、$E\oplus E'\cong R^{n}$ となる $E'$ を加える）。$P\oplus R\cong R^{n+1}$ だが $P\not\cong R^{n}$ となる環と加群があり（安定自由だが自由でない。たとえば実数係数の 2 次元球面上の連続関数環の接束の切断の加群）、$\iota$ は単射でない（本サイト未収録の例）。
:::

## 分類空間 {#cat:sec-ilp-classifying}

::: definition 幾何学的実現と分類空間 {#cat:classifying-space keywords="geometric realization of a simplicial set as a coend, classifying space BC = |NC|" index="分類空間|ぶんるいくうかん, 幾何学的実現|きかがくてきじつげん"}
単体的集合 $X$ の**幾何学的実現**を、コエンド（関手のテンソル積）$\lvert X\rvert\defeq\int^{[n]\in\Delta}X_{n}\times\Delta^{n}$ とする（$\Delta^{n}$ は標準単体、$X_{n}$ は離散空間。\ref{cat:tensor-as-coend}）。小さい圏 $\mathbf{C}$ の**分類空間**を $B\mathbf{C}\defeq\lvert N\mathbf{C}\rvert$ とする。
:::

::: proposition 分類空間の基本性質 {#cat:classifying-space-basic keywords="B of [1] is an interval; a natural transformation induces a homotopy; an equivalence of categories induces a homotopy equivalence; categories with initial or terminal objects are contractible" index="分類空間の基本性質|ぶんるいくうかんのきほんせいしつ"}
次の事実 (P)「$B(\mathbf{C}\times\mathbf{D})\to B\mathbf{C}\times B\mathbf{D}$ は（$\mathbf{CGHaus}$ の積について）同相」を認める（本サイト未収録。実現と有限積の交換）。
1. $\mathbf{2}\defeq\{0\to1\}$ について $B\mathbf{2}\cong\Delta^{1}=[0,1]$。
2. 自然変換 $\theta:F\Rightarrow G:\mathbf{C}\to\mathbf{D}$ は、$BF$ と $BG$ の間のホモトピーを誘導する。
3. 圏同値 $\mathbf{C}\simeq\mathbf{D}$ は分類空間のホモトピー同値を誘導する。随伴 $F\dashv G$ についても $BF$ と $BG$ は互いにホモトピー逆。
4. 始対象または終対象をもつ圏の分類空間は可縮。
:::

::: proof
**Step 1（1）.** $N\mathbf{2}$ は標準 1 単体 $\Delta[1]$（$[n]\to[1]$ の単調写像の集合）で、米田の補題（コエンド形、\ref{cat:co-yoneda}）から $\lvert\Delta[1]\rvert=\int^{n}\Delta([n],[1])\times\Delta^{n}\cong\Delta^{1}$。

**Step 2（2）.** 自然変換は関手 $H:\mathbf{C}\times\mathbf{2}\to\mathbf{D}$（$H(-,0)=F$, $H(-,1)=G$, $H(c,0\to1)=\theta_{c}$）と同じもの。$BH:B(\mathbf{C}\times\mathbf{2})\cong B\mathbf{C}\times[0,1]\to B\mathbf{D}$（(P) と 1）が $BF$ と $BG$ の間のホモトピー。

**Step 3（3）.** 随伴の単位と余単位は自然変換 $1\Rightarrow GF$, $FG\Rightarrow1$ なので、2 から $B(GF)\simeq1$, $B(FG)\simeq1$。圏同値も随伴（\ref{cat:adjoint-equivalence}）。

**Step 4（4）.** 終対象 $t$ について、$\mathbf{C}\to\mathbf{1}$ と $\mathbf{1}\to\mathbf{C}$（$t$ を選ぶ）は随伴（$\mathbf{C}(c,t)=\ast$）。$B\mathbf{1}$ は 1 点なので、3 から $B\mathbf{C}$ は 1 点とホモトピー同値。始対象も同様。
:::

::: remark 無限ループ空間について知られていること（本サイト未収録）
1. **$E_{\infty}$ 空間**：対称モノイダル圏 $\mathbf{C}$ の分類空間 $B\mathbf{C}$ は（適切に厳密化すれば）$E_{\infty}$ オペラッドの代数で、$\pi_{0}B\mathbf{C}$ は（$\mathbf{C}$ が亜群なら）同型類の可換モノイド。
2. **群完備化定理**：$E_{\infty}$ 空間 $Y$ の群完備化 $\Omega BY$ について、$\pi_{0}\Omega BY=K(\pi_{0}Y)$ で、ホモロジーは $\pi_{0}Y$ を逆元にした局所化になる（D. McDuff–G. Segal, 1976）。
3. **セガールの定理**（G. Segal, 1974）：対称モノイダル圏（より一般に $\Gamma$ 空間）から、群完備化が**無限ループ空間**（すべての $n$ で $\Omega^{n}Y_{n}$ の形の空間、すなわちスペクトラムの 0 番目の空間）となるものが作れる。
4. **バラット–プリディ–キレンの定理**：有限集合と全単射の亜群（$\sqcup$）から得られる無限ループ空間は、球面スペクトラムの $\Omega^{\infty}S^{\infty}=\operatorname{colim}_{n}\Omega^{n}S^{n}$ で、$\pi_{0}=\mathbb{Z}=K_{0}$（例 1）、$\pi_{n}$ は球面の安定ホモトピー群。
5. **代数的 $K$ 理論**：環 $R$ の有限生成射影加群と同型の亜群からセガールの構成で得られる無限ループ空間 $K(R)$ のホモトピー群が $K_{n}(R)$（D. Quillen）。$K_{0}$ は上の例 3、$K_{1}(R)=GL(R)^{\mathrm{ab}}$。
:::

::: hypcheck
- **選択公理**：使わない（$K_{0}$ の定義では同型類をとるだけで代表は選ばない。分類空間の性質 4 で終対象 $t$ を「選ぶ」のは、存在する一つの対象を固定するだけ）。
- **本質的に小さい**ことは、同型類の全体が集合であること（$K_{0}$ の定義）に使った。
- **対称性**は $\pi_{0}^{\cong}\mathbf{C}$ の可換性に使った。組紐だけなら同型類のモノイドはやはり可換（組紐も同型）なので $K_{0}$ は定義できるが、高次の構造は $E_{2}$ 止まりで無限ループ空間にはならない。
- 分類空間の性質は事実 (P)（未収録）に依存する。
:::

::: supplement
**計算の観点.** 有限生成可換モノイドの群完備化は、生成元と関係の整数行列のスミス標準形（\ref{mod:smith-pr-euclidean}）で計算できる。$K_{0}$ の計算は一般には難しく、たとえば $K_{0}(\mathbb{Z}[G])$（有限群の整数群環）は類数の計算を含む。
:::

## 高い視点 {#cat:sec-ilp-viewpoint}

::: remark 「数える」ことの圏化
$K_{0}$ は「対象を同型を除いて数え、足し算を引き算できるようにする」操作で、自然数を整数にすることの一般化である。分類空間と無限ループ空間は、同型を除いて同一視する代わりに、同型そのもの（自己同型群 $\Sigma_{n}$, $GL_{n}(R)$）を空間の形で記憶し、その「高次の数え方」がホモトピー群 $K_{n}$ である。比喩で言えば、$K_{0}$ は帳簿の残高、高次の $K_{n}$ は残高を変えずに帳簿を書き換える方法（自己同型）とその書き換えの書き換え…を記録する。$E_{1}$（モノイド）から $E_{\infty}$（対称）への階層は、帳簿の項目を並べ替える自由度の階層である。
:::

## 問題 {#cat:sec-ilp-problems}

::: problem {#cat:prob-ilp-k0-matrix}
体 $k$ と $n\ge1$ について、行列環 $M_{n}(k)$ の $K_{0}$ を求めよ（有限生成射影 $M_{n}(k)$ 加群は $k^{n}$（列ベクトル）の有限直和と同型であることを認めてよい）。
:::

::: solution
有限生成射影加群は $(k^{n})^{\oplus m}$ と同型で、$m$ は同型類を決める（$k$ 上の次元が $nm$）。よって同型類のモノイドは $(\mathbb{N},+)$ で、$K_{0}(M_{n}(k))\cong\mathbb{Z}$、生成元は $[k^{n}]$。自由加群 $M_{n}(k)\cong(k^{n})^{\oplus n}$ は $n$ に対応するので、$[M_{n}(k)]=n[k^{n}]$。これは森田同値 $M_{n}(k)\text{-}\mathbf{Mod}\simeq k\text{-}\mathbf{Mod}$ が $K_{0}$ を保つ（$K_{0}(k)=\mathbb{Z}$）ことと整合する。
:::
