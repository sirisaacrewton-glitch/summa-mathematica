# ジローの定理（1）：ジローの公理 {#cat:page-giraud-axioms keywords="Giraud axioms, disjoint and universal coproducts, regular epimorphism, effective equivalence relation, generating set, kernel pair, strict initial object, image factorization, Grothendieck toposes satisfy Giraud's axioms"}

グロタンディーク・トポス（\ref{cat:grothendieck-topos}）は、サイトの選び方によらない次の性質をもつ：余積が交わらず引き戻しで安定、エピ射は余等化子で引き戻しで安定、同値関係は有効、小さい生成系がある。これらを**ジローの公理**という。本ページでは、公理を述べ、その一般的な帰結（核対・像の分解・強い始対象）を示し、サイト上の層の圏が公理をみたすことを証明する。逆にジローの公理をみたす圏はサイト上の層の圏と同値である（**ジローの定理**、\ref{cat:page-giraud-theorem}）。

> 公理の述べ方は文献によって少しずつ異なる。ここでは証明に使いやすい形を選んだ。

## 記法と定義の確認 {#cat:sec-ga-notation}

::: notation
- 極限・余極限・引き戻し・余等化子・モノ射・エピ射は \ref{cat:page-limits} の記法。関手圏の極限（双対により余極限も）は各点ごと（\ref{cat:pointwise-limits}）。$\mathbf{Set}$ の極限・余極限の構成は \ref{cat:set-complete}。
- 射 $f:X\to Y$ の**核対**とは引き戻し $X\times_{Y}X$ と二つの射影 $p_{1},p_{2}$ をいう。
- サイト上の層化 $\mathbf{a}$（左完全な左随伴）と、$\mathbf{Sh}(\mathbf{C},J)$ がトポスであることは \ref{cat:site-sheafification}, \ref{cat:site-topos}。トポスは平衡（モノかつエピなら同型。\ref{cat:topos-balanced}）。
- **選択公理**：使わない。
:::

## ジローの公理 {#cat:sec-ga-axioms}

::: definition 同値関係・生成系 {#cat:internal-equivalence-relation keywords="equivalence relation in a category, effective equivalence relation, generating set" index="同値関係（圏の中の）|どうちかんけいけんのなかの, 有効な同値関係|ゆうこうなどうちかんけい, 生成系（圏の）|せいせいけいけんの"}
有限の極限をもつ圏 $\mathbf{E}$ を考える。
1. 対象 $A$ 上の**同値関係**とは、モノ射 $(r_{1},r_{2}):R\to A\times A$ で、各対象 $T$ について、$\mathbf{E}(T,R)$ の像として得られる $\mathbf{E}(T,A)$ 上の関係（$u\sim v\iff$ ある $w:T\to R$ で $r_{1}w=u$, $r_{2}w=v$）が同値関係になるものをいう。核対は同値関係である（$T$ からの射については $fu=fv$ という関係）。
2. 同値関係 $R$ が**有効**であるとは、$(r_{1},r_{2})$ の余等化子 $q:A\to Q$ が存在して、$R$ がその核対になることをいう。
3. 小さい対象の集合 $\mathcal{G}$ が**生成系**であるとは、射 $f\neq g:X\to Y$ に対し、ある $c\in\mathcal{G}$ と $x:c\to X$ で $fx\neq gx$ となるものがあることをいう。
:::

::: definition ジローの公理 {#cat:giraud-axioms keywords="Giraud's axioms for a Grothendieck topos" index="ジローの公理|じろーのこうり"}
局所的に小さい圏 $\mathbf{E}$ が次をみたすとき、**ジローの公理をみたす**という。
- (G1) 有限の極限と小さい余積をもつ。
- (G2) 余積は**交わらない**：$i\neq j$ について $X_{i}\times_{\coprod X}X_{j}$ は始対象で、入射 $X_{i}\to\coprod X$ はモノ射。余積は**引き戻しで安定**：$Y\to\coprod_{i}X_{i}$ について、$Y\times_{\coprod X}X_{i}\to Y$ たちが $Y$ を余積として表す。
- (G3) エピ射はすべてある射の組の余等化子で、エピ射の引き戻しはエピ射。
- (G4) 同値関係はすべて有効。
- (G5) 小さい生成系をもつ。
:::

## 一般的な帰結 {#cat:sec-ga-consequences}

::: lemma 余等化子と核対 {#cat:regular-epi-kernel-pair keywords="a regular epimorphism is the coequalizer of its kernel pair; regular epis are orthogonal to monos" index="正則エピ射|せいそくえぴしゃ"}
$\mathbf{E}$ は引き戻しをもつとする。
1. $e:X\to Y$ がある組 $u,v:Z\to X$ の余等化子なら、$e$ はその核対の余等化子。
2. （直交性）$e$ が 1 の形で、$m:A\to B$ がモノ射、$m\circ g=h\circ e$（$g:X\to A$, $h:Y\to B$）なら、$g=k\circ e$, $m\circ k=h$ となる $k:Y\to A$ がただ一つある。
3. 1 の形のエピ射とモノ射への分解 $f=me=m'e'$ は、同型を除いて一意。
:::

::: proof
**Step 1（1）.** $eu=ev$ から $(u,v)$ は核対 $(p_{1},p_{2})$ を経由する：$u=p_{1}w$, $v=p_{2}w$。$g:X\to W$ が $gp_{1}=gp_{2}$ をみたせば $gu=gv$ なので、$g$ は $e$ を一意に経由する。$e$ は核対を余等化するので、$e$ は核対の余等化子。

**Step 2（2）.** 1 から $e$ は核対 $p_{1},p_{2}$ の余等化子。$mgp_{1}=hep_{1}=hep_{2}=mgp_{2}$ で $m$ はモノなので $gp_{1}=gp_{2}$。よって $g=ke$ となる $k$ が一意にあり、$mke=he$ と $e$ のエピ性（余等化子はエピ）から $mk=h$。

**Step 3（3）.** $e:X\to Y$, $e':X\to Y'$ とする。等式 $m'\circ e'=m\circ e$ に 2 を（$g=e'$, $h=m$ として）使うと、$k:Y\to Y'$ で $ke=e'$, $m'k=m$ となるものがある。役割を入れ替えて $k':Y'\to Y$, $k'e'=e$, $mk'=m'$ を得る。$k'k e=e$ と $e$ のエピ性から $k'k=1$、同様に $kk'=1$。
:::

::: lemma ジロー圏の基本性質 {#cat:giraud-basic keywords="strict initial object, coproducts of epis, cover by generators, image factorization, effective epimorphisms are stable" index="強い始対象|つよいしたいしょう, 像の分解（ジロー圏）|ぞうのぶんかいじろーけん"}
$\mathbf{E}$ がジローの公理をみたすとする。
1. （強い始対象）始対象 $0$ への射 $Y\to0$ は同型。
2. エピ射の余積 $\coprod e_{i}:\coprod X_{i}\to\coprod Y_{i}$ はエピ。エピ射の合成はエピで、$pq$ がエピなら $p$ はエピ。
3. 各対象 $X$ について、$e_{X}:\coprod_{(c,x)}c\to X$（$c\in\mathcal{G}$, $x:c\to X$ の全体についての余積）はエピ。
4. （像）任意の射 $h:Y\to Z$ は $h=me$（$e$ は核対の余等化子、$m$ はモノ）と分解する。
5. 引き戻しは核対を核対に写す：$h:Y\to Z$ と $Z'\to Z$ について、$h':Y\times_{Z}Z'\to Z'$ の核対は $h$ の核対の引き戻し。
:::

::: proof
**Step 1（1）.** $0$ は空の族の余積。$f:Y\to0$ に沿って (G2) の安定性を空の族に使うと、$Y$ は空の族の余積、すなわち始対象。$0$ も始対象なので $f$ は同型（始対象から $Y$ への射 $g$ について $gf:Y\to Y$ は始対象からの射として $1_{Y}$）。

**Step 2（2）.** $u,v:\coprod Y_{i}\to W$ が $u\circ\coprod e_{i}=v\circ\coprod e_{i}$ なら、各入射と合成して $u\iota_{i}e_{i}=v\iota_{i}e_{i}$、$e_{i}$ のエピ性から $u\iota_{i}=v\iota_{i}$、余積の普遍性から $u=v$。合成と $pq$ の主張はエピ射の定義から。

**Step 3（3）.** $u e_{X}=ve_{X}$ なら、すべての $x:c\to X$ で $ux=vx$。生成系の定義から $u=v$。

**Step 4（4）.** $h$ の核対 $K$ は同値関係なので、(G4) からその余等化子 $e:Y\to W$ があり、核対は $K$。$h$ は $K$ の二つの射影を余等化するので、$h=me$ となる $m:W\to Z$ がある。$m$ がモノであることを示す。$m$ の核対 $W\times_{Z}W$ と射 $e\times_{Z}e:Y\times_{Z}Y\to W\times_{Z}W$ を考える。これは $Y\times_{Z}Y\to W\times_{Z}Y$（$e$ の、$W\times_{Z}Y\to W$ に沿った引き戻し）と $W\times_{Z}Y\to W\times_{Z}W$（$e$ の引き戻し）の合成なので、(G3) と 2 からエピ。$m$ の核対の射影 $\pi_{1},\pi_{2}$ について $\pi_{k}\circ(e\times_{Z}e)=e\circ p_{k}$（$p_{k}$ は $Y\times_{Z}Y=K$ の射影）で、$ep_{1}=ep_{2}$ なので $\pi_{1}(e\times e)=\pi_{2}(e\times e)$、エピ性から $\pi_{1}=\pi_{2}$。核対の二つの射影が等しいことは $m$ がモノであることと同値（$mx=my$ なら $(x,y)$ は核対を経由し、$x=\pi_{1}w=\pi_{2}w=y$）。

**Step 5（5）.** $(Y\times_{Z}Z')\times_{Z'}(Y\times_{Z}Z')\cong(Y\times_{Z}Y)\times_{Z}Z'$（極限の交換。どちらも $Y$, $Y$, $Z'$ への射で $Z$ 上一致するものを表す）。
:::

## 例と反例 {#cat:sec-ga-examples}

::: proposition 前層の圏とジローの公理 {#cat:presheaf-giraud keywords="Set and presheaf categories satisfy Giraud's axioms; epis of presheaves are pointwise surjective" index="前層の圏とジローの公理|ぜんそうのけんとじろーのこうり"}
小さい圏 $\mathbf{C}$ について $\widehat{\mathbf{C}}$（とくに $\mathbf{Set}$）はジローの公理をみたす。$\widehat{\mathbf{C}}$ のエピ射は成分ごとに全射な射で、同値関係は成分ごとに同値関係な部分前層 $R\subset A\times A$。表現可能前層 $\mathbf{y}c$ の全体は生成系。
:::

::: proof
**Step 1（$\mathbf{Set}$）.** 交わらない余積（直和の二つの成分の共通部分は空、入射は単射）と安定性（$Y\to\bigsqcup X_{i}$ について $Y=\bigsqcup f^{-1}(X_{i})$）。エピ射は全射で、全射 $e$ は核対（$e(x)=e(x')$ の組）の余等化子（商集合）。全射の引き戻しは全射。同値関係 $R\subset A\times A$（$T=\{*\}$ をとれば通常の同値関係）は商写像 $A\to A/R$ の核対。生成系は $\{\{*\}\}$。

**Step 2（エピ射は成分ごと）.** $\varphi:P\to Q$ について、余積の押し出し $Q\sqcup_{P}Q$ の二つの入射が等しいことと $\varphi$ がエピであることは同値（一般の圏で、押し出しの普遍性による）。押し出しは各点ごとで、$\mathbf{Set}$ では入射が等しいこと $\iff$ 全射。

**Step 3（公理）.** 極限・余極限は各点ごとなので、(G1)(G2) と (G3) の引き戻しの部分は Step 1 から成分ごとに従う。全射な $\varphi$ は核対（各点ごと）の余等化子（各点ごと）なので (G3)。同値関係 $R$ は、$T=\mathbf{y}c$ をとると（米田の補題 \tref{cat:yoneda-lemma}）$R(c)\subset A(c)\times A(c)$ が同値関係であることを意味し、各点ごとの商 $A/R$ が余等化子で、核対は $R$（Step 1）。生成系：$\varphi\neq\psi:P\to Q$ なら、ある $x\in P(c)$ で $\varphi(x)\neq\psi(x)$、$x$ に対応する $\hat x:\mathbf{y}c\to P$ が区別する。
:::

::: theorem 層の圏はジローの公理をみたす {#cat:sheaves-giraud keywords="the category of sheaves on a small site satisfies Giraud's axioms; epimorphisms of sheaves are locally surjective" index="層の圏とジローの公理|そうのけんとじろーのこうり, 局所全射|きょくしょぜんしゃ"}
小さいサイト $(\mathbf{C},J)$ について、$\mathbf{Sh}(\mathbf{C},J)$ はジローの公理をみたす。$\{\mathbf{a}(\mathbf{y}c)\}_{c}$ が生成系で、射 $\varphi:A\to B$ がエピであることは**局所全射**（各 $b\in B(c)$ について $\{f : b\cdot f\in\operatorname{im}\varphi\}\in J(c)$）であることと同値。
:::

::: proof
以下、層 $A$ について $\mathbf{a}A\cong A$（\ref{cat:plus-separated.4} を 2 回）、層の極限は前層の極限、層の余極限は前層の余極限の層化（\ref{cat:site-sheafification.3}）を使う。

**Step 1（G1）.** \ref{cat:site-sheafification.3} と \ref{cat:site-sheaves-limits-exponentials.1}。

**Step 2（余極限の安定性：一般形）.** 層の図式 $D$、前層での余極限 $L$、層での余極限 $\mathbf{a}L$ と、層の射 $f:Y\to\mathbf{a}L$ を考える。前層の引き戻し $P\defeq Y\times_{\mathbf{a}L}L$（$L\to\mathbf{a}L$ は単位）をとる。$\mathbf{a}$ は引き戻しを保ち $\mathbf{a}(L\to\mathbf{a}L)$ は同型なので $\mathbf{a}P\cong Y$。$\widehat{\mathbf{C}}$ では余極限は引き戻しで安定（各点ごとに $\mathbf{Set}$ の場合に帰着：$Y'\to\operatorname{colim}$ について $Y'=\operatorname{colim}(Y'\times_{\operatorname{colim}}D_{j})$）なので $P\cong\operatorname{colim}_{j}(P\times_{L}D_{j})=\operatorname{colim}_{j}(Y\times_{\mathbf{a}L}D_{j})$。$\mathbf{a}$ を施すと $Y\cong\mathbf{a}\operatorname{colim}_{j}(Y\times_{\mathbf{a}L}D_{j})$。$Y\times_{\mathbf{a}L}D_{j}$ は層の引き戻しなので、右辺は層での余極限。すなわち、層の余極限は引き戻しで安定。

**Step 3（G2）.** 安定性は Step 2。交わらないこと：層 $A,B$ について、$A\times_{\mathbf{a}(A\sqcup B)}B=\mathbf{a}(A\times_{A\sqcup B}B)=\mathbf{a}(0)$（前層では交わらない、$\mathbf{a}$ は引き戻しを保つ）で、$\mathbf{a}(0)$ は（左随伴なので）始対象。入射のモノ性も $\mathbf{a}$ がモノ射（核対が対角であること）を保つことから。無限個の余積も同様。

**Step 4（エピ射の特徴づけ）.** $\varphi:A\to B$ の前層としての像 $I\subset B$ をとる。$\varphi$ は $A\to\mathbf{a}I\to\mathbf{a}B=B$ と分解し、$\mathbf{a}I\to B$ はモノ（$\mathbf{a}$ はモノを保つ）。$A\to I$ は成分ごとに全射なので前層のエピ、左随伴 $\mathbf{a}$ はエピを保つので $A\to\mathbf{a}I$ はエピ。よって $\varphi$ がエピ $\iff$ $\mathbf{a}I\to B$ がエピ $\iff$ $\mathbf{a}I\to B$ が同型（トポスは平衡）。局所全射 $\iff$ $I\subset B$ が $J$ 稠密（\ref{cat:dense-mono-extension}）で、このとき$\mathbf{Sh}(B,Q)\cong\widehat{\mathbf{C}}(I,Q)\cong\mathbf{Sh}(\mathbf{a}I,Q)$（すべての層 $Q$。前半は稠密なモノに沿った延長の一意性）なので、$\mathbf{a}I\to B$ は同型（$\mathbf{a}I\to B$ との合成がすべての層 $Q$ について全単射 $\mathbf{Sh}(B,Q)\to\mathbf{Sh}(\mathbf{a}I,Q)$ を与えるので、米田の補題による）。逆に $\mathbf{a}I\to B$ が同型なら、$b\in B(c)$ は $\mathbf{a}I=I^{++}$ の元で、$I$ は分離的（$B$ の部分前層）なので $I^{+}$ は層（\ref{cat:plus-separated.3}）、$b$ はある被覆ふるい上の $I$ の族の類で、その上で $b\cdot f\in I$。

**Step 5（G3）.** エピ $\varphi$ について、その核対 $K$（層）の、層の圏での余等化子は、前層の余等化子 $A/K\cong I$（各点ごと、Step 1 の $\mathbf{Set}$ の場合）の層化 $\mathbf{a}I\cong B$。よって $\varphi$ は核対の余等化子。引き戻し：$g:B'\to B$ に沿った $\varphi'$ について、前層の像は $I\times_{B}B'$（各点ごと）で、$\mathbf{a}(I\times_{B}B')=\mathbf{a}I\times_{B}B'=B'$。Step 4 から $\varphi'$ はエピ。

**Step 6（G4）.** 層 $A$ 上の同値関係 $R$ は、$T=\mathbf{a}(\mathbf{y}c)$ をとると $\mathbf{Sh}(\mathbf{a}\mathbf{y}c,R)\cong R(c)$ なので、成分ごとの同値関係。前層の商 $Q=A/R$ について、層での余等化子は $A\to\mathbf{a}Q$ で、その核対は $\mathbf{a}(A\times_{Q}A)=\mathbf{a}R=R$（\ref{cat:presheaf-giraud}）。

**Step 7（G5）.** $\varphi\neq\psi:A\to B$ なら、ある $x\in A(c)$ で $\varphi(x)\neq\psi(x)$。$\hat x:\mathbf{y}c\to A$ は随伴により $\mathbf{a}(\mathbf{y}c)\to A$ を経由し、これが $\varphi,\psi$ を区別する。$\mathbf{Sh}$ の hom は $\widehat{\mathbf{C}}$ の hom なので集合。
:::

::: example ジローの公理をみたさない圏
1. **アーベル群の圏**：余積 $\mathbb{Z}\oplus\mathbb{Z}$ は交わらない（$\mathbb{Z}\times_{\mathbb{Z}\oplus\mathbb{Z}}\mathbb{Z}=0$ は始対象）が、引き戻しで安定でない：対角 $\mathbb{Z}\to\mathbb{Z}\oplus\mathbb{Z}$ に沿って各成分を引き戻すと $0$ と $0$ で、その余積 $0$ は $\mathbb{Z}$ でない。強い始対象でもない（$\mathbb{Z}\to0$ は同型でない）。
2. **位相空間の圏**：商写像（エピ射の余等化子）は引き戻しで安定でないことが知られている（本サイト未収録）。
:::

::: hypcheck
- **選択公理**：使わない。生成系の定義、像の分解（\ref{cat:giraud-basic.4}）はすべて普遍性で決まる対象を使う。
- (G2) の安定性は \ref{cat:giraud-basic.1} で、(G3) の引き戻しの部分は 4 のモノ性で、(G4) は 4 の余等化子の存在で、(G5) は 3 で使った。
- サイトが小さいことは、$\mathbf{Sh}(\mathbf{C},J)$ が局所的に小さく、生成系が集合であることに使った。
:::

## 高い視点 {#cat:sec-ga-viewpoint}

::: remark 「集合のようにふるまう圏」
ジローの公理は、$\mathbf{Set}$ の「和は交わらない」「商は核対で決まる」「全射は引き戻しで保たれる」という性質を圏の言葉に移したものである。直観的には、グロタンディーク・トポスは「集合論が成り立つ宇宙」で、ただしその宇宙の「点」（生成系）は一つではなく、小さな集合ほど用意されている。アーベル群の圏が失敗するのは「和と積が一致してしまう」からで、加法的な世界では交わらない和が安定にならない。トポスは非加法的（デカルト的）な世界の公理化である。
:::

## 問題 {#cat:sec-ga-problems}

::: problem {#cat:prob-ga-strict-initial-poset}
半順序集合を圏と見たとき（$x\le y$ のとき射がただ一つ）、ジローの公理をみたすのは 1 点集合に限ることを示せ。
:::

::: solution
半順序集合 $L$ がジローの公理をみたすとする。(G1) から空の余積（最小元 $0$）があるので $L\neq\emptyset$。$x\in L$ について、二つの添字の族 $(x,x)$ の余積は $x\vee x=x$ で、入射はどちらも $1_{x}$。(G2) から $x\times_{x}x=x\wedge x=x$ が始対象、すなわち $x=0$。よって $L=\{0\}$。逆に 1 点集合は $\mathbf{Set}$ の終対象だけからなる圏で、空のサイト（対象のない圏）上の層の圏、あるいは最大の位相（\ref{cat:site-examples.3}）の層の圏と同値なので、ジローの公理をみたす（\ref{cat:sheaves-giraud}）。たとえば $\{0<1\}$ では $1\vee1=1$ の二つの成分の共通部分 $1$ が始対象 $0$ でなく、(G2) が成り立たない。
:::
