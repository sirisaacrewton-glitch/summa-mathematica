# 線形順序（Linear Orders）

線形順序（全順序）を、順序型の算術とモデル理論の両面から調べる。順序型の和・積と ω・η・ζ・λ、可算線形順序は ℚ に埋め込めることと実数直線の特徴付け、散在的順序とハウスドルフの定理、線形順序のエーレンフォイヒト＝フラッセ・ゲームと順序和の合成定理、整列順序の理論と線形順序の理論の決定可能性。資料なしの標準的な内容（Rosenstein『Linear Orderings』の範囲とされるもの）で、文献の細部は本文で未確認と明記する。

<p class="mn-msc">MSC2020: 06A05, 03C10, 03B25, 03C64</p>
