# M[G] における ZFC {#set:page-zfc-in-mg keywords="generic extension satisfies ZFC, comprehension in M[G], replacement in M[G], power set in M[G], choice in M[G], Con(ZFC) implies Con(ZFC + V not equal L)"}

前ページの強制定理を使って、ジェネリック拡大 $M[G]$ が $\ZFC$ のモデルであることを示す。分出公理には強制関係の定義可能性、置換公理と冪集合公理には「十分に多くの名前を $M$ の集合に集められること」、選択公理には $M$ の中の名前の枚挙を使う。系として $\mathrm{Con}(\ZFC)\to\mathrm{Con}(\ZFC+\mathbf{V}\neq \mathbf{L})$ が得られる。（Kunen 第 VII 章 §4 に対応する。）

## 記法と定義の確認 {#set:sec-zfc-mg-notation}

::: notation
- $M$ は $\ZFC$ の c.t.m.、$\langle\PP,\le,\mathbf{1}\rangle\in M$ は p.o.、$G$ は $M$ 上 $\PP$-ジェネリック。名前、$M^{\PP}$、$\tau_{G}$、$M[G]$、$\check{x}$、$\mathrm{op}$ と \ref{set:check-name-val}, \ref{set:m-g-transitive}, \ref{set:up-op-names-val}, \ref{set:m-g-easy-axioms}, \ref{set:generic-not-in-m} は \ref{set:page-generic-extensions}、強制関係 $\Vdash$、$\Vdash^{*}$、\ref{set:forcing-theorem}とその系（\ref{set:forcing-basic}, \ref{set:forcing-corollary}）は \ref{set:page-forcing-relation} のとおり。
- クラスのモデルの判定法（\ref{set:comprehension-in-class}, \ref{set:replacement-in-class}, \ref{set:power-set-in-transitive}, \ref{set:infinity-in-transitive}）と証明の相対化（\ref{set:relativized-proof}）、$\mathbf{L}$ の最小性（\ref{set:l-in-set-model}）を使う。
- 選択公理は「すべての集合は整列可能」（\tref{set:ax-choice}）の形とする。
:::

## 選択公理の言い換え {#set:sec-ac-reformulation}

選択公理は通常と少し違う形で確かめるのが便利である。

::: lemma 選択公理と順序数による枚挙 {#set:ac-enumeration keywords="AC iff every set is covered by the range of a function on an ordinal"}
（$\ZF$）AC は次と同値である：
$$
\forall x\;\exists\alpha\in\mathbf{ON}\;\exists f\;\bigl(f\text{ は関数}\land\dom(f)=\alpha\land x\subseteq\ran(f)\bigr).
\label{set:eq-ac-enumeration}
$$
:::

::: proof
（$\Rightarrow$）AC より $x$ に整列順序がある。その順序型を $\alpha$ とし、同型 $f\colon\alpha\to x$ をとると（\ref{set:ordinal-type}）、$f$ は定義域 $\alpha$ の関数で $x=\ran(f)$ である。（$\Leftarrow$）$x,\alpha,f$ が \eqref{set:eq-ac-enumeration} のとおりとする。$z\in x$ に $g(z)\defeq\min f^{-1}[\{z\}]$ を対応させる（$z\in\ran(f)$ なので $f^{-1}[\{z\}]$ は空でない順序数の集合で、最小元をもつ）。$f(g(z))=z$ なので $g$ は $x$ から $\alpha$ への単射である。$y\,R\,z:\iff g(y)<g(z)$ と定めると、$g$ は $\langle x,R\rangle$ から $\langle\alpha,<\rangle$ の部分集合への順序同型なので、$R$ は $x$ を整列する（$x$ の空でない部分集合 $Y$ の $R$ に関する最小元は、$g[Y]$ の最小元の $g$ による逆像である）。$x$ は任意なので、すべての集合が整列可能、すなわち AC が成り立つ。
:::

## M[G] は ZFC のモデル {#set:sec-mg-model-zfc}

::: theorem M[G] は ZFC のモデル {#set:mg-model-zfc keywords="M[G] satisfies ZFC" index="ジェネリック拡大の ZFC|じぇねりっくかくだいのぜっとえふしー"}
$M$ を $\ZFC$ の c.t.m.、$\langle\PP,\le,\mathbf{1}\rangle\in M$ を p.o.、$G$ を $M$ 上 $\PP$-ジェネリックとする。このとき $M[G]$ は $\ZFC$ を満たす。
:::

::: intuition
基礎のモデルの中のどんな半順序で強制しても、できあがる拡大はまた集合論のすべての公理を満たす。必要な集合は、基礎のモデルの中で名前を集めて作れるからである。
:::

::: proof
外延性・基礎・対・和集合はすでに確かめた（\ref{set:m-g-easy-axioms}）。$M[G]$ は推移的（\ref{set:m-g-transitive}）である。

**Step 1（分出）.** 【主張：論理式 $\varphi$ と $\sigma,\tau_{1},\dots,\tau_{n}\in M^{\PP}$ について $\{a\in\sigma_{G}:\varphi^{M[G]}(a,\sigma_{G},\tau_{1G},\dots,\tau_{nG})\}\in M[G]$】 \ref{set:comprehension-in-class} より、これを示せば $M[G]$ で分出公理が成り立つ。以下 $\tau_{1},\dots,\tau_{n}$ の記載を省き、
$$
\rho\defeq\{\langle\pi,p\rangle\in\dom(\sigma)\times\PP:p\Vdash(\pi\in\sigma\land\varphi(\pi,\sigma))\}
$$
とおく。強制関係の定義可能性（\ref{set:forcing-theorem.1}）より、$\rho$ は $M$ の中で $\Vdash^{*}$ を使って分出公理で定義できるので、$\rho\in M$ である。$\rho$ の元は（名前, 条件）の組なので $\rho\in M^{\PP}$ である。$\rho_{G}=\{a\in\sigma_{G}:\varphi^{M[G]}(a,\sigma_{G})\}$ を示す。

- （$\subseteq$）$\rho_{G}$ の元は、$p\in G$ となる $\langle\pi,p\rangle\in\rho$ についての $\pi_{G}$ の形である。$\rho$ の定義より $p\Vdash(\pi\in\sigma\land\varphi(\pi,\sigma))$ なので、$\Vdash$ の定義より $\pi_{G}\in\sigma_{G}$ かつ $\varphi^{M[G]}(\pi_{G},\sigma_{G})$ である。
- （$\supseteq$）$a\in\sigma_{G}$ かつ $\varphi^{M[G]}(a,\sigma_{G})$ とする。$\sigma_{G}$ の定義より、ある $\pi\in\dom(\sigma)$ について $a=\pi_{G}$ である。すると $(\pi_{G}\in\sigma_{G}\land\varphi(\pi_{G},\sigma_{G}))^{M[G]}$ なので、真理補題（\ref{set:forcing-theorem.2}）より $p\Vdash(\pi\in\sigma\land\varphi(\pi,\sigma))$ となる $p\in G$ がある。$\langle\pi,p\rangle\in\rho$ かつ $p\in G$ なので $\pi_{G}\in\rho_{G}$ である。

**Step 2（置換のための名前を集める）.** 論理式 $\varphi(x,y,v,z_{1},\dots,z_{n})$ と $\sigma,\vec{\tau}\in M^{\PP}$ を固定し、$\vec{\tau}$ の記載を省く。【主張：$S\in M$、$S\subseteq M^{\PP}$ で、$\forall\pi\in\dom(\sigma)\,\forall p\in\PP\,[\exists\mu\in M^{\PP}(p\Vdash\varphi(\pi,\mu))\to\exists\mu\in S\,(p\Vdash\varphi(\pi,\mu))]$ を満たすものがある】 \ref{set:forcing-theorem.1} より、$p\Vdash\varphi(\pi,\mu)$ は $M$ に相対化した論理式 $(p\Vdash^{*}\varphi(\pi,\mu))^{M}$ で表される。そこで $M$ の中で、各 $\langle\pi,p\rangle\in\dom(\sigma)\times\PP$ に、$p\Vdash^{*}\varphi(\pi,\mu)$ となる $\PP$-名前 $\mu$ があればそのような $\mu$ のランクの最小値を、なければ $0$ を対応させる。$M$ の置換公理より、これらの順序数の\term[上限]{set:sup-min-def} $\alpha$ が $M$ に存在する。$S\defeq\{\mu\in M^{\PP}:\rank(\mu)\le\alpha\}$ と定める。これは $M$ の中で $(\mathbf{V}^{\PP}\cap R(\alpha+1))^{M}$ として作れ、ランクの絶対性より上の集合に等しいので、$S\in M$ である。$p\Vdash\varphi(\pi,\mu)$ となる $\mu\in M^{\PP}$ があれば、ランクが最小のものは $\rank(\mu)\le\alpha$ を満たして $S$ に属するので、$S$ は求める性質をもつ。（Kunen はここで $M$ の中の反映定理を使っているが、上のようにランクの最小値を集める方が直接的である。）

**Step 3（置換）.** 【主張：$(\forall x\in\sigma_{G}\,\exists!y\,\varphi(x,y,\sigma_{G}))^{M[G]}$ ならば、$\rho\defeq S\times\{\mathbf{1}\}\in M^{\PP}$ について $\forall x\in\sigma_{G}\,\exists y\in\rho_{G}\,\varphi^{M[G]}(x,y,\sigma_{G})$】 \ref{set:replacement-in-class} より、これを示せば $M[G]$ で置換公理が成り立つ（そのとき一意性より $\{y\in M[G]:\exists x\in\sigma_{G}\,\varphi^{M[G]}(x,y,\sigma_{G})\}\subseteq\rho_{G}$ となる）。$\rho_{G}=\{\mu_{G}:\mu\in S\}$ である。$x\in\sigma_{G}$ を固定すると、ある $\pi\in\dom(\sigma)$ について $x=\pi_{G}$ である。仮定より $(\exists y\,\varphi(\pi_{G},y))^{M[G]}$ なので、ある $\nu\in M^{\PP}$ について $\varphi^{M[G]}(\pi_{G},\nu_{G})$ が成り立つ。真理補題より $p\Vdash\varphi(\pi,\nu)$ となる $p\in G$ がある。Step 2 の $S$ の性質より $p\Vdash\varphi(\pi,\mu)$ となる $\mu\in S$ があり、$p\in G$ なので $\varphi^{M[G]}(\pi_{G},\mu_{G})$ かつ $\mu_{G}\in\rho_{G}$ である。$x$ は任意なので、次が成り立つ：
$$
\forall x\in\sigma_{G}\;\exists y\in\rho_{G}\;\varphi^{M[G]}(x,y,\sigma_{G}).
\label{set:eq-replacement-collection}
$$

上の証明は、仮定の $\exists!y$ を $\exists y$ に弱めた「より強い」置換公理を示したように見える。しかしこの「より強い」公理は収集公理（反映の一種）であり、$\ZF$ から導ける（Kunen 第 III 章の演習 15）。

**Step 4（無限）.** 【主張：$M[G]$ は $\ZF-\mathrm{P}$ を満たす】 Step 1・3 と \ref{set:m-g-easy-axioms} より、$M[G]$ は $\ZF-\mathrm{P}$ の無限公理以外を満たす。$\omega=\check{\omega}_{G}\in M[G]$（\ref{set:check-name-val}）なので、\ref{set:infinity-in-transitive} より無限公理も成り立つ。

**Step 5（冪集合）.** \ref{set:power-set-in-transitive} より、$\sigma_{G}\in M[G]$ について、$\forall x\in M[G]\,(x\subseteq\sigma_{G}\to x\in\rho_{G})$ となる $\rho\in M^{\PP}$ を作ればよい。
$$
S\defeq\{\tau\in M^{\PP}:\dom(\tau)\subseteq\dom(\sigma)\}=\mathcal{P}(\dom(\sigma)\times\PP)^{M}
$$
とおく（$\dom(\tau)\subseteq\dom(\sigma)$ となる名前は $\dom(\sigma)\times\PP$ の部分集合で、逆にそのような部分集合は名前である。$M$ の冪集合公理と \ref{set:power-rank-relativized} より $S\in M$ である）。$\rho\defeq S\times\{\mathbf{1}\}$ とする。【主張：$\mu\in M^{\PP}$ が $\mu_{G}\subseteq\sigma_{G}$ を満たせば $\mu_{G}\in\rho_{G}$】 $\mu$ を固定し、
$$
\tau\defeq\{\langle\pi,p\rangle:\pi\in\dom(\sigma)\land p\Vdash\pi\in\mu\}
$$
とおく。定義可能性より $\tau\in M$ であり、$\dom(\tau)\subseteq\dom(\sigma)$ なので $\tau\in S$、したがって $\tau_{G}\in\rho_{G}$ である。あとは $\mu_{G}=\tau_{G}$ を示せばよい。
- （$\mu_{G}\subseteq\tau_{G}$）$\mu_{G}\subseteq\sigma_{G}$ なので、$\mu_{G}$ の元はある $\pi\in\dom(\sigma)$ についての $\pi_{G}$ の形である。$\pi_{G}\in\mu_{G}$ なので、真理補題より $p\Vdash\pi\in\mu$ となる $p\in G$ があり、$\langle\pi,p\rangle\in\tau$ である。よって $\pi_{G}\in\tau_{G}$ である。
- （$\tau_{G}\subseteq\mu_{G}$）$\tau_{G}$ の元は、$p\in G$ となる $\langle\pi,p\rangle\in\tau$ についての $\pi_{G}$ の形である。$p\Vdash\pi\in\mu$ かつ $p\in G$ なので $\pi_{G}\in\mu_{G}$ である。

**Step 6（選択）.** 【主張：各 $x=\sigma_{G}\in M[G]$ について、$M[G]$ の中で \eqref{set:eq-ac-enumeration} が成り立つ】 Step 4・5 より $M[G]$ は $\ZF$ を満たすので、\ref{set:ac-enumeration}（$\ZF$ の定理）は $M[G]$ で成り立つ（\ref{set:relativized-proof}）。したがってこの主張から $M[G]$ で AC が従う。$M$ の AC より、$\gamma\mapsto\pi_{\gamma}$ という $M$ に属する関数で $\dom(\sigma)=\{\pi_{\gamma}:\gamma<\alpha\}$ となるものがある。
$$
\tau\defeq\{\mathrm{op}(\check{\gamma},\pi_{\gamma}):\gamma<\alpha\}\times\{\mathbf{1}\}
$$
とおく。$\gamma\mapsto\pi_{\gamma}$ が $M$ に属し、$\check{\ }$ と $\mathrm{op}$ は $M$ の中で定義できるので $\tau\in M^{\PP}$ であり、\ref{set:up-op-names-val} より $\tau_{G}=\{\langle\gamma,\pi_{\gamma G}\rangle:\gamma<\alpha\}$ である。これは定義域 $\alpha$ の関数で、$\sigma_{G}$ の元はある $\pi\in\dom(\sigma)$ の値なので $\sigma_{G}\subseteq\ran(\tau_{G})$ である。関数であること、定義域、値域、包含は絶対的なので、$M[G]$ の中で \eqref{set:eq-ac-enumeration} が $x$ について成り立つ。

以上で $\ZFC$ のすべての公理が $M[G]$ で成り立つ。

::: hypcheck
- **ジェネリック性**は、真理補題（Step 1 の $\supseteq$、Step 3、Step 5 の $\mu_{G}\subseteq\tau_{G}$）を通して使った。
- **強制関係の定義可能性**は、$\rho$（Step 1）、$S$（Step 2）、$\tau$（Step 5）が $M$ に属することに使った。これがなければ、名前を $M$ の中で作れない。
- $M$ の公理は、分出（Step 1 の $\rho$、Step 5 の $\tau$）、置換（Step 2 の\term[上限]{set:sup-min-def}）、冪集合（Step 5 の $S$）、選択（Step 6 の $\dom(\sigma)$ の枚挙）のそれぞれで、$M[G]$ の対応する公理を示すのに使った。
- 冪集合公理の証明の鍵は、$\sigma_{G}$ の任意の部分集合の代表となる名前を含む集合 $S$ が $M$ の中にあることである。$\mu_{G}\subseteq\sigma_{G}$（あるいは $\mu_{G}=0$）となる $\mu$ 全体は通常 $M$ の集合に含まれない（Kunen 第 VII 章の演習 A9）。
- $\PP$ についての仮定（鎖条件など）は何も使っていない。
:::
:::

強制法で追加の公理を満たすように $\PP$ を設計する方法は次ページ以降で述べる。ここでは、これまでの結果から直ちに得られる帰結を一つ述べる。

::: corollary V ≠ L を満たすジェネリック拡大 {#set:ctm-v-neq-l}
$M$ を $\ZFC$ の c.t.m. とすると、$\ZFC+\mathbf{V}\neq \mathbf{L}$ を満たす c.t.m. $N\supseteq M$ がある。
:::

::: proof
\ref{set:mg-model-zfc} の記号で、$G\notin M$ となる $\PP$ を選べばよい。これは $\PP$ が \ref{set:generic-not-in-m} の条件 \eqref{set:eq-splitting} を満たせば成り立ち、たとえば $\PP=\mathrm{Fn}(\omega,2)$ でよい（\ref{set:prob-generic-fn}）。$G$ を $M$ 上 $\PP$-ジェネリックとし（\ref{set:generic-exists} で存在する）、$N\defeq M[G]$ とおく。$M^{\PP}\subseteq M$ は可算なので $N$ は可算であり、$N$ は推移的で（\ref{set:m-g-transitive.1}）$\ZFC$ を満たす（\ref{set:mg-model-zfc}）。$M\subseteq N$ である（\ref{set:check-name-val.2}）。$o(N)=o(M)$（\ref{set:m-g-transitive.3}）なので、\ref{set:l-in-set-model} より $\mathbf{L}^{N}=L_{o(N)}=L_{o(M)}=\mathbf{L}^{M}\subseteq M$ である。$G\in N$（\ref{set:gamma-name-val}）かつ $G\notin M$ なので $G\in N\setminus\mathbf{L}^{N}$、よって $N\neq \mathbf{L}^{N}$、すなわち $(\mathbf{V}\neq \mathbf{L})^{N}$ である。
:::

::: corollary {#set:con-v-neq-l keywords="Con(ZFC) implies Con(ZFC + V not equal L)" index="V ≠ L の無矛盾性|ぶいのっといこーるえるのむむじゅんせい"}
$\mathrm{Con}(\ZFC)\to\mathrm{Con}(\ZFC+\mathbf{V}\neq \mathbf{L})$。
:::

::: proof
\ref{set:page-generic-extensions} の \ref{set:forcing-proof-structure} のとおり、\ref{set:ctm-v-neq-l} を「$\ZFC$ の十分多くの有限個の公理の c.t.m.」について適用する：$\ZFC+\mathbf{V}\neq \mathbf{L}$ の有限個の公理 $\varphi_{1},\dots,\varphi_{n}$ に対し、上の証明に必要な $\ZFC$ の有限個の公理の c.t.m. $M$ を \ref{set:ctm-exists} でとり、$\ZFC\vdash\exists N\,\bigwedge_{i}\varphi_{i}^{N}$ を得る。
:::

これからは、$\varphi$ が数学的にある程度複雑な主張であるような $p\Vdash\varphi$ をしばしば論じる。そのときいつものように、$\varphi$ を集合論のもとの言語の論理式として陽に書くことはせず、標準的な数学の記法で表し、それを集合論の論理式の略記とみなす。略記を展開した論理式の正確な形を気にする必要はない。$\ZFC$ で同値な二つの論理式は同じ条件で強制されるからである。

::: lemma 同値な論理式の強制 {#set:forcing-equivalent keywords="forcing respects ZFC-provable equivalence"}
1. $\ZFC\vdash\forall\vec{x}\,(\varphi(\vec{x})\to\psi(\vec{x}))$ とすると、$\ZFC$ の任意の c.t.m. $M$、p.o. $\PP\in M$、$p\in\PP$、$\tau_{1},\dots,\tau_{n}\in M^{\PP}$ について $p\Vdash\varphi(\vec{\tau})\to p\Vdash\psi(\vec{\tau})$。
2. さらに $\ZFC\vdash\forall\vec{x}\,(\varphi\leftrightarrow\psi)$ なら $p\Vdash\varphi(\vec{\tau})\iff p\Vdash\psi(\vec{\tau})$。
:::

::: proof
**1.** $p\Vdash\varphi(\vec{\tau})$ とし、$G$ を $p\in G$ となる $M$ 上ジェネリックな任意のフィルターとする。$M[G]$ は $\ZFC$ を満たす（\ref{set:mg-model-zfc}）ので、\ref{set:relativized-proof} より $\varphi^{M[G]}(\vec{\tau}_{G})\to\psi^{M[G]}(\vec{\tau}_{G})$ が成り立つ。$p\Vdash\varphi(\vec{\tau})$ より $\varphi^{M[G]}(\vec{\tau}_{G})$ なので、$\psi^{M[G]}(\vec{\tau}_{G})$ である。$G$ は任意なので、$\Vdash$ の定義より $p\Vdash\psi(\vec{\tau})$ である。**2.** 1 を両向きに使う。
:::

## 問題 {#set:sec-zfc-mg-problems}

::: problem {#set:prob-mg-union}
\ref{set:mg-model-zfc} を使わずに、$\sigma\in M^{\PP}$ に対し $\bigcup(\sigma_{G})$ を名前で直接表せ。（ヒント：$\{\langle\pi,r\rangle:\exists\langle\rho,p\rangle\in\sigma\,\exists q\,(\langle\pi,q\rangle\in\rho\land r\le p\land r\le q)\}$。）
:::

::: solution
与えられた集合を $\theta$ とする。$\theta$ の元は $\pi\in\dom(\rho)$（$\rho\in\dom(\sigma)$）と $r\in\PP$ の組なので、$\theta\subseteq\bigcup\{\dom(\rho):\rho\in\dom(\sigma)\}\times\PP$ であり、$\theta$ は $\sigma,\PP,\le$ から有界量化子だけの論理式で定義されるので、$M$ の分出公理と絶対性より $\theta\in M$ である。元が（名前, 条件）の組なので $\theta\in M^{\PP}$ である。

（$\theta_{G}\subseteq\bigcup\sigma_{G}$）$\theta_{G}$ の元は、$r\in G$ となる $\langle\pi,r\rangle\in\theta$ についての $\pi_{G}$ の形である。$\theta$ の定義より $\langle\rho,p\rangle\in\sigma$、$\langle\pi,q\rangle\in\rho$、$r\le p$、$r\le q$ となる $\rho,p,q$ がある。$G$ は上に閉じているので $p,q\in G$ である。$\langle\rho,p\rangle\in\sigma$ かつ $p\in G$ より $\rho_{G}\in\sigma_{G}$、$\langle\pi,q\rangle\in\rho$ かつ $q\in G$ より $\pi_{G}\in\rho_{G}$ である。よって $\pi_{G}\in\bigcup\sigma_{G}$ である。

（$\bigcup\sigma_{G}\subseteq\theta_{G}$）$x\in y\in\sigma_{G}$ とする。$y\in\sigma_{G}$ より、$\langle\rho,p\rangle\in\sigma$、$p\in G$、$\rho_{G}=y$ となるものがある。$x\in\rho_{G}$ より、$\langle\pi,q\rangle\in\rho$、$q\in G$、$\pi_{G}=x$ となるものがある。$G$ はフィルターなので、$p,q$ の共通の拡張 $r\in G$ がある。$\langle\pi,r\rangle\in\theta$ かつ $r\in G$ なので $x=\pi_{G}\in\theta_{G}$ である。
:::

::: problem {#set:prob-mg-omega}
$\omega^{M[G]}=\omega$ であり、$M[G]$ の順序数はちょうど $M$ の順序数であることを説明せよ。
:::

::: solution
$M[G]$ は $\ZFC$ の推移的なモデル（\ref{set:mg-model-zfc}）なので、$\omega$ は絶対的であり（\ref{set:absolute-ordinals}）、$\omega^{M[G]}=\omega$ である。「$x$ は順序数」も推移的なモデルについて絶対的（\ref{set:absolute-ordinals}）なので、$M[G]$ の順序数は $M[G]\cap\mathbf{ON}$ である。これは $o(M[G])$ であり、\ref{set:m-g-transitive.3} より $o(M[G])=o(M)=M\cap\mathbf{ON}$、すなわち $M$ の順序数全体に等しい。
:::

::: supplement
**前提の検討.**
- \ref{set:mg-model-zfc} は $\PP$ についての仮定（c.c.c. など）を何も使わない。$M$ の中の任意の p.o. について $M[G]$ は $\ZFC$ を満たす。追加の公理が成り立つかどうかが $\PP$ の組合せ論的性質に依存する。
- \ref{set:ctm-v-neq-l} の証明が $\PP$ について使う仮定は \eqref{set:eq-splitting} だけで、これは $G\notin M$（\ref{set:generic-not-in-m}）を得るためである。そのほかに、$\PP$ によらない事実として、拡大が高さを変えないこと（$o(M[G])=o(M)$、\ref{set:m-g-transitive.3}）と $\mathbf{L}^{N}$ の計算（\ref{set:l-in-set-model}）を使う。高さが同じなので $\mathbf{L}^{N}=\mathbf{L}^{M}\subseteq M$ となり、$M$ にない $G$ が $N$ を $\mathbf{L}^{N}$ より大きくする。

**関連する結果.** $\mathrm{Con}(\ZF)\to\mathrm{Con}(\ZF+\lnot\mathrm{AC})$ も強制法で示せる。Kunen 第 VII 章の演習 E4 は、$\mathrm{Fn}(I,2)$ によるジェネリック拡大の中で $\mathbf{L}(\mathcal{P}(\omega))$ を考えて、$\lnot\mathrm{AC}$ と $\mathbf{V}=\mathbf{L}(\mathcal{P}(\omega))$ の無矛盾性を示す道筋を与えている。本サイトでは扱っていない。

**高い視点から：体の拡大との類比.** $M[G]$ が $\ZFC$ を満たすことは、体 $K$ に元 $a$ を添加した $K(a)$ がまた体になることに似ている。体の場合、$K(a)$ の元は「$a$ を含む $K$ 係数の有理式」で表され、四則演算で閉じることは有理式の計算で確かめられる。$M[G]$ の場合、元は「$G$ を含む $M$ の名前」で表され、集合論の公理（分出・置換・冪集合）で閉じることは名前の操作で確かめられる。ただし集合論では「有理式」にあたる名前の集まりが巨大（真のクラス）なので、置換や冪集合で必要な名前を $M$ の**集合**に集められること（ランクによる有界化、$\mathcal{P}(\dom(\sigma)\times\PP)^{M}$）が鍵になる。
:::
