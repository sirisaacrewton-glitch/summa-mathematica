# 素朴な無矛盾性証明と相対化 {#set:page-relativization keywords="relativization, relative consistency, model of set theory, class model, WF is a model of ZF, R(omega), Con(ZF minus) implies Con(ZF)"}

「$\ZF$ は無矛盾である。なぜなら、変数が整礎集合を動くと読めば公理はすべて真だから」という議論は、そのままでは $\mathbf{WF}$ という対象の存在を信じることを要求し、しかもゲーデルの第二不完全性定理により $\ZF$ の中では形式化できない。しかし同じ考え方を**相対化**として定式化すると、「$\ZF^{-}$ が無矛盾なら $\ZF$ も無矛盾」のような**相対無矛盾性**の結果が得られる。本ページでは、論理式のクラスへの相対化を定義し、相対無矛盾性の基本補題を（完全性定理による証明と、ヒルベルト流の体系での構文論的な証明の二通りで）示したうえで、推移的なクラスで各公理が成り立つための簡単な十分条件を与え、$\mathbf{WF}$ と $R(\omega)$ が $\ZF-\mathrm{Inf}$ のモデルであることを示す。無限公理は定義された記号 $0$ と $S$ を含むので、その扱いは絶対性（次ページ）を待つ。（Kunen 第 IV 章 §1–2 に対応する。）

## 記法と定義の確認 {#set:sec-relativization-notation}

::: notation
- 集合論の言語（\ref{set:first-order-language}）の基本記号は $\land,\lnot,\exists,\in,=$ で、$\forall,\lor,\to$ や有界量化子は略記（\ref{set:formula-abbreviations}）。公理と部分体系の略号は \ref{set:zfc}, \ref{set:zf-subsystems} のとおり。形式的証明と $\mathrm{Con}(S)$ は \ref{set:formal-deduction}、解釈（構造）と健全性は \ref{set:interpretation}, \ref{set:model-consistency}、ゲーデルの完全性定理は \tref{logic:completeness} のとおり。
- クラスは論理式 $\mathbf{M}(v)$ で与えられる（\ref{set:class}）。$x\in\mathbf{M}$ は $\mathbf{M}(x)$ の略。推移的集合・推移的クラスは \ref{set:transitive-set} と \ref{set:page-mostowski} の記法確認のとおり。推移的なクラスの上で $\in$ は外延的である（\ref{set:transitive-extensional}）。
- 累積階層 $R(\alpha)$、整礎集合のクラス $\mathbf{WF}$、ランク、$x\in\mathbf{WF}\iff x\subseteq\mathbf{WF}$（\ref{set:wf-subset}）、$\mathbf{WF}$ と $R(\lambda)$ の閉包性（\ref{set:wf-closure}, \ref{set:r-limit-closure}）、$R(n)$ の有限性（\ref{set:r-n-finite}）は \ref{set:page-cumulative-hierarchy}, \ref{set:page-size-of-wf} のとおり。
- 本ページの議論は、とくに断らなければ $\ZF^{-}$ の中で行う。
:::

## 三つの素朴な議論 {#set:sec-informal-consistency}

次の三つの例を念頭に置く。いずれも「あるクラスの中で公理が真」という形である。

1. $\mathbf{WF}$ の中では $\ZF$ のすべての公理が真である。したがって（$\ZF^{-}$ が無矛盾なら）$\ZF$ は無矛盾。
2. $R(\omega)$（遺伝的有限集合）の中では、無限公理以外の $\ZF$ の公理と、無限公理の否定が真である。したがって $\ZF-\mathrm{Inf}\nvdash\mathrm{Inf}$：無限公理は他の公理から独立である。
3. $\{0\}$ の中では、外延性の公理・分出公理と「すべての集合は空」が真である。したがってこれら二つの公理だけからは空でない集合の存在は導けない。

これらはすべて**相対**無矛盾性の主張であり、議論は有限的である。$\ZF^{-}$ 自身の無矛盾性は、ここでは仮定として残る。

## 相対化 {#set:sec-relativization}

::: definition 相対化 {#set:relativization keywords="relativization of a formula to a class" index="相対化|そうたいか"}
クラス $\mathbf{M}$（論理式 $\mathbf{M}(v)$）と論理式 $\varphi$ に対し、$\varphi$ の $\mathbf{M}$ への**相対化** $\varphi^{\mathbf{M}}$ を $\varphi$ の構成に関する再帰で定める。
$$
\begin{aligned}
&(x=y)^{\mathbf{M}}\defeq x=y,\quad(x\in y)^{\mathbf{M}}\defeq x\in y,\quad(\varphi\land\psi)^{\mathbf{M}}\defeq\varphi^{\mathbf{M}}\land\psi^{\mathbf{M}},\\
&(\lnot\varphi)^{\mathbf{M}}\defeq\lnot\varphi^{\mathbf{M}},\quad(\exists x\,\varphi)^{\mathbf{M}}\defeq\exists x\,(\mathbf{M}(x)\land\varphi^{\mathbf{M}}).
\end{aligned}
$$
（束縛変数は $\mathbf{M}(v)$ の変数と衝突しないように取り替えておく。）$\varphi^{\mathbf{M}}$ はメタの理論で定義される、集合論の言語の論理式である。
:::

略記についても意図どおりの意味になる：$(\varphi\lor\psi)^{\mathbf{M}}$ は $\varphi^{\mathbf{M}}\lor\psi^{\mathbf{M}}$、$(\forall x\,\varphi)^{\mathbf{M}}=\lnot\exists x\,(\mathbf{M}(x)\land\lnot\varphi^{\mathbf{M}})$ は論理的に $\forall x\,(\mathbf{M}(x)\to\varphi^{\mathbf{M}})$ と同値。$\varphi^{\mathbf{M}}$ は $\varphi$ のすべての量化子を $\mathbf{M}$ に制限したものである。$\varphi(x_{1},\dots,x_{n})$ について、$x_{1},\dots,x_{n}\in\mathbf{M}$ のとき $\varphi^{\mathbf{M}}(x_{1},\dots,x_{n})$ は「束縛変数が $\mathbf{M}$ を動くと解釈したとき $x_{1},\dots,x_{n}$ について $\varphi$ が成り立つ」と読める。

::: definition クラスの中で真・モデル {#set:true-in-class keywords="true in M, model of a theory" index="クラスの中で真|くらすのなかでしん, モデル（クラス）|もでるくらす"}
$\mathbf{M}$ をクラス、$T$ を文の集まり（そのとき仮定している公理。本ページでは断らなければ $\ZF^{-}$）とし、文 $\varphi$ の $\mathbf{M}$ への相対化を $\varphi^{\mathbf{M}}$ と書く（\ref{set:relativization}）。
1. 文 $\varphi$ が（$T$ のもとで）**$\mathbf{M}$ の中で真**であるとは、$T\vdash\varphi^{\mathbf{M}}$ であることをいう。
2. 文の集まり $S$ が **$\mathbf{M}$ の中で真**である、あるいは **$\mathbf{M}$ は $S$ のモデル**であるとは、各 $\varphi\in S$ が $\mathbf{M}$ の中で真であること、すなわちすべての $\varphi\in S$ について $T\vdash\varphi^{\mathbf{M}}$ であることをいう。
:::

1 も 2 も「$T$ からある文が証明できる」というメタの主張であり、集合論の中の一つの文ではない。1 で主張しているのは一つの文 $\varphi^{\mathbf{M}}$ の証明可能性、2 は $S$ が無限なら無限個の主張の集まりである。$S$ が有限なら、2 は $S$ の元の連言の相対化 $(\bigwedge S)^{\mathbf{M}}$ が $T$ から証明できることと同じである（相対化は $\land$ と交換するので、$(\bigwedge S)^{\mathbf{M}}$ は $\bigwedge_{\varphi\in S}\varphi^{\mathbf{M}}$ に等しい）。$\varphi^{\mathbf{M}}$ を「$\mathbf{M}$ の中の $\varphi$」と読む。

::: lemma 部分構造と相対化 {#set:relativization-substructure}
構造 $\mathfrak{A}=(A,\in^{\mathfrak{A}})$ と、$\mathfrak{A}$ で $\mathbf{M}$ が定める空でない集合 $B\defeq\{a\in A:\mathfrak{A}\models\mathbf{M}[a]\}$ をとり、$\mathfrak{B}\defeq(B,\in^{\mathfrak{A}}\cap B^{2})$ とする。任意の論理式 $\varphi(x_{1},\dots,x_{n})$ と $b_{1},\dots,b_{n}\in B$ について、$\mathfrak{B}\models\varphi[\vec{b}]\iff\mathfrak{A}\models\varphi^{\mathbf{M}}[\vec{b}]$。
:::

::: proof
$\varphi$ の構成に関する帰納法。原子論理式は $\mathfrak{B}$ の関係が $\mathfrak{A}$ の制限であることから、$\land,\lnot$ は帰納法の仮定から。$\exists x\,\varphi$ の場合：$\mathfrak{B}\models\exists x\,\varphi[\vec{b}]\iff$ ある $b\in B$ で $\mathfrak{B}\models\varphi[\vec{b},b]\iff$ ある $b\in A$ で $\mathfrak{A}\models\mathbf{M}[b]$ かつ（帰納法の仮定）$\mathfrak{A}\models\varphi^{\mathbf{M}}[\vec{b},b]\iff\mathfrak{A}\models(\exists x\,\varphi)^{\mathbf{M}}[\vec{b}]$。
:::

::: lemma 相対無矛盾性の基本補題 {#set:relative-consistency-lemma keywords="relative consistency lemma" index="相対無矛盾性|そうたいむむじゅんせい" refname="相対無矛盾性の基本補題" refscope="field"}
$S,T$ を集合論の言語の文の集まりとし、クラス $\mathbf{M}$ について、$T$ から $\exists x\,\mathbf{M}(x)$ と、各 $\varphi\in S$ の $\varphi^{\mathbf{M}}$ が証明できるとする。このとき $\mathrm{Con}(T)\to\mathrm{Con}(S)$。
:::

::: proof
$T$ が無矛盾なら、\ref{logic:completeness}より $T$ のモデル $\mathfrak{A}$ がある。健全性より $\mathfrak{A}\models\exists x\,\mathbf{M}(x)$ なので $B$ は空でなく、各 $\varphi\in S$ で $\mathfrak{A}\models\varphi^{\mathbf{M}}$。\ref{set:relativization-substructure} より $\mathfrak{B}\models S$。健全性（\ref{set:model-consistency}）より $S$ は無矛盾。

::: hypcheck
- **$\mathbf{M}$ が空でないこと**：構造の議論領域は空でない約束なので必要。形式的には $\exists x\,(x=x)$ が論理的に証明できることに対応する（\ref{set:ax-set-existence}）。
- この証明は完全性定理（意味論）を使う。$S$ からの矛盾の導出を $T$ からの矛盾の導出に書き換える構文論的な証明を、ヒルベルト流の体系で \ref{set:relativization-syntactic-proof} に与える。結論は同じだが、構文論的な証明は導出に対する具体的な記号操作なので有限的であり、「$\mathrm{Con}(T)\to\mathrm{Con}(S)$」を算術の中で証明できる形にする。
:::
:::

以下、扱うクラス $\mathbf{M}$ は空でないとする（したがって公理 0（\ref{set:ax-set-existence}）は $\mathbf{M}$ の中で真）。

## 各公理が成り立つための条件 {#set:sec-axioms-in-class}

::: lemma 外延性 {#set:extensionality-in-transitive}
$\mathbf{M}$ が推移的なら、外延性の公理は $\mathbf{M}$ の中で真。
:::

::: proof
外延性の公理の相対化は $\forall x,y\in\mathbf{M}\,(\forall z\in\mathbf{M}\,(z\in x\leftrightarrow z\in y)\to x=y)$、すなわち $\in$ が $\mathbf{M}$ の上で外延的であること（\ref{set:extensional-relation}）で、\ref{set:transitive-extensional} による。
:::

::: lemma 分出 {#set:comprehension-in-class}
各論理式 $\varphi(x,z,w_{1},\dots,w_{n})$（自由変数はこれだけ）について
$$
\forall z,w_{1},\dots,w_{n}\in\mathbf{M}\;\bigl(\{x\in z:\varphi^{\mathbf{M}}(x,z,\vec{w})\}\in\mathbf{M}\bigr)
$$
が成り立てば、分出公理のすべての例は $\mathbf{M}$ の中で真である。
:::

::: proof
分出公理の $\varphi$ についての例を相対化すると $\forall z,\vec{w}\in\mathbf{M}\,\exists y\in\mathbf{M}\,\forall x\in\mathbf{M}\,(x\in y\leftrightarrow x\in z\land\varphi^{\mathbf{M}})$。$y\defeq\{x\in z:\varphi^{\mathbf{M}}\}$ とすると仮定より $y\in\mathbf{M}$ で、すべての $x$（とくに $x\in\mathbf{M}$）で $x\in y\leftrightarrow x\in z\land\varphi^{\mathbf{M}}$。
:::

$\mathbf{M}$ が推移的なら、この条件は必要でもある（$y\in\mathbf{M}$ なら $y\subseteq\mathbf{M}$ なので、$\mathbf{M}$ の中の $y$ は本当に $\{x\in z:\varphi^{\mathbf{M}}\}$ に等しい）。

::: corollary {#set:comprehension-power-closed}
すべての $z\in\mathbf{M}$ で $\mathcal{P}(z)\subseteq\mathbf{M}$ ならば、分出公理は $\mathbf{M}$ の中で真。
:::

::: theorem 空集合だけのモデル {#set:model-zero}
（$\ZF^{-}$）$\mathbf{M}=\{0\}$ では、公理 0, 外延性, 分出と、$\forall y\,(y=0)$ の略記する文 $\forall y\,\forall x\,(x\notin y)$ が真である。
:::

::: proof
$\forall y\forall x\,(x\notin y)$ の相対化は $\forall y,x\in\{0\}\,(x\notin y)$ で、$0\notin0$ より真。$\{0\}$ は推移的なので外延性（\ref{set:extensionality-in-transitive}）。$\mathcal{P}(0)=\{0\}\subseteq\{0\}$ なので分出（\ref{set:comprehension-power-closed}）。
:::

::: corollary {#set:con-zero-model}
$\mathrm{Con}(\ZF^{-})\to\mathrm{Con}(\text{外延性}+\text{分出}+\forall y\,(y=0))$。
:::

## 定義された記号の相対化 {#set:sec-relativizing-defined}

相対化は基本記号だけの論理式に対して定義した。定義された**関係**（たとえば $z\subseteq x$ は $\forall v\,(v\in z\to v\in x)$ の略）については、略記を展開してから相対化すればよい。$(z\subseteq x)^{\mathbf{M}}$ は $\forall v\in\mathbf{M}\,(v\in z\to v\in x)$、すなわち $z\cap\mathbf{M}\subseteq x$ であり、$\mathbf{M}$ が推移的で $z\in\mathbf{M}$ なら $z\subseteq x$ と同値である。

定義された**演算**や**定数**には注意が要る。$S\vdash\forall\vec{x}\,\exists!y\,\varphi(\vec{x},y)$ のとき $F(\vec{x})$ を「$\varphi(\vec{x},y)$ となる $y$」と定めるが、$F$ を含む式の展開の仕方（たとえば $\psi(F(\vec{x}))$ を $\exists y\,(\varphi\land\psi(y))$ とするか $\forall y\,(\varphi\to\psi(y))$ とするか）は、$S$ のもとでは同値でも、$S$ が成り立たないクラスでは同値とは限らない。

::: example 空集合の二通りの展開
$\varphi(y)\defeq\forall v\,(v\notin y)$ とし、$0\in z$ を $\psi(z)\defeq\exists y\,(\varphi(y)\land y\in z)$ または $\chi(z)\defeq\forall y\,(\varphi(y)\to y\in z)$ と展開する。$\mathbf{M}=\{a,b,c\}$、$a=0$, $b=\{0\}$, $c=\{\{\{0\}\}\}$ とすると、$\mathbf{M}$ の中で「空」（$\varphi^{\mathbf{M}}$）なのは $a$ と $c$（$c$ の唯一の元 $\{\{0\}\}$ は $\mathbf{M}$ にない）。よって $\psi^{\mathbf{M}}(b)$ は真（$a\in b$）、$\chi^{\mathbf{M}}(b)$ は偽（$c\notin b$）。
:::

そこで、$F$ を含む式を $\mathbf{M}$ に相対化するのは、$\forall\vec{x}\,\exists!y\,\varphi$ が $\mathbf{M}$ の中で真であることを確かめてからにする。そのとき $F^{\mathbf{M}}(\vec{x})$ を、$\varphi^{\mathbf{M}}(\vec{x},y)$ となるただ一つの $y\in\mathbf{M}$ とする。たとえば $\mathbf{M}=\{1,2\}$ なら $\exists!y\,\forall v\,(v\notin y)$ は $\mathbf{M}$ の中で真で $0^{\mathbf{M}}=1$、$1\in2$ なので $\exists x\,(0\in x)$ は $\mathbf{M}$ の中で真。$\mathbf{M}=\{0\}$ なら $0^{\mathbf{M}}=0$ で、$\exists x\,(0\in x)$ は偽。

::: lemma 冪集合 {#set:power-set-in-transitive}
$\mathbf{M}$ が推移的なら、冪集合の公理が $\mathbf{M}$ の中で真であることは $\forall x\in\mathbf{M}\,\exists y\in\mathbf{M}\,(\mathcal{P}(x)\cap\mathbf{M}\subseteq y)$ と同値である。
:::

::: proof
\ref{set:ax-power-set}の相対化は $\forall x\in\mathbf{M}\,\exists y\in\mathbf{M}\,\forall z\in\mathbf{M}\,((z\subseteq x)^{\mathbf{M}}\to z\in y)$。$\mathbf{M}$ が推移的なので $z\in\mathbf{M}$ について $(z\subseteq x)^{\mathbf{M}}\iff z\subseteq x$。よって $\forall z\in\mathbf{M}\,(z\subseteq x\to z\in y)$、すなわち $\mathcal{P}(x)\cap\mathbf{M}\subseteq y$。
:::

::: lemma 対と和 {#set:pairing-union-in-class}
$\forall x,y\in\mathbf{M}\,\exists z\in\mathbf{M}\,(x\in z\land y\in z)$ かつ $\forall x\in\mathbf{M}\,\exists z\in\mathbf{M}\,(\bigcup x\subseteq z)$ ならば、対の公理と和集合の公理は $\mathbf{M}$ の中で真。
:::

::: proof
対の公理の相対化は前半そのもの。\ref{set:ax-union}の相対化は $\forall\mathcal{F}\in\mathbf{M}\,\exists A\in\mathbf{M}\,\forall Y,x\in\mathbf{M}\,(x\in Y\land Y\in\mathcal{F}\to x\in A)$ で、$\bigcup\mathcal{F}\subseteq A$ なら成り立つ。
:::

::: lemma 置換 {#set:replacement-in-class}
$\mathbf{M}$ を推移的とする。各論理式 $\varphi(x,y,A,\vec{w})$ と $A,\vec{w}\in\mathbf{M}$ について、「$\forall x\in A\,\exists!y\in\mathbf{M}\,\varphi^{\mathbf{M}}(x,y,A,\vec{w})$ ならば、ある $Y\in\mathbf{M}$ で $\{y\in\mathbf{M}:\exists x\in A\,\varphi^{\mathbf{M}}(x,y,A,\vec{w})\}\subseteq Y$」が示せるとする。このとき置換公理のすべての例は $\mathbf{M}$ の中で真。
:::

::: proof
\ref{set:ax-replacement}の例の相対化は、$A,\vec{w}\in\mathbf{M}$ について $(\forall x\in A\,\exists!y\,\varphi)^{\mathbf{M}}\to\exists Y\in\mathbf{M}\,(\forall x\in A\,\exists y\in Y\,\varphi)^{\mathbf{M}}$。$\mathbf{M}$ は推移的なので、問題 \ref{set:prob-relativize-forall} と同様に、前件は $\forall x\in A\,\exists!y\in\mathbf{M}\,\varphi^{\mathbf{M}}$、後件の括弧の中は（$Y\in\mathbf{M}$ なら）$\forall x\in A\,\exists y\in Y\,\varphi^{\mathbf{M}}$ と同値である。仮定の $Y$ をとれば、各 $x\in A$ に対応する $y\in\mathbf{M}$ は $Y$ に属するので後件が成り立つ。
:::

::: lemma 基礎の公理 {#set:foundation-in-wf-subclass}
（$\ZF^{-}$）$\mathbf{M}\subseteq\mathbf{WF}$ ならば、基礎の公理は $\mathbf{M}$ の中で真。
:::

::: proof
相対化は $\forall x\in\mathbf{M}\,(\exists y\in\mathbf{M}\,(y\in x)\to\exists y\in\mathbf{M}\,(y\in x\land\lnot\exists z\in\mathbf{M}\,(z\in x\land z\in y)))$。$x\in\mathbf{M}$ で $x\cap\mathbf{M}\neq\emptyset$ とし、$x\cap\mathbf{M}$（$\subseteq\mathbf{WF}$）の元のうちランク最小の $y$ をとる。$z\in x\cap\mathbf{M}$ かつ $z\in y$ なら $\rank(z)<\rank(y)$（\ref{set:rank-basic}）となり最小性に反する。
:::

## WF と R(ω) {#set:sec-wf-r-omega-models}

::: theorem WF と R(ω) における ZF − Inf の公理 {#set:wf-relativization keywords="WF and R(omega) are models of ZF minus Infinity" index="WF のモデル|だぶりゅーえふのもでる, 遺伝的有限集合のモデル|いでんてきゆうげんしゅうごうのもでる"}
（$\ZF^{-}$）$\mathbf{N}$ を $\mathbf{WF}$ または $R(\omega)$ とすると、$\ZF-\mathrm{Inf}$ の公理（公理 0 と、無限公理と選択公理を除くすべて）は $\mathbf{N}$ の中で真である。
:::

::: proof
$\mathbf{N}$ は推移的（\ref{set:r-alpha-basic}, \ref{set:wf-subset}）で空でない（$0\in\mathbf{N}$）。
- **外延性**：\ref{set:extensionality-in-transitive}。
- **分出と冪集合**：$z\in\mathbf{N}$ なら $\mathcal{P}(z)\in\mathbf{N}$（$\mathbf{WF}$ は \ref{set:wf-closure}、$R(\omega)$ は $z\in R(n)$ なら $z\subseteq R(n)$ で $\mathcal{P}(z)\subseteq\mathcal{P}(R(n))=R(n+1)$、よって $\mathcal{P}(z)\in R(n+2)$）。推移性より $\mathcal{P}(z)\subseteq\mathbf{N}$ なので \ref{set:comprehension-power-closed}、また $y\defeq\mathcal{P}(z)$ として \ref{set:power-set-in-transitive}。
- **対と和**：$\{x,y\}$, $\bigcup x$ は $\mathbf{N}$ に属する（$\mathbf{WF}$ は \ref{set:wf-closure}、$R(\omega)$ は $x,y\in R(n)$ なら $\{x,y\}\in R(n+1)$、$\bigcup x\subseteq R(n)$ で $\bigcup x\in R(n+1)$）。\ref{set:pairing-union-in-class}。
- **置換**：前件を満たす $\varphi$, $A$ について $Y\defeq\{y\in\mathbf{N}:\exists x\in A\,\varphi^{\mathbf{N}}\}$ は置換公理（$\mathbf{V}$ の中で）により集合で、$Y\subseteq\mathbf{N}$。$\mathbf{N}=\mathbf{WF}$ なら \ref{set:wf-subset} より $Y\in\mathbf{WF}$。$\mathbf{N}=R(\omega)$ なら、$A\in R(n)$ となる $n$ について $A\subseteq R(n)$ は有限（\ref{set:r-n-finite}）で、$Y$ は $A$ の関数による像なので有限。各 $y\in Y$ を含む $R(m_{y})$ の $m_{y}$ の最大値を $m$ とすると $Y\subseteq R(m)$、よって $Y\in R(m+1)$。\ref{set:replacement-in-class}。
- **基礎**：$\mathbf{N}\subseteq\mathbf{WF}$ なので \ref{set:foundation-in-wf-subclass}。

::: hypcheck
- **推移性**：外延性・冪集合・置換の補題の適用で使った。
- **基礎の公理を使わないこと**：議論は $\ZF^{-}$ の中で行い、$\mathbf{WF}$ の中で基礎の公理が成り立つことを**示した**（\ref{set:foundation-in-wf-subclass}）。
- **$R(\omega)$ の置換**：$Y$ の有限性に $A$ の有限性と「有限集合の像は有限」を使った。選択公理は不要。
:::
:::

$\mathbf{WF}$ で無限公理が真、$R(\omega)$ で偽であることは、定義された記号 $0$, $S$ が $\mathbf{WF}$ と $R(\omega)$ でも本来の意味をもつこと（**絶対性**）を確かめる必要があり、次ページ以降で示す。その結果、$\mathrm{Con}(\ZF^{-})\to\mathrm{Con}(\ZF)$ と $\mathrm{Con}(\ZF^{-})\to\mathrm{Con}(\ZF-\mathrm{Inf}+\lnot\mathrm{Inf})$ が得られる。

## 基本補題の構文論的な証明 {#set:sec-relativization-syntactic}

\ref{set:relative-consistency-lemma} の証明は完全性定理を使った。この節では、$S$ からの矛盾の導出を、$T$ からの矛盾の導出へ具体的に書き換えることで同じ結論を示す。導出の体系にはヒルベルト流の体系 $\mathsf{H}$（\ref{pt:hilbert-system}）を使う。推論規則がモーダスポネンスと汎化の二つだけなので、導出の各行を相対化して並べ直す議論がもっとも短く書けるからである。

**この節の約束.**
- $\mathsf{H}$ は論理の系列の言語（原始記号 $\bot,\to,\forall$。$\lnot\varphi\defeq\varphi\to\bot$、$\varphi\land\psi\defeq\lnot(\varphi\to\lnot\psi)$、$\exists x\,\varphi\defeq\lnot\forall x\,\lnot\varphi$ は略記。\ref{logic:abbreviations}）で書かれている。集合論の言語の論理式は、二項述語記号 $\in$ と等号をもち関数記号のない言語の論理式として、これらの略記を展開して読む。項は変数だけである。$\Gamma\vdash_{\mathsf{H}}\varphi$、$\mathrm{Thm}_{\mathsf{H}}$、演繹定理は \ref{pt:hilbert-system}, \ref{pt:hilbert-deduction-theorem} のとおり。$\mathrm{FV}(\varphi)$ は自由変数の集合、$\varphi[y/x]$ は代入、「代入可能」は \ref{logic:substitutable} のとおり。
- クラス $\mathbf{M}$ を定める論理式 $\mathbf{M}(v)$ は $v$ 以外に自由変数をもたず、$\mathbf{M}(y)$ は $\mathbf{M}(v)[y/v]$ の略である。$v$ と $\mathbf{M}(v)$ の束縛変数は、以下で書き換える導出に現れない変数にとる。$\mathsf{E}_{\mathbf{M}}\defeq\exists v\,\mathbf{M}(v)$ とおく。
- 変数の有限の列 $\vec{y}=y_{1},\dots,y_{k}$ と論理式 $\chi$ について、$\mathbf{M}(y_{1})\to(\mathbf{M}(y_{2})\to(\cdots\to(\mathbf{M}(y_{k})\to\chi)\cdots))$ を $\mathbf{M}(\vec{y})\to\chi$ と略記する（$k=0$ なら $\chi$ そのもの）。

::: definition 原始記号に沿った相対化 {#set:relativization-primitive keywords="relativization along primitive symbols"}
論理の系列の言語の論理式 $\varphi$ に対し、$\varphi^{(\mathbf{M})}$ を次の再帰で定める。
$$
\bot^{(\mathbf{M})}\defeq\bot,\quad(x\in y)^{(\mathbf{M})}\defeq x\in y,\quad(x=y)^{(\mathbf{M})}\defeq x=y,\quad(\varphi\to\psi)^{(\mathbf{M})}\defeq\varphi^{(\mathbf{M})}\to\psi^{(\mathbf{M})},\quad(\forall x\,\varphi)^{(\mathbf{M})}\defeq\forall x\,(\mathbf{M}(x)\to\varphi^{(\mathbf{M})}).
$$
:::

構成に関する帰納法で次がわかる。(i) $\mathrm{FV}(\varphi^{(\mathbf{M})})=\mathrm{FV}(\varphi)$ である。$\forall$ の節で加わる $\mathbf{M}(x)$ の自由変数は $x$ だけで、それは $\forall x$ で束縛されるからである。(ii) $(\lnot\varphi)^{(\mathbf{M})}=\lnot\varphi^{(\mathbf{M})}$ と $(\varphi\land\psi)^{(\mathbf{M})}=\varphi^{(\mathbf{M})}\land\psi^{(\mathbf{M})}$ が記号列として成り立つ。$\lnot$ と $\land$ は $\to$ と $\bot$ の略記だからである。(iii) $y$ が $\varphi$ の中で $x$ に代入可能なら、$y$ は $\varphi^{(\mathbf{M})}$ の中でも $x$ に代入可能で、$(\varphi[y/x])^{(\mathbf{M})}=\varphi^{(\mathbf{M})}[y/x]$ である。$\forall z$ の節では、$z\neq x$ のとき $\mathbf{M}(z)[y/x]=\mathbf{M}(z)$（$x$ は $\mathbf{M}(z)$ の自由変数でない）であり、$\mathbf{M}$ の束縛変数は $y$ と異なるようにとってあるからである。

$\exists$ については (ii) のような一致は成り立たない。集合論の言語の $\exists x\,\psi$ は $\lnot\forall x\,\lnot\psi$ と読まれるので $(\exists x\,\psi)^{(\mathbf{M})}=\lnot\forall x\,(\mathbf{M}(x)\to\lnot\psi^{(\mathbf{M})})$ となる。一方、\ref{set:relativization} の $(\exists x\,\psi)^{\mathbf{M}}=\exists x\,(\mathbf{M}(x)\land\psi^{\mathbf{M}})$ は $\lnot\forall x\,\lnot\lnot(\mathbf{M}(x)\to\lnot\psi^{\mathbf{M}})$ と読まれ、二重否定の分だけ異なる。この差は次の二つの補題で埋める。

::: lemma H での基本的な操作 {#set:hilbert-facts}
$\vdash$ は $\vdash_{\mathsf{H}}$ とする。
1. （命題論理の操作）$\vdash(A\to(B\to C))\to(B\to(A\to C))$、$\vdash(A\to B)\to((B\to C)\to(A\to C))$、$\vdash(A\to(A\to B))\to(A\to B)$、$\vdash(A\to B)\to(\lnot B\to\lnot A)$、$\vdash(\lnot B\to\lnot A)\to(A\to B)$、$\vdash A\to\lnot\lnot A$、$\vdash\lnot\lnot A\to A$。
2. （$\forall$ を後件に入れる）$\vdash B_{1}\to(\cdots\to(B_{k}\to C)\cdots)$ で、$x$ がどの $B_{i}$ にも自由に現れないなら、$\vdash B_{1}\to(\cdots\to(B_{k}\to\forall x\,C)\cdots)$。
3. （$\mathsf{E}_{\mathbf{M}}$ による変数の除去）$\vdash\mathbf{M}(w)\to\chi$ で $w\notin\mathrm{FV}(\chi)$ なら、$\vdash\mathsf{E}_{\mathbf{M}}\to\chi$。
4. （同値なものの置き換え）$\vdash\alpha\to\beta$ と $\vdash\beta\to\alpha$ が成り立つとき（以下これを $\vdash\alpha\leftrightarrow\beta$ と書く）、任意の $\gamma$ と変数 $x$ について $\vdash(\alpha\to\gamma)\leftrightarrow(\beta\to\gamma)$、$\vdash(\gamma\to\alpha)\leftrightarrow(\gamma\to\beta)$、$\vdash\forall x\,\alpha\leftrightarrow\forall x\,\beta$。
:::

::: proof
**Step 1.** 【主張：1 が成り立つ】 どれも、前件を仮定に置いてモーダスポネンスを使い、演繹定理（\ref{pt:hilbert-deduction-theorem}.2）で仮定を外せばよい。順に、$\{A\to(B\to C),B,A\}\vdash C$、$\{A\to B,B\to C,A\}\vdash C$、$\{A\to(A\to B),A\}\vdash B$ である。対偶は $\lnot B=B\to\bot$ なので $\{A\to B,B\to\bot,A\}\vdash\bot$ から従う。逆向きは、$\{\lnot B\to\lnot A,A,\lnot B\}\vdash\bot$ から $\{\lnot B\to\lnot A,A\}\vdash\lnot\lnot B$ を得て、公理 H3 $\lnot\lnot B\to B$ とモーダスポネンスで $B$ を得る。$\{A,\lnot A\}\vdash\bot$ から $\vdash A\to\lnot\lnot A$ であり、$\lnot\lnot A\to A$ は H3 そのものである。

**Step 2.** 【主張：2 が成り立つ】 まず補助の主張「$x$ がどの $B_{i}$ にも自由に現れないなら $\vdash\forall x\,(B_{1}\to\cdots\to(B_{k}\to C))\to(B_{1}\to\cdots\to(B_{k}\to\forall x\,C))$」を $k$ の帰納法で示す。$k=0$ のとき、これは \ref{pt:hilbert-deduction-theorem}.1 の $\vdash\forall x\,C\to\forall x\,C$ である。$k\geq1$ のとき、$R\defeq B_{2}\to\cdots\to(B_{k}\to C)$ とおく。公理 Q2（$x\notin\mathrm{FV}(B_{1})$）より $\vdash\forall x\,(B_{1}\to R)\to(B_{1}\to\forall x\,R)$ である。帰納法の仮定 $\vdash\forall x\,R\to(B_{2}\to\cdots\to\forall x\,C)$ を、1 の連鎖（$A\to B$ と $B\to C$ から $A\to C$）で後件の側につなげばよい（$\vdash(\forall x\,R\to D)$ から $\vdash(B_{1}\to\forall x\,R)\to(B_{1}\to D)$ が演繹定理で得られる）。2 の仮定の論理式は定理なので、汎化して $\forall x\,(B_{1}\to\cdots\to C)$ が定理になり、補助の主張とモーダスポネンスで結論を得る。

**Step 3.** 【主張：3 が成り立つ】 $\vdash\mathbf{M}(w)\to\chi$ を汎化して $\vdash\forall w\,(\mathbf{M}(w)\to\chi)$ を得る。$v$ は $\mathbf{M}(w)\to\chi$ の中で $w$ に代入可能である。$w$ の自由な出現は $\mathbf{M}(w)$ の中だけにあり、そこで $v$ を束縛する量化子はないからである。公理 Q1 と $w\notin\mathrm{FV}(\chi)$ より $\vdash\mathbf{M}(v)\to\chi$ である。1 の対偶で $\vdash\lnot\chi\to\lnot\mathbf{M}(v)$ となる。$v\notin\mathrm{FV}(\chi)$（$v$ は $\chi$ に自由には現れない。$\chi$ が $\mathsf{E}_{\mathbf{M}}$ を含んでも、そこでは $v$ は束縛されている）なので、2 より $\vdash\lnot\chi\to\forall v\,\lnot\mathbf{M}(v)$ である。もう一度 1 の対偶を使って $\vdash\lnot\forall v\,\lnot\mathbf{M}(v)\to\lnot\lnot\chi$ を得る。左辺は $\mathsf{E}_{\mathbf{M}}$ であり、H3 とつなげて $\vdash\mathsf{E}_{\mathbf{M}}\to\chi$ である。

**Step 4.** 【主張：4 が成り立つ】 一方向だけ示せば、$\alpha$ と $\beta$ を入れ替えて他方向も得られる。$\vdash\alpha\to\beta$ と 1 の連鎖から $\vdash(\beta\to\gamma)\to(\alpha\to\gamma)$ と $\vdash(\gamma\to\alpha)\to(\gamma\to\beta)$ が従う。$\forall$ については、Q1（$t=x$）とモーダスポネンスで $\{\forall x\,\alpha\}\vdash\alpha$、さらに $\{\forall x\,\alpha\}\vdash\beta$ となるので、演繹定理で $\vdash\forall x\,\alpha\to\beta$ である。$x\notin\mathrm{FV}(\forall x\,\alpha)$ なので、2 より $\vdash\forall x\,\alpha\to\forall x\,\beta$ である。

::: hypcheck
- **汎化を定理にだけ使うこと**：Step 2・3 で汎化したのはすべて定理（仮定のない導出の結論）である。仮定のもとで汎化すると健全でなくなる（\ref{pt:hilbert-system} の後の注意）。
- **$v$ が新しい変数であること**：Step 3 で $v$ を $w$ に代入し、$v\notin\mathrm{FV}(\chi)$ を使った。
:::
:::

::: lemma 二つの相対化は同値 {#set:relativization-two-forms}
集合論の言語の任意の論理式 $\varphi$ について、$\vdash_{\mathsf{H}}\varphi^{\mathbf{M}}\leftrightarrow\varphi^{(\mathbf{M})}$。ここで左辺は \ref{set:relativization} の相対化を略記を展開して読んだもの、右辺は \ref{set:relativization-primitive} の相対化を $\varphi$ の読みに施したものである。
:::

::: proof
$\varphi$ の構成に関する帰納法で示す。原子論理式なら両辺は同じ記号列である。$\varphi=\lnot\psi$ なら、$\varphi^{\mathbf{M}}=\psi^{\mathbf{M}}\to\bot$、$\varphi^{(\mathbf{M})}=\psi^{(\mathbf{M})}\to\bot$ であり、帰納法の仮定と \ref{set:hilbert-facts}.4 から従う。$\varphi=\psi\land\chi$ なら、両辺は $\lnot(\psi^{\mathbf{M}}\to\lnot\chi^{\mathbf{M}})$ と $\lnot(\psi^{(\mathbf{M})}\to\lnot\chi^{(\mathbf{M})})$ で、\ref{set:hilbert-facts}.4 を内側から順に使えばよい。$\varphi=\exists x\,\psi$ なら、上で見たとおり左辺は $\lnot\forall x\,\lnot\lnot A$、右辺は $\lnot\forall x\,A'$ である。ここで $A\defeq\mathbf{M}(x)\to\lnot\psi^{\mathbf{M}}$、$A'\defeq\mathbf{M}(x)\to\lnot\psi^{(\mathbf{M})}$ とおいた。\ref{set:hilbert-facts}.1 より $\vdash\lnot\lnot A\leftrightarrow A$ である。帰納法の仮定と \ref{set:hilbert-facts}.4 より $\vdash A\leftrightarrow A'$ である。これらをつなげて $\vdash\lnot\lnot A\leftrightarrow A'$ を得て、\ref{set:hilbert-facts}.4 を $\forall x$ と $\lnot$ に使う。
:::

::: lemma 定理の相対化 {#set:relativized-theorems}
$\theta\in\mathrm{Thm}_{\mathsf{H}}$ とし、$\vec{y}$ を $\mathrm{FV}(\theta)$ のすべての変数を含む相異なる変数の列とする。このとき $\vdash_{\mathsf{H}}\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\theta^{(\mathbf{M})})$。
:::

::: proof
$\vdash$ は $\vdash_{\mathsf{H}}$ とし、$\theta'\defeq\theta^{(\mathbf{M})}$ のように $'$ で相対化を表す。

**Step 1.** 【主張：列 $\vec{y}$ は取り替えてよい。すなわち、ある列で結論が成り立てば、$\mathrm{FV}(\theta)$ を含む任意の列で成り立つ】 変数を足すには H1（$\vdash D\to(\mathbf{M}(z)\to D)$）を使う。並べ替えには \ref{set:hilbert-facts}.1 の入れ替えを使う。$\mathrm{FV}(\theta)$ に属さない変数 $w$ を除くには、まず入れ替えで $\vdash\mathbf{M}(w)\to(\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\theta'))$ の形にする。ここで $w$ は後件に自由に現れない（$\mathrm{FV}(\theta')=\mathrm{FV}(\theta)$、$\mathsf{E}_{\mathbf{M}}$ は文、$\vec{y}$ は $w$ を含まない）ので、\ref{set:hilbert-facts}.3 で $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\theta'))$ となる。\ref{set:hilbert-facts}.1 の縮約で $\mathsf{E}_{\mathbf{M}}$ を一つにする。以下では、各場合に都合のよい一つの列で示せば足りる。

**Step 2.** 【主張：$\theta$ が公理 H1・H2・H3・E1・E2 なら結論が成り立つ】 (ii) より、H1〜H3 の相対化は同じ図式の公理である（相対化は $\to$ と $\lnot$ と交換する）。E1 の $y=y$ は相対化しても変わらない。E2 の $s=t\to(\varphi[s/x]\to\varphi[t/x])$ の相対化は、(iii) より $s=t\to(\varphi'[s/x]\to\varphi'[t/x])$ で、$s,t$ は $\varphi'$ の中で $x$ に代入可能なので、再び E2 である。どの場合も $\vdash\theta'$ であり、H1 を繰り返して前件 $\mathsf{E}_{\mathbf{M}}$ と $\mathbf{M}(\vec{y})$ を足せばよい。

**Step 3.** 【主張：$\theta$ が公理 Q1 $\forall x\,\varphi\to\varphi[t/x]$ なら結論が成り立つ】 $\theta'=\forall x\,(\mathbf{M}(x)\to\varphi')\to\varphi'[t/x]$ である（(iii)）。

$x\in\mathrm{FV}(\varphi)$ の場合を考える。このとき $t\in\mathrm{FV}(\theta)$ なので、$t$ を含む列で示せばよい。$t$ は $\mathbf{M}(x)\to\varphi'$ の中で $x$ に代入可能なので、Q1 より $\vdash\forall x\,(\mathbf{M}(x)\to\varphi')\to(\mathbf{M}(t)\to\varphi'[t/x])$ である。入れ替えで $\vdash\mathbf{M}(t)\to\theta'$ となり、H1 で残りの前件を足す。

$x\notin\mathrm{FV}(\varphi)$ の場合を考える。このとき $\varphi[t/x]=\varphi$ である。Q1（$t=x$）より $\vdash\forall x\,(\mathbf{M}(x)\to\varphi')\to(\mathbf{M}(x)\to\varphi')$、入れ替えで $\vdash\mathbf{M}(x)\to\theta'$ となる。$x\notin\mathrm{FV}(\theta')$ なので、\ref{set:hilbert-facts}.3 より $\vdash\mathsf{E}_{\mathbf{M}}\to\theta'$ である。

**Step 4.** 【主張：$\theta$ が公理 Q2 $\forall x\,(\varphi\to\psi)\to(\varphi\to\forall x\,\psi)$（$x\notin\mathrm{FV}(\varphi)$）なら結論が成り立つ】 $A\defeq\forall x\,(\mathbf{M}(x)\to(\varphi'\to\psi'))$ とおくと、$\theta'=A\to(\varphi'\to\forall x\,(\mathbf{M}(x)\to\psi'))$ である。Q1（$t=x$）と入れ替えで $\vdash A\to(\varphi'\to(\mathbf{M}(x)\to\psi'))$ となる。$x$ は $A$ にも $\varphi'$ にも自由に現れない（$\mathrm{FV}(\varphi')=\mathrm{FV}(\varphi)$）ので、\ref{set:hilbert-facts}.2 より $\vdash A\to(\varphi'\to\forall x\,(\mathbf{M}(x)\to\psi'))$、すなわち $\vdash\theta'$ である。H1 で前件を足す。

**Step 5.** 【主張：$\theta$ がモーダスポネンスで $\alpha$ と $\alpha\to\theta$（ともに $\mathrm{Thm}_{\mathsf{H}}$ の元で、結論が成り立つ）から得られるなら、$\theta$ でも結論が成り立つ】 列 $\vec{y}$ を、$\mathrm{FV}(\alpha)\cup\mathrm{FV}(\theta)$ を含むようにとる。帰納法の仮定と Step 1 より $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\alpha')$ と $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to(\alpha'\to\theta'))$ である（$(\alpha\to\theta)'=\alpha'\to\theta'$）。前件をすべて仮定に置いてモーダスポネンスを二回使うと、演繹定理より $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\theta')$ となる。$\alpha$ にだけ現れる自由変数は、Step 1 で列から除ける。$\mathsf{E}_{\mathbf{M}}$ が要るのはこの除去のためである。

**Step 6.** 【主張：$\theta=\forall x\,\varphi$ が汎化で $\varphi\in\mathrm{Thm}_{\mathsf{H}}$（結論が成り立つ）から得られるなら、$\theta$ でも結論が成り立つ】 $\vec{y}$ を、$x$ を含まず $\mathrm{FV}(\theta)$ を含む列とする。$\vec{y},x$ は $\mathrm{FV}(\varphi)$ を含むので、帰納法の仮定と Step 1 より $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to(\mathbf{M}(x)\to\varphi'))$ である。$x$ は $\mathsf{E}_{\mathbf{M}}$ にも各 $\mathbf{M}(y_{i})$ にも自由に現れないので、\ref{set:hilbert-facts}.2 より $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\forall x\,(\mathbf{M}(x)\to\varphi'))$ となる。後件は $\theta'$ である。

Step 2〜6 で $\mathrm{Thm}_{\mathsf{H}}$ のすべての元に結論が成り立つ。$\mathrm{Thm}_{\mathsf{H}}$ は公理を含みモーダスポネンスと汎化で閉じた最小の集合だからである。

::: hypcheck
- **$\mathsf{E}_{\mathbf{M}}$（$\mathbf{M}$ が空でないこと）**：Step 3 の $x\notin\mathrm{FV}(\varphi)$ の場合と、Step 5 の変数の除去に使った。これがないと結論は偽になりうる。$\mathbf{M}$ が空クラス（$\mathbf{M}(v)\defeq v\neq v$）のとき、論理の定理 $\forall x\,(x=x)\to\lnot\forall x\,\lnot(x=x)$ の相対化は $\mathbf{M}$ が空なので偽である。空でない議論領域を約束する一階述語論理に対応している。
- **汎化が定理にだけ許されること**：Step 6 で帰納法が回るのは、$\varphi$ が仮定のない定理で、相対化した形も仮定なしに証明できているからである。
- **$\mathbf{M}$ の変数が新しいこと**：Step 2 の E2 と Step 3 で (iii) を使うのに必要である。
:::
:::

::: theorem 導出の相対化 {#set:relativized-derivation keywords="relativization of Hilbert-style derivations" index="導出の相対化|どうしゅつのそうたいか"}
$\gamma_{1},\dots,\gamma_{n}$ を文、$\psi$ を論理式とし、$\{\gamma_{1},\dots,\gamma_{n}\}\vdash_{\mathsf{H}}\psi$ とする。$\vec{y}$ を $\mathrm{FV}(\psi)$ を含む相異なる変数の列とすると
$$
\vdash_{\mathsf{H}}\mathsf{E}_{\mathbf{M}}\to\Bigl(\gamma_{1}^{(\mathbf{M})}\to\bigl(\cdots\to(\gamma_{n}^{(\mathbf{M})}\to(\mathbf{M}(\vec{y})\to\psi^{(\mathbf{M})}))\cdots\bigr)\Bigr).
$$
:::

::: proof
$\{\gamma_{1},\dots,\gamma_{n}\}\vdash_{\mathsf{H}}\psi$ は、$\psi$ が $\{\gamma_{1},\dots,\gamma_{n}\}\cup\mathrm{Thm}_{\mathsf{H}}$ からモーダスポネンスだけで得られることである（\ref{pt:hilbert-system}）。その過程に関する帰納法で示す。前件の並び $\mathsf{E}_{\mathbf{M}},\gamma_{1}^{(\mathbf{M})},\dots,\gamma_{n}^{(\mathbf{M})},\mathbf{M}(\vec{y})$ をまとめて $\Delta$ と書く。

**Step 1.** 【主張：$\psi$ が $\gamma_{i}$ なら結論が成り立つ】 $\gamma_{i}^{(\mathbf{M})}$ は前件の一つなので、前件をすべて仮定に置けば仮定そのものであり、演繹定理で結論を得る。

**Step 2.** 【主張：$\psi\in\mathrm{Thm}_{\mathsf{H}}$ なら結論が成り立つ】 \ref{set:relativized-theorems} より $\vdash\mathsf{E}_{\mathbf{M}}\to(\mathbf{M}(\vec{y})\to\psi^{(\mathbf{M})})$ である。H1 と入れ替えで $\gamma_{i}^{(\mathbf{M})}$ を前件に足す。

**Step 3.** 【主張：$\psi$ が $\alpha$ と $\alpha\to\psi$ からモーダスポネンスで得られるなら結論が成り立つ】 \ref{set:relativized-theorems} の Step 5 と同じである。列を $\mathrm{FV}(\alpha)$ まで広げてモーダスポネンスを使い、$\alpha$ にだけ現れる変数 $w$ を除く。除去には \ref{set:hilbert-facts}.3 を使う。そのために $\mathbf{M}(w)$ をいちばん前に出しておく。$\gamma_{i}^{(\mathbf{M})}$ は文で自由変数をもたないので、$w$ を除く妨げにならない。

::: hypcheck
- **$\gamma_{i}$ が文であること**：Step 3 で $\gamma_{i}^{(\mathbf{M})}$ に $w$ が自由に現れないことに使った。$S$ の公理は文なので、相対無矛盾性への応用ではこれで足りる。
:::
:::

::: proposition 相対無矛盾性の基本補題（構文論的な証明） {#set:relativization-syntactic-proof keywords="syntactic proof of the relative consistency lemma, finitistic"}
\ref{set:relative-consistency-lemma} の仮定のもとで、$S$ からの矛盾の導出が与えられれば、$T$ からの矛盾の導出を具体的な手続きで作れる。とくに $\mathrm{Con}(T)\to\mathrm{Con}(S)$ であり、この証明は完全性定理を使わない。
:::

::: proof
**Step 1.** 【主張：$S$ が矛盾するなら、$S$ の有限個の文 $\gamma_{1},\dots,\gamma_{n}$ で $\{\gamma_{1},\dots,\gamma_{n}\}\vdash_{\mathsf{H}}\bot$ となるものが具体的に得られる】 $S\vdash\chi$ かつ $S\vdash\lnot\chi$ とする。\ref{set:deduction-finite} より、それらの導出に現れる有限個の $\gamma_{1},\dots,\gamma_{n}\in S$ について $\{\vec{\gamma}\}\vdash\chi$ かつ $\{\vec{\gamma}\}\vdash\chi\to\bot$ である。$\to$E で $\{\vec{\gamma}\}\vdash\bot$ となる。\ref{pt:systems-equivalence} は自然演繹の導出を $\mathsf{H}$ の導出に構文論的に翻訳するので、$\{\vec{\gamma}\}\vdash_{\mathsf{H}}\bot$ である。

**Step 2.** 【主張：$\vdash_{\mathsf{H}}\mathsf{E}_{\mathbf{M}}\to(\gamma_{1}^{(\mathbf{M})}\to(\cdots\to(\gamma_{n}^{(\mathbf{M})}\to\bot)\cdots))$】 \ref{set:relativized-derivation} を $\psi=\bot$ と空の列 $\vec{y}$ に使う。$\bot^{(\mathbf{M})}=\bot$ である。

**Step 3.** 【主張：$T$ は矛盾する】 仮定より $T\vdash\exists x\,\mathbf{M}(x)$ である。$\exists x\,\mathbf{M}(x)$ と $\mathsf{E}_{\mathbf{M}}$ は束縛変数の名前だけが違うので、\ref{pt:alpha-derivability} より $T\vdash\mathsf{E}_{\mathbf{M}}$ である。また仮定より $T\vdash\gamma_{i}^{\mathbf{M}}$ である。\ref{set:relativization-two-forms} より $T\vdash\gamma_{i}^{(\mathbf{M})}$ である（$\mathsf{H}$ の定理は \ref{pt:systems-equivalence} で自然演繹の定理に翻訳できる）。Step 2 の定理にモーダスポネンスを $n+1$ 回使うと $T\vdash\bot$ となり、$T$ は矛盾する。

対偶をとれば $\mathrm{Con}(T)\to\mathrm{Con}(S)$ を得る。Step 1〜3 のどの段も、与えられた導出から新しい導出を記号の操作で作るだけである。モデルの存在（完全性定理）は使っていない。

::: hypcheck
- **$T\vdash\exists x\,\mathbf{M}(x)$**：Step 3 で $\mathsf{E}_{\mathbf{M}}$ を外すのに使った。\ref{set:relativized-theorems} の hypcheck のとおり、これがないと Step 2 の定理自体が得られない。
- **各 $\varphi\in S$ について $T\vdash\varphi^{\mathbf{M}}$**：Step 3 で、矛盾の導出に実際に使われた有限個の $\gamma_{i}$ についてだけ使った。したがって仮定は「$S$ の有限部分ごと」で足りる。これがパラメータつきの形（\ref{set:relative-consistency-formal}）の根拠になる。
- **ヒルベルト流を選んだ理由**：推論規則がモーダスポネンスと汎化だけなので、帰納法の場合分けが公理の図式と二つの規則で尽きる。自然演繹で同じことをすると、仮定の解消を伴う規則ごとに相対化した仮定の扱いを書く必要がある。
:::
:::

## 問題 {#set:sec-relativization-problems}

::: problem {#set:prob-relativize-forall}
$(\forall x\in y\,\varphi)^{\mathbf{M}}$ が、$\mathbf{M}$ が推移的で $y\in\mathbf{M}$ のとき $\forall x\in y\,\varphi^{\mathbf{M}}$ と同値であることを示せ。
:::

::: solution
$\forall x\in y\,\varphi$ は $\forall x\,(x\in y\to\varphi)$ の略なので、相対化は $\forall x\,(\mathbf{M}(x)\to(x\in y\to\varphi^{\mathbf{M}}))$。$\mathbf{M}$ が推移的で $y\in\mathbf{M}$ なら $x\in y\Rightarrow x\in\mathbf{M}$ なので、$\mathbf{M}(x)$ の条件は $x\in y$ から従い、$\forall x\,(x\in y\to\varphi^{\mathbf{M}})$ と同値。
:::

::: problem {#set:prob-omega-plus-one}
$\mathbf{M}=\omega$（自然数全体）で、外延性と対の公理はそれぞれ真か。
:::

::: solution
$\omega$ は推移的なので外延性は真（\ref{set:extensionality-in-transitive}）。対の公理の相対化は「任意の $m,n\in\omega$ について $m,n\in k$ となる $k\in\omega$ がある」で、$k=\max(m,n)+1$ とすれば真（$\omega$ の元は順序数で、$m<k$ は $m\in k$）。分出は偽：$z=2$, $\varphi(x)\defeq x=1$ とすると $\{x\in2:x=1\}=\{1\}\notin\omega$（$\omega$ は推移的なので、\ref{set:comprehension-in-class} の後の注意より分出は成り立たない）。
:::

::: supplement
**前提の検討.**
- \ref{set:relative-consistency-lemma} は $T$ と $S$ の間の関係を問うだけで、$T$ 自身の無矛盾性は仮定である。第二不完全性定理（\tref{pt:godel-second}）により、$\ZF$ が無矛盾なら $\ZF$ の中で $\mathrm{Con}(\ZF)$ は証明できないので、この形の相対化は避けられない。
- 本ページの補題の多くは推移性を仮定する。推移的でないクラスへの相対化も同じ定義で意味をもつが、$\subseteq$ などの定義された関係の意味が変わりうる（「定義された記号の相対化」）。

**関連する結果.** 相対化は、一階述語論理でいう**部分構造**（定義可能な部分集合への制限）への翻訳である（\ref{set:relativization-substructure}）。$\in$ も読み替える一般の翻訳（相対解釈）は \see{set:relative-interpretation}。

**高い視点から：クラスは「内部の宇宙」.** 相対化 $\varphi^{\mathbf{M}}$ は、宇宙 $\mathbf{V}$ の中に住む住人が、クラス $\mathbf{M}$ だけを「世界のすべて」と思い込んだときに見える真理である。$\mathbf{M}$ が推移的なら、住人は自分の世界の元の元を正しく見ている（$x\in\mathbf{M}$ の元はすべて $\mathbf{M}$ にある）ので、「部分集合」「対」などの素朴な概念は $\mathbf{V}$ と同じ意味になる。相対無矛盾性の証明は、住人の宇宙が $S$ を満たすことを示すことで、$S$ に「一つの世界」を与える、というモデル構成の最も素朴な形である。圏論的には、$\mathbf{M}$ への相対化は $\mathbf{V}$ の部分対象への制限で、推移性は「部分対象が元の取り方（$\in$）に関して閉じている」という条件にあたる。
:::
