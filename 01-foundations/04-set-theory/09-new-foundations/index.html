# 全体集合をもつ集合論（Set Theory with a Universal Set）

クワインの NF（New Foundations）とその変種 NFU を扱う。型つき集合論 TST と層別化、層別化された内包公理だけをもつ NF、全体集合・補集合・フレーゲ流の基数とカントール的集合、原子を許す NFU の無矛盾性（自己同型をもつモデルからの構成）、NF では選択公理が成り立たないこと（スペッカー）、NF の無矛盾性（曖昧性と絡み合う型理論、Holmes による証明と Lean での検証とされるもの）。資料なしの標準的な内容（Forster『Set Theory with a Universal Set』、Holmes『Elementary Set Theory with a Universal Set』の範囲とされるもの）で、文献の細部は本文で未確認と明記する。

<p class="mn-msc">MSC2020: 03E70, 03E35, 03B15</p>
