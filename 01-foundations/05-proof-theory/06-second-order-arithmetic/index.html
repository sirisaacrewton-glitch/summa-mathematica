# 二階算術（Second-Order Arithmetic）

二階算術の言語と ω モデル、解析的階層、内包公理と部分体系（RCA₀, WKL₀, ACA₀, ATR₀, Π¹₁-CA₀）、ACA₀ の PA 上の保存性、選択公理・従属選択・超限帰納法と β モデル。（田中一之『逆数学と2階算術』第 2・3 章に対応）

<p class="mn-msc">MSC2020: 03F35</p>
