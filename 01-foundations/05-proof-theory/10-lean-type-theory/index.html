# Lean の型理論と無矛盾性の強さ（The Type Theory of Lean and Its Consistency Strength）

定理証明支援系 Lean 4 の核にある依存型理論を、数学の対象として調べる。宇宙の階層と非可述的な命題の宇宙、帰納型と定義的等価、命題外延性・商型・選択の三つの公理と、そこから関数外延性・排中律が導かれること。定義的等価の決定不能性と、型検査の算法での推移性・部分簡約の破れ。到達不能基数を使った集合論のモデル（無矛盾性の上界）と、型理論の中に作る ZFC のモデル（下界）、大域的選択との関係。資料なしの標準的な内容（Carneiro『The Type Theory of Lean』、Werner「Sets in Types, Types in Sets」の内容とされるもの）で、文献の細部は本文で未確認と明記する。
