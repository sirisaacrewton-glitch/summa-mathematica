# 対角化定理と第一不完全性定理 {#pt:page-diagonal-first-incompleteness keywords="diagonal lemma, fixed point lemma, generalized diagonal lemma, Gödel sentence, first incompleteness theorem, omega-consistency"}

**対角化定理**は、任意の性質 $P(y)$ に対して「自分のゲーデル数が $P$ をもつ」と主張する文 $S$、すなわち $\PA\vdash S\leftrightarrow P(\Godel{S})$ となる文を作れることを主張する。$P(y)$ として $\neg\mathrm{Bew}(y)$ をとると、「自分は証明できない」と主張する**ゲーデル文** $G$ が得られ、$\PA$ が無矛盾なら $G$ は証明できず、$\PA$ が $\omega$ 無矛盾なら $\neg G$ も証明できない。これが**第一不完全性定理**である。

## 記法と定義の確認 {#pt:sec-diag-notation}

::: notation
- ゲーデル数、構文の述語と関数（とくに $\mathrm{sub}$, $\mathrm{num}$）、$\mathrm{Pf}$, $\mathrm{Bew}$ とその正しさは \ref{pt:page-arithmetization}、D1 は \ref{pt:d1} のとおり。Σ 関数と、関数的な論理式による略記 $\varphi(f(\vec{x}))\defeq\exists y\,(F(\vec{x},y)\wedge\varphi(y))$ は \ref{pt:functional-formula} のとおり。
- 文 $\sigma$ が $\PA$ で**決定できない**とは、$\PA\nvdash\sigma$ かつ $\PA\nvdash\neg\sigma$ であることをいう。そのような文があるとき $\PA$ は**不完全**であるという。
:::

## 対角化定理 {#pt:sec-diagonal-lemma}

::: theorem 一般化された対角化定理 {#pt:generalized-diagonal-lemma keywords="generalized diagonal lemma, simultaneous fixed points" index="対角化定理|たいかくかていり"}
$y_{0},\dots,y_{n}$ と $\vec{z}=(z_{1},\dots,z_{m})$ を互いに異なる変数とし、$P_{0},\dots,P_{n}$ を自由変数が $y_{0},\dots,y_{n},\vec{z}$ の中にある論理式とする。このとき、自由変数が $\vec{z}$ の中にある論理式 $S_{0},\dots,S_{n}$ で、各 $i\le n$ について
$$
\PA\vdash S_{i}\leftrightarrow P_{i}(\Godel{S_{0}},\dots,\Godel{S_{n}},\vec{z})
$$
となるものが存在する（右辺は $y_{j}$ に数項 $\underline{\Godel{S_{j}}}$ を代入したもの）。$P_{i}$ がすべて Σ（すべて Δ）なら、$S_{i}$ もすべて Σ（すべて Δ）にとれる。
:::

::: intuition
どんな性質の組を与えても、「私たちのコードの組はこの性質を満たす」と互いに主張し合う論理式の組を作れる。主張は $\PA$ で証明できる同値として成り立つ。
:::

::: proof
$\vec{z}$ と $y_{0},\dots,y_{n}$ のどれとも異なる変数 $x_{0},\dots,x_{n}$ をとる。

**Step 1（代入関数）.** 【主張：コード $w$ の論理式の $x_{0},\dots,x_{n}$ に数項 $\underline{a_{0}},\dots,\underline{a_{n}}$ を代入した結果のコードを与える Σ 関数 $\mathrm{su}$ がある】 Σ 関数
$$
\mathrm{su}(w,a_{0},\dots,a_{n})\defeq\mathrm{sub}(\cdots\mathrm{sub}(w,\Godel{x_{0}},\mathrm{num}(a_{0}))\cdots,\Godel{x_{n}},\mathrm{num}(a_{n}))
$$
を考える。これは \ref{pt:syntax-predicates} の Σ 関数の合成なので Σ 関数であり、標準構造では代入の結果のコードを与える（\ref{pt:syntax-correct}）。

**Step 2（文の構成）.** 【主張：論理式 $S_{i}$ の自由変数は $\vec{z}$ の中にあり、$S_{i}$ は $P_{i}(\mathrm{su}(\underline{k_{0}},\underline{k_{0}},\dots,\underline{k_{n}}),\dots,\vec{z})$ を展開したものである】 各 $i$ について論理式
$$
D_{i}(x_{0},\dots,x_{n},\vec{z})\defeq P_{i}\bigl(\mathrm{su}(x_{0},x_{0},\dots,x_{n}),\dots,\mathrm{su}(x_{n},x_{0},\dots,x_{n}),\vec{z}\bigr)
$$
を考え（関数的な論理式による略記を展開したもの。導入する束縛変数は新しいものをとる）、$k_{i}\defeq\Godel{D_{i}}$ とおく。さらに $S_{i}\defeq D_{i}[\underline{k_{0}}/x_{0}]\cdots[\underline{k_{n}}/x_{n}]$ とおく。数項は閉項なので代入可能であり、$D_{i}$ の自由変数は $x_{0},\dots,x_{n},\vec{z}$ の中にあるので、$S_{i}$ の自由変数は $\vec{z}$ の中にある。$x_{j}$ は $\vec{z}$ と異なるので、代入は $\mathrm{su}$ の引数の $x_{j}$ だけを $\underline{k_{j}}$ に替える。

**Step 3（鍵となる等式）.** 【主張：各 $j$ について $\PA\vdash\mathrm{su}(\underline{k_{j}},\underline{k_{0}},\dots,\underline{k_{n}})=\underline{\Godel{S_{j}}}$】 標準構造で $\mathrm{su}(k_{j},k_{0},\dots,k_{n})$ は、$D_{j}$ の $x_{0},\dots,x_{n}$ に $\underline{k_{0}},\dots,\underline{k_{n}}$ を代入した論理式、すなわち $S_{j}$ のコードである（\ref{pt:syntax-correct}）。よって Σ 文 $\mathrm{su}(\underline{k_{j}},\underline{k_{0}},\dots,\underline{k_{n}})=\underline{\Godel{S_{j}}}$ は真で、Σ 完全性（\ref{pt:sigma-completeness}）より $\PA$ で証明できる。

**Step 4（結論）.** 【主張：$\PA\vdash S_{i}\leftrightarrow P_{i}(\Godel{S_{0}},\dots,\Godel{S_{n}},\vec{z})$】 $\PA$ の任意のモデル $\mathcal{M}$ と割り当てをとる。Step 3 の値の等式により、$S_{i}$ が成り立つことと $P_{i}(\Godel{S_{0}},\dots,\Godel{S_{n}},\vec{z})$ が成り立つことは同値である（関数的な論理式の略記の意味と、意味論的代入補題）。完全性定理より結論を得る。

**Step 5（複雑さ）.** 【主張：$P_{i}$ が Σ（Δ）なら $S_{i}$ も Σ（Δ）である】 $S_{i}$ は $P_{i}$ の $y_{j}$ に Σ 関数の値を入れたものなので、$P_{i}$ が Σ（Δ）なら Σ（Δ）である（\ref{pt:page-sequence-coding} の記法の確認）。

::: hypcheck
- **Σ 完全性**：Step 3 の、$\mathrm{su}$ の具体的な値の等式を $\PA$ で証明するのに使う。$\mathrm{su}$ が Σ 関数であることが必要である。
- **$x_{i}$ が $\vec{z}$, $y_{j}$ と異なること**：Step 2 で代入しても $\vec{z}$ が影響を受けず、$P_{i}$ の構造が保たれるため。
- 帰納法の公理は Step 3 の Σ 完全性と、$\mathrm{su}$ が関数的であることの証明（有限列の理論）を通じてだけ使っている。
:::
:::

::: corollary 対角化定理 {#pt:diagonal-lemma keywords="diagonal lemma, fixed point lemma" refname="対角化定理"}
自由変数が $y$ だけの論理式 $P(y)$ に対し、$\PA\vdash S\leftrightarrow P(\Godel{S})$ となる文 $S$ が存在する。
:::

::: intuition
嘘つきのパラドックス「この文は偽である」の「この文」は、自然言語では指示語で作れるが、算術の言語には指示語がない。対角化定理は、$\mathrm{sub}$ と $\mathrm{num}$ を使って「自分自身の記述を自分に代入した結果」について語る論理式を作ることで、指示語の代わりを果たす。「“に自分の引用を代入したものは $P$ である”に自分の引用を代入したものは $P$ である」（クワインの構成）がその自然言語版である。
:::

::: proof
一般化された対角化定理で $n=0$, $m=0$ とする。
:::

## 第一不完全性定理 {#pt:sec-first-incompleteness}

::: definition ゲーデル文 {#pt:godel-sentence keywords="Gödel sentence" index="ゲーデル文|げーでるぶん"}
対角化定理で $P(y)\defeq\neg\mathrm{Bew}(y)$ とした文 $G$、すなわち $\PA\vdash G\leftrightarrow\neg\mathrm{Bew}(\Godel{G})$ となる文を**ゲーデル文**という。
:::

::: intuition
「この文は $\PA$ で証明できない」と自分について主張する文である。
:::

::: definition ω 無矛盾 {#pt:omega-consistent keywords="omega-consistency" index="ω 無矛盾|おめがむむじゅん"}
$\PA$ を含む理論 $T$ が **ω 無矛盾**であるとは、どんな論理式 $\varphi(x)$ についても、「すべての $n$ で $T\vdash\neg\varphi(\underline{n})$」かつ「$T\vdash\exists x\,\varphi(x)$」とはならないことをいう。ω 無矛盾なら無矛盾である（矛盾する理論はすべての文を証明するので、たとえば $\varphi(x)\defeq(x=x)$ について両方が起こる）。$\mathcal{N}\models T$ なら $T$ は ω 無矛盾である（$T\vdash\exists x\,\varphi(x)$ なら健全性定理より $\mathcal{N}\models\exists x\,\varphi(x)$ なので、ある $n$ で $\mathcal{N}\models\varphi(\underline{n})$ となり、同じく健全性定理から $T\vdash\neg\varphi(\underline{n})$ ではありえない）。
:::

::: intuition
「$0$ は $\varphi$ を満たさない」「$1$ は満たさない」…とすべての数について証明しておきながら、「$\varphi$ を満たす数がある」とも証明する、ということが起こらない理論である。標準構造で正しい理論はそうなっている。
:::

::: theorem ゲーデルの第一不完全性定理 {#pt:godel-first keywords="Gödel's first incompleteness theorem" index="第一不完全性定理|だいいちふかんぜんせいていり, ゲーデルの不完全性定理|げーでるのふかんぜんせいていり" refname="ゲーデルの第一不完全性定理"}
$G$ をゲーデル文とする。
1. $\PA$ が無矛盾ならば、$\PA\nvdash G$。
2. $\PA$ が ω 無矛盾ならば、$\PA\nvdash\neg G$。

とくに $\mathcal{N}\models\PA$ なので、$G$ は $\PA$ で決定できず、$G$ は（標準構造で）真である。
:::

::: intuition
ペアノ算術には、証明も反証もできない文がある。「自分は証明できない」と主張するゲーデル文がその例で、それは実際に正しい。
:::

::: proof
**Step 1.** 【主張：$\PA\vdash G$ なら $\PA$ は矛盾する（よって 1 が成り立つ）】 $\PA\vdash G$ とする。D1（\ref{pt:d1}）より $\PA\vdash\mathrm{Bew}(\Godel{G})$ である。一方、$G$ の性質から $\PA\vdash\neg\mathrm{Bew}(\Godel{G})$ である。よって $\PA$ は矛盾する。

**Step 2.** 【主張：$\PA$ が ω 無矛盾なら $\PA\nvdash\neg G$】 $\PA$ が ω 無矛盾で $\PA\vdash\neg G$ と仮定する。$\PA$ は無矛盾なので、1 より $\PA\nvdash G$ である。よって \ref{pt:bew-correct} より、どの $n$ についても $\mathcal{N}\models\neg\mathrm{Pf}(\underline{n},\Godel{G})$ である。$\mathrm{Pf}$ は Δ 論理式なので（\ref{pt:bew-sigma}）、$\neg\mathrm{Pf}(\underline{n},\Godel{G})$ は真な Σ 文であり、Σ 完全性よりすべての $n$ について $\PA\vdash\neg\mathrm{Pf}(\underline{n},\Godel{G})$ となる。一方、$\PA\vdash\neg G$ と $G$ の性質から $\PA\vdash\mathrm{Bew}(\Godel{G})$、すなわち $\PA\vdash\exists y\,\mathrm{Pf}(y,\Godel{G})$ である。これは $\varphi(y)\defeq\mathrm{Pf}(y,\Godel{G})$ について ω 無矛盾性に反する。

**Step 3.** 【主張：$\mathcal{N}\models\PA$ なら $\mathcal{N}\models G$】 $\mathcal{N}\models\PA$ なので $\PA$ は ω 無矛盾であり、1・2 より $G$ は決定できない。1 より $\PA\nvdash G$ なので、\ref{pt:bew-correct} より $\mathcal{N}\models\neg\mathrm{Bew}(\Godel{G})$ である。$\mathcal{N}\models\PA$ なので $\mathcal{N}\models G\leftrightarrow\neg\mathrm{Bew}(\Godel{G})$ であり、よって $\mathcal{N}\models G$ を得る。

::: hypcheck
- **無矛盾性**：Step 1 は背理法の形で、$\PA$ が矛盾するという結論を導く。仮定を外すと、矛盾した理論はすべてを証明するので主張は偽になる。
- **ω 無矛盾性**：Step 2。2 の仮定を無矛盾性に弱めた主張「公理が Δ で定義できる $\PA$ の拡大 $T$ が無矛盾なら、$T$ は自分のゲーデル文 $G_{T}$ の否定を証明しない」は偽である。たとえば $T\defeq\PA+\neg\mathrm{Con}$（$\mathrm{Con}$ は $\PA$ の無矛盾性を表す文）は、$\PA$ が無矛盾なら第二不完全性定理により無矛盾だが、$T\vdash\neg\mathrm{Con}_{T}$ であり、$T\vdash G_{T}\leftrightarrow\mathrm{Con}_{T}$ なので $T\vdash\neg G_{T}$ となる（\see{pt:page-second-incompleteness-lob}）。無矛盾性だけで決定できない文を作るのがロッサーの定理（\see{pt:page-rosser-tarski}）である。なお、$\PA+\neg G$ は無矛盾だが ω 無矛盾でない（問題 \ref{pt:prob-pa-plus-notg}）。
- **D1**：Step 1。D1 は Σ 完全性から得られた（\ref{pt:d1}）。
:::
:::

::: remark 拡張についての注意 {#pt:first-incompleteness-extensions}
証明で使ったのは次のことだけである。
- (a) 公理の集合が Δ 論理式 $\mathrm{Ax}_{T}$ で定義でき、標準構造で $\mathrm{Ax}_{T}$ が $T$ の公理のコードの集合をちょうど定めること（\ref{pt:bew-correct} を $T$ について使うため）。
- (b) $T$ が $\PA$ を含むこと（Σ 完全性と対角化定理を使うため）。

したがって、$\mathrm{Ax}_{\PA}$ を $\mathrm{Ax}_{T}$ に置き換えて $\mathrm{Pf}_{T}$, $\mathrm{Bew}_{T}$ と $T$ のゲーデル文 $G_{T}$ を作り直せば、公理が Δ 論理式で定義できる $\PA$ の任意の拡大 $T$ について、1（$T$ が無矛盾なら）と 2（$T$ が ω 無矛盾なら）が成り立つ。「$G_{T}$ は真である」の部分には $\mathcal{N}\models T$ が要る。たとえば $\PA$ に有限個の文を加えた理論の公理の集合は Δ で定義できる。$\PA+G$ の公理の集合も $\mathrm{Ax}_{\PA}(x)\vee x=\underline{\Godel{G}}$ で定義でき、$\mathcal{N}\models\PA+G$ なので、$\PA+G$ は自分のゲーデル文 $G_{\PA+G}$ を決定できない（$G$ 自体は $\PA+G$ で証明できるので、決定できない文は $G$ とは別の文である）。こうして、$\PA$ を ω 無矛盾性を保ったまま拡大しても、公理の集合が Δ である限り完全にはならない（無矛盾性だけを仮定してもよいことは \see{pt:godel-rosser}）。計算可能な集合が Δ 論理式で定義できること（\see{comp:page-representability}）と合わせると、これを「計算可能な公理化をもつ算術の理論は完全にならない」と言い換えられる。
:::

::: remark ゲーデル文の形
$G$ は $\neg\mathrm{Bew}(\Godel{G})$ と同値で、$\mathrm{Bew}$ は Σ なので、$G$ は Π 文（Σ 文の否定）と同値である。Σ 完全性（\ref{pt:sigma-completeness}）により真な Σ 文はすべて証明できるので、真だが証明できない文は（$\PA$ で）Σ 文と同値にはなりえない。$G$ は、その次に単純な Π の形で、真だが証明できない文がすでに現れることを示している（真な Π 文の多くは証明できるので、Π であることが証明できない理由なのではない）。
:::

## 問題 {#pt:sec-diag-problems}

::: problem {#pt:prob-godel-sentence-unique}
ゲーデル文は一つとは限らない（対角化の構成に依存する）。$G_{1},G_{2}$ がともに $\PA\vdash G_{i}\leftrightarrow\neg\mathrm{Bew}(\Godel{G_{i}})$ を満たすとき、両者はともに真であることを示せ（$\PA\vdash G_{1}\leftrightarrow G_{2}$ も成り立つが、それには第二不完全性定理の議論が要る）。
:::

::: solution
第一不完全性定理の Step 1, 3 は $G$ の構成によらず、性質 $\PA\vdash G\leftrightarrow\neg\mathrm{Bew}(\Godel{G})$ だけを使っている。よって $\mathcal{N}\models\PA$ から、$G_{1},G_{2}$ はともに証明できず真である。（後で、どちらも $\neg\mathrm{Bew}(\Godel{\bot})$ と $\PA$ で同値であることがわかる：\see{pt:formalized-first} の証明は $G$ の性質 $\PA\vdash G\leftrightarrow\neg\mathrm{Bew}(\Godel{G})$ と D1–D3 だけを使うので、$G_{1},G_{2}$ のどちらにも当てはまる。\see{logic:gl-four-fixed-points.1} の算術版である。）
:::

::: problem {#pt:prob-henkin-sentence}
$\PA\vdash H\leftrightarrow\mathrm{Bew}(\Godel{H})$ となる文 $H$（ヘンキン文）の存在を示せ。$H$ が証明できるかどうかは、D1–D3 と対角化定理だけからは直ちにわからない。この問いに答えるのがレーブの定理である。
:::

::: solution
対角化定理で $P(y)\defeq\mathrm{Bew}(y)$ とすれば、$\PA\vdash H\leftrightarrow\mathrm{Bew}(\Godel{H})$ となる $H$ が得られる。（問いの後半の答えは後のページで分かる：レーブの定理（\see{pt:page-second-incompleteness-lob}）により $\PA\vdash\mathrm{Bew}(\Godel{H})\to H$ から $\PA\vdash H$ が従うので、$H$ は証明できる。）
:::

::: problem {#pt:prob-pa-plus-notg}
$\PA$ が無矛盾なら $\PA+\neg G$ も無矛盾であることを示し、$\PA+\neg G$ は ω 無矛盾でないことを確かめよ。
:::

::: solution
$\PA+\neg G$ が矛盾するなら、演繹定理と RAA により $\PA\vdash G$ となり、第一不完全性定理の 1 に反する。よって $\PA+\neg G$ は無矛盾である。$G$ の性質から $\PA+\neg G\vdash\exists y\,\mathrm{Pf}(y,\Godel{G})$ である。一方、$\PA\nvdash G$ なので、すべての $n$ で $\PA\vdash\neg\mathrm{Pf}(\underline{n},\Godel{G})$ となり（定理の Step 2 と同じ議論）、これらは $\PA+\neg G$ でも証明できる。よって $\PA+\neg G$ は ω 無矛盾でない。$\PA+\neg G$ のモデルは超準モデルで、そこでは $G$ の「証明」にあたる超準的な元がある。
:::

::: supplement
**高い視点から：対角線論法と不動点.** 対角化定理は、カントールの対角線論法（\ref{set:page-cantor}）と同じ構造をもつ。圏論的には、両者は \ref{cat:lawvere-fixed-point}の例として統一される：「$A$ から $Y^{A}$（$A$ 上の $Y$ に値をとる性質の空間）への“点ごとに全射な”写像があれば、$Y$ の任意の自己写像は不動点をもつ」。カントールの定理は、$Y=2$ の否定 $\neg\colon 2\to2$ が不動点をもたないことから、$A\to2^{A}$ が全射になりえないことを導く（不動点定理の対偶の使い方）。算術では類比として、$A$ は 1 変数の論理式（のコード）、「論理式 $D(x)$ にコードを代入する」操作 $\mathrm{sub}$ が点全射の役を果たし、$Y$ の自己写像の役を $P$ を施す操作が果たして、不動点が対角化定理の文 $S$ にあたる（同値は $\PA$ での証明可能な同値であり、厳密に同じ圏の議論ではない）。ここでは不動点が実際に存在し、$P=\neg T$ と置けば「真理は定義できない」（\see{pt:tarski-undefinability}）、$P=\neg\mathrm{Bew}$ と置けばゲーデル文が得られる。
:::
