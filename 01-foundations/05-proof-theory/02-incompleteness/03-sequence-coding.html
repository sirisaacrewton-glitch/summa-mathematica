# 有限列のコード化 {#pt:page-sequence-coding keywords="pairing function, coding of finite sequences, concatenation, exponentiation, primitive recursive functions, Sigma definable functions"}

\ref{pt:beta-lemma}を使って、$\PA$ の中に「\term[順序対]{pt:pairing}」と「有限列」の理論を作る。有限列は、その長さと各項で決まる（**有限列の法則**）ように、各列に**一つだけ**の\term[コード]{pt:finseq}を割り当てる。これにより、列の延長・切り出し・連結を $\PA$ の中で扱えるようになり、指数関数やすべての原始再帰関数が Σ 論理式で定義され、その再帰の等式が $\PA$ で証明できることがわかる。次のページで、項・論理式・証明をこの列として $\PA$ の中で表す。

## 記法と定義の確認 {#pt:sec-coding-notation}

::: notation
- $\PA$ の基本定理、Σ・Δ 論理式は \ref{pt:page-peano-arithmetic}、$\PA$ で関数的な論理式、$x\dot{-}y$、$\mathrm{rm}$、β 関数 $\beta(a,b,i)$ とその補題は \ref{pt:page-beta-function} のとおり。前ページと同じく、$\mathcal{M}$ は $\PA$ の任意のモデルで、その中で示した主張は完全性定理により $\PA$ の定理である。
- 関数的な論理式 $F(\vec{x},y)$ が Σ 論理式のとき、それが定める関数を **Σ 関数**と呼ぶ。Σ 関数を定める論理式は Δ 論理式である（\ref{pt:functional-formula}）。Σ 関数 $f$ と Σ 論理式 $\varphi(y)$ について $\varphi(f(\vec{x}))$ は Σ 論理式であり、$\varphi$ が Δ なら Δ である（$\varphi(f(\vec{x}))$ は $\forall y\,(F\to\varphi)$ とも同値なので）。有界量化 $\forall i<f(\vec{x})\,\varphi$ も $\exists y\,(F(\vec{x},y)\wedge\forall i<y\,\varphi)$ として同様に扱う。
:::

## 順序対 {#pt:sec-pairing}

::: definition 対関数 {#pt:pairing keywords="pairing function, Shoenfield pairing" index="対関数|ついかんすう"}
$(x,y)\defeq2\cdot\bigl((x+y)\cdot(x+y)+x+1\bigr)$ とおく（$2\defeq\underline{2}$）。これは項で書けるので Σ 関数である。
:::

::: proposition 対関数の性質 {#pt:pairing-basic}
$\mathcal{M}$ の数について次が成り立つ。
1. $(x,y)=(x',y')$ ならば $x=x'$ かつ $y=y'$。
2. $x<(x,y)$ かつ $y<(x,y)$。また $2\le(x,y)$。
3. $x<x'$ なら $(x,y)<(x',y)$、$y<y'$ なら $(x,y)<(x,y')$。
:::

::: proof
$n\defeq x+y$, $n'\defeq x'+y'$、$A\defeq n\cdot n+x+1$, $A'\defeq n'\cdot n'+x'+1$ とおく。$2A=2A'$ なら $A=A'$（$A<A'$ なら $2A<2A'$ で、逆も同様）。

**1.** $n<n'$ とすると、$n'\ge n+1$ で $A\le n\cdot n+n+1\le(n+1)\cdot(n+1)\le n'\cdot n'<A'$ となり $A=A'$ に反する（途中で $(n+1)(n+1)=n\cdot n+2n+1$ を使う）。$n'<n$ も同様。よって $n=n'$ である。すると $A=A'$ から加法の簡約により $x=x'$ となり、$x+y=x'+y'$ から同様に $y=y'$ を得る。

**2.** $A\ge1$ なので $(x,y)=2A\ge2$ であり、$x<n\cdot n+x+1=A\le2A$ から $x<(x,y)$ である。$y$ については、$n=0$ なら $y=0<2\le(x,y)$ である。$n\ge1$ なら $n\le n\cdot n$ なので $y\le n<A\le(x,y)$ である。

**3.** 前半：$x<x'$ とすると $x'\dot{-}x\ge1$ なので $n<n+(x'\dot{-}x)=x'+y$ である。一般に $a<b$ なら $0<b$ なので $a\cdot a\le a\cdot b<b\cdot b$ であるから、$n\cdot n<(x'+y)\cdot(x'+y)$ となる。これと $x+1<x'+1$ を足し合わせて $A<A'$、ゆえに $(x,y)<(x',y)$ である。後半：$y<y'$ なら $n<x+y'$ であり、同様に $n\cdot n+x+1<(x+y')\cdot(x+y')+x+1$ から $(x,y)<(x,y')$ である。
:::

::: definition 対の成分 {#pt:pair-components}
$\mathrm{Fst}(z,w)\defeq\exists y<z\,((w,y)=z)\vee(\neg\exists x<z\,\exists y<z\,((x,y)=z)\wedge w=0)$、$\mathrm{Snd}(z,w)$ を同様に定める。\ref{pt:pairing-basic.1}, \ref[2]{pt:pairing-basic.2} より $\PA$ で関数的で、有界な論理式なので Σ 関数を定める。定める関数を $\mathrm{fst}(z)$, $\mathrm{snd}(z)$ と書く。$\mathrm{fst}((x,y))=x$, $\mathrm{snd}((x,y))=y$ であり、$z$ が対の値でなければ両者は $0$ である。
:::

## 有限列 {#pt:sec-finite-sequences}

::: definition 有限列のコード {#pt:finseq keywords="finite sequence code, length, value" index="有限列のコード|ゆうげんれつのこーど"}
$\mathrm{FinSeq}(s)$ を次の論理式とする。
$$
\begin{aligned}
\exists a<s\,\exists b<s\,\exists k<s\,\Bigl(&s=((a,b),k)\wedge\forall c<s\,\forall d<s\\
&\bigl((c,d)<(a,b)\to\exists i<k\,\beta(c,d,i)\neq\beta(a,b,i)\bigr)\Bigr).
\end{aligned}
$$
$\mathrm{FinSeq}(s)$ のとき $s$ を**有限列**と呼ぶ。$\mathrm{lh}(s)\defeq\mathrm{snd}(s)$（**長さ**）、$s_{i}\defeq\beta(\mathrm{fst}(\mathrm{fst}(s)),\mathrm{snd}(\mathrm{fst}(s)),i)$（**第 $i$ 項**）と定める。$\mathrm{FinSeq}$ は Δ 論理式、$\mathrm{lh}$ と $(s,i)\mapsto s_{i}$ は Σ 関数である。
:::

::: intuition
組 $(a,b)$ は β 関数を通じて無限列 $\beta(a,b,0),\beta(a,b,1),\dots$ を表し、長さ $k$ を付けて $((a,b),k)$ とすると長さ $k$ の列を表す。同じ列を表す組はたくさんあるので、そのうち $(a,b)$ の値が**最小**のものだけを正式な\term[コード]{pt:finseq}とする。これが $\mathrm{FinSeq}$ の後半の条件で、「$(a,b)$ より値の小さい組 $(c,d)$ は、最初の $k$ 項のどこかで違う列を表す」と言っている。量化子の上限 $s$ は \ref{pt:pairing-basic.2} により制限にならない。
:::

::: theorem 有限列の法則 {#pt:finseq-law keywords="law of finite sequences"}
$\mathcal{M}$ で、$s,s'$ が有限列で $\mathrm{lh}(s)=\mathrm{lh}(s')$ かつすべての $i<\mathrm{lh}(s)$ で $s_{i}=s'_{i}$ ならば、$s=s'$。
:::

::: proof
$s=((a,b),k)$, $s'=((a',b'),k)$ とする（長さが等しい）。$(a,b)<(a',b')$ とすると、$s'$ の条件（$c=a$, $d=b$。$a,b<(a,b)<(a',b')<s'$）から、ある $i<k$ で $\beta(a,b,i)\neq\beta(a',b',i)$、すなわち $s_{i}\neq s'_{i}$ となり仮定に反する。$(a',b')<(a,b)$ も同様に仮定に反するので、三分律（\ref{pt:pa-order.5}）から $(a,b)=(a',b')$ であり、よって $s=s'$ である。
:::

::: lemma 正規化 {#pt:finseq-normalize}
$\mathcal{M}$ の任意の数 $a,b,k$ について、$\mathrm{lh}(s)=k$ かつすべての $i<k$ で $s_{i}=\beta(a,b,i)$ となる有限列 $s$ がある。
:::

::: proof
$P\defeq\{p:\exists c<p\,\exists d<p\,(p=(c,d)\wedge\forall i<k\,\beta(c,d,i)=\beta(a,b,i))\}$ は $(a,b)$ を含む（\ref{pt:pairing-basic.2} より $a,b<(a,b)$）ので、最小元の原理（\ref{pt:pa-strong-induction.2}）により最小元 $p_{0}=(c_{0},d_{0})$ がある。$s\defeq(p_{0},k)$ とおく。\ref{pt:pairing-basic.2} より $c_{0},d_{0}<p_{0}<s$、$k<s$ である。$(c,d)<p_{0}$ なら $c,d<(c,d)$ なので、$(c,d)\notin P$ は「ある $i<k$ で $\beta(c,d,i)\neq\beta(a,b,i)=\beta(c_{0},d_{0},i)$」を意味する。よって $\mathrm{FinSeq}(s)$ が成り立ち、$\mathrm{lh}(s)=k$、$s_{i}=\beta(c_{0},d_{0},i)=\beta(a,b,i)$（$i<k$）である。
:::

::: theorem 定義可能な関数の列 {#pt:finseq-exists keywords="sequences of definable functions"}
$h(i)$ を $\PA$ で関数的な論理式（パラメータ付き）が定める関数とする。$\mathcal{M}$ の任意の数 $k$ について、$\mathrm{lh}(s)=k$ かつすべての $i<k$ で $s_{i}=h(i)$ となる有限列 $s$ が**ただ一つ**ある。とくに、長さ $0$ の有限列 $[\,]$ がただ一つある。
:::

::: proof
存在は \ref{pt:beta-lemma}と正規化、一意性は有限列の法則による。
:::

::: definition 列の操作 {#pt:sequence-operations keywords="concatenation, truncation, singleton sequence" index="連結（列の）|れんけつれつの"}
\ref{pt:finseq-exists} により、次の論理式はそれぞれ $\PA$ で関数的で、Σ 関数を定める。
- **連結** $s\ast s'$：$\mathrm{FinSeq}(u)\wedge\mathrm{lh}(u)=\mathrm{lh}(s)+\mathrm{lh}(s')\wedge\forall i<\mathrm{lh}(s)\,u_{i}=s_{i}\wedge\forall i<\mathrm{lh}(s')\,u_{\mathrm{lh}(s)+i}=s'_{i}$（$u$ が値）。
- **一項の列** $[n]$：$\mathrm{FinSeq}(u)\wedge\mathrm{lh}(u)=1\wedge u_{0}=n$。
- **切り出し** $s\restr{[e,j)}$（$e\le j\le\mathrm{lh}(s)$ のとき $s_{e},\dots,s_{j-1}$、それ以外は $[\,]$）。

存在は、$h(i)\defeq s_{i}$（$i<\mathrm{lh}(s)$）, $s'_{i\dot{-}\mathrm{lh}(s)}$（それ以外）などの関数的な論理式に \ref{pt:finseq-exists} を使えばよい。$s$ が有限列でなくても $\mathrm{lh}(s)$ と $s_{i}$ は定義されているので、連結はすべての $s,s'$ について定まる。
:::

::: proposition 連結の性質 {#pt:concat-basic}
$\mathcal{M}$ で、有限列 $s,s',s''$ について $[\,]\ast s=s=s\ast[\,]$、$(s\ast s')\ast s''=s\ast(s'\ast s'')$。
:::

::: proof
連結の値は有限列なので、どの等式も両辺は有限列であり、有限列の法則（\ref{pt:finseq-law}）により長さと各項が等しいことを示せばよい。$\ell\defeq\mathrm{lh}(s)$, $\ell'\defeq\mathrm{lh}(s')$, $\ell''\defeq\mathrm{lh}(s'')$ とおく。
- $[\,]\ast s$ の長さは $0+\ell=\ell$ であり、$i<\ell$ なら定義の後半から第 $0+i=i$ 項は $s_{i}$ である。$s\ast[\,]$ の長さは $\ell+0=\ell$ であり、$i<\ell$ なら定義の前半から第 $i$ 項は $s_{i}$ である。
- 結合律：長さはどちらも $\ell+\ell'+\ell''$ である（加法の結合律）。第 $i$ 項を比べる。$i<\ell$ の場合、$i<\ell+\ell'$ なので左辺の第 $i$ 項は $(s\ast s')_{i}=s_{i}$ であり、右辺の第 $i$ 項も $s_{i}$ である。$\ell\le i<\ell+\ell'$ の場合、$i=\ell+j$（$j<\ell'$）と書け（\ref{pt:pa-order.6}）、両辺の第 $i$ 項はどちらも $s'_{j}$ である。$\ell+\ell'\le i$ の場合、$i=\ell+\ell'+j$（$j<\ell''$）と書け、左辺の第 $i$ 項は $s''_{j}$、右辺の第 $i$ 項は $(s'\ast s'')_{\ell'+j}=s''_{j}$ である。
:::

## 指数関数と原始再帰関数 {#pt:sec-primitive-recursion}

::: theorem 再帰で定義される関数 {#pt:sigma-recursion keywords="primitive recursion in PA, Sigma pterm closure" index="原始再帰関数|げんしさいきかんすう"}
$f(\vec{x})$ と $g(\vec{x},w,z)$ を Σ 関数とする。
$$
\begin{aligned}
H(\vec{x},w,y)\defeq\exists s\,\bigl(&\mathrm{FinSeq}(s)\wedge\mathrm{lh}(s)=S(w)\wedge s_{0}=f(\vec{x})\\
&\wedge\forall j<w\,s_{j+1}=g(\vec{x},j,s_{j})\wedge s_{w}=y\bigr)
\end{aligned}
$$
は $\PA$ で関数的な Σ 論理式であり、定める関数 $h$ について $\PA$ で
$$
h(\vec{x},0)=f(\vec{x}),\qquad h(\vec{x},w+1)=g(\vec{x},w,h(\vec{x},w))
$$
が成り立つ。また、Σ 関数の合成は Σ 関数である。
:::

::: proof
$\vec{x},w$ に対し、$H$ の $\exists s$ の中から最後の連言肢 $s_{w}=y$ を除いた条件を $\mathrm{Rec}(\vec{x},w,s)$ と書く（$s$ が長さ $w+1$ の「$f,g$ による計算の記録」であること）。以下 $\mathcal{M}$ で示す。

**Step 1.** 【主張：$H$ は Σ 論理式である】 $\mathrm{Rec}$ と $s_{w}=y$ は、Δ 論理式 $\mathrm{FinSeq}(s)$ と、Σ 関数の値どうしの等式を、有界量化 $\forall j<w$ と連言で組み合わせたものなので、記法の約束と \ref{pt:sigma-closure} から Σ 論理式である。先頭に $\exists s$ を付けても Σ 論理式である。

**Step 2（存在）.** 【主張：各 $\vec{x},w$ について $\mathrm{Rec}(\vec{x},w,s)$ となる $s$ がある】 論理式 $\exists s\,\mathrm{Rec}(\vec{x},w,s)$ についての $w$ の帰納法で示す。$w=0$ の場合、長さ $1$ の列 $[f(\vec{x})]$ が条件を満たす（$\forall j<0$ は空である）。$w$ について $s$ がとれたとする。$i\le w$ なら $s_{i}$、$w<i$ なら $g(\vec{x},w,s_{w})$ を値とする関数（場合分けの論理式で $\PA$ で関数的に定まる）と長さ $w+2$ に \ref{pt:finseq-exists} を使い、有限列 $t$ をとる。$t_{0}=s_{0}=f(\vec{x})$ である。$j<w+1$ について、$j<w$ なら $t_{j+1}=s_{j+1}=g(\vec{x},j,s_{j})=g(\vec{x},j,t_{j})$ であり、$j=w$ なら $t_{w+1}=g(\vec{x},w,s_{w})=g(\vec{x},w,t_{w})$ である。ゆえに $\mathrm{Rec}(\vec{x},w+1,t)$ が成り立つ。

**Step 3（一意性）.** 【主張：$\mathrm{Rec}(\vec{x},w,s)$ かつ $\mathrm{Rec}(\vec{x},w,t)$ なら $s_{w}=t_{w}$ であり、$H$ は $\PA$ で関数的である】 論理式 $j\le w\to s_{j}=t_{j}$ についての $j$ の帰納法を使う。$j=0$ なら $s_{0}=f(\vec{x})=t_{0}$ である。$j+1\le w$ で $s_{j}=t_{j}$ なら、$g$ の値の一意性から $s_{j+1}=g(\vec{x},j,s_{j})=g(\vec{x},j,t_{j})=t_{j+1}$ である。$j=w$ とすると $s_{w}=t_{w}$ を得る。Step 2 と合わせて、各 $\vec{x},w$ について $H(\vec{x},w,y)$ となる $y$ はちょうど一つあり、$\mathcal{M}$ は任意なので $H$ は $\PA$ で関数的である。

**Step 4（等式）.** 【主張：$h(\vec{x},0)=f(\vec{x})$ かつ $h(\vec{x},w+1)=g(\vec{x},w,h(\vec{x},w))$】 $w=0$ の場合、$\mathrm{Rec}(\vec{x},0,s)$ なら $s_{0}=f(\vec{x})$ なので、$h(\vec{x},0)=f(\vec{x})$ である。$w+1$ の場合、$\mathrm{Rec}(\vec{x},w+1,s)$ となる $s$ をとり、$t\defeq s\restr{[0,w+1)}$ とおく。$t$ は長さ $w+1$ で $t_{j}=s_{j}$（$j\le w$）なので $\mathrm{Rec}(\vec{x},w,t)$ が成り立ち、$h(\vec{x},w)=t_{w}=s_{w}$ である。ゆえに $h(\vec{x},w+1)=s_{w+1}=g(\vec{x},w,s_{w})=g(\vec{x},w,h(\vec{x},w))$ である。

**Step 5（合成）.** 【主張：Σ 関数の合成は Σ 関数である】 $F(z_{1},\dots,z_{m},y)$ と $G_{j}(\vec{x},z)$ が Σ 関数を定めるとき、$\exists z_{1}\cdots\exists z_{m}\,(G_{1}(\vec{x},z_{1})\wedge\cdots\wedge G_{m}(\vec{x},z_{m})\wedge F(\vec{z},y))$ は Σ 論理式である。各 $G_{j}$ の関数性から $z_{j}$ は $\vec{x}$ に対してただ一つに決まり、$F$ の関数性から $y$ もただ一つに決まるので、この論理式は $\PA$ で関数的である。

::: hypcheck
- **$\PA$ の帰納法**：Step 2（論理式 $\exists s\,\mathrm{Rec}$）と Step 3（論理式 $j\le w\to s_{j}=t_{j}$）で使った。\ref{pt:finseq-exists} を通して β 関数の補題の帰納法も使っている。
- **$f,g$ が Σ 関数であること**：Σ であることは Step 1 だけで使った。$f,g$ が $\PA$ で関数的な論理式で定まるだけなら、Step 2〜4 はそのまま成り立ち、$H$ は $\PA$ で関数的で同じ等式を満たす（ただし Σ 論理式とは限らない）。
- **有限列の法則**：Step 2 の \ref{pt:finseq-exists} で使ったのは存在だけで、一意性（有限列の法則）は使っていない。$H$ の関数性は Step 3 の帰納法から来る。
:::
:::

::: corollary 原始再帰関数の定義可能性 {#pt:primitive-recursive-definable keywords="primitive recursive functions are Sigma definable"}
すべての原始再帰関数 $\phi\colon\N^{n}\to\N$ に対し、$\PA$ で関数的な Σ 論理式 $F_{\phi}(\vec{x},y)$ で、$\mathcal{N}\models F_{\phi}[\vec{m},\phi(\vec{m})]$（すべての $\vec{m}$）となるものがある。したがって $\PA\vdash F_{\phi}(\underline{\vec{m}},\underline{\phi(\vec{m})})$、および $\PA\vdash\forall y\,(F_{\phi}(\underline{\vec{m}},y)\to y=\underline{\phi(\vec{m})})$。
:::

::: proof
原始再帰関数の定義（零関数・後者関数・射影から合成と原始再帰で作られる）に関する帰納法。初期関数は $y=0$, $y=S(x_{1})$, $y=x_{i}$ で定める。合成と原始再帰は \ref{pt:sigma-recursion} による。帰納法の仮定から、材料の関数を定める論理式は $\mathcal{N}$ でそれらの関数のグラフを定義する。$\mathcal{N}\models\PA$ なので、作った論理式が $\mathcal{N}$ で定める関数 $h^{\mathcal{N}}$ は $\phi$ と同じ合成の式・再帰の等式を満たし、自然数の帰納法により $h^{\mathcal{N}}=\phi$ である。後半：$F_{\phi}(\underline{\vec{m}},\underline{\phi(\vec{m})})$ は $\mathcal{N}$ で真な Σ 文なので、Σ 完全性（\ref{pt:sigma-completeness}）から $\PA$ で証明できる。$F_{\phi}$ は $\PA$ で関数的なので、これと合わせて $\PA\vdash\forall y\,(F_{\phi}(\underline{\vec{m}},y)\to y=\underline{\phi(\vec{m})})$ である。
:::

::: example 指数関数 {#pt:exponentiation index="指数関数（PA）|しすうかんすうぴーえー"}
$f(x)\defeq1$、$g(x,w,z)\defeq z\cdot x$ として \ref{pt:sigma-recursion} を使うと、Σ 関数 $x^{w}$ が得られ、$\PA\vdash x^{0}=1\wedge x^{S(w)}=x^{w}\cdot x$。$\mathcal{L}_{\mathrm{ar}}$ の項 $t(x,w)$ が $\mathcal{N}$ で表す関数は、項に関する帰納法により $x,w$ の自然数係数の多項式である。$x=2$ を代入すると $w$ の多項式 $q(w)$ になり、$q$ の次数を $e$ とすると $2^{w}\ge\binom{w}{e+1}$ は $w^{e+1}$ の程度で増えるので、十分大きな $w$ で $2^{w}>q(w)$ となる。ゆえに指数関数を**項**で表すことはできないが、Σ 論理式でなら定義できる。
:::

::: remark
Σ 関数全体は原始再帰関数全体より広い。たとえばアッカーマン関数は原始再帰的でない（\see{comp:ackermann-not-pr}）が、二重の列を使えば Σ 論理式で定義でき、$\PA$ で関数的であることも示せる（Boolos 第 2 章に論理式が与えられている。$\PA$ で関数的であることの証明は本サイトでは確認していない）。

一方、$\PA$ で関数的な Σ 関数の全体には限りがある：全域的な計算可能関数 $f\colon\N\to\N$ で、$\PA$ で関数的などの Σ 関数 $h$ に対しても、十分大きなすべての $n$ で $f(n)>h(n)$ となるものがある。実際、$\PA$ の定理が計算可能に枚挙できること（\see{pt:page-arithmetization}）を認めれば、$\PA\vdash\forall x\,\exists!y\,F(x,y)$ となる狭義の Σ 論理式 $F(x,y)$ を $F_{0},F_{1},\dots$ と枚挙できる（Σ 論理式は狭義の Σ 論理式と $\PA$ で同値なので、これですべての Σ 関数を尽くす）。$\mathcal{N}\models\PA$ なので、各 $F_{j}$ は $\mathcal{N}$ で全域関数 $h_{j}$ を定める。$f(n)\defeq1+\max_{j\le n}h_{j}(n)$ とおく。$h_{j}(n)$ は、$\mathcal{N}\models F_{j}[n,y]$ となる $y$ を（狭義の Σ 論理式の真偽が半決定可能であること（\see{comp:sigma-semidecidable}）を使って）探せば求まるので、$f$ は計算可能である。$n\ge j$ なら $f(n)>h_{j}(n)$ である。とくに、$f$ のグラフを $\mathcal{N}$ で定義する狭義の Σ 論理式は、どれも $\PA$ で関数的と証明できない（できれば $f=h_{j}$ となる $j$ があり、$f(j)>h_{j}(j)$ に反する）。
:::

## 問題 {#pt:sec-coding-problems}

::: problem {#pt:prob-pair-values}
$\mathcal{N}$ で $(0,0)$, $(1,0)$, $(0,1)$, $(1,1)$ の値を求め、$(x,y)$ がつねに偶数であることを確かめよ。
:::

::: solution
$(x,y)=2((x+y)^{2}+x+1)$ より、$(0,0)=2$, $(1,0)=2(1+1+1)=6$, $(0,1)=2(1+0+1)=4$, $(1,1)=2(4+1+1)=12$。定義に因子 $2$ があるので偶数である。
:::

::: problem {#pt:prob-empty-sequence}
$[\,]=((0,0),0)$ であることを示せ。
:::

::: solution
$s\defeq((0,0),0)$ とする。$a=b=k=0$ とすると、\ref{pt:pairing-basic.2} より $a,b,k<s$ である。$(0,0)=2$ であり、\ref{pt:pairing-basic.2} より $(c,d)\ge2$ なので、$(c,d)<(0,0)$ となる $c,d$ は存在しない。ゆえに後半の条件は前件が偽で成り立ち、$\mathrm{FinSeq}(s)$ かつ $\mathrm{lh}(s)=0$ である。長さ $0$ の有限列は一意（\ref{pt:finseq-exists}）なので $[\,]=s$。
:::

::: problem {#pt:prob-factorial}
階乗 $x!$ を \ref{pt:sigma-recursion} で定義し、$\PA\vdash\forall x\,(0<x!)$ を示せ。
:::

::: solution
$f\defeq1$、$g(w,z)\defeq z\cdot S(w)$ とすると $0!=1$、$(w+1)!=w!\cdot(w+1)$ が $\PA$ で成り立つ。$\mathcal{M}$ で論理式 $0<w!$ についての $w$ の帰納法を使う。$w=0$ の場合、$0!=1$ で $0<1$ である。$0<w!$ なら $0<w!\cdot S(w)$ である（一般に $0<a$, $0<b$ なら $a=S(a')$ と書け、$a\cdot b=a'\cdot b+b\ge b>0$ となる）。よって $\PA\vdash\forall x\,(0<x!)$ である。
:::

::: supplement
**高い視点から：\term[コード]{pt:finseq}の一意性.** β 関数だけでも列を表せるが、同じ列に多くのコードがあると「列の等しさ」と「数の等しさ」が一致せず、列についての帰納法や再帰が扱いにくい。$\mathrm{FinSeq}$ は「同じ長さで同じ項をもつ」という同値関係の各同値類から最小の代表元を選ぶことで、有限列の集合を $\N$ の部分集合として**正確に**埋め込む。集合論で商集合から代表元を選ぶには一般に選択公理が要るのに対し、ここでは最小元の原理（論理式で定義できる空でない集合は最小元をもつこと。\ref{pt:pa-strong-induction.2}）が代表元を具体的に与える。その結果、$\mathcal{N}$ では有限列の全体が連結について自然数を文字とする自由モノイド（文字列全体）と同型になり、一般のモデル $\mathcal{M}$ でも \ref{pt:concat-basic} によりモノイドをなす。記号列・証明といった構文的対象はすべてこの中で扱える。
:::
