# 表現可能性定理 {#comp:page-representability keywords="representability theorem, Robinson arithmetic Q, primitive recursive arithmetic PRA, I Sigma_1, representable functions, numeralwise representable, Sigma_1 completeness of Q, Kleene's class of mu-recursive functions without primitive recursion, beta function, recursively enumerable sets are Sigma_1, Church's theorem"}

前のページまでで、原始再帰関数が $\PA$ の Σ 論理式で定義できることを見た（\ref{pt:primitive-recursive-definable}）。本ページでは、これを**すべての全域的な計算可能関数**に広げ、しかもそれが帰納法の公理をまったく含まない非常に弱い有限公理系 **$\mathsf{Q}$**（ロビンソン算術、\ref{pt:robinson-q}）ですでに成り立つことを示す（**表現可能性定理**、\tref{comp:representability}）：全域的な計算可能関数 $f$ のそれぞれに、狭義の Σ 論理式 $F(\vec{x},y)$ があって、すべての $\vec{m}$ について
$$
\mathsf{Q}\vdash\forall y\,\bigl(F(\underline{\vec{m}},y)\leftrightarrow y=\underline{f(\vec{m})}\bigr).
$$
証明は二段に分かれる。まず計算論の側で、全域的な計算可能関数は、和・積・大小の特性関数から**合成と（正則な）最小化だけで**作れることを示す（\ref{pt:kleene-class-computable}）。原始再帰は、ゲーデルの β 関数（\ref{pt:beta}）で最小化に置き換えられる。次に算術の側で、この二つの操作が $\mathsf{Q}$ での表現可能性を保つことを示す（\ref{comp:representability}）。ここで使う $\mathsf{Q}$ の性質は、数項の計算と、数項より小さい元が数項であること（\ref{pt:q-numerals}）と、数項との大小の三分律だけである。最後に、$\N$ で Σ 論理式によって定義できる関係がちょうど半決定可能な関係であること（\ref{comp:sigma-semidecidable}）を示す。原始再帰的算術 **$\mathsf{PRA}$** など、$\mathsf{Q}$ と $\PA$ の間の体系についても述べる（\ref{pt:weak-arithmetics}）。

## 記法と定義の確認 {#comp:sec-rep-notation}

::: notation
- 算術の言語 $\mathcal{L}_{\mathrm{ar}}=\{0,S,+,\cdot,<\}$、標準構造 $\mathcal{N}$、数項 $\underline{n}$、有界量化子、**狭義の Σ 論理式**（\ref{pt:sigma-formula.1}）、$\PA$ の公理 (S1)〜(O2) と帰納法の公理は \ref{pt:page-peano-arithmetic} のとおり。理論 $T$（文の集合）について $T\vdash\varphi$ は、完全性定理により「$T$ のすべてのモデルで $\varphi$ が成り立つ」ことと同値である。この方針で、以下の「$T\vdash$」はモデルの中の推論で示す。
- β 関数 $\beta(a,b,i)=\mathrm{rm}(a,1+(i+1)b)$ と β 関数の補題（\ref{pt:beta}, \tref{pt:beta-lemma}）を、標準構造 $\mathcal{N}$ で使う。
- 計算論の側：原始再帰関数（\ref{comp:primitive-recursive}）、部分再帰関数と最小化（\ref{comp:partial-recursive}）、クリーネの標準形（\ref{comp:normal-form}）、停止集合 $K$ とその決定不能性（\ref{comp:halting-L}）は \ref{comp:page-recursive-functions}, \ref{comp:page-universal-smn} のとおり。関係 $R\subseteq\N^{k}$ が**半決定可能**とは、ある計算可能な部分関数の定義域であることをいう。
- 関数 $g\colon\N^{k+1}\to\N$ の最小化 $\mu y\,[g(\vec{x},y)=0]$ が**正則**とは、$g$ が全域的で、すべての $\vec{x}$ に $g(\vec{x},y)=0$ となる $y$ があることをいう（このとき最小化の結果は全域的）。
:::

## 弱い算術 {#pt:sec-weak-arithmetic}

::: definition ロビンソン算術 Q {#pt:robinson-q keywords="Robinson arithmetic, Q, finitely axiomatized arithmetic without induction" index="ロビンソン算術|ろびんそんさんじゅつ, Q（ロビンソン算術）|きゅーろびんそんさんじゅつ"}
$\mathsf{Q}$ を、$\PA$ の公理のうち帰納法の公理を除いた (S1), (S2), (A1), (A2), (M1), (M2), (O1), (O2) の 8 個に、
$$
(\mathrm{O3})\quad\forall x\forall y\,(x<y\vee x=y\vee y<x)
$$
を加えた 9 個の文からなる理論とする。(O3) は $\PA$ の定理である（\ref{pt:pa-order.5}）ので、$\mathsf{Q}$ の定理はすべて $\PA$ の定理である。
:::

::: remark
文献でロビンソン算術と呼ばれる体系は、$<$ を言語に含めず $x\le y\defeq\exists z\,(z+x=y)$ と定義し、(O1)〜(O3) の代わりに「$0$ でない数は後者である」$\forall x\,(x=0\vee\exists y\,x=S(y))$ を公理とするものが多い。その体系では (O1)〜(O3) に当たる性質のうち、本ページで使う形（数項についてのもの）が定理として導けることが知られている。本サイトでは $<$ を記号にもつ言語に合わせて上の形をとった。$\mathsf{Q}$ は帰納法をもたないので非常に弱く、文献の形の $\mathsf{Q}$ は $\forall x\,(0+x=x)$ や $x+y=y+x$ を証明できない（それらが偽になるモデルがある）ことが知られている。本ページの形の $\mathsf{Q}$ でも同じである。実際、$\N$ に新しい 2 元 $a,b$ を加えた $M\defeq\N\cup\{a,b\}$ に、$\N$ の上では通常の後者・和・積・順序を与え、新しい元については次のように定める（$n\in\N$、$x\in M$ は任意）。
- 後者：$S(a)=a$, $S(b)=b$。
- 和：$a+n=a$, $b+n=b$, $x+a=b$, $x+b=a$。
- 積：$n\ge1$ なら $a\cdot n=b$, $b\cdot n=a$ とし、$a\cdot0=b\cdot0=0$。また $n\cdot a=n\cdot b=a$, $a\cdot a=a\cdot b=b$, $b\cdot a=b\cdot b=a$。
- 順序：$n<a$, $n<b$, $a<a$, $b<b$, $a<b$（$b<a$ や $a<n$ などは偽）。

(S1), (S2) は $S$ が $\N$ の上で単射で $0$ に値をとらず、$a,b$ を自分自身に移すことから成り立つ。(A1) は $y=0$ を見ればよい。(A2) は、$y\in\N$ なら $a+S(n)=a=S(a+n)$ などから、$y=a$ なら $x+S(a)=x+a=b=S(b)=S(x+a)$ から、$y=b$ も同様に成り立つ。(M1) は定義そのものである。(M2) $x\cdot S(y)=x\cdot y+x$ は、$y\in\N$ なら $a\cdot(n+1)=b=a\cdot n+a$（$n=0$ では $0+a=b$）などから成り立つ。$y\in\{a,b\}$ なら $S(y)=y$ なので $x\cdot y=x\cdot y+x$ を確かめればよく、$x=n$ なら $a+n=a$、$x=a$ なら $b+a=b$、$x=b$ なら $a+b=a$ から成り立つ。(O1) は $0$ より小さい元がないこと、(O2) は $y\in\N$ なら通常の順序と「$a,b$ はどの $n$ よりも小さくない」ことから、$y\in\{a,b\}$ なら $y<y$ が成り立つことから従う。(O3) は $a<b$ と $n<a$, $n<b$ から従う。このモデルで $0+a=b\neq a$ なので $\forall x\,(0+x=x)$ は偽であり、$a+0=a\neq b=0+a$ なので $x+y=y+x$ も偽である。$S(a)=a$, $S(b)=b$ なので「$0$ でない数は後者である」も成り立ち、$<$ を除いた同じ構造は文献の形の $\mathsf{Q}$ のモデルにもなっている。
:::

::: lemma Q での数項の計算 {#pt:q-numerals keywords="numerals in Q, standard part of models of Q is an initial segment" index="数項の計算（Q での）|すうこうのけいさんきゅーでの"}
$\mathcal{M}\models\mathsf{Q}$ とし、$d(n)\defeq\underline{n}^{\mathcal{M}}$ とする。任意の $n,m\in\N$ について次が成り立つ。
1. $d(n+m)=d(n)+d(m)$、$d(nm)=d(n)\cdot d(m)$。
2. $n\neq m$ なら $d(n)\neq d(m)$。
3. $\mathcal{M}\models\forall x\,\bigl(x<\underline{n}\leftrightarrow x=\underline{0}\vee\cdots\vee x=\underline{n-1}\bigr)$（$n=0$ のとき右辺は $\bot$）。
4. $n<m\iff d(n)<d(m)$。
5. $a\in M$ が $a<d(n)$ を満たせば、ある $k<n$ で $a=d(k)$。

したがって、$n,m\in\N$ と閉項 $t$ について、$\mathsf{Q}\vdash t=\underline{t^{\mathcal{N}}}$、$\mathsf{Q}\vdash\neg\,\underline{n}=\underline{m}$（$n\neq m$）、$\mathsf{Q}\vdash\underline{n}<\underline{m}$（$n<m$）、$\mathsf{Q}\vdash\neg\,\underline{n}<\underline{m}$（$n\ge m$）。
:::

::: proof
**1・3** は \ref{pt:standard-part.1}・\ref[2]{pt:standard-part.2} の証明と同じで、(A1), (A2), (M1), (M2), (O1), (O2) しか使わない。

**2.** $n<m$ としてよい。$n$ に関する（メタの）帰納法。$n=0$：$d(m)=S(d(m-1))\neq0=d(0)$（(S1)）。$n+1<m$：$d(n+1)=d(m)$ なら $S(d(n))=S(d(m-1))$ で、(S2) から $d(n)=d(m-1)$、帰納法の仮定（$n<m-1$）に反する。

**4.** $n<m$ なら 3 から $d(n)<d(m)$。$n\ge m$ で $d(n)<d(m)$ なら、3 から $d(n)=d(k)$（ある $k<m\le n$）となり 2 に反する。（\ref{pt:standard-part.3} の証明では $\neg\,a<a$ を使ったが、ここでは 2 で置き換えた。）

**5** は 3 から。後半は、完全性定理と、閉項 $t$ について $t^{\mathcal{M}}=d(t^{\mathcal{N}})$（項に関する帰納法と 1）による。
:::

::: theorem Q の Σ 完全性 {#pt:q-sigma-completeness keywords="Sigma_1 completeness of Q" index="Σ 完全性（Q の）|しぐまかんぜんせいきゅーの"}
$\varphi(\vec{x})$ を狭義の Σ 論理式とする。$\mathcal{N}\models\varphi[\vec{n}]$ ならば $\mathsf{Q}\vdash\varphi(\underline{\vec{n}})$。
:::

::: proof
\ref{pt:sigma-upward}（Σ 論理式は上に保たれる）の証明は、\ref{pt:standard-part.1}・\ref[3]{pt:standard-part.3}・\ref[4]{pt:standard-part.4}（項の値の保存、単射性と順序、始切片）だけを使っている。$\mathcal{M}\models\mathsf{Q}$ についても、\ref{pt:q-numerals.1}・\ref[2]{pt:q-numerals.2}・\ref[4]{pt:q-numerals.4}・\ref[5]{pt:q-numerals.5}（項の値の保存、単射性、順序、始切片）が同じ性質を与えるので、同じ証明により $\mathcal{M}\models\varphi[d(\vec{n})]$。$\mathcal{M}$ は任意なので、完全性定理（と代入補題）から $\mathsf{Q}\vdash\varphi(\underline{\vec{n}})$。
:::

::: remark 原始再帰的算術と算術の部分体系 {#pt:weak-arithmetics keywords="primitive recursive arithmetic, PRA, I Sigma_n, fragments of arithmetic, finitism" index="原始再帰的算術|げんしさいきてきさんじゅつ, PRA|ぴーあーるえー, IΣ1|あいしぐまわん"}
$\mathsf{Q}$ と $\PA$ の間には、次のような体系がよく使われる。以下の主張のうち、定義以外は一般に知られている結果で、本サイトでは示していない。
- **$\mathrm{I}\Sigma_{n}$**：$\mathsf{Q}$ に、Σₙ 論理式（有界な論理式の前に、$\exists$ から始まる量化子のブロックが $n$ 個交互に並んだ論理式）$\varphi$ についての帰納法の公理だけを加えた体系。$\PA=\bigcup_{n}\mathrm{I}\Sigma_{n}$ で、$\mathrm{I}\Sigma_{n}\subsetneq\mathrm{I}\Sigma_{n+1}$。$\mathrm{I}\Sigma_{0}$（有界な論理式の帰納法）は $\mathrm{I}\Delta_{0}$ とも書かれる。
- **原始再帰的算術 $\mathsf{PRA}$**：言語にすべての原始再帰関数の記号をもち、それらの定義の等式（\ref{comp:primitive-recursive.1}〜\ref[5]{comp:primitive-recursive.5} を等式として書いたもの）と、量化子を含まない論理式についての帰納法の推論規則「$\varphi(0)$ と $\varphi(x)\to\varphi(S(x))$ から $\varphi(x)$」をもつ、量化子を使わない体系。スコーレム（1923）に始まり、テイトは「有限の立場の数学」の形式化とみなせると論じた。
- $\mathrm{I}\Sigma_{1}$ で全域性が証明できる関数はちょうど原始再帰関数で、$\mathrm{I}\Sigma_{1}$ は $\Pi_{2}$ 文について $\mathsf{PRA}$ の保存拡大である（パーソンズ、ミンツ、竹内）。とくに \ref{pt:primitive-recursive-definable} の「原始再帰関数が Σ 関数として定義でき、再帰の等式が証明できる」ことは、$\PA$ でなく $\mathrm{I}\Sigma_{1}$ で足りる。
- 本ページの表現可能性定理は $\mathsf{Q}$ で成り立つので、$\mathsf{Q}$ の公理をすべて定理にもつ体系（定義から $\mathrm{I}\Sigma_{n}$、\ref{pt:pa-order.5} から $\PA$）でも成り立つ。一方、表現する論理式 $F$ について「$\forall\vec{x}\,\exists!y\,F(\vec{x},y)$」（関数としての全域性）まで証明できるかどうかは体系の強さによる。
:::

## 表現可能性 {#comp:sec-representable}

::: definition 表現可能 {#comp:representable keywords="representable function, numeralwise representable relation" index="表現可能（算術の理論で）|ひょうげんかのうさんじゅつのりろんで"}
$T$ を $\mathcal{L}_{\mathrm{ar}}$ の理論とする。
1. 関数 $f\colon\N^{k}\to\N$ が論理式 $F(\vec{x},y)$ によって $T$ で**表現される**とは、すべての $\vec{m}\in\N^{k}$ について
$$
T\vdash\forall y\,\bigl(F(\underline{\vec{m}},y)\leftrightarrow y=\underline{f(\vec{m})}\bigr)
$$
となることをいう（$\underline{\vec{m}}$ は $\underline{m_{1}},\dots,\underline{m_{k}}$ を代入すること）。
2. 関係 $R\subseteq\N^{k}$ が論理式 $\varphi(\vec{x})$ によって $T$ で**表現される**とは、すべての $\vec{m}$ について、$R(\vec{m})$ なら $T\vdash\varphi(\underline{\vec{m}})$、そうでなければ $T\vdash\neg\varphi(\underline{\vec{m}})$ となることをいう。

$T\subseteq T'$ なら、$T$ で表現されるものは同じ論理式で $T'$ でも表現される。$\mathcal{N}\models T$ なら、$f$ を $T$ で表現する論理式は $\mathcal{N}$ で $f$ のグラフを定義する。
:::

::: remark
1 は、各入力の数項について「$F$ の値がちょうど一つ $\underline{f(\vec{m})}$ である」ことの証明を要求するが、変数のままの $\forall\vec{x}\,\exists!y\,F(\vec{x},y)$ までは要求しない（\ref{pt:weak-arithmetics} の最後）。
:::

## 原始再帰を使わない計算可能関数 {#pt:sec-kleene-class}

::: definition クラス 𝒞 {#pt:kleene-class keywords="mu-recursive functions without primitive recursion, Kleene's basis" index="クラス 𝒞（表現可能性）|くらすしーひょうげんかのうせい"}
$\mathcal{C}$ を、零関数 $Z^{k}$、後者 $S$、射影 $U^{k}_{i}$、和 $x+y$、積 $x\cdot y$、大小の特性関数 $\chi_{<}$ を含み、合成と**正則な**最小化で閉じた最小の関数のクラスとする（原始再帰は含めない）。$\chi_{R}\in\mathcal{C}$ となる関係 $R$ を **$\mathcal{C}$ 関係**という。
:::

::: lemma 𝒞 の閉包性 {#pt:kleene-class-closure keywords="closure properties of the class C"}
1. $x\mathbin{\dot{-}}y$、$\overline{\mathrm{sg}}(x)=1\mathbin{\dot{-}}x$、$\chi_{=}$ は $\mathcal{C}$ に属する。
2. $\mathcal{C}$ 関係は $\neg,\wedge,\vee$ と、$\mathcal{C}$ の関数の代入で閉じている。
3. $R$ が $\mathcal{C}$ 関係なら、$\mu z<y\,R(\vec{x},z)$（なければ $y$）は $\mathcal{C}$ に属し、$\exists z<y\,R(\vec{x},z)$, $\forall z<y\,R(\vec{x},z)$ は $\mathcal{C}$ 関係である。
4. $\lfloor x/y\rfloor$ と剰余 $\mathrm{rm}(x,y)$（$y\ge1$。$y=0$ では任意の値に約束する）、したがって $\beta(a,b,i)$ は $\mathcal{C}$ に属する。
5. $J(a,b)\defeq(a+b)\cdot(a+b)+a$ は単射で $a,b\le J(a,b)$、その逆の成分 $J_{1},J_{2}$（$J(J_{1}(c),J_{2}(c))=c$ となる $c$ で）は $\mathcal{C}$ に属する。
:::

::: proof
1. $x\mathbin{\dot{-}}y=\mu z\,[\chi_{<}(y+z,x)=0]$ である：$\chi_{<}(y+z,x)=0\iff x\le y+z$ であり、これをみたす最小の $z$ は、$x\ge y$ なら $x-y$、$x<y$ なら $0$ である。$z=x$ で成り立つので正則である。$\overline{\mathrm{sg}}$ は定数 $1=S(Z(x))$ との $\dot{-}$ の合成で得られ、$\chi_{=}(x,y)=\overline{\mathrm{sg}}((x\mathbin{\dot{-}}y)+(y\mathbin{\dot{-}}x))$ と書ける。
2. $\chi_{\neg R}=\overline{\mathrm{sg}}\circ\chi_{R}$、$\chi_{R\wedge R'}=\chi_{R}\cdot\chi_{R'}$ と書け、$R\vee R'$ は $\neg(\neg R\wedge\neg R')$ と同値である。代入は合成で表せる。
3. $\mu z<y\,R(\vec{x},z)=\mu z\,[\overline{\mathrm{sg}}(\chi_{R}(\vec{x},z)+\chi_{=}(z,y))=0]$：右辺は $R(\vec{x},z)$ または $z=y$ となる最小の $z$ であり、$z=y$ で成り立つので正則である。さらに $\exists z<y\,R\iff\mu z<y\,R<y$ と $\forall z<y\,R\iff\neg\exists z<y\,\neg R$ が成り立つので、1・2 からこれらは $\mathcal{C}$ 関係である。
4. $y\ge1$ なら $\lfloor x/y\rfloor=\mu q<x+1\,\bigl[x<(q+1)\cdot y\bigr]$ である（$q=x$ で $(x+1)y\ge x+1>x$ なので、上限 $x+1$ の手前で見つかる）。また $\mathrm{rm}(x,y)=x\mathbin{\dot{-}}y\lfloor x/y\rfloor$ である。β 関数は割る数が $1+(i+1)b\ge1$ なので、この約束に触れない。
5. $s\defeq a+b$ について $J$ の値は $s^{2},\dots,s^{2}+s$ で、$(s+1)^{2}>s^{2}+s$ なので異なる $s$ の値の範囲は重ならず、$s$ を固定すれば $a$ で決まるので単射。$a\le s^{2}+a=J$ であり、$b$ については $s\ge1$ なら $b\le s\le s^{2}\le J$、$s=0$ なら $b=0$ である。$J_{1}(c)=\mu a<c+1\,[\exists b<c+1\,J(a,b)=c]$, $J_{2}$ も同様（3 と 2）。
:::

::: theorem 全域的な計算可能関数は 𝒞 に属する {#pt:kleene-class-computable keywords="every total computable function is in C, elimination of primitive recursion by the beta function" index="β 関数による原始再帰の消去|べーたかんすうによるげんしさいきのしょうきょ"}
1. 原始再帰関数は $\mathcal{C}$ に属する。
2. 全域的な計算可能関数は $\mathcal{C}$ に属する。
:::

::: proof
**1.** 原始再帰関数の構成に関する帰納法。初期関数と合成は定義から。原始再帰 $f(\vec{x},0)=g(\vec{x})$, $f(\vec{x},y+1)=h(\vec{x},y,f(\vec{x},y))$（$g,h\in\mathcal{C}$）とする。関係
$$
\begin{aligned}
B(\vec{x},y,c)\ :\iff\ &\beta(J_{1}c,J_{2}c,0)=g(\vec{x})\\
&\wedge\forall i<y\ \beta(J_{1}c,J_{2}c,i+1)=h\bigl(\vec{x},i,\beta(J_{1}c,J_{2}c,i)\bigr)
\end{aligned}
$$
は $\mathcal{C}$ 関係である（\ref{pt:kleene-class-closure}）。各 $(\vec{x},y)$ について、β 関数の補題（\tref{pt:beta-lemma} を $\mathcal{N}$ で、$y+1$ 個の値 $f(\vec{x},0),\dots,f(\vec{x},y)$ に使う）から $\beta(a,b,i)=f(\vec{x},i)$（$i\le y$）となる $a,b$ があり、$c\defeq J(a,b)$ で $B(\vec{x},y,c)$。よって $w(\vec{x},y)\defeq\mu c\,[\overline{\mathrm{sg}}(\chi_{B}(\vec{x},y,c))=0]$ は正則な最小化で $\mathcal{C}$ に属する。$B(\vec{x},y,c)$ なら、$i\le y$ に関する帰納法で $\beta(J_{1}c,J_{2}c,i)=f(\vec{x},i)$ である（$i=0$ は $B$ の第 1 成分、$i+1$ は第 2 成分と $f$ の再帰の等式による）。よって $f(\vec{x},y)=\beta(J_{1}w(\vec{x},y),J_{2}w(\vec{x},y),y)$ であり、右辺は $\mathcal{C}$ の関数の合成なので $f\in\mathcal{C}$ である。

**2.** $f=\varphi^{(k)}_{e}$ が全域的なら、クリーネの標準形（\ref{comp:normal-form}）から $f(\vec{m})=U(e,\vec{m},\mu t\,T_{k}(e,\vec{m},t))$。$U$ と $\chi_{T_{k}}$ は原始再帰的なので 1 により $\mathcal{C}$ に属する。$f$ が全域的なので、最小化 $\mu t\,[\overline{\mathrm{sg}}(\chi_{T_{k}}(e,\vec{m},t))=0]$ は正則であり、$f$ はこれを $U$ に代入した合成として $\mathcal{C}$ に属する。
:::

::: remark
「$\beta$ 関数の補題を $\mathcal{N}$ で使う」とは、$\mathcal{N}\models\PA$ であることを通して、\ref{pt:beta-lemma} の主張を自然数そのものについて使うことである（値 $a_{0},\dots,a_{y}$ を順にとる関数は、$i=\underline{0}\wedge z=\underline{a_{0}}$ などの選言で $\PA$ で関数的な論理式として書ける）。ここで使っているのは自然数についての中国剰余定理だけで、$\mathsf{Q}$ の強さとは関係しない。
:::

## 表現可能性定理 {#pt:sec-representability}

::: theorem 表現可能性定理 {#comp:representability keywords="representability theorem, every computable function is representable in Q" index="表現可能性定理|ひょうげんかのうせいていり" refname="表現可能性定理"}
全域的な計算可能関数はすべて、ある狭義の Σ 論理式によって $\mathsf{Q}$ で表現される。したがって、$\mathsf{Q}$ を含むどの理論（たとえば $\PA$）でも表現される。
:::

::: proof
\ref{pt:kleene-class-computable} により、$\mathcal{C}$ の関数が狭義の Σ 論理式で $\mathsf{Q}$ で表現されることを、$\mathcal{C}$ の構成に関する帰納法で示せばよい。以下、$\mathcal{M}\models\mathsf{Q}$ を任意にとり、$\mathcal{M}$ で成り立つことを示す（完全性定理）。数項の性質は \ref{pt:q-numerals} による。

**初期関数.** 零関数 $Z^{k}$ を論理式 $y=0$、後者 $S$ を $y=S(x)$、射影 $U^{k}_{i}$ を $y=x_{i}$、和を $y=x_{1}+x_{2}$、積を $y=x_{1}\cdot x_{2}$ で表現する。いずれも $\mathcal{M}$ で $\underline{\vec{m}}$ を代入した右辺の値が $d(f(\vec{m}))$ に等しい（\ref{pt:q-numerals.1}）ので、$y$ がそれに等しいことと同値。$\chi_{<}$：
$$
F_{<}(x_{1},x_{2},y)\defeq(x_{1}<x_{2}\wedge y=\underline{1})\vee(\neg\,x_{1}<x_{2}\wedge y=\underline{0}).
$$
$m_{1}<m_{2}$ なら $\mathcal{M}\models\underline{m_{1}}<\underline{m_{2}}$、そうでなければ $\mathcal{M}\models\neg\,\underline{m_{1}}<\underline{m_{2}}$（\ref{pt:q-numerals.4}）なので、$F_{<}(\underline{m_{1}},\underline{m_{2}},y)$ は $y=\underline{\chi_{<}(m_{1},m_{2})}$ と同値。これらは狭義の Σ 論理式（原子論理式とその否定の $\wedge,\vee$）である。

**合成.** $f(\vec{x})=g(h_{1}(\vec{x}),\dots,h_{l}(\vec{x}))$ で、$g,h_{j}$ を $G,H_{j}$ が表現するとする。
$$
F(\vec{x},y)\defeq\exists z_{1}\cdots\exists z_{l}\,\bigl(H_{1}(\vec{x},z_{1})\wedge\cdots\wedge H_{l}(\vec{x},z_{l})\wedge G(z_{1},\dots,z_{l},y)\bigr).
$$
これは狭義の Σ 論理式である。$\mathcal{M}\models F(\underline{\vec{m}},b)$ なら、証拠 $c_{j}$ は $H_{j}$ の表現から $c_{j}=d(h_{j}(\vec{m}))$ であり、すると $G$ の表現から $b=d(g(h_{1}(\vec{m}),\dots))=d(f(\vec{m}))$ である。逆に $b=d(f(\vec{m}))$ なら $c_{j}\defeq d(h_{j}(\vec{m}))$ が証拠になる。

**正則な最小化.** $f(\vec{x})=\mu y\,[g(\vec{x},y)=0]$（正則）で、$g$ を $G$ が表現するとする。
$$
F(\vec{x},y)\defeq G(\vec{x},y,\underline{0})\wedge\forall w<y\,\exists z\,\bigl(G(\vec{x},w,z)\wedge\neg\,z=\underline{0}\bigr).
$$
これは狭義の Σ 論理式である。$\vec{m}$ を固定し $n\defeq f(\vec{m})$ とする（$g(\vec{m},n)=0$、$k<n$ で $g(\vec{m},k)\neq0$）。
- ($\Leftarrow$) $\mathcal{M}\models G(\underline{\vec{m}},\underline{n},\underline{0})$ は $G$ の表現から。$w<d(n)$ なら \ref{pt:q-numerals.5} で $w=d(k)$（$k<n$）で、$z\defeq d(g(\vec{m},k))$ が証拠：$G$ の表現と、$g(\vec{m},k)\neq0$ から $z\neq d(0)$（\ref{pt:q-numerals.2}）。
- ($\Rightarrow$) $\mathcal{M}\models F(\underline{\vec{m}},b)$ とする。(O3) から $b<d(n)$, $b=d(n)$, $d(n)<b$ のいずれか。$b<d(n)$ なら $b=d(k)$（$k<n$）で、第一成分 $G(\underline{\vec{m}},\underline{k},\underline{0})$ と $G$ の表現から $d(0)=d(g(\vec{m},k))$、\ref{pt:q-numerals.2} に反する。$d(n)<b$ なら、第二成分を $w=d(n)$ に使うと、$G(\underline{\vec{m}},\underline{n},z)$ かつ $z\neq d(0)$ となる $z$ があるが、$G$ の表現から $z=d(g(\vec{m},n))=d(0)$ で矛盾する。よって $b=d(n)$ である。

::: hypcheck
- **公理の使い分け**：(S1), (S2) は異なる数項が異なること（\ref{pt:q-numerals.2}）に、(A1)〜(M2) は数項の計算（\ref{pt:q-numerals.1}）に、(O1), (O2) は数項より小さい元が数項であること（\ref{pt:q-numerals.3}・\ref[5]{pt:q-numerals.5}）に使った。(O3) は最小化の場合に $b$ と $d(n)$ を比べることにだけ使い、数項との三分律 $\forall x\,(x<\underline{n}\vee x=\underline{n}\vee\underline{n}<x)$ で足りる。帰納法の公理は一度も使っていない。
- **正則性**：最小化の場合で $n=f(\vec{m})$ が存在することに使った。部分関数の最小化では、表現の定義そのものが意味をもたない。
- **原始再帰の消去**：$\mathsf{Q}$ では原始再帰で定めた関数の再帰の等式を変数のまま証明できないので、β 関数で原始再帰を最小化に置き換え（\ref{pt:kleene-class-computable.1}）、表現の議論を数項だけで済ませた。一般の計算可能関数をこれに帰着させるのに、クリーネの標準形（\ref{pt:kleene-class-computable.2}）を使った。
- **狭義の Σ であること**：合成では $\exists$ と $\wedge$、最小化では有界量化 $\forall w<y$ と $\exists z$ しか加えないので、表現する論理式はいつも狭義の Σ 論理式である。
:::
:::

::: corollary 決定可能な関係の表現 {#comp:decidable-representable keywords="decidable relations are representable in Q" index="決定可能な関係の表現|けっていかのうなかんけいのひょうげん"}
決定可能な関係 $R\subseteq\N^{k}$ は、狭義の Σ 論理式によって $\mathsf{Q}$ で表現される。
:::

::: proof
$\chi_{R}$ を表現する $F$ について $\varphi(\vec{x})\defeq F(\vec{x},\underline{1})$。$R(\vec{m})$ なら $\mathsf{Q}\vdash F(\underline{\vec{m}},\underline{1})$。そうでなければ $\mathsf{Q}\vdash\forall y\,(F(\underline{\vec{m}},y)\leftrightarrow y=\underline{0})$ と $\mathsf{Q}\vdash\neg\,\underline{1}=\underline{0}$ から $\mathsf{Q}\vdash\neg F(\underline{\vec{m}},\underline{1})$。
:::

## Σ 論理式で定義できる関係 {#comp:sec-sigma-definable}

::: lemma Σ 論理式の標準形 {#comp:sigma-normal-form keywords="normal form for Sigma_1 relations, existential over primitive recursive" index="Σ 論理式の標準形|しぐまろんりしきのひょうじゅんけい"}
狭義の Σ 論理式 $\varphi(\vec{x})$ のそれぞれに対し、原始再帰的な関係 $\theta(\vec{x},w)$ で、すべての $\vec{m}$ について $\mathcal{N}\models\varphi[\vec{m}]\iff\exists w\,\theta(\vec{m},w)$ となるものがある。
:::

::: proof
狭義の Σ 論理式の構成に関する帰納法。項の値は多項式なので原始再帰関数である。$\pi,\pi_{1},\pi_{2}$ はカントールの\term[対関数]{comp:pairing-pr}（\ref{comp:pairing-pr}）、$\exp(v,s)$ は素因数分解での指数（\ref{comp:prime-sequence-code}）。
- 原子論理式とその否定の場合、定める関係は原始再帰的で、$\theta$ はそれ自身（$w$ は使わない）。
- $\varphi_{1}\wedge\varphi_{2}$ の場合、$\theta(\vec{x},w)\defeq\theta_{1}(\vec{x},\pi_{1}(w))\wedge\theta_{2}(\vec{x},\pi_{2}(w))$ とおく（$\pi$ は全単射なので、二つの証拠を一つの $w$ にまとめられる）。$\varphi_{1}\vee\varphi_{2}$ の場合は $\theta_{1}(\vec{x},w)\vee\theta_{2}(\vec{x},w)$ とおく。
- $\exists y\,\varphi$ の場合、$\exists y\,\exists w\,\theta(\vec{x},y,w)\iff\exists v\,\theta(\vec{x},\pi_{1}(v),\pi_{2}(v))$ が成り立つので、$\theta(\vec{x},\pi_{1}(v),\pi_{2}(v))$ を新しい $\theta$ とする。
- $\forall s<t\,\varphi$（$t$ は項）の場合、各 $s<t$ に証拠 $w_{s}$ を選び $v\defeq\prod_{s<t}p(s)^{w_{s}}$ とすれば $\exp(v,s)=w_{s}$ なので、
$$
\forall s<t\,\exists w\,\theta(\vec{x},s,w)\iff\exists v\,\forall s<t\,\theta\bigl(\vec{x},s,\exp(v,s)\bigr).
$$
右辺の $\exists v$ の中は原始再帰的（\ref{comp:pr-closure}）。
:::

::: theorem Σ 定義可能性と半決定可能性 {#comp:sigma-semidecidable keywords="Sigma_1 definable iff semidecidable, graph characterization of computable functions" index="Σ 定義可能と半決定可能|しぐまていぎかのうとはんけっていかのう"}
1. 関係 $R\subseteq\N^{k}$ について、$R$ が $\mathcal{N}$ で狭義の Σ 論理式により定義できることと、$R$ が半決定可能であることは同値である。
2. 部分関数 $f$ が計算可能であることと、そのグラフが $\mathcal{N}$ で狭義の Σ 論理式により定義できることは同値である。
3. 全域的な関数 $f$ について、(a) $f$ は計算可能、(b) $f$ のグラフは $\mathcal{N}$ で狭義の Σ 論理式により定義できる、は同値であり、このとき (c) $f$ はある論理式によって $\mathsf{Q}$ で表現される。（逆の (c)⇒(a) は構文の算術化を使うので、\see{pt:q-representable-computable} で示す。）
:::

::: proof
1. ($\Rightarrow$) \ref{comp:sigma-normal-form} の $\theta$ について $g(\vec{x})\simeq\mu w\,[\overline{\mathrm{sg}}(\chi_{\theta}(\vec{x},w))=0]$ は計算可能で定義域は $R$。($\Leftarrow$) $R=\mathrm{dom}(\varphi^{(k)}_{e})$ なら $R(\vec{m})\iff\exists t\,T_{k}(e,\vec{m},t)$（\ref{comp:normal-form}）。$\chi_{T_{k}}(e,\cdot,\cdot)$ を $\mathsf{Q}$ で表現する狭義の Σ 論理式 $G$（\ref{comp:representability}）は $\mathcal{N}$ でそのグラフを定義するので（$\mathcal{N}\models\mathsf{Q}$）、$\exists t\,G(\vec{x},t,\underline{1})$ が $R$ を定義する。
2. ($\Rightarrow$) $f=\varphi^{(k)}_{e}$ なら $f(\vec{m})=n$ は「$\exists t$（$t$ が $T_{k}(e,\vec{m},\cdot)$ を満たす最小の数で $U(e,\vec{m},t)=n$）」と同値で、1 の証明と同様に表現する論理式を組み合わせれば狭義の Σ 論理式になる（最小性は \ref{comp:representability} の最小化の場合の論理式の形で書ける）。($\Leftarrow$) \ref{comp:sigma-normal-form} の $\theta(\vec{x},y,w)$ について $f(\vec{x})\simeq\pi_{1}\bigl(\mu v\,[\overline{\mathrm{sg}}(\chi_{\theta}(\vec{x},\pi_{1}(v),\pi_{2}(v)))=0]\bigr)$（グラフの点は一つしかないので $\pi_{1}(v)=f(\vec{x})$）。
3. (a)⇒(c) は \ref{comp:representability} であり、(a)⇔(b) は 2 である。

::: hypcheck
- **$\mathcal{N}\models\mathsf{Q}$**：1 の ($\Leftarrow$) と 2 の ($\Rightarrow$) で、$\mathsf{Q}$ で表現する論理式が $\mathcal{N}$ でグラフを定義することに使った。
- **標準形定理**：1 の ($\Leftarrow$) と 2 の ($\Rightarrow$) で、計算の停止を「原始再帰的な関係をみたす $t$ がある」に書き直すのに使った。逆向きでは \ref{comp:sigma-normal-form} が同じ役割をする。
- **グラフの一意性**：2 の ($\Leftarrow$) で、最小化で見つかった $v$ の第一成分が $f(\vec{x})$ になることに使った。部分関数のグラフでない関係（一つの $\vec{x}$ に複数の $y$）では、この式は一つの $y$ を選ぶだけになる。
:::
:::

## 問題 {#comp:sec-rep-problems}

::: problem {#comp:prob-pa-undecidable}
（チャーチの定理の算術版）$T$ を $\mathsf{Q}\subseteq T$ かつ $\mathcal{N}\models T$ となる理論とする。$T$ で証明できる文のゲーデル数全体は決定不能であることを示せ。ただし、論理式に数項を代入する操作 $(\ulcorner\varphi(x)\urcorner,m)\mapsto\ulcorner\varphi(\underline{m})\urcorner$ が計算可能であること（後のページ \see{pt:page-arithmetization} の内容）を先取りしてよい。
:::

::: solution
$K$ は半決定可能なので、\ref{comp:sigma-semidecidable.1} より狭義の Σ 論理式 $\kappa(x)$ で $\mathcal{N}$ で定義できる。$m\in K$ なら、$\mathsf{Q}$ の Σ 完全性（\ref{pt:q-sigma-completeness}）から $T\vdash\kappa(\underline{m})$。$m\notin K$ なら $\mathcal{N}\not\models\kappa[m]$ で、$\mathcal{N}\models T$ なので $T\nvdash\kappa(\underline{m})$。よって $m\in K\iff T\vdash\kappa(\underline{m})$ である。$T$ の定理のゲーデル数全体が決定可能だとすると、$m$ から $\ulcorner\kappa(\underline{m})\urcorner$ を計算し（代入の計算可能性）、それが $T$ の定理かを判定すれば $m\in K$ が判定できる。ゆえに $K$ が決定可能になり、\ref{comp:halting-L} に矛盾する。
:::

::: problem {#comp:prob-complement-k-not-sigma}
$\N\setminus K$ は $\mathcal{N}$ で狭義の Σ 論理式によって定義できないことを示せ。
:::

::: solution
定義できれば、\ref{comp:sigma-semidecidable.1} から $K$ と $\N\setminus K$ はともに半決定可能である。$K=\mathrm{dom}(\varphi_{a})$, $\N\setminus K=\mathrm{dom}(\varphi_{b})$ として、$t=0,1,2,\dots$ の順に $T_{1}(a,m,t)$ と $T_{1}(b,m,t)$ を調べ、先に成り立った方で答えるプログラムは $\chi_{K}$ を計算する。これは \ref{comp:halting-L} に矛盾する。
:::

::: problem {#pt:prob-representable-decidable}
$T$ を、定理全体が半決定可能で、無矛盾な $\mathcal{L}_{\mathrm{ar}}$ の理論とする。関係 $R$ がある論理式 $\varphi$ によって $T$ で表現されるなら、$R$ は決定可能であることを示せ。
:::

::: solution
入力 $\vec{m}$ について、$\varphi(\underline{\vec{m}})$ と $\neg\varphi(\underline{\vec{m}})$ のゲーデル数を計算し（前問と同じく、代入の計算可能性を先取りする）、$T$ の定理を数え上げ、$\varphi(\underline{\vec{m}})$ か $\neg\varphi(\underline{\vec{m}})$ のどちらかが現れるまで待ち、前者なら $1$、後者なら $0$ を出力する。表現の定義からどちらかは $T$ の定理なので停止する。$T$ が無矛盾なので両方が定理になることはなく、出力は $\chi_{R}(\vec{m})$ に等しい。（したがって、$\mathsf{Q}$ を含む無矛盾で定理が半決定可能な理論について、そこで表現される関係はちょうど決定可能な関係である。）
:::

::: supplement
**前提の検討.**
- 本ページの証明が使う $\mathsf{Q}$ の性質は、数項の性質（\ref{pt:q-numerals}）と、数項との三分律 $\forall x\,(x<\underline{n}\vee x=\underline{n}\vee\underline{n}<x)$ だけである（表現可能性定理の証明の hypcheck）。したがって、これらを数項ごとの公理図式として並べた体系でも、同じ証明で表現可能性定理が成り立つ。タルスキ–モストフスキ–ロビンソンの体系 $\mathsf{R}$ はこの種の体系で、$x+y=y+x$ のような 2 変数以上の一般法則を含まない。(O3) を数項との三分律にも弱めずに外した体系でも、表現する論理式を工夫すれば表現可能性定理が成り立つとされる（本サイトでは確かめていない）。
- 表現可能性定理と対角化（構文の算術化を使う）から、$\mathsf{Q}$ を含む無矛盾な理論はどれも決定不能であること（**本質的決定不能性**）が従い、$\mathsf{Q}$ が有限公理系であることから、さらに $\mathsf{Q}$ と矛盾しないどの理論も決定不能であることが従う（本サイトでは示していない）。これと問題 \ref{comp:prob-pa-undecidable} の議論を組み合わせると、一階述語論理の恒真な文の集合も決定不能であるというチャーチの定理が得られる（$\mathsf{Q}$ が有限公理系なので、$\mathsf{Q}\vdash\varphi$ は「$\bigwedge\mathsf{Q}\to\varphi$ が恒真」と同値）。
- 後のページ \see{pt:page-arithmetization} と \see{pt:godel-first} は、本ページを使わずに、原始再帰関数の定義可能性（\ref{pt:primitive-recursive-definable}）だけで進む（本ページは、\see{pt:q-representable-computable} で表現可能な関数が計算可能であることを示すときに使う）。本ページはそれらを「計算可能性」の言葉で見直すためのもので、不完全性定理の計算論的な証明（\ref{comp:prob-pa-undecidable} の議論を少し変えたもの）にもつながる。

**関連する結果.**
- *算術的階層.* Σ 論理式で定義できる関係（$\Sigma_{1}$）の否定・射影を繰り返すと算術的階層 $\Sigma_{n}$, $\Pi_{n}$ が得られ、$\Sigma_{n+1}$ は「$\emptyset^{(n)}$ を神託とした半決定可能」と一致する（\ref{comp:arithmetical-hierarchy}, \ref{comp:sigma1-recognizable}）。
- *MRDP の定理.* Σ 論理式で定義できる関係は、有界量化子すら使わない「多項式の等式 $\exists\vec{w}\,(p(\vec{x},\vec{w})=q(\vec{x},\vec{w}))$」の形で定義できる（マチャセヴィッチ、ロビンソン、デイヴィス、パトナム）。これからヒルベルトの第 10 問題の否定的解決が従う。本サイトでは示していない。

**高い視点から：計算は Σ₁、検証は Δ₀.** 表現可能性定理の核心は、「計算が停止して値 $n$ を出す」ことが「ある有限の計算記録が存在し、その記録が正しいことは有界な検査で確かめられる」という形に書けることである。そして、有界な検査が正しいことを確かめるには、帰納法すら要らず、数項についての有限個の計算規則（$\mathsf{Q}$）で足りる。比喩で言えば、$\mathsf{Q}$ は「電卓」で、具体的な数についての計算は何でも確かめられるが、「すべての数について」の一般的な法則（$x+y=y+x$ など）は何も知らない。表現可能性定理は、計算可能性にとっては電卓で十分であることを言っている。第一不完全性定理も $\mathsf{Q}$ を含む（無矛盾で定理が半決定可能な）理論で成り立つことが知られていて（本サイトでは $\PA$ について示す）電卓で足りるが、第二不完全性定理のように、理論が自分の証明可能性についての一般法則（導出可能性条件）を証明する場面では、一般的な法則を扱う帰納法が必要になる。
:::
