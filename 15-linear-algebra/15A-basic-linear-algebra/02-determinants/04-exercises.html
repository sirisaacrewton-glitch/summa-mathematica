# 演習：行列式 {#lin:page-exercises-determinants keywords="exercises, Determinants"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#lin:sec-exdeterminants-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 行列式の定義 {#lin:sec-df-exercises}

対応するページ：\ref{lin:page-determinant-definitions}

::: problem ★ 基本：4 次の行列式 {#lin:ex-df-1}
$\begin{pmatrix}2 & 1 & 0 & 3 \\ 1 & 0 & 2 & 1 \\ 0 & 3 & 1 & 2 \\ 1 & 1 & 1 & 0\end{pmatrix}$ の行列式を、基本変形で三角行列に直して求めよ。
:::

::: solution
答えは $23$。（行を入れ替えると符号が変わり、ある行の定数倍を他の行に加えても変わらないことを使う：\ref{lin:page-determinant-definitions}。）
:::

::: problem ★ 基本：最小値の行列 {#lin:ex-df-2}
$a_{ij}=\min(i,j)$ で定まる $n$ 次正方行列の行列式を求めよ。
:::

::: solution
第 $i$ 行から第 $i-1$ 行を引く操作を $i=n,n-1,\dots,2$ の順に行うと、第 $i$ 行（$i\ge2$）は $(0,\dots,0,1,\dots,1)$（第 $i$ 成分から $1$）になり、上三角で対角成分がすべて $1$。行列式は $1$。
:::

::: problem ★★ 標準：三重対角行列 {#lin:ex-df-3}
対角成分が $2$、その上下が $-1$、他が $0$ の $n$ 次正方行列の行列式 $D_{n}$ が $n+1$ であることを示せ。
:::

::: solution
第 1 行で展開すると $D_{n}=2D_{n-1}-D_{n-2}$（$D_{1}=2$, $D_{2}=3$）。$D_{n}-D_{n-1}=D_{n-1}-D_{n-2}=\cdots=D_{2}-D_{1}=1$ なので $D_{n}=n+1$。
:::

::: problem ★★★ 発展：行列式の補題 {#lin:ex-df-4}
列ベクトル $u,v\in k^{n}$ について $\det(I_{n}+uv^{\top})=1+v^{\top}u$ を示せ。
:::

::: solution
$\begin{pmatrix}I&0\\v^{\top}&1\end{pmatrix}\begin{pmatrix}I+uv^{\top}&u\\0&1\end{pmatrix}\begin{pmatrix}I&0\\-v^{\top}&1\end{pmatrix}=\begin{pmatrix}I&u\\0&1+v^{\top}u\end{pmatrix}$ を直接確かめ、両辺の行列式をとる（外側の二つは行列式 $1$、ブロック三角行列の行列式は対角ブロックの積：\ref{lin:page-determinant-properties}）。
:::

## 行列式の性質 {#lin:sec-dp-exercises}

対応するページ：\ref{lin:page-determinant-properties}

::: problem ★ 基本：余因子行列と逆行列 {#lin:ex-dp-1}
$A=\begin{pmatrix}1 & 2 & 1 \\ 0 & 1 & 3 \\ 2 & 1 & 0\end{pmatrix}$ の余因子行列 $\widetilde{A}$ と逆行列を求めよ。
:::

::: solution
$\det A=7$、$\widetilde{A}=\begin{pmatrix}-3 & 1 & 5 \\ 6 & -2 & -3 \\ -2 & 3 & 1\end{pmatrix}$ で、$A^{-1}=\frac{1}{\det A}\widetilde{A}$（\ref{lin:page-determinant-properties}）。$A\widetilde{A}=(\det A)I$ を確かめよ。
:::

::: problem ★ 基本：ヴァンデルモンドの行列式 {#lin:ex-dp-2}
$x_{1},\dots,x_{4}=1,2,3,4$ のヴァンデルモンド行列 $(x_{i}^{j-1})$ の行列式を求めよ。
:::

::: solution
公式 $\prod_{i<j}(x_{j}-x_{i})$ から $(2-1)(3-1)(4-1)(3-2)(4-2)(4-3)=1\cdot2\cdot3\cdot1\cdot2\cdot1=12$。
:::

::: problem ★★ 標準：対称なブロック行列 {#lin:ex-dp-3}
同じ大きさの正方行列 $A,B$ について $\det\begin{pmatrix}A&B\\B&A\end{pmatrix}=\det(A+B)\det(A-B)$ を示せ。
:::

::: solution
第 2 ブロック列を第 1 ブロック列に足し、次に第 1 ブロック行を第 2 ブロック行から引くと $\begin{pmatrix}A+B&B\\0&A-B\end{pmatrix}$。これらの基本変形は行列式を変えない（ブロック単位の操作は $\begin{pmatrix}I&0\\I&I\end{pmatrix}$ などの行列式 $1$ の行列を掛けることにあたる）。ブロック三角行列の行列式から従う。
:::

::: problem ★★★ 発展：巡回行列の行列式 {#lin:ex-dp-4}
$\det\begin{pmatrix}a&b&c\\c&a&b\\b&c&a\end{pmatrix}=a^{3}+b^{3}+c^{3}-3abc=(a+b+c)(a+\omega b+\omega^{2}c)(a+\omega^{2}b+\omega c)$（$\omega=e^{2\pi i/3}$）を示せ。
:::

::: solution
$\zeta^{3}=1$ のとき $v=(1,\zeta,\zeta^{2})^{\top}$ に行列を掛けると、第 1 成分は $a+b\zeta+c\zeta^{2}$、第 2 成分は $c+a\zeta+b\zeta^{2}=\zeta(a+b\zeta+c\zeta^{2})$（$\zeta^{-1}=\zeta^{2}$）、第 3 成分も同様に $\zeta^{2}(a+b\zeta+c\zeta^{2})$ なので、$v$ は固有値 $a+b\zeta+c\zeta^{2}$ の固有ベクトル。三つの固有ベクトルは一次独立（ヴァンデルモンド）なので、行列式は三つの固有値の積。展開すれば左辺の式になる。
:::

## 小行列式と階数 {#lin:sec-mi-exercises}

対応するページ：\ref{lin:page-minors}

::: problem ★ 基本：小行列式による階数 {#lin:ex-mi-1}
$\begin{pmatrix}1 & 2 & 3 & 4 \\ 2 & 4 & 6 & 8 \\ 1 & 0 & 1 & 0\end{pmatrix}$ の階数を小行列式で求めよ。
:::

::: solution
第 2 行は第 1 行の 2 倍なので、第 2 行を含む 3 次の小行列式はすべて $0$ で、3 次の小行列式は 0（3 行しかないので 3 次小行列式はすべて第 2 行を含む）。第 1, 3 行と第 1, 2 列の 2 次小行列式は $1\cdot0-2\cdot1=-2\neq0$。よって階数 $2$（\ref{lin:page-minors}）。
:::

::: problem ★★ 標準：コーシー–ビネの公式 {#lin:ex-mi-2}
$A=\begin{pmatrix}1 & 2 & 0 \\ 0 & 1 & 3\end{pmatrix}$ について、$\det(AA^{\top})$ を直接計算し、2 次小行列式の 2 乗の和と比べよ。
:::

::: solution
$AA^{\top}=\begin{pmatrix}5 & 2 \\ 2 & 10\end{pmatrix}$ で $\det=46$。2 次小行列式は列 $\{1,2\}$, $\{1,3\}$, $\{2,3\}$ で $1,3,6$、2 乗の和は $46$ で一致する（コーシー–ビネ）。
:::

::: problem ★★ 標準：余因子行列の余因子行列 {#lin:ex-mi-3}
$n\ge2$ の正方行列 $A$ について $\widetilde{\widetilde{A}}=(\det A)^{n-2}A$ を、$A$ が可逆なときに示し、$A=\begin{pmatrix}2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 4\end{pmatrix}$ で確かめよ。
:::

::: solution
$\widetilde{A}=(\det A)A^{-1}$ と $\det\widetilde{A}=(\det A)^{n-1}$ から $\widetilde{\widetilde{A}}=(\det\widetilde{A})\widetilde{A}^{-1}=(\det A)^{n-1}\cdot\frac{A}{\det A}$。例では $n=3$, $\det A=18$ で、$\widetilde{\widetilde{A}}=18A$。（一般の $A$ には、成分が多項式の恒等式として延長する：可逆な行列は稠密、あるいは成分を不定元とした多項式環で示す。）
:::

::: problem ★★★ 発展：グラム行列式の正値性 {#lin:ex-mi-4}
実 $m\times n$ 行列 $A$ について $\det(AA^{\top})\ge0$ で、等号は $\mathrm{rank}A<m$ のときに限ることを示せ。
:::

::: solution
コーシー–ビネの公式から $\det(AA^{\top})=\sum_{J}(\det A_{J})^{2}\ge0$（$J$ は $m$ 個の列の選び方、$m>n$ なら和は空で $0$）。$0$ になるのは $m$ 次小行列式がすべて $0$、すなわち $\mathrm{rank}A<m$（\ref{lin:page-minors} の小行列式と階数）のとき。
:::
