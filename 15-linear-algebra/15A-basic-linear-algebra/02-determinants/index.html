# 行列式（Determinants）

行列式の同値な定義（ライプニッツの式・交代多重線形形式・自己準同型・余因子展開・掃き出し法・乗法的特徴付け）、余因子行列とクラメールの公式、ヴァンデルモンド、小行列式と階数、コーシー–ビネ。可換環上で述べる。
