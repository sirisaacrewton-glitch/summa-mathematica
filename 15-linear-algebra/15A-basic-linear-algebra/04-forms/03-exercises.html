## 双線形形式と 2 次形式 {#lin:sec-bf-exercises}

対応するページ：\ref{lin:page-bilinear}

::: problem ★ 基本：平方完成と符号 {#lin:ex-bf-1}
実 2 次形式 $q=x^{2}+2xy+3y^{2}+4yz+z^{2}$ を平方完成して標準形にし、符号（正・負の項の個数）を求めよ。
:::

::: solution
$q=(x+y)^{2}+2y^{2}+4yz+z^{2}=(x+y)^{2}+2(y+z)^{2}-z^{2}$。$X=x+y$, $Y=y+z$, $Z=z$ は可逆な変数変換なので、符号は $(2,1)$（シルヴェスターの慣性法則：\ref{lin:page-bilinear}）。グラム行列 $\begin{pmatrix}1&1&0\\1&3&2\\0&2&1\end{pmatrix}$ の固有値の符号（正 2 個・負 1 個）とも一致する。
:::

::: problem ★ 基本：対称な 2 次形式 {#lin:ex-bf-2}
$q=xy+yz+zx$ の符号を求めよ。
:::

::: solution
グラム行列は対角が $0$、他が $\frac12$ で、固有値は $1$（固有ベクトル $(1,1,1)$）と $-\frac12$（重複度 2）。符号は $(1,2)$。平方完成でも、$x=u+v$, $y=u-v$ と置くと $q=u^{2}-v^{2}+2uz=(u+z)^{2}-v^{2}-z^{2}$。
:::

::: problem ★★ 標準：パフィアン {#lin:ex-bf-3}
交代行列 $A=\begin{pmatrix}0 & 1 & 2 & 3 \\ -1 & 0 & 4 & 5 \\ -2 & -4 & 0 & 6 \\ -3 & -5 & -6 & 0\end{pmatrix}$ のパフィアン $\mathrm{Pf}(A)=a_{12}a_{34}-a_{13}a_{24}+a_{14}a_{23}$ を計算し、$\det A=\mathrm{Pf}(A)^{2}$ を確かめよ。
:::

::: solution
$\mathrm{Pf}(A)=1\cdot6-2\cdot5+3\cdot4=8$、$\det A=64=8^{2}$。
:::

::: problem ★★★ 発展：シルヴェスターの判定法 {#lin:ex-bf-4}
実対称行列 $A$ が正定値であることと、左上の $k$ 次主小行列式 $\Delta_{k}$ がすべて正であることは同値であることを示せ。
:::

::: solution
⇒：正定値なら左上の $k\times k$ 部分も正定値（$x$ を最初の $k$ 成分以外 $0$ にとる）で、固有値がすべて正なので行列式 $\Delta_{k}>0$。⇐：$n$ に関する帰納法。左上の $(n-1)$ 次部分 $A'$ は仮定から正定値。$A'$ が正定値なので、$e_{1},\dots,e_{n-1}$ をグラム–シュミットの要領で直交化し $e_{n}$ も $A'$ に関して直交化すると、$A=P^{\top}\mathrm{diag}(d_{1},\dots,d_{n})P$（$P$ は対角成分 $1$ の上三角）と書け、$d_{1}\cdots d_{k}=\Delta_{k}$。$\Delta_{k}>0$ からすべての $d_{k}>0$ で、正定値。
:::

## 内積空間 {#lin:sec-ip-exercises}

対応するページ：\ref{lin:page-inner-product}

::: problem ★ 基本：グラム–シュミットの直交化 {#lin:ex-ip-1}
$\R^{3}$ の $(1,1,0),(1,0,1),(0,1,1)$ を標準内積でグラム–シュミット直交化せよ。
:::

::: solution
順に $e_{1}=(\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}, 0)$, $e_{2}=(\frac{\sqrt{6}}{6}, - \frac{\sqrt{6}}{6}, \frac{\sqrt{6}}{3})$, $e_{3}=(- \frac{\sqrt{3}}{3}, \frac{\sqrt{3}}{3}, \frac{\sqrt{3}}{3})$。
:::

::: problem ★ 基本：直交射影の行列 {#lin:ex-ip-2}
平面 $x+y+z=0$ への直交射影の行列を求めよ。
:::

::: solution
法線の単位ベクトル $n=\frac{1}{\sqrt3}(1,1,1)$ について $I-nn^{\top}=\begin{pmatrix}\frac{2}{3} & - \frac{1}{3} & - \frac{1}{3} \\ - \frac{1}{3} & \frac{2}{3} & - \frac{1}{3} \\ - \frac{1}{3} & - \frac{1}{3} & \frac{2}{3}\end{pmatrix}$。
:::

::: problem ★★ 標準：直交行列による対角化 {#lin:ex-ip-3}
$A=\begin{pmatrix}2&1&1\\1&2&1\\1&1&2\end{pmatrix}$ を直交行列で対角化せよ。
:::

::: solution
固有値は $4$（固有空間 $\langle(1,1,1)\rangle$）と $1$（固有空間は平面 $x+y+z=0$、2 次元）。正規直交基底 $\frac{1}{\sqrt3}(1,1,1)$, $\frac{1}{\sqrt2}(1,-1,0)$, $\frac{1}{\sqrt6}(1,1,-2)$ を列に並べた直交行列 $Q$ で $Q^{\top}AQ=\mathrm{diag}(4,1,1)$（スペクトル定理）。
:::

::: problem ★★ 標準：特異値 {#lin:ex-ip-4}
$A=\begin{pmatrix}3&0\\4&5\end{pmatrix}$ の特異値を求めよ。
:::

::: solution
$A^{\top}A=\begin{pmatrix}25&20\\20&25\end{pmatrix}$ の固有値は $45,5$ なので、特異値は $3\sqrt5$, $\sqrt5$。積 $15=\lvert\det A\rvert$ で検算できる。
:::

::: problem ★★★ 発展：最小二乗法 {#lin:ex-ip-5}
4 点 $(0,1),(1,2),(2,2),(3,4)$ に直線 $y=a+bx$ を最小二乗であてはめよ。正規方程式 $X^{\top}Xc=X^{\top}y$ が最小二乗解を与える理由も説明せよ。
:::

::: solution
$X$ は $(1,x_{i})$ を行とする行列。$X^{\top}X=\begin{pmatrix}4 & 6 \\ 6 & 14\end{pmatrix}$, $X^{\top}y=\begin{pmatrix}9 \\ 18\end{pmatrix}$ から $(a,b)=(\frac{9}{10},\frac{9}{10})$。理由：$\lVert y-Xc\rVert$ を最小にする $Xc$ は $y$ の列空間への直交射影で、残差 $y-Xc$ が列空間に直交すること $X^{\top}(y-Xc)=0$ と同値。
:::
