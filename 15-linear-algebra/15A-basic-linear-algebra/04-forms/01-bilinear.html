# 双線形形式と 2 次形式 {#lin:page-bilinear keywords="bilinear form, Gram matrix, congruence of matrices, nondegenerate, radical, orthogonal complement, symmetric and alternating forms, quadratic form, polarization, orthogonal basis, diagonalization of symmetric forms in characteristic not two, Sylvester's law of inertia, signature, positive definite, Sylvester's criterion with leading principal minors, symplectic basis, rank of an alternating form is even, Pfaffian, determinant of an alternating matrix is a square"}

ベクトル空間上の双線形形式は基底を選ぶとグラム行列で表され、基底変換で ${}^{t}PGP$（**合同**）と変わる。標数が $2$ でない体上の対称形式は直交基底で対角化でき、実数体上では正・負の項の個数（**符号数**）が基底によらない（**シルヴェスターの慣性法則**）。正定値性は首座小行列式の正値性で判定できる。交代形式はどの体上でも**シンプレクティック基底**で標準形になり、階数は偶数。これを一般の交代行列に適用すると、交代行列の行列式が多項式（**パフィアン**）の平方であることが従う。


## 記法と定義の確認 {#lin:sec-bf-notation}

::: notation
- 双対空間・零化空間・転置・次元定理は \ref{lin:dual-space}, \ref{lin:dual-properties}, \ref{lin:rank-nullity}。基底変換は \ref{lin:change-of-basis}。行列式・ブロック行列・シューア補行列・一般の行列の技法は \ref{lin:det-multiplicative}, \ref{lin:block-determinant}, \ref{lin:sylvester-identity}。
- 一意分解環は正規（\ref{ring:ufd-normal}）、多項式環の一意分解性（\ref{ring:polynomial-ufd}）。
- $V$ は体 $k$ 上の有限次元空間、$n=\dim V$。
- **選択公理**：使わない。
:::

## 双線形形式とグラム行列 {#lin:sec-bf-forms}

::: definition 双線形形式 {#lin:bilinear-form keywords="bilinear form, Gram matrix, congruent matrices, nondegenerate, left and right radical, symmetric, alternating, skew-symmetric" index="双線形形式|そうせんけいけいしき, グラム行列|ぐらむぎょうれつ, 合同（行列）|ごうどうぎょうれつ, 非退化|ひたいか"}
写像 $B:V\times V\to k$ が各変数について線形なとき**双線形形式**という。基底 $(b_{1},\dots,b_{n})$ について $G\defeq(B(b_{i},b_{j}))$ を**グラム行列**といい、$B(v,w)={}^{t}[v]G[w]$。基底変換 $P$（\ref{lin:change-of-basis}）でグラム行列は ${}^{t}PGP$ に変わる（行列 $G$, $G'$ がこの関係にあるとき**合同**という）。$B$ は、$B(v,w)=B(w,v)$ なら**対称**、$B(v,v)=0$（すべての $v$）なら**交代的**、$B(v,w)=-B(w,v)$ なら**歪対称**という。$\operatorname{rank}B\defeq\operatorname{rank}G$（基底によらない）。$B^{\flat}:V\to V^{*}$, $v\mapsto B(v,-)$ が同型のとき**非退化**という（$\iff\det G\neq0$）。
:::

::: proposition 直交補空間 {#lin:orthogonal-complement keywords="radical, orthogonal complement W^perp, dim W^perp = dim V - dim W for nondegenerate B, V = W direct sum W^perp iff B restricted to W is nondegenerate" index="直交補空間|ちょっこうほくうかん, 根基（双線形形式）|こんきそうせんけいけいしき"}
対称または交代的な $B$ について、部分空間 $W$ の**直交補空間**を $W^{\perp}\defeq\{v : B(w,v)=0\ (w\in W)\}$、$V^{\perp}$ を $B$ の**根基**とする。
1. $B$ が非退化なら $\dim W^{\perp}=n-\dim W$、$(W^{\perp})^{\perp}=W$。
2. $V=W\oplus W^{\perp}\iff B|_{W\times W}$ が非退化。
3. $V=V^{\perp}\oplus V'$（任意の補空間 $V'$）とすると $B|_{V'}$ は非退化で、$\operatorname{rank}B=n-\dim V^{\perp}$。
:::

::: proof
**Step 1（1）.** $W^{\perp}$ は $B^{\flat}$ の像 $B^{\flat}(V)=V^{*}$ のうち $W$ で消えるもの、すなわち $(B^{\flat})^{-1}(W^{\perp_{*}})$（$W^{\perp_{*}}\subset V^{*}$ は零化空間。対称・交代なので $B(w,v)=\pm B(v,w)$ でどちらの変数で見ても同じ）。$B^{\flat}$ は同型なので $\dim W^{\perp}=\dim W^{\perp_{*}}=n-\dim W$（\ref{lin:dual-properties} の 4）。$W\subset(W^{\perp})^{\perp}$ で次元が等しい。

**Step 2（2）.** $W\cap W^{\perp}$ は $B|_{W}$ の根基なので、⇒ なら $B|_{W}$ の根基は $0$。⇐：$B|_{W}$ が非退化なら $W\cap W^{\perp}=0$。$v\in V$ について $B(-,v)|_{W}\in W^{*}$ は $B|_{W}$ の非退化性から $B(-,w_{0})|_{W}$（$w_{0}\in W$）と書け、$v-w_{0}\in W^{\perp}$。

**Step 3（3）.** $v'\in V'$ が $B|_{V'}$ の根基に入れば、$V^{\perp}$ とも直交するので $v'\in V^{\perp}\cap V'=0$。グラム行列は $\begin{pmatrix}0&0\\0&G'\end{pmatrix}$ で、$\operatorname{rank}=\operatorname{rank}G'=\dim V'$。
:::

## 対称形式 {#lin:sec-bf-symmetric}

::: theorem 対称形式の対角化 {#lin:symmetric-diagonalization keywords="in characteristic not 2, every symmetric bilinear form has an orthogonal basis; quadratic forms and polarization; every symmetric matrix is congruent to a diagonal matrix" index="対称形式の対角化|たいしょうけいしきのたいかくか, 2 次形式|にじけいしき, 直交基底|ちょっこうきてい, 極化|きょくか"}
$k$ の標数が $2$ でないとする。
1. 対称双線形形式 $B$ と **2 次形式** $q(v)\defeq B(v,v)$ は、極化 $B(v,w)=\tfrac12(q(v+w)-q(v)-q(w))$ により一対一に対応する。
2. 対称な $B$ は**直交基底**（$i\neq j$ で $B(b_{i},b_{j})=0$）をもつ。すなわち任意の対称行列は対角行列と合同。
:::

::: proof
**Step 1（1）.** $q(v+w)=q(v)+2B(v,w)+q(w)$（対称性）で、$2$ で割れる。

**Step 2（2：帰納法）.** $n$ についての帰納法。$B=0$ なら任意の基底。$B\neq0$ なら $q\neq0$（1 から、$q=0$ なら $B=0$）なので $q(b_{1})\neq0$ となる $b_{1}$ がある。$W=\langle b_{1}\rangle$ 上 $B$ は非退化なので $V=W\oplus W^{\perp}$（\ref{lin:orthogonal-complement} の 2）。$W^{\perp}$ に帰納法を使い、直交基底に $b_{1}$ を加える。
:::

::: theorem シルヴェスターの慣性法則 {#lin:sylvester-inertia keywords="over R a symmetric form is congruent to diag(1,...,1,-1,...,-1,0,...,0) with p, q unique; signature; over C only the rank matters" index="シルヴェスターの慣性法則|しるゔぇすたーのかんせいほうそく, 符号数|ふごうすう, 正定値|せいていち"}
$k=\mathbb{R}$ のとき、対称な $B$ は $\operatorname{diag}(I_{p},-I_{q},0)$ のグラム行列をもつ基底をもち、$(p,q)$（**符号数**）は $B$ だけで決まる：$p$ は $B$ が正定値（$q(v)>0$, $v\neq0$）になる部分空間の次元の最大値。$k=\mathbb{C}$（あるいは平方根がつねにとれる体）では $\operatorname{diag}(I_{r},0)$ にでき、階数 $r$ だけで決まる。
:::

::: proof
**Step 1（標準形）.** 直交基底で $q(b_{i})=c_{i}$。$c_{i}\neq0$ なら $b_{i}$ を $b_{i}/\sqrt{|c_{i}|}$（$\mathbb{C}$ では $b_{i}/\sqrt{c_{i}}$）に替え、並べ替える。

**Step 2（$p$ の特徴付け）.** 標準形の基底で $V_{+}=\langle b_{1},\dots,b_{p}\rangle$ は正定値で $\dim=p$。正定値な $W$ について $W\cap\langle b_{p+1},\dots,b_{n}\rangle=0$（後者の上では $q\le0$）なので $\dim W\le n-(n-p)=p$。よって $p$ は最大値で、基底によらない。$p+q=\operatorname{rank}B$ も基底によらないので $q$ も決まる。
:::

::: theorem シルヴェスターの判定法 {#lin:sylvester-criterion keywords="a real symmetric matrix is positive definite iff all leading principal minors are positive" index="シルヴェスターの判定法|しるゔぇすたーのはんていほう, 首座小行列式|しゅざしょうぎょうれつしき"}
実対称行列 $G\in M_{n}(\mathbb{R})$ について、$G$ が正定値（${}^{t}xGx>0$, $x\neq0$）$\iff$ すべての首座小行列式 $\det G_{[k],[k]}$（$k=1,\dots,n$）が正。
:::

::: proof
**Step 1（正定値なら行列式は正）.** 正定値な $G$ は慣性法則で $G={}^{t}PP$（$P$ 可逆）と書けるので $\det G=(\det P)^{2}>0$。$G_{[k],[k]}$ は $\mathbb{R}^{k}\subset\mathbb{R}^{n}$ への制限で正定値なので、⇒ が従う。

**Step 2（⇐：帰納法）.** $n$ についての帰納法。$G=\begin{pmatrix}G'&b\\{}^{t}b&c\end{pmatrix}$ とし、$G'$ は帰納法の仮定で正定値（とくに可逆）。$Q\defeq\begin{pmatrix}I&-G'^{-1}b\\0&1\end{pmatrix}$ について ${}^{t}QGQ=\operatorname{diag}(G',\,c-{}^{t}bG'^{-1}b)$（シューア補行列）。$\det G=\det G'(c-{}^{t}bG'^{-1}b)$ で、$\det G>0$, $\det G'>0$ から $c-{}^{t}bG'^{-1}b>0$。よって ${}^{t}QGQ$ は正定値で、$Q$ は可逆なので $G$ も正定値。
:::

## 交代形式 {#lin:sec-bf-alternating}

::: theorem シンプレクティック基底 {#lin:symplectic-basis keywords="every alternating form has a basis e_1, f_1, ..., e_m, f_m, z_1, ... with B(e_i, f_i) = 1 and all other pairings zero; the rank is even; nondegenerate alternating forms exist only in even dimension" index="シンプレクティック基底|しんぷれくてぃっくきてい, 交代形式の標準形|こうたいけいしきのひょうじゅんけい"}
任意の体上で、交代的な $B$ は基底 $e_{1},f_{1},\dots,e_{m},f_{m},z_{1},\dots,z_{n-2m}$ で、$B(e_{i},f_{i})=1=-B(f_{i},e_{i})$、他のすべての組で $0$ となるものをもつ。グラム行列は $J_{m}\oplus0$（$J_{m}=\bigoplus^{m}\begin{pmatrix}0&1\\-1&0\end{pmatrix}$）。とくに $\operatorname{rank}B=2m$ は偶数。
:::

::: proof
**Step 1（帰納法）.** $n$ についての帰納法。$B=0$ なら $m=0$。そうでなければ $B(e_{1},f)\neq0$ となる $e_{1},f$ があり、$f_{1}\defeq f/B(e_{1},f)$ とすると $B(e_{1},f_{1})=1$。交代的なので $B(e_{1},e_{1})=B(f_{1},f_{1})=0$、$B(f_{1},e_{1})=-1$（$0=B(e+f,e+f)=B(e,f)+B(f,e)$）。

**Step 2（分解）.** $W\defeq\langle e_{1},f_{1}\rangle$ のグラム行列 $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$ は行列式 $1$ で非退化、$e_{1},f_{1}$ は一次独立（$f_{1}=ce_{1}$ なら $B(e_{1},f_{1})=0$）。\ref{lin:orthogonal-complement} の 2 から $V=W\oplus W^{\perp}$。$W^{\perp}$ に帰納法を使う。
:::

::: theorem パフィアン {#lin:pfaffian keywords="the determinant of a generic alternating matrix of even size is the square of a polynomial Pf with integer coefficients, Pf(J) = 1; det of an alternating matrix of odd size is zero over any commutative ring; det(tP X P) = det(P)^2 det X, Pf(tP X P) = det P Pf X" index="パフィアン|ぱふぃあん"}
$n$ 次の**交代行列**（${}^{t}X=-X$ かつ対角成分が $0$）について：
1. $n$ が奇数なら、任意の可換環上で $\det X=0$。
2. $n=2m$ なら、整数係数の多項式 $\operatorname{Pf}\in\mathbb{Z}[x_{ij}:i<j]$ で、任意の可換環上の交代行列について $\det X=\operatorname{Pf}(X)^{2}$、$\operatorname{Pf}(J_{m})=1$ となるものがただ一つある（**パフィアン**）。
:::

::: proof
**Step 1（一般の交代行列）.** $R\defeq\mathbb{Z}[x_{ij}:i<j]$、$F\defeq\operatorname{Frac}R=\mathbb{Q}(x_{ij})$ とし、$X_{\mathrm{gen}}$ を $(i,j)$ 成分 $x_{ij}$, $(j,i)$ 成分 $-x_{ij}$（$i<j$）、対角 $0$ の行列とする。任意の可換環上の交代行列は $X_{\mathrm{gen}}$ への代入 $R\to A$ で得られ、$\det$ は代入と交換するので、$R$ で示せば十分。

**Step 2（1）.** $X_{\mathrm{gen}}$ は $F$ 上の交代形式のグラム行列で、\ref{lin:symplectic-basis} から階数は偶数。$n$ が奇数なら階数 $<n$、$\det X_{\mathrm{gen}}=0$（$R\subset F$）。

**Step 3（2：平方であること）.** $n=2m$ とする。$x_{ij}$ に $J_{m}$ の成分を代入すると $\det J_{m}=1\neq0$ なので、$\det X_{\mathrm{gen}}\neq0$、$F$ 上で非退化。\ref{lin:symplectic-basis} で $X_{\mathrm{gen}}={}^{t}PJ_{m}P$（$P\in\mathrm{GL}_{n}(F)$）と書け、$\det X_{\mathrm{gen}}=(\det P)^{2}$。

**Step 4（2：整数係数）.** $d\defeq\det X_{\mathrm{gen}}\in R$ が $F$ で平方 $s^{2}$（$s=\det P$）なので、$s$ は $R$ 上整（$T^{2}-d$ の根）。$R$ は一意分解環（\ref{ring:polynomial-ufd}）で正規（\ref{ring:ufd-normal}）なので $s\in R$。$s(J_{m})=\pm1$ なので、符号を選んで $\operatorname{Pf}\defeq\pm s$ とすれば $\operatorname{Pf}(J_{m})=1$。一意性：$\operatorname{Pf}'^{2}=\operatorname{Pf}^{2}$ なら整域 $R$ で $\operatorname{Pf}'=\pm\operatorname{Pf}$、正規化で符号が決まる。
:::

::: example 小さいパフィアン
$m=1$：$\operatorname{Pf}\begin{pmatrix}0&a\\-a&0\end{pmatrix}=a$（$\det=a^{2}$）。$m=2$：$\operatorname{Pf}=x_{12}x_{34}-x_{13}x_{24}+x_{14}x_{23}$ で、その平方が $4$ 次の交代行列の行列式に等しいことは直接展開で確かめられる。
:::

::: hypcheck
- **標数 $\neq2$**：\ref{lin:symmetric-diagonalization} で極化（$2$ で割る）と、$B\neq0\Rightarrow q\neq0$ に使う。標数 $2$ では交代形式（$q=0$ だが $B\neq0$）は対称でもあり、対角化できない（$\begin{pmatrix}0&1\\1&0\end{pmatrix}$ は $\mathbb{F}_{2}$ 上で対角行列と合同でない：対角形なら $q\neq0$ となる）。
- **実数の順序**：慣性法則で正負を分け、$\sqrt{|c_{i}|}$ をとるのに使う。$\mathbb{Q}$ 上では合同類の分類ははるかに細かく、各素数 $p$ での局所的な不変量（ハッセ不変量）が要ることが知られている（本サイト未収録）。
- **交代性の定義**：\ref{lin:symplectic-basis} では $B(v,v)=0$ を使う（歪対称だけでは標数 2 で不十分）。パフィアンでも「対角成分 $0$」を課した。
- **正規性**：\ref{lin:pfaffian} の Step 4 で、商体での平方根が多項式環に入ることに使う。
- **選択公理**：使わない。
:::

::: supplement
**前提を弱めると.** 標数 $2$ でも、2 次形式 $q$ そのもの（$q(cv)=c^{2}q(v)$ で $q(v+w)-q(v)-q(w)$ が双線形なもの）を基本にすると理論が整い、アーフ不変量が現れることが知られている。有限体上の非退化な 2 次形式は次元と判別式（$\det G$ の平方類）で分類されることも知られている。

**似た定理.** ウィットの消去定理（$q\perp q_{1}\cong q\perp q_{2}\Rightarrow q_{1}\cong q_{2}$、標数 $\neq2$）と、そこから定義されるウィット環が 2 次形式の代数的理論の出発点である（本サイト未収録）。$\operatorname{Pf}({}^{t}PXP)=\det P\operatorname{Pf}(X)$ も同じ一般の行列の議論で示せる。

**計算の観点.** 対称行列の対角化（合同変換）は、対称な行と列の基本変形を同時に行う「対称掃き出し法」で、$G=LD{}^{t}L$（$L$ は対角 1 の下三角）の形で計算できる（ピボットが $0$ でなければ）。正定値性の判定は、首座小行列式よりもコレスキー分解の成否で行うのが数値的に安定とされる。
:::

## 高い視点 {#lin:sec-bf-viewpoint}

::: remark 双線形形式は $V\to V^{*}$
双線形形式は線形写像 $B^{\flat}:V\to V^{*}$ と同じもので、合同 ${}^{t}PGP$ は「$V$ と $V^{*}$ を同時に基底変換する」ことにあたる（相似 $P^{-1}XP$ が $V\to V$ の変換であるのと対照的）。非退化な対称形式の自己同型群が直交群 $\mathrm{O}(B)$、非退化な交代形式の自己同型群がシンプレクティック群 $\mathrm{Sp}_{2m}$ で、古典群の分類はこの二種類（とエルミート形式によるユニタリ群）の形式の分類に帰着する。パフィアンは $\mathrm{Sp}_{2m}\subset\mathrm{SL}_{2m}$（$\det P=\operatorname{Pf}({}^{t}PJP)=\operatorname{Pf}J=1$）を与える。比喩で言えば、対称形式は空間に「長さの物差し」を、交代形式は「向き付きの面積の物差し」を与え、物差しの種類は前者では符号数、後者では階数だけで決まる。
:::

## 問題 {#lin:sec-bf-problems}

::: problem {#lin:prob-bf-signature}
$q(x,y,z)=xy+yz+zx$ の $\mathbb{R}$ 上の符号数を求めよ。
:::

::: solution
グラム行列は $G=\tfrac12\begin{pmatrix}0&1&1\\1&0&1\\1&1&0\end{pmatrix}$。$\det G=\tfrac18\cdot2=\tfrac14>0$ で階数 3。固有値は $\tfrac12(J-I)$ の固有値 $\tfrac12(3-1)=1$ と $\tfrac12(0-1)=-\tfrac12$（重複 2）。直交行列で対角化できる（対称行列のスペクトル定理：\ref{lin:page-inner-product}）ので符号数 $(1,2)$。あるいは直接：$x=u+v$, $y=u-v$ とすると $xy=u^{2}-v^{2}$, $z(x+y)=2uz$ で $q=(u+z)^{2}-v^{2}-z^{2}$、$(1,2)$。
:::

::: problem {#lin:prob-bf-pfaffian-transform}
$4$ 次の交代行列 $X$ と $P\in M_{4}(A)$ について $\operatorname{Pf}({}^{t}PXP)=\det P\cdot\operatorname{Pf}X$ を、$\det$ の乗法性とパフィアンの一意性の議論から導け。
:::

::: solution
一般の $X$, $P$ で示せばよい（$\mathbb{Z}[x_{ij},p_{ij}]$ は一意分解環）。${}^{t}PXP$ も交代行列で、$\operatorname{Pf}({}^{t}PXP)^{2}=\det({}^{t}PXP)=(\det P)^{2}\det X=(\det P\operatorname{Pf}X)^{2}$。整域なので $\operatorname{Pf}({}^{t}PXP)=\pm\det P\operatorname{Pf}X$ で、符号は $P=I$ を代入すると $+$（両辺は多項式で、$\pm$ は一つに決まる：二つの多項式の積 $(\operatorname{Pf}({}^{t}PXP)-\det P\operatorname{Pf}X)(\operatorname{Pf}({}^{t}PXP)+\det P\operatorname{Pf}X)=0$ の一方の因子が $0$ で、$P=I$ で第 2 因子は $2\operatorname{Pf}X\neq0$）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lin:sec-bf-exercises} にまとめた。
