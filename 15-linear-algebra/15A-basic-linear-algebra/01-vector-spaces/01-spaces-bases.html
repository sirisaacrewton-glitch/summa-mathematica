# ベクトル空間と基底 {#lin:page-spaces-bases keywords="vector space, subspace, span, sum and direct sum of subspaces, linear independence, basis, maximal linearly independent set, minimal generating set, existence of bases via Zorn's lemma, basis extension theorem, dimension, dimension of subspaces, complements, dimension formula for sums, Hamel basis, R over Q has dimension continuum, Blass theorem"}

体 $k$ 上のベクトル空間について、部分空間・和・直和と、基底の諸性質を述べる。中心は**基底の存在と延長**：一次独立な集合は基底に延長でき、生成系は基底を含む（有限次元なら選択公理なしに、一般にはツォルンの補題で）。次元の一意性（交換定理）は加群論で示してあるので引用し、ここでは部分空間の次元・補空間・和の次元公式を導く。

> 基底の延長のように体の上でしか成り立たない議論はここで体について示し、可換環・PID 上で何が残るかを注意する。

## 記法と定義の確認 {#lin:sec-vs-notation}

::: notation
- 体 $k$ 上の**ベクトル空間**とは $k$ 加群のこと（\ref{mod:module}）。部分加群を**部分空間**、加群の準同型を**線形写像**という。部分加群・生成された部分加群・直和・同型定理は \ref{mod:submodule-basic}, \ref{mod:generated-submodule}, \ref{mod:direct-sum}, \ref{mod:isomorphism-theorems}。
- 一次独立・基底・自由加群・標準基底 $k^{(I)}$ は \ref{mod:free-module}、自由加群の普遍性（基底の行き先を任意に決めると線形写像が一意に定まる）は \ref{mod:free-module-universal}。
- 交換定理型の補題（$m$ 個で張られる空間の $m+1$ 個の元は一次従属）と次元の一意性は \ref{mod:span-dependence}, \ref{mod:vector-space-dimension}。
- ツォルンの補題は \tref{set:zorn}。
- 元の族と部分集合を区別しないときは、一次独立な部分集合 $S$（相異なる元からなる族）として扱う。$\langle S\rangle$ は $S$ の張る部分空間（有限個の元の一次結合全体）。
- **選択公理**：無限次元の場合の基底の存在・延長・補空間の存在で使う（AC と明記）。有限生成の場合は使わない。
:::

## 部分空間と直和 {#lin:sec-vs-subspaces}

::: definition ベクトル空間の例と部分空間 {#lin:vector-space keywords="vector space over a field, subspace, span, examples k^n, polynomials, functions, sequences" index="ベクトル空間|べくとるくうかん, 部分空間|ぶぶんくうかん, 張る|はる"}
1. $k^{n}$、多項式環 $k[x]$、集合 $X$ 上の関数全体 $k^{X}$（点ごとの和とスカラー倍）、数列全体 $k^{\mathbb{N}}$、ほとんどすべて $0$ の数列全体 $k^{(\mathbb{N})}$ はベクトル空間。$K\supset k$ が体の拡大なら $K$ は $k$ 上のベクトル空間。
2. 部分集合 $W\subset V$ が $0$ を含み、和とスカラー倍で閉じているとき**部分空間**という。部分空間の任意の族の共通部分は部分空間で、$S\subset V$ を含む最小の部分空間は $\langle S\rangle$（$S$ の元の有限個の一次結合全体、$\langle\emptyset\rangle=0$）。$\langle S\rangle=V$ のとき $S$ は $V$ を**張る**（**生成系**）という。
:::

::: proposition 和と直和 {#lin:sum-direct-sum keywords="sum of subspaces, internal direct sum, W_1 + W_2 is direct iff W_1 cap W_2 = 0, direct sum of a family" index="部分空間の和|ぶぶんくうかんのわ, 内部直和|ないぶちょくわ"}
部分空間の族 $(W_{i})_{i\in I}$ について $\sum_{i}W_{i}\defeq\langle\bigcup W_{i}\rangle=\{\sum w_{i} : w_{i}\in W_{i},\ \text{ほとんどすべて }0\}$。次は同値で、このとき和は**直和**であるといい $\bigoplus W_{i}$ と書く。
1. 和の写像 $\bigoplus_{i}W_{i}\to V$（外部直和から）が単射。
2. $\sum w_{i}=0$（$w_{i}\in W_{i}$）なら、すべての $w_{i}=0$。
3. 各 $j$ について $W_{j}\cap\sum_{i\neq j}W_{i}=0$。

とくに二つの部分空間については、$W_{1}+W_{2}$ が直和 $\iff W_{1}\cap W_{2}=0$。
:::

::: proof
**Step 1（和の記述）.** 右辺は $\bigcup W_{i}$ を含む部分空間で、$\bigcup W_{i}$ を含む部分空間はその元をすべて含む。

**Step 2（1⇔2）.** 単射性は核が $0$ ということで、核は $\sum w_{i}=0$ となる $(w_{i})$ 全体。

**Step 3（2⇒3）.** $w_{j}=\sum_{i\neq j}w_{i}$ なら $w_{j}-\sum_{i\neq j}w_{i}=0$ で、2 からすべて $0$、特に $w_{j}=0$。

**Step 4（3⇒2）.** $\sum w_{i}=0$ で $w_{j}\neq0$ となる $j$ があれば、$w_{j}=-\sum_{i\neq j}w_{i}\in W_{j}\cap\sum_{i\neq j}W_{i}$ で 3 に反する。
:::

## 基底 {#lin:sec-vs-bases}

::: proposition 基底の特徴付け {#lin:basis-characterization keywords="basis iff maximal linearly independent iff minimal generating set iff unique representation" index="基底の特徴付け|きていのとくちょうづけ, 極大一次独立|きょくだいいちじどくりつ"}
$V$ の部分集合 $B$ について次は同値。
1. $B$ は基底（一次独立な生成系）。
2. $B$ は極大な一次独立集合（真に大きい一次独立集合がない）。
3. $B$ は極小な生成系（真部分集合は $V$ を張らない）。
4. $V$ の各元は $B$ の元の一次結合として一意に書ける。
:::

::: proof
**Step 1（鍵となる補題）.** 一次独立な $S$ と $v\notin\langle S\rangle$ について $S\cup\{v\}$ は一次独立：$cv+\sum c_{s}s=0$ で $c\neq0$ なら $v=-c^{-1}\sum c_{s}s\in\langle S\rangle$（**体であること**を使う）、$c=0$ なら $S$ の一次独立性からすべて $0$。

**Step 2（1⇒2）.** $B\subsetneq S$ で $v\in S\setminus B$ なら、$v\in\langle B\rangle$ なので $v-\sum c_{b}b=0$ は自明でない一次関係。

**Step 3（2⇒1）.** $v\notin\langle B\rangle$ があれば Step 1 で $B\cup\{v\}$ は一次独立で、極大性に反する。

**Step 4（1⇒3）.** $B'\subsetneq B$ が $V$ を張るなら、$b\in B\setminus B'$ は $B'$ の一次結合で、$B$ の一次独立性に反する。

**Step 5（3⇒1）.** 一次従属なら $\sum c_{b}b=0$, $c_{b_{0}}\neq0$ となり、$b_{0}=-c_{b_{0}}^{-1}\sum_{b\neq b_{0}}c_{b}b$ なので $B\setminus\{b_{0}\}$ も $V$ を張る：極小性に反する。

**Step 6（1⇔4）.** 生成系であることは「書ける」こと、一次独立は「$0$ の表し方が一意」で、差をとれば「各元の表し方が一意」と同値。
:::

::: theorem 基底の存在と延長 {#lin:basis-existence keywords="every linearly independent set is contained in a basis and every generating set contains a basis; finite case without choice; Zorn's lemma in general" index="基底の存在|きていのそんざい, 基底の延長定理|きていのえんちょうていり"}
$S\subset T\subset V$ で、$S$ は一次独立、$T$ は $V$ を張るとする。
1. $S\subset B\subset T$ となる基底 $B$ がある。$V$ が有限個の元で張られ、$T$ が有限なら選択公理を使わない。
2. （AC）一般の場合も 1 が成り立つ。とくに、すべてのベクトル空間は基底をもち、一次独立な集合は基底に延長でき、生成系は基底を含む。
:::

::: proof
**Step 1（1：有限の場合）.** $T$ が有限とする。$S\subset U\subset T$ で一次独立な $U$ のうち、元の個数が最大のもの $B$ をとる（有限個の候補）。$t\in T\setminus\langle B\rangle$ があれば、\ref{lin:basis-characterization} の Step 1 から $B\cup\{t\}$ は一次独立で $|B|$ の最大性に反する。よって $T\subset\langle B\rangle$、$V=\langle T\rangle\subset\langle B\rangle$ で、$B$ は基底。$V$ が有限生成で $T$ が無限の場合も、$V$ の有限な生成系 $T_{0}$ の各元は $T$ の有限個の一次結合なので、$T$ の有限部分集合 $T_{1}$ で $V$ を張るものがあり、$S$ は有限（\ref{mod:span-dependence}：$|S|\le|T_{0}|$）なので $T_{1}\cup S$ に適用すればよい。

**Step 2（2：ツォルンの補題）.** $\mathcal{P}\defeq\{U : S\subset U\subset T,\ U\text{ は一次独立}\}$ を包含で順序づける。$S\in\mathcal{P}$ なので空でない。鎖 $(U_{\lambda})$ の和集合 $U$ は一次独立：一次関係は有限個の元しか含まず、それらは鎖なのである一つの $U_{\lambda}$ に入るから。よって $U\in\mathcal{P}$ は上界で、\ref{set:zorn}から極大元 $B$ がある。

**Step 3（2：極大元は基底）.** $t\in T\setminus\langle B\rangle$ があれば $B\cup\{t\}\in\mathcal{P}$（Step 1 の補題）で極大性に反するので、$T\subset\langle B\rangle$、$B$ は $V$ を張る。後半は $T=V$ または $S=\emptyset$ とすればよい。
:::

::: definition 次元 {#lin:dimension keywords="dimension of a vector space as the cardinality of a basis; finite-dimensional" index="次元|じげん, 有限次元|ゆうげんじげん"}
（AC）$V$ の基底の濃度は基底によらない（\ref{mod:vector-space-dimension}）。これを $\dim_{k}V$ と書き、$V$ の**次元**という。$\dim V<\infty$ のとき**有限次元**という。有限次元の場合、次元の定義と一意性は選択公理を使わない（\ref{lin:basis-existence.1} と \ref{mod:span-dependence}）。
:::

## 次元の性質 {#lin:sec-vs-dimension}

::: theorem 部分空間・補空間・次元公式 {#lin:dimension-properties keywords="dim W <= dim V with equality iff W = V in finite dimension; every subspace has a complement; dim(W_1 + W_2) + dim(W_1 cap W_2) = dim W_1 + dim W_2; n independent vectors in an n-dimensional space form a basis" index="補空間|ほくうかん, 次元公式|じげんこうしき"}
（無限次元では AC）$V$ をベクトル空間、$W,W_{1},W_{2}$ を部分空間とする。
1. $\dim W\le\dim V$。$V$ が有限次元なら、$\dim W=\dim V\iff W=V$。
2. $W$ には**補空間** $W'$（$V=W\oplus W'$）があり、$\dim V=\dim W+\dim W'$。
3. $\dim(W_{1}+W_{2})+\dim(W_{1}\cap W_{2})=\dim W_{1}+\dim W_{2}$（濃度の和として）。
4. $\dim V=n<\infty$ なら、$n$ 個の一次独立な元、あるいは $V$ を張る $n$ 個の元は基底。
:::

::: proof
**Step 1（1）.** $W$ の基底 $B_{W}$ を $V$ の基底 $B\supset B_{W}$ に延長する（\ref{lin:basis-existence}）。$|B_{W}|\le|B|$。有限次元で等号なら $B=B_{W}$（有限集合の包含で個数が等しい）なので $V=\langle B\rangle=W$。

**Step 2（2）.** Step 1 の $B$ について $W'\defeq\langle B\setminus B_{W}\rangle$。$B$ が生成系なので $W+W'=V$、一次独立性から $W\cap W'=0$（共通の元を両方の基底で書くと、$B$ での表し方の一意性から係数が $0$）。$W'$ の基底は $B\setminus B_{W}$ で、$|B|=|B_{W}|+|B\setminus B_{W}|$。

**Step 3（3）.** $W_{1}\cap W_{2}$ の基底 $C$ を、$W_{1}$ の基底 $C\sqcup A_{1}$、$W_{2}$ の基底 $C\sqcup A_{2}$ に延長する。$C\sqcup A_{1}\sqcup A_{2}$ が $W_{1}+W_{2}$ の基底であることを示せば、両辺とも $2|C|+|A_{1}|+|A_{2}|$。生成は明らか。一次独立：$c+a_{1}+a_{2}=0$（$c\in\langle C\rangle$, $a_{i}\in\langle A_{i}\rangle$）なら $a_{2}=-(c+a_{1})\in W_{1}\cap W_{2}=\langle C\rangle$、$C\sqcup A_{2}$ の一次独立性から $a_{2}=0$（係数がすべて $0$）。すると $c+a_{1}=0$ で $C\sqcup A_{1}$ の一次独立性から $c=a_{1}=0$。各和の係数が $0$ なので一次独立。また $A_{1}\cap A_{2}=\emptyset$（共通元は $W_{1}\cap W_{2}$ に入るが $\langle C\rangle$ の外）。

**Step 4（4）.** $n$ 個の一次独立な元は基底に延長でき、基底の個数は $n$ なので延長は不要。$n$ 個の生成系は基底を含み、その個数は $n$ なので全体。
:::

::: example 次元の例 {#lin:dimension-examples keywords="dim k^n = n, k[x] has countable dimension, R over Q has dimension continuum, k^N versus k^(N)" index="ハメル基底|はめるきてい"}
1. $\dim k^{n}=n$（標準基底）、$\dim k[x]=\aleph_{0}$（基底 $1,x,x^{2},\dots$）。$k^{(\mathbb{N})}\cong k[x]$。
2. （AC）$\dim_{\mathbb{Q}}\mathbb{R}=2^{\aleph_{0}}$。基底（**ハメル基底**）$B$ について、$\mathbb{R}$ の元は $B$ の有限部分集合と $\mathbb{Q}$ 係数で決まるので $|\mathbb{R}|\le\max(\aleph_{0},|B|)$（$|B|$ が無限のとき、$B$ の有限部分集合の個数は $|B|$）。$|\mathbb{R}|=2^{\aleph_{0}}>\aleph_{0}$ なので $|B|\ge2^{\aleph_{0}}$、$B\subset\mathbb{R}$ から等号。
3. $k^{\mathbb{N}}$（数列全体）は $k^{(\mathbb{N})}$ より真に大きく、$\dim k^{\mathbb{N}}=|k|^{\aleph_{0}}$ であることが知られている（エルデシュ–カプランスキーの定理。本サイト未収録）。とくに $k^{\mathbb{N}}$ は可算な基底をもたない。
:::

::: remark 選択公理との関係
「すべてのベクトル空間が基底をもつ」は ZF 上で選択公理と同値であることが知られている（ブラス、1984 年。本サイト未収録）。また ZF では $\mathbb{R}$ の $\mathbb{Q}$ 上の基底の存在は証明できず、ハメル基底があるとルベーグ可測でない集合が作れることが知られている（\ref{set:page-choice} の文脈）。有限次元の線形代数は選択公理をまったく使わない。
:::

::: remark 環上では何が残るか
可換環 $A$ 上の加群では、\ref{lin:basis-characterization} と \ref{lin:basis-existence} は一般に成り立たない：$\mathbb{Z}$ 上 $\{2\}$ は一次独立だが基底に延長できず（$\mathbb{Z}$ の基底は $\{\pm1\}$）、$\{2,3\}$ は $\mathbb{Z}$ を張る極小な生成系だが基底でない。証明で $c^{-1}$ を使ったところ（\ref{lin:basis-characterization} の Step 1・5）が体であることの本質である。一方、次元（階数）の一意性は零環でない可換環上の自由加群でも成り立ち（\ref{mod:rank-invariance}）、PID 上では自由加群の部分加群が自由で、階数は増えない（\ref{mod:pid-submodule-free}）。補空間の存在は「部分加群が直和因子」という強い条件で、体以外ではめったに成り立たない（$2\mathbb{Z}\subset\mathbb{Z}$ は直和因子でない）。
:::

::: hypcheck
- **体であること**：一次独立な集合に元を加える補題（\ref{lin:basis-characterization} の Step 1）と、極小生成系が一次独立であること（Step 5）で、係数の逆元をとるのに使う。上の注意のとおり、環では偽。
- **選択公理**：無限次元の基底の存在・延長（ツォルンの補題）と、次元の一意性の無限の場合（\ref{mod:vector-space-dimension} の Step 3）で使う。有限生成なら不要（\ref{lin:basis-existence} の Step 1）。
- **有限次元**：\ref{lin:dimension-properties.1} の後半（$\dim W=\dim V\Rightarrow W=V$）で使う。無限次元では偽：$x\,k[x]\subsetneq k[x]$ はともに可算次元。
:::

::: supplement
**前提を変えると.** 斜体（非可換な体）上の左加群でも、証明は係数を左から掛けるように読み替えれば同じで、基底の存在・延長・次元の一意性がすべて成り立つ。

**似た定理.** 基底の延長と交換の性質だけを抽象化したものが**マトロイド**で、体の拡大の超越基底（\ref{fld:algebraic-independence}）も同じ構造をもつ。そのため超越次数の一意性も同じ議論で示される。

**計算の観点.** $k^{n}$ の有限個のベクトルが張る空間の基底は、ベクトルを並べた行列を行基本変形で階段形にすれば得られる（\ref{lin:page-rank-elimination}）。延長は、標準基底を後ろに付け加えて同じ操作をすればよい。
:::

## 高い視点 {#lin:sec-vs-viewpoint}

::: remark 体上の加群はすべて自由
\ref{lin:basis-existence} は「体上の加群はすべて自由」と言い換えられ、補空間の存在は「すべての部分加群は直和因子」すなわち**体上の加群の圏は半単純**であることを意味する（\ref{mod:page-modules} の言葉で）。したがってベクトル空間の短完全列はすべて分裂し、ベクトル空間の圏では Ext や Tor のような「ずれ」が消える。ベクトル空間の同型類が次元という一つの濃度だけで決まるのは、この半単純性と基底の存在の帰結である。比喩で言えば、ベクトル空間はどれも座標を入れて $k^{(B)}$ という標準的な部屋にでき、部屋の大きさ（次元）以外に個性がない；環上の加群は、座標の入らない歪んだ部屋（自由でない加群）を許すことで豊かな構造をもつ。
:::

## 問題 {#lin:sec-vs-problems}

::: problem {#lin:prob-vs-polynomial-subspace}
$V=k[x]_{\le3}$（3 次以下の多項式）と $W=\{f\in V : f(1)=0\}$ について、$W$ の基底と補空間を一つずつ求め、$\dim W=3$ を確かめよ。
:::

::: solution
$x-1$, $x^{2}-1$, $x^{3}-1\in W$ は一次独立（次数が異なる）。$f\in W$ を $f=a_{0}+a_{1}x+a_{2}x^{2}+a_{3}x^{3}$ と書くと $a_{0}=-(a_{1}+a_{2}+a_{3})$ なので $f=a_{1}(x-1)+a_{2}(x^{2}-1)+a_{3}(x^{3}-1)$：生成する。よって基底で $\dim W=3$。$\dim V=4$ なので補空間は 1 次元で、$1\notin W$ から $\langle1\rangle$ が補空間（\ref{lin:sum-direct-sum}：$W\cap\langle1\rangle=0$、次元の和が 4、\ref{lin:dimension-properties}）。
:::

::: problem {#lin:prob-vs-three-subspaces}
$V=k^{2}$ の 3 つの 1 次元部分空間 $W_{1},W_{2},W_{3}$（相異なる）について、どの二つの共通部分も $0$ だが、$W_{1}+W_{2}+W_{3}$ は直和でないことを示せ。
:::

::: solution
相異なる 1 次元部分空間の共通部分は $0$（共通部分は $W_{i}$ の部分空間で $\ne W_{i}$ なので次元 0）。$W_{1}+W_{2}$ は直和で次元 2、すなわち $V$ なので $W_{3}\cap(W_{1}+W_{2})=W_{3}\neq0$。\ref{lin:sum-direct-sum.3} から直和でない。（直和の判定は二つずつの共通部分では足りない。）
:::
