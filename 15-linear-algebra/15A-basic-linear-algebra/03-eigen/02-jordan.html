# ジョルダン標準形 {#lin:page-jordan keywords="generalized eigenspaces, decomposition into generalized eigenspaces, Jordan block, Jordan normal form for nilpotent endomorphisms, invariant complement of a cyclic subspace, existence and uniqueness of Jordan form, number of Jordan blocks from dim ker (X - lambda)^k, Young diagram, rational canonical form, invariant factors, presentation of k[t]-module by tI - X, Smith normal form of tI - X, similarity is independent of field extension, X similar to its transpose, Jordan-Chevalley decomposition"}

固有多項式が一次式に分解する行列は、**一般固有空間**の直和に分解し、各成分は「固有値＋冪零」になる。冪零な自己準同型は巡回部分空間とその不変な補空間に分けることで**ジョルダン細胞**の直和にでき、細胞の個数は $\dim\ker(X-\lambda)^{k}$ で決まる（**ジョルダン標準形**の存在と一意性）。一般の体上では、$V$ を $k[t]$ 加群とみて PID 上の構造定理（加群論）を使い、**有理標準形**と**単因子**を得る。単因子は $tI-X$ のスミス標準形として計算でき、そこから「相似は体の拡大によらない」「$X$ は ${}^{t}X$ と相似」が従う。最後に**ジョルダン–シュバレー分解**を示す。

> 固有多項式が分解する場合のジョルダン標準形はここで体について直接示し、PID 上の構造定理による一般論は \ref{mod:jordan-normal-form} と \ref{mod:pid-structure} を参照する。

## 記法と定義の確認 {#lin:sec-jd-notation}

::: notation
- 固有多項式・ケーリー–ハミルトン・最小多項式・同伴行列・核の分解・対角化・冪零行列は \ref{lin:char-poly}, \ref{lin:cayley-hamilton}, \ref{lin:minimal-polynomial}, \ref{lin:kernel-decomposition}, \ref{lin:diagonalizable}, \ref{lin:simultaneous-diagonalization}, \ref{lin:nilpotent-trace}。
- 双対空間は \ref{lin:dual-space}。行列式イデアルとその不変性は \ref{lin:fitting-ideals}。
- PID 上の有限生成加群の構造定理（単因子形・素因子形とその一意性）、スミス標準形、$k[t]$ 加群と相似の対応は \ref{mod:pid-structure}, \ref{mod:pid-structure-unique}, \ref{mod:smith-normal-form}, \ref{mod:prob-k-x-modules}。
- $J_{e}(\lambda)$ は $e$ 次のジョルダン細胞（対角に $\lambda$、その一つ上に $1$）。$V_{X}$ は $k^{n}$ に $t\cdot v=Xv$ で $k[t]$ 加群の構造を入れたもの。
- **選択公理**：使わない。
:::

## 一般固有空間 {#lin:sec-jd-generalized}

::: proposition 一般固有空間への分解 {#lin:generalized-eigenspaces keywords="if chi_X = prod (t - lambda)^{m_lambda} then k^n = direct sum of ker (X - lambda)^{m_lambda}, each invariant, of dimension m_lambda, with X - lambda nilpotent on it" index="一般固有空間|いっぱんこゆうくうかん, 広義固有空間|こうぎこゆうくうかん"}
$X\in M_{n}(k)$ の固有多項式が $\chi_{X}=\prod_{i=1}^{r}(t-\lambda_{i})^{m_{i}}$（$\lambda_{i}$ は相異なる）と分解するとき、$\tilde{V}_{i}\defeq\ker(X-\lambda_{i})^{m_{i}}$（**一般固有空間**）について
$$
k^{n}=\tilde{V}_{1}\oplus\dots\oplus\tilde{V}_{r},
$$
各 $\tilde{V}_{i}$ は $X$ で保たれ、$(X-\lambda_{i})|_{\tilde{V}_{i}}$ は冪零で、$\dim\tilde{V}_{i}=m_{i}$。
:::

::: proof
**Step 1（分解）.** $(t-\lambda_{i})^{m_{i}}$ はどの二つも互いに素なので、\ref{lin:kernel-decomposition} とケーリー–ハミルトンから $k^{n}=\ker\chi_{X}(X)=\bigoplus\tilde{V}_{i}$。$X$ は $(X-\lambda_{i})^{m_{i}}$ と可換なので $\tilde{V}_{i}$ を保ち、定義から $(X-\lambda_{i})^{m_{i}}$ は $\tilde{V}_{i}$ で $0$。

**Step 2（次元）.** $X_{i}\defeq X|_{\tilde{V}_{i}}$ について、$X_{i}-\lambda_{i}$ は冪零なので $\chi_{X_{i}}=(t-\lambda_{i})^{d_{i}}$（$d_{i}=\dim\tilde{V}_{i}$、\ref{lin:nilpotent-trace} を $X_{i}-\lambda_{i}$ に）。分解に沿った基底でブロック対角なので $\chi_{X}=\prod_{i}(t-\lambda_{i})^{d_{i}}$、$k[t]$ の一意分解から $d_{i}=m_{i}$。
:::

## 冪零自己準同型の標準形 {#lin:sec-jd-nilpotent}

::: lemma 巡回部分空間の不変な補空間 {#lin:cyclic-complement keywords="for nilpotent N with N^m = 0 and N^{m-1} v != 0, the cyclic subspace generated by v has an N-invariant complement" index="巡回部分空間|じゅんかいぶぶんくうかん"}
$N$ を有限次元空間 $V$ の冪零な自己準同型、$m$ を $N^{m}=0$ となる最小の数、$v\in V$ を $N^{m-1}v\neq0$ とする。$W\defeq\langle v,Nv,\dots,N^{m-1}v\rangle$ は $N$ で保たれる $m$ 次元の部分空間で、$N$ で保たれる補空間 $U$（$V=W\oplus U$）がある。
:::

::: proof
**Step 1（$W$ の次元）.** $\sum_{i<m}c_{i}N^{i}v=0$ で $c_{j}$ が最初の $0$ でない係数なら、$N^{m-1-j}$ を施して $c_{j}N^{m-1}v=0$、矛盾。よって $\dim W=m$。$N(N^{m-1}v)=0$ なので $N$ で保たれる。

**Step 2（補空間の候補）.** $N^{m-1}v\neq0$ なので、$\varphi\in V^{*}$ で $\varphi(N^{m-1}v)=1$ となるものをとる（基底を延長して双対基底の元をとる）。$U\defeq\{u\in V : \varphi(N^{i}u)=0\ (0\le i<m)\}$ とする。$u\in U$ なら $\varphi(N^{i}(Nu))=\varphi(N^{i+1}u)=0$（$i+1<m$、あるいは $N^{m}u=0$）なので $Nu\in U$。

**Step 3（$V=W\oplus U$）.** 線形写像 $\Phi:V\to k^{m}$, $u\mapsto(\varphi(N^{i}u))_{0\le i<m}$ の核が $U$ なので $\dim U\ge\dim V-m$。$\Phi|_{W}$ は単射：$w=\sum c_{j}N^{j}v$ について $\varphi(N^{i}w)=\sum_{j}c_{j}\varphi(N^{i+j}v)$ で、$i+j\ge m$ の項は $0$、$i+j=m-1$ の項は $c_{j}$。行列 $(\varphi(N^{i+j}v))_{i,j}$ は反対角線より下が $0$ で反対角線が $1$ なので可逆。よって $W\cap U=0$、$\dim W+\dim U\ge\dim V$ から $V=W\oplus U$。
:::

::: theorem ジョルダン標準形 {#lin:jordan-normal-form keywords="Jordan normal form: if chi_X splits, X is similar to a direct sum of Jordan blocks J_e(lambda), unique up to order; number of blocks of size >= k with eigenvalue lambda is dim ker (X - lambda)^k - dim ker (X - lambda)^{k-1}" index="ジョルダン標準形|じょるだんひょうじゅんけい, ジョルダン細胞|じょるだんさいぼう"}
$X\in M_{n}(k)$ の固有多項式が一次式に分解するとする（$k$ が代数的閉体なら常に成り立つ）。
1. $X$ はジョルダン細胞の直和 $\bigoplus_{s}J_{e_{s}}(\lambda_{s})$ と相似。
2. 固有値 $\lambda$ をもつ大きさ $\ge j$ の細胞の個数は $\dim\ker(X-\lambda)^{j}-\dim\ker(X-\lambda)^{j-1}$。とくに細胞の組 $\{(\lambda_{s},e_{s})\}$ は順序を除いて $X$ で決まる。
3. $\lambda$ の細胞の個数は $\dim V_{\lambda}$（幾何的重複度）、大きさの和は代数的重複度、最大の大きさは $\mu_{X}$ における $t-\lambda$ の指数。
:::

::: proof
**Step 1（冪零の場合）.** 冪零な $N$ について、$\dim V$ についての帰納法。$V\neq0$ なら \ref{lin:cyclic-complement} で $V=W\oplus U$。$W$ の基底 $(N^{m-1}v,\dots,Nv,v)$ について $N$ の行列は $J_{m}(0)$（各基底ベクトルを一つ前に写す）。$U$ に帰納法を使う。

**Step 2（1）.** \ref{lin:generalized-eigenspaces} の分解の各成分で $X-\lambda_{i}$ は冪零なので Step 1 を使い、$X=\lambda_{i}+N$ から各成分は $J_{e}(\lambda_{i})$ の直和。

**Step 3（2）.** $J_{e}(\mu)-\lambda$ は $\mu\neq\lambda$ なら可逆、$\mu=\lambda$ なら $J_{e}(0)$ で $\dim\ker J_{e}(0)^{j}=\min(j,e)$。よって $\dim\ker(X-\lambda)^{j}=\sum_{s:\lambda_{s}=\lambda}\min(j,e_{s})$ で、$j$ と $j-1$ の差は $e_{s}\ge j$ の細胞の個数。これらの個数から細胞の大きさの多重集合が決まる。

**Step 4（3）.** $j=1$ で細胞の個数は $\dim\ker(X-\lambda)=\dim V_{\lambda}$。大きさの和は $\dim\tilde{V}_{\lambda}=m_{\lambda}$。$J_{e}(\lambda)$ の最小多項式は $(t-\lambda)^{e}$（$J_{e}(0)^{e-1}\neq0$）で、直和の最小多項式は各成分の最小多項式の最小公倍数。
:::

## 有理標準形と単因子 {#lin:sec-jd-rational}

::: theorem 単因子と tI−X のスミス標準形 {#lin:invariant-factors keywords="V_X is presented by tI - X: 0 -> k[t]^n -> k[t]^n -> V_X -> 0; invariant factors of X are the nonunit diagonal entries of the Smith form of tI - X; rational canonical form direct sum of companion matrices; product is chi, last is mu" index="単因子（行列）|たんいんしぎょうれつ, 有理標準形|ゆうりひょうじゅんけい, フロベニウス標準形|ふろべにうすひょうじゅんけい"}
任意の体 $k$ と $X\in M_{n}(k)$ について：
1. $k[t]$ 加群の完全列 $0\to k[t]^{n}\xrightarrow{tI-X}k[t]^{n}\xrightarrow{\varepsilon}V_{X}\to0$ がある（$\varepsilon(e_{i})=e_{i}$, $\varepsilon(fe_{i})=f(X)e_{i}$）。
2. $tI-X$ のスミス標準形を $\operatorname{diag}(1,\dots,1,d_{1},\dots,d_{s})$（$d_{i}$ はモニックで単元でない、$d_{1}\mid\dots\mid d_{s}$）とすると $V_{X}\cong\bigoplus k[t]/(d_{i})$。$d_{i}$ を $X$ の**単因子**という。
3. $X$ は同伴行列の直和 $C(d_{1})\oplus\dots\oplus C(d_{s})$（**有理標準形**）と相似で、$\prod d_{i}=\chi_{X}$, $d_{s}=\mu_{X}$。
:::

::: proof
**Step 1（1：合成が 0、全射）.** $\varepsilon((tI-X)e_{j})=Xe_{j}-Xe_{j}=0$。$\varepsilon$ は $k^{n}\subset k[t]^{n}$ の上で恒等写像なので全射。

**Step 2（1：核は像）.** $te_{i}\equiv Xe_{i}$（$\operatorname{im}(tI-X)$ を法として）を繰り返すと、任意の $g\in k[t]^{n}$ は $g\equiv c$（$c\in k^{n}$）となる。$g\in\ker\varepsilon$ なら $0=\varepsilon(g)=\varepsilon(c)=c$ なので $g\in\operatorname{im}(tI-X)$。$tI-X$ の単射性は $\det(tI-X)=\chi_{X}\neq0$（$k[t]$ は整域、\ref{lin:adjugate}）。

**Step 3（2）.** スミス標準形 $U(tI-X)V=D$（$U,V\in\mathrm{GL}_{n}(k[t])$）のもとで、$V_{X}\cong\operatorname{coker}(tI-X)\cong\operatorname{coker}D=\bigoplus k[t]/(D_{ii})$。$D_{ii}=1$ の成分は $0$。$\det D$ は $\chi_{X}$ の単元倍で $0$ でないので、すべての $D_{ii}\neq0$。

**Step 4（3）.** $k[t]/(d)$ の $k$ 上の基底 $1,t,\dots,t^{\deg d-1}$ について $t$ の作用の行列は $C(d)$。$\chi$ は直和で積、$\chi_{C(d)}=d$（\ref{lin:minimal-polynomial.3}）。$\mu$ は各成分の最小多項式 $d_{i}$ の最小公倍数 $d_{s}$。
:::

::: corollary 相似の判定 {#lin:similarity-criterion keywords="X and Y are similar iff tI - X and tI - Y have the same determinantal divisors; similarity over an extension field implies similarity over k; X is similar to its transpose" index="相似の判定|そうじのはんてい"}
$X,Y\in M_{n}(k)$ について
1. $X$ と $Y$ が相似 $\iff$ 単因子が一致 $\iff$ すべての $j$ で $I_{j}(tI-X)=I_{j}(tI-Y)$（$k[t]$ のイデアル）。
2. 体の拡大 $K\supset k$ で $X$, $Y$ が $\mathrm{GL}_{n}(K)$ の元で相似なら、$\mathrm{GL}_{n}(k)$ の元で相似。
3. $X$ は ${}^{t}X$ と相似。
:::

::: proof
**Step 1（1）.** 相似 $\iff V_{X}\cong V_{Y}$（\ref{mod:prob-k-x-modules}）$\iff$ 単因子が一致（構造定理の一意性）。単因子は行列式イデアルから決まる（\ref{lin:fitting-ideals.2}）。

**Step 2（2）.** $I_{j}(tI-X)$ の生成元のモニックな最大公約数は、$k[t]$ で計算しても $K[t]$ で計算しても同じ（ユークリッドの互除法は係数体を拡げても同じ結果を与え、$\gcd$ は $k[t]$ に入る）。$K$ 上で相似なら $K[t]$ で一致し、したがって $k[t]$ でも一致する。

**Step 3（3）.** $tI-{}^{t}X={}^{t}(tI-X)$ で、転置しても小行列式の集合は変わらない（\ref{lin:det-characterization.4}）ので、行列式イデアルが一致する。
:::

## ジョルダン–シュバレー分解 {#lin:sec-jd-chevalley}

::: theorem ジョルダン–シュバレー分解 {#lin:jordan-chevalley keywords="if chi_X splits, X = S + N uniquely with S diagonalizable, N nilpotent, SN = NS; S and N are polynomials in X" index="ジョルダン–シュバレー分解|じょるだんしゅばれーぶんかい, 半単純部分|はんたんじゅんぶぶん"}
$\chi_{X}$ が一次式に分解するとき、対角化可能な $S$ と冪零な $N$ で $X=S+N$, $SN=NS$ となるものがただ一つあり、$S$, $N$ は $X$ の多項式（係数は $k$）で書ける。
:::

::: proof
**Step 1（存在）.** $\chi_{X}=\prod(t-\lambda_{i})^{m_{i}}$ とし、\ref{ring:chinese-remainder}で $p\in k[t]$ を $p\equiv\lambda_{i}\pmod{(t-\lambda_{i})^{m_{i}}}$（すべての $i$）ととる。$S\defeq p(X)$ は $\tilde{V}_{i}$ 上で $\lambda_{i}$ 倍（$p-\lambda_{i}$ は $(t-\lambda_{i})^{m_{i}}$ の倍数で、それは $\tilde{V}_{i}$ で $0$）なので対角化可能。$N\defeq X-S$ は各 $\tilde{V}_{i}$ 上で $X-\lambda_{i}$ で冪零。どちらも $X$ の多項式なので可換。

**Step 2（一意性）.** $X=S'+N'$ も条件をみたすとする。$S'$, $N'$ は $X=S'+N'$ と可換なので、$X$ の多項式 $S$, $N$ とも可換。$S-S'=N'-N$ の左辺は可換な対角化可能行列の差なので対角化可能（\ref{lin:simultaneous-diagonalization}）、右辺は可換な冪零行列の差なので冪零（二項展開で十分高い冪が $0$）。対角化可能かつ冪零なら固有値がすべて $0$ で対角化すると $0$、よって $S=S'$, $N=N'$。
:::

::: hypcheck
- **固有多項式の分解**：ジョルダン標準形（\ref{lin:jordan-normal-form}）とジョルダン–シュバレー分解の存在に使う。$\mathbb{R}$ 上の回転行列はジョルダン標準形をもたないが、有理標準形 $C(t^{2}+1)$ はもつ（\ref{lin:invariant-factors} は任意の体で成り立つ）。
- **体であること**：\ref{lin:cyclic-complement} で双対空間の元 $\varphi$ をとり、補空間の次元を数えるのに使う。PID 上では「巡回部分加群の補空間」は一般に存在せず（$\mathbb{Z}/4\supset2\mathbb{Z}/4$）、構造定理の証明はスミス標準形による。
- **一意性の範囲**：ジョルダン標準形は細胞の順序を除いて一意で、基底（変換行列 $P$）は一意でない。
- **完全体**：ジョルダン–シュバレー分解は、固有多項式が分解しなくても、$k$ が完全体なら「$S$ は代数閉包上で対角化可能」という形で成り立つことが知られている（本サイト未収録）。完全でない体では成り立たない例がある。
- **選択公理**：使わない。
:::

::: supplement
**前提を弱めると.** 単因子の理論（\ref{lin:invariant-factors}）は任意の体で成り立ち、PID $k[t]$ 上の構造定理の一例である。素因子形（初等因子）で書くと、既約多項式 $q$ の冪 $q^{e}$ ごとに「一般化されたジョルダン細胞」（$C(q)$ を対角に並べ、その下に $1$ をつないだもの）が得られる。

**似た定理.** 有限群の表現では、同じ「部分空間の不変な補空間」の議論が\ref{mod:maschke}で、半単純性を与える。リー代数では、ジョルダン–シュバレー分解は抽象ジョルダン分解として一般化される。

**計算の観点.** ジョルダン標準形は数値的に不安定（行列のわずかな摂動で細胞の構造が変わる）で、浮動小数点計算では使われず、代わりにシューア分解（ユニタリ三角化、\ref{lin:page-inner-product}）が使われる。厳密な計算では、$tI-X$ のスミス標準形（$k[t]$ 上のユークリッド互除法）から単因子を求めるのが確実である。
:::

## 高い視点 {#lin:sec-jd-viewpoint}

::: remark 相似類は $k[t]$ 加群の同型類
$M_{n}(k)$ への $\mathrm{GL}_{n}(k)$ の共役作用の軌道（相似類）は、$n$ 次元の $k[t]$ 加群の同型類と一対一で、PID 上の構造定理がそれを単因子の列で完全に分類する。ジョルダン標準形は「一般固有空間（$\operatorname{Spec}k[t]$ の点ごとの局所化）に分け、各点でヤング図形（細胞の大きさの分割）を与える」分類で、\ref{lin:jordan-normal-form.2} は分割を $\dim\ker$ の差から読む公式である。冪零行列の相似類が $n$ の分割と一対一であることは、対称群の表現論や旗多様体の幾何（シュプリンガー対応）の出発点になっている。比喩で言えば、行列の相似類は、各固有値という「部屋」ごとに積まれた積み木（ジョルダン細胞）の形で、その形は「何回 $X-\lambda$ を掛けると消えるか」を数えるだけで読み取れる。
:::

## 問題 {#lin:sec-jd-problems}

::: problem {#lin:prob-jd-three}
$X=\begin{pmatrix}2&1&0\\0&2&0\\0&0&2\end{pmatrix}$ と $Y=\begin{pmatrix}2&1&0\\0&2&1\\0&0&2\end{pmatrix}$ は固有多項式が等しいが相似でないことを、$\dim\ker(\cdot-2)$ と単因子で確かめよ。
:::

::: solution
$\chi=(t-2)^{3}$ は共通。$\dim\ker(X-2)=2$, $\dim\ker(Y-2)=1$ で、\ref{lin:jordan-normal-form.3} から細胞の個数が違う（$X=J_{2}(2)\oplus J_{1}(2)$, $Y=J_{3}(2)$）。単因子は $X$ が $(t-2),(t-2)^{2}$、$Y$ が $(t-2)^{3}$ だけ（最小多項式 $(t-2)^{2}$ と $(t-2)^{3}$）。
:::

::: problem {#lin:prob-jd-power}
$X=J_{n}(\lambda)$（$\lambda\neq0$）について $X^{m}$ を二項展開で求めよ。また、$J_{3}(0)^{2}$ のジョルダン標準形を求めよ。
:::

::: solution
$X=\lambda I+N$, $N=J_{n}(0)$, $IN=NI$ なので $X^{m}=\sum_{j=0}^{n-1}\binom{m}{j}\lambda^{m-j}N^{j}$（$N^{n}=0$）、すなわち $(i,i+j)$ 成分が $\binom{m}{j}\lambda^{m-j}$ の上三角行列。$N=J_{3}(0)$ について $N^{2}=E_{13}$ で、$\dim\ker N^{2}=2$, $\dim\ker N^{4}=3$。冪零で $\dim\ker=2$ なので細胞は 2 個、大きさの和 3 で、$(N^{2})^{2}=0$ から最大の大きさ 2：$J_{2}(0)\oplus J_{1}(0)$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{lin:sec-jd-exercises} にまとめた。
