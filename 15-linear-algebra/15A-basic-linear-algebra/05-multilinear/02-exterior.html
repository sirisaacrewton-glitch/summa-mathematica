# 外積代数と対称代数 {#lin:page-exterior keywords="exterior algebra, wedge product, exterior powers, universal property for alternating multilinear maps, graded commutativity, basis of exterior powers of a free module, binomial rank, top exterior power and determinant, matrix of Lambda^k f is the matrix of k-minors, Cauchy-Binet via functoriality, characteristic polynomial coefficients are traces of exterior powers, linear independence via wedge, duality Lambda^k(V^*) = (Lambda^k V)^*, decomposable bivectors, Plucker relation, symmetric algebra, polynomial ring as symmetric algebra"}

外積代数 $\Lambda(M)$ はテンソル代数を $m\otimes m$ で割ったもので、$\Lambda^{k}M$ は交代 $k$ 重線形写像の普遍的な行き先である。自由加群 $A^{n}$ では $\Lambda^{k}$ は階数 $\binom{n}{k}$ の自由加群で、その基底を作るのに行列式（小行列式）を使う。逆に外積の言葉で、行列式は $\Lambda^{n}f$ のスカラー、小行列式は $\Lambda^{k}f$ の行列成分、固有多項式の係数は $\operatorname{tr}\Lambda^{k}f$ になり、コーシー–ビネは関手性そのものになる。2 次の外積の分解可能性の条件（プリュッカー関係式）とパフィアンの関係、対称代数と多項式環の同一視も述べる。

> 資料によらず、標準的な議論で書いた。分担の方針に従い、最初から可換環上で述べる（体を使うのは一次独立性の判定と分解可能性だけ）。

## 記法と定義の確認 {#lin:sec-ex-notation}

::: notation
- テンソル代数とその普遍性、多重線形写像の普遍性は \ref{lin:tensor-algebra}, \ref{lin:multilinear-universal}。交代多重線形写像とその性質（置換で符号倍、一次従属なら $0$）は \ref{lin:alternating-form}, \ref{lin:alternating-consequences}。
- 行列式の特徴付け・自己準同型の行列式・小行列式・コーシー–ビネ・固有多項式の係数（主小行列式の和）・パフィアン・シンプレクティック基底は \ref{lin:det-characterization}, \ref{lin:det-endomorphism}, \ref{lin:cauchy-binet}, \ref{lin:char-poly}, \ref{lin:pfaffian}, \ref{lin:symplectic-basis}。
- 両側イデアルによる剰余環は \ref{mod:two-sided-quotient}。$A$ は可換環、$b_{I}\defeq b_{i_{1}}\wedge\dots\wedge b_{i_{k}}$（$I=\{i_{1}<\dots<i_{k}\}$）。
- **選択公理**：使わない。
:::

## 外積代数 {#lin:sec-ex-exterior}

::: definition 外積代数 {#lin:exterior-algebra keywords="exterior algebra Lambda(M) = T(M)/(m tensor m), wedge product, exterior powers Lambda^k M, graded commutativity" index="外積代数|がいせきだいすう, 外積|がいせき, ウェッジ積|うぇっじせき, 外冪|がいべき"}
$I\subset T(M)$ を $\{m\otimes m : m\in M\}$ で生成される両側イデアルとし、$\Lambda(M)\defeq T(M)/I$ を**外積代数**、積を $\wedge$（**外積**）と書く。$I$ は斉次元で生成されるので $\Lambda(M)=\bigoplus_{k}\Lambda^{k}M$（$\Lambda^{k}M\defeq M^{\otimes k}/(I\cap M^{\otimes k})$、**$k$ 次外冪**）と次数付けられ、$\Lambda^{0}M=A$, $\Lambda^{1}M=M$。
:::

::: theorem 外積代数の普遍性と基本性質 {#lin:exterior-universal keywords="alternating k-linear maps M^k -> P correspond to linear maps Lambda^k M -> P; linear maps phi: M -> B with phi(m)^2 = 0 extend uniquely to algebra homomorphisms; omega wedge eta = (-1)^{kl} eta wedge omega; functoriality Lambda^k f" index="外積代数の普遍性|がいせきだいすうのふへんせい"}
1. $(m_{1},\dots,m_{k})\mapsto m_{1}\wedge\dots\wedge m_{k}$ は交代 $k$ 重線形で、交代 $k$ 重線形写像 $\beta:M^{k}\to P$ に対し $\bar{\beta}(m_{1}\wedge\dots\wedge m_{k})=\beta(m_{1},\dots,m_{k})$ となる線形写像がただ一つある。
2. 結合的 $A$ 代数 $B$ と線形写像 $\varphi:M\to B$ で $\varphi(m)^{2}=0$（すべての $m$）となるものは、$A$ 代数の準同型 $\Lambda(M)\to B$ に一意に延びる。
3. $\omega\in\Lambda^{k}M$, $\eta\in\Lambda^{l}M$ について $\omega\wedge\eta=(-1)^{kl}\eta\wedge\omega$。
4. 線形写像 $f:M\to N$ は $\Lambda^{k}f:m_{1}\wedge\dots\wedge m_{k}\mapsto f(m_{1})\wedge\dots\wedge f(m_{k})$ を誘導し、$\Lambda^{k}(gf)=\Lambda^{k}g\circ\Lambda^{k}f$。
:::

::: proof
**Step 1（1）.** 交代性：$m_{p}=m_{q}$ なら、$m\wedge w\wedge m=-m\wedge m\wedge w=0$ の形の議論（隣接する等しい元は $m\otimes m\in I$ で $0$、\ref{lin:alternating-consequences} の 2 から交代的）。多重線形は $T(M)$ から。$\beta$ は \ref{lin:multilinear-universal} で $M^{\otimes k}\to P$ を誘導し、$I\cap M^{\otimes k}$ は $x\otimes m\otimes m\otimes y$（$x,y$ は純テンソル）の形の元で張られ、それは $\beta$ の交代性で $0$ に写るので、$\Lambda^{k}M$ を経由する。

**Step 2（2）.** \ref{lin:tensor-algebra} の $\Phi:T(M)\to B$ は $m\otimes m\mapsto\varphi(m)^{2}=0$ なので $I$ を消し、$\Lambda(M)$ を経由する。一意性は $\Lambda(M)$ が $M$ で生成されることから。

**Step 3（3）.** $m\wedge m'=-m'\wedge m$（$0=(m+m')\wedge(m+m')$）。$\omega$, $\eta$ が純な場合、$\eta$ の $l$ 個の因子を $\omega$ の $k$ 個の因子の前に一つずつ移すと $kl$ 回の入れ替えで符号 $(-1)^{kl}$。線形性で一般の場合。

**Step 4（4）.** $(m_{1},\dots,m_{k})\mapsto f(m_{1})\wedge\dots\wedge f(m_{k})$ は交代 $k$ 重線形なので 1 から。合成は純元上で確かめる。
:::

::: theorem 自由加群の外冪の基底 {#lin:exterior-basis keywords="for M free with basis b_1..b_n, Lambda^k M is free with basis b_I for increasing I, rank binomial(n,k); Lambda^k M = 0 for k > n; coordinates of a wedge are maximal minors" index="外冪の基底|がいべきのきてい"}
$M$ を基底 $b_{1},\dots,b_{n}$ の自由加群とする。$\Lambda^{k}M$ は $\{b_{I} : |I|=k\}$ を基底とする階数 $\binom{n}{k}$ の自由加群で、$k>n$ なら $\Lambda^{k}M=0$。$v_{j}=\sum_{i}x_{ij}b_{i}$（$X=(x_{ij})\in M_{n\times k}(A)$）なら
$$
v_{1}\wedge\dots\wedge v_{k}=\sum_{|I|=k}\det X_{I,[k]}\,b_{I}.
$$
:::

::: proof
**Step 1（生成と展開式）.** $v_{1}\wedge\dots\wedge v_{k}$ を多重線形に展開すると $\sum_{\phi}\prod_{j}x_{\phi(j)j}\,b_{\phi(1)}\wedge\dots\wedge b_{\phi(k)}$。単射でない $\phi$ の項は $0$、単射な $\phi$ を像 $I$ と置換に分けると（\ref{lin:cauchy-binet} の Step 2 と同じ）$\sum_{I}\det X_{I,[k]}b_{I}$。とくに $b_{I}$ が生成し、$k>n$ なら $0$。

**Step 2（一次独立）.** $J$（$|J|=k$）について $\beta_{J}(v_{1},\dots,v_{k})\defeq\det X_{J,[k]}$（座標を並べた行列の行 $J$ の小行列式）は交代 $k$ 重線形（\ref{lin:det-characterization} の 1）なので、線形写像 $\bar{\beta}_{J}:\Lambda^{k}M\to A$ を誘導し、$\bar{\beta}_{J}(b_{I})=\det(I_{n})_{J,I}=\delta_{IJ}$。$\sum c_{I}b_{I}=0$ に $\bar{\beta}_{J}$ を施すと $c_{J}=0$。
:::

::: theorem 外冪と行列式・小行列式・固有多項式 {#lin:exterior-determinant keywords="Lambda^n f is multiplication by det f; the matrix of Lambda^k f in the basis b_I consists of k-minors; Cauchy-Binet follows from functoriality; tr Lambda^k f = e_k(f); chi_f(t) = sum (-1)^k tr(Lambda^k f) t^{n-k}" index="外冪と行列式|がいべきとぎょうれつしき"}
$M$ を階数 $n$ の自由加群、$f\in\operatorname{End}M$（行列 $X$）とする。
1. $\Lambda^{n}M\cong A$ で、$\Lambda^{n}f$ は $\det f$ 倍（**(D8)**）。
2. $\Lambda^{k}f$ の基底 $b_{I}$ に関する行列の $(I,J)$ 成分は $\det X_{I,J}$。とくに $\Lambda^{k}(XY)=\Lambda^{k}X\,\Lambda^{k}Y$ はコーシー–ビネの公式（\ref{lin:cauchy-binet}）にほかならない。
3. $\operatorname{tr}\Lambda^{k}f=e_{k}(f)$（主小行列式の和）で、$\chi_{f}(t)=\sum_{k=0}^{n}(-1)^{k}\operatorname{tr}(\Lambda^{k}f)\,t^{n-k}$。
:::

::: proof
**Step 1（2）.** $\Lambda^{k}f(b_{J})=f(b_{j_{1}})\wedge\dots\wedge f(b_{j_{k}})$ で、$f(b_{j})$ の座標は $X$ の第 $j$ 列。\ref{lin:exterior-basis} の展開式から係数は $\det X_{I,J}$。関手性 $\Lambda^{k}(gf)=\Lambda^{k}g\Lambda^{k}f$ を行列成分で書くと $\det(XY)_{I,J}=\sum_{K}\det X_{I,K}\det Y_{K,J}$。

**Step 2（1）.** $k=n$ では基底は $b_{[n]}$ ただ一つで、成分は $\det X$。

**Step 3（3）.** 2 から $\operatorname{tr}\Lambda^{k}f=\sum_{I}\det X_{I,I}=e_{k}(X)$、\ref{lin:char-poly} の 1。
:::

::: corollary 一次独立性と双対性 {#lin:exterior-independence keywords="over a field v_1..v_k are independent iff v_1 wedge ... wedge v_k != 0; two independent k-tuples span the same subspace iff wedges are proportional; Lambda^k(M^*) = (Lambda^k M)^* via det(phi_i(v_j))" index="外積と一次独立|がいせきといちじどくりつ"}
1. 体上で $v_{1},\dots,v_{k}$ が一次独立 $\iff v_{1}\wedge\dots\wedge v_{k}\neq0$。一次独立な二つの組が同じ部分空間を張る $\iff$ 外積が $0$ でないスカラー倍の関係にある。
2. $M$ が有限生成自由なら、$\langle\varphi_{1}\wedge\dots\wedge\varphi_{k},v_{1}\wedge\dots\wedge v_{k}\rangle\defeq\det(\varphi_{i}(v_{j}))$ は完全な対を与え、$\Lambda^{k}(M^{*})\cong(\Lambda^{k}M)^{*}$。
:::

::: proof
**Step 1（1）.** 従属なら \ref{lin:alternating-consequences} の 1 から $0$。独立なら基底に延長し（\ref{lin:basis-existence}）、それは基底 $b_{I}$ の一つなので $\neq0$（\ref{lin:exterior-basis}）。同じ部分空間 $W$ を張れば、$v'_{j}=\sum P_{ij}v_{i}$ で外積は $\det P$ 倍（$\Lambda^{k}W$ で 1 を使う）。逆に $v'_{1}\wedge\dots\wedge v'_{k}=c\,v_{1}\wedge\dots\wedge v_{k}$（$c\neq0$）なら、各 $v'_{j}$ について $v'_{j}\wedge v_{1}\wedge\dots\wedge v_{k}=c^{-1}v'_{j}\wedge v'_{1}\wedge\dots\wedge v'_{k}=0$ なので $v'_{j}\in\langle v_{1},\dots,v_{k}\rangle$。

**Step 2（2）.** 対は各変数について交代多重線形なので well-defined な双線形写像 $\Lambda^{k}M^{*}\times\Lambda^{k}M\to A$ を与える。双対基底について $\langle b^{*}_{I},b_{J}\rangle=\det(b_{i}^{*}(b_{j}))_{i\in I,j\in J}=\delta_{IJ}$ なので、$\Lambda^{k}M^{*}\to(\Lambda^{k}M)^{*}$ は基底を双対基底に写す同型。
:::

## 分解可能性とプリュッカー関係式 {#lin:sec-ex-plucker}

::: theorem 2 次の外積の分解可能性 {#lin:plucker keywords="a bivector is decomposable iff omega wedge omega = 0 (characteristic not 2); rank of a bivector; Plucker relation p12 p34 - p13 p24 + p14 p23 = 0 for 2-planes in a 4-dimensional space; Grassmannian Gr(2,4) is a quadric" index="プリュッカー関係式|ぷりゅっかーかんけいしき, 分解可能|ぶんかいかのう, グラスマン多様体|ぐらすまんたようたい"}
標数が $2$ でない体上の有限次元空間 $V$ について、$\omega\in\Lambda^{2}V$ が分解可能（$\omega=v\wedge w$）$\iff\omega\wedge\omega=0$。とくに $\dim V=4$, $\omega=\sum_{i<j}p_{ij}e_{i}\wedge e_{j}$ について、$\omega$ が分解可能 $\iff p_{12}p_{34}-p_{13}p_{24}+p_{14}p_{23}=0$（**プリュッカー関係式**）。
:::

::: proof
**Step 1（標準形）.** $\Lambda^{2}V\cong\Lambda^{2}(V^{**})\cong(\Lambda^{2}V^{*})^{*}$ で、$\omega$ は $V^{*}$ 上の交代形式 $(\varphi,\psi)\mapsto\langle\varphi\wedge\psi,\omega\rangle$ と対応する（\ref{lin:exterior-independence} の 2）。シンプレクティック基底（\ref{lin:symplectic-basis}）を双対に戻すと、$V$ の基底 $e_{1},f_{1},\dots,e_{m},f_{m},\dots$ で $\omega=\sum_{i=1}^{m}e_{i}\wedge f_{i}$ と書ける（基底変換で $\omega$ の係数の行列は合同変換される）。

**Step 2（判定）.** $a_{i}\defeq e_{i}\wedge f_{i}$ は偶数次なので互いに可換で $a_{i}\wedge a_{i}=0$。$\omega\wedge\omega=2\sum_{i<j}a_{i}\wedge a_{j}$ で、$a_{i}\wedge a_{j}$（$i<j$）は異なる基底元 $e_{i}\wedge f_{i}\wedge e_{j}\wedge f_{j}$ なので、$\omega\wedge\omega=0\iff m\le1$（標数 $\neq2$）$\iff\omega$ は分解可能（$m=1$ なら $e_{1}\wedge f_{1}$、$m=0$ なら $0$；$m\ge2$ なら $\omega\wedge\omega\neq0$ だが分解可能なら $v\wedge w\wedge v\wedge w=0$）。

**Step 3（$\dim V=4$）.** $\omega\wedge\omega=2(p_{12}p_{34}-p_{13}p_{24}+p_{14}p_{23})\,e_{1}\wedge e_{2}\wedge e_{3}\wedge e_{4}$（$e_{i}\wedge e_{j}\wedge e_{k}\wedge e_{l}$ を並べ替える符号を数える）。この係数はパフィアン $\operatorname{Pf}(p_{ij})$（\ref{lin:pfaffian} の例）である。
:::

## 対称代数 {#lin:sec-ex-symmetric}

::: theorem 対称代数 {#lin:symmetric-algebra keywords="symmetric algebra Sym(M) = T(M)/(m tensor n - n tensor m); universal for commutative algebras; Sym(A^n) = A[x_1..x_n]; Sym^k of a free module of rank n has rank binomial(n+k-1,k)" index="対称代数|たいしょうだいすう, 対称冪|たいしょうべき"}
$\operatorname{Sym}(M)\defeq T(M)/(m\otimes n-n\otimes m)$ を**対称代数**とする。
1. $\operatorname{Sym}(M)$ は可換な次数付き $A$ 代数で、可換 $A$ 代数 $B$ への線形写像 $M\to B$ は $A$ 代数の準同型 $\operatorname{Sym}(M)\to B$ に一意に延びる。
2. $M$ が基底 $b_{1},\dots,b_{n}$ の自由加群なら $\operatorname{Sym}(M)\cong A[x_{1},\dots,x_{n}]$（$b_{i}\mapsto x_{i}$）で、$\operatorname{Sym}^{k}M$ は階数 $\binom{n+k-1}{k}$ の自由加群。
:::

::: proof
**Step 1（1）.** 生成元 $m$, $n$ が可換なので、生成される代数は可換。普遍性は \ref{lin:tensor-algebra} の $\Phi$ が、$B$ が可換なので $m\otimes n-n\otimes m$ を消すことから。

**Step 2（2）.** 多項式環の普遍性（可換 $A$ 代数 $B$ と $n$ 個の元の組と準同型 $A[x]\to B$ の対応）と 1 の普遍性（$\operatorname{Hom}_{A}(A^{n},B)=B^{n}$）を比べると、$\operatorname{Sym}(A^{n})$ と $A[x_{1},\dots,x_{n}]$ は同じ普遍性をもつので同型（米田）。$k$ 次の単項式の個数は $\binom{n+k-1}{k}$。
:::

::: remark 外積代数の他の性質
1. $\Lambda(M\oplus N)\cong\Lambda(M)\hat{\otimes}\Lambda(N)$（次数付きテンソル積、符号付きの積）で、とくに $\Lambda^{k}(M\oplus N)\cong\bigoplus_{i+j=k}\Lambda^{i}M\otimes\Lambda^{j}N$ であることが知られている（本サイト未収録。自由加群では基底の数え上げ $\binom{p+q}{k}=\sum\binom{p}{i}\binom{q}{j}$ と一致する）。
2. 標数 $0$ では、$\Lambda^{k}V$ と $\operatorname{Sym}^{k}V$ は $V^{\otimes k}$ の中の交代テンソル・対称テンソルの部分空間（$S_{k}$ の作用の符号表現・自明表現の成分）と同一視できるが、正標数では商と部分が一致しない。
:::

::: hypcheck
- **交代性の定義**：外積代数は $m\otimes m$（$m\wedge m=0$）で割った。$m\otimes n+n\otimes m$ だけで割ると、標数 $2$ では対称代数と同じになり、行列式の理論が作れない。
- **自由であること**：\ref{lin:exterior-basis} と \ref{lin:exterior-determinant} で基底を使う。自由でない加群では $\Lambda^{k}M$ は一般に複雑で、$\Lambda^{2}(\mathbb{Z}/2\oplus\mathbb{Z}/2)\cong\mathbb{Z}/2$、$\Lambda^{2}(\mathbb{Q})=0$（$\mathbb{Z}$ 加群として）。
- **標数 $\neq2$**：\ref{lin:plucker} の Step 2 で係数 $2$ を消せないことに使う。標数 $2$ では $\omega\wedge\omega=0$ はつねに成り立ち、分解可能性の判定は $\omega$ の「割った平方」（分割冪）$\omega^{(2)}$ で行う。
- **選択公理**：使わない（\ref{lin:exterior-independence} の 1 は有限次元の基底の延長）。
:::

::: supplement
**前提を弱めると.** 有限生成射影加群 $P$ について $\Lambda^{\mathrm{rank}}P$ は階数 1 の射影加群（可逆加群）で、$\det P$ と書かれ、ピカール群 $\operatorname{Pic}$ への写像 $K_{0}\to\operatorname{Pic}$ を与えることが知られている（\ref{ag:picard-group} の加群版）。

**似た定理.** 一般の $k$ について、$\Lambda^{k}V$ の分解可能な元の全体（グラスマン多様体 $\mathrm{Gr}(k,V)$ の錐）はプリュッカー関係式（2 次式）で定まる射影多様体であることが知られている。微分幾何では、余接空間の外積代数の切断が微分形式で、外微分が de Rham 複体を作る（多様体論で扱う予定）。

**計算の観点.** \ref{lin:exterior-basis} の展開式から、外積の計算は小行列式の計算に帰着する。$\mathbb{R}^{3}$ では $\Lambda^{2}\mathbb{R}^{3}\cong\mathbb{R}^{3}$（ホッジ双対、\ref[多重線形代数の応用]{lin:page-multilinear-applications}）を通して、外積はベクトル積 $v\times w$ になる。
:::

## 高い視点 {#lin:sec-ex-viewpoint}

::: remark 外積代数は交代性の普遍的な受け皿
$\Lambda^{k}$ は加群の圏からそれ自身への関手で、「交代 $k$ 重線形写像」を表現する。行列式は $\Lambda^{n}$ を階数 1 の加群に施したときに残る唯一の数で、小行列式・コーシー–ビネ・固有多項式の係数はすべて「$\Lambda^{k}$ が関手であること」と「$\Lambda^{k}A^{n}$ の基底」の二つから出てくる。対称代数が「可換な多項式」、外積代数が「反可換な多項式」（グラスマン代数）で、両者はコシュル複体（\ref{ring:page-koszul-depth} の文脈）で組み合わされる。超代数の言葉では、外積代数は奇の変数の多項式環である。比喩で言えば、テンソル代数は文字を自由に並べた語の世界、対称代数は並べ替えを許した単項式の世界、外積代数は「同じ文字を二度使うと消え、並べ替えると符号が変わる」向き付きの体積要素の世界である。
:::

## 問題 {#lin:sec-ex-problems}

::: problem {#lin:prob-ex-cross-product}
$\mathbb{R}^{3}$ で $v\wedge w=\sum_{i<j}(v_{i}w_{j}-v_{j}w_{i})e_{i}\wedge e_{j}$ を示し、この係数がベクトル積 $v\times w$ の成分（並べ替えと符号を除いて）であることを確かめよ。
:::

::: solution
\ref{lin:exterior-basis} の展開式で $X=(v\ w)$（$3\times2$）の 2 次小行列式 $\det X_{\{i,j\},[2]}=v_{i}w_{j}-v_{j}w_{i}$。$v\times w=(v_{2}w_{3}-v_{3}w_{2},\ v_{3}w_{1}-v_{1}w_{3},\ v_{1}w_{2}-v_{2}w_{1})$ は、$e_{2}\wedge e_{3}\mapsto e_{1}$, $e_{3}\wedge e_{1}\mapsto e_{2}$, $e_{1}\wedge e_{2}\mapsto e_{3}$ による対応（$e_{1}\wedge e_{3}=-e_{3}\wedge e_{1}$ で符号が入る）。
:::

::: problem {#lin:prob-ex-charpoly-three}
$3$ 次の行列 $X$ について $\chi_{X}(t)=t^{3}-(\operatorname{tr}X)t^{2}+(\operatorname{tr}\Lambda^{2}X)t-\det X$ を確かめ、$\operatorname{tr}\Lambda^{2}X$ を $X$ の成分で書け。
:::

::: solution
\ref{lin:exterior-determinant} の 3 で $n=3$。$\operatorname{tr}\Lambda^{2}X=\sum_{i<j}\det X_{\{i,j\},\{i,j\}}=(x_{11}x_{22}-x_{12}x_{21})+(x_{11}x_{33}-x_{13}x_{31})+(x_{22}x_{33}-x_{23}x_{32})$（主小行列式の和）。$\operatorname{tr}\Lambda^{3}X=\det X$。
:::
