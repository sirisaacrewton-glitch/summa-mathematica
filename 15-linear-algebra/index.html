# 線形代数・多重線形代数・行列論（Linear and Multilinear Algebra; Matrix Theory）

ベクトル空間と線形写像、行列式、固有値とジョルダン標準形、双線形形式と内積空間、テンソル代数と外積代数。

<p class="mn-msc">MSC2020: 15</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="15A-basic-linear-algebra/01-vector-spaces/index.html"><span class="mn-card-title">ベクトル空間と線形写像</span><span class="mn-card-en">Vector Spaces and Linear Maps</span><span class="mn-card-desc">部分空間と直和、基底の存在と延長、次元、線形写像と行列、商空間と双対空間、階数と掃き出し法。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="15A-basic-linear-algebra/02-determinants/index.html"><span class="mn-card-title">行列式</span><span class="mn-card-en">Determinants</span><span class="mn-card-desc">行列式の同値な定義（ライプニッツの式・交代多重線形形式・自己準同型・余因子展開・掃き出し法・乗法的特徴付け）、余因子行列とクラメールの公式、ヴァンデルモンド、小行列式と階数、コーシー–ビネ。可換環上で述べる。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="15A-basic-linear-algebra/03-eigen/index.html"><span class="mn-card-title">固有値とジョルダン標準形</span><span class="mn-card-en">Eigenvalues and Jordan Normal Form</span><span class="mn-card-desc">固有多項式とケーリー–ハミルトンの定理（可換環上）、最小多項式、対角化・三角化、冪零行列、ジョルダン標準形と有理標準形、行列の関数と固有値の計算。</span><span class="mn-card-count">4 ページ</span></a>
<a class="mn-card" href="15A-basic-linear-algebra/04-forms/index.html"><span class="mn-card-title">双線形形式と内積空間</span><span class="mn-card-en">Bilinear Forms and Inner Product Spaces</span><span class="mn-card-desc">双線形形式と 2 次形式、シルヴェスターの慣性法則、シンプレクティック基底とパフィアン、内積空間、グラム–シュミット、スペクトル定理、特異値分解。</span><span class="mn-card-count">3 ページ</span></a>
<a class="mn-card" href="15A-basic-linear-algebra/05-multilinear/index.html"><span class="mn-card-title">多重線形代数</span><span class="mn-card-en">Multilinear Algebra</span><span class="mn-card-desc">テンソル積とテンソル代数、(p,q) 型テンソルと縮約、外積代数と対称代数、行列式・小行列式・固有多項式との関係、体積形式とホッジ双対、テンソルの階数。可換環上で述べる。</span><span class="mn-card-count">4 ページ</span></a>
