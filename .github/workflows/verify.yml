name: verify

# Runs only when deployed content is pushed to main:
#   site pages (NN-*/**/*.html), src/**/*.md|tex, or a tracker edited to add an Opus Rebuttal.
# scripts/verify.py skips pages whose Markdown source did not change (build-only rewrites).
# Manual run (Actions -> verify -> Run workflow):
#   mode "files": the space-separated files given in "files"
#   mode "all"  : full audit of every page, split over 8 parallel jobs
#   mode "terms": check the automatic term links (scripts/termcheck.py); "files" = folders to check, "limit" = max groups
#   mode "bench": run the verifier on scripts/bench/benchmark.json (pages at a fixed old revision with known
#                 true and false findings) and push the raw results to verifications/bench/ for scoring
# 2026-10-28: automatic runs on push are switched off to save DeepSeek tokens (user request) until the
# verification method is chosen by the benchmark. Re-enable by restoring the push trigger:
#   push: {branches: [main], paths: ['0[1-5]-*/**/*.html', 'src/**/*.md', 'src/**/*.tex', 'verifications/**_tracker.md', '0[1-5]-*/**/_meta.json']}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'files = the files below; all = full audit of every page'
        type: choice
        options: [files, all, bench, terms]
        default: files
      files:
        description: 'Space-separated repository-relative files to verify (mode files)'
        required: false
        default: ''
      model:
        description: 'DeepSeek model (deepseek-reasoner thinks before answering: slower, usually more accurate)'
        type: choice
        options: [deepseek-chat, deepseek-reasoner]
        default: deepseek-chat
      style:
        description: 'page = one referee call per page; atomic = one short question per unit of the page'
        type: choice
        options: [page, atomic, minimal]
        default: page
      assist:
        description: 'Also write *_assist.md (step claims, alternative proofs/definitions)'
        type: boolean
        default: false
      limit:
        description: 'mode terms: max (series, term, definition) groups to check'
        required: false
        default: '100'
      ambiguous_only:
        description: 'mode terms: only terms with more than one candidate definition'
        type: boolean
        default: true
      skip_verified:
        description: 'mode all: skip pages that already have a tracker (resume an interrupted audit)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'push' || inputs.mode == 'files'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: verify-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify changed pages with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model || 'deepseek-chat' }}
          VERIFY_STYLE: ${{ inputs.style || 'page' }}
          FILES: ${{ inputs.files }}
          ASSIST: ${{ github.event_name == 'push' || inputs.assist }}
        run: |
          A=""; [ "$ASSIST" = "true" ] && A="--assist"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/verify.py $A --max-files 60 --files $FILES
          else
            python scripts/verify.py $A --max-files 60 --git-range "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Roadmap suggestions for fields whose _meta.json changed
        if: github.event_name == 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model || 'deepseek-chat' }}
          VERIFY_STYLE: ${{ inputs.style || 'page' }}
        run: python scripts/roadmap.py --git-range "${{ github.event.before }}..${{ github.sha }}"

      - name: Push trackers to verifications/
        if: always()
        run: |
          bash scripts/push_verifications.sh "chore: update verification trackers [skip ci]"

  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full audit, shard ${{ matrix.shard }}/8
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model || 'deepseek-chat' }}
          VERIFY_STYLE: ${{ inputs.style || 'page' }}
          ASSIST: ${{ inputs.assist }}
          SKIP: ${{ inputs.skip_verified }}
        run: |
          A=""; [ "$ASSIST" = "true" ] && A="--assist"
          S=""; [ "$SKIP" = "true" ] && S="--skip-verified"
          python scripts/verify.py --all $A $S --shard ${{ matrix.shard }}/8 --workers 4 --max-files 10000

      - name: Push trackers to verifications/
        if: always()
        run: |
          bash scripts/push_verifications.sh "chore: full verification audit, shard ${{ matrix.shard }}/8 [skip ci]"

  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benchmark the verifier
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model }}
          VERIFY_STYLE: ${{ inputs.style }}
        run: |
          REV=$(python -c "import json;print(json.load(open('scripts/bench/benchmark.json'))['rev'])")
          FILES="${{ inputs.files }}"
          [ -z "$FILES" ] && FILES=$(python -c "import json;print(' '.join(p['page'] for p in json.load(open('scripts/bench/benchmark.json'))['pages']))")
          python scripts/verify.py --files $FILES --rev $REV --workers 5 --max-files 100 \
            --out-dir "verifications/bench/${DEEPSEEK_MODEL}-${VERIFY_STYLE}-run${{ github.run_number }}"

      - name: Push results to verifications/bench/
        if: always()
        run: |
          bash scripts/push_verifications.sh "chore: verifier benchmark (${{ inputs.model }}) [skip ci]"

  terms:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'terms'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the automatic term links
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model }}
          DIRS: ${{ inputs.files }}
          LIMIT: ${{ inputs.limit }}
          AMB: ${{ inputs.ambiguous_only }}
        run: |
          node tools/term-links.js > /tmp/units.json
          A=""; [ "$AMB" = "true" ] && A="--ambiguous"
          D=""; [ -n "$DIRS" ] && D="--dirs $DIRS"
          python scripts/termcheck.py /tmp/units.json $A $D --limit "$LIMIT" \
            --out "verifications/termlinks/run${{ github.run_number }}.md"

      - name: Push the report
        if: always()
        run: |
          bash scripts/push_verifications.sh "chore: term-link check [skip ci]"
