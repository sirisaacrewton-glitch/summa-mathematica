# 直積の部分群 {#grp:page-subgroups-of-products keywords="subgroups of a direct product, Goursat's lemma, subdirect product, fibre product of groups, normal subgroups of a direct product, direct products of simple groups, diagonal subgroup, number of subgroups of Z/m x Z/n"}

直積 $G_{1}\times G_{2}$ の部分群は、$H_{1}\times H_{2}$ の形のものだけではない。例えば $\Z/p\times\Z/p$ の「対角線」$\{(x,cx)\}$ はこの形ではない。**グルサの補題**（\ref{grp:goursat}）は、直積の部分群が、各成分の「部分群の剰余群」（**切片**）どうしの同型のグラフとしてちょうど一通りに書けることを述べ、直積の部分群を完全に分類する。これを使うと、$\Z/m\times\Z/n$ の部分群の個数が $\sum_{a\mid m}\sum_{b\mid n}\gcd(a,b)$ であること（\ref{grp:subgroups-zm-zn}）、直積の正規部分群の判定法（\ref{grp:goursat-normal}）、非可換単純群の直積の正規部分群は因子の部分積だけであること（\ref{grp:normal-subgroups-simple-product}）、二つの単純群の直積で両方の成分に全射する部分群は直積全体か同型のグラフ（対角部分群）だけであること（\ref{grp:subdirect-simple}）が得られる。

> 主張は任意の群（無限群を含む）について述べる。単純群（\ref{grp:simple-group}）を使う。

## 記法と定義の確認 {#grp:sec-sp-notation}

::: notation
- 直積 $G_{1}\times G_{2}$ と射影 $p_{i}$、その基本性質は \ref{grp:direct-product}, \ref{grp:direct-product-basic}。部分群・正規部分群・剰余群は \ref{grp:subgroup}, \ref{grp:normal-subgroup}, \ref{grp:quotient-group}、中心 $Z(G)$ は \ref{grp:center}, \ref{grp:center-normal}。
- 準同型・第一同型定理・対応定理は \ref{grp:homomorphism-basic}, \ref{grp:first-isomorphism}, \ref{grp:correspondence}。巡回群の部分群は \ref{grp:subgroups-cyclic}、冪の位数は \ref{grp:order-of-power}、オイラー関数 $\varphi$ とその約数和 $\sum_{d\mid n}\varphi(d)=n$ は \ref{grp:units-mod-n}, \ref{grp:sum-phi-divisors}。単純群は \ref{grp:simple-group}。
- 部分群 $B\trianglelefteq A\le G$ の組に対する剰余群 $A/B$ を $G$ の**切片**（section）という。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## グルサの補題 {#grp:sec-sp-goursat}

::: definition 部分群の成分データ {#grp:goursat-data keywords="Goursat data of a subgroup of a direct product, projections and kernels" index="成分データ|せいぶんでーた"}
$H\le G_{1}\times G_{2}$ に対し、
$$
\begin{aligned}
A_{1}&\defeq p_{1}(H), & B_{1}&\defeq\{g\in G_{1} : (g,e)\in H\},\\
A_{2}&\defeq p_{2}(H), & B_{2}&\defeq\{g\in G_{2} : (e,g)\in H\}
\end{aligned}
$$
とおく。$A_{i}$ は $H$ の第 $i$ 成分の像、$B_{i}$ は「$H$ のうち第 $i$ 成分だけに載っている部分」である。
:::

::: lemma 成分データの性質 {#grp:goursat-data-basic keywords="B_i is normal in A_i, the isomorphism theta: A_1/B_1 -> A_2/B_2" index="グルサの同型|ぐるさのどうけい"}
$H\le G_{1}\times G_{2}$ と上の記号で：
1. $B_{i}\trianglelefteq A_{i}\le G_{i}$（$i=1,2$）。
2. $(a_{1},a_{2})\in H$ のとき $\theta(a_{1}B_{1})\defeq a_{2}B_{2}$ とおくと、$\theta:A_{1}/B_{1}\to A_{2}/B_{2}$ は矛盾なく定まる同型である。
3. $H=\{(a_{1},a_{2})\in A_{1}\times A_{2} : \theta(a_{1}B_{1})=a_{2}B_{2}\}$。
:::

::: proof
**Step 1（部分群）.** $p_{1}$ は準同型なので $A_{1}=p_{1}(H)$ は部分群。$B_{1}$ は、準同型 $G_{1}\to G_{1}\times G_{2}$, $g\mapsto(g,e)$ による $H$ の逆像なので部分群。$(b,e)\in H$ なら $b=p_{1}(b,e)\in A_{1}$ なので $B_{1}\subseteq A_{1}$。

**Step 2（正規性）.** $b\in B_{1}$, $a\in A_{1}$ とし、$(a,c)\in H$ をとる。$H$ は部分群なので
$$
(a,c)(b,e)(a,c)^{-1}=(aba^{-1},\,cec^{-1})=(aba^{-1},e)\in H,
$$
すなわち $aba^{-1}\in B_{1}$。$i=2$ も同様。これで 1。

**Step 3（$\theta$ が矛盾なく定まる）.** $(a,c),(a',c')\in H$ で $aB_{1}=a'B_{1}$ とする。$(a,c)^{-1}(a',c')=(a^{-1}a',c^{-1}c')\in H$ で、$a^{-1}a'\in B_{1}$ なので $(a^{-1}a',e)\in H$。よって
$$
(a^{-1}a',e)^{-1}(a^{-1}a',c^{-1}c')=(e,c^{-1}c')\in H,
$$
すなわち $c^{-1}c'\in B_{2}$、$cB_{2}=c'B_{2}$。また任意の $a\in A_{1}$ に $(a,c)\in H$ となる $c$ があるので、$\theta$ は $A_{1}/B_{1}$ 全体で定まる。

**Step 4（準同型・全単射）.** $(a,c),(a',c')\in H$ なら $(aa',cc')\in H$ なので $\theta(aa'B_{1})=cc'B_{2}=\theta(aB_{1})\theta(a'B_{1})$。全射：$c\in A_{2}=p_{2}(H)$ なら $(a,c)\in H$ となる $a$ があり $\theta(aB_{1})=cB_{2}$。単射：$\theta(aB_{1})=B_{2}$ なら $(a,c)\in H$ で $c\in B_{2}$、$(e,c)\in H$ なので $(a,c)(e,c)^{-1}=(a,e)\in H$、$a\in B_{1}$。これで 2。

**Step 5（3）.** $\subseteq$ は $\theta$ の定義から。$\supseteq$：$a_{1}\in A_{1}$, $a_{2}\in A_{2}$ で $\theta(a_{1}B_{1})=a_{2}B_{2}$ とする。$(a_{1},c)\in H$ をとると $cB_{2}=\theta(a_{1}B_{1})=a_{2}B_{2}$ なので $c^{-1}a_{2}\in B_{2}$、$(e,c^{-1}a_{2})\in H$。よって $(a_{1},c)(e,c^{-1}a_{2})=(a_{1},a_{2})\in H$。
:::

::: theorem グルサの補題 {#grp:goursat keywords="Goursat's lemma, subgroups of a direct product correspond to isomorphisms between sections" index="グルサの補題|ぐるさのほだい"}
群 $G_{1},G_{2}$ について、次の対応は全単射である。
$$
H\longmapsto(A_{1},B_{1},A_{2},B_{2},\theta)
$$
左は $G_{1}\times G_{2}$ の部分群全体、右は $B_{i}\trianglelefteq A_{i}\le G_{i}$（$i=1,2$）と同型 $\theta:A_{1}/B_{1}\to A_{2}/B_{2}$ の組全体。逆写像は
$$
(A_{1},B_{1},A_{2},B_{2},\theta)\longmapsto H_{\theta}\defeq\{(a_{1},a_{2})\in A_{1}\times A_{2} : \theta(a_{1}B_{1})=a_{2}B_{2}\}.
$$
$H$ が有限なら $\abs{H}=\abs{A_{1}}\abs{B_{2}}=\abs{B_{1}}\abs{A_{2}}$。
:::

::: intuition
$H$ は「$G_{1}$ の切片 $A_{1}/B_{1}$ と $G_{2}$ の切片 $A_{2}/B_{2}$ を同型 $\theta$ で貼り合わせたもの」である。$\theta$ が恒等的に自明な場合（$A_{i}=B_{i}$）が直積型 $B_{1}\times B_{2}$、$B_{i}$ が自明な場合が同型 $A_{1}\cong A_{2}$ のグラフ（対角型）で、一般の部分群はその中間にある。
:::

::: proof
**Step 1（左から右へ、右から左へで戻る）.** $H$ の成分データ $(A_{1},B_{1},A_{2},B_{2},\theta)$ は \ref{grp:goursat-data-basic.1}, \ref[2]{grp:goursat-data-basic.2} により右の組で、同 3 より $H_{\theta}=H$。

**Step 2（$H_{\theta}$ は部分群）.** 右の組を任意にとる。$(e,e)\in H_{\theta}$。$(a_{1},a_{2}),(a'_{1},a'_{2})\in H_{\theta}$ なら、$\theta$ が準同型なので
$$
\theta(a_{1}a'^{-1}_{1}B_{1})=\theta(a_{1}B_{1})\theta(a'_{1}B_{1})^{-1}=a_{2}a'^{-1}_{2}B_{2},
$$
よって $(a_{1}a'^{-1}_{1},a_{2}a'^{-1}_{2})\in H_{\theta}$。

**Step 3（$H_{\theta}$ の成分データは元の組）.**
- $p_{1}(H_{\theta})=A_{1}$：$\subseteq$ は定義から。$a_{1}\in A_{1}$ について $\theta(a_{1}B_{1})=a_{2}B_{2}$ となる $a_{2}\in A_{2}$ をとれば $(a_{1},a_{2})\in H_{\theta}$。$p_{2}(H_{\theta})=A_{2}$ も、$\theta$ の全射性から同様。
- $\{g : (g,e)\in H_{\theta}\}=B_{1}$：$(g,e)\in H_{\theta}\iff g\in A_{1}$ かつ $\theta(gB_{1})=B_{2}\iff g\in B_{1}$（$\theta$ は単射）。$B_{2}$ も同様。
- 成分データの同型を $\theta'$ とすると、$(a_{1},a_{2})\in H_{\theta}$ について $\theta'(a_{1}B_{1})=a_{2}B_{2}=\theta(a_{1}B_{1})$ なので $\theta'=\theta$。

Step 1 と Step 3 から、二つの対応は互いに逆。

**Step 4（位数）.** $p_{1}$ の $H$ への制限 $H\to A_{1}$ は全射準同型で、核は $\{(e,c)\in H\}=\{e\}\times B_{2}\cong B_{2}$。第一同型定理（\ref{grp:first-isomorphism}）とラグランジュの定理から $\abs{H}=\abs{A_{1}}\abs{B_{2}}$。$p_{2}$ で同様に $\abs{H}=\abs{B_{1}}\abs{A_{2}}$。
:::

::: hypcheck
- 前提は「$G_{1},G_{2}$ が群」だけで、有限性も可換性も使わない（位数の式だけが有限性を使う）。
- 対応は部分群の**集合**の全単射であり、同型類の分類ではない：異なる $\theta$ が同型な部分群を与えることがある（例：\ref{grp:subdirect-simple} の対角部分群はすべて $S$ と同型）。
:::

::: definition 部分直積 {#grp:subdirect-product keywords="subdirect product, fibre product of groups over a common quotient" index="部分直積|ぶぶんちょくせき, ファイバー積|ふぁいばーせき"}
$H\le G_{1}\times G_{2}$ が $p_{1}(H)=G_{1}$, $p_{2}(H)=G_{2}$ をみたすとき、$H$ を $G_{1},G_{2}$ の**部分直積**という。
:::

::: corollary 部分直積の分類 {#grp:subdirect-classification keywords="subdirect products correspond to pairs of normal subgroups with isomorphic quotients" index="部分直積の分類|ぶぶんちょくせきのぶんるい"}
$G_{1},G_{2}$ の部分直積は、$N_{i}\trianglelefteq G_{i}$ と同型 $\theta:G_{1}/N_{1}\to G_{2}/N_{2}$ の組と一対一に対応し、組 $(N_{1},N_{2},\theta)$ に対応する部分直積は、商群への射影 $\pi_{i}:G_{i}\to G_{i}/N_{i}$ について
$$
\{(g_{1},g_{2}) : \theta(\pi_{1}(g_{1}))=\pi_{2}(g_{2})\}
$$
である（商群 $Q\defeq G_{2}/N_{2}$ 上の**ファイバー積**）。
:::

::: proof
\ref{grp:goursat} で $A_{i}=G_{i}$ の場合。$B_{i}\trianglelefteq A_{i}=G_{i}$ なので $N_{i}\defeq B_{i}$ は $G_{i}$ の正規部分群。
:::

::: example 対角部分群
$G$ を群とすると $\Delta\defeq\{(g,g) : g\in G\}$ は $G\times G$ の部分直積で、成分データは $N_{1}=N_{2}=\{e\}$, $\theta=\id_{G}$。$G\neq\{e\}$ なら $\Delta$ は $H_{1}\times H_{2}$ の形ではない（その形なら $p_{i}(\Delta)=G$ から $\Delta=G\times G$ となるが、$(g,e)\notin\Delta$（$g\neq e$））。
:::

## 有限アーベル群の場合：部分群の個数 {#grp:sec-sp-counting}

::: theorem $\Z/m\times\Z/n$ の部分群の個数 {#grp:subgroups-zm-zn keywords="number of subgroups of Z/m x Z/n equals sum over a|m, b|n of gcd(a,b)" index="部分群の個数|ぶぶんぐんのこすう"}
正の整数 $m,n$ について、$\Z/m\times\Z/n$ の部分群の個数は
$$
\sum_{a\mid m}\ \sum_{b\mid n}\gcd(a,b)
$$
である（$a,b$ は正の約数をわたる）。
:::

::: proof
\ref{grp:goursat} により、組 $(A_{1},B_{1},A_{2},B_{2},\theta)$ を数えればよい。

**Step 1（$A_{1},A_{2}$ の選び方）.** \ref{grp:subgroups-cyclic} より、$\Z/m$ の部分群は $m$ の約数 $a$ ごとにちょうど一つ（位数 $a$）で、それは位数 $a$ の巡回群。$A_{1}$ を位数 $a$（$a\mid m$）、$A_{2}$ を位数 $b$（$b\mid n$）のものとする。

**Step 2（$B_{1},B_{2}$ の選び方）.** $A_{1}/B_{1}\cong A_{2}/B_{2}$ の位数を $k$ とすると、$k=\abs{A_{1}}/\abs{B_{1}}$ は $a$ の約数、同様に $b$ の約数なので $k\mid\gcd(a,b)$。逆に $k\mid\gcd(a,b)$ を一つ決めると、$B_{1}$ は巡回群 $A_{1}$ の位数 $a/k$ のただ一つの部分群、$B_{2}$ は $A_{2}$ の位数 $b/k$ のただ一つの部分群に決まる（\ref{grp:subgroups-cyclic}）。可換群なので正規性は自動的。

**Step 3（$\theta$ の選び方）.** $A_{1}/B_{1}$, $A_{2}/B_{2}$ はどちらも位数 $k$ の巡回群（巡回群の剰余群は生成元の像で生成される）。生成元 $u$ をもつ位数 $k$ の巡回群 $C$ から位数 $k$ の巡回群 $C'$ への同型は、$u$ の像（$C'$ の生成元でなければならない）で決まり、逆に $C'$ の生成元 $v$ を一つ選べば $u^{j}\mapsto v^{j}$ は同型である（\ref{grp:cyclic-classification}）。$C'=\ang{v_{0}}$ の生成元は $v_{0}^{j}$（$0\le j<k$, $\gcd(j,k)=1$）で、\ref{grp:order-of-power} よりその個数は $\varphi(k)$。よって $\theta$ の選び方は $\varphi(k)$ 通り。

**Step 4（合計）.** 以上から部分群の個数は
$$
\sum_{a\mid m}\sum_{b\mid n}\ \sum_{k\mid\gcd(a,b)}\varphi(k)=\sum_{a\mid m}\sum_{b\mid n}\gcd(a,b)
$$
（最後に \ref{grp:sum-phi-divisors}）。
:::

::: example
1. $m=n=p$（素数）：$(a,b)\in\{1,p\}^{2}$ について $\gcd$ は $1,1,1,p$ なので、部分群は $p+3$ 個。内訳は $\{0\}$、全体、$\Z/p\times\{0\}$、$\{0\}\times\Z/p$ と、$p-1$ 個の対角型 $\{(x,cx)\}$（$c\neq 0$。$\theta$ が $\Aut(\Z/p)$ の元）。$\F_{p}^{2}$ の部分空間（$0$, 全体, $p+1$ 本の直線）と同じ数え方である。
2. $\Z/2\times\Z/4$：$(a,b)$ を $a\in\{1,2\}$, $b\in\{1,2,4\}$ でわたると $\gcd$ は $1,1,1,1,2,2$ で、合計 $8$。実際、自明な群、位数 $2$ の部分群 $3$ 個（$(1,0),(0,2),(1,2)$ が生成）、位数 $4$ の部分群 $3$ 個（$(0,1)$ と $(1,1)$ が生成する巡回群 $2$ 個と $\{0,1\}\times\{0,2\}$）、全体。
:::

## 正規部分群 {#grp:sec-sp-normal}

::: theorem 直積の正規部分群 {#grp:goursat-normal keywords="normal subgroups of a direct product via Goursat's lemma, A_i/B_i central in G_i/B_i" index="直積の正規部分群|ちょくせきのせいきぶぶんぐん"}
$H\le G_{1}\times G_{2}$ の成分データを $(A_{1},B_{1},A_{2},B_{2},\theta)$ とする。$H\trianglelefteq G_{1}\times G_{2}$ であるための必要十分条件は、$i=1,2$ について
$$
B_{i}\trianglelefteq G_{i}\quad\text{かつ}\quad A_{i}/B_{i}\le Z(G_{i}/B_{i})
$$
となることである（このとき $A_{i}\trianglelefteq G_{i}$ も成り立つ）。
:::

::: proof
**Step 1（必要性：$B_{1}$ の正規性）.** $H$ が正規なら、$b\in B_{1}$, $g\in G_{1}$ について $(g,e)(b,e)(g,e)^{-1}=(gbg^{-1},e)\in H$ なので $gbg^{-1}\in B_{1}$。

**Step 2（必要性：中心に入る）.** $a\in A_{1}$, $g\in G_{1}$ とし、$(a,c)\in H$ をとる。$(g,e)(a,c)(g,e)^{-1}=(gag^{-1},c)\in H$ なので、
$$
(gag^{-1},c)(a,c)^{-1}=(gag^{-1}a^{-1},e)\in H,
$$
すなわち $gag^{-1}a^{-1}\in B_{1}$。これは $G_{1}/B_{1}$ で $aB_{1}$ と $gB_{1}$ が可換であることを意味する。$a$ は $A_{1}$ の任意の元、$g$ は $G_{1}$ の任意の元なので $A_{1}/B_{1}\le Z(G_{1}/B_{1})$。$i=2$ も同様。

**Step 3（$A_{i}$ の正規性）.** 条件の下で、$a\in A_{1}$, $g\in G_{1}$ について $gag^{-1}\in aB_{1}\subseteq A_{1}$（$B_{1}\subseteq A_{1}$）。

**Step 4（十分性）.** 条件を仮定し、$(a_{1},a_{2})\in H$, $(g_{1},g_{2})\in G_{1}\times G_{2}$ とする。$a_{1}B_{1}$ は $G_{1}/B_{1}$ の中心にあるので $g_{1}a_{1}g_{1}^{-1}B_{1}=(g_{1}B_{1})(a_{1}B_{1})(g_{1}B_{1})^{-1}=a_{1}B_{1}$、同様に $g_{2}a_{2}g_{2}^{-1}B_{2}=a_{2}B_{2}$。Step 3 より $g_{i}a_{i}g_{i}^{-1}\in A_{i}$ で、
$$
\theta(g_{1}a_{1}g_{1}^{-1}B_{1})=\theta(a_{1}B_{1})=a_{2}B_{2}=g_{2}a_{2}g_{2}^{-1}B_{2}.
$$
\ref{grp:goursat-data-basic.3} より $(g_{1}a_{1}g_{1}^{-1},g_{2}a_{2}g_{2}^{-1})\in H$。
:::

::: example
1. 可換群では中心が全体なので、条件は自動的にみたされ、すべての部分群が正規（当然）。
2. $S_{3}\times S_{3}$ の部分群 $H\defeq\{(\sigma,\tau) : \sgn\sigma=\sgn\tau\}$ は、$A_{i}=S_{3}$, $B_{i}=A_{3}$, $\theta$ は $S_{3}/A_{3}\cong\Z/2$ の恒等写像にあたる。$S_{3}/A_{3}$ は可換なので $H$ は正規だが、$N_{1}\times N_{2}$ の形ではない（位数 $18$ で、$S_{3}$ の正規部分群 $\{e\},A_{3},S_{3}$ の積の位数は $1,3,6,9,18,36$ のうち $18$ は $A_{3}\times S_{3}$ と $S_{3}\times A_{3}$ だけで、どちらも $H$ と異なる）。
3. $G$ の中心 $Z(G)$ が自明でなければ、$\{(z,z) : z\in Z(G)\}$ は $G\times G$ の正規部分群で、直積型ではない（\ref{grp:prob-center-diagonal}）。
:::

::: theorem 非可換単純群の直積の正規部分群 {#grp:normal-subgroups-simple-product keywords="normal subgroups of a direct product of nonabelian simple groups are products of factors" index="単純群の直積|たんじゅんぐんのちょくせき"}
$S_{1},\dots,S_{n}$ を非可換な単純群とする。$S_{1}\times\cdots\times S_{n}$ の正規部分群は、$I\subseteq\{1,\dots,n\}$ について
$$
S_{I}\defeq\{(x_{1},\dots,x_{n}) : i\notin I\Rightarrow x_{i}=e\}
$$
の形のものに限る。特に正規部分群はちょうど $2^{n}$ 個ある。
:::

::: proof
**Step 1（単純群の中心）.** 非可換単純群 $S$ について $Z(S)=\{e\}$：$Z(S)\trianglelefteq S$（\ref{grp:center-normal}）なので $Z(S)=\{e\}$ か $S$ で、$Z(S)=S$ なら $S$ は可換になり仮定に反する。

**Step 2（二つの因子：$G_{1}=S$ が非可換単純で $G_{2}$ は任意）.** $H\trianglelefteq S\times G_{2}$ の成分データを $(A_{1},B_{1},A_{2},B_{2},\theta)$ とする。\ref{grp:goursat-normal} より $B_{1}\trianglelefteq S$ なので $B_{1}=\{e\}$ か $S$。
- $B_{1}=\{e\}$ なら $A_{1}=A_{1}/B_{1}\le Z(S/\{e\})\cong Z(S)=\{e\}$、よって $A_{1}=\{e\}=B_{1}$。
- $B_{1}=S$ なら $S=B_{1}\subseteq A_{1}\subseteq S$ で $A_{1}=B_{1}$。

いずれも $A_{1}/B_{1}$ は自明で、$\theta$ は同型なので $A_{2}/B_{2}$ も自明、$A_{2}=B_{2}$。\ref{grp:goursat-data-basic.3} から $H=B_{1}\times B_{2}$ で、$B_{2}\trianglelefteq G_{2}$（\ref{grp:goursat-normal}）。

**Step 3（帰納法）.** $n$ についての帰納法。$n=1$ は単純群の定義。$n\ge 2$ では $S_{1}\times\cdots\times S_{n}=S_{1}\times G_{2}$（$G_{2}\defeq S_{2}\times\cdots\times S_{n}$）と見て Step 2 を使うと、正規部分群は $B_{1}\times B_{2}$（$B_{1}\in\{\{e\},S_{1}\}$, $B_{2}\trianglelefteq G_{2}$）で、帰納法の仮定より $B_{2}$ は $G_{2}$ の $S_{J}$ の形。よって $S_{I}$ の形。逆に $S_{I}$ は正規（成分ごとに $\{e\}$ か $S_{i}$ の直積で、成分ごとの共役で保たれる）。$I$ が異なれば $S_{I}$ も異なる（$S_{i}\neq\{e\}$）ので、ちょうど $2^{n}$ 個。
:::

::: hypcheck
- **非可換**：Step 1 の $Z(S)=\{e\}$ に使った。可換な単純群 $\Z/p$ では偽：$\Z/p\times\Z/p$ の正規部分群は部分群全体で $p+3$ 個（\ref{grp:subgroups-zm-zn} の例）あり、対角型 $\{(x,cx)\}$ は $S_{I}$ の形ではない。
- **単純**：Step 2 の $B_{1}\in\{\{e\},S\}$ に使った。外すと偽：上の例の $S_{3}\times S_{3}$（$S_{3}$ は非可換だが単純でない）。
- 有限性は使っていない。
:::

::: theorem 二つの単純群の部分直積 {#grp:subdirect-simple keywords="subdirect products of two simple groups are the full product or graphs of isomorphisms (diagonal subgroups)" index="対角部分群|たいかくぶぶんぐん"}
$S,T$ を単純群とする。$S\times T$ の部分直積は
1. $S\times T$ 自身、および
2. 同型 $\alpha:S\to T$ のグラフ $\Gamma_{\alpha}\defeq\{(s,\alpha(s)) : s\in S\}$

に限り、$\alpha$ が異なれば $\Gamma_{\alpha}$ も異なる。特に $S\not\cong T$ なら部分直積は $S\times T$ だけで、$S\cong T$ なら $S\times T$ と、$\abs{\Aut(S)}$ 個の（$S$ と同型な）対角部分群がある。
:::

::: proof
**Step 1.** \ref{grp:subdirect-classification} より、部分直積は $N_{1}\trianglelefteq S$, $N_{2}\trianglelefteq T$ と同型 $S/N_{1}\cong T/N_{2}$ の組に対応する。単純性から $N_{1}\in\{\{e\},S\}$, $N_{2}\in\{\{e\},T\}$。

**Step 2（場合分け）.**
- $N_{1}=S$ なら $S/N_{1}$ は自明なので $T/N_{2}$ も自明、$N_{2}=T$。対応する部分直積は $\{(s,t) : \text{条件なし}\}=S\times T$。
- $N_{1}=\{e\}$ なら $S\cong T/N_{2}$。$N_{2}=T$ だと $S$ が自明になり、単純群の定義（$S\neq\{e\}$）に反するので $N_{2}=\{e\}$。同型 $\theta:S\to T$ に対応する部分直積は $\{(s,t) : \theta(s)=t\}=\Gamma_{\theta}$。

**Step 3（相異なる）.** $\Gamma_{\alpha}=\Gamma_{\beta}$ なら各 $s$ で $(s,\alpha(s))\in\Gamma_{\beta}$、すなわち $\alpha(s)=\beta(s)$。$S\cong T$ のとき、同型 $S\to T$ は一つの同型 $\alpha_{0}$ と $\Aut(S)$ の元の合成 $\alpha_{0}\circ\gamma$ でちょうど一通りに書けるので、$\abs{\Aut(S)}$ 個ある。$\Gamma_{\alpha}\cong S$ は $p_{1}$ の制限が同型であることから。
:::

::: hypcheck
- **単純**：Step 1 の $N_{i}$ の決定に使った。可換か非可換かは使っていない（$S=T=\Z/p$ では $\abs{\Aut(\Z/p)}=p-1$ 個の対角型が現れ、\ref{grp:subgroups-zm-zn} の例と合う）。
- **部分直積（両成分に全射）**：外すと、$\{e\}\times\{e\}$, $S\times\{e\}$ なども部分群である。
:::

::: corollary 非可換単純群の有限個の部分直積 {#grp:subdirect-simple-product keywords="a subdirect product of finitely many nonabelian simple groups is isomorphic to a direct product of some of them" index="単純群の部分直積|たんじゅんぐんのぶぶんちょくせき"}
$S_{1},\dots,S_{n}$ を非可換な単純群とし、$H\le S_{1}\times\cdots\times S_{n}$ がすべての射影 $p_{i}$ について $p_{i}(H)=S_{i}$ をみたすとする。このとき $H$ は、いくつかの $S_{i}$ の直積と同型である。
:::

::: proof
$n$ についての帰納法。$n=1$ なら $H=S_{1}$。$n\ge 2$ とし、$G_{2}\defeq S_{2}\times\cdots\times S_{n}$、$K\defeq p_{G_{2}}(H)\le G_{2}$（後ろ $n-1$ 成分への射影の像）とおく。$K$ は $S_{2},\dots,S_{n}$ のすべての成分に全射するので、帰納法の仮定より $K\cong T_{1}\times\cdots\times T_{m}$（各 $T_{j}$ はいずれかの $S_{i}$、$i\ge 2$）。$H\le S_{1}\times K$ は $S_{1}$ と $K$ の部分直積なので、\ref{grp:subdirect-classification} より $N_{1}\trianglelefteq S_{1}$, $N_{2}\trianglelefteq K$ と $S_{1}/N_{1}\cong K/N_{2}$ の組に対応する。
- $N_{1}=S_{1}$ なら $N_{2}=K$ で、$H=S_{1}\times K\cong S_{1}\times T_{1}\times\cdots\times T_{m}$。
- $N_{1}=\{e\}$ なら $S_{1}\cong K/N_{2}$。このとき $H$ の成分データの $B_{1}=N_{1}=\{e\}$ なので、$H\to K$（第 2 成分への射影）の核 $\{(g,e)\in H\}=B_{1}\times\{e\}$ は自明で、$H\cong K$。

いずれの場合も $H$ はいくつかの $S_{i}$ の直積と同型。（$K$ の正規部分群は \ref{grp:normal-subgroups-simple-product} より $T_{J}$ の形なので、$N_{2}$ は一つの $T_{j}$ を除いた積で、$S_{1}\cong T_{j}$ である。）
:::

::: supplement
**有限個の部分直積の形.** 上の証明を追うと、$H$ は $\{1,\dots,n\}$ のある分割 $\{1,\dots,n\}=P_{1}\sqcup\cdots\sqcup P_{k}$ について、各ブロック $P_{l}$ の中の因子どうしを同型で結んだ「対角型」の部分群の直積になっていることがわかる。この形は、有限群の極小正規部分群や、置換群の分類（オナン–スコットの定理）で基本的な役割を果たす（詳細は本サイトの範囲外）。

**グルサの補題の一般化.** 同じ議論は、群の代わりに環・加群・リー代数などの直積の部分構造にも適用できる。加群では切片の条件が「部分加群の剰余加群」になり、正規性の条件は不要になる。圏論的には、部分直積は二つの全射 $G_{i}\to Q$ のファイバー積（引き戻し）であり（\ref{grp:subdirect-classification}）、\ref{grp:goursat} はこれを部分群全体に広げたものである。

**部分直積と環論.** 中国剰余定理（\ref{grp:chinese-remainder-group}）では $\Z/mn\to\Z/m\times\Z/n$ が同型だが、$\gcd(m,n)\neq 1$ のとき像は真の部分直積になる。たとえば $\Z/4\to\Z/2\times\Z/2$ の像は対角部分群である（一般に、像は $\Z/\gcd(m,n)$ 上のファイバー積で、\ref{grp:subdirect-classification} の形をしている）。
:::

## 問題 {#grp:sec-sp-problems}

::: problem {#grp:prob-diagonal-maximal}
$S$ を非可換な単純群とする。対角部分群 $\Delta=\{(s,s)\}$ は $S\times S$ の極大部分群（$\Delta\subsetneq H\le S\times S$ なら $H=S\times S$）であり、正規部分群ではないことを示せ。
:::

::: solution
**極大.** $\Delta\le H$ なら $p_{i}(H)\supseteq p_{i}(\Delta)=S$ なので $H$ は部分直積。\ref{grp:subdirect-simple} より $H=S\times S$ か $H=\Gamma_{\alpha}$。後者なら $\Delta\subseteq\Gamma_{\alpha}$ から $(s,s)\in\Gamma_{\alpha}$、$\alpha(s)=s$ がすべての $s$ で成り立ち、$\alpha=\id$、$H=\Delta$。

**正規でない.** \ref{grp:normal-subgroups-simple-product} より、$S\times S$ の正規部分群は $\{e\}$, $S\times\{e\}$, $\{e\}\times S$, $S\times S$ だけで、$\Delta$ はどれでもない（$S\neq\{e\}$ なので $\Delta$ は $\{e\}$ でも全体でもなく、$(s,s)$（$s\neq e$）は $S\times\{e\}$ にも $\{e\}\times S$ にも入らない）。直接には：$s,t$ が可換でないとき $(t,e)(s,s)(t,e)^{-1}=(tst^{-1},s)\notin\Delta$。
:::

::: problem {#grp:prob-center-diagonal}
群 $G$ の中心 $Z(G)$ が自明でないとき、$D\defeq\{(z,z) : z\in Z(G)\}$ は $G\times G$ の正規部分群で、$N_{1}\times N_{2}$ の形でないことを示せ。
:::

::: solution
**正規.** $(g,h)(z,z)(g,h)^{-1}=(gzg^{-1},hzh^{-1})=(z,z)$（$z$ は中心の元）。

**直積型でない.** $D=N_{1}\times N_{2}$ なら $p_{1}(D)=N_{1}=Z(G)$, $p_{2}(D)=N_{2}=Z(G)$ で $D=Z(G)\times Z(G)$。$z\neq e$ をとると $(z,e)\in Z(G)\times Z(G)$ だが $(z,e)\notin D$。（成分データでは $A_{i}=Z(G)$, $B_{i}=\{e\}$, $\theta=\id$ で、\ref{grp:goursat-normal} の条件 $A_{i}/B_{i}=Z(G)\le Z(G)$ をみたす。）
:::

::: problem {#grp:prob-count-subgroups-zp2-zp}
素数 $p$ について、$\Z/p^{2}\times\Z/p$ の部分群の個数を求めよ。
:::

::: solution
\ref{grp:subgroups-zm-zn} で $a\in\{1,p,p^{2}\}$, $b\in\{1,p\}$：$\gcd$ は $b=1$ の行で $1,1,1$、$b=p$ の行で $1,p,p$。合計 $3+1+2p=2p+4$。（$p=2$ なら $8$ で、前の例の $\Z/2\times\Z/4$ と一致する。）
:::
