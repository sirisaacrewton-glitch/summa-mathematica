# シローの定理の応用 {#grp:page-sylow-applications keywords="groups of order pq, no simple groups of order less than 60, simple group of order 60 is A5, embedding into alternating groups, counting elements"}

シローの定理の個数の条件 $n_{p}\equiv 1\pmod p$, $n_{p}\mid m$（\ref{grp:sylow-count}）は、多くの場合 $n_{p}=1$、すなわちシロー部分群が正規であることを強制する。このページでは三つの典型的な応用を示す。(1) 素数 $p<q$ について位数 $pq$ の群を分類する（\ref{grp:order-pq}）。(2) 位数が $60$ 未満の群は、素数位数でなければ単純でないこと、すなわち非可換な単純群の最小位数が $60$ であることを示す（\ref{grp:no-simple-below-60}）。(3) 位数 $60$ の単純群は交代群 $A_{5}$ と同型であることを示す（\ref{grp:simple-60-is-a5}）。道具として、シローの定理のほかに、指数の小さい部分群から対称群への準同型を作る方法（\ref{grp:simple-embeds-alternating}）と、元の位数ごとの個数の数え上げを使う。

> 資料によらず書いた（位数 $pq$ の分類と位数 $60$ 未満の単純群の議論は、多くの群論の教科書にある標準的な論法である）。

## 記法と定義の確認 {#grp:sec-sa2-notation}

::: notation
- シロー $p$ 部分群・$n_{p}$・シローの定理・$n_{p}=1$ と正規性は \ref{grp:sylow-subgroup}, \ref{grp:sylow-existence}, \ref{grp:sylow-conjugacy}, \ref{grp:sylow-count}, \ref{grp:sylow-normal-iff-unique}。
- 剰余類への作用の核と、指数 $k$ の部分群から $S_{k}$ への準同型は \ref{grp:core-index}。単純群・$A_{n}$ の単純性は \ref{grp:simple-group}, \ref{grp:an-simple}、符号と交代群は \ref{grp:sign}, \ref{grp:alternating-basic}。$p$ 群が各位数の正規部分群をもつことは \ref{grp:p-group-normal-subgroups}、コーシーの定理は \ref{grp:cauchy}。
- 内部直積・内部半直積・中国剰余定理は \ref{grp:internal-direct-product}, \ref{grp:internal-semidirect}, \ref{grp:semidirect-product}, \ref{grp:chinese-remainder-group}。巡回群の自己同型群 $\Aut(\Z/q\Z)\cong(\Z/q\Z)^{\times}$ は \ref{grp:prob-aut-cyclic}。積集合の位数は \ref{grp:product-formula}。
- 素数 $p$ と整数 $a,b$ について、$p\mid ab$ なら $p\mid a$ または $p\mid b$（$p\nmid a$ なら $\gcd(p,a)=1$ でユークリッドの補題 \ref{grp:bezout-euclid} の 4）。
- 位数が素数 $r$ の部分群どうしは、等しくなければ共通部分が $\{e\}$（共通部分の位数は $r$ の約数）。したがって位数 $r$ の部分群が $k$ 個あれば、位数 $r$ の元はちょうど $k(r-1)$ 個ある（位数 $r$ の元はちょうど一つの位数 $r$ の部分群を生成する）。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 交代群への埋め込み {#grp:sec-sa2-embedding}

::: lemma 単純群は交代群に入る {#grp:simple-embeds-alternating keywords="a simple group with a subgroup of index k embeds into A_k" index="交代群への埋め込み|こうたいぐんへのうめこみ"}
$G$ を位数が $2$ より大きい単純群、$H\le G$ で $(G:H)=k\ge 2$ とする。$G$ は $A_{k}$ のある部分群と同型である。特に $\abs{G}$ は $k!/2$ を割り切る。
:::

::: proof
**Step 1（単射）.** $G$ の $G/H$ への作用の置換表現 $\rho:G\to\Sym(G/H)\cong S_{k}$ の核は $\mathrm{core}_{G}(H)\subseteq H\neq G$（\ref{grp:core-index}）で、正規部分群なので単純性から $\{e\}$。$\rho$ は単射。

**Step 2（像は $A_{k}$ に入る）.** $\sgn\circ\rho:G\to\{\pm 1\}$ の核 $K$ は正規で、$(G:K)\le 2$。$K=\{e\}$ なら $\abs{G}\le 2$ となり仮定に反するので、単純性から $K=G$、すなわち $\rho(G)\subseteq A_{k}$。$G\cong\rho(G)\le A_{k}$ で、ラグランジュの定理から $\abs{G}\mid k!/2$。

::: hypcheck
- **単純**：Step 1 と Step 2 で核が自明または全体であることに使った。
- **$\abs{G}>2$**：位数 $2$ の群は単純だが $A_{2}=\{e\}$ に入らない。
:::
:::

## 位数 pq の群 {#grp:sec-sa2-pq}

::: lemma 多項式の根の個数 {#grp:polynomial-roots-mod-q keywords="a polynomial of degree d has at most d roots modulo a prime" index="多項式の根の個数|たこうしきのこんのこすう"}
$q$ を素数、$f(x)=c_{d}x^{d}+\cdots+c_{0}$ を整数係数の多項式で $q\nmid c_{d}$ とする。$q\mid f(x)$ となる $x\in\{0,1,\dots,q-1\}$ は高々 $d$ 個である。
:::

::: proof
$d$ についての帰納法。$d=0$ なら $f=c_{0}$ で $q\nmid c_{0}$ なので根はない。$d\ge 1$ とし、根 $a$ があるとする（なければ $0$ 個）。$x^{k}-a^{k}=(x-a)(x^{k-1}+x^{k-2}a+\cdots+a^{k-1})$ を各項に使うと、$f(x)-f(a)=(x-a)g(x)$ となる整数係数の多項式 $g$（次数 $d-1$、最高次の係数 $c_{d}$）がある。根 $b\neq a$ について $q\mid f(b)-f(a)=(b-a)g(b)$ で、$0<\abs{b-a}<q$ なので $q\nmid b-a$、よって $q\mid g(b)$。帰納法の仮定から、そのような $b$ は高々 $d-1$ 個。$a$ と合わせて高々 $d$ 個。
:::

::: corollary {#grp:units-mod-q-unique-subgroup}
$p,q$ を素数とする。$(\Z/q\Z)^{\times}$ の位数 $p$ の部分群は高々一つで、$p\mid q-1$ なら（コーシーの定理により）ちょうど一つある。
:::

::: proof
$U_{1}\neq U_{2}$ を位数 $p$ の部分群とすると $U_{1}\cap U_{2}=\{1\}$ で、$(\Z/q\Z)^{\times}$ は可換なので $U_{1}U_{2}$ は位数 $p^{2}$ の部分群（\ref{grp:product-formula}, \ref{grp:product-with-normal}）。その元 $x$ はすべて $x^{p}=1$（可換なので $(uv)^{p}=u^{p}v^{p}$）、すなわち $q\mid x^{p}-1$。\ref{grp:polynomial-roots-mod-q} より根は高々 $p$ 個なので $p^{2}\le p$、矛盾。$p\mid q-1=\abs{(\Z/q\Z)^{\times}}$ なら \ref{grp:cauchy} より位数 $p$ の元があり、それが生成する部分群が位数 $p$。
:::

::: theorem 位数 pq の群 {#grp:order-pq keywords="classification of groups of order pq" index="位数 pq の群|いすうぴーきゅーのぐん"}
$p<q$ を素数、$\abs{G}=pq$ とする。
1. シロー $q$ 部分群 $Q$ は正規で、$G\cong Q\rtimes_{\theta}P$（$P$ はシロー $p$ 部分群）。
2. $p\nmid q-1$ なら $G\cong\Z/pq\Z$。
3. $p\mid q-1$ なら、$G$ は $\Z/pq\Z$ か、ただ一つの（同型を除いて）非可換群 $\Z/q\Z\rtimes_{\theta}\Z/p\Z$（$\theta$ は自明でない）のどちらかと同型で、どちらも実際に存在する。
:::

::: proof
**Step 1（1）.** $n_{q}\mid p$, $n_{q}\equiv 1\pmod q$ で、$n_{q}\in\{1,p\}$ のうち $p<q$ なので $p\not\equiv 1\pmod q$。よって $n_{q}=1$、$Q\trianglelefteq G$。$P$ をシロー $p$ 部分群とすると $Q\cap P=\{e\}$（位数が互いに素）、$\abs{QP}=pq$ なので $QP=G$。\ref{grp:internal-semidirect} より $G\cong Q\rtimes_{\theta}P$、$\theta_{x}(y)=xyx^{-1}$。

**Step 2（$\theta$ の像）.** $Q\cong\Z/q\Z$, $P\cong\Z/p\Z$（\ref{grp:lagrange-corollaries}, \ref{grp:cyclic-classification}）。$\theta:P\to\Aut(Q)\cong(\Z/q\Z)^{\times}$（位数 $q-1$）の像の位数は $\abs{P}=p$ と $q-1$ の公約数（第一同型定理とラグランジュの定理）なので $1$ か $p$。

**Step 3（2）.** $p\nmid q-1$ なら像の位数は $1$、$\theta$ は自明で、$P$ の元は $Q$ の元と可換。すると $P$ も正規（$G=QP$ の元 $yx$ による共役で $P$ は動かない）で、\ref{grp:internal-direct-product} と中国剰余定理から $G\cong\Z/q\Z\times\Z/p\Z\cong\Z/pq\Z$。

**Step 4（3：二つの場合）.** $p\mid q-1$ とする。$\theta$ が自明なら Step 3 と同じく $\Z/pq\Z$。自明でなければ $\theta$ は単射で、像は $\Aut(Q)$ の位数 $p$ の部分群 $U$（\ref{grp:units-mod-q-unique-subgroup} よりただ一つ）。$G$ は非可換（$\theta_{x}\neq\id$ となる $x$ があり、$x$ と $Q$ のある元が可換でない）。

**Step 5（3：非可換なものの一意性）.** $\theta,\theta':\Z/p\Z\to\Aut(\Z/q\Z)$ がともに単射なら、像はともに $U$ なので $\alpha\defeq\theta^{-1}\circ\theta'$（$\theta$ の値域を $U$ に制限した逆）は $\Z/p\Z$ の自己同型で、$\theta'=\theta\circ\alpha$。$\Phi(n,h)\defeq(n,\alpha(h))$ とおくと
$$
\Phi\bigl((n,h)(n',h')\bigr)=\bigl(n\theta'_{h}(n'),\ \alpha(hh')\bigr)=\bigl(n\theta_{\alpha(h)}(n'),\ \alpha(h)\alpha(h')\bigr)=\Phi(n,h)\Phi(n',h')
$$
（$\Z/p\Z$ を乗法的に書いた）なので、$\Phi$ は $\Z/q\Z\rtimes_{\theta'}\Z/p\Z$ から $\Z/q\Z\rtimes_{\theta}\Z/p\Z$ への同型。

**Step 6（3：存在）.** $U$ の生成元 $u$ をとり、$\theta(k)\defeq u^{k}$ とすると単射準同型 $\Z/p\Z\to\Aut(\Z/q\Z)$ で、半直積 $\Z/q\Z\rtimes_{\theta}\Z/p\Z$ は位数 $pq$ の非可換群（\ref{grp:semidirect-group}）。$\Z/pq\Z$ は可換なので両者は同型でない。

::: hypcheck
- **$p<q$**：Step 1 で $n_{q}=1$ に使った。
- **一意性**：Step 5 で、位数 $p$ の部分群がただ一つであること（\ref{grp:units-mod-q-unique-subgroup}）を使った。これは $(\Z/q\Z)^{\times}$ が巡回群であることの帰結の一部だが、巡回性そのものは使っていない。
:::
:::

::: example
1. $p=2$, $q$ 奇素数：$2\mid q-1$ は常に成り立つ。位数 $2q$ の群は $\Z/2q\Z$ か二面体群 $D_{q}$（\ref{grp:dihedral-semidirect} で $\theta_{1}(x)=-x$ は自明でない）。
2. 位数 $15,33,35,51,65,\dots$：$3\nmid 4$, $3\nmid 10$, $5\nmid 6$, $3\nmid 16$, $5\nmid 12$ なので巡回群のみ。
3. 位数 $21=3\cdot 7$：$3\mid 6$ なので非可換な群がちょうど一つある（$x\mapsto 2x$ は $\Z/7\Z$ の位数 $3$ の自己同型：$2^{3}=8\equiv 1$）。
:::

## 位数 60 未満の単純群 {#grp:sec-sa2-below-60}

::: lemma p² q 型の群 {#grp:p2q-not-simple keywords="groups of order p^2 q are not simple" index="位数 p²q の群|いすうぴーにじょうきゅーのぐん"}
$p\neq q$ を素数とする。位数 $p^{2}q$ の群は単純でない。
:::

::: proof
**Case $q<p$.** $n_{p}\mid q$, $n_{p}\equiv 1\pmod p$ で、$q<p$ なので $n_{p}=1$。

**Case $q>p$.** $n_{q}\mid p^{2}$, $n_{q}\equiv 1\pmod q$。$n_{q}=p$ は $p<q$ から不可能。$n_{q}=p^{2}$ なら $q\mid p^{2}-1=(p-1)(p+1)$ で、$q>p-1\ge 1$ なので $q\mid p+1$、$q\le p+1$ と $q>p$ から $q=p+1$。素数の差が $1$ なのは $p=2$, $q=3$（位数 $12$）だけ。このとき $n_{3}=4$ で、位数 $3$ の元が $4\cdot 2=8$ 個（記法の確認）。残り $4$ 個の元に、位数 $4$ のシロー $2$ 部分群が入らなければならない（位数 $4$ の部分群の元の位数は $1,2,4$）ので、シロー $2$ 部分群はちょうどその $4$ 元からなるただ一つで、$n_{2}=1$。いずれの場合も、ある $n_{r}=1$ で正規なシロー部分群があり、それは $\{e\}$ でも $G$ でもない。
:::

::: theorem 位数 60 未満の単純群 {#grp:no-simple-below-60 keywords="there is no nonabelian simple group of order less than 60, smallest nonabelian simple group" index="最小の非可換単純群|さいしょうのひかかんたんじゅんぐん"}
位数が $60$ 未満の単純群は、素数位数の巡回群に限る。したがって、非可換な単純群の位数は $60$ 以上で、$A_{5}$（\ref{grp:an-simple}）が最小である。
:::

::: proof
$\abs{G}=n<60$ で $n$ は $1$ でも素数でもないとし、$G$ が単純でないことを示す。$n$ の素因数分解の形で分ける（各場合で、ある $n_{r}=1$ を示せば、正規なシロー部分群が真の非自明な正規部分群になる）。

**Step 1（$n=p^{k}$, $k\ge 2$）.** \ref{grp:p-group-normal-subgroups} より位数 $p$ の正規部分群がある：$n=4,8,9,16,25,27,32,49$。

**Step 2（$n=pq$）.** \ref{grp:order-pq} の 1：$n=6,10,14,15,21,22,26,33,34,35,38,39,46,51,55,57,58$。

**Step 3（$n=p^{2}q$）.** \ref{grp:p2q-not-simple}：$n=12,18,20,28,44,45,50,52$。

**Step 4（残り）.** $60$ 未満で上のどれでもない合成数は $24,30,36,40,42,48,54,56$。
- $n=40=2^{3}\cdot 5$：$n_{5}\mid 8$, $n_{5}\equiv 1\pmod 5$ より $n_{5}=1$。
- $n=42=2\cdot 3\cdot 7$：$n_{7}\mid 6$, $\equiv 1\pmod 7$ より $n_{7}=1$。
- $n=54=2\cdot 3^{3}$：$n_{3}\mid 2$, $\equiv 1\pmod 3$ より $n_{3}=1$。
- $n=30=2\cdot 3\cdot 5$：$n_{5}\in\{1,6\}$, $n_{3}\in\{1,10\}$。両方とも $1$ でないなら、位数 $5$ の元が $6\cdot 4=24$ 個、位数 $3$ の元が $10\cdot 2=20$ 個で、計 $44>30$ となり矛盾。
- $n=56=2^{3}\cdot 7$：$n_{7}\in\{1,8\}$。$n_{7}=8$ なら位数 $7$ の元が $48$ 個で、残り $8$ 個の元にシロー $2$ 部分群（位数 $8$、元の位数は $2$ の冪）が入らなければならないので、それはちょうど残りの $8$ 元で、$n_{2}=1$。
- $n=24=2^{3}\cdot 3$：$n_{2}\in\{1,3\}$。$n_{2}=3$ なら $(G:N_{G}(P))=3$ で、$G$ が単純なら \ref{grp:simple-embeds-alternating} より $24\mid 3!/2=3$ となり矛盾。
- $n=36=2^{2}\cdot 3^{2}$：$n_{3}\in\{1,4\}$。$n_{3}=4$ なら指数 $4$ の部分群 $N_{G}(P)$ があり、単純なら $36\mid 4!/2=12$ で矛盾。
- $n=48=2^{4}\cdot 3$：$n_{2}\in\{1,3\}$。$n_{2}=3$ なら指数 $3$ で、単純なら $48\mid 3$ で矛盾。

**Step 5（後半）.** 非可換な単純群は素数位数でない（素数位数の群は巡回群）ので、位数は $60$ 以上。$A_{5}$ は位数 $60$ の非可換単純群。

::: hypcheck
- 場合の網羅：$4\le n<60$ の合成数は、素数冪（Step 1）、相異なる二素数の積（Step 2）、$p^{2}q$（Step 3）と、Step 4 の $8$ 個で尽くされる（$2^{3}\cdot 3$, $2\cdot 3\cdot 5$, $2^{2}\cdot 3^{2}$, $2^{3}\cdot 5$, $2\cdot 3\cdot 7$, $2^{4}\cdot 3$, $2\cdot 3^{3}$, $2^{3}\cdot 7$）。
- Step 4 の $n=24,36,48$ で使った \ref{grp:simple-embeds-alternating} は、$\abs{G}>2$ の単純群に適用した。
:::
:::

## 位数 60 の単純群 {#grp:sec-sa2-a5}

::: theorem 位数 60 の単純群は A₅ {#grp:simple-60-is-a5 keywords="every simple group of order 60 is isomorphic to A_5" index="A₅ の特徴づけ|えーごのとくちょうづけ"}
位数 $60$ の単純群は $A_{5}$ と同型である。
:::

::: proof
**Step 1（$n_{5}=6$）.** $n_{5}\mid 12$, $n_{5}\equiv 1\pmod 5$ より $n_{5}\in\{1,6\}$。単純なので $n_{5}\neq 1$、よって $n_{5}=6$ で、$(G:N_{G}(P))=6$。\ref{grp:simple-embeds-alternating} より、$G$ は $A_{6}$ の部分群 $H$（$\abs{H}=60$、指数 $360/60=6$）と同型。

**Step 2（$A_{6}$ を $A_{6}/H$ に作用させる）.** $A_{6}$ は単純（\ref{grp:an-simple}）で位数 $>2$、$(A_{6}:H)=6$ なので、\ref{grp:simple-embeds-alternating} の証明と同様に置換表現 $\psi:A_{6}\to\Sym(A_{6}/H)$ は単射で、像は（$A_{6}/H$ と $\{1,\dots,6\}$ を番号付けで同一視して）$A_{6}$ に含まれる。$\abs{A_{6}}=360=\abs{A_{6}}$ なので $\psi:A_{6}\to A_{6}$ は全単射、すなわち同型。

**Step 3（$H$ は一点の安定化群に写る）.** 剰余類 $H\in A_{6}/H$ の安定化群は $H$ 自身（\ref{grp:orbit-stabilizer} の後の例 3）。$H$ に対応する番号を $i$ とすると、$\psi(H)=\{\sigma\in A_{6} : \sigma(i)=i\}$（$\psi$ が全単射なので、$i$ を固定する元はちょうど $\psi(H)$ の元）。

**Step 4（一点の安定化群は $A_{5}$）.** $\{\sigma\in A_{6} : \sigma(i)=i\}$ は、$\{1,\dots,6\}\setminus\{i\}$ の偶置換全体と同一視でき（$i$ を固定する置換の符号は、他の $5$ 点の置換としての符号と等しい：型が同じ。\ref{grp:sign-computation}）、$A_{5}$ と同型。よって $G\cong H\cong\psi(H)\cong A_{5}$。

::: hypcheck
- **$A_{6}$ の単純性**：Step 2 で $\psi$ の単射性と、像が $A_{6}$ に入ることに使った。
- **位数 $60$**：Step 1 の $n_{5}=6$ と、指数 $6$ に使った。
:::
:::

::: supplement
**次に小さい非可換単純群.** $A_{5}$ の次は位数 $168$ の群（$\mathrm{PSL}_{2}(\F_{7})$ と同型なもの）であることが知られている。その証明には、位数 $60$ から $168$ までのすべての位数について同様の議論が要り、ここでは扱わない。

**数え上げの論法.** $n=30,56$ と \ref{grp:p2q-not-simple} の $n=12$ で使った「位数 $r$ の元を数えると全体からはみ出す」論法は、シローの定理と並ぶ基本的な手法である。
:::

## 問題 {#grp:sec-sa2-problems}

::: problem {#grp:prob-order-132}
位数 $132=2^{2}\cdot 3\cdot 11$ の群は単純でないことを示せ。
:::

::: solution
$n_{11}\mid 12$, $n_{11}\equiv 1\pmod{11}$ より $n_{11}\in\{1,12\}$。$n_{11}=1$ ならよい。$n_{11}=12$ なら位数 $11$ の元が $120$ 個。$n_{3}\mid 44$, $n_{3}\equiv 1\pmod 3$ より $n_{3}\in\{1,4,22\}$。$n_{3}\ge 4$ なら位数 $3$ の元が $8$ 個以上で、ここまでで $128$ 個、単位元を加えて $129$ 個、残りは $3$ 個以下。シロー $2$ 部分群（位数 $4$、単位元以外の $3$ 元の位数は $2$ か $4$）は残りの元と単位元からなるしかないので、ただ一つで $n_{2}=1$。よって $n_{11}$, $n_{3}$, $n_{2}$ のどれかは $1$。
:::

::: problem {#grp:prob-order-2p}
$p$ を奇素数とする。位数 $2p$ の群は $\Z/2p\Z$ か $D_{p}$ と同型であることを示せ（$p=3$ は \ref{grp:prob-order-six}）。
:::

::: solution
\ref{grp:order-pq} を $2<p$ に使う。$2\mid p-1$ なので、$\Z/2p\Z$ か、ただ一つの非可換群 $\Z/p\Z\rtimes_{\theta}\Z/2\Z$（$\theta$ は自明でない）と同型。$D_{p}\cong\Z/p\Z\rtimes_{\theta}\Z/2\Z$ で $\theta_{1}(x)=-x$ は自明でない（\ref{grp:dihedral-semidirect}、$p\ge 3$ なので $-x\neq x$ となる $x$ がある）ので、非可換群は $D_{p}$。
:::

::: problem {#grp:prob-order-35}
位数 $35$ の群は巡回群であることを示せ。
:::

::: solution
$p=5<q=7$ で $5\nmid 6$ なので、\ref{grp:order-pq} の 2 より $\Z/35\Z$ と同型。
:::
