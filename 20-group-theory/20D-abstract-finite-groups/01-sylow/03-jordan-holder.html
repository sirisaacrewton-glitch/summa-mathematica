# 組成列とジョルダン–ヘルダーの定理 {#grp:page-jordan-holder keywords="subnormal series, composition series, composition factors, Jordan-Holder theorem, maximal normal subgroup, unique factorization"}

有限群 $G$ を、正規部分群で割って小さくしていく列 $G=G_{0}\trianglerighteq G_{1}\trianglerighteq\cdots\trianglerighteq G_{r}=\{e\}$ を考える。各剰余群 $G_{i-1}/G_{i}$ が単純群になるまで細かくした列を**組成列**といい（\ref{grp:composition-series}）、そのときの単純群たちを**組成因子**という。有限群には必ず組成列があり（\ref{grp:composition-series-exists}）、**ジョルダン–ヘルダーの定理**（\tref{grp:jordan-holder}）は、組成因子が（並び順と同型を除いて）組成列の取り方によらないことを主張する。つまり有限群は、整数が素数の積に分解されるように、単純群という「部品」に分解され、部品の一覧は群だけで決まる。実際、巡回群 $\Z/n\Z$ に適用すると素因数分解の一意性が得られる（\ref{grp:unique-factorization-jh}）。

> ジョルダン–ヘルダーの定理は、有限群に限って、位数についての帰納法と第二同型定理で証明した（シュライアーの細分定理やツァッセンハウスの補題を経由する一般的な証明は使わない）。

## 記法と定義の確認 {#grp:sec-jh-notation}

::: notation
- 正規部分群・剰余群・対応定理・第二同型定理は \ref{grp:normal-subgroup}, \ref{grp:quotient-group}, \ref{grp:correspondence}, \ref{grp:second-isomorphism}、$HN$ は \ref{grp:product-with-normal}。単純群は \ref{grp:simple-group}、$A_{n}$ の単純性は \ref{grp:an-simple}。
- 巡回群の部分群と巡回群の分類は \ref{grp:subgroups-cyclic}, \ref{grp:cyclic-classification}、$p$ 群の正規部分群は \ref{grp:p-group-normal-subgroups}。
- $N\trianglelefteq G$ を $G\trianglerighteq N$ とも書く。$N\trianglelefteq G$ かつ $N\neq G$ を $N\triangleleft G$ と書く。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 組成列 {#grp:sec-jh-series}

::: definition 正規列・組成列・組成因子 {#grp:composition-series keywords="subnormal series, normal series, composition series, composition factors, length" index="正規列|せいきれつ, 組成列|そせいれつ, 組成因子|そせいいんし"}
群 $G$ の部分群の列
$$
G=G_{0}\trianglerighteq G_{1}\trianglerighteq\cdots\trianglerighteq G_{r}=\{e\}
$$
（各 $G_{i}$ は $G_{i-1}$ の正規部分群。$G$ で正規である必要はない）を $G$ の**正規列**、$r$ をその**長さ**、$G_{i-1}/G_{i}$ を**因子**という。すべての因子が単純群であるとき**組成列**といい、その因子を**組成因子**という。
:::

::: intuition
組成列は「これ以上間に正規部分群を挟めない」列である（\ref{grp:maximal-normal}）。各組成因子は単純群なので、それ以上割り算できない部品である。
:::

::: lemma 極大正規部分群 {#grp:maximal-normal keywords="maximal normal subgroup, G/N is simple iff N is maximal normal" index="極大正規部分群|きょくだいせいきぶぶんぐん"}
$N\triangleleft G$ について、$G/N$ が単純 $\iff$ $N\subsetneq M\triangleleft G$ となる正規部分群 $M$ がない（$N$ は**極大正規部分群**）。
:::

::: proof
対応定理（\tref{grp:correspondence.1}, \ref[3]{grp:correspondence.3}）より、$G/N$ の正規部分群は、$N$ を含む $G$ の正規部分群 $M$ の $M/N$ と一対一に対応し、$M=N$ は $\{e\}$、$M=G$ は $G/N$ に対応する。$G/N\neq\{e\}$（$N\neq G$）なので、$G/N$ が単純 $\iff$ そのような $M$ は $N$ と $G$ だけ。
:::

::: theorem 組成列の存在 {#grp:composition-series-exists keywords="every finite group has a composition series" index="組成列の存在|そせいれつのそんざい"}
有限群には組成列がある。
:::

::: proof
$\abs{G}$ についての帰納法。$G=\{e\}$ なら長さ $0$ の列 $G=\{e\}$ が組成列。$G\neq\{e\}$ とする。$G$ の真の正規部分群（$\{e\}$ は一つ）のうち位数が最大のもの $N$ をとる（有限個なので存在する）。$N\subsetneq M\triangleleft G$ なら $\abs{M}>\abs{N}$ で最大性に反するので、$N$ は極大正規部分群で、\ref{grp:maximal-normal} より $G/N$ は単純。$\abs{N}<\abs{G}$ なので帰納法の仮定から $N$ に組成列 $N=N_{0}\trianglerighteq\cdots\trianglerighteq N_{s}=\{e\}$ があり、$G\trianglerighteq N\trianglerighteq N_{1}\trianglerighteq\cdots$ が $G$ の組成列。

::: hypcheck
- **有限**：位数最大の真の正規部分群をとるのに使った。無限群では偽：$\Z$ は組成列をもたない（$\Z$ の部分群は $d\Z$ で、$\{0\}$ の直前の項 $d\Z\cong\Z$ は単純でない（$2d\Z$ を含む）ので、組成列の最後の因子 $G_{r-1}/\{0\}$ が単純になりえない）。
:::
:::

::: example
1. $\Z/12\Z$ の組成列：$\Z/12\Z\trianglerighteq 2\Z/12\Z\trianglerighteq 4\Z/12\Z\trianglerighteq\{0\}$（因子 $\Z/2,\Z/2,\Z/3$）や、$\Z/12\Z\trianglerighteq 3\Z/12\Z\trianglerighteq 6\Z/12\Z\trianglerighteq\{0\}$（因子 $\Z/3,\Z/2,\Z/2$）など。並び順は違うが、因子の一覧は同じ。
2. $S_{4}\trianglerighteq A_{4}\trianglerighteq V\trianglerighteq\{e,(1\ 2)(3\ 4)\}\trianglerighteq\{e\}$ は組成列で、因子は $\Z/2,\Z/3,\Z/2,\Z/2$（$\abs{A_{4}/V}=3$、$V\cong\Z/2\times\Z/2$）。
3. $n\ge 5$ なら $S_{n}\trianglerighteq A_{n}\trianglerighteq\{e\}$ は組成列で、因子は $\Z/2$ と $A_{n}$（\ref{grp:an-simple}）。
4. $\abs{G}=p^{n}$ なら、組成因子はすべて $\Z/p\Z$ で長さは $n$（\ref{grp:p-group-normal-subgroups} から各段の指数 $p$ の列がとれる。単純な $p$ 群は位数 $p$）。
:::

## ジョルダン–ヘルダーの定理 {#grp:sec-jh-theorem}

::: theorem ジョルダン–ヘルダーの定理 {#grp:jordan-holder keywords="Jordan-Holder theorem, uniqueness of composition factors" index="ジョルダン–ヘルダーの定理|じょるだんへるだーのていり" refname="ジョルダン–ヘルダーの定理"}
有限群 $G$ の二つの組成列
$$
G=G_{0}\trianglerighteq G_{1}\trianglerighteq\cdots\trianglerighteq G_{r}=\{e\},\qquad G=H_{0}\trianglerighteq H_{1}\trianglerighteq\cdots\trianglerighteq H_{s}=\{e\}
$$
について、$r=s$ であり、$\{1,\dots,r\}$ の置換 $\pi$ で $G_{i-1}/G_{i}\cong H_{\pi(i)-1}/H_{\pi(i)}$（すべての $i$）となるものがある。
:::

::: intuition
二つの組成列の最初の段 $G_{1}$, $H_{1}$ が同じなら、残りは $G_{1}$ の組成列どうしの比較で、帰納法が使える。違うなら、$K=G_{1}\cap H_{1}$ を通る第三の組成列を作り、第二同型定理で「$G/G_{1}\cong H_{1}/K$, $G/H_{1}\cong G_{1}/K$」と因子を入れ替える。
:::

::: proof
$\abs{G}$ についての帰納法。主張「$G$ のどの二つの組成列も同値（長さが等しく、因子が並べ替えと同型を除いて一致）」を $P(G)$ とする。$G=\{e\}$ なら組成列は長さ $0$ のものだけ。$G\neq\{e\}$ とし、$\abs{G}$ より小さい位数の群について成り立つとする。このとき $r,s\ge 1$。

**Case 1（$G_{1}=H_{1}$）.** $G_{1}\trianglerighteq G_{2}\trianglerighteq\cdots$ と $H_{1}\trianglerighteq H_{2}\trianglerighteq\cdots$ は $G_{1}$ の二つの組成列で、$\abs{G_{1}}<\abs{G}$ なので帰納法の仮定から同値。最初の因子 $G/G_{1}=G/H_{1}$ を加えて、二つの列も同値。

**Case 2（$G_{1}\neq H_{1}$）：$G_{1}H_{1}=G$.** $G_{1},H_{1}$ はどちらも $G$ の正規部分群で、$G/G_{1}$, $G/H_{1}$ は単純なので、\ref{grp:maximal-normal} よりともに極大正規部分群。$G_{1}H_{1}$ は $G$ の正規部分群（\ref{grp:product-with-normal}。積の元 $g_{1}h_{1}$ の共役は $(gg_{1}g^{-1})(gh_{1}g^{-1})$）で、$G_{1}\subseteq G_{1}H_{1}$。$G_{1}H_{1}=G_{1}$ なら $H_{1}\subseteq G_{1}$ で、$H_{1}$ の極大性から $H_{1}=G_{1}$ となり仮定に反する。よって $G_{1}\subsetneq G_{1}H_{1}$ で、$G_{1}$ の極大性から $G_{1}H_{1}=G$。

**Case 2：因子の入れ替え.** $K\defeq G_{1}\cap H_{1}$ とおく。\ref{grp:second-isomorphism}を $H=H_{1}$, $N=G_{1}$ に使うと $H_{1}/K\cong G_{1}H_{1}/G_{1}=G/G_{1}$、$H=G_{1}$, $N=H_{1}$ に使うと $G_{1}/K\cong G/H_{1}$。どちらも単純で、特に $K\triangleleft G_{1}$, $K\triangleleft H_{1}$。

**Case 2：第三の組成列.** $K$ の組成列 $K=K_{0}\trianglerighteq\cdots\trianglerighteq K_{t}=\{e\}$ をとる（\ref{grp:composition-series-exists}）。すると
$$
(\mathrm{A})\ G_{1}\trianglerighteq K\trianglerighteq K_{1}\trianglerighteq\cdots\trianglerighteq\{e\},\qquad(\mathrm{B})\ H_{1}\trianglerighteq K\trianglerighteq K_{1}\trianglerighteq\cdots\trianglerighteq\{e\}
$$
はそれぞれ $G_{1}$, $H_{1}$ の組成列（最初の因子 $G_{1}/K\cong G/H_{1}$, $H_{1}/K\cong G/G_{1}$ が単純）。

**Case 2：比較.** $G_{1}$ の二つの組成列 $G_{1}\trianglerighteq G_{2}\trianglerighteq\cdots$ と (A) は、帰納法の仮定（$\abs{G_{1}}<\abs{G}$）から同値。よって $r-1=1+t$ で、$G_{1}$ 以下の因子の一覧は $\{G/H_{1}\}\cup\{K_{j-1}/K_{j}\}$。同様に $H_{1}$ の組成列 $H_{1}\trianglerighteq H_{2}\trianglerighteq\cdots$ と (B) から $s-1=1+t$、$H_{1}$ 以下の因子の一覧は $\{G/G_{1}\}\cup\{K_{j-1}/K_{j}\}$。したがって $r=s=t+2$ で、もとの二つの列の因子の一覧は
$$
\{G/G_{1},\ G/H_{1}\}\cup\{K_{j-1}/K_{j}\}_{j}
$$
（同型を除いた重複込みの一覧）として一致する。

::: hypcheck
- **有限**：帰納法と組成列の存在に使った。無限群でも、組成列が存在すれば同じ主張が成り立つ（シュライアーの細分定理による証明。ここでは扱わない）。
- **組成列であること（因子が単純）**：Case 2 で $G_{1}$, $H_{1}$ の極大性を使った。単なる正規列では長さも因子も一意でない（$\Z/4\Z\trianglerighteq\{0\}$ と $\Z/4\Z\trianglerighteq 2\Z/4\Z\trianglerighteq\{0\}$）。
:::
:::

::: corollary 素因数分解の一意性 {#grp:unique-factorization-jh keywords="fundamental theorem of arithmetic via Jordan-Holder" index="素因数分解の一意性|そいんすうぶんかいのいちいせい"}
整数 $n\ge 2$ は素数の積 $n=p_{1}p_{2}\cdots p_{r}$ に表せ、その表し方は並べ替えを除いて一意的である。
:::

::: proof
**Step 1（存在）.** $n$ の $1$ より大きい最小の約数は素数（それより小さい約数があればさらに小さい約数になる）なので、$n=p_{1}n'$ と書いて $n'$ に帰納法を使う。

**Step 2（組成列）.** $n=p_{1}\cdots p_{r}$ とする。$C=\Z/n\Z$ の部分群は約数 $d$ ごとにただ一つ $C_{d}$（位数 $d$、\ref{grp:subgroups-cyclic}）で、$C_{d}\subseteq C_{d'}\iff d\mid d'$（$C_{d}$ は $dx=0$ をみたす元全体に等しく（\ref{grp:prob-hom-cyclic-count} の解答の Step 2）、$d\mid d'$ なら $dx=0\Rightarrow d'x=0$）。列 $C=C_{n}\supseteq C_{n/p_{1}}\supseteq C_{n/(p_{1}p_{2})}\supseteq\cdots\supseteq C_{1}=\{0\}$ は（可換群なので）正規列で、因子の位数は $p_{1},p_{2},\dots$、素数位数の群は $\Z/p_{i}\Z$ と同型で単純。よって組成列で、組成因子は $\Z/p_{1}\Z,\dots,\Z/p_{r}\Z$。

**Step 3（一意性）.** $n=q_{1}\cdots q_{s}$ と別に表せば、同様に組成因子 $\Z/q_{1}\Z,\dots,\Z/q_{s}\Z$ の組成列が得られる。\ref{grp:jordan-holder} より $r=s$ で、$\Z/p_{i}\Z\cong\Z/q_{\pi(i)}\Z$、位数を比べて $p_{i}=q_{\pi(i)}$。

::: hypcheck
- 循環論法でないこと：ジョルダン–ヘルダーの定理の証明と、それが使う結果（第二同型定理・対応定理・ラグランジュの定理・巡回群の部分群）では素因数分解の一意性を使っていない（\ref{grp:subgroups-cyclic} は除法の原理と \ref{grp:subgroups-of-z} だけによる）。
:::
:::

::: supplement
**組成因子は群を決めない.** $\Z/4\Z$ と $\Z/2\Z\times\Z/2\Z$、$\Z/6\Z$ と $S_{3}$ はそれぞれ同じ組成因子をもつが同型でない。組成因子から群を組み立てる方法（拡大）は一通りでなく、有限群の分類は「有限単純群の分類」と「拡大の問題」の二段階に分かれる。

**可解群.** 組成因子がすべて素数位数の巡回群である有限群を可解群という（\ref{grp:page-solvable-nilpotent} で導来列による定義と同値であることを示す）。$S_{4}$ は可解、$S_{n}$（$n\ge 5$）は組成因子 $A_{n}$ をもつので可解でない。
:::

## 問題 {#grp:sec-jh-problems}

::: problem {#grp:prob-dihedral-composition}
$n\ge 3$ について、$D_{n}$ の組成因子は $\Z/2\Z$ と、$n$ の素因数分解 $n=p_{1}\cdots p_{r}$ に対応する $\Z/p_{1}\Z,\dots,\Z/p_{r}\Z$ であることを示せ。
:::

::: solution
$\ang{r}\trianglelefteq D_{n}$（指数 $2$）で $D_{n}/\ang{r}\cong\Z/2\Z$。$\ang{r}\cong\Z/n\Z$ の組成列（\ref{grp:unique-factorization-jh} の Step 2）を続けると、$D_{n}\trianglerighteq\ang{r}\trianglerighteq\cdots\trianglerighteq\{e\}$ は組成列で、因子は $\Z/2\Z,\Z/p_{1}\Z,\dots,\Z/p_{r}\Z$。ジョルダン–ヘルダーの定理より、どの組成列でも同じ。
:::

::: problem {#grp:prob-composition-through-normal}
有限群 $G$ と $N\trianglelefteq G$ について、$N$ を項に含む組成列があること、およびその組成因子は「$N$ の組成因子」と「$G/N$ の組成因子」を合わせたものであることを示せ。
:::

::: solution
$G/N$ の組成列 $G/N=\bar G_{0}\trianglerighteq\cdots\trianglerighteq\bar G_{k}=\{N\}$ をとり、対応定理で $\bar G_{i}=G_{i}/N$ と書く。$G_{i}\trianglerighteq G_{i+1}$（$\bar G_{i+1}\trianglelefteq\bar G_{i}$ を引き戻す。対応定理を $G_{i}$ と $N$ に使う）で、\ref{grp:third-isomorphism}より $G_{i}/G_{i+1}\cong\bar G_{i}/\bar G_{i+1}$ は単純。これに $N$ の組成列をつなげると $G$ の組成列になり、因子は二つの一覧を合わせたもの。
:::

::: problem {#grp:prob-length-divisors}
有限群 $G$ の組成列の長さは、$\abs{G}$ の素因数の個数（重複を数える）以下であることを示せ。等号が成り立つのはどんなときか。
:::

::: solution
各組成因子の位数は $1$ より大きく、$\abs{G}=\prod_{i}\abs{G_{i-1}/G_{i}}$（ラグランジュの定理を各段に使う）なので、各因子の位数は少なくとも一つの素因数をもち、長さは素因数の個数以下。等号は、すべての組成因子の位数が素数、すなわちすべての組成因子が素数位数の巡回群のときに限る。
:::
