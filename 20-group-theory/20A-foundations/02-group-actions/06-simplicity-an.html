# 交代群の単純性 {#grp:page-simplicity-an keywords="simple group, simplicity of the alternating group, A_n is simple for n >= 5, normal subgroups of the symmetric group, A_5"}

自明でない正規部分群をもたない群を**単純群**という（\ref{grp:simple-group}）。単純群は、正規部分群と剰余群に分解していくときの「これ以上分けられない部品」にあたる。このページでは、$n\ge 5$ のとき交代群 $A_{n}$ が単純群であること（\ref{grp:an-simple}）を証明する。鍵は、$A_{n}$ の自明でない正規部分群が必ず長さ $3$ の巡回置換を含むこと（\ref{grp:normal-contains-3cycle}）で、あとは前のページの「$A_{n}$ は 3 巡回置換で生成され（\ref{grp:an-generated-3cycles}）、それらは $A_{n}$ で互いに共役（\ref{grp:3cycles-conjugate-an}）」から従う。系として、$n\ge 5$ の対称群 $S_{n}$ の正規部分群は $\{e\}$, $A_{n}$, $S_{n}$ だけであることがわかる（\ref{grp:sn-normal-subgroups}）。

> 雪江明彦『代数学 1 群論入門』第 4 章も $A_{n}$（$n\ge 5$）の単純性を証明しているが、ここでは資料の証明を写さず、巡回置換の型による場合分けと交換子の計算で組み立てた。

## 記法と定義の確認 {#grp:sec-si-notation}

::: notation
- 巡回置換・型・巡回置換分解・共役の公式は \ref{grp:cycle}, \ref{grp:cycle-type}, \ref{grp:cycle-decomposition}, \ref{grp:conjugation-formula}、型ごとの個数は \ref{grp:cycle-type-count}。符号・交代群とその基本性質は \ref{grp:sign}, \ref{grp:sign-computation}, \ref{grp:alternating-group}, \ref{grp:alternating-basic}、3 巡回置換による生成と共役は \ref{grp:an-generated-3cycles}, \ref{grp:3cycles-conjugate-an}。
- 正規部分群・剰余群・交換子 $[x,y]=xyx^{-1}y^{-1}$ は \ref{grp:normal-subgroup}, \ref{grp:quotient-group}, \ref{grp:commutator-subgroup}。$Z(S_{n})=\{e\}$（$n\ge 3$）は \ref{grp:prob-center-sn}、位数 $2$ の正規部分群は中心に含まれることは \ref{grp:prob-normal-order-two-central}。
- 置換の積は右から施す。巡回置換の積の計算では、右の因子から順に各元の行き先を追う。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 単純群 {#grp:sec-si-simple}

::: definition 単純群 {#grp:simple-group keywords="simple group" index="単純群|たんじゅんぐん"}
群 $G\neq\{e\}$ の正規部分群が $\{e\}$ と $G$ だけのとき、$G$ を**単純群**という。
:::

::: example
1. 素数位数の群は単純：部分群の位数は $1$ か $p$（\ref{grp:lagrange}）。
2. 可換な単純群は素数位数の巡回群だけ：可換群の部分群はすべて正規なので、$G\neq\{e\}$ の元 $a\neq e$ について $\ang{a}=G$（巡回群）。$G\cong\Z$ なら $2\Z$ が自明でない正規部分群。$G\cong\Z/m\Z$ で $m$ が合成数 $m=uv$（$1<u<m$）なら $\ang{u}$ が位数 $v$ の部分群（\ref{grp:subgroups-cyclic}）。
3. $A_{4}$ は単純でない：クラインの四元群 $V\trianglelefteq A_{4}$（\ref{grp:alternating-basic} の後の例）。
:::

## 正規部分群は 3 巡回置換を含む {#grp:sec-si-key}

::: lemma 交換子の計算 {#grp:commutator-with-3cycle}
$N\trianglelefteq A_{n}$, $\sigma\in N$, $\rho\in A_{n}$ なら $[\rho,\sigma]=\rho\sigma\rho^{-1}\sigma^{-1}\in N$。さらに $\rho=(a\ b\ c)$ なら
$$
[\rho,\sigma]=(a\ b\ c)\bigl(\sigma(c)\ \sigma(b)\ \sigma(a)\bigr).
$$
:::

::: proof
$\rho\sigma\rho^{-1}\in N$（正規性）と $\sigma^{-1}\in N$ の積なので $N$ に属する。$\rho^{-1}=(c\ b\ a)$ で、\ref{grp:conjugation-formula} より $\sigma\rho^{-1}\sigma^{-1}=(\sigma(c)\ \sigma(b)\ \sigma(a))$、よって $[\rho,\sigma]=\rho\cdot\sigma\rho^{-1}\sigma^{-1}$ は主張の形。
:::

::: theorem 正規部分群は 3 巡回置換を含む {#grp:normal-contains-3cycle keywords="a nontrivial normal subgroup of A_n contains a 3-cycle" index="3 巡回置換を含む正規部分群|さんじゅんかいちかんをふくむせいきぶぶんぐん"}
$n\ge 5$ とし、$N\trianglelefteq A_{n}$, $N\neq\{e\}$ とする。$N$ は長さ $3$ の巡回置換を含む。
:::

::: intuition
$N$ の元 $\sigma$ に、3 巡回置換 $\rho$ との交換子 $[\rho,\sigma]$ をとると、$N$ の中で「$\sigma$ の大部分を打ち消した」元が得られる。$\rho$ をうまく選ぶと、動かす点が $3$ 個か $5$ 個しかない元にまで小さくできる。
:::

::: proof
$\sigma\in N$, $\sigma\neq e$ をとり、巡回置換分解（\ref{grp:cycle-decomposition}）で長さ $2$ 以上の巡回置換の形によって場合分けする。$\sigma$ は偶置換なので、長さ $2$ 以上の巡回置換のうち長さが偶数のものは偶数個ある（\ref{grp:alternating-basic}）。以下の計算では、\term[互いに素]{grp:cycle}な他の巡回置換は書かずに $\pi$ で表す（$\pi$ は書いた元をすべて動かさない）。

**Case 1（長さ $4$ 以上の巡回置換がある）.** $\sigma=(a_{1}\ a_{2}\ a_{3}\ a_{4}\ \cdots)\pi$ と書け、$\sigma(a_{1})=a_{2}$, $\sigma(a_{2})=a_{3}$, $\sigma(a_{3})=a_{4}$。$\rho\defeq(a_{1}\ a_{2}\ a_{3})$ とすると \ref{grp:commutator-with-3cycle} より
$$
[\rho,\sigma]=(a_{1}\ a_{2}\ a_{3})(a_{4}\ a_{3}\ a_{2})\in N.
$$
右から施すと $a_{1}\mapsto a_{1}\mapsto a_{2}$、$a_{2}\mapsto a_{4}\mapsto a_{4}$、$a_{4}\mapsto a_{3}\mapsto a_{1}$、$a_{3}\mapsto a_{2}\mapsto a_{3}$ で、他の元は動かない。よって $[\rho,\sigma]=(a_{1}\ a_{2}\ a_{4})$ は 3 巡回置換。

**Case 2（長さは $3$ 以下で、3 巡回置換が一つだけあり、他に長さ $2$ 以上のものがない）.** $\sigma$ 自身が 3 巡回置換。

**Case 3（長さは $3$ 以下で、3 巡回置換と、それとは別の長さ $2$ 以上の巡回置換がある）.** $\sigma=(a_{1}\ a_{2}\ a_{3})(a_{4}\ a_{5}\ \cdots)\pi$（二つめは長さ $2$ か $3$）と書け、$\sigma(a_{1})=a_{2}$, $\sigma(a_{2})=a_{3}$, $\sigma(a_{4})=a_{5}$。$\rho\defeq(a_{1}\ a_{2}\ a_{4})$ とすると
$$
[\rho,\sigma]=(a_{1}\ a_{2}\ a_{4})(a_{5}\ a_{3}\ a_{2})\in N.
$$
右から施すと $a_{1}\mapsto a_{2}$、$a_{2}\mapsto a_{5}\mapsto a_{5}$、$a_{5}\mapsto a_{3}\mapsto a_{3}$、$a_{3}\mapsto a_{2}\mapsto a_{4}$、$a_{4}\mapsto a_{4}\mapsto a_{1}$ で、$[\rho,\sigma]=(a_{1}\ a_{2}\ a_{5}\ a_{3}\ a_{4})$ は長さ $5$ の巡回置換。これに Case 1 を適用すると、$N$ は 3 巡回置換を含む。

**Case 4（長さ $2$ の巡回置換だけ）.** 偶置換なので互換は偶数個（$\ge 2$）で、$\sigma=(a_{1}\ a_{2})(a_{3}\ a_{4})\pi$ と書ける。$\rho\defeq(a_{1}\ a_{2}\ a_{3})$ とすると、$\sigma(a_{1})=a_{2}$, $\sigma(a_{2})=a_{1}$, $\sigma(a_{3})=a_{4}$ より
$$
\tau\defeq[\rho,\sigma]=(a_{1}\ a_{2}\ a_{3})(a_{4}\ a_{1}\ a_{2})\in N.
$$
右から施すと $a_{4}\mapsto a_{1}\mapsto a_{2}$、$a_{1}\mapsto a_{2}\mapsto a_{3}$、$a_{2}\mapsto a_{4}\mapsto a_{4}$、$a_{3}\mapsto a_{3}\mapsto a_{1}$ で、$\tau=(a_{1}\ a_{3})(a_{2}\ a_{4})$。$n\ge 5$ なので $a_{5}\notin\{a_{1},a_{2},a_{3},a_{4}\}$ がとれる。$\rho'\defeq(a_{1}\ a_{3}\ a_{5})$ とすると、$\tau(a_{1})=a_{3}$, $\tau(a_{3})=a_{1}$, $\tau(a_{5})=a_{5}$ より
$$
[\rho',\tau]=(a_{1}\ a_{3}\ a_{5})(a_{5}\ a_{1}\ a_{3})=(a_{1}\ a_{3}\ a_{5})^{2}=(a_{1}\ a_{5}\ a_{3})\in N
$$
（$(a_{5}\ a_{1}\ a_{3})=(a_{1}\ a_{3}\ a_{5})$ は同じ巡回置換の書き換え）。これは 3 巡回置換。

**Case の網羅.** 長さ $4$ 以上がなければ長さはすべて $2$ か $3$ で、3 巡回置換がちょうど一つで他がない（Case 2）、3 巡回置換があって他もある（Case 3）、3 巡回置換がない（Case 4）のどれか。$\sigma\neq e$ なので長さ $2$ 以上の巡回置換は少なくとも一つある。

::: hypcheck
- **$n\ge 5$**：Case 4 で $a_{5}$ をとるのに使った（Case 3 も $5$ 個の点を使うが、そのときは $\sigma$ がすでに $5$ 点以上を動かしている）。$n=4$ では偽：$V\trianglelefteq A_{4}$ は 3 巡回置換を含まない。Case 4 で $\tau\in V$ となり、そこで止まる。
- **$N$ の正規性**：\ref{grp:commutator-with-3cycle} で交換子が $N$ に入ることに使った（$\rho\in A_{n}$ による共役で閉じていればよい）。
:::
:::

## 交代群の単純性 {#grp:sec-si-main}

::: theorem 交代群の単純性 {#grp:an-simple keywords="A_n is simple for n >= 5, simplicity of alternating groups" index="交代群の単純性|こうたいぐんのたんじゅんせい"}
$n\ge 5$ なら $A_{n}$ は単純群である。
:::

::: proof
**Step 1.** $N\trianglelefteq A_{n}$, $N\neq\{e\}$ とする。\ref{grp:normal-contains-3cycle} より $N$ は 3 巡回置換 $\gamma$ を含む。

**Step 2.** 任意の 3 巡回置換 $\gamma'$ は $A_{n}$ の中で $\gamma$ と共役（\ref{grp:3cycles-conjugate-an}）：$\gamma'=\tau\gamma\tau^{-1}$（$\tau\in A_{n}$）。$N$ は $A_{n}$ の正規部分群なので $\gamma'\in N$。

**Step 3.** よって $N$ は 3 巡回置換をすべて含み、それらは $A_{n}$ を生成する（\ref{grp:an-generated-3cycles}）ので $N=A_{n}$。$A_{n}\neq\{e\}$（$\abs{A_{n}}=n!/2\ge 60$）なので $A_{n}$ は単純。

::: hypcheck
- **$n\ge 5$**：\ref{grp:normal-contains-3cycle} と \ref{grp:3cycles-conjugate-an} の両方で使った。$n\le 4$ では：$A_{1}=A_{2}=\{e\}$（単純群の定義から除外）、$A_{3}\cong\Z/3\Z$ は単純、$A_{4}$ は単純でない。
:::
:::

::: corollary 対称群の正規部分群 {#grp:sn-normal-subgroups keywords="normal subgroups of S_n for n >= 5" index="対称群の正規部分群|たいしょうぐんのせいきぶぶんぐん"}
$n\ge 5$ なら、$S_{n}$ の正規部分群は $\{e\}$, $A_{n}$, $S_{n}$ だけである。
:::

::: proof
**Step 1.** $N\trianglelefteq S_{n}$ とすると、$N\cap A_{n}\trianglelefteq A_{n}$（$A_{n}$ の元による共役で $N$ も $A_{n}$ も閉じる）なので、\ref{grp:an-simple} より $N\cap A_{n}=\{e\}$ か $A_{n}$。

**Step 2（$N\cap A_{n}=A_{n}$）.** $A_{n}\subseteq N\subseteq S_{n}$ で $(S_{n}:A_{n})=2$ なので、指数の積公式（\ref{grp:index-tower}）から $(S_{n}:N)\in\{1,2\}$、$N=S_{n}$ か $N=A_{n}$。

**Step 3（$N\cap A_{n}=\{e\}$）.** 自然な射影 $S_{n}\to S_{n}/A_{n}$ を $N$ に制限したものは、核が $N\cap A_{n}=\{e\}$ なので単射で、$\abs{N}\le\abs{S_{n}/A_{n}}=2$。$\abs{N}=2$ なら、位数 $2$ の正規部分群は中心に含まれる（\ref{grp:prob-normal-order-two-central}）が、$Z(S_{n})=\{e\}$（\ref{grp:prob-center-sn}）なので矛盾。よって $N=\{e\}$。
:::

::: supplement
**$A_{5}$.** $A_{5}$（位数 $60$）は非可換な単純群のうち位数が最小のものである。位数 $60$ 未満の群がどれも単純でない（素数位数を除く）ことは、シローの定理を使って示せる（\ref{grp:page-sylow-applications}）。下の問題では、$A_{5}$ の単純性を共役類の大きさだけから別証明する。

**可解でないこと.** $n\ge 5$ なら $[A_{n},A_{n}]$ は $A_{n}$ の正規部分群で、$A_{n}$ は非可換なので $\{e\}$ でなく、単純性から $[A_{n},A_{n}]=A_{n}$。よって導来列が $\{e\}$ に達せず、$S_{n}$, $A_{n}$ は可解群でない（\ref{grp:page-solvable-nilpotent}）。これは、一般の $5$ 次以上の代数方程式が冪根で解けないこと（ガロア理論）の群論的な核心である。

**高い視点.** 有限単純群は、素数位数の巡回群、$n\ge 5$ の交代群、リー型の群（有限体上の行列群から作られる）の系列と、26 個の散在群に分類されることが知られている（有限単純群の分類定理）。その証明は膨大で、ここでは扱わない。
:::

## 問題 {#grp:sec-si-problems}

::: problem {#grp:prob-a5-simple-classes}
$A_{5}$ の共役類の大きさが $1,15,20,12,12$ であることを使って、$A_{5}$ が単純であることを示せ（\ref{grp:normal-contains-3cycle} を使わない別証明）。
:::

::: solution
**Step 1（類の大きさ）.** 型 $(2,2,1)$ の $15$ 個は $A_{5}$ で一つの類：$\sigma=(1\ 2)(3\ 4)$ の $S_{5}$ での中心化群は位数 $2^{2}\cdot 2!\cdot 1=8$（\ref{grp:cycle-type-count}）で、奇置換 $(1\ 2)$ を含むので $A_{5}$ での中心化群は位数 $4$、類の大きさは $60/4=15$。同様に $(1\ 2\ 3)$ の $S_{5}$ での中心化群は位数 $3\cdot 2!=6$ で奇置換 $(4\ 5)$ を含むので、$A_{5}$ での類の大きさは $60/3=20$。5 巡回置換は $12,12$（\ref{grp:prob-a5-classes}）。

**Step 2.** $N\trianglelefteq A_{5}$ は共役類の和集合で、単位元の類（大きさ $1$）を含み、\ref{grp:lagrange} より $\abs{N}$ は $60$ の約数。$1$ に $15,20,12,12$ のいくつかを足した数で $60$ の約数になるのは、$1$（何も足さない）と $60$（全部）だけ：実際、$\{15,20,12,12\}$ の部分集合の和に $1$ を足したものは $1,13,16,21,25,28,33,36,40,45,48,60$ の $12$ 通りで、$60$ の約数 $\{1,2,3,4,5,6,10,12,15,20,30,60\}$ に入るのは $1$ と $60$。よって $N=\{e\}$ か $A_{5}$。
:::

::: problem {#grp:prob-commutator-sn}
$n\ge 2$ について $[S_{n},S_{n}]=A_{n}$ を示せ。
:::

::: solution
$S_{n}/A_{n}\cong\{\pm 1\}$ は可換なので $[S_{n},S_{n}]\subseteq A_{n}$（\ref{grp:commutator-properties}）。$n=2$ なら $A_{2}=\{e\}$ で等しい。$n\ge 3$ なら、相異なる $a,b,c$ について $(a\ b)(a\ c)=(a\ c\ b)$（\ref{grp:an-generated-3cycles} の証明）で、互換は自分自身が逆元なので
$$
[(a\ b),(a\ c)]=(a\ b)(a\ c)(a\ b)(a\ c)=(a\ c\ b)^{2}=(a\ b\ c).
$$
よってすべての 3 巡回置換が交換子で、それらは $A_{n}$ を生成する（\ref{grp:an-generated-3cycles}）ので $A_{n}\subseteq[S_{n},S_{n}]$。
:::

::: problem {#grp:prob-an-no-index-small}
$n\ge 5$ のとき、$A_{n}$ には指数 $2$ の部分群がないことを示せ。
:::

::: solution
指数 $2$ の部分群は正規（\ref{grp:prob-index-two}）で、$\{e\}$ でも $A_{n}$ でもない（$\abs{A_{n}}\ge 60>2$）ので、\ref{grp:an-simple} に反する。
:::
