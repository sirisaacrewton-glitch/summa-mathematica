# 群の拡大 {#grp:page-extensions keywords="group extension, split extension, complement, section, central extension, Schur-Zassenhaus theorem, Gaschutz averaging"}

正規部分群 $N$ と剰余群 $Q=G/N$ が与えられたとき、$G$ は「$Q$ の $N$ による**拡大**」であるという（\ref{grp:extension}）。$N$ と $Q$ だけでは $G$ は決まらない（$\Z/4\Z$ と $\Z/2\Z\times\Z/2\Z$ はどちらも $\Z/2\Z$ の $\Z/2\Z$ による拡大）。拡大が**分裂**する——$Q$ と同型な補群がある——ときは、$G$ は半直積 $N\rtimes Q$ と同型になる（\ref{grp:split-extension}）。このページでは、分裂の言い換えと分裂しない例を調べたあと、**シューア–ツァッセンハウスの定理**の可換な場合（\tref{grp:schur-zassenhaus-abelian}）、すなわち「$N$ が可換で $\abs{N}$ と $(G:N)$ が\term[互いに素]{grp:gcd}なら拡大は分裂する」を、代表系の「平均」を使うガシュッツの方法で証明する。


## 記法と定義の確認 {#grp:sec-ex-notation}

::: notation
- 正規部分群・剰余群・自然な射影は \ref{grp:normal-subgroup}, \ref{grp:quotient-group}。準同型・第一同型定理は \ref{grp:homomorphism}, \ref{grp:first-isomorphism}。剰余類は \ref{grp:coset}, \ref{grp:coset-partition}、積集合の位数は \ref{grp:product-formula}。
- 直積・内部直積・半直積・内部半直積・補群は \ref{grp:direct-product}, \ref{grp:internal-direct-product}, \ref{grp:semidirect-product}, \ref{grp:semidirect-group}, \ref{grp:internal-semidirect}。二面体群は半直積であること（\ref{grp:dihedral-semidirect}）。
- 作用・軌道と安定化群の関係は \ref{grp:group-action}, \ref{grp:orbit-stabilizer}。中心は \ref{grp:center}、四元数群は \ref{grp:quaternion-group}、交代群は \ref{grp:alternating-group}。
- 可換群 $N$ の元を積で書く。
- $\ZFC$ の中で議論する。有限群だけを扱う部分では選択公理は要らない。
:::

## 拡大と分裂 {#grp:sec-ex-split}

::: definition 拡大 {#grp:extension keywords="group extension, extension of Q by N, short exact sequence" index="拡大|かくだい, 群の拡大|ぐんのかくだい"}
群 $G$ とその正規部分群 $N$ について、$G/N\cong Q$ のとき、$G$ を **$Q$ の $N$ による拡大**という（$N$ を $Q$ で拡大した群、と呼ぶ本もある）。$N\subseteq Z(G)$ のとき**中心拡大**という。
:::

::: theorem 分裂の言い換え {#grp:split-extension keywords="split extension, complement, section homomorphism, splitting" index="分裂|ぶんれつ, 分裂する拡大|ぶんれつするかくだい, 切断|せつだん"}
$N\trianglelefteq G$、$\pi:G\to G/N$ を自然な射影とする。次は同値。
1. $N$ の補群がある：$H\le G$ で $H\cap N=\{e\}$, $NH=G$。
2. 準同型 $\sigma:G/N\to G$ で $\pi\circ\sigma=\id_{G/N}$ となるもの（**切断**）がある。

このとき拡大は**分裂する**といい、$G\cong N\rtimes_{\theta}H$（$\theta_{h}(n)=hnh^{-1}$）、$H\cong G/N$。
:::

::: proof
**Step 1（1⇒2）.** $\pi|_{H}:H\to G/N$ の核は $H\cap N=\{e\}$ で単射。全射：$G/N$ の元 $gN$ について $g=nh$（$n\in N$, $h\in H$）と書けるので $gN=hN=\pi(h)$（$N$ の正規性から $nhN=hN$）。よって $\pi|_{H}$ は同型で、$\sigma\defeq(\pi|_{H})^{-1}$ は準同型で $\pi\sigma=\id$。

**Step 2（2⇒1）.** $H\defeq\sigma(G/N)$ とおく。$x\in H\cap N$ なら $x=\sigma(q)$ で $q=\pi\sigma(q)=\pi(x)=N$（単位元）なので $x=\sigma(N)=e$。$g\in G$ について $h\defeq\sigma(\pi(g))\in H$ とすると $\pi(h)=\pi(g)$ なので $gh^{-1}\in N$、$g=(gh^{-1})h\in NH$。

**Step 3.** 1 が成り立てば \ref{grp:internal-semidirect} より $G\cong N\rtimes_{\theta}H$、Step 1 より $H\cong G/N$。
:::

::: example 分裂する拡大と分裂しない拡大 {#grp:split-nonsplit-examples}
1. $D_{n}$ は $\Z/2\Z$ の $\Z/n\Z$ による分裂拡大（$\ang{r}$ の補群 $\{e,s\}$、\ref{grp:dihedral-semidirect}）。
2. $S_{n}$（$n\ge 2$）は $\{\pm 1\}$ の $A_{n}$ による分裂拡大：$\{e,(1\ 2)\}$ が補群なので $S_{n}\cong A_{n}\rtimes\Z/2\Z$。
3. $\Z/4\Z$ は $\Z/2\Z$ の $2\Z/4\Z$ による分裂しない拡大：位数 $2$ の部分群は $2\Z/4\Z$ だけ（\ref{grp:subgroups-cyclic}）なので補群がない。
4. $Q_{8}$ は $\Z/2\Z$ の $\ang{\mathbf{i}}$ による分裂しない拡大：補群は位数 $2$ の部分群だが、$Q_{8}$ の位数 $2$ の元は $-1\in\ang{\mathbf{i}}$ だけ。また $Q_{8}$ は $V$ の $\{\pm 1\}$ による中心拡大でもあり（\ref{grp:prob-q8-mod-center}）、これも分裂しない（補群は位数 $4$ で $-1$ を含まない部分群だが、位数 $4$ の部分群 $\ang{\pm\mathbf{i}}$ などはどれも $-1$ を含む）。
5. $D_{4}$ も $V$ の $Z(D_{4})=\{e,r^{2}\}$ による中心拡大で、こちらも分裂しない（分裂すれば $D_{4}\cong\Z/2\Z\times V$（中心拡大の半直積は直積）で可換になってしまう）。$Q_{8}$ と $D_{4}$ は「同じ $N$ と $Q$ の、同型でない拡大」の例である。
:::

## シューア–ツァッセンハウスの定理（可換な場合） {#grp:sec-ex-sz}

::: theorem シューア–ツァッセンハウスの定理（可換な場合） {#grp:schur-zassenhaus-abelian keywords="Schur-Zassenhaus theorem for abelian normal subgroups, coprime extensions split" index="シューア–ツァッセンハウスの定理|しゅーあつぁっせんはうすのていり" refname="シューア–ツァッセンハウスの定理"}
$G$ を有限群、$N\trianglelefteq G$ を可換な正規部分群とし、$\gcd(\abs{N},(G:N))=1$ とする。$N$ には補群があり、$G\cong N\rtimes(G/N)$。
:::

::: intuition
補群を作るには、各剰余類から代表元を「整合的に」選びたい。代表系の選び方の違いは $N$ の元で測れ、$N$ が可換で $(G:N)$ 乗が $N$ 上で全単射（位数が\term[互いに素]{grp:gcd}だから）なら、その違いを「$m$ 乗根をとって平均する」ことで打ち消せる。
:::

::: proof
$m\defeq(G:N)$, $n\defeq\abs{N}$ とする。

**Step 1（代表系と差）.** 右剰余類 $Nx$ の集合を $\Omega_{0}$ とする（$\abs{\Omega_{0}}=m$）。各右剰余類から元を一つずつ選んだ集合 $T$ を**右代表系**といい、$c\in\Omega_{0}$ に対し $T\cap c=\{t_{c}\}$ と書く。右代表系全体を $\mathcal{T}$ とする（有限集合）。$S,T\in\mathcal{T}$ について、$s_{c},t_{c}$ は同じ右剰余類にあるので $s_{c}t_{c}^{-1}\in N$。$N$ は可換なので、積の順序によらず
$$
d(S,T)\defeq\prod_{c\in\Omega_{0}}s_{c}t_{c}^{-1}\in N
$$
が定まる。直ちに $d(T,T)=e$、$d(S,T)d(T,U)=d(S,U)$（各 $c$ で $s_{c}t_{c}^{-1}t_{c}u_{c}^{-1}=s_{c}u_{c}^{-1}$）、$d(T,S)=d(S,T)^{-1}$。

**Step 2（$G$ の作用）.** $g\in G$, $T\in\mathcal{T}$ について $gT\defeq\{gt : t\in T\}$ も右代表系：$N$ の正規性から $g(Nx)=N(gx)$ なので、$g$ の左からの積は右剰余類を右剰余類に一対一に写す。これは $G$ の $\mathcal{T}$ への作用で、
$$
d(gS,gT)=\prod_{c}(gs_{c})(gt_{c})^{-1}=\prod_{c}g\,s_{c}t_{c}^{-1}g^{-1}=g\,d(S,T)\,g^{-1}
$$
（$gs_{c}$ と $gt_{c}$ は同じ右剰余類 $gc$ の代表で、$c\mapsto gc$ は $\Omega_{0}$ の全単射。共役は $N$ の自己同型なので積と交換する）。

**Step 3（同値関係と $G$ の作用）.** $S\sim T\iff d(S,T)=e$ は Step 1 より同値関係。Step 2 より $S\sim T\Rightarrow gS\sim gT$ なので、$G$ は同値類の集合 $\Omega\defeq\mathcal{T}/{\sim}$ に $g\cdot[T]\defeq[gT]$ で作用する。

**Step 4（$N$ の作用は正則）.** $a\in N$ について $at_{c}\in Nt_{c}=c$ なので $(at_{c})t_{c}^{-1}=a$、よって $d(aT,T)=a^{m}$（$N$ は可換）。$\gcd(m,n)=1$ なので $mu+nv=1$ となる整数 $u,v$ があり、$N$ の元 $b$ について $(b^{u})^{m}=b^{1-nv}=b$（$b^{n}=e$、\ref{grp:lagrange-corollaries}）、かつ $a^{m}=e\Rightarrow a=a^{mu+nv}=e$。よって $a\mapsto a^{m}$ は $N$ の全単射。
- 推移的：$S,T\in\mathcal{T}$ について、$a^{m}=d(S,T)^{-1}$ となる $a\in N$ をとる。Step 1 の関係式から $d(aS,T)=d(aS,S)\,d(S,T)=a^{m}d(S,T)=e$、すなわち $a\cdot[S]=[T]$。
- 固定するのは単位元だけ：$a\cdot[S]=[S]\iff d(aS,S)=a^{m}=e\iff a=e$。

**Step 5（補群）.** $[S]\in\Omega$ を一つとり、$H\defeq\{g\in G : g\cdot[S]=[S]\}$（安定化群）とする。Step 4 より $N$ だけですでに $\Omega$ 上推移的なので $G$ も推移的で、$\abs{\Omega}=\abs{N}=n$（$N$ の作用は推移的で固定部分群が自明、\ref{grp:orbit-stabilizer}）。\ref{grp:orbit-stabilizer} を $G$ に使うと $(G:H)=n$、$\abs{H}=\abs{G}/n=m$。$H\cap N$ は $N$ の作用での $[S]$ の安定化群なので $\{e\}$。$\abs{NH}=\abs{N}\abs{H}/\abs{N\cap H}=nm=\abs{G}$（\ref{grp:product-formula}）で $NH=G$。\ref{grp:split-extension} より $G\cong N\rtimes(G/N)$。

::: hypcheck
- **$N$ が可換**：Step 1 で $d(S,T)$ が積の順序によらないこと、Step 4 で $d(aT,T)=a^{m}$ に使った。
- **$\gcd(\abs{N},(G:N))=1$**：Step 4 で $a\mapsto a^{m}$ が全単射であることに使った。外すと偽：$\Z/4\Z$ と $N=2\Z/4\Z$（$\abs{N}=2=(G:N)$）では補群がない（上の例 3）。
- **有限**：Step 1 の積、Step 5 の位数の計算に使った。選択公理は不要（有限集合 $\mathcal{T}$ を扱うだけ）。
:::
:::

::: fact シューア–ツァッセンハウスの定理（一般の場合） {#grp:schur-zassenhaus-general keywords="Schur-Zassenhaus theorem, conjugacy of complements" index="シューア–ツァッセンハウスの定理（一般）|しゅーあつぁっせんはうすのていりいっぱん"}
有限群 $G$ の正規部分群 $N$ が $\gcd(\abs{N},(G:N))=1$ をみたせば、$N$ が可換でなくても補群が存在し、さらに $N$ または $G/N$ の一方が可解なら、補群はすべて互いに共役である。存在は $\abs{G}$ についての帰納法でシローの定理と可換な場合（\ref{grp:schur-zassenhaus-abelian}）に帰着でき、共役の主張の一般の場合はファイト–トンプソンの定理（\ref{grp:solvable-deep-facts}）を使う。本サイトでは証明しない（出典：Robinson『A Course in the Theory of Groups』）。
:::

::: supplement
**コホモロジーとの関係.** $N$ が可換なとき、$G/N$ の $N$ による拡大（$G/N$ の $N$ への作用を固定したもの）の同値類は、群のコホモロジー $H^{2}(G/N,N)$ と一対一に対応し、分裂する拡大は $0$ にあたる。上の証明の「$m$ 乗根をとって平均する」操作は、$\abs{G/N}$ が $\abs{N}$ と\term[互いに素]{grp:gcd}なら $H^{2}(G/N,N)=0$ となることの、具体的な形である。群のコホモロジーはホモロジー代数の系列で扱う予定。

**応用.** シロー $p$ 部分群 $P$ が可換で正規なら、$G\cong P\rtimes(G/P)$。例えば位数 $pq$ の群（\ref{grp:order-pq}）が半直積になることは、この定理からもわかる。
:::

## 問題 {#grp:sec-ex-problems}

::: problem {#grp:prob-central-split-direct}
中心拡大 $N\subseteq Z(G)$ が分裂するなら、$G\cong N\times G/N$ であることを示せ。
:::

::: solution
補群 $H$ について $\theta_{h}(n)=hnh^{-1}=n$（$n$ は中心の元）なので $\theta$ は自明で、半直積の演算 $(n,h)(n',h')=(nn',hh')$ は直積の演算そのもの。よって $G\cong N\times H\cong N\times G/N$（\ref{grp:split-extension}）。
:::

::: problem {#grp:prob-order-12-sylow3}
位数 $12$ の群 $G$ のシロー $3$ 部分群 $P$ が正規なら、$G\cong P\rtimes K$（$K$ は位数 $4$ の部分群）であることを示せ。
:::

::: solution
$P$ は位数 $3$ なので可換で、$\gcd(3,4)=1$。\ref{grp:schur-zassenhaus-abelian} より補群 $K$（位数 $4$）があり、$G\cong P\rtimes K$。（シローの定理からも、位数 $4$ のシロー $2$ 部分群が補群になることが直接わかる：$P\cap K=\{e\}$, $\abs{PK}=12$。）
:::
