# 有限群の表現（Representations of Finite Groups）

表現と群環加群、指標と直交関係、指標表の計算、誘導表現とフロベニウスの相互律、次元の整除性とバーンサイドの定理（雪江『代数学 3』第 5 章を参考）。群環の環論的な部分（マシュケの定理・ウェダーバーン＝アルティン）は非可換環論の系列にある。

<p class="mn-msc">MSC2020: 20C15</p>
