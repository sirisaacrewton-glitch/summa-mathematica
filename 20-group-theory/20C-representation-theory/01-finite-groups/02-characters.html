# 指標と直交関係 {#rep:page-characters keywords="character of a representation, class function, orthogonality relations, Schur orthogonality, irreducible characters form an orthonormal basis, multiplicity, regular character, column orthogonality"}

表現 $\rho$ の**指標**とは、各 $g$ に行列 $\rho(g)$ のトレースを対応させる関数 $\chi(g)=\operatorname{tr}\rho(g)$ である。指標は数を並べただけのものだが、複素数体上では表現を同型を除いて完全に決め、既約表現の指標は類関数の空間の正規直交基底をなす（**直交関係**）。これにより、表現の既約分解の重複度は指標の内積で計算できる。前のページ（\ref{rep:page-representations}）の構成と、複素群環の構造（\ref{mod:group-algebra-structure}）を使う。

> 雪江『代数学 3』第 5 章 §5.1 の後半を参考にした。直交関係は不変部分の次元の公式から導き、既約指標が基底であることは群環の構造定理から既約表現の個数を数えて示す。

## 記法と定義の確認 {#rep:sec-ch-notation}

::: notation
- $G$ は有限群、表現は $\mathbb{C}$ 上の有限次元表現。$\Hom_{G}$, $V^{G}$, $V\otimes W$, $V^{*}$, $\Hom_{\mathbb{C}}(V,W)$ の表現の構造と $\Hom_{\mathbb{C}}(V,W)^{G}=\Hom_{G}(V,W)$ は \ref{rep:constructions}, \ref{rep:constructions-basic}。
- 既約表現の同型類の代表を $V_{1},\dots,V_{r}$（$V_{1}$ は自明な表現）、$n_{i}=\dim V_{i}$ とする。$r$ は共役類の個数で $\lvert G\rvert=\sum n_{i}^{2}$（\ref{mod:group-algebra-structure}）。シューアの補題と完全可約性は \ref{rep:schur-and-decomposition}。
- $g$ の共役類を $C(g)$、中心化群を $C_{G}(g)$ と書く。$\lvert C(g)\rvert=\lvert G\rvert/\lvert C_{G}(g)\rvert$（\ref{grp:orbit-stabilizer}）。
- $\bar z$ は複素共役。
- **選択公理**：使わない。
:::

## 指標 {#rep:sec-ch-characters}

::: definition 指標・類関数 {#rep:character keywords="character of a representation, irreducible character, class function, degree" index="指標|しひょう, 既約指標|きやくしひょう, 類関数|るいかんすう"}
表現 $\rho:G\to\GL(V)$ について、$\chi_{V}(g)\defeq\operatorname{tr}\rho(g)$ で定まる関数 $\chi_{V}:G\to\mathbb{C}$ を $V$ の**指標**という。既約表現の指標を**既約指標**といい、$\chi_{i}\defeq\chi_{V_{i}}$ と書く。共役で値の変わらない関数 $G\to\mathbb{C}$ を**類関数**といい、その全体を $\operatorname{Cl}(G)$ と書く。$\operatorname{Cl}(G)$ 上の内積を
$$
\langle\varphi,\psi\rangle\defeq\frac{1}{\lvert G\rvert}\sum_{g\in G}\varphi(g)\overline{\psi(g)}
$$
で定める。
:::

::: proposition 指標の基本性質 {#rep:character-basic keywords="properties of characters: chi(1) = dim, class function, chi(g^-1) = conj chi(g), sums and products" index="指標の性質|しひょうのせいしつ"}
表現 $V,W$ と $g\in G$ について、
1. $\chi_{V}(1)=\dim V$。$\chi_{V}$ は類関数で、同値な表現の指標は等しい。
2. $\rho(g)$ の固有値は（重複度を込めて）$\dim V$ 個の 1 の冪根で、$\chi_{V}(g)$ はその和。特に $\lvert\chi_{V}(g)\rvert\le\dim V$。
3. $\chi_{V}(g^{-1})=\overline{\chi_{V}(g)}$。
4. $\chi_{V\oplus W}=\chi_{V}+\chi_{W}$、$\chi_{V\otimes W}=\chi_{V}\chi_{W}$、$\chi_{V^{*}}=\overline{\chi_{V}}$、$\chi_{\Hom(V,W)}=\overline{\chi_{V}}\chi_{W}$。
:::

::: proof
**Step 1（1）.** $\operatorname{tr}(\mathrm{id}_{V})=\dim V$。$\operatorname{tr}(ABA^{-1})=\operatorname{tr}(B)$ から、$\chi(hgh^{-1})=\operatorname{tr}(\rho(h)\rho(g)\rho(h)^{-1})=\chi(g)$。同値 $f:V\to W$ について $\rho_{W}(g)=f\rho_{V}(g)f^{-1}$ なので同じ。

**Step 2（2）.** $\mathbb{C}$ は代数閉体なので $\rho(g)$ は上三角化でき、対角成分 $\lambda_{1},\dots,\lambda_{n}$（$n=\dim V$）が固有多項式の根（重複度込み）で、$\chi(g)=\sum\lambda_{j}$。$g^{m}=1$（$m$ は $g$ の位数）なので $\rho(g)^{m}$ は単位行列で、上三角行列の冪の対角成分 $\lambda_{j}^{m}$ は $1$。よって $\lvert\lambda_{j}\rvert=1$ で、三角不等式から $\lvert\chi(g)\rvert\le n$。

**Step 3（3）.** $\rho(g)^{-1}$ を同じ基底で表すと上三角で対角成分は $\lambda_{j}^{-1}=\overline{\lambda_{j}}$（$\lvert\lambda_{j}\rvert=1$）。

**Step 4（4）.** 直和は区分対角行列。テンソル積：$V,W$ の基底を $\rho(g),\sigma(g)$ が上三角になるようにとり、$v_{i}\otimes w_{j}$ を辞書式に並べると $\rho(g)\otimes\sigma(g)$ は上三角で対角成分 $\lambda_{i}\mu_{j}$、トレースは $\sum_{i}\lambda_{i}\sum_{j}\mu_{j}$。双対：$V^{*}$ での $g$ の作用は $\rho(g^{-1})$ の転置なので、トレースは $\chi_{V}(g^{-1})=\overline{\chi_{V}(g)}$。$\Hom(V,W)\cong V^{*}\otimes W$（\ref{rep:constructions-basic.3}）。
:::

## 直交関係 {#rep:sec-ch-orthogonality}

::: lemma 不変部分の次元 {#rep:invariants-dimension keywords="dimension of the invariants equals the average of the character" index="不変部分の次元|ふへんぶぶんのじげん"}
表現 $V$ について $e\defeq\frac{1}{\lvert G\rvert}\sum_{g\in G}\rho(g)$ は $V$ から $V^{G}$ への射影（$e^{2}=e$、像は $V^{G}$）で、
$$
\dim V^{G}=\frac{1}{\lvert G\rvert}\sum_{g\in G}\chi_{V}(g).
$$
:::

::: proof
**Step 1.** $h\in G$ について $\rho(h)e=\frac{1}{\lvert G\rvert}\sum_{g}\rho(hg)=e$（$g\mapsto hg$ は全単射）。よって $eV\subset V^{G}$。$v\in V^{G}$ なら $ev=\frac{1}{\lvert G\rvert}\sum_{g}v=v$。したがって像は $V^{G}$ で、$e^{2}v=e(ev)=ev$。

**Step 2.** 射影 $e$ は $V=\Ker e\oplus\operatorname{Im}e$（$v=(v-ev)+ev$）で、この分解に合わせた基底では対角成分が $0$ と $1$ の対角行列。よって $\operatorname{tr}e=\dim\operatorname{Im}e=\dim V^{G}$。一方 $\operatorname{tr}e=\frac{1}{\lvert G\rvert}\sum_{g}\chi_{V}(g)$。
:::

::: theorem 指標の直交関係 {#rep:orthogonality keywords="Schur orthogonality relations for characters, <chi_V, chi_W> = dim Hom_G(W,V)" index="直交関係|ちょっこうかんけい, シューアの直交関係|しゅーあのちょっこうかんけい"}
表現 $V,W$ について $\langle\chi_{V},\chi_{W}\rangle=\dim\Hom_{G}(W,V)$。特に既約指標について $\langle\chi_{i},\chi_{j}\rangle=\delta_{ij}$。
:::

::: proof
\ref{rep:invariants-dimension} を表現 $\Hom_{\mathbb{C}}(W,V)$ に使うと、\ref{rep:constructions-basic.2} と \ref{rep:character-basic.4} から
$$
\dim\Hom_{G}(W,V)=\frac{1}{\lvert G\rvert}\sum_{g}\overline{\chi_{W}(g)}\chi_{V}(g)=\langle\chi_{V},\chi_{W}\rangle.
$$
既約の場合はシューアの補題（\ref{rep:schur-and-decomposition.2}）から $\delta_{ij}$。
:::

::: corollary 指標による判定 {#rep:character-determines keywords="multiplicities are inner products, characters determine representations, irreducibility criterion <chi,chi> = 1" index="既約性の判定|きやくせいのはんてい"}
表現 $V\cong\bigoplus_{i}V_{i}^{m_{i}}$ について、
1. $m_{i}=\langle\chi_{V},\chi_{i}\rangle$。したがって $V$ は指標 $\chi_{V}$ で同型を除いて決まる。
2. $\langle\chi_{V},\chi_{V}\rangle=\sum_{i}m_{i}^{2}$。特に $V$ が既約 $\iff\langle\chi_{V},\chi_{V}\rangle=1$。
:::

::: proof
$\chi_{V}=\sum_{i}m_{i}\chi_{i}$（\ref{rep:character-basic.4}）と \ref{rep:orthogonality} の正規直交性から 1 の式。重複度がすべて決まるので $V$ も決まる（\ref{rep:schur-and-decomposition.1}）。2 も正規直交性から。$\sum m_{i}^{2}=1$ となるのは、ちょうど一つの $m_{i}$ が $1$ で他が $0$ のとき。
:::

::: theorem 既約指標は類関数の正規直交基底 {#rep:characters-basis keywords="irreducible characters form an orthonormal basis of the space of class functions; column orthogonality" index="指標の正規直交基底|しひょうのせいきちょっこうきてい, 第二直交関係|だいにちょっこうかんけい"}
1. $\chi_{1},\dots,\chi_{r}$ は $\operatorname{Cl}(G)$ の正規直交基底である。
2. （第二直交関係）$g,h\in G$ について
$$
\sum_{i=1}^{r}\chi_{i}(g)\overline{\chi_{i}(h)}=\begin{cases}\lvert C_{G}(g)\rvert & (h\in C(g)),\\ 0 & (h\notin C(g)).\end{cases}
$$
:::

::: proof
**Step 1（1）.** 類関数は共役類ごとの値で決まるので、$\dim\operatorname{Cl}(G)$ は共役類の個数で、それは既約表現の個数 $r$ に等しい（\ref{mod:group-algebra-structure.3}）。$\chi_{i}$ は類関数で（\ref{rep:character-basic.1}）、\ref{rep:orthogonality} から正規直交、したがって一次独立。$r$ 個の一次独立な元は $r$ 次元空間の基底。

**Step 2（2：ユニタリ行列）.** 共役類を $C_{1},\dots,C_{r}$ とし、代表 $g_{k}\in C_{k}$ をとる。$r\times r$ 行列 $U$ を $U_{ik}\defeq\sqrt{\lvert C_{k}\rvert/\lvert G\rvert}\,\chi_{i}(g_{k})$ で定めると、直交関係は
$$
\sum_{k}U_{ik}\overline{U_{jk}}=\frac{1}{\lvert G\rvert}\sum_{k}\lvert C_{k}\rvert\chi_{i}(g_{k})\overline{\chi_{j}(g_{k})}=\langle\chi_{i},\chi_{j}\rangle=\delta_{ij},
$$
すなわち $U\bar U^{\mathsf{T}}=E$。正方行列なので $\bar U^{\mathsf{T}}U=E$ も成り立ち、成分で書くと $\sum_{i}\overline{U_{ik}}U_{il}=\delta_{kl}$。$\lvert G\rvert/\lvert C_{k}\rvert=\lvert C_{G}(g_{k})\rvert$ を掛けて整理すると主張になる。
:::

::: example 正則表現の指標
正則表現 $\mathbb{C}[G]$ では $g\neq1$ の作用は基底 $G$ を固定点なしに並べ替えるので、行列の対角成分は $0$。よって $\chi_{\mathrm{reg}}(1)=\lvert G\rvert$、$g\neq1$ で $\chi_{\mathrm{reg}}(g)=0$。$\langle\chi_{\mathrm{reg}},\chi_{i}\rangle=\frac{1}{\lvert G\rvert}\lvert G\rvert\overline{\chi_{i}(1)}=n_{i}$ なので、正則表現での $V_{i}$ の重複度は $n_{i}$ で、$\lvert G\rvert=\chi_{\mathrm{reg}}(1)=\sum n_{i}^{2}$。これは第二直交関係で $g=h=1$ とした式でもある。
:::

::: example $S_{3}$ の指標表
$S_{3}$ の共役類 $\{1\}$, $\{$互換$\}$（3 個）、$\{$3 巡回置換$\}$（2 個）での値は次のとおり（標準表現は置換加群の指標 $(3,1,0)$ から自明な指標を引いたもの。\ref{rep:permutation-module-decomposition}）。

| | $1$ | $(1\,2)$ | $(1\,2\,3)$ |
|---|---|---|---|
| 自明 | $1$ | $1$ | $1$ |
| 符号 | $1$ | $-1$ | $1$ |
| 標準 | $2$ | $0$ | $-1$ |

例えば $\langle\chi_{\text{標準}},\chi_{\text{標準}}\rangle=\frac{1}{6}(4+3\cdot0+2\cdot1)=1$ で、標準表現は既約（\ref{rep:character-determines.2}）。標準表現どうしのテンソル積 $V_{0}\otimes V_{0}$ の指標は $(4,0,1)$ で、$\langle(4,0,1),\chi\rangle$ を計算すると自明・符号・標準がそれぞれ $1$ 回ずつ現れる。
:::

::: supplement
**一般の体では.** 代数閉体で標数が $\lvert G\rvert$ を割り切らなければ、直交関係（共役の代わりに $\chi(g^{-1})$ を使う）と既約指標の一次独立性が成り立つ。標数 $0$ なら指標は表現を決めるが、正標数では $\chi_{V}=\chi_{W}$ でも $V\not\cong W$ となりうる（$p$ 個の直和は指標 $0$）。

**フーリエ解析としての解釈.** $G$ が可換なら既約指標は 1 次元の表現、すなわち指標群 $\hat G$ の元（\ref{grp:dual-group}）で、直交関係は「$\hat G$ を基底とする $G$ 上の関数のフーリエ展開」である。非可換群では、類関数については指標で展開でき、一般の関数については行列成分 $\rho_{i}(g)_{ab}$ で展開できる（ピーター＝ワイルの定理の有限群版）。

**高い視点.** 直交関係は、表現の圏の Hom の次元を指標という「数」で計算する公式で、指標は表現の圏のグロタンディーク群（表現環）から類関数環への環準同型 $[V]\mapsto\chi_{V}$ を与える（積はテンソル積）。定理 1 は、これが $\mathbb{C}$ を係数にすると同型であることを述べている。
:::

## 問題 {#rep:sec-ch-problems}

::: problem {#rep:prob-ch-d4-two-dim}
二面体群 $D_{4}$（位数 8）の回転・折り返しによる 2 次元表現（\ref{rep:representation-examples.5}）の指標を計算し、既約であることを確かめよ。
:::

::: solution
$r$ は角 $\pi/2$ の回転で $\operatorname{tr}=2\cos(\pi/2)=0$、$r^{2}$ は $-E$ で $-2$、$r^{3}$ は $0$。折り返し $r^{k}s$ はどれも固有値 $\pm1$ でトレース $0$。恒等元で $2$。よって $\lVert\chi\rVert^{2}=\frac{1}{8}(4+4+0)=1$ で既約。
:::

::: problem {#rep:prob-ch-perm-orbits}
$G$ が有限集合 $X$ に作用するときの線形化 $\mathbb{C}[X]$ の指標 $\pi$ は $\pi(g)=\lvert X^{g}\rvert$（固定点の個数）で、$\langle\pi,\chi_{1}\rangle$ は軌道の個数であることを示せ。
:::

::: solution
$g$ の行列は置換行列で、対角成分 $1$ はちょうど $gx=x$ となる $x$ に対応するので $\pi(g)=\lvert X^{g}\rvert$。$\chi_{1}=1$ なので $\langle\pi,\chi_{1}\rangle=\frac{1}{\lvert G\rvert}\sum_{g}\lvert X^{g}\rvert$ で、\ref{grp:burnside-lemma}から軌道の個数。表現論の言葉では、$\mathbb{C}[X]^{G}$ の基底は各軌道の元の和で、その次元が軌道の個数（\ref{rep:invariants-dimension}）。
:::
