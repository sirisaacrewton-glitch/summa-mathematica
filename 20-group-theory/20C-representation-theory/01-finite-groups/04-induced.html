# 誘導表現 {#rep:page-induced keywords="induced representation, restriction, Frobenius reciprocity, character of an induced representation, Mackey irreducibility criterion for normal subgroups"}

部分群 $H\subset G$ の表現 $W$ から $G$ の表現を作る標準的な方法が**誘導表現** $\operatorname{Ind}_{H}^{G}W=\mathbb{C}[G]\otimes_{\mathbb{C}[H]}W$ である。逆向きの**制限** $\operatorname{Res}_{H}^{G}$ とは随伴の関係にあり（**フロベニウスの相互律**）、指標の内積で $\langle\operatorname{Ind}\psi,\chi\rangle_{G}=\langle\psi,\operatorname{Res}\chi\rangle_{H}$ と書ける。小さい部分群の表現を誘導することで、大きい群の既約表現を作ることができる。正規部分群からの誘導が既約になる条件（マッキーの判定法）も示す。

> 雪江『代数学 3』第 5 章 §5.4 を参考にした。

## 記法と定義の確認 {#rep:sec-in-notation}

::: notation
- 表現は $\mathbb{C}$ 上の有限次元表現、$H\subset G$ は部分群、$t=[G:H]$、$g_{1},\dots,g_{t}$ は左剰余類 $G/H$ の代表。
- 群環と表現の対応は \ref{mod:group-ring-modules}、指標と内積・直交関係は \ref{rep:character}, \ref{rep:orthogonality}, \ref{rep:character-determines}。
- 非可換環上のテンソル積 $M\otimes_{R}N$（$M$ は右 $R$ 加群、$N$ は左 $R$ 加群）とその普遍性は \ref{mod:page-tensor-products} の一般論による。$\mathbb{C}[G]$ は左から $\mathbb{C}[G]$、右から $\mathbb{C}[H]$ が作用する両側加群。
- **選択公理**：使わない。
:::

## 誘導表現と指標 {#rep:sec-in-definition}

::: definition 誘導表現・制限 {#rep:induced-def keywords="induced representation Ind, restriction Res" index="誘導表現|ゆうどうひょうげん, 制限（表現）|せいげんひょうげん"}
$H$ の表現 $W$ に対し、$G$ の表現 $\operatorname{Ind}_{H}^{G}W\defeq\mathbb{C}[G]\otimes_{\mathbb{C}[H]}W$（$g(x\otimes w)\defeq gx\otimes w$）を**誘導表現**という。$G$ の表現 $V$ を $H$ の表現とみたものを**制限** $\operatorname{Res}_{H}^{G}V$ と書く。指標についても $\operatorname{Ind}\psi$, $\operatorname{Res}\chi$ と書く。
:::

::: proposition 誘導表現の形 {#rep:induced-structure keywords="Ind W is the direct sum of g_i tensor W over coset representatives; dimension [G:H] dim W" index="誘導表現の次元|ゆうどうひょうげんのじげん"}
$\operatorname{Ind}_{H}^{G}W=\bigoplus_{i=1}^{t}g_{i}\otimes W$（各 $g_{i}\otimes W\defeq\{g_{i}\otimes w\}$ は $W$ と同型な部分空間）で、$\dim\operatorname{Ind}_{H}^{G}W=t\dim W$。$g\in G$ は、$gg_{i}=g_{j}h$（$h\in H$）のとき $g_{i}\otimes w\mapsto g_{j}\otimes hw$ と作用する。
:::

::: proof
**Step 1.** $G$ は左剰余類の非交和 $\bigsqcup_{i}g_{i}H$ なので、右 $\mathbb{C}[H]$ 加群として $\mathbb{C}[G]=\bigoplus_{i}g_{i}\mathbb{C}[H]$ で、各 $g_{i}\mathbb{C}[H]$ は $\mathbb{C}[H]$ と同型（$x\mapsto g_{i}x$）。

**Step 2.** テンソル積は直和と交換するので（\ref{mod:tensor-isomorphisms} と同じ証明が非可換環上でも通る）$\mathbb{C}[G]\otimes_{\mathbb{C}[H]}W\cong\bigoplus_{i}g_{i}\mathbb{C}[H]\otimes_{\mathbb{C}[H]}W$、各項は $\mathbb{C}[H]\otimes_{\mathbb{C}[H]}W\cong W$ により $g_{i}\otimes W$ と同一視される。

**Step 3.** $g(g_{i}\otimes w)=gg_{i}\otimes w=g_{j}h\otimes w=g_{j}\otimes hw$（$h$ を右から $W$ に移した）。
:::

::: theorem 誘導指標の公式 {#rep:induced-character keywords="formula for the induced character" index="誘導指標|ゆうどうしひょう"}
$H$ の表現の指標 $\psi$ について、$\dot\psi(x)\defeq\psi(x)$（$x\in H$）、$0$（$x\notin H$）とおくと
$$
\operatorname{Ind}_{H}^{G}\psi(g)=\sum_{i=1}^{t}\dot\psi(g_{i}^{-1}gg_{i})=\frac{1}{\lvert H\rvert}\sum_{x\in G}\dot\psi(x^{-1}gx).
$$
特に $\operatorname{Ind}\psi$ は $H$ の元と共役でない $g$ で $0$。
:::

::: proof
**Step 1.** \ref{rep:induced-structure} の分解に合わせた基底では、$g$ の行列は $t\times t$ のブロック行列で、$(j,i)$ ブロックが $0$ でないのは $gg_{i}\in g_{j}H$ のとき。トレースには対角ブロック（$j=i$、すなわち $g_{i}^{-1}gg_{i}\in H$）だけが寄与し、そのブロックは $h=g_{i}^{-1}gg_{i}$ の $W$ への作用なのでトレースは $\psi(g_{i}^{-1}gg_{i})$。

**Step 2.** $x=g_{i}h$（$h\in H$）と書くと $x^{-1}gx=h^{-1}(g_{i}^{-1}gg_{i})h$ で、$\dot\psi$ は $H$ の共役で不変（$H$ の外は $H$ の共役で外のまま）なので $\dot\psi(x^{-1}gx)=\dot\psi(g_{i}^{-1}gg_{i})$。各 $i$ について $h$ は $\lvert H\rvert$ 個。
:::

::: theorem フロベニウスの相互律 {#rep:frobenius-reciprocity keywords="Frobenius reciprocity: Hom_G(Ind W, V) = Hom_H(W, Res V), <Ind psi, chi> = <psi, Res chi>" index="フロベニウスの相互律|ふろべにうすのそうごりつ"}
$H$ の表現 $W$ と $G$ の表現 $V$ について、
1. $\Phi:\Hom_{G}(\operatorname{Ind}_{H}^{G}W,V)\to\Hom_{H}(W,\operatorname{Res}_{H}^{G}V)$, $f\mapsto(w\mapsto f(1\otimes w))$ は線形同型である。
2. 指標について $\langle\operatorname{Ind}\psi,\chi\rangle_{G}=\langle\psi,\operatorname{Res}\chi\rangle_{H}$。
:::

::: proof
**Step 1（1：well-defined）.** $f$ が $G$ 準同型なら、$h\in H$ について $f(1\otimes hw)=f(h\otimes w)=hf(1\otimes w)$ なので $\Phi(f)$ は $H$ 準同型。

**Step 2（1：逆写像）.** $\varphi\in\Hom_{H}(W,V)$ について、$(x,w)\mapsto x\varphi(w)$（$x\in\mathbb{C}[G]$）は双線形で、$xh\varphi(w)=x\varphi(hw)$ なので $\mathbb{C}[H]$ 平衡。テンソル積の普遍性から線形写像 $\Psi(\varphi):x\otimes w\mapsto x\varphi(w)$ が得られ、$G$ 準同型。$\Phi\Psi(\varphi)=\varphi$ は定義から、$\Psi\Phi(f)(x\otimes w)=xf(1\otimes w)=f(x\otimes w)$。

**Step 3（2）.** \ref{rep:orthogonality} から $\langle\operatorname{Ind}\psi,\chi\rangle_{G}=\dim\Hom_{G}(V,\operatorname{Ind}W)$ だが、内積は $\mathbb{R}$ 値（次元）なので共役をとって $=\dim\Hom_{G}(\operatorname{Ind}W,V)$（$\langle\varphi,\psi\rangle=\overline{\langle\psi,\varphi\rangle}$）。1 からこれは $\dim\Hom_{H}(W,\operatorname{Res}V)=\langle\operatorname{Res}\chi,\psi\rangle_{H}=\langle\psi,\operatorname{Res}\chi\rangle_{H}$（実数なので）。
:::

::: example 誘導表現の例
1. $W$ を $H$ の自明な表現とすると、$\operatorname{Ind}_{H}^{G}W$ は $G/H$ への作用の線形化 $\mathbb{C}[G/H]$（\ref{rep:induced-structure} の作用が剰余類の並べ替え）。
2. $H=\{1\}$, $W=\mathbb{C}$ なら正則表現 $\mathbb{C}[G]$。フロベニウスの相互律から、$V_{i}$ の重複度は $\dim\Hom_{\{1\}}(\mathbb{C},V_{i})=n_{i}$（\ref{rep:sec-ch-orthogonality} の例の別証）。
3. $G=S_{3}$, $H=A_{3}=\langle c\rangle$（$c=(1\,2\,3)$）、$\psi(c)=\omega$ とする。公式から $\operatorname{Ind}\psi(1)=2$、$\operatorname{Ind}\psi(c)=\omega+\omega^{2}=-1$（$c$ の共役は $c$ と $c^{2}$）、互換では $0$。これは標準表現の指標 $(2,0,-1)$（\ref{rep:page-characters} の $S_{3}$ の指標表）で、既約。
:::

## 正規部分群からの誘導 {#rep:sec-in-mackey}

::: theorem マッキーの判定法（正規部分群の場合） {#rep:mackey-normal keywords="Mackey irreducibility criterion for induction from a normal subgroup; Res Ind psi is the sum of conjugates" index="マッキーの判定法|まっきーのはんていほう, 共役表現|きょうやくひょうげん"}
$H\trianglelefteq G$、$\psi$ を $H$ の既約指標とし、$g\in G$ について $\psi^{g}(h)\defeq\psi(g^{-1}hg)$ とおく（$H$ の既約指標）。
1. $\operatorname{Res}_{H}^{G}\operatorname{Ind}_{H}^{G}\psi=\sum_{i=1}^{t}\psi^{g_{i}}$。
2. $\operatorname{Ind}_{H}^{G}\psi$ が既約 $\iff$ $g\notin H$ なら $\psi^{g}\neq\psi$。
:::

::: proof
**Step 1（$\psi^{g}$ は既約指標）.** $\psi$ を表現 $\sigma:H\to\GL(W)$ の指標とすると、$\psi^{g}$ は表現 $h\mapsto\sigma(g^{-1}hg)$（$H$ は正規なので $g^{-1}hg\in H$）の指標で、部分表現は同じ部分空間なので既約。

**Step 2（1）.** $h\in H$ について、$H$ は正規なので $g_{i}^{-1}hg_{i}\in H$ がすべての $i$ で成り立ち、誘導指標の公式（\ref{rep:induced-character}）から $\operatorname{Ind}\psi(h)=\sum_{i}\psi(g_{i}^{-1}hg_{i})=\sum_{i}\psi^{g_{i}}(h)$。

**Step 3（2）.** フロベニウスの相互律（\ref{rep:frobenius-reciprocity} の 2）と 1 から
$$
\langle\operatorname{Ind}\psi,\operatorname{Ind}\psi\rangle_{G}=\langle\psi,\operatorname{Res}\operatorname{Ind}\psi\rangle_{H}=\sum_{i=1}^{t}\langle\psi,\psi^{g_{i}}\rangle_{H}.
$$
各項は既約指標どうしの内積なので $0$ か $1$（\ref{rep:orthogonality}）で、$g_{i}\in H$（の剰余類 $H$）の項は $1$。よって和が $1$ $\iff$ $g_{i}\notin H$ のすべての $i$ で $\psi^{g_{i}}\neq\psi$。$\psi^{g}$ は $g$ の剰余類 $gH$ だけで決まる（$h\in H$ について $\psi^{gh}=(\psi^{g})^{h}$ で、$\psi^{h}=\psi$ は $\psi$ が $H$ の類関数だから）ので、これは主張の条件と同値。\ref{rep:character-determines} の 2 から結論を得る。
:::

::: example 二面体群の 2 次元表現
$G=D_{n}$, $H=C_{n}=\langle r\rangle$（指数 2 で正規）、$\psi_{j}(r^{k})=\zeta^{jk}$（$\zeta=e^{2\pi i/n}$）とする。$s$ による共役は $\psi_{j}^{s}(r)=\psi_{j}(s^{-1}rs)=\psi_{j}(r^{-1})=\zeta^{-j}$ なので $\psi_{j}^{s}=\psi_{-j}$。よって $\psi_{j}\neq\psi_{-j}$（$2j\not\equiv0\bmod n$）なら $\operatorname{Ind}\psi_{j}$ は 2 次元の既約表現。$\operatorname{Ind}\psi_{j}(r)=\zeta^{j}+\zeta^{-j}=2\cos(2\pi j/n)$ なので、$\operatorname{Ind}\psi_{j}\cong\operatorname{Ind}\psi_{-j}$ で、$1\le j<n/2$ の範囲では互いに同値でない。したがって $n$ が奇数なら $(n-1)/2$ 個、偶数なら $(n-2)/2$ 個の 2 次元既約表現が得られる。1 次元の表現（$srs^{-1}r^{-1}=r^{-2}$ から $[D_{n},D_{n}]=\langle r^{2}\rangle$ で、$D_{n}/\langle r^{2}\rangle$ の位数は $n$ 奇数で 2、偶数で 4。\ref{rep:lifting-linear-characters} の 2）と合わせて $2+4\cdot\frac{n-1}{2}=2n$、$4+4\cdot\frac{n-2}{2}=2n$ で、すべての既約表現が得られた。
:::

::: supplement
**マッキーの公式.** 一般の部分群 $H,K\subset G$ について、$\operatorname{Res}_{K}\operatorname{Ind}_{H}W$ は両側剰余類 $K\backslash G/H$ の和として書け、そこから一般のマッキーの判定法（$\operatorname{Ind}_{H}^{G}W$ が既約 $\iff$ $W$ が既約で、$g\notin H$ について $W^{g}$ と $W$ が $H\cap gHg^{-1}$ 上で共通の既約成分をもたない）が得られることが知られている（本サイト未収録）。

**ブラウアーの定理.** すべての指標は、基本部分群（巡回群と $p$ 群の直積）の 1 次元指標の誘導指標の整数係数の一次結合で書けることが知られている（ブラウアーの誘導定理。本サイト未収録）。

**高い視点.** 誘導 $\operatorname{Ind}=\mathbb{C}[G]\otimes_{\mathbb{C}[H]}-$ は制限の左随伴（スカラーの拡大）で、1 はその随伴の単位・余単位を書き下したものである（\ref{ha:tensor-hom-adjunction}）。有限群では誘導は制限の右随伴でもある（$\operatorname{Ind}\cong\Hom_{\mathbb{C}[H]}(\mathbb{C}[G],-)$）。幾何的には、$G/H$ 上の $G$ 同変ベクトル束の切断の空間である。
:::

## 問題 {#rep:sec-in-problems}

::: problem {#rep:prob-in-transitivity}
$K\subset H\subset G$ について $\operatorname{Ind}_{H}^{G}\operatorname{Ind}_{K}^{H}W\cong\operatorname{Ind}_{K}^{G}W$ を示せ。
:::

::: solution
テンソル積の結合律から $\mathbb{C}[G]\otimes_{\mathbb{C}[H]}(\mathbb{C}[H]\otimes_{\mathbb{C}[K]}W)\cong(\mathbb{C}[G]\otimes_{\mathbb{C}[H]}\mathbb{C}[H])\otimes_{\mathbb{C}[K]}W\cong\mathbb{C}[G]\otimes_{\mathbb{C}[K]}W$ で、$G$ の作用は左の $\mathbb{C}[G]$ への作用なので同型は $G$ 準同型。指標でも、誘導指標の公式を 2 回使うと同じ式になる。
:::
