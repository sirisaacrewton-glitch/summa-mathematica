# 指標表の計算 {#rep:page-character-tables keywords="character table, linear characters, abelian groups, kernel of a character, normal subgroups from the character table, doubly transitive actions, character tables of S_3, D_4, Q_8, A_4, S_4"}

既約指標の値を「行＝既約指標、列＝共役類」に並べたものを**指標表**という。指標表は直交関係（\ref{rep:orthogonality}, \ref{rep:characters-basis}）を満たす正方行列で、少ない手がかりから全体が決まることが多い。このページでは、1 次元の指標（可換化と双対群）、剰余群からの持ち上げ、2 重推移的な作用、という三つの道具を用意し、$D_{4}$, $Q_{8}$, $A_{4}$, $S_{4}$ の指標表を計算する。また、指標表から正規部分群がすべて読み取れることを示す。

> 雪江『代数学 3』第 5 章 §5.2・§5.3 を参考にした。指標表の各行の既約性は、すべて内積の計算で確かめる。

## 記法と定義の確認 {#rep:sec-ct-notation}

::: notation
- 表現は $\mathbb{C}$ 上の有限次元表現。指標・内積・直交関係・既約性の判定は \ref{rep:character}, \ref{rep:orthogonality}, \ref{rep:character-determines}, \ref{rep:characters-basis}。既約指標を $\chi_{1}=1,\dots,\chi_{r}$ と書く。
- 有限アーベル群の指標群 $\hat A=\Hom(A,\Q/\Z)\cong\Hom(A,\mathbb{C}^{\times})$ は \ref{grp:dual-group} とその後の注意、$\lvert\hat A\rvert=\lvert A\rvert$ は \ref{grp:dual-group-basic}。
- 交換子部分群と可換化は \ref{grp:commutator-subgroup}, \ref{grp:abelianization-universal}、バーンサイドの補題は \tref{grp:burnside-lemma}。
- $\omega\defeq e^{2\pi i/3}$。
- **選択公理**：使わない。
:::

## 道具 {#rep:sec-ct-tools}

::: lemma 有限位数の行列は対角化可能 {#rep:finite-order-diagonalizable keywords="a complex matrix of finite order is diagonalizable with roots of unity on the diagonal" index="対角化可能|たいかくかかのう"}
複素ベクトル空間 $V$ の線形写像 $T$ が $T^{m}=\mathrm{id}$ をみたすなら、$T$ は対角化可能で、固有値は 1 の $m$ 乗根である。
:::

::: proof
$\zeta=e^{2\pi i/m}$ とすると $X^{m}-1=\prod_{j=0}^{m-1}(X-\zeta^{j})$ で根は相異なる。$e_{j}(X)\defeq\prod_{l\neq j}(X-\zeta^{l})/(\zeta^{j}-\zeta^{l})$（ラグランジュ補間）とおくと、$\sum_{j}e_{j}(X)-1$ は次数 $m-1$ 以下で $m$ 個の点 $\zeta^{l}$ で $0$ なので $0$、すなわち $\sum_{j}e_{j}=1$。よって $v=\sum_{j}e_{j}(T)v$。$(T-\zeta^{j})e_{j}(T)=c_{j}(T^{m}-1)=0$（$c_{j}$ は定数）なので $e_{j}(T)v$ は固有値 $\zeta^{j}$ の固有ベクトル（または $0$）。したがって $V$ は固有空間の和で、各固有空間の基底を合わせれば固有ベクトルからなる基底がとれる（相異なる固有値の固有ベクトルは一次独立）。
:::

::: proposition 指標の核 {#rep:character-kernel keywords="kernel of a character, ker chi = ker rho, |chi(g)| = chi(1) iff rho(g) is scalar" index="指標の核|しひょうのかく"}
表現 $\rho:G\to\GL(V)$、$n=\dim V$ とその指標 $\chi$ について、
1. $\lvert\chi(g)\rvert=n\iff\rho(g)$ はスカラー倍。
2. $\chi(g)=n\iff\rho(g)=\mathrm{id}$。したがって $\Ker\chi\defeq\{g:\chi(g)=\chi(1)\}$ は $\Ker\rho$ に等しく、正規部分群である。
:::

::: proof
\ref{rep:finite-order-diagonalizable} から $\rho(g)$ は固有値 $\lambda_{1},\dots,\lambda_{n}$（$\lvert\lambda_{j}\rvert=1$）で対角化できる。$\lvert\sum\lambda_{j}\rvert=n=\sum\lvert\lambda_{j}\rvert$ は三角不等式の等号なので、すべての $\lambda_{j}$ は同じ偏角、すなわち等しく、$\rho(g)$ はスカラー倍。$\sum\lambda_{j}=n$ ならさらに $\lambda_{j}=1$ で $\rho(g)=\mathrm{id}$。逆は明らか。
:::

::: proposition 持ち上げと 1 次元の指標 {#rep:lifting-linear-characters keywords="lifting representations from quotients, linear characters correspond to the dual of the abelianization, irreducible characters of abelian groups" index="1 次元の指標|いちじげんのしひょう, 持ち上げ（表現）|もちあげひょうげん"}
1. $N\trianglelefteq G$ について、$G/N$ の表現 $\bar\rho$ に $\rho=\bar\rho\circ\pi$ を対応させると、$G/N$ の既約表現と、$N$ が自明に作用する $G$ の既約表現が 1 対 1 に対応する。
2. $G$ の 1 次元の指標（準同型 $G\to\mathbb{C}^{\times}$）は $G/[G,G]$ の指標群と 1 対 1 に対応し、その個数は $\lvert G/[G,G]\rvert$。
3. $G$ が可換なら、既約指標はちょうど $\hat G$ の元で、$\lvert G\rvert$ 個。
:::

::: proof
**Step 1（1）.** $N\subset\Ker\rho$ となる表現は $G/N$ を経由する（\ref{grp:factor-through-quotient}）。部分表現は $G$ の作用でも $G/N$ の作用でも同じ部分空間なので、既約性も一致する。

**Step 2（2）.** 準同型 $G\to\mathbb{C}^{\times}$ は可換群への準同型なので $G/[G,G]$ を経由し（\ref{grp:abelianization-universal}）、$G/[G,G]$ の指標と対応する。個数は $\lvert\widehat{G/[G,G]}\rvert=\lvert G/[G,G]\rvert$。

**Step 3（3）.** 既約表現は 1 次元（\ref{rep:schur-and-decomposition.4}）で、2 から。
:::

::: proposition 指標表から正規部分群を読む {#rep:normal-subgroups-from-table keywords="every normal subgroup is an intersection of kernels of irreducible characters" index="正規部分群と指標表|せいきぶぶんぐんとしひょうひょう"}
$N\trianglelefteq G$ は、$N\subset\Ker\chi_{i}$ となる既約指標 $\chi_{i}$ の核の共通部分に等しい。特に、$G$ が単純群であることは指標表から判定できる（$\chi_{i}(g)=\chi_{i}(1)$ となる $g\neq1$ が自明でない $\chi_{i}$ について存在しない）。
:::

::: proof
$\supset$ は明らか。$\subset$：$G/N$ の正則表現 $\mathbb{C}[G/N]$ を $G$ の表現とみると、核はちょうど $N$（$gN\neq N$ なら基底の元 $N$ を動かす）。これは $N$ を核に含む $G$ の既約表現の直和で（\ref{rep:schur-and-decomposition.1}）、直和の核は各成分の核の共通部分。よって $N$ はそれらの $\Ker\chi_{i}$（\ref{rep:character-kernel.2}）の共通部分を含む。
:::

::: proposition 2 重推移的な作用 {#rep:doubly-transitive keywords="if G acts doubly transitively on X, the permutation character minus the trivial character is irreducible" index="2 重推移的|にじゅうすいいてき"}
$G$ が有限集合 $X$（$\lvert X\rvert\ge2$）に作用し、$\pi(g)=\lvert X^{g}\rvert$ をその置換表現の指標とする。$G$ が $X\times X$ の対角集合 $\Delta$ とその補集合にそれぞれ推移的に作用するなら（**2 重推移的**）、$\pi-1$ は既約指標である。
:::

::: proof
$X\times X$ の固定点の個数は $\lvert X^{g}\rvert^{2}=\pi(g)^{2}$ なので、\ref{grp:burnside-lemma}から $\langle\pi,\pi\rangle=\frac{1}{\lvert G\rvert}\sum_{g}\pi(g)^{2}$ は $X\times X$ の軌道の個数 $2$（$\pi$ は実数値）。また $\langle\pi,1\rangle$ は $X$ の軌道の個数 $1$（\ref{rep:prob-ch-perm-orbits}）。よって $\langle\pi-1,\pi-1\rangle=2-2\cdot1+1=1$ で、$\pi-1$ は表現（\ref{rep:permutation-module-decomposition} のように補空間）の指標なので既約（\ref{rep:character-determines.2}）。
:::

## 指標表の例 {#rep:sec-ct-examples}

::: example 巡回群
$C_{n}=\langle g\rangle$ の既約指標は $\chi_{j}(g^{k})=\zeta^{jk}$（$\zeta=e^{2\pi i/n}$, $0\le j<n$）。指標表は離散フーリエ変換の行列 $(\zeta^{jk})_{j,k}$ で、直交関係は $\sum_{k}\zeta^{(j-l)k}=n\delta_{jl}$。
:::

::: example $D_{4}$ と $Q_{8}$
$D_{4}=\langle r,s\mid r^{4}=s^{2}=1, srs^{-1}=r^{-1}\rangle$ の共役類は $\{1\}$, $\{r^{2}\}$, $\{r,r^{3}\}$, $\{s,r^{2}s\}$, $\{rs,r^{3}s\}$ の 5 個。$[D_{4},D_{4}]=\{1,r^{2}\}$（$srs^{-1}r^{-1}=r^{-2}$）で、$D_{4}/\{1,r^{2}\}\cong C_{2}\times C_{2}$ なので 1 次元の指標は 4 個（\ref{rep:lifting-linear-characters.2}）。残りは $8-4=4=2^{2}$ から 2 次元が 1 個で、それは回転の表現（\ref{rep:prob-ch-d4-two-dim}）。

| | $1$ | $r^{2}$ | $r$ | $s$ | $rs$ |
|---|---|---|---|---|---|
| $\chi_{1}$ | $1$ | $1$ | $1$ | $1$ | $1$ |
| $\chi_{2}$ | $1$ | $1$ | $1$ | $-1$ | $-1$ |
| $\chi_{3}$ | $1$ | $1$ | $-1$ | $1$ | $-1$ |
| $\chi_{4}$ | $1$ | $1$ | $-1$ | $-1$ | $1$ |
| $\chi_{5}$ | $2$ | $-2$ | $0$ | $0$ | $0$ |

四元数群 $Q_{8}=\{\pm1,\pm i,\pm j,\pm k\}$ も共役類は $\{1\},\{-1\},\{\pm i\},\{\pm j\},\{\pm k\}$、$[Q_{8},Q_{8}]=\{\pm1\}$、$Q_{8}/\{\pm1\}\cong C_{2}\times C_{2}$ で、**全く同じ指標表**になる（列を $1,-1,i,j,k$ と読む。2 次元の表現は $i,j,k$ を $\begin{pmatrix}i&0\\0&-i\end{pmatrix}$, $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, $\begin{pmatrix}0&i\\i&0\end{pmatrix}$ とするもの）。$D_{4}\not\cong Q_{8}$（位数 2 の元の個数が 5 と 1）なので、**指標表は群を決めない**。
:::

::: example $A_{4}$
$A_{4}$ の共役類は $\{1\}$, $\{(1\,2)(3\,4)$ 型（3 個）$\}$, $(1\,2\,3)$ の類（4 個）, $(1\,3\,2)$ の類（4 個）の 4 個（$A_{4}$ では $(1\,2\,3)$ と $(1\,3\,2)$ は共役でない）。$V_{4}=\{1,(1\,2)(3\,4),(1\,3)(2\,4),(1\,4)(2\,3)\}$ は正規で $A_{4}/V_{4}\cong C_{3}$（$(1\,2\,3)$ の像が生成）なので、1 次元の指標が 3 個持ち上がる。$A_{4}$ は $\{1,2,3,4\}$ に 2 重推移的に作用するので、置換指標 $(4,0,1,1)$ から $1$ を引いた $(3,-1,0,0)$ は既約（\ref{rep:doubly-transitive}）。$1+1+1+9=12$ で全部。

| | $1$ | $(1\,2)(3\,4)$ | $(1\,2\,3)$ | $(1\,3\,2)$ |
|---|---|---|---|---|
| 類の大きさ | $1$ | $3$ | $4$ | $4$ |
| $\chi_{1}$ | $1$ | $1$ | $1$ | $1$ |
| $\chi_{2}$ | $1$ | $1$ | $\omega$ | $\omega^{2}$ |
| $\chi_{3}$ | $1$ | $1$ | $\omega^{2}$ | $\omega$ |
| $\chi_{4}$ | $3$ | $-1$ | $0$ | $0$ |
:::

::: example $S_{4}$
共役類は巡回置換の型で決まり、$1$（1 個）、$(1\,2)$（6 個）、$(1\,2)(3\,4)$（3 個）、$(1\,2\,3)$（8 個）、$(1\,2\,3\,4)$（6 個）。
- 自明・符号の 2 個の 1 次元指標（$[S_{4},S_{4}]=A_{4}$。\ref{rep:prob-one-dim-count}）。
- 標準表現：置換指標 $(4,2,0,1,0)$ から $1$ を引いた $(3,1,-1,0,-1)$。$S_{4}$ は 2 重推移的なので既約。
- 標準表現と符号表現のテンソル積：$(3,-1,-1,0,1)$。内積を計算すると $\frac{1}{24}(9+6+3+0+6)=1$ で既約、標準表現と指標が違うので同値でない。
- 2 次元：$S_{4}$ は $\{1,2,3,4\}$ の 3 通りの「2 組への分け方」$\{12|34\},\{13|24\},\{14|23\}$ に作用し、全射 $S_{4}\to S_{3}$（核 $V_{4}$）を与える。$S_{3}$ の標準表現を持ち上げると $(2,0,2,-1,0)$（$(1\,2\,3\,4)$ は位数 2 の元、すなわち互換に移る）。
- $1+1+9+9+4=24$ で全部。

| | $1$ | $(1\,2)$ | $(1\,2)(3\,4)$ | $(1\,2\,3)$ | $(1\,2\,3\,4)$ |
|---|---|---|---|---|---|
| 類の大きさ | $1$ | $6$ | $3$ | $8$ | $6$ |
| 自明 | $1$ | $1$ | $1$ | $1$ | $1$ |
| 符号 | $1$ | $-1$ | $1$ | $1$ | $-1$ |
| 2 次元 | $2$ | $0$ | $2$ | $-1$ | $0$ |
| 標準 | $3$ | $1$ | $-1$ | $0$ | $-1$ |
| 標準 ⊗ 符号 | $3$ | $-1$ | $-1$ | $0$ | $1$ |

正規部分群は、核の共通部分として $\{1\}$, $V_{4}$（2 次元の核）、$A_{4}$（符号の核）、$S_{4}$ と読み取れる（\ref{rep:normal-subgroups-from-table}）。
:::

::: supplement
**指標表に現れる数.** 指標の値は 1 の冪根の和なので代数的整数で（\ref{rep:page-integrality}）、ガロア群 $\operatorname{Gal}(\Q(\zeta_{m})/\Q)$ は既約指標の行を並べ替える。$S_{n}$ の指標はすべて整数であることが知られている（$g$ と $g^{k}$（$k$ は位数と互いに素）が共役なので。本サイト未収録）。

**計算の観点.** 置換群や行列群として与えられた群の指標表を計算するアルゴリズム（ディクソン＝シュナイダーの方法など）が知られており、計算機代数システムで使われている（本サイト未収録）。
:::

## 問題 {#rep:sec-ct-problems}

::: problem {#rep:prob-ct-column-check}
$S_{4}$ の指標表で第二直交関係（\ref{rep:characters-basis.2}）を $g=h=(1\,2)$ と $g=(1\,2),h=(1\,2\,3\,4)$ について確かめよ。
:::

::: solution
$g=h=(1\,2)$：$1+1+0+1+1=4=\lvert C_{S_{4}}((1\,2))\rvert$（$24/6=4$）。$g=(1\,2)$, $h=(1\,2\,3\,4)$：$1\cdot1+(-1)(-1)+0\cdot0+1\cdot(-1)+(-1)\cdot1=0$。
:::
