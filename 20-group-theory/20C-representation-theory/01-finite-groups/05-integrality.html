# 次元の整除性とバーンサイドの定理 {#rep:page-integrality keywords="algebraic integers, character values are algebraic integers, central character, degrees of irreducible representations divide the group order, Burnside's lemma on character values, conjugacy class of prime power size, Burnside's p^a q^b theorem"}

指標の値は 1 の冪根の和なので**代数的整数**（$\Z$ 上整な複素数）である。この単純な事実と整拡大の理論（\ref{ring:page-integral-extensions}）を組み合わせると、群の構造についての強い結論が得られる。このページでは、既約表現の次元が群の位数を割り切ること（フロベニウス）、大きさが素数冪の共役類をもつ群は単純でないこと、そしてその帰結として**バーンサイドの $p^{a}q^{b}$ 定理**（位数が二つの素数の冪の積の群は可解）を証明する。群論の側だけでは証明が難しいことが、表現論と代数的整数論を使うと短く示せる典型例である。

> 方針は標準的なもの（バーンサイド、1904 年）に従い、資料によらず書いた。

## 記法と定義の確認 {#rep:sec-ig-notation}

::: notation
- $G$ は有限群、表現は $\mathbb{C}$ 上。既約表現 $V_{1},\dots,V_{r}$（$V_{1}$ は自明）、$n_{i}=\dim V_{i}$、既約指標 $\chi_{i}$、共役類 $C_{1},\dots,C_{r}$ と代表 $g_{k}\in C_{k}$。直交関係・第二直交関係は \ref{rep:orthogonality}, \ref{rep:characters-basis}、指標の値が 1 の冪根の和であることは \ref{rep:character-basic.2}、$\lvert\chi(g)\rvert=\chi(1)$ ならスカラー倍であることは \ref{rep:character-kernel}。
- 整な元・整閉包（整な元の和・積は整）・整であることの特徴付け（有限生成加群に含まれれば整）は \ref{ring:integral-def}, \ref{ring:integral-closure}, \ref{ring:integral-criterion}。$\Z$ は UFD なので正規で（\ref{ring:ufd-normal}）、$\Q$ の元で $\Z$ 上整なものは整数。
- 群環の中心の基底が類和 $z_{C}=\sum_{g\in C}g$ であることは \ref{mod:group-ring-center}、代数閉体上のシューアの補題は \tref{mod:schur-algebraically-closed}。
- ガロア拡大のノルムが共役の積であることは \ref{fld:norm-trace-embeddings}、円分体 $\Q(\zeta_{m})/\Q$ がガロア拡大であることは \ref{fld:cyclotomic-galois}。
- 可解群とその閉包性は \ref{grp:solvable-group}, \ref{grp:solvable-closure}、シロー部分群の存在は \tref{grp:sylow-existence}、$p$ 群の中心は \ref{grp:p-group-center}。
- **選択公理**：使わない。
:::

## 代数的整数 {#rep:sec-ig-algebraic-integers}

::: definition 代数的整数 {#rep:algebraic-integer keywords="algebraic integer" index="代数的整数|だいすうてきせいすう"}
$\Z$ 上整な複素数（$\Z$ 係数のモニックな多項式の根）を**代数的整数**という。$\Z\subset\mathbb{C}$ の整閉包として、代数的整数全体は $\mathbb{C}$ の部分環をなし（\ref{ring:integral-closure.2}）、$\Q$ との共通部分は $\Z$ である（\ref{ring:ufd-normal}）。1 の冪根は $X^{m}-1$ の根なので代数的整数。
:::

::: proposition 中心指標の整数性 {#rep:central-character-integral keywords="central character omega_i(C) = |C| chi_i(g)/n_i is an algebraic integer; character values are algebraic integers" index="中心指標|ちゅうしんしひょう"}
1. 指標の値 $\chi_{i}(g)$ は代数的整数である。
2. 類和 $z_{C}$ は $V_{i}$ にスカラー $\omega_{i}(C)$ 倍として作用し、
$$
\omega_{i}(C_{k})=\frac{\lvert C_{k}\rvert\,\chi_{i}(g_{k})}{n_{i}}.
$$
3. $\omega_{i}(C)$ は代数的整数である。
:::

::: proof
**Step 1（1）.** $\chi_{i}(g)$ は 1 の冪根の和で、代数的整数の和は代数的整数。

**Step 2（2）.** $z_{C}$ は $\mathbb{C}[G]$ の中心に属する（\ref{mod:group-ring-center}）ので、$V_{i}$ への作用は $\mathbb{C}[G]$ の作用と可換で、シューアの補題（\tref{mod:schur-algebraically-closed}）からスカラー $\omega_{i}(C)$ 倍。トレースをとると $n_{i}\omega_{i}(C)=\sum_{g\in C}\chi_{i}(g)=\lvert C\rvert\chi_{i}(g_{k})$（指標は類関数）。

**Step 3（3：整数係数の環）.** $R\defeq\Z z_{C_{1}}+\dots+\Z z_{C_{r}}\subset\Z[G]$ とおく。積 $z_{C}z_{D}=\sum_{x\in C,y\in D}xy$ は $G$ の元の非負整数係数の和で、中心に属するので係数は共役類ごとに一定、すなわち $\sum_{E}a_{CDE}z_{E}$（$a_{CDE}\in\Z_{\ge0}$）。よって $R$ は $1=z_{\{1\}}$ を含む部分環で、有限生成 $\Z$ 加群。

**Step 4（3：準同型の像）.** $z\in R$ に $V_{i}$ 上の作用のスカラーを対応させる $\omega_{i}:R\to\mathbb{C}$ は環準同型（作用の合成は積）。像 $\omega_{i}(R)$ は $\Z$ を含み、有限生成 $\Z$ 加群（$R$ の生成元の像で生成）な $\mathbb{C}$ の部分環なので、その元はすべて $\Z$ 上整（\ref{ring:integral-criterion.3}）。
:::

::: theorem 既約表現の次元は位数の約数 {#rep:degree-divides-order keywords="Frobenius: the degree of an irreducible representation divides the order of the group" index="既約表現の次元の整除性|きやくひょうげんのじげんのせいじょせい"}
各 $i$ について $n_{i}$ は $\lvert G\rvert$ を割り切る。
:::

::: proof
直交関係 $\langle\chi_{i},\chi_{i}\rangle=1$ を共役類ごとにまとめ、$\overline{\chi_{i}(g)}=\chi_{i}(g^{-1})$（\ref{rep:character-basic.3}）を使うと
$$
\lvert G\rvert=\sum_{k=1}^{r}\lvert C_{k}\rvert\,\chi_{i}(g_{k})\chi_{i}(g_{k}^{-1}).
$$
両辺を $n_{i}$ で割ると $\lvert G\rvert/n_{i}=\sum_{k}\omega_{i}(C_{k})\chi_{i}(g_{k}^{-1})$ で、右辺は代数的整数の積の和なので代数的整数（\ref{rep:central-character-integral}）。左辺は有理数なので整数（\ref{rep:algebraic-integer}）。

::: hypcheck
- **前提「既約」**：シューアの補題で $z_{C}$ がスカラーとして作用することに使った。可約な表現の次元は位数を割り切るとは限らない（$C_{2}$ の自明な表現 3 個の直和は 3 次元）。
- **体「$\mathbb{C}$」**：代数閉体であること（シューアの補題）と、指標が 1 の冪根の和であることに使った。
:::
:::

::: example
$S_{4}$ の既約表現の次元 $1,1,2,3,3$ はすべて $24$ の約数（\ref{rep:page-character-tables}）。逆に、位数 $p^{2}$ の群の既約表現の次元は $1$ か $p$ で、$\sum n_{i}^{2}=p^{2}$ と $n_{1}=1$ から $p^{2}=1+\sum_{i\ge2}n_{i}^{2}$。$n_{i}=p$ が一つでもあると右辺が $p^{2}$ を超えるので、すべて 1 次元で、群は可換（1 次元の表現しかなければ $[G,G]$ の元はすべての既約表現の核に含まれ、正則表現の核 $=\{1\}$ に含まれる）。
:::

## バーンサイドの定理 {#rep:sec-ig-burnside}

::: lemma バーンサイドの補題（指標の値） {#rep:burnside-vanishing keywords="if gcd(|C|, chi(1)) = 1 then chi(g) = 0 or rho(g) is scalar" index="バーンサイドの補題（指標）|ばーんさいどのほだいしひょう" refname="バーンサイドの補題（指標の値）"}
$\rho$ を既約表現（次元 $n$、指標 $\chi$）、$g\in G$ の共役類 $C$ について $\gcd(\lvert C\rvert,n)=1$ とする。このとき $\chi(g)=0$ か、$\rho(g)$ はスカラー倍である。
:::

::: proof
**Step 1（$\alpha=\chi(g)/n$ は代数的整数）.** $a\lvert C\rvert+bn=1$ となる整数 $a,b$ をとると、
$$
\alpha\defeq\frac{\chi(g)}{n}=\frac{a\lvert C\rvert\chi(g)}{n}+b\chi(g)=a\,\omega(C)+b\,\chi(g)
$$
は代数的整数（\ref{rep:central-character-integral}）。

**Step 2（共役も絶対値 $1$ 以下）.** $m$ を $g$ の位数、$L=\Q(\zeta_{m})$ とすると、$\rho(g)$ の固有値は 1 の $m$ 乗根なので $\alpha\in L$。$L/\Q$ はガロア拡大（\ref{fld:cyclotomic-galois}）で、$\sigma\in\operatorname{Gal}(L/\Q)$ は 1 の $m$ 乗根を 1 の $m$ 乗根に移すので、$\sigma(\alpha)$ は $n$ 個の 1 の冪根の和を $n$ で割ったもの、すなわち $\lvert\sigma(\alpha)\rvert\le1$。また $\sigma(\alpha)$ は $\alpha$ と同じ整従属式をみたすので代数的整数。

**Step 3（ノルム）.** $N\defeq N_{L/\Q}(\alpha)=\prod_{\sigma}\sigma(\alpha)$（\ref{fld:norm-trace-embeddings}）は $\Q$ の元で、代数的整数の積なので代数的整数、よって $N\in\Z$、$\lvert N\rvert\le1$。

**Step 4（場合分け）.** $\lvert\alpha\rvert<1$ なら（$\sigma=\mathrm{id}$ の因子）$\lvert N\rvert<1$ なので $N=0$、ある $\sigma(\alpha)=0$ で $\alpha=0$、すなわち $\chi(g)=0$。$\lvert\alpha\rvert=1$ なら $\lvert\chi(g)\rvert=n$ で、\ref{rep:character-kernel.1} から $\rho(g)$ はスカラー倍。
:::

::: theorem 素数冪の大きさの共役類 {#rep:prime-power-class keywords="a finite group with a conjugacy class of prime power size greater than one is not simple" index="素数冪の共役類|そすうべきのきょうやくるい"}
有限群 $G$ の元 $g$ の共役類の大きさが $p^{k}$（$p$ は素数、$k\ge1$）なら、$G$ は単純群でない。
:::

::: proof
**Step 1（背理法の設定）.** $G$ が単純とする。$\lvert C(g)\rvert>1$ なので $g\notin Z(G)$、特に $G$ は可換でなく、$g\neq1$。$i\ge2$ について $\rho_{i}$ の核は正規部分群で $G$ でない（$V_{i}$ は自明でない）ので $\{1\}$、すなわち $\rho_{i}$ は単射。

**Step 2（$p\nmid n_{i}$ なら $\chi_{i}(g)=0$）.** $i\ge2$ で $p\nmid n_{i}$ なら $\gcd(p^{k},n_{i})=1$ なので、\ref{rep:burnside-vanishing} から $\chi_{i}(g)=0$ か $\rho_{i}(g)$ はスカラー倍。後者なら $\rho_{i}(g)$ はすべての $\rho_{i}(x)$ と可換で、$\rho_{i}$ は単射なので $g\in Z(G)$ となり矛盾。よって $\chi_{i}(g)=0$。

**Step 3（第二直交関係）.** $g\neq1$ なので、第二直交関係（\ref{rep:characters-basis.2}）を $g$ と $h=1$ に使うと $\sum_{i}n_{i}\chi_{i}(g)=0$。Step 2 から
$$
0=1+\sum_{i\ge2,\ p\mid n_{i}}n_{i}\chi_{i}(g),\qquad\text{すなわち}\qquad\frac{1}{p}=-\sum_{i\ge2,\ p\mid n_{i}}\frac{n_{i}}{p}\chi_{i}(g).
$$
右辺は代数的整数で、左辺 $1/p$ は整数でない有理数。これは \ref{rep:algebraic-integer} に反する。
:::

::: theorem バーンサイドの $p^{a}q^{b}$ 定理 {#rep:burnside-paqb keywords="Burnside's p^a q^b theorem: groups of order p^a q^b are solvable" index="バーンサイドの定理|ばーんさいどのていり, p^a q^b 定理|ぴーえーきゅーびーていり" refname="バーンサイドの $p^{a}q^{b}$ 定理"}
$p,q$ を素数、$a,b\ge0$ とする。位数 $p^{a}q^{b}$ の有限群は可解である。
:::

::: proof
**Step 1（帰納法）.** $\lvert G\rvert$ についての帰納法。$G$ が自明でない真の正規部分群 $N$ をもてば、$N$ と $G/N$ の位数も $p^{a'}q^{b'}$ の形で $\lvert G\rvert$ より小さいので可解で、\ref{grp:solvable-closure.2} から $G$ も可解。$G=\{1\}$ や可換群は可解。よって、$G$ が可換でない単純群となることがないことを示せばよい。

**Step 2（$p$ 群の場合）.** $b=0$（または $a=0$）なら $G$ は $p$ 群で、$G\neq\{1\}$ なら中心は自明でない（\ref{grp:p-group-center}）。単純なら $Z(G)=G$ で可換。

**Step 3（$a,b\ge1$ の場合）.** $G$ を可換でない単純群とし、シロー $q$ 部分群 $Q$（位数 $q^{b}\ge q$。\ref{grp:sylow-existence}）をとる。$Z(Q)\neq\{1\}$ なので $1\neq g\in Z(Q)$ をとると、$Q\subset C_{G}(g)$ で、共役類の大きさ $\lvert C(g)\rvert=[G:C_{G}(g)]$ は $[G:Q]=p^{a}$ の約数、すなわち $p^{k}$。$k=0$ なら $g\in Z(G)$ で、$Z(G)$ は自明でない正規部分群なので $Z(G)=G$、可換となり矛盾。$k\ge1$ なら \ref{rep:prime-power-class} に反する。

::: hypcheck
- **前提「素数が二つ」**：Step 3 でシロー部分群の指数が一つの素数の冪になることに使った。素数が三つでは偽：$A_{5}$（位数 $60=2^{2}\cdot3\cdot5$）は可換でない単純群（\ref{grp:an-simple}）。
- **選択公理**：使わない。
:::
:::

::: supplement
**群論だけによる証明.** バーンサイドの定理には、指標を使わない証明（ゴールドシュミット、松山、ベンダーらによる）も知られているが、どれも長い（本サイト未収録）。

**ファイト＝トンプソンの定理.** 奇数位数の群は可解であるという定理（ファイト＝トンプソン、1963 年）も指標理論を本質的に使うが、証明は非常に長い（\ref{grp:solvable-deep-facts}）。

**高い視点.** 証明の鍵は、群環の中心 $Z(\Z[G])$ が $\Z$ 上有限生成な可換環で、その $\mathbb{C}$ への準同型（中心指標）の値が代数的整数になることである。群の情報（共役類の大きさ）が環の整数性に翻訳され、「$1/p$ は代数的整数でない」という数論的な事実が矛盾を生む。
:::

## 問題 {#rep:sec-ig-problems}

::: problem {#rep:prob-ig-order-pq}
$p<q$ を素数とし、位数 $pq$ の群の既約表現の次元は $1$ か $p$ であることを示せ。また $q\not\equiv1\pmod p$ なら $G$ は可換であることを、表現論を使って示せ。
:::

::: solution
次元は $pq$ の約数で、$n_{i}^{2}\le\lvert G\rvert=pq<q^{2}$ なので $n_{i}\in\{1,p\}$（$q$ と $pq$ は除かれる）。1 次元の個数を $s=\lvert G/[G,G]\rvert$、$p$ 次元の個数を $t$ とすると $pq=s+tp^{2}$ で、$s$ は $pq$ の約数。$p\mid s$ なので $s\in\{p,pq\}$。$s=p$ なら $q=1+tp$、すなわち $q\equiv1\pmod p$。よって $q\not\equiv1\pmod p$ なら $s=pq$、$[G,G]=\{1\}$ で $G$ は可換。
:::
