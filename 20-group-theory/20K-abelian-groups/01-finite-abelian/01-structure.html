# 有限アーベル群の構造定理 {#grp:page-finite-abelian keywords="structure theorem for finite abelian groups, primary decomposition, elementary divisors, invariant factors, abelian p-groups, number of abelian groups of a given order"}

有限アーベル群は、素数冪位数の巡回群の直和に分解され、その分解に現れる位数の一覧（**初等因子**）は群だけで決まる（\ref{grp:finite-abelian-structure}）。言い換えると、有限アーベル群は同型を除いて初等因子の一覧で完全に分類される。証明は三段階で行う。(1) アーベル群をシロー部分群の直和に分ける（\ref{grp:primary-decomposition}）。(2) アーベル $p$ 群では、位数最大の元が生成する巡回部分群が直和因子になることを示し、巡回群の直和に分解する（\ref{grp:abelian-p-group-cyclic}）。(3) $p^{k}G/p^{k+1}G$ の大きさを数えて一意性を示す（\ref{grp:abelian-p-group-unique}）。中国剰余定理で並べ替えると、単因子による表示（\ref{grp:invariant-factors}）も得られる。

> 資料によらず書いた。環論（単項イデアル整域上の加群の構造定理）を使わず、群論だけで証明した。有限生成アーベル群の場合は補足で述べる。

## 記法と定義の確認 {#grp:sec-fa-notation}

::: notation
- 可換群は加法的に書く（演算 $+$、単位元 $0$、$n$ 倍 $nx$）。$\Z/n\Z$ と巡回群の分類・部分群は \ref{grp:z-mod-nz-quotient}, \ref{grp:cyclic-classification}, \ref{grp:subgroups-cyclic}、元の位数は \ref{grp:element-order}, \ref{grp:order-divides}。
- 直積（可換群では直和 $\oplus$ とも書く）・内部直積・中国剰余定理は \ref{grp:direct-product}, \ref{grp:direct-product-basic}, \ref{grp:internal-direct-product}, \ref{grp:chinese-remainder-group}。有限冪零群がシロー部分群の直積であること（可換群は冪零）は \ref{grp:finite-nilpotent-sylow}、$p$ 群と元の位数は \ref{grp:p-group}, \ref{grp:p-group-iff-elements}。剰余群・対応定理は \ref{grp:quotient-group}, \ref{grp:correspondence}。
- 可換群 $G$ の部分群 $H_{1},\dots,H_{k}$ について、$H_{1}+\cdots+H_{k}=G$ で、$h_{1}+\cdots+h_{k}=0$（$h_{i}\in H_{i}$）なら $h_{i}=0$ のとき、$G$ は $H_{i}$ の**内部直和**であるといい $G=H_{1}\oplus\cdots\oplus H_{k}$ と書く。このとき $(h_{i})\mapsto\sum h_{i}$ は $H_{1}\times\cdots\times H_{k}\to G$ の同型（準同型で、全射、核は自明）。
- $n\in\Z$ と可換群 $G$ について $nG\defeq\{nx : x\in G\}$、$G[n]\defeq\{x\in G : nx=0\}$。どちらも部分群（$x\mapsto nx$ は準同型で、その像と核）。
- $\ZFC$ の中で議論し、選択公理は使わない。
:::

## 準素分解 {#grp:sec-fa-primary}

::: theorem 準素分解 {#grp:primary-decomposition keywords="primary decomposition of a finite abelian group, decomposition into Sylow subgroups" index="準素分解|じゅんそぶんかい"}
有限アーベル群 $G$（$\abs{G}=p_{1}^{a_{1}}\cdots p_{k}^{a_{k}}$、$p_{i}$ は相異なる素数）について、$G_{p_{i}}\defeq\{x\in G : \ord(x)\text{ は }p_{i}\text{ の冪}\}$ は $G$ のただ一つのシロー $p_{i}$ 部分群で、
$$
G=G_{p_{1}}\oplus\cdots\oplus G_{p_{k}}.
$$
:::

::: proof
**Step 1.** 可換群は冪零（$\gamma_{2}=[G,G]=\{0\}$）なので、\ref{grp:finite-nilpotent-sylow} より $G$ はシロー部分群 $P_{1},\dots,P_{k}$ の（内部）直和で、各 $P_{i}$ は正規なのでただ一つ。

**Step 2（$P_{i}=G_{p_{i}}$）.** $P_{i}$ の元の位数は $p_{i}$ の冪なので $P_{i}\subseteq G_{p_{i}}$。$x\in G_{p_{i}}$ なら $\ang{x}$ は $p_{i}$ 部分群で、\ref{grp:sylow-normal-iff-unique} よりただ一つのシロー $p_{i}$ 部分群 $P_{i}$ に含まれる。
:::

## アーベル p 群の分解 {#grp:sec-fa-p-groups}

::: lemma 位数最大の元は直和因子を生成する {#grp:max-order-complement keywords="cyclic subgroup generated by an element of maximal order is a direct summand" index="直和因子|ちょくわいんし"}
$G$ を有限アーベル $p$ 群、$a\in G$ を位数が最大の元とする。$G=\ang{a}\oplus H$ となる部分群 $H$ がある。
:::

::: proof
$\abs{G}$ についての帰納法。$\ord(a)=p^{n}$ とすると、$G$ のすべての元 $x$ について $\ord(x)\mid p^{n}$（$\ord(x)$ は $p$ の冪で $p^{n}$ 以下）なので $p^{n}x=0$。$G=\ang{a}$ なら $H=\{0\}$ でよい。$G\neq\ang{a}$ とする。

**Step 1（$\ang{a}$ と交わらない位数 $p$ の元）.** $G\setminus\ang{a}$ の元のうち位数が最小の $b$ をとる。$\ord(pb)=\ord(b)/p<\ord(b)$（\ref{grp:order-of-power}）なので、最小性から $pb\in\ang{a}$、$pb=ka$ と書ける。$0=p^{n}b=p^{n-1}(pb)=p^{n-1}ka$ なので $p^{n}\mid p^{n-1}k$、すなわち $p\mid k$、$k=pm$。$c\defeq b-ma$ とおくと $pc=pb-pma=0$、$c\notin\ang{a}$（$b\notin\ang{a}$ だから）。よって $\ord(c)=p$ で、$\ang{c}\cap\ang{a}$ は $\ang{c}$ の部分群で $c$ を含まないので $\{0\}$。

**Step 2（剰余群で帰納法）.** $\bar G\defeq G/\ang{c}$、$\bar x\defeq x+\ang{c}$ とする。$\abs{\bar G}<\abs{G}$。$\bar a$ の位数は $p^{n}$：$p^{j}\bar a=\bar 0\iff p^{j}a\in\ang{c}\cap\ang{a}=\{0\}\iff p^{n}\mid p^{j}$。$\bar G$ の元の位数は $G$ の対応する元の位数以下（$\ord(\bar x)\mid\ord(x)$）なので、$\bar a$ は $\bar G$ で位数最大。帰納法の仮定から $\bar G=\ang{\bar a}\oplus\bar H$ となる $\bar H$ がある。対応定理で $\bar H=H/\ang{c}$（$\ang{c}\subseteq H\le G$）と書く。

**Step 3（$G=\ang{a}+H$）.** $x\in G$ について $\bar x=k\bar a+\bar h$（$h\in H$）と書けるので、$x-ka-h\in\ang{c}\subseteq H$、よって $x\in\ang{a}+H$。

**Step 4（$\ang{a}\cap H=\{0\}$）.** $ka\in H$ なら $k\bar a\in\ang{\bar a}\cap\bar H=\{\bar 0\}$ なので $ka\in\ang{c}\cap\ang{a}=\{0\}$。Step 3 と合わせて $G=\ang{a}\oplus H$。

::: hypcheck
- **$a$ の位数が最大**：Step 1 で $p^{n}b=0$ に使った。外すと偽：$G=\Z/4\Z$, $a=2$ の $\ang{a}=\{0,2\}$ には補部分群がない（位数 $2$ の部分群は $\ang{2}$ だけ）。
- **可換**：$\ang{c}$ の正規性と剰余群、内部直和の扱いに使った。
:::
:::

::: theorem アーベル p 群は巡回群の直和 {#grp:abelian-p-group-cyclic keywords="every finite abelian p-group is a direct sum of cyclic groups" index="アーベル p 群の分解|あーべるぴーぐんのぶんかい"}
有限アーベル $p$ 群 $G$ は、巡回群の直和 $G\cong\Z/p^{e_{1}}\Z\oplus\cdots\oplus\Z/p^{e_{t}}\Z$（$e_{1}\ge\cdots\ge e_{t}\ge 1$）と同型である（$G=\{0\}$ なら $t=0$）。
:::

::: proof
$\abs{G}$ についての帰納法。$G\neq\{0\}$ なら位数最大の元 $a$（$\ord(a)=p^{e_{1}}$）について \ref{grp:max-order-complement} より $G=\ang{a}\oplus H$、$\abs{H}<\abs{G}$。帰納法の仮定で $H\cong\bigoplus_{i\ge 2}\Z/p^{e_{i}}\Z$ で、$H$ の元の位数は $p^{e_{1}}$ 以下なので $e_{i}\le e_{1}$。$\ang{a}\cong\Z/p^{e_{1}}\Z$（\ref{grp:cyclic-classification}）。
:::

::: theorem 分解の一意性 {#grp:abelian-p-group-unique keywords="uniqueness of the type of a finite abelian p-group, p^k G / p^(k+1) G" index="型の一意性|かたのいちいせい"}
$G\cong\Z/p^{e_{1}}\Z\oplus\cdots\oplus\Z/p^{e_{t}}\Z$ なら、各 $k\ge 0$ について
$$
\abs{p^{k}G/p^{k+1}G}=p^{\#\{i : e_{i}>k\}}.
$$
したがって、列 $(e_{1}\ge\cdots\ge e_{t})$ は $G$ の同型類だけで決まる。
:::

::: proof
**Step 1（一つの巡回群）.** $C=\Z/p^{e}\Z$ について $p^{k}C$ は $p^{k}$ で生成される部分群で、$k<e$ なら位数 $p^{e-k}$（\ref{grp:order-of-power}）、$k\ge e$ なら $\{0\}$。よって $\abs{p^{k}C/p^{k+1}C}$ は $e>k$ なら $p^{e-k}/p^{e-k-1}=p$、$e\le k$ なら $1$。

**Step 2（直和）.** 直和では成分ごとに $p^{k}(\bigoplus C_{i})=\bigoplus p^{k}C_{i}$ で、$\abs{p^{k}G}=\prod_{i}\abs{p^{k}C_{i}}$。ラグランジュの定理から $\abs{p^{k}G/p^{k+1}G}=\prod_{i}\abs{p^{k}C_{i}/p^{k+1}C_{i}}=p^{\#\{i:e_{i}>k\}}$。

**Step 3（同型で不変）.** 同型 $\varphi:G\to G'$ は $\varphi(p^{k}G)=p^{k}G'$ をみたすので、$\abs{p^{k}G/p^{k+1}G}$ は同型類だけで決まる。$\#\{i : e_{i}>k\}$（$k=0,1,2,\dots$）がわかれば、$\#\{i : e_{i}=k\}=\#\{i:e_{i}>k-1\}-\#\{i:e_{i}>k\}$（$k\ge 1$）として列 $(e_{i})$ が決まる。
:::

## 構造定理 {#grp:sec-fa-structure}

::: theorem 有限アーベル群の構造定理 {#grp:finite-abelian-structure keywords="fundamental theorem of finite abelian groups, elementary divisors" index="有限アーベル群の構造定理|ゆうげんあーべるぐんのこうぞうていり, 初等因子|しょとういんし"}
有限アーベル群 $G$ は、素数冪位数の巡回群の直和
$$
G\cong\bigoplus_{j}\Z/p_{j}^{e_{j}}\Z
$$
と同型である。現れる素数冪の一覧 $(p_{j}^{e_{j}})_{j}$（重複込み、順序を除く）は $G$ の同型類だけで決まり、これを $G$ の**初等因子**という。二つの有限アーベル群が同型 $\iff$ 初等因子が一致する。
:::

::: proof
**Step 1（存在）.** \ref{grp:primary-decomposition} で $G=\bigoplus_{p}G_{p}$ とし、各 $G_{p}$ に \ref{grp:abelian-p-group-cyclic} を使う。

**Step 2（一意性）.** $G\cong\bigoplus\Z/p_{j}^{e_{j}}\Z$ とすると、右辺の $p$ 成分（位数が $p$ の冪の元全体）は $p_{j}=p$ の項の直和である（直和の元 $(x_{j})$ の位数は各成分の位数の最小公倍数で、それが $p$ の冪 $\iff p_{j}\neq p$ の成分が $0$。\ref{grp:direct-product-basic} の 3 の一般化）。同型は $p$ 成分を $p$ 成分に写すので、$G_{p}\cong\bigoplus_{p_{j}=p}\Z/p^{e_{j}}\Z$ で、\ref{grp:abelian-p-group-unique} より $p$ の項の指数の一覧は $G$ で決まる。

**Step 3（同型の判定）.** $\Rightarrow$ は Step 2。$\Leftarrow$ は、初等因子が一致すれば同じ直和と同型になることから。
:::

::: corollary 単因子による表示 {#grp:invariant-factors keywords="invariant factors, d1 | d2 | ... | dt" index="単因子|たんいんし"}
有限アーベル群 $G\neq\{0\}$ に対し、$1<d_{1}\mid d_{2}\mid\cdots\mid d_{s}$ をみたす整数の列で
$$
G\cong\Z/d_{1}\Z\oplus\cdots\oplus\Z/d_{s}\Z
$$
となるものがただ一つある（$d_{i}$ を**単因子**という）。$d_{s}$ は $G$ の元の位数の最大値である。
:::

::: proof
**Step 1（作り方）.** 素数 $p$ ごとに $p$ の初等因子の指数を大きい順に $e_{p,1}\ge e_{p,2}\ge\cdots$ と並べ（足りない所は $0$ とする）、$s$ を素数ごとの個数の最大値として $d_{s+1-i}\defeq\prod_{p}p^{e_{p,i}}$（$i=1,\dots,s$）とおく。$e_{p,i}\ge e_{p,i+1}$ なので $d_{s-i}\mid d_{s+1-i}$、また $d_{1}>1$（$i=s$ でどれかの $p$ が $e_{p,s}\ge 1$）。中国剰余定理（\ref{grp:chinese-remainder-group}）を繰り返し使うと $\Z/d\Z\cong\bigoplus_{p}\Z/p^{e_{p}}\Z$（$d=\prod p^{e_{p}}$）なので、$\bigoplus_{i}\Z/d_{i}\Z$ の初等因子は $G$ のものと一致し、\ref{grp:finite-abelian-structure} より同型。

**Step 2（一意性）.** $d_{1}\mid\cdots\mid d_{s}$ が与えられれば、中国剰余定理で各 $\Z/d_{i}\Z$ を素数冪に分けると初等因子が得られ、逆に Step 1 の手順で初等因子から $d_{i}$ が復元される（$d_{s}$ は各素数の最大指数の積、など）。初等因子は $G$ で決まるので、$d_{i}$ も決まる。

**Step 3（$d_{s}$）.** 直和の元の位数は成分の位数の最小公倍数（\ref{grp:direct-product-basic} の 3）で、各成分の位数は $d_{i}\mid d_{s}$ を割り切るので $d_{s}$ を割り切る。$\Z/d_{s}\Z$ の生成元の位数は $d_{s}$。
:::

::: example
1. 位数 $8$ のアーベル群：初等因子は $8$ の分割に対応して $(8)$, $(4,2)$, $(2,2,2)$ の $3$ 通りで、$\Z/8$, $\Z/4\oplus\Z/2$, $(\Z/2)^{3}$。
2. 位数 $72=2^{3}\cdot 3^{2}$ のアーベル群は $3\times 2=6$ 通り（$2^{3}$ の分割 $3$ 通りと $3^{2}$ の分割 $2$ 通り）。例えば初等因子 $(4,2,9)$ の群の単因子は $d_{1}=2$, $d_{2}=36$：$\Z/4\oplus\Z/2\oplus\Z/9\cong\Z/2\oplus\Z/36$。
3. $(\Z/8\Z)^{\times}\cong\Z/2\oplus\Z/2$（\ref{grp:units-mod-n} の例。すべての元の位数が $2$ 以下）。
:::

::: corollary アーベル群の個数 {#grp:number-of-abelian-groups keywords="number of abelian groups of order n, product of partition numbers" index="アーベル群の個数|あーべるぐんのこすう"}
$n=p_{1}^{a_{1}}\cdots p_{k}^{a_{k}}$ について、位数 $n$ のアーベル群は同型を除いて $\prod_{i}p(a_{i})$ 個ある（$p(a)$ は $a$ の分割の個数）。特に、位数 $n$ のアーベル群が巡回群だけ $\iff n$ が平方因子をもたない。
:::

::: proof
\ref{grp:finite-abelian-structure} より、アーベル群の同型類は素数 $p_{i}$ ごとの初等因子の指数の列、すなわち $a_{i}$ の分割の組と一対一に対応する。積が $1$ $\iff$ すべての $a_{i}$ で $p(a_{i})=1\iff$ すべての $a_{i}=1$（$p(1)=1$, $a\ge 2$ なら $(a)$ と $(a-1,1)$ の二つ以上）。
:::

::: supplement
**有限生成アーベル群.** 有限個の元で生成されるアーベル群 $G$ は $\Z^{r}\oplus T$（$T$ は有限アーベル群、$r\ge 0$ は**階数**）と同型で、$r$ と $T$ の同型類は $G$ で決まる（\ref{mod:fg-abelian}）。証明には「有限生成で捩れのないアーベル群は $\Z^{r}$ と同型」を示す必要があり、整数行列の基本変形（スミス標準形 \ref{mod:smith-normal-form}）を使って、単項イデアル整域上の有限生成加群の構造定理（\ref{mod:pid-structure}）の特別な場合として証明した。

**高い視点.** 有限アーベル群の圏で、$G\mapsto G[n]$ と $G\mapsto G/nG$ は群の大きさを測る「双対的な」操作で、\ref{grp:abelian-p-group-unique} の不変量はこれらから作られる。有限アーベル群 $G$ はその双対 $\Hom(G,\Q/\Z)$ と（非標準的に）同型であることも、構造定理から従う。

**計算の観点.** 生成元と関係式で与えられた有限生成アーベル群の構造（単因子）は、関係行列の $\Z$ 上のスミス標準形で求まり（\ref{mod:pid-structure} の証明）、多項式時間で計算できることが知られている（\ref{mod:sec-pm-computability}）。非可換群の有限表示では、二つの語が等しいかの判定（語の問題）すら一般にはアルゴリズムで解けない（\ref{grp:page-presentations}）。
:::

## 問題 {#grp:sec-fa-problems}

::: problem {#grp:prob-abelian-exponent-cyclic}
有限アーベル群 $G$ で、元の位数の最大値が $\abs{G}$ に等しいものは巡回群であることを示し、$\abs{G}$ が平方因子をもたないアーベル群は巡回群であることを導け。
:::

::: solution
位数 $\abs{G}$ の元があれば、それが生成する巡回部分群は $G$ 全体。後半：\ref{grp:invariant-factors} の $d_{s}$ は元の位数の最大値で、$\abs{G}=d_{1}\cdots d_{s}$。$s\ge 2$ なら $d_{1}\mid d_{2}$ から $d_{1}$ の素因数 $p$ について $p^{2}\mid d_{1}d_{2}\mid\abs{G}$ となり、平方因子がないことに反する。よって $s=1$、$G\cong\Z/d_{1}\Z$。
:::

::: problem {#grp:prob-abelian-elements-order-p}
有限アーベル群 $G$ と素数 $p$ について、$\abs{G[p]}=p^{t}$（$t$ は $p$ の初等因子の個数）であることを示し、$G[p]=G$ となるのはどんなときか答えよ。
:::

::: solution
$G[p]$ は $G_{p}$ に含まれ、$G_{p}\cong\bigoplus_{i=1}^{t}\Z/p^{e_{i}}\Z$ で、$G[p]$ は成分ごとの $\Z/p^{e}\Z[p]$（位数 $p$ の部分群、$p^{e-1}$ で生成）の直和なので位数 $p^{t}$。$G[p]=G\iff$ すべての元の位数が $p$ 以下 $\iff G\cong(\Z/p\Z)^{t}$（初等アーベル $p$ 群）。
:::

::: problem {#grp:prob-units-15}
$(\Z/15\Z)^{\times}$ の単因子を求めよ。
:::

::: solution
位数は $\varphi(15)=8$。元は $1,2,4,7,8,11,13,14$ で、$2^{2}=4$, $2^{4}=16\equiv 1$ なので $\ord(2)=4$。$4^{2}=16\equiv 1$, $11^{2}=121\equiv 1$, $14^{2}\equiv 1$ で、位数 $8$ の元はない（$x^{4}\equiv 1$ がすべての元で成り立つ：$7^{2}=49\equiv 4$, $7^{4}\equiv 16\equiv 1$ など）。位数 $8$ のアーベル群は $\Z/8$, $\Z/4\oplus\Z/2$, $(\Z/2)^{3}$ の三つ（\ref{grp:finite-abelian-structure} の後の例 1）で、元の位数の最大値はそれぞれ $8,4,2$。最大値が $4$ なので $\Z/4\oplus\Z/2$ と同型で、単因子は $(2,4)$。（中国剰余定理で $(\Z/15)^{\times}\cong(\Z/3)^{\times}\times(\Z/5)^{\times}\cong\Z/2\oplus\Z/4$ ともわかる。）
:::
