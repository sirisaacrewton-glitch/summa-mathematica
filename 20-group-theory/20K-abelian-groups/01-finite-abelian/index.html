# 有限アーベル群（Finite Abelian Groups）

有限アーベル群の構造定理（巡回群の直和への分解、初等因子と単因子の一意性）、与えられた位数のアーベル群の個数、最短の巡回分解と生成元の最小個数（単因子の個数・p ランク・部分群の生成元の個数）。
