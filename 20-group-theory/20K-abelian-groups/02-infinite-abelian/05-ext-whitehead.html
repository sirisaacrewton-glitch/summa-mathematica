# 拡大と Ext、ホワイトヘッドの問題 {#grp:page-ext-whitehead keywords="extensions of abelian groups, Ext(A,B), Whitehead group, Whitehead's problem, Stein's theorem, Shelah's independence theorem, V=L, Martin's axiom, Ext(A,Z) for torsion A, endomorphisms of the Pruefer group"}

アーベル群 $A$ の $B$ による拡大 $0\to B\to E\to A\to0$ は、ホモロジー代数の $\mathrm{Ext}^{1}(A,B)$ で分類される（\ref{ha:ext1-classifies}）。$A$ が自由なら、どんな拡大も分裂する。では逆に、$\Z$ によるどんな拡大も分裂する群（**ホワイトヘッド群**）は自由だろうか。この問い（**ホワイトヘッドの問題**）は、可算な群については肯定的に解けている（シュタイン）が、非可算な群については $\ZFC$ から独立であることがシェラハによって示された：$V=L$ のもとでは肯定的、マーティンの公理と連続体仮説の否定のもとでは否定的である。このページでは、アーベル群の $\mathrm{Ext}$ の基本的な計算と、ホワイトヘッド群の初等的な性質（自由群の部分群と同様に遺伝し、捩れがなく、階数 $1$ なら $\Z$ と同型であること）を証明し、独立性の結果を紹介する。

> 資料：ホモロジー代数の部分は本サイトの導来関手の系列による。ホワイトヘッドの問題の独立性は S. Shelah の結果で、証明は本サイトの範囲外とする（出典は \ref{grp:fact-shelah}）。

## 記法と定義の確認 {#grp:sec-ew-notation}

::: notation
- $\mathrm{Ext}=\mathrm{Ext}^{1}_{\Z}$、$\mathrm{Hom}=\mathrm{Hom}_{\Z}$（\ref{ha:ext}）。$\mathrm{Ext}^{1}$ は拡大の同値類と一対一に対応し、$0$ が分裂する拡大に対応する（\ref{ha:ext1-classifies}, \ref{ha:ext1-splitting}）。
- 長完全列（\ref{ha:ext-long-exact}）、$\mathrm{Ext}(\Z/n,B)\cong B/nB$（\ref{ha:ext-z}）、射影的な第一変数・入射的な第二変数で消えること（\ref{ha:ext-basic.3}, \ref{ha:ext-vanish-injective}）、整数上で $\mathrm{Ext}^{2}=0$（\ref{ha:pd-z}, \ref{ha:pd-characterization}）。
- 可除群は入射的（\ref{ha:injective-divisible}）、プリューファー群 $\Z(p^{\infty})$ とその元 $b_{n}=1/p^{n}+\Z$ は \ref{grp:pruefer-group}, \ref{grp:pruefer-properties}。
- $\ZFC$ の中で議論する。
:::

## アーベル群の Ext {#grp:sec-ew-ext}

::: proposition Ext の基本的な計算 {#grp:ext-abelian-basic keywords="Ext of free groups vanishes; Ext into divisible groups vanishes; Ext(Z/n,Z)=Z/n; Ext(A,Z) = Hom(A,Q/Z) for torsion A" index="アーベル群の Ext|あーべるぐんのえくすと"}
アーベル群 $A,B$ について、
1. $A$ が自由なら $\mathrm{Ext}(A,B)=0$。$B$ が可除なら $\mathrm{Ext}(A,B)=0$。
2. $\mathrm{Ext}(\Z/n,\Z)\cong\Z/n$。
3. 短完全列 $0\to A'\to A\to A''\to0$ について、$\mathrm{Ext}(A,B)\to\mathrm{Ext}(A',B)$ は全射である。
4. $A$ が捩れ群なら $\mathrm{Ext}(A,\Z)\cong\mathrm{Hom}(A,\mathbb{Q}/\Z)$。
:::

::: proof
**Step 1（1）.** 自由アーベル群は射影的（\ref{grp:projective-abelian-free}）なので \ref{ha:ext-basic.3}。可除群は入射的なので \ref{ha:ext-vanish-injective}。

**Step 2（2）.** \ref{ha:ext-z} から $\mathrm{Ext}(\Z/n,\Z)\cong\Z/n\Z$。

**Step 3（3）.** 長完全列（\ref{ha:ext-long-exact.2}）の $\mathrm{Ext}(A,B)\to\mathrm{Ext}(A',B)\to\mathrm{Ext}^{2}(A'',B)$ と、$\mathrm{Ext}^{2}=0$（\ref{ha:pd-z}：$\mathrm{pd}_{\Z}\le1$ と \ref{ha:pd-characterization}）から。

**Step 4（4）.** $0\to\Z\to\mathbb{Q}\to\mathbb{Q}/\Z\to0$ に第二変数の長完全列（\ref{ha:ext-long-exact.1}）を適用すると、
$$
\mathrm{Hom}(A,\mathbb{Q})\to\mathrm{Hom}(A,\mathbb{Q}/\Z)\to\mathrm{Ext}(A,\Z)\to\mathrm{Ext}(A,\mathbb{Q})
$$
は完全。$A$ は捩れ群で $\mathbb{Q}$ は捩れがないので $\mathrm{Hom}(A,\mathbb{Q})=0$（$na=0$ なら $nf(a)=0$ で $f(a)=0$）。$\mathbb{Q}$ は可除なので $\mathrm{Ext}(A,\mathbb{Q})=0$（1）。
:::

::: lemma プリューファー群の自己準同型 {#grp:pruefer-endomorphisms keywords="the endomorphism ring of the Pruefer group is uncountable (p-adic integers)" index="プリューファー群の自己準同型|ぷりゅーふぁーぐんのじこじゅんどうけい"}
$\mathrm{End}(\Z(p^{\infty}))$ は非可算である。
:::

::: proof
**Step 1（構成）.** 数字の列 $d=(d_{0},d_{1},\dots)$（$0\le d_{i}<p$）について $c_{n}\defeq\sum_{i<n}d_{i}p^{i}$ とし、$f_{d}(b_{n})\defeq c_{n}b_{n}$ とおく。$\ang{b_{n}}$ 上では $f_{d}$ は $c_{n}$ 倍という準同型で、$\ang{b_{n}}\subseteq\ang{b_{n+1}}$ 上で両立する：$c_{n+1}b_{n}=c_{n}b_{n}+d_{n}p^{n}b_{n}=c_{n}b_{n}$（$p^{n}b_{n}=0$）なので、$b_{n}=pb_{n+1}$ について $c_{n+1}b_{n}=pc_{n+1}b_{n+1}$ と $c_{n}b_{n}$ が一致する。$\Z(p^{\infty})=\bigcup_{n}\ang{b_{n}}$ なので、$f_{d}$ は自己準同型に延長される。

**Step 2（相異なる）.** $d\neq d'$ で、最初に異なる添字を $i$ とすると、$c_{i+1}-c'_{i+1}=(d_{i}-d'_{i})p^{i}$ は $p^{i+1}$ で割れないので $f_{d}(b_{i+1})\neq f_{d'}(b_{i+1})$。数字の列は $p^{\aleph_{0}}=2^{\aleph_{0}}$ 個ある。
:::

## ホワイトヘッド群 {#grp:sec-ew-whitehead}

::: definition ホワイトヘッド群 {#grp:whitehead-group keywords="Whitehead group: Ext(A,Z)=0, every extension of Z by A splits" index="ホワイトヘッド群|ほわいとへっどぐん, W 群|だぶりゅーぐん"}
アーベル群 $A$ が**ホワイトヘッド群**（**W 群**）であるとは、$\mathrm{Ext}(A,\Z)=0$、すなわち全射準同型 $E\to A$ で核が $\Z$ と同型なものがつねに分裂する（\ref{ha:ext1-splitting}）ことをいう。
:::

::: intuition
自由アーベル群は、どんな全射の上にも持ち上がる（射影的）ので W 群である。W 群は「核が $\Z$ の全射に限って」持ち上がる群で、自由性を弱めた条件である。ホワイトヘッドの問題は、この弱めた条件がもとの自由性と同値かどうかを問う。
:::

::: theorem ホワイトヘッド群の基本性質 {#grp:whitehead-basic keywords="free groups are Whitehead; subgroups of Whitehead groups are Whitehead; Whitehead groups are torsion-free; Whitehead groups of rank one are infinite cyclic" index="ホワイトヘッド群の性質|ほわいとへっどぐんのせいしつ"}
1. 自由アーベル群は W 群である。
2. W 群の部分群は W 群である。
3. W 群は捩れのない群である。
4. 階数 $1$ の W 群は $\Z$ と同型である。とくに $\mathbb{Q}$, $\Z[1/2]$ は W 群でない。
:::

::: proof
**Step 1（1, 2）.** 1 は \ref{grp:ext-abelian-basic.1}。$A'\le A$ なら $\mathrm{Ext}(A,\Z)\to\mathrm{Ext}(A',\Z)$ は全射（\ref{grp:ext-abelian-basic.3}）なので、$\mathrm{Ext}(A,\Z)=0$ なら $\mathrm{Ext}(A',\Z)=0$。

**Step 2（3）.** $A$ が位数 $n\ge2$ の元をもてば、部分群 $\Z/n$ について $\mathrm{Ext}(\Z/n,\Z)\cong\Z/n\neq0$（\ref{grp:ext-abelian-basic.2}）で、2 に反する。

**Step 3（4 の準備）.** $A$ を階数 $1$ の W 群とする。3 から捩れがなく、$\mathbb{Q}$ の部分群と同型（\ref{grp:torsion-free-rank} の後の例）なので $A\le\mathbb{Q}$ としてよい。$A$ が巡回群でないとして矛盾を導く。$A$ の有限生成部分群は巡回群（\ref{grp:prob-tf-subgroup-q}）なので、$A$ は有限生成でない。$0\neq a\in A$ を固定し $C\defeq\ang{a}\cong\Z$ とおく。

**Step 4（$\mathrm{Hom}(A,\Z)=0$）.** $A$ は可算なので、有限生成部分群の増大列 $\ang{a}=\ang{a'_{0}}\subseteq\ang{a'_{1}}\subseteq\cdots$（各 $\ang{a'_{k}}$ は巡回群）で和が $A$ のものがあり、$A$ は有限生成でないので真に増える段が無限にある。$a=n_{k}a'_{k}$ と書くと、真に増えるたびに $\lvert n_{k}\rvert$ は $2$ 倍以上になる（$a'_{k}=ca'_{k+1}$, $\lvert c\rvert\ge2$）ので非有界。$f\colon A\to\Z$ について $f(a)=n_{k}f(a'_{k})$ はすべての $n_{k}$ で割り切れるので $f(a)=0$。$x\in A$ には $mx=na$（$m\neq0$）があるので $mf(x)=0$、$f(x)=0$。

**Step 5（$A/C$ は無限な捩れ群）.** $A$ は階数 $1$ なので $A/C$ は捩れ群。有限（位数 $m$）なら $mA\subseteq C$ で、$x\mapsto mx$ は単射なので $A\cong mA\le C\cong\Z$ となり、$A$ は巡回群で矛盾。$A/C\le\mathbb{Q}/C\cong\mathbb{Q}/\Z$（$\mathbb{Q}=\mathbb{Q}a$ なので $qa\mapsto q$）。

**Step 6（$\mathrm{Hom}(A/C,\mathbb{Q}/\Z)$ は非可算）.** $X\defeq A/C=\bigoplus_{p}X_{p}$（準素分解）で、$X_{p}\le\Z(p^{\infty})$ は有限巡回群か $\Z(p^{\infty})$ 自身（\ref{grp:pruefer-properties.2}）。直和の普遍性から $\mathrm{Hom}(X,\mathbb{Q}/\Z)\cong\prod_{p}\mathrm{Hom}(X_{p},\mathbb{Q}/\Z)$。$X$ は無限なので、(i) $X_{p}\neq0$ となる $p$ が無限個あるか、(ii) ある $X_{p}=\Z(p^{\infty})$ である。(i) では、各 $X_{p}\neq0$ について包含 $X_{p}\to\mathbb{Q}/\Z$ と $0$ の二つを選べるので、$\prod_{p}$ は $2^{\aleph_{0}}$ 個以上の元をもつ。(ii) では、$\mathrm{Hom}(\Z(p^{\infty}),\mathbb{Q}/\Z)\supseteq\mathrm{End}(\Z(p^{\infty}))$ は非可算（\ref{grp:pruefer-endomorphisms}）。

**Step 7（矛盾）.** $0\to C\to A\to A/C\to0$ の長完全列（\ref{ha:ext-long-exact.2}）
$$
\mathrm{Hom}(A,\Z)\to\mathrm{Hom}(C,\Z)\to\mathrm{Ext}(A/C,\Z)\to\mathrm{Ext}(A,\Z)
$$
で、左端は $0$（Step 4）、$\mathrm{Hom}(C,\Z)\cong\Z$ は可算、$\mathrm{Ext}(A/C,\Z)\cong\mathrm{Hom}(A/C,\mathbb{Q}/\Z)$（\ref{grp:ext-abelian-basic.4}）は非可算（Step 6）。完全性から $\mathrm{Ext}(A,\Z)$ は非可算な群を可算な部分群で割ったものを含み、$0$ でない。$A$ が W 群であることに反する。

::: hypcheck
- **Step 4 の可算性**：$A\le\mathbb{Q}$ は可算なので、有限生成部分群の増大列で尽くせた。
- **Step 3 の捩れのなさ**：3 を使って $A\le\mathbb{Q}$ とした。
- この定理は、階数 $1$ の場合に「W 群なら自由」を示している。有限階数・可算の場合への一般化は \ref{grp:fact-stein}。
:::
:::

::: fact シュタインの定理 {#grp:fact-stein keywords="Stein's theorem: countable Whitehead groups are free" index="シュタインの定理|しゅたいんのていり"}
可算な W 群は自由である。したがって、W 群の可算部分群はすべて自由である（W 群の部分群は W 群：\ref{grp:whitehead-basic.2}）（K. Stein による。出典：P. C. Eklof, A. H. Mekler, *Almost Free Modules*）。
:::

## ホワイトヘッドの問題の独立性 {#grp:sec-ew-independence}

::: fact シェラハの独立性定理 {#grp:fact-shelah keywords="Shelah: Whitehead's problem is independent of ZFC; V=L implies every Whitehead group is free; MA + not CH implies there is a non-free Whitehead group of cardinality aleph_1" index="ホワイトヘッドの問題|ほわいとへっどのもんだい, シェラハの定理|しぇらはのていり"}
（S. Shelah, 1974。出典：P. C. Eklof, A. H. Mekler, *Almost Free Modules*）
1. 構成可能性公理 $V=L$（\ref{set:axiom-v-eq-l}）のもとで、すべての W 群は自由である。
2. マーティンの公理（\ref{set:ma}）と $\neg\mathrm{CH}$ のもとで、濃度 $\aleph_{1}$ の W 群で自由でないものがある。

$\ZFC$ が無矛盾なら $\ZFC+V=L$（\ref{set:page-zf-in-l}）も $\ZFC+\mathrm{MA}+\neg\mathrm{CH}$（\ref{set:page-ma-consistency}）も無矛盾なので、「すべての W 群は自由か」という問い（ホワイトヘッドの問題）は $\ZFC$ から独立である。
:::

::: intuition
濃度 $\aleph_{1}$ の群 $A$ を、可算部分群の連続な増大列 $A_{0}\subseteq A_{1}\subseteq\cdots$（長さ $\omega_{1}$）で尽くす。W 群の可算部分群は自由（\ref{grp:fact-stein}）なので、問題は「各段の自由な群をどう貼り合わせるか」にある。$V=L$ のもとでは、◇ 型の原理（\ref{set:page-diamond-in-l}）が「ある段で貼り合わせに失敗する群は、どこかで $\Z$ による分裂しない拡大を作れる」ことを保証し、W 群でありながら自由でない群を排除する。逆に $\mathrm{MA}+\neg\mathrm{CH}$ は「可算な条件の $\aleph_{1}$ 個の組をすべて満たす解がある」という形の原理で、どんな拡大の分裂も構成できてしまうので、自由でない W 群が作れる。代数の問題の答えが、集合論の公理（ここでは組合せ論的な原理）で決まる代表的な例である。
:::

::: supplement
**$\mathrm{Ext}(A,\Z)$ の構造.** 捩れのない群 $A$ について $\mathrm{Ext}(A,\Z)$ は可除群である：$n$ 倍 $A\to A$ は単射で、余核を $A/nA$ とすると、\ref{grp:ext-abelian-basic.3} と同じ長完全列から、$\mathrm{Ext}(A,\Z)$ 上の $n$ 倍は全射になる。したがって $\mathrm{Ext}(A,\Z)$ は構造定理（\ref{grp:divisible-structure}）の不変量で記述でき、自由でない $A$ についてこの不変量を決める問題にも集合論的な独立性が現れることが知られている。たとえば $\mathrm{Ext}(\mathbb{Q},\Z)$ は非可算（\ref{grp:prob-ew-ext-q}）で、実際には $\R$ と同型であることが知られている。
:::

## 問題 {#grp:sec-ew-problems}

::: problem {#grp:prob-ew-ext-q}
\ref{grp:ext-abelian-basic} と \ref{grp:whitehead-basic} の証明を使って、$\mathrm{Ext}(\mathbb{Q},\Z)\neq0$ を直接示せ。さらに $\mathrm{Ext}(\mathbb{Q},\Z)$ が非可算であることを示せ。
:::

::: solution
$0\to\Z\to\mathbb{Q}\to\mathbb{Q}/\Z\to0$（$\Z=\ang{1}$）に第一変数の長完全列を適用すると、$\mathrm{Hom}(\mathbb{Q},\Z)\to\mathrm{Hom}(\Z,\Z)\to\mathrm{Ext}(\mathbb{Q}/\Z,\Z)\to\mathrm{Ext}(\mathbb{Q},\Z)\to\mathrm{Ext}(\Z,\Z)=0$。$\mathrm{Hom}(\mathbb{Q},\Z)=0$（\ref{grp:prob-tf-hom-q-z}）、$\mathrm{Hom}(\Z,\Z)\cong\Z$。$\mathrm{Ext}(\mathbb{Q}/\Z,\Z)\cong\mathrm{Hom}(\mathbb{Q}/\Z,\mathbb{Q}/\Z)\cong\prod_{p}\mathrm{End}(\Z(p^{\infty}))$ は非可算（\ref{grp:pruefer-endomorphisms}）。よって $\mathrm{Ext}(\mathbb{Q},\Z)$ は非可算な群の可算な部分群による剰余と同型で、非可算。
:::

::: problem {#grp:prob-ew-direct-sum}
W 群の直和は W 群であることを示せ（ヒント：$\mathrm{Hom}(\bigoplus_{i}A_{i},-)\cong\prod_{i}\mathrm{Hom}(A_{i},-)$ と拡大の分裂の言い換えを使う）。
:::

::: solution
拡大 $0\to\Z\to E\xrightarrow{q}\bigoplus_{i}A_{i}\to0$ について、各 $A_{i}$ の逆像 $E_{i}\defeq q^{-1}(A_{i})$ は $0\to\Z\to E_{i}\to A_{i}\to0$ を与え、$A_{i}$ が W 群なので切断 $s_{i}\colon A_{i}\to E_{i}\subseteq E$（$q\circ s_{i}=1$）がある。直和の普遍性から $s\defeq(s_{i})\colon\bigoplus A_{i}\to E$ が定まり、$q\circ s=1$。よって拡大は分裂する。
:::
