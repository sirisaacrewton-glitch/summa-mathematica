# 無限アーベル群（Infinite Abelian Groups）

自由アーベル群とその部分群、射影性、捩れ部分群、有限生成アーベル群（群論の側からの証明）、可除群と入射性・構造定理・プリューファー群、捩れのない群の階数と型・ベールの分類・ポントリャーギンの判定法・ベール–シュペッカーの定理、純部分群と基本部分群・有界な群の構造・クリコフの判定法、拡大と Ext・ホワイトヘッドの問題（Robinson 第 4 章を参考）。
