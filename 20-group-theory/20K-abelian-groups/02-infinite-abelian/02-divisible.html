# 可除群 {#grp:page-divisible keywords="divisible abelian group, Pruefer group Z(p^infinity), quasicyclic group, injective abelian group, divisible subgroups are direct summands (Baer), maximal divisible subgroup, reduced group, structure of divisible groups"}

アーベル群 $G$ が**可除**であるとは、どの元もどの正の整数でも「割り切れる」ことをいう。$\mathbb{Q}$, $\mathbb{Q}/\Z$, $\R$ などがその例である。可除群は、自由アーベル群（\ref{grp:page-free-abelian}）と双対的な位置にある：自由アーベル群が射影対象であるのに対し、可除群は入射対象である（\ref{ha:injective-divisible}）。このページでは、可除な部分群がつねに直和因子になること（\ref{grp:divisible-summand}）を示し、それを使って可除群を完全に分類する（\ref{grp:divisible-structure}）：可除群は $\mathbb{Q}$ のいくつかの写しと、プリューファー群 $\Z(p^{\infty})$ のいくつかの写しの直和である。

> 資料：D. J. S. Robinson, *A Course in the Theory of Groups* §4.1 を参考にした。

## 記法と定義の確認 {#grp:sec-div-notation}

::: notation
- アーベル群の記法と直和は前ページ（\ref{grp:sec-fab-notation}）、捩れ部分群 $T(G)$ と準素成分 $G_{p}$ は \ref{grp:torsion-subgroup}, \ref{grp:torsion-primary-decomposition}。
- 入射加群は \ref{mod:injective}。
- $\ZFC$ の中で議論する。選択公理を使う箇所は明記する。
:::

## 可除群とプリューファー群 {#grp:sec-div-def}

::: definition 可除群 {#grp:divisible keywords="divisible abelian group, reduced abelian group" index="可除群|かじょぐん, 被約なアーベル群|ひやくなあーべるぐん"}
アーベル群 $G$ が**可除**であるとは、任意の $g\in G$ と正の整数 $n$ について、$nx=g$ となる $x\in G$ があること、すなわち $nG=G$（すべての $n\ge1$）であることをいう。$0$ 以外の可除な部分群をもたない群を**被約**という。
:::

::: example
1. $\mathbb{Q}$, $\R$, $\C$ は可除。$\Z$ は可除でない（$1=2x$ は解をもたない）。有限アーベル群 $G\neq0$ は可除でない（$\abs{G}G=0\neq G$）。
2. 可除群の商群は可除（\ref{ha:injective-divisible.2}）。とくに $\mathbb{Q}/\Z$, $\R/\Z$ は可除。
3. 可除群の直和・直積は可除（\ref{ha:injective-divisible.3}）。
4. 自由アーベル群 $F\neq0$ は被約である：可除な部分群 $D\neq0$ があれば、$0\neq d\in D$ は任意の $2^{k}$ で割れるが、$d$ の基底による表示の係数が $2^{k}$ で割れ続けることはない。
:::

::: definition プリューファー群 {#grp:pruefer-group keywords="Pruefer p-group Z(p^infinity), quasicyclic group" index="プリューファー群|ぷりゅーふぁーぐん, 準巡回群|じゅんじゅんかいぐん"}
素数 $p$ について、$\mathbb{Q}/\Z$ の $p$ 準素成分
$$
\Z(p^{\infty})\defeq\{m/p^{k}+\Z:\ m\in\Z,\ k\ge0\}
$$
を**プリューファー群**（$p^{\infty}$ 型の群、**準巡回群**）という。
:::

::: proposition プリューファー群の性質 {#grp:pruefer-properties keywords="Z(p^infinity) is divisible; its proper subgroups are the finite cyclic groups <1/p^n>; Q/Z is the direct sum of the Pruefer groups" index="プリューファー群の部分群|ぷりゅーふぁーぐんのぶぶんぐん"}
$P\defeq\Z(p^{\infty})$、$b_{n}\defeq1/p^{n}+\Z$ とする。
1. $P=\bigcup_{n}\ang{b_{n}}$、$\ang{b_{n}}\cong\Z/p^{n}$、$pb_{n+1}=b_{n}$。
2. $P$ の真部分群は $\ang{b_{n}}$（$n\ge0$）だけで、どれも有限巡回群である。
3. $P$ は可除である。
4. $\mathbb{Q}/\Z=\bigoplus_{p}\Z(p^{\infty})$。
:::

::: proof
**Step 1（1）.** $m/p^{k}+\Z=mb_{k}$ なので和集合。$b_{n}$ の位数は $p^{n}$（$jb_{n}=0\iff p^{n}\mid j$）。$pb_{n+1}=b_{n}$ は定義から。

**Step 2（2）.** $H\le P$ とする。$H$ に属する $b_{n}$ の倍数の位数に上限がなければ、各 $n$ について $H$ は位数 $p^{k}\ge p^{n}$ の元 $x$ を含む。$x\in\ang{b_{k}}$ で位数 $p^{k}$ なので $x$ は巡回群 $\ang{b_{k}}$ を生成し（\ref{grp:subgroups-cyclic.2}：位数 $p^{k}$ の部分群はただ一つ）、$b_{n}\in\ang{b_{k}}=\ang{x}\subseteq H$。よって $H=P$。上限 $p^{n}$ があれば、$H$ の元はすべて $P[p^{n}]=\ang{b_{n}}$ に入り（$P[p^{n}]$ の元 $m/p^{k}+\Z$ は $p^{n}m/p^{k}\in\Z$、すなわち $\ang{b_{n}}$ の元）、$H$ は巡回群 $\ang{b_{n}}$ の部分群なので $\ang{b_{j}}$（$j\le n$）の形（\ref{grp:subgroups-cyclic}）。

**Step 3（3）.** 可除群 $\mathbb{Q}/\Z$ の準素成分は可除：$x\in P$, $n=p^{a}n'$（$p\nmid n'$）とする。$n'$ は $P$ 上で全単射（$\ang{b_{k}}$ 上で $n'$ 倍は位数と互いに素なので単射、有限集合上で全射）で、$p^{a}b_{k+a}=b_{k}$ から $p^{a}$ 倍は全射。

**Step 4（4）.** $\mathbb{Q}/\Z$ は捩れ群（$n(m/n+\Z)=0$）なので、\ref{grp:torsion-primary-decomposition} からその準素成分の直和。
:::

## 入射性と直和因子 {#grp:sec-div-injective}

::: theorem 可除な部分群は直和因子（ベール） {#grp:divisible-summand keywords="Baer: a divisible subgroup of an abelian group is a direct summand" index="可除部分群の直和因子性|かじょぶぶんぐんのちょくわいんしせい"}
（AC）アーベル群 $G$ の可除な部分群 $D$ について、$G=D\oplus E$ となる部分群 $E$ がある。
:::

::: proof
**Step 1.** $D$ は可除なので入射的（\ref{ha:injective-divisible.1}。証明にツォルンの補題を使う）。包含 $\iota\colon D\to G$ は単射なので、恒等写像 $1_{D}\colon D\to D$ は $\beta\circ\iota=1_{D}$ となる準同型 $\beta\colon G\to D$ に延長される。

**Step 2.** $E\defeq\Ker\beta$ とする。$g\in G$ について $\beta(g-\beta(g))=\beta(g)-\beta(g)=0$（$\beta(g)\in D$ で $\beta$ は $D$ 上で恒等）なので $g=\beta(g)+(g-\beta(g))\in D+E$。$d\in D\cap E$ なら $d=\beta(d)=0$。

::: hypcheck
- **「可除」**：外すと偽：$2\Z\le\Z$ は直和因子でない（\ref{grp:free-quotient-splits} の後の例）。
- **選択公理**：入射性の証明（ベールの判定法）でツォルンの補題を使う。
:::
:::

::: proposition 最大の可除部分群 {#grp:maximal-divisible keywords="every abelian group has a largest divisible subgroup D and G = D + reduced" index="最大可除部分群|さいだいかじょぶぶんぐん"}
アーベル群 $G$ の可除な部分群すべてで生成された部分群 $D(G)$ は可除で、$G$ の最大の可除部分群である。（AC）$G=D(G)\oplus R$ となる被約な部分群 $R$ がある。
:::

::: proof
**Step 1（可除）.** $x\in D(G)$ は、可除な部分群 $D_{1},\dots,D_{k}$ の元の和 $x=d_{1}+\cdots+d_{k}$ で、$d_{i}=ny_{i}$（$y_{i}\in D_{i}$）とすると $x=n(y_{1}+\cdots+y_{k})$。最大性は定義から。

**Step 2（分解）.** \ref{grp:divisible-summand} から $G=D(G)\oplus R$。$R$ の可除な部分群 $D'$ は $G$ の可除部分群なので $D'\subseteq D(G)\cap R=0$。
:::

## 可除群の構造 {#grp:sec-div-structure}

::: lemma 捩れのない可除群はベクトル空間 {#grp:torsion-free-divisible-vector-space keywords="a torsion-free divisible abelian group is a rational vector space" index="捩れのない可除群|ねじれのないかじょぐん"}
捩れのない可除群 $V$ は、$\frac{m}{n}\cdot v\defeq$（$nx=mv$ のただ一つの解 $x$）によって $\mathbb{Q}$ 上のベクトル空間になり、その加法はもとの群の加法である。
:::

::: proof
**Step 1（well-defined）.** 可除性から $nx=mv$ の解はあり、$nx=nx'$ なら $n(x-x')=0$ で、捩れがないので $x=x'$。分数の表し方によらない：$\frac{m}{n}=\frac{m'}{n'}$（$mn'=m'n$）で $nx=mv$, $n'x'=m'v$ なら $nn'x=n'mv=nm'v=nn'x'$ で $x=x'$。

**Step 2（公理）.** スカラー倍の分配法則・結合法則は、両辺に分母の積を掛けて整数倍の等式に帰着させ、Step 1 の一意性を使えば確かめられる。たとえば $\frac{m}{n}(v+w)$ は $n(x+y)=m(v+w)$（$nx=mv$, $ny=mw$）の解なので $\frac{m}{n}v+\frac{m}{n}w$ に等しい。
:::

::: theorem 可除群の構造定理 {#grp:divisible-structure keywords="structure theorem for divisible abelian groups: direct sums of copies of Q and Pruefer groups, with invariants determined by the group" index="可除群の構造定理|かじょぐんのこうぞうていり" refname="可除群の構造定理"}
（AC）アーベル群 $G$ が可除であることと、ある集合 $I$, $J_{p}$（$p$ は素数）について
$$
G\cong\mathbb{Q}^{(I)}\oplus\bigoplus_{p}\Z(p^{\infty})^{(J_{p})}
$$
となることは同値である。このとき $\lvert J_{p}\rvert$ は $G[p]$ の $\mathbb{F}_{p}$ 上の次元、$\lvert I\rvert$ は $G/T(G)$ の $\mathbb{Q}$ 上の次元に等しく、したがって $G$ の同型類だけで決まる。
:::

::: proof
**Step 1（⇐）.** $\mathbb{Q}$ と $\Z(p^{\infty})$ は可除（\ref{grp:pruefer-properties.3}）で、直和は可除。

**Step 2（捩れ部分の切り出し）.** $G$ を可除とする。$T\defeq T(G)$ は可除：$x\in T$, $n\ge1$ について $ny=x$ となる $y\in G$ があり、$mx=0$ なら $mny=0$ で $y\in T$。\ref{grp:divisible-summand} から $G=T\oplus V$, $V\cong G/T$ は捩れがなく、可除（可除群の商）。$T=\bigoplus_{p}G_{p}$（\ref{grp:torsion-primary-decomposition}）で、各 $G_{p}$ は $T$ の直和因子なので可除（$x\in G_{p}$ を $ny=x$, $y=\sum y_{q}$ と準素成分に分けると、成分を比べて $ny_{p}=x$）。

**Step 3（捩れのない部分）.** $V$ は $\mathbb{Q}$ ベクトル空間（\ref{grp:torsion-free-divisible-vector-space}）なので基底 $I$ をもち（\ref{lin:basis-existence.2}。AC）、$V\cong\mathbb{Q}^{(I)}$。

**Step 4（$p$ 群の部分）.** $G_{p}$ を可除な $p$ 群とする。$G_{p}[p]$ は $\mathbb{F}_{p}$ 上のベクトル空間（$(n+p\Z)x\defeq nx$）で、基底 $J_{p}$ をとる（AC）。$Q\defeq\Z(p^{\infty})^{(J_{p})}$ とし、$c_{j}$ を第 $j$ 成分の $b_{1}$（位数 $p$）とすると、$Q[p]$ は $\{c_{j}\}$ を基底とする $\mathbb{F}_{p}$ ベクトル空間（\ref{grp:pruefer-properties.2} から $\Z(p^{\infty})[p]=\ang{b_{1}}$）。$c_{j}\mapsto j$ で同型 $\alpha\colon Q[p]\to G_{p}[p]$ が定まる。$G_{p}$ は可除なので入射的で、$\alpha$ は準同型 $\beta\colon Q\to G_{p}$ に延長される。
- **単射**：$\Ker\beta\neq0$ なら、$\Ker\beta$ は $p$ 群の自明でない部分群なので位数 $p$ の元を含み（位数 $p^{k}$ の元の $p^{k-1}$ 倍）、それは $Q[p]$ の $0$ でない元で $\alpha$ で消える。矛盾。
- **全射**：$\beta[Q]$ は可除（可除群の像）なので $G_{p}$ の直和因子：$G_{p}=\beta[Q]\oplus E$（\ref{grp:divisible-summand}）。$E\neq0$ なら $E$ は位数 $p$ の元 $e$ を含むが、$e\in G_{p}[p]=\alpha[Q[p]]\subseteq\beta[Q]$ となり $\beta[Q]\cap E\neq0$。矛盾。

よって $G_{p}\cong Q$。

**Step 5（不変量）.** $G\cong\mathbb{Q}^{(I)}\oplus\bigoplus_{p}\Z(p^{\infty})^{(J_{p})}$ とすると、$G[p]\cong\Z(p^{\infty})[p]^{(J_{p})}\cong\mathbb{F}_{p}^{(J_{p})}$ なので $\lvert J_{p}\rvert=\dim_{\mathbb{F}_{p}}G[p]$、$G/T(G)\cong\mathbb{Q}^{(I)}$ なので $\lvert I\rvert=\dim_{\mathbb{Q}}G/T(G)$。次元は基底のとり方によらない（\ref{mod:vector-space-dimension}）。

::: hypcheck
- **選択公理**：Step 2, 4 の直和因子（入射性）、Step 3, 4 の基底の存在で使った。
- **Step 4 の「$p$ 群」**：位数 $p$ の元の存在に使った。
- **可除性**：Step 4 で $\beta$ の延長と、像が直和因子であることの二か所で使った。
:::
:::

::: corollary 可除群の部分群・剰余群・埋め込み {#grp:divisible-embedding keywords="every abelian group embeds in a divisible group; torsion-free groups embed in rational vector spaces; p-groups embed in direct sums of Pruefer groups" index="可除群への埋め込み（アーベル群）|かじょぐんへのうめこみあーべるぐん"}
1. 任意のアーベル群は可除群の部分群と同型である（\ref{ha:embed-divisible}）。
2. （AC）捩れのないアーベル群は $\mathbb{Q}$ ベクトル空間の部分群と同型であり、アーベル $p$ 群は $\Z(p^{\infty})^{(J)}$ の部分群と同型である。
:::

::: proof
**Step 1（2 の捩れのない場合）.** 1 で $G\le D$（$D$ 可除）とする。$D=T(D)\oplus V$（構造定理の Step 2）で、$G\cap T(D)=0$（$G$ は捩れがない）なので、射影 $D\to V$ の $G$ への制限は単射で、$V$ は $\mathbb{Q}$ ベクトル空間。

**Step 2（$p$ 群の場合）.** $G\le D$ とすると $G\subseteq T(D)$、さらに $G\subseteq D_{p}$（準素成分）。$D_{p}$ は可除な $p$ 群なので構造定理の Step 4 から $\Z(p^{\infty})^{(J)}$ と同型。
:::

::: supplement
**有限生成アーベル群との双対性.** 有限生成アーベル群は $\Z$ と $\Z/p^{k}$ の有限直和だった（\ref{grp:fg-abelian-structure}）。可除群は $\mathbb{Q}$ と $\Z(p^{\infty})$ の（無限個でもよい）直和である。$\Z(p^{\infty})$ は「$\Z/p^{k}$ を $k\to\infty$ で貼り合わせた」群で（$\ang{b_{1}}\subset\ang{b_{2}}\subset\cdots$）、ポントリャーギン双対では $p$ 進整数環 $\Z_{p}$ と対応する。

**最小条件.** 部分群の降鎖条件をみたすアーベル群は、有限個のプリューファー群と有限巡回群の直和であることが知られている（クロシュの定理。出典：Robinson §4.2）。
:::

## 問題 {#grp:sec-div-problems}

::: problem {#grp:prob-div-reals}
（AC）$\R\cong\mathbb{Q}^{(I)}$（$\lvert I\rvert=2^{\aleph_{0}}$）と、$\C^{\times}\cong\mathbb{Q}/\Z\oplus\mathbb{Q}^{(I)}$ を示せ。とくに加法群 $\R$ と $\C$ は（群として）同型である。
:::

::: solution
$\R$ は捩れのない可除群なので $\mathbb{Q}$ ベクトル空間で、基底 $I$ について $\R\cong\mathbb{Q}^{(I)}$。$\lvert\mathbb{Q}^{(I)}\rvert=\lvert I\rvert$（$I$ 無限）なので $\lvert I\rvert=2^{\aleph_{0}}$。$\C\cong\R^{2}$ も同じ次元。$\C^{\times}$ は可除（$z=re^{i\theta}$ の $n$ 乗根 $r^{1/n}e^{i\theta/n}$）。捩れ部分群は 1 の冪根の全体で、$\exp(2\pi i\,\cdot)$ から $\mathbb{Q}/\Z$ と同型、$\C^{\times}[p]$ は $p$ 次の 1 の冪根で位数 $p$ なので $J_{p}$ は一点。$\C^{\times}/T\cong$ 捩れのない可除群で、濃度 $2^{\aleph_{0}}$ なので次元は $2^{\aleph_{0}}$。構造定理から主張が従う。
:::

::: problem {#grp:prob-div-infinite-proper}
無限アーベル群 $G$ で、真部分群がすべて有限なものは、ある素数 $p$ について $\Z(p^{\infty})$ と同型であることを示せ。
:::

::: solution
$G$ は捩れ群：$x$ が位数無限なら $\ang{2x}$ は無限の真部分群（$x\notin\ang{2x}$）。$G=\bigoplus_{p}G_{p}$ で、二つ以上の $G_{p}$ が $0$ でなければ、その一方が真部分群なので有限、他方の和も真部分群なので有限となり、$G$ が有限で矛盾。よって $G$ は $p$ 群。$G\neq pG$ なら、$pG$ は真部分群で有限、$G/G[p]\cong pG$ から $G[p]$ が無限。無限部分群 $G[p]$ は真部分群でないので $G=G[p]$ となり、$G$ のどの元も位数 $p$ 以下。$G$ は有限生成でない（有限生成なら $\abs{G}\le p^{k}$）ので、$x_{n+1}\notin\ang{x_{1},\dots,x_{n}}$ となる元を順に選べ（DC）、$\mathbb{F}_{p}$ ベクトル空間 $G$ の中で $\{x_{n}\}$ は一次独立になる。すると $\ang{x_{2},x_{3},\dots}$ は $x_{1}$ を含まない無限の真部分群で、矛盾。よって $G=pG$、すなわち $G$ は可除な $p$ 群で、（AC）構造定理から $\Z(p^{\infty})^{(J)}$ と同型。$\lvert J\rvert\ge2$ なら一つの直和因子が無限の真部分群になるので $\lvert J\rvert=1$。
:::
