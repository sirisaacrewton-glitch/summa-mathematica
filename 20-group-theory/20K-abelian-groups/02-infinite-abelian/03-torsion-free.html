# 捩れのないアーベル群 {#grp:page-torsion-free keywords="torsion-free abelian group, rank, height, type, Baer's classification of rank one groups, subgroups of Q, indecomposable torsion-free group of rank two, Pontryagin's criterion, Baer-Specker group Z^N is not free, Specker's theorem, countable subgroups of Z^N are free"}

捩れのないアーベル群は、$\mathbb{Q}$ ベクトル空間の部分群と同じものである（\ref{grp:divisible-embedding}）。それでも構造は複雑で、捩れ群や有限生成アーベル群のような完全な分類は、階数 1 の場合（\ref{grp:baer-rank-one}）を除いて知られていない。このページでは、元の「どの素数でどこまで割れるか」を記録する**高さ**と**型**を導入して階数 1 の群を分類し、階数 2 ですでに直和分解できない群が現れること（\ref{grp:indecomposable-rank-two}）を見る。後半では自由性の判定を扱う：可算な群については、有限階数の部分群がすべて自由なら自由である（ポントリャーギン、\tref{grp:pontryagin-criterion}）。しかし非可算な群では成り立たない：$\Z^{\N}$ は自由でない（\ref{grp:baer-specker}）が、その可算部分群はすべて自由である（\ref{grp:specker-countable}）。

> 資料：D. J. S. Robinson, *A Course in the Theory of Groups* §4.2, §4.4 を参考にした。ポントリャーギンの判定法は純化を使う形に組み直した。

## 記法と定義の確認 {#grp:sec-tf-notation}

::: notation
- 捩れ部分群 $T(G)$ は \ref{grp:torsion-subgroup}、自由アーベル群とその部分群は \ref{grp:free-abelian}, \ref{grp:subgroup-of-free-abelian}、有限生成アーベル群の構造は \ref{grp:fg-abelian-structure}、可除群への埋め込みは \ref{grp:divisible-embedding}。
- アーベル群の部分集合 $S$ が**一次独立**であるとは、$0\notin S$ で、相異なる $s_{1},\dots,s_{k}\in S$ と整数 $m_{i}$ について $\sum m_{i}s_{i}=0$ なら $m_{i}s_{i}=0$（すべての $i$）となることをいう。捩れのない群では「$m_{i}=0$」と同じ。
- $\Z^{\N}\defeq\prod_{n\in\N}\Z$（直積、**ベール–シュペッカー群**）、$\Z^{(\N)}=\bigoplus_{n}\Z$ はその部分群。
- $\ZFC$ の中で議論する。
:::

## 階数 {#grp:sec-tf-rank}

::: proposition 捩れのない群の階数 {#grp:torsion-free-rank keywords="torsion-free rank: all maximal independent subsets have the same cardinality" index="捩れのない階数|ねじれのないかいすう, 階数（アーベル群）|かいすうあーべるぐん"}
（AC）捩れのないアーベル群 $G$ の極大な一次独立部分集合（ツォルンの補題で存在する）は、すべて同じ濃度をもつ。この濃度を $G$ の**階数** $r(G)$ という。$G$ が $\mathbb{Q}$ ベクトル空間 $V$ の部分群なら、$r(G)$ は $G$ が張る\term[部分空間]{lin:vector-space} $\mathbb{Q}G$ の次元に等しい。
:::

::: proof
**Step 1（埋め込み）.** \ref{grp:divisible-embedding.2} から $G\le V$（$V$ は $\mathbb{Q}$ ベクトル空間）としてよい。$W\defeq\mathbb{Q}G$ は $G$ の元の有理数係数の一次結合の全体で、$w\in W$ には $nw\in G$ となる $n\ge1$ がある（分母を払う）。

**Step 2（一次独立性の一致）.** $S\subseteq G$ が $\Z$ 上一次独立 $\iff$ $\mathbb{Q}$ 上一次独立：有理数係数の関係は分母を払うと整数係数の関係になる。

**Step 3（極大 ⇔ 基底）.** $S$ が $G$ の極大な一次独立部分集合なら、$g\in G$ について $S\cup\{g\}$ は従属なので、$mg\in\ang{S}$（$m\neq0$）となり $g\in\mathbb{Q}S$。よって $\mathbb{Q}S\supseteq G$ で、$\mathbb{Q}S=W$：$S$ は $W$ の基底。基底の濃度は一意（\ref{mod:vector-space-dimension}）。存在は、一次独立部分集合の鎖の和が一次独立であることから、\ref{set:zorn}で示せる。
:::

::: example
$r(\Z^{n})=n$、$r(\mathbb{Q})=1$、$r(\Z[1/2])=1$。$r(G)=0\iff G=0$。階数 $1$ の捩れのない群は、$\mathbb{Q}$ の $0$ でない部分群と同型である（$G\le V$ で $\mathbb{Q}G\cong\mathbb{Q}$）。階数は部分群と剰余群について加法的：$H\le G$ で $G$ が捩れのないとき、$r(G)=r(H)+r(G/H)$（$G/H$ の階数はその捩れのない部分 $\frac{G/H}{T(G/H)}$ の階数）であることが知られている（Robinson §4.2 演習）。
:::

## 高さと型 {#grp:sec-tf-type}

::: definition 高さと型 {#grp:height-type keywords="p-height, height vector (characteristic), type of an element, type of a rank one group" index="高さ（アーベル群）|たかさあーべるぐん, 型（アーベル群）|かたあーべるぐん, 特性|とくせい"}
$p_{1}<p_{2}<\cdots$ を素数の列とする。アーベル群 $G$ の元 $g$ について、
1. $g\in p^{k}G$ となる最大の $k\ge0$ を $g$ の **$p$ 高さ** $h_{p}(g)$ といい、すべての $k$ で $g\in p^{k}G$ なら $h_{p}(g)\defeq\infty$ とする。
2. 列 $\chi(g)\defeq(h_{p_{1}}(g),h_{p_{2}}(g),\dots)\in(\N\cup\{\infty\})^{\N}$ を $g$ の**高さ列**（特性）という。
3. 二つの列 $(h_{i})$, $(h'_{i})$ が**同値**であるとは、有限個を除くすべての $i$ で $h_{i}=h'_{i}$ で、$h_{i}\neq h'_{i}$ となる $i$ では $h_{i},h'_{i}$ がどちらも有限であることをいう。同値類を**型**といい、$\chi(g)$ の型を $g$ の型 $\mathbf{t}(g)$ と書く。
:::

::: lemma 階数 1 の群の型 {#grp:rank-one-type keywords="all nonzero elements of a torsion-free rank one group have the same type; dividing by p changes only the p-height" index="階数 1 の群の型|かいすういちのぐんのかた"}
$G$ を階数 $1$ の捩れのない群とする。
1. 素数 $p$ と $a\in G$, $k\ge0$ について、$a=p^{k}a'$ なら $h_{p}(a)=h_{p}(a')+k$ で、$q\neq p$ では $h_{q}(a)=h_{q}(a')$。
2. $G$ の $0$ でない元はすべて同じ型をもつ。これを $G$ の型 $\mathbf{t}(G)$ という。
:::

::: proof
**Step 1（1 の $q$ 高さ）.** $a'\in q^{j}G$ なら $a=p^{k}a'\in q^{j}G$。逆に $a=q^{j}z$ とする。$\gcd(p^{k},q^{j})=1$ なので $up^{k}+vq^{j}=1$ となる整数 $u,v$ があり、$a'=up^{k}a'+vq^{j}a'=uq^{j}z+vq^{j}a'=q^{j}(uz+va')\in q^{j}G$。

**Step 2（1 の $p$ 高さ）.** $a'\in p^{j}G$ なら $a\in p^{j+k}G$。逆に $a=p^{j+k}z$ なら $p^{k}(a'-p^{j}z)=0$ で、捩れがないので $a'=p^{j}z$。

**Step 3（2）.** $0\neq a,b\in G$ は従属なので $ma=nb$（$m,n\neq0$）。符号を調整して $m,n>0$ とし、$m$, $n$ を素因数分解すると、1 を素因数ごとに繰り返し使って、$\chi(ma)$ は $\chi(a)$ を $m$ の素因数のところで有限だけ増やした列、$\chi(nb)$ も同様。$ma=nb$ なので $\chi(a)$ と $\chi(b)$ は有限個の素数を除いて一致し、違うところでは有限値どうし（$\infty$ に有限を足しても $\infty$）。
:::

::: theorem ベールの分類定理 {#grp:baer-rank-one keywords="Baer: torsion-free abelian groups of rank one are classified by their type; every type occurs; there are continuum many" index="ベールの分類定理|べーるのぶんるいていり" refname="ベールの分類定理"}
1. 階数 $1$ の捩れのない二つの群 $G,H$ について、$G\cong H\iff\mathbf{t}(G)=\mathbf{t}(H)$。
2. どの型も、ある階数 $1$ の捩れのない群（$\mathbb{Q}$ の部分群）の型である。
3. 階数 $1$ の捩れのない群の同型類はちょうど $2^{\aleph_{0}}$ 個ある。
:::

::: proof
**Step 1（1 の ⇒）.** 同型は高さを保つので型も保つ。

**Step 2（高さ列をそろえる）.** $\mathbf{t}(G)=\mathbf{t}(H)$ とし、$0\neq a\in G$, $0\neq b\in H$ をとる。$\chi(a)$ と $\chi(b)$ が異なる素数 $p$ は有限個で、そこではどちらも有限。そのような各 $p$ で $a$ を $p^{h_{p}(a)}$ で、$b$ を $p^{h_{p}(b)}$ で割った元に置き換えると（\ref{grp:rank-one-type.1} から、他の素数の高さは変わらず、$p$ 高さは $0$ になる）、$\chi(a)=\chi(b)$ となる元 $a\in G$, $b\in H$ が得られる。

**Step 3（割り切れる条件の一致）.** \term[互いに素]{grp:gcd}な整数 $m\ge1$, $n$ について、$na\in mG\iff a\in mG$：$na=mz$ なら $um+vn=1$ として $a=uma+vna=m(ua+vz)$。また $a\in mG\iff$ $m$ を割る各素数冪 $p^{e}$ について $h_{p}(a)\ge e$：⇒ は明らか。⇐ は $m=\prod p_{i}^{e_{i}}$ とし、$a=p_{i}^{e_{i}}z_{i}$、$m_{i}\defeq m/p_{i}^{e_{i}}$、$\sum l_{i}m_{i}=1$ とすると $a=\sum l_{i}m_{i}a=\sum l_{i}m_{i}p_{i}^{e_{i}}z_{i}=m\sum l_{i}z_{i}$。$\chi(a)=\chi(b)$ なので、$na\in mG\iff nb\in mH$。

**Step 4（同型の構成）.** $x\in G$ について、$G$ は階数 $1$ なので $x$ と $a$ は従属で、$mx=na$（$(m,n)\neq(0,0)$）。$m=0$ なら $na=0$ から $n=0$ となるので $m\neq0$ で、符号を変えて $m\ge1$、さらに $\gcd(m,n)$ で割って（捩れがないので割った関係も成り立つ）$\gcd(m,n)=1$ としてよい。$na=mx\in mG$ なので、Step 3 から $nb\in mH$、すなわち $my=nb$ となる $y\in H$ があり、捩れがないので一意。$\varphi(x)\defeq y$ とおく。表し方によらない：$mx=na$, $m'x=n'a$ なら $m'na=m'mx=mn'a$ から $(m'n-mn')a=0$ で $m'n=mn'$。$my=nb$, $m'y'=n'b$ とすると $mm'y=m'nb=mn'b=mm'y'$ で、$y=y'$。$\varphi$ は準同型（$mx=na$, $m'x'=n'a$ なら $mm'(x+x')=(m'n+mn')a$ で、$H$ でも同じ関係）、$G$ と $H$ を入れ替えた写像が逆写像。

**Step 5（2）.** 高さ列 $h=(h_{i})$ について、$G_{h}\le\mathbb{Q}$ を $\{1/p_{i}^{j}:\ j\le h_{i}\text{（}j\text{ は有限）}\}$ で生成された部分群とする。$G_{h}$ の元は分母が $\prod p_{i}^{j_{i}}$（$j_{i}\le h_{i}$、有限個）の分数なので、$h_{i}$ が有限なら $1/p_{i}^{h_{i}+1}\notin G_{h}$、すなわち $h_{p_{i}}(1)=h_{i}$。$h_{i}=\infty$ なら $h_{p_{i}}(1)=\infty$。よって $\chi(1)=h$ で $\mathbf{t}(G_{h})$ は $h$ の型。

**Step 6（3）.** 素数の集合 $S$ ごとに、$S$ 上で $\infty$、他で $0$ の列の型は、$S$ が違えば異なる（$\infty$ の位置は同値で変わらない）ので、型は $2^{\aleph_{0}}$ 個以上。$\mathbb{Q}$ の部分群は $\mathbb{Q}$ の部分集合なので高々 $2^{\aleph_{0}}$ 個。1, 2 から同型類と型は一対一。
:::

::: example
$\mathbf{t}(\Z)$ は $(0,0,\dots)$ の型、$\mathbf{t}(\mathbb{Q})$ は $(\infty,\infty,\dots)$ の型、$\mathbf{t}(\Z[1/2])$ は $(\infty,0,0,\dots)$ の型。$\Z[1/6]$ と $\Z[1/2]$ は同型でない（$3$ 高さが $\infty$ と $0$）。$\frac13\Z$ と $\Z$ は同型（型が同じ：$3$ 高さが $1$ と $0$ で、有限の差）。
:::

## 直和分解できない階数 2 の群 {#grp:sec-tf-indecomposable}

::: theorem 階数 2 の直既約な群 {#grp:indecomposable-rank-two keywords="an indecomposable torsion-free abelian group of rank two with only two automorphisms" index="直既約な捩れのない群|ちょくきやくなねじれのないぐん"}
$p,q,r$ を相異なる素数、$V$ を基底 $u,v$ をもつ $\mathbb{Q}$ ベクトル空間とし、$G\le V$ を $p^{-m}u$, $q^{-m}v$, $r^{-m}(u+v)$（$m\ge0$）で生成された部分群とする。
1. $G$ の元で $p$ 高さが無限のものは $u$ の有理数倍、$q$ 高さが無限のものは $v$ の有理数倍、$r$ 高さが無限のものは $u+v$ の有理数倍である。
2. $G$ の自己同型は $\pm1$ だけである。
3. $G$ は二つの $0$ でない部分群の直和にならない（**直既約**）。
:::

::: proof
**Step 1（元の形）.** $G$ の元は $g=\frac{a}{p^{i}}u+\frac{b}{q^{j}}v+\frac{c}{r^{l}}(u+v)$（$a,b,c\in\Z$, $i,j,l\ge0$）と書ける（同じ種類の生成元の整数結合は、分母を最大の冪にそろえて一つにまとまる）。$v$ の係数は $\beta=\frac{b}{q^{j}}+\frac{c}{r^{l}}$ で、分母は $q,r$ の冪だけからなる。

**Step 2（1 の $p$ の場合）.** $g$ の $p$ 高さが無限なら、各 $t$ で $g=p^{t}g_{t}$（$g_{t}\in G$）。$g_{t}$ の $v$ の係数 $\beta_{t}$ も分母が $q,r$ の冪で、$u,v$ の一次独立性から $\beta=p^{t}\beta_{t}$。$\beta\neq0$ なら $\beta=p^{e}\frac{s}{w}$（$p\nmid sw$）と書けて、$\beta_{t}=p^{e-t}\frac{s}{w}$ は $t>e$ で分母に $p$ をもち矛盾。よって $\beta=0$、$g\in\mathbb{Q}u$。$q$ の場合は $u$ の係数で同じ議論。$r$ の場合は $u$ の係数と $v$ の係数の差 $\frac{a}{p^{i}}-\frac{b}{q^{j}}$（分母は $p,q$ の冪）について同じ議論をすると、差が $0$ で $g\in\mathbb{Q}(u+v)$。

**Step 3（2）.** $\varphi\in\mathrm{Aut}(G)$ は高さを保つ。$u=p^{m}(p^{-m}u)$ なので $u$ の $p$ 高さは無限で、$\varphi(u)$ も $p$ 高さ無限、1 から $\varphi(u)=du$（$d\in\mathbb{Q}$）。同様に $\varphi(v)=ev$, $\varphi(u+v)=f(u+v)$。$\varphi(u+v)=\varphi(u)+\varphi(v)$ と一次独立性から $d=e=f$。各生成元 $x$ について $p^{m}\varphi(p^{-m}u)=\varphi(u)=du$ で、捩れがないので $\varphi(p^{-m}u)=dp^{-m}u$（$V$ の中で）。他の生成元も同じなので $\varphi(x)=dx$（すべての $x\in G$）。$G\cap\mathbb{Q}u$ の元の $u$ の係数は $\Z[1/p]$ に入る（Step 1 で $v$ の係数 $0$ から $\frac{b}{q^{j}}=-\frac{c}{r^{l}}$ はどちらも整数）ので、$du\in G$ から $d\in\Z[1/p]$、同様に $dv\in G$ から $d\in\Z[1/q]$。$d\in\Z[1/p]\cap\Z[1/q]=\Z$。$\varphi^{-1}$ についても同じで $d^{-1}\in\Z$、よって $d=\pm1$。

**Step 4（3）.** $G=H\oplus K$（$H,K\neq0$）なら、$h+k\mapsto h-k$ は $\pm1$ と異なる自己同型で、2 に反する。
:::

## 自由性の判定 {#grp:sec-tf-freeness}

::: theorem ポントリャーギンの判定法 {#grp:pontryagin-criterion keywords="Pontryagin's criterion: a countable torsion-free abelian group is free iff every subgroup of finite rank is free" index="ポントリャーギンの判定法|ぽんとりゃーぎんのはんていほう" refname="ポントリャーギンの判定法"}
可算な捩れのないアーベル群 $G$ について、$G$ が自由であることと、有限階数の部分群がすべて自由であることは同値である。
:::

::: proof
**Step 1（⇒）.** \ref{grp:subgroup-of-free-abelian}（可算なので選択公理は要らない）。

**Step 2（純化）.** $G=\{g_{1},g_{2},\dots\}$ と並べ、$G_{n}\defeq\{x\in G:\ mx\in\ang{g_{1},\dots,g_{n}}\text{ となる }m\ge1\text{ がある}\}$ とおく。$G_{n}$ は部分群、$G_{0}=0$、$G_{n}\subseteq G_{n+1}$、$\bigcup_{n}G_{n}=G$。$G_{n}$ の元は $\ang{g_{1},\dots,g_{n}}$ に従属するので $r(G_{n})\le n$（\ref{grp:torsion-free-rank}）。仮定から $G_{n}$ は自由で、その基底は一次独立なので高々 $n$ 個：$G_{n}$ は有限生成。

**Step 3（剰余は自由）.** $G_{n+1}/G_{n}$ は捩れがない：$x\in G_{n+1}$, $kx\in G_{n}$（$k\ge1$）なら $mkx\in\ang{g_{1},\dots,g_{n}}$ で $x\in G_{n}$。有限生成で捩れがないので自由（\ref{grp:fg-abelian-structure.1}）。\ref{grp:free-quotient-splits}（有限階数なので選択公理は不要）から $G_{n+1}=G_{n}\oplus C_{n}$、$C_{n}$ は有限生成の自由アーベル群。

**Step 4（貼り合わせ）.** 帰納法で $G_{n}=C_{0}\oplus\cdots\oplus C_{n-1}$ なので、$G=\bigoplus_{n}C_{n}$。各 $C_{n}$ の基底の和集合が $G$ の基底。

::: hypcheck
- **可算性**：Step 2 で $G$ を可算個の有限生成部分群の増大列で尽くすのに使った。外すと偽（\ref{grp:baer-specker} と \ref{grp:specker-countable}）。
:::
:::

::: theorem ベール–シュペッカーの定理 {#grp:baer-specker keywords="Baer-Specker: the group Z^N of all integer sequences is not free abelian" index="ベール–シュペッカーの定理|べーるしゅぺっかーのていり" refname="ベール–シュペッカーの定理"}
（AC）$\Z^{\N}$ は自由アーベル群でない。
:::

::: proof
**Step 1（部分群 $H$）.** $H\defeq\{h\in\Z^{\N}:\ \text{各 }k\text{ について、有限個を除くすべての }n\text{ で }2^{k}\mid h_{n}\}$ は部分群で、$D\defeq\Z^{(\N)}\subseteq H$。

**Step 2（$H/2H$ は可算）.** $h\in H$ について、$h_{n}$ が偶数でない $n$ は有限個なので、そのような $n$ のどれよりも大きい $N$ をとり、$d\defeq(h_{0},\dots,h_{N},0,0,\dots)\in D$ とおく。$h-d$ の成分は $n\le N$ で $0$、$n>N$ で偶数なので $(h-d)/2\in\Z^{\N}$ で、各 $k$ について $2^{k+1}\mid h_{n}$ となるのは有限個を除くすべての $n$ なので $(h-d)/2\in H$。よって $H=D+2H$ で、$H/2H$ は可算な $D$ の像なので可算。

**Step 3（$H$ は非可算）.** $\varepsilon\in\{0,1\}^{\N}$ について $(\varepsilon_{n}2^{n})_{n}\in H$ で、$\varepsilon$ ごとに異なるので $\lvert H\rvert\ge2^{\aleph_{0}}$。

**Step 4（矛盾）.** $\Z^{\N}$ が自由なら、部分群 $H$ も自由（\ref{grp:subgroup-of-free-abelian}。AC）で、基底 $Y$ について $H/2H\cong(\Z/2)^{(Y)}$。Step 2 から $Y$ は可算で、$H\cong\Z^{(Y)}$ も可算。Step 3 に反する。

::: hypcheck
- **選択公理**：Step 4 で部分群の自由性を使うのに使った。
- 可算部分群はすべて自由（\ref{grp:specker-countable}）なので、ポントリャーギンの判定法は非可算な群では成り立たない。
:::
:::

::: lemma シュペッカーの補題 {#grp:specker-lemma keywords="every finite subset of a product of copies of Z lies in a finitely generated direct summand whose complement is again such a product" index="シュペッカーの補題|しゅぺっかーのほだい" refname="シュペッカーの補題"}
$\Lambda$ を集合とし、$P$ を $\Z^{\Lambda}$ と同型な群とする。$P$ の有限部分集合 $S$ について、$P=L\oplus M$ で、$L$ は $S$ を含む有限生成部分群、$M$ はある集合 $\Lambda'$ について $\Z^{\Lambda'}$ と同型、となるものがある。
:::

::: proof
$P=\Z^{\Lambda}$ としてよい。$\pi_{\lambda}$ を第 $\lambda$ 成分への射影とする。

**Step 1（成分 $\pm1$ をもつ元）.** $g\in P$ がある $\lambda_{0}$ で $g_{\lambda_{0}}=\pm1$ をもつなら、$K\defeq\Ker\pi_{\lambda_{0}}\cong\Z^{\Lambda\setminus\{\lambda_{0}\}}$ について $P=\ang{g}\oplus K$：$x=\pm x_{\lambda_{0}}g+(x\mp x_{\lambda_{0}}g)$ で、第二項の $\lambda_{0}$ 成分は $0$。$\ang{g}\cap K=0$ は $\lambda_{0}$ 成分から。

**Step 2（一つの元）.** $S=\{g\}$（$g\neq0$）とし、$g$ の $0$ でない成分の絶対値の最小値 $k\ge1$ に関する帰納法で示す。$k=1$ は Step 1（$L=\ang{g}$, $M=K$）。$k>1$ とし、各成分を $g_{\lambda}=kq_{\lambda}+r_{\lambda}$（$0\le r_{\lambda}<k$）と割り算して $x\defeq(q_{\lambda})$, $y\defeq(r_{\lambda})$ とおくと $g=kx+y$。$\lvert g_{\lambda_{0}}\rvert=k$ となる $\lambda_{0}$ では $q_{\lambda_{0}}=\pm1$, $r_{\lambda_{0}}=0$。Step 1 から $P=\ang{x}\oplus K$（$K=\Ker\pi_{\lambda_{0}}$）で $y\in K$。$y$ の $0$ でない成分の絶対値は $k$ 未満なので、帰納法の仮定（$K\cong\Z^{\Lambda\setminus\{\lambda_{0}\}}$ に適用）から $K=L'\oplus M$（$y\in L'$, $L'$ 有限生成、$M\cong\Z^{\Lambda'}$）。$L\defeq\ang{x}\oplus L'$ とすると $g=kx+y\in L$, $P=L\oplus M$。

**Step 3（有限個の元）.** $S=\{g_{1},\dots,g_{n}\}$ の $n$ に関する帰納法。$g_{1},\dots,g_{n-1}\in L_{1}$, $P=L_{1}\oplus M_{1}$ とし、$g_{n}=a+b$（$a\in L_{1}$, $b\in M_{1}$）と分ける。Step 2 を $M_{1}\cong\Z^{\Lambda_{1}}$ と $b$ に適用して $M_{1}=L_{2}\oplus M_{2}$（$b\in L_{2}$）。$L\defeq L_{1}\oplus L_{2}$, $M\defeq M_{2}$ とすればよい。
:::

::: theorem シュペッカーの定理 {#grp:specker-countable keywords="Specker: every countable subgroup of Z^N (indeed of any product of copies of Z) is free" index="シュペッカーの定理|しゅぺっかーのていり" refname="シュペッカーの定理"}
集合 $\Lambda$ について、$\Z^{\Lambda}$ の可算部分群はすべて自由である。
:::

::: proof
**Step 1.** \ref{grp:pontryagin-criterion}から、可算部分群 $H$ の有限階数の部分群 $K$ が自由であることを示せばよい。$K$ の極大な一次独立部分集合 $S$ は有限（\ref{grp:torsion-free-rank}）。

**Step 2.** \ref{grp:specker-lemma}から $\Z^{\Lambda}=L\oplus M$, $S\subseteq L$, $L$ 有限生成、$M\cong\Z^{\Lambda'}$ は捩れがない。$k\in K$ について $mk\in\ang{S}\subseteq L$（$m\ge1$）。$k=l+m'$（$l\in L$, $m'\in M$）と分けると $mm'=mk-ml\in L\cap M=0$ で、$M$ は捩れがないので $m'=0$、$k\in L$。よって $K\le L$。$L$ は有限生成で捩れがないので自由（\ref{grp:fg-abelian-structure.1}）、その部分群 $K$ も自由（\ref{grp:subgroup-of-free-abelian}）。
:::

::: supplement
**型と準同型.** 階数 1 の捩れのない群 $G,H$ について、$G$ が $H$ の部分群と同型であることと $\mathbf{t}(G)\le\mathbf{t}(H)$（成分ごとの大小で、有限個の差を許したもの）は同値であることが知られている（Robinson §4.4 演習）。したがって、$\mathbb{Q}$ の部分群の「大きさ」は型の半順序で測られる。

**高い階数.** \ref{grp:indecomposable-rank-two} の素数を増やすと、任意の可算な階数の直既約な捩れのない群が作れる。有限階数の捩れのない群の分類は「ワイルド」（行列の同時共役の分類を含む）であることが知られており、完全な不変量は期待できない。

**$\Z^{\N}$ の双対.** $\mathrm{Hom}(\Z^{\N},\Z)\cong\Z^{(\N)}$（各準同型は有限個の座標にしか依存しない）であることが知られている（シュペッカー）。$\Z^{\N}$ は自由でないにもかかわらず、その双対は自由である。この性質をもつ群は **slender** 群の理論につながる。
:::

## 問題 {#grp:sec-tf-problems}

::: problem {#grp:prob-tf-subgroup-q}
$G\le\mathbb{Q}$ が有限生成であることと、巡回群であることは同値であることを示せ。また $\Z[1/2]$ と $\Z[1/3]$ は同型でないことを、型を使わずに示せ。
:::

::: solution
$G=\ang{a_{1}/b,\dots,a_{k}/b}$（共通分母）なら $G\le\frac1b\Z\cong\Z$ で、巡回群の部分群は巡回群（\ref{grp:subgroups-cyclic}）。同型 $\varphi\colon\Z[1/2]\to\Z[1/3]$ があれば、$1=2^{k}\cdot2^{-k}$ から $\varphi(1)\in2^{k}\Z[1/3]$（すべての $k$）。$\varphi(1)=m/3^{j}$ とすると $2^{k}\mid m$（$2$ と $3$ は\term[互いに素]{grp:gcd}）がすべての $k$ で成り立ち $m=0$、$\varphi(1)=0$ で単射に反する。
:::

::: problem {#grp:prob-tf-hom-q-z}
$\mathrm{Hom}(\mathbb{Q},\Z)=0$ を示し、これを使って $\mathbb{Q}$ が $\Z^{\Lambda}$ のどの部分群とも同型でないことを示せ。
:::

::: solution
$f\colon\mathbb{Q}\to\Z$ について、$f(1)=nf(1/n)$ なので $f(1)$ はすべての $n$ で割り切れ、$f(1)=0$。$f(a/b)=af(1/b)$, $bf(1/b)=f(1)=0$ から $f=0$。$\mathbb{Q}\le\Z^{\Lambda}$ なら、ある射影 $\pi_{\lambda}$ が $\mathbb{Q}$ 上で $0$ でない（$\mathbb{Q}\neq0$）ので矛盾。（シュペッカーの定理からも、$\mathbb{Q}$ は可算で自由でないので従う。）
:::
