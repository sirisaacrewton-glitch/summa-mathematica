# アーベル群（Abelian Groups）

有限アーベル群の構造定理と最短の巡回分解、自由アーベル群とその部分群、可除群、捩れのない群、純部分群、拡大と Ext とホワイトヘッドの問題。

<p class="mn-msc">MSC2020: 20K</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-finite-abelian/index.html"><span class="mn-card-title">有限アーベル群</span><span class="mn-card-en">Finite Abelian Groups</span><span class="mn-card-desc">有限アーベル群の構造定理（巡回群の直和への分解、初等因子と単因子の一意性）、与えられた位数のアーベル群の個数、最短の巡回分解と生成元の最小個数（単因子の個数・p ランク・部分群の生成元の個数）。</span><span class="mn-card-count">2 ページ</span></a>
<a class="mn-card" href="02-infinite-abelian/index.html"><span class="mn-card-title">無限アーベル群</span><span class="mn-card-en">Infinite Abelian Groups</span><span class="mn-card-desc">自由アーベル群とその部分群、射影性、捩れ部分群、有限生成アーベル群（群論の側からの証明）、可除群と入射性・構造定理・プリューファー群、捩れのない群の階数と型・ベールの分類・ポントリャーギンの判定法・ベール–シュペッカーの定理、純部分群と基本部分群・有界な群の構造・クリコフの判定法、拡大と Ext・ホワイトヘッドの問題（Robinson 第 4 章を参考）。</span><span class="mn-card-count">5 ページ</span></a>
</div>
