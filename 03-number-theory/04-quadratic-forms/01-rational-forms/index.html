# 有理数体上の 2 次形式（Quadratic Forms over the Rationals）

2 次空間とヴィットの定理、有限体上の 2 次形式、平方類とヒルベルト記号、p 進体上の 2 次形式の分類、ハッセ–ミンコフスキーの定理、3 平方和定理。Serre『数論講義』に対応。

<p class="mn-msc">MSC2020: 11E04, 11E08, 11E12</p>

## 前提知識

- [線形代数 › 双線形形式と内積空間](../../../02-algebra/01-linear-algebra/04-forms/index.html)（全体、3 ページ）：双線形形式・対称形式の対角化・シルヴェスターの慣性法則
- [代数的整数論 › 局所体](../../../03-number-theory/01-algebraic-number-theory/02-local-fields/index.html)（全体、6 ページ）：p 進体・ヘンゼルの補題・ヒルベルト記号
- [解析的整数論 › ゼータ関数と L 関数](../../../03-number-theory/03-analytic-number-theory/01-zeta-l-functions/index.html)（全体、4 ページ）：ディリクレの算術級数定理
