# 2 次空間とヴィットの定理 {#nt:page-quadratic-spaces keywords="quadratic space over a field of characteristic not 2, scalar product, discriminant in k^x / k^x2, isometry, orthogonal direct sum, nondegenerate, radical, isotropic vector, hyperbolic plane, a nondegenerate isotropic space represents every element, representation criteria g represents a iff g - aZ^2 represents 0, orthogonal basis, chains of contiguous orthogonal bases, Witt's extension theorem, reflections, Witt cancellation theorem, Witt decomposition into hyperbolic planes and an anisotropic part"}

体 $k$（標数 $\neq2$）上の 2 次形式 $Q$ は、対称双線形形式 $x\cdot y$ と同じものであり、有限次元ベクトル空間に「長さの 2 乗」を与える。このページでは、2 次形式を空間の側から扱う道具（直交分解・等方ベクトル・双曲平面）を整え、**ヴィットの定理**「非退化な 2 次空間の部分空間の間の等長写像は、全体の等長同型に延びる」を証明する。その帰結の**消去定理**は、$p$ 進体や有理数体の上の 2 次形式を帰納法で分類するための基本的な道具である。

## 記法と定義の確認 {#nt:sec-qs-notation}

::: notation
- $k$ は標数 $\neq2$ の体、$V$ は有限次元 $k$ ベクトル空間。双線形形式・グラム行列・合同、直交補空間と根基、対称形式の対角化（直交基底の存在）は \ref{lin:bilinear-form}, \ref{lin:orthogonal-complement}, \ref{lin:symmetric-diagonalization}。
- $k^{\times2}\defeq\{a^{2}:a\in k^{\times}\}$。
- 体系は $\ZF$（有限次元の線形代数だけを使う）。
:::

## 2 次空間 {#nt:sec-qs-spaces}

::: definition 2 次空間 {#nt:quadratic-space keywords="quadratic form Q on V: Q(ax) = a^2 Q(x) and Q(x+y) - Q(x) - Q(y) bilinear; scalar product x.y; matrix of Q; discriminant d(Q) in k^x / k^x2; isometry (metric morphism); orthogonal direct sum; equivalent forms; a form represents a" index="2 次空間|にじくうかん, 2 次形式（体上）|にじけいしき, 判別式（2 次形式）|はんべつしき, 等長写像（2 次空間）|とうちょうしゃぞう, 直交直和|ちょっこうちょくわ" refname="2 次空間"}
写像 $Q:V\to k$ が、$Q(ax)=a^{2}Q(x)$ をみたし、$(x,y)\mapsto Q(x+y)-Q(x)-Q(y)$ が双線形であるとき、$Q$ を **2 次形式**、組 $(V,Q)$ を **2 次空間**という。
1. **内積** $x\cdot y\defeq\frac12\{Q(x+y)-Q(x)-Q(y)\}$ は対称双線形形式で $Q(x)=x\cdot x$（\ref{lin:symmetric-diagonalization} の 1 の対応）。基底 $(e_{i})$ について $A=(e_{i}\cdot e_{j})$ を $Q$ の行列といい、$Q(\sum x_{i}e_{i})=\sum a_{ij}x_{i}x_{j}$。
2. 基底を行列 $X$ で取り替えると $A$ は ${}^{t}XAX$ に変わり、$\det A$ は $k^{\times2}$ の元倍だけ変わる。$\det A$ の類を**判別式** $d(Q)\in k/k^{\times2}$ という。
3. 根基 $V^{\perp}=\{x:x\cdot y=0\ (\forall y)\}$ が $0$ のとき**非退化**という（$\iff d(Q)\neq0$）。$\operatorname{rank}Q\defeq\dim V-\dim V^{\perp}$。
4. 線形写像 $f:V\to V'$ で $Q'\circ f=Q$ となるものを**等長写像**といい（このとき $f(x)\cdot f(y)=x\cdot y$）、全単射なものを**等長同型**という。
5. 部分空間 $U_{1},\dots,U_{m}$ が互いに直交し $V=U_{1}\oplus\dots\oplus U_{m}$ のとき、$V$ はそれらの**直交直和**であるといい $V=U_{1}\mathbin{\perp}\dots\mathbin{\perp} U_{m}$ と書く。
6. $n$ 変数の 2 次形式 $f(X)=\sum a_{ij}X_{i}X_{j}$（$a_{ij}=a_{ji}$）は 2 次空間 $(k^{n},f)$ を定める。2 つの形式は、対応する空間が等長同型なとき**同値**（$f\sim f'$）という。$f\oplus g$ は変数を分けた和 $f(X_{1},\dots,X_{n})+g(X_{n+1},\dots,X_{n+m})$、$f\ominus g\defeq f\oplus(-g)$。$f$ が $a\in k$ を**表す**とは、$f(x)=a$ となる $x\neq0$ があることをいう。
:::

::: intuition
2 次空間は「長さの 2 乗が測れるベクトル空間」で、ユークリッド空間と違って長さの 2 乗が負や $0$ になってもよい。$d(Q)$ は「体積の 2 乗」で、基底を変えると平方倍しか変わらないので $k^{\times}/k^{\times2}$ の元として意味をもつ。
:::

::: proposition 非退化な空間の直交補空間 {#nt:nondegenerate-orthogonal keywords="for nondegenerate V: isometries from V are injective; U^perp perp = U, dim U + dim U^perp = dim V, rad U = rad U^perp = U cap U^perp; U nondegenerate iff U^perp is, then V = U orthogonal sum U^perp" index="非退化な 2 次空間|ひたいかなにじくうかん" refname="非退化な空間の直交補空間"}
$(V,Q)$ を非退化とする。
1. $V$ からの等長写像は単射である。
2. 部分空間 $U$ について $U^{\perp\perp}=U$, $\dim U+\dim U^{\perp}=\dim V$, $\operatorname{rad}U=\operatorname{rad}U^{\perp}=U\cap U^{\perp}$。
3. $U$ が非退化 $\iff$ $U^{\perp}$ が非退化 で、このとき $V=U\mathbin{\perp} U^{\perp}$。
:::

::: intuition
非退化な空間では、部分空間とその直交補空間の次元が足して全体になり、部分空間が非退化なら空間が直交にきれいに二分される。ユークリッド空間の「直線と、それに垂直な超平面」と同じ分解が、長さの 2 乗が $0$ や負になる場合にも成り立つ条件が非退化性である。
:::

::: proof
**Step 1（1）.** 【主張：等長写像の核は根基に入る】$f(x)=0$ なら、すべての $y$ で $x\cdot y=f(x)\cdot f(y)=0$ なので $x\in V^{\perp}=0$。

**Step 2（2）.** 【主張：次元の式と根基の表示】次元の式と $U^{\perp\perp}=U$ は \ref{lin:orthogonal-complement} の 1。$\operatorname{rad}U=\{u\in U:u\cdot U=0\}=U\cap U^{\perp}$ は定義から。$U^{\perp}$ に当てはめると $\operatorname{rad}U^{\perp}=U^{\perp}\cap U^{\perp\perp}=U^{\perp}\cap U$。

**Step 3（3）.** 【主張：一方が非退化なら他方も非退化で直交直和になる】2 から $\operatorname{rad}U=\operatorname{rad}U^{\perp}$ なので、一方が $0$ なら他方も $0$。$U\cap U^{\perp}=0$ と次元の式から $V=U\oplus U^{\perp}$（\ref{lin:orthogonal-complement} の 2）。
:::

## 等方ベクトルと双曲平面 {#nt:sec-qs-isotropic}

::: definition 等方ベクトルと双曲平面 {#nt:hyperbolic-plane keywords="isotropic vector Q(x) = 0; isotropic subspace; hyperbolic plane: basis of two isotropic vectors x, y with x.y = 1, matrix [[0,1],[1,0]], discriminant -1; hyperbolic form X1 X2 ~ X1^2 - X2^2; anisotropic" index="等方ベクトル|とうほうべくとる, 双曲平面|そうきょくへいめん, 非等方的|ひとうほうてき" refname="等方ベクトルと双曲平面"}
$Q(x)=0$ となる $x$ を**等方ベクトル**、すべての元が等方な部分空間を**等方部分空間**という。$0$ でない等方ベクトルをもたない空間（形式）を**非等方的**という。$x\cdot y=1$ となる等方ベクトル $x,y$ を基底にもつ 2 次元の空間を**双曲平面**といい、その行列は $\begin{pmatrix}0&1\\1&0\end{pmatrix}$（判別式 $-1$、非退化）。対応する形式 $X_{1}X_{2}\sim X_{1}^{2}-X_{2}^{2}$ を**双曲形式**という（$x\pm y$ の長さの 2 乗は $\pm2$）。
:::

::: intuition
双曲平面は「光の速さで進む 2 方向」$x,y$ が張る平面で、$Q(sx+ty)=2st$ は相対論の $t^{2}-x^{2}$ と同じ形をしている。非等方的な形式は、そのような方向を一つももたない「どの方向にも長さがある」形式である。
:::

::: proposition 等方ベクトルと双曲平面 {#nt:isotropic-hyperbolic keywords="a nonzero isotropic vector of a nondegenerate space lies in a hyperbolic plane; such a space represents every element of k" index="双曲平面の存在|そうきょくへいめんのそんざい" refname="等方ベクトルを含む双曲平面"}
$(V,Q)$ を非退化、$x\neq0$ を等方ベクトルとする。
1. $x$ を含む双曲平面 $H\subseteq V$ がある。特に $V=H\mathbin{\perp} H^{\perp}$。
2. $Q(V)=k$（すべての $a\in k$ が $Q$ の値になる）。
:::

::: intuition
非退化な空間に「長さ $0$ の方向」が一つあれば、それと対になる長さ $0$ の方向が必ずあって、2 つで「光円錐」の平面を張る。双曲平面の上では $Q(x+ty)=2t$ がどんな値もとるので、空間全体がすべての値を表す。
:::

::: proof
**Step 1（1）.** 【主張：$y\defeq2z-(z\cdot z)x$（$x\cdot z=1$）は等方で $x\cdot y=2$】非退化なので $x\cdot z=1$ となる $z$ がある。$y\cdot y=4z\cdot z-4(z\cdot z)(x\cdot z)+(z\cdot z)^{2}x\cdot x=0$, $x\cdot y=2$。$x,y/2$ は双曲平面 $H$ の基底。$H$ は非退化なので \ref{nt:nondegenerate-orthogonal} の 3 から $V=H\mathbin{\perp} H^{\perp}$。

**Step 2（2）.** $H$ の基底 $x,y'$（$x\cdot y'=1$）について $Q(x+\frac a2y')=2\cdot\frac a2=a$。
:::

::: proposition 表現の判定 {#nt:representation-criteria keywords="for nondegenerate g and a in k^x: g represents a iff g ~ h + aZ^2 iff g - aZ^2 represents 0; f = g - h represents 0 iff some a in k^x is represented by both g and h" index="2 次形式による表現|にじけいしきによるひょうげん" refname="表現の判定"}
1. $g$ を非退化な $n-1$ 変数の形式、$a\in k^{\times}$ とする。次は同値：(i) $g$ は $a$ を表す。(ii) $g\sim h\oplus aZ^{2}$（$h$ は $n-2$ 変数）。(iii) $g\ominus aZ^{2}$ は $0$ を表す。
2. $g,h$ を階数 $\ge1$ の非退化な形式とする。$g\ominus h$ が $0$ を表す $\iff$ $g$ と $h$ の両方が表す $a\in k^{\times}$ がある。
:::

::: intuition
「$a$ を表す」ことは「$g-aZ^{2}$ が $0$ を表す」ことに言い換えられる。$0$ を表すかどうかの判定さえあれば、数を表すかどうかの判定もそこから得られる、という翻訳規則である。
:::

::: proof
**Step 1（1：(i)⇒(ii)）.** 【主張：$a$ を表すベクトルの直交補空間が $h$ を与える】$x\cdot x=a\neq0$ なら $kx$ は非退化なので $V=kx\mathbin{\perp}(kx)^{\perp}$。$h$ を $(kx)^{\perp}$ の形式とすればよい。(ii)⇒(iii) は $g$ の $Z$ 座標に $1$、$h$ の座標に $0$ を入れて $a-a=0$。

**Step 2（1：(iii)⇒(i)）.** 【主張：$g\ominus aZ^{2}$ の零点から $a$ の表示が得られる】$g(x)-az^{2}=0$, $(x,z)\neq0$ とする。$z\neq0$ なら $g(x/z)=a$。$z=0$ なら $g$ は $0$ を表し（$x\neq0$）、\ref{nt:isotropic-hyperbolic} の 2 から $a$ も表す。

**Step 3（2）.** 【主張：共通の値 $a$ が $0$ でないようにとれる】⇐ は $g(x)=a=h(y)$ から。⇒：$g(x)=h(y)$, $(x,y)\neq0$ とし $a\defeq g(x)$。$a\neq0$ なら $x,y\neq0$ で終わり。$a=0$ なら $x\neq0$ か $y\neq0$ で、たとえば $g$ が $0$ を表すので $g$ はすべての値を表し、特に $h$ の $0$ でない値（$h$ は階数 $\ge1$ なので存在する）を表す。
:::

## 直交基底と隣接する基底 {#nt:sec-qs-bases}

::: theorem 隣接する直交基底の鎖 {#nt:contiguous-bases keywords="any two orthogonal bases of a nondegenerate quadratic space of dimension >= 3 are connected by a chain of orthogonal bases in which consecutive bases share a vector" index="隣接する直交基底|りんせつするちょっこうきてい" refname="隣接する直交基底の鎖"}
$(V,Q)$ を $\dim V\ge3$ の非退化な 2 次空間とする。2 つの直交基底 $e=(e_{1},\dots,e_{n})$, $e'=(e'_{1},\dots,e'_{n})$ について、直交基底の列 $e=e^{(0)},e^{(1)},\dots,e^{(m)}=e'$ で、各 $e^{(i)}$ と $e^{(i+1)}$ が共通のベクトルをもつ（**隣接する**）ものがある。
:::

::: intuition
直交基底の取り替えを「一度に一本ずつしか軸を動かさない」操作の繰り返しに分解できる、という主張である。これを使うと、直交基底から定義した量（ハッセ不変量）が基底によらないことを、隣接する基底の間で確かめるだけで示せる。
:::

::: proof
**Step 0（準備）.** 非退化な空間の直交基底の元は等方でない（$e_{i}\cdot e_{i}=0$ なら $e_{i}$ はすべての基底ベクトルと直交し根基に入る）。2 元 $u,w$ について $\Delta(u,w)\defeq(u\cdot u)(w\cdot w)-(u\cdot w)^{2}$ とおくと、$\Delta(u,w)\neq0\iff u,w$ が一次独立で $ku+kw$ が非退化。

**Step 1（$\Delta(e_{1},e'_{1})\neq0$ の場合）.** 【主張：$e\to(e_{1},\varepsilon_{2},e''_{3},\dots,e''_{n})\to(e'_{1},\varepsilon'_{2},e''_{3},\dots,e''_{n})\to e'$ が鎖】$P\defeq ke_{1}+ke'_{1}$ は非退化な平面で、$e_{1}$（$e'_{1}$）の $P$ での直交補空間の生成元を $\varepsilon_{2}$（$\varepsilon'_{2}$）とする。$H\defeq P^{\perp}$ は非退化で $V=P\mathbin{\perp} H$（\ref{nt:nondegenerate-orthogonal}）、$\dim H=n-2\ge1$ なので $H$ の直交基底 $(e''_{3},\dots,e''_{n})$ がとれる（\ref{lin:symmetric-diagonalization}）。隣り合う基底はそれぞれ $e_{1}$, $e''_{3}$, $e'_{1}$ を共有する。

**Step 2（$\Delta(e_{1},e'_{2})\neq0$ の場合）.** Step 1 で $e'_{1}$ と $e'_{2}$ の役割を入れ替える。

**Step 3（$\Delta(e_{1},e'_{1})=\Delta(e_{1},e'_{2})=0$ の場合）.** 【主張：$e_{x}\defeq e'_{1}+xe'_{2}$ が非等方で $\Delta(e_{1},e_{x})\neq0$ となる $x\in k$ がある】仮定から $(e_{1}\cdot e'_{i})^{2}=(e_{1}\cdot e_{1})(e'_{i}\cdot e'_{i})\neq0$（$i=1,2$）。$e'_{1}\cdot e'_{2}=0$ を使って展開すると
$$
\Delta(e_{1},e_{x})=\Delta(e_{1},e'_{1})+x^{2}\Delta(e_{1},e'_{2})-2x(e_{1}\cdot e'_{1})(e_{1}\cdot e'_{2})=-2x(e_{1}\cdot e'_{1})(e_{1}\cdot e'_{2}),
$$
$e_{x}\cdot e_{x}=e'_{1}\cdot e'_{1}+x^{2}\,e'_{2}\cdot e'_{2}$。よって条件は $x\neq0$ かつ $x^{2}\neq c\defeq-(e'_{1}\cdot e'_{1})/(e'_{2}\cdot e'_{2})$ で、除かれる $x$ は高々 3 個。$\abs k\ge4$ なら $x$ がとれる。$k=\mathbb{F}_{3}$ では $0$ でない平方は $1$ だけなので、仮定 $(e_{1}\cdot e_{1})(e'_{i}\cdot e'_{i})=(e_{1}\cdot e'_{i})^{2}=1$ から $e'_{1}\cdot e'_{1}=e'_{2}\cdot e'_{2}$、$c=-1$ で、$x=1$（$1\neq-1$）がとれる。（標数 $\neq2$ なので $k=\mathbb{F}_{2}$ はない。）

**Step 4（Step 3 の結論）.** $e_{x}$ は非等方なので、$ke'_{1}+ke'_{2}$ での $e_{x}$ の直交補空間の生成元 $e''_{2}$ をとり、$e''\defeq(e_{x},e''_{2},e'_{3},\dots,e'_{n})$ とすると直交基底。$\Delta(e_{1},e_{x})\neq0$ なので Step 1 から $e$ と $e''$ は鎖で結ばれ、$e''$ と $e'$ は $e'_{3}$ を共有する（$n\ge3$）。
:::

## ヴィットの定理 {#nt:sec-qs-witt}

::: lemma 退化した部分空間の拡大 {#nt:witt-degenerate-lemma keywords="if U is degenerate, an injective isometry s: U -> V' extends to U_1 = U + ky containing U as a hyperplane, with y isotropic and dual to a radical vector" index="ヴィットの補題|ゔぃっとのほだい"}
$(V,Q)$, $(V',Q')$ を非退化、$U\subseteq V$ を退化した部分空間、$s:U\to V'$ を単射な等長写像とすると、$U$ を超平面として含む $U_{1}$ への単射な等長写像 $s_{1}$ で $s$ を延ばすものがある。
:::

::: proof
**Step 1（$y$ の構成）.** 【主張：$u\cdot y=l(u)$ $(u\in U)$ で $y\cdot y=0$ となる $y\in V$ がある】$0\neq x\in\operatorname{rad}U$ と、$l(x)=1$ となる線形形式 $l:U\to k$ をとる。$V$ は非退化なので $V\to V^{\ast}\to U^{\ast}$ は全射で、$u\cdot y_{0}=l(u)$ となる $y_{0}$ がある。$y\defeq y_{0}-\lambda x$, $\lambda\defeq\frac12y_{0}\cdot y_{0}$ とすると、$x\cdot x=0$, $x\cdot y_{0}=1$ から $y\cdot y=y_{0}\cdot y_{0}-2\lambda=0$、また $u\cdot y=l(u)-\lambda u\cdot x=l(u)$（$x\in\operatorname{rad}U$）。$y\notin U$（$y\in U$ なら $1=l(x)=x\cdot y=0$）なので $U_{1}\defeq U\oplus ky$ は $U$ を超平面として含む。

**Step 2（像の側）.** $U'\defeq s(U)$, $x'\defeq s(x)\in\operatorname{rad}U'$, $l'\defeq l\circ s^{-1}$ に同じ構成をして $y'\in V'$ をとる。$s_{1}|_{U}=s$, $s_{1}(y)=y'$ とすると、$u\cdot y=l(u)=l'(s(u))=s(u)\cdot y'$, $y\cdot y=0=y'\cdot y'$ から $s_{1}$ は等長、$s_{1}(U_{1})=U'\oplus ky'$（同じ理由で直和）なので単射。
:::

::: theorem ヴィットの定理 {#nt:witt-extension keywords="Witt's extension theorem: if V and V' are isometric and nondegenerate, every injective isometry from a subspace U of V into V' extends to an isometry of V onto V'; proof by reflections; isometric subspaces have isometric orthogonal complements" index="ヴィットの定理|ゔぃっとのていり, 鏡映|きょうえい" refname="ヴィットの定理"}
$(V,Q)$ と $(V',Q')$ が等長同型で非退化なら、部分空間 $U\subseteq V$ からの単射な等長写像 $s:U\to V'$ は、等長同型 $V\to V'$ に延びる。特に、非退化な空間の等長同型な 2 つの部分空間は、等長同型な直交補空間をもつ。
:::

::: intuition
ユークリッド空間では、長さと角度を保って部分空間を写す写像は、回転と鏡映で全体に延ばせる。ヴィットの定理はその代数版で、長さの 2 乗が $0$ や負になる空間でも、「部分空間の形が同じなら、全体の中での置かれ方も同じ」と主張する。
:::

::: proof
**Step 1（帰着）.** 等長同型 $\phi:V'\to V$ を合成して $V'=V$ としてよい。\ref{nt:witt-degenerate-lemma} を有限回使う（$\dim U$ は増え、$\dim V$ で止まり、$V$ は非退化）と、$U$ は非退化としてよい。$\dim U$ についての帰納法で示す。

**Step 2（$\dim U=1$：鏡映）.** 【主張：$U=kx$, $y\defeq s(x)$ について $s$ は $\pm$（鏡映）に延びる】$y\cdot y=x\cdot x\neq0$。$x+y$ と $x-y$ がともに等方なら、$2x\cdot x\pm2x\cdot y=0$ を足して $x\cdot x=0$ となり矛盾。よって $z\defeq x+\varepsilon y$ が非等方な $\varepsilon\in\{\pm1\}$ がある。$H\defeq z^{\perp}$ で $V=kz\mathbin{\perp} H$。$\sigma$ を $H$ 上で恒等、$z\mapsto-z$ の写像（**鏡映**）とすると等長同型。$(x-\varepsilon y)\cdot(x+\varepsilon y)=x\cdot x-y\cdot y=0$ なので $x-\varepsilon y\in H$、$\sigma(x-\varepsilon y)=x-\varepsilon y$, $\sigma(x+\varepsilon y)=-x-\varepsilon y$ を足して $\sigma(x)=-\varepsilon y$。$-\varepsilon\sigma$ が $s$ を延ばす。

**Step 3（$\dim U>1$）.** 【主張：$U=U_{1}\mathbin{\perp} U_{2}$ に分けて帰納法】非退化な $U$ は直交基底をもつので、$0$ でない非退化な $U_{1},U_{2}$ で $U=U_{1}\mathbin{\perp} U_{2}$ と書ける。帰納法の仮定から $s|_{U_{1}}$ は等長同型 $\sigma_{1}$ に延び、$s$ を $\sigma_{1}^{-1}\circ s$ に替えて $s|_{U_{1}}=\mathrm{id}$ としてよい。すると $s(U_{2})$ は $s(U_{1})=U_{1}$ に直交するので $V_{1}\defeq U_{1}^{\perp}$（非退化）に入る。$U_{2}\subseteq V_{1}$ で、帰納法の仮定（$V_{1}$ と $V_{1}$ に適用）から $s|_{U_{2}}$ は $V_{1}$ の等長同型 $\sigma_{2}$ に延びる。$U_{1}$ 上で恒等、$V_{1}$ 上で $\sigma_{2}$ の写像が求めるもの（$V=U_{1}\mathbin{\perp} V_{1}$）。

**Step 4（直交補空間）.** $U_{1}\cong U_{2}$ の等長同型を $V$ の等長同型 $\sigma$ に延ばすと、$\sigma(U_{1}^{\perp})=U_{2}^{\perp}$。
:::

::: theorem ヴィットの消去定理 {#nt:witt-cancellation keywords="Witt cancellation: if g + h ~ g' + h' are nondegenerate and g ~ g' then h ~ h'; Witt decomposition f ~ g_1 + ... + g_m + h with g_i hyperbolic and h anisotropic, unique up to equivalence" index="ヴィットの消去定理|ゔぃっとのしょうきょていり, ヴィット分解|ゔぃっとぶんかい, ヴィット指数|ゔぃっとしすう" refname="ヴィットの消去定理"}
1. $f=g\oplus h$, $f'=g'\oplus h'$ を非退化な形式とする。$f\sim f'$ かつ $g\sim g'$ なら $h\sim h'$。
2. 非退化な $f$ は $f\sim g_{1}\oplus\dots\oplus g_{m}\oplus h$（$g_{i}$ は双曲形式、$h$ は非等方的）と書け、$m$ と $h$ の同値類は $f$ だけで決まる。$m$ を $f$ の**ヴィット指数**という。
:::

::: intuition
同値な形式から同じ部分を取り去った残りも同値である。2 次形式は「双曲平面いくつか」と「どの方向にも長さがある核」に一意に分かれ、核の部分が形式の本質的な情報を担う。
:::

::: proof
**Step 1（1）.** 【主張：$h$ と $h'$ は等長同型な部分空間の直交補空間】$f\sim f'$ の空間 $V$ の中で、$g$ と $g'$ の空間 $U$, $U'$ は等長同型で、$h$, $h'$ の空間はその直交補空間（\ref{nt:nondegenerate-orthogonal}：直和成分は互いの直交補空間）。\ref{nt:witt-extension} の最後の主張から $h\sim h'$。

**Step 2（2 の存在）.** 【主張：双曲平面を分離し続けると非等方な部分が残る】$f$ が等方的なら \ref{nt:isotropic-hyperbolic} で双曲平面を分離し、直交補空間（非退化）に同じことを繰り返す。次元が減るので有限回で非等方的な $h$ が残る。

**Step 3（2 の一意性）.** 【主張：双曲平面の個数と非等方な部分は一意】$f\sim mH\oplus h\sim m'H\oplus h'$（$H$ は双曲形式）、$m\le m'$ とする。1 で $mH$ を消去すると $h\sim(m'-m)H\oplus h'$。$h$ は非等方的なので $m'=m$、そして $h\sim h'$。
:::

::: example
$k=\mathbb{R}$ では、非退化な形式は $X_{1}^{2}+\dots+X_{r}^{2}-Y_{1}^{2}-\dots-Y_{s}^{2}$ と同値（\ref{lin:sylvester-inertia}）。$X^{2}-Y^{2}$ は双曲形式なので、ヴィット分解は $\min(r,s)$ 個の双曲形式と、$\abs{r-s}$ 変数の定値形式 $\pm(X_{1}^{2}+\dots)$ になり、ヴィット指数は $\min(r,s)$。消去定理はこの場合、慣性法則の言い換えである。
:::

::: hypcheck
- **標数 $\neq2$**：内積 $\frac12\{\dots\}$ の定義、鏡映の構成（Step 2 の $2x\cdot x$）、\ref{nt:isotropic-hyperbolic} の $y=2z-\dots$ で $2$ で割ることに使った。標数 $2$ では 2 次形式と対称双線形形式が対応せず、ヴィットの定理は別の形をとる。
- **非退化性**：ヴィットの定理で $V$ が退化していると成り立たない。$V=k^{3}$, $Q=X_{1}^{2}-X_{2}^{2}$（根基 $ke_{3}$）で、$U=ke_{3}$ から $V$ への $e_{3}\mapsto e_{1}+e_{2}$ は単射な等長写像（どちらも長さ $0$）だが、等長同型は根基を根基に写すので延びない。
- **隣接する基底の鎖**：$\dim V\ge3$ は、Step 1 で $H\neq0$、Step 4 で共有ベクトル $e'_{3}$ が存在することに使った。$\dim V=2$ では、異なる直線の対の直交基底は共通のベクトルをもちえない。
:::

## 問題 {#nt:sec-qs-problems}

::: problem {#nt:prob-qs-witt-index}
$\mathbb{Q}$ 上の形式 $f=X_{1}^{2}+X_{2}^{2}-X_{3}^{2}-2X_{4}^{2}$ のヴィット分解を求めよ（非等方部分の判定は、実数・有理数の範囲で $X_{2}^{2}-2X_{4}^{2}$ を調べればよい）。
:::

::: solution
$X_{1}^{2}-X_{3}^{2}$ は双曲形式なので $f\sim H\oplus(X_{2}^{2}-2X_{4}^{2})$。$x^{2}=2y^{2}$ は $\sqrt2\notin\mathbb{Q}$ から $(x,y)=0$ しか有理解をもたないので、$X_{2}^{2}-2X_{4}^{2}$ は非等方的。よってヴィット指数は $1$、非等方部分は $X^{2}-2Y^{2}$。
:::

::: problem {#nt:prob-qs-reflection}
非退化な 2 次空間で、非等方な $z$ についての鏡映 $\sigma_{z}(v)=v-2\frac{v\cdot z}{z\cdot z}z$ が等長同型であることを確かめ、$Q(x)=Q(y)\neq0$ なら $\pm\sigma_{z}$（$z=x\pm y$ のどちらか）が $x$ を $y$ に写すことを示せ。
:::

::: solution
$\sigma_{z}$ は $z^{\perp}$ 上で恒等、$\sigma_{z}(z)=z-2z=-z$ で、$V=kz\mathbin{\perp} z^{\perp}$ なので直交直和の各成分で等長、したがって等長。$x\cdot x=y\cdot y$ から $(x-y)\cdot(x+y)=0$。$z=x-y$ が非等方なら $x=\frac12(x+y)+\frac12z$ で $\frac12(x+y)\in z^{\perp}$ なので $\sigma_{z}(x)=\frac12(x+y)-\frac12z=y$。$x-y$ が等方なら、本文の Step 2 の議論から $z=x+y$ は非等方で、同様に $\sigma_{z}(x)=-y$、すなわち $-\sigma_{z}(x)=y$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** ヴィットの定理は体 $k$ の性質（有限・局所・大域）を何も使わない。必要なのは標数 $\neq2$ と非退化性だけである。

**前提を変えると.**
- **カルタン–デュドネの定理**：$n$ 次元の非退化な空間の直交群 $O(V)$ は、高々 $n$ 個の鏡映の積で生成される（ここでは証明しない）。
- **ヴィット環**：非退化な形式の同値類を、双曲形式を $0$ とみなして直交和で足すと、群（テンソル積で環）$W(k)$ になる。消去定理はこの構成が well-defined である理由である。$W(\mathbb{R})\cong\mathbb{Z}$（符号数）、$W(\mathbb{F}_{q})$ は位数 4 の群になる。
- **環上**：$\mathbb{Z}$ 上の 2 次形式（格子）では消去定理は成り立たない。たとえば $E_{8}\oplus I_{1,1}\cong I_{8}\oplus I_{1,1}$ だが $E_{8}\not\cong I_{8}$（$I_{1,1}$ は $X^{2}-Y^{2}$ の格子。\ref[ユニモジュラー格子]{nt:page-unimodular-lattices}）。

**高い視点から：ヴィットの定理は「均質性」.** ヴィットの定理は、直交群 $O(V)$ が「与えられた形の部分空間の埋め込み」の集合に推移的に作用することを言っている。特に、長さの 2 乗が $a\neq0$ のベクトル全体は一つの $O(V)$ 軌道で、等質空間 $O(V)/O(a^{\perp})$ になる。ユークリッド空間の球面が回転群の等質空間 $O(n)/O(n-1)$ であることの一般化であり、双曲平面を分離していく操作は、光円錐の中で「対になる光線の組」を一組ずつ取り出していくことにあたる。
:::
