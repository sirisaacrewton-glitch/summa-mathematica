# 3 平方和定理 {#nt:page-three-squares keywords="Gauss three squares theorem: a positive integer is a sum of three integer squares iff it is not of the form 4^a (8b - 1); rational representations by X^2 + Y^2 + Z^2 via Hasse-Minkowski; Davenport-Cassels lemma passing from rational to integral representations under the Euclidean condition; Lagrange four squares as a corollary; every positive integer is a sum of three triangular numbers"}

正の整数 $n$ が 3 つの整数の平方の和で書ける $\iff$ $n$ が $4^{a}(8b-1)$ の形でない（**ガウスの 3 平方和定理**）。必要性は $\bmod8$ の計算だけでわかるが、十分性は深い。ここでは、まずハッセ–ミンコフスキーの定理で「有理数の平方の和」で書けることを示し、次に**ダヴェンポート–カッセルスの補題**で有理数解を整数解に取り替える。補題は、$\mathbb{Z}^{3}$ が $\mathbb{Q}^{3}$ を「距離 $1$ 未満で覆う」という幾何的な条件だけを使う、短く巧妙な降下法である。

## 記法と定義の確認 {#nt:sec-ts-notation}

::: notation
- $f=X_{1}^{2}+X_{2}^{2}+X_{3}^{2}$。$\mathbb{Q}$ 上の形式が $a$ を表すことの局所大域原理は \ref{nt:hasse-minkowski-corollaries}、局所体での数の表現は \ref{nt:local-representation}、$\mathbb{Q}_{2}$ の平方は \ref{nt:p-adic-squares}、$(-1,-1)_{v}$ の値（$v=2,\infty$ で $-1$、奇素数で $1$）は \ref{nt:hilbert-symbol-two-proof}, \ref{nt:hilbert-symbol-odd}, \ref{nt:hilbert-symbol-basic}。
- 整数 $n=n_{1}^{2}+\dots+n_{k}^{2}$（$n_{i}\in\mathbb{Z}$）のとき $n$ は **$k$ 平方和**であるという。
- 体系は $\ZFC$（ハッセ–ミンコフスキーの定理を通して）。
:::

## 有理数での表現 {#nt:sec-ts-rational}

::: lemma 3 平方和の有理数での表現 {#nt:three-squares-rational keywords="a in Q^x is a sum of three rational squares iff a > 0 and -a is not a square in Q_2" index="3 平方和（有理数）|さんへいほうわ" refname="3 平方和の有理数での表現"}
$a\in\mathbb{Q}^{\times}$ が $X_{1}^{2}+X_{2}^{2}+X_{3}^{2}$ で $\mathbb{Q}$ 上表される $\iff$ $a>0$ かつ $-a$ が $\mathbb{Q}_{2}$ の平方でない。
:::

::: intuition
有理数の 3 平方和で表せないのは、負の数と、$-a$ が 2 進数の平方になる数だけである。奇素数ではハッセ不変量が合っていて障害がない。
:::

::: proof
**Step 1（帰着）.** 【主張：すべての素点での表現に帰着する】\ref{nt:hasse-minkowski-corollaries} の 1 から、すべての $\mathbb{Q}_{v}$ で $a$ を表すことと同値。$\mathbb{R}$ では $a>0$ と同値。

**Step 2（奇素数）.** 【主張：奇素数ではすべての $a$ を表す】$d_{p}(f)=1$, $\varepsilon_{p}(f)=1$ で、$(-1,-d)_{p}=(-1,-1)_{p}=1=\varepsilon_{p}$ なので、\ref{nt:local-representation} の $n=3$ の場合から $f$ はすべての $a$ を表す。

**Step 3（$p=2$）.** 【主張：$\mathbb{Q}_{2}$ では $-a$ が平方でないことと同値】$(-1,-1)_{2}=-1\neq\varepsilon_{2}=1$ なので、\ref{nt:local-representation} から $f$ が $a$ を表す $\iff a\neq-d=-1$（平方類で）$\iff-a$ が $\mathbb{Q}_{2}$ の平方でない。
:::

## ダヴェンポート–カッセルスの補題 {#nt:sec-ts-davenport-cassels}

::: lemma ダヴェンポート–カッセルスの補題 {#nt:davenport-cassels keywords="Davenport-Cassels: if a positive definite integral quadratic form f satisfies: for every x in Q^p there is y in Z^p with f(x - y) < 1, then every integer represented by f over Q is represented over Z" index="ダヴェンポート–カッセルスの補題|だゔぇんぽーとかっせるすのほだい" refname="ダヴェンポート–カッセルスの補題"}
$f(X)=\sum_{i,j}a_{ij}X_{i}X_{j}$（$a_{ij}=a_{ji}\in\mathbb{Z}$）を正定値な形式とし、次を仮定する。

（H）各 $x\in\mathbb{Q}^{p}$ に $f(x-y)<1$ となる $y\in\mathbb{Z}^{p}$ がある。

このとき、$f$ が $\mathbb{Q}^{p}$ で表す整数 $n$ は、$\mathbb{Z}^{p}$ でも表される。
:::

::: intuition
有理数解 $x/t$ の分母 $t$ を小さくしていく降下法である。$x/t$ に最も近い格子点 $y$ を通る直線と「球面」$f=n$ のもう一つの交点を考えると、その分母は $t\cdot f(x/t-y)$ になり、(H) からもとの分母より真に小さい。分母 $1$ に達すれば整数解である。
:::

::: proof
**Step 1（設定）.** $u\cdot w\defeq\sum a_{ij}u_{i}w_{j}$ とすると $u\cdot u=f(u)$。$n=f(x/t)$, $x\in\mathbb{Z}^{p}$, $t\in\mathbb{Z}_{>0}$、すなわち $t^{2}n=x\cdot x$ となる組のうち $t$ が最小のものをとる。$t=1$ を示せばよい。

**Step 2（近い格子点）.** (H) から $x/t=y+z$, $y\in\mathbb{Z}^{p}$, $z\cdot z<1$ と書ける。$z\cdot z=0$ なら正定値性から $z=0$、$x/t\in\mathbb{Z}^{p}$ で、$t$ の最小性（$t=1$ と $x/t$ の組も条件をみたす）から $t=1$。

**Step 3（新しい解）.** 【主張：$z\cdot z\neq0$ なら $t'\defeq at+b$, $x'\defeq ax+by$（$a\defeq y\cdot y-n$, $b\defeq2(nt-x\cdot y)$）は $t'^{2}n=x'\cdot x'$ をみたす】$a,b,t'\in\mathbb{Z}$, $x'\in\mathbb{Z}^{p}$。$x\cdot x=t^{2}n$, $2x\cdot y=2nt-b$, $y\cdot y=n+a$ を使うと
$$
x'\cdot x'=a^{2}x\cdot x+2ab\,x\cdot y+b^{2}y\cdot y=a^{2}t^{2}n+ab(2nt-b)+b^{2}(n+a)=n(at+b)^{2}=t'^{2}n.
$$

**Step 4（分母の減少）.** 【主張：$0<t'<t$】
$$
tt'=at^{2}+bt=t^{2}y\cdot y-nt^{2}+2nt^{2}-2t\,x\cdot y=t^{2}y\cdot y-2t\,x\cdot y+x\cdot x=(ty-x)\cdot(ty-x)=t^{2}z\cdot z,
$$
よって $t'=t\,z\cdot z$ で、$0<z\cdot z<1$ から $0<t'<t$。$t'$ と $x'$ は Step 1 の条件をみたすので最小性に反する。よって $z\cdot z=0$ で $t=1$。
:::

## ガウスの 3 平方和定理 {#nt:sec-ts-gauss}

::: theorem ガウスの 3 平方和定理 {#nt:gauss-three-squares keywords="a positive integer n is a sum of three squares iff it is not of the form 4^a (8b - 1)" index="3 平方和定理|さんへいほうわていり, ガウスの 3 平方和定理|がうすのさんへいほうわていり" refname="ガウスの 3 平方和定理"}
正の整数 $n$ が 3 平方和 $\iff$ $n$ は $4^{a}(8b-1)$（$a,b\in\mathbb{Z}_{\ge0}$, $b\ge1$）の形でない。
:::

::: intuition
障害は 2 進だけにあり、「$-n$ が 2 進数の平方」という条件がちょうど $4^{a}(8b-1)$ の形である。それ以外の局所的な障害はなく、有理数の解から整数の解へは、立方体の格子 $\mathbb{Z}^{3}$ の「被覆半径」が $\sqrt3/2<1$ であることで降りられる。
:::

::: proof
**Step 1（$4^{a}(8b-1)$ の形 $\iff-n\in\mathbb{Q}_{2}^{\times2}$）.** 【主張：$4^{a}(8b-1)$ の形は $-n$ が 2 進平方であることと同値】$n=2^{e}m$（$m$ 奇数）とすると、\ref{nt:p-adic-squares} の 2 から $-n$ が平方 $\iff e$ が偶数で $-m\equiv1\pmod8$、すなわち $n=4^{e/2}m$, $m\equiv-1\pmod8$。

**Step 2（有理数での表現）.** 【主張：有理数の 3 平方和であるための条件】\ref{nt:three-squares-rational} から、$n$ が有理数の 3 平方和 $\iff$ $n$ が $4^{a}(8b-1)$ の形でない。特に必要性（整数の 3 平方和なら有理数の 3 平方和）が従う。

**Step 3（(H) の確認）.** 【主張：$X_{1}^{2}+X_{2}^{2}+X_{3}^{2}$ は条件 (H) をみたす】$x\in\mathbb{Q}^{3}$ について、$\abs{x_{i}-y_{i}}\le\frac12$ となる $y\in\mathbb{Z}^{3}$ をとれば $f(x-y)\le\frac34<1$。

**Step 4（十分性）.** 【主張：有理数の表示から整数の表示が得られる】Step 2 で有理数の 3 平方和なので、\ref{nt:davenport-cassels} から整数の 3 平方和。
:::

::: corollary 4 平方和と三角数 {#nt:three-squares-corollaries keywords="Lagrange: every positive integer is a sum of four squares; Gauss: every positive integer is a sum of three triangular numbers m(m+1)/2" index="三角数|さんかくすう" refname="4 平方和と三角数"}
1. （ラグランジュ）すべての正の整数は 4 平方和。
2. （ガウス）すべての正の整数は 3 つの三角数 $m(m+1)/2$（$m\ge0$）の和。
:::

::: intuition
3 平方和で表せない数も、$1$ を引けば表せるので 4 平方和になる。三角数の和は、$8n+3$ を 3 つの奇数の平方の和に書くことの言い換えである。
:::

::: proof
**Step 1（1）.** $n=4^{a}m$（$4\nmid m$）とする。$m\not\equiv7\pmod8$ なら $m$ は 3 平方和で、$n=(2^{a})^{2}m$ も 3 平方和。$m\equiv7\pmod8$ なら $m-1\equiv6\pmod8$ は 3 平方和（$m-1>0$）で、$m=(m-1)+1^{2}$ は 4 平方和、$n$ も。

**Step 2（2）.** $8n+3$ は $4^{a}(8b-1)$ の形でない（奇数で $\equiv3\pmod8$）ので $x_{1}^{2}+x_{2}^{2}+x_{3}^{2}=8n+3$。平方は $\bmod8$ で $0,1,4$ なので和が $3$ になるのは $x_{i}$ がすべて奇数のときだけ。$x_{i}=2m_{i}+1$（$m_{i}\ge0$ にとれる）とすると $\sum(4m_{i}^{2}+4m_{i}+1)=8n+3$ から $\sum m_{i}(m_{i}+1)/2=n$。
:::

::: example
$7=8\cdot1-1$, $28=4\cdot7$, $15=8\cdot2-1$ は 3 平方和でない。$6=4+1+1$, $14=9+4+1$, $27=25+1+1$ は 3 平方和。$7=4+1+1+1$ は 4 平方和。$10=3+6+1$（三角数 $T_{2}+T_{3}+T_{1}$）。
:::

::: hypcheck
- **ダヴェンポート–カッセルス**：正定値性は Step 2（$z\cdot z=0\Rightarrow z=0$）と Step 4（$0<z\cdot z$）に、(H) は $z\cdot z<1$ に本質的。$X^{2}+Y^{2}+16Z^{2}$ のように (H) が成り立たない形式では、有理数で表される整数が整数で表されないことがある：$X^{2}+Y^{2}+16Z^{2}$ は $\mathbb{Q}$ 上 $X^{2}+Y^{2}+Z^{2}$ と同値なので有理数で $3$ を表すが、整数では表さない（$z=0$ でなければ値は $16$ 以上、$z=0$ なら $x^{2}+y^{2}=3$ は解がない）。実際 $x=(0,0,\frac12)$ で $f(x-y)\ge4$ となり (H) が破れる。
- **3 平方和定理**：(H) は $3\cdot\frac14<1$ に依存し、$5$ 変数以上の $X_{1}^{2}+\dots+X_{k}^{2}$（$k\ge4$）では $k/4\ge1$ となり補題は直接は使えない（4 平方和は系の別の議論で示した）。
:::

## 問題 {#nt:sec-ts-problems}

::: problem {#nt:prob-ts-count-small}
$1\le n\le30$ で 3 平方和でない $n$ をすべて挙げよ。
:::

::: solution
$4^{a}(8b-1)\le30$：$a=0$ で $7,15,23$、$a=1$ で $28$。よって $7,15,23,28$。
:::

::: problem {#nt:prob-ts-two-squares-rational}
$a\in\mathbb{Q}_{>0}$ が 2 つの有理数の平方の和 $\iff$ すべての $p\equiv3\pmod4$ で $v_{p}(a)$ が偶数、を局所大域原理から示せ（$X^{2}+Y^{2}$ の $\mathbb{Q}_{p}$ での表現の条件 $(a,-1)_{p}=1$ を使う）。
:::

::: solution
\ref{nt:hasse-minkowski-corollaries} の 1 と \ref{nt:local-representation}（$n=2$, $d=1$, $\varepsilon=(1,1)=1$）から、条件はすべての $v$ で $(a,-1)_{v}=1$。$\infty$ では $a>0$ で成立。奇素数 $p$ では \ref{nt:hilbert-symbol-odd} から $(a,-1)_{p}=\bigl(\frac{-1}p\bigr)^{v_{p}(a)}$ で、$p\equiv1\pmod4$ なら $1$、$p\equiv3\pmod4$ なら $v_{p}(a)$ が偶数と同値。$p=2$ は積公式から他の素点の積で決まり自動的に $1$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 3 平方和定理の証明は、局所大域原理のうち 4 変数の形式 $X_{1}^{2}+X_{2}^{2}+X_{3}^{2}-aZ^{2}$ の場合を使う（したがってディリクレの算術級数定理を通る）。ガウスの元の証明は 3 元 2 次形式の理論による。

**前提を変えると.**
- **表し方の個数**：$n$ を 3 平方和で表す方法の数 $r_{3}(n)$ は、虚 2 次体 $\mathbb{Q}(\sqrt{-n})$ の類数と関係する（ガウス）。たとえば平方因子をもたない $n>1$, $n\equiv1,2\pmod4$ では $r_{3}(n)=12h(-4n)$。ここでは証明しない。
- **ダヴェンポート–カッセルスの条件**をみたす形式は限られる（ユークリッド的な形式）。一般の正定値形式では、有理数で表される整数と整数で表される整数の違いは「種」と「類」の違いとして現れ、種の中の類が一つ（類数 $1$）の形式だけで局所大域原理が整数でも成り立つ。
- **15 定理・290 定理**：正定値な整係数の形式がすべての正の整数を表すことは、$1$ から $290$ までの整数を表すことと同値である（バーガヴァ–ハンケ）。ここでは証明しない。

**高い視点から：有理点から整点へ.** ハッセ–ミンコフスキーの定理は「有理点」の存在を局所的に判定するが、「整点」の存在にはさらに幾何的な議論が要る。ダヴェンポート–カッセルスの補題は、2 次曲面上の有理点 $x/t$ と格子点 $y$ を結ぶ直線と曲面の第 2 交点を使う「割線法」で、分母の大きさを高さ関数とみなして高さを下げていく降下法である。比喩で言えば、球面の上の有理点という「霧のかかった点」を、整数格子という「足場」に一歩ずつ下ろしていく作業で、足場の間隔が球の大きさより細かい（被覆半径 $<1$）ことが降りきれる条件になる。
:::
