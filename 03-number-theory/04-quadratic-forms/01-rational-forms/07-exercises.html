# 演習：有理数体上の 2 次形式 {#nt:page-exercises-rational-forms keywords="exercises, Witt index, totally isotropic subspaces, zeros of quadratic forms over finite fields, square classes of Q_3, 2-adic Hilbert symbols, isotropy of sums of three squares, anisotropic ternary forms, local obstructions, realization of invariants, sums of three squares"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#nt:sec-exqf-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$H$ は双曲形式 $X_{1}X_{2}\sim X_{1}^{2}-X_{2}^{2}$。
:::

## 2 次空間とヴィットの定理 {#nt:sec-qs-exercises}

対応するページ：\ref{nt:page-quadratic-spaces}

::: problem ★ 基本：判別式とヴィット指数 {#nt:ex-qs-witt-index}
$\mathbb{Q}$ 上の形式 $X_{1}X_{2}+X_{3}^{2}$ の判別式（$\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ の元）とヴィット指数を求めよ。
:::

::: solution
$X_{1}X_{2}$ の行列は $\frac12\begin{pmatrix}0&1\\1&0\end{pmatrix}$ で行列式 $-\frac14$、$X_{3}^{2}$ は $1$。判別式は $-\frac14\equiv-1$。$X_{1}X_{2}$ は双曲形式で、残り $X_{3}^{2}$ は非等方的なので、ヴィット分解は $H\oplus X^{2}$、ヴィット指数は $1$。
:::

::: problem ★★ 標準：全等方部分空間 {#nt:ex-qs-totally-isotropic}
$(V,Q)$ を $n$ 次元の非退化な 2 次空間とし、$W$ を $m$ 次元の等方部分空間（$Q|_{W}=0$）とする。$m\le n/2$ で、$V\cong mH\mathbin{\perp} V'$（$V'$ は非退化）となることを示せ。
:::

::: solution
$W\subseteq W^{\perp}$ と $\dim W^{\perp}=n-m$（\ref{nt:nondegenerate-orthogonal}）から $m\le n-m$。後半は $m$ についての帰納法。$0\neq x_{1}\in W$ をとり、$x_{1}\cdot z=1$ となる $z$ から \ref{nt:isotropic-hyperbolic} の構成で双曲平面 $H_{1}=kx_{1}+ky_{1}$（$x_{1}\cdot y_{1}=1$, $y_{1}$ 等方）を作る。$W'\defeq W\cap y_{1}^{\perp}$ は、$u\mapsto u\cdot y_{1}$ が $W$ 上で $0$ でない（$x_{1}\mapsto1$）ので $m-1$ 次元で、$x_{1}\notin W'$。$W$ は等方なので $W'\subseteq x_{1}^{\perp}$、したがって $W'\subseteq H_{1}^{\perp}$。$H_{1}^{\perp}$ は非退化で $W'$ はその $m-1$ 次元の等方部分空間なので、帰納法の仮定から $H_{1}^{\perp}\cong(m-1)H\mathbin{\perp} V'$。
:::

## 有限体上の 2 次形式 {#nt:sec-ff-exercises}

対応するページ：\ref{nt:page-finite-field-forms}

::: problem ★ 基本：$X^{2}+Y^{2}$ の零点の個数 {#nt:ex-ff-zeros}
奇素数 $p$ について、$x^{2}+y^{2}=0$ となる $(x,y)\in\mathbb{F}_{p}^{2}$ の個数を求めよ。
:::

::: solution
$y=0$ なら $x=0$ の 1 個。$y\neq0$ なら $(x/y)^{2}=-1$ で、$-1$ が平方（$p\equiv1\pmod4$, \ref{nt:euler-criterion}）なら $x/y$ は 2 通り、そうでなければ 0 通り。よって $p\equiv1\pmod4$ で $1+2(p-1)=2p-1$ 個、$p\equiv3\pmod4$ で $1$ 個。どちらも $\bmod p$ で $\not\equiv0$ だが、変数 2 個・次数 2 で \ref{nt:chevalley-warning} の仮定（$2<n$）をみたさないので矛盾しない。
:::

::: problem ★★ 標準：単数係数の形式は $0$ を表す {#nt:ex-ff-unit-forms}
$p$ を奇素数、$a_{1},a_{2},a_{3}\in\mathbb{Z}_{p}^{\times}$ とする。$a_{1}X_{1}^{2}+a_{2}X_{2}^{2}+a_{3}X_{3}^{2}$ は $\mathbb{Q}_{p}$ で $0$ を表すことを、シュヴァレーの定理とヘンゼルの補題で示せ。また、ハッセ不変量の判定（\ref{nt:local-isotropy}）でも確かめよ。
:::

::: solution
\ref{nt:finite-field-conic} から $\bmod p$ の自明でない零点 $(x_{1},x_{2},x_{3})$ があり、たとえば $x_{1}\not\equiv0$。$x_{2},x_{3}$ を整数の持ち上げで固定すると、$g(X)=a_{1}X^{2}+a_{2}x_{2}^{2}+a_{3}x_{3}^{2}$ は $g(x_{1})\equiv0$, $g'(x_{1})=2a_{1}x_{1}\not\equiv0$ なので、\ref{nt:hensel-lemma} から根がある。判定：$d$ は単数で $\varepsilon=\prod(a_{i},a_{j})_{p}=1$、$(-1,-d)_{p}=1$（単数どうし、\ref{nt:hilbert-symbol-odd}）なので条件 $(-1,-d)=\varepsilon$ をみたす。
:::

## 平方類とヒルベルト記号 {#nt:sec-hs-exercises}

対応するページ：\ref{nt:page-hilbert-symbol-squares}

::: problem ★ 基本：$\mathbb{Q}_{3}$ の平方類 {#nt:ex-hs-q3-classes}
$\mathbb{Q}_{3}^{\times}/\mathbb{Q}_{3}^{\times2}$ の代表系 $\{1,3,2,6\}$ について、$2,7,18,-3,12$ がそれぞれどの類に入るか答えよ。
:::

::: solution
$\bmod3$ の平方は $1$。$2$：単数で $2\bmod3$ は非平方なので類 $2$。$7$：$7\equiv1$ で類 $1$。$18=9\cdot2$ で類 $2$。$-3=3\cdot(-1)$、$-1\equiv2$ は非平方なので類 $6$。$12=3\cdot4$ で類 $3$。
:::

::: problem ★★ 標準：2 進記号の計算と直接の確認 {#nt:ex-hs-two-adic}
$(6,10)_{2}$ を \ref{nt:hilbert-symbol-two-proof} で求め、$z^{2}=6x^{2}+10y^{2}$ の自明でない有理数解を見つけて確かめよ。$(3,-1)_{2}$ についても公式で求め、$z^{2}=3x^{2}-y^{2}$ が $\mathbb{Q}_{2}$ で自明な解しかもたないことを $\bmod4$ で確かめよ。
:::

::: solution
$6=2\cdot3$, $10=2\cdot5$：指数は $\varepsilon(3)\varepsilon(5)+\omega(5)+\omega(3)=1\cdot0+1+1\equiv0$ で $(6,10)_{2}=1$。実際 $(z,x,y)=(4,1,1)$：$16=6+10$。$(3,-1)_{2}=(-1)^{\varepsilon(3)\varepsilon(-1)}=-1$。原始解 $(z,x,y)$ があれば $z^{2}+y^{2}\equiv3x^{2}\pmod4$。$x$ が奇数なら右辺 $\equiv3$ だが左辺は $0,1,2$；$x$ が偶数なら $z^{2}+y^{2}\equiv0$ から $z,y$ も偶数で原始性に反する。
:::

## $p$ 進体上の 2 次形式 {#nt:sec-lf2-exercises}

対応するページ：\ref{nt:page-local-forms}

::: problem ★ 基本：3 平方の和が $0$ になる素点 {#nt:ex-lf2-three-squares}
$X^{2}+Y^{2}+Z^{2}$ が $\mathbb{Q}_{v}$ で $0$ を表す素点 $v$ をすべて求めよ。
:::

::: solution
$d=1$, $\varepsilon=1$ で、条件は $(-1,-1)_{v}=1$。奇素数では成り立ち、$v=2$ と $v=\infty$ では $(-1,-1)_{v}=-1$ で成り立たない。よって奇素数 $p$ でだけ $0$ を表す（障害は $2,\infty$ の 2 か所で、積公式と整合）。
:::

::: problem ★★ 標準：非等方な 3 変数の形式の個数 {#nt:ex-lf2-anisotropic-ternary}
$\mathbb{Q}_{p}$ 上、$0$ を表さない 3 変数の非退化な形式の同値類の個数を求めよ（$p$ 奇数と $p=2$）。
:::

::: solution
\ref{nt:local-isotropy} の 2 から、$0$ を表さない $\iff\varepsilon=-(-1,-d)$。判別式 $d$ ごとにちょうど一つの $\varepsilon$ の値で、\ref{nt:local-invariants-realization}（$n=3$ はすべての $(d,\varepsilon)$ が実現）と \ref{nt:local-classification} から各 $d$ に一つの類。よって $\abs{\mathbb{Q}_{p}^{\times}/\mathbb{Q}_{p}^{\times2}}$ 個：$p$ 奇数で $4$、$p=2$ で $8$。
:::

## ハッセ–ミンコフスキーの定理 {#nt:sec-hm-exercises}

対応するページ：\ref{nt:page-hasse-minkowski}

::: problem ★★ 標準：局所的な障害の発見 {#nt:ex-hm-obstruction}
$X^{2}+5Y^{2}-3Z^{2}$ が $\mathbb{Q}$ で $0$ を表すか判定し、障害のある素点をすべて求めよ。
:::

::: solution
$d=-15$, $-d=15$。$\varepsilon_{v}=(1,5)(1,-3)(5,-3)=(5,-3)_{v}$。条件は $(-1,15)_{v}=(5,-3)_{v}$。$v=3$：$(-1,15)_{3}=\bigl(\frac{-1}3\bigr)=-1$, $(5,-3)_{3}=\bigl(\frac53\bigr)=-1$ で成立。$v=5$：$(-1,15)_{5}=\bigl(\frac{-1}5\bigr)=1$, $(5,-3)_{5}=\bigl(\frac{-3}5\bigr)=\bigl(\frac25\bigr)=-1$ で不成立。$v=2$：$(-1,15)_{2}=(-1)^{\varepsilon(-1)\varepsilon(15)}=-1$, $(5,-3)_{2}=(-1)^{\varepsilon(5)\varepsilon(-3)}=1$ で不成立。他の奇素数では両辺 $1$、$\infty$ では不定値で成立。障害は $2$ と $5$ で、$\mathbb{Q}$ では $0$ を表さない。（$\bmod5$ で $x^{2}\equiv3z^{2}$、$3$ は $\bmod5$ の非平方、からも直接わかる。）
:::

::: problem ★★★ 発展：指定した不変量の形式 {#nt:ex-hm-realization}
$\mathbb{Q}$ 上、判別式 $-1$、符号数 $(2,1)$ で、$\varepsilon_{v}=-1$ となるのがちょうど $v=3,5$ である 3 変数の形式が存在することを示し、それが $0$ を表さないことを示せ。また、判別式 $1$・符号数 $(2,1)$ の形式は存在しないことを確かめよ。
:::

::: solution
\ref{nt:rational-invariants-realization} の条件を確かめる。(1) 有限個を除いて $1$ で $\prod\varepsilon_{v}=(-1)(-1)\varepsilon_{\infty}$、(5) から $\varepsilon_{\infty}=(-1)^{s(s-1)/2}=1$（$s=1$）なので積は $1$。(2) $n=3$ なので制約なし。(3) $2+1=3$。(4) $d_{\infty}=-1=(-1)^{1}$。よって存在する。$v=3$ で $(-1,-d)_{3}=(-1,1)_{3}=1\neq\varepsilon_{3}$ なので（\ref{nt:local-isotropy} の 2）$\mathbb{Q}_{3}$ で $0$ を表さず、$\mathbb{Q}$ でも表さない。判別式 $1$ なら (4) から $(-1)^{s}=1$ で $s$ は偶数なので、$s=1$ は不可能。
:::

## 3 平方和定理 {#nt:sec-ts-exercises}

対応するページ：\ref{nt:page-three-squares}

::: problem ★ 基本：2023 と 2027 {#nt:ex-ts-2023}
$2023$ と $2027$ が 3 平方和かどうか判定し、3 平方和なら表示を一つ与えよ。
:::

::: solution
$2023=8\cdot252+7$ は $4^{0}(8b-1)$ の形なので 3 平方和でない。$2027\equiv3\pmod8$ なので 3 平方和で、$2027=43^{2}+13^{2}+3^{2}=1849+169+9$。
:::

::: problem ★★ 標準：必要性の初等的な証明 {#nt:ex-ts-necessity}
$4^{a}(8b-1)$ の形の数が 3 平方和でないことを、$\bmod8$ の計算と $a$ についての帰納法で直接示せ。
:::

::: solution
平方は $\bmod8$ で $0,1,4$ なので、3 つの和は $7$ にならない（$a=0$）。$a\ge1$ で $x^{2}+y^{2}+z^{2}=4n'$ なら、平方は $\bmod4$ で $0,1$ なので $x,y,z$ はすべて偶数で、$(x/2)^{2}+(y/2)^{2}+(z/2)^{2}=n'=4^{a-1}(8b-1)$。帰納法の仮定に反する。
:::
