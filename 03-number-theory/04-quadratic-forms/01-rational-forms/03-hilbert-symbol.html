# 平方類とヒルベルト記号 {#nt:page-hilbert-symbol-squares keywords="squares in Q_p, p odd: p^n u is a square iff n even and u mod p is a square; p = 2: iff n even and u = 1 mod 8; square classes Q_p^x / Q_p^x2 of order 4 or 8, representatives 1, p, u, up and +-1, +-5, +-2, +-10; homomorphisms epsilon and omega on Z_2^x; proof of the 2-adic formula for the Hilbert symbol; bilinearity and nondegeneracy of the Hilbert symbol on k^x / k^x2 for k = R, Q_p; norm groups of quadratic extensions have index 2"}

$\mathbb{Q}_{p}$ の元が平方かどうかは、$p$ の指数の偶奇と、単数部分の「低い桁」だけで決まる：$p$ が奇数なら $\bmod p$、$p=2$ なら $\bmod8$ で判定できる。その結果、平方類の群 $\mathbb{Q}_{p}^{\times}/\mathbb{Q}_{p}^{\times2}$ は位数 $4$（$p=2$ なら $8$）の $\mathbb{F}_{2}$ ベクトル空間になり、ヒルベルト記号はその上の**非退化な対称双線形形式**になる。このページでは、局所体の系列で事実として述べた 2 進のヒルベルト記号の明示公式（\ref{nt:hilbert-symbol-two}）を証明し、非退化性を示す。次のページで $p$ 進体上の 2 次形式を分類するとき、この非退化性が数え上げの鍵になる。

## 記法と定義の確認 {#nt:sec-hs-notation}

::: notation
- $p$ は素数、$U\defeq\mathbb{Z}_{p}^{\times}$, $U_{n}\defeq1+p^{n}\mathbb{Z}_{p}$。$\mathbb{Q}_{p}^{\times}$ の元は $p^{n}u$（$n\in\mathbb{Z}$, $u\in U$）と一意に書ける（\ref{nt:p-adic-integers}）。$\mathbb{Z}_{p}/p^{n}\mathbb{Z}_{p}\cong\mathbb{Z}/p^{n}$。
- 単根の持ち上げは \ref{nt:hensel-lemma}。ルジャンドル記号と第 1・第 2 補充法則は \ref{nt:legendre-symbol}, \ref{nt:euler-criterion}, \ref{nt:second-supplementary}。$u\in U$ について $\bigl(\frac up\bigr)$ は $u\bmod p$ のルジャンドル記号。
- ヒルベルト記号 $(a,b)_{v}$ とその基本性質（$(a,b)=1\iff a$ が $\mathbb{Q}_{v}(\sqrt b)$ のノルム、平方類だけで決まる、対称、$(a,-a)=1$, $(a,b)=(a,-ab)$、$(a,b)=1$ なら $(aa',b)=(a',b)$）、奇素数の明示公式は \ref{nt:hilbert-symbol}, \ref{nt:hilbert-symbol-basic}, \ref{nt:hilbert-symbol-odd}。$k$ は $\mathbb{R}$ か $\mathbb{Q}_{p}$ を表す。
- $\mathbb{Q}_{p}^{3}$ の元 $(z,x,y)$ は、成分がすべて $\mathbb{Z}_{p}$ に入り、少なくとも一つが単数のとき**原始的**という。斉次方程式の自明でない解は、$p$ の冪を掛けて原始的にできる。
- 体系は $\ZF$。
:::

## $\mathbb{Q}_{p}$ の平方 {#nt:sec-hs-squares}

::: theorem $p$ 進数の平方 {#nt:p-adic-squares keywords="for p odd, p^n u is a square in Q_p iff n is even and u mod p is a square in F_p; for p = 2, p^n u is a square iff n is even and u = 1 mod 8; Q_p^x2 is open" index="p 進数の平方|ぴーしんすうのへいほう" refname="p 進数の平方"}
$x=p^{n}u\in\mathbb{Q}_{p}^{\times}$（$u\in U$）とする。
1. $p\neq2$ なら、$x$ が平方 $\iff$ $n$ が偶数で $\bigl(\frac up\bigr)=1$。
2. $p=2$ なら、$x$ が平方 $\iff$ $n$ が偶数で $u\equiv1\pmod8$。
3. いずれの場合も $\mathbb{Q}_{p}^{\times2}$ は $\mathbb{Q}_{p}^{\times}$ の開部分群である。
:::

::: intuition
奇素数では、$u\bmod p$ が平方なら、ヘンゼルの補題でその平方根を桁ごとに持ち上げられる。$p=2$ では平方根の微分 $2x$ が $2$ で割れてしまうので持ち上げが 1 桁ずつ遅れ、$\bmod 8$ まで見ないと判定できない（奇数の平方はすべて $1\bmod8$）。
:::

::: proof
**Step 1（指数）.** $x=y^{2}$, $y=p^{m}w$ なら $n=2m$, $u=w^{2}$。よってどちらの場合も「$n$ が偶数で $u$ が $U$ の中の平方」と同値。

**Step 2（$p\neq2$）.** 【主張：$u\in U$ が平方 $\iff\bigl(\frac up\bigr)=1$】⇒ は還元から。⇐：$a^{2}\equiv u\pmod p$ となる整数 $a$（$p\nmid a$）をとると、$f(X)=X^{2}-u$ は $f(a)\equiv0$, $f'(a)=2a\not\equiv0\pmod p$ なので、\ref{nt:hensel-lemma} から根がある。

**Step 3（$p=2$：必要性）.** 奇数 $w$ について $w^{2}-1=(w-1)(w+1)$ は連続する偶数の積なので $8$ の倍数。$\mathbb{Z}_{2}$ でも $w\bmod8$ で同じ計算ができるので $w^{2}\equiv1\pmod8$。

**Step 4（$p=2$：十分性）.** 【主張：$u\equiv1\pmod8$ なら $u$ は平方】$k\ge3$ について $x_{k}^{2}\equiv u\pmod{2^{k}}$ となる奇数 $x_{k}\in\mathbb{Z}$ を帰納的に作る。$x_{3}=1$。$x_{k}^{2}\equiv u\pmod{2^{k+1}}$ なら $x_{k+1}=x_{k}$、そうでなければ $x_{k}^{2}\equiv u+2^{k}\pmod{2^{k+1}}$ で、$x_{k+1}\defeq x_{k}+2^{k-1}$ とすると $x_{k+1}^{2}=x_{k}^{2}+2^{k}x_{k}+2^{2k-2}\equiv x_{k}^{2}+2^{k}\equiv u\pmod{2^{k+1}}$（$x_{k}$ は奇数、$2k-2\ge k+1$）。$x_{k+1}\equiv x_{k}\pmod{2^{k-1}}$ なので $(x_{k})$ は $\mathbb{Z}_{2}$ でコーシー列で、極限 $x$ は $x^{2}=u$。

**Step 5（3）.** $\mathbb{Q}_{p}^{\times2}$ は、$p\neq2$ では $U_{1}$、$p=2$ では $U_{3}$ を含む（Step 2・4）。これらは $\mathbb{Q}_{p}^{\times}$ の開部分群なので、それを含む部分群も開（剰余類の和）。
:::

::: corollary 平方類の群 {#nt:p-adic-square-classes keywords="Q_p^x / Q_p^x2 is an F_2-vector space of dimension 2 (p odd) with representatives 1, p, u, up, and of dimension 3 (p = 2) with representatives +-1, +-5, +-2, +-10; R^x / R^x2 = {+-1}" index="平方類|へいほうるい" refname="平方類の群"}
1. $p\neq2$ なら $\mathbb{Q}_{p}^{\times}/\mathbb{Q}_{p}^{\times2}$ は位数 $4$ で、$\bigl(\frac up\bigr)=-1$ となる $u\in U$ について $\{1,p,u,up\}$ が代表系。
2. $\mathbb{Q}_{2}^{\times}/\mathbb{Q}_{2}^{\times2}$ は位数 $8$ で、$\{\pm1,\pm5,\pm2,\pm10\}$ が代表系。
3. $\mathbb{R}^{\times}/\mathbb{R}^{\times2}=\{\pm1\}$。
:::

::: intuition
$\mathbb{Q}_{p}$ の元を平方を除いて見ると、$p$ の指数の偶奇と単数の「平方かどうか」だけが残る。$p=2$ では単数の側が $\bmod8$ の 4 通りになるので、全部で 8 通りになる。
:::

::: proof
\ref{nt:p-adic-squares} から、平方類は $n\bmod2$ と、$p\neq2$ では $u\bmod p$ の平方類（$\mathbb{F}_{p}^{\times}/\mathbb{F}_{p}^{\times2}$、位数 2：\ref{nt:finite-field-squares}）、$p=2$ では $u\bmod8\in(\mathbb{Z}/8)^{\times}=\{\pm1,\pm5\}$（位数 4）で決まり、すべての組合せが現れる。すべての元が位数 $2$ なので $\mathbb{F}_{2}$ ベクトル空間。$\mathbb{R}$ は明らか。
:::

::: definition 2 進単数の準同型 $\varepsilon$, $\omega$ {#nt:epsilon-omega keywords="epsilon(u) = (u-1)/2 mod 2 and omega(u) = (u^2-1)/8 mod 2 for 2-adic units; homomorphisms U -> Z/2; u is a square iff epsilon(u) = omega(u) = 0" index="ε と ω（2 進単数）|いぷしろんとおめが" refname="ε と ω"}
$u\in\mathbb{Z}_{2}^{\times}$ について $\varepsilon(u)\defeq\frac{u-1}{2}\bmod2$, $\omega(u)\defeq\frac{u^{2}-1}{8}\bmod2$（$\in\mathbb{Z}/2$）。$\varepsilon(u)=0\iff u\equiv1\pmod4$、$\omega(u)=0\iff u\equiv\pm1\pmod8$。$\varepsilon,\omega:\mathbb{Z}_{2}^{\times}\to\mathbb{Z}/2$ は準同型で、$u$ が平方 $\iff\varepsilon(u)=\omega(u)=0$。
:::

::: intuition
$\varepsilon(u)$ は $u$ が $3\bmod4$ かどうか、$\omega(u)$ は $u$ が $\pm3\bmod8$ かどうかを記録する。これらは平方剰余の相互法則の符号と第 2 補充法則の符号そのものである。
:::

::: proof
値は $u\bmod8$ だけで決まり、表から上の特徴付けを得る。$\varepsilon$：$\bmod4$ の剰余類 $\{\pm1\}$ の積と一致。$\omega$：$(uv)^{2}-1=(u^{2}-1)(v^{2}-1)+(u^{2}-1)+(v^{2}-1)$ で、第 1 項は $64$ の倍数なので $8$ で割ると $\omega(uv)=\omega(u)+\omega(v)$。最後は \ref{nt:p-adic-squares} の 2。
:::

## 2 進のヒルベルト記号 {#nt:sec-hs-two}

::: lemma 原始解の形 {#nt:primitive-solution-units keywords="if z^2 - p x^2 - v y^2 = 0 (v a p-adic unit) has a nontrivial solution, it has one with z, y units and x in Z_p" index="原始解|げんしかい"}
$v\in U$ とする。$z^{2}-px^{2}-vy^{2}=0$ が自明でない解をもてば、$z,y\in U$, $x\in\mathbb{Z}_{p}$ となる解がある（$p=2$ を含む）。
:::

::: proof
原始解 $(z,x,y)$ をとる。$y\equiv0$ または $z\equiv0\pmod p$ とすると、$z^{2}\equiv vy^{2}\pmod p$ と $v\not\equiv0$ から両方 $\equiv0$。すると $px^{2}=z^{2}-vy^{2}\equiv0\pmod{p^{2}}$ で $x\equiv0\pmod p$ となり、原始的であることに反する。
:::

::: theorem 2 進のヒルベルト記号 {#nt:hilbert-symbol-two-proof keywords="proof of the 2-adic Hilbert symbol formula (2^alpha u, 2^beta v)_2 = (-1)^{eps(u)eps(v) + alpha omega(v) + beta omega(u)}; cases of units, (2, v) = (-1)^{omega(v)}, (2u, v), (2u, 2v)" index="ヒルベルト記号の明示公式（2 進）|ひるべるときごうのめいじこうしき" refname="2 進のヒルベルト記号の明示公式"}
$a=2^{\alpha}u$, $b=2^{\beta}v$（$u,v\in\mathbb{Z}_{2}^{\times}$）について
$$
(a,b)_{2}=(-1)^{\varepsilon(u)\varepsilon(v)+\alpha\,\omega(v)+\beta\,\omega(u)}.
$$
:::

::: intuition
2 進では、単数どうしの記号は「両方が $3\bmod4$ か」で決まり（$\mathbb{Z}/4$ の上の $x^{2}+y^{2}+z^{2}$ の零点の問題）、$2$ との記号は「$\pm3\bmod8$ か」で決まる（第 2 補充法則と同じ条件）。平方剰余の相互法則の符号と第 2 補充法則が、ちょうどこの 2 つの項として現れる。
:::

::: proof
**Step 0（帰着）.** 両辺は $\alpha,\beta$ の偶奇と $u,v$ の平方類だけで決まり（右辺は $\varepsilon,\omega$ が平方で $0$）、対称なので、$(\alpha,\beta)=(0,0),(1,0),(1,1)$ を示せばよい。

**Step 1（$\alpha=\beta=0$）.** 【主張：$(u,v)=-1\iff u\equiv v\equiv3\pmod4$】$u\equiv1\pmod8$ なら $u$ は平方で $(u,v)=1$。$u\equiv5\pmod8$ なら $u+4v\equiv1\pmod8$ なので $u+4v=w^{2}$（$w\in\mathbb{Z}_{2}$）で、$(z,x,y)=(w,1,2)$ が $z^{2}-ux^{2}-vy^{2}=0$ の解、$(u,v)=1$。対称性から $v\equiv1\pmod4$ でも $1$。$u\equiv v\equiv3\pmod4$ で原始解 $(z,x,y)$ があるとすると、$z^{2}+x^{2}+y^{2}\equiv z^{2}-ux^{2}-vy^{2}\equiv0\pmod4$。平方は $\bmod4$ で $0,1$ なので $z,x,y$ はすべて偶数で、原始性に反する。よって $(u,v)=-1$。これは $(-1)^{\varepsilon(u)\varepsilon(v)}$ に等しい。

**Step 2（$(2,v)=(-1)^{\omega(v)}$）.** 【主張：$(2,v)=1\iff v\equiv\pm1\pmod8$】$(2,v)=1$ なら \ref{nt:primitive-solution-units}（$p=2$）から $z,y$ が単数の解 $z^{2}-2x^{2}-vy^{2}=0$ があり、$z^{2}\equiv y^{2}\equiv1\pmod8$ なので $1-2x^{2}-v\equiv0\pmod8$。$2x^{2}\bmod8\in\{0,2\}$ なので $v\equiv1$ か $-1\pmod8$。逆に $v\equiv1\pmod8$ なら平方。$v\equiv-1\pmod8$ なら $2+v\equiv1\pmod8$ は平方 $z^{2}$ で、$(z,1,1)$ が解。

**Step 3（$\alpha=1,\beta=0$）.** 【主張：$(2u,v)=(2,v)(u,v)$】$(2,v)=1$ または $(u,v)=1$ なら、基本性質（$(a,b)=1$ なら $(aa',b)=(a',b)$）から成り立つ。残りは $(2,v)=(u,v)=-1$、すなわち $v\equiv3\pmod8$, $u\equiv3$ または $7\pmod8$ の場合で、平方類を取り替えて $(u,v)=(-1,3)$ または $(3,-5)$ としてよい。$z^{2}+2x^{2}-3y^{2}=0$ と $z^{2}-6x^{2}+5y^{2}=0$ はどちらも $(1,1,1)$ を解にもつので $(2u,v)=1=(2,v)(u,v)$。Step 1・2 から $(2u,v)=(-1)^{\varepsilon(u)\varepsilon(v)+\omega(v)}$。

**Step 4（$\alpha=\beta=1$）.** 【主張：$(2u,2v)=(-1)^{\varepsilon(u)\varepsilon(v)+\omega(u)+\omega(v)}$】$(a,b)=(a,-ab)$ から $(2u,2v)=(2u,-4uv)=(2u,-uv)$。Step 3 から指数は $\varepsilon(u)\varepsilon(-uv)+\omega(-uv)$。$\varepsilon(-1)=1$, $\omega(-1)=0$ と準同型性から $\varepsilon(-uv)=1+\varepsilon(u)+\varepsilon(v)$, $\omega(-uv)=\omega(u)+\omega(v)$。$\varepsilon(u)(1+\varepsilon(u))=0$（$\mathbb{Z}/2$ で $x^{2}=x$）なので指数は $\varepsilon(u)\varepsilon(v)+\omega(u)+\omega(v)$。
:::

::: theorem ヒルベルト記号の非退化性 {#nt:hilbert-symbol-nondegenerate keywords="the Hilbert symbol is a nondegenerate symmetric bilinear form on the F_2-vector space k^x / k^x2 for k = R, Q_p; if b is not a square then N(k(sqrt b)^x) has index 2 in k^x" index="ヒルベルト記号の非退化性|ひるべるときごうのひたいかせい" refname="ヒルベルト記号の非退化性"}
$k=\mathbb{R}$ または $\mathbb{Q}_{p}$ とする。
1. ヒルベルト記号は $\mathbb{F}_{2}$ ベクトル空間 $k^{\times}/k^{\times2}$ 上の対称双線形形式で、非退化である：$(a,b)=1$ がすべての $a$ で成り立てば $b\in k^{\times2}$。
2. $b\notin k^{\times2}$ なら $N(k(\sqrt b)^{\times})$ は $k^{\times}$ の指数 $2$ の部分群。
:::

::: intuition
平方類の空間の上で、ヒルベルト記号は「どの非自明な元も、ある元と $-1$ を組む」非退化な内積である。特に、平方でない $b$ について、$\sqrt b$ を添加した 2 次拡大のノルムはちょうど半分の平方類を占める。
:::

::: proof
**Step 1（双線形性）.** $\mathbb{R}$ では $(a,b)=-1\iff a,b<0$（\ref{nt:hilbert-symbol-basic} の 3）で、符号の準同型の積。$p\neq2$ では \ref{nt:hilbert-symbol-odd}。$p=2$ では \ref{nt:hilbert-symbol-two-proof} の右辺が、$\alpha,\beta$ と準同型 $\varepsilon,\omega$ について双線形。

**Step 2（非退化性）.** 【主張：$1$ でない各平方類 $a$ に $(a,b)=-1$ となる $b$ がある】$\mathbb{R}$：$a=-1$, $b=-1$。$p\neq2$（代表 $p,u,up$、$\bigl(\frac up\bigr)=-1$）：$(p,u)=\bigl(\frac up\bigr)=-1$、$(u,p)=-1$、$(up,u)=(u,u)(p,u)=1\cdot(-1)=-1$（\ref{nt:hilbert-symbol-odd}）。$p=2$：$a=2u$ には $b=5$（指数 $\varepsilon(5)\varepsilon(u)+\omega(5)=0+1$）、$a=5$ には $b=2$、$a=-1$ と $a=-5$ には $b=-1$（指数 $\varepsilon(a)\varepsilon(-1)=1$）。

**Step 3（2）.** $\phi_{b}(a)\defeq(a,b)$ は準同型 $k^{\times}\to\{\pm1\}$ で、核は $N(k(\sqrt b)^{\times})$（\ref{nt:hilbert-symbol-basic} の 1）、非退化性から全射。
:::

::: example
$\mathbb{Q}_{2}$ の基底 $\{2,-1,5\}$ について、$[a,b]\in\mathbb{Z}/2$ を $(a,b)=(-1)^{[a,b]}$ で定めると、その行列は
$$
\begin{pmatrix}0&0&1\\0&1&0\\1&0&0\end{pmatrix}
$$
（$(2,2)=(2,-1)=1$, $(2,5)=-1$, $(-1,-1)=-1$, $(-1,5)=(5,5)=1$）で、行列式 $\neq0$ から非退化が見える。
:::

::: hypcheck
- **$p$ 進数の平方**：$p\neq2$ ではヘンゼルの補題の単根条件 $2a\not\equiv0$ が本質的。$p=2$ では単根条件が成り立たないので、Step 4 で $\bmod8$ から始める逐次近似に置き換えた（$\bmod4$ の $5$ は平方でない）。
- **2 進のヒルベルト記号**：完備性は Step 1・2 の平方根の存在（\ref{nt:p-adic-squares}）を通して使った。$\mathbb{Q}$ では $(u,v)$ に対応する $z^{2}=ux^{2}+vy^{2}$ の可解性は局所的な条件だけでは決まらず、すべての素点の情報が要る（ハッセ–ミンコフスキー）。
- **非退化性**：平方類の代表系の完全性（\ref{nt:p-adic-square-classes}）に依存する。
:::

## 問題 {#nt:sec-hs-problems}

::: problem {#nt:prob-hs-seven-sqrt}
$7$ は $\mathbb{Q}_{3}$, $\mathbb{Q}_{2}$, $\mathbb{Q}_{7}$ のそれぞれで平方か。$-7$ についてはどうか。
:::

::: solution
$\mathbb{Q}_{3}$：$7\equiv1\pmod3$ は平方剰余なので平方。$-7\equiv2\pmod3$ は非剰余で平方でない。$\mathbb{Q}_{2}$：$7\equiv7\pmod8$ で平方でなく、$-7\equiv1\pmod8$ で平方。$\mathbb{Q}_{7}$：どちらも $7$ の指数が $1$（奇数）で平方でない。
:::

::: problem {#nt:prob-hs-two-three}
$(3,3)_{2}$, $(2,3)_{2}$, $(-1,3)_{2}$ を公式で求め、$(3,3)_{2}=(-1,3)_{2}$ が $(a,a)=(a,-1)$ と整合することを確かめよ。
:::

::: solution
$\varepsilon(3)=1$, $\omega(3)=1$, $\varepsilon(-1)=1$, $\omega(-1)=0$。$(3,3)=(-1)^{1}=-1$。$(2,3)$：$\alpha=1$, $\beta=0$ で指数 $\varepsilon(1)\varepsilon(3)+\omega(3)=1$、$-1$。$(-1,3)=(-1)^{\varepsilon(-1)\varepsilon(3)}=-1$。$(a,a)=(a,-a\cdot a)=(a,-1)$（平方類）と一致。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 非退化性の証明は代表系ごとの直接計算で、局所類体論を使わない。局所類体論の側から見ると、2 の主張は \ref{nt:local-herbrand}（巡回拡大のノルムの指数）の 2 次の場合の別証明である。

**前提を変えると.**
- **一般の局所体**：$\mathbb{Q}_{p}$ の有限次拡大 $K$ でも、$K^{\times}/K^{\times2}$ は有限で、ヒルベルト記号は非退化な対称双線形形式になる。$\abs{K^{\times}/K^{\times2}}=4\cdot2^{[K:\mathbb{Q}_{2}]}$（$p=2$）、$4$（$p$ 奇数）であることが知られている（Se V §3 の一般論、ここでは証明しない）。
- 非退化性は、局所類体論の**局所双対性**（ヒルベルト記号によるクンマー理論の自己双対）の最も簡単な場合である。

**高い視点から：ヒルベルト記号は「ブラウアー群への杯積」.** $(a,b)$ は、クンマー理論で $a,b$ が定める $H^{1}(k,\mu_{2})=k^{\times}/k^{\times2}$ の 2 元の杯積 $H^{1}\times H^{1}\to H^{2}(k,\mu_{2})=\operatorname{Br}(k)[2]\cong\{\pm1\}$ であり、$(a,b)=-1$ は四元数環 $(a,b)_{k}$ が斜体であることを意味する。非退化性はポアンカレ双対性の数論版（テイトの局所双対性）で、$\mathbb{F}_{2}$ 上の「交叉形式」として $\mathbb{Q}_{2}$ の行列が上の対称行列になる。比喩で言えば、平方類の空間は有限次元の「多様体のホモロジー」で、ヒルベルト記号はその交叉数である。
:::
