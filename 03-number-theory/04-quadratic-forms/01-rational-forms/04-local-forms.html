# $p$ 進体上の 2 次形式 {#nt:page-local-forms keywords="Hasse invariant epsilon(f) = prod_{i<j} (a_i, a_j), independence of the orthogonal basis via contiguous bases, counting lemma for the Hilbert symbol, when a form over Q_p represents 0: rank 2 iff d = -1, rank 3 iff (-1,-d) = epsilon, rank 4 iff d != 1 or epsilon = (-1,-1), rank >= 5 always; representation of an element; classification of quadratic forms over Q_p by rank, discriminant and Hasse invariant; the unique anisotropic quaternary form; realization of invariants; number of classes; real quadratic forms and signature"}

$p$ 進体 $\mathbb{Q}_{p}$ 上の非退化な 2 次形式は、**階数・判別式・ハッセ不変量** $\varepsilon$ の 3 つで完全に分類される。ハッセ不変量は直交基底の係数のヒルベルト記号の積で、基底によらないことは「隣接する直交基底の鎖」から従う。分類の鍵は、形式が $0$ を表すかどうかがこれらの不変量だけで決まることで、特に **5 変数以上の形式は必ず $0$ を表す**。これは次のページのハッセ–ミンコフスキーの定理で局所的な条件を扱う道具になる。

## 記法と定義の確認 {#nt:sec-lf2-notation}

::: notation
- $k$ は $\mathbb{R}$ または $\mathbb{Q}_{p}$。$k^{\times}/k^{\times2}$ の元を代表と同じ文字で書き、$r\defeq\dim_{\mathbb{F}_{2}}k^{\times}/k^{\times2}$（$\mathbb{R}$ で $1$、$p\neq2$ で $2$、$p=2$ で $3$：\ref{nt:p-adic-square-classes}）。
- ヒルベルト記号 $(a,b)$ は $k^{\times}/k^{\times2}$ 上の非退化な対称双線形形式（\ref{nt:hilbert-symbol-nondegenerate}）で、$(a,-a)=1$、$(a,a)=(a,-1)$（\ref{nt:hilbert-symbol-basic}）。
- 用語（判別式・表現・双曲形式）は \ref{nt:quadratic-space}、零を表すことと値を表すことの関係は \ref{nt:representation-criteria}、直交基底を一本ずつ取り替えることは \ref{nt:contiguous-bases}、消去は \ref{nt:witt-cancellation}。この節の形式はすべて非退化とする。
- 体系は $\ZF$。
:::

## ハッセ不変量 {#nt:sec-lf2-invariants}

::: theorem ハッセ不変量 {#nt:hasse-invariant keywords="for an orthogonal basis with a_i = e_i . e_i, epsilon = prod_{i<j} (a_i, a_j) does not depend on the basis; d(f) and epsilon(f) are invariants of the equivalence class" index="ハッセ不変量|はっせふへんりょう" refname="ハッセ不変量"}
$(V,Q)$ を $k$ 上の階数 $n$ の非退化な 2 次空間、$e=(e_{1},\dots,e_{n})$ を直交基底、$a_{i}\defeq e_{i}\cdot e_{i}$ とすると、$d(Q)=a_{1}\cdots a_{n}$（$k^{\times}/k^{\times2}$ で）で、
$$
\varepsilon(e)\defeq\prod_{i<j}(a_{i},a_{j})\in\{\pm1\}
$$
は $e$ によらない。これを $\varepsilon(Q)$（形式 $f$ については $\varepsilon(f)$）と書き、**ハッセ不変量**という。
:::

::: intuition
判別式は係数の積という「1 次の」情報、ハッセ不変量は係数の対ごとのヒルベルト記号の積という「2 次の」情報である。係数そのものは基底で変わるが、この 2 つは変わらない。$\mathbb{R}$ では判別式とハッセ不変量の組が、負の係数の個数 $s$ の $\bmod4$ に対応する。
:::

::: proof
**Step 1（$n\le2$）.** $n=1$ では $\varepsilon=1$。$n=2$ では、$\varepsilon(e)=(a_{1},a_{2})=1\iff Z^{2}-a_{1}X^{2}-a_{2}Y^{2}$ が $0$ を表す $\iff$ $a_{1}X^{2}+a_{2}Y^{2}$ が $1$ を表す（\ref{nt:representation-criteria} の 1）$\iff$ $Q(v)=1$ となる $v\in V$ がある。最後の条件は $e$ によらない。

**Step 2（$n\ge3$：隣接する基底への帰着）.** \ref{nt:contiguous-bases} から、$e$ と $e'$ が隣接する（共通のベクトルをもつ）場合に $\varepsilon(e)=\varepsilon(e')$ を示せばよい。ヒルベルト記号は対称なので $\varepsilon(e)$ は基底の並べ替えで変わらず、$e_{1}=e'_{1}$ としてよい。

**Step 3（帰納法）.** 【主張：$\varepsilon(e)=(a_{1},d(Q)a_{1})\prod_{2\le i<j}(a_{i},a_{j})$】双線形性から $\prod_{j\ge2}(a_{1},a_{j})=(a_{1},a_{2}\cdots a_{n})=(a_{1},d(Q)a_{1})$。$e'$ についても同じ式で、$a'_{1}=a_{1}$。$(e_{2},\dots,e_{n})$ と $(e'_{2},\dots,e'_{n})$ はどちらも $e_{1}^{\perp}$（$n-1$ 次元、非退化）の直交基底なので、帰納法の仮定から $\prod_{2\le i<j}(a_{i},a_{j})=\prod_{2\le i<j}(a'_{i},a'_{j})$。
:::

::: lemma ヒルベルト記号による数え上げ {#nt:hilbert-counting-lemma keywords="H_a^eps = {x in k^x/k^x2 : (x, a) = eps} has 2^r elements or is empty when a = 1 and 2^{r-1} elements when a != 1; two nonempty such sets are disjoint iff a = a' and eps = -eps'" index="ヒルベルト記号の数え上げ|ひるべるときごうのかぞえあげ" refname="ヒルベルト記号による数え上げ"}
$a\in k^{\times}/k^{\times2}$, $\varepsilon=\pm1$ について $H_{a}^{\varepsilon}\defeq\{x\in k^{\times}/k^{\times2}:(x,a)=\varepsilon\}$ とする。
1. $a=1$ なら $\abs{H_{1}^{1}}=2^{r}$, $H_{1}^{-1}=\emptyset$。$a\neq1$ なら $\abs{H_{a}^{\pm1}}=2^{r-1}$。
2. $H_{a}^{\varepsilon}$, $H_{a'}^{\varepsilon'}$ が空でないとき、$H_{a}^{\varepsilon}\cap H_{a'}^{\varepsilon'}=\emptyset\iff a=a'$ かつ $\varepsilon=-\varepsilon'$。
:::

::: intuition
非退化な内積の値が指定された元の集合は、ちょうど半分（アフィン超平面）になる。2 つのそのような集合が交わらないのは、同じ超平面の表と裏であるときだけである。
:::

::: proof
**Step 1（1）.** $a\neq1$ なら $x\mapsto(x,a)$ は非退化性から全射な準同型 $k^{\times}/k^{\times2}\to\{\pm1\}$ で、核 $H_{a}^{1}$ は超平面（$2^{r-1}$ 元）、$H_{a}^{-1}$ はその補集合（$2^{r-1}$ 元）。$a=1$ は明らか。

**Step 2（2）.** ⇐ は明らか。⇒：空でない 2 つはそれぞれ $2^{r-1}$ 個以上の元をもち（1）、交わらないので、合計が $2^{r}$ を超えないことから両方ちょうど $2^{r-1}$ 個で互いに補集合。よって $a,a'\neq1$ で、すべての $x$ について $(x,a)=\varepsilon\iff(x,a')=-\varepsilon'$。$x=1$ を代入して $\varepsilon=-\varepsilon'$（$(1,a)=1$ なので $1\in H_{a}^{\varepsilon}\iff\varepsilon=1$）、したがって $(x,a)=(x,a')$ がすべての $x$ で成り立ち、非退化性から $a=a'$。
:::

## $0$ を表す条件 {#nt:sec-lf2-isotropy}

::: theorem $p$ 進体上の形式が $0$ を表す条件 {#nt:local-isotropy keywords="a nondegenerate form over Q_p of rank n with invariants d, epsilon represents 0 iff n = 2 and d = -1; n = 3 and (-1,-d) = epsilon; n = 4 and (d != 1 or epsilon = (-1,-1)); n >= 5; cases n = 2, 3, 4 also hold over R" index="等方性の判定（p 進）|とうほうせいのはんてい, 5 変数の 2 次形式|ごへんすうのにじけいしき" refname="p 進体上の形式が 0 を表す条件"}
$f$ を $k$ 上の階数 $n$ の形式、$d=d(f)$, $\varepsilon=\varepsilon(f)$ とする。$f$ が $0$ を表すのは、次のいずれかのときに限る。
1. $n=2$ かつ $d=-1$。
2. $n=3$ かつ $(-1,-d)=\varepsilon$。
3. $n=4$ かつ（$d\neq1$ または $\varepsilon=(-1,-1)$）。
4. $n\ge5$（$k=\mathbb{Q}_{p}$ のとき。$k=\mathbb{R}$ では 4 は成り立たない）。
:::

::: intuition
$p$ 進体上で 2 次形式が $0$ を表すかどうかは変数の数で状況が変わる：2 変数は判別式、3 変数は判別式とハッセ不変量、4 変数はほぼいつも、5 変数以上は必ず。
:::

::: corollary 数の表現 {#nt:local-representation keywords="f represents a iff n = 1 and a = d; n = 2 and (a, -d) = epsilon; n = 3 and (a != -d or (-1,-d) = epsilon); n >= 4 (over Q_p)" index="数の表現（p 進）|かずのひょうげん" refname="数の表現（局所）"}
$a\in k^{\times}$ について、$f$ が $a$ を表すのは次のいずれかのときに限る：$n=1$ かつ $a=d$；$n=2$ かつ $(a,-d)=\varepsilon$；$n=3$ かつ（$a\neq-d$ または $(-1,-d)=\varepsilon$）；$n\ge4$（$k=\mathbb{Q}_{p}$）。
:::

::: intuition
2 変数の形式は判別式で、3 変数は判別式とハッセ不変量の関係で、4 変数は「判別式が平方で、ハッセ不変量がちょうど悪い値」の一通りだけで $0$ を表さない。5 変数以上では、平方類が少なくとも 4 個あるおかげで、いつでも 4 変数の悪い場合を避けられる。$\mathbb{R}$ では平方類が 2 個しかないので避けられず、正定値な形式は何変数でも $0$ を表さない。
:::

::: proof
以下 $f\sim a_{1}X_{1}^{2}+\dots+a_{n}X_{n}^{2}$ とする。系の各場合は、定理の場合 $n+1$ から導く（Step 5）ので、定理の場合 $n$ の証明には系の場合 $n-2$ 以下しか使わない。

**Step 1（$n=2$）.** $a_{1}x^{2}+a_{2}y^{2}=0$ が自明でない解をもつ $\iff-a_{1}/a_{2}$ が平方。$-a_{1}/a_{2}=-a_{1}a_{2}=-d$（平方類）なので $\iff d=-1$。

**Step 2（$n=3$）.** 【主張：$f$ が $0$ を表す $\iff(-1,-d)=\varepsilon$】$f$ と $-a_{3}f\sim(-a_{3}a_{1})X_{1}^{2}+(-a_{3}a_{2})X_{2}^{2}-X_{3}^{2}$ は同時に $0$ を表し、後者はヒルベルト記号の定義から $(-a_{3}a_{1},-a_{3}a_{2})=1$ と同値。双線形性で展開すると（$(-1,a_{3})(a_{3},-1)=1$ に注意）
$$
(-a_{3}a_{1},-a_{3}a_{2})=(-1,-1)(-1,a_{1})(-1,a_{2})(a_{3},a_{3})(a_{1},a_{2})(a_{1},a_{3})(a_{2},a_{3}),
$$
$(a_{3},a_{3})=(-1,a_{3})$ を使うと $(-1,-1)(-1,a_{1}a_{2}a_{3})\varepsilon=(-1,-d)\varepsilon$。

**Step 3（$n=4$）.** 【主張：$f$ が $0$ を表さない $\iff d=1$ かつ $\varepsilon=-(-1,-1)$】\ref{nt:representation-criteria} の 2 から、$f$ が $0$ を表す $\iff$ ある $x\in k^{\times}$ が $g=a_{1}X_{1}^{2}+a_{2}X_{2}^{2}$ と $h=-a_{3}X_{3}^{2}-a_{4}X_{4}^{2}$ の両方に表される。系の $n=2$ の場合（Step 1・2 から導かれる：Step 5）から、それは $x\in A\defeq H_{-a_{1}a_{2}}^{(a_{1},a_{2})}$ かつ $x\in B\defeq H_{-a_{3}a_{4}}^{(-a_{3},-a_{4})}$ と同値。$a_{1}\in A$, $-a_{3}\in B$ なので空でなく、\ref{nt:hilbert-counting-lemma} の 2 から $A\cap B=\emptyset\iff a_{1}a_{2}=a_{3}a_{4}$ かつ $(a_{1},a_{2})=-(-a_{3},-a_{4})$。前者は $d=a_{1}a_{2}a_{3}a_{4}=1$（平方類で）と同値。そのとき
$$
\varepsilon=(a_{1},a_{2})(a_{3},a_{4})(a_{1}a_{2},a_{3}a_{4})=(a_{1},a_{2})(a_{3},a_{4})(-1,a_{3}a_{4})=(a_{1},a_{2})(-a_{3},-a_{4})(-1,-1)
$$
（$(x,x)=(-1,x)$ と、$(-a_{3},-a_{4})=(-1,-1)(-1,a_{3}a_{4})(a_{3},a_{4})$ を使った）。よって後者は $\varepsilon=-(-1,-1)$ と同値。

**Step 4（$n\ge5$, $k=\mathbb{Q}_{p}$）.** 【主張：$n=5$ で示せば十分で、そのとき $f$ は $0$ を表す】$n>5$ なら 5 変数の部分形式が $0$ を表す。$n=5$ とする。系の $n=2$ の場合から、2 変数の形式 $g$ が表す平方類は空でない $H_{-d(g)}^{\varepsilon(g)}$ で、$2^{r-1}\ge2$ 個以上（$r\ge2$）。よって $f$ は $d$ と異なる平方類 $a$ を表し、$f\sim aX^{2}\oplus g$（\ref{nt:representation-criteria} の 1、$g$ は 4 変数）。$d(g)=d/a\neq1$ なので Step 3 から $g$ は $0$ を表し、$f$ も表す。

**Step 5（系）.** 【主張：$f$ が $a$ を表す $\iff f_{a}\defeq f\ominus aZ^{2}$ が $0$ を表す】は \ref{nt:representation-criteria} の 1。$d(f_{a})=-ad$, $\varepsilon(f_{a})=\varepsilon\prod_{i}(a_{i},-a)=(-a,d)\varepsilon$。$n=1$ は直接（$a_{1}x^{2}=a\iff a=a_{1}=d$）。$n=2$：Step 2 を $f_{a}$ に使うと条件は $(-1,ad)=(-a,d)\varepsilon$、展開すると $(-1,ad)(-a,d)=(-1,a)(a,d)=(a,-d)$ なので $(a,-d)=\varepsilon$。$n=3$：Step 3 を $f_{a}$ に使うと、$-ad\neq1$（$a\neq-d$）か、$a=-d$ かつ $(d,d)\varepsilon=(-1,-1)$、すなわち $(-1,d)\varepsilon=(-1,-1)$, $\varepsilon=(-1,-d)$。$n\ge4$：Step 4 を $f_{a}$（階数 $\ge5$）に使う。

**Step 6（$\mathbb{R}$）.** Step 1〜3 と Step 5 の $n\le3$ は、ヒルベルト記号の双線形性・対称性・非退化性と \ref{nt:hilbert-counting-lemma}（$r=1$ でも成り立つ）だけを使っているので $\mathbb{R}$ でも成り立つ。Step 4 は $r\ge2$ を使い、$\mathbb{R}$ では $X_{1}^{2}+\dots+X_{n}^{2}$ が反例。
:::

::: example
$f=X_{1}^{2}+X_{2}^{2}+X_{3}^{2}+X_{4}^{2}$ は $d=1$, $\varepsilon=1$。$(-1,-1)_{p}=1$（$p$ 奇数：単数どうし）なので $\mathbb{Q}_{p}$ では 3 から $0$ を表す。$(-1,-1)_{2}=-1$ なので $\varepsilon=1=-(-1,-1)_{2}$ で、$\mathbb{Q}_{2}$ では $0$ を表さない（4 つの平方の和が $0$ になる 2 進数は $0$ だけ）。
:::

## 分類 {#nt:sec-lf2-classification}

::: theorem $p$ 進体上の 2 次形式の分類 {#nt:local-classification keywords="two nondegenerate quadratic forms over Q_p are equivalent iff they have the same rank, discriminant and Hasse invariant" index="p 進体上の 2 次形式の分類|ぴーしんたいじょうのにじけいしきのぶんるい" refname="p 進体上の 2 次形式の分類"}
$\mathbb{Q}_{p}$ 上の 2 つの非退化な形式が同値 $\iff$ 階数・判別式・ハッセ不変量が等しい。
:::

::: intuition
$p$ 進体の上の 2 次形式は、階数・判別式・ハッセ不変量という 3 つの数だけで決まる。表す値の集合が不変量だけで決まるので、同じ値を表すベクトルを一つずつ揃えていける。
:::

::: proof
**Step 1（必要性）.** 不変量の定義（\ref{nt:hasse-invariant}）から。

**Step 2（十分性：帰納法）.** 【主張：$f\sim aZ^{2}\oplus f'$, $g\sim aZ^{2}\oplus g'$ で $f',g'$ の不変量が等しい】$n=0$ は自明。\ref{nt:local-representation} から、表す平方類の集合は $(n,d,\varepsilon)$ で決まるので、$f$ が表す $a$ を $g$ も表し、\ref{nt:representation-criteria} の 1 から上の形に書ける。$d(f')=ad(f)=ad(g)=d(g')$。$\varepsilon(aZ^{2}\oplus f')=\varepsilon(f')(a,d(f'))$ なので $\varepsilon(f')=\varepsilon(f)(a,d(f'))=\varepsilon(g)(a,d(g'))=\varepsilon(g')$。帰納法の仮定から $f'\sim g'$、よって $f\sim g$。
:::

::: corollary 非等方な 4 変数の形式 {#nt:anisotropic-quaternary keywords="over Q_p there is a unique anisotropic quaternary form up to equivalence: z^2 - a x^2 - b y^2 + ab t^2 with (a, b) = -1, the norm form of the quaternion division algebra" index="非等方な 4 変数の 2 次形式|ひとうほうなよんへんすうのにじけいしき, 四元数環のノルム形式|しげんすうかんののるむけいしき" refname="非等方な 4 変数の形式"}
$\mathbb{Q}_{p}$ 上、$0$ を表さない 4 変数の形式は同値を除いてただ一つで、$(a,b)=-1$ となる $a,b$ について $Z^{2}-aX^{2}-bY^{2}+abT^{2}$。
:::

::: intuition
4 変数で $0$ を表さない形式は一つしかなく、それは四元数の斜体のノルム $\abs{z+xi+yj+tk}^{2}$ である。$p$ 進体上の「どの方向にも長さのある 4 次元空間」は、本質的にこの四元数の空間だけである。
:::

::: proof
\ref{nt:local-isotropy} の 3 から、そのような形式は $d=1$, $\varepsilon=-(-1,-1)$ で特徴付けられ、\ref{nt:local-classification} から一意。$(a,b)=-1$ となる $a,b$ は非退化性から存在する。$Z^{2}-aX^{2}-bY^{2}+abT^{2}$ の判別式は $a^{2}b^{2}=1$。ハッセ不変量は $(-a,-b)(-a,ab)(-b,ab)$ で、$(-a,ab)=(-a,-b)(-a,-1)$, $(-b,ab)=(-a,-b)(-b,-1)$ から積は $(-a,-b)(ab,-1)=(-1,-1)(a,b)$（$(-a,-b)=(-1,-1)(-1,ab)(a,b)$）$=-(-1,-1)$。
:::

::: proposition 不変量の実現 {#nt:local-invariants-realization keywords="a form of rank n over Q_p with given d and epsilon exists iff n = 1 and epsilon = 1, or n = 2 and (d != -1 or epsilon = 1), or n >= 3; number of classes 4, 7, 8 (p odd) and 8, 15, 16 (p = 2)" index="不変量の実現（局所）|ふへんりょうのじつげん" refname="不変量の実現（局所）"}
$n\ge1$, $d\in\mathbb{Q}_{p}^{\times}/\mathbb{Q}_{p}^{\times2}$, $\varepsilon=\pm1$ について、$d(f)=d$, $\varepsilon(f)=\varepsilon$ となる階数 $n$ の形式 $f$ がある $\iff$ $n=1,\varepsilon=1$；または $n=2$ で（$d\neq-1$ または $\varepsilon=1$）；または $n\ge3$。したがって階数 $n$ の形式の類の個数は、$p\neq2$ で $n=1,2,\ge3$ のとき $4,7,8$、$p=2$ で $8,15,16$。
:::

::: intuition
不変量の組 $(n,d,\varepsilon)$ は、2 変数で「判別式 $-1$ なのにハッセ不変量 $-1$」という一つの組合せを除いて、すべて実際に現れる。
:::

::: proof
**Step 1（$n=1,2$）.** 【主張：$n=2$ で実現できるのは $d\neq-1$ または $\varepsilon=1$ のとき】$n=1$ は明らか。$n=2$ で $d=-1$ なら $f\sim aX^{2}-aY^{2}$ で $\varepsilon=(a,-a)=1$。逆に $d=-1,\varepsilon=1$ は $X^{2}-Y^{2}$。$d\neq-1$ なら非退化性から $(a,-d)=\varepsilon$ となる $a$ があり、$f=aX^{2}+adY^{2}$ は $d(f)=d$, $\varepsilon(f)=(a,ad)=(a,-d)$（$(a,ad)=(a,-a\cdot(-d))=(a,-a)(a,-d)$）。

**Step 2（$n=3$）.** 【主張：$aZ^{2}\oplus g$ で任意の $(d,\varepsilon)$ を実現する】$a\neq-d$ となる平方類 $a$ をとる（$r\ge2$）。Step 1 から $d(g)=ad$, $\varepsilon(g)=\varepsilon(a,-d)$ となる 2 変数の $g$ がある（$ad\neq-1$）。$f=aZ^{2}\oplus g$ は $d(f)=a\cdot ad=d$, $\varepsilon(f)=\varepsilon(g)(a,ad)=\varepsilon(a,-d)(a,-d)=\varepsilon$。

**Step 3（$n\ge4$）.** 【主張：平方の和を足しても不変量は変わらない】3 変数の $g$ で不変量 $(d,\varepsilon)$ のものに $X_{4}^{2}+\dots+X_{n}^{2}$ を足す（$\varepsilon$ も $d$ も変わらない）。

**Step 4（個数）.** 【主張：類の個数は判別式の個数と $\varepsilon$ の組の数】$\abs{\mathbb{Q}_{p}^{\times}/\mathbb{Q}_{p}^{\times2}}=4$ または $8$ と分類定理から、$n=1$ で $4$（$8$）、$n=2$ で $2\cdot4-1=7$（$2\cdot8-1=15$）、$n\ge3$ で $8$（$16$）。
:::

::: proposition 実数体上の形式 {#nt:real-forms-invariants keywords="for a real form of signature (r, s): d = (-1)^s and epsilon = (-1)^{s(s-1)/2}; d and epsilon determine s mod 4" index="実 2 次形式の不変量|じつにじけいしきのふへんりょう" refname="実数体上の形式"}
$\mathbb{R}$ 上の符号数 $(r,s)$ の形式について $d=(-1)^{s}$, $\varepsilon=(-1)^{s(s-1)/2}$。したがって $(d,\varepsilon)$ は $s\bmod4$ と同じ情報である。
:::

::: intuition
実数体では判別式とハッセ不変量は負の係数の個数 $s$ の $\bmod4$ しか見えない。$\mathbb{R}$ の形式を決めるには符号数そのものが必要である。
:::

::: proof
\ref{lin:sylvester-inertia} から $f\sim X_{1}^{2}+\dots+X_{r}^{2}-Y_{1}^{2}-\dots-Y_{s}^{2}$。$d$ は明らか。$(a,b)_{\infty}=-1\iff a,b<0$ なので、$\varepsilon$ は負の係数の対の個数 $\binom s2$ だけ $-1$ を掛けたもの。$s\bmod4=0,1,2,3$ に対し $(d,\varepsilon)=(1,1),(-1,1),(1,-1),(-1,-1)$。
:::

::: hypcheck
- **ハッセ不変量の不変性**：$\dim\ge3$ では \ref{nt:contiguous-bases}（非退化性が必要）に、$n=2$ では表現の判定に依存した。ヒルベルト記号の双線形性は Step 3 の式変形に本質的。
- **$0$ を表す条件**：ヒルベルト記号の非退化性は \ref{nt:hilbert-counting-lemma} を通して $n=4$ に、$r\ge2$（平方類が 4 個以上）は $n\ge5$ に本質的。
- **分類**：帰納法で消去定理の代わりに「同じ元を表す」ことを使った。$\mathbb{R}$ では階数・判別式・$\varepsilon$ では符号数が決まらない（$s$ は $\bmod4$ しかわからない）ので、分類には符号数が要る。
:::

## 問題 {#nt:sec-lf2-problems}

::: problem {#nt:prob-lf2-three-five-seven}
$3X^{2}+5Y^{2}-7Z^{2}$ は $\mathbb{Q}_{3}$ で $0$ を表すか。不変量で判定し、$\bmod3$ の計算でも確かめよ。
:::

::: solution
$d=-105$, $-d=105=3\cdot35$。$(-1,105)_{3}=\bigl(\frac{-1}3\bigr)=-1$（\ref{nt:hilbert-symbol-odd}）。$\varepsilon=(3,5)_{3}(3,-7)_{3}(5,-7)_{3}=\bigl(\frac53\bigr)\bigl(\frac{-7}3\bigr)\cdot1=(-1)(-1)=1$。$(-1,-d)=-1\neq\varepsilon$ なので表さない。直接：原始解があれば $\bmod3$ で $2y^{2}+2z^{2}\equiv0$, $y^{2}+z^{2}\equiv0$ から $y\equiv z\equiv0$（$-1$ は $\bmod3$ で非平方）、すると $3x^{2}\equiv0\pmod9$ で $x\equiv0$、原始性に反する。
:::

::: problem {#nt:prob-lf2-hyperbolic-sum}
$\mathbb{Q}_{p}$ 上、$X_{1}^{2}-X_{2}^{2}+g$（$g$ は 2 変数）が $0$ を表すことは明らかである。$X_{1}^{2}-X_{2}^{2}+X_{3}^{2}-X_{4}^{2}$ の不変量を求め、\ref{nt:local-isotropy} の 3 と整合することを確かめよ。
:::

::: solution
$d=(1)(-1)(1)(-1)=1$。$\varepsilon=\prod_{i<j}(a_{i},a_{j})$ で、$-1$ を含む対は $(1,-1)$ が $1$、$(-1,-1)$ が 1 対（$a_{2},a_{4}$）なので $\varepsilon=(-1,-1)$。$d=1$ かつ $\varepsilon=(-1,-1)$ なので 3 から $0$ を表す。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 分類の証明はヴィットの消去定理を直接使わず、「同じ元を表す形式から同じ 1 変数部分を分離する」帰納法で済ませた（分離の存在には表現の判定を使う）。

**前提を変えると.**
- **一般の局所体**：$\mathbb{Q}_{p}$ の有限次拡大でも、階数・判別式・ハッセ不変量による分類と、5 変数以上の形式が $0$ を表すことが成り立つ（証明は同じで、$r\ge2$ と非退化性だけを使う）。
- **アルティン予想**：$d$ 次斉次式は $d^{2}+1$ 変数以上で $\mathbb{Q}_{p}$ 上必ず零点をもつ、という予想は $d=2$（上の定理）と $d=3$ では正しいが、一般には偽である（テルジャニアン、1966）。固定した $d$ について有限個を除く $p$ では正しい（アックス–コーヘン）。
- ハッセ不変量の定義には流儀があり、$\prod_{i\le j}(a_{i},a_{j})$ を使う文献もある。両者は $(d,-1)$ 倍だけ違う。

**高い視点から：2 次形式は「判別式」と「四元数環」で決まる.** ハッセ不変量 $\varepsilon(f)$ は、$f$ のクリフォード環（の偶部分）が定めるブラウアー群 $\operatorname{Br}(\mathbb{Q}_{p})[2]=\{\pm1\}$ の元で、局所体では四元数環は行列環と唯一の斜体の 2 種類しかない。唯一の非等方な 4 変数の形式がこの斜体のノルム形式であることは、この対応の最も具体的な現れである。比喩で言えば、$p$ 進体の上の 2 次形式は「平方類の空間（$\mathbb{F}_{2}$ 上 $r$ 次元）の 1 元」と「1 ビットのねじれ」で完全に記述される小さな世界である。
:::
