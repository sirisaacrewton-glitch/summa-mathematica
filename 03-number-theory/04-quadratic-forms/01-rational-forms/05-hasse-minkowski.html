# ハッセ–ミンコフスキーの定理 {#nt:page-hasse-minkowski keywords="existence of a rational number with prescribed Hilbert symbols at all places, conditions: almost all 1, product formula, local solvability, proof via Dirichlet's theorem on primes in arithmetic progressions; norm criterion for ternary forms over any field; Hasse-Minkowski theorem: a quadratic form over Q represents 0 iff it does over R and every Q_p; Legendre's theorem for ternary forms by descent; Meyer's theorem: indefinite forms of rank >= 5 represent 0; local-global principle for representations; classification of quadratic forms over Q by d, signature and Hasse invariants; realization of invariants"}

有理数係数の 2 次形式が $0$ を表すかどうかは、局所的な条件だけで決まる：**$\mathbb{R}$ とすべての $\mathbb{Q}_{p}$ で $0$ を表せば、$\mathbb{Q}$ でも $0$ を表す**（ハッセ–ミンコフスキーの定理、局所大域原理）。各 $\mathbb{Q}_{p}$ での判定は前のページで不変量の言葉に翻訳済みで、有限個の $p$ を除けば自動的に成り立つので、これは有限回の計算で判定できる条件になる。証明の要は、ヒルベルト記号を各素点で好きな値に指定した有理数の存在（積公式以外の制約がないこと）であり、そこでディリクレの算術級数定理が使われる。

## 記法と定義の確認 {#nt:sec-hm-notation}

::: notation
- $V$ は $\mathbb{Q}$ の素点（素数と $\infty$）全体、$\mathbb{Q}_{\infty}=\mathbb{R}$。$a,b\in\mathbb{Q}^{\times}$ の $\mathbb{Q}_{v}$ でのヒルベルト記号を $(a,b)_{v}$ と書く。その積公式は \ref{nt:hilbert-product-formula}、奇素数の明示公式は \ref{nt:hilbert-symbol-odd}、非退化性は \ref{nt:hilbert-symbol-nondegenerate}。
- $\mathbb{Q}_{v}^{\times2}$ は開部分群（\ref{nt:p-adic-squares} の 3、$\mathbb{R}$ では $\mathbb{R}_{>0}$）。算術級数の中の素数の無限性は \ref{nt:dirichlet-theorem-primes}。
- 局所体上の形式の不変量・零を表す条件・数の表現・分類は \ref{nt:hasse-invariant}, \ref{nt:local-isotropy}, \ref{nt:local-representation}, \ref{nt:local-classification}, \ref{nt:real-forms-invariants}。零を表すことと値を表すことの関係、直交和の消去は \ref{nt:representation-criteria}, \ref{nt:witt-cancellation}。有限体の 3 変数の形式は \ref{nt:finite-field-conic}、単根の持ち上げは \ref{nt:hensel-lemma}。
- $\mathbb{Q}$ 上の非退化な形式 $f$ を $\mathbb{Q}_{v}$ 上の形式とみたものを $f_{v}$、その不変量を $d_{v}(f)$, $\varepsilon_{v}(f)$ と書く。
- 体系は $\ZFC$（ディリクレの定理の証明の解析を通して、ただし選択公理は本質的でない）。
:::

## ヒルベルト記号を指定した有理数 {#nt:sec-hm-existence}

::: lemma 近似定理 {#nt:rational-approximation keywords="the image of Q in R x Q_{p_1} x ... x Q_{p_n} is dense" index="近似定理（有理数）|きんじていり" refname="有理数の近似定理"}
$V$ の有限部分集合 $S$ について、$\mathbb{Q}$ の像は $\prod_{v\in S}\mathbb{Q}_{v}$（直積位相）で稠密である。
:::

::: intuition
有理数は、実数としての近さと、有限個の素数での $p$ 進的な近さを同時に好きなだけ実現できる。$p$ 進の条件は整数の合同式で、実数の条件は他の素数の冪で割った細かい分数で調整する。
:::

::: proof
**Step 1（帰着）.** $S$ を大きくして $S=\{\infty,p_{1},\dots,p_{n}\}$ としてよい。点 $(x_{\infty},x_{1},\dots,x_{n})$ を整数倍しても（同相写像）稠密性は変わらないので $x_{i}\in\mathbb{Z}_{p_{i}}$ とする。$\delta>0$ と $N\ge1$ について、$\abs{x-x_{\infty}}\le\delta$, $v_{p_{i}}(x-x_{i})\ge N$ となる $x\in\mathbb{Q}$ を作ればよい。

**Step 2（構成）.** 中国剰余定理で $v_{p_{i}}(x_{0}-x_{i})\ge N$ となる $x_{0}\in\mathbb{Z}$ をとる。$p_{i}$ と異なる素数 $q$ をとると、$a/q^{m}$（$a\in\mathbb{Z}$, $m\ge0$）の形の数は $\mathbb{R}$ で稠密（$q^{m}\to\infty$）なので、$\abs{x_{0}-x_{\infty}+u\,(p_{1}\cdots p_{n})^{N}}\le\delta$ となるそのような $u$ がある。$x\defeq x_{0}+u(p_{1}\cdots p_{n})^{N}$ は、$u\in\mathbb{Z}_{p_{i}}$（$q$ は $p_{i}$ 進単数）なので $v_{p_{i}}(x-x_{i})\ge N$ をみたす。
:::

::: theorem ヒルベルト記号を指定した有理数 {#nt:prescribed-hilbert-symbols keywords="given finitely many a_i in Q^x and signs eps_{i,v}, there is x in Q^x with (a_i, x)_v = eps_{i,v} for all i, v iff almost all eps are 1, prod_v eps_{i,v} = 1, and for each v there is a local x_v" index="ヒルベルト記号を指定した有理数|ひるべるときごうをしていしたゆうりすう" refname="ヒルベルト記号を指定した有理数"}
$(a_{i})_{i\in I}$ を $\mathbb{Q}^{\times}$ の有限族、$(\varepsilon_{i,v})_{i\in I,v\in V}$ を $\pm1$ の族とする。すべての $i,v$ で $(a_{i},x)_{v}=\varepsilon_{i,v}$ となる $x\in\mathbb{Q}^{\times}$ がある $\iff$ 次の 3 条件が成り立つ。
1. 有限個を除いて $\varepsilon_{i,v}=1$。
2. 各 $i$ で $\prod_{v}\varepsilon_{i,v}=1$。
3. 各 $v$ で、すべての $i$ について $(a_{i},x_{v})_{v}=\varepsilon_{i,v}$ となる $x_{v}\in\mathbb{Q}_{v}^{\times}$ がある。
:::

::: intuition
ヒルベルト記号の値に対する大域的な制約は積公式だけである：各素点で局所的に実現可能で、有限個を除いて自明で、積が $1$ なら、それを一つの有理数で同時に実現できる。自由度を生むのは「$x$ の素因数として新しい素数 $p$ を一つ使う」ことで、その $p$ での値は積公式で自動的に正しくなる。必要な $p$ の存在が算術級数定理である。
:::

::: proof
**Step 0（必要性と準備）.** 必要性：1・2 は \ref{nt:hilbert-product-formula}、3 は $x_{v}=x$。十分性のため、$a_{i}$ に整数の平方を掛けて（記号は変わらない）$a_{i}\in\mathbb{Z}$ とする。$S\defeq\{\infty,2\}\cup\{a_{i}$ の素因数$\}$、$T\defeq\{v:$ ある $i$ で $\varepsilon_{i,v}=-1\}$ とおくと、どちらも有限。

**Step 1（$S\cap T=\emptyset$ の場合：構成）.** $a\defeq\prod_{l\in T}l$（$T$ は有限素点だけ：$\infty\in S$）、$m\defeq8\prod_{l\in S,\,l\neq2,\infty}l$ とすると $\gcd(a,m)=1$（$2\in S$ なので $a$ は奇数）。\ref{nt:dirichlet-theorem-primes} から、$p\equiv a\pmod m$, $p\notin S\cup T$ の素数 $p$ があり、$x\defeq ap$ とおく。

**Step 2（$v\in S$）.** 【主張：$(a_{i},x)_{v}=1=\varepsilon_{i,v}$】$v=\infty$：$x>0$。$v=2$：$x\equiv a^{2}\equiv1\pmod8$ なので $x$ は $\mathbb{Q}_{2}$ の平方（\ref{nt:p-adic-squares}）。$v=l\neq2$：$x\equiv a^{2}\pmod l$ で $a$ は $l$ 進単数（$l\notin T$）なので $x$ は平方。

**Step 3（$v=l\notin S$, $l\neq p$）.** 【主張：$(a_{i},x)_{l}=\varepsilon_{i,l}$】$a_{i}$ は $l$ 進単数で $l\neq2$ なので、\ref{nt:hilbert-symbol-odd} から $(a_{i},b)_{l}=\bigl(\frac{a_{i}}l\bigr)^{v_{l}(b)}$。$l\notin T$ なら $v_{l}(x)=0$ で値は $1=\varepsilon_{i,l}$。$l\in T$ なら $v_{l}(x)=1$。条件 3 の $x_{l}$ について、ある $i$ で $\varepsilon_{i,l}=-1$ なので $v_{l}(x_{l})$ は奇数で、$(a_{i},x)_{l}=\bigl(\frac{a_{i}}l\bigr)=(a_{i},x_{l})_{l}=\varepsilon_{i,l}$。

**Step 4（$v=p$）.** 積公式と条件 2 から $(a_{i},x)_{p}=\prod_{v\neq p}(a_{i},x)_{v}=\prod_{v\neq p}\varepsilon_{i,v}=\varepsilon_{i,p}$。

**Step 5（一般の場合）.** 【主張：$S$ での値を先に合わせて Step 1〜4 に帰着】\ref{nt:rational-approximation} と、$\mathbb{Q}_{v}^{\times2}$ が開部分群であることから、すべての $v\in S$ で $x'/x_{v}\in\mathbb{Q}_{v}^{\times2}$ となる $x'\in\mathbb{Q}^{\times}$ がある。$\eta_{i,v}\defeq\varepsilon_{i,v}(a_{i},x')_{v}$ は条件 1〜3 をみたし（3 は $x_{v}x'$ で、積公式から 2 も）、$v\in S$ で $\eta_{i,v}=(a_{i},x_{v})_{v}(a_{i},x')_{v}=1$。Step 1〜4 を $\eta$ に使って得た $y$ について、$x\defeq yx'$ が求めるもの（双線形性）。
:::

## ハッセ–ミンコフスキーの定理 {#nt:sec-hm-theorem}

::: lemma 3 変数の形式とノルム {#nt:ternary-norm-criterion keywords="over any field of characteristic not 2: X^2 - a Y^2 - b Z^2 represents 0 iff a is a square or b is a norm from k(sqrt a); if b b' is a norm then X^2 - aY^2 - bZ^2 and X^2 - aY^2 - b'Z^2 represent 0 simultaneously" index="3 変数の形式とノルム|さんへんすうのけいしきとのるむ" refname="3 変数の形式とノルム"}
$k$ を標数 $\neq2$ の体、$a,b\in k^{\times}$ とする。
1. $X^{2}-aY^{2}-bZ^{2}$ が $0$ を表す $\iff$ $a\in k^{\times2}$ または $b\in N(k(\sqrt a)^{\times})$。
2. $bb'\in N(k(\sqrt a)^{\times})$（$b'\in k^{\times}$）なら、$X^{2}-aY^{2}-bZ^{2}$ と $X^{2}-aY^{2}-b'Z^{2}$ は同時に $0$ を表す。
:::

::: intuition
$X^{2}-aY^{2}=bZ^{2}$ が解をもつことは、$b$ が $\sqrt a$ を添加した体の元のノルム（「$x^{2}-ay^{2}$ の形」）であることと同じである。ノルムは掛け算で閉じているので、$b$ をノルム倍だけ取り替えても可解性は変わらない。
:::

::: proof
**Step 1（1）.** $a$ が平方なら $(\sqrt a,1,0)$ が零点。そうでなければ $N(x+y\sqrt a)=x^{2}-ay^{2}$。$b=x^{2}-ay^{2}$ なら $(x,y,1)$ が零点。逆に零点 $(x,y,z)$ で $z=0$ なら $x^{2}=ay^{2}$ から $a$ が平方（$y\neq0$）になり矛盾なので $z\neq0$、$b=N(x/z+(y/z)\sqrt a)$。

**Step 2（2）.** $a$ が平方なら両方 $0$ を表す。そうでなければノルムの全体 $N\defeq N(k(\sqrt a)^{\times})$ は $k^{\times}$ の部分群なので、$bb'\in N$ のもとで $b\in N\iff b'=(bb')b^{-1}\in N$。1 から従う。
:::

::: theorem ハッセ–ミンコフスキーの定理 {#nt:hasse-minkowski keywords="Hasse-Minkowski: a nondegenerate quadratic form over Q represents 0 over Q iff it represents 0 over R and over every Q_p; proof by cases n = 2, 3 (Legendre descent), 4 (prescribed Hilbert symbols), >= 5 (induction with approximation)" index="ハッセ–ミンコフスキーの定理|はっせみんこふすきーのていり, 局所大域原理|きょくしょたいいきげんり" refname="ハッセ–ミンコフスキーの定理"}
$\mathbb{Q}$ 上の非退化な形式 $f$ が $\mathbb{Q}$ で $0$ を表す $\iff$ すべての $v\in V$ で $f_{v}$ が $0$ を表す。
:::

::: intuition
「どの素数を法としても、どの精度でも解があり、実数解もある」なら有理数解がある。素数ごとの情報を一つの有理数解にまとめるのは一般には不可能（3 次形式では反例がある）だが、2 次形式では、変数を一つずつ減らす帰納法と、ヒルベルト記号を指定した有理数の存在で、局所的な情報を貼り合わせられる。
:::

::: proof
必要性は明らか。十分性を示す。$f=a_{1}X_{1}^{2}+\dots+a_{n}X_{n}^{2}$（$a_{i}\in\mathbb{Q}^{\times}$）とし、$a_{1}f$ に替えて $a_{1}=1$ としてよい（$n=1$ では $f_{\infty}$ が $0$ を表さないので主張は空）。

**Step 1（$n=2$）.** $f=X_{1}^{2}-aX_{2}^{2}$。$f_{\infty}$ が $0$ を表すので $a>0$、各 $f_{p}$ が $0$ を表すので $a$ は $\mathbb{Q}_{p}$ の平方で $v_{p}(a)$ は偶数。よって $a$ は $\mathbb{Q}$ の平方で、$f$ は $0$ を表す。

**Step 2（$n=3$：準備）.** $f=X_{1}^{2}-aX_{2}^{2}-bX_{3}^{2}$ とし、平方を掛けて $a,b$ を平方因子をもたない整数、$\abs a\le\abs b$ としてよい。$m\defeq\abs a+\abs b$ についての帰納法で示す。$m=2$ なら $a,b\in\{\pm1\}$ で、$a=b=-1$ は $f_{\infty}=X_{1}^{2}+X_{2}^{2}+X_{3}^{2}$ が $0$ を表さないので除かれ、他の場合は $X_{1}^{2}-X_{2}^{2}$ か $X_{1}^{2}-X_{3}^{2}$ を含み $0$ を表す。

**Step 3（$n=3$：$a$ は $\bmod b$ で平方）.** 【主張：$m>2$（$\abs b\ge2$）なら $t^{2}\equiv a\pmod{\abs b}$, $\abs t\le\abs b/2$ となる整数 $t$ がある】$p\mid b$ とする。$p\mid a$ なら $a\equiv0$ は平方。$p\nmid a$ なら、$f_{p}$ の原始的な零点 $(z,x,y)$（$z^{2}-ax^{2}-by^{2}=0$）について $z^{2}\equiv ax^{2}\pmod p$。$x\equiv0$ なら $z\equiv0$、$by^{2}\equiv0\pmod{p^{2}}$ と $v_{p}(b)=1$ から $y\equiv0$ となり原始性に反するので、$x$ は単数で $a\equiv(z/x)^{2}\pmod p$。$b$ は平方因子をもたないので、中国剰余定理で $a$ は $\bmod\abs b$ の平方で、代表 $t$ を $\abs t\le\abs b/2$ にとれる。

**Step 4（$n=3$：降下）.** 【主張：$f$ は $f'=X_{1}^{2}-aX_{2}^{2}-b'X_{3}^{2}$（$bb'=t^{2}-a$）と同時に、$\mathbb{Q}$ でも各 $\mathbb{Q}_{v}$ でも $0$ を表す】$t^{2}-a=0$ なら $a=t^{2}$ は平方で $f$ は $0$ を表す（$(t,1,0)$）。そうでなければ $bb'=N(t+\sqrt a)$ はノルムなので、\ref{nt:ternary-norm-criterion} の 2 から従う（$k=\mathbb{Q}$ と $k=\mathbb{Q}_{v}$）。$\abs{b'}=\abs{t^{2}-a}/\abs b\le\abs b/4+\abs a/\abs b\le\abs b/4+1<\abs b$（$\abs b\ge2$）。$b'=b''u^{2}$（$b''$ は平方因子をもたない整数）とすると $f''=X_{1}^{2}-aX_{2}^{2}-b''X_{3}^{2}\sim f'$ は各 $\mathbb{Q}_{v}$ で $0$ を表し、$\abs a+\abs{b''}<m$ なので帰納法の仮定（$a,b''$ を絶対値の順に並べ替えて）から $\mathbb{Q}$ で $0$ を表す。よって $f$ も表す。

**Step 5（$n=4$）.** 【主張：$f=aX_{1}^{2}+bX_{2}^{2}-(cX_{3}^{2}+dX_{4}^{2})$ は $0$ を表す】各 $v$ で $f_{v}$ は $0$ を表すので、\ref{nt:representation-criteria} の 2 から、$aX_{1}^{2}+bX_{2}^{2}$ と $cX_{3}^{2}+dX_{4}^{2}$ の両方が表す $x_{v}\in\mathbb{Q}_{v}^{\times}$ があり、\ref{nt:local-representation}（$n=2$、$\mathbb{R}$ でも成り立つ）から $(x_{v},-ab)_{v}=(a,b)_{v}$, $(x_{v},-cd)_{v}=(c,d)_{v}$。積公式から \ref{nt:prescribed-hilbert-symbols} の条件 1〜3 が成り立ち（$a_{1}=-ab$, $a_{2}=-cd$）、すべての $v$ で $(x,-ab)_{v}=(a,b)_{v}$, $(x,-cd)_{v}=(c,d)_{v}$ となる $x\in\mathbb{Q}^{\times}$ がある。すると $aX_{1}^{2}+bX_{2}^{2}-xZ^{2}$ はすべての $\mathbb{Q}_{v}$ で $0$ を表し、$n=3$ の場合から $\mathbb{Q}$ で $0$ を表す。\ref{nt:representation-criteria} の 1 から $aX_{1}^{2}+bX_{2}^{2}$ は $\mathbb{Q}$ で $x$ を表し、$cX_{3}^{2}+dX_{4}^{2}$ も同様。よって $f$ は $0$ を表す。

**Step 6（$n\ge5$）.** 【主張：$n-1$ の場合に帰着】$h\defeq a_{1}X_{1}^{2}+a_{2}X_{2}^{2}$, $g\defeq a_{3}X_{3}^{2}+\dots+a_{n}X_{n}^{2}$ とし、$S\defeq\{\infty,2\}\cup\{$ある $i\ge3$ で $v_{p}(a_{i})\neq0$ の $p\}$（有限）とする。$v\in S$ では $f_{v}$ が $0$ を表すので、$h$ と $-g$ の両方が表す $c_{v}\in\mathbb{Q}_{v}^{\times}$ がある（\ref{nt:representation-criteria} の 2）。$h(x_{1}^{v},x_{2}^{v})=c_{v}$ とする。\ref{nt:rational-approximation} と、$h$ の連続性、$\mathbb{Q}_{v}^{\times2}$ が開であることから、$c\defeq h(x_{1},x_{2})$ が $v\in S$ で $c/c_{v}\in\mathbb{Q}_{v}^{\times2}$ をみたす $x_{1},x_{2}\in\mathbb{Q}$ がある（各 $v\in S$ で $(x_{1},x_{2})$ を $(x_{1}^{v},x_{2}^{v})$ に十分近くとる）。$f_{1}\defeq cZ^{2}\oplus g$（$n-1$ 変数）とする。
- $v\in S$：$-g$ は $c_{v}$、したがって $c$ を表すので、$f_{1}$ は $0$ を表す。
- $v=p\notin S$：$g$ の係数は $p$ 進単数で $p\neq2$。3 変数 $a_{3}X_{3}^{2}+a_{4}X_{4}^{2}+a_{5}X_{5}^{2}$ は \ref{nt:finite-field-conic} から $\bmod p$ で自明でない零点 $(x_{3},x_{4},x_{5})$ をもち、たとえば $x_{3}\not\equiv0$ なら、$x_{4},x_{5}$ を固定して $a_{3}X^{2}+(a_{4}x_{4}^{2}+a_{5}x_{5}^{2})$ の単根（微分 $2a_{3}x_{3}\not\equiv0$）をヘンゼルの補題で持ち上げられる。よって $g$、したがって $f_{1}$ は $0$ を表す。
帰納法の仮定（$n-1\ge4$）から $f_{1}$ は $\mathbb{Q}$ で $0$ を表し、\ref{nt:representation-criteria} の 1 から $g$ は $-c$ を表す：$g(y)=-c=-h(x_{1},x_{2})$。$c\neq0$ なので $(x_{1},x_{2},y)\neq0$ が $f$ の零点。
:::

::: corollary 局所大域原理の帰結 {#nt:hasse-minkowski-corollaries keywords="f represents a in Q iff it does in every Q_v; Meyer: a form of rank >= 5 represents 0 iff it is indefinite; ternary forms (and quaternary forms with d = 1) representing 0 everywhere except at one place represent 0" index="マイヤーの定理|まいやーのていり" refname="局所大域原理の帰結"}
1. $a\in\mathbb{Q}^{\times}$ について、$f$ が $\mathbb{Q}$ で $a$ を表す $\iff$ すべての $\mathbb{Q}_{v}$ で表す。
2. （**マイヤーの定理**）階数 $\ge5$ の形式が $0$ を表す $\iff$ 不定値（$\mathbb{R}$ で $0$ を表す）。
3. 階数 $3$ の形式、または階数 $4$ で $d(f)=1$ の形式が、一つを除くすべての $\mathbb{Q}_{v}$ で $0$ を表すなら、$f$ は $0$ を表す。
:::

::: intuition
局所大域原理から、数を表すことも局所的に判定でき、5 変数以上では実数の条件（不定値性）だけが残る。3 変数では局所的な障害の個数は偶数なので、障害が一か所だけということはない。
:::

::: proof
**Step 1（1）.** 【主張：$a$ の表現は $f\ominus aZ^{2}$ の零点と同値】$f\ominus aZ^{2}$ に定理を使い、\ref{nt:representation-criteria} の 1。

**Step 2（2）.** 【主張：階数 $\ge5$ では $\mathbb{R}$ 以外の局所条件は自動的に成り立つ】\ref{nt:local-isotropy} の 4 からすべての $\mathbb{Q}_{p}$ で $0$ を表すので、$\mathbb{R}$ の条件だけが残る。

**Step 3（3）.** 【主張：局所条件は積公式をみたす族の等式なので一か所は残りから決まる】階数 $3$ では、$f_{v}$ が $0$ を表す $\iff(-1,-d(f))_{v}=\varepsilon_{v}(f)$（\ref{nt:local-isotropy}、$\mathbb{R}$ でも）。両辺の族はどちらも積公式をみたす（$\varepsilon_{v}(f)=\prod_{i<j}(a_{i},a_{j})_{v}$）ので、一つを除いて等しければすべての $v$ で等しい。階数 $4$, $d=1$ では条件 $\varepsilon_{v}(f)=(-1,-1)_{v}$ について同じ議論。
:::

::: example
$3X^{2}+4Y^{2}-7Z^{2}$ は $(1,1,1)$ で $0$ を表す。一方 $X^{2}+Y^{2}-3Z^{2}$ は $0$ を表さない：$\mathbb{Q}_{3}$ で、原始解の $\bmod3$ から $x^{2}+y^{2}\equiv0$、$-1$ が非平方なので $x\equiv y\equiv0$、すると $3z^{2}\equiv0\pmod9$ で $z\equiv0$ となり矛盾。局所的な障害が $\mathbb{Q}_{3}$ にあるので $\mathbb{Q}$ でも解がない。積公式から障害のある素点の個数は偶数で、実際 $\mathbb{Q}_{2}$ にもある（$\varepsilon_{2}=1$, $(-1,3)_{2}=-1$）。
:::

## $\mathbb{Q}$ 上の分類 {#nt:sec-hm-classification}

::: theorem $\mathbb{Q}$ 上の 2 次形式の分類 {#nt:rational-classification keywords="two quadratic forms over Q are equivalent iff they are equivalent over every Q_v, iff they have the same rank, discriminant, signature and Hasse invariants epsilon_v" index="有理数体上の 2 次形式の分類|ゆうりすうたいじょうのにじけいしきのぶんるい" refname="Q 上の 2 次形式の分類"}
$\mathbb{Q}$ 上の非退化な形式 $f,f'$ が同値 $\iff$ すべての $v$ で $f_{v}\sim f'_{v}$ $\iff$ 階数・判別式 $d\in\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$・符号数・すべての $\varepsilon_{v}$ が等しい。
:::

::: intuition
有理数体上の 2 次形式は、各素点での形式（したがって判別式・符号数・各素点のハッセ不変量）で完全に決まる。局所的に同じなら大域的にも同じである。
:::

::: proof
**Step 1（局所的な同値から大域的な同値）.** 階数 $n$ についての帰納法。$n\ge1$ なら $f$ が表す $a\in\mathbb{Q}^{\times}$ をとると、$f'_{v}\sim f_{v}$ も $a$ を表すので、\ref{nt:hasse-minkowski-corollaries} の 1 から $f'$ も $\mathbb{Q}$ で $a$ を表す。$f\sim aZ^{2}\oplus g$, $f'\sim aZ^{2}\oplus g'$ と書くと、消去定理（\ref{nt:witt-cancellation}）から各 $v$ で $g_{v}\sim g'_{v}$、帰納法の仮定から $g\sim g'$。

**Step 2（不変量）.** 局所的な同値は \ref{nt:local-classification} と、$\mathbb{R}$ ではシルヴェスターの慣性法則で、$d_{v},\varepsilon_{v}$ と符号数の一致と同値。$d_{v}$ がすべて一致することは、\ref{nt:p-adic-squares} と符号から $d$ が $\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ で一致することと同値（$d/d'$ が各 $\mathbb{Q}_{p}$ で平方 $\Rightarrow v_{p}$ 偶数、$\mathbb{R}$ で平方 $\Rightarrow$ 正）。
:::

::: proposition $\mathbb{Q}$ 上の不変量の実現 {#nt:rational-invariants-realization keywords="invariants d, eps_v, (r, s) of a form over Q satisfy: eps_v = 1 for almost all v and prod eps_v = 1; eps_v = 1 if n = 1 or n = 2 and d_v = -1; r + s = n; d_infinity = (-1)^s; eps_infinity = (-1)^{s(s-1)/2}; conversely every such system is realized" index="不変量の実現（有理数体）|ふへんりょうのじつげん" refname="Q 上の不変量の実現"}
$n\ge1$, $d\in\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$, $(\varepsilon_{v})_{v\in V}$, $(r,s)$ が次をみたすとする：(1) 有限個を除き $\varepsilon_{v}=1$ で $\prod\varepsilon_{v}=1$；(2) $n=1$、または $n=2$ かつ $d_{v}=-1$ なら $\varepsilon_{v}=1$；(3) $r,s\ge0$, $r+s=n$；(4) $d_{\infty}=(-1)^{s}$；(5) $\varepsilon_{\infty}=(-1)^{s(s-1)/2}$。このとき、これらを不変量にもつ階数 $n$ の形式がある。逆に任意の形式の不変量は (1)〜(5) をみたす。
:::

::: intuition
不変量の族に課される制約は、積公式・2 変数の例外・実数での整合性の 3 種類だけで、それ以外はすべて実際の形式で実現できる。
:::

::: proof
**Step 1（必要性）.** 【主張：形式の不変量は (1)〜(5) をみたす】(1) は積公式、(2) は \ref{nt:local-invariants-realization}、(3)〜(5) は \ref{nt:real-forms-invariants}。

**Step 2（$n=1,2$）.** 【主張：$xX^{2}+xdY^{2}$ で $n=2$ を実現する】$n=1$ は $dX^{2}$。$n=2$：各 $v$ で、(2) と非退化性から $(x_{v},-d)_{v}=\varepsilon_{v}$ となる $x_{v}$ がある（$d_{v}=-1$ なら $\varepsilon_{v}=1$ で $x_{v}=1$）。(1) と \ref{nt:prescribed-hilbert-symbols} から、すべての $v$ で $(x,-d)_{v}=\varepsilon_{v}$ となる $x\in\mathbb{Q}^{\times}$ がある。$xX^{2}+xdY^{2}$ は $d$ と $\varepsilon_{v}=(x,xd)_{v}=(x,-d)_{v}$ をもつ。$n\le2$ の符号数は (4)(5) と $d_{\infty},\varepsilon_{\infty}$ から自動的に合う。

**Step 3（$n=3$）.** 【主張：$cZ^{2}\oplus g$ で $n=3$ を実現する】$S\defeq\{v:(-d,-1)_{v}=-\varepsilon_{v}\}$（有限）。$v\in S$ で $c_{v}\neq-d$ となる平方類 $c_{v}\in\mathbb{Q}_{v}^{\times}/\mathbb{Q}_{v}^{\times2}$ を選び、\ref{nt:rational-approximation} と平方類が開集合であることから $c\in\mathbb{Q}^{\times}$ を $v\in S$ で $c\equiv c_{v}$（平方類）にとる。$n=2$ の場合で $d(g)=cd$, $\varepsilon_{v}(g)=(c,-d)_{v}\varepsilon_{v}$ の $g$ を作る（条件 (1) は積公式から、(2)：$d_{v}(g)=-1$ となる $v$ では $c=-d$ なので $v\notin S$、$(c,-d)_{v}\varepsilon_{v}=(-d,-d)_{v}\varepsilon_{v}=(-d,-1)_{v}\varepsilon_{v}=1$）。$f=cZ^{2}\oplus g$ は $d(f)=d$, $\varepsilon_{v}(f)=\varepsilon_{v}(g)(c,cd)_{v}=\varepsilon_{v}$。符号数は $n=3$ では $d_{\infty},\varepsilon_{\infty}$ から決まる。

**Step 4（$n\ge4$）.** 【主張：$\pm X^{2}$ を足して階数を一つずつ上げる】$n$ についての帰納法。$r\ge1$ なら、不変量 $d$, $(\varepsilon_{v})$, $(r-1,s)$ の $n-1$ 変数の $g$ をとり $X^{2}\oplus g$。$r=0$ なら、$-d$, $(\varepsilon_{v}(-1,-d)_{v})$, $(0,n-1)$ の $h$ をとり $-X^{2}\oplus h$（$\varepsilon(-X^{2}\oplus h)=\varepsilon(h)(-1,d(h))=\varepsilon_{v}(-1,-d)(-1,-d)$）。いずれも (1)〜(5) が保たれることは直接確かめられる。
:::

::: hypcheck
- **ヒルベルト記号を指定した有理数**：ディリクレの算術級数定理は Step 1 で「$S\cup T$ の外の新しい素数 $p\equiv a\pmod m$」を得るのに本質的。積公式は Step 4 で $p$ での値を合わせるのに使った。
- **ハッセ–ミンコフスキー**：$n=3$ の降下は $\mathbb{Z}$ の大きさ（絶対値）の減少を使う。$n=4$ はヒルベルト記号の指定（したがって算術級数定理）を、$n\ge5$ は近似補題と、$S$ の外での有限体の議論（シュヴァレー）とヘンゼルの補題を使った。
- **3 次以上では偽**：$3X^{3}+4Y^{3}+5Z^{3}=0$ はすべての $\mathbb{Q}_{v}$ で解をもつが $\mathbb{Q}$ では自明な解しかもたない（セルマー）。証明は 2 次形式特有の「1 変数ずつの分離」と積公式に依存している。
- **分類**：消去定理（ヴィット）が帰納法の各段で本質的。
:::

## 問題 {#nt:sec-hm-problems}

::: problem {#nt:prob-hm-legendre}
$X^{2}+Y^{2}-7Z^{2}$ は $\mathbb{Q}$ で $0$ を表すか。どの素点に障害があるか答えよ。
:::

::: solution
障害は $7$ と $2$ にある。$\mathbb{Q}_{7}$：原始解の $\bmod7$ から $x^{2}+y^{2}\equiv0$、$-1$ は $\bmod7$ の非平方（$7\equiv3\bmod4$）なので $x\equiv y\equiv0$、$7z^{2}\equiv0\pmod{49}$ から $z\equiv0$ で矛盾。よって $\mathbb{Q}$ でも表さない。$\mathbb{Q}_{2}$：$\varepsilon_{2}=(1,1)(1,-7)(1,-7)=1$, $-d=7$, $(-1,7)_{2}=(-1)^{\varepsilon(-1)\varepsilon(7)}=-1\neq\varepsilon_{2}$ で表さない。他の奇素数 $p\neq7$ では $(-1,7)_{p}=1=\varepsilon_{p}$、$\infty$ では不定値で表す。障害の個数 $2$ は偶数で積公式と整合。
:::

::: problem {#nt:prob-hm-meyer}
$X_{1}^{2}+X_{2}^{2}+X_{3}^{2}+X_{4}^{2}-7X_{5}^{2}$ が $0$ を表すことをマイヤーの定理から結論し、実際に零点を一つ見つけよ。
:::

::: solution
5 変数で不定値なので \ref{nt:hasse-minkowski-corollaries} の 2 から $0$ を表す。$7=4+1+1+1$ なので $(2,1,1,1,1)$ が零点。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 定理の $n=2,3$ の場合は算術級数定理を使わない（$n=3$ はルジャンドルの降下）。$n\ge4$ で初めて使う。$n=2$ の局所大域原理は、「有限個を除くすべての $v$ で $0$ を表す」だけで成り立つことも、算術級数定理から示せる（Se7 IV §3.2 の注意）。

**前提を変えると.**
- **代数体**：任意の代数体 $K$ 上でもハッセ–ミンコフスキーの定理は成り立つ（ハッセ）。証明には \ref{nt:global-class-field-theory} の一部、またはヒルベルト記号の積公式と対応する存在定理が要る。
- **整数上**：整数係数の形式が整数を表すかどうかでは局所大域原理は成り立たない（種と類の違い）。たとえば $X^{2}+11Y^{2}$ と $3X^{2}+2XY+4Y^{2}$ は同じ種に属するが、前者は $3$ を表さず後者は表す。
- **3 次以上**：上のセルマーの例のように偽で、その障害はテイト–シャファレヴィッチ群やブラウアー–マニン障害として研究される。

**高い視点から：局所大域原理と積公式.** ハッセ不変量の族 $(\varepsilon_{v})$ の唯一の大域的制約が積公式 $\prod\varepsilon_{v}=1$ であることは、ブラウアー群の完全列 $0\to\operatorname{Br}(\mathbb{Q})\to\bigoplus_{v}\operatorname{Br}(\mathbb{Q}_{v})\xrightarrow{\sum\mathrm{inv}_{v}}\mathbb{Q}/\mathbb{Z}\to0$（大域類体論の主定理の一つ）の 2 等分点の部分にあたる。左の単射性が「四元数環は局所的に分裂すれば大域的に分裂する」、すなわち 3 変数の形式のハッセ–ミンコフスキーの定理である。比喩で言えば、2 次形式の世界では「各地の地図（局所的な不変量）が辻褄（積公式）さえ合っていれば、それを描いた地球儀（大域的な形式）が一つに決まって存在する」。
:::
