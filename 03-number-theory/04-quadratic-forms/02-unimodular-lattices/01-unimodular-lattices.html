# ユニモジュラー格子 {#nt:page-unimodular-lattices keywords="unimodular lattice: free abelian group of finite rank with an integral symmetric bilinear form of determinant +-1; category S; invariants rank r, index tau = r - s, discriminant d = (-1)^{(r - tau)/2}, type I (odd) and type II (even), characteristic vectors and sigma(E) = u.u mod 8; examples I_+, I_-, U, Gamma_{4k}, the E8 lattice with 240 roots; unimodular sublattices split off orthogonally; indivisible vectors; stable isomorphism and the Grothendieck group K(S)"}

判別式が $\pm1$ の整係数 2 次形式、すなわち**ユニモジュラー格子**は、トポロジー（4 次元多様体の交叉形式）や表現論（$E_{8}$ のルート系）にも現れる対象である。有理数体の上では 2 次形式は局所的な不変量で分類されたが、整数の上ではずっと硬く、たとえば $x_{1}^{2}+\dots+x_{8}^{2}$ と $E_{8}$ 格子は $\mathbb{Q}$ 上同値でも $\mathbb{Z}$ 上同値でない。このページでは、ユニモジュラー格子の不変量（階数・指数・型・特性ベクトルの長さ $\sigma$）と基本的な例を整え、直交分解のための補題と、直和を足し算とみなした**グロタンディーク群** $K(S)$ を導入する。次のページで、不定値の格子がこれらの不変量で完全に分類されることを示す。

## 記法と定義の確認 {#nt:sec-ul-notation}

::: notation
- 体上の 2 次形式の用語（等方ベクトル・双曲平面など）は \ref{nt:quadratic-space}, \ref{nt:hyperbolic-plane}。実 2 次形式の符号数 $(r,s)$ は \ref{lin:sylvester-inertia}。
- PID 上の有限生成自由加群の部分加群は自由（\ref{mod:pid-submodule-free}）。可換モノイドのグロタンディーク群とその普遍性は \ref{cat:grothendieck-group}, \ref{cat:grothendieck-group-universal}。
- $\mathbb{F}_{2}=\mathbb{Z}/2$。
- 体系は $\ZF$。
:::

## 定義と不変量 {#nt:sec-ul-definitions}

::: definition ユニモジュラー格子 {#nt:unimodular-lattice keywords="unimodular lattice E: free Z-module of rank n with symmetric bilinear form E x E -> Z such that E -> Hom(E, Z) is an isomorphism, equivalently the Gram matrix has determinant +-1; the category S_n and S; isomorphism; orthogonal direct sum" index="ユニモジュラー格子|ゆにもじゅらーこうし, 整 2 次形式|せいにじけいしき" refname="ユニモジュラー格子"}
階数 $n$ の自由アーベル群 $E$ と対称双線形形式 $E\times E\to\mathbb{Z}$, $(x,y)\mapsto x\cdot y$ の組で、$x\mapsto(y\mapsto x\cdot y)$ が同型 $E\to\mathrm{Hom}(E,\mathbb{Z})$ になるものを、階数 $n$ の**ユニモジュラー格子**という。その全体を $S_{n}$、$S\defeq\bigcup_{n}S_{n}$ とする。形式を保つ群同型を**同型**、$E\oplus E'$ に $(x+x')\cdot(y+y')\defeq x\cdot y+x'\cdot y'$ を入れたものを**直和**という。基底 $(e_{i})$ について $Q(x)=x\cdot x=\sum a_{ii}x_{i}^{2}+2\sum_{i<j}a_{ij}x_{i}x_{j}$（$a_{ij}=e_{i}\cdot e_{j}$）。
:::

::: intuition
ユニモジュラー格子は「体積 $1$ の基本領域をもち、内積が整数になる格子」である。体積 $1$（判別式 $\pm1$）は、格子が自分自身の双対であること、すなわち整数値の線形関数がすべて内積で表せることと同じである。
:::

::: proposition ユニモジュラーの判定 {#nt:unimodular-determinant keywords="E -> Hom(E, Z) is an isomorphism iff det(e_i . e_j) = +-1; the discriminant d(E) = det is independent of the basis" index="ユニモジュラーの判定|ゆにもじゅらーのはんてい"}
基底 $(e_{i})$ のグラム行列 $A=(e_{i}\cdot e_{j})$ について、$E\to\mathrm{Hom}(E,\mathbb{Z})$ が同型 $\iff\det A=\pm1$。$d(E)\defeq\det A$ は基底によらない。
:::

::: proof
**Step 1（行列表示）.** 双対基底 $(e_{i}^{\ast})$ について、写像 $E\to\mathrm{Hom}(E,\mathbb{Z})$ の行列は $A$。整数行列 $A$ が $\mathbb{Z}^{n}$ の自己同型を与える $\iff$ 整数行列の逆行列をもつ $\iff\det A=\pm1$（⇐ は余因子行列 $A^{-1}=\pm\operatorname{adj}A$、⇒ は $\det A\det A^{-1}=1$ で両方整数）。

**Step 2（基底によらない）.** 基底を $B\in\GL_{n}(\mathbb{Z})$ で変えると $A\mapsto{}^{t}BAB$, $\det B=\pm1$ なので $\det A$ は変わらない。
:::

::: definition ユニモジュラー格子の不変量 {#nt:unimodular-invariants keywords="rank r(E); index tau(E) = r - s for the signature (r, s) of E tensor R; definite and indefinite; d(E) = (-1)^{(r - tau)/2}; even (type II) if x.x is always even, odd (type I) otherwise; characteristic vector u with u.x = x.x mod 2, unique mod 2E; sigma(E) = u.u mod 8" index="指数（ユニモジュラー格子）|しすう, 偶格子|ぐうこうし, 奇格子|きこうし, 特性ベクトル|とくせいべくとる, 型（ユニモジュラー格子）|かた" refname="ユニモジュラー格子の不変量"}
$E\in S$ について：
1. **階数** $r(E)$。$E\otimes\mathbb{R}$ の符号数を $(r,s)$ として**指数** $\tau(E)\defeq r-s$。$\abs{\tau}=r(E)$ なら**定値**、そうでなければ**不定値**。
2. **型**：$x\cdot x$ がつねに偶数なら**偶**（**II 型**）、そうでなければ**奇**（**I 型**）。
3. $u\cdot x\equiv x\cdot x\pmod2$（すべての $x\in E$）をみたす $u\in E$ を**特性ベクトル**という。$\sigma(E)\defeq u\cdot u\bmod8\in\mathbb{Z}/8$。
:::

::: intuition
偶格子では、すべてのベクトルの長さの 2 乗が偶数で、「長さ 1 の単位ベクトル」がない。特性ベクトルは「$x\cdot x$ の偶奇を内積で読み取るベクトル」で、偶格子なら $0$ がとれる。$\sigma$ はその長さの 2 乗を $8$ を法として見たもので、次のページで指数 $\tau$ と $\bmod8$ で一致することが示される。
:::

::: proposition 不変量の基本性質 {#nt:unimodular-invariants-properties keywords="d(E) = (-1)^{(r - tau)/2}, r = tau mod 2; characteristic vectors exist and are unique mod 2E; sigma is well defined; for type II sigma = 0; r, tau, sigma are additive and d multiplicative under direct sums; E + E' is even iff both are" index="特性ベクトルの存在|とくせいべくとるのそんざい"}
1. $r\equiv\tau\pmod2$, $d(E)=(-1)^{(r(E)-\tau(E))/2}$。
2. 特性ベクトルは存在し、$2E$ を法として一意。$\sigma(E)$ は well-defined で、偶格子では $\sigma(E)=0$。
3. $r,\tau,\sigma$ は直和について加法的、$d$ は乗法的。$E\oplus E'$ が偶 $\iff E,E'$ がともに偶。
:::

::: proof
**Step 1（1）.** $r+s=r(E)$ なので $\tau=r-s\equiv r+s$。$d(E)$ は $E\otimes\mathbb{R}$ の判別式と同じ符号をもち、それは $(-1)^{s}$（\ref{lin:sylvester-inertia}）、$\abs{d(E)}=1$ なので $d(E)=(-1)^{s}$, $s=(r(E)-\tau)/2$。

**Step 2（2：存在）.** 【主張：$\bar E\defeq E/2E$ 上で $\bar x\mapsto\bar x\cdot\bar x$ は線形で、内積は非退化】$(x+y)\cdot(x+y)\equiv x\cdot x+y\cdot y\pmod2$ なので線形形式。$\bar E$ 上の内積のグラム行列は $A\bmod2$ で $\det\equiv\pm1\equiv1$、非退化なので $\bar u\cdot\bar x=\bar x\cdot\bar x$ となる $\bar u$ がただ一つある。その持ち上げ $u$ が特性ベクトルで、特性ベクトルの $\bmod2$ はすべて $\bar u$、すなわち $2E$ を法として一意。

**Step 3（2：$\sigma$ の well-defined 性）.** $(u+2x)\cdot(u+2x)=u\cdot u+4(u\cdot x+x\cdot x)$ で、$u\cdot x+x\cdot x\equiv2x\cdot x\equiv0\pmod2$ なので $\equiv u\cdot u\pmod8$。偶格子では $u=0$ が特性ベクトル。

**Step 4（3）.** 直和では符号数が足し合わされ、グラム行列はブロック対角で行列式は積。$u,u'$ が特性ベクトルなら $u+u'$ は $E\oplus E'$ の特性ベクトルで $(u+u')^{2}=u^{2}+u'^{2}$。$x+x'$ の長さは $x\cdot x+x'\cdot x'$ なので型の主張も従う。
:::

## 例 {#nt:sec-ul-examples}

::: example
1. $I_{+}$（$\mathbb{Z}$ と $xy$）、$I_{-}$（$-xy$）。$sI_{+}\oplus tI_{-}$ は $\sum x_{i}^{2}-\sum y_{j}^{2}$ で、$r=s+t$, $\tau=s-t$, $d=(-1)^{t}$, 特性ベクトル $(1,\dots,1)$ から $\sigma\equiv s-t\pmod8$、$(s,t)\neq(0,0)$ なら奇。
2. $U$：行列 $\begin{pmatrix}0&1\\1&0\end{pmatrix}$、形式 $2x_{1}x_{2}$。偶で $r=2$, $\tau=0$, $d=-1$, $\sigma=0$。$U\otimes\mathbb{Q}$ は双曲平面。
:::

::: proposition 格子 $\Gamma_{4k}$ と $E_{8}$ {#nt:gamma-lattices keywords="Gamma_n for n = 4k: vectors x in Q^n with 2x_i in Z, x_i - x_j in Z, sum x_i in 2Z; it is unimodular, positive definite, even iff k is even; Gamma_8 = E_8 has exactly 240 vectors of norm 2" index="E8 格子|いーはちこうし, Γ_8|がんまはち" refname="格子 Γ_{4k} と E_8"}
$n=4k$ とし、$\Gamma_{n}\subseteq\mathbb{Q}^{n}$（標準内積）を、$2x_{i}\in\mathbb{Z}$, $x_{i}-x_{j}\in\mathbb{Z}$, $\sum x_{i}\in2\mathbb{Z}$ をみたす $x$ の全体とする。
1. $\Gamma_{n}$ は正定値なユニモジュラー格子で、$k$ が偶数（$n\equiv0\pmod8$）なら偶、$k$ が奇数なら奇。
2. $\Gamma_{8}$（**$E_{8}$ 格子**）の $x\cdot x=2$ となる元はちょうど 240 個：$\pm e_{i}\pm e_{j}$（$i<j$）の 112 個と、$\frac12\sum\varepsilon_{i}e_{i}$（$\varepsilon_{i}=\pm1$, $-1$ の個数が偶数）の 128 個。
:::

::: intuition
$\mathbb{Z}^{n}$ から「座標の和が偶数」の部分（指数 2）をとり、すべての座標が $\frac12$ の点 $e$ を加えると、体積を変えずに格子が組み替わる。$n=8$ では、新しい格子のすべてのベクトルの長さの 2 乗が偶数になり、長さ $\sqrt2$ のベクトルが 240 本も現れる。これが $8$ 次元で最も密な球充填を与える $E_{8}$ 格子である。
:::

::: proof
**Step 1（構成の言い換え）.** $E_{0}\defeq\mathbb{Z}^{n}$, $E_{1}\defeq\{x\in E_{0}:\sum x_{i}\in2\mathbb{Z}\}$（指数 2）、$e\defeq(\frac12,\dots,\frac12)$ とする。$\Gamma_{n}$ の元は、座標がすべて整数か、すべて整数 $+\frac12$ で、和が偶数のもの。前者は $E_{1}$、後者は $e+E_{1}$（$\sum(x_{i}-\frac12)=\sum x_{i}-2k$ は偶数）。よって $\Gamma_{n}=E_{1}\cup(e+E_{1})$、$2e=(1,\dots,1)\in E_{1}$（和 $4k$）なので部分群で $[\Gamma_{n}:E_{1}]=2$。

**Step 2（整数値で、ユニモジュラー）.** 【主張：内積は整数値で $\det=1$】$x\in E_{1}$ について $x\cdot e=\frac12\sum x_{i}\in\mathbb{Z}$、$e\cdot e=k$、$E_{1}$ 上は整数値。よって $\Gamma_{n}$ 上で整数値。$\Gamma_{n}$ と $E_{0}$ はどちらも $E_{1}$ を指数 2 で含むので、基本領域の体積が等しく、グラム行列式（体積の 2 乗）は $E_{0}$ と同じ $1$。正定値は明らか。

**Step 3（偶奇）.** $x\in E_{1}$ なら $x\cdot x\equiv\sum x_{i}\equiv0\pmod2$。$x=y+e$（$y\in E_{1}$）なら $x\cdot x=y\cdot y+2y\cdot e+k\equiv k\pmod2$。よって $k$ 偶数なら偶。$k$ 奇数なら $e\cdot e=k$ は奇数で奇。

**Step 4（240 本）.** $x\in\Gamma_{8}$, $x\cdot x=2$ とする。座標が整数なら $\sum x_{i}^{2}=2$ から $\pm1$ がちょうど 2 個で、和は偶数：$\pm e_{i}\pm e_{j}$、$4\binom82=112$ 個。座標が半整数なら各 $x_{i}^{2}\ge\frac14$ で和が $2=8\cdot\frac14$ なので $x_{i}=\pm\frac12$。$-\frac12$ の個数を $m$ とすると $\sum x_{i}=4-m$ が偶数 $\iff m$ 偶数で、$2^{7}=128$ 個。
:::

::: remark
$\Gamma_{8}$ の基底として $\frac12(e_{1}+e_{8})-\frac12(e_{2}+\dots+e_{7})$, $e_{1}+e_{2}$, $e_{i}-e_{i-1}$（$2\le i\le7$）をとると、グラム行列は対角成分 $2$、隣り合う頂点に $-1$ をもつ $E_{8}$ 型のディンキン図形のカルタン行列になる（Se7 V §1.4）。
:::

## 直交分解のための補題 {#nt:sec-ul-lemmas}

::: lemma ユニモジュラーな部分格子の分離 {#nt:unimodular-splitting keywords="a sublattice F of E is unimodular iff E = F + F^perp orthogonally; in particular a vector with x.x = +-1 splits off as I_+ or I_-" index="ユニモジュラーな部分格子|ゆにもじゅらーなぶぶんこうし" refname="ユニモジュラーな部分格子の分離"}
$E\in S$、$F\subseteq E$ を部分群（直和因子とは限らない）とし、$F'\defeq\{x\in E:x\cdot F=0\}$ とする。
1. $F$（誘導された形式）が $S$ に入る $\iff$ $E=F\oplus F'$（直交直和）。このとき $F'\in S$。
2. 特に $x\cdot x=\pm1$ なら $E=\mathbb{Z}x\oplus x^{\perp}$ で、$\mathbb{Z}x\cong I_{\pm}$。
:::

::: intuition
ユニモジュラーな部分格子は、直交補空間とともに格子全体をきれいに二分する。特に長さの 2 乗が $\pm1$ のベクトルは、いつでも直和因子 $I_{\pm}$ として切り離せる。
:::

::: proof
**Step 1（⇐）.** $E=F\oplus F'$ なら $d(E)=d(F)d(F')$（ブロック対角）で、整数の積が $\pm1$ なので $d(F)=\pm1$。$F$ は $E$ の直和因子なので自由（\ref{mod:pid-submodule-free}）。$F'$ も同様。

**Step 2（⇒）.** 【主張：$F$ がユニモジュラーなら $E=F\oplus F'$】$x\in F\cap F'$ なら $x\cdot F=0$ で、$F$ の非退化性（$\det\neq0$）から $x=0$。$x\in E$ について、$y\mapsto x\cdot y$（$y\in F$）は $\mathrm{Hom}(F,\mathbb{Z})$ の元なので、ユニモジュラー性から $x_{0}\cdot y=x\cdot y$（$y\in F$）となる $x_{0}\in F$ がある。$x-x_{0}\in F'$ で、$x=x_{0}+(x-x_{0})$。

**Step 3（2）.** $F=\mathbb{Z}x$ のグラム行列は $(\pm1)$。
:::

::: lemma 分割できないベクトル {#nt:indivisible-vector keywords="an element x of E is indivisible if it is not in nE for n >= 2; every nonzero element is m x with x indivisible; if x is indivisible there is y with x.y = 1" index="分割できないベクトル|ぶんかつできないべくとる, 原始ベクトル|げんしべくとる" refname="分割できないベクトル"}
$x\in E$ が $n\ge2$ のどの $nE$ にも入らないとき**分割できない**（原始的）という。
1. $0$ でない元は、$m\ge1$ と分割できない $x$ によって $mx$ と一意に書ける。
2. $E\in S$ で $x$ が分割できないなら、$x\cdot y=1$ となる $y\in E$ がある。
:::

::: intuition
整数で割り切れないベクトルには、内積がちょうど $1$ になる相手が必ずある。ユニモジュラー格子では、ベクトルと整数値の線形関数が一対一に対応するからである。
:::

::: proof
**Step 1（1）.** 基底で $z=(z_{1},\dots,z_{n})\neq0$ と書くと、$z\in nE\iff n\mid\gcd(z_{i})$。$m\defeq\gcd(z_{i})$, $x\defeq z/m$ とすれば $x$ の座標の最大公約数は $1$ で分割できない。一意性も最大公約数から。

**Step 2（2）.** 【主張：$f_{x}(y)\defeq x\cdot y$ は全射】$E\cong\mathrm{Hom}(E,\mathbb{Z})$ は群同型なので、$x$ が分割できない $\iff f_{x}$ が $\mathrm{Hom}(E,\mathbb{Z})$ で分割できない。$f_{x}$ の像は $\mathbb{Z}$ の部分群 $c\mathbb{Z}$ で、$c\ge2$ なら $f_{x}=c\cdot(f_{x}/c)$ と分割できてしまう（$f_{x}/c$ は整数値）。$f_{x}\neq0$ なので $c=1$。
:::

## グロタンディーク群 $K(S)$ {#nt:sec-ul-ks}

::: definition 安定同型と $K(S)$ {#nt:stable-isomorphism-ks keywords="E and E' are stably isomorphic if E + F = E' + F for some F; K_+(S) is the quotient monoid, which is cancellative; K(S) is its Grothendieck group; additive invariants r, tau, d, sigma factor through K(S)" index="安定同型|あんていどうけい, グロタンディーク群（ユニモジュラー格子）|ぐろたんでぃーくぐん" refname="安定同型と K(S)"}
$E,E'\in S$ が、ある $F\in S$ について $E\oplus F\cong E'\oplus F$ となるとき**安定同型**という（同値関係）。その商 $K_{+}(S)$ は $\oplus$ で可換モノイドになり、簡約律（$x+z=y+z\Rightarrow x=y$）をみたす。そのグロタンディーク群を $K(S)$、$E$ の類を $(E)$ と書く。$K(S)$ の元は $(E)-(F)$ と書け、$(E)-(F)=(E')-(F')\iff E\oplus F'$ と $E'\oplus F$ が安定同型。
:::

::: intuition
直和を足し算とみなし、共通の格子を足して同型になるものを同一視すると、格子の集まりは整数のような群になる。そこでは「打ち消し」ができるので、加法的な不変量はすべてこの群の準同型として扱える。
:::

::: proposition $K(S)$ の普遍性 {#nt:ks-universal keywords="an additive function f: S -> A (f(E1 + E2) = f(E1) + f(E2), invariant under isomorphism) extends uniquely to a homomorphism K(S) -> A; r, tau: K(S) -> Z, d: K(S) -> {+-1}, sigma: K(S) -> Z/8 are homomorphisms" index="K(S) の普遍性|けーえすのふへんせい"}
アーベル群 $A$ への写像 $f:S\to A$ が同型で不変かつ $f(E_{1}\oplus E_{2})=f(E_{1})+f(E_{2})$ をみたすなら、$f((E)-(F))\defeq f(E)-f(F)$ は well-defined な準同型 $K(S)\to A$ である。特に $r,\tau:K(S)\to\mathbb{Z}$, $d:K(S)\to\{\pm1\}$, $\sigma:K(S)\to\mathbb{Z}/8$ は準同型。
:::

::: proof
**Step 1（簡約律）.** $(E)+(G)=(E')+(G)$ なら $E\oplus G\oplus H\cong E'\oplus G\oplus H$ となる $H$ があり、$F\defeq G\oplus H$ で $E,E'$ は安定同型。推移律も同様に、足す $F$ を直和でまとめて示せる。

**Step 2（well-defined）.** $(E)-(F)=(E')-(F')$ なら $E\oplus F'\oplus G\cong E'\oplus F\oplus G$ となる $G$ があり、加法性から $f(E)+f(F')+f(G)=f(E')+f(F)+f(G)$、すなわち $f(E)-f(F)=f(E')-f(F')$。準同型であることは定義から（\ref{cat:grothendieck-group-universal} の具体的な場合）。不変量の加法性は \ref{nt:unimodular-invariants-properties} の 3。
:::

::: hypcheck
- **ユニモジュラー性**：特性ベクトルの存在（$\bmod2$ での非退化性）と、部分格子の分離（双対の元が $F$ の中にあること）に本質的。判別式 $\pm1$ でない格子（たとえば $\mathbb{Z}$ と $2xy$）では、$x\cdot x$ が偶数でも特性ベクトルの理論は崩れる。
- **$\Gamma_{4k}$**：$n\equiv0\pmod4$ は $2e\in E_{1}$（和 $n/2$ が偶数）に、$n\equiv0\pmod8$ は偶であること（$e\cdot e=n/4$ が偶数）に使った。
- **分割できないベクトル**：$E\in S$（双対との同型）が $f_{x}$ の全射性に本質的。$E=\mathbb{Z}$ と $2xy$ では $x=1$ は分割できないが $x\cdot y$ は偶数しかとらない。
:::

## 問題 {#nt:sec-ul-problems}

::: problem {#nt:prob-ul-u-vs-i11}
$U$ と $I_{+}\oplus I_{-}$ はどちらも階数 2・指数 0 だが同型でないことを示せ。また $\sigma$ を比べよ。
:::

::: solution
$U$ は偶（$2x_{1}x_{2}$）、$I_{+}\oplus I_{-}$ は奇（$x^{2}-y^{2}$ は $x=1,y=0$ で $1$）なので同型でない。$\sigma(U)=0$、$I_{+}\oplus I_{-}$ の特性ベクトル $(1,1)$ から $\sigma=1-1=0$。どちらも $\sigma\equiv\tau\pmod8$ と整合し、$\sigma$ では区別できない。
:::

::: problem {#nt:prob-ul-gamma4}
$\Gamma_{4}$ は $4I_{+}$ と同型であることを示せ（ヒント：$x\cdot x=1$ の元を探す）。
:::

::: solution
$\Gamma_{4}$ の半整数の元 $\frac12(\pm1,\pm1,\pm1,\pm1)$（$-$ の個数が偶数）は長さの 2 乗が $1$。$f_{1}=\frac12(1,1,1,1)$, $f_{2}=\frac12(1,1,-1,-1)$, $f_{3}=\frac12(1,-1,1,-1)$, $f_{4}=\frac12(1,-1,-1,1)$ は互いに直交し長さ $1$。\ref{nt:unimodular-splitting} の 2 を繰り返すと $\Gamma_{4}=\bigoplus\mathbb{Z}f_{i}\oplus F'$ で、階数から $F'=0$、$\Gamma_{4}\cong4I_{+}$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** このページでは $\mathbb{Q}$ 上の 2 次形式の理論をまだ使っていない（次のページで、不定値な格子が $0$ を表すことにハッセ–ミンコフスキーの定理を使う）。

**前提を変えると.**
- **局所不変量**：$\varepsilon_{p}(E)=1$（$p\neq2$）、$\varepsilon_{2}(E)=(-1)^{j}$, $j=\frac14(d(E)+r(E)-\sigma(E)-1)$ が成り立つ（Se7 V §1.3.6、証明は読者に委ねられている。ここでは使わない）。
- **ユニモジュラーでない格子**：判別式 $D$ の格子では、局所的な不変量（種）と大域的な同型類（類）が一般に異なり、種の中の類の個数（類数）が問題になる。ユニモジュラーで不定値の場合は、次のページで類数が $1$ であることがわかる。
- $E_{8}$ の 240 本のベクトルは $E_{8}$ 型のルート系をなし、$\Gamma_{8}$ の自己同型群は $E_{8}$ のワイル群（位数 $2^{14}3^{5}5^{2}7$）である（ブルバキ『リー群とリー環』第 VI 章、ここでは証明しない）。

**高い視点から：交叉形式としてのユニモジュラー格子.** 単連結な閉 4 次元多様体 $M$ の 2 次ホモロジー $H_{2}(M;\mathbb{Z})$ は、交叉数によってユニモジュラー格子になる（ポアンカレ双対性がユニモジュラー性そのもの）。偶の型はスピン構造をもつことに、指数は多様体の符号数に対応し、次のページの「偶格子の指数は 8 の倍数」は、滑らかなスピン 4 次元多様体の符号数は 16 の倍数（ロホリンの定理）という、より強い位相的な制約の代数的な影の部分である。$E_{8}$ 格子を交叉形式にもつ位相多様体（フリードマン）は滑らかな構造をもたない（符号数 $8$ がロホリンの定理に反する）。
:::
