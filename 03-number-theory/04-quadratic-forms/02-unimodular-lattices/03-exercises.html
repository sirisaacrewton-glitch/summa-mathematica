# 演習：ユニモジュラー格子 {#nt:page-exercises-unimodular-lattices keywords="exercises, characteristic vector of Gamma_12, Gamma_16 versus E_8 + E_8, roots generating E_8, rank and discriminant of even lattices, indefinite unimodular lattices of rank 4, E_8 + E_8(-1) = 8U, definite odd lattices with the same invariants"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#nt:sec-exul-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$E(-1)$ は $E$ の形式の符号を変えた格子、$e_{i}$ は $\mathbb{Q}^{n}$ の標準基底。
:::

## ユニモジュラー格子 {#nt:sec-ul-exercises}

対応するページ：\ref{nt:page-unimodular-lattices}

::: problem ★ 基本：$\Gamma_{12}$ の特性ベクトル {#nt:ex-ul-gamma12-char}
$u=2e_{1}=(2,0,\dots,0)$ が $\Gamma_{12}$ の特性ベクトルであることを示し、$\sigma(\Gamma_{12})$ を求めよ。
:::

::: solution
$u\in\Gamma_{12}$（整数座標で和 $2$）。$\Gamma_{12}=E_{1}\cup(e+E_{1})$（\ref{nt:gamma-lattices} の証明）で、$y\in E_{1}$ なら $y\cdot y\equiv\sum y_{i}\equiv0$、$u\cdot y=2y_{1}$ も偶数。$x=y+e$ なら $x\cdot x\equiv k=3\equiv1$、$u\cdot x=2y_{1}+1$ は奇数。よって $u\cdot x\equiv x\cdot x\pmod2$。$\sigma=u\cdot u=4$。$\tau=12\equiv4\pmod8$ と一致する。
:::

::: problem ★★ 標準：$\Gamma_{16}\not\cong E_{8}\oplus E_{8}$ {#nt:ex-ul-gamma16}
$\Gamma_{16}$ と $E_{8}\oplus E_{8}$ はどちらも階数 16 の正定値な偶ユニモジュラー格子だが、同型でないことを、長さの 2 乗が $2$ のベクトルの生成する部分群を比べて示せ。
:::

::: solution
$\Gamma_{16}$ の半整数座標の元は長さの 2 乗が $\ge16\cdot\frac14=4$ なので、長さ 2 の元は整数座標の $\pm e_{i}\pm e_{j}$ だけ。それらの生成する部分群は「整数座標で和が偶数」の $E_{1}$ に含まれ、$e\notin E_{1}$ なので $\Gamma_{16}$ 全体ではない。一方 $E_{8}$ は、\ref{nt:gamma-lattices} の後の注意の基底（$\frac12(e_{1}+e_{8})-\frac12(e_{2}+\dots+e_{7})$, $e_{1}+e_{2}$, $e_{i}-e_{i-1}$）がすべて長さの 2 乗 $2$ なので、長さ 2 の元で生成され、$E_{8}\oplus E_{8}$ も同様。同型は長さ 2 の元を長さ 2 の元に写すので、同型でない。
:::

## 不定値ユニモジュラー格子の構造 {#nt:sec-il-exercises}

対応するページ：\ref{nt:page-indefinite-lattices}

::: problem ★ 基本：偶格子の階数と判別式 {#nt:ex-il-even-rank}
偶のユニモジュラー格子 $E$ について、$r(E)$ は偶数で $d(E)=(-1)^{r(E)/2}$ であることを示せ。
:::

::: solution
\ref{nt:ks-determination} の 3 から $\tau\equiv0\pmod8$、$r\equiv\tau\pmod2$ なので $r$ は偶数。$d=(-1)^{(r-\tau)/2}$ で、$\tau/2\equiv0\pmod4$ は偶数なので $d=(-1)^{r/2}$。
:::

::: problem ★★ 標準：階数 4 の不定値格子 {#nt:ex-il-rank-four}
階数 4 の不定値ユニモジュラー格子の同型類をすべて挙げ、形式 $x_{1}x_{2}+x_{3}x_{4}$（の 2 倍の内積の格子）がどれに当たるか答えよ。また $E_{8}\oplus E_{8}(-1)\cong8U$ を示せ。
:::

::: solution
奇：$3I_{+}\oplus I_{-}$, $2I_{+}\oplus2I_{-}$, $I_{+}\oplus3I_{-}$。偶：$\tau\equiv0\pmod8$, $\abs\tau<4$ から $\tau=0$ で $2U$。計 4 個。行列 $\begin{pmatrix}0&1\\1&0\end{pmatrix}^{\oplus2}$ の格子（形式 $2x_{1}x_{2}+2x_{3}x_{4}$）は偶で $2U$。$E_{8}\oplus E_{8}(-1)$ は偶で不定値、$r=16$, $\tau=0$ なので \ref{nt:even-indefinite-structure}（$q=0$, $p=8$）から $8U$。
:::

::: problem ★★★ 発展：定値の奇格子は不変量で決まらない {#nt:ex-il-definite-odd}
$I_{+}\oplus E_{8}$ と $9I_{+}$ は階数・指数・型が等しいが、同型でないことを示せ。$I_{-}$ を足すとどうなるか。
:::

::: solution
どちらも正定値・奇で $r=\tau=9$。長さの 2 乗が $1$ の元を数える。$9I_{+}$ では $\pm e_{i}$ の 18 個。$I_{+}\oplus E_{8}$ では $(a,v)$ で $a^{2}+v\cdot v=1$、$v\cdot v$ は偶数で $\ge0$ なので $v=0$, $a=\pm1$ の 2 個。同型は長さを保つので同型でない。$I_{-}$ を足すと、どちらも不定値・奇で $r=10$, $\tau=8$ なので \ref{nt:odd-indefinite-structure} から $9I_{+}\oplus I_{-}$ に同型。定値の場合は安定同型でも同型とは限らない（\ref{nt:ks-determination} の 1）ことの例である。
:::
