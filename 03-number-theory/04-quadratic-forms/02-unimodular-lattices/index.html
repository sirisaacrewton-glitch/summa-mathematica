# ユニモジュラー格子（Unimodular Lattices）

判別式 ±1 の整 2 次形式：階数・指数・型・特性ベクトルによる不変量、E8 格子、グロタンディーク群 K(S)、不定値の格子の構造定理（ミルナー）、偶格子の指数は 8 の倍数。Serre『数論講義』第 V 章に対応。

<p class="mn-msc">MSC2020: 11E12, 11H06</p>

## 前提知識

- [2 次形式 › 有理数体上の 2 次形式](../../../03-number-theory/04-quadratic-forms/01-rational-forms/index.html)（全体、7 ページ）：ハッセ–ミンコフスキーの定理・マイヤーの定理・p 進体上の 2 次形式
