# 不定値ユニモジュラー格子の構造 {#nt:page-indefinite-lattices keywords="indefinite unimodular lattices represent zero (via Hasse-Minkowski and Meyer); odd indefinite lattices split off I_+ + I_- and are isomorphic to s I_+ + t I_-; K(S) is free on (I_+), (I_-); stable isomorphism is determined by rank and index; sigma = tau mod 8; even lattices have index divisible by 8; definite even lattices have rank divisible by 8; even indefinite lattices split off U; the lemma comparing U + F and I_+ + I_- + F via the even sublattice and its dual; classification p U + q E_8; Milnor's theorem: indefinite unimodular lattices are classified by rank, index and type; definite case: Mordell, Witt, Niemeier, mass formula"}

不定値のユニモジュラー格子は、**階数・指数・型**（偶か奇か）の 3 つで完全に分類される（ミルナー）：奇なら $sI_{+}\oplus tI_{-}$、偶なら $pU\oplus qE_{8}$（または符号を変えたもの）に同型である。証明の第一歩は、不定値な格子が $0$ でない長さ $0$ のベクトルをもつことで、これはハッセ–ミンコフスキーの定理（マイヤーの定理）から従う。そこから双曲平面を分離して帰納法を回す。副産物として、**偶格子の指数は 8 の倍数**、特に正定値な偶格子の階数は 8 の倍数であることが、グロタンディーク群 $K(S)$ の計算から得られる。

## 記法と定義の確認 {#nt:sec-il-notation}

::: notation
- ユニモジュラー格子、不変量 $r,\tau,d,\sigma$ と型、$I_{\pm}$, $U$, $\Gamma_{8}=E_{8}$、ユニモジュラーな部分格子の分離、分割できないベクトル、$K(S)$ は \ref{nt:unimodular-lattice}, \ref{nt:unimodular-invariants}, \ref{nt:unimodular-invariants-properties}, \ref{nt:gamma-lattices}, \ref{nt:unimodular-splitting}, \ref{nt:indivisible-vector}, \ref{nt:stable-isomorphism-ks}, \ref{nt:ks-universal}。
- $E$ が **$0$ を表す**とは $x\cdot x=0$ となる $x\neq0$ があることで、$E\otimes\mathbb{Q}$ の形式が $0$ を表すことと同値（有理数の零点に分母を払う）。
- 局所大域原理とその系（マイヤーの定理、一か所を除いて表せば表す）、局所体での零の判定は \ref{nt:hasse-minkowski}, \ref{nt:hasse-minkowski-corollaries}, \ref{nt:local-isotropy}。3 変数の形式が有限体で零点をもつことと単根の持ち上げは \ref{nt:finite-field-conic}, \ref{nt:hensel-lemma}。$-1$ は $\mathbb{Q}_{2}$ の平方でない（\ref{nt:p-adic-squares}）。
- 体系は $\ZFC$（ハッセ–ミンコフスキーの定理を通して）。
:::

## 不定値な格子は $0$ を表す {#nt:sec-il-isotropic}

::: theorem 不定値な格子の等方ベクトル {#nt:indefinite-lattice-isotropic keywords="an indefinite unimodular lattice represents zero; proof by rank: 2 (d = -1), 3 and 4 (local isotropy at odd primes by Chevalley and Hensel, at 2 by the product formula or d = -1), >= 5 (Meyer)" index="不定値な格子の等方ベクトル|ふていちなこうしのとうほうべくとる" refname="不定値な格子の等方ベクトル"}
不定値な $E\in S$ は $0$ を表す。
:::

::: intuition
不定値な格子は実数の上では長さ $0$ の方向（光円錐）をもつ。問題はそれが有理数の方向にとれるかで、ユニモジュラー性のおかげで奇素数では障害がなく、$2$ での障害も判別式 $\pm1$ と積公式で排除できる。5 次元以上ではマイヤーの定理がそのまま使える。
:::

::: proof
$n\defeq r(E)$、$f$ を基底についての形式（整数行列 $A$、$\det A=\pm1$）とする。

**Step 1（$n=2$）.** 符号数は $(1,1)$ なので $d(E)=-1$。$f\sim aX^{2}+bY^{2}$（$\mathbb{Q}$ 上）で $ab\equiv-1$（平方類）、$-a/b=-ab\cdot b^{-2}$ は平方なので $f$ は $0$ を表す。

**Step 2（奇素数での零点）.** 【主張：$n\ge3$ なら、奇素数 $p$ で $f$ は $\mathbb{Q}_{p}$ の零点をもつ】$A\bmod p$ は $\det\not\equiv0$ なので非退化。$\bmod p$ の形式は 3 変数以上なので \ref{nt:finite-field-conic} から自明でない零点 $\bar x$ をもつ。$A\bar x\not\equiv0$（非退化）なので、ある $i$ で $(A\bar x)_{i}\not\equiv0$。他の座標を固定した $X_{i}$ の 2 次式は、$\bar x_{i}$ で値 $0$、微分 $2(A\bar x)_{i}\not\equiv0$ なので、\ref{nt:hensel-lemma} から $\mathbb{Z}_{p}$ の根に持ち上がる。

**Step 3（$n=3$）.** Step 2 と、$\mathbb{R}$ で不定値であることから、$f$ は $2$ 以外のすべての素点で $0$ を表す。\ref{nt:hasse-minkowski-corollaries} の 3 から $\mathbb{Q}$ で $0$ を表す。

**Step 4（$n=4$）.** 同様に $2$ 以外では $0$ を表す。$d(E)=1$ なら \ref{nt:hasse-minkowski-corollaries} の 3。$d(E)=-1$ なら $-1$ は $\mathbb{Q}_{2}$ の平方でないので $d\neq1$（平方類）で、\ref{nt:local-isotropy} の 3 から $\mathbb{Q}_{2}$ でも $0$ を表す。ハッセ–ミンコフスキーの定理から $\mathbb{Q}$ で $0$ を表す。

**Step 5（$n\ge5$）.** \ref{nt:hasse-minkowski-corollaries} の 2（マイヤー）。
:::

## 奇の型の構造定理 {#nt:sec-il-odd}

::: lemma 奇の不定値格子からの $I_{+}\oplus I_{-}$ の分離 {#nt:split-odd-hyperbolic keywords="an odd indefinite unimodular lattice E is isomorphic to I_+ + I_- + F with F unimodular" index="I_+ + I_- の分離|あいぷらすあいまいなすのぶんり"}
$E\in S_{n}$ が不定値で奇なら、$E\cong I_{+}\oplus I_{-}\oplus F$（$F\in S_{n-2}$）。
:::

::: proof
**Step 1（$x\cdot x=0$, $x\cdot y=1$）.** \ref{nt:indefinite-lattice-isotropic} から $x\cdot x=0$, $x\neq0$ の $x$ があり、割って分割できないとしてよい。\ref{nt:indivisible-vector} から $x\cdot y=1$ の $y$ がある。

**Step 2（$y\cdot y$ を奇数に）.** 【主張：$x\cdot y=1$ かつ $y\cdot y$ が奇数の $y$ がとれる】$y\cdot y$ が偶数なら、奇なので $t\cdot t$ が奇数の $t$ がある。$y'\defeq t+(1-x\cdot t)y$ とすると $x\cdot y'=x\cdot t+(1-x\cdot t)=1$、$y'\cdot y'=t\cdot t+2(1-x\cdot t)t\cdot y+(1-x\cdot t)^{2}y\cdot y\equiv t\cdot t\equiv1\pmod2$。

**Step 3（$I_{+}\oplus I_{-}$ の基底）.** 【主張：$y\cdot y=2m+1$ として $e_{1}\defeq y-mx$, $e_{2}\defeq y-(m+1)x$ は直交し $e_{1}^{2}=1$, $e_{2}^{2}=-1$】$e_{1}\cdot e_{1}=y\cdot y-2m=1$, $e_{2}\cdot e_{2}=2m+1-2(m+1)=-1$, $e_{1}\cdot e_{2}=y\cdot y-(m+1)-m=0$。$e_{1}-e_{2}=x$ なので $\mathbb{Z}e_{1}+\mathbb{Z}e_{2}=\mathbb{Z}x+\mathbb{Z}y\eqdef G$ で、$G\cong I_{+}\oplus I_{-}$ はユニモジュラー。\ref{nt:unimodular-splitting} から $E=G\oplus G^{\perp}$。
:::

::: theorem 奇の不定値格子の構造定理 {#nt:odd-indefinite-structure keywords="an odd indefinite unimodular lattice is isomorphic to s I_+ + t I_- with s, t >= 1; the quadratic form is equivalent over Z to x_1^2 + ... + x_s^2 - y_1^2 - ... - y_t^2" index="奇の不定値格子の構造定理|きのふていちこうしのこうぞうていり" refname="奇の不定値格子の構造定理"}
$E\in S$ が不定値で奇なら、$E\cong sI_{+}\oplus tI_{-}$（$s,t\ge1$）。$s,t$ は符号数そのものである。
:::

::: intuition
奇の不定値格子からは、長さ $+1$ と $-1$ の直交するベクトルの組をいくらでも分離できる。最後に残る部分も、$I_{\pm}$ を足して不定値・奇にできるので、帰納法で同じ形にほどける。
:::

::: proof
**Step 1（分離）.** \ref{nt:split-odd-hyperbolic} から $E\cong I_{+}\oplus I_{-}\oplus F$。$F=0$ なら終わり（$n=2$）。

**Step 2（帰納法）.** 【主張：$I_{+}\oplus F$ か $I_{-}\oplus F$ の一方は不定値】両方が定値なら、$I_{+}\oplus F$ は正定値（$I_{+}$ を含む）で $F$ は正定値、$I_{-}\oplus F$ は負定値で $F$ は負定値となり、$F\neq0$ に反する。たとえば $I_{+}\oplus F$ が不定値なら、それは奇で階数 $n-1$ なので、帰納法の仮定から $\cong aI_{+}\oplus bI_{-}$。よって $E\cong I_{-}\oplus(I_{+}\oplus F)\cong aI_{+}\oplus(b+1)I_{-}$。$I_{-}\oplus F$ の場合も同様。$s,t$ は $E\otimes\mathbb{R}$ の符号数で決まる。
:::

::: theorem $K(S)$ の決定と $\sigma\equiv\tau$ {#nt:ks-determination keywords="K(S) is free abelian on (I_+) and (I_-); (r, tau) embeds K(S) onto {(a, b) : a = b mod 2}; two unimodular lattices are stably isomorphic iff they have the same rank and index; sigma(E) = tau(E) mod 8; even lattices have tau = 0 mod 8; positive definite even lattices have rank divisible by 8" index="K(S) の決定|けーえすのけってい, 偶格子の指数|ぐうこうしのしすう" refname="K(S) の決定と σ≡τ"}
1. $K(S)$ は $(I_{+})$, $(I_{-})$ を基底とする階数 2 の自由アーベル群で、$(r,\tau)$ は $K(S)$ から $\{(a,b)\in\mathbb{Z}^{2}:a\equiv b\pmod2\}$ への同型。特に、$E,E'$ が安定同型 $\iff$ 階数と指数が等しい。
2. すべての $E\in S$ で $\sigma(E)\equiv\tau(E)\pmod8$。
3. $E$ が偶なら $\tau(E)\equiv0\pmod8$。さらに定値なら $r(E)\equiv0\pmod8$。
:::

::: intuition
グロタンディーク群の中では、どの格子も $I_{\pm}$ の整数係数の和に「ほどける」。そこでは $\sigma$ と $\tau\bmod8$ がどちらも準同型で、生成元 $I_{\pm}$ で一致するので全体で一致する。偶格子は $\sigma=0$ なので、指数が 8 の倍数という強い制約が出る。
:::

::: proof
**Step 1（生成）.** 【主張：$(E)$ は $(I_{+}),(I_{-})$ の整数係数の和】$E\neq0$ とする。\ref{nt:odd-indefinite-structure} の Step 2 と同じ理由で $E\oplus I_{+}$ か $E\oplus I_{-}$ は不定値で、$I_{\pm}$ を含むので奇。たとえば $E\oplus I_{+}\cong sI_{+}\oplus tI_{-}$ なら $(E)=(s-1)(I_{+})+t(I_{-})$。$K(S)$ の元は $(E)-(F)$ なので生成される。

**Step 2（独立と像）.** $(r,\tau)(I_{+})=(1,1)$, $(r,\tau)(I_{-})=(1,-1)$ は一次独立で、生成する部分群は $\{(a,b):a\equiv b\pmod2\}$。よって 1。安定同型 $\iff K(S)$ で $(E)=(E')$ $\iff(r,\tau)$ が等しい。

**Step 3（2）.** $\sigma$ と $\tau\bmod8$ は $K(S)\to\mathbb{Z}/8$ の準同型（\ref{nt:ks-universal}）で、$\sigma(I_{\pm})=\pm1=\tau(I_{\pm})$（特性ベクトル $1$）。生成元で一致するので等しい。

**Step 4（3）.** 偶なら $\sigma=0$（\ref{nt:unimodular-invariants-properties} の 2）なので $\tau\equiv0\pmod8$。定値なら $\tau=\pm r$。
:::

::: example
$E_{8}$（$\Gamma_{8}$）は正定値な偶格子で $r=8$。逆に、階数 $1$〜$7$ の正定値な偶ユニモジュラー格子は存在しない。$\Gamma_{4}$ や $\Gamma_{12}$ は奇なので矛盾しない。また $U$ と $I_{+}\oplus I_{-}$ は安定同型（$r=2,\tau=0$）だが同型でない（型が違う）。
:::

## 偶の型の構造定理 {#nt:sec-il-even}

::: lemma 偶の不定値格子からの $U$ の分離 {#nt:split-even-hyperbolic keywords="an even indefinite unimodular lattice is isomorphic to U + F with F even unimodular" index="U の分離|ゆーのぶんり"}
$E\in S$ が不定値で偶なら、$E\cong U\oplus F$（$F\in S$ は偶）。
:::

::: proof
\ref{nt:split-odd-hyperbolic} の Step 1 と同じく $x\cdot x=0$, $x\cdot y=1$ の $x,y$ をとる。$y\cdot y=2m$（偶）なので $y'\defeq y-mx$ とすると $y'\cdot y'=0$, $x\cdot y'=1$。$G\defeq\mathbb{Z}x+\mathbb{Z}y'\cong U$ はユニモジュラーで、\ref{nt:unimodular-splitting} から $E=G\oplus G^{\perp}$。$F\defeq G^{\perp}$ は偶格子の部分なので偶。
:::

::: lemma $I_{+}\oplus I_{-}$ から $U$ への取り替え {#nt:milnor-exchange keywords="if F_1, F_2 are even and I_+ + I_- + F_1 = I_+ + I_- + F_2 then U + F_1 = U + F_2; proof via the even sublattice E^0, its dual, and the three lattices between them" index="ミルナーの補題|みるなーのほだい" refname="I_+ + I_- から U への取り替え"}
$F_{1},F_{2}\in S$ が偶で、$I_{+}\oplus I_{-}\oplus F_{1}\cong I_{+}\oplus I_{-}\oplus F_{2}$ なら、$U\oplus F_{1}\cong U\oplus F_{2}$。
:::

::: intuition
$I_{+}\oplus I_{-}$ と $U$ は、偶部分格子とその双対の間にある 3 つの格子のうちの 1 つと残り 2 つとして、同じ枠組みの中に並んでいる。$I_{+}\oplus I_{-}$ の側で同型なら、その枠組みごと写る同型が $U$ の側の同型も与える。
:::

::: proof
**Step 1（偶部分格子）.** $W\defeq I_{+}\oplus I_{-}=\mathbb{Z}^{2}$（形式 $x_{1}y_{1}-x_{2}y_{2}$）、$E_{i}\defeq W\oplus F_{i}$, $V_{i}\defeq E_{i}\otimes\mathbb{Q}$ とする。$E_{i}^{0}\defeq\{x\in E_{i}:x\cdot x\equiv0\pmod2\}$ は（$x\mapsto x\cdot x\bmod2$ が準同型なので）部分群で、$F_{i}$ が偶だから $E_{i}^{0}=W^{0}\oplus F_{i}$、$W^{0}\defeq\{(x_{1},x_{2}):x_{1}\equiv x_{2}\pmod2\}$。

**Step 2（双対）.** 【主張：$(E_{i}^{0})^{\#}\defeq\{v\in V_{i}:v\cdot E_{i}^{0}\subseteq\mathbb{Z}\}$ と $E_{i}^{0}$ の間の格子はちょうど 3 つ $W\oplus F_{i}$, $W'\oplus F_{i}$, $W''\oplus F_{i}$】$F_{i}$ はユニモジュラーなので $F_{i}^{\#}=F_{i}$ で、$(E_{i}^{0})^{\#}=(W^{0})^{\#}\oplus F_{i}$。$W^{0}$ は $(1,1),(1,-1)$ で生成され、$(W^{0})^{\#}=\{(y_{1},y_{2}):y_{1}\pm y_{2}\in\mathbb{Z}\}$、すなわち両座標が整数か、両方が整数 $+\frac12$。$(W^{0})^{\#}/W^{0}$ は代表 $0,(1,0),(\frac12,\frac12),(\frac12,-\frac12)$ の位数 4 の群で、すべての元の位数が 2 なので、間の部分群は 3 つ：$W=W^{0}+\mathbb{Z}(1,0)$, $W'\defeq W^{0}+\mathbb{Z}(\frac12,\frac12)$, $W''\defeq W^{0}+\mathbb{Z}(\frac12,-\frac12)$。

**Step 3（$W'\cong W''\cong U$）.** $a=(\frac12,\frac12)$, $b=(1,-1)$ は $a\cdot a=b\cdot b=0$, $a\cdot b=1$ で $W'$ を生成する（$(1,1)=2a$, $(2,0)=2a+b$）。$W''$ も $(\frac12,-\frac12)$, $(1,1)$ で同様。

**Step 4（同型の移送）.** 同型 $\phi:E_{1}\to E_{2}$ は $V_{1}\to V_{2}$ に延び、偶部分 $E_{1}^{0}$ を $E_{2}^{0}$ に、その双対を双対に写すので、間の 3 つの格子を間の 3 つの格子に写し、$E_{1}$ を $E_{2}$ に写す。よって $\{W'\oplus F_{1},W''\oplus F_{1}\}$ は $\{W'\oplus F_{2},W''\oplus F_{2}\}$ に写され、$U\oplus F_{1}\cong U\oplus F_{2}$。
:::

::: theorem 偶の不定値格子の構造定理 {#nt:even-indefinite-structure keywords="an even indefinite unimodular lattice with tau >= 0 is isomorphic to p U + q E_8 with q = tau/8 and p = (r - tau)/2" index="偶の不定値格子の構造定理|ぐうのふていちこうしのこうぞうていり" refname="偶の不定値格子の構造定理"}
$E\in S$ が不定値で偶、$\tau(E)\ge0$ なら、$E\cong pU\oplus qE_{8}$、ここで $q=\tau(E)/8$, $p=(r(E)-\tau(E))/2\ge1$。（$\tau<0$ なら形式の符号を変えて同じ結論を $-E$ に適用する。）
:::

::: intuition
偶の不定値格子は、双曲平面 $U$ を何枚かと、$E_{8}$ を何枚か並べたものに限られる。指数が $8$ の倍数であることが、ちょうど $E_{8}$ の枚数を整数にする。
:::

::: proof
**Step 1（同じ不変量の偶の不定値格子は同型）.** $E_{1},E_{2}$ を偶で不定値、階数と指数が等しいとする。\ref{nt:split-even-hyperbolic} から $E_{i}\cong U\oplus F_{i}$ で、$F_{i}$ は偶で階数・指数が等しい。$I_{+}\oplus I_{-}\oplus F_{i}$ は不定値で奇、階数・指数が等しいので、\ref{nt:odd-indefinite-structure} から同型。\ref{nt:milnor-exchange} から $U\oplus F_{1}\cong U\oplus F_{2}$、すなわち $E_{1}\cong E_{2}$。

**Step 2（標準形との比較）.** \ref{nt:ks-determination} の 3 から $\tau\equiv0\pmod8$ で $q$ は整数。不定値なので $r>\tau$、$p\ge1$。$pU\oplus qE_{8}$ は偶で不定値、階数 $2p+8q=r$、指数 $8q=\tau$。Step 1 から $E\cong pU\oplus qE_{8}$。
:::

::: corollary ミルナーの分類定理 {#nt:milnor-classification keywords="two indefinite unimodular lattices are isomorphic iff they have the same rank, index and type" index="ミルナーの分類定理|みるなーのぶんるいていり" refname="ミルナーの分類定理"}
不定値な $E,E'\in S$ が同型 $\iff$ 階数・指数・型が等しい。
:::

::: intuition
不定値のユニモジュラー格子は、階数・指数・偶奇の 3 つの数で完全に決まる。整数の上の 2 次形式でありながら、有理数体の上と同じくらい単純に分類できる場合である。
:::

::: proof
奇なら \ref{nt:odd-indefinite-structure}、偶なら \ref{nt:even-indefinite-structure} で、標準形が $(r,\tau)$ だけで決まる。
:::

::: example
$E_{8}\oplus I_{-}$ は奇で不定値、$r=9$, $\tau=7$ なので $\cong8I_{+}\oplus I_{-}$。一方 $E_{8}\oplus U$ は偶で $\cong U\oplus E_{8}$（自明）、$I_{+}\oplus I_{-}\oplus E_{8}\cong9I_{+}\oplus I_{-}$。正定値の側では $E_{8}\not\cong8I_{+}$（型が違う）なので、定値の場合には分類は不変量だけでは決まらない。
:::

::: hypcheck
- **不定値性**：$0$ を表すこと（\ref{nt:indefinite-lattice-isotropic}）が分離の出発点で、すべての構造定理に本質的。定値の場合は $E_{8}\oplus E_{8}$ と $\Gamma_{16}$ が階数・指数・型を共有するが同型でない（$\Gamma_{16}$ の長さ 2 のベクトルは $\pm e_{i}\pm e_{j}$ だけで格子を生成しないが、$E_{8}\oplus E_{8}$ では生成する。Se7 V §1.4）。
- **ユニモジュラー性**：奇素数での零点の持ち上げ（$\det A\not\equiv0\bmod p$）、$\mathbb{Q}_{2}$ での判定（$d=\pm1$）、分割できないベクトルの双対（$x\cdot y=1$）、部分格子の分離に使った。
- **偶の型の補題**：$F_{i}$ が偶であることが $E_{i}^{0}=W^{0}\oplus F_{i}$ に本質的。
:::

## 問題 {#nt:sec-il-problems}

::: problem {#nt:prob-il-rank-ten}
階数 $10$ の不定値ユニモジュラー格子の同型類をすべて挙げよ。
:::

::: solution
奇：$sI_{+}\oplus tI_{-}$, $s+t=10$, $s,t\ge1$ の 9 個。偶：$\tau\equiv0\pmod8$ かつ $\abs\tau<10$ なので $\tau=0,\pm8$：$5U$, $U\oplus E_{8}$, $U\oplus E_{8}(-1)$（$E_{8}(-1)$ は形式の符号を変えたもの）の 3 個。合計 12 個。
:::

::: problem {#nt:prob-il-sigma}
$E=E_{8}\oplus I_{-}$ の特性ベクトルを一つ求め、$\sigma(E)\equiv\tau(E)\pmod8$ を確かめよ。
:::

::: solution
$E_{8}$ は偶なので特性ベクトル $0$、$I_{-}$ は $1$。$u=(0,1)$ で $u\cdot u=-1$、$\sigma\equiv-1\equiv7$。$\tau=8-1=7$ で一致。
:::

::: supplement
**使わなかった前提・本質的でない前提.** \ref{nt:ks-determination} の 2・3 の証明は不定値の構造定理だけを使い、局所的な不変量 $\varepsilon_{p}(E)$ の計算は使わない（積公式からの別証明もある：Se7 V §2.1 の注意）。

**前提を変えると（定値の場合）.** 定値の場合は構造定理はなく、各階数で類が有限個であること（簡約理論）だけが一般に成り立つ。正定値な偶格子について次が知られている（いずれもここでは証明しない）。
- 階数 8 は $E_{8}$ だけ（モーデル）、階数 16 は $E_{8}\oplus E_{8}$ と $\Gamma_{16}$ の 2 個（ヴィット）、階数 24 は 24 個（ニーマイヤー）で、その一つが長さ 2 のベクトルをもたない**リーチ格子**。
- ミンコフスキー–ジーゲルの質量公式（各類を自己同型群の位数の逆数の重みで数えた総和をベルヌーイ数で表す式）から、階数 32 では 8000 万個以上の類があることがわかる（Se7 V §2.3）。

**高い視点から：不定値は「柔らかく」、定値は「硬い」.** 不定値な格子の分類が不変量だけで決まるのは、等方ベクトルがあると双曲平面 $U$ を通して「自由に動ける」余地が生まれ、局所大域原理が整数の上でも効く（類数 $1$）からである。比喩で言えば、不定値の格子は光円錐に沿って変形できる柔らかい物体で、形は寸法（階数・指数・型）だけで決まるが、定値の格子は結晶のように硬く、同じ寸法でも $E_{8}\oplus E_{8}$ と $\Gamma_{16}$ のように異なる結晶構造をもつ。前者は 16 次元のトーラスとして異なるが同じスペクトル（同じテータ級数）をもち、「太鼓の形は音で聞き分けられるか」という問いへのミルナーの反例になった。
:::
