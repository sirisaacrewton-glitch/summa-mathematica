# 関数等式 {#nt:page-functional-equation keywords="Jacobi theta function, theta(1/x) = sqrt(x) theta(x) via Poisson summation, completed zeta function Lambda(s) = pi^{-s/2} Gamma(s/2) zeta(s), Riemann's functional equation Lambda(s) = Lambda(1 - s), meromorphic continuation of zeta to C, trivial zeros at -2, -4, ..., Bernoulli numbers, Euler's formula for zeta(2k), zeta(1 - 2k) = -B_{2k}/2k, functional equation of Dirichlet L-functions for primitive characters"}

リーマンのゼータ関数は、$\mathrm{Re}\,s>1$ ではオイラー積で、$\mathrm{Re}\,s>0$ では積分表示で与えられたが、実は複素平面全体に有理型に延長され、$s$ と $1-s$ を入れ替える対称性（**関数等式**）をもつ。このページでは、テータ関数 $\theta(x)=\sum_{n\in\Z}e^{-\pi n^{2}x}$ がポアソンの和公式によって $\theta(1/x)=\sqrt x\,\theta(x)$ を満たすことを示し、それをメリン変換で $\zeta$ に移して、**完備化されたゼータ関数** $\Lambda(s)=\pi^{-s/2}\Gamma(s/2)\zeta(s)$ が $\Lambda(s)=\Lambda(1-s)$ を満たすことを証明する（リーマン、1859 年）。帰結として、$\zeta$ の負の偶数での零点（**自明な零点**）と、$\zeta(2k)$, $\zeta(1-2k)$ のベルヌーイ数による表示を得る。

## 記法と定義の確認 {#nt:sec-fe-notation}

::: notation
- $\zeta(s)$ とその $\mathrm{Re}\,s>0$ への延長は \ref{nt:zeta-continuation}。
- ガンマ関数 $\Gamma$ は \ref{cx:gamma-meromorphic}：$\C$ 上有理型、極は $0,-1,-2,\dots$（1 位）、$\Gamma(z+1)=z\Gamma(z)$。\ref{cx:gamma-reflection} から $\Gamma$ は零点をもたず、$\Gamma(\frac12)^{2}=\pi$, $\Gamma(\frac12)>0$ より $\Gamma(\frac12)=\sqrt\pi$。
- フーリエ変換 $\hat f(\xi)=\int f(x)e^{-2\pi ix\xi}dx$ とポアソンの和公式は \ref{four:poisson-summation}。ガウス関数のフーリエ変換は \ref{cx:gaussian-fourier}。余接の部分分数展開は \ref{cx:cot-partial-fractions}。
- 体系は $\ZF$。
:::

## テータ関数 {#nt:sec-fe-theta}

::: proposition テータ関数の変換公式 {#nt:theta-transformation keywords="theta(x) = sum_{n in Z} e^{-pi n^2 x}; theta(1/x) = sqrt(x) theta(x) for x > 0; theta(x) - 1 = O(e^{-pi x}) as x -> infinity" index="テータ関数|てーたかんすう, ヤコビのテータ関数|やこびのてーたかんすう" refname="テータ関数の変換公式"}
$x>0$ について $\theta(x)\defeq\sum_{n\in\Z}e^{-\pi n^{2}x}$ とする。
1. $\theta(1/x)=\sqrt x\,\theta(x)$。
2. $x\ge1$ で $0\le\theta(x)-1\le3e^{-\pi x}$。
:::

::: intuition
ガウス関数はフーリエ変換で（幅を逆数にした）ガウス関数に移る。整数点での値の和は、ポアソンの和公式によってフーリエ変換の整数点での値の和に等しいので、幅 $x$ のテータ関数と幅 $1/x$ のテータ関数が結びつく。
:::

::: proof
**Step 1（ガウス関数の変換）.** 【主張：$f(y)=e^{-\pi y^{2}x}$ について $\hat f(\xi)=x^{-1/2}e^{-\pi\xi^{2}/x}$】$f(y)\defeq e^{-\pi y^{2}x}$ とすると、$y=u/\sqrt{\pi x}$ と変数変換し \ref{cx:gaussian-fourier}（$t=2\pi\xi/\sqrt{\pi x}$）を使って
$$\hat f(\xi)=\frac{1}{\sqrt{\pi x}}\int e^{-u^{2}}e^{-i\frac{2\pi\xi}{\sqrt{\pi x}}u}du=\frac{1}{\sqrt{\pi x}}\sqrt\pi\,e^{-\pi\xi^{2}/x}=\frac{1}{\sqrt x}e^{-\pi\xi^{2}/x}.$$

**Step 2（1）.** 【主張：$\theta(1/x)=\sqrt x\,\theta(x)$】$f$ と $\hat f$ は急減少なので \ref{four:poisson-summation} の仮定を満たし、$\sum_{n}f(n)=\sum_{n}\hat f(n)$、すなわち $\theta(x)=\frac{1}{\sqrt x}\theta(1/x)$。

**Step 3（2）.** 【主張：$\theta(x)-1\le3e^{-\pi x}$】$\theta(x)-1=2\sum_{n\ge1}e^{-\pi n^{2}x}\le2\sum_{n\ge1}e^{-\pi nx}=\frac{2e^{-\pi x}}{1-e^{-\pi x}}\le\frac{2}{1-e^{-\pi}}e^{-\pi x}\le3e^{-\pi x}$（$x\ge1$）。
:::

## リーマンの関数等式 {#nt:sec-fe-riemann}

::: theorem リーマンの関数等式 {#nt:riemann-functional-equation keywords="Lambda(s) = pi^{-s/2} Gamma(s/2) zeta(s) = 1/(s-1) - 1/s + (1/2) int_1^infty (theta(x) - 1)(x^{s/2} + x^{(1-s)/2}) dx/x; Lambda(s) = Lambda(1 - s); zeta extends meromorphically to C with only a simple pole at s = 1; trivial zeros at -2, -4, ...; zeta(0) = -1/2" index="リーマンの関数等式|りーまんのかんすうとうしき, 完備化されたゼータ関数|かんびかされたぜーたかんすう, 自明な零点|じめいなれいてん" refname="リーマンの関数等式"}
$\Lambda(s)\defeq\pi^{-s/2}\Gamma(s/2)\zeta(s)$（$\mathrm{Re}\,s>1$）とする。
1. $\Lambda(s)=\dfrac{1}{s-1}-\dfrac1s+\dfrac12\displaystyle\int_{1}^{\infty}(\theta(x)-1)\bigl(x^{s/2}+x^{(1-s)/2}\bigr)\frac{dx}{x}$。右辺の積分は $s$ の整関数なので、$\Lambda$ は $\C$ 上有理型で、極は $s=0,1$（1 位）だけ。
2. $\Lambda(s)=\Lambda(1-s)$。
3. $\zeta$ は $\C$ 上有理型に延長され、極は $s=1$ だけ。$\zeta(-2k)=0$（$k=1,2,\dots$）で、$\zeta(0)=-\frac12$。
:::

::: intuition
$\zeta(s)$ にガンマ因子 $\pi^{-s/2}\Gamma(s/2)$ を掛けると、テータ関数のメリン変換になる。積分を $x=1$ で分けて $x<1$ の部分をテータ関数の変換公式で $x>1$ の部分に移すと、$s$ と $1-s$ について対称な式が現れる。これがゼータ関数の隠れた対称性である。
:::

::: proof
**Step 1（メリン変換）.** 【主張：$\mathrm{Re}\,s>1$ で $\Lambda(s)=\frac12\int_{0}^{\infty}(\theta(x)-1)x^{s/2}\frac{dx}{x}$】$\int_{0}^{\infty}e^{-\pi n^{2}x}x^{s/2-1}dx=(\pi n^{2})^{-s/2}\Gamma(s/2)$（$t=\pi n^{2}x$ と置換）。$n\ge1$ について足し合わせ、$\frac12(\theta(x)-1)=\sum_{n\ge1}e^{-\pi n^{2}x}$ を使う。項別積分は、被積分関数の絶対値の和 $\sum_{n}\int e^{-\pi n^{2}x}x^{\sigma/2-1}dx=\pi^{-\sigma/2}\Gamma(\sigma/2)\zeta(\sigma)<\infty$（$\sigma>1$）で正当化される（単調収束定理）。

**Step 2（$x=1$ での分割）.** $\int_{0}^{1}$ の部分で $x\mapsto1/x$ と置換し、\ref{nt:theta-transformation} の 1 から $\theta(1/x)-1=\sqrt x\theta(x)-1=\sqrt x(\theta(x)-1)+\sqrt x-1$ を使うと
$$\frac12\int_{0}^{1}(\theta(x)-1)x^{s/2}\frac{dx}{x}=\frac12\int_{1}^{\infty}(\theta(x)-1)x^{(1-s)/2}\frac{dx}{x}+\frac12\int_{1}^{\infty}(x^{(1-s)/2}-x^{-s/2})\frac{dx}{x}.$$
最後の積分は（$\mathrm{Re}\,s>1$ で）$\frac12\bigl(\frac{2}{s-1}-\frac2s\bigr)=\frac{1}{s-1}-\frac1s$。$\int_{1}^{\infty}$ の部分と合わせて 1 の式を得る。

**Step 3（1：整関数性）.** \ref{nt:theta-transformation} の 2 から、$\int_{1}^{\infty}(\theta(x)-1)x^{\sigma'}\frac{dx}{x}$ は任意の実数 $\sigma'$ で収束し、$s$ が有界集合を動くとき一様に収束するので、積分は $s$ の整関数（\ref{cx:weierstrass-convergence}）。\ref{cx:identity-theorem} から、1 の右辺は $\Lambda$ の唯一の有理型延長。

**Step 4（2）.** 1 の右辺は $s\mapsto1-s$ で不変（$\frac{1}{s-1}-\frac1s$ は $-\frac1s+\frac{1}{s-1}$ に移る、積分も対称）。

**Step 5（3）.** $\zeta(s)=\pi^{s/2}\Lambda(s)/\Gamma(s/2)$ で、$1/\Gamma$ は整関数（\ref{cx:gamma-reflection}）なので $\zeta$ は $\C$ 上有理型。$\Lambda$ の極 $s=0$ は $1/\Gamma(s/2)$ の零点（$s/2=0$）で打ち消され、$\zeta(0)=\lim_{s\to0}\pi^{0}\cdot\frac{-1/s}{\Gamma(s/2)}=-\frac{1}{s\Gamma(s/2)}\big|_{s\to0}=-\frac12$（$\frac s2\Gamma(\frac s2)=\Gamma(1+\frac s2)\to1$）。$s=-2k$（$k\ge1$）では $\Lambda(-2k)=\Lambda(1+2k)=\pi^{-(1+2k)/2}\Gamma(\frac{1+2k}{2})\zeta(1+2k)$ は有限で、$1/\Gamma(-k)=0$ なので $\zeta(-2k)=0$。$s\neq0,1$ の他の点では $\Lambda$ は正則なので、$\zeta$ の極は $s=1$ だけ。
:::

## ベルヌーイ数と特殊値 {#nt:sec-fe-bernoulli}

::: definition ベルヌーイ数 {#nt:bernoulli-numbers keywords="Bernoulli numbers B_n defined by t/(e^t - 1) = sum B_n t^n / n!; B_0 = 1, B_1 = -1/2, B_2 = 1/6, B_4 = -1/30, odd B_n = 0 for n >= 3" index="ベルヌーイ数|べるぬーいすう" refname="ベルヌーイ数"}
$\frac{t}{e^{t}-1}=\sum_{n\ge0}B_{n}\frac{t^{n}}{n!}$（$\abs t<2\pi$ で収束）で定まる有理数 $B_{n}$ を**ベルヌーイ数**という。$B_{0}=1$, $B_{1}=-\frac12$, $B_{2}=\frac16$, $B_{4}=-\frac1{30}$, $B_{6}=\frac1{42}$ で、$\frac{t}{e^{t}-1}+\frac t2$ は偶関数なので、$n\ge3$ の奇数では $B_{n}=0$。
:::

::: intuition
ベルヌーイ数は冪乗和 $1^{k}+2^{k}+\cdots+N^{k}$ の公式に現れる数で、同時にゼータ関数の偶数点・負の奇数点での値を支配する。
:::

::: theorem ゼータ関数の特殊値 {#nt:zeta-special-values keywords="Euler: zeta(2k) = (-1)^{k+1} (2 pi)^{2k} B_{2k} / (2 (2k)!); zeta(1 - 2k) = -B_{2k} / (2k); zeta(-1) = -1/12" index="ゼータ関数の特殊値|ぜーたかんすうのとくしゅち, オイラーの公式（ζ(2k)）|おいらーのこうしき" refname="ゼータ関数の特殊値"}
$k\ge1$ について
$$\zeta(2k)=\frac{(-1)^{k+1}(2\pi)^{2k}B_{2k}}{2\,(2k)!},\qquad\zeta(1-2k)=-\frac{B_{2k}}{2k}.$$
:::

::: intuition
余接関数を、部分分数展開（素朴には $\sum1/(z-n)$）とテイラー展開（ベルヌーイ数）の 2 通りに展開して係数を比べると、$\zeta(2k)$ が $\pi^{2k}$ の有理数倍として現れる。関数等式で $s\mapsto1-s$ と移せば、負の奇数での値は有理数そのものになる。
:::

::: proof
**Step 1（余接のベルヌーイ展開）.** 【主張：$\abs z<1$ で $\pi z\cot\pi z=\sum_{k\ge0}(-1)^{k}\frac{(2\pi)^{2k}B_{2k}}{(2k)!}z^{2k}$】$w\cot w=iw\frac{e^{2iw}+1}{e^{2iw}-1}=iw+\frac{2iw}{e^{2iw}-1}=iw+\sum_{n}B_{n}\frac{(2iw)^{n}}{n!}$。$n=1$ の項 $-iw$ が $iw$ を打ち消し、奇数の $n\ge3$ は $0$ なので $w\cot w=\sum_{k}B_{2k}\frac{(2i)^{2k}w^{2k}}{(2k)!}$、$(2i)^{2k}=(-1)^{k}2^{2k}$。$w=\pi z$ とおく（$\abs{2\pi z}<2\pi$）。

**Step 2（部分分数からの展開）.** $\abs z<1$ で、\ref{cx:cot-partial-fractions} から $\pi z\cot\pi z=1+\sum_{n\ge1}\frac{2z^{2}}{z^{2}-n^{2}}=1-2\sum_{n\ge1}\sum_{k\ge1}\frac{z^{2k}}{n^{2k}}=1-2\sum_{k\ge1}\zeta(2k)z^{2k}$（絶対収束する二重級数の入れ替え）。

**Step 3（$\zeta(2k)$）.** Step 1, 2 の $z^{2k}$ の係数を比べる（\ref{cx:power-series-uniqueness}）と $-2\zeta(2k)=(-1)^{k}\frac{(2\pi)^{2k}B_{2k}}{(2k)!}$。

**Step 4（$\zeta(1-2k)$）.** 関数等式 $\Lambda(1-2k)=\Lambda(2k)$ から $\zeta(1-2k)=\pi^{\frac{1-2k}{2}-k}\frac{\Gamma(k)}{\Gamma(\frac12-k)}\zeta(2k)$。$\Gamma(\frac12)=\Gamma(\frac12-k)\prod_{j=1}^{k}(\frac12-j)$ から $\Gamma(\frac12-k)=\sqrt\pi\frac{(-2)^{k}}{1\cdot3\cdots(2k-1)}=\sqrt\pi\frac{(-4)^{k}k!}{(2k)!}$。代入すると
$$\zeta(1-2k)=\frac{(k-1)!\,(2k)!}{\pi^{2k}(-4)^{k}k!}\zeta(2k)=\frac{(2k)!}{k\,\pi^{2k}(-4)^{k}}\cdot\frac{(-1)^{k+1}(2\pi)^{2k}B_{2k}}{2(2k)!}=-\frac{B_{2k}}{2k}.$$
:::

::: fact ディリクレの L 関数の関数等式 {#nt:l-function-functional-equation keywords="for a primitive character chi mod q with chi(-1) = (-1)^a, Lambda(s, chi) = (q/pi)^{(s+a)/2} Gamma((s+a)/2) L(s, chi) satisfies Lambda(1 - s, conj chi) = i^a q^{1/2} / tau(chi) Lambda(s, chi); L(s, chi) is entire" index="L 関数の関数等式|えるかんすうのかんすうとうしき, 原始指標|げんしかんすう" refname="L 関数の関数等式"}
$q$ を法とする指標 $\chi$ が、$q$ の真の約数を法とする指標から誘導されないとき**原始的**という。原始指標 $\chi\neq\chi_{0}$ について、$\chi(-1)=(-1)^{a}$（$a\in\{0,1\}$）、$\tau(\chi)\defeq\sum_{n=1}^{q}\chi(n)e^{2\pi in/q}$ とし、$\Lambda(s,\chi)\defeq(q/\pi)^{(s+a)/2}\Gamma(\frac{s+a}{2})L(s,\chi)$ とおくと、$L(s,\chi)$ は整関数に延長され
$$\Lambda(1-s,\bar\chi)=\frac{i^{a}\sqrt q}{\tau(\chi)}\Lambda(s,\chi).$$
（Da 9 章。証明は $\theta_{\chi}(x)=\sum_{n}\chi(n)n^{a}e^{-\pi n^{2}x/q}$ の変換公式をポアソンの和公式とガウス和 $\abs{\tau(\chi)}=\sqrt q$ で示し、同じメリン変換を行う。ここでは証明しない。）
:::

::: intuition
指標でひねったテータ関数も、ポアソンの和公式で $x\mapsto1/x$ の変換公式をもち、ひねりはガウス和という定数として現れる。だから $L$ 関数もゼータ関数と同じ形の関数等式をもち、$\chi$ と $\bar\chi$ が入れ替わる。
:::

::: example
1. $\zeta(2)=\frac{\pi^{2}}{6}$, $\zeta(4)=\frac{\pi^{4}}{90}$（$B_{2}=\frac16$, $B_{4}=-\frac1{30}$）。
2. $\zeta(-1)=-\frac{1}{12}$, $\zeta(-3)=\frac{1}{120}$。これは発散級数 $1+2+3+\cdots$ を「$-\frac1{12}$」と解釈する話の正確な意味で、級数そのものが収束するわけではない。
3. $\zeta(0)=-\frac12$ は、$\eta(s)=(1-2^{1-s})\zeta(s)$（$\mathrm{Re}\,s>0$ で収束）から $\eta(0)=-\zeta(0)=\frac12$ とも整合する（アーベル総和で $1-1+1-\cdots=\frac12$）。
:::

::: hypcheck
- **テータ関数の変換公式**：ポアソンの和公式の減衰条件はガウス関数で満たされる。
- **リーマンの関数等式**：$\mathrm{Re}\,s>1$ は、メリン変換の項別積分（Step 1）と $\int_{1}^{\infty}x^{(1-s)/2-1}dx$ の収束（Step 2）に使った。得られた式は全平面で意味をもつので、一致の定理で延長した。
- **特殊値**：$\abs z<1$ は部分分数展開の幾何級数展開に、ベルヌーイ数の級数の収束半径 $2\pi$ は Step 1 に使った。
:::

## 問題 {#nt:sec-fe-problems}

::: problem {#nt:prob-fe-zeta6}
$B_{6}=\frac1{42}$ を使って $\zeta(6)$ と $\zeta(-5)$ を求めよ。
:::

::: solution
$\zeta(6)=\frac{(-1)^{4}(2\pi)^{6}B_{6}}{2\cdot720}=\frac{64\pi^{6}}{1440\cdot42}=\frac{\pi^{6}}{945}$。$\zeta(-5)=-\frac{B_{6}}{6}=-\frac{1}{252}$。
:::

::: problem {#nt:prob-fe-bernoulli-small}
$\frac{t}{e^{t}-1}$ の展開の最初の項を計算して $B_{1}=-\frac12$, $B_{2}=\frac16$ を確かめよ。
:::

::: solution
$\frac{e^{t}-1}{t}=1+\frac t2+\frac{t^{2}}{6}+\cdots$ の逆数は $1-\frac t2+\bigl(\frac14-\frac16\bigr)t^{2}+\cdots=1-\frac t2+\frac{t^{2}}{12}+\cdots$。$B_{1}/1!=-\frac12$, $B_{2}/2!=\frac1{12}$ から $B_{2}=\frac16$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 関数等式の証明は $\zeta$ のオイラー積を使わない（ディリクレ級数としての表示だけを使う）。同じ証明は、テータ関数の変換公式をもつ任意の級数に使える。

**前提を変えると.**
- $\zeta$ の非自明な零点は $0<\mathrm{Re}\,s<1$（臨界帯）にあり、関数等式から $\mathrm{Re}\,s=\frac12$ について対称に並ぶ。それがすべて $\mathrm{Re}\,s=\frac12$ 上にあるというのがリーマン予想である。
- 奇数での値 $\zeta(3),\zeta(5),\dots$ には簡単な閉じた形が知られておらず、$\zeta(3)$ が無理数であることはアペリー（1978）によって示された、と知られている。
- 数体 $K$ のデデキントゼータ関数、保型形式の $L$ 関数も同様の関数等式をもち、テータ関数の代わりにアデール上のポアソン和公式を使う方法（テイトの論文）で統一的に証明される、と知られている。

**高い視点から：メリン変換と保型性.** テータ関数の変換公式 $\theta(1/x)=\sqrt x\theta(x)$ は、上半平面のモジュラー群の作用 $\tau\mapsto-1/\tau$ についての保型性（重さ $\frac12$ の保型形式）の特別な場合で、メリン変換がその保型性を $L$ 関数の関数等式に翻訳する。この「保型形式 ↔ 関数等式をもつ $L$ 関数」の対応は、ヘッケの逆定理を経てラングランズ・プログラムにつながる。比喩で言えば、テータ関数は $x$ と $1/x$ を入れ替える鏡の前に立っても姿が変わらない関数で、ゼータ関数はその姿を周波数の言葉で書き直したものだから、$s$ と $1-s$ を入れ替える鏡の対称性を受け継ぐ。
:::
