# 演習：ゼータ関数と L 関数 {#nt:page-exercises-zeta-l keywords="exercises, Dirichlet series, Euler products, zeta function, Dirichlet characters, L-functions, Dirichlet's theorem, functional equation"}

## ディリクレ級数とゼータ関数 {#nt:sec-ds-exercises}

対応するページ：\ref{nt:page-dirichlet-series}

::: problem ★ 基本：$L(s,\chi_{4})$ のオイラー積 {#nt:ex-ds-chi4-euler}
$\chi_{4}$ を $4$ を法とする主指標でない指標とする。$\mathrm{Re}\,s>1$ で $L(s,\chi_{4})=\prod_{p\equiv1\,(4)}(1-p^{-s})^{-1}\prod_{p\equiv3\,(4)}(1+p^{-s})^{-1}$ を示せ。
:::

::: solution
\ref{nt:dirichlet-l-function} の 1 で $\chi_{4}(2)=0$, $\chi_{4}(p)=1$（$p\equiv1$）, $-1$（$p\equiv3$）を代入する。
:::

::: problem ★★ 標準：$(0,1)$ 上の $\zeta$ {#nt:ex-ds-zeta-negative}
実数 $0<s<1$ で $\zeta(s)<0$ であることを、\ref{nt:zeta-continuation} の積分表示から示せ。特に $\zeta$ は区間 $(0,1)$ に零点をもたない。
:::

::: solution
$0<s<1$ で $\frac{s}{s-1}<0$、$s\int_{1}^{\infty}\{x\}x^{-s-1}dx\ge0$ なので $\zeta(s)=\frac{s}{s-1}-s\int\cdots<0$。
:::

::: problem ★★ 標準：$L(1,\chi)$ の級数表示 {#nt:ex-ds-l1-series}
$\chi\neq\chi_{0}$ について、級数 $\sum_{n}\chi(n)/n$ が収束し、その和が $L(s,\chi)$ の $s=1$ での値に等しいことを示せ。
:::

::: solution
部分和 $\sum_{n\le x}\chi(n)$ は有界（\ref{nt:dirichlet-l-function} の証明）なので、\ref{nt:dirichlet-series-convergence} の Step 1–2 の評価（$s=1$ でも $\sigma=1>0$）から $s=1$ で級数は収束する。正則関数としての $L(s,\chi)$ は、級数が収束する $\mathrm{Re}\,s>0$ の各点で級数の和に等しい（同じ定理の 2）ので、$s=1$ でも一致する。
:::

## ディリクレの算術級数定理 {#nt:sec-dt-exercises}

対応するページ：\ref{nt:page-dirichlet-theorem}

::: problem ★ 基本：密度の和 {#nt:ex-dt-density-sum}
\ref{nt:dirichlet-theorem-primes} の密度 $\frac{1}{\varphi(q)}$ を、$q$ と互いに素な合同類すべてについて足すと $1$ になることを確かめ、$\gcd(a,q)>1$ の類に素数が高々 1 つしかないことと合わせて、素数全体の $\sum_{p}p^{-s}\sim\log\frac{1}{s-1}$ と整合することを説明せよ。
:::

::: solution
$\gcd(a,q)=1$ の類は $\varphi(q)$ 個なので $\varphi(q)\cdot\frac{1}{\varphi(q)}=1$。$\gcd(a,q)>1$ の類の素数は $p\mid q$ のものだけで有限個、その寄与は有界。よって全類の和は $\log\frac{1}{s-1}+O(1)$ で、\ref{nt:zeta-continuation} の 3 と一致する。
:::

::: problem ★★ 標準：ランダウの補題の必要性 {#nt:ex-dt-landau-necessity}
$\eta(s)\defeq\sum_{n}(-1)^{n-1}n^{-s}=(1-2^{1-s})\zeta(s)$ は $\mathrm{Re}\,s>0$ で収束するが、係数が非負でないので、ランダウの補題からは $\mathrm{Re}\,s\le0$ への延長について何も言えないことを説明し、$\eta$ が $s=1$ で正則であることを確かめよ。
:::

::: solution
$\eta$ の部分和 $\sum_{n\le x}(-1)^{n-1}$ は $0$ か $1$ で有界なので、\ref{nt:dirichlet-series-convergence} から $\mathrm{Re}\,s>0$ で収束・正則。$\mathrm{Re}\,s>1$ で $\eta(s)=\zeta(s)-2\sum(2n)^{-s}=(1-2^{1-s})\zeta(s)$ で、$s=1$ では $1-2^{1-s}$ の 1 位の零点が $\zeta$ の極を打ち消し、$\eta(1)=\log2$。係数の符号が交互なので、収束座標 $0$ が特異点である保証はない（実際 $\eta$ は全平面で正則であることが知られている）。
:::

## 関数等式 {#nt:sec-fe-exercises}

対応するページ：\ref{nt:page-functional-equation}

::: problem ★ 基本：奇数の逆 2 乗和 {#nt:ex-fe-odd-squares}
$\sum_{n\text{ 奇数}}n^{-2}=\frac{\pi^{2}}{8}$ と $\sum_{n\ge1}(-1)^{n-1}n^{-2}=\frac{\pi^{2}}{12}$ を $\zeta(2)=\frac{\pi^{2}}{6}$ から導け。
:::

::: solution
偶数の部分は $\sum(2n)^{-2}=\frac14\zeta(2)$ なので、奇数の部分は $\frac34\zeta(2)=\frac{\pi^{2}}{8}$。交代和は（奇数）$-$（偶数）$=\frac34\zeta(2)-\frac14\zeta(2)=\frac12\zeta(2)=\frac{\pi^{2}}{12}$。
:::

::: problem ★★ 標準：零点の位置 {#nt:ex-fe-zeros-location}
$\zeta$ の零点は、自明な零点 $-2,-4,\dots$ を除けば $0\le\mathrm{Re}\,s\le1$ にあることを示せ。また、零点の集合は直線 $\mathrm{Re}\,s=\frac12$ と実軸のそれぞれについて対称であることを示せ。
:::

::: solution
$\mathrm{Re}\,s>1$ では \ref{nt:euler-product} から零点はない。$\mathrm{Re}\,s<0$ では関数等式から $\zeta(s)=\pi^{s-\frac12}\frac{\Gamma(\frac{1-s}{2})}{\Gamma(\frac s2)}\zeta(1-s)$ で、$\zeta(1-s)\neq0$（$\mathrm{Re}(1-s)>1$）、$\Gamma(\frac{1-s}{2})$ は有限で $0$ でない（\ref{cx:gamma-reflection}）、$\frac{1}{\Gamma(s/2)}$ の零点は $s=-2k$ だけ。よって $\mathrm{Re}\,s<0$ の零点は自明な零点に限る。対称性：$\zeta$ は実軸上で実数値（$s>1$ で明らか、一致の定理で $\overline{\zeta(\bar s)}=\zeta(s)$）なので零点は実軸について対称。$0\le\mathrm{Re}\,s\le1$ の零点 $\rho$ では $\Lambda(\rho)=0$（$\Gamma(\rho/2)$ は有限かつ非零、ただし $\rho=0$ は $\zeta(0)=-\frac12$ なので零点でない）で、$\Lambda(1-\rho)=0$ から $\zeta(1-\rho)=0$。$\rho\mapsto1-\bar\rho$ が $\mathrm{Re}\,s=\frac12$ についての折り返し。
:::
