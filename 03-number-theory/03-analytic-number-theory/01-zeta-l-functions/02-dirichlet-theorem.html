# ディリクレの算術級数定理 {#nt:page-dirichlet-theorem keywords="Landau's lemma for Dirichlet series with nonnegative coefficients, zeta_q(s) = prod_chi L(s, chi), prod_chi (1 - chi(p) T) = (1 - T^f)^g, nonvanishing of L(1, chi), sum over primes p = a mod q of p^{-s} ~ (1/phi(q)) log 1/(s-1), Dirichlet's theorem on primes in arithmetic progressions, Dirichlet density"}

$\gcd(a,q)=1$ なら、$a$ に $q$ を法として合同な素数は無限に多くある。これが**ディリクレの算術級数定理**（1837 年）で、解析的整数論の出発点となった定理である。証明の鍵は、主指標でない指標の $L$ 関数が $s=1$ で $0$ にならないこと $L(1,\chi)\neq0$ である。このページでは、すべての $L$ 関数の積 $\zeta_{q}(s)=\prod_{\chi}L(s,\chi)$ が非負の係数をもつディリクレ級数であることに注目し、係数が非負のディリクレ級数の収束座標は特異点であるという**ランダウの補題**を使って $L(1,\chi)\neq0$ を示す（Serre による簡潔な証明）。最後に、合同類 $a\bmod q$ の素数についての $\sum p^{-s}$ が $s\to1$ で $\frac{1}{\varphi(q)}\log\frac{1}{s-1}$ のように発散することを示す。

## 記法と定義の確認 {#nt:sec-dt-notation}

::: notation
- ディリクレ級数、ゼータ関数、ディリクレ指標、$L(s,\chi)$、直交関係は \ref{nt:page-dirichlet-series} のとおり。$q\ge1$ を固定し、$\hat G$ を $q$ を法とする指標の群（位数 $\varphi(q)$）とする。
- 正則関数のテイラー展開は、定義域に含まれる最大の円板で収束する（\ref{cx:holomorphic-analytic}）。
- 実数 $s\to1+0$ について、$f(s)\sim g(s)$ は $f/g\to1$ を表す。
- 体系は $\ZF$。
:::

## ランダウの補題 {#nt:sec-dt-landau}

::: lemma ランダウの補題 {#nt:landau-lemma keywords="Landau: if a Dirichlet series with nonnegative coefficients converges for Re s > sigma_0 and its sum extends holomorphically to a neighbourhood of sigma_0, then the series converges for Re s > sigma_0 - epsilon" index="ランダウの補題|らんだうのほだい" refname="ランダウの補題"}
$a_{n}\ge0$ とし、$F(s)=\sum a_{n}n^{-s}$ が $\mathrm{Re}\,s>\sigma_{0}$ で収束するとする。$F$ が、ある開集合 $U\supseteq\{\mathrm{Re}\,s>\sigma_{0}\}\cup\{\sigma_{0}\}$ の上の正則関数に延長されるなら、ある $\varepsilon>0$ で級数は $\mathrm{Re}\,s>\sigma_{0}-\varepsilon$ で収束する。
:::

::: intuition
係数が非負なら、級数を実軸上で微分した値もすべて符号がそろい、テイラー展開と級数の展開を自由に入れ替えられる。だから関数が $\sigma_{0}$ の向こうまで正則に延びれば、級数そのものも向こうまで収束してしまう。
:::

::: proof
**Step 1（テイラー展開）.** $\sigma_{1}\defeq\sigma_{0}+1$ とする。$F$ は $\mathrm{Re}\,s>\sigma_{0}$ と $\sigma_{0}$ の近傍で正則なので、$\sigma_{1}$ を中心とする半径 $1+\varepsilon$ の円板（$\varepsilon>0$ は小さい）の上で正則（円板は $\mathrm{Re}\,s>\sigma_{0}$ と $\sigma_{0}$ の近傍に含まれる。$U$ は開で $\sigma_{0}$ を含むので、$\varepsilon$ を小さくとれる）。\ref{cx:holomorphic-analytic} から、その円板の上で $F(s)=\sum_{k}\frac{F^{(k)}(\sigma_{1})}{k!}(s-\sigma_{1})^{k}$。

**Step 2（微分の値）.** \ref{nt:dirichlet-series-convergence} の項別微分から $F^{(k)}(\sigma_{1})=\sum_{n}a_{n}(-\log n)^{k}n^{-\sigma_{1}}$。

**Step 3（入れ替え）.** 【主張：実数 $\sigma=\sigma_{0}-\varepsilon/2$ で級数は収束する】$\sigma_{1}-\sigma=1+\varepsilon/2$ は Step 1 の半径より小さいので
$$F(\sigma)=\sum_{k}\frac{(\sigma_{1}-\sigma)^{k}}{k!}\sum_{n}a_{n}(\log n)^{k}n^{-\sigma_{1}}.$$
すべての項が非負なので和の順序を入れ替えてよく、$\sum_{n}a_{n}n^{-\sigma_{1}}\sum_{k}\frac{((\sigma_{1}-\sigma)\log n)^{k}}{k!}=\sum_{n}a_{n}n^{-\sigma_{1}}e^{(\sigma_{1}-\sigma)\log n}=\sum_{n}a_{n}n^{-\sigma}$ が有限。\ref{nt:dirichlet-series-convergence} から $\mathrm{Re}\,s>\sigma$ で収束する。
:::

## $L(1,\chi)\neq0$ {#nt:sec-dt-nonvanishing}

::: lemma 指標の積と局所因子 {#nt:character-product-local-factor keywords="for p not dividing q with f = order of p mod q and g = phi(q)/f: prod_chi (1 - chi(p) T) = (1 - T^f)^g; zeta_q(s) = prod_chi L(s, chi) = prod_{p not dividing q} (1 - p^{-fs})^{-g} has nonnegative coefficients" index="指標の積|しひょうのせき"}
$p\nmid q$ とし、$f$ を $p$ の $q$ を法とする位数、$g\defeq\varphi(q)/f$ とする。
1. $\prod_{\chi\in\hat G}(1-\chi(p)T)=(1-T^{f})^{g}$。
2. $\zeta_{q}(s)\defeq\prod_{\chi\in\hat G}L(s,\chi)$ は、$\mathrm{Re}\,s>1$ で $\zeta_{q}(s)=\prod_{p\nmid q}(1-p^{-fs})^{-g}$ と書け、非負の整数係数をもつディリクレ級数で、その係数は $\gcd(n,q)=1$ のとき $n^{\varphi(q)}$ の項について $1$ 以上である。
:::

::: proof
**Step 1（1）.** 【主張：$\chi\mapsto\chi(p)$ は $\hat G$ から $\mu_{f}$ への全射準同型で、各値をちょうど $g$ 回とる】$H\defeq\langle p\rangle$（位数 $f$）とし、制限 $r:\hat G\to\hat H$ を考える。核は $H$ 上で自明な指標、すなわち $G/H$ の指標で、有限アーベル群 $G/H$ は巡回群の直積（\ref{grp:page-finite-abelian}）なので、\ref{nt:character-orthogonality} の Step 1–2 と同じ数え方でその個数は $\abs{G/H}=g$。像の大きさは $\abs{\hat G}/g=f=\abs{\hat H}$ なので $r$ は全射で、各元の逆像は $g$ 個。$\hat H\to\mu_{f}$, $\psi\mapsto\psi(p)$ は全単射。よって $\chi(p)$ は $\mu_{f}$ の各元を $g$ 回ずつとり、$\prod_{w\in\mu_{f}}(1-wT)=1-T^{f}$ から積は $(1-T^{f})^{g}$。

**Step 2（2）.** $L$ のオイラー積（\ref{nt:dirichlet-l-function}）を掛け合わせ、1 で $T=p^{-s}$ とおく。$(1-p^{-fs})^{-g}=(1+p^{-fs}+p^{-2fs}+\cdots)^{g}$ は非負の係数をもち、その積も同様。$f\mid\varphi(q)$ なので $p^{-\varphi(q)s}$ は $p^{-fs}$ の冪で、係数 $\ge1$ で現れる。積をとると、$p\nmid q$ の素数だけからなる $n$ について $n^{-\varphi(q)s}$ の係数は $1$ 以上。
:::

::: theorem $L(1,\chi)\neq0$ {#nt:l-one-nonvanishing keywords="for a non-principal Dirichlet character chi, L(1, chi) != 0; zeta_q has a simple pole at s = 1" index="L(1,χ) の非消滅|えるいちかいのひしょうめつ" refname="L(1,χ)≠0"}
$\chi\neq\chi_{0}$ なら $L(1,\chi)\neq0$。したがって $\zeta_{q}(s)$ は $s=1$ に 1 位の極をもつ。
:::

::: intuition
もしどれかの $L(1,\chi)$ が $0$ なら、その零点が $L(s,\chi_{0})$ の極を打ち消し、$\zeta_{q}$ は $\mathrm{Re}\,s>0$ 全体で正則になる。係数が非負なのでランダウの補題により級数も $\mathrm{Re}\,s>0$ で収束するはずだが、$\zeta_{q}$ の係数は少なくとも $\sum_{(n,q)=1}n^{-\varphi(q)s}$ ほどあり、これは $s=1/\varphi(q)$ で発散する。この矛盾が非消滅を示す。
:::

::: proof
**Step 1（正則性の仮定）.** 【主張：ある $\chi\neq\chi_{0}$ で $L(1,\chi)=0$ なら、$\zeta_{q}$ は $\mathrm{Re}\,s>0$ で正則】$L(s,\chi_{0})$ は $\mathrm{Re}\,s>0$ で有理型で、極は $s=1$ の 1 位だけ（\ref{nt:dirichlet-l-function} の 2）。他の $L(s,\chi)$ は $\mathrm{Re}\,s>0$ で正則（同 3）。$L(1,\chi)=0$ の因子が極を打ち消すので、積 $\zeta_{q}$ の $s=1$ は除去可能な特異点で、$\zeta_{q}$ は $\mathrm{Re}\,s>0$ で正則。

**Step 2（ランダウの補題を繰り返す）.** $\zeta_{q}$ の級数は $\mathrm{Re}\,s>1$ で収束する。$\sigma_{c}$ を級数が収束する最小の実数の下限（収束座標）とすると、$\sigma_{c}>0$ なら \ref{nt:landau-lemma}（$\sigma_{0}=\sigma_{c}$、Step 1 の正則性）から $\sigma_{c}$ より左でも収束し、下限であることに反する。よって級数は $\mathrm{Re}\,s>0$ のすべての実数 $s$ で収束する。

**Step 3（矛盾）.** \ref{nt:character-product-local-factor} の 2 から、$s=\frac{1}{\varphi(q)}$ での級数の値は $\sum_{\gcd(n,q)=1}n^{-1}$ 以上で、これは発散する（$1+q\Z$ の数の逆数の和 $\sum_{k}\frac{1}{1+kq}=\infty$）。Step 2 に矛盾。

**Step 4（極）.** $L(s,\chi_{0})$ は $s=1$ に 1 位の極、他の因子は $s=1$ で正則で $0$ でないので、$\zeta_{q}$ は 1 位の極をもつ。
:::

## 算術級数中の素数 {#nt:sec-dt-primes}

::: theorem ディリクレの算術級数定理 {#nt:dirichlet-theorem-primes keywords="Dirichlet's theorem: for gcd(a, q) = 1, sum_{p = a mod q} p^{-s} ~ (1/phi(q)) log 1/(s-1) as s -> 1+; in particular there are infinitely many primes p = a mod q, and the primes have Dirichlet density 1/phi(q) in each class" index="ディリクレの算術級数定理|でぃりくれのさんじゅつきゅうすうていり, ディリクレ密度|でぃりくれみつど" refname="ディリクレの算術級数定理"}
$\gcd(a,q)=1$ とすると、実数 $s\to1+0$ で
$$\sum_{p\equiv a\,(q)}p^{-s}\sim\frac{1}{\varphi(q)}\log\frac{1}{s-1}.$$
特に、$p\equiv a\pmod q$ となる素数は無限に多くある。
:::

::: intuition
素数を合同類ごとに分ける操作を、指標の直交関係で「各指標についての和」に分解する。主指標の部分はゼータ関数と同じく $\log\frac{1}{s-1}$ で発散し、残りの指標の部分は $L(1,\chi)\neq0$ のおかげで有界にとどまる。だから素数はどの合同類にも均等に $\frac{1}{\varphi(q)}$ ずつ配分される。
:::

::: proof
**Step 1（指標の和への分解）.** \ref{nt:character-orthogonality} の 3 から、実数 $s>1$ で
$$\sum_{p\equiv a}p^{-s}=\frac{1}{\varphi(q)}\sum_{\chi}\overline{\chi(a)}\,S_{\chi}(s),\qquad S_{\chi}(s)\defeq\sum_{p}\chi(p)p^{-s}.$$

**Step 2（主指標）.** $S_{\chi_{0}}(s)=\sum_{p}p^{-s}-\sum_{p\mid q}p^{-s}=\log\frac{1}{s-1}+O(1)$（\ref{nt:zeta-continuation} の 3）。

**Step 3（$\chi\neq\chi_{0}$ の部分は有界）.** 【主張：$s\in(1,2]$ で $S_{\chi}(s)$ は有界】$\ell_{\chi}(s)\defeq\sum_{p}\sum_{k\ge1}\frac{\chi(p)^{k}}{kp^{ks}}$ は $s>1$ で絶対収束し、$\exp\ell_{\chi}(s)=\prod_{p}(1-\chi(p)p^{-s})^{-1}=L(s,\chi)$（$\exp(\sum_{k}w^{k}/k)=(1-w)^{-1}$, $\abs w<1$）。$\ell_{\chi}$ は $(1,2]$ 上連続で、$L(s,\chi)$ は $[1,2]$ 上連続で $0$ にならない（$L(1,\chi)\neq0$、\ref{nt:l-one-nonvanishing}、と $s>1$ でのオイラー積）。$[1,2]$ の上で $L(s,\chi)$ の連続な対数をとり、$(1,2]$ 上で $\ell_{\chi}$ と比べると、差は $2\pi i$ の整数倍の連続関数で定数。よって $\ell_{\chi}$ は $s\to1+0$ で有限の極限をもち、$(1,2]$ 上有界。$S_{\chi}(s)-\ell_{\chi}(s)$ は $k\ge2$ の部分で、$\sum_{p}\sum_{k\ge2}p^{-k}\le2\sum n^{-2}$ で有界。

**Step 4（結論）.** Step 1–3 から $\sum_{p\equiv a}p^{-s}=\frac{1}{\varphi(q)}\log\frac{1}{s-1}+O(1)$（$\overline{\chi_{0}(a)}=1$）。右辺は $s\to1+0$ で $\infty$ に発散するので、左辺の和は無限個の素数を含む。
:::

::: example
1. $q=4$, $a=3$：$4k+3$ 型の素数の無限性は初等的にも示せた（\ref{nt:infinitely-many-primes}）が、この定理はさらに「$4k+1$ 型と $4k+3$ 型が半分ずつ」という密度の主張を与える。
2. $q=10$：$1,3,7,9$ で終わる素数（$\varphi(10)=4$）は、それぞれ密度 $\frac14$ で現れる。
3. 実指標 $\chi$ について $L(1,\chi)\neq0$ が最も難しい場合で、ディリクレ自身は類数公式（$L(1,\chi)$ が類数の正の定数倍であること）を使って示した（\ref[2 次体の類数公式]{nt:page-class-number-formula}）。
:::

::: hypcheck
- **ランダウの補題**：係数の非負性は、テイラー展開と級数の和の順序の入れ替え（Step 3）に本質的。符号が混ざる級数では、収束座標を越えて正則に延びることはよくある（$L(s,\chi)$ は $\mathrm{Re}\,s>0$ で収束するが全平面に延びる）。
- **$L(1,\chi)\neq0$**：$\zeta_{q}$ の係数が非負であること（\ref{nt:character-product-local-factor}）がランダウの補題を使う条件。$\zeta_{q}$ がすべての指標の積であることが、非負性を生む。
- **算術級数定理**：$\gcd(a,q)=1$ は直交関係で合同類を取り出すのに必要。$\gcd(a,q)>1$ の類には高々 1 つの素数しかない。
:::

## 問題 {#nt:sec-dt-problems}

::: problem {#nt:prob-dt-local-factor-5}
$q=5$, $p=11$ と $p=2$ について、$\prod_{\chi}(1-\chi(p)T)$ を直接計算し、$(1-T^{f})^{g}$ と一致することを確かめよ。
:::

::: solution
$\chi(2)\in\{1,i,-1,-i\}$（\ref{nt:prob-ds-characters-5}）。$p=2$ の位数は $f=4$, $g=1$：$\prod_{w^{4}=1}(1-wT)=1-T^{4}$。$p=11\equiv1$ では $\chi(11)=1$ がすべての $\chi$ で成り立ち $f=1$, $g=4$：$(1-T)^{4}$。
:::

::: problem {#nt:prob-dt-ell-chi4}
$\chi_{4}$ について $L(1,\chi_{4})=\frac\pi4\neq0$ を使い、$\sum_{p\equiv1\,(4)}p^{-s}-\sum_{p\equiv3\,(4)}p^{-s}$ が $s\to1+0$ で有界であることを確かめよ。
:::

::: solution
差は $S_{\chi_{4}}(s)=\sum_{p}\chi_{4}(p)p^{-s}$ で、\ref{nt:dirichlet-theorem-primes} の Step 3 から有界。両方の和はそれぞれ $\frac12\log\frac{1}{s-1}+O(1)$ で発散するが、差は有界にとどまる。
:::

::: supplement
**使わなかった前提・本質的でない前提.** この証明は $L(1,\chi)$ の値を計算せず、$\zeta_{q}$ の係数の非負性と、$\zeta_{q}$ が十分大きいことだけを使う。実指標と複素指標を区別する必要がない。

**前提を変えると.**
- 自然密度（$x$ 以下の割合）でも、各合同類の素数は $\frac{1}{\varphi(q)}$ の割合で現れる（算術級数の素数定理）。これには $\mathrm{Re}\,s=1$ 上での $L(s,\chi)\neq0$ が要る（\ref[素数定理]{nt:page-prime-number-theorem}）。
- 有限次ガロア拡大 $L/K$ と共役類 $C\subseteq\operatorname{Gal}(L/K)$ について、フロベニウス元が $C$ に入る素イデアルは密度 $\abs C/\abs G$ で現れる（**チェボタレフの密度定理**）と知られている。ディリクレの定理は $\mathbb{Q}(\zeta_{q})/\mathbb{Q}$ の場合である。
- 算術級数中の最小の素数の大きさの評価（リンニクの定理）や、ジーゲルの定理による $L(1,\chi)$ の下からの評価は、はるかに難しい（Da 21 章）。

**高い視点から：調和解析としての指標.** 合同類の指示関数を指標で展開することは、有限アーベル群 $(\Z/q\Z)^{\times}$ 上のフーリエ展開そのものである。素数の分布の問題は、各「周波数」$\chi$ ごとの $L$ 関数の振る舞いに分解され、非自明な周波数の寄与が主要項に比べて小さいこと（$L(1,\chi)\neq0$）が均等分布を意味する。比喩で言えば、素数の列を $q$ 色に塗り分けたときの色の偏りを、指標というフィルターで周波数ごとに測り、偏りを生む周波数がないことを示すのがディリクレの定理である。
:::
