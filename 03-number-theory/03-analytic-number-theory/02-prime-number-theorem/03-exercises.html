## チェビシェフの評価とメルテンスの定理 {#nt:sec-ch-exercises}

対応するページ：\ref{nt:page-chebyshev}

::: problem ★ 基本：$\psi(x)$ と最小公倍数 {#nt:ex-ch-lcm}
$e^{\psi(n)}=\operatorname{lcm}(1,2,\dots,n)$ を確かめ、$n=10$ で両辺を計算せよ。
:::

::: solution
\ref{nt:legendre-formula} の 2 の証明のとおり、$\operatorname{lcm}(1,\dots,n)$ の $p$ 進付値は $p^{i}\le n$ となる最大の $i$ で、$\psi(n)=\sum_{p^{i}\le n}\log p$ はその対数。$n=10$：$\operatorname{lcm}=2^{3}\cdot3^{2}\cdot5\cdot7=2520$、$\psi(10)=3\log2+2\log3+\log5+\log7=\log2520$。
:::

::: problem ★★ 標準：$\sum_{p}\frac{1}{p\log p}$ の収束 {#nt:ex-ch-p-log-p}
$\sum_{p}\frac{1}{p\log p}$ が収束することを、\ref{nt:mertens-theorems} の 2 から示せ。
:::

::: solution
$S(t)\defeq\sum_{p\le t}\frac1p=\log\log t+M+O(1/\log t)$ について部分和をとると $\sum_{p\le x}\frac{1}{p\log p}=\frac{S(x)}{\log x}+\int_{2}^{x}\frac{S(t)}{t(\log t)^{2}}dt$。$S(t)=O(\log\log t)$ で、$\int^{\infty}\frac{\log\log t}{t(\log t)^{2}}dt$ は（$u=\log t$ として $\int^{\infty}\frac{\log u}{u^{2}}du$）収束し、$\frac{S(x)}{\log x}\to0$。よって収束する。
:::

## 素数定理 {#nt:sec-pnt-exercises}

対応するページ：\ref{nt:page-prime-number-theorem}

::: problem ★ 基本：素数の間隔の平均 {#nt:ex-pnt-gap}
素数定理から、$x$ 付近の素数の平均的な間隔が $\log x$ 程度であることを説明せよ。また、$\pi(2x)-\pi(x)\sim\frac{x}{\log x}$ を示せ。
:::

::: solution
$\pi(2x)-\pi(x)=\frac{2x}{\log2x}(1+o(1))-\frac{x}{\log x}(1+o(1))=\frac{x}{\log x}(1+o(1))$（$\log2x\sim\log x$）。区間 $(x,2x]$ の長さ $x$ に約 $x/\log x$ 個の素数があるので、平均の間隔は $\log x$ 程度。
:::

::: problem ★★ 標準：$3+4\cos\phi+\cos2\phi$ の役割 {#nt:ex-pnt-341}
\ref{nt:zeta-nonvanishing-line-one} の証明で、$3+4\cos\phi+\cos2\phi$ の代わりに $1+\cos\phi$ を使うと何が起こるか。$\abs{\zeta(\sigma)\zeta(\sigma+it)}\ge1$ からは $\zeta(1+it)\neq0$ が導けないことを確かめよ。
:::

::: solution
$1+\cos\phi\ge0$ から $\abs{\zeta(\sigma)\zeta(\sigma+it)}\ge1$ が得られる。$\zeta(1+it)=0$ なら左辺は $O\bigl((\sigma-1)^{-1}(\sigma-1)\bigr)=O(1)$ で、$1$ 以上であることと矛盾しない。零点の次数 $4$ を極の次数 $3$ より大きくできる係数（$3,4,1$）が必要で、それには $\cos2\phi$ の項で $1+\cos\phi$ を 2 乗した形が要る。
:::
