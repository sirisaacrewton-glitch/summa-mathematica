# 素数定理 {#nt:page-prime-number-theorem keywords="prime number theorem pi(x) ~ x / log x, nonvanishing of zeta on Re s = 1, 3 + 4 cos + cos 2 inequality, Phi(s) = sum log p / p^s, Newman's analytic theorem (Tauberian), Zagier's exposition, convergence of int (theta(x) - x)/x^2 dx, theta(x) ~ x, prime number theorem for arithmetic progressions, Riemann hypothesis and the error term"}

$x$ 以下の素数の個数は $\pi(x)\sim\frac{x}{\log x}$ を満たす。ガウスとルジャンドルが予想し、1896 年にアダマールとド・ラ・ヴァレ・プーサンが独立に証明した**素数定理**である。鍵は、ゼータ関数が直線 $\mathrm{Re}\,s=1$ の上で $0$ にならないことである。このページでは、まず不等式 $3+4\cos\phi+\cos2\phi\ge0$ を使って $\zeta(1+it)\neq0$ を示す。次に、ラプラス変換が虚軸まで正則に延びる有界関数は積分が収束するという**ニューマンのタウバー型定理**を複素積分で証明し、それを $\theta(x)$ に適用して $\theta(x)\sim x$、すなわち素数定理を得る（ザギエによる簡潔な形）。

## 記法と定義の確認 {#nt:sec-pnt-notation}

::: notation
- $\zeta(s)$ の $\mathrm{Re}\,s>0$ への延長（$s=1$ にだけ 1 位の極）は \ref{nt:zeta-continuation}、$\mathrm{Re}\,s>1$ での非零性は \ref{nt:euler-product}。
- $\theta(x)=\sum_{p\le x}\log p$、チェビシェフの評価 $\theta(x)\le(2\log2)x$、素数定理の同値な形は \ref{nt:page-chebyshev}。
- \ref{cx:cauchy-formula} と \ref{cx:weierstrass-convergence} を使う。
- 体系は $\ZF$。
:::

## $\mathrm{Re}\,s=1$ 上の非零性 {#nt:sec-pnt-nonvanishing}

::: theorem $\zeta(1+it)\neq0$ {#nt:zeta-nonvanishing-line-one keywords="zeta(s) has no zeros on Re s = 1; |zeta(sigma)^3 zeta(sigma + it)^4 zeta(sigma + 2it)| >= 1 for sigma > 1" index="ζ の Re s=1 上の非零性|ぜーたのひれいせい" refname="ζ(1+it)≠0"}
1. $\sigma>1$, $t\in\mathbb{R}$ について $\abs{\zeta(\sigma)^{3}\zeta(\sigma+it)^{4}\zeta(\sigma+2it)}\ge1$。
2. すべての実数 $t\neq0$ で $\zeta(1+it)\neq0$。したがって $\zeta$ は $\mathrm{Re}\,s\ge1$ に零点をもたない。
:::

::: intuition
もし $1+it$ が零点なら、$\zeta(\sigma+it)$ は $\sigma\to1$ で $(\sigma-1)$ のように小さくなり、その 4 乗は $\zeta(\sigma)^{3}\sim(\sigma-1)^{-3}$ の発散を上回って、積が $0$ に近づく。ところがオイラー積の対数を見ると、この積の対数は非負の数の和になっている。$\cos$ の 2 倍角の公式による不等式 $3+4\cos\phi+\cos2\phi=2(1+\cos\phi)^{2}\ge0$ がその根拠である。
:::

::: proof
**Step 1（1）.** 【主張：積の対数は非負】$\sigma>1$ でオイラー積から $\log\abs{\zeta(\sigma+it)}=\mathrm{Re}\sum_{p}\sum_{k\ge1}\frac{p^{-k\sigma}e^{-ikt\log p}}{k}=\sum_{p,k}\frac{p^{-k\sigma}}{k}\cos(kt\log p)$。よって
$$\log\abs{\zeta(\sigma)^{3}\zeta(\sigma+it)^{4}\zeta(\sigma+2it)}=\sum_{p,k}\frac{p^{-k\sigma}}{k}\bigl(3+4\cos\phi_{p,k}+\cos2\phi_{p,k}\bigr)\ge0$$
（$\phi_{p,k}=kt\log p$、$3+4\cos\phi+\cos2\phi=2(1+\cos\phi)^{2}$）。

**Step 2（2）.** $t\neq0$ で $\zeta(1+it)=0$ と仮定する。$\sigma\to1+0$ のとき、$\zeta(\sigma)\le\frac{\sigma}{\sigma-1}$（\ref{nt:zeta-continuation} の 2）、$\zeta(\sigma+it)=O(\sigma-1)$（$1+it$ で正則で零点）、$\zeta(\sigma+2it)$ は有界（$1+2it\neq1$ で正則）。積は $O\bigl((\sigma-1)^{-3}(\sigma-1)^{4}\bigr)\to0$ となり、1 に反する。$\mathrm{Re}\,s>1$ の非零性は \ref{nt:euler-product}。
:::

::: lemma 対数微分と $\Phi$ {#nt:phi-function keywords="Phi(s) = sum_p log p / p^s; Phi(s) - 1/(s-1) extends holomorphically to a neighbourhood of Re s >= 1; Phi(s) = s int_1^infty theta(x) x^{-s-1} dx for Re s > 1" index="Φ 関数（素数定理）|ふぁいかんすう"}
$\Phi(s)\defeq\sum_{p}\frac{\log p}{p^{s}}$（$\mathrm{Re}\,s>1$）とする。
1. $\Phi(s)-\frac{1}{s-1}$ は $\mathrm{Re}\,s\ge1$ を含む開集合の上の正則関数に延長される。
2. $\mathrm{Re}\,s>1$ で $\Phi(s)=s\int_{1}^{\infty}\theta(x)x^{-s-1}dx$。
:::

::: proof
**Step 1（対数微分）.** $\mathrm{Re}\,s>1$ でオイラー積の対数微分（\ref{nt:chebyshev-functions}）から $-\frac{\zeta'(s)}{\zeta(s)}=\sum_{p}\frac{\log p}{p^{s}-1}=\Phi(s)+\sum_{p}\frac{\log p}{p^{s}(p^{s}-1)}$。最後の和は $\mathrm{Re}\,s>\frac12$ で広義一様に絶対収束し正則。

**Step 2（1）.** $\zeta$ は $s=1$ に 1 位の極をもち、$\mathrm{Re}\,s\ge1$ に零点がない（\ref{nt:zeta-nonvanishing-line-one}）ので、$-\frac{\zeta'}{\zeta}-\frac{1}{s-1}$ は $\mathrm{Re}\,s\ge1$ の近傍で正則（極の留数は $-(-1)=1$。零点は孤立しているので、$\mathrm{Re}\,s\ge1$ の各点の近傍に零点がない開集合がとれる）。Step 1 と合わせて 1。

**Step 3（2）.** $\theta$ の跳びは素数 $p$ で $\log p$ なので、$\Phi(s)=\int_{1}^{\infty}x^{-s}d\theta(x)=\bigl[\theta(x)x^{-s}\bigr]_{1}^{\infty}+s\int_{1}^{\infty}\theta(x)x^{-s-1}dx$（スティルチェス積分の部分積分。\ref{calc:summation-by-parts} を素数の和に使っても同じ）。境界項は $\theta(x)=O(x)$ と $\mathrm{Re}\,s>1$ から $0$。
:::

## ニューマンのタウバー型定理 {#nt:sec-pnt-newman}

::: theorem ニューマンのタウバー型定理 {#nt:newman-tauberian keywords="Newman's analytic theorem: if f is bounded and locally integrable on [0, infinity) and g(z) = int_0^infty f(t) e^{-zt} dt (Re z > 0) extends holomorphically to Re z >= 0, then int_0^infty f(t) dt converges and equals g(0)" index="ニューマンのタウバー型定理|にゅーまんのたうばーがたていり, タウバー型定理|たうばーがたていり" refname="ニューマンのタウバー型定理"}
$f:[0,\infty)\to\mathbb{R}$ を有界で局所可積分な関数とし、$g(z)\defeq\int_{0}^{\infty}f(t)e^{-zt}dt$（$\mathrm{Re}\,z>0$）が $\mathrm{Re}\,z\ge0$ を含む開集合の上の正則関数に延長されるとする。このとき $\int_{0}^{\infty}f(t)dt$ は収束し、$g(0)$ に等しい。
:::

::: intuition
ラプラス変換 $g(z)$ は $\mathrm{Re}\,z>0$ では積分の収束が保証されているが、$z=0$ では保証がない。それでも $g$ が虚軸を越えて滑らかに延びるなら、積分の「振動による打ち消し合い」は制御されていて、$z=0$ でも積分は収束する。証明は、虚軸の左側に少しはみ出した経路での複素積分で、誤差を半径の逆数で押さえる。
:::

::: proof
**Step 1（設定）.** $\abs f\le B$ とし、$T>0$ について $g_{T}(z)\defeq\int_{0}^{T}f(t)e^{-zt}dt$ は整関数（積分記号下の微分）。$g_{T}(0)\to g(0)$（$T\to\infty$）を示せばよい。$R>0$ を大きくとり、$\delta=\delta(R)>0$ を、$g$ が閉領域 $\{\abs z\le R,\ \mathrm{Re}\,z\ge-\delta\}$ の近傍で正則となるようにとる（$g$ は虚軸の線分 $[-iR,iR]$ のコンパクトな近傍で正則）。その境界を $C$ とし、$C_{+}\defeq C\cap\{\mathrm{Re}\,z>0\}$（半径 $R$ の右半円）、$C_{-}\defeq C\cap\{\mathrm{Re}\,z<0\}$ とする。

**Step 2（コーシーの公式）.** \ref{cx:cauchy-formula} から
$$g(0)-g_{T}(0)=\frac{1}{2\pi i}\oint_{C}\bigl(g(z)-g_{T}(z)\bigr)e^{zT}\Bigl(1+\frac{z^{2}}{R^{2}}\Bigr)\frac{dz}{z}$$
（$z=0$ での値は $(g-g_{T})(0)$。因子 $e^{zT}(1+z^{2}/R^{2})$ は $z=0$ で $1$）。

**Step 3（右半円）.** 【主張：$C_{+}$ 上の積分は $B/R$ 以下】$\mathrm{Re}\,z>0$ で $\abs{g(z)-g_{T}(z)}=\bigl\lvert\int_{T}^{\infty}f(t)e^{-zt}dt\bigr\rvert\le\frac{Be^{-\mathrm{Re}\,z\,T}}{\mathrm{Re}\,z}$。$\abs z=R$ では $\bigl\lvert e^{zT}(1+\frac{z^{2}}{R^{2}})\frac1z\bigr\rvert=e^{\mathrm{Re}\,z\,T}\frac{\abs{\bar z+z}}{R^{2}}=e^{\mathrm{Re}\,z\,T}\frac{2\mathrm{Re}\,z}{R^{2}}$（$z\bar z=R^{2}$）。積は $\le\frac{2B}{R^{2}}$ で、長さ $\pi R$ の弧上の積分を $2\pi$ で割って $\le\frac{B}{R}$。

**Step 4（左側の $g_{T}$）.** $g_{T}$ は整関数なので、$C_{-}$ 上の $g_{T}$ の積分は、経路を半径 $R$ の左半円 $C'_{-}$ に変えても同じ。$\mathrm{Re}\,z<0$ で $\abs{g_{T}(z)}=\bigl\lvert\int_{0}^{T}f(t)e^{-zt}dt\bigr\rvert\le\frac{Be^{-\mathrm{Re}\,z\,T}}{\abs{\mathrm{Re}\,z}}$ なので、Step 3 と同じ計算で寄与は $\le\frac{B}{R}$。

**Step 5（左側の $g$）.** 【主張：$C_{-}$ 上の $g$ の積分は $T\to\infty$ で $0$ に近づく】$C_{-}$ は $z=0$ を通らないコンパクトな曲線（線分 $\mathrm{Re}\,z=-\delta$ と円の短い弧）で、その上で $g(z)(1+z^{2}/R^{2})/z$ は連続、したがって $T$ によらず有界。$C_{-}$ の端点を除く各点で $\mathrm{Re}\,z<0$ なので $e^{zT}\to0$（$T\to\infty$）、かつ $\abs{e^{zT}}\le1$。有界収束定理から積分は $0$ に近づく。

**Step 6（結論）.** $\limsup_{T\to\infty}\abs{g(0)-g_{T}(0)}\le\frac{2B}{R}$。$R$ は任意なので $g_{T}(0)\to g(0)$。
:::

## 素数定理 {#nt:sec-pnt-main}

::: theorem 素数定理 {#nt:prime-number-theorem keywords="prime number theorem: theta(x) ~ x, psi(x) ~ x, pi(x) ~ x / log x; integral int_1^infty (theta(x) - x)/x^2 dx converges" index="素数定理|そすうていり" refname="素数定理"}
1. 積分 $\int_{1}^{\infty}\frac{\theta(x)-x}{x^{2}}dx$ は収束する。
2. $\theta(x)\sim x$。したがって $\psi(x)\sim x$, $\pi(x)\sim\frac{x}{\log x}$。
:::

::: intuition
$\theta(x)/x$ が $1$ からずれた状態が長く続くと、$\frac{\theta(x)-x}{x^{2}}$ の積分に一定量の寄与が積み重なる。積分が収束すること（タウバー型定理）から、ずれは長く続けられず、$\theta(x)/x\to1$ が従う。$\theta$ が単調増加であることが、この「長く続く」を保証する。
:::

::: proof
**Step 1（1：ラプラス変換）.** $f(t)\defeq\theta(e^{t})e^{-t}-1$ は有界（\ref{nt:chebyshev-bounds} の 1）で局所可積分。$x=e^{t}$ と置換し \ref{nt:phi-function} の 2 を使うと、$\mathrm{Re}\,z>0$ で
$$g(z)=\int_{0}^{\infty}f(t)e^{-zt}dt=\int_{1}^{\infty}\theta(x)x^{-z-2}dx-\frac1z=\frac{\Phi(z+1)}{z+1}-\frac1z.$$
$\frac{\Phi(z+1)}{z+1}-\frac1z=\frac{1}{z+1}\Bigl(\Phi(z+1)-\frac1z\Bigr)-\frac{1}{z+1}$ は、\ref{nt:phi-function} の 1 から $\mathrm{Re}\,z\ge0$ を含む開集合で正則。\ref{nt:newman-tauberian} から $\int_{0}^{\infty}f(t)dt=\int_{1}^{\infty}\frac{\theta(x)-x}{x^{2}}dx$ は収束する。

**Step 2（$\limsup\le1$）.** 【主張：$\lambda>1$ について $\theta(x)\ge\lambda x$ となる大きな $x$ は有界な範囲にしかない】$\theta(x)\ge\lambda x$ なら、$\theta$ の単調性から $x\le t\le\lambda x$ で $\theta(t)\ge\lambda x$ なので
$$\int_{x}^{\lambda x}\frac{\theta(t)-t}{t^{2}}dt\ge\int_{x}^{\lambda x}\frac{\lambda x-t}{t^{2}}dt=\int_{1}^{\lambda}\frac{\lambda-u}{u^{2}}du>0.$$
右辺は $x$ によらない正の定数。1 の収束（コーシーの判定法）から、このような $x$ は十分大きいところには存在しない。

**Step 3（$\liminf\ge1$）.** $\lambda<1$ で $\theta(x)\le\lambda x$ なら、$\lambda x\le t\le x$ で $\theta(t)\le\lambda x$ なので $\int_{\lambda x}^{x}\frac{\theta(t)-t}{t^{2}}dt\le\int_{\lambda}^{1}\frac{\lambda-u}{u^{2}}du<0$ で、同様に十分大きい $x$ では起こらない。

**Step 4（2）.** Step 2, 3 から $\theta(x)\sim x$。\ref{nt:pnt-equivalent-forms} から残り。
:::

::: fact 素数定理の精密化 {#nt:pnt-refinements keywords="prime number theorem with error term psi(x) = x + O(x exp(-c sqrt(log x))) via the de la Vallee Poussin zero-free region; Riemann hypothesis iff psi(x) = x + O(x^{1/2 + epsilon}); prime number theorem for arithmetic progressions psi(x; q, a) ~ x / phi(q); li(x) is a better approximation than x / log x" index="素数定理の誤差項|そすうていりのごさこう, リーマン予想|りーまんよそう, 算術級数の素数定理|さんじゅつきゅうすうのそすうていり" refname="素数定理の精密化"}
1. （ド・ラ・ヴァレ・プーサン）ある $c>0$ で $\zeta$ は $\sigma\ge1-\frac{c}{\log(\abs t+2)}$ に零点をもたず、$\psi(x)=x+O\bigl(xe^{-c'\sqrt{\log x}}\bigr)$。$\pi(x)$ の近似としては $\frac{x}{\log x}$ より $\operatorname{li}(x)\defeq\int_{2}^{x}\frac{dt}{\log t}$ の方がよい（Da 13, 18 章）。
2. **リーマン予想**（非自明な零点はすべて $\mathrm{Re}\,s=\frac12$ 上にある）は、任意の $\varepsilon>0$ について $\psi(x)=x+O(x^{1/2+\varepsilon})$ が成り立つことと同値である。
3. （算術級数の素数定理）$\gcd(a,q)=1$ なら $\#\{p\le x:p\equiv a\pmod q\}\sim\frac{1}{\varphi(q)}\frac{x}{\log x}$。証明は、$L(1+it,\chi)\neq0$ を同様に示し、このページと同じ方法を $\sum_{p\equiv a}\frac{\log p}{p^{s}}$ に使う（Da 20 章）。

ここでは証明しない。
:::

::: intuition
零点が $\mathrm{Re}\,s=1$ から離れているほど、素数の数え上げの誤差は小さくなる。すべての非自明な零点が $\mathrm{Re}\,s=\frac12$ 上にあれば、誤差はほぼ $\sqrt x$ という最良の大きさになる。
:::

::: example
1. $x=10^{6}$：$\pi(x)=78498$、$\frac{x}{\log x}\approx72382$、$\operatorname{li}(x)\approx78627$。比 $\pi(x)\log x/x\approx1.084$ は $1$ にゆっくり近づく。
2. $3+4\cos\phi+\cos2\phi$ は $\phi=\pi$ で $0$ になり、それ以外で正：$\phi=0$ で $8$、$\phi=\frac\pi2$ で $2$。
:::

::: hypcheck
- **$\zeta(1+it)\neq0$**：$t\neq0$ は $\zeta(\sigma+2it)$ が有界であること（$1+2it$ が極でない）に使った。$t=0$ では $\zeta$ は極をもつ。
- **ニューマンの定理**：$f$ の有界性は Step 3, 4 の評価に、$g$ の虚軸を越えた正則性は Step 1 の経路の選び方に使った。$g$ が虚軸上に特異点をもつと結論は成り立たない（$f(t)=e^{it}$ では $g(z)=\frac{1}{z-i}$ で、$\int_{0}^{\infty}e^{it}dt$ は収束しない）。
- **素数定理**：$\theta$ の単調性が、積分の収束から各点での漸近を引き出す（タウバー型の議論）のに本質的。
:::

## 問題 {#nt:sec-pnt-problems}

::: problem {#nt:prob-pnt-nth-prime}
素数定理から、$n$ 番目の素数 $p_{n}$ について $p_{n}\sim n\log n$ を導け。
:::

::: solution
$\pi(p_{n})=n$ なので素数定理から $n\sim\frac{p_{n}}{\log p_{n}}$。対数をとると $\log n=\log p_{n}-\log\log p_{n}+o(1)$ なので $\log n\sim\log p_{n}$。よって $p_{n}\sim n\log p_{n}\sim n\log n$。
:::

::: problem {#nt:prob-pnt-newman-counterexample}
$f(t)=\sin t$ について $g(z)=\frac{1}{z^{2}+1}$ を計算し、\ref{nt:newman-tauberian} の仮定のどれが崩れているかを確かめよ。
:::

::: solution
$\int_{0}^{\infty}\sin t\,e^{-zt}dt=\frac{1}{z^{2}+1}$（$\mathrm{Re}\,z>0$）。$g$ は $z=\pm i$ に極をもち、虚軸を越えて正則に延びない。$f$ は有界なので、崩れているのは延長の仮定で、実際 $\int_{0}^{T}\sin t\,dt=1-\cos T$ は収束しない。
:::

::: supplement
**使わなかった前提・本質的でない前提.** この証明は $\zeta$ の関数等式も、$\mathrm{Re}\,s<1$ での零点の情報も使わない。必要なのは $\mathrm{Re}\,s\ge1$ での非零性と、$\theta(x)=O(x)$ だけである。代わりに誤差項は得られない。

**前提を変えると.**
- セルバーグとエルデシュ（1949）は、複素解析を使わない「初等的な」証明を与えた、と知られている。セルバーグの対称公式 $\sum_{p\le x}\log^{2}p+\sum_{pq\le x}\log p\log q=2x\log x+O(x)$ が鍵になる。
- ウィーナー–池原の定理は、非負の係数をもつディリクレ級数 $\sum a_{n}n^{-s}$ が $\mathrm{Re}\,s\ge1$ で $s=1$ の 1 位の極を除いて連続に延びるなら $\sum_{n\le x}a_{n}\sim cx$ を結論するもので、ニューマンの定理はその簡略版にあたる。

**高い視点から：零点と素数の双対性.** リーマンの明示公式 $\psi(x)=x-\sum_{\rho}\frac{x^{\rho}}{\rho}-\log2\pi-\frac12\log(1-x^{-2})$（和は非自明な零点 $\rho$ にわたる）は、素数の分布とゼータの零点が「フーリエ双対」の関係にあることを示す：素数の分布の揺らぎは、零点の虚部を周波数、実部を振幅の成長率とする波の重ね合わせである。$\mathrm{Re}\,s=1$ 上に零点がないことは、どの波も主要項 $x$ と同じ速さでは成長しないこと、すなわち素数定理を意味する。比喩で言えば、素数の列は無数の音叉の共鳴で、各零点が一つの音叉であり、素数定理はどの音叉も基音より大きく鳴らないことを保証する。
:::
