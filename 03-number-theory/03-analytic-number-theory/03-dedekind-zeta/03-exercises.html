## デデキントゼータ関数 {#nt:sec-dz-exercises}

対応するページ：\ref{nt:page-dedekind-zeta}

::: problem ★ 基本：素数ノルムのイデアルの個数 {#nt:ex-dz-prime-norm}
$p\equiv3\pmod4$ の素数 $p>3$, $K=\mathbb{Q}(\sqrt{-p})$ とする。$p$ と異なる素数 $\ell$ について、ノルム $\ell$ のイデアルの個数が $1+(\tfrac\ell p)$ であることを示せ。
:::

::: solution
$\zeta_{K}=\zeta\cdot L(s,(\tfrac\cdot p))$（\ref{nt:quadratic-zeta-factorization}）から、ノルム $m$ のイデアルの個数は $\sum_{d\mid m}(\tfrac dp)$。$m=\ell$ では $1+(\tfrac\ell p)$：完全分解なら 2 個、惰性的なら 0 個。
:::

::: problem ★★ 標準：$\zeta_{\mathbb{Q}(i)}$ と円の格子点 {#nt:ex-dz-circle}
$\sum_{m\le x}r_{2}(m)=\pi x+O(\sqrt x)$ を \ref{nt:lattice-points-disc} から示し、$\sum_{m\le x}\sum_{d\mid m}\chi_{4}(d)=\frac\pi4x+O(\sqrt x)$ を導け。これが $L(1,\chi_{4})=\frac\pi4$ と整合することを説明せよ。
:::

::: solution
$\sum_{m\le x}r_{2}(m)$ は $\Z^{2}$ の半径 $\sqrt x$ の円板の格子点の数から原点を除いたもので、格子 $\Z^{2}$（$\operatorname{covol}=1$、基本領域の直径 $\sqrt2$）に \ref{nt:lattice-points-disc} を使うと $\pi x+O(\sqrt x)$。ヤコビの公式 $r_{2}(m)=4\sum_{d\mid m}\chi_{4}(d)$（\ref{nt:jacobi-two-squares}）で 4 で割る。\ref{nt:dirichlet-class-number-formula} の Step 1 と同じ議論で、$\zeta_{\mathbb{Q}(i)}(s)=\zeta(s)L(s,\chi_{4})$ の留数は $\frac\pi4$ で、これは $L(1,\chi_{4})=\frac\pi4$ に等しい。
:::

## 2 次体の類数公式 {#nt:sec-cn-exercises}

対応するページ：\ref{nt:page-class-number-formula}

::: problem ★ 基本：$h(-31)$ {#nt:ex-cn-h31}
$\mathbb{Q}(\sqrt{-31})$ の類数を \ref{nt:class-number-minus-p} の 3 で求めよ。
:::

::: solution
$31$ を法とする平方剰余は $1,2,4,5,7,8,9,10,14,16,18,19,20,25,28$ で、和は $186$。$1+\cdots+30=465$ なので非剰余の和は $279$。$\frac{\abs{186-279}}{31}=\frac{93}{31}=3$。
:::

::: problem ★★ 標準：$w$ の役割 {#nt:ex-cn-w}
$K=\mathbb{Q}(\sqrt{-3})$ では $w=6$ である。類数公式と $L(1,(\tfrac\cdot3))=\frac{\pi}{3\sqrt3}$ から $h=1$ を確かめ、もし $w=2$ と取り違えると類数が整数にならないことを確かめよ。
:::

::: solution
$h=\frac{w\sqrt3}{2\pi}\cdot\frac{\pi}{3\sqrt3}=\frac w6$。$w=6$ で $h=1$、$w=2$ では $h=\frac13$ となり整数でない。$\mathbb{Z}[\omega]$ には $\pm1,\pm\omega,\pm\omega^{2}$ の 6 つの単元があり、Step 1 の対応で単元倍を同一視する際に $6$ で割る必要がある。
:::
