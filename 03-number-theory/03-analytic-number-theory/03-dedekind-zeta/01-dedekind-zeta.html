# デデキントゼータ関数 {#nt:page-dedekind-zeta keywords="Dedekind zeta function zeta_K(s) = sum N(a)^{-s}, Euler product over prime ideals, convergence for Re s > 1, zeta_K(sigma) <= zeta(sigma)^n, quadratic fields zeta_K = zeta L(s, chi_K), chi_K(p) from the splitting type, chi_K = (./p) for K = Q(sqrt p*), Kronecker symbol, analytic class number formula"}

数体 $K$ の整数環の $0$ でないイデアルのノルムを使って作るディリクレ級数 $\zeta_{K}(s)=\sum_{\mathfrak a}N\mathfrak a^{-s}$ を**デデキントゼータ関数**という。イデアルの素イデアル分解の一意性は、素イデアルにわたるオイラー積として現れ、$K=\mathbb{Q}$ ならリーマンのゼータ関数に戻る。このページでは、$\zeta_{K}$ が $\mathrm{Re}\,s>1$ で絶対収束することを示し、2 次体では素数の分解の型から $\zeta_{K}(s)=\zeta(s)L(s,\chi_{K})$ と分解されることを証明する。特に $K=\mathbb{Q}(\sqrt{p^{\ast}})$（$p^{\ast}=(-1)^{(p-1)/2}p$）では $\chi_{K}$ はルジャンドル記号そのもので、平方剰余の相互法則がこの分解の背後にある。最後に、$\zeta_{K}$ の $s=1$ での留数を類数・単数基準・判別式で表す**解析的類数公式**を述べる。

## 記法と定義の確認 {#nt:sec-dz-notation}

::: notation
- 数体 $K$（$[K:\mathbb{Q}]=n$）、整数環 $\mathcal{O}_{K}$ はデデキント環で（\ref{nt:integers-dedekind}）、$0$ でないイデアルは素イデアルの積に一意に分解する。イデアルのノルム $N\mathfrak a=[\mathcal{O}_{K}:\mathfrak a]$ は乗法的（\ref{nt:ideal-norm-multiplicative}）。素数 $p$ の分解 $p\mathcal{O}_{K}=\prod\mathfrak p_{i}^{e_{i}}$ で $N\mathfrak p_{i}=p^{f_{i}}$, $\sum e_{i}f_{i}=n$（\ref{nt:fundamental-identity}）。
- 2 次体の素数の分解は \ref{nt:quadratic-splitting}、ディリクレ級数・オイラー積・$L$ 関数は \ref{nt:page-dirichlet-series}。
- 体系は $\ZF$（2 次体の分解の定理を除く。その定理には（AC）の印がある）。
:::

## デデキントゼータ関数 {#nt:sec-dz-definition}

::: theorem デデキントゼータ関数の収束とオイラー積 {#nt:dedekind-zeta-euler keywords="zeta_K(s) = sum over nonzero ideals of N(a)^{-s} converges absolutely for Re s > 1 and equals prod over prime ideals of (1 - N(p)^{-s})^{-1}; zeta_K(sigma) <= zeta(sigma)^n" index="デデキントゼータ関数|でできんとぜーたかんすう" refname="デデキントゼータ関数"}
$\zeta_{K}(s)\defeq\sum_{\mathfrak a\neq0}N\mathfrak a^{-s}$ とする（和は $\mathcal{O}_{K}$ の $0$ でないイデアル全体）。
1. 実数 $\sigma>1$ で $\zeta_{K}(\sigma)\le\zeta(\sigma)^{n}$。したがって $\zeta_{K}(s)$ は $\mathrm{Re}\,s>1$ で絶対収束し、正則である。
2. $\mathrm{Re}\,s>1$ で $\zeta_{K}(s)=\prod_{\mathfrak p}(1-N\mathfrak p^{-s})^{-1}=\prod_{p}\prod_{\mathfrak p\mid p}(1-p^{-f_{\mathfrak p}s})^{-1}$。
:::

::: intuition
イデアルの一意分解のおかげで、$\zeta_{K}$ はリーマンのゼータ関数と同じくオイラー積に分かれ、各素数 $p$ の因子は $p$ の上の素イデアルの分解の型（いくつに分かれ、それぞれの剰余次数はいくつか）で決まる。$p$ の上には多くても $n$ 個の素イデアルしかないので、全体は $\zeta^{n}$ で押さえられる。
:::

::: proof
**Step 1（局所因子の評価）.** 【主張：$\prod_{\mathfrak p\mid p}(1-N\mathfrak p^{-\sigma})^{-1}\le(1-p^{-\sigma})^{-n}$】$p$ の上の素イデアルの個数は $\sum e_{i}f_{i}=n$ から $n$ 以下、各 $N\mathfrak p=p^{f}\ge p$ なので各因子は $(1-p^{-\sigma})^{-1}$ 以下。

**Step 2（1）.** $x>0$ について、素イデアル $\mathfrak p$（$N\mathfrak p$ の素因数 $\le x$）にわたる有限積を展開すると、一意分解から、素因数がすべて $x$ 以下の素数の上にあるイデアル全体の $N\mathfrak a^{-\sigma}$ の和になる。Step 1 からこれは $\prod_{p\le x}(1-p^{-\sigma})^{-n}\le\zeta(\sigma)^{n}$ 以下。$N\mathfrak a\le x$ のイデアルはすべて含まれるので、部分和は有界で、正項級数として収束する。$\mathrm{Re}\,s>1$ での正則性は \ref{nt:dirichlet-series-convergence}（$a_{m}\defeq\#\{\mathfrak a:N\mathfrak a=m\}$ のディリクレ級数）。

**Step 3（2）.** \ref{nt:euler-product} の証明と同じく、有限積と和の差は $N\mathfrak a>x$ の項の和で、$x\to\infty$ で $0$ に近づく。
:::

## 2 次体のデデキントゼータ関数 {#nt:sec-dz-quadratic}

::: theorem 2 次体のゼータ関数の分解 {#nt:quadratic-zeta-factorization keywords="for a quadratic field K define chi_K completely multiplicative with chi_K(p) = 1, -1, 0 if p splits, is inert, ramifies; then zeta_K(s) = zeta(s) L(s, chi_K) for Re s > 1; for K = Q(sqrt p*), chi_K(n) = (n/p)" index="2 次体のゼータ関数|にじたいのぜーたかんすう" refname="2 次体のゼータ関数の分解"}
$K$ を 2 次体とし、完全乗法的な関数 $\chi_{K}$ を、素数 $p$ が $K$ で完全分解・惰性的・分岐するのに応じて $\chi_{K}(p)=1,-1,0$ と定める。
1. $\mathrm{Re}\,s>1$ で $\zeta_{K}(s)=\zeta(s)\sum_{m}\chi_{K}(m)m^{-s}$。
2. $p$ を奇素数、$p^{\ast}\defeq(-1)^{(p-1)/2}p$, $K=\mathbb{Q}(\sqrt{p^{\ast}})$ とすると、すべての整数 $m\ge1$ で $\chi_{K}(m)=(\tfrac mp)$。したがって $\zeta_{K}(s)=\zeta(s)L(s,(\tfrac{\cdot}{p}))$ で、$\zeta_{K}$ は $\mathrm{Re}\,s>0$ に有理型に延び、$s=1$ に留数 $L(1,(\tfrac\cdot p))$ の 1 位の極をもつ。
:::

::: intuition
2 次体では、素数 $p$ の局所因子は「2 つに分かれる」「そのまま残る」「重なる」の 3 通りで、それぞれ $(1-p^{-s})^{-2}$, $(1-p^{-2s})^{-1}$, $(1-p^{-s})^{-1}$ になる。どれも $(1-p^{-s})^{-1}(1-\chi(p)p^{-s})^{-1}$ の形に書け、$\chi$ が分解の型を記録する。$\chi$ がルジャンドル記号になることは、分解の型が $p$ を法とする合同条件で決まること、すなわち平方剰余の相互法則の言い換えである。
:::

::: proof
**Step 1（局所因子の比較）.** 【主張：各素数 $p$ で $\prod_{\mathfrak p\mid p}(1-N\mathfrak p^{-s})^{-1}=(1-p^{-s})^{-1}(1-\chi_{K}(p)p^{-s})^{-1}$】完全分解なら $p=\mathfrak p_{1}\mathfrak p_{2}$, $N\mathfrak p_{i}=p$ で左辺は $(1-p^{-s})^{-2}$。惰性的なら $\mathfrak p=p\mathcal{O}_{K}$, $N\mathfrak p=p^{2}$ で $(1-p^{-2s})^{-1}=(1-p^{-s})^{-1}(1+p^{-s})^{-1}$。分岐なら $p=\mathfrak p^{2}$, $N\mathfrak p=p$ で $(1-p^{-s})^{-1}$。

**Step 2（1）.** \ref{nt:dedekind-zeta-euler} の 2、$\zeta$ の積表示、$\sum\chi_{K}(m)m^{-s}=\prod_{p}(1-\chi_{K}(p)p^{-s})^{-1}$（\ref{nt:euler-product}、完全乗法的で絶対収束）を掛け合わせる。

**Step 3（2：奇素数 $\ell\neq p$）.** $p^{\ast}\equiv1\pmod4$ なので $K$ の判別式は $p^{\ast}$ で、分岐する素数は $p$ だけ（\ref{nt:quadratic-splitting}）。奇素数 $\ell\neq p$ は $(\tfrac{p^{\ast}}{\ell})=1$ のとき完全分解、$-1$ のとき惰性的。相互法則（\ref{nt:quadratic-reciprocity-elementary}）と第 1 補充法則から
$$\Bigl(\frac{p^{\ast}}{\ell}\Bigr)=\Bigl(\frac{-1}{\ell}\Bigr)^{\frac{p-1}{2}}\Bigl(\frac p\ell\Bigr)=(-1)^{\frac{\ell-1}{2}\cdot\frac{p-1}{2}}\Bigl(\frac p\ell\Bigr)=\Bigl(\frac\ell p\Bigr).$$

**Step 4（2：$\ell=2$ と $\ell=p$）.** $\ell=p$ は分岐で $(\tfrac pp)=0$。$\ell=2$ は $p^{\ast}\equiv1\pmod8$ なら完全分解、$\equiv5\pmod8$ なら惰性的。$p\equiv1\pmod8$ と $p\equiv7\pmod8$ のとき $p^{\ast}\equiv1\pmod8$（$p^{\ast}=p$ または $-p$）、$p\equiv3,5\pmod8$ のとき $p^{\ast}\equiv5\pmod8$。第 2 補充法則（\ref{nt:second-supplementary-elementary}）から、これは $(\tfrac2p)=\pm1$ と一致する。

**Step 5（2：結論）.** 素数で一致する 2 つの完全乗法的関数は一致する。$(\tfrac\cdot p)$ は $p$ を法とする（主指標でない）ディリクレ指標なので、\ref{nt:dirichlet-l-function} の 3 から $L(s,(\tfrac\cdot p))$ は $\mathrm{Re}\,s>0$ で正則、\ref{nt:zeta-continuation} から $\zeta$ は $s=1$ に留数 $1$ の極をもつ。
:::

::: fact クロネッカー記号と解析的類数公式 {#nt:analytic-class-number-formula keywords="for any quadratic field of discriminant D, chi_K is the Kronecker symbol (D/.), a primitive Dirichlet character mod |D|; analytic class number formula: Res_{s=1} zeta_K(s) = 2^{r_1} (2 pi)^{r_2} h_K R_K / (w_K sqrt|d_K|)" index="解析的類数公式|かいせきてきるいすうこうしき, クロネッカー記号|くろねっかーきごう" refname="解析的類数公式"}
1. 判別式 $D$ の 2 次体 $K$ について、$\chi_{K}$ は $\abs D$ を法とする原始的なディリクレ指標（**クロネッカー記号** $(\tfrac D\cdot)$）である。
2. 一般の数体 $K$ について、$\zeta_{K}$ は $\mathbb{C}$ 上に有理型に延び、極は $s=1$ の 1 位だけで、
$$\operatorname{Res}_{s=1}\zeta_{K}(s)=\frac{2^{r_{1}}(2\pi)^{r_{2}}h_{K}R_{K}}{w_{K}\sqrt{\abs{d_{K}}}}.$$
ここで $r_{1},r_{2}$ は実・複素埋め込みの数、$h_{K}$ は類数、$R_{K}$ は単数基準（\ref{nt:regulator}）、$w_{K}$ は 1 の冪根の個数、$d_{K}$ は判別式。

（1 は相互法則とその補充法則を一般の $D$ に適用して示せる。2 は、各イデアル類のイデアルを、ミンコフスキー埋め込みの錐の中の格子点として数えて示す（Ne VII §5）。虚 2 次体の場合は \ref[2 次体の類数公式]{nt:page-class-number-formula} で証明する。ここでは一般の場合を証明しない。）
:::

::: intuition
デデキントゼータ関数の $s=1$ での留数は、「ノルムが $x$ 以下のイデアルの個数 $\approx\rho x$」の密度 $\rho$ で、それはイデアル類の数（類数）と、各類の中でのイデアルの数え方（格子の体積＝判別式、単元の作用＝単数基準と 1 の冪根）で決まる。
:::

::: example
1. $K=\mathbb{Q}(i)$：$p\equiv1\pmod4$ は完全分解、$p\equiv3$ は惰性的、$2$ は分岐なので $\chi_{K}=\chi_{4}$ で $\zeta_{\mathbb{Q}(i)}(s)=\zeta(s)L(s,\chi_{4})$。留数は $L(1,\chi_{4})=\frac\pi4$ で、類数公式 $\frac{2\pi h}{4\cdot2}=\frac{\pi h}{4}$（$r_{2}=1$, $R=1$, $w=4$, $d=-4$）と比べて $h=1$。
2. $\zeta_{\mathbb{Q}(i)}(s)=\frac14\sum_{(a,b)\neq(0,0)}(a^{2}+b^{2})^{-s}$ で、1 と比べると $\sum_{(a,b)\ne0}(a^{2}+b^{2})^{-s}=4\zeta(s)L(s,\chi_{4})$。係数を比べるとヤコビの $r_{2}(m)=4\sum_{d\mid m}\chi_{4}(d)$（\ref{nt:jacobi-two-squares}）が得られる。
:::

::: hypcheck
- **収束とオイラー積**：イデアルの一意分解（デデキント環）と、素数の上の素イデアルが $n$ 個以下であることだけを使った。
- **2 次体の分解**：$K=\mathbb{Q}(\sqrt{p^{\ast}})$ を選んだのは、判別式が $p^{\ast}$（素数）で、$\chi_{K}$ がルジャンドル記号そのものになるためである。一般の 2 次体ではクロネッカー記号が必要（事実 1）。
:::

## 問題 {#nt:sec-dz-problems}

::: problem {#nt:prob-dz-q-sqrt-minus3}
$K=\mathbb{Q}(\sqrt{-3})$ について $\chi_{K}(n)=(\tfrac n3)$ を確かめ、$\zeta_{K}(s)=\zeta(s)L(s,(\tfrac\cdot3))$ の留数を求めよ。
:::

::: solution
$p=3$, $p^{\ast}=-3$ の場合なので \ref{nt:quadratic-zeta-factorization} の 2 から $\chi_{K}=(\tfrac\cdot3)$。留数は $L(1,(\tfrac\cdot3))=\frac{\pi}{3\sqrt3}$（\ref{nt:page-dirichlet-series} の例）。類数公式（$w=6$, $d=-3$）では $\frac{2\pi h}{6\sqrt3}=\frac{\pi h}{3\sqrt3}$ で、$h=1$。
:::

::: problem {#nt:prob-dz-ideal-count}
$K=\mathbb{Q}(i)$ で、ノルムが $25$ のイデアルの個数を求めよ。
:::

::: solution
$\zeta_{K}=\zeta\cdot L(s,\chi_{4})$ から、ノルム $m$ のイデアルの個数は $\sum_{d\mid m}\chi_{4}(d)$。$m=25$：$\chi_{4}(1)+\chi_{4}(5)+\chi_{4}(25)=3$。実際 $(5)=(2+i)(2-i)$ で、ノルム 25 のイデアルは $(2+i)^{2},(2+i)(2-i),(2-i)^{2}$ の 3 つ。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 収束の証明は判別式も単数も使わず、イデアルの一意分解と素イデアルの個数の評価だけを使う。

**前提を変えると.**
- アーベル拡大 $K/\mathbb{Q}$ では、$\zeta_{K}$ はディリクレの $L$ 関数の積 $\prod_{\chi}L(s,\chi)$ に分解する（クロネッカー–ウェーバーの定理と類体論による）。円分体 $\mathbb{Q}(\zeta_{q})$ では、\ref{nt:character-product-local-factor} の $\zeta_{q}$ が（$q$ の上の因子を除いて）$\zeta_{\mathbb{Q}(\zeta_{q})}$ そのものである。
- 一般のガロア拡大では、$\zeta_{K}$ はアルティンの $L$ 関数の積に分解し、デデキントは $\zeta_{K}/\zeta$ が整関数であると予想した（アーベルの場合とガロア拡大の場合は証明されている）、と知られている。

**高い視点から：分解法則と L 関数.** 2 次体での素数の分解の型が「$p$ を $\abs D$ で割った余り」だけで決まることは、$\zeta_{K}/\zeta$ がディリクレの $L$ 関数になることと同値である。このように「素数の分解法則」と「$L$ 関数の分解」を対応させるのが類体論の解析的な側面で、非可換な拡大ではこれが保型形式の $L$ 関数との対応（ラングランズ予想）にまで広がる。比喩で言えば、数体のゼータ関数は数体の素イデアルの戸籍簿で、それが有理数の戸籍簿 $\zeta$ と「性格表」$L(s,\chi)$ の積に分かれることが、拡大の素性（アーベル拡大であること）を表している。
:::
