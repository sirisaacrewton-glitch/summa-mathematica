# 大域類体論 {#nt:page-global-class-field-theory keywords="global class field theory, Artin reciprocity map C_K -> Gal(L/K) with kernel N C_L, local-global compatibility, existence theorem, ray class fields, Artin map on ideals sends primes to Frobenius, explicit reciprocity map for Q(zeta_m)/Q via C_Q = R_{>0} x Zhat^x, uniqueness of the reciprocity map, Kronecker-Weber theorem from the existence theorem, Hilbert class field, primes splitting completely in the Hilbert class field are principal, principal ideal theorem, Chebotarev density theorem"}

**大域類体論**は、代数体 $K$ の有限次アーベル拡大 $L/K$ のガロア群を、$K$ 自身の言葉（イデール類群 $C_{K}$）だけで記述する：$C_{K}/N_{L/K}C_{L}\cong\operatorname{Gal}(L/K)$（**アルティンの相互法則**）で、ノルム群 $N_{L/K}C_{L}$ は $C_{K}$ の指数有限な開部分群をちょうど一度ずつ尽くす（**存在定理**）。前のページの第一不等式はその一部であるが、第二不等式と相互写像の構成にはさらに長い議論が要るので、このページではこれらを事実として述べる。そのうえで、$\mathbb{Q}$ の円分体については相互写像を具体的に書き下して性質を確かめ、事実から射類体・クロネッカー–ウェーバーの定理・ヒルベルト類体の性質を導く。

## 記法と定義の確認 {#nt:sec-gcft-notation}

::: notation
- イデール群 $I_{K}$、イデール類群 $C_{K}$、$I_{K}^{U}=\prod_{v\mid\infty}K_{v}^{\times}\times\prod_{v\nmid\infty}U_{v}$、法 $\mathfrak{m}$ と $I_{K}^{\mathfrak{m}}$, $C_{K}^{\mathfrak{m}}$、射類群 $\operatorname{Cl}_{K}^{\mathfrak{m}}\cong C_{K}/C_{K}^{\mathfrak{m}}$、$C_{\mathbb{Q}}\cong\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times}$、近似補題は \ref{nt:idele-group}, \ref{nt:ideles-ideals}, \ref{nt:ray-class-group}, \ref{nt:ray-class-idele}, \ref{nt:approximation-lemma}。$K_{v}^{\times}$ は $v$ 成分だけが自由で他の成分が $1$ のイデールとして $I_{K}$ の部分群とみなす。有限素点 $v=\mathfrak{p}$ の一意化元 $\pi_{\mathfrak{p}}$ をこの意味でイデールとみたものを $\pi_{\mathfrak{p}}$ と書く。
- 分解群 $G_{w}\cong\operatorname{Gal}(L_{w}/K_{v})$、イデールのノルム $N_{L/K}$ と $N_{L/K}C_{L}$ は \ref{nt:places-galois-action}, \ref{nt:idele-g-module}, \ref{nt:herbrand-idele-class}。
- 局所相互写像 $\omega_{L_{w}/K_{v}}:K_{v}^{\times}\to\operatorname{Gal}(L_{w}/K_{v})$ は \ref{nt:local-class-field-theory}。無限素点では $\omega_{\mathbb{C}/\mathbb{R}}:\mathbb{R}^{\times}\to\operatorname{Gal}(\mathbb{C}/\mathbb{R})$ を符号（負の数を複素共役に）とし、$L_{w}=K_{v}$ なら自明な写像とする。
- $L/K$ で不分岐な有限素点 $\mathfrak{p}$ と $\mathfrak{P}\mid\mathfrak{p}$ について、**フロベニウス元** $\operatorname{Frob}_{\mathfrak{P}}\in G_{\mathfrak{P}}$ は $\sigma(x)\equiv x^{N(\mathfrak{p})}\pmod{\mathfrak{P}}$（$x\in\mathcal{O}_{L}$）をみたすただ一つの元（$K=\mathbb{Q}$ のときは \ref{nt:frobenius-element}）。剰余体は完備化で変わらないので、これは $G_{\mathfrak{P}}\cong\operatorname{Gal}(L_{w}/K_{v})$ で不分岐局所拡大のフロベニウス自己同型（\ref{nt:unramified-local-field}）に対応する。$L/K$ がアーベルなら $\mathfrak{P}\mid\mathfrak{p}$ によらないので $\operatorname{Frob}_{\mathfrak{p}}$ と書く。
- 円分体 $\mathbb{Q}(\zeta_{m})$ のガロア群 $(\mathbb{Z}/m)^{\times}\ni a\mapsto\sigma_{a}$（$\sigma_{a}(\zeta_{m})=\zeta_{m}^{a}$）と、$p\nmid m$ での $\operatorname{Frob}_{p}=\sigma_{p}$ は \ref{fld:cyclotomic-galois}, \ref{nt:cyclotomic-splitting}。
- 体系は $\ZFC$。
:::

## 大域類体論の主張 {#nt:sec-gcft-statement}

::: fact 大域類体論 {#nt:global-class-field-theory keywords="global reciprocity: for finite abelian L/K a continuous surjective homomorphism psi_{L/K}: C_K -> Gal(L/K) with kernel N_{L/K} C_L; compatibility with local reciprocity maps; functoriality; uniformizers at unramified primes map to Frobenius; existence theorem: finite abelian extensions correspond to open subgroups of finite index of C_K; second inequality" index="大域類体論|たいいきるいたいろん, アルティンの相互法則|あるてぃんのそうごほうそく, 大域相互写像|たいいきそうごしゃぞう, 存在定理（大域類体論）|そんざいていり" refname="大域類体論"}
$K$ を代数体とする。
1. （**相互法則**）有限次アーベル拡大 $L/K$ ごとに、連続な全射準同型 $\psi_{L/K}:C_{K}\to\operatorname{Gal}(L/K)$ があり、核は $N_{L/K}C_{L}$。したがって $[C_{K}:N_{L/K}C_{L}]=[L:K]$（**第二不等式** $\le$ を含む）。
2. （**局所との両立**）各素点 $v$ と $w\mid v$ について、$K_{v}^{\times}\to C_{K}\xrightarrow{\psi_{L/K}}\operatorname{Gal}(L/K)$ は局所相互写像 $\omega_{L_{w}/K_{v}}$ に等しい（値は $G_{w}=\operatorname{Gal}(L_{w}/K_{v})\subseteq\operatorname{Gal}(L/K)$ に入る）。
3. （**関手性**）$L\subseteq L'$ なら $\psi_{L'/K}$ の $L$ への制限は $\psi_{L/K}$。
4. （**存在定理**）$L\mapsto N_{L/K}C_{L}$ は、（固定した代数閉包の中の）$K$ の有限次アーベル拡大と、$C_{K}$ の指数有限な開部分群との、包含を逆にする全単射である。

（Ne VI §4–6、CF VII §5–9。第二不等式の証明はクンマー拡大と $S$ 単数の計算による。相互写像は抽象類体論（類構造）の枠組みで、局所相互写像の積 $\prod_{v}\omega_{v}$ が $K^{\times}$ 上で自明であることを示して構成される。ここでは証明しない。$[C_{K}:N_{L/K}C_{L}]\ge[L:K]$ の巡回拡大の場合は \ref{nt:herbrand-idele-class} で証明した。）
:::

::: intuition
アーベル拡大の情報はすべて「どの素点でどう振る舞うか」に表れ、それを $K$ の側で集計する帳簿がイデール類群である。相互写像は各素点の局所相互写像を掛け合わせたもので、$K^{\times}$ の元について積が $1$ になること（積公式の非可換でない版、ヒルベルトの積公式の一般化）が、$C_{K}=I_{K}/K^{\times}$ の上で定義できる理由である。
:::

::: proposition 相互写像とフロベニウス {#nt:reciprocity-frobenius keywords="psi(pi_p) = Frob_p for p unramified in L; psi(U_p) = 1 iff p is unramified; the decomposition group G_w is psi(K_v^x); v splits completely iff K_v^x is in N C_L" index="相互写像とフロベニウス|そうごしゃぞうとふろべにうす" refname="相互写像とフロベニウス"}
\ref{nt:global-class-field-theory} を認める。$L/K$ を有限次アーベル拡大とする。
1. $G_{w}=\psi_{L/K}(K_{v}^{\times})$。特に $v$ が $L$ で完全分解 $\iff$ $K_{v}^{\times}\subseteq\ker\psi_{L/K}$。
2. 有限素点 $\mathfrak{p}$ が不分岐 $\iff$ $\psi_{L/K}(U_{\mathfrak{p}})=1$。このとき $\psi_{L/K}(\pi_{\mathfrak{p}})=\operatorname{Frob}_{\mathfrak{p}}$。
3. 実素点 $v$ が完全分解（$L_{w}=\mathbb{R}$）$\iff$ $\psi_{L/K}(\mathbb{R}^{\times}_{v})=1$。
:::

::: intuition
相互写像を素点 $v$ に制限したものは局所相互写像なので、その像は分解群である。単数の像は惰性群、一意化元の像はフロベニウスになり、素点の分解の仕方がすべて相互写像から読める。
:::

::: proof
**Step 1（1）.** 【主張：$G_{w}=\psi(K_{v}^{\times})$】局所相互写像は全射（\ref{nt:local-class-field-theory} の 1、無限素点では定義から）なので、\ref{nt:global-class-field-theory} の 2 から $\psi(K_{v}^{\times})=\omega(K_{v}^{\times})=G_{w}$。完全分解は $G_{w}=1$（\ref{nt:completely-split-place}）。

**Step 2（2）.** 【主張：惰性群は $\psi(U_{\mathfrak{p}})$、フロベニウスは $\psi(\pi_{\mathfrak{p}})$】\ref{nt:local-class-field-theory} の 3 から $\omega(U_{\mathfrak{p}})$ は $L_{w}/K_{v}$ の惰性群で、それが自明 $\iff$ 不分岐。不分岐なら \ref{nt:local-class-field-theory} の 1 から $\omega(\pi_{\mathfrak{p}})$ は局所拡大のフロベニウスで、記法の注意から $\operatorname{Frob}_{\mathfrak{p}}$。

**Step 3（3）.** 【主張：実素点の分解群は $\psi(\mathbb{R}^{\times}_{v})$】$\omega_{\mathbb{C}/\mathbb{R}}$ は全射なので、$\psi(\mathbb{R}^{\times}_{v})=1\iff G_{w}=1$。
:::

## 射類体 {#nt:sec-gcft-ray}

::: theorem 射類体 {#nt:ray-class-field keywords="for a modulus m there is a unique abelian extension K_m (ray class field) with norm group C_K^m; the Artin map on ideals prime to m induces Cl_K^m = Gal(K_m/K) sending p to Frob_p; K_m is unramified outside m; the Hilbert class field is the case m = 1" index="射類体|しゃるいたい" refname="射類体"}
\ref{nt:global-class-field-theory} を認める。法 $\mathfrak{m}$ について、$N_{K_{\mathfrak{m}}/K}C_{K_{\mathfrak{m}}}=C_{K}^{\mathfrak{m}}$ となる有限次アーベル拡大 $K_{\mathfrak{m}}$（**法 $\mathfrak{m}$ の射類体**）がただ一つあり、
1. $\mathfrak{m}_{f}$ と素な素イデアル $\mathfrak{p}$ は $K_{\mathfrak{m}}$ で不分岐で、$\mathfrak{p}\mapsto\operatorname{Frob}_{\mathfrak{p}}$ は同型 $\operatorname{Cl}_{K}^{\mathfrak{m}}\cong\operatorname{Gal}(K_{\mathfrak{m}}/K)$（**アルティン写像**）を誘導する。
2. $\mathfrak{m}_{\infty}$ に入らない実素点は $K_{\mathfrak{m}}$ で完全分解する。
3. 有限次アーベル拡大 $L/K$ について、$L\subseteq K_{\mathfrak{m}}\iff N_{L/K}C_{L}\supseteq C_{K}^{\mathfrak{m}}$。
:::

::: intuition
射類群を「ガロア群として実現する」アーベル拡大が射類体である。$\mathfrak{m}$ と素な素イデアルはフロベニウスとしてガロア群の元に対応し、その対応が射類群の同型を与える。$\mathbb{Q}$ と $\mathfrak{m}=(m)\infty$ では円分体 $\mathbb{Q}(\zeta_{m})$ になる。
:::

::: proof
**Step 1（存在と一意性）.** $C_{K}^{\mathfrak{m}}$ は指数有限な開部分群（\ref{nt:ray-class-idele} の 2）なので、存在定理から $K_{\mathfrak{m}}$ がただ一つある。3 は存在定理の「包含を逆にする」から。

**Step 2（不分岐性）.** 【主張：$\mathfrak{p}\nmid\mathfrak{m}_{f}$ と、$\mathfrak{m}_{\infty}$ の外の実素点 $v$ で、$\psi(U_{\mathfrak{p}})=1$, $\psi(\mathbb{R}_{v}^{\times})=1$】$U_{\mathfrak{p}}$ と $\mathbb{R}_{v}^{\times}$ は $I_{K}^{\mathfrak{m}}$ に入り（定義：$\mathfrak{p}\nmid\mathfrak{m}$ の成分は $U_{\mathfrak{p}}^{(0)}=U_{\mathfrak{p}}$、$\mathfrak{m}_{\infty}$ の外の無限成分は $K_{v}^{\times}$）、その像は $C_{K}^{\mathfrak{m}}=\ker\psi$ に入る。\ref{nt:reciprocity-frobenius} の 2・3 から 2 と 1 の前半が従う。

**Step 3（アルティン写像）.** $\psi$ は同型 $C_{K}/C_{K}^{\mathfrak{m}}\cong\operatorname{Gal}(K_{\mathfrak{m}}/K)$ を誘導し、\ref{nt:ray-class-idele} の同型 $\operatorname{Cl}_{K}^{\mathfrak{m}}\cong C_{K}/C_{K}^{\mathfrak{m}}$ は $\mathfrak{p}$ を $\pi_{\mathfrak{p}}$ の類に送る。合成は \ref{nt:reciprocity-frobenius} の 2 から $\mathfrak{p}\mapsto\operatorname{Frob}_{\mathfrak{p}}$。
:::

::: definition ヒルベルト類体 {#nt:hilbert-class-field keywords="Hilbert class field H_K: the ray class field of modulus 1; Gal(H/K) = Cl_K; maximal abelian extension unramified at all places" index="ヒルベルト類体|ひるべるとるいたい" refname="ヒルベルト類体"}
法 $\mathfrak{m}=1$（$\mathfrak{m}_{f}=\mathcal{O}_{K}$, $\mathfrak{m}_{\infty}=\emptyset$）の射類体 $H_{K}\defeq K_{1}$ を**ヒルベルト類体**という。$C_{K}^{1}$ の記号との衝突を避けて、ノルム群を $C_{K}^{(1)}\defeq I_{K}^{U}K^{\times}/K^{\times}$ と書く。
:::

::: intuition
ヒルベルト類体は、どこでも分岐しない最大のアーベル拡大で、そのガロア群はイデアル類群そのものである。類群という「イデアルの側のずれ」を、拡大体の「ガロア群」として実体化したもの。
:::

::: theorem ヒルベルト類体の性質 {#nt:hilbert-class-field-properties keywords="Gal(H_K/K) = Cl_K; H_K is the maximal abelian extension of K unramified at all finite places in which all real places stay real; a prime ideal splits completely in H_K iff it is principal; [H_K : K] = h_K" index="ヒルベルト類体の性質|ひるべるとるいたいのせいしつ" refname="ヒルベルト類体の性質"}
\ref{nt:global-class-field-theory} を認める。
1. $\operatorname{Gal}(H_{K}/K)\cong\operatorname{Cl}_{K}$（$\mathfrak{p}\mapsto\operatorname{Frob}_{\mathfrak{p}}$）、特に $[H_{K}:K]=h_{K}$。
2. $H_{K}/K$ はすべての有限素点で不分岐で、すべての実素点が完全分解する。このような有限次アーベル拡大はすべて $H_{K}$ に含まれる。
3. 素イデアル $\mathfrak{p}$ が $H_{K}$ で完全分解する $\iff$ $\mathfrak{p}$ は単項イデアル。
:::

::: intuition
類群の元は「単項でないイデアルのずれ」だったが、ヒルベルト類体ではこのずれがガロア群の元（フロベニウス）として実現される：イデアルが単項であることと、そのイデアルが $H_{K}$ で完全に分かれることが同じになる。$\mathbb{Z}[\sqrt{-5}]$ のように一意分解が壊れた環でも、$H_{K}$ まで上がると「壊れ方」がガロア群の言葉で読める。
:::

::: proof
**Step 1（1・2 の前半）.** \ref{nt:ray-class-field} で $\mathfrak{m}=1$ とすると $\operatorname{Cl}_{K}^{1}=J_{K}/P_{K}=\operatorname{Cl}_{K}$ で、すべての有限素点が不分岐、すべての実素点が完全分解。

**Step 2（2 の後半：最大性）.** 【主張：そのような $L$ について $N_{L/K}C_{L}\supseteq C_{K}^{(1)}$】\ref{nt:reciprocity-frobenius} の 2・3 から $\psi_{L/K}(U_{\mathfrak{p}})=1$（すべての $\mathfrak{p}$）、$\psi_{L/K}(\mathbb{R}_{v}^{\times})=1$（実素点）、複素素点 $v$ では $L_{w}=K_{v}=\mathbb{C}$ なので $\psi_{L/K}(\mathbb{C}_{v}^{\times})=G_{w}=1$。$I_{K}\to C_{K}\xrightarrow{\psi}\operatorname{Gal}(L/K)$ の核 $W$ は有限群の単位元の逆像なので開部分群で、ある有限集合 $S$ について $\prod_{v\notin S}U_{v}$（$S$ の成分は $1$）を含む。$I_{K}^{U}$ の元は、$S$ の有限個の成分（それぞれ $U_{\mathfrak{p}}$ または $K_{v}^{\times}$（$v\mid\infty$）の元で、$W$ に入る）と $\prod_{v\notin S}U_{v}$ の元の積なので $W$ に入る。よって $N_{L/K}C_{L}=\ker\psi\supseteq C_{K}^{(1)}$ で、\ref{nt:ray-class-field} の 3（$\mathfrak{m}=1$）から $L\subseteq H_{K}$。

**Step 3（3）.** \ref{nt:reciprocity-frobenius} の 1 から、$\mathfrak{p}$ が完全分解 $\iff\psi(K_{\mathfrak{p}}^{\times})=1$。$K_{\mathfrak{p}}^{\times}=\pi_{\mathfrak{p}}^{\mathbb{Z}}U_{\mathfrak{p}}$ で $\psi(U_{\mathfrak{p}})=1$ なので $\iff\operatorname{Frob}_{\mathfrak{p}}=\psi(\pi_{\mathfrak{p}})=1\iff$ 1 の同型で $\mathfrak{p}$ の類が自明。
:::

::: example
$K=\mathbb{Q}(\sqrt{-5})$ では $h_{K}=2$（\ref{nt:class-number-examples}）で、$H_{K}=K(\sqrt{-1})=\mathbb{Q}(\sqrt{-5},\sqrt{-1})$ であることが知られている（Cox *Primes of the form $x^{2}+ny^{2}$* 第 2 章）。$2$ の上の素イデアル $\mathfrak{p}_{2}=(2,1+\sqrt{-5})$ は単項でないので、性質 3 から $H_{K}$ で完全分解しない。実際 $H_{K}/K$ は $2$ 次なので、$\mathfrak{p}_{2}$ は $H_{K}$ で惰性する。さらに性質 3 を使うと、$5$ と異なる奇素数 $p$ について $p=x^{2}+5y^{2}\iff p\equiv1,9\pmod{20}$ が導かれる（同書 第 2 章。ここでは導出しない）。
:::

## $\mathbb{Q}$ の円分体と相互写像 {#nt:sec-gcft-cyclotomic}

::: theorem 円分体の相互写像 {#nt:cyclotomic-reciprocity keywords="for Q(zeta_m)/Q, the homomorphism psi: C_Q = R_{>0} x Zhat^x -> (Z/m)^x, (t, u) -> u^{-1} mod m, is continuous, surjective, trivial on R_{>0} x prod U_p^{(v_p(m))}, sends pi_p to Frob_p = sigma_p for p not dividing m, and is the unique continuous homomorphism with the last property" index="円分体の相互写像|えんぶんたいのそうごしゃぞう" refname="円分体の相互写像"}
$m\ge2$ とし、\ref{nt:ray-class-idele} の例の分解 $I_{\mathbb{Q}}=\mathbb{Q}^{\times}\times(\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times})$ でイデール $a$ を $a=x\cdot(t,u)$ と書き、
$$
\psi_{m}(a)\defeq\sigma_{u^{-1}\bmod m}\in\operatorname{Gal}(\mathbb{Q}(\zeta_{m})/\mathbb{Q})
$$
とおく（$u\bmod m$ は $\hat{\mathbb{Z}}^{\times}\to\prod_{p\mid m}(\mathbb{Z}_{p}/p^{v_{p}(m)})^{\times}\cong(\mathbb{Z}/m)^{\times}$ の像）。
1. $\psi_{m}$ は $C_{\mathbb{Q}}$ 上の連続な全射準同型で、核は $C_{\mathbb{Q}}^{\mathfrak{m}}$（$\mathfrak{m}=(m)\infty$）。
2. $p\nmid m$ なら $\psi_{m}(\pi_{p})=\sigma_{p}=\operatorname{Frob}_{p}$（$\pi_{p}$ は $p$ 成分が $p$ のイデール）。
3. 連続準同型 $\chi:C_{\mathbb{Q}}\to\operatorname{Gal}(\mathbb{Q}(\zeta_{m})/\mathbb{Q})$ が $m$ と素な（有限個を除く）すべての素数 $p$ で $\chi(\pi_{p})=\operatorname{Frob}_{p}$ をみたすなら $\chi=\psi_{m}$。
4. したがって \ref{nt:global-class-field-theory} の相互写像は $\psi_{\mathbb{Q}(\zeta_{m})/\mathbb{Q}}=\psi_{m}$ で、$N C_{\mathbb{Q}(\zeta_{m})}=C_{\mathbb{Q}}^{\mathfrak{m}}$、すなわち $\mathbb{Q}(\zeta_{m})$ は法 $(m)\infty$ の射類体である。
:::

::: intuition
$\mathbb{Q}$ のイデールは「正の実数」と「すべての $p$ での $p$ 進単数」と「有理数」に一意に分かれる。円分体のガロア群 $(\mathbb{Z}/m)^{\times}$ に効くのは $p$ 進単数の $m$ を法とする値だけで、逆元をとるのは、素数 $p$ のイデール $\pi_{p}$ を有理数 $p$ で割ると、$p$ 以外の成分に $p^{-1}$ が現れるからである。
:::

::: proof
**Step 1（1）.** 【主張：$\psi_{m}$ は連続な全射準同型で核は $C_{\mathbb{Q}}^{\mathfrak{m}}$】分解の一意性から $a\mapsto u$ は準同型で、$\mathbb{Q}^{\times}$ 上で自明なので $C_{\mathbb{Q}}$ 上で定義される。$\hat{\mathbb{Z}}^{\times}\to(\mathbb{Z}/m)^{\times}$ は全射（中国剰余定理と \ref{nt:residue-completion}）。核は $u\in\prod_{p}U_{p}^{(v_{p}(m))}$ となる類で、\ref{nt:ray-class-idele} の例から $C_{\mathbb{Q}}^{\mathfrak{m}}$。連続性：核 $C^{\mathfrak{m}}_{\mathbb{Q}}$ は開（\ref{nt:ray-class-idele} の 2）なので、有限群への準同型として連続。

**Step 2（2）.** 【主張：$\psi_{m}(\pi_{p})=\sigma_{p}$】$\pi_{p}=p\cdot(t,u)$ と分解すると、$x=p$（$\pi_{p}$ の実成分は $1>0$ で、$p$ 進付値は $p$ 成分だけが $1$）、$t=p^{-1}$、$u$ の $\ell$ 成分は $\ell\neq p$ で $p^{-1}$、$p$ 成分で $1$。$p\nmid m$ なので $u\bmod m=p^{-1}\bmod m$ で、$\psi_{m}(\pi_{p})=\sigma_{p}$。これは \ref{nt:cyclotomic-splitting} の 2 から $\operatorname{Frob}_{p}$。

**Step 3（3：一意性）.** 【主張：$\chi\psi_{m}^{-1}$ は自明】$\eta\defeq\chi\psi_{m}^{-1}$ は連続準同型で、仮定と Step 2 から有限集合 $E$ の外の $p\nmid m$ で $\eta(\pi_{p})=1$。$\ker\eta$ は有限群の単位元の逆像なので開で、$I_{\mathbb{Q}}$ への引き戻しは $1$ の近傍として、ある有限集合 $T$ と $k_{p}\ge0$ について $\mathbb{R}_{>0}\times\prod_{p\in T}U_{p}^{(k_{p})}\times\prod_{p\notin T}U_{p}$ を含む（基本開集合が生成する部分群；$\mathbb{R}^{\times}$ の $1$ の近傍の生成する群は $\mathbb{R}_{>0}$）。$T$ を大きくして、$m$ の素因数と $E$ を含むとする。イデール $a$ について、\ref{nt:approximation-lemma} で $p\in T$ では $v_{p}(x-a_{p})\ge v_{p}(a_{p})+k_{p}$、$\operatorname{sgn}x=\operatorname{sgn}a_{\infty}$ となる $x\in\mathbb{Q}^{\times}$ をとると、$b\defeq x^{-1}a$ は $\infty$ で正、$p\in T$ で $U_{p}^{(k_{p})}$ に入る。$p\notin T$ では $b_{p}=p^{n_{p}}u_{p}$（$u_{p}\in U_{p}$、有限個を除き $n_{p}=0$）なので $b=\prod_{p\notin T}\pi_{p}^{n_{p}}\cdot c$、$c\in\ker\eta$。$p\notin T$ は $p\nmid m$ かつ $p\notin E$ なので $\eta(\pi_{p})=1$、よって $\eta(a)=\eta(b)=1$。

**Step 4（4）.** \ref{nt:reciprocity-frobenius} の 2 から $\psi_{\mathbb{Q}(\zeta_{m})/\mathbb{Q}}$ は $p\nmid m$（不分岐、\ref{nt:cyclotomic-splitting} の 1）で $\pi_{p}\mapsto\operatorname{Frob}_{p}$ をみたすので、3 から $\psi_{m}$ に等しい。核を比べて $NC_{\mathbb{Q}(\zeta_{m})}=\ker\psi_{m}=C_{\mathbb{Q}}^{\mathfrak{m}}$。
:::

::: corollary クロネッカー–ウェーバーの定理 {#nt:kronecker-weber keywords="Kronecker-Weber: every finite abelian extension of Q is contained in a cyclotomic field; deduction from the existence theorem and the cyclotomic reciprocity map" index="クロネッカー–ウェーバーの定理|くろねっかーうぇーばーのていり" refname="クロネッカー–ウェーバーの定理"}
\ref{nt:global-class-field-theory} を認める。$\mathbb{Q}$ の有限次アーベル拡大は、ある円分体 $\mathbb{Q}(\zeta_{m})$ に含まれる。
:::

::: intuition
$\mathbb{Q}$ のイデール類群の開部分群はすべて「$m$ を法とする合同条件」で決まり、その類体は円分体なので、$\mathbb{Q}$ のアーベル拡大は 1 の冪根を添加して得られるものに限られる。
:::

::: proof
**Step 1（ノルム群は $C_{\mathbb{Q}}^{\mathfrak{m}}$ を含む）.** 【主張：$C_{\mathbb{Q}}$ の開部分群 $W$ は、ある $m$ について $C_{\mathbb{Q}}^{(m)\infty}$ を含む】$W$ の $I_{\mathbb{Q}}$ への引き戻しは開部分群なので、\ref{nt:cyclotomic-reciprocity} の Step 3 と同じく $\mathbb{R}_{>0}\times\prod_{p\in T}U_{p}^{(k_{p})}\times\prod_{p\notin T}U_{p}$ を含む。$m\defeq\prod_{p\in T}p^{\max(k_{p},1)}$ とすれば、これは $I_{\mathbb{Q}}^{(m)\infty}$ を含む。

**Step 2（結論）.** アーベル拡大 $L$ のノルム群 $NC_{L}$（開部分群）に Step 1 を使うと $NC_{L}\supseteq C_{\mathbb{Q}}^{(m)\infty}=NC_{\mathbb{Q}(\zeta_{m})}$（\ref{nt:cyclotomic-reciprocity} の 4）。存在定理の対応は包含を逆にするので $L\subseteq\mathbb{Q}(\zeta_{m})$。
:::

::: example
平方剰余の相互法則は、$\mathbb{Q}(\sqrt{p^{*}})\subseteq\mathbb{Q}(\zeta_{p})$（$p^{*}=(-1)^{(p-1)/2}p$）に関手性を適用した形とみなせる：$\psi_{\mathbb{Q}(\sqrt{p^{*}})/\mathbb{Q}}(\pi_{q})$ は $\sigma_{q}$ の制限で、それが自明 $\iff q$ が $(\mathbb{Z}/p)^{\times}$ の平方 $\iff(\tfrac qp)=1$、一方フロベニウスとしては $\iff q$ が $\mathbb{Q}(\sqrt{p^{*}})$ で分解 $\iff(\tfrac{p^{*}}{q})=1$。これは \ref{nt:quadratic-reciprocity} の証明そのものであり、そこでは円分体のフロベニウスを直接使って示した（\ref{nt:frobenius-restriction}）。
:::

::: hypcheck
- **事実の使い方**：このページの命題・定理のうち、\ref{nt:cyclotomic-reciprocity} の 1〜3 だけは \ref{nt:global-class-field-theory} を使わずに証明した。他はすべて \ref{nt:global-class-field-theory} と \ref{nt:local-class-field-theory}（事実）を前提とする条件付きの証明である。
- **円分体の相互写像の一意性**：連続性（核が開）を、近似補題で有限個の素点を調整する部分に本質的に使った。連続性を外すと、核が基本開集合を含むという議論が使えない。
- **クロネッカー–ウェーバー**：基底体が $\mathbb{Q}$ であることは、$C_{\mathbb{Q}}$ のすべての開部分群が $C_{\mathbb{Q}}^{(m)\infty}$ の形を含み、しかもその類体が具体的に（円分体として）わかっていることに使った。一般の $K$ では射類体を具体的に書く問題（ヒルベルトの第 12 問題）が残り、虚 2 次体では楕円曲線の虚数乗法で解かれている。
- **ヒルベルト類体**：最大性の証明で $\psi$ の連続性を使った。
:::

## 問題 {#nt:sec-gcft-problems}

::: problem {#nt:prob-gcft-psi-idele}
$m=5$ とする。$\mathbb{Q}$ のイデール $a$ で、$a_{\infty}=-1$, $a_{5}=2$, 他の成分が $1$ のものについて、$\psi_{5}(a)$ を求めよ。
:::

::: solution
$x\in\mathbb{Q}^{\times}$ は符号と各 $p$ 進付値で決まる：$a_{\infty}<0$、すべての $p$ で $v_{p}(a_{p})=0$ なので $x=-1$。$(t,u)=x^{-1}a$ は $t=1$, $u_{5}=-2$, $u_{p}=-1$（$p\neq5$）。$u\bmod5=-2\equiv3$ なので $\psi_{5}(a)=\sigma_{3^{-1}}=\sigma_{2}$。
:::

::: problem {#nt:prob-gcft-hilbert-q}
$\mathbb{Q}$ と $\mathbb{Q}(i)$ のヒルベルト類体を求めよ。
:::

::: solution
$h_{\mathbb{Q}}=1$ なので $[H_{\mathbb{Q}}:\mathbb{Q}]=1$, $H_{\mathbb{Q}}=\mathbb{Q}$。$\mathbb{Z}[i]$ は単項イデアル整域なので $h=1$ で $H_{\mathbb{Q}(i)}=\mathbb{Q}(i)$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** \ref{nt:cyclotomic-reciprocity} の 1〜3 は類体論を使わない純粋な計算であり、4 で初めて事実を使う。

**前提を変えると.**
- **単項化定理**（フルトヴェングラー）：$K$ のすべてのイデアルは $H_{K}$ で単項になる。群論の移送（transfer）の問題に帰着して示される（Ne VI §7）。ここでは証明しない。
- **類体塔**：$H_{K}$ のヒルベルト類体をとる操作を繰り返すと、無限に続く場合がある（ゴロド–シャファレヴィッチ）。
- **チェボタレフの密度定理**：ガロア拡大 $L/K$ と共役類 $C\subseteq G$ について、$\operatorname{Frob}_{\mathfrak{p}}\in C$ となる素イデアルの（ディリクレ）密度は $\abs C/\abs G$ である。アーベル拡大ではディリクレの算術級数定理の一般化で、証明には $L$ 関数の $s=1$ での非消滅（類体論の帰結）を使う。\ref{nt:almost-all-split-trivial} はその弱い代数的な類似である。
- **非可換化**：アーベル拡大を超えた記述はラングランズ予想の主題で、$\operatorname{GL}_{1}$ のイデールが $\operatorname{GL}_{n}$ のアデール点上の保型表現に置き換わる。

**高い視点から：類体論は双対性.** 相互写像を逆極限でまとめると、$C_{K}$ の副有限完備化（の連結成分を割ったもの）と絶対ガロア群の最大アーベル商 $G_{K}^{\mathrm{ab}}$ の同型 $C_{K}/D_{K}\cong G_{K}^{\mathrm{ab}}$ になる（$D_{K}$ は単位元の連結成分）。$G_{K}^{\mathrm{ab}}$ の指標は $C_{K}$ の有限位数の指標（ヘッケ指標）と一致し、これが $L$ 関数の言葉への橋になる。比喩で言えば、アーベル拡大の世界は $C_{K}$ という「地図」に描かれていて、拡大を一つ選ぶことは地図の上に指数有限の格子（ノルム群）を引くことにあたり、その格子の目の数がガロア群の位数、各素点の位置がその素点の分解の仕方を教える。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref[演習]{nt:sec-gcft-exercises} にまとめた。
