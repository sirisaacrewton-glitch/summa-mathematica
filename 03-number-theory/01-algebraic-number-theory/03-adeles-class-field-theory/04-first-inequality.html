# イデール類群のエルブラン商と第一不等式 {#nt:page-first-inequality keywords="Herbrand quotient of the S-ideles of a cyclic extension h(I_L^S) = product of local degrees n_v, local norms everywhere implies idele norm, permutation lattice lemma, Herbrand quotient of S-units h(O_{L,S}^x) = (prod n_v)/n, Herbrand quotient of the idele class group h(C_L) = n, first inequality [C_K : N C_L] >= n, infinitely many non-split places in cyclic extensions of prime power degree, a Galois extension in which almost all places split completely is trivial"}

$L/K$ を巡回拡大とする。イデール類群 $C_{L}$ のエルブラン商は、ちょうど次数 $n=[L:K]$ に等しい。これは、イデール群 $I_{L,\bar S}$（局所の寄与 $\prod n_{v}$）と $S$ 単数群（大域の寄与 $\prod n_{v}/n$）のエルブラン商の比として計算され、その結果として**第一不等式** $[C_{K}:N_{L/K}C_{L}]\ge n$ が得られる。これは大域類体論の主定理「$C_{K}/N_{L/K}C_{L}\cong\operatorname{Gal}(L/K)$」のうち、「ノルムの剰余は少なくとも $G$ と同じだけ大きい」という半分である。応用として、ほとんどすべての素点が完全分解するガロア拡大は自明であることを、解析的な道具を使わずに示す。

## 記法と定義の確認 {#nt:sec-fi-notation}

::: notation
- $L/K$ を代数体の $n$ 次巡回拡大、$G=\operatorname{Gal}(L/K)$。$G$ の素点への作用、分解群 $G_{w}\cong\operatorname{Gal}(L_{w}/K_{v})$、局所次数 $n_{v}=\abs{G_{w}}$、完全分解は \ref{nt:places-galois-action}, \ref{nt:completely-split-place}。$G_{w}$ は巡回群 $G$ の部分群なので巡回群。
- $S$ を $K$ の素点の有限集合で無限素点を含むもの、$\bar S$ をその上の $L$ の素点全体とし、$I_{L,\bar S}=\prod_{w\in\bar S}L_{w}^{\times}\times\prod_{w\notin\bar S}U_{w}$, $\mathcal{O}_{L,\bar S}^{\times}=L^{\times}\cap I_{L,\bar S}$（$S$ 単数）とする（\ref{nt:idele-group}, \ref{nt:s-unit-theorem}）。
- $G$ 加群としてのイデール群、半局所成分 $L_{v}^{\times}=\prod_{w\mid v}L_{w}^{\times}\cong\operatorname{CoInd}_{G_{w}}^{G}L_{w}^{\times}$、$C_{L}^{G}=C_{K}$、イデールのノルム $N_{G}$ の成分表示は \ref{nt:idele-g-module}。イデールのノルムを $N_{L/K}\defeq N_{G}:I_{L}\to I_{K}$ と書き、$N_{L/K}C_{L}\defeq N_{L/K}(I_{L})K^{\times}/K^{\times}$ とする。
- 局所体の巡回拡大のエルブラン商（$\abs{\hat H^{0}(G_{w},L_{w}^{\times})}=n_{v}$, $\hat H^{1}=1$、不分岐なら $U_{w}$ のコホモロジーが消える、ノルム群は開部分群を含む）は \ref{nt:local-herbrand}。
- エルブラン商 $h$、その乗法性・有限加群で $1$・$h(\Z)=\abs G$・指数有限の部分加群で不変、巡回群の周期性 $\hat H^{0}\cong H^{2}$, $\hat H^{1}=H^{1}$ は \ref{ha:herbrand-quotient-properties}, \ref{ha:tate-cyclic}, \ref{ha:tate-low-degrees}。余誘導加群のコホモロジーは \ref{ha:shapiro-lemma}。
- 体系は $\ZFC$。
:::

## $S$ イデールのエルブラン商 {#nt:sec-fi-ideles}

::: proposition $S$ イデールのコホモロジー {#nt:herbrand-s-ideles keywords="for cyclic L/K and S containing the infinite and ramified places: H^q(G, I_L^S) is the product over v in S of H^q(G_w, L_w^x) for q = 1, 2; H^1 vanishes and h(I_L^S) = prod_{v in S} n_v" index="S イデールのエルブラン商|えすいでーるのえるぶらんしょう" refname="S イデールのコホモロジー"}
（AC）$S$ が $L/K$ で分岐するすべての有限素点を含むとし、$v$ ごとに $w_{v}\mid v$ を一つ固定する。$q=1,2$ について
$$
H^{q}(G,I_{L,\bar S})\cong\prod_{v\in S}H^{q}(G_{w_{v}},L_{w_{v}}^{\times}).
$$
特に $\hat H^{1}(G,I_{L,\bar S})=1$ で、$h(I_{L,\bar S})=\prod_{v\in S}n_{v}$。
:::

::: intuition
$S$ イデールのコホモロジーは素点ごとに分かれ、$S$ の外（不分岐）の素点では単数のコホモロジーが消える。残る $S$ の素点では、シャピロの補題で局所体のコホモロジーになり、それぞれ局所次数 $n_{v}$ を寄与する。
:::

::: proof
**Step 1（直積のコホモロジー）.** 【主張：$G$ 加群の族 $M_{i}$ について $H^{q}(G,\prod_{i}M_{i})=\prod_{i}H^{q}(G,M_{i})$（$q\ge1$）】非斉次コチェインの群は $\mathrm{Map}(G^{q},\prod_{i}M_{i})=\prod_{i}\mathrm{Map}(G^{q},M_{i})$ で、微分は成分ごとなので、コサイクルとコバウンダリもそれぞれの直積。

**Step 2（分解）.** 【主張：$I_{L,\bar S}=\prod_{v\in S}L_{v}^{\times}\times\prod_{v\notin S}U_{L,v}$（$G$ 加群として）】成分を $v$ ごとにまとめただけで、各因子は $G$ 部分加群（\ref{nt:idele-g-module} の 2）。

**Step 3（各因子）.** 【主張：$H^{q}(G,L_{v}^{\times})\cong H^{q}(G_{w},L_{w}^{\times})$、$v\notin S$ なら $H^{q}(G,U_{L,v})=0$】\ref{nt:idele-g-module} の 2 とシャピロの補題から $H^{q}(G,L_{v}^{\times})\cong H^{q}(G_{w},L_{w}^{\times})$、$H^{q}(G,U_{L,v})\cong H^{q}(G_{w},U_{w})$。$v\notin S$ は有限素点で $L_{w}/K_{v}$ は不分岐なので、\ref{nt:local-herbrand} の 3 と周期性から $H^{1}(G_{w},U_{w})=\hat H^{1}=1$, $H^{2}(G_{w},U_{w})\cong\hat H^{0}=1$。

**Step 4（エルブラン商）.** 【主張：$h(I_{L,\bar S})=\prod_{v\in S}n_{v}$】Step 1〜3 から $H^{q}(G,I_{L,\bar S})\cong\prod_{v\in S}H^{q}(G_{w},L_{w}^{\times})$。\ref{nt:local-herbrand} の 2・5（$n_{v}=1$ の素点では $G_{w}=1$ で自明）から $\abs{H^{1}(G_{w},L_{w}^{\times})}=1$, $\abs{H^{2}(G_{w},L_{w}^{\times})}=\abs{\hat H^{0}(G_{w},L_{w}^{\times})}=n_{v}$。周期性から $h(I_{L,\bar S})=\abs{H^{2}}/\abs{H^{1}}=\prod_{v\in S}n_{v}$。
:::

::: proposition 局所的なノルムとイデールのノルム {#nt:local-norms-idele-norm keywords="an idele of K which is a local norm at every place is the norm of an idele of L; I_K / N I_L is the direct sum of the local norm residue groups" index="局所的なノルム|きょくしょてきなのるむ" refname="局所的なノルムとイデールのノルム"}
（AC）$L/K$ を巡回拡大とする。$\alpha\in I_{K}$ がすべての素点 $v$ で $\alpha_{v}\in N_{L_{w}/K_{v}}(L_{w}^{\times})$ をみたすなら、$\alpha\in N_{L/K}(I_{L})$。
:::

::: intuition
イデールは成分ごとに独立に選べるので、「すべての素点で局所的にノルム」なら成分ごとにノルムの原像を選んで並べればよい。ほとんどすべての素点で単数の原像がとれる（不分岐）ことが、並べたものをイデールにする。
:::

::: proof
**Step 1（有限集合 $S$）.** $S$ を、無限素点、分岐する有限素点、$\alpha_{v}\notin U_{v}$ となる有限素点からなる有限集合とする（\ref{nt:places-galois-action} の 4）。

**Step 2（局所的な選択）.** 【主張：$v\notin S$ では単元 $\beta_{v}\in U_{w_{v}}$ で $N(\beta_{v})=\alpha_{v}$ となるものがとれる】$v\notin S$ では $L_{w}/K_{v}$ は不分岐で $\alpha_{v}\in U_{v}$、\ref{nt:local-herbrand} の 3 から $\hat H^{0}(G_{w},U_{w})=U_{v}/N(U_{w})=1$。$v\in S$ では仮定から $N(\beta_{v})=\alpha_{v}$ となる $\beta_{v}\in L_{w_{v}}^{\times}$ をとる。

**Step 3（イデール）.** $\beta\in I_{L}$ を、$w_{v}$ 成分が $\beta_{v}$、他の成分が $1$ のものとすると、ほとんどすべての成分が単元なのでイデールで、\ref{nt:idele-g-module} の 4 から $N_{L/K}(\beta)_{v}=\prod_{w\mid v}N(\beta_{w})=N(\beta_{v})=\alpha_{v}$。
:::

## $S$ 単数のエルブラン商 {#nt:sec-fi-units}

::: lemma 置換格子の補題 {#nt:permutation-lattice keywords="if a finite group G permutes a basis v_1, ..., v_s of a real vector space V and Gamma is a G-stable full lattice, then Gamma contains a full sublattice with a basis w_i permuted in the same way" index="置換格子の補題|ちかんこうしのほだい" refname="置換格子の補題"}
有限群 $G$ が $\mathbb{R}$ ベクトル空間 $V$ に線形に作用し、基底 $v_{1},\dots,v_{s}$ を置換する（$\sigma v_{i}=v_{\sigma(i)}$）とする。$\Gamma\subseteq V$ が $G$ で閉じた格子（$\mathbb{R}$ 基底をなす $s$ 個の元で生成される部分群）なら、$\Gamma$ の元 $w_{1},\dots,w_{s}$ で、一次独立かつすべての $\sigma$ で $\sigma w_{i}=w_{\sigma(i)}$ となるものがある。
:::

::: intuition
$G$ が基底を置換する空間の中の $G$ 不変な格子は、基底と同じ置換を受ける元からなる部分格子を含む。基底ベクトルの大きな倍数を格子で近似し、$G$ で平均すれば、近似の誤差より置換の構造が勝つ。
:::

::: proof
**Step 1（近似）.** 【主張：$b>0$ があって、各 $x\in V$ に $\norm{x-\gamma}<b$ となる $\gamma\in\Gamma$ がある】$\norm\cdot$ を基底 $v_{i}$ についての座標の最大値のノルムとする。$\Gamma$ の基底 $\gamma_{1},\dots,\gamma_{s}$ について、$x=\sum c_{k}\gamma_{k}$ に $\gamma=\sum\lfloor c_{k}\rfloor\gamma_{k}$ を対応させれば $\norm{x-\gamma}\le\sum\norm{\gamma_{k}}$。$b$ をこれより大きくとる。$G$ は座標を置換するので $\norm{\sigma x}=\norm x$。

**Step 2（構成）.** 【主張：$w_{i}\defeq\sum_{\sigma:\sigma(i_{0})=i}\sigma\gamma^{(i_{0})}$ は置換の規則をみたす】$\{1,\dots,s\}$ を $G$ 軌道に分け、各軌道から代表 $i_{0}$ を選ぶ。$t>0$（後で決める）について $\norm{tv_{i_{0}}-\gamma^{(i_{0})}}<b$ となる $\gamma^{(i_{0})}\in\Gamma$ をとり、$i$ を含む軌道の代表 $i_{0}$ について $w_{i}$ を上のように定める（和は空でない）。$\tau\in G$ について $\tau w_{i}=\sum_{\sigma(i_{0})=i}\tau\sigma\gamma^{(i_{0})}=\sum_{\rho(i_{0})=\tau(i)}\rho\gamma^{(i_{0})}=w_{\tau(i)}$。

**Step 3（一次独立）.** 【主張：$t>s\abs Gb$ なら $w_{i}$ は一次独立】$\gamma^{(i_{0})}=tv_{i_{0}}-y$（$\norm y<b$）と書くと、$\sigma(i_{0})=i$ のとき $\sigma\gamma^{(i_{0})}=tv_{i}-\sigma y$ なので $w_{i}=tn_{i}v_{i}-y_{i}$、ここで $n_{i}\ge1$ は和の項数、$\norm{y_{i}}\le\abs Gb$。$\sum c_{i}w_{i}=0$ で $c\neq0$ とし、$\max\abs{c_{i}}=\abs{c_{j}}=1$ と正規化すると、$t\sum c_{i}n_{i}v_{i}=\sum c_{i}y_{i}$。左辺の $v_{j}$ 座標の絶対値は $tn_{j}\ge t$、右辺のノルムは $\le s\abs Gb$ で、$t>s\abs Gb$ に矛盾。
:::

::: theorem $S$ 単数のエルブラン商 {#nt:herbrand-s-units keywords="for a cyclic extension L/K of degree n and S containing the infinite places, h(O_{L,S}^x) = (1/n) prod_{v in S} n_v; proof via the log embedding, the vector e_0, the permutation lattice lemma and Shapiro's lemma" index="S 単数のエルブラン商|えすたんすうのえるぶらんしょう" refname="S 単数のエルブラン商"}
（AC）$L/K$ を $n$ 次巡回拡大、$S\supseteq V_{\infty}$ を $K$ の素点の有限集合とすると
$$
h(\mathcal{O}_{L,\bar S}^{\times})=\frac1n\prod_{v\in S}n_{v}.
$$
:::

::: intuition
$S$ 単数は、対数をとると $\abs{\bar S}-1$ 次元の格子になり、$G$ は素点を置換することでその格子に作用する。格子のエルブラン商は「どの部分群が素点をどう置換するか」だけで決まり、各 $v$ の上の素点の置換は分解群 $G_{w}$ からの誘導なので $n_{v}$ を寄与する。超平面への制限で $1$ 次元分（自明な作用の $\mathbb{Z}$、寄与 $n$）が欠けるので $1/n$ が付く。
:::

::: proof
**Step 1（対数写像は $G$ 準同型）.** 【主張：$\lambda(x)\defeq\sum_{w\in\bar S}\log\abs x_{w}e_{w}\in V\defeq\mathbb{R}^{\bar S}$ について $\lambda(\sigma x)=\sigma\lambda(x)$、ただし $\sigma e_{w}\defeq e_{\sigma w}$】\ref{nt:places-galois-action} の 1 から $\abs{\sigma x}_{w}=\abs x_{\sigma^{-1}w}$ なので、$\lambda(\sigma x)=\sum_{w}\log\abs x_{\sigma^{-1}w}e_{w}=\sum_{u}\log\abs x_{u}e_{\sigma u}=\sigma\lambda(x)$。

**Step 2（$h(\mathcal{O}^{\times}_{L,\bar S})=h(\lambda(\mathcal{O}^{\times}_{L,\bar S}))$）.** \ref{nt:s-unit-theorem} から $\lambda$ の核は有限群 $\mu_{L}$ で、$h(\mu_{L})=1$。乗法性から従う（$\lambda(\mathcal{O}^{\times})$ のエルブラン商は以下で定義されることがわかる）。

**Step 3（全階数の格子 $\Gamma$）.** 【主張：$e_{0}\defeq\sum_{w}e_{w}$ について $\Gamma\defeq\mathbb{Z}e_{0}+\lambda(\mathcal{O}^{\times}_{L,\bar S})$ は $V$ の $G$ で閉じた格子で、$h(\Gamma)=n\cdot h(\lambda(\mathcal{O}^{\times}_{L,\bar S}))$】\ref{nt:s-unit-theorem} から $\lambda(\mathcal{O}^{\times})$ は超平面 $H=\{\sum y_{w}=0\}$ の格子で、$e_{0}\notin H$ なので $\Gamma=\mathbb{Z}e_{0}\oplus\lambda(\mathcal{O}^{\times})$ は $V$ の格子。$\sigma e_{0}=e_{0}$ なので $G$ で閉じていて、$0\to\mathbb{Z}e_{0}\to\Gamma\to\lambda(\mathcal{O}^{\times})\to0$ は完全（$\mathbb{Z}e_{0}\cong\mathbb{Z}$ は自明な作用）。乗法性と $h(\mathbb{Z})=n$ から、一方が定義されれば他方も定義され $h(\Gamma)=n\,h(\lambda(\mathcal{O}^{\times}))$。

**Step 4（置換格子への取り替え）.** 【主張：$h(\Gamma)=\prod_{v\in S}h(G,\Gamma'_{v})$、$\Gamma'_{v}\defeq\bigoplus_{w\mid v}\mathbb{Z}w_{w}$】\ref{nt:permutation-lattice}（基底 $e_{w}$）から $\Gamma'\defeq\bigoplus_{w\in\bar S}\mathbb{Z}w_{w}\subseteq\Gamma$, $\sigma w_{w}=w_{\sigma w}$ をとる。$\Gamma'$ は $\Gamma$ と同じ階数の部分群なので $\Gamma/\Gamma'$ は有限（有限生成アーベル群で階数 $0$）、\ref{ha:herbrand-quotient-properties} の 4 から $h(\Gamma)=h(\Gamma')$。$\Gamma'=\bigoplus_{v\in S}\Gamma'_{v}$ は $G$ 加群の直和で、乗法性から $h(\Gamma')=\prod_{v}h(\Gamma'_{v})$。

**Step 5（各因子）.** 【主張：$h(G,\Gamma'_{v})=n_{v}$】$G_{w}$ は $\mathbb{Z}w_{w}$ に自明に作用し、$\Gamma'_{v}=\bigoplus_{i}g_{i}\mathbb{Z}w_{w}$（$g_{i}$ は $G/G_{w}$ の代表）なので、\ref{nt:coinduced-criterion} とシャピロの補題から $H^{q}(G,\Gamma'_{v})\cong H^{q}(G_{w},\mathbb{Z})$。周期性から $h(G,\Gamma'_{v})=h(G_{w},\mathbb{Z})=\abs{G_{w}}=n_{v}$。

**Step 6（結論）.** Step 2〜5 から $h(\mathcal{O}^{\times}_{L,\bar S})=h(\Gamma)/n=\frac1n\prod_{v\in S}n_{v}$。
:::

::: example
$L=\mathbb{Q}(i)$, $K=\mathbb{Q}$, $S=\{\infty,2\}$ とする。$\bar S=\{\infty_{L},(1+i)\}$ で $\mathcal{O}^{\times}_{L,\bar S}=\mu_{4}\times(1+i)^{\mathbb{Z}}$、$n_{\infty}=n_{2}=2$ なので、定理は $h=2\cdot2/2=2$ を予言する。直接計算：$c$ を複素共役とすると $c(1+i)=1-i=-i(1+i)$。不変元は $\mathbb{Q}^{\times}\cap\mathcal{O}^{\times}_{L,\bar S}=\pm2^{\mathbb{Z}}$、ノルムの像は $N(\zeta(1+i)^{k})=2^{k}$ で $2^{\mathbb{Z}}$、よって $\hat H^{0}=\{\pm1\}$ で位数 $2$。$\ker N=\mu_{4}$ で、$c(1+i)/(1+i)=-i$ と $c(-i)/(-i)=-1$ から $(c-1)\mathcal{O}^{\times}\supseteq\mu_{4}$、よって $\hat H^{1}=1$。$h=2/1=2$ で一致する。
:::

## イデール類群のエルブラン商 {#nt:sec-fi-class}

::: theorem イデール類群のエルブラン商と第一不等式 {#nt:herbrand-idele-class keywords="for a cyclic extension L/K of degree n, h(C_L) = n; first inequality [C_K : N_{L/K} C_L] >= n; |H^0(G, C_L)| = n |H^1(G, C_L)|" index="第一不等式|だいいちふとうしき, イデール類群のエルブラン商|いでーるるいぐんのえるぶらんしょう" refname="第一不等式"}
（AC）$L/K$ を $n$ 次巡回拡大とすると $h(G,C_{L})=n$。特に
$$
[C_{K}:N_{L/K}C_{L}]=\abs{\hat H^{0}(G,C_{L})}=n\,\abs{\hat H^{1}(G,C_{L})}\ge n.
$$
:::

::: intuition
$C_{L}$ は「局所体の乗法群の制限直積」を「$L^{\times}$」で割ったもので、エルブラン商は掛け算的なので、局所の寄与 $\prod n_{v}$ を大域の寄与 $\prod n_{v}/n$ で割って $n$ が残る。局所の寄与と大域の寄与の素点ごとの因子 $n_{v}$ がきれいに打ち消し合うのが要点である。
:::

::: proof
**Step 1（$S$ の選び方）.** 【主張：$I_{L}=I_{L,\bar S}L^{\times}$ となる有限集合 $S$（無限素点・分岐素点を含む）がある】$\operatorname{Cl}_{L}$ は有限なので（\ref{nt:class-group-finite}）、各類から整イデアル $\mathfrak{a}_{1},\dots,\mathfrak{a}_{h}$ を選び、それらを割る素イデアルの下にある $K$ の素点を $S$ に加える。$a\in I_{L}$ について $(a)$（\ref{nt:ideles-ideals}）の類はある $\mathfrak{a}_{i}$ の類なので $(a)=\mathfrak{a}_{i}(x)$（$x\in L^{\times}$）。$ax^{-1}$ のイデアル $\mathfrak{a}_{i}$ は $\bar S$ の素イデアルだけで書けるので、$\bar S$ の外の成分は付値 $0$、すなわち単元で、$ax^{-1}\in I_{L,\bar S}$。

**Step 2（完全列）.** 【主張：$1\to\mathcal{O}^{\times}_{L,\bar S}\to I_{L,\bar S}\to C_{L}\to1$ は $G$ 加群の完全列】右の写像は商写像の制限で、Step 1 から全射、核は $I_{L,\bar S}\cap L^{\times}=\mathcal{O}^{\times}_{L,\bar S}$。$G$ 同変は \ref{nt:idele-g-module} の 1 から。

**Step 3（結論）.** \ref{nt:herbrand-s-ideles} と \ref{nt:herbrand-s-units} から両端のエルブラン商が定義されるので、乗法性から $h(C_{L})=h(I_{L,\bar S})/h(\mathcal{O}^{\times}_{L,\bar S})=\prod n_{v}\big/\bigl(\frac1n\prod n_{v}\bigr)=n$。最後に、\ref{nt:idele-g-module} の 3・4 から $C_{L}^{G}=C_{K}$ で、$N_{G}C_{L}$ はイデールのノルムの像 $N_{L/K}C_{L}$ なので $\hat H^{0}(G,C_{L})=C_{K}/N_{L/K}C_{L}$。
:::

## 応用：完全分解しない素点 {#nt:sec-fi-applications}

::: corollary 分解しない素点の無限性 {#nt:nonsplit-infinitely-many keywords="if L/K is cyclic of prime power degree p^nu > 1 then infinitely many places of K do not split in L" index="分解しない素点|ぶんかいしないそてん" refname="分解しない素点の無限性"}
（AC）$L/K$ が $p^{\nu}$ 次（$\nu\ge1$）の巡回拡大なら、$L$ で分解しない（$n_{v}=p^{\nu}$）$K$ の素点は無限に多い。
:::

::: intuition
巡回 $p$ 群の拡大で分解しない素点が有限個しかないとすると、$p$ 次の中間体ではほとんどすべての素点が完全分解し、イデールのノルムが全射になってしまう。第一不等式はノルムの剰余が少なくとも $p$ あると言うので矛盾する。
:::

::: proof
**Step 1（仮定と部分体）.** 分解しない素点が有限集合 $T$ だけだとする。$M$ を $L/K$ の $p$ 次の中間体、$H\defeq\operatorname{Gal}(L/M)$ とする。巡回 $p$ 群の部分群は一列に並ぶので、$G$ と異なる部分群はすべて $H$ に含まれる。

**Step 2（$T$ の外で $M$ は完全分解）.** 【主張：$v\notin T$, $w\mid v$, $w'\defeq w|_{M}$ について $M_{w'}=K_{v}$】$v\notin T$ なら $G_{w}\neq G$ なので $G_{w}\subseteq H$。$G_{w}=\operatorname{Gal}(L_{w}/K_{v})$ は $M$ を固定し、連続なので $M$ の閉包 $M_{w'}$ も固定する。よって $M_{w'}\subseteq L_{w}^{G_{w}}=K_{v}$。

**Step 3（ノルムの全射性）.** 【主張：$N_{M/K}C_{M}=C_{K}$】$\alpha\in I_{K}$ をとる。$v\in T$ について $N(M_{w'}^{\times})$ は $K_{v}^{\times}$ の開部分群を含む（\ref{nt:local-herbrand} の 4・5）ので、有限素点では $U_{v}^{(m_{v})}$ を、実素点では $\mathbb{R}_{>0}$ を含む（複素素点では全体）。\ref{nt:approximation-lemma} で、$v\in T$ の有限素点では $v(x-\alpha_{v})\ge v(\alpha_{v})+m_{v}$、実素点では $\operatorname{sgn}x=\operatorname{sgn}\alpha_{v}$ となる $x\in K^{\times}$ をとると、$v\in T$ で $\alpha_{v}x^{-1}\in N(M_{w'}^{\times})$。$v\notin T$ では $M_{w'}=K_{v}$ なので $N_{M_{w'}/K_{v}}$ は恒等写像で、$\alpha_{v}x^{-1}$ は自明にノルム。\ref{nt:local-norms-idele-norm}（$M/K$ に適用）から $\alpha x^{-1}\in N_{M/K}(I_{M})$、したがって $\alpha$ の類は $N_{M/K}C_{M}$ に入る。

**Step 4（矛盾）.** $M/K$ は $p$ 次巡回拡大なので、\ref{nt:herbrand-idele-class} から $[C_{K}:N_{M/K}C_{M}]\ge p>1$。Step 3 と矛盾。
:::

::: corollary ほとんどすべてが完全分解する拡大 {#nt:almost-all-split-trivial keywords="if almost all places of K split completely in a finite Galois extension L then L = K" index="完全分解とガロア拡大|かんぜんぶんかいとがろあかくだい" refname="ほとんどすべてが完全分解する拡大"}
（AC）$L/K$ を有限次ガロア拡大とする。有限個を除くすべての素点が $L$ で完全分解するなら $L=K$。
:::

::: intuition
拡大がどの素点でも（有限個を除いて）見えないなら、拡大そのものがない。ガロア群の素数位数の元に対応する巡回拡大に、前の系を当てはめる。
:::

::: proof
**Step 1（素数位数の元）.** $L\neq K$ とすると、\ref{grp:cauchy} から素数位数 $p$ の $\sigma\in G$ がある。$K'\defeq L^{\langle\sigma\rangle}$ とすると $L/K'$ は $p$ 次巡回拡大。

**Step 2（$K'$ の素点も完全分解）.** 【主張：$K$ の素点 $v$ が $L$ で完全分解すれば、その上の $K'$ の素点 $v'$ も $L$ で完全分解する】$w\mid v'$ について、$L/K'$ での分解群は $\{\tau\in\langle\sigma\rangle:\tau w=w\}=G_{w}\cap\langle\sigma\rangle$ で、$G_{w}=1$ なので自明。

**Step 3（矛盾）.** $K$ の各素点の上の $K'$ の素点は有限個なので、$K'$ の素点のうち完全分解しないものは有限個。$p$ 次の拡大で分解しない素点は完全分解しないので、分解しない素点は有限個となり、\ref{nt:nonsplit-infinitely-many}（$\nu=1$）に反する。
:::

::: hypcheck
- **$S$ イデールのコホモロジー**：$S$ が分岐素点を含むことは、$v\notin S$ で単数のコホモロジーが消えること（Step 3）に本質的。分岐素点を外すと $h(U_{w})=1$ でも $\hat H^{0}(G_{w},U_{w})\neq1$ になりうる。$G$ が巡回群であることはエルブラン商と周期性のために使った。
- **置換格子の補題**：$\Gamma$ が $V$ 全体を張る（全階数）ことは近似の定数 $b$ の存在に、$G$ が**有限**であることは $\norm{y_{i}}\le\abs Gb$ に使った。
- **$S$ 単数のエルブラン商**：$\lambda(\mathcal{O}^{\times})$ が超平面を張る格子であること（\ref{nt:s-unit-theorem}）が本質的で、これは類数の有限性と単数定理から来ている。
- **第一不等式**：類数の有限性は $S$ を有限にとる（Step 1）ために使った。
- **応用**：$p$ 冪次であることは「$G$ と異なる部分群がすべて $H$ に含まれる」（Step 1）ために本質的。$\mathbb{Z}/6$ のような巡回群では、各素点の分解群が $\mathbb{Z}/2$ か $\mathbb{Z}/3$ になる、ということは群論だけでは排除できない。実際、非巡回なガロア群では、分解しない素点は（分岐素点を除けば）存在しない：不分岐な素点の分解群は巡回群（フロベニウスで生成）だからである（Ne VI §3 の演習）。
:::

## 問題 {#nt:sec-fi-problems}

::: problem {#nt:prob-fi-three-mod-four}
$L=\mathbb{Q}(i)$, $K=\mathbb{Q}$ に \ref{nt:nonsplit-infinitely-many} を適用すると何がわかるか。またその結論を初等的に（ユークリッドの論法で）示せ。
:::

::: solution
$L/\mathbb{Q}$ は 2 次巡回拡大で、分解しない素点は $\infty$, $2$ と、$x^{2}+1$ が $\mathbb{F}_{p}$ で既約な $p$、すなわち $p\equiv3\pmod4$。よって $4$ を法として $3$ に合同な素数が無限に多い。初等的には：そのような素数が $p_{1},\dots,p_{k}$ だけなら、$N\defeq4p_{1}\cdots p_{k}-1\equiv3\pmod4$ の素因数がすべて $\equiv1\pmod4$ だと積も $\equiv1$ なので、$\equiv3$ の素因数 $q$ がある。$q\neq p_{i}$（$p_{i}\nmid N$）で矛盾。
:::

::: problem {#nt:prob-fi-s-ideles-gaussian}
$L=\mathbb{Q}(i)$, $K=\mathbb{Q}$, $S=\{\infty,2,5\}$ について $h(I_{L,\bar S})$ と $h(\mathcal{O}^{\times}_{L,\bar S})$ を求め、比が $2$ になることを確かめよ。
:::

::: solution
$n_{\infty}=2$, $n_{2}=2$, $n_{5}=1$（$5$ は完全分解）なので、\ref{nt:herbrand-s-ideles} から $h(I_{L,\bar S})=4$、\ref{nt:herbrand-s-units} から $h(\mathcal{O}^{\times}_{L,\bar S})=4/2=2$。比は $2=n$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 第一不等式の証明は、局所類体論も、ゼータ関数や $L$ 関数（解析的な道具）も使わない。使った大域的な入力は類数の有限性と（$S$）単数定理だけである。

**前提を変えると.**
- **第二不等式**：$L/K$ がアーベル拡大なら $[C_{K}:N_{L/K}C_{L}]\le n$（巡回拡大では $\hat H^{1}(G,C_{L})=1$ と同値）。歴史的にはディリクレ密度を使う解析的な証明（ウェーバー）が先で、代数的な証明はシュヴァレーによる。クンマー拡大に帰着して $S$ 単数の計算で示す（Ne VI §4）。ここでは証明しない。
- 第一・第二不等式を合わせると、巡回拡大で $\abs{\hat H^{0}(G,C_{L})}=n$, $\hat H^{1}=1$ となり、$C_{L}$ は**類構造**の公理（Ne IV §6）をみたす。抽象類体論から大域相互法則が従う（\ref[大域類体論]{nt:page-global-class-field-theory}）。
- **ハッセのノルム定理**：巡回拡大では、$K^{\times}$ の元が**元の**ノルムであることは、すべての素点で局所ノルムであることと同値である。\ref{nt:local-norms-idele-norm} はイデールについての類似で、元についての主張には $\hat H^{1}(G,C_{L})=1$（第二不等式）が要る。

**高い視点から：エルブラン商はオイラー標数.** エルブラン商は、巡回群のテイト・コホモロジーの「交代積」であり、短完全列で掛け算的、有限加群で $1$ という性質は、位相空間のオイラー標数が貼り合わせで加法的で、可縮な空間で $1$ になることに似ている。第一不等式の証明は「$C_{L}$ のオイラー標数を、局所の部分（$I_{L,\bar S}$）と大域の部分（$S$ 単数）に分けて計算する」ことで、各素点の寄与 $n_{v}$ は両方に現れて打ち消し合い、大域の部分の「$\mathbb{R}^{\bar S}$ の中の超平面」という 1 次元の欠損だけが $n=h(\mathbb{Z})$ として残る。比喩で言えば、$C_{L}$ は「局所の部屋を並べた建物から、大域的な柱 $L^{\times}$ を抜いたもの」で、柱を抜いた分の欠けがちょうど一部屋分 $n$ である。
:::
