# アデールと大域類体論（Adeles and Global Class Field Theory）

代数体の素点と積公式、アデール環とイデール群、イデール類群のコンパクト性と類群・単数群、巡回拡大でのイデール類群のエルブラン商（第一不等式）、大域類体論とヒルベルト類体。Neukirch・Cassels–Fröhlich に対応。

<p class="mn-msc">MSC2020: 11R37, 11R56</p>

## 前提知識

- [代数的整数論 › 局所体](../../../03-number-theory/01-algebraic-number-theory/02-local-fields/index.html)（全体、6 ページ）：絶対値と完備化・局所体・局所類体論
- [ホモロジー代数 › 群のコホモロジー](../../../02-algebra/06-homological-algebra/03-group-cohomology/index.html)（全体、6 ページ）：テイトのコホモロジー・エルブラン商・シャピロの補題
