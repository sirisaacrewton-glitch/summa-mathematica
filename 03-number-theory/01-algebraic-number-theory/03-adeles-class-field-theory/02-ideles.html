# イデールとイデール類群 {#nt:page-ideles keywords="idele group I_K = A_K^x, restricted product of K_v^x with respect to U_v, topology of the idele group, K^x is discrete in I_K, idele class group C_K = I_K / K^x, content (volume) map, norm one ideles I_K^1, ideles and fractional ideals, C_K maps onto the class group, compactness of C_K^1 from finiteness of the class number and Dirichlet's unit theorem, approximation theorem, modulus, ray class group Cl_K^m, C_K / C_K^m = Cl_K^m, idele class group of Q = Zhat^x x R_{>0}"}

アデール環の単元群が**イデール群** $I_{K}$ で、その $K^{\times}$ による商が**イデール類群** $C_{K}$ である。$C_{K}$ は大域類体論で局所体の乗法群 $K_{v}^{\times}$ の役割を果たす。このページでは、イデールとイデアルの関係から $C_{K}$ がイデアル類群 $\operatorname{Cl}_{K}$ を商にもつこと、類数の有限性とディリクレの単数定理を合わせると「体積 $1$ のイデール類」の群 $C_{K}^{1}$ がコンパクトになることを示し、射類群 $\operatorname{Cl}_{K}^{\mathfrak{m}}$ をイデール類群の商として表す。

## 記法と定義の確認 {#nt:sec-id-notation}

::: notation
- 素点 $v$、正規化された絶対値 $\abs\cdot_{v}$、完備化 $K_{v}$、有限素点での付値環 $\mathcal{O}_{v}$、アデール環 $\mathbb{A}_{K}$ とその位相は \ref{nt:places-number-field}, \ref{nt:normalized-absolute-value}, \ref{nt:adele-ring}, \ref{nt:adele-ring-topology}。積公式は \ref{nt:product-formula-number-field}。
- 有限素点 $v=\mathfrak{P}$ について $U_{v}\defeq\mathcal{O}_{v}^{\times}=\{\abs x_{v}=1\}$、$m\ge1$ について $U_{v}^{(m)}\defeq1+\mathfrak{P}^{m}\mathcal{O}_{v}$、$U_{v}^{(0)}\defeq U_{v}$。これらは $K_{v}^{\times}$ のコンパクトな開部分群（$\mathcal{O}_{v}$ の閉集合で、$\{\abs{x-1}_{v}<\abs{\pi}_{v}^{m-1}\}$ の形の開集合）。
- 分数イデアルの群 $J_{K}$、単項イデアルの群 $P_{K}$、イデアル類群 $\operatorname{Cl}_{K}=J_{K}/P_{K}$ とその有限性は \ref{nt:class-group-finite}。対数写像・単数定理は \ref{nt:log-embedding}, \ref{nt:dirichlet-unit-theorem}、離散部分群は \ref{nt:discrete-subgroup}。
- 剰余環と完備化の同型 $\mathcal{O}_{K}/\mathfrak{P}^{m}\cong\mathcal{O}_{v}/\mathfrak{P}^{m}\mathcal{O}_{v}$ は \ref{nt:residue-completion}、中国剰余定理は \ref{ring:chinese-remainder}。
- 体系は $\ZFC$（デデキント環の理論・類数の有限性・単数定理・チコノフの定理を通して）。
:::

## イデール群 {#nt:sec-id-ideles}

::: definition イデール群とイデール類群 {#nt:idele-group keywords="idele group I_K: (a_v) with a_v in K_v^x and a_v in U_v for almost all v; topology with basic open sets prod_{v in S} W_v x prod_{v not in S} U_v; diagonal K^x; idele class group C_K = I_K / K^x" index="イデール|いでーる, イデール群|いでーるぐん, イデール類群|いでーるるいぐん" refname="イデール群とイデール類群"}
$$
I_{K}\defeq\Bigl\{(a_{v})_{v}\in\prod_{v}K_{v}^{\times}:\text{有限個を除くすべての有限素点 }v\text{ で }a_{v}\in U_{v}\Bigr\}
$$
を**イデール群**、その元を**イデール**という。これは $\mathbb{A}_{K}$ の単元群 $\mathbb{A}_{K}^{\times}$ に等しい。有限集合 $S\supseteq V_{\infty}$ について $I_{K,S}\defeq\prod_{v\in S}K_{v}^{\times}\times\prod_{v\notin S}U_{v}$ とし、$\prod_{v\in S}W_{v}\times\prod_{v\notin S}U_{v}$（$W_{v}\subseteq K_{v}^{\times}$ 開）の形の集合を基本開集合として位相を入れる。$K^{\times}$ は対角的に $I_{K}$ の部分群になり、商群 $C_{K}\defeq I_{K}/K^{\times}$（商位相）を**イデール類群**という。
:::

::: intuition
アデールが単元であるとは、すべての成分が $0$ でなく、しかも逆元もアデールであること、すなわちほとんどすべての成分が $\mathcal{O}_{v}$ の単元であることである。イデールは「各素点での $0$ でない値の、ほとんどどこでも単数な組」で、イデアルの素因数分解の情報（有限素点での付値）と、無限素点での符号や大きさを同時にもつ。
:::

::: proposition イデール群の位相 {#nt:idele-group-topology keywords="I_K = A_K^x; I_{K,S} is open with the product topology; I_K is a locally compact Hausdorff topological group; K^x is a discrete subgroup; the idele topology is not the subspace topology from A_K" index="イデール群の位相|いでーるぐんのいそう" refname="イデール群の位相"}
1. $I_{K}=\mathbb{A}_{K}^{\times}$。
2. 基本開集合は位相の基底をなし、$I_{K,S}$ は開集合で相対位相は直積位相、$I_{K}$ はハウスドルフで局所コンパクトな位相群である。
3. $K^{\times}$ は $I_{K}$ の離散部分群である。
:::

::: intuition
イデール群はアデール環の単元群だが、位相はアデール環から借りずに「ほとんどすべての成分が単数」という箱で作り直す。こうしないと逆元をとる操作が連続にならない（下の注意）。
:::

::: proof
**Step 1（1）.** 【主張：アデール $a$ が単元 $\iff$ イデール】$ab=1$ なら各成分で $a_{v}b_{v}=1$ なので $a_{v}\neq0$。有限個を除く $v$ で $a_{v},b_{v}\in\mathcal{O}_{v}$ かつ $a_{v}b_{v}=1$ なので $a_{v}\in U_{v}$。逆にイデール $a$ について $(a_{v}^{-1})$ はほとんどすべての $v$ で $U_{v}\subseteq\mathcal{O}_{v}$ に入るのでアデールで、逆元。

**Step 2（2）.** 【主張：アデール環と同じ議論が通る】$U_{v}$ が $K_{v}^{\times}$ のコンパクトな開部分群であることを使えば、\ref{nt:adele-ring-topology} の Step 1〜5 で $K_{v},\mathcal{O}_{v}$ を $K_{v}^{\times},U_{v}$ に置き換えた議論がそのまま通る（局所コンパクト性では、$a_{v}\in K_{v}^{\times}$ のコンパクトな近傍として、$\mathbb{R}^{\times},\mathbb{C}^{\times}$ では $0$ を含まない閉円板、有限素点では $a_{v}U_{v}$ をとる）。位相群であること：$I_{K,S}$ 上で積と逆元は成分ごとの演算で直積位相について連続（$K_{v}^{\times}$ で逆元は連続）、値は $I_{K,S}$ に入り、$I_{K,S}$ は開。

**Step 3（3）.** 【主張：$1$ の近傍 $W$ で $W\cap K^{\times}=\{1\}$ となるものがある】$W\defeq\{a\in I_{K,V_{\infty}}:\abs{a_{v}-1}_{v}<1\ (v\mid\infty)\}$ は基本開集合（$\abs\cdot_{v}$ は無限素点では通常の絶対値かその 2 乗）。$x\in W\cap K^{\times}$ なら、すべての有限素点で $x\in U_{v}$ なので $x-1\in\mathcal{O}_{v}$、無限素点で $\abs{x-1}_{v}<1$。よって $x-1$ は \ref{nt:adeles-discrete-cocompact} の Step 3 の近傍 $U$ に入り $x-1=0$。平行移動（左からの積）は同相写像なので、$K^{\times}$ の各点は孤立点。
:::

::: remark
イデール群の位相は、$\mathbb{A}_{K}$ からの相対位相より真に強い。$K=\mathbb{Q}$ で、$e^{(p)}$ を $p$ 成分だけ $p$、他は $1$ のイデールとすると、$p\to\infty$ のとき $e^{(p)}\to1$ は $\mathbb{A}_{\mathbb{Q}}$ では成り立つ（$1$ の基本近傍 $\prod_{S}W_{v}\times\prod\mathcal{O}_{v}$ は $p\notin S$ で $e^{(p)}$ を含む）が、$I_{\mathbb{Q}}$ では成り立たない（近傍 $\prod_{v\in S}W_{v}\times\prod U_{v}$ は $p\notin S$ で $e^{(p)}$ を含まない）。$a\mapsto(a,a^{-1})$ で $I_{K}$ を $\mathbb{A}_{K}\times\mathbb{A}_{K}$ に埋めたときの相対位相が $I_{K}$ の位相に一致する（\ref[演習]{nt:sec-id-exercises}）。
:::

::: definition 体積写像 {#nt:idele-content keywords="content (volume) of an idele |a| = prod_v |a_v|_v; continuous surjective homomorphism I_K -> R_{>0}; K^x lies in the kernel I_K^1 by the product formula; C_K^1 = I_K^1 / K^x" index="体積写像（イデール）|たいせきしゃぞう, ノルム 1 のイデール|のるむいちのいでーる" refname="体積写像"}
イデール $a$ について $\abs a\defeq\prod_{v}\abs{a_{v}}_{v}$（有限積）を $a$ の**体積**という。$\abs\cdot:I_{K}\to\mathbb{R}_{>0}$ は連続な全射準同型で、その核を $I_{K}^{1}$、$C_{K}^{1}\defeq I_{K}^{1}/K^{\times}$ とおく。積公式から $K^{\times}\subseteq I_{K}^{1}$。
:::

::: intuition
$\abs{a_{v}}_{v}$ は $a_{v}$ 倍写像が $K_{v}$ の体積を何倍にするかだったので、$\abs a$ はアデール環全体の体積を何倍にするかである。積公式は「$K^{\times}$ の元を掛けても全体の体積は変わらない」ことを意味し、$K^{\times}$ は体積 $1$ の部分 $I_{K}^{1}$ に入る。
:::

::: proof
各 $I_{K,S}$ 上で $\abs a=\prod_{v\in S}\abs{a_{v}}_{v}$（$v\notin S$ の因子は $1$）は有限個の連続関数の積なので連続で、$I_{K,S}$ は開なので $\abs\cdot$ は連続。準同型であることは明らか。一つの無限素点 $v_{0}$ で $a_{v_{0}}=t>0$（複素なら $\sqrt t$）、他を $1$ とすると $\abs a=t$ なので全射。
:::

## イデールとイデアル {#nt:sec-id-ideals}

::: proposition イデールとイデアル {#nt:ideles-ideals keywords="the map I_K -> J_K, a -> prod P^{v_P(a_P)} is a continuous surjective homomorphism with kernel I_{K,infinity}^U = prod_{v | infinity} K_v^x x prod U_v; it maps K^x onto P_K; C_K / image of I^U is the class group Cl_K" index="イデールとイデアル|いでーるといである" refname="イデールとイデアル"}
$(a)\defeq\prod_{\mathfrak{P}}\mathfrak{P}^{v_{\mathfrak{P}}(a_{\mathfrak{P}})}$ で定まる $(\cdot):I_{K}\to J_{K}$ は全射準同型で、
1. 核は $I_{K}^{U}\defeq\prod_{v\mid\infty}K_{v}^{\times}\times\prod_{v\nmid\infty}U_{v}$（開部分群）。
2. $x\in K^{\times}$ の像は単項イデアル $x\mathcal{O}_{K}$ で、$(K^{\times})=P_{K}$。
3. $I_{K}/I_{K}^{U}K^{\times}\cong C_{K}/\overline{I_{K}^{U}}\cong\operatorname{Cl}_{K}$（$\overline{I_{K}^{U}}$ は $I_{K}^{U}$ の $C_{K}$ での像）。
:::

::: intuition
イデールから無限素点の成分と単数の情報を忘れると、各有限素点での付値だけが残り、それはイデアルの素因数分解そのものである。$K^{\times}$ の元は単項イデアルになるので、イデール類群からイデアル類群への全射が得られる。
:::

::: proof
**Step 1（well-defined と準同型）.** 有限個を除いて $a_{\mathfrak{P}}\in U_{\mathfrak{P}}$、すなわち $v_{\mathfrak{P}}(a_{\mathfrak{P}})=0$ なので積は有限積。$v_{\mathfrak{P}}$ の加法性から準同型。

**Step 2（全射と核）.** 【主張：$J_{K}$ の元はイデールの像で、像が $\mathcal{O}_{K}$ のイデールは $I_{K}^{U}$】$\mathfrak{a}=\prod\mathfrak{P}^{n_{\mathfrak{P}}}$ について、$\mathfrak{P}$ 成分を一意化元の冪 $\pi_{\mathfrak{P}}^{n_{\mathfrak{P}}}$、他を $1$ とすればよい。核はすべての有限素点で $v_{\mathfrak{P}}(a_{\mathfrak{P}})=0$、すなわち $a_{\mathfrak{P}}\in U_{\mathfrak{P}}$ となるイデール。$I_{K}^{U}=I_{K,V_{\infty}}$ は基本開集合。

**Step 3（2）.** $v_{\mathfrak{P}}(x)$ は $x\mathcal{O}_{K}$ の分解の指数そのものなので $(x)=x\mathcal{O}_{K}$。

**Step 4（3）.** 【主張：$I_{K}\to J_{K}\to\operatorname{Cl}_{K}$ の核は $I_{K}^{U}K^{\times}$】合成は全射で、$a$ が核に入る $\iff$ $(a)=(x)$ となる $x\in K^{\times}$ がある $\iff$ $ax^{-1}\in I_{K}^{U}$。準同型定理から $I_{K}/I_{K}^{U}K^{\times}\cong\operatorname{Cl}_{K}$ で、左辺は $C_{K}/\overline{I_{K}^{U}}$ と同じ群（第三同型定理）。
:::

::: theorem $C_{K}^{1}$ のコンパクト性 {#nt:idele-class-compact keywords="C_K^1 = I_K^1 / K^x is compact; proof from finiteness of the class number and Dirichlet's unit theorem; C_K = C_K^1 x R_{>0}" index="イデール類群のコンパクト性|いでーるるいぐんのこんぱくとせい" refname="C_K^1 のコンパクト性"}
（AC）$C_{K}^{1}$（$C_{K}$ の部分空間）はコンパクトである。さらに、一つの無限素点 $v_{0}$ をとり $t>0$ を $v_{0}$ 成分 $t^{1/[K_{v_{0}}:\mathbb{R}]}$・他の成分 $1$ のイデールに送ると、$C_{K}\cong C_{K}^{1}\times\mathbb{R}_{>0}$（位相群として）。
:::

::: intuition
$C_{K}^{1}$ は 2 つの有限性・コンパクト性の貼り合わせである：イデアルの側の「ずれ」は類群 $\operatorname{Cl}_{K}$（有限）で測られ、イデアルが同じイデールどうしの「ずれ」は、有限素点ではコンパクトな $\prod U_{v}$、無限素点では体積 $1$ の部分を単数群で割ったトーラス（単数定理）になる。どちらかが壊れれば $C_{K}^{1}$ はコンパクトでなくなる。
:::

::: proof
**Step 1（類群による分割）.** 【主張：$I_{K}^{1}=\bigcup_{i=1}^{h}c_{i}\,I_{K}^{U,1}K^{\times}$（$I_{K}^{U,1}\defeq I_{K}^{U}\cap I_{K}^{1}$、$c_{i}\in I_{K}^{1}$）】$h=h_{K}$ を類数とし、イデアル類の代表 $\mathfrak{a}_{1},\dots,\mathfrak{a}_{h}$ をとる。\ref{nt:ideles-ideals} の Step 2 で $(c_{i})=\mathfrak{a}_{i}$ となるイデールをとり、一つの無限成分を正の実数倍して $\abs{c_{i}}=1$ とする（無限成分は $(\cdot)$ に影響しない）。$a\in I_{K}^{1}$ について $(a)$ はある $\mathfrak{a}_{i}$ と同じ類なので、\ref{nt:ideles-ideals} の Step 4 から $a=c_{i}bx$（$b\in I_{K}^{U}$, $x\in K^{\times}$）。$\abs a=\abs{c_{i}}=\abs x=1$ から $\abs b=1$、すなわち $b\in I_{K}^{U,1}$。

**Step 2（無限成分の分解）.** 【主張：$I_{K}^{U,1}=\prod_{v\nmid\infty}U_{v}\times E^{1}$、$E^{1}\defeq\{(a_{v})\in\prod_{v\mid\infty}K_{v}^{\times}:\prod_{v\mid\infty}\abs{a_{v}}_{v}=1\}$】有限素点の成分は $\abs\cdot_{v}=1$ なので、体積の条件は無限成分だけにかかる。

**Step 3（単数による $E^{1}$ の被覆）.** 【主張：コンパクト集合 $B\subseteq E^{1}$ で $E^{1}=B\cdot\mathcal{O}_{K}^{\times}$ となるものがある】$s\defeq r_{1}+r_{2}$, $L:\prod_{v\mid\infty}K_{v}^{\times}\to\mathbb{R}^{s}$, $L(a)\defeq(\log\abs{a_{v}}_{v})_{v}$ とすると、$L(E^{1})$ は超平面 $H=\{\sum y_{v}=0\}$ に含まれる（実は等しい）。$L$ を $\mathcal{O}_{K}^{\times}$ に制限したものは \ref{nt:log-embedding} の対数写像 $\ell$ で、\ref{nt:dirichlet-unit-theorem} とその証明から $\ell(\mathcal{O}_{K}^{\times})\cong\mathbb{Z}^{r}$（$r=s-1$）は離散。\ref{nt:discrete-subgroup} から $\ell(\mathcal{O}_{K}^{\times})$ は一次独立な $r$ 個の元 $\gamma_{1},\dots,\gamma_{r}$ で生成され、$\dim H=r$ なのでそれらは $H$ の基底。$P\defeq\{\sum t_{i}\gamma_{i}:t_{i}\in[0,1]\}$ とし、$B\defeq E^{1}\cap L^{-1}(P)$ とおく。$a\in E^{1}$ について $L(a)=\sum c_{i}\gamma_{i}$ とし、$\ell(u)=\sum\lfloor c_{i}\rfloor\gamma_{i}$ となる単数 $u$ をとれば $L(au^{-1})\in P$ なので $a\in Bu$。$B$ は、各成分の絶対値が $[e^{-M},e^{M}]$（$M$ は $P$ の座標の最大値）に入る閉集合なので、$\mathbb{R}^{\times}$ や $\mathbb{C}^{\times}$ のコンパクトな円環の直積に含まれる閉集合で、コンパクト。

**Step 4（コンパクト集合の像）.** 【主張：$C_{K}^{1}$ はコンパクト集合 $D\defeq\bigcup_{i}c_{i}\bigl(\prod_{v\nmid\infty}U_{v}\times B\bigr)$ の像】$D$ はコンパクト（$\prod U_{v}$ はチコノフの定理でコンパクト、$I_{K,V_{\infty}}$ の直積位相は $I_{K}$ の相対位相、連続写像 $x\mapsto c_{i}x$ の像の有限和）。Step 1〜3 から $I_{K}^{1}=D\cdot K^{\times}$（単数 $u\in\mathcal{O}_{K}^{\times}$ は、有限成分が $U_{v}$ に入るので $\prod U_{v}\times B$ の元に掛けても形が保たれ、$u$ を $K^{\times}$ に吸収できる）。商写像 $I_{K}\to C_{K}$ は連続なので、$D$ の像 $=C_{K}^{1}$ はコンパクト。

**Step 5（$C_{K}\cong C_{K}^{1}\times\mathbb{R}_{>0}$）.** 【主張：分裂】$s(t)$ を定理の中のイデールとすると $\abs{s(t)}=t$（複素なら $\abs{t^{1/2}}^{2}$）で、$s:\mathbb{R}_{>0}\to I_{K}$ は連続準同型。$C_{K}\to C_{K}^{1}\times\mathbb{R}_{>0}$, $c\mapsto(c\,s(\abs c)^{-1},\abs c)$ は連続準同型で、逆写像 $(c',t)\mapsto c's(t)$ も連続（体積写像は $K^{\times}$ 上で $1$ なので $C_{K}$ 上で定義され連続）。
:::

::: theorem $S$ 単数定理 {#nt:s-unit-theorem keywords="S-units O_{K,S}^x for a finite set S of places containing the infinite places; O_{K,S}^x is isomorphic to mu_K x Z^{|S|-1}; the log map to R^S has image a lattice in the trace-zero hyperplane; proof from compactness of C_K^1" index="S 単数定理|えすたんすうていり, S 単数|えすたんすう" refname="S 単数定理"}
（AC）$S\supseteq V_{\infty}$ を素点の有限集合とし、$\mathcal{O}_{K,S}^{\times}\defeq\{x\in K^{\times}:\abs x_{v}=1\ (v\notin S)\}$（**$S$ 単数群**）とする。$L_{S}(x)\defeq(\log\abs x_{v})_{v\in S}\in\mathbb{R}^{S}$ とおくと、$L_{S}(\mathcal{O}_{K,S}^{\times})$ は超平面 $H_{S}\defeq\{\sum_{v\in S}y_{v}=0\}$ の格子（一次独立な $\abs S-1$ 個の元で生成）で、$\mathcal{O}_{K,S}^{\times}\cong\mu_{K}\times\mathbb{Z}^{\abs S-1}$。
:::

::: intuition
$S$ に有限素点 $\mathfrak{P}$ を加えるのは「$\mathfrak{P}$ で割ることを許す」ことで、$\mathbb{Z}$ なら $S=\{\infty,2\}$ の $S$ 単数は $\pm2^{k}$ である。単数定理（$S=V_{\infty}$）と同じく、$S$ 単数の大きさの対数は $\abs S-1$ 次元の格子をなす。証明では、$C_{K}^{1}$ のコンパクト性から「格子が超平面を張る」ことを取り出す。
:::

::: proof
**Step 1（離散性）.** 【主張：$\{x\in\mathcal{O}_{K,S}^{\times}:\abs{L_{S}(x)_{v}}\le1\ (v\in S)\}$ は有限集合】このような $x$ は、有限素点 $\mathfrak{P}\in S$ で $v_{\mathfrak{P}}(x)\ge-c_{\mathfrak{P}}$（$c_{\mathfrak{P}}$ は $N(\mathfrak{P})^{c}\le e$ をみたす最大の整数 $c$）、$\mathfrak{P}\notin S$ で $v_{\mathfrak{P}}(x)=0$ なので、分数イデアル $\mathfrak{b}\defeq\prod_{\mathfrak{P}\in S}\mathfrak{P}^{-c_{\mathfrak{P}}}$ に入る。また無限素点で $\abs x_{v}\le e$ なので $j(x)$ は有界集合に入る。$d\mathfrak{b}\subseteq\mathcal{O}_{K}$ となる $0\neq d\in\mathbb{Z}$ をとると $j(d\mathfrak{b})$ は格子（\ref{nt:minkowski-embedding}）なので、$j(\mathfrak{b})=d^{-1}j(d\mathfrak{b})$ も格子で、有界集合には有限個の点しかない。よって $\Gamma\defeq L_{S}(\mathcal{O}_{K,S}^{\times})$ は $\mathbb{R}^{S}$ の離散部分群で、\ref{nt:discrete-subgroup} から一次独立な元で生成される。積公式から $\Gamma\subseteq H_{S}$。

**Step 2（核）.** 【主張：$\ker L_{S}|_{\mathcal{O}_{K,S}^{\times}}=\mu_{K}$】核の元はすべての素点で $\abs x_{v}=1$ なので $\mathcal{O}_{K}^{\times}$ の元で、\ref{nt:log-embedding} の 2 から $\mu_{K}$。逆に 1 の冪根は明らかに核に入る。

**Step 3（$I_{K,S}^{1}$ の被覆）.** 【主張：コンパクト集合 $D'$ で $I_{K,S}^{1}\defeq I_{K,S}\cap I_{K}^{1}=D'\cdot\mathcal{O}_{K,S}^{\times}$ となるものがある】\ref{nt:idele-class-compact} の Step 4 から、コンパクト集合 $D$ で $I_{K}^{1}=DK^{\times}$ となるものがある。$I_{K,S}^{1}$ は $I_{K}^{1}$ の開部分群なので、$D$ は有限個の剰余類 $d_{1}I_{K,S}^{1},\dots,d_{k}I_{K,S}^{1}$ で覆われる。$K^{\times}\cap d_{i}^{-1}I_{K,S}^{1}$ が空でない $i$ についてその元 $x_{i}$ を一つ選ぶ。$a\in I_{K,S}^{1}$ を $a=dx$（$d\in D\cap d_{i}I_{K,S}^{1}$, $x\in K^{\times}$）と書くと $x=d^{-1}a\in d_{i}^{-1}I_{K,S}^{1}$ なので $x_{i}$ があり、$u\defeq xx_{i}^{-1}\in K^{\times}\cap I_{K,S}^{1}=\mathcal{O}_{K,S}^{\times}$。$a=(dx_{i})u$ で、$dx_{i}=au^{-1}\in Dx_{i}\cap I_{K,S}^{1}$。開部分群は閉なので $Dx_{i}\cap I_{K,S}^{1}$ はコンパクトで、$D'\defeq\bigcup_{i}(Dx_{i}\cap I_{K,S}^{1})$ とすればよい。

**Step 4（$\Gamma$ は $H_{S}$ を張る）.** 【主張：$\Gamma$ の張る部分空間 $W$ は $H_{S}$】$L_{S}$ を $I_{K,S}$ 上に $a\mapsto(\log\abs{a_{v}}_{v})_{v\in S}$ と延ばすと連続準同型で、$\Lambda\defeq L_{S}(I_{K,S}^{1})\subseteq H_{S}$ は $H_{S}$ を張る（$v_{0}\mid\infty$ を固定すると、$v\in S$ ごとに $e_{v}-e_{v_{0}}$ の $0$ でない実数倍が $\Lambda$ に入る：$v$ 成分を $\pi_{v}^{-1}$ または正の実数、$v_{0}$ 成分で体積を $1$ に戻す）。Step 3 から $\Lambda=L_{S}(D')+\Gamma$ で $L_{S}(D')$ はコンパクト。$W\neq H_{S}$ なら、射影 $q:H_{S}\to H_{S}/W\neq0$ で $q(\Lambda)=q(L_{S}(D'))$ は有界だが、$q(\Lambda)$ は $H_{S}/W$ を張る部分群で $0$ でない元 $y$ を含み、$ny$（$n\in\mathbb{Z}$）は有界でない。矛盾。

**Step 5（結論）.** 【主張：$\mathcal{O}_{K,S}^{\times}\cong\mu_{K}\times\mathbb{Z}^{\abs S-1}$】Step 1・4 から $\Gamma$ は $H_{S}$（次元 $\abs S-1$）の基底で生成され $\Gamma\cong\mathbb{Z}^{\abs S-1}$。Step 2 から $1\to\mu_{K}\to\mathcal{O}_{K,S}^{\times}\to\Gamma\to0$ は完全で、$\Gamma$ は自由なので分裂する（基底の逆像を選ぶ）。
:::

## 近似と射類群 {#nt:sec-id-ray}

::: lemma 近似補題 {#nt:approximation-lemma keywords="weak approximation: for finitely many finite places and prescribed signs at real places there is x in K close to given elements of K_v; density of K in prod_{v in S} K_v for finite S of finite places" index="近似定理（弱い形）|きんじていり" refname="近似補題"}
有限個の有限素点 $\mathfrak{P}_{1},\dots,\mathfrak{P}_{k}$、元 $b_{i}\in K_{\mathfrak{P}_{i}}$、整数 $m_{i}$、実素点の集合 $T$ と符号 $\varepsilon_{\rho}\in\{\pm1\}$（$\rho\in T$）が与えられると、$v_{\mathfrak{P}_{i}}(x-b_{i})\ge m_{i}$（すべての $i$）かつ $\operatorname{sgn}\rho(x)=\varepsilon_{\rho}$（すべての $\rho\in T$）となる $x\in K^{\times}$ がある。
:::

::: intuition
有限個の素点での「近さ」と、実素点での「符号」は、互いに独立に一つの元 $x\in K$ で同時に実現できる。有限素点の条件は中国剰余定理、符号は大きな整数倍を足すことで調整する。
:::

::: proof
**Step 1（有限素点だけの近似）.** 【主張：$v_{\mathfrak{P}_{i}}(x_{0}-b_{i})\ge m_{i}$ となる $x_{0}\in K$ がある】$m_{i}$ を大きくしてもよいので $m_{i}\ge0$ とする。$0\neq d\in\mathbb{Z}$ を $db_{i}\in\mathcal{O}_{\mathfrak{P}_{i}}$ となるようにとり、$n_{i}\defeq m_{i}+v_{\mathfrak{P}_{i}}(d)$ とする。\ref{nt:residue-completion} と中国剰余定理から、$v_{\mathfrak{P}_{i}}(db_{i}-y)\ge n_{i}$ となる $y\in\mathcal{O}_{K}$ があり、$x_{0}\defeq y/d$ とすればよい。

**Step 2（符号の調整）.** 【主張：$x=x_{0}+Nkw$ が求めるもの】$j(K)$ は $\mathbb{R}^{r_{1}}\times\mathbb{C}^{r_{2}}$ の基底 $j(\omega_{i})$ の $\mathbb{Q}$ 係数の結合全体なので稠密。よって $\operatorname{sgn}\rho(w)=\varepsilon_{\rho}$（$\rho\in T$）となる $w\in K$ があり、正の整数倍して $w\in\mathcal{O}_{K}$ としてよい。正の整数 $N$ を $v_{\mathfrak{P}_{i}}(N)\ge m_{i}$ となるようにとる（$p_{i}^{m_{i}}$ の積）。$k\in\mathbb{Z}_{>0}$ について $x\defeq x_{0}+Nkw$ は $v_{\mathfrak{P}_{i}}(x-x_{0})\ge m_{i}$ をみたし、$\rho(x)=\rho(x_{0})+Nk\rho(w)$ は $k$ が十分大きければ符号 $\varepsilon_{\rho}$ をもつ。$k$ をさらに大きくとれば $x\neq0$（$T=\emptyset$ のときも $x_{0}+Nkw=0$ となる $k$ は高々一つ）。
:::

::: definition 法と射類群 {#nt:ray-class-group keywords="modulus m = m_f m_infinity; J_K^m ideals prime to m; P_K^m principal ideals (x) with x = 1 mod* m; ray class group Cl_K^m = J_K^m / P_K^m; I_K^m = prod U_v^(m_v); C_K^m" index="法（モジュラス）|ほう, 射類群|しゃるいぐん, 合同類群|ごうどうるいぐん" refname="法と射類群"}
**法** $\mathfrak{m}$ とは、整イデアル $\mathfrak{m}_{f}=\prod\mathfrak{P}^{m_{\mathfrak{P}}}$ と実素点の集合 $\mathfrak{m}_{\infty}$ の組である。$v\mid\mathfrak{m}$ は $m_{\mathfrak{P}}\ge1$ または $v\in\mathfrak{m}_{\infty}$ を意味する。
1. $J_{K}^{\mathfrak{m}}$ は $\mathfrak{m}_{f}$ と素な（$v_{\mathfrak{P}}=0$, $\mathfrak{P}\mid\mathfrak{m}_{f}$）分数イデアルの群、$K^{\mathfrak{m},1}\defeq\{x\in K^{\times}:v_{\mathfrak{P}}(x-1)\ge m_{\mathfrak{P}}\ (\mathfrak{P}\mid\mathfrak{m}_{f}),\ \rho(x)>0\ (\rho\in\mathfrak{m}_{\infty})\}$（$x\equiv1\bmod^{\times}\mathfrak{m}$ と書く）、$P_{K}^{\mathfrak{m}}\defeq\{x\mathcal{O}_{K}:x\in K^{\mathfrak{m},1}\}$ とし、$\operatorname{Cl}_{K}^{\mathfrak{m}}\defeq J_{K}^{\mathfrak{m}}/P_{K}^{\mathfrak{m}}$ を**射類群**（法 $\mathfrak{m}$ の合同イデアル類群）という。
2. $I_{K}^{\mathfrak{m}}\defeq\prod_{v}U_{v}^{\mathfrak{m}}$、ここで有限素点では $U_{v}^{\mathfrak{m}}\defeq U_{v}^{(m_{\mathfrak{P}})}$、$v\in\mathfrak{m}_{\infty}$ では $\mathbb{R}_{>0}$、それ以外の無限素点では $K_{v}^{\times}$。$C_{K}^{\mathfrak{m}}\defeq I_{K}^{\mathfrak{m}}K^{\times}/K^{\times}$。
:::

::: intuition
射類群は、イデアル類群を「$\mathfrak{m}$ を法として $1$ に合同で、指定した実素点で正」という条件の単項イデアルだけで割ったもので、類群より細かい。$\mathbb{Q}$ で $\mathfrak{m}=(m)\infty$ なら $(\mathbb{Z}/m)^{\times}$ になる。
:::

::: theorem イデール類群と射類群 {#nt:ray-class-idele keywords="C_K / C_K^m is isomorphic to the ray class group Cl_K^m; C_K^m is open of finite index; Cl_K^m is finite; exact sequence to Cl_K" index="射類群とイデール類群|しゃるいぐんといでーるるいぐん" refname="イデール類群と射類群"}
（AC）$\mathfrak{m}$ を法とする。
1. $\mathfrak{a}\in J_{K}^{\mathfrak{m}}$ に、$\mathfrak{P}\nmid\mathfrak{m}_{f}$ の成分が $\pi_{\mathfrak{P}}^{v_{\mathfrak{P}}(\mathfrak{a})}$、$v\mid\mathfrak{m}$ と無限素点の成分が $1$ のイデール $\alpha_{\mathfrak{a}}$ の類を対応させると、同型 $\operatorname{Cl}_{K}^{\mathfrak{m}}\cong C_{K}/C_{K}^{\mathfrak{m}}$ が得られる（一意化元の取り方によらない）。
2. $\operatorname{Cl}_{K}^{\mathfrak{m}}$ は有限群で、$C_{K}^{\mathfrak{m}}$ は $C_{K}$ の指数有限な開部分群である。
:::

::: intuition
射類群は「$\mathfrak{m}$ を法として $1$ に合同な生成元をもつ単項イデアル」を自明とみなす、イデアル類群より細かい分類である。イデールで言えば、$\mathfrak{m}$ の素点で「$1$ に近い」ことを要求する開部分群 $I_{K}^{\mathfrak{m}}$ で割ることにあたる。$\mathfrak{m}=1$ なら $I_{K}^{\mathfrak{m}}=I_{K}^{U}$ で、\ref{nt:ideles-ideals} の 3 に戻る。
:::

::: proof
**Step 1（写像 $\phi:J_{K}^{\mathfrak{m}}\to C_{K}/C_{K}^{\mathfrak{m}}$）.** 【主張：well-defined な準同型】一意化元を取り替えると $\alpha_{\mathfrak{a}}$ は $\prod_{\mathfrak{P}\nmid\mathfrak{m}}U_{\mathfrak{P}}$ の元倍だけ変わり、それは $I_{K}^{\mathfrak{m}}$ に入る。準同型であることは明らか。

**Step 2（全射）.** 【主張：イデール $a$ の類は $\phi$ の像】\ref{nt:approximation-lemma} で、$\mathfrak{P}\mid\mathfrak{m}_{f}$ では $v_{\mathfrak{P}}(x-a_{\mathfrak{P}}^{-1})\ge m_{\mathfrak{P}}+v_{\mathfrak{P}}(a_{\mathfrak{P}}^{-1})$、$\rho\in\mathfrak{m}_{\infty}$ では $\operatorname{sgn}\rho(x)=\operatorname{sgn}a_{\rho}$ となる $x\in K^{\times}$ をとる。すると $\mathfrak{P}\mid\mathfrak{m}_{f}$ で $xa_{\mathfrak{P}}=1+(x-a_{\mathfrak{P}}^{-1})a_{\mathfrak{P}}\in U_{\mathfrak{P}}^{(m_{\mathfrak{P}})}$、$\rho\in\mathfrak{m}_{\infty}$ で $xa_{\rho}>0$。$b\defeq xa$ とし、$\beta$ を、$\mathfrak{P}\nmid\mathfrak{m}_{f}$ の成分が $\pi_{\mathfrak{P}}^{v_{\mathfrak{P}}(b_{\mathfrak{P}})}$、他の成分が $1$ のイデールとすると、$b\beta^{-1}$ は $\mathfrak{P}\nmid\mathfrak{m}_{f}$ で $U_{\mathfrak{P}}$、$v\mid\mathfrak{m}$ で $U_{v}^{\mathfrak{m}}$、他の無限素点で $K_{v}^{\times}$ に入るので $I_{K}^{\mathfrak{m}}$ の元。よって $a\equiv b\equiv\beta=\alpha_{(\beta)}$ で、$(\beta)\in J_{K}^{\mathfrak{m}}$。

**Step 3（核）.** 【主張：$\phi(\mathfrak{a})=1\iff\mathfrak{a}\in P_{K}^{\mathfrak{m}}$】$\phi(\mathfrak{a})=1$ なら $\alpha_{\mathfrak{a}}=\gamma x$（$\gamma\in I_{K}^{\mathfrak{m}}$, $x\in K^{\times}$）。$v\mid\mathfrak{m}$ で $1=\gamma_{v}x$ なので $x^{-1}=\gamma_{v}\in U_{v}^{\mathfrak{m}}$、すなわち $x^{-1}\in K^{\mathfrak{m},1}$。$\gamma$ の有限成分はすべて単元なので $(\gamma)=\mathcal{O}_{K}$ で、$\mathfrak{a}=(\alpha_{\mathfrak{a}})=(x)=x\mathcal{O}_{K}=(x^{-1}\mathcal{O}_{K})^{-1}\in P_{K}^{\mathfrak{m}}$。逆に $\mathfrak{a}=x\mathcal{O}_{K}$, $x\in K^{\mathfrak{m},1}$ なら $\alpha_{\mathfrak{a}}x^{-1}$ は、$v\mid\mathfrak{m}$ で $x^{-1}\in U_{v}^{\mathfrak{m}}$（群）、$\mathfrak{P}\nmid\mathfrak{m}_{f}$ で付値 $0$、他の無限素点で $K_{v}^{\times}$ に入るので $I_{K}^{\mathfrak{m}}$ の元で、$\phi(\mathfrak{a})=1$。

**Step 4（有限性）.** 【主張：$\operatorname{Cl}_{K}^{\mathfrak{m}}$ は有限】$\operatorname{Cl}_{K}^{\mathfrak{m}}\to\operatorname{Cl}_{K}$ の核は $(J_{K}^{\mathfrak{m}}\cap P_{K})/P_{K}^{\mathfrak{m}}$ で、$\operatorname{Cl}_{K}$ は有限なので核の有限性を示せばよい。$K_{\mathfrak{m}}\defeq\{x\in K^{\times}:v_{\mathfrak{P}}(x)=0\ (\mathfrak{P}\mid\mathfrak{m}_{f})\}$ から有限群 $\prod_{\mathfrak{P}\mid\mathfrak{m}_{f}}(\mathcal{O}_{\mathfrak{P}}/\mathfrak{P}^{m_{\mathfrak{P}}})^{\times}\times\{\pm1\}^{\mathfrak{m}_{\infty}}$ への準同型 $x\mapsto((x\bmod\mathfrak{P}^{m_{\mathfrak{P}}})_{\mathfrak{P}},(\operatorname{sgn}\rho(x))_{\rho})$ の核は $K^{\mathfrak{m},1}$。$x\mapsto x\mathcal{O}_{K}$ は $K_{\mathfrak{m}}$ から $J_{K}^{\mathfrak{m}}\cap P_{K}$ への全射（$x\mathcal{O}_{K}$ が $\mathfrak{m}_{f}$ と素なら $x\in K_{\mathfrak{m}}$）で、$K^{\mathfrak{m},1}$ を $P_{K}^{\mathfrak{m}}$ に送るので、核は $K_{\mathfrak{m}}/K^{\mathfrak{m},1}$ の商、したがって有限群の部分群の商で有限。

**Step 5（開・指数有限）.** $I_{K}^{\mathfrak{m}}$ は基本開集合を含む開部分群（各 $U_{v}^{\mathfrak{m}}$ が開で、ほとんどすべての成分が $U_{v}$）なので、$I_{K}^{\mathfrak{m}}K^{\times}=\bigcup_{x}I_{K}^{\mathfrak{m}}x$ も開で、商写像は開写像なので $C_{K}^{\mathfrak{m}}$ は開。指数は 1・4 から $\abs{\operatorname{Cl}_{K}^{\mathfrak{m}}}<\infty$。
:::

::: example
$K=\mathbb{Q}$ のイデール類群。$I_{\mathbb{Q}}=\mathbb{Q}^{\times}\times\bigl(\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times}\bigr)$（内部直積）、したがって $C_{\mathbb{Q}}\cong\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times}$（$\hat{\mathbb{Z}}^{\times}=\prod_{p}\mathbb{Z}_{p}^{\times}$）。実際、イデール $a$ に $x\defeq\operatorname{sgn}(a_{\infty})\prod_{p}p^{v_{p}(a_{p})}\in\mathbb{Q}^{\times}$（有限積）を対応させると $x^{-1}a\in\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times}$ で、$\mathbb{Q}^{\times}\cap(\mathbb{R}_{>0}\times\hat{\mathbb{Z}}^{\times})$ は「正ですべての $p$ で単元」の有理数なので $\{1\}$。法 $\mathfrak{m}=(m)\infty$ では $C_{\mathbb{Q}}^{\mathfrak{m}}$ は $\mathbb{R}_{>0}\times\prod_{p}U_{p}^{(v_{p}(m))}$ の像で、
$$
C_{\mathbb{Q}}/C_{\mathbb{Q}}^{\mathfrak{m}}\cong\hat{\mathbb{Z}}^{\times}\Big/\prod_{p}U_{p}^{(v_{p}(m))}\cong\prod_{p\mid m}(\mathbb{Z}_{p}/p^{v_{p}(m)})^{\times}\cong(\mathbb{Z}/m\mathbb{Z})^{\times}
$$
（最後は中国剰余定理と \ref{nt:residue-completion}）。\ref{nt:ray-class-idele} の同型と合成すると、素数 $\ell\nmid m$ のイデアル $(\ell)$ は $\ell^{-1}\bmod m$ に対応する：$\alpha_{(\ell)}$（$\ell$ 成分だけ $\ell$）を $x=\ell$ で割ると、$\ell$ 以外の $p$ 成分と実成分が $\ell^{-1}$ になるからである。この「逆元」は大域類体論で相互写像を書くときに現れる（\ref[大域類体論]{nt:page-global-class-field-theory}）。
:::

::: hypcheck
- **イデール群の位相**：$U_{v}$ が $K_{v}^{\times}$ の**コンパクトな開**部分群であること（剰余体の有限性）を、局所コンパクト性と離散性の両方に使った。
- **$C_{K}^{1}$ のコンパクト性**：類数の有限性（Step 1、有限個の $c_{i}$）と単数定理の「階数がちょうど $r$」（Step 3、$P$ が $H$ を張ること）が本質的。単数群の階数が $r$ より小さければ $E^{1}/\mathcal{O}_{K}^{\times}$ は非コンパクトな $\mathbb{R}$ 方向を残す。$C_{K}$ そのものは $\mathbb{R}_{>0}$ 成分のためにコンパクトでない。
- **$S$ 単数定理**：$C_{K}^{1}$ のコンパクト性（したがって類数の有限性と単数定理）を、格子が超平面を張ること（Step 4）に使った。$S=V_{\infty}$ のときは単数定理そのものなので、新しい内容は有限素点を加えた部分である。
- **近似補題**：有限素点では中国剰余定理、実素点では $j(K)$ の稠密性を使った。複素素点には条件をつけない（$\mathbb{C}^{\times}$ は連結で「符号」がない）。
- **射類群**：有限性には $\operatorname{Cl}_{K}$ の有限性を使った（AC）。
:::

## 問題 {#nt:sec-id-problems}

::: problem {#nt:prob-id-ray-gaussian}
$K=\mathbb{Q}(i)$、$\mathfrak{m}=(2)$（無限素点は複素なので $\mathfrak{m}_{\infty}=\emptyset$）とする。$\operatorname{Cl}_{K}^{\mathfrak{m}}$ の位数を求めよ（$\mathbb{Z}[i]$ は単項イデアル整域で、$\mathbb{Z}[i]^{\times}=\{\pm1,\pm i\}$）。
:::

::: solution
$\operatorname{Cl}_{K}=1$ なので、\ref{nt:ray-class-idele} の Step 4 の議論から $\operatorname{Cl}_{K}^{\mathfrak{m}}=(J^{\mathfrak{m}}\cap P)/P^{\mathfrak{m}}\cong K_{\mathfrak{m}}/K^{\mathfrak{m},1}\mathcal{O}_{K}^{\times}$。$2=-i(1+i)^{2}$ なので $\mathfrak{m}_{f}=\mathfrak{P}^{2}$, $\mathfrak{P}=(1+i)$。$K_{\mathfrak{m}}/K^{\mathfrak{m},1}\cong(\mathbb{Z}[i]/(2))^{\times}$（\ref{nt:approximation-lemma} から全射）で、$\mathbb{Z}[i]/(2)=\{0,1,i,1+i\}$ の単元は $1,i$ の 2 個。単数 $i$ の像は $i\neq1$ なので、単数の像が全体を覆い、$\operatorname{Cl}_{K}^{\mathfrak{m}}=1$。
:::

::: problem {#nt:prob-id-not-compact}
$C_{K}$ はコンパクトでないこと、また $I_{K}^{1}$ は $I_{K}$ の閉部分群であることを示せ。
:::

::: solution
\ref{nt:idele-content} の $\abs\cdot$ は $K^{\times}$ 上で $1$ なので、連続な全射 $C_{K}\to\mathbb{R}_{>0}$ を誘導する。$C_{K}$ がコンパクトなら像 $\mathbb{R}_{>0}$ もコンパクトになり矛盾。$I_{K}^{1}$ は連続写像 $\abs\cdot$ による閉集合 $\{1\}$ の逆像なので閉。
:::

::: supplement
**使わなかった前提・本質的でない前提.** イデール群の位相と $K^{\times}$ の離散性には、類数の有限性も単数定理も使わない。$C_{K}^{1}$ のコンパクト性で初めて両方を使う。

**前提を変えると.**
- **逆向きの流儀**：$C_{K}^{1}$ のコンパクト性を、アデールの体積（ハール測度）に対するミンコフスキーの定理の類似で先に示し、そこから類数の有限性と単数定理を**導く**流儀もある（CF II の流儀）。$C_{K}^{1}\to\operatorname{Cl}_{K}$ が連続な全射で $\operatorname{Cl}_{K}$ が離散なら像は有限、核から単数群の余コンパクト性が出る。
- **大域類体論**：$C_{K}$ の指数有限な開部分群は、法 $\mathfrak{m}$ を適当にとると $C_{K}^{\mathfrak{m}}$ を含む（\ref{nt:ray-class-idele} の逆。$C_{K}^{\mathfrak{m}}$ の形の開部分群が $1$ の基本近傍系をなす（実素点では $\mathbb{R}_{>0}$ が最小の開部分群）ことから従う）。したがって存在定理は「射類群の商と有限次アーベル拡大の対応」とも言い換えられる（\ref[大域類体論]{nt:page-global-class-field-theory}）。

**高い視点から：イデールは「局所から大域へ」の帳簿.** 完全列 $1\to I_{K}^{U}\to I_{K}\to J_{K}\to1$ をみると、イデアル群 $J_{K}$ は「無限素点と単数の情報を忘れたイデール」である。$K^{\times}$ で割った $C_{K}$ の中で、イデアル類群は $\prod U_{v}\times\prod K_{v}^{\times}$ の像による商として、単数群は $K^{\times}\cap I_{K}^{U}$ として同時に現れる：類数と単数基準という 2 つの数論的不変量が、一つの位相群 $C_{K}^{1}$ の「大きさ」（ハール測度での体積）に溶け合っている。これは実際、デデキントゼータ関数の留数（類数公式、\ref{nt:page-class-number-formula}）がテイトの学位論文で $C_{K}^{1}$ の体積として現れる理由である。
:::
