# 演習：アデールと大域類体論 {#nt:page-exercises-adeles-cft keywords="exercises, adeles, solenoid, density of Z in Zhat, idele topology, ray class groups of Q, decomposition of places in quadratic fields, local norms, Herbrand quotient, H^1 of the idele class group, reciprocity map for cyclotomic fields, maximal real subfield as a ray class field"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#nt:sec-exadeles-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$\hat{\mathbb{Z}}=\prod_{p}\mathbb{Z}_{p}$。
:::

## 素点とアデール {#nt:sec-pl-exercises}

対応するページ：\ref{nt:page-places-adeles}

::: problem ★ 基本：$\hat{\mathbb{Z}}$ の中の $\mathbb{Z}$ {#nt:ex-pl-z-dense}
$\mathbb{Z}$（対角的に埋め込む）は $\hat{\mathbb{Z}}$（直積位相）で稠密であることを示せ。これから、無限素点を除いた有限アデール環 $\mathbb{A}_{\mathbb{Q},f}$ の中で $\mathbb{Q}$ が離散でないことを導け。
:::

::: solution
$\hat{\mathbb{Z}}$ の基本開集合は、有限集合 $T$ と $a_{p}\in\mathbb{Z}_{p}$, $k_{p}\ge1$ について $\{b:b_{p}\in a_{p}+p^{k_{p}}\mathbb{Z}_{p}\ (p\in T)\}$ の形を含む。$\mathbb{Z}_{p}/p^{k}\mathbb{Z}_{p}\cong\mathbb{Z}/p^{k}$（\ref{nt:residue-completion}）なので $a_{p}\equiv c_{p}\pmod{p^{k_{p}}}$ となる $c_{p}\in\mathbb{Z}$ があり、中国剰余定理で $c\equiv c_{p}\pmod{p^{k_{p}}}$（$p\in T$）となる $c\in\mathbb{Z}$ をとれば $c$ はその開集合に入る。有限アデール環で $0$ の近傍は $\prod_{p\in T}p^{k_{p}}\mathbb{Z}_{p}\times\prod_{p\notin T}\mathbb{Z}_{p}$ の形を含み、稠密性から $0$ でない整数 $N=\prod_{p\in T}p^{k_{p}}$ がそこに入る。よって $0$ は孤立点でない。
:::

::: problem ★★★ 発展：ソレノイド {#nt:ex-pl-solenoid}
$\mathbb{A}_{\mathbb{Q}}/\mathbb{Q}\cong(\mathbb{R}\times\hat{\mathbb{Z}})/\mathbb{Z}$（$\mathbb{Z}$ は対角的）を示し、さらに $(r,z)\mapsto(r-z_{n}\bmod n)_{n\ge1}$（$z_{n}$ は $z$ の $\hat{\mathbb{Z}}/n\hat{\mathbb{Z}}\cong\mathbb{Z}/n$ での像の代表）が、$(\mathbb{R}\times\hat{\mathbb{Z}})/\mathbb{Z}$ から逆極限 $\varprojlim_{n}\mathbb{R}/n\mathbb{Z}$（$n\mid n'$ のとき $\mathbb{R}/n'\mathbb{Z}\to\mathbb{R}/n\mathbb{Z}$）への群の同型を与えることを示せ。
:::

::: solution
**前半.** \ref{nt:adeles-discrete-cocompact} の 1 から $\mathbb{A}_{\mathbb{Q}}=\mathbb{Q}+(\mathbb{R}\times\hat{\mathbb{Z}})$ で $\mathbb{Q}\cap(\mathbb{R}\times\hat{\mathbb{Z}})=\mathbb{Z}$。よって包含 $\mathbb{R}\times\hat{\mathbb{Z}}\to\mathbb{A}_{\mathbb{Q}}\to\mathbb{A}_{\mathbb{Q}}/\mathbb{Q}$ は全射で核は $\mathbb{Z}$（群として同型。位相についても、$\mathbb{R}\times\hat{\mathbb{Z}}$ が開部分群であることから同相になる）。

**後半.** $\mathbb{R}/n\mathbb{Z}$ で $r-z_{n}$ は代表の取り方によらない（代表は $n$ の倍数だけずれる）。$n\mid n'$ なら $z_{n'}\equiv z_{n}\pmod n$ なので両立し、準同型 $\Phi:\mathbb{R}\times\hat{\mathbb{Z}}\to\varprojlim\mathbb{R}/n\mathbb{Z}$ を得る。$k\in\mathbb{Z}$ の像は $k-k=0$ なので $\mathbb{Z}$ を殺す。核：$\Phi(r,z)=0$ なら $n=1$ で $r\in\mathbb{Z}$、すべての $n$ で $z_{n}\equiv r\pmod n$ なので $z=r$（$\hat{\mathbb{Z}}=\varprojlim\mathbb{Z}/n$）、すなわち $(r,z)\in\mathbb{Z}$。全射：$(x_{n})\in\varprojlim\mathbb{R}/n\mathbb{Z}$ について、$x_{1}$ の代表 $r\in\mathbb{R}$ を固定すると、$x_{n}$ の代表 $r_{n}$ で $r_{n}\equiv r\pmod1$ となるものは $r-r_{n}\in\mathbb{Z}$ が $\bmod n$ で決まり、両立系をなすので $z\in\hat{\mathbb{Z}}$ を定め、$\Phi(r,z)=(x_{n})$。
:::

## イデールとイデール類群 {#nt:sec-id-exercises}

対応するページ：\ref{nt:page-ideles}

::: problem ★★ 標準：イデールの位相と $(a,a^{-1})$ {#nt:ex-id-topology}
$j:I_{K}\to\mathbb{A}_{K}\times\mathbb{A}_{K}$, $a\mapsto(a,a^{-1})$ について、$I_{K}$ の位相は $j$ による相対位相に一致することを示せ。
:::

::: solution
**相対位相の開集合は開.** 積と逆元は $I_{K}$ の位相で連続で、$I_{K}\to\mathbb{A}_{K}$ も連続（$I_{K}$ の基本開集合の $1$ の近傍 $\prod_{S}W_{v}\times\prod U_{v}$ は $\mathbb{A}_{K}$ の基本開集合 $\prod_{S}W_{v}\times\prod\mathcal{O}_{v}$ に含まれる。平行移動で一般の点でも）。よって $j$ は連続。

**$I_{K}$ の開集合は相対開.** $1$ の基本近傍 $B=\prod_{v\in S}W_{v}\times\prod_{v\notin S}U_{v}$ について、$W'_{v}\subseteq W_{v}$ を $1$ の近傍で $x\in W'_{v}\Rightarrow x^{-1}\in W_{v}$ となるものにとり、$\mathbb{A}_{K}$ の開集合 $A\defeq\prod_{S}W'_{v}\times\prod_{v\notin S}\mathcal{O}_{v}$ を考えると $j^{-1}(A\times A)=\{a:a,a^{-1}\in A\}\subseteq B$：$v\notin S$ で $a_{v},a_{v}^{-1}\in\mathcal{O}_{v}$ なら $a_{v}\in U_{v}$。また $j^{-1}(A\times A)\ni1$。積による平行移動は両方の位相で同相なので、$I_{K}$ の位相の各点の近傍は相対位相の近傍を含む。
:::

::: problem ★ 基本：$\mathbb{Q}$ の射類群 {#nt:ex-id-ray-q}
$\mathbb{Q}$ の法 $\mathfrak{m}=(m)$（無限素点を含まない）について、$\operatorname{Cl}_{\mathbb{Q}}^{\mathfrak{m}}\cong(\mathbb{Z}/m)^{\times}/\{\pm1\}$ を示せ。
:::

::: solution
$h_{\mathbb{Q}}=1$ なので、\ref{nt:ray-class-idele} の Step 4 と同じく $\operatorname{Cl}^{\mathfrak{m}}\cong K_{\mathfrak{m}}/K^{\mathfrak{m},1}\mathbb{Z}^{\times}$。$K_{\mathfrak{m}}=\{a/b:(ab,m)=1\}$ から $(\mathbb{Z}/m)^{\times}$ への $a/b\mapsto ab^{-1}$ は全射（$m$ と素な整数 $a$ で）で核は $K^{\mathfrak{m},1}=\{x\equiv1\bmod m\}$（無限素点の条件なし）。単数 $\pm1$ の像は $\{\pm1\}$。よって $(\mathbb{Z}/m)^{\times}/\{\pm1\}$。$\mathfrak{m}=(m)\infty$ では符号の条件が加わり $-1\notin K^{\mathfrak{m},1}$ なので、$\pm1$ で割らず $(\mathbb{Z}/m)^{\times}$ になる（\ref{nt:ray-class-idele} の例）。
:::

## ガロア拡大のイデールと局所コホモロジー {#nt:sec-gi-exercises}

対応するページ：\ref{nt:page-galois-ideles}

::: problem ★ 基本：$\mathbb{Q}(\sqrt2)$ の局所次数 {#nt:ex-gi-sqrt2}
$L=\mathbb{Q}(\sqrt2)$, $K=\mathbb{Q}$ について、$v=\infty,2,3,7$ の $n_{v}$ と、$v$ の上の素点の個数を求めよ。
:::

::: solution
$\infty$：実埋め込みが 2 つで $L_{w}=\mathbb{R}$、$n_{\infty}=1$、素点 2 つ。$2=(\sqrt2)^{2}$ は分岐、$n_{2}=2$、素点一つ。$3$：$x^{2}-2$ は $\mathbb{F}_{3}$ で既約（平方は $0,1$）なので惰性、$n_{3}=2$、素点一つ。$7$：$3^{2}=9\equiv2$ なので $x^{2}-2$ は $\mathbb{F}_{7}$ で相異なる根をもち完全分解、$n_{7}=1$、素点 2 つ。
:::

::: problem ★★ 標準：$\mathbb{Q}_{3}(\sqrt3)$ のノルム剰余 {#nt:ex-gi-q3-sqrt3}
$L=\mathbb{Q}_{3}(\sqrt3)$, $K=\mathbb{Q}_{3}$ について、$-1\notin N_{L/K}(L^{\times})$ を示し、$K^{\times}/N(L^{\times})$ が $-1$ の類で生成されることを示せ。
:::

::: solution
$N(x+y\sqrt3)=x^{2}-3y^{2}$。$x^{2}-3y^{2}=-1$ とする。$x,y\in\mathbb{Z}_{3}$ なら $x^{2}\equiv-1\pmod3$ となり、平方は $\bmod3$ で $0,1$ なので矛盾。そうでなければ $m\defeq\min(v_{3}(x),v_{3}(y))<0$、$X=3^{-m}x$, $Y=3^{-m}y$ は一方が単元で $X^{2}-3Y^{2}=-9^{-m}\equiv0\pmod9$。$\bmod3$ で $X\equiv0$ なので $Y$ は単元で、$X=3X'$ とすると $9X'^{2}-3Y^{2}\equiv-3Y^{2}\not\equiv0\pmod9$ となり矛盾。\ref{nt:local-herbrand} の 2 から指数は $2$ なので、$-1$ の類が生成する。
:::

## イデール類群のエルブラン商と第一不等式 {#nt:sec-fi-exercises}

対応するページ：\ref{nt:page-first-inequality}

::: problem ★★ 標準：$\hat H^{1}(G,C_{L})$ と $S$ 単数 {#nt:ex-fi-h1-sunits}
$L/K$ を巡回拡大、$S$ を \ref{nt:herbrand-idele-class} の Step 1 の集合とする。$\hat H^{1}(G,C_{L})$ は、写像 $\hat H^{0}(G,\mathcal{O}^{\times}_{L,\bar S})\to\hat H^{0}(G,I_{L,\bar S})$ の核と同型であることを示せ。言い換えると、$\hat H^{1}(G,C_{L})=1$ は「$K$ の $S$ 単数で、$S$ のすべての素点で局所ノルムであるものは、$L$ の $S$ 単数のノルム」と同値である。
:::

::: solution
完全列 $1\to\mathcal{O}^{\times}_{L,\bar S}\to I_{L,\bar S}\to C_{L}\to1$ の六角形（\ref{ha:tate-cyclic} の 2）の一部 $\hat H^{1}(I_{L,\bar S})\to\hat H^{1}(C_{L})\to\hat H^{0}(\mathcal{O}^{\times})\to\hat H^{0}(I_{L,\bar S})$ で、\ref{nt:herbrand-s-ideles} から左端は $1$。よって $\hat H^{1}(C_{L})$ は右の写像の核と同型。$\hat H^{0}(\mathcal{O}^{\times})=\mathcal{O}^{\times}_{K,S}/N(\mathcal{O}^{\times}_{L,\bar S})$、$\hat H^{0}(I_{L,\bar S})=\prod_{v\in S}K_{v}^{\times}/N(L_{w}^{\times})\times\prod_{v\notin S}U_{v}/N(U_{w})$（後者は自明）なので、核は「$S$ のすべての素点で局所ノルムの $S$ 単数」をノルムの像で割ったもの。
:::

::: problem ★ 基本：$\mathbb{Q}(i)/\mathbb{Q}$ での確認 {#nt:ex-fi-gaussian-h1}
$L=\mathbb{Q}(i)$, $K=\mathbb{Q}$, $S=\{\infty,2\}$ について、上の問題の核が自明であることを確かめ、$\hat H^{1}(G,C_{L})=1$, $[C_{\mathbb{Q}}:N C_{L}]=2$ を結論せよ（$\mathbb{Z}[i]$ は単項イデアル整域なので、$S$ は Step 1 の条件をみたす）。
:::

::: solution
\ref{nt:herbrand-s-units} の例から $\hat H^{0}(\mathcal{O}^{\times}_{L,\bar S})=\pm2^{\mathbb{Z}}/2^{\mathbb{Z}}$ で、代表は $-1$。$-1$ は $\infty$ で局所ノルムでない（$N(\mathbb{C}^{\times})=\mathbb{R}_{>0}$）ので、$\hat H^{0}(I_{L,\bar S})$ での像は自明でなく、核は自明。よって $\hat H^{1}(C_{L})=1$ で、\ref{nt:herbrand-idele-class} から $\abs{\hat H^{0}(C_{L})}=2\cdot1=2$。
:::

## 大域類体論 {#nt:sec-gcft-exercises}

対応するページ：\ref{nt:page-global-class-field-theory}

::: problem ★ 基本：無限素点での相互写像 {#nt:ex-gcft-infinity}
$\infty$ 成分だけが $-1$ で他の成分が $1$ のイデール $a$ について $\psi_{m}(a)$ を求め、局所との両立（\ref{nt:global-class-field-theory} の 2）と整合することを確かめよ。
:::

::: solution
$x=\operatorname{sgn}(a_{\infty})=-1$ で、$x^{-1}a$ は $\infty$ 成分 $1$、すべての $p$ 成分 $-1$。$u\bmod m=-1$ なので $\psi_{m}(a)=\sigma_{-1}$、すなわち複素共役。局所的には $\omega_{\mathbb{C}/\mathbb{R}}(-1)$ は複素共役で、$\infty$ の分解群 $\operatorname{Gal}(\mathbb{C}/\mathbb{R})$ は $\mathbb{Q}(\zeta_{m})$ では複素共役で生成される（$m\ge3$）。一致する。
:::

::: problem ★★ 標準：最大実部分体は射類体 {#nt:ex-gcft-real-subfield}
\ref{nt:global-class-field-theory} を認める。$m\ge3$ について、$\mathbb{Q}$ の法 $(m)$（無限素点を含まない）の射類体は $\mathbb{Q}(\zeta_{m})^{+}\defeq\mathbb{Q}(\zeta_{m}+\zeta_{m}^{-1})$ であることを示せ。
:::

::: solution
$C_{\mathbb{Q}}^{(m)}\supseteq C_{\mathbb{Q}}^{(m)\infty}$ なので、法 $(m)$ の類体 $K_{(m)}$ は \ref{nt:ray-class-field} の 3 と \ref{nt:cyclotomic-reciprocity} の 4 から $\mathbb{Q}(\zeta_{m})$ に含まれ、ガロア理論で $\operatorname{Gal}(\mathbb{Q}(\zeta_{m})/K_{(m)})=\psi_{m}(C_{\mathbb{Q}}^{(m)})$（関手性から $\psi_{K_{(m)}/\mathbb{Q}}$ は $\psi_{m}$ の $K_{(m)}$ への制限で、その核が $C_{\mathbb{Q}}^{(m)}$ なので、$\psi_{m}$ の全射性から $K_{(m)}$ を固定する元はちょうど $\psi_{m}(C_{\mathbb{Q}}^{(m)})$）。$I_{\mathbb{Q}}^{(m)}=\mathbb{R}^{\times}\times\prod_{p}U_{p}^{(v_{p}(m))}$ は $I^{(m)\infty}$ と $\infty$ 成分 $-1$ のイデールで生成され、前者の像は自明、後者の像は前の問題から $\sigma_{-1}$。よって $\operatorname{Gal}(\mathbb{Q}(\zeta_{m})/K_{(m)})=\{1,\sigma_{-1}\}$ で、固定体は複素共役で動かない元のなす $\mathbb{Q}(\zeta_{m})^{+}$（$\zeta+\zeta^{-1}$ は固定され、$[\mathbb{Q}(\zeta_{m}):\mathbb{Q}(\zeta+\zeta^{-1})]\le2$ で $\zeta$ は $x^{2}-(\zeta+\zeta^{-1})x+1$ の根）。
:::
