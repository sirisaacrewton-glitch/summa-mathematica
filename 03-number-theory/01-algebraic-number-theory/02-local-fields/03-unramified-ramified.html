# 不分岐拡大と分岐拡大 {#nt:page-unramified-ramified keywords="unramified extension, correspondence between unramified extensions and residue field extensions, unramified extensions are Galois with Galois group isomorphic to that of the residue extension, Frobenius automorphism, unramified extension of a local field generated by roots of unity, totally ramified extension, Eisenstein polynomial, B = A[Pi], tamely ramified extension, Kummer form of tamely totally ramified extensions, maximal unramified subextension"}

完備離散付値体 $K$ の有限次拡大 $L$ は、基本等式 $ef=n$ により「剰余体が大きくなる部分」と「目盛りが細かくなる部分」に分かれる。このページでは、前者だけからなる**不分岐拡大**が剰余体の拡大と一対一に対応し、ガロア群がフロベニウス自己同型で生成される巡回群になることを示す。後者だけからなる**完全分岐拡大**は**アイゼンシュタイン多項式**の根で生成され、付値環は一意化元で単項生成される。さらに、分岐指数が剰余体の標数と互いに素な**順分岐**の場合には、完全分岐拡大が冪根の添加 $K(\sqrt[e]{\pi'})$ の形になることを示す。

## 記法と定義の確認 {#nt:sec-ur-notation}

::: notation
- $K$ は完備離散付値体、$A$, $\pi$, $k$ と、有限次拡大 $L$ の $B$, $\Pi$, $\ell$, $e$, $f$ は \ref{nt:page-local-extensions} のとおり。付値は $v(\pi)=1$ と正規化し、$L$ 上に一意に延びた付値も $v$ と書く（$v(\Pi)=1/e$）。
- \ref{nt:extension-of-absolute-value} の 2（一意性）から、$K$ 上の体の同型は絶対値を保ち、$B$ と極大イデアルを保つ。ヘンゼルの補題とその系は \ref{nt:hensel-factorization}, \ref{nt:hensel-corollaries}。
- 剰余体 $k$ の標数を $p$ とする（$p=0$ もありうる）。\ref{ring:eisenstein}、ガロア拡大の特徴づけは \ref{fld:normal-equivalent}、有限体は \ref{fld:finite-field-classification}。
- 体系は $\ZF$。
:::

## 不分岐拡大 {#nt:sec-ur-unramified}

::: definition 不分岐拡大と完全分岐拡大 {#nt:unramified-def keywords="L/K unramified: e = 1 and l/k separable; totally ramified: f = 1; tamely ramified: l/k separable and p does not divide e" index="不分岐拡大|ふぶんきかくだい, 完全分岐拡大|かんぜんぶんきかくだい, 順分岐拡大|じゅんぶんきかくだい" refname="不分岐拡大と完全分岐拡大"}
有限次拡大 $L/K$ が**不分岐**であるとは $e=1$ かつ $\ell/k$ が分離的であることをいう。$f=1$ のとき**完全分岐**、$\ell/k$ が分離的で $p\nmid e$ のとき**順分岐**という。
:::

::: intuition
不分岐とは「目盛りは同じで、桁に使える数字だけが増える」拡大で、完全分岐とは「数字は同じで、目盛りだけが細かくなる」拡大である。
:::

::: theorem 不分岐拡大の構造 {#nt:unramified-structure keywords="for every finite separable extension l/k of degree n there is an unramified L/K with residue field l, L = K(alpha) with alpha a lift of a primitive element; unramified extensions are determined by their residue fields; if l/k is Galois then L/K is Galois and Gal(L/K) = Gal(l/k)" index="不分岐拡大の構造|ふぶんきかくだいのこうぞう" refname="不分岐拡大の構造"}
1. $k$ の $n$ 次分離拡大 $\ell=k(\bar a)$ について、$\bar a$ の最小多項式 $\bar g$ のモニックな持ち上げ $g\in A[x]$ は $K$ 上既約で、その根 $\alpha$ による $L\defeq K(\alpha)$ は剰余体 $\ell$ をもつ $n$ 次不分岐拡大である。
2. 不分岐拡大 $L/K$ の剰余体を $\ell=k(\bar a)$ とすると、$\bar\alpha=\bar a$ となるある $\alpha\in B$ について $L=K(\alpha)$。特に、剰余体が同じ不分岐拡大は（共通の拡大体の中で）一致する。
3. $\ell/k$ がガロア拡大なら $L/K$ もガロア拡大で、還元写像 $\operatorname{Gal}(L/K)\to\operatorname{Gal}(\ell/k)$ は同型である。
:::

::: intuition
剰余体の拡大を生成する元の最小多項式を持ち上げると、ヘンゼルの補題によって根も持ち上がり、その根が不分岐拡大を生成する。根が剰余体で互いに異なるので、自己同型は剰余体での作用で完全に決まる。
:::

::: proof
**Step 1（1：既約性）.** 【主張：$g$ は既約】$g=g_{1}g_{2}$（$K[x]$ のモニックな因子）なら、$g$ の根は $A$ 上整なので $g_{1},g_{2}$ の根も整で、係数は整な元の対称式として $A$ 上整な $K$ の元、$A$ は整閉なので $g_{1},g_{2}\in A[x]$。還元すると $\bar g=\bar g_{1}\bar g_{2}$ で、$\bar g$ の既約性から一方は定数（モニックなので $1$）。

**Step 2（1：不分岐性）.** $[L:K]=n$。$\bar\alpha$ は $\bar g$ の根なので $L$ の剰余体は $k(\bar a)\cong\ell$ を含み、$f\ge n$。\ref{nt:ef-equals-n} から $f=n$, $e=1$。

**Step 3（2）.** 【主張：不分岐拡大は剰余体から決まる】$\ell=k(\bar a)$（分離拡大なので原始元がある）、$\bar a$ の最小多項式 $\bar g$ を持ち上げた $g$ は、$\bar g$ が分離的なので $\bar a$ を単根にもつ。$L$ は完備なので \ref{nt:hensel-corollaries} の 1 から $g(\alpha)=0$, $\bar\alpha=\bar a$ となる $\alpha\in B$ がある。$K(\alpha)\subseteq L$ の剰余体は $\ell$ を含むので $[K(\alpha):K]\ge f(K(\alpha)/K)\ge n=[L:K]$、よって $L=K(\alpha)$。

**Step 4（3）.** 【主張：$\operatorname{Gal}(L/K)\cong\operatorname{Gal}(\ell/k)$】$\ell/k$ は正規なので $\bar g$ は $\ell$ で相異なる 1 次式に分解し、各根を \ref{nt:hensel-corollaries} の 1 で持ち上げると、$g$ は $L$ で相異なる $n$ 個の根に分解する。$L$ は分離多項式 $g$ の分解体なのでガロア拡大（\ref{fld:normal-equivalent}）。$\sigma\in\operatorname{Gal}(L/K)$ は $B$ と $\Pi B$ を保つので $\bar\sigma\in\operatorname{Gal}(\ell/k)$ を誘導する。$\bar\sigma=\mathrm{id}$ なら $\overline{\sigma\alpha}=\bar\alpha$ で、$g$ の根は剰余体で互いに異なるので $\sigma\alpha=\alpha$、$\sigma=\mathrm{id}$。両辺の位数は $n$ なので同型。
:::

::: corollary 局所体の不分岐拡大 {#nt:unramified-local-field keywords="for a local field K with q-element residue field and each n there is exactly one unramified extension of degree n (in a given algebraic extension), namely K(mu_{q^n - 1}); it is cyclic, generated by the Frobenius automorphism phi with phi(x) = x^q mod Pi" index="フロベニウス自己同型（局所体）|ふろべにうすじこどうけい, 局所体の不分岐拡大|きょくしょたいのふぶんきかくだい" refname="局所体の不分岐拡大"}
$K$ を剰余体 $\mathbb{F}_{q}$ の局所体とする。$K_{n}\defeq K(\mu_{q^{n}-1})$ は $K$ の $n$ 次不分岐拡大で、$K$ のどの $n$ 次不分岐拡大も（共通の拡大体の中で）$K_{n}$ に等しい。$\operatorname{Gal}(K_{n}/K)$ は位数 $n$ の巡回群で、$\varphi(x)\equiv x^{q}\pmod{\Pi}$（$x\in B$）を満たすただ一つの元 $\varphi$（**フロベニウス自己同型**）で生成され、$\varphi(\zeta)=\zeta^{q}$（$\zeta\in\mu_{q^{n}-1}$）。
:::

::: intuition
局所体では、剰余体の $n$ 次拡大はただ一つ $\mathbb{F}_{q^{n}}$ なので、不分岐拡大も各次数にただ一つで、$1$ の $(q^{n}-1)$ 乗根を添加すれば得られる。ガロア群は剰余体のフロベニウス $x\mapsto x^{q}$ の持ち上げで生成される。
:::

::: proof
**Step 1（$K_{n}$ は $n$ 次不分岐）.** 【主張：$K(\mu_{q^{n}-1})$ は $n$ 次不分岐拡大】$\mathbb{F}_{q^{n}}=\mathbb{F}_{q}(\bar a)$ を生成元 $\bar a$ が $x^{q^{n}-1}-1$ の根になるようにとり（$\mathbb{F}_{q^{n}}^{\times}$ は巡回群）、\ref{nt:unramified-structure} の 1 の $g$ を $\bar a$ の最小多項式の持ち上げとすると、$L=K(\alpha)$ は $n$ 次不分岐。$L$ の剰余体 $\mathbb{F}_{q^{n}}$ で $x^{q^{n}-1}-1$ は相異なる根に分解するので、ヘンゼルの補題で $\mu_{q^{n}-1}\subseteq L$。$K_{n}\subseteq L$ の剰余体は $\mathbb{F}_{q^{n}}$ を含む（$\mu_{q^{n}-1}$ の還元は $\mathbb{F}_{q^{n}}^{\times}$ 全体）ので $[K_{n}:K]\ge n$、$K_{n}=L$。

**Step 2（一意性）.** 【主張：$n$ 次不分岐拡大は $K_{n}$ に一致】$n$ 次不分岐拡大 $L'$ の剰余体は $\mathbb{F}_{q^{n}}$ で、Step 1 と同様に $\mu_{q^{n}-1}\subseteq L'$、$K_{n}\subseteq L'$ で次数が等しい。

**Step 3（フロベニウス）.** 【主張：ガロア群はフロベニウスで生成される巡回群】$\operatorname{Gal}(\mathbb{F}_{q^{n}}/\mathbb{F}_{q})$ は $x\mapsto x^{q}$ で生成される位数 $n$ の巡回群（\ref{fld:finite-field-classification}）で、\ref{nt:unramified-structure} の 3 からその持ち上げ $\varphi$ が $\operatorname{Gal}(K_{n}/K)$ を生成する。$\varphi(\zeta)$ と $\zeta^{q}$ はともに $\mu_{q^{n}-1}$ の元で還元が等しく、$\mu_{q^{n}-1}$ の元は還元で区別されるので等しい。
:::

## 完全分岐拡大と順分岐拡大 {#nt:sec-ur-ramified}

::: theorem 完全分岐拡大とアイゼンシュタイン多項式 {#nt:totally-ramified-eisenstein keywords="if L/K is totally ramified then the minimal polynomial of a uniformizer is Eisenstein, L = K(Pi) and B = A[Pi]; conversely a root of an Eisenstein polynomial of degree n generates a totally ramified extension of degree n" index="完全分岐とアイゼンシュタイン多項式|かんぜんぶんきとあいぜんしゅたいんたこうしき, アイゼンシュタイン多項式|あいぜんしゅたいんたこうしき" refname="完全分岐拡大とアイゼンシュタイン多項式"}
1. $L/K$ が $n$ 次完全分岐なら、一意化元 $\Pi$ の最小多項式はアイゼンシュタイン多項式（モニックで、最高次以外の係数が $\mathfrak m$ に入り、定数項が $\mathfrak m^{2}$ に入らない）で、$L=K(\Pi)$, $B=A[\Pi]$。
2. 逆に $\alpha$ が $n$ 次アイゼンシュタイン多項式 $g$ の根なら、$K(\alpha)/K$ は $n$ 次完全分岐で、$\alpha$ は一意化元。
:::

::: intuition
完全分岐拡大の一意化元は「$\pi$ の $n$ 乗根のようなもの」で、その最小多項式の根（共役）はどれも同じ小さな大きさ $\abs\pi^{1/n}$ をもつ。根の対称式である係数は小さく、根の積である定数項はちょうど $\pi$ の大きさになる。これがアイゼンシュタインの条件である。
:::

::: proof
**Step 1（1：次数）.** $v(\Pi)=1/n$ は $K(\Pi)$ の値群に入るので、$K(\Pi)/K$ の分岐指数は $n$ 以上、$[K(\Pi):K]\ge n$。よって $L=K(\Pi)$、最小多項式 $g$ の次数は $n$。

**Step 2（1：アイゼンシュタイン性）.** 【主張：$g$ の係数の付値】$g$ の根（正規閉包の中の $\Pi$ の共役）は、絶対値の拡張の一意性から、すべて付値 $1/n$ をもつ。$g$ の $x^{n-i}$ の係数（$i\ge1$）は根の $i$ 次基本対称式（の符号つき）で、各項の付値は $i/n>0$ なので、係数の付値は正、すなわち $\mathfrak m$ に入る（係数は $K$ の元で付値は整数）。定数項は $\pm\prod$（根）で付値は $n\cdot\frac1n=1$、$\mathfrak m^{2}$ に入らない。

**Step 3（1：$B=A[\Pi]$）.** \ref{nt:ef-equals-n} で $f=1$, $\omega_{1}=1$ とすると、$B$ の $A$ 上の基底は $1,\Pi,\dots,\Pi^{n-1}$。

**Step 4（2）.** アイゼンシュタイン多項式は既約（\ref{ring:eisenstein}）なので $[K(\alpha):K]=n$, $N(\alpha)=\pm g(0)$、$v(\alpha)=\frac1nv(g(0))=\frac1n$。値群が $\frac1n\Z$ を含むので $e\ge n$、基本等式から $e=n$, $f=1$ で、$\alpha$ は一意化元。
:::

::: theorem 順分岐な完全分岐拡大 {#nt:tame-totally-ramified keywords="if L/K is totally and tamely ramified of degree e (p does not divide e) and the residue field is perfect, then L = K(pi'^{1/e}) for some uniformizer pi' of K" index="順分岐拡大の構造|じゅんぶんきかくだいのこうぞう" refname="順分岐な完全分岐拡大"}
$L/K$ を $e$ 次の完全分岐拡大で $p\nmid e$（$p=0$ なら条件なし）とする。$K$ のある一意化元 $\pi'$ と $L$ の一意化元 $\Pi'$ で $\Pi'^{e}=\pi'$ となるものがある。特に $L=K(\sqrt[e]{\pi'})$。
:::

::: intuition
順分岐なら、一意化元の $e$ 乗と $\pi$ の比の単元から、$1$ に近い部分の $e$ 乗根をヘンゼルの補題で取り除ける。残るのは $K$ の元なので、拡大は $K$ の一意化元の $e$ 乗根を添加したものになる。
:::

::: proof
**Step 1（単元の分解）.** $\Pi^{e}=\pi u$（$u\in B^{\times}$）と書く。$f=1$ なので $\bar u\in k^{\times}$ で、$u_{0}\in A^{\times}$ を $\bar u_{0}=\bar u$ ととると $u=u_{0}w$, $w\in1+\Pi B$。

**Step 2（$w$ の $e$ 乗根）.** 【主張：$w=w_{1}^{e}$ となる $w_{1}\in1+\Pi B$ がある】$x^{e}-w$ の還元は $x^{e}-1$ で、$\bar1$ は単根（微分 $e\neq0$ in $\ell$。$p\nmid e$）。$L$ は完備なので \ref{nt:hensel-corollaries} の 1 から根 $w_{1}$, $\bar w_{1}=1$ がある。

**Step 3（結論）.** $\Pi'\defeq\Pi/w_{1}$ は一意化元で $\Pi'^{e}=\pi u_{0}\eqdef\pi'$ は $K$ の一意化元。$K(\Pi')\subseteq L$ は分岐指数 $e$ をもつので $L=K(\Pi')$。
:::

::: example
1. $\mathbb{Q}_{p}(\zeta_{p})$ は $p-1$ 次完全分岐で、$\zeta_{p}-1$ は一意化元、最小多項式 $\Phi_{p}(x+1)$ はアイゼンシュタイン多項式（\ref{nt:prob-le-zeta-p}）。$p\nmid p-1$ なので順分岐で、実際 $\mathbb{Q}_{p}(\zeta_{p})=\mathbb{Q}_{p}(\sqrt[p-1]{-p})$ と知られている（$(\zeta_{p}-1)^{p-1}$ と $-p$ の比が $1$ に近い単元であることから）。
2. $\mathbb{Q}_{p}$ の $n$ 次不分岐拡大は $\mathbb{Q}_{p}(\zeta_{p^{n}-1})$。$n=2$, $p$ 奇素数なら $\mathbb{Q}_{p}(\sqrt u)$（$u$ は非平方な単元）とも一致する。
3. $\mathbb{Q}_{2}(\sqrt{-1})/\mathbb{Q}_{2}$ は $x^{2}+1$ ではなく $(x+1)^{2}+1=x^{2}+2x+2$ がアイゼンシュタインで、$-1+i$ が一意化元の完全分岐 2 次拡大。$p=2\mid e=2$ なので順分岐でない（**暴分岐**）。
:::

::: hypcheck
- **不分岐拡大の構造**：$\ell/k$ の分離性は、$\bar g$ の根が単根であること（ヘンゼルの補題を使う条件）と、根が剰余体で区別されること（Step 4 の単射性）に使った。完備性はヘンゼルの補題に使った。
- **完全分岐とアイゼンシュタイン多項式**：共役の付値が等しいこと（絶対値の拡張の一意性）を Step 2 に使った。
- **順分岐**：$p\nmid e$ は $x^{e}-1$ の単根性（Step 2）に本質的。暴分岐では一般に冪根の形にならない。
:::

## 問題 {#nt:sec-ur-problems}

::: problem {#nt:prob-ur-frobenius-5}
$K=\mathbb{Q}_{5}$, $n=2$ のとき、$K_{2}=\mathbb{Q}_{5}(\mu_{24})$ のフロベニウス $\varphi$ が $\zeta\mapsto\zeta^{5}$ で与えられることから、$\varphi$ の位数が 2 であることを確かめよ。また $\sqrt2\in K_{2}$ を示せ。
:::

::: solution
$\varphi^{2}(\zeta)=\zeta^{25}=\zeta$（$\zeta^{24}=1$）なので $\varphi^{2}=\mathrm{id}$、$\varphi(\zeta)\neq\zeta$（原始 24 乗根 $\zeta$ では $\zeta^{5}\neq\zeta$）なので位数 2。$2$ は $\bmod5$ で非平方（平方は $1,4$）なので $\sqrt2\notin\mathbb{Q}_{5}$ で、$\mathbb{Q}_{5}(\sqrt2)$ は不分岐 2 次拡大（\ref{nt:ex-le-unramified-quadratic}）。不分岐 2 次拡大はただ一つ（\ref{nt:unramified-local-field}）なので $\sqrt2\in K_{2}$。
:::

::: problem {#nt:prob-ur-eisenstein-shift}
$\mathbb{Q}_{3}(\sqrt{-3})$ は完全分岐であることを、アイゼンシュタイン多項式を見つけて示せ。
:::

::: solution
$\sqrt{-3}$ の最小多項式 $x^{2}+3$ はアイゼンシュタイン（$3\mid0,3$, $9\nmid3$）なので、\ref{nt:totally-ramified-eisenstein} の 2 から 2 次完全分岐で、$\sqrt{-3}$ は一意化元。$3\nmid2$ なので順分岐（実際 $\mathbb{Q}_{3}(\sqrt{-3})=\mathbb{Q}_{3}(\zeta_{3})$）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 不分岐拡大の構造は剰余体の有限性を使わない（分離性だけでよい）。局所体の系で有限性を使ったのは、剰余体の拡大が 1 の冪根で生成されることと、ガロア群が巡回群であることである。

**前提を変えると.**
- 任意の有限次分離拡大 $L/K$ には、最大の不分岐部分拡大 $L_{0}$ があり、$L/L_{0}$ は完全分岐である（剰余体を $L_{0}$ が受け持つ）と知られている。不分岐拡大全体の合成 $K^{\mathrm{ur}}$ のガロア群は $\hat\Z$（副有限完備化）で、フロベニウスが位相的生成元になる。
- 局所体の乗法群は $K^{\times}\cong\Z\times\mu_{q-1}\times U^{(1)}$ で、$K\supseteq\mathbb{Q}_{p}$ が $d$ 次なら $U^{(1)}\cong\mu_{p^{a}}\times\mathbb{Z}_{p}^{d}$（$\mu_{p^{a}}$ は $K$ に含まれる $p$ 冪の 1 の冪根）と知られている（Ne II.5.7）。

**高い視点から：惰性群と分解群の局所版.** 数体のガロア拡大で、素イデアル $\mathfrak P$ の分解群は完備化のガロア群 $\operatorname{Gal}(L_{\mathfrak P}/K_{\mathfrak p})$ に一致し、惰性群はその中の「剰余体に自明に作用する部分」、すなわち完全分岐部分のガロア群である（\ref{nt:decomposition-inertia}）。不分岐の部分はフロベニウスで生成される巡回群で、これが大域的なフロベニウス元の正体である。比喩で言えば、局所体の拡大は「横方向の伸び」（剰余体、フロベニウスで回る）と「縦方向の伸び」（分岐、惰性群で測る）の 2 方向に分かれ、両者は塔として積み重なる。
:::
