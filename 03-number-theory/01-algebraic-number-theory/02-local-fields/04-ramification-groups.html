# 分岐群 {#nt:page-ramification-groups keywords="higher ramification groups G_i, lower numbering, i_G(sigma) = v_L(sigma Pi - Pi), G_0 inertia group of order e, G/G_0 = Gal(l/k), G_0/G_1 embeds in l^x, G_i/G_{i+1} embeds in l for i >= 1, G_1 is the p-Sylow subgroup of the inertia group, Galois groups of local fields are solvable, tame ramification iff G_1 = 1, Hilbert's formula for the different, Herbrand function and upper numbering, ramification groups of Q_p(zeta_{p^n})"}

局所体のガロア拡大 $L/K$ では、ガロア群 $G$ の元が一意化元 $\Pi$ をどれだけ「動かすか」を付値で測ることで、$G$ に減少する正規部分群の列 $G=G_{-1}\supseteq G_{0}\supseteq G_{1}\supseteq\cdots$（**分岐群**）が定まる。$G_{0}$ は惰性群で、剰余体への作用が自明な元からなる。このページでは、商 $G_{0}/G_{1}$ が剰余体の乗法群に、$G_{i}/G_{i+1}$（$i\ge1$）が剰余体の加法群に埋め込まれることを示し、そこから $G_{1}$ が惰性群の $p$ シロー部分群であること、局所体のガロア群が可解であることを導く。完全分岐の場合には、一意化元の最小多項式の微分の付値が $\sum_{i}(\abs{G_{i}}-1)$ に等しいこと（**ヒルベルトの公式**）を示し、最後に $\mathbb{Q}_{p}(\zeta_{p^{n}})$ の分岐群を完全に求める。

## 記法と定義の確認 {#nt:sec-rg-notation}

::: notation
- $K$ は剰余体 $k=\mathbb{F}_{q}$（標数 $p$）の局所体、$L/K$ は有限次ガロア拡大、$G\defeq\operatorname{Gal}(L/K)$、$B$, $\Pi$, $\ell$, $e$, $f$ は \ref{nt:page-local-extensions} のとおり。このページでは $L$ の付値を $v_{L}(\Pi)=1$ と正規化する（整数値）。
- ガロア群の元は $B$ と極大イデアル $\Pi B$ を保つ（\ref{nt:extension-of-absolute-value} の 2）。
- $\ell=\mathbb{F}_{q^{f}}$ で、$\mu\defeq\mu_{q^{f}-1}\subseteq L$（\ref{nt:hensel-corollaries} の 2）。$T\defeq\mu\cup\{0\}$ は $\ell$ の代表系で、$B$ の元は $\sum_{n\ge0}t_{n}\Pi^{n}$（$t_{n}\in T$）と一意に書ける（\ref{nt:complete-dvf-structure}）。
- 不分岐拡大とフロベニウスは \ref{nt:page-unramified-ramified} のとおり。
- 体系は $\ZF$。
:::

## 分岐群の定義 {#nt:sec-rg-definition}

::: definition 分岐群 {#nt:ramification-groups-def keywords="G_i = {sigma in G : sigma acts trivially on B / Pi^{i+1} B}; i_G(sigma) = min over b of v_L(sigma b - b); G_{-1} = G, G_0 inertia group" index="分岐群|ぶんきぐん, 高次分岐群|こうじぶんきぐん, 惰性群（局所体）|だせいぐん" refname="分岐群"}
$i\ge-1$ について、**第 $i$ 分岐群**を
$$G_{i}\defeq\{\sigma\in G:\ v_{L}(\sigma b-b)\ge i+1\ \ (\forall b\in B)\}$$
とする。$G_{-1}=G$、$G_{0}$ を**惰性群**という。$\sigma\neq1$ について $i_{G}(\sigma)\defeq\min_{b\in B}v_{L}(\sigma b-b)$ とおく（$i_{G}(1)=\infty$）。
:::

::: intuition
$G_{i}$ は、$B$ を $\Pi^{i+1}$ を法として見たときに区別がつかない自己同型の集まりである。$i$ が大きいほど「より細かい目盛りでも動かない」元だけが残り、最後には恒等写像だけになる。
:::

::: proposition 分岐群の基本性質 {#nt:ramification-groups-basic keywords="the G_i are normal subgroups of G, decreasing, G_i = 1 for large i; for sigma in G_0, i_G(sigma) = v_L(sigma Pi - Pi); G/G_0 = Gal(l/k) and |G_0| = e" index="分岐群の基本性質|ぶんきぐんのきほんせいしつ"}
1. $G_{i}$ は $G$ の正規部分群で、$G_{i}\supseteq G_{i+1}$、十分大きい $i$ で $G_{i}=1$。
2. $\sigma\in G_{0}$ は $\mu$ の各元を固定し、$i_{G}(\sigma)=v_{L}(\sigma\Pi-\Pi)$。したがって $i\ge0$ について $G_{i}=\{\sigma\in G_{0}:v_{L}(\sigma\Pi-\Pi)\ge i+1\}$。
3. 還元写像 $G\to\operatorname{Gal}(\ell/k)$ は全射で、核は $G_{0}$。特に $\abs{G_{0}}=e$。
:::

::: proof
**Step 1（1）.** $G_{i}$ は「$B/\Pi^{i+1}B$ への作用が自明」という条件なので部分群で、$\tau G_{i}\tau^{-1}$ も同じ条件を満たす（$\tau$ は $\Pi^{i+1}B$ を保つ）ので正規。減少は定義から。$\sigma\neq1$ なら $\sigma b\neq b$ となる $b\in B$ があり（$L=K\cdot B$）、$i\ge v_{L}(\sigma b-b)$ で $\sigma\notin G_{i}$。$G$ は有限なので、十分大きい $i$ で $G_{i}=1$。

**Step 2（2：$\mu$ の固定）.** 【主張：$\sigma\in G_{0}$ なら $\sigma\zeta=\zeta$（$\zeta\in\mu$）】$\sigma\zeta\in\mu$ で、$\sigma\in G_{0}$ から $\sigma\zeta\equiv\zeta\pmod\Pi$。$\mu$ の元は還元で区別される（$x^{q^{f}-1}-1$ は $\ell$ で単根をもつ）ので $\sigma\zeta=\zeta$。

**Step 3（2：$i_{G}$ の計算）.** $b=\sum t_{n}\Pi^{n}$（$t_{n}\in T$）について、Step 2 から $\sigma b-b=\sum_{n\ge1}t_{n}(\sigma(\Pi)^{n}-\Pi^{n})$。$\sigma(\Pi)^{n}-\Pi^{n}=(\sigma\Pi-\Pi)\sum_{j=0}^{n-1}\sigma(\Pi)^{j}\Pi^{n-1-j}$ で、右の和は $B$ の元なので $v_{L}(\sigma b-b)\ge v_{L}(\sigma\Pi-\Pi)$。$b=\Pi$ で等号。

**Step 4（3）.** 核が $G_{0}$ なのは定義（$i=0$：剰余体への作用が自明）。全射性：$\zeta\in\mu$ を $\bar\zeta$ が $\ell$ を生成するようにとると、$K(\zeta)$ は $f$ 次不分岐拡大 $K_{f}$（\ref{nt:unramified-local-field}）で、制限 $G\to\operatorname{Gal}(K_{f}/K)$ は全射（ガロアの基本定理）、$\operatorname{Gal}(K_{f}/K)\to\operatorname{Gal}(\ell/k)$ は同型（\ref{nt:unramified-structure} の 3）。合成が還元写像に一致するので全射。$\abs{G_{0}}=\abs G/f=n/f=e$。
:::

## 商の構造 {#nt:sec-rg-quotients}

::: theorem 分岐群の商 {#nt:ramification-quotients keywords="theta_0: G_0/G_1 -> l^x, sigma -> sigma(Pi)/Pi mod Pi is an injective homomorphism independent of Pi; for i >= 1, theta_i: G_i/G_{i+1} -> U^(i)/U^(i+1) = l is injective; G_0/G_1 is cyclic of order prime to p, G_i/G_{i+1} are elementary abelian p-groups, G_1 is the p-Sylow subgroup of G_0, G is solvable" index="分岐群の商|ぶんきぐんのしょう" refname="分岐群の商"}
1. $\theta_{0}(\sigma)\defeq\overline{\sigma(\Pi)/\Pi}$ は $G_{0}$ から $\ell^{\times}$ への準同型で、$\Pi$ の選び方によらず、核は $G_{1}$。
2. $i\ge1$ について $\theta_{i}(\sigma)\defeq\sigma(\Pi)/\Pi\bmod U_{L}^{(i+1)}$ は $G_{i}$ から $U_{L}^{(i)}/U_{L}^{(i+1)}\cong\ell$ への準同型で、$\Pi$ の選び方によらず、核は $G_{i+1}$。
3. したがって $G_{0}/G_{1}$ は位数が $p$ と互いに素な巡回群、$G_{i}/G_{i+1}$（$i\ge1$）は位数 $p$ の巡回群の直積、$G_{1}$ は $G_{0}$ の（ただ一つの）$p$ シロー部分群で、$G$ は可解群である。
:::

::: intuition
惰性群の元は一意化元を $\Pi\mapsto u\Pi$ と「単元倍」でしか動かせず、その単元の先頭の桁が $G_{0}/G_{1}$ を、$1$ からのずれの最初の桁が $G_{i}/G_{i+1}$ を記録する。乗法群 $\ell^{\times}$ の部分群は位数が $p$ と互いに素、加法群 $\ell$ の部分群は $p$ 群なので、惰性群は「$p$ 群の上に巡回群が乗った」形になる。
:::

::: proof
**Step 1（1：準同型）.** $\sigma\in G_{0}$ について $\sigma\Pi=u_{\sigma}\Pi$, $u_{\sigma}\in B^{\times}$。$\sigma\tau(\Pi)=\sigma(u_{\tau})u_{\sigma}\Pi$ で、$\sigma\in G_{0}$ から $\sigma(u_{\tau})\equiv u_{\tau}\pmod\Pi$。よって $\theta_{0}(\sigma\tau)=\theta_{0}(\sigma)\theta_{0}(\tau)$。

**Step 2（1：独立性と核）.** 別の一意化元 $\Pi'=w\Pi$（$w\in B^{\times}$）では $\sigma\Pi'/\Pi'=u_{\sigma}\sigma(w)/w$ で、$\sigma(w)/w\equiv1$。核：$\bar u_{\sigma}=1\iff v_{L}(\sigma\Pi-\Pi)=v_{L}((u_{\sigma}-1)\Pi)\ge2\iff\sigma\in G_{1}$（\ref{nt:ramification-groups-basic} の 2）。

**Step 3（2）.** 【主張：$\theta_{i}$ は準同型で核は $G_{i+1}$】$\sigma\in G_{i}$ なら $v_{L}(u_{\sigma}-1)=v_{L}(\sigma\Pi-\Pi)-1\ge i$ なので $u_{\sigma}\in U_{L}^{(i)}$。$\sigma\in G_{i}$ はすべての $b\in B$ で $\sigma b\equiv b\pmod{\Pi^{i+1}}$ なので、$u_{\tau}=1+\Pi^{i}c$ について $\sigma(u_{\tau})\equiv u_{\tau}\pmod{\Pi^{i+1}}$、すなわち $\sigma(u_{\tau})/u_{\tau}\in U_{L}^{(i+1)}$。Step 1 と同じ計算で準同型。$\Pi$ の取り替えでは $\sigma(w)/w\in U_{L}^{(i+1)}$（同じ理由）。核：$u_{\sigma}\in U_{L}^{(i+1)}\iff v_{L}(\sigma\Pi-\Pi)\ge i+2\iff\sigma\in G_{i+1}$。

**Step 4（3）.** $\ell^{\times}$ は位数 $q^{f}-1$ の巡回群（\ref{fld:finite-field-classification}）で、その部分群は巡回群で位数は $p$ と互いに素。$U_{L}^{(i)}/U_{L}^{(i+1)}\cong\ell$（\ref{nt:complete-dvf-structure} の 4）は位数 $p$ の巡回群の直積で、部分群も同様。$\abs{G_{1}}=\prod_{i\ge1}\abs{G_{i}/G_{i+1}}$ は $p$ の冪、$[G_{0}:G_{1}]$ は $p$ と互いに素なので $G_{1}$ は $G_{0}$ の $p$ シロー部分群（正規なのでただ一つ）。$G\supseteq G_{0}\supseteq G_{1}\supseteq\cdots\supseteq1$ の各商は可換（$G/G_{0}\cong\operatorname{Gal}(\ell/k)$ は巡回）なので $G$ は可解。
:::

::: corollary 順分岐の判定 {#nt:tame-criterion keywords="L/K is tamely ramified iff G_1 = 1 iff p does not divide e; then the inertia group is cyclic" index="順分岐の判定|じゅんぶんきのはんてい"}
$L/K$ が順分岐（$p\nmid e$）であることと $G_{1}=1$ は同値で、このとき惰性群 $G_{0}$ は位数 $e$ の巡回群である。
:::

::: proof
$\abs{G_{0}}=e$（\ref{nt:ramification-groups-basic} の 3）で、$G_{1}$ はその $p$ シロー部分群なので、$G_{1}=1\iff p\nmid e$。このとき $G_{0}\cong G_{0}/G_{1}$ は $\ell^{\times}$ の部分群で巡回。
:::

## ヒルベルトの公式 {#nt:sec-rg-hilbert}

::: theorem ヒルベルトの公式（完全分岐の場合） {#nt:hilbert-different-formula keywords="if L/K is totally ramified Galois and g is the minimal polynomial of Pi, then v_L(g'(Pi)) = sum_{sigma != 1} i_G(sigma) = sum_{i >= 0} (|G_i| - 1)" index="ヒルベルトの公式（共役差積）|ひるべるとのこうしき" refname="ヒルベルトの公式"}
$L/K$ を完全分岐なガロア拡大、$g$ を $\Pi$ の $K$ 上の最小多項式とすると
$$v_{L}(g'(\Pi))=\sum_{\sigma\neq1}i_{G}(\sigma)=\sum_{i\ge0}\bigl(\abs{G_{i}}-1\bigr).$$
:::

::: intuition
最小多項式の微分の値は、$\Pi$ とその共役の差の積で、各差の付値がその自己同型の $i_{G}$ である。$i_{G}(\sigma)$ は「$\sigma$ がいくつの $G_{i}$ に入っているか」と同じなので、和を $i$ ごとに数え直すと分岐群の位数の和になる。
:::

::: proof
**Step 1（積への分解）.** $L=K(\Pi)$（\ref{nt:totally-ramified-eisenstein}）で $L/K$ はガロアなので $g(x)=\prod_{\sigma\in G}(x-\sigma\Pi)$、$g'(\Pi)=\prod_{\sigma\neq1}(\Pi-\sigma\Pi)$。$G=G_{0}$（完全分岐）なので \ref{nt:ramification-groups-basic} の 2 から $v_{L}(\Pi-\sigma\Pi)=i_{G}(\sigma)$。

**Step 2（数え直し）.** $\sigma\in G_{i}\iff i_{G}(\sigma)\ge i+1$ なので、$\sigma\neq1$ について $i_{G}(\sigma)=\#\{i\ge0:\sigma\in G_{i}\}$。よって $\sum_{\sigma\neq1}i_{G}(\sigma)=\sum_{i\ge0}\#(G_{i}\setminus\{1\})=\sum_{i\ge0}(\abs{G_{i}}-1)$。
:::

::: remark
$B=A[\Pi]$ のとき、$L/K$ の共役差積（\ref{nt:different} の局所版）は $g'(\Pi)B$ に等しいことが知られており（Se III §6, Corollary 2）、この定理は共役差積の付値を分岐群で表す**ヒルベルトの公式** $v_{L}(\mathfrak D_{L/K})=\sum_{i\ge0}(\abs{G_{i}}-1)$ の完全分岐の場合になる。特に順分岐（$G_{1}=1$）なら $v_{L}(\mathfrak D)=e-1$、暴分岐なら $v_{L}(\mathfrak D)\ge e$。
:::

## 例：円分拡大 {#nt:sec-rg-cyclotomic}

::: theorem $\mathbb{Q}_{p}(\zeta_{p^{n}})$ の分岐群 {#nt:cyclotomic-ramification-groups keywords="L = Q_p(zeta_{p^n}) is totally ramified of degree phi(p^n) with G = (Z/p^n)^x; i_G(sigma_a) = p^{v_p(a-1)}; G_i = Gal(L/Q_p(zeta_{p^k})) for p^{k-1} <= i <= p^k - 1" index="円分拡大の分岐群|えんぶんかくだいのぶんきぐん" refname="円分拡大の分岐群"}
$L\defeq\mathbb{Q}_{p}(\zeta)$, $\zeta$ を 1 の原始 $p^{n}$ 乗根とする。
1. $L/\mathbb{Q}_{p}$ は $\varphi(p^{n})$ 次完全分岐で、$\zeta-1$ は一意化元、$G\cong(\Z/p^{n}\Z)^{\times}$（$\sigma_{a}(\zeta)=\zeta^{a}$）。
2. $1\le m\le n$ について、1 の原始 $p^{m}$ 乗根 $\eta$ は $v_{L}(\eta-1)=\varphi(p^{n})/\varphi(p^{m})$。
3. $i_{G}(\sigma_{a})=p^{v_{p}(a-1)}$（$a\not\equiv1\pmod{p^{n}}$）。したがって $1\le k\le n$ と $p^{k-1}\le i\le p^{k}-1$ について $G_{i}=\{\sigma_{a}:a\equiv1\pmod{p^{k}}\}=\operatorname{Gal}(L/\mathbb{Q}_{p}(\zeta^{p^{n-k}}))$、$i\ge p^{n-1}$ で $G_{i}=1$。
:::

::: intuition
$\sigma_{a}$ は $\zeta$ を $\zeta^{a}$ に移すので、$\Pi=\zeta-1$ の動きは $\zeta^{a-1}-1$ の大きさで決まる。$a-1$ が $p$ で何回割れるかで $\zeta^{a-1}$ の位数が決まり、位数の小さい 1 の冪根ほど $1$ から遠い。こうして分岐群は「$a\equiv1\pmod{p^{k}}$」という合同条件の列になる。
:::

::: proof
**Step 1（アイゼンシュタイン性）.** 【主張：$\Phi_{p^{m}}(x+1)$ はアイゼンシュタイン多項式】$\Phi_{p^{m}}(x)=\frac{x^{p^{m}}-1}{x^{p^{m-1}}-1}$ で、$\mathbb{F}_{p}[x]$ では $x^{p^{j}}-1=(x-1)^{p^{j}}$ なので $\Phi_{p^{m}}(x)\equiv(x-1)^{\varphi(p^{m})}\pmod p$。よって $\Phi_{p^{m}}(x+1)\equiv x^{\varphi(p^{m})}$ で、定数項 $\Phi_{p^{m}}(1)=p$ は $p^{2}$ で割れない。

**Step 2（1, 2）.** Step 1（$m=n$）と \ref{nt:totally-ramified-eisenstein} の 2 から 1 の最初の 2 つ。$G\to(\Z/p^{n}\Z)^{\times}$, $\sigma\mapsto a$（$\sigma\zeta=\zeta^{a}$）は単射で、両辺の位数は $\varphi(p^{n})$。2：$\mathbb{Q}_{p}(\eta)$ で $\eta-1$ は一意化元（Step 1 を $m$ に）、$L/\mathbb{Q}_{p}(\eta)$ の分岐指数は $\varphi(p^{n})/\varphi(p^{m})$ なので、$v_{L}$ での値がその数。

**Step 3（3）.** $\Pi=\zeta-1$ とすると $\sigma_{a}\Pi-\Pi=\zeta^{a}-\zeta=\zeta(\zeta^{a-1}-1)$。$k\defeq v_{p}(a-1)<n$ なら $\zeta^{a-1}$ は 1 の原始 $p^{n-k}$ 乗根なので、2 から $i_{G}(\sigma_{a})=\varphi(p^{n})/\varphi(p^{n-k})=p^{k}$。$\sigma_{a}\in G_{i}\iff p^{k}\ge i+1$ で、$p^{k-1}\le i\le p^{k}-1$ のとき $p^{v_{p}(a-1)}\ge i+1>p^{k-1}$ は $v_{p}(a-1)\ge k$ と同値。$\{a\equiv1\pmod{p^{k}}\}$ は $\zeta^{p^{n-k}}$（原始 $p^{k}$ 乗根）を固定する元全体。
:::

::: remark
エルブランの関数 $\varphi_{L/K}(u)\defeq\int_{0}^{u}\frac{dt}{[G_{0}:G_{t}]}$（$G_{t}\defeq G_{\lceil t\rceil}$）で番号を付け替えた**上付き番号** $G^{\varphi(u)}\defeq G_{u}$ は、商群に移るときに保たれる（**エルブランの定理**：$H$ が正規部分群なら $(G/H)^{v}=G^{v}H/H$）と知られている（Se IV §3）。円分拡大の例では、$G^{v}=\{a\equiv1\pmod{p^{\lceil v\rceil}}\}$ と、跳びが整数 $v$ で起こる。アーベル拡大では上付き番号の跳びは常に整数である（**ハッセ–アルフの定理**、Se V §7）と知られており、局所類体論で単数群のフィルトレーション $U^{(v)}$ と対応する。
:::

::: hypcheck
- **分岐群の基本性質**：剰余体が有限であることは、代表系 $T=\mu\cup\{0\}$ が $G_{0}$ で固定されること（Step 2）に使った。一般の完全剰余体でも、$B=A[x]$ となる元 $x$ を使えば同じ記述ができる（Se IV §1）。
- **分岐群の商**：$\theta_{0}$ が $\ell^{\times}$ に入ること、$\theta_{i}$ が加法群 $\ell$ に入ることが、それぞれ「位数が $p$ と互いに素」「$p$ 群」の根拠である。
- **ヒルベルトの公式**：ガロア拡大で完全分岐であることを、$g$ が $\prod(x-\sigma\Pi)$ に分解し、すべての $\sigma$ が $G_{0}$ に入ることに使った。
:::

## 問題 {#nt:sec-rg-problems}

::: problem {#nt:prob-rg-zeta-p}
$L=\mathbb{Q}_{p}(\zeta_{p})$ の分岐群を求め、ヒルベルトの公式から $v_{L}(\Phi_{p}'(\zeta_{p}))=p-2$ を確かめよ。
:::

::: solution
$n=1$ なので $G=G_{0}$（位数 $p-1$）、$i\ge1$ で $G_{i}=1$（$i\ge p^{0}=1$）。順分岐（$p\nmid p-1$）と合う。$\Pi=\zeta_{p}-1$ の最小多項式は $g(x)=\Phi_{p}(x+1)$ で $g'(\Pi)=\Phi_{p}'(\zeta_{p})$。公式から $v_{L}=\abs{G_{0}}-1=p-2$。直接には $\Phi_{p}'(\zeta_{p})=\prod_{a\neq1}(\zeta_{p}-\zeta_{p}^{a})$ で、各因子は付値 1（\ref{nt:cyclotomic-ramification-groups} の 2）、$p-2$ 個。
:::

::: problem {#nt:prob-rg-zeta-4}
$L=\mathbb{Q}_{2}(\zeta_{4})=\mathbb{Q}_{2}(i)$ の分岐群 $G_{i}$ をすべて求めよ。
:::

::: solution
$p=2$, $n=2$, $G=\{\sigma_{1},\sigma_{3}\}$。$i_{G}(\sigma_{3})=2^{v_{2}(3-1)}=2$。よって $G_{0}=G_{1}=G$、$G_{2}=1$。暴分岐（$G_{1}\neq1$）で、ヒルベルトの公式から $v_{L}(g'(\Pi))=(2-1)+(2-1)=2$。実際 $\Pi=i-1$, $g(x)=x^{2}+2x+2$, $g'(\Pi)=2\Pi+2=2i$ で、$v_{L}(2)=e=2$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 商の埋め込み（1, 2）はガロア群が可換であることを使わない。可解性は、局所体のガロア群一般の性質として、この記述から自動的に従った。

**前提を変えると.**
- 数体のガロア拡大の素イデアル $\mathfrak P$ の分岐群は、完備化 $L_{\mathfrak P}/K_{\mathfrak p}$ の分岐群として定義され、$G_{0}$ は大域的な惰性群（\ref{nt:decomposition-inertia-def}）と一致する。
- 分岐群は、アルティン表現・スワン表現の構成（Se VI）や、導手の定義に使われる、と知られている。
- 剰余体が完全でない場合には、分岐の理論はずっと複雑になる（阿部–斎藤の分岐理論）と一般に言われている。

**高い視点から：ガロア群の上のフィルトレーション.** 分岐群は、ガロア群に「どれだけ深く分岐しているか」という尺度を与えるフィルトレーションで、単数群のフィルトレーション $U^{(i)}$ と鏡写しの関係にある：$\theta_{i}$ がその橋である。上付き番号に付け替えると、この対応は局所類体論の相互写像によって $U^{(v)}$ と $G^{v}$ の正確な対応になる（\ref[局所類体論とヒルベルト記号]{nt:page-local-class-field-theory}）。比喩で言えば、分岐群は自己同型が一意化元をどれだけ「深い桁」まで保つかで並べた階段で、階段の各段の幅（商）が剰余体の乗法群か加法群に収まっている。
:::
