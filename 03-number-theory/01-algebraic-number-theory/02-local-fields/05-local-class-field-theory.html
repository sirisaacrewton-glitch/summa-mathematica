# 局所類体論とヒルベルト記号 {#nt:page-local-class-field-theory keywords="local class field theory, local reciprocity map K^x / N(L^x) = Gal(L/K), existence theorem, norm groups of unramified extensions, N(U_L) = U_K, local Kronecker-Weber theorem, Lubin-Tate, Hilbert symbol (a,b)_v, norm group characterization of the Hilbert symbol, explicit formula for p odd, 2-adic formula, Hilbert's product formula and quadratic reciprocity"}

局所体 $K$ のアーベル拡大は、乗法群 $K^{\times}$ だけで完全に記述される：有限次アーベル拡大 $L/K$ について、ノルムの像 $N_{L/K}(L^{\times})$ は指数 $[L:K]$ の部分群で、商 $K^{\times}/N(L^{\times})$ はガロア群 $\operatorname{Gal}(L/K)$ と自然に同型になる（**局所相互法則**）。これが**局所類体論**である。その完全な証明には群のコホモロジーが要るので、このページでは主張を述べたうえで、不分岐拡大の場合にノルム群を実際に求め、相互写像が一意化元をフロベニウスに送ることを確かめる。後半では、2 次拡大の場合の相互写像を具体的に表す**ヒルベルト記号** $(a,b)_{v}$ を定義し、奇素数での明示公式を証明して、全素点にわたる積が $1$ になること（**ヒルベルトの積公式**）が平方剰余の相互法則の言い換えであることを示す。

## 記法と定義の確認 {#nt:sec-lcft-notation}

::: notation
- 局所体 $K$（剰余体 $\mathbb{F}_{q}$）、$A$, $\pi$, $U_{K}=A^{\times}$, $U_{K}^{(i)}$ は \ref{nt:page-absolute-values}、不分岐拡大とフロベニウス $\varphi$ は \ref{nt:unramified-local-field} のとおり。
- 有限体の拡大のトレースは分離拡大で $0$ でない $k$ 線形写像なので全射（\ref{fld:trace-separable}）。
- $\mathbb{Q}$ の素点 $v$ は素数 $p$ と $\infty$ で、$\mathbb{Q}_{\infty}\defeq\mathbb{R}$（\ref{nt:ostrowski}）。ルジャンドル記号と相互法則は \ref{nt:page-quadratic-residues}。
- 体系は $\ZF$。
:::

## 局所類体論の主張 {#nt:sec-lcft-statement}

::: fact 局所類体論 {#nt:local-class-field-theory keywords="local reciprocity: for finite abelian L/K there is a canonical isomorphism K^x / N(L^x) -> Gal(L/K) sending a uniformizer to Frobenius in the unramified case; existence theorem: finite abelian extensions correspond to open subgroups of finite index of K^x; functoriality; U^(v) maps onto the upper ramification group G^v" index="局所類体論|きょくしょるいたいろん, 局所相互写像|きょくしょそうごしゃぞう, 存在定理（局所類体論）|そんざいていり" refname="局所類体論"}
$K$ を局所体とする。
1. （**相互法則**）有限次アーベル拡大 $L/K$ ごとに、全射準同型 $\omega_{L/K}:K^{\times}\to\operatorname{Gal}(L/K)$ があり、核は $N_{L/K}(L^{\times})$。したがって $[K^{\times}:N(L^{\times})]=[L:K]$。$L/K$ が不分岐なら、$\omega_{L/K}(\pi)$ はフロベニウス自己同型である。$L\subseteq L'$ なら $\omega_{L'/K}$ の $L$ への制限は $\omega_{L/K}$。
2. （**存在定理**）$L\mapsto N(L^{\times})$ は、有限次アーベル拡大と、$K^{\times}$ の指数有限な開部分群との、包含を逆にする全単射である。
3. （**分岐との対応**）$\omega_{L/K}(U_{K}^{(v)})$ は上付き番号の分岐群 $G^{v}$ に等しい。特に $\omega_{L/K}(U_{K})$ は惰性群で、$L/K$ が不分岐 $\iff U_{K}\subseteq N(L^{\times})$。

（Se XIII–XV、Ne V。証明には有限群のテイト・コホモロジー（\ref{ha:page-tate-cohomology}）とブラウアー群の計算、\ref{ha:tate-nakayama} が要るので、ここでは証明しない。）
:::

::: intuition
局所体の「ガロア群の可換な部分」は、乗法群 $K^{\times}=\pi^{\Z}\times U_{K}$ にすでに書き込まれている：$\pi$ の冪の部分が不分岐拡大（フロベニウス）を、単元の部分が分岐を受け持ち、単元群のフィルトレーション $U^{(v)}$ が分岐群の深さに対応する。
:::

## 不分岐拡大のノルム群 {#nt:sec-lcft-unramified}

::: theorem 不分岐拡大のノルム群 {#nt:unramified-norm-group keywords="for an unramified extension L/K of local fields of degree n: N(U_L^(i)) = U_K^(i) for all i >= 0, N(L^x) = pi^{nZ} x U_K, and K^x / N(L^x) is cyclic of order n generated by the class of pi" index="不分岐拡大のノルム群|ふぶんきかくだいののるむぐん" refname="不分岐拡大のノルム群"}
$L/K$ を $n$ 次不分岐拡大とする。
1. すべての $i\ge0$ で $N_{L/K}(U_{L}^{(i)})=U_{K}^{(i)}$。
2. $N_{L/K}(L^{\times})=\pi^{n\Z}\times U_{K}$ で、$K^{\times}/N(L^{\times})$ は $\pi$ の類で生成される位数 $n$ の巡回群。
:::

::: intuition
ノルムは剰余体では有限体のノルムとトレースになり、どちらも全射である。だから単元は 1 桁ずつノルムで近似でき、完備性から正確にノルムになる。一方、付値は $n$ 倍されるので、$\pi$ の冪については $n$ の倍数しか届かない。
:::

::: proof
**Step 1（剰余体での全射性）.** 【主張：$N_{\ell/k}:\ell^{\times}\to k^{\times}$, $\mathrm{Tr}_{\ell/k}:\ell\to k$ は全射】$\ell=\mathbb{F}_{q^{n}}$ のガロア群は $y\mapsto y^{q}$ で生成されるので $N(y)=y^{1+q+\cdots+q^{n-1}}=y^{(q^{n}-1)/(q-1)}$。$\ell^{\times}$ の生成元 $g$ の像は位数 $q-1$ で $k^{\times}$ を生成する。トレースは記法のとおり。

**Step 2（ノルムの還元）.** $L/K$ はガロアで $G=\langle\varphi\rangle$、$\pi$ は $L$ の一意化元でもある（$e=1$）。$y\in U_{L}$ について $N(y)=\prod_{\sigma}\sigma(y)$ の還元は $\prod_{\sigma}\bar\sigma(\bar y)=N_{\ell/k}(\bar y)$。$i\ge1$, $b\in B$ について
$$N(1+\pi^{i}b)=\prod_{\sigma}(1+\pi^{i}\sigma(b))\equiv1+\pi^{i}\sum_{\sigma}\sigma(b)=1+\pi^{i}\mathrm{Tr}_{L/K}(b)\pmod{\pi^{i+1}},$$
$\mathrm{Tr}_{L/K}(b)$ の還元は $\mathrm{Tr}_{\ell/k}(\bar b)$。

**Step 3（1：逐次近似）.** 【主張：$x\in U_{K}^{(i)}$ はある $y\in U_{L}^{(i)}$ のノルム】$i=0$ なら Step 1 から $N(y_{0})\equiv x\pmod\pi$ となる $y_{0}\in U_{L}$ があり、$x/N(y_{0})\in U_{K}^{(1)}$。$x\in U_{K}^{(j)}$（$j\ge1$）なら $x=1+\pi^{j}a$ で、Step 1 から $\mathrm{Tr}(\bar b)=\bar a$ となる $b$ をとると、Step 2 から $x/N(1+\pi^{j}b)\in U_{K}^{(j+1)}$。これを繰り返すと $y_{j}\in U_{L}^{(j)}$ で $x/N(y_{0}y_{1}\cdots y_{m})\in U_{K}^{(m+1)}$。$y\defeq\prod_{j}y_{j}$ は収束し（$y_{j}\to1$）、ノルムの連続性（\ref{nt:norms-equivalent-complete} からノルムは多項式写像で連続）から $N(y)=x$。$U_{L}^{(i)}$ の元のノルムが $U_{K}^{(i)}$ に入ることは Step 2 から。

**Step 4（2）.** $v_{K}(N(y))=f\,v_{L}(y)=n\,v_{L}(y)$（$L$ の付値を $\pi$ で正規化）なので $N(L^{\times})\subseteq\pi^{n\Z}U_{K}$、逆の包含は $N(\pi)=\pi^{n}$ と 1。商は $\pi^{\Z}/\pi^{n\Z}\cong\Z/n\Z$。
:::

::: remark
局所類体論の相互写像は、この同型 $K^{\times}/N(L^{\times})\cong\Z/n\Z$ と $\operatorname{Gal}(L/K)=\langle\varphi\rangle\cong\Z/n\Z$ を、$\pi\mapsto\varphi$ で結んだものである。分岐する場合には、ノルム群の計算に分岐群の情報（Se V）とコホモロジーが必要になる。
:::

## ヒルベルト記号 {#nt:sec-lcft-hilbert}

::: definition ヒルベルト記号 {#nt:hilbert-symbol keywords="Hilbert symbol (a,b)_v = 1 if z^2 = a x^2 + b y^2 has a nonzero solution in Q_v, -1 otherwise" index="ヒルベルト記号|ひるべるときごう" refname="ヒルベルト記号"}
$\mathbb{Q}$ の素点 $v$ と $a,b\in\mathbb{Q}_{v}^{\times}$ について、$z^{2}=ax^{2}+by^{2}$ が $(x,y,z)\neq(0,0,0)$ の解を $\mathbb{Q}_{v}$ にもつとき $(a,b)_{v}\defeq1$、もたないとき $-1$ とする。
:::

::: intuition
ヒルベルト記号は「$b$ が $\mathbb{Q}_{v}(\sqrt a)$ のノルムかどうか」を表す符号で、局所類体論の相互写像を 2 次拡大 $\mathbb{Q}_{v}(\sqrt a)$ に制限したもの $\omega(b)(\sqrt a)/\sqrt a$ に一致する、と知られている。
:::

::: proposition ヒルベルト記号の基本性質 {#nt:hilbert-symbol-basic keywords="(a,b)_v = 1 iff b is a norm from Q_v(sqrt a); (a,b) depends only on square classes; symmetric; (a,-a) = 1, (a, 1-a) = 1; (a,b) = (a,-ab); (a,b)_infinity = -1 iff a < 0 and b < 0" index="ヒルベルト記号の性質|ひるべるときごうのせいしつ"}
1. $(a,b)_{v}=1$ と、$b\in N(\mathbb{Q}_{v}(\sqrt a)^{\times})$（$a$ が平方数なら $\mathbb{Q}_{v}(\sqrt a)=\mathbb{Q}_{v}$ で条件は自明）は同値。
2. $(a,b)_{v}$ は $a,b$ の平方類だけで決まり、$(a,b)_{v}=(b,a)_{v}$、$(a,-a)_{v}=1$、$a\neq1$ なら $(a,1-a)_{v}=1$、$(a,b)_{v}=(a,-ab)_{v}$。
3. $(a,b)_{\infty}=-1\iff a<0$ かつ $b<0$。
:::

::: proof
**Step 1（1）.** $a$ が平方数なら $(x,y,z)=(1,0,\sqrt a)$ が解で、両辺とも成り立つ。そうでないとき、解 $(x,y,z)$ で $y=0$ なら $z^{2}=ax^{2}$ から $x=z=0$ となるので $y\neq0$、$b=\frac{z^{2}-ax^{2}}{y^{2}}=N\bigl(\frac{z+x\sqrt a}{y}\bigr)$。逆に $b=z^{2}-ax^{2}$ なら $(x,1,z)$ が解。

**Step 2（2）.** 平方類は変数の取り替えで吸収できる。対称性は定義から。$(a,-a)$：$a x^{2}-ay^{2}=0$ に $(1,1,0)$。$(a,1-a)$：$(1,1,1)$。$(a,-ab)$：$a$ が非平方のとき、ノルム群 $N$ は乗法群の部分群で $-a=N(\sqrt a)\in N$ なので、$b\in N\iff-ab\in N$。

**Step 3（3）.** $a,b<0$ なら右辺は $\le0$ で、$z^{2}=ax^{2}+by^{2}$ は $x=y=z=0$ しか解をもたない。どちらかが正なら、例えば $a>0$ で $(1,0,\sqrt a)$ が解。
:::

::: theorem ヒルベルト記号の明示公式（奇素数） {#nt:hilbert-symbol-odd keywords="for p odd, a = p^alpha u, b = p^beta v: (a,b)_p = (-1)^{alpha beta (p-1)/2} (u/p)^beta (v/p)^alpha; in particular the Hilbert symbol is bilinear" index="ヒルベルト記号の明示公式|ひるべるときごうのめいじこうしき" refname="ヒルベルト記号の明示公式"}
$p$ を奇素数、$a=p^{\alpha}u$, $b=p^{\beta}v$（$u,v\in\mathbb{Z}_{p}^{\times}$）とすると
$$(a,b)_{p}=(-1)^{\alpha\beta\frac{p-1}{2}}\Bigl(\frac{u}{p}\Bigr)^{\beta}\Bigl(\frac{v}{p}\Bigr)^{\alpha}.$$
特に $(a,b)_{p}$ は各変数について乗法的（双線形）である。
:::

::: intuition
奇素数では、$\mathbb{Q}_{p}^{\times}$ の平方類は「$p$ の指数の偶奇」と「単元部分が平方かどうか」の 2 ビットで決まる。単元どうしなら必ず解があり、一方だけが $p$ を含めば相手の単元が平方かどうか（ルジャンドル記号）で決まる。両方が $p$ を含む場合は $-1$ の平方性が余分な符号として現れる。
:::

::: proof
**Step 1（単元どうし）.** 【主張：$(u,v)_{p}=1$】$ux^{2}$ と $1-vy^{2}$ は $x,y$ が $\mathbb{F}_{p}$ を動くとき、それぞれ $\frac{p+1}{2}$ 個の値をとるので、ある $x_{0},y_{0}$ で $ux_{0}^{2}+vy_{0}^{2}\equiv1\pmod p$。$f(z)\defeq z^{2}-ux_{0}^{2}-vy_{0}^{2}$ は $\bmod p$ で $z=1$ を単根にもつ（$2\neq0$）ので、ヘンゼルの補題（\ref{nt:hensel-corollaries} の 1）で $\mathbb{Z}_{p}$ の根 $z$ があり、$(x_{0},y_{0},z)$ は解。

**Step 2（一方だけが $p$ を含む）.** 【主張：$(pu,v)_{p}=(\tfrac vp)$】$(\tfrac vp)=1$ なら $v$ は $\mathbb{Z}_{p}$ で平方（ヘンゼル）で、$(pu,v)=1$（\ref{nt:hilbert-symbol-basic} の 1 で $\mathbb{Q}_{p}(\sqrt v)=\mathbb{Q}_{p}$）。$(\tfrac vp)=-1$ とし、$z^{2}=pux^{2}+vy^{2}$ に解があると仮定する。成分の付値の最小値が $0$ になるようにスケールすると（$x,y,z\in\mathbb{Z}_{p}$、どれかが単元）、$\bmod p$ で $z^{2}\equiv vy^{2}$。$y\not\equiv0$ なら $v\equiv(z/y)^{2}$ で矛盾、$y\equiv0$ なら $z\equiv0$ で、$pux^{2}=z^{2}-vy^{2}\equiv0\pmod{p^{2}}$ から $x\equiv0$ となり、どれも単元でないことに矛盾。

**Step 3（両方が $p$ を含む）.** $(pu,pv)=(pu,-pu\cdot pv)=(pu,-p^{2}uv)=(pu,-uv)$（\ref{nt:hilbert-symbol-basic} の 2）$=(\tfrac{-uv}{p})=(-1)^{\frac{p-1}{2}}(\tfrac up)(\tfrac vp)$（Step 2、オイラーの規準 \ref{nt:euler-criterion-elementary}）。

**Step 4（まとめ）.** 平方類だけで決まるので $\alpha,\beta\in\{0,1\}$ としてよく、Step 1–3 と対称性で 4 つの場合が公式と一致する。右辺は $a$ と $b$ のそれぞれについて乗法的。
:::

::: fact ヒルベルト記号の明示公式（$p=2$） {#nt:hilbert-symbol-two keywords="2-adic Hilbert symbol: (2^alpha u, 2^beta v)_2 = (-1)^{eps(u) eps(v) + alpha omega(v) + beta omega(u)} with eps(u) = (u-1)/2, omega(u) = (u^2-1)/8" index="ヒルベルト記号（2 進）|ひるべるときごう"}
$a=2^{\alpha}u$, $b=2^{\beta}v$（$u,v\in\mathbb{Z}_{2}^{\times}$）について、$\varepsilon(u)\defeq\frac{u-1}{2}\bmod2$, $\omega(u)\defeq\frac{u^{2}-1}{8}\bmod2$ とすると
$$(a,b)_{2}=(-1)^{\varepsilon(u)\varepsilon(v)+\alpha\,\omega(v)+\beta\,\omega(u)}.$$
（Serre, *A Course in Arithmetic*, 第 III 章 Theorem 1。証明は奇素数の場合と同様だが、$\mathbb{Z}_{2}^{\times}$ の平方類が $\{\pm1,\pm5\}$ になることを使う。ここでは証明しない。）
:::

::: theorem ヒルベルトの積公式 {#nt:hilbert-product-formula keywords="Hilbert's product formula: for a, b in Q^x, (a,b)_v = 1 for almost all v and the product over all places is 1; equivalent to quadratic reciprocity with the supplementary laws" index="ヒルベルトの積公式|ひるべるとのせきこうしき" refname="ヒルベルトの積公式"}
$a,b\in\mathbb{Q}^{\times}$ について、有限個を除くすべての素点 $v$ で $(a,b)_{v}=1$ で、$\prod_{v}(a,b)_{v}=1$。
:::

::: intuition
積公式は平方剰余の相互法則を、すべての素点（$\infty$ と $2$ を含む）を対等に扱う形に書き直したものである。$(p,q)_{p}=(\tfrac qp)$, $(p,q)_{q}=(\tfrac pq)$ で、残りの $(p,q)_{2}$ が相互法則の符号 $(-1)^{\frac{p-1}{2}\frac{q-1}{2}}$ を受け持つ。
:::

::: proof
**Step 1（有限性）.** 【主張：$(a,b)_{v}\neq1$ となる $v$ は有限個】$a,b$ がともに $p$ 進単元（$p$ 奇素数）なら \ref{nt:hilbert-symbol-odd} から $(a,b)_{p}=1$。それ以外の $p$ は有限個。

**Step 2（生成元への帰着）.** 【主張：$-1$, $2$, 奇素数の組について示せばよい】\ref{nt:hilbert-symbol-odd}, \ref{nt:hilbert-symbol-two}（と $v=\infty$ の \ref{nt:hilbert-symbol-basic} の 3）から、各 $(\cdot,\cdot)_{v}$ は双線形なので、$a,b$ が $-1$, $2$, 奇素数のときに示せばよい（$\mathbb{Q}^{\times}$ はこれらで生成される）。さらに対称性と $(a,a)=(a,-1)$（$(a,-a)=1$ と双線形性）から、次の場合で十分。

**Step 3（場合分け）.** 【主張：各組で積は $1$】$\varepsilon,\omega$ は \ref{nt:hilbert-symbol-two} のとおりとし、$p,q$ は相異なる奇素数。
- $(-1,-1)$：$v=\infty$ と $v=2$（$\varepsilon(-1)^{2}=1$）で $-1$、他は $1$。積 $1$。
- $(-1,p)$：$v=p$ で $(\tfrac{-1}{p})=(-1)^{\varepsilon(p)}$、$v=2$ で $(-1)^{\varepsilon(-1)\varepsilon(p)}=(-1)^{\varepsilon(p)}$。積 $1$。
- $(-1,2)$：$v=2$ で $(-1)^{\omega(-1)}=1$、他も $1$。
- $(2,2)=(2,-1)=1$（前の場合）。
- $(2,p)$：$v=p$ で $(\tfrac2p)$、$v=2$ で $(-1)^{\omega(p)}$。第 2 補充法則（\ref{nt:second-supplementary-elementary}）から等しく、積 $1$。
- $(p,q)$：$v=p$ で $(\tfrac qp)$、$v=q$ で $(\tfrac pq)$、$v=2$ で $(-1)^{\varepsilon(p)\varepsilon(q)}$。相互法則（\ref{nt:quadratic-reciprocity-elementary}）から積 $1$。
- $(p,p)=(p,-1)$：前の場合に帰着。
:::

::: example
1. $(3,5)_{v}$：$v=3$ で $(\tfrac53)=-1$、$v=5$ で $(\tfrac35)=-1$、$v=2$ で $(-1)^{\varepsilon(3)\varepsilon(5)}=(-1)^{1\cdot0}=1$、$v=\infty$ で $1$。積 $1$。実際 $z^{2}=3x^{2}+5y^{2}$ は $\mathbb{Q}_{3}$ でも $\mathbb{Q}_{5}$ でも非自明解をもたない。
2. $(-1,-1)_{v}$ が $-1$ になるのは $v=2,\infty$ だけ：$z^{2}+x^{2}+y^{2}=0$ は $\mathbb{R}$ と $\mathbb{Q}_{2}$ でだけ非自明解をもたない（$\mathbb{Q}_{2}$ では $\bmod8$ の計算から）。
3. 局所類体論の 2 次の場合：$p$ 奇素数で $\mathbb{Q}_{p}(\sqrt u)$（$u$ は非平方な単元）は不分岐 2 次拡大で、$(u,b)_{p}=(-1)^{v_{p}(b)}$。これは「$b$ がノルム $\iff$ $v_{p}(b)$ が偶数」、すなわち \ref{nt:unramified-norm-group} の 2（$n=2$）と一致する。
:::

::: hypcheck
- **不分岐拡大のノルム群**：剰余体の有限性はノルムとトレースの全射性（Step 1）に、完備性は逐次近似の収束（Step 3）に使った。分岐拡大では $N(U_{L})\neq U_{K}$ となる（$\mathbb{Q}_{p}(\sqrt p)$ では $N(U_{L})$ は $U_{K}$ の指数 2 の部分群）。
- **奇素数の明示公式**：$p$ が奇数であることは、ヘンゼルの補題の単根条件（$2\neq0\bmod p$）と、平方類の個数 4 に使った。
- **積公式**：$p=2$ の明示公式を事実として使った。この部分を除けば、証明は相互法則と補充法則に帰着される。
:::

## 問題 {#nt:sec-lcft-problems}

::: problem {#nt:prob-lcft-hilbert-7}
$(2,7)_{7}$, $(3,7)_{7}$, $(7,7)_{7}$ を求めよ。
:::

::: solution
$(2,7)_{7}=(\tfrac27)=1$（$7\equiv-1\pmod8$）。$(3,7)_{7}=(\tfrac37)$：$3$ は $\bmod7$ の平方（$1,2,4$）でないので $-1$。$(7,7)_{7}=(7,-1)_{7}=(\tfrac{-1}{7})=-1$（$7\equiv3\pmod4$）。
:::

::: problem {#nt:prob-lcft-norm-unramified}
$p$ 奇素数、$L=\mathbb{Q}_{p}(\sqrt u)$（$u$ は非平方な単元）について、$p\notin N(L^{\times})$ と $u\in N(L^{\times})$ を、ノルム群の定理とヒルベルト記号の両方で確かめよ。
:::

::: solution
\ref{nt:unramified-norm-group} から $N(L^{\times})=p^{2\Z}\times\mathbb{Z}_{p}^{\times}$ なので $p\notin N$, $u\in N$。ヒルベルト記号：$(u,p)_{p}=(\tfrac up)=-1$、$(u,u)_{p}=(u,-1)_{p}=1$（単元どうし、\ref{nt:hilbert-symbol-odd}）。\ref{nt:hilbert-symbol-basic} の 1 と一致する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 不分岐拡大のノルム群の計算は、ガロア群が巡回群であることと剰余体のノルム・トレースの全射性だけを使い、類体論の一般論を使わない。

**前提を変えると.**
- **局所クロネッカー–ウェーバーの定理**：$\mathbb{Q}_{p}$ の最大アーベル拡大は $\mathbb{Q}_{p}^{\mathrm{ur}}\cdot\mathbb{Q}_{p}(\zeta_{p^{\infty}})$（最大不分岐拡大と $p$ 冪の 1 の冪根の合成）であると知られている。一般の局所体では、円分拡大の代わりに**ルービン–テイトの形式群**の等分点が完全分岐部分を生成する（Se XIV §7、Ne V §5）。
- 大域類体論では、イデール類群が局所体の乗法群の役割を果たし、ヒルベルトの積公式はアルティンの相互法則の 2 次の場合になる（段階 2 の次の系列で扱う予定）。
- ヒルベルト記号は、2 次形式の局所的な分類（ハッセ不変量）に使われ、ハッセ–ミンコフスキーの定理（2 次形式は各局所体で同値なら $\mathbb{Q}$ 上同値）の鍵になる。

**高い視点から：類体論と双対性.** 局所類体論は、局所体のガロア群の最大アーベル商 $G_{K}^{\mathrm{ab}}$ と乗法群 $K^{\times}$ の副有限完備化の同型として述べられ、コホモロジーの言葉では、ブラウアー群 $\operatorname{Br}(K)\cong\mathbb{Q}/\Z$（不変量写像）とテイト–中山の双対性から導かれる。ヒルベルト記号はカップ積 $H^{1}\times H^{1}\to H^{2}=\operatorname{Br}(K)[2]=\{\pm1\}$ そのもので、その非退化性が局所的な双対性の最も簡単な例である。比喩で言えば、局所類体論は局所体の「対称性の表」（ガロア群）と「数の表」（乗法群）が、可換な部分については同じ表であることを主張し、ヒルベルト記号はその表の 2 次の部分を一つの符号として読み出す。
:::
