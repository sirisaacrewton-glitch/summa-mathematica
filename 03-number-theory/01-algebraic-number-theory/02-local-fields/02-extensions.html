# 完備体の有限次拡大 {#nt:page-local-extensions keywords="norms on finite dimensional vector spaces over a complete field are equivalent, unique extension of an absolute value to a finite extension, |x| = |N(x)|^{1/n}, valuation ring of the extension is the integral closure, ramification index e and residue degree f, ef = n, B is free of rank n over A, Krasner's lemma, Galois conjugates are equidistant, compactness of the valuation ring of a local field, local fields"}

完備な体 $K$ の有限次拡大 $L$ では、$K$ の絶対値はただ一通りに $L$ へ拡張され、その値はノルムを使って $\abs{x}=\abs{N_{L/K}(x)}^{1/n}$ と書ける。このページでは、まず完備体上の有限次元ベクトル空間のノルムがすべて同値であることを示し、それを使って拡張の一意性を、ヘンゼルの補題の系を使って存在を証明する。次に、離散付値の場合に分岐指数 $e$ と剰余次数 $f$ について $ef=n$ を示し、付値環 $B$ が $A$ 上階数 $n$ の自由加群であることを導く。最後に、近い元は同じ体を生成するという**クラスナーの補題**を示し、局所体（剰余体が有限な完備離散付値体）の付値環がコンパクトであることを確かめる。

## 記法と定義の確認 {#nt:sec-le-notation}

::: notation
- $K$ は完備離散付値体、$v$, $A$, $\mathfrak m=\pi A$, $k$ は \ref{nt:complete-dvf-structure} のとおりで、$\abs x=c^{v(x)}$（$0<c<1$）とする。\ref{nt:hensel-corollaries} の 3（既約多項式の係数の評価）を使う。
- 体の拡大 $L/K$ のノルム $N_{L/K}$ とその性質は \ref{fld:norm-trace-embeddings}、\ref{fld:norm-trace-tower}。$x\in L$ の $K$ 上の最小多項式を $g$, $d\defeq\deg g$ とすると $N_{L/K}(x)=\bigl((-1)^{d}g(0)\bigr)^{n/d}$（$n=[L:K]$）。
- 整拡大と整閉包は \ref{ring:integral-def}。\ref{fld:fundamental-theorem} と \ref{fld:normal-closure} を使う。
- 体系は $\ZF$。
:::

## ノルムの同値性 {#nt:sec-le-norms}

::: lemma 完備体上のノルムの同値性 {#nt:norms-equivalent-complete keywords="on a finite dimensional vector space over a complete valued field all norms are equivalent to the maximum norm in a basis; the space is complete and finite dimensional subspaces are closed" index="ノルムの同値性（完備体上）|のるむのどうちせい" refname="完備体上のノルムの同値性"}
$K$ を完備な（自明でない）絶対値つきの体、$V$ を基底 $e_{1},\dots,e_{n}$ をもつ $K$ ベクトル空間とし、$\lVert\cdot\rVert$ を $V$ のノルム（$\lVert x\rVert=0\iff x=0$, $\lVert ax\rVert=\abs a\lVert x\rVert$, 三角不等式）とする。$\abs{\sum x_{i}e_{i}}_{\max}\defeq\max\abs{x_{i}}$ とすると、正の定数 $c,C$ で $c\abs x_{\max}\le\lVert x\rVert\le C\abs x_{\max}$。特に $V$ は $\lVert\cdot\rVert$ について完備で、部分空間は閉。
:::

::: intuition
完備な体の上では、有限次元の空間の「長さの測り方」はどれも本質的に同じで、座標の最大値で測るのと定数倍しか違わない。基底の一つのベクトルが残りの張る空間にいくらでも近づけるとすると、完備な部分空間は閉じているので、そのベクトルが部分空間に入ってしまい矛盾する。
:::

::: proof
**Step 1（上からの評価）.** 【主張：$\lVert x\rVert\le C\abs x_{\max}$】$\lVert\sum x_{i}e_{i}\rVert\le\sum\abs{x_{i}}\lVert e_{i}\rVert\le C\abs x_{\max}$, $C\defeq\sum\lVert e_{i}\rVert$。

**Step 2（下からの評価：$n$ についての帰納法）.** 【主張：評価が成り立たなければ $e_{i}+z^{(k)}\to0$ となる列がある】$n=1$ は $\lVert x_{1}e_{1}\rVert=\abs{x_{1}}\lVert e_{1}\rVert$。$n-1$ 次元で正しいとし、下からの評価が成り立たないと仮定すると、$\lVert x^{(k)}\rVert<\frac1k\abs{x^{(k)}}_{\max}$ となる $x^{(k)}\neq0$ がある。最大の座標の番号ごとに分けると、ある番号 $i$ が無限に多くの $k$ で現れる（その最小の $i$ をとる）。その $k$ について最大座標で割った $y^{(k)}\defeq x^{(k)}/x^{(k)}_{i}=e_{i}+z^{(k)}$（$z^{(k)}\in W\defeq\operatorname{span}\{e_{j}:j\neq i\}$）は $\lVert y^{(k)}\rVert<\frac1k$。

**Step 3（矛盾）.** 【主張：$-e_{i}\in W$ となり矛盾】帰納法の仮定から $W$ 上のノルムは $\abs\cdot_{\max}$ と同値で、$K$ が完備なので $W$ は完備、したがって $V$ の中で閉。$z^{(k)}=y^{(k)}-e_{i}\to-e_{i}$ なので $-e_{i}\in W$ となり、基底であることに反する。

**Step 4（完備性）.** 【主張：$V$ は完備で部分空間は閉】$\abs\cdot_{\max}$ について $V\cong K^{n}$ は完備で、同値なノルムはコーシー列と収束を共有する。部分空間も同様に完備なので閉。
:::

## 絶対値の拡張 {#nt:sec-le-extension}

::: theorem 絶対値の拡張 {#nt:extension-of-absolute-value keywords="K complete for a discrete valuation, L/K of degree n: |x|_L = |N_{L/K}(x)|^{1/n} is the unique absolute value on L extending |.|; L is complete; its valuation ring B is the integral closure of A in L; the valuation of L is discrete" index="絶対値の拡張|ぜったいちのかくちょう" refname="絶対値の拡張"}
$L/K$ を $n$ 次拡大とする。
1. $\abs x_{L}\defeq\abs{N_{L/K}(x)}^{1/n}$ は $L$ の非アルキメデス的絶対値で、$K$ 上で $\abs\cdot$ と一致する。
2. $K$ 上で $\abs\cdot$ と一致する $L$ の絶対値は $\abs\cdot_{L}$ だけである。
3. $L$ は $\abs\cdot_{L}$ について完備で、付値環 $B\defeq\{\abs x_{L}\le1\}$ は $A$ の $L$ における整閉包。$L$ の付値 $v_{L}\defeq\frac1nv\circ N_{L/K}$ は値が $\frac1n\Z$ に入る離散付値である。
:::

::: intuition
拡大体の元の大きさは、そのすべての共役の大きさの幾何平均で測るのが自然で、ノルムがその積を与える。完備な体では、ヘンゼルの補題のおかげで「ノルムが小さい元は整である」が成り立ち、これが超距離不等式を保証する。一意性は、有限次元ではどのノルムも同値になることから来る。
:::

::: proof
**Step 1（整であることとノルム）.** 【主張：$x\in L$ について $\abs{N_{L/K}(x)}\le1\iff g\in A[x]\iff x$ は $A$ 上整】$\abs{N(x)}=\abs{g(0)}^{n/d}$ なので $\abs{N(x)}\le1\iff\abs{g(0)}\le1$。$g$ はモニックで既約なので、\ref{nt:hensel-corollaries} の 3 から係数の絶対値の最大は $\max(\abs{g(0)},1)$ で、$\abs{g(0)}\le1\iff g\in A[x]$。$g\in A[x]$ なら $x$ は整。逆に $x$ が整なら、離散付値環 $A$ は整閉（正規）なので、\ref{ring:minimal-polynomial-ideal}（$\mathfrak p=A$）から $g$ の係数は $A$ に入る。

**Step 2（1）.** 乗法性はノルムの乗法性から、$\abs x_{L}=0\iff x=0$。$x\in K$ なら $N(x)=x^{n}$。超距離不等式は「$\abs x_{L}\le1\Rightarrow\abs{1+x}_{L}\le1$」から従う（$\abs y_{L}\le\abs x_{L}$, $x\neq0$ なら $\abs{x+y}_{L}=\abs x_{L}\abs{1+y/x}_{L}\le\abs x_{L}$）。$\abs x_{L}\le1$ なら Step 1 から $x$ は整、$1+x$ も整で、再び Step 1 から $\abs{1+x}_{L}\le1$。

**Step 3（2）.** 【主張：$K$ 上で一致する絶対値は $\abs\cdot_{L}$ に等しい】$\abs\cdot'$ をそのような絶対値とすると、$\abs\cdot_{L}$ と $\abs\cdot'$ はともに $K$ ベクトル空間 $L$ のノルムで、\ref{nt:norms-equivalent-complete} から同値。$\abs x'<1\iff x^{m}\to0\iff\abs x_{L}<1$ なので、\ref{nt:equivalent-absolute-values} から $\abs\cdot'=\abs\cdot_{L}^{s}$。$K$ 上で一致し、$K$ の絶対値は自明でないので $s=1$。

**Step 4（3）.** 完備性は \ref{nt:norms-equivalent-complete}。$B$ が整閉包であることは Step 1。$v_{L}(x)=\frac1nv(N(x))\in\frac1n\Z$ で、$v_{L}(L^{\times})$ は $\Z$ の $\frac1n$ 倍の中の自明でない部分群なので離散。
:::

::: definition 分岐指数と剰余次数 {#nt:ramification-index-local keywords="ramification index e = [v_L(L^x) : v(K^x)], residue degree f = [l : k] for an extension of complete discretely valued fields; unramified (e = 1, l/k separable), totally ramified (f = 1)" index="分岐指数（局所体）|ぶんきしすう, 剰余次数（局所体）|じょうよじすう" refname="分岐指数と剰余次数"}
$L/K$ を有限次拡大、$B$ を $L$ の付値環、$\Pi$ を一意化元、$\ell\defeq B/\Pi B$ を剰余体とする。**分岐指数** $e\defeq[v_{L}(L^{\times}):v(K^{\times})]$（$\pi=\Pi^{e}\cdot$ 単元）と**剰余次数** $f\defeq[\ell:k]$ を定める。
:::

::: intuition
拡大すると「大きさの目盛り」が $e$ 倍に細かくなり、「桁に使える数字」（剰余体）が $f$ 次の拡大になる。両方を合わせると、拡大の次数がちょうど分け合われる。
:::

::: theorem 基本等式 {#nt:ef-equals-n keywords="for a finite extension L/K of complete discretely valued fields, B is a free A-module of rank n with basis omega_j Pi^i, and ef = n" index="基本等式 ef=n|きほんとうしき" refname="基本等式 ef=n"}
$L/K$ を $n$ 次拡大とし、$\omega_{1},\dots,\omega_{f}\in B$ を $\ell$ の $k$ 上の基底の持ち上げとする。このとき $\{\omega_{j}\Pi^{i}:1\le j\le f,\ 0\le i<e\}$ は $B$ の $A$ 上の基底で、特に $ef=n$。
:::

::: intuition
剰余体の基底の持ち上げ（$f$ 個）と、一意化元の冪 $1,\Pi,\dots,\Pi^{e-1}$（$e$ 個）を掛け合わせると、付値が互いにずれているので独立で、完備性から整数環全体を生成する。だから次数は $e\cdot f$ に分かれる。
:::

::: proof
**Step 1（1 段目の評価）.** 【主張：$a_{j}\in K$ について $\abs{\sum_{j}a_{j}\omega_{j}}_{L}=\max_{j}\abs{a_{j}}$】右辺を $\abs{a_{j_{0}}}$ とし、$a_{j_{0}}$ で割って $\max\abs{a_{j}}=1$ としてよい。$\sum a_{j}\omega_{j}$ の剰余類は $\sum\bar a_{j}\bar\omega_{j}$ で、$\bar a_{j_{0}}\neq0$ と $\bar\omega_{j}$ の独立性から $0$ でない。よって絶対値は $1$。

**Step 2（独立性）.** 【主張：$\sum_{i,j}a_{ij}\omega_{j}\Pi^{i}=0$ なら $a_{ij}=0$】$s_{i}\defeq\sum_{j}a_{ij}\omega_{j}$ とすると、Step 1 から $v_{L}(s_{i})\in v(K^{\times})\cup\{\infty\}$。$v_{L}(s_{i}\Pi^{i})=v_{L}(s_{i})+\frac ie\cdot v(\pi)$ は、$i$ が異なれば $v(K^{\times})$ を法として異なる（$0\le i<e$）。したがって $0$ でない項の付値はすべて異なり、和の付値はその最小値（\ref{nt:non-archimedean-criterion} の 2）で、和は $0$ にならない。よって $ef\le n$。

**Step 3（生成：近似）.** $M\defeq\sum_{i,j}A\omega_{j}\Pi^{i}$ とする。【主張：$B=M+\pi B$】$x\in B$ について、$\bar x=\sum\bar a_{0j}\bar\omega_{j}$ から $x-\sum a_{0j}\omega_{j}\in\Pi B$、その商についても同様、と $e$ 回繰り返すと $x\in\sum_{i<e}\sum_{j}A\omega_{j}\Pi^{i}+\Pi^{e}B=M+\pi B$。繰り返して $B=M+\pi^{r}B$（すべての $r$）。

**Step 4（生成：閉性）.** Step 2 から $\omega_{j}\Pi^{i}$ は $L$ の $K$ 上の基底の一部で、基底に延ばして \ref{nt:norms-equivalent-complete} を使うと座標は連続、$A$ は閉なので $M$ は $L$ の閉集合。$x\in B$ は $M$ の元で $\pi^{r}$ の精度で近似されるので $x\in M$。よって $B=M$ は階数 $ef$ の自由 $A$ 加群で、$L=K\cdot B$（$x\in L$ に対し $\pi^{r}x\in B$）から $n=ef$。
:::

## クラスナーの補題と局所体 {#nt:sec-le-krasner}

::: theorem クラスナーの補題 {#nt:krasner-lemma keywords="Krasner's lemma: if alpha is separable over K and |beta - alpha| < |alpha - alpha'| for all conjugates alpha' != alpha, then K(alpha) is contained in K(beta)" index="クラスナーの補題|くらすなーのほだい" refname="クラスナーの補題"}
$\alpha,\beta$ を $K$ 上代数的な元とし、$\alpha$ は $K$ 上分離的とする。$\alpha,\beta$ を含む $K$ の有限次ガロア拡大 $M$ をとり、その中の $\alpha$ の相異なる共役を $\alpha=\alpha_{1},\alpha_{2},\dots,\alpha_{d}$ とする。$\abs{\beta-\alpha}<\abs{\alpha-\alpha_{i}}$（$i\ge2$）なら $K(\alpha)\subseteq K(\beta)$。
:::

::: intuition
$\alpha$ に、$\alpha$ のどの共役よりも近い $\beta$ があれば、$\beta$ を固定する自己同型は $\alpha$ を動かせない：動かすと、共役どうしの距離より短い距離でつながってしまうからである。だから $\alpha$ は $\beta$ の生成する体に入る。
:::

::: proof
**Step 1（自己同型は絶対値を保つ）.** $\sigma\in\operatorname{Gal}(M/K)$ について $x\mapsto\abs{\sigma x}_{M}$ は $K$ 上で $\abs\cdot$ と一致する $M$ の絶対値なので、\ref{nt:extension-of-absolute-value} の 2 から $\abs{\sigma x}_{M}=\abs x_{M}$。

**Step 2（$\sigma\alpha=\alpha$）.** 【主張：$\sigma\in\operatorname{Gal}(M/K(\beta))$ は $\alpha$ を固定する】$\abs{\beta-\sigma\alpha}=\abs{\sigma(\beta-\alpha)}=\abs{\beta-\alpha}$ なので $\abs{\alpha-\sigma\alpha}\le\max(\abs{\alpha-\beta},\abs{\beta-\sigma\alpha})=\abs{\alpha-\beta}<\abs{\alpha-\alpha_{i}}$（$i\ge2$）。$\sigma\alpha$ は共役の一つなので $\sigma\alpha=\alpha$。

**Step 3（結論）.** $\alpha$ は $\operatorname{Gal}(M/K(\beta))$ の固定体 $K(\beta)$ に入る（\ref{fld:fundamental-theorem}）。
:::

::: proposition 局所体の付値環のコンパクト性 {#nt:local-field-compact keywords="if the residue field is finite then A is compact and K is locally compact; local field: complete discretely valued field with finite residue field" index="局所体|きょくしょたい, 局所コンパクト（局所体）|きょくしょこんぱくと" refname="局所体"}
剰余体 $k$ が有限な完備離散付値体を**局所体**（非アルキメデス的局所体）という。局所体の付値環 $A$ はコンパクトで、$K$ は局所コンパクトである。局所体の有限次拡大は局所体である。
:::

::: intuition
剰余体が有限なら、整数の $p$ 進展開の各桁は有限通りしかなく、付値環は「有限集合の無限直積」すなわちカントール集合のような空間になって、コンパクトになる。
:::

::: proof
**Step 1（点列コンパクト性）.** $q$ 元の代表系 $S=\{s_{0},\dots,s_{q-1}\}$ をとると、\ref{nt:complete-dvf-structure} から $A$ の元は桁の列 $(s_{n})\in S^{\N}$ と一対一に対応し、$\abs{x-y}\le c^{N}$ は最初の $N$ 桁が一致することと同値。$A$ の点列について、第 0 桁が同じ値をとる項が無限にある最小の値を選び、その部分列で第 1 桁について同じことを繰り返す（対角線論法。$S$ に順序をつけて最小のものを選ぶので選択公理は要らない）と、収束部分列が得られる。距離空間なので点列コンパクトはコンパクト。

**Step 2（局所コンパクト性と拡大）.** $x+A$ は $x$ のコンパクトな近傍。有限次拡大 $L$ は完備離散付値体（\ref{nt:extension-of-absolute-value}）で、剰余体 $\ell$ は $k$ の $f$ 次拡大で有限。
:::

::: example
1. $\mathbb{Q}_{p}(\sqrt p)/\mathbb{Q}_{p}$：$\abs{\sqrt p}=\abs{N(\sqrt p)}^{1/2}=\abs{-p}^{1/2}=p^{-1/2}$ なので $v_{L}(\sqrt p)=\frac12$、$e=2$, $f=1$。
2. $p$ 奇素数、$u\in\mathbb{Z}_{p}^{\times}$ を非平方な単元とすると、$\mathbb{Q}_{p}(\sqrt u)/\mathbb{Q}_{p}$ は $e=1$, $f=2$（剰余体は $\mathbb{F}_{p}(\sqrt{\bar u})=\mathbb{F}_{p^{2}}$）。
3. クラスナーの補題の帰結として、$\mathbb{Q}_{p}$ 上の既約分離多項式の係数を少し動かしても、根の生成する体は変わらない、と知られている（係数の連続性と根の連続性による）。
:::

::: hypcheck
- **ノルムの同値性**：$K$ の完備性は、帰納法の段階で部分空間 $W$ が閉であること（Step 3）に本質的。$\mathbb{Q}$ 上の $\mathbb{Q}(\sqrt2)$ では、2 つのノルム $\abs{a+b\sqrt2}$ と $\max(\abs a,\abs b)$ は同値でない（$\abs{a+b\sqrt2}$ を小さくする整数 $a,b$ がいくらでも大きくとれる）。
- **絶対値の拡張**：完備性はヘンゼルの補題の系（既約多項式の係数の評価）を通して存在に、ノルムの同値性を通して一意性に使った。
- **基本等式**：完備性は $M$ が閉であること（Step 4）に使った。完備でない数体の場合は、素イデアルが複数に分かれて $\sum e_{i}f_{i}=n$ になる（\ref{nt:local-decomposition}）。
- **クラスナーの補題**：$\alpha$ の分離性は、共役が相異なることとガロアの基本定理に使った。
:::

## 問題 {#nt:sec-le-problems}

::: problem {#nt:prob-le-zeta-p}
$L\defeq\mathbb{Q}_{p}(\zeta_{p})$（$\zeta_{p}$ は 1 の原始 $p$ 乗根）について、$\Phi_{p}(x+1)$ がアイゼンシュタイン多項式であることを使い、$\abs{\zeta_{p}-1}=p^{-1/(p-1)}$ と $e=p-1$, $f=1$ を示せ。
:::

::: solution
$\Phi_{p}(x+1)=x^{p-1}+\binom{p}{1}x^{p-2}+\cdots+\binom{p}{p-1}$ は、最高次以外の係数が $p$ で割れ、定数項 $p$ は $p^{2}$ で割れない。アイゼンシュタインの判定法から既約で、$[L:\mathbb{Q}_{p}]=p-1$。$N(\zeta_{p}-1)=(-1)^{p-1}\cdot p$（定数項）なので $\abs{\zeta_{p}-1}=p^{-1/(p-1)}$、$v_{L}(\zeta_{p}-1)=\frac{1}{p-1}$。値群が $\frac{1}{p-1}\Z$ を含むので $e\ge p-1=n$、基本等式から $e=p-1$, $f=1$。
:::

::: problem {#nt:prob-le-not-complete}
$\mathbb{Q}$ に $5$ 進絶対値を入れたとき、$\mathbb{Q}(i)$ への拡張が 2 通りあることを確かめ、完備性が一意性に必要であることを確認せよ。
:::

::: solution
$\mathbb{Q}_{5}$ には $\sqrt{-1}$ があり（\ref{nt:prob-av-sqrt-minus-one}）、その 2 つの値 $\pm\iota$ について埋め込み $\sigma_{\pm}:\mathbb{Q}(i)\to\mathbb{Q}_{5}$, $i\mapsto\pm\iota$ ができる。$\abs x_{\pm}\defeq\abs{\sigma_{\pm}(x)}_{5}$ は $\mathbb{Q}$ 上で $5$ 進絶対値と一致する絶対値。$\iota\equiv2\pmod5$ とすると $\abs{2-i}_{+}=\abs{2-\iota}_{5}<1$ だが $\abs{2-i}_{-}=\abs{2+\iota}_{5}=\abs4_{5}=1$（$2+\iota\equiv4$）。よって異なる。$\mathbb{Q}$ は完備でないので、\ref{nt:extension-of-absolute-value} の 2 は使えない。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 拡張の一意性（2）は、離散付値でなくても、完備な絶対値をもつ任意の体で成り立つ（ノルムの同値性だけを使う）。存在の証明ではヘンゼルの補題を使ったので離散付値を仮定したが、一般の完備非アルキメデス体でも成り立つ（Ne II.4.8）。

**前提を変えると.**
- アルキメデス的な完備体は $\mathbb{R}$ か $\mathbb{C}$ に限る（オストロフスキーのもう一つの定理）と知られている。
- 局所体は、$\mathbb{Q}_{p}$ の有限次拡大か、有限体上のローラン級数体 $\mathbb{F}_{q}((t))$ のどちらかである（Se II §4–5）と知られている。
- $\mathbb{Q}_{p}$ の与えられた次数の拡大は有限個しかない（クラスナーの補題と付値環のコンパクト性から導かれる）と知られている。$\mathbb{Q}_{p}$ の代数閉包の完備化 $\mathbb{C}_{p}$ は代数閉体である。

**高い視点から：ガロア群と絶対値.** 一意性の帰結として、完備体のガロア群の元は絶対値を保ち、共役はすべて同じ大きさをもつ。数体では、一つの素イデアルの上に複数の素イデアル（複数の絶対値）があり、ガロア群がそれらを推移的に入れ替える（\ref{nt:galois-transitive}）。完備化はその中の一つを選んで固定し、残る対称性が分解群になる。比喩で言えば、数体の素イデアルの上の複数の「見え方」を、完備化は一つの見え方に絞り込み、その見え方を保つ対称性だけを残す。
:::
