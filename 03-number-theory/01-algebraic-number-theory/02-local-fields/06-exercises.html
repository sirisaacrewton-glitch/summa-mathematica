# 演習：局所体 {#nt:page-exercises-local-fields keywords="exercises, p-adic numbers, absolute values, Hensel's lemma, extensions of local fields, ramification, Hilbert symbol"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#nt:sec-exlocal-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 絶対値と完備離散付値体 {#nt:sec-av-exercises}

対応するページ：\ref{nt:page-absolute-values}

::: problem ★ 基本：$\sqrt2$ の 7 進展開 {#nt:ex-av-sqrt2-7}
$x^{2}=2$ が $\mathbb{Q}_{7}$ に解をもつことを示し、$x\equiv3\pmod7$ となる解の $49$ を法とする値を求めよ。
:::

::: solution
$3^{2}=9\equiv2\pmod7$ で $2\cdot3\not\equiv0$ なので、\ref{nt:hensel-corollaries} の 1 から解がある。$x=3+7t$ とおくと $x^{2}=9+42t+49t^{2}\equiv2\pmod{49}$ は $7+42t\equiv0\pmod{49}$、すなわち $1+6t\equiv0\pmod7$、$t\equiv1$。よって $x\equiv10\pmod{49}$（$100=2+2\cdot49$）。
:::

::: problem ★★ 標準：$\mathbb{Q}_{p}^{\times}$ の平方類 {#nt:ex-av-square-classes}
$p$ を奇素数、$u\in\mathbb{Z}_{p}^{\times}$ を $\bar u$ が $\mathbb{F}_{p}$ の非平方であるものとする。$\mathbb{Q}_{p}^{\times}/(\mathbb{Q}_{p}^{\times})^{2}$ の代表系が $\{1,u,p,up\}$ であることを示せ。
:::

::: solution
\ref{nt:complete-dvf-structure} の 4 から $x=p^{n}w$（$w\in\mathbb{Z}_{p}^{\times}$）。$x$ が平方なら $n$ は偶数で $w$ も平方。単元 $w$ が平方であることと $\bar w$ が平方であることは同値（\ref{nt:hensel-corollaries} の 1。$x^{2}-w$ の $\bmod p$ の根は単根）。$\mathbb{F}_{p}^{\times}/(\mathbb{F}_{p}^{\times})^{2}$ は位数 2 で $\bar u$ が生成するので、$w$ の平方類は $1$ か $u$。$n$ の偶奇と合わせて 4 つの類 $1,u,p,up$。
:::

::: problem ★★ 標準：$\mathbb{Q}_{p}$ の 1 の冪根 {#nt:ex-av-roots-of-unity}
$p$ を奇素数とする。$\mathbb{Q}_{p}$ に含まれる 1 の冪根は $\mu_{p-1}$ に限ることを示し、相異なる奇素数 $p,q$ について $\mathbb{Q}_{p}$ と $\mathbb{Q}_{q}$ が体として同型でないことを導け。
:::

::: solution
1 の冪根 $\zeta$ は $\abs\zeta_{p}=1$ なので $\mathbb{Z}_{p}^{\times}=\mu_{p-1}\times U^{(1)}$（\ref{nt:hensel-corollaries} の 2）の有限位数の元で、$U^{(1)}$ に位数有限の元が $1$ しかないことを示せばよい。$1\neq\zeta\in U^{(1)}$ を $\zeta=1+p^{k}a$（$k\ge1$, $a\in\mathbb{Z}_{p}^{\times}$）と書く。素数 $\ell\neq p$ なら $\zeta^{\ell}\equiv1+\ell p^{k}a\not\equiv1\pmod{p^{k+1}}$。$\ell=p$ なら、$p$ が奇数なので $p\mid\binom p2$ で、$\zeta^{p}\equiv1+p^{k+1}a\not\equiv1\pmod{p^{k+2}}$。よって $\zeta$ の位数は素数で割れず、$\zeta$ は位数有限でない。したがって 1 の冪根の群は位数 $p-1$ の巡回群で、体の同型はこれを保つので、$p-1\neq q-1$ から $\mathbb{Q}_{p}\not\cong\mathbb{Q}_{q}$。
:::

## 完備体の有限次拡大 {#nt:sec-le-exercises}

対応するページ：\ref{nt:page-local-extensions}

::: problem ★ 基本：$\mathbb{Q}_{3}(\sqrt[3]{3})$ {#nt:ex-le-cube-root}
$L=\mathbb{Q}_{3}(\sqrt[3]{3})$ の次数、$e$, $f$ と、$\abs{\sqrt[3]3}$ を求めよ。
:::

::: solution
$x^{3}-3$ はアイゼンシュタイン多項式なので既約、$n=3$。$N(\sqrt[3]3)=3$ なので $\abs{\sqrt[3]3}=3^{-1/3}$, $v_{L}(\sqrt[3]3)=\frac13$。値群が $\frac13\Z$ を含むので $e\ge3$、基本等式 \ref{nt:ef-equals-n} から $e=3$, $f=1$。
:::

::: problem ★★ 標準：不分岐な 2 次拡大の一意性 {#nt:ex-le-unramified-quadratic}
$p$ を奇素数とする。$\mathbb{Q}_{p}$ の 2 次拡大 $\mathbb{Q}_{p}(\sqrt a)$（$a\in\{u,p,up\}$、$u$ は非平方な単元）のうち $e=1$ となるものは $\mathbb{Q}_{p}(\sqrt u)$ だけであることを示せ。
:::

::: solution
2 次拡大は平方類 $\{u,p,up\}$ に対応する（\ref{nt:ex-av-square-classes}）。$a=p$ または $up$ では $v_{L}(\sqrt a)=\frac12v_{p}(a)=\frac12$ なので $e=2$。$a=u$ では $v_{L}$ の値群を調べる：$x=b+c\sqrt u$ について $N(x)=b^{2}-uc^{2}$ で、$v_{p}(b^{2}-uc^{2})$ は偶数（$\min(2v(b),2v(c))$ でとられる。等しい付値の場合も、$\bar u$ が非平方なので先頭の項が打ち消し合わない）。よって $v_{L}(x)=\frac12v_{p}(N(x))\in\Z$, $e=1$。
:::

## 不分岐拡大と分岐拡大 {#nt:sec-ur-exercises}

対応するページ：\ref{nt:page-unramified-ramified}

::: problem ★ 基本：$\mathbb{Q}_{2}(\zeta_{3})$ {#nt:ex-ur-q2-zeta3}
$\mathbb{Q}_{2}(\zeta_{3})/\mathbb{Q}_{2}$ が 2 次不分岐拡大であることを示せ。
:::

::: solution
$\zeta_{3}$ は $x^{2}+x+1$ の根で、その還元は $\mathbb{F}_{2}$ で根をもたない（$x=0,1$ で値 $1$）ので既約、$\mathbb{F}_{4}=\mathbb{F}_{2}(\bar\zeta_{3})$ を生成する。\ref{nt:unramified-structure} の 1 から $\mathbb{Q}_{2}(\zeta_{3})$ は 2 次不分岐拡大（\ref{nt:unramified-local-field} の $K_{2}=\mathbb{Q}_{2}(\mu_{3})$ そのもの）。
:::

::: problem ★★ 標準：不分岐と完全分岐の共通部分 {#nt:ex-ur-intersection}
$e,f$ が拡大の塔について乗法的（$M\supseteq L\supseteq K$ で $e(M/K)=e(M/L)e(L/K)$、$f$ も同様）であることを確かめ、$\mathbb{Q}_{p}(\zeta_{p^{n}-1})\cap\mathbb{Q}_{p}(\zeta_{p})=\mathbb{Q}_{p}$ を示せ（共通の代数拡大体の中で考える）。
:::

::: solution
$e$ は値群の指数で $[v(M^{\times}):v(K^{\times})]=[v(M^{\times}):v(L^{\times})][v(L^{\times}):v(K^{\times})]$、$f$ は剰余体の次数で同様に乗法的。共通部分 $E$ は、不分岐拡大の部分拡大として $e(E/\mathbb{Q}_{p})\mid1$、完全分岐拡大 $\mathbb{Q}_{p}(\zeta_{p})$（\ref{nt:prob-le-zeta-p}）の部分拡大として $f(E/\mathbb{Q}_{p})\mid1$。基本等式から $[E:\mathbb{Q}_{p}]=ef=1$。
:::

## 分岐群 {#nt:sec-rg-exercises}

対応するページ：\ref{nt:page-ramification-groups}

::: problem ★ 基本：$\mathbb{Q}_{3}(\zeta_{9})$ の分岐群 {#nt:ex-rg-zeta9}
$L=\mathbb{Q}_{3}(\zeta_{9})$ の分岐群を求め、$\sum_{i\ge0}(\abs{G_{i}}-1)$ を計算せよ。
:::

::: solution
$G\cong(\Z/9\Z)^{\times}$（位数 6）。\ref{nt:cyclotomic-ramification-groups} から $G_{0}=G$、$i=1,2$ で $G_{i}=\{1,4,7\}$（$a\equiv1\pmod3$）、$i\ge3$ で $G_{i}=1$。和は $(6-1)+(3-1)+(3-1)=9$。これは $\mathbb{Q}(\zeta_{9})$ の判別式 $\pm3^{9}$ の指数と一致する（$f=1$ なので共役差積の付値と判別式の $3$ 進付値が等しい）。
:::

::: problem ★★ 標準：$\mathbb{Q}_{2}(\zeta_{8})$ の分岐群 {#nt:ex-rg-zeta8}
$L=\mathbb{Q}_{2}(\zeta_{8})$ について $i_{G}(\sigma_{a})$（$a=3,5,7$）と分岐群を求め、$G_{1}$ が $G_{0}$ の 2 シロー部分群であることを確かめよ。
:::

::: solution
$i_{G}(\sigma_{a})=2^{v_{2}(a-1)}$ から $i_{G}(\sigma_{3})=2$, $i_{G}(\sigma_{5})=4$, $i_{G}(\sigma_{7})=2$。$\sigma\in G_{i}\iff i_{G}(\sigma)\ge i+1$ なので $G_{0}=G_{1}=G$（位数 4）、$G_{2}=G_{3}=\{1,\sigma_{5}\}$、$G_{4}=1$。$G_{0}$ は位数 4 の 2 群なので $G_{1}=G_{0}$ が 2 シロー部分群で、$G_{0}/G_{1}=1$ は $\ell^{\times}=\mathbb{F}_{2}^{\times}=1$ と合う。和 $\sum(\abs{G_{i}}-1)=3+3+1+1=8$ は $\mathbb{Q}(\zeta_{8})$ の判別式 $2^{8}$ の指数と一致する。
:::

## 局所類体論とヒルベルト記号 {#nt:sec-lcft-exercises}

対応するページ：\ref{nt:page-local-class-field-theory}

::: problem ★ 基本：$(2,3)_{v}$ {#nt:ex-lcft-2-3}
すべての素点 $v$ について $(2,3)_{v}$ を求め、積公式を確かめよ。
:::

::: solution
$v=3$：$(\tfrac23)=-1$。$v=2$：$a=2$（$\alpha=1$, $u=1$）、$b=3$（$\beta=0$, $v=3$）で $(-1)^{\omega(3)}=(-1)^{1}=-1$（\ref{nt:hilbert-symbol-two}）。$v=\infty$：$1$。$p\ge5$：単元どうしで $1$。積は $(-1)(-1)=1$。
:::

::: problem ★★ 標準：局所的な障害 {#nt:ex-lcft-no-rational-solution}
$3x^{2}+5y^{2}=z^{2}$ が $\mathbb{Q}$ で $(0,0,0)$ 以外の解をもたないことを、ヒルベルト記号を使って示せ。
:::

::: solution
$\mathbb{Q}$ の非自明解は $\mathbb{Q}_{3}$ の非自明解でもある。$(3,5)_{3}$ は $a=3$（$\alpha=1$, $u=1$）、$b=5$（$\beta=0$, $v=5$）で $(\tfrac53)=(\tfrac23)=-1$（\ref{nt:hilbert-symbol-odd}）なので、$\mathbb{Q}_{3}$ に非自明解はない。よって $\mathbb{Q}$ にもない。（逆向きの「すべての $\mathbb{Q}_{v}$ で解があれば $\mathbb{Q}$ で解がある」がハッセ–ミンコフスキーの定理である。）
:::
