## 絶対値と完備離散付値体 {#nt:sec-av-exercises}

対応するページ：\ref{nt:page-absolute-values}

::: problem ★ 基本：$\sqrt2$ の 7 進展開 {#nt:ex-av-sqrt2-7}
$x^{2}=2$ が $\mathbb{Q}_{7}$ に解をもつことを示し、$x\equiv3\pmod7$ となる解の $49$ を法とする値を求めよ。
:::

::: solution
$3^{2}=9\equiv2\pmod7$ で $2\cdot3\not\equiv0$ なので、\ref{nt:hensel-corollaries} の 1 から解がある。$x=3+7t$ とおくと $x^{2}=9+42t+49t^{2}\equiv2\pmod{49}$ は $7+42t\equiv0\pmod{49}$、すなわち $1+6t\equiv0\pmod7$、$t\equiv1$。よって $x\equiv10\pmod{49}$（$100=2+2\cdot49$）。
:::

::: problem ★★ 標準：$\mathbb{Q}_{p}^{\times}$ の平方類 {#nt:ex-av-square-classes}
$p$ を奇素数、$u\in\mathbb{Z}_{p}^{\times}$ を $\bar u$ が $\mathbb{F}_{p}$ の非平方であるものとする。$\mathbb{Q}_{p}^{\times}/(\mathbb{Q}_{p}^{\times})^{2}$ の代表系が $\{1,u,p,up\}$ であることを示せ。
:::

::: solution
\ref{nt:complete-dvf-structure} の 4 から $x=p^{n}w$（$w\in\mathbb{Z}_{p}^{\times}$）。$x$ が平方なら $n$ は偶数で $w$ も平方。単元 $w$ が平方であることと $\bar w$ が平方であることは同値（\ref{nt:hensel-corollaries} の 1。$x^{2}-w$ の $\bmod p$ の根は単根）。$\mathbb{F}_{p}^{\times}/(\mathbb{F}_{p}^{\times})^{2}$ は位数 2 で $\bar u$ が生成するので、$w$ の平方類は $1$ か $u$。$n$ の偶奇と合わせて 4 つの類 $1,u,p,up$。
:::

::: problem ★★ 標準：$\mathbb{Q}_{p}$ の 1 の冪根 {#nt:ex-av-roots-of-unity}
$p$ を奇素数とする。$\mathbb{Q}_{p}$ に含まれる 1 の冪根は $\mu_{p-1}$ に限ることを示し、相異なる奇素数 $p,q$ について $\mathbb{Q}_{p}$ と $\mathbb{Q}_{q}$ が体として同型でないことを導け。
:::

::: solution
1 の冪根 $\zeta$ は $\abs\zeta_{p}=1$ なので $\mathbb{Z}_{p}^{\times}=\mu_{p-1}\times U^{(1)}$（\ref{nt:hensel-corollaries} の 2）の有限位数の元で、$U^{(1)}$ に位数有限の元が $1$ しかないことを示せばよい。$1\neq\zeta\in U^{(1)}$ を $\zeta=1+p^{k}a$（$k\ge1$, $a\in\mathbb{Z}_{p}^{\times}$）と書く。素数 $\ell\neq p$ なら $\zeta^{\ell}\equiv1+\ell p^{k}a\not\equiv1\pmod{p^{k+1}}$。$\ell=p$ なら、$p$ が奇数なので $p\mid\binom p2$ で、$\zeta^{p}\equiv1+p^{k+1}a\not\equiv1\pmod{p^{k+2}}$。よって $\zeta$ の位数は素数で割れず、$\zeta$ は位数有限でない。したがって 1 の冪根の群は位数 $p-1$ の巡回群で、体の同型はこれを保つので、$p-1\neq q-1$ から $\mathbb{Q}_{p}\not\cong\mathbb{Q}_{q}$。
:::
