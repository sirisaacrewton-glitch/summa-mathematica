# 代数的整数論（Algebraic Number Theory）

整数環、デデキント環とイデアル類群、判別式、素イデアルの分解、単数定理。

<p class="mn-msc">MSC2020: 11R</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-number-fields/index.html"><span class="mn-card-title">代数体</span><span class="mn-card-en">Number Fields</span><span class="mn-card-desc">代数体と整数環、判別式、素イデアルの分解、分解群と惰性群、分岐と差積、2 次体・円分体と平方剰余の相互法則、ミンコフスキーの定理とイデアル類群、単数定理、p 進数と完備化。</span><span class="mn-card-count">8 ページ</span></a>
<a class="mn-card" href="02-local-fields/index.html"><span class="mn-card-title">局所体</span><span class="mn-card-en">Local Fields</span><span class="mn-card-desc">絶対値とオストロフスキーの定理、完備離散付値体とヘンゼルの補題、完備体の拡大、不分岐・分岐拡大、分岐群、局所類体論とヒルベルト記号。Serre・Neukirch に対応。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="03-adeles-class-field-theory/index.html"><span class="mn-card-title">アデールと大域類体論</span><span class="mn-card-en">Adeles and Global Class Field Theory</span><span class="mn-card-desc">代数体の素点と積公式、アデール環とイデール群、イデール類群のコンパクト性と類群・単数群、巡回拡大でのイデール類群のエルブラン商（第一不等式）、大域類体論とヒルベルト類体。Neukirch・Cassels–Fröhlich に対応。</span><span class="mn-card-count">6 ページ</span></a>
</div>
