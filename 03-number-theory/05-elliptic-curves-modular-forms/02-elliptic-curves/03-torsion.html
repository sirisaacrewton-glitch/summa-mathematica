# 有理点の捩れとナゲル–ルッツの定理 {#nt:page-torsion-points keywords="elliptic curves over Q with integer coefficients, denominators of rational points: ord_p(x) = -2 nu and ord_p(y) = -3 nu, filtration E(p^nu), coordinates t = x/y and s = 1/y, the curve s = t^3 + A t s^2 + B s^3, t(P_1 + P_2) = t(P_1) + t(P_2) mod p^{3 nu}, E(p^nu) is a subgroup, E(p) has no nontrivial torsion, torsion points have integer coordinates, Nagell-Lutz theorem: y = 0 or y^2 divides 4A^3 + 27B^2, the identity 4A^3 + 27B^2 = (3x^2 + 4A) f'(x)^2 - 27 (x^3 + Ax - B) f(x), torsion of y^2 = x^3 + 1 is Z/6, Mazur's theorem"}

整数係数の楕円曲線 $y^{2}=x^{3}+Ax+B$ の有限位数の有理点（**捩れ点**）は、座標が**整数**で、さらに $y=0$ か $y^{2}\mid4A^{3}+27B^{2}$ をみたす（**ナゲル–ルッツの定理**）。したがって $E(\mathbb{Q})$ の捩れ部分群は有限個の候補を調べるだけで決まる。証明の鍵は、分母が $p$ で割れる有理点の集合が $p$ 進的な「小ささ」で部分群の列 $E(p)\supseteq E(p^{2})\supseteq\cdots$ をなし、その上で群演算が座標 $t=x/y$ の足し算で近似されることである。$t$ の足し算は捩れをもたないので、$E(p)$ にも捩れ点はない。

## 記法と定義の確認 {#nt:sec-tor-notation}

::: notation
- 標準形の定義、加法の公式、$E(\mathbb{Q})$ が群であること、座標変換 $(x,y)\mapsto(u^{2}x,u^{3}y)$ は \ref{nt:elliptic-curve}, \ref{nt:addition-formulas}, \ref{nt:elliptic-group-law}, \ref{nt:j-invariant-curve}。
- この節では $A,B\in\mathbb{Z}$ とする（$u$ を分母の積にとれば、$\mathbb{Q}$ 上の任意の楕円曲線は整数係数の曲線と同型）。$f(x)\defeq x^{3}+Ax+B$, $D\defeq4A^{3}+27B^{2}\neq0$。
- 素数 $p$ について $\operatorname{ord}_{p}$ は $p$ 進付値（$\operatorname{ord}_{p}0=\infty$）、$R\defeq\mathbb{Z}_{(p)}=\{m/n:p\nmid n\}$。
- **直線と交点**：射影平面の直線 $\ell$ と $E$ の交点は、$\ell$ を射影直線と同一視して曲線の斉次 3 次式を制限した 3 次形式の根で、重複度込みで 3 個。弦と接線の法則の「第 3 の交点」はその第 3 の根であり、どのアフィン座標で計算しても同じ点を与える（同じ 3 次形式の非斉次化）。
- 体系は $\ZF$。
:::

## 分母の構造と部分群の列 {#nt:sec-tor-filtration}

::: lemma 有理点の分母 {#nt:rational-point-denominators keywords="for (x, y) in E(Q) with A, B integers, if p divides a denominator of x or y then ord_p(x) = -2 nu and ord_p(y) = -3 nu for some nu >= 1" index="有理点の分母|ゆうりてんのぶんぼ" refname="有理点の分母"}
$(x,y)\in E(\mathbb{Q})$ で $\operatorname{ord}_{p}x<0$ または $\operatorname{ord}_{p}y<0$ なら、ある $\nu\ge1$ で $\operatorname{ord}_{p}x=-2\nu$, $\operatorname{ord}_{p}y=-3\nu$。
:::

::: intuition
有理点の座標の分母は勝手には現れない：$x$ の分母は平方、$y$ の分母は立方で、両者は同じ数 $e$ の冪である。曲線の式の次数（$y^{2}$ と $x^{3}$）がそれを強制する。
:::

::: proof
$\operatorname{ord}_{p}x=-\mu$, $\operatorname{ord}_{p}y=-\sigma$ とする。$\mu>0$ なら $x^{3}$ の付値 $-3\mu$ は $Ax$, $B$ の付値（$\ge-\mu$, $\ge0$）より小さいので $\operatorname{ord}_{p}f(x)=-3\mu$、$-2\sigma=-3\mu$ から $\mu=2\nu$, $\sigma=3\nu$。$\mu\le0<\sigma$ なら左辺の付値 $-2\sigma<0$、右辺 $\ge0$ で矛盾。
:::

::: definition 部分群の列 $E(p^{\nu})$ {#nt:filtration-e-p-nu keywords="E(p^nu) = {(x, y) in E(Q) : ord_p(x) <= -2 nu} together with O; t = x/y and s = 1/y; P in E(p^nu) iff ord_p t(P) >= nu" index="E(p^ν)|いーぴーにゅー" refname="E(p^ν)"}
$\nu\ge1$ について $E(p^{\nu})\defeq\{(x,y)\in E(\mathbb{Q}):\operatorname{ord}_{p}x\le-2\nu\}\cup\{O\}$ とする。$(x,y)\neq O$ について $t\defeq x/y$, $s\defeq1/y$、$t(O)\defeq0$, $s(O)\defeq0$ とおく。\ref{nt:rational-point-denominators} から、$P\in E(p^{\nu})\setminus E(p^{\nu+1})$ なら $\operatorname{ord}_{p}t(P)=\nu$, $\operatorname{ord}_{p}s(P)=3\nu$。特に $P\in E(p^{\nu})\iff\operatorname{ord}_{p}t(P)\ge\nu$。
:::

::: intuition
$E(p^{\nu})$ は「$p$ 進的に $O$ に近い」点の集合で、$\nu$ が大きいほど近い。$O$ の近くでは座標 $t=x/y$ が曲線の局所座標になり、曲線は $s\approx t^{3}$ とほぼ平らなので、群演算は $t$ の足し算で非常によく近似される。
:::

::: lemma $t$ 座標の加法性 {#nt:t-additivity keywords="for P_1, P_2 in E(p^nu), t(P_1 + P_2) = t(P_1) + t(P_2) mod p^{3 nu} R; proof via the curve s = t^3 + A t s^2 + B s^3 and the line s = alpha t + beta with ord alpha >= 2 nu, ord beta >= 3 nu" index="t 座標の加法性|てぃーざひょうのかほうせい" refname="t 座標の加法性"}
$P_{1},P_{2}\in E(p^{\nu})$ なら $t(P_{1}+P_{2})\equiv t(P_{1})+t(P_{2})\pmod{p^{3\nu}R}$。
:::

::: intuition
分母が $p$ で何度も割れる点は「$p$ 進的に原点 $O$ の近く」にあり、そこでは座標 $t=x/y$ についての足し算が群演算をよく近似する。誤差は $t$ の 3 乗の程度しかない。
:::

::: proof
**Step 1（$(t,s)$ 座標の曲線）.** $y^{2}=f(x)$ を $y^{3}$ で割ると $s=t^{3}+Ats^{2}+Bs^{3}$。$(x,y)$ 平面の直線 $\alpha x+\beta y+\gamma=0$ は $(t,s)$ 平面の直線 $\alpha t+\beta+\gamma s=0$ に対応し、$O$ は $(t,s)=(0,0)$、$-P$ は $(-t,-s)$。$P_{1}$ か $P_{2}$ が $O$ なら主張は明らかなので、どちらも $O$ でないとする。$t_{i}\defeq t(P_{i})$, $s_{i}\defeq s(P_{i})$ は $R$ の元で $\operatorname{ord}t_{i}\ge\nu$, $\operatorname{ord}s_{i}\ge3\nu$。

**Step 2（直線の傾き）.** 【主張：$P_{1},P_{2}$ を通る直線（$P_{1}=P_{2}$ なら接線）は $s=\alpha t+\beta$, $\operatorname{ord}\alpha\ge2\nu$, $\operatorname{ord}\beta\ge3\nu$】曲線の式の差をとって整理すると
$$
(s_{2}-s_{1})\bigl[1-At_{1}(s_{1}+s_{2})-B(s_{1}^{2}+s_{1}s_{2}+s_{2}^{2})\bigr]=(t_{2}-t_{1})\bigl[t_{1}^{2}+t_{1}t_{2}+t_{2}^{2}+As_{2}^{2}\bigr].
$$
左の括弧 $u$ は $\equiv1\pmod p$ で $R$ の単元。$t_{1}=t_{2}$ なら $s_{1}=s_{2}$ で $P_{1}=P_{2}$。よって $t_{1}\neq t_{2}$ なら $\alpha\defeq\frac{s_{2}-s_{1}}{t_{2}-t_{1}}=\frac{t_{1}^{2}+t_{1}t_{2}+t_{2}^{2}+As_{2}^{2}}{u}$、$P_{1}=P_{2}$ なら陰関数の微分で $\alpha=\frac{3t_{1}^{2}+As_{1}^{2}}{1-2At_{1}s_{1}-3Bs_{1}^{2}}$（同じ式で $t_{2}=t_{1}$, $s_{2}=s_{1}$ としたもの）。どちらも分子の付値 $\ge2\nu$、分母は単元。$\beta\defeq s_{1}-\alpha t_{1}$ の付値 $\ge3\nu$。

**Step 3（第 3 の交点）.** 【主張：$t_{1}+t_{2}+t_{3}=-\frac{2A\alpha\beta+3B\alpha^{2}\beta}{1+A\alpha^{2}+B\alpha^{3}}$】$s=\alpha t+\beta$ を代入すると $t$ の 3 次式 $(1+A\alpha^{2}+B\alpha^{3})t^{3}+(2A\alpha\beta+3B\alpha^{2}\beta)t^{2}+\cdots=0$ で、最高次の係数は $R$ の単元（$\ne0$）なので 3 根はすべてこの座標の中にあり、$t_{1},t_{2}$ と第 3 の交点 $P_{3}$ の $t_{3}$ である（記法の注意）。根と係数の関係から主張を得る。右辺の付値は $\ge2\nu+3\nu\ge3\nu$。

**Step 4（結論）.** 弦と接線の法則で $P_{1}+P_{2}=-P_{3}$ なので $t(P_{1}+P_{2})=-t_{3}\equiv t_{1}+t_{2}\pmod{p^{3\nu}R}$（$P_{3}=O$ なら $t_{3}=0$ で同じ）。
:::

::: theorem $E(p)$ は捩れをもたない {#nt:e-p-torsion-free keywords="E(p^nu) is a subgroup of E(Q); t induces an injective homomorphism E(p^nu)/E(p^{3 nu}) -> p^nu R / p^{3 nu} R; E(p) contains no point of finite order other than O" index="E(p) の捩れ|いーぴーのねじれ" refname="E(p) は捩れをもたない"}
1. $E(p^{\nu})$ は $E(\mathbb{Q})$ の部分群で、$P\mapsto t(P)\bmod p^{3\nu}R$ は単射準同型 $E(p^{\nu})/E(p^{3\nu})\to p^{\nu}R/p^{3\nu}R$ を誘導する。
2. $E(p)$ の有限位数の元は $O$ だけである。
:::

::: intuition
原点の近くでは群演算が $t$ の足し算とほぼ同じなので、$t$ を何倍しても $0$ に戻らないのと同じく、原点の近くの点は何倍しても $O$ に戻らない。
:::

::: proof
**Step 1（1）.** $P_{1},P_{2}\in E(p^{\nu})$ なら \ref{nt:t-additivity} から $\operatorname{ord}t(P_{1}+P_{2})\ge\min(\operatorname{ord}(t_{1}+t_{2}),3\nu)\ge\nu$ で $P_{1}+P_{2}\in E(p^{\nu})$。$t(-P)=-t(P)$ で逆元も入る。準同型であることは \ref{nt:t-additivity}、核は $\operatorname{ord}t\ge3\nu$、すなわち $E(p^{3\nu})$。

**Step 2（2）.** 【主張：$P\in E(p)$, $P\neq O$ は有限位数でない】位数が有限で $>1$ なら、適当な倍数をとって位数が素数 $\ell$ の $P\in E(p)$ があるとしてよい（$E(p)$ は部分群）。$P\in E(p^{\nu})\setminus E(p^{\nu+1})$ とすると $\operatorname{ord}t(P)=\nu$。1 から $\ell t(P)\equiv t(\ell P)=0\pmod{p^{3\nu}}$。$\ell\neq p$ なら $\operatorname{ord}(\ell t(P))=\nu<3\nu$、$\ell=p$ なら $\nu+1<3\nu$（$\nu\ge1$）で、いずれも矛盾。
:::

## ナゲル–ルッツの定理 {#nt:sec-tor-nagell-lutz}

::: theorem ナゲル–ルッツの定理 {#nt:nagell-lutz keywords="Nagell-Lutz: a rational point P = (x, y) of finite order on y^2 = x^3 + Ax + B with A, B integers has x, y in Z, and either y = 0 or y^2 divides 4A^3 + 27B^2" index="ナゲル–ルッツの定理|なげるるっつのていり, 捩れ点|ねじれてん" refname="ナゲル–ルッツの定理"}
$P=(x,y)\in E(\mathbb{Q})$ が有限位数なら $x,y\in\mathbb{Z}$ で、$y=0$ または $y^{2}\mid D=4A^{3}+27B^{2}$。
:::

::: intuition
有限位数の点はどの素数 $p$ についても $E(p)$ に入れないので、分母に $p$ が現れない、すなわち整数点である。$2P$ も有限位数で整数点なので、倍加公式の分母 $4y^{2}$ が分子 $f'(x)^{2}$ を割り、多項式の恒等式から $y^{2}$ が判別式を割る。
:::

::: proof
**Step 1（整数性）.** 各素数 $p$ で $P\notin E(p)$（\ref{nt:e-p-torsion-free} の 2）なので $\operatorname{ord}_{p}x\ge0$、\ref{nt:rational-point-denominators} から $\operatorname{ord}_{p}y\ge0$。よって $x,y\in\mathbb{Z}$。

**Step 2（$y\neq0$ なら $y^{2}\mid f'(x)^{2}$）.** $y\neq0$ なら $2P\neq O$ で $2P$ も有限位数なので整数点。倍加公式 $x(2P)=\lambda^{2}-2x$, $\lambda=\frac{f'(x)}{2y}$ から $\lambda^{2}=\frac{f'(x)^{2}}{4y^{2}}\in\mathbb{Z}$、よって $y^{2}\mid f'(x)^{2}$。

**Step 3（恒等式）.** 【主張：$D=(3x^{2}+4A)f'(x)^{2}-27(x^{3}+Ax-B)f(x)$】右辺を展開すると、$(3x^{2}+4A)(3x^{2}+A)^{2}=27x^{6}+54Ax^{4}+27A^{2}x^{2}+4A^{3}$、$27(x^{3}+Ax-B)(x^{3}+Ax+B)=27x^{6}+54Ax^{4}+27A^{2}x^{2}-27B^{2}$ で、差は $4A^{3}+27B^{2}$。$f(x)=y^{2}$ と Step 2 から右辺は $y^{2}$ で割り切れる。
:::

::: example
$E:y^{2}=x^{3}+1$（$A=0$, $B=1$, $D=27$）。捩れ点の候補は $y=0$ または $y^{2}\mid27$、すなわち $y\in\{0,\pm1,\pm3\}$：$(-1,0)$, $(0,\pm1)$, $(2,\pm3)$。$P=(2,3)$：$\lambda=\frac{12}6=2$, $2P=(0,1)$。$Q=(0,1)$：$\lambda=0$, $2Q=(0,-1)=-Q$ なので $3Q=O$。$3P=P+2P=(2,3)+(0,1)$：$\lambda=\frac{1-3}{0-2}=1$, $x=1-2=-1$, $y=-(1\cdot(-1)+1)=0$、$3P=(-1,0)$（位数 2）。よって $P$ の位数は 6 で、$E(\mathbb{Q})_{\mathrm{tors}}=\langle P\rangle\cong\mathbb{Z}/6$（候補はすべて $\langle P\rangle$ に入る）。
:::

::: hypcheck
- **整数係数**：\ref{nt:rational-point-denominators} で $A,B$ の付値が $\ge0$ であることに使った。係数に分母があると、捩れ点でも整数とは限らない（座標変換で係数を整数にしてから適用する）。
- **$t$ 座標の加法性**：$\nu\ge1$（$p$ が分母を割る点）であることが、分母 $u$ が単元であることと付値の比較に本質的。
- **ナゲル–ルッツの逆**：条件をみたす整数点が有限位数とは限らない。$y^{2}=x^{3}-2$ の $(3,5)$ は $y^{2}=25\nmid D=4\cdot0+27\cdot4=108$ なので有限位数でない。条件は捩れ点を探す「候補の有限集合」を与えるだけである。
:::

## 問題 {#nt:sec-tor-problems}

::: problem {#nt:prob-tor-x3-minus-2}
$y^{2}=x^{3}-2$ の $E(\mathbb{Q})$ の捩れ部分群を求めよ。
:::

::: solution
$A=0$, $B=-2$, $D=108=2^{2}\cdot3^{3}$。$y=0$ なら $x^{3}=2$ で有理解なし。$y^{2}\mid108$ から $y\in\{\pm1,\pm2,\pm3,\pm6\}$：$x^{3}=y^{2}+2\in\{3,6,11,38\}$ はどれも立方数でない。よって捩れ部分群は $\{O\}$。特に $(3,5)$ は無限位数。
:::

::: problem {#nt:prob-tor-x3-minus-x}
$y^{2}=x^{3}-x$ の捩れ部分群が $\{O,(0,0),(\pm1,0)\}$ であることを示せ（$y\neq0$ の候補を調べよ）。
:::

::: solution
$A=-1$, $B=0$, $D=-4$。$y\neq0$ なら $y^{2}\mid4$ で $y=\pm1,\pm2$：$x^{3}-x=1$ または $4$ の整数解は、$x^{3}-x=(x-1)x(x+1)$ が連続 3 整数の積で $6$ の倍数なので存在しない。よって捩れ点は $y=0$ の 3 点と $O$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 証明は $p$ 進体を使わず、$\mathbb{Z}_{(p)}$ での付値の計算だけで済ませた（Silverman–Tate *Rational Points on Elliptic Curves* 第 II 章の流儀。手元に原典がないため、議論はその流儀に沿って自分で組み立てた）。

**前提を変えると.**
- **還元写像**：$p\nmid2D$ なら、$\bmod p$ への還元 $E(\mathbb{Q})_{\mathrm{tors}}\to E(\mathbb{F}_{p})$ は単射である（$E(p)$ が還元の核で、捩れをもたないことから）。これで捩れ部分群の位数が $\#E(\mathbb{F}_{p})$ を割り、捩れの計算が速くなる（\ref[演習]{nt:sec-tor-exercises}）。
- **マズールの定理**：$E(\mathbb{Q})_{\mathrm{tors}}$ は $\mathbb{Z}/n$（$1\le n\le10$ または $n=12$）か $\mathbb{Z}/2\times\mathbb{Z}/2n$（$1\le n\le4$）のいずれかと同型である（マズール、1977。ここでは証明しない）。
- **形式群**：$t$ 座標による群演算は、$p$ 進数体の上で収束する形式群 $F(t_{1},t_{2})=t_{1}+t_{2}+(\text{高次})$ を与え、$E(p)$ は $p\mathbb{Z}_{p}$ と（$p$ 進的に）同型になる。上の補題はその最初の項の評価である。

**高い視点から：$p$ 進的な小ささと捩れ.** 有理点の分母の素因数 $p$ は「その点が $p$ 進的に $O$ に近い」ことを意味し、$O$ の近くでは群は加法群 $p\mathbb{Z}_{p}$ のように振る舞い、加法群には捩れがない。比喩で言えば、捩れ点は「どの素数の拡大鏡で見ても原点のすぐそばには来ない」点で、そのため分母をもてず、整数の格子点として有限個の候補に閉じ込められる。
:::
