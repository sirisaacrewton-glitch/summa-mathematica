# 演習：楕円曲線 {#nt:page-exercises-elliptic-curves keywords="exercises, isomorphism classes of complex elliptic curves and j, n-torsion of C/Lambda, doubling on y^2 = x^3 + 17, rational 2-torsion, torsion of y^2 = x^3 + 8, infinite order of (3,5) on y^2 = x^3 - 2, heights of multiples, rank from Gamma/2Gamma, rank bounds for y^2 = x^3 - 25x"}

## 複素トーラスと楕円曲線 {#nt:sec-ct-exercises}

対応するページ：\ref{nt:page-complex-tori}

::: problem ★ 基本：$n$ 等分点 {#nt:ex-ct-n-torsion}
$E(\mathbb{C})$ の $nP=O$ をみたす点の全体は、群として $(\mathbb{Z}/n)^{2}$ と同型であることを示せ。
:::

::: solution
\ref{nt:chord-tangent-is-addition} から $E(\mathbb{C})\cong\mathbb{C}/\Lambda$。$\Lambda=\mathbb{Z}\omega_{1}+\mathbb{Z}\omega_{2}$ で $nu\in\Lambda$ となる $u$ は $\frac{a\omega_{1}+b\omega_{2}}n$ で、$\Lambda$ を法として $(a,b)\in(\mathbb{Z}/n)^{2}$ と一対一。
:::

::: problem ★★ 標準：$\mathbb{C}$ 上の楕円曲線と $j$ {#nt:ex-ct-j-classifies}
2 つの格子 $\Lambda,\Lambda'$ について、$\Lambda'=\lambda\Lambda$（$\lambda\in\mathbb{C}^{\times}$）$\iff$ $j(\Lambda)=j(\Lambda')$ を示し、そのとき $(x,y)\mapsto(\lambda^{-2}x,\lambda^{-3}y)$ が対応する 3 次曲線の群同型を与えることを確かめよ。
:::

::: solution
$j$ は重さ $0$ の格子の関数なので ⇒。⇐：$\Lambda=\omega(\mathbb{Z}z+\mathbb{Z})$, $\Lambda'=\omega'(\mathbb{Z}z'+\mathbb{Z})$ と書くと $j(z)=j(z')$ で、\ref{nt:j-invariant} の 2 から $z'=gz$（$g\in G$）、\ref{nt:lattices-homothety} から $\mathbb{Z}z'+\mathbb{Z}$ と $\mathbb{Z}z+\mathbb{Z}$ は相似。後半：$\wp_{\lambda\Lambda}(\lambda u)=\lambda^{-2}\wp_{\Lambda}(u)$, $\wp'_{\lambda\Lambda}(\lambda u)=\lambda^{-3}\wp'_{\Lambda}(u)$（級数から）なので、写像は $\mathbb{C}/\Lambda\to\mathbb{C}/\lambda\Lambda$, $u\mapsto\lambda u$ に対応し、群同型。
:::

## ワイエルシュトラス方程式と群演算 {#nt:sec-gl-exercises}

対応するページ：\ref{nt:page-group-law}

::: problem ★ 基本：$y^{2}=x^{3}+17$ での 2 倍 {#nt:ex-gl-double-17}
$P=(-1,4)$ について $2P$ を求め、曲線上にあることを確かめよ。
:::

::: solution
$\lambda=\frac{3}{8}$, $\nu=4+\frac38=\frac{35}8$。$x=\frac9{64}+2=\frac{137}{64}$, $y=-(\frac38\cdot\frac{137}{64}+\frac{35}8)=-\frac{2651}{512}$。$(\frac{137}{64})^{3}+17=\frac{2571353+4456448}{262144}=\frac{7027801}{262144}=(\frac{2651}{512})^{2}$。
:::

::: problem ★★ 標準：有理 2 等分点 {#nt:ex-gl-two-torsion}
$\mathbb{Q}$ 上の $E:y^{2}=x^{3}+Ax+B$ の位数 2 の有理点の個数は $0,1,3$ のいずれかで、$\{P:2P=O\}$ は位数 $1,2,4$ の部分群であることを示せ。
:::

::: solution
$2P=O$, $P\neq O$ $\iff$ $-P=P$ $\iff$ $y=0$、すなわち $x$ が $x^{3}+Ax+B$ の有理根。3 次式の有理根の個数は $0,1,3$（2 個あれば 3 個目も有理数：根の和 $=0$）。$O$ と合わせて位数 $1,2,4$ で、$2P=O$ の点の全体は部分群（アーベル群の 2 等分点）。
:::

## 有理点の捩れとナゲル–ルッツの定理 {#nt:sec-tor-exercises}

対応するページ：\ref{nt:page-torsion-points}

::: problem ★ 基本：$(3,5)$ の位数 {#nt:ex-tor-infinite-order}
$y^{2}=x^{3}-2$ の $P=(3,5)$ が無限位数であることを、$2P$ が整数点でないことから示せ。
:::

::: solution
$2P=(\frac{129}{100},-\frac{383}{1000})$（\ref{nt:elliptic-group-law} の例）。$P$ が有限位数なら $2P$ も有限位数で、\ref{nt:nagell-lutz} から整数点のはず。よって無限位数。
:::

::: problem ★★ 標準：$y^{2}=x^{3}+8$ の捩れ {#nt:ex-tor-x3-plus-8}
$y^{2}=x^{3}+8$ の $E(\mathbb{Q})_{\mathrm{tors}}$ を求めよ。
:::

::: solution
$D=27\cdot64=2^{6}3^{3}$。$y=0$ なら $x=-2$：$(-2,0)$ は位数 2。$y\neq0$ なら $y^{2}\mid D$ から $y^{2}\in\{1,4,9,16,36,64,144,576\}$、$x^{3}=y^{2}-8$ が立方数になるのは $y^{2}=9$（$x=1$）と $y^{2}=16$（$x=2$）。$(1,3)$：$\lambda=\frac36=\frac12$, $x(2P)=\frac14-2=-\frac74$ は整数でないので無限位数。$(2,4)$：$\lambda=\frac{12}8=\frac32$, $x(2P)=\frac94-4=-\frac74$ で無限位数。符号を変えた点も同じ。よって $E(\mathbb{Q})_{\mathrm{tors}}=\{O,(-2,0)\}\cong\mathbb{Z}/2$。
:::

## 高さと降下 {#nt:sec-hd-exercises}

対応するページ：\ref{nt:page-heights-descent}

::: problem ★ 基本：$3P$ の高さ {#nt:ex-hd-3p}
$y^{2}=x^{3}-2$, $P=(3,5)$ について $x(3P)=\frac{164323}{29241}$ を確かめ、$h(3P)/h(P)$ を概算せよ。
:::

::: solution
$3P=P+2P$, $\lambda=\frac{-383/1000-5}{129/100-3}=\frac{5383}{1710}$, $x(3P)=\lambda^{2}-3-\frac{129}{100}=\frac{164323}{29241}$（$29241=171^{2}$）。$h(3P)=\log164323\approx12.01$, $h(P)=\log3\approx1.10$ で比は約 $10.9$（$n^{2}=9$ に近い：高さはおおよそ $n^{2}$ 倍で増える）。
:::

::: problem ★★ 標準：$\Gamma/2\Gamma$ から階数へ {#nt:ex-hd-rank-from-2}
$\Gamma$ を有限生成アーベル群、$T$ をその捩れ部分群とする。$\abs{\Gamma/2\Gamma}=2^{s}$ なら、$\Gamma$ の階数は $r=s-\dim_{\mathbb{F}_{2}}T/2T$ であることを示せ。
:::

::: solution
$\Gamma\cong T\times\mathbb{Z}^{r}$（\ref{grp:fg-abelian-structure}）なので $\Gamma/2\Gamma\cong T/2T\times(\mathbb{Z}/2)^{r}$。位数を比べる。
:::

## モーデルの定理 {#nt:sec-mw-exercises}

対応するページ：\ref{nt:page-mordell}

::: problem ★ 基本：$\delta$ の計算 {#nt:ex-mw-delta}
$y^{2}=x^{3}-25x=x(x-5)(x+5)$ 上の $P=(-4,6)$ について $\delta(P)$ を求めよ。
:::

::: solution
$\delta_{1}=-4-0=-4\equiv-1$, $\delta_{2}=-4-5=-9\equiv-1$, $\delta_{3}=-4+5=1$。積は $1$ で整合する。$\delta(P)\neq(1,1,1)$ なので $P\notin2E(\mathbb{Q})$。
:::

::: problem ★★★ 発展：$y^{2}=x^{3}-25x$ の階数の評価 {#nt:ex-mw-rank-bound}
$E:y^{2}=x^{3}-25x$ の階数 $r$ が $1\le r\le3$ をみたすことを示せ。
:::

::: solution
上界：$e=0,5,-5$ で $(e_{i}-e_{j})(e_{i}-e_{k})$ は $-25$, $50$, $50$。\ref{nt:descent-image-finite} から $\delta_{1}\in\langle-1,5\rangle$（4 個）、$\delta_{2}\in\langle-1,2,5\rangle$（8 個）、$\delta_{3}=\delta_{1}\delta_{2}$ で決まるので、像は高々 32 個。\ref{nt:mordell-theorem} から $2^{r+2}\le32$、$r\le3$。下界：$P=(-4,6)$ は整数点だが、$D=4\cdot(-25)^{3}=-62500$ で $36\nmid62500$ なので、\ref{nt:nagell-lutz} から無限位数。よって $r\ge1$。（実際は $r=1$ で、これは $5$ が合同数である（$3/2,20/3,41/6$ の直角三角形の面積が $5$）ことに対応する。）
:::
