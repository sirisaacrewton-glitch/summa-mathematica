# モーデルの定理 {#nt:page-mordell keywords="Mordell's theorem for elliptic curves over Q with all 2-torsion rational y^2 = (x - e_1)(x - e_2)(x - e_3), the descent maps delta_i: E(Q) -> Q^x/Q^x2, delta_i(P) = x - e_i, delta_i(T_i) = (e_i - e_j)(e_i - e_k), homomorphism via the constant term of the line, finiteness of the image, halving lemma: P is in 2E(Q) iff all x - e_i are squares, explicit half point x(Q) = x + r_1 r_2 + r_1 r_3 + r_2 r_3, weak Mordell-Weil theorem, Mordell's theorem E(Q) = torsion x Z^r, rank bounds, y^2 = x^3 - x has rank at most 1, y^2 = x^3 - 25x has rank between 1 and 3, Mordell-Weil theorem in general"}

**モーデルの定理**：$\mathbb{Q}$ 上の楕円曲線の有理点の群 $E(\mathbb{Q})$ は有限生成アーベル群である。前のページで、高さによる降下から、これは $E(\mathbb{Q})/2E(\mathbb{Q})$ の有限性（**弱モーデル–ヴェイユの定理**）に帰着した。このページでは、2 等分点がすべて有理点である曲線 $y^{2}=(x-e_{1})(x-e_{2})(x-e_{3})$ について、「$x-e_{i}$ を平方類で見る」写像が準同型で、像が有限で、核がちょうど $2E(\mathbb{Q})$ であることを示して、弱モーデル–ヴェイユの定理を完全に証明する。核の記述には、2 で割った点を具体的に書き下す公式を使う。

## 記法と定義の確認 {#nt:sec-mw-notation}

::: notation
- この節の曲線は $E:y^{2}=(x-e_{1})(x-e_{2})(x-e_{3})$（$e_{i}\in\mathbb{Z}$ 相異なる）。$T_{i}\defeq(e_{i},0)$ は位数 2 の有理点。$\{i,j,k\}=\{1,2,3\}$ と書く。
- 群演算・加法の公式（第 3 の交点の $x$ 座標は $\lambda^{2}-a-x_{1}-x_{2}$、$a=-(e_{1}+e_{2}+e_{3})$）、分母の形、高さと降下は \ref{nt:addition-formulas}, \ref{nt:elliptic-group-law}, \ref{nt:rational-point-denominators}, \ref{nt:height-axioms-elliptic}, \ref{nt:descent-theorem}。捩れ点の整数性は \ref{nt:nagell-lutz}。
- $\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ は $\mathbb{F}_{2}$ ベクトル空間で、$-1$ と素数の類を基底にもつ（素因数分解）。
- 有限生成アーベル群が捩れ部分と自由部分の直積になることは \ref{grp:fg-abelian-structure}。
- 体系は $\ZF$。
:::

## 降下写像 {#nt:sec-mw-descent-maps}

::: definition 降下写像 $\delta_{i}$ {#nt:descent-maps keywords="delta_i(O) = 1, delta_i(T_i) = (e_i - e_j)(e_i - e_k), delta_i(P) = x - e_i otherwise, as classes in Q^x/Q^x2" index="降下写像|こうかしゃぞう, 2 降下|にこうか" refname="降下写像"}
$i=1,2,3$ について $\delta_{i}:E(\mathbb{Q})\to\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ を、$\delta_{i}(O)\defeq1$, $\delta_{i}(T_{i})\defeq(e_{i}-e_{j})(e_{i}-e_{k})$、それ以外の $P=(x,y)$ では $\delta_{i}(P)\defeq x-e_{i}$（いずれも平方類）で定める。$\delta\defeq(\delta_{1},\delta_{2},\delta_{3})$。
:::

::: intuition
$y^{2}=(x-e_{1})(x-e_{2})(x-e_{3})$ なので 3 つの因子の積は平方で、各因子が平方かどうかが「その点が 2 で割れるか」の情報を運ぶ。$T_{i}$ での値は、因子 $x-e_{i}$ が $0$ になるので、残りの 2 因子の積で置き換えている（積が平方になるように）。
:::

::: proposition 降下写像は準同型 {#nt:descent-map-homomorphism keywords="each delta_i is a group homomorphism E(Q) -> Q^x/Q^x2; proof: for collinear P_1, P_2, P_3 the product of x - e_i is nu^2, the constant term of the line in shifted coordinates" index="降下写像の準同型性|こうかしゃぞうのじゅんどうけいせい" refname="降下写像は準同型"}
各 $\delta_{i}$ は群準同型である。
:::

::: intuition
一直線上の 3 点の $x-e_{i}$ の積は、直線の式の定数項の 2 乗になる。したがって $x-e_{i}$ の平方類は、和が $O$ の 3 点で掛けると $1$ になり、準同型になる。
:::

::: proof
**Step 1（帰着）.** $\delta_{i}(-P)=\delta_{i}(P)$（$x$ 座標が同じ）で、$\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ のすべての元は自分自身の逆元なので、【主張：$P_{1}+P_{2}+P_{3}=O$ なら $\delta_{i}(P_{1})\delta_{i}(P_{2})\delta_{i}(P_{3})=1$】を示せば $\delta_{i}(P_{1}+P_{2})=\delta_{i}(-P_{3})=\delta_{i}(P_{1})\delta_{i}(P_{2})$。$X\defeq x-e_{i}$ と座標をずらすと $E:y^{2}=X(X-d_{j})(X-d_{k})=X^{3}+\alpha X^{2}+\beta X$, $d_{j}=e_{j}-e_{i}$, $\beta=d_{j}d_{k}=(e_{i}-e_{j})(e_{i}-e_{k})$。

**Step 2（$O$ を含む場合）.** 和が $O$ の 3 点の一つが $O$ なら、残りは $P,-P$（または $O,O$）で、積は $\delta_{i}(P)^{2}=1$。

**Step 3（$O$ を含まない場合）.** 3 点は縦でない直線 $y=\lambda X+\nu$ 上にあり（縦線は $O$ を通る）、$X^{3}+\alpha X^{2}+\beta X-(\lambda X+\nu)^{2}=(X-X_{1})(X-X_{2})(X-X_{3})$。定数項を比べて $X_{1}X_{2}X_{3}=\nu^{2}$。$T_{i}$（$X=0$）がどれでもなければ、これが主張。$P_{3}=T_{i}$ なら $\nu=0$ で、$X(X^{2}+(\alpha-\lambda^{2})X+\beta)$ から $X_{1}X_{2}=\beta$、$\delta_{i}(P_{1})\delta_{i}(P_{2})\delta_{i}(T_{i})=\beta^{2}=1$。$T_{i}$ が 2 回以上現れることはない（$T_{i}$ での接線は縦線 $X=0$ で、$O$ を通る）。
:::

::: proposition 降下写像の像は有限 {#nt:descent-image-finite keywords="delta_i(P) lies in the finite subgroup of Q^x/Q^x2 generated by -1 and the primes dividing (e_i - e_j)(e_i - e_k); delta_1 delta_2 delta_3 = 1" index="降下写像の像|こうかしゃぞうのぞう" refname="降下写像の像は有限"}
$\delta_{i}(P)$ は、$-1$ と $(e_{i}-e_{j})(e_{i}-e_{k})$ を割る素数で生成される $\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ の有限部分群に入る。また $\delta_{1}\delta_{2}\delta_{3}=1$。
:::

::: intuition
3 つの因子 $x-e_{i}$ の積は平方なので、ある因子だけに奇数回現れる素数はない。2 つの因子の差は $e_{i}$ の差に分母を掛けたものなので、奇数回現れうる素数は $e_{i}$ の差を割るものに限られる。
:::

::: proof
**Step 1（$T_{i}$, $O$）.** 定義から明らか。

**Step 2（一般の点）.** 【主張：$P=(m/e^{2},n/e^{3})$ について、$u_{i}\defeq m-e_{i}e^{2}$ の奇数乗で現れる素数は $(e_{i}-e_{j})(e_{i}-e_{k})$ を割る】$x-e_{i}=u_{i}/e^{2}$ なので $\delta_{i}(P)=u_{i}$（平方類）。$u_{1}u_{2}u_{3}=n^{2}$。素数 $p$ が $u_{i}$ を奇数乗で割れば、積が平方なので $p$ は $u_{j}$ か $u_{k}$ も割る（たとえば $u_{j}$）。$p\mid u_{i}-u_{j}=(e_{j}-e_{i})e^{2}$ で、$p\mid e$ なら $p\mid u_{i}+e_{i}e^{2}=m$ となり $\gcd(m,e)=1$ に反するので、$p\mid e_{j}-e_{i}$。

**Step 3（積）.** $T_{i}$ でない点では $\prod(x-e_{r})=y^{2}$。$T_{i}$ では $\beta\cdot(e_{i}-e_{j})(e_{i}-e_{k})=\beta^{2}$。
:::

::: theorem 2 で割る判定 {#nt:halving-criterion keywords="P is in 2E(Q) iff delta_1(P) = delta_2(P) = delta_3(P) = 1; if x - e_i = r_i^2 with r_1 r_2 r_3 = y then Q = (x + r_1 r_2 + r_1 r_3 + r_2 r_3, (r_1 + r_2)(r_1 + r_3)(r_2 + r_3)) satisfies 2Q = P" index="2 で割る判定|にでわるはんてい" refname="2 で割る判定"}
$P\in E(\mathbb{Q})$ について、$P\in2E(\mathbb{Q})\iff\delta_{1}(P)=\delta_{2}(P)=\delta_{3}(P)=1$。より具体的に、$P=(x,y)$ で $x-e_{i}=r_{i}^{2}$（$r_{i}\in\mathbb{Q}$）, $r_{1}r_{2}r_{3}=y$ なら、
$$
Q\defeq\bigl(x+r_{1}r_{2}+r_{1}r_{3}+r_{2}r_{3},\ (r_{1}+r_{2})(r_{1}+r_{3})(r_{2}+r_{3})\bigr)
$$
は $E(\mathbb{Q})$ の点で $2Q=P$。
:::

::: intuition
$2Q=P$ となる $Q$ では、$Q$ での接線が $-P$ を通る。その接線の傾きが $r_{1}+r_{2}+r_{3}$ という簡単な形になるように $r_{i}$ を選ぶと、$Q$ の座標が $r_{i}$ の対称式で書ける。$x-e_{i}$ がすべて平方であることは、この $r_{i}$ が有理数にとれることにほかならない。
:::

::: proof
**Step 1（⇒）.** $P=2Q$ なら、準同型性から $\delta_{i}(P)=\delta_{i}(Q)^{2}=1$。

**Step 2（⇐：$r_{i}$ の選択）.** $P=O$ なら $Q=O$。$P\neq O$ で $\delta_{i}(P)=1$ なら、$x-e_{i}=r_{i}^{2}$ となる $r_{i}\in\mathbb{Q}$ がある：$P\neq T_{i}$ なら定義から、$P=T_{i}$ なら $r_{i}=0$。$y^{2}=\prod(x-e_{r})=(r_{1}r_{2}r_{3})^{2}$ なので、$r_{1}$ の符号を必要なら変えて $r_{1}r_{2}r_{3}=y$ とできる。

**Step 3（$Q$ は曲線上にある）.** $x_{0}\defeq x+r_{1}r_{2}+r_{1}r_{3}+r_{2}r_{3}$ について $x_{0}-e_{i}=r_{i}^{2}+r_{i}r_{j}+r_{i}r_{k}+r_{j}r_{k}=(r_{i}+r_{j})(r_{i}+r_{k})$。よって $\prod_{i}(x_{0}-e_{i})=[(r_{1}+r_{2})(r_{1}+r_{3})(r_{2}+r_{3})]^{2}=y_{0}^{2}$。また $y_{0}\neq0$：$r_{i}+r_{j}=0$ なら $r_{i}^{2}=r_{j}^{2}$ から $e_{i}=e_{j}$ となり矛盾。

**Step 4（接線の傾き）.** 【主張：$Q$ での接線の傾きは $\lambda=r_{1}+r_{2}+r_{3}$】$f(X)=\prod(X-e_{i})$ について $f'(x_{0})=\sum_{i}(x_{0}-e_{j})(x_{0}-e_{k})$ で、Step 3 から $(x_{0}-e_{j})(x_{0}-e_{k})=(r_{j}+r_{i})(r_{j}+r_{k})(r_{k}+r_{i})(r_{k}+r_{j})=y_{0}(r_{j}+r_{k})$。よって $\lambda=\frac{f'(x_{0})}{2y_{0}}=\frac{y_{0}\cdot2(r_{1}+r_{2}+r_{3})}{2y_{0}}$。

**Step 5（$2Q=P$）.** $a=-(e_{1}+e_{2}+e_{3})=-3x+\sum r_{i}^{2}$ なので、$s\defeq r_{1}r_{2}+r_{1}r_{3}+r_{2}r_{3}$ とおくと $x(2Q)=\lambda^{2}-a-2x_{0}=(\sum r_{i}^{2}+2s)+3x-\sum r_{i}^{2}-2x-2s=x$。$y(2Q)=-(\lambda(x-x_{0})+y_{0})=\lambda s-y_{0}=(r_{1}+r_{2}+r_{3})s-(r_{1}+r_{2})(r_{1}+r_{3})(r_{2}+r_{3})=r_{1}r_{2}r_{3}=y$（恒等式 $(r_{1}+r_{2})(r_{1}+r_{3})(r_{2}+r_{3})=(r_{1}+r_{2}+r_{3})s-r_{1}r_{2}r_{3}$）。
:::

## モーデルの定理 {#nt:sec-mw-mordell}

::: theorem 弱モーデル–ヴェイユの定理（2 等分点が有理的な場合） {#nt:weak-mordell-weil keywords="for y^2 = (x - e_1)(x - e_2)(x - e_3) with distinct integers e_i, delta induces an injection E(Q)/2E(Q) -> (Q^x/Q^x2)^3 with finite image; hence E(Q)/2E(Q) is finite" index="弱モーデル–ヴェイユの定理|じゃくもーでるゔぇいゆのていり" refname="弱モーデル–ヴェイユの定理"}
$\delta$ は単射準同型 $E(\mathbb{Q})/2E(\mathbb{Q})\to(\mathbb{Q}^{\times}/\mathbb{Q}^{\times2})^{3}$ を誘導し、像は有限。特に $E(\mathbb{Q})/2E(\mathbb{Q})$ は有限。
:::

::: intuition
「2 で割った余り」を降下写像で記録すると、その記録は有限個の値しかとらず、記録が自明なら本当に 2 で割れる。したがって 2 で割った余りの種類は有限個しかない。
:::

::: proof
$\delta$ は準同型（\ref{nt:descent-map-homomorphism}）で、核は $2E(\mathbb{Q})$（\ref{nt:halving-criterion}）、像は有限（\ref{nt:descent-image-finite}）。
:::

::: theorem モーデルの定理 {#nt:mordell-theorem keywords="Mordell: E(Q) is a finitely generated abelian group, isomorphic to E(Q)_tors x Z^r; proved here for curves with all 2-torsion rational; |E(Q)/2E(Q)| = 2^{r+2}" index="モーデルの定理|もーでるのていり, 階数（楕円曲線）|かいすう" refname="モーデルの定理"}
$E:y^{2}=(x-e_{1})(x-e_{2})(x-e_{3})$（$e_{i}\in\mathbb{Z}$ 相異なる）について、$E(\mathbb{Q})$ は有限生成アーベル群で、$E(\mathbb{Q})\cong E(\mathbb{Q})_{\mathrm{tors}}\times\mathbb{Z}^{r}$（$r$ を**階数**という）。さらに $\abs{E(\mathbb{Q})/2E(\mathbb{Q})}=2^{r+2}$。
:::

::: intuition
弱モーデル–ヴェイユの定理で「2 で割った余り」が有限個しかないことがわかり、高さの降下で「2 で割る」操作を繰り返すと有限個の小さな点に行き着く。2 つを合わせると、すべての有理点が有限個の点から足し算で作られる。
:::

::: proof
**Step 1（有限生成）.** 【主張：$E(\mathbb{Q})$ は有限生成】\ref{nt:weak-mordell-weil} と \ref{nt:height-axioms-elliptic}。

**Step 2（構造）.** 【主張：捩れ部分と自由部分に分かれる】\ref{grp:fg-abelian-structure} から $E(\mathbb{Q})\cong E(\mathbb{Q})_{\mathrm{tors}}\times\mathbb{Z}^{r}$。

**Step 3（$E/2E$ の位数）.** 【主張：$E/2E$ の位数は $2^{r+2}$】$E(\mathbb{Q})_{\mathrm{tors}}$ は有限アーベル群で、位数 2 の元は $T_{1},T_{2},T_{3}$ のちょうど 3 個（$2P=O\iff y=0$ または $P=O$）。有限アーベル群 $A$ で $A[2]$ の位数が 4 なら $A/2A$ の位数も 4（$A\to A$, $a\mapsto2a$ の核と余核の位数は等しい）。よって $\abs{E/2E}=4\cdot2^{r}$。
:::

::: example
$E:y^{2}=x^{3}-x$（$e=0,1,-1$）。$(e_{i}-e_{j})(e_{i}-e_{k})$ は $e_{1}=0$ で $-1$、$e_{2}=1$ で $2$、$e_{3}=-1$ で $2$。よって $\delta_{1}\in\{\pm1\}$, $\delta_{2}\in\{\pm1,\pm2\}$ で、$\delta_{3}=\delta_{1}\delta_{2}$ は決まる。像の位数は $\le8$ なので $2^{r+2}\le8$、$r\le1$。（実際は $r=0$ であることが知られている。これは「辺の長さが有理数の直角三角形の面積は平方数でない」というフェルマーの定理と同値。ここでは証明しない。）
:::

::: hypcheck
- **2 等分点がすべて有理的**：$\delta_{i}$ の定義に $e_{i}\in\mathbb{Q}$ が要る。有理 2 等分点が一つだけの曲線では 2 同種写像による降下（Silverman–Tate 第 III 章）、有理 2 等分点がない曲線では 3 次体の上での降下が要る。ここでは証明しない。
- **整数係数**：像の有限性の証明（Step 2）で、分母の形と $\gcd(m,e)=1$ を使った。
- **$e_{i}$ が相異なる**：2 で割る判定の Step 3（$y_{0}\neq0$）と、高さの評価（$D_{0}\neq0$）に本質的。
:::

## 問題 {#nt:sec-mw-problems}

::: problem {#nt:prob-mw-delta-torsion}
$y^{2}=x^{3}-x$ の $T_{1}=(0,0)$, $T_{2}=(1,0)$, $T_{3}=(-1,0)$ の $\delta$ の値を求め、$T_{1}+T_{2}=T_{3}$ と準同型性が整合することを確かめよ。
:::

::: solution
$\delta(T_{1})=((-1)(1),\,0-1,\,0+1)=(-1,-1,1)$、$\delta(T_{2})=(1,\,(1)(2),\,2)=(1,2,2)$、$\delta(T_{3})=(-1,-2,(-1)(-2))=(-1,-2,2)$。積 $\delta(T_{1})\delta(T_{2})=(-1,-2,2)=\delta(T_{3})$。また $T_{1}+T_{2}=T_{3}$（3 点は直線 $y=0$ 上）。
:::

::: problem {#nt:prob-mw-halving}
$y^{2}=x^{3}-x$ で $P=(x,y)$ が $2E(\mathbb{Q})$ に入るなら $x\ge1$ であることを示せ（$x-e_{i}$ がすべて平方であることを使う）。
:::

::: solution
$x-(-1)$, $x-0$, $x-1$ がすべて平方なら $x-1\ge0$。（$P=O$ は除く。）
:::

::: supplement
**使わなかった前提・本質的でない前提.** 弱モーデル–ヴェイユの定理の証明は、代数体の類数の有限性や単数定理を使わない（係数が $\mathbb{Q}$ で 2 等分点が有理的なので、$\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ の中で済む）。

**前提を変えると.**
- **モーデル–ヴェイユの定理**：代数体 $K$ 上の楕円曲線（さらにアーベル多様体）について $E(K)$ は有限生成である（モーデル 1922, ヴェイユ 1928）。一般の場合は、2 等分点を添加した体 $L$ の上で同じ降下を行い、$L^{\times}/L^{\times2}$ の中の「有限個の素点の外で不分岐な類」が有限であること（類数の有限性と単数定理）を使う。ここでは証明しない。
- **階数の計算**：像の上界は「降下写像の候補」の数で、実際に像に入るかどうかは $\delta$ の値を与える方程式（2 次曲面の交わり）が有理点をもつかで決まり、局所的に判定できない場合（テイト–シャファレヴィッチ群の障害）がある。
- **バーチ–スウィンナートン＝ダイアー予想**：階数 $r$ は $L$ 関数 $L(E,s)$ の $s=1$ での零点の位数に等しい、と予想されている（ミレニアム問題の一つ）。

**高い視点から：降下はガロアコホモロジー.** $\delta$ は、完全列 $0\to E[2]\to E\xrightarrow{2}E\to0$ のガロアコホモロジーの連結準同型 $E(\mathbb{Q})/2E(\mathbb{Q})\hookrightarrow H^{1}(\mathbb{Q},E[2])$ を、$E[2]\cong(\mathbb{Z}/2)^{2}$ とクンマー理論 $H^{1}(\mathbb{Q},\mu_{2})=\mathbb{Q}^{\times}/\mathbb{Q}^{\times2}$ で具体的に書いたものである。像が「$2\Delta$ の外で不分岐な類」に入ることが有限性の源で、これは局所体での条件の集まり（セルマー群）として定式化される。比喩で言えば、$\delta$ は各有理点に「2 で割れるかどうかの通行証」を発行する窓口で、通行証の種類が有限であることと、通行証のない点は本当に半分にできることが、群全体を有限個の点で記述できる理由である。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref[演習]{nt:sec-mw-exercises} にまとめた。
