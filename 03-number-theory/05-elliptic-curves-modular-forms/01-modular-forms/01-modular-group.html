# モジュラー群 {#nt:page-modular-group keywords="upper half plane H, action of SL_2(R) by fractional linear transformations, Im(gz) = Im(z)/|cz+d|^2, modular group G = SL_2(Z)/{+-1}, S: z -> -1/z, T: z -> z+1, S^2 = (ST)^3 = 1, fundamental domain D = {|z| >= 1, |Re z| <= 1/2}, congruent boundary points, stabilizers of i, rho, -rho bar, G is generated by S and T, reduction algorithm"}

整数係数の行列 $\begin{pmatrix}a&b\\c&d\end{pmatrix}$（行列式 $1$）は、上半平面 $H$ に $z\mapsto(az+b)/(cz+d)$ で作用する。この群を**モジュラー群**といい、モジュラー形式はこの作用についての対称性で定義される。このページでは、作用の**基本領域**（どの点もちょうど一つの代表をもつ領域）を求め、モジュラー群が 2 つの変換 $z\mapsto-1/z$ と $z\mapsto z+1$ で生成されることを示す。証明はすべて、虚部の変化の公式 $\operatorname{Im}(gz)=\operatorname{Im}z/\abs{cz+d}^{2}$ と、整数の組 $(c,d)$ の有限性による初等的なものである。

## 記法と定義の確認 {#nt:sec-mg-notation}

::: notation
- $H\defeq\{z\in\mathbb{C}:\operatorname{Im}z>0\}$。$\SL_{2}(R)$ は環 $R$ 上の行列式 $1$ の $2\times2$ 行列の群。
- $\rho\defeq e^{2\pi i/3}=-\frac12+\frac{\sqrt3}2i$、$-\bar\rho=e^{\pi i/3}=\rho+1$。$\rho^{3}=1$, $\rho^{2}+\rho+1=0$。
- 群の作用・安定化群・軌道は \ref{grp:group-action}。
- 体系は $\ZF$。
:::

## モジュラー群と上半平面 {#nt:sec-mg-action}

::: definition モジュラー群 {#nt:modular-group keywords="SL_2(R) acts on the Riemann sphere and on H by gz = (az + b)/(cz + d); Im(gz) = Im(z)/|cz + d|^2; -1 acts trivially; the modular group G = SL_2(Z)/{+-1}; S and T" index="モジュラー群|もじゅらーぐん, 上半平面|じょうはんへいめん, 一次分数変換|いちじぶんすうへんかん" refname="モジュラー群"}
$g=\begin{pmatrix}a&b\\c&d\end{pmatrix}\in\SL_{2}(\mathbb{R})$ と $z\in H$ について $gz\defeq\frac{az+b}{cz+d}$ とする。$\SL_{2}(\mathbb{Z})$ の $\{\pm1\}$ による商 $G\defeq\SL_{2}(\mathbb{Z})/\{\pm1\}$ を**モジュラー群**という。$G$ の元を代表の行列で表す。
$$
S\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix},\quad T\defeq\begin{pmatrix}1&1\\0&1\end{pmatrix}:\qquad Sz=-\frac1z,\quad Tz=z+1.
$$
:::

::: intuition
整数係数の行列による一次分数変換は、格子の基底の取り替えを上半平面の点の動きとして見たものである。$-1$ は何も動かさないので、$\pm1$ で割った群が実際に作用する。
:::

::: proposition 上半平面への作用 {#nt:sl2-action-h keywords="Im(gz) = Im(z) / |cz + d|^2; g(hz) = (gh)z; H is stable; -1 acts trivially; S^2 = 1 and (ST)^3 = 1 in G" index="上半平面への作用|じょうはんへいめんへのさよう"}
1. $\operatorname{Im}(gz)=\dfrac{\operatorname{Im}z}{\abs{cz+d}^{2}}$。特に $H$ は $\SL_{2}(\mathbb{R})$ の作用で閉じている。
2. $(gh)z=g(hz)$ で、$-1$ は自明に作用する。したがって $G$ は $H$ に作用する。
3. $G$ の中で $S^{2}=1$, $(ST)^{3}=1$。
:::

::: proof
**Step 1（1）.** $cz+d\neq0$（$z\notin\mathbb{R}$ で $(c,d)\neq(0,0)$）。$\frac{az+b}{cz+d}=\frac{(az+b)(c\bar z+d)}{\abs{cz+d}^{2}}$ の分子の虚部は $(ad-bc)\operatorname{Im}z=\operatorname{Im}z$。

**Step 2（2）.** 一次分数変換の合成は行列の積に対応する（分母を払って直接確かめる）。$-g$ は分子と分母に $-1$ を掛けるだけ。

**Step 3（3）.** $S^{2}=-1$。$ST=\begin{pmatrix}0&-1\\1&1\end{pmatrix}$、$(ST)^{2}=\begin{pmatrix}-1&-1\\1&0\end{pmatrix}$、$(ST)^{3}=-1$。
:::

## 基本領域 {#nt:sec-mg-fundamental}

::: theorem モジュラー群の基本領域 {#nt:modular-fundamental-domain keywords="D = {z in H : |z| >= 1, |Re z| <= 1/2}; every point of H is G-equivalent to a point of D; two distinct equivalent points of D are on the boundary: z' = z +- 1 or z' = -1/z on |z| = 1; stabilizers trivial except I(i) = <S> of order 2, I(rho) = <ST> and I(-rho bar) = <TS> of order 3" index="基本領域（モジュラー群）|きほんりょういき" refname="モジュラー群の基本領域"}
$D\defeq\{z\in H:\abs z\ge1,\ \abs{\operatorname{Re}z}\le\frac12\}$ とする。
1. 各 $z\in H$ に $gz\in D$ となる $g\in G$ がある。
2. $D$ の異なる 2 点 $z,z'$ が $G$ で移り合うなら、$\operatorname{Re}z=\pm\frac12$ かつ $z'=z\mp1$、または $\abs z=1$ かつ $z'=-1/z$。
3. $z\in D$ の安定化群 $I(z)$ は、$z=i$ なら $S$ で生成される位数 2 の群、$z=\rho$ なら $ST$ で生成される位数 3 の群、$z=-\bar\rho$ なら $TS$ で生成される位数 3 の群で、それ以外では自明。
:::

::: intuition
$z\mapsto z+1$ で実部を $[-\frac12,\frac12]$ に、$z\mapsto-1/z$ で単位円の内側を外側に移す。この 2 つを繰り返すと虚部が増え続け、虚部には上限がある（$(c,d)$ が有限個しかない）ので、いつか $D$ に入る。$D$ は「上に開いた三角形」で、その辺どうしだけが貼り合わさって、$H/G$ は角が $i$, $\rho$ の 2 か所にある一つの曲面（複素平面と同相）になる。
:::

::: proof
**Step 1（1：存在）.** 【主張：$S,T$ の生成する部分群 $G'$ の元 $g$ で $gz\in D$ となるものがある】$\abs{cz+d}\le1$ となる整数の組 $(c,d)$ は有限個（$\abs c\operatorname{Im}z\le1$ と $\abs{c\operatorname{Re}z+d}\le1$）なので、\ref{nt:sl2-action-h} の 1 から $\{\operatorname{Im}(gz):g\in G'\}$ は最大値をもつ。それを与える $g$ に $T^{n}$ を合成して $z'\defeq T^{n}gz$ の実部を $[-\frac12,\frac12]$ に入れる（虚部は変わらない）。$\abs{z'}<1$ なら $\operatorname{Im}(Sz')=\operatorname{Im}z'/\abs{z'}^{2}>\operatorname{Im}z'$ となり最大性に反するので、$z'\in D$。

**Step 2（2・3 の準備）.** $z,gz\in D$, $g=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ とする。$(z,g)$ を $(gz,g^{-1})$ に替えて $\operatorname{Im}(gz)\ge\operatorname{Im}z$、すなわち $\abs{cz+d}\le1$ としてよい。$\operatorname{Im}z\ge\frac{\sqrt3}2$ なので $\abs c\cdot\frac{\sqrt3}2\le\abs{cz+d}\le1$ から $c\in\{0,\pm1\}$。$g$ を $-g$ に替えて $c\in\{0,1\}$ とする。$z=x+iy$ と書く。

**Step 3（$c=0$）.** $d=\pm1$ で $g$ は整数 $b'$ による平行移動 $z\mapsto z+b'$。$x$ と $x+b'$ がともに $[-\frac12,\frac12]$ に入るので、$b'=0$（$g=1$）か、$b'=\pm1$ かつ $x=\mp\frac12$。

**Step 4（$c=1$, $d=0$）.** $\abs z\le1$ と $z\in D$ から $\abs z=1$。$ad-bc=-b=1$ なので $gz=a-1/z=a-\bar z$。実部 $a-x\in[-\frac12,\frac12]$ と $\abs x\le\frac12$ から、$a=0$（$gz=-\bar z=-1/z$）か、$a=\pm1$ かつ $x=\pm\frac12$（$z=-\bar\rho$ で $a=1$、$z=\rho$ で $a=-1$）。後者では $gz=a-\bar z=z$。

**Step 5（$c=1$, $d\neq0$）.** $\abs{z+d}^{2}=(x+d)^{2}+y^{2}\ge(x+d)^{2}+1-x^{2}=1+2xd+d^{2}$（$\abs z\ge1$）なので、$\abs{z+d}\le1$ から $d^{2}\le-2xd\le\abs d$、よって $d=\pm1$ で、すべての不等号が等号：$\abs z=1$, $x=-\frac1{2d}$。$d=1$ なら $z=\rho$、$a-b=1$ で、$\frac1{\rho+1}=-\rho$（$\rho+1=-\rho^{2}$）から
$$
gz=-\rho(a\rho+b)=-a\rho^{2}-b\rho=a(1+\rho)-b\rho=a+\rho,
$$
$gz\in D$ から $a\in\{0,1\}$、$gz\in\{\rho,\rho+1\}$。$d=-1$ なら $z=-\bar\rho=\rho+1$ で同様に $gz\in\{\rho,\rho+1\}$。

**Step 6（2）.** Step 3〜5 で $gz\neq z$ となるのは、$z'=z\pm1$（$\operatorname{Re}z=\mp\frac12$）、$z'=-1/z$（$\abs z=1$）、$\{z,z'\}=\{\rho,\rho+1\}$（これは両方の形に当てはまる：$\rho+1=-1/\rho$）の場合だけ。

**Step 7（3）.** $gz=z$ となる $g\neq1$ は、Step 4 の $a=0$ で $-\bar z=z$、すなわち $z=i$, $g=S$；Step 4 の $a=\pm1$ と Step 5 の $gz=z$ の場合で、$z=\rho$ では $g=\begin{pmatrix}-1&-1\\1&0\end{pmatrix}=(ST)^{2}$ と $g=\begin{pmatrix}0&-1\\1&1\end{pmatrix}=ST$（Step 5 の $a=0$, $b=-1$）、$z=-\bar\rho$ では $TS=\begin{pmatrix}1&-1\\1&0\end{pmatrix}$ と $(TS)^{2}$。これで安定化群が上のとおりに定まる（$I(\rho)=\{1,ST,(ST)^{2}\}$ など）。
:::

::: corollary $H/G$ と $D$ {#nt:modular-quotient keywords="the map D -> H/G is surjective and injective on the interior of D" index="H/G|えいちじー"}
自然な写像 $D\to H/G$ は全射で、$D$ の内部への制限は単射である。
:::

::: proof
\ref{nt:modular-fundamental-domain} の 1 と 2（内部の点は境界の条件をみたさない）。
:::

::: theorem モジュラー群の生成元 {#nt:modular-generators keywords="the modular group G is generated by S and T" index="モジュラー群の生成元|もじゅらーぐんのせいせいげん" refname="モジュラー群の生成元"}
$G$ は $S$ と $T$ で生成される。
:::

::: intuition
モジュラー群のどの元も、「1 だけずらす」と「$-1/z$ で反転する」の 2 つの操作の組合せで書ける。ユークリッドの互除法で整数行列を簡約していくことの幾何的な言い換えである。
:::

::: proof
$g\in G$ と $D$ の内部の点 $z_{0}=2i$ をとる。\ref{nt:modular-fundamental-domain} の Step 1 から $g'(gz_{0})\in D$ となる $g'\in G'$ がある。$z_{0}$ と $g'gz_{0}$ は $D$ の点で $G$ で移り合い、$z_{0}$ は内部の点なので、2 から $g'gz_{0}=z_{0}$、3 から $g'g=1$（$I(2i)=1$）。よって $g=g'^{-1}\in G'$。
:::

::: example
$z=\frac{2+i}5$。$\abs z^{2}=\frac15<1$ なので $Sz=-\frac{5}{2+i}=-(2-i)=-2+i$、$T^{2}Sz=i\in D$。よって $z$ は $i$ と同値で、$i=T^{2}Sz$。
:::

::: hypcheck
- **整数係数**：存在の証明（Step 1）で $\abs{cz+d}\le1$ となる $(c,d)$ が有限個であることに本質的。$\SL_{2}(\mathbb{R})$ では虚部の最大値がなく、基本領域は存在しない（作用が推移的）。
- **$D$ の境界**：2 で境界の点の同一視を正確に述べたので、$D$ は閉集合のまま扱える。内部だけをとれば代表は一意。
- **生成元**：安定化群が自明な内部の点の存在（3）が本質的。
:::

## 問題 {#nt:sec-mg-problems}

::: problem {#nt:prob-mg-reduce}
$z=\frac{1+i}2$ を $D$ の点に移す $g\in G$ を $S,T$ の語で求めよ。
:::

::: solution
$\abs z^{2}=\frac12<1$。$Sz=-\frac2{1+i}=-(1-i)=-1+i$、$T(-1+i)=i\in D$。よって $g=TS$ で $gz=i$。
:::

::: problem {#nt:prob-mg-stabilizer-sl2}
$\SL_{2}(\mathbb{Z})$ の中で $i$ を固定する行列の群は位数 $4$ の巡回群であることを示せ。
:::

::: solution
\ref{nt:modular-fundamental-domain} の 3 から、$G$ での安定化群は $\{1,S\}$。$\SL_{2}(\mathbb{Z})$ ではその逆像 $\{\pm1,\pm S\}$ で、$S^{2}=-1$ なので $S$ は位数 4 で、群は $\langle S\rangle$。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 証明は正則関数の理論を使わない。$G$ が $H$ の正則自己同型群 $\PSL_{2}(\mathbb{R})$ の離散部分群であること自体も使わず、$(c,d)$ の有限性だけで済ませた。

**前提を変えると.**
- **表示**：$G$ は $\langle S,T\mid S^{2},(ST)^{3}\rangle$ で表示され、位数 2 と位数 3 の巡回群の自由積 $\mathbb{Z}/2\ast\mathbb{Z}/3$ と同型である（Se7 VII §1.2 の注意。ここでは証明しない）。
- **合同部分群**：$\Gamma_{0}(N)=\{c\equiv0\bmod N\}$ などの指数有限の部分群の基本領域は、$D$ の有限個の像の和になる（Ap 4）。
- **2 次形式**：$H$ の点 $z$ と、判別式が負の 2 元 2 次形式 $ax^{2}+bxy+cy^{2}$ の根 $z$ を対応させると、$D$ への簡約はガウスの簡約形式の理論（$\abs b\le a\le c$）と一致する。

**高い視点から：モジュライ空間としての $H/G$.** $z\in H$ は格子 $\mathbb{Z}+\mathbb{Z}z$ を定め、$G$ で移り合う $z$ はちょうど相似な格子を与える（基底の取り替え）。したがって $H/G$ は「複素平面の格子の相似類」の空間、すなわち複素トーラス（楕円曲線）のモジュライ空間である。基本領域の角 $i$, $\rho$ は、余分な回転対称性をもつ正方格子と正三角格子に対応し、安定化群の位数 $2,3$ はその対称性の位数である。比喩で言えば、$D$ は「すべての格子の形を一度ずつ並べたカタログ」で、カタログの縁がどう貼り合わさるかを記述するのが 2 と 3 である。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref[演習]{nt:sec-mg-exercises} にまとめた。
