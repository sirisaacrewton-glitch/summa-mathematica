# 演習：モジュラー形式 {#nt:page-exercises-modular-forms keywords="exercises, reduction to the fundamental domain, stabilizers are finite cyclic, weights with one-dimensional cusp form spaces, j(z) = 1728 iff g_3(z) = 0, E_4^2 = E_8 coefficients, Ramanujan congruence tau(n) = sigma_11(n) mod 691, tau(9), Ramanujan bound at p = 2, theta series proof that the rank of an even unimodular lattice is divisible by 8, vectors of norm 4 in E_8 + E_8"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 記法と定義の確認 {#nt:sec-exmf-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$\tilde\Delta\defeq\sum\tau(n)q^{n}=(2\pi)^{-12}\Delta$。
:::

## モジュラー群 {#nt:sec-mg-exercises}

対応するページ：\ref{nt:page-modular-group}

::: problem ★ 基本：基本領域への簡約 {#nt:ex-mg-reduce}
$z=\frac{3+i}{10}$ を $D$ の点に移す $S,T$ の語を求めよ。
:::

::: solution
$\abs z^{2}=\frac1{10}<1$。$Sz=-\frac{10}{3+i}=-(3-i)=-3+i$、$T^{3}Sz=i$。よって $T^{3}S$。
:::

::: problem ★★ 標準：安定化群は有限巡回群 {#nt:ex-mg-stabilizer}
任意の $z\in H$ について、$G$ での安定化群は位数 $1,2,3$ の巡回群であることを示せ。
:::

::: solution
$gz\in D$ となる $g$ をとると $I(z)=g^{-1}I(gz)g$（$hz=z\iff(ghg^{-1})(gz)=gz$）。\ref{nt:modular-fundamental-domain} の 3 から $I(gz)$ は $1$, $\langle S\rangle$（位数 2）, $\langle ST\rangle$ または $\langle TS\rangle$（位数 3）のいずれかで、共役で同型。
:::

## モジュラー形式 {#nt:sec-mfm-exercises}

対応するページ：\ref{nt:page-modular-forms}

::: problem ★ 基本：尖点形式の空間が 1 次元になる重さ {#nt:ex-mfm-one-dim-cusp}
$\dim S_{k}=1$ となる偶数 $k$ をすべて求めよ。
:::

::: solution
$\dim S_{k}=\dim M_{k-12}$（\ref{nt:modular-forms-structure} の 4）が $1$ になるのは、次元公式から $k-12\in\{0,4,6,8,10,14\}$。よって $k=12,16,18,20,22,26$。
:::

::: problem ★★ 標準：$j=1728$ となる点 {#nt:ex-mfm-j-1728}
$j-1728=1728\cdot27\,g_{3}^{2}/\Delta$ を示し、$j(z)=1728\iff z$ が $i$ と $G$ 同値であることを示せ。
:::

::: solution
$j-1728=1728\frac{g_{2}^{3}-\Delta}{\Delta}=1728\frac{27g_{3}^{2}}{\Delta}$。$\Delta$ は $H$ で零点をもたないので、$j(z)=1728\iff g_{3}(z)=0$、$G_{6}$ の零点は $i$ の類だけ（\ref{nt:modular-forms-structure} の 3）。
:::

## フーリエ展開と $\Delta$ の積公式 {#nt:sec-qe-exercises}

対応するページ：\ref{nt:page-q-expansions}

::: problem ★ 基本：$E_{4}^{2}=E_{8}$ の $q^{2}$ の係数 {#nt:ex-qe-e4-square}
$E_{4}^{2}$ と $E_{8}$ の $q^{2}$ の係数を計算して一致を確かめよ。
:::

::: solution
$E_{4}=1+240q+2160q^{2}+\cdots$ から $E_{4}^{2}$ の $q^{2}$ の係数は $2\cdot2160+240^{2}=61920$。$E_{8}$ では $480\sigma_{7}(2)=480\cdot129=61920$。
:::

::: problem ★★★ 発展：ラマヌジャンの合同式 {#nt:ex-qe-691}
$\tau(n)\equiv\sigma_{11}(n)\pmod{691}$（$n\ge1$）を、$E_{12}-E_{6}^{2}\in S_{12}$ を使って示せ。
:::

::: solution
$E_{12}$ と $E_{6}^{2}$ はどちらも $M_{12}$ の元で定数項 $1$ なので、差は $S_{12}=\mathbb{C}\tilde\Delta$ の元。$q^{1}$ の係数は $E_{12}$ で $\frac{65520}{691}$、$E_{6}^{2}$ で $-1008$ なので
$$
691E_{12}-691E_{6}^{2}=(65520+691\cdot1008)\tilde\Delta=762048\,\tilde\Delta.
$$
$q^{n}$（$n\ge1$）の係数を比べると $65520\,\sigma_{11}(n)-691\cdot(\text{整数})=762048\,\tau(n)$（$E_{6}$ の係数は整数）。$65520\equiv566$, $762048\equiv566\pmod{691}$（$691\cdot94=64954$, $691\cdot1102=761482$）なので $566\,\sigma_{11}(n)\equiv566\,\tau(n)\pmod{691}$。$691$ は素数で $566$ と素なので $\tau(n)\equiv\sigma_{11}(n)$。
:::

## ヘッケ作用素 {#nt:sec-he-exercises}

対応するページ：\ref{nt:page-hecke-operators}

::: problem ★ 基本：$\tau(9)$ {#nt:ex-he-tau9}
$\tau(9)$ を漸化式で求めよ。
:::

::: solution
$\tau(9)=\tau(3)^{2}-3^{11}\tau(1)=63504-177147=-113643$。
:::

::: problem ★★ 標準：$p=2$ でのラマヌジャン予想 {#nt:ex-he-ramanujan-2}
$1-\tau(2)X+2^{11}X^{2}=(1-\alpha X)(1-\alpha'X)$ と分解すると、$\alpha,\alpha'$ は互いに複素共役で $\abs\alpha=2^{11/2}$ であることを示せ。また $p=3$ でも同様であることを確かめよ。
:::

::: solution
$\alpha+\alpha'=\tau(2)=-24$, $\alpha\alpha'=2^{11}$。判別式 $\tau(2)^{2}-4\cdot2^{11}=576-8192<0$ なので $\alpha,\alpha'$ は実係数の 2 次式の共役な虚根で、$\abs\alpha^{2}=\alpha\bar\alpha=2^{11}$。$p=3$：$252^{2}-4\cdot3^{11}=63504-708588<0$ で同様に $\abs\alpha=3^{11/2}$。（一般の $p$ での $\abs{\tau(p)}\le2p^{11/2}$ はドリーニュの定理。）
:::

## テータ関数 {#nt:sec-th-exercises}

対応するページ：\ref{nt:page-theta-functions}

::: problem ★ 基本：$E_{8}\oplus E_{8}$ の長さ 2 のベクトル {#nt:ex-th-e8e8-norm4}
$E_{8}\oplus E_{8}$ の、長さの 2 乗が $4$ のベクトルの本数を 2 通りで求めよ。
:::

::: solution
テータ級数 $E_{8}$ の $q^{2}$ の係数で $480\sigma_{7}(2)=61920$。直接には、$(x,y)$ で $x\cdot x+y\cdot y=4$：$(4,0)$, $(0,4)$ が $2\cdot2160$、$(2,2)$ が $240^{2}$ で、計 $4320+57600=61920$。
:::

::: problem ★★★ 発展：テータ級数による「8 の倍数」の証明 {#nt:ex-th-rank-8}
$L$ を階数 $n$ の正定値な偶ユニモジュラー格子とする。\ref{nt:ks-determination} を使わずに、テータ級数の変換則から $8\mid n$ を示せ（ヒント：$f\mid_{w}g\defeq(cz+d)^{-w}f(gz)$ は $\SL_{2}(\mathbb{Z})$ の右作用で、$(ST)^{3}=-1$）。
:::

::: solution
\ref{nt:theta-modular-form} の Step 3 の議論は 8 の倍数性を使わずに $\theta(-1/z)=(z/i)^{n/2}\theta(z)$（主枝）を与える。$L$ を $L\oplus L$ または $L^{\oplus4}$ に替えると（テータ級数は積になる）、$n\not\equiv0\pmod8$ なら $n\equiv4\pmod8$ にできる。このとき $w=n/2$ は偶数で $(z/i)^{w}=(-1)^{n/4}z^{w}=-z^{w}$、すなわち $\theta\mid_{w}S=-\theta$。偶なので $\theta\mid_{w}T=\theta$。右作用（\ref{nt:modular-transformation-criterion} のコサイクル関係）から $\theta\mid_{w}(ST)=-\theta$、$\theta\mid_{w}(ST)^{3}=-\theta$。一方 $(ST)^{3}=-1$ で、$w$ 偶数なので $\theta\mid_{w}(-1)=\theta$。よって $\theta=0$ となり、$\theta(\infty)=1$ に反する。
:::
