# ヘッケ作用素 {#nt:page-hecke-operators keywords="correspondences on the set of lattices, T(n) sends a lattice to the sum of its sublattices of index n, homotheties R_lambda, T(m)T(n) = T(mn) for coprime m, n, T(p^n)T(p) = T(p^{n+1}) + p T(p^{n-1}) R_p, commutative Hecke algebra, sublattices of index n and the matrices (a b; 0 d), Hecke operator on modular forms T(n) f(z) = n^{k-1} sum d^{-k} f((az+b)/d), action on q-expansions gamma(m) = sum_{a | (n,m)} a^{k-1} c(mn/a^2), eigenforms, normalized eigenform coefficients equal eigenvalues, multiplicativity and Euler product, Eisenstein series eigenvalues sigma_{k-1}(n), zeta(s) zeta(s-k+1), Delta is an eigenform, tau(mn) = tau(m) tau(n), tau(p^{n+1}) = tau(p) tau(p^n) - p^11 tau(p^{n-1})"}

ヘッケ作用素 $T(n)$ は、格子をその指数 $n$ の部分格子の和に送る操作から作られる、モジュラー形式の空間 $M_{k}$ の線形作用素である。これらは互いに可換で、$q$ 展開の係数に対して具体的な式で作用する。重さ 12 の尖点形式は $\Delta$ の定数倍しかないので $\Delta$ は自動的にすべての $T(n)$ の固有関数になり、その結果、ラマヌジャンが予想した $\tau(mn)=\tau(m)\tau(n)$（$(m,n)=1$）と漸化式 $\tau(p^{n+1})=\tau(p)\tau(p^{n})-p^{11}\tau(p^{n-1})$ が証明される（モーデル）。

## 記法と定義の確認 {#nt:sec-he-notation}

::: notation
- 格子と相似、重さ $k$ の格子の関数 $F(\lambda\Lambda)=\lambda^{-k}F(\Lambda)$ と弱モジュラー関数 $f$ の対応 $F(\mathbb{Z}\omega_{1}+\mathbb{Z}\omega_{2})=\omega_{2}^{-k}f(\omega_{1}/\omega_{2})$ は \ref{nt:lattices-homothety}。尖点形式・$q$ 展開の定義は \ref{nt:modular-form}、構造定理は \ref{nt:modular-forms-structure}。
- $G_{k}$, $E_{k}$ の $q$ 展開、$\Delta=(2\pi)^{12}\sum\tau(n)q^{n}$ は \ref{nt:eisenstein-q-expansion}, \ref{nt:jacobi-product-formula}, \ref{nt:ramanujan-tau}。
- $\mathcal{R}$ を $\mathbb{C}$ の格子の集合、$X_{\mathcal{R}}$ を $\mathcal{R}$ で生成される自由アーベル群とする。重さは偶数 $k$。
- 素数 $p$ が有限群の位数を割れば位数 $p$ の元があることは \ref{grp:cauchy}。
- 体系は $\ZF$。
:::

## 格子への作用素 {#nt:sec-he-lattices}

::: definition 格子のヘッケ作用素 {#nt:hecke-correspondence keywords="T(n): X_R -> X_R sends a lattice to the formal sum of its sublattices of index n; R_lambda Lambda = lambda Lambda; action on functions TF(Lambda) = F(T Lambda)" index="ヘッケ作用素（格子）|へっけさようそ, 対応（格子の）|たいおう" refname="格子のヘッケ作用素"}
$n\ge1$ について $T(n):X_{\mathcal{R}}\to X_{\mathcal{R}}$ を $T(n)\Lambda\defeq\sum_{[\Lambda:\Lambda']=n}\Lambda'$（有限和：$\Lambda'\supseteq n\Lambda$ で、$\Lambda/n\Lambda\cong(\mathbb{Z}/n)^{2}$ の位数 $n$ の部分群と対応）、$R_{\lambda}\Lambda\defeq\lambda\Lambda$（$\lambda\in\mathbb{C}^{\times}$）で定める。$\mathcal{R}$ 上の関数 $F$ を $X_{\mathcal{R}}$ に線形に延ばし、$(TF)(\Lambda)\defeq F(T\Lambda)$ とする。
:::

::: intuition
格子をその部分格子たちの「平均」に送る操作を、格子の関数に作用させる。格子の関数はモジュラー形式と同じものなので、これがモジュラー形式の上の作用素になる。
:::

::: proposition ヘッケ作用素の関係式 {#nt:hecke-relations keywords="R_lambda R_mu = R_{lambda mu}, R_lambda T(n) = T(n) R_lambda, T(m) T(n) = T(mn) for (m, n) = 1, T(p^n) T(p) = T(p^{n+1}) + p T(p^{n-1}) R_p; the T(n) generate a commutative algebra" index="ヘッケ作用素の関係式|へっけさようそのかんけいしき" refname="ヘッケ作用素の関係式"}
1. $R_{\lambda}R_{\mu}=R_{\lambda\mu}$, $R_{\lambda}T(n)=T(n)R_{\lambda}$。
2. $(m,n)=1$ なら $T(m)T(n)=T(mn)$。
3. 素数 $p$ と $n\ge1$ について $T(p^{n})T(p)=T(p^{n+1})+p\,T(p^{n-1})R_{p}$。
4. $T(n)$ と $R_{\lambda}$ の生成する環は可換で、$T(p^{n})$ は $T(p)$ と $R_{p}$ の多項式。
:::

::: intuition
指数が互いに素な部分格子のとり方は独立に選べるので掛け算になり、素数冪の部分格子は「$p\Lambda$ を経由するかどうか」で数え分けられる。この数え上げの関係が、係数の乗法性と漸化式の源である。
:::

::: proof
**Step 1（1）.** 明らか（$\lambda$ 倍は指数を保つ全単射）。

**Step 2（2）.** 【主張：$[\Lambda:\Lambda'']=mn$ の $\Lambda''$ に、$\Lambda\supseteq\Lambda'\supseteq\Lambda''$, $[\Lambda:\Lambda']=n$, $[\Lambda':\Lambda'']=m$ となる $\Lambda'$ がただ一つある】$A\defeq\Lambda/\Lambda''$（位数 $mn$）と $A[m]\defeq\{x:mx=0\}$ を考える。$um+vn=1$ とすると $x=umx+vnx$ で $umx\in A[n]$, $vnx\in A[m]$、また $A[m]\cap A[n]=0$ なので $A=A[m]\oplus A[n]$。$A[m]$ の元の位数は $m$ を割るので、\ref{grp:cauchy} から $\abs{A[m]}$ の素因数は $m$ の素因数だけ、$A[n]$ も同様で、積が $mn$ なので $\abs{A[m]}=m$。位数 $m$ の部分群は $m$ 倍で消えるので $A[m]$ に含まれ、$A[m]$ と一致する。$\Lambda'/\Lambda''$ は位数 $m$ の部分群なので一意。よって $T(m)T(n)\Lambda$ の各 $\Lambda''$ の係数は $1$。

**Step 3（3）.** 3 つの項はどれも $\Lambda$ の指数 $p^{n+1}$ の部分格子の一次結合（$R_{p}\Lambda=p\Lambda$ は指数 $p^{2}$）。$\Lambda''$ の係数を左辺 $a$、右辺 $b=1$, $c$（$\Lambda''\subseteq p\Lambda$ なら $1$, そうでなければ $0$）とし、$a=1+pc$ を示す。$\Lambda''\not\subseteq p\Lambda$ なら：$a$ は $\Lambda\supseteq\Lambda'\supseteq\Lambda''$, $[\Lambda:\Lambda']=p$ の $\Lambda'$ の個数。$\Lambda'\supseteq p\Lambda$ で、$\Lambda/p\Lambda\cong\mathbb{F}_{p}^{2}$ の中で $\Lambda'$ の像は直線、$\Lambda''$ の像は $0$ でない部分空間で、単因子をとると $\Lambda''$ は $\Lambda$ の適当な基底 $e_{1},e_{2}$ について $p^{\alpha}e_{1},p^{\beta}e_{2}$（$\alpha+\beta=n+1\ge2$, $\min(\alpha,\beta)=0$）を基底にもつので、像はちょうど直線。その直線を含む直線は一つだけで $a=1$。$\Lambda''\subseteq p\Lambda$ なら：指数 $p$ の $p+1$ 個の $\Lambda'$ はすべて $p\Lambda\supseteq\Lambda''$ を含み、$a=p+1$。

**Step 4（4）.** 3 から帰納法で $T(p^{n})$ は $T(p),R_{p}$ の多項式。$T(p)$ と $R_{\lambda}$ は可換、異なる素数の $T(p^{a})$, $T(q^{b})$ は 2 から $T(p^{a}q^{b})$ に等しく可換。
:::

::: lemma 指数 $n$ の部分格子 {#nt:sublattices-index-n keywords="sublattices of index n of Z omega_1 + Z omega_2 correspond bijectively to matrices (a b; 0 d) with ad = n, a >= 1, 0 <= b < d, via the basis a omega_1 + b omega_2, d omega_2; for n = p prime there are p + 1" index="指数 n の部分格子|しすうえぬのぶぶんこうし" refname="指数 n の部分格子"}
$\Lambda$ を基底 $\omega_{1},\omega_{2}$ の格子とする。$ad=n$, $a\ge1$, $0\le b<d$ の整数行列 $\sigma=\begin{pmatrix}a&b\\0&d\end{pmatrix}$ に、基底 $a\omega_{1}+b\omega_{2}$, $d\omega_{2}$ の部分格子 $\Lambda_{\sigma}$ を対応させると、指数 $n$ の部分格子の全体との全単射になる。
:::

::: intuition
指数 $n$ の部分格子は、上三角行列 $\begin{pmatrix}a&b\\0&d\end{pmatrix}$（$ad=n$）で基底を変えたものとして、ちょうど一度ずつ現れる。
:::

::: proof
**Step 1（$\Lambda_{\sigma}$ の指数）.** 基底の変換行列の行列式が $n$ なので指数は $n$。

**Step 2（逆写像）.** 【主張：$\Lambda'$ から $\sigma$ が一意に決まる】$Y_{1}\defeq\Lambda/(\Lambda'+\mathbb{Z}\omega_{2})$, $Y_{2}\defeq\mathbb{Z}\omega_{2}/(\Lambda'\cap\mathbb{Z}\omega_{2})$ は $\omega_{1}$, $\omega_{2}$ の像で生成される巡回群で、位数を $a$, $d$ とすると完全列 $0\to Y_{2}\to\Lambda/\Lambda'\to Y_{1}\to0$ から $ad=n$。$d\omega_{2}\in\Lambda'$ で、$\omega'_{1}\equiv a\omega_{1}\pmod{\mathbb{Z}\omega_{2}}$ となる $\omega'_{1}\in\Lambda'$ がある。$\omega'_{1}=a\omega_{1}+b\omega_{2}$ の $b$ は $d$ を法として決まり、$0\le b<d$ に正規化できる。$\omega'_{1},d\omega_{2}$ は $\Lambda'$ の基底（指数を比べる）。2 つの対応は互いに逆。
:::

## モジュラー形式への作用 {#nt:sec-he-forms}

::: definition モジュラー形式のヘッケ作用素 {#nt:hecke-operator-forms keywords="T(n) f(z) = n^{k-1} sum_{ad = n, a >= 1, 0 <= b < d} d^{-k} f((az + b)/d), defined from n^{k-1} T(n) F on lattices" index="ヘッケ作用素（モジュラー形式）|へっけさようそ" refname="モジュラー形式のヘッケ作用素"}
重さ $k$ の弱モジュラー関数 $f$（格子の関数 $F$ に対応）について、$n^{k-1}T(n)F$ に対応する関数を $T(n)f$ と書く。\ref{nt:sublattices-index-n} から
$$
T(n)f(z)=n^{k-1}\sum_{\substack{ad=n,\ a\ge1\\0\le b<d}}d^{-k}f\Bigl(\frac{az+b}d\Bigr).
$$
:::

::: intuition
ヘッケ作用素は、$z$ を $(az+b)/d$ に動かした値を重みつきで平均する操作で、$q$ 展開で見ると係数を $n$ 倍の位置から集める。
:::

::: theorem ヘッケ作用素の作用 {#nt:hecke-action keywords="T(n) maps weakly modular functions of weight k to weakly modular functions of weight k, preserves M_k and S_k; T(m)T(n) = T(mn) for coprime m, n; T(p)T(p^n) = T(p^{n+1}) + p^{k-1} T(p^{n-1}); on q-expansions gamma(m) = sum_{a | (n, m)} a^{k-1} c(mn/a^2); gamma(0) = sigma_{k-1}(n) c(0), gamma(1) = c(n)" index="ヘッケ作用素の q 展開|へっけさようそのきゅーてんかい" refname="ヘッケ作用素の作用"}
$f=\sum_{m}c(m)q^{m}$ を重さ $k$ のモジュラー関数とする。
1. $T(n)f$ は重さ $k$ のモジュラー関数で、$f\in M_{k}$（$S_{k}$）なら $T(n)f\in M_{k}$（$S_{k}$）。
2. $(m,n)=1$ なら $T(m)T(n)=T(mn)$、素数 $p$ について $T(p)T(p^{n})=T(p^{n+1})+p^{k-1}T(p^{n-1})$。これらの作用素は互いに可換。
3. $T(n)f=\sum_{m}\gamma(m)q^{m}$, $\gamma(m)=\sum_{a\mid(n,m),\,a\ge1}a^{k-1}c\bigl(\frac{mn}{a^{2}}\bigr)$。特に $\gamma(0)=\sigma_{k-1}(n)c(0)$, $\gamma(1)=c(n)$。素数 $p$ では $\gamma(m)=c(pm)+p^{k-1}c(m/p)$（$p\nmid m$ なら第 2 項は $0$）。
:::

::: intuition
$T(n)$ は「格子を指数 $n$ の部分格子に平均的に取り替える」操作で、$q$ 展開では係数を $n$ 倍の位置から拾い集める。$q^{1}$ の係数が $c(n)$ になることが、固有関数の係数と固有値を結びつける鍵である。
:::

::: proof
**Step 1（変換則と 2）.** $R_{\lambda}$ と $T(n)$ は可換なので、$R_{\lambda}(T(n)F)=T(n)(R_{\lambda}F)=\lambda^{-k}T(n)F$、$T(n)F$ も重さ $k$ で、対応する $T(n)f$ は重さ $k$ の弱モジュラー関数。\ref{nt:hecke-relations} の 2・3 を重さ $k$ の関数に作用させると $R_{p}F=p^{-k}F$ から $T(p)T(p^{n})F=T(p^{n+1})F+p^{1-k}T(p^{n-1})F$。正規化 $n^{k-1}$ を掛けると $p^{(n+1)(k-1)}p^{1-k}p^{-(n-1)(k-1)}=p^{k-1}$ で 2 の式。互いに素の場合は $m^{k-1}n^{k-1}=(mn)^{k-1}$。可換性は \ref{nt:hecke-relations} の 4。

**Step 2（3）.** 【主張：$\sum_{0\le b<d}e^{2\pi ibm/d}$ は $d\mid m$ なら $d$、そうでなければ $0$】1 の $d$ 乗根の和。よって
$$
T(n)f=n^{k-1}\sum_{ad=n}d^{-k}\sum_{m}c(m)e^{2\pi ima z/d}\sum_{b}e^{2\pi imb/d}=n^{k-1}\sum_{ad=n}d^{1-k}\sum_{m'}c(m'd)q^{am'}.
$$
$n^{k-1}d^{1-k}=a^{k-1}$。$\mu=am'$ でまとめると $\gamma(\mu)=\sum_{a\mid(n,\mu)}a^{k-1}c(\mu d/a)=\sum a^{k-1}c(\mu n/a^{2})$。$c(m)=0$（$m<-N$）なら $\gamma(\mu)=0$（$\mu<-nN$）で、$T(n)f$ は無限遠で有理型。$\gamma(0)=\sum_{a\mid n}a^{k-1}c(0)$, $\gamma(1)=c(n)$（$a=1$ だけ）。$n=p$ では $a\in\{1,p\}$。

**Step 3（1 の残り）.** 定義式から $f$ が $H$ で正則なら $T(n)f$ も正則。3 から $c(m)=0$（$m<0$）なら $\gamma(m)=0$（$m<0$）、$c(0)=0$ なら $\gamma(0)=0$。
:::

## 固有関数 {#nt:sec-he-eigen}

::: theorem ヘッケ固有形式 {#nt:hecke-eigenform keywords="if a nonzero f in M_k (k > 0) is an eigenfunction of all T(n) with eigenvalues lambda(n), then c(1) != 0, and normalized by c(1) = 1 its coefficients are c(n) = lambda(n); multiplicativity c(mn) = c(m)c(n) for coprime m, n, c(p)c(p^n) = c(p^{n+1}) + p^{k-1} c(p^{n-1}); formal Euler product sum c(n) n^{-s} = prod (1 - c(p) p^{-s} + p^{k-1-2s})^{-1}" index="ヘッケ固有形式|へっけこゆうけいしき, 正規化された固有形式|せいきかされたこゆうけいしき" refname="ヘッケ固有形式"}
$f=\sum c(n)q^{n}\in M_{k}$（$k>0$）, $f\neq0$ がすべての $T(n)$ の固有関数で $T(n)f=\lambda(n)f$ とする。
1. $c(1)\neq0$。$c(1)=1$ と正規化すると $c(n)=\lambda(n)$（$n\ge1$）。同じ固有値をもつ正規化された固有関数は一致する。
2. $(m,n)=1$ なら $c(mn)=c(m)c(n)$、素数 $p$ について $c(p)c(p^{n})=c(p^{n+1})+p^{k-1}c(p^{n-1})$。
3. 形式的なディリクレ級数として $\sum_{n\ge1}c(n)n^{-s}=\prod_{p}(1-c(p)p^{-s}+p^{k-1-2s})^{-1}$（係数の増大度から $\operatorname{Re}s>k$ で絶対収束）。
:::

::: intuition
固有関数では、$T(n)f$ の $q$ の係数 $c(n)$ と、$\lambda(n)f$ の $q$ の係数 $\lambda(n)c(1)$ が等しい：係数そのものが固有値になる。固有値はヘッケ作用素の関係式をみたすので、係数も乗法的になり、ディリクレ級数がオイラー積をもつ。
:::

::: proof
**Step 1（1）.** 【主張：$q^{1}$ の係数は $0$ でなく、係数は固有値】\ref{nt:hecke-action} の 3 から $T(n)f$ の $q^{1}$ の係数は $c(n)$、一方 $\lambda(n)c(1)$。$c(1)=0$ ならすべての $c(n)=0$（$n\ge1$）で $f$ は定数、重さ $k>0$ の定数は $0$（$f(-1/z)=z^{k}f(z)$）で矛盾。正規化すれば $c(n)=\lambda(n)$。2 つの差に同じ議論を使うと、差は $q^{1}$ の係数が $0$ の固有関数なので $0$。

**Step 2（2）.** 【主張：係数は作用素の関係式をみたす】固有値は作用素の関係式（\ref{nt:hecke-action} の 2）をみたす。

**Step 3（3）.** 【主張：各素数の因子は 2 次式の逆数】2 から $c$ は乗法的なので、各 $p$ の因子 $\sum_{n}c(p^{n})T^{n}$（$T=p^{-s}$）に分かれる。$(\sum c(p^{n})T^{n})(1-c(p)T+p^{k-1}T^{2})$ の $T^{1}$ の係数は $c(p)-c(p)=0$、$T^{n+1}$ の係数は $c(p^{n+1})-c(p)c(p^{n})+p^{k-1}c(p^{n-1})=0$ なので、積は $1$。絶対収束は \ref{nt:coefficient-growth}。
:::

::: proposition アイゼンシュタイン級数と $\Delta$ の固有値 {#nt:hecke-eisenstein-delta keywords="G_k is an eigenform with eigenvalues sigma_{k-1}(n); normalized -B_k/(2k) + sum sigma_{k-1}(n) q^n; Dirichlet series zeta(s) zeta(s - k + 1); Delta is an eigenform with eigenvalues tau(n); tau(mn) = tau(m) tau(n), tau(p^{n+1}) = tau(p) tau(p^n) - p^11 tau(p^{n-1})" index="τ の乗法性|たうのじょうほうせい" refname="アイゼンシュタイン級数と Δ の固有値"}
1. $G_{k}$ は固有値 $\sigma_{k-1}(n)$ の固有関数で、正規化すると $-\frac{B_{k}}{2k}+\sum\sigma_{k-1}(n)q^{n}$。対応するディリクレ級数は $\zeta(s)\zeta(s-k+1)$。
2. $\Delta$ は固有値 $\tau(n)$ の固有関数。したがって $\tau(mn)=\tau(m)\tau(n)$（$(m,n)=1$）、$\tau(p^{n+1})=\tau(p)\tau(p^{n})-p^{11}\tau(p^{n-1})$。
:::

::: intuition
アイゼンシュタイン級数は格子の点の和なので、部分格子の平均をとっても形が変わらず固有関数になる。$\Delta$ は重さ 12 の尖点形式の唯一の方向なので、どの作用素でも自分自身の定数倍に移る。
:::

::: proof
**Step 1（1：格子の上の計算）.** 【主張：$T(p)G_{k}(\Lambda)=(1+p^{1-k})G_{k}(\Lambda)$】$\gamma\in p\Lambda$ は指数 $p$ の $p+1$ 個の部分格子のすべてに、$\gamma\in\Lambda\setminus p\Lambda$ はちょうど一つに入る（$\gamma$ の像の生成する直線を含む直線は一つ）。よって $T(p)G_{k}(\Lambda)=G_{k}(\Lambda)+pG_{k}(p\Lambda)=(1+p\cdot p^{-k})G_{k}(\Lambda)$。

**Step 2（1：モジュラー形式として）.** 正規化 $p^{k-1}$ を掛けて固有値 $p^{k-1}+1=\sigma_{k-1}(p)$。$T(p)$ が $T(n)$ を生成するので $G_{k}$ はすべての $T(n)$ の固有関数。$G_{k}=2\zeta(k)E_{k}$, $E_{k}=1-\frac{2k}{B_{k}}\sum\sigma_{k-1}q^{n}$（\ref{nt:eisenstein-q-expansion}）から正規化は $-\frac{B_{k}}{2k}E_{k}$ で、固有値は係数 $\sigma_{k-1}(n)$。$\sum\sigma_{k-1}(n)n^{-s}=\sum_{a,d}a^{k-1}(ad)^{-s}=\zeta(s)\zeta(s-k+1)$。

**Step 3（2）.** $S_{12}$ は 1 次元で $T(n)$ で保たれるので、$\Delta$ は固有関数。正規化は $\sum\tau(n)q^{n}$（$\tau(1)=1$）で、\ref{nt:hecke-eigenform} から主張を得る。
:::

::: example
$\tau(2)=-24$, $\tau(3)=252$ から $\tau(6)=-6048$。$\tau(4)=\tau(2)^{2}-2^{11}=576-2048=-1472$。いずれも $q\prod(1-q^{n})^{24}$ を直接展開した値（Se7 VII §4.5 の表）と一致する。
:::

::: hypcheck
- **関係式**：$\mathbb{Z}^{2}$ の部分群の構造（有限アーベル群の分解、$\mathbb{F}_{p}^{2}$ の直線の数え上げ）を使った。格子が階数 2 であることが $p+1$ という個数に本質的。
- **固有形式**：$k>0$ は「重さ正の定数は $0$」に使った。$k=0$ では定数関数が $c(1)=0$ の固有関数になる。
- **$\tau$ の乗法性**：$\dim S_{12}=1$ が本質的。$\dim S_{k}\ge2$（$k=24$ など）では、$S_{k}$ に固有関数の基底があっても、一つの形式が固有関数とは限らない。
:::

## 問題 {#nt:sec-he-problems}

::: problem {#nt:prob-he-tau-8}
$\tau(8)$ を $\tau(2)$ から漸化式で求めよ。
:::

::: solution
$\tau(8)=\tau(2)\tau(4)-2^{11}\tau(2)=(-24)(-1472)-2048\cdot(-24)=35328+49152=84480$。表の値と一致する。
:::

::: problem {#nt:prob-he-t2-e4}
$T(2)E_{4}$ の $q^{1}$ と $q^{2}$ の係数を \ref{nt:hecke-action} の式で計算し、$T(2)E_{4}=\sigma_{3}(2)E_{4}=9E_{4}$ と整合することを確かめよ。
:::

::: solution
$E_{4}=\sum c(m)q^{m}$, $c(0)=1$, $c(m)=240\sigma_{3}(m)$。$\gamma(1)=c(2)=2160$、$\gamma(2)=c(4)+2^{3}c(1)=240\cdot73+8\cdot240=19440$。$9E_{4}$ の係数は $9\cdot240=2160$, $9\cdot2160=19440$ で一致。$\gamma(0)=\sigma_{3}(2)c(0)=9$ とも整合。
:::

::: supplement
**使わなかった前提・本質的でない前提.** ここではヘッケ作用素の可換性を格子の数え上げだけから示した。$S_{k}$ に固有関数の基底があることは使っていない。

**前提を変えると.**
- **ペテルソン内積**：$\langle f,g\rangle=\int_{D}f\bar gy^{k}\frac{dx\,dy}{y^{2}}$ は $S_{k}$ の正定値エルミート内積で、$T(n)$ はこれについて自己共役である。したがって $S_{k}$ には同時固有関数からなる直交基底があり、固有値は実数（Se7 VII §5.6.1、ここでは証明しない）。
- **ヘッケの $L$ 関数**：$\sum c(n)n^{-s}$ は全平面に解析接続され、$(2\pi)^{-s}\Gamma(s)L(s)$ は $s\mapsto k-s$ で $(-1)^{k/2}$ 倍の対称性をもつ（ヘッケ。証明にはメリン変換と $f(-1/z)=z^{k}f(z)$ を使う）。
- **整数性**：$q$ 展開の係数が整数のモジュラー形式は $T(n)$ で保たれるので、$T(n)$ の固有値は代数的整数である。

**高い視点から：ヘッケ環とガロア表現.** ヘッケ作用素の環は、各素数 $p$ ごとに「$p$ での局所的な対称性」を記録する可換環で、固有形式はその環の指標（$c(p)$ の値の組）を与える。アイヒラー–志村–ドリーニュによって、正規化された固有尖点形式には $\ell$ 進ガロア表現が対応し、$c(p)$ はフロベニウス元のトレース、漸化式の $p^{k-1}$ は行列式になる。比喩で言えば、ヘッケ作用素は各素数で「楽器を叩く」操作で、固有形式はすべての素数で同時にきれいに共鳴する音であり、その共鳴の高さ $c(p)$ が数論的なガロア群の情報を運んでいる。
:::
