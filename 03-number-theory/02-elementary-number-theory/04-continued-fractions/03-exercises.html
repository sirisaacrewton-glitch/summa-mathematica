この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 連分数とディオファントス近似 {#nt:sec-cf-exercises}

対応するページ：\ref{nt:page-continued-fractions}

::: problem ★ 基本：$\pi$ の近似分数 {#nt:ex-cf-pi}
$\pi=[3;7,15,1,292,\dots]$ を使って近似分数 $p_{0}/q_{0},\dots,p_{3}/q_{3}$ を漸化式で計算し、$\abs{\pi-\frac{22}{7}}<\frac{1}{7\cdot106}$ を確かめよ。
:::

::: solution
$p_{0}=3$, $p_{1}=7\cdot3+1=22$, $p_{2}=15\cdot22+3=333$, $p_{3}=333+22=355$；$q_{0}=1$, $q_{1}=7$, $q_{2}=15\cdot7+1=106$, $q_{3}=106+7=113$。\ref{nt:continued-fraction-convergence} の 2 から $\abs{\pi-\frac{22}{7}}<\frac{1}{q_{1}q_{2}}=\frac{1}{742}$。実際 $\frac{22}{7}-\pi\approx0.00126<0.00135$。
:::

::: problem ★★ 標準：$[\overline a]$ の値 {#nt:ex-cf-constant}
正の整数 $a$ について $[a;a,a,\dots]=\frac{a+\sqrt{a^{2}+4}}{2}$ を示せ。$a=1$ では黄金比、$a=2$ では $1+\sqrt2$ になる。
:::

::: solution
\ref{nt:continued-fraction-convergence} の 3 から $\beta\defeq[a;a,\dots]$ は収束し、$\beta=a+\frac{1}{[a;a,\dots]}=a+\frac1\beta$。$\beta^{2}-a\beta-1=0$ で $\beta>a>0$ なので正の根 $\frac{a+\sqrt{a^{2}+4}}{2}$。
:::

## 2 次無理数と循環連分数 {#nt:sec-qi-exercises}

対応するページ：\ref{nt:page-quadratic-irrationals}

::: problem ★ 基本：$x^{2}-19y^{2}=1$ {#nt:ex-qi-19}
$\sqrt{19}=[4;\overline{2,1,3,1,2,8}]$ を使って $x^{2}-19y^{2}=1$ の基本解を求めよ。
:::

::: solution
周期 $r=6$（偶数）なので基本解は $(p_{5},q_{5})$（\ref{nt:pell-continued-fraction}。$k<5$ の近似分数のノルムは $-3,5,-2,5,-3$ で $1$ でない）。近似分数は $\frac41,\frac92,\frac{13}{3},\frac{48}{11},\frac{61}{14},\frac{170}{39}$ で、$170^{2}-19\cdot39^{2}=28900-28899=1$。基本解は $(170,39)$。
:::

::: problem ★★ 標準：$d=a^{2}+1$ のペル方程式 {#nt:ex-qi-a2-plus-1}
$a\ge1$, $d\defeq a^{2}+1$ について $\sqrt d=[a;\overline{2a}]$ を示し、$x^{2}-dy^{2}=-1$ の解 $(a,1)$ と、$x^{2}-dy^{2}=1$ の基本解 $(2a^{2}+1,2a)$ を求めよ。
:::

::: solution
$a<\sqrt{a^{2}+1}<a+1$ から $a_{0}=a$。$\alpha_{1}=\frac{1}{\sqrt d-a}=\sqrt d+a$（$(\sqrt d-a)(\sqrt d+a)=1$）、$a_{1}=2a$、$\alpha_{2}=\frac{1}{\alpha_{1}-2a}=\frac{1}{\sqrt d-a}=\alpha_{1}$。よって $\sqrt d=[a;\overline{2a}]$, $r=1$。$p_{0}/q_{0}=a/1$ で $a^{2}-d=-1$。$r$ が奇数なので基本解は $(p_{1},q_{1})=(2a\cdot a+1,2a)$ で、$(2a^{2}+1)^{2}-(a^{2}+1)4a^{2}=1$（\ref{nt:pell-continued-fraction}）。
:::
