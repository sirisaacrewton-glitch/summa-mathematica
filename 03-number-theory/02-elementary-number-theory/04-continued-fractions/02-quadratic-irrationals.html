# 2 次無理数と循環連分数 {#nt:page-quadratic-irrationals keywords="quadratic irrational, conjugate, periodic continued fraction, Euler: periodic implies quadratic, Lagrange: quadratic irrationals have eventually periodic expansions, invariance of the discriminant, reduced quadratic irrational, Galois: purely periodic iff reduced, continued fraction of sqrt d, Pell's equation x^2 - d y^2 = 1 via convergents, fundamental solution"}

無理数の連分数展開が周期的になるのはいつか。答えは「2 次方程式の根であるとき、かつそのときに限る」で、前半（循環 ⇒ 2 次）はオイラー、後半（2 次 ⇒ 循環）はラグランジュによる。このページではこの**ラグランジュの定理**を、2 次形式の判別式が近似分数による変換で変わらないことから証明する。次に、純循環になる条件（**ガロアの定理**）を求め、$\sqrt d$ の展開が $[a_{0};\overline{a_{1},\dots,a_{r-1},2a_{0}}]$ の形になることを示す。最後に、その近似分数から**ペル方程式** $x^{2}-dy^{2}=1$ の最小解が得られることを示す。

## 記法と定義の確認 {#nt:sec-qi-notation}

::: notation
- 連分数、近似分数 $p_{k}/q_{k}$、完全商 $\alpha_{k}$、\ref{nt:convergent-properties}、\ref{nt:continued-fraction-convergence}、\ref{nt:best-approximation} は \ref{nt:page-continued-fractions} のとおり。
- 無理数 $\alpha$ が整数係数の 2 次方程式の根であるとき **2 次無理数**という。$\alpha=\frac{P+\sqrt D}{Q}$（$D>0$ は平方数でない整数）と書け、$\alpha'\defeq\frac{P-\sqrt D}{Q}$ を**共役**という。$\mathbb{Q}(\sqrt D)$ の元 $x+y\sqrt D$（$x,y\in\mathbb{Q}$）の共役 $x-y\sqrt D$ をとる写像は体の自己同型である。
- 部分商の列が、ある番号から先で周期 $r$ で繰り返すとき**循環する**といい、$[a_{0};\dots,a_{m-1},\overline{a_{m},\dots,a_{m+r-1}}]$ と書く。$m=0$ のとき**純循環**という。
- ペル方程式の解の存在と、解全体が基本解の冪で表されることは \ref{nt:pell-equation}（単数定理による）。
- 体系は $\ZF$。
:::

## ラグランジュの定理 {#nt:sec-qi-lagrange}

::: lemma 判別式の不変性 {#nt:discriminant-invariance keywords="if alpha is a root of A x^2 + B x + C with discriminant D, then the complete quotient alpha_k is a root of A_k x^2 + B_k x + C_k with A_k = f(p_{k-1}, q_{k-1}), C_k = A_{k-1}, and the same discriminant D" index="判別式の不変性（連分数）|はんべつしきのふへんせい"}
$\alpha$ を $f(x,y)\defeq Ax^{2}+Bxy+Cy^{2}$（$A,B,C\in\Z$、$D\defeq B^{2}-4AC>0$ は平方数でない）について $f(\alpha,1)=0$ となる無理数とする。$k\ge1$ について、完全商 $\alpha_{k}$ は $A_{k}x^{2}+B_{k}x+C_{k}=0$ の根で、
$$A_{k}=f(p_{k-1},q_{k-1}),\qquad C_{k}=f(p_{k-2},q_{k-2}),\qquad B_{k}^{2}-4A_{k}C_{k}=D,$$
$A_{k}\neq0$ である。
:::

::: proof
**Step 1（代入）.** $\alpha=\frac{\alpha_{k}P+P'}{\alpha_{k}Q+Q'}$（$P=p_{k-1}$, $P'=p_{k-2}$, $Q=q_{k-1}$, $Q'=q_{k-2}$）を $f(\alpha,1)=0$ に代入し、$(\alpha_{k}Q+Q')^{2}$ を掛けると $f(\alpha_{k}P+P',\alpha_{k}Q+Q')=0$。展開すると $\alpha_{k}^{2}$ の係数は $f(P,Q)$、定数項は $f(P',Q')$。

**Step 2（判別式）.** $f$ の係数を行列 $M=\begin{pmatrix}A&B/2\\B/2&C\end{pmatrix}$ で表すと、置き換えは $M\mapsto g^{\mathsf T}Mg$, $g=\begin{pmatrix}P&P'\\Q&Q'\end{pmatrix}$ で、$\det g=\pm1$（\ref{nt:convergent-properties} の 2）。判別式は $-4\det M$ なので不変。

**Step 3（$A_{k}\neq0$）.** $A_{k}=0$ なら判別式 $D=B_{k}^{2}$ は平方数になり矛盾。
:::

::: theorem ラグランジュの定理（循環連分数） {#nt:lagrange-periodic keywords="the continued fraction expansion of a real number is eventually periodic iff it is a quadratic irrational (Euler and Lagrange)" index="ラグランジュの定理（循環連分数）|らぐらんじゅのていり, 循環連分数|じゅんかんれんぶんすう" refname="ラグランジュの定理（循環連分数）"}
無理数 $\alpha$ の連分数展開が循環することと、$\alpha$ が 2 次無理数であることは同値。
:::

::: intuition
2 次無理数の完全商は、どれも判別式が同じ 2 次方程式の根で、その係数は近似分数の良さから有界に保たれる。有界な整数係数の方程式は有限個しかないので、完全商はいつか同じものが現れ、そこから先は同じ展開が繰り返される。
:::

::: proof
**Step 1（循環 ⇒ 2 次：オイラー）.** 純循環部分 $\beta=[\overline{b_{0};\dots,b_{r-1}}]$ は $\beta=[b_{0};\dots,b_{r-1},\beta]=\frac{\beta P+P'}{\beta Q+Q'}$（\ref{nt:convergent-properties} の 1）なので、整数係数の 2 次方程式 $Q\beta^{2}+(Q'-P)\beta-P'=0$（$Q\ge1$）を満たし、無限展開なので無理数。$\alpha=[a_{0};\dots,a_{m-1},\beta]=\frac{\beta S+S'}{\beta T+T'}$ は $\mathbb{Q}(\beta)$ の無理数で、$\mathbb{Q}(\beta)=\mathbb{Q}(\sqrt D)$ の無理数は 2 次無理数。

**Step 2（2 次 ⇒ 循環：係数の有界性）.** 【主張：$A_{k}$, $B_{k}$, $C_{k}$ は $k$ によらず有界】$A_{k}=f(p_{k-1},q_{k-1})=Aq_{k-1}^{2}\bigl(\frac{p_{k-1}}{q_{k-1}}-\alpha\bigr)\bigl(\frac{p_{k-1}}{q_{k-1}}-\alpha'\bigr)$ で、$\abs{\frac{p_{k-1}}{q_{k-1}}-\alpha}<\frac{1}{q_{k-1}^{2}}\le1$（\ref{nt:continued-fraction-convergence}）なので
$$\abs{A_{k}}<\abs{A}\Bigl(\abs{\alpha-\alpha'}+1\Bigr).$$
$C_{k}=A_{k-1}$ も同じ評価を満たし（$k\ge2$）、$B_{k}^{2}=D+4A_{k}C_{k}$ も有界。

**Step 3（2 次 ⇒ 循環：繰り返し）.** 整数の 3 つ組 $(A_{k},B_{k},C_{k})$ は有限個しかないので、ある 3 つ組が 3 回以上現れる。2 次方程式の根は 2 つなので、$j<k$ で $\alpha_{j}=\alpha_{k}$ となるものがある。完全商は前の完全商から決まる（\ref{nt:continued-fraction-expansion}）ので、$\alpha_{j+i}=\alpha_{k+i}$（$i\ge0$）、部分商は番号 $j$ から周期 $k-j$ で循環する。
:::

## 純循環と $\sqrt d$ {#nt:sec-qi-galois}

::: theorem ガロアの定理（純循環） {#nt:galois-purely-periodic keywords="a quadratic irrational has a purely periodic expansion iff it is reduced: alpha > 1 and -1 < alpha' < 0" index="ガロアの定理（純循環連分数）|がろあのていり, 簡約された 2 次無理数|かんやくされたにじむりすう" refname="ガロアの定理（純循環）"}
2 次無理数 $\alpha$ の展開が純循環であることと、$\alpha$ が**簡約**されている（$\alpha>1$ かつ $-1<\alpha'<0$）ことは同値。
:::

::: intuition
純循環の数は、展開を後ろ向きにもたどれる数である。共役が $(-1,0)$ にあるという条件が、一つ前の部分商を一意に決めることを保証し、いつかは循環することと合わせて、最初から循環していることが出る。
:::

::: proof
**Step 1（$\Rightarrow$）.** $\alpha=[\overline{a_{0};\dots,a_{r-1}}]$ なら $a_{0}=a_{r}\ge1$ なので $\alpha>1$。$\alpha$ は $g(x)\defeq q_{r-1}x^{2}+(q_{r-2}-p_{r-1})x-p_{r-2}$ の根（\ref{nt:lagrange-periodic} の Step 1）で、$\alpha'$ はもう一つの根。$g(0)=-p_{r-2}<0$（$a_{0}\ge1$ から $p_{k}\ge1$, $k\ge-1$）、$g(-1)=(q_{r-1}-q_{r-2})+(p_{r-1}-p_{r-2})>0$（$q,p$ は単調非減少で、$r=1$ では $q_{0}-q_{-1}=1$、$r\ge2$ では $p_{r-1}>p_{r-2}$）。中間値の定理から $(-1,0)$ に根があり、それは正の $\alpha$ ではないので $\alpha'$。

**Step 2（$\Leftarrow$：簡約性の遺伝）.** 【主張：$\alpha_{k}$ が簡約なら $\alpha_{k+1}$ も簡約で、$a_{k}=\lfloor-1/\alpha'_{k+1}\rfloor$】$\alpha_{k+1}>1$ は常に成り立つ。共役をとって $\alpha'_{k+1}=\frac{1}{\alpha'_{k}-a_{k}}$ で、$\alpha'_{k}-a_{k}<-a_{k}\le-1$ なので $-1<\alpha'_{k+1}<0$。また $-\frac{1}{\alpha'_{k+1}}=a_{k}-\alpha'_{k}$ で、$0<-\alpha'_{k}<1$ から $a_{k}=\lfloor-1/\alpha'_{k+1}\rfloor$。

**Step 3（$\Leftarrow$：後ろ向きの決定）.** Step 2 から $\alpha_{k+1}$ は $a_{k}$ を決め、$\alpha_{k}=a_{k}+1/\alpha_{k+1}$ も決まる。ラグランジュの定理から $\alpha_{j}=\alpha_{j+r}$ となる $j$ があり、これを後ろへたどると $\alpha_{0}=\alpha_{r}$。よって純循環。
:::

::: corollary $\sqrt d$ の連分数 {#nt:sqrt-d-expansion keywords="sqrt d = [a_0; overline{a_1, ..., a_{r-1}, 2 a_0}] for a non-square d" index="平方根の連分数|へいほうこんのれんぶんすう"}
平方数でない正の整数 $d$ と $a_{0}\defeq\lfloor\sqrt d\rfloor$ について、$\sqrt d=[a_{0};\overline{a_{1},\dots,a_{r-1},2a_{0}}]$ の形に展開される。
:::

::: proof
$\beta\defeq a_{0}+\sqrt d>1$, $\beta'=a_{0}-\sqrt d\in(-1,0)$ なので簡約で、\ref{nt:galois-purely-periodic} から純循環 $\beta=[\overline{b_{0};\dots,b_{r-1}}]$、$b_{0}=\lfloor\beta\rfloor=2a_{0}$。$\sqrt d=\beta-a_{0}$ の部分商は $b_{0}-a_{0}=a_{0},b_{1},\dots,b_{r-1},b_{0}=2a_{0},b_{1},\dots$。
:::

## ペル方程式 {#nt:sec-qi-pell}

::: theorem ペル方程式の連分数による解法 {#nt:pell-continued-fraction keywords="if r is the period of sqrt d then p_{r-1}^2 - d q_{r-1}^2 = (-1)^r; every positive solution of x^2 - d y^2 = +-1 is a convergent; the fundamental solution of x^2 - d y^2 = 1 is (p_{r-1}, q_{r-1}) for r even and (p_{2r-1}, q_{2r-1}) for r odd" index="ペル方程式の連分数による解法|ぺるほうていしきのれんぶんすうによるかいほう" refname="ペル方程式の連分数による解法"}
$d\ge2$ を平方数でない整数、$r$ を $\sqrt d$ の展開の周期とし、$p_{k}/q_{k}$ を $\sqrt d$ の近似分数とする。
1. $p_{r-1}^{2}-dq_{r-1}^{2}=(-1)^{r}$、$p_{2r-1}^{2}-dq_{2r-1}^{2}=1$。
2. $x,y\ge1$ が $x^{2}-dy^{2}=\pm1$ を満たすなら、$x/y$ は $\sqrt d$ の近似分数である。
3. したがって $x^{2}-dy^{2}=1$ の正の解のうち最小のもの（**基本解**）は、近似分数 $p_{k}/q_{k}$ を $k=0,1,\dots$ の順に調べて最初に $p_{k}^{2}-dq_{k}^{2}=1$ となるもので、それは $k\le2r-1$ に現れる。
:::

::: intuition
$\sqrt d$ の連分数は 1 周期ごとに $a_{0}+\sqrt d$ に戻る。その戻り方を近似分数の式に書き下すと、周期の終わりの近似分数がノルム $\pm1$ をもつことがわかる。逆に、ノルム $\pm1$ の分数は $\sqrt d$ にきわめて近いので、ルジャンドルの定理により必ず近似分数として現れる。
:::

::: proof
**Step 1（1）.** 【主張：周期の終わりの近似分数はノルム $(-1)^{r}$】\ref{nt:sqrt-d-expansion} から $\alpha_{r}=a_{0}+\sqrt d$ で、$\sqrt d=\frac{\alpha_{r}p_{r-1}+p_{r-2}}{\alpha_{r}q_{r-1}+q_{r-2}}$。分母を払い $\alpha_{r}=a_{0}+\sqrt d$ を代入すると
$$\sqrt d\,(a_{0}q_{r-1}+q_{r-2})+dq_{r-1}=a_{0}p_{r-1}+p_{r-2}+\sqrt d\,p_{r-1}.$$
$\sqrt d$ は無理数なので、有理部分と $\sqrt d$ の係数をそれぞれ比べて $p_{r-1}=a_{0}q_{r-1}+q_{r-2}$, $dq_{r-1}=a_{0}p_{r-1}+p_{r-2}$。よって
$$p_{r-1}^{2}-dq_{r-1}^{2}=p_{r-1}(a_{0}q_{r-1}+q_{r-2})-q_{r-1}(a_{0}p_{r-1}+p_{r-2})=p_{r-1}q_{r-2}-p_{r-2}q_{r-1}=(-1)^{r}$$
（\ref{nt:convergent-properties} の 2）。$2r$ も周期なので、同じ議論で $p_{2r-1}^{2}-dq_{2r-1}^{2}=(-1)^{2r}=1$。

**Step 2（2）.** 【主張：ノルム $\pm1$ の分数は近似分数】$x^{2}=dy^{2}\pm1\ge2y^{2}-1\ge y^{2}$ から $x\ge y$。
$$\Bigl\lvert\sqrt d-\frac xy\Bigr\rvert=\frac{\abs{dy^{2}-x^{2}}}{y(x+y\sqrt d)}=\frac{1}{y^{2}(x/y+\sqrt d)}<\frac{1}{2y^{2}}$$
（$x/y+\sqrt d\ge1+\sqrt2>2$）。\ref{nt:best-approximation} の 2 から $x/y$ は近似分数で、$x,y$ は互いに素（$x^{2}-dy^{2}=\pm1$）なので $(x,y)=(p_{k},q_{k})$。

**Step 3（3）.** 【主張：基本解は最初にノルム 1 となる近似分数】2 から正の解はすべて近似分数で、$p_{k}$ は $k$ について真に増える（$k\ge1$）ので、最小の解は条件を満たす最小の $k$ のもの。1 からそのような $k\le2r-1$ がある。
:::

::: example
1. $\sqrt7=[2;\overline{1,1,1,4}]$, $r=4$：近似分数 $2,3,\frac52,\frac83$ で、$8^{2}-7\cdot3^{2}=1$。基本解は $(8,3)$。
2. $\sqrt{13}=[3;\overline{1,1,1,1,6}]$, $r=5$（奇数）：$p_{4}/q_{4}=\frac{18}{5}$ で $18^{2}-13\cdot5^{2}=-1$、$p_{9}/q_{9}=\frac{649}{180}$ で $649^{2}-13\cdot180^{2}=1$。基本解は $(649,180)$。
3. $\sqrt2=[1;\overline2]$, $r=1$：$1^{2}-2\cdot1^{2}=-1$, $3^{2}-2\cdot2^{2}=1$。
:::

::: hypcheck
- **判別式の不変性**：$\det g=\pm1$（近似分数の性質）が本質。$D$ が平方数でないことは $A_{k}\neq0$ に使った。
- **ラグランジュの定理**：近似分数の良さ $\abs{\alpha-p/q}<1/q^{2}$ を係数の有界性に使った。
- **ガロアの定理**：$\Leftarrow$ ではラグランジュの定理（いつかは循環する）を使い、簡約性で後ろ向きにたどった。
- **ペル方程式**：$d\ge2$ は Step 2 の $x\ge y$（$2y^{2}-1\ge y^{2}$）に使った。
:::

## 問題 {#nt:sec-qi-problems}

::: problem {#nt:prob-qi-sqrt3}
$\sqrt3$ の連分数展開を求め、$x^{2}-3y^{2}=1$ の基本解を求めよ。
:::

::: solution
$\alpha_{0}=\sqrt3$, $a_{0}=1$；$\alpha_{1}=\frac{1}{\sqrt3-1}=\frac{\sqrt3+1}{2}$, $a_{1}=1$；$\alpha_{2}=\frac{1}{\alpha_{1}-1}=\frac{2}{\sqrt3-1}=\sqrt3+1$, $a_{2}=2$；$\alpha_{3}=\frac{1}{\sqrt3-1}=\alpha_{1}$。よって $\sqrt3=[1;\overline{1,2}]$, $r=2$。近似分数 $1,2$ で $2^{2}-3\cdot1^{2}=1$。基本解は $(2,1)$。
:::

::: problem {#nt:prob-qi-reduced}
$\alpha=\frac{1+\sqrt5}{2}$ が簡約されていることを確かめ、展開が純循環であることと合うことを確認せよ。
:::

::: solution
$\alpha\approx1.618>1$, $\alpha'=\frac{1-\sqrt5}{2}\approx-0.618\in(-1,0)$ なので簡約。実際 $\alpha=[\overline1]$ で純循環。
:::

::: supplement
**使わなかった前提・本質的でない前提.** ラグランジュの定理の証明は、2 次方程式の係数が整数であることと近似分数の性質だけを使い、2 次体の整数環の理論を使わない。

**前提を変えると.**
- 3 次以上の代数的数の連分数展開については、部分商が有界かどうかさえ一般にはわかっていない（例えば $\sqrt[3]{2}$）、と一般に言われている。
- 周期の長さ $r$ は $O(\sqrt d\log d)$ で押さえられ、基本解は $d$ に対して指数的に大きくなりうる（$d=61$ では $(1766319049,226153980)$）、と知られている。
- \ref{nt:pell-equation} は単数定理から解の存在と構造（基本解の冪）を示すもので、このページはそれを計算する具体的な方法を与える。ノルム $-1$ の解があることと周期 $r$ が奇数であることは同値である、と知られている。

**高い視点から：$\mathrm{GL}_{2}(\Z)$ の作用と 2 次形式.** 完全商の列は、2 次無理数の $\mathrm{GL}_{2}(\Z)$ 軌道の中を、判別式 $D$ の 2 次形式 $f(x,y)$ を保ちながら動く。簡約された 2 次無理数は簡約された 2 次形式に対応し、純循環の周期は、ガウスの 2 次形式の簡約理論における「簡約形式のサイクル」そのものである。周期の終わりで元に戻る変換は、2 次形式の自己同型、すなわち $\mathbb{Q}(\sqrt d)$ の単数を与え、それがペル方程式の解である。比喩で言えば、$\sqrt d$ の連分数は、2 次形式の世界の中の周回軌道を一周する旅で、出発点に戻ったときの移動量が基本単数になる。
:::
