# 演習：数論的関数と平方和 {#nt:page-exercises-arithmetic-functions keywords="exercises, multiplicative functions, Dirichlet convolution, Mobius function, sums of two squares, r_2(n)"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習や、二つ以上のページの道具を組み合わせるものである。難易度は ★（基本）・★★（標準）・★★★（発展）で示す。

## 数論的関数 {#nt:sec-mf-exercises}

対応するページ：\ref{nt:page-multiplicative-functions}

::: problem ★ 基本：$720$ の約数関数 {#nt:ex-mf-720}
$720$ について $\tau$, $\sigma$, $\varphi$, $\mu$ を求めよ。
:::

::: solution
$720=2^{4}\cdot3^{2}\cdot5$。$\tau=5\cdot3\cdot2=30$、$\sigma=31\cdot13\cdot6=2418$、$\varphi=720\cdot\frac12\cdot\frac23\cdot\frac45=192$、平方因子をもつので $\mu=0$。
:::

::: problem ★★ 標準：$\mu^{2}$ の約数和 {#nt:ex-mf-mu-squared}
$\sum_{d\mid n}\mu(d)^{2}=2^{\omega(n)}$（$\omega(n)$ は $n$ の相異なる素因数の個数）を示せ。
:::

::: solution
$\mu^{2}$ は乗法的なので $\mu^{2}\ast\mathbf 1$ も乗法的（\ref{nt:arithmetic-function-ring}）。$p^{e}$（$e\ge1$）では $\mu(1)^{2}+\mu(p)^{2}=2$。積は $2^{\omega(n)}$。
:::

::: problem ★★ 標準：リウヴィルの恒等式 {#nt:ex-mf-liouville-cubes}
$\sum_{d\mid n}\tau(d)^{3}=\Bigl(\sum_{d\mid n}\tau(d)\Bigr)^{2}$ を示せ。
:::

::: solution
両辺とも乗法的関数（左辺は $\tau^{3}\ast\mathbf 1$、右辺は乗法的関数 $\tau\ast\mathbf 1$ の 2 乗）なので、$n=p^{e}$ で確かめればよい。$p^{e}$ の約数 $p^{j}$ で $\tau(p^{j})=j+1$ なので、左辺は $\sum_{k=1}^{e+1}k^{3}$、右辺は $\bigl(\sum_{k=1}^{e+1}k\bigr)^{2}$。両者は $\bigl(\frac{(e+1)(e+2)}{2}\bigr)^{2}$ に等しい（立方和の公式。$e$ についての帰納法で示せる）。
:::

## 平方和 {#nt:sec-sq-exercises}

対応するページ：\ref{nt:page-sums-of-squares}

::: problem ★ 基本：$r_{2}(325)$ {#nt:ex-sq-r2-325}
$r_{2}(325)$ を求め、$325$ の表し方 $a^{2}+b^{2}$（$0\le a\le b$）をすべて挙げよ。
:::

::: solution
$325=5^{2}\cdot13$ なので $r_{2}=4\cdot3\cdot2=24$（\ref{nt:jacobi-two-squares}）。$0\le a\le b$ の表し方は $1^{2}+18^{2}$, $6^{2}+17^{2}$, $10^{2}+15^{2}$ の 3 つで、それぞれ符号と順序で $8$ 通りずつ、計 $24$。
:::

::: problem ★★ 標準：原始的な表し方 {#nt:ex-sq-primitive}
$n=a^{2}+b^{2}$, $\gcd(a,b)=1$ なら、$n$ は $4k+3$ 型の素因数をもたず、$4\nmid n$ であることを示せ。
:::

::: solution
$q\equiv3\pmod4$ の素数 $q\mid n$ なら \ref{nt:two-squares-characterization} の 2 から $q\mid a$, $q\mid b$ で $\gcd(a,b)=1$ に反する。$a,b$ がともに偶数なら $\gcd\ge2$、ともに奇数なら $a^{2}+b^{2}\equiv2\pmod4$、一方だけ奇数なら $n$ は奇数。いずれにしても $4\nmid n$。
:::
