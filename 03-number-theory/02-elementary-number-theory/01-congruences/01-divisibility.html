# 整除と素因数分解 {#nt:page-divisibility keywords="Euclidean algorithm, extended Euclidean algorithm, Lame's theorem, Fibonacci numbers, linear Diophantine equation ax+by=c, least common multiple, fundamental theorem of arithmetic, unique prime factorization, p-adic valuation, gcd and lcm via valuations, infinitely many primes, primes congruent to 3 mod 4, divergence of the sum of reciprocals of primes, Erdos's proof, lower bound for pi(x)"}

整数の世界の基本は、「割り算の余り」と「素数への分解」である。このページでは、最大公約数を求める**ユークリッドの互除法**とその手数の評価（**ラメの定理**）から始めて、1 次不定方程式 $ax+by=c$ の解をすべて求める。次に**素因数分解の一意性**（算術の基本定理）を証明し、各素数 $p$ の指数を取り出す**$p$ 進付値**で最大公約数・最小公倍数を記述する。最後に、素数が無限にあることを、ユークリッドの証明、$4k+3$ 型の素数、そして素数の逆数の和が発散すること（エルデシュの証明）の 3 段階で示す。

## 記法と定義の確認 {#nt:sec-dv-notation}

::: notation
- $\Z$ は整数、$\N=\{0,1,2,\dots\}$。$a\mid b$ は「$b=ac$ となる $c\in\Z$ がある」。
- \ref{grp:division}：$a\in\Z$, $b\ge1$ について $a=qb+r$, $0\le r<b$ となる $q,r$ がただ一つある。$r$ を $a\bmod b$ と書く。
- **最大公約数** $\gcd(a,b)$ は $a\Z+b\Z=\gcd(a,b)\Z$ となる $\gcd(a,b)\ge0$（\ref{grp:gcd}）。**ベズーの等式**と**ユークリッドの補題**（$\gcd(a,b)=1$, $a\mid bm$ なら $a\mid m$）は \ref{grp:bezout-euclid}。これらは素因数分解を使わずに証明されている。
- $1$ より大きい整数 $p$ で、正の約数が $1$ と $p$ だけのものを**素数**という。素数全体を $\mathbb{P}$ と書く。
- 体系は $\ZF$。
:::

## ユークリッドの互除法 {#nt:sec-dv-euclid}

::: theorem ユークリッドの互除法 {#nt:euclidean-algorithm keywords="gcd(a,b) = gcd(b, a mod b); the Euclidean algorithm terminates and computes the gcd; extended Euclidean algorithm gives Bezout coefficients" index="ユークリッドの互除法|ゆーくりっどのごじょほう, 拡張ユークリッド互除法|かくちょうゆーくりっどごじょほう" refname="ユークリッドの互除法"}
1. $a\in\Z$, $b\ge1$ なら $\gcd(a,b)=\gcd(b,a\bmod b)$。
2. $a\ge b\ge1$ とし、$r_{0}\defeq a$, $r_{1}\defeq b$, $r_{k+1}\defeq r_{k-1}\bmod r_{k}$（$r_{k}\neq0$ の間）と定めると、ある $n\ge1$ で $r_{n}\neq0$, $r_{n+1}=0$ となり、$r_{n}=\gcd(a,b)$。
3. $x_{0}=1,y_{0}=0,x_{1}=0,y_{1}=1$、$x_{k+1}=x_{k-1}-q_{k}x_{k}$, $y_{k+1}=y_{k-1}-q_{k}y_{k}$（$q_{k}$ は $r_{k-1}=q_{k}r_{k}+r_{k+1}$ の商）とおくと、すべての $k$ で $r_{k}=ax_{k}+by_{k}$。特に $\gcd(a,b)=ax_{n}+by_{n}$。
:::

::: intuition
大きい方を小さい方で割った余りに置き換えても、公約数の集まりは変わらない。余りは真に小さくなるので、いつか割り切れて止まり、最後の割る数が最大公約数である。途中の各余りを $a$ と $b$ の組合せで記録しておけば、ベズーの等式の係数も同時に求まる。
:::

::: proof
**Step 1（1）.** 【主張：$a\Z+b\Z=b\Z+r\Z$（$r\defeq a\bmod b$）】$a=qb+r$ なので、$r=a-qb\in a\Z+b\Z$ から右辺 $\subseteq$ 左辺、$a=qb+r\in b\Z+r\Z$ から左辺 $\subseteq$ 右辺。両辺の生成元（\ref{grp:gcd}）が等しい。

**Step 2（2）.** $r_{k+1}<r_{k}$ なので、正の整数の真に減少する列は有限で止まり、ある $n$ で $r_{n+1}=0$。1 を繰り返すと $\gcd(a,b)=\gcd(r_{0},r_{1})=\cdots=\gcd(r_{n},r_{n+1})=\gcd(r_{n},0)=r_{n}$（$r_{n}\Z+0\Z=r_{n}\Z$）。

**Step 3（3）.** $k=0,1$ では定義から。$r_{k-1}=ax_{k-1}+by_{k-1}$, $r_{k}=ax_{k}+by_{k}$ なら、$r_{k+1}=r_{k-1}-q_{k}r_{k}=a(x_{k-1}-q_{k}x_{k})+b(y_{k-1}-q_{k}y_{k})=ax_{k+1}+by_{k+1}$。
:::

::: theorem ラメの定理 {#nt:lame-theorem keywords="Lame's theorem: if the Euclidean algorithm on a >= b >= 1 takes n division steps then b >= F_{n+1}; the number of steps is O(log b)" index="ラメの定理|らめのていり" refname="ラメの定理"}
$F_{1}=F_{2}=1$, $F_{k+2}=F_{k+1}+F_{k}$ をフィボナッチ数とする。$a>b\ge1$ について互除法の割り算の回数（2 の $n$）が $n$ なら $b\ge F_{n+1}$。特に $\varphi\defeq\frac{1+\sqrt5}{2}$ について $n\le1+\log_{\varphi}b$。
:::

::: intuition
互除法が最も遅いのは、毎回の商が $1$（最後だけ $2$）になるとき、すなわち隣り合うフィボナッチ数から始めたときである。フィボナッチ数は指数的に増えるので、手数は桁数に比例する程度で済む。
:::

::: proof
**Step 1（最後の 2 項）.** $r_{n}\ge1$。$r_{n-1}=q_{n}r_{n}$（$r_{n+1}=0$）で $r_{n-1}>r_{n}$ なので $q_{n}\ge2$、$r_{n-1}\ge2r_{n}\ge2$。ここで $n\ge1$ と $r_{0}=a>b=r_{1}$ から $r_{n-1}$ は定義されている。

**Step 2（帰納法）.** 【主張：$r_{n-j}\ge F_{j+2}$（$0\le j\le n-1$）】$j=0,1$ は Step 1（$F_{2}=1$, $F_{3}=2$）。$2\le j\le n-1$ では $r_{n-j}=q_{n-j+1}r_{n-j+1}+r_{n-j+2}\ge r_{n-j+1}+r_{n-j+2}\ge F_{j+1}+F_{j}=F_{j+2}$（$q\ge1$）。$j=n-1$ として $b=r_{1}\ge F_{n+1}$。

**Step 3（対数の評価）.** $F_{k}\ge\varphi^{k-2}$（$k\ge1$）：$F_{1}=1\ge\varphi^{-1}$, $F_{2}=1=\varphi^{0}$ で、$\varphi^{2}=\varphi+1$ から $F_{k+2}\ge\varphi^{k-1}+\varphi^{k-2}=\varphi^{k-2}(\varphi+1)=\varphi^{k}$。よって $b\ge\varphi^{n-1}$。
:::

::: theorem 1 次不定方程式 {#nt:linear-diophantine keywords="ax + by = c has an integer solution iff gcd(a,b) divides c; general solution x0 + (b/g)t, y0 - (a/g)t" index="1 次不定方程式|いちじふていほうていしき" refname="1 次不定方程式"}
$a,b\in\Z$, $(a,b)\neq(0,0)$, $g\defeq\gcd(a,b)$, $c\in\Z$ とする。$ax+by=c$ が整数解をもつことと $g\mid c$ は同値。$(x_{0},y_{0})$ を一つの解とすると、解の全体は
$$\Bigl\{\Bigl(x_{0}+\frac{b}{g}t,\ y_{0}-\frac{a}{g}t\Bigr):t\in\Z\Bigr\}.$$
:::

::: intuition
$ax+by$ の形で作れる数は $\gcd(a,b)$ の倍数ちょうどである。一つ解が見つかれば、$a$ 方向に $b/g$ 歩、$b$ 方向に $-a/g$ 歩ずらすことで、すべての解が一直線上に等間隔に並ぶ。
:::

::: proof
**Step 1（存在）.** 左辺は $a\Z+b\Z=g\Z$ の元なので、解があれば $g\mid c$。逆に $c=gm$ なら、ベズーの等式 $g=ax'+by'$ から $(x'm,y'm)$ が解。

**Step 2（一般解）.** 【主張：解の差は $\bigl(\frac{b}{g}t,-\frac{a}{g}t\bigr)$ の形】示された形が解であることは代入で確かめられる。逆に $(x,y)$ が解なら $a(x-x_{0})=-b(y-y_{0})$。$g$ で割って $a'(x-x_{0})=-b'(y-y_{0})$（$a'=a/g$, $b'=b/g$, $\gcd(a',b')=1$、\ref{grp:bezout-euclid} の 3）。$b'=0$ なら $a'=\pm1$ で $x=x_{0}$, $t\defeq\mp(y-y_{0})$ ととればよい。$b'\neq0$ なら、ユークリッドの補題から $b'\mid x-x_{0}$、$x-x_{0}=b't$ とおけば $a'b't=-b'(y-y_{0})$ から $y-y_{0}=-a't$。
:::

## 素因数分解の一意性 {#nt:sec-dv-fta}

::: theorem 算術の基本定理 {#nt:fundamental-theorem-arithmetic keywords="fundamental theorem of arithmetic: every integer n >= 2 is a product of primes, uniquely up to order; Euclid's lemma for primes" index="算術の基本定理|さんじゅつのきほんていり, 素因数分解の一意性|そいんすうぶんかいのいちいせい" refname="算術の基本定理"}
1. 素数 $p$ と $a,b\in\Z$ について、$p\mid ab$ なら $p\mid a$ または $p\mid b$。
2. 2 以上の整数は素数の積で表され、その表し方は積の順序を除いてただ一つである。
:::

::: intuition
素数は掛け算についての「原子」で、どの整数も原子の積にただ一通りに分解される。一意性の鍵は、素数が積を割れば因子のどちらかを割る、という性質（1）である。
:::

::: proof
**Step 1（1）.** $p\nmid a$ なら、$\gcd(p,a)$ は $p$ の正の約数で $p$ ではない（$p\nmid a$）ので $1$。ユークリッドの補題（\ref{grp:bezout-euclid} の 4）から $p\mid b$。

**Step 2（存在）.** 【主張：$n\ge2$ は素数の積】$n$ についての強い帰納法。$n$ が素数ならそれ自身。そうでなければ $n=ab$, $1<a,b<n$ と書け、帰納法の仮定から $a,b$ は素数の積なので $n$ も。

**Step 3（一意性）.** 【主張：$p_{1}\cdots p_{r}=q_{1}\cdots q_{s}$（素数）なら $r=s$ で並べ替えると $p_{i}=q_{i}$】$r$ についての帰納法。$p_{1}\mid q_{1}\cdots q_{s}$ から、1 を繰り返し使って、ある $j$ で $p_{1}\mid q_{j}$。$q_{j}$ は素数で $p_{1}>1$ なので $p_{1}=q_{j}$。両辺を $p_{1}$ で割り、残りに帰納法の仮定を使う（$r=1$ なら右辺の残りの積が $1$ となり $s=1$）。
:::

::: definition $p$ 進付値 {#nt:p-adic-valuation-z keywords="p-adic valuation v_p(n), exponent of p in the prime factorization; v_p(ab) = v_p(a) + v_p(b)" index="p 進付値（整数の）|ぴーしんふち, 素因数の指数|そいんすうのしすう" refname="p 進付値"}
素数 $p$ と $n\in\Z\setminus\{0\}$ について、$p^{k}\mid n$ となる最大の $k\ge0$ を $v_{p}(n)$ と書き、$n$ の **$p$ 進付値**という（$v_{p}(0)\defeq\infty$）。算術の基本定理から $\abs{n}=\prod_{p}p^{v_{p}(n)}$（有限個を除いて $v_{p}(n)=0$）で、$v_{p}(ab)=v_{p}(a)+v_{p}(b)$。
:::

::: intuition
整数を「各素数を何回ずつ含むか」という座標で表したのが $p$ 進付値である。掛け算はこの座標の足し算になり、割り切れることは座標ごとの大小になる。
:::

::: proposition 付値による最大公約数と最小公倍数 {#nt:gcd-lcm-valuations keywords="a | b iff v_p(a) <= v_p(b) for all p; gcd = prod p^min, lcm = prod p^max; gcd(a,b) lcm(a,b) = |ab|" index="最小公倍数|さいしょうこうばいすう" refname="付値による最大公約数と最小公倍数"}
$a,b\in\Z\setminus\{0\}$ とする。
1. $a\mid b$ と、すべての素数 $p$ で $v_{p}(a)\le v_{p}(b)$ であることは同値。
2. $\gcd(a,b)=\prod_{p}p^{\min(v_{p}(a),v_{p}(b))}$。
3. $\operatorname{lcm}(a,b)\defeq\prod_{p}p^{\max(v_{p}(a),v_{p}(b))}$ は $a,b$ の正の公倍数で、すべての公倍数を割り切る。$\gcd(a,b)\operatorname{lcm}(a,b)=\abs{ab}$。
:::

::: intuition
各素数の指数を座標と思うと、割り切れることは座標ごとの大小、最大公約数は座標ごとの小さい方、最小公倍数は大きい方である。小さい方と大きい方を足すと元の 2 つの和になるので、積の式が出る。
:::

::: proof
**Step 1（1）.** $b=ac$ なら $v_{p}(b)=v_{p}(a)+v_{p}(c)\ge v_{p}(a)$。逆に不等式がすべての $p$ で成り立てば、$c\defeq\pm\prod_{p}p^{v_{p}(b)-v_{p}(a)}$（符号は $b/a$ の符号）について $ac=b$（算術の基本定理）。

**Step 2（2, 3）.** $d\defeq\prod p^{\min}$ は 1 から $a,b$ の公約数で、公約数 $c$ は $v_{p}(c)\le\min$ を満たすので $c\mid d$。\ref{grp:bezout-euclid} の 2 から $\gcd(a,b)$ も同じ性質をもつ正の数なので、互いに割り切り合い等しい。$\operatorname{lcm}$ についても同様。$\min(x,y)+\max(x,y)=x+y$ から積の式。
:::

## 素数の無限性 {#nt:sec-dv-primes}

::: theorem 素数は無限にある {#nt:infinitely-many-primes keywords="Euclid: there are infinitely many primes; infinitely many primes congruent to 3 mod 4" index="素数の無限性|そすうのむげんせい, ユークリッドの定理（素数の無限性）|ゆーくりっどのていり" refname="素数は無限にある"}
1. 素数は無限に多くある。
2. $4k+3$ の形の素数も無限に多くある。
:::

::: intuition
有限個の素数をすべて掛けて $1$ を足す（または $4$ 倍して $1$ を引く）と、どの既知の素数でも割り切れない数ができ、その素因数は新しい素数になる。
:::

::: proof
**Step 1（1）.** 素数 $p_{1},\dots,p_{r}$ が与えられたとき、$N\defeq p_{1}\cdots p_{r}+1\ge2$ の素因数 $q$（\ref{nt:fundamental-theorem-arithmetic}）は $p_{i}$ のどれでもない（$p_{i}\mid N$ なら $p_{i}\mid1$）。

**Step 2（2）.** 【主張：$4k+3$ 型の素数 $p_{1},\dots,p_{r}$ に対し、別の $4k+3$ 型の素数がある】$N\defeq4p_{1}\cdots p_{r}-1$ とおく。$N$ は奇数で $N\equiv3\pmod 4$（$4$ で割った余りが $3$）。$N$ の素因数はすべて奇数で、すべてが $4k+1$ 型なら、その積 $N$ も $4k+1$ 型（$(4a+1)(4b+1)=4(4ab+a+b)+1$）で矛盾。よって $4k+3$ 型の素因数 $q$ があり、$q=p_{i}$ なら $p_{i}\mid4p_{1}\cdots p_{r}-N=1$ となり矛盾。
:::

::: theorem 素数の逆数の和は発散する {#nt:reciprocal-primes-diverge keywords="sum of 1/p over primes diverges (Erdos's proof); pi(x) >= log x / (2 log 2)" index="素数の逆数の和|そすうのぎゃくすうのわ" refname="素数の逆数の和は発散する"}
1. $\sum_{p\in\mathbb{P}}\frac{1}{p}=\infty$。
2. 正の整数 $N$ 以下の素数の個数を $\pi(N)$ とすると、$\pi(N)\ge\frac{\log N}{2\log2}$。
:::

::: intuition
どの整数も「平方数」と「同じ素数を 2 度含まない数」の積に分かれる。素数が少ししかなければ、後者の種類は少なく、前者も $\sqrt{N}$ 個しかないので、$N$ 以下の整数を作り尽くせない。素数が「少ない」ことの度合いを逆数の和で測れば、その和は有限ではありえない。
:::

::: proof
**Step 1（平方因子の分離）.** 【主張：$n\ge1$ は $n=m^{2}s$（$s$ は相異なる素数の積、または $1$）と書ける】$v_{p}(n)$ を偶数部分と $0$ か $1$ の部分に分け、$m\defeq\prod p^{\lfloor v_{p}(n)/2\rfloor}$, $s\defeq\prod p^{v_{p}(n)-2\lfloor v_{p}(n)/2\rfloor}$ とおけばよい。
**Step 2（2）.** 【主張：$N\le2^{\pi(N)}\sqrt{N}$】$N$ 以下の正の整数 $n$ を Step 1 の形 $n=m^{2}s$ に書くと、$s$ は $N$ 以下の素数（$\pi(N)$ 個）の部分集合の積なので $2^{\pi(N)}$ 通り以下、$m\le\sqrt{N}$ なので $\lfloor\sqrt{N}\rfloor$ 通り以下。$n\mapsto(s,m)$ は単射（$n=m^{2}s$ で復元できる）なので $N\le2^{\pi(N)}\sqrt{N}$。両辺を $\sqrt{N}$ で割って対数をとると $\frac12\log N\le\pi(N)\log2$。


**Step 3（1）.** 【主張：和が収束すると仮定すると矛盾】素数を小さい順に $p_{1},p_{2},\dots$ とし、収束を仮定して $\sum_{i>k}1/p_{i}<1/2$ となる $k$ をとる。$N\defeq2^{2k+2}$ とし、$N$ 以下の正の整数を、$p_{k}$ より大きい素因数をもつもの（$N_{b}$ 個）ともたないもの（$N_{s}$ 個）に分ける。$p_{i}$ の倍数は $N$ 以下に $\lfloor N/p_{i}\rfloor$ 個なので $N_{b}\le\sum_{i>k}N/p_{i}<N/2$。後者は Step 1 の $s$ が $p_{1},\dots,p_{k}$ の部分集合の積なので $N_{s}\le2^{k}\sqrt{N}=2^{2k+1}=N/2$。$N=N_{b}+N_{s}<N$ となり矛盾。
:::

::: example
1. $\gcd(1071,462)$：$1071=2\cdot462+147$, $462=3\cdot147+21$, $147=7\cdot21+0$ なので $21$。拡張互除法で $x_{k},y_{k}$ を追うと $21=1071\cdot(-3)+462\cdot7$。
2. $1071x+462y=42$ の一般解は $(x,y)=(-6+22t,\ 14-51t)$（$b/g=22$, $a/g=51$）。
3. $360=2^{3}\cdot3^{2}\cdot5$, $84=2^{2}\cdot3\cdot7$ から $\gcd=2^{2}\cdot3=12$, $\operatorname{lcm}=2^{3}\cdot3^{2}\cdot5\cdot7=2520$, $12\cdot2520=360\cdot84$。
:::

::: hypcheck
- **互除法**：$b\ge1$ は除法の原理を使うため。停止性は正の整数の真に減少する列が有限であること（整列性）による。
- **ラメの定理**：$a>b$ は最後から 2 番目の余り $r_{n-1}$ が $r_{n}$ より大きいこと（商 $q_{n}\ge2$）に使った。$a=b$ なら割り算は 1 回で $b\ge F_{2}=1$ が成り立つだけである。
- **算術の基本定理**：一意性の核心は、素数についてのユークリッドの補題（1）で、これは \ref{grp:bezout-euclid}（部分群 $a\Z+b\Z$ の生成元）から来る。素因数分解の一意性を使わずに証明されているので、循環はない。
- **素数の逆数の和**：背理法で収束を仮定し、尾の和を $1/2$ 未満にした。$N=2^{2k+2}$ の選び方は、$2^{k}\sqrt{N}=N/2$ となるように決めた。
:::

## 問題 {#nt:sec-dv-problems}

::: problem {#nt:prob-dv-fib-gcd}
連続するフィボナッチ数 $F_{n+2},F_{n+1}$（$n\ge1$）に互除法を使うと、割り算がちょうど $n$ 回で、$\gcd=1$ であることを示し、\ref{nt:lame-theorem} の評価が等号で達成されることを確かめよ。
:::

::: solution
$n=1$：$F_{3}=2=2\cdot F_{2}+0$ で 1 回、$\gcd=1$。$n\ge2$：$F_{n+2}=1\cdot F_{n+1}+F_{n}$ で $0<F_{n}<F_{n+1}$（$n\ge2$ では $F_{n}<F_{n+1}$）なので、1 回の割り算で組 $(F_{n+1},F_{n})$ に移る。帰納法から割り算は $1+(n-1)=n$ 回で、$\gcd(F_{n+2},F_{n+1})=\gcd(F_{3},F_{2})=1$。このとき $b=F_{n+1}$ で、ラメの定理の $b\ge F_{n+1}$ が等号になる。
:::

::: problem {#nt:prob-dv-sqrt2}
算術の基本定理を使って、$\sqrt2$ が有理数でないことを示せ。
:::

::: solution
$\sqrt2=a/b$（$a,b\ge1$）なら $a^{2}=2b^{2}$。$v_{2}(a^{2})=2v_{2}(a)$ は偶数、$v_{2}(2b^{2})=1+2v_{2}(b)$ は奇数で、$p$ 進付値の一意性（算術の基本定理）に反する。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 互除法とベズーの等式は、除法の原理（ユークリッド環であること）だけを使い、素因数分解を使わない。算術の基本定理はその帰結である。

**前提を変えると.**
- 同じ議論は**ユークリッド環**（体上の 1 変数多項式環、ガウスの整数環 $\Z[i]$ など）で成り立ち、さらに単項イデアル整域は一意分解環である（\ref{ring:pid-ufd}）。
- 一意性は一般の整数環では成り立たない。例えば $\Z[\sqrt{-5}]$ では $6=2\cdot3=(1+\sqrt{-5})(1-\sqrt{-5})$ で、イデアルの分解の一意性に置き換わる（\ref{nt:page-prime-decomposition}）。
- 素数の逆数の和の発散は、$\sum_{p\le x}1/p=\log\log x+O(1)$（メルテンスの定理）に精密化され、さらに $\pi(x)\sim x/\log x$（素数定理）が成り立つ、と知られている。後者は解析的整数論の分野で扱う予定である。
- $4k+3$ 型の素数の無限性はユークリッドの方法で示せたが、$4k+1$ 型や一般の算術級数 $ak+b$（$\gcd(a,b)=1$）の素数の無限性（ディリクレの算術級数定理）には $L$ 関数が必要になる、と一般に説明されている（$4k+1$ 型は平方剰余を使えば初等的に示せる。演習を参照）。

**高い視点から：$\Z$ の座標としての素数.** 算術の基本定理は、正の有理数の乗法群が素数で添字づけた自由アーベル群であること、すなわち $\mathbb{Q}_{>0}^{\times}\cong\bigoplus_{p\in\mathbb{P}}\Z$（$x\mapsto(v_{p}(x))_{p}$）と言い換えられる。整除は座標ごとの順序、最大公約数と最小公倍数は座標ごとの最小と最大で、整数の約数の束は鎖 $\N$ の直積の部分束になる。環論の視点では、素数は $\Z$ の極大イデアル $p\Z$ に対応し、$v_{p}$ は局所化 $\Z_{(p)}$ の離散付値である。比喩で言えば、整数は素数を「元素」とする化合物で、$p$ 進付値はその組成式であり、掛け算は化学反応で組成を足し合わせることに当たる。
:::
