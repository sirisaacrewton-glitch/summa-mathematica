## 整除と素因数分解 {#nt:sec-dv-exercises}

対応するページ：\ref{nt:page-divisibility}

::: problem ★ 基本：拡張互除法 {#nt:ex-dv-extended-euclid}
$\gcd(252,198)$ を互除法で求め、$252x+198y=\gcd(252,198)$ となる整数 $x,y$ を一組求めよ。
:::

::: solution
$252=1\cdot198+54$, $198=3\cdot54+36$, $54=1\cdot36+18$, $36=2\cdot18$ なので $\gcd=18$。逆にたどると $18=54-36=54-(198-3\cdot54)=4\cdot54-198=4(252-198)-198=4\cdot252-5\cdot198$。$(x,y)=(4,-5)$。
:::

::: problem ★★ 標準：$4k+1$ 型の素数 {#nt:ex-dv-primes-1-mod-4}
$4k+1$ の形の素数が無限に多くあることを、\ref{nt:euler-criterion} を使って示せ。
:::

::: solution
$4k+1$ 型の素数 $p_{1},\dots,p_{r}$ に対し $N\defeq(2p_{1}\cdots p_{r})^{2}+1$ とおき、その素因数 $q$ をとる。$N$ は奇数なので $q$ は奇数で、$x\defeq2p_{1}\cdots p_{r}$ について $x^{2}\equiv-1\pmod q$。$q\nmid x$（$q\mid x$ なら $q\mid1$）なので、$-1$ は $q$ を法とする平方剰余で、\ref{nt:euler-criterion} の 3 から $(-1)^{(q-1)/2}=1$、すなわち $q\equiv1\pmod 4$。$q=p_{i}$ なら $q\mid N-x^{2}=1$ となり矛盾。よって新しい $4k+1$ 型の素数がある。
:::

::: problem ★★ 標準：$2^{m}-1$ の最大公約数 {#nt:ex-dv-mersenne-gcd}
$m,n\ge1$ について $\gcd(2^{m}-1,2^{n}-1)=2^{\gcd(m,n)}-1$ を示せ。
:::

::: solution
$m=qn+r$（$0\le r<n$）とすると $2^{m}-1=2^{r}(2^{qn}-1)+(2^{r}-1)$ で、$2^{n}-1\mid2^{qn}-1$（$x^{q}-1=(x-1)(x^{q-1}+\cdots+1)$ に $x=2^{n}$）。$0\le2^{r}-1<2^{n}-1$ なので $(2^{m}-1)\bmod(2^{n}-1)=2^{r}-1$。\ref{nt:euclidean-algorithm} の 1 から $\gcd(2^{m}-1,2^{n}-1)=\gcd(2^{n}-1,2^{m\bmod n}-1)$ で、指数の側では $(m,n)\mapsto(n,m\bmod n)$ と互除法が進む。指数の互除法が $\gcd(m,n)$ と $0$ に着くとき、$\gcd(2^{\gcd(m,n)}-1,2^{0}-1)=\gcd(2^{\gcd(m,n)}-1,0)=2^{\gcd(m,n)}-1$。
:::
