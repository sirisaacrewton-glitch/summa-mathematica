## 原始根と既約剰余類群の構造 {#nt:sec-pr-exercises}

対応するページ：\ref{nt:page-primitive-roots}

::: problem ★ 基本：$17$ を法とする原始根 {#nt:ex-pr-17}
$\ord_{17}(2)=8$ を確かめ、$3$ が $17$ を法とする原始根であることを示せ。
:::

::: solution
$2^{4}=16\equiv-1$, $2^{8}\equiv1$ なので位数は $8$（$16$ の約数で、$2^{4}\not\equiv1$）。$3$ の位数は $16$ の約数で、$3^{8}\equiv1$ でなければ $16$。$3^{2}=9$, $3^{4}=81\equiv13\equiv-4$, $3^{8}\equiv16\equiv-1$ なので位数 $16=\varphi(17)$。
:::

::: problem ★★★ 発展：コルセルトの判定法 {#nt:ex-pr-korselt}
合成数 $n$ が「$\gcd(a,n)=1$ なるすべての $a$ で $a^{n-1}\equiv1\pmod n$」（カーマイケル数）を満たすことと、$n$ が平方因子をもたず、$n$ の各素因数 $p$ について $p-1\mid n-1$ であることは同値であることを示せ。
:::

::: solution
$\Leftarrow$：$p\mid n$ ごとに $a^{n-1}=(a^{p-1})^{(n-1)/(p-1)}\equiv1\pmod p$（フェルマーの小定理）で、$n$ は相異なる素数の積なので中国剰余定理から $a^{n-1}\equiv1\pmod n$。

$\Rightarrow$：$p\mid n$ とし、$g$ を $p$ を法とする原始根とする。中国剰余定理で $a\equiv g\pmod p$、$a\equiv1\pmod{n/p^{v_{p}(n)}}$ となる $a$ をとると $\gcd(a,n)=1$ で、$a^{n-1}\equiv1\pmod p$ から $\ord_{p}(g)=p-1\mid n-1$。次に $p^{2}\mid n$ と仮定する。$p$ が奇素数なら $p^{2}$ を法とする原始根 $h$（\ref{nt:structure-units-mod-pk}、位数 $p(p-1)$）を同様に $a$ に持ち上げると $p(p-1)\mid n-1$、特に $p\mid n-1$ だが $p\mid n$ なので $p\mid1$ となり矛盾。$p=2$ なら $n$ は偶数で、$a=-1$ について $(-1)^{n-1}=-1\equiv1\pmod n$ から $n\mid2$ となり、合成数に反する。よって $n$ は平方因子をもたない。
:::

## 平方剰余 {#nt:sec-qr-exercises}

対応するページ：\ref{nt:page-quadratic-residues}

::: problem ★ 基本：$(\tfrac{-3}{p})$ {#nt:ex-qr-minus-3}
素数 $p>3$ について $(\tfrac{-3}{p})=1\iff p\equiv1\pmod3$ を示せ。
:::

::: solution
$(\tfrac{-3}{p})=(\tfrac{-1}{p})(\tfrac{3}{p})=(-1)^{\frac{p-1}{2}}\cdot(-1)^{\frac{p-1}{2}}(\tfrac{p}{3})=(\tfrac{p}{3})$（相互法則 \ref{nt:quadratic-reciprocity-elementary}）。$(\tfrac{p}{3})=1\iff p\equiv1\pmod3$。
:::

::: problem ★★ 標準：ヤコビ記号による計算 {#nt:ex-qr-713-1009}
$1009$ は素数である。$713=23\cdot31$ を素因数分解せずに、ヤコビ記号の相互法則だけで $(\tfrac{713}{1009})$ を求めよ。
:::

::: solution
$1009\equiv1\pmod4$ なので $(\tfrac{713}{1009})=(\tfrac{1009}{713})=(\tfrac{296}{713})=(\tfrac{8}{713})(\tfrac{37}{713})$。$713\equiv1\pmod8$ なので $(\tfrac{2}{713})=1$。$37\equiv1\pmod4$ なので $(\tfrac{37}{713})=(\tfrac{713}{37})=(\tfrac{10}{37})=(\tfrac{2}{37})(\tfrac{5}{37})$。$37\equiv5\pmod8$ から $(\tfrac{2}{37})=-1$、$(\tfrac{5}{37})=(\tfrac{37}{5})=(\tfrac{2}{5})=-1$。よって $(\tfrac{713}{1009})=1$ で、$1009$ が素数なので $713$ は平方剰余である（$713^{504}\equiv1\pmod{1009}$ とも一致する）。
:::

## ガウス和とヤコビ和 {#nt:sec-gj-exercises}

対応するページ：\ref{nt:page-gauss-jacobi-sums}

::: problem ★★ 標準：$x^{2}-y^{2}=1$ {#nt:ex-gj-hyperbola}
$\mathbb{F}_{p}$ で $x^{2}-y^{2}=1$ の解が $p-1$ 個であることを、(a) $(x-y)(x+y)=1$ と因数分解する方法、(b) ヤコビ和を使う方法の両方で示せ。
:::

::: solution
(a) $u=x-y$, $v=x+y$ は $(x,y)$ と一対一（$p$ は奇数なので $x=\frac{u+v}{2}$, $y=\frac{v-u}{2}$）で、$uv=1$ の解は $u\neq0$ ごとに 1 つ、計 $p-1$ 個。(b) $x^{2}=a$, $-y^{2}=b$（$y^{2}=-b$ の解の数は $1+\rho(-b)$）とすると $N=\sum_{a+b=1}(1+\rho(a))(1+\rho(-b))=p+0+0+\rho(-1)J(\rho,\rho)=p+\rho(-1)(-\rho(-1))=p-1$（\ref{nt:jacobi-gauss}）。
:::

::: problem ★★ 標準：位数 3 の指標 {#nt:ex-gj-order-3}
$p\equiv1\pmod3$ とし、$\chi$ を位数 3 の指標とする。$J(\chi,\chi)=a+b\omega$（$\omega=e^{2\pi i/3}$, $a,b\in\Z$）と書けることを示し、$p=a^{2}-ab+b^{2}$ を導け。$p=7$ で確かめよ。
:::

::: solution
$\chi$ の値は $0,1,\omega,\omega^{2}=-1-\omega$ なので $J\in\Z+\Z\omega$。$\chi^{2}$ は位数 3 で自明でないので \ref{nt:jacobi-gauss} の 2 から $\abs{J}^{2}=p$。$\abs{a+b\omega}^{2}=(a+b\omega)(a+b\bar\omega)=a^{2}+ab(\omega+\bar\omega)+b^{2}=a^{2}-ab+b^{2}$。$p=7$：$7=3^{2}-3\cdot1+1^{2}$（$a=3,b=1$）など。
:::
