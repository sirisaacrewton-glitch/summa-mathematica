# 原始根と既約剰余類群の構造 {#nt:page-primitive-roots keywords="order of an integer modulo m, primitive root, existence of primitive roots modulo a prime, (1+p)^{p^{k-1}} = 1 + p^k mod p^{k+1}, structure of (Z/p^k Z)^x, structure of (Z/2^k Z)^x = {+-1} x <5>, moduli with primitive roots 1, 2, 4, p^k, 2p^k, index (discrete logarithm), n-th power residues, Euler's criterion for n-th powers"}

$m$ を法とする既約剰余類の群 $(\Z/m\Z)^{\times}$ がどんな群かを決めるのがこのページの目標である。素数 $p$ を法とするときは巡回群で、その生成元を**原始根**という。これを奇素数の冪 $p^{k}$ に持ち上げ、$2^{k}$ の場合は $\{\pm1\}\times\langle5\rangle$ という形を求め、中国剰余定理と合わせて、原始根が存在する法は $1,2,4,p^{k},2p^{k}$ に限ることを示す。最後に、原始根による「離散対数」（指数）を使って、$x^{n}\equiv a$ の可解性を判定する。

## 記法と定義の確認 {#nt:sec-pr-notation}

::: notation
- 合同式、$(\Z/m\Z)^{\times}$、オイラー関数 $\varphi$ と $\sum_{d\mid n}\varphi(d)=n$、多項式合同式のラグランジュの定理は \ref{nt:page-congruences} のとおり。
- 群の元の位数 $\ord(a)$ と、$a^{k}=e\iff\ord(a)\mid k$（\ref{grp:order-divides}）、$\ord(a^{k})=\ord(a)/\gcd(\ord(a),k)$（\ref{grp:order-of-power}）、巡回群の部分群（\ref{grp:subgroups-cyclic}）、内部直積（\ref{grp:internal-direct-product}）を使う。
- 体系は $\ZF$。
:::

::: definition 位数と原始根 {#nt:primitive-root keywords="order of a modulo m, ord_m(a); primitive root modulo m: a generator of (Z/mZ)^x" index="原始根|げんしこん, 位数（法 m での）|いすう" refname="原始根"}
$\gcd(a,m)=1$ のとき、$a^{k}\equiv1\pmod m$ となる最小の $k\ge1$（$(\Z/m\Z)^{\times}$ での $\bar a$ の位数）を $\ord_{m}(a)$ と書く。$\ord_{m}(g)=\varphi(m)$ となる $g$、すなわち $(\Z/m\Z)^{\times}$ を生成する $g$ を $m$ を法とする**原始根**という。
:::

::: intuition
原始根 $g$ があれば、$m$ と互いに素な余りはすべて $g$ の冪 $g^{0},g^{1},\dots,g^{\varphi(m)-1}$ としてちょうど一度ずつ現れる。掛け算が指数の足し算に変わるので、対数のように計算できる。
:::

## 素数を法とする原始根 {#nt:sec-pr-prime}

::: theorem 素数を法とする原始根の存在 {#nt:primitive-root-prime keywords="for a prime p, (Z/pZ)^x is cyclic of order p-1; there are exactly phi(d) elements of order d for each d | p-1, in particular phi(p-1) primitive roots" index="原始根の存在（素数）|げんしこんのそんざい" refname="素数を法とする原始根の存在"}
$p$ を素数とする。$p-1$ の各正の約数 $d$ について、$p$ を法として位数 $d$ の元はちょうど $\varphi(d)$ 個ある。特に原始根は $\varphi(p-1)$ 個あり、$(\Z/p\Z)^{\times}$ は巡回群である。
:::

::: intuition
位数 $d$ の元が一つでもあれば、その冪が $x^{d}=1$ の根を $d$ 個すべて与え、そのうち位数がちょうど $d$ のものは $\varphi(d)$ 個。つまり各 $d$ について「$0$ 個か $\varphi(d)$ 個」で、合計が $p-1=\sum_{d}\varphi(d)$ になるためには、すべて $\varphi(d)$ 個でなければならない。
:::

::: proof
**Step 1（$0$ か $\varphi(d)$）.** 【主張：位数 $d$ の元の個数 $\psi(d)$ は $0$ か $\varphi(d)$】位数 $d$ の元 $a$ があるとする。$a^{0},\dots,a^{d-1}$ は相異なり（\ref{grp:order-divides}）、どれも $x^{d}\equiv1$ の解。\ref{nt:lagrange-polynomial-congruence} の 1 から解は $d$ 個以下なので、解はこれで尽きる。位数 $d$ の元は解なので $a^{k}$ の形で、$\ord(a^{k})=d/\gcd(d,k)$（\ref{grp:order-of-power}）が $d$ になるのは $\gcd(d,k)=1$ のとき、すなわち $\varphi(d)$ 個。

**Step 2（数え上げ）.** $(\Z/p\Z)^{\times}$ の各元の位数は $p-1$ の約数（ラグランジュの定理）なので $\sum_{d\mid p-1}\psi(d)=p-1=\sum_{d\mid p-1}\varphi(d)$（\ref{nt:euler-phi-formula} の 3）。Step 1 から各項 $\psi(d)\le\varphi(d)$ なので、すべて等号。$d=p-1$ として原始根は $\varphi(p-1)\ge1$ 個。
:::

## 素数冪を法とする構造 {#nt:sec-pr-prime-power}

::: lemma $1+p$ の冪 {#nt:one-plus-p-power keywords="for odd p and k >= 1, (1+p)^{p^{k-1}} = 1 + p^k mod p^{k+1}; for k >= 0, 5^{2^k} = 1 + 2^{k+2} mod 2^{k+3}" index="1+p の位数|いちぷらすぴーのいすう"}
1. $p$ を奇素数とすると、$k\ge1$ について $(1+p)^{p^{k-1}}\equiv1+p^{k}\pmod{p^{k+1}}$。したがって $k\ge2$ なら $\ord_{p^{k}}(1+p)=p^{k-1}$。
2. $j\ge0$ について $5^{2^{j}}\equiv1+2^{j+2}\pmod{2^{j+3}}$。したがって $k\ge3$ なら $\ord_{2^{k}}(5)=2^{k-2}$。
:::

::: proof
**Step 1（1 の合同式）.** $k$ についての帰納法。$k=1$ は等式。$(1+p)^{p^{k-1}}=1+p^{k}u$（$u\equiv1\pmod p$）とすると
$$(1+p^{k}u)^{p}=1+p^{k+1}u+\binom{p}{2}p^{2k}u^{2}+\sum_{j\ge3}\binom{p}{j}p^{jk}u^{j}.$$
$p$ は奇数なので $p\mid\binom{p}{2}=\frac{p(p-1)}{2}$ で、第 3 項は $p^{2k+1}$ で割れ、$2k+1\ge k+2$。$j\ge3$ の項は $p^{3k}$ で割れ、$3k\ge k+2$。よって $\equiv1+p^{k+1}u\equiv1+p^{k+1}\pmod{p^{k+2}}$。

**Step 2（1 の位数）.** Step 1 から $(1+p)^{p^{k-1}}\equiv1\pmod{p^{k}}$ なので位数は $p^{k-1}$ の約数 $p^{i}$。$(1+p)^{p^{k-2}}\equiv1+p^{k-1}\not\equiv1\pmod{p^{k}}$ なので $i=k-1$。

**Step 3（2）.** $j=0$：$5=1+4$。$5^{2^{j}}=1+2^{j+2}u$（$u$ 奇数）なら $5^{2^{j+1}}=1+2^{j+3}u+2^{2j+4}u^{2}\equiv1+2^{j+3}\pmod{2^{j+4}}$（$2j+4\ge j+4$, $u\equiv1\pmod2$）。位数は Step 2 と同様に、$5^{2^{k-2}}\equiv1$, $5^{2^{k-3}}\equiv1+2^{k-1}\not\equiv1\pmod{2^{k}}$ から $2^{k-2}$。
:::

::: theorem 既約剰余類群の構造 {#nt:structure-units-mod-pk keywords="(Z/p^k Z)^x is cyclic for odd p; (Z/2Z)^x and (Z/4Z)^x are cyclic; (Z/2^k Z)^x = <-1> x <5> is not cyclic for k >= 3" index="既約剰余類群の構造|きやくじょうよるいぐんのこうぞう" refname="既約剰余類群の構造"}
1. 奇素数 $p$ と $k\ge1$ について、$(\Z/p^{k}\Z)^{\times}$ は位数 $p^{k-1}(p-1)$ の巡回群である。
2. $(\Z/2\Z)^{\times}$, $(\Z/4\Z)^{\times}$ は巡回群。$k\ge3$ なら $(\Z/2^{k}\Z)^{\times}=\langle-1\rangle\times\langle5\rangle\cong\Z/2\times\Z/2^{k-2}$ で、巡回群でない。
:::

::: intuition
奇素数冪では、「$p$ を法とする原始根」が位数 $p-1$ の部分を、$1+p$ が位数 $p^{k-1}$ の部分を受け持ち、位数が互いに素なので積が全体を生成する。$2$ の冪では $1+2$ の代わりに $1+4=5$ を使うが、$-1$ が $5$ の冪から外れて独立な因子として残る。
:::

::: proof
**Step 1（互いに素な位数の積）.** 【主張：可換群で $\ord(x)=r$, $\ord(y)=s$, $\gcd(r,s)=1$ なら $\ord(xy)=rs$】$(xy)^{rs}=e$。$(xy)^{n}=e$ なら $x^{n}=y^{-n}\in\langle x\rangle\cap\langle y\rangle$ で、この部分群の位数は $r$ と $s$ の公約数（ラグランジュの定理）なので $1$。よって $x^{n}=y^{n}=e$、$r\mid n$, $s\mid n$ から $rs\mid n$。

**Step 2（1）.** $k=1$ は \ref{nt:primitive-root-prime}。$k\ge2$ とし、$g$ を $p$ を法とする原始根とする。$\ord_{p^{k}}(g)=:N$ について、$g^{N}\equiv1\pmod{p^{k}}$ から $\pmod p$ でも $1$ なので $p-1\mid N$。$N=(p-1)t$ とおくと $x\defeq g^{t}$ の位数は $p-1$（\ref{grp:order-of-power}）。$y\defeq1+p$ の位数は $p^{k-1}$（\ref{nt:one-plus-p-power}）。Step 1 から $xy$ の位数は $(p-1)p^{k-1}=\varphi(p^{k})$ で、群全体を生成する。

**Step 3（2）.** $(\Z/2\Z)^{\times}=\{1\}$, $(\Z/4\Z)^{\times}=\{1,3\}$ は巡回群。$k\ge3$ では、$\langle5\rangle$ の位数は $2^{k-2}$ で、その元はすべて $\equiv1\pmod4$ なので $-1\equiv3\pmod4$ を含まない。$\langle-1\rangle\cap\langle5\rangle=\{1\}$、群は可換、$\abs{\langle-1\rangle}\abs{\langle5\rangle}=2^{k-1}=\varphi(2^{k})$ なので、\ref{grp:internal-direct-product} から内部直積。$-1$ と $5^{2^{k-3}}$ は相異なる位数 2 の元で、巡回群には位数 2 の元は高々 1 つ（\ref{grp:subgroups-cyclic} の 2）なので巡回群でない。
:::

::: theorem 原始根をもつ法 {#nt:moduli-with-primitive-roots keywords="Gauss: a primitive root modulo m exists iff m = 1, 2, 4, p^k or 2p^k with p an odd prime" index="原始根をもつ法|げんしこんをもつほう" refname="原始根をもつ法"}
$m\ge1$ を法とする原始根が存在することと、$m$ が $1,2,4,p^{k},2p^{k}$（$p$ は奇素数、$k\ge1$）のいずれかであることは同値。
:::

::: intuition
既約剰余類群が巡回群になるのは、「$-1$ 以外に位数 2 の元がない」ときに限られる。法が 2 つ以上の「3 以上の互いに素な部分」に分かれると、それぞれの部分で $-1$ がとれて位数 2 の元が 2 つ以上でき、巡回群でなくなる。
:::

::: proof
**Step 1（存在）.** $1,2,4,p^{k}$ は \ref{nt:structure-units-mod-pk}。$2p^{k}$ では中国剰余定理から $(\Z/2p^{k}\Z)^{\times}\cong(\Z/2\Z)^{\times}\times(\Z/p^{k}\Z)^{\times}\cong(\Z/p^{k}\Z)^{\times}$ で巡回群。

**Step 2（非存在）.** 【主張：それ以外の $m$ では巡回群でない】巡回群の部分群は巡回群で、位数 2 の元は高々 1 つ（\ref{grp:subgroups-cyclic}）。(a) $2^{k}\mid m$（$k\ge3$）なら、中国剰余定理で $(\Z/m\Z)^{\times}$ は $(\Z/2^{k}\Z)^{\times}$ と同型な部分群を含み、それは巡回群でない。(b) そうでなく、$m$ が上の形でないなら、$m=m_{1}m_{2}$, $\gcd(m_{1},m_{2})=1$, $m_{1},m_{2}\ge3$ と書ける（相異なる奇素数を 2 つ含むか、$4$ と奇素数冪の積）。$m_{i}\ge3$ なら $-1\not\equiv1\pmod{m_{i}}$ なので $(\Z/m_{i}\Z)^{\times}$ は位数 2 の元 $-1$ をもつ。すると $(\Z/m\Z)^{\times}\cong(\Z/m_{1}\Z)^{\times}\times(\Z/m_{2}\Z)^{\times}$ は位数 2 の元 $(-1,1)$, $(1,-1)$ を 2 つもち、巡回群でない。
:::

## 指数と冪剰余 {#nt:sec-pr-index}

::: definition 指数 {#nt:index-discrete-log keywords="index (discrete logarithm) ind_g(a) with respect to a primitive root g; ind(ab) = ind(a) + ind(b) mod phi(m)" index="指数（原始根に関する）|しすう, 離散対数|りさんたいすう" refname="指数（離散対数）"}
$g$ を $m$ を法とする原始根とする。$\gcd(a,m)=1$ について、$g^{i}\equiv a\pmod m$ となる $i\in\{0,\dots,\varphi(m)-1\}$ はただ一つで、これを $a$ の（$g$ に関する）**指数** $\operatorname{ind}_{g}a$ という。$\operatorname{ind}_{g}(ab)\equiv\operatorname{ind}_{g}a+\operatorname{ind}_{g}b\pmod{\varphi(m)}$。
:::

::: intuition
指数は合同式の世界の対数で、掛け算を $\varphi(m)$ を法とする足し算に変える。冪剰余の問題は、指数の世界では 1 次合同式になる。
:::

::: theorem 冪剰余の判定 {#nt:power-residue-criterion keywords="if m has a primitive root and gcd(a,m) = 1, then x^n = a mod m is solvable iff a^{phi(m)/d} = 1 mod m where d = gcd(n, phi(m)); then there are exactly d solutions" index="冪剰余|べきじょうよ, n 乗剰余|えぬじょうじょうよ" refname="冪剰余の判定"}
$m$ を原始根をもつ法、$\gcd(a,m)=1$, $n\ge1$, $d\defeq\gcd(n,\varphi(m))$ とする。$x^{n}\equiv a\pmod m$ が解をもつ（$a$ が **$n$ 乗剰余**である）ことと $a^{\varphi(m)/d}\equiv1\pmod m$ は同値で、このとき解はちょうど $d$ 個。$n$ 乗剰余は $\varphi(m)/d$ 個ある。
:::

::: intuition
原始根で指数をとると、$x^{n}=a$ は $\varphi(m)$ を法とする 1 次合同式 $ny=b$ になる。解けるのは $b$ が $\gcd(n,\varphi(m))$ の倍数のときで、それを $a$ の言葉で言い直したのが判定式である。
:::

::: proof
**Step 1（指数への翻訳）.** 【主張：$x^{n}\equiv a$ は $ny\equiv b\pmod{\varphi(m)}$ と同値】原始根 $g$ をとり、$x=g^{y}$, $a=g^{b}$（$b=\operatorname{ind}_{g}a$）とおくと、$x^{n}\equiv a$ は $ny\equiv b\pmod{\varphi(m)}$ と同値（\ref{grp:order-divides}）。解 $x$（$\gcd(x,m)=1$ が必要）と解 $y\bmod\varphi(m)$ は一対一。

**Step 2（可解性と解の個数）.** 【主張：可解 $\iff d\mid b$ で解は $d$ 個】\ref{nt:linear-congruence} から、可解 $\iff d\mid b$ で、解は $d$ 個。

**Step 3（判定式）.** 【主張：$d\mid b\iff a^{\varphi(m)/d}\equiv1$】$a^{\varphi(m)/d}=g^{b\varphi(m)/d}\equiv1\iff\varphi(m)\mid b\varphi(m)/d\iff d\mid b$。$n$ 乗剰余の指数は $d$ の倍数 $b\in\{0,\dots,\varphi(m)-1\}$ で、$\varphi(m)/d$ 個。
:::

::: example
1. $p=7$：$3^{1},\dots,3^{6}\equiv3,2,6,4,5,1$ なので $3$ は原始根。$\varphi(6)=2$ 個の原始根は $3$ と $5$。
2. $p=13$ の原始根 $2$：$2^{6}=64\equiv-1$, $2^{4}=16\equiv3\not\equiv1$ なので位数は $12$。
3. $n=2$, $m=p$ 奇素数なら $d=2$ で、判定式は $a^{(p-1)/2}\equiv1$：オイラーの規準（\ref{nt:euler-criterion}）。
4. $x^{3}\equiv2\pmod{7}$：$d=\gcd(3,6)=3$, $2^{2}=4\not\equiv1$ なので解なし。$x^{3}\equiv6\equiv-1$：$(-1)^{2}=1$ なので解は 3 個（$3,5,6$）。
:::

::: hypcheck
- **素数を法とする原始根**：$\Z/p\Z$ が体であること（ラグランジュの定理、根の個数が次数以下）が本質。合成数の法では $x^{d}\equiv1$ の解が $d$ 個を超えうるので、議論は崩れる（$\bmod 8$）。
- **$1+p$ の冪**：$p$ が奇数であることは $p\mid\binom{p}{2}$ に使った。$p=2$ では $3^{2}=9\equiv1\pmod 8$ となって成り立たず、代わりに $5=1+2^{2}$ を使った。
- **原始根をもつ法**：(b) の分解で $m_{1},m_{2}\ge3$ が必要（$m_{i}=2$ なら $-1\equiv1$）。
- **冪剰余の判定**：原始根の存在が必要。$m=8$, $n=2$ では $a=1$ に対し $x^{2}\equiv1$ の解は 4 個で、$d=\gcd(2,4)=2$ と合わない。
:::

## 問題 {#nt:sec-pr-problems}

::: problem {#nt:prob-pr-primitive-11}
$11$ を法とする原始根をすべて求めよ。
:::

::: solution
$\varphi(10)=4$ 個ある。$2$ の位数は $10$ の約数で、$2^{2}=4$, $2^{5}=32\equiv-1$ なので $1,2,5$ ではなく $10$。原始根は $2^{k}$（$\gcd(k,10)=1$）、すなわち $2^{1},2^{3},2^{7},2^{9}\equiv2,8,7,6$。
:::

::: problem {#nt:prob-pr-not-cyclic-15}
$(\Z/15\Z)^{\times}$ が巡回群でないことを、位数 2 の元を 2 つ見つけて確かめよ。
:::

::: solution
$4^{2}=16\equiv1$, $11^{2}=121\equiv1$, $14^{2}\equiv1\pmod{15}$ で、$4,11,14$ はどれも $\not\equiv1$。位数 2 の元が 3 個あるので巡回群でない（\ref{nt:moduli-with-primitive-roots} の (b)：$15=3\cdot5$）。
:::

::: supplement
**使わなかった前提・本質的でない前提.** 素数を法とする原始根の存在は、体 $K$ の乗法群の有限部分群は巡回群である（\ref{fld:finite-multiplicative-cyclic}）という一般の事実の特別な場合で、証明もほぼ同じである。ここでは $\sum_{d\mid n}\varphi(d)=n$ による数え上げで示した。

**前提を変えると.**
- 原始根の存在は構成的でなく、最小の原始根を求める効率的な公式は知られていない、と一般に言われている。どの整数（$\pm1$ と平方数を除く）が無限に多くの素数の原始根になるかという**アルティンの予想**は、一般化されたリーマン予想の仮定の下で証明されている（Hooley、1967）が、無条件では未解決である、と知られている。
- 指数（離散対数）を求める問題は計算が難しいと考えられており、ディフィー–ヘルマン鍵共有などの暗号の安全性の根拠になっている（\ref{comp:page-approx-crypto}）。
- 有限アーベル群の基本定理（\ref{grp:page-finite-abelian}）の言葉では、$(\Z/m\Z)^{\times}$ は中国剰余定理で素数冪ごとの因子に分かれ、奇素数冪の因子は巡回群、2 の冪の因子は高々 2 つの巡回群の直積である。

**高い視点から：乗法群と加法群.** 原始根は、乗法群 $(\Z/p\Z)^{\times}$ と加法群 $\Z/(p-1)\Z$ の同型（指数写像）を与える。ただしこの同型は原始根の選び方に依存し、標準的なものはない。これは、有限体 $\mathbb{F}_{p}$ の乗法群が巡回群であることは「抽象的に」は決まるが、具体的な生成元を選ぶ自然な方法がない、という現象の例である。$p$ 進数の世界では、$(\Z/p^{k}\Z)^{\times}$ の構造は $\Z_{p}^{\times}\cong\mu_{p-1}\times(1+p\Z_{p})$ の有限段階での影で、$1+p$ の冪の計算は $p$ 進対数・指数関数の始まりである。比喩で言えば、原始根は「余りの世界の時計の針」で、どの余りも針を何回進めたかで指定できるが、針をどこに置くかは選び方次第である。
:::
