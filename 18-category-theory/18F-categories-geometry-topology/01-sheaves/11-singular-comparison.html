# 軟層と特異コホモロジー {#cat:page-singular-comparison keywords="sections over closed sets, soft sheaf, soft sheaves are acyclic on paracompact spaces, sheaf of continuous functions is soft, fine sheaves, sheaf of singular cochains, locally zero cochains, comparison of sheaf cohomology and singular cohomology"}

パラコンパクト空間では、閉集合上の切断が全体に延びる**軟層**も非輪状である。連続関数の層とその上の加群の層は軟なので、1 の分割を使う解析的な分解（ド・ラーム分解など）でコホモロジーが計算できる。さらに、特異コチェインを層化した**特異コチェインの層**が定数層の脆弱分解になることを示し、良い空間（開集合がすべてパラコンパクトで局所可縮、たとえば多様体）では層コホモロジー $H^{q}(X,\underline{A})$ が特異コホモロジー $H^{q}_{\mathrm{sing}}(X;A)$ と一致することを証明する。特異コホモロジーの二つの基本定理（ホモトピー不変性と小さい単体の定理）は、本サイトでは証明していないので、出典を示して引用する。

> 特異コホモロジーについての二つの事実 (H)・(S) を使う。これらは代数的位相幾何の系列で証明した（\ref{at:cohomology-sheaf-facts}）。

## 記法と定義の確認 {#cat:sec-sgc-notation}

::: notation
- 層・エタール空間・層化・逆像（とその切断がエタール空間の引き戻しの切断であること）は \ref{cat:etale-space}, \ref{cat:sheafification}, \ref{cat:inverse-image-etale}。\term[部分空間]{top:subspace} $K\subset X$ への包含 $i$ について $F|_{K}\defeq i^{-1}F$。
- 脆弱層・脆弱層は非輪状・非輪状分解による計算は \ref{cat:flasque}, \ref{cat:flasque-acyclic}, \ref{cat:acyclic-resolution}。完全性は茎で判定（\ref{cat:ab-sheaves-abelian}）。
- パラコンパクト（ハウスドルフを含む）、正規性、縮小補題、局所有限な閉集合族の和、貼り合わせ補題、ウリゾーンの補題は \ref{top:paracompact}, \ref{top:paracompact-normal}, \tref{top:shrinking-lemma}, \ref{top:locally-finite-closure}, \ref{top:pasting-lemma}, \ref{top:urysohn-lemma}。第二可算な局所コンパクトハウスドルフ空間はパラコンパクト（\ref{top:second-countable-lch-paracompact}）。
- **選択公理**：閉集合上の切断の延長、軟層の補題、特異コチェインの層の切断の持ち上げで、近傍と代表元の選択、縮小補題、整列可能定理を使う。各所に（AC）と書く。
:::

## 閉集合上の切断 {#cat:sec-sgc-closed}

::: definition 閉集合上の切断 {#cat:sections-closed-set keywords="sections over a subset as continuous sections of the etale space" index="閉集合上の切断|へいしゅうごうじょうのせつだん"}
層 $F$ と部分集合 $K\subset X$ について、$\Gamma(K,F)\defeq\Gamma(K,F|_{K})$ とおく。\ref{cat:inverse-image-etale} により、これはエタール空間 $p:\operatorname{Et}(F)\to X$ の $K$ 上の連続な切断 $s:K\to\operatorname{Et}(F)$（$ps=\mathrm{id}_{K}$）の全体と同じ。開集合 $U\supset K$ と $t\in F(U)$ について、$\hat t|_{K}$ を $t$ の $K$ への制限と呼ぶ。$K$ が開なら $\Gamma(K,F)=F(K)$（\ref{cat:sheafification-properties.3}）。
:::

::: lemma 閉集合上の切断の延長 {#cat:closed-section-extension keywords="on a paracompact space, a section over a closed set extends to an open neighbourhood" index="閉集合上の切断の延長|へいしゅうごうじょうのせつだんのえんちょう"}
（AC）$X$ をパラコンパクト、$K\subset X$ を閉集合とする。$s\in\Gamma(K,F)$ は、ある開集合 $U\supset K$ 上の切断 $t\in F(U)$ の制限である。
:::

::: proof
**Step 1（局所的な代表）.** $x\in K$ について、$s(x)$ はある $t\in F(W)$ の芽で、$s$ の連続性から基本開集合 $[W,t]$ の逆像は $K$ での $x$ の近傍なので、$W$ を小さくして $s=\hat t$（$W\cap K$ 上）とできる。各 $x$ にこのような $(W_{x},t_{x})$ を一つ選ぶ（AC）。

**Step 2（局所有限化と縮小）.** 開被覆 $\{W_{x}\}_{x\in K}\cup\{X\setminus K\}$ の局所有限な開細分 $\{V_{\lambda}\}$ をとり、$V_{\lambda}\cap K\neq\emptyset$ となる $\lambda$ 全体を $\Lambda_{K}$ とする。$\lambda\in\Lambda_{K}$ について $V_{\lambda}\subset W_{x(\lambda)}$ となる $x(\lambda)$ を選び（AC）、$t_{\lambda}\defeq t_{x(\lambda)}|_{V_{\lambda}}$ とおくと、$V_{\lambda}\cap K$ 上 $\hat t_{\lambda}=s$。縮小補題（局所有限なら点有限。\tref{top:shrinking-lemma}）で $\overline{V'_{\lambda}}\subset V_{\lambda}$ となる開被覆 $\{V'_{\lambda}\}$ をとる。

**Step 3（近傍 $U$ の定義）.** 開集合 $N$ が**良い**とは、ある $y\in K\cap N$ について (a) $N$ は $y\notin\overline{V'_{\mu}}$ となる $\overline{V'_{\mu}}$ と交わらず、(b) $y\in\overline{V'_{\lambda}}$ となる（有限個の）$\lambda$ について $N\subset V_{\lambda}$ で、それらの $t_{\lambda}$ が $N$ 上ですべて一致することをいう。$y\in K$ について、局所有限性から $y$ の近傍で有限個の $\overline{V'_{\mu}}$ としか交わらないものがあり、そこから $y$ を含まない有限個の閉集合を除き、$y\in\overline{V'_{\lambda}}$ となる $\lambda$（$\subset\Lambda_{K}$。$\overline{V'_{\lambda}}\subset V_{\lambda}$ が $K$ と交わる）について $t_{\lambda}$ の $y$ での芽はすべて $s(y)$ なので、さらに小さくして一致させると、良い近傍が得られる。$U\defeq\bigcup\{N : N\text{ は良い}\}$ は $K$ を含む開集合。

**Step 4（貼り合わせ）.** $z\in U\cap V'_{\lambda}\cap V'_{\mu}$ とし、$z\in N$（良い、点 $y$ について）とする。$N$ は $\overline{V'_{\lambda}}$, $\overline{V'_{\mu}}$ と交わるので (a) から $y\in\overline{V'_{\lambda}}\cap\overline{V'_{\mu}}$、(b) から $t_{\lambda}=t_{\mu}$（$N$ 上）。よって $\{t_{\lambda}|_{U\cap V'_{\lambda}}\}$ は芽が一致するので両立し（\ref{cat:germs-determine-sections}。$U\cap V'_{\lambda}\neq\emptyset$ なら同じ理由で $\lambda\in\Lambda_{K}$）、$U$ 上の $t$ に貼り合わさる。$y\in K$ では $y\in V'_{\lambda}$ となる $\lambda$ について $t$ の芽は $t_{\lambda}$ の芽 $=s(y)$。
:::

## 軟層 {#cat:sec-sgc-soft}

::: definition 軟層 {#cat:soft-sheaf keywords="soft sheaf: sections over closed sets extend globally" index="軟層|なんそう"}
層 $F$ が**軟**であるとは、すべての閉集合 $K$ について制限 $F(X)\to\Gamma(K,F)$ が全射であることをいう。
:::

::: proposition 軟層の例 {#cat:soft-examples keywords="flasque implies soft on paracompact spaces; the sheaf of continuous functions and its modules are soft" index="細層|さいそう"}
（AC）$X$ をパラコンパクトとする。
1. 脆弱層は軟。
2. 実数値連続関数の層 $\mathcal{C}_{X}$ は軟。より一般に、$\mathcal{C}_{X}$ 加群の層（各 $F(U)$ が $\mathcal{C}(U)$ 加群で、制限が両立するもの）は軟。
:::

::: proof
**Step 1（1）.** $s\in\Gamma(K,F)$ は開集合 $U\supset K$ 上の $t$ の制限（\ref{cat:closed-section-extension}）で、脆弱性から $t$ は $X$ 上の切断の制限。

**Step 2（2）.** $s\in\Gamma(K,F)$ を開集合 $U\supset K$ 上の $t$ の制限とする。$X$ は正規（\ref{top:paracompact-normal}）なので、正規性を 2 回使って開集合 $U'',U'$ で $K\subset U''\subset\overline{U''}\subset U'\subset\overline{U'}\subset U$ となるものがとれ、ウリゾーンの補題から連続関数 $\varphi:X\to[0,1]$ で $\overline{U''}$ 上 $1$、$X\setminus U'$ 上 $0$ となるものがある。$\varphi|_{U}\cdot t\in F(U)$ と $0\in F(X\setminus\overline{U'})$ は共通部分 $U\setminus\overline{U'}$ 上で一致する（そこで $\varphi=0$）ので、$X=U\cup(X\setminus\overline{U'})$ 上の切断 $\tilde t$ に貼り合わさる。$U''$ 上 $\varphi=1$ なので $\tilde t|_{U''}=t|_{U''}$ で、$K$ への制限は $s$。
:::

::: lemma 軟層の基本補題 {#cat:soft-surjective keywords="on paracompact spaces, if F' is soft in 0->F'->F->F''->0 then F(X)->F''(X) is surjective; quotient of soft by soft is soft; soft sheaves are acyclic" index="軟層の基本補題|なんそうのきほんほだい"}
（AC）$X$ をパラコンパクト、$0\to F'\to F\xrightarrow{\psi}F''\to0$ を短完全列とする。
1. $F'$ が軟なら $F(X)\to F''(X)$ は全射。
2. $F'$, $F$ が軟なら $F''$ も軟。
3. 軟層 $F$ について $q\ge1$ で $H^{q}(X,F)=0$。
:::

::: proof
**Step 1（1：閉被覆）.** $s''\in F''(X)$ を局所的に持ち上げ、局所有限な開被覆 $\{V_{\lambda}\}$ と $t_{\lambda}\in F(V_{\lambda})$, $\psi(t_{\lambda})=s''|_{V_{\lambda}}$ を選ぶ（AC）。縮小して $K_{\lambda}\defeq\overline{V'_{\lambda}}\subset V_{\lambda}$ とし、$J\subset\Lambda$ について $K_{J}\defeq\bigcup_{\lambda\in J}K_{\lambda}$（閉集合、\ref{top:locally-finite-closure}）とおく。

**Step 2（1：ツォルンの補題）.** 組 $(J,t)$（$t\in\Gamma(K_{J},F)$, $\psi(t)=s''|_{K_{J}}$）に延長の順序を入れる。鎖 $(J_{\alpha},t_{\alpha})$ について $J=\bigcup J_{\alpha}$ とし、$z\in K_{J}$ に $z\in K_{J_{\alpha}}$ となる $\alpha$ で $t(z)\defeq t_{\alpha}(z)$ とおく（鎖なので一意）。$z$ の近傍 $N$ で有限個の $K_{\lambda}$ としか交わらないものをとると、そのうち $J$ に入る有限個はある $J_{\alpha}$ に入るので $N\cap K_{J}=N\cap K_{J_{\alpha}}$ で $t=t_{\alpha}$。よって $t$ は連続で上界。ツォルンの補題から極大元 $(J,t)$ がある（$(\emptyset,\text{空写像})$ があるので空でない）。

**Step 3（1：極大元は全体）.** $\lambda\notin J$ とする。$A\defeq K_{J}\cap K_{\lambda}$ 上 $\psi(t-t_{\lambda})=0$ なので、$t-t_{\lambda}|_{A}\in\Gamma(A,F')$（$\Gamma(A,-)=\Gamma(A,i^{-1}-)$ は左完全：$i^{-1}$ は完全、$\Gamma$ は左完全）。$F'$ は軟なので $r\in F'(X)$ でその延長となるものがある。$t$ と $(t_{\lambda}+r)|_{K_{\lambda}}$ は $A$ 上一致し、二つの閉集合の貼り合わせ（\ref{top:pasting-lemma.2}）で $K_{J\cup\{\lambda\}}$ 上の切断になる。極大性に反するので $J=\Lambda$、$K_{\Lambda}=X$。

**Step 4（2）.** 閉集合 $K$ はパラコンパクト（$K$ の開被覆 $\{O_{i}\cap K\}$ に $X\setminus K$ を加えた $X$ の開被覆の局所有限な細分を $K$ に制限する）。$F'|_{K}$ は軟（$K$ の閉集合は $X$ の閉集合で、$F'(X)\to\Gamma(L,F')$ は $\Gamma(K,F')$ を経由する）。$K$ 上の短完全列 $0\to F'|_{K}\to F|_{K}\to F''|_{K}\to0$（$i^{-1}$ は完全）に 1 を使うと $\Gamma(K,F)\to\Gamma(K,F'')$ は全射。$F(X)\to\Gamma(K,F)$ も全射なので $F(X)\to\Gamma(K,F'')$ は全射で、これは $F''(X)$ を経由する。

**Step 5（3）.** 入射層は脆弱（\ref{cat:flasque-acyclic.1}）なので軟（\ref{cat:soft-examples.1}）。あとは \ref{cat:flasque-acyclic} の Step 2・3 と同じ次元ずらしを、1・2 を使って行う。
:::

::: remark 細層とド・ラームの定理
1 の分割（\ref{top:partition-of-unity-existence}）を層の自己準同型に持ち上げられる層を**細層**といい、細層は軟である（$\mathcal{C}_{X}$ 加群の層はその典型）。$X$ が滑らかな多様体なら、微分形式の層 $\Omega^{p}$ は $\mathcal{C}^{\infty}$ 加群で軟なので、ポアンカレの補題（$0\to\underline{\mathbb{R}}\to\Omega^{0}\to\Omega^{1}\to\cdots$ が完全）と \ref{cat:acyclic-resolution} から $H^{q}(X,\underline{\mathbb{R}})\cong H^{q}_{\mathrm{dR}}(X)$（ド・ラームの定理の層による証明）。ポアンカレの補題と $\mathcal{C}^{\infty}$ 版の \ref{cat:soft-examples} は本サイト未収録。
:::

## 特異コチェインの層 {#cat:sec-sgc-singular}

::: definition 特異コチェイン {#cat:singular-cochains keywords="singular simplices, singular cochains, singular cohomology, presheaf of singular cochains, small simplices" index="特異コチェイン|とくいこちぇいん, 特異コホモロジー|とくいこほもろじー"}
$\Delta^{q}\defeq\{(t_{0},\dots,t_{q})\in\mathbb{R}^{q+1} : t_{i}\ge0,\ \sum t_{i}=1\}$ とし、連続写像 $\tau:\Delta^{q}\to U$ を $U$ の**特異 $q$ 単体**、それらを基底とする自由アーベル群を $S_{q}(U)$、境界を $\partial\tau\defeq\sum_{k}(-1)^{k}\tau\circ\delta_{k}$（$\delta_{k}$ は $k$ 番目の面への埋め込み）とする。アーベル群 $A$ について $S^{q}(U)\defeq\operatorname{Hom}(S_{q}(U),A)$、$dc\defeq c\circ\partial$ とし、$H^{q}_{\mathrm{sing}}(U;A)\defeq H^{q}(S^{\bullet}(U))$ を**特異コホモロジー**という。$V\subset U$ について $S^{q}(U)\to S^{q}(V)$ は $V$ に入る単体への制限で、$S^{q}$ は前層。開被覆 $\mathcal{V}$ について、像がある $V\in\mathcal{V}$ に入る単体を **$\mathcal{V}$ 小**といい、それだけで作った $S^{\bullet}_{\mathcal{V}}(U)$ を考える。
:::

::: remark 引用する二つの事実（\ref{at:cohomology-sheaf-facts} で証明）
- **(H) ホモトピー不変性**：可縮な空間 $U$（恒等写像が定値写像にホモトピック）について、$H^{0}_{\mathrm{sing}}(U;A)=A$（定数のコチェイン）、$q\ge1$ で $H^{q}_{\mathrm{sing}}(U;A)=0$。
- **(S) 小さい単体の定理**：開被覆 $\mathcal{V}$ について、制限 $S^{\bullet}(U)\to S^{\bullet}_{\mathcal{V}}(U)$ はコホモロジーの同型を誘導する（重心細分による。\ref{at:small-simplices} と普遍係数定理から）。

いずれも特異ホモロジーの標準的な教科書（たとえば A. Hatcher, *Algebraic Topology*, §2.1 と命題 2.21、そのコホモロジー版 §3.1）に証明がある。
:::

::: lemma 特異コチェインの層 {#cat:singular-sheaf keywords="sheafified singular cochains: surjectivity from cochains, locally zero cochains, flasqueness, resolution of the constant sheaf" index="特異コチェインの層|とくいこちぇいんのそう"}
$\mathcal{S}^{q}\defeq(S^{q})^{+}$（層化）とする。
1. （AC）$X$ がパラコンパクトなら、$S^{q}(X)\to\Gamma(X,\mathcal{S}^{q})$ は全射で、核は**局所的に 0 な**コチェイン $S^{q}_{0}(X)\defeq\{c : \text{ある開被覆 }\mathcal{V}\text{ で }c\text{ は }\mathcal{V}\text{ 小な単体の上で }0\}$。
2. $S^{\bullet}_{0}(X)$ は部分複体で、(S) のもとで非輪状。
3. （AC）$X$ の開集合がすべてパラコンパクトなら、$\mathcal{S}^{q}$ は脆弱。
4. $X$ が**局所可縮**（各点の任意の近傍が可縮な開近傍を含む）なら、(H) のもとで $0\to\underline{A}\to\mathcal{S}^{0}\to\mathcal{S}^{1}\to\cdots$ は完全。ここで $\underline{A}\to\mathcal{S}^{0}$ は局所定数関数 $a$ を「0 単体（点）$\tau$ に $a(\tau)$ を与えるコチェイン」に写す射。
:::

::: proof
**Step 1（1：核）.** $c\in S^{q}(U)$ の像が $0$ $\iff$ 各点の芽が $0$ $\iff$ 各点 $x$ の近傍 $N_{x}$ で $c|_{N_{x}}=0$（前層の茎の定義）$\iff$ $c$ は被覆 $\{N_{x}\}$ について小な単体の上で $0$。

**Step 2（1：全射）.** $\sigma\in\Gamma(X,\mathcal{S}^{q})$ をとる。\ref{cat:closed-section-extension} の Step 1・2 と同様に、局所有限な開被覆 $\{V_{\lambda}\}$, $c_{\lambda}\in S^{q}(V_{\lambda})$（$V_{\lambda}$ 上 $\hat c_{\lambda}=\sigma$）、縮小 $\overline{V'_{\lambda}}\subset V_{\lambda}$ を選び（AC）、$\Lambda$ を整列する（AC）。単体 $\tau$ について、像が $V'_{\lambda}$ に入る最小の $\lambda$ で $c(\tau)\defeq c_{\lambda}(\tau)$、そのような $\lambda$ がなければ $c(\tau)\defeq0$ とする。$y\in X$ をとり、$y\in V'_{\lambda_{0}}$ とする。$y$ の近傍 $N$ を、有限個の $\overline{V'_{\mu}}$ としか交わらず、$y\notin\overline{V'_{\mu}}$ となるものとは交わらず、$N\subset V'_{\lambda_{0}}$、かつ $y\in\overline{V'_{\mu}}$ となる（有限個の）$\mu$ について $N\subset V_{\mu}$ で $c_{\mu}|_{N}=c_{\lambda_{0}}|_{N}$（芽が $\sigma(y)$ で等しいので、前層の茎の定義から十分小さい近傍で一致）となるようにとる。$N$ に入る単体 $\tau$ について、最小の $\lambda$ は $V'_{\lambda}\cap N\neq\emptyset$ をみたすので $y\in\overline{V'_{\lambda}}$ で、$c(\tau)=c_{\lambda}(\tau)=c_{\lambda_{0}}(\tau)$（$\lambda_{0}$ が候補にあるので最小の $\lambda$ は存在）。よって $c|_{N}=c_{\lambda_{0}}|_{N}$ で、$y$ での芽は $\sigma(y)$。$\hat c=\sigma$。

**Step 3（2）.** 単体の面は単体と同じ集合に入るので、$\mathcal{V}$ 小な単体の上で $0$ なコチェインの $d$ も同じ。$K_{\mathcal{V}}\defeq\ker(S^{\bullet}(X)\to S^{\bullet}_{\mathcal{V}}(X))$ とすると、$S^{\bullet}\to S^{\bullet}_{\mathcal{V}}$ は全射（小でない単体に $0$ を与えて延ばす）なので $0\to K_{\mathcal{V}}\to S^{\bullet}\to S^{\bullet}_{\mathcal{V}}\to0$ は短完全列で、(S) と長完全列から $K_{\mathcal{V}}$ は非輪状。$S^{\bullet}_{0}=\bigcup_{\mathcal{V}}K_{\mathcal{V}}$ は有向な和（二つの被覆の共通細分 $\{V\cap V'\}$）で、コサイクル $c\in S^{q}_{0}$ はある $K_{\mathcal{V}}$ に入り、そこでコバウンダリなので、$S^{\bullet}_{0}$ も非輪状。

**Step 4（3）.** 開集合 $U$ について、$S^{q}(X)\to S^{q}(U)$ は全射（$U$ に入らない単体に $0$ を与える）、$S^{q}(U)\to\Gamma(U,\mathcal{S}^{q})$ は 1（$U$ はパラコンパクト）から全射で、これらは制限と可換。よって $\Gamma(X,\mathcal{S}^{q})\to\Gamma(U,\mathcal{S}^{q})$ は全射。

**Step 5（4）.** 層化は茎を保つので、$x$ での茎の複体は $\operatorname*{colim}_{U\ni x}S^{\bullet}(U)$。フィルター付き余極限はコホモロジーと交換する（コサイクル・コバウンダリはある $U$ で表され、等式はより小さい $U$ で成り立つ）ので、そのコホモロジーは $\operatorname*{colim}_{U\ni x}H^{q}_{\mathrm{sing}}(U;A)$。局所可縮性から可縮な $U$ だけで余極限をとってよく（共終）、(H) から $q\ge1$ で $0$、$q=0$ で $A$（定数）。茎 $\underline{A}_{x}=A$ はこの $H^{0}$ に同型に写るので、茎の複体 $0\to A\to\mathcal{S}^{0}_{x}\to\cdots$ は完全。
:::

::: theorem 層コホモロジーと特異コホモロジー {#cat:sheaf-singular-comparison keywords="for Hausdorff locally contractible spaces whose open subsets are paracompact, sheaf cohomology of the constant sheaf equals singular cohomology" index="層コホモロジーと特異コホモロジーの比較|そうこほもろじーととくいこほもろじーのひかく"}
（AC）$X$ を、開集合がすべてパラコンパクトで、局所可縮な空間とする（たとえば第二可算なハウスドルフ位相多様体）。アーベル群 $A$ について
$$
H^{q}(X,\underline{A})\cong H^{q}_{\mathrm{sing}}(X;A)\qquad(q\ge0).
$$
:::

::: proof
**Step 1（脆弱分解）.** \ref{cat:singular-sheaf.3}・\ref[4]{cat:singular-sheaf.4} から $0\to\underline{A}\to\mathcal{S}^{\bullet}$ は脆弱分解。\ref{cat:acyclic-resolution.1} と \ref{cat:flasque-acyclic} から $H^{q}(X,\underline{A})\cong H^{q}(\Gamma(X,\mathcal{S}^{\bullet}))$。

**Step 2（大域切断とコチェイン）.** \ref{cat:singular-sheaf.1} から、複体の短完全列 $0\to S^{\bullet}_{0}(X)\to S^{\bullet}(X)\to\Gamma(X,\mathcal{S}^{\bullet})\to0$ がある（$d$ との可換性は層化の自然性から）。長完全列（\ref{ha:long-exact-sequence}）と $S^{\bullet}_{0}(X)$ の非輪状性（同 2）から $H^{q}_{\mathrm{sing}}(X;A)\cong H^{q}(\Gamma(X,\mathcal{S}^{\bullet}))$。

**Step 3（例）.** 第二可算なハウスドルフ位相多様体 $X$ の開集合は第二可算な局所コンパクトハウスドルフ空間なのでパラコンパクト（\ref{top:second-countable-lch-paracompact}、DC）。各点は $\mathbb{R}^{n}$ の開球と同相な近傍の基本系をもち、開球は凸なので可縮。
:::

::: corollary
仮定のもとで、可縮な $X$（たとえば $\mathbb{R}^{n}$ や開区間）について $q\ge1$ で $H^{q}(X,\underline{A})=0$。とくに \ref{cat:page-flasque-cech} の円周の例で使った「開弧の上での非輪状性」が成り立ち、$H^{1}(S^{1},\underline{\mathbb{Z}})\cong\mathbb{Z}$。
:::

::: hypcheck
- **選択公理**：\ref{cat:closed-section-extension}（各点の代表、細分の添字の対応、縮小補題）、\ref{cat:soft-surjective}（局所的な持ち上げの選択、ツォルンの補題）、\ref{cat:singular-sheaf.1}（代表の選択、縮小、添字集合の整列）、多様体のパラコンパクト性（DC）、層コホモロジーの定義で使う。
- **パラコンパクト性**：\ref{cat:closed-section-extension}（局所有限な細分）、\ref{cat:soft-examples.2}（正規性）、\ref{cat:singular-sheaf.1}（局所有限性が単体ごとの添字の選び方を局所的に有限個に抑える）。$\mathcal{S}^{q}$ の脆弱性には開集合のパラコンパクト性が要る（3）。
- **局所可縮性**：\ref{cat:singular-sheaf.4}（茎の複体の完全性）だけで使う。たとえばハワイの耳飾り（円周の可算個の一点和で半径が $0$ に近づくもの）は局所可縮でなく、特異コホモロジーと層コホモロジーが異なることが知られている（本サイト未収録）。
- **引用した事実**：(H) は 4 で、(S) は 2 で使った。どちらも \ref{at:cohomology-sheaf-facts} で証明した（(H) はプリズム作用素、(S) は小さい単体の定理のコチェイン版）。
:::

::: supplement
**チェックコホモロジーとの関係.** 同じ仮定のもとで、良い被覆（すべての有限個の交わりが可縮か空）をもつ空間（たとえばコンパクトな滑らかな多様体）では、\ref{cat:leray-theorem}と上の系から、層コホモロジー・特異コホモロジー・良い被覆のチェックコホモロジーの三つが一致する。後者は被覆の神経（有限単体複体）の単体的コホモロジーで、有限の計算である。

**前提を変えると.** 局所可縮性は「各近傍 $U$ が、包含 $V\to U$ が正の次数の特異コホモロジーに $0$ を誘導する近傍 $V$ を含む」（コホモロジー的局所連結性）に弱められることが知られている（本サイト未収録）。
:::

## 高い視点 {#cat:sec-sgc-viewpoint}

::: remark 二つの見方の出会い
特異コホモロジーは「空間に単体を写し込んで数える」大域的・組合せ的な理論、層コホモロジーは「局所的なデータの貼り合わせの障害」を測る理論である。比較定理の証明は、特異コチェインを局所化（層化）すると局所的な情報（茎）は可縮な近傍のコホモロジー＝自明になり、大域的な情報だけが残ることを示す。比喩で言えば、地図帳（層）の各ページが平らな紙（可縮）なら、地図帳全体の「ねじれ」は空間そのものの形（特異コホモロジー）と同じものを測る。導来圏の言葉では、$\underline{A}\to\mathcal{S}^{\bullet}$ が擬同型であり、$R\Gamma(X,\underline{A})$ を二つの方法で表していることになる。
:::

## 問題 {#cat:sec-sgc-problems}

::: problem {#cat:prob-sc-soft-not-flasque}
$X=\mathbb{R}$ 上の連続関数の層 $\mathcal{C}_{X}$ は軟だが脆弱でないことを示せ。
:::

::: solution
軟であることは \ref{cat:soft-examples.2}（$\mathbb{R}$ は距離空間なのでパラコンパクト、あるいは第二可算な局所コンパクトハウスドルフ空間）。脆弱でないこと：$U=(0,\infty)$ 上の $f(x)=1/x$ は、$\mathbb{R}$ 上の連続関数の制限でない（$x\to0^{+}$ で発散する）。よって $\mathcal{C}(\mathbb{R})\to\mathcal{C}(U)$ は全射でない。軟層は閉集合上の切断だけを延ばせばよく、閉集合上では「端で発散する」ことが起こらない（切断は閉集合の近傍上の関数の芽なので、閉集合の各点で有界な近傍をもつ）。
:::
