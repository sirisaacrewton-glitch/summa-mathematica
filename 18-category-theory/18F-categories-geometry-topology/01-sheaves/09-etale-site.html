# エタール位相 {#cat:page-etale-site keywords="small etale site of a field, sheaves on finite continuous G-sets, continuous G-sets, classifying topos BG, etale sheaves are Galois sets, Galois cohomology as etale cohomology of a field, Zariski covering, standard etale algebra, etale topology of a ring"}

体 $K$ の有限エタール代数（\ref{fld:etale-algebra}）を「$\operatorname{Spec}K$ 上の被覆空間」とみなし、射の族が「全射的」であるときに被覆とすると、サイト（**小エタールサイト**）が得られる。グロタンディークのガロア理論（\ref{fld:grothendieck-galois}）によりこのサイトは有限な連続 $G$ 集合の圏（$G=\operatorname{Gal}(\Omega/K)$）と同値で、その上の層の圏は**連続な $G$ 集合の圏**と同値になる。大域切断は $G$ 不変元をとる操作に対応し、エタールコホモロジーはガロアコホモロジーになる。最後に、環のザリスキ被覆と、エタール位相の定義を述べる。

> 小さいサイトを選ぶ方法（集合 $\mathcal{P}(G)\times\mathbb{N}$ の部分集合に限る）は、選択公理を避けるための工夫である。

## 記法と定義の確認 {#cat:sec-et-notation}

::: notation
- $\Omega/K$ はガロア拡大（有限次でも無限次でもよい）、$G=\operatorname{Gal}(\Omega/K)$ にクルル位相（\ref{fld:krull-topology}）を入れる。有限ガロア部分拡大 $N$ について $G_{N}\defeq\operatorname{Gal}(\Omega/N)$ は開正規部分群で、制限 $G\to\operatorname{Gal}(N/K)$ は全射、核は $G_{N}$（\ref{fld:finite-galois-exhaustion.3}）。とくに $G/G_{N}$ は有限。$G_{N_{1}}\cap G_{N_{2}}=G_{N_{1}N_{2}}$ で、$\Omega$ は有限ガロア部分拡大の和（同 1）。クルル位相の定義から、部分群 $U$ が開 $\iff$ ある $N$ で $G_{N}\subset U$。
- エタール代数、$L$ で分解するエタール代数、圏 $\mathbf{Et}_{L/K}$、関手 $F(A)=\Hom_{K}(A,L)$, $\Phi(X)=\operatorname{Map}_{G}(X,L)$、有限版のグロタンディークのガロア理論は \ref{fld:etale-algebra}, \ref{fld:split-etale}, \ref{fld:fiber-functor}, \ref{fld:field-transitive-gset}, \ref{fld:grothendieck-galois}。
- サイト・層・被覆ふるいは \ref{cat:grothendieck-topology}, \ref{cat:site-sheaf}, \ref{cat:covering-sieve-basic}。
- **選択公理**：使わない（$\Omega=K^{\mathrm{sep}}$ をとるときだけ、分離閉包の存在に選択公理を使う）。
:::

## 連続な $G$ 集合と層 {#cat:sec-et-gsets}

::: definition 連続な $G$ 集合とそのサイト {#cat:continuous-gsets keywords="continuous G-set (open stabilizers), classifying topos BG, site of finite continuous G-sets with jointly surjective coverings" index="連続な G 集合|れんぞくなじーしゅうごう, 分類トポス|ぶんるいとぽす"}
1. $G$ が作用する集合 $Y$ で、各点の安定化群が開なものを**連続な $G$ 集合**といい、その圏（射は $G$ 写像）を $\mathbf{B}G$ と書く。
2. $\mathbf{C}_{G}$ を、有限な連続 $G$ 集合で台集合が $\mathcal{P}(G)\times\mathbb{N}$ の部分集合であるもののなす充満部分圏とする（小さい圏）。開部分群 $U$ について $G/U\times\{0\}$（$gU$ たちの集合）は $\mathbf{C}_{G}$ に入り、これを単に $G/U$ と書く。
3. $X\in\mathbf{C}_{G}$ 上のふるい $S$ が**被覆**であるとは、$\bigcup_{f\in S}f(\operatorname{dom}f)=X$ となることをいう。この $J$ を**全射位相**という。
:::

::: lemma 軌道と全射位相 {#cat:orbit-maps keywords="orbits of continuous G-sets are G/U; jointly surjective coverings form a Grothendieck topology" index="軌道写像|きどうしゃぞう"}
1. 連続な $G$ 集合 $Y$ の点 $y$ について、$U\defeq\operatorname{Stab}(y)$ は開で指数有限、$a_{y}:G/U\to Y$, $gU\mapsto gy$ は $G/U$ から軌道 $Gy$ への同型。$y$ を固定する開正規部分群 $G_{N}$ について、$a_{y,N}:G/G_{N}\to Y$, $gG_{N}\mapsto gy$ も $G$ 写像。
2. $X,X'\in\mathbf{C}_{G}$ の点 $z\in V$, $z'\in V'$ と $f:V\to X$, $f':V'\to X$ が $f(z)=f'(z')$ をみたせば、$W\in\mathbf{C}_{G}$, $w\in W$ と $p:W\to V$, $p':W\to V'$ で $fp=f'p'$, $p(w)=z$, $p'(w)=z'$ となるものがある。
3. 全射位相はグロタンディーク位相。
:::

::: proof
**Step 1（1）.** $U$ は開で、ある $G_{N}\subset U$ をとると $[G:U]\le[G:G_{N}]<\infty$。$a_{y}$ は well-defined な全単射の $G$ 写像（$gU=hU\iff h^{-1}g\in U\iff gy=hy$）。$G_{N}\subset U$ なら $a_{y,N}=a_{y}\circ(G/G_{N}\to G/U)$。

**Step 2（2）.** $(z,z')\in V\times_{X}V'$ の安定化群 $\operatorname{Stab}z\cap\operatorname{Stab}z'$ を $U$ とし、$W\defeq G/U$, $w\defeq U$, $p(gU)\defeq gz$, $p'(gU)\defeq gz'$。$fp(gU)=gf(z)=gf'(z')=f'p'(gU)$。

**Step 3（3）.** 最大：恒等写像。安定：$S$ が被覆で $g:X'\to X$ のとき、$x'\in X'$ について $g(x')=f(z)$ となる $f\in S$, $z$ があり、2（$V'=X'$, $f'=g$）から $p'(w)=x'$ で $gp'=fp\in S$、すなわち $p'\in g^{*}S$。推移：$x\in X$ を $f(z)$（$f\in S$）と書き、$f^{*}R$ が被覆なので $z=h(w)$（$h\in f^{*}R$）、$fh\in R$ で $x=fh(w)$。
:::

::: theorem 連続な $G$ 集合と層 {#cat:sheaves-continuous-gsets keywords="sheaves on finite continuous G-sets with the jointly surjective topology are equivalent to continuous G-sets" index="連続な G 集合と層の同値|れんぞくなじーしゅうごうとそうのどうち"}
$\Psi(Y)\defeq\mathbf{B}G(-,Y)|_{\mathbf{C}_{G}}$ は圏同値 $\Psi:\mathbf{B}G\to\mathbf{Sh}(\mathbf{C}_{G},J)$ を与える。
:::

::: proof
**Step 1（$\Psi Y$ は層）.** 被覆 $S$ 上の両立する族 $(y_{f}:\operatorname{dom}f\to Y)_{f\in S}$ について、$x\in X$ を $x=f(z)$ と書いて $y(x)\defeq y_{f}(z)$ とおく。別の表示 $x=f'(z')$ について、\ref{cat:orbit-maps.2} の $W,w,p,p'$ をとると、$fp=f'p'\in S$ と両立性から $y_{f}(z)=y_{f}(p(w))=y_{fp}(w)=y_{f'p'}(w)=y_{f'}(z')$。よって $y$ は選び方によらず定まり（値は共通の値として定義され、選択はしない）、$y(gx)=y_{f}(gz)=gy(x)$。$yf=y_{f}$ で、一意性は $S$ が全射的なことから。

**Step 2（忠実）.** $u,v:Y\to Y'$ について $\Psi u=\Psi v$ なら、$y\in Y$ について $u(y)=ua_{y}(U)=va_{y}(U)=v(y)$。

**Step 3（充満）.** 自然変換 $\theta:\Psi Y\to\Psi Y'$ について、$y\in Y$ を $y=\iota(o)$（$\iota:O\to Y$, $O\in\mathbf{C}_{G}$）と表して $u(y)\defeq\theta(\iota)(o)$ とおく。別の表示 $\iota'(o')$ について、Step 1 と同じく $W$ をとれば $\theta(\iota)(o)=\theta(\iota p)(w)=\theta(\iota'p')(w)=\theta(\iota')(o')$（$\theta$ の自然性）。表示 $y=a_{y}(U)$ があるので $u$ は全域で定まり、$u(gy)=\theta(\iota)(go)=g\,u(y)$。$x:X\to Y$ について、$x(a)$ の表示 $(X,x,a)$ から $u\circ x=\theta(x)$、すなわち $\Psi u=\theta$。

**Step 4（本質的全射：対象の構成）.** 層 $P$ をとる。開正規部分群の族 $\mathcal{N}=\{G_{N}\}$ は包含の逆で有向。$G_{N'}\subset G_{N}$ のとき射影 $\pi:G/G_{N'}\to G/G_{N}$ により
$$
Y\defeq\operatorname*{colim}_{G_{N}\in\mathcal{N}}P(G/G_{N})
$$
とおく（フィルター付き余極限、\ref{cat:filtered-colimit-set}）。$g\in G$ について右移動 $r_{g}:G/G_{N}\to G/G_{N}$, $hG_{N}\mapsto hgG_{N}$ は（$G_{N}$ が正規なので）well-defined な $G$ 写像で、$r_{h}\circ r_{g}=r_{gh}$。$g\cdot[p]\defeq[P(r_{g})p]$ と定めると $\pi$ と両立し、$P(r_{g})P(r_{h})=P(r_{h}r_{g})=P(r_{gh})$ から作用。$u\in G_{N}$ なら $r_{u}=1$ なので $[p]$（$p\in P(G/G_{N})$）は $G_{N}$ で固定され、$Y$ は連続。

**Step 5（比較写像）.** $X\in\mathbf{C}_{G}$, $s\in P(X)$, $x\in X$ について、$x$ を固定する $G_{N}$ をとり（$\operatorname{Stab}x$ は開）
$$
\alpha_{X}(s)(x)\defeq[P(a_{x,N})s]\in Y
$$
とする（\ref{cat:orbit-maps.1}）。$G_{N'}\subset G_{N}$ なら $a_{x,N'}=a_{x,N}\pi$ なので $N$ によらない。$a_{gx,N}=a_{x,N}\circ r_{g}$（$hG_{N}\mapsto hgx$。$G_{N}$ は正規なので $gx$ も固定する）から $\alpha_{X}(s)(gx)=g\cdot\alpha_{X}(s)(x)$。$t:X'\to X$ について $a_{t(x'),N}=t\circ a_{x',N}$ なので $\alpha$ は自然：$\alpha:P\to\Psi Y$。

**Step 6（$\alpha$ は単射）.** $\alpha_{X}(s)=\alpha_{X}(s')$ とする。ふるい $T\defeq\{f : P(f)s=P(f)s'\}$ を考える。各 $x$ について、余極限で等しいので（\ref{cat:filtered-colimit-set.2}）ある $G_{N}$ で $P(a_{x,N})s=P(a_{x,N})s'$、すなわち $a_{x,N}\in T$ で、$x=a_{x,N}(G_{N})$。よって $T$ は被覆で、$P$ の分離性から $s=s'$。

**Step 7（$\alpha$ は全射）.** $G$ 写像 $\varphi:X\to Y$ をとる。$T\defeq\{f:V\to X : \varphi\circ f\in\operatorname{im}\alpha_{V}\}$ はふるい（$\alpha$ の自然性）で、Step 6 から $t_{f}\defeq\alpha_{V}^{-1}(\varphi f)$ は一意で両立する。被覆であること：$x\in X$ について $\varphi(x)=[p]$, $p\in P(G/G_{N})$ と書き、$G_{N}$ を小さくして $x$ も固定するようにする。$hG_{N}\in G/G_{N}$ について $a_{hG_{N},N}=r_{h}$ なので
$$
\alpha(p)(hG_{N})=[P(r_{h})p]=h\cdot\varphi(x)=\varphi(hx)=\varphi(a_{x,N}(hG_{N})).
$$
よって $a_{x,N}\in T$ で、$x$ はその像に入る。$P$ は層なので $P(f)s=t_{f}$（$f\in T$）となる $s$ があり、$\alpha_{X}(s)\circ f=\varphi\circ f$（$f\in T$）、$T$ は全射的なので $\alpha_{X}(s)=\varphi$。

**Step 8.** $\alpha:P\cong\Psi Y$ なので $\Psi$ は本質的全射。充満忠実と合わせて圏同値（\ref{cat:equivalence-characterization}。逆関手を選ぶところだけ、各 $P$ に上の $Y$ を対応させれば選択なしに定まる）。
:::

## 体の小エタールサイト {#cat:sec-et-field}

::: lemma グロタンディークのガロア理論（一般のガロア拡大） {#cat:grothendieck-galois-infinite keywords="etale algebras split by a Galois extension Omega are anti-equivalent to finite continuous Gal(Omega/K)-sets" index="グロタンディークのガロア理論（無限次）|ぐろたんでぃーくのがろありろんむげんじ"}
$\Omega$ で分解するエタール $K$ 代数の圏を $\mathbf{Et}_{\Omega/K}$ とする。$F(A)\defeq\Hom_{K}(A,\Omega)$（$G$ は合成で作用）は有限な連続 $G$ 集合で、$F:\mathbf{Et}_{\Omega/K}^{\mathrm{op}}\to\{\text{有限な連続 }G\text{ 集合}\}$ は圏同値。
:::

::: proof
**Step 1（有限部分への帰着）.** $A\in\mathbf{Et}_{\Omega/K}$ について $F(A)$ は有限（$\lvert F(A)\rvert=\dim A$）。各 $\varphi\in F(A)$ の像は有限次元なので、有限個の生成元を含む有限ガロア部分拡大 $N$ がとれる（\ref{fld:finite-galois-exhaustion.1}、合成で有向）。すべての $\varphi$ について共通の $N$ をとると、$\operatorname{Hom}_{K}(A,N)=\operatorname{Hom}_{K}(A,\Omega)$ で、$A\in\mathbf{Et}_{N/K}$。$G_{N}$ は $F(A)$ に自明に作用するので連続で、$G$ の作用は $\operatorname{Gal}(N/K)$ の作用（\ref{fld:fiber-functor} の $F$）を全射 $G\to\operatorname{Gal}(N/K)$ で引き戻したもの。

**Step 2（充満忠実）.** $A,B$ について共通の $N$ をとる。$G\to\operatorname{Gal}(N/K)$ が全射なので、$F(B)\to F(A)$ が $G$ 写像であることと $\operatorname{Gal}(N/K)$ 写像であることは同じ。有限版（\ref{fld:grothendieck-galois}）から $\Hom_{K}(A,B)\cong\Hom_{G}(F(B),F(A))$。

**Step 3（本質的全射）.** 有限な連続 $G$ 集合 $X$ の各点の安定化群は開なので、各 $x$ について $G_{N_{x}}\subset\operatorname{Stab}x$ となる $N_{x}$ があり、有限個の合成 $N$ について $G_{N}$ は自明に作用する。$X$ は $\operatorname{Gal}(N/K)$ 集合で、有限版から $X\cong F_{N}(A)$（$A\in\mathbf{Et}_{N/K}$）。$\varphi:A\to\Omega$ は $A$ のある成分体 $M$ を経由し、$M$ の元の最小多項式は（$M$ が $N$ に埋め込めるので）$N$ で分解し、その $\Omega$ での根はすべて $N$ に入るので、$\varphi(A)\subset N$。よって $F(A)=F_{N}(A)\cong X$ で、$A\in\mathbf{Et}_{\Omega/K}$。
:::

::: definition 体の小エタールサイト {#cat:small-etale-site-field keywords="small etale site of a field: etale algebras with jointly injective families as coverings" index="小エタールサイト|しょうえたーるさいと, エタール被覆|えたーるひふく"}
$\mathbf{Et}_{\Omega/K}$ の対象のうち $\Phi(X)=\operatorname{Map}_{G}(X,\Omega)$（$X\in\mathbf{C}_{G}$）の形のものの充満部分圏を $\mathbf{E}_{K}$ とする（小さい）。$\mathbf{E}_{K}^{\mathrm{op}}$ の対象 $A$ 上のふるい $S$（$A\to B$ の形の $K$ 代数の準同型の集合）が**エタール被覆**であるとは、有限個の $u_{i}:A\to B_{i}$ を含み $A\to\prod_{i}B_{i}$ が単射となることをいう。$(\mathbf{E}_{K}^{\mathrm{op}},J_{\mathrm{et}})$ を $K$ の**小エタールサイト**という。
:::

::: theorem 体のエタール層 {#cat:etale-sheaves-field keywords="etale sheaves on Spec K are continuous Gal(Omega/K)-sets; global sections are invariants; the structure sheaf corresponds to Omega" index="エタール層とガロア集合|えたーるそうとがろあしゅうごう"}
1. $F$ は圏同値 $\mathbf{E}_{K}^{\mathrm{op}}\simeq\mathbf{C}_{G}$ を与え、エタール被覆は全射位相に対応する。
2. したがって $\mathbf{Sh}(\mathbf{E}_{K}^{\mathrm{op}},J_{\mathrm{et}})\simeq\mathbf{B}G$。層 $P$ に対応する $G$ 集合 $Y$ について、$P(K)\cong Y^{G}$（$G$ 不変元）。
3. 前層 $\mathcal{O}:A\mapsto A$ は層で、$G$ 集合 $\Omega$（自然な作用）に対応する。
:::

::: proof
**Step 1（1：圏同値）.** \ref{cat:grothendieck-galois-infinite} の $F$ を $\mathbf{E}_{K}$ に制限する。$\mathbf{E}_{K}$ の各対象は $\Phi(X)$ の形で、有限版の $\varepsilon_{X}$（\ref{fld:grothendieck-galois}）により $F(\Phi(X))\cong X$ なので、$\mathbf{C}_{G}$ の各対象は像に入る。逆に $F(A)$ は有限な連続 $G$ 集合で、軌道ごとに $G/U\times\{i\}$ と同一視すれば（有限個の軌道に番号をつけるだけ）$\mathbf{C}_{G}$ の対象と同型。

**Step 2（1：被覆の対応）.** 族 $u_{i}:A\to B_{i}$ について、$F(\prod B_{i})=\bigsqcup F(B_{i})$（\ref{fld:grothendieck-galois} の証明の Step 2）で、$A\to\prod B_{i}$ は、有限版の同型 $\eta$ により、$\operatorname{Map}_{G}(F(A),\Omega)\to\operatorname{Map}_{G}(\bigsqcup F(B_{i}),\Omega)$（$t:\bigsqcup F(B_{i})\to F(A)$ に沿った制限）と同一視される。$t$ が全射なら制限は単射。全射でなければ、像に入らない軌道 $Gx\cong G/U$ の上でだけ $\neq0$ の $G$ 写像（$\operatorname{Map}_{G}(G/U,\Omega)\cong\Omega^{U}\ni1$。\ref{fld:field-transitive-gset.2}）があり、それは制限で $0$ になるので単射でない。よって「$\prod$ への写像が単射」$\iff$「$F$ の族が全射的」。ふるいが有限個の元で全射的になることは $F(A)$ が有限なことから自動的。

**Step 3（2）.** 同値なサイト（対象・射・被覆が対応する）の層の圏は同値なので、1 と \ref{cat:sheaves-continuous-gsets} から。$K$ は終対象 $1$（1 点の $G$ 集合）に対応し、$P(K)\cong\Hom_{G}(1,Y)=Y^{G}$。

**Step 4（3）.** $\mathcal{O}(A)=A\cong\operatorname{Map}_{G}(F(A),\Omega)=\Hom_{G}(F(A),\Omega)$（有限版の $\eta$、自然）なので、$\mathcal{O}\cong\Psi(\Omega)\circ F$。$\Omega$ は連続な $G$ 集合（各元はある $N$ に入り $G_{N}$ で固定される）なので、$\mathcal{O}$ は層で $\Omega$ に対応する。
:::

::: remark エタールコホモロジーとガロアコホモロジー
アーベル群の対象どうしも圏同値で対応するので、小エタールサイト上のアーベル群の層は**連続な $G$ 加群**（作用が連続なアーベル群）と対応し、大域切断 $\Gamma$ は不変部分 $M\mapsto M^{G}$ に対応する。したがってエタールコホモロジー $H^{q}_{\mathrm{et}}(\operatorname{Spec}K,-)$（\ref{cat:sheaf-cohomology} と同様に右導来関手で定める）は、連続な $G$ 加群の不変部分の右導来関手、すなわち**ガロアコホモロジー** $H^{q}(G,M)$ である。これが連続コチェインによるコホモロジーと一致すること、乗法群について $H^{1}(G,\Omega^{\times})=0$（ヒルベルトの定理 90 の一般形。巡回の場合は \ref{fld:hilbert-90}）は知られている（本サイト未収録）。
:::

## 環のザリスキ位相とエタール位相 {#cat:sec-et-rings}

::: proposition ザリスキ被覆の完全性 {#cat:zariski-exact keywords="for f_1,...,f_n generating the unit ideal, 0 -> M -> prod M_{f_i} -> prod M_{f_i f_j} is exact" index="ザリスキ被覆|ざりすきひふく"}
可換環 $A$、$(f_{1},\dots,f_{n})=A$、$A$ 加群 $M$ について、
$$
0\to M\to\prod_{i}M_{f_{i}}\rightrightarrows\prod_{i,j}M_{f_{i}f_{j}}
$$
は完全（$M$ は二つの射の等化子）。
:::

::: proof
**Step 1（単射）.** $m\in M$ がすべての $M_{f_{i}}$ で $0$ なら、$f_{i}^{k}m=0$（$k$ を共通にとる）。$(f_{1}^{k},\dots,f_{n}^{k})=A$（\ref{ring:unit-ideal-powers}）なので $1=\sum a_{i}f_{i}^{k}$、$m=\sum a_{i}f_{i}^{k}m=0$。

**Step 2（等化子）.** $m_{i}/f_{i}^{k}\in M_{f_{i}}$（$k$ 共通）が $M_{f_{i}f_{j}}$ で一致するとする：ある $l$ で $(f_{i}f_{j})^{l}(f_{j}^{k}m_{i}-f_{i}^{k}m_{j})=0$。$k$ を $k+l$ に、$m_{i}$ を $f_{i}^{l}m_{i}$ に取り替えると、$f_{j}^{k}m_{i}=f_{i}^{k}m_{j}$（すべての $i,j$）としてよい。$1=\sum_{j}a_{j}f_{j}^{k}$ として $m\defeq\sum_{j}a_{j}m_{j}$ とおくと $f_{i}^{k}m=\sum_{j}a_{j}f_{i}^{k}m_{j}=\sum_{j}a_{j}f_{j}^{k}m_{i}=m_{i}$、すなわち $M_{f_{i}}$ で $m=m_{i}/f_{i}^{k}$。
:::

::: definition ザリスキ位相と標準エタール代数 {#cat:etale-topology-ring keywords="Zariski topology on localizations; standard etale algebra (A[x]/(f))_g with f' invertible; etale topology" index="ザリスキ位相（サイト）|ざりすきいそうさいと, 標準エタール代数|ひょうじゅんえたーるだいすう, エタール位相|えたーるいそう"}
1. **ザリスキ被覆**：$A$ 代数 $B$ について、族 $B\to B_{h_{i}}$（$(h_{1},\dots,h_{n})=B$）をザリスキ被覆という。\ref{cat:zariski-exact} は、$B\mapsto M\otimes_{A}B$ がこの被覆について層の条件をみたすことを述べている。
2. **標準エタール代数**：$A$ 代数 $B=(A[x]/(f))_{g}$（$f$ はモニック、導関数 $f'$ の像が $B$ で可逆）を標準エタールという。$A$ 代数 $B$ が**エタール**であるとは、ザリスキ被覆 $B\to B_{h_{i}}$ で各 $B_{h_{i}}$ がある $A_{g_{i}}$（$(g_{i})=A$ のザリスキ被覆の一員）上の標準エタール代数となるものがあることをいう。
3. **エタール位相**：エタール $A$ 代数の圏の反対圏で、族 $B\to C_{i}$ が $\operatorname{Spec}C_{i}\to\operatorname{Spec}B$ の像の和が全体となるものを被覆とする。
:::

::: remark エタール位相について知られていること（本サイト未収録）
- エタールは合成と係数拡大で閉じ、エタール $A$ 代数の間の射もエタールで、3 はグロタンディーク位相を定める。$A=K$ が体なら、エタール $K$ 代数は有限エタール代数（\ref{fld:etale-algebra}）の直積と同じで、3 は上の小エタールサイトと同値な層の圏を与える（標準エタール $K$ 代数は、$f$ が分離的な部分の積 $K[x]/(f)$ の局所化で、\ref{fld:etale-equivalent} のエタール代数）。
- 標準エタール代数を使った定義は、「平坦・有限表示・不分岐（$\Omega_{B/A}=0$）」による定義と同値（局所的な構造定理）。
- 忠実平坦降下により、$B\mapsto M\otimes_{A}B$ はエタール位相（さらに平坦位相）でも層。これが \ref{cat:zariski-exact} の一般化である。
- 有限体上の代数多様体のエタールコホモロジーはヴェイユ予想の証明（ドリーニュ）に使われた。
:::

::: hypcheck
- **選択公理**：使わない。$\Psi$ の逆は余極限 $Y$ で選択なしに定まり（\ref{cat:sheaves-continuous-gsets} の Step 8）、軌道の表示 $a_{y}$ は標準的。$\Omega=K^{\mathrm{sep}}$ ととり「すべてのエタール代数」を扱うときは、分離閉包の存在に選択公理を使う。
- クルル位相についての事実は、開部分群が $G_{N}$ を含むこと（定義）、$G_{N}$ が正規で指数有限なこと（\ref{fld:finite-galois-exhaustion.3}）、合成で有向なこと（同 1）だけを使った。無限次ガロア理論の基本定理（選択公理を使う）は使っていない。
- $G_{N}$ が**正規**であることは、右移動 $r_{g}$ が well-defined なこと（Step 4）と $a_{gx,N}=a_{x,N}r_{g}$（Step 5）で本質的に使った。
:::

::: supplement
**分類トポス.** $\mathbf{B}G$ は「$G$ 主束の分類トポス」と呼ばれ、トポス $\mathcal{E}$ から $\mathbf{B}G$ への幾何学的射は $\mathcal{E}$ の中の $G$ トルソー（主等質空間）と対応することが知られている（本サイト未収録）。$G$ が有限群（離散）なら $\mathbf{B}G$ は前層トポス $\widehat{G}$（$G$ を 1 対象の圏と見る）で、\ref{cat:sheaves-continuous-gsets} は「有限 $G$ 集合と全射位相の層 ＝ すべての $G$ 集合」という主張になる。

**エタール基本群.** 連結なスキーム $X$ の有限エタール被覆の圏は、ある射有限群 $\pi_{1}^{\mathrm{et}}(X)$ の有限連続集合の圏と同値で（グロタンディークの SGA 1）、$X=\operatorname{Spec}K$ では $\pi_{1}^{\mathrm{et}}=\operatorname{Gal}(K^{\mathrm{sep}}/K)$。位相空間の被覆空間の理論（基本群）との類似である（本サイト未収録）。
:::

## 高い視点 {#cat:sec-et-viewpoint}

::: remark 「点」が群をもつ空間
$\operatorname{Spec}K$ はザリスキ位相では 1 点だが、エタール位相で見ると「1 点に対称性 $G$ が付いた空間」になる：層は一つの集合ではなく、$G$ が連続に作用する集合である。これは、軌道空間 $\ast/\!/G$（ホモトピー論の分類空間 $BG$）の上の局所系に当たる。比喩で言えば、ザリスキ位相は「$K$ の元を見る目」、エタール位相は「$K$ の代数的閉包の中で、$K$ からは区別できない共役な元たちの入れ替え」まで見る目で、ガロア群はその「見えない内部の対称性」である。
:::

## 問題 {#cat:sec-et-problems}

::: problem {#cat:prob-et-mu-n}
$K=\mathbb{Q}$、$\Omega=\overline{\mathbb{Q}}\cap\mathbb{C}$（$\mathbb{Q}$ の代数的閉包として $\mathbb{C}$ の中の代数的数をとる）とする。前層 $\mu_{2}:A\mapsto\{a\in A : a^{2}=1\}$ はエタール層で、対応する $G$ 集合は $\{\pm1\}$（自明な作用）であることを示せ。また $A=\mathbb{Q}(\sqrt{2})$ のとき $\mu_{2}(A)$ を求めよ。
:::

::: solution
$\mu_{2}$ は \ref{cat:etale-sheaves-field.3} の $\mathcal{O}$ の部分前層で、各 $A$ で $\mathcal{O}(A)\cong\operatorname{Map}_{G}(F(A),\Omega)$ の中の「値が $\pm1$ の写像」に対応する（積は値ごと）。$\pm1$ は $G$ で固定されるので、これは $\operatorname{Map}_{G}(F(A),\{\pm1\})=\Psi(\{\pm1\})(F(A))$（自明な作用）。よって $\mu_{2}\cong\Psi(\{\pm1\})\circ F$ は層。$A=\mathbb{Q}(\sqrt{2})$ では $F(A)$ は 2 点の推移的な $G$ 集合で、$G$ 写像 $F(A)\to\{\pm1\}$ は定数のみ（推移的で値が固定点）なので $\mu_{2}(A)=\{\pm1\}$。実際、体 $A$ で $a^{2}=1$ の解は $\pm1$ だけ。対して $A=\mathbb{Q}\times\mathbb{Q}$ では $F(A)$ は 2 点の自明な $G$ 集合で、$\mu_{2}(A)=\{\pm1\}^{2}$（4 元）。
:::
