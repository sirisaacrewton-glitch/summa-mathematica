# サイトとグロタンディーク位相 {#cat:page-sites keywords="Grothendieck topology, covering sieve, site, matching family, sheaf on a site, dense monomorphism, sheaves on a site form a complete cartesian closed category, closed sieves, Grothendieck topos, Giraud's theorem"}

空間上の層の定義で使ったのは、開集合とその包含（圏 $\mathcal{O}(X)$）と、「どの族が $U$ を覆うか」だけである。そこで、小さい圏 $\mathbf{C}$ の各対象 $c$ について「$c$ を覆うふるい」を公理的に指定したものを**グロタンディーク位相**、その組 $(\mathbf{C},J)$ を**サイト**という。サイト上の層は前層の圏の中で定義され、空間の場合はもとの層に一致する。層の圏は極限と冪対象を前層の圏から受け継ぐ。空間の層のトポス（\ref{cat:page-sheaf-topos}）は、こうして一般のサイトに広がる。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#cat:sec-st-notation}

::: notation
- $\mathbf{C}$ は小さい圏、$\widehat{\mathbf{C}}$ はその前層の圏、$\mathbf{y}$ は米田埋め込み。米田の補題 $\widehat{\mathbf{C}}(\mathbf{y}c,P)\cong P(c)$ は \ref{cat:yoneda-lemma}。$x\in P(c)$, $f:d\to c$ について $x\cdot f\defeq P(f)(x)$。
- ふるい、引き戻し $f^{*}S$、最大のふるい $t_{c}$、$f\in S\iff f^{*}S=t_{d}$ は \ref{cat:sieve}, \ref{cat:sieve-basic}。ふるい $S$ は $\mathbf{y}c$ の部分前層と同じもの。
- 前層の極限は各点ごと（\ref{cat:pointwise-limits}）、冪対象 $Q^{P}(c)=\widehat{\mathbf{C}}(\mathbf{y}c\times P,Q)$ と随伴 $\widehat{\mathbf{C}}(B,Q^{P})\cong\widehat{\mathbf{C}}(B\times P,Q)$（$B$ について自然）は \ref{cat:presheaf-exponential}。
- 空間上の層は \ref{cat:sheaf-space}。
- **選択公理**：使わない。
:::

## グロタンディーク位相 {#cat:sec-st-topology}

::: definition グロタンディーク位相とサイト {#cat:grothendieck-topology keywords="Grothendieck topology, covering sieves, site, maximality, stability, transitivity (local character)" index="グロタンディーク位相|ぐろたんでぃーくいそう, 被覆ふるい|ひふくふるい, サイト|さいと"}
小さい圏 $\mathbf{C}$ の**グロタンディーク位相** $J$ とは、各対象 $c$ に $c$ 上のふるいの集合 $J(c)$（その元を**被覆ふるい**という）を対応させたもので、次をみたすものをいう。
1. （最大）$t_{c}\in J(c)$。
2. （安定）$S\in J(c)$, $f:d\to c$ なら $f^{*}S\in J(d)$。
3. （推移）$S\in J(c)$ で、$c$ 上のふるい $R$ がすべての $f\in S$（$f:d\to c$）について $f^{*}R\in J(d)$ をみたすなら、$R\in J(c)$。

組 $(\mathbf{C},J)$ を**サイト**という。
:::

::: lemma 被覆ふるいの性質 {#cat:covering-sieve-basic keywords="covering sieves are upward closed and closed under finite intersections" index="被覆ふるいの性質|ひふくふるいのせいしつ"}
1. $S\in J(c)$ で $S\subset R$（$R$ はふるい）なら $R\in J(c)$。
2. $S,R\in J(c)$ なら $S\cap R\in J(c)$。
:::

::: proof
**Step 1（1）.** $f\in S$ なら $f\in R$ なので、$f^{*}R=t_{d}\in J(d)$（\ref{cat:sieve-basic} の 3 と公理 1）。公理 3 から $R\in J(c)$。

**Step 2（2）.** $S\cap R$ はふるい。$f\in S$ について $f^{*}(S\cap R)=f^{*}S\cap f^{*}R=t_{d}\cap f^{*}R=f^{*}R$ で、これは公理 2 から $J(d)$ に入る。公理 3（$S$ を被覆ふるいとして）から $S\cap R\in J(c)$。
:::

::: example サイトの例 {#cat:site-examples}
1. **空間**：位相空間 $X$ について、$\mathcal{O}(X)$ の対象 $U$ 上のふるいは、$U$ に含まれる開集合の族 $S$ で小さい開集合への包含で閉じたもの。$\bigcup_{V\in S}V=U$ のとき $S\in J_{X}(U)$ とする。これはグロタンディーク位相である（下の証明）。
2. **自明な位相**：$J(c)=\{t_{c}\}$。公理 1・2 は $f^{*}t_{c}=t_{d}$ から、公理 3 は $1_{c}\in t_{c}$ について $1_{c}^{*}R=R\in J(c)$ から。
3. **最大の位相**：すべてのふるい（空のふるいを含む）を被覆とする。公理は明らか。
4. **群**：群 $G$ を 1 対象の圏と見ると、空でないふるい $S$ は $g\in S$ から $g\circ g^{-1}=1\in S$ を含み、最大（\ref{cat:sieve-basic} の 2）。よってふるいは $\emptyset$ と $t$ だけで、位相は 2 と 3 の二つだけ。
:::

::: proof
1 の公理を確かめる。

**Step 1（最大）.** $U$ のすべての開部分集合の和は $U$。

**Step 2（安定）.** $V\subset U$ について $f^{*}S=\{W\subset V : W\in S\}$。$S$ は小さい開集合で閉じているので $W'\in S\Rightarrow W'\cap V\in f^{*}S$ で、$\bigcup f^{*}S\supset\bigcup_{W'\in S}(W'\cap V)=U\cap V=V$。

**Step 3（推移）.** $S\in J_{X}(U)$ で、各 $V\in S$ について $\{W\subset V : W\in R\}$ の和が $V$ なら、$\bigcup R\supset\bigcup_{V\in S}V=U$。
:::

## サイト上の層 {#cat:sec-st-sheaves}

::: definition サイト上の層 {#cat:site-sheaf keywords="matching family for a sieve, amalgamation, sheaf on a site" index="サイト上の層|さいとじょうのそう, 両立する族（ふるい）|りょうりつするぞくふるい, 貼り合わせ（ふるい）|はりあわせふるい"}
前層 $P$ と $c$ 上のふるい $S$ について、$S$ 上の**両立する族**とは、$f\in S$ ごとの $x_{f}\in P(\operatorname{dom}f)$ で、$f\in S$, $g:e\to\operatorname{dom}f$ について $x_{f}\cdot g=x_{f\circ g}$ をみたすものをいう。$x\in P(c)$ が $x\cdot f=x_{f}$（すべての $f\in S$）をみたすとき、$x$ をその族の**貼り合わせ**という。すべての $c$, $S\in J(c)$ と $S$ 上のすべての両立する族がただ一つの貼り合わせをもつとき、$P$ を $(\mathbf{C},J)$ 上の**層**（$J$ 層）という。$J$ 層の圏 $\mathbf{Sh}(\mathbf{C},J)$ は $\widehat{\mathbf{C}}$ の充満部分圏。
:::

::: lemma 米田による言い換え {#cat:site-sheaf-yoneda keywords="matching families are morphisms S -> P; P is a sheaf iff Hom(yc,P) -> Hom(S,P) is bijective" index="層の条件の米田による言い換え|そうのじょうけんのよねだによるいいかえ"}
1. $S$ 上の両立する族は、前層の射 $S\to P$（$S$ を $\mathbf{y}c$ の部分前層と見る）と一対一（$\alpha\mapsto(\alpha_{\operatorname{dom}f}(f))_{f\in S}$）。
2. $P$ が $J$ 層 $\iff$ すべての $S\in J(c)$ について、包含 $S\hookrightarrow\mathbf{y}c$ との合成 $\widehat{\mathbf{C}}(\mathbf{y}c,P)\to\widehat{\mathbf{C}}(S,P)$ が全単射。
:::

::: proof
**Step 1（1）.** 射 $\alpha:S\to P$ の自然性は $\alpha_{e}(f\circ g)=\alpha_{d}(f)\cdot g$（$f\in S(d)$, $g:e\to d$）で、これは $x_{f}\defeq\alpha_{d}(f)$ が両立することそのもの。逆に両立する族から $\alpha_{d}(f)\defeq x_{f}$ で自然変換が得られる。

**Step 2（2）.** 米田の補題（\ref{cat:yoneda-lemma}）で $x\in P(c)$ は $\hat x:\mathbf{y}c\to P$, $\hat x_{d}(f)=x\cdot f$ に対応する。$\hat x$ の $S$ への制限は、1 で族 $(x\cdot f)_{f\in S}$ に対応する。よって「制限が全単射」は「各両立する族がただ一つの貼り合わせをもつ」ことと同じ。
:::

::: theorem 空間の場合 {#cat:site-sheaf-space keywords="sheaves on the site O(X) with the open-cover topology are exactly the sheaves on X" index="空間のサイト|くうかんのさいと"}
$X$ を位相空間、$J_{X}$ を \ref{cat:site-examples} の 1 の位相とする。前層 $P$ が $(\mathcal{O}(X),J_{X})$ 上の層であることと、\ref{cat:sheaf-space} の意味で層であることは同値。すなわち $\mathbf{Sh}(\mathcal{O}(X),J_{X})=\mathbf{Sh}(X)$。
:::

::: proof
$\mathcal{O}(X)$ では射は包含だけなので、ふるい $S$ 上の両立する族は、$V\in S$ ごとの $x_{V}\in P(V)$ で、$W\subset V\in S$ について $x_{V}|_{W}=x_{W}$ をみたすもの。

**Step 1（被覆の族 → ふるいの族）.** 開被覆 $U=\bigcup U_{i}$ と両立する族 $s_{i}\in P(U_{i})$（$s_{i}|_{U_{ij}}=s_{j}|_{U_{ij}}$）について、$S\defeq\{V : \text{ある }i\text{ で }V\subset U_{i}\}$ は $J_{X}(U)$ の元。$V\subset U_{i}$ のとき $x_{V}\defeq s_{i}|_{V}$ とおくと、$V\subset U_{i}\cap U_{j}$ なら $s_{i}|_{V}=(s_{i}|_{U_{ij}})|_{V}=(s_{j}|_{U_{ij}})|_{V}=s_{j}|_{V}$ なので $i$ によらず、両立する。$x\in P(U)$ について、「$x|_{U_{i}}=s_{i}$（すべての $i$）」と「$x|_{V}=x_{V}$（すべての $V\in S$）」は同値（$\Leftarrow$ は $V=U_{i}$、$\Rightarrow$ は $V\subset U_{i}$ でさらに制限）。

**Step 2（ふるいの族 → 被覆の族）.** $S\in J_{X}(U)$ と両立する族 $(x_{V})_{V\in S}$ について、$\{V\}_{V\in S}$ は $U$ の開被覆で、$V,V'\in S$ について $V\cap V'\in S$（ふるい）なので $x_{V}|_{V\cap V'}=x_{V\cap V'}=x_{V'}|_{V\cap V'}$。よって被覆に関する両立する族で、その貼り合わせは族 $(x_{V})$ の貼り合わせと同じもの。

**Step 3（同値）.** $P$ が \ref{cat:sheaf-space} の意味の層なら、Step 2 により $J_{X}$ 被覆ふるい上の両立する族は（被覆の族として）ただ一つの貼り合わせをもつ。逆に $J_{X}$ 層なら、Step 1 により被覆の両立する族は（ふるいの族として）ただ一つの貼り合わせをもつ。
:::

::: example
1. 自明な位相 $\{t_{c}\}$ では、$t_{c}$ 上の両立する族は $x_{1_{c}}$ で決まり（$x_{f}=x_{1_{c}}\cdot f$）、その貼り合わせは $x_{1_{c}}$ だけなので、すべての前層が層：$\mathbf{Sh}(\mathbf{C},\{t\})=\widehat{\mathbf{C}}$。
2. 最大の位相では、空のふるい上の両立する族は一つ（空の族）で、ただ一つの貼り合わせをもつことは $P(c)$ が 1 点であることを意味する。層は終対象だけ。
:::

## 層の圏の構造 {#cat:sec-st-structure}

::: lemma 稠密なモノ射に沿った延長 {#cat:dense-mono-extension keywords="J-dense monomorphism; sheaves have unique extensions along dense monos" index="稠密なモノ射|ちゅうみつなものしゃ"}
部分前層 $A\subset B$ が **$J$ 稠密**であるとは、各 $b\in B(d)$ について $S_{b}\defeq\{g:e\to d : b\cdot g\in A(e)\}$ が $J(d)$ に入ることをいう。このとき、$J$ 層 $Q$ について、制限 $\widehat{\mathbf{C}}(B,Q)\to\widehat{\mathbf{C}}(A,Q)$ は全単射。
:::

::: proof
**Step 1（$S_{b}$ はふるい）.** $g\in S_{b}$ なら $b\cdot(g\circ h)=(b\cdot g)\cdot h\in A$（$A$ は部分前層）。

**Step 2（延長の構成）.** $\alpha:A\to Q$ と $b\in B(d)$ について、$(\alpha(b\cdot g))_{g\in S_{b}}$ は $S_{b}$ 上の両立する族（$\alpha(b\cdot g)\cdot h=\alpha(b\cdot gh)$）。$S_{b}\in J(d)$ なので、ただ一つの貼り合わせ $\beta_{d}(b)\in Q(d)$ がある。

**Step 3（自然性）.** $h:e\to d$ について、$S_{b\cdot h}=h^{*}S_{b}$ で、$g\in h^{*}S_{b}$ について $(\beta_{d}(b)\cdot h)\cdot g=\beta_{d}(b)\cdot(hg)=\alpha(b\cdot hg)=\alpha((b\cdot h)\cdot g)$。よって $\beta_{d}(b)\cdot h$ は $b\cdot h$ の族の貼り合わせで、一意性から $\beta_{e}(b\cdot h)=\beta_{d}(b)\cdot h$。

**Step 4（延長であること・一意性）.** $b\in A(d)$ なら $1_{d}\in S_{b}$ で、貼り合わせ $x$ は $x=x\cdot1_{d}=\alpha(b)$ をみたすので $\beta(b)=\alpha(b)$。別の延長 $\beta'$ について、$\beta'_{d}(b)\cdot g=\beta'(b\cdot g)=\alpha(b\cdot g)$（$g\in S_{b}$）なので $\beta'_{d}(b)$ も貼り合わせで、一意性から $\beta'=\beta$。
:::

::: theorem 層の圏の極限と冪対象 {#cat:site-sheaves-limits-exponentials keywords="sheaves on a site are closed under limits and exponentials in presheaves; Sh(C,J) is complete and cartesian closed" index="サイト上の層の圏の構造|さいとじょうのそうのけんのこうぞう"}
1. $J$ 層の図式の、$\widehat{\mathbf{C}}$ での極限（各点ごと）は $J$ 層。したがって $\mathbf{Sh}(\mathbf{C},J)$ は完備。
2. $Q$ が $J$ 層なら、任意の前層 $P$ について $Q^{P}$ は $J$ 層。したがって $\mathbf{Sh}(\mathbf{C},J)$ はデカルト閉で、冪対象は前層としての $Q^{P}$。
:::

::: proof
**Step 1（1）.** 極限 $L=\lim_{j}D_{j}$ と $S\in J(c)$ について、$\widehat{\mathbf{C}}(-,L)\cong\lim_{j}\widehat{\mathbf{C}}(-,D_{j})$（極限の普遍性）なので、$\widehat{\mathbf{C}}(\mathbf{y}c,L)\to\widehat{\mathbf{C}}(S,L)$ は全単射 $\widehat{\mathbf{C}}(\mathbf{y}c,D_{j})\to\widehat{\mathbf{C}}(S,D_{j})$ たちの極限で、全単射。\ref{cat:site-sheaf-yoneda} の 2 から $L$ は層。層の極限は層の圏でも極限（充満部分圏）。

**Step 2（2：言い換え）.** 随伴 $\widehat{\mathbf{C}}(B,Q^{P})\cong\widehat{\mathbf{C}}(B\times P,Q)$ は $B$ について自然なので、$S\hookrightarrow\mathbf{y}c$ に沿った制限は $\widehat{\mathbf{C}}(\mathbf{y}c\times P,Q)\to\widehat{\mathbf{C}}(S\times P,Q)$（$S\times P\hookrightarrow\mathbf{y}c\times P$ に沿った制限）に対応する。これが全単射なことを示せばよい（\ref{cat:site-sheaf-yoneda} の 2）。

**Step 3（2：稠密性）.** $S\times P\subset\mathbf{y}c\times P$ は $J$ 稠密：$(f,p)\in(\mathbf{y}c\times P)(d)$ について、$\{g : (f\circ g,p\cdot g)\in S\times P\}=\{g : f\circ g\in S\}=f^{*}S\in J(d)$（公理 2）。\ref{cat:dense-mono-extension} から全単射。

**Step 4（デカルト閉）.** 終対象（1 点の前層）と二項積は 1 から層の中にあり、$Q^{P}$ は層で、層 $B$ について随伴がそのまま成り立つ（充満部分圏）。
:::

::: remark 部分対象分類子とトポス
$J$ 層の圏は部分対象分類子ももち、トポスになる（\ref{cat:site-topos}）。部分対象分類子は**閉じたふるい**の前層 $\Omega_{J}(c)\defeq\{S : f^{*}S\in J(d)\Rightarrow f\in S\}$ で与えられる。空間 $(\mathcal{O}(X),J_{X})$ では、$U$ 上の閉じたふるい $S$ は「$\{W\subset V : W\in S\}$ が $V$ を覆うなら $V\in S$」をみたすので、$W_{0}\defeq\bigcup S$ について $S=\{V : V\subset W_{0}\}$（$\supset$：$V\subset W_{0}$ は $\{V\cap W : W\in S\}$ で覆われる）。よって閉じたふるいは $U$ の開部分集合 $W_{0}$ と一対一で、\ref{cat:open-subobject-classifier} の $\Omega_{X}$ と一致する。一般のサイトでは、層化（\ref{cat:page-sheafification} の補足の + 構成を 2 回）が前層の圏から層の圏への左完全な左随伴を与えることを使って示す。
:::

::: hypcheck
- **選択公理**：使わない。貼り合わせは「ただ一つ」存在するものをとるだけで、選択は要らない。
- **$\mathbf{C}$ が小さいこと**：前層の圏の極限・冪対象（\ref{cat:pointwise-limits}, \ref{cat:presheaf-exponential}）と、ふるいの全体が集合であること（\ref{cat:sieve-basic}）で使った。
- 公理 1〜3 は、\ref{cat:covering-sieve-basic}（公理 1・2・3 すべて）と \ref{cat:site-sheaves-limits-exponentials} の Step 3（公理 2：$f^{*}S$ が被覆）で使った。極限と冪対象の議論そのものは公理 1・3 を使わない（公理 2 をみたすどんなふるいの集合 $J$ についても、「$J$ のふるいについての層」は極限と冪対象で閉じる）。公理 1・3 は、層化の存在やトポスであることのために要る。
:::

::: supplement
**グロタンディーク・トポスとジローの定理.** サイト上の層の圏と圏同値な圏を**グロタンディーク・トポス**という。ジローの定理は、グロタンディーク・トポスを「小さい生成系をもち、余極限が引き戻しで安定で、余積が交わらず、同値関係が有効な、局所的に小さい圏」として内在的に特徴づける（公理は \ref{cat:giraud-axioms}、証明は \ref{cat:sheaves-giraud} と \ref{cat:giraud-theorem}）。

**位相の例.** スキームのエタール位相（エタール射の全射族で覆う）、平坦位相、群の作用の圏の位相などがある。副有限群 $G$ について、連続な $G$ 集合の圏はある位相の層の圏と同値で、体 $k$ の有限エタール代数の圏（\ref{fld:grothendieck-galois}）の反対圏に適切な位相を入れたサイトの層の圏は、$\operatorname{Gal}(k^{\mathrm{sep}}/k)$ の連続な作用をもつ集合の圏と同値になる（グロタンディークのガロア理論のトポス版。\ref{cat:etale-sheaves-field}）。スキームのエタール位相の定義は \ref{cat:etale-topology-ring}。

**ローヴェア–ティアニー位相.** トポス $\mathcal{E}$ の射 $j:\Omega\to\Omega$ で $j\circ\mathrm{true}=\mathrm{true}$, $j\circ j=j$, $j\circ\wedge=\wedge\circ(j\times j)$ をみたすものを**ローヴェア–ティアニー位相**という。前層トポス $\widehat{\mathbf{C}}$ では、それはグロタンディーク位相と一対一に対応する（$J(c)=\{S : j_{c}(S)=t_{c}\}$）。知られている（本サイト未収録）。
:::

## 高い視点 {#cat:sec-st-viewpoint}

::: remark 「覆う」の公理化
グロタンディーク位相は、点のない「被覆の論理」である。開集合の位相は「点の集まり」から被覆を決めるが、サイトでは被覆そのものを基本概念にとり、点を忘れる。比喩で言えば、地図帳（サイト）は各ページ（対象）と、どのページの組がどのページを完全に覆うかの約束（被覆ふるい）だけで、地球（点の集合）を参照せずに「局所的に決まるデータ」（層）を語れる。公理 2 は「覆われた領域を縮めても覆われたまま」、公理 3 は「局所的に覆われていれば覆われている」で、層の条件は米田の補題により「被覆ふるい $S\hookrightarrow\mathbf{y}c$ に対して $P$ が直交する（$\widehat{\mathbf{C}}(\mathbf{y}c,P)\cong\widehat{\mathbf{C}}(S,P)$）」という一つの言葉になる。層の圏はこの直交性で切り出される反射的部分圏で、層化はその反射（局所化）である。
:::

## 問題 {#cat:sec-st-problems}

::: problem {#cat:prob-st-dense-topology}
$\mathcal{O}(X)$ で、$U$ 上のふるい $S$ を、「$U$ の空でない開集合 $V$ はすべて $S$ のある空でない元を含む」とき被覆とする（$S$ の元の和が $U$ で稠密）。これがグロタンディーク位相であることを示せ。
:::

::: solution
「$U$ の空でない開集合 $V$ はすべて $S$ の空でない元を含む」を (D) とする。

**最大.** $t_{U}$ は $V$ 自身を含む。

**安定.** $W\subset U$ と $S$ について $f^{*}S=\{V\subset W : V\in S\}$。$W$ の空でない開集合 $V$ は $U$ の空でない開集合なので、空でない $V'\in S$, $V'\subset V$ がある。$V'\subset W$ なので $V'\in f^{*}S$。

**推移.** $S$ が (D) をみたし、各 $W\in S$ について $\{V\subset W : V\in R\}$ が $W$ で (D) をみたすとする。$U$ の空でない開集合 $V$ について、空でない $W\in S$ で $W\subset V$ となるものがあり、次に $W$ で (D) を使って空でない $V''\in R$, $V''\subset W\subset V$ がある。よって $R$ は (D) をみたす。

（$X$ 上のこの位相の層は、$\neg\neg$ 位相（二重否定位相）についての層として知られる。本サイト未収録。）
:::
