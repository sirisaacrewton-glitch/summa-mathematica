# 豊穣米田の補題とデイ畳み込み {#cat:page-day-convolution keywords="object of V-natural transformations, enriched Yoneda lemma, Day convolution, promonoidal, presheaves on a monoidal category are monoidal closed, Yoneda embedding is strong monoidal, monoids for Day convolution are lax monoidal functors, species, Cauchy product"}

豊穣圏では、自然変換の全体も $\mathbf{V}$ の対象 $[\mathbf{A},\mathbf{V}](F,G)$ になり、**豊穣米田の補題** $[\mathbf{A},\mathbf{V}](\mathbf{A}(a,-),F)\cong Fa$ が成り立つ。後半では、小さいモノイダル圏 $\mathbf{C}$ 上の前層の圏に、テンソル積をコエンドで延長した**デイ畳み込み** $F\circledast G$ を入れ、$\widehat{\mathbf{C}}$ がモノイダル閉圏になり、米田埋め込みが強モノイダル関手になることを示す。デイ畳み込みのモノイドは緩いモノイダル関手で、有限集合の全単射の圏の上では「種」（記号列）の積になり、オペラッド（\ref{cat:page-operads}）の準備になる。

> 資料によらず、標準的な議論で書いた（デイ畳み込みは B. Day, 1970）。

## 記法と定義の確認 {#cat:sec-eny-notation}

::: notation
- 豊穣圏・豊穣関手・台の圏は \ref{cat:closed-category}, \ref{cat:enriched-functor}, \ref{cat:underlying-category}。$\mathbf{V}$ は対称モノイダル閉圏（\ref{cat:symmetric-monoidal}, \ref{cat:closed-category}）、内部 hom $[x,y]$、評価射・転置は \ref{cat:page-symmetric-monoidal-closed} の記法。$\mathbf{V}$ は自分自身の上の豊穣圏（\ref{cat:self-enrichment}）。
- 小さい $\mathbf{V}$ 圏 $\mathbf{A}$ と $\mathbf{V}$ 関手 $F:\mathbf{A}\to\mathbf{V}$ について、$F_{a,b}:\mathbf{A}(a,b)\to[Fa,Fb]$ の転置（と対称性）を**作用** $\rho_{a,b}:\mathbf{A}(a,b)\otimes Fa\to Fb$ と書く。
- エンド・コエンド、自然変換のエンド表示、米田・余米田の補題（エンド形）、パラメータつきエンドは \ref{cat:wedge}, \ref{cat:end}, \ref{cat:nat-as-end}, \ref{cat:yoneda-end}, \ref{cat:co-yoneda}, \ref{cat:end-parameter}。$\mathbf{Set}$ は完備・余完備（\ref{cat:set-complete}）で、前層の極限・余極限は各点ごと（\ref{cat:pointwise-limits}）。
- **選択公理**：使わない。
:::

## 豊穣米田の補題 {#cat:sec-eny-yoneda}

::: definition 自然変換の対象 {#cat:enriched-nat-object keywords="object of V-natural transformations [A,V](F,G) as an equalizer" index="自然変換の対象|しぜんへんかんのたいしょう"}
$\mathbf{V}$ が小さい積と等化子をもつ（完備）とする。小さい $\mathbf{V}$ 圏 $\mathbf{A}$ と $\mathbf{V}$ 関手 $F,G:\mathbf{A}\to\mathbf{V}$ について、$[\mathbf{A},\mathbf{V}](F,G)$ を、二つの射
$$
\prod_{a}[Fa,Ga]\rightrightarrows\prod_{a,b}[\mathbf{A}(a,b)\otimes Fa,\,Gb]
$$
の等化子とする。一方の射の $(a,b)$ 成分は、$[Fb,Gb]$ への射影のあとに $\rho^{F}_{a,b}$ との前合成 $[Fb,Gb]\to[\mathbf{A}(a,b)\otimes Fa,Gb]$ を施したもの、他方は、$[Fa,Ga]$ への射影のあとに $1\otimes-$ と $\rho^{G}_{a,b}$ との後合成 $[Fa,Ga]\to[\mathbf{A}(a,b)\otimes Fa,\mathbf{A}(a,b)\otimes Ga]\to[\mathbf{A}(a,b)\otimes Fa,Gb]$ を施したもの（どちらも内部 hom の関手性による）。
:::

::: lemma 一般化された元による言い換え {#cat:enriched-nat-elements keywords="maps x -> [A,V](F,G) are V-natural families x tensor Fa -> Ga" index="豊穣自然変換の族|ほうじょうしぜんへんかんのぞく"}
$x\in\mathbf{V}$ について、$\mathbf{V}(x,[\mathbf{A},\mathbf{V}](F,G))$ は、射の族 $\theta_{a}:x\otimes Fa\to Ga$ で、すべての $a,b$ について
$$
\rho^{G}_{a,b}\circ(1\otimes\theta_{a})=\theta_{b}\circ(1\otimes\rho^{F}_{a,b})\circ\sigma
$$
（両辺は $\mathbf{A}(a,b)\otimes x\otimes Fa\to Gb$。$\sigma$ は $\mathbf{A}(a,b)$ と $x$ の入れ替え）をみたすものと自然に一対一。$x=I$ のとき、これは $\mathbf{V}$ 自然変換 $F\Rightarrow G$（\ref{cat:enriched-functor}）と同じもの。したがって $\mathbf{V}(I,[\mathbf{A},\mathbf{V}](F,G))$ は $\mathbf{V}$ 自然変換の集合。
:::

::: proof
**Step 1.** 等化子・積の普遍性と転置 $\mathbf{V}(x,[y,z])\cong\mathbf{V}(x\otimes y,z)$ により、$x\to\prod_{a}[Fa,Ga]$ は族 $\theta_{a}:x\otimes Fa\to Ga$ と、それが二つの射を等化することは、成分ごとに転置した上の等式と同じ。

**Step 2（$x=I$）.** $\theta_{a}:I\otimes Fa\to Ga$ は $\lambda$ により $Fa\to Ga$、さらに転置で $I\to[Fa,Ga]$（自己豊穣化での成分）と同じで、等式は \ref{cat:enriched-functor} の自然性の等式を転置したもの。
:::

::: theorem 豊穣米田の補題 {#cat:enriched-yoneda keywords="enriched Yoneda lemma: [A,V](A(a,-),F) is isomorphic to Fa in V" index="豊穣米田の補題|ほうじょうよねだのほだい"}
$\mathbf{V}$ を完備な対称モノイダル閉圏、$\mathbf{A}$ を小さい $\mathbf{V}$ 圏、$F:\mathbf{A}\to\mathbf{V}$ を $\mathbf{V}$ 関手とする。$\mathbf{A}(a,-):\mathbf{A}\to\mathbf{V}$（作用は合成 $M$）について、$\mathbf{V}$ の同型
$$
[\mathbf{A},\mathbf{V}](\mathbf{A}(a,-),F)\cong Fa
$$
がある。$x=I$ に制限すると、$\mathbf{V}$ 自然変換 $\mathbf{A}(a,-)\Rightarrow F$ と $\mathbf{V}(I,Fa)$ の一対一対応（通常の米田の補題の豊穣版）。
:::

::: proof
\ref{cat:enriched-nat-elements} により、各 $x$ について、$\mathbf{V}(x,Fa)$ と「両立する族 $\theta_{b}:x\otimes\mathbf{A}(a,b)\to Fb$」の集合の、$x$ について自然な全単射を作ればよい（通常の米田の補題（\ref{cat:yoneda-lemma}）を $\mathbf{V}$ に使って同型を得る）。

**Step 1（$u\mapsto\theta$）.** $u:x\to Fa$ に $\theta_{b}\defeq\rho^{F}_{a,b}\circ\sigma\circ(u\otimes1):x\otimes\mathbf{A}(a,b)\to Fb$ を対応させる。両立性は $F$ の関手性（$\rho^{F}$ が合成 $M$ と両立する：$\rho_{b,c}(1\otimes\rho_{a,b})=\rho_{a,c}(M\otimes1)$）から。

**Step 2（$\theta\mapsto u$）.** 両立する族に $u\defeq\theta_{a}\circ(1\otimes j_{a})\circ\varrho_{x}^{-1}:x\to Fa$ を対応させる。

**Step 3（互いに逆）.** Step 1 の $\theta$ から Step 2 で戻すと $\rho_{a,a}\sigma(u\otimes j_{a})\varrho^{-1}=\rho_{a,a}(j_{a}\otimes1)\lambda^{-1}u=u$（$F$ が単位を保つので $\rho_{a,a}(j_{a}\otimes1)=\lambda$）。逆に、両立する $\theta$ から $u$ を作り Step 1 の族を作ると、両立性の等式（$\mathbf{A}(a,-)$ の作用は $M$）を $j_{a}$ と合成して
$$
\rho_{a,b}\circ\sigma\circ(u\otimes1)=\theta_{b}\circ(1\otimes M)\circ(1\otimes1\otimes j_{a})=\theta_{b}
$$
（$M(1\otimes j_{a})=\varrho$、構造射の省略はコヒーレンスによる）。$x$ についての自然性は定義の式から。
:::

::: remark 関手 $\mathbf{V}$ 圏
$[\mathbf{A},\mathbf{V}](F,G)$ を hom 対象として、$\mathbf{V}$ 関手 $\mathbf{A}\to\mathbf{V}$ の全体は $\mathbf{V}$ 圏 $[\mathbf{A},\mathbf{V}]$ になる（合成は内部合成の積から誘導される）。その台の圏は $\mathbf{V}$ 関手と $\mathbf{V}$ 自然変換の圏（\ref{cat:enriched-nat-elements} の $x=I$）。$\mathbf{A}^{\mathrm{op}}$ 上で考えると、米田埋め込み $\mathbf{A}\to[\mathbf{A}^{\mathrm{op}},\mathbf{V}]$ は $\mathbf{V}$ 充満忠実（hom 対象の同型）である。いずれも上の定理と同じ計算で示される。
:::

## デイ畳み込み {#cat:sec-eny-day}

以下、$\mathbf{V}=\mathbf{Set}$ とし、$(\mathbf{C},\otimes,I)$ を小さいモノイダル圏、$\widehat{\mathbf{C}}=[\mathbf{C}^{\mathrm{op}},\mathbf{Set}]$ とする。

::: definition デイ畳み込み {#cat:day-convolution keywords="Day convolution of presheaves on a monoidal category as a coend" index="デイ畳み込み|でいたたみこみ"}
前層 $F,G$ について
$$
(F\circledast G)(c)\defeq\int^{a,b}\mathbf{C}(c,a\otimes b)\times Fa\times Gb
$$
とおく（$(a,b)\in\mathbf{C}\times\mathbf{C}$ についてのコエンド。$\mathbf{Set}$ で存在する）。$c$ について関手的で、$F,G$ について関手的。単位を $\mathbf{y}I=\mathbf{C}(-,I)$ とする。
:::

::: lemma 双射による普遍性 {#cat:day-universal keywords="maps out of a Day convolution are natural families Fa x Gb -> H(a tensor b)" index="デイ畳み込みの普遍性|でいたたみこみのふへんせい"}
前層 $F,G,H$ について、自然な全単射
$$
\widehat{\mathbf{C}}(F\circledast G,H)\cong\bigl\{\theta_{a,b}:Fa\times Gb\to H(a\otimes b)\ \text{（}a,b\text{ について自然）}\bigr\}
$$
がある。同様に $n$ 個の前層について、繰り返しのデイ畳み込みからの射は $Fa_{1}\times\cdots\times Fa_{n}\to H(\text{括弧のついた }a_{1}\otimes\cdots\otimes a_{n})$ の自然な族と一対一。
:::

::: proof
**Step 1.** 前層の余極限は各点ごとで、コエンドは余極限（\ref{cat:end-as-limit} の双対）なので、$\widehat{\mathbf{C}}(\int^{a,b}P_{a,b},H)\cong\int_{a,b}\widehat{\mathbf{C}}(P_{a,b},H)$（余極限からの hom は hom の極限）。ここで $P_{a,b}\defeq\mathbf{y}(a\otimes b)\times Fa\times Gb$（$Fa\times Gb$ は定数の集合）。

**Step 2.** 定数の集合 $X$ について $\widehat{\mathbf{C}}(\mathbf{y}d\times X,H)\cong\mathbf{Set}(X,\widehat{\mathbf{C}}(\mathbf{y}d,H))\cong\mathbf{Set}(X,Hd)$（$\mathbf{y}d\times X=\coprod_{X}\mathbf{y}d$ と米田の補題）。よって右辺は $\int_{a,b}\mathbf{Set}(Fa\times Gb,H(a\otimes b))$ で、これは自然な族の集合（\ref{cat:nat-as-end}）。

**Step 3（繰り返し）.** $(F\circledast G)\circledast K$ からの射は、まず $\theta_{d,c}:(F\circledast G)(d)\times Kc\to H(d\otimes c)$ の自然な族で、$c$ と $Kc$ の元を固定して $d$ について Step 1・2 を繰り返す（積 $-\times Kc$ は余極限と交換する：$\mathbf{Set}$ はデカルト閉）と、$Fa\times Gb\times Kc\to H((a\otimes b)\otimes c)$ の自然な族と一対一。
:::

::: theorem デイ畳み込みはモノイダル閉構造 {#cat:day-monoidal-closed keywords="Day convolution makes presheaves on a small monoidal category a monoidal closed category; the Yoneda embedding is strong monoidal; symmetric if C is" index="デイ畳み込みのモノイダル構造|でいたたみこみのものいだるこうぞう"}
1. $(\widehat{\mathbf{C}},\circledast,\mathbf{y}I)$ はモノイダル圏で、$\mathbf{C}$ が対称（組紐）なら対称（組紐）モノイダル圏。
2. $\mathbf{y}a\circledast\mathbf{y}b\cong\mathbf{y}(a\otimes b)$ で、米田埋め込み $\mathbf{y}:\mathbf{C}\to\widehat{\mathbf{C}}$ は強モノイダル関手。
3. $[G,H](a)\defeq\int_{b}\mathbf{Set}(Gb,H(a\otimes b))$ とおくと $\widehat{\mathbf{C}}(F\circledast G,H)\cong\widehat{\mathbf{C}}(F,[G,H])$。同様に左の内部 hom もあり、$\widehat{\mathbf{C}}$ は（左右の）閉モノイダル圏。
:::

::: proof
**Step 1（結合子）.** \ref{cat:day-universal} の Step 3 から、$\widehat{\mathbf{C}}((F\circledast G)\circledast K,H)$ と $\widehat{\mathbf{C}}(F\circledast(G\circledast K),H)$ は、それぞれ $Fa\times Gb\times Kc\to H((a\otimes b)\otimes c)$、$\to H(a\otimes(b\otimes c))$ の自然な族の集合と一対一。$H(\alpha_{a,b,c})$（$H$ は反変なので $H(a\otimes(b\otimes c))\to H((a\otimes b)\otimes c)$）との合成はこの二つの間の全単射で、$H$ について自然。米田の補題から同型 $\alpha^{\circledast}:(F\circledast G)\circledast K\cong F\circledast(G\circledast K)$ を得る。

**Step 2（単位子）.** $\widehat{\mathbf{C}}(\mathbf{y}I\circledast F,H)$ は $\mathbf{C}(a,I)\times Fb\to H(a\otimes b)$ の自然な族で、$a$ について米田の補題を使うと $Fb\to H(I\otimes b)$ の自然な族、$H(\lambda_{b}^{-1})$ との合成で $\widehat{\mathbf{C}}(F,H)$。米田の補題から $\lambda^{\circledast}:\mathbf{y}I\circledast F\cong F$。$\varrho^{\circledast}$ も同様。

**Step 3（五角形と三角形）.** 五角形の二つの経路は、$\widehat{\mathbf{C}}(-,H)$ で見ると、4 つの前層からの族の集合の間の全単射で、それぞれ $\mathbf{C}$ の五角形の二つの経路の $H$ による像との合成である。$\mathbf{C}$ の五角形は可換なので一致し、米田の補題から $\widehat{\mathbf{C}}$ の五角形も可換。三角形も同様。対称（組紐）の場合、$\gamma^{\circledast}$ を $H(\gamma_{a,b})$ との合成と入れ替え $Fa\times Gb\cong Gb\times Fa$ で定め、六角形も同じ論法。

**Step 4（2）.** $\widehat{\mathbf{C}}(\mathbf{y}a\circledast\mathbf{y}b,H)$ は $\mathbf{C}(a',a)\times\mathbf{C}(b',b)\to H(a'\otimes b')$ の自然な族で、米田の補題を 2 回使って $H(a\otimes b)\cong\widehat{\mathbf{C}}(\mathbf{y}(a\otimes b),H)$。よって $\mathbf{y}a\circledast\mathbf{y}b\cong\mathbf{y}(a\otimes b)$。この同型と $\mathbf{y}I$ の恒等射がモノイダル関手の公理をみたすことは、Step 1・2 の同型の定義（$H(\alpha)$, $H(\lambda)$ との合成）を $\mathbf{y}$ の像で比べればよい。

**Step 5（3）.** \ref{cat:day-universal} から $\widehat{\mathbf{C}}(F\circledast G,H)$ は $Fa\to\mathbf{Set}(Gb,H(a\otimes b))$（$a,b$ について自然）の族、すなわち $a$ について自然な $Fa\to\int_{b}\mathbf{Set}(Gb,H(a\otimes b))=[G,H](a)$ と一対一（エンドの普遍性とパラメータつきエンド \ref{cat:end-parameter}）。
:::

::: proposition デイ畳み込みのモノイド {#cat:day-monoids keywords="monoids for Day convolution are lax monoidal functors C^op -> Set" index="デイ畳み込みのモノイド|でいたたみこみのものいど"}
$(\widehat{\mathbf{C}},\circledast,\mathbf{y}I)$ のモノイド（\ref{cat:monoid-object}）は、緩いモノイダル関手 $(F,F_{2},F_{0}):(\mathbf{C}^{\mathrm{op}},\otimes,I)\to(\mathbf{Set},\times,1)$ と同じもの。
:::

::: proof
\ref{cat:day-universal} から、積 $\mu:F\circledast F\to F$ は自然な族 $F_{2}:Fa\times Fb\to F(a\otimes b)$、単位 $\eta:\mathbf{y}I\to F$ は元 $F_{0}\in F(I)$（米田の補題）、すなわち $F_{0}:1\to F(I)$ と一対一。モノイドの結合律は、$F\circledast F\circledast F$ からの二つの射が一致することで、\ref{cat:day-universal} の Step 3 で $Fa\times Fb\times Fc\to F((a\otimes b)\otimes c)$ の二つの族の一致、すなわち \ref{cat:monoidal-functor} の第一式（$\alpha$ との両立）に翻訳される。単位律も同様に第二・第三式になる。
:::

::: example デイ畳み込みの例 {#cat:day-examples}
1. **次数付き集合**：$\mathbf{C}=\mathbb{N}$（離散なモノイダル圏、$\otimes=+$）なら、前層は次数付き集合 $(F_{n})_{n}$ で、$(F\circledast G)_{n}=\coprod_{a+b=n}F_{a}\times G_{b}$。モノイドは次数付きモノイド。
2. **種（記号列）**：$\mathbf{C}=\Sigma$（有限集合 $\{1,\dots,n\}$ と全単射のなす圏、$\otimes$ は非交和、対称）なら、前層は**種**（各 $n$ に対称群 $\Sigma_{n}$ の右作用をもつ集合 $F(n)$）で、デイ畳み込みは
$$
(F\circledast G)(n)\cong\coprod_{p+q=n}\Sigma_{n}\times_{\Sigma_{p}\times\Sigma_{q}}(F(p)\times G(q))
$$
（**コーシー積**。$n$ 元集合を二つに分けて、それぞれに $F$, $G$ の構造を載せる）。オペラッドはこの上の別のモノイダル構造（合成積）のモノイドとして定義される（\ref{cat:page-operads}）。
3. **$\mathbf{V}$ 値のデイ畳み込み**：$\mathbf{V}$ が余完備な対称モノイダル閉圏なら、同じ式（$\times$ を $\otimes$、コエンドを $\mathbf{V}$ でとる）で $[\mathbf{C}^{\mathrm{op}},\mathbf{V}]$ にデイ畳み込みが入る。$\mathbf{V}=\mathbf{Ab}$, $\mathbf{C}=\mathbb{Z}$ なら次数付きアーベル群のテンソル積 $(A\otimes B)_{n}=\bigoplus_{p+q=n}A_{p}\otimes B_{q}$ になる。証明は上と同じ（本ページでは $\mathbf{Set}$ の場合だけ書いた）。
:::

::: hypcheck
- **選択公理**：使わない。コエンド・エンドは $\mathbf{Set}$ の具体的な構成（商集合・部分集合）で存在する。
- $\mathbf{C}$ が**小さい**ことは、コエンドが集合で存在すること（$\mathbf{Set}$ の小さい余極限）に使った。
- **$\mathbf{V}$ の完備性**：豊穣米田の補題で $[\mathbf{A},\mathbf{V}](F,G)$ を等化子として定義するのに使った（$\mathbf{A}$ は小さいので小さい積で足りる）。**対称性**：作用 $\rho$ の向きの入れ替え $\sigma$ に使った。
- デイ畳み込みの証明では、モノイダル圏の公理（五角形・三角形）を $\mathbf{C}$ で使い、それを米田の補題で $\widehat{\mathbf{C}}$ に移した。$\widehat{\mathbf{C}}$ のコヒーレンスを直接図式で確かめる必要はない。
:::

::: supplement
**普遍性.** デイ畳み込みは、$\mathbf{y}$ を強モノイダルにし、かつ $\circledast$ が各変数で余極限を保つような、$\widehat{\mathbf{C}}$ 上の唯一のモノイダル構造である（余極限を保つ関手は表現可能関手での値で決まる：\ref{cat:presheaf-colimit-representables}）。この性質から、余完備なモノイダル圏 $\mathbf{M}$（$\otimes$ が各変数で余極限を保つ）への強モノイダル関手 $\mathbf{C}\to\mathbf{M}$ は、余極限を保つ強モノイダル関手 $\widehat{\mathbf{C}}\to\mathbf{M}$ に一意に延びる（左カン拡張。\ref{cat:page-pointwise-kan}）ことが知られている（本サイト未収録）。

**計算の観点.** 次数付きの例 1・2 で、各次数が有限集合なら、$F\circledast G$ の各次数の大きさは $\lvert F_{a}\rvert\lvert G_{b}\rvert$ の畳み込み和（例 2 では二項係数 $\binom{n}{p}$ が掛かる）で、生成関数の積（例 2 では指数型生成関数の積）として計算できる。次数 $n$ までの計算は $O(n^{2})$ 回の整数演算。
:::

## 高い視点 {#cat:sec-eny-viewpoint}

::: remark 「関数の畳み込み」の圏化
群 $G$ 上の関数 $f,g$ の畳み込み $(f*g)(c)=\sum_{ab=c}f(a)g(b)$ は、デイ畳み込みの式で、和をコエンドに、$a\otimes b=c$ を射 $c\to a\otimes b$ の集合に、数の積を集合の直積に置き換えたものである。比喩で言えば、デイ畳み込みは「モノイダル圏の掛け算の表を、前層という『重み付きの対象の分布』に線形に（余極限を保つように）延長する」操作で、米田埋め込みは「点への集中した分布（デルタ関数）」に当たる。デルタ関数どうしの畳み込みが積の点のデルタ関数になること（$\delta_{a}*\delta_{b}=\delta_{ab}$）が、$\mathbf{y}a\circledast\mathbf{y}b\cong\mathbf{y}(a\otimes b)$ である。
:::

## 問題 {#cat:sec-eny-problems}

::: problem {#cat:prob-eny-discrete-monoid}
モノイド $M$ を離散なモノイダル圏とみる（対象は $M$ の元、射は恒等射のみ、$\otimes$ は積）。$M$ 上の前層は $M$ で添字づけられた集合の族 $(F_{m})_{m}$ であることを確かめ、$(F\circledast G)_{m}=\coprod_{ab=m}F_{a}\times G_{b}$ を示せ。また、各 $F_{m}$ が 1 点か空集合である前層（$M$ の部分集合と同じ）について、デイ畳み込みは部分集合の積 $AB=\{ab\}$ に対応することを示せ。
:::

::: solution
射が恒等射だけなので、前層は対象ごとの集合の族。コエンドの中の $\mathbf{C}(c,a\otimes b)$ は $c=ab$ のとき 1 点、それ以外は空で、離散な圏のコエンドは余積（くさびの条件が恒等射についてだけで自明）なので $(F\circledast G)_{m}=\coprod_{(a,b):ab=m}F_{a}\times G_{b}$。$F=\chi_{A}$, $G=\chi_{B}$（$A,B\subset M$ の特性族）なら $(F\circledast G)_{m}$ は $\{(a,b)\in A\times B : ab=m\}$ で、空でないことと $m\in AB$ は同値。すなわち「空か空でないか」だけを見ると部分集合の積。デイ畳み込みは $m$ の表し方の個数まで記録する精密化である。
:::
