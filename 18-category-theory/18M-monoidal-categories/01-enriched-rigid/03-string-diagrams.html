# ストリング図式 {#cat:page-string-diagrams keywords="string diagrams, graphical calculus for monoidal categories, layers, interchange law, planar isotopy, Joyal-Street, End(I) is commutative, cups and caps, zigzag identities, crossings and Reidemeister moves"}

モノイダル圏の射の合成とテンソル積は、平面上の図式で表せる：対象を縦の線（ストリング）、射を箱、合成を縦の積み重ね、テンソル積を横の並置とする。図式の値（射）が「箱を上下にずらしても変わらない」ことが**交換法則**で、ジョイアル–ストリートの定理によれば、平面の変形（アイソトピー）で移りあう図式は同じ射を表す。本ページでは、図式を「層」の列として厳密に定義し、交換による不変性を証明する。応用として、単位対象の自己準同型のモノイド $\operatorname{End}(I)$ が可換であることを図式で示す。双対の「カップとキャップ」、組紐の「交差」とライデマイスター移動も導入する。

> 資料によらず、標準的な議論で書いた。図は文章で記述する（左から右がテンソル積、下から上が合成の順）。

## 記法と定義の確認 {#cat:sec-str-notation}

::: notation
- モノイダル圏・コヒーレンス定理・厳密化定理は \ref{cat:monoidal-category}, \ref{cat:coherence}, \ref{cat:strictification}。厳密化定理により、すべてのモノイダル圏は厳密なモノイダル圏と（強モノイダル関手で）圏同値なので、以下 $(\mathbf{M},\otimes,I)$ は**厳密**（$\alpha,\lambda,\varrho$ は恒等射）とする。
- 組紐モノイダル圏・ヤン–バクスター方程式は \ref{cat:braided-monoidal}, \ref{cat:yang-baxter}。双対対象・ジグザグ等式は \ref{cat:dual-object}（そこでは対称モノイダル圏で定義したが、定義は対称性を使わないので一般のモノイダル圏でもそのまま使う）。そこでの $\varepsilon$, $\eta$ をここでは評価 $\mathrm{ev}$、余評価 $\mathrm{coev}$ と書く。
- テンソル積の関手性：$(g\otimes g')(f\otimes f')=gf\otimes g'f'$、$1\otimes1=1$。
- **選択公理**：使わない。
:::

## 層と図式 {#cat:sec-str-layers}

::: definition 層と図式 {#cat:string-diagram keywords="layer (slice) of a diagram, string diagram as a sequence of layers, value of a diagram" index="ストリング図式|すとりんぐずしき, 層（図式の）|そうずしきの"}
1. **層**とは、対象の列 $u=(u_{1},\dots,u_{p})$, $v=(v_{1},\dots,v_{q})$ と射 $f:x\to y$ の組 $(u,f,v)$ のことで、その値を $1_{u}\otimes f\otimes1_{v}:u\otimes x\otimes v\to u\otimes y\otimes v$ とする（$u=u_{1}\otimes\cdots\otimes u_{p}$）。図では、左に $p$ 本、右に $q$ 本の縦線を引き、中央に箱 $f$ を置いた横の帯である。$x,y$ も対象の列で、箱の下に入る線と上から出る線が対応する。
2. **図式** $D$ とは、層の列 $L_{1},\dots,L_{n}$ で、各 $L_{k}$ の上端の列が $L_{k+1}$ の下端の列と等しいものをいう（下から順に積み重ねる）。$D$ の**値**を $\llbracket D\rrbracket\defeq\llbracket L_{n}\rrbracket\circ\cdots\circ\llbracket L_{1}\rrbracket$ とする（$n=0$ なら恒等射）。
:::

::: lemma すべての射は図式で表される {#cat:string-diagram-generate keywords="every composite of tensor products and composites is the value of a layered diagram" index="図式による表示|ずしきによるひょうじ"}
射 $f_{1},\dots,f_{m}$ から $\circ$ と $\otimes$ を有限回使って作った射は、各 $f_{i}$ をちょうど一つの層の箱とする図式の値である。
:::

::: proof
構成についての帰納法。$f$ 自身は 1 層の図式。$g\circ f$ は図式の連結。$f\otimes g$（$f:x\to y$ が図式 $D$, $g:x'\to y'$ が図式 $E$ の値）は、$D$ の各層の右に $x'$ の線を加えたもの（$D\otimes1_{x'}$）を下に、$E$ の各層の左に $y$ の線を加えたもの（$1_{y}\otimes E$）を上に積んだ図式の値：$(1_{y}\otimes g)(f\otimes1_{x'})=f\otimes g$（関手性）。層に線を加えても層である。
:::

## 交換による不変性 {#cat:sec-str-interchange}

::: definition 交換移動 {#cat:interchange-move keywords="interchange move: sliding two boxes in adjacent layers past each other when they are side by side" index="交換移動|こうかんいどう"}
図式の隣り合う二つの層 $L=(u,f,w\otimes y'\otimes v)$, $L'=(u\otimes y\otimes w,g,v)$（箱 $f:x\to y$ が下の層で左側、箱 $g:x'\to y'$ が上の層で右側、その間に線 $w$）を、$(u\otimes x\otimes w,g,v)$ と $(u,f,w\otimes y'\otimes v)$ の順に入れ替える（$g$ を先に、$f$ を後に）操作と、その逆を**交換移動**という。図では、左右に離れた二つの箱の高さの順序を入れ替えることにあたる。
:::

::: theorem 交換法則 {#cat:interchange-invariance keywords="the value of a string diagram is invariant under interchange moves" index="交換法則（図式）|こうかんほうそくずしき"}
交換移動で移りあう図式の値は等しい。
:::

::: proof
入れ替える二つの層の合成だけを比べればよい（他の層は共通）。
$$
\begin{aligned}
&(1_{u\otimes y\otimes w}\otimes g\otimes1_{v})\circ(1_{u}\otimes f\otimes1_{w\otimes x'\otimes v})\\
&\quad=1_{u}\otimes(1_{y}\circ f)\otimes(1_{w}\circ1_{w})\otimes(g\circ1_{x'})\otimes1_{v}=1_{u}\otimes f\otimes1_{w}\otimes g\otimes1_{v},
\end{aligned}
$$
$$
\begin{aligned}
&(1_{u}\otimes f\otimes1_{w\otimes y'\otimes v})\circ(1_{u\otimes x\otimes w}\otimes g\otimes1_{v})\\
&\quad=1_{u}\otimes(f\circ1_{x})\otimes1_{w}\otimes(1_{y'}\circ g)\otimes1_{v}=1_{u}\otimes f\otimes1_{w}\otimes g\otimes1_{v}.
\end{aligned}
$$
どちらもテンソル積の関手性 $(a\otimes b)\circ(c\otimes d)=ac\otimes bd$ を、5 個の成分のテンソル積に（厳密性により括弧を無視して）使った。
:::

::: remark ジョイアル–ストリートの定理（本サイト未収録）
「進行的な」平面図式（すべての線が下から上へ単調に進み、箱が高さの異なる位置にある図式）を平面のアイソトピー（箱の高さの順序と横の位置を連続に動かす変形で、線が交わらず進行性を保つもの）で動かしても値は変わらない。さらに、自由モノイダル圏の射は、図式のアイソトピー類と一対一に対応する（A. Joyal–R. Street, *The geometry of tensor calculus I*, 1991）。上の定理は、その組合せ的な核心（二つの箱の高さの順序の入れ替え）である。アイソトピーは、箱の高さの入れ替え（交換移動）と、層の中での線の位置の連続な移動（値を変えない）に分解されることが知られている。
:::

## 応用：単位対象の自己準同型 {#cat:sec-str-endI}

::: theorem 単位の自己準同型は可換 {#cat:end-unit-commutative keywords="End(I) of a monoidal category is a commutative monoid (Kelly-Laplaza); s tensor t = s t" index="単位対象の自己準同型|たんいたいしょうのじこじゅんどうけい"}
モノイダル圏 $\mathbf{M}$ について、モノイド $\operatorname{End}(I)$（合成）は可換。厳密なら、$s,t\in\operatorname{End}(I)$ について $st=s\otimes t=ts$。
:::

::: proof
厳密化定理により、厳密な場合に示せば十分（強モノイダルな圏同値は $\operatorname{End}(I)$ のモノイドの同型を誘導する）。$I\otimes I=I$, $1_{I}\otimes1_{I}=1_{I}$ で、$s,t:I\to I$ について関手性から
$$
s\circ t=(s\otimes1_{I})\circ(1_{I}\otimes t)=s\otimes t=(1_{I}\otimes t)\circ(s\otimes1_{I})=t\circ s.
$$
図式では、単位対象は線を描かない（見えない線）ので、$s$ と $t$ は何もない平面に置かれた二つの箱で、交換移動（\ref{cat:interchange-invariance}、$u=v=w=()$）で高さの順序を自由に入れ替えられる。
:::

::: remark エックマン–ヒルトンとの関係
上の証明は、$\operatorname{End}(I)$ 上の二つの演算 $\circ$ と $\otimes$ が交換法則 $(a\otimes b)\circ(c\otimes d)=(a\circ c)\otimes(b\circ d)$ をみたし、同じ単位 $1_{I}$ をもつことだけを使っている。これはエックマン–ヒルトンの議論（\ref[エックマン–ヒルトンの議論]{cat:page-eckmann-hilton}）の特別な場合で、高次ホモトピー群の可換性と同じ理由である。
:::

## 双対と組紐の図式 {#cat:sec-str-dual-braid}

::: definition カップとキャップ {#cat:cups-caps keywords="cup and cap for a dual pair, zigzag (snake) identities as straightening a string" index="カップとキャップ|かっぷときゃっぷ, ジグザグ等式|じぐざぐとうしき"}
双対対象の組 $(a,a^{*})$（\ref{cat:dual-object}）の評価 $\mathrm{ev}:a^{*}\otimes a\to I$ を、$a^{*}$ と $a$ の線が下から入って上で閉じる**キャップ**（$\cap$）、余評価 $\mathrm{coev}:I\to a\otimes a^{*}$ を下で開く**カップ**（$\cup$）で描く。$a^{*}$ の線は向きを逆にした $a$ の線とみなす。ジグザグ等式
$$
(1_{a}\otimes\mathrm{ev})\circ(\mathrm{coev}\otimes1_{a})=1_{a},\qquad(\mathrm{ev}\otimes1_{a^{*}})\circ(1_{a^{*}}\otimes\mathrm{coev})=1_{a^{*}}
$$
は、S 字に曲がった線をまっすぐに伸ばしてよいことを表す。
:::

::: proposition 双対の図式計算の例 {#cat:dual-diagram-example keywords="transpose of a morphism via cups and caps; (gf)^* = f^* g^*" index="転置（双対）|てんちそうつい"}
$(a,a^{*})$, $(b,b^{*})$ を双対の組、$f:a\to b$ とし、**転置** $f^{*}:b^{*}\to a^{*}$ を
$$
f^{*}\defeq(\mathrm{ev}_{b}\otimes1_{a^{*}})\circ(1_{b^{*}}\otimes f\otimes1_{a^{*}})\circ(1_{b^{*}}\otimes\mathrm{coev}_{a})
$$
と定める（箱 $f$ を挟んでカップとキャップでつなぐ）。このとき $(1_{a})^{*}=1_{a^{*}}$, $(g\circ f)^{*}=f^{*}\circ g^{*}$（$g:b\to c$）。
:::

::: proof
**Step 1.** $(1_{a})^{*}$ は第 2 のジグザグ等式の左辺そのもので $1_{a^{*}}$。

**Step 2.** $f^{*}g^{*}$ は、箱 $g$ をカップ・キャップで挟んだ図式の上に、箱 $f$ を挟んだ図式を積んだもの。中央に現れる $b$ の線の S 字（$\mathrm{coev}_{b}$ のすぐあとに $\mathrm{ev}_{b}$）を、交換移動で箱 $f$, $g$ を S 字の外に動かしてから第 1 のジグザグ等式でまっすぐにすると、箱 $g\circ f$ を挟んだ図式、すなわち $(gf)^{*}$ になる。式で書けば、交換法則（\ref{cat:interchange-invariance}）でカップ・キャップと箱の層の順序を入れ替え、$(1_{b}\otimes\mathrm{ev}_{b})(\mathrm{coev}_{b}\otimes1_{b})=1_{b}$ を使う計算である。
:::

::: definition 交差とライデマイスター移動 {#cat:crossings-reidemeister keywords="crossings for a braiding, Reidemeister moves II and III correspond to invertibility and the Yang-Baxter equation" index="交差（組紐の図式）|こうさくみひものずしき, ライデマイスター移動|らいでまいすたーいどう"}
組紐モノイダル圏で、組紐 $\gamma_{a,b}:a\otimes b\to b\otimes a$ を、$a$ の線が $b$ の線の上を左下から右上へ越える**交差**で、$\gamma^{-1}_{a,b}$ を下を越える交差で描く。
1. （第 II 移動）上の交差と下の交差を続けると打ち消す：$\gamma^{-1}_{a,b}\gamma_{a,b}=1$。
2. （第 III 移動）三本の線の交差の順序の入れ替え：$(\gamma_{b,c}\otimes1)(1\otimes\gamma_{a,c})(\gamma_{a,b}\otimes1)=(1\otimes\gamma_{a,b})(\gamma_{a,c}\otimes1)(1\otimes\gamma_{b,c})$（ヤン–バクスター方程式、\ref{cat:yang-baxter}）。
3. （箱の通り抜け）組紐の自然性 $\gamma_{b,c}(f\otimes1_{c})=(1_{c}\otimes f)\gamma_{a,c}$（$f:a\to b$）は、箱を交差の向こう側へすべらせてよいことを表す。

対称の場合は上下の交差を区別しない（$\gamma^{-1}=\gamma$）。第 I 移動（ねじれをほどく）は一般には成り立たず、リボン圏のねじれ（\ref{cat:page-ribbon-tangles}）が補正する。
:::

::: hypcheck
- **選択公理**：使わない。
- **厳密性**：層の値の定義と交換法則の計算で、括弧と単位子を無視するために使った。一般のモノイダル圏では、厳密化定理（\ref{cat:strictification}）またはコヒーレンス定理（構造射を挿入した値はコヒーレンスにより一意）で厳密な場合に帰着する。
- 交換法則はテンソル積の**関手性**だけから従う。\ref{cat:end-unit-commutative} は $I\otimes I=I$ と単位の両側の単位律にも依存する。
:::

::: supplement
**前提を変えると.**
- 組紐モノイダル圏では、図式は 3 次元（平面と奥行き）の組紐の図式になり、値は 3 次元空間の（端点を固定した）アイソトピーで不変になる。対称モノイダル圏では 4 次元以上で、交差の上下が区別できなくなる。この次元の上昇はオペラッド $E_{1}\subset E_{2}\subset E_{3}$（\ref[小円板オペラッドと Eₙ]{cat:page-little-disks}）の次元の上昇と対応する。
- 剛性モノイダル圏ではカップとキャップが加わり、リボン圏ではリボン（帯）の図式になり、値はフレーム付きタングルのアイソトピー不変量になる（\ref{cat:page-ribbon-tangles}）。

**計算の観点.** 図式の値は、層の値（各層は箱の値と恒等射のテンソル積）を下から順に合成すれば計算でき、合成の回数は層の数である。$\mathbf{M}$ が有限次元ベクトル空間の圏なら、各層は行列のクロネッカー積で、計算量は線の本数について指数的に増える（$n$ 本の線は次元の $n$ 乗の空間）。
:::

## 高い視点 {#cat:sec-str-viewpoint}

::: remark 次元が上がると可換になる
モノイダル圏の構造は「1 次元の線の上に箱を並べる」ことで、図式は 2 次元である。2 次元では二つの箱は互いの横を通り抜けられる（交換法則）が、線どうしは交差できない。$\operatorname{End}(I)$ の元は線を持たない箱なので、平面の中で自由に動き回れ、順序が意味を失う（可換）。同じ理由で、組紐圏では線が 3 次元的に交差でき、対称圏では交差の上下さえ区別されない。比喩で言えば、「動ける次元が増えるほど、物の並び順は意味を失う」。これはループ空間の $\pi_{n}$ が $n\ge2$ で可換になること（\ref[エックマン–ヒルトンの議論]{cat:page-eckmann-hilton}）と同じ現象である。
:::

## 問題 {#cat:sec-str-problems}

::: problem {#cat:prob-str-scalar-action}
厳密なモノイダル圏で、$s\in\operatorname{End}(I)$ と $a$ について、$s\otimes1_{a}$ と $1_{a}\otimes s$（どちらも $a\to a$）を比べる。組紐モノイダル圏では両者が等しいことを示し、一般のモノイダル圏では等しいとは限らないことを、環 $R=\mathbb{Q}[t]$ 上の両側加群の圏（$\otimes_{R}$、単位 $R$）の例で確かめよ。
:::

::: solution
**組紐がある場合.** 組紐の自然性から $\gamma_{I,a}\circ(s\otimes1_{a})=(1_{a}\otimes s)\circ\gamma_{I,a}$ で、単位との組紐は（厳密化したとき）恒等射（\ref{cat:braided-unit-redundant}）なので $s\otimes1_{a}=1_{a}\otimes s$。図式では、箱 $s$ は交差を通って線 $a$ の反対側へ移れる。

**一般の場合.** 両側 $R$ 加群の圏で、単位 $R$ の自己準同型は中心の元による掛け算で、$R$ は可換なので $\operatorname{End}(R)\cong R$。両側加群 $M$ について、$R\otimes_{R}M\cong M$ と $M\otimes_{R}R\cong M$ を通すと、$s\otimes1_{M}$ は左からの $s$ の作用、$1_{M}\otimes s$ は右からの $s$ の作用である。$M=\mathbb{Q}[t]$ に、左作用を通常の掛け算、右作用を $m\cdot r\defeq m\,r(-t)$ で入れる（$t\mapsto-t$ は環の自己同型なので両側加群）。$s=t$ について、左作用は $m\mapsto tm$、右作用は $m\mapsto-tm$ で異なる。したがって $s\otimes1_{M}\neq1_{M}\otimes s$（両側加群の圏は厳密ではないが、厳密化しても同じ）。図式では、組紐がないと箱 $s$ は線 $M$ の左右を行き来できない。
:::
