# 剛性・ピボタル圏 {#cat:page-rigid-pivotal keywords="right and left duals in a monoidal category, uniqueness of duals, dual of a tensor product, rigid (autonomous) category, rigid implies closed, sliding lemmas, double dual, pivotal structure, left and right traces, cyclicity of the trace, spherical category, quantum dimension"}

対称モノイダル圏の双対対象（\ref{cat:dual-object}）を、対称性のない一般のモノイダル圏に移すと、**右双対**と**左双対**の区別が生じる。すべての対象が双対をもつ圏を**剛性**（自律的）といい、剛性モノイダル圏は自動的に閉圏になる。双対は同型を除いて一意で、テンソル積の双対は順序を逆にした双対のテンソル積になる。二重双対 $a^{**}$ と $a$ を自然に同一視する構造（**ピボタル構造**）があるとトレースが定まり、巡回性 $\operatorname{tr}(gf)=\operatorname{tr}(fg)$ が成り立つ。

> 資料によらず、標準的な議論で書いた。証明はストリング図式（\ref{cat:page-string-diagrams}）の交換法則とジグザグ等式による。

## 記法と定義の確認 {#cat:sec-rig-notation}

::: notation
- $(\mathbf{M},\otimes,I)$ は厳密なモノイダル圏（厳密化定理 \ref{cat:strictification} により一般性を失わない）。図式・交換法則・カップとキャップ・転置は \ref{cat:string-diagram}, \ref{cat:interchange-invariance}, \ref{cat:cups-caps}, \ref{cat:dual-diagram-example}。
- 内部 hom と閉圏は \ref{cat:closed-category}（ここでは対称性を仮定しない片側の閉構造も「閉」と呼ぶ）。単位の自己準同型 $\operatorname{End}(I)$ は可換（\ref{cat:end-unit-commutative}）。
- **選択公理**：使わない（「すべての対象が双対をもつ」とき双対を一つずつ選ぶ場面では、選んだ双対の組を構造として与えておく）。
:::

## 双対 {#cat:sec-rig-duals}

::: definition 右双対と左双対 {#cat:right-left-dual keywords="right dual and left dual in a monoidal category, rigid (autonomous) monoidal category" index="右双対|みぎそうつい, 左双対|ひだりそうつい, 剛性モノイダル圏|ごうせいものいだるけん, 自律的な圏|じりつてきなけん"}
対象 $a$ の**右双対**とは、対象 $a^{*}$ と射 $\mathrm{ev}_{a}:a^{*}\otimes a\to I$, $\mathrm{coev}_{a}:I\to a\otimes a^{*}$ の組で、ジグザグ等式
$$
(1_{a}\otimes\mathrm{ev}_{a})(\mathrm{coev}_{a}\otimes1_{a})=1_{a},\qquad(\mathrm{ev}_{a}\otimes1_{a^{*}})(1_{a^{*}}\otimes\mathrm{coev}_{a})=1_{a^{*}}
$$
をみたすものをいう。**左双対** ${}^{*}a$ は、$\mathrm{ev}'_{a}:a\otimes{}^{*}a\to I$, $\mathrm{coev}'_{a}:I\to{}^{*}a\otimes a$ について同様の等式をみたすもの（$a$ が ${}^{*}a$ の右双対であること）。すべての対象が右双対と左双対をもつ（それらを選んで構造として与えた）モノイダル圏を**剛性**（または**自律的**）という。
:::

::: lemma 引きずりの補題 {#cat:sliding-lemma keywords="sliding a morphism around a cup or a cap turns it into its transpose" index="引きずりの補題|ひきずりのほだい"}
右双対をもつ $c,d$ と $h:c\to d$ について（転置 $h^{*}:d^{*}\to c^{*}$ は \ref{cat:dual-diagram-example}）、
$$
(h\otimes1_{c^{*}})\circ\mathrm{coev}_{c}=(1_{d}\otimes h^{*})\circ\mathrm{coev}_{d},\qquad\mathrm{ev}_{c}\circ(h^{*}\otimes1_{c})=\mathrm{ev}_{d}\circ(1_{d^{*}}\otimes h).
$$
:::

::: proof
**Step 1（カップ）.** $h^{*}$ の定義 $(\mathrm{ev}_{d}\otimes1_{c^{*}})(1_{d^{*}}\otimes h\otimes1_{c^{*}})(1_{d^{*}}\otimes\mathrm{coev}_{c})$ を代入すると、右辺は
$$
\begin{aligned}
&(1_{d}\otimes\mathrm{ev}_{d}\otimes1_{c^{*}})(1_{d\otimes d^{*}}\otimes h\otimes1_{c^{*}})(1_{d\otimes d^{*}}\otimes\mathrm{coev}_{c})\,\mathrm{coev}_{d}\\
&\quad=(1_{d}\otimes\mathrm{ev}_{d}\otimes1_{c^{*}})(\mathrm{coev}_{d}\otimes1_{d}\otimes1_{c^{*}})(h\otimes1_{c^{*}})\,\mathrm{coev}_{c}
\end{aligned}
$$
（交換法則 \ref{cat:interchange-invariance}：$\mathrm{coev}_{d}$ と $\mathrm{coev}_{c}$、$h$ の層の順序を入れ替える）。第 1 のジグザグ等式 $(1_{d}\otimes\mathrm{ev}_{d})(\mathrm{coev}_{d}\otimes1_{d})=1_{d}$ から左辺に等しい。

**Step 2（キャップ）.** 同様に、左辺に $h^{*}$ を代入し、交換法則で層を並べ替えて第 2 のジグザグ等式を $c^{*}$ について使う。
:::

::: proposition 双対の一意性とテンソル積 {#cat:dual-uniqueness keywords="right duals are unique up to unique compatible isomorphism; (a tensor b)^* = b^* tensor a^*; I^* = I" index="双対の一意性|そうついのいちいせい"}
1. $(a^{*},\mathrm{ev},\mathrm{coev})$ と $(d,\mathrm{ev}',\mathrm{coev}')$ がともに $a$ の右双対なら、$\varphi\defeq(\mathrm{ev}\otimes1_{d})(1_{a^{*}}\otimes\mathrm{coev}'):a^{*}\to d$ は同型で、$\mathrm{ev}'(\varphi\otimes1_{a})=\mathrm{ev}$, $(1_{a}\otimes\varphi)\mathrm{coev}=\mathrm{coev}'$ をみたす唯一の射。
2. $a,b$ が右双対をもてば、$b^{*}\otimes a^{*}$ は
$$
\mathrm{ev}_{a\otimes b}\defeq\mathrm{ev}_{b}(1_{b^{*}}\otimes\mathrm{ev}_{a}\otimes1_{b}),\qquad\mathrm{coev}_{a\otimes b}\defeq(1_{a}\otimes\mathrm{coev}_{b}\otimes1_{a^{*}})\mathrm{coev}_{a}
$$
により $a\otimes b$ の右双対。$I$ は $I$ の右双対（$\mathrm{ev}=\mathrm{coev}=1_{I}$）。
:::

::: proof
**Step 1（1：逆射）.** $\psi\defeq(\mathrm{ev}'\otimes1_{a^{*}})(1_{d}\otimes\mathrm{coev})$ とおく。$\psi\varphi$ は、$a^{*}$ の線にカップ $\mathrm{coev}'$ とキャップ $\mathrm{ev}$、$\mathrm{coev}$ と $\mathrm{ev}'$ がつながった図式で、交換法則で並べ替えると、$(\mathrm{ev}\otimes1)(1\otimes[(1_{a}\otimes\mathrm{ev}')(\mathrm{coev}'\otimes1_{a})]\otimes1)(1\otimes\mathrm{coev})$ の形になり、$d$ についての第 1 のジグザグ等式で $[\cdots]=1_{a}$、さらに $a^{*}$ の第 2 のジグザグ等式で $1_{a^{*}}$。$\varphi\psi=1_{d}$ も対称に。

**Step 2（1：両立と一意性）.** $\mathrm{ev}'(\varphi\otimes1_{a})=\mathrm{ev}'(\mathrm{ev}\otimes1_{d}\otimes1_{a})(1\otimes\mathrm{coev}'\otimes1)$ を交換法則で $\mathrm{ev}\circ(1_{a^{*}}\otimes[(1\otimes\mathrm{ev}')(\mathrm{coev}'\otimes1)])=\mathrm{ev}$ と書き直す。もう一方も同様。一意性：$\varphi'$ が $\mathrm{ev}'(\varphi'\otimes1)=\mathrm{ev}$ をみたせば、$\varphi'=(\mathrm{ev}'\otimes1_{d})(\varphi'\otimes1_{a}\otimes1_{d})(1_{a^{*}}\otimes\mathrm{coev}')$（$d$ の第 2 のジグザグ等式を $\varphi'$ の後に挿入し、交換法則）$=(\mathrm{ev}\otimes1_{d})(1\otimes\mathrm{coev}')=\varphi$。

**Step 3（2）.** 第 1 のジグザグ等式：
$$
(1_{a\otimes b}\otimes\mathrm{ev}_{a\otimes b})(\mathrm{coev}_{a\otimes b}\otimes1_{a\otimes b})
$$
を図式で書くと、外側の $a$ のカップ・キャップと内側の $b$ のカップ・キャップが入れ子になった S 字が二本並ぶ。交換法則で層を並べ替え、まず $b$ の S 字（第 1 のジグザグ等式）、次に $a$ の S 字を伸ばすと $1_{a\otimes b}$。第 2 も同様。$I$ については自明。
:::

::: corollary 双対関手 {#cat:duality-functor keywords="duality functor M^op -> M reversing tensor products" index="双対関手|そうついかんしゅ"}
すべての対象が右双対をもつ（選んである）とき、$a\mapsto a^{*}$, $f\mapsto f^{*}$ は関手 $(-)^{*}:\mathbf{M}^{\mathrm{op}}\to\mathbf{M}$（\ref{cat:dual-diagram-example}）で、$(a\otimes b)^{*}\cong b^{*}\otimes a^{*}$, $I^{*}\cong I$（\ref{cat:dual-uniqueness}）により、テンソル積の順序を逆にする強モノイダル関手 $\mathbf{M}^{\mathrm{op}}\to\mathbf{M}^{\mathrm{rev}}$（$\mathbf{M}^{\mathrm{rev}}$ は $a\otimes^{\mathrm{rev}}b\defeq b\otimes a$）になる。
:::

::: proposition 剛性ならば閉 {#cat:rigid-closed keywords="if a has a right dual then -tensor a is left adjoint to -tensor a^*; rigid monoidal categories are closed" index="剛性と閉構造|ごうせいとへいこうぞう"}
$a$ が右双対をもてば、$\mathbf{M}(x\otimes a,y)\cong\mathbf{M}(x,y\otimes a^{*})$（$x,y$ について自然）。すなわち $-\otimes a\dashv-\otimes a^{*}$ で、内部 hom は $[a,y]\cong y\otimes a^{*}$。左双対について $a\otimes-\dashv{}^{*}a\otimes-$。
:::

::: proof
$f:x\otimes a\to y$ に $\tilde f\defeq(f\otimes1_{a^{*}})(1_{x}\otimes\mathrm{coev}_{a})$、$g:x\to y\otimes a^{*}$ に $\hat g\defeq(1_{y}\otimes\mathrm{ev}_{a})(g\otimes1_{a})$ を対応させる。$\hat{\tilde f}=(1\otimes\mathrm{ev})(f\otimes1\otimes1)(1\otimes\mathrm{coev}\otimes1)=f\circ(1_{x}\otimes[(1\otimes\mathrm{ev})(\mathrm{coev}\otimes1)])$（交換法則）$=f$。$\tilde{\hat g}=g$ も第 2 のジグザグ等式から。自然性は定義から。
:::

::: example 剛性モノイダル圏の例 {#cat:rigid-examples}
1. 体 $k$ 上の有限次元ベクトル空間の圏：$V^{*}=\operatorname{Hom}(V,k)$、$\mathrm{ev}(\xi\otimes v)=\xi(v)$、$\mathrm{coev}(1)=\sum_{i}e_{i}\otimes e^{i}$（基底と双対基底。基底によらない）。対称なので左右の双対は一致する（\ref{cat:dualizable-modules}）。
2. 可換環上の有限生成射影加群の圏（\ref{cat:dualizable-modules}）。
3. 環 $R$ 上の両側加群で、左右どちらの加群としても有限生成射影なもの：右双対と左双対は一般に異なる（$\operatorname{Hom}_{R}(M,R)$ の左右）。
4. 有限群 $G$ の有限次元表現の圏、より一般に有限次元ホップ代数の有限次元加群の圏（\ref{cat:page-hopf}）。
:::

## ピボタル構造とトレース {#cat:sec-rig-pivotal}

::: definition ピボタル構造とトレース {#cat:pivotal-trace keywords="pivotal structure: monoidal natural isomorphism a -> a^{**}; right and left traces; spherical; quantum dimension" index="ピボタル構造|ぴぼたるこうぞう, 右トレース|みぎとれーす, 球面的な圏|きゅうめんてきなけん, 量子次元|りょうしじげん"}
すべての対象が右双対をもつとする。$a^{**}\defeq(a^{*})^{*}$ とし、自然同型 $\delta_{a}:a\to a^{**}$ で、$\delta_{a\otimes b}$ が \ref{cat:dual-uniqueness} の同一視 $(a\otimes b)^{**}\cong a^{**}\otimes b^{**}$ のもとで $\delta_{a}\otimes\delta_{b}$ に一致するもの（モノイダル自然同型）を**ピボタル構造**という。$f:a\to a$ の**右トレース**と**左トレース**を
$$
\begin{aligned}
\operatorname{tr}_{R}(f)&\defeq\mathrm{ev}_{a^{*}}\circ(\delta_{a}f\otimes1_{a^{*}})\circ\mathrm{coev}_{a}\in\operatorname{End}(I),\\
\operatorname{tr}_{L}(f)&\defeq\mathrm{ev}_{a}\circ(1_{a^{*}}\otimes f)\circ(1_{a^{*}}\otimes\delta_{a}^{-1})\circ\mathrm{coev}_{a^{*}}\in\operatorname{End}(I)
\end{aligned}
$$
と定め、$\dim_{R}(a)\defeq\operatorname{tr}_{R}(1_{a})$, $\dim_{L}(a)\defeq\operatorname{tr}_{L}(1_{a})$ を**量子次元**という。すべての $f$ で $\operatorname{tr}_{L}(f)=\operatorname{tr}_{R}(f)$ のとき**球面的**という。
:::

::: theorem トレースの巡回性 {#cat:trace-cyclic keywords="tr(gf) = tr(fg) in a pivotal category" index="トレースの巡回性|とれーすのじゅんかいせい"}
ピボタル圏で $f:a\to b$, $g:b\to a$ なら $\operatorname{tr}_{R}(gf)=\operatorname{tr}_{R}(fg)$、$\operatorname{tr}_{L}(gf)=\operatorname{tr}_{L}(fg)$。とくに $\operatorname{tr}_{R}$ は共役 $f\mapsto\phi f\phi^{-1}$ で不変。
:::

::: proof
**Step 1（$\delta$ の自然性）.** $\delta_{a}g=g^{**}\delta_{b}$（$g^{**}\defeq(g^{*})^{*}:b^{**}\to a^{**}$）。

**Step 2（キャップを通す）.** \ref{cat:sliding-lemma} の第 2 式を $h=g^{*}:a^{*}\to b^{*}$ に使うと $\mathrm{ev}_{a^{*}}(g^{**}\otimes1_{a^{*}})=\mathrm{ev}_{b^{*}}(1_{b^{**}}\otimes g^{*})$。よって
$$
\operatorname{tr}_{R}(gf)=\mathrm{ev}_{a^{*}}(g^{**}\delta_{b}f\otimes1_{a^{*}})\mathrm{coev}_{a}=\mathrm{ev}_{b^{*}}(\delta_{b}\otimes1_{b^{*}})(1_{b}\otimes g^{*})(f\otimes1_{a^{*}})\mathrm{coev}_{a}
$$
（交換法則で $\delta_{b}f$ の層と $g^{*}$ の層を入れ替える）。

**Step 3（カップを通す）.** 第 1 式を $h=f$ に使うと $(f\otimes1_{a^{*}})\mathrm{coev}_{a}=(1_{b}\otimes f^{*})\mathrm{coev}_{b}$。よって
$$
\operatorname{tr}_{R}(gf)=\mathrm{ev}_{b^{*}}(\delta_{b}\otimes1_{b^{*}})(1_{b}\otimes g^{*}f^{*})\mathrm{coev}_{b}=\mathrm{ev}_{b^{*}}(\delta_{b}\otimes1_{b^{*}})(1_{b}\otimes(fg)^{*})\mathrm{coev}_{b}
$$
（$g^{*}f^{*}=(fg)^{*}$。\ref{cat:dual-diagram-example}）。

**Step 4.** 同じ計算を $\operatorname{tr}_{R}(fg)=\mathrm{ev}_{b^{*}}(\delta_{b}fg\otimes1)\mathrm{coev}_{b}$ に対して Step 3 の第 1 式（$h=fg:b\to b$）で行うと、同じ式になる。左トレースも対称な計算。
:::

::: example
1. 有限次元ベクトル空間の圏で $\delta_{V}:V\to V^{**}$ を標準的な同型 $v\mapsto(\xi\mapsto\xi(v))$ とすると、$\operatorname{tr}_{R}(f)=\operatorname{tr}_{L}(f)=\operatorname{tr}(f)$（行列のトレース）、$\dim V$ は（$k$ の元としての）次元。
2. 次数付きベクトル空間（超ベクトル空間）の圏で、対称性に符号 $(-1)^{|v||w|}$ を入れたものでは、標準的なピボタル構造でのトレースは**超トレース** $\operatorname{tr}(f_{0})-\operatorname{tr}(f_{1})$、次元は $\dim V_{0}-\dim V_{1}$ になる（同様の計算）。
3. ピボタル構造をもたない剛性モノイダル圏や、ピボタルだが球面的でない圏があることが知られている（たとえば $S^{2}$ が内部自己同型でないホップ代数の表現圏。本サイト未収録）。
:::

::: hypcheck
- **選択公理**：使わない。双対は構造として与え、一意性（\ref{cat:dual-uniqueness}）で選び方の違いを吸収した。
- **厳密性**：図式計算のために仮定した。一般のモノイダル圏では構造射を挿入した同じ計算になる。
- **ピボタル構造のモノイダル性**：巡回性（\ref{cat:trace-cyclic}）には $\delta$ の自然性だけを使い、モノイダル性は使っていない。モノイダル性は、トレースの乗法性 $\operatorname{tr}(f\otimes g)=\operatorname{tr}(f)\operatorname{tr}(g)$ を（組紐をもつ場合などに）示すときに要る。
- 対称モノイダル圏では、\ref{cat:trace-dimension} のトレースは、$\gamma$ から定まる標準的なピボタル構造の右トレースと一致することが知られている（本サイト未収録）。
:::

::: supplement
**前提を変えると.** 剛性モノイダル圏で、$\operatorname{End}(I)=k$ が体で、半単純で単純対象が有限個のものを**融合圏**という。融合圏では量子次元は正の実数にとれ（ペロン–フロベニウス次元）、球面的な融合圏から 3 次元位相的場の理論（チューラエフ–ヴィロ）が作れることが知られている（本サイト未収録）。

**計算の観点.** 有限次元ベクトル空間の圏では、トレースは対角成分の和で $O(n)$、量子次元は単なる次元。一般の融合圏では、トレースの値は融合規則（テンソル積の分解の重複度）を使った有限の線形代数で計算できる。
:::

## 高い視点 {#cat:sec-rig-viewpoint}

::: remark 「線を曲げる」自由
剛性は、ストリング図式で線を「上から下へ折り返す」ことを許す構造である（カップとキャップ）。折り返しを許すと、入力と出力の区別は向きの区別にすぎなくなり、$\mathbf{M}(x\otimes a,y)\cong\mathbf{M}(x,y\otimes a^{*})$（入力を出力に移す）が成り立つ。ピボタル構造は「線を一周させても元に戻る」ことの保証で、トレースは線の端を輪につなぐ操作である。比喩で言えば、トレースは「行列を輪にして、一周して戻ってきた量を測る」操作で、巡回性は「輪の上では始点をどこに置いてもよい」ことを表す。
:::

## 問題 {#cat:sec-rig-problems}

::: problem {#cat:prob-rig-colimits}
$a$ が右双対をもつとき、関手 $-\otimes a$ は存在するすべての余極限を保ち、$-\otimes a^{*}$ は存在するすべての極限を保つことを示せ。また、有限次元ベクトル空間の圏で、$f:V\to W$ の転置 $f^{*}$（\ref{cat:dual-diagram-example}）が双対写像 $\xi\mapsto\xi\circ f$ であることを確かめよ。
:::

::: solution
\ref{cat:rigid-closed} から $-\otimes a\dashv-\otimes a^{*}$。左随伴は余極限を、右随伴は極限を保つ（\ref{cat:adjoints-preserve-limits} とその双対）。

転置：$\xi\in W^{*}$ について、$1\otimes\mathrm{coev}_{V}$ で $\xi\mapsto\sum_{i}\xi\otimes e_{i}\otimes e^{i}$、$1\otimes f\otimes1$ で $\sum_{i}\xi\otimes f(e_{i})\otimes e^{i}$、$\mathrm{ev}_{W}\otimes1$ で $\sum_{i}\xi(f(e_{i}))e^{i}=\xi\circ f$（双対基底による展開）。よって $f^{*}(\xi)=\xi\circ f$。
:::
