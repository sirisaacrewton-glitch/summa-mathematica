# 淡中再構成 {#cat:page-tannaka keywords="Tannaka reconstruction, fiber functor, endomorphisms of the forgetful functor recover the algebra, coproduct from the monoidal structure, grouplike elements, Tannaka duality for finite groups, Aut of the fiber functor, D4 and Q8, Tannaka-Krein, Deligne"}

ホップ代数 $H$ から表現の圏を作った（\ref{cat:page-hopf}）のと逆に、表現の圏と忘却関手（**ファイバー関手**）から $H$ を復元できる：忘却関手の自然な自己準同型の全体が $H$ で、モノイダル構造が余積を復元する。とくに有限群 $G$ は、表現の圏の忘却関手の**モノイダルな自然自己同型の群**として復元される（**淡中双対性**）。指標表が等しい $D_{4}$ と $Q_{8}$ は、モノイダル構造とファイバー関手まで込めれば区別される。

> 資料によらず、標準的な議論で書いた。淡中双対性の一般形（コンパクト群、代数群、淡中圏）は本ページの最後で知られている事実として述べる。

## 記法と定義の確認 {#cat:sec-tnk-notation}

::: notation
- $k$ は体。有限次元代数 $H$ について、有限次元左 $H$ 加群の圏を $H\text{-}\mathbf{mod}$、忘却関手を $\omega:H\text{-}\mathbf{mod}\to\mathbf{vect}_{k}$（有限次元ベクトル空間の圏）とする。
- 双代数・ホップ代数・加群の圏のモノイダル構造は \ref{cat:hopf-algebra}, \ref{cat:bialgebra-monoidal}, \ref{cat:antipode-duals}。モノイダル関手・モノイダル自然変換は \ref{cat:monoidal-functor}, \ref{cat:monoidal-natural-transformation}。米田の補題は \ref{cat:yoneda-lemma}。
- 関手 $\omega$ の**自然な自己準同型**の集合 $\operatorname{End}(\omega)$ は、成分ごとの和・合成で $k$ 代数になる。
- **選択公理**：使わない。
:::

## 代数の復元 {#cat:sec-tnk-algebra}

::: theorem 忘却関手の自己準同型 {#cat:end-forgetful keywords="End of the forgetful functor on finite dimensional H-modules is H" index="忘却関手の自己準同型|ぼうきゃくかんしゅのじこじゅんどうけい"}
有限次元代数 $H$ について、$h$ に「各 $M$ への $h$ の作用」の族を対応させる写像は $k$ 代数の同型 $H\cong\operatorname{End}(\omega)$。
:::

::: proof
**Step 1（$\omega$ は表現可能）.** 左正則加群 $H$（有限次元なので $H\text{-}\mathbf{mod}$ の対象）について、$\operatorname{Hom}_{H}(H,M)\to M$, $f\mapsto f(1)$ は $M$ について自然な全単射（逆は $m\mapsto(x\mapsto xm)$）。すなわち $\omega\cong\operatorname{Hom}_{H}(H,-)$（集合値として。線形でもある）。

**Step 2（米田の補題）.** $\operatorname{End}(\operatorname{Hom}_{H}(H,-))\cong\operatorname{End}_{H}(H)^{\mathrm{op}}$（米田の補題：自然変換は $1_{H}$ の像で決まり、それは $H$ の自己準同型）。$\operatorname{End}_{H}(H)$ は右からの掛け算 $x\mapsto xa$ の全体で $H^{\mathrm{op}}$ と同型（$\varphi\mapsto\varphi(1)$）。よって $\operatorname{End}(\omega)\cong(H^{\mathrm{op}})^{\mathrm{op}}=H$。

**Step 3（同型の具体形）.** $h\in H$ に対応する自然変換は、$1_{H}\in\operatorname{Hom}_{H}(H,H)$ の像が右からの $h$ の掛け算 $x\mapsto xh$ であるもの、すなわち $f\in\operatorname{Hom}_{H}(H,M)$ を $f\circ(\cdot h)$ に写すもの。$\omega$ に戻すと $f(1)\mapsto f(h)=hf(1)$ で、$M$ への $h$ の作用。代数の同型であることは、作用が積と両立することから。
:::

::: proposition 余積の復元 {#cat:coproduct-reconstruction keywords="the monoidal structure of the fiber functor recovers the coproduct; monoidal natural transformations are grouplike" index="余積の復元|よせきのふくげん, 群的元|ぐんてきげん"}
$H$ を有限次元双代数とし、$H\text{-}\mathbf{mod}$ に \ref{cat:bialgebra-monoidal} のモノイダル構造を入れる（$\omega$ は厳密モノイダル）。$\theta\in\operatorname{End}(\omega)$ が元 $h$ に対応するとき：
1. $\theta_{M\otimes N}$ は $\omega(M)\otimes\omega(N)$ 上の $\Delta(h)$ の作用で、$\theta_{k}$ は $\varepsilon(h)$ 倍。
2. $\theta$ が**モノイダル**（$\theta_{M\otimes N}=\theta_{M}\otimes\theta_{N}$, $\theta_{k}=1$）であることと、$h$ が**群的**（$\Delta(h)=h\otimes h$, $\varepsilon(h)=1$）であることは同値。
:::

::: proof
**Step 1（1）.** \ref{cat:end-forgetful} から $\theta_{M\otimes N}$ は $M\otimes N$ への $h$ の作用で、それは $\Delta(h)$ の作用（\ref{cat:bialgebra-monoidal}）。$k$ への作用は $\varepsilon(h)$。

**Step 2（2）.** $\theta_{M}\otimes\theta_{N}$ は $h\otimes h$ の作用。$\theta_{H\otimes H}=\theta_{H}\otimes\theta_{H}$ を $1\otimes1$ に施すと、左辺は $\Delta(h)(1\otimes1)=\Delta(h)$、右辺は $h\otimes h$。よってモノイダルなら $\Delta(h)=h\otimes h$。逆に $\Delta(h)=h\otimes h$ なら、すべての $M,N$ と $m\otimes n$ について $\theta_{M\otimes N}(m\otimes n)=hm\otimes hn=(\theta_{M}\otimes\theta_{N})(m\otimes n)$。$\theta_{k}=1$ は $\varepsilon(h)=1$。
:::

## 有限群の淡中双対性 {#cat:sec-tnk-groups}

::: lemma 群環の群的元 {#cat:grouplike-group-algebra keywords="the grouplike elements of k[G] are exactly the elements of G" index="群環の群的元|ぐんかんのぐんてきげん"}
群環 $k[G]$ の群的元は $G$ の元だけ。
:::

::: proof
$x=\sum_{g}c_{g}g$（有限和）が群的とする。$\Delta(x)=\sum_{g}c_{g}\,g\otimes g$ と $x\otimes x=\sum_{g,h}c_{g}c_{h}\,g\otimes h$ を、$k[G]\otimes k[G]$ の基底 $\{g\otimes h\}$ で比べると、$g\neq h$ で $c_{g}c_{h}=0$、$c_{g}^{2}=c_{g}$。よって各 $c_{g}\in\{0,1\}$ で、$1$ となる $g$ は高々一つ。$\varepsilon(x)=\sum c_{g}=1$ から、ちょうど一つの $g$ で $c_{g}=1$、すなわち $x=g$。逆に $g\in G$ は群的。
:::

::: theorem 有限群の淡中双対性 {#cat:tannaka-finite-group keywords="a finite group is the group of monoidal natural automorphisms of the forgetful functor on its finite dimensional representations" index="淡中双対性|たんなかそうついせい"}
有限群 $G$ と体 $k$ について、$\operatorname{Rep}_{k}(G)$（有限次元表現の圏、テンソル積は \ref{rep:constructions}）と忘却関手 $\omega$ について、$g$ に「各 $V$ への $g$ の作用」の族を対応させる写像は群の同型
$$
G\cong\operatorname{Aut}^{\otimes}(\omega)\defeq\{\text{モノイダルな自然同型 }\omega\Rightarrow\omega\}.
$$
:::

::: proof
**Step 1.** $\operatorname{Rep}_{k}(G)=k[G]\text{-}\mathbf{mod}$ で、テンソル積は群環の余積 $\Delta(g)=g\otimes g$ による（\ref{cat:hopf-examples} の 1 と \ref{cat:antipode-duals} の後の例）。

**Step 2.** \ref{cat:end-forgetful} から $\operatorname{End}(\omega)\cong k[G]$。\ref{cat:coproduct-reconstruction} の 2 から、モノイダルな自然変換は群的元に対応し、\ref{cat:grouplike-group-algebra} から群的元は $G$ の元。群的元 $g$ は可逆（逆元 $g^{-1}$ も群的）なので、モノイダルな自然変換はすべて同型。合成は $k[G]$ の積に対応するので、群の同型。
:::

::: example $D_{4}$ と $Q_{8}$
$k=\mathbb{C}$ で、$D_{4}$ と $Q_{8}$ は同じ指標表をもつ（\ref{rep:page-character-tables} の例）。既約表現は 1 次元が 4 個と 2 次元が 1 個で、テンソル積の分解の重複度（融合規則）も一致する（指標の積から計算できる）。したがって $\operatorname{Rep}(D_{4})$ と $\operatorname{Rep}(Q_{8})$ は、線形圏として同値で、既約対象のテンソル積の分解の仕方も同じである。それでも \ref{cat:tannaka-finite-group} から、忘却関手と両立するモノイダル同値 $F:\operatorname{Rep}(D_{4})\to\operatorname{Rep}(Q_{8})$（$\omega'F\cong\omega$ がモノイダルな同型）は存在しない：存在すれば $\operatorname{Aut}^{\otimes}(\omega)\cong\operatorname{Aut}^{\otimes}(\omega')$、すなわち $D_{4}\cong Q_{8}$ となり矛盾（$D_{4}$ は位数 2 の元を 5 個、$Q_{8}$ は 1 個もつ）。モノイダル構造は、指標表（融合規則）より多くの情報（結合子の情報）を持っている。実際、$\operatorname{Rep}(D_{4})$ と $\operatorname{Rep}(Q_{8})$ はファイバー関手との両立を課さなくてもモノイダル圏として同値でないことが知られている（フロベニウス–シュール指標の違い。本サイト未収録）。
:::

::: hypcheck
- **選択公理**：使わない。
- **有限次元性**：\ref{cat:end-forgetful} で、正則加群 $H$ が $H\text{-}\mathbf{mod}$ の対象であること（$\omega$ が表現可能であること）に使った。無限群（無限次元の群環）では、有限次元表現の圏の $\operatorname{End}(\omega)$ は群環より大きな「副有限完備化」のようなものになり、代わりに双対の余代数（表現係数の環）を復元するのが正しい（\ref{cat:tannaka-known}）。
- **モノイダル性**：群的元の特徴づけ（\ref{cat:coproduct-reconstruction}）に本質的。モノイダル性を課さない $\operatorname{Aut}(\omega)$ は $k[G]$ の可逆元の群で、$G$ よりずっと大きい。
- **体 $k$**：任意。標数が $\lvert G\rvert$ を割っても（表現の圏が半単純でなくても）定理は成り立つ。
:::

::: remark 知られている一般形（本サイト未収録） {#cat:tannaka-known}
1. **淡中–クレインの双対性**：コンパクト群 $G$ は、有限次元連続ユニタリ表現の圏と忘却関手から、モノイダルで $*$ 構造と両立する自然自己同型の群として復元される（淡中忠郎, 1939; M. Krein）。
2. **淡中圏**：体 $k$ 上の剛性な対称モノイダル $k$ 線形アーベル圏 $\mathbf{T}$（$\operatorname{End}(I)=k$）と、完全で忠実な $k$ 線形対称モノイダル関手 $\omega:\mathbf{T}\to\mathbf{vect}_{k}$ について、$\mathbf{T}$ はアフィン群スキーム $\operatorname{Aut}^{\otimes}(\omega)$ の表現の圏と同値（P. Deligne–J. Milne, 1982）。
3. **ドリーニュの定理**：標数 0 で、各対象の「長さ」の成長が指数的以下の淡中圏は、超群（またはその表現の圏）として実現される（Deligne, 2002）。
4. ファイバー関手が組紐・対称でない場合は、$\operatorname{End}(\omega)$ はホップ代数（またはその一般化）を復元し、これが量子群の表現論の基礎になる。
:::

::: supplement
**前提を変えると.** \ref{cat:tannaka-finite-group} で、表現の圏として「置換表現（$G$ 集合の線形化）」だけを使っても、$\operatorname{Aut}^{\otimes}$ は $G$ になる。さらに $G$ 集合の圏そのもの（直積をモノイダル構造とする）と忘却関手 $G\text{-}\mathbf{Set}\to\mathbf{Set}$ の自己同型群は $G$ である（米田の補題：忘却関手は $G$ で表現される）。これはグロタンディークのガロア理論（\ref{fld:grothendieck-galois}）でファイバー関手からガロア群を復元するのと同じ原理である。
:::

## 高い視点 {#cat:sec-tnk-viewpoint}

::: remark 対称性は「見え方」から復元できる
淡中双対性は、群（対称性そのもの）を、その表現の圏（対称性がどう見えるか）と、表現をただのベクトル空間として見る関手（ファイバー関手）から復元する。比喩で言えば、物体（群）を直接見ずに、あらゆる方向から撮った写真（表現）と、写真をただの画像として見る見方（ファイバー関手）から、物体を再構成する。ファイバー関手を変えずに保つ「変換」の全体が、元の対称性である。グロタンディークのガロア理論・被覆空間の理論・トポスの点（\ref{cat:page-etale-site}）も、同じ「ファイバー関手の自己同型」の原理の例である。
:::

## 問題 {#cat:sec-tnk-problems}

::: problem {#cat:prob-tnk-function-algebra}
有限群 $G$ の関数環 $k^{G}$（\ref{cat:hopf-examples} の 2）の群的元を求め、$k^{G}\text{-}\mathbf{mod}$（$G$ 次数付きベクトル空間の圏）の忘却関手のモノイダル自然自己同型の群が、$G$ の 1 次元指標（準同型 $G\to k^{\times}$）の群であることを示せ。
:::

::: solution
$x=\sum_{g}c_{g}\delta_{g}$（関数 $g\mapsto c_{g}$）について、$\Delta(x)=\sum_{g}c_{g}\sum_{ab=g}\delta_{a}\otimes\delta_{b}=\sum_{a,b}c_{ab}\,\delta_{a}\otimes\delta_{b}$、$x\otimes x=\sum_{a,b}c_{a}c_{b}\,\delta_{a}\otimes\delta_{b}$。群的 $\iff$ $c_{ab}=c_{a}c_{b}$ かつ $\varepsilon(x)=c_{1}=1$ $\iff$ $g\mapsto c_{g}$ が準同型 $G\to k$ の積に関するモノイドの準同型で、$c_{g}c_{g^{-1}}=c_{1}=1$ から値は $k^{\times}$ に入る。すなわち 1 次元指標。\ref{cat:end-forgetful} と \ref{cat:coproduct-reconstruction} から、モノイダル自然自己同型の群は 1 次元指標の群（積は点ごと）。$G$ が可換で $k$ が十分大きい（$\lvert G\rvert$ 乗根を含み標数が $\lvert G\rvert$ を割らない）なら、これは双対群 $\hat G$（\ref{grp:dual-group}）で、$k^{G}\cong k[\hat G]$ と整合する。
:::
