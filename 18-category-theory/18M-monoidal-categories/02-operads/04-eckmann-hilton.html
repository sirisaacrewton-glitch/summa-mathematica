# エックマン–ヒルトンの議論 {#cat:page-eckmann-hilton keywords="Eckmann-Hilton argument, interchange law, two unital operations coincide and are commutative, monoids in monoids, group objects in groups are abelian, fundamental group of a topological group is abelian, H-spaces, pi_2 abelian, doubly monoidal categories are braided"}

一つの集合に単位元をもつ二つの二項演算があり、互いに**交換法則** $(a\ast b)\cdot(c\ast d)=(a\cdot c)\ast(b\cdot d)$ をみたすなら、二つの演算は一致し、しかも可換で結合的である（**エックマン–ヒルトンの議論**）。この単純な代数的事実が、モノイダル圏の $\operatorname{End}(I)$ の可換性（\ref{cat:end-unit-commutative}）、$n\ge2$ のホモトピー群の可換性（\ref{cat:higher-homotopy-groups}）、位相群の基本群の可換性、「モノイドの中のモノイドは可換」という圏論的事実の共通の理由である。

> 資料によらず、標準的な議論で書いた（B. Eckmann–P. Hilton, 1962）。

## 記法と定義の確認 {#cat:sec-ekh-notation}

::: notation
- モノイド・モノイダル圏のモノイドは \ref{cat:monoid-object}。モノイダル圏の $\operatorname{End}(I)$ とストリング図式は \ref{cat:end-unit-commutative}, \ref{cat:interchange-invariance}。
- 基本群・高次ホモトピー群・つなぎ合わせは \ref{cat:fundamental-group-loops}, \ref{cat:higher-homotopy-groups}。小立方体オペラッドは \ref{cat:little-cubes-operad}。
- **選択公理**：使わない。
:::

## 代数的な議論 {#cat:sec-ekh-algebra}

::: theorem エックマン–ヒルトン {#cat:eckmann-hilton-algebraic keywords="two unital binary operations satisfying the interchange law coincide, and are commutative and associative" index="エックマン–ヒルトンの議論|えっくまんひるとんのぎろん, 交換法則|こうかんほうそく"}
集合 $M$ 上の二項演算 $\cdot$（単位元 $1$）と $\ast$（単位元 $e$）が、すべての $a,b,c,d$ について
$$
(a\ast b)\cdot(c\ast d)=(a\cdot c)\ast(b\cdot d)
$$
をみたすとする。このとき $1=e$, $a\cdot b=a\ast b$ で、この演算は可換かつ結合的。
:::

::: proof
**Step 1（単位元の一致）.** 交換法則に $a=d=1$, $b=c=e$ を代入すると、左辺 $(1\ast e)\cdot(e\ast1)=1\cdot1=1$、右辺 $(1\cdot e)\ast(e\cdot1)=e\ast e=e$。よって $1=e$。

**Step 2（演算の一致）.** $b=c=1$ とすると $(a\ast1)\cdot(1\ast d)=a\cdot d$、右辺は $(a\cdot1)\ast(1\cdot d)=a\ast d$。よって $a\cdot d=a\ast d$。

**Step 3（可換性）.** $a=d=1$ とすると、左辺 $(1\ast b)\cdot(c\ast1)=b\cdot c$、右辺 $(1\cdot c)\ast(b\cdot1)=c\ast b=c\cdot b$（Step 2）。よって $b\cdot c=c\cdot b$。

**Step 4（結合性）.** $c=1$ とすると、左辺 $(a\ast b)\cdot(1\ast d)=(a\cdot b)\cdot d$、右辺 $(a\cdot1)\ast(b\cdot d)=a\cdot(b\cdot d)$。
:::

::: corollary モノイドの中のモノイド {#cat:monoid-in-monoids keywords="a monoid object in the category of monoids is a commutative monoid; group objects in groups are abelian groups" index="モノイドの中のモノイド|ものいどのなかのものいど"}
1. モノイドの圏 $\mathbf{Mon}$（直積をモノイダル構造とする）のモノイドは、可換モノイドと同じもの。
2. 群の圏 $\mathbf{Grp}$ の群対象（群の準同型を積とする群）はアーベル群と同じもの。
:::

::: proof
**Step 1（1）.** $\mathbf{Mon}$ のモノイドは、モノイド $(M,\cdot,1)$ と、モノイドの準同型 $\ast:M\times M\to M$, $e:\{\ast\}\to M$ で、$(M,\ast,e)$ がモノイドとなるもの。$\ast$ が準同型であることは $(a\cdot c)\ast(b\cdot d)=(a\ast b)\cdot(c\ast d)$（$M\times M$ の積は成分ごと）で、交換法則そのもの。\ref{cat:eckmann-hilton-algebraic} から $\ast=\cdot$ で可換。逆に可換モノイドの積 $M\times M\to M$ は準同型（$(ac)(bd)=(ab)(cd)$）。

**Step 2（2）.** 同様に、群の準同型 $M\times M\to M$ の積は交換法則をみたし、アーベル群になる。
:::

## 位相的な応用 {#cat:sec-ekh-topology}

::: theorem 位相群の基本群 {#cat:topological-group-pi1-abelian keywords="the fundamental group of a topological group (or H-space) is abelian" index="位相群の基本群|いそうぐんのきほんぐん, H 空間|えっちくうかん"}
位相群 $G$（基点は単位元 $e$）について、$\pi_{1}(G,e)$ は可換。より一般に、連続な積 $\mu:Y\times Y\to Y$ で基点 $e$ が両側の単位元であるもの（**H 空間**、単位律は厳密に）について $\pi_{1}(Y,e)$ は可換。
:::

::: proof
**Step 1（点ごとの積）.** ループ $\ell,m\in\Omega Y$ について $(\ell\ast m)(t)\defeq\mu(\ell(t),m(t))$ はループ（$\mu(e,e)=e$）で、ホモトピーと両立するので $\pi_{1}(Y,e)$ 上の演算を定める（ホモトピー $H$, $K$ に対し $\mu(H,K)$）。単位元は定値ループ $c_{e}$（$\mu(\ell(t),e)=\ell(t)$）。

**Step 2（交換法則）.** つなぎ合わせ $\cdot$（\ref{cat:fundamental-group-loops}）について、ループの段階で
$$
(\ell_{1}\ast m_{1})\cdot(\ell_{2}\ast m_{2})=(\ell_{1}\cdot\ell_{2})\ast(m_{1}\cdot m_{2})
$$
が成り立つ：$t\le\tfrac12$ では両辺とも $\mu(\ell_{1}(2t),m_{1}(2t))$、$t\ge\tfrac12$ では $\mu(\ell_{2}(2t-1),m_{2}(2t-1))$。$\cdot$ の単位元も定値ループ $c_{e}$。

**Step 3.** $\pi_{1}(Y,e)$ 上で \ref{cat:eckmann-hilton-algebraic} を使うと、$\cdot=\ast$ で可換。
:::

::: proposition 二方向のつなぎ合わせ {#cat:pi2-two-directions keywords="pi_2 is abelian by the Eckmann-Hilton argument with horizontal and vertical concatenation" index="二方向のつなぎ合わせ|にほうこうのつなぎあわせ"}
$n\ge2$ で、$\Omega^{n}X$ の第 1 座標方向のつなぎ合わせ $\cdot_{1}$ と第 2 座標方向のつなぎ合わせ $\cdot_{2}$ は、ループの段階で交換法則 $(\ell_{1}\cdot_{2}m_{1})\cdot_{1}(\ell_{2}\cdot_{2}m_{2})=(\ell_{1}\cdot_{1}\ell_{2})\cdot_{2}(m_{1}\cdot_{1}m_{2})$ をみたし、単位元はどちらも定値写像。したがって $\pi_{n}(X)$ は可換（\ref{cat:higher-homotopy-groups} の別証明）。
:::

::: proof
両辺とも、$I^{n}$ を第 1・第 2 座標で $2\times2$ の小正方形に分け、左下に $\ell_{1}$、左上に $m_{1}$、右下に $\ell_{2}$、右上に $m_{2}$ を（縮めて）置いた写像（$\cdot_{2}$ は第 2 座標の下半分・上半分）。ループの段階で等しいので $\pi_{n}$ でも等しく、$\pi_{0}$ に移して \ref{cat:eckmann-hilton-algebraic}。小立方体の言葉では、$\mathcal{C}_{n}(4)$ の一つの点（$2\times2$ の配置）が二通りの合成として表されることにあたる。
:::

## 圏論的な形 {#cat:sec-ekh-categorical}

::: remark 一つの対象をもつモノイダル圏
1. 対象が一つの圏はモノイド $M$ で、それがモノイダル圏（厳密）であるとは、$M$ 上の第 2 の積 $\otimes$ が関手（$(a\otimes b)\circ(c\otimes d)=(a\circ c)\otimes(b\circ d)$）で単位をもつことなので、エックマン–ヒルトンから $M$ は可換モノイド。これは \ref{cat:end-unit-commutative} の別の見方である（$\operatorname{End}(I)$ は「$I$ だけを対象とする」充満部分圏）。
2. 2 圏の対象 $a$ の恒等 1 射の 2 自己射の全体も、縦と横の合成が交換法則をみたすので可換モノイドになる（\ref{cat:eckmann-hilton}）。
3. 圏のレベルに一段上げると、モノイダル圏で第 2 の両立するモノイダル構造をもつもの（**二重モノイダル圏**）は、等式の代わりに同型を使ったエックマン–ヒルトンの議論で**組紐モノイダル圏**になり、三重以上で対称に近づく（A. Joyal–R. Street, 1993。本サイト未収録）。これは $E_{2}$ と組紐（\ref{cat:page-e2-braided}）の圏論版である。
:::

::: hypcheck
- **選択公理**：使わない。
- **単位元の存在**：\ref{cat:eckmann-hilton-algebraic} の Step 1〜4 のすべてで使った。単位元がないと結論は成り立たない（たとえば $M$ 上の $a\cdot b\defeq a$, $a\ast b\defeq a$ は交換法則をみたすが可換でない：$(a\ast b)\cdot(c\ast d)=a=(a\cdot c)\ast(b\cdot d)$）。
- **結合律は仮定していない**：結論の結合性は交換法則と単位元だけから出る。
- 位相群の場合、群の逆元は使っていない（H 空間で十分）。単位律が厳密でない（ホモトピーを除いて成り立つ）H 空間でも、ホモトピー群の段階では単位律が成り立つので同じ結論になる。
:::

::: supplement
**前提を変えると.** 交換法則の代わりに、「$\ast$ が $\cdot$ について準同型」の片側だけ（たとえば $(a\ast b)\cdot c$ の形）を仮定しても結論は出ない。一方、$\cdot$ だけが単位元をもち $\ast$ が単位元をもたない場合も、上の反例のように成り立たない。

**計算の観点.** 有限集合上の二つの演算（乗積表で与える）が交換法則をみたすかの判定は $\lvert M\rvert^{4}$ 回の比較で済み、単位元の探索は $\lvert M\rvert^{2}$。
:::

## 高い視点 {#cat:sec-ekh-viewpoint}

::: remark 「二つの方向に積める」ものは可換
エックマン–ヒルトンの議論の図式は、正方形の中で、横に並べることと縦に並べることが同じ $2\times2$ の配置を与える、という一枚の絵である。二つの元を、横に並べ、片方を上に、もう片方を下にずらし、横の順序を入れ替え、また戻すと、順序が入れ替わる。比喩で言えば、一車線の道（1 次元）では追い越しはできないが、二車線（2 次元）なら追い越せる。「追い越せること」が可換性で、その「追い越し方」（右から・左から）の区別が組紐である。
:::

## 問題 {#cat:sec-ekh-problems}

::: problem {#cat:prob-ekh-matrix}
環 $R$ について、$R$ 上の積 $\cdot$ と、別の二項演算 $\ast$（単位元をもつ）が交換法則をみたすなら、$R$ は可換環で $\ast=\cdot$ であることを確かめよ。さらに、非可換環 $R$（たとえば $2\times2$ 行列環）では、積 $\cdot$ と交換法則をみたす単位的な演算 $\ast$ は存在しないことを結論せよ。
:::

::: solution
\ref{cat:eckmann-hilton-algebraic} を $(R,\cdot,1)$ と $(R,\ast,e)$ に使うと、$\ast=\cdot$ で、$\cdot$ は可換。非可換環ではこの結論に反するので、そのような $\ast$ は存在しない。$2\times2$ 行列環では $E_{11}E_{12}=E_{12}\neq0=E_{12}E_{11}$ なので非可換。
:::
