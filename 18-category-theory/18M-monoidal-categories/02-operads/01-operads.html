# オペラッドとその代数 {#cat:page-operads keywords="operad, non-symmetric operad, symmetric operad, endomorphism operad, algebra over an operad, associative operad, commutative operad, terminal operad, monad associated to an operad, free algebra, composition product of symmetric sequences"}

**オペラッド**は「$k$ 個の入力と 1 個の出力をもつ演算の集まり」と、その合成（入力に別の演算の出力を差し込む）を抽象化したものである。対象 $X$ の上の演算 $X^{k}\to X$ の全体（**自己準同型オペラッド**）が典型で、オペラッドの**代数**とは、オペラッドの演算を $X$ の上の具体的な演算として実現したもの。結合的な二項演算をもつ構造（モノイド）や可換モノイドは、最も単純なオペラッドの代数として現れる。次ページ以降では、位相空間のオペラッド（小区間・小円板）が「ホモトピーを除いて結合的・可換」な構造を記述し、ループ空間を特徴づけることを見る。

> オペラッドは J. P. May, *The Geometry of Iterated Loop Spaces* (1972) で導入された。

## 記法と定義の確認 {#cat:sec-opd-notation}

::: notation
- 本ページでは、集合の圏 $\mathbf{Set}$ または位相空間の圏（コンパクト生成空間の圏 $\mathbf{CGHaus}$、\ref{cat:cghaus-ccc}）で考え、元を使って書く（位相空間の場合は、すべての写像が連続であることを要求する）。一般の対称モノイダル圏でも同じ定義が図式でできる。
- $\Sigma_{k}$ は $\{1,\dots,k\}$ の対称群。$X^{k}$ は $k$ 個の直積（$X^{0}=\ast$）。
- モノイダル圏のモノイド・一般結合律、モナドとその代数は \ref{cat:monoid-object}, \ref{cat:general-associative-law}, \ref{cat:monad}, \ref{cat:t-algebra}。種（記号列）とコーシー積は \ref{cat:day-examples.2}。
- **選択公理**：使わない。
:::

## オペラッド {#cat:sec-opd-definition}

::: definition 非対称オペラッド {#cat:non-symmetric-operad keywords="non-symmetric operad: sets P(k), composition gamma, unit, associativity and unit axioms" index="非対称オペラッド|ひたいしょうおぺらっど, オペラッド|おぺらっど"}
**非対称オペラッド** $P$ とは、集合（空間）の列 $P(k)$（$k\ge0$）、単位 $1\in P(1)$、**合成**
$$
\gamma:P(k)\times P(j_{1})\times\cdots\times P(j_{k})\to P(j_{1}+\cdots+j_{k})
$$
の組で、次をみたすものをいう（$\gamma(c;d_{1},\dots,d_{k})$ と書く。$c$ の $i$ 番目の入力に $d_{i}$ の出力を差し込むことを表す）。
1. （結合律）$c\in P(k)$, $d_{i}\in P(j_{i})$, $e_{1},\dots,e_{j}\in$ 各 $P(\ell_{r})$（$j=\sum j_{i}$）について、$e$ を $d_{1},\dots,d_{k}$ の入力の順に $j_{1},\dots,j_{k}$ 個ずつの組 $\vec e_{1},\dots,\vec e_{k}$ に分けると
$$
\gamma(\gamma(c;d_{1},\dots,d_{k});e_{1},\dots,e_{j})=\gamma(c;\gamma(d_{1};\vec e_{1}),\dots,\gamma(d_{k};\vec e_{k})).
$$
2. （単位律）$\gamma(1;d)=d$、$\gamma(c;1,\dots,1)=c$。
:::

::: definition 対称オペラッド {#cat:symmetric-operad keywords="symmetric operad: right Sigma_k actions compatible with composition" index="対称オペラッド|たいしょうおぺらっど"}
**対称オペラッド**とは、非対称オペラッドで、各 $P(k)$ に $\Sigma_{k}$ の右作用 $c\mapsto c\cdot\sigma$ があり、合成が次の意味で同変なものをいう。
1. $\gamma(c\cdot\sigma;d_{1},\dots,d_{k})=\gamma(c;d_{\sigma^{-1}(1)},\dots,d_{\sigma^{-1}(k)})\cdot\sigma\langle j_{1},\dots,j_{k}\rangle$。ここで $\sigma\langle j_{1},\dots,j_{k}\rangle\in\Sigma_{j}$ は、長さ $j_{1},\dots,j_{k}$ の $k$ 個の区間（ブロック）を $\sigma$ に従って並べ替える置換。
2. $\gamma(c;d_{1}\cdot\tau_{1},\dots,d_{k}\cdot\tau_{k})=\gamma(c;d_{1},\dots,d_{k})\cdot(\tau_{1}\oplus\cdots\oplus\tau_{k})$。ここで $\tau_{1}\oplus\cdots\oplus\tau_{k}$ は各ブロックの中で $\tau_{i}$ を施す置換。
:::

::: example オペラッドの例 {#cat:operad-examples}
1. **自己準同型オペラッド**：集合（空間）$X$ について $\operatorname{End}_{X}(k)\defeq\operatorname{Map}(X^{k},X)$、$1=\mathrm{id}_{X}$、$\gamma(f;g_{1},\dots,g_{k})\defeq f\circ(g_{1}\times\cdots\times g_{k})$、$(f\cdot\sigma)(x_{1},\dots,x_{k})\defeq f(x_{\sigma^{-1}(1)},\dots,x_{\sigma^{-1}(k)})$。（位相空間では $\operatorname{Map}$ に写像空間の位相を入れる。$\mathbf{CGHaus}$ のデカルト閉性により合成は連続。）
2. **可換オペラッド** $\mathrm{Com}$：すべての $k$ で $\mathrm{Com}(k)=\ast$（1 点）。終対象の対称オペラッド。
3. **結合オペラッド** $\mathrm{Ass}$：非対称版は $\mathrm{Ass}^{\mathrm{ns}}(k)=\ast$（終対象の非対称オペラッド）。対称版は $\mathrm{Ass}(k)\defeq\Sigma_{k}$（右からの積で作用）で、$\gamma(\sigma;\tau_{1},\dots,\tau_{k})\defeq\sigma\langle j_{1},\dots,j_{k}\rangle\circ(\tau_{1}\oplus\cdots\oplus\tau_{k})$。$\sigma\in\Sigma_{k}$ は「$k$ 個の入力を $\sigma$ の順に並べて掛ける」演算を表す。
4. **ベクトル空間のオペラッド**（$\times$ を $\otimes$ に変える）：リー代数のオペラッド $\mathrm{Lie}$ は、$\mathrm{Lie}(k)$ が自由リー代数の中の $k$ 変数の多重線形な元の空間（次元 $(k-1)!$）であるもの。
:::

::: proposition 自己準同型オペラッド {#cat:endomorphism-operad keywords="End_X is a symmetric operad" index="自己準同型オペラッド|じこじゅんどうけいおぺらっど"}
$\operatorname{End}_{X}$ は対称オペラッド。
:::

::: proof
**Step 1（結合律）.** 両辺とも、$x\in X^{\sum\ell_{r}}$ に対して、最初に $e_{1},\dots,e_{j}$ をそれぞれの入力の組に施し、その結果を $d_{1},\dots,d_{k}$ に順に $j_{i}$ 個ずつ入れ、最後に $c$ を施した値。写像の合成の結合律と、直積 $\times$ が合成と両立すること（$(g_{1}\times g_{2})\circ(h_{1}\times h_{2})=g_{1}h_{1}\times g_{2}h_{2}$）から一致する。

**Step 2（単位律）.** $\mathrm{id}\circ d=d$、$c\circ(\mathrm{id}\times\cdots\times\mathrm{id})=c$。

**Step 3（同変性）.** 1 は、$c\cdot\sigma$ が入力の組を $\sigma$ で並べ替えてから $c$ を施すことなので、$d_{i}$ を差し込んだあとではブロックごとの並べ替え $\sigma\langle j_{1},\dots,j_{k}\rangle$ になる。2 は各 $d_{i}$ の入力の並べ替えがブロックの中の並べ替えになることから。いずれも定義を展開すれば一致する（添字の計算だけで、新しい考えは要らない）。
:::

## 代数 {#cat:sec-opd-algebras}

::: definition オペラッドの代数 {#cat:operad-algebra keywords="algebra over an operad: operad morphism to End_X, or action maps P(k) x X^k -> X" index="オペラッドの代数|おぺらっどのだいすう"}
オペラッドの**射** $P\to Q$ は、各 $k$ の写像 $P(k)\to Q(k)$ で、単位・合成（対称なら $\Sigma_{k}$ の作用も）を保つもの。オペラッド $P$ の**代数**（$P$ 代数）とは、対象 $X$ とオペラッドの射 $P\to\operatorname{End}_{X}$ のこと。同じことだが、写像 $\theta_{k}:P(k)\times X^{k}\to X$ の族で
$$
\theta(\gamma(c;d_{1},\dots,d_{k});\vec x_{1},\dots,\vec x_{k})=\theta(c;\theta(d_{1};\vec x_{1}),\dots,\theta(d_{k};\vec x_{k})),\qquad\theta(1;x)=x
$$
（対称なら $\theta(c\cdot\sigma;x_{1},\dots,x_{k})=\theta(c;x_{\sigma^{-1}(1)},\dots,x_{\sigma^{-1}(k)})$ も）をみたすもの。$P$ 代数の射は、$\theta$ と両立する写像。
:::

::: theorem 結合・可換オペラッドの代数 {#cat:ass-com-algebras keywords="algebras over the terminal non-symmetric operad are monoids; algebras over Com are commutative monoids" index="結合オペラッドの代数|けつごうおぺらっどのだいすう"}
1. $\mathrm{Ass}^{\mathrm{ns}}$（終対象の非対称オペラッド）の代数は、モノイド（位相空間なら位相モノイド）と同じもの。$\theta_{2}$ が積、$\theta_{0}$ が単位。
2. $\mathrm{Com}$（終対象の対称オペラッド）の代数は、可換モノイドと同じもの。
3. 対称版 $\mathrm{Ass}$ の代数もモノイドと同じもの。
:::

::: proof
**Step 1（1：代数からモノイド）.** $P(k)=\ast$ なので、代数は写像 $\theta_{k}:X^{k}\to X$ の族で、単位律 $\theta_{1}=\mathrm{id}$ と結合律 $\theta_{j}(\vec x_{1},\dots,\vec x_{k})=\theta_{k}(\theta_{j_{1}}(\vec x_{1}),\dots,\theta_{j_{k}}(\vec x_{k}))$（$j=\sum j_{i}$）をみたすもの。$xy\defeq\theta_{2}(x,y)$, $e\defeq\theta_{0}()$ とおくと、結合律を $(k;j_{1},j_{2})=(2;2,1)$ と $(2;1,2)$ に使って
$$
(xy)z=\theta_{2}(\theta_{2}(x,y),\theta_{1}(z))=\theta_{3}(x,y,z)=\theta_{2}(\theta_{1}(x),\theta_{2}(y,z))=x(yz),
$$
$(2;0,1)$ に使って $ex=\theta_{2}(\theta_{0}(),\theta_{1}(x))=\theta_{1}(x)=x$、同様に $xe=x$。

**Step 2（1：$\theta$ は積で決まる）.** $(2;k-1,1)$ の結合律から $\theta_{k}(x_{1},\dots,x_{k})=\theta_{2}(\theta_{k-1}(x_{1},\dots,x_{k-1}),x_{k})$（$k\ge1$）なので、帰納法で $\theta_{k}(x_{1},\dots,x_{k})=(\cdots((ex_{1})x_{2})\cdots)x_{k}=x_{1}x_{2}\cdots x_{k}$。よって代数の構造はモノイドの構造から一意に決まる。

**Step 3（1：モノイドから代数）.** モノイド $X$ について $\theta_{k}(x_{1},\dots,x_{k})\defeq x_{1}\cdots x_{k}$（$k=0$ なら $e$）とおくと、結合律は一般結合律（\ref{cat:general-associative-law}、$\mathbf{Set}$ の場合）から、単位律は自明。Step 2 と合わせて一対一。射も対応する（$\theta_{2}$, $\theta_{0}$ を保つことと全 $\theta_{k}$ を保つことは同値）。

**Step 4（2）.** $\mathrm{Com}$ の代数は、1 の構造に同変性 $\theta_{k}(x_{\sigma^{-1}(1)},\dots,x_{\sigma^{-1}(k)})=\theta_{k}(x_{1},\dots,x_{k})$ を加えたもの。$k=2$ で $xy=yx$。逆に可換モノイドなら積は並べ替えで不変。

**Step 5（3）.** $\mathrm{Ass}(k)=\Sigma_{k}$ は $\Sigma_{k}$ の自由な右作用（1 つの軌道、安定化群は自明）なので、同変性から $\theta(\sigma;x_{1},\dots,x_{k})=\theta(\mathrm{id}_{k};x_{\sigma^{-1}(1)},\dots,x_{\sigma^{-1}(k)})$ で、代数は $\theta(\mathrm{id}_{k};-)$ だけで決まる。$\gamma(\mathrm{id}_{k};\mathrm{id}_{j_{1}},\dots,\mathrm{id}_{j_{k}})=\mathrm{id}_{j}$ なので、$\mathrm{id}$ たちへの制限は $\mathrm{Ass}^{\mathrm{ns}}$ の代数で、1 からモノイド。逆にモノイドから $\theta(\sigma;x)\defeq x_{\sigma^{-1}(1)}\cdots x_{\sigma^{-1}(k)}$ と定めれば、$\mathrm{Ass}$ の合成の定義から結合律が成り立つ。
:::

## オペラッドのモナド {#cat:sec-opd-monad}

::: theorem オペラッドのモナド {#cat:operad-monad keywords="the monad T_P(X) = coprod P(k) x_{Sigma_k} X^k; P-algebras are T_P-algebras; free P-algebras" index="オペラッドのモナド|おぺらっどのもなど, 自由代数（オペラッド）|じゆうだいすうおぺらっど"}
対称オペラッド $P$ について、
$$
T_{P}(X)\defeq\coprod_{k\ge0}P(k)\times_{\Sigma_{k}}X^{k}
$$
（$(c\cdot\sigma,\vec x)\sim(c,\sigma\vec x)$ による商。$\sigma\vec x\defeq(x_{\sigma^{-1}(1)},\dots,x_{\sigma^{-1}(k)})$）は、単位 $X\to T_{P}X$, $x\mapsto[1;x]$ と、合成 $\mu:T_{P}T_{P}X\to T_{P}X$, $[c;[d_{1};\vec x_{1}],\dots,[d_{k};\vec x_{k}]]\mapsto[\gamma(c;d_{1},\dots,d_{k});\vec x_{1},\dots,\vec x_{k}]$ によりモナドになる。$P$ 代数は $T_{P}$ 代数（\ref{cat:t-algebra}）と同じもので、$T_{P}X$ は $X$ で生成される**自由 $P$ 代数**。
:::

::: proof
**Step 1（well-defined）.** 商による同一視 $(c\cdot\sigma,\vec x)\sim(c,\sigma\vec x)$ と $\mu$ の両立は同変性の公理（\ref{cat:symmetric-operad.1}・\ref[2]{cat:symmetric-operad.2}）による：外側の $c$ の並べ替えはブロックの並べ替え、内側の $d_{i}$ の並べ替えはブロック内の並べ替えに移る。

**Step 2（モナドの公理）.** $\mu\circ T_{P}\mu=\mu\circ\mu_{T_{P}}$ は合成の結合律、単位律は $\gamma(1;d)=d$, $\gamma(c;1,\dots,1)=c$ から。

**Step 3（代数の対応）.** $T_{P}$ 代数 $a:T_{P}X\to X$ に $\theta(c;\vec x)\defeq a[c;\vec x]$ を対応させると、同変性は商の同一視から、単位律は $a[1;x]=x$ から、結合律は $a\circ\mu=a\circ T_{P}a$ から従う。逆に $P$ 代数 $\theta$ から $a[c;\vec x]\defeq\theta(c;\vec x)$ は同変性により well-defined で、同じ等式が逆向きに成り立つ。

**Step 4（自由代数）.** モナド $T$ の自由代数 $(TX,\mu_{X})$ は $T$ 代数の圏で $X$ から生成される自由対象（\ref{cat:eilenberg-moore-adjunction}）。
:::

::: example
$P=\mathrm{Ass}$ なら $T_{P}X=\coprod_{k}\Sigma_{k}\times_{\Sigma_{k}}X^{k}\cong\coprod_{k}X^{k}$（語の全体）で、自由モノイド。$P=\mathrm{Com}$ なら $T_{P}X=\coprod_{k}X^{k}/\Sigma_{k}$（有限多重集合の全体）で、自由可換モノイド。
:::

::: remark 合成積のモノイドとしてのオペラッド
種（$\Sigma_{k}$ の右作用をもつ集合の列。\ref{cat:day-examples.2}）の圏に、**合成積** $(P\circ Q)(n)\defeq\coprod_{k}P(k)\times_{\Sigma_{k}}(Q^{\circledast k})(n)$（$Q^{\circledast k}$ は $Q$ の $k$ 回のデイ畳み込み）を入れるとモノイダル圏になり（単位は $1$ 点を次数 $1$ に置いた種）、対称オペラッドはこのモノイダル圏のモノイドと同じものである。合成 $\gamma$ が積 $P\circ P\to P$ に、単位 $1\in P(1)$ が単位射に対応する。$T_{P}X$ は、$X$ を次数 $0$ に置いた種 $X$ について $(P\circ X)(0)$ である。これらは上と同じ添字の計算で確かめられる（本ページでは証明を省く）。
:::

::: hypcheck
- **選択公理**：使わない。
- **同変性**：対称オペラッドの代数（$\mathrm{Com}$ の代数の可換性、$T_{P}$ の商の well-definedness）で本質的に使った。非対称オペラッドでは同変性はなく、$T_{P}X=\coprod_{k}P(k)\times X^{k}$。
- 位相空間で考えるときは、写像空間の位相（$\operatorname{End}_{X}$）と商位相（$T_{P}$）について、$\mathbf{CGHaus}$ で積と商が両立すること（デカルト閉性から、$-\times Y$ は左随伴で余極限を保つ）を使う。
:::

::: supplement
**計算の観点.** 有限集合のオペラッドで、$P(k)$ の大きさの列が分かれば、$T_{P}$ や合成積の各次数の大きさは指数型生成関数の合成 $f(g(x))$ で計算できる（種の理論）。たとえば $\mathrm{Ass}$ の生成関数は $\sum k!\,x^{k}/k!=1/(1-x)$、$\mathrm{Com}$ は $e^{x}$。
:::

## 高い視点 {#cat:sec-opd-viewpoint}

::: remark 演算の「形」と「中身」を分ける
オペラッドは、代数系の公理を「どんな演算があり、どう合成できるか」（形）と「その演算が何をするか」（中身、代数）に分ける。モノイドの公理（結合律）は、オペラッド $\mathrm{Ass}^{\mathrm{ns}}$ では「$k$ 変数の演算がちょうど一つ」という形の情報に吸収される。比喩で言えば、オペラッドは楽譜の様式（何声で、どう重ねられるか）で、代数はその様式で書かれた具体的な曲である。位相的なオペラッドでは、演算の「形」が空間をなし、その空間が可縮なら「演算は本質的に一つだが、それらを結ぶ道（ホモトピー）がある」ことになり、結合律が「ホモトピーを除いて」成り立つ構造（$A_{\infty}$）が得られる（\ref{cat:page-little-intervals}）。
:::

## 問題 {#cat:sec-opd-problems}

::: problem {#cat:prob-opd-pointed}
$P(0)=\ast$, $P(1)=\{1\}$, $k\ge2$ で $P(k)=\emptyset$ とする非対称オペラッドの代数は、基点付き集合（基点 $\theta_{0}()$）と同じものであることを示せ。また $P(0)=\emptyset$ に変えるとどうなるか。
:::

::: solution
合成 $\gamma(c;d_{1},\dots,d_{k})$ が定義されるのは $k\le1$ の場合だけで、$\gamma(1;d)=d$。代数は $\theta_{1}=\mathrm{id}$ と、$\theta_{0}:\ast\to X$（元 $x_{0}$）だけで、結合律は $\gamma(1;c)=c$ の場合しかなく自動的に成り立つ。よって基点付き集合で、代数の射は基点を保つ写像（$\theta_{0}$ を保つこと）。$P(0)=\emptyset$ に変えると、構造は $\theta_{1}=\mathrm{id}$ だけになり、代数はただの集合（空集合も含む）、射は任意の写像。
:::
