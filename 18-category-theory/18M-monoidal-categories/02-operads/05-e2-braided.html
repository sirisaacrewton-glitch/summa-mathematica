# E₂ と組紐 {#cat:page-e2-braided keywords="configuration spaces of the plane, braid group as fundamental group, Artin, swap paths in C_2, far commutativity, braid relation, fundamental groupoid of E_2, braided monoidal categories as E_2-algebras in categories, Fiedorowicz"}

$\mathcal{C}_{2}(k)$ の連結成分は一つ（\ref{cat:little-cubes-connected}）だが、基本群は自明でない：小正方形が互いのまわりを回る道は、平面上の点の配置の**組紐**を描く。この空間の基本群がアルティンの**組紐群** $B_{k}$（\ref{cat:braid-group}）であり（アルティンの定理）、そのため $E_{2}$ 構造を圏のレベルで見ると、可換性の代わりに**組紐**が現れる：$E_{2}$ オペラッドの基本亜群の代数は組紐モノイダル圏である。本ページでは、交換の道を構成し、組紐の関係式のうち「離れた交差の可換性」を証明し、残りを知られている定理として整理する。

> 資料によらず、標準的な議論で書いた。アルティンの定理とフィエドロヴィッチの定理は証明しない（本サイト未収録）。

## 記法と定義の確認 {#cat:sec-e2b-notation}

::: notation
- 小立方体オペラッド $\mathcal{C}_{2}$、その連結性と入れ替えの道は \ref{cat:little-cubes-operad}, \ref{cat:little-cubes-connected}（Step 4）, \ref{cat:prob-ldk-swap-path}。基本群は \ref{cat:fundamental-group-loops}。
- 組紐群・組紐圏・自由組紐モノイダル圏・組紐モノイダル圏のコヒーレンスは \ref{cat:braid-group}, \ref{cat:braid-category}, \ref{cat:braid-category-free}, \ref{cat:braided-coherence}。
- 道のホモトピーは端点を固定したもの。空間 $Y$ の**基本亜群** $\Pi_{1}(Y)$ は、対象を $Y$ の点、射を道のホモトピー類とする亜群。
- **選択公理**：使わない。
:::

## 配置空間と交換の道 {#cat:sec-e2b-configurations}

::: definition 配置空間 {#cat:configuration-space keywords="ordered and unordered configuration spaces of k points in the plane" index="配置空間|はいちくうかん"}
$\operatorname{Conf}_{k}(\mathbb{R}^{2})\defeq\{(p_{1},\dots,p_{k})\in(\mathbb{R}^{2})^{k} : p_{i}\neq p_{j}\ (i\neq j)\}$ を**順序付き配置空間**、$\Sigma_{k}$ による商 $\operatorname{UConf}_{k}(\mathbb{R}^{2})$ を**順序なし配置空間**という。中心をとる写像 $\mathcal{C}_{2}(k)\to\operatorname{Conf}_{k}((0,1)^{2})\subset\operatorname{Conf}_{k}(\mathbb{R}^{2})$ は連続で $\Sigma_{k}$ 同変。
:::

::: definition 交換の道と生成元 {#cat:swap-loops keywords="half-twist loops sigma_i in the unordered configuration space" index="交換の道|こうかんのみち"}
基点として、第 1 座標方向に並んだ列型の配置 $c^{0}=(c^{0}_{1},\dots,c^{0}_{k})$（$c^{0}_{i}=[\tfrac{i-1}{k},\tfrac ik]\times I$）をとる。$1\le i<k$ について、$c^{0}_{i}$ と $c^{0}_{i+1}$ だけを \ref{cat:little-cubes-connected} の Step 4 の方法で入れ替え、他の立方体は動かさない道を $\tilde\sigma_{i}$ とする。$\tilde\sigma_{i}$ は $c^{0}$ から $c^{0}\cdot(i\ i{+}1)$ への道で、$\mathcal{C}_{2}(k)/\Sigma_{k}$ に落とすとループになる。そのホモトピー類を $\sigma_{i}\in\pi_{1}(\mathcal{C}_{2}(k)/\Sigma_{k},[c^{0}])$ とする。
:::

::: proposition 離れた交差の可換性 {#cat:far-commutativity-topological keywords="sigma_i sigma_j = sigma_j sigma_i in the fundamental group when |i-j| >= 2" index="離れた交差の可換性|はなれたこうさのかかんせい"}
$\lvert i-j\rvert\ge2$ なら、$\pi_{1}(\mathcal{C}_{2}(k)/\Sigma_{k})$ で $\sigma_{i}\sigma_{j}=\sigma_{j}\sigma_{i}$。
:::

::: proof
**Step 1（二つの入れ替えは独立）.** $\tilde\sigma_{i}$ は立方体 $i,i+1$ だけを第 1 座標の区間 $[\tfrac{i-1}{k},\tfrac{i+1}{k}]$ の中で動かし、$\tilde\sigma_{j}$ は立方体 $j,j+1$ だけを $[\tfrac{j-1}{k},\tfrac{j+1}{k}]$ の中で動かす。$\lvert i-j\rvert\ge2$ なのでこれらの区間の内部は交わらない。よって
$$
\Phi(s,t)\defeq(\text{立方体 }i,i+1\text{ を }\tilde\sigma_{i}(s)\text{ の位置、立方体 }j,j+1\text{ を }\tilde\sigma_{j}(t)\text{ の位置、他は }c^{0})
$$
は連続写像 $\Phi:I\times I\to\mathcal{C}_{2}(k)$ を定める（内部が交わらないことは、二つの組が交わらない区間の中にあることから）。

**Step 2（正方形の二つの辺）.** $\sigma_{i}\sigma_{j}$（$\tilde\sigma_{i}$ のあとに $\tilde\sigma_{j}$ を、入れ替え後の番号で）は、$\Phi$ を正方形の辺 $(s,0)$ $(0\le s\le1)$、$(1,t)$ に沿って制限した道の像で、$\sigma_{j}\sigma_{i}$ は辺 $(0,t)$, $(s,1)$ に沿った道の像（$\mathcal{C}_{2}(k)/\Sigma_{k}$ に落として）。正方形は凸なので、二つの辺の道は端点を固定してホモトピック（対角線への直線のホモトピー）。$\Phi$ で写して商に落とすと、二つのループはホモトピック。
:::

::: remark 知られている事実（本サイト未収録）
1. **組紐関係**：$\sigma_{i}\sigma_{i+1}\sigma_{i}=\sigma_{i+1}\sigma_{i}\sigma_{i+1}$ も成り立つ（どちらも 3 つの立方体を「半回転」させる道とホモトピック）。したがって $\sigma_{i}$ たちは準同型 $B_{k}\to\pi_{1}(\mathcal{C}_{2}(k)/\Sigma_{k})$ を定める。
2. **アルティンの定理**（E. Artin, 1925；R. Fox–L. Neuwirth, 1962）：この準同型は同型で、$\mathcal{C}_{2}(k)/\Sigma_{k}\simeq\operatorname{UConf}_{k}(\mathbb{R}^{2})$ の基本群は $B_{k}$、$\operatorname{Conf}_{k}(\mathbb{R}^{2})$ の基本群は純組紐群。さらにこれらの空間の高次ホモトピー群は消える（$K(B_{k},1)$ 空間）。
3. **フィエドロヴィッチの定理**（Z. Fiedorowicz, 1990 年代）：$\mathcal{C}_{2}$ の各空間の基本亜群をとった亜群のオペラッド $\Pi_{1}\mathcal{C}_{2}$ について、圏の中の $\Pi_{1}\mathcal{C}_{2}$ 代数は（強）組紐モノイダル圏と同じもの。同様に $\Pi_{1}\mathcal{C}_{1}$ の代数はモノイダル圏、$n\ge3$ で $\Pi_{1}\mathcal{C}_{n}$ の代数は対称モノイダル圏。
:::

## 組紐モノイダル圏の側 {#cat:sec-e2b-braided}

::: proposition 組紐群の作用 {#cat:braid-group-action keywords="a braided monoidal category gives an action of B_n on a^{tensor n}" index="組紐群の作用|くみひもぐんのさよう"}
組紐モノイダル圏 $\mathbf{M}$ の対象 $a$ について、$\sigma_{i}\mapsto1_{a^{\otimes(i-1)}}\otimes\gamma_{a,a}\otimes1_{a^{\otimes(n-i-1)}}$ は群の準同型 $B_{n}\to\operatorname{Aut}(a^{\otimes n})$ を定める（$\mathbf{M}$ を厳密化してから）。$\mathbf{M}$ が対称なら、これは対称群 $\Sigma_{n}$ を経由する。
:::

::: proof
**Step 1.** 厳密化（\ref{cat:braiding-strictification}）して $\mathbf{M}$ を厳密としてよい。組紐の関係 $\sigma_{i}\sigma_{i+1}\sigma_{i}=\sigma_{i+1}\sigma_{i}\sigma_{i+1}$ は、$1\otimes(\text{ヤン–バクスター方程式})\otimes1$（\ref{cat:yang-baxter}）。離れた交差の可換性はテンソル積の関手性（交換法則 \ref{cat:interchange-invariance}）。よって生成元と関係による群の普遍性から準同型。

**Step 2（対称）.** 対称なら $\gamma_{a,a}^{2}=1$ なので、$\sigma_{i}^{2}\mapsto1$ で、$B_{n}/\langle\langle\sigma_{i}^{2}\rangle\rangle\cong\Sigma_{n}$（\ref{cat:coxeter-presentation}）を経由する。これは \ref{cat:braid-category-free} の 1 の関手 $\mathbf{B}\to\mathbf{M}$ を $\operatorname{Aut}(n)=B_{n}$ に制限したものである。
:::

::: remark 二つの世界の対応
\ref{cat:far-commutativity-topological} と \ref{cat:braid-group-action} の Step 1 は、同じ「離れたものは独立に動ける」という事実の位相版と代数版である（前者は正方形の凸性、後者はテンソル積の関手性）。組紐関係も、位相の側では 3 点の半回転のホモトピー、代数の側ではヤン–バクスター方程式（\ref{cat:crossings-reidemeister} の第 III 移動）である。これらの対応の全体をまとめたものがフィエドロヴィッチの定理で、組紐モノイダル圏は「$E_{2}$ 代数の圏版」と言える。表にまとめると：

| 位相（オペラッド） | $\pi_{0}$ | 基本亜群の代数 |
|---|---|---|
| $\mathcal{C}_{1}$（$E_{1}$） | $\mathrm{Ass}$：モノイド | モノイダル圏 |
| $\mathcal{C}_{2}$（$E_{2}$） | $\mathrm{Com}$：可換モノイド | 組紐モノイダル圏 |
| $\mathcal{C}_{n}$, $n\ge3$ | $\mathrm{Com}$ | 対称モノイダル圏 |

（表の第 3 列は本サイト未収録の定理による。）
:::

::: hypcheck
- **選択公理**：使わない。
- \ref{cat:far-commutativity-topological} は、正方形 $I\times I$ の凸性と、二つの入れ替えが**交わらない区間の中**で行われることだけを使った。組紐関係は 3 つの立方体が同じ領域で動くので、この議論では示せない。
- \ref{cat:braid-group-action} は組紐群の表示（定義）と組紐の公理（六角形から従うヤン–バクスター方程式）を使った。
:::

::: supplement
**ループ空間の組紐.** $\Omega^{2}X$ の二つの点 $\ell,m$ について、入れ替えの道 $s\mapsto\theta(\tilde\sigma_{1}(s);\ell,m)$ は $\ell\cdot m$ から $m\cdot\ell$ への道で、$\Omega^{2}X$ の基本亜群に組紐を与える。これを二回続けた道（$\ell\cdot m$ から $\ell\cdot m$ へのループ）は一般には（端点を固定して）可縮でないことが知られている（本サイト未収録）。$\Omega^{2}X$ が 3 重ループ空間 $\Omega^{3}Y$ なら、第 3 座標を使って二回の入れ替えをほどける（\ref{cat:little-cubes-connected} と同じ考え方で、$\pi_{1}\mathcal{C}_{3}(2)=0$ に当たる）。

**計算の観点.** 組紐群の語の問題は、ガーサイドの標準形により多項式時間で解けることが知られている（本サイト未収録）。一般の有限表示群の語の問題が決定不能であること（\ref{cat:page-little-intervals} の補足）と対照的である。
:::

## 高い視点 {#cat:sec-e2b-viewpoint}

::: remark 「どちら回りか」を覚えている可換性
$E_{2}$ 構造は「可換だが、交換の仕方（右回り・左回り）を記憶している」構造である。二つの物を平面上で入れ替えるとき、時計回りに回すか反時計回りに回すかで、同じ結果（位置の入れ替え）でも異なる道になる。この記憶が組紐で、3 次元以上では二つの回り方を連続に変形できるので記憶は消え（対称）、1 次元ではそもそも入れ替えられない（非可換）。比喩で言えば、$E_{1}$ は一本道、$E_{2}$ は広場（人どうしの入れ替わりの軌跡が組紐になる）、$E_{3}$ 以上は空中（軌跡の絡みはほどける）。
:::

## 問題 {#cat:sec-e2b-problems}

::: problem {#cat:prob-e2b-symmetric-quotient}
\ref{cat:braid-group-action} の準同型 $B_{n}\to\operatorname{Aut}(a^{\otimes n})$ と、置換への写像 $B_{n}\to\Sigma_{n}$（$\sigma_{i}\mapsto(i\ i{+}1)$）の関係を考える。$\mathbf{M}$ が対称なら前者が後者を経由することを示し、組紐モノイダル圏 $\mathbf{M}$ が対称でない例（\ref{cat:r-matrix-braiding} の後の例 2 の $\mathbb{Z}/n$ 次数付きベクトル空間、$n\ge3$）で、$\sigma_{1}^{2}$ の像が恒等射でないことを確かめよ。
:::

::: solution
対称なら \ref{cat:braid-group-action} の Step 2。$\mathbb{Z}/n$ 次数付きベクトル空間で組紐 $c(v\otimes w)=\zeta^{|v||w|}w\otimes v$（\ref{cat:r-matrix-braiding} の後の例 2）のとき、次数 $1$ の 1 次元空間 $a$ について $\sigma_{1}^{2}\mapsto c_{a,a}^{2}=\zeta^{2}\cdot1_{a\otimes a}$。$n\ge3$ なら $\zeta^{2}\neq1$（$\zeta$ は原始 $n$ 乗根）なので恒等射でない。よってこの準同型は $\Sigma_{2}$ を経由しない。
:::
