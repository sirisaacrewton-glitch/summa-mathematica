# 小区間オペラッドとループ空間 {#cat:page-little-intervals keywords="little intervals operad, C_1, components of C_1(k) are contractible, loop space is an algebra over the little intervals operad, A-infinity, pi_0 of an operad, fundamental group as pi_0 of the loop space, loop reversal"}

ループ空間 $\Omega X$ の二つのループの「つなぎ合わせ」は結合的ではない（$(\ell_{1}\ell_{2})\ell_{3}$ と $\ell_{1}(\ell_{2}\ell_{3})$ は区間の分け方が違う）が、区間の分け方を変えるホモトピーで結ばれる。この「分け方」をすべて集めたのが**小区間オペラッド** $\mathcal{C}_{1}$ で、$\mathcal{C}_{1}(k)$ の各連結成分は可縮、成分は $k$ 個の区間の並び順（$\Sigma_{k}$）と一対一である。$\Omega X$ は $\mathcal{C}_{1}$ 代数で、連結成分をとるとモノイド、さらに逆ループで群になる：これが**基本群** $\pi_{1}(X)=\pi_{0}(\Omega X)$ である。

> 資料によらず、標準的な議論で書いた（小区間・小円板オペラッドは J. M. Boardman–R. Vogt, J. P. May による）。

## 記法と定義の確認 {#cat:sec-lin-notation}

::: notation
- オペラッド・代数・$\mathrm{Ass}$ とその代数（モノイド）は \ref{cat:symmetric-operad}, \ref{cat:operad-algebra}, \ref{cat:operad-examples}, \ref{cat:ass-com-algebras}。位相空間のオペラッドは、$P(k)$ が空間で、合成と作用が連続なもの。
- $I=[0,1]$。基点付き空間 $(X,\ast)$ のループ空間 $\Omega X$ を、$\ell(0)=\ell(1)=\ast$ となる道 $\ell:I\to X$ の空間（コンパクト開位相 \ref{top:compact-open-topology} の部分空間）とする（\ref{cat:suspension-loop} の $\mathrm{Map}_{*}(S^{1},X)$ と同じもの）。$I$ は局所コンパクトハウスドルフなので、評価写像 $\Omega X\times I\to X$ は連続（\ref{top:evaluation-continuous}）で、連続写像 $Z\times I\to X$ の指数は連続写像 $Z\to C_{c}(I,X)$（\ref{top:exponential-continuous}）。
- 貼り合わせ補題（有限個の閉集合）は \ref{top:pasting-lemma}。$\pi_{0}(Y)$ は弧状連結成分の集合。$\pi_{0}(Y\times Z)\cong\pi_{0}(Y)\times\pi_{0}(Z)$（道は成分ごと）。
- **選択公理**：使わない。
:::

## 小区間オペラッド {#cat:sec-lin-operad}

::: definition 小区間オペラッド {#cat:little-intervals-operad keywords="little intervals operad C_1(k): k-tuples of affine embeddings of [0,1] with disjoint interiors" index="小区間オペラッド|しょうくかんおぺらっど"}
**小区間** とは、$c(t)=a+(b-a)t$（$0\le a<b\le1$）の形の写像 $c:I\to I$ のことで、$(a,b)$ と同一視する。$\mathcal{C}_{1}(k)$ を、小区間の $k$ 個組 $(c_{1},\dots,c_{k})$ で、像の内部 $(a_{i},b_{i})$ が互いに交わらないものの全体とし、$\mathbb{R}^{2k}$ の部分空間とする（$\mathcal{C}_{1}(0)=\ast$）。$\Sigma_{k}$ は $(c_{1},\dots,c_{k})\cdot\sigma\defeq(c_{\sigma(1)},\dots,c_{\sigma(k)})$ で作用し、単位は $\mathrm{id}_{I}\in\mathcal{C}_{1}(1)$、合成は
$$
\gamma(c;d_{1},\dots,d_{k})\defeq(c_{1}\circ d_{1,1},\dots,c_{1}\circ d_{1,j_{1}},\dots,c_{k}\circ d_{k,1},\dots,c_{k}\circ d_{k,j_{k}})
$$
（$d_{i}=(d_{i,1},\dots,d_{i,j_{i}})$）。
:::

::: proposition 小区間オペラッドの性質 {#cat:little-intervals-properties keywords="C_1 is a symmetric operad; each component of C_1(k) is convex hence contractible; pi_0 C_1 = Ass" index="小区間オペラッドの成分|しょうくかんおぺらっどのせいぶん"}
1. $\mathcal{C}_{1}$ は位相空間の対称オペラッド。
2. $\mathcal{C}_{1}(k)$ の弧状連結成分は、区間の左から右への並び順（$\Sigma_{k}$ の元）と一対一で、各成分は $\mathbb{R}^{2k}$ の凸集合、したがって可縮。
3. $\pi_{0}\mathcal{C}_{1}$ は集合のオペラッドで、結合オペラッド $\mathrm{Ass}$（\ref{cat:operad-examples} の 3）と同型。
:::

::: proof
**Step 1（1）.** 小区間の合成は小区間（アフィンで、$[0,1]$ を $[c(a'),c(b')]\subset[a,b]$ に写す）。$c_{i}$ の像の中で $d_{i,r}$ たちの像の内部は交わらず、異なる $i$ の像の内部は交わらないので、合成は $\mathcal{C}_{1}(j)$ に入る。結合律・単位律は写像の合成の結合律と $\mathrm{id}$ の性質、同変性は並べ替えの定義から（\ref{cat:endomorphism-operad} と同じ添字の計算）。合成は座標の多項式なので連続。

**Step 2（2）.** $(c_{1},\dots,c_{k})$ について、内部が交わらないので区間は左から右へ一列に並び、その順に添字を並べた置換 $\pi$（$a_{\pi(1)}<a_{\pi(2)}<\cdots$）が定まる。並び順 $\pi$ を固定した集合
$$
U_{\pi}\defeq\{0\le a_{\pi(1)}<b_{\pi(1)}\le a_{\pi(2)}<b_{\pi(2)}\le\cdots\le a_{\pi(k)}<b_{\pi(k)}\le1\}
$$
は線形な不等式で定まる凸集合で、$\mathcal{C}_{1}(k)=\bigsqcup_{\pi}U_{\pi}$。凸集合は（直線のホモトピーで）可縮で弧状連結。異なる $\pi$ の $U_{\pi}$ は、その間を結ぶ道があれば途中で二つの区間の順序が入れ替わる瞬間に内部が交わる（中間値の定理）ので、別の成分。

**Step 3（3）.** $\pi_{0}$ は有限積を保つので、$\pi_{0}\mathcal{C}_{1}$ は集合のオペラッド。2 の同一視で、成分 $U_{\pi}$ を「入力を $\pi$ の順に並べる」置換に対応させると、合成は区間の中に区間を入れる操作で、並び順の合成はブロックの置換 $\sigma\langle j_{1},\dots\rangle\circ(\tau_{1}\oplus\cdots)$ になる。これは $\mathrm{Ass}$ の合成。
:::

## ループ空間は代数 {#cat:sec-lin-loops}

::: theorem ループ空間の作用 {#cat:loop-space-c1-algebra keywords="the loop space Omega X is an algebra over the little intervals operad" index="ループ空間の作用|るーぷくうかんのさよう"}
$c=(c_{1},\dots,c_{k})\in\mathcal{C}_{1}(k)$, $\ell_{1},\dots,\ell_{k}\in\Omega X$ について
$$
\theta(c;\ell_{1},\dots,\ell_{k})(t)\defeq\begin{cases}\ell_{i}(c_{i}^{-1}(t))&(t\in c_{i}(I)),\\ \ast&(t\text{ がどの }c_{i}(I)\text{ にも入らない})\end{cases}
$$
とおくと、$\theta:\mathcal{C}_{1}(k)\times(\Omega X)^{k}\to\Omega X$ は連続で、$\Omega X$ は $\mathcal{C}_{1}$ 代数になる。
:::

::: proof
**Step 1（well-defined）.** 二つの $c_{i}(I)$ が交わるのは端点だけで、そこでは $\ell_{i}(0)=\ell_{i}(1)=\ast$ なので値は一致する。端点 $0,1$ では $\ast$。

**Step 2（連続性）.** 指数の連続性（記法の項）から、$\Theta:\mathcal{C}_{1}(k)\times(\Omega X)^{k}\times I\to X$, $(c,\ell,t)\mapsto\theta(c;\ell)(t)$ の連続性を示せばよい。閉集合 $A_{i}\defeq\{a_{i}\le t\le b_{i}\}$ と、どの開区間 $(a_{i},b_{i})$ にも $t$ が入らない点の閉集合 $B$ は、有限個で全体を覆う。$A_{i}$ 上で $\Theta=\mathrm{ev}(\ell_{i},(t-a_{i})/(b_{i}-a_{i}))$ は連続（$b_{i}-a_{i}>0$、評価写像は連続）、$B$ 上で $\Theta=\ast$。交わりでは Step 1 から値が一致するので、貼り合わせ補題（有限個の閉集合）で連続。

**Step 3（単位律と同変性）.** $\theta(\mathrm{id};\ell)=\ell$。$\theta(c\cdot\sigma;\ell_{1},\dots,\ell_{k})$ は $c_{\sigma(i)}$ の区間に $\ell_{i}$ を置くので、$\theta(c;\ell_{\sigma^{-1}(1)},\dots,\ell_{\sigma^{-1}(k)})$ と同じ（$c_{j}$ の区間に $\ell_{\sigma^{-1}(j)}$）。

**Step 4（結合律）.** $\theta(\gamma(c;d_{1},\dots,d_{k});\vec\ell)$ は、区間 $c_{i}\circ d_{i,r}$ に $\ell_{i,r}$ を置いたループ。$\theta(c;\theta(d_{1};\vec\ell_{1}),\dots)$ は、区間 $c_{i}$ に「$d_{i,r}$ の区間に $\ell_{i,r}$ を置いたループ」を $c_{i}$ で縮めて置いたもの。$t=c_{i}(d_{i,r}(s))$ で両者とも $\ell_{i,r}(s)$、それ以外は $\ast$ なので一致する。
:::

## 基本群 {#cat:sec-lin-pi1}

::: theorem 基本群 {#cat:fundamental-group-loops keywords="pi_0 Omega X is a group (the fundamental group); concatenation is associative and unital up to homotopy; loop reversal gives inverses" index="基本群|きほんぐん"}
$\pi_{1}(X,\ast)\defeq\pi_{0}(\Omega X)$ は、$[\ell_{1}][\ell_{2}]\defeq[\ell_{1}\cdot\ell_{2}]$（$\ell_{1}\cdot\ell_{2}\defeq\theta((c_{1},c_{2});\ell_{1},\ell_{2})$、$c_{1}=[0,\tfrac12]$, $c_{2}=[\tfrac12,1]$。つなぎ合わせ）で群になる。単位元は定値ループ、$[\ell]^{-1}=[\bar\ell]$（$\bar\ell(t)\defeq\ell(1-t)$）。
:::

::: proof
**Step 1（モノイド）.** \ref{cat:loop-space-c1-algebra} の作用に $\pi_{0}$ を施すと（$\pi_{0}$ は有限積を保つ）、$\pi_{0}\Omega X$ は $\pi_{0}\mathcal{C}_{1}\cong\mathrm{Ass}$ の代数で、\ref{cat:ass-com-algebras} の 3 からモノイド。積は並び順 $(1,2)$ の成分の元、たとえば $(c_{1},c_{2})$ で与えられる（成分の中の点の選び方によらない：成分は弧状連結で、道は作用を通してループのホモトピーを与える）。単位元は $\theta(\ast\in\mathcal{C}_{1}(0))$、すなわち定値ループ。

**Step 2（逆元）.** $H(s,t)\defeq\ell(2st)$（$t\le\tfrac12$）、$\ell(s(2-2t))$（$t\ge\tfrac12$）とおくと、$t=\tfrac12$ で両式は $\ell(s)$ で一致し、貼り合わせ補題で $H:I\times I\to X$ は連続。$H(s,0)=H(s,1)=\ast$ なので、$s\mapsto H(s,-)$ は $\Omega X$ の道（指数の連続性）で、$H(0,-)$ は定値ループ、$H(1,-)=\ell\cdot\bar\ell$。よって $[\ell][\bar\ell]=1$。$\ell$ を $\bar\ell$ に替えて $[\bar\ell][\ell]=1$。
:::

::: remark $A_{\infty}$ 構造とモーア・ループ
1. $\mathcal{C}_{1}(k)$ の各成分が可縮であることは、「つなぎ合わせの仕方は本質的に一通りで、異なる仕方はホモトピーで結ばれ、そのホモトピーどうしも結ばれ…」ることを意味する。このような構造を **$A_{\infty}$ 構造**といい、スタシェフの結合多面体 $K_{n}$（$K_{3}$ は線分、$K_{4}$ は五角形）で記述されることが知られている（本サイト未収録）。
2. 長さ $r\ge0$ のループ $\ell:[0,r]\to X$ を許す**モーア・ループ空間**では、長さを足すつなぎ合わせが厳密に結合的で、$\Omega X$ とホモトピー同値な位相モノイドが得られる（本サイト未収録）。
3. **認識定理**：弧状連結な空間 $Y$ に $\mathcal{C}_{1}$ 代数の構造があり、$\pi_{0}Y$ が群なら、$Y$ はある空間のループ空間とホモトピー同値（スタシェフ、メイ）であることが知られている（本サイト未収録）。
:::

::: hypcheck
- **選択公理**：使わない。
- **$I$ の局所コンパクト性**：評価写像の連続性と指数の連続性（作用の連続性、ホモトピーを $\Omega X$ の道とみること）に使った。
- **小区間がアフィン**であることは、合成が再び小区間になること（オペラッドであること）と、成分が凸であること（可縮性）に使った。連続な埋め込みすべてを許すと、合成は閉じるが成分の可縮性の証明は難しくなる。
- 基本群の積が点の選び方によらないこと（Step 1）は、$\mathcal{C}_{1}(2)$ の成分の弧状連結性による。
:::

::: supplement
**計算の観点.** 基本群は一般には計算不可能な対象である：有限単体複体の基本群は有限表示群で、すべての有限表示群が（4 次元多様体の基本群として）現れ、有限表示群の語の問題は一般に決定不能（ノビコフ–ブーン。本サイトの計算可能性理論の系列の決定不能問題の一例。\ref{grp:page-presentations} 参照。本サイト未収録の事実を含む）。
:::

## 高い視点 {#cat:sec-lin-viewpoint}

::: remark 「ホモトピーを除いて」の正確な意味
代数学では等式で書く公理（結合律）を、ホモトピー論では「道」（ホモトピー）で置き換える。しかし道を与えるだけでは不十分で、道の間の整合性（五角形を埋める 2 次元のホモトピー、…）も必要になる。小区間オペラッドは、それらの整合性の全体を「可縮な空間」という一言で表す。比喩で言えば、結合律は「どの順に括弧をつけても同じ」という一枚の掟、$A_{\infty}$ 構造は「括弧の付け替え方の全体が、継ぎ目のない一枚の布（可縮な空間）をなす」という掟である。
:::

## 問題 {#cat:sec-lin-problems}

::: problem {#cat:prob-lin-c1-2}
$\mathcal{C}_{1}(2)$ が二つの成分をもち、各成分が 4 次元の凸集合であることを確かめ、二つの成分が $\Sigma_{2}$ の作用で入れ替わることを示せ。
:::

::: solution
$\mathcal{C}_{1}(2)=\{(a_{1},b_{1},a_{2},b_{2}) : a_{i}<b_{i},\ \text{内部が交わらない}\}$ で、内部が交わらないことは $b_{1}\le a_{2}$ または $b_{2}\le a_{1}$。前者の集合 $U_{\mathrm{id}}=\{0\le a_{1}<b_{1}\le a_{2}<b_{2}\le1\}$ は空でない内部（たとえば $(0.1,0.2,0.3,0.4)$ の近傍）をもつ凸集合で 4 次元、後者 $U_{(12)}$ も同様。両者は交わらない（$b_{1}\le a_{2}<b_{2}\le a_{1}<b_{1}$ は不可能）。作用 $(c_{1},c_{2})\cdot(12)=(c_{2},c_{1})$ は $U_{\mathrm{id}}$ を $U_{(12)}$ に写す。
:::
