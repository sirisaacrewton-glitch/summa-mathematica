# 演習：バナッハ空間とヒルベルト空間 {#fa:page-exercises-banach-hilbert keywords="exercises, Banach and Hilbert Spaces"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは具体的な空間での計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#fa:sec-exfa1-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
- $\ell^{p}$ は $\mathbb{N}=\{1,2,\dots\}$ 上の数え上げ測度の $L^{p}$、$e_{n}\in\ell^{p}$ は第 $n$ 成分だけが $1$ で他が $0$ の列、$c_{0}\defeq\{(a_{n})\in\ell^{\infty}:a_{n}\to0\}$（ノルム $\|\cdot\|_{\infty}$）、$c_{00}$ は有限個の成分を除いて $0$ である列の全体とする。
- $C([0,1])$ は $[0,1]$ 上の連続関数の空間でノルムは $\|f\|_{\infty}\defeq\max_{[0,1]}|f|$。断らない限り実数値とする。
- $\operatorname{sgn}z\defeq z/|z|$（$z\ne0$）、$\operatorname{sgn}0\defeq0$。
:::

## ノルム空間とバナッハ空間 {#fa:sec-ns-exercises}

対応するページ：\ref{fa:page-normed-spaces}

::: problem ★ 基本：ヴォルテラ作用素のノルム {#fa:ex-ns-1}
$X\defeq C([0,1])$ 上の作用素 $V$ を $(Vf)(x)\defeq\int_{0}^{x}f(t)\,dt$ で定める。
1. $\|V^{n}\|=\frac{1}{n!}$（$n\ge1$）を示せ。
2. 級数 $R\defeq\sum_{n=0}^{\infty}V^{n}$（$V^{0}\defeq I$）が $B(X)$ で収束し、$R(I-V)=(I-V)R=I$ となることを示せ。
3. 方程式 $f-Vf=\mathbf{1}$（$\mathbf{1}$ は定数関数 $1$）の $X$ での解をすべて求めよ。
:::

::: solution
$Vf$ は連続で（\ref{calc:fundamental-theorem.1}）、$V$ は積分の線形性から線形である。

**1.** $f\in X$ について、$|(V^{n}f)(x)|\le\frac{x^{n}}{n!}\|f\|_{\infty}$（$x\in[0,1]$）を $n$ についての帰納法で示す。$n=0$ は明らか。$n$ で成り立てば
$$
|(V^{n+1}f)(x)|\le\int_{0}^{x}|(V^{n}f)(t)|\,dt\le\|f\|_{\infty}\int_{0}^{x}\frac{t^{n}}{n!}\,dt=\frac{x^{n+1}}{(n+1)!}\|f\|_{\infty}.
$$
よって $\|V^{n}f\|_{\infty}\le\frac{1}{n!}\|f\|_{\infty}$、すなわち $\|V^{n}\|\le\frac1{n!}$。一方、同じ帰納法で $V^{n}\mathbf{1}=\frac{x^{n}}{n!}$ であり、$\|\mathbf{1}\|_{\infty}=1$, $\|V^{n}\mathbf{1}\|_{\infty}=\frac{1}{n!}$ なので $\|V^{n}\|\ge\frac{1}{n!}$。よって $\|V^{n}\|=\frac{1}{n!}$。とくに $\|V\|=1$ だが $\|V^{n}\|$ は $\|V\|^{n}=1$ よりはるかに小さい。

**2.** $X$ はバナッハ空間なので $B(X)$ もバナッハ空間（\ref{fa:operator-space-complete}）。$\sum_{n}\|V^{n}\|=\sum_{n}\frac{1}{n!}<\infty$ なので、\ref{fa:absolute-series-completeness} から $R=\sum V^{n}$ は $B(X)$ で収束する。部分和 $R_{N}\defeq\sum_{n=0}^{N}V^{n}$ について $R_{N}(I-V)=(I-V)R_{N}=I-V^{N+1}$（打ち消し合う和）。$\|S(I-V)-S'(I-V)\|\le\|S-S'\|\|I-V\|$（\ref{fa:continuity-boundedness}）なので $S\mapsto S(I-V)$ は連続で、同様に $S\mapsto(I-V)S$ も連続。$N\to\infty$ とすると $\|V^{N+1}\|=\frac{1}{(N+1)!}\to0$ なので $R(I-V)=(I-V)R=I$。

**3.** 2 から $I-V$ は全単射で逆は $R$ なので、解はただ一つ $f=R\mathbf{1}$ である。$\|S\mathbf{1}-S'\mathbf{1}\|_{\infty}\le\|S-S'\|$ なので $S\mapsto S\mathbf{1}$ は連続で、
$$
R\mathbf{1}=\lim_{N\to\infty}\sum_{n=0}^{N}V^{n}\mathbf{1}=\lim_{N\to\infty}\sum_{n=0}^{N}\frac{x^{n}}{n!}\quad(\|\cdot\|_{\infty}\text{ での極限}).
$$
指数関数の冪級数は $[0,1]$ で $e^{x}$ に一様収束する（\ref{calc:uniform-limit-theorems.3} で $M_{n}=\frac1{n!}$）ので $f(x)=e^{x}$。実際 $e^{x}-\int_{0}^{x}e^{t}dt=e^{x}-(e^{x}-1)=1$ である。
:::

::: problem ★★ 標準：C¹ ノルム {#fa:ex-ns-2}
$X\defeq C^{1}([0,1])$（$[0,1]$ で微分可能（端点では片側）で導関数が連続な実数値関数の全体）に $\|f\|_{C^{1}}\defeq\|f\|_{\infty}+\|f'\|_{\infty}$ を入れる。
1. $(X,\|\cdot\|_{C^{1}})$ はバナッハ空間であることを示せ。
2. $X$ 上で $\|\cdot\|_{C^{1}}$ と $\|\cdot\|_{\infty}$ は同値でないことを示せ。
3. 微分 $D\colon f\mapsto f'$ を $(X,\|\cdot\|_{C^{1}})\to C([0,1])$ とみたときの作用素ノルムを求め、それが達成されないことを示せ。
:::

::: solution
**1.** ノルムの公理 (ii)(iii) は $\|\cdot\|_{\infty}$ の性質と微分の線形性から、(i) は $\|f\|_{C^{1}}=0\Rightarrow\|f\|_{\infty}=0$ から。$(f_{n})$ を $\|\cdot\|_{C^{1}}$ のコーシー列とすると、$\|f_{n}-f_{m}\|_{\infty}$ と $\|f_{n}'-f_{m}'\|_{\infty}$ はともに $\|f_{n}-f_{m}\|_{C^{1}}$ 以下なので、$(f_{n})$ と $(f_{n}')$ はともに一様コーシー列である。\ref{calc:uniform-limit-theorems.1} から $f_{n}'$ はある $g$ に一様収束し、\ref{calc:uniform-limit-theorems.2} から $g$ は連続。$(f_{n}(0))$ は収束するので、\ref{calc:uniform-derivative} から $f_{n}$ はある $f$ に一様収束し、$f$ は微分可能で $f'=g$。よって $f\in X$ で、
$$
\|f_{n}-f\|_{C^{1}}=\|f_{n}-f\|_{\infty}+\|f_{n}'-g\|_{\infty}\to0.
$$

**2.** $\|f\|_{\infty}\le\|f\|_{C^{1}}$ は成り立つ。逆向きの評価 $\|f\|_{C^{1}}\le C\|f\|_{\infty}$ が成り立たないことを示す。$f_{n}(x)\defeq x^{n}$ は $\|f_{n}\|_{\infty}=1$、$f_{n}'=nx^{n-1}$ で $\|f_{n}'\|_{\infty}=n$ なので $\|f_{n}\|_{C^{1}}=1+n$。どの $C$ についても $n>C-1$ で $\|f_{n}\|_{C^{1}}>C\|f_{n}\|_{\infty}$ となる。

**3.** $\|Df\|_{\infty}=\|f'\|_{\infty}\le\|f\|_{C^{1}}$ なので $\|D\|\le1$。$h_{n}(x)\defeq x^{n}/n$ について $\|h_{n}\|_{C^{1}}=\frac1n+1$、$\|Dh_{n}\|_{\infty}=1$ なので $\|D\|\ge\frac{1}{1+1/n}\to1$。よって $\|D\|=1$。達成されるとすると $f\ne0$ で $\|f'\|_{\infty}=\|f\|_{\infty}+\|f'\|_{\infty}$、すなわち $\|f\|_{\infty}=0$ となり矛盾。（$\|\cdot\|_{\infty}$ に関しては、2 の $f_{n}$ について $\|Df_{n}\|_{\infty}/\|f_{n}\|_{\infty}=n$ なので $D$ は有界でない。）
:::

::: problem ★★★ 発展：リースの補題で θ = 1 はとれない {#fa:ex-ns-3}
$X\defeq\{f\in C([0,1]):f(0)=0\}$、$\varphi(f)\defeq\int_{0}^{1}f(x)\,dx$、$M\defeq\ker\varphi$ とする。
1. $X$ はバナッハ空間、$M$ は $X$ の閉部分空間で $M\ne X$ であることを示せ。
2. $f\in X$ について $\operatorname{dist}(f,M)=|\varphi(f)|$ を示せ。
3. $\|f\|_{\infty}=1$ となるすべての $f\in X$ について $\operatorname{dist}(f,M)<1$ であることを示せ。すなわち \ref{fa:riesz-lemma} は $\theta=1$ では成り立たない。
:::

::: solution
**1.** $|f(0)|\le\|f\|_{\infty}$ なので $f\mapsto f(0)$ は連続で、$X$ はその零点集合として $C([0,1])$ の閉部分空間。$C([0,1])$ は完備なので $X$ も完備（\ref{top:complete-closed.1}）。$|\varphi(f)|\le\|f\|_{\infty}$ なので $\varphi\in X^{*}$（\ref{fa:continuity-boundedness}）で、$M=\varphi^{-1}(0)$ は閉部分空間。$f(x)=x$ は $\varphi(f)=\frac12\ne0$ なので $M\ne X$。

**2.** $m\in M$ について $|\varphi(f)|=|\varphi(f-m)|\le\|f-m\|_{\infty}$ なので $\operatorname{dist}(f,M)\ge|\varphi(f)|$。逆向きを示す。$g_{n}(x)\defeq\min(nx,1)$ は $g_{n}\in X$, $\|g_{n}\|_{\infty}=1$ で
$$
\varphi(g_{n})=\int_{0}^{1/n}nx\,dx+\Bigl(1-\frac1n\Bigr)=1-\frac{1}{2n}>0.
$$
$m_{n}\defeq f-\frac{\varphi(f)}{\varphi(g_{n})}g_{n}$ は $\varphi(m_{n})=0$ で $M$ に属し、$\|f-m_{n}\|_{\infty}=\frac{|\varphi(f)|}{1-1/(2n)}$。$n\to\infty$ として $\operatorname{dist}(f,M)\le|\varphi(f)|$。

**3.** $f(0)=0$ と連続性から、$\delta\in(0,1]$ で $[0,\delta]$ 上 $|f|\le\frac12$ となるものがある。$[\delta,1]$ 上では $|f|\le1$ なので
$$
|\varphi(f)|\le\int_{0}^{1}|f|\le\frac{\delta}{2}+(1-\delta)=1-\frac{\delta}{2}<1.
$$
2 から $\operatorname{dist}(f,M)<1$。

（ヒルベルト空間では $M^{\perp}$ の単位ベクトルが $\operatorname{dist}=1$ を与えるので $\theta=1$ がとれる。\ref{fa:orthogonal-decomposition.2} を先取りしてよい。）
:::

## ヒルベルト空間 {#fa:sec-hs-exercises}

対応するページ：\ref{fa:page-hilbert-spaces}

::: problem ★ 基本：ルジャンドル多項式と最良近似 {#fa:ex-hs-1}
実数値の $L^{2}([-1,1])$ で、$1,x,x^{2}$ にグラム–シュミットの直交化を施して正規直交系 $e_{0},e_{1},e_{2}$ を求めよ。次に、2 次以下の多項式のうち $|x|$ に $L^{2}$ ノルムで最も近いもの $p$ と、距離 $\||x|-p\|_{2}$ を求めよ。
:::

::: solution
**直交化.** $\|1\|_{2}^{2}=2$ なので $e_{0}=\frac{1}{\sqrt2}$。$\langle x,e_{0}\rangle=\frac{1}{\sqrt2}\int_{-1}^{1}x\,dx=0$、$\|x\|_{2}^{2}=\int_{-1}^{1}x^{2}dx=\frac23$ なので $e_{1}=\sqrt{\tfrac32}\,x$。$\langle x^{2},e_{0}\rangle=\frac{1}{\sqrt2}\cdot\frac23$、$\langle x^{2},e_{1}\rangle=0$（被積分関数が奇関数）なので、$x^{2}-\langle x^{2},e_{0}\rangle e_{0}=x^{2}-\frac13$。$\int_{-1}^{1}(3x^{2}-1)^{2}dx=\frac{18}{5}-4+2=\frac85$ なので
$$
e_{2}=\sqrt{\tfrac58}\,(3x^{2}-1).
$$

**最良近似.** 2 次以下の多項式の空間 $M$ は 3 次元なので閉（\ref{fa:finite-dim-norms-equivalent.3}）で、$\{e_{0},e_{1},e_{2}\}$ はその正規直交基底。\ref{fa:bessel.2} から最良近似は $p=P_{M}|x|=\sum_{k=0}^{2}\langle|x|,e_{k}\rangle e_{k}$（最短点であることは \ref{fa:closest-point}, \ref{fa:orthogonal-decomposition.1}）。係数は
$$
\langle|x|,e_{0}\rangle=\frac{1}{\sqrt2}\int_{-1}^{1}|x|\,dx=\frac{1}{\sqrt2},\quad\langle|x|,e_{1}\rangle=0,\quad\langle|x|,e_{2}\rangle=\sqrt{\tfrac58}\cdot2\int_{0}^{1}(3x^{3}-x)\,dx=\sqrt{\tfrac58}\cdot\frac12.
$$
よって
$$
p(x)=\frac12+\frac{5}{16}(3x^{2}-1)=\frac{15x^{2}+3}{16}.
$$

**距離.** $|x|-p\perp p$ なので\ref{fa:cauchy-schwarz.4} から $\||x|-p\|_{2}^{2}=\||x|\|_{2}^{2}-\|p\|_{2}^{2}$、$\|p\|_{2}^{2}=\sum_{k}|\langle|x|,e_{k}\rangle|^{2}$（$e_{k}$ の正規直交性）。$\||x|\|_{2}^{2}=\frac23$ なので
$$
\||x|-p\|_{2}^{2}=\frac23-\Bigl(\frac12+\frac{5}{32}\Bigr)=\frac{64-63}{96}=\frac{1}{96},\qquad\||x|-p\|_{2}=\frac{1}{4\sqrt6}.
$$
:::

::: problem ★★ 標準：積分汎関数の表現 {#fa:ex-hs-2}
実数値の $L^{2}([0,1])$ 上の $\varphi(f)\defeq\int_{0}^{1}\Bigl(\int_{0}^{x}f(t)\,dt\Bigr)dx$ について、$\varphi(f)=\langle f,y\rangle$ となる $y$ と $\|\varphi\|$ を求めよ。また、$\varphi(f)=1$ を満たす $f$ のうちノルムが最小のものを求めよ。
:::

::: solution
**表現.** $f\in L^{2}([0,1])$ は\ref{meas:holder}（$p=q=2$）から $\int_{0}^{1}|f|\le\|f\|_{2}<\infty$ を満たし、内側の積分はすべての $x$ で定まる。$F(x,t)\defeq\mathbf{1}_{\{0<t<x<1\}}f(t)$ は $\mathbb{R}^{2}$ 上ルベーグ可測で、\ref{meas:fubini-lebesgue} を $|F|$ に使うと $\iint|F|=\int_{0}^{1}|f(t)|(1-t)\,dt\le\int_{0}^{1}|f|<\infty$。よって $F$ は可積分で、同じ定理を $F$ に使って積分の順序を交換すると
$$
\varphi(f)=\int_{0}^{1}f(t)\Bigl(\int_{t}^{1}dx\Bigr)dt=\int_{0}^{1}f(t)(1-t)\,dt=\langle f,y\rangle,\qquad y(t)\defeq1-t.
$$
$\varphi$ は線形で、\ref{fa:cauchy-schwarz.1} から有界。\ref{fa:riesz-representation} から表現する $y$ は一意で、$\|\varphi\|=\|y\|_{2}=\bigl(\int_{0}^{1}(1-t)^{2}dt\bigr)^{1/2}=\frac{1}{\sqrt3}$。

**最小ノルム.** $\operatorname{span}\{y\}$ は閉（\ref{fa:finite-dim-norms-equivalent.3}）なので、\ref{fa:orthogonal-decomposition.2} から $f=cy+z$（$c\in\mathbb{R}$, $z\perp y$）と書ける。$\varphi(f)=c\|y\|_{2}^{2}=\frac c3$ なので $\varphi(f)=1\iff c=3$。このときピタゴラスから
$$
\|f\|_{2}^{2}=9\|y\|_{2}^{2}+\|z\|_{2}^{2}=3+\|z\|_{2}^{2}\ge3,
$$
等号は $z=0$ のときに限る。よって最小ノルムの $f$ はただ一つ $f(t)=3(1-t)$ で、最小値は $\sqrt3=1/\|\varphi\|$。
:::

::: problem ★★★ 発展：稠密な超平面と閉じた超平面 {#fa:ex-hs-3}
$\ell^{2}$（$\mathbb{K}$ 値）で考える。
1. $N\defeq\{a\in c_{00}:\sum_{n}a_{n}=0\}$ は $\ell^{2}$ で稠密であることを示せ。また $e_{1}$ に収束する $N$ の列を具体的に与えよ。
2. $y\defeq(2^{-n})_{n\ge1}$、$M\defeq\{a\in\ell^{2}:\sum_{n}a_{n}2^{-n}=0\}$ とする。$M$ は閉部分空間であることを示し、$e_{1}$ の $M$ への直交射影と $\operatorname{dist}(e_{1},M)$ を求めよ。
3. 1 と 2 の違いを、汎関数の有界性の観点から説明せよ。
:::

::: solution
**1.** \ref{fa:orthogonal-decomposition.3} から $\overline{N}=N^{\perp\perp}$ なので、$N^{\perp}=0$ を示せばよい（そのとき $\overline{N}=0^{\perp}=\ell^{2}$）。$z\in N^{\perp}$ とする。$e_{1}-e_{n}\in N$ なので $0=\langle e_{1}-e_{n},z\rangle=\overline{z_{1}}-\overline{z_{n}}$、すなわち $z_{n}=z_{1}$（すべての $n$）。$\sum|z_{n}|^{2}<\infty$ から $z_{n}\to0$ なので $z_{1}=0$、$z=0$。

具体的には $x_{n}\defeq e_{1}-\frac1n\sum_{k=1}^{n}e_{k}$ とすると成分の和は $1-1=0$ で $x_{n}\in N$、$\|e_{1}-x_{n}\|_{2}=\bigl\|\frac1n\sum_{k=1}^{n}e_{k}\bigr\|_{2}=\frac{1}{\sqrt n}\to0$。

**2.** $y\in\ell^{2}$ で $\|y\|_{2}^{2}=\sum_{n\ge1}4^{-n}=\frac13$。$\sum a_{n}2^{-n}=\langle a,y\rangle$（$y$ は実数）なので $M=\ker\langle\cdot,y\rangle=\{y\}^{\perp}$ は、連続な汎関数の核として閉部分空間。\ref{fa:orthogonal-decomposition.3} から $M^{\perp}=\{y\}^{\perp\perp}=\overline{\operatorname{span}\{y\}}=\operatorname{span}\{y\}$（有限次元なので閉、\ref{fa:finite-dim-norms-equivalent.3}）。\ref{fa:orthogonal-decomposition.2} から $e_{1}-P_{M}e_{1}\in M^{\perp}$ なので $e_{1}-P_{M}e_{1}=cy$ と書け、$y$ との内積をとると（$P_{M}e_{1}\perp y$）$\langle e_{1},y\rangle=c\|y\|_{2}^{2}$、$c=\frac{1/2}{1/3}=\frac32$。よって
$$
P_{M}e_{1}=e_{1}-\frac32y=\Bigl(\frac14,-\frac38,-\frac{3}{16},\dots\Bigr),\qquad\operatorname{dist}(e_{1},M)=\frac32\|y\|_{2}=\frac{\sqrt3}{2}.
$$
（検算：$\langle P_{M}e_{1},y\rangle=\frac14\cdot\frac12-\frac32\sum_{n\ge2}4^{-n}=\frac18-\frac32\cdot\frac{1}{12}=0$。）

**3.** 2 の $M$ は有界な汎関数 $\langle\cdot,y\rangle$ の核なので閉で、$\ell^{2}$ と異なる。1 の $N$ は $c_{00}$ 上の線形汎関数 $s(a)\defeq\sum a_{n}$ の核で、$s$ は $\|\cdot\|_{2}$ について有界でない：$s(\sum_{k=1}^{n}e_{k})=n$、$\|\sum_{k=1}^{n}e_{k}\|_{2}=\sqrt n$。実際、$s$ が有界なら $|s(e_{1})|=|s(e_{1}-x_{n})|\le C\|e_{1}-x_{n}\|_{2}\to0$ となり $s(e_{1})=1$ に反する。非有界な汎関数の核は稠密になりうる、という現象である。
:::

## ハーン–バナッハの定理 {#fa:sec-hb-exercises}

対応するページ：\ref{fa:page-hahn-banach}

::: problem ★ 基本：ノルムを与える汎関数の一意性 {#fa:ex-hb-1}
1. $\ell^{1}$ で、$\|\varphi\|=1$, $\varphi(e_{1})=\|e_{1}\|_{1}$ となる $\varphi\in(\ell^{1})^{*}$ が無数にあることを示せ。
2. 一般の $x\in\ell^{1}$, $x\ne0$ について、\ref{fa:hahn-banach-normed.2} の $\varphi$ を選択公理を使わずに具体的に与えよ。
3. ヒルベルト空間 $H$ では、$x\ne0$ について $\|\varphi\|=1$, $\varphi(x)=\|x\|$ となる $\varphi\in H^{*}$ はただ一つであることを示せ。
:::

::: solution
**1.** $|t|\le1$ について $\varphi_{t}(a)\defeq a_{1}+ta_{2}$ とおく。$|\varphi_{t}(a)|\le|a_{1}|+|a_{2}|\le\|a\|_{1}$ なので $\|\varphi_{t}\|\le1$ で、$\varphi_{t}(e_{1})=1=\|e_{1}\|_{1}$ から $\|\varphi_{t}\|=1$。$\varphi_{t}(e_{2})=t$ なので $t$ が異なれば $\varphi_{t}$ も異なる。

**2.** $\varphi(a)\defeq\sum_{n}\overline{\operatorname{sgn}x_{n}}\,a_{n}$ とおく。$|\varphi(a)|\le\sum|a_{n}|=\|a\|_{1}$ で $\|\varphi\|\le1$、$\varphi(x)=\sum|x_{n}|=\|x\|_{1}$ なので $\|\varphi\|=1$。

**3.** 存在は $\varphi\defeq\langle\cdot,x/\|x\|\rangle$。一意性：条件を満たす $\varphi$ は \ref{fa:riesz-representation} から $\varphi=\langle\cdot,y\rangle$, $\|y\|=1$, $\langle x,y\rangle=\|x\|$ と書ける。このとき
$$
\|x-\|x\|y\|^{2}=\|x\|^{2}-2\|x\|\operatorname{Re}\langle x,y\rangle+\|x\|^{2}\|y\|^{2}=\|x\|^{2}-2\|x\|^{2}+\|x\|^{2}=0
$$
なので $y=x/\|x\|$。（1 との違いは、$\ell^{1}$ の単位球が「平らな面」をもち、中線定理が成り立たないことによる。）
:::

::: problem ★★ 標準：バナッハ極限 {#fa:ex-hb-2}
実数値の $\ell^{\infty}$ 上のシフト $(Sa)_{n}\defeq a_{n+1}$ を考える。線形汎関数 $L\colon\ell^{\infty}\to\mathbb{R}$ で、
$$
\liminf_{n\to\infty}a_{n}\le L(a)\le\limsup_{n\to\infty}a_{n},\qquad L(Sa)=L(a)
$$
をすべての $a\in\ell^{\infty}$ で満たすものが存在することを示せ。また $L(1,0,1,0,\dots)$ を求めよ。
:::

::: solution
$\sigma_{n}(a)\defeq\frac1n(a_{1}+\dots+a_{n})$、$p(a)\defeq\limsup_{n}\sigma_{n}(a)$ とおく（$|\sigma_{n}(a)|\le\|a\|_{\infty}$ なので有限）。

**Step 1（$p$ は劣線形）.** $\sigma_{n}(a+b)=\sigma_{n}(a)+\sigma_{n}(b)$ と $\limsup(x_{n}+y_{n})\le\limsup x_{n}+\limsup y_{n}$ から $p(a+b)\le p(a)+p(b)$。$t\ge0$ なら $p(ta)=tp(a)$。

**Step 2（$p(a)\le\limsup a_{n}$）.** $\lambda>\limsup a_{n}$ をとると、$K$ があって $k>K$ で $a_{k}<\lambda$。$n>K$ で
$$
\sigma_{n}(a)\le\frac1n\sum_{k\le K}a_{k}+\frac{n-K}{n}\lambda\xrightarrow{n\to\infty}\lambda
$$
なので $p(a)\le\lambda$。$\lambda$ は任意なので $p(a)\le\limsup a_{n}$。

**Step 3（延長）.** 収束列の部分空間 $c$ 上 $\ell(a)\defeq\lim a_{n}$ とおく。$a\in c$ なら Step 2 を $-a$ に使って $p(-a)\le\limsup(-a_{n})=-\ell(a)$ なので
$$
p(a)=\limsup_{n}\sigma_{n}(a)\ge\liminf_{n}\sigma_{n}(a)=-p(-a)\ge\ell(a).
$$
よって $c$ 上 $\ell\le p$。\ref{fa:hahn-banach-real} から線形な $L\colon\ell^{\infty}\to\mathbb{R}$ で $L\restriction c=\ell$, $L\le p$ となるものがある（選択公理）。

**Step 4（性質）.** Step 2 から $L(a)\le p(a)\le\limsup a_{n}$。$-a$ に使うと $-L(a)=L(-a)\le\limsup(-a_{n})=-\liminf a_{n}$、すなわち $L(a)\ge\liminf a_{n}$。シフト不変性：$\sigma_{n}(Sa-a)=\frac1n(a_{n+1}-a_{1})$ で $|\sigma_{n}(Sa-a)|\le\frac{2\|a\|_{\infty}}{n}\to0$ なので $p(Sa-a)=0$、同様に $p(a-Sa)=0$。よって $L(Sa)-L(a)\le0$ かつ $L(a)-L(Sa)\le0$、$L(Sa)=L(a)$。

**計算.** $a=(1,0,1,0,\dots)$ について $a+Sa=(1,1,1,\dots)\in c$ なので $2L(a)=L(a)+L(Sa)=L(a+Sa)=1$、$L(a)=\frac12$。（$|L(a)|\le\|a\|_{\infty}$ なので $L\in(\ell^{\infty})^{*}$, $\|L\|=1$ でもある。）
:::

::: problem ★★★ 発展：部分空間の双対 {#fa:ex-hb-3}
$X$ をノルム空間、$M$ をその部分空間とし、$M^{\perp}\defeq\{\varphi\in X^{*}:\varphi\restriction M=0\}$ とおく。
1. $M^{\perp}$ は $X^{*}$ の閉部分空間であることを示せ。
2. $R(\varphi+M^{\perp})\defeq\varphi\restriction M$ は、商空間 $X^{*}/M^{\perp}$（商ノルム）から $M^{*}$ への線形な等長全単射であることを示せ。
3. 各 $\varphi\in X^{*}$ について、$\operatorname{dist}(\varphi,M^{\perp})=\sup_{m\in M,\ \|m\|\le1}|\varphi(m)|$ であり、左辺の下限は達成されることを示せ。
:::

::: solution
**1.** $m\in M$ について $\varphi\mapsto\varphi(m)$ は線形で $|\varphi(m)|\le\|\varphi\|\|m\|$ から連続。$M^{\perp}=\bigcap_{m\in M}\{\varphi:\varphi(m)=0\}$ は閉部分空間の共通部分なので閉部分空間。よって \ref{fa:quotient-norm} から $X^{*}/M^{\perp}$ に商ノルムが入る。

**2.** **well-defined・線形・単射.** $\varphi-\psi\in M^{\perp}$ なら $\varphi\restriction M=\psi\restriction M$ なので代表元によらず、線形性は明らか。$\varphi\restriction M=0$ なら $\varphi\in M^{\perp}$ で類は $0$。**全射.** $f\in M^{*}$ は \ref{fa:hahn-banach-normed.1} から $\|F\|=\|f\|$ となる $F\in X^{*}$ に延長でき、$R(F+M^{\perp})=f$（選択公理）。**等長.** $\psi\in M^{\perp}$ について $\|\varphi\restriction M\|=\|(\varphi-\psi)\restriction M\|\le\|\varphi-\psi\|$、下限をとって $\|\varphi\restriction M\|\le\|\varphi+M^{\perp}\|$。逆に $\varphi\restriction M$ の延長 $F$ で $\|F\|=\|\varphi\restriction M\|$ となるものをとると、$\psi_{0}\defeq\varphi-F\in M^{\perp}$ で
$$
\|\varphi+M^{\perp}\|\le\|\varphi-\psi_{0}\|=\|F\|=\|\varphi\restriction M\|.
$$

**3.** $\operatorname{dist}(\varphi,M^{\perp})=\|\varphi+M^{\perp}\|=\|\varphi\restriction M\|=\sup_{m\in M,\|m\|\le1}|\varphi(m)|$ は 2 そのもの。2 の証明の $\psi_{0}\in M^{\perp}$ が $\|\varphi-\psi_{0}\|=\operatorname{dist}(\varphi,M^{\perp})$ を満たすので、下限は達成される。（$X$ 自身の点と閉部分空間の距離の下限は、一般には達成されないことと対照的である。たとえば $X=\{f\in C([0,1]):f(0)=0\}$, $M=\ker\int_{0}^{1}$ で $x\notin M$ について $\|x-m_{0}\|_{\infty}=\operatorname{dist}(x,M)=|\int_{0}^{1}x|$ となる $m_{0}\in M$ があれば、$g\defeq(x-m_{0})/\|x-m_{0}\|_{\infty}$ は $\|g\|_{\infty}=1$, $g(0)=0$, $|\int_{0}^{1}g|=1$ を満たすが、$\|g\|_{\infty}=1$, $g(0)=0$ なら $|\int_{0}^{1}g|<1$ である（連続性から $0$ の近くで $|g|\le\frac12$）。）
:::

## ベールの定理の帰結 {#fa:sec-bc-exercises}

対応するページ：\ref{fa:page-baire-consequences}

::: problem ★ 基本：閉グラフだが有界でない微分 {#fa:ex-bc-1}
$C^{1}([0,1])$（実数値）に $\|\cdot\|_{\infty}$ を入れた空間を $X_{0}$ とし、$D\colon X_{0}\to C([0,1])$, $Df\defeq f'$ とする。$D$ のグラフは閉で、$D$ は有界でないことを示せ。これと \ref{fa:closed-graph} から、$X_{0}$ は完備でないことを導け。完備でないことを示すコーシー列を一つ具体的に与えよ。
:::

::: solution
**グラフが閉.** $f_{n}\to f$（$X_{0}$）、$f_{n}'\to g$（$C([0,1])$）とする。$(f_{n}')$ は一様収束し $(f_{n}(0))$ は収束するので、\ref{calc:uniform-derivative} から $f_{n}$ は微分可能な関数に一様収束し、その導関数は $g$。一様極限は一意なのでその関数は $f$ で、$f'=g$ は連続、すなわち $f\in X_{0}$, $Df=g$。

**非有界.** $f_{n}(x)\defeq x^{n}$ は $\|f_{n}\|_{\infty}=1$, $\|Df_{n}\|_{\infty}=n$。

**完備でない.** $C([0,1])$ はバナッハ空間。$X_{0}$ も完備なら \ref{fa:closed-graph} から $D$ は有界となり矛盾。具体例：$f_{n}(x)\defeq\sqrt{(x-\frac12)^{2}+\frac1n}\in X_{0}$ は、$u\defeq x-\frac12$ について
$$
0\le\sqrt{u^{2}+\tfrac1n}-|u|=\frac{1/n}{\sqrt{u^{2}+1/n}+|u|}\le\frac{1}{\sqrt n}
$$
から $|x-\frac12|$ に一様収束するのでコーシー列だが、極限 $|x-\frac12|$ は $x=\frac12$ で微分可能でなく、$X_{0}$ で収束しない（$X_{0}\subset C([0,1])$ での極限は一意）。
:::

::: problem ★★ 標準：c₀ と掛けて収束する数列 {#fa:ex-bc-2}
数列 $(b_{n})$ が、すべての $a\in c_{0}$ について $\sum_{n}a_{n}b_{n}$ が収束するという性質をもつとする。$(b_{n})\in\ell^{1}$ であることを示せ。とくに、$\sum_{n}a_{n}/n$ が発散する $a\in c_{0}$ が存在することを示せ。
:::

::: solution
$c_{0}$ は $\ell^{\infty}$ の閉部分空間（\ref{fa:prob-ns-c0}）で、$\ell^{\infty}$ は完備なので $c_{0}$ はバナッハ空間（\ref{top:complete-closed.1}）。$T_{N}(a)\defeq\sum_{n\le N}a_{n}b_{n}$ は線形で $|T_{N}a|\le(\sum_{n\le N}|b_{n}|)\|a\|_{\infty}$ なので $T_{N}\in c_{0}^{*}$、$\|T_{N}\|\le\sum_{n\le N}|b_{n}|$。$u^{(N)}_{n}\defeq\overline{\operatorname{sgn}b_{n}}$（$n\le N$）、$0$（$n>N$）とおくと $u^{(N)}\in c_{0}$, $\|u^{(N)}\|_{\infty}\le1$、$T_{N}u^{(N)}=\sum_{n\le N}|b_{n}|$ なので $\|T_{N}\|=\sum_{n\le N}|b_{n}|$。

仮定から各 $a$ で $(T_{N}a)_{N}$ は収束し、とくに有界。\ref{fa:uniform-boundedness} から $\sup_{N}\|T_{N}\|=\sum_{n}|b_{n}|<\infty$。

$b_{n}=1/n$ は $\sum1/n=\infty$ なので $\ell^{1}$ に属さず、前半の対偶から $\sum a_{n}/n$ が発散する $a\in c_{0}$ がある（存在証明。ベールの定理を通して従属選択公理を使う）。逆に $b\in\ell^{1}$ なら $\sum|a_{n}b_{n}|\le\|a\|_{\infty}\|b\|_{1}$ で収束するので、性質は $b\in\ell^{1}$ と同値である。
:::

::: problem ★★★ 発展：閉部分空間の直和と射影 {#fa:ex-bc-3}
$X$ をバナッハ空間、$M,N$ を閉部分空間で $M\cap N=\{0\}$, $M+N=X$ とする。$P(m+n)\defeq m$（$m\in M$, $n\in N$）は有界線形作用素であることを示せ。さらに、定数 $C$ で $\|m\|+\|n\|\le C\|m+n\|$（$m\in M$, $n\in N$）となるものがあること、および
$$
\inf\{\|m-n\|:m\in M,\ n\in N,\ \|m\|=1\}>0
$$
（$M\ne0$ のとき）を示せ。
:::

::: solution
**well-defined・線形.** $M\cap N=0$ から $x=m+n$ の分解は一意で、$P$ は線形、$P^{2}=P$, $\ker P=N$。

**グラフが閉.** $x_{k}\to x$, $Px_{k}\to y$ とする。$Px_{k}\in M$ で $M$ は閉なので $y\in M$。$x_{k}-Px_{k}\in N$ で $x_{k}-Px_{k}\to x-y$、$N$ は閉なので $x-y\in N$。よって $x=y+(x-y)$ は $M\oplus N$ の分解で、$Px=y$。\ref{fa:closed-graph}（$X$ はバナッハ空間）から $P$ は有界（ベールの定理と開写像定理を通して従属選択公理を使う）。

**評価.** $x=m+n$ について $\|m\|=\|Px\|\le\|P\|\|x\|$, $\|n\|=\|x-Px\|\le(1+\|P\|)\|x\|$ なので $C\defeq1+2\|P\|$ でよい。$m\in M$, $\|m\|=1$, $n\in N$ について $m-n=m+(-n)$ なので $1=\|m\|=\|P(m-n)\|\le\|P\|\|m-n\|$、よって下限は $\ge1/\|P\|>0$（$M\ne0$ なら $\|P\|\ge1$ で $P\ne0$）。

（$M$, $N$ の閉性は欠かせない。逆に有界な射影 $P$ で $P^{2}=P$ なら $\operatorname{im}P=\ker(I-P)$, $\ker P$ はともに閉で、この形の分解を与える。）
:::

## 双対空間と弱位相 {#fa:sec-dw-exercises}

対応するページ：\ref{fa:page-duality-weak-topologies}

::: problem ★ 基本：集中する関数の弱収束 {#fa:ex-dw-1}
$[0,1]$ 上のルベーグ測度について、$1\le p<\infty$ に対し $f_{n}\defeq n^{1/p}\mathbf{1}_{[0,1/n]}\in L^{p}([0,1])$ とおく。
1. $1<p<\infty$ なら $f_{n}\rightharpoonup0$ だが、$(f_{n})$ はノルム収束する部分列をもたないことを示せ。
2. $p=1$ なら $(f_{n})$ はどの元にも弱収束しないことを示せ。
:::

::: solution
$\|f_{n}\|_{p}^{p}=n\cdot\frac1n=1$。

**1.** \ref{fa:lp-dual}（ルベーグ測度は $[0,1]$ 上有限）から $(L^{p})^{*}$ の元は $g\in L^{q}$（$1<q<\infty$）による $f\mapsto\int fg$ の形。$f_{n}=f_{n}\mathbf{1}_{[0,1/n]}$ なので \ref{meas:holder} から
$$
\Bigl|\int f_{n}g\Bigr|\le\|f_{n}\|_{p}\Bigl(\int_{[0,1/n]}|g|^{q}\Bigr)^{1/q}=\Bigl(\int|g|^{q}\mathbf{1}_{[0,1/n]}\Bigr)^{1/q}.
$$
$|g|^{q}\mathbf{1}_{[0,1/n]}\to0$（$x\ne0$ で）で $|g|^{q}$ に支配されるので、\ref{meas:dominated-convergence} から右辺 $\to0$（$q<\infty$ を使った）。よって $f_{n}\rightharpoonup0$。部分列が $h$ にノルム収束すれば弱収束もし（\ref{fa:weak-convergence-basic.2}）、弱極限は一意（\ref{fa:weak-convergence-basic.1}）なので $h=0$。しかし $\|f_{n}\|_{p}=1$ なので $0$ にノルム収束しない。（$\|0\|<\liminf\|f_{n}\|_{p}=1$ で、\ref{fa:weak-convergence-basic.3} の不等式は等号とは限らない。）

**2.** $p=1$ では $f_{n}=n\mathbf{1}_{[0,1/n]}$。$g\in L^{\infty}$ について $f\mapsto\int fg$ は $|\int fg|\le\|g\|_{\infty}\|f\|_{1}$ から $(L^{1})^{*}$ の元。$f_{n}\rightharpoonup f$ と仮定する。$\delta\in(0,1)$ について $g\defeq\overline{\operatorname{sgn}f}\,\mathbf{1}_{[\delta,1]}\in L^{\infty}$ とすると、$n>1/\delta$ で $f_{n}g=0$ なので
$$
\int_{[\delta,1]}|f|=\int fg=\lim_{n}\int f_{n}g=0.
$$
$\delta=\frac1k$（$k=2,3,\dots$）について $[\frac1k,1]$ 上ほとんど至る所 $f=0$ なので、$[0,1]$ 上ほとんど至る所 $f=0$。一方 $g=1$ では $\int f_{n}=1$ がすべての $n$ で成り立つので $\int f=1$ となり矛盾。（同じ議論で、どの部分列も弱収束しない。）
:::

::: problem ★★ 標準：c₀ の双対は ℓ¹ {#fa:ex-dw-2}
1. $g\in\ell^{1}$ に $\Psi g\colon a\mapsto\sum_{n}a_{n}g_{n}$ を対応させる $\Psi\colon\ell^{1}\to c_{0}^{*}$ は線形な等長同型であることを示せ。
2. $c_{0}$ の列 $(a^{(k)})_{k}$ が $a\in c_{0}$ に弱収束する $\iff$ $(a^{(k)})$ が有界で、各 $n$ で $a^{(k)}_{n}\to a_{n}$、を示せ。とくに $e_{k}\rightharpoonup0$ だがノルム収束しない。
:::

::: solution
**1.** **有界性.** $|\sum a_{n}g_{n}|\le\sum|a_{n}||g_{n}|\le\|a\|_{\infty}\|g\|_{1}$ なので級数は絶対収束し、$\Psi g\in c_{0}^{*}$、$\|\Psi g\|\le\|g\|_{1}$。線形性は明らか。

**等長.** $u^{(N)}_{n}\defeq\overline{\operatorname{sgn}g_{n}}$（$n\le N$）、$0$（$n>N$）とすると $u^{(N)}\in c_{0}$, $\|u^{(N)}\|_{\infty}\le1$、$(\Psi g)(u^{(N)})=\sum_{n\le N}|g_{n}|$。$N\to\infty$ で $\|\Psi g\|\ge\|g\|_{1}$。

**全射.** $\varphi\in c_{0}^{*}$ について $g_{n}\defeq\varphi(e_{n})$ とおく。上の $u^{(N)}$ について
$$
\sum_{n\le N}|g_{n}|=\sum_{n\le N}\overline{\operatorname{sgn}g_{n}}\,\varphi(e_{n})=\varphi(u^{(N)})\le\|\varphi\|
$$
なので $g\in\ell^{1}$。$a\in c_{0}$ について $\|a-\sum_{n\le N}a_{n}e_{n}\|_{\infty}=\sup_{n>N}|a_{n}|\to0$（$a_{n}\to0$）なので、$\varphi$ の連続性から $\varphi(a)=\lim_{N}\sum_{n\le N}a_{n}g_{n}=(\Psi g)(a)$。（選択公理は使わない。）

**2.** $\Rightarrow$：有界性は \ref{fa:weak-convergence-basic.3}。座標 $a\mapsto a_{n}$ は $\Psi e_{n}\in c_{0}^{*}$ なので $a^{(k)}_{n}\to a_{n}$。$\Leftarrow$：$\|a^{(k)}\|_{\infty}\le K$ とする。1 から $c_{0}^{*}$ の元は $\Psi g$（$g\in\ell^{1}$）の形。$\varepsilon>0$ について $N$ を $\sum_{n>N}|g_{n}|<\varepsilon$ ととると
$$
\Bigl|\sum_{n}(a^{(k)}_{n}-a_{n})g_{n}\Bigr|\le\sum_{n\le N}|a^{(k)}_{n}-a_{n}||g_{n}|+(K+\|a\|_{\infty})\varepsilon,
$$
第 1 項は有限和で $k\to\infty$ のとき $0$ に収束するので、$\limsup_{k}$ は $(K+\|a\|_{\infty})\varepsilon$ 以下。$\varepsilon$ は任意なので $(\Psi g)(a^{(k)})\to(\Psi g)(a)$。

$e_{k}$ は $\|e_{k}\|_{\infty}=1$ で、各座標は $k>n$ で $0$ なので $e_{k}\rightharpoonup0$。$\|e_{k}-0\|_{\infty}=1$ なのでノルム収束しない。
:::

::: problem ★★★ 発展：c₀ は回帰的でない {#fa:ex-dw-3}
$s_{N}\defeq e_{1}+\dots+e_{N}\in c_{0}$ とする。
1. $(s_{N})$ は有界だが、弱収束する部分列をもたないことを示せ。
2. $\Lambda(\varphi)\defeq\sum_{n}\varphi(e_{n})$ は $c_{0}^{**}$ の元で、$J(c_{0})$（\ref{fa:bidual-embedding}）に属さないことを示せ。したがって $c_{0}$ は回帰的でない。
3. 1 を \ref{fa:hilbert-weak-compactness} と比べよ。
:::

::: solution
**1.** $\|s_{N}\|_{\infty}=1$。部分列 $s_{N_{j}}$ が $s\in c_{0}$ に弱収束したとする。座標汎関数 $a\mapsto a_{k}$ は $|a_{k}|\le\|a\|_{\infty}$ から $c_{0}^{*}$ の元なので、$s_{k}=\lim_{j}(s_{N_{j}})_{k}=1$（$N_{j}\ge k$ で $(s_{N_{j}})_{k}=1$）がすべての $k$ で成り立ち、$s\notin c_{0}$ となり矛盾。

**2.** $\varphi\in c_{0}^{*}$ と $N$ について、$u^{(N)}_{n}\defeq\overline{\operatorname{sgn}\varphi(e_{n})}$（$n\le N$）、$0$（$n>N$）とすると $\|u^{(N)}\|_{\infty}\le1$ で
$$
\sum_{n\le N}|\varphi(e_{n})|=\varphi(u^{(N)})\le\|\varphi\|.
$$
よって $\Lambda(\varphi)$ は絶対収束し、$|\Lambda(\varphi)|\le\|\varphi\|$。$\Lambda$ は線形なので $\Lambda\in c_{0}^{**}$, $\|\Lambda\|\le1$。$\Lambda=J(a)$（$a\in c_{0}$）と仮定し、座標汎関数 $\pi_{k}(b)\defeq b_{k}$ に使うと
$$
a_{k}=\pi_{k}(a)=J(a)(\pi_{k})=\Lambda(\pi_{k})=\sum_{n}\pi_{k}(e_{n})=1
$$
がすべての $k$ で成り立ち、$a\notin c_{0}$ となり矛盾。よって $J$ は全射でない。（$\Lambda(\varphi)=\lim_{N}\varphi(s_{N})$ なので、$J(s_{N})$ は $c_{0}^{**}$ の汎弱位相で $\Lambda$ に収束する。$c_{0}$ の中には行き先がない、というのが 1 の現象である。選択公理は使わない。）

**3.** \ref{fa:hilbert-weak-compactness} から、ヒルベルト空間の有界列はつねに弱収束する部分列をもつ。1 はこの性質がバナッハ空間 $c_{0}$ では成り立たないことを示す。証明で使ったリースの表現定理（$H$ が自分の双対と同一視されること）の代わりになるものが $c_{0}$ にはなく、実際 $c_{0}$ は回帰的でない（2）。一方、回帰的な $L^{p}$（$1<p<\infty$、\ref{fa:lp-reflexive}）では有界列が弱収束する部分列をもつことが知られている。
:::
