# ノルム空間とバナッハ空間 {#fa:page-normed-spaces keywords="normed space, Banach space, examples l^p, C(K), L^p, completeness via absolutely convergent series, bounded linear operator, continuity equals boundedness, operator norm, B(X,Y) is complete, equivalence of norms in finite dimension, finite dimensional subspaces are closed, Riesz lemma, compact unit ball iff finite dimensional, quotient norm, unbounded linear functional"}

関数解析は、関数の空間を「無限次元のベクトル空間に距離（ノルム）を入れたもの」として扱い、線形代数と位相を組み合わせて調べる分野である。このページでは基本の舞台である**ノルム空間**と、完備なノルム空間である**バナッハ空間**を定義し、線形写像の連続性が「有界性」（作用素ノルムが有限）と同値であることを示す。有限次元ではすべてのノルムが同値で、単位球はコンパクトだが、無限次元では単位球はけっしてコンパクトでない（**リースの補題**）。この違いが、無限次元の解析に固有の道具（次のページ以降）を必要とする理由である。

## 記法と定義の確認 {#fa:sec-ns-notation}

::: notation
- $\mathbb{K}$ は $\mathbb{R}$ または $\mathbb{C}$。ベクトル空間・線形写像・次元・基底・商空間は \ref{lin:quotient-space} などの線形代数の系列による。
- 距離空間の完備性・コーシー列・部分空間の完備性・コンパクト性の同値な言い換え・最大値の定理・ハイネ–ボレルの定理は \ref{top:complete-metric}, \ref{top:cauchy-basic}, \ref{top:complete-closed}, \ref{top:compact-metric-equivalents}, \ref{top:extreme-value}, \ref{top:heine-borel}。
- $L^{p}$ 空間とその完備性は \ref{meas:lp-space}, \ref{meas:riesz-fischer}。
- **選択公理**：無限次元空間の上の非有界な線形汎関数の一般的な存在（補足）だけに使う。
:::

## ノルム空間 {#fa:sec-ns-normed}

::: definition ノルム空間とバナッハ空間 {#fa:normed-space keywords="norm on a vector space over R or C; normed space; metric d(x,y) = ||x - y||; Banach space: complete normed space; equivalent norms" index="ノルム空間|のるむくうかん, ノルム|のるむ, バナッハ空間|ばなっはくうかん, 同値なノルム|どうちなのるむ"}
$\mathbb{K}$ 上のベクトル空間 $X$ の**ノルム**とは、写像 $\|\cdot\|\colon X\to[0,\infty)$ で、(i) $\|x\|=0\iff x=0$、(ii) $\|cx\|=|c|\|x\|$、(iii) $\|x+y\|\le\|x\|+\|y\|$ を満たすものをいう。組 $(X,\|\cdot\|)$ を**ノルム空間**といい、距離 $d(x,y)\defeq\|x-y\|$ で距離空間とみる。完備なノルム空間を**バナッハ空間**という。二つのノルムは、正の定数 $c,C$ で $c\|x\|\le\|x\|'\le C\|x\|$（すべての $x$）となるとき**同値**という（同じ位相と同じコーシー列を定める）。
:::

::: example
1. $\mathbb{K}^{n}$ 上の $\|x\|_{p}\defeq(\sum|x_{i}|^{p})^{1/p}$（$1\le p<\infty$）、$\|x\|_{\infty}\defeq\max|x_{i}|$。
2. 測度空間上の $L^{p}(\mu)$（$1\le p\le\infty$）はバナッハ空間（\ref{meas:riesz-fischer}）。とくに数え上げ測度の $\ell^{p}$。
3. コンパクト空間 $K$ 上の連続関数の空間 $C(K)$ に $\|f\|_{\infty}\defeq\max_{K}|f|$（\ref{top:extreme-value}）。一様収束するコーシー列の極限は連続なのでバナッハ空間。
4. $c_{0}\defeq\{(a_{n})\in\ell^{\infty}:a_{n}\to0\}$ は $\ell^{\infty}$ の閉部分空間でバナッハ空間（問題 \ref{fa:prob-ns-c0}）。
:::

::: proposition 絶対収束級数による完備性の判定 {#fa:absolute-series-completeness keywords="a normed space is complete iff every absolutely convergent series converges" index="完備性と絶対収束級数|かんびせいとぜったいしゅうそくきゅうすう"}
ノルム空間 $X$ が完備 $\iff$ $\sum\|x_{k}\|<\infty$ ならつねに $\sum x_{k}$ が $X$ で収束する。
:::

::: proof
$\Rightarrow$：部分和 $s_{n}$ について $\|s_{m}-s_{n}\|\le\sum_{k=n+1}^{m}\|x_{k}\|$ でコーシー列。$\Leftarrow$：コーシー列 $(y_{n})$ について、$n_{1}<n_{2}<\cdots$ を $\|y_{n_{k+1}}-y_{n_{k}}\|<2^{-k}$ となるようにとり（各段で最小の番号）、$x_{k}\defeq y_{n_{k+1}}-y_{n_{k}}$ とすると $\sum x_{k}$ は絶対収束するので収束し、$y_{n_{k}}=y_{n_{1}}+\sum_{j<k}x_{j}$ は収束する。収束する部分列をもつコーシー列は収束する（\ref{top:cauchy-basic.3}）。
:::

## 有界線形作用素 {#fa:sec-ns-operators}

::: definition 有界線形作用素と作用素ノルム {#fa:bounded-operator keywords="bounded linear operator: ||Tx|| <= C ||x||; operator norm ||T|| = sup over the unit ball; B(X,Y); dual space X* = B(X, K)" index="有界線形作用素|ゆうかいせんけいさようそ, 作用素ノルム|さようそのるむ, 双対空間（ノルム空間）|そうついくうかんのるむくうかん, 有界線形汎関数|ゆうかいせんけいはんかんすう"}
ノルム空間 $X$, $Y$ の間の線形写像 $T$ が、定数 $C$ で $\|Tx\|\le C\|x\|$（すべての $x$）を満たすとき**有界**といい、
$$
\|T\|\defeq\sup_{\|x\|\le1}\|Tx\|
$$
を**作用素ノルム**という。有界線形作用素の全体を $B(X,Y)$、$B(X)\defeq B(X,X)$、$X^{*}\defeq B(X,\mathbb{K})$（**双対空間**、元は**有界線形汎関数**）と書く。
:::

::: proposition 連続性と有界性 {#fa:continuity-boundedness keywords="for a linear map between normed spaces: continuous iff continuous at 0 iff bounded; ||Tx|| <= ||T|| ||x||; operator norm is a norm; ||ST|| <= ||S|| ||T||" index="連続性と有界性|れんぞくせいとゆうかいせい"}
線形写像 $T\colon X\to Y$ について、(a) $T$ は連続、(b) $T$ は $0$ で連続、(c) $T$ は有界、は同値。有界なら $\|Tx\|\le\|T\|\|x\|$。$\|\cdot\|$ は $B(X,Y)$ のノルムで、$\|ST\|\le\|S\|\|T\|$。
:::

::: proof
(a)⇒(b) は明らか。(b)⇒(c)：$\varepsilon=1$ について $\delta>0$ で $\|x\|\le\delta\Rightarrow\|Tx\|\le1$ となるものがあり、$x\ne0$ なら $\|Tx\|=\frac{\|x\|}{\delta}\|T(\frac{\delta x}{\|x\|})\|\le\frac1\delta\|x\|$。(c)⇒(a)：$\|Tx-Tx'\|=\|T(x-x')\|\le C\|x-x'\|$（リプシッツ）。$\|Tx\|\le\|T\|\|x\|$ は $x/\|x\|$ に定義を使う。ノルムの公理は上限の性質から（三角不等式は $\|(S+T)x\|\le\|Sx\|+\|Tx\|$）。$\|STx\|\le\|S\|\|Tx\|\le\|S\|\|T\|\|x\|$。
:::

::: theorem 作用素の空間の完備性 {#fa:operator-space-complete keywords="if Y is a Banach space then B(X,Y) is a Banach space; in particular the dual space X* is always a Banach space" index="作用素の空間の完備性|さようそのくうかんのかんびせい"}
$Y$ がバナッハ空間なら $B(X,Y)$ はバナッハ空間。とくに $X^{*}$ はつねにバナッハ空間。
:::

::: proof
$(T_{n})$ をコーシー列とする。各 $x$ で $\|T_{n}x-T_{m}x\|\le\|T_{n}-T_{m}\|\|x\|$ なので $(T_{n}x)$ はコーシー列で、極限 $Tx$ がある。$T$ は線形（極限の線形性）。$\varepsilon>0$ について $N$ を $n,m\ge N\Rightarrow\|T_{n}-T_{m}\|\le\varepsilon$ とすると、$\|x\|\le1$ で $\|T_{n}x-T_{m}x\|\le\varepsilon$、$m\to\infty$ で $\|T_{n}x-Tx\|\le\varepsilon$。よって $T_{n}-T$ は有界（したがって $T=T_{n}-(T_{n}-T)$ も有界）で $\|T_{n}-T\|\le\varepsilon$（$n\ge N$）。
:::

## 有限次元 {#fa:sec-ns-finite}

::: theorem 有限次元のノルムの同値 {#fa:finite-dim-norms-equivalent keywords="all norms on a finite dimensional vector space are equivalent; finite dimensional normed spaces are complete; finite dimensional subspaces are closed; linear maps from finite dimensional spaces are bounded" index="有限次元のノルムの同値性|ゆうげんじげんののるむのどうちせい"}
$X$ を有限次元とする。
1. $X$ 上のすべてのノルムは同値。
2. $X$ はどのノルムについても完備で、有界閉集合はコンパクト。
3. ノルム空間 $Z$ の有限次元部分空間は閉。
4. $X$ から任意のノルム空間への線形写像は有界。
:::

::: proof
**1.** 基底 $e_{1},\dots,e_{n}$ を固定し、$x=\sum c_{i}e_{i}$ について $|x|_{1}\defeq\sum|c_{i}|$ とおく。任意のノルム $\|\cdot\|$ が $|\cdot|_{1}$ と同値なことを示せば十分。$\|x\|\le\sum|c_{i}|\|e_{i}\|\le M|x|_{1}$（$M\defeq\max\|e_{i}\|$）。とくに $\|\cdot\|$ は $|\cdot|_{1}$ に関して連続（$|\|x\|-\|y\||\le M|x-y|_{1}$）。$S\defeq\{x:|x|_{1}=1\}$ は、座標で $\mathbb{K}^{n}$（$\mathbb{C}^{n}=\mathbb{R}^{2n}$）の有界閉集合と同一視されるのでコンパクト（\ref{top:heine-borel}）。$\|\cdot\|$ は $S$ 上で最小値 $m$ をとり（\ref{top:extreme-value}）、$S$ は $0$ を含まないので $m>0$。$x\ne0$ について $\|x\|=|x|_{1}\|x/|x|_{1}\|\ge m|x|_{1}$。

**2.** 1 から $|\cdot|_{1}$ の場合に示せばよく、座標で $\mathbb{K}^{n}$ のノルムと同一視すれば完備性（$\mathbb{K}$ の完備性）とハイネ–ボレルの定理から。

**3.** 有限次元部分空間は 2 から完備で、距離空間の完備な部分集合は閉（\ref{top:complete-closed}）。

**4.** $|Tx|\le\sum|c_{i}|\|Te_{i}\|\le(\max\|Te_{i}\|)|x|_{1}$ と 1。
:::

::: lemma リースの補題 {#fa:riesz-lemma keywords="Riesz lemma: for a proper closed subspace M of a normed space and theta < 1 there is a unit vector at distance at least theta from M" index="リースの補題|りーすのほだい"}
$M$ をノルム空間 $X$ の閉部分空間で $M\ne X$、$0<\theta<1$ とすると、$\|x\|=1$ で $\operatorname{dist}(x,M)\ge\theta$ となる $x$ がある。
:::

::: proof
$y\notin M$ をとると、$M$ が閉なので $d\defeq\operatorname{dist}(y,M)>0$。$m_{0}\in M$ を $\|y-m_{0}\|\le d/\theta$ となるようにとり、$x\defeq\frac{y-m_{0}}{\|y-m_{0}\|}$ とおく。$m\in M$ について $m_{0}+\|y-m_{0}\|m\in M$ なので
$$
\|x-m\|=\frac{\|y-(m_{0}+\|y-m_{0}\|m)\|}{\|y-m_{0}\|}\ge\frac{d}{d/\theta}=\theta.
$$
:::

::: theorem 単位球のコンパクト性 {#fa:compact-unit-ball keywords="the closed unit ball of a normed space is compact iff the space is finite dimensional" index="単位球のコンパクト性|たんいきゅうのこんぱくとせい"}
ノルム空間 $X$ の閉単位球 $\{\|x\|\le1\}$ がコンパクト $\iff$ $X$ は有限次元。
:::

::: proof
$\Leftarrow$ は \ref{fa:finite-dim-norms-equivalent.2}。$\Rightarrow$：$X$ が無限次元なら、単位ベクトル $x_{1},x_{2},\dots$ で $\|x_{n}-x_{m}\|\ge\frac12$（$n\ne m$）となるものを帰納的に作る：$x_{1},\dots,x_{n}$ の張る部分空間 $M_{n}$ は有限次元なので閉（\ref{fa:finite-dim-norms-equivalent.3}）で $X$ と異なり、\ref{fa:riesz-lemma}（$\theta=\frac12$）で $x_{n+1}$ をとる（従属選択公理。各段で一つ選ぶ）。この列は収束する部分列をもたないので、単位球は点列コンパクトでなく、コンパクトでない（\ref{top:compact-metric-equivalents}）。
:::

## 商空間 {#fa:sec-ns-quotient}

::: proposition 商ノルム {#fa:quotient-norm keywords="quotient of a normed space by a closed subspace with the quotient norm ||x + M|| = dist(x, M); the quotient of a Banach space is a Banach space; the quotient map has norm at most 1" index="商ノルム|しょうのるむ, 商空間（ノルム空間）|しょうくうかんのるむくうかん"}
$M$ をノルム空間 $X$ の閉部分空間とする。$\|x+M\|\defeq\operatorname{dist}(x,M)=\inf_{m\in M}\|x-m\|$ は $X/M$ のノルムで、商写像 $\pi$ は $\|\pi x\|\le\|x\|$ を満たす。$X$ がバナッハ空間なら $X/M$ もバナッハ空間。
:::

::: proof
**ノルム.** 剰余類の代表元によらない（$M$ は部分空間）。$\|x+M\|=0$ なら $x$ は $M$ の閉包、すなわち $M$ に属し、$x+M=0$。斉次性は $c\ne0$ なら $\operatorname{dist}(cx,M)=|c|\operatorname{dist}(x,M)$（$cM=M$）。三角不等式は $\|x+y-(m+m')\|\le\|x-m\|+\|y-m'\|$ の下限。$\|\pi x\|\le\|x-0\|$。

**完備性.** \ref{fa:absolute-series-completeness} を使う。$\sum\|\pi x_{k}\|<\infty$ とし、代表元 $y_{k}\in x_{k}+M$ を $\|y_{k}\|\le\|\pi x_{k}\|+2^{-k}$ となるように選ぶ（可算選択公理）。$\sum\|y_{k}\|<\infty$ なので $\sum y_{k}$ は $X$ で収束し、$\pi$ の連続性から $\sum\pi x_{k}=\pi(\sum y_{k})$ が収束する。
:::

::: supplement
**非有界な線形汎関数.** 無限次元のノルム空間には、連続でない線形汎関数がある。具体例：$[0,1]$ 上の多項式の空間に $\|\cdot\|_{\infty}$ を入れ、$\varphi(p)\defeq p'(0)$ とすると、$p_{n}(x)\defeq(1-x)^{n}$ は $\|p_{n}\|_{\infty}=1$ で $\varphi(p_{n})=-n$ なので非有界（選択公理は不要）。一般のバナッハ空間では、ハメル基底（選択公理）を使って非有界な線形汎関数が作れる。逆に、選択公理を除いた体系では「バナッハ空間の上の線形汎関数はすべて連続」が無矛盾であることが知られている。

**高い視点：位相と代数の両立.** ノルム空間の圏（射は有界線形作用素）では、有限次元の対象はすべて $\mathbb{K}^{n}$ と（位相も込めて）同型で、ノルムの選び方は見えない（\ref{fa:finite-dim-norms-equivalent}）。無限次元では、同じベクトル空間に同値でないノルムが無数に入り、どれを選ぶか（どの収束を見るか）が問題そのものになる。リースの補題は、「有限次元の直観（有界列には収束部分列がある）が無限次元では例外なく崩れる」ことを示し、その代わりに弱位相（この系列の後のページ）でのコンパクト性を探すことになる。比喩で言えば、有限次元の単位球は「部屋」でどこに散らばっても集積点があるが、無限次元の単位球は「無限に長い廊下に並んだ部屋」で、一つずつ別の部屋に入っていく点列はどこにも集まらない。
:::

## 問題 {#fa:sec-ns-problems}

::: problem {#fa:prob-ns-c0}
$c_{0}\defeq\{(a_{n})\in\ell^{\infty}:a_{n}\to0\}$ は $\ell^{\infty}$ の閉部分空間であることを示せ。
:::

::: solution
部分空間であることは極限の線形性から。$a^{(k)}\in c_{0}$, $a^{(k)}\to a$（$\ell^{\infty}$）とし $\varepsilon>0$ をとる。$\|a^{(k)}-a\|_{\infty}<\varepsilon/2$ となる $k$ をとり、$n\ge N$ で $|a^{(k)}_{n}|<\varepsilon/2$ となる $N$ をとると、$n\ge N$ で $|a_{n}|\le|a_{n}-a^{(k)}_{n}|+|a^{(k)}_{n}|<\varepsilon$。よって $a\in c_{0}$。
:::

::: problem {#fa:prob-ns-polynomials}
$[0,1]$ 上の多項式の空間 $P$ に $\|\cdot\|_{\infty}$ を入れたものは完備でないことを示せ。
:::

::: solution
$p_{n}(x)\defeq\sum_{k=0}^{n}\frac{x^{k}}{k!}$ は $[0,1]$ 上 $e^{x}$ に一様収束するのでコーシー列。$P$ で収束すれば、その極限は $C([0,1])$ の中の一様極限 $e^{x}$ に等しく（$P\subset C([0,1])$ で極限は一意）、$e^{x}$ が多項式になる。しかし多項式 $q$ について十分高階の導関数は $0$ だが、$e^{x}$ のどの階数の導関数も $e^{x}\ne0$ なので矛盾。
:::
