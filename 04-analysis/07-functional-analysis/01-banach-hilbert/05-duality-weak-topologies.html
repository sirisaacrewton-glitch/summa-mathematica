# 双対空間と弱位相 {#fa:page-duality-weak-topologies keywords="dual of L^p is L^q for sigma-finite measures and 1 <= p < infinity, Riesz representation for L^p, reflexivity of L^p for 1 < p < infinity, dual of l^infinity is larger than l^1, weak topology, weak-star topology, weakly convergent sequences are bounded, lower semicontinuity of the norm, Banach-Alaoglu theorem, bounded sequences in Hilbert spaces have weakly convergent subsequences"}

双対空間を具体的に知ることは、関数解析の多くの議論の出発点である。このページではまず、σ 有限な測度空間について $1\le p<\infty$ なら $L^{p}$ の双対空間は $L^{q}$（$q$ は共役指数）であることを、ラドン–ニコディムの定理（\ref{meas:radon-nikodym}）を使って示す。次に、双対空間を使って定義される弱い位相（**弱位相**と**汎弱位相**）を導入する。無限次元では単位球はノルムについてコンパクトでない（\ref{fa:compact-unit-ball}）が、双対空間の単位球は汎弱位相についてコンパクトである（**バナッハ–アラオグルの定理**）。ヒルベルト空間では、有界列が弱収束する部分列をもつことを直接示す。

## 記法と定義の確認 {#fa:sec-dw-notation}

::: notation
- $L^{p}$ 空間・ヘルダーの不等式・単関数の稠密性・優収束定理・単調収束定理は \ref{meas:lp-space}, \ref{meas:holder}, \ref{meas:lp-simple-dense}, \ref{meas:dominated-convergence}, \ref{meas:monotone-convergence}。符号付き測度・ジョルダン分解・ラドン–ニコディムの定理は \ref{meas:signed-measure}, \ref{meas:jordan-decomposition}, \ref{meas:radon-nikodym}。
- ハーン–バナッハの帰結・第二双対・一様有界性原理・リースの表現定理は \ref{fa:hahn-banach-normed}, \ref{fa:bidual-embedding}, \ref{fa:uniform-boundedness}, \ref{fa:riesz-representation}。
- 始位相は \ref{top:initial-topology}、直積のコンパクト性には \ref{top:tychonoff} を使う。
- $\operatorname{sgn}z\defeq z/|z|$（$z\ne0$）、$\operatorname{sgn}0\defeq0$。$q$ は $p$ の共役指数。
- **選択公理**：ラドン–ニコディムの定理、ハーン–バナッハの定理、チコノフの定理を通して使う。
:::

## Lᵖ の双対 {#fa:sec-dw-lp-dual}

::: theorem Lᵖ の双対 {#fa:lp-dual keywords="for a sigma-finite measure and 1 <= p < infinity, g -> (f -> int fg) is an isometric isomorphism of L^q onto the dual of L^p" index="Lp の双対|えるぴーのそうつい"}
$(X,\mathcal{M},\mu)$ を σ 有限、$1\le p<\infty$ とする。$g\in L^{q}$ に $\Phi g\colon f\mapsto\int fg\,d\mu$ を対応させる写像 $\Phi\colon L^{q}\to(L^{p})^{*}$ は、線形な等長同型である。
:::

::: proof
**Step 1（等長）.** \ref{meas:holder} から $\|\Phi g\|\le\|g\|_{q}$。$g\ne0$ とする。$1<p$ なら $f\defeq|g|^{q-1}\overline{\operatorname{sgn}g}$ について $|f|^{p}=|g|^{(q-1)p}=|g|^{q}$ なので $\|f\|_{p}=\|g\|_{q}^{q/p}$、$\int fg=\|g\|_{q}^{q}$、比は $\|g\|_{q}^{q-q/p}=\|g\|_{q}$。$p=1$ なら $\varepsilon>0$ について $A\defeq\{|g|>\|g\|_{\infty}-\varepsilon\}$ は零集合でなく、σ 有限性から $0<\mu(A')<\infty$ となる $A'\subset A$ がある。$f\defeq\mathbf{1}_{A'}\overline{\operatorname{sgn}g}/\mu(A')$ は $\|f\|_{1}=1$, $|\int fg|\ge\|g\|_{\infty}-\varepsilon$。

**Step 2（全射：実数値・有限測度）.** まず実数値の関数と実数値の $\varphi\in(L^{p})^{*}$、$\mu(X)<\infty$ とする。$\nu(E)\defeq\varphi(\mathbf{1}_{E})$ とおく。互いに素な $E_{j}$ の和 $E$ について、$\mathbf{1}_{\bigcup_{j\le n}E_{j}}\to\mathbf{1}_{E}$ in $L^{p}$（\ref{meas:dominated-convergence}、$p<\infty$）なので $\nu(E)=\sum\nu(E_{j})$。$|\nu(E)|\le\|\varphi\|\mu(E)^{1/p}$ なので $\nu$ は有限な符号付き測度で、$\mu(E)=0\Rightarrow\nu(E)=0$。ジョルダン分解 $\nu=\nu^{+}-\nu^{-}$（\ref{meas:jordan-decomposition}）について $\nu^{+}(E)=\nu(E\cap P)$, $\nu^{-}(E)=-\nu(E\cap N)$（$X=P\sqcup N$ はハーン分解）なので $\nu^{\pm}\ll\mu$、\ref{meas:radon-nikodym} から $\nu^{\pm}=g^{\pm}d\mu$。$g\defeq g^{+}-g^{-}\in L^{1}$ で、単関数 $s$ について $\varphi(s)=\int sg$（線形性）。

**Step 3（$g\in L^{q}$）.** 有界可測関数 $h$ は単関数で一様近似でき（\ref{meas:simple-approximation} を $h^{\pm}$ に）、一様収束は有限測度なので $L^{p}$ 収束を含意し、$\int s_{k}g\to\int hg$（$|\int(s_{k}-h)g|\le\|s_{k}-h\|_{\infty}\|g\|_{1}$）。よって有界な $h$ で $\varphi(h)=\int hg$。$1<p$ なら $E_{n}\defeq\{|g|\le n\}$, $h_{n}\defeq|g|^{q-1}\operatorname{sgn}(g)\mathbf{1}_{E_{n}}$ について
$$
\int_{E_{n}}|g|^{q}=\varphi(h_{n})\le\|\varphi\|\|h_{n}\|_{p}=\|\varphi\|\Bigl(\int_{E_{n}}|g|^{q}\Bigr)^{1/p},
$$
よって $(\int_{E_{n}}|g|^{q})^{1/q}\le\|\varphi\|$、\ref{meas:monotone-convergence} から $\|g\|_{q}\le\|\varphi\|$。$p=1$ なら、$E\defeq\{g>\|\varphi\|+\varepsilon\}$ について $(\|\varphi\|+\varepsilon)\mu(E)\le\int_{E}g=\varphi(\mathbf{1}_{E})\le\|\varphi\|\mu(E)$ なので $\mu(E)=0$、同様に $\{g<-\|\varphi\|-\varepsilon\}$ も零集合で $\|g\|_{\infty}\le\|\varphi\|$。

**Step 4（一致）.** $\varphi$ と $\Phi g$ は単関数（$\mu(\{s\ne0\})<\infty$）の上で一致し、それは $L^{p}$ で稠密（\ref{meas:lp-simple-dense}）なので一致する。

**Step 5（σ 有限・複素数値）.** $X=\bigsqcup X_{k}$, $\mu(X_{k})<\infty$ とし、各 $X_{k}$ 上で Step 2〜4 の $g_{k}$ をとって $g\defeq\sum g_{k}\mathbf{1}_{X_{k}}$。$Y_{n}\defeq\bigcup_{k\le n}X_{k}$ 上に Step 3 を使うと $\|g\mathbf{1}_{Y_{n}}\|_{q}\le\|\varphi\|$ で、極限で $\|g\|_{q}\le\|\varphi\|$。$\varphi$ と $\Phi g$ は $Y_{n}$ に台をもつ関数の上で一致し、それは稠密なので一致する。複素数値の場合、$\varphi$ を実数値関数に制限して実部と虚部 $\psi_{1},\psi_{2}$（実線形な有界汎関数）に分け、対応する $g_{1},g_{2}$ をとって $g\defeq g_{1}+ig_{2}$ とすれば、$\varphi(f)=\varphi(\operatorname{Re}f)+i\varphi(\operatorname{Im}f)=\int fg$。

::: hypcheck
- **$p<\infty$**：Step 2 の可算加法性（$L^{p}$ での収束）に使った。$p=\infty$ では偽（\ref{fa:linfty-dual}）。
- **σ 有限性**：Step 1 の $p=1$ と Step 5 に使い、ラドン–ニコディムの定理の前提でもある。$1<p<\infty$ では σ 有限性なしでも結論が成り立つことが知られている。
:::
:::

::: corollary Lᵖ の回帰性 {#fa:lp-reflexive keywords="L^p is reflexive for 1 < p < infinity (sigma-finite)" index="Lp の回帰性|えるぴーのかいきせい"}
σ 有限、$1<p<\infty$ なら $L^{p}$ は回帰的（\ref{fa:bidual-embedding}）。
:::

::: proof
$\Lambda\in(L^{p})^{**}$ について、$\Lambda\circ\Phi_{q}\in(L^{q})^{*}$（$\Phi_{q}\colon L^{p}\to(L^{q})^{*}$ は $q$ についての \ref{fa:lp-dual}）なので、\ref{fa:lp-dual}（$q$ について、$1<q<\infty$）から $f\in L^{p}$ で $\Lambda(\Phi_{q}h)=\int hf$（$h\in L^{q}$）となるものがある。$(L^{p})^{*}$ の元は $\Phi_{q}h$ の形なので、$\Lambda(\Phi_{q}h)=(\Phi_{q}h)(f)=J(f)(\Phi_{q}h)$、すなわち $\Lambda=J(f)$。
:::

::: proposition ℓ^∞ の双対 {#fa:linfty-dual keywords="the dual of l^infinity is strictly larger than l^1: a Hahn-Banach extension of the limit functional is not given by a summable sequence" index="ℓ∞ の双対|えるいんふぃにてぃのそうつい"}
$\ell^{\infty}$ 上の有界線形汎関数で、$\ell^{1}$ の元による $a\mapsto\sum a_{n}g_{n}$ の形でないものがある。
:::

::: proof
収束列の部分空間 $c\subset\ell^{\infty}$ 上で $\ell(a)\defeq\lim a_{n}$ は $\|\ell\|\le1$。\ref{fa:hahn-banach-normed.1} で $\Lambda\in(\ell^{\infty})^{*}$ に延長する（選択公理）。$\Lambda(a)=\sum a_{n}g_{n}$（$g\in\ell^{1}$）なら、$a=e_{n}$ で $g_{n}=\lim_{k}(e_{n})_{k}=0$ がすべての $n$ で成り立ち $\Lambda=0$、しかし $\Lambda(\mathbf{1})=\lim1=1$ で矛盾。
:::

## 弱位相 {#fa:sec-dw-weak}

::: definition 弱位相と汎弱位相 {#fa:weak-topology keywords="weak topology on X: initial topology of the functionals in X*; weak-star topology on X*: initial topology of evaluations at points of X; weak convergence" index="弱位相|じゃくいそう, 汎弱位相|はんじゃくいそう, 弱収束|じゃくしゅうそく"}
1. ノルム空間 $X$ 上の、すべての $\varphi\in X^{*}$ を連続にする最弱の位相（$X^{*}$ の元による始位相、\ref{top:initial-topology}）を**弱位相**という。$x_{n}\to x$（弱位相）$\iff$ すべての $\varphi$ で $\varphi(x_{n})\to\varphi(x)$ で、$x_{n}\rightharpoonup x$ と書く（**弱収束**）。
2. $X^{*}$ 上の、すべての $J(x)\colon\varphi\mapsto\varphi(x)$（$x\in X$）を連続にする最弱の位相を**汎弱位相**（weak* 位相）という。
:::

::: proposition 弱収束の基本性質 {#fa:weak-convergence-basic keywords="the weak topology is Hausdorff; norm convergence implies weak convergence; weakly convergent sequences in a normed space are bounded; ||x|| <= liminf ||x_n||" index="弱収束の性質|じゃくしゅうそくのせいしつ"}
1. 弱位相・汎弱位相はハウスドルフ。
2. ノルム収束すれば弱収束する。
3. $x_{n}\rightharpoonup x$ なら $(x_{n})$ は有界で、$\|x\|\le\liminf\|x_{n}\|$。
:::

::: proof
**1.** $x\ne y$ なら \ref{fa:hahn-banach-normed.2} から $\varphi(x)\ne\varphi(y)$ となる $\varphi$ があり、$\mathbb{K}$ で値を分ける開集合の逆像が分離する。汎弱位相では $\varphi\ne\psi$ なら $\varphi(x)\ne\psi(x)$ となる $x$ がある。**2.** $|\varphi(x_{n})-\varphi(x)|\le\|\varphi\|\|x_{n}-x\|$。**3.** $J(x_{n})\in X^{**}=B(X^{*},\mathbb{K})$ は、各 $\varphi$ で $J(x_{n})(\varphi)=\varphi(x_{n})$ が収束するので有界で、$X^{*}$ はバナッハ空間（\ref{fa:operator-space-complete}）なので \ref{fa:uniform-boundedness} から $\sup\|J(x_{n})\|=\sup\|x_{n}\|<\infty$（\ref{fa:bidual-embedding}）。$\|\varphi\|=1$, $\varphi(x)=\|x\|$ となる $\varphi$ について $\|x\|=\lim|\varphi(x_{n})|\le\liminf\|x_{n}\|$。
:::

::: theorem バナッハ–アラオグルの定理 {#fa:banach-alaoglu keywords="Banach-Alaoglu theorem: the closed unit ball of the dual of a normed space is weak-star compact" index="バナッハ–アラオグルの定理|ばなっはあらおぐるのていり"}
ノルム空間 $X$ の双対の閉単位球 $B^{*}\defeq\{\varphi\in X^{*}:\|\varphi\|\le1\}$ は汎弱位相についてコンパクト。
:::

::: proof
$D_{x}\defeq\{c\in\mathbb{K}:|c|\le\|x\|\}$（コンパクト）とし、$P\defeq\prod_{x\in X}D_{x}$ に直積位相を入れる。\ref{top:tychonoff} から $P$ はコンパクト。$\iota\colon B^{*}\to P$, $\varphi\mapsto(\varphi(x))_{x}$ は単射で、汎弱位相と直積位相はどちらも「各座標 $\varphi\mapsto\varphi(x)$ による始位相」なので、$\iota$ は $B^{*}$ から像への同相写像。像は
$$
\iota(B^{*})=\{c\in P:c_{x+y}=c_{x}+c_{y},\ c_{ax}=ac_{x}\ (\forall x,y,a)\}
$$
（線形な $c$ は $|c_{x}|\le\|x\|$ から有界でノルム $\le1$）で、各条件は連続写像の等式なので閉集合。コンパクト空間の閉集合はコンパクト。
:::

::: theorem ヒルベルト空間の有界列 {#fa:hilbert-weak-compactness keywords="every bounded sequence in a Hilbert space has a weakly convergent subsequence; proof by a diagonal argument and the Riesz representation theorem" index="弱収束部分列（ヒルベルト空間）|じゃくしゅうそくぶぶんれつひるべるとくうかん"}
ヒルベルト空間 $H$ の有界列 $(x_{n})$ は弱収束する部分列をもつ。
:::

::: proof
**Step 1（可分な部分空間）.** $\|x_{n}\|\le M$ とし、$Y\defeq\overline{\operatorname{span}}\{x_{n}\}$ は可分（有理係数の一次結合）。稠密な列 $(y_{k})\subset Y$ をとる。

**Step 2（対角線論法）.** $(\langle x_{n},y_{1}\rangle)$ は有界なので収束する部分列があり（ボルツァーノ–ワイエルシュトラス、最小の番号を順に選ぶ）、その中で $y_{2}$ について収束する部分列、…と繰り返し、対角線の部分列 $(x'_{n})$ をとると、すべての $k$ で $\langle x'_{n},y_{k}\rangle$ が収束する。

**Step 3（すべての $y$ で収束）.** $y\in Y$ と $\varepsilon>0$ について $\|y-y_{k}\|<\varepsilon$ をとると $|\langle x'_{n}-x'_{m},y\rangle|\le2M\varepsilon+|\langle x'_{n}-x'_{m},y_{k}\rangle|$ でコーシー。$y\in Y^{\perp}$ なら $\langle x'_{n},y\rangle=0$。$H=Y\oplus Y^{\perp}$（\ref{fa:orthogonal-decomposition.2}）なので、すべての $y$ で $L(y)\defeq\lim\langle x'_{n},y\rangle$ が存在する。

**Step 4（極限）.** $\overline{L}$ は線形で $|L(y)|\le M\|y\|$ なので、\ref{fa:riesz-representation} から $\overline{L(y)}=\langle y,x\rangle$、すなわち $L(y)=\langle x,y\rangle$。$H^{*}$ の元は $\langle\cdot,y\rangle$ の形なので $x'_{n}\rightharpoonup x$。
:::

::: supplement
**高い視点：位相を弱めてコンパクト性を取り戻す.** 無限次元では、ノルム位相は「強すぎて」有界集合がコンパクトにならない。弱位相は、収束を「すべての線形な測定値 $\varphi(x)$ の収束」だけで判定する位相で、測定値の数を減らした分だけコンパクトになりやすい。バナッハ–アラオグルの定理は、双対の単位球が、各点での値の組として、コンパクトな円板の直積の閉部分集合であることを使っている。変分法では、最小化列の弱収束部分列をとり、ノルムの弱下半連続性（\ref{fa:weak-convergence-basic.3}）で極限が最小値を達成することを示す、という手順が標準的である（直接法）。比喩で言えば、ノルム位相は「全体の形が一致する」ことを求めるが、弱位相は「どの方向から影を見ても一致する」ことしか求めない。正規直交列は、どの方向の影も $0$ に近づくのに、形としては決して $0$ に近づかない（\ref{fa:prob-hs-orthonormal-sequence}）。
:::

## 問題 {#fa:sec-dw-problems}

::: problem {#fa:prob-dw-lp-unit-vectors}
$1<p<\infty$ について、$\ell^{p}$ の単位ベクトル $e_{n}$ は $0$ に弱収束するがノルム収束しないことを示せ。$p=1$ ではどうか。
:::

::: solution
\ref{fa:lp-dual} から $(\ell^{p})^{*}=\ell^{q}$（$q<\infty$）で、$g\in\ell^{q}$ について $\langle e_{n},g\rangle=g_{n}\to0$（$\sum|g_{n}|^{q}<\infty$）。$\|e_{n}\|_{p}=1$ なのでノルム収束しない。$p=1$ では $(\ell^{1})^{*}=\ell^{\infty}$ で、$g=(1,1,\dots)$ について $g_{n}=1\not\to0$ なので $e_{n}$ は $0$ に弱収束しない（他の点にも弱収束しない：極限 $x$ があれば各座標 $x_{k}=\lim(e_{n})_{k}=0$、しかし $g=\mathbf{1}$ との対は $1\ne0$）。
:::

::: problem {#fa:prob-dw-finite-dim}
有限次元のノルム空間では、弱収束とノルム収束が同値であることを示せ。
:::

::: solution
ノルム収束なら弱収束（\ref{fa:weak-convergence-basic.2}）。逆に、基底 $e_{1},\dots,e_{n}$ の座標汎関数 $c_{i}$ は線形で、有限次元なので有界（\ref{fa:finite-dim-norms-equivalent.4}）。$x_{k}\rightharpoonup x$ なら各座標が収束し、$|x|_{1}=\sum|c_{i}(x)|$ についてノルム収束し、ノルムの同値性（\ref{fa:finite-dim-norms-equivalent.1}）から元のノルムでも収束する。
:::
