# バナッハ空間とヒルベルト空間（Banach and Hilbert Spaces）

ノルム空間と有界線形作用素、有限次元の特徴（リースの補題）、商空間、ヒルベルト空間と射影定理・リースの表現定理・正規直交基底、ハーン–バナッハの定理と分離定理、一様有界性原理・開写像定理・閉グラフ定理、双対空間（Lᵖ の双対）と弱位相・バナッハ–アラオグルの定理。

<p class="mn-msc">MSC2020: 46B03, 46B10, 46C05, 46A30, 46A22</p>
