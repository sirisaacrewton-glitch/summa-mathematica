# ベールの定理の帰結 {#fa:page-baire-consequences keywords="uniform boundedness principle, Banach-Steinhaus theorem, open mapping theorem, bounded inverse theorem, equivalence of comparable complete norms, closed graph theorem, Hellinger-Toeplitz, Dirichlet kernel, Lebesgue constants, existence of a continuous function whose Fourier series diverges at a point"}

ベールのカテゴリー定理（完備距離空間は可算個の「やせた」閉集合の和にならない）を線形作用素に使うと、バナッハ空間の間の作用素について三つの強力な原理が得られる。
1. **一様有界性原理**：各点で有界な作用素の族は、作用素ノルムでも有界。
2. **開写像定理**：全射な有界作用素は開写像。とくに全単射なら逆も有界。
3. **閉グラフ定理**：グラフが閉な線形写像は有界。

どれも「完備性があれば、各点ごとの情報から一様な評価が出る」という形をしている。応用として、フーリエ級数がある点で発散する連続関数の存在を、具体的な関数を作らずに示す。

## 記法と定義の確認 {#fa:sec-bc-notation}

::: notation
- ノルム空間・有界作用素・作用素ノルムは \ref{fa:normed-space}, \ref{fa:bounded-operator}, \ref{fa:continuity-boundedness}。絶対収束級数による完備性は \ref{fa:absolute-series-completeness}。
- ベール空間とその言い換えは \ref{top:baire-space}, \ref{top:baire-space-equivalents}、完備距離空間がベール空間であることは \ref{top:baire-category}。
- $B_{X}(x,r)$ は $X$ の開球、$B_{r}\defeq B(0,r)$。
- 優収束定理は \ref{meas:dominated-convergence}。
- **選択公理**：ベールのカテゴリー定理（従属選択公理）と、開写像定理の逐次近似（従属選択公理）で使う。
:::

## 一様有界性原理 {#fa:sec-bc-uniform}

::: theorem 一様有界性原理 {#fa:uniform-boundedness keywords="uniform boundedness principle: a pointwise bounded family of bounded operators on a Banach space is uniformly bounded" index="一様有界性原理|いちようゆうかいせいげんり, バナッハ–シュタインハウスの定理|ばなっはしゅたいんはうすのていり"}
$X$ をバナッハ空間、$Y$ をノルム空間、$\{T_{\alpha}\}\subset B(X,Y)$ を、各 $x$ で $\sup_{\alpha}\|T_{\alpha}x\|<\infty$ となる族とすると、$\sup_{\alpha}\|T_{\alpha}\|<\infty$。
:::

::: proof
$E_{n}\defeq\{x:\sup_{\alpha}\|T_{\alpha}x\|\le n\}=\bigcap_{\alpha}\{x:\|T_{\alpha}x\|\le n\}$ は閉集合（連続写像による閉集合の逆像の共通部分）で、仮定から $X=\bigcup_{n}E_{n}$。$X$ は完備なのでベール空間（\ref{top:baire-category}）で、\ref{top:baire-space-equivalents.2} から、ある $E_{n}$ の内部は空でない：$\overline{B}(x_{0},r)\subset E_{n}$。$\|z\|\le r$ なら $\|T_{\alpha}z\|\le\|T_{\alpha}(x_{0}+z)\|+\|T_{\alpha}x_{0}\|\le2n$ なので、$\|T_{\alpha}\|\le2n/r$。
:::

::: corollary バナッハ–シュタインハウスの定理 {#fa:banach-steinhaus keywords="if bounded operators T_n on a Banach space converge pointwise, the limit is a bounded operator and sup ||T_n|| < infinity" index="各点収束する作用素列|かくてんしゅうそくするさようそれつ"}
$X$ がバナッハ空間、$T_{n}\in B(X,Y)$ で各 $x$ について $T_{n}x$ が収束するなら、$Tx\defeq\lim T_{n}x$ は有界線形作用素で、$\|T\|\le\liminf\|T_{n}\|\le\sup\|T_{n}\|<\infty$。
:::

::: proof
収束列は有界なので \ref{fa:uniform-boundedness} から $\sup\|T_{n}\|<\infty$。$T$ は線形で、$\|Tx\|=\lim\|T_{n}x\|\le\liminf\|T_{n}\|\|x\|$。
:::

## 開写像定理 {#fa:sec-bc-open}

::: theorem 開写像定理 {#fa:open-mapping keywords="open mapping theorem: a surjective bounded operator between Banach spaces maps open sets to open sets" index="開写像定理|かいしゃぞうていり"}
$X$, $Y$ をバナッハ空間、$T\in B(X,Y)$ を全射とすると、$T$ は開写像である（開集合の像は開集合）。
:::

::: proof
**Step 1（像の閉包が球を含む）.** $Y=T(X)=\bigcup_{n}T(B_{n})$ なので $Y=\bigcup_{n}\overline{T(B_{n})}$。$Y$ はベール空間なので、ある $\overline{T(B_{n})}$ は内部が空でなく、スケールして $K\defeq\overline{T(B_{1})}$ が球 $B_{Y}(y_{0},\varepsilon)$ を含む。$K$ は凸で対称（$T(B_{1})$ がそうで、閉包で保たれる）。$\|y\|<\varepsilon$ なら $y_{0}+y\in K$、$y_{0}-y\in K$ なので $-(y_{0}-y)\in K$、凸性から $y=\frac12(y_{0}+y)+\frac12(-y_{0}+y)\in K$。よって $B_{Y}(0,\varepsilon)\subset\overline{T(B_{1})}$、スケールして $B_{Y}(0,\varepsilon2^{-k})\subset\overline{T(B_{2^{-k}})}$。

**Step 2（閉包を外す）.** $\|y\|<\varepsilon/2$ とする。Step 1（$k=1$）から $x_{1}\in B_{1/2}$ で $\|y-Tx_{1}\|<\varepsilon/4$ となるものがあり、$k=2$ から $x_{2}\in B_{1/4}$ で $\|y-Tx_{1}-Tx_{2}\|<\varepsilon/8$、以下帰納的に $x_{k}\in B_{2^{-k}}$ で $\|y-T(x_{1}+\dots+x_{k})\|<\varepsilon2^{-k-1}$ となるものを選ぶ（従属選択公理）。$\sum\|x_{k}\|<\sum2^{-k}=1$ なので $x\defeq\sum x_{k}$ は収束し（\ref{fa:absolute-series-completeness}）、$\|x\|<1$、$T$ の連続性から $Tx=y$。よって $B_{Y}(0,\varepsilon/2)\subset T(B_{1})$。

**Step 3（開写像）.** $U$ を開集合、$x\in U$, $B(x,r)\subset U$ とすると、Step 2 と線形性から $T(U)\supset Tx+rT(B_{1})\supset B_{Y}(Tx,r\varepsilon/2)$。

::: hypcheck
- **$Y$ の完備性**は Step 1 のベール空間の性質に、**$X$ の完備性**は Step 2 の級数の収束に使った。
- **全射性**は Step 1 で $Y$ を $\overline{T(B_{n})}$ の和で覆うのに使った。
:::
:::

::: corollary 有界逆写像定理 {#fa:bounded-inverse keywords="a bijective bounded operator between Banach spaces has a bounded inverse; two comparable complete norms are equivalent" index="有界逆写像定理|ゆうかいぎゃくしゃぞうていり"}
1. $X$, $Y$ がバナッハ空間で $T\in B(X,Y)$ が全単射なら $T^{-1}\in B(Y,X)$。
2. ベクトル空間 $X$ 上の二つのノルムがどちらも完備で、$\|x\|_{1}\le C\|x\|_{2}$ なら、二つのノルムは同値。
:::

::: proof
**1.** \ref{fa:open-mapping} から $(T^{-1})^{-1}(U)=T(U)$ は開集合で、$T^{-1}$ は連続。**2.** 恒等写像 $(X,\|\cdot\|_{2})\to(X,\|\cdot\|_{1})$ に 1 を使う。
:::

::: theorem 閉グラフ定理 {#fa:closed-graph keywords="closed graph theorem: a linear map between Banach spaces with closed graph is bounded" index="閉グラフ定理|へいぐらふていり"}
$X$, $Y$ をバナッハ空間、$T\colon X\to Y$ を線形写像とし、グラフ $G\defeq\{(x,Tx)\}$ が $X\times Y$（ノルム $\|x\|+\|y\|$）で閉とする。このとき $T$ は有界。言い換えると、$x_{n}\to x$ かつ $Tx_{n}\to y$ なら $y=Tx$、という条件だけで $T$ の連続性が従う。
:::

::: proof
$X\times Y$ はバナッハ空間で、$G$ はその閉部分空間なのでバナッハ空間。射影 $\pi_{1}\colon G\to X$, $(x,Tx)\mapsto x$ は有界（ノルム $\le1$）な全単射なので、\ref{fa:bounded-inverse.1} から逆は有界：$\|x\|+\|Tx\|\le C\|x\|$。
:::

## 応用：発散するフーリエ級数 {#fa:sec-bc-fourier}

::: theorem 発散するフーリエ級数の存在 {#fa:fourier-divergence keywords="there is a continuous 1-periodic function whose Fourier series diverges at 0; proof by uniform boundedness and the growth of the L^1 norms of the Dirichlet kernels" index="フーリエ級数の発散|ふーりえきゅうすうのはっさん, ディリクレ核|でぃりくれかく"}
周期 $1$ の連続関数 $f\colon\mathbb{R}\to\mathbb{C}$ で、フーリエ係数 $\hat f(n)\defeq\int_{0}^{1}f(x)e^{-2\pi inx}dx$ の部分和 $S_{N}f(0)\defeq\sum_{|n|\le N}\hat f(n)$ が $N\to\infty$ で有界でないものがある。
:::

::: proof
**Step 1（ディリクレ核）.** $D_{N}(x)\defeq\sum_{|n|\le N}e^{2\pi inx}$ とおくと $S_{N}f(0)=\int_{-1/2}^{1/2}f(x)D_{N}(x)\,dx$（$e^{-2\pi inx}$ を $D_{N}$ に入れ替えるには $n\mapsto-n$ の対称性）。等比数列の和から $x\notin\mathbb{Z}$ で $D_{N}(x)=\frac{\sin((2N+1)\pi x)}{\sin\pi x}$。

**Step 2（$\|D_{N}\|_{1}\to\infty$）.** $|\sin\pi x|\le\pi|x|$ なので
$$
\int_{-1/2}^{1/2}|D_{N}|\ge\frac2\pi\int_{0}^{1/2}\frac{|\sin((2N+1)\pi x)|}{x}dx=\frac2\pi\int_{0}^{(2N+1)/2}\frac{|\sin\pi u|}{u}du\ge\frac2\pi\sum_{k=1}^{N-1}\frac{1}{k+1}\int_{k}^{k+1}|\sin\pi u|\,du=\frac{4}{\pi^{2}}\sum_{k=1}^{N-1}\frac{1}{k+1},
$$
これは $N\to\infty$ で発散する。

**Step 3（汎関数のノルム）.** $X\defeq C(\mathbb{T})$（周期 $1$ の連続関数、$\|\cdot\|_{\infty}$）はバナッハ空間で、$\Lambda_{N}f\defeq S_{N}f(0)$ は $|\Lambda_{N}f|\le\|D_{N}\|_{1}\|f\|_{\infty}$ で有界。$\|\Lambda_{N}\|=\|D_{N}\|_{1}$ を示す。$s\defeq\operatorname{sgn}D_{N}$（$D_{N}$ の零点は有限個で、それ以外では $\pm1$）について、零点を中心とする幅 $\frac1k$ の区間の上で一次関数でつないだ連続関数 $g_{k}$（$|g_{k}|\le1$）は、零点以外で $s$ に収束する。\ref{meas:dominated-convergence}（優関数 $|D_{N}|$）から $\Lambda_{N}g_{k}\to\int|D_{N}|$。

**Step 4（一様有界性）.** $\sup_{N}|\Lambda_{N}f|<\infty$ がすべての $f\in X$ で成り立てば、\ref{fa:uniform-boundedness} から $\sup\|\Lambda_{N}\|<\infty$ となり、Step 2・3 に反する。

::: hypcheck
- **$X$ の完備性**（一様収束の極限は連続）を一様有界性原理に使った。
- 証明は関数を具体的に作らない（存在証明）。実際には、そのような $f$ の全体は $C(\mathbb{T})$ の稠密な $G_{\delta}$ 集合であることも同じ議論からわかる。一方、$L^{2}$ 関数のフーリエ級数がほとんど至る所収束することはカールソンの定理として知られている（深い。本サイト未収録）。
:::
:::

::: supplement
**高い視点：完備性は「無限の操作」の保険.** 三つの原理は、ベールの定理を通して「完備な空間は可算個の小さい部分に分けられない」ことを使っている。各点で有界な族を、有界性の度合い $n$ で可算個に分けると、どれかが球を含み、線形性でそれを全体に広げる、という論法である。完備性がないと崩れる：完備でない空間では、各点で有界だが一様に有界でない作用素列が作れる（問題 \ref{fa:prob-bc-incomplete}）。比喩で言えば、完備性は「どの方向にも抜け穴のない床」で、一様有界性原理は「床のすべての点で荷重が有限なら、床全体の耐荷重も有限」と言っている。抜け穴があると、どの点でも有限なのに全体では支えきれない荷重のかけ方がある。
:::

## 問題 {#fa:sec-bc-problems}

::: problem {#fa:prob-bc-hellinger-toeplitz}
（ヘリンガー–テプリッツ）ヒルベルト空間 $H$ 上の線形写像 $T\colon H\to H$ が、すべての $x,y$ で $\langle Tx,y\rangle=\langle x,Ty\rangle$ を満たせば有界であることを示せ。
:::

::: solution
閉グラフ定理（\ref{fa:closed-graph}）を使う。$x_{n}\to x$, $Tx_{n}\to z$ とすると、任意の $y$ で $\langle z,y\rangle=\lim\langle Tx_{n},y\rangle=\lim\langle x_{n},Ty\rangle=\langle x,Ty\rangle=\langle Tx,y\rangle$（内積の連続性、\ref{fa:cauchy-schwarz.2}）。$y=z-Tx$ として $z=Tx$。よってグラフは閉で、$T$ は有界。
:::

::: problem {#fa:prob-bc-incomplete}
$[0,1]$ 上の連続関数の空間 $C([0,1])$ にノルム $\|f\|_{1}\defeq\int_{0}^{1}|f|$ を入れたものは完備でないことを、\ref{fa:bounded-inverse.2} を使って示せ。
:::

::: solution
完備と仮定する。$\|f\|_{1}\le\|f\|_{\infty}$ で、$(C([0,1]),\|\cdot\|_{\infty})$ は完備なので、\ref{fa:bounded-inverse.2} から $\|f\|_{\infty}\le C\|f\|_{1}$ となる $C$ がある。しかし $f_{n}(x)\defeq\max(0,1-nx)$ について $\|f_{n}\|_{\infty}=1$, $\|f_{n}\|_{1}=\frac{1}{2n}\to0$ で矛盾。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{fa:sec-bc-exercises} にまとめた。
