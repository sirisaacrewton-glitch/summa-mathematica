# ハーン–バナッハの定理 {#fa:page-hahn-banach keywords="sublinear functional, Hahn-Banach extension theorem (real and complex), seminorm, norm preserving extension, norming functionals, the dual separates points, distance to a closed subspace, canonical embedding into the bidual, Minkowski functional, separation of convex sets, strict separation, closed convex sets are intersections of half-spaces, separable dual implies separable"}

無限次元のノルム空間では、そもそも連続な線形汎関数が十分たくさんあるかどうかが自明でない。**ハーン–バナッハの定理**は、部分空間上の線形汎関数を、劣線形な関数による上からの評価を保ったまま空間全体に延長できることを主張し、その帰結として、ノルム空間の双対空間は点を分離し、ノルムを双対によって計算できる（$\|x\|=\max_{\|\varphi\|\le1}|\varphi(x)|$）。幾何的には、交わらない凸集合が閉超平面で分けられること（**分離定理**）にあたる。証明は 1 次元ずつの延長とツォルンの補題による。

## 記法と定義の確認 {#fa:sec-hb-notation}

::: notation
- ノルム空間・有界線形作用素・双対空間・商ノルムは \ref{fa:normed-space}, \ref{fa:bounded-operator}, \ref{fa:continuity-boundedness}, \ref{fa:quotient-norm}。
- 極大元の存在には \ref{set:zorn} を使う。距離空間のコンパクト集合と閉集合の距離は \ref{top:compact-closed-distance}。
- $X$ を $\mathbb{K}$ 上のベクトル空間とする。$p\colon X\to\mathbb{R}$ が**劣線形**とは $p(x+y)\le p(x)+p(y)$ と $p(tx)=tp(x)$（$t\ge0$）を満たすこと、**半ノルム**とは劣線形で $p(cx)=|c|p(x)$（$c\in\mathbb{K}$）を満たすこと。
- **選択公理**：延長定理（ツォルンの補題）とその帰結すべてで使う。
:::

## 延長定理 {#fa:sec-hb-extension}

::: theorem ハーン–バナッハの定理（実数） {#fa:hahn-banach-real keywords="real Hahn-Banach theorem: a linear functional on a subspace dominated by a sublinear functional extends to the whole space with the same domination" index="ハーン–バナッハの定理|はーんばなっはのていり, 劣線形汎関数|れつせんけいはんかんすう"}
$X$ を実ベクトル空間、$p$ を劣線形、$M$ を部分空間、$f\colon M\to\mathbb{R}$ を線形で $f\le p$（$M$ 上）とする。線形な $F\colon X\to\mathbb{R}$ で、$F\restriction M=f$ かつ $F\le p$（$X$ 上）となるものがある。
:::

::: proof
**Step 1（1 次元の延長）.** $x_{0}\notin M$ とし、$M'\defeq M+\mathbb{R}x_{0}$ 上で $F(m+tx_{0})\defeq f(m)+tc$ とおく（$M'$ の元の表し方は一意）。$F\le p$ となる $c$ を選べることを示す。$m,m'\in M$ について
$$
f(m)+f(m')=f(m+m')\le p(m+m')\le p(m+x_{0})+p(m'-x_{0})
$$
なので $f(m')-p(m'-x_{0})\le p(m+x_{0})-f(m)$。左辺の $m'$ についての上限 $a$ と右辺の $m$ についての下限 $b$ は $a\le b$（ともに有限）を満たし、$c\in[a,b]$ をとる。$t>0$ なら $c\le b$ を $m/t$ に使い $f(m/t)+c\le p(m/t+x_{0})$、$t$ 倍して $f(m)+tc\le p(m+tx_{0})$。$t<0$ なら $c\ge a$ を $m'=m/|t|$ に使い $f(m/|t|)-c\le p(m/|t|-x_{0})$、$|t|$ 倍して $f(m)+tc\le p(m+tx_{0})$。$t=0$ は仮定。

**Step 2（ツォルンの補題）.** $f$ の延長 $(N,g)$（$M\subset N$ は部分空間、$g\restriction M=f$、$g\le p$）の全体を、$(N,g)\le(N',g')\iff N\subset N'$, $g'\restriction N=g$ で順序づける。鎖 $\{(N_{\alpha},g_{\alpha})\}$ について、$N\defeq\bigcup N_{\alpha}$ は部分空間（二元はある一つの $N_{\alpha}$ に含まれる）で、$g(x)\defeq g_{\alpha}(x)$（$x\in N_{\alpha}$）は well-defined な線形写像で $g\le p$。よって上界がある。\ref{set:zorn} から極大元 $(N,F)$ があり、Step 1 から $N=X$（$N\neq X$ なら延長でき極大性に反する）。
:::

::: theorem ハーン–バナッハの定理（複素数） {#fa:hahn-banach-complex keywords="complex Hahn-Banach theorem for seminorms: a complex linear functional with |f| <= p on a subspace extends with |F| <= p, via the real part" index="ハーン–バナッハの定理（複素数）|はーんばなっはのていりふくそすう"}
$X$ を $\mathbb{K}$ 上のベクトル空間、$p$ を半ノルム、$f$ を部分空間 $M$ 上の線形汎関数で $|f|\le p$ とする。線形な延長 $F$ で $|F|\le p$ となるものがある。
:::

::: proof
$\mathbb{K}=\mathbb{R}$ なら \ref{fa:hahn-banach-real}（$f\le p$ から延長 $F\le p$、$-F(x)=F(-x)\le p(-x)=p(x)$）。$\mathbb{K}=\mathbb{C}$ とし、$u\defeq\operatorname{Re}f$ を実線形汎関数とみる。$\operatorname{Im}f(x)=-\operatorname{Re}(if(x))=-u(ix)$ なので $f(x)=u(x)-iu(ix)$。$u\le|f|\le p$ なので、実の場合から実線形な延長 $U\le p$ がある。$F(x)\defeq U(x)-iU(ix)$ は $F(ix)=U(ix)-iU(-x)=i(U(x)-iU(ix))=iF(x)$ を満たし複素線形で、$f$ を延長する。$F(x)=e^{i\theta}|F(x)|$ とすると $|F(x)|=F(e^{-i\theta}x)$ は実数なので $=U(e^{-i\theta}x)\le p(e^{-i\theta}x)=p(x)$。
:::

::: corollary ノルム空間でのハーン–バナッハ {#fa:hahn-banach-normed keywords="norm preserving extension of bounded functionals; for x0 nonzero there is phi with ||phi|| = 1 and phi(x0) = ||x0||; ||x|| = max over the dual unit ball; the dual separates points; functional vanishing on a closed subspace with phi(x) = dist(x, M)" index="ノルムを保つ延長|のるむをたもつえんちょう"}
$X$ をノルム空間とする。
1. 部分空間 $M$ 上の $f\in M^{*}$ は、$\|F\|=\|f\|$ となる $F\in X^{*}$ に延長できる。
2. $x_{0}\ne0$ なら、$\|\varphi\|=1$, $\varphi(x_{0})=\|x_{0}\|$ となる $\varphi\in X^{*}$ がある。とくに $\|x\|=\max_{\|\varphi\|\le1}|\varphi(x)|$ で、$X^{*}$ は $X$ の点を分離する。
3. $M$ が閉部分空間で $x\notin M$ なら、$\varphi\in X^{*}$ で $\varphi\restriction M=0$, $\|\varphi\|=1$, $\varphi(x)=\operatorname{dist}(x,M)$ となるものがある。とくに部分空間 $N$ について、$\overline{N}=X\iff$「$\varphi\in X^{*}$, $\varphi\restriction N=0$ なら $\varphi=0$」。
:::

::: proof
**1.** $p(x)\defeq\|f\|\|x\|$ は半ノルムで $|f|\le p$ on $M$。\ref{fa:hahn-banach-complex} の延長 $F$ は $|F(x)|\le\|f\|\|x\|$ なので $\|F\|\le\|f\|$、延長なので $\ge$。

**2.** $M\defeq\mathbb{K}x_{0}$ 上 $f(cx_{0})\defeq c\|x_{0}\|$（$\|f\|=1$）を 1 で延長。$|\varphi(x)|\le\|x\|$（$\|\varphi\|\le1$）で、等号は $x$ に対する 2 の汎関数で達成される。$x\ne y$ なら $x-y$ に使う。

**3.** 商空間 $X/M$（\ref{fa:quotient-norm}）の点 $\pi x\ne0$ に 2 を使って $\psi\in(X/M)^{*}$, $\|\psi\|=1$, $\psi(\pi x)=\|\pi x\|=\operatorname{dist}(x,M)$ をとり、$\varphi\defeq\psi\circ\pi$。$|\varphi(y)|\le\|\pi y\|\le\|y\|$ で $\|\varphi\|\le1$、$m\in M$ について $|\varphi(x)|=|\varphi(x-m)|\le\|\varphi\|\|x-m\|$ から $\operatorname{dist}(x,M)\le\|\varphi\|\operatorname{dist}(x,M)$、よって $\|\varphi\|=1$。後半：$\overline{N}\ne X$ なら $M=\overline{N}$ と $x\notin M$ に使う。逆は連続性。
:::

::: proposition 第二双対への埋め込み {#fa:bidual-embedding keywords="the canonical map J: X -> X**, J(x)(phi) = phi(x), is a linear isometry; reflexive spaces" index="第二双対|だいにそうつい, 標準埋め込み|ひょうじゅんうめこみ, 回帰的|かいきてき"}
$J(x)(\varphi)\defeq\varphi(x)$ で定まる $J\colon X\to X^{**}$ は線形な等長写像である。$J$ が全射のとき $X$ は**回帰的**という。
:::

::: proof
$J(x)$ は $X^{*}$ 上の線形汎関数で $|J(x)(\varphi)|\le\|\varphi\|\|x\|$ なので $\|J(x)\|\le\|x\|$。\ref{fa:hahn-banach-normed.2} の $\varphi$ で等号。線形性は明らか。
:::

## 分離定理 {#fa:sec-hb-separation}

::: lemma ミンコフスキー汎関数 {#fa:minkowski-functional keywords="Minkowski functional of an open convex neighbourhood of 0 is sublinear, bounded by ||x||/r, and the set is {p < 1}" index="ミンコフスキー汎関数|みんこふすきーはんかんすう"}
ノルム空間 $X$ の開凸集合 $C\ni0$ について $p_{C}(x)\defeq\inf\{t>0:x\in tC\}$ は劣線形で、$B(0,r)\subset C$ なら $p_{C}(x)\le\|x\|/r$、$C=\{p_{C}<1\}$。
:::

::: proof
$x\in\frac{\|x\|+\varepsilon}{r}B(0,r)\subset\frac{\|x\|+\varepsilon}{r}C$ から上界。$p_{C}(tx)=tp_{C}(x)$（$t>0$）は定義から。劣加法性：$x\in sC$, $y\in tC$ なら凸性から $x+y=(s+t)\bigl(\frac{s}{s+t}\frac xs+\frac{t}{s+t}\frac yt\bigr)\in(s+t)C$ で、下限をとる。$C=\{p_{C}<1\}$：$x\in C$ なら $C$ は開なので $(1+\varepsilon)x\in C$、$p_{C}(x)\le\frac1{1+\varepsilon}<1$。逆に $p_{C}(x)<1$ なら $x\in tC$（$t<1$）で、$x=t(x/t)+(1-t)0\in C$（凸性）。
:::

::: theorem 分離定理 {#fa:separation keywords="Hahn-Banach separation: disjoint convex sets A (open) and B are separated by a continuous real linear functional; a compact convex set and a disjoint closed convex set are strictly separated" index="分離定理|ぶんりていり, 凸集合の分離|とつしゅうごうのぶんり"}
$X$ をノルム空間、$A,B$ を空でない交わらない凸集合とする。
1. $A$ が開なら、$\varphi\in X^{*}$ と $c\in\mathbb{R}$ で、すべての $a\in A$, $b\in B$ について $\operatorname{Re}\varphi(a)<c\le\operatorname{Re}\varphi(b)$ となるものがある。
2. $A$ がコンパクト、$B$ が閉なら、$\varphi\in X^{*}$ と $c_{1}<c_{2}$ で $\operatorname{Re}\varphi(a)\le c_{1}<c_{2}\le\operatorname{Re}\varphi(b)$ となるものがある。
:::

::: proof
**Step 1（実の場合の 1）.** $\mathbb{K}=\mathbb{R}$ とする。$a_{0}\in A$, $b_{0}\in B$, $x_{0}\defeq b_{0}-a_{0}$、$C\defeq A-B+x_{0}=\{a-b+x_{0}\}$ とおく。$C$ は凸で、開集合 $A-b+x_{0}$ の和なので開、$0\in C$。$A\cap B=\varnothing$ なので $x_{0}\notin C$、よって $p_{C}(x_{0})\ge1$（\ref{fa:minkowski-functional}）。$\mathbb{R}x_{0}$ 上 $f(tx_{0})\defeq t$ は $f\le p_{C}$（$t>0$ で $t\le tp_{C}(x_{0})$、$t\le0$ で $f\le0\le p_{C}$）。\ref{fa:hahn-banach-real} の延長 $F\le p_{C}$ は $|F(x)|\le\|x\|/r$ で連続。$a\in A$, $b\in B$ について $F(a)-F(b)+1=F(a-b+x_{0})\le p_{C}(a-b+x_{0})<1$ なので $F(a)<F(b)$。$F(A)$ は $\mathbb{R}$ の凸集合で、開（$F(x_{0})=1$ なので $F(a+tx_{0})=F(a)+t$ が小さい $|t|$ で $F(A)$ に入る）なので、$c\defeq\sup F(A)$ は達成されず、$F(a)<c\le F(b)$。

**Step 2（複素の場合）.** 複素ノルム空間を実ノルム空間とみて Step 1 の実線形 $F$ を得て、$\varphi(x)\defeq F(x)-iF(ix)$（複素線形、$\operatorname{Re}\varphi=F$、$\|\varphi\|=\|F\|$ は \ref{fa:hahn-banach-complex} の証明と同じ計算）。

**Step 3（2）.** \ref{top:compact-closed-distance} から $\delta>0$ で $\operatorname{dist}(a,B)\ge\delta$（$a\in A$）。$A'\defeq A+B(0,\delta/2)$ は開凸集合で $B$ と交わらない。1 から $\operatorname{Re}\varphi(a+z)<c\le\operatorname{Re}\varphi(b)$（$\|z\|<\delta/2$）。$\varphi\ne0$ なので $\sup_{\|z\|<\delta/2}\operatorname{Re}\varphi(z)=\frac\delta2\|\varphi\|>0$ で、$\operatorname{Re}\varphi(a)\le c-\frac\delta2\|\varphi\|\eqdef c_{1}<c\eqdef c_{2}$。

::: hypcheck
- **凸性**は Step 1 で $C$ が凸（ミンコフスキー汎関数の劣加法性）であることに使った。
- **開集合**：1 で $A$ が開でなければ、$\le$ と $<$ の区別が崩れる（たとえば $A$ も $B$ も閉で漸近する場合、狭義の分離はできない）。
- **選択公理**：ハーン–バナッハの定理を通して使った。
:::
:::

::: supplement
**高い視点：双対性の原理.** ハーン–バナッハの定理は、「ノルム空間の幾何（ノルム、閉凸集合）は、連続線形汎関数の族だけで記述できる」という双対性の原理の基礎である：ノルムは双対の単位球で計算でき（\ref{fa:hahn-banach-normed.2}）、閉凸集合はそれを含む閉半空間の共通部分（問題 \ref{fa:prob-hb-convex-halfspaces}）で、部分空間の閉包は直交する汎関数の消える集合である。これは線形計画法の双対定理、凸解析のルジャンドル変換、分布論（超関数）を双対空間として定義する考え方の共通の根である。選択公理なしではハーン–バナッハの定理は一般には証明できないが、選択公理より真に弱い（超フィルター補題から従う）ことが知られている。比喩で言えば、双対空間の元は「空間を一つの方向から眺める影」で、ハーン–バナッハの定理は、十分たくさんの方向からの影を集めれば、凸な形は影だけから完全に復元できると保証している。
:::

## 問題 {#fa:sec-hb-problems}

::: problem {#fa:prob-hb-convex-halfspaces}
実ノルム空間の閉凸集合 $K$ は、$K$ を含む閉半空間 $\{x:\varphi(x)\le c\}$（$\varphi\in X^{*}$）すべての共通部分に等しいことを示せ。
:::

::: solution
$K$ はそれらの共通部分に含まれる。$x\notin K$ なら、$\{x\}$（コンパクト凸）と $K$（閉凸）に \ref{fa:separation.2} を使い（$K=\varnothing$ なら共通部分は空でない半空間 $\{0\cdot x\le-1\}=\varnothing$ を含むので自明）、$\psi\in X^{*}$ と $c_{1}<c_{2}$ で $\psi(x)\le c_{1}<c_{2}\le\psi(k)$（$k\in K$）。$\varphi\defeq-\psi$, $c\defeq-c_{2}$ とすると $K\subset\{\varphi\le c\}$ で $\varphi(x)\ge-c_{1}>c$。よって $x$ は共通部分に属さない。
:::

::: problem {#fa:prob-hb-separable-dual}
ノルム空間 $X$ の双対 $X^{*}$ が可分なら $X$ も可分であることを示せ。
:::

::: solution
$\{\varphi_{n}\}$ を $X^{*}$ の稠密な列とし（$\varphi_{n}\ne0$ としてよい）、$x_{n}$ を $\|x_{n}\|=1$, $|\varphi_{n}(x_{n})|\ge\frac12\|\varphi_{n}\|$ となるように選ぶ（可算選択公理）。$N\defeq\overline{\operatorname{span}}\{x_{n}\}$ は可分（有理係数の一次結合が稠密）。$N\ne X$ なら \ref{fa:hahn-banach-normed.3} から $\varphi\ne0$ で $\varphi\restriction N=0$, $\|\varphi\|=1$。$\|\varphi_{n}-\varphi\|<\frac14$ となる $n$ をとると、$\|\varphi_{n}\|>\frac34$ で $\frac12\|\varphi_{n}\|\le|\varphi_{n}(x_{n})|=|(\varphi_{n}-\varphi)(x_{n})|<\frac14$、$\|\varphi_{n}\|<\frac12$ となり矛盾。よって $X=N$ は可分。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{fa:sec-hb-exercises} にまとめた。
