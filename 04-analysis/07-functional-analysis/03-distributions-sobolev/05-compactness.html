# レリッヒ–コンドラショフとポアンカレ {#fa:page-compactness keywords="Rellich-Kondrachov compactness theorem: for bounded C^1 domains, bounded sequences in W^{1,p} have subsequences converging in L^q for q < p*; W^{1,p}_0 on arbitrary bounded open sets; mollification estimate ||u_eps - u||_1 <= eps ||grad u||_1; Poincare inequality on W^{1,p}_0 for bounded sets; functions with zero gradient on connected sets are constant; Poincare-Wirtinger inequality for the mean; equivalent norms on H^1_0"}

ソボレフの埋め込み（\ref{fa:page-embeddings}）は「$W^{1,p}$ で有界な列は $L^{p^{*}}$ でも有界」と言うが、有界領域では、指数を少し下げた $L^{q}$（$q<p^{*}$）で、さらに**収束する部分列**がとれる。これが**レリッヒ–コンドラショフの定理**で、偏微分方程式の存在証明（変分法で最小値をとる列から収束部分列をとる）や固有値問題（逆作用素がコンパクトになる）の要である。証明は、軟化した関数たちがアスコリ–アルツェラの定理で一様に収束する部分列をもち、軟化による誤差が $W^{1,p}$ ノルムで一様に小さいことの組み合わせである。後半では、有界領域で関数の大きさを導関数の大きさで抑える**ポアンカレの不等式**を示す：$W_{0}^{1,p}$ では直接の計算で、平均を引いた形（ポアンカレ–ヴィルティンガー）ではコンパクト性を使う。

## 記法と定義の確認 {#fa:sec-cp-notation}

::: notation
- $W^{1,p}$, $W_{0}^{1,p}$, 延長作用素、ソボレフの埋め込みは \ref{fa:page-sobolev-spaces}, \ref{fa:page-extension-trace}, \ref{fa:page-embeddings}。$1\le p<\infty$。
- コンパクト集合上の一様有界・同等連続な関数の列は一様収束する部分列をもつこと）は \ref{top:ascoli-classical}。
- 有界な $\Omega$ と $u\in L^{1}(\Omega)$ について $u_{\Omega}\defeq\frac{1}{|\Omega|}\int_{\Omega}u$（平均）。
- 補間：$1\le q_{0}\le q\le q_{1}\le\infty$, $\frac1q=\frac{\theta}{q_{0}}+\frac{1-\theta}{q_{1}}$ なら $\|v\|_{q}\le\|v\|_{q_{0}}^{\theta}\|v\|_{q_{1}}^{1-\theta}$（ヘルダーの不等式、\ref{fa:gns-inequality} の証明の Step 3）。
- **選択公理**：ポアンカレ–ヴィルティンガーの不等式（\ref{fa:poincare-wirtinger}）の証明で可算選択公理を使う。それ以外では使わない。
:::

## コンパクト性 {#fa:sec-cp-rellich}

::: lemma 軟化の誤差 {#fa:mollification-error keywords="for u in W^{1,1}(R^n), ||rho_eps * u - u||_1 <= eps ||grad u||_1; mollified functions of a bounded set in L^1 are uniformly bounded and uniformly Lipschitz" index="軟化の誤差|なんかのごさ"}
1. $u\in W^{1,1}(\mathbb{R}^{n})$ なら $\|\rho_{\varepsilon}*u-u\|_{1}\le\varepsilon\|\nabla u\|_{1}$。
2. $u\in L^{1}(\mathbb{R}^{n})$ なら $|\rho_{\varepsilon}*u|\le\|\rho_{\varepsilon}\|_{\infty}\|u\|_{1}$、$|\nabla(\rho_{\varepsilon}*u)|\le\|\nabla\rho_{\varepsilon}\|_{\infty}\|u\|_{1}$（各点）。
:::

::: proof
**1.** $u\in C_{c}^{1}$ のとき：$\int\rho=1$ と線分上の微積分の基本定理から
$$
(\rho_{\varepsilon}*u)(x)-u(x)=\int\rho(z)\bigl(u(x-\varepsilon z)-u(x)\bigr)dz=-\int\rho(z)\int_{0}^{1}\varepsilon z\cdot\nabla u(x-t\varepsilon z)\,dt\,dz.
$$
絶対値をとって $x$ で積分し、トネリと平行移動不変性、$\operatorname{supp}\rho\subset\{|z|\le1\}$ から $\le\varepsilon\int\rho(z)|z|dz\,\|\nabla u\|_{1}\le\varepsilon\|\nabla u\|_{1}$。一般の $u$ は \ref{fa:test-dense-rn} の近似列で極限をとる（両辺は $W^{1,1}$ で連続）。

**2.** $|(\rho_{\varepsilon}*u)(x)|\le\int|\rho_{\varepsilon}(x-y)||u(y)|dy$。導関数は \ref{fa:mollification.1}。
:::

::: theorem レリッヒ–コンドラショフの定理 {#fa:rellich-kondrachov keywords="Rellich-Kondrachov: if Omega is bounded with C^1 boundary, 1 <= p < n and 1 <= q < p*, every bounded sequence in W^{1,p}(Omega) has a subsequence converging in L^q(Omega); for p >= n any q < infinity; for W^{1,p}_0 the boundary may be arbitrary" index="レリッヒ–コンドラショフの定理|れりっひこんどらしょふのていり, コンパクト埋め込み|こんぱくとうめこみ"}
$\Omega$ を有界な開集合とする。
1. $\Omega$ が $C^{1}$ 境界をもち、$1\le p<n$, $1\le q<p^{*}$ なら、$W^{1,p}(\Omega)$ の有界列は $L^{q}(\Omega)$ で収束する部分列をもつ。すなわち埋め込み $W^{1,p}(\Omega)\hookrightarrow L^{q}(\Omega)$ はコンパクト作用素。
2. $p\ge n$ なら、1 はすべての $1\le q<\infty$ で成り立つ。
3. $W_{0}^{1,p}(\Omega)$ については、境界の仮定なしに 1・2 が成り立つ。
:::

::: proof
**1.** **Step 1（$\mathbb{R}^{n}$ の有界集合に移す）.** $(u_{k})$ を $\|u_{k}\|_{W^{1,p}}\le M$ とし、\ref{fa:extension-theorem} の $v_{k}\defeq Eu_{k}$ をとる。$v_{k}$ の台は固定した有界集合 $V$ に入り、$\|v_{k}\|_{W^{1,p}(\mathbb{R}^{n})}\le CM$。$V$ は有界なので $\|v_{k}\|_{1},\|\nabla v_{k}\|_{1}\le C'M$（ヘルダー）、\ref{fa:gns-inequality.2} から $\|v_{k}\|_{p^{*}}\le C''M$。

**Step 2（誤差の一様評価）.** $\frac1q=\frac{\theta}{1}+\frac{1-\theta}{p^{*}}$ となる $\theta\in(0,1]$ をとる（$1\le q<p^{*}$）。\ref{fa:mollification-error.1} と補間から
$$
\|\rho_{\varepsilon}*v_{k}-v_{k}\|_{q}\le\|\rho_{\varepsilon}*v_{k}-v_{k}\|_{1}^{\theta}\|\rho_{\varepsilon}*v_{k}-v_{k}\|_{p^{*}}^{1-\theta}\le(\varepsilon C'M)^{\theta}(2C''M)^{1-\theta}
$$
（$\|\rho_{\varepsilon}*v\|_{p^{*}}\le\|v\|_{p^{*}}$、\ref{four:convolution-rd.1}）。右辺は $k$ によらず、$\varepsilon\to0$ で $0$。

**Step 3（対角線論法）.** $\varepsilon\le1$ なら $\rho_{\varepsilon}*v_{k}$ の台はコンパクト集合 $\overline{V_{1}}$（$V$ の $1$ 近傍）に入る。\ref{fa:mollification-error.2} から、$\varepsilon$ を固定すると $(\rho_{\varepsilon}*v_{k})_{k}$ は $\overline{V_{1}}$ 上で一様有界かつ一様リプシッツ（したがって同等連続）。\ref{top:ascoli-classical} から一様収束する部分列があり、$\overline{V_{1}}$ は有界なので $L^{q}$ でも収束する。$\varepsilon=\frac1j$（$j=1,2,\dots$）について順に部分列をとり、対角線をとると、部分列 $(w_{k})$ で、すべての $j$ について $(\rho_{1/j}*w_{k})_{k}$ が $L^{q}$ のコーシー列となるものが得られる（部分列の選び方はアスコリ–アルツェラの定理の証明の対角線論法で具体的に決まる）。

**Step 4.** $\delta>0$ について、Step 2 から $j$ を $\sup_{k}\|\rho_{1/j}*w_{k}-w_{k}\|_{q}<\delta$ となるようにとり、Step 3 から $k,l$ が大きければ $\|\rho_{1/j}*w_{k}-\rho_{1/j}*w_{l}\|_{q}<\delta$。三角不等式から $\|w_{k}-w_{l}\|_{q}<3\delta$。$(w_{k})$ は $L^{q}(\mathbb{R}^{n})$ のコーシー列で収束し、$\Omega$ に制限すれば元の列の部分列の $L^{q}(\Omega)$ での収束を与える。

**2.** $p\ge n$ と $q<\infty$ について、$r<n\le p$ を $r^{*}=\frac{nr}{n-r}>q$ となるようにとる（$r\uparrow n$ で $r^{*}\to\infty$）。$\Omega$ は有界なので $\|u\|_{W^{1,r}}\le C\|u\|_{W^{1,p}}$（\ref{meas:lp-inclusions.1}）で、1 を $r$ に使う。

**3.** $W_{0}^{1,p}$ の元は $\Omega$ の外で $0$ と延ばせば $W^{1,p}(\mathbb{R}^{n})$ の元で（$C_{c}^{\infty}(\Omega)$ の元について明らかで、閉包をとる）、台は $\overline\Omega$ に入る。Step 1 の延長の代わりにこれを使えば同じ証明が通る。
:::

## ポアンカレの不等式 {#fa:sec-cp-poincare}

::: theorem ポアンカレの不等式 {#fa:poincare-inequality keywords="Poincare inequality: if Omega lies in a slab of width 2a then ||u||_p <= 2a ||d_1 u||_p for u in W^{1,p}_0(Omega); hence ||grad u||_p is an equivalent norm on W^{1,p}_0 for bounded Omega" index="ポアンカレの不等式|ぽあんかれのふとうしき"}
$\Omega$ が帯状領域 $\{|x_{1}|<a\}$ に含まれるなら、$u\in W_{0}^{1,p}(\Omega)$ について $\|u\|_{p}\le2a\|\partial_{1}u\|_{p}$。とくに有界な $\Omega$ では、$\|\nabla u\|_{p}$ は $W_{0}^{1,p}(\Omega)$ 上で $\|u\|_{W^{1,p}}$ と同値なノルムである。
:::

::: proof
$u\in C_{c}^{\infty}(\Omega)$ を $\Omega$ の外で $0$ と延ばす。$u(x)=\int_{-a}^{x_{1}}\partial_{1}u(t,x_{2},\dots,x_{n})\,dt$ で、ヘルダーの不等式から $|u(x)|^{p}\le(2a)^{p-1}\int_{-a}^{a}|\partial_{1}u(t,\dots)|^{p}dt$。$x_{1}\in(-a,a)$ と残りの座標で積分すると $\|u\|_{p}^{p}\le(2a)^{p}\|\partial_{1}u\|_{p}^{p}$。$W_{0}^{1,p}$ へは閉包をとる。同値性：$\|\nabla u\|_{p}\le n\|u\|_{W^{1,p}}$ と、逆向きは $\|u\|_{W^{1,p}}\le\|u\|_{p}+\sum_{j}\|\partial_{j}u\|_{p}\le(2a+n)\|\nabla u\|_{p}$。
:::

::: lemma 勾配が 0 の関数 {#fa:zero-gradient keywords="if Omega is connected and u in W^{1,1}_loc(Omega) has grad u = 0, then u is a.e. constant" index="勾配が 0 のソボレフ関数|こうばいが0のそぼれふかんすう"}
$\Omega$ が連結で、$u\in L_{\mathrm{loc}}^{1}(\Omega)$ の弱勾配が $0$ なら、$u$ は a.e. で定数。
:::

::: proof
**Step 1（局所）.** 球 $B$ で $\overline{B}\subset\Omega$ となるものをとる。$\varepsilon<\operatorname{dist}(\overline B,\mathbb{R}^{n}\setminus\Omega)$ なら $B\subset\Omega_{\varepsilon}$ で、\ref{fa:mollification-sobolev.1} から $\nabla(\rho_{\varepsilon}*u)=\rho_{\varepsilon}*\nabla u=0$ が $B$ の上で成り立つ。$B$ は連結（凸）なので $\rho_{\varepsilon}*u$ は $B$ で定数 $c_{\varepsilon}$。$\varepsilon\to0$ で $\rho_{\varepsilon}*u\to u$（$L^{1}(B)$、\ref{fa:mollification.3}）なので、$c_{\varepsilon}$ は収束し、$u$ は $B$ の上で a.e. 定数。

**Step 2（大域）.** $c$ を、ある球の上で $u=c$ a.e. となる値の一つとし、$G\defeq\{x\in\Omega:x\text{ のある近傍で }u=c\text{ a.e.}\}$ とする。$G$ は空でない開集合。$x\in\Omega\setminus G$ なら、Step 1 から $x$ の近傍の球で $u=c'$ a.e.、$c'\ne c$（$c'=c$ なら $x\in G$）なので、その球は $G$ と交わらない（交われば共通部分の正測度の集合で $c=c'$）。よって $\Omega\setminus G$ も開集合で、連結性から $G=\Omega$。$\Omega$ は可算個の球で覆われる（有理点中心・有理半径）ので、$u=c$ a.e.。
:::

::: theorem ポアンカレ–ヴィルティンガーの不等式 {#fa:poincare-wirtinger keywords="Poincare-Wirtinger inequality: for a bounded connected C^1 domain and 1 <= p < infinity, ||u - u_Omega||_p <= C ||grad u||_p for all u in W^{1,p}(Omega); proof by contradiction using Rellich-Kondrachov" index="ポアンカレ–ヴィルティンガーの不等式|ぽあんかれう゛ぃるてぃんがーのふとうしき"}
$\Omega$ を $C^{1}$ 境界をもつ有界な連結開集合、$1\le p<\infty$ とする。定数 $C$ があって、すべての $u\in W^{1,p}(\Omega)$ で $\|u-u_{\Omega}\|_{p}\le C\|\nabla u\|_{p}$。
:::

::: proof
成り立たないとすると、各 $k$ について $\|u_{k}-(u_{k})_{\Omega}\|_{p}>k\|\nabla u_{k}\|_{p}$ となる $u_{k}$ がある（ここで $u_{k}$ を一つずつ選ぶのに可算選択公理を使う）。$v_{k}\defeq\frac{u_{k}-(u_{k})_{\Omega}}{\|u_{k}-(u_{k})_{\Omega}\|_{p}}$ とすると、$(v_{k})_{\Omega}=0$, $\|v_{k}\|_{p}=1$, $\|\nabla v_{k}\|_{p}<\frac1k$。$(v_{k})$ は $W^{1,p}$ で有界なので、\ref{fa:rellich-kondrachov}（$q=p<p^{*}$、$p\ge n$ なら 2）から部分列が $L^{p}$ で $v$ に収束する。$\|v\|_{p}=1$、$v_{\Omega}=0$（平均は $L^{p}$ で連続、$\Omega$ は有界）。$\varphi\in C_{c}^{\infty}(\Omega)$ について $\int v\,\partial_{j}\varphi=\lim\int v_{k}\partial_{j}\varphi=-\lim\int\partial_{j}v_{k}\varphi=0$（$|\int\partial_{j}v_{k}\varphi|\le\|\nabla v_{k}\|_{p}\|\varphi\|_{p'}\to0$）。よって $\nabla v=0$ で、\ref{fa:zero-gradient} から $v$ は定数、$v_{\Omega}=0$ から $v=0$。$\|v\|_{p}=1$ に反する。
:::

::: hypcheck
- レリッヒ–コンドラショフの定理で $q<p^{*}$ は本質的：$q=p^{*}$ では、$u_{\lambda}(x)\defeq\lambda^{n/p^{*}}u(\lambda x)$（$u\in C_{c}^{\infty}(B)$ 固定、$\lambda\to\infty$）は $W^{1,p}$ で有界（$\|\nabla u_{\lambda}\|_{p}=\|\nabla u\|_{p}$）だが、$L^{p^{*}}$ ノルムは一定のまま一点に集中し、収束する部分列をもたない。
- 有界性は本質的：$\mathbb{R}^{n}$ では平行移動 $u(\cdot-ke_{1})$ が有界で収束部分列をもたない列を与える。
- ポアンカレの不等式は、$W^{1,p}$ 全体（境界条件なし）では成り立たない：定数関数 $1$ は $\nabla1=0$ だが $\|1\|_{p}>0$。$W_{0}^{1,p}$ の境界条件か、平均を引く（ヴィルティンガー）ことが必要。
- ポアンカレ–ヴィルティンガーの不等式で連結性は本質的：二つの成分で異なる定数をとる関数は、勾配 $0$ で平均を引いても $0$ にならない。
- 背理法の証明は定数 $C$ の値を与えない。$p=2$ では最良の $C$ はノイマン境界条件のラプラシアンの最小の正の固有値の平方根の逆数で、\ref{four:prob-fj-wirtinger} はその 1 次元版である。
:::

::: supplement
**関連する結果.**
- コンパクト埋め込みから、ディリクレ境界条件のラプラシアン $-\Delta$ の逆作用素 $H_{0}^{1}\to H_{0}^{1}$（あるいは $L^{2}\to L^{2}$）はコンパクトな自己共役作用素になり、\ref{fa:compact-selfadjoint-spectral} から固有関数による $L^{2}(\Omega)$ の正規直交基底が得られる。偏微分方程式の系列で扱う予定。
- レリッヒの定理はより一般に、$s>t$ なら $H^{s}(\mathbb{T}^{n})\hookrightarrow H^{t}(\mathbb{T}^{n})$ がコンパクト（フーリエ係数で見ると、重み $(1+|k|^{2})^{(t-s)/2}\to0$ の対角作用素なので明らか）という形でも理解できる。

**高い視点：コンパクト性の源.** 無限次元のバナッハ空間では有界閉集合はコンパクトでない（\ref{fa:compact-unit-ball}）。レリッヒの定理は、「微分の情報が 1 階分余っていて、領域が有界」なら、有界列は弱い位相（$L^{q}$）で相対コンパクトになるという、関数空間でのコンパクト性の主な源である。フーリエ側では、領域の有界性が周波数を離散化し、微分の余りが高い周波数の寄与を一様に小さくする。比喩で言えば、有界な部屋（領域）の中で、細かく震える（高周波の）ことにエネルギーの上限があれば、関数たちは有限個の「低い音」の組み合わせでほぼ記述でき、有限次元のように振る舞う。
:::

## 問題 {#fa:sec-cp-problems}

::: problem {#fa:prob-cp-not-compact-linfty}
$\Omega=(0,1)$ で、$W^{1,1}((0,1))\hookrightarrow L^{\infty}((0,1))$ は連続だがコンパクトでないことを、$u_{k}(x)\defeq\min(kx,1)$ で示せ。
:::

::: solution
連続性：\ref{fa:sobolev-one-dimension} の代表元について $|\tilde u(x)|\le|\tilde u(y)|+\int_{0}^{1}|u'|$ を $y$ で積分して $\sup|\tilde u|\le\|u\|_{1}+\|u'\|_{1}$。$u_{k}$ は絶対連続で $\|u_{k}\|_{W^{1,1}}\le1+\int_{0}^{1/k}k=2$。$u_{k}$ は各点で $\mathbf{1}_{(0,1)}$ に収束するので、$L^{\infty}$ で収束する部分列があればその極限は（a.e. で）$1$ で、$\|u_{k}-1\|_{\infty}\ge\sup_{0<x<1/k}(1-kx)=1$ に反する。
:::

::: problem {#fa:prob-cp-poincare-1d}
$u\in H_{0}^{1}((0,1))$ について $\|u\|_{2}\le\frac1\pi\|u'\|_{2}$ を示せ（定数 $\frac1\pi$ は最良）。
:::

::: solution
$u\in C_{c}^{\infty}((0,1))$ を $[-1,1]$ に奇関数として延ばし周期 $2$ に延ばすと、$C^{1}$ 級で平均 $0$ の周期関数 $U$ になる（$u$ は $0,1$ の近くで $0$）。周期 $2$ を $1$ に縮めた $V(x)\defeq U(2x)$ に \ref{four:prob-fj-wirtinger} を使うと $\|V\|_{L^{2}(0,1)}\le\frac{1}{2\pi}\|V'\|_{L^{2}(0,1)}$。$\|V\|^{2}_{L^{2}(0,1)}=\frac12\int_{-1}^{1}U^{2}=\|u\|_{2}^{2}$、$\|V'\|^{2}=\frac{4}{2}\int_{-1}^{1}U'^{2}=4\|u'\|_{2}^{2}$。よって $\|u\|_{2}\le\frac{1}{2\pi}\cdot2\|u'\|_{2}=\frac1\pi\|u'\|_{2}$。閉包をとれば $H_{0}^{1}$ で成り立つ。$u=\sin(\pi x)$ で等号が成り立つ（$\|u\|_{2}^{2}=\frac12$, $\|u'\|_{2}^{2}=\frac{\pi^{2}}{2}$）。$\sin(\pi x)\in H_{0}^{1}$ であること：$\eta\in C^{\infty}(\mathbb{R})$ を $t\le1$ で $0$、$t\ge2$ で $1$ とし、$\eta_{k}(x)\defeq\eta(kx)\eta(k(1-x))$ とすると $\eta_{k}\sin(\pi x)\in C_{c}^{\infty}((0,1))$。差の導関数の主要部 $\eta_{k}'\sin(\pi x)$ は $|x|\le\frac2k$（と $1$ の近く）でしか $0$ でなく、そこで $|\eta_{k}'|\le k\sup|\eta'|$, $|\sin(\pi x)|\le\frac{2\pi}{k}$ なので有界、台の測度は $\frac4k\to0$。残りの項は優収束定理で $0$ に収束し、$\eta_{k}\sin(\pi x)\to\sin(\pi x)$（$H^{1}$）。
:::
