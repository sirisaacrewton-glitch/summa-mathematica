# 超関数とソボレフ空間（Distributions and Sobolev Spaces）

テスト関数と軟化子、開集合上の超関数、弱微分とソボレフ空間、延長とトレース、ソボレフの埋め込み定理、レリッヒ–コンドラショフのコンパクト性とポアンカレの不等式、ラックス–ミルグラムの定理。

<p class="mn-msc">MSC2020: 46F05, 46E35, 35D30</p>
