# 演習：超関数とソボレフ空間 {#fa:page-exercises-sobolev keywords="exercises, Distributions and Sobolev Spaces"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な超関数の微分と収束の計算、特異点をもつ関数がソボレフ空間に入るかどうかの判定、境界値と $W_{0}^{1,p}$ の関係、埋め込みの指数が最良であることの例、ポアンカレの不等式の定数、ラックス–ミルグラムの定理による 1 次元の境界値問題の解法と有限要素法の誤差評価と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#fa:sec-exfa3-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。超関数とその演算は \ref{fa:distribution}, \ref{fa:distribution-operations}、ソボレフ空間と弱微分は \ref{fa:sobolev-space}、$W_{0}^{k,p}$ と $C^{1}$ 境界は \ref{fa:c1-boundary}、ラックス–ミルグラムの定理の設定は \ref{fa:lax-milgram}。
- 関数は複素数値。$\Omega\subset\mathbb{R}^{n}$ は空でない開集合、$B(x,r)$ は開球、$\omega_{n}\defeq|B(0,1)|$。$\Omega_{\varepsilon}$, 軟化子 $\rho_{\varepsilon}$ は \ref{fa:mollifier} のとおり。
- $\eta\in C_{c}^{\infty}((-2,2))$ を、$0\le\eta\le1$ で $[-1,1]$ の近傍で $\eta=1$ となるものとして一つ固定する（\ref{fa:test-function-density.2}）。$\eta(k|x|)$ は $|x|<\frac1k$ で $1$ に等しく、$x\ne0$ では $|x|$ が $C^{\infty}$ なので、$\mathbb{R}^{n}$ 上の $C^{\infty}$ 関数である。
- 1 次元のソボレフ関数 $u\in W^{1,p}(I)$ について、$\tilde u$ は \ref{fa:sobolev-one-dimension} の絶対連続な代表元、$u'$ は弱微分。
- **選択公理**：ポアンカレ–ヴィルティンガーの不等式（\ref{fa:poincare-wirtinger}）を使う \ref{fa:ex-cp-2} と \ref{fa:ex-lm-2} では、その証明を通じて可算選択公理を使う。それ以外では使わない。
:::

## テスト関数と超関数 {#fa:sec-di-exercises}

対応するページ：\ref{fa:page-distributions}

::: problem ★ 基本：跳びのある関数の微分と振動する関数の収束 {#fa:ex-di-1}
1. $f\colon\mathbb{R}\to\mathbb{C}$ の $(-\infty,0)$ と $(0,\infty)$ への制限が、それぞれ $(-\infty,0]$ と $[0,\infty)$ 上の $C^{1}$ 関数に延びるとする。延ばした関数の $0$ での値を $f(0-)$, $f(0+)$ と書き、$f'$ を $\mathbb{R}\setminus\{0\}$ での古典的な導関数とする。超関数の意味で $f'=f'|_{\mathbb{R}\setminus\{0\}}+\bigl(f(0+)-f(0-)\bigr)\delta$ であることを示せ。これを使って、$H\defeq\mathbf{1}_{(0,\infty)}$ について $E(x)\defeq H(x)\sin x$ が $E''+E=\delta$ を満たすことを確かめよ。
2. 各整数 $m\ge0$ について、$\mathcal{D}'(\mathbb{R})$ で $k^{m}\sin(kx)\to0$（$k\to\infty$）を示せ。一方、$\sin(kx)$ は $L_{\mathrm{loc}}^{1}(\mathbb{R})$ では $0$ に収束しないこと、すなわち $\int_{0}^{2\pi}|\sin(kx)|\,dx=4$ を示せ。
3. $\mathcal{D}'(\mathbb{R})$ で $\sin^{2}(kx)\to\frac12$ を示せ。2 と合わせて、超関数の収束は 2 乗をとる操作と両立しないことを確かめよ。
:::

::: solution
**1.** $\varphi\in C_{c}^{\infty}(\mathbb{R})$, $\operatorname{supp}\varphi\subset[-R,R]$ とする。$[0,R]$ と $[-R,0]$ の上では $f$（延ばしたもの）は $C^{1}$ なので、通常の部分積分から
$$
\int_{0}^{R}f\varphi'\,dx=f(R)\varphi(R)-f(0+)\varphi(0)-\int_{0}^{R}f'\varphi\,dx=-f(0+)\varphi(0)-\int_{0}^{\infty}f'\varphi\,dx,
$$
$$
\int_{-R}^{0}f\varphi'\,dx=f(0-)\varphi(0)-\int_{-\infty}^{0}f'\varphi\,dx .
$$
（$\varphi(\pm R)=0$。$1$ 点 $\{0\}$ は測度 $0$ なので、$\int_{-R}^{0}$ の $f$ を延ばしたものに替えても積分は変わらない。）よって
$$
\langle f',\varphi\rangle=-\int_{\mathbb{R}}f\varphi'\,dx=\int_{\mathbb{R}\setminus\{0\}}f'\varphi\,dx+\bigl(f(0+)-f(0-)\bigr)\varphi(0),
$$
これが主張である（$f'$ は各有界区間で有界なので局所可積分）。

$E=H\sin$ は $x<0$ で $0$、$x>0$ で $\sin x$ なので、$E(0+)=E(0-)=0$ で、上の公式から $E'=H\cos$（古典的な導関数を $x\ne0$ で考えた関数）。$H\cos$ は $E'(0+)=\cos0=1$, $E'(0-)=0$ なので、もう一度公式を使うと $E''=-H\sin+\delta=-E+\delta$。よって $E''+E=\delta$。（$E$ は作用素 $\frac{d^{2}}{dx^{2}}+1$ の基本解である。）

**2.** $\operatorname{supp}\varphi\subset[-R,R]$ とする。$k\ge1$ について $e^{ikx}=\frac{1}{ik}\frac{d}{dx}e^{ikx}$ なので、部分積分（境界項は $\varphi^{(j)}(\pm R)=0$ で消える）から
$$
\int e^{ikx}\varphi(x)\,dx=-\frac{1}{ik}\int e^{ikx}\varphi'(x)\,dx .
$$
これを $N$ 回繰り返すと $\int e^{ikx}\varphi=\bigl(-\frac{1}{ik}\bigr)^{N}\int e^{ikx}\varphi^{(N)}$、よって $\bigl|\int e^{\pm ikx}\varphi\bigr|\le k^{-N}\|\varphi^{(N)}\|_{1}$（$-k$ でも同じ計算）。$\sin(kx)=\frac{1}{2i}(e^{ikx}-e^{-ikx})$ なので
$$
\Bigl|\int k^{m}\sin(kx)\varphi(x)\,dx\Bigr|\le k^{m-N}\|\varphi^{(N)}\|_{1}.
$$
$N\defeq m+1$ とすれば右辺は $\frac1k\|\varphi^{(m+1)}\|_{1}\to0$。よって $k^{m}\sin(kx)\to0$（$\mathcal{D}'$）。

一方、$t=kx$ と置換すると、$|\sin t|$ が周期 $\pi$ で $\int_{0}^{\pi}\sin t\,dt=2$ なので
$$
\int_{0}^{2\pi}|\sin(kx)|\,dx=\frac1k\int_{0}^{2k\pi}|\sin t|\,dt=\frac1k\cdot2k\cdot2=4 .
$$
よってコンパクト集合 $[0,2\pi]$ の上の $L^{1}$ ノルムは $0$ に近づかない。

**3.** $\sin^{2}(kx)=\frac12-\frac12\cos(2kx)$ で、2 と同じ計算（$\cos(2kx)=\frac12(e^{2ikx}+e^{-2ikx})$, $N=1$）から $\bigl|\int\cos(2kx)\varphi\bigr|\le\frac{1}{2k}\|\varphi'\|_{1}\to0$。よって $\sin^{2}(kx)\to\frac12$（$\mathcal{D}'$）。2 から $\sin(kx)\to0$ だが、その 2 乗の極限は $0^{2}=0$ ではない。
:::

::: problem ★★ 標準：主値の階数は 1 {#fa:ex-di-2}
$\operatorname{p.v.}\frac1x$ を \ref{fa:distribution-examples.4} の超関数とする。
1. $\operatorname{p.v.}\frac1x$ は階数 $0$ の超関数ではないこと、したがって階数がちょうど $1$ であることを示せ。
2. $\operatorname{p.v.}\frac1x$ は局所可積分関数の定める超関数 $T_{f}$（$f\in L_{\mathrm{loc}}^{1}(\mathbb{R})$）ではないことを示せ。
3. 関数 $x$ との積について $x\cdot\operatorname{p.v.}\frac1x=1$ を示せ。
:::

::: solution
**1.** 階数 $0$ であるとすると、コンパクト集合 $K\defeq[0,1]$ について定数 $C\ge0$ があって、$\operatorname{supp}\varphi\subset K$ となるすべての $\varphi$ で $|\operatorname{p.v.}\frac1x(\varphi)|\le C\sup|\varphi|$ となる。

$k\ge3$ について、\ref{fa:test-function-density.2} をコンパクト集合 $[\frac1k,\frac12]$ と開集合 $(\frac{1}{2k},1)$ に使い、$\varphi_{k}\in C_{c}^{\infty}((\frac1{2k},1))$ で $0\le\varphi_{k}\le1$、$[\frac1k,\frac12]$ の上で $\varphi_{k}=1$ となるものをとる（構成は \ref{fa:test-function-density} の証明で具体的に決まる）。$\operatorname{supp}\varphi_{k}\subset K$ で $\sup|\varphi_{k}|\le1$。$\varepsilon<\frac{1}{2k}$ なら、$\varphi_{k}$ は $(-\infty,\frac1{2k}]$ で $0$ なので
$$
\int_{|x|>\varepsilon}\frac{\varphi_{k}(x)}{x}\,dx=\int_{1/(2k)}^{1}\frac{\varphi_{k}(x)}{x}\,dx\ge\int_{1/k}^{1/2}\frac{dx}{x}=\log\frac k2
$$
（被積分関数は非負）。$\varepsilon\to0$ として $\operatorname{p.v.}\frac1x(\varphi_{k})\ge\log\frac k2$。すると $\log\frac k2\le C$ がすべての $k\ge3$ で成り立つことになり矛盾。よって階数 $0$ ではない。

一方 \ref{fa:distribution-examples.4} の証明から、$\operatorname{supp}\varphi\subset[-R,R]$ なら $|\operatorname{p.v.}\frac1x(\varphi)|\le2R\|\varphi\|_{C^{1}}$ なので、どの $K$ についても $N_{K}=1$ がとれる。$K$ によらない $N_{K}$ の最小値は $0$ ではないので $1$、すなわち階数はちょうど $1$ である。

**2.** $f\in L_{\mathrm{loc}}^{1}$ なら $T_{f}$ は階数 $0$（\ref{fa:distribution-examples.1}）なので、1 から $\operatorname{p.v.}\frac1x\ne T_{f}$。

**3.** \ref{fa:distribution-operations.2} の定義から、$\varphi\in C_{c}^{\infty}(\mathbb{R})$ について
$$
\Bigl(x\cdot\operatorname{p.v.}\frac1x\Bigr)(\varphi)=\operatorname{p.v.}\frac1x(x\varphi)=\lim_{\varepsilon\to0}\int_{|x|>\varepsilon}\varphi(x)\,dx=\int_{\mathbb{R}}\varphi(x)\,dx
$$
（最後は $|\varphi|$ が可積分なので優収束定理）。右辺は定数関数 $1$ の定める超関数の $\varphi$ での値である。
:::

::: problem ★★★ 発展：方程式 xT = 0, xT = 1, xT = δ {#fa:ex-di-3}
$\mathcal{D}'(\mathbb{R})$ で考え、$x$ は関数 $x\mapsto x$ を表す。
1. $T\in\mathcal{D}'(\mathbb{R})$ が $xT=0$ を満たすことと、ある定数 $c$ で $T=c\delta$ となることは同値であることを示せ。
2. $xT=1$ を満たす $T$ の全体は $\{\operatorname{p.v.}\frac1x+c\delta:c\in\mathbb{C}\}$ であることを示せ。
3. $xT=\delta$ を満たす $T$ の全体は $\{-\delta'+c\delta:c\in\mathbb{C}\}$ であることを示せ。
:::

::: solution
**1.** $x\delta=0$ は $(x\delta)(\varphi)=\delta(x\varphi)=0\cdot\varphi(0)=0$ から。逆を示す。

**Step 1（原点で消えるテスト関数は $x$ で割れる）.** $g\in C_{c}^{\infty}(\mathbb{R})$ が $g(0)=0$ を満たすとし、
$$
\psi(x)\defeq\int_{0}^{1}g'(tx)\,dt
$$
とおく。$x\ne0$ なら置換 $s=tx$ から $x\psi(x)=\int_{0}^{x}g'(s)\,ds=g(x)-g(0)=g(x)$、$x=0$ でも両辺は $0$ なので、$x\psi=g$。$t\in[0,1]$ について $\partial_{x}^{m}\bigl(g'(tx)\bigr)=t^{m}g^{(m+1)}(tx)$ は $\sup|g^{(m+1)}|$（$[0,1]$ 上可積分な定数）で抑えられるので、\ref{meas:parameter-integrals.2} を繰り返し使えば $\psi\in C^{\infty}$。$\operatorname{supp}g\subset[-R,R]$ なら、$|x|>R$ で $\psi(x)=g(x)/x=0$ なので $\psi\in C_{c}^{\infty}(\mathbb{R})$。

**Step 2.** \ref{fa:test-function-density.2}（$K=\{0\}$）から、$0$ の近傍で $\theta=1$ となる $\theta\in C_{c}^{\infty}(\mathbb{R})$ を一つ固定する。$\varphi\in C_{c}^{\infty}(\mathbb{R})$ について $g\defeq\varphi-\varphi(0)\theta$ は $g(0)=0$ を満たすので、Step 1 の $\psi$ で $g=x\psi$。$xT=0$ なら
$$
T(\varphi)=\varphi(0)T(\theta)+T(x\psi)=\varphi(0)T(\theta)+(xT)(\psi)=\varphi(0)T(\theta).
$$
よって $c\defeq T(\theta)$ とおけば $T=c\delta$。

**2.** \ref{fa:ex-di-2.3} から $x\cdot\operatorname{p.v.}\frac1x=1$。$T\mapsto xT$ は線形なので、$xT=1$ $\iff$ $x\bigl(T-\operatorname{p.v.}\frac1x\bigr)=0$ $\iff$（1 から）ある $c$ で $T-\operatorname{p.v.}\frac1x=c\delta$。

**3.** $(x\delta')(\varphi)=\delta'(x\varphi)=-(x\varphi)'(0)=-\bigl(\varphi(0)+0\cdot\varphi'(0)\bigr)=-\varphi(0)$ なので $x(-\delta')=\delta$。2 と同様に、$xT=\delta$ $\iff$ $x(T+\delta')=0$ $\iff$ ある $c$ で $T=-\delta'+c\delta$。

（2 は、超関数の世界では「$x$ で割る」ことが一意にはできず、$\delta$ の定数倍の不定性が残ることを示している。）
:::

## 弱微分とソボレフ空間 {#fa:sec-so-exercises}

対応するページ：\ref{fa:page-sobolev-spaces}

::: problem ★★ 標準：原点で特異な関数 {#fa:ex-so-1}
$n\ge2$, $a>0$, $1\le p<\infty$ とし、$B\defeq B(0,1)\subset\mathbb{R}^{n}$ 上で $u(x)\defeq|x|^{-a}$ とする。
1. $u\in L^{p}(B)$ $\iff$ $ap<n$ を示せ。
2. $u\in W^{1,p}(B)$ $\iff$ $(a+1)p<n$ を示せ。
3. $n\ge3$ なら $H^{1}(B)$ は有界でない関数を含むことを示せ。
:::

::: solution
**補題 A（原点のまわりの積分）.** $R>0$, $s\in\mathbb{R}$ について、$\int_{B(0,R)}|x|^{-s}dx<\infty$ $\iff$ $s<n$。

（証明）$k\ge0$ について $A_{k}\defeq\{2^{-k-1}R\le|x|<2^{-k}R\}$ とすると、$B(0,R)\setminus\{0\}$ は $A_{k}$ の互いに素な和で、$A_{k}=2^{-k}A_{0}$ なので \ref{meas:lebesgue-linear} から $|A_{k}|=2^{-kn}|A_{0}|$。$A_{0}$ は球 $B(\frac34Re_{1},\frac R4)$ を含むので $|A_{0}|>0$。$A_{k}$ の上で $|x|^{-s}$ は $(2^{-k}R)^{-s}$ と $(2^{-k-1}R)^{-s}$ の間にあるので、
$$
2^{-|s|}R^{-s}|A_{0}|\,2^{k(s-n)}\le\int_{A_{k}}|x|^{-s}dx\le2^{|s|}R^{-s}|A_{0}|\,2^{k(s-n)} .
$$
$k$ について足す（測度の可算加法性）と、積分が有限 $\iff$ $\sum_{k}2^{k(s-n)}<\infty$ $\iff$ $s<n$。

**補題 B（特異点を越えた部分積分）.** $\Omega\subset\mathbb{R}^{n}$ を $0$ を含む開集合、$u\in C^{1}(\Omega\setminus\{0\})$ で、$u$ と古典的な偏導関数 $\partial_{j}u$（$j=1,\dots,n$）が $L_{\mathrm{loc}}^{1}(\Omega)$ に入り、
$$
k\int_{\{1/k<|x|<2/k\}}|u|\,dx\to0\qquad(k\to\infty)
$$
とする。このとき $\partial_{j}u$ は $\Omega$ 上の $u$ の弱微分である。

（証明）$\varphi\in C_{c}^{\infty}(\Omega)$ をとり、$k$ を $\overline{B(0,2/k)}\subset\Omega$ となるほど大きくとる。$\chi_{k}(x)\defeq1-\eta(k|x|)$ は $C^{\infty}$ で $|x|<\frac1k$ で $0$、$|x|\ge\frac2k$ で $1$ なので、$\chi_{k}\varphi\in C_{c}^{\infty}(\Omega\setminus\{0\})$。$\Omega\setminus\{0\}$ の上では $u$ は $C^{1}$ なので、\ref{fa:distribution-operations-properties.2} から
$$
\int u\,\chi_{k}\partial_{j}\varphi\,dx+\int u\,\varphi\,\partial_{j}\chi_{k}\,dx=\int u\,\partial_{j}(\chi_{k}\varphi)\,dx=-\int\partial_{j}u\,\chi_{k}\varphi\,dx .
$$
$\chi_{k}\to1$（$x\ne0$ で各点）、$|\chi_{k}|\le1$ で、$|u\,\partial_{j}\varphi|$, $|\partial_{j}u\,\varphi|$ は可積分（$\operatorname{supp}\varphi$ はコンパクト）なので、優収束定理から第 1 項と右辺はそれぞれ $\int u\partial_{j}\varphi$, $-\int\partial_{j}u\,\varphi$ に収束する。第 2 項は、$\partial_{j}\chi_{k}(x)=-k\eta'(k|x|)\frac{x_{j}}{|x|}$ が $\{\frac1k\le|x|\le\frac2k\}$ の外で $0$ で、$|\partial_{j}\chi_{k}|\le k\sup|\eta'|$ なので
$$
\Bigl|\int u\,\varphi\,\partial_{j}\chi_{k}\Bigr|\le\sup|\varphi|\,\sup|\eta'|\cdot k\int_{\{1/k\le|x|\le2/k\}}|u|\,dx\to0
$$
（球面 $\{|x|=r\}$ は測度 $0$：$\{|x|\le r\}\setminus\{|x|<r\}$ の測度は $\omega_{n}r^{n}-\omega_{n}r^{n}=0$）。よって $\int u\,\partial_{j}\varphi=-\int\partial_{j}u\,\varphi$。

**1.** $|u|^{p}=|x|^{-ap}$ なので補題 A（$R=1$, $s=ap$）から。

**2.** $B\setminus\{0\}$ の上で $u$ は $C^{\infty}$ で、$\partial_{j}u(x)=-ax_{j}|x|^{-a-2}$、$|\nabla u(x)|=a|x|^{-a-1}$。

（⇐）$(a+1)p<n$ とする。$ap<n$ なので 1 から $u\in L^{p}(B)$。補題 A から $|\nabla u|^{p}=a^{p}|x|^{-(a+1)p}$ は可積分なので $\partial_{j}u\in L^{p}(B)$。また $p\ge1$ から $a+1<n$ で、$u$, $\partial_{j}u$ は $L^{1}(B)$ に入る（補題 A で $s=a$, $s=a+1$）。さらに
$$
k\int_{\{1/k<|x|<2/k\}}|x|^{-a}dx\le k\cdot k^{a}\cdot\omega_{n}\Bigl(\frac2k\Bigr)^{n}=2^{n}\omega_{n}k^{a+1-n}\to0 .
$$
補題 B から古典的な $\partial_{j}u$ が弱微分で、$u\in W^{1,p}(B)$。

（⇒）$u\in W^{1,p}(B)$ とし、$g_{j}\in L^{p}(B)$ を弱微分とする。$\varphi\in C_{c}^{\infty}(B\setminus\{0\})$ について、\ref{fa:distribution-operations-properties.2}（$B\setminus\{0\}$ の上）から $\int u\partial_{j}\varphi=-\int\partial_{j}u\,\varphi$ なので $\int(g_{j}-\partial_{j}u)\varphi=0$。\ref{fa:fundamental-lemma}（$B\setminus\{0\}$ の上）から $g_{j}=\partial_{j}u$ a.e.。よって $|\nabla u|=a|x|^{-a-1}\in L^{p}(B)$ で、補題 A から $(a+1)p<n$。

**3.** $n\ge3$, $p=2$ とし、$0<a<\frac{n-2}{2}$ をとる（$n\ge3$ なので可能）。$(a+1)\cdot2<n$ なので 2 から $u=|x|^{-a}\in H^{1}(B)$。$\{u>M\}\supset B(0,M^{-1/a})\setminus\{0\}$ は正の測度をもつので、$u$ は本質的に有界でない。
:::

::: problem ★★ 標準：有界なソボレフ関数の積 {#fa:ex-so-2}
$1\le p<\infty$, $u,v\in W^{1,p}(\Omega)\cap L^{\infty}(\Omega)$ とする。
1. $uv\in W^{1,p}(\Omega)\cap L^{\infty}(\Omega)$ で、$\partial_{j}(uv)=(\partial_{j}u)v+u\,\partial_{j}v$ であることを示せ。
2. 整数 $m\ge1$ について $u^{m}\in W^{1,p}(\Omega)$、$\partial_{j}(u^{m})=mu^{m-1}\partial_{j}u$ を示せ。
:::

::: solution
$M_{u}\defeq\|u\|_{\infty}$, $M_{v}\defeq\|v\|_{\infty}$ とする。

**補題.** $K$ を有界な可測集合、$g\in L^{1}(K)$、$w_{k}$ を可測で $|w_{k}|\le2M$（a.e.）かつ $\|w_{k}\|_{L^{1}(K)}\to0$ とすると、$\int_{K}|g||w_{k}|\to0$。

（証明）$R>0$ について
$$
\int_{K}|g||w_{k}|\le2M\int_{K\cap\{|g|>R\}}|g|+R\|w_{k}\|_{L^{1}(K)} .
$$
$|g|\mathbf{1}_{\{|g|>R\}}\to0$（a.e., $R\to\infty$）で $|g|$ で抑えられるので、優収束定理から第 1 項は $R$ を大きくすれば小さく、そのあと $k$ を大きくすれば第 2 項も小さい。

**1.** $\varphi\in C_{c}^{\infty}(\Omega)$, $K\defeq\operatorname{supp}\varphi$ とし、$\varepsilon_{0}\defeq\frac12\operatorname{dist}(K,\mathbb{R}^{n}\setminus\Omega)$（$\Omega=\mathbb{R}^{n}$ なら $1$）とする。$\varepsilon<\varepsilon_{0}$ なら $K\subset\Omega_{\varepsilon}$。$u_{\varepsilon}\defeq\rho_{\varepsilon}*u$, $v_{\varepsilon}\defeq\rho_{\varepsilon}*v$ は $\Omega_{\varepsilon}$ 上 $C^{\infty}$（\ref{fa:mollification.1}）で、$|u_{\varepsilon}(x)|\le\int\rho_{\varepsilon}(x-y)|u(y)|\,dy\le M_{u}$、同様に $|v_{\varepsilon}|\le M_{v}$。$u_{\varepsilon}v_{\varepsilon}$ は $\Omega_{\varepsilon}$ 上 $C^{1}$ なので、\ref{fa:distribution-operations-properties.2}（$\Omega_{\varepsilon}$ の上）と積の微分から
$$
\int u_{\varepsilon}v_{\varepsilon}\,\partial_{j}\varphi=-\int\bigl((\partial_{j}u_{\varepsilon})v_{\varepsilon}+u_{\varepsilon}\partial_{j}v_{\varepsilon}\bigr)\varphi .\tag{$*$}
$$
$\varepsilon=\frac1k\to0$ とする。\ref{fa:mollification-sobolev.2} と $L^{p}(K)\subset L^{1}(K)$（\ref{meas:lp-inclusions.1}）から、$u_{\varepsilon}\to u$, $\partial_{j}u_{\varepsilon}\to\partial_{j}u$, $v_{\varepsilon}\to v$, $\partial_{j}v_{\varepsilon}\to\partial_{j}v$ がすべて $L^{1}(K)$ で成り立つ。

左辺：$|u_{\varepsilon}v_{\varepsilon}-uv|\le M_{v}|u_{\varepsilon}-u|+M_{u}|v_{\varepsilon}-v|$ なので $\int_{K}|u_{\varepsilon}v_{\varepsilon}-uv||\partial_{j}\varphi|\to0$。

右辺：$(\partial_{j}u_{\varepsilon})v_{\varepsilon}-(\partial_{j}u)v=(\partial_{j}u_{\varepsilon}-\partial_{j}u)v_{\varepsilon}+(\partial_{j}u)(v_{\varepsilon}-v)$。第 1 項の $L^{1}(K)$ ノルムは $\le M_{v}\|\partial_{j}u_{\varepsilon}-\partial_{j}u\|_{L^{1}(K)}\to0$。第 2 項は、$|v_{\varepsilon}-v|\le2M_{v}$ なので補題（$g=\partial_{j}u\in L^{1}(K)$, $w_{k}=v_{1/k}-v$）から $L^{1}(K)$ で $0$ に収束する。$u_{\varepsilon}\partial_{j}v_{\varepsilon}$ も同様。

$(*)$ で極限をとると $\int uv\,\partial_{j}\varphi=-\int\bigl((\partial_{j}u)v+u\,\partial_{j}v\bigr)\varphi$。$|uv|\le M_{v}|u|$, $|(\partial_{j}u)v+u\partial_{j}v|\le M_{v}|\partial_{j}u|+M_{u}|\partial_{j}v|$ なので、$uv$ と弱微分は $L^{p}$ に入り、$|uv|\le M_{u}M_{v}$。よって $uv\in W^{1,p}\cap L^{\infty}$。

**2.** $m$ についての帰納法。$m=1$ は自明。$u^{m}\in W^{1,p}\cap L^{\infty}$ で $\partial_{j}(u^{m})=mu^{m-1}\partial_{j}u$ なら、1 を $u^{m}$ と $u$ に使って $u^{m+1}\in W^{1,p}\cap L^{\infty}$、$\partial_{j}(u^{m+1})=mu^{m-1}(\partial_{j}u)u+u^{m}\partial_{j}u=(m+1)u^{m}\partial_{j}u$。

（$L^{\infty}$ の仮定は外せない：$n\ge3$ で \ref{fa:ex-so-1.3} の $u=|x|^{-a}\in H^{1}(B)$ について $u^{2}=|x|^{-2a}$ は、\ref{fa:ex-so-1.2} から $(2a+1)\cdot2<n$ のときしか $H^{1}(B)$ に入らない。例えば $n=3$, $a=\frac14$ なら $u\in H^{1}(B)$ だが $u^{2}\notin H^{1}(B)$。）
:::

::: problem ★★★ 発展：W^{1,∞} とリプシッツ関数 {#fa:ex-so-3}
1. $\Omega$ が凸で $u\in W^{1,\infty}(\Omega)$ なら、$M\defeq\bigl\||\nabla u|\bigr\|_{\infty}$ について、$u$ は $|\tilde u(x)-\tilde u(y)|\le M|x-y|$（$x,y\in\Omega$）を満たす代表元 $\tilde u$ をもつことを示せ。
2. 逆に、$u$ が $\Omega$ 上の有界な関数で、ある $L$ について $|u(x)-u(y)|\le L|x-y|$（$x,y\in\Omega$）を満たすなら、$u\in W^{1,\infty}(\Omega)$ で $\|\partial_{j}u\|_{\infty}\le L$ であることを示せ（ここでは $\Omega$ の凸性は要らない）。
3. $\Omega\defeq B(0,1)\setminus\{(x_{1},0):x_{1}\le0\}\subset\mathbb{R}^{2}$ と極座標 $x=(r\cos\theta,r\sin\theta)$, $-\pi<\theta<\pi$ について、$u\defeq r\theta$ は $W^{1,\infty}(\Omega)$ に入るが、リプシッツ連続な代表元をもたないことを示せ。
:::

::: solution
**1.** **Step 1（$\Omega_{\varepsilon}$ は凸）.** $x\in\Omega_{\varepsilon}$ と「ある $d>\varepsilon$ で $B(x,d)\subset\Omega$」は同値である。$x,y\in\Omega_{\varepsilon}$ について $d>\varepsilon$ を $B(x,d),B(y,d)\subset\Omega$ となるようにとる。$z=tx+(1-t)y$（$0\le t\le1$）と $|w|<d$ について $z+w=t(x+w)+(1-t)(y+w)\in\Omega$（凸性）なので $B(z,d)\subset\Omega$、$z\in\Omega_{\varepsilon}$。

**Step 2（軟化の一様なリプシッツ評価）.** $u\in L^{\infty}\subset L_{\mathrm{loc}}^{1}$ なので $u_{\varepsilon}\defeq\rho_{\varepsilon}*u\in C^{\infty}(\Omega_{\varepsilon})$。\ref{fa:mollification-sobolev.1} の証明（弱微分の定義を $y\mapsto\rho_{\varepsilon}(x-y)$ に使うだけで、$p<\infty$ は使わない）から $\nabla u_{\varepsilon}(x)=\int\rho_{\varepsilon}(x-y)\nabla u(y)\,dy\eqdef w$。$\mathbb{C}^{n}$ のコーシー–シュワルツの不等式から
$$
|w|^{2}=\operatorname{Re}\int\rho_{\varepsilon}(x-y)\,\nabla u(y)\cdot\overline{w}\,dy\le\int\rho_{\varepsilon}(x-y)|\nabla u(y)|\,dy\,|w|\le M|w|,
$$
よって $|\nabla u_{\varepsilon}|\le M$。$x,y\in\Omega_{\varepsilon}$ なら Step 1 から線分は $\Omega_{\varepsilon}$ に入り、$h(t)\defeq u_{\varepsilon}(x+t(y-x))$ は $|h'(t)|\le M|y-x|$ を満たすので、$|u_{\varepsilon}(x)-u_{\varepsilon}(y)|\le\int_{0}^{1}|h'|\le M|x-y|$。

**Step 3（各点収束）.** $u_{k}\defeq u_{1/k}$ とする。$K\subset\Omega$ をコンパクト、$r>0$ を $4r\le\operatorname{dist}(K,\mathbb{R}^{n}\setminus\Omega)$（$\Omega=\mathbb{R}^{n}$ なら $r=1$）、$K_{r}\defeq\{x:\operatorname{dist}(x,K)\le r\}$ とする。$\frac1k<r$ なら $K_{r}\subset\Omega_{1/k}$（$K_{r}$ の点から $\mathbb{R}^{n}\setminus\Omega$ までの距離は $\ge3r$）。$x\in K$, $0<r'\le r$, $\frac1k,\frac1l<r$ について、$B(x,r')\subset K_{r}$ の上で平均をとると
$$
|u_{k}(x)-u_{l}(x)|\le\frac{1}{|B(x,r')|}\int_{B(x,r')}\bigl(|u_{k}(x)-u_{k}(y)|+|u_{k}(y)-u_{l}(y)|+|u_{l}(y)-u_{l}(x)|\bigr)dy\le2Mr'+\frac{\|u_{k}-u_{l}\|_{L^{1}(K_{r})}}{\omega_{n}r'^{n}} .
$$
\ref{fa:mollification.3}（$p=1$）から $u_{k}\to u$（$L^{1}(K_{r})$）なので、$\delta>0$ について $r'$ を $2Mr'<\delta$ となるようにとり、次に $k,l$ を大きくとれば右辺 $<2\delta$。よって $(u_{k})$ は $K$ 上で一様コーシー列。各点 $x\in\Omega$ は $K=\{x\}$ に入るので、$\tilde u(x)\defeq\lim_{k}u_{k}(x)$ が $\Omega$ の各点で定まり、各コンパクト集合の上で一様収束である。

**Step 4.** $x,y\in\Omega$ は $k$ が大きければ $\Omega_{1/k}$ に入るので、Step 2 の不等式で極限をとると $|\tilde u(x)-\tilde u(y)|\le M|x-y|$。コンパクト $K$ の上で $u_{k}\to\tilde u$（一様）かつ $u_{k}\to u$（$L^{1}(K)$）なので $\|\tilde u-u\|_{L^{1}(K)}=0$。$\Omega$ はコンパクト集合の可算和（\ref{fa:test-function-density} の証明の $K_{j}$）なので $\tilde u=u$ a.e.。

**2.** 実部と虚部はそれぞれ同じ $L$ でリプシッツなので、$u$ は実数値としてよい。$j$ を固定し、$e_{j}$ 方向の差分商を
$$
q_{m}(x)\defeq m\Bigl(u\bigl(x+\tfrac1me_{j}\bigr)-u(x)\Bigr)\quad(x\in\Omega,\ x+\tfrac1me_{j}\in\Omega),\qquad q_{m}(x)\defeq0\quad(\text{それ以外})
$$
とおく。$\{x\in\Omega:x+\frac1me_{j}\in\Omega\}$ は開集合で、その上で $q_{m}$ は連続なので、$q_{m}$ はボレル可測で $|q_{m}|\le L$。$g\defeq\limsup_{m}q_{m}$ はボレル可測で $|g|\le L$。

$x$ の第 $j$ 座標以外 $\hat x_{j}$ を固定すると、$\Omega$ の切り口 $\Omega_{\hat x_{j}}\defeq\{t:(\dots,t,\dots)\in\Omega\}$ は $\mathbb{R}$ の開集合で、$t\mapsto u(\dots,t,\dots)$ はその上でリプシッツ。$\Omega_{\hat x_{j}}$ に含まれる有界閉区間の上では絶対連続なので、\ref{meas:ftc-lebesgue} から $\Omega_{\hat x_{j}}$ のほとんどすべての点で微分可能（$\Omega_{\hat x_{j}}$ は端点が有理数の閉区間の可算和）。微分可能な点 $t$ では、$m$ が大きければ $q_{m}$ は差分商そのものなので、$g$ はその点での導関数に等しい。

$\varphi\in C_{c}^{\infty}(\Omega)$ について、$h(t)\defeq u(\dots,t,\dots)\varphi(\dots,t,\dots)$（$t\in\Omega_{\hat x_{j}}$）、$h(t)\defeq0$（それ以外）とおく。$\operatorname{supp}\varphi$ の切り口 $S$ は $\Omega_{\hat x_{j}}$ に含まれるコンパクト集合なので、$\mathbb{R}\setminus S$ は $\mathbb{R}\setminus\Omega_{\hat x_{j}}$ を含む開集合で、そこでは $h$ は局所的に $0$。$\Omega_{\hat x_{j}}$ の各点の近くでは $h$ はリプシッツ関数の積でリプシッツ。よって $h$ は $\mathbb{R}$ 上局所リプシッツで、$S\subset(-R,R)$ となる $R$ について $[-R,R]$ 上リプシッツ（コンパクト区間を有限個のリプシッツな小区間で覆い、線分上で差をつなぐ）、とくに絶対連続。\ref{meas:ftc-lebesgue} から $\int_{-R}^{R}h'=h(R)-h(-R)=0$ で、a.e. で $h'=g\varphi+u\,\partial_{j}\varphi$（$S$ の外では $h'=0=g\varphi+u\partial_{j}\varphi$）。よって
$$
\int u\,\partial_{j}\varphi\,dx_{j}=-\int g\,\varphi\,dx_{j} .
$$
$|u\,\partial_{j}\varphi|\le\sup|u|\,|\partial_{j}\varphi|$, $|g\varphi|\le L|\varphi|$ は可積分なので、\ref{meas:fubini} で残りの座標について積分すると $\int_{\Omega}u\,\partial_{j}\varphi=-\int_{\Omega}g\varphi$。よって $\partial_{j}u=g$ で $\|\partial_{j}u\|_{\infty}\le L$。$u$ は有界なので $u\in W^{1,\infty}(\Omega)$。

**3.** $\Omega$ の上で $r$ と $\theta$ は $C^{\infty}$（$\theta$ は $(-\pi,\pi)$ に値をとる偏角で、除いた半直線の外では滑らか）で、$|\nabla r|=1$, $\nabla\theta=\frac{(-x_{2},x_{1})}{r^{2}}$, $|r\nabla\theta|=1$。$\nabla u=\theta\nabla r+r\nabla\theta$ なので $|\nabla u|\le\pi+1$、$|u|\le\pi$。$u$ は $\Omega$ 上 $C^{1}$ なので古典的な偏導関数が弱微分（\ref{fa:distribution-operations-properties.2}）で、$u\in W^{1,\infty}(\Omega)$。

$u$ は連続なので、連続な代表元は $u$ 自身に限る（二つの連続関数が a.e. で等しければ、差の零点集合は稠密な閉集合で、一致する）。$p_{\pm}\defeq(-\frac12,\pm\delta)$（$0<\delta<\frac12$）について $|p_{+}-p_{-}|=2\delta$ だが、$\delta\to0$ で $\theta(p_{\pm})\to\pm\pi$, $r(p_{\pm})\to\frac12$ なので $|u(p_{+})-u(p_{-})|\to\pi$。よって $u$ はリプシッツでない。1 で凸性は外せない。
:::

## 延長とトレース {#fa:sec-et-exercises}

対応するページ：\ref{fa:page-extension-trace}

::: problem ★ 基本：半空間でのトレースの評価 {#fa:ex-et-1}
$n\ge2$, $1\le p<\infty$ とする。
1. $w\in C_{c}^{1}(\mathbb{R}^{n})$ について $\displaystyle\int_{\mathbb{R}^{n-1}}|w(x',0)|^{p}dx'\le p\,\|w\|_{L^{p}(\mathbb{R}_{+}^{n})}^{p-1}\|\partial_{n}w\|_{L^{p}(\mathbb{R}_{+}^{n})}$ を示せ。
2. どんな定数 $C$ についても、すべての $w\in C_{c}^{1}(\mathbb{R}^{n})$ で $\int_{\mathbb{R}^{n-1}}|w(x',0)|^{p}dx'\le C\|w\|_{L^{p}(\mathbb{R}_{+}^{n})}^{p}$ が成り立つことはないことを示せ。（したがってトレースは $L^{p}$ ノルムだけでは制御できず、導関数の情報が要る。）
:::

::: solution
**1.** $x'$ を固定し $F(t)\defeq|w(x',t)|^{p}$ とする。$p>1$ なら $F$ は $C^{1}$ で $F'=p|w|^{p-2}\operatorname{Re}(\overline{w}\,\partial_{n}w)$（$w=0$ の点では $F'=0$）、$p=1$ なら $F=|w|$ はリプシッツで a.e. で微分可能。どちらでも $|F'|\le p|w|^{p-1}|\partial_{n}w|$（a.e.）で、$F$ は有界閉区間上で絶対連続、$t$ が大きければ $F(t)=0$。\ref{meas:ftc-lebesgue} から
$$
|w(x',0)|^{p}=-\int_{0}^{\infty}F'(t)\,dt\le p\int_{0}^{\infty}|w|^{p-1}|\partial_{n}w|\,dt .
$$
$x'$ で積分し、$p>1$ ならヘルダーの不等式（指数 $\frac{p}{p-1}$ と $p$）を使うと
$$
\int|w(x',0)|^{p}dx'\le p\int_{\mathbb{R}_{+}^{n}}|w|^{p-1}|\partial_{n}w|\le p\Bigl(\int_{\mathbb{R}_{+}^{n}}|w|^{p}\Bigr)^{\frac{p-1}{p}}\Bigl(\int_{\mathbb{R}_{+}^{n}}|\partial_{n}w|^{p}\Bigr)^{\frac1p}.
$$
$p=1$ ではヘルダーは不要で、そのまま主張になる。

**2.** $w\in C_{c}^{1}(\mathbb{R}^{n})$ を $w(0)=1$ となるように一つとる（例えば \ref{fa:test-function-density.2} の関数）。$w$ は連続なので $|w(x',0)|\ge\frac12$ となる $x'$ の集合は空でない開集合を含み、$c\defeq\int|w(x',0)|^{p}dx'>0$。$\lambda>0$ について $w_{\lambda}(x',x_{n})\defeq w(x',\lambda x_{n})$ とすると $w_{\lambda}(x',0)=w(x',0)$ で、$x_{n}$ の変数変換から $\|w_{\lambda}\|_{L^{p}(\mathbb{R}_{+}^{n})}^{p}=\lambda^{-1}\|w\|_{L^{p}(\mathbb{R}_{+}^{n})}^{p}$。不等式が成り立つと $c\le C\lambda^{-1}\|w\|_{L^{p}(\mathbb{R}_{+}^{n})}^{p}$ がすべての $\lambda$ で成り立ち、$\lambda\to\infty$ で $c\le0$ となり矛盾。

（1 の右辺は $w_{\lambda}$ について $\lambda^{-(p-1)/p}\cdot\lambda^{1-1/p}=1$ 倍で、スケーリングと両立している。$\partial_{n}w_{\lambda}=\lambda(\partial_{n}w)(x',\lambda x_{n})$ なので $\|\partial_{n}w_{\lambda}\|_{p}=\lambda^{1-1/p}\|\partial_{n}w\|_{p}$。）
:::

::: problem ★★ 標準：区間の W₀ と境界値 {#fa:ex-et-2}
$1\le p<\infty$, $u\in W^{1,p}((0,1))$ とする。$u\in W_{0}^{1,p}((0,1))$ $\iff$ $\tilde u(0)=\tilde u(1)=0$ を示せ。とくに、$[0,1]$ 上の連続な折れ線で両端で $0$ となるものは $W_{0}^{1,p}((0,1))$ に入ることを確かめよ。
:::

::: solution
**（⇒）** $\varphi_{k}\in C_{c}^{\infty}((0,1))$, $\varphi_{k}\to u$（$W^{1,p}$）とする。$\varphi_{k}-u$ の絶対連続な代表元は $\varphi_{k}-\tilde u$ なので、\ref{fa:prob-et-interval-trace} の評価と $\|\cdot\|_{1}\le\|\cdot\|_{p}$ から
$$
|\varphi_{k}(0)-\tilde u(0)|\le\|\varphi_{k}-u\|_{1}+\|\varphi_{k}'-u'\|_{1}\le2\|\varphi_{k}-u\|_{W^{1,p}}\to0 .
$$
$\varphi_{k}(0)=0$ なので $\tilde u(0)=0$。$\tilde u(1)$ も同様。

**（⇐）** **Step 1（$\mathbb{R}$ 上への延長）.** $g\defeq u'$ を $(0,1)$ の外で $0$ と延ばし、$U(x)\defeq\int_{-\infty}^{x}g$ とおく。$x\in[0,1]$ なら $U(x)=\int_{0}^{x}\tilde u'=\tilde u(x)-\tilde u(0)=\tilde u(x)$（\ref{meas:ftc-lebesgue}）、$x<0$ なら $U(x)=0$、$x>1$ なら $U(x)=\tilde u(1)-\tilde u(0)=0$。よって $U$ は $\tilde u$ を $[0,1]$ の外で $0$ と延ばしたもので、$U,g\in L^{p}(\mathbb{R})$。

**Step 2（縮小）.** $c\defeq\frac12$, $\lambda>1$ について $(D_{\lambda}h)(x)\defeq h(c+\lambda(x-c))$ とおき、$v_{\lambda}\defeq D_{\lambda}U$ とする。置換 $z=c+\lambda(y-c)$ から
$$
v_{\lambda}(x)=\int_{-\infty}^{c+\lambda(x-c)}g(z)\,dz=\int_{-\infty}^{x}\lambda g\bigl(c+\lambda(y-c)\bigr)dy=\int_{-\infty}^{x}g_{\lambda},\qquad g_{\lambda}\defeq\lambda D_{\lambda}g .
$$
$v_{\lambda}(x)\ne0$ なら $c+\lambda(x-c)\in(0,1)$、すなわち $|x-c|<\frac{1}{2\lambda}$。よって $v_{\lambda}$ は $(0,1)$ のコンパクト集合 $[c-\frac1{2\lambda},c+\frac1{2\lambda}]$ の外で $0$ で、$v_{\lambda}(0)=0$。$(0,1)$ の上では $v_{\lambda}(x)=\int_{0}^{x}g_{\lambda}$ なので、\ref{fa:sobolev-one-dimension}（2 ⇒ 1）から $v_{\lambda}\in W^{1,p}((0,1))$ で $v_{\lambda}'=g_{\lambda}$。台が $(0,1)$ のコンパクト集合なので、\ref{fa:mollification-sobolev.3} から $v_{\lambda}$ は $C_{c}^{\infty}((0,1))$ の元で $W^{1,p}$ 近似でき、$v_{\lambda}\in W_{0}^{1,p}((0,1))$。

**Step 3（$\lambda\downarrow1$ での収束）.** $h\in L^{p}(\mathbb{R})$ について $\|D_{\lambda}h-h\|_{p}\to0$（$\lambda\downarrow1$）を示す。変数変換から $\|D_{\lambda}h\|_{p}=\lambda^{-1/p}\|h\|_{p}\le\|h\|_{p}$。$k\in C_{c}(\mathbb{R})$ で $\operatorname{supp}k\subset[-R,R]$（$R\ge1$）なら、$1<\lambda\le2$ で $D_{\lambda}k$ と $k$ の台は $[-2R,2R]$ に入り、
$$
|D_{\lambda}k(x)-k(x)|\le\sup\bigl\{|k(s)-k(s')|:|s-s'|\le(\lambda-1)(2R+1)\bigr\}\to0
$$
（$|x|\le2R$ なら $|(c+\lambda(x-c))-x|=(\lambda-1)|x-c|$、$k$ は一様連続）なので $\|D_{\lambda}k-k\|_{p}\le(4R)^{1/p}\sup|D_{\lambda}k-k|\to0$。一般の $h$ は \ref{meas:cc-dense} の $k$ で $\|h-k\|_{p}<\varepsilon$ とすると $\|D_{\lambda}h-h\|_{p}\le\|D_{\lambda}(h-k)\|_{p}+\|D_{\lambda}k-k\|_{p}+\|k-h\|_{p}<2\varepsilon+\|D_{\lambda}k-k\|_{p}$。

これを $U$ と $g$ に使うと、$(0,1)$ の上で $U=u$, $g=u'$ なので
$$
\|v_{\lambda}-u\|_{W^{1,p}((0,1))}^{p}\le\|D_{\lambda}U-U\|_{p}^{p}+\|\lambda D_{\lambda}g-g\|_{p}^{p},\qquad\|\lambda D_{\lambda}g-g\|_{p}\le(\lambda-1)\|g\|_{p}+\|D_{\lambda}g-g\|_{p},
$$
右辺は $\lambda\downarrow1$ で $0$。$W_{0}^{1,p}$ は閉集合なので $u\in W_{0}^{1,p}((0,1))$。

**折れ線.** $[0,1]$ 上の連続な折れ線 $w$ はリプシッツなので絶対連続で、導関数は a.e. で有界（各小区間で傾きに等しい）。\ref{fa:sobolev-one-dimension} から $w\in W^{1,p}((0,1))$ で $\tilde w=w$。$w(0)=w(1)=0$ なら、いま示したことから $w\in W_{0}^{1,p}((0,1))$。
:::

::: problem ★★★ 発展：トレースが 0 の関数は W₀ に入る {#fa:ex-et-3}
$\Omega$ を $C^{1}$ 境界をもつ有界な開集合（\ref{fa:c1-boundary} の組と、\ref{fa:page-extension-trace} で固定した $\zeta_{0},\dots,\zeta_{m}$ を使う）、$1<p<\infty$、$T$ を \ref{fa:trace-theorem} のトレース作用素とし、$u\in W^{1,p}(\Omega)$ が $Tu=0$ を満たすとする。
1. $u$ を $\Omega$ の外で $0$ と延ばした $\bar u$ は $W^{1,p}(\mathbb{R}^{n})$ に入り、$\partial_{j}\bar u$ は $\partial_{j}u$ を $\Omega$ の外で $0$ と延ばしたものであることを示せ。
2. $u\in W_{0}^{1,p}(\Omega)$ を示せ。（\ref{fa:trace-theorem} と合わせて、$W_{0}^{1,p}(\Omega)=\ker T$ となる。）
:::

::: solution
**1.** $\varphi\in C_{c}^{\infty}(\mathbb{R}^{n})$ とする。$\Omega$ は有界なので $\varphi|_{\Omega}\in W^{1,p'}(\Omega)$（$p'$ は共役指数）で、\ref{fa:trace-theorem} から $T(\varphi|_{\Omega})=\varphi|_{\partial\Omega}$。\ref{fa:sobolev-integration-by-parts} から
$$
\int_{\mathbb{R}^{n}}\bar u\,\partial_{j}\varphi=\int_{\Omega}u\,\partial_{j}\varphi=-\int_{\Omega}\partial_{j}u\,\varphi+\int_{\partial\Omega}Tu\,\varphi\,\nu_{j}\,d\sigma=-\int_{\mathbb{R}^{n}}\overline{\partial_{j}u}\,\varphi,
$$
ここで $\overline{\partial_{j}u}$ は $\partial_{j}u$ を $0$ で延ばしたもの。$\bar u$ と $\overline{\partial_{j}u}$ は $L^{p}(\mathbb{R}^{n})$ に入るので、$\bar u\in W^{1,p}(\mathbb{R}^{n})$。

**2.** $\overline\Omega$ の近傍で $\sum_{i}\zeta_{i}=1$ なので $u=\sum_{i=0}^{m}\zeta_{i}u$（$\Omega$ の上）。$W_{0}^{1,p}(\Omega)$ は線形部分空間なので、各 $\zeta_{i}u\in W_{0}^{1,p}(\Omega)$ を示せばよい。

**$i=0$.** $\zeta_{0}\in C_{c}^{\infty}(\Omega)$ なので $\zeta_{0}u\in W^{1,p}(\Omega)$（\ref{fa:sobolev-product-rule}）の台は $\Omega$ のコンパクト集合で、\ref{fa:mollification-sobolev.3} から $C_{c}^{\infty}(\Omega)$ の元で近似できる。

**$i\ge1$.** $w\defeq\zeta_{i}\bar u$ は \ref{fa:sobolev-product-rule}（$\mathbb{R}^{n}$ の上）と 1 から $W^{1,p}(\mathbb{R}^{n})$ の元で、コンパクト集合 $S\defeq\operatorname{supp}\zeta_{i}\cap\overline\Omega$ の外で $0$。$e\defeq A_{i}^{-1}e_{n}$（単位ベクトル）、$t>0$ について $w_{t}(x)\defeq w(x-te)$ とおく。

（台が $\Omega$ に入ること）$\gamma\defeq\gamma_{i}$, $Q\defeq A_{i}U_{i}=\{(y',y_{n}):y'\in W_{i},\ |y_{n}-\gamma(y')|<a_{i}\}$ とする。$y\in A_{i}(S)$ なら、$y\in Q$ で $y$ は $A_{i}(\Omega\cap U_{i})=\{y_{n}>\gamma(y')\}\cap Q$ の点の極限（$A_{i}^{-1}y\in\overline\Omega\cap U_{i}$ で $U_{i}$ は開集合）なので、$\gamma$ の連続性から $y_{n}\ge\gamma(y')$。$A_{i}(S)$ は開集合 $Q$ のコンパクト部分集合なので、$t_{0}>0$ を $\mathbb{R}^{n}\setminus Q$ との距離より小さくとれば、$0<t<t_{0}$ で $y+te_{n}\in Q$ かつ $y_{n}+t>\gamma(y')$、すなわち $y+te_{n}\in A_{i}(\Omega\cap U_{i})$。$A_{i}(x+te)=A_{i}x+te_{n}$ なので、コンパクト集合 $S+te$ は $\Omega$ に含まれる。$w_{t}$ は $S+te$ の外で $0$ なので、$w_{t}|_{\Omega}\in W^{1,p}(\Omega)$ の台は $\Omega$ のコンパクト集合で、$i=0$ と同じ理由で $w_{t}|_{\Omega}\in W_{0}^{1,p}(\Omega)$。

（収束）弱微分の定義で $\varphi(\cdot+te)$ を使えば $\partial_{j}w_{t}=(\partial_{j}w)(\cdot-te)$。\ref{meas:translation-continuity.2} を $w$ と $\partial_{j}w$ に使うと $\|w_{t}-w\|_{W^{1,p}(\mathbb{R}^{n})}\to0$（$t\to0$）。$\Omega$ に制限すると $w_{t}|_{\Omega}\to w|_{\Omega}=\zeta_{i}u$（$W^{1,p}(\Omega)$）で、$W_{0}^{1,p}(\Omega)$ は閉なので $\zeta_{i}u\in W_{0}^{1,p}(\Omega)$。

（$C^{1}$ 境界の役割は、境界の近くで「$\Omega$ の内側を向く一定の方向 $e$」がとれることである。ここで $1<p$ は 1 で \ref{fa:sobolev-integration-by-parts} を使うために仮定した。）
:::

## ソボレフの埋め込み定理 {#fa:sec-em-exercises}

対応するページ：\ref{fa:page-embeddings}

::: problem ★ 基本：モレーの不等式のヘルダー指数は最良 {#fa:ex-em-1}
$n\ge2$, $n<p<\infty$, $\alpha\defeq1-\frac np$ とする。$\alpha<\beta<1$ について $u(x)\defeq|x|^{\beta}\eta(|x|)$ とおく。
1. $u\in W^{1,p}(\mathbb{R}^{n})$ を示せ。
2. $u$ の連続な代表元（\ref{fa:morrey-inequality.3}）は $u$ 自身で、$|u(x)-u(0)|=|x|^{\beta}$（$|x|\le1$）であることを確かめ、どの $\alpha'>\alpha$ についても、$W^{1,p}(\mathbb{R}^{n})$ のすべての元が指数 $\alpha'$ でヘルダー連続な代表元をもつ、とはいえないことを示せ。
:::

::: solution
**1.** $u$ は連続で、$|x|\ge2$ で $0$、$|u|\le2^{\beta}$ なので $u\in L^{p}$。$x\ne0$ では $u$ は $C^{1}$ で
$$
\nabla u(x)=\beta|x|^{\beta-2}x\,\eta(|x|)+|x|^{\beta}\eta'(|x|)\frac{x}{|x|},\qquad|\nabla u(x)|\le\beta|x|^{\beta-1}+2^{\beta}\sup|\eta'|\quad(|x|<2),
$$
$|x|\ge2$ で $\nabla u=0$。\ref{fa:ex-so-1} の補題 A（$R=2$, $s=(1-\beta)p$）から、$(1-\beta)p<n$、すなわち $\beta>1-\frac np=\alpha$ なので $|x|^{(\beta-1)p}$ は $B(0,2)$ 上可積分、よって $\partial_{j}u\in L^{p}\subset L_{\mathrm{loc}}^{1}$。また
$$
k\int_{\{1/k<|x|<2/k\}}|u|\le k\Bigl(\frac2k\Bigr)^{\beta}\omega_{n}\Bigl(\frac2k\Bigr)^{n}\to0
$$
なので、\ref{fa:ex-so-1} の補題 B（$\Omega=\mathbb{R}^{n}$）から古典的な $\nabla u$ が弱勾配で、$u\in W^{1,p}(\mathbb{R}^{n})$。

**2.** 二つの連続関数が a.e. で等しければ一致するので、\ref{fa:morrey-inequality.3} の代表元は $u$ 自身。$|x|\le1$ で $\eta(|x|)=1$ なので $|u(x)-u(0)|=|x|^{\beta}$。

$\alpha'>\alpha$ とし、$\beta$ を $\alpha<\beta<\min(\alpha',1)$ ととる。$u$ が $|u(x)-u(y)|\le C|x-y|^{\alpha'}$ を満たすなら、$y=0$, $0<|x|\le1$ で $|x|^{\beta-\alpha'}\le C$ となるが、$\beta<\alpha'$ なので $|x|\to0$ で左辺は発散し矛盾。よって \ref{fa:morrey-inequality} の指数 $\alpha=1-\frac np$ は、それより大きい指数に取り替えられない。
:::

::: problem ★★ 標準：p = n = 2 で有界でない H¹ の関数 {#fa:ex-em-2}
$B\defeq B(0,1)\subset\mathbb{R}^{2}$ 上で $u(x)\defeq\log\log\frac{e}{|x|}$（$x\ne0$）とする。
1. $u\in H^{1}(B)$ で $\|\nabla u\|_{L^{2}(B)}^{2}=2\pi$ を示せ。
2. $u\notin L^{\infty}(B)$ を示し、$W^{1,2}(B)\not\subset L^{\infty}(B)$ を確かめよ。また $p>2$ では $|\nabla u|\notin L^{p}(B)$ であることを確かめよ（\ref{fa:morrey-inequality} と矛盾しない）。
:::

::: solution
$r\defeq|x|$ とする。$0<r<1$ で $\log\frac er=1+\log\frac1r>1$ なので $u>0$ で、$u$ は $B\setminus\{0\}$ 上 $C^{\infty}$。$u=F(r)$, $F(r)\defeq\log\log\frac er$ で
$$
F'(r)=\frac{1}{\log(e/r)}\cdot\Bigl(-\frac1r\Bigr),\qquad|\nabla u(x)|=|F'(r)|=\frac{1}{r\log(e/r)} .
$$

**1.** **$u\in L^{2}$.** $\log s\le s$（$s>0$）から $u\le\log\frac er=1+2\log r^{-1/2}\le1+2r^{-1/2}$、$u^{2}\le2+8r^{-1}$。\ref{fa:ex-so-1} の補題 A（$s=1<2$）から $u\in L^{2}(B)$。

**$|\nabla u|\in L^{2}$.** \ref{meas:polar-coordinates} と単調収束定理から
$$
\int_{B}|\nabla u|^{2}dx=\int_{0}^{1}\int_{0}^{2\pi}\frac{1}{r^{2}\log^{2}(e/r)}\,r\,d\theta\,dr=2\pi\lim_{\delta\to0}\int_{\delta}^{1}\frac{dr}{r\log^{2}(e/r)}=2\pi\lim_{\delta\to0}\Bigl[\frac{1}{\log(e/r)}\Bigr]_{\delta}^{1}=2\pi
$$
（$\frac{d}{dr}\frac{1}{\log(e/r)}=\frac{1}{r\log^{2}(e/r)}$、$\delta\to0$ で $\frac1{\log(e/\delta)}\to0$）。

**弱勾配.** $u$ と $|\nabla u|$ は $L^{2}(B)\subset L^{1}(B)$ に入る。$\frac1k<r<\frac2k$ で $u\le\log\log(ek)$ なので
$$
k\int_{\{1/k<|x|<2/k\}}|u|\le k\cdot\pi\Bigl(\frac2k\Bigr)^{2}\log\log(ek)=\frac{4\pi\log\log(ek)}{k}\to0 .
$$
\ref{fa:ex-so-1} の補題 B から古典的な勾配が弱勾配で、$u\in H^{1}(B)$、$\|\nabla u\|_{2}^{2}=2\pi$。

**2.** $M>0$ について、$r<e^{1-e^{M}}$ なら $\log\frac er>e^{M}$ で $u>M$。よって $\{u>M\}$ は正の測度の集合 $B(0,e^{1-e^{M}})\setminus\{0\}$ を含み、$u$ は本質的に有界でない。$u\in W^{1,2}(B)\setminus L^{\infty}(B)$ なので $W^{1,2}(B)\not\subset L^{\infty}(B)$。

$p>2$ なら、$r\to0$ で $r^{2-p}\log^{-p}\frac er\to\infty$（$\log\frac er$ は $r^{-(p-2)/p}$ より遅く増大する：$s\defeq\log\frac er$ とすると $r^{2-p}=e^{(p-2)(s-1)}$ で、$e^{(p-2)(s-1)}s^{-p}\to\infty$）ので、小さい $r$ で $|\nabla u|^{p}r=r^{1-p}\log^{-p}\frac er\ge r^{-1}$。\ref{meas:polar-coordinates} から $\int_{B}|\nabla u|^{p}\ge2\pi\int_{0}^{r_{0}}\frac{dr}{r}=\infty$。モレーの不等式は $p>2=n$ で有界性を保証するが、この $u$ はそもそも $W^{1,p}$ に入らない。
:::

## レリッヒ–コンドラショフとポアンカレ {#fa:sec-cp-exercises}

対応するページ：\ref{fa:page-compactness}

::: problem ★ 基本：1 次元のポアンカレ–ヴィルティンガーの不等式 {#fa:ex-cp-1}
1. $I=(a,b)$ を有界な開区間、$u\in W^{1,1}(I)$ とすると、すべての $x\in[a,b]$ で $|\tilde u(x)-u_{I}|\le\|u'\|_{L^{1}(I)}$ であることを示せ。これから、$1\le p<\infty$, $u\in W^{1,p}(I)$ について $\|u-u_{I}\|_{L^{p}(I)}\le|I|\,\|u'\|_{L^{p}(I)}$ を導け。
2. $\Omega\defeq(0,1)\cup(1,2)$ では、どんな $C$ についても $\|u-u_{\Omega}\|_{p}\le C\|u'\|_{p}$ がすべての $u\in W^{1,p}(\Omega)$ で成り立つことはないことを示せ。
:::

::: solution
**1.** $x,y\in[a,b]$ について $\tilde u(x)-\tilde u(y)=\int_{y}^{x}u'$（\ref{fa:sobolev-one-dimension} と \ref{meas:ftc-lebesgue}）なので $|\tilde u(x)-\tilde u(y)|\le\|u'\|_{1}$。$u_{I}=\frac1{|I|}\int_{a}^{b}\tilde u(y)\,dy$ なので
$$
|\tilde u(x)-u_{I}|=\Bigl|\frac{1}{|I|}\int_{a}^{b}\bigl(\tilde u(x)-\tilde u(y)\bigr)dy\Bigr|\le\|u'\|_{1}.
$$
$u\in W^{1,p}(I)$ なら、\ref{meas:lp-inclusions.1} から $\|u'\|_{1}\le|I|^{1-1/p}\|u'\|_{p}$ なので
$$
\|u-u_{I}\|_{p}\le|I|^{1/p}\sup_{x}|\tilde u(x)-u_{I}|\le|I|^{1/p}|I|^{1-1/p}\|u'\|_{p}=|I|\,\|u'\|_{p}.
$$

**2.** $u\defeq\mathbf{1}_{(1,2)}$ とする。$\varphi\in C_{c}^{\infty}(\Omega)$ の台はコンパクトなので、$\varphi$ は $1$ と $2$ の近くで $0$。よって $\int_{\Omega}u\varphi'=\int_{1}^{2}\varphi'=\varphi(2)-\varphi(1)=0$ で、$u'=0$、$u\in W^{1,p}(\Omega)$。一方 $u_{\Omega}=\frac12$ で $\|u-u_{\Omega}\|_{p}=\bigl(2\cdot2^{-p}\bigr)^{1/p}>0$。不等式は $0<\|u-u_{\Omega}\|_{p}\le C\cdot0$ となり成り立たない。（\ref{fa:poincare-wirtinger} の連結性の仮定は外せない。）
:::

::: problem ★★ 標準：正の測度の集合で消える関数のポアンカレの不等式 {#fa:ex-cp-2}
$\Omega$ を $C^{1}$ 境界をもつ有界な連結開集合、$1\le p<\infty$、$C_{\Omega}$ を \ref{fa:poincare-wirtinger} の定数とし、$E\subset\Omega$ を $|E|>0$ の可測集合とする。
1. $u\in W^{1,p}(\Omega)$ が $E$ の上で a.e. に $0$ なら
$$
\|u\|_{p}\le C_{\Omega}\Bigl(1+\Bigl(\frac{|\Omega|}{|E|}\Bigr)^{1/p}\Bigr)\|\nabla u\|_{p}
$$
を示せ。
2. $V_{E}\defeq\{u\in W^{1,p}(\Omega):E\text{ の上で a.e. に }u=0\}$ は $W^{1,p}(\Omega)$ の閉部分空間で、その上で $\|\nabla u\|_{p}$ は $\|u\|_{W^{1,p}}$ と同値なノルムであることを示せ。
:::

::: solution
**1.** $c\defeq u_{\Omega}$ とおく。$E$ の上で $u-c=-c$（a.e.）なので
$$
|c|\,|E|^{1/p}=\|u-c\|_{L^{p}(E)}\le\|u-c\|_{L^{p}(\Omega)}\le C_{\Omega}\|\nabla u\|_{p}.
$$
よって $|c|\le C_{\Omega}|E|^{-1/p}\|\nabla u\|_{p}$ で、
$$
\|u\|_{p}\le\|u-c\|_{p}+|c|\,|\Omega|^{1/p}\le C_{\Omega}\|\nabla u\|_{p}+C_{\Omega}\Bigl(\frac{|\Omega|}{|E|}\Bigr)^{1/p}\|\nabla u\|_{p}.
$$

**2.** $u\mapsto\|u\mathbf{1}_{E}\|_{p}$ は $W^{1,p}$ で連続（$\bigl|\|u\mathbf{1}_{E}\|_{p}-\|v\mathbf{1}_{E}\|_{p}\bigr|\le\|u-v\|_{p}$）で、$V_{E}$ はその零点集合なので閉。線形部分空間であることは明らか。$\|\nabla u\|_{p}\le\sum_{j}\|\partial_{j}u\|_{p}\le n\|u\|_{W^{1,p}}$、逆に 1 から $\|u\|_{W^{1,p}}\le\|u\|_{p}+\sum_{j}\|\partial_{j}u\|_{p}\le\bigl(C_{\Omega}(1+(|\Omega|/|E|)^{1/p})+n\bigr)\|\nabla u\|_{p}$。

（\ref{fa:poincare-wirtinger} の証明は背理法で可算選択公理を使うので、ここでもそれを通じて可算選択公理を使っている。$E$ は内部の集合でよく、境界条件の代わりになる。）
:::

::: problem ★★★ 発展：立方体でのポアンカレの不等式の最良定数 {#fa:ex-cp-3}
$L>0$, $Q\defeq(0,L)^{n}$ とする。
1. $u\in H_{0}^{1}(Q)$ と各 $j$ について $\|u\|_{2}\le\frac L\pi\|\partial_{j}u\|_{2}$ を示し、$\|u\|_{2}\le\frac{L}{\pi\sqrt n}\|\nabla u\|_{2}$ を導け。
2. $w(x)\defeq\prod_{i=1}^{n}\sin\frac{\pi x_{i}}{L}$ は $H_{0}^{1}(Q)$ に入り、1 の後半で等号が成り立つことを示せ（したがって定数 $\frac{L}{\pi\sqrt n}$ は最良）。
3. \ref{fa:poincare-inequality} から得られる定数と比べよ。
:::

::: solution
**1.** $u\in C_{c}^{\infty}(Q)$ とし、$x''\defeq(x_{2},\dots,x_{n})$ を固定する。$g(s)\defeq u(Ls,x'')$ は $C_{c}^{\infty}((0,1))$ の元で $g'(s)=L\,\partial_{1}u(Ls,x'')$。\ref{fa:prob-cp-poincare-1d} から $\int_{0}^{1}|g|^{2}\le\frac{1}{\pi^{2}}\int_{0}^{1}|g'|^{2}$。$x_{1}=Ls$ と置換すると
$$
\int_{0}^{L}|u(x_{1},x'')|^{2}dx_{1}=L\int_{0}^{1}|g|^{2}ds\le\frac{L}{\pi^{2}}\int_{0}^{1}L^{2}|\partial_{1}u(Ls,x'')|^{2}ds=\frac{L^{2}}{\pi^{2}}\int_{0}^{L}|\partial_{1}u(x_{1},x'')|^{2}dx_{1}.
$$
$x''$ について積分（\ref{meas:tonelli}）すると $\|u\|_{2}^{2}\le\frac{L^{2}}{\pi^{2}}\|\partial_{1}u\|_{2}^{2}$。座標の役割を入れ替えれば各 $j$ で同じ。両辺は $H^{1}$ で連続なので、閉包 $H_{0}^{1}(Q)$ でも成り立つ。$j$ について足すと $n\|u\|_{2}^{2}\le\frac{L^{2}}{\pi^{2}}\|\nabla u\|_{2}^{2}$。

**2.** **$w\in H_{0}^{1}(Q)$.** \ref{fa:prob-cp-poincare-1d} の解答から、$\sigma(t)\defeq\sin(\pi t)$ について $\sigma_{k}\in C_{c}^{\infty}((0,1))$ で $\sigma_{k}\to\sigma$（$H^{1}((0,1))$）となるものがある。$a_{k}(t)\defeq\sigma_{k}(t/L)$, $s(t)\defeq\sigma(t/L)$ とすると、置換から $a_{k}\to s$（$H^{1}((0,L))$）。$w_{k}(x)\defeq\prod_{i}a_{k}(x_{i})\in C_{c}^{\infty}(Q)$。$f(x)=\prod_{i}f_{i}(x_{i})$ の形の関数について $\|f\|_{L^{2}(Q)}=\prod_{i}\|f_{i}\|_{L^{2}(0,L)}$（\ref{meas:tonelli}）で、
$$
\prod_{i}b_{i}-\prod_{i}c_{i}=\sum_{m=1}^{n}\Bigl(\prod_{i<m}b_{i}\Bigr)(b_{m}-c_{m})\Bigl(\prod_{i>m}c_{i}\Bigr)
$$
なので、$\|w_{k}-w\|_{2}\le\sum_{m}\|a_{k}\|_{2}^{m-1}\|a_{k}-s\|_{2}\|s\|_{2}^{n-m}\to0$。$\partial_{j}w_{k}=a_{k}'(x_{j})\prod_{i\ne j}a_{k}(x_{i})$ も、$j$ 番目の因子を $a_{k}'\to s'$ に替えて同じ評価から $\partial_{j}w$（古典的な偏導関数）に $L^{2}$ 収束する。$w_{k}$ はコーシー列で、\ref{fa:sobolev-complete} の証明から極限 $w$ は $H^{1}(Q)$ の元で弱微分は古典的な偏導関数。よって $w\in H_{0}^{1}(Q)$。

**等号.** $\int_{0}^{L}\sin^{2}\frac{\pi t}{L}dt=\frac L2$, $\int_{0}^{L}\bigl(\frac\pi L\cos\frac{\pi t}{L}\bigr)^{2}dt=\frac{\pi^{2}}{L^{2}}\cdot\frac L2$ なので、\ref{meas:tonelli} から
$$
\|w\|_{2}^{2}=\Bigl(\frac L2\Bigr)^{n},\qquad\|\partial_{j}w\|_{2}^{2}=\frac{\pi^{2}}{L^{2}}\Bigl(\frac L2\Bigr)^{n},\qquad\|\nabla w\|_{2}^{2}=\frac{n\pi^{2}}{L^{2}}\|w\|_{2}^{2}.
$$
よって $\|w\|_{2}=\frac{L}{\pi\sqrt n}\|\nabla w\|_{2}$。

**3.** $Q$ を $x_{1}$ 方向に $\frac L2$ 平行移動したものは帯状領域 $\{|x_{1}|<\frac L2\}$ に含まれ、\ref{fa:poincare-inequality}（$p=2$, $a=\frac L2$）は $\|u\|_{2}\le L\|\partial_{1}u\|_{2}$ を与える（平行移動で $H_{0}^{1}$ もノルムも保たれる）。1 の $\frac L\pi$ はその $\frac1\pi$ 倍、$\|\nabla u\|_{2}$ で測った最良定数 $\frac{L}{\pi\sqrt n}$ は $\frac{1}{\pi\sqrt n}$ 倍である。
:::

## ラックス–ミルグラムの定理 {#fa:sec-lm-exercises}

対応するページ：\ref{fa:page-lax-milgram}

::: problem ★★ 標準：数直線上の方程式 −u″ + u = f {#fa:ex-lm-1}
$f\in L^{2}(\mathbb{R})$ とし、$H^{1}(\mathbb{R})$ 上の $B(u,v)\defeq\int_{\mathbb{R}}(u'\overline{v'}+u\overline v)\,dx$ を考える。
1. $u\in H^{1}(\mathbb{R})$ で $B(u,v)=\int f\overline v$（すべての $v\in H^{1}(\mathbb{R})$）となるものがただ一つあり、$\|u\|_{H^{1}}\le\|f\|_{2}$ であることを示せ。
2. その解は $u=G*f$, $G(x)\defeq\frac12e^{-|x|}$ であることを示せ。
:::

::: solution
**1.** $B$ は $H^{1}(\mathbb{R})$ の内積そのものなので、$|B(u,v)|\le\|u\|_{H^{1}}\|v\|_{H^{1}}$, $B(u,u)=\|u\|_{H^{1}}^{2}$（$M=\alpha=1$）。$\ell(v)\defeq\int f\overline v$ は共役線形で $|\ell(v)|\le\|f\|_{2}\|v\|_{2}\le\|f\|_{2}\|v\|_{H^{1}}$。\ref{fa:lax-milgram} から主張が従う。

**2.** **$u$ の形.** $x\in\mathbb{R}$ について、コーシー–シュワルツの不等式から $\int|G(x-y)f(y)|dy\le\|G\|_{2}\|f\|_{2}<\infty$ なので $u(x)\defeq(G*f)(x)$ は各点で定まり、
$$
u(x)=\frac12\bigl(e^{-x}P(x)+e^{x}Q(x)\bigr),\qquad P(x)\defeq\int_{-\infty}^{x}e^{y}f(y)\,dy,\quad Q(x)\defeq\int_{x}^{\infty}e^{-y}f(y)\,dy
$$
（$e^{y}\mathbf{1}_{(-\infty,x)}$, $e^{-y}\mathbf{1}_{(x,\infty)}$ は $L^{2}$ に入るので積分は絶対収束）。\ref{four:convolution-rd.1} から $\|u\|_{2}\le\|G\|_{1}\|f\|_{2}=\|f\|_{2}$。

**導関数.** 有界区間 $[a,b]$ の上で $P(x)=P(a)+\int_{a}^{x}e^{y}f$ なので、\ref{meas:ftc-lebesgue}（実部と虚部に使う）から $P$ は絶対連続で $P'=e^{x}f$（a.e.）、同様に $Q'=-e^{-x}f$（a.e.）。絶対連続関数の積は絶対連続（$[a,b]$ 上で有界なので、$|FG(b_{i})-FG(a_{i})|\le\sup|F||G(b_{i})-G(a_{i})|+\sup|G||F(b_{i})-F(a_{i})|$）で、両方が微分可能な点で積の微分の公式が成り立つ。よって $u$ は各有界区間で絶対連続で、a.e. で
$$
u'=\frac12\bigl(-e^{-x}P+f+e^{x}Q-f\bigr)=\frac12\bigl(-e^{-x}P+e^{x}Q\bigr)\eqdef w .
$$
$w$ は連続で、$G'(x)\defeq-\frac12\operatorname{sgn}(x)e^{-|x|}$ について $w=G'*f$（$y<x$ と $y>x$ に分けて計算すると一致する）なので、$\|w\|_{2}\le\|G'\|_{1}\|f\|_{2}=\|f\|_{2}$。$u$ は絶対連続なので \ref{meas:ftc-lebesgue} から $u(x)=u(a)+\int_{a}^{x}w$。同様に $w$ も各有界区間で絶対連続で、a.e. で
$$
w'=\frac12\bigl(e^{-x}P-f+e^{x}Q-f\bigr)=u-f .
$$

**$u\in H^{1}$ と弱形式.** $\varphi\in C_{c}^{\infty}(\mathbb{R})$, $\operatorname{supp}\varphi\subset(a,b)$ とする。$u\varphi$ は $[a,b]$ 上絶対連続で両端で $0$ なので $0=\int_{a}^{b}(u\varphi)'=\int(w\varphi+u\varphi')$。よって $u$ の弱微分は $w\in L^{2}$ で $u\in H^{1}(\mathbb{R})$。同様に $w\overline{\varphi'}$ を $\overline{\varphi}$ との積で考えると $\int w\overline{\varphi'}=-\int w'\overline\varphi$ なので
$$
B(u,\varphi)=\int\bigl(w\overline{\varphi'}+u\overline\varphi\bigr)=\int\bigl(-(u-f)+u\bigr)\overline\varphi=\int f\overline\varphi .
$$
$C_{c}^{\infty}(\mathbb{R})$ は $H^{1}(\mathbb{R})$ で稠密（\ref{fa:test-dense-rn}）で、$v\mapsto B(u,v)$, $v\mapsto\int f\overline v$ は $H^{1}$ で連続なので、すべての $v\in H^{1}(\mathbb{R})$ で $B(u,v)=\int f\overline v$。1 の一意性から $G*f$ が解である。

（$G$ は作用素 $-\frac{d^{2}}{dx^{2}}+1$ の基本解で、\ref{fa:ex-di-1.1} と同様の計算で超関数として $-G''+G=\delta$ が確かめられる。）
:::

::: problem ★★ 標準：ノイマン問題 {#fa:ex-lm-2}
$\Omega$ を $C^{1}$ 境界をもつ有界な連結開集合、$f\in L^{2}(\Omega)$ とし、
$$
u\in H^{1}(\Omega),\qquad\int_{\Omega}\nabla u\cdot\overline{\nabla v}\,dx=\int_{\Omega}f\overline v\,dx\quad(\text{すべての }v\in H^{1}(\Omega))\tag{N}
$$
（$-\Delta u=f$、境界で $\partial_{\nu}u=0$ の弱形式）を考える。
1. (N) が解をもつなら $\int_{\Omega}f=0$ であることを示せ。
2. $\int_{\Omega}f=0$ なら、(N) の解で $u_{\Omega}=0$ となるものがただ一つ存在し、(N) の解の全体はそれに定数を加えたものであることを示せ。また、その解について $\|u\|_{H^{1}}\le(1+C_{\Omega}^{2})\|f\|_{2}$（$C_{\Omega}$ は \ref{fa:poincare-wirtinger} の $p=2$ の定数）を示せ。
:::

::: solution
**1.** $\Omega$ は有界なので定数関数 $1$ は $H^{1}(\Omega)$ に入り、$\nabla1=0$。(N) で $v=1$ とすると $0=\int f$。

**2.** $H_{*}\defeq\{v\in H^{1}(\Omega):\int_{\Omega}v=0\}$ とする。$v\mapsto\int_{\Omega}v$ は $L^{2}(\Omega)$ で連続（$|\int v|\le|\Omega|^{1/2}\|v\|_{2}$）なので $H_{*}$ は閉部分空間で、それ自身ヒルベルト空間。$B(u,v)\defeq\int\nabla u\cdot\overline{\nabla v}$ は $|B(u,v)|\le\|u\|_{H^{1}}\|v\|_{H^{1}}$ を満たす。$v\in H_{*}$ なら $v_{\Omega}=0$ なので、\ref{fa:poincare-wirtinger}（$p=2$）から $\|v\|_{2}\le C_{\Omega}\|\nabla v\|_{2}$ で
$$
\|v\|_{H^{1}}^{2}=\|v\|_{2}^{2}+\|\nabla v\|_{2}^{2}\le(1+C_{\Omega}^{2})B(v,v).
$$
$\ell(v)\defeq\int f\overline v$ は $|\ell(v)|\le\|f\|_{2}\|v\|_{H^{1}}$。\ref{fa:lax-milgram}（$\alpha=(1+C_{\Omega}^{2})^{-1}$）から、$u\in H_{*}$ で $B(u,v)=\ell(v)$（$v\in H_{*}$）となるものがただ一つあり、$\|u\|_{H^{1}}\le(1+C_{\Omega}^{2})\|f\|_{2}$。

**$u$ は (N) の解.** $v\in H^{1}(\Omega)$ について $v-v_{\Omega}\in H_{*}$、$\nabla(v-v_{\Omega})=\nabla v$ で、$\int f=0$ から $\ell(v_{\Omega})=\overline{v_{\Omega}}\int f=0$。よって $B(u,v)=B(u,v-v_{\Omega})=\ell(v-v_{\Omega})=\ell(v)$。

**解の全体.** $u_{1},u_{2}$ が (N) の解なら、$w\defeq u_{1}-u_{2}$ はすべての $v$ で $B(w,v)=0$、$v=w$ として $\|\nabla w\|_{2}=0$。\ref{fa:zero-gradient}（$\Omega$ は連結）から $w$ は定数。逆に定数 $c$ について $\nabla(u+c)=\nabla u$ なので $u+c$ も解。$u_{\Omega}=0$ の解は、定数の差が平均の差に等しいことから一つだけ。

（\ref{fa:poincare-wirtinger} を通じて可算選択公理を使っている。$\Omega$ が連結でないと、各成分で定数を独立に選べるので、平均 $0$ の条件だけでは解は一つに決まらない。）
:::

::: problem ★★★ 発展：1 次元の有限要素法とセアの評価 {#fa:ex-lm-3}
$H\defeq H_{0}^{1}((0,1))$ に内積 $\langle u,v\rangle_{*}\defeq\int_{0}^{1}u'\overline{v'}$ を入れる（\ref{fa:poincare-inequality} からノルム $\|u\|_{*}\defeq\|u'\|_{2}$ は $H^{1}$ ノルムと同値で、$H$ はヒルベルト空間）。$f\in L^{2}((0,1))$、$u\in H$ を $-u''=f$, $u(0)=u(1)=0$ の弱解（$\langle u,v\rangle_{*}=\int f\overline v$, $v\in H$）とする。$N\ge2$, $h\defeq\frac1N$, $x_{i}\defeq ih$ とし、$i=1,\dots,N-1$ について帽子関数 $\varphi_{i}(x)\defeq\max\bigl(0,1-\frac{|x-x_{i}|}{h}\bigr)$、$V_{N}\defeq\operatorname{span}\{\varphi_{1},\dots,\varphi_{N-1}\}$ とする。
1. $V_{N}\subset H$ を示し、ガレルキン解 $u_{N}=\sum_{i}U_{i}\varphi_{i}$ の係数が、$U_{0}=U_{N}=0$ として
$$
\frac1h\bigl(2U_{i}-U_{i-1}-U_{i+1}\bigr)=\int_{0}^{1}f\varphi_{i}\,dx\qquad(i=1,\dots,N-1)
$$
のただ一つの解であることを示せ。
2. $\|(u-u_{N})'\|_{2}\le h\|f\|_{2}$ と $\|u-u_{N}\|_{2}\le\frac h\pi\|f\|_{2}$ を示せ。
3. $u_{N}$ は $u$ の節点補間 $I_{N}u\defeq\sum_{i}\tilde u(x_{i})\varphi_{i}$ に等しいこと、すなわち $U_{i}=\tilde u(x_{i})$ であることを示せ。
:::

::: solution
$B(u,v)\defeq\langle u,v\rangle_{*}$ は $H$ 上で有界かつ強圧的で、$M=\alpha=1$。

**1.** $\varphi_{i}$ は $[0,1]$ 上の連続な折れ線で $\varphi_{i}(0)=\varphi_{i}(1)=0$ なので、\ref{fa:ex-et-2} から $\varphi_{i}\in H$。$\varphi_{i}'=\frac1h$（$(x_{i-1},x_{i})$ で）、$-\frac1h$（$(x_{i},x_{i+1})$ で）、$0$（それ以外）なので
$$
\langle\varphi_{j},\varphi_{i}\rangle_{*}=\int\varphi_{j}'\varphi_{i}'=\begin{cases}2/h&(i=j)\\-1/h&(|i-j|=1)\\0&(|i-j|\ge2)\end{cases}.
$$
$\varphi_{i}(x_{j})=\delta_{ij}$ なので $\varphi_{1},\dots,\varphi_{N-1}$ は一次独立で、$V_{N}$ は $N-1$ 次元の（したがって閉な）部分空間。\ref{fa:galerkin-cea.1} からガレルキン解 $u_{N}\in V_{N}$ がただ一つあり、条件「$B(u_{N},v)=\int f\overline v$（$v\in V_{N}$）」は $v=\varphi_{i}$（実数値）について $\sum_{j}U_{j}\langle\varphi_{j},\varphi_{i}\rangle_{*}=\int f\varphi_{i}$ と同値で、これが示された連立方程式である。$u_{N}$ の一意性と係数の一意性（一次独立性）から、連立方程式の解はただ一つ。

**2.** **補間誤差.** \ref{fa:prob-lm-1d} の解答から、$\tilde u$ は $C^{1}$ で $\tilde u'$ は絶対連続、$\tilde u''=-f$（a.e.）、また $\tilde u(0)=\tilde u(1)=0$。$e\defeq\tilde u-I_{N}u$ は各節点で $e(x_{i})=0$（$i=0,\dots,N$）。小区間 $J\defeq(x_{i-1},x_{i})$ の上で $I_{N}u$ は 1 次関数なので、$e'$ は $J$ 上で絶対連続な関数 $E$（$\overline J$ 上連続、$E'=-f$ a.e.）に等しく、$\int_{J}E=e(x_{i})-e(x_{i-1})=0$。$x\in J$ について
$$
|E(x)|=\Bigl|\frac1h\int_{J}\bigl(E(x)-E(y)\bigr)dy\Bigr|\le\int_{J}|f|\le h^{1/2}\|f\|_{L^{2}(J)}
$$
（$|E(x)-E(y)|\le\int_{J}|E'|$ とコーシー–シュワルツ）なので $\int_{J}|e'|^{2}\le h\cdot h\|f\|_{L^{2}(J)}^{2}$。$J$ について足して $\|(u-I_{N}u)'\|_{2}\le h\|f\|_{2}$。

**セアの評価.** $I_{N}u\in V_{N}$ なので、\ref{fa:galerkin-cea.2}（$M/\alpha=1$）から
$$
\|(u-u_{N})'\|_{2}=\|u-u_{N}\|_{*}\le\inf_{w\in V_{N}}\|u-w\|_{*}\le\|(u-I_{N}u)'\|_{2}\le h\|f\|_{2}.
$$
$u-u_{N}\in H$ なので \ref{fa:prob-cp-poincare-1d} から $\|u-u_{N}\|_{2}\le\frac1\pi\|(u-u_{N})'\|_{2}\le\frac h\pi\|f\|_{2}$。

**3.** 2 の $e=\tilde u-I_{N}u$（$\in H$）について、$i=1,\dots,N-1$ で
$$
\langle e,\varphi_{i}\rangle_{*}=\frac1h\int_{x_{i-1}}^{x_{i}}e'-\frac1h\int_{x_{i}}^{x_{i+1}}e'=\frac{e(x_{i})-e(x_{i-1})}{h}-\frac{e(x_{i+1})-e(x_{i})}{h}=0 .
$$
よって $v\in V_{N}$ について $B(I_{N}u,v)=B(u,v)-B(e,v)=\int f\overline v$ で、$I_{N}u$ はガレルキン解の条件を満たす。1 の一意性から $u_{N}=I_{N}u$。

（1 次元では、ガレルキン解は節点で厳密解と一致する。2 の評価はこの事実を使わずにセアの補題だけから得られるが、3 から 2 の不等式 $\|u-u_{N}\|_{*}\le\|u-I_{N}u\|_{*}$ は実際には等号である。例えば $f=1$ なら $u=\frac12x(1-x)$ で、$U_{i}=\frac12x_{i}(1-x_{i})$ について $\frac1h(2U_{i}-U_{i-1}-U_{i+1})=h=\int\varphi_{i}$ が直接確かめられる。）
:::
