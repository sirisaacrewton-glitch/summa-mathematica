# 非有界自己共役作用素のスペクトル定理 {#fa:page-unbounded-spectral keywords="Borel functional calculus with unbounded functions h(G) of a bounded self-adjoint operator, self-adjointness of h(G), resolvents of a self-adjoint operator, R = (T+i)^{-1} is normal, bounded transform G = T (1+T^2)^{-1/2} constructed from resolvents, 1 - G^2 = (1+T^2)^{-1}, T = h(G) with h(s) = s / sqrt(1 - s^2), spectral theorem for unbounded self-adjoint operators, projection-valued measure on R, functional calculus f(T), unitary groups e^{itT}"}

有界な自己共役作用素にはスペクトル定理（\ref{fa:spectral-theorem-bounded}）があった。非有界な自己共役作用素 $T$——ラプラシアンや運動量——にも同じ定理を延ばしたい。標準的な方法は、$T$ を有界な作用素に変換し、その有界な作用素のスペクトル定理を使って戻すことである。このページでは、$T$ のレゾルベント $R\defeq(T+i)^{-1}$ だけを使って、有界な自己共役作用素 $G$（形式的には $T(1+T^{2})^{-1/2}$、関数 $t\mapsto\frac{t}{\sqrt{1+t^{2}}}$ で $\mathbb{R}$ を $(-1,1)$ に縮めたもの）を構成し、$T=h(G)$（$h(s)=\frac{s}{\sqrt{1-s^{2}}}$）と表す。そのために、まず有界な作用素 $G$ に**有界でない**ボレル関数 $h$ を代入する関数計算を整え、$h(G)$ が自己共役であることを示す。結果として、$T$ は $\mathbb{R}$ 上の射影値測度 $E$ で $T=\int t\,dE(t)$ と書け、すべての有界ボレル関数 $f$ について $f(T)$ が定まる。とくに $e^{itT}$ はユニタリ作用素の群をなし、これが次のページの量子力学的な時間発展（ストーンの定理）につながる。

## 記法と定義の確認 {#fa:sec-us-notation}

::: notation
- 有界な自己共役作用素 $G$ のスペクトル測度 $\mu_{x,y}$、$\mu_{x}=\mu_{x,x}$、ボレル関数計算 $g(G)$（$g$ 有界ボレル）と射影値測度 $E_{G}$ は \ref{fa:page-spectral-measures}。$\sigma(G)\subset[a,b]$。
- 連続関数計算と平方根は \ref{fa:continuous-functional-calculus}, \ref{fa:square-root}。
- 共役・自己共役性の基本判定は \ref{fa:page-unbounded-operators}（とくに \ref{fa:self-adjointness-criterion}）。
- \ref{fa:borel-functional-calculus} の証明の Step 3 から、有界ボレル関数 $g$ について $d\mu_{g(G)x}=|g|^{2}d\mu_{x}$（$\|f(G)g(G)x\|^{2}=\int|f|^{2}|g|^{2}d\mu_{x}$ を連続な $f$ で比べる）。
- **選択公理**：使わない。
:::

## 有界でない関数の代入 {#fa:sec-us-unbounded-calculus}

::: theorem 有界でない関数による関数計算 {#fa:unbounded-borel-calculus keywords="for a bounded self-adjoint G and a real Borel function h on [a,b], h(G) with domain {x : int |h|^2 d mu_x < infinity} and h(G)x = lim h_k(G) x (h_k truncations) is self-adjoint; ||h(G)x||^2 = int |h|^2 d mu_x; for bounded g with h g bounded, g(G) maps into D(h(G)) and h(G) g(G) = (h g)(G)" index="有界でない関数による関数計算|ゆうかいでないかんすうによるかんすうけいさん"}
$G$ を有界な自己共役作用素、$h\colon[a,b]\to\mathbb{R}$ をボレル関数とし、$h_{k}\defeq h\mathbf{1}_{\{|h|\le k\}}$ とおく。
$$
D(h(G))\defeq\Bigl\{x\in H:\int|h|^{2}d\mu_{x}<\infty\Bigr\},\qquad h(G)x\defeq\lim_{k\to\infty}h_{k}(G)x
$$
と定める。
1. 極限は存在し、$\|h(G)x\|^{2}=\int|h|^{2}d\mu_{x}$。$D(h(G))$ は稠密な部分空間で、$h(G)$ は線形。
2. 有界ボレル関数 $g$ で $hg$ も有界なものについて、$g(G)H\subset D(h(G))$ で $h(G)g(G)=(hg)(G)$。
3. $h(G)$ は自己共役。
:::

::: proof
**1.** $\|h_{k}(G)x-h_{l}(G)x\|^{2}=\int|h_{k}-h_{l}|^{2}d\mu_{x}$（\ref{fa:borel-functional-calculus} の 1・2）で、$|h_{k}-h_{l}|^{2}\le|h|^{2}$ は $\mu_{x}$ 可積分、各点で $0$ に収束するので、優収束定理から $(h_{k}(G)x)$ はコーシー列。$\|h(G)x\|^{2}=\lim\int|h_{k}|^{2}d\mu_{x}=\int|h|^{2}d\mu_{x}$（単調収束定理）。部分空間であること：$\int|h|^{2}d\mu_{x+y}=\lim\|h_{k}(G)(x+y)\|^{2}\le\lim(\|h_{k}(G)x\|+\|h_{k}(G)y\|)^{2}<\infty$。線形性は極限から。稠密性：$x_{k}\defeq E_{G}(\{|h|\le k\})x$ は、$d\mu_{x_{k}}=\mathbf{1}_{\{|h|\le k\}}d\mu_{x}$ から $D(h(G))$ に属し、$\|x-x_{k}\|^{2}=\mu_{x}(\{|h|>k\})\to0$（$h$ は有限値）。

**2.** $d\mu_{g(G)x}=|g|^{2}d\mu_{x}$ から $\int|h|^{2}d\mu_{g(G)x}=\int|hg|^{2}d\mu_{x}<\infty$。$h_{k}(G)g(G)x=(h_{k}g)(G)x$ で、$h_{k}g\to hg$ は有界な各点収束なので、\ref{fa:borel-functional-calculus.3} から $(hg)(G)x$ に収束する。

**3.** **対称性.** $x,y\in D(h(G))$ なら $h_{k}$ は実数値で有界なので $\langle h_{k}(G)x,y\rangle=\langle x,h_{k}(G)y\rangle$、極限で $\langle h(G)x,y\rangle=\langle x,h(G)y\rangle$。**判定.** $g_{\pm}\defeq\frac{1}{h\pm i}$ は有界（$|g_{\pm}|\le1$）で $hg_{\pm}$ も有界。2 から $(h(G)\pm i)g_{\pm}(G)=((h\pm i)g_{\pm})(G)=1$ なので $R(h(G)\pm i)=H$。\ref{fa:self-adjointness-criterion.2}（(c)⇒(a)）から自己共役。
:::

## 有界変換 {#fa:sec-us-bounded-transform}

::: lemma 自己共役作用素のレゾルベント {#fa:selfadjoint-resolvents keywords="for self-adjoint T, R = (T+i)^{-1} has adjoint (T-i)^{-1}, R is normal, K = R*R = (1+T^2)^{-1} is positive and injective, R - R* = -2iK, L = (R + R*)/2 is bounded self-adjoint with T K = L, K and L commute and K - L^2 = K^2" index="自己共役作用素のレゾルベント|じこきょうやくさようそのれぞるべんと"}
$T$ を自己共役作用素とし、$R\defeq(T+i)^{-1}$、$R'\defeq(T-i)^{-1}$（\ref{fa:unbounded-selfadjoint-spectrum} から有界）とする。
1. $R^{*}=R'$、$R-R'=-2iRR'=-2iR'R$。とくに $R$ は正規。
2. $K\defeq R^{*}R$ は正で単射、$R-R^{*}=-2iK$。$L\defeq\frac12(R+R^{*})$ は有界な自己共役作用素で、$K$ と可換、$K$ の値域は $D(T)$ に含まれ $TK=L$。
3. $K-L^{2}=K^{2}$。
:::

::: proof
**1.** $x=(T+i)u$, $y=(T-i)v$（$u,v\in D(T)$）とすると、自己共役性から $\langle Rx,y\rangle=\langle u,(T-i)v\rangle=\langle(T+i)u,v\rangle=\langle x,R'y\rangle$。$T\pm i$ は全射なので $R^{*}=R'$。$R-R'=R\bigl((T-i)-(T+i)\bigr)R'=-2iRR'$（$R'H=D(T)$ の上で計算）。同様に $R-R'=R'\bigl((T-i)-(T+i)\bigr)R=-2iR'R$。

**2.** $K=R^{*}R=R'R$ は正（$\langle Kx,x\rangle=\|Rx\|^{2}$）で、$R$ が単射なので単射。1 から $R-R^{*}=-2iK$。$L$ は自己共役。$R$ が正規なので $R$, $R^{*}$ は互いに可換で、$K$, $L$ も可換。$KH=R^{*}(RH)\subset R^{*}H=D(T)$ で、$(T+i)R=1$ から $TR=1-iR$ なので $TK=TRR^{*}\cdot$（$R^{*}R=RR^{*}$）$=(1-iR)R^{*}=R^{*}-iK$。一方 $R=R^{*}-2iK$ から $L=\frac12(R+R^{*})=R^{*}-iK$。よって $TK=L$。

**3.** $RR^{*}=R^{*}R=K$ を使って $(R+R^{*})^{2}=R^{2}+R^{*2}+2K$, $(R-R^{*})^{2}=R^{2}+R^{*2}-2K$。よって $L^{2}=\frac14(R+R^{*})^{2}=\frac14(R-R^{*})^{2}+K=\frac14(-2iK)^{2}+K=-K^{2}+K$。
:::

::: proposition 有界変換 {#fa:bounded-transform keywords="bounded transform: there is a bounded self-adjoint G with ||G|| <= 1, G K^{1/2} = L, G commuting with K, and 1 - G^2 = K = (1+T^2)^{-1}" index="有界変換|ゆうかいへんかん"}
\ref{fa:selfadjoint-resolvents} の記号で、有界な自己共役作用素 $G$ で、$\|G\|\le1$、$GK^{1/2}=L$、$G$ は $K^{1/2}$ と可換、$1-G^{2}=K$ となるものがただ一つある。
:::

::: proof
**Step 1（定義）.** $K^{1/2}$（\ref{fa:square-root}）は自己共役で単射（$K^{1/2}x=0\Rightarrow Kx=0$）なので、値域は稠密（$R(K^{1/2})^{\perp}=\ker K^{1/2}=0$）。$\|Lx\|^{2}=\langle L^{2}x,x\rangle=\langle Kx,x\rangle-\|Kx\|^{2}\le\|K^{1/2}x\|^{2}$（\ref{fa:selfadjoint-resolvents.3}）。よって $G(K^{1/2}x)\defeq Lx$ は well-defined で（$K^{1/2}x=K^{1/2}x'$ なら $\|L(x-x')\|\le0$）、ノルム $\le1$ の線形写像として $\overline{R(K^{1/2})}=H$ に一意に延びる。

**Step 2（可換性と自己共役性）.** $L$ は $K$ と可換なので $K^{1/2}$ とも可換（\ref{fa:square-root.2}）。$G K^{1/2}(K^{1/2}x)=LK^{1/2}x=K^{1/2}Lx=K^{1/2}GK^{1/2}x$ なので、$G$ と $K^{1/2}$ は稠密集合 $R(K^{1/2})$ の上で、したがって全体で可換。$\langle GK^{1/2}x,K^{1/2}y\rangle=\langle Lx,K^{1/2}y\rangle=\langle K^{1/2}x,Ly\rangle=\langle K^{1/2}x,GK^{1/2}y\rangle$ なので、$G$ は稠密集合の上で対称で、有界なので自己共役。

**Step 3（$1-G^{2}=K$）.** $G^{2}K=GK^{1/2}GK^{1/2}=L^{2}$ なので、\ref{fa:selfadjoint-resolvents.3} から $(1-G^{2})K=K-L^{2}=K^{2}$、すなわち $(1-G^{2}-K)K=0$。$R(K)$ は稠密（$K$ は自己共役で単射）なので $1-G^{2}=K$。一意性は Step 1 の定義が条件 $GK^{1/2}=L$ から決まることによる。
:::

## スペクトル定理 {#fa:sec-us-spectral}

::: theorem 非有界自己共役作用素のスペクトル定理 {#fa:unbounded-spectral-theorem keywords="T = h(G) with h(s) = s / sqrt(1 - s^2); E_T(B) = E_G(h^{-1}(B)) is a projection-valued measure on R with D(T) = {x : int t^2 d mu^T_x < infinity} and <Tx, y> = int t d mu^T_{x,y}; bounded Borel functional calculus f(T) = (f o h)(G)" index="非有界自己共役作用素のスペクトル定理|ひゆうかいじこきょうやくさようそのすぺくとるていり"}
$T$ を自己共役作用素、$G$ を \ref{fa:bounded-transform} の作用素とし、$h(s)\defeq\frac{s}{\sqrt{1-s^{2}}}$（$|s|<1$）、$h(\pm1)\defeq0$ とおく。
1. $E_{G}(\{-1,1\})=0$ で、$T=h(G)$（定義域も含めて）。
2. $\mathbb{R}$ のボレル集合 $B$ について $E_{T}(B)\defeq E_{G}(h^{-1}(B)\cap(-1,1))$ は $\mathbb{R}$ 上の射影値測度で、$\mu_{x,y}^{T}(B)\defeq\langle E_{T}(B)x,y\rangle$ とおくと
$$
D(T)=\Bigl\{x:\int t^{2}d\mu_{x}^{T}<\infty\Bigr\},\qquad\langle Tx,y\rangle=\int_{\mathbb{R}}t\,d\mu_{x,y}^{T}(t)\quad(x,y\in D(T)).
$$
3. 有界ボレル関数 $f\colon\mathbb{R}\to\mathbb{C}$ について $f(T)\defeq(f\circ h)(G)$ とおくと、$f\mapsto f(T)$ は \ref{fa:borel-functional-calculus} の性質（線形・積・共役・ノルム $\le\sup|f|$・有界な各点収束で強収束）をもち、$\langle f(T)x,y\rangle=\int f\,d\mu_{x,y}^{T}$。
:::

::: proof
**1.** **Step 1.** $\ker(1-G^{2})=\ker K=0$ なので、$E_{G}(\{\pm1\})x$（$G$ の固有値 $\pm1$ の固有空間への射影、$(1-G^{2})E_{G}(\{\pm1\})=((1-s^{2})\mathbf{1}_{\{\pm1\}})(G)=0$）は $0$。

**Step 2（$R(K)$ の上での一致）.** $K=1-G^{2}=(1-s^{2})(G)$、$K^{1/2}=\sqrt{1-s^{2}}(G)$（平方根の一意性、\ref{fa:square-root.2}）。$h(s)(1-s^{2})=s\sqrt{1-s^{2}}$ は有界なので、\ref{fa:unbounded-borel-calculus.2} から $R(K)\subset D(h(G))$ で $h(G)K=(s\sqrt{1-s^{2}})(G)=GK^{1/2}=L=TK$（\ref{fa:selfadjoint-resolvents.2}）。

**Step 3（閉包の一致）.** $S\defeq T|_{R(K)}=h(G)|_{R(K)}$ は対称。$(T+i)R(K)=(T+i)RR^{*}H=R^{*}H=D(T)$、$(T-i)R(K)=(T-i)R^{*}RH=RH=D(T)$ はどちらも稠密なので、\ref{fa:self-adjointness-criterion.3} から $\overline S$ は自己共役。$T$ と $h(G)$ はどちらも $S$ の閉な拡張なので $\overline S\subset T$, $\overline S\subset h(G)$。自己共役作用素 $A\subset B$（$B$ も自己共役）なら $B=B^{*}\subset A^{*}=A$ で $A=B$。よって $T=\overline S=h(G)$（\ref{fa:unbounded-borel-calculus.3}）。

**2.** $h\colon(-1,1)\to\mathbb{R}$ は連続な全単射（狭義単調増加）なので $h^{-1}(B)$ はボレル集合で、$E_{T}$ が射影値測度であることは $E_{G}$ の性質（\ref{fa:spectral-theorem-bounded}）と Step 1 から。$\mu_{x}^{T}$ は $\mu_{x}$ の $h$ による像測度なので、$\int t^{2}d\mu_{x}^{T}=\int|h|^{2}d\mu_{x}$（\ref{prb:change-of-variables} と同じ変数変換の公式）。1 と \ref{fa:unbounded-borel-calculus.1} から定義域の式。$\langle Tx,y\rangle=\lim\langle h_{k}(G)x,y\rangle=\lim\int h_{k}d\mu_{x,y}=\int h\,d\mu_{x,y}$（$x,y\in D(T)$ なら $z\defeq x+i^{k}y\in D(T)$ で、$\int|h|\,d\mu_{z}\le(\int|h|^{2}d\mu_{z})^{1/2}\|z\|<\infty$ なので、$\mu_{x,y}$ を定める四つの測度について優収束定理が使える）を像測度に書き直せばよい。

**3.** $f\circ h$ は $[a,b]$ 上の有界ボレル関数（$\pm1$ では $f(0)$ と定めても $E_{G}(\{\pm1\})=0$ なので影響しない）で、\ref{fa:borel-functional-calculus} をそのまま使う。積分の式は像測度への書き直し。
:::

::: corollary ユニタリ群 {#fa:unitary-group-from-selfadjoint keywords="for self-adjoint T, U(t) = e^{itT} defined by the functional calculus is a strongly continuous one-parameter unitary group; for x in D(T), (U(t)x - x)/t -> iTx; conversely if this limit exists then x is in D(T)" index="ユニタリ群（自己共役作用素から）|ゆにたりぐんじこきょうやくさようそから"}
$T$ を自己共役とし、$U(t)\defeq e^{itT}$（$f_{t}(s)=e^{its}$ に \ref{fa:unbounded-spectral-theorem.3} を使う）とおく。
1. $U(t)$ はユニタリで、$U(s+t)=U(s)U(t)$、$U(0)=1$、$t\mapsto U(t)x$ は連続。
2. $x\in D(T)$ なら $\frac{U(t)x-x}{t}\to iTx$（$t\to0$）。逆にこの極限が存在すれば $x\in D(T)$。
:::

::: proof
**1.** $|f_{t}|=1$, $f_{s+t}=f_{s}f_{t}$, $\overline{f_{t}}=f_{-t}$ と関数計算の性質から $U(t)^{*}U(t)=U(t)U(t)^{*}=1$ と群の性質。連続性：$t\to t_{0}$ で $f_{t}\to f_{t_{0}}$ は有界な各点収束なので強収束。

**2.** $\bigl\|\frac{U(t)x-x}{t}-iTx\bigr\|^{2}=\int\bigl|\frac{e^{its}-1}{t}-is\bigr|^{2}d\mu_{x}^{T}(s)$。被積分関数は各点で $0$ に収束し、$|\frac{e^{its}-1}{t}|\le|s|$（\ref{prb:exponential-taylor.1}）から $4s^{2}$ で抑えられ、$x\in D(T)$ なら可積分。優収束定理。逆：極限 $y$ が存在すれば、$\int\bigl|\frac{e^{its}-1}{t}\bigr|^{2}d\mu_{x}^{T}=\bigl\|\frac{U(t)x-x}{t}\bigr\|^{2}$ は有界で、ファトゥの補題から $\int s^{2}d\mu_{x}^{T}\le\liminf\int\bigl|\frac{e^{its}-1}{t}\bigr|^{2}d\mu_{x}^{T}<\infty$、すなわち $x\in D(T)$。
:::

::: hypcheck
- 有界変換の構成では、$T$ の関数計算を使わず、レゾルベント $R$ と $R^{*}$ の代数的な関係（\ref{fa:selfadjoint-resolvents}）だけを使った。これは循環論法を避けるためである（$T(1+T^{2})^{-1/2}$ を $T$ の関数計算で定義すると、示したい定理を前提にしてしまう）。
- 自己共役性は \ref{fa:selfadjoint-resolvents.1}（$R^{*}=(T-i)^{-1}$、$T\pm i$ の全射性）に本質的に使った。対称なだけの作用素では $T\pm i$ の一方が全射でなく、$R$ が定義できない。
- \ref{fa:unbounded-borel-calculus} で $h$ を実数値としたのは自己共役性のため。複素数値の $h$ でも $h(G)$ は閉で正規な作用素になる。
- ケーリー変換 $U=(T-i)(T+i)^{-1}$ による標準的な証明は、ユニタリ作用素のスペクトル定理（単位円上の射影値測度）を必要とする。このサイトでは単位円上のリース–マルコフの定理をまだ示していないので、実数直線上の有界変換を使った。
:::

::: supplement
**関連する結果.**
- **掛け算作用素表示**：可分なヒルベルト空間の自己共役作用素 $T$ は、$\bigoplus_{j}L^{2}(\mathbb{R},\mu_{j})$ 上の $t$ の（非有界な）掛け算作用素とユニタリ同値である。$G$ の掛け算作用素表示（\ref{fa:separable-multiplication}）を $h$ で移せばよい。
- **フリードリクス拡大**：下に有界な対称作用素 $S$（$\langle Sx,x\rangle\ge c\|x\|^{2}$）について、二次形式 $q(x)\defeq\langle Sx,x\rangle$ の閉包の定義域 $Q$ の上でラックス–ミルグラムの定理（\ref{fa:lax-milgram}）を使うと、$S$ の自己共役拡張で同じ下限をもつものが得られる。ディリクレ・ラプラシアン（\ref{fa:dirichlet-laplacian}）は $C_{c}^{\infty}(\Omega)$ 上の $-\Delta$ のフリードリクス拡大である。このサイトでは一般の形では証明していない。
- スペクトルの分類：$\sigma(T)$ は $E_{T}$ の台で、離散スペクトル（有限重複の孤立固有値）と真性スペクトルに分かれる。ワイルの定理は、相対コンパクトな摂動で真性スペクトルが変わらないことを述べる。

**高い視点：座標を縮めて戻す.** $\mathbb{R}$ 全体に広がるスペクトルをもつ $T$ を、単調な同相写像 $t\mapsto\frac{t}{\sqrt{1+t^{2}}}$ で有界な区間 $(-1,1)$ に縮めると、有界な作用素 $G$ になる。有界な作用素のスペクトル定理を適用したあと、逆写像 $h$ で目盛りを元に戻せば $T$ の対角化が得られる。比喩で言えば、果てしなく続く物差しを、端に行くほど目盛りが詰まる有限の物差しに描き直して測り、測り終えてから目盛りを読み替えるのである。レゾルベントは、その描き直しを $T$ の関数計算を使わずに実現する道具になっている。
:::

## 問題 {#fa:sec-us-problems}

::: problem {#fa:prob-us-multiplication}
$H=L^{2}(\mathbb{R})$、$T$ を $t$ による掛け算作用素（\ref{fa:multiplication-operator}）とする。$G$ は $\frac{t}{\sqrt{1+t^{2}}}$ の掛け算、$E_{T}(B)$ は $\mathbf{1}_{B}$ の掛け算、$e^{isT}$ は $e^{ist}$ の掛け算であることを示せ。
:::

::: solution
$R=(T+i)^{-1}$ は $\frac{1}{t+i}$ の掛け算（\ref{fa:multiplication-operator} の証明）、$R^{*}$ は $\frac{1}{t-i}$、$K$ は $\frac{1}{1+t^{2}}$、$L$ は $\frac{t}{1+t^{2}}$ の掛け算。$\frac{t}{\sqrt{1+t^{2}}}$ の掛け算 $G'$ は $\|G'\|\le1$ の自己共役作用素で、$G'K^{1/2}$（$K^{1/2}$ は $\frac{1}{\sqrt{1+t^{2}}}$ の掛け算、平方根の一意性）は $\frac{t}{1+t^{2}}$ の掛け算 $=L$、$K^{1/2}$ と可換、$1-G'^{2}=K$。\ref{fa:bounded-transform} の一意性から $G=G'$。掛け算作用素 $G$ の関数計算は関数の合成の掛け算（\ref{fa:prob-sm2-multiplication} と同じ議論）なので、$E_{T}(B)=E_{G}(h^{-1}(B))$ は $\mathbf{1}_{h^{-1}(B)}(\frac{t}{\sqrt{1+t^{2}}})=\mathbf{1}_{B}(t)$ の掛け算。$e^{isT}$ も同様に $e^{ish(t/\sqrt{1+t^{2}})}=e^{ist}$ の掛け算。
:::

::: problem {#fa:prob-us-heat-semigroup}
$-\Delta_{D}$（\ref{fa:dirichlet-laplacian}）の固有値と正規直交な固有関数を $\lambda_{k}$, $e_{k}$ とするとき、$t\ge0$ について $e^{-t(-\Delta_{D})}x=\sum_{k}e^{-t\lambda_{k}}\langle x,e_{k}\rangle e_{k}$ を示せ（左辺は有界関数 $s\mapsto e^{-ts}\mathbf{1}_{[0,\infty)}(s)$ の関数計算）。
:::

::: solution
$T\defeq-\Delta_{D}$ とする。$(T\pm i)e_{k}=(\lambda_{k}\pm i)e_{k}$ から $Re_{k}=\frac{e_{k}}{\lambda_{k}+i}$, $R^{*}e_{k}=\frac{e_{k}}{\lambda_{k}-i}$、よって $Ke_{k}=\frac{e_{k}}{1+\lambda_{k}^{2}}$, $Le_{k}=\frac{\lambda_{k}e_{k}}{1+\lambda_{k}^{2}}$。$K^{1/2}$ は $K$ の多項式の極限なので $K^{1/2}e_{k}=(1+\lambda_{k}^{2})^{-1/2}e_{k}$、$GK^{1/2}=L$ から $Ge_{k}=s_{k}e_{k}$, $s_{k}\defeq\frac{\lambda_{k}}{\sqrt{1+\lambda_{k}^{2}}}$。固有ベクトル $e_{k}$ について $\langle p(G)e_{k},e_{k}\rangle=p(s_{k})$（多項式 $p$）なので $\mu_{e_{k}}=\delta_{s_{k}}$、したがって有界ボレル関数 $g$ について $\|g(G)e_{k}-g(s_{k})e_{k}\|^{2}=\int|g-g(s_{k})|^{2}d\mu_{e_{k}}=0$。$f(T)e_{k}=(f\circ h)(G)e_{k}=f(h(s_{k}))e_{k}=f(\lambda_{k})e_{k}$。$x=\sum\langle x,e_{k}\rangle e_{k}$ に有界作用素 $f(T)$ を作用させればよい。
:::
