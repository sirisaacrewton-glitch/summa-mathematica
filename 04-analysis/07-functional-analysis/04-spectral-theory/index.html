# スペクトル理論（Spectral Theory）

有界自己共役作用素の連続関数計算・平方根・極分解、スペクトル測度と有界自己共役・正規作用素のスペクトル定理、非有界作用素（閉作用素・共役・自己共役性）、非有界自己共役作用素のスペクトル定理、作用素半群とヒレ–吉田の定理・ストーンの定理。

<p class="mn-msc">MSC2020: 47A60, 47B15, 47B25, 47D06</p>
