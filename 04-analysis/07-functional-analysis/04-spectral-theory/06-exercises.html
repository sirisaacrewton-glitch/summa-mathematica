# 演習：スペクトル理論 {#fa:page-exercises-spectral keywords="exercises, Spectral Theory"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、$2\times2$ 行列での作用素の順序の計算、平方根が順序を保つことと $\|\sqrt A-\sqrt B\|\le\|A-B\|^{1/2}$、関数計算のノルムとスペクトル測度に関する本質的上限、コンパクト作用素のスペクトル射影、巡回ベクトルをもつ作用素と可換な作用素、$\mathbb{R}^{n}$ 上のラプラシアンのフーリエ変換による対角化、区間上の運動量作用素の自己共役拡張、ケーリー変換、レゾルベントと射影値測度の台、掛け算作用素の半群と熱半群、一様連続な半群の特徴づけと、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#fa:sec-exfa4-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。$H$ は複素ヒルベルト空間で、内積は第 1 変数について線形。$A\le B$ は $B-A\ge0$ の意味（\ref{fa:page-functional-calculus}）。
- 有界な自己共役作用素 $A$（$\sigma(A)\subset[a,b]$）について、連続関数計算は \ref{fa:continuous-functional-calculus}、スペクトル測度 $\mu_{x,y}$, $\mu_{x}=\mu_{x,x}$ とボレル関数計算 $f(A)$（$f\in B_{b}([a,b])$）は \ref{fa:spectral-measure}, \ref{fa:borel-functional-calculus}、$E(B)\defeq\mathbf{1}_{B}(A)$ は \ref{fa:spectral-theorem-bounded}。\ref{fa:borel-functional-calculus} の証明の Step 2 から $\|f(A)x\|^{2}=\int|f|^{2}d\mu_{x}$ で、とくに $\mu_{x}(B)=\langle E(B)x,x\rangle=\|E(B)x\|^{2}$。
- 自己共役作用素 $T$（非有界でもよい）について、$G$, $h$, $E_{T}$, $\mu_{x,y}^{T}$, $f(T)$ は \ref{fa:unbounded-spectral-theorem} のとおり。
- $(X,\nu)$ は σ 有限な測度空間、$\varphi\colon X\to\mathbb{C}$ は可測関数で、$L^{2}(\nu)$ 上の掛け算作用素を $D(M_{\varphi})\defeq\{f\in L^{2}(\nu):\varphi f\in L^{2}(\nu)\}$, $M_{\varphi}f\defeq\varphi f$ とする（実数値なら \ref{fa:multiplication-operator} の作用素）。$\varphi$ が有界なら $M_{\varphi}$ は有界で $\|M_{\varphi}\|\le\sup|\varphi|$。
- $\mathcal{F}\colon L^{2}(\mathbb{R}^{n})\to L^{2}(\mathbb{R}^{n})$ は \ref{four:plancherel} のユニタリ作用素で、$L^{1}\cap L^{2}$ の上では $\hat f(\xi)=\int f(x)e^{-2\pi ix\cdot\xi}dx$（\ref{four:fourier-transform}）。$H^{k}(\mathbb{R}^{n})$, $H^{1}((0,1))$, $H_{0}^{1}((0,1))$ は \ref{fa:sobolev-space} などのとおりで、$u\in H^{1}((0,1))$ の絶対連続な代表元を $\tilde u$ と書く（\ref{fa:sobolev-one-dimension}）。
- $\mathbb{R}^{n}$ の球面 $\{|\xi|=r\}$ はルベーグ測度 $0$ である：$\varepsilon>0$ について $\{|\xi|=r\}\subset B(0,r+\varepsilon)\setminus B(0,r)$ で、\ref{meas:lebesgue-linear} から右辺の測度は $\bigl((r+\varepsilon)^{n}-r^{n}\bigr)|B(0,1)|\to0$。
- **選択公理**：\ref{fa:compact-selfadjoint-spectral} を使う \ref{fa:ex-sm2-2} と、\ref{fa:semigroup-basic} を使う \ref{fa:ex-sg-3} では、それらの証明を通じて従属選択公理を使う。それ以外では使わない。
:::

## 連続関数計算 {#fa:sec-fc-exercises}

対応するページ：\ref{fa:page-functional-calculus}

::: problem ★ 基本：2 次の行列での作用素の順序 {#fa:ex-fc-1}
$H=\mathbb{C}^{2}$ で $A\defeq\begin{pmatrix}1&0\\0&0\end{pmatrix}$, $B\defeq\begin{pmatrix}2&1\\1&1\end{pmatrix}$ とする。
1. $0\le A\le B$ だが、$A^{2}\le B^{2}$ は成り立たないことを示せ。
2. $\sqrt B=\frac{1}{\sqrt5}\begin{pmatrix}3&1\\1&2\end{pmatrix}$ を示し、$\sqrt A\le\sqrt B$ を確かめよ。
3. 一般に $0\le A\le B$ で $AB=BA$ なら $A^{2}\le B^{2}$ であることを示せ（したがって 1 の反例では $A$ と $B$ は可換でない）。
:::

::: solution
**補題（実対称な $2\times2$ 行列）.** $p,q,r\in\mathbb{R}$, $p>0$, $pr-q^{2}\ge0$ なら $M\defeq\begin{pmatrix}p&q\\q&r\end{pmatrix}\ge0$。実際、$x=(x_{1},x_{2})\in\mathbb{C}^{2}$ について平方完成すると
$$
\langle Mx,x\rangle=p|x_{1}|^{2}+2q\operatorname{Re}(x_{1}\overline{x_{2}})+r|x_{2}|^{2}=p\Bigl|x_{1}+\frac qpx_{2}\Bigr|^{2}+\frac{pr-q^{2}}{p}|x_{2}|^{2}\ge0 .
$$

**1.** $\langle Ax,x\rangle=|x_{1}|^{2}\ge0$、$B-A=\begin{pmatrix}1&1\\1&1\end{pmatrix}$ で $\langle(B-A)x,x\rangle=|x_{1}+x_{2}|^{2}\ge0$。よって $0\le A\le B$。一方 $A^{2}=A$, $B^{2}=\begin{pmatrix}5&3\\3&2\end{pmatrix}$ で、$B^{2}-A^{2}=\begin{pmatrix}4&3\\3&2\end{pmatrix}$。$x=(2,-3)$ について
$$
\langle(B^{2}-A^{2})x,x\rangle=4\cdot4+2\cdot3\cdot2\cdot(-3)+2\cdot9=-2<0
$$
なので $A^{2}\le B^{2}$ ではない。

**2.** $C\defeq\frac{1}{\sqrt5}\begin{pmatrix}3&1\\1&2\end{pmatrix}$ とすると $C^{2}=\frac15\begin{pmatrix}10&5\\5&5\end{pmatrix}=B$。補題（$p=\frac{3}{\sqrt5}$, $pr-q^{2}=\frac{6-1}{5}=1$）から $C\ge0$。\ref{fa:square-root.2} の一意性から $\sqrt B=C$。$A$ は $A\ge0$, $A^{2}=A$ を満たすので同じく $\sqrt A=A$。
$$
\sqrt B-\sqrt A=\frac{1}{\sqrt5}\begin{pmatrix}3-\sqrt5&1\\1&2\end{pmatrix}
$$
で、$3-\sqrt5>0$、$(3-\sqrt5)\cdot2-1=5-2\sqrt5>0$（$20<25$）なので、補題から $\sqrt A\le\sqrt B$。

**3.** $P\defeq B-A\ge0$, $Q\defeq B+A\ge0$ は可換で、$PQ=B^{2}-BA+AB-A^{2}=B^{2}-A^{2}$。$Q$ は $P$ と可換なので、\ref{fa:square-root.2} から $\sqrt P$ とも可換で、$PQ=\sqrt P\,Q\sqrt P$。よって $\langle(B^{2}-A^{2})x,x\rangle=\langle Q\sqrt Px,\sqrt Px\rangle\ge0$。

（関数 $t\mapsto t^{2}$ は $[0,\infty)$ で増加だが、作用素の順序は保たない。次の \ref{fa:ex-fc-2} で、$t\mapsto\sqrt t$ は保つことを示す。）
:::

::: problem ★★ 標準：平方根は順序を保つ {#fa:ex-fc-2}
$A,B\in B(H)$, $0\le A\le B$ なら $\sqrt A\le\sqrt B$ であることを示せ。
:::

::: solution
$X\defeq\sqrt A$, $Y\defeq\sqrt B$, $S\defeq Y-X$（自己共役）とし、$m\defeq\inf_{\|x\|=1}\langle Sx,x\rangle$ とおく。$m\ge0$ を示せばよい。$m<0$ と仮定する。

**Step 1（近似固有ベクトル）.** $P\defeq S-m\ge0$。\ref{fa:selfadjoint-spectrum} の証明の Step 2 から $\|Px\|^{2}\le\|P\|\langle Px,x\rangle$。単位ベクトル $x_{k}$ を $\langle Sx_{k},x_{k}\rangle\to m$ となるようにとると、$\langle Px_{k},x_{k}\rangle\to0$ なので $\|(S-m)x_{k}\|\to0$。

**Step 2（$B-A$ を $S$ で表す）.** $S(Y+X)=Y^{2}+YX-XY-X^{2}$, $(Y+X)S=Y^{2}-YX+XY-X^{2}$ なので $B-A=Y^{2}-X^{2}=\frac12\bigl(S(Y+X)+(Y+X)S\bigr)$。$S$, $Y+X$ は自己共役なので
$$
\langle(B-A)x,x\rangle=\frac12\bigl(\langle(Y+X)x,Sx\rangle+\langle Sx,(Y+X)x\rangle\bigr)=\operatorname{Re}\langle Sx,(Y+X)x\rangle .
$$

**Step 3（矛盾）.** $c_{k}\defeq\langle(Y+X)x_{k},x_{k}\rangle$（実数）とすると、$Y\ge0$ から $c_{k}=2\langle Yx_{k},x_{k}\rangle-\langle Sx_{k},x_{k}\rangle\ge-\langle Sx_{k},x_{k}\rangle\to-m>0$。よって十分大きな $k$ で $c_{k}\ge-\frac m2$。Step 2 で $Sx_{k}=mx_{k}+(S-m)x_{k}$ と分けると
$$
\langle(B-A)x_{k},x_{k}\rangle=mc_{k}+\operatorname{Re}\langle(S-m)x_{k},(Y+X)x_{k}\rangle\le-\frac{m^{2}}{2}+\|(S-m)x_{k}\|\,\|Y+X\| .
$$
Step 1 から右辺は $k\to\infty$ で $-\frac{m^{2}}{2}<0$ に近づくので、ある $k$ で $\langle(B-A)x_{k},x_{k}\rangle<0$。これは $A\le B$ に反する。よって $m\ge0$、すなわち $\sqrt A\le\sqrt B$。
:::

::: problem ★★★ 発展：平方根の連続性の評価 {#fa:ex-fc-3}
$A,B\in B(H)$, $A,B\ge0$ とする。
1. $\|\sqrt A-\sqrt B\|\le\|A-B\|^{1/2}$ を示せ。
2. 1 の指数 $\frac12$ は改善できないこと、すなわち $\frac12<\beta\le1$ と定数 $C$ について $\|\sqrt A-\sqrt B\|\le C\|A-B\|^{\beta}$ がすべての $A,B\ge0$ で成り立つことはないことを示せ（$H\ne0$）。
:::

::: solution
**1.** $\varepsilon\defeq\|A-B\|$ とする。単位ベクトル $x$ について $\langle(A-B)x,x\rangle\le\varepsilon$ なので $A\le B+\varepsilon$。

**Step 1（$\sqrt{B+\varepsilon}\le\sqrt B+\sqrt\varepsilon$）.** $\sigma(B)\subset[0,\infty)$（\ref{fa:square-root.1}）の上で $g(t)\defeq\sqrt{t+\varepsilon}$, $s(t)\defeq\sqrt t$ とする。\ref{fa:continuous-functional-calculus} の 2・3 から $g(B)\ge0$, $g(B)^{2}=(g^{2})(B)=B+\varepsilon$ なので、\ref{fa:square-root.2} の一意性から $g(B)=\sqrt{B+\varepsilon}$。同様に $s(B)=\sqrt B$。$t\ge0$ で $(\sqrt t+\sqrt\varepsilon)^{2}=t+\varepsilon+2\sqrt{t\varepsilon}\ge t+\varepsilon$ なので $s+\sqrt\varepsilon-g\ge0$ で、\ref{fa:continuous-functional-calculus.3} から $\sqrt B+\sqrt\varepsilon-\sqrt{B+\varepsilon}\ge0$。

**Step 2.** $0\le A\le B+\varepsilon$ なので \ref{fa:ex-fc-2} から $\sqrt A\le\sqrt{B+\varepsilon}\le\sqrt B+\sqrt\varepsilon$。$A$ と $B$ を入れ替えて $\sqrt B\le\sqrt A+\sqrt\varepsilon$。よって自己共役作用素 $D\defeq\sqrt A-\sqrt B$ は、単位ベクトル $x$ について $-\sqrt\varepsilon\le\langle Dx,x\rangle\le\sqrt\varepsilon$ を満たし、\ref{fa:selfadjoint.3} から $\|D\|=\sup_{\|x\|=1}|\langle Dx,x\rangle|\le\sqrt\varepsilon$。

**2.** $A\defeq0$, $B\defeq\varepsilon I$（$0<\varepsilon<1$）とすると $\|\sqrt A-\sqrt B\|=\sqrt\varepsilon$, $\|A-B\|=\varepsilon$ なので、不等式は $\sqrt\varepsilon\le C\varepsilon^{\beta}$、すなわち $1\le C\varepsilon^{\beta-1/2}$ となる。$\beta>\frac12$ なので $\varepsilon\to0$ で右辺は $0$ に近づき矛盾。とくに $A\mapsto\sqrt A$ はリプシッツ連続ではない（$\beta=1$）。1 の等号は $A=0$, $B=\varepsilon I$ で成り立つ。
:::

## スペクトル測度とスペクトル定理 {#fa:sec-sm2-exercises}

対応するページ：\ref{fa:page-spectral-measures}

::: problem ★ 基本：関数計算のノルムと本質的上限 {#fa:ex-sm2-1}
$A$ を有界な自己共役作用素、$\sigma(A)\subset[a,b]$、$E$ をその射影値測度とする。$f\in B_{b}([a,b])$ について
$$
\|f\|_{E}\defeq\inf\bigl\{c\ge0:E(\{|f|>c\})=0\bigr\}
$$
とおく。
1. $\|f(A)\|=\|f\|_{E}$ を示せ。
2. $f(A)=0$ $\iff$ $E(\{f\ne0\})=0$ を示せ。
3. $H=L^{2}([0,1])$, $(Ax)(t)=tx(t)$（\ref{fa:prob-sm2-multiplication}）について、$\|f(A)\|$ は $[0,1]$ 上の $|f|$ のルベーグ測度に関する本質的上限に等しいことを示せ。とくに $f\defeq\mathbf{1}_{\mathbb{Q}\cap[0,1]}$ は $\sup|f|=1$ だが $f(A)=0$。
:::

::: solution
**準備.** $C$ をボレル集合、$y\in H$, $x\defeq E(C)y$ とする。ボレル集合 $B$ について、$E(C)$ は自己共役で $E(B)E(C)=E(B\cap C)$（\ref{fa:spectral-theorem-bounded.1}）なので
$$
\mu_{x}(B)=\langle E(B)E(C)y,E(C)y\rangle=\langle E(C)E(B)E(C)y,y\rangle=\mu_{y}(B\cap C).
$$
よって $\mu_{x}=\mathbf{1}_{C}\mu_{y}$ で、非負ボレル関数 $g$ について $\int g\,d\mu_{x}=\int_{C}g\,d\mu_{y}$（指示関数で成り立ち、単関数、単調収束定理）。

**1.** **（$\le$）** $c\ge0$ が $E(N)=0$, $N\defeq\{|f|>c\}$ を満たすとする。各 $x$ で $\mu_{x}(N)=\|E(N)x\|^{2}=0$ なので
$$
\|f(A)x\|^{2}=\int|f|^{2}d\mu_{x}=\int_{[a,b]\setminus N}|f|^{2}d\mu_{x}\le c^{2}\mu_{x}([a,b])=c^{2}\|x\|^{2}.
$$
よって $\|f(A)\|\le c$、下限をとって $\|f(A)\|\le\|f\|_{E}$。

**（$\ge$）** $0\le c'<\|f\|_{E}$ とすると、$c'$ は下限の集合に入らないので $C\defeq\{|f|>c'\}$ について $E(C)\ne0$。$x\defeq E(C)y\ne0$ となる $y$ をとると、準備から
$$
\|f(A)x\|^{2}=\int_{C}|f|^{2}d\mu_{y}\ge c'^{2}\mu_{y}(C)=c'^{2}\|E(C)y\|^{2}=c'^{2}\|x\|^{2}.
$$
よって $\|f(A)\|\ge c'$。$c'\uparrow\|f\|_{E}$ として $\|f(A)\|\ge\|f\|_{E}$。

**2.** $B_{k}\defeq\{|f|>\frac1k\}$ とする。1 から $f(A)=0$ $\iff$ $\|f\|_{E}=0$。$\|f\|_{E}=0$ なら、各 $k$ で $c<\frac1k$ かつ $E(\{|f|>c\})=0$ となる $c$ があり、$B_{k}\subset\{|f|>c\}$ なので $E(B_{k})=E(B_{k})E(\{|f|>c\})=0$。逆にすべての $E(B_{k})=0$ なら $\|f\|_{E}\le\frac1k$（すべての $k$）。よって $f(A)=0$ $\iff$ すべての $k$ で $E(B_{k})=0$。$B_{k}$ は増加列で $\bigcup_{k}B_{k}=\{f\ne0\}$。$\|E(\{f\ne0\})x\|^{2}=\mu_{x}(\{f\ne0\})=\lim_{k}\mu_{x}(B_{k})$ なので、すべての $E(B_{k})=0$ と $E(\{f\ne0\})=0$ は同値（逆向きは $E(B_{k})=E(B_{k})E(\{f\ne0\})$）。

**3.** \ref{fa:prob-sm2-multiplication} から $E(B)$ は $\mathbf{1}_{B}$ の掛け算。$|B\cap[0,1]|=0$ なら $E(B)=0$。$|B\cap[0,1]|>0$ なら $x\defeq\mathbf{1}_{B\cap[0,1]}\ne0$ で $E(B)x=x$。よって $E(B)=0$ $\iff$ $|B\cap[0,1]|=0$ で、$\|f\|_{E}$ は $[0,1]$ 上の $|f|$ の本質的上限 $\inf\{c:|\{t\in[0,1]:|f(t)|>c\}|=0\}$ に一致する。$f=\mathbf{1}_{\mathbb{Q}\cap[0,1]}$ では $\{f\ne0\}$ は可算集合で測度 $0$ なので、2 から $f(A)=0$。

（\ref{fa:borel-functional-calculus.1} の評価 $\|f(A)\|\le\sup|f|$ は一般に等号ではなく、ボレル関数計算は $E$ に関する零集合の上の値を見ない。$f$ が連続なら $\|f(A)\|=\max_{\sigma(A)}|f|$ だった。）
:::

::: problem ★★ 標準：コンパクトな自己共役作用素のスペクトル射影 {#fa:ex-sm2-2}
$A$ をコンパクトな自己共役作用素とし、\ref{fa:compact-selfadjoint-spectral} の $(e_{k})$, $\lambda_{k}$ で $Ax=\sum_{k}\lambda_{k}\langle x,e_{k}\rangle e_{k}$ と書く。$P_{0}$ を $\ker A$ への直交射影、$\sigma(A)\subset[a,b]$ とする。
1. $\mu_{x}=\|P_{0}x\|^{2}\delta_{0}+\sum_{k}|\langle x,e_{k}\rangle|^{2}\delta_{\lambda_{k}}$ を示し、$f\in B_{b}([a,b])$ について
$$
f(A)x=f(0)P_{0}x+\sum_{k}f(\lambda_{k})\langle x,e_{k}\rangle e_{k}
$$
を示せ。
2. $\lambda\ne0$ について $E(\{\lambda\})$ は固有空間 $\ker(A-\lambda)$ への直交射影で、その次元は有限であること、$E(\{0\})=P_{0}$ であることを示せ。
3. $\ell^{2}$ 上の $A(x_{1},x_{2},\dots)\defeq(x_{1},\frac{x_{2}}{2},\frac{x_{3}}{3},\dots)$ について、$0\in\sigma(A)$ だが $E(\{0\})=0$ であり、すべての $\delta>0$ で $E((0,\delta))\ne0$ であることを示せ。
:::

::: solution
**1.** **Step 1（分解）.** $H=\ker A\oplus\overline{\operatorname{span}}\{e_{k}\}$（\ref{fa:compact-selfadjoint-spectral}）で、$(e_{k})$ は第 2 成分の正規直交基底（張る空間が稠密）なので、\ref{fa:orthonormal-basis.3} から $x=P_{0}x+\sum_{k}\langle x,e_{k}\rangle e_{k}$。$A$ は有界なので帰納法で $A^{j}x=\sum_{k}\lambda_{k}^{j}\langle x,e_{k}\rangle e_{k}$（$j\ge1$）。よって多項式 $p$ について
$$
p(A)x=p(0)P_{0}x+\sum_{k}p(\lambda_{k})\langle x,e_{k}\rangle e_{k},\qquad\langle p(A)x,x\rangle=p(0)\|P_{0}x\|^{2}+\sum_{k}p(\lambda_{k})|\langle x,e_{k}\rangle|^{2}.
$$

**Step 2（測度）.** $\nu_{x}\defeq\|P_{0}x\|^{2}\delta_{0}+\sum_{k}|\langle x,e_{k}\rangle|^{2}\delta_{\lambda_{k}}$ は $[a,b]$ 上の有限測度（全質量 $\|x\|^{2}$、$0,\lambda_{k}\in\sigma(A)\subset[a,b]$）で、Step 1 から多項式 $p$ について $\langle p(A)x,x\rangle=\int p\,d\nu_{x}$。$f\in C([a,b])$ の実部と虚部に \ref{top:weierstrass-approximation.1} を使って $\|f-p_{j}\|_{\infty}\to0$ となる多項式 $p_{j}$ をとると、$|\langle(f(A)-p_{j}(A))x,x\rangle|\le\|f-p_{j}\|_{\infty}\|x\|^{2}$、$|\int(f-p_{j})d\nu_{x}|\le\|f-p_{j}\|_{\infty}\|x\|^{2}$ なので $\langle f(A)x,x\rangle=\int f\,d\nu_{x}$。\ref{fa:riesz-markov-interval.1} の一意性から $\mu_{x}=\nu_{x}$。

**Step 3（ボレル関数）.** 分極で、$z_{m}\defeq x+i^{m}y$ について $\frac14\sum_{m}i^{m}\|P_{0}z_{m}\|^{2}=\langle P_{0}x,y\rangle$, $\frac14\sum_{m}i^{m}|\langle z_{m},e_{k}\rangle|^{2}=\langle x,e_{k}\rangle\overline{\langle y,e_{k}\rangle}$ なので、$f\in B_{b}([a,b])$ について（各級数は $|f(\lambda_{k})|\le\sup|f|$ とベッセルの不等式から絶対収束）
$$
\langle f(A)x,y\rangle=\int f\,d\mu_{x,y}=f(0)\langle P_{0}x,y\rangle+\sum_{k}f(\lambda_{k})\langle x,e_{k}\rangle\overline{\langle y,e_{k}\rangle}=\Bigl\langle f(0)P_{0}x+\sum_{k}f(\lambda_{k})\langle x,e_{k}\rangle e_{k},\,y\Bigr\rangle .
$$
（$\sum_{k}f(\lambda_{k})\langle x,e_{k}\rangle e_{k}$ は係数が 2 乗総和可能なので、\ref{fa:orthonormal-basis} の証明と同じく部分和がコーシー列になって収束する。）$y$ は任意なので主張の式。

**2.** $f=\mathbf{1}_{\{\lambda\}}$（$\lambda\ne0$）とすると $f(0)=0$ で、$E(\{\lambda\})x=\sum_{\lambda_{k}=\lambda}\langle x,e_{k}\rangle e_{k}$。$\lambda_{k}\to0$（無限個の場合）なので $\lambda_{k}=\lambda$ となる $k$ は有限個で、$E(\{\lambda\})$ は $V_{\lambda}\defeq\operatorname{span}\{e_{k}:\lambda_{k}=\lambda\}$ への直交射影。$V_{\lambda}\subset\ker(A-\lambda)$ は明らか。逆に $Ax=\lambda x$ なら
$$
\lambda P_{0}x+\sum_{k}\lambda\langle x,e_{k}\rangle e_{k}=\lambda x=Ax=\sum_{k}\lambda_{k}\langle x,e_{k}\rangle e_{k}
$$
で、直交分解と展開係数の一意性から $\lambda P_{0}x=0$、$(\lambda_{k}-\lambda)\langle x,e_{k}\rangle=0$。$\lambda\ne0$ なので $P_{0}x=0$ で、$\lambda_{k}\ne\lambda$ なら $\langle x,e_{k}\rangle=0$。よって $x\in V_{\lambda}$。$f=\mathbf{1}_{\{0\}}$ では $f(0)=1$, $f(\lambda_{k})=0$ なので $E(\{0\})=P_{0}$。

**3.** $A$ は対角作用素で、標準基底 $e_{k}$, $\lambda_{k}=\frac1k$ が \ref{fa:compact-selfadjoint-spectral} の形を与える（$A$ は有限階の作用素 $A_{N}x\defeq(x_{1},\dots,\frac{x_{N}}{N},0,\dots)$ のノルム極限 $\|A-A_{N}\|\le\frac{1}{N+1}$ なのでコンパクト、\ref{fa:compact-ideal}）。$Ax=0$ なら各 $\frac{x_{k}}{k}=0$ なので $\ker A=0$、2 から $E(\{0\})=P_{0}=0$。一方 $\sigma(A)$ は閉集合で $\frac1k\in\sigma(A)$ なので $0\in\sigma(A)$。$\delta>0$ について $\frac1k<\delta$ となる $k$ をとると、1 から $E((0,\delta))e_{k}=e_{k}\ne0$。

（$0$ はスペクトルに入るが固有値ではなく、$\{0\}$ に射影値測度の質量はない。それでも $0$ のどんな近傍にも質量がある。）
:::

::: problem ★★★ 発展：巡回ベクトルをもつ作用素と可換な作用素 {#fa:ex-sm2-3}
$A$ を有界な自己共役作用素、$\sigma(A)\subset[a,b]$、$x\in H$ を巡回ベクトル、$U\colon L^{2}([a,b],\mu_{x})\to H$ を \ref{fa:separable-multiplication.1} のユニタリ作用素とする。
1. $g\in B_{b}([a,b])$ について $U^{-1}g(A)U$ は $g$ の掛け算作用素であることを示せ。
2. $S\in B(H)$ が $SA=AS$ を満たすなら、$\varphi\in B_{b}([a,b])$ で $\sup|\varphi|\le\|S\|$、$S=\varphi(A)$ となるものがあることを示せ。とくに $A$ と可換な作用素どうしは互いに可換である。
3. $H=\mathbb{C}^{2}$, $A=I$ では 2 の結論が成り立たないことを確かめ、$I$ は巡回ベクトルをもたないことを確かめよ。
:::

::: solution
$\mu\defeq\mu_{x}$, $\langle\cdot,\cdot\rangle_{\mu}$ を $L^{2}(\mu)$ の内積とする。\ref{fa:separable-multiplication} の証明の 1 から、$C([a,b])$ は $L^{2}(\mu)$ で稠密で、連続な $h$ について $Uh=h(A)x$。

**1.** 連続な $h,k$ について、\ref{fa:borel-functional-calculus} の 1・2 から $k(A)^{*}=\bar k(A)$, $\bar k(A)g(A)h(A)=(\bar kgh)(A)$ なので
$$
\langle g(A)Uh,Uk\rangle=\langle g(A)h(A)x,k(A)x\rangle=\langle(\bar kgh)(A)x,x\rangle=\int\bar k\,g\,h\,d\mu=\langle gh,k\rangle_{\mu}.
$$
両辺は $(h,k)\in L^{2}(\mu)\times L^{2}(\mu)$ について連続（$|g|\le\sup|g|$ なので掛け算 $M_{g}$ は有界）で、$C([a,b])$ は稠密なので、すべての $h,k$ で $\langle U^{-1}g(A)Uh,k\rangle_{\mu}=\langle gh,k\rangle_{\mu}$。よって $U^{-1}g(A)U=M_{g}$。

**2.** **Step 1（$S'$ は連続関数の掛け算と可換）.** $S'\defeq U^{-1}SU$ とする。1（$g(t)=t$）から $U^{-1}AU=M_{t}$ で、$S'M_{t}=U^{-1}SAU=U^{-1}ASU=M_{t}S'$。よって多項式 $p$ について $S'M_{p}=M_{p}S'$。連続な $g$ には \ref{top:weierstrass-approximation.1} の多項式 $p_{j}$ で $\|M_{g}-M_{p_{j}}\|\le\sup_{[a,b]}|g-p_{j}|\to0$ なので $S'M_{g}=M_{g}S'$。

**Step 2（$S'$ は掛け算）.** 定数関数 $1\in L^{2}(\mu)$（$\mu$ は有限）について $\varphi_{0}\defeq S'1\in L^{2}(\mu)$ とし、ボレル可測な代表元をとる。連続な $g$ について $S'g=S'M_{g}1=M_{g}S'1=g\varphi_{0}$。よって $c\defeq\|S'\|=\|S\|$ について
$$
\int|g|^{2}|\varphi_{0}|^{2}d\mu\le c^{2}\int|g|^{2}d\mu\qquad(g\in C([a,b])).\tag{$*$}
$$

**Step 3（$|\varphi_{0}|\le c$ a.e.）.** $\delta>0$, $C_{\delta}\defeq\{|\varphi_{0}|>c+\delta\}$ とする。連続な $g_{j}\to\mathbf{1}_{C_{\delta}}$（$L^{2}(\mu)$）をとり、\ref{meas:riesz-fischer} から部分列に替えて $\mu$-a.e. で収束するとしてよい。\ref{meas:fatou} と $(*)$ から
$$
(c+\delta)^{2}\mu(C_{\delta})\le\int\mathbf{1}_{C_{\delta}}|\varphi_{0}|^{2}d\mu\le\liminf_{j}\int|g_{j}|^{2}|\varphi_{0}|^{2}d\mu\le c^{2}\lim_{j}\int|g_{j}|^{2}d\mu=c^{2}\mu(C_{\delta}),
$$
よって $\mu(C_{\delta})=0$。$\delta=\frac1m$ について合併をとると $|\varphi_{0}|\le c$（$\mu$-a.e.）。$\varphi\defeq\varphi_{0}\mathbf{1}_{\{|\varphi_{0}|\le c\}}$ は $B_{b}([a,b])$ の元で $\sup|\varphi|\le c$、$\varphi=\varphi_{0}$（$\mu$-a.e.）。

**Step 4.** $S'$ と $M_{\varphi}$ は有界で、連続な $g$ の上で $S'g=g\varphi_{0}=g\varphi=M_{\varphi}g$。稠密性から $S'=M_{\varphi}$。1 から $S=UM_{\varphi}U^{-1}=\varphi(A)$。

$S_{1},S_{2}$ が $A$ と可換なら $S_{i}=\varphi_{i}(A)$ で、\ref{fa:borel-functional-calculus.2} から $S_{1}S_{2}=(\varphi_{1}\varphi_{2})(A)=S_{2}S_{1}$。

**3.** $A=I$ にはすべての行列が可換だが、$\begin{pmatrix}0&1\\0&0\end{pmatrix}$ と $\begin{pmatrix}0&0\\1&0\end{pmatrix}$ は可換でない（積は順に $\begin{pmatrix}1&0\\0&0\end{pmatrix}$, $\begin{pmatrix}0&0\\0&1\end{pmatrix}$）。よって 2 の結論は成り立たない。実際、多項式 $p$ について $p(I)x=p(1)x$ なので $\{p(I)x\}$ は高々 1 次元で、$\mathbb{C}^{2}$ で稠密にならない。

（2 は「巡回ベクトルをもつ自己共役作用素はスペクトルの重複度が 1」という事実の作用素論的な表現である。$L^{2}([0,1])$ 上の $t$ の掛け算では、定数関数 $1$ が巡回ベクトル（多項式は $C([0,1])$ で一様に稠密（\ref{top:weierstrass-approximation.1}）、$C([0,1])$ は $L^{2}$ で稠密（\ref{meas:cc-dense}））なので、それと可換な有界作用素はすべて有界関数の掛け算である。）
:::

## 非有界作用素 {#fa:sec-ub-exercises}

対応するページ：\ref{fa:page-unbounded-operators}

::: problem ★ 基本：ℝⁿ 上のラプラシアン {#fa:ex-ub-1}
$D(L)\defeq H^{2}(\mathbb{R}^{n})$, $Lu\defeq-\sum_{j=1}^{n}\partial_{j}^{2}u$（弱微分）とし、$\phi(\xi)\defeq4\pi^{2}|\xi|^{2}$ とおく。
1. $D(L)=\mathcal{F}^{-1}D(M_{\phi})$ で、$L=\mathcal{F}^{-1}M_{\phi}\mathcal{F}$ であることを示せ。
2. $L$ は自己共役で、$u\in D(L)$ について $\langle Lu,u\rangle=\|\nabla u\|_{2}^{2}\ge0$ であることを示せ。
3. $\sigma(L)=[0,\infty)$ で、$L$ は固有値をもたないことを示せ。
:::

::: solution
**1.** $u\in L^{2}(\mathbb{R}^{n})$ とする。$1+|\xi|^{2}\le1+\frac{\phi}{4\pi^{2}}$, $\phi\le4\pi^{2}(1+|\xi|^{2})$ で、$\mathcal{F}u\in L^{2}$ なので、$(1+|\xi|^{2})\mathcal{F}u\in L^{2}$ $\iff$ $\phi\mathcal{F}u\in L^{2}$。\ref{fa:sobolev-fourier.2}（$k=2$）から $u\in H^{2}$ $\iff$ $\mathcal{F}u\in D(M_{\phi})$。そのとき \ref{fa:sobolev-fourier.1}（$\alpha=2e_{j}$）から $\mathcal{F}(\partial_{j}^{2}u)=(2\pi i\xi_{j})^{2}\mathcal{F}u=-4\pi^{2}\xi_{j}^{2}\mathcal{F}u$ で、$j$ について足すと $\mathcal{F}(Lu)=\phi\mathcal{F}u$。

**2.** **自己共役.** \ref{fa:multiplication-operator} から $M_{\phi}$ は自己共役。$V\defeq\mathcal{F}$ はユニタリなので、$D(L)=V^{-1}D(M_{\phi})$ は稠密、$\langle Lu,v\rangle=\langle M_{\phi}Vu,Vv\rangle=\langle Vu,M_{\phi}Vv\rangle=\langle u,Lv\rangle$ で $L$ は対称、$R(L\pm i)=V^{-1}R(M_{\phi}\pm i)=L^{2}$。\ref{fa:self-adjointness-criterion.2}（(c)）から $L$ は自己共役。

**正値性.** \ref{fa:sobolev-fourier.1}（$\alpha=e_{j}$）と \ref{four:plancherel.2} から
$$
\langle Lu,u\rangle=\int\phi|\mathcal{F}u|^{2}d\xi=\sum_{j}\int|2\pi i\xi_{j}\mathcal{F}u|^{2}d\xi=\sum_{j}\|\mathcal{F}(\partial_{j}u)\|_{2}^{2}=\sum_{j}\|\partial_{j}u\|_{2}^{2}.
$$

**3.** $L-\lambda=V^{-1}(M_{\phi}-\lambda)V$ なので、$\sigma(L)=\sigma(M_{\phi})$ で固有値も同じ。

**$\lambda\notin[0,\infty)$.** $d\defeq\operatorname{dist}(\lambda,[0,\infty))>0$ とすると $|\phi-\lambda|\ge d$。$g\in L^{2}$ について $f\defeq\frac{g}{\phi-\lambda}$ は $|f|\le\frac{|g|}{d}$、$|\phi f|\le\bigl(1+\frac{|\lambda|}{d}\bigr)|g|$ なので $f\in D(M_{\phi})$ で $(M_{\phi}-\lambda)f=g$。$(M_{\phi}-\lambda)f=0$ なら $f=0$ a.e.。よって $\lambda\in\rho(M_{\phi})$。

**$\lambda\ge0$.** $4\pi^{2}|\xi_{0}|^{2}=\lambda$ となる $\xi_{0}$ をとり、$g_{k}\defeq\mathbf{1}_{B(\xi_{0},1/k)}$ とする。$g_{k}\in D(M_{\phi})$, $g_{k}\ne0$ で、$\eta_{k}\defeq\sup_{B(\xi_{0},1/k)}|\phi-\lambda|\to0$（$\phi$ の連続性）について $\|(M_{\phi}-\lambda)g_{k}\|\le\eta_{k}\|g_{k}\|$。$\lambda\in\rho(M_{\phi})$ なら $\|g_{k}\|\le\|(M_{\phi}-\lambda)^{-1}\|\eta_{k}\|g_{k}\|$ で、$\eta_{k}\to0$ と矛盾。よって $\lambda\in\sigma(M_{\phi})$。

**固有値.** $(\phi-\lambda)f=0$ a.e. なら、$f$ は $\{\phi=\lambda\}$ の外で $0$。この集合は空集合、$\{0\}$、または球面 $\{|\xi|=\frac{\sqrt\lambda}{2\pi}\}$ で、いずれも測度 $0$（記法の節）。よって $f=0$ a.e. で、固有値はない。

（$L$ のスペクトルは連続スペクトルだけからなる。有界な領域のディリクレ・ラプラシアン（\ref{fa:dirichlet-laplacian}）の離散的なスペクトルとは対照的である。）
:::

::: problem ★★ 標準：区間上の運動量作用素の自己共役拡張 {#fa:ex-ub-2}
$H=L^{2}((0,1))$、$\theta\in\mathbb{R}$ とし、
$$
D(T_{\theta})\defeq\{u\in H^{1}((0,1)):\tilde u(1)=e^{i\theta}\tilde u(0)\},\qquad T_{\theta}u\defeq-iu'
$$
とおく。
1. $T_{\theta}$ は自己共役であることを示せ。
2. $\sigma(T_{\theta})=\{\theta+2\pi k:k\in\mathbb{Z}\}$ で、各点は固有値、固有空間は $e^{i(\theta+2\pi k)x}$ で張られることを示せ。また $\lambda\notin\sigma(T_{\theta})$ についてレゾルベント $(T_{\theta}-\lambda)^{-1}$ を求めよ。
:::

::: solution
$T$, $T^{*}$ を \ref{fa:momentum-interval} の作用素とする（$D(T)=H_{0}^{1}$, $D(T^{*})=H^{1}$, ともに $-i\frac{d}{dx}$）。

**準備（部分積分）.** $u,v\in H^{1}((0,1))$ なら $\tilde u$, $\tilde v$ は $[0,1]$ 上絶対連続で導関数は a.e. で $u'$, $v'$（\ref{fa:sobolev-one-dimension}）。絶対連続関数の積は絶対連続で、a.e. で $(\tilde u\bar{\tilde v})'=u'\bar v+u\bar v'$ なので、\ref{meas:ftc-lebesgue} から $\int_{0}^{1}(u'\bar v+u\bar v')\,dx=\tilde u(1)\overline{\tilde v(1)}-\tilde u(0)\overline{\tilde v(0)}$。よって
$$
\langle-iu',v\rangle-\langle u,-iv'\rangle=-i\int_{0}^{1}(u'\bar v+u\bar v')\,dx=-i\bigl(\tilde u(1)\overline{\tilde v(1)}-\tilde u(0)\overline{\tilde v(0)}\bigr).\tag{$*$}
$$
$u\in D(T_{\theta})$ なら右辺は $-i\,\tilde u(0)\bigl(e^{i\theta}\overline{\tilde v(1)}-\overline{\tilde v(0)}\bigr)$。

**1.** **稠密・対称.** $D(T_{\theta})$ は部分空間で、$u\in H_{0}^{1}$ なら $\tilde u(0)=\tilde u(1)=0$（\ref{fa:ex-et-2}）なので $H_{0}^{1}\subset D(T_{\theta})$、とくに稠密で $T\subset T_{\theta}$。$u,v\in D(T_{\theta})$ なら $e^{i\theta}\overline{\tilde v(1)}=e^{i\theta}\overline{e^{i\theta}\tilde v(0)}=\overline{\tilde v(0)}$ なので $(*)$ は $0$、すなわち $T_{\theta}\subset T_{\theta}^{*}$。

**$T_{\theta}^{*}\subset T_{\theta}$.** $T\subset T_{\theta}$ と \ref{fa:adjoint-graph.2} から $T_{\theta}^{*}\subset T^{*}$。よって $v\in D(T_{\theta}^{*})$ なら $v\in H^{1}$, $T_{\theta}^{*}v=-iv'$ で、すべての $u\in D(T_{\theta})$ について $\langle-iu',v\rangle=\langle u,-iv'\rangle$、$(*)$ から $\tilde u(0)\bigl(e^{i\theta}\overline{\tilde v(1)}-\overline{\tilde v(0)}\bigr)=0$。$u(x)\defeq e^{i\theta x}$ は $C^{\infty}$ で $u(1)=e^{i\theta}u(0)$ なので $D(T_{\theta})$ に入り、$\tilde u(0)=1$。よって $\overline{\tilde v(0)}=e^{i\theta}\overline{\tilde v(1)}$、共役をとって $\tilde v(1)=e^{i\theta}\tilde v(0)$、$v\in D(T_{\theta})$。以上から $T_{\theta}=T_{\theta}^{*}$。

**2.** $\lambda\in\mathbb{C}$ とする。

**核.** $u\in D(T_{\theta})$, $-iu'=\lambda u$ なら、$w(x)\defeq e^{-i\lambda x}\tilde u(x)$ は絶対連続で a.e. で $w'=e^{-i\lambda x}(u'-i\lambda u)=0$ なので定数（\ref{meas:ftc-lebesgue}）、$\tilde u=ce^{i\lambda x}$。境界条件は $ce^{i\lambda}=e^{i\theta}c$。$e^{i\lambda}=e^{i\theta}$ $\iff$ $i(\lambda-\theta)\in2\pi i\mathbb{Z}$ $\iff$ $\lambda\in\theta+2\pi\mathbb{Z}$。よって $\lambda=\theta+2\pi k$ なら $\ker(T_{\theta}-\lambda)=\mathbb{C}e^{i\lambda x}\ne0$、それ以外では $T_{\theta}-\lambda$ は単射。

**全射性.** $\lambda\notin\theta+2\pi\mathbb{Z}$, $f\in L^{2}$ とし、$F\defeq\int_{0}^{1}e^{-i\lambda s}f(s)\,ds$,
$$
u(x)\defeq e^{i\lambda x}\Bigl(c+i\int_{0}^{x}e^{-i\lambda s}f(s)\,ds\Bigr),\qquad c\defeq\frac{ie^{i\lambda}F}{e^{i\theta}-e^{i\lambda}}
$$
とおく（$L^{2}\subset L^{1}$ なので積分は定まる）。括弧の中は絶対連続で導関数は a.e. で $ie^{-i\lambda x}f$ なので、$u$ は絶対連続で a.e. で $u'=i\lambda u+if\in L^{2}$。\ref{fa:sobolev-one-dimension} から $u\in H^{1}$, $\tilde u=u$, $-iu'-\lambda u=f$。さらに $u(1)=e^{i\lambda}(c+iF)$, $u(0)=c$ で、$c$ の定め方から $c(e^{i\theta}-e^{i\lambda})=ie^{i\lambda}F$、すなわち $e^{i\lambda}(c+iF)=e^{i\theta}c$。よって $u\in D(T_{\theta})$, $(T_{\theta}-\lambda)u=f$。

以上から $\lambda\notin\theta+2\pi\mathbb{Z}$ なら $\lambda\in\rho(T_{\theta})$ で $(T_{\theta}-\lambda)^{-1}f=u$（上の式）、$\lambda\in\theta+2\pi\mathbb{Z}$ なら $\lambda$ は固有値。$\sigma(T_{\theta})=\theta+2\pi\mathbb{Z}$。

（$T\subset T_{\theta}\subset T^{*}$ で、$\theta$ ごとに異なる自己共役拡張が得られ、スペクトルも $\theta$ とともに平行移動する。$\theta=0$ は周期境界条件で、固有関数 $e^{2\pi ikx}$ はフーリエ級数の基底である。）
:::

::: problem ★★★ 発展：ケーリー変換 {#fa:ex-ub-3}
1. $T$ を自己共役作用素とし、$U\defeq(T-i)(T+i)^{-1}$（\ref{fa:unbounded-selfadjoint-spectrum} から $(T+i)^{-1}$ は有界で $H$ 全体で定義される）とおく。$U$ はユニタリで、$1$ は $U$ の固有値でなく、$D(T)=R(1-U)$、$T(1-U)y=i(1+U)y$（$y\in H$）であることを示せ。
2. 逆に $U$ がユニタリで $\ker(1-U)=0$ なら、$D(T)\defeq R(1-U)$, $T(1-U)y\defeq i(1+U)y$ で定まる作用素 $T$ は自己共役で、そのケーリー変換 $(T-i)(T+i)^{-1}$ は $U$ であることを示せ。
3. $(X,\nu)$ 上の実数値の $\varphi$ について、$M_{\varphi}$ のケーリー変換は $\frac{\varphi-i}{\varphi+i}$ の掛け算であることを確かめよ。
:::

::: solution
**1.** **等長・全射.** $y\in H$ について $x\defeq(T+i)^{-1}y\in D(T)$ とすると $Uy=(T-i)x$。\ref{fa:self-adjointness-criterion.1} から $\|Uy\|^{2}=\|Tx\|^{2}+\|x\|^{2}=\|(T+i)x\|^{2}=\|y\|^{2}$ で $U$ は等長。\ref{fa:self-adjointness-criterion.2}（(c)）から $R(T-i)=H$ なので $U$ は全射。等長な全射は、分極恒等式から $\langle Uy,Uz\rangle=\langle y,z\rangle$、すなわち $U^{*}U=1$ で、$U$ が全単射なので $U^{*}=U^{-1}$、ユニタリ。

**$1\pm U$.** 同じ記号で $(1-U)y=(T+i)x-(T-i)x=2ix$, $(1+U)y=2Tx$。$(1-U)y=0$ なら $x=0$ で $y=(T+i)x=0$ なので $1$ は固有値でない。$y$ が $H$ を動くと $x=(T+i)^{-1}y$ は $D(T)$ 全体を動くので $R(1-U)=D(T)$。$x=\frac{1}{2i}(1-U)y$ について $Tx=\frac12(1+U)y$ なので $T(1-U)y=2iTx=i(1+U)y$。

**2.** $1-U$ は単射なので $T$ は well-defined で線形。

**稠密.** $z\perp R(1-U)$ なら $z\in\ker(1-U)^{*}=\ker(1-U^{*})$（\ref{fa:adjoint-graph.2} の有界な場合）。$U^{*}z=z$ に $U$ を施して $z=Uz$、仮定から $z=0$。よって $D(T)$ は稠密。

**対称.** $y,z\in H$ について、$\langle Uy,Uz\rangle=\langle y,z\rangle$ を使うと
$$
\langle T(1-U)y,(1-U)z\rangle=i\langle(1+U)y,(1-U)z\rangle=i\bigl(\langle Uy,z\rangle-\langle y,Uz\rangle\bigr),
$$
$$
\langle(1-U)y,T(1-U)z\rangle=\langle(1-U)y,i(1+U)z\rangle=-i\bigl(\langle y,Uz\rangle-\langle Uy,z\rangle\bigr)=i\bigl(\langle Uy,z\rangle-\langle y,Uz\rangle\bigr).
$$
両者は等しい。

**値域.** $(T+i)(1-U)y=i(1+U)y+i(1-U)y=2iy$, $(T-i)(1-U)y=i(1+U)y-i(1-U)y=2iUy$。$U$ は全射なので $R(T\pm i)=H$。\ref{fa:self-adjointness-criterion.2}（(c)）から $T$ は自己共役。さらに $(T+i)^{-1}(2iy)=(1-U)y$ なので $(T-i)(T+i)^{-1}(2iy)=2iUy$、すなわちケーリー変換は $U$。

**3.** \ref{fa:multiplication-operator} の証明から $(M_{\varphi}+i)^{-1}g=\frac{g}{\varphi+i}$。$\frac{g}{\varphi+i}\in D(M_{\varphi})$ なので $(M_{\varphi}-i)(M_{\varphi}+i)^{-1}g=\frac{\varphi-i}{\varphi+i}g$。$\bigl|\frac{\varphi-i}{\varphi+i}\bigr|=1$（$\varphi$ は実数）で、$\frac{\varphi-i}{\varphi+i}\ne1$（$-i\ne i$）なので、1 の結論（ユニタリで $1$ が固有値でない）と整合する。

（1・2 から、自己共役作用素と「$1$ を固有値にもたないユニタリ作用素」はケーリー変換で一対一に対応する。ユニタリ作用素のスペクトル定理を経由して非有界自己共役作用素のスペクトル定理を示す標準的な方法は、この対応に基づく。）
:::

## 非有界自己共役作用素のスペクトル定理 {#fa:sec-us-exercises}

対応するページ：\ref{fa:page-unbounded-spectral}

::: problem ★ 基本：レゾルベントの関数計算 {#fa:ex-us-1}
$T$ を自己共役作用素、$z,w\in\mathbb{C}\setminus\mathbb{R}$ とし、$R(z)\defeq(T-z)^{-1}$ とおく。
1. $R(z)-R(w)=(z-w)R(z)R(w)$（レゾルベント方程式）と $R(z)^{*}=R(\bar z)$ を示せ。
2. $r_{z}(t)\defeq\frac{1}{t-z}$ について $R(z)=r_{z}(T)$ を示せ。
3. $\|R(z)\|\le\frac{1}{|\operatorname{Im}z|}$ と、$y\to+\infty$ のときすべての $x$ で $iy\,(iy-T)^{-1}x\to x$ となることを示せ。
:::

::: solution
\ref{fa:unbounded-selfadjoint-spectrum} から $z,w\in\rho(T)$ で、$R(z)$, $R(w)$ は有界、$R(w)H=D(T)$。

**1.** $y\in H$ について $R(w)y\in D(T)$ なので、$R(z)(T-z)u=u$（$u\in D(T)$）と $(T-w)R(w)y=y$ から
$$
R(z)y-R(w)y=R(z)(T-w)R(w)y-R(z)(T-z)R(w)y=R(z)\bigl((T-w)-(T-z)\bigr)R(w)y=(z-w)R(z)R(w)y .
$$
$x=(T-z)u$, $y=(T-\bar z)v$（$u,v\in D(T)$）について、$T$ の自己共役性から $\langle R(z)x,y\rangle=\langle u,(T-\bar z)v\rangle=\langle Tu,v\rangle-z\langle u,v\rangle=\langle(T-z)u,v\rangle=\langle x,R(\bar z)y\rangle$。$T-z$, $T-\bar z$ は全射なので $R(z)^{*}=R(\bar z)$。

**2.** \ref{fa:unbounded-spectral-theorem} の $G$, $h$ について $r_{z}(T)=g(G)$, $g\defeq r_{z}\circ h$ である（$s=\pm1$ では $h(\pm1)=0$）。$|t-z|\ge|\operatorname{Im}z|$ なので $|g|\le\frac{1}{|\operatorname{Im}z|}$、$|hg|=\bigl|\frac{h}{h-z}\bigr|\le1+\frac{|z|}{|\operatorname{Im}z|}$ はともに有界。\ref{fa:unbounded-borel-calculus.2} から $g(G)H\subset D(h(G))=D(T)$ で $h(G)g(G)=(hg)(G)$。よって
$$
(T-z)g(G)=(hg)(G)-zg(G)=\bigl((h-z)g\bigr)(G)=1(G)=I .
$$
$T-z\colon D(T)\to H$ は全単射なので、右逆写像 $g(G)$ は逆写像に等しく、$r_{z}(T)=R(z)$。

**3.** \ref{fa:unbounded-spectral-theorem.3} から $\|R(z)\|=\|r_{z}(T)\|\le\sup_{t}\frac{1}{|t-z|}=\frac{1}{|\operatorname{Im}z|}$（\ref{fa:unbounded-selfadjoint-spectrum} と同じ評価）。$y>0$ について $f_{y}(t)\defeq\frac{iy}{iy-t}=-iy\,r_{iy}(t)$ は $|f_{y}(t)|=\frac{y}{\sqrt{y^{2}+t^{2}}}\le1$、各 $t$ で $f_{y}(t)\to1$（$y\to\infty$）。\ref{fa:unbounded-spectral-theorem.3} の有界な各点収束から、$f_{y}(T)=iy(iy-T)^{-1}$ は $1(T)=I$ に強収束する（列 $y_{k}\to\infty$ ごとに使えばよい）。

（1 は 2 と関数の等式 $\frac{1}{t-z}-\frac{1}{t-w}=\frac{z-w}{(t-z)(t-w)}$, $\overline{r_{z}}=r_{\bar z}$ からも従う。）
:::

::: problem ★★ 標準：ユニタリ同値と関数計算 {#fa:ex-us-2}
$\varphi\colon X\to\mathbb{R}$ を可測、$V\colon H\to L^{2}(\nu)$ をユニタリとし、$T\defeq V^{-1}M_{\varphi}V$（$D(T)\defeq V^{-1}D(M_{\varphi})$）とおく。
1. $T$ は自己共役で、有界ボレル関数 $f\colon\mathbb{R}\to\mathbb{C}$ について $f(T)=V^{-1}M_{f\circ\varphi}V$ であることを示せ。
2. \ref{fa:ex-ub-1} の $L$ について、$f(L)=\mathcal{F}^{-1}M_{f(4\pi^{2}|\xi|^{2})}\mathcal{F}$、$E_{L}(\{\lambda\})=0$（すべての $\lambda$）、$e^{isL}=\mathcal{F}^{-1}M_{e^{4\pi^{2}is|\xi|^{2}}}\mathcal{F}$ を確かめよ。
:::

::: solution
**1.** **自己共役.** \ref{fa:ex-ub-1.2} の解答と同じ議論（$D(T)$ は稠密、対称、$R(T\pm i)=V^{-1}R(M_{\varphi}\pm i)=H$）。

**Step 1（有界変換）.** \ref{fa:multiplication-operator} の証明から $(M_{\varphi}+i)^{-1}=M_{1/(\varphi+i)}$ なので、\ref{fa:selfadjoint-resolvents} の作用素は $R=V^{-1}M_{1/(\varphi+i)}V$, $R^{*}=V^{-1}M_{1/(\varphi-i)}V$, $K=V^{-1}M_{1/(1+\varphi^{2})}V$, $L_{T}\defeq\frac12(R+R^{*})=V^{-1}M_{\varphi/(1+\varphi^{2})}V$。$\psi\defeq\frac{\varphi}{\sqrt{1+\varphi^{2}}}$（$|\psi|<1$）とし $G'\defeq V^{-1}M_{\psi}V$ とおく。$G'$ は有界な自己共役作用素で $\|G'\|\le1$。$V^{-1}M_{(1+\varphi^{2})^{-1/2}}V$ は正で 2 乗が $K$ なので、\ref{fa:square-root.2} の一意性から $K^{1/2}$ に等しい。すると $G'K^{1/2}=V^{-1}M_{\varphi/(1+\varphi^{2})}V=L_{T}$、$G'$ は $K^{1/2}$ と可換、$1-G'^{2}=V^{-1}M_{1-\psi^{2}}V=K$。\ref{fa:bounded-transform} の一意性から $G=G'$。

**Step 2（$G$ の関数計算）.** $[a,b]\defeq[-1,1]\supset\sigma(G)$ とする。多項式 $p$ について $p(G)=V^{-1}M_{p\circ\psi}V$ で、連続な $g$ には一様近似 $\|M_{(g-p)\circ\psi}\|\le\sup|g-p|$ から $g(G)=V^{-1}M_{g\circ\psi}V$。$x,y\in H$ について $w\defeq Vx\,\overline{Vy}\in L^{1}(\nu)$ とし、$[-1,1]$ のボレル集合 $B$ について $\rho(B)\defeq\int_{X}\mathbf{1}_{B}(\psi)\,w\,d\nu$ とおく。$w$ の実部・虚部の正の部分と負の部分の $\psi$ による像測度の一次結合なので $\rho$ は複素測度で、有界ボレル関数 $g$ について $\int g\,d\rho=\int_{X}(g\circ\psi)w\,d\nu$（像測度の積分。\ref{prb:change-of-variables} と同じ証明）。連続な $g$ では $\int g\,d\mu_{x,y}=\langle g(G)x,y\rangle=\int_{X}(g\circ\psi)w\,d\nu=\int g\,d\rho$ なので、\ref{fa:riesz-markov-interval.2} から有界ボレル関数 $g$ でも等しく、
$$
\langle g(G)x,y\rangle=\int_{X}(g\circ\psi)\,Vx\,\overline{Vy}\,d\nu=\langle V^{-1}M_{g\circ\psi}Vx,y\rangle .
$$

**Step 3.** $1-\psi^{2}=\frac{1}{1+\varphi^{2}}$ なので $h(\psi)=\frac{\psi}{\sqrt{1-\psi^{2}}}=\varphi$。Step 2 を $g=f\circ h$ に使うと $f(T)=(f\circ h)(G)=V^{-1}M_{f\circ h\circ\psi}V=V^{-1}M_{f\circ\varphi}V$。

**2.** \ref{fa:ex-ub-1.1} から $L=\mathcal{F}^{-1}M_{\phi}\mathcal{F}$, $\phi=4\pi^{2}|\xi|^{2}$ なので、1（$V=\mathcal{F}$）から $f(L)=\mathcal{F}^{-1}M_{f\circ\phi}\mathcal{F}$。$f=\mathbf{1}_{\{\lambda\}}$ では $f\circ\phi=\mathbf{1}_{\{\phi=\lambda\}}$ は測度 $0$ の集合（空集合、$\{0\}$ または球面）の指示関数なので $M_{f\circ\phi}=0$、$E_{L}(\{\lambda\})=0$。$f(t)=e^{ist}$ とすれば $e^{isL}$ の式。

（$E_{L}((-\infty,0))=0$ も同様で、\ref{fa:ex-ub-1.3} の $\sigma(L)=[0,\infty)$、固有値がないことと整合する。$e^{-isL}$ は自由粒子のシュレディンガー方程式の時間発展で、各周波数 $\xi$ の成分の位相を $e^{-4\pi^{2}is|\xi|^{2}}$ だけ回す。）
:::

::: problem ★★★ 発展：スペクトルと射影値測度の台 {#fa:ex-us-3}
$T$ を自己共役作用素とし、$\lambda\in\mathbb{R}$, $\varepsilon>0$ について $I_{\varepsilon}(\lambda)\defeq(\lambda-\varepsilon,\lambda+\varepsilon)$ とおく。
1. $x\in D(T)$, $\lambda\in\mathbb{R}$ について $\|(T-\lambda)x\|^{2}=\int(t-\lambda)^{2}d\mu_{x}^{T}(t)$ を示し、$\ker(T-\lambda)=R(E_{T}(\{\lambda\}))$ を示せ。
2. $\sigma(T)=\{\lambda\in\mathbb{R}:\text{すべての }\varepsilon>0\text{ で }E_{T}(I_{\varepsilon}(\lambda))\ne0\}$ を示せ。
3. $\sigma(T)$ の孤立点は固有値であることを示せ。
:::

::: solution
$E_{T}$ は射影値測度で $E_{T}(B\cap C)=E_{T}(B)E_{T}(C)$、$E_{T}(\mathbb{R})=I$（\ref{fa:unbounded-spectral-theorem.2}）。とくに $\mu_{x}^{T}(B)=\|E_{T}(B)x\|^{2}$, $\mu_{x}^{T}(\mathbb{R})=\|x\|^{2}$ で、\ref{fa:ex-sm2-1} の準備と同じ計算から $x=E_{T}(C)y$ なら $\mu_{x}^{T}=\mathbf{1}_{C}\mu_{y}^{T}$。

**1.** \ref{fa:unbounded-borel-calculus.1}、$T=h(G)$ と像測度の書き直し（\ref{fa:unbounded-spectral-theorem} の証明の 2）から $\|Tx\|^{2}=\int|h|^{2}d\mu_{x}=\int t^{2}d\mu_{x}^{T}$。$\langle Tx,x\rangle=\int t\,d\mu_{x}^{T}$（\ref{fa:unbounded-spectral-theorem.2}、実数）なので
$$
\|(T-\lambda)x\|^{2}=\|Tx\|^{2}-2\lambda\langle Tx,x\rangle+\lambda^{2}\|x\|^{2}=\int\bigl(t^{2}-2\lambda t+\lambda^{2}\bigr)d\mu_{x}^{T}=\int(t-\lambda)^{2}d\mu_{x}^{T}.
$$
（$\int|t|\,d\mu_{x}^{T}\le(\int t^{2}d\mu_{x}^{T})^{1/2}\|x\|<\infty$ なので各項は有限。）

$x\in\ker(T-\lambda)$ なら右辺が $0$ なので $\mu_{x}^{T}(\mathbb{R}\setminus\{\lambda\})=0$、すなわち $E_{T}(\mathbb{R}\setminus\{\lambda\})x=0$ で $x=E_{T}(\{\lambda\})x$。逆に $x=E_{T}(\{\lambda\})y$ なら $\mu_{x}^{T}=\mathbf{1}_{\{\lambda\}}\mu_{y}^{T}$ なので $\int t^{2}d\mu_{x}^{T}=\lambda^{2}\|x\|^{2}<\infty$、$x\in D(T)$（\ref{fa:unbounded-spectral-theorem.2}）で、上の式から $(T-\lambda)x=0$。

**2.** **（$E_{T}(I_{\varepsilon}(\lambda))=0$ なら $\lambda\in\rho(T)$）** $I\defeq I_{\varepsilon}(\lambda)$、$f(t)\defeq\frac{\mathbf{1}_{\mathbb{R}\setminus I}(t)}{t-\lambda}$（$|f|\le\frac1\varepsilon$）、$g\defeq f\circ h$ とする（$s=\pm1$ では $h(\pm1)=0$ での値）。$hg$ は $\{h\notin I\}$ の上で $\frac{h}{h-\lambda}$ で、$|\frac{h}{h-\lambda}|\le1+\frac{|\lambda|}{\varepsilon}$ なので有界。\ref{fa:unbounded-borel-calculus.2} から $g(G)H\subset D(T)$ で
$$
(T-\lambda)f(T)=(hg)(G)-\lambda g(G)=\bigl((h-\lambda)g\bigr)(G)=(\mathbf{1}_{\mathbb{R}\setminus I}\circ h)(G)=E_{T}(\mathbb{R}\setminus I)=I-E_{T}(I)=I .
$$
（$\{\pm1\}$ の上だけで異なる有界ボレル関数 $g_{1},g_{2}$ は、$\|(g_{1}-g_{2})(G)x\|^{2}=\int|g_{1}-g_{2}|^{2}d\mu_{x}\le\sup|g_{1}-g_{2}|^{2}\,\|E_{G}(\{\pm1\})x\|^{2}=0$ から同じ作用素を与える。）よって $T-\lambda$ は全射。単射性：$(T-\lambda)x=0$ なら 1 から $x=E_{T}(\{\lambda\})x=E_{T}(\{\lambda\})E_{T}(I)x=0$。よって $\lambda\in\rho(T)$。

**（$\lambda\in\rho(T)$ ならある $\varepsilon$ で $E_{T}(I_{\varepsilon}(\lambda))=0$）** $c\defeq\|(T-\lambda)^{-1}\|$ とし、$\varepsilon>0$ を $c\varepsilon<1$ となるようにとる。$y\in H$, $x\defeq E_{T}(I_{\varepsilon}(\lambda))y$ とすると $\mu_{x}^{T}=\mathbf{1}_{I_{\varepsilon}(\lambda)}\mu_{y}^{T}$ なので $\int t^{2}d\mu_{x}^{T}\le(|\lambda|+\varepsilon)^{2}\|y\|^{2}$、$x\in D(T)$、1 から
$$
\|(T-\lambda)x\|^{2}=\int_{I_{\varepsilon}(\lambda)}(t-\lambda)^{2}d\mu_{x}^{T}\le\varepsilon^{2}\|x\|^{2}.
$$
よって $\|x\|=\|(T-\lambda)^{-1}(T-\lambda)x\|\le c\varepsilon\|x\|$ で、$c\varepsilon<1$ から $x=0$。$y$ は任意なので $E_{T}(I_{\varepsilon}(\lambda))=0$。

二つを合わせて主張が従う（$\sigma(T)\subset\mathbb{R}$ は \ref{fa:unbounded-selfadjoint-spectrum}）。

**3.** **Step 1（スペクトルと交わらない開集合）.** $O\subset\mathbb{R}$ を開集合で $O\cap\sigma(T)=\emptyset$ とする。$O$ に含まれる有理数の端点をもつ閉区間 $J=[p,q]$ をとる。$\mathcal{U}\defeq\{I_{\varepsilon}(\mu):\varepsilon>0,\ E_{T}(I_{\varepsilon}(\mu))=0\}$ は 2 から $J$ を覆う開区間の族で、$J$ はコンパクト（\ref{top:heine-borel}）なので有限個 $I^{(1)},\dots,I^{(N)}$ で覆え、$\mu_{x}^{T}(J)\le\sum_{j}\mu_{x}^{T}(I^{(j)})=\sum_{j}\|E_{T}(I^{(j)})x\|^{2}=0$。$O$ はそのような $J$ の可算和なので $\mu_{x}^{T}(O)=0$（すべての $x$）、すなわち $E_{T}(O)=0$。

**Step 2.** $\lambda$ を $\sigma(T)$ の孤立点とし、$\varepsilon$ を $I_{\varepsilon}(\lambda)\cap\sigma(T)=\{\lambda\}$ となるようにとる。Step 1（$O=I_{\varepsilon}(\lambda)\setminus\{\lambda\}$）から $E_{T}(I_{\varepsilon}(\lambda))=E_{T}(\{\lambda\})+E_{T}(O)=E_{T}(\{\lambda\})$。2 から左辺は $0$ でないので $E_{T}(\{\lambda\})\ne0$ で、1 から $\ker(T-\lambda)\ne0$。

（\ref{fa:ex-ub-2} の $T_{\theta}$ ではスペクトルはすべて孤立点で、いずれも固有値だった。\ref{fa:ex-ub-1} の $L$ ではスペクトル $[0,\infty)$ に孤立点はなく、\ref{fa:ex-us-2.2} のとおり $E_{L}(\{\lambda\})=0$ である。）
:::

## 作用素半群 {#fa:sec-sg-exercises}

対応するページ：\ref{fa:page-semigroups}

::: problem ★ 基本：掛け算作用素の半群 {#fa:ex-sg-1}
$\varphi\colon X\to\mathbb{C}$ を可測とし、定数 $\omega\ge0$ で $\operatorname{Re}\varphi\le\omega$（a.e.）とする。$t\ge0$ について $T(t)f\defeq e^{t\varphi}f$（$f\in L^{2}(\nu)$）とおく。
1. $T$ は強連続半群で $\|T(t)\|\le e^{\omega t}$ であることを示せ。とくに $\operatorname{Re}\varphi\le0$ なら縮小半群である。
2. $T$ の生成作用素は $M_{\varphi}$（定義域 $\{f:\varphi f\in L^{2}\}$）であることを示せ。
:::

::: solution
**補題.** $z\in\mathbb{C}$, $\operatorname{Re}z\le\omega$, $0<t\le1$ なら $\bigl|\frac{e^{tz}-1}{t}\bigr|\le e^{\omega}|z|$。実際、$e^{tz}-1=\int_{0}^{t}ze^{sz}ds$ で $|e^{sz}|=e^{s\operatorname{Re}z}\le e^{\omega}$（$0\le s\le1$, $\omega\ge0$）。

**1.** $|e^{t\varphi}|=e^{t\operatorname{Re}\varphi}\le e^{\omega t}$（a.e.）なので $T(t)\in B(L^{2})$, $\|T(t)\|\le e^{\omega t}$。$T(0)=I$、$e^{(s+t)\varphi}=e^{s\varphi}e^{t\varphi}$ から $T(s+t)=T(s)T(t)$。$0<t\le1$ で $|e^{t\varphi}f-f|^{2}\le(e^{\omega}+1)^{2}|f|^{2}$（可積分）で、各点で $e^{t\varphi}f-f\to0$ なので、\ref{meas:dominated-convergence} から $\|T(t)f-f\|_{2}\to0$。

**2.** $A$ を生成作用素とする。

**$D(M_{\varphi})\subset D(A)$.** $\varphi f\in L^{2}$ なら、補題から $0<t\le1$ で
$$
\Bigl|\Bigl(\frac{e^{t\varphi}-1}{t}-\varphi\Bigr)f\Bigr|^{2}\le(e^{\omega}+1)^{2}|\varphi f|^{2}
$$
は可積分で、各点で $0$ に収束する。優収束定理から $\frac{T(t)f-f}{t}\to\varphi f$（$L^{2}$）で、$f\in D(A)$, $Af=\varphi f$。

**$D(A)\subset D(M_{\varphi})$.** $f\in D(A)$, $g\defeq Af$ とする。$t_{k}\defeq\frac1k$ について $\frac{e^{t_{k}\varphi}-1}{t_{k}}f\to g$（$L^{2}$）なので、\ref{meas:riesz-fischer} から部分列が a.e. で $g$ に収束する。一方、各点で $\frac{e^{t_{k}\varphi}-1}{t_{k}}f\to\varphi f$ なので $g=\varphi f$ a.e.、$\varphi f\in L^{2}$。以上から $A=M_{\varphi}$。

（$\varphi$ が実数値で $\varphi\le0$ なら $M_{\varphi}$ は自己共役（\ref{fa:multiplication-operator}）かつ散逸的で、\ref{fa:lumer-phillips} の状況の典型例である。）
:::

::: problem ★★ 標準：ℝⁿ 上の熱半群 {#fa:ex-sg-2}
$t\ge0$ について $P(t)\defeq\mathcal{F}^{-1}M_{e^{-4\pi^{2}t|\xi|^{2}}}\mathcal{F}$ を $L^{2}(\mathbb{R}^{n})$ 上で考え、$\Delta\defeq-L$（$L$ は \ref{fa:ex-ub-1} の作用素、$D(\Delta)=H^{2}(\mathbb{R}^{n})$）とする。
1. $P$ は縮小半群で、生成作用素は $\Delta$ であることを示せ。
2. $t>0$ について、$\Phi_{t}(x)\defeq(4\pi t)^{-n/2}e^{-|x|^{2}/(4t)}$ とすると $P(t)f=\Phi_{t}*f$（$f\in L^{2}$）であることを示せ。
3. $t>0$, $f\in L^{2}$ なら、すべての $k$ で $P(t)f\in H^{k}(\mathbb{R}^{n})$ であることを示せ。また $u_{0}\in H^{2}$ なら $u(t)\defeq P(t)u_{0}$ は $[0,\infty)$ 上で微分可能で $u'(t)=\Delta u(t)$ を満たすことを、\ref{fa:semigroup-basic} を使わずに示せ。
:::

::: solution
$\phi\defeq4\pi^{2}|\xi|^{2}$ とする。

**1.** \ref{fa:ex-sg-1}（$X=\mathbb{R}^{n}$, $\varphi=-\phi\le0$, $\omega=0$）から、$S(t)\defeq M_{e^{-t\phi}}$ は縮小半群で生成作用素は $M_{-\phi}$。$\mathcal{F}$ はユニタリなので、$P(t)=\mathcal{F}^{-1}S(t)\mathcal{F}$ は半群の性質、$\|P(t)\|=\|S(t)\|\le1$、$\|P(t)f-f\|=\|S(t)\mathcal{F}f-\mathcal{F}f\|\to0$ を満たす。また $\frac{P(t)f-f}{t}=\mathcal{F}^{-1}\frac{S(t)\mathcal{F}f-\mathcal{F}f}{t}$ が収束することと $\mathcal{F}f\in D(M_{\phi})$ は同値で、極限は $\mathcal{F}^{-1}M_{-\phi}\mathcal{F}f$。\ref{fa:ex-ub-1.1} から、生成作用素の定義域は $H^{2}$ で、生成作用素は $-L=\Delta$。

**2.** **Step 1（核のフーリエ変換）.** \ref{four:gaussian-transform} で $a\defeq\frac{1}{4\pi t}$ とすると $e^{-\pi a|x|^{2}}=e^{-|x|^{2}/(4t)}$ で
$$
\hat\Phi_{t}(\xi)=(4\pi t)^{-n/2}a^{-n/2}e^{-\pi|\xi|^{2}/a}=e^{-4\pi^{2}t|\xi|^{2}} .
$$
$\Phi_{t}\ge0$ は可積分で $\|\Phi_{t}\|_{1}=\hat\Phi_{t}(0)=1$。

**Step 2（$L^{1}\cap L^{2}$ の上）.** $f\in L^{1}\cap L^{2}$ なら \ref{four:convolution-rd.1}（$p=1,2$）から $\Phi_{t}*f\in L^{1}\cap L^{2}$ で、\ref{four:convolution-rd.2} から $\widehat{\Phi_{t}*f}=\hat\Phi_{t}\hat f$。$L^{1}\cap L^{2}$ の上で $\mathcal{F}$ は $\hat{\ }$ に一致する（\ref{four:plancherel.1}）ので $\mathcal{F}(\Phi_{t}*f)=e^{-t\phi}\mathcal{F}f=\mathcal{F}P(t)f$、すなわち $\Phi_{t}*f=P(t)f$。

**Step 3（$L^{2}$ 全体）.** $f\mapsto\Phi_{t}*f$ は $\|\Phi_{t}*f\|_{2}\le\|\Phi_{t}\|_{1}\|f\|_{2}=\|f\|_{2}$（\ref{four:convolution-rd.1}）なので $L^{2}$ で連続、$P(t)$ も有界。$L^{1}\cap L^{2}$ は $L^{2}$ で稠密（$C_{c}$ を含む、\ref{meas:cc-dense}）なので、両者は $L^{2}$ 全体で一致する。

**3.** **平滑化.** $k\ge0$ について $c_{k,t}\defeq\sup_{r\ge0}(1+r^{2})^{k/2}e^{-4\pi^{2}tr^{2}}<\infty$（指数関数は多項式より速く減衰する）なので、$(1+|\xi|^{2})^{k/2}\mathcal{F}P(t)f=(1+|\xi|^{2})^{k/2}e^{-t\phi}\mathcal{F}f$ は $L^{2}$ に入り（ノルム $\le c_{k,t}\|f\|_{2}$）、\ref{fa:sobolev-fourier.2} から $P(t)f\in H^{k}$。

**微分方程式.** $t\ge0$, $h\ne0$, $t+h\ge0$ とする。$s\ge0$ で $\frac{d}{ds}e^{-s\phi}=-\phi e^{-s\phi}$, $|\phi e^{-s\phi}|\le\phi$ なので、平均値の定理から $\bigl|\frac{e^{-(t+h)\phi}-e^{-t\phi}}{h}\bigr|\le\phi$。よって
$$
\Bigl|\Bigl(\frac{e^{-(t+h)\phi}-e^{-t\phi}}{h}+\phi e^{-t\phi}\Bigr)\mathcal{F}u_{0}\Bigr|^{2}\le4\phi^{2}|\mathcal{F}u_{0}|^{2}
$$
で、$u_{0}\in H^{2}$ から右辺は可積分（\ref{fa:ex-ub-1.1}）、左辺は各点で $h\to0$ のとき $0$ に収束する。優収束定理と $\mathcal{F}$ のユニタリ性から $\frac{u(t+h)-u(t)}{h}\to\mathcal{F}^{-1}(-\phi e^{-t\phi}\mathcal{F}u_{0})$。$e^{-t\phi}\mathcal{F}u_{0}\in D(M_{\phi})$ なので、これは $\Delta P(t)u_{0}=\Delta u(t)$ に等しい。

（$\Phi_{t}(x)=(\sqrt t)^{-n}\Phi_{1}(x/\sqrt t)$ なので、$t\to0$ での $\Phi_{t}*f\to f$ は \ref{four:approximate-identity-rd.1} の総和核の収束でもある。ここでは $P(t)$ の強連続性として得られた。）
:::

::: problem ★★★ 発展：一様連続な半群 {#fa:ex-sg-3}
$X$ をバナッハ空間とする。
1. $A\in B(X)$ について $e^{tA}\defeq\sum_{k\ge0}\frac{t^{k}A^{k}}{k!}$ は強連続半群で、生成作用素は $A$（$D(A)=X$）、$\|e^{tA}-I\|\to0$（$t\to0+$）であることを示せ。また、生成作用素が $A$ の強連続半群は $e^{tA}$ に限ることを示せ。
2. 逆に、強連続半群 $T$ が $\|T(t)-I\|\to0$（$t\to0+$）を満たすなら、生成作用素 $A$ は $D(A)=X$ で有界、$T(t)=e^{tA}$ であることを示せ。
3. \ref{fa:ex-sg-1} の半群が 2 の条件を満たすことと、$\varphi$ が本質的に有界であることは同値であることを示せ。とくに \ref{fa:ex-sg-2} の熱半群は $\|P(t)-I\|\to0$ を満たさない。
:::

::: solution
**1.** $\|A^{k}\|\le\|A\|^{k}$ なので級数は $B(X)$ で絶対収束する（\ref{fa:operator-space-complete}）。$A$ のべきどうしは可換なので、絶対収束する級数のコーシー積（数の場合と同じ証明）と二項定理から
$$
e^{sA}e^{tA}=\sum_{m\ge0}\sum_{j+k=m}\frac{s^{j}t^{k}}{j!\,k!}A^{m}=\sum_{m\ge0}\frac{(s+t)^{m}}{m!}A^{m}=e^{(s+t)A}.
$$
$e^{0A}=I$。$\|e^{tA}-I\|\le\sum_{k\ge1}\frac{t^{k}\|A\|^{k}}{k!}=e^{t\|A\|}-1\to0$ なので強連続でもある。さらに
$$
\Bigl\|\frac{e^{tA}-I}{t}-A\Bigr\|\le\frac1t\sum_{k\ge2}\frac{t^{k}\|A\|^{k}}{k!}=\frac{e^{t\|A\|}-1-t\|A\|}{t}\to0,
$$
よってすべての $x$ で $\frac{e^{tA}x-x}{t}\to Ax$、生成作用素は $D=X$ 上の $A$。一意性は \ref{fa:stone-theorem} の証明の Step 3（同じ生成作用素をもつ二つの強連続半群は等しい）。

**2.** **Step 1（$[0,\rho]$ 上の評価）.** $\rho>0$ を $q\defeq\sup_{0\le s\le\rho}\|T(s)-I\|<1$ となるようにとる。$0\le s\le\rho$ で $\|T(s)\|\le1+q<2$。$x\in X$ について $s\mapsto T(s)x$ は $[0,\rho]$ 上連続：右からは $\|T(s+h)x-T(s)x\|\le2\|T(h)x-x\|$、左からは $\|T(s-h)x-T(s)x\|=\|T(s-h)(x-T(h)x)\|\le2\|x-T(h)x\|$。

**Step 2（$V$ は可逆）.** $Vx\defeq\int_{0}^{\rho}T(s)x\,ds$ とおくと $V$ は線形で、
$$
\Bigl\|\frac1\rho Vx-x\Bigr\|=\Bigl\|\frac1\rho\int_{0}^{\rho}(T(s)x-x)\,ds\Bigr\|\le q\|x\| .
$$
よって $\|I-\frac1\rho V\|\le q<1$ で、\ref{fa:neumann-series} から $\frac1\rho V$、したがって $V$ は可逆（$V^{-1}\in B(X)$）。

**Step 3.** \ref{fa:semigroup-basic.2}（その証明は $s\mapsto T(s)x$ の連続性だけを使い、Step 1 でそれは確かめた）から、すべての $x$ で $Vx\in D(A)$, $AVx=T(\rho)x-x$。$V$ は全射なので $D(A)=X$ で、$A=(T(\rho)-I)V^{-1}\in B(X)$。1 の一意性から $T(t)=e^{tA}$。

**3.** **（⇐）** $|\varphi|\le C$（a.e.）なら $M_{\varphi}\in B(L^{2})$ で、\ref{fa:ex-sg-1.2} から生成作用素は $M_{\varphi}$、1 から $T(t)=e^{tM_{\varphi}}$ は $\|T(t)-I\|\to0$ を満たす。

**（⇒）** 2 から生成作用素 $M_{\varphi}$（\ref{fa:ex-sg-1.2}）は $D(M_{\varphi})=L^{2}$ で有界、$C\defeq\|M_{\varphi}\|$。$X$ の可測集合の増加列 $X_{m}$ で $\nu(X_{m})<\infty$, $\bigcup X_{m}=X$ となるものを固定し、$\delta>0$, $F_{m}\defeq\{|\varphi|>C+\delta\}\cap X_{m}$ とする。$f\defeq\mathbf{1}_{F_{m}}\in L^{2}$ について
$$
(C+\delta)^{2}\nu(F_{m})\le\int|\varphi|^{2}\mathbf{1}_{F_{m}}d\nu=\|M_{\varphi}f\|^{2}\le C^{2}\nu(F_{m})
$$
なので $\nu(F_{m})=0$。$m$ と $\delta=\frac1j$ について合併をとって $|\varphi|\le C$（a.e.）。

**熱半群.** $\mathcal{F}$ はユニタリなので、\ref{fa:ex-sg-2} の $P(t)$ について $\|P(t)-I\|=\|M_{e^{-t\phi}}-I\|$（$\phi=4\pi^{2}|\xi|^{2}$）。$\phi$ は本質的に有界でないので、いま示したことから $\|P(t)-I\|\to0$ とはならない。実際 $t>0$ で $\|P(t)-I\|=1$：$0\le1-e^{-t\phi}\le1$ から $\le1$。$0<\eta<1$ について $\{1-e^{-t\phi}>1-\eta\}$ は球の外側 $\{|\xi|>R\}$（$R$ は $\eta$, $t$ で決まる）で、そこに含まれる球 $B$ の指示関数 $f$ について $\|(M_{e^{-t\phi}}-I)f\|\ge(1-\eta)\|f\|$。

（\ref{fa:ex-sg-3.1} の一意性と \ref{fa:semigroup-basic} を通じて、この問題では従属選択公理を使う。ラプラシアンのような非有界な作用素が生成する半群は、強連続だがノルムについては連続でない。）
:::
