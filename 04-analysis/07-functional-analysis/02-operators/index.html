# 作用素とスペクトル（Operators and Spectra）

バナッハ環とノイマン級数、スペクトルは空でないコンパクト集合、スペクトル半径の公式、コンパクト作用素と共役作用素、リース–シャウダー理論（フレドホルムの二者択一）、自己共役コンパクト作用素のスペクトル定理と積分作用素への応用。

<p class="mn-msc">MSC2020: 46H05, 47A10, 47B07, 47A53, 47B15</p>
