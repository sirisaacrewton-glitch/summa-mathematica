# コンパクト作用素 {#fa:page-compact-operators keywords="compact operators, relatively compact image of the unit ball, compact operators form a closed two-sided ideal, finite rank operators and their limits, integral operators with continuous kernels are compact (Arzela-Ascoli), Riesz-Schauder theory: finite dimensional kernels, closed range, injective implies surjective, Fredholm alternative, spectrum of a compact operator: nonzero points are eigenvalues accumulating only at 0"}

無限次元の作用素の中で、有限次元の線形代数に最も近い振る舞いをするのが**コンパクト作用素**（単位球をコンパクト集合の中に写す作用素）である。このページでは、$T$ がコンパクトで $\lambda\neq0$ なら、$\lambda-T$ について「単射なら全射」という有限次元と同じ現象が起こること（**フレドホルムの二者択一**）を示し、コンパクト作用素のスペクトルが $0$ 以外では固有値だけからなり、$0$ にしか集積しないことを導く（**リース–シャウダー理論**）。道具はリースの補題（\ref{fa:riesz-lemma}）とコンパクト性だけである。応用として、連続な核をもつ積分方程式 $\lambda f-\int k(x,t)f(t)\,dt=g$ の可解性を論じる。

## 記法と定義の確認 {#fa:sec-co-notation}

::: notation
- $X$, $Y$ は複素（または実）バナッハ空間。有界作用素・作用素の空間の完備性・有限次元の性質・リースの補題・単位球のコンパクト性・有界逆写像定理・スペクトルは \ref{fa:bounded-operator}, \ref{fa:operator-space-complete}, \ref{fa:finite-dim-norms-equivalent}, \ref{fa:riesz-lemma}, \ref{fa:compact-unit-ball}, \ref{fa:bounded-inverse}, \ref{fa:spectrum}。
- 距離空間のコンパクト性（点列コンパクト ⇔ 完備かつ全有界）、全有界、アスコリ–アルツェラの定理は \ref{top:compact-metric-equivalents}, \ref{top:totally-bounded}, \ref{top:ascoli-classical}。
- $B_{X}$ は $X$ の閉単位球。$\ker$, $\operatorname{im}$ は核と像。
- **選択公理**：点列の選び出し（従属選択公理）で使う。
:::

## コンパクト作用素 {#fa:sec-co-compact}

::: definition コンパクト作用素 {#fa:compact-operator keywords="compact operator: the image of the unit ball is relatively compact; equivalently bounded sequences have images with convergent subsequences; finite rank operators" index="コンパクト作用素|こんぱくとさようそ, 有限階数作用素|ゆうげんかいすうさようそ"}
線形写像 $T\colon X\to Y$ が、$T(B_{X})$ の閉包がコンパクトとなるとき、$T$ はコンパクトであるという（**コンパクト作用素**）。距離空間のコンパクト性（\ref{top:compact-metric-equivalents}）から、これは「有界列 $(x_{n})$ について $(Tx_{n})$ が収束する部分列をもつ」ことと同値。コンパクト作用素は有界（像の有界性）。$\dim\operatorname{im}T<\infty$ の有界作用素を**有限階数**という。
:::

::: proposition コンパクト作用素の空間 {#fa:compact-ideal keywords="finite rank bounded operators are compact; compact operators form a closed subspace of B(X,Y); compositions with bounded operators are compact; norm limits of finite rank operators are compact" index="コンパクト作用素の性質|こんぱくとさようそのせいしつ"}
1. 有界な有限階数作用素はコンパクト。
2. コンパクト作用素の全体 $K(X,Y)$ は $B(X,Y)$ の閉部分空間。
3. $T$ がコンパクトで $S$, $R$ が有界なら $STR$ はコンパクト。
4. 有限階数作用素のノルム極限はコンパクト。
:::

::: proof
**1.** $T(B_{X})$ は有限次元空間 $\operatorname{im}T$ の有界集合で、その閉包はコンパクト（\ref{fa:finite-dim-norms-equivalent.2}）。

**2.** 部分空間：$(S+T)x_{n}$ は、まず $Sx_{n}$ の収束部分列、その中で $Tx_{n}$ の収束部分列をとればよい。閉：$T_{n}\to T$（$T_{n}$ はコンパクト）とし、$T(B_{X})$ が全有界であることを示せば、$Y$ の完備性から閉包はコンパクト（\ref{top:compact-metric-equivalents}）。$\varepsilon>0$ について $\|T_{n}-T\|<\varepsilon/3$ をとり、$T_{n}(B_{X})$ の有限な $\varepsilon/3$ 網 $y_{1},\dots,y_{m}$ をとると、$x\in B_{X}$ について $\|T_{n}x-y_{i}\|<\varepsilon/3$ となる $i$ があり $\|Tx-y_{i}\|<2\varepsilon/3$。

**3.** $R$ は有界列を有界列に、$S$ は収束列を収束列に写す。

**4.** 1 と 2。
:::

::: example 連続核の積分作用素 {#fa:integral-operator-compact keywords="the integral operator with a continuous kernel on C([0,1]) is compact by the Arzela-Ascoli theorem" index="積分作用素のコンパクト性|せきぶんさようそのこんぱくとせい"}
$k\colon[0,1]^{2}\to\mathbb{C}$ が連続なら、$(Kf)(x)\defeq\int_{0}^{1}k(x,t)f(t)\,dt$ は $C([0,1])$（$\|\cdot\|_{\infty}$）上のコンパクト作用素。
:::

::: proof
$k$ は一様連続なので、$\varepsilon>0$ について $|x-x'|<\delta\Rightarrow|k(x,t)-k(x',t)|<\varepsilon$（すべての $t$）。$\|f\|_{\infty}\le1$ なら $|Kf(x)-Kf(x')|\le\varepsilon$ で、$K(B)$ は同等連続、$|Kf(x)|\le\max|k|$ で一様有界。実部と虚部に \ref{top:ascoli-classical} を使えば、$K(B)$ の閉包はコンパクト（$C([0,1])$ は完備で、相対コンパクト性はアスコリの定理の結論）。$Kf$ が連続であることも同じ評価から。
:::

## リース–シャウダー理論 {#fa:sec-co-riesz-schauder}

::: theorem リース–シャウダーの定理 {#fa:riesz-schauder keywords="Riesz-Schauder theory: for T compact and lambda nonzero, ker(lambda - T) is finite dimensional, the range of lambda - T is closed, and lambda - T is injective iff surjective" index="リース–シャウダーの定理|りーすしゃうだーのていり"}
$T\in K(X)\defeq K(X,X)$、$\lambda\ne0$、$S\defeq\lambda-T$ とする。
1. $N\defeq\ker S$ は有限次元。
2. 定数 $c>0$ で $\|Sx\|\ge c\operatorname{dist}(x,N)$（すべての $x$）となるものがあり、$\operatorname{im}S$ は閉。
3. $S$ が単射なら全射。
:::

::: proof
**1.** $x\in N$ なら $x=\lambda^{-1}Tx$ なので、$N$ の閉単位球は $\lambda^{-1}T(B_{X})$ に含まれる閉集合で、コンパクト集合の閉部分集合としてコンパクト。\ref{fa:compact-unit-ball} から有限次元。

**2.** 評価を否定すると、$\operatorname{dist}(x_{n},N)=1$, $\|Sx_{n}\|\to0$ となる $x_{n}$ がある（斉次性で正規化）。$N$ は有限次元なので、$\|x_{n}-m_{n}\|\le2$ となる $m_{n}\in N$ をとり $y_{n}\defeq x_{n}-m_{n}$ とすると、$(y_{n})$ は有界、$\operatorname{dist}(y_{n},N)=1$, $Sy_{n}=Sx_{n}\to0$。コンパクト性から部分列で $Ty_{n}\to z$、すると $y_{n}=\lambda^{-1}(Sy_{n}+Ty_{n})\to\lambda^{-1}z\eqdef y$ で、$Sy=\lim Sy_{n}=0$、$y\in N$。しかし $\operatorname{dist}(y,N)=\lim\operatorname{dist}(y_{n},N)=1$ で矛盾。像が閉：$Sx_{n}\to w$ とし、$u_{n}\defeq x_{n}-m_{n}$（$m_{n}\in N$, $\|u_{n}\|\le2\operatorname{dist}(x_{n},N)$）とすると $\|u_{n}\|\le\frac2c\|Sx_{n}\|$ で有界、$Su_{n}=Sx_{n}$。部分列で $Tu_{n}\to z$、$u_{n}=\lambda^{-1}(Su_{n}+Tu_{n})\to\lambda^{-1}(w+z)\eqdef u$、$Su=w$。

**3.** $S$ が単射で全射でないとする。$X_{k}\defeq S^{k}(X)$ とおく。$S^{k}=(\lambda-T)^{k}=\lambda^{k}-T_{k}$（$T_{k}$ は二項展開で $T$ の正の冪の線形結合、\ref{fa:compact-ideal} からコンパクト）なので、2 から $X_{k}$ は閉。$X_{1}\subsetneq X_{0}$ で、$X_{k+1}=X_{k}$ となる $k$ があれば、$S^{k}x=S^{k+1}y$ と単射性から $x=Sy$、$X_{1}=X_{0}$ となり矛盾するので、$X_{k+1}\subsetneq X_{k}$ がすべての $k$ で成り立つ。\ref{fa:riesz-lemma} から $x_{k}\in X_{k}$, $\|x_{k}\|=1$, $\operatorname{dist}(x_{k},X_{k+1})\ge\frac12$ をとる。$k<m$ について
$$
Tx_{k}-Tx_{m}=\lambda x_{k}-\bigl(Sx_{k}+\lambda x_{m}-Sx_{m}\bigr)
$$
で括弧内は $X_{k+1}$ の元（$Sx_{k}\in X_{k+1}$, $x_{m}\in X_{m}\subset X_{k+1}$, $Sx_{m}\in X_{m+1}$）なので $\|Tx_{k}-Tx_{m}\|\ge\frac{|\lambda|}{2}$。$(Tx_{k})$ は収束する部分列をもたず、コンパクト性に反する。

::: hypcheck
- **$\lambda\ne0$**：1〜3 のどれでも $\lambda^{-1}$ を使った。$\lambda=0$ では偽：右シフト（\ref{fa:spectrum-examples}）に $\operatorname{diag}(1,\frac12,\frac13,\dots)$ を掛けた作用素 $T$ はコンパクトで（有限階数の極限）単射だが全射でない。
- **コンパクト性**：1・2 の部分列の収束と、3 の矛盾に使った。
:::
:::

::: corollary フレドホルムの二者択一 {#fa:fredholm-alternative keywords="Fredholm alternative: for T compact and lambda nonzero, either (lambda - T)x = y has a unique solution for every y, with bounded inverse, or (lambda - T)x = 0 has a nonzero solution" index="フレドホルムの二者択一|ふれどほるむのにしゃたくいつ"}
$T\in K(X)$, $\lambda\ne0$ について、次のどちらか一方だけが成り立つ。
1. すべての $y\in X$ について $(\lambda-T)x=y$ はただ一つの解をもち、$(\lambda-T)^{-1}$ は有界。
2. $(\lambda-T)x=0$ は $0$ でない解をもつ（その解空間は有限次元）。
:::

::: proof
2 でなければ $\lambda-T$ は単射で、\ref{fa:riesz-schauder.3} から全射、\ref{fa:bounded-inverse.1} から逆は有界。2 なら 1 の一意性が崩れる。解空間の有限次元性は \ref{fa:riesz-schauder.1}。
:::

::: theorem コンパクト作用素のスペクトル {#fa:compact-spectrum keywords="the spectrum of a compact operator: every nonzero point is an eigenvalue with finite dimensional eigenspace; the eigenvalues can accumulate only at 0; the spectrum is countable; 0 is in the spectrum in infinite dimensions" index="コンパクト作用素のスペクトル|こんぱくとさようそのすぺくとる"}
$T\in K(X)$（$X$ は複素バナッハ空間）とする。
1. $\sigma(T)\setminus\{0\}$ の各点は、有限次元の固有空間をもつ固有値。
2. 任意の $\varepsilon>0$ について、$|\lambda|\ge\varepsilon$ となる固有値は有限個。とくに $\sigma(T)$ は可算で、集積点は $0$ だけ。
3. $\dim X=\infty$ なら $0\in\sigma(T)$。
:::

::: proof
**1.** \ref{fa:fredholm-alternative}：固有値でなければ $\lambda\notin\sigma(T)$。

**2.** 否定すると、相異なる固有値 $\lambda_{n}$（$|\lambda_{n}|\ge\varepsilon$）と固有ベクトル $x_{n}$ がある。相異なる固有値の固有ベクトルは一次独立なので、$M_{n}\defeq\operatorname{span}\{x_{1},\dots,x_{n}\}$ は真に増加し、$TM_{n}\subset M_{n}$、$(\lambda_{n}-T)M_{n}\subset M_{n-1}$（$(\lambda_{n}-T)x_{j}=(\lambda_{n}-\lambda_{j})x_{j}$）。\ref{fa:riesz-lemma}（$M_{n-1}$ は有限次元で閉）から $y_{n}\in M_{n}$, $\|y_{n}\|=1$, $\operatorname{dist}(y_{n},M_{n-1})\ge\frac12$。$m<n$ について $Ty_{n}-Ty_{m}=\lambda_{n}y_{n}-\bigl((\lambda_{n}-T)y_{n}+Ty_{m}\bigr)$ で括弧内は $M_{n-1}$ の元なので $\|Ty_{n}-Ty_{m}\|\ge\frac{|\lambda_{n}|}{2}\ge\frac\varepsilon2$。コンパクト性に反する。$\sigma(T)\setminus\{0\}=\bigcup_{k}\{\lambda\in\sigma(T):|\lambda|\ge\frac1k\}$ は有限集合の可算和。

**3.** $0\notin\sigma(T)$ なら $I=T^{-1}T$ はコンパクト（\ref{fa:compact-ideal.3}）で、単位球がコンパクトになり \ref{fa:compact-unit-ball} に反する。
:::

::: supplement
**積分方程式.** \ref{fa:integral-operator-compact} と \ref{fa:fredholm-alternative} を合わせると、第 2 種のフレドホルム積分方程式 $\lambda f(x)-\int_{0}^{1}k(x,t)f(t)\,dt=g(x)$（$k$ 連続、$\lambda\ne0$）は、斉次方程式が自明な解しかもたなければ、すべての連続な $g$ についてただ一つの連続な解をもち、解は $g$ に連続に依存する。フレドホルムはこれを行列式の無限次元版で示し、リースが位相的な議論（このページの方法）に置き換えた。

**高い視点：「ほとんど有限次元」.** コンパクト作用素は（ヒルベルト空間などでは）有限階数作用素のノルム極限で、有限次元の線形代数の「単射 ⇔ 全射」「固有値の離散性」が、$0$ から離れたところでは生き残る。$\lambda-T$ は、核も余核も有限次元で像が閉な**フレドホルム作用素**の典型で、その指数 $\dim\ker-\dim\operatorname{coker}$ は $0$ である（この指数がコンパクトな摂動で変わらないことが、アティヤ–シンガーの指数定理につながる。知られている）。比喩で言えば、コンパクト作用素は「遠くから見ると有限個の方向にしか効かない」作用素で、$\lambda-T$ は「恒等写像に少しの有限次元的なゆがみを加えたもの」なので、行列と同じ二者択一が成り立つ。
:::

## 問題 {#fa:sec-co-problems}

::: problem {#fa:prob-co-diagonal}
有界な複素数列 $(a_{n})$ について、$\ell^{2}$ 上の対角作用素 $D(x_{n})\defeq(a_{n}x_{n})$ がコンパクト $\iff$ $a_{n}\to0$ であることを示し、そのとき $\sigma(D)$ を求めよ。
:::

::: solution
**$\Leftarrow$.** $D_{N}$ を最初の $N$ 成分だけ残した有限階数作用素とすると $\|D-D_{N}\|=\sup_{n>N}|a_{n}|\to0$ なので、\ref{fa:compact-ideal.4} からコンパクト。

**$\Rightarrow$.** $a_{n}\not\to0$ なら、$|a_{n_{k}}|\ge\varepsilon$ となる部分列があり、$\|De_{n_{k}}-De_{n_{l}}\|^{2}=|a_{n_{k}}|^{2}+|a_{n_{l}}|^{2}\ge2\varepsilon^{2}$ なので $(De_{n_{k}})$ は収束部分列をもたない。

**スペクトル.** $De_{n}=a_{n}e_{n}$ なので各 $a_{n}$ は固有値。\ref{fa:compact-spectrum} から $\sigma(D)\setminus\{0\}$ は固有値だけで、$Dx=\lambda x$（$x\ne0$）なら $a_{n}x_{n}=\lambda x_{n}$ から $\lambda=a_{n}$ となる $n$ がある。$\ell^{2}$ は無限次元なので $0\in\sigma(D)$。よって $\sigma(D)=\{a_{n}\}\cup\{0\}$。
:::

::: problem {#fa:prob-co-identity-plus}
$T\in K(X)$ で $T^{2}=0$ なら、$I+T$ は可逆であることを、二通り（直接の計算とフレドホルムの二者択一）で示せ。
:::

::: solution
**直接.** $(I+T)(I-T)=I-T^{2}=I=(I-T)(I+T)$。

**二者択一.** $(I+T)x=0$ なら $Tx=-x$、$0=T^{2}x=-Tx=x$。よって単射で、\ref{fa:fredholm-alternative}（$\lambda=1$, 作用素 $-T$）から可逆。
:::
