# 演習：作用素とスペクトル {#fa:page-exercises-operators keywords="exercises, Operators and Spectra"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な作用素のスペクトル・ノルム・共役作用素の計算、積分方程式の可解性の判定、対称な核の固有関数展開と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#fa:sec-exfa2-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。バナッハ環とスペクトルは \ref{fa:banach-algebra}, \ref{fa:spectrum}、コンパクト作用素は \ref{fa:compact-operator}、共役作用素は \ref{fa:adjoint}。
- $A$ は複素数上の単位的バナッハ環。$X$ が複素バナッハ空間のとき、$T\in B(X)$ のスペクトル $\sigma(T)$ はバナッハ環 $B(X)$ の元としてのもの、つまり $\lambda-T$ が有界な逆をもたない $\lambda$ の全体である。
- $\ell^{2}\defeq\ell^{2}(\mathbb{N})$（複素数列、$\mathbb{N}=\{1,2,\dots\}$）、$e_{n}$ は第 $n$ 成分だけが $1$ の単位ベクトル。右シフトは $S(x_{1},x_{2},\dots)\defeq(0,x_{1},x_{2},\dots)$、左シフトは $L(x_{1},x_{2},\dots)\defeq(x_{2},x_{3},\dots)$。
- $C([0,1])$ は上限ノルム $\|\cdot\|_{\infty}$ を備えた複素数値連続関数の空間、$L^{2}([0,1])$ はルベーグ測度についての複素 $L^{2}$ 空間で、内積は $\langle f,g\rangle\defeq\int_{0}^{1}f\overline{g}$（第 1 変数について線形）。
- ヴォルテラ作用素 $(Vf)(x)\defeq\int_{0}^{x}f(t)\,dt$ は、$C([0,1])$ 上でも $L^{2}([0,1])$ 上でも考える。どちらで考えるかは各問題で指定する。
:::

## スペクトルとバナッハ環 {#fa:sec-sp-exercises}

対応するページ：\ref{fa:page-spectrum}

::: problem ★ 基本：逆元と多項式のスペクトル {#fa:ex-sp-1}
$a\in A$ とする。
1. $a$ が可逆なら $\sigma(a^{-1})=\{\lambda^{-1}:\lambda\in\sigma(a)\}$ であることを示せ。
2. 複素係数の多項式 $p$ について $\sigma(p(a))=p(\sigma(a))\defeq\{p(\lambda):\lambda\in\sigma(a)\}$ であることを示せ。
3. $a^{2}=a$, $a\ne0$, $a\ne1$ のとき $\sigma(a)=\{0,1\}$ であることを示せ。
:::

::: solution
まず次の補題を示す。

**補題.** $x,y\in A$ が $xy=yx$ を満たすとき、$xy$ が可逆であることと、$x$, $y$ がともに可逆であることは同値である。

（証明）$x,y$ が可逆なら $y^{-1}x^{-1}$ が $xy$ の逆元である。逆に $P\defeq xy=yx$ が可逆とする。$x(yP^{-1})=PP^{-1}=1$ かつ $(P^{-1}y)x=P^{-1}(yx)=P^{-1}P=1$ なので、$x$ は右逆元 $yP^{-1}$ と左逆元 $P^{-1}y$ をもつ。左逆元と右逆元は一致する（$P^{-1}y=(P^{-1}y)x(yP^{-1})=yP^{-1}$）ので $x$ は可逆である。$x$ と $y$ の役割を入れ替えれば $y$ も可逆である。帰納法により、互いに可換な有限個の元 $x_{1},\dots,x_{d}$ の積が可逆であることと、各 $x_{i}$ が可逆であることは同値である（$x_{1}$ と $x_{2}\cdots x_{d}$ は可換なので補題を繰り返し使えばよい）。

**1.** $a$ が可逆なので $0\notin\sigma(a)$ であり、$a^{-1}$ も可逆なので $0\notin\sigma(a^{-1})$ である。$\lambda\ne0$ について
$$
\lambda-a^{-1}=-\lambda a^{-1}\bigl(\lambda^{-1}-a\bigr)
$$
であり（右辺を展開すると $-\lambda a^{-1}\lambda^{-1}+\lambda a^{-1}a=\lambda-a^{-1}$）、$-\lambda a^{-1}$ と $\lambda^{-1}-a$ は可換で、$-\lambda a^{-1}$ は可逆である。補題から、$\lambda-a^{-1}$ が可逆 $\iff$ $\lambda^{-1}-a$ が可逆。よって $\lambda\in\sigma(a^{-1})\iff\lambda^{-1}\in\sigma(a)$ で、これは $\sigma(a^{-1})=\{\lambda^{-1}:\lambda\in\sigma(a)\}$ を意味する。

**2.** $p$ が定数 $c$ のとき、$p(a)=c\cdot1$ で $\sigma(c\cdot1)=\{c\}$（$\mu\ne c$ なら $\mu-c$ は $0$ でないスカラーで可逆、$\mu=c$ なら $0$ は可逆でない：$A\ne0$ なので $0\cdot b=0\ne1$）。一方 $\sigma(a)\ne\varnothing$（\ref{fa:spectrum-nonempty-compact.4}）なので $p(\sigma(a))=\{c\}$ で、等式が成り立つ。

$p(z)=\sum_{j=0}^{d}c_{j}z^{j}$, $d\ge1$, $c_{d}\ne0$ とし、$\mu\in\mathbb{C}$ を固定する。$\mu-p(z)$ は最高次の係数が $-c_{d}$ の $d$ 次多項式なので、\ref{cx:fundamental-theorem-algebra} から
$$
\mu-p(z)=-c_{d}\prod_{i=1}^{d}(z-\alpha_{i})
$$
と因数分解でき、$\alpha_{1},\dots,\alpha_{d}$ は方程式 $p(z)=\mu$ の解のすべてである。$z\mapsto a$ の代入は多項式環から $A$ への環準同型なので、$\mu-p(a)=-c_{d}\prod_{i}(a-\alpha_{i})$ で、因子 $a-\alpha_{i}$ は互いに可換である。補題から
$$
\mu\in\sigma(p(a))\iff\text{ある }i\text{ で }\alpha_{i}\in\sigma(a)\iff\text{ある }\lambda\in\sigma(a)\text{ で }p(\lambda)=\mu .
$$
よって $\sigma(p(a))=p(\sigma(a))$。

**3.** $p(z)\defeq z^{2}-z$ とすると $p(a)=0$ なので、2 から $p(\sigma(a))=\sigma(0)=\{0\}$、つまり $\sigma(a)\subset\{z:z^{2}=z\}=\{0,1\}$。$a(1-a)=a-a^{2}=0$ で $1-a\ne0$ なので、$a$ が可逆なら $1-a=a^{-1}a(1-a)=0$ となり矛盾、よって $0\in\sigma(a)$。同様に $(1-a)a=0$ で $a\ne0$ なので $1-a$ は可逆でなく、$1\in\sigma(a)$。したがって $\sigma(a)=\{0,1\}$。
:::

::: problem ★★ 標準：L² 上の掛け算作用素 {#fa:ex-sp-2}
$\varphi\colon[0,1]\to\mathbb{C}$ を連続関数とし、$L^{2}([0,1])$ 上の掛け算作用素 $M_{\varphi}f\defeq\varphi f$ を考える。
1. $\sigma(M_{\varphi})=\varphi([0,1])$ を示せ。
2. $\lambda$ が $M_{\varphi}$ の固有値であることと、$\{x:\varphi(x)=\lambda\}$ のルベーグ測度が正であることが同値であることを示せ。
3. $\varphi(x)=x$ のとき、$\sigma(M_{\varphi})=[0,1]$ で、$M_{\varphi}$ は固有値をもたないことを確かめよ。
:::

::: solution
$|\varphi f|\le\|\varphi\|_{\infty}|f|$ なので $M_{\varphi}$ は $L^{2}([0,1])$ 上の有界作用素で、$\|M_{\varphi}\|\le\|\varphi\|_{\infty}$。また $M_{\varphi}M_{\psi}=M_{\varphi\psi}$, $M_{1}=I$ である。

**1.** **$\lambda\notin\varphi([0,1])$ の場合.** $\lambda-\varphi$ は零点をもたない連続関数なので $\psi\defeq1/(\lambda-\varphi)$ は $[0,1]$ 上連続、とくに有界である。$M_{\psi}$ は有界で、$M_{\psi}(\lambda-M_{\varphi})=M_{\psi(\lambda-\varphi)}=I$、同様に $(\lambda-M_{\varphi})M_{\psi}=I$。よって $\lambda\notin\sigma(M_{\varphi})$。

**$\lambda=\varphi(x_{0})$ の場合.** $\lambda-M_{\varphi}$ が有界な逆 $R$ をもつと仮定する。$\varepsilon\defeq1/(2\|R\|)$ とおく（$R\ne0$ なので $\|R\|>0$）。$\varphi$ の $x_{0}$ での連続性から、正の長さの区間 $J\subset[0,1]$ で $J$ 上 $|\varphi-\lambda|<\varepsilon$ となるものがある。$f\defeq\mathbf{1}_{J}$ とすると $\|f\|_{2}=|J|^{1/2}>0$ で
$$
\|(\lambda-M_{\varphi})f\|_{2}^{2}=\int_{J}|\lambda-\varphi|^{2}\le\varepsilon^{2}\|f\|_{2}^{2}.
$$
すると $\|f\|_{2}=\|R(\lambda-M_{\varphi})f\|_{2}\le\|R\|\varepsilon\|f\|_{2}=\frac12\|f\|_{2}$ となり、$\|f\|_{2}>0$ に矛盾する。よって $\lambda\in\sigma(M_{\varphi})$。

以上から $\sigma(M_{\varphi})=\varphi([0,1])$。

**2.** $Z\defeq\{x:\varphi(x)=\lambda\}$（閉集合なので可測）とする。$|Z|>0$ なら $f\defeq\mathbf{1}_{Z}$ は $L^{2}$ の $0$ でない元で、$(\varphi-\lambda)f=0$ なので $M_{\varphi}f=\lambda f$。逆に $M_{\varphi}f=\lambda f$, $f\ne0$ なら、$(\varphi-\lambda)f=0$ がほとんどいたるところで成り立つので、$[0,1]\setminus Z$ 上ではほとんどいたるところで $f=0$。$f\ne0$（$L^{2}$ の元として）なので $\{f\ne0\}$ は正の測度をもち、それはほとんど $Z$ に含まれるので $|Z|>0$。

**3.** 1 から $\sigma(M_{\varphi})=[0,1]$。各 $\lambda$ について $\{x:x=\lambda\}$ は高々 1 点で測度 $0$ なので、2 から固有値はない。このように、スペクトルは固有値がなくても大きくなりうる。
:::

::: problem ★★ 標準：重み付きシフトのスペクトル半径 {#fa:ex-sp-3}
$\ell^{2}$ 上の作用素 $W(x_{1},x_{2},\dots)\defeq\bigl(0,x_{1},\tfrac{1}{2}x_{2},\tfrac{1}{3}x_{3},\dots\bigr)$（つまり $We_{k}=\frac1ke_{k+1}$）について、$\|W^{n}\|=\frac{1}{n!}$ を示し、$\sigma(W)=\{0\}$ を導け。また $0$ は $W$ の固有値でないことを示せ。
:::

::: solution
**$W^{n}$ の形.** $We_{k}=\frac1ke_{k+1}$ を繰り返すと
$$
W^{n}e_{k}=c_{k}e_{k+n},\qquad c_{k}\defeq\prod_{j=k}^{k+n-1}\frac1j=\frac{(k-1)!}{(k+n-1)!}.
$$
$W$ は有界（$\|Wx\|\le\|x\|$）かつ線形なので、$x=\sum_{k}x_{k}e_{k}$ について $W^{n}x=\sum_{k}c_{k}x_{k}e_{k+n}$。

**ノルム.** $c_{k}$ は $k$ について減少する（$c_{k+1}/c_{k}=k/(k+n)<1$）ので $\sup_{k}c_{k}=c_{1}=\frac1{n!}$。$e_{k+n}$ は正規直交なので
$$
\|W^{n}x\|^{2}=\sum_{k}c_{k}^{2}|x_{k}|^{2}\le\frac{1}{(n!)^{2}}\|x\|^{2},
$$
で、$x=e_{1}$ で等号が成り立つ。よって $\|W^{n}\|=\frac1{n!}$。

**スペクトル半径.** $n!$ のうち $\lceil n/2\rceil$ 以上 $n$ 以下の因子は $n-\lceil n/2\rceil+1\ge n/2$ 個あり、$n\ge2$ ならどれも $n/2\ge1$ 以上なので $n!\ge(n/2)^{n/2}$（$n=1$ でも $1\ge(1/2)^{1/2}$）。よって
$$
\|W^{n}\|^{1/n}=(n!)^{-1/n}\le\Bigl(\frac{2}{n}\Bigr)^{1/2}\to0 .
$$
\ref{fa:spectral-radius} から $r(W)=0$ で、$\sigma(W)\subset\{0\}$。\ref{fa:spectrum-nonempty-compact.4} から $\sigma(W)\ne\varnothing$ なので $\sigma(W)=\{0\}$。

**$0$ は固有値でない.** $Wx=0$ なら、各 $k$ で $\frac1kx_{k}=0$ なので $x=0$。つまり $W$ は単射で、$0\in\sigma(W)$ は $W$ が全射でない（像の元の第 1 成分は $0$ なので $e_{1}\notin\operatorname{im}W$）ことによる。
:::

::: problem ★★★ 発展：ab と ba のスペクトル {#fa:ex-sp-4}
$a,b\in A$ とする。
1. $1-ab$ が可逆なら $1-ba$ も可逆で、$(1-ba)^{-1}=1+b(1-ab)^{-1}a$ であることを示せ。
2. $\sigma(ab)\cup\{0\}=\sigma(ba)\cup\{0\}$ と $r(ab)=r(ba)$ を示せ。
3. $\ell^{2}$ のシフトについて $\sigma(LS)=\{1\}$, $\sigma(SL)=\{0,1\}$ を確かめ、2 で $\{0\}$ を付け加える必要があることを確かめよ。
:::

::: solution
**1.** $u\defeq(1-ab)^{-1}$, $v\defeq1+bua$ とおく。$(1-ab)u=u(1-ab)=1$、すなわち $u-abu=1$, $u-uab=1$ を使うと
$$
(1-ba)v=1-ba+bua-babua=1-ba+b(u-abu)a=1-ba+ba=1,
$$
$$
v(1-ba)=1-ba+bua-buaba=1-ba+b(u-uab)a=1-ba+ba=1 .
$$
よって $1-ba$ は可逆で逆元は $v$。

**2.** $\lambda\ne0$ とする。$\lambda-ab=\lambda\bigl(1-(\lambda^{-1}a)b\bigr)$, $\lambda-ba=\lambda\bigl(1-b(\lambda^{-1}a)\bigr)$ である。1 を $(\lambda^{-1}a,b)$ に使うと「$1-(\lambda^{-1}a)b$ が可逆 $\Rightarrow$ $1-b(\lambda^{-1}a)$ が可逆」、$a$ と $b$ の役割を入れ替えて 1 を $(b,\lambda^{-1}a)$ に使うと逆向きが得られる。よって $\lambda\in\sigma(ab)\iff\lambda\in\sigma(ba)$（$\lambda\ne0$）で、$\sigma(ab)\cup\{0\}=\sigma(ba)\cup\{0\}$。

スペクトルは空でない（\ref{fa:spectrum-nonempty-compact.4}）ので、$r(c)=\sup\{|\lambda|:\lambda\in\sigma(c)\}=\sup\{|\lambda|:\lambda\in\sigma(c)\cup\{0\}\}$（空でない集合に $0$ を加えても、非負の値の上限は変わらない）。よって $r(ab)=r(ba)$。

**3.** $LS(x_{1},x_{2},\dots)=L(0,x_{1},x_{2},\dots)=(x_{1},x_{2},\dots)$ なので $LS=I$ で、$\sigma(I)=\{1\}$（$\lambda\ne1$ なら $\lambda-I=(\lambda-1)I$ は可逆）。一方 $Q\defeq SL$ は $Q(x_{1},x_{2},\dots)=(0,x_{2},x_{3},\dots)$ で、$Q^{2}=Q$, $Q\ne0$（$Qe_{2}=e_{2}$）, $Q\ne I$（$Qe_{1}=0$）。\ref{fa:ex-sp-1.3} から $\sigma(SL)=\{0,1\}$。2 の等式は $\{1\}\cup\{0\}=\{0,1\}\cup\{0\}$ として成り立つが、$\sigma(LS)\ne\sigma(SL)$ なので、$\{0\}$ を付け加えずに $\sigma(ab)=\sigma(ba)$ とすることはできない。
:::

## コンパクト作用素 {#fa:sec-co-exercises}

対応するページ：\ref{fa:page-compact-operators}

::: problem ★ 基本：退化核の積分方程式 {#fa:ex-co-1}
$C([0,1])$ 上の $(Kf)(x)\defeq\int_{0}^{1}xt\,f(t)\,dt$ と $\lambda\ne0$、$g\in C([0,1])$ について、方程式
$$
\lambda f(x)-\int_{0}^{1}xt\,f(t)\,dt=g(x)
$$
を考える。$K$ の $0$ でない固有値を求め、それ以外の $\lambda$ では解がただ一つであることを確かめて解を求めよ。また固有値に等しい $\lambda$ では、解が存在するための $g$ の条件と、そのときの解の全体を求めよ。
:::

::: solution
核 $xt$ は連続なので、$K$ はコンパクト（\ref{fa:integral-operator-compact}）。$c(f)\defeq\int_{0}^{1}tf(t)\,dt$ とおくと $Kf=c(f)\,x$（$x$ は関数 $x\mapsto x$）。

**固有値.** $Kf=\lambda f$, $\lambda\ne0$, $f\ne0$ とすると $f=\lambda^{-1}c(f)x$ で、$f\ne0$ から $c(f)\ne0$。両辺に $t$ を掛けて積分すると $c(f)=\lambda^{-1}c(f)\int_{0}^{1}t^{2}dt=\frac{c(f)}{3\lambda}$ なので $\lambda=\frac13$。逆に $Kx=x\int_{0}^{1}t^{2}dt=\frac13x$。よって $0$ でない固有値は $\frac13$ だけで、固有空間は $\operatorname{span}\{x\}$。

**$\lambda\ne\frac13$ の場合.** $\lambda$ は固有値でないので、\ref{fa:fredholm-alternative} からすべての $g$ についてただ一つの解がある。解を求める。解 $f$ は $f=\lambda^{-1}(g+c(f)x)$ を満たすので、$t$ を掛けて積分すると $c(f)=\lambda^{-1}\bigl(c(g)+\tfrac13c(f)\bigr)$、つまり $c(f)=\frac{c(g)}{\lambda-1/3}$。よって
$$
f(x)=\frac1\lambda\Bigl(g(x)+\frac{3c(g)}{3\lambda-1}x\Bigr),\qquad c(g)=\int_{0}^{1}tg(t)\,dt .
$$
（実際、この $f$ について $c(f)=\lambda^{-1}\bigl(c(g)+\frac{c(g)}{3\lambda-1}\bigr)=\frac{3c(g)}{3\lambda-1}$ なので、$\lambda f-c(f)x=g$ となり確かに解である。）

**$\lambda=\frac13$ の場合.** 解 $f$ があるとする。方程式 $\frac13f-c(f)x=g$ に $x$ を掛けて $[0,1]$ で積分すると $\frac13c(f)-\frac13c(f)=c(g)$ なので、$c(g)=\int_{0}^{1}tg(t)\,dt=0$ が必要である。逆に $c(g)=0$ のとき、任意の $\alpha\in\mathbb{C}$ について $f\defeq3g+\alpha x$ は $c(f)=3c(g)+\frac\alpha3=\frac\alpha3$ なので
$$
\tfrac13f-c(f)x=g+\tfrac\alpha3x-\tfrac\alpha3x=g
$$
で解である。また任意の解は $f=3g+3c(f)x$ の形なので、解の全体は $\{3g+\alpha x:\alpha\in\mathbb{C}\}$。これは「解 $3g$ ＋ 固有空間」で、\ref{fa:fredholm-alternative.2} の場合にあたる。
:::

::: problem ★★ 標準：ヴォルテラ作用素のコンパクト性とスペクトル {#fa:ex-co-2}
$C([0,1])$ 上のヴォルテラ作用素 $V$ について次を示せ。
1. $V$ はコンパクト。
2. $V$ は $0$ でない固有値をもたず、$\sigma(V)=\{0\}$。
3. すべての $g\in C([0,1])$ について $f-Vf=g$ の解はただ一つで、$f(x)=g(x)+\int_{0}^{x}e^{x-t}g(t)\,dt$。
:::

::: solution
**1.** $\|f\|_{\infty}\le1$ なら、$|Vf(x)|\le x\le1$ かつ $|Vf(x)-Vf(x')|=\bigl|\int_{x'}^{x}f\bigr|\le|x-x'|$。よって $V(B)$（$B$ は閉単位球）は一様有界かつ同等連続で、実部と虚部に \ref{top:ascoli-classical} を使えば、その閉包は $C([0,1])$ のコンパクト集合である。したがって $V$ はコンパクト。（核 $\mathbf{1}_{\{t\le x\}}$ は連続でないので \ref{fa:integral-operator-compact} はそのままは使えないが、証明は同じである。）

**2.** $Vf=\lambda f$, $\lambda\ne0$ とする。$f=\lambda^{-1}Vf$ で、$f$ は連続なので \ref{calc:fundamental-theorem.1} から $Vf$ は $C^{1}$ で $(Vf)'=f$。よって $f$ は $C^{1}$ で $f'=\lambda^{-1}f$、$f(0)=\lambda^{-1}Vf(0)=0$。$h(x)\defeq e^{-x/\lambda}f(x)$ とすると $h'=e^{-x/\lambda}(f'-\lambda^{-1}f)=0$ なので $h$ は定数で $h(0)=0$、よって $f=0$。したがって $V$ は $0$ でない固有値をもたず、1 と \ref{fa:compact-spectrum.1} から $\sigma(V)\setminus\{0\}=\varnothing$。$C([0,1])$ は無限次元なので \ref{fa:compact-spectrum.3} から $0\in\sigma(V)$。よって $\sigma(V)=\{0\}$。

（これは \ref{fa:prob-sp-nilpotent-like} と同じ結論を、ノルムの評価を使わずに得たものである。）

**3.** 2 から $1\notin\sigma(V)$ なので、$I-V$ は有界な逆をもち、解はただ一つ存在する。$F(x)\defeq\int_{0}^{x}e^{x-t}g(t)\,dt=e^{x}\int_{0}^{x}e^{-t}g(t)\,dt$ とおくと、\ref{calc:fundamental-theorem.1} から $F$ は $C^{1}$ で $F'=F+g$, $F(0)=0$。$f\defeq g+F$ とすると $f=F'$ なので、\ref{calc:fundamental-theorem.2} から
$$
Vf(x)=\int_{0}^{x}F'(t)\,dt=F(x)-F(0)=F(x),
$$
よって $f-Vf=g+F-F=g$。一意性から、これがただ一つの解である。
:::

::: problem ★★ 標準：重み付きシフトのコンパクト性 {#fa:ex-co-3}
有界な複素数列 $(w_{n})$ について、$\ell^{2}$ 上の重み付きシフト $W(x_{1},x_{2},\dots)\defeq(0,w_{1}x_{1},w_{2}x_{2},\dots)$ を考える。
1. $w_{n}\to0$ なら $W$ はコンパクトであることを示せ。
2. 右シフト $S$（$w_{n}\equiv1$）はコンパクトでないことを示せ。
3. $w_{n}\to0$ なら $\sigma(W)=\{0\}$ であり、したがって $\lim_{n}\|W^{n}\|^{1/n}=0$ であることを示せ。
:::

::: solution
$\|Wx\|^{2}=\sum_{n}|w_{n}x_{n}|^{2}\le(\sup_{n}|w_{n}|)^{2}\|x\|^{2}$ なので $W$ は有界である。

**1.** $W_{N}x\defeq(0,w_{1}x_{1},\dots,w_{N}x_{N},0,0,\dots)$ とおくと、$W_{N}$ の像は $\operatorname{span}\{e_{2},\dots,e_{N+1}\}$ に含まれ、$W_{N}$ は有界な有限階数作用素。$(W-W_{N})x$ の成分は $w_{n}x_{n}$（$n>N$）だけなので
$$
\|(W-W_{N})x\|^{2}=\sum_{n>N}|w_{n}x_{n}|^{2}\le\Bigl(\sup_{n>N}|w_{n}|\Bigr)^{2}\|x\|^{2},
$$
$\|W-W_{N}\|\le\sup_{n>N}|w_{n}|\to0$。\ref{fa:compact-ideal.4} から $W$ はコンパクト。

**2.** $(e_{n})$ は有界列だが、$m\ne n$ について $\|Se_{n}-Se_{m}\|=\|e_{n+1}-e_{m+1}\|=\sqrt2$ なので、$(Se_{n})$ のどの部分列もコーシー列でなく、収束しない。\ref{fa:compact-operator} から $S$ はコンパクトでない。

**3.** $Wx=\lambda x$, $\lambda\ne0$ とすると、第 1 成分から $0=\lambda x_{1}$、$x_{1}=0$。第 $n+1$ 成分から $\lambda x_{n+1}=w_{n}x_{n}$ なので、帰納的に $x_{n}=0$ がすべての $n$ で成り立つ。よって $W$ は $0$ でない固有値をもたない。1 と \ref{fa:compact-spectrum.1} から $\sigma(W)\subset\{0\}$、$\ell^{2}$ は無限次元なので \ref{fa:compact-spectrum.3} から $\sigma(W)=\{0\}$。すると $r(W)=0$ で、\ref{fa:spectral-radius} から $\lim_{n}\|W^{n}\|^{1/n}=0$。

（$w_{n}=\frac1n$ の場合は \ref{fa:ex-sp-3} で $\|W^{n}\|$ を直接計算して同じ結論を得た。ここでは $\|W^{n}\|$ を計算せずに、コンパクト性から結論が出る。）
:::

::: problem ★★★ 発展：パラメータを含む積分方程式 {#fa:ex-co-4}
$\mu\in\mathbb{C}$ とし、$C([0,1])$ で方程式
$$
f(x)-\mu\int_{0}^{1}(x+t)f(t)\,dt=g(x)
$$
を考える。すべての $g\in C([0,1])$ についてただ一つの解 $f\in C([0,1])$ をもつような $\mu$ をすべて求めよ。また、そうでない $\mu$ について斉次方程式（$g=0$）の解の全体を求めよ。
:::

::: solution
$(Kf)(x)\defeq\int_{0}^{1}(x+t)f(t)\,dt$ とおく。核は連続なので $K$ はコンパクト（\ref{fa:integral-operator-compact}）。$A(f)\defeq\int_{0}^{1}f$, $B(f)\defeq\int_{0}^{1}tf(t)\,dt$ とすると $Kf=A(f)x+B(f)$。

**Step 1（$K$ の $0$ でない固有値）.** $Kf=\lambda f$, $\lambda\ne0$, $f\ne0$ とする。$f=\lambda^{-1}(Ax+B)$（$A=A(f)$, $B=B(f)$）で、$f\ne0$ から $(A,B)\ne(0,0)$。$f$ を $[0,1]$ で積分したものと、$t$ を掛けて積分したものから
$$
\lambda A=\tfrac12A+B,\qquad\lambda B=\tfrac13A+\tfrac12B .
$$
つまり $(A,B)$ は行列 $\begin{pmatrix}1/2&1\\1/3&1/2\end{pmatrix}$ の固有値 $\lambda$ の固有ベクトルで、$(\tfrac12-\lambda)^{2}-\tfrac13=0$、$\lambda=\tfrac12\pm\tfrac1{\sqrt3}$。また 1 番目の式から $B=(\lambda-\tfrac12)A$ で、$A=0$ なら $B=0$ となるので $A\ne0$、$f$ は $x+s$（$s\defeq\lambda-\frac12=\pm\frac1{\sqrt3}$）の $0$ でない定数倍である。

逆に $s=\pm\frac1{\sqrt3}$ について、$s^{2}=\frac13$ を使うと
$$
K(x+s)=x\int_{0}^{1}(t+s)\,dt+\int_{0}^{1}t(t+s)\,dt=\Bigl(\tfrac12+s\Bigr)x+\tfrac13+\tfrac s2=\Bigl(\tfrac12+s\Bigr)(x+s).
$$
よって $K$ の $0$ でない固有値は $\lambda_{\pm}\defeq\frac12\pm\frac1{\sqrt3}$ のちょうど二つで、固有空間はそれぞれ $\operatorname{span}\{x\pm\frac1{\sqrt3}\}$（1 次元）。

**Step 2（$\mu$ の条件）.** $\mu=0$ なら $f=g$ がただ一つの解。$\mu\ne0$ なら、方程式は $(\mu^{-1}-K)f=\mu^{-1}g$ と同値で、$g$ が $C([0,1])$ 全体を動くとき $\mu^{-1}g$ も全体を動く。\ref{fa:fredholm-alternative} から、すべての $g$ についてただ一つの解をもつ $\iff$ $\mu^{-1}$ が $K$ の固有値でない $\iff$ $\mu\ne\lambda_{\pm}^{-1}$。計算すると
$$
\lambda_{+}^{-1}=\frac{2\sqrt3}{\sqrt3+2}=2\sqrt3(2-\sqrt3)=4\sqrt3-6,\qquad\lambda_{-}^{-1}=\frac{2\sqrt3}{\sqrt3-2}=-2\sqrt3(2+\sqrt3)=-(4\sqrt3+6).
$$
よって求める $\mu$ は $\mu\notin\{4\sqrt3-6,\,-(4\sqrt3+6)\}$ のすべて（$\mu=0$ を含む）。

**Step 3（例外の $\mu$）.** $\mu=\lambda_{\pm}^{-1}$ のとき、斉次方程式 $f=\mu Kf$ は $Kf=\lambda_{\pm}f$ と同値なので、Step 1 から解の全体は $\{\alpha(x\pm\frac1{\sqrt3}):\alpha\in\mathbb{C}\}$（$\mu=4\sqrt3-6$ には $+$、$\mu=-(4\sqrt3+6)$ には $-$ が対応）。
:::

## 自己共役コンパクト作用素のスペクトル定理 {#fa:sec-st-exercises}

対応するページ：\ref{fa:page-spectral-theorem-compact}

::: problem ★ 基本：シフトの共役作用素 {#fa:ex-st-1}
1. $\ell^{2}$ で $S^{*}=L$ を示し、$S^{*}S=I$ と $SS^{*}=I-P$（$P$ は $\operatorname{span}\{e_{1}\}$ への直交射影）を確かめよ。
2. ヒルベルト空間 $H$ 上の $T\in B(H)$ について $\sigma(T^{*})=\{\overline\lambda:\lambda\in\sigma(T)\}$ を示せ。
3. $\sigma(L)$ は閉単位円板で、開単位円板の各点は $L$ の固有値であることを示せ（右シフト $S$ は固有値をもたないこと（\ref{fa:spectrum-examples.2}）と比べよ）。
:::

::: solution
**1.** $x,y\in\ell^{2}$ について
$$
\langle Sx,y\rangle=\sum_{n\ge1}x_{n}\overline{y_{n+1}}=\langle x,Ly\rangle
$$
（両辺の級数はコーシー–シュワルツで絶対収束する）。\ref{fa:adjoint} の一意性から $S^{*}=L$。$S^{*}Sx=LSx=L(0,x_{1},x_{2},\dots)=x$ なので $S^{*}S=I$。$SS^{*}x=SLx=(0,x_{2},x_{3},\dots)=x-x_{1}e_{1}=x-\langle x,e_{1}\rangle e_{1}=(I-P)x$。

**2.** $\langle(\lambda-T)x,y\rangle=\langle x,(\overline\lambda-T^{*})y\rangle$ なので $(\lambda-T)^{*}=\overline\lambda-T^{*}$。$\lambda-T$ が有界な逆 $R$ をもてば、\ref{fa:adjoint} の $(ST)^{*}=T^{*}S^{*}$ と $I^{*}=I$ から
$$
R^{*}(\overline\lambda-T^{*})=\bigl((\lambda-T)R\bigr)^{*}=I,\qquad(\overline\lambda-T^{*})R^{*}=\bigl(R(\lambda-T)\bigr)^{*}=I,
$$
で $\overline\lambda-T^{*}$ は有界な逆 $R^{*}$ をもつ。よって $\overline\lambda\in\sigma(T^{*})\Rightarrow\lambda\in\sigma(T)$。$T^{**}=T$ を使って同じ議論を $T^{*}$ に適用すれば逆向きが得られ、$\sigma(T^{*})=\{\overline\lambda:\lambda\in\sigma(T)\}$。

**3.** \ref{fa:spectrum-examples.2} から $\sigma(S)$ は閉単位円板で、これは複素共役で不変なので、2 から $\sigma(L)=\sigma(S^{*})$ も閉単位円板。さらに $|\lambda|<1$ なら $y_{\lambda}\defeq(1,\lambda,\lambda^{2},\dots)$ は $\|y_{\lambda}\|^{2}=\sum|\lambda|^{2n}<\infty$ で $\ell^{2}$ の $0$ でない元であり、$Ly_{\lambda}=(\lambda,\lambda^{2},\dots)=\lambda y_{\lambda}$。よって開単位円板の各点は $L$ の固有値。（$|\lambda|=1$ のとき、$Ly=\lambda y$ なら $y=y_{1}(1,\lambda,\lambda^{2},\dots)$ で、$\ell^{2}$ に属するのは $y_{1}=0$ のときだけなので、単位円周上の点は固有値でないスペクトルの点である。）
:::

::: problem ★★ 標準：L² 上のヴォルテラ作用素の共役 {#fa:ex-st-2}
$L^{2}([0,1])$ 上のヴォルテラ作用素 $V$ について次を示せ。
1. $V$ はコンパクトで、$(V^{*}g)(x)=\int_{x}^{1}g(s)\,ds$。
2. $V+V^{*}$ は階数 1 の作用素 $f\mapsto\langle f,\mathbf{1}\rangle\mathbf{1}$（$\mathbf{1}$ は定数関数 $1$）で、その $0$ でない固有値は $1$ だけ。
3. $V^{*}V$ は核 $1-\max(x,t)$ の積分作用素である。
:::

::: solution
**1.** $V$ は核 $k(x,t)\defeq\mathbf{1}_{\{t\le x\}}$ の積分作用素で、$\|k\|_{2}^{2}=\iint_{t\le x}dt\,dx=\frac12<\infty$ なので、\ref{fa:hilbert-schmidt.1} と \ref{fa:hilbert-schmidt.3} から有界かつコンパクト。$f,g\in L^{2}([0,1])$ について、$[0,1]$ 上では $\|f\|_{1}\le\|f\|_{2}$（コーシー–シュワルツ）なので、\ref{meas:tonelli} から $\iint|k(x,t)f(t)\overline{g(x)}|\,dt\,dx\le\|f\|_{1}\|g\|_{1}<\infty$。\ref{meas:fubini} で積分の順序を交換して
$$
\langle Vf,g\rangle=\int_{0}^{1}\Bigl(\int_{0}^{x}f(t)\,dt\Bigr)\overline{g(x)}\,dx=\int_{0}^{1}f(t)\overline{\Bigl(\int_{t}^{1}g(x)\,dx\Bigr)}\,dt .
$$
$t\mapsto\int_{t}^{1}g$ は有界な連続関数なので $L^{2}$ に属し、\ref{fa:adjoint} の一意性から $(V^{*}g)(t)=\int_{t}^{1}g$。

**2.** $(V+V^{*})f(x)=\int_{0}^{x}f+\int_{x}^{1}f=\int_{0}^{1}f=\langle f,\mathbf{1}\rangle$。よって $(V+V^{*})f=\langle f,\mathbf{1}\rangle\mathbf{1}$ で、像は $\operatorname{span}\{\mathbf{1}\}$（階数 1）。$\|\mathbf{1}\|_{2}=1$ なので、これは $\operatorname{span}\{\mathbf{1}\}$ への直交射影である。固有値 $\lambda\ne0$ の固有ベクトル $f$ は $f=\lambda^{-1}\langle f,\mathbf{1}\rangle\mathbf{1}$ なので $\mathbf{1}$ の定数倍で、$(V+V^{*})\mathbf{1}=\mathbf{1}$ から $\lambda=1$。（$V$ 自身は自己共役でないが、その「実部」$\frac12(V+V^{*})$ はこのように単純である。）

**3.** 1 から
$$
(V^{*}Vf)(x)=\int_{x}^{1}\Bigl(\int_{0}^{s}f(t)\,dt\Bigr)ds .
$$
1 と同様に $\int_{x}^{1}\int_{0}^{1}\mathbf{1}_{\{t\le s\}}|f(t)|\,dt\,ds\le\|f\|_{1}<\infty$ なので、\ref{meas:fubini} で順序を交換すると
$$
(V^{*}Vf)(x)=\int_{0}^{1}f(t)\,\bigl|\{s:\max(x,t)\le s\le1\}\bigr|\,dt=\int_{0}^{1}\bigl(1-\max(x,t)\bigr)f(t)\,dt .
$$
:::

::: problem ★★★ 発展：L² 上のヴォルテラ作用素のノルム {#fa:ex-st-3}
$L^{2}([0,1])$ 上のヴォルテラ作用素 $V$ について $\|V\|=\frac2\pi$ を示せ（ヒント：\ref{fa:ex-st-2.3} と \ref{fa:min-kernel-eigen} を使い、$(Uf)(x)\defeq f(1-x)$ で $V^{*}V$ を核 $\min(x,y)$ の作用素に移せ）。
:::

::: solution
**Step 1（$U$ の性質）.** $(Uf)(x)\defeq f(1-x)$ は変数変換 $x\mapsto1-x$ がルベーグ測度を保つので $\|Uf\|_{2}=\|f\|_{2}$ で、$U^{2}=I$。

**Step 2（$UV^{*}VU=K$）.** $K$ を核 $\min(x,y)$ の積分作用素（\ref{fa:min-kernel-eigen}）とする。\ref{fa:ex-st-2.3} から、$f\in L^{2}$ について
$$
(V^{*}VUf)(1-x)=\int_{0}^{1}\bigl(1-\max(1-x,t)\bigr)f(1-t)\,dt=\int_{0}^{1}\bigl(1-\max(1-x,1-y)\bigr)f(y)\,dy=\int_{0}^{1}\min(x,y)f(y)\,dy,
$$
（2 番目の等号で $y=1-t$ と置換し、$1-\max(1-x,1-y)=\min(x,y)$ を使った）。左辺は $(UV^{*}VUf)(x)$ なので $UV^{*}VU=K$。

**Step 3（$\|K\|=\frac4{\pi^{2}}$）.** \ref{fa:min-kernel-eigen} から $K$ は自己共役なコンパクト作用素で、$0$ でない固有値は $\lambda_{n}=\frac{1}{(n-\frac12)^{2}\pi^{2}}$（$n\ge1$）のちょうど全体。$K\ne0$ なので \ref{fa:extremal-eigenvalue} から $\|K\|$ または $-\|K\|$ は固有値で、それはある $\lambda_{n}$ に等しいから $\|K\|=\lambda_{n}\le\lambda_{1}=\frac4{\pi^{2}}$。逆に固有値 $\lambda_{1}$ の単位固有ベクトル $e$ について $\lambda_{1}=\|Ke\|\le\|K\|$。よって $\|K\|=\frac4{\pi^{2}}$。

**Step 4（結論）.** $U$ は等長で $U^{2}=I$ なので、$\|UTU\|\le\|T\|$ かつ $T=U(UTU)U$ から $\|T\|\le\|UTU\|$、つまり $\|UTU\|=\|T\|$（$T\in B(L^{2})$）。\ref{fa:adjoint} の $\|V^{*}V\|=\|V\|^{2}$ と Step 2・3 から
$$
\|V\|^{2}=\|V^{*}V\|=\|UV^{*}VU\|=\|K\|=\frac{4}{\pi^{2}},
$$
よって $\|V\|=\frac2\pi$。

（$V$ のヒルベルト–シュミットの評価 $\|V\|\le\|k\|_{2}=\frac1{\sqrt2}\approx0.707$ は、正しい値 $\frac2\pi\approx0.637$ より大きい。また $V$ は $C([0,1])$ 上ではノルム $1$ をもつ：$\|Vf\|_{\infty}\le\|f\|_{\infty}$ で、$f\equiv1$ で等号。ノルムは空間に依存する。）
:::

::: problem ★★★ 発展：グリーン関数の固有関数展開 {#fa:ex-st-4}
$G(x,y)\defeq\min(x,y)-xy$ とし、$L^{2}([0,1])$ 上の $(Gf)(x)\defeq\int_{0}^{1}G(x,y)f(y)\,dy$ を考える。
1. $G$ は自己共役なコンパクト作用素で、$0$ でない固有値は $\mu_{n}\defeq\frac{1}{n^{2}\pi^{2}}$（$n\ge1$）、固有空間は $e_{n}(x)\defeq\sqrt2\sin(n\pi x)$ の張る 1 次元空間であることを示せ。
2. すべての $f\in L^{2}([0,1])$ について $Gf=\sum_{n\ge1}\mu_{n}\langle f,e_{n}\rangle e_{n}$（$L^{2}$ での収束）を示せ。
3. $\ker G=\{0\}$ を示し、$(e_{n})_{n\ge1}$ が $L^{2}([0,1])$ の正規直交基底であることを導け。
:::

::: solution
**準備（連続関数への作用）.** $G$ は $[0,1]^{2}$ 上連続（したがって一様連続）で実数値かつ対称なので、\ref{fa:hilbert-schmidt.3} と \ref{fa:hilbert-schmidt.4} から $G$ は自己共役なコンパクト作用素である。$f\in L^{2}$ なら、$|Gf(x)-Gf(x')|\le\sup_{y}|G(x,y)-G(x',y)|\,\|f\|_{1}\le\sup_{y}|G(x,y)-G(x',y)|\,\|f\|_{2}$ なので $Gf$ は連続関数（の類）である。

$f$ が連続のとき、$x\le y$ で $G=x(1-y)$、$y\le x$ で $G=y(1-x)$ なので
$$
u(x)\defeq Gf(x)=(1-x)\int_{0}^{x}yf(y)\,dy+x\int_{x}^{1}(1-y)f(y)\,dy .
$$
\ref{calc:fundamental-theorem.1} から $u$ は $C^{1}$ で
$$
u'(x)=-\int_{0}^{x}yf+(1-x)xf(x)+\int_{x}^{1}(1-y)f-x(1-x)f(x)=-\int_{0}^{x}yf+\int_{x}^{1}(1-y)f,
$$
さらに $u''(x)=-xf(x)-(1-x)f(x)=-f(x)$。また $u(0)=u(1)=0$。

**境界値問題の一意性.** $w\in C^{2}([0,1])$ が $w''=0$, $w(0)=w(1)=0$ を満たせば、$w$ は 1 次関数で $w=0$。よって、連続な $h$ について「$u''=-h$, $u(0)=u(1)=0$ を満たす $C^{2}$ 関数 $u$」は $Gh$ ただ一つである。

**1.** **固有値の候補.** $Gf=\lambda f$, $\lambda\ne0$, $f\ne0$ とする。\ref{fa:selfadjoint.1} から $\lambda\in\mathbb{R}$。$f=\lambda^{-1}Gf$ は連続（準備）なので、上の計算から $f$ は $C^{2}$ で $\lambda f''=-f$, $f(0)=f(1)=0$。

$\lambda<0$ の場合：$\omega\defeq|\lambda|^{-1/2}$ とすると $f''=\omega^{2}f$。部分積分（境界項は $f(0)=f(1)=0$ で消える）から
$$
\omega^{2}\int_{0}^{1}|f|^{2}=\int_{0}^{1}f''\overline f=-\int_{0}^{1}|f'|^{2}\le0,
$$
よって $f=0$ となり矛盾。

$\lambda>0$ の場合：$\omega\defeq\lambda^{-1/2}>0$ とすると $f''=-\omega^{2}f$。$b\defeq f'(0)/\omega$, $h\defeq f-b\sin(\omega x)$ とおくと $h''=-\omega^{2}h$, $h(0)=h'(0)=0$。$E\defeq|h'|^{2}+\omega^{2}|h|^{2}$ は $E'=2\operatorname{Re}\bigl(h''\overline{h'}\bigr)+2\omega^{2}\operatorname{Re}\bigl(h'\overline h\bigr)=2\operatorname{Re}\bigl((h''+\omega^{2}h)\overline{h'}\bigr)=0$ なので定数で、$E(0)=0$ から $h=0$。よって $f=b\sin(\omega x)$, $b\ne0$ で、$f(1)=0$ から $\sin\omega=0$、$\omega=n\pi$（$n\ge1$）、$\lambda=\mu_{n}$。しかも固有空間は $\operatorname{span}\{\sin(n\pi x)\}$ に含まれる。

**実際に固有値であること.** $f_{n}(x)\defeq\sin(n\pi x)$ について、$u\defeq\mu_{n}f_{n}$ は $u''=-f_{n}$, $u(0)=u(1)=0$ を満たすので、一意性から $Gf_{n}=\mu_{n}f_{n}$。$\int_{0}^{1}\sin^{2}(n\pi x)\,dx=\frac12$ なので $e_{n}=\sqrt2f_{n}$ は単位ベクトル。以上から 1 が示された。

**2.** \ref{fa:compact-selfadjoint-spectral} の正規直交系 $(e'_{k})$ と固有値 $\lambda'_{k}\ne0$ をとる。各 $e'_{k}$ は $0$ でない固有値の単位固有ベクトルなので、1 からある $n(k)$ で $\lambda'_{k}=\mu_{n(k)}$, $e'_{k}=c_{k}e_{n(k)}$, $|c_{k}|=1$。1 次元の空間の二つの単位ベクトルは直交しないので、$k\mapsto n(k)$ は単射。また各 $n$ について、$e_{n}=\mu_{n}^{-1}Ge_{n}=\sum_{k}\frac{\lambda'_{k}}{\mu_{n}}\langle e_{n},e'_{k}\rangle e'_{k}\ne0$ から $\langle e_{n},e'_{k}\rangle\ne0$ となる $k$ があり、異なる固有値の固有ベクトルは直交する（\ref{fa:selfadjoint.1}）ので $n(k)=n$。よって $k\mapsto n(k)$ は全単射で、$\lambda'_{k}\langle f,e'_{k}\rangle e'_{k}=|c_{k}|^{2}\mu_{n(k)}\langle f,e_{n(k)}\rangle e_{n(k)}$。級数の和は並べ方によらない（\ref{fa:bessel.2}、係数 $\mu_{n}\langle f,e_{n}\rangle$ は $\langle Gf,e_{n}\rangle$ に等しい）ので、
$$
Gf=\sum_{n\ge1}\frac{1}{n^{2}\pi^{2}}\langle f,e_{n}\rangle e_{n}.
$$

**3.** $Gf=0$ とする。任意の $g\in L^{2}$ について $\langle f,Gg\rangle=\langle Gf,g\rangle=0$。$p$ を複素係数の多項式とし、$u(x)\defeq x(1-x)p(x)$ とおくと、$u$ は $C^{2}$ で $u(0)=u(1)=0$ なので、一意性から $G(-u'')=u$。よって $\langle f,x(1-x)p\rangle=0$、つまり $h\defeq x(1-x)f\in L^{2}$ について、すべての多項式 $p$ で $\langle h,p\rangle=0$（$x(1-x)$ は実数値）。

多項式は $L^{2}([0,1])$ で稠密である：$\varphi\in L^{2}([0,1])$ を $[0,1]$ の外で $0$ として $\mathbb{R}$ 上の関数とみると、\ref{meas:cc-dense}（実部と虚部に使う）から $\|\varphi-\psi\|_{L^{2}(\mathbb{R})}<\varepsilon$ となる $\psi\in C_{c}(\mathbb{R})$ があり、その $[0,1]$ への制限は $\|\varphi-\psi\|_{L^{2}([0,1])}<\varepsilon$ を満たす連続関数。さらに \ref{top:weierstrass-approximation}（実部と虚部に使う）から $\|\psi-p\|_{\infty}<\varepsilon$ となる多項式 $p$ があり、$[0,1]$ 上では $\|\psi-p\|_{2}\le\|\psi-p\|_{\infty}$ なので $\|\varphi-p\|_{2}<2\varepsilon$。

よって $h$ は稠密な部分空間と直交し、内積の連続性（\ref{fa:cauchy-schwarz}）から $\langle h,h\rangle=0$、$h=0$。$x(1-x)>0$（$0<x<1$）なので $f=0$（a.e.）。

したがって $\ker G=\{0\}$ で、\ref{fa:compact-selfadjoint-spectral} の分解と 2 の議論（$\{e'_{k}\}$ と $\{e_{n}\}$ は単位数倍を除いて一致する）から $L^{2}([0,1])=\overline{\operatorname{span}}\{e_{n}\}$。\ref{fa:orthonormal-basis}（2 ⇒ 基底）から $(e_{n})$ は正規直交基底である。（これは正弦関数系 $\{\sqrt2\sin(n\pi x)\}$ の完全性を、フーリエ解析を使わずに作用素論から導いたものである。）
