# スペクトルとバナッハ環 {#fa:page-spectrum keywords="Banach algebra, unital Banach algebra, B(X) and C(K), Neumann series, the group of invertible elements is open, continuity of inversion, spectrum, resolvent, resolvent identity, the spectrum is a nonempty compact set (Gelfand, via Liouville), spectral radius formula (Gelfand), spectra of multiplication operators and of shifts"}

有限次元では、線形写像 $T$ の固有値は「$\lambda-T$ が逆をもたない $\lambda$」で、代数閉体 $\mathbb{C}$ の上ではつねに存在する。無限次元の作用素では、$\lambda-T$ が単射でも全射でないことがあるので、固有値の代わりに**スペクトル** $\sigma(T)\defeq\{\lambda:\lambda-T\text{ が有界な逆をもたない}\}$ を考える。このページでは、作用素の積を備えた完備なノルム空間（**バナッハ環**）の一般論として、スペクトルが空でないコンパクト集合であること（**ゲルファントの定理**、リウヴィルの定理による）と、その半径が $\lim\|a^{n}\|^{1/n}$ で与えられること（**スペクトル半径の公式**）を示す。

## 記法と定義の確認 {#fa:sec-sp-notation}

::: notation
- バナッハ空間・有界作用素・$B(X)$ の完備性・絶対収束級数・ハーン–バナッハの帰結・一様有界性原理は \ref{fa:normed-space}, \ref{fa:operator-space-complete}, \ref{fa:absolute-series-completeness}, \ref{fa:hahn-banach-normed}, \ref{fa:uniform-boundedness}。第二双対への埋め込みは \ref{fa:bidual-embedding}。
- 正則関数とテイラー展開・リウヴィルの定理は \ref{cx:holomorphic}, \ref{cx:holomorphic-analytic}, \ref{cx:liouville}、冪級数の係数の一意性は \ref{cx:power-series-uniqueness}。
- このページのバナッハ環は**複素数**上とする（スペクトルが空でないことに必要）。
- **選択公理**：ハーン–バナッハの定理を通して使う。
:::

## バナッハ環と可逆元 {#fa:sec-sp-algebra}

::: definition バナッハ環 {#fa:banach-algebra keywords="unital complex Banach algebra: Banach space with associative bilinear product, ||ab|| <= ||a|| ||b||, unit with ||1|| = 1; invertible elements" index="バナッハ環|ばなっはかん, 可逆元（バナッハ環）|かぎゃくげんばなっはかん"}
複素バナッハ空間 $A$ に、結合的で双線形な積と単位元 $1$ があり、$\|ab\|\le\|a\|\|b\|$, $\|1\|=1$ を満たすとき、**（単位的）バナッハ環**という。$ab=ba=1$ となる $b$ があるとき $a$ は**可逆**といい、可逆元の全体を $G(A)$ と書く。
:::

::: example
1. 複素バナッハ空間 $X\ne0$ について $B(X)$（積は合成、単位元は恒等写像）。ノルムの条件は \ref{fa:continuity-boundedness}。有界な逆作用素をもつことが可逆。
2. コンパクトハウスドルフ空間 $K$ について $C(K)$（各点ごとの積）。$f$ が可逆 $\iff$ $f$ が零点をもたない。
:::

::: proposition ノイマン級数 {#fa:neumann-series keywords="if ||a|| < 1 then 1 - a is invertible with inverse sum a^n and ||(1-a)^{-1}|| <= 1/(1 - ||a||)" index="ノイマン級数|のいまんきゅうすう"}
$\|a\|<1$ なら $1-a$ は可逆で、$(1-a)^{-1}=\sum_{n\ge0}a^{n}$、$\|(1-a)^{-1}\|\le\frac{1}{1-\|a\|}$。
:::

::: proof
$\|a^{n}\|\le\|a\|^{n}$ なので級数は絶対収束し、収束する（\ref{fa:absolute-series-completeness}）。和 $s$ について $(1-a)\sum_{n\le N}a^{n}=1-a^{N+1}\to1$ で、積の連続性（$\|ab\|\le\|a\|\|b\|$）から $(1-a)s=1$、同様に $s(1-a)=1$。ノルムは等比級数で押さえる。
:::

::: proposition 可逆元の集合 {#fa:invertibles-open keywords="the group of invertible elements is open and inversion is continuous; if a is invertible and ||b - a|| < 1/||a^{-1}|| then b is invertible" index="可逆元の集合は開|かぎゃくげんのしゅうごうはかい"}
$a\in G(A)$, $\|b-a\|<\|a^{-1}\|^{-1}$ なら $b\in G(A)$ で、$\|b^{-1}-a^{-1}\|\le\frac{\|a^{-1}\|^{2}\|b-a\|}{1-\|a^{-1}\|\|b-a\|}$。とくに $G(A)$ は開集合で、$a\mapsto a^{-1}$ は連続。
:::

::: proof
$b=a(1-a^{-1}(a-b))$ で $\|a^{-1}(a-b)\|<1$ なので \ref{fa:neumann-series} から $b$ は可逆、$b^{-1}=(1-a^{-1}(a-b))^{-1}a^{-1}$。$b^{-1}-a^{-1}=b^{-1}(a-b)a^{-1}$ で、$\|b^{-1}\|\le\frac{\|a^{-1}\|}{1-\|a^{-1}\|\|a-b\|}$ から評価。
:::

## スペクトル {#fa:sec-sp-spectrum}

::: definition スペクトルとレゾルベント {#fa:spectrum keywords="spectrum sigma(a) = {lambda: lambda - a not invertible}; resolvent set; resolvent R(lambda) = (lambda - a)^{-1}; spectral radius" index="スペクトル|すぺくとる, レゾルベント|れぞるべんと, スペクトル半径|すぺくとるはんけい"}
$a\in A$ について $\sigma(a)\defeq\{\lambda\in\mathbb{C}:\lambda-a\notin G(A)\}$ を**スペクトル**、その補集合 $\rho(a)$ を**レゾルベント集合**、$R(\lambda)\defeq(\lambda-a)^{-1}$（$\lambda\in\rho(a)$）を**レゾルベント**、$r(a)\defeq\sup\{|\lambda|:\lambda\in\sigma(a)\}$ を**スペクトル半径**という（$\lambda-a$ は $\lambda1-a$ の略）。
:::

::: theorem スペクトルは空でないコンパクト集合 {#fa:spectrum-nonempty-compact keywords="Gelfand: the spectrum of an element of a complex unital Banach algebra is a nonempty compact subset of the disk of radius ||a||; the resolvent is holomorphic; resolvent identity" index="ゲルファントの定理（スペクトル）|げるふぁんとのていりすぺくとる, レゾルベント恒等式|れぞるべんとこうとうしき"}
$A\ne0$ を複素バナッハ環、$a\in A$ とする。
1. $\sigma(a)\subset\{|\lambda|\le\|a\|\}$ で、$\sigma(a)$ は閉集合、したがってコンパクト。
2. （レゾルベント恒等式）$R(\lambda)-R(\mu)=(\mu-\lambda)R(\lambda)R(\mu)$。
3. 任意の $\varphi\in A^{*}$ について $\lambda\mapsto\varphi(R(\lambda))$ は $\rho(a)$ 上の正則関数。
4. $\sigma(a)\ne\varnothing$。
:::

::: proof
**1.** $|\lambda|>\|a\|$ なら $\lambda-a=\lambda(1-a/\lambda)$ は \ref{fa:neumann-series} で可逆。$\rho(a)$ は、連続写像 $\lambda\mapsto\lambda-a$ による開集合 $G(A)$（\ref{fa:invertibles-open}）の逆像なので開。

**2.** $R(\lambda)-R(\mu)=R(\lambda)\bigl((\mu-a)-(\lambda-a)\bigr)R(\mu)$。

**3.** 2 と逆元の連続性から $\frac{R(\lambda)-R(\mu)}{\lambda-\mu}=-R(\lambda)R(\mu)\to-R(\mu)^{2}$（$\lambda\to\mu$）なので、$\varphi(R(\lambda))$ は複素微分可能（\ref{cx:holomorphic}）。

**4.** $\sigma(a)=\varnothing$ と仮定する。$|\lambda|>2\|a\|$ なら $\|R(\lambda)\|=|\lambda|^{-1}\|(1-a/\lambda)^{-1}\|\le\frac{|\lambda|^{-1}}{1-\|a\|/|\lambda|}\le\frac{2}{|\lambda|}\to0$。$\varphi\in A^{*}$ について $f(\lambda)\defeq\varphi(R(\lambda))$ は $\mathbb{C}$ 全体で正則（3）で、$|\lambda|\le2\|a\|$ では連続関数としてコンパクト集合上有界、外では $\le2\|\varphi\|/|\lambda|$ なので有界。\ref{cx:liouville} から定数で、$\lambda\to\infty$ の極限から $f\equiv0$。これがすべての $\varphi$ で成り立つので、\ref{fa:hahn-banach-normed.2} から $R(0)=a^{-1}=0$。しかし $0=a^{-1}$ なら $1=aa^{-1}=0$ で、$A\ne0$ に反する（$\|1\|=1$）。

::: hypcheck
- **複素数**：4 でリウヴィルの定理を使った。実バナッハ環では偽：$\mathbb{R}^{2}$ の回転 $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ は実数のスペクトルをもたない。
- **完備性**：ノイマン級数の収束（1）に使った。
:::
:::

::: theorem スペクトル半径の公式 {#fa:spectral-radius keywords="Gelfand's spectral radius formula r(a) = lim ||a^n||^{1/n} = inf ||a^n||^{1/n}" index="スペクトル半径の公式|すぺくとるはんけいのこうしき"}
$r(a)=\lim_{n\to\infty}\|a^{n}\|^{1/n}=\inf_{n}\|a^{n}\|^{1/n}$。
:::

::: proof
**Step 1（$r(a)\le\inf\|a^{n}\|^{1/n}$）.** $\lambda\in\sigma(a)$ と $n\ge1$ について、$\lambda^{n}-a^{n}=(\lambda-a)b=b(\lambda-a)$（$b\defeq\sum_{k<n}\lambda^{n-1-k}a^{k}$ は $a$ と可換）。$\lambda^{n}-a^{n}$ が可逆なら、$(\lambda-a)\bigl(b(\lambda^{n}-a^{n})^{-1}\bigr)=1$ かつ $\bigl((\lambda^{n}-a^{n})^{-1}b\bigr)(\lambda-a)=1$ で、左逆と右逆が一致して $\lambda-a$ が可逆になる。よって $\lambda^{n}\in\sigma(a^{n})$ で、\ref{fa:spectrum-nonempty-compact.1} から $|\lambda|^{n}\le\|a^{n}\|$。

**Step 2（$\limsup\|a^{n}\|^{1/n}\le r(a)$）.** $\varphi\in A^{*}$ について $h(\mu)\defeq\varphi((1-\mu a)^{-1})$ を考える。$\mu\ne0$ なら $1-\mu a=\mu(\mu^{-1}-a)$ なので、$|\mu|<1/r(a)$（$r(a)=0$ なら $\mathbb{C}$ 全体）で $1-\mu a$ は可逆で、\ref{fa:spectrum-nonempty-compact.3} と同じ議論で $h$ はこの円板上正則。$|\mu|<1/\|a\|$ では \ref{fa:neumann-series} から $h(\mu)=\sum_{n}\varphi(a^{n})\mu^{n}$。\ref{cx:holomorphic-analytic} から $h$ のテイラー級数は円板 $|\mu|<1/r(a)$ 全体で収束し、係数の一意性（\ref{cx:power-series-uniqueness}）からその係数は $\varphi(a^{n})$。よって $|\mu|<1/r(a)$ を固定すると、すべての $\varphi$ で $\sup_{n}|\varphi(\mu^{n}a^{n})|<\infty$。$J(\mu^{n}a^{n})\in A^{**}$ に \ref{fa:uniform-boundedness}（$A^{*}$ はバナッハ空間）を使うと $\sup_{n}|\mu|^{n}\|a^{n}\|=C<\infty$（\ref{fa:bidual-embedding}）。$\|a^{n}\|^{1/n}\le C^{1/n}/|\mu|$ から $\limsup\|a^{n}\|^{1/n}\le1/|\mu|$、$|\mu|\uparrow1/r(a)$。

**Step 3.** Step 1・2 から $\limsup\le r(a)\le\inf\le\liminf$ なので極限が存在して等しい。
:::

::: example 掛け算作用素とシフト {#fa:spectrum-examples keywords="spectrum of multiplication operators on C(K) is the range; the right shift on l^2 has norm 1, no eigenvalues and spectrum the closed unit disk" index="シフト作用素|しふとさようそ, 掛け算作用素|かけざんさようそ"}
1. $C(K)$ で $\sigma(f)=f(K)$。
2. $\ell^{2}(\mathbb{N})$ の右シフト $S(x_{1},x_{2},\dots)\defeq(0,x_{1},x_{2},\dots)$ は等長で固有値をもたず、$\sigma(S)=\{|\lambda|\le1\}$。
:::

::: proof
**1.** $\lambda-f$ が可逆 $\iff$ $\lambda-f$ が零点をもたない $\iff$ $\lambda\notin f(K)$（可逆なら逆元 $1/(\lambda-f)$ は連続）。

**2.** $\|Sx\|=\|x\|$ なので $\|S\|=1$、\ref{fa:spectrum-nonempty-compact.1} から $\sigma(S)\subset\{|\lambda|\le1\}$。$Sx=\lambda x$ なら $0=\lambda x_{1}$, $x_{1}=\lambda x_{2}$, … から $x=0$（$\lambda=0$ なら $x=0$ はすぐ、$\lambda\ne0$ なら順に $x_{1}=x_{2}=\dots=0$）。$|\lambda|<1$ なら $\lambda-S$ は全射でない：左シフト $L(x)\defeq(x_{2},x_{3},\dots)$ について $LS=I$ で、$(\lambda-S)x=e_{1}$ と仮定すると、$y\defeq(1,\bar\lambda,\bar\lambda^{2},\dots)\in\ell^{2}$ について $\langle(\lambda-S)x,y\rangle=\langle x,(\bar\lambda-L)y\rangle=0$（$Ly=\bar\lambda y$）だが $\langle e_{1},y\rangle=1$ で矛盾。よって $\{|\lambda|<1\}\subset\sigma(S)$ で、$\sigma(S)$ は閉なので閉円板を含む。
:::

::: supplement
**高い視点：スペクトルは「代数の中の点」.** 可換なバナッハ環 $A$ では、$\sigma(a)$ は「$A$ から $\mathbb{C}$ への単位的な準同型（指標）$\chi$ による値 $\chi(a)$ の全体」に等しく、指標の空間（極大イデアル空間）はコンパクトハウスドルフ空間になる（ゲルファント理論。知られている）。$C(K)$ では指標は点での評価だけで、$\sigma(f)=f(K)$ はその最も簡単な例である。スペクトル半径の公式は、代数的な量（スペクトル）が計量的な量（ノルムの冪の増大度）で決まることを言い、その証明で複素解析（レゾルベントの正則性）が本質的に効いている。比喩で言えば、スペクトルは作用素の「音域」で、どの音域にも少なくとも一つの音がある（空でない）こと、最高音の高さは繰り返し鳴らしたときの音量の増え方で測れること（半径の公式）がこのページの内容である。
:::

## 問題 {#fa:sec-sp-problems}

::: problem {#fa:prob-sp-nilpotent-like}
$C([0,1])$ 上の積分作用素 $(Vf)(x)\defeq\int_{0}^{x}f(t)\,dt$（ヴォルテラ作用素、$\|\cdot\|_{\infty}$）について $\|V^{n}\|\le\frac{1}{n!}$ を示し、$\sigma(V)=\{0\}$ を導け。
:::

::: solution
帰納法で $|V^{n}f(x)|\le\frac{x^{n}}{n!}\|f\|_{\infty}$：$n=0$ は自明、$|V^{n+1}f(x)|\le\int_{0}^{x}\frac{t^{n}}{n!}\|f\|\,dt=\frac{x^{n+1}}{(n+1)!}\|f\|$。よって $\|V^{n}\|\le\frac{1}{n!}$、$\|V^{n}\|^{1/n}\le(n!)^{-1/n}\to0$（$n!\ge(n/e)^{n}$ は $\log n!\ge\int_{1}^{n}\log t\,dt=n\log n-n+1$ から）。\ref{fa:spectral-radius} から $r(V)=0$、\ref{fa:spectrum-nonempty-compact.4} から $\sigma(V)=\{0\}$。（$V$ は単射だが全射でない：像の関数は $0$ で値 $0$。$0\in\sigma(V)$ は固有値でない。）
:::

::: problem {#fa:prob-sp-commutator}
バナッハ環で $ab-ba=1$ となる $a,b$ は存在しないことを示せ（ヒント：$ab^{n}-b^{n}a=nb^{n-1}$ を示し、$\|b^{n}\|$ を評価せよ）。
:::

::: solution
帰納法：$ab^{n+1}-b^{n+1}a=(ab^{n}-b^{n}a)b+b^{n}(ab-ba)=nb^{n}+b^{n}=(n+1)b^{n}$。すべての $m$ で $b^{m}\ne0$ なら、$n\|b^{n-1}\|=\|ab^{n}-b^{n}a\|\le2\|a\|\|b\|\|b^{n-1}\|$ から $n\le2\|a\|\|b\|$ がすべての $n$ で成り立ち矛盾。そうでなければ $b^{m}=0$ となる最小の $m\ge0$ をとる。$m=0$ なら $1=0$ で $A=0$（$\|1\|=1$ に反する）。$m\ge1$ なら $mb^{m-1}=ab^{m}-b^{m}a=0$ から $b^{m-1}=0$ となり最小性に反する。
:::
