# 自己共役コンパクト作用素のスペクトル定理 {#fa:page-spectral-theorem-compact keywords="adjoint of a bounded operator on a Hilbert space, ||T*T|| = ||T||^2, self-adjoint operators, real eigenvalues and orthogonal eigenvectors, norm of a self-adjoint operator as sup |<Tx,x>|, existence of an eigenvalue of modulus ||T|| for compact self-adjoint operators, spectral theorem: eigenvalue expansion, orthonormal basis of eigenvectors, Hilbert-Schmidt integral operators, eigenfunctions of the kernel min(x,y)"}

有限次元では、エルミート行列はユニタリ行列で対角化できる（スペクトル定理）。このページでは、その無限次元版として、ヒルベルト空間上の**自己共役なコンパクト作用素**が、固有ベクトルからなる正規直交系で対角化できること
$$
Tx=\sum_{k}\lambda_{k}\langle x,e_{k}\rangle e_{k}\qquad(\lambda_{k}\in\mathbb{R}\setminus\{0\},\ \lambda_{k}\to0)
$$
を示す。鍵は、自己共役作用素のノルムが 2 次形式 $\langle Tx,x\rangle$ の最大値で与えられ、コンパクト性からその最大値を実現する固有ベクトルが存在することである。応用として、2 乗可積分な核をもつ積分作用素（**ヒルベルト–シュミット作用素**）がコンパクトであることを示し、対称な核の固有関数展開を得る。

## 記法と定義の確認 {#fa:sec-st-notation}

::: notation
- ヒルベルト空間・コーシー–シュワルツ・直交分解・リースの表現定理・ベッセルの不等式・正規直交基底は \ref{fa:inner-product}, \ref{fa:cauchy-schwarz}, \ref{fa:orthogonal-decomposition}, \ref{fa:riesz-representation}, \ref{fa:bessel}, \ref{fa:orthonormal-basis}。
- コンパクト作用素とそのスペクトルは \ref{fa:compact-operator}, \ref{fa:compact-ideal}, \ref{fa:compact-spectrum}。
- トネリ・フビニの定理は \ref{meas:tonelli}, \ref{meas:fubini}。
- $H$ は複素（または実）ヒルベルト空間。
- **選択公理**：正規直交基底の存在（ツォルンの補題）で使う。
:::

## 共役作用素と自己共役作用素 {#fa:sec-st-adjoint}

::: proposition 共役作用素 {#fa:adjoint keywords="adjoint T* of a bounded operator on a Hilbert space: <Tx,y> = <x,T*y>; ||T*|| = ||T||; (ST)* = T*S*; ||T*T|| = ||T||^2" index="共役作用素|きょうやくさようそ, 随伴作用素|ずいはんさようそ"}
$T\in B(H)$ について、$\langle Tx,y\rangle=\langle x,T^{*}y\rangle$（すべての $x,y$）となる $T^{*}\in B(H)$ がただ一つあり、$\|T^{*}\|=\|T\|$、$T^{**}=T$、$(ST)^{*}=T^{*}S^{*}$、$\|T^{*}T\|=\|T\|^{2}$。
:::

::: proof
$y$ を固定すると $x\mapsto\langle Tx,y\rangle$ は有界線形汎関数なので、\ref{fa:riesz-representation} からただ一つの $T^{*}y$ で表される。$T^{*}$ の線形性は一意性から。$\|T^{*}y\|^{2}=\langle TT^{*}y,y\rangle\le\|T\|\|T^{*}y\|\|y\|$ から $\|T^{*}\|\le\|T\|$。$T^{**}=T$（定義の対称性）から等号。$(ST)^{*}$ は定義から。$\|Tx\|^{2}=\langle T^{*}Tx,x\rangle\le\|T^{*}T\|\|x\|^{2}$ から $\|T\|^{2}\le\|T^{*}T\|\le\|T^{*}\|\|T\|=\|T\|^{2}$。
:::

::: proposition 自己共役作用素 {#fa:selfadjoint keywords="self-adjoint operator: T* = T; <Tx,x> is real; eigenvalues are real; eigenvectors for distinct eigenvalues are orthogonal; invariant subspaces have invariant orthogonal complements; ||T|| = sup over unit x of |<Tx,x>|" index="自己共役作用素|じこきょうやくさようそ, エルミート作用素|えるみーとさようそ"}
$T=T^{*}$（**自己共役**）とする。
1. $\langle Tx,x\rangle\in\mathbb{R}$。固有値は実数で、異なる固有値の固有ベクトルは直交する。
2. $TM\subset M$ なら $TM^{\perp}\subset M^{\perp}$。
3. $\|T\|=\sup_{\|x\|=1}|\langle Tx,x\rangle|$。
:::

::: proof
**1.** $\langle Tx,x\rangle=\langle x,Tx\rangle=\overline{\langle Tx,x\rangle}$。$Tx=\lambda x$（$x\ne0$）なら $\lambda\|x\|^{2}=\langle Tx,x\rangle\in\mathbb{R}$。$Tx=\lambda x$, $Ty=\mu y$, $\lambda\ne\mu$ なら $\lambda\langle x,y\rangle=\langle Tx,y\rangle=\langle x,Ty\rangle=\mu\langle x,y\rangle$（$\mu$ は実数）。

**2.** $y\in M^{\perp}$, $m\in M$ なら $\langle Ty,m\rangle=\langle y,Tm\rangle=0$。

**3.** $M\defeq\sup_{\|x\|=1}|\langle Tx,x\rangle|\le\|T\|$。逆に、自己共役性から
$$
\langle T(x+y),x+y\rangle-\langle T(x-y),x-y\rangle=2\langle Tx,y\rangle+2\langle Ty,x\rangle=4\operatorname{Re}\langle Tx,y\rangle
$$
で、左辺の絶対値は $\le M(\|x+y\|^{2}+\|x-y\|^{2})=2M(\|x\|^{2}+\|y\|^{2})$（中線定理）。$\|x\|=1$, $Tx\ne0$, $y\defeq Tx/\|Tx\|$ とすると $4\|Tx\|\le4M$。
:::

## スペクトル定理 {#fa:sec-st-theorem}

::: lemma 最大固有値の存在 {#fa:extremal-eigenvalue keywords="a compact self-adjoint operator has an eigenvalue lambda with |lambda| = ||T||" index="最大固有値|さいだいこゆうち"}
$T\ne0$ を自己共役なコンパクト作用素とすると、$\|T\|$ または $-\|T\|$ は $T$ の固有値。
:::

::: proof
\ref{fa:selfadjoint.3} から、単位ベクトル $x_{n}$ で $\langle Tx_{n},x_{n}\rangle\to\lambda$, $|\lambda|=\|T\|$ となるものがある（$\langle Tx,x\rangle$ は実数なので、部分列をとって符号をそろえる）。
$$
\|Tx_{n}-\lambda x_{n}\|^{2}=\|Tx_{n}\|^{2}-2\lambda\langle Tx_{n},x_{n}\rangle+\lambda^{2}\le2\lambda^{2}-2\lambda\langle Tx_{n},x_{n}\rangle\to0.
$$
コンパクト性から部分列で $Tx_{n}\to y$、よって $\lambda x_{n}\to y$、$\|y\|=|\lambda|\ne0$。$T$ の連続性から $Ty=\lim\lambda Tx_{n}=\lambda y$。
:::

::: theorem 自己共役コンパクト作用素のスペクトル定理 {#fa:compact-selfadjoint-spectral keywords="spectral theorem for compact self-adjoint operators: Tx = sum lambda_k <x,e_k> e_k with an orthonormal family of eigenvectors and real nonzero eigenvalues tending to 0; H = ker T plus the closed span of the e_k; orthonormal basis of eigenvectors" index="スペクトル定理（コンパクト作用素）|すぺくとるていりこんぱくとさようそ, 固有値展開|こゆうちてんかい"}
$T$ を $H$ 上の自己共役なコンパクト作用素とする。有限または可算な正規直交系 $(e_{k})$ と実数 $\lambda_{k}\ne0$（$|\lambda_{1}|\ge|\lambda_{2}|\ge\cdots$、無限個なら $\lambda_{k}\to0$）で、$Te_{k}=\lambda_{k}e_{k}$ かつ
$$
Tx=\sum_{k}\lambda_{k}\langle x,e_{k}\rangle e_{k}\qquad(x\in H)
$$
となるものがある。$H=\ker T\oplus\overline{\operatorname{span}}\{e_{k}\}$ で、$H$ は $T$ の固有ベクトルからなる正規直交基底をもつ。
:::

::: proof
**Step 1（帰納的な構成）.** $H_{1}\defeq H$ とする。$T\restriction H_{n}\ne0$ なら、$H_{n}$ は $T$ で不変な閉部分空間で、$T\restriction H_{n}$ は自己共役かつコンパクトなので、\ref{fa:extremal-eigenvalue} から単位ベクトル $e_{n}\in H_{n}$ と $\lambda_{n}$ で $Te_{n}=\lambda_{n}e_{n}$, $|\lambda_{n}|=\|T\restriction H_{n}\|$ となるものをとり、$H_{n+1}\defeq H_{n}\cap\{e_{n}\}^{\perp}$ とする（\ref{fa:selfadjoint.2} から不変、従属選択公理）。$T\restriction H_{n}=0$ となったら止める。$H_{n+1}\subset H_{n}$ なので $|\lambda_{n}|$ は単調非増加。

**Step 2（$\lambda_{k}\to0$）.** 無限に続き $|\lambda_{k}|\ge\varepsilon>0$ なら、$\|Te_{k}-Te_{j}\|^{2}=\lambda_{k}^{2}+\lambda_{j}^{2}\ge2\varepsilon^{2}$（$k\ne j$、直交）で、コンパクト性に反する。

**Step 3（展開）.** $x\in H$ について $x_{n}\defeq x-\sum_{k<n}\langle x,e_{k}\rangle e_{k}$ は $e_{1},\dots,e_{n-1}$ と直交するので $H_{n}$ に属し、$\|x_{n}\|\le\|x\|$（ベッセル）。$Tx_{n}=Tx-\sum_{k<n}\lambda_{k}\langle x,e_{k}\rangle e_{k}$ で、$\|Tx_{n}\|\le|\lambda_{n}|\|x\|\to0$（無限の場合）。有限個 $N$ で止まった場合は $x_{N+1}\in H_{N+1}$ で $Tx_{N+1}=0$。

**Step 4（分解）.** 展開から $Tx=0\iff$ すべての $k$ で $\langle x,e_{k}\rangle=0$（係数 $\lambda_{k}\ne0$、正規直交系の和の一意性）なので $\ker T=\{e_{k}\}^{\perp}$、\ref{fa:orthogonal-decomposition.3} から $H=\ker T\oplus\overline{\operatorname{span}}\{e_{k}\}$。$\ker T$ の正規直交基底（\ref{fa:orthonormal-basis}、選択公理）と $(e_{k})$ を合わせれば固有ベクトルの正規直交基底。
:::

## ヒルベルト–シュミット作用素 {#fa:sec-st-hilbert-schmidt}

::: theorem ヒルベルト–シュミット積分作用素 {#fa:hilbert-schmidt keywords="for a sigma-finite measure and k in L^2(mu x mu), Kf(x) = int k(x,y) f(y) dmu(y) is a bounded operator on L^2 with ||K|| <= ||k||_2, it is compact, and it is self-adjoint if k(x,y) = conj k(y,x)" index="ヒルベルト–シュミット作用素|ひるべるとしゅみっとさようそ, 積分作用素（L2）|せきぶんさようそえるつー"}
$(X,\mathcal{M},\mu)$ を σ 有限、$k\in L^{2}(\mu\otimes\mu)$ とする。
1. $(Kf)(x)\defeq\int k(x,y)f(y)\,d\mu(y)$ は $L^{2}(\mu)$ 上の有界作用素で $\|K\|\le\|k\|_{2}$。
2. 任意の正規直交基底 $(e_{j})_{j\in J}$ について $\sum_{j}\|Ke_{j}\|^{2}\le\|k\|_{2}^{2}$。
3. $K$ はコンパクト。
4. $k(x,y)=\overline{k(y,x)}$（a.e.）なら $K$ は自己共役。
:::

::: proof
**Step 1（1）.** \ref{meas:tonelli} から $\int\bigl(\int|k(x,y)|^{2}d\mu(y)\bigr)d\mu(x)=\|k\|_{2}^{2}<\infty$ なので、ほとんどすべての $x$ で $k_{x}\defeq k(x,\cdot)\in L^{2}$、コーシー–シュワルツから $|Kf(x)|\le\|k_{x}\|_{2}\|f\|_{2}$。$x\mapsto Kf(x)$ の可測性は、$\mu(X_{n})<\infty$ となる $X_{n}$ の上で $\int_{X_{n}}\int|k(x,y)f(y)|\le\int_{X_{n}}\|k_{x}\|\|f\|\le\mu(X_{n})^{1/2}\|k\|_{2}\|f\|_{2}<\infty$ なので、\ref{meas:fubini} を $X_{n}\times X$ に使って得られる。2 乗して積分すると $\|Kf\|_{2}^{2}\le\|k\|_{2}^{2}\|f\|_{2}^{2}$。

**Step 2（2）.** $Ke_{j}(x)=\langle k_{x},\overline{e_{j}}\rangle$ で、$(\overline{e_{j}})$ も正規直交系。有限集合 $F\subset J$ について、ベッセルの不等式（\ref{fa:bessel.1}）から $\sum_{j\in F}|Ke_{j}(x)|^{2}\le\|k_{x}\|_{2}^{2}$（a.e. $x$）、積分して $\sum_{j\in F}\|Ke_{j}\|^{2}\le\|k\|_{2}^{2}$。$F$ について上限をとる。

**Step 3（3）.** 2 から $\|Ke_{j}\|\ne0$ となる $j$ は可算個で、$\varepsilon>0$ について有限集合 $F$ で $\sum_{j\notin F}\|Ke_{j}\|^{2}<\varepsilon^{2}$ となるものがある。$P_{F}$ を $\operatorname{span}\{e_{j}:j\in F\}$ への直交射影とすると、$KP_{F}$ は有限階数で、$x=\sum_{j}\langle x,e_{j}\rangle e_{j}$（\ref{fa:orthonormal-basis}）と $K$ の連続性から $(K-KP_{F})x=\sum_{j\notin F}\langle x,e_{j}\rangle Ke_{j}$。コーシー–シュワルツ（数列の）から $\|(K-KP_{F})x\|\le\bigl(\sum_{j\notin F}|\langle x,e_{j}\rangle|^{2}\bigr)^{1/2}\bigl(\sum_{j\notin F}\|Ke_{j}\|^{2}\bigr)^{1/2}\le\varepsilon\|x\|$。\ref{fa:compact-ideal.4} からコンパクト。

**Step 4（4）.** $f,g\in L^{2}$ について、$|k(x,y)f(y)\overline{g(x)}|$ の積分はコーシー–シュワルツとトネリから $\le\|k\|_{2}\|f\|_{2}\|g\|_{2}<\infty$ なので、\ref{meas:fubini} で積分の順序を交換でき、$\langle Kf,g\rangle=\iint k(x,y)f(y)\overline{g(x)}=\int f(y)\overline{\int\overline{k(x,y)}g(x)\,d\mu(x)}\,d\mu(y)=\langle f,Kg\rangle$（$\overline{k(x,y)}=k(y,x)$）。
:::

::: example 核 min(x,y) の固有関数 {#fa:min-kernel-eigen keywords="the integral operator with kernel min(x,y) on L^2[0,1] has eigenvalues 1/((n - 1/2)^2 pi^2) with eigenfunctions sqrt(2) sin((n - 1/2) pi x)" index="核 min(x,y)|かくみん"}
$L^{2}([0,1])$ 上の $Kf(x)\defeq\int_{0}^{1}\min(x,y)f(y)\,dy$ は自己共役なコンパクト作用素で、$0$ でない固有値は $\lambda_{n}=\frac{1}{(n-\frac12)^{2}\pi^{2}}$、固有関数は $\sqrt2\sin((n-\frac12)\pi x)$（$n\ge1$）。
:::

::: proof
核は連続で対称なので \ref{fa:hilbert-schmidt} から自己共役なコンパクト作用素。$u\defeq Kf=\int_{0}^{x}yf(y)\,dy+x\int_{x}^{1}f(y)\,dy$ は、$f$ が連続なら $C^{2}$ で $u'(x)=\int_{x}^{1}f$, $u''=-f$, $u(0)=0$, $u'(1)=0$。$Kf=\lambda f$（$\lambda\ne0$）なら $f=\lambda^{-1}Kf$ は連続（$Kf$ は連続、コーシー–シュワルツと $\min$ の連続性）で、さらに $C^{2}$、$\lambda f''=-f$, $f(0)=0$, $f'(1)=0$。$\lambda<0$ や解の形を調べると、$f(0)=0$ から $f=c\sin(\omega x)$（$\lambda=\omega^{-2}>0$）の形に限られ（$\lambda<0$ なら $f=c\sinh(\omega x)$ で $f'(1)=c\omega\cosh\omega\ne0$）、$f'(1)=0$ から $\cos\omega=0$、$\omega=(n-\frac12)\pi$。逆に $f_{n}(x)\defeq\sin((n-\frac12)\pi x)$ について $Kf_{n}$ を直接計算すると $\lambda_{n}f_{n}$（$u\defeq\lambda_{n}f_{n}$ は $u''=-f_{n}$, $u(0)=0$, $u'(1)=0$ を満たし、この境界値問題の解は一意：差 $w$ が $w''=0$, $w(0)=0$, $w'(1)=0$ なら $w=0$）。正規化 $\int_{0}^{1}\sin^{2}((n-\frac12)\pi x)dx=\frac12$ から $\sqrt2$ を掛ける。
:::

::: supplement
**高い視点：無限次元の対角化.** スペクトル定理は、自己共役なコンパクト作用素が「固有ベクトルの正規直交基底の上の対角行列 $\operatorname{diag}(\lambda_{k})$（$\lambda_{k}\to0$）」とユニタリ同値であることを言っている。コンパクトでない自己共役作用素（たとえば $L^{2}(\mathbb{R})$ 上の掛け算作用素 $f\mapsto xf$）は固有ベクトルをもたないこともあり、対角化は「射影値測度による積分」$T=\int\lambda\,dE(\lambda)$ に一般化される（一般のスペクトル定理。知られている。量子力学の観測量の数学的な土台）。$\min(x,y)$ の例は、境界値問題 $-u''=f$ のグリーン関数の固有関数展開で、正弦級数による展開が「微分作用素の逆（コンパクト作用素）の対角化」から得られることを示している。比喩で言えば、自己共役なコンパクト作用素は「互いに直交する無数の弦の振動」で、スペクトル定理は、どんな状態も各弦の振動（固有関数）の重ね合わせで書け、作用素は各弦を固有の倍率 $\lambda_{k}$ で伸び縮みさせるだけだと言っている。
:::

## 問題 {#fa:sec-st-problems}

::: problem {#fa:prob-st-positive}
自己共役なコンパクト作用素 $T$ が**正**（すべての $x$ で $\langle Tx,x\rangle\ge0$）なら、固有値はすべて $\ge0$ で、$S^{2}=T$ となる正の自己共役コンパクト作用素 $S$ があることを示せ。
:::

::: solution
$Te=\lambda e$（$\|e\|=1$）なら $\lambda=\langle Te,e\rangle\ge0$。\ref{fa:compact-selfadjoint-spectral} の展開で $Sx\defeq\sum_{k}\sqrt{\lambda_{k}}\langle x,e_{k}\rangle e_{k}$ とおく。$\sqrt{\lambda_{k}}\to0$ なので、有限和の作用素で $\|S-S_{N}\|\le\sup_{k>N}\sqrt{\lambda_{k}}\to0$（正規直交系の係数のピタゴラス）、よってコンパクト（\ref{fa:compact-ideal.4}）。自己共役で $\langle Sx,x\rangle=\sum\sqrt{\lambda_{k}}|\langle x,e_{k}\rangle|^{2}\ge0$。$S^{2}x=\sum\lambda_{k}\langle x,e_{k}\rangle e_{k}=Tx$（$Se_{k}=\sqrt{\lambda_{k}}e_{k}$ と $S$ の連続性）。
:::

::: problem {#fa:prob-st-rayleigh}
自己共役なコンパクト作用素 $T$ の正の固有値のうち最大のもの $\mu$（正の固有値は $\mu$ 以上の範囲に有限個しかないので最大値がある、\ref{fa:compact-spectrum.2}）について、$\mu=\max_{\|x\|=1}\langle Tx,x\rangle$ であることを示せ（正の固有値がある場合）。
:::

::: solution
\ref{fa:compact-selfadjoint-spectral} の展開から、$\|x\|=1$ について $\langle Tx,x\rangle=\sum_{k}\lambda_{k}|\langle x,e_{k}\rangle|^{2}\le\mu\sum_{k:\lambda_{k}>0}|\langle x,e_{k}\rangle|^{2}\le\mu$（負の項は捨て、正の $\lambda_{k}$ は $\le\mu$、ベッセルの不等式）。$x=e$（$\mu$ の単位固有ベクトル）で等号。
:::
