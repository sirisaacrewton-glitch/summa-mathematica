# 演習：安定性と境界値問題 {#ode:page-exercises-stability keywords="exercises, stability, limit cycles, Sturm-Liouville"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な系の平衡点の分類と線形化、ジョルダン細胞をもつ線形系、重みをつけた二次形式のリャプノフ関数とチェタエフ関数、減衰のある系への不変性原理、二重井戸のハミルトン系と減衰、二つの周期軌道をもつ系の極限集合、円環の捕獲領域、デュラック関数による周期軌道の非存在、ただ一つのリミットサイクルをもつ系、変数係数のグリーン関数、共振する境界値問題、正弦級数による級数の値、オイラー型の固有値問題である。いくつかのページの結果を組み合わせる問題として、ロジスティック型の捕食者–被食者系の大域的な振る舞いと、ロバン境界条件の固有値問題（固有値の位置、グリーン関数による和、固有関数展開）を置いた。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#ode:sec-exstab-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。自励系 $x'=f(x)$ の流れを $\Phi_{t}$、$\xi$ を通る最大解の定義域を $I_{\xi}$ と書き、平面の系の右辺は $F$ とも書く。$V$ の軌道微分は $\dot V=\langle\nabla V,f\rangle$（\ref{ode:lyapunov-function}）で、解 $x(t)$ に沿って $\frac{d}{dt}V(x(t))=\dot V(x(t))$。
- 平面の系では $\rho\defeq x^{2}+y^{2}$ と書くことがある。$f=(f_{1},f_{2})$ について $xf_{1}+yf_{2}=\frac12\dot\rho$、$xf_{2}-yf_{1}$ は偏角の変化率に $\rho$ を掛けたものである（\see{ode:prob-pl-polar-limit-sets} の解答の 1 と同じ計算）。
- 1 変数の自励系 $\rho'=\varphi(\rho)$（$\varphi$ は $C^{1}$ 級）については、次を断りなく使う：$\varphi$ の零点は定数解で、一意性（\ref{ode:maximal-solution}）から他の解はそれを越えない。したがって解は隣り合う零点の間に留まって単調で、有界な範囲に留まる向きには大域的に定義され（\ref{ode:escape-corollaries.3}）、極限 $L$ は $\varphi(L)=0$ を満たす（$\varphi(L)\neq0$ なら、やがて $|\rho'|\ge|\varphi(L)|/2$ となり有界でなくなる）。
- **選択公理**：引用する各ページの結果に含まれるもの（スツルム–リウヴィルの固有値問題と固有関数展開を通した従属選択公理）のほかには使わない。
:::

## 平衡点の安定性 {#ode:sec-st-exercises}

対応するページ：\ref{ode:page-stability}

::: problem ★ 基本：平衡点の分類と線形化 {#ode:ex-st-1}
$\mathbb{R}^{2}$ の系 $x'=x^{2}-y$, $y'=x-y$ の平衡点をすべて求め、それぞれの線形化の固有値を計算して安定性を判定せよ。鞍点になる平衡点では、固有ベクトルを求めよ。
:::

::: solution
平衡点では $y=x$ かつ $x^{2}=x$ なので、平衡点は $(0,0)$ と $(1,1)$。ヤコビ行列は $Df(x,y)=\begin{pmatrix}2x&-1\\1&-1\end{pmatrix}$。

**$(0,0)$.** $A=\begin{pmatrix}0&-1\\1&-1\end{pmatrix}$ の固有多項式は $t^{2}+t+1$ で、固有値は $\frac{-1\pm i\sqrt3}{2}$。$\mu(A)=-\frac12<0$ なので、\ref{ode:stab-linearization} から $(0,0)$ は指数安定。固有値が実数でないので、近くの解は回転しながら近づく（渦状点。\ref{ode:stab-hartman-grobman} の意味で線形の流れと同じ形）。

**$(1,1)$.** $A=\begin{pmatrix}2&-1\\1&-1\end{pmatrix}$ の固有多項式は $t^{2}-t-1$ で、固有値は $\lambda_{\pm}=\frac{1\pm\sqrt5}{2}$。$\lambda_{+}>0$ なので、\ref{ode:stab-linearization-unstable} から $(1,1)$ は不安定。$\lambda_{-}<0<\lambda_{+}$ なので鞍点である。固有ベクトル $v=(v_{1},v_{2})$ は第 2 行 $v_{1}-v_{2}=\lambda v_{2}$ から $v=(1+\lambda,1)$ の定数倍で、$\lambda_{+}$ には $(3+\sqrt5,2)$ の方向（傾き $\frac{3-\sqrt5}{2}\approx0.38$）、$\lambda_{-}$ には $(3-\sqrt5,2)$ の方向（傾き $\frac{3+\sqrt5}{2}\approx2.62$）が対応する。
:::

::: problem ★ 基本：ジョルダン細胞と線形系の安定性 {#ode:ex-st-2}
$$
A_{1}=\begin{pmatrix}-1&1&0\\0&-1&0\\0&0&0\end{pmatrix},\qquad A_{2}=\begin{pmatrix}0&1&0\\0&0&0\\0&0&-1\end{pmatrix}
$$
について $e^{tA_{1}}$, $e^{tA_{2}}$ を求め、$x'=A_{i}x$ の平衡点 $0$ の安定性を、定義に従って直接判定せよ。結果を \ref{ode:stab-linear.3} と照らし合わせよ。
:::

::: solution
どちらもブロック対角で、$2\times2$ のブロックは $-I+N$ と $N$（$N=\begin{pmatrix}0&1\\0&0\end{pmatrix}$, $N^{2}=0$）なので、\ref{ode:constant-coefficients} のとおり
$$
e^{tA_{1}}=\begin{pmatrix}e^{-t}&te^{-t}&0\\0&e^{-t}&0\\0&0&1\end{pmatrix},\qquad e^{tA_{2}}=\begin{pmatrix}1&t&0\\0&1&0\\0&0&e^{-t}\end{pmatrix}.
$$

**$A_{1}$.** $t\ge0$ で $(a+b)^{2}\le2a^{2}+2b^{2}$ と $t^{2}e^{-2t}\le e^{-2}$（$t=1$ で最大）から
$$
|e^{tA_{1}}\xi|^{2}=e^{-2t}(\xi_{1}+t\xi_{2})^{2}+e^{-2t}\xi_{2}^{2}+\xi_{3}^{2}\le2\xi_{1}^{2}+(2e^{-2}+1)\xi_{2}^{2}+\xi_{3}^{2}\le4|\xi|^{2}.
$$
よって $\delta=\varepsilon/2$ で \ref{ode:stab-def.1} が成り立ち、$0$ は安定。$\xi=(0,0,s)$ は平衡点なので、$0$ のいくらでも近くに $0$ に収束しない解があり、漸近安定ではない。

**$A_{2}$.** $\xi=(0,s,0)$ について $e^{tA_{2}}\xi=(st,s,0)$ で、$s\neq0$ がどれほど小さくても $|e^{tA_{2}}\xi|\to\infty$。よって $0$ は不安定。

**照合.** どちらも $\mu(A_{i})=0$ である。$A_{1}$ の実部 $0$ の固有値 $0$ のジョルダン細胞は大きさ $1$、$A_{2}$ の固有値 $0$ の細胞は大きさ $2$ なので、\ref{ode:stab-linear.3} の判定（安定・不安定）と一致する。$A_{2}$ は実部が正の固有値をもたないのに不安定である。
:::

::: problem ★★ 標準：重みをつけた二次形式のリャプノフ関数 {#ode:ex-st-3}
1. $x'=-x^{3}-2y$, $y'=x-y^{3}$ の原点の線形化からは安定性が判定できないことを確かめよ。
2. $V=x^{2}+y^{2}$ の軌道微分は原点のいくらでも近くで正になることを示せ。
3. $a,b>0$ を、$V=ax^{2}+by^{2}$ の軌道微分に $xy$ の項が現れないように選び、原点が漸近安定であることを示せ。
4. 符号を変えた系 $x'=x^{3}-2y$, $y'=x+y^{3}$ の原点は不安定であることを示せ。
:::

::: solution
**1.** 原点での線形化は $\begin{pmatrix}0&-2\\1&0\end{pmatrix}$（4 の系でも同じ）で、固有値は $\pm i\sqrt2$。$\mu=0$ で実部が正の固有値もないので、\ref{ode:stab-linearization}・\ref{ode:stab-linearization-unstable} はどちらも使えない。

**2.** $\dot V=2x(-x^{3}-2y)+2y(x-y^{3})=-2x^{4}-2y^{4}-2xy$。$(s,-s)$ では $\dot V=2s^{2}-4s^{4}$ で、$0<|s|<1/\sqrt2$ なら正。

**3.** $\dot V=2ax(-x^{3}-2y)+2by(x-y^{3})=-2ax^{4}-2by^{4}+(2b-4a)xy$ なので、$b=2a$ とすればよい。$a=1$ として $V=x^{2}+2y^{2}$ は $V(0)=0$、原点以外で $V>0$、$\dot V=-2x^{4}-4y^{4}$ は原点以外で負。$V$ は $\mathbb{R}^{2}$ 全体で狭義のリャプノフ関数なので、\ref{ode:lyapunov-theorem.2} から原点は漸近安定。

**4.** 同じ $V=x^{2}+2y^{2}$ について $\dot V=2x(x^{3}-2y)+4y(x+y^{3})=2x^{4}+4y^{4}$。原点以外のすべての点で $V>0$ なので \ref{ode:lyapunov-chetaev.1} が成り立ち、$V>0$ の点（原点以外）で $\dot V>0$ なので、任意の $r>0$ で \ref{ode:lyapunov-chetaev.2} も成り立つ。よって \ref{ode:lyapunov-chetaev} から原点は不安定。線形化が同じでも、3 次の項の符号で結論が逆になる。
:::

## ラサールの不変性原理と勾配系・ハミルトン系 {#ode:sec-stb-exercises}

対応するページ：\ref{ode:page-lasalle}

::: problem ★ 基本：非線形の減衰と不変性原理 {#ode:ex-stb-1}
$x''+(1+x^{2})x'+x^{3}=0$ を $x'=y$, $y'=-x^{3}-(1+x^{2})y$ と書く。
1. 原点の線形化の固有値を求め、\ref{ode:stab-linearization}・\ref{ode:stab-linearization-unstable} が使えないことを確かめよ。
2. $E\defeq\frac14x^{4}+\frac12y^{2}$ を使って、原点が漸近安定であることを示せ。
3. すべての解が $t\to\infty$ で原点に収束することを示せ。
:::

::: solution
**1.** 線形化は $\begin{pmatrix}0&1\\0&-1\end{pmatrix}$ で固有値は $0,-1$。$\mu=0$ で正の固有値もないので、どちらも使えない。

**2.** $\dot E=x^{3}y+y\bigl(-x^{3}-(1+x^{2})y\bigr)=-(1+x^{2})y^{2}\le0$。$E(0)=0$、原点以外で $E>0$ なので $E$ は $\mathbb{R}^{2}$ 上の原点のリャプノフ関数だが、$y=0$ で $\dot E=0$ なので狭義ではない。$r>0$ を任意にとり、$\overline{B}(0,r)$ に全時間留まって $\dot E=0$ となる解 $\Phi_{t}(\eta)$ を考えると、$y\equiv0$ なので $y'=-x^{3}=0$、つまり $\eta=0$。\ref{ode:lyapunov-barbashin} から原点は漸近安定。

**3.** $\xi$ を任意にとり、$c\defeq E(\xi)$、$K_{c}\defeq\{E\le c\}$ とする。$K_{c}$ は閉集合で、$|x|\le(4c)^{1/4}$, $|y|\le\sqrt{2c}$ から有界なのでコンパクト。$\dot E\le0$ なので $t\mapsto E(\Phi_{t}(\eta))$ は非増加で、$K_{c}$ から出た解は $t\ge0$ で $K_{c}$ に留まり、\ref{ode:escape-corollaries.3} から $[0,\infty)$ で定義される。よって $K_{c}$ はコンパクトな正不変集合である。$E$ に含まれる不変集合 $M\subset\{y=0\}\cap K_{c}$ の点は全時間 $y\equiv0$ で、上と同じく原点だけなので $M\subset\{0\}$。\ref{ode:lyapunov-lasalle} から $\omega(\xi)\subset M$ で、\ref{ode:stab-omega-limit-properties.1} から $\omega(\xi)\neq\varnothing$ なので $M=\{0\}$、$\Phi_{t}(\xi)\to0$。
:::

::: problem ★★ 標準：二重井戸のハミルトン系と減衰 {#ode:ex-stb-2}
$k\ge0$ について $q'=p$, $p'=q-q^{3}-kp$ を考え、$H(q,p)\defeq\frac12p^{2}+\frac14q^{4}-\frac12q^{2}$ とおく。
1. $k=0$ のとき、系は $H$ のハミルトン系であることを確かめ、各平衡点の安定性を判定せよ。
2. $k>0$ のとき、各平衡点の安定性を線形化で判定せよ。
3. $k>0$ のとき、すべての解は $t\to\infty$ で三つの平衡点のどれか一つに収束することを示せ。
:::

::: solution
平衡点は $p=0$, $q-q^{3}=0$ から $(0,0)$, $(\pm1,0)$（$k$ によらない）。

**1.** $\partial H/\partial p=p$, $-\partial H/\partial q=q-q^{3}$ なので、$k=0$ の系はハミルトン系である。$H$ のヘッセ行列は $\operatorname{diag}(3q^{2}-1,1)$ で、$(\pm1,0)$ では $\operatorname{diag}(2,1)$ が正定値なので、\ref{calc:second-derivative-test.2} から狭義の極小点。\ref{ode:stab-hamiltonian.3} から安定、\ref{ode:stab-hamiltonian.2} から漸近安定ではない。$(0,0)$ の線形化 $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ は固有値 $\pm1$ をもつので、\ref{ode:stab-linearization-unstable} から不安定。

**2.** 線形化は $\begin{pmatrix}0&1\\1-3q^{2}&-k\end{pmatrix}$。$(\pm1,0)$ では固有多項式 $t^{2}+kt+2$。根が実数なら積 $2>0$、和 $-k<0$ から二つとも負、虚数なら実部 $-k/2<0$。\ref{ode:stab-linearization} から指数安定。$(0,0)$ では $t^{2}+kt-1$ で、根の積が $-1<0$ なので正の根がある。不安定。

**3.** $\dot H=p(q-q^{3})+(q^{3}-q)p-kp^{2}=-kp^{2}\le0$。$\frac12q^{2}\le\frac18q^{4}+\frac12$（相加相乗平均）から $H\ge\frac12p^{2}+\frac18q^{4}-\frac12$ なので、$K_{c}\defeq\{H\le c\}$ は有界閉集合でコンパクト。$K_{c}$ から出た解に沿って $H$ は非増加なので、解は $t\ge0$ で $K_{c}$ に留まり、\ref{ode:escape-corollaries.3} から $[0,\infty)$ で定義される。よって $K_{c}$ は正不変。$\{\dot H=0\}=\{p=0\}$ に含まれる不変集合の点は全時間 $p\equiv0$、$p'=q-q^{3}=0$ なので平衡点。$\xi$ を任意にとり $c=H(\xi)$ とすると、\ref{ode:lyapunov-lasalle} から $\operatorname{dist}(\Phi_{t}(\xi),M)\to0$、ここで $M\subset\{(0,0),(\pm1,0)\}$ は空でない（\ref{ode:stab-omega-limit-properties.1}）。

三つの平衡点の互いの距離は $1$ 以上なので、半径 $\frac12$ の開円板 $B_{e}\defeq B(e,\frac12)$（$e\in M$）は互いに交わらない。$T$ を、$t\ge T$ で $\operatorname{dist}(\Phi_{t}(\xi),M)<\frac12$ となるようにとると、$\Phi_{[T,\infty)}(\xi)$ は $\bigcup_{e}B_{e}$ に含まれ、連結（\ref{top:connected-preservation.1}）なので、一つの $B_{e^{*}}$ に含まれる（交わらない開集合に分かれない）。$t\ge T$ では他の平衡点までの距離は $\frac12$ より大きいので $\operatorname{dist}(\Phi_{t}(\xi),M)=|\Phi_{t}(\xi)-e^{*}|\to0$。
:::

## 平面の力学系 {#ode:sec-pl-exercises}

対応するページ：\ref{ode:page-planar-systems}

::: problem ★ 基本：二つの周期軌道をもつ系の極限集合 {#ode:ex-pl-1}
$g(\rho)\defeq-(\rho-1)(\rho-4)$ とし、$\mathbb{R}^{2}$ のベクトル場 $F(x,y)\defeq\bigl(xg(x^{2}+y^{2})-y,\ yg(x^{2}+y^{2})+x\bigr)$ を考える。
1. $\xi=r_{0}(\cos\theta_{0},\sin\theta_{0})\neq0$ について、$\rho'=2\rho g(\rho)$, $\rho(0)=r_{0}^{2}$ の最大解を $\rho$ とすると、$\Phi_{t}(\xi)=\sqrt{\rho(t)}\,(\cos(\theta_{0}+t),\sin(\theta_{0}+t))$ であることを示せ。
2. 半径 $1$ の円 $\Gamma_{1}$ と半径 $2$ の円 $\Gamma_{2}$ は周期軌道であることを示し、$\xi\neq0$ のそれぞれについて $\omega(\xi)$ と（定義されるなら）$\alpha(\xi)$ を求めよ。
3. 原点の安定性を判定し、$\Gamma_{1}$, $\Gamma_{2}$ がリミットサイクルであることを確かめよ（次のページのリミットサイクルの定義 \see{ode:limit-cycle} を先取りしてよい）。
:::

::: solution
**1.** $z(t)$ を右辺の式とし、$J(a,b)\defeq(-b,a)$ と書く。$|z|^{2}=\rho$ で、$z'=\frac{\rho'}{2\rho}z+Jz=g(|z|^{2})z+Jz=F(z)$、$z(0)=\xi$。一意性から $z(t)=\Phi_{t}(\xi)$ で、定義域も $\rho$ の最大の定義域と一致する（$z$ が延びれば $\rho=|z|^{2}$ も延びる）。

**2.** $\varphi(\rho)\defeq2\rho g(\rho)=-2\rho(\rho-1)(\rho-4)$ の零点は $0,1,4$ で、$\varphi$ は $(0,1)$ と $(4,\infty)$ で負、$(1,4)$ で正。$r_{0}=1,2$ なら $\rho$ は定数で、$\Phi_{t}(\xi)$ は周期 $2\pi$ で $\Gamma_{1}$, $\Gamma_{2}$ を回る（平衡点を含まない）。ほかの場合、記法の節の約束から：
- $0<r_{0}<1$：$t\to\infty$ で $\rho\downarrow0$、$t\to-\infty$ で $\rho\uparrow1$（どちらの向きにも $[0,1]$ に留まるので大域的）。$\omega(\xi)=\{0\}$。$\Gamma_{1}$ の点 $(\cos\psi,\sin\psi)$ には $t_{k}\defeq\psi-\theta_{0}-2\pi k\to-\infty$ で近づき、逆に $\alpha(\xi)$ の点の長さは $\lim\sqrt{\rho(t_{k})}=1$ なので、$\alpha(\xi)=\Gamma_{1}$。
- $1<r_{0}<2$：$t\to\infty$ で $\rho\uparrow4$、$t\to-\infty$ で $\rho\downarrow1$。同じ議論で $\omega(\xi)=\Gamma_{2}$, $\alpha(\xi)=\Gamma_{1}$。
- $r_{0}>2$：$t\to\infty$ で $\rho\downarrow4$ なので $\omega(\xi)=\Gamma_{2}$。過去の向きには $\sigma(s)\defeq\rho(-s)$ が $\sigma'=2\sigma(\sigma-1)(\sigma-4)$ を満たし、$\sigma\ge r_{0}^{2}$ で増える。$\sigma-1\ge\sigma(1-r_{0}^{-2})$, $\sigma-4\ge\sigma(1-4r_{0}^{-2})$ から $\sigma'\ge2c\sigma^{3}$（$c\defeq(1-r_{0}^{-2})(1-4r_{0}^{-2})>0$）。$(\sigma^{-2})'=-2\sigma^{-3}\sigma'\le-4c$ なので $\sigma(s)^{-2}\le r_{0}^{-4}-4cs$ で、$s<r_{0}^{-4}/(4c)$ でなければならない。よって $(-\infty,0]\not\subset I_{\xi}$ で、$\alpha(\xi)$ は定義されない。

**3.** $\partial_{x}(xg(x^{2}+y^{2}))=g+2x^{2}g'$ などから、原点での線形化は $\begin{pmatrix}g(0)&-1\\1&g(0)\end{pmatrix}=\begin{pmatrix}-4&-1\\1&-4\end{pmatrix}$ で、固有値 $-4\pm i$。\ref{ode:stab-linearization} から原点は指数安定で、2 から原点に収束する点の全体は開円板 $\{\rho<1\}$ である。$\Gamma_{2}$ は $\Gamma_{2}$ 上にない点の $\omega$ 極限集合、$\Gamma_{1}$ は $\Gamma_{1}$ 上にない点の $\alpha$ 極限集合なので、どちらもリミットサイクルである（$\Gamma_{2}$ は両側から引き寄せ、$\Gamma_{1}$ は両側へ押し出す）。
:::

::: problem ★★ 標準：円環の捕獲領域 {#ode:ex-pl-2}
$F(x,y)\defeq\bigl(x-y-x^{3},\ x+y-y^{3}\bigr)$ とし、$V\defeq x^{2}+y^{2}$, $K\defeq\{1\le V\le2\}$ とする。
1. $K$ が正の不変であることを、$\dot V$ を評価して示せ。
2. $K$ が平衡点を含まないことを示し、$K$ が周期軌道を含むことを導け。
:::

::: solution
**1.** $\dot V=2x(x-y-x^{3})+2y(x+y-y^{3})=2\bigl(V-(x^{4}+y^{4})\bigr)$。$V^{2}=x^{4}+y^{4}+2x^{2}y^{2}$ と $2x^{2}y^{2}\le x^{4}+y^{4}$ から $\frac12V^{2}\le x^{4}+y^{4}\le V^{2}$。よって
- $V>2$ の点では $\dot V\le2V-V^{2}=V(2-V)<0$、
- $0<V<1$ の点では $\dot V\ge2(V-V^{2})>0$。

$\xi\in K$ とし、$v(t)\defeq V(\Phi_{t}(\xi))$ とする。ある $t_{1}>0$（$t_{1}\in I_{\xi}$）で $v(t_{1})>2$ とすると、$t_{0}\defeq\sup\{t\in[0,t_{1}]:v(t)\le2\}$ について連続性から $v(t_{0})=2$、$(t_{0},t_{1}]$ で $v>2$ なので $v'<0$。\ref{calc:mean-value-theorem} から $v(t_{1})<v(t_{0})=2$ となり矛盾する。$v(t_{1})<1$ となる $t_{1}>0$ も同様にない。よって $t\ge0$ で $\Phi_{t}(\xi)\in K$ で、$K$ はコンパクトなので \ref{ode:escape-corollaries.3} から $[0,\infty)\subset I_{\xi}$。$K$ は正の不変である。

**2.** 平衡点では $xF_{1}+yF_{2}=V-(x^{4}+y^{4})=0$ と $xF_{2}-yF_{1}=V+xy(x^{2}-y^{2})=0$ が成り立つ。$x=r\cos\psi$, $y=r\sin\psi$ と書くと $xy(x^{2}-y^{2})=\frac14r^{4}\sin4\psi$ なので、$r\neq0$ なら後者から $r^{2}=-4/\sin4\psi$、つまり $V=r^{2}\ge4$。よって $0<V\le2$ に平衡点はなく、原点は $K$ に入らないので、$K$ は平衡点を含まない。$K$ は空でないコンパクトな正の不変集合なので、\ref{ode:trapping-region} から $K$ は周期軌道を含む。
:::

## リミットサイクルとベンディクソン–デュラックの判定法 {#ode:sec-pl2-exercises}

対応するページ：\ref{ode:page-limit-cycles}

::: problem ★ 基本：デュラック関数による周期軌道の非存在 {#ode:ex-pl2-1}
$x'=y$, $y'=-x-y+x^{2}+y^{2}$ を考える。
1. 平衡点をすべて求め、安定性を判定せよ。
2. $\operatorname{div}F$ は符号を変えるので \ref{ode:bendixson-criterion} はそのままでは使えないことを確かめよ。
3. $g(x,y)\defeq e^{-2x}$ について $\operatorname{div}(gF)$ を計算し、周期軌道がないことを示せ。
:::

::: solution
**1.** $y=0$, $x^{2}-x=0$ から平衡点は $(0,0)$, $(1,0)$。線形化は $\begin{pmatrix}0&1\\-1+2x&-1+2y\end{pmatrix}$。$(0,0)$ では固有多項式 $t^{2}+t+1$、固有値 $\frac{-1\pm i\sqrt3}{2}$ で、\ref{ode:stab-linearization} から指数安定。$(1,0)$ では $\begin{pmatrix}0&1\\1&-1\end{pmatrix}$、固有多項式 $t^{2}+t-1$ の根は $\frac{-1\pm\sqrt5}{2}$ で一方が正なので、\ref{ode:stab-linearization-unstable} から不安定（鞍点）。

**2.** $\operatorname{div}F=\partial_{y}(-x-y+x^{2}+y^{2})=-1+2y$ は $y<\frac12$ で負、$y>\frac12$ で正。

**3.**
$$
\operatorname{div}(gF)=\partial_{x}(e^{-2x}y)+\partial_{y}\bigl(e^{-2x}(-x-y+x^{2}+y^{2})\bigr)=-2e^{-2x}y+e^{-2x}(-1+2y)=-e^{-2x}<0.
$$
$\Omega=\mathbb{R}^{2}$ で \ref{ode:bendixson-dulac} の仮定（不等号 $\le0$ の版）が成り立つので、周期軌道はない。
:::

::: problem ★★ 標準：ただ一つのリミットサイクル {#ode:ex-pl2-2}
$x'=y$, $y'=-x+y(1-x^{2}-y^{2})$ を考え、$\Gamma$ を単位円とする。
1. $\Gamma$ は周期軌道で、原点は不安定な平衡点であることを示せ。
2. $\xi\notin\Gamma$, $\xi\neq0$ なら $\omega(\xi)=\Gamma$ であることを示せ。とくに $\Gamma$ はリミットサイクルである。
3. $\Gamma$ 以外に周期軌道はないことを示せ。
:::

::: solution
$V\defeq x^{2}+y^{2}$ とすると $\dot V=2xy+2y\bigl(-x+y(1-V)\bigr)=2y^{2}(1-V)$。

**1.** $z(t)\defeq(\cos t,-\sin t)$ は $z'=(-\sin t,-\cos t)$ で、$y=-\sin t$, $-x+y(1-1)=-\cos t$ なので解であり、$\Gamma$ を周期 $2\pi$ で回る。平衡点は $y=0$, $x=0$ の原点だけ。原点の線形化 $\begin{pmatrix}0&1\\-1&1\end{pmatrix}$ の固有値 $\frac{1\pm i\sqrt3}{2}$ は実部が正なので、\ref{ode:stab-linearization-unstable} から不安定。

**2.** $0<V(\xi)<1$ とする。軌道は一致するか交わらないので $\mathcal{O}(\xi)$ は $\Gamma$ とも原点とも交わらず、$v(t)\defeq V(\Phi_{t}(\xi))$ は $I_{\xi}$ で $0$ と $1$ の値をとらない。\ref{top:intermediate-value} から $0<v<1$ で、$v'=2y^{2}(1-v)\ge0$。前方軌道はコンパクト集合 $\{v(0)\le V\le1\}$ に含まれ、$v(t)$ は極限 $c\in[v(0),1]$ をもつ。$\eta\in\omega(\xi)$ なら $V(\eta)=c$ で、\ref{ode:limit-set-properties.3} から $\mathcal{O}(\eta)\subset\omega(\xi)\subset\{V=c\}$。$\mathcal{O}(\eta)$ に沿って $V$ は一定なので、$0=\dot V=2y^{2}(1-c)$。$c<1$ なら $\mathcal{O}(\eta)$ に沿って $y\equiv0$、$y'=-x=0$ で $\eta=0$、$c=0$ となって $c\ge v(0)>0$ に反する。よって $c=1$、$\omega(\xi)\subset\Gamma$。$\omega(\xi)$ は空でなく（\ref{ode:limit-set-properties.2}）、その点 $\eta$ の軌道 $\Gamma$ を含む（\ref{ode:limit-set-properties.1}）ので、$\omega(\xi)=\Gamma$。$V(\xi)>1$ なら $v>1$, $v'\le0$ で、前方軌道は $\{1\le V\le v(0)\}$ に含まれ、同じ議論（$c>1$ なら $\eta=0$ で矛盾）で $\omega(\xi)=\Gamma$。$\Gamma$ 上にない点の $\omega$ 極限集合なので、\ref{ode:limit-cycle} から $\Gamma$ はリミットサイクルである。

**3.** $\Gamma'\neq\Gamma$ を周期軌道とすると、$\Gamma'\cap\Gamma=\varnothing$ で $\Gamma'$ は連結なので、$\Gamma'$ の上で $V<1$ か $V>1$ の一方。$V$ は $\Gamma'$ を回る解に沿って単調で周期的なので一定で、$0=\dot V=2y^{2}(1-V)$ から $\Gamma'$ の上で $y\equiv0$、$y'=-x=0$。$\Gamma'$ が原点になり、周期軌道が平衡点を含まないこと（\ref{ode:planar-period.2}）に反する。
:::

::: problem ★★★ 発展：ロジスティック型の捕食者–被食者系 {#ode:ex-pl2-3}
$x'=x(2-x-y)$, $y'=y(x-1)$ を $\mathbb{R}^{2}$ で考え、$Q\defeq\{x>0,\ y>0\}$ とする。
1. 平衡点をすべて求め、安定性を判定せよ。
2. $Q$ から出たすべての解は $t\to\infty$ で $(1,1)$ に収束することを示せ。（ヒント：$V(x,y)\defeq(x-1-\ln x)+(y-1-\ln y)$。）
3. $Q$ に周期軌道がないことを、2 とデュラック関数 $g=1/(xy)$ の両方から確かめよ。
:::

::: solution
**Step 1.** 【主張：平衡点は $(0,0)$, $(2,0)$, $(1,1)$ で、前の二つは不安定、$(1,1)$ は指数安定】$y=0$ なら $x(2-x)=0$、$y\neq0$ なら $x=1$, $y=1$。線形化は $\begin{pmatrix}2-2x-y&-x\\y&x-1\end{pmatrix}$。$(0,0)$ では $\operatorname{diag}(2,-1)$、$(2,0)$ では $\begin{pmatrix}-2&-2\\0&1\end{pmatrix}$ で固有値 $-2,1$ なので、どちらも \ref{ode:stab-linearization-unstable} から不安定。$(1,1)$ では $\begin{pmatrix}-1&-1\\1&0\end{pmatrix}$、固有多項式 $t^{2}+t+1$、固有値 $\frac{-1\pm i\sqrt3}{2}$ で、\ref{ode:stab-linearization} から指数安定。

**Step 2.** 【主張：$\xi\in Q$ なら、すべての $t\in I_{\xi}$ で $\Phi_{t}(\xi)\in Q$】$x$ 軸上の点からは、$x'=x(2-x)$ の解 $x(t)$ について $(x(t),0)$ が解なので、一意性から軌道は $x$ 軸に含まれる。$y$ 軸上も $(0,y_{0}e^{-t})$ で同様。軌道は一致するか交わらないので、$\xi\in Q$ の軌道は座標軸の和 $A$ と交わらない。$\Phi_{I_{\xi}}(\xi)$ は区間の連続像で連結（\ref{top:connected-preservation.1}）なので、$\mathbb{R}^{2}\setminus A$ の連結成分 $Q$ に含まれる（\ref{top:components-properties}）。

**Step 3.** 【主張：$Q$ の上で $\dot V=-(x-1)^{2}$。各 $c\ge0$ について $K_{c}\defeq\{(x,y)\in Q:V\le c\}$ はコンパクトで正不変】$\dot V=(1-\frac1x)x'+(1-\frac1y)y'=(x-1)(2-x-y)+(y-1)(x-1)=(x-1)(1-x)$。$\phi(s)\defeq s-1-\ln s$（$s>0$）は $\phi'(s)=1-1/s$ から $(0,1]$ で減少、$[1,\infty)$ で増加、$\phi(1)=0$ で、$s\to0$ でも $s\to\infty$ でも $\phi\to\infty$。よって $0<s_{-}\le1\le s_{+}$ があって $\{\phi\le c\}=[s_{-},s_{+}]$。$V=\phi(x)+\phi(y)$, $\phi\ge0$ なので $K_{c}=\{V\le c\}\cap[s_{-},s_{+}]^{2}$ は $\mathbb{R}^{2}$ の有界閉集合で $Q$ に含まれ、コンパクト。$\xi\in K_{c}$ なら Step 2 から解は $Q$ に留まり、$\dot V\le0$ から $V\le c$ のままなので $K_{c}$ に留まり、\ref{ode:escape-corollaries.3} から $[0,\infty)\subset I_{\xi}$。

**Step 4.** 【主張：$\xi\in Q$ なら $\Phi_{t}(\xi)\to(1,1)$】$U=Q$, $K=K_{V(\xi)}$ として \ref{ode:lyapunov-lasalle} を使う。$\{\dot V=0\}\cap K=\{x=1\}\cap K$ に含まれる不変集合の点は全時間 $x\equiv1$ なので $x'=1-y=0$、つまり $(1,1)$。よって $M\subset\{(1,1)\}$ で、$\omega(\xi)\neq\varnothing$（\ref{ode:stab-omega-limit-properties.1}）から $M=\{(1,1)\}$、$\operatorname{dist}(\Phi_{t}(\xi),M)\to0$。

**Step 5.** 【主張：$Q$ に周期軌道はない（二通り）】(i) $Q$ の周期点 $\xi$ があれば、Step 4 から $\Phi_{t}(\xi)\to(1,1)$ だが、周期的なので $\Phi_{t}(\xi)$ はつねに $(1,1)$、つまり $\xi$ は平衡点で、周期点の定義（\ref{ode:planar-orbit.3} の $F(\xi)\neq0$）に反する。(ii) $Q$ の上で
$$
\operatorname{div}(gF)=\partial_{x}\frac{2-x-y}{y}+\partial_{y}\frac{x-1}{x}=-\frac1y<0.
$$
$\mathbb{R}^{2}\setminus Q=\{x\le0\}\cup\{y\le0\}$ は原点を共有する二つの連結な閉半平面の和で、連結（\ref{top:connected-preservation.2}）かつ非有界。\ref{ode:bendixson-dulac} から $Q$ に含まれる周期軌道はない。

（Step 1 の線形化は $(1,1)$ の近くのことしか言わないが、Step 4 は吸い込まれる範囲が $Q$ 全体であることを示す。捕食者がいなければ被食者は $x=2$ に落ち着き、被食者がいなければ捕食者は絶滅する。）

::: hypcheck
- **$V$ の選び方**：$x^{*}+y^{*}=2$ と $x^{*}=1$（平衡点 $(1,1)$ の座標）から $2-x-y=-(x-1)-(y-1)$ となり、交差項 $\pm(x-1)(y-1)$ が打ち消し合う。Step 3 で使った。
- **コンパクト性**：Step 3 で $\phi\to\infty$（$s\to0$）を使い、$K_{c}$ が座標軸から離れていることを確かめた。これがないと \ref{ode:lyapunov-lasalle} の $K\subset U$ が成り立たない。
:::
:::

## 境界値問題とスツルム–リウヴィル理論 {#ode:sec-sl-exercises}

対応するページ：\ref{ode:page-sturm-liouville}

::: problem ★ 基本：変数係数のグリーン関数 {#ode:ex-sl-1}
$[1,2]$ の上で $-(xu')'=h$, $u(1)=u(2)=0$ を考える（$p(x)=x$, $q=0$）。
1. $0$ は固有値でないことを確かめ、\ref{ode:green-function} の $\varphi_{a}$, $\varphi_{b}$, $\omega$ とグリーン関数 $G$ を求めよ。
2. 跳びの条件 $p(y)\bigl(\partial_{x}G(y+0,y)-\partial_{x}G(y-0,y)\bigr)=-1$ を直接確かめよ。
3. $h=1$ のとき、$u(x)=\int_{1}^{2}G(x,y)\,dy$ を計算し、直接解いた解と一致することを確かめよ。
:::

::: solution
**1.** $-(x\varphi')'=0$ の解は $x\varphi'=C$ から $\varphi=C\ln x+D$。$\varphi(1)=0$ なら $D=0$、さらに $\varphi(2)=C\ln2=0$ なら $C=0$ なので、$0$ は固有値でない。ディリクレ条件は $\alpha=\beta=(1,0)$ なので、$(\varphi_{a}(1),\varphi_{a}'(1))=(0,1)$ から $\varphi_{a}=\ln x$、$(\varphi_{b}(2),2\varphi_{b}'(2))=(0,-1)$ から $\varphi_{b}=\ln2-\ln x=\ln(2/x)$。
$$
\omega=x\bigl(\varphi_{b}\varphi_{a}'-\varphi_{b}'\varphi_{a}\bigr)=x\Bigl(\frac{\ln(2/x)}{x}+\frac{\ln x}{x}\Bigr)=\ln2,\qquad G(x,y)=\frac{\ln(\min\{x,y\})\,\ln(2/\max\{x,y\})}{\ln2}.
$$

**2.** $x>y$ では $\partial_{x}G=-\frac{\ln y}{x\ln2}$、$x<y$ では $\partial_{x}G=\frac{\ln(2/y)}{x\ln2}$。$x=y$ での差に $p(y)=y$ を掛けると $-\frac{\ln y+\ln(2/y)}{\ln2}=-1$。

**3.** $\int_{1}^{x}\ln y\,dy=x\ln x-x+1$、$\int_{x}^{2}\ln(2/y)\,dy=(2-x)\ln2-\bigl[y\ln y-y\bigr]_{x}^{2}=-x\ln2+2+x\ln x-x$。$L\defeq\ln x$, $l\defeq\ln2$ として
$$
l\,u(x)=(l-L)(xL-x+1)+L(-xl+2+xL-x)=l-lx+L,
$$
つまり $u(x)=1-x+\frac{\ln x}{\ln2}$。直接には $-(xu')'=1$ から $xu'=-x+C$、$u=-x+C\ln x+D$ で、$u(1)=0$ から $D=1$、$u(2)=0$ から $C=1/\ln2$。一致する（\ref{ode:green-function.4} の一意性とも整合する）。
:::

::: problem ★★ 標準：共振とフレドホルムの二者択一 {#ode:ex-sl-2}
$[0,1]$ の上で $Lu\defeq-u''-\pi^{2}u$（$p=1$, $q=-\pi^{2}$）、ディリクレ条件 $u(0)=u(1)=0$ を考える。
1. $0$ が固有値であることを示し、$\{u\in D:Lu=0\}$ を求めよ。
2. $Lu=1$ は解をもたないことを示せ。
3. $Lu=x-\frac12$ と $Lu=\cos\pi x$ の解をすべて求めよ。
:::

::: solution
**1.** $L\varphi=0$ の解は $A\cos\pi x+B\sin\pi x$（\ref{ode:solution-space}）。$\varphi(0)=0$ から $A=0$ で、$\varphi(1)=B\sin\pi=0$ はつねに成り立つ。よって $\{u\in D:Lu=0\}=\mathbb{C}\sin\pi x$ で、$0$ は固有値、$\varphi_{0}=\sin\pi x$。

**2.** \ref{ode:sl-alternative.2} から、$Lu=h$ が解けることと $\int_{0}^{1}h\sin\pi x\,dx=0$ は同値。$h=1$ では $\int_{0}^{1}\sin\pi x\,dx=\frac2\pi\neq0$ なので解はない。

**3.** $x\mapsto1-x$ の置換で $(x-\frac12)\sin\pi x$ は符号を変えるので $\int_{0}^{1}(x-\frac12)\sin\pi x\,dx=0$、また $\int_{0}^{1}\cos\pi x\sin\pi x\,dx=\frac12\int_{0}^{1}\sin2\pi x\,dx=0$。どちらも解ける。
- $h=x-\frac12$：$u_{p}=-(x-\frac12)/\pi^{2}$ は $u_{p}''=0$ から $Lu_{p}=x-\frac12$。一般解 $u_{p}+A\cos\pi x+B\sin\pi x$ に $u(0)=\frac{1}{2\pi^{2}}+A=0$ を課すと $A=-\frac{1}{2\pi^{2}}$ で、$u(1)=-\frac{1}{2\pi^{2}}+\frac{1}{2\pi^{2}}=0$ も成り立つ。解の全体は
$$
u=-\frac{x-\frac12}{\pi^{2}}-\frac{\cos\pi x}{2\pi^{2}}+C\sin\pi x\qquad(C\in\mathbb{C}).
$$
- $h=\cos\pi x$：$u_{1}\defeq-\frac{x\sin\pi x}{2\pi}$ について $u_{1}'=-\frac{\sin\pi x}{2\pi}-\frac{x\cos\pi x}{2}$、$u_{1}''=-\cos\pi x+\frac{\pi x}{2}\sin\pi x$ なので
$$
Lu_{1}=\cos\pi x-\frac{\pi x}{2}\sin\pi x+\frac{\pi x}{2}\sin\pi x=\cos\pi x,
$$
$u_{1}(0)=u_{1}(1)=0$。解の全体は $u_{1}+C\sin\pi x$（\ref{ode:sl-alternative.2}）。

右辺が固有関数 $\sin\pi x$ と直交しない成分をもつと、固有振動数で揺すり続けることになり（共振）、境界値問題は解けない。直交していても、解は固有関数の分だけ不定である。
:::

## 固有関数展開とスツルムの振動定理 {#ode:sec-slo-exercises}

対応するページ：\ref{ode:page-eigenfunction-expansion}

::: problem ★ 基本：正弦級数と級数の値 {#ode:ex-slo-1}
$f(x)\defeq x(\pi-x)$（$0\le x\le\pi$）とする。
1. ディリクレ条件の $-u''=\lambda u$ の固有関数による展開 $f=\sum_{n}b_{n}\sin nx$ の係数を求め、$[0,\pi]$ で一様に収束することを確かめよ。
2. $x=\frac\pi2$ を代入して $\sum_{k=0}^{\infty}\frac{(-1)^{k}}{(2k+1)^{3}}=\frac{\pi^{3}}{32}$ を示せ。
3. \ref{ode:sl-expansion.1} を使って $\sum_{k=0}^{\infty}\frac{1}{(2k+1)^{6}}=\frac{\pi^{6}}{960}$ を示せ。
:::

::: solution
**1.** 部分積分を 2 回行うと
$$
\int_{0}^{\pi}x(\pi-x)\sin nx\,dx=\frac1n\int_{0}^{\pi}(\pi-2x)\cos nx\,dx=\frac{2}{n^{2}}\int_{0}^{\pi}\sin nx\,dx=\frac{2(1-(-1)^{n})}{n^{3}}
$$
（境界の項は $x(\pi-x)$ と $\sin nx$ が両端で $0$ になるので消える）。\ref{ode:sl-fourier-examples.1} から $b_{n}=\frac{2}{\pi}\cdot\frac{2(1-(-1)^{n})}{n^{3}}$、つまり $n$ が奇数なら $b_{n}=\frac{8}{\pi n^{3}}$、偶数なら $0$。$f\in C^{2}[0,\pi]$, $f(0)=f(\pi)=0$ なので $f\in D$ で、\ref{ode:sl-expansion.2} から一様収束する（$|b_{n}\sin nx|\le\frac{8}{\pi n^{3}}$ からも直接わかる）。

**2.** $\sin\frac{(2k+1)\pi}{2}=(-1)^{k}$ なので $\frac{\pi^{2}}{4}=f(\frac\pi2)=\frac8\pi\sum_{k}\frac{(-1)^{k}}{(2k+1)^{3}}$。

**3.** $e_{n}=\sqrt{2/\pi}\sin nx$ について $\langle f,e_{n}\rangle=\sqrt{\pi/2}\,b_{n}$。$\int_{0}^{\pi}x^{2}(\pi-x)^{2}dx=\pi^{5}\int_{0}^{1}s^{2}(1-s)^{2}ds=\frac{\pi^{5}}{30}$ なので、\ref{ode:sl-expansion.1} から
$$
\frac{\pi^{5}}{30}=\frac\pi2\sum_{n}b_{n}^{2}=\frac\pi2\cdot\frac{64}{\pi^{2}}\sum_{k}\frac{1}{(2k+1)^{6}},\qquad\sum_{k}\frac{1}{(2k+1)^{6}}=\frac{\pi^{6}}{960}.
$$
:::

::: problem ★★ 標準：オイラー型の固有値問題 {#ode:ex-slo-2}
$[1,e]$ の上で $-(x^{2}u')'=\lambda u$, $u(1)=u(e)=0$ を考える（$p=x^{2}$, $q=0$, $w=1$）。
1. $x=e^{t}$, $u=e^{-t/2}v(t)$ と置くと、問題は $[0,1]$ の上の $-v''+\frac14v=\lambda v$, $v(0)=v(1)=0$ と同値になることを示せ。
2. 固有値 $\lambda_{n}$ と、$L^{2}[1,e]$ で正規化した固有関数 $e_{n}$ を求め、正規直交性を直接確かめよ。
3. $e_{n}$ の $(1,e)$ の中の零点を求め、\ref{ode:sturm-oscillation.2} と一致することを確かめよ。また、隣り合う零点の距離が $\pi/\sqrt{\lambda_{n}}$ 以上であることを確かめ、\ref{ode:sl-zero-spacing.2} と照らし合わせよ。
:::

::: solution
**1.** $\frac{d}{dx}=e^{-t}\frac{d}{dt}$ なので $x^{2}u'=e^{t}\frac{du}{dt}$、$(x^{2}u')'=e^{-t}\frac{d}{dt}\bigl(e^{t}\frac{du}{dt}\bigr)=\frac{du}{dt}+\frac{d^{2}u}{dt^{2}}$。$u=e^{-t/2}v$ では $\frac{du}{dt}=e^{-t/2}(v'-\frac12v)$、$\frac{d^{2}u}{dt^{2}}=e^{-t/2}(v''-v'+\frac14v)$ で、和は $e^{-t/2}(v''-\frac14v)$。よって $-(x^{2}u')'=\lambda u$ と $-v''+\frac14v=\lambda v$ は同値。$v(0)=u(1)$, $v(1)=e^{1/2}u(e)$ なので境界条件も対応し、$u\mapsto v$ は $C^{2}$ 級の関数の間の全単射である。

**2.** $-v''=(\lambda-\frac14)v$, $v(0)=v(1)=0$ は、\ref{ode:sl-laplacian-eigenvalues.1} と同じ計算（区間を $[0,1]$ に替える）で $\lambda-\frac14=n^{2}\pi^{2}$, $v=\sin n\pi t$（$n\ge1$）に限る。よって $\lambda_{n}=\frac14+n^{2}\pi^{2}$、固有関数は $x^{-1/2}\sin(n\pi\ln x)$ の定数倍。$t=\ln x$（$dx/x=dt$）と置換して
$$
\int_{1}^{e}x^{-1}\sin(n\pi\ln x)\sin(m\pi\ln x)\,dx=\int_{0}^{1}\sin n\pi t\,\sin m\pi t\,dt=\frac12\delta_{nm}
$$
なので $e_{n}(x)=\sqrt2\,x^{-1/2}\sin(n\pi\ln x)$ が正規直交系で、\ref{ode:sl-eigen.2} から $L^{2}[1,e]$ の正規直交基底である。

**3.** $e_{n}(x)=0$, $1<x<e$ は $n\ln x\in\{1,\dots,n-1\}$、つまり $x=e^{k/n}$（$k=1,\dots,n-1$）で、ちょうど $n-1$ 個。\ref{ode:sturm-oscillation.2} と一致する。端点も含めた隣り合う零点 $e^{(k-1)/n}<e^{k/n}$ の距離は $e^{(k-1)/n}(e^{1/n}-1)\ge e^{1/n}-1>\frac1n$ で、$\sqrt{\lambda_{n}}>n\pi$ から $\frac1n>\frac{\pi}{\sqrt{\lambda_{n}}}$。\ref{ode:sl-zero-spacing.2} は $p=x^{2}\ge1$, $r=-\lambda_{n}$ に $m=1$, $k=\sqrt{\lambda_{n}}$ で使え、同じ下界 $\pi/\sqrt{\lambda_{n}}$ を与える。
:::

::: problem ★★★ 発展：ロバン境界条件の固有値と固有関数展開 {#ode:ex-slo-3}
$[0,1]$ の上で $-u''=\lambda u$, $u(0)=0$, $u'(1)+u(1)=0$ を考える（$p=w=1$, $q=0$, $\alpha=(1,0)$, $\beta=(1,1)$）。
1. 固有値はすべて正で、$\lambda=\kappa^{2}$（$\kappa>0$）が固有値であることと $\tan\kappa=-\kappa$ は同値であることを示せ。
2. $\tan\kappa=-\kappa$ の正の解は $\kappa_{1}<\kappa_{2}<\cdots$ と並び、$(n-\frac12)\pi<\kappa_{n}<n\pi$、$\kappa_{n}=(n-\frac12)\pi+\arctan(1/\kappa_{n})$ であることを示せ。$n$ 番目の固有関数 $\sin\kappa_{n}x$ の零点の個数を \ref{ode:sturm-oscillation.2} と照らし合わせよ。
3. グリーン関数を求め、$\sum_{n}\kappa_{n}^{-4}=\frac{11}{180}$ を示せ。
4. $f(x)\defeq3x-2x^{2}$ の固有関数展開 $f=\sum_{n}c_{n}\sin\kappa_{n}x$ の係数を求め、$[0,1]$ で一様に収束することを示せ。
:::

::: solution
**Step 1.** 【主張：固有値はすべて正】\ref{ode:sl-lower-bound} の記号で $\sigma_{a}=0$（$\alpha_{2}=0$）、$\sigma_{b}=\beta_{1}/\beta_{2}=1$ なので、\ref{ode:sl-lower-bound.1} から $u\in D$ について $(Lu,u)=\int_{0}^{1}|u'|^{2}dx+|u(1)|^{2}\ge0$。固有関数 $u$ では $(Lu,u)=\lambda\|u\|^{2}$ なので $\lambda\ge0$ で、$\lambda=0$ なら $u'\equiv0$, $u(1)=0$ から $u=0$ となり矛盾。

**Step 2.** 【主張：$\lambda=\kappa^{2}$ が固有値 $\iff\tan\kappa=-\kappa$ で、固有関数は $\sin\kappa x$ の定数倍】$-u''=\kappa^{2}u$, $u(0)=0$ の解は $B\sin\kappa x$。$u'(1)+u(1)=B(\kappa\cos\kappa+\sin\kappa)$ なので、$B\neq0$ の解があることと $\sin\kappa+\kappa\cos\kappa=0$ は同値。$\cos\kappa=0$ なら $\sin\kappa=\pm1$ でこれは成り立たないので、$\tan\kappa=-\kappa$ と同値。

**Step 3.** 【主張：$\kappa_{n}\in((n-\frac12)\pi,n\pi)$ がただ一つずつあり、$\kappa_{n}=(n-\frac12)\pi+\arctan(1/\kappa_{n})$】$(0,\frac\pi2)$ では $\tan\kappa>0>-\kappa$ で解はない。$j\ge1$ について $I_{j}\defeq((j-\frac12)\pi,(j+\frac12)\pi)$ の上で $\kappa\mapsto\tan\kappa+\kappa$ は狭義増加で $-\infty$ から $\infty$ まで動くので、零点はただ一つ。$[j\pi,(j+\frac12)\pi)$ では $\tan\kappa\ge0$ で $\tan\kappa+\kappa>0$ なので、零点は $((j-\frac12)\pi,j\pi)$ にある。$\varepsilon_{n}\defeq\kappa_{n}-(n-\frac12)\pi\in(0,\frac\pi2)$ について $\tan\kappa_{n}=-\cot\varepsilon_{n}$ なので、$\tan\varepsilon_{n}=1/\kappa_{n}$。Step 1・2 から固有値は $\lambda_{n}=\kappa_{n}^{2}$ で、この順に並ぶ。$\sin\kappa_{n}x$ の $(0,1)$ の零点は $x=j\pi/\kappa_{n}$（$j\ge1$, $j\pi<\kappa_{n}$）で、$(n-1)\pi<\kappa_{n}<n\pi$ からちょうど $j=1,\dots,n-1$ の $n-1$ 個。\ref{ode:sturm-oscillation.2} と一致する（$\kappa_{1}\approx2.0288$, $\kappa_{2}\approx4.9132$）。

**Step 4.** 【主張：$G(x,y)=\frac12\min\{x,y\}\,(2-\max\{x,y\})$、$\sum_{n}\kappa_{n}^{-4}=\frac{11}{180}$】Step 1 から $0$ は固有値でない。\ref{ode:green-function} の初期値は $(\varphi_{a}(0),\varphi_{a}'(0))=(0,1)$、$(\varphi_{b}(1),\varphi_{b}'(1))=(1,-1)$ で、$\varphi_{a}=x$, $\varphi_{b}=2-x$、$\omega=(2-x)\cdot1-(-1)\cdot x=2$。よって $G$ は主張のとおり。\ref{ode:sl-eigen.3}（$c=0$, $w=1$）と $G$ の対称性から
$$
\sum_{n}\frac{1}{\kappa_{n}^{4}}=2\int_{0}^{1}\frac{(2-y)^{2}}{4}\int_{0}^{y}x^{2}\,dx\,dy=\frac16\int_{0}^{1}y^{3}(2-y)^{2}\,dy=\frac16\Bigl(1-\frac45+\frac16\Bigr)=\frac{11}{180}.
$$

**Step 5.** 【主張：$c_{n}=\dfrac{8(1-\cos\kappa_{n})(1+\kappa_{n}^{2})}{\kappa_{n}^{3}(2+\kappa_{n}^{2})}$、$\cos\kappa_{n}=\dfrac{(-1)^{n}}{\sqrt{1+\kappa_{n}^{2}}}$ で、展開は一様収束】$f(0)=0$, $f'(1)+f(1)=-1+1=0$ なので $f\in D$、$Lf=-f''=4$。$s_{n}\defeq\sin\kappa_{n}x$ とすると、$\sin2\kappa_{n}=2\sin\kappa_{n}\cos\kappa_{n}=-2\kappa_{n}\cos^{2}\kappa_{n}$ と $\cos^{2}\kappa_{n}=\frac{1}{1+\tan^{2}\kappa_{n}}=\frac{1}{1+\kappa_{n}^{2}}$ から
$$
\|s_{n}\|^{2}=\frac12-\frac{\sin2\kappa_{n}}{4\kappa_{n}}=\frac12+\frac{1}{2(1+\kappa_{n}^{2})}=\frac{2+\kappa_{n}^{2}}{2(1+\kappa_{n}^{2})}.
$$
\ref{ode:sl-expansion.3}（$c=0$）から $\langle f,s_{n}\rangle=\langle4,s_{n}\rangle/\kappa_{n}^{2}=\frac{4(1-\cos\kappa_{n})}{\kappa_{n}^{3}}$ で、$c_{n}=\langle f,s_{n}\rangle/\|s_{n}\|^{2}$ は主張の形。$\kappa_{n}\in((n-\frac12)\pi,n\pi)$ で $\cos$ の符号は $(-1)^{n}$。\ref{ode:sl-expansion.2} から $\sum_{n}c_{n}\sin\kappa_{n}x$ は $[0,1]$ で $f$ に一様収束する（$|c_{n}|\le16/\kappa_{n}^{3}$ からも直接わかる）。たとえば $x=1$ で $\sum_{n}c_{n}\sin\kappa_{n}=f(1)=1$。

::: hypcheck
- **境界条件の符号**：Step 1 で $\sigma_{b}=1\ge0$ を使った。$u'(1)-u(1)=0$（$\sigma_{b}=-1$）に変えると $\lambda=0$ が固有値になり（$u=x$）、Step 4 の $c=0$ がとれない。
- **$f\in D$**：Step 5 で \ref{ode:sl-expansion.2}・\ref{ode:sl-expansion.3} を使うのに必要。境界条件を満たさない $f=x$ でも $L^{2}$ 収束（\ref{ode:sl-expansion.1}）はするが、係数は $O(\kappa_{n}^{-2})$ にしかならない。
:::
