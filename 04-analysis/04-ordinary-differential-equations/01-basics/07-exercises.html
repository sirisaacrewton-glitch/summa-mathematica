# 演習：常微分方程式の基礎 {#ode:page-exercises-basics keywords="exercises, Ordinary Differential Equations"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#ode:sec-exbasics-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 初期値問題 {#ode:sec-iv-exercises}

対応するページ：\ref{ode:page-initial-value-problems}

::: problem ★ 基本：変数分離 {#ode:ex-iv-1}
$x'=tx^{2}$, $x(0)=1$ の解を求め、その最大の存在区間を答えよ。
:::

::: solution
$\int_{1}^{x}s^{-2}ds=t^{2}/2$ から $1-1/x=t^{2}/2$、$x(t)=\frac{2}{2-t^{2}}$。$x>0$ の範囲で $t^{2}<2$、最大の存在区間は $(-\sqrt2,\sqrt2)$（両端で発散）。
:::

::: problem ★ 基本：1 階線形方程式 {#ode:ex-iv-2}
$x'+p(t)x=q(t)$（$p,q$ は連続）の解が $x(t)=e^{-P(t)}\bigl(x(t_{0})+\int_{t_{0}}^{t}e^{P(s)}q(s)ds\bigr)$（$P(t)=\int_{t_{0}}^{t}p$）であることを示せ。
:::

::: solution
$(e^{P}x)'=e^{P}(x'+px)=e^{P}q$ を $t_{0}$ から $t$ まで積分すればよい（逆に、右辺が解であることも微分で確かめられ、一意性は $(e^{P}(x-y))'=0$ から）。
:::

::: problem ★★ 標準：グロンウォールの応用 {#ode:ex-iv-3}
連続な $u\ge0$ が $[0,T]$ 上で $u(t)\le\int_{0}^{t}u(s)ds$ を満たせば $u\equiv0$ であることを示せ。
:::

::: solution
\ref{ode:gronwall} で $a\equiv0$, $b\equiv1$ とすると $u\le0$。$u\ge0$ と合わせて $u\equiv0$。
:::

::: problem ★★★ 発展：非一意性の分類 {#ode:ex-iv-4}
$x'=2\sqrt{|x|}$, $x(0)=0$ の $\mathbb{R}$ 上の解をすべて求めよ。
:::

::: solution
$x'\ge0$ なので解は単調非減少で、$x(0)=0$。$x>0$ となる区間では $x=(t-c)^{2}$（$t>c$）の形（変数分離 $\sqrt{x}=t-c$）、$x<0$ となる区間では $-x$ について同様に $x=-(t-d)^{2}$（$t<d$）。$x=0$ の集合は $0$ を含む閉区間 $[d,c]$（$d\le0\le c$、無限でもよい）。よって解は $x(t)=-(t-d)^{2}$（$t<d$）、$0$（$d\le t\le c$）、$(t-c)^{2}$（$t>c$）の形で、$-\infty\le d\le0\le c\le\infty$ の任意の組が現れる。
:::

## 解の存在と一意性 {#ode:sec-eu-exercises}

対応するページ：\ref{ode:page-existence-uniqueness}

::: problem ★ 基本：逐次近似 {#ode:ex-eu-1}
$x'=t+x$, $x(0)=0$ の逐次近似の第 3 項 $x_{3}$ を求め、真の解 $e^{t}-1-t$ のテイラー展開と比べよ。
:::

::: solution
$x_{1}=t^{2}/2$, $x_{2}=t^{2}/2+t^{3}/6$, $x_{3}=t^{2}/2+t^{3}/6+t^{4}/24$。真の解は $\sum_{k\ge2}t^{k}/k!$ で、$x_{3}$ はその 4 次までの部分和。
:::

::: problem ★★ 標準：リプシッツでない右辺 {#ode:ex-eu-2}
$x'=x^{1/3}$（$x^{1/3}$ は実数の 3 乗根）, $x(0)=0$ が少なくとも二つの解をもつことを示し、\ref{ode:picard-lindelof} の仮定のどれが崩れているか答えよ。
:::

::: solution
$x\equiv0$ と、$x(t)=(2t/3)^{3/2}$（$t\ge0$）、$0$（$t<0$）。後者は $x'=(2t/3)^{1/2}=x^{1/3}$。$x^{1/3}$ は $0$ の近くで $x$ についてリプシッツでない（$|x^{1/3}|/|x|\to\infty$）。
:::

::: problem ★★★ 発展：ペアノの解の比較 {#ode:ex-eu-3}
$f$ が連続で、$x$ について非増加（$x\le y$ なら $f(t,x)\ge f(t,y)$、$n=1$）なら、$t\ge t_{0}$ の向きには初期値問題の解は一意であることを示せ。
:::

::: solution
二つの解 $x,y$ について $u\defeq(x-y)^{2}$ とすると $u'=2(x-y)(f(t,x)-f(t,y))\le0$（$x>y$ なら $f(t,x)\le f(t,y)$、逆も同様）。$u(t_{0})=0$, $u\ge0$ で非増加なので、$t\ge t_{0}$ で $u=0$。
:::

## 解の延長と最大解 {#ode:sec-ms-exercises}

対応するページ：\ref{ode:page-maximal-solutions}

::: problem ★ 基本：爆発時刻 {#ode:ex-ms-1}
$x'=1+x^{2}$, $x(0)=0$ の最大解とその定義域を求めよ。
:::

::: solution
$x=\tan t$、定義域 $(-\pi/2,\pi/2)$。両端で $|x|\to\infty$（\ref{ode:escape-corollaries.1}）。
:::

::: problem ★★ 標準：有界性からの大域存在 {#ode:ex-ms-2}
$x'=y$, $y'=-x-x^{3}$ の最大解はすべて $\mathbb{R}$ 全体で定義されることを示せ。（ヒント：$E\defeq\frac12y^{2}+\frac12x^{2}+\frac14x^{4}$。）
:::

::: solution
$E'=yy'+xx'+x^{3}x'=y(-x-x^{3})+xy+x^{3}y=0$ なので $E$ は解に沿って一定。$E\ge\frac12(x^{2}+y^{2})$ なので、解は半径 $\sqrt{2E(0)}$ の閉円板（コンパクト）に留まり、\ref{ode:escape-corollaries.3} から $\beta=\infty$（$\alpha$ も同様）。
:::

::: problem ★★★ 発展：比較による爆発 {#ode:ex-ms-3}
$x'=x^{2}+t^{2}$, $x(0)=1$ の最大解の右端 $\beta$ が $\beta\le1$ を満たすことを示せ。
:::

::: solution
$x'\ge x^{2}$ なので、$x>0$ の間 $(1/x)'=-x'/x^{2}\le-1$、$1/x(t)\le1-t$。$x(0)=1>0$ で $x'\ge0$ なので $x>0$ は保たれる。$t<\beta$ で $1/x(t)>0$ なので $1-t>0$、つまり $\beta\le1$。
:::

## 線形微分方程式 {#ode:sec-ln-exercises}

対応するページ：\ref{ode:page-linear}

::: problem ★ 基本：定数係数 {#ode:ex-ln-1}
$y''-3y'+2y=0$, $y(0)=0$, $y'(0)=1$ を解け。
:::

::: solution
特性多項式 $z^{2}-3z+2=(z-1)(z-2)$ から $y=ae^{t}+be^{2t}$（\ref{ode:constant-coefficient-higher}）。$a+b=0$, $a+2b=1$ から $y=e^{2t}-e^{t}$。
:::

::: problem ★ 基本：重根 {#ode:ex-ln-2}
$y''+2y'+y=0$ の一般解を書き、ロンスキアンを計算して基底であることを確かめよ。
:::

::: solution
$(z+1)^{2}$ から $y_{1}=e^{-t}$, $y_{2}=te^{-t}$。$W=\det\begin{pmatrix}e^{-t}&te^{-t}\\-e^{-t}&(1-t)e^{-t}\end{pmatrix}=e^{-2t}\neq0$。アーベルの公式 $W(t)=W(0)e^{-2t}$ とも一致（$a_{1}=2$）。
:::

::: problem ★★ 標準：基本行列の計算 {#ode:ex-ln-3}
$A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$ について $e^{tA}$ を求め、リウヴィルの公式を確かめよ。
:::

::: solution
$A=I+N$, $N^{2}=0$ なので $e^{tA}=e^{t}(I+tN)=\begin{pmatrix}e^{t}&te^{t}\\0&e^{t}\end{pmatrix}$。$\det e^{tA}=e^{2t}=\exp(t\operatorname{tr}A)$。
:::

::: problem ★★★ 発展：周期係数とフロケ {#ode:ex-ln-4}
$A(t)$ が周期 $T$ の連続関数なら、推移行列について $\Phi(t+T,s+T)=\Phi(t,s)$ を示し、$M\defeq\Phi(T,0)$（モノドロミー行列）について $\Phi(t+T,0)=\Phi(t,0)M$ を導け。
:::

::: solution
$X(t)\defeq\Phi(t+T,s+T)$ は $X'=A(t+T)X=A(t)X$, $X(s)=I$ を満たすので、一意性から $\Phi(t,s)$。すると $\Phi(t+T,0)=\Phi(t+T,T)\Phi(T,0)=\Phi(t,0)M$。
:::

## 初期値とパラメータへの依存性 {#ode:sec-dp-exercises}

対応するページ：\ref{ode:page-dependence}

::: problem ★ 基本：変分方程式 {#ode:ex-dp-1}
$x'=x^{2}$ の一般解 $\phi(t,0,\xi)=\xi/(1-\xi t)$ について、$\partial\phi/\partial\xi$ を直接計算し、変分方程式 $Y'=2\phi Y$, $Y(0)=1$ の解と一致することを確かめよ。
:::

::: solution
$\partial\phi/\partial\xi=1/(1-\xi t)^{2}$。$Y\defeq(1-\xi t)^{-2}$ について $Y'=2\xi(1-\xi t)^{-3}=2\phi Y$, $Y(0)=1$。
:::

::: problem ★★ 標準：初期値についての 2 階微分 {#ode:ex-dp-2}
$f$ が $C^{2}$ 級（$n=1$, 自励系）のとき、$Z\defeq\partial^{2}\phi/\partial\xi^{2}$ が満たす線形方程式を導け。
:::

::: solution
$\phi$ は $C^{2}$ 級（\ref{ode:ck-dependence}）で、$\partial_{t}\partial_{\xi}=\partial_{\xi}\partial_{t}$。$Y=\partial_{\xi}\phi$ は $Y'=f'(\phi)Y$ を満たす。もう一度 $\xi$ で微分して $Z'=f'(\phi)Z+f''(\phi)Y^{2}$, $Z(0)=0$（$Y(0)=1$ は $\xi$ によらない）。
:::

::: problem ★★★ 発展：パラメータについての微分 {#ode:ex-dp-3}
$x'=\lambda x$（$n=1$）の解 $\phi(t,0,1,\lambda)=e^{\lambda t}$ について、パラメータ依存性の定理（\ref{ode:parameter-dependence}）が保証する滑らかさと、$\partial\phi/\partial\lambda=te^{\lambda t}$ を、拡大系 $(x,\lambda)'=(\lambda x,0)$ の変分方程式から導け。
:::

::: solution
拡大系の右辺 $(\lambda x,0)$ のヤコビ行列は $\begin{pmatrix}\lambda&x\\0&0\end{pmatrix}$。初期値 $(1,\lambda)$ について、$\lambda$ 方向の初期の摂動 $(0,1)$ の時間発展 $v=(v_{1},v_{2})$ は $v_{1}'=\lambda v_{1}+x$, $v_{2}'=0$, $v(0)=(0,1)$、$x=e^{\lambda t}$。$v_{2}\equiv1$ で $v_{1}'=\lambda v_{1}+e^{\lambda t}$、$v_{1}(0)=0$ の解は $v_{1}=te^{\lambda t}$（定数変化法）。これが $\partial\phi/\partial\lambda$。
:::

## 自励系と流れ {#ode:sec-fl-exercises}

対応するページ：\ref{ode:page-flows}

::: problem ★ 基本：1 次元の流れ {#ode:ex-fl-1}
$F(x)=x^{2}$（$W=\mathbb{R}$）の流れの定義域 $\mathcal{D}_{F}$ を求めよ。
:::

::: solution
$\Phi_{t}(\xi)=\xi/(1-\xi t)$。$I_{\xi}$ は、$\xi>0$ なら $(-\infty,1/\xi)$、$\xi<0$ なら $(1/\xi,\infty)$、$\xi=0$ なら $\mathbb{R}$。$\mathcal{D}_{F}=\{(t,\xi):\xi t<1\}$ で、開集合（\ref{ode:flow-theorem.1}）。
:::

::: problem ★★ 標準：群の性質の確認 {#ode:ex-fl-2}
前問の流れで $\Phi_{s}\circ\Phi_{t}=\Phi_{s+t}$ を（定義される範囲で）直接確かめよ。
:::

::: solution
$\Phi_{s}(\Phi_{t}(\xi))=\frac{\xi/(1-\xi t)}{1-s\xi/(1-\xi t)}=\frac{\xi}{1-\xi t-\xi s}=\Phi_{s+t}(\xi)$。
:::

::: problem ★★★ 発展：完備性と隆起関数 {#ode:ex-fl-3}
$C^{\infty}$ 級のベクトル場 $F$ が $W$ 上で与えられ、$K\subset W$ がコンパクトとする。$K$ の近傍で $F$ と一致し、$\mathbb{R}^{n}$ 全体で完備なベクトル場 $\tilde F$ を作れ。
:::

::: solution
隆起関数 $\beta$（$\mathbb{R}^{n}$ 上 $C^{\infty}$ 級で、$|x|\le1$ で $1$、$|x|\ge2$ で $0$、\ref{mfd:bump-function}）を使う。各 $p\in K$ に $r_{p}>0$ を $\bar B(p,3r_{p})\subset W$ ととり、コンパクト性から有限個の $B(p_{i},r_{i})$ で $K$ を覆う。$\chi\defeq1-\prod_{i}\bigl(1-\beta((x-p_{i})/r_{i})\bigr)$ は $C^{\infty}$ 級で、$\bigcup B(p_{i},r_{i})$（$K$ の近傍）の上で $1$、$\bigcup\bar B(p_{i},2r_{i})$（$W$ に含まれるコンパクト集合）の外で $0$。$\tilde F\defeq\chi F$（$W$ の外では $0$）は $\mathbb{R}^{n}$ 上の $C^{\infty}$ 級のベクトル場で、台はコンパクトなので \ref{ode:flow-theorem.5} から完備。
:::
