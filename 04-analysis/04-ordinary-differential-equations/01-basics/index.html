# 常微分方程式の基礎（Basic Theory of Ordinary Differential Equations）

初期値問題と積分方程式、リプシッツ条件とグロンウォールの不等式、ピカール–リンデレーフの定理とペアノの存在定理、最大解と逃避補題、線形方程式（基本行列・リウヴィルの公式・定数変化法・定数係数）、初期値とパラメータへの連続・微分可能・Cᵏ 依存性（変分方程式）、自励系の流れと整流定理。

<p class="mn-msc">MSC2020: 34A12, 34A30, 34A34</p>

## 前提知識

- [実解析 › 多変数解析](../../../04-analysis/01-real-analysis/03-multivariable-calculus/index.html)（全体、11 ページ）：全微分・C^k 級・連鎖律・平均値の不等式・逆関数定理
- [実解析 › 一変数の微積分](../../../04-analysis/01-real-analysis/02-calculus/index.html)（全体、11 ページ）：リーマン積分・微分積分学の基本定理・一様収束
- [一般位相 › 距離空間](../../../05-geometry-topology/01-general-topology/06-metric-spaces/index.html)（全体、12 ページ）：完備距離空間・バナッハの不動点定理・ハイネ–カントールの定理
- [実解析 › ベクトル解析](../../../04-analysis/01-real-analysis/04-vector-analysis/index.html)（全体、4 ページ）：ベクトル値関数の積分の評価
- [一般位相 › 関数空間の位相](../../../05-geometry-topology/01-general-topology/03-function-spaces/index.html)（全体、5 ページ）：アスコリ–アルツェラの定理（ペアノの定理）
- [線形代数 › 固有値とジョルダン標準形](../../../02-algebra/01-linear-algebra/03-eigen/index.html)（全体、4 ページ）：行列の指数関数・ジョルダン標準形
