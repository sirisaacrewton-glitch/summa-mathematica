# 自励系と流れ {#ode:page-flows keywords="autonomous systems, time translation invariance, flow of a C^k vector field on an open set of R^n, flow domain is open and the flow is C^k, group law, time-t maps are C^k diffeomorphisms, compactly supported vector fields are complete, suspension of time-dependent equations, flow box (straightening) theorem, first integrals"}

右辺が時間によらない方程式 $x'=F(x)$（自励系）では、解を時間方向に平行移動しても解である。そのため、時刻 $0$ に $\xi$ を出発する解の時刻 $t$ での位置 $\Phi_{t}(\xi)$ だけを考えればよい。$\Phi$ を $F$ の**流れ**という。このページでは、前のページの依存性の定理から、流れの定義域が開集合で流れが $C^{k}$ 級であること、流れが群の性質 $\Phi_{s}\circ\Phi_{t}=\Phi_{s+t}$ を満たし各 $\Phi_{t}$ が微分同相写像であること、台がコンパクトなベクトル場の流れはすべての時刻で定義されることを示す（\ref{ode:flow-theorem}）。これが、多様体上のベクトル場の流れ（\ref{mfd:flow-theorem}）で引用していた結果の $\mathbb{R}^{n}$ 版である。最後に、零でない点の近くでは座標を取り替えて流れを平行移動にできること（**整流定理**、\ref{ode:flow-box}）を示す。

## 記法と定義の確認 {#ode:sec-fl-notation}

::: notation
- 一般解 $\phi(t,t_{0},\xi)$ とその定義域 $\Omega$、連続依存性・$C^{k}$ 依存性は \ref{ode:continuous-dependence}, \ref{ode:c1-dependence}, \ref{ode:ck-dependence}。最大解と逃避補題は \ref{ode:maximal-solution}, \ref{ode:escape-corollaries}。\ref{calc:inverse-function-theorem}。
- 以下 $W\subset\mathbb{R}^{n}$ は開集合、$F\colon W\to\mathbb{R}^{n}$ は $C^{k}$ 級（$1\le k\le\infty$）。$F$ を $W$ 上の**ベクトル場**ともいう。自励系 $x'=F(x)$ は $D=\mathbb{R}\times W$, $f(t,x)=F(x)$ の場合である。
:::

## 流れ {#ode:sec-fl-flow}

::: lemma 時間の平行移動 {#ode:time-translation keywords="for autonomous systems, t -> x(t + s) is a solution whenever x is; phi(t, t_0, xi) = phi(t - t_0, 0, xi)" index="時間の平行移動不変性|じかんのへいこういどうふへんせい"}
$x$ が自励系の区間 $J$ 上の解なら、$s\in\mathbb{R}$ について $t\mapsto x(t+s)$ は $J-s$ 上の解である。とくに $\phi(t,t_{0},\xi)=\phi(t-t_{0},0,\xi)$ で、定義域もそれに応じて平行移動したものになる。
:::

::: proof
$\frac{d}{dt}x(t+s)=x'(t+s)=F(x(t+s))$。後半：$t\mapsto\phi(t+t_{0},t_{0},\xi)$ は時刻 $0$ に $\xi$ を通る解で、逆に $t\mapsto\phi(t-t_{0},0,\xi)$ は時刻 $t_{0}$ に $\xi$ を通る解。最大解の一意性から、一方は他方の平行移動で、定義域も平行移動の関係にある。
:::

::: definition 流れ {#ode:flow-def keywords="maximal interval I_xi of the solution starting at xi at time 0; flow domain D_F = {(t, xi) : t in I_xi}; flow Phi(t, xi); integral curves; complete vector field" index="流れ（常微分方程式）|ながれじょうびぶんほうていしき, 積分曲線（常微分方程式）|せきぶんきょくせんじょうびぶんほうていしき, 完備なベクトル場（ユークリッド空間）|かんびなべくとるばゆーくりっどくうかん, 平衡点|へいこうてん"}
$\xi\in W$ について、時刻 $0$ に $\xi$ を通る最大解の定義域を $I_{\xi}$ とし、$\mathcal{D}_{F}\defeq\{(t,\xi):\xi\in W,\ t\in I_{\xi}\}$、$\Phi(t,\xi)=\Phi_{t}(\xi)\defeq\phi(t,0,\xi)$ と定める。$\Phi$ を $F$ の**流れ**、解 $t\mapsto\Phi_{t}(\xi)$ を $\xi$ を通る**積分曲線**という。$\mathcal{D}_{F}=\mathbb{R}\times W$ のとき $F$ は**完備**であるという。$F(\xi)=0$ となる点を**平衡点**という（$\Phi_{t}(\xi)=\xi$ がすべての $t$ で成り立つ）。
:::

::: theorem 流れの基本性質 {#ode:flow-theorem keywords="the flow domain is open and contains {0} x W; the flow is C^k; I_{Phi_t(xi)} = I_xi - t and Phi_s(Phi_t(xi)) = Phi_{s+t}(xi); W_t is open and Phi_t: W_t -> W_{-t} is a C^k diffeomorphism with inverse Phi_{-t}; D Phi_t solves the variational equation; compactly supported vector fields are complete" index="流れの基本定理（ユークリッド空間）|ながれのきほんていりゆーくりっどくうかん"}
1. $\mathcal{D}_{F}$ は $\mathbb{R}\times W$ の開集合で $\{0\}\times W$ を含み、$\Phi\colon\mathcal{D}_{F}\to W$ は $C^{k}$ 級である。
2. $t\in I_{\xi}$ なら $I_{\Phi_{t}(\xi)}=I_{\xi}-t$ で、$s\in I_{\Phi_{t}(\xi)}$ について $\Phi_{s}(\Phi_{t}(\xi))=\Phi_{s+t}(\xi)$。
3. $W_{t}\defeq\{\xi:(t,\xi)\in\mathcal{D}_{F}\}$ は開集合で、$\Phi_{t}\colon W_{t}\to W_{-t}$ は $C^{k}$ 級の微分同相写像、逆写像は $\Phi_{-t}$。
4. $D\Phi_{t}(\xi)$（$\xi$ についてのヤコビ行列）は、変分方程式 $Y'=DF(\Phi_{t}(\xi))Y$, $Y(0)=I$ の解である。
5. $F$ の台 $\operatorname{supp}F\defeq\overline{\{x\in W:F(x)\neq0\}}$（$W$ における閉包）がコンパクトなら、$F$ は完備である。
:::

::: proof
**1.** $(t,\xi)\in\mathcal{D}_{F}\iff(t,0,\xi)\in\Omega$。$\Omega$ は開集合（\ref{ode:continuous-dependence}）なので、その $t_{0}=0$ での切り口 $\mathcal{D}_{F}$ も開集合（$(t,\xi)\mapsto(t,0,\xi)$ は連続）。$0\in I_{\xi}$。$\Phi=\phi(\cdot,0,\cdot)$ は \ref{ode:ck-dependence} から $C^{k}$ 級。

**2.** $t\in I_{\xi}$ を固定し、$x\defeq\Phi_{\cdot}(\xi)$、$y$ を時刻 $0$ に $\Phi_{t}(\xi)$ を通る最大解（定義域 $I'\defeq I_{\Phi_{t}(\xi)}$）とする。$s\mapsto x(s+t)$ は $I_{\xi}-t$ 上の解で、時刻 $0$ に $\Phi_{t}(\xi)$ を通る（\ref{ode:time-translation}）ので、$y$ の制限：$I_{\xi}-t\subset I'$ で $y(s)=x(s+t)$。逆に $u\mapsto y(u-t)$ は $I'+t$ 上の解で、時刻 $t$ に $x(t)$ を通るので、時刻 $t$ に $x(t)$ を通る最大解 $x$（最大解の一意性、\ref{ode:maximal-solution}）の制限：$I'+t\subset I_{\xi}$。よって $I'=I_{\xi}-t$、$\Phi_{s}(\Phi_{t}(\xi))=y(s)=x(s+t)=\Phi_{s+t}(\xi)$。

**3.** $W_{t}$ は開集合 $\mathcal{D}_{F}$ の切り口なので開。$\xi\in W_{t}$ なら、2 から $-t\in I_{\xi}-t=I_{\Phi_{t}(\xi)}$ なので $\Phi_{t}(\xi)\in W_{-t}$、かつ $\Phi_{-t}(\Phi_{t}(\xi))=\Phi_{0}(\xi)=\xi$。$t$ と $-t$ を入れ替えれば $\Phi_{t}\circ\Phi_{-t}=\mathrm{id}$ on $W_{-t}$。$\Phi_{t}$ と $\Phi_{-t}$ はともに $C^{k}$ 級（1）なので、$\Phi_{t}$ は $C^{k}$ 級の微分同相写像。

**4.** \ref{ode:c1-dependence} の $\partial\phi/\partial\xi$ の式（$t_{0}=0$）。

**5.** $K\defeq\operatorname{supp}F$ とする。【主張：各積分曲線は定値か、$K$ の中に留まる】$x$ を $\xi$ を通る最大の積分曲線とし、ある $t_{1}$ で $x(t_{1})\notin K$ とする。$F(x(t_{1}))=0$ なので、定値曲線 $t\mapsto x(t_{1})$ は時刻 $t_{1}$ に $x(t_{1})$ を通る $\mathbb{R}$ 上の解で、一意性から $x$ はその制限、つまり定値で $I_{\xi}=\mathbb{R}$。そうでなければ、$x$ のすべての値は $K$ に入る。$K$ はコンパクトなので、\ref{ode:escape-corollaries.3}（とその $\alpha$ 側）から $I_{\xi}=\mathbb{R}$。

::: hypcheck
- **$F$ が $C^{k}$ 級（$k\ge1$）**：1 の滑らかさ（\ref{ode:ck-dependence}）と、一意性（局所リプシッツ）に使った。$F$ がリプシッツなだけなら、1 の $C^{k}$ 級は連続に、3 は同相写像に弱まる。
- **台のコンパクト性**：5 で逃避補題に使った。$W=\mathbb{R}$, $F(x)=x^{2}$ は台がコンパクトでなく、完備でない（\ref{ode:basic-examples.2}）。
:::
:::

::: proposition 時間に依存する方程式の懸垂 {#ode:suspension keywords="a time-dependent equation x' = f(t,x) is equivalent to the autonomous system (s, x)' = (1, f(s, x)) on D; the general solution is phi(t, t_0, xi) = pr Phi_{t - t_0}(t_0, xi)" index="懸垂（微分方程式）|けんすいびぶんほうていしき, 自励化|じれいか"}
$D\subset\mathbb{R}\times\mathbb{R}^{n}$ を開集合、$f\colon D\to\mathbb{R}^{n}$ を $C^{k}$ 級とし、$D$ 上のベクトル場 $\tilde F(s,x)\defeq(1,f(s,x))$ の流れを $\tilde\Phi$ とする。このとき $\tilde\Phi_{\tau}(t_{0},\xi)=(t_{0}+\tau,\ \phi(t_{0}+\tau,t_{0},\xi))$ で、$x'=f(t,x)$ の一般解は $\tilde\Phi$ から得られる。
:::

::: proof
$\tilde\Phi_{\tau}(t_{0},\xi)=(s(\tau),x(\tau))$ とすると $s'=1$, $s(0)=t_{0}$ から $s(\tau)=t_{0}+\tau$、$x'(\tau)=f(t_{0}+\tau,x(\tau))$, $x(0)=\xi$ なので $x(\tau)=\phi(t_{0}+\tau,t_{0},\xi)$（$\tau\mapsto\phi(t_{0}+\tau,t_{0},\xi)$ も同じ初期値問題の最大解で、一意性から一致し、定義域も一致する）。
:::

この懸垂は、シンプレクティック幾何のモーザーの補題（\ref{symp:moser-lemma}）で、多様体の上で使った。

## 整流定理と第一積分 {#ode:sec-fl-flow-box}

::: theorem 整流定理 {#ode:flow-box keywords="flow box theorem: near a point p with F(p) != 0 there is a C^k diffeomorphism G from a neighbourhood of 0 onto a neighbourhood of p with G(t + s, y) = Phi_s(G(t, y)) and dG(e_1) = F o G; in the coordinates G^{-1} the equation becomes y' = e_1" index="整流定理|せいりゅうていり, フローボックス定理|ふろーぼっくすていり"}
$F(p)\neq0$ とする。$0\in\mathbb{R}^{n}$ の開近傍 $U$ と $p$ の開近傍 $V$、$C^{k}$ 級の微分同相写像 $G\colon U\to V$ で、$G(0)=p$ かつ
$$
DG(u)\,e_{1}=F(G(u))\qquad(u\in U)
$$
となるものがある。つまり、座標 $y=G^{-1}(x)$ では、方程式 $x'=F(x)$ は $y'=e_{1}$（$y_{1}'=1$, $y_{2}'=\cdots=y_{n}'=0$）になり、積分曲線は $y_{1}$ 軸に平行な直線になる。
:::

::: intuition
零でないベクトル場の近くでは、積分曲線は互いにほぼ平行な曲線の束である。その束を、$F(p)$ に横断的な超平面から出発させた時間 $t$ でパラメータ付けすれば、束がまっすぐな平行線に引き伸ばされる。
:::

::: proof
**Step 1（写像の定義）.** $v_{2},\dots,v_{n}$ を、$F(p),v_{2},\dots,v_{n}$ が $\mathbb{R}^{n}$ の基底になるようにとる。$G(t,y_{2},\dots,y_{n})\defeq\Phi_{t}\bigl(p+\sum_{j\ge2}y_{j}v_{j}\bigr)$ とおく。$p\in W_{0}$ で $\mathcal{D}_{F}$ は開集合なので、$G$ は $0$ の開近傍で定義され、\ref{ode:flow-theorem.1} から $C^{k}$ 級。

**Step 2（微分）.** $\partial G/\partial t(u)=F(G(u))$（積分曲線の定義）。$t=0$ では $G(0,y)=p+\sum y_{j}v_{j}$ なので $\partial G/\partial y_{j}(0)=v_{j}$。よって $DG(0)$ の列は $F(p),v_{2},\dots,v_{n}$ で、可逆。

**Step 3.** \ref{calc:inverse-function-theorem}から、$0$ の開近傍 $U$ で $G\restriction U$ が開集合 $V\ni p$ への $C^{k}$ 級の微分同相写像になるものがある。Step 2 から $DG(u)e_{1}=\partial G/\partial t(u)=F(G(u))$。最後の主張：$y(t)$ が $y'=e_{1}$ を満たすことと、$x(t)\defeq G(y(t))$ が $x'=DG(y)y'=DG(y)e_{1}=F(x)$ を満たすことは同値（$G$ は微分同相写像）。
:::

::: definition 第一積分 {#ode:first-integral keywords="first integral (conserved quantity): a C^1 function H with DH(x) F(x) = 0; H is constant along integral curves" index="第一積分|だいいちせきぶん, 保存量（常微分方程式）|ほぞんりょうじょうびぶんほうていしき"}
$W$ の開集合 $U$ 上の $C^{1}$ 級関数 $H$ で、$U$ の各点で $DH(x)F(x)=0$ となるものを、$x'=F(x)$ の（$U$ 上の）**第一積分**という。このとき、$U$ に含まれる積分曲線 $x$ に沿って $\frac{d}{dt}H(x(t))=DH(x)x'=DH(x)F(x)=0$ なので、$H$ は一定である。
:::

整流定理の座標 $y$ では、$y_{2},\dots,y_{n}$ は $n-1$ 個の第一積分で、各点での微分は一次独立である。とくに、零でない点の近くには、一次独立な第一積分が局所的に $n-1$ 個ある。

::: supplement
**高い視点：流れは 1 パラメータ変換群.** 流れ $\Phi$ は、加法群 $\mathbb{R}$ の（部分的な）作用 $\mathbb{R}\times W\to W$ で、ベクトル場はその作用の「無限小の生成元」である。ベクトル場から流れへの対応は、リー環からリー群への指数写像（\ref{lie:exponential-map}）の、無限次元の微分同相群での類似とみることができ、実際に左不変ベクトル場の流れは右移動 $R_{\exp tX}$ である（\ref{lie:invariant-field-complete}）。整流定理は、「零でないベクトル場には局所的な不変量がない」ことを述べている。これは、シンプレクティック形式に局所的な不変量がないダルブーの定理（\ref{symp:darboux}）と同じ型の主張で、どちらも局所的な標準形の存在定理である。比喩で言えば、川の流れは、淀み（平衡点）のない場所なら、うまく座標を選べばまっすぐな一様な流れに見える。面白いことはすべて淀みのまわりか、流れ全体の大域的な形で起こる。

**補足.** 平衡点のまわりの振る舞い（線形化 $DF(p)$ の固有値による安定性、ハートマン–グロブマンの定理）や、周期軌道、ポアンカレ–ベンディクソンの定理などは、力学系の理論で扱う。
:::

## 問題 {#ode:sec-fl-problems}

::: problem {#ode:prob-fl-linear-flow}
$F(x)=Ax$（$A\in M_{n}(\mathbb{R})$）の流れは $\Phi_{t}=e^{tA}$ で、完備であることを確かめよ。台はコンパクトでないのに完備である理由を述べよ。
:::

::: solution
$\frac{d}{dt}e^{tA}\xi=Ae^{tA}\xi$、$t=0$ で $\xi$ なので、一意性から $\Phi_{t}(\xi)=e^{tA}\xi$ で、すべての $t$ で定義される（\ref{ode:constant-coefficients}）。台のコンパクト性は十分条件にすぎず、ここでは右辺が線形増大なので \ref{ode:linear-growth-global} から完備。
:::

::: problem {#ode:prob-fl-rotation-integral}
$F(x,y)=(-y,x)$ の流れを求め、$H(x,y)=x^{2}+y^{2}$ が第一積分であることを確かめよ。原点以外の点で、整流定理の座標を極座標を使って具体的に与えよ。
:::

::: solution
$\Phi_{t}(x,y)=(x\cos t-y\sin t,\ x\sin t+y\cos t)$（$F$ は線形で $e^{tA}$ は回転）。$DH\cdot F=2x(-y)+2y\,x=0$。点 $p=(r_{0},0)$（$r_{0}>0$）の近くで $G(t,y_{2})\defeq\Phi_{t}(r_{0}+y_{2},0)=((r_{0}+y_{2})\cos t,(r_{0}+y_{2})\sin t)$ とすれば、$G^{-1}$ は極座標 $(\theta,r-r_{0})$ で、方程式は $\theta'=1$, $r'=0$ になる。
:::
