# 確率変数の収束 {#prb:page-convergence keywords="modes of convergence of random variables: almost sure, in probability, in L^p, in distribution; subsequence criterion; uniform integrability and Vitali's convergence theorem; convergence in distribution via distribution functions and bounded continuous functions; Skorokhod representation on the real line via quantile functions; Helly's selection theorem; tightness; Prokhorov's theorem on R"}

確率変数の列 $X_{n}$ が $X$ に「近づく」ことには、いくつかの異なる意味がある。各 $\omega$ ごとに収束する**概収束**、大きくずれる確率が $0$ に近づく**確率収束**、$E[|X_{n}-X|^{p}]\to0$ となる **$L^{p}$ 収束**、そして分布だけが近づく**法則収束**（分布収束）である。このページでは、これらの関係を整理し、確率収束から $L^{1}$ 収束が従うための必要十分条件が**一様可積分性**であること（ヴィタリの定理）を示す。後半では法則収束を扱い、分布関数による定義と有界連続関数による特徴づけが同値であることを、分位点関数を使って同じ確率空間の上で概収束に置き換える方法（**スコロホッドの表現**）で示す。最後に、分布の列から収束する部分列がとれるための条件（**緊密性**）を与える**ヘリーの選出定理**を示す。中心極限定理（次のページ）の証明はこれらの上に立つ。

## 記法と定義の確認 {#prb:sec-cv-notation}

::: notation
- 確率変数・分布関数・分位点関数は \ref{prb:page-random-variables}（とくに \ref{prb:distribution-function}）、概収束・確率収束は \ref{prb:sec-ln-notation} のとおり。
- 優収束定理は \ref{meas:dominated-convergence}、ファトゥの補題は \ref{meas:fatou}、マルコフの不等式は \ref{prb:basic-inequalities.1}。
- $E[X;A]\defeq E[X\mathbf{1}_{A}]$。
- $C_{b}(\mathbb{R})$ は $\mathbb{R}$ 上の有界連続関数全体。分布関数 $F$ の連続点全体を $C(F)$ と書く。単調関数の不連続点は高々可算なので（不連続点ごとに、跳びの開区間 $(F(x-),F(x))$ が互いに素で、それぞれ有理数を含む）、$C(F)$ の補集合は可算で、$C(F)$ は稠密。
- **選択公理**：使わない（部分列の取り出しは、条件を満たす最小の番号をとることで具体的に行う）。
:::

## 概収束・確率収束・Lᵖ 収束 {#prb:sec-cv-modes}

::: theorem 収束の関係 {#prb:convergence-relations keywords="almost sure convergence implies convergence in probability; L^p convergence implies convergence in probability; X_n -> X in probability iff every subsequence has a further subsequence converging almost surely; the converses fail" index="確率収束|かくりつしゅうそく, 概収束|がいしゅうそく, Lp 収束|えるぴーしゅうそく"}
$X_{n},X$ を実数値確率変数とする。
1. $X_{n}\to X$（a.s.）なら $X_{n}\to X$（確率収束）。
2. $p>0$ で $E[|X_{n}-X|^{p}]\to0$ なら $X_{n}\to X$（確率収束）。
3. $X_{n}\to X$（確率収束）であることと、任意の部分列 $(X_{n_{k}})$ がさらに部分列 $(X_{n_{k_{j}}})$ で a.s. で $X$ に収束するものをもつことは同値。
4. 1・2 の逆は成り立たない。
:::

::: proof
**1.** $\varepsilon>0$ について $\mathbf{1}_{\{|X_{n}-X|>\varepsilon\}}\to0$（a.s.）で、$1$ で抑えられるので優収束定理から $P(|X_{n}-X|>\varepsilon)\to0$。

**2.** マルコフの不等式から $P(|X_{n}-X|>\varepsilon)\le\varepsilon^{-p}E[|X_{n}-X|^{p}]$。

**3.** （⇒）部分列もまた確率収束するので、元の列について a.s. 収束する部分列を作れば十分。$k\ge1$ について $P(|X_{n}-X|>2^{-k})<2^{-k}$ となる最小の $n$ を $n_{k}$ とし、必要なら大きくして $n_{1}<n_{2}<\cdots$ とする。$\sum_{k}P(|X_{n_{k}}-X|>2^{-k})<\infty$ なので、\ref{prb:borel-cantelli.1} から a.s. で有限個の $k$ を除いて $|X_{n_{k}}-X|\le2^{-k}$、すなわち $X_{n_{k}}\to X$（a.s.）。

（⇐）$X_{n}\to X$（確率収束）でないとすると、ある $\varepsilon,\eta>0$ と部分列で $P(|X_{n_{k}}-X|>\varepsilon)\ge\eta$（すべての $k$）。仮定からさらに部分列が a.s. 収束し、1 からその部分列は確率収束するので、矛盾。

**4.** $([0,1),\lambda)$ 上で $X_{n}\defeq n\mathbf{1}_{[0,1/n)}$ は a.s. で（$u>0$ ごとに）$0$ に収束するが $E[X_{n}]=1$ なので $L^{1}$ で収束しない。確率収束するが a.s. 収束しない例は、区間 $[\frac{j}{2^{k}},\frac{j+1}{2^{k}})$ の指示関数を $k=0,1,\dots$, $j=0,\dots,2^{k}-1$ の順に並べた列（「タイプライター列」）：確率 $2^{-k}\to0$ で確率収束するが、各 $u$ で値 $1$ を無限回とる。
:::

## 一様可積分性 {#prb:sec-cv-ui}

::: definition 一様可積分性 {#prb:uniform-integrability keywords="uniform integrability: sup_n E[|X_n|; |X_n| > M] -> 0 as M -> infinity" index="一様可積分|いちようかせきぶん"}
確率変数の族 $\{X_{i}\}_{i\in I}$ が**一様可積分**であるとは、$\lim_{M\to\infty}\sup_{i}E[|X_{i}|;|X_{i}|>M]=0$ となることをいう。
:::

::: proposition 一様可積分性の判定 {#prb:ui-criteria keywords="uniformly integrable families are bounded in L^1; families bounded in L^p (p > 1) are uniformly integrable; dominated families are uniformly integrable; equivalent epsilon-delta formulation" index="一様可積分性の判定|いちようかせきぶんせいのはんてい"}
1. 一様可積分な族は $L^{1}$ で有界：$\sup_{i}E[|X_{i}|]<\infty$。
2. ある $p>1$ で $\sup_{i}E[|X_{i}|^{p}]<\infty$ なら一様可積分。
3. 可積分な $Y$ について $|X_{i}|\le Y$（すべての $i$）なら一様可積分。
4. $\{X_{i}\}$ が一様可積分 $\iff$ $L^{1}$ で有界で、かつ任意の $\varepsilon>0$ に $\delta>0$ があって $P(A)<\delta\Rightarrow\sup_{i}E[|X_{i}|;A]<\varepsilon$。
:::

::: proof
**1.** $M$ を $\sup_{i}E[|X_{i}|;|X_{i}|>M]\le1$ となるようにとると $E[|X_{i}|]\le M+1$。

**2.** $|X_{i}|>M$ なら $|X_{i}|\le M^{1-p}|X_{i}|^{p}$ なので $E[|X_{i}|;|X_{i}|>M]\le M^{1-p}\sup E[|X|^{p}]\to0$。

**3.** $E[|X_{i}|;|X_{i}|>M]\le E[Y;Y>M]$ で、右辺は優収束定理から $0$ に収束する（$Y<\infty$ a.s.）。

**4.** （⇒）$E[|X_{i}|;A]\le MP(A)+E[|X_{i}|;|X_{i}|>M]$。まず第 2 項 $<\frac\varepsilon2$ となる $M$ をとり、$\delta\defeq\frac{\varepsilon}{2M}$。（⇐）$C\defeq\sup E[|X_{i}|]$ とすると、マルコフの不等式から $P(|X_{i}|>M)\le\frac CM$。$M>\frac C\delta$ なら $P(|X_{i}|>M)<\delta$ なので $E[|X_{i}|;|X_{i}|>M]<\varepsilon$。
:::

::: theorem ヴィタリの収束定理 {#prb:vitali-convergence keywords="Vitali convergence theorem: if X_n -> X in probability, then X_n -> X in L^1 iff {X_n} is uniformly integrable; then E X_n -> E X" index="ヴィタリの収束定理|う゛ぃたりのしゅうそくていり"}
$X_{n}\to X$（確率収束）とする。$\{X_{n}\}$ が一様可積分なら、$X\in L^{1}$ で $E[|X_{n}-X|]\to0$（とくに $E[X_{n}]\to E[X]$）。逆に $X_{n},X\in L^{1}$ で $E[|X_{n}-X|]\to0$ なら $\{X_{n}\}$ は一様可積分。
:::

::: proof
**（⇒）Step 1（$X\in L^{1}$）.** \ref{prb:convergence-relations.3} から a.s. 収束する部分列があり、ファトゥの補題から $E[|X|]\le\liminf E[|X_{n_{k}}|]\le\sup E[|X_{n}|]<\infty$（\ref{prb:ui-criteria.1}）。

**Step 2.** $\varepsilon>0$ とする。$\{X_{n}\}\cup\{X\}$ も一様可積分（\ref{prb:ui-criteria.4} の条件は 1 個加えても保たれる：$X$ については優収束定理で $P(A)\to0$ のとき $E[|X|;A]\to0$）。\ref{prb:ui-criteria.4} の $\delta$ をこの族について $\varepsilon$ でとる。$A_{n}\defeq\{|X_{n}-X|>\varepsilon\}$ とすると、$n$ が大きければ $P(A_{n})<\delta$ で
$$
E[|X_{n}-X|]\le\varepsilon+E[|X_{n}|;A_{n}]+E[|X|;A_{n}]<3\varepsilon.
$$

**（⇐）** $\varepsilon>0$ について、$n\ge N$ で $E[|X_{n}-X|]<\varepsilon$ となる $N$ をとる。有限族 $\{X_{1},\dots,X_{N},X\}$ は \ref{prb:ui-criteria.4} の条件を満たす（各々について優収束定理）ので、共通の $\delta$ がとれる。$P(A)<\delta$ なら、$n\ge N$ で $E[|X_{n}|;A]\le E[|X|;A]+E[|X_{n}-X|]<2\varepsilon$、$n<N$ では $<\varepsilon$。$L^{1}$ 有界性も明らかなので、\ref{prb:ui-criteria.4} から一様可積分。
:::

## 法則収束 {#prb:sec-cv-distribution}

::: definition 法則収束 {#prb:convergence-in-distribution keywords="convergence in distribution (weak convergence, convergence in law): F_{X_n}(x) -> F_X(x) at every continuity point x of F_X" index="法則収束|ほうそくしゅうそく, 分布収束|ぶんぷしゅうそく, 弱収束（確率測度）|じゃくしゅうそくかくりつそくど"}
実数値確率変数 $X_{n}$, $X$（同じ確率空間の上になくてよい）について、$X$ の分布関数 $F$ のすべての連続点 $x$ で $F_{X_{n}}(x)\to F(x)$ となるとき、$X_{n}$ は $X$ に**法則収束**（分布収束）するといい、$X_{n}\Rightarrow X$ と書く。分布 $\mu_{n}\defeq P_{X_{n}}$ についても $\mu_{n}\Rightarrow\mu$ と書く。
:::

::: lemma 分位点関数の収束 {#prb:quantile-convergence keywords="if F_n -> F at continuity points of F then the quantile functions Q_n(u) -> Q(u) at every continuity point u of Q in (0,1)" index="分位点関数の収束|ぶんいてんかんすうのしゅうそく"}
分布関数 $F_{n},F$ について、$F$ のすべての連続点で $F_{n}\to F$ とする。$Q_{n},Q$ を分位点関数（\ref{prb:distribution-function.3}）とすると、$Q$ が連続な点 $u\in(0,1)$ で $Q_{n}(u)\to Q(u)$。
:::

::: proof
\ref{prb:distribution-function} の証明の Step 2 から、$Q(u)\le x\iff u\le F(x)$（$F_{n},Q_{n}$ も同様）。

**下からの評価.** $x<Q(u)$ を $F$ の連続点とすると $F(x)<u$。$F_{n}(x)\to F(x)$ なので、十分大きな $n$ で $F_{n}(x)<u$、すなわち $Q_{n}(u)>x$。$C(F)$ は稠密なので $\liminf Q_{n}(u)\ge Q(u)$。

**上からの評価.** $v\in(u,1)$ とし、$x>Q(v)$ を $F$ の連続点とすると $F(x)\ge v>u$。十分大きな $n$ で $F_{n}(x)>u$、すなわち $Q_{n}(u)\le x$。$x\downarrow Q(v)$ として $\limsup Q_{n}(u)\le Q(v)$。$Q$ は $u$ で連続なので $v\downarrow u$ として $\limsup Q_{n}(u)\le Q(u)$。
:::

::: theorem 法則収束の特徴づけ {#prb:portmanteau keywords="X_n => X iff E f(X_n) -> E f(X) for every bounded continuous f; Skorokhod representation: there are Y_n, Y on ([0,1), Lebesgue) with the same laws and Y_n -> Y a.s.; convergence in probability implies convergence in distribution; convergence in distribution to a constant implies convergence in probability; continuous mapping theorem" index="スコロホッドの表現定理|すころほっどのひょうげんていり, 連続写像定理|れんぞくしゃぞうていり"}
実数値確率変数 $X_{n}$, $X$ について：
1. （スコロホッドの表現）$X_{n}\Rightarrow X$ なら、$([0,1),\mathcal{B},\lambda)$ 上の確率変数 $Y_{n}\overset{d}{=}X_{n}$, $Y\overset{d}{=}X$ で $Y_{n}\to Y$（a.s.）となるものがある。
2. $X_{n}\Rightarrow X$ $\iff$ すべての $f\in C_{b}(\mathbb{R})$ で $E[f(X_{n})]\to E[f(X)]$。
3. （連続写像定理）$X_{n}\Rightarrow X$ で $g\colon\mathbb{R}\to\mathbb{R}$ が連続なら $g(X_{n})\Rightarrow g(X)$。
4. 同じ確率空間上で $X_{n}\to X$（確率収束）なら $X_{n}\Rightarrow X$。$c$ が定数で $X_{n}\Rightarrow c$ なら $X_{n}\to c$（確率収束）。
:::

::: proof
**1.** $Q_{n},Q$ を $F_{X_{n}},F_{X}$ の分位点関数とし、$Y_{n}\defeq Q_{n}$, $Y\defeq Q$（$([0,1),\lambda)$ 上）とおく。\ref{prb:distribution-function.3} から分布は正しい。$Q$ は単調なので不連続点は高々可算で測度 $0$。\ref{prb:quantile-convergence} から、それ以外の $u\in(0,1)$ で $Y_{n}(u)\to Y(u)$。

**2.** （⇒）1 の $Y_{n},Y$ について $f(Y_{n})\to f(Y)$（a.s.）で、$\sup|f|$ で抑えられるので優収束定理から $E[f(Y_{n})]\to E[f(Y)]$。分布が等しいので（\ref{prb:change-of-variables}）$E[f(X_{n})]\to E[f(X)]$。

（⇐）$x\in C(F)$、$k\ge1$ とし、$f_{k}$ を $(-\infty,x]$ で $1$、$[x+\frac1k,\infty)$ で $0$、間は 1 次関数の連続関数、$g_{k}$ を $(-\infty,x-\frac1k]$ で $1$、$[x,\infty)$ で $0$、間は 1 次関数とする。$g_{k}\le\mathbf{1}_{(-\infty,x]}\le f_{k}$ なので
$$
F(x-\tfrac1k)\le E[g_{k}(X)]=\lim E[g_{k}(X_{n})]\le\liminf F_{X_{n}}(x)\le\limsup F_{X_{n}}(x)\le\lim E[f_{k}(X_{n})]=E[f_{k}(X)]\le F(x+\tfrac1k).
$$
$k\to\infty$ で両端は $F(x-)=F(x)$ と $F(x)$（右連続性）に収束する。

**3.** $f\in C_{b}$ なら $f\circ g\in C_{b}$ なので、2 から。

**4.** 前半：$f\in C_{b}$ とし、\ref{prb:convergence-relations.3} から、任意の部分列はさらに a.s. 収束する部分列をもつ。その部分列で優収束定理から $E[f(X_{n})]\to E[f(X)]$。実数列 $E[f(X_{n})]$ の任意の部分列が $E[f(X)]$ に収束する部分列をもつので、列全体が収束する。2 から $X_{n}\Rightarrow X$。後半：$F=\mathbf{1}_{[c,\infty)}$ で、$c\pm\varepsilon$ は連続点。$P(|X_{n}-c|>\varepsilon)\le F_{X_{n}}(c-\varepsilon)+1-F_{X_{n}}(c+\varepsilon)\to0+1-1=0$。
:::

## 緊密性とヘリーの選出定理 {#prb:sec-cv-helly}

::: theorem ヘリーの選出定理 {#prb:helly-selection keywords="Helly selection theorem: every sequence of distribution functions has a subsequence converging at continuity points to a right-continuous increasing G with values in [0,1]; if the sequence is tight, G is a distribution function (Prokhorov on R); subsequence criterion for convergence in distribution" index="ヘリーの選出定理|へりーのせんしゅつていり, 緊密性|きんみつせい, プロホロフの定理|ぷろほろふのていり"}
$F_{1},F_{2},\dots$ を分布関数とする。
1. 部分列 $F_{n_{k}}$ と、単調増加・右連続な $G\colon\mathbb{R}\to[0,1]$ があって、$G$ のすべての連続点で $F_{n_{k}}\to G$。
2. 列が**緊密**、すなわち $\lim_{M\to\infty}\sup_{n}\bigl(F_{n}(-M)+1-F_{n}(M)\bigr)=0$ なら、1 の $G$ は分布関数（$G(-\infty)=0$, $G(+\infty)=1$）。
3. 列が緊密で、法則収束する部分列の極限の分布がすべて同じ $\mu$ なら、列全体が $\mu$ に法則収束する。
:::

::: proof
**1.** **Step 1（対角線論法）.** 有理数を $q_{1},q_{2},\dots$ と並べる。$[0,1]$ の数列 $(F_{n}(q_{1}))_{n}$ から収束する部分列をとり（ボルツァーノ–ワイエルシュトラス。上極限に収束する部分列を、条件を満たす最小の番号で選ぶ）、その部分列から $(F_{n}(q_{2}))$ が収束する部分列をとり、と続けて、$k$ 番目の部分列の $k$ 番目の項をとる（対角線）。この部分列 $F_{n_{k}}$ はすべての $q_{j}$ で収束する。$H(q)\defeq\lim_{k}F_{n_{k}}(q)$ は $\mathbb{Q}$ 上単調増加。

**Step 2（$G$ の定義）.** $G(x)\defeq\inf\{H(r):r\in\mathbb{Q},r>x\}$。$G$ は単調増加。右連続：$x_{m}\downarrow x$ のとき、$r>x$ を任意にとると十分大きな $m$ で $r>x_{m}$ なので $G(x_{m})\le H(r)$、よって $\lim G(x_{m})\le G(x)$、逆は単調性。

**Step 3（連続点での収束）.** $x$ を $G$ の連続点、$q<x<r$ を有理数とすると
$$
H(q)\le\liminf_{k}F_{n_{k}}(x)\le\limsup_{k}F_{n_{k}}(x)\le H(r).
$$
$r\downarrow x$ で $H(r)\to G(x)$（$G$ の定義と $H$ の単調性）。$y<q$ なら $G(y)\le H(q)$ なので、$q\uparrow x$ のとき $\liminf_{q}H(q)\ge\sup_{y<x}G(y)=G(x-)=G(x)$。よって $F_{n_{k}}(x)\to G(x)$。

**2.** $\varepsilon>0$ について $\sup_{n}(F_{n}(-M)+1-F_{n}(M))<\varepsilon$ となる $M$ をとる。$M$ を大きくして $\pm M$ を $G$ の連続点にできる（連続点は稠密）。$G(M)=\lim F_{n_{k}}(M)\ge1-\varepsilon$, $G(-M)\le\varepsilon$。$\varepsilon$ は任意。

**3.** $\mu$ の分布関数を $F$ とする。$x\in C(F)$ で $F_{n}(x)\not\to F(x)$ とすると、$|F_{n_{k}}(x)-F(x)|\ge\eta>0$ となる部分列がある。1・2 からさらに部分列が分布関数 $G$ に法則収束し、仮定から $G=F$。すると $x\in C(F)$ で $F_{n_{k_{j}}}(x)\to F(x)$ となり矛盾。
:::

::: hypcheck
- ヴィタリの定理では確率空間（有限測度）であることを、一様可積分性から $L^{1}$ 有界性を出すところ（\ref{prb:ui-criteria.1}）と、定数関数が可積分であるところで使った。
- \ref{prb:portmanteau.1} のスコロホッドの表現は、$\mathbb{R}$ では分位点関数で直接書けた。一般の可分距離空間でも成り立つが、証明はずっと難しい。
- ヘリーの選出定理の 1 で $G$ が分布関数にならない例：$F_{n}=\mathbf{1}_{[n,\infty)}$（$\delta_{n}$ の分布関数）では $G\equiv0$。質量が無限遠に逃げる。緊密性はこれを禁じる条件である。
- 法則収束は同じ確率空間を必要としないが、確率収束は必要とする。$X_{n}\Rightarrow X$ でも $X_{n}-X\Rightarrow0$ とは限らない（$X\sim N(0,1)$, $X_{n}\defeq-X$ は $X_{n}\Rightarrow X$ だが $X_{n}-X=-2X$）。
:::

::: supplement
**関連する結果.**
- ポートマントー定理：$\mu_{n}\Rightarrow\mu$ は、すべての閉集合 $C$ で $\limsup\mu_{n}(C)\le\mu(C)$、すべての開集合 $U$ で $\liminf\mu_{n}(U)\ge\mu(U)$、$\mu(\partial A)=0$ となるすべての $A$ で $\mu_{n}(A)\to\mu(A)$ のそれぞれと同値。一般の距離空間で成り立つ。
- 確率収束は距離 $d(X,Y)\defeq E[\min(|X-Y|,1)]$ による収束で、この距離で確率変数の空間（a.s. で等しいものを同一視）は完備。
- スルツキーの定理：$X_{n}\Rightarrow X$, $Y_{n}\to c$（確率収束、定数）なら $X_{n}+Y_{n}\Rightarrow X+c$, $X_{n}Y_{n}\Rightarrow cX$。演習で扱う。

**高い視点：弱* 収束.** 法則収束は、確率測度を $C_{b}(\mathbb{R})$（あるいは $C_{0}(\mathbb{R})$）上の線形汎関数 $f\mapsto\int f\,d\mu$ とみたときの弱* 収束である。ヘリーの選出定理は、$C_{0}(\mathbb{R})^{*}$ の単位球が弱* 位相で（点列）コンパクトであること（バナッハ–アラオグルの定理の可分版）の具体的な形で、極限が「質量が欠けた」測度（$G(+\infty)-G(-\infty)<1$）になりうるのは、$C_{0}$ の関数が無限遠の質量を見ないからである。緊密性は、質量が無限遠に逃げないという条件で、これがあると $C_{0}$ での極限と $C_{b}$ での極限が一致する。比喩で言えば、法則収束は「同じ写真の撮り直し」ではなく「ぼかした写真が似てくる」ことで、緊密性は「写真の枠から被写体がはみ出さない」ことである。
:::

## 問題 {#prb:sec-cv-problems}

::: problem {#prb:prob-cv-max-exponential}
$X_{1},X_{2},\dots$ を i.i.d. で $\mathrm{Exp}(1)$ に従うとし、$M_{n}\defeq\max_{k\le n}X_{k}$ とする。$M_{n}-\log n$ は、分布関数 $G(x)=\exp(-e^{-x})$（グンベル分布）の分布に法則収束することを示せ。
:::

::: solution
独立性から $P(M_{n}-\log n\le x)=P(X_{1}\le x+\log n)^{n}=(1-e^{-x}/n)^{n}$（$x+\log n\ge0$、すなわち $n\ge e^{-x}$ のとき）。$n\to\infty$ で $(1-\frac{a}{n})^{n}\to e^{-a}$（$a=e^{-x}$）なので $\exp(-e^{-x})$ に収束する。$G$ は連続で単調増加、$G(-\infty)=0$, $G(+\infty)=1$ の分布関数。
:::

::: problem {#prb:prob-cv-ui-counter}
$([0,1),\lambda)$ 上で $X_{n}\defeq\frac{n}{\log n}\mathbf{1}_{[0,1/n)}$（$n\ge2$）とする。$\{X_{n}\}$ は一様可積分であるが、どの $p>1$ についても $L^{p}$ で有界でないことを示せ。
:::

::: solution
$M\ge3$ とする。$\frac{n}{\log n}>M$ となる $n$ では $E[X_{n};X_{n}>M]=E[X_{n}]=\frac{1}{\log n}$、それ以外では $0$。$n=2$ では $\frac{2}{\log2}<3\le M$ なので、$\frac{n}{\log n}>M$ となるのは $n\ge3$ に限り、そのとき $\log n>1$ から $n>\frac{n}{\log n}>M$、よって $\frac{1}{\log n}<\frac{1}{\log M}$。よって $\sup_{n}E[X_{n};X_{n}>M]\le\frac{1}{\log M}\to0$。一方 $E[X_{n}^{p}]=\frac{n^{p-1}}{(\log n)^{p}}\to\infty$（$p>1$）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{prb:sec-cv-exercises} にまとめた。
