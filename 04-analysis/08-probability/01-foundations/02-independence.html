# 独立性 {#prb:page-independence keywords="independence of events, sigma-algebras and random variables, pi-system criterion, grouping lemma, independence via joint distribution functions and product measures, E[XY] = E X E Y, variance of sums, construction of independent sequences with given laws from binary digits on [0,1), Borel-Cantelli lemmas, tail sigma-algebra, Kolmogorov 0-1 law"}

確率論を測度論から区別する最も基本的な概念が**独立性**である。このページでは、事象・σ-加法族・確率変数の独立性を定義し、それを π 系で判定できること、同時分布が積測度になることと同値であることを示す。次に、任意に与えた分布をもつ独立な確率変数の無限列が、区間 $[0,1)$ 上のルベーグ測度という一つの確率空間の上に実際に作れることを、2 進展開の桁を使って示す。最後に、無限個の事象のうち「無限に多く起こる」ものの確率を判定する**ボレル–カンテリの補題**と、独立な列の遠い未来だけで決まる事象の確率は $0$ か $1$ であるという**コルモゴロフの 0-1 法則**を示す。

## 記法と定義の確認 {#prb:sec-in-notation}

::: notation
- 確率空間 $(\Omega,\mathcal{F},P)$、確率変数、分布、分布関数、期待値は \ref{prb:page-random-variables} のとおり。
- π 系・λ 系と π-λ 定理は \ref{meas:pi-lambda-systems}, \ref{meas:pi-lambda}、測度の一意性は \ref{meas:measure-uniqueness}、積測度と積分の順序交換は \ref{meas:product-measure}, \ref{meas:fubini}。
- σ-加法族の族 $\{\mathcal{G}_{i}\}$ について $\bigvee_{i}\mathcal{G}_{i}\defeq\sigma\bigl(\bigcup_{i}\mathcal{G}_{i}\bigr)$。確率変数の族について $\sigma(X_{i}:i\in J)\defeq\bigvee_{i\in J}\sigma(X_{i})$。
- 事象の列 $(A_{n})$ について $\limsup_{n}A_{n}\defeq\bigcap_{m}\bigcup_{n\ge m}A_{n}$（無限に多くの $n$ で $A_{n}$ が起こる）、$\{A_{n}\text{ i.o.}\}$ とも書く。
- **選択公理**：使わない。
:::

## 独立性の定義と判定 {#prb:sec-in-definition}

::: definition 独立性 {#prb:independence keywords="independence of a family of sigma-algebras: P(intersection of A_i, i in J) = product of P(A_i) for every finite J and A_i in G_i; independent events; independent random variables" index="独立性|どくりつせい, 独立な確率変数|どくりつなかくりつへんすう"}
1. $\mathcal{F}$ の部分族 $\mathcal{C}_{i}$（$i\in I$）が**独立**であるとは、$I$ の任意の有限部分集合 $J$ と $A_{i}\in\mathcal{C}_{i}$（$i\in J$）について $P\bigl(\bigcap_{i\in J}A_{i}\bigr)=\prod_{i\in J}P(A_{i})$ となることをいう。
2. 事象 $A_{i}$（$i\in I$）が独立とは、$\{\emptyset,A_{i},A_{i}^{c},\Omega\}$（$i\in I$）が独立なことをいう。
3. 確率変数 $X_{i}$（$i\in I$、値域は各々の可測空間）が独立とは、$\sigma(X_{i})$（$i\in I$）が独立なことをいう。
:::

::: theorem π 系による判定 {#prb:pi-system-independence keywords="if pi-systems P_i are independent then the generated sigma-algebras sigma(P_i) are independent; grouping lemma for disjoint blocks" index="独立性の判定|どくりつせいのはんてい, 独立性のまとめ|どくりつせいのまとめ"}
1. $\mathcal{P}_{i}$（$i\in I$）が独立な π 系なら、$\sigma(\mathcal{P}_{i})$（$i\in I$）も独立。
2. （まとめ）$\mathcal{G}_{i}$（$i\in I$）が独立な σ-加法族で、$I=\bigsqcup_{k\in K}I_{k}$ が互いに素な分割なら、$\mathcal{H}_{k}\defeq\bigvee_{i\in I_{k}}\mathcal{G}_{i}$（$k\in K$）も独立。
:::

::: proof
**1.** 独立性は有限部分集合ごとの条件なので、$I=\{1,\dots,n\}$ としてよい。また $\mathcal{P}_{i}$ に $\Omega$ を加えても π 系で独立なままなので（$\Omega$ の確率は $1$）、$\Omega\in\mathcal{P}_{i}$ とする。このとき「$J\subset I$ と $A_{i}\in\mathcal{P}_{i}$ について積の式」は、「$A_{i}\in\mathcal{P}_{i}$（すべての $i$）について $P(A_{1}\cap\dots\cap A_{n})=\prod P(A_{i})$」と同値（$J$ の外では $A_{i}=\Omega$ とすればよい）。

$A_{2}\in\mathcal{P}_{2},\dots,A_{n}\in\mathcal{P}_{n}$ を固定し、
$$
\mathcal{D}\defeq\Bigl\{A\in\mathcal{F}:P(A\cap A_{2}\cap\dots\cap A_{n})=P(A)\prod_{i\ge2}P(A_{i})\Bigr\}
$$
とおく。$\mathcal{D}$ は λ 系：$\Omega\in\mathcal{D}$（$\Omega\in\mathcal{P}_{1}$ の場合の仮定）。$A\subset B$ がともに $\mathcal{D}$ に入れば、$B\setminus A$ について両辺の差をとって成り立つ。$A_{k}\uparrow A$ なら両辺は単調収束（測度の連続性）。仮定から $\mathcal{P}_{1}\subset\mathcal{D}$ なので、π-λ 定理（\ref{meas:pi-lambda}）から $\sigma(\mathcal{P}_{1})\subset\mathcal{D}$。すなわち $\sigma(\mathcal{P}_{1}),\mathcal{P}_{2},\dots,\mathcal{P}_{n}$ は独立。$\sigma(\mathcal{P}_{1})$ も $\Omega$ を含む π 系なので、同じ議論を $i=2,\dots,n$ について順に繰り返せばよい。

**2.** $\mathcal{Q}_{k}$ を、有限個の $i\in I_{k}$ について $A_{i}\in\mathcal{G}_{i}$ の共通部分 $\bigcap_{i\in J}A_{i}$（$J\subset I_{k}$ 有限）全体とする。$\mathcal{Q}_{k}$ は π 系で $\sigma(\mathcal{Q}_{k})=\mathcal{H}_{k}$（$\mathcal{G}_{i}\subset\mathcal{Q}_{k}\subset\mathcal{H}_{k}$）。異なる $k$ の $\mathcal{Q}_{k}$ の元の共通部分は、互いに素な添字集合の上の $A_{i}$ の共通部分なので、$\mathcal{G}_{i}$ の独立性から積に分かれる。よって $\mathcal{Q}_{k}$ は独立で、1 から $\mathcal{H}_{k}$ も独立。
:::

::: corollary 実数値確率変数の独立性 {#prb:independence-criteria keywords="real random variables X_1..X_n are independent iff the joint distribution function factorizes iff the joint law is the product of the marginals; functions of disjoint groups of independent variables are independent; E[XY] = E X E Y; Var of a sum of independent variables" index="同時分布|どうじぶんぷ, 独立な確率変数の積の期待値|どくりつなかくりつへんすうのせきのきたいち"}
$X_{1},\dots,X_{n}$ を実数値確率変数とし、$X\defeq(X_{1},\dots,X_{n})$ とする。
1. 次は同値：(a) $X_{1},\dots,X_{n}$ は独立。(b) すべての $x_{i}\in\mathbb{R}$ で $P(X_{1}\le x_{1},\dots,X_{n}\le x_{n})=\prod_{i}F_{X_{i}}(x_{i})$。(c) $P_{X}=P_{X_{1}}\otimes\cdots\otimes P_{X_{n}}$（$\mathbb{R}^{n}$ 上）。
2. 独立な確率変数の互いに素な組の可測関数は独立：例えば $X_{1},\dots,X_{4}$ が独立なら $g(X_{1},X_{2})$ と $h(X_{3},X_{4})$ は独立。
3. $X,Y$ が独立で可積分なら $XY$ も可積分で $E[XY]=E[X]E[Y]$。とくに $X_{1},\dots,X_{n}\in L^{2}$ が独立なら $\operatorname{Var}(\sum X_{i})=\sum\operatorname{Var}(X_{i})$。
:::

::: proof
**1.** (a) ⇒ (b) は定義。(b) ⇒ (a)：$\mathcal{P}_{i}\defeq\{\{X_{i}\le x\}:x\in\mathbb{R}\}\cup\{\Omega\}$ は π 系で $\sigma(\mathcal{P}_{i})=\sigma(X_{i})$（\ref{prb:distribution-function} の証明の 2 と同じく、$(-\infty,x]$ はボレル集合族を生成する）。(b) は $\mathcal{P}_{i}$ の独立性（$\Omega$ は $x_{i}\to\infty$ の極限で扱える）なので、\ref{prb:pi-system-independence.1} から (a)。(a) ⇔ (c)：(c) の両辺は直方体 $B_{1}\times\dots\times B_{n}$ 上で $P(X_{1}\in B_{1},\dots)$ と $\prod P(X_{i}\in B_{i})$ で、直方体の全体は $\mathcal{B}(\mathbb{R}^{n})$ を生成する π 系。(a) なら両者は直方体上で一致し、\ref{meas:measure-uniqueness} から (c)。(c) なら直方体上の一致が (a) そのもの。

**2.** \ref{prb:pi-system-independence.2} から $\sigma(X_{1},X_{2})$ と $\sigma(X_{3},X_{4})$ は独立で、$g(X_{1},X_{2})$ は前者に、$h(X_{3},X_{4})$ は後者に関して可測。

**3.** 1 の (c) と \ref{prb:change-of-variables}（$(X,Y)$ に値をとる確率変数として）から、$E[|XY|]=\int|xy|\,d(P_{X}\otimes P_{Y})=\int|x|\,dP_{X}\int|y|\,dP_{Y}<\infty$（トネリ）。同じ計算を \ref{meas:fubini} から $xy$ に行えば $E[XY]=E[X]E[Y]$。分散：$Y_{i}\defeq X_{i}-E[X_{i}]$ も独立で（2）、$E[Y_{i}Y_{j}]=E[Y_{i}]E[Y_{j}]=0$（$i\ne j$）なので、$E[(\sum Y_{i})^{2}]=\sum E[Y_{i}^{2}]$。
:::

## 独立な確率変数列の構成 {#prb:sec-in-construction}

::: theorem 独立な列の存在 {#prb:independent-sequence-existence keywords="on ([0,1), Borel, Lebesgue) the binary digits are i.i.d. Bernoulli(1/2); splitting the digits gives independent uniform variables U_1, U_2, ...; composing with quantile functions gives independent random variables with any prescribed distribution functions" index="独立な確率変数列の存在|どくりつなかくりつへんすうれつのそんざい, 2 進展開と独立性|2しんてんかいとどくりつせい"}
$(\Omega,\mathcal{F},P)\defeq([0,1),\mathcal{B},\lambda)$ とする。
1. $d_{k}(u)\defeq\lfloor2^{k}u\rfloor-2\lfloor2^{k-1}u\rfloor\in\{0,1\}$（$u$ の 2 進展開の第 $k$ 桁、無限に 1 が続かない方の展開）とすると、$d_{1},d_{2},\dots$ は独立で、$P(d_{k}=0)=P(d_{k}=1)=\frac12$。
2. 互いに素な無限部分集合 $N_{j}=\{n_{j,1}<n_{j,2}<\cdots\}\subset\mathbb{Z}_{\ge1}$（$j\ge1$）をとり（例えば $N_{j}\defeq\{2^{j-1}(2m-1):m\ge1\}$）、$U_{j}\defeq\sum_{m\ge1}d_{n_{j,m}}2^{-m}$ とおくと、$U_{1},U_{2},\dots$ は独立で、各 $U_{j}$ は一様分布 $U(0,1)$ に従う。
3. 分布関数 $F_{1},F_{2},\dots$（\ref{prb:distribution-function.1} の性質をもつ関数）が任意に与えられたとき、$Q_{j}$ を $F_{j}$ の分位点関数（\ref{prb:distribution-function.3} の $X$）として $X_{j}\defeq Q_{j}(U_{j})$ とおけば、$X_{1},X_{2},\dots$ は独立で $F_{X_{j}}=F_{j}$。
:::

::: proof
**1.** $e_{1},\dots,e_{n}\in\{0,1\}$ について $\{d_{1}=e_{1},\dots,d_{n}=e_{n}\}$ は 2 進区間 $[a,a+2^{-n})$（$a=\sum_{i\le n}e_{i}2^{-i}$）なので確率 $2^{-n}$。とくに（$e_{n}$ 以外を足し合わせて）$P(d_{n}=e_{n})=\frac12$ で、$P(d_{1}=e_{1},\dots,d_{n}=e_{n})=\prod_{i}P(d_{i}=e_{i})$。部分集合 $\{d_{i}=e_{i}\ (i\in J)\}$ も、$J$ の外の桁について和をとれば $2^{-|J|}$。$\sigma(d_{i})=\{\emptyset,\{d_{i}=0\},\{d_{i}=1\},\Omega\}$ なので、これは独立性そのもの。

**2.** **独立性.** $U_{j}$ は $\sigma(d_{n}:n\in N_{j})$ 可測（可測関数の級数の極限）で、\ref{prb:pi-system-independence.2} からこれらの σ-加法族は独立。

**分布.** $b_{m}\defeq d_{n_{j,m}}$ とおくと、1 と同じく $b_{1},b_{2},\dots$ は独立で各々確率 $\frac12$ で $0$ または $1$。$k\ge1$ と $0\le\ell<2^{k}$ について、$\ell2^{-k}=\sum_{m\le k}c_{m}2^{-m}$（$c_{m}\in\{0,1\}$）と書くと
$$
\{b_{1}=c_{1},\dots,b_{k}=c_{k}\}\subset\{U_{j}\in[\ell2^{-k},(\ell+1)2^{-k}]\}\subset\{b_{1}=c_{1},\dots,b_{k}=c_{k}\}\cup Z
$$
で、$Z$ は「ある番号から先の $b_{m}$ がすべて $1$、またはすべて $0$」という事象。$Z$ の確率は $0$：ある $M$ から先がすべて $1$ である確率は、$m=M,\dots,M+r$ がすべて $1$ である確率 $2^{-r-1}$ 以下で、$r\to\infty$ として $0$。$M$ について可算和をとっても $0$。よって $P(U_{j}\in[\ell2^{-k},(\ell+1)2^{-k}])=2^{-k}$。これを足し合わせると、2 進有理数 $x=\ell2^{-k}$ で $P(U_{j}\le x)=x$（端点の確率は $0$、上の包含で $Z$ 以外は区間の内部）。分布関数は右連続で 2 進有理数は稠密なので、すべての $x\in[0,1]$ で $P(U_{j}\le x)=x$、すなわち $U_{j}\sim U(0,1)$。

**3.** $U_{j}$ は $[0,1]$ に値をとり、$P(U_{j}\in\{0,1\})=0$ なので、$U_{j}=1$ となる点では $X_{j}\defeq0$ と定め、$Q_{j}(0)$ の値も分布に影響しない。$U\sim U(0,1)$ なら $Q_{j}(U)$ は $([0,1),\lambda)$ 上の $Q_{j}$ と同分布で、\ref{prb:distribution-function.3} から分布関数は $F_{j}$。独立性は \ref{prb:independence-criteria.2}（無限個の場合も、有限個ずつ確かめればよい）。
:::

## ボレル–カンテリの補題と 0-1 法則 {#prb:sec-in-borel-cantelli}

::: theorem ボレル–カンテリの補題 {#prb:borel-cantelli keywords="first Borel-Cantelli: sum P(A_n) < infinity implies P(A_n i.o.) = 0; second Borel-Cantelli: for independent events with sum P(A_n) = infinity, P(A_n i.o.) = 1" index="ボレル–カンテリの補題|ぼれるかんてりのほだい"}
$(A_{n})$ を事象の列とする。
1. $\sum_{n}P(A_{n})<\infty$ なら $P(\limsup A_{n})=0$。
2. $A_{n}$ が独立で $\sum_{n}P(A_{n})=\infty$ なら $P(\limsup A_{n})=1$。
:::

::: proof
**1.** すべての $m$ で $P(\limsup A_{n})\le P(\bigcup_{n\ge m}A_{n})\le\sum_{n\ge m}P(A_{n})$ で、右辺は収束する級数の裾なので $m\to\infty$ で $0$。

**2.** $(\limsup A_{n})^{c}=\bigcup_{m}\bigcap_{n\ge m}A_{n}^{c}$ なので、各 $m$ で $P(\bigcap_{n\ge m}A_{n}^{c})=0$ を示せばよい。$A_{n}^{c}$ も独立（$\{\emptyset,A_{n},A_{n}^{c},\Omega\}$ の独立性の定義から）で、$1-x\le e^{-x}$ から、$N\ge m$ について
$$
P\Bigl(\bigcap_{n=m}^{N}A_{n}^{c}\Bigr)=\prod_{n=m}^{N}(1-P(A_{n}))\le\exp\Bigl(-\sum_{n=m}^{N}P(A_{n})\Bigr)\to0\qquad(N\to\infty).
$$
左辺は $N$ について減少して $P(\bigcap_{n\ge m}A_{n}^{c})$ に収束する。
:::

::: theorem コルモゴロフの 0-1 法則 {#prb:kolmogorov-zero-one keywords="Kolmogorov 0-1 law: for independent sigma-algebras G_n, every event in the tail sigma-algebra intersection_n sigma(G_n, G_{n+1}, ...) has probability 0 or 1; tail random variables are a.s. constant" index="コルモゴロフの 0-1 法則|こるもごろふの01ほうそく, 末尾 σ-加法族|まつびしぐまかほうぞく"}
$\mathcal{G}_{1},\mathcal{G}_{2},\dots$ を独立な σ-加法族とし、**末尾 σ-加法族**を $\mathcal{T}\defeq\bigcap_{n}\bigvee_{k\ge n}\mathcal{G}_{k}$ とする。
1. $A\in\mathcal{T}$ なら $P(A)\in\{0,1\}$。
2. $\mathcal{T}$ 可測な $\overline{\mathbb{R}}$ 値確率変数は a.s. 定数。
:::

::: proof
**1.** **Step 1.** $n$ を固定する。\ref{prb:pi-system-independence.2} から $\mathcal{G}_{1}\vee\dots\vee\mathcal{G}_{n}$ と $\bigvee_{k>n}\mathcal{G}_{k}$ は独立で、$\mathcal{T}\subset\bigvee_{k>n}\mathcal{G}_{k}$ なので、$\mathcal{T}$ は $\mathcal{G}_{1}\vee\dots\vee\mathcal{G}_{n}$ と独立。

**Step 2.** $\mathcal{P}\defeq\bigcup_{n}(\mathcal{G}_{1}\vee\dots\vee\mathcal{G}_{n})$ は増大列の和なので π 系で、Step 1 から $\mathcal{T}$ と独立。\ref{prb:pi-system-independence.1} から $\sigma(\mathcal{P})=\bigvee_{k}\mathcal{G}_{k}$ も $\mathcal{T}$ と独立。$\mathcal{T}\subset\bigvee_{k}\mathcal{G}_{k}$ なので、$A\in\mathcal{T}$ は自分自身と独立：$P(A)=P(A\cap A)=P(A)^{2}$、よって $P(A)\in\{0,1\}$。

**2.** $Y$ を $\mathcal{T}$ 可測とすると、$x\mapsto P(Y\le x)$ は $\{0,1\}$ に値をとる単調増加関数。$c\defeq\inf\{x\in\mathbb{R}:P(Y\le x)=1\}\in\overline{\mathbb{R}}$（空なら $c=+\infty$）とおけば、$x<c$ で $P(Y\le x)=0$、$x>c$ で $P(Y\le x)=1$ なので、有理数の列で極限をとって $P(Y=c)=1$。
:::

::: example 末尾事象 {#prb:tail-examples keywords="for independent X_n: convergence of sum X_n, limsup S_n / n, limsup X_n are tail events or tail variables" index="末尾事象|まつびじしょう"}
$X_{1},X_{2},\dots$ を独立な実数値確率変数、$S_{n}\defeq X_{1}+\dots+X_{n}$ とする。次はどれも確率 $0$ か $1$、あるいは a.s. 定数である：級数 $\sum X_{n}$ が収束する事象、$\limsup_{n}\frac{S_{n}}{n}$、$\limsup_{n}X_{n}$。
:::

::: proof
$\mathcal{G}_{k}\defeq\sigma(X_{k})$ とする。級数の収束は、どの $n$ についても $\sum_{k\ge n}X_{k}$ の収束と同値で、後者は $\bigvee_{k\ge n}\mathcal{G}_{k}$ に属する（部分和のコーシー条件を有理数の $\varepsilon$ で書けば可算個の操作）。$\limsup\frac{S_{n}}{n}=\limsup\frac{X_{m}+\dots+X_{n}}{n}$（$\frac{S_{m-1}}{n}\to0$）は各 $m$ で $\bigvee_{k\ge m}\mathcal{G}_{k}$ 可測。$\limsup X_{n}$ も同様。
:::

::: hypcheck
- \ref{prb:pi-system-independence.1} で π 系に $\Omega$ を含めたのは、「一部の添字だけの共通部分」の条件を「全部の添字の共通部分」の条件にまとめるためである。π 系であること（共通部分で閉じる）は π-λ 定理に本質的。λ 系の条件だけの族（例えば $\{A:P(A\cap B)=P(A)P(B)\}$）では生成された σ-加法族まで延びない。
- ボレル–カンテリの補題の 2 で独立性は本質的：$A_{n}\defeq A$（すべて同じ事象、$0<P(A)<1$）なら $\sum P(A_{n})=\infty$ だが $P(\limsup A_{n})=P(A)<1$。ペアごとの独立性でも 2 は成り立つ（チェビシェフの不等式による証明がある）が、ここでは示していない。
- 独立な列の構成（\ref{prb:independent-sequence-existence}）では、コルモゴロフの拡張定理も無限積測度も使っていない。使ったのは $[0,1)$ 上のルベーグ測度だけである。
:::

::: supplement
**関連する結果.**
- ヒューイット–サベージの 0-1 法則：i.i.d. 列の有限個の置換で不変な事象の確率は $0$ か $1$。これは末尾事象より広い（例えば $\{S_{n}\in B\text{ i.o.}\}$）。このサイトではまだ証明していない。
- 一般の確率空間の族 $(\Omega_{i},\mathcal{F}_{i},P_{i})$（$i\in I$、非可算でもよい）の無限積確率測度が存在する。これは \ref{prb:independent-sequence-existence} の一般化で、コルモゴロフの拡張定理（このシリーズの後半で扱う予定）の特別な場合である。

**高い視点：積としての独立性.** 確率変数 $X_{1},\dots,X_{n}$ が独立であることは、同時分布 $P_{(X_{1},\dots,X_{n})}$ が周辺分布の積測度 $\bigotimes P_{X_{i}}$ であること、すなわち確率測度の圏で「直積の対象」に一致することである。$[0,1)$ の 2 進展開による構成は、測度空間として $([0,1),\lambda)\cong(\{0,1\},\frac12\delta_{0}+\frac12\delta_{1})^{\mathbb{N}}$（零集合を除いて）であることを使っており、さらに $\mathbb{N}\cong\mathbb{N}\times\mathbb{N}$ によって $([0,1),\lambda)\cong([0,1),\lambda)^{\mathbb{N}}$ となる。比喩で言えば、一つの「完全に偶然な実数」の中には、無限個の独立な偶然が詰まっている。0-1 法則は、無限個の独立な偶然を集めると、遠い未来についての問いには偶然の余地がなくなる、という現象である。
:::

## 問題 {#prb:sec-in-problems}

::: problem {#prb:prob-in-pairwise}
独立なコイン投げ $X,Y$（$P(X=\pm1)=P(Y=\pm1)=\frac12$）と $Z\defeq XY$ について、$X,Y,Z$ はどの二つも独立だが、三つは独立でないことを示せ。
:::

::: solution
$P(Z=1)=P(X=Y)=P(X=Y=1)+P(X=Y=-1)=\frac14+\frac14=\frac12$。$a,c\in\{\pm1\}$ について $P(X=a,Z=c)=P(X=a,Y=ac)=\frac14=P(X=a)P(Z=c)$ なので $X,Z$ は独立（$\sigma(X)$, $\sigma(Z)$ の元はこれらの事象の和なので、積の式は和をとって成り立つ）。$Y,Z$ も同様。しかし $P(X=1,Y=1,Z=-1)=0\ne\frac18=P(X=1)P(Y=1)P(Z=-1)$。
:::

::: problem {#prb:prob-in-exponential-limsup}
$X_{1},X_{2},\dots$ を独立で各々 $\mathrm{Exp}(1)$ に従う確率変数とする。$\limsup_{n}\frac{X_{n}}{\log n}=1$（a.s.）を示せ。
:::

::: solution
$\varepsilon>0$ について $P(X_{n}>(1+\varepsilon)\log n)=n^{-1-\varepsilon}$ で和は有限なので、\ref{prb:borel-cantelli.1} から a.s. で有限個の $n$ を除いて $\frac{X_{n}}{\log n}\le1+\varepsilon$。よって $\limsup\le1+\varepsilon$。一方 $P(X_{n}>\log n)=\frac1n$ で和は発散し、事象 $\{X_{n}>\log n\}$ は独立（$\sigma(X_{n})$ の元）なので、\ref{prb:borel-cantelli.2} から a.s. で無限に多くの $n$ で $\frac{X_{n}}{\log n}>1$。よって $\limsup\ge1$。$\varepsilon=\frac1k$（$k\ge1$）について可算個の確率 $1$ の事象の共通部分をとればよい。
:::
