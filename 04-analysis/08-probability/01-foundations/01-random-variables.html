# 確率空間と確率変数 {#prb:page-random-variables keywords="probability space, events, almost surely, random variable, sigma-algebra generated by a random variable, distribution (law) as image measure, distribution function and its characterization, quantile construction, discrete and absolutely continuous distributions, Bernoulli binomial Poisson uniform exponential normal, expectation and the change of variables formula E g(X) = int g dP_X, moments and variance, tail formula E X = int P(X > t) dt, Markov Chebyshev Jensen inequalities"}

確率論は、測度論の言葉では「全体の測度が $1$ の測度空間」の上の理論である。ただし関心の中心は、空間そのものではなく、その上の可測関数（**確率変数**）が値をどう分布させるか（**分布**）にある。このページでは、確率空間・確率変数・分布を定義し、実数値の確率変数の分布が**分布関数** $F(x)=P(X\le x)$ で決まり、逆に単調増加・右連続で $0$ から $1$ へ動く関数はすべてある確率変数の分布関数になることを示す。続いて期待値を積分として定義し、それが分布だけで計算できること（変数変換の公式）を示し、基本的な不等式（マルコフ・チェビシェフ・イェンセン）を導く。

## 記法と定義の確認 {#prb:sec-rv-notation}

::: notation
- 測度空間・可測写像・可測関数・積分・$L^{p}$ は測度論の系列（\ref{meas:measurable-map}, \ref{meas:nonnegative-integral}, \ref{meas:integral-linearity}, \ref{meas:lp-space}）のとおり。$\mathcal{B}(\mathbb{R}^{d})$ は $\mathbb{R}^{d}$ のボレル集合族。
- 測度の一意性（π 系上で一致する有限測度は一致する）は \ref{meas:measure-uniqueness}、ルベーグ–スティルチェス測度は \ref{meas:lebesgue-stieltjes}、単関数近似は \ref{meas:simple-approximation}、単調収束定理は \ref{meas:monotone-convergence}、トネリの定理は \ref{meas:tonelli}。
- 凸関数とその片側微分係数は \ref{calc:convex}, \ref{calc:convex-properties}。
- $\mathbf{1}_{A}$ は集合 $A$ の指示関数。$\{X\in B\}\defeq X^{-1}(B)$, $\{X\le x\}\defeq X^{-1}((-\infty,x])$ などと書く。
- **選択公理**：使わない。
:::

## 確率空間と確率変数 {#prb:sec-rv-spaces}

::: definition 確率空間 {#prb:probability-space keywords="probability space (Omega, F, P): a measure space with P(Omega) = 1; events; almost surely" index="確率空間|かくりつくうかん, 事象|じしょう, ほとんど確実に|ほとんどかくじつに"}
測度空間 $(\Omega,\mathcal{F},P)$ で $P(\Omega)=1$ となるものを**確率空間**、$P$ を**確率測度**、$\mathcal{F}$ の元を**事象**という。事象 $A$ について $P(A)=1$ のとき、$A$ は**ほとんど確実に**（a.s.）起こるという。
:::

::: definition 確率変数と分布 {#prb:random-variable keywords="random variable: measurable map X from (Omega,F) to a measurable space (S,S), usually R or R^d; sigma(X) = {X^{-1}(B)}; distribution (law) P_X(B) = P(X in B) is a probability measure on S" index="確率変数|かくりつへんすう, 分布（確率変数）|ぶんぷかくりつへんすう, 確率変数の生成する σ-加法族|かくりつへんすうのせいせいするしぐまかほうぞく"}
$(\Omega,\mathcal{F},P)$ を確率空間、$(S,\mathcal{S})$ を可測空間とする。
1. 可測写像 $X\colon\Omega\to S$ を（$S$ に値をとる）**確率変数**という。$S=\mathbb{R}$（ボレル集合族）のとき実数値確率変数、$S=\mathbb{R}^{d}$ のとき確率ベクトルという。
2. $\sigma(X)\defeq\{X^{-1}(B):B\in\mathcal{S}\}$ を $X$ の生成する σ-加法族という。
3. $P_{X}(B)\defeq P(X\in B)$（$B\in\mathcal{S}$）を $X$ の**分布**（法則）という。$P_{X}=P_{Y}$ のとき $X$ と $Y$ は**同分布**であるといい、$X\overset{d}{=}Y$ と書く。
:::

::: proposition 分布は確率測度 {#prb:distribution-measure keywords="sigma(X) is a sigma-algebra contained in F; the distribution P_X = P o X^{-1} is a probability measure on (S, S)" index="像測度|ぞうそくど"}
1. $\sigma(X)$ は $\mathcal{F}$ に含まれる σ-加法族である。
2. $P_{X}$ は $(S,\mathcal{S})$ 上の確率測度である。
:::

::: proof
**1.** 逆像は補集合と可算和を保つ（$X^{-1}(S\setminus B)=\Omega\setminus X^{-1}(B)$, $X^{-1}(\bigcup B_{n})=\bigcup X^{-1}(B_{n})$）ので σ-加法族で、可測性から $\mathcal{F}$ に含まれる。

**2.** $P_{X}(S)=P(\Omega)=1$。$B_{n}\in\mathcal{S}$ が互いに素なら $X^{-1}(B_{n})$ も互いに素で、$P_{X}(\bigcup B_{n})=P(\bigcup X^{-1}(B_{n}))=\sum P(X^{-1}(B_{n}))=\sum P_{X}(B_{n})$。
:::

## 分布関数 {#prb:sec-rv-distribution-function}

::: theorem 分布関数の特徴づけ {#prb:distribution-function keywords="distribution function F_X(x) = P(X <= x): increasing, right-continuous, F(-infinity) = 0, F(+infinity) = 1; it determines the distribution; conversely every such F is the distribution function of a random variable on ([0,1], Lebesgue) via the quantile function" index="分布関数|ぶんぷかんすう, 分位点関数|ぶんいてんかんすう"}
実数値確率変数 $X$ について $F_{X}(x)\defeq P(X\le x)$ を $X$ の**分布関数**という。
1. $F_{X}$ は単調増加・右連続で、$\lim_{x\to-\infty}F_{X}(x)=0$, $\lim_{x\to\infty}F_{X}(x)=1$。また $P(X<x)=F_{X}(x-)$, $P(X=x)=F_{X}(x)-F_{X}(x-)$。
2. $F_{X}=F_{Y}$ なら $P_{X}=P_{Y}$。
3. 逆に $F\colon\mathbb{R}\to[0,1]$ が 1 の性質（単調増加・右連続・両端の極限が $0$, $1$）をもつなら、確率空間 $([0,1),\mathcal{B},\lambda)$ 上の確率変数
$$
X(u)\defeq\inf\{x\in\mathbb{R}:F(x)\ge u\}\qquad(0<u<1),\qquad X(0)\defeq0
$$
は $F_{X}=F$ を満たす。
:::

::: proof
**1.** $x\le y$ なら $\{X\le x\}\subset\{X\le y\}$ なので単調。$x_{n}\downarrow x$ なら $\{X\le x_{n}\}\downarrow\{X\le x\}$ で、有限測度の連続性から $F_{X}(x_{n})\to F_{X}(x)$（右連続）。$x_{n}\downarrow-\infty$ なら $\{X\le x_{n}\}\downarrow\emptyset$、$x_{n}\uparrow\infty$ なら $\{X\le x_{n}\}\uparrow\Omega$ なので両端の極限。$x_{n}\uparrow x$（$x_{n}<x$）なら $\{X\le x_{n}\}\uparrow\{X<x\}$ なので $P(X<x)=F_{X}(x-)$、差をとれば $P(X=x)$ の式。

**2.** $\mathcal{P}\defeq\{(-\infty,x]:x\in\mathbb{R}\}\cup\{\emptyset\}$ は π 系で（$(-\infty,x]\cap(-\infty,y]=(-\infty,\min(x,y)]$）、$\sigma(\mathcal{P})=\mathcal{B}(\mathbb{R})$（$(a,b]=(-\infty,b]\setminus(-\infty,a]$ で、半開区間はボレル集合族を生成する）。$P_{X}$ と $P_{Y}$ は $\mathcal{P}$ 上で一致する有限測度なので、\ref{meas:measure-uniqueness}（$X_{n}\defeq(-\infty,n]\uparrow\mathbb{R}$）から一致する。

**3.** **Step 1（$X$ は実数値）.** $0<u<1$ とする。$\lim_{x\to\infty}F=1>u$ から $\{x:F(x)\ge u\}$ は空でなく、$\lim_{x\to-\infty}F=0<u$ から下に有界なので、下限は実数。

**Step 2（$X(u)\le x\iff u\le F(x)$）.** $F$ は単調増加なので $\{x:F(x)\ge u\}$ は上に閉じた区間（$x\in$ かつ $y\ge x$ なら $y\in$）で、右連続性から下限 $X(u)$ 自身を含む（$x_{n}\downarrow X(u)$ を集合の中からとると $F(X(u))=\lim F(x_{n})\ge u$）。よって $\{x:F(x)\ge u\}=[X(u),\infty)$ で、$X(u)\le x\iff F(x)\ge u$。

**Step 3.** Step 2 から $\{u\in(0,1):X(u)\le x\}=(0,1)\cap(0,F(x)]$ は区間なので $X$ はボレル可測で、$\lambda(X\le x)=\lambda((0,F(x)])=F(x)$（$u=0$ の 1 点は測度 $0$）。
:::

::: example 典型的な分布 {#prb:distribution-examples keywords="Bernoulli, binomial, Poisson, geometric distributions; uniform, exponential, normal (Gaussian) densities; density of an absolutely continuous distribution" index="ベルヌーイ分布|べるぬーいぶんぷ, 二項分布|にこうぶんぷ, ポアソン分布|ぽあそんぶんぷ, 一様分布|いちようぶんぷ, 指数分布|しすうぶんぷ, 正規分布|せいきぶんぷ, 確率密度関数|かくりつみつどかんすう"}
1. （離散分布）可算集合 $\{a_{k}\}\subset\mathbb{R}$ と $p_{k}\ge0$, $\sum p_{k}=1$ について $\mu\defeq\sum_{k}p_{k}\delta_{a_{k}}$（$\delta_{a}(B)\defeq\mathbf{1}_{B}(a)$）は $\mathbb{R}$ 上の確率測度。ベルヌーイ分布 $B(1,p)$：$P(X=1)=p$, $P(X=0)=1-p$。二項分布 $B(n,p)$：$P(X=k)=\binom nk p^{k}(1-p)^{n-k}$。ポアソン分布 $\mathrm{Po}(\lambda)$：$P(X=k)=e^{-\lambda}\frac{\lambda^{k}}{k!}$（$k\ge0$）。
2. （絶対連続な分布）$f\ge0$ がボレル可測で $\int_{\mathbb{R}}f\,dx=1$ なら $\mu(B)\defeq\int_{B}f\,dx$ は確率測度で、$f$ をその**確率密度関数**という。一様分布 $U(a,b)$：$f=\frac{1}{b-a}\mathbf{1}_{[a,b]}$。指数分布 $\mathrm{Exp}(\lambda)$：$f(x)=\lambda e^{-\lambda x}\mathbf{1}_{[0,\infty)}(x)$。正規分布 $N(m,\sigma^{2})$（$\sigma>0$）：$f(x)=\frac{1}{\sqrt{2\pi}\sigma}e^{-(x-m)^{2}/(2\sigma^{2})}$。
:::

::: proof
**1.** $\mu(\bigcup B_{n})=\sum_{k}p_{k}\mathbf{1}_{\bigcup B_{n}}(a_{k})=\sum_{k}\sum_{n}p_{k}\mathbf{1}_{B_{n}}(a_{k})$（$B_{n}$ が互いに素）で、非負項の和の順序交換から $\sum_{n}\mu(B_{n})$。二項分布の和は二項定理から $(p+1-p)^{n}=1$、ポアソン分布は $e^{-\lambda}\sum\frac{\lambda^{k}}{k!}=1$。

**2.** 可算加法性は単調収束定理（$\mathbf{1}_{\bigcup B_{n}}f=\sum_{n}\mathbf{1}_{B_{n}}f$）から。$\int\lambda e^{-\lambda x}\mathbf{1}_{[0,\infty)}=1$ は直接の計算。正規分布：$x=m+\sqrt2\sigma y$ と置き換えて（\ref{meas:lebesgue-linear}）$\frac{1}{\sqrt\pi}\int e^{-y^{2}}dy=1$（\ref{calc:gaussian-integral}、非負関数なので広義積分とルベーグ積分は一致する）。
:::

## 期待値 {#prb:sec-rv-expectation}

::: definition 期待値・分散・モーメント {#prb:expectation keywords="expectation E X = int X dP for nonnegative or integrable X; moments E X^k; variance Var X = E (X - E X)^2 = E X^2 - (E X)^2; covariance" index="期待値|きたいち, 分散|ぶんさん, モーメント|もーめんと, 共分散|きょうぶんさん"}
実数値確率変数 $X$ について、$X\ge0$ または $X\in L^{1}(P)$ のとき $E[X]\defeq\int_{\Omega}X\,dP$ を**期待値**（平均）という。$E[|X|^{k}]<\infty$ のとき $E[X^{k}]$ を $k$ 次の**モーメント**という。$X\in L^{2}$ のとき
$$
\operatorname{Var}(X)\defeq E\bigl[(X-E[X])^{2}\bigr]=E[X^{2}]-E[X]^{2}
$$
を**分散**、$X,Y\in L^{2}$ について $\operatorname{Cov}(X,Y)\defeq E[(X-E[X])(Y-E[Y])]$ を**共分散**という。
:::

（分散の 2 番目の等号は、$(X-m)^{2}=X^{2}-2mX+m^{2}$（$m=E[X]$）の期待値をとり、積分の線形性と $E[1]=1$ を使えばよい。$L^{2}\subset L^{1}$ は \ref{meas:lp-inclusions.1} から。）

::: theorem 変数変換の公式 {#prb:change-of-variables keywords="for a random variable X with values in (S,S) and a measurable g >= 0 or with g(X) integrable, E g(X) = int_S g dP_X; expectation depends only on the distribution; E X = sum a_k p_k or int x f(x) dx" index="期待値の変数変換|きたいちのへんすうへんかん"}
$X$ を $(S,\mathcal{S})$ に値をとる確率変数、$g\colon S\to\mathbb{R}$ を可測関数とする。$g\ge0$ なら
$$
E[g(X)]=\int_{S}g\,dP_{X}
$$
（両辺は $[0,\infty]$ の値）。一般の $g$ では、$g(X)\in L^{1}(P)$ と $g\in L^{1}(P_{X})$ は同値で、そのとき同じ等式が成り立つ。とくに $X$ が密度 $f$ をもてば $E[g(X)]=\int g(x)f(x)\,dx$、離散分布 $\sum p_{k}\delta_{a_{k}}$ なら $E[g(X)]=\sum_{k}g(a_{k})p_{k}$。
:::

::: proof
**Step 1（指示関数）.** $g=\mathbf{1}_{B}$ なら $E[\mathbf{1}_{B}(X)]=P(X\in B)=P_{X}(B)=\int\mathbf{1}_{B}\,dP_{X}$。

**Step 2（単関数）.** 両辺は $g$ について線形なので、非負の単関数で成り立つ。

**Step 3（非負）.** \ref{meas:simple-approximation} から非負単関数 $s_{n}\uparrow g$ をとると $s_{n}(X)\uparrow g(X)$。両辺に単調収束定理を使えばよい。

**Step 4（一般）.** $|g|$ に Step 3 を使うと $E[|g(X)|]=\int|g|\,dP_{X}$ なので可積分性は同値。$g=g^{+}-g^{-}$ に分けて Step 3 を使えばよい。

**密度・離散.** $\int g\,dP_{X}=\int gf\,dx$ は、$g=\mathbf{1}_{B}$ のとき密度の定義で、Step 2〜4 と同じ議論で一般の $g$ に延びる。離散分布も同様（$\int g\,d\delta_{a}=g(a)$ と非負項の和の交換）。
:::

::: proposition 裾の公式 {#prb:tail-formula keywords="for X >= 0, E X = int_0^infinity P(X > t) dt and E X^p = int_0^infinity p t^{p-1} P(X > t) dt; for integer valued X >= 0, E X = sum_{n>=1} P(X >= n)" index="裾の公式（期待値）|すそのこうしききたいち"}
$X\ge0$ を確率変数、$p>0$ とする。
1. $E[X^{p}]=\int_{0}^{\infty}pt^{p-1}P(X>t)\,dt$。とくに $E[X]=\int_{0}^{\infty}P(X>t)\,dt$。
2. $X$ が非負整数値なら $E[X]=\sum_{n\ge1}P(X\ge n)$。
:::

::: proof
**1.** $X(\omega)^{p}=\int_{0}^{X(\omega)}pt^{p-1}dt=\int_{0}^{\infty}pt^{p-1}\mathbf{1}_{\{t<X(\omega)\}}dt$。$(\omega,t)\mapsto pt^{p-1}\mathbf{1}_{\{t<X(\omega)\}}$ は $\mathcal{F}\otimes\mathcal{B}$ 可測（$\{(\omega,t):t<X(\omega)\}=\bigcup_{q\in\mathbb{Q}}\{X>q\}\times[0,q)$）で非負なので、トネリから
$$
E[X^{p}]=\int_{\Omega}\int_{0}^{\infty}pt^{p-1}\mathbf{1}_{\{t<X\}}\,dt\,dP=\int_{0}^{\infty}pt^{p-1}P(X>t)\,dt.
$$

**2.** $t\in[n-1,n)$ で $P(X>t)=P(X\ge n)$ なので、1 の積分は $\sum_{n\ge1}P(X\ge n)$。
:::

## 不等式 {#prb:sec-rv-inequalities}

::: theorem マルコフ・チェビシェフ・イェンセンの不等式 {#prb:basic-inequalities keywords="Markov inequality P(|X| >= a) <= E|X|/a; Chebyshev inequality P(|X - E X| >= a) <= Var X / a^2; Jensen inequality phi(E X) <= E phi(X) for convex phi; L^q subset L^p for p < q" index="マルコフの不等式|まるこふのふとうしき, チェビシェフの不等式|ちぇびしぇふのふとうしき, イェンセンの不等式（期待値）|いぇんせんのふとうしききたいち"}
$X$ を実数値確率変数、$a>0$ とする。
1. （マルコフ）$\varphi\colon[0,\infty)\to[0,\infty)$ が単調増加で $\varphi(a)>0$ なら $P(|X|\ge a)\le\frac{E[\varphi(|X|)]}{\varphi(a)}$。とくに $P(|X|\ge a)\le\frac{E[|X|]}{a}$。
2. （チェビシェフ）$X\in L^{2}$ なら $P(|X-E[X]|\ge a)\le\frac{\operatorname{Var}(X)}{a^{2}}$。
3. （イェンセン）$I$ を開区間、$\varphi\colon I\to\mathbb{R}$ を凸関数とし、$X\in I$（a.s.）、$X\in L^{1}$, $\varphi(X)\in L^{1}$ とする。このとき $E[X]\in I$ で $\varphi(E[X])\le E[\varphi(X)]$。
4. $0<p<q$ なら $E[|X|^{p}]^{1/p}\le E[|X|^{q}]^{1/q}$。
:::

::: proof
**1.** $\varphi(a)\mathbf{1}_{\{|X|\ge a\}}\le\varphi(|X|)$（$|X|\ge a$ なら単調性から、そうでなければ左辺は $0$）の期待値をとる。

**2.** 1 を $X-E[X]$ と $\varphi(t)=t^{2}$ に使う。

**3.** **Step 1（$E[X]\in I$）.** $I=(\alpha,\beta)$ とする（端は $\pm\infty$ でもよい）。$\alpha>-\infty$ なら $X-\alpha>0$ a.s. なので $E[X]-\alpha=E[X-\alpha]>0$（非負関数の積分が $0$ ならその関数は a.e. で $0$）。$\beta$ 側も同様。

**Step 2（支持直線）.** $m\defeq E[X]\in I$、$c\defeq\varphi'_{+}(m)$（\ref{calc:convex-properties.2}）とする。\ref{calc:convex-properties.1} から、$x>m$ では傾き $\frac{\varphi(x)-\varphi(m)}{x-m}$ は $x\downarrow m$ で単調に減少して $c$ に近づくので $\ge c$。$x<m$ では $\frac{\varphi(m)-\varphi(x)}{m-x}\le\varphi'_{-}(m)\le c$。どちらの場合も $\varphi(x)\ge\varphi(m)+c(x-m)$。

**Step 3.** $x=X(\omega)$ として期待値をとると $E[\varphi(X)]\ge\varphi(m)+c(E[X]-m)=\varphi(m)$。

**4.** $\frac{q}{p}>1$ なので \ref{meas:lp-inclusions.1}（$P(\Omega)=1$）を $|X|^{p}$ と指数 $1$, $\frac qp$ に使えばよい（$E[|X|^{q}]=\infty$ なら自明）。
:::

::: hypcheck
- 分布関数の特徴づけ（3）の構成は、ルベーグ–スティルチェス測度（\ref{meas:lebesgue-stieltjes}）を使って $(\mathbb{R},\mathcal{B},\mu_{F})$ 上の恒等写像をとっても得られる。ここでは分位点関数を使い、$([0,1),\lambda)$ だけで済ませた。この構成は、乱数生成（一様乱数から任意の分布の乱数を作る）の基本でもある。
- イェンセンの不等式（3）で $I$ を開区間にしたのは、$E[X]$ で片側微分係数が存在するためである。閉区間の端では片側微分係数が $\pm\infty$ になりうるが、そのときは $X$ が端点に a.s. 等しいので不等式は自明に成り立つ。
- 確率空間であること（$P(\Omega)=1$）は、分布関数の両端の極限、イェンセンの不等式（定数関数の期待値が定数）、4 の包含（有限測度）で本質的に使った。
:::

::: supplement
**関連する結果.**
- 分布関数は高々可算個の不連続点しかもたない（単調関数の性質）。分布は、離散部分・絶対連続部分・特異連続部分（カントール関数のような）に一意に分解される（ルベーグ分解、\ref{meas:page-radon-nikodym}）。
- 一般の可測空間 $S$ でも、$S$ が完備可分距離空間なら、任意の分布は $([0,1),\lambda)$ 上の確率変数で実現できる（ボレル同型）。これは標準的な事実として知られているが、このサイトではまだ証明していない。

**高い視点：押し出しとしての分布.** 分布 $P_{X}=P\circ X^{-1}$ は測度の**押し出し**（像測度）$X_{*}P$ であり、変数変換の公式は「積分は押し出しと可換」すなわち $\int g\,d(X_{*}P)=\int g\circ X\,dP$ という関手性である。確率論で確率空間 $\Omega$ を明示しないことが多いのは、知りたい量がすべて分布（押し出された測度）だけで決まるからで、$\Omega$ は「必要な確率変数をすべて載せられるだけ大きい舞台」という脇役にすぎない。比喩で言えば、$\Omega$ は劇場、確率変数は観客の視点、分布はその視点から見える舞台の景色である。
:::

## 問題 {#prb:sec-rv-problems}

::: problem {#prb:prob-rv-moments}
$X\sim\mathrm{Exp}(\lambda)$ について $E[X^{k}]=\frac{k!}{\lambda^{k}}$（$k\ge0$）、$\operatorname{Var}(X)=\frac{1}{\lambda^{2}}$ を示せ。また $X\sim\mathrm{Po}(\lambda)$ について $E[X]=\operatorname{Var}(X)=\lambda$ を示せ。
:::

::: solution
指数分布：\ref{prb:tail-formula.1} から $E[X^{k}]=\int_{0}^{\infty}kt^{k-1}e^{-\lambda t}dt$（$P(X>t)=e^{-\lambda t}$）。部分積分で $I_{k}\defeq\int_{0}^{\infty}t^{k}e^{-\lambda t}dt=\frac{k}{\lambda}I_{k-1}$、$I_{0}=\frac1\lambda$ なので $I_{k-1}=\frac{(k-1)!}{\lambda^{k}}$ で、$E[X^{k}]=kI_{k-1}=\frac{k!}{\lambda^{k}}$。$\operatorname{Var}(X)=\frac{2}{\lambda^{2}}-\frac{1}{\lambda^{2}}$。ポアソン分布：\ref{prb:change-of-variables} から $E[X]=\sum_{k\ge1}ke^{-\lambda}\frac{\lambda^{k}}{k!}=\lambda e^{-\lambda}\sum_{k\ge1}\frac{\lambda^{k-1}}{(k-1)!}=\lambda$、同様に $E[X(X-1)]=\lambda^{2}$ なので $E[X^{2}]=\lambda^{2}+\lambda$、$\operatorname{Var}(X)=\lambda$。
:::

::: problem {#prb:prob-rv-quantile}
$X\sim\mathrm{Exp}(1)$ を \ref{prb:distribution-function.3} の方法で $([0,1),\lambda)$ 上に作ると $X(u)=-\log(1-u)$ であることを確かめよ。また $U\sim U(0,1)$ なら $-\log U\sim\mathrm{Exp}(1)$ を示せ。
:::

::: solution
$F(x)=(1-e^{-x})\mathbf{1}_{[0,\infty)}(x)$ は $[0,\infty)$ で連続かつ狭義単調増加なので、$0<u<1$ について $\inf\{x:F(x)\ge u\}$ は $1-e^{-x}=u$ の解 $x=-\log(1-u)$。後半：$t\ge0$ で $P(-\log U\le t)=P(U\ge e^{-t})=1-e^{-t}$ で、$t<0$ では $0$。分布関数が一致するので \ref{prb:distribution-function.2} から同分布。
:::
