# コルモゴロフの拡張定理 {#prb:page-kolmogorov-extension keywords="stochastic processes as random elements of R^T, product sigma-algebra, cylinder sets, finite-dimensional distributions and their consistency, inner regularity of Borel probability measures on R^d, Kolmogorov extension (consistency) theorem, uniqueness via the pi-lambda theorem, multivariate characteristic functions and uniqueness, multivariate normal distributions, Gaussian processes with positive semidefinite covariance, existence of Brownian finite-dimensional distributions"}

確率過程 $(X_{t})_{t\in T}$ の法則を指定するとき、実際に書けるのは有限個の時刻 $t_{1},\dots,t_{k}$ での同時分布（**有限次元分布**）だけである。それらが互いに矛盾しない（**整合的**である）なら、それらを周辺分布にもつ確率過程は本当に存在するか。**コルモゴロフの拡張定理**はこれを肯定する：$T$ がどんな集合でも、整合的な有限次元分布の族は、積空間 $\mathbb{R}^{T}$ 上の確率測度に一意に延びる。このページでは、$\mathbb{R}^{d}$ 上の確率測度の**内部正則性**（コンパクト集合で近似できること）を使ってこの定理を証明し、応用として**多次元正規分布**と**ガウス過程**——とくにブラウン運動の有限次元分布をもつ過程——の存在を示す。

## 記法と定義の確認 {#prb:sec-ke-notation}

::: notation
- $T$ は空でない集合（添字集合、「時刻」）。$\mathbb{R}^{T}$ は関数 $x\colon T\to\mathbb{R}$ 全体。$J\subset T$ について $\pi_{J}\colon\mathbb{R}^{T}\to\mathbb{R}^{J}$ は制限（射影）、$\pi_{t}\defeq\pi_{\{t\}}$。$\mathbb{R}^{J}$（$J$ 有限）は $\mathbb{R}^{|J|}$ と同一視し、ボレル集合族を入れる。
- 半環・前測度・カラテオドリの拡張定理は \ref{meas:semiring}, \ref{meas:caratheodory-extension}、π-λ 定理と測度の一意性は \ref{meas:pi-lambda}, \ref{meas:measure-uniqueness}。
- ハイネ–ボレルの定理（$\mathbb{R}^{d}$ の有界閉集合はコンパクト、したがって点列コンパクト）は \ref{top:heine-borel}。実対称行列の直交対角化は \ref{lin:spectral-theorem.3}。
- 特性関数とガウス関数での平滑化は \ref{prb:page-central-limit-theorem}。
- **選択公理**：使わない（点列から収束部分列をとるときは、各座標の上極限に収束する部分列を最小の番号で選ぶ）。
:::

## 積 σ-加法族と有限次元分布 {#prb:sec-ke-cylinder}

::: definition 柱集合と有限次元分布 {#prb:finite-dimensional-distributions keywords="cylinder sets pi_J^{-1}(B) for finite J and Borel B; product sigma-algebra on R^T generated by cylinders; finite-dimensional distributions of a process; consistency: mu_J o (pi^J_I)^{-1} = mu_I for I subset J" index="柱集合|ちゅうしゅうごう, 有限次元分布|ゆうげんじげんぶんぷ, 整合性（有限次元分布）|せいごうせいゆうげんじげんぶんぷ"}
1. 有限集合 $J\subset T$ とボレル集合 $B\subset\mathbb{R}^{J}$ について $\pi_{J}^{-1}(B)$ を**柱集合**といい、その全体を $\mathcal{A}$、$\sigma(\mathcal{A})$ を $\mathbb{R}^{T}$ の**積 σ-加法族** $\mathcal{B}^{T}$ という。
2. 確率過程 $X=(X_{t})_{t\in T}$（各 $X_{t}$ は実数値確率変数）について、有限集合 $J$ ごとの $(X_{t})_{t\in J}$ の分布 $\mu_{J}$ を**有限次元分布**という。
3. 有限集合 $J$ ごとの $\mathbb{R}^{J}$ 上の確率測度 $\mu_{J}$ の族が**整合的**であるとは、$I\subset J$ のとき $\pi_{I}^{J}\colon\mathbb{R}^{J}\to\mathbb{R}^{I}$（制限）について $\mu_{J}\circ(\pi_{I}^{J})^{-1}=\mu_{I}$ となることをいう。
:::

（確率過程の有限次元分布は整合的である：$(X_{t})_{t\in I}=\pi_{I}^{J}((X_{t})_{t\in J})$。また $X\colon\Omega\to\mathbb{R}^{T}$ は $(\mathcal{F},\mathcal{B}^{T})$ 可測で、$\mathcal{B}^{T}$ 上のその分布は有限次元分布で決まる——$\mathcal{A}$ は π 系で、\ref{meas:measure-uniqueness} から。）

::: lemma 柱集合の代数 {#prb:cylinder-algebra keywords="cylinder sets form an algebra; any finitely many cylinders can be written over a common finite index set; a consistent family defines a finitely additive set function on cylinders" index="柱集合の代数|ちゅうしゅうごうのだいすう"}
1. 有限個の柱集合は、共通の有限集合 $J$ の上の柱集合 $\pi_{J}^{-1}(B_{1}),\dots,\pi_{J}^{-1}(B_{m})$ として書ける。とくに $\mathcal{A}$ は補集合と有限和で閉じた集合族（代数）で、半環でもある。
2. 整合的な族 $(\mu_{J})$ について、$\mu(\pi_{J}^{-1}(B))\defeq\mu_{J}(B)$ は表し方によらずに定まり、$\mu$ は $\mathcal{A}$ 上の有限加法的な関数で $\mu(\mathbb{R}^{T})=1$。
:::

::: proof
**1.** $I\subset J$ なら $\pi_{I}^{-1}(B)=\pi_{J}^{-1}((\pi_{I}^{J})^{-1}(B))$ で、$(\pi_{I}^{J})^{-1}(B)=B\times\mathbb{R}^{J\setminus I}$ はボレル集合。有限個の柱集合の添字集合の和 $J$ をとればよい。同じ $J$ の上では、補集合・和・差はボレル集合の演算に対応する。

**2.** $\pi_{I}^{-1}(B)=\pi_{J}^{-1}(C)$ とする。$K\defeq I\cup J$ の上に書き直すと $(\pi_{I}^{K})^{-1}(B)=(\pi_{J}^{K})^{-1}(C)$（射影 $\pi_{K}$ は全射なので）で、整合性から $\mu_{I}(B)=\mu_{K}((\pi_{I}^{K})^{-1}(B))=\mu_{K}((\pi_{J}^{K})^{-1}(C))=\mu_{J}(C)$。有限加法性は、互いに素な柱集合を共通の $J$ の上に書けば $\mu_{J}$ の加法性から。
:::

::: lemma 内部正則性 {#prb:inner-regularity keywords="every Borel probability measure on R^d is inner regular: for Borel B and eps > 0 there is a compact K subset B with mu(B \ K) < eps" index="内部正則性（確率測度）|ないぶせいそくせいかくりつそくど"}
$\mu$ を $\mathbb{R}^{d}$ のボレル集合族上の確率測度とする。任意のボレル集合 $B$ と $\varepsilon>0$ について、コンパクト集合 $K\subset B$ で $\mu(B\setminus K)<\varepsilon$ となるものがある。
:::

::: proof
**Step 1（閉集合と開集合で挟む）.** $\mathcal{C}$ を、任意の $\varepsilon>0$ について閉集合 $F$ と開集合 $U$ で $F\subset B\subset U$, $\mu(U\setminus F)<\varepsilon$ となるものがあるボレル集合 $B$ の全体とする。閉集合 $F$ は $\mathcal{C}$ に属する：$U_{k}\defeq\{x:\operatorname{dist}(x,F)<\frac1k\}$ は開集合で $U_{k}\downarrow F$ なので、測度の連続性から $\mu(U_{k}\setminus F)\to0$。$\mathcal{C}$ は補集合で閉じる（$U^{c}\subset B^{c}\subset F^{c}$）。可算和：$B_{j}\in\mathcal{C}$ について $F_{j}\subset B_{j}\subset U_{j}$, $\mu(U_{j}\setminus F_{j})<\varepsilon2^{-j-1}$ をとり、$U\defeq\bigcup U_{j}$, $F\defeq\bigcup_{j\le N}F_{j}$（$N$ は $\mu(\bigcup_{j}F_{j}\setminus F)<\frac\varepsilon2$ となるように、測度の連続性で選ぶ）とすると $\mu(U\setminus F)<\varepsilon$。よって $\mathcal{C}$ は閉集合を含む σ-加法族で、すべてのボレル集合を含む。

**Step 2（コンパクト）.** $B$ について Step 1 の $F$ を $\mu(B\setminus F)<\frac\varepsilon2$ でとり、$R$ を $\mu(\mathbb{R}^{d}\setminus[-R,R]^{d})<\frac\varepsilon2$ となるようにとる（$[-R,R]^{d}\uparrow\mathbb{R}^{d}$）。$K\defeq F\cap[-R,R]^{d}$ は有界閉集合でコンパクト（\ref{top:heine-borel}）、$\mu(B\setminus K)<\varepsilon$。
:::

## 拡張定理 {#prb:sec-ke-extension}

::: theorem コルモゴロフの拡張定理 {#prb:kolmogorov-extension keywords="Kolmogorov extension theorem: a consistent family of finite-dimensional Borel probability measures mu_J extends uniquely to a probability measure on (R^T, B^T); hence there is a process with the given finite-dimensional distributions" index="コルモゴロフの拡張定理|こるもごろふのかくちょうていり, 整合性定理|せいごうせいていり"}
$(\mu_{J})_{J\subset T\text{ 有限}}$ を整合的な確率測度の族とする。$\mathcal{B}^{T}$ 上の確率測度 $\mu$ で、すべての有限な $J$ について $\mu\circ\pi_{J}^{-1}=\mu_{J}$ となるものがただ一つある。とくに、座標過程 $X_{t}\defeq\pi_{t}$ は $(\mathbb{R}^{T},\mathcal{B}^{T},\mu)$ 上の確率過程で、その有限次元分布は $(\mu_{J})$ である。
:::

::: proof
\ref{prb:cylinder-algebra.2} の有限加法的な $\mu$ を $\mathcal{A}$ 上で考える。

**Step 1（$\emptyset$ での連続性）.** 柱集合の減少列 $C_{1}\supset C_{2}\supset\cdots$ で $\bigcap_{n}C_{n}=\emptyset$ なら $\mu(C_{n})\to0$ を示す。そうでないとし、$\mu(C_{n})\ge\varepsilon>0$（すべての $n$）とする。\ref{prb:cylinder-algebra.1} から、有限集合の増大列 $J_{1}\subset J_{2}\subset\cdots$ で $C_{n}=\pi_{J_{n}}^{-1}(B_{n})$ と書ける（必要なら添字集合を大きくする）。\ref{prb:inner-regularity} から、コンパクト $K_{n}\subset B_{n}$ で $\mu_{J_{n}}(B_{n}\setminus K_{n})<\varepsilon2^{-n-1}$ となるものをとり、$D_{n}\defeq\pi_{J_{n}}^{-1}(K_{n})$, $E_{n}\defeq D_{1}\cap\dots\cap D_{n}\subset C_{n}$ とおく。
$$
\mu(C_{n}\setminus E_{n})\le\sum_{k\le n}\mu(C_{k}\setminus D_{k})<\frac\varepsilon2
$$
（$C_{n}\subset C_{k}$）なので $\mu(E_{n})>\frac\varepsilon2$、とくに $E_{n}\ne\emptyset$。$\pi_{J_{n}}(E_{n})=K_{n}\cap\bigcap_{k<n}\bigl(K_{k}\times\mathbb{R}^{J_{n}\setminus J_{k}}\bigr)$ は空でないコンパクト集合なので、その辞書式最小の点（第 1 座標の最小値をとり、その中で第 2 座標の最小値をとり、…）を $\pi_{J_{n}}(x^{(n)})$ とし、$J_{n}$ の外の座標を $0$ として $x^{(n)}\in E_{n}$ を具体的に定める。

**Step 2（対角線論法）.** $n\ge m$ なら $x^{(n)}\in E_{n}\subset D_{m}$ なので $\pi_{J_{m}}(x^{(n)})\in K_{m}$（コンパクト）。$J\defeq\bigcup_{m}J_{m}$ は可算で、座標ごとに有界な列なので、対角線論法で部分列 $x^{(n_{k})}$ をとり、すべての $t\in J$ で $x^{(n_{k})}_{t}$ が収束するようにできる。極限 $y_{t}$（$t\in J$）と $y_{t}\defeq0$（$t\notin J$）で $y\in\mathbb{R}^{T}$ を定める。$\pi_{J_{m}}(x^{(n_{k})})\to\pi_{J_{m}}(y)$ で $K_{m}$ は閉集合なので $\pi_{J_{m}}(y)\in K_{m}$、すなわち $y\in D_{m}$（すべての $m$）。よって $y\in\bigcap_{m}D_{m}\subset\bigcap_{n}C_{n}=\emptyset$ となり矛盾。

**Step 3（可算加法性と延長）.** $C=\bigsqcup_{j}C_{j}$（$C,C_{j}\in\mathcal{A}$）なら、$C\setminus\bigcup_{j\le n}C_{j}\in\mathcal{A}$ は減少して $\emptyset$ に近づくので、Step 1 と有限加法性から $\mu(C)-\sum_{j\le n}\mu(C_{j})\to0$。よって $\mu$ は半環 $\mathcal{A}$ 上の前測度で、\ref{meas:caratheodory-extension} から $\sigma(\mathcal{A})=\mathcal{B}^{T}$ 上の測度に延び、$\mu(\mathbb{R}^{T})=1$ なので一意（同定理の 2）。$\mu\circ\pi_{J}^{-1}=\mu_{J}$ は柱集合上の定義そのもの。
:::

## 多次元正規分布とガウス過程 {#prb:sec-ke-gaussian}

::: lemma 多次元の特性関数による一意性 {#prb:multivariate-uniqueness keywords="probability measures on R^d are determined by integrals of bounded continuous functions and by their characteristic functions phi(u) = int e^{i <u, x>} mu(dx)" index="多次元の特性関数|たじげんのとくせいかんすう"}
$\mu,\nu$ を $\mathbb{R}^{d}$ 上の確率測度とする。
1. すべての有界連続関数 $g$ で $\int g\,d\mu=\int g\,d\nu$ なら $\mu=\nu$。
2. 特性関数 $\varphi_{\mu}(u)\defeq\int e^{i\langle u,x\rangle}\mu(dx)$ が一致するなら $\mu=\nu$。
:::

::: proof
**1.** 開集合 $U$ について $g_{k}(x)\defeq\min(1,k\operatorname{dist}(x,U^{c}))$ は連続で $g_{k}\uparrow\mathbf{1}_{U}$。単調収束定理から $\mu(U)=\nu(U)$。開集合は π 系でボレル集合族を生成するので、\ref{meas:measure-uniqueness} から $\mu=\nu$。

**2.** \ref{prb:characteristic-uniqueness.1} の証明を各座標について行うと（$\gamma_{\sigma}^{(d)}(y)\defeq\prod_{j}\gamma_{\sigma}(y_{j})$ について Step 2 の表示の積をとり、フビニを使う）、$\mu$ と $N(0,\sigma^{2})^{\otimes d}$ の畳み込み $\mu_{\sigma}$ の密度は $\frac{1}{(2\pi)^{d}}\int\varphi_{\mu}(u)e^{-\sigma^{2}|u|^{2}/2}e^{-i\langle u,x\rangle}du$ で、$\varphi_{\mu}$ だけで決まる。$g$ が有界連続なら $\int g\,d\mu_{\sigma}=\iint g(x+\sigma z)\gamma_{1}^{(d)}(z)\,dz\,\mu(dx)\to\int g\,d\mu$（優収束定理）。よって $\int g\,d\mu=\int g\,d\nu$ で、1 から結論。
:::

::: definition 多次元正規分布 {#prb:multivariate-normal keywords="multivariate normal distribution N(m, Sigma) on R^d for a positive semidefinite symmetric matrix Sigma: law of m + A Z with A A^T = Sigma and Z standard normal; characteristic function exp(i <u, m> - <u, Sigma u>/2)" index="多次元正規分布|たじげんせいきぶんぷ, 共分散行列|きょうぶんさんぎょうれつ"}
$m\in\mathbb{R}^{d}$ と半正定値な実対称行列 $\Sigma$ について、特性関数が
$$
\varphi(u)=\exp\Bigl(i\langle u,m\rangle-\frac12\langle u,\Sigma u\rangle\Bigr)
$$
となる $\mathbb{R}^{d}$ 上の確率測度を**正規分布** $N(m,\Sigma)$ という。
:::

::: proposition 多次元正規分布の存在と線形変換 {#prb:multivariate-normal-properties keywords="N(m, Sigma) exists and is unique; if X ~ N(m, Sigma) and L is a k x d matrix then L X + b ~ N(L m + b, L Sigma L^T); marginals of normal vectors are normal; E X = m, Cov X = Sigma" index="正規分布の線形変換|せいきぶんぷのせんけいへんかん"}
1. $N(m,\Sigma)$ は存在して一意である。
2. $X\sim N(m,\Sigma)$、$L$ を $k\times d$ 行列、$b\in\mathbb{R}^{k}$ とすると $LX+b\sim N(Lm+b,L\Sigma L^{\top})$。とくに座標の部分集合への射影も正規分布。
3. $X\sim N(m,\Sigma)$ なら $E[X]=m$, $E[(X_{j}-m_{j})(X_{k}-m_{k})]=\Sigma_{jk}$。
:::

::: proof
**1.** 一意性は \ref{prb:multivariate-uniqueness.2}。存在：\ref{lin:spectral-theorem.3} から $\Sigma=QD Q^{\top}$（$Q$ 直交、$D$ 対角で成分 $\ge0$）。$A\defeq QD^{1/2}$ とすると $AA^{\top}=\Sigma$。$Z=(Z_{1},\dots,Z_{d})$ を独立な $N(0,1)$ とし（\ref{prb:independent-sequence-existence}）、$X\defeq m+AZ$ とする。独立性と \ref{prb:characteristic-basic.4} から
$$
E[e^{i\langle u,X\rangle}]=e^{i\langle u,m\rangle}E[e^{i\langle A^{\top}u,Z\rangle}]=e^{i\langle u,m\rangle}\prod_{j}e^{-(A^{\top}u)_{j}^{2}/2}=e^{i\langle u,m\rangle-\frac12|A^{\top}u|^{2}},
$$
$|A^{\top}u|^{2}=\langle u,AA^{\top}u\rangle=\langle u,\Sigma u\rangle$。

**2.** $v\in\mathbb{R}^{k}$ について $E[e^{i\langle v,LX+b\rangle}]=e^{i\langle v,b\rangle}\varphi_{X}(L^{\top}v)=\exp(i\langle v,Lm+b\rangle-\frac12\langle v,L\Sigma L^{\top}v\rangle)$。

**3.** 1 の表示 $X=m+AZ$（一意性から分布は同じ）で、$E[Z_{j}]=0$, $E[Z_{j}Z_{l}]=\delta_{jl}$ から $E[(X-m)(X-m)^{\top}]=AA^{\top}=\Sigma$。
:::

::: theorem ガウス過程の存在 {#prb:gaussian-process keywords="for any function m on T and any positive semidefinite kernel c(s,t) on T x T there is a Gaussian process with mean m and covariance c; Brownian covariance min(s,t) is positive semidefinite" index="ガウス過程|がうすかてい, 半正定値核|はんせいていちかく"}
$m\colon T\to\mathbb{R}$ と、対称で半正定値な $c\colon T\times T\to\mathbb{R}$（すべての有限個の $t_{1},\dots,t_{k}$ と $a\in\mathbb{R}^{k}$ で $\sum_{j,l}a_{j}a_{l}c(t_{j},t_{l})\ge0$）について、確率過程 $(X_{t})_{t\in T}$ で、すべての有限な $J$ について $(X_{t})_{t\in J}\sim N\bigl((m(t))_{t\in J},(c(s,t))_{s,t\in J}\bigr)$ となるもの（**ガウス過程**）が存在する。とくに $T=[0,\infty)$, $m=0$, $c(s,t)=\min(s,t)$ について存在する。
:::

::: proof
$\mu_{J}\defeq N((m(t))_{t\in J},(c(s,t))_{s,t\in J})$ とおく（\ref{prb:multivariate-normal-properties.1}）。$I\subset J$ について $\pi_{I}^{J}$ は座標の選択（線形写像 $L$）で、\ref{prb:multivariate-normal-properties.2} から $\mu_{J}\circ(\pi_{I}^{J})^{-1}=N(Lm_{J},L\Sigma_{J}L^{\top})=\mu_{I}$。よって整合的で、\ref{prb:kolmogorov-extension} から過程が存在する。$\min(s,t)$ の半正定値性：$\min(s,t)=\int_{0}^{\infty}\mathbf{1}_{[0,s]}(r)\mathbf{1}_{[0,t]}(r)\,dr$ なので
$$
\sum_{j,l}a_{j}a_{l}\min(t_{j},t_{l})=\int_{0}^{\infty}\Bigl(\sum_{j}a_{j}\mathbf{1}_{[0,t_{j}]}(r)\Bigr)^{2}dr\ge0.
$$
:::

::: hypcheck
- 拡張定理の証明の Step 1 で、内部正則性（\ref{prb:inner-regularity}）が本質的に使われた。有限加法的な $\mu$ の可算加法性は一般には成り立たず、コンパクト性による「空でない閉集合の減少列の共通部分は空でない」という議論で救っている。値域が $\mathbb{R}$ でなく一般の可測空間だと、拡張定理は成り立たないことがある（反例が知られている）。完備可分距離空間（ポーランド空間）なら内部正則性が成り立つので同じ証明が通る。
- 添字集合 $T$ は非可算でもよいが、$\mathcal{B}^{T}$ の元は可算個の座標だけで決まる。そのため、$T=[0,\infty)$ のとき「道 $t\mapsto X_{t}$ が連続」という事象は $\mathcal{B}^{T}$ に属さず、拡張定理だけでは連続な過程は作れない。これが次のページでブラウン運動を別に構成する理由である。
- 多次元の一意性（\ref{prb:multivariate-uniqueness}）では、1 次元のときのような分布関数による議論を避け、有界連続関数の積分で測度が決まることを使った。
:::

::: supplement
**関連する結果.**
- イオネスク–トゥルチャの定理：推移核で与えられる過程（マルコフ過程など）は、値域に位相的な仮定なしで $\prod_{n}S_{n}$ 上に構成できる（可算個の時刻の場合）。
- 無限個の確率測度の積 $\bigotimes_{t\in T}\mu_{t}$ は、$\mu_{J}\defeq\bigotimes_{t\in J}\mu_{t}$ に拡張定理を使って得られる（\ref{prb:independent-sequence-existence} の一般化）。実は積測度については位相的な仮定なしに存在する。
- 半正定値核 $c$ からガウス過程を作る構成は、再生核ヒルベルト空間（RKHS）の理論と表裏一体である。

**高い視点：射影極限.** 有限集合 $J$ の有向系と制限写像 $\pi_{I}^{J}$ についての射影極限として $\mathbb{R}^{T}=\varprojlim\mathbb{R}^{J}$ がある。コルモゴロフの拡張定理は、この射影極限が（ラドン）確率測度の圏でも射影極限になる——整合的な測度の族はちょうど極限の上の一つの測度と対応する——ことを述べる。証明のコンパクト性の議論は、チコノフの定理の可算版と同じ構造をしている。比喩で言えば、有限次元分布は無限に多くのカメラで撮った「影」で、互いの影が矛盾しなければ、すべての影を落とす一つの「実体」がある、という定理である。
:::

## 問題 {#prb:sec-ke-problems}

::: problem {#prb:prob-ke-ou}
$\theta>0$ について $c(s,t)\defeq e^{-\theta|s-t|}$（$s,t\in\mathbb{R}$）が半正定値であることを示せ（したがって平均 $0$、共分散 $c$ のガウス過程——オルンシュタイン–ウーレンベック過程の定常版——が存在する）。
:::

::: solution
\ref{four:transform-examples.2} と \ref{four:transform-basic.3} から、$\xi\mapsto\frac{\theta/(2\pi)}{\pi((\theta/(2\pi))^{2}+\xi^{2})}$ は $e^{-\theta|x|}$ のフーリエ変換で、非負かつ可積分。反転公式（\ref{four:inversion-theorem.1}）から $e^{-\theta|x|}=\int\rho(\xi)e^{2\pi ix\xi}d\xi$, $\rho\ge0$, $\rho\in L^{1}$。よって
$$
\sum_{j,l}a_{j}a_{l}e^{-\theta|t_{j}-t_{l}|}=\int\rho(\xi)\Bigl|\sum_{j}a_{j}e^{2\pi it_{j}\xi}\Bigr|^{2}d\xi\ge0.
$$
:::

::: problem {#prb:prob-ke-gaussian-independence}
$(X,Y)$ が $\mathbb{R}^{2}$ 上の正規分布に従い $\operatorname{Cov}(X,Y)=0$ なら、$X$ と $Y$ は独立であることを示せ。
:::

::: solution
$\Sigma=\operatorname{diag}(\sigma_{X}^{2},\sigma_{Y}^{2})$ なので、特性関数は $\varphi(u,v)=e^{iu m_{X}-\sigma_{X}^{2}u^{2}/2}e^{iv m_{Y}-\sigma_{Y}^{2}v^{2}/2}$ で、これは $N(m_{X},\sigma_{X}^{2})\otimes N(m_{Y},\sigma_{Y}^{2})$ の特性関数でもある（フビニ）。\ref{prb:multivariate-uniqueness.2} から $(X,Y)$ の分布は積測度で、\ref{prb:independence-criteria.1} から独立。
:::
