# 測度とルベーグ積分（Measure Theory & Lebesgue Integration）

σ-加法族と測度、カラテオドリの拡張定理、ルベーグ積分と収束定理、フビニ＝トネリ、Lᵖ 空間、ラドン＝ニコディム。

<p class="mn-msc">MSC2020: 28A</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-measures/index.html"><span class="mn-card-title">測度</span><span class="mn-card-en">Measures</span><span class="mn-card-desc">σ-加法族とボレル集合族、測度の基本性質と完備化、π-λ 定理と測度の一意性、外測度とカラテオドリの拡張定理、ルベーグ測度（正則性・平行移動不変性・線形写像・非可測集合）、可測関数（単関数近似・エゴロフ・ルジン）。</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="02-integration/index.html"><span class="mn-card-title">ルベーグ積分</span><span class="mn-card-en">Lebesgue Integration</span><span class="mn-card-desc">非負可測関数の積分と単調収束定理・ファトゥの補題、可積分関数と優収束定理・リーマン積分との関係、積測度とフビニ–トネリの定理、Lᵖ 空間、符号付き測度とラドン–ニコディムの定理、微分定理、変数変換公式。</span><span class="mn-card-count">9 ページ</span></a>
