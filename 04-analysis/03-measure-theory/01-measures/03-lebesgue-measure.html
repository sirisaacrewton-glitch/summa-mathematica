# ルベーグ測度 {#meas:page-lebesgue-measure keywords="Lebesgue measure on R^n, volume of half-open boxes is a premeasure (compactness), Lebesgue measurable sets, completion of the Borel sigma-algebra, outer and inner regularity, G-delta and F-sigma approximation, translation invariance, uniqueness of translation-invariant measures, linear maps multiply measure by |det|, Jordan measurable sets, Cantor set, Vitali non-measurable set"}

このページでは $\mathbb{R}^{n}$ の**ルベーグ測度**を作る。半開直方体の体積が半環の上の前測度であること（ここでコンパクト性を使う）を示せば、カラテオドリの拡張定理（\ref{meas:caratheodory-extension}）から測度が得られる。そのあと、開集合とコンパクト集合による近似（正則性）、平行移動不変性とそれによる特徴づけ、線形写像による像の測度が $|\det|$ 倍になること、ジョルダン測度（\ref{calc:jordan-measurable}）との一致を示す。最後に、測度 $0$ だが非可算なカントール集合と、選択公理を使ったルベーグ可測でない集合の例を挙げる。

## 記法と定義の確認 {#meas:sec-lm-notation}

::: notation
- 半開直方体 $(a,b]\defeq\prod_{k=1}^{n}(a_{k},b_{k}]$（$a_{k}<b_{k}$）の全体を $\mathcal{I}_{n}$、空集合を加えたものを $\mathcal{S}_{n}\defeq\mathcal{I}_{n}\cup\{\varnothing\}$（半環。\ref{meas:semiring} の例 2）とする。**体積**を $v((a,b])\defeq\prod_{k}(b_{k}-a_{k})$, $v(\varnothing)\defeq0$ とする。閉直方体・開直方体の体積も同じ式で定める。
- ボレル集合族と生成元は \ref{meas:generated-sigma-algebra}, \ref{meas:borel-generators}。外測度・拡張定理・完備化との関係は \ref{meas:outer-measure-from-cover}, \ref{meas:caratheodory-extension}, \ref{meas:caratheodory-completion}。
- 多変数のリーマン積分・ダルブー和・ジョルダン可測は \ref{calc:box-integral}, \ref{calc:box-partition}, \ref{calc:jordan-measurable}。
- 基本行列・可逆行列は基本行列の積・基本行列の行列式・行列式の乗法性は \ref{lin:elementary-operations}, \ref{lin:inverse-elimination}, \ref{lin:det-special-matrices}, \ref{lin:det-multiplicative}。簡約階段形は \ref{lin:rref-existence-uniqueness}。
- $A+x\defeq\{a+x:a\in A\}$、$TA\defeq\{Ta:a\in A\}$。
- **選択公理**：ヴィタリの集合（\ref{meas:vitali}）でだけ使う。外測度の劣加法性（\ref{meas:outer-measure-from-cover}）では可算選択公理を使っている。
:::

## 構成 {#meas:sec-lm-construction}

::: lemma 直方体の体積の有限加法性 {#meas:box-volume-finite-additivity keywords="volume of half-open boxes is finitely additive and finitely subadditive on the semiring of boxes, via a common grid" index="直方体の体積の加法性|ちょくほうたいのたいせきのかほうせい"}
1. $I\in\mathcal{I}_{n}$ が互いに素な有限個の $I_{1},\dots,I_{m}\in\mathcal{I}_{n}$ の和なら $v(I)=\sum_{j}v(I_{j})$。
2. $I\subset I_{1}\cup\cdots\cup I_{m}$（$I,I_{j}\in\mathcal{S}_{n}$）なら $v(I)\le\sum_{j}v(I_{j})$。
:::

::: proof
**1.** 各座標 $k$ について、$I$ と $I_{j}$ たちの第 $k$ 成分の端点をすべて小さい順に並べた $c_{k,0}<c_{k,1}<\dots<c_{k,r_{k}}$ をとり、**格子の小直方体** $\prod_{k}(c_{k,i_{k}-1},c_{k,i_{k}}]$ を考える。$I$ も各 $I_{j}$ も、それに含まれる格子の小直方体の互いに素な和である（各座標で区間 $(a_{k},b_{k}]$ が小区間の和になるので）。直方体 $J=\prod(a_{k},b_{k}]$ について、第 $k$ 座標の小区間の長さの和は $b_{k}-a_{k}$ なので、展開して
$$
v(J)=\prod_{k}\sum_{i}(c_{k,i}-c_{k,i-1})=\sum_{J\text{ に含まれる小直方体 }Q}v(Q).
$$
$I$ に含まれる小直方体は、ちょうど一つの $I_{j}$ に含まれる（$I_{j}$ は互いに素で和が $I$）ので、$v(I)=\sum_{Q\subset I}v(Q)=\sum_{j}\sum_{Q\subset I_{j}}v(Q)=\sum_{j}v(I_{j})$。

**2.** $I_{j}$ を空でないものに限ってよい。1 と同じ格子をとると、$I$ に含まれる各小直方体 $Q$ はある $I_{j}$ と交わり、格子の小直方体は各 $I_{j}$ に含まれるか交わらないかのどちらか（座標ごとに小区間は端点で区切られている）なので、$Q\subset I_{j}$。よって $v(I)=\sum_{Q\subset I}v(Q)\le\sum_{j}\sum_{Q\subset I_{j}}v(Q)=\sum_{j}v(I_{j})$。
:::

::: theorem 体積は前測度 {#meas:box-volume-premeasure keywords="the volume of half-open boxes is countably additive on the semiring of boxes; proof by compactness of closed boxes" index="体積の可算加法性|たいせきのかさんかほうせい"}
$v$ は $\mathcal{S}_{n}$ 上の前測度である：$I=\bigsqcup_{j=1}^{\infty}I_{j}$（$I,I_{j}\in\mathcal{S}_{n}$）なら $v(I)=\sum_{j}v(I_{j})$。
:::

::: proof
$I=\varnothing$ なら自明。$I=(a,b]\neq\varnothing$ とする。

**Step 1（$\ge$）.** 各 $N$ について、$I\setminus(I_{1}\cup\cdots\cup I_{N})$ は $\mathcal{S}_{n}$ の有限個の互いに素な元の和（\ref{meas:semiring-lemma.1}）なので、$I$ は $I_{1},\dots,I_{N}$ とそれらの互いに素な和。\ref{meas:box-volume-finite-additivity.1} から $v(I)\ge\sum_{j\le N}v(I_{j})$。$N\to\infty$。

**Step 2（$\le$：コンパクト性）.** $\varepsilon>0$ とする。$v$ は端点について連続なので、$\delta>0$ を $v((a+\delta\mathbf{1},b])\ge v(I)-\varepsilon$（$\mathbf{1}=(1,\dots,1)$）となるようにとり、$K\defeq\prod_{k}[a_{k}+\delta,b_{k}]$ とする（コンパクト、$K\subset I$）。各 $I_{j}=(a^{j},b^{j}]$（空でないもの）について $\eta_{j}>0$ を $v((a^{j},b^{j}+\eta_{j}\mathbf{1}])\le v(I_{j})+\varepsilon2^{-j}$ となるようにとり、$U_{j}\defeq\prod_{k}(a^{j}_{k},b^{j}_{k}+\eta_{j})$（開）、$J_{j}\defeq(a^{j},b^{j}+\eta_{j}\mathbf{1}]\supset U_{j}\supset I_{j}$ とする。$\{U_{j}\}$ は $K\subset I=\bigcup I_{j}$ の開被覆なので、有限個 $U_{1},\dots,U_{N}$ で $K$ が覆われる。よって $(a+\delta\mathbf{1},b]\subset K\subset J_{1}\cup\cdots\cup J_{N}$ で、\ref{meas:box-volume-finite-additivity.2} から
$$
v(I)-\varepsilon\le\sum_{j\le N}v(J_{j})\le\sum_{j}\bigl(v(I_{j})+\varepsilon2^{-j}\bigr)\le\sum_{j}v(I_{j})+\varepsilon.
$$
$\varepsilon\to0$。

::: hypcheck
- **コンパクト性**（閉直方体のハイネ–ボレル）が Step 2 の本質で、無限個の被覆を有限個に減らして有限劣加法性に帰着した。有理数だけの空間 $\mathbb{Q}$ 上では、区間 $(a,b]\cap\mathbb{Q}$ に長さ $b-a$ を与えても前測度にならない（問題 \ref{meas:prob-lm-rational}）。
- 選択公理は使っていない（$\delta$, $\eta_{j}$ は具体的な式で選べる。例えば区間の長さの連続性から最小の $m$ で $\delta=1/m$ とする）。
:::
:::

::: definition ルベーグ測度 {#meas:lebesgue-measure keywords="Lebesgue outer measure and Lebesgue measure on R^n: Caratheodory extension of the volume of half-open boxes; Lebesgue measurable sets form the completion of the Borel sigma-algebra" index="ルベーグ測度|るべーぐそくど, ルベーグ外測度|るべーぐがいそくど, ルベーグ可測|るべーぐかそく"}
$(\mathcal{S}_{n},v)$ から \ref{meas:outer-measure-from-cover} で作った外測度を $\lambda^{*}$（$=\lambda_{n}^{*}$、**ルベーグ外測度**）、$\lambda^{*}$ 可測集合の全体を $\mathcal{L}_{n}$（**ルベーグ可測集合**）、$\lambda\defeq\lambda^{*}\restriction\mathcal{L}_{n}$ を **ルベーグ測度**という。
:::

::: theorem ルベーグ測度の基本性質 {#meas:lebesgue-basic keywords="Lebesgue measure extends volume of boxes; L_n is the completion of the Borel sigma-algebra; lambda is the unique measure on Borel sets with lambda(box) = volume; countable sets are null; open nonempty sets have positive measure; compact sets have finite measure; closed and open boxes have measure equal to their volume" index="ルベーグ測度の性質|るべーぐそくどのせいしつ"}
1. $\lambda$ は $\mathcal{L}_{n}$ 上の完備な測度で、$\mathcal{B}(\mathbb{R}^{n})\subset\mathcal{L}_{n}$、$\mathcal{L}_{n}$ は $\mathcal{B}(\mathbb{R}^{n})$ の $\lambda$ による完備化。
2. $\lambda((a,b])=v((a,b])$ で、ボレル集合族上で半開直方体に体積を与える測度は $\lambda$ だけ。
3. 閉直方体・開直方体の測度はその体積。とくに 1 点は測度 $0$、可算集合は測度 $0$。
4. 空でない開集合の測度は正、有界な集合の外測度は有限。
:::

::: proof
**1・2.** \ref{meas:box-volume-premeasure} と \ref{meas:caratheodory-extension}、\ref{meas:caratheodory} から、$\lambda$ は完備な測度で $\sigma(\mathcal{S}_{n})\subset\mathcal{L}_{n}$、$\mathcal{S}_{n}$ 上で $\lambda=v$。\ref{meas:borel-generators.1} から $\sigma(\mathcal{S}_{n})=\mathcal{B}(\mathbb{R}^{n})$。$\mathbb{R}^{n}=\bigcup_{m}(-m,m]^{n}$（各々有限の体積）なので σ 有限で、一意性と完備化であることは \ref{meas:caratheodory-extension.2}, \ref{meas:caratheodory-completion.2}。

**3.** 閉直方体 $[a,b]=\bigcap_{m}(a-\frac1m\mathbf{1},b]$ は減少列で、上からの連続性（\ref{meas:measure-properties.5}）と体積の連続性から $\lambda([a,b])=v$。開直方体 $\prod(a_{k},b_{k})=\bigcup_{m}(a,b-\frac1m\mathbf{1}]$（$m$ が大きいとき）は増加列で、下からの連続性から同様。1 点は退化した閉直方体（体積 $0$）で、可算集合は可算劣加法性から。

**4.** 空でない開集合は空でない開直方体を含む。有界集合はある $(-m,m]^{n}$ に含まれる。
:::

## 正則性 {#meas:sec-lm-regularity}

::: theorem ルベーグ測度の正則性 {#meas:lebesgue-regularity keywords="outer regularity: lambda*(A) = inf lambda(U) over open U containing A; inner regularity: lambda(A) = sup lambda(K) over compact K inside A for measurable A; A is Lebesgue measurable iff for every epsilon there is an open U containing A with lambda*(U minus A) < epsilon; A = G-delta minus null set = F-sigma union null set" index="正則性（ルベーグ測度）|せいそくせいるべーぐそくど, Gδ 集合|じーでるたしゅうごう, Fσ 集合|えふしぐましゅうごう"}
1. （外正則性）任意の $A\subset\mathbb{R}^{n}$ について $\lambda^{*}(A)=\inf\{\lambda(U):U\supset A\text{ は開集合}\}$。
2. （内正則性）$A\in\mathcal{L}_{n}$ について $\lambda(A)=\sup\{\lambda(K):K\subset A\text{ はコンパクト}\}$。
3. $A\subset\mathbb{R}^{n}$ について次は同値：(a) $A\in\mathcal{L}_{n}$。(b) 任意の $\varepsilon>0$ について、開集合 $U\supset A$ で $\lambda^{*}(U\setminus A)<\varepsilon$ となるものがある。(c) $G_{\delta}$ 集合（開集合の可算共通部分）$G\supset A$ で $\lambda^{*}(G\setminus A)=0$ となるものがある。(d) $F_{\sigma}$ 集合（閉集合の可算和）$F\subset A$ で $\lambda^{*}(A\setminus F)=0$ となるものがある。
:::

::: proof
**1.** 単調性から $\le$ の逆向き（$\lambda^{*}(A)\le\lambda(U)$）は明らか。$\lambda^{*}(A)<\infty$ とし $\varepsilon>0$ をとる。被覆 $A\subset\bigcup_{j}I_{j}$, $\sum v(I_{j})\le\lambda^{*}(A)+\varepsilon$ をとり、\ref{meas:box-volume-premeasure} の Step 2 と同じく $I_{j}$ を少し大きな開直方体 $U_{j}$（$v(U_{j})\le v(I_{j})+\varepsilon2^{-j}$）に替える。$U\defeq\bigcup U_{j}$ は開集合で、$\lambda(U)\le\sum v(U_{j})\le\lambda^{*}(A)+2\varepsilon$。

**3 (a)⇒(b).** まず $\lambda(A)<\infty$ なら、1 から開集合 $U\supset A$ で $\lambda(U)<\lambda(A)+\varepsilon$ となるものがあり、$\lambda(U\setminus A)=\lambda(U)-\lambda(A)<\varepsilon$（\ref{meas:measure-properties.2}）。一般には $A_{m}\defeq A\cap(-m,m]^{n}$ に対して $\lambda(U_{m}\setminus A_{m})<\varepsilon2^{-m}$ となる開集合 $U_{m}\supset A_{m}$ をとり（可算選択公理）、$U\defeq\bigcup U_{m}$ とすると $U\setminus A\subset\bigcup(U_{m}\setminus A_{m})$ なので $\lambda(U\setminus A)<\varepsilon$。

**3 (b)⇒(c).** $\lambda^{*}(U_{k}\setminus A)<\frac1k$ となる開集合 $U_{k}\supset A$ をとり $G\defeq\bigcap U_{k}$。$\lambda^{*}(G\setminus A)\le\lambda^{*}(U_{k}\setminus A)<\frac1k$。

**3 (c)⇒(a).** $G\setminus A$ は外測度 $0$ なので可測（\ref{meas:caratheodory} の完備性）で、$A=G\setminus(G\setminus A)\in\mathcal{L}_{n}$。

**3 (a)⇔(d).** $A\in\mathcal{L}_{n}$ なら $A^{c}\in\mathcal{L}_{n}$ に (c) を使い $G\supset A^{c}$ をとって $F\defeq G^{c}$（$F_{\sigma}$）、$A\setminus F=G\setminus A^{c}$。逆に (d) なら $A=F\cup(A\setminus F)$ で両方とも可測。

**2.** $\ge$ は単調性から。まず $A$ が有界とし、閉直方体 $R\supset A$ をとる。$R\setminus A$ に 3(b) を使って開集合 $U\supset R\setminus A$, $\lambda(U)<\lambda(R\setminus A)+\varepsilon$ をとり、$K\defeq R\setminus U$（コンパクト、$K\subset A$）とすると
$$
\lambda(K)\ge\lambda(R)-\lambda(U)>\lambda(R)-\lambda(R\setminus A)-\varepsilon=\lambda(A)-\varepsilon.
$$
一般の $A$ では $A\cap[-m,m]^{n}\uparrow A$ と下からの連続性から、$\lambda(A\cap[-m,m]^{n})$ が $\lambda(A)$ に近いものをとり、その中のコンパクト集合で近似する。
:::

## 平行移動と線形写像 {#meas:sec-lm-invariance}

::: theorem 平行移動不変な測度の一意性 {#meas:translation-invariant-unique keywords="a translation-invariant measure on the Borel sets of R^n which is finite on (0,1]^n is a constant multiple of Lebesgue measure; Lebesgue measure is translation invariant" index="平行移動不変性|へいこういどうふへんせい, ルベーグ測度の一意性|るべーぐそくどのいちいせい"}
1. $\lambda$ は平行移動不変：$A\in\mathcal{L}_{n}$, $x\in\mathbb{R}^{n}$ なら $A+x\in\mathcal{L}_{n}$ で $\lambda(A+x)=\lambda(A)$。
2. $\mu$ を $\mathcal{B}(\mathbb{R}^{n})$ 上の測度で、すべての平行移動で不変かつ $c\defeq\mu((0,1]^{n})<\infty$ とすると、$\mathcal{B}(\mathbb{R}^{n})$ 上で $\mu=c\lambda$。
:::

::: proof
**1.** 直方体の平行移動は直方体で体積は同じなので、$\lambda^{*}$ の定義の被覆を平行移動して $\lambda^{*}(A+x)=\lambda^{*}(A)$。カラテオドリの条件は $E\mapsto E+x$ で保たれるので（$(E+x)\cap(A+x)=(E\cap A)+x$）、$\mathcal{L}_{n}$ も平行移動で保たれる。

**2.** $(0,1]^{n}$ は、$k\in\{0,\dots,m-1\}^{n}$ についての $m^{n}$ 個の互いに素な $\frac{k}{m}+(0,\frac1m]^{n}$ の和なので、平行移動不変性と加法性から $\mu((0,\frac1m]^{n})=cm^{-n}$。端点がすべて $\frac1m\mathbb{Z}$ に属する半開直方体 $(a,b]$ は、$\prod_{k}m(b_{k}-a_{k})$ 個の $(0,\frac1m]^{n}$ の平行移動の互いに素な和なので $\mu((a,b])=c\,v((a,b])$。有理数の端点をもつ半開直方体は、端点の分母の公倍数 $m$ についてこの形なので、$\mathcal{I}_{n}^{\mathbb{Q}}\cup\{\varnothing\}$（π 系、\ref{meas:borel-generators.2} から $\mathcal{B}(\mathbb{R}^{n})$ を生成）の上で $\mu=c\lambda$。$X_{m}\defeq(-m,m]^{n}$ について $c\lambda(X_{m})<\infty$ なので、\ref{meas:measure-uniqueness} から $\mu=c\lambda$。
:::

::: theorem 線形写像と測度 {#meas:lebesgue-linear keywords="for a linear map T of R^n and a Lebesgue measurable A, TA is Lebesgue measurable and lambda(TA) = |det T| lambda(A); proof via elementary matrices and a cut-and-translate argument for shears" index="線形写像と測度|せんけいしゃぞうとそくど, 行列式と体積（測度論）|ぎょうれつしきとたいせきそくどろん"}
$T\in M_{n}(\mathbb{R})$、$A\in\mathcal{L}_{n}$ なら $TA\in\mathcal{L}_{n}$ で $\lambda(TA)=|\det T|\lambda(A)$。
:::

::: proof
**Step 1（可逆な $T$ の比例定数）.** $T$ が可逆なら $T$ は同相写像で、$\mathcal{B}$ を $\mathcal{B}$ に写す（$\{B:TB\in\mathcal{B}\}$ は開集合を含む σ-加法族）。$\nu_{T}(B)\defeq\lambda(TB)$ はボレル集合族上の測度で、$T(B+x)=TB+Tx$ と \ref{meas:translation-invariant-unique.1} から平行移動不変、$T((0,1]^{n})$ は有界なので $\nu_{T}((0,1]^{n})<\infty$。\ref{meas:translation-invariant-unique.2} から $\lambda(TB)=c(T)\lambda(B)$（$B\in\mathcal{B}$）、$c(T)\defeq\lambda(T((0,1]^{n}))$。$TT'B=T(T'B)$ から $c(TT')=c(T)c(T')$。

**Step 2（対角と置換）.** $D_{i}(a)$（第 $i$ 座標を $a\neq0$ 倍）は $(0,1]^{n}$ を、第 $i$ 成分が $(0,a]$ または $[a,0)$ の直方体に写すので $c(D_{i}(a))=|a|$（\ref{meas:lebesgue-basic.3}）。$P_{ij}$（座標の入れ替え）は $(0,1]^{n}$ を保つので $c(P_{ij})=1$。

**Step 3（ずらし）.** $T_{ij}(1)$（$i\neq j$、$x_{i}\mapsto x_{i}+x_{j}$）について、$Q\defeq[0,1)^{n}$（$\lambda(Q)=1$）の像は
$$
P\defeq T_{ij}(1)Q=\{y:0\le y_{j}<1,\ y_{j}\le y_{i}<y_{j}+1,\ 0\le y_{k}<1\ (k\neq i,j)\}.
$$
$P_{1}\defeq P\cap\{y_{i}<1\}$, $P_{2}\defeq P\cap\{y_{i}\ge1\}$ とおくと（ボレル集合）、$P_{2}-e_{i}=\{0\le y_{i}<y_{j}\}\cap(\text{他の条件})$ で、$P_{1}\sqcup(P_{2}-e_{i})=Q$。平行移動不変性から $c(T_{ij}(1))=\lambda(P)=\lambda(P_{1})+\lambda(P_{2})=\lambda(Q)=1$。$c\neq0$ について $T_{ij}(c)=D_{j}(c)^{-1}T_{ij}(1)D_{j}(c)$（$x_{j}$ を $c$ 倍してから $x_{i}$ に加え、$x_{j}$ を戻す）なので、乗法性から $c(T_{ij}(c))=1$。

**Step 4（可逆な場合の結論）.** 可逆な $T$ は基本行列の積（\ref{lin:inverse-elimination}）で、Step 2・3 と \ref{lin:det-special-matrices.3}、\ref{lin:det-multiplicative} から $c(T)=|\det T|$（両辺とも乗法的で、基本行列で一致）。$A\in\mathcal{L}_{n}$ については、$A=B\cup N$（$B\in\mathcal{B}$、$N$ はボレル零集合 $Z$ の部分集合、\ref{meas:lebesgue-basic.1}）と書くと $TA=TB\cup TN$、$TN\subset TZ$、$\lambda(TZ)=0$ なので $TA\in\mathcal{L}_{n}$、$\lambda(TA)=\lambda(TB)=|\det T|\lambda(A)$。

**Step 5（可逆でない場合）.** $\operatorname{rank}T<n$ なら、簡約階段形（\ref{lin:rref-existence-uniqueness}）から、可逆な $R$ で $RT$ の第 $n$ 行が $0$ となるものがある。$RT(\mathbb{R}^{n})\subset H\defeq\{y_{n}=0\}$ で、$H\subset\bigcup_{m}(-m,m]^{n-1}\times(-\varepsilon2^{-m}m^{1-n},\varepsilon2^{-m}m^{1-n}]$ から $\lambda(H)\le\sum_{m}(2m)^{n-1}\cdot2\varepsilon2^{-m}m^{1-n}=2^{n}\varepsilon$、よって $\lambda(H)=0$。$TA\subset R^{-1}H$ で、Step 4 から $\lambda(R^{-1}H)=|\det R^{-1}|\cdot0=0$。完備性から $TA\in\mathcal{L}_{n}$、$\lambda(TA)=0=|\det T|\lambda(A)$。

::: hypcheck
- Step 1 で、平行移動不変な測度の一意性（\ref{meas:translation-invariant-unique}）に、$T$ が平行移動と可換に振る舞うこと（線形性）を使った。非線形の微分同相写像については局所的な線形近似が必要になる（変数変換公式。積分の系列で扱う予定）。
- Step 3 は「切って平行移動して貼る」議論で、フビニの定理を使わない。
:::
:::

::: proposition ジョルダン測度との一致 {#meas:jordan-lebesgue keywords="a Jordan measurable set is Lebesgue measurable and its Jordan volume equals its Lebesgue measure" index="ジョルダン測度とルベーグ測度|じょるだんそくどとるべーぐそくど"}
ジョルダン可測な $E\subset\mathbb{R}^{n}$ は $\mathcal{L}_{n}$ に属し、$\lambda(E)$ はジョルダン測度 $v(E)$（\ref{calc:jordan-measurable}）に等しい。
:::

::: proof
$E\subset R$（閉直方体）とし、$R$ の分割 $P$ をとる。$P$ の小直方体（閉）$Q$ について、$\inf_{Q}\chi_{E}=1\iff Q\subset E$、$\sup_{Q}\chi_{E}=1\iff Q\cap E\neq\varnothing$ なので、下和と上和は
$$
L(\chi_{E},P)=\sum_{Q\subset E}v(Q),\qquad U(\chi_{E},P)=\sum_{Q\cap E\neq\varnothing}v(Q).
$$
小直方体の内部 $Q^{\circ}$ は互いに素で、$\lambda(Q^{\circ})=\lambda(Q)=v(Q)$（\ref{meas:lebesgue-basic.3}）。$F_{P}\defeq\bigsqcup_{Q\subset E}Q^{\circ}\subset E$、$G_{P}\defeq\bigcup_{Q\cap E\neq\varnothing}Q\supset E$（小直方体は $R$ を覆う）とすると $\lambda(F_{P})=L(\chi_{E},P)$, $\lambda(G_{P})\le U(\chi_{E},P)$。$\chi_{E}$ は積分可能なので、分割 $P_{k}$ で $U(\chi_{E},P_{k})-L(\chi_{E},P_{k})<\frac1k$ となるものがある（\ref{calc:box-riemann-criterion}）。$F\defeq\bigcup_{k}F_{P_{k}}$, $G\defeq\bigcap_{k}G_{P_{k}}$ はボレル集合で $F\subset E\subset G$、$\lambda(G\setminus F)\le\lambda(G_{P_{k}})-\lambda(F_{P_{k}})<\frac1k$。よって $E\setminus F$ は零集合の部分集合で、完備性から $E\in\mathcal{L}_{n}$、$\lambda(E)=\lambda(F)$。$L(\chi_{E},P_{k})\le\lambda(F)\le\lambda(G)\le U(\chi_{E},P_{k})$ で両端は $v(E)$ に収束するので $\lambda(E)=v(E)$。
:::

## カントール集合と非可測集合 {#meas:sec-lm-examples}

::: example カントール集合 {#meas:cantor-set keywords="the middle-thirds Cantor set is compact, uncountable and has Lebesgue measure zero" index="カントール集合|かんとーるしゅうごう"}
$C_{0}\defeq[0,1]$ とし、$C_{k}$ を $C_{k-1}$ の各閉区間から中央の開区間（長さの $\frac13$）を除いたものとする。$C_{k}$ は長さ $3^{-k}$ の $2^{k}$ 個の閉区間の和で、$C\defeq\bigcap_{k}C_{k}$（**カントール集合**）はコンパクトで非可算、$\lambda(C)=0$。
:::

::: proof
**測度.** $\lambda(C)\le\lambda(C_{k})=(2/3)^{k}\to0$。

**非可算.** 列 $d=(d_{k})\in\{0,2\}^{\mathbb{N}}$ に $x(d)\defeq\sum_{k\ge1}d_{k}3^{-k}$ を対応させる。$C_{k}$ の区間は、左端が $\sum_{i\le k}d_{i}3^{-i}$（$d_{i}\in\{0,2\}$）、長さ $3^{-k}$ の区間 $[\sum_{i\le k}d_{i}3^{-i},\sum_{i\le k}d_{i}3^{-i}+3^{-k}]$ であることが帰納法でわかる（中央を除くと、左端 $+0\cdot3^{-k-1}$ と $+2\cdot3^{-k-1}$ の二つが残る）。$x(d)$ の第 $k$ 部分和以降の項の和は $\le\sum_{i>k}2\cdot3^{-i}=3^{-k}$ なので、$x(d)$ は各 $C_{k}$ に属し、$x(d)\in C$。$d\ne d'$ で最初に異なる番号を $k$ とすると $|x(d)-x(d')|\ge2\cdot3^{-k}-\sum_{i>k}2\cdot3^{-i}=3^{-k}>0$ なので単射。$\{0,2\}^{\mathbb{N}}$ は $\mathcal{P}(\mathbb{N})$ と全単射（$d\mapsto\{k:d_{k}=2\}$）で、\ref{set:cantor} から非可算。
:::

::: theorem ヴィタリの集合 {#meas:vitali keywords="with the axiom of choice there is a subset of [0,1) which is not Lebesgue measurable: a set of representatives of R/Q" index="ヴィタリの集合|う゛ぃたりのしゅうごう, 非可測集合|ひかそくしゅうごう"}
（選択公理を仮定する。）$[0,1)$ の部分集合でルベーグ可測でないものがある。
:::

::: proof
$x\sim y\iff x-y\in\mathbb{Q}$ は $[0,1)$ 上の同値関係。選択公理で各同値類から一つずつ元を選んだ集合を $V$ とする。$q\in\mathbb{Q}\cap(-1,1)$ について $V+q\subset[-1,2)$ で、
- **互いに素**：$v+q=v'+q'$（$v,v'\in V$）なら $v\sim v'$ で、$V$ は各類から一つなので $v=v'$、$q=q'$。
- **$[0,1)$ を覆う**：$x\in[0,1)$ について $x\sim v$ となる $v\in V$ があり、$q\defeq x-v\in\mathbb{Q}\cap(-1,1)$ で $x\in V+q$。

$V$ が可測なら、平行移動不変性（\ref{meas:translation-invariant-unique.1}）と可算加法性から
$$
1=\lambda([0,1))\le\sum_{q\in\mathbb{Q}\cap(-1,1)}\lambda(V+q)=\sum_{q}\lambda(V)\le\lambda([-1,2))=3.
$$
$\lambda(V)=0$ なら中央の和は $0$、$\lambda(V)>0$ なら $\infty$ で、どちらも矛盾。

::: hypcheck
- **選択公理**：$V$ の構成に本質的に使う。選択公理を除いた ZF に従属選択公理を加えた体系では、「すべての実数の部分集合がルベーグ可測」が無矛盾であること（ソロヴェイ、到達不能基数の存在の無矛盾性を仮定）が知られている。
- **平行移動不変性**と **$0<\lambda([0,1))<\infty$** を使った。したがって、すべての部分集合に定義された平行移動不変な可算加法的測度で $[0,1)$ に正の有限値を与えるものは存在しない。
:::
:::

::: supplement
**ルベーグ可測でボレルでない集合.** ボレル集合の全体の濃度は連続体濃度 $\mathfrak{c}$ だが、カントール集合 $C$ の部分集合はすべて零集合の部分集合としてルベーグ可測で、その個数は $2^{\mathfrak{c}}>\mathfrak{c}$ なので、ルベーグ可測だがボレルでない集合がある（ボレル集合族の濃度の計算には超限帰納法を使う。知られている）。

**高い視点：ハール測度.** $\mathbb{R}^{n}$ は加法について局所コンパクト群で、ルベーグ測度は「平行移動不変で、コンパクト集合に有限値、開集合に正の値をとる正則なボレル測度」として定数倍を除いて一意である（\ref{meas:translation-invariant-unique}）。一般の局所コンパクト群にも、左移動で不変なこの種の測度（**ハール測度**）が定数倍を除いて一意に存在することが知られている。線形写像の定理は、$\mathrm{GL}(n,\mathbb{R})$ が $\mathbb{R}^{n}$ に作用するとき、ハール測度の「伸び率」が群準同型 $|\det|\colon\mathrm{GL}(n,\mathbb{R})\to\mathbb{R}_{>0}$ で与えられる、という形に読める（\ref{meas:lebesgue-linear} の Step 1 の $c(TT')=c(T)c(T')$）。比喩で言えば、ルベーグ測度は「どこへ動かしても同じ目盛りの物差し」で、その目盛りは小さな立方体の体積を決めた瞬間に、平行移動の対称性だけで空間全体に一通りに広がる。
:::

## 問題 {#meas:sec-lm-problems}

::: problem {#meas:prob-lm-dense-open}
任意の $\varepsilon>0$ について、$\mathbb{R}$ の稠密な開集合 $U$ で $\lambda(U)<\varepsilon$ となるものがあることを示せ。その補集合は、空でない開区間を含まないが正の（無限の）測度をもつ閉集合である。
:::

::: solution
$\mathbb{Q}=\{q_{1},q_{2},\dots\}$ と数え上げ、$U\defeq\bigcup_{k}(q_{k}-\varepsilon2^{-k-2},q_{k}+\varepsilon2^{-k-2})$ とする。$U$ は開集合で $\mathbb{Q}$ を含むので稠密、劣加法性から $\lambda(U)\le\sum_{k}\varepsilon2^{-k-1}=\varepsilon/2<\varepsilon$。補集合 $U^{c}$ は閉集合で、開区間を含めば $U$ の稠密性に反する。$\lambda(U^{c})=\infty$（$\lambda(\mathbb{R})=\infty$ で $\lambda(U)<\infty$）。
:::

::: problem {#meas:prob-lm-ellipsoid}
$a_{1},\dots,a_{n}>0$ について、楕円体 $E\defeq\{x:\sum_{k}x_{k}^{2}/a_{k}^{2}\le1\}$ の測度が $a_{1}\cdots a_{n}\lambda(B)$（$B$ は閉単位球）であることを示せ。
:::

::: solution
$T\defeq\operatorname{diag}(a_{1},\dots,a_{n})$ について $E=TB$（$x\in E\iff T^{-1}x\in B$）。$B$ は閉集合なのでボレル集合で、\ref{meas:lebesgue-linear} から $\lambda(E)=|\det T|\lambda(B)=a_{1}\cdots a_{n}\lambda(B)$。
:::

::: problem {#meas:prob-lm-rational}
$\mathbb{Q}$ の部分集合族 $\mathcal{S}_{\mathbb{Q}}\defeq\{(a,b]\cap\mathbb{Q}:a\le b\text{ は実数}\}$ は半環で、$\ell((a,b]\cap\mathbb{Q})\defeq b-a$ は well-defined だが前測度でないことを示せ。（ヒント：\ref{meas:prob-lm-dense-open} の開集合 $U\supset\mathbb{Q}$ の連結成分を使う。）
:::

::: solution
**半環と well-defined.** 半環であることは \ref{meas:semiring} の例 1 を $\mathbb{Q}$ に制限すればよい。$a<b$ なら $(a,b]\cap\mathbb{Q}$ の下限は $a$、$b$ は「上限、かつ $b$ が有理数なら最大元」で、$b$ が無理数でも上限として決まるので、$a$, $b$ は集合から決まり $\ell$ は well-defined（空集合は $a=b$ の場合だけで長さ $0$）。

**前測度でない.** \ref{meas:prob-lm-dense-open} から開集合 $U\supset\mathbb{Q}$ で $\lambda(U)<\frac12$ となるものをとる。$U\cap(0,1)$ の連結成分は互いに素な開区間で、可算個（各成分が有理数を含む）。成分の端点 $c$ が $(0,1)$ の点なら $c\notin U$ なので無理数。$0,1\in U$ なので、$U$ の $0$ を含む成分 $(c_{0},d_{0})$ と $1$ を含む成分 $(c_{1},d_{1})$ について、$d_{0}$, $c_{1}$ も無理数（$d_{0}\notin U$）。$(0,1]\cap\mathbb{Q}$ の各点は $U$ に属するので、ちょうど一つの成分に属する。したがって
$$
(0,1]\cap\mathbb{Q}=\bigl((0,d_{0}]\cap\mathbb{Q}\bigr)\sqcup\bigsqcup_{j}\bigl((c_{j},d_{j}]\cap\mathbb{Q}\bigr)\sqcup\bigl((c_{1},1]\cap\mathbb{Q}\bigr)
$$
（中央は $(0,1)$ に含まれる成分 $(c_{j},d_{j})$ たちで、端点が無理数なので $(c_{j},d_{j})\cap\mathbb{Q}=(c_{j},d_{j}]\cap\mathbb{Q}$。$0$ と $1$ を含む成分が同じなら一つの項にまとめる）。右辺の長さの和は $\lambda(U)<\frac12$ 以下だが、左辺の長さは $1$。よって $\ell$ は可算加法的でない。実数直線との違いは、$[0,1]$ のコンパクト性（\ref{meas:box-volume-premeasure} の Step 2）が $\mathbb{Q}$ では使えないことにある。
:::
