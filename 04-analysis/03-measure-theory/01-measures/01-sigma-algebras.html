# σ-加法族と測度 {#meas:page-sigma-algebras keywords="sigma-algebra, measurable space, generated sigma-algebra, Borel sets, generators of the Borel sigma-algebra of R^n, measure, counting measure, Dirac measure, monotonicity, countable subadditivity, continuity from below and above, sigma-finite, null set, complete measure, completion, pi-system, Dynkin system, pi-lambda theorem, uniqueness of measures, sums in [0, infinity], Borel-Cantelli"}

ジョルダン可測集合の体積（\ref{calc:jordan-measurable}）は有限加法的だが、可算個の集合の和に対しては振る舞いが悪い（$[0,1]$ の有理数の全体はジョルダン可測でない）。**測度論**は、「可算個の操作で閉じた集合族」と「その上の可算加法的な関数」を基本に据えることでこの問題を解決する。このページでは、その二つの基本概念である **σ-加法族**と**測度**を定義し、基本性質、完備化、そして「生成元の上で一致する二つの測度は一致する」という一意性定理（π-λ 定理による）を示す。測度の**存在**（とくにルベーグ測度）は次のページ以降で扱う。

## 記法と定義の確認 {#meas:sec-sa-notation}

::: notation
- 集合 $X$ の部分集合 $A$ の補集合を $A^{c}\defeq X\setminus A$ と書く。$\mathcal{P}(X)$ は $X$ の冪集合。
- $[0,\infty]\defeq[0,\infty)\cup\{\infty\}$ に、順序 $a\le\infty$ と演算 $a+\infty=\infty+a=\infty$ を入れる。$[0,\infty]$ の任意の部分集合は上限をもつ。
- 列 $A_{1}\subset A_{2}\subset\cdots$ で $A=\bigcup_{n}A_{n}$ のとき $A_{n}\uparrow A$、$A_{1}\supset A_{2}\supset\cdots$ で $A=\bigcap_{n}A_{n}$ のとき $A_{n}\downarrow A$ と書く。
- 位相空間・開集合・基底は \ref{top:topological-space}, \ref{top:base}、第二可算性は \ref{top:second-countable}。
- **選択公理**：このページでは使わない。
:::

## $[0,\infty]$ の中の和 {#meas:sec-sa-sums}

::: definition $[0,\infty]$ の中の和 {#meas:extended-sums keywords="sum of a family in [0, infinity] over a countable index set as the supremum of finite partial sums; independent of order; associativity for double sums" index="非負の和（測度論）|ひふのわそくどろん"}
可算集合 $I$ と $a_{i}\in[0,\infty]$（$i\in I$）について
$$
\sum_{i\in I}a_{i}\defeq\sup\Bigl\{\sum_{i\in F}a_{i}:F\subset I\text{ は有限}\Bigr\}\in[0,\infty]
$$
と定める。$I=\mathbb{N}$ のとき、これは部分和 $\sum_{i\le n}a_{i}$ の極限（単調増加なので $[0,\infty]$ の中で存在）に等しい。
:::

::: lemma 非負の和の性質 {#meas:extended-sums-properties keywords="sums in [0, infinity] do not depend on the enumeration; sum over a disjoint union of index sets is the iterated sum; monotone limits commute with sums" index="非負の和の性質|ひふのわのせいしつ"}
1. 全単射 $\pi\colon\mathbb{N}\to I$ について $\sum_{i\in I}a_{i}=\lim_{n\to\infty}\sum_{k\le n}a_{\pi(k)}$。とくに和は並べ方によらない。
2. $I=\bigsqcup_{j\in J}I_{j}$（$J$ も可算）なら $\sum_{i\in I}a_{i}=\sum_{j\in J}\sum_{i\in I_{j}}a_{i}$。
3. 各 $i$ で $a_{i}^{(n)}\uparrow a_{i}$（$n\to\infty$、単調増加の極限）なら $\sum_{i}a_{i}^{(n)}\uparrow\sum_{i}a_{i}$。
:::

::: proof
**1.** $s_{n}\defeq\sum_{k\le n}a_{\pi(k)}$ は単調増加で、各 $s_{n}$ はある有限集合 $F=\pi(\{1,\dots,n\})$ の上の和なので $\lim s_{n}\le\sum_{I}$。逆に有限集合 $F\subset I$ について $n\ge\max\pi^{-1}(F)$ なら $\sum_{F}\le s_{n}$ なので $\sum_{F}\le\lim s_{n}$、上限をとって $\sum_{I}\le\lim s_{n}$。

**2.** 右辺を $S$ とする。有限集合 $F\subset I$ について、$F$ が交わる $j$ は有限個で、$\sum_{F}a_{i}=\sum_{j}\sum_{F\cap I_{j}}a_{i}\le\sum_{j}\sum_{I_{j}}a_{i}=S$。よって左辺 $\le S$。逆に、有限集合 $G\subset J$ と、各 $j\in G$ の有限集合 $F_{j}\subset I_{j}$ について $\sum_{j\in G}\sum_{F_{j}}a_{i}=\sum_{\bigcup F_{j}}a_{i}\le$ 左辺。$F_{j}$ について上限をとり（有限個の和なので各項ごとに上限をとれる）、次に $G$ について上限をとれば $S\le$ 左辺。

**3.** $\sum_{i}a_{i}^{(n)}$ は $n$ について単調増加で $\sum_{i}a_{i}$ 以下なので、極限 $L$ は $\le\sum a_{i}$。有限集合 $F$ について $\sum_{F}a_{i}=\lim_{n}\sum_{F}a_{i}^{(n)}\le L$（有限和は極限と交換する。値が $\infty$ の項があっても、その項は $n$ が大きいとき任意に大きい）。上限をとって $\sum a_{i}\le L$。
:::

## σ-加法族 {#meas:sec-sa-sigma-algebras}

::: definition σ-加法族と可測空間 {#meas:sigma-algebra keywords="sigma-algebra: contains X, closed under complements and countable unions; measurable space; measurable sets" index="σ-加法族|しぐまかほうぞく, 可測空間|かそくくうかん, 可測集合|かそくしゅうごう"}
集合 $X$ の部分集合族 $\mathcal{M}\subset\mathcal{P}(X)$ が次を満たすとき、**σ-加法族**（σ-代数）という。
1. $X\in\mathcal{M}$。
2. $A\in\mathcal{M}$ なら $A^{c}\in\mathcal{M}$。
3. $A_{1},A_{2},\dots\in\mathcal{M}$ なら $\bigcup_{n}A_{n}\in\mathcal{M}$。

組 $(X,\mathcal{M})$ を**可測空間**、$\mathcal{M}$ の元を**可測集合**という。
:::

::: proposition σ-加法族の基本性質 {#meas:sigma-algebra-properties keywords="a sigma-algebra contains the empty set and is closed under finite unions, countable intersections, differences, symmetric differences, limsup and liminf" index="σ-加法族の性質|しぐまかほうぞくのせいしつ"}
σ-加法族 $\mathcal{M}$ は $\varnothing$ を含み、有限個の和、可算個の共通部分、差 $A\setminus B$、および $\limsup A_{n}\defeq\bigcap_{m}\bigcup_{n\ge m}A_{n}$, $\liminf A_{n}\defeq\bigcup_{m}\bigcap_{n\ge m}A_{n}$ で閉じている。
:::

::: proof
$\varnothing=X^{c}$。有限和は $A_{n}=\varnothing$（$n>N$）とおいて 3 から。$\bigcap A_{n}=\bigl(\bigcup A_{n}^{c}\bigr)^{c}$。$A\setminus B=A\cap B^{c}$。$\limsup$, $\liminf$ は可算和と可算共通部分の組合せ。
:::

::: definition 生成された σ-加法族とボレル集合族 {#meas:generated-sigma-algebra keywords="sigma-algebra generated by a family of sets: intersection of all sigma-algebras containing it; Borel sigma-algebra of a topological space generated by the open sets; Borel sets" index="生成された σ-加法族|せいせいされたしぐまかほうぞく, ボレル集合族|ぼれるしゅうごうぞく, ボレル集合|ぼれるしゅうごう"}
1. $\mathcal{E}\subset\mathcal{P}(X)$ について、$\mathcal{E}$ を含むすべての σ-加法族の共通部分を $\sigma(\mathcal{E})$ と書き、$\mathcal{E}$ が**生成する σ-加法族**という。
2. 位相空間 $X$ の開集合全体が生成する σ-加法族を $\mathcal{B}(X)$ と書き、**ボレル集合族**、その元を**ボレル集合**という。
:::

::: proposition 生成の性質 {#meas:generated-properties keywords="sigma(E) is the smallest sigma-algebra containing E; if E is contained in F then sigma(E) is contained in sigma(F); if E is contained in sigma(F) then sigma(E) is contained in sigma(F)" index="生成の性質（σ-加法族）|せいせいのせいしつしぐまかほうぞく"}
1. $\sigma(\mathcal{E})$ は σ-加法族で、$\mathcal{E}$ を含む σ-加法族のうち最小のもの。
2. $\mathcal{E}\subset\sigma(\mathcal{F})$ なら $\sigma(\mathcal{E})\subset\sigma(\mathcal{F})$。
:::

::: proof
**1.** $\mathcal{P}(X)$ は $\mathcal{E}$ を含む σ-加法族なので、共通部分をとる族は空でない。定義の 1〜3 はどれも「すべての $\mathcal{M}$ について成り立てば共通部分でも成り立つ」形なので、共通部分は σ-加法族。$\mathcal{E}$ を含む σ-加法族 $\mathcal{M}$ は共通部分をとる族の一員なので $\sigma(\mathcal{E})\subset\mathcal{M}$。

**2.** $\sigma(\mathcal{F})$ は $\mathcal{E}$ を含む σ-加法族なので、1 から。
:::

::: proposition $\mathbb{R}^{n}$ のボレル集合族の生成元 {#meas:borel-generators keywords="the Borel sigma-algebra of R^n is generated by half-open boxes (a,b] with rational or real corners, by open boxes, by closed sets, by compact sets" index="ボレル集合族の生成元|ぼれるしゅうごうぞくのせいせいげん"}
$\mathbb{R}^{n}$ の次の族はどれも $\mathcal{B}(\mathbb{R}^{n})$ を生成する。
1. 半開直方体 $(a,b]\defeq\prod_{k=1}^{n}(a_{k},b_{k}]$（$a_{k}<b_{k}$ は実数）の全体 $\mathcal{I}_{n}$。
2. $a_{k},b_{k}$ を有理数に限った半開直方体の全体 $\mathcal{I}_{n}^{\mathbb{Q}}$。
3. 開直方体 $\prod(a_{k},b_{k})$ の全体。
4. 閉集合の全体。
:::

::: proof
$\mathcal{O}$ を開集合全体とする。各族が $\sigma(\mathcal{O})$ に含まれ、かつ $\mathcal{O}$ が各族の生成する σ-加法族に含まれることを示せば、\ref{meas:generated-properties.2} から生成する σ-加法族は等しい。

**Step 1（各族はボレル集合）.** 開直方体は開集合。閉集合は開集合の補集合。半開直方体は
$$
\prod_{k}(a_{k},b_{k}]=\bigcap_{m\ge1}\prod_{k}\Bigl(a_{k},b_{k}+\frac1m\Bigr)
$$
と開直方体の可算共通部分で書けるのでボレル集合。

**Step 2（開集合は有理数の半開直方体の可算和）.** $U$ を開集合、$x\in U$ とする。$\varepsilon>0$ を $\prod_{k}(x_{k}-2\varepsilon,x_{k}+2\varepsilon)\subset U$ となるようにとり、各 $k$ で有理数 $a_{k}\in(x_{k}-2\varepsilon,x_{k}-\varepsilon)$, $b_{k}\in(x_{k},x_{k}+\varepsilon)$ をとると、$x\in\prod(a_{k},b_{k}]\subset U$。よって $U$ は、$U$ に含まれる $\mathcal{I}_{n}^{\mathbb{Q}}$ の元の和で、$\mathcal{I}_{n}^{\mathbb{Q}}$ は可算集合（有理数の $2n$ 組で添字づけられる）なので、この和は可算和。したがって $\mathcal{O}\subset\sigma(\mathcal{I}_{n}^{\mathbb{Q}})\subset\sigma(\mathcal{I}_{n})$。

**Step 3（開直方体と閉集合）.** Step 2 と同じ議論で、開集合は有理数の端点をもつ開直方体の可算和（$x\in\prod(a_{k},b_{k})$ となるようにとればよい）。閉集合の族が生成する σ-加法族は補集合として開集合を含む。

**Step 4（結論）.** Step 1 から各族 $\subset\sigma(\mathcal{O})$、Step 2・3 から $\mathcal{O}\subset\sigma(\text{各族})$。

::: hypcheck
- Step 2 で、可算個の生成元で開集合が書けること（$\mathbb{R}^{n}$ の第二可算性、\ref{top:second-countable}）を使った。第二可算でない空間では、「開集合の基底」が生成する σ-加法族はボレル集合族より小さいことがある（基底の元の非可算和は σ-加法族の操作で作れない）。
- 選択公理は使っていない（有理数は数え上げを一つ固定できる）。
:::
:::

## 測度 {#meas:sec-sa-measures}

::: definition 測度と測度空間 {#meas:measure keywords="measure: countably additive function from a sigma-algebra to [0, infinity] with mu(empty)=0; measure space; finite, sigma-finite, probability measures; counting measure; Dirac measure" index="測度|そくど, 測度空間|そくどくうかん, σ-有限|しぐまゆうげん, 有限測度|ゆうげんそくど, 確率測度|かくりつそくど, 数え上げ測度|かぞえあげそくど, ディラック測度|でぃらっくそくど"}
可測空間 $(X,\mathcal{M})$ 上の**測度**とは、写像 $\mu\colon\mathcal{M}\to[0,\infty]$ で
1. $\mu(\varnothing)=0$、
2. （**可算加法性**）互いに素な $A_{1},A_{2},\dots\in\mathcal{M}$ について $\mu\bigl(\bigsqcup_{n}A_{n}\bigr)=\sum_{n}\mu(A_{n})$

を満たすものをいう。$(X,\mathcal{M},\mu)$ を**測度空間**という。$\mu(X)<\infty$ なら**有限**、$\mu(X)=1$ なら**確率測度**、$X=\bigcup_{n}X_{n}$, $X_{n}\in\mathcal{M}$, $\mu(X_{n})<\infty$ と書けるなら **σ-有限**という。
:::

::: example
1. **数え上げ測度**：$\mathcal{M}=\mathcal{P}(X)$、$\mu(A)\defeq\#A$（有限集合なら元の個数、無限集合なら $\infty$）。可算加法性は、和集合が有限なら有限個の項を除いて空で個数の和、無限なら和の中に無限集合があるか無限個の項が空でない（各 $\ge1$）ので両辺 $\infty$。
2. **ディラック測度**：$x\in X$ について $\delta_{x}(A)\defeq1$（$x\in A$）、$0$（$x\notin A$）。互いに素な列のうち $x$ を含むものは高々一つなので可算加法的。
3. **重みつきの点測度**：$w\colon X\to[0,\infty]$ について $\mu(A)\defeq\sum_{x\in A}w(x)$（有限部分和の上限）。可算加法性は \ref{meas:extended-sums-properties.2} と同様（非可算個の添字でも、有限部分和の上限の定義で同じ議論が通る）。
4. 測度 $\mu$ と $E\in\mathcal{M}$ について、$\mu_{E}(A)\defeq\mu(A\cap E)$ は測度（**制限**）。
:::

::: proposition 測度の基本性質 {#meas:measure-properties keywords="properties of measures: finite additivity, monotonicity, subtractivity, countable subadditivity, continuity from below, continuity from above under finiteness, inclusion-exclusion" index="測度の基本性質|そくどのきほんせいしつ, 劣加法性|れつかほうせい, 測度の連続性|そくどのれんぞくせい"}
$(X,\mathcal{M},\mu)$ を測度空間、集合はすべて $\mathcal{M}$ の元とする。
1. （有限加法性）互いに素な $A,B$ について $\mu(A\sqcup B)=\mu(A)+\mu(B)$。
2. （単調性）$A\subset B$ なら $\mu(A)\le\mu(B)$。さらに $\mu(A)<\infty$ なら $\mu(B\setminus A)=\mu(B)-\mu(A)$。
3. （可算劣加法性）$\mu\bigl(\bigcup_{n}A_{n}\bigr)\le\sum_{n}\mu(A_{n})$。
4. （下からの連続性）$A_{n}\uparrow A$ なら $\mu(A_{n})\uparrow\mu(A)$。
5. （上からの連続性）$A_{n}\downarrow A$ で $\mu(A_{1})<\infty$ なら $\mu(A_{n})\downarrow\mu(A)$。
6. $\mu(A\cup B)+\mu(A\cap B)=\mu(A)+\mu(B)$。
:::

::: proof
**1.** $A_{1}=A$, $A_{2}=B$, $A_{n}=\varnothing$（$n\ge3$）に可算加法性を使う（$\mu(\varnothing)=0$）。

**2.** $B=A\sqcup(B\setminus A)$ なので 1 から $\mu(B)=\mu(A)+\mu(B\setminus A)\ge\mu(A)$。$\mu(A)<\infty$ なら両辺から $\mu(A)$ を引ける。

**3.** $B_{1}\defeq A_{1}$, $B_{n}\defeq A_{n}\setminus\bigcup_{k<n}A_{k}$ とおくと、$B_{n}$ は互いに素で、$B_{n}\subset A_{n}$、$\bigcup_{n}B_{n}=\bigcup_{n}A_{n}$（$x$ を含む最小の添字 $n$ について $x\in B_{n}$）。可算加法性と 2 から $\mu(\bigcup A_{n})=\sum\mu(B_{n})\le\sum\mu(A_{n})$。

**4.** $A_{0}\defeq\varnothing$, $B_{n}\defeq A_{n}\setminus A_{n-1}$ とおくと、$B_{n}$ は互いに素で $A_{n}=\bigsqcup_{k\le n}B_{k}$、$A=\bigsqcup_{k}B_{k}$。よって $\mu(A)=\sum_{k}\mu(B_{k})=\lim_{n}\sum_{k\le n}\mu(B_{k})=\lim_{n}\mu(A_{n})$。

**5.** $A_{1}\setminus A_{n}\uparrow A_{1}\setminus A$ なので 4 から $\mu(A_{1}\setminus A_{n})\uparrow\mu(A_{1}\setminus A)$。2 から（$\mu(A_{n})\le\mu(A_{1})<\infty$）$\mu(A_{1})-\mu(A_{n})\to\mu(A_{1})-\mu(A)$、すなわち $\mu(A_{n})\to\mu(A)$。

**6.** $A\cup B=A\sqcup(B\setminus A)$, $B=(A\cap B)\sqcup(B\setminus A)$ から、両辺はともに $\mu(A)+\mu(B\setminus A)+\mu(A\cap B)$。

::: hypcheck
- **5 の有限性**は外せない：$\mathbb{N}$ 上の数え上げ測度と $A_{n}\defeq\{n,n+1,\dots\}$ では $A_{n}\downarrow\varnothing$ だが $\mu(A_{n})=\infty$ がすべての $n$ で成り立つ。実際の証明では $\mu(A_{1})<\infty$ は「$\infty-\infty$ を避けて引き算する」ところで使った。
- 4 と 3 は、可算加法性を「有限加法性 + 下からの連続性」に置き換えても同値に導ける（逆向き：互いに素な和は有限和の増加列の極限）。
:::
:::

::: corollary ボレル–カンテリの補題 {#meas:borel-cantelli keywords="Borel-Cantelli lemma: if sum mu(A_n) < infinity then mu(limsup A_n) = 0" index="ボレル–カンテリの補題|ぼれるかんてりのほだい"}
$\sum_{n}\mu(A_{n})<\infty$ なら $\mu(\limsup_{n}A_{n})=0$（ほとんどすべての点は有限個の $A_{n}$ にしか属さない）。
:::

::: proof
各 $m$ で $\limsup A_{n}\subset\bigcup_{n\ge m}A_{n}$ なので、\ref{meas:measure-properties.2}・\ref{meas:measure-properties.3} から $\mu(\limsup A_{n})\le\sum_{n\ge m}\mu(A_{n})$。右辺は収束する級数の尾部なので $m\to\infty$ で $0$ に近づく。
:::

## 零集合と完備化 {#meas:sec-sa-completion}

::: definition 零集合と完備な測度 {#meas:complete-measure keywords="null set: measurable set of measure zero; complete measure space: every subset of a null set is measurable; almost everywhere" index="零集合|れいしゅうごう, 完備な測度|かんびなそくど, ほとんど至る所|ほとんどいたるところ"}
$\mu(N)=0$ となる $N\in\mathcal{M}$ を**零集合**という。零集合の任意の部分集合が $\mathcal{M}$ に属するとき、$\mu$（または測度空間）は**完備**であるという。性質 $P(x)$ が、ある零集合の外のすべての $x$ で成り立つとき、$P$ は**ほとんど至る所**（a.e.）成り立つという。
:::

::: theorem 完備化 {#meas:completion keywords="completion of a measure space: M-bar = {E cup N : E in M, N subset of a null set}, mu-bar(E cup N) = mu(E) is the unique extension to a complete measure on M-bar" index="完備化（測度）|かんびかそくど"}
$(X,\mathcal{M},\mu)$ を測度空間とし、
$$
\overline{\mathcal{M}}\defeq\{E\cup N:E\in\mathcal{M},\ N\subset Z\text{ となる零集合 }Z\in\mathcal{M}\text{ がある}\}
$$
とおく。$\overline{\mathcal{M}}$ は $\mathcal{M}$ を含む σ-加法族で、$\bar\mu(E\cup N)\defeq\mu(E)$ は well-defined な完備な測度であり、$\overline{\mathcal{M}}$ 上で $\mu$ を延長する測度はこれだけである。
:::

::: proof
**Step 1（σ-加法族）.** $E=X$, $N=\varnothing$ から $X\in\overline{\mathcal{M}}$。補集合：$N\subset Z$（$Z$ は零集合）として
$$
(E\cup N)^{c}=\bigl((E\cup Z)^{c}\bigr)\cup\bigl(Z\setminus(E\cup N)\bigr)
$$
（右辺の第 1 項は $E\cup N$ と交わらず、$x\notin E\cup N$ で $x\in Z$ なら第 2 項に、$x\notin Z$ なら第 1 項に入る）。第 1 項は $\mathcal{M}$ の元、第 2 項は $Z$ の部分集合なので、補集合は $\overline{\mathcal{M}}$ の元。可算和：$N_{k}\subset Z_{k}$ として $\bigcup(E_{k}\cup N_{k})=\bigl(\bigcup E_{k}\bigr)\cup\bigl(\bigcup N_{k}\bigr)$ で、$\bigcup N_{k}\subset\bigcup Z_{k}$、$\mu(\bigcup Z_{k})\le\sum\mu(Z_{k})=0$（\ref{meas:measure-properties.3}）。

**Step 2（well-defined）.** $E\cup N=E'\cup N'$（$N\subset Z$, $N'\subset Z'$）なら $E\subset E'\cup N'\subset E'\cup Z'$ なので $\mu(E)\le\mu(E')+\mu(Z')=\mu(E')$。対称に $\mu(E')\le\mu(E)$。

**Step 3（測度）.** $\bar\mu(\varnothing)=\mu(\varnothing)=0$。互いに素な $E_{k}\cup N_{k}$ について $E_{k}$ も互いに素で、Step 1 の表示から $\bar\mu(\bigcup(E_{k}\cup N_{k}))=\mu(\bigcup E_{k})=\sum\mu(E_{k})$。

**Step 4（完備）.** $\bar\mu(E\cup N)=0$ なら $\mu(E)=0$ で、その部分集合 $A$ は $A\subset E\cup Z$（$\mu(E\cup Z)=0$）なので $A=\varnothing\cup A\in\overline{\mathcal{M}}$。

**Step 5（一意性）.** $\nu$ を $\overline{\mathcal{M}}$ 上の測度で $\mathcal{M}$ 上 $\mu$ に一致するものとする。単調性から $\mu(E)=\nu(E)\le\nu(E\cup N)\le\nu(E\cup Z)=\mu(E\cup Z)\le\mu(E)+\mu(Z)=\mu(E)$。
:::

## π-λ 定理と測度の一意性 {#meas:sec-sa-uniqueness}

::: definition π 系と λ 系 {#meas:pi-lambda-systems keywords="pi-system: closed under finite intersections; lambda-system (Dynkin system): contains X, closed under proper differences and increasing unions" index="π 系|ぱいけい, λ 系|らむだけい, ディンキン系|でぃんきんけい"}
1. $\mathcal{P}\subset\mathcal{P}(X)$ が $A,B\in\mathcal{P}\Rightarrow A\cap B\in\mathcal{P}$ を満たすとき、**π 系**という。
2. $\mathcal{D}\subset\mathcal{P}(X)$ が、(i) $X\in\mathcal{D}$、(ii) $A,B\in\mathcal{D}$, $A\subset B\Rightarrow B\setminus A\in\mathcal{D}$、(iii) $A_{n}\in\mathcal{D}$, $A_{n}\uparrow A\Rightarrow A\in\mathcal{D}$ を満たすとき、**λ 系**（ディンキン系）という。
:::

::: theorem π-λ 定理 {#meas:pi-lambda keywords="Dynkin's pi-lambda theorem: the lambda-system generated by a pi-system is the sigma-algebra it generates" index="π-λ 定理|ぱいらむだていり, ディンキンの定理|でぃんきんのていり"}
$\mathcal{P}$ が π 系で、$\mathcal{D}$ が $\mathcal{P}$ を含む λ 系なら、$\sigma(\mathcal{P})\subset\mathcal{D}$。
:::

::: proof
**Step 1（最小の λ 系）.** $\mathcal{P}$ を含むすべての λ 系の共通部分 $\mathcal{D}_{0}$ は λ 系（(i)〜(iii) は共通部分で保たれる）で、$\mathcal{D}_{0}\subset\mathcal{D}$。$\mathcal{D}_{0}$ が σ-加法族であることを示せば、\ref{meas:generated-properties.1} から $\sigma(\mathcal{P})\subset\mathcal{D}_{0}\subset\mathcal{D}$。

**Step 2（$\mathcal{D}_{A}$ は λ 系）.** $A\in\mathcal{D}_{0}$ について $\mathcal{D}_{A}\defeq\{B:A\cap B\in\mathcal{D}_{0}\}$ とおく。(i) $A\cap X=A\in\mathcal{D}_{0}$。(ii) $B\subset C$ が $\mathcal{D}_{A}$ の元なら $A\cap(C\setminus B)=(A\cap C)\setminus(A\cap B)$ で、$A\cap B\subset A\cap C$ はともに $\mathcal{D}_{0}$ の元なので $\mathcal{D}_{0}$ の (ii) から $\mathcal{D}_{0}$ の元。(iii) $B_{n}\uparrow B$ なら $A\cap B_{n}\uparrow A\cap B$。

**Step 3（$\mathcal{D}_{0}$ は π 系）.** $A\in\mathcal{P}$ なら、$\mathcal{P}$ が π 系なので $\mathcal{P}\subset\mathcal{D}_{A}$、Step 2 と $\mathcal{D}_{0}$ の最小性から $\mathcal{D}_{0}\subset\mathcal{D}_{A}$。つまり $A\in\mathcal{P}$, $B\in\mathcal{D}_{0}$ なら $A\cap B\in\mathcal{D}_{0}$。これは $B\in\mathcal{D}_{0}$ について $\mathcal{P}\subset\mathcal{D}_{B}$ を意味するので、同様に $\mathcal{D}_{0}\subset\mathcal{D}_{B}$。よって $\mathcal{D}_{0}$ は共通部分で閉じている。

**Step 4（π 系である λ 系は σ-加法族）.** 補集合：$A^{c}=X\setminus A$（(i) と (ii)）。有限和：$A\cup B=(A^{c}\cap B^{c})^{c}$。可算和：$\bigcup_{n}A_{n}$ は有限和 $\bigcup_{k\le n}A_{k}$ の増加列の和なので (iii)。
:::

::: corollary 測度の一意性 {#meas:measure-uniqueness keywords="two measures agreeing on a pi-system P which generates M agree on M, provided X is an increasing union of sets in P of finite measure" index="測度の一意性|そくどのいちいせい"}
$\mathcal{P}$ を π 系、$\mathcal{M}=\sigma(\mathcal{P})$、$\mu,\nu$ を $\mathcal{M}$ 上の測度とし、$\mathcal{P}$ 上で $\mu=\nu$ とする。$X_{n}\uparrow X$ となる $X_{n}\in\mathcal{P}$ で $\mu(X_{n})<\infty$ のものがあれば、$\mathcal{M}$ 上で $\mu=\nu$。
:::

::: proof
$n$ を固定し $\mathcal{D}_{n}\defeq\{A\in\mathcal{M}:\mu(A\cap X_{n})=\nu(A\cap X_{n})\}$ とおく。
- (i) $\mu(X_{n})=\nu(X_{n})$（$X_{n}\in\mathcal{P}$）なので $X\in\mathcal{D}_{n}$。
- (ii) $A\subset B$ が $\mathcal{D}_{n}$ の元なら、$\mu(A\cap X_{n})\le\mu(X_{n})<\infty$ なので \ref{meas:measure-properties.2} から $\mu((B\setminus A)\cap X_{n})=\mu(B\cap X_{n})-\mu(A\cap X_{n})$。$\nu$ についても同じ式（$\nu(A\cap X_{n})=\mu(A\cap X_{n})<\infty$）で、右辺どうしが等しい。
- (iii) $A_{k}\uparrow A$ なら $A_{k}\cap X_{n}\uparrow A\cap X_{n}$ で、\ref{meas:measure-properties.4} から両辺の極限が等しい。
- $A\in\mathcal{P}$ なら $A\cap X_{n}\in\mathcal{P}$ なので $A\in\mathcal{D}_{n}$。

\ref{meas:pi-lambda} から $\mathcal{M}\subset\mathcal{D}_{n}$。$A\in\mathcal{M}$ について $A\cap X_{n}\uparrow A$ なので、\ref{meas:measure-properties.4} から $\mu(A)=\lim\mu(A\cap X_{n})=\lim\nu(A\cap X_{n})=\nu(A)$。

::: hypcheck
- **π 系**であること：$A\cap X_{n}\in\mathcal{P}$（最後の項目）と π-λ 定理に使った。
- **有限性** $\mu(X_{n})<\infty$：(ii) の引き算に使った。外すと偽：$\mathcal{P}\defeq\{(a,b]:a<b\}\cup\{\varnothing\}$ 上で、数え上げ測度 $\mu$ と $2\mu$ はどちらも空でない区間に $\infty$ を与えて一致するが、$\{0\}\in\sigma(\mathcal{P})$ で $\mu(\{0\})=1\ne2$。
:::
:::

::: supplement
**高い視点：σ-加法族は「可算の論理」で閉じた命題の族.** 集合 $A\subset X$ を「点 $x$ についての命題 $x\in A$」とみると、σ-加法族は否定と可算個の「または」で閉じた命題の族であり、$\sigma(\mathcal{E})$ は $\mathcal{E}$ の命題から可算個の論理操作で作れる命題の全体である（ただし「作れる」の段階は可算順序数の長さまで続くので、帰納的な記述には超限帰納法が要る）。π-λ 定理は、「共通部分で閉じた生成元の上で成り立つ性質が、引き算と増加和で保たれるなら、σ-加法族全体で成り立つ」という**単調族型の帰納法**で、測度論で繰り返し使われる（一意性、フビニの定理の可測性など）。比喩で言えば、σ-加法族は「測ってよい図形の一覧」で、測度は「その一覧のどの図形にも、可算個に切り分けても辻褄の合う面積を割り当てる規則」であり、一意性定理は「辻褄が合う限り、小さな箱の面積を決めれば規則全体が決まる」と言っている。

**圏論的な見方.** 可測空間と可測写像（次のページ以降で定義）は圏をなし、$\mathcal{E}\mapsto\sigma(\mathcal{E})$ は部分集合族の包含順序の上の**閉包作用素**（単調・拡大的・冪等）である。
:::

## 問題 {#meas:sec-sa-problems}

::: problem {#meas:prob-sa-countable-cocountable}
非可算集合 $X$ について、$\mathcal{M}\defeq\{A\subset X:A\text{ または }A^{c}\text{ が可算}\}$ は σ-加法族で、1 点集合の全体が生成する σ-加法族に等しいことを示せ。また $\mu(A)\defeq0$（$A$ が可算）、$1$（$A^{c}$ が可算）は測度であることを示せ。
:::

::: solution
**σ-加法族.** $X^{c}=\varnothing$ は可算。補集合で閉じるのは定義が $A$ と $A^{c}$ について対称だから。可算和 $\bigcup A_{n}$：すべての $A_{n}$ が可算なら和は可算（可算個の可算集合の和。ここでは各 $A_{n}$ の数え上げを選ぶので可算選択公理を使う）。ある $A_{m}^{c}$ が可算なら $(\bigcup A_{n})^{c}\subset A_{m}^{c}$ は可算。

**生成.** 1 点集合は可算なので $\mathcal{M}$ に属し、生成する σ-加法族 $\mathcal{S}$ は $\mathcal{M}$ に含まれる。逆に可算集合は 1 点集合の可算和なので $\mathcal{S}$ に属し、その補集合も $\mathcal{S}$ に属する。

**測度.** $A$ と $A^{c}$ がともに可算なら $X=A\cup A^{c}$ が可算になるので、$\mu$ は well-defined。互いに素な $A_{n}$ のうち補集合が可算なものは高々一つ（二つあれば $A_{m}\subset A_{k}^{c}$ が非可算かつ可算になる）。そのようなものがなければ和は可算で両辺 $0$、一つあれば和の補集合は可算で両辺 $1$。
:::

::: problem {#meas:prob-sa-lebesgue-uniqueness}
$\mathbb{R}$ のボレル集合族の上の二つの測度 $\mu,\nu$ が、すべての有界な半開区間 $(a,b]$ で有限の同じ値をとるなら、$\mu=\nu$ であることを示せ。
:::

::: solution
$\mathcal{P}\defeq\{(a,b]:a<b\}\cup\{\varnothing\}$ は π 系（$(a,b]\cap(c,d]=(\max(a,c),\min(b,d)]$ または空）で、\ref{meas:borel-generators.1} から $\sigma(\mathcal{P})=\mathcal{B}(\mathbb{R})$。$X_{n}\defeq(-n,n]\uparrow\mathbb{R}$ で $\mu(X_{n})<\infty$。$\mu(\varnothing)=\nu(\varnothing)=0$ なので $\mathcal{P}$ 上で $\mu=\nu$、\ref{meas:measure-uniqueness} から $\mu=\nu$。
:::
