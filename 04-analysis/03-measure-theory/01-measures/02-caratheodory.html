# 外測度とカラテオドリの拡張定理 {#meas:page-caratheodory keywords="outer measure, Caratheodory measurable sets, Caratheodory's theorem, outer measure generated by a covering family, semiring of sets, premeasure, Hahn-Kolmogorov extension theorem, uniqueness for sigma-finite premeasures, measurable hull, Caratheodory sigma-algebra is the completion"}

測度を具体的に作るには、まず簡単な集合（区間や直方体）に「大きさ」を与え、それを σ-加法族全体に延ばす必要がある。このページの道具は二つである。
1. **外測度**：すべての部分集合に定義された、可算劣加法的な「上からの見積もり」。簡単な集合による被覆の大きさの下限として作る。
2. **カラテオドリの条件**：外測度を「きれいに分ける」集合だけを集めると σ-加法族になり、その上で外測度は測度になる。

この二つを組み合わせて、**半環**の上の可算加法的な関数（**前測度**）が、生成する σ-加法族上の測度に延びること（**カラテオドリの拡張定理**）と、σ 有限ならその延長が一意であることを示す。ルベーグ測度は次のページでこの定理から作る。

## 記法と定義の確認 {#meas:sec-ca-notation}

::: notation
- σ-加法族・生成・測度・完備化・π-λ 定理は \ref{meas:sigma-algebra}, \ref{meas:generated-sigma-algebra}, \ref{meas:measure}, \ref{meas:completion}, \ref{meas:pi-lambda}。$[0,\infty]$ の和は \ref{meas:extended-sums}, \ref{meas:extended-sums-properties}。
- $\inf\varnothing\defeq\infty$。互いに素な和を $\sqcup$ で表す。
- **選択公理**：被覆を一つずつ選ぶところで可算選択公理を使う（各所で明記する）。
:::

## 外測度とカラテオドリの定理 {#meas:sec-ca-outer}

::: definition 外測度とカラテオドリ可測 {#meas:outer-measure keywords="outer measure: monotone countably subadditive set function on all subsets with value 0 at the empty set; Caratheodory measurable set: mu*(E) = mu*(E cap A) + mu*(E minus A) for every E" index="外測度|がいそくど, カラテオドリ可測|からておどりかそく"}
1. 写像 $\mu^{*}\colon\mathcal{P}(X)\to[0,\infty]$ が、$\mu^{*}(\varnothing)=0$、単調（$A\subset B\Rightarrow\mu^{*}(A)\le\mu^{*}(B)$）、可算劣加法的（$\mu^{*}(\bigcup_{n}A_{n})\le\sum_{n}\mu^{*}(A_{n})$）であるとき、**外測度**という。
2. $A\subset X$ が、すべての $E\subset X$ について
$$
\mu^{*}(E)=\mu^{*}(E\cap A)+\mu^{*}(E\setminus A)
$$
を満たすとき、**$\mu^{*}$ 可測**（カラテオドリ可測）という。劣加法性から「$\le$」は常に成り立つので、「$\ge$」だけ確かめればよい。
:::

::: theorem カラテオドリの定理 {#meas:caratheodory keywords="the mu*-measurable sets form a sigma-algebra and the restriction of mu* to it is a complete measure" index="カラテオドリの定理|からておどりのていり"}
外測度 $\mu^{*}$ について、$\mu^{*}$ 可測集合の全体 $\mathcal{M}^{*}$ は σ-加法族で、$\mu^{*}\restriction\mathcal{M}^{*}$ は完備な測度である。
:::

::: proof
**Step 1（補集合と $X$）.** 条件は $A$ と $A^{c}$ について対称（$E\setminus A=E\cap A^{c}$）。$\mu^{*}(E\cap X)+\mu^{*}(E\setminus X)=\mu^{*}(E)+0$ なので $X\in\mathcal{M}^{*}$。

**Step 2（有限和）.** $A,B\in\mathcal{M}^{*}$、$E\subset X$ とする。$A$ で分け、次に $E\setminus A$ を $B$ で分けると
$$
\mu^{*}(E)=\mu^{*}(E\cap A)+\mu^{*}((E\setminus A)\cap B)+\mu^{*}(E\setminus(A\cup B)).
$$
$E\cap(A\cup B)=(E\cap A)\cup((E\setminus A)\cap B)$ なので、劣加法性から最初の二項の和 $\ge\mu^{*}(E\cap(A\cup B))$。よって $\mu^{*}(E)\ge\mu^{*}(E\cap(A\cup B))+\mu^{*}(E\setminus(A\cup B))$ で、$A\cup B\in\mathcal{M}^{*}$。Step 1 と合わせて、$\mathcal{M}^{*}$ は補集合・有限和・有限共通部分・差で閉じる。

**Step 3（互いに素な可算和）.** $A_{1},A_{2},\dots\in\mathcal{M}^{*}$ を互いに素、$B_{n}\defeq\bigsqcup_{j\le n}A_{j}$、$B\defeq\bigsqcup_{j}A_{j}$ とする。【主張：$\mu^{*}(E\cap B_{n})=\sum_{j\le n}\mu^{*}(E\cap A_{j})$】$n$ についての帰納法：$E\cap B_{n}$ を $A_{n}\in\mathcal{M}^{*}$ で分けると、$E\cap B_{n}\cap A_{n}=E\cap A_{n}$、$E\cap B_{n}\setminus A_{n}=E\cap B_{n-1}$。$B_{n}\in\mathcal{M}^{*}$（Step 2）と単調性から
$$
\mu^{*}(E)=\mu^{*}(E\cap B_{n})+\mu^{*}(E\setminus B_{n})\ge\sum_{j\le n}\mu^{*}(E\cap A_{j})+\mu^{*}(E\setminus B).
$$
$n\to\infty$ として、さらに劣加法性を使うと
$$
\mu^{*}(E)\ge\sum_{j}\mu^{*}(E\cap A_{j})+\mu^{*}(E\setminus B)\ge\mu^{*}(E\cap B)+\mu^{*}(E\setminus B)\ge\mu^{*}(E).
$$
よってすべて等号で、$B\in\mathcal{M}^{*}$。$E=B$ とおくと $\mu^{*}(B)=\sum_{j}\mu^{*}(A_{j})$（可算加法性）。

**Step 4（一般の可算和）.** $A_{n}\in\mathcal{M}^{*}$ について $A'_{n}\defeq A_{n}\setminus\bigcup_{k<n}A_{k}\in\mathcal{M}^{*}$（Step 2）は互いに素で和は同じ。Step 3 から $\bigcup A_{n}\in\mathcal{M}^{*}$。

**Step 5（完備）.** $\mu^{*}(N)=0$ なら、任意の $E$ で $\mu^{*}(E\cap N)+\mu^{*}(E\setminus N)\le\mu^{*}(N)+\mu^{*}(E)=\mu^{*}(E)$（単調性）なので $N\in\mathcal{M}^{*}$。とくに $\mu^{*}$ 零集合の部分集合は $\mu^{*}$ 零集合で可測。

::: hypcheck
- 単調性は Step 3 の $\mu^{*}(E\setminus B_{n})\ge\mu^{*}(E\setminus B)$ と Step 5 に、可算劣加法性は Step 3 の最後の不等式に使った。
- 選択公理は使っていない。
:::
:::

::: proposition 被覆から作る外測度 {#meas:outer-measure-from-cover keywords="given a family C containing the empty set and rho: C -> [0, infinity] with rho(empty)=0, mu*(A) = inf of sums of rho over countable covers of A by C is an outer measure" index="被覆による外測度|ひふくによるがいそくど"}
$\mathcal{C}\subset\mathcal{P}(X)$ が $\varnothing$ を含み、$\rho\colon\mathcal{C}\to[0,\infty]$ が $\rho(\varnothing)=0$ を満たすとする。
$$
\mu^{*}(A)\defeq\inf\Bigl\{\sum_{j=1}^{\infty}\rho(C_{j}):C_{j}\in\mathcal{C},\ A\subset\bigcup_{j}C_{j}\Bigr\}
$$
は外測度で、$C\in\mathcal{C}$ について $\mu^{*}(C)\le\rho(C)$。
:::

::: proof
$\varnothing$ は $C_{j}=\varnothing$ で被覆されるので $\mu^{*}(\varnothing)=0$。$A\subset B$ なら $B$ の被覆は $A$ の被覆なので単調。$C\in\mathcal{C}$ は $C_{1}=C$, $C_{j}=\varnothing$（$j\ge2$）で被覆されるので $\mu^{*}(C)\le\rho(C)$。

可算劣加法性：$\sum\mu^{*}(A_{n})=\infty$ なら自明。そうでなければ $\varepsilon>0$ について、各 $n$ で $A_{n}\subset\bigcup_{j}C_{nj}$, $\sum_{j}\rho(C_{nj})\le\mu^{*}(A_{n})+\varepsilon2^{-n}$ となる被覆を選ぶ（可算選択公理）。$\{C_{nj}\}_{n,j}$ は $\bigcup A_{n}$ の可算被覆で、\ref{meas:extended-sums-properties.2} から $\mu^{*}(\bigcup A_{n})\le\sum_{n,j}\rho(C_{nj})\le\sum_{n}\mu^{*}(A_{n})+\varepsilon$。$\varepsilon\to0$。
:::

## 半環と前測度 {#meas:sec-ca-semiring}

::: definition 半環と前測度 {#meas:semiring keywords="semiring of sets: contains the empty set, closed under intersections, and differences are finite disjoint unions; premeasure on a semiring: countably additive with rho(empty)=0" index="集合の半環|しゅうごうのはんかん, 前測度|ぜんそくど"}
1. $\mathcal{S}\subset\mathcal{P}(X)$ が、$\varnothing\in\mathcal{S}$、$A,B\in\mathcal{S}\Rightarrow A\cap B\in\mathcal{S}$、$A,B\in\mathcal{S}\Rightarrow A\setminus B$ は $\mathcal{S}$ の有限個の互いに素な元の和、を満たすとき、**半環**という。
2. 半環 $\mathcal{S}$ 上の $\rho\colon\mathcal{S}\to[0,\infty]$ が、$\rho(\varnothing)=0$ と、「$S\in\mathcal{S}$ が $\mathcal{S}$ の互いに素な元の可算和 $S=\bigsqcup_{j}S_{j}$ なら $\rho(S)=\sum_{j}\rho(S_{j})$」を満たすとき、**前測度**という。
:::

::: example
1. $\mathbb{R}$ の半開区間 $(a,b]$（$a\le b$、$a=b$ のとき空）の全体は半環：$(a,b]\cap(c,d]=(\max(a,c),\min(b,d)]$（右端が左端以下なら空）、$(a,b]\setminus(c,d]$ は高々二つの半開区間の互いに素な和。
2. 半環の直積：$\mathcal{S}_{1}$, $\mathcal{S}_{2}$ が半環なら $\{S_{1}\times S_{2}\}$ は $X_{1}\times X_{2}$ の半環。$(S_{1}\times S_{2})\cap(T_{1}\times T_{2})=(S_{1}\cap T_{1})\times(S_{2}\cap T_{2})$ と
$$
(S_{1}\times S_{2})\setminus(T_{1}\times T_{2})=\bigl((S_{1}\setminus T_{1})\times S_{2}\bigr)\sqcup\bigl((S_{1}\cap T_{1})\times(S_{2}\setminus T_{2})\bigr)
$$
から。とくに $\mathbb{R}^{n}$ の半開直方体の全体 $\mathcal{I}_{n}$（\ref{meas:borel-generators}）に空集合を加えたものは半環。
:::

::: lemma 半環の差と前測度の性質 {#meas:semiring-lemma keywords="in a semiring, A minus a finite union of members is a finite disjoint union of members; a premeasure is finitely additive, monotone and countably subadditive on the semiring" index="半環の補題|はんかんのほだい"}
$\mathcal{S}$ を半環、$\rho$ を $\mathcal{S}$ 上の前測度とする。
1. $A,B_{1},\dots,B_{m}\in\mathcal{S}$ について、$A\setminus(B_{1}\cup\cdots\cup B_{m})$ は $\mathcal{S}$ の有限個の互いに素な元の和。
2. $\rho$ は有限加法的で単調（$S\subset T$ なら $\rho(S)\le\rho(T)$）。
3. $S,S_{1},S_{2},\dots\in\mathcal{S}$, $S\subset\bigcup_{j}S_{j}$ なら $\rho(S)\le\sum_{j}\rho(S_{j})$。
:::

::: proof
**1.** $m$ についての帰納法。$m=1$ は定義。$A\setminus B_{1}=\bigsqcup_{k}C_{k}$（$C_{k}\in\mathcal{S}$、有限個）とすると $A\setminus(B_{1}\cup\cdots\cup B_{m})=\bigsqcup_{k}\bigl(C_{k}\setminus(B_{2}\cup\cdots\cup B_{m})\bigr)$ で、帰納法の仮定から各項は有限個の互いに素な元の和、$C_{k}$ が互いに素なので全体も互いに素。

**2.** 有限加法性は、可算加法性で残りを $\varnothing$ とおく。$S\subset T$ なら $T\setminus S=\bigsqcup_{k}D_{k}$（有限個）で $T=S\sqcup\bigsqcup D_{k}$、$\rho(T)=\rho(S)+\sum\rho(D_{k})\ge\rho(S)$。

**3.** $T_{j}\defeq S\cap S_{j}\in\mathcal{S}$、$S=\bigcup_{j}T_{j}$。1 から $T_{j}\setminus(T_{1}\cup\cdots\cup T_{j-1})=\bigsqcup_{i}D_{ji}$（有限個、$D_{ji}\in\mathcal{S}$）と書け、$S=\bigsqcup_{j,i}D_{ji}$ は $\mathcal{S}$ の元の可算な互いに素な和。前測度の定義と \ref{meas:extended-sums-properties.2} から $\rho(S)=\sum_{j}\sum_{i}\rho(D_{ji})$。各 $j$ について、$\bigsqcup_{i}D_{ji}\subset T_{j}\subset S_{j}$ で、1 から $S_{j}\setminus\bigsqcup_{i}D_{ji}=\bigsqcup_{l}E_{jl}$（有限個）、有限加法性から $\rho(S_{j})=\sum_{i}\rho(D_{ji})+\sum_{l}\rho(E_{jl})\ge\sum_{i}\rho(D_{ji})$。和をとって結論。
:::

::: theorem カラテオドリの拡張定理 {#meas:caratheodory-extension keywords="Hahn-Kolmogorov / Caratheodory extension theorem: a premeasure on a semiring extends to a measure on the generated sigma-algebra; the extension is unique if the premeasure is sigma-finite" index="カラテオドリの拡張定理|からておどりのかくちょうていり, ハーン–コルモゴロフの拡張定理|はーんこるもごろふのかくちょうていり"}
$\rho$ を半環 $\mathcal{S}$ 上の前測度、$\mu^{*}$ を $(\mathcal{S},\rho)$ から \ref{meas:outer-measure-from-cover} で作った外測度とする。
1. $\mathcal{S}\subset\mathcal{M}^{*}$、$\mathcal{S}$ 上で $\mu^{*}=\rho$。したがって $\mu\defeq\mu^{*}\restriction\sigma(\mathcal{S})$ は $\rho$ を延長する測度である。
2. （一意性）$X=\bigcup_{n}X_{n}$, $X_{n}\in\mathcal{S}$, $\rho(X_{n})<\infty$ と書けるなら、$\sigma(\mathcal{S})$ 上で $\rho$ を延長する測度は $\mu$ だけである。
:::

::: proof
**Step 1（$\mathcal{S}$ 上で $\mu^{*}=\rho$）.** \ref{meas:outer-measure-from-cover} から $\mu^{*}(S)\le\rho(S)$。$S\subset\bigcup_{j}C_{j}$（$C_{j}\in\mathcal{S}$）なら \ref{meas:semiring-lemma.3} から $\rho(S)\le\sum\rho(C_{j})$ で、下限をとって $\rho(S)\le\mu^{*}(S)$。

**Step 2（$\mathcal{S}\subset\mathcal{M}^{*}$）.** $S\in\mathcal{S}$, $E\subset X$ とし、$\mu^{*}(E)<\infty$ としてよい。$\varepsilon>0$ について被覆 $E\subset\bigcup_{j}C_{j}$, $\sum\rho(C_{j})\le\mu^{*}(E)+\varepsilon$ をとる。$C_{j}\cap S\in\mathcal{S}$、$C_{j}\setminus S=\bigsqcup_{k}D_{jk}$（有限個）で、$C_{j}=(C_{j}\cap S)\sqcup\bigsqcup_{k}D_{jk}$。$E\cap S\subset\bigcup_{j}(C_{j}\cap S)$, $E\setminus S\subset\bigcup_{j,k}D_{jk}$ なので、$\mu^{*}$ の定義と前測度の有限加法性から
$$
\mu^{*}(E\cap S)+\mu^{*}(E\setminus S)\le\sum_{j}\Bigl(\rho(C_{j}\cap S)+\sum_{k}\rho(D_{jk})\Bigr)=\sum_{j}\rho(C_{j})\le\mu^{*}(E)+\varepsilon.
$$
$\varepsilon\to0$ で $S\in\mathcal{M}^{*}$。

**Step 3（1 の結論）.** \ref{meas:caratheodory} から $\mathcal{M}^{*}$ は σ-加法族なので $\sigma(\mathcal{S})\subset\mathcal{M}^{*}$（\ref{meas:generated-properties.1}）、$\mu^{*}\restriction\mathcal{M}^{*}$ は測度でその制限 $\mu$ も測度。Step 1 から $\rho$ を延長する。

**Step 4（有限な元の上での一意性）.** $\nu$ を $\sigma(\mathcal{S})$ 上の測度で $\mathcal{S}$ 上 $\rho$ に一致するものとする。$R\in\mathcal{S}$, $\rho(R)<\infty$ について、$\mu_{R}(A)\defeq\mu(A\cap R)$, $\nu_{R}(A)\defeq\nu(A\cap R)$ は $\sigma(\mathcal{S})$ 上の有限測度。$\mathcal{P}\defeq\mathcal{S}\cup\{X\}$ は π 系で（$X\cap A=A$）、$A\in\mathcal{S}$ なら $A\cap R\in\mathcal{S}$ なので $\mu_{R}(A)=\rho(A\cap R)=\nu_{R}(A)$、$\mu_{R}(X)=\rho(R)=\nu_{R}(X)<\infty$。\ref{meas:measure-uniqueness}（$X_{n}=X$）から $\sigma(\mathcal{S})$ 上で $\mu_{R}=\nu_{R}$。

**Step 5（2 の結論）.** \ref{meas:semiring-lemma.1} から $X_{n}\setminus(X_{1}\cup\cdots\cup X_{n-1})=\bigsqcup_{i}R_{ni}$（有限個、$R_{ni}\in\mathcal{S}$）で、単調性（\ref{meas:semiring-lemma.2}）から $\rho(R_{ni})\le\rho(X_{n})<\infty$。$X=\bigsqcup_{n,i}R_{ni}$ なので、$A\in\sigma(\mathcal{S})$ について Step 4 から
$$
\mu(A)=\sum_{n,i}\mu_{R_{ni}}(A)=\sum_{n,i}\nu_{R_{ni}}(A)=\nu(A).
$$

::: hypcheck
- **前測度の可算加法性**は Step 1 で（\ref{meas:semiring-lemma.3} を通して）使った。有限加法的なだけでは $\mu^{*}(S)<\rho(S)$ となることがある（問題 \ref{meas:prob-ca-finitely-additive}）。
- **σ 有限性**は Step 4・5 で使った。外すと一意性は偽（問題 \ref{meas:prob-ca-nonunique}）。
- **選択公理**：Step 2 で被覆を一つ選ぶのは、一つの $\varepsilon$ について存在を使うだけなので選択公理は要らない（存在から不等式を導くだけ）。\ref{meas:outer-measure-from-cover} の可算劣加法性に可算選択公理を使った。
:::
:::

::: proposition カラテオドリ可測集合族は完備化 {#meas:caratheodory-completion keywords="for a sigma-finite premeasure, every set has a measurable hull in sigma(S), and the Caratheodory sigma-algebra M* is the completion of sigma(S) with respect to mu" index="可測包|かそくほう"}
\ref{meas:caratheodory-extension} の状況で、
1. （可測包）任意の $A\subset X$ について、$A\subset B$, $\mu(B)=\mu^{*}(A)$ となる $B\in\sigma(\mathcal{S})$ がある。
2. \ref{meas:caratheodory-extension.2} の σ 有限性の仮定のもとで、$\mathcal{M}^{*}$ は $\sigma(\mathcal{S})$ の $\mu$ による完備化 $\overline{\sigma(\mathcal{S})}$（\ref{meas:completion}）に等しく、その上で $\mu^{*}=\bar\mu$。
:::

::: proof
**1.** $\mu^{*}(A)=\infty$ なら $B=X$。そうでなければ各 $m$ で被覆 $A\subset\bigcup_{j}C_{mj}$, $\sum_{j}\rho(C_{mj})\le\mu^{*}(A)+\frac1m$ をとり（可算選択公理）、$B\defeq\bigcap_{m}\bigcup_{j}C_{mj}\in\sigma(\mathcal{S})$ とおく。$A\subset B$ で、単調性と劣加法性から $\mu^{*}(A)\le\mu(B)\le\sum_{j}\rho(C_{mj})\le\mu^{*}(A)+\frac1m$。

**2.** $\supset$：$\mathcal{M}^{*}$ は $\sigma(\mathcal{S})$ を含み（\ref{meas:caratheodory-extension}）、完備（\ref{meas:caratheodory}）なので、$E\cup N$（$E\in\sigma(\mathcal{S})$, $N\subset Z$, $\mu(Z)=0$）は $\mathcal{M}^{*}$ に属する。値は $\mu^{*}(E)\le\mu^{*}(E\cup N)\le\mu^{*}(E)+\mu^{*}(Z)$ から $\mu(E)=\bar\mu(E\cup N)$。

$\subset$：$A\in\mathcal{M}^{*}$ とする。まず $\mu^{*}(A)<\infty$ の場合。1 の可測包 $B$ をとると、$A$ の可測性を $E=B$ に使って $\mu^{*}(B)=\mu^{*}(A)+\mu^{*}(B\setminus A)$ なので $\mu^{*}(B\setminus A)=0$。$B\setminus A$ の可測包 $Z\in\sigma(\mathcal{S})$ をとると $\mu(Z)=0$。$B\setminus A\subset Z$ なので $B\setminus Z\subset A$ で、$A=(B\setminus Z)\cup(A\cap Z)$。$B\setminus Z\in\sigma(\mathcal{S})$、$A\cap Z\subset Z$ なので $A\in\overline{\sigma(\mathcal{S})}$。一般の場合は $A=\bigcup_{n}(A\cap X_{n})$ で、$\mu^{*}(A\cap X_{n})\le\rho(X_{n})<\infty$ かつ $A\cap X_{n}\in\mathcal{M}^{*}$ なので各項は完備化に属し、完備化は σ-加法族なので $A$ も属する。
:::

::: supplement
**高い視点：外から測り、切れ味で選ぶ.** 外測度は「被覆で上から押さえた大きさの最良の値」で、すべての集合に定義されるが加法的とは限らない。カラテオドリの条件 $\mu^{*}(E)=\mu^{*}(E\cap A)+\mu^{*}(E\setminus A)$ は、「$A$ という包丁で、どんな試験用の集合 $E$ を切っても、切り口で大きさが失われも増えもしない」ことを要求する。そういう包丁だけを集めると σ-加法族になり、その上では外測度が加法的になる。比喩で言えば、外測度は「どんな形の部屋にも、外側から箱をかぶせて測った容積」で、可測集合は「その部屋で空間を二つに分けても、二つの容積の和が元に戻る壁」である。

**圏論的な見方.** 前測度から測度への延長は、半環上の「可算加法的な関数」の圏から σ-加法族上の測度の圏への、一意性（σ 有限のとき）をもつ延長であり、外測度はその延長を「すべての部分集合に対する右カン拡張」のように最良の上からの近似として与える（順序集合を圏とみたときの言い方。厳密な対応は本サイトでは扱わない）。
:::

## 問題 {#meas:sec-ca-problems}

::: problem {#meas:prob-ca-two-points}
$X=\{a,b\}$ 上で $\mu^{*}(\varnothing)=0$, $\mu^{*}(\{a\})=\mu^{*}(\{b\})=\mu^{*}(X)=1$ とおく。$\mu^{*}$ は外測度で、$\mu^{*}$ 可測集合は $\varnothing$ と $X$ だけであることを示せ。
:::

::: solution
$\mu^{*}(\varnothing)=0$、単調性は値から明らか。劣加法性：和集合が空でなければ左辺は $1$ で、右辺の項のうち空でないものが $1$ 以上。$\varnothing$, $X$ は可測（\ref{meas:caratheodory} の Step 1 と同様）。$\{a\}$ は $E=X$ で $\mu^{*}(X)=1<2=\mu^{*}(\{a\})+\mu^{*}(\{b\})$ なので可測でない。$\{b\}$ も同様。
:::

::: problem {#meas:prob-ca-nonunique}
$X=\mathbb{Q}$、$\mathcal{S}\defeq\{(a,b]\cap\mathbb{Q}:a\le b\text{ は実数}\}$ とし、$\rho(\varnothing)=0$, 空でない元には $\rho=\infty$ とおく。$\rho$ は前測度で $\sigma(\mathcal{S})=\mathcal{P}(\mathbb{Q})$ であること、数え上げ測度とその 2 倍はどちらも $\rho$ を延長することを示せ（σ 有限でないと一意性が崩れる）。
:::

::: solution
$\mathcal{S}$ は \ref{meas:semiring} の例 1 を $\mathbb{Q}$ に制限したもので半環。$S=\bigsqcup S_{j}$ が空なら両辺 $0$、空でなければある $S_{j}$ が空でなく両辺 $\infty$。$q\in\mathbb{Q}$ について $\{q\}=\bigcap_{n}(q-\frac1n,q]\cap\mathbb{Q}\in\sigma(\mathcal{S})$ で、$\mathbb{Q}$ の任意の部分集合は 1 点集合の可算和なので $\sigma(\mathcal{S})=\mathcal{P}(\mathbb{Q})$。空でない $(a,b]\cap\mathbb{Q}$（$a<b$）は無限個の有理数を含むので、数え上げ測度もその 2 倍も値 $\infty$ をとり、$\rho$ を延長する。$\{0\}$ で値が $1$ と $2$ で異なる。$\rho$ は σ 有限でない（空でない元の値は $\infty$）。
:::

::: problem {#meas:prob-ca-finitely-additive}
$X=\mathbb{N}$、$\mathcal{S}\defeq\mathcal{P}(\mathbb{N})$（半環）、$\rho(A)\defeq0$（$A$ が有限）、$\infty$（$A$ が無限）とする。$\rho$ は有限加法的だが前測度でないこと、\ref{meas:outer-measure-from-cover} の外測度は恒等的に $0$ であることを示せ。
:::

::: solution
有限加法性：$A\sqcup B$ が無限なら $A$, $B$ の少なくとも一方が無限で両辺 $\infty$、有限なら両辺 $0$。前測度でない：$\mathbb{N}=\bigsqcup_{n}\{n\}$ で $\rho(\mathbb{N})=\infty\ne0=\sum\rho(\{n\})$。外測度：任意の $A\subset\mathbb{N}$ は 1 点集合の可算個で被覆され、和は $0$ なので $\mu^{*}(A)=0$。とくに $\mu^{*}(\mathbb{N})=0<\rho(\mathbb{N})$ で、\ref{meas:caratheodory-extension} の Step 1 の結論 $\mu^{*}=\rho$ が崩れる。
:::
