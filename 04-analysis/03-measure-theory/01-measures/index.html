# 測度（Measures）

σ-加法族とボレル集合族、測度の基本性質と完備化、π-λ 定理と測度の一意性、外測度とカラテオドリの拡張定理、ルベーグ測度（正則性・平行移動不変性・線形写像・非可測集合）、可測関数（単関数近似・エゴロフ・ルジン）。

<p class="mn-msc">MSC2020: 28A05, 28A10, 28A12, 28A20</p>

## 前提知識

- [集合論 › 基礎事項](../../../01-foundations/04-set-theory/01-basics/index.html)（全体、13 ページ）：可算集合・選択公理（非可測集合でだけ使う）
- [一般位相 › 位相空間](../../../05-geometry-topology/01-general-topology/01-topological-spaces/index.html)（全体、5 ページ）：開集合・閉集合・基底
- [一般位相 › 距離空間](../../../05-geometry-topology/01-general-topology/06-metric-spaces/index.html)（全体、12 ページ）：距離空間・コンパクト性
- [実解析 › 実数論](../../../04-analysis/01-real-analysis/01-real-numbers/index.html)（全体、6 ページ）：上限・正項級数
- [実解析 › 多変数解析](../../../04-analysis/01-real-analysis/03-multivariable-calculus/index.html)（全体、11 ページ）：ジョルダン可測集合と体積（比較）
