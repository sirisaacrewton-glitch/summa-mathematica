# 符号付き測度とラドン–ニコディムの定理 {#meas:page-radon-nikodym keywords="finite signed measure, positive and negative sets, Hahn decomposition, Jordan decomposition, total variation, absolute continuity, mutual singularity, epsilon-delta characterization of absolute continuity, Radon-Nikodym theorem, Radon-Nikodym derivative, chain rule, Lebesgue decomposition, counterexample without sigma-finiteness"}

非負可測関数 $f$ から測度 $\nu(E)=\int_{E}f\,d\mu$ が作れる（\ref{meas:density-measure}）。このとき $\mu(E)=0$ なら $\nu(E)=0$ である（**絶対連続**）。**ラドン–ニコディムの定理**は、σ 有限な測度についてはこの逆が成り立つこと、つまり絶対連続な測度はすべて密度をもつことを主張する。証明の道具は、引き算で作った「符号付き測度」を正の部分と負の部分に分ける**ハーン分解**である。最後に、一般の測度が「絶対連続な部分」と「特異な部分」に一意に分かれること（**ルベーグ分解**）を示す。

## 記法と定義の確認 {#meas:sec-rn-notation}

::: notation
- 測度の基本性質・ボレル–カンテリ・π-λ は \ref{meas:measure-properties}, \ref{meas:borel-cantelli}。単調収束定理・密度をもつ測度・マルコフの不等式は \ref{meas:monotone-convergence}, \ref{meas:density-measure}, \ref{meas:markov}。
- このページの符号付き測度はすべて**有限**（実数値）とする。
- **選択公理**：ハーン分解の補題で従属選択公理を、最大化列の選択で可算選択公理を使う（各所で明記する）。
:::

## 符号付き測度とハーン分解 {#meas:sec-rn-hahn}

::: definition 符号付き測度 {#meas:signed-measure keywords="finite signed measure: real valued countably additive set function; positive, negative and null sets" index="符号付き測度|ふごうつきそくど, 正集合|せいしゅうごう, 負集合|ふしゅうごう"}
可測空間 $(X,\mathcal{M})$ 上の写像 $\nu\colon\mathcal{M}\to\mathbb{R}$ が、$\nu(\varnothing)=0$ で、互いに素な $E_{j}$ について $\nu(\bigsqcup E_{j})=\sum_{j}\nu(E_{j})$（右辺の級数は収束する）を満たすとき、**（有限な）符号付き測度**という。$P\in\mathcal{M}$ の可測な部分集合 $E$ がすべて $\nu(E)\ge0$ を満たすとき $P$ を**正集合**、$\le0$ のとき**負集合**という。
:::

::: remark
級数 $\sum\nu(E_{j})$ は**絶対収束**する：$E_{j}$ を並べ替えても和集合は同じなので、級数はどの並べ方でも同じ値に収束し、\ref{calc:riemann-rearrangement} から絶対収束する。差 $\nu=\nu_{1}-\nu_{2}$（$\nu_{i}$ は有限測度）は符号付き測度。
:::

::: lemma 正の部分集合 {#meas:positive-subset keywords="if nu(E) > 0 then E contains a positive set A with nu(A) >= nu(E); countable unions of positive sets are positive" index="正の部分集合の補題|せいのぶぶんしゅうごうのほだい"}
$\nu$ を符号付き測度とする。
1. 正集合の可算和は正集合。
2. $\nu(E)>0$ なら、正集合 $A\subset E$ で $\nu(A)\ge\nu(E)$ となるものがある。
:::

::: proof
**1.** $P=\bigcup P_{j}$（$P_{j}$ は正）と可測な $B\subset P$ について、$B=\bigsqcup_{j}B\cap(P_{j}\setminus\bigcup_{i<j}P_{i})$ の各項は $P_{j}$ の部分集合で $\nu\ge0$、和も $\ge0$。

**2.** $E_{0}\defeq E$ とし、帰納的に次を行う。$E_{k}$ が正集合なら止める。そうでなければ、可測な $B\subset E_{k}$ で $\nu(B)<-\frac1n$ となるものがある最小の自然数を $n_{k+1}$ とし、そのような $B$ を一つ選んで $B_{k+1}$、$E_{k+1}\defeq E_{k}\setminus B_{k+1}$ とする（従属選択公理）。止まった場合、$\nu(E_{k})=\nu(E)-\sum_{i\le k}\nu(B_{i})\ge\nu(E)$ で $A\defeq E_{k}$。止まらない場合、$A\defeq E\setminus\bigcup_{k}B_{k}$ とすると、$\nu(\bigsqcup B_{k})=\sum\nu(B_{k})$ は収束するので $\nu(B_{k})\to0$、よって $n_{k}\to\infty$。$\nu(A)=\nu(E)-\sum\nu(B_{k})\ge\nu(E)$。$A$ が正でないとすると、$\nu(B)<0$ の $B\subset A$ があり、$\nu(B)<-\frac1m$ となる $m$ をとる。$n_{k}>m$ となる $k$ について $B\subset A\subset E_{k-1}$ なので、$n_{k}$ の最小性に反する。
:::

::: theorem ハーン分解 {#meas:hahn-decomposition keywords="Hahn decomposition: X = P sqcup N with P positive and N negative for a finite signed measure; unique up to null sets" index="ハーン分解|はーんぶんかい"}
符号付き測度 $\nu$ について、正集合 $P$ と負集合 $N$ で $X=P\sqcup N$ となるものがある。別の分解 $X=P'\sqcup N'$ について、$P\triangle P'$ の可測な部分集合はすべて $\nu$ の値 $0$ をとる。
:::

::: proof
**Step 1（最大の正集合）.** $m\defeq\sup\{\nu(A):A\text{ は正集合}\}$（$\varnothing$ は正なので $m\ge0$）とし、正集合 $P_{j}$ で $\nu(P_{j})\to m$ となるものを選ぶ（可算選択公理）。$P\defeq\bigcup P_{j}$ は正集合（\ref{meas:positive-subset.1}）で、$\nu(P)=\nu(P_{j})+\nu(P\setminus P_{j})\ge\nu(P_{j})$ なので $\nu(P)=m$。とくに $m<\infty$。

**Step 2（補集合は負）.** $N\defeq X\setminus P$ が負でないとすると、$E\subset N$ で $\nu(E)>0$ となるものがあり、\ref{meas:positive-subset.2} から正集合 $A\subset E$ で $\nu(A)>0$。$P\cup A$ は正集合で $\nu(P\cup A)=m+\nu(A)>m$ となり矛盾。

**Step 3（一意性）.** $E\subset P\setminus P'=P\cap N'$ なら $E$ は正集合 $P$ と負集合 $N'$ の両方の部分集合なので $\nu(E)=0$。$P'\setminus P$ も同様。
:::

::: corollary ジョルダン分解 {#meas:jordan-decomposition keywords="Jordan decomposition nu = nu^+ - nu^- into mutually singular finite measures; total variation |nu|" index="ジョルダン分解|じょるだんぶんかい, 全変動（測度）|ぜんへんどうそくど"}
符号付き測度 $\nu$ とハーン分解 $X=P\sqcup N$ について、$\nu^{+}(E)\defeq\nu(E\cap P)$, $\nu^{-}(E)\defeq-\nu(E\cap N)$ は有限測度で $\nu=\nu^{+}-\nu^{-}$、$\nu^{+}(N)=\nu^{-}(P)=0$。これらは分解の選び方によらない。$|\nu|\defeq\nu^{+}+\nu^{-}$ を**全変動**という。
:::

::: proof
$\nu^{\pm}$ が非負で可算加法的なことは $P$, $N$ の定義から。分解によらないこと：\ref{meas:hahn-decomposition} の Step 3 から $\nu(E\cap P)=\nu(E\cap P')$（差は $P\triangle P'$ の部分集合）。
:::

## 絶対連続と特異 {#meas:sec-rn-continuity}

::: definition 絶対連続と互いに特異 {#meas:absolutely-continuous keywords="absolute continuity nu << mu: mu(E)=0 implies nu(E)=0; mutually singular measures: concentrated on disjoint sets" index="絶対連続（測度）|ぜったいれんぞくそくど, 互いに特異|たがいにとくい"}
$\mu$ を測度、$\nu$ を測度または符号付き測度とする。
1. $\mu(E)=0\Rightarrow\nu(E)=0$（$\nu$ が符号付きなら $|\nu|(E)=0$）のとき、$\nu$ は $\mu$ に関して**絶対連続**といい、$\nu\ll\mu$ と書く。
2. 二つの測度 $\nu_{1},\nu_{2}$ について、$X=A\sqcup B$ で $\nu_{1}(B)=0$, $\nu_{2}(A)=0$ となるものがあるとき、**互いに特異**といい、$\nu_{1}\perp\nu_{2}$ と書く。
:::

::: proposition ε-δ による特徴づけ {#meas:absolute-continuity-epsilon-delta keywords="a finite measure nu is absolutely continuous with respect to mu iff for every epsilon there is delta with mu(E) < delta implying nu(E) < epsilon" index="絶対連続の ε-δ 特徴づけ|ぜったいれんぞくのいぷしろんでるたとくちょうづけ"}
有限測度 $\nu$ について、$\nu\ll\mu\iff$ 任意の $\varepsilon>0$ に対し $\delta>0$ があって、$\mu(E)<\delta\Rightarrow\nu(E)<\varepsilon$。
:::

::: proof
$\Leftarrow$：$\mu(E)=0$ ならすべての $\varepsilon$ で $\nu(E)<\varepsilon$。$\Rightarrow$：否定を仮定すると、ある $\varepsilon>0$ と $E_{n}$ で $\mu(E_{n})<2^{-n}$, $\nu(E_{n})\ge\varepsilon$ となるものがある（可算選択公理）。$F\defeq\limsup E_{n}$ は、\ref{meas:borel-cantelli} から $\mu(F)=0$。一方 $G_{k}\defeq\bigcup_{n\ge k}E_{n}\downarrow F$ で $\nu(G_{k})\ge\varepsilon$、$\nu$ は有限なので上からの連続性（\ref{meas:measure-properties.5}）から $\nu(F)\ge\varepsilon$。$\nu\ll\mu$ に反する。

::: hypcheck
- **$\nu$ の有限性**は上からの連続性に使った。外すと偽：$(0,1)$ 上で $d\nu=\frac1x\,dx$ は $\lambda$ に関して絶対連続だが、$\nu((0,\delta))=\infty$。
:::
:::

## ラドン–ニコディムの定理 {#meas:sec-rn-theorem}

::: theorem ラドン–ニコディムの定理 {#meas:radon-nikodym keywords="Radon-Nikodym theorem: for sigma-finite mu and nu with nu << mu there is a measurable f >= 0 with nu(E) = int_E f dmu; f is unique a.e. (Radon-Nikodym derivative dnu/dmu)" index="ラドン–ニコディムの定理|らどんにこでぃむのていり, ラドン–ニコディム導関数|らどんにこでぃむどうかんすう"}
$\mu$, $\nu$ を $(X,\mathcal{M})$ 上の σ 有限な測度とし、$\nu\ll\mu$ とする。可測な $f\colon X\to[0,\infty)$ で、すべての $E\in\mathcal{M}$ について
$$
\nu(E)=\int_{E}f\,d\mu
$$
となるものがあり、$f$ はほとんど至る所（$\mu$）一意に定まる。$f$ を $\frac{d\nu}{d\mu}$ と書き、**ラドン–ニコディム導関数**という。
:::

::: proof
**Step 1（有限の場合：候補の族）.** まず $\mu(X),\nu(X)<\infty$ とする。$\mathcal{F}\defeq\{f\colon X\to[0,\infty]\text{ 可測}:\int_{E}f\,d\mu\le\nu(E)\ (\forall E)\}$ とおく。$0\in\mathcal{F}$。$f,g\in\mathcal{F}$ なら $\max(f,g)\in\mathcal{F}$：$E$ を $E\cap\{f\ge g\}$ と $E\cap\{f<g\}$ に分けて、それぞれで $f$, $g$ の不等式を使う。

**Step 2（最大元）.** $a\defeq\sup_{f\in\mathcal{F}}\int f\,d\mu\le\nu(X)<\infty$。$f_{n}\in\mathcal{F}$ を $\int f_{n}\to a$ となるように選び（可算選択公理）、$g_{n}\defeq\max(f_{1},\dots,f_{n})\in\mathcal{F}$ は増加列で、極限 $f$ について \ref{meas:monotone-convergence} から $\int_{E}f=\lim\int_{E}g_{n}\le\nu(E)$、$\int f=a$。よって $f\in\mathcal{F}$ で、最大の積分をもつ。

**Step 3（残りは $0$）.** $\nu_{0}(E)\defeq\nu(E)-\int_{E}f\,d\mu\ge0$ は有限測度で（\ref{meas:density-measure}）、$\nu_{0}\ll\mu$。$\nu_{0}(X)>0$ と仮定する。$\mu(X)=0$ なら $\nu(X)=0$ で矛盾なので $\mu(X)>0$、$\varepsilon>0$ を $\nu_{0}(X)-\varepsilon\mu(X)>0$ となるようにとる。符号付き測度 $\nu_{0}-\varepsilon\mu$ のハーン分解 $X=P\sqcup N$（\ref{meas:hahn-decomposition}）をとると、$N$ は負集合なので $(\nu_{0}-\varepsilon\mu)(P)\ge(\nu_{0}-\varepsilon\mu)(X)>0$、よって $\nu_{0}(P)>0$ で、$\nu_{0}\ll\mu$ から $\mu(P)>0$。任意の $E$ について、$P$ は正集合なので $\varepsilon\mu(E\cap P)\le\nu_{0}(E\cap P)\le\nu_{0}(E)$ で
$$
\int_{E}(f+\varepsilon\mathbf{1}_{P})\,d\mu=\int_{E}f\,d\mu+\varepsilon\mu(E\cap P)\le\int_{E}f\,d\mu+\nu_{0}(E)=\nu(E).
$$
よって $f+\varepsilon\mathbf{1}_{P}\in\mathcal{F}$ で積分は $a+\varepsilon\mu(P)>a$、$a$ の定義に反する。したがって $\nu_{0}=0$。$\int f\le\nu(X)<\infty$ なので $f<\infty$（a.e.、\ref{meas:markov.3}）で、$f=\infty$ の点で $0$ に置き換えてよい。

**Step 4（σ 有限の場合）.** $\mu$, $\nu$ の σ 有限性の分割の共通細分をとり、互いに素な $X_{k}$ で $\mu(X_{k}),\nu(X_{k})<\infty$、$X=\bigsqcup X_{k}$ とする。各 $X_{k}$ 上の制限に Step 1〜3 を使って $f_{k}$ を得て（可算選択公理）、$f\defeq\sum_{k}f_{k}\mathbf{1}_{X_{k}}$ とすると、$\nu(E)=\sum_{k}\nu(E\cap X_{k})=\sum_{k}\int_{E\cap X_{k}}f_{k}\,d\mu=\int_{E}f\,d\mu$（\ref{meas:termwise-integration.2}）。

**Step 5（一意性）.** $f,g$ がともに条件を満たすとする。$X_{k}$ を上のとおりとし $E\defeq\{f>g\}\cap X_{k}\cap\{g\le k\}$ とおくと、$\int_{E}g\le k\mu(X_{k})<\infty$ なので $\int_{E}(f-g)=\nu(E)-\nu(E)=0$。$E$ 上で $f-g>0$ なので $\mu(E)=0$（\ref{meas:markov.2}）。$k\to\infty$ の和をとって $\mu(\{f>g\})=0$。対称に $\mu(\{g>f\})=0$。

::: hypcheck
- **σ 有限性**：Step 4・5 で使い、Step 1〜3 は有限性に帰着した。外すと偽：$[0,1]$ 上の数え上げ測度 $\mu$ と $\nu=\lambda$ について、$\mu(E)=0\iff E=\varnothing$ なので $\nu\ll\mu$ だが、$\lambda(E)=\int_{E}f\,d\mu=\sum_{x\in E}f(x)$ となる $f$ があれば、1 点集合で $f(x)=0$、したがって $\lambda=0$ となり矛盾（\ref{meas:prob-ig-counting}）。
- **絶対連続性**は Step 3 で $\mu(P)>0$ を導くのに使った。
- **ハーン分解**（\ref{meas:hahn-decomposition}）は Step 3 で「$\nu_{0}$ が $\varepsilon\mu$ を上回る集合」を取り出すのに使った。
:::
:::

::: corollary 連鎖律 {#meas:radon-nikodym-chain-rule keywords="chain rule for Radon-Nikodym derivatives: d rho/d mu = (d rho/d nu)(d nu/d mu); integrals against nu: int g dnu = int g (dnu/dmu) dmu" index="ラドン–ニコディムの連鎖律|らどんにこでぃむのれんさりつ"}
σ 有限な測度 $\rho\ll\nu\ll\mu$ について $\frac{d\rho}{d\mu}=\frac{d\rho}{d\nu}\cdot\frac{d\nu}{d\mu}$（$\mu$-a.e.）。
:::

::: proof
\ref{meas:density-measure} の後半（$\int g\,d\nu=\int g\frac{d\nu}{d\mu}\,d\mu$）を $g=\frac{d\rho}{d\nu}\mathbf{1}_{E}$ に使うと $\rho(E)=\int_{E}\frac{d\rho}{d\nu}\,d\nu=\int_{E}\frac{d\rho}{d\nu}\frac{d\nu}{d\mu}\,d\mu$。一意性（\ref{meas:radon-nikodym}）。
:::

::: theorem ルベーグ分解 {#meas:lebesgue-decomposition keywords="Lebesgue decomposition: a sigma-finite nu splits uniquely as nu_a + nu_s with nu_a << mu and nu_s perpendicular to mu" index="ルベーグ分解|るべーぐぶんかい"}
$\mu$, $\nu$ を σ 有限な測度とすると、測度 $\nu_{a}\ll\mu$ と $\nu_{s}\perp\mu$ で $\nu=\nu_{a}+\nu_{s}$ となるものがただ一組ある。
:::

::: proof
**Step 1（存在）.** $\rho\defeq\mu+\nu$ は σ 有限で、$\mu\ll\rho$, $\nu\ll\rho$。\ref{meas:radon-nikodym} から $d\mu=h\,d\rho$, $d\nu=g\,d\rho$（$g,h\ge0$）。$A\defeq\{h>0\}$ とし、$\nu_{a}(E)\defeq\nu(E\cap A)$, $\nu_{s}(E)\defeq\nu(E\setminus A)$ とおく。$\mu(X\setminus A)=\int_{\{h=0\}}h\,d\rho=0$ と $\nu_{s}(A)=0$ から $\nu_{s}\perp\mu$。$\mu(E)=0$ なら $\int_{E}h\,d\rho=0$ なので $\rho$-a.e. に $E$ 上 $h=0$、すなわち $\rho(E\cap A)=0$、$\nu(E\cap A)=0$。よって $\nu_{a}\ll\mu$。

**Step 2（一意性）.** $\nu=\nu_{a}+\nu_{s}=\nu'_{a}+\nu'_{s}$ とし、$\nu_{s}$, $\nu'_{s}$ が集中する $\mu$ 零集合 $S$, $S'$（$\nu_{s}(X\setminus S)=0$ など）をとり $Z\defeq S\cup S'$（$\mu(Z)=0$）。$\nu_{a}(Z)=\nu'_{a}(Z)=0$（絶対連続）、$\nu_{s}(X\setminus Z)=\nu'_{s}(X\setminus Z)=0$ なので、任意の $E$ で
$$
\nu_{a}(E)=\nu_{a}(E\setminus Z)=\nu(E\setminus Z)=\nu'_{a}(E\setminus Z)=\nu'_{a}(E),\qquad\nu_{s}(E)=\nu(E\cap Z)=\nu'_{s}(E).
$$
:::

::: supplement
**高い視点：測度の「微分」.** ラドン–ニコディム導関数 $\frac{d\nu}{d\mu}$ は、二つの測度の比、つまり「$\mu$ を単位として測った $\nu$ の密度」で、連鎖律は微分の連鎖律と同じ形をしている。$\mathbb{R}^{n}$ のルベーグ測度について、$\frac{d\nu}{d\lambda}(x)$ が実際に $\lim_{r\to0}\frac{\nu(B(x,r))}{\lambda(B(x,r))}$ という微分の極限で与えられることは、次のページの微分定理で示す。確率論では、条件付き期待値がラドン–ニコディム導関数として定義され、測度の変換（ギルサノフの定理など）もこの言葉で書かれる。関数解析では、σ 有限なら $L^{1}(\mu)^{*}=L^{\infty}(\mu)$ の証明の中心がこの定理である（知られている）。比喩で言えば、$\mu$ が「地図上の面積」で $\nu$ が「人口」なら、ラドン–ニコディム導関数は「人口密度」で、絶対連続は「人のいない所には面積 $0$ の所にも人がいない」という条件、特異な部分は「面積 $0$ の点や線に集中した人口」である。

**符号付き測度の一般化.** 値として $+\infty$ か $-\infty$ の一方を許す符号付き測度や、複素数値の測度にも、ハーン分解・ジョルダン分解・ラドン–ニコディムの定理（σ 有限）が同様に成り立つことが知られている。
:::

## 問題 {#meas:sec-rn-problems}

::: problem {#meas:prob-rn-dirac}
$\mathbb{R}$ のボレル集合族上で $\nu\defeq\lambda\restriction[0,1]+\delta_{0}$（$\nu(E)=\lambda(E\cap[0,1])+\delta_{0}(E)$）の、$\lambda$ に関するルベーグ分解とラドン–ニコディム導関数を求めよ。
:::

::: solution
$\nu_{a}(E)\defeq\lambda(E\cap[0,1])=\int_{E}\mathbf{1}_{[0,1]}\,d\lambda$ は $\lambda$ に関して絶対連続で、$\frac{d\nu_{a}}{d\lambda}=\mathbf{1}_{[0,1]}$。$\nu_{s}\defeq\delta_{0}$ は $\{0\}$（$\lambda$ 零集合）に集中するので $\nu_{s}\perp\lambda$。一意性（\ref{meas:lebesgue-decomposition}）から、これがルベーグ分解。$\nu$ 自身は $\nu(\{0\})=1$, $\lambda(\{0\})=0$ なので $\lambda$ に関して絶対連続でない。
:::

::: problem {#meas:prob-rn-change-of-measure}
σ 有限な $\nu\ll\mu$ と、$\frac{d\nu}{d\mu}>0$（$\mu$-a.e.）について、$\mu\ll\nu$ で $\frac{d\mu}{d\nu}=\bigl(\frac{d\nu}{d\mu}\bigr)^{-1}$（$\nu$-a.e.）であることを示せ。
:::

::: solution
$f\defeq\frac{d\nu}{d\mu}$。$\nu(E)=0$ なら $\int_{E}f\,d\mu=0$ で、$f>0$（a.e.）なので $\mu(E)=0$（\ref{meas:markov.2}）。よって $\mu\ll\nu$。\ref{meas:density-measure} の後半を $g\defeq f^{-1}\mathbf{1}_{E}$（$f>0$ の点で定義、他は $0$）に使うと $\int_{E}f^{-1}\,d\nu=\int_{E}f^{-1}f\,d\mu=\mu(E)$（$\{f=0\}$ は $\mu$ 零集合）。一意性から $\frac{d\mu}{d\nu}=f^{-1}$（$\nu$-a.e.）。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{meas:sec-rn-exercises} にまとめた。
