# ルベーグ–スティルチェス測度と単調関数 {#meas:page-monotone-functions keywords="Lebesgue-Stieltjes measure of a right-continuous increasing function, outer regularity, singular measures have zero derivative almost everywhere, Lebesgue's theorem: monotone functions are differentiable almost everywhere, integral of the derivative of a monotone function, functions of bounded variation, Jordan decomposition of BV functions, absolutely continuous functions, fundamental theorem of calculus for Lebesgue integrals, Cantor function"}

単調増加な関数 $F$ は、区間 $(a,b]$ に $F(b)-F(a)$ を与える測度（**ルベーグ–スティルチェス測度**）を定める。この測度をルベーグ測度に関してルベーグ分解（\ref{meas:lebesgue-decomposition}）すると、絶対連続な部分の密度が $F$ の導関数で、特異な部分はほとんど至る所で微分に寄与しない。これから、**単調関数はほとんど至る所微分可能**というルベーグの定理が従う。さらに、微積分学の基本定理 $F(x)-F(a)=\int_{a}^{x}F'$ が成り立つ関数がちょうど**絶対連続関数**であることを示し、導関数がほとんど至る所 $0$ なのに定数でない**カントール関数**を作る。

## 記法と定義の確認 {#meas:sec-mo-notation}

::: notation
- 半環・前測度・拡張定理は \ref{meas:semiring}, \ref{meas:semiring-lemma}, \ref{meas:caratheodory-extension}。ルベーグ分解・ラドン–ニコディム・絶対連続の ε-δ 特徴づけは \ref{meas:lebesgue-decomposition}, \ref{meas:radon-nikodym}, \ref{meas:absolute-continuity-epsilon-delta}。ヴィタリの被覆補題・ルベーグの微分定理・積分関数の微分は \ref{meas:vitali-covering}, \ref{meas:lebesgue-differentiation}, \ref{meas:indefinite-integral-derivative}。カントール集合は \ref{meas:cantor-set}。
- 単調関数の片側極限 $F(x\pm)$ と不連続点の可算性は \ref{calc:monotone-function-limits}。
- $B(x,r)\defeq(x-r,x+r)$。$\int_{a}^{x}g\defeq\int_{[a,x]}g\,d\lambda$。
- **選択公理**：ラドン–ニコディムの定理（可算選択公理）を通して使う。
:::

## ルベーグ–スティルチェス測度 {#meas:sec-mo-stieltjes}

::: theorem ルベーグ–スティルチェス測度 {#meas:lebesgue-stieltjes keywords="for an increasing right-continuous F there is a unique Borel measure mu_F with mu_F((a,b]) = F(b) - F(a); it is outer regular; mu_F({x}) = F(x) - F(x-)" index="ルベーグ–スティルチェス測度|るべーぐすてぃるちぇすそくど"}
$F\colon\mathbb{R}\to\mathbb{R}$ を単調増加かつ右連続とする。
1. ボレル集合族上の測度 $\mu_{F}$ で $\mu_{F}((a,b])=F(b)-F(a)$（$a<b$）となるものがただ一つある。
2. （外正則性）ボレル集合 $B$ について $\mu_{F}(B)=\inf\{\mu_{F}(U):U\supset B\text{ は開集合}\}$。
3. $\mu_{F}(\{x\})=F(x)-F(x-)$、$\mu_{F}((a,b))=F(b-)-F(a)$。
:::

::: proof
**Step 1（有限加法性）.** 半環 $\mathcal{S}\defeq\{(a,b]\}\cup\{\varnothing\}$ 上で $\rho((a,b])\defeq F(b)-F(a)$ とおく。$(a,b]$ が互いに素な有限個の $(a_{j},b_{j}]$ の和なら、端点を並べると $a=c_{0}<c_{1}<\dots<c_{m}=b$ で各 $(a_{j},b_{j}]$ は $(c_{i-1},c_{i}]$ の一つで、$\rho$ は伸縮和で加法的。同様に、有限個の区間による被覆については劣加法的（\ref{meas:box-volume-finite-additivity} の 1 次元の場合と同じ格子の議論。長さ $b-a$ を $F(b)-F(a)$ に替えても、格子の小区間の値の和として計算できるので同じ）。

**Step 2（可算加法性）.** \ref{meas:box-volume-premeasure} の証明を、長さを $\rho$ に替えて繰り返す。そこで使った「端点を少し動かしても値が少ししか変わらない」ことは、右連続性から得られる：$\delta>0$ を $F(a+\delta)-F(a)<\varepsilon$ となるようにとり $K\defeq[a+\delta,b]$、各 $(a_{j},b_{j}]$ について $\eta_{j}>0$ を $F(b_{j}+\eta_{j})-F(b_{j})<\varepsilon2^{-j}$ となるようにとって、開区間 $(a_{j},b_{j}+\eta_{j})$ で $K$ を覆う。

**Step 3（1）.** \ref{meas:caratheodory-extension} から $\mu_{F}$ が存在し、$(-n,n]$ の値は有限なので σ 有限で一意。生成する σ-加法族はボレル集合族（\ref{meas:borel-generators.1}）。

**Step 4（2）.** $\mu_{F}(B)=\inf\{\sum\rho(I_{j}):B\subset\bigcup I_{j}\}$（\ref{meas:caratheodory-completion.2} から $\mu_{F}$ は外測度の制限）。被覆 $\sum\rho((a_{j},b_{j}])\le\mu_{F}(B)+\varepsilon$ をとり、Step 2 と同じく $(a_{j},b_{j}+\eta_{j})$ に広げると、和集合 $U$ は開集合で $\mu_{F}(U)\le\mu_{F}(B)+2\varepsilon$。

**Step 5（3）.** $\{x\}=\bigcap_{n}(x-\frac1n,x]$ と上からの連続性で $\mu_{F}(\{x\})=F(x)-\lim F(x-\frac1n)=F(x)-F(x-)$。$(a,b)=\bigcup_{n}(a,b-\frac1n]$ と下からの連続性。
:::

::: lemma 特異な測度の微分 {#meas:singular-derivative-zero keywords="if mu is an outer regular Borel measure on R finite on bounded sets and S is a Lebesgue null Borel set, then mu(S cap B(x,r)) / 2r -> 0 for Lebesgue almost every x" index="特異測度の微分|とくいそくどのびぶん"}
$\mu$ を有界集合に有限値をとる外正則なボレル測度、$S$ をボレル集合で $\lambda(S)=0$ とし、$\mu_{S}(E)\defeq\mu(E\cap S)$ とおく。ほとんどすべての $x$（$\lambda$）で $\lim_{r\to0}\frac{\mu_{S}(B(x,r))}{2r}=0$。
:::

::: proof
$t>0$ と有界開区間 $J$ を固定し、$E_{t}\defeq\{x\in J\setminus S:\limsup_{r\to0}\mu_{S}(B(x,r))/2r>t\}$ とおく。$\lambda^{*}(E_{t})=0$ を示せばよい（$J$ を $(-m,m)$、$t=\frac1k$ として可算和をとり、$S$ は零集合）。

$\varepsilon>0$ について、外正則性から開集合 $U\supset J\setminus S$ で $\mu(U)\le\mu(J\setminus S)+\varepsilon$ となるものをとる。$U\cap S\subset U\setminus(J\setminus S)$ なので $\mu_{S}(U)\le\mu(U)-\mu(J\setminus S)\le\varepsilon$（$\mu(J\setminus S)<\infty$）。$U'\defeq\{x:\overline{B(x,r)}\subset U\text{ かつ }\mu_{S}(B(x,r))>2tr\text{ となる }r>0\text{ がある}\}$ は開集合で（\ref{meas:maximal-function} と同じく、$B(x,r)\subset B(x',r+\delta)\subset U$ となる近くの $x'$ も属する。閉球 $\overline{B(x,r)}$ はコンパクトなので $\overline{B(x,r+2\delta)}\subset U$ となる $\delta>0$ があり、さらに $\mu_{S}(B(x,r))>2t(r+\delta)$ となるように小さくとる）、$E_{t}\subset U'$（$x\in E_{t}$ では小さい $r$ で $\overline{B(x,r)}\subset U$ かつ比が $t$ を超える）。$K\subset U'$ をコンパクトとすると、条件を満たす球の有限個で覆え、\ref{meas:vitali-covering} で互いに素な $B(x_{j},r_{j})$ を選んで
$$
\lambda(K)\le3\sum_{j}2r_{j}<\frac3t\sum_{j}\mu_{S}(B(x_{j},r_{j}))\le\frac3t\mu_{S}(U)\le\frac{3\varepsilon}{t}.
$$
内正則性から $\lambda(U')\le3\varepsilon/t$、よって $\lambda^{*}(E_{t})\le3\varepsilon/t$。$\varepsilon\to0$。
:::

## 単調関数の微分可能性 {#meas:sec-mo-lebesgue}

::: theorem ルベーグの微分定理（単調関数） {#meas:monotone-differentiable keywords="Lebesgue's theorem: a monotone function on R is differentiable with finite derivative almost everywhere, and int_a^b F' <= F(b) - F(a)" index="単調関数の微分可能性|たんちょうかんすうのびぶんかのうせい, ルベーグの定理（単調関数）|るべーぐのていりたんちょうかんすう"}
$F\colon\mathbb{R}\to\mathbb{R}$ を単調増加とする。$F$ はほとんど至る所微分可能で、$F'$ は局所可積分、$a<b$ について $\int_{a}^{b}F'\le F(b)-F(a)$。
:::

::: proof
**Step 1（右連続化）.** $G(x)\defeq F(x+)$ は単調増加かつ右連続で、$F$ の連続点で $G=F$。不連続点は可算（\ref{calc:monotone-function-limits.2}）。また $G(y-)\le F(y)\le G(y)$（$F(y)\le F(y+)=G(y)$、$z<y$ なら $G(z)=F(z+)\le F(y)$）。

**Step 2（分解）.** \ref{meas:lebesgue-stieltjes} の $\mu_{G}$ は σ 有限なので、\ref{meas:lebesgue-decomposition} と \ref{meas:radon-nikodym} から $\mu_{G}=f\,d\lambda+\mu_{s}$、$\mu_{s}\perp\lambda$。$\mu_{s}$ はボレル零集合 $S$ に集中し、$\mu_{s}(E)=\mu_{s}(E\cap S)\le\mu_{G}(E\cap S)$ だが、$f\,d\lambda$ は $S$ 上 $0$ なので $\mu_{s}(E)=\mu_{G}(E\cap S)$。$\int_{(a,b]}f\le\mu_{G}((a,b])<\infty$ なので $f\in L^{1}_{\mathrm{loc}}$。

**Step 3（$G$ の微分）.** $x$ を、$f$ のルベーグ点で、\ref{meas:singular-derivative-zero}（$\mu=\mu_{G}$）の極限が $0$ になる点とする（ほとんどすべての $x$）。$h>0$ なら
$$
\frac{G(x+h)-G(x)}{h}=\frac1h\int_{(x,x+h]}f+\frac{\mu_{s}((x,x+h])}{h},
$$
第 1 項は $f(x)$ に収束し（\ref{meas:indefinite-integral-derivative} の証明）、第 2 項は $\le\frac{\mu_{s}(B(x,2h))}{h}=4\cdot\frac{\mu_{s}(B(x,2h))}{2\cdot2h}\to0$。$h<0$ も $(x+h,x]$ で同様。よって $G'(x)=f(x)$。

**Step 4（$F$ に戻す）.** さらに $x$ を $F$ の連続点とする（可算個を除く）。$G'(x)=L$ とし、$y\ne x$ について $\frac{G(y-)-G(x)}{y-x}=\lim_{z\to y,\,z<y}\frac{G(z)-G(x)}{z-x}$ も、$y$ が $x$ に近ければ $L$ に近い。Step 1 の $G(y-)\le F(y)\le G(y)$ と $F(x)=G(x)$ から、$\frac{F(y)-F(x)}{y-x}$ は二つの差分商の間にあり（$y<x$ では分母が負で不等号が逆になるが、間にあることは変わらない）、$L$ に収束する。よって $F'(x)=f(x)$。

**Step 5（積分の不等式）.** $F'=f$（a.e.）で $\int_{a}^{b}f=\int_{(a,b)}f\le\mu_{G}((a,b))=G(b-)-G(a)\le F(b)-F(a)$（Step 1 から $G(b-)\le F(b)$, $G(a)=F(a+)\ge F(a)$）。
:::

::: definition 有界変動関数 {#meas:bounded-variation keywords="total variation of a function on [a,b]; functions of bounded variation; a BV function is a difference of two increasing functions and is differentiable a.e." index="有界変動|ゆうかいへんどう, 全変動（関数）|ぜんへんどうかんすう"}
$F\colon[a,b]\to\mathbb{R}$ と分割 $a=x_{0}<\dots<x_{m}=b$ について $\sum_{i}|F(x_{i})-F(x_{i-1})|$ の上限を $V_{a}^{b}F$（**全変動**）といい、有限のとき $F$ は**有界変動**であるという。
:::

::: proposition 有界変動関数のジョルダン分解 {#meas:bv-jordan keywords="V(x) = V_a^x F and V - F are increasing, so a BV function is the difference of two increasing functions and is differentiable almost everywhere" index="有界変動関数の分解|ゆうかいへんどうかんすうのぶんかい"}
有界変動な $F$ について、$V(x)\defeq V_{a}^{x}F$ と $V-F$ は単調増加。とくに $F=V-(V-F)$ は単調増加関数の差で、ほとんど至る所微分可能。
:::

::: proof
$a\le x<y\le b$ について、$[a,x]$ の分割に $y$ を付け加えたものは $[a,y]$ の分割なので $V(y)\ge V(x)+|F(y)-F(x)|$（全変動の加法性の「$\ge$」の向き）。よって $V(y)-V(x)\ge|F(y)-F(x)|\ge F(y)-F(x)$ で、$V$ と $V-F$ は増加。微分可能性は \ref{meas:monotone-differentiable}（$[a,b]$ の外へは定数で延ばす）。
:::

## 絶対連続関数 {#meas:sec-mo-absolutely-continuous}

::: definition 絶対連続関数 {#meas:absolutely-continuous-function keywords="absolutely continuous function on [a,b]: for every epsilon there is delta such that finitely many disjoint intervals of total length < delta have total oscillation < epsilon" index="絶対連続関数|ぜったいれんぞくかんすう"}
$F\colon[a,b]\to\mathbb{R}$ が**絶対連続**であるとは、任意の $\varepsilon>0$ について $\delta>0$ があって、互いに交わらない有限個の区間 $(a_{i},b_{i})\subset[a,b]$ で $\sum(b_{i}-a_{i})<\delta$ なら $\sum|F(b_{i})-F(a_{i})|<\varepsilon$ となることをいう。
:::

::: theorem 微積分学の基本定理（ルベーグ積分） {#meas:ftc-lebesgue keywords="for F on [a,b] the following are equivalent: F is absolutely continuous; F(x) = F(a) + int_a^x g for some integrable g; F is differentiable a.e. with integrable derivative and F(x) = F(a) + int_a^x F'" index="微積分学の基本定理（ルベーグ積分）|びせきぶんがくのきほんていりるべーぐせきぶん"}
$F\colon[a,b]\to\mathbb{R}$ について次は同値。
1. $F$ は絶対連続。
2. 可積分な $g$ で、すべての $x\in[a,b]$ について $F(x)=F(a)+\int_{a}^{x}g$ となるものがある。
3. $F$ はほとんど至る所微分可能で $F'$ は可積分、すべての $x$ で $F(x)=F(a)+\int_{a}^{x}F'$。
:::

::: proof
**3⇒2.** $g=F'$。

**2⇒1.** $\nu(E)\defeq\int_{E}|g|\,d\lambda$ は有限測度で $\nu\ll\lambda$。\ref{meas:absolute-continuity-epsilon-delta} の $\delta$ について、$\sum(b_{i}-a_{i})<\delta$ なら $\sum|F(b_{i})-F(a_{i})|\le\nu(\bigsqcup(a_{i},b_{i}))<\varepsilon$。

**1⇒3.** **Step 1（有界変動）.** $\varepsilon=1$ の $\delta$ について、$[a,b]$ を長さ $<\delta$ の $N$ 個の小区間に分けると、各小区間の上の全変動は $\le1$（その分割の区間は互いに交わらず長さの和 $<\delta$）なので $V_{a}^{b}F\le N$。

**Step 2（$V$ も絶対連続）.** $\varepsilon$ と $F$ の $\delta$ をとる。互いに交わらない $(a_{i},b_{i})$ で長さの和 $<\delta$ なら、各 $[a_{i},b_{i}]$ の分割を合わせたものも長さの和 $<\delta$ の互いに交わらない区間族なので、$\sum_{i}V_{a_{i}}^{b_{i}}F\le\varepsilon$。$V(b_{i})-V(a_{i})=V_{a_{i}}^{b_{i}}F$（全変動の加法性：\ref{meas:bv-jordan} の証明の不等式と、逆向きは $[a,y]$ の分割に $x$ を加えて分ける）。とくに $V$ と $V-F$ は連続な増加関数で絶対連続。

**Step 3（増加する絶対連続関数は積分）.** $H$ を $[a,b]$ 上の連続な増加関数で絶対連続とし、$[a,b]$ の外へ定数で延ばして $\mu_{H}$（\ref{meas:lebesgue-stieltjes}）を作る。【主張：$\mu_{H}\ll\lambda$】$\lambda(E)=0$（ボレル）なら、$\varepsilon$ の $\delta$ について開集合 $U\supset E$, $\lambda(U)<\delta$ をとり（\ref{meas:lebesgue-regularity.1}）、$U$ を互いに交わらない開区間の可算和 $\bigsqcup_{k}(c_{k},d_{k})$ に書くと（開集合の連結成分）、有限個ずつ $\sum_{k\le K}\mu_{H}((c_{k},d_{k}))=\sum_{k\le K}(H(d_{k})-H(c_{k}))<\varepsilon$（$H$ は連続、区間は $[a,b]$ に制限して考える）。よって $\mu_{H}(E)\le\mu_{H}(U)\le\varepsilon$。\ref{meas:radon-nikodym} から $\mu_{H}=h\,d\lambda$ で、$H(x)-H(a)=\mu_{H}((a,x])=\int_{a}^{x}h$。

**Step 4（結論）.** Step 3 を $V$ と $V-F$ に使うと、可積分な $v,w$ で $F(x)-F(a)=\int_{a}^{x}(v-w)$。\ref{meas:indefinite-integral-derivative} から $F'=v-w$（a.e.）で可積分、$F(x)=F(a)+\int_{a}^{x}F'$。

::: hypcheck
- **絶対連続性**は Step 3 で $\mu_{H}\ll\lambda$ を導くのに使った。連続な増加関数でも絶対連続でなければ偽（\ref{meas:cantor-function}）。
- Step 3 の開集合の連結成分による分解は、$\mathbb{R}$ の開集合が互いに素な開区間の可算和であること（各成分は有理数を含む）による。
:::
:::

::: example カントール関数 {#meas:cantor-function keywords="Cantor function (devil's staircase): continuous increasing function on [0,1] from 0 to 1 with derivative 0 almost everywhere; not absolutely continuous; its Stieltjes measure is singular" index="カントール関数|かんとーるかんすう, 悪魔の階段|あくまのかいだん"}
$[0,1]$ 上の連続な単調増加関数 $\Phi$ で、$\Phi(0)=0$, $\Phi(1)=1$、ほとんど至る所 $\Phi'=0$ となるものがある。$\Phi$ は絶対連続でなく、$\int_{0}^{1}\Phi'=0<1=\Phi(1)-\Phi(0)$。
:::

::: proof
**Step 1（構成）.** \ref{meas:cantor-set} の $C_{k}$（長さ $3^{-k}$ の $2^{k}$ 個の閉区間）を使い、$\Phi_{k}$ を、$C_{k}$ の各区間の上で $2^{-k}$ だけ一次関数で増え、$[0,1]\setminus C_{k}$ の各区間の上で定数で、$\Phi_{k}(0)=0$ の連続関数とする（$\Phi_{k}(1)=2^{k}\cdot2^{-k}=1$）。$C_{k}$ の区間 $J$ の上で、$\Phi_{k+1}$ は左の $\frac13$ で $2^{-k-1}$ 増え、中央で定数、右の $\frac13$ で $2^{-k-1}$ 増えるので、$J$ の両端で $\Phi_{k+1}=\Phi_{k}$、$J$ 上で $|\Phi_{k+1}-\Phi_{k}|\le2^{-k}$、$J$ の外では $\Phi_{k+1}=\Phi_{k}$。よって $\Phi_{k}$ は一様コーシー列で、連続な単調増加関数 $\Phi$ に一様収束し、$\Phi(0)=0$, $\Phi(1)=1$。

**Step 2（導関数）.** $[0,1]\setminus C_{k}$ の区間の上では $m\ge k$ で $\Phi_{m}=\Phi_{k}$（定数）なので $\Phi$ も定数で、その内部で $\Phi'=0$。$[0,1]\setminus C$ はこれらの開区間の和で、$\lambda(C)=0$ なので、ほとんど至る所 $\Phi'=0$。

**Step 3（絶対連続でない）.** 絶対連続なら \ref{meas:ftc-lebesgue} から $\Phi(1)-\Phi(0)=\int_{0}^{1}\Phi'=0$ となり矛盾。$\mu_{\Phi}$ は $C$ に集中し（$[0,1]\setminus C$ の区間の上で $\Phi$ は定数）、$\lambda$ と互いに特異。
:::

::: supplement
**高い視点：関数と測度の辞書.** 右連続な増加関数 $F$ と、有界集合に有限値をとるボレル測度 $\mu$ は、$\mu((a,b])=F(b)-F(a)$ でほぼ一対一に対応する（$F$ は定数の差を除いて決まる）。この辞書のもとで、
- $F$ の跳び ⟷ $\mu$ の原子（1 点の正の測度）、
- $F$ が絶対連続 ⟷ $\mu\ll\lambda$、そのとき $F'$ ⟷ $\frac{d\mu}{d\lambda}$、
- カントール関数 ⟷ 原子のない特異測度、

が対応し、$\mu$ のルベーグ分解は $F$ を「跳びの部分 + 絶対連続な部分 + 連続な特異部分」に分けることにあたる。確率論では、$F$ は分布関数、この分解は確率分布を離散・絶対連続・特異連続の三つに分けることで、カントール関数は特異連続な分布の代表例である。比喩で言えば、単調関数は「累積の帳簿」で、その導関数は「各時刻の入金の速さ」だが、カントール関数は「速さはほとんどいつも $0$ なのに、測度 $0$ の時刻に気づかれずに入金されて残高が 1 増える」帳簿である。
:::

## 問題 {#meas:sec-mo-problems}

::: problem {#meas:prob-mo-lipschitz}
リプシッツ連続な $F\colon[a,b]\to\mathbb{R}$（$|F(x)-F(y)|\le L|x-y|$）は絶対連続で、ほとんど至る所 $|F'|\le L$、$F(x)=F(a)+\int_{a}^{x}F'$ であることを示せ。
:::

::: solution
$\delta\defeq\varepsilon/L$ ととれば、$\sum(b_{i}-a_{i})<\delta$ のとき $\sum|F(b_{i})-F(a_{i})|\le L\sum(b_{i}-a_{i})<\varepsilon$ なので絶対連続。\ref{meas:ftc-lebesgue} から $F$ はほとんど至る所微分可能で積分の等式が成り立ち、微分可能な点では差分商の絶対値が $\le L$ なので $|F'|\le L$。
:::

::: problem {#meas:prob-mo-jump}
$F\defeq\mathbf{1}_{[0,\infty)}$ の $\mu_{F}$ が $\delta_{0}$ であること、$F'=0$（$x\neq0$）で $\int_{-1}^{1}F'=0<1=F(1)-F(-1)$ であることを確かめよ。
:::

::: solution
$F$ は増加で右連続。$\mu_{F}((a,b])=F(b)-F(a)$ は $0\in(a,b]$ のとき $1$、そうでなければ $0$ で、$\delta_{0}((a,b])$ に等しいので、一意性（\ref{meas:lebesgue-stieltjes.1}）から $\mu_{F}=\delta_{0}$。$x\ne0$ の近くで $F$ は定数なので $F'(x)=0$。$\mu_{F}$ は $\lambda$ と互いに特異で（$\{0\}$ に集中）、\ref{meas:monotone-differentiable} の不等式が真の不等式になる例。
:::
