# ルベーグ積分（Lebesgue Integration）

非負可測関数の積分と単調収束定理・ファトゥの補題、可積分関数と優収束定理・リーマン積分との関係、積測度とフビニ–トネリの定理、Lᵖ 空間、符号付き測度とラドン–ニコディムの定理、微分定理、変数変換公式。

<p class="mn-msc">MSC2020: 28A20, 28A25, 28A35, 26A42, 46E30</p>

## 前提知識

- [測度とルベーグ積分 › 測度](../../../04-analysis/03-measure-theory/01-measures/index.html)（全体、4 ページ）：測度・ルベーグ測度・可測関数
- [実解析 › 多変数解析](../../../04-analysis/01-real-analysis/03-multivariable-calculus/index.html)（全体、11 ページ）：リーマン積分・ジョルダン可測・逆関数定理（比較と変数変換）
- [実解析 › 一変数の微積分](../../../04-analysis/01-real-analysis/02-calculus/index.html)（全体、11 ページ）：リーマン積分と微積分学の基本定理
- [一般位相 › 距離空間](../../../05-geometry-topology/01-general-topology/06-metric-spaces/index.html)（全体、12 ページ）：完備距離空間
