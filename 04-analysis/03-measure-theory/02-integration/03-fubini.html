# 積測度とフビニ–トネリの定理 {#meas:page-fubini keywords="product sigma-algebra, measurable rectangles, sections of measurable sets and functions, product measure, Tonelli's theorem, Fubini's theorem, sigma-finiteness, counterexamples, Lebesgue measure on R^{m+n} as the completion of the product, Borel version of a Lebesgue measurable function, Cavalieri's principle, Gaussian integral"}

二つの測度空間の直積の上に、長方形 $A\times B$ に $\mu(A)\nu(B)$ を与える測度（**積測度**）を作り、その上の積分が累次積分で計算できることを示す。非負の関数なら無条件で（**トネリの定理**）、符号のある関数なら可積分であれば（**フビニの定理**）、積分の順序を交換してよい。証明の要は、π-λ 定理（\ref{meas:pi-lambda}）による「長方形で成り立てば可測集合全体で成り立つ」という論法と、単調収束定理である。σ 有限性と可積分性がどちらも外せないことを反例で確かめる。最後に、$\mathbb{R}^{m+n}$ のルベーグ測度が積測度の完備化であることと、ルベーグ可測関数に対するフビニの定理の形を示す。

## 記法と定義の確認 {#meas:sec-fb-notation}

::: notation
- $(X,\mathcal{M},\mu)$, $(Y,\mathcal{N},\nu)$ を測度空間とする。σ 有限は \ref{meas:measure}、π-λ 定理と測度の一意性は \ref{meas:pi-lambda}, \ref{meas:measure-uniqueness}。
- 単調収束定理・加法性・優収束定理・可積分関数は \ref{meas:monotone-convergence}, \ref{meas:termwise-integration}, \ref{meas:dominated-convergence}, \ref{meas:integrable}。
- $E\subset X\times Y$ と $x\in X$, $y\in Y$ について、**切り口**を $E_{x}\defeq\{y:(x,y)\in E\}$, $E^{y}\defeq\{x:(x,y)\in E\}$、関数 $f$ について $f_{x}\defeq f(x,\cdot)$, $f^{y}\defeq f(\cdot,y)$ と書く。
- リーマン積分版は \ref{calc:fubini}。
- **選択公理**：使わない。
:::

## 積 σ-加法族と切り口 {#meas:sec-fb-product-sigma}

::: definition 積 σ-加法族 {#meas:product-sigma-algebra keywords="product sigma-algebra generated by measurable rectangles A x B" index="積 σ-加法族|せきしぐまかほうぞく, 可測長方形|かそくちょうほうけい"}
$A\in\mathcal{M}$, $B\in\mathcal{N}$ について $A\times B$ を**可測長方形**といい、その全体が生成する σ-加法族を $\mathcal{M}\otimes\mathcal{N}$ と書く（**積 σ-加法族**）。可測長方形の全体は π 系で（$(A\times B)\cap(A'\times B')=(A\cap A')\times(B\cap B')$）、半環でもある（\ref{meas:semiring} の例 2）。
:::

::: proposition 切り口の可測性 {#meas:sections-measurable keywords="sections of sets in the product sigma-algebra are measurable; sections of product measurable functions are measurable; B(R^m) x B(R^n) = B(R^{m+n})" index="切り口|きりくち"}
1. $E\in\mathcal{M}\otimes\mathcal{N}$ なら、すべての $x$, $y$ で $E_{x}\in\mathcal{N}$, $E^{y}\in\mathcal{M}$。
2. $f\colon X\times Y\to\overline{\mathbb{R}}$ が $\mathcal{M}\otimes\mathcal{N}$ 可測なら、$f_{x}$ は $\mathcal{N}$ 可測、$f^{y}$ は $\mathcal{M}$ 可測。
3. $\mathcal{B}(\mathbb{R}^{m})\otimes\mathcal{B}(\mathbb{R}^{n})=\mathcal{B}(\mathbb{R}^{m+n})$。
:::

::: proof
**1.** $x$ を固定し $\mathcal{A}\defeq\{E\subset X\times Y:E_{x}\in\mathcal{N}\}$ とおく。$(A\times B)_{x}$ は $B$ か $\varnothing$ なので可測長方形は $\mathcal{A}$ に属し、$(E^{c})_{x}=(E_{x})^{c}$, $(\bigcup E_{n})_{x}=\bigcup(E_{n})_{x}$ から $\mathcal{A}$ は σ-加法族。よって $\mathcal{M}\otimes\mathcal{N}\subset\mathcal{A}$。$E^{y}$ も同様。

**2.** $(f_{x})^{-1}(C)=(f^{-1}(C))_{x}$ と 1。

**3.** $\supset$：$\mathcal{B}(\mathbb{R}^{m+n})$ は半開直方体 $I\times J$（$I$, $J$ はそれぞれ $\mathbb{R}^{m}$, $\mathbb{R}^{n}$ の半開直方体）で生成され（\ref{meas:borel-generators.1}）、これは可測長方形。$\subset$：$A\in\mathcal{B}(\mathbb{R}^{m})$ について $A\times\mathbb{R}^{n}$ は射影 $\mathbb{R}^{m+n}\to\mathbb{R}^{m}$（連続）による逆像なのでボレル（\ref{meas:measurability-generators.2}）、同様に $\mathbb{R}^{m}\times B$ もボレルで、$A\times B$ はその共通部分。
:::

## 積測度 {#meas:sec-fb-product-measure}

::: theorem 積測度 {#meas:product-measure keywords="for sigma-finite measures, x -> nu(E_x) and y -> mu(E^y) are measurable, their integrals agree and define the unique measure mu x nu on M x N with (mu x nu)(A x B) = mu(A) nu(B)" index="積測度|せきそくど"}
$\mu$, $\nu$ を σ 有限とする。$E\in\mathcal{M}\otimes\mathcal{N}$ について、$x\mapsto\nu(E_{x})$ は $\mathcal{M}$ 可測、$y\mapsto\mu(E^{y})$ は $\mathcal{N}$ 可測で
$$
\int_{X}\nu(E_{x})\,d\mu(x)=\int_{Y}\mu(E^{y})\,d\nu(y).
$$
この共通の値を $(\mu\otimes\nu)(E)$ と書くと、$\mu\otimes\nu$ は $\mathcal{M}\otimes\mathcal{N}$ 上の測度で、$(\mu\otimes\nu)(A\times B)=\mu(A)\nu(B)$ を満たすものはこれだけである。
:::

::: proof
**Step 1（有限測度の場合）.** $\mu(X),\nu(Y)<\infty$ とし、主張（可測性と積分の等式）が成り立つ $E$ の全体を $\mathcal{D}$ とする。
- 可測長方形：$\nu((A\times B)_{x})=\nu(B)\mathbf{1}_{A}(x)$, $\mu((A\times B)^{y})=\mu(A)\mathbf{1}_{B}(y)$ で、両辺の積分はともに $\mu(A)\nu(B)$。とくに $X\times Y\in\mathcal{D}$。
- 差：$E\subset F$ が $\mathcal{D}$ の元なら、$\nu((F\setminus E)_{x})=\nu(F_{x})-\nu(E_{x})$（有限測度なので引き算できる）は可測で、積分も（すべて有限なので）引き算できて等式が保たれる。
- 増加和：$E_{k}\uparrow E$ なら $\nu((E_{k})_{x})\uparrow\nu(E_{x})$（下からの連続性）で極限は可測、\ref{meas:monotone-convergence} から積分も極限をとれる。

よって $\mathcal{D}$ は可測長方形（π 系）を含む λ 系で、\ref{meas:pi-lambda} から $\mathcal{M}\otimes\mathcal{N}\subset\mathcal{D}$。

**Step 2（σ 有限の場合）.** $X_{k}\uparrow X$, $Y_{k}\uparrow Y$, $\mu(X_{k}),\nu(Y_{k})<\infty$ をとり、$\mu_{k}(A)\defeq\mu(A\cap X_{k})$, $\nu_{k}(B)\defeq\nu(B\cap Y_{k})$（有限測度）に Step 1 を使う。$\nu_{k}(E_{x})\uparrow\nu(E_{x})$ なので $x\mapsto\nu(E_{x})$ は可測。$\int\nu_{k}(E_{x})\,d\mu_{k}(x)=\int\nu_{k}(E_{x})\mathbf{1}_{X_{k}}(x)\,d\mu(x)$（\ref{meas:density-measure}）で、被積分関数は $k$ について増加し $\nu(E_{x})$ に収束するので、\ref{meas:monotone-convergence} から $\int\nu(E_{x})\,d\mu$ に収束する。他方の積分も同様で、Step 1 の等式の極限をとる。

**Step 3（測度）.** 互いに素な $E_{j}$ について $\nu((\bigsqcup E_{j})_{x})=\sum_{j}\nu((E_{j})_{x})$ で、\ref{meas:termwise-integration.2} から可算加法的。

**Step 4（一意性）.** 可測長方形は π 系で $\mathcal{M}\otimes\mathcal{N}$ を生成し、$X_{k}\times Y_{k}\uparrow X\times Y$ で値は有限。\ref{meas:measure-uniqueness}。

::: hypcheck
- **σ 有限性**：Step 1 の引き算（有限性）と Step 2 の近似、Step 4 の一意性に使った。外すと二つの累次積分が異なることがある（\ref{meas:fubini-counterexamples.1}）。
:::
:::

## トネリとフビニ {#meas:sec-fb-theorems}

::: theorem トネリの定理 {#meas:tonelli keywords="Tonelli's theorem: for nonnegative product measurable f on a product of sigma-finite spaces, the iterated integrals in either order equal the integral against the product measure" index="トネリの定理|とねりのていり"}
$\mu$, $\nu$ を σ 有限、$f\colon X\times Y\to[0,\infty]$ を $\mathcal{M}\otimes\mathcal{N}$ 可測とする。$x\mapsto\int_{Y}f(x,y)\,d\nu(y)$ は $\mathcal{M}$ 可測、$y\mapsto\int_{X}f(x,y)\,d\mu(x)$ は $\mathcal{N}$ 可測で
$$
\int_{X\times Y}f\,d(\mu\otimes\nu)=\int_{X}\Bigl(\int_{Y}f(x,y)\,d\nu(y)\Bigr)d\mu(x)=\int_{Y}\Bigl(\int_{X}f(x,y)\,d\mu(x)\Bigr)d\nu(y).
$$
:::

::: proof
$f=\mathbf{1}_{E}$ なら $\int_{Y}\mathbf{1}_{E}(x,y)\,d\nu(y)=\nu(E_{x})$ で、\ref{meas:product-measure} そのもの。非負の単関数は特性関数の非負の線形結合なので、積分の線形性（\ref{meas:simple-integral-properties.2}, \ref{meas:termwise-integration.1}）から成り立つ。一般の $f$ では単関数 $s_{n}\uparrow f$（\ref{meas:simple-approximation}）をとると、各 $x$ で $(s_{n})_{x}\uparrow f_{x}$ なので \ref{meas:monotone-convergence} から $\int(s_{n})_{x}\,d\nu\uparrow\int f_{x}\,d\nu$（可測関数の増加極限として可測）、さらに単調収束定理を $\mu$ について、また $\mu\otimes\nu$ について使う。
:::

::: theorem フビニの定理（ルベーグ積分） {#meas:fubini keywords="Fubini's theorem: for f integrable with respect to the product of sigma-finite measures, almost every section is integrable, the section integrals are integrable, and both iterated integrals equal the double integral" index="フビニの定理（ルベーグ積分）|ふびにのていりるべーぐせきぶん" refname="フビニの定理"}
$\mu$, $\nu$ を σ 有限、$f\in\mathcal{L}^{1}(\mu\otimes\nu)$（$\mathcal{M}\otimes\mathcal{N}$ 可測）とする。
1. ほとんどすべての $x$ で $f_{x}\in\mathcal{L}^{1}(\nu)$、ほとんどすべての $y$ で $f^{y}\in\mathcal{L}^{1}(\mu)$。
2. $x\mapsto\int_{Y}f(x,y)\,d\nu(y)$（定義される点で）はほとんど至る所定義された可積分関数で、$y$ についても同様。
3. $\displaystyle\int_{X\times Y}f\,d(\mu\otimes\nu)=\int_{X}\Bigl(\int_{Y}f\,d\nu\Bigr)d\mu=\int_{Y}\Bigl(\int_{X}f\,d\mu\Bigr)d\nu$。
:::

::: proof
**Step 1.** \ref{meas:tonelli} を $|f|$ に使うと $\int_{X}\bigl(\int_{Y}|f(x,y)|\,d\nu\bigr)d\mu=\int|f|\,d(\mu\otimes\nu)<\infty$ なので、\ref{meas:markov.3} から $N\defeq\{x:\int_{Y}|f_{x}|\,d\nu=\infty\}$（可測）は $\mu$ 零集合。$x\notin N$ で $f_{x}$ は可積分。

**Step 2.** $f^{\pm}$ に \ref{meas:tonelli} を使うと、$F^{\pm}(x)\defeq\int_{Y}f^{\pm}(x,y)\,d\nu(y)$ は可測で $\int F^{\pm}\,d\mu=\int f^{\pm}\,d(\mu\otimes\nu)<\infty$。$x\notin N$ で $F^{\pm}(x)<\infty$ で $\int_{Y}f_{x}\,d\nu=F^{+}(x)-F^{-}(x)$。$F\defeq(F^{+}-F^{-})\mathbf{1}_{N^{c}}$ は可積分で、$\int F\,d\mu=\int F^{+}-\int F^{-}=\int f^{+}-\int f^{-}=\int f\,d(\mu\otimes\nu)$（$N$ は零集合なので積分に影響しない）。$y$ についても同様。

::: hypcheck
- **可積分性**：Step 1 で $|f|$ の積分が有限であることを使った。外すと、二つの累次積分がどちらも存在して異なることがある（\ref{meas:fubini-counterexamples.2}）。実際に使うときは、まず \ref{meas:tonelli} を $|f|$ に使って可積分性を確かめるのが定石である。
- **σ 有限性**：\ref{meas:tonelli} を通して使った。
:::
:::

::: counterexample フビニ–トネリの前提が外れる例 {#meas:fubini-counterexamples keywords="without sigma-finiteness the iterated integrals of the diagonal differ (Lebesgue times counting measure on [0,1]); without integrability iterated sums differ on N x N" index="フビニの定理の反例|ふびにのていりのはんれい"}
1. （σ 有限でない）$X=Y=[0,1]$、$\mu=\lambda$（ボレル集合族上）、$\nu$ を数え上げ測度（ボレル集合族上）とし、対角線 $\Delta\defeq\{(x,x)\}$ を考える。$\Delta$ は閉集合なので $\mathcal{B}(\mathbb{R}^{2})\cap[0,1]^{2}=\mathcal{B}([0,1])\otimes\mathcal{B}([0,1])$ に属するが、$\int\nu(\Delta_{x})\,d\lambda=\int1\,d\lambda=1$、$\int\lambda(\Delta^{y})\,d\nu=\int0\,d\nu=0$。
2. （可積分でない）$X=Y=\mathbb{N}$（数え上げ測度）、$f(n,n)\defeq1$, $f(n,n+1)\defeq-1$、他は $0$ とする。$\sum_{n}f(n,m)=1$（$m=1$）、$0$（$m\ge2$）なので $\sum_{m}\sum_{n}f(n,m)=1$。一方 $\sum_{m}f(n,m)=f(n,n)+f(n,n+1)=0$ なので $\sum_{n}\sum_{m}f(n,m)=0$。
:::

::: proof
1. $\Delta_{x}=\{x\}$ で $\nu(\{x\})=1$、$\Delta^{y}=\{y\}$ で $\lambda(\{y\})=0$。数え上げ測度は $[0,1]$ 上 σ 有限でない（可算個の有限集合で非可算集合は覆えない）ので \ref{meas:product-measure} の仮定が崩れている。
2. 計算は上に書いたとおり。$\sum_{n,m}|f(n,m)|=\infty$ なので $f$ は積測度（数え上げ測度）について可積分でない。数え上げ測度の積分は和（\ref{meas:prob-ig-counting}）。
:::

## ルベーグ測度との関係 {#meas:sec-fb-lebesgue}

::: proposition ルベーグ測度は積測度の完備化 {#meas:lebesgue-product keywords="on Borel sets lambda_{m+n} = lambda_m x lambda_n; Lebesgue measure on R^{m+n} is the completion of the product of the Borel Lebesgue measures; Cavalieri's principle" index="カヴァリエリの原理|かう゛ぁりえりのげんり"}
1. $\mathcal{B}(\mathbb{R}^{m+n})$ 上で $\lambda_{m+n}=\lambda_{m}\otimes\lambda_{n}$（両辺ともボレル集合族に制限）。
2. （カヴァリエリの原理）$E\in\mathcal{B}(\mathbb{R}^{m+n})$ について $\lambda_{m+n}(E)=\int_{\mathbb{R}^{m}}\lambda_{n}(E_{x})\,dx$。
:::

::: proof
**1.** \ref{meas:sections-measurable.3} から両辺は同じ σ-加法族上の測度で、半開直方体 $I\times J$ で値 $v(I)v(J)=v(I\times J)$ が一致する。\ref{meas:lebesgue-basic.2} の一意性。**2.** 1 と \ref{meas:product-measure} の定義。
:::

::: lemma ボレル版 {#meas:borel-version keywords="every Lebesgue measurable function on R^n agrees almost everywhere with a Borel measurable function" index="ボレル版（可測関数）|ぼれるばんかそくかんすう"}
ルベーグ可測な $f\colon\mathbb{R}^{n}\to\overline{\mathbb{R}}$ について、ボレル可測な $g$ で $f=g$（a.e.）となるものがある。
:::

::: proof
有理数 $q$ ごとに $\{f>q\}\in\mathcal{L}_{n}$ なので、\ref{meas:lebesgue-regularity.3} の (d) から $F_{\sigma}$ 集合 $B_{q}\subset\{f>q\}$ で $\{f>q\}\setminus B_{q}$ が零集合となるものがある。ボレル零集合 $Z\supset\bigcup_{q}(\{f>q\}\setminus B_{q})$ をとり（\ref{meas:caratheodory-completion.1} の可測包。可算個の選択には可算選択公理を使う）、$g(x)\defeq\sup\{q\in\mathbb{Q}:x\in B_{q}\}$（$x\notin Z$）、$g\defeq0$（$x\in Z$）とおく。$x\notin Z$ なら $x\in B_{q}\iff f(x)>q$ なので $g(x)=\sup\{q:f(x)>q\}=f(x)$。$\{g>a\}=\bigl(\bigcup_{q>a}B_{q}\setminus Z\bigr)\cup Z_{a}$（$Z_{a}\defeq Z$（$a<0$）、$\varnothing$（$a\ge0$））はボレル集合（$x\notin Z$ では $g(x)>a\iff$ ある有理数 $q>a$ で $x\in B_{q}$）。
:::

::: theorem ルベーグ可測関数のフビニ–トネリ {#meas:fubini-lebesgue keywords="Fubini-Tonelli for Lebesgue measurable functions on R^{m+n}: for almost every x the section is Lebesgue measurable, and the iterated integrals equal the integral over R^{m+n}" index="フビニの定理（ルベーグ可測関数）|ふびにのていりるべーぐかそくかんすう"}
$f\colon\mathbb{R}^{m+n}\to\overline{\mathbb{R}}$ をルベーグ可測とし、$f\ge0$ または $f\in\mathcal{L}^{1}(\lambda_{m+n})$ とする。ほとんどすべての $x\in\mathbb{R}^{m}$ で $f_{x}$ はルベーグ可測で、
$$
\int_{\mathbb{R}^{m+n}}f\,d\lambda_{m+n}=\int_{\mathbb{R}^{m}}\Bigl(\int_{\mathbb{R}^{n}}f(x,y)\,dy\Bigr)dx
$$
（$f\in\mathcal{L}^{1}$ のときは、内側の積分がほとんどすべての $x$ で有限で、外側の被積分関数は a.e. に定義された可積分関数）。$y$ についても同様。
:::

::: proof
\ref{meas:borel-version} から、ボレル可測な $g$ とボレル零集合 $Z$ で、$Z$ の外で $f=g$ となるものをとる（$f\ge0$ なら $g\ge0$ にとれる：$\max(g,0)$）。\ref{meas:tonelli} と \ref{meas:lebesgue-product} を $\mathbf{1}_{Z}$ に使うと $\int\lambda_{n}(Z_{x})\,dx=\lambda_{m+n}(Z)=0$ なので、ほとんどすべての $x$ で $\lambda_{n}(Z_{x})=0$。そのような $x$ では $f_{x}=g_{x}$（$Z_{x}$ の外）で、$g_{x}$ はボレル可測（\ref{meas:sections-measurable.2}）、ルベーグ測度は完備なので $f_{x}$ はルベーグ可測（\ref{meas:ae-measurable.1}）で $\int f_{x}=\int g_{x}$。$g$ に \ref{meas:tonelli}（または \ref{meas:fubini}）を使い、$\int f\,d\lambda_{m+n}=\int g\,d\lambda_{m+n}$ と合わせる。
:::

::: supplement
**リーマン積分版との比較.** リーマン積分版の \ref{calc:fubini} は、切り口がリーマン積分可能とは限らないので、上積分と下積分で述べる必要があった。ルベーグ積分版では、切り口の可測性は（ほとんど至る所）自動で、条件は「非負」か「可積分」だけになる。

**高い視点：テンソル積としての積測度.** 積測度は、長方形の上では値の積 $\mu(A)\nu(B)$ をとる唯一の測度で、関数の側では $\int\varphi(x)\psi(y)\,d(\mu\otimes\nu)=\int\varphi\,d\mu\int\psi\,d\nu$ を満たす。この意味で $\mu\otimes\nu$ は測度のテンソル積で、フビニの定理は「二変数の関数の積分を、一変数ずつの積分の合成として計算してよい」という**累次化**の原理である。σ 有限性の条件は、測度空間の圏で積がうまく振る舞うための「小ささ」の条件で、反例（\ref{meas:fubini-counterexamples.1}）は、数え上げ測度のように大きすぎる測度ではテンソル積が一つに決まらないことを示している。比喩で言えば、積測度は「縦と横の目盛りから作った方眼紙」で、フビニの定理は「方眼紙の上の量を、行ごとに足してから合計しても、列ごとに足してから合計しても同じ」という保証であり、それが崩れるのは、総量が無限で足し方によって打ち消し方が変わるとき（可積分でない）か、目盛りが細かすぎて方眼紙が作れないとき（σ 有限でない）である。
:::

## 問題 {#meas:sec-fb-problems}

::: problem {#meas:prob-fb-gaussian}
$I\defeq\int_{0}^{\infty}e^{-x^{2}}\,dx$ について、$[0,\infty)^{2}$ 上の非負連続関数 $y\,e^{-(1+x^{2})y^{2}}$ の積分を二通りの順序で計算して $I=\frac{\sqrt{\pi}}{2}$ を示せ。
:::

::: solution
$h(x,y)\defeq ye^{-(1+x^{2})y^{2}}\ge0$ は連続なのでボレル可測。\ref{meas:tonelli} から二つの累次積分は等しい（1 次元の非負連続関数のルベーグ積分は広義リーマン積分に等しい、\ref{meas:improper-lebesgue.1}）。

$y$ を先に積分：$x\ge0$ を固定すると $\int_{0}^{\infty}ye^{-(1+x^{2})y^{2}}dy=\Bigl[-\frac{e^{-(1+x^{2})y^{2}}}{2(1+x^{2})}\Bigr]_{0}^{\infty}=\frac{1}{2(1+x^{2})}$。続いて $\int_{0}^{\infty}\frac{dx}{2(1+x^{2})}=\frac{\pi}{4}$。

$x$ を先に積分：$y>0$ を固定し $u=xy$ と置換すると $\int_{0}^{\infty}ye^{-y^{2}}e^{-x^{2}y^{2}}dx=e^{-y^{2}}\int_{0}^{\infty}e^{-u^{2}}du=e^{-y^{2}}I$（$y=0$ では $0$）。続いて $\int_{0}^{\infty}e^{-y^{2}}I\,dy=I^{2}$。

よって $I^{2}=\frac{\pi}{4}$、$I>0$ なので $I=\frac{\sqrt{\pi}}{2}$。
:::

::: problem {#meas:prob-fb-layer-cake}
$\sigma$ 有限な $(X,\mathcal{M},\mu)$ と可測関数 $f\colon X\to[0,\infty]$ について
$$
\int_{X}f\,d\mu=\int_{0}^{\infty}\mu(\{f>t\})\,dt
$$
を示せ（右辺は $[0,\infty)$ 上のルベーグ測度についての積分）。
:::

::: solution
$E\defeq\{(x,t)\in X\times[0,\infty):f(x)>t\}$ とおく。$E=\bigcup_{q\in\mathbb{Q}_{\ge0}}\{f>q\}\times[0,q)$（$f(x)>t$ なら $f(x)>q>t$ となる有理数 $q$ がある）なので $E\in\mathcal{M}\otimes\mathcal{B}([0,\infty))$。\ref{meas:tonelli} を $\mathbf{1}_{E}$ に使う：$x$ を固定すると $\lambda(E_{x})=\lambda([0,f(x)))=f(x)$、$t$ を固定すると $\mu(E^{t})=\mu(\{f>t\})$。よって $\int f\,d\mu=\int\lambda(E_{x})\,d\mu=\int\mu(E^{t})\,dt$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{meas:sec-fb-exercises} にまとめた。
