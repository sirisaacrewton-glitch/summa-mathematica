# 変数変換公式 {#meas:page-change-of-variables keywords="change of variables formula for Lebesgue integrals under C^1 diffeomorphisms, measure of the image of a cube, sup norm and operator norm, Jacobian determinant, images of null sets, polar coordinates, Gaussian integral in the plane"}

線形写像 $T$ による像の測度は $|\det T|$ 倍になった（\ref{meas:lebesgue-linear}）。$C^{1}$ 級の微分同相写像 $\Phi$ は各点の近くで微分 $D\Phi(x)$ で近似できるので、像の測度は局所的に $|\det D\Phi(x)|$ 倍になり、積分すると
$$
\int_{\Phi(U)}f(y)\,dy=\int_{U}f(\Phi(x))\,|\det D\Phi(x)|\,dx
$$
が得られる。このページではこの**変数変換公式**を、非負可測関数と可積分関数について示す。証明の要は、小さな立方体の像の測度の評価（平均値の定理）と、測度の外正則性による一般の集合への拡張、そして $\Phi^{-1}$ についての同じ不等式との組合せである。リーマン積分版（\ref{calc:change-of-variables}）と違い、被積分関数の連続性や積分領域のジョルダン可測性は要らない。

## 記法と定義の確認 {#meas:sec-cv-notation}

::: notation
- $C^{1}$ 級・微分同相写像・連鎖律は \ref{calc:c1-map}, \ref{calc:diffeomorphism}, \ref{calc:chain-rule}。$1$ 変数の \ref{calc:mean-value-theorem} も使う。
- $\|x\|_{\infty}\defeq\max_{i}|x_{i}|$。$n\times n$ 行列 $A=(a_{ij})$ について $\|A\|\defeq\max_{i}\sum_{j}|a_{ij}|$。$\|Ax\|_{\infty}\le\|A\|\|x\|_{\infty}$、$\|AB\|\le\|A\|\|B\|$（$|\sum_{j}a_{ij}x_{j}|\le\sum_{j}|a_{ij}|\|x\|_{\infty}$ と、それを $B$ の各列に使う）。
- **立方体**は $Q=\prod_{k}[c_{k}-s,c_{k}+s]$（中心 $c$、半辺 $s$）＝ $\{x:\|x-c\|_{\infty}\le s\}$。$\lambda(Q)=(2s)^{n}$。
- $J_{\Phi}(x)\defeq|\det D\Phi(x)|$。
- 線形写像と測度、平行移動不変性、正則性、単調収束定理は \ref{meas:lebesgue-linear}, \ref{meas:translation-invariant-unique}, \ref{meas:lebesgue-regularity}, \ref{meas:monotone-convergence}。
- **選択公理**：使わない。
:::

## 立方体の像 {#meas:sec-cv-cubes}

::: lemma 立方体の像の評価 {#meas:cube-image-estimate keywords="for a C^1 map Phi on a neighbourhood of a cube Q, Phi(Q) is contained in a cube of half side (sup ||DPhi||) s, so lambda(Phi(Q)) <= (sup ||DPhi||)^n lambda(Q)" index="立方体の像|りっぽうたいのぞう"}
$\Phi$ を立方体 $Q$（中心 $c$、半辺 $s$）を含む開集合上の $C^{1}$ 写像とし、$K\defeq\sup_{x\in Q}\|D\Phi(x)\|$ とすると、$\Phi(Q)\subset\{y:\|y-\Phi(c)\|_{\infty}\le Ks\}$。とくに $\lambda(\Phi(Q))\le K^{n}\lambda(Q)$（$\Phi(Q)$ はコンパクトで可測）。
:::

::: proof
$x\in Q$ と各成分 $i$ について、$g(t)\defeq\Phi_{i}(c+t(x-c))$ に $1$ 変数の \ref{calc:mean-value-theorem} を使うと（線分は凸集合 $Q$ に含まれる）、$\Phi_{i}(x)-\Phi_{i}(c)=\sum_{j}\partial_{j}\Phi_{i}(\xi)(x_{j}-c_{j})$（$\xi\in Q$ は $i$ ごとの線分上の点）。よって $|\Phi_{i}(x)-\Phi_{i}(c)|\le\sum_{j}|\partial_{j}\Phi_{i}(\xi)|\,s\le Ks$。像の立方体の測度は $(2Ks)^{n}=K^{n}\lambda(Q)$。
:::

::: proposition 立方体の像の測度 {#meas:cube-image-measure keywords="for a C^1 diffeomorphism Phi and a closed cube Q in its domain, lambda(Phi(Q)) <= int_Q |det DPhi|" index="立方体の像の測度|りっぽうたいのぞうのそくど"}
$\Phi\colon U\to V$ を開集合の間の $C^{1}$ 微分同相写像、$Q\subset U$ を立方体とすると $\lambda(\Phi(Q))\le\int_{Q}J_{\Phi}\,d\lambda$。
:::

::: proof
**Step 1（線形写像で正規化）.** $x_{0}\in Q$ と $T\defeq D\Phi(x_{0})^{-1}$ について、$T\circ\Phi$ に \ref{meas:cube-image-estimate} を使い、\ref{meas:lebesgue-linear} から
$$
\lambda(\Phi(Q))=|\det D\Phi(x_{0})|\,\lambda(T\Phi(Q))\le J_{\Phi}(x_{0})\Bigl(\sup_{x\in Q}\|D\Phi(x_{0})^{-1}D\Phi(x)\|\Bigr)^{n}\lambda(Q).
$$

**Step 2（一様連続性）.** $Q$ はコンパクトで、$x\mapsto D\Phi(x)$ と $x\mapsto D\Phi(x)^{-1}$（逆行列の成分は行列式で割った有理式で連続）、$J_{\Phi}$ は $Q$ 上一様連続。$\varepsilon>0$ について $\eta>0$ を、$\|x-x'\|_{\infty}\le\eta$ なら $\|D\Phi(x')^{-1}D\Phi(x)\|\le1+\varepsilon$ かつ $|J_{\Phi}(x)-J_{\Phi}(x')|\le\varepsilon$ となるようにとる（$\|D\Phi(x')^{-1}D\Phi(x)-I\|\le\|D\Phi(x')^{-1}\|\|D\Phi(x)-D\Phi(x')\|$ で、$\|D\Phi(x')^{-1}\|$ は $Q$ 上有界）。

**Step 3（分割）.** $Q$ を、各辺を $N$ 等分して半辺 $s/N\le\eta$ の $N^{n}$ 個の小立方体 $Q_{j}$（中心 $x_{j}$）に分ける。小立方体どうしは境界でしか交わらず、境界は零集合なので $\lambda(Q)=\sum\lambda(Q_{j})$、$\int_{Q}J_{\Phi}=\sum\int_{Q_{j}}J_{\Phi}$。Step 1 を各 $Q_{j}$（$x_{0}=x_{j}$）に使い、Step 2 から
$$
\lambda(\Phi(Q))\le\sum_{j}\lambda(\Phi(Q_{j}))\le(1+\varepsilon)^{n}\sum_{j}J_{\Phi}(x_{j})\lambda(Q_{j})\le(1+\varepsilon)^{n}\sum_{j}\int_{Q_{j}}(J_{\Phi}+\varepsilon)=(1+\varepsilon)^{n}\Bigl(\int_{Q}J_{\Phi}+\varepsilon\lambda(Q)\Bigr).
$$
$\varepsilon\to0$。
:::

## 変数変換公式 {#meas:sec-cv-theorem}

::: theorem 変数変換公式（ルベーグ積分） {#meas:change-of-variables keywords="change of variables: for a C^1 diffeomorphism Phi: U -> V and nonnegative measurable or integrable f on V, int_V f = int_U f o Phi |det DPhi|; lambda(Phi(E)) = int_E |det DPhi|; Phi maps null sets to null sets" index="変数変換公式（ルベーグ積分）|へんすうへんかんこうしきるべーぐせきぶん"}
$\Phi\colon U\to V$ を $\mathbb{R}^{n}$ の開集合の間の $C^{1}$ 微分同相写像とする。
1. $E\subset U$ がルベーグ可測なら $\Phi(E)$ もルベーグ可測で、$\lambda(\Phi(E))=\int_{E}J_{\Phi}\,d\lambda$。
2. $V$ 上のルベーグ可測な $f\ge0$ について $\int_{V}f\,d\lambda=\int_{U}(f\circ\Phi)J_{\Phi}\,d\lambda$。
3. $f\in\mathcal{L}^{1}(V)$ $\iff$ $(f\circ\Phi)J_{\Phi}\in\mathcal{L}^{1}(U)$ で、そのとき 2 の等式が成り立つ。
:::

::: proof
**Step 1（開集合）.** $U$ に含まれる開集合 $W$ は、閉包が $W$ に含まれる半開の 2 進立方体 $\prod_{k}[m_{k}2^{-l},(m_{k}+1)2^{-l})$ の互いに素な可算和で書ける（各点を含む十分小さい 2 進立方体のうち極大なものを集める。2 進立方体は包含関係か交わらないかのどちらか）。各 $Q$ について $\Phi(Q)\subset\Phi(\overline{Q})$ と \ref{meas:cube-image-measure}（閉立方体と半開立方体の積分は同じ）から、$\lambda(\Phi(W))\le\sum\lambda(\Phi(Q))\le\sum\int_{Q}J_{\Phi}=\int_{W}J_{\Phi}$。

**Step 2（ボレル集合、不等式）.** $\nu(E)\defeq\int_{E}J_{\Phi}\,d\lambda$ は $U$ のボレル集合上の測度（\ref{meas:density-measure}）。まず $E$ が、閉包がコンパクトで $U$ に含まれる開集合 $G$ に含まれるとし、$M\defeq\max_{\overline{G}}J_{\Phi}$ とする。$\varepsilon>0$ について開集合 $W$ で $E\subset W\subset G$, $\lambda(W\setminus E)<\varepsilon/(M+1)$ となるものをとる（\ref{meas:lebesgue-regularity.3}。得られた開集合と $G$ の共通部分をとる）。$\Phi$ は同相写像なので $\Phi(E)$ はボレル集合で、Step 1 から
$$
\lambda(\Phi(E))\le\lambda(\Phi(W))\le\nu(W)=\nu(E)+\nu(W\setminus E)\le\nu(E)+M\lambda(W\setminus E)<\nu(E)+\varepsilon.
$$
一般のボレル集合 $E\subset U$ には、$G_{m}\defeq\{x\in U:|x|<m,\ \operatorname{dist}(x,\mathbb{R}^{n}\setminus U)>\frac1m\}$（$U=\mathbb{R}^{n}$ なら距離の条件を外す）が上の条件を満たし $G_{m}\uparrow U$ なので、$E\cap G_{m}$ に使って下からの連続性で極限をとる。よって $\lambda(\Phi(E))\le\nu(E)$。

**Step 3（非負ボレル関数、不等式）.** Step 2 は $f=\mathbf{1}_{\Phi(E)}$ について $\int_{V}f\le\int_{U}(f\circ\Phi)J_{\Phi}$ を意味する。非負の単関数は線形性、非負ボレル関数は単関数近似と \ref{meas:monotone-convergence}（$s_{n}\circ\Phi\uparrow f\circ\Phi$）で同じ不等式が成り立つ。

**Step 4（逆向き）.** $\Phi^{-1}\colon V\to U$ に Step 3 を使い、関数 $g\defeq(f\circ\Phi)J_{\Phi}$ をとると
$$
\int_{U}(f\circ\Phi)J_{\Phi}\le\int_{V}(f\circ\Phi\circ\Phi^{-1})(J_{\Phi}\circ\Phi^{-1})J_{\Phi^{-1}}=\int_{V}f.
$$
最後は、連鎖律 $D\Phi(\Phi^{-1}(y))D\Phi^{-1}(y)=I$（\ref{calc:chain-rule}）と行列式の乗法性から $(J_{\Phi}\circ\Phi^{-1})J_{\Phi^{-1}}=1$。よって非負ボレル関数で 2 の等式、$f=\mathbf{1}_{\Phi(E)}$ で 1 の等式（ボレル集合）。

**Step 5（ルベーグ可測へ）.** $Z\subset U$ がボレル零集合なら $\lambda(\Phi(Z))=\int_{Z}J_{\Phi}=0$。ルベーグ可測な $E=B\cup N$（$B$ ボレル、$N\subset Z$ ボレル零集合）について $\Phi(E)=\Phi(B)\cup\Phi(N)$、$\Phi(N)\subset\Phi(Z)$ は零集合なので $\Phi(E)$ はルベーグ可測で $\lambda(\Phi(E))=\lambda(\Phi(B))=\int_{B}J_{\Phi}=\int_{E}J_{\Phi}$。ルベーグ可測な $f\ge0$ は、\ref{meas:borel-version} のボレル版 $g$ とボレル零集合の外で一致し、$f\circ\Phi$ と $g\circ\Phi$ は $\Phi^{-1}$（零集合を零集合に写す）による零集合の外で一致するので、2 は $g$ の場合に帰着する。

**Step 6（3）.** $|f|$ に 2 を使えば可積分性は同値で、$f^{\pm}$ に分けて引き算する（複素数値なら実部・虚部）。

::: hypcheck
- **$C^{1}$ 級**（微分の連続性）は \ref{meas:cube-image-measure} の Step 2 の一様連続性に使った。
- **単射**（微分同相）は Step 1 で $\Phi(W)$ の測度を立方体ごとの和で上から押さえるのに、Step 4 で $\Phi^{-1}$ を使うのに使った。単射でない写像では、像は重なりの分だけ小さくなり、等式は「重複度つき」になる（面積公式。知られている）。
- 微分が退化する点（$J_{\Phi}=0$）は $U$ に含めていない。零集合の上で退化してもよい場合は、その零集合を除いた開集合で使える（極座標の原点など）。
:::
:::

::: example 極座標 {#meas:polar-coordinates keywords="polar coordinates in the plane: int_{R^2} f = int_0^infinity int_0^{2pi} f(r cos theta, r sin theta) r d theta dr for nonnegative measurable f" index="極座標（ルベーグ積分）|きょくざひょうるべーぐせきぶん"}
$\mathbb{R}^{2}$ 上のルベーグ可測な $f\ge0$ について
$$
\int_{\mathbb{R}^{2}}f\,d\lambda_{2}=\int_{(0,\infty)\times(0,2\pi)}f(r\cos\theta,r\sin\theta)\,r\,d\lambda_{2}(r,\theta).
$$
:::

::: proof
$\Phi(r,\theta)\defeq(r\cos\theta,r\sin\theta)$ は $U\defeq(0,\infty)\times(0,2\pi)$ から $V\defeq\mathbb{R}^{2}\setminus\{(x,0):x\ge0\}$ への $C^{1}$ 微分同相写像（全単射で、逆写像は偏角の連続な選び方で $C^{1}$、\ref{calc:polar-form}）で、$\det D\Phi=\cos\theta\cdot r\cos\theta-(-r\sin\theta)\sin\theta=r$。除いた半直線は零集合（\ref{meas:lebesgue-linear} の Step 5 と同じく、超平面に含まれる）なので $\int_{\mathbb{R}^{2}}f=\int_{V}f$ で、\ref{meas:change-of-variables.2}。
:::

::: supplement
**リーマン積分版との比較.** リーマン積分版（\ref{calc:change-of-variables}）では、積分領域のジョルダン可測性や被積分関数の連続性を仮定し、境界での退化を別に扱う必要があった（\ref{calc:change-of-variables-boundary}）。ルベーグ積分版では、非負可測関数について無条件で、零集合はすべて無視できる。

**高い視点：押し出し測度.** 等式 1 は、測度 $J_{\Phi}\,d\lambda$ の $\Phi$ による押し出し $\Phi_{*}(J_{\Phi}\lambda)(B)\defeq(J_{\Phi}\lambda)(\Phi^{-1}(B))$ がルベーグ測度に等しい、と読める。言い換えると、$\Phi$ による押し出し $\Phi_{*}\lambda$ はルベーグ測度に関して絶対連続で、ラドン–ニコディム導関数は $\frac{d\Phi_{*}\lambda}{d\lambda}=J_{\Phi^{-1}}$ である。多様体の上では、$|\det D\Phi|$ は座標変換による体積要素の変換則で、向きを考えれば微分形式の引き戻しの公式 $\Phi^{*}(dy_{1}\wedge\cdots\wedge dy_{n})=\det D\Phi\,dx_{1}\wedge\cdots\wedge dx_{n}$ になる。比喩で言えば、$J_{\Phi}(x)$ は「$x$ の近くの小さな立方体が、写像でどれだけ膨らむか」の倍率で、変数変換公式は「膨らんだ先で測った量は、膨らむ前に倍率をかけて測った量に等しい」と言っている。
:::

## 極座標と球面上の測度 {#meas:sec-cv-polar}

\ref{meas:polar-coordinates} では角度を座標にとった。$n$ 次元では方向 $\theta\in S^{n-1}$ そのものを変数にし、球面上の測度を錐の体積から作る（Folland『Real Analysis』の方法）。球面に座標を入れずに、ルベーグ測度が $r^{n-1}dr$ と球面上の測度の積に分かれることが示せる。

この節では $n\ge1$、$|x|$ はユークリッドノルム、$S^{n-1}\defeq\{\theta\in\mathbb{R}^{n}:|\theta|=1\}$（相対位相）、$\omega_{n}\defeq\lambda(\{x:|x|<1\})$ とし、$\mathcal{P}\defeq\mathcal{B}((0,\infty))\otimes\mathcal{B}(S^{n-1})$（\ref{meas:product-sigma-algebra}）とおく。
$$
\Phi(x)\defeq\Bigl(|x|,\frac{x}{|x|}\Bigr)\ (x\ne0),\qquad\Psi(r,\theta)\defeq r\theta
$$
は $\mathbb{R}^{n}\setminus\{0\}$ と $(0,\infty)\times S^{n-1}$ の間の互いに逆な全単射である。

::: lemma 極座標の写像の可測性 {#meas:polar-maps keywords="measurability of x -> (|x|, x/|x|) and (r, theta) -> r theta" index="極座標の写像|きょくざひょうのしゃぞう"}
1. $\Phi$ は $(\mathcal{B}(\mathbb{R}^{n}\setminus\{0\}),\mathcal{P})$ 可測で、$\mathcal{B}(\mathbb{R}^{n}\setminus\{0\})\subset\mathcal{B}(\mathbb{R}^{n})$。
2. $\Psi$ は $(\mathcal{P},\mathcal{B}(\mathbb{R}^{n}))$ 可測。
:::

::: proof
**1.** $\mathbb{R}^{n}\setminus\{0\}$ に含まれるボレル集合の全体はその上の σ-加法族で、その開集合（$\mathbb{R}^{n}$ でも開）を含むので包含が従う。$x\mapsto|x|$, $x\mapsto x/|x|$ は連続なので $\Phi^{-1}(B\times A)=\{x\ne0:|x|\in B\}\cap\{x\ne0:x/|x|\in A\}$ はボレル集合（\ref{meas:measurability-generators.2}）。\ref{meas:measurability-generators.1}。

**2.** 射影 $(r,\theta)\mapsto r$, $(r,\theta)\mapsto\theta$ は可測（逆像が $B\times S^{n-1}$, $(0,\infty)\times A$）で、$\theta\mapsto\theta_{i}$ は連続。\ref{meas:measurability-generators.3} と \ref{meas:measurable-operations.2} から $\Psi_{i}(r,\theta)=r\theta_{i}$ は可測。半開直方体の逆像 $\Psi^{-1}((a,b])=\bigcap_{i}\Psi_{i}^{-1}((a_{i},b_{i}])\in\mathcal{P}$ なので、\ref{meas:borel-generators.1} と \ref{meas:measurability-generators.1}。
:::

::: definition 球面上の測度 {#meas:polar-sphere-measure keywords="surface measure on the sphere, sigma(A) = n lambda(cone over A)" index="球面測度|きゅうめんそくど, 球面上の測度|きゅうめんじょうのそくど"}
$A\in\mathcal{B}(S^{n-1})$ について、$A$ を底とする錐 $C_{A}\defeq\{r\theta:0<r\le1,\ \theta\in A\}=\Phi^{-1}((0,1]\times A)$ はボレル集合（\ref{meas:polar-maps.1}）で、
$$
\sigma(A)\defeq n\,\lambda(C_{A})
$$
を $S^{n-1}$ 上の**球面測度**という。また $(0,\infty)$ のボレル集合 $E$ について $\rho(E)\defeq\int_{E}r^{n-1}\,dr$ とおく。
:::

::: intuition
球面の一部分の「面積」を、そこから中心へ向かう錐の体積の $n$ 倍と決める。半径 $1$ の球なら、底面積 $\times$ 高さ $1$ $\div n$ が錐の体積なので、この $n$ 倍が底の面積になる。
:::

::: proposition 球面測度の基本性質 {#meas:polar-sphere-measure-basic keywords="sigma(S^{n-1}) = n omega_n, surface area of the sphere" index="球面の表面積|きゅうめんのひょうめんせき"}
1. $\sigma$ は $\mathcal{B}(S^{n-1})$ 上の有限測度で、$\sigma(S^{n-1})=n\omega_{n}$。
2. $n=1$ では $\sigma$ は $S^{0}=\{1,-1\}$ の数え上げ測度。
:::

::: proof
**1.** $x\in C_{A}$ は「$0<|x|\le1$ かつ $x/|x|\in A$」と同値なので、互いに素な $A_{k}$ について $C_{\bigsqcup A_{k}}=\bigsqcup C_{A_{k}}$、$C_{\varnothing}=\varnothing$。$\lambda$ の可算加法性から $\sigma$ は測度。閉球 $\overline{B}\defeq\{|x|\le1\}$ は $\varepsilon>0$ について $\{|x|<1\}\subset\overline{B}\subset(1+\varepsilon)\{|x|<1\}$。\ref{meas:lebesgue-linear}（$T=(1+\varepsilon)I$）から $\omega_{n}\le\lambda(\overline{B})\le(1+\varepsilon)^{n}\omega_{n}$ で、$\omega_{n}<\infty$（\ref{meas:lebesgue-basic.4}）。$C_{S^{n-1}}=\overline{B}\setminus\{0\}$ と \ref{meas:lebesgue-basic.3} から $\sigma(S^{n-1})=n\lambda(\overline{B})=n\omega_{n}$。**2.** $\sigma(\{1\})=\lambda((0,1])=1$, $\sigma(\{-1\})=\lambda([-1,0))=1$。
:::

::: theorem 極座標（$n$ 次元） {#meas:polar-decomposition keywords="polar coordinates in R^n, int f dx = int_0^infinity int_{S^{n-1}} f(r theta) d sigma(theta) r^{n-1} dr" index="極座標（n 次元）|きょくざひょうえぬじげん, 極座標分解|きょくざひょうぶんかい"}
1. $\mathcal{P}$ の元 $E$ について $\lambda(\Phi^{-1}(E))=(\rho\otimes\sigma)(E)$。
2. ボレル可測な $g\colon\mathbb{R}^{n}\to[0,\infty]$ について、$\theta\mapsto g(r\theta)$ と $r\mapsto\int_{S^{n-1}}g(r\theta)\,d\sigma(\theta)$ はボレル可測で
$$
\int_{\mathbb{R}^{n}}g\,d\lambda=\int_{0}^{\infty}\Bigl(\int_{S^{n-1}}g(r\theta)\,d\sigma(\theta)\Bigr)r^{n-1}dr.
$$
3. ボレル可測な $g\in\mathcal{L}^{1}(\lambda)$ について、ほとんどすべての $r>0$ で $\theta\mapsto g(r\theta)$ は $\sigma$ 可積分で、2 の等式が成り立つ（右辺の外側の被積分関数はほとんど至る所定義された可積分関数）。
4. 2 の等式をすべてのボレル可測な $g\ge0$ について満たす $\mathcal{B}(S^{n-1})$ 上の測度は $\sigma$ だけである。
:::

::: intuition
ルベーグ測度は「半径の方向」と「向きの方向」に分けて測れる。半径 $r$ の球面の大きさは単位球面の $r^{n-1}$ 倍なので、まず各半径の球面の上で積分し、それに $r^{n-1}$ をかけて半径について積分すればよい。
:::

::: proof
**Step 1（錐の殻）.** 【主張：$0\le a<b$ と $A\in\mathcal{B}(S^{n-1})$ について $\lambda(\Phi^{-1}((a,b]\times A))=\rho((a,b])\,\sigma(A)$】 $t>0$ について $tC_{A}=\{x:0<|x|\le t,\ x/|x|\in A\}$ で、\ref{meas:lebesgue-linear}（$T=tI$）から $\lambda(tC_{A})=t^{n}\lambda(C_{A})$。$\lambda(C_{A})\le\lambda(\overline{B})<\infty$。$a>0$ なら $\Phi^{-1}((a,b]\times A)=bC_{A}\setminus aC_{A}$（$aC_{A}\subset bC_{A}$）なので \ref{meas:measure-properties.2} から測度は $(b^{n}-a^{n})\lambda(C_{A})$、$a=0$ なら $bC_{A}$ でも同じ式。一方 \ref{meas:riemann-lebesgue}（端点は零集合）と \ref{calc:fundamental-theorem} から $\rho((a,b])=\int_{a}^{b}r^{n-1}dr=\frac{b^{n}-a^{n}}{n}$。

**Step 2（生成する π 系）.** 【主張：$\mathcal{P}_{0}\defeq\{(a,b]\times A:0\le a<b,\ A\in\mathcal{B}(S^{n-1})\}\cup\{\varnothing\}$ は π 系で、$\sigma(\mathcal{P}_{0})=\mathcal{P}$】 $((a,b]\times A)\cap((a',b']\times A')=(\max(a,a'),\min(b,b')]\times(A\cap A')$（区間が空なら $\varnothing$）。$(a,b]$ は $(0,\infty)$ のボレル集合なので $\mathcal{P}_{0}$ の元は可測長方形で、$\sigma(\mathcal{P}_{0})\subset\mathcal{P}$。逆に $A$ を固定し、$\mathcal{G}_{A}\defeq\{B\subset(0,\infty):B\times A\in\sigma(\mathcal{P}_{0})\}$ とおく。$(0,\infty)\times A=\bigcup_{k}(0,k]\times A$ なので、$((0,\infty)\setminus B)\times A=((0,\infty)\times A)\setminus(B\times A)$ から $\mathcal{G}_{A}$ は補集合で閉じ、可算和でも閉じる。$(0,\infty)$ の開集合 $W$ は、$[p,q]\subset W$ となる有理数 $0<p<q$ についての $(p,q]$ の可算和なので $\mathcal{G}_{A}$ に入り、\ref{meas:generated-properties.1} から $\mathcal{B}((0,\infty))\subset\mathcal{G}_{A}$。よって可測長方形はすべて $\sigma(\mathcal{P}_{0})$ に入る。

**Step 3（一意性で広げる）.** 【主張：$m(E)\defeq\lambda(\Phi^{-1}(E))$ は $\mathcal{P}$ 上で $\rho\otimes\sigma$ に等しい（1）】 $\Phi^{-1}$ は互いに素な和を保つので $m$ は $\mathcal{P}$ 上の測度（\ref{meas:polar-maps.1}）。$\rho((0,k])=k^{n}/n$ と \ref{meas:polar-sphere-measure-basic.1} から $\rho$, $\sigma$ は σ 有限で、\ref{meas:product-measure} から $\rho\otimes\sigma$ があり $(\rho\otimes\sigma)((a,b]\times A)=\rho((a,b])\sigma(A)$。Step 1 から $m$ と $\mathcal{P}_{0}$ 上で一致する。$X_{k}\defeq(0,k]\times S^{n-1}\in\mathcal{P}_{0}$ は $X_{k}\uparrow(0,\infty)\times S^{n-1}$, $m(X_{k})=k^{n}\omega_{n}<\infty$ なので、Step 2 と \ref{meas:measure-uniqueness}。

**Step 4（像による積分とトネリ）.** 【主張：$\mathcal{P}$ 可測な $h\ge0$ について $\int_{\mathbb{R}^{n}\setminus\{0\}}h\circ\Phi\,d\lambda=\int h\,dm$】 $h=\mathbf{1}_{E}$ なら $m$ の定義そのもの。非負の単関数は線形性（\ref{meas:simple-integral-properties.2}）、一般の $h$ は単関数 $s_{k}\uparrow h$（\ref{meas:simple-approximation}）で $s_{k}\circ\Phi\uparrow h\circ\Phi$ なので両辺に \ref{meas:monotone-convergence}。$h\defeq g\circ\Psi$ は $\mathcal{P}$ 可測（\ref{meas:polar-maps.2}, \ref{meas:measurability-generators.3}）で $\mathbb{R}^{n}\setminus\{0\}$ 上で $h\circ\Phi=g$、$\{0\}$ は零集合。よって Step 3 と \ref{meas:tonelli}（$\rho,\sigma$ は σ 有限）から
$$
\int_{\mathbb{R}^{n}}g\,d\lambda=\int h\,d(\rho\otimes\sigma)=\int_{(0,\infty)}\Bigl(\int_{S^{n-1}}g(r\theta)\,d\sigma(\theta)\Bigr)d\rho(r)
$$
で（切り口と内側の積分の可測性は \ref{meas:sections-measurable.2} と \ref{meas:tonelli}）、\ref{meas:density-measure} で $d\rho=r^{n-1}dr$ に直す。

**Step 5.** 【主張：可積分な $g$ について 3 が成り立ち、2 の等式は $\sigma$ を決める（4）】 3：$g^{\pm}$ に 2 を使うと $F_{\pm}(r)\defeq\int_{S^{n-1}}g^{\pm}(r\theta)\,d\sigma$ は $\int_{0}^{\infty}F_{\pm}r^{n-1}dr\le\int|g|<\infty$ を満たす。\ref{meas:markov.3} と $r^{n-1}>0$ から、ほとんどすべての $r$ で $F_{\pm}(r)<\infty$ で、そこで $\int g(r\theta)\,d\sigma=F_{+}(r)-F_{-}(r)$。2 つの等式を引けばよい（\ref{meas:integral-linearity.1}）。4：$\sigma'$ が 2 の等式を満たすとし $g=\mathbf{1}_{C_{A}}$ をとる。$r>0$ で $r\theta\in C_{A}\iff(r\le1$ かつ $\theta\in A)$ なので $\lambda(C_{A})=\sigma'(A)\int_{0}^{1}r^{n-1}dr=\sigma'(A)/n$、つまり $\sigma'(A)=\sigma(A)$。

::: hypcheck
- **σ 有限性**：$\sigma$ の有限性と $\rho((0,k])<\infty$ を、Step 3 で積測度の存在（\ref{meas:product-measure}）と一意性の $X_{k}$ に、Step 4 で \ref{meas:tonelli} に使った。
- **斉次性** $\lambda(tE)=t^{n}\lambda(E)$ と $\lambda(C_{A})<\infty$ は Step 1 の引き算に使った。
- **ボレル可測性**：Step 4 で $g\circ\Psi$ の $\mathcal{P}$ 可測性に使った。ルベーグ可測なだけでは切り口がボレル可測とは限らない（$S^{n-1}$ は零集合なので、ボレル集合でない $N\subset S^{n-1}$ があれば $\mathbf{1}_{N}$ はルベーグ可測で、$r=1$ の切り口はボレル可測でない）。補足を見よ。
- **選択公理**：使わない。
:::
:::

::: corollary 球面測度の不変性と放射関数の積分 {#meas:polar-radial keywords="rotation invariance of surface measure, integral of radial functions" index="球面測度の回転不変性|きゅうめんそくどのかいてんふへんせい, 放射関数の積分|ほうしゃかんすうのせきぶん"}
1. 直交行列 $U$ と $A\in\mathcal{B}(S^{n-1})$ について $UA\in\mathcal{B}(S^{n-1})$ で $\sigma(UA)=\sigma(A)$。
2. ボレル可測な $g\colon[0,\infty)\to[0,\infty]$ について $\displaystyle\int_{\mathbb{R}^{n}}g(|x|)\,dx=n\omega_{n}\int_{0}^{\infty}g(r)r^{n-1}dr$。
:::

::: proof
**1.** $|Ux|=|x|$ なので $U$ は $S^{n-1}$ を $S^{n-1}$ に写し、逆 $U^{\mathsf T}$ も直交行列だから $U|_{S^{n-1}}$ は同相写像で、$UA=(U^{\mathsf T}|_{S^{n-1}})^{-1}(A)$ はボレル集合（\ref{meas:measurability-generators.2}）。$U(r\theta)=r\,U\theta$ から $C_{UA}=UC_{A}$。$(\det U)^{2}=\det(U^{\mathsf T}U)=1$ なので \ref{meas:lebesgue-linear} から $\lambda(UC_{A})=\lambda(C_{A})$。

**2.** $x\mapsto g(|x|)$ はボレル可測で、内側の積分は $\int_{S^{n-1}}g(r)\,d\sigma=g(r)\sigma(S^{n-1})=n\omega_{n}g(r)$。\ref{meas:polar-decomposition.2} と \ref{meas:polar-sphere-measure-basic.1}。
:::

::: supplement
**ルベーグ可測関数.** ルベーグ可測な $g\ge0$ は、\ref{meas:borel-version} からボレル可測な $\tilde g$ とボレル零集合 $Z$ の外で一致する。\ref{meas:polar-decomposition.2} を $\mathbf{1}_{Z}$ に使うと、ほとんどすべての $r$ で $\sigma(\{\theta:r\theta\in Z\})=0$。よって $\sigma$ の完備化（\ref{meas:completion}）で内側の積分を考えれば、2・3 はルベーグ可測な $g$ でも成り立つ。ただし \ref{meas:borel-version} は可算選択公理を使う。

**$n=2$.** \ref{meas:polar-coordinates} を $\mathbf{1}_{C_{A}}$ に使うと、$A=\{(\cos t,\sin t):t\in I\}$（$I\subset(0,2\pi)$ は区間）について $\sigma(A)=2\int_{0}^{1}\int_{I}r\,dt\,dr=|I|$。$\sigma$ は弧の長さである。

**ほかの見方.** $\Phi$ の値域は $\mathbb{R}^{n}$ の開集合ではないので \ref{meas:change-of-variables} は直接には使えず、球面の座標の代わりに錐の体積と測度の一意性を使った。$\sigma$ はリーマン計量から決まる球面の表面積と一致し、回転不変な有限ボレル測度は定数倍を除いて $\sigma$ だけであることが知られている。$n\omega_{n}$ の値は \see{calc:ball-volume}。
:::

## 問題 {#meas:sec-cv-problems}

::: problem {#meas:prob-cv-gaussian-plane}
極座標を使って $\int_{\mathbb{R}^{2}}e^{-(x^{2}+y^{2})}\,d\lambda_{2}=\pi$ を示し、\ref{meas:tonelli} と合わせて $\int_{\mathbb{R}}e^{-x^{2}}dx=\sqrt{\pi}$ を導け。
:::

::: solution
\ref{meas:polar-coordinates} とトネリの定理から $\int_{\mathbb{R}^{2}}e^{-(x^{2}+y^{2})}=\int_{0}^{\infty}\Bigl(\int_{0}^{2\pi}d\theta\Bigr)e^{-r^{2}}r\,dr=2\pi\cdot\frac12=\pi$（$\int_{0}^{\infty}re^{-r^{2}}dr=[-\frac12e^{-r^{2}}]_{0}^{\infty}$ は広義積分、\ref{meas:improper-lebesgue.1}）。一方トネリの定理から左辺は $\bigl(\int_{\mathbb{R}}e^{-x^{2}}dx\bigr)^{2}$。正の平方根をとる。
:::

::: problem {#meas:prob-cv-ball-volume}
$\mathbb{R}^{2}$ の単位円板の面積が $\pi$、$\mathbb{R}^{3}$ の単位球の体積が $\frac43\pi$ であることを、極座標とフビニの定理（カヴァリエリの原理）で示せ。
:::

::: solution
**円板.** \ref{meas:polar-coordinates} を $f=\mathbf{1}_{\{x^{2}+y^{2}<1\}}$ に使うと $\int_{0}^{1}\int_{0}^{2\pi}r\,d\theta\,dr=\pi$。

**球.** \ref{meas:lebesgue-product.2}（カヴァリエリ）から、$B\defeq\{|x|<1\}\subset\mathbb{R}^{3}$ について $\lambda_{3}(B)=\int_{-1}^{1}\lambda_{2}(B_{z})\,dz$、切り口 $B_{z}$ は半径 $\sqrt{1-z^{2}}$ の円板で、\ref{meas:lebesgue-linear}（$T=\sqrt{1-z^{2}}I$）から面積 $\pi(1-z^{2})$。$\int_{-1}^{1}\pi(1-z^{2})dz=\frac43\pi$。
:::
