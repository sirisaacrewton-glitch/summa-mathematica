# 解析（Analysis）

実解析・複素解析、測度と積分、微分方程式、調和解析、関数解析、確率論。

## 分野

<a class="mn-card" href="01-real-analysis/index.html"><span class="mn-card-title">実解析</span><span class="mn-card-en">Real Analysis</span><span class="mn-card-desc">実数論、一変数の微積分、多変数解析、ベクトル解析。</span><span class="mn-card-count">32 ページ</span></a>

<a class="mn-card" href="07-functional-analysis/index.html"><span class="mn-card-title">関数解析</span><span class="mn-card-en">Functional Analysis</span><span class="mn-card-desc">バナッハ空間・ヒルベルト空間、ハーン＝バナッハ、開写像・一様有界性、双対、スペクトル理論。</span><span class="mn-card-count">19 ページ</span></a>
