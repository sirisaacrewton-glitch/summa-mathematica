# 正則性が崩れる例 {#pde:page-regularity-counterexamples keywords="failure of regularity of weak solutions, discontinuous coefficients, transmission problem, continuous but not Lipschitz coefficient, reentrant corner, L-shaped domain, corner singularity r^{2/3} sin(2 theta/3), sectors and the angle pi, 正則性の破れ, 不連続な係数, 入隅, L 字型領域, 角の特異性"}

前の二つのページ（\ref{pde:page-regularity}, \ref{pde:page-regularity-boundary}）では、主要部の係数が $C^{1}$ なら弱解は内部で $H^{2}$、さらに境界が $C^{2}$ なら境界まで $H^{2}$ になることを示した。このページでは、この二つの前提が飾りではないことを具体例で確かめる。係数が跳ぶと、方程式の右辺がどれほど滑らかでも解の導関数が跳び（第 1 節）、境界に凸でない角があると、右辺が角の近くで $0$ でも解の 2 階導関数は角で 2 乗可積分でなくなる（第 2 節）。どちらの例でも、弱解の存在と一意性（\ref{pde:weak-elliptic-existence}）はそのまま成り立つ。崩れるのは正則性だけである。

## 記法と定義の確認 {#pde:sec-rgc-notation}

::: notation
- 作用素 $L$、双線形形式 $B$、弱解は \ref{pde:bilinear-elliptic-form}, \ref{pde:weak-elliptic-solution}、存在と一意性は \ref{pde:weak-elliptic-existence}、古典解と弱解は \ref{pde:weak-elliptic-classical}、領域の中の弱解は \ref{pde:reg-interior-weak-solution}。
- 正則性の定理：内部 \ref{pde:reg-interior-h2}, \ref{pde:reg-interior-smooth}、境界 \ref{pde:reg-boundary-h2}。
- 1 次元のソボレフ空間は \ref{fa:sobolev-one-dimension}（$H^{1}$ の関数は絶対連続な代表元をもつ）、優収束定理は \ref{meas:dominated-convergence}。
- 平面の極座標 $x=r\cos\theta$, $y=r\sin\theta$ と、$z=x+iy$ の正則関数（実部・虚部は調和で、$\partial_{x}h=h'$, $\partial_{y}h=ih'$）を使う。
- **選択公理**：使わない。
:::

## 不連続な係数 {#pde:sec-rgc-coefficient}

内部正則性（\ref{pde:reg-interior-h2}）で $a^{ij}$ の微分可能性（リプシッツ性）を仮定したのは本質的である。1 次元で、係数が跳ぶと解の導関数も跳ぶ。

::: counterexample 不連続な係数と H² 正則性の破れ {#pde:reg-discontinuous-coefficient keywords="discontinuous coefficient a = 1 on x < 0 and 2 on x > 0 in one dimension: weak solutions of -(a u')' = f have a u' continuous, so u' jumps and u is not in H^2 near 0, even with f = 1 and Dirichlet conditions" index="不連続な係数|ふれんぞくなけいすう"}
$\Omega=(-1,1)$、$a(x)\defeq1$（$x<0$）、$a(x)\defeq2$（$x\ge0$）とし、$Lu\defeq-(au')'$（$n=1$, $a^{11}=a$, $b=c=0$。$\theta=1$ の一様楕円型）とする。
1. $u_{0}(x)\defeq2x$（$x<0$）、$u_{0}(x)\defeq x$（$x\ge0$）は $\Omega$ における $Lu=0$ の弱解だが、どんな $\delta\in(0,1)$ についても $u_{0}\notin H^{2}(-\delta,\delta)$。
2. $C\defeq-\frac16$ とし、
$$
u_{1}(x)\defeq\begin{cases}C(x+1)-\frac{x^{2}-1}{2}&(x<0),\\ \frac13+\frac12\bigl(Cx-\frac{x^{2}}{2}\bigr)&(x\ge0)\end{cases}
$$
とおくと、$u_{1}\in H_{0}^{1}(\Omega)$ はディリクレ問題 $Lu=1$, $u(\pm1)=0$ のただ一つの弱解だが、$u_{1}\notin H^{2}(-\delta,\delta)$。
:::

::: proof
**Step 1.** 【主張：$u_{0}$ は弱解】$u_{0}$ はリプシッツ連続で、\ref{fa:sobolev-one-dimension} から $H^{1}(\Omega)$ に入り、弱微分は $u_{0}'=2$（$x<0$）、$1$（$x>0$）。したがって $au_{0}'=2$（a.e.）で、$v\in C_{c}^{\infty}(\Omega)$ について $B[u_{0},v]=\int au_{0}'v'=2\int v'=0$。

**Step 2.** 【主張：$u_{1}$ は $H_{0}^{1}$ に入る弱解で、ただ一つ】式から $u_{1}(-1)=0$, $u_{1}(0)=\frac13$（両側で一致）、$u_{1}(1)=\frac13+\frac12(-\frac16-\frac12)=0$。$u_{1}$ は連続で区分的に多項式なので、\ref{fa:sobolev-one-dimension} から $H^{1}$ に入り、両端で $0$ なので \ref{fa:prob-lm-1d} の解答と同じ理由で $H_{0}^{1}$ に入る。a.e. で $u_{1}'=C-x$（$x<0$）、$\frac12(C-x)$（$x>0$）なので $au_{1}'=C-x$（a.e.）で、$v\in C_{c}^{\infty}(\Omega)$ について $\int au_{1}'v'=\int(C-x)v'=\int v$（部分積分）。一意性は \ref{pde:weak-elliptic-existence.2}（$b=0$, $c=0$）。

**Step 3.** 【主張：$H^{2}(-\delta,\delta)$ に入らない】$u\in H^{2}(-\delta,\delta)$ なら $u'\in H^{1}(-\delta,\delta)$ で、\ref{fa:sobolev-one-dimension} から $u'$ は a.e. で連続関数に等しい。ところが $u_{0}'$ は $x<0$ で $2$、$x>0$ で $1$。$u_{1}'$ は $0$ の左で $C-x\to-\frac16$、右で $\frac12(C-x)\to-\frac1{12}$ に近づくので、どちらも $0$ のどの近傍でも連続な関数と a.e. に一致しない。
:::

この例で連続なのは**流束** $au'$ のほうで、$u'$ は係数の跳びの比で跳ぶ。熱伝導で言えば、熱伝導率の違う二枚の板を貼り合わせると、境目で熱の流れは連続だが温度の勾配は折れる。内部 $H^{2}$ 正則性が失われても、\ref{pde:weak-elliptic-existence} の弱解の理論はそのまま働くことに注意する（係数は有界可測でよかった）。係数が連続でも、微分可能でなければ $H^{2}$ 正則性は崩れうる（\ref{pde:prob-rgc-continuous-coefficient}）。

## 角のある領域 {#pde:sec-rgc-corner}

境界正則性（\ref{pde:reg-boundary-h2}）で境界の $C^{2}$ 性を外すと、データがどれほど滑らかでも $H^{2}$ 正則性は崩れうる。凸でない角（入隅）の近くには、平面の調和関数 $r^{\alpha}\sin(\alpha\theta)$ が特異性として現れる。

::: counterexample L 字型領域で H² に入らない解 {#pde:reg-corner-counterexample keywords="L-shaped domain (-1,1)^2 minus [0,1) x (-1,0]: with a radial cut-off eta, u = eta(r) r^{2/3} sin(2 theta/3) is the weak solution in H^1_0 of -Delta u = f with f in C^infinity(closure), but its second derivatives behave like r^{-4/3} and u is not in H^2 near the reentrant corner" index="L 字型領域|えるじがたりょういき, 入隅|いりすみ, 角の特異性|かどのとくいせい"}
$\Omega_{L}\defeq(-1,1)^{2}\setminus\bigl([0,1)\times(-1,0]\bigr)$（$n=2$）とし、極座標 $x=r\cos\theta$, $y=r\sin\theta$ で $\theta\in(0,\frac{3\pi}{2})$ をとる（$B(0,1)\cap\Omega_{L}$ はちょうど $0<r<1$, $0<\theta<\frac{3\pi}{2}$ の扇形）。$\alpha\defeq\frac23$、$s\defeq r^{\alpha}\sin(\alpha\theta)$ とし、$\eta\in C^{\infty}([0,\infty))$ を $[0,\frac12]$ で $1$、$[\frac34,\infty)$ で $0$ とする。$u\defeq\eta(r)s$（$r\ge\frac34$ では $0$）、$f\defeq-\Delta u$ とおく。
1. $f=-\bigl(\eta''+(1+2\alpha)\frac{\eta'}{r}\bigr)s$ で、$f$ は $r<\frac12$ と $r>\frac34$ で $0$、$f\in C^{\infty}(\overline{\Omega_{L}})$。
2. $u\in H_{0}^{1}(\Omega_{L})$ は $-\Delta u=f$ のただ一つの弱解で、$u\in C^{\infty}(\Omega_{L})$。
3. どんな $\rho>0$ についても $u\notin H^{2}(\Omega_{L}\cap B(0,\rho))$。
:::

::: proof
**Step 1.** 【主張：扇形で $s$ は調和で、$|\nabla s|^{2}=\alpha^{2}r^{2\alpha-2}$、$\sum_{i,j}(\partial_{i}\partial_{j}s)^{2}=2\alpha^{2}(1-\alpha)^{2}r^{2\alpha-4}$】$h(z)\defeq z^{\alpha}=r^{\alpha}e^{i\alpha\theta}$（偏角を $(-\frac\pi2,\frac{3\pi}{2})$ にとる枝）は扇形を含む領域で正則で、$s=\operatorname{Im}h$。$\partial_{x}h=h'$, $\partial_{y}h=ih'$ から $\partial_{x}s=\operatorname{Im}h'$, $\partial_{y}s=\operatorname{Re}h'$、さらに $\partial_{x}^{2}s=\operatorname{Im}h''$, $\partial_{x}\partial_{y}s=\operatorname{Re}h''$, $\partial_{y}^{2}s=-\operatorname{Im}h''$。よって $\Delta s=0$、$|\nabla s|=|h'|=\alpha r^{\alpha-1}$、2 階導関数の 2 乗和は $2|h''|^{2}=2\alpha^{2}(1-\alpha)^{2}r^{2\alpha-4}$。

**Step 2（1）.** 【主張：$f$ の式と滑らかさ】$\Delta(\eta s)=s\Delta\eta+2\nabla\eta\cdot\nabla s+\eta\Delta s$。平面の放射関数について $\Delta\eta=\eta''+\frac{\eta'}{r}$、$\nabla\eta\cdot\nabla s=\eta'\partial_{r}s=\eta'\alpha r^{\alpha-1}\sin(\alpha\theta)=\frac{\alpha\eta'}{r}s$、$\Delta s=0$。$\eta'$, $\eta''$ は $[\frac12,\frac34]$ の外で $0$ で、$\frac12\le r\le\frac34$ では $s$ は $\overline{\Omega_{L}}$ の点の $(x,y)$ について実解析的（原点から離れているので $h$ が正則）。

**Step 3（2 の前半）.** 【主張：$u\in H^{1}(\Omega_{L})$】$u\in C^{\infty}(\Omega_{L})$ で、$|u|\le r^{\alpha}$、$|\nabla u|\le|\eta'|r^{\alpha}+\alpha r^{\alpha-1}$。$\int_{0}^{1}r^{2\alpha-2}\,r\,dr<\infty$ なので $\nabla u\in L^{2}$。$C^{1}$ 関数の古典的な導関数は弱微分なので $u\in H^{1}(\Omega_{L})$。

**Step 4（2 の前半の続き）.** 【主張：$u\in H_{0}^{1}(\Omega_{L})$】$\vartheta\in C^{\infty}(\mathbb{R})$ を $t\le1$ で $0$、$t\ge2$ で $1$ とし、$\Theta_{\delta}\defeq\vartheta(\frac r\delta)\vartheta(\frac\theta\delta)\vartheta(\frac{3\pi/2-\theta}{\delta})$ とおく。$\Theta_{\delta}u$ は $\delta\le r\le\frac34$, $\delta\le\theta\le\frac{3\pi}{2}-\delta$ に台をもつ $C^{\infty}$ 関数で、$C_{c}^{\infty}(\Omega_{L})$ に入る。$\|(1-\Theta_{\delta})u\|_{2}$ と $\|(1-\Theta_{\delta})\nabla u\|_{2}$ は、測度が $0$ に縮む集合 $\{r<2\delta\}\cup\{\theta<2\delta\}\cup\{\theta>\frac{3\pi}{2}-2\delta\}$ の上の積分なので、優収束定理で $0$ に収束する。残る $u\nabla\Theta_{\delta}$ について：$r$ の切り落としの勾配は $\delta<r<2\delta$ で $\frac{C}{\delta}$ 以下で $|u|\le r^{\alpha}$ なので、その寄与の 2 乗は $C\delta^{-2}(2\delta)^{2\alpha}\cdot\frac{3\pi}{2}\cdot2\delta^{2}\to0$。$\theta$ の切り落としの勾配は $\delta<\theta<2\delta$ で $\frac{C}{\delta r}$ 以下で、そこで $|u|\le r^{\alpha}\alpha\theta\le2\alpha\delta r^{\alpha}$（$|\sin t|\le t$）なので、寄与の 2 乗は $C\int_{\delta}^{2\delta}d\theta\int_{0}^{1}r^{2\alpha-2}\,r\,dr\le C'\delta\to0$。$\theta=\frac{3\pi}{2}$ の側も、$\sin(\alpha\theta)=\sin(\pi-\alpha\theta)\le\alpha(\frac{3\pi}{2}-\theta)$ から同じ。よって $\Theta_{\delta}u\to u$（$H^{1}$）。

**Step 5（2 の後半）.** 【主張：$u$ はただ一つの弱解】Step 3・4 と $-\Delta u=f$（各点）から \ref{pde:weak-elliptic-classical.1} で弱解。一意性は \ref{pde:weak-elliptic-existence.2}（$b=0$, $c=0$）。

**Step 6（3）.** 【主張：$H^{2}$ に入らない】$\rho\le\frac12$ としてよい。$\Omega_{L}\cap B(0,\rho)$ で $u=s$ は $C^{2}$ なので、$H^{2}$ に入るなら弱い 2 階導関数は古典的なものに等しく、Step 1 から $\int\sum(\partial_{i}\partial_{j}s)^{2}=\frac{3\pi}{2}\int_{0}^{\rho}2\alpha^{2}(1-\alpha)^{2}r^{2\alpha-3}\,dr$。$2\alpha-3=-\frac53\le-1$ なので発散する。
:::

$f$ は $\overline{\Omega_{L}}$ の上で滑らかで、しかも角の近くでは $0$ なのに、解は角で $H^{2}$ に入らない。解は $\Omega_{L}$ の内部では $C^{\infty}$ で（\ref{pde:reg-interior-smooth} と整合する）、境界の平らな部分の近くでも滑らかである。崩れるのは入隅だけで、そこで境界は $C^{1}$ ですらない。角の大きさ $\omega$ の扇形では同じ関数が $r^{\pi/\omega}\sin(\pi\theta/\omega)$ になり、$H^{2}$ に入るかどうかは $\omega\le\pi$ かどうかで決まる（\ref{pde:prob-rgc-sector}）。凸な角では特異性が弱く、この例のような破れは起こらない。

::: supplement
**前提を変えると.** 二つの例は、正則性の理論の前提がそれぞれ別の場所で効いていることを示している。係数の滑らかさは内部の差分商の評価（\ref{pde:reg-difference-energy} の $M_{1}$）に、境界の滑らかさは平坦化した係数の滑らかさ（\ref{pde:reg-flattening}）に入っていた。どちらの例でも \ref{pde:reg-interior-smooth} の結論（係数と右辺が滑らかな所では解も滑らか）は崩れておらず、破れは係数の跳びの上や角の点に閉じ込められている。凸な角では $H^{2}$ 正則性が保たれることが知られている（Grisvard『Elliptic Problems in Nonsmooth Domains』。このサイトでは証明しない）。

**似た定理.** 古典的手法でも、前提を外すと解が悪くなった：連続なだけの右辺のポアソン方程式には $C^{2}$ 解がないことがあり（\ref{pde:newton-continuous-counterexample}）、外部錐条件を満たさない境界点ではディリクレ問題が古典的に解けないことがある（\ref{pde:lebesgue-spine}）。弱解の理論では解はいつでもあるが、その滑らかさに同じ種類の前提が要る。

**高い視点：特異性は前提の欠けた所に住む.** 楕円型方程式の解は、係数・境界・右辺が滑らかな所では必ず滑らかで、滑らかでなくなるのは前提が欠けた所だけである。比喩で言えば、張った膜は、枠がまっすぐな所ではなめらかにたわむが、枠が内側に折れ込んだ角（入隅）では膜が角に引っ張られてしわ（大きな曲率）が集まり、材質の違う膜を縫い合わせた線（係数の跳び）では傾きが折れる。どちらも膜全体の存在（弱解の存在）には影響しない。
:::

## 問題 {#pde:sec-rgc-problems}

::: problem {#pde:prob-rgc-continuous-coefficient}
$\Omega=(-1,1)$、$a(x)\defeq2+\sqrt{|x|}$ とし（連続、$\theta=2$）、$u(x)\defeq\int_{0}^{x}\frac{dt}{a(t)}$ とおく。
1. $u$ は $\Omega$ における $-(au')'=0$ の弱解であることを示せ。
2. どんな $\delta\in(0,1)$ についても $u\notin H^{2}(-\delta,\delta)$ であることを示せ。\ref{pde:reg-interior-h2} のどの前提が満たされていないか。
:::

::: solution
**1.** $\frac1a$ は連続で $\frac13\le\frac1a\le\frac12$ なので、$u$ は $C^{1}$ で $u'=\frac1a$、$u\in H^{1}(\Omega)$。$au'=1$ なので $v\in C_{c}^{\infty}(\Omega)$ について $\int au'v'=\int v'=0$。

**2.** $u\in H^{2}(-\delta,\delta)$ なら $u'=\frac1a\in H^{1}(-\delta,\delta)$ で、\ref{fa:sobolev-one-dimension} から（$u'$ は連続なのでそれ自身が）絶対連続で、a.e. の導関数が $L^{2}$ に入る。$x>0$ では $\bigl(\frac1a\bigr)'=-\frac{1}{2\sqrt x\,(2+\sqrt x)^{2}}$ で、$0<x<\delta$ で $(2+\sqrt x)^{2}\le9$ なので $\bigl|\bigl(\frac1a\bigr)'\bigr|^{2}\ge\frac{1}{324x}$。$\int_{0}^{\delta}\frac{dx}{x}=\infty$ なので $L^{2}$ に入らず、矛盾。満たされていないのは「$a^{11}\in C^{1}$（リプシッツ連続）」で、$a$ は $0$ で $\frac12$ 次のヘルダー連続にすぎない。係数の連続性だけでは $H^{2}$ 正則性に足りない。
:::

::: problem {#pde:prob-rgc-sector}
$0<\omega<2\pi$ とし、扇形 $S_{\omega}\defeq\{(r\cos\theta,r\sin\theta):0<r<1,\ 0<\theta<\omega\}$ で $\alpha\defeq\frac\pi\omega$, $s_{\omega}\defeq r^{\alpha}\sin(\alpha\theta)$ とする。
1. $s_{\omega}$ は $S_{\omega}$ で調和で、辺 $\theta=0$ と $\theta=\omega$ の上で $0$ になることを確かめよ。
2. $s_{\omega}\in H^{2}(S_{\omega}\cap B(0,\frac12))$ であるための必要十分条件は $\omega\le\pi$ であることを示せ。$\omega=\pi$ のとき $s_{\omega}$ は何か。
:::

::: solution
**1.** \ref{pde:reg-corner-counterexample} の証明の Step 1 と同じく、$s_{\omega}=\operatorname{Im}z^{\alpha}$（偏角を $(0,\omega)$ を含む区間にとる枝）は正則関数の虚部なので調和。$\sin(\alpha\cdot0)=0$, $\sin(\alpha\omega)=\sin\pi=0$。

**2.** 同じ計算で 2 階導関数の 2 乗和は $2\alpha^{2}(1-\alpha)^{2}r^{2\alpha-4}$ で、その積分は $2\omega\alpha^{2}(1-\alpha)^{2}\int_{0}^{1/2}r^{2\alpha-3}dr$。$\alpha=1$（$\omega=\pi$）なら被積分関数は $0$、$\alpha\ne1$ なら積分が有限であることと $2\alpha-3>-1$、つまり $\alpha>1$、すなわち $\omega<\pi$ が同値。$s_{\omega}$ は $C^{2}$ で、1 階導関数の 2 乗の積分 $\omega\alpha^{2}\int r^{2\alpha-1}dr$ と $s_{\omega}$ 自身の 2 乗の積分は常に有限なので、$H^{2}$ に入ることは 2 階導関数の 2 乗が可積分であることと同値（\ref{pde:reg-corner-counterexample} の Step 6 と同じ理由）。よって $\omega\le\pi$ が必要十分。$\omega=\pi$ では $s_{\pi}=r\sin\theta=y$ で、平らな境界の上の滑らかな関数である。
:::
