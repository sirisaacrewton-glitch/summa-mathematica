# 放物型方程式の正則性と半群 {#pde:page-parabolic-semigroup keywords="regularity of weak solutions of parabolic equations, u' in L^2(0,T;L^2), u in L^2(0,T;H^2), semigroup generated by a symmetric elliptic operator, eigenfunction expansion e^{-tL} g, Lumer-Phillips, comparison of Galerkin and semigroup methods, comparison with heat kernel and maximum principle, 放物型方程式の正則性, 熱半群, 固有関数展開, 縮小半群, ガレルキン法と半群"}

前のページ（\tref{pde:page-parabolic}）では、有界可測な係数の放物型方程式 $u_{t}+Lu=f$, $u=0$（$\partial\Omega$）, $u(0)=g$ の弱解を、$g\in L^{2}$, $f\in L^{2}(0,T;H^{-1})$ についてガレルキン法で作り、エネルギー法で一意性を示した。このページでは三つのことを行う。第 1 節では、データが一段よい（$g\in H_{0}^{1}$, $f\in L^{2}(0,T;L^{2})$）とき、解の時間微分が $L^{2}$ に入ることを、近似解に $u_{m}'$ を掛ける評価で示し、楕円型の正則性を仮定すれば $u(t)\in H^{2}$ も従うことを見る。第 2 節では、$L$ が対称なとき、$-L$ が固有関数展開で書ける半群を生成し、解が $e^{-tL}g$ であることを示す（作用素半群の一般論 \ref{fa:hille-yosida}, \ref{fa:lumer-phillips} の具体例）。第 3 節で、ガレルキン法・半群・古典的手法（熱核・最大値原理・フーリエの方法）が要求する前提を対比する。

## 記法と定義の確認 {#pde:sec-pa-rs-notation}

::: notation
- 記号は前のページのとおり：$\Omega$ は有界な開集合、$V=H_{0}^{1}(\Omega)$, $H=L^{2}(\Omega)$, $V^{*}=H^{-1}(\Omega)$、$V\subset H\subset V^{*}$。$L$ は係数が $x$ だけの有界可測関数の一様楕円型作用素（\ref{pde:bilinear-elliptic-form}）、$B[u,v]$ はその双線形形式、$\alpha,\beta,\gamma$ は \ref{pde:bilinear-energy-estimates} の定数、$\theta,\Lambda,b_{\infty},c_{\infty},c_{-}$ は \ref{pde:bilinear-elliptic-form.3} の定数。$\mathcal{A}\colon V\to V^{*}$ は $\langle\mathcal{A}u,v\rangle=B[u,v]$。
- ボホナー空間 $L^{2}(0,T;X)$ とボホナー積分は \ref{pde:bochner-space}, \ref{pde:bochner-integral}、時間の弱微分は \ref{pde:bochner-weak-derivative}、連続性とノルムの微分は \ref{pde:bochner-continuity}。弱解は \ref{pde:parabolic-weak-solution}、一意性は \ref{pde:parabolic-uniqueness}、存在とガレルキン近似 $u_{m}$ の弱収束は \ref{pde:parabolic-existence}、近似の性質は \ref{pde:parabolic-galerkin-approx}。$(e_{k},\lambda_{k})$ はディリクレ・ラプラシアンの固有関数と固有値、$P_{m}$ は \ref{pde:bochner-spectral-coordinates.4} の射影。
- $u'\in L^{2}(0,T;H)$ とは、$h\in L^{2}(0,T;H)$ で a.e. の $t$ について $u'(t)=h(t)$（$V^{*}$ の元として）となるものがあること。$L^{2}(0,T;H^{2}(\Omega))$ は \ref{pde:bochner-space.4} で $X=H^{2}(\Omega)$（\ref{fa:sobolev-complete.2}）としたもの。
- 作用素半群：強連続半群と生成作用素 \ref{fa:c0-semigroup}、基本性質 \ref{fa:semigroup-basic}、ルーマー–フィリップスの定理 \ref{fa:lumer-phillips}（そこでは複素ヒルベルト空間）。対称な $L$ の固有関数展開は \ref{pde:weak-symmetric-eigen}。
- **選択公理**：前のページと同じく、固有関数の基底（\ref{fa:dirichlet-eigenfunctions}, \ref{pde:weak-symmetric-eigen}）が従属選択公理・可算選択公理に依存する。このページで新たに使う箇所はない。
:::

## 正則性 {#pde:sec-pa-regularity}

エネルギー評価 \ref{pde:parabolic-energy-estimate} は、方程式に $u$ を掛けて得た。データが一段よければ、近似解の方程式に $u_{m}'$ を掛けることで、時間微分を $L^{2}$ で押さえられる。これには、主要部の双線形形式が対称で、$\frac{d}{dt}$ を外に出せることが要る。

::: theorem 放物型方程式の弱解の正則性 {#pde:parabolic-regularity keywords="regularity of weak solutions: if a^{ij} is symmetric, g in H^1_0 and f in L^2(0,T;L^2), then u' is in L^2(0,T;L^2) and ess sup ||u(t)||_{H^1} is finite; if moreover the elliptic H^2 estimate holds (C^2 boundary, C^1 coefficients), then u is in L^2(0,T;H^2)" index="正則性（放物型方程式）|せいそくせいほうぶつがたほうていしき"}
$L$ を記法のとおりとし、さらに $a^{ij}=a^{ji}$ とする。$g\in H_{0}^{1}(\Omega)$, $f\in L^{2}(0,T;L^{2}(\Omega))$ とし、$u$ を弱解とする。$C_{0}\defeq e^{2\gamma T}(\|g\|_{2}^{2}+\frac{1}{\beta}\|f\|_{L^{2}(0,T;H)}^{2})$、
$$
C_{2}\defeq(\Lambda+c_{\infty})\|g\|_{H^{1}}^{2}+2\|f\|_{L^{2}(0,T;H)}^{2}+\Bigl(\frac{2b_{\infty}^{2}}{\beta}+c_{-}\Bigr)C_{0}
$$
とおく。
1. $u'\in L^{2}(0,T;H)$ で $\|u'\|_{L^{2}(0,T;H)}^{2}\le C_{2}$。また a.e. の $t$ で $\|u(t)\|_{H^{1}}^{2}\le C_{0}+C_{2}/\theta$。
2. 次の楕円型の正則性 (R) を仮定する：ある $\mu\ge\gamma$ と $C_{R}$ があって、すべての $h\in L^{2}(\Omega)$ について、$Lw+\mu w=h$ の弱解 $w$（\ref{pde:weak-elliptic-existence.1}）は $H^{2}(\Omega)$ に入り $\|w\|_{H^{2}}\le C_{R}\|h\|_{2}$。このとき $u\in L^{2}(0,T;H^{2}(\Omega))$ で
$$
\|u\|_{L^{2}(0,T;H^{2})}\le C_{R}\bigl(\|f\|_{L^{2}(0,T;H)}+\|u'\|_{L^{2}(0,T;H)}+\mu\|u\|_{L^{2}(0,T;H)}\bigr).
$$
:::

::: intuition
初期値が境界条件と両立する $H_{0}^{1}$ の関数で、熱源が $L^{2}$ なら、温度の時間変化の速さは 2 乗して積分できる。各時刻の温度分布は「右辺が $L^{2}$ の楕円型方程式」の解になるので、楕円型の正則性があれば空間について 2 回微分できる。
:::

::: proof
$A[u,v]\defeq\int(\sum_{i,j}a^{ij}\partial_{i}u\,\partial_{j}v+cuv)$ とおくと、$B[u,v]=A[u,v]+\int\sum_{i}b^{i}\partial_{i}u\,v$ で、$A$ は対称。$u_{m}=\sum_{k\le m}d_{m}^{k}e_{k}$ をガレルキン近似とする。

**Step 1.** 【主張：a.e. の $t$ で $\|u_{m}'\|_{2}^{2}+\frac{d}{dt}A[u_{m},u_{m}]\le2\|f\|_{2}^{2}+2b_{\infty}^{2}\|\nabla u_{m}\|_{2}^{2}$】\eqref{pde:eq-pa-galerkin} に $(d_{m}^{j})'$ を掛けて $j\le m$ で足すと、$u_{m}'(t)=\sum_{j}(d_{m}^{j})'e_{j}\in V$ について $\|u_{m}'\|_{2}^{2}+B[u_{m},u_{m}']=(f,u_{m}')$。$A[u_{m},u_{m}]=\sum_{j,k}A[e_{j},e_{k}]d_{m}^{j}d_{m}^{k}$ は絶対連続で、対称性から a.e. で $\frac{d}{dt}A[u_{m},u_{m}]=2A[u_{m},u_{m}']$。残りの項を初等的な不等式で $|\int\sum b^{i}\partial_{i}u_{m}\,u_{m}'|\le b_{\infty}\|\nabla u_{m}\|_{2}\|u_{m}'\|_{2}\le\frac14\|u_{m}'\|_{2}^{2}+b_{\infty}^{2}\|\nabla u_{m}\|_{2}^{2}$、$|(f,u_{m}')|\le\frac14\|u_{m}'\|_{2}^{2}+\|f\|_{2}^{2}$ と評価し、2 倍する。

**Step 2.** 【主張：$\int_{0}^{T}\|u_{m}'\|_{2}^{2}\le C_{2}$、すべての $t$ で $\theta\|\nabla u_{m}(t)\|_{2}^{2}\le C_{2}$】Step 1 を $0$ から $t$ まで積分する（\ref{meas:ftc-lebesgue}）。一様楕円性から $A[v,v]\ge\theta\|\nabla v\|_{2}^{2}-c_{-}\|v\|_{2}^{2}$、コーシー–シュワルツの不等式から $A[v,v]\le(\Lambda+c_{\infty})\|v\|_{H^{1}}^{2}$。$\|u_{m}(0)\|_{H^{1}}=\|P_{m}g\|_{H^{1}}\le\|g\|_{H^{1}}$（\ref{pde:bochner-spectral-coordinates.4}。ここで $g\in V$ を使う）、$\|u_{m}(t)\|_{2}^{2}\le C_{0}$ と $\int\|\nabla u_{m}\|_{2}^{2}\le C_{0}/\beta$（\ref{pde:parabolic-galerkin-approx.3}。$\|f\|_{L^{2}(0,T;V^{*})}\le\|f\|_{L^{2}(0,T;H)}$）を入れると
$$
\begin{aligned}\int_{0}^{t}\|u_{m}'\|_{2}^{2}+\theta\|\nabla u_{m}(t)\|_{2}^{2}&\le(\Lambda+c_{\infty})\|g\|_{H^{1}}^{2}+2\|f\|^{2}_{L^{2}(0,T;H)}\\&\quad+\frac{2b_{\infty}^{2}}{\beta}C_{0}+c_{-}C_{0}=C_{2}.\end{aligned}
$$

**Step 3.** 【主張：$u'\in L^{2}(0,T;H)$ で $\|u'\|^{2}\le C_{2}$】$(u_{m}')$ はヒルベルト空間 $L^{2}(0,T;H)$（\ref{pde:bochner-hilbert-coordinates.3}）で有界なので、部分列が $h$ に弱収束する（\ref{fa:hilbert-weak-compactness}）。$k$ と $\psi\in L^{2}(0,T)$ について $y\mapsto\int\psi(y(t),e_{k})$ は $L^{2}(0,T;H)$ 上で、$y\mapsto\int\psi\langle y(t),e_{k}\rangle$ は $L^{2}(0,T;V^{*})$ 上で有界線形で、$u_{m}'$ に対して値が等しい。\ref{pde:parabolic-existence.2} から $u_{m}'\rightharpoonup u'$（$L^{2}(0,T;V^{*})$）なので、極限で $\int\psi(\langle u',e_{k}\rangle-(h,e_{k}))=0$。$\psi$ は任意なので a.e. で $\langle u'(t),e_{k}\rangle=(h(t),e_{k})$、可算個の $k$ について合わせて \ref{pde:bochner-spectral-coordinates.3} から a.e. で $u'(t)=h(t)$。ノルムの評価は \ref{fa:weak-convergence-basic.3}。

**Step 4.** 【主張：a.e. で $\|u(t)\|_{H^{1}}^{2}\le M^{2}\defeq C_{0}+C_{2}/\theta$】Step 2 と $\|u_{m}(t)\|_{2}^{2}\le C_{0}$ から、すべての $t$ で $\|u_{m}(t)\|_{H^{1}}^{2}\le M^{2}$。可測集合 $E\subset(0,T)$ について $z\mapsto\mathbf{1}_{E}z$ は $L^{2}(0,T;V)$ 上の有界線形作用素なので、$\mathbf{1}_{E}u_{m}\rightharpoonup\mathbf{1}_{E}u$ で、\ref{fa:weak-convergence-basic.3} から $\int_{E}\|u\|_{H^{1}}^{2}\le\liminf\int_{E}\|u_{m}\|_{H^{1}}^{2}\le M^{2}|E|$。$E\defeq\{t:\|u(t)\|_{H^{1}}>M\}$ とすると、$|E|>0$ なら $\int_{E}(\|u\|_{H^{1}}^{2}-M^{2})>0$ となり矛盾。

**Step 5（2）.** 【主張：$u\in L^{2}(0,T;H^{2})$】(R) の対応 $G_{\mu}\colon h\mapsto w$ は、弱解の一意性から線形で、$H$ から $H^{2}(\Omega)$ への有界作用素。$F\defeq f-u'+\mu u\in L^{2}(0,T;H)$ とおくと、弱解の定義と $u'(t)\in H$ から、a.e. の $t$ ですべての $v\in V$ について $B[u(t),v]+\mu(u(t),v)=(F(t),v)$。一意性から a.e. で $u(t)=G_{\mu}F(t)$。\ref{pde:bochner-integral.2} から $G_{\mu}F$ は $H^{2}$ に値をとる強可測関数で、$\|G_{\mu}F(t)\|_{H^{2}}\le C_{R}\|F(t)\|_{2}$。$L^{2}(0,T)$ の三角不等式で評価を得る。

::: hypcheck
- **$a^{ij}$ の対称性**：Step 1 で $B[u_{m},u_{m}']$ の主要部を $\frac12\frac{d}{dt}A[u_{m},u_{m}]$ と書くのに使った。$b$ の項は対称性なしに評価できた。
- **$g\in H_{0}^{1}$**：Step 2 で $A[u_{m}(0),u_{m}(0)]$ を $m$ によらず押さえるのに使った。外すと 1 は偽：$L=-\Delta$, $f=0$, $g\in L^{2}\setminus H_{0}^{1}$ なら $\int_{0}^{T}\|u'\|_{2}^{2}=\infty$（\ref{pde:prob-pa-energy-dissipation}）。$P_{m}$ が $H^{1}$ のノルムを増やさないこと（固有関数の基底を選んだ理由）もここで使った。
- **$f\in L^{2}(0,T;L^{2})$**：Step 1 の $(f,u_{m}')$ の評価で使った。$f\in L^{2}(0,T;H^{-1})$ では $u_{m}'$ の $H^{1}$ ノルムが要り、評価が閉じない。
- **係数の時間によらないこと**：Step 1 で $\frac{d}{dt}A[u_{m},u_{m}]=2A[u_{m},u_{m}']$ とするのに使った。$a^{ij}$ が $t$ についてリプシッツなら、余分な項 $\int\partial_{t}a^{ij}\partial_{i}u_{m}\partial_{j}u_{m}$ をグロンウォール型の議論で吸収できる。
- **境界・係数の正則性**：1 では使っていない。2 では (R) にすべて押し込めた。(R) は $\partial\Omega$ が $C^{2}$ 級で $a^{ij}\in C^{1}(\overline{\Omega})$ のとき成り立つ（\see[弱解の正則性]{pde:page-regularity}）。1 次元では下の例のように直接確かめられる。
- **公理**：Step 3 の部分列は \ref{fa:hilbert-weak-compactness} による。
:::
:::

::: example
**(R) が直接確かめられる場合.** $n=1$, $\Omega=(0,\ell)$, $Lw=-w''+cw$（$c$ は有界可測）とする。$\mu\ge\gamma=c_{-}$ と $h\in L^{2}$ について弱解 $w\in H_{0}^{1}$ は、$v\in C_{c}^{\infty}$ について $\int w'v'=\int(h-(c+\mu)w)v$ を満たすので、$w'$ の弱微分は $-(h-(c+\mu)w)\in L^{2}$ で、$\|w''\|_{2}\le\|h\|_{2}+(c_{\infty}+\mu)\|w\|_{2}\le(1+\frac{c_{\infty}+\mu}{\beta})\|h\|_{2}$（\ref{pde:weak-elliptic-existence.1} と $\|h\|_{H^{-1}}\le\|h\|_{2}$）。$\|w\|_{H^{1}}\le\|h\|_{2}/\beta$ と合わせて (R) が成り立つ。したがってこの場合、$g\in H_{0}^{1}$, $f\in L^{2}(0,T;L^{2})$ なら弱解は $u\in L^{2}(0,T;H^{2})$, $u'\in L^{2}(0,T;L^{2})$ を満たし、$-u''+cu=f-u'$ が a.e. の $(x,t)$ で成り立つ。
:::

::: supplement
**前提を変えると.** 同じ議論を繰り返すと、$g$ と $f$ が境界で適切な**両立条件**（$g\in H_{0}^{1}$ のほか、$f(0)-Lg\in H_{0}^{1}$ など）を満たし、係数と境界が滑らかなら、解は $\overline{\Omega}\times[0,T]$ まで滑らかになる。両立条件がないと、$t=0$ と $\partial\Omega$ の交わりで滑らかさが失われる（$g=1$ の例）。一方 $t>0$ では、データが $L^{2}$ でも解は滑らかになる（平滑化。$f=0$ の場合は次の節の固有関数展開から見える）。

**似た定理.** 全空間の熱方程式の平滑化 \ref{pde:heat-smoothing} は熱核の評価で示した。閉多様体の上では \ref{gl:heat-smoothing}。ここでの 1 は平滑化ではなく、「データの滑らかさが保たれる」型の正則性である。

**高い視点：掛けるものを替える.** $u$ を掛けると $L^{2}$ のエネルギー、$u'$ を掛けると $H^{1}$ のエネルギー $A[u,u]$ とその散逸 $\|u'\|^{2}$ が出る。比喩で言えば、同じ方程式を違う秤で量ることで、違う量の収支が見える。どの秤が使えるかは近似解の側で許されるかどうかで決まり、ガレルキン近似が有限次元で $u_{m}'$ をそのまま掛けられることが、この方法の強みである。
:::

## 半群による別証明 {#pde:sec-pa-semigroup}

$L$ が対称なとき、時間について定数係数の線形方程式 $u'=-Lu$ は、行列の場合（\ref{ode:constant-coefficients}）と同じく $u(t)=e^{-tL}g$ で解けるはずである。\ref{pde:weak-symmetric-eigen} の固有関数でこれを具体的に作る。

::: notation
この節では $a^{ij}=a^{ji}$, $b=0$（$c$ は有界で符号は任意）とし、$(\varphi_{k},\mu_{k})_{k\ge1}$ を \ref{pde:weak-symmetric-eigen} の固有関数と固有値とする：$(\varphi_{k})$ は $H$ の正規直交基底、$\varphi_{k}\in V$、$B[\varphi_{k},v]=\mu_{k}(\varphi_{k},v)$（$v\in V$）、$-\gamma<\mu_{1}\le\mu_{2}\le\cdots\to\infty$。$\sigma\defeq\gamma+1$ とおき、$B_{\sigma}[u,v]\defeq B[u,v]+\sigma(u,v)$ とする。
:::

::: lemma 対称な作用素のスペクトル座標 {#pde:parabolic-symmetric-coordinates keywords="for a symmetric uniformly elliptic operator, B_sigma = B + sigma (,) is an inner product on H^1_0 equivalent to the H^1 inner product, phi_k / sqrt(mu_k + sigma) is an orthonormal basis, u in H^1_0 iff sum (mu_k + sigma)(u,phi_k)^2 < infinity, B[u,v] = sum mu_k (u,phi_k)(v,phi_k)" index="スペクトル座標（対称な楕円型作用素）|すぺくとるざひょうたいしょうなだえんがたさようそ"}
1. $B_{\sigma}$ は $V$ 上の内積で、$\beta\|u\|_{H^{1}}^{2}\le B_{\sigma}[u,u]\le(\alpha+\sigma)\|u\|_{H^{1}}^{2}$。$(\varphi_{k}/\sqrt{\mu_{k}+\sigma})_{k}$ は $(V,B_{\sigma})$ の正規直交基底。
2. $u\in H$ が $V$ に入るのは $\sum_{k}(\mu_{k}+\sigma)(u,\varphi_{k})^{2}<\infty$ のときに限り、そのとき $u,v\in V$ について $B[u,v]=\sum_{k}\mu_{k}(u,\varphi_{k})(v,\varphi_{k})$（絶対収束）。
:::

::: proof
1 の不等式はガルディングの不等式（$\sigma\ge\gamma$）と \ref{pde:bilinear-energy-estimates.1} から。$B_{\sigma}$ は $b=0$ と $a^{ij}=a^{ji}$ から対称で、不等式から正定値なので内積で、$(V,B_{\sigma})$ は $H^{1}$ のノルムと同値なノルムをもつので完備。あとは \ref{pde:bochner-spectral-coordinates} の 1・2 の証明で、$\langle\cdot,\cdot\rangle_{H^{1}}$ を $B_{\sigma}$ に、$1+\lambda_{k}$ を $\mu_{k}+\sigma$（$\ge1$）に、固有方程式を $B_{\sigma}[\varphi_{k},v]=(\mu_{k}+\sigma)(\varphi_{k},v)$ に替えれば同じである。最後の式は、パーセヴァルの等式の内積版 $B_{\sigma}[u,v]=\sum_{k}(\mu_{k}+\sigma)(u,\varphi_{k})(v,\varphi_{k})$ から $\sigma(u,v)=\sum_{k}\sigma(u,\varphi_{k})(v,\varphi_{k})$ を引いたもの。
:::

::: theorem 対称な楕円型作用素の生成する半群 {#pde:parabolic-semigroup keywords="for a symmetric uniformly elliptic operator L with Dirichlet condition, the operator A (u in H^1_0 with B[u,.] = (h,.)) has eigenexpansion A u = sum mu_k (u,phi_k) phi_k; T(t) g = sum e^{-mu_k t}(g,phi_k) phi_k is a C_0 semigroup with generator -A and ||T(t)|| = e^{-mu_1 t}, a contraction semigroup if mu_1 >= 0; u(t) = T(t) g is the weak solution of u_t + L u = 0, u(0) = g" index="熱半群（楕円型作用素）|ねつはんぐんだえんがたさようそ, 固有関数展開（放物型方程式）|こゆうかんすうてんかいほうぶつがたほうていしき"}
$H$ の作用素 $A$ を、$D(A)\defeq\{u\in V:\text{ある }h\in H\text{ ですべての }v\in V\text{ について }B[u,v]=(h,v)\}$、$Au\defeq h$ で定める（$Lu=h$ の弱い意味。$h$ は $V$ の $H$ での稠密性から一意）。
1. $D(A)=\{u\in H:\sum_{k}\mu_{k}^{2}(u,\varphi_{k})^{2}<\infty\}$ で、$Au=\sum_{k}\mu_{k}(u,\varphi_{k})\varphi_{k}$。$(Au,v)=(u,Av)$、$(Au,u)\ge\mu_{1}\|u\|_{2}^{2}$。
2. $T(t)g\defeq\sum_{k}e^{-\mu_{k}t}(g,\varphi_{k})\varphi_{k}$（$t\ge0$）は強連続半群で、生成作用素は $-A$、$\|T(t)\|=e^{-\mu_{1}t}$。とくに $\mu_{1}\ge0$（たとえば $c\ge0$）なら縮小半群。
3. $g\in H$ について $u(t)\defeq T(t)g$ は、$f=0$ の \eqref{pde:eq-pa-problem} の弱解である。したがって \ref{pde:parabolic-existence} の解と一致する。
:::

::: intuition
対称な楕円型作用素は、固有関数ごとに「その固有値の速さで指数関数的に減衰させる」作用で時間発展を決める。解は、初期値を固有関数に分解し、各成分を $e^{-\mu_{k}t}$ 倍して足し戻したものである。
:::

::: proof
以下 $c_{k}\defeq(g,\varphi_{k})$ などと書く。

**Step 1（1）.** 【主張：$D(A)$ の特徴づけと $A$ の展開】$u\in D(A)$ なら、対称性と固有方程式から $(Au,\varphi_{k})=B[u,\varphi_{k}]=B[\varphi_{k},u]=\mu_{k}(u,\varphi_{k})$ なので、パーセヴァルの等式から $\sum\mu_{k}^{2}(u,\varphi_{k})^{2}=\|Au\|_{2}^{2}<\infty$ で展開が成り立つ。逆に $\sum\mu_{k}^{2}(u,\varphi_{k})^{2}<\infty$ なら、$\mu_{k}+\sigma\le\mu_{k}^{2}+\frac14+\sigma$ から $\sum(\mu_{k}+\sigma)(u,\varphi_{k})^{2}<\infty$ で、\ref{pde:parabolic-symmetric-coordinates.2} から $u\in V$、$h\defeq\sum\mu_{k}(u,\varphi_{k})\varphi_{k}\in H$ について $B[u,v]=\sum_{k}\mu_{k}(u,\varphi_{k})(v,\varphi_{k})=(h,v)$。残りの主張は展開とパーセヴァルの等式、$\mu_{k}\ge\mu_{1}$ から。

**Step 2.** 【主張：$T(t)$ は強連続半群で $\|T(t)\|=e^{-\mu_{1}t}$】$e^{-\mu_{k}t}\le e^{-\mu_{1}t}$ なので $T(t)$ は有界で $\|T(t)\|\le e^{-\mu_{1}t}$、$T(t)\varphi_{1}=e^{-\mu_{1}t}\varphi_{1}$ から等号。$T(0)=I$、$T(t+s)=T(t)T(s)$ は座標ごとに $e^{-\mu_{k}(t+s)}=e^{-\mu_{k}t}e^{-\mu_{k}s}$。$0<t\le1$ で $\|T(t)g-g\|_{2}^{2}=\sum_{k}(e^{-\mu_{k}t}-1)^{2}c_{k}^{2}$ の各項は $0$ に近づき、$(e^{\gamma}+1)^{2}c_{k}^{2}$ で押さえられるので、優収束定理（数え上げ測度）で $0$ に近づく。

**Step 3.** 【主張：生成作用素は $-A$】$q(\mu,t)\defeq\frac{e^{-\mu t}-1}{t}$ とおくと $q(\mu,t)\to-\mu$（$t\to0+$）で、平均値の定理から $0<t\le1$, $\mu>-\gamma$ について $|q(\mu,t)|\le|\mu|e^{\gamma}$。$g\in D(A)$ なら $\|\frac{T(t)g-g}{t}+Ag\|_{2}^{2}=\sum_{k}(q(\mu_{k},t)+\mu_{k})^{2}c_{k}^{2}$ の各項は $0$ に近づき、$(e^{\gamma}+1)^{2}\mu_{k}^{2}c_{k}^{2}$（総和は有限）で押さえられるので $0$ に近づく。逆に、生成作用素 $G$ の定義域の $g$ については、座標ごとに $q(\mu_{k},t)c_{k}\to(Gg,\varphi_{k})$ なので $(Gg,\varphi_{k})=-\mu_{k}c_{k}$、$\sum\mu_{k}^{2}c_{k}^{2}=\|Gg\|_{2}^{2}<\infty$ で $g\in D(A)$、$Gg=-Ag$。

**Step 4.** 【主張：$u\in L^{2}(0,T;V)$】$u(t)$ の $(V,B_{\sigma})$ の基底 $\varphi_{k}/\sqrt{\mu_{k}+\sigma}$ に関する座標は $\sqrt{\mu_{k}+\sigma}\,e^{-\mu_{k}t}c_{k}$（連続）。$\mu_{k}\ge1$ なら $(\mu_{k}+\sigma)\int_{0}^{T}e^{-2\mu_{k}t}dt\le\frac{\mu_{k}+\sigma}{2\mu_{k}}\le\frac{1+\sigma}{2}$、$-\gamma<\mu_{k}<1$ なら $\le(1+\sigma)Te^{2\gamma T}$。よって \ref{pde:bochner-hilbert-coordinates.2} の和は $K\|g\|_{2}^{2}$（$K$ は二つの定数の大きい方）で押さえられ、$u\in L^{2}(0,T;(V,B_{\sigma}))=L^{2}(0,T;V)$（ノルムが同値なので強可測性も可積分性も変わらない）。

**Step 5.** 【主張：$u'=-\mathcal{A}u$ で、$u$ は弱解】$-\mathcal{A}u\in L^{2}(0,T;V^{*})$（\ref{pde:bochner-integral.2}）。$\varphi\in C_{c}^{\infty}((0,T))$ と $v\in V$ について、$V^{*}$ の元 $\int\varphi'u+\int\varphi(-\mathcal{A}u)$ の $v$ での値は、\ref{pde:bochner-integral.2} と \ref{pde:parabolic-symmetric-coordinates.2} から
$$
\int_{0}^{T}\sum_{k}\bigl(\varphi'(t)-\mu_{k}\varphi(t)\bigr)e^{-\mu_{k}t}c_{k}(\varphi_{k},v)\,dt.
$$
項別積分は、コーシー–シュワルツの不等式と $|\mu_{k}|\le(1+2\gamma)(\mu_{k}+\sigma)$ による $\sum_{k}|\mu_{k}e^{-\mu_{k}t}c_{k}(\varphi_{k},v)|\le(1+2\gamma)(\sum(\mu_{k}+\sigma)e^{-2\mu_{k}t}c_{k}^{2})^{1/2}(\sum(\mu_{k}+\sigma)(v,\varphi_{k})^{2})^{1/2}$ の可積分性（Step 4）から許され（\ref{meas:series-dominated}）、各項は $\frac{d}{dt}(\varphi e^{-\mu_{k}t})=(\varphi'-\mu_{k}\varphi)e^{-\mu_{k}t}$ の積分なので $0$。$V^{*}$ の元はすべての $v$ での値で決まるので $u'=-\mathcal{A}u$ で、弱解の定義の 1・2 が成り立つ。$u$ は Step 2 から $H$ に値をとる連続関数（したがって連続な代表そのもの）で $u(0)=g$。最後の主張は \ref{pde:parabolic-uniqueness}。

::: hypcheck
- **対称性（$a^{ij}=a^{ji}$, $b=0$）**：Step 1 で $B[u,\varphi_{k}]=B[\varphi_{k},u]$ とすることと、固有関数の正規直交基底（\ref{pde:weak-symmetric-eigen}）の存在に使った。対称でなくても $-A$ は半群を生成する（下の別証明）が、固有関数展開は一般に使えない。
- **係数の時間によらないこと**：本質的。$T(t)$ は一つの作用素 $A$ から作るので、$L$ が $t$ に依存すると定義できない。
- **$\Omega$ の有界性**：固有関数の基底の存在（コンパクトな埋め込み）に使った。
- **$\mu_{1}\ge0$**：縮小性だけに使う。$c$ が負で大きいと $\mu_{1}<0$ で、$\|T(t)\|=e^{|\mu_{1}|t}$ は増大する（解が指数関数的に増える）。
- **境界・係数の正則性**：使っていない。
:::
:::

::: proof 別証明（ルーマー–フィリップスの定理による生成） {of="pde:parabolic-semigroup"}
$L$ の対称性を仮定せず（$b$ があってもよい）、$A$ を同じく定義して、$-A$ が強連続半群を生成することを示す。\ref{fa:lumer-phillips} は複素ヒルベルト空間の定理なので、$H_{\mathbb{C}}\defeq L^{2}(\Omega;\mathbb{C})$ で $A_{\mathbb{C}}(u+iw)\defeq Au+iAw$（$D(A_{\mathbb{C}})=D(A)+iD(A)$）を考える。

**Step 1.** 【主張：$-(A_{\mathbb{C}}+\gamma)$ は散逸的】$x=u+iw$ について $\operatorname{Re}\langle A_{\mathbb{C}}x,x\rangle=(Au,u)+(Aw,w)=B[u,u]+B[w,w]$ なので、ガルディングの不等式から $\operatorname{Re}\langle-(A_{\mathbb{C}}+\gamma)x,x\rangle\le-\beta(\|u\|_{H^{1}}^{2}+\|w\|_{H^{1}}^{2})\le0$。

**Step 2.** 【主張：$D(A)$ は稠密で、$R(1+(A_{\mathbb{C}}+\gamma))=H_{\mathbb{C}}$】$h\in H$ について \ref{pde:weak-elliptic-existence.1}（$\mu=\gamma+1$）の弱解 $u$ は $B[u,v]=(h-(\gamma+1)u,v)$ を満たすので $u\in D(A)$、$(A+\gamma+1)u=h$。実部と虚部に分ければ複素の場合も同じ。$x\in H$ が $D(A)$ と直交すれば、$u\defeq(A+\gamma+1)^{-1}x\in D(A)$ について $B_{\gamma+1}[u,u]=(x,u)=0$ から $u=0$、よって $x=(A+\gamma+1)u=0$。

\ref{fa:lumer-phillips} から $-(A_{\mathbb{C}}+\gamma)$ は縮小半群 $S(t)$ を生成し、$\widetilde{T}(t)\defeq e^{\gamma t}S(t)$ は生成作用素 $-A_{\mathbb{C}}$ の強連続半群で $\|\widetilde{T}(t)\|\le e^{\gamma t}$（定義から直接確かめられる）。

**Step 3.** 【主張：対称な場合、$\widetilde{T}(t)$ は $T(t)$ の複素化に等しい】$g\in D(A_{\mathbb{C}})$ について、\ref{fa:semigroup-basic.3} から $z(t)\defeq\widetilde{T}(t)g-T(t)g$ は $C^{1}$ で $z'=-A_{\mathbb{C}}z$, $z(0)=0$, $z(t)\in D(A_{\mathbb{C}})$。$\frac{d}{dt}\|z\|^{2}=2\operatorname{Re}\langle z',z\rangle\le2\gamma\|z\|^{2}$（Step 1）から $e^{-2\gamma t}\|z(t)\|^{2}$ は増加せず、$z=0$。$D(A_{\mathbb{C}})$ は稠密で両辺は有界作用素なので、すべての $g$ で等しい。
:::

::: example
$\Omega=(0,\pi)$, $L=-\partial_{x}^{2}$ なら $\varphi_{k}=\sqrt{2/\pi}\sin kx$, $\mu_{k}=k^{2}$ で、$T(t)g$ は \ref{pde:sep-heat-dirichlet} の級数 $\sum b_{k}e^{-k^{2}t}\sin kx$ である。したがってその級数は、$g\in L^{2}$ だけで、弱解として初期境界値問題を解いている。一般の有界な $\Omega$ と $L=-\Delta$ では \ref{fa:heat-schrodinger-examples.1} と \ref{fa:prob-us-heat-semigroup} の熱半群 $e^{t\Delta_{D}}$ である。
:::

::: supplement
**前提を変えると（ガレルキン法と半群法の比較）.**
- **時間に依存する係数.** 半群は一つの生成作用素から作るので、$L=L(t)$ には直接使えない。$u(t)=U(t,s)u(s)$ となる**発展作用素**の族を、各時刻の $L(t)$ の半群をつないで作る理論が要る。ガレルキン法とエネルギー法は、評価が各時刻で同じ定数で成り立てばよいので、時間依存性をほとんど気にしない（前のページの補足）。具体例は \ref{pde:prob-pa-time-dependent}。
- **非対称な $L$.** 生成は別証明のとおり成り立つが、固有関数展開はなく、$\|T(t)\|$ の評価は $e^{\gamma t}$ のような粗いものになる。ガレルキン法ではラプラシアンの固有関数を使うので、$L$ の対称性はもともと要らない。
- **非斉次項.** $f\ne0$ なら、半群では $u(t)=T(t)g+\int_{0}^{t}T(t-s)f(s)ds$（\ref{ode:variation-of-constants} の無限次元版）を、ボホナー積分として扱い、それが弱解であることを別に確かめる必要がある。ガレルキン法では $f$ は最初から方程式に入っている。
- **何がわかるか.** 半群法は解を公式で与え、半群の性質（$\|T(t)\|=e^{-\mu_{1}t}$、$t>0$ での平滑化）が直接読める。ガレルキン法は存在だけを与えるが、前提が弱い。

**似た定理.** 閉多様体の熱半群 \ref{gl:heat-semigroup} は同じ構成で、そこでは楕円正則性から生成作用素の定義域が $H^{k}$ と一致した。ここでは $D(A)$ を弱い形で定義したので正則性の理論を使っていない。$\partial\Omega$ と係数が滑らかなら、(R) から $D(A)=H^{2}\cap H_{0}^{1}$ となる。

**高い視点：行列の指数関数.** $e^{-tA}$ は、行列の $e^{-tA}$（\ref{ode:constant-coefficients}）を、固有値が無限に大きくなる対称作用素へ延ばしたものである。$t>0$ では大きな固有値の成分が $e^{-\mu_{k}t}$ で急速に消えるので、どんな初期値もすぐに滑らかになる。逆向き（$t<0$）では同じ因子が爆発し、後退熱方程式が不適切であること（\ref{pde:heat-backward}）の、スペクトルによる説明になる。比喩で言えば、半群は高い音から順に消していく消音装置で、逆再生しようとすると消えた高音を無限に増幅しなければならない。
:::

## 古典的手法との対比 {#pde:sec-pa-comparison}

熱方程式（と放物型方程式）について、二つの系列で使った方法の前提と結論を並べる。

::: table 放物型方程式の解法の前提 {#pde:parabolic-comparison-table}
| 方法 | 領域・境界 | 作用素・係数 | データ | 解の意味と一意性の範囲 |
|---|---|---|---|---|
| 熱核（\ref{pde:heat-cauchy-solution}） | $\mathbb{R}^{n}$ | $-\Delta$（定数係数） | $g$ 有界連続 | 古典解。一意性は増大条件の下（\ref{pde:heat-uniqueness-rn}） |
| 最大値原理（\ref{pde:heat-cylinder-uniqueness}） | 有界、境界は任意 | $-\Delta$ | 放物境界で連続 | $C^{2,1}\cap C(\overline{\Omega}\times[0,T])$ での一意性・比較（存在は与えない） |
| フーリエの方法（\ref{pde:sep-heat-dirichlet}, \ref{pde:sep-sl-heat}） | 区間 | $-\partial_{x}^{2}$、1 次元の滑らかな係数 | $g\in L^{2}$ | $t>0$ で古典解、$L^{2}$ で初期値をとる |
| ガレルキン法（\ref{pde:parabolic-existence}） | 有界、境界は任意 | 発散形、有界可測 | $g\in L^{2}$, $f\in L^{2}(H^{-1})$ | 弱解。$u'\in L^{2}(H^{-1})$ をもつ関数の中で一意 |
| 半群（\ref{pde:parabolic-semigroup}） | 有界、境界は任意 | 対称・時間によらない（生成だけなら非対称可） | $g\in L^{2}$ | $C([0,T];L^{2})$ の解、弱解と一致 |
:::

::: supplement
**前提の対比.**
- **解の滑らかさ.** 古典的手法は解が $C^{2,1}$ 級であることを前提に、最大値原理で一意性を示した。関数解析的手法は解に $L^{2}(0,T;H_{0}^{1})$ しか要求せず、一意性はエネルギー評価から出る。代わりに、最大値原理の結論（$\min g\le u\le\max g$、比較原理）はエネルギー法からは直接出ない。弱解についての最大値原理は、$u$ の負の部分を試験関数に使う別の議論が要る（系列の弱最大値原理のページと同じ考え方）。
- **係数の正則性.** 熱核とフーリエの方法は定数係数（または 1 次元の滑らかな係数）でしか公式がない。ガレルキン法は有界可測な係数で動き、係数の滑らかさは正則性（第 1 節の (R)）を得るときにはじめて要る。
- **境界の正則性.** 最大値原理による一意性は境界の正則性を要らないが、存在を古典的に示すには領域ごとの公式か障壁が要った。弱解の存在は境界の正則性をまったく使わない。境界の正則性は $H^{2}$ 正則性（(R)）にだけ現れる。
- **データの正則性.** 古典的な初期境界値問題は $g$ の連続性と境界での両立（$g=0$ on $\partial\Omega$）を要する。弱解は $g\in L^{2}$ で両立条件を要らず、$u'\in L^{2}(L^{2})$ のような一段上の正則性で初めて $g\in H_{0}^{1}$（弱い両立条件）が要る。
- **伝播速度と一意性の範囲.** 全空間の熱方程式は\ref{pde:heat-tychonoff}のように増大条件なしでは一意性が崩れるが、有界な $\Omega$ の弱解は $L^{2}$ の枠の中で一意で、増大条件の問題は起きない。一方、無限の伝播速度（\ref{pde:heat-infinite-speed}）や、$g\ge0$ なら $u\ge0$ という正値性は、熱核の正値性や最大値原理から読み取る性質で、エネルギー評価や固有関数展開の係数からは直接は見えない。

**似た定理.** 双曲型方程式でも、ガレルキン法とエネルギー法が同じ形で使える（\see[双曲型方程式]{pde:page-hyperbolic}）。そこではエネルギーが散逸せず保存し、データの滑らかさは改善しない。
:::

## 問題 {#pde:sec-pa-rs-problems}

::: problem {#pde:prob-pa-energy-dissipation}
$L=-\Delta$, $f=0$ とし、$u(t)=T(t)g$（\ref{pde:parabolic-semigroup}。$\mu_{k}=\lambda_{k}$, $\varphi_{k}=e_{k}$）とする。
1. $g\in H_{0}^{1}$ なら、$0<T$ について
$$
\int_{0}^{T}\|u'(t)\|_{2}^{2}\,dt+\frac12\|\nabla u(T)\|_{2}^{2}=\frac12\|\nabla g\|_{2}^{2}
$$
を固有関数展開で示せ。
2. $\Omega=(0,\pi)$, $g=1$（$H_{0}^{1}$ に入らない）なら、$\int_{0}^{T}\|u'(t)\|_{2}^{2}dt=\infty$ を示せ。\ref{pde:parabolic-regularity.1} の仮定 $g\in H_{0}^{1}$ が外せないことを説明せよ。
:::

::: solution
**1.** $c_{k}\defeq(g,e_{k})$ とすると $u'(t)=-\sum\lambda_{k}e^{-\lambda_{k}t}c_{k}e_{k}$（$t>0$。\ref{pde:parabolic-semigroup} の証明の Step 3 と \ref{fa:semigroup-basic.3}）で、$\|u'(t)\|_{2}^{2}=\sum\lambda_{k}^{2}e^{-2\lambda_{k}t}c_{k}^{2}$。単調収束定理で項別に積分すると $\int_{0}^{T}\|u'\|^{2}=\sum\frac{\lambda_{k}}{2}(1-e^{-2\lambda_{k}T})c_{k}^{2}$。\ref{pde:bochner-spectral-coordinates.2} から $\|\nabla u(T)\|^{2}=\sum\lambda_{k}e^{-2\lambda_{k}T}c_{k}^{2}$、$\|\nabla g\|^{2}=\sum\lambda_{k}c_{k}^{2}$ なので等式が成り立つ。

**2.** $e_{k}=\sqrt{2/\pi}\sin kx$, $\lambda_{k}=k^{2}$ で、$c_{k}=\sqrt{2/\pi}\int_{0}^{\pi}\sin kx\,dx=\sqrt{2/\pi}\,\frac{1-(-1)^{k}}{k}$、奇数の $k$ で $c_{k}^{2}=\frac{8}{\pi k^{2}}$。1 と同じ計算で $\int_{0}^{T}\|u'\|^{2}=\sum_{k\text{ 奇数}}\frac{k^{2}}{2}(1-e^{-2k^{2}T})\frac{8}{\pi k^{2}}\ge\sum_{k\text{ 奇数}}\frac{4}{\pi}(1-e^{-2T})=\infty$。$g=1$ は境界で $0$ にならず、$\sum\lambda_{k}c_{k}^{2}=\infty$ すなわち $\|\nabla g\|=\infty$（$g\notin H_{0}^{1}$）で、1 の等式の右辺が無限大になる。解は $t>0$ では滑らかだが、$t=0$ の近くで時間微分が $L^{2}(0,T;L^{2})$ に入らないほど急に変化する（境界で $1$ から $0$ へ落ちる層が広がる）。
:::

::: problem {#pde:prob-pa-time-dependent}
$a\colon[0,T]\to[\theta_{0},\Lambda_{0}]$（$0<\theta_{0}\le\Lambda_{0}$）を可測関数とし、時間に依存する作用素 $L(t)=-a(t)\Delta$ を考える。弱解を \ref{pde:parabolic-weak-solution} の 2 の $B[u(t),v]$ を $a(t)(\nabla u(t),\nabla v)$ に替えて定める。
1. $g\in L^{2}$ について $u(t)\defeq\sum_{k}e^{-\lambda_{k}\int_{0}^{t}a}(g,e_{k})e_{k}$ が $f=0$ の弱解であることを示せ（座標が絶対連続で、a.e. で $(d^{k})'=-\lambda_{k}a(t)d^{k}$ となることを使ってよい）。
2. 弱解は一意であることを示せ。
3. $a$ が定数でなければ、$u(t+s)=T(t)u(s)$ となる $t$ だけによる作用素の族 $T(t)$ は一般にないことを、$g=e_{1}$ の例で確かめよ。
:::

::: solution
**1.** $\tau(t)\defeq\int_{0}^{t}a$ は絶対連続で a.e. で $\tau'=a$（\ref{meas:ftc-lebesgue}）、$\theta_{0}t\le\tau(t)\le\Lambda_{0}t$。座標 $d^{k}(t)=e^{-\lambda_{k}\tau(t)}(g,e_{k})$ は絶対連続で a.e. で $(d^{k})'=-\lambda_{k}a(t)d^{k}$。\ref{pde:bochner-hilbert-coordinates.2}（$V$ の基底 $e_{k}/\sqrt{1+\lambda_{k}}$）から $\|u\|_{L^{2}(0,T;V)}^{2}=\sum(1+\lambda_{k})(g,e_{k})^{2}\int_{0}^{T}e^{-2\lambda_{k}\tau}\le\sum(1+\lambda_{k})\min(T,\frac{1}{2\lambda_{k}\theta_{0}})(g,e_{k})^{2}<\infty$。$w(t)\defeq-a(t)\sum_{k}\lambda_{k}d^{k}(t)e_{k}$ は、$\|w(t)\|_{H^{-1}}^{2}=a^{2}\sum\frac{\lambda_{k}^{2}}{1+\lambda_{k}}(d^{k})^{2}\le\Lambda_{0}^{2}\|u(t)\|_{H^{1}}^{2}$（\ref{pde:bochner-spectral-coordinates.3}）から $L^{2}(0,T;V^{*})$ に入り、座標は $(d^{k})'$ なので、\ref{pde:bochner-derivative-coordinates} と \ref{fa:sobolev-one-dimension} から $w=u'$。$v\in V$ について $\langle u'(t),v\rangle+a(t)(\nabla u(t),\nabla v)=\sum_{k}(-a\lambda_{k}d^{k}+a\lambda_{k}d^{k})(v,e_{k})=0$（\ref{pde:bochner-spectral-coordinates.3} と、$(\nabla u,\nabla v)=\sum\lambda_{k}(u,e_{k})(v,e_{k})$）。$u$ の座標は連続で、\ref{pde:bochner-continuity} の証明の Step 4 と同じく $u\in C([0,T];H)$、$u(0)=g$。

**2.** 二つの弱解の差 $w$ について、\ref{pde:bochner-continuity.2} から a.e. で $\frac{d}{dt}\|w\|^{2}=2\langle w',w\rangle=-2a(t)\|\nabla w\|^{2}\le0$、$w(0)=0$ なので $w=0$（\ref{pde:parabolic-energy-estimate} の hypcheck のとおり、係数の時間依存性は効かない）。

**3.** $g=e_{1}$ なら $u(t)=e^{-\lambda_{1}\tau(t)}e_{1}$。$u(t+s)=T(t)u(s)$ が成り立てば $T(t)e_{1}=e^{-\lambda_{1}(\tau(t+s)-\tau(s))}e_{1}$ がすべての $s$ で成り立ち、$\tau(t+s)-\tau(s)=\int_{s}^{s+t}a$ が $s$ によらないことになる。もしこれがすべての $s,t$（$s+t\le T$）で $s$ によらなければ、$s=0$ と比べて $\tau(s+t)=\tau(s)+\tau(t)$。$\tau$ は連続なので、この関数方程式から $\tau(t)=\tau(1\cdot t)$ は $t$ の 1 次式 $\tau(t)=\kappa t$ になり（有理数の点で 1 次式に等しく、連続性で全体に延びる）、$a=\tau'=\kappa$ が a.e. で成り立つ。したがって $a$ が a.e. で定数でなければ、そのような $T(t)$ はない。解は二つの時刻 $s,t$ による $U(t,s)g\defeq\sum e^{-\lambda_{k}\int_{s}^{t}a}(g,e_{k})e_{k}$ で発展し、これが発展作用素の最も簡単な例である。
:::
