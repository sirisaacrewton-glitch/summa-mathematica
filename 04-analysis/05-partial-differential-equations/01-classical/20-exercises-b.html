# 演習：古典的手法（2） {#pde:page-exercises-classical-b keywords="exercises, classical methods for PDE, heat equation, wave equation, separation of variables"}

この系列の後半（熱方程式・波動方程式・変数分離）の各ページの内容を使う演習を、ページの順に並べた。前半の演習は \ref{pde:page-exercises-classical} にある。ここに集めたのは、ガウス関数の初期値と時間によらない熱源の解、熱核への漸近と誤差の評価、半直線の熱方程式の鏡像法と境界での流束、ダランベールの公式とエネルギーの計算、キルヒホッフの公式による指数関数の波、ロバン境界条件のエネルギーと符号の役割、3 次元のデュアメルの原理と遅延ポテンシャル、ノイマン条件の区間の熱方程式と和の公式、円板と正方形のディリクレ問題の級数、オイラー型のスツルム–リウヴィル作用素による変数係数の熱方程式である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#pde:sec-exclb-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。熱方程式では点を $(x,t)$ と書き（\tref{pde:page-heat-equation}）、熱核は $\Phi(x,t)=(4\pi t)^{-n/2}e^{-|x|^{2}/4t}$（\ref{pde:heat-kernel}）。波動方程式では時間を先に $(t,x)$ と書き、$J$ はいつも $0$ を含む開区間、球面平均は $M_{h}(x,r)$（\ref{pde:wave-mean-smoothness}）。$\Delta$, $\nabla$ はどちらでも空間変数だけに作用する。
- 熱核の基本の積分は \ref{pde:heat-kernel-properties.2} の $\int\Phi(x,t)\,dx=1$、すなわち $s>0$ について $\int_{\mathbb{R}^{n}}e^{-|y|^{2}/4s}\,dy=(4\pi s)^{n/2}$ である。
- 一つの問題の解答は、ほかの問題の結果を使わない（使うのは各ページの本文の結果だけである）。
- **選択公理**：変数分離の節の \ref{pde:ex-sp-3} では \ref{ode:sl-eigen} を通して従属選択公理（DC）を使う。それ以外では、引用する結果に含まれるもの（測度論の基礎の結果）のほかには使わない。
:::

## 熱方程式 {#pde:sec-he-exercises}

対応するページ：\ref{pde:page-heat-equation}、\ref{pde:page-heat-uniqueness}、\ref{pde:page-heat-regularity}

::: problem ★ 基本：ガウス関数の初期値と時間によらない熱源 {#pde:ex-he-1}
1. 初期値 $g(x)\defeq e^{-|x|^{2}}$ の有界な古典解が
$$
u(x,t)=(1+4t)^{-n/2}\exp\Bigl(-\frac{|x|^{2}}{1+4t}\Bigr)
$$
だけであることを示せ。$\sup_{x}u(x,t)$ と $\int u(x,t)\,dx$ を求めよ。
2. $f(x,t)\defeq\sin x_{1}$ とする。\ref{pde:heat-duhamel} の $u$ が $u(x,t)=(1-e^{-t})\sin x_{1}$ であることを示し、初期値 $0$、熱源 $f$ の初期値問題の有界な古典解はこれだけであることを示せ。$t\to\infty$ で $u(\cdot,t)$ は何に近づくか。
:::

::: solution
**1.** 各座標で $(x_{i}-y_{i})^{2}+4ty_{i}^{2}=(1+4t)\bigl(y_{i}-\frac{x_{i}}{1+4t}\bigr)^{2}+\frac{4tx_{i}^{2}}{1+4t}$ なので、$s\defeq\frac{t}{1+4t}$ とおくと、平行移動不変性と記法の節の積分から
$$
\begin{aligned}
\int\Phi(x-y,t)e^{-|y|^{2}}dy&=(4\pi t)^{-n/2}e^{-\frac{|x|^{2}}{1+4t}}\int e^{-\frac{|y|^{2}}{4s}}dy\\
&=\Bigl(\frac st\Bigr)^{n/2}e^{-\frac{|x|^{2}}{1+4t}}.
\end{aligned}
$$
これが主張の式。$g$ は有界連続なので \ref{pde:heat-cauchy-solution} からこれは古典解で、有界な古典解はこれだけ（\ref{pde:heat-uniqueness-rn.2}）。$\sup_{x}u=(1+4t)^{-n/2}$（$x=0$）、$\int u\,dx=(1+4t)^{-n/2}(\pi(1+4t))^{n/2}=\pi^{n/2}=\int g$。高さは $t^{-n/2}$ の速さで下がり、総量は保たれる。

**2.** $f$ と $\partial_{t}f=0$, $\partial_{i}f$, $\partial_{i}\partial_{j}f$ は連続で有界なので \ref{pde:heat-duhamel} が使える。\ref{pde:heat-kernel-properties.4} で $\xi=\mp\frac{1}{2\pi}e_{1}$ とおくと $\int\Phi(z,\tau)e^{\pm iz_{1}}dz=e^{-\tau}$ なので、
$$
\begin{aligned}
\int\Phi(x-y,\tau)\sin y_{1}\,dy&=\operatorname{Im}\Bigl(e^{ix_{1}}\int\Phi(z,\tau)e^{-iz_{1}}dz\Bigr)\\
&=e^{-\tau}\sin x_{1}\qquad(z=x-y).
\end{aligned}
$$
よって $u(x,t)=\int_{0}^{t}e^{-(t-s)}ds\,\sin x_{1}=(1-e^{-t})\sin x_{1}$。直接にも $\partial_{t}u-\Delta u=e^{-t}\sin x_{1}+(1-e^{-t})\sin x_{1}=\sin x_{1}$。$|u|\le1$ なので増大条件を満たし、\ref{pde:heat-uniqueness-rn.1} から、増大条件を満たす（とくに有界な）古典解はこれだけ。$t\to\infty$ で $u(\cdot,t)\to\sin x_{1}$（一様）で、これは定常な方程式 $-\Delta v=\sin x_{1}$ の解である。
:::

::: problem ★★ 標準：熱核への漸近 {#pde:ex-he-2}
$g\in C(\mathbb{R}^{n})$ を有界で $\int(1+|y|)|g(y)|\,dy<\infty$ を満たすものとし、$M\defeq\int g$、$m_{1}\defeq\int|y||g(y)|\,dy$、$u(x,t)\defeq\int\Phi(x-y,t)g(y)\,dy$ とおく。
1. $t>0$ について $\sup_{z}|\nabla\Phi(z,t)|=c_{n}t^{-(n+1)/2}$、$c_{n}\defeq(4\pi)^{-n/2}(2e)^{-1/2}$ を示せ。
2. $\sup_{x}|u(x,t)-M\Phi(x,t)|\le c_{n}m_{1}t^{-(n+1)/2}$ を示せ。$M\neq0$ なら、各 $K>0$ について $|x|\le K\sqrt t$ の上で一様に $\frac{u(x,t)}{M\Phi(x,t)}\to1$（$t\to\infty$）を示せ。
3. $n=1$、$g(y)=e^{-(y-1)^{2}}$ のとき $u$ を具体的に求め、$\sqrt t\,u(0,t)\to\frac12$ を直接確かめて 2 と比べよ。
:::

::: solution
**1.** $\nabla\Phi(z,t)=-\frac{z}{2t}\Phi(z,t)$ なので $|\nabla\Phi(z,t)|=(4\pi t)^{-n/2}\frac{\rho}{2t}e^{-\rho^{2}/4t}$（$\rho=|z|$）。$\rho e^{-\rho^{2}/4t}$ の導関数は $(1-\frac{\rho^{2}}{2t})e^{-\rho^{2}/4t}$ なので最大は $\rho=\sqrt{2t}$ で、値は $\sqrt{2t}\,e^{-1/2}$。よって $\sup|\nabla\Phi|=(4\pi t)^{-n/2}\frac{\sqrt{2t}e^{-1/2}}{2t}=(4\pi)^{-n/2}(2e)^{-1/2}t^{-(n+1)/2}$。

**2.** $u(x,t)-M\Phi(x,t)=\int\bigl(\Phi(x-y,t)-\Phi(x,t)\bigr)g(y)\,dy$。\tref{calc:mean-value-inequality} を線分 $[x-y,x]$ で使うと $|\Phi(x-y,t)-\Phi(x,t)|\le|y|\sup|\nabla\Phi(\cdot,t)|$ なので、1 から主張の評価。$|x|\le K\sqrt t$ なら $\Phi(x,t)\ge(4\pi t)^{-n/2}e^{-K^{2}/4}$ なので
$$
\begin{aligned}
\Bigl|\frac{u(x,t)}{M\Phi(x,t)}-1\Bigr|&\le\frac{c_{n}m_{1}t^{-(n+1)/2}}{|M|(4\pi t)^{-n/2}e^{-K^{2}/4}}\\
&=\frac{c_{n}m_{1}(4\pi)^{n/2}e^{K^{2}/4}}{|M|}\,t^{-1/2}\to0.
\end{aligned}
$$
長い時間がたつと、解は初期値の細部を忘れ、総量 $M$ の熱核に $t^{-1/2}$ の相対誤差で近づく。

**3.** $(x-y)^{2}+4t(y-1)^{2}=(1+4t)\bigl(y-\frac{x+4t}{1+4t}\bigr)^{2}+\frac{4t(x-1)^{2}}{1+4t}$ なので、1 の前と同じ計算（記法の節の積分、$s=\frac{t}{1+4t}$）で $u(x,t)=(1+4t)^{-1/2}e^{-(x-1)^{2}/(1+4t)}$。$\sqrt t\,u(0,t)=\sqrt{\frac{t}{1+4t}}\,e^{-1/(1+4t)}\to\frac12$。一方 $M=\sqrt\pi$ で $\sqrt t\,M\Phi(0,t)=\frac{\sqrt\pi}{\sqrt{4\pi}}=\frac12$ なので、2 の結論と合う。
:::

::: problem ★★★ 発展：半直線の熱方程式と境界での流束 {#pde:ex-he-3}
$n=1$ とし、有界な $g\in C([0,\infty))$ について、$x\ge0$, $t>0$ で
$$
u(x,t)\defeq\int_{0}^{\infty}\bigl(\Phi(x-y,t)-\Phi(x+y,t)\bigr)g(y)\,dy,\qquad u(x,0)\defeq g(x)
$$
とおく。
1. $g(0)=0$ なら、$u$ は $[0,\infty)\times(0,\infty)$ で $C^{\infty}$ 級、$[0,\infty)\times[0,\infty)$ で連続で、$\partial_{t}u=\partial_{x}^{2}u$、$u(0,t)=0$、$|u|\le\sup|g|$ を満たすことを示せ。
2. $T>0$ とし、有界な $v\in C^{2,1}((0,\infty)\times(0,T))\cap C([0,\infty)\times[0,T))$ が $\partial_{t}v=\partial_{x}^{2}v$、$v(0,t)=0$、$v(x,0)=g(x)$（$g(0)=0$）を満たすなら、$v=u$ であることを示せ。
3. $g\equiv1$ のとき、$u(x,t)=\operatorname{erf}\bigl(\frac{x}{2\sqrt t}\bigr)$（$\operatorname{erf}(z)\defeq\frac{2}{\sqrt\pi}\int_{0}^{z}e^{-r^{2}}dr$）を示し、$u$ が原点で連続に延びないことを確かめよ。さらに $\partial_{x}u(0,t)=\frac{1}{\sqrt{\pi t}}$ と $\int_{0}^{\infty}\bigl(1-u(x,t)\bigr)dx=2\sqrt{t/\pi}$ を示し、二つの関係を説明せよ。
:::

::: solution
**1.** $g_{\mathrm{o}}(x)\defeq g(x)$（$x\ge0$）、$-g(-x)$（$x<0$）は $g(0)=0$ から $\mathbb{R}$ で有界連続。$U\defeq\Phi(\cdot,t)*g_{\mathrm{o}}$ は \ref{pde:heat-cauchy-solution} から $\mathbb{R}\times(0,\infty)$ で $C^{\infty}$ 級の解で、$t=0$ まで連続に延びて $g_{\mathrm{o}}$ に等しく、$|U|\le\sup|g|$。積分を $y>0$ と $y<0$ に分けて $y\mapsto-y$ とすると、$\Phi$ が偶関数なので $U(x,t)=\int_{0}^{\infty}(\Phi(x-y,t)-\Phi(x+y,t))g(y)\,dy=u(x,t)$。同じ置換で $U(-x,t)=-U(x,t)$、とくに $U(0,t)=0$。$u$ は $U$ の $x\ge0$ への制限なので主張を得る。

**2.** $w\defeq v-u$ は有界で、$|w|\le A$ とする。$0<T'<T$, $R>0$ を固定し、$\psi(x,t)\defeq\frac{A(x^{2}+2t)}{R^{2}}$ とおく（$\partial_{t}\psi=\partial_{x}^{2}\psi=\frac{2A}{R^{2}}$）。$\Omega\defeq(0,R)$ の円柱で $w-\psi\in C^{2,1}(\Omega\times(0,T'))\cap C(\overline{\Omega}\times[0,T'])$ は熱方程式を満たし、放物境界では、$t=0$ で $w=0\le\psi$、$x=0$ で $w=0\le\psi$、$x=R$ で $w\le A\le\psi$。\ref{pde:heat-weak-maximum.1} から $w\le\psi$。$R\to\infty$ として $w\le0$。$-w$ にも同じ議論をして $w=0$。$T'$ は任意なので $v=u$。比較関数 $\psi$ が遠方の側面の値を抑える役をしている。

**3.** $\int_{0}^{\infty}\Phi(x-y,t)\,dy-\int_{0}^{\infty}\Phi(x+y,t)\,dy=\int_{-\infty}^{x}\Phi(w,t)\,dw-\int_{x}^{\infty}\Phi(w,t)\,dw$ で、$w=2\sqrt t\,r$ と置換し、$e^{-r^{2}}$ が偶関数であることを使うと $\frac{1}{\sqrt\pi}\bigl(\int_{-\infty}^{z}-\int_{z}^{\infty}\bigr)e^{-r^{2}}dr=\operatorname{erf}(z)$（$z=\frac{x}{2\sqrt t}$）。$u$ は有界な $g_{\mathrm{o}}=\operatorname{sgn}$ についての $\Phi*g_{\mathrm{o}}$ の制限なので、\ref{pde:heat-smoothing.1} から $C^{\infty}$ 級で熱方程式を満たし、$u(0,t)=\operatorname{erf}(0)=0$。$x_{0}>0$ なら $(x,t)\to(x_{0},0)$ で $\frac{x}{2\sqrt t}\to\infty$、$u\to1=g(x_{0})$。一方、曲線 $x=2c\sqrt t$ に沿って $t\to0$ とすると $u=\operatorname{erf}(c)$ で、極限が $c$ によるので原点で連続に延びない（境界値 $0$ と初期値 $1$ が角で食い違う）。

$\partial_{x}u(x,t)=\frac{2}{\sqrt\pi}e^{-x^{2}/4t}\frac{1}{2\sqrt t}$ なので $\partial_{x}u(0,t)=\frac{1}{\sqrt{\pi t}}$。$x=2\sqrt t\,z$ と置換し、トネリの定理で順序を替えると
$$
\begin{aligned}
\int_{0}^{\infty}(1-u)\,dx&=2\sqrt t\int_{0}^{\infty}\frac{2}{\sqrt\pi}\int_{z}^{\infty}e^{-r^{2}}dr\,dz\\
&=\frac{4\sqrt t}{\sqrt\pi}\int_{0}^{\infty}re^{-r^{2}}dr\\
&=2\sqrt{\frac t\pi}.
\end{aligned}
$$
$1-u$ は初期の温度 $1$ から失われた熱で、その総量の時間微分 $\frac{1}{\sqrt{\pi t}}$ は、端 $x=0$ を通って出ていく流束 $\partial_{x}u(0,t)$ に等しい。流束は $t\to0$ で発散するが、失われる総量は $\sqrt t$ に比例して有限である。
:::

## 波動方程式 {#pde:sec-wv-exercises}

対応するページ：\ref{pde:page-wave-equation}、\ref{pde:page-wave-kirchhoff}、\ref{pde:page-wave-energy}、\ref{pde:page-wave-general-dimension}

::: problem ★ 基本：ダランベールの公式とエネルギーの計算 {#pde:ex-wv-1}
$n=1$、$g=0$、$h(x)\defeq\frac{1}{1+x^{2}}$ とする。
1. 古典解が $u(t,x)=\frac12\bigl(\arctan(x+t)-\arctan(x-t)\bigr)$ だけであることを示せ。
2. $x$ を固定して $t\to\infty$ とした極限を求め、$\frac12\int h$ と比べよ（\ref{pde:wave-1d-domains.3} と比べよ）。
3. $E(t)\defeq\frac12\int((\partial_{t}u)^{2}+(\partial_{x}u)^{2})\,dx$ を求め、時間によらないことを確かめよ。運動エネルギー $K(t)\defeq\frac12\int(\partial_{t}u)^{2}dx$ と位置エネルギー $P(t)\defeq\frac12\int(\partial_{x}u)^{2}dx$ について $K(t)-P(t)\to0$（$t\to\infty$）を示せ。
:::

::: solution
**1.** $h\in C^{1}$ なので \tref{pde:wave-dalembert} から、古典解は $\frac12\int_{x-t}^{x+t}\frac{dy}{1+y^{2}}=\frac12(\arctan(x+t)-\arctan(x-t))$ だけ（どの $J$ の上でも）。

**2.** $t\to\infty$ で $\arctan(x\pm t)\to\pm\frac\pi2$ なので $u\to\frac\pi2=\frac12\int_{\mathbb{R}}h$。台がコンパクトな $h$ では \ref{pde:wave-1d-domains.3} により有限時間でちょうど $\frac12\int h$ になるが、ここでは $h$ の裾のため極限としてだけ現れる。

**3.** $\partial_{t}u=\frac12(h(x+t)+h(x-t))$、$\partial_{x}u=\frac12(h(x+t)-h(x-t))$ なので $(\partial_{t}u)^{2}+(\partial_{x}u)^{2}=\frac12(h(x+t)^{2}+h(x-t)^{2})$、
$$
E(t)=\frac12\int h^{2}\,dx=\frac12\int_{\mathbb{R}}\frac{dx}{(1+x^{2})^{2}}=\frac\pi4
$$
（$x=\tan\vartheta$ と置換すると $\int\cos^{2}\vartheta\,d\vartheta=\frac\pi2$）。$K-P=\frac12\int\bigl((\partial_{t}u)^{2}-(\partial_{x}u)^{2}\bigr)dx=\frac12\int h(x+t)h(x-t)\,dx$。$\max(|x+t|,|x-t|)\ge\max(|x|,t)$ で $h\le1$ なので $0\le h(x+t)h(x-t)\le\frac{1}{1+\max(x^{2},t^{2})}$。右辺は $\frac{1}{1+x^{2}}$ で抑えられ、各 $x$ で $t\to\infty$ のとき $0$ に近づくので、優収束定理から $K-P\to0$。したがって $K,P\to\frac\pi8$：二つに分かれた波が離れると、エネルギーは運動と位置に等分される。
:::

::: problem ★ 基本：キルヒホッフの公式で指数関数の波を求める {#pde:ex-wv-2}
$n=3$ とし、$h(y)\defeq e^{y_{1}}$ とする。
1. $t\neq0$ について $M_{h}(x,t)=e^{x_{1}}\frac{\sinh t}{t}$ を \ref{pde:wave-descent-mean} を使って示せ。
2. 初期値 $(0,h)$ と $(h,0)$ の古典解がそれぞれ $e^{x_{1}}\sinh t$, $e^{x_{1}}\cosh t$ だけであることを示し、直接確かめよ。$n=1$ のダランベールの公式の解と比べよ。
:::

::: solution
**1.** $h$ は $y_{3}$ によらないので、$M_{h}(x,t)$ も $x_{3}$ によらない（球面平均の定義で $x$ を $e_{3}$ 方向に平行移動しても被積分関数は同じ）。\ref{pde:wave-descent-mean.2}・\ref[3]{pde:wave-descent-mean.3} を $\mathbb{R}^{2}$ の $f(y_{1},y_{2})\defeq e^{y_{1}}$（$\bar f=h$）に使うと
$$
M_{h}(x,t)=N_{f}((x_{1},x_{2}),t)=\frac{1}{2\pi}\int_{B(0,1)}\frac{e^{x_{1}+tz_{1}}}{\sqrt{1-|z|^{2}}}\,dz.
$$
$z_{1}\in(-1,1)$ を固定すると $\int_{-\sqrt{1-z_{1}^{2}}}^{\sqrt{1-z_{1}^{2}}}\frac{dz_{2}}{\sqrt{1-z_{1}^{2}-z_{2}^{2}}}=\pi$ なので（フビニの定理）、$M_{h}(x,t)=\frac12\int_{-1}^{1}e^{x_{1}+tz_{1}}dz_{1}=e^{x_{1}}\frac{\sinh t}{t}$。

**2.** $h\in C^{\infty}$ なので \ref{pde:wave-kirchhoff.1}・\ref[2]{pde:wave-kirchhoff.2} から、初期値 $(0,h)$ の古典解は $tM_{h}=e^{x_{1}}\sinh t$ だけ、$(h,0)$ の古典解は $\partial_{t}(tM_{h})=e^{x_{1}}\cosh t$ だけ（$t=0$ では連続性で同じ式）。直接：$\partial_{t}^{2}(e^{x_{1}}\sinh t)=e^{x_{1}}\sinh t=\Delta(e^{x_{1}}\sinh t)$ で、$t=0$ の値と時間微分は $0$, $e^{x_{1}}$。$\cosh$ も同様。$n=1$ で $h=e^{x}$ のダランベールの公式は $\frac12\int_{x-t}^{x+t}e^{y}dy=e^{x}\sinh t$ で同じ形になる：1 変数だけによる初期値の解は、次元によらず 1 次元の解そのものである（一意性から）。
:::

::: problem ★★ 標準：ロバン境界条件のエネルギー {#pde:ex-wv-3}
$\Omega\subset\mathbb{R}^{n}$ を $C^{1}$ 境界をもつ有界開集合、$k\in\mathbb{R}$ とし、$u\in C^{2}(J\times\overline{\Omega})$ が $J\times\Omega$ で $\partial_{t}^{2}u=\Delta u$、$J\times\partial\Omega$ で $\partial_{\nu}u+ku=0$（**ロバン条件**。$k=0$ はノイマン条件）を満たすとする。
1. $E_{k}(t)\defeq\frac12\int_{\Omega}\bigl((\partial_{t}u)^{2}+|\nabla u|^{2}\bigr)dx+\frac k2\int_{\partial\Omega}u^{2}\,d\sigma$ が $J$ の上で定数であることを示せ。
2. $k\ge0$ なら、$J\times\Omega$ で $\partial_{t}^{2}u=\Delta u+f$、$J\times\partial\Omega$ で $\partial_{\nu}u+ku=\varphi$（$f,\varphi$ は与えられた関数）を満たし、同じ初期値をもつ $u\in C^{2}(J\times\overline{\Omega})$ は高々一つであることを示せ。
3. $n=1$、$\Omega=(0,\pi)$ では境界条件は $-\partial_{x}u(t,0)+ku(t,0)=0$, $\partial_{x}u(t,\pi)+ku(t,\pi)=0$ で、$E_{k}$ の境界の項は $\frac k2(u(t,0)^{2}+u(t,\pi)^{2})$ である。$k=-\tanh\frac\pi2$ と $u(t,x)\defeq\cosh t\cosh(x-\frac\pi2)$ について、$u$ が方程式と境界条件を満たし、$E_{k}=-\frac{\pi+\sinh\pi}{4}$ は一定だが、$\frac12\int_{0}^{\pi}((\partial_{t}u)^{2}+(\partial_{x}u)^{2})\,dx=\frac{\sinh\pi\cosh2t-\pi}{4}$ は増大することを確かめよ。
:::

::: solution
**1.** $J$ の有界閉部分区間の上では、被積分関数とその $t$ 微分は $[\,\cdot\,]\times\overline{\Omega}$、$[\,\cdot\,]\times\partial\Omega$ の上で連続で有界、$\Omega$ と $\sigma$ の測度は有限なので、積分記号下で微分できる（\ref{meas:parameter-integrals}）：
$$
\begin{aligned}
E_{k}'(t)&=\int_{\Omega}\bigl(\partial_{t}u\,\partial_{t}^{2}u+\nabla u\cdot\nabla\partial_{t}u\bigr)dx\\
&\quad+k\int_{\partial\Omega}u\,\partial_{t}u\,d\sigma.
\end{aligned}
$$
$F_{j}\defeq\partial_{t}u\,\partial_{j}u$ は $\overline{\Omega}$ の近傍で $C^{1}$ 級なので、\ref{fa:gauss-green-c1} を $j$ ごとに使って足すと $\int_{\Omega}(\nabla\partial_{t}u\cdot\nabla u+\partial_{t}u\,\Delta u)\,dx=\int_{\partial\Omega}\partial_{t}u\,\partial_{\nu}u\,d\sigma$。よって
$$
\begin{aligned}
E_{k}'(t)&=\int_{\Omega}\partial_{t}u\,(\partial_{t}^{2}u-\Delta u)\,dx\\
&\quad+\int_{\partial\Omega}\partial_{t}u\,(\partial_{\nu}u+ku)\,d\sigma\\
&=0.
\end{aligned}
$$

**2.** 二つの解の差 $w$ は斉次の方程式とロバン条件 $\partial_{\nu}w+kw=0$ を満たし、$w(0,\cdot)=\partial_{t}w(0,\cdot)=0$。1 から $E_{k}(t)=E_{k}(0)=0$。$k\ge0$ なので三つの項はどれも非負で、すべて $0$。$\partial_{t}w$, $\nabla w$ は連続なので $J\times\Omega$ で $0$。$\Omega$ の各連結成分 $\Omega_{c}$ について $J\times\Omega_{c}$ は連結な開集合で、$w$ はそこで定数、$w(0,\cdot)=0$ から $w=0$。$\overline{\Omega}$ では連続性で $w=0$。

**3.** $\partial_{t}^{2}u=u=\partial_{x}^{2}u$。$\partial_{x}u(t,\pi)=\cosh t\sinh\frac\pi2$、$ku(t,\pi)=-\tanh\frac\pi2\cosh t\cosh\frac\pi2=-\cosh t\sinh\frac\pi2$ で和は $0$、$x=0$ でも $-\partial_{x}u(t,0)=\cosh t\sinh\frac\pi2$ から同じ。$\int_{0}^{\pi}\cosh^{2}(x-\frac\pi2)dx=\frac{\pi+\sinh\pi}{2}$、$\int_{0}^{\pi}\sinh^{2}(x-\frac\pi2)dx=\frac{\sinh\pi-\pi}{2}$ なので
$$
\begin{aligned}
&\frac12\int_{0}^{\pi}\bigl(\sinh^{2}t\cosh^{2}(x-\tfrac\pi2)+\cosh^{2}t\sinh^{2}(x-\tfrac\pi2)\bigr)dx\\
&\quad=\frac{\sinh\pi\cosh2t-\pi}{4},
\end{aligned}
$$
境界の項は $\frac k2\cdot2\cosh^{2}t\cosh^{2}\frac\pi2=-\frac{\sinh\pi}{2}\cosh^{2}t=-\frac{\sinh\pi(1+\cosh2t)}{4}$。和は $-\frac{\pi+\sinh\pi}{4}$ で一定。$k<0$ では $E_{k}$ は負にもなりうる量で、一定でも解の大きさを抑えず、実際に体積のエネルギーは $e^{2t}$ の速さで増える。2 で $k\ge0$ を使ったのはこの点である（境界が「エネルギーを供給する」場合に当たる）。
:::

::: problem ★★★ 発展：3 次元のデュアメルの原理と遅延ポテンシャル {#pde:ex-wv-4}
$n=3$、$f\in C^{2}(\mathbb{R}\times\mathbb{R}^{3})$ とし、
$$
u(t,x)\defeq\int_{0}^{t}(t-s)\,M_{f(s,\cdot)}(x,t-s)\,ds
$$
とおく。
1. $u\in C^{2}(\mathbb{R}\times\mathbb{R}^{3})$ で、$\partial_{t}^{2}u-\Delta u=f$、$u(0,\cdot)=\partial_{t}u(0,\cdot)=0$ を示せ。また、$J\times\mathbb{R}^{3}$ 上の $C^{2}$ 級の $v$ で同じ方程式と初期値 $(g,h)$ を満たすものは、初期値 $(g,h)$ の斉次方程式の古典解と $u$ の和に限ることを示せ。
2. $t>0$ について
$$
u(t,x)=\frac{1}{4\pi}\int_{B(x,t)}\frac{f(t-|y-x|,y)}{|y-x|}\,dy
$$
（**遅延ポテンシャル**）を示せ。
3. $f\equiv1$ と $f(t,x)\defeq|x|^{2}$ のときの $u$ を求め、方程式を直接確かめよ。
:::

::: solution
**1.** $w(s,t,x)\defeq(t-s)M_{f(s,\cdot)}(x,t-s)=\frac{t-s}{4\pi}\int_{S^{2}}f(s,x+(t-s)\theta)\,d\sigma(\theta)$ は、$f\in C^{2}$、$S^{2}$ がコンパクトで $\sigma$ が有限なので、積分記号下の微分（\ref{meas:parameter-integrals}）により $\mathbb{R}\times\mathbb{R}\times\mathbb{R}^{3}$ で $C^{2}$ 級。$s$ を固定すると $(\tau,x)\mapsto\tau M_{f(s,\cdot)}(x,\tau)$ は初期値 $(0,f(s,\cdot))$ のキルヒホッフの解（\ref{pde:wave-kirchhoff.1}。$g=0$ なので $h=f(s,\cdot)\in C^{2}$ で足りる）なので、$\tau=t-s$ として
$$
\partial_{t}^{2}w=\Delta_{x}w,\qquad w(s,s,x)=0,\qquad\partial_{t}w(s,s,x)=f(s,x).
$$
\ref{pde:integral-upper-limit}（$w$ の変数 $(t,x)$ をパラメータとみる）と連鎖律から $u(t,x)=\int_{0}^{t}w(s,t,x)\,ds$ は $C^{1}$ 級で
$$
\begin{aligned}
\partial_{t}u=w(t,t,x)+\int_{0}^{t}\partial_{t}w\,ds&=\int_{0}^{t}\partial_{t}w\,ds,\qquad\partial_{i}u\\
&=\int_{0}^{t}\partial_{i}w\,ds.
\end{aligned}
$$
$\partial_{t}w$, $\partial_{i}w$ も $C^{1}$ 級なので同じ補題をもう一度使えて、$\partial_{t}^{2}u=\partial_{t}w(t,t,x)+\int_{0}^{t}\partial_{t}^{2}w\,ds=f(t,x)+\int_{0}^{t}\Delta_{x}w\,ds$、$\Delta u=\int_{0}^{t}\Delta_{x}w\,ds$、混合導関数も同様に連続。よって $u\in C^{2}$ で $\partial_{t}^{2}u-\Delta u=f$。$u(0,\cdot)=0$、$\partial_{t}u(0,\cdot)=0$ は積分区間が空だから。$v$ については、$v-u$ が初期値 $(g,h)$ の斉次方程式の古典解で、それは \ref{pde:wave-uniqueness-rn.1} から一つに決まる。

**2.** $r=t-s$ と置換すると $u=\frac{1}{4\pi}\int_{0}^{t}r\int_{S^{2}}f(t-r,x+r\theta)\,d\sigma\,dr$。$F(z)\defeq\frac{f(t-|z|,x+z)}{|z|}$ は $B(0,t)$ で $|z|^{-1}$ 掛ける有界関数なので可積分で、極座標の公式（\ref{meas:polar-decomposition}）から $\int_{B(0,t)}F\,dz=\int_{0}^{t}\int_{S^{2}}F(r\theta)r^{2}\,d\sigma\,dr$ は上の式の $4\pi$ 倍。$y=x+z$ と置けば主張の式。$(t,x)$ での値は、過去の時刻 $t-|y-x|$ の $f$ だけで決まる：影響は光速 $1$ で届く。

**3.** $f\equiv1$ なら $M_{f}=1$ で $u=\int_{0}^{t}(t-s)\,ds=\frac{t^{2}}{2}$、$\partial_{t}^{2}u=1$。$f=|x|^{2}$ では、$\sigma$ の $-I$ での不変性（\ref{meas:polar-radial.1}）から $\int_{S^{2}}\theta\,d\sigma=0$ なので $M_{f}(x,r)=\frac{1}{4\pi}\int(|x|^{2}+2rx\cdot\theta+r^{2})\,d\sigma=|x|^{2}+r^{2}$、
$$
u=\int_{0}^{t}(t-s)\bigl(|x|^{2}+(t-s)^{2}\bigr)ds=\frac{t^{2}|x|^{2}}{2}+\frac{t^{4}}{4}.
$$
$\partial_{t}^{2}u=|x|^{2}+3t^{2}$、$\Delta u=\frac{t^{2}}{2}\cdot6=3t^{2}$ で、差は $|x|^{2}$。
:::

## 変数分離とフーリエの方法 {#pde:sec-sp-exercises}

対応するページ：\ref{pde:page-separation}、\ref{pde:page-separation-laplace}

::: problem ★ 基本：ノイマン条件の区間の熱方程式と和の公式 {#pde:ex-sp-1}
$f(x)\defeq x$（$0\le x\le\pi$）を初期値とする \ref{pde:sep-heat-neumann} の解を $u$ とする。
1. $u(x,t)=\frac\pi2-\frac4\pi\sum_{k\text{ 奇数}}\frac{e^{-k^{2}t}\cos kx}{k^{2}}$ を示せ。
2. $\sum_{k\text{ 奇数}}\frac{1}{k^{2}}=\frac{\pi^{2}}{8}$ を導け。
3. $t\ge0$ について $\sup_{0\le x\le\pi}|u(x,t)-\frac\pi2|\le\frac\pi2e^{-t}$ を示せ。
:::

::: solution
**1.** $a_{0}(f)=\frac2\pi\int_{0}^{\pi}x\,dx=\pi$、部分積分で $a_{k}(f)=\frac2\pi\int_{0}^{\pi}x\cos kx\,dx=\frac{2((-1)^{k}-1)}{\pi k^{2}}$（$k\ge1$）。偶数の $k$ では $0$、奇数の $k$ では $-\frac{4}{\pi k^{2}}$ なので、\ref{pde:sep-heat-neumann} の式は主張のとおり。

**2.** 級数の各項の絶対値は $\frac{4}{\pi k^{2}}$ 以下なので、M 判定法（\ref{calc:uniform-limit-theorems}）から $[0,\pi]\times[0,\infty)$ で一様収束し、和 $\tilde u$ はそこで連続、$t>0$ で $u$ に等しい。$f$ は連続なので \ref{pde:sep-heat-neumann.3} から $t\to0$ で $u(\cdot,t)\to f$（一様）。よって $\tilde u(x,0)=f(x)$。$x=0$ で $0=\frac\pi2-\frac4\pi\sum_{k\text{ 奇数}}\frac{1}{k^{2}}$。

**3.** 2 の和から $|u(x,t)-\frac\pi2|\le\frac4\pi\sum_{k\text{ 奇数}}\frac{e^{-k^{2}t}}{k^{2}}\le\frac4\pi e^{-t}\cdot\frac{\pi^{2}}{8}=\frac\pi2e^{-t}$。温度は平均 $\frac\pi2$（\ref{pde:sep-heat-neumann.1} で保存される量）に、最小の正の固有値 $1$ の速さで近づく。
:::

::: problem ★ 基本：円板と正方形のディリクレ問題の級数 {#pde:ex-sp-2}
1. 単位円板 $B$ で境界値 $\gamma(\theta)\defeq\sin^{3}\theta$ のディリクレ問題の解を \ref{pde:sep-disk} の級数で求め、$x,y$ の多項式で表せ。$u(0)$ と $\max_{\overline{B}}u$ を求めよ。
2. $R=(0,1)^{2}$ で境界値 $g(x,y)\defeq x^{2}$ のディリクレ問題の解を \ref{pde:sep-rectangle-dirichlet} の手順で級数に表し、$0\le u\le1$ を示せ。中心の値を級数で書け。
:::

::: solution
**1.** $\sin3\theta=3\sin\theta-4\sin^{3}\theta$ から $\gamma=\frac34\sin\theta-\frac14\sin3\theta$。$\cos k\theta$, $\sin k\theta$ の直交性から $\beta_{1}=\frac34$, $\beta_{3}=-\frac14$、ほかの係数は $0$。\eqref{pde:eq-sep-disk-series} は有限和で
$$
u=\frac34r\sin\theta-\frac14r^{3}\sin3\theta=\frac34y-\frac14(3x^{2}y-y^{3})
$$
（$r^{3}\sin3\theta=\operatorname{Im}(x+iy)^{3}$）。直接 $\Delta u=-\frac14(6y-6y)=0$。$u(0)=0$ は $\gamma$ の平均 $0$ に等しい。\tref{pde:weak-maximum-principle} から最大値は境界でとられ、$\max\gamma=1$（$\theta=\frac\pi2$）なので $\max_{\overline{B}}u=1$。

**2.** 角の値は $g(0,0)=g(0,1)=0$, $g(1,0)=g(1,1)=1$ なので、双一次補間は $P(x,y)=x(1-y)+xy=x$。$g-P$ は下辺と上辺で $x^{2}-x$、左辺で $0$、右辺で $1-1=0$。$\ell=m=1$, $\mu_{k}=k\pi$ で
$$
\beta_{k}(x^{2}-x)=2\int_{0}^{1}(x^{2}-x)\sin k\pi x\,dx=\frac{4((-1)^{k}-1)}{\pi^{3}k^{3}},
$$
奇数の $k$ で $-\frac{8}{\pi^{3}k^{3}}$。下辺の問題の解 $v$（\ref{pde:sep-rectangle-side}）と、上辺の問題の解 $v(x,1-y)$（調和性は鏡映で保たれる）を足して
$$
u(x,y)=x-\sum_{k\text{ 奇数}}\frac{8}{\pi^{3}k^{3}}\,\frac{\sinh k\pi(1-y)+\sinh k\pi y}{\sinh k\pi}\,\sin k\pi x.
$$
境界値は $[0,1]$ に入るので、\tref{pde:weak-maximum-principle} から $0\le u\le1$。中心では $\frac{\sinh(k\pi/2)}{\sinh k\pi}=\frac{1}{2\cosh(k\pi/2)}$ と $\sin\frac{k\pi}{2}=(-1)^{(k-1)/2}$ から
$$
u(\tfrac12,\tfrac12)=\frac12-\sum_{k\text{ 奇数}}\frac{8(-1)^{(k-1)/2}}{\pi^{3}k^{3}\cosh(k\pi/2)}\approx0.3973.
$$
第 1 項だけで $\frac12-\frac{8}{\pi^{3}\cosh(\pi/2)}\approx0.397$ で、級数の収束はきわめて速い。
:::

::: problem ★★ 標準：オイラー型のスツルム–リウヴィル作用素と変数係数の熱方程式 {#pde:ex-sp-3}
$[a,b]=[1,e]$、$p(x)=x^{2}$, $q=0$, $w=1$ とし、ディリクレ条件 $u(1)=u(e)=0$ を考える（\ref{ode:sturm-liouville-operator}）。
1. 固有値が $\lambda_{k}=k^{2}\pi^{2}+\frac14$（$k\ge1$）だけで、正規化された固有関数が $e_{k}(x)=\sqrt2\,x^{-1/2}\sin(k\pi\log x)$ であることを示せ。
2. $f(x)\defeq x^{-1/2}\bigl(\sin(\pi\log x)+\sin(2\pi\log x)\bigr)$ を初期値とする $\partial_{t}u=\partial_{x}(x^{2}\partial_{x}u)$, $u(1,t)=u(e,t)=0$ の解を求め、\ref{pde:sep-sl-heat.4} の意味でただ一つであることを示せ。
3. $f\in L^{2}(1,e)$ に対する \ref{pde:sep-sl-heat} の解について $\|u(\cdot,t)\|_{2}\le e^{-(\pi^{2}+1/4)t}\|f\|_{2}$ を示せ。$v(s,t)\defeq e^{s/2}u(e^{s},t)$ が $\partial_{t}v=\partial_{s}^{2}v-\frac14v$ を満たすことを確かめ、$\frac14$ の由来を説明せよ。
:::

::: solution
**1.** 固有値は実数（\ref{ode:sl-eigen.1}）。$\lambda\in\mathbb{R}$ について $-(x^{2}u')'=\lambda u$ を考える。$x=e^{s}$、$u(x)=e^{-s/2}z(s)$（$s\in[0,1]$）とおく。$x\frac{d}{dx}=\frac{d}{ds}$ なので $xu'=e^{-s/2}(z'-\frac z2)$、$\frac{d}{ds}(xu')=e^{-s/2}(z''-z'+\frac z4)$ で、
$$
(x^{2}u')'=\frac{d}{dx}\bigl(x\cdot xu'\bigr)=xu'+\frac{d}{ds}(xu')=e^{-s/2}\Bigl(z''-\frac14z\Bigr).
$$
よって方程式は $z''+(\lambda-\frac14)z=0$、$z(0)=z(1)=0$ と同値。$\mu\defeq\lambda-\frac14$ が $\mu\le0$ なら解は $A+Bs$ か $Ae^{\sqrt{-\mu}s}+Be^{-\sqrt{-\mu}s}$ で、境界条件から $z=0$。$\mu>0$ なら $z=B\sin\sqrt\mu s$ で、$\sin\sqrt\mu=0$ から $\sqrt\mu=k\pi$。よって固有値は $k^{2}\pi^{2}+\frac14$、固有関数は $x^{-1/2}\sin(k\pi\log x)$ の定数倍。$\int_{1}^{e}x^{-1}\sin^{2}(k\pi\log x)\,dx=\int_{0}^{1}\sin^{2}k\pi s\,ds=\frac12$ なので $e_{k}$ のノルムは $1$。

**2.** $f=\frac{1}{\sqrt2}(e_{1}+e_{2})$ は $C^{2}[1,e]$ に入り端で $0$ なので $f\in D$。正規直交性から $c_{1}=c_{2}=\frac{1}{\sqrt2}$、ほかは $0$ で、\ref{pde:sep-sl-heat} の解は
$$
u(x,t)=x^{-1/2}\Bigl(e^{-(\pi^{2}+1/4)t}\sin(\pi\log x)+e^{-(4\pi^{2}+1/4)t}\sin(2\pi\log x)\Bigr).
$$
各項が $e_{k}$ の方程式から $\partial_{t}u=\partial_{x}(x^{2}\partial_{x}u)$ を満たすことも直接確かめられる。$f\in D$ なので \ref{pde:sep-sl-heat.4} から解はこれだけ。

**3.** $(e_{k})$ は $L^{2}(1,e)$ の正規直交基底（\ref{ode:sl-eigen.2}）。$t>0$ で $u(\cdot,t)=\sum c_{k}e^{-\lambda_{k}t}e_{k}$ は一様収束するので $L^{2}$ でも収束し、$u(\cdot,t)$ の展開係数は $c_{k}e^{-\lambda_{k}t}$。パーセヴァルの等式から $\|u(\cdot,t)\|_{2}^{2}=\sum c_{k}^{2}e^{-2\lambda_{k}t}\le e^{-2\lambda_{1}t}\sum c_{k}^{2}=e^{-2\lambda_{1}t}\|f\|_{2}^{2}$。1 の計算で $z$ を $v(\cdot,t)$ に置き換えると $\partial_{x}(x^{2}\partial_{x}u)=e^{-s/2}(\partial_{s}^{2}v-\frac14v)$、$\partial_{t}u=e^{-s/2}\partial_{t}v$ なので $\partial_{t}v=\partial_{s}^{2}v-\frac14v$。変数 $s=\log x$ では区間 $[0,1]$ の定数係数の熱方程式に一様な吸収 $-\frac14v$ が加わったもので、固有値 $k^{2}\pi^{2}$ がちょうど $\frac14$ だけずれる。
:::
