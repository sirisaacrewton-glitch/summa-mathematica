# 古典的手法（Classical Methods）

特性曲線法、調和関数と最大値原理、基本解とグリーン関数、ペロンの方法、熱方程式と波動方程式の解の公式、変数分離とフーリエの方法。具体的な解を作り、そのために必要な前提を見る。

<p class="mn-msc">MSC2020: 35F10, 35J05, 35J08, 35K05, 35L05</p>

## 前提知識

- [常微分方程式 › 常微分方程式の基礎](../../../04-analysis/04-ordinary-differential-equations/01-basics/index.html)（全体、7 ページ）：常微分方程式の解の存在と一意性（特性曲線法）
- [実解析 › ベクトル解析](../../../04-analysis/01-real-analysis/04-vector-analysis/index.html)（全体、4 ページ）：ガウスの発散定理・グリーンの公式
- [測度とルベーグ積分 › ルベーグ積分](../../../04-analysis/03-measure-theory/02-integration/index.html)（全体、9 ページ）：ルベーグ積分・積分記号下の微分
- [フーリエ解析 › フーリエ変換](../../../04-analysis/06-harmonic-analysis/02-fourier-transform/index.html)（全体、5 ページ）：フーリエ変換とガウス関数（熱方程式）
- [フーリエ解析 › フーリエ級数](../../../04-analysis/06-harmonic-analysis/01-fourier-series/index.html)（全体、5 ページ）：フーリエ級数（変数分離）
- [関数解析 › 超関数とソボレフ空間](../../../04-analysis/07-functional-analysis/03-distributions-sobolev/index.html)（全体、7 ページ）：軟化子（平均値の性質の逆）
- [複素解析 › 基本事項](../../../04-analysis/02-complex-analysis/01-basics/index.html)（全体、6 ページ）：コーシーの評価（ティホノフの例）
- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：切り落とし関数（隆起関数）
