# 外部錐条件と解けないディリクレ問題 {#pde:page-perron-irregular keywords="exterior cone condition and explicit barrier |x - xi|^alpha f(cos angle), Laplacian of homogeneous functions r^alpha f(t), convex domains, Dirichlet problem on a punctured ball has no solution, isolated boundary points are irregular, Lebesgue spine (Lebesgue thorn) in R^3, irregular boundary point, classical versus weak solutions, boundary geometry decides solvability, 外部錐条件, ルベーグの棘, 正則でない境界点, 穴あき球"}

前のページ \ref{pde:page-perron} では、有界領域のディリクレ問題が連続な境界値すべてについて解けることと、境界のすべての点に障壁があることが同値であることを示し、外部球条件をみたす点には障壁があることを見た。このページでは、まず外部球条件を**外部錐条件**に弱め、錐の外で正の値をとる優調和関数 $|x-\xi|^{\alpha}f(\cos\angle)$ を具体的に作って障壁を得る。帰結として、凸領域や $C^{1}$ 境界をもつ領域でもディリクレ問題はいつも解ける。次に、障壁がない（正則でない）境界点の例を二つ調べる：穴あき球の中心（孤立した境界点）と、$\mathbb{R}^{3}$ の**ルベーグの棘**の先端である。どちらでも、滑らかな境界値を与えてもディリクレ問題の古典解は存在しない。最後に、境界の幾何が可解性を決めるという古典的手法の特徴を、関数解析的手法（弱解）と対比する。

## 記法と定義の確認 {#pde:sec-pr-cone-notation}

::: notation
- 前のページの記法をそのまま使う：$n\ge2$、劣調和・優調和（\ref{pde:subharmonic}）、その特徴づけ（\ref{pde:subharmonic-equivalent}）、比較原理（\ref{pde:subharmonic-comparison}）、ペロン族とペロン関数 $u_{g}$（\ref{pde:perron-family}・\ref{pde:perron-family-properties}）、その調和性（\ref{pde:perron-harmonic}）、障壁と正則な境界点（\ref{pde:barrier}）、\ref{pde:barrier-regular}、\ref{pde:perron-dirichlet-solvable}、局所的な障壁（\ref{pde:barrier-local}）、外部球条件（\ref{pde:barrier-exterior-sphere}）。
- $C^{2}$ 関数 $u$ で $\Delta u\le0$ なら優調和である（\ref{pde:subharmonic-equivalent} の後の例 2）。動径関数のラプラシアン $\Delta(|x|^{a})=a(a+n-2)|x|^{a-2}$（\ref{pde:harmonic-function} の後の例 3 の公式 $\Delta g(|x|)=g''+\frac{n-1}{r}g'$ から）。
- 基本解 $\Phi$（\ref{pde:gf-fundamental-solution}）と除去可能な特異点（\ref{pde:gf-removable-singularity}）。
- **選択公理**：ペロン関数の調和性を使う所（\ref{pde:perron-harmonic}）で可算選択公理を使う。それ以外では使わない（測度論の基礎の結果に含まれるものを除く）。
:::

## 外部錐条件 {#pde:sec-pr-cone}

::: definition 外部錐条件 {#pde:exterior-cone-condition keywords="exterior cone condition at a boundary point: a closed truncated circular cone with vertex xi, axis e, half-angle beta and height rho disjoint from Omega" index="外部錐条件|がいぶすいじょうけん, 錐（頂点・軸・半頂角）|すいちょうてんじくはんちょうかく"}
$\xi\in\partial\Omega$、単位ベクトル $e$、$0<\beta<\pi/2$、$\rho>0$ について
$$
C(\xi,e,\beta,\rho)\defeq\{\xi+y:|y|\le\rho,\ y\cdot e\ge|y|\cos\beta\}
$$
を、頂点 $\xi$、軸 $e$、半頂角 $\beta$、高さ $\rho$ の（切り取った）**錐**という。ある $e,\beta,\rho$ について $C(\xi,e,\beta,\rho)\cap\Omega=\varnothing$ となるとき、$\xi$ で $\Omega$ は**外部錐条件**をみたすという。
:::

::: intuition
境界の点から、領域の外へ向けて、とがった円錐（アイスクリームのコーン）を少しだけ差し込めること。外部球条件より弱く、角のある境界でも成り立つ。
:::

::: example
1. 外部球条件をみたす点は外部錐条件をみたす：$B(y_{0},R)\cap\Omega=\varnothing$, $|\xi-y_{0}|=R$ のとき、$e\defeq(y_{0}-\xi)/R$、$\beta\defeq\pi/4$、$\rho\defeq R$ とすると、$y\ne0$ で $y\cdot e\ge|y|\cos\beta$, $|y|\le R$ なら $|\xi+y-y_{0}|^{2}=R^{2}-2Ry\cdot e+|y|^{2}\le R^{2}-\sqrt2R|y|+|y|^{2}<R^{2}$ なので $\xi+y\in B(y_{0},R)$。$y=0$ は $\xi\notin\Omega$。
2. $n=2$、$\Omega\defeq\{x\in B(0,1):x_{2}>-|x_{1}|\}$ の原点は、外部錐（$e=(0,-1)$、$\beta=\pi/4$）をもつが、外部球条件はみたさない：原点を通り $\Omega$ と交わらない円板は、補集合の角 $\{x_{2}\le-|x_{1}|\}$ に含まれなければならないが、円周は原点の近くで滑らかな曲線なので、直角の角の中に収まらない。
3. 円板から線分を除いた $B(0,1)\setminus\{(x_{1},0):0\le x_{1}<1\}$ の原点は、外部錐条件をみたさない（線分は正の角をもつ錐を含まない）。それでも原点は正則である（\ref{pde:prob-pr-slit}）。
:::

障壁は、頂点を中心とする極座標で $|x-\xi|^{\alpha}f(t)$（$t$ は軸とのなす角の余弦）の形に作る。まずそのラプラシアンを計算する。

::: lemma 同次関数のラプラシアン {#pde:barrier-homogeneous-laplacian keywords="Laplacian of r^alpha f(t) with r = |x| and t = x.e/|x|: r^{alpha-2} [alpha(alpha+n-2) f + (1-t^2) f'' - (n-1) t f']" index="同次関数のラプラシアン|どうじかんすうのらぷらしあん"}
$e$ を単位ベクトル、$I\subset\mathbb{R}$ を開区間、$f\in C^{2}(I)$、$\alpha\in\mathbb{R}$ とし、開集合 $G\defeq\{x\ne0:t(x)\in I\}$（$r\defeq|x|$, $t(x)\defeq x\cdot e/r$）の上で $w\defeq r^{\alpha}f(t)$ とおく。このとき $w\in C^{2}(G)$ で
$$
\Delta w=r^{\alpha-2}\Bigl[\alpha(\alpha+n-2)f(t)+(1-t^{2})f''(t)-(n-1)tf'(t)\Bigr].
$$
:::

::: proof
**Step 1（$r$ と $t$ の微分）.** 【主張：$\nabla r=x/r$, $\nabla t=(e-tx/r)/r$, $|\nabla t|^{2}=(1-t^{2})/r^{2}$, $\nabla r\cdot\nabla t=0$, $\Delta t=-(n-1)t/r^{2}$】$\nabla(x\cdot e)=e$ と $\nabla(1/r)=-x/r^{3}$ から $\nabla t=e/r-(x\cdot e)x/r^{3}$。$|\nabla t|^{2}=\frac{1}{r^{2}}(1-2t^{2}+t^{2})$、$\frac{x}{r}\cdot\nabla t=\frac{1}{r}(t-t)=0$。$\Delta(1/r)=-(n-3)r^{-3}$（記法の確認の公式、$a=-1$）と $\Delta(x\cdot e)=0$ から $\Delta t=(x\cdot e)\Delta(1/r)+2e\cdot\nabla(1/r)=-(n-3)\frac{x\cdot e}{r^{3}}-2\frac{x\cdot e}{r^{3}}=-(n-1)\frac{t}{r^{2}}$。

**Step 2（積の微分）.** 【主張：主張の式が成り立つ】$r$, $t$ は $x\ne0$ で $C^{\infty}$ 級なので $w\in C^{2}(G)$。$\Delta(ab)=a\Delta b+2\nabla a\cdot\nabla b+b\Delta a$ と、連鎖律 $\Delta f(t)=f''(t)|\nabla t|^{2}+f'(t)\Delta t$、$\nabla f(t)=f'(t)\nabla t$ から
$$
\Delta w=f\,\Delta r^{\alpha}+2\alpha r^{\alpha-1}f'\,\nabla r\cdot\nabla t+r^{\alpha}\bigl(f''|\nabla t|^{2}+f'\Delta t\bigr).
$$
$\Delta r^{\alpha}=\alpha(\alpha+n-2)r^{\alpha-2}$ と Step 1 を代入する。
:::

::: theorem 外部錐条件と障壁 {#pde:barrier-exterior-cone keywords="exterior cone condition implies regularity: explicit barrier w = |x - xi|^alpha f(t) with f = 2(1-c)^{2-n} - (1-t)^{2-n} (n >= 3) or 1 - log(1-c) + log(1-t) (n = 2) and small alpha" index="外部錐条件と正則性|がいぶすいじょうけんとせいそくせい"}
$\Omega$ を有界な開集合とし、$\xi\in\partial\Omega$ で外部錐条件（$C(\xi,e,\beta,\rho)\cap\Omega=\varnothing$）が成り立つとする。$c\defeq\cos\beta\in(0,1)$ とし、$t<1$ について
$$
f(t)\defeq\begin{cases}1-\log(1-c)+\log(1-t) & (n=2),\\ 2(1-c)^{2-n}-(1-t)^{2-n} & (n\ge3),\end{cases}
$$
$F\defeq\max_{[-1,c]}f$、$\kappa\defeq\frac12$（$n=2$）、$\kappa\defeq(n-1)(n-2)2^{1-n}$（$n\ge3$）、$\alpha\defeq\min\{1,\kappa/((n-1)F)\}$ とおく。このとき
$$
w(x)\defeq|x-\xi|^{\alpha}f\bigl(t(x)\bigr),\qquad t(x)\defeq\frac{(x-\xi)\cdot e}{|x-\xi|},
$$
は $\Omega\cap B(\xi,\rho)$ の上の局所的な障壁（\ref{pde:barrier-local} の条件をみたす関数）で、$\xi$ は正則である。
:::

::: intuition
境界の点から外へとがった錐を差し込めれば、その点を頂点とし、錐から離れる向きに少しずつ大きくなる優調和関数が作れる。それが障壁になるので、その点では境界値がきちんと伝わる。
:::

::: proof
**Step 1（領域は錐の外の角にある）.** 【主張：$x\in\Omega_{\rho}\defeq\Omega\cap B(\xi,\rho)$ なら $x\ne\xi$ かつ $t(x)<c$】$\xi\notin\Omega$ なので $y\defeq x-\xi\ne0$、$|y|<\rho$。$y\cdot e\ge|y|c$ なら $x\in C(\xi,e,\beta,\rho)$ となり $C\cap\Omega=\varnothing$ に反するので、$y\cdot e<|y|c$。

**Step 2（$f$ の性質）.** 【主張：$f$ は $(-\infty,1)$ で $C^{\infty}$ 級、$[-1,c]$ の上で $f\ge m_{f}>0$（$n=2$ では $m_{f}=1$、$n\ge3$ では $m_{f}=(1-c)^{2-n}$）かつ $Lf\defeq(1-t^{2})f''-(n-1)tf'\le-\kappa$】$n=2$：$f'=-\frac{1}{1-t}$, $f''=-\frac{1}{(1-t)^{2}}$ から $Lf=-\frac{1+t}{1-t}+\frac{t}{1-t}=-\frac{1}{1-t}\le-\frac12$（$1-t\le2$）。$\log(1-t)$ は減少なので $[-1,c]$ での最小値は $f(c)=1$。$n\ge3$：$f'=-(n-2)(1-t)^{1-n}$, $f''=-(n-2)(n-1)(1-t)^{-n}$ から
$$
\begin{aligned}Lf&=-(n-2)(1-t)^{1-n}\bigl[(n-1)(1+t)-(n-1)t\bigr]\\&=-(n-1)(n-2)(1-t)^{1-n}\le-\kappa.\end{aligned}
$$
$(1-t)^{2-n}$ は $t$ について増加なので、$[-1,c]$ で $f\ge f(c)=(1-c)^{2-n}$。

**Step 3（優調和性）.** 【主張：$w\in C^{2}(\Omega_{\rho})$ で $\Delta w\le0$】$\xi$ を原点に平行移動し、\ref{pde:barrier-homogeneous-laplacian} を $I\defeq(-\infty,1)$ で使う。Step 1 から $\Omega_{\rho}$ は $G$ に含まれ、そこで $t\in[-1,c)$。$0<\alpha\le1$ から $\alpha(\alpha+n-2)\le\alpha(n-1)\le\kappa/F$ なので、Step 2 と $0<f\le F$ から
$$
\Delta w=|x-\xi|^{\alpha-2}\bigl[\alpha(\alpha+n-2)f+Lf\bigr]\le|x-\xi|^{\alpha-2}\bigl[\kappa-\kappa\bigr]=0.
$$
よって $w$ は $\Omega_{\rho}$ で優調和（記法の確認）。

**Step 4（局所的な障壁の条件）.** 【主張：$w>0$、$w(x)\to0$（$x\to\xi$）、$0<\delta<\rho$ について $\inf\{w(x):x\in\Omega_{\rho},|x-\xi|\ge\delta\}\ge\delta^{\alpha}m_{f}>0$】Step 1・2 から $\Omega_{\rho}$ の上で $m_{f}|x-\xi|^{\alpha}\le w(x)\le F|x-\xi|^{\alpha}$。$\alpha>0$ なので主張が従う。

\ref{pde:barrier-local} から $\xi$ は正則である。

::: hypcheck
- **外部錐条件**：Step 1 で、$\Omega$ の $\xi$ の近くの点が $t\le c<1$ の範囲にあることに使った。これで $f$ が正で有界な範囲にとどまる（$t\to1$、つまり錐の軸の方向では $n\ge3$ の $f$ は $-\infty$ に発散する）。
- **錐の角が正であること（$c<1$）**：Step 2 の $m_{f}>0$ と $F<\infty$ に、したがって Step 3 の $\alpha>0$ に使った。角が 0 の「棘」では $\alpha$ がとれず、実際に正則でないことがある（ルベーグの棘）。
- **$\alpha$ を小さくとること**：Step 3 で、動径方向の項 $\alpha(\alpha+n-2)f$（正）を、角度方向の項 $Lf$（負）で打ち消すのに使った。$\alpha>0$ は Step 4 の $w\to0$ に必要。
- **錐の高さ $\rho$**：\ref{pde:barrier-local} によって局所的な条件で足りる。
- **公理**：障壁の構成は選択公理を使わない。
:::
:::

::: corollary 凸領域のディリクレ問題 {#pde:perron-convex keywords="bounded convex open sets satisfy the exterior cone condition at every boundary point; the Dirichlet problem is solvable for every continuous boundary function" index="凸領域のディリクレ問題|とつりょういきのでぃりくれもんだい"}
$\Omega$ を空でない有界な凸開集合とする。$\partial\Omega$ の各点で外部錐条件が成り立ち、すべての $g\in C(\partial\Omega)$ についてディリクレ問題は古典解をただ一つもつ。
:::

::: proof
$\xi\in\partial\Omega$ とする。$a\in\Omega$ と、$B(a,\varepsilon)\subset\Omega$ となる $\varepsilon>0$ をとる。$\xi\notin\Omega$ なので $d\defeq|\xi-a|\ge\varepsilon>0$。$e\defeq(\xi-a)/d$、$\beta\defeq\arcsin\frac{\varepsilon}{2d}\in(0,\frac\pi6]$ とする。

**Step 1（錐の点を内部の球へ結ぶ）.** 【主張：$y\ne0$, $y\cdot e\ge|y|\cos\beta$ なら、$s>0$ と $b\in B(a,\varepsilon)$ で $y=s(\xi-b)$ となるものがある】$\cos\varphi\defeq y\cdot e/|y|\ge\cos\beta>0$ とし、$s\defeq|y|/(d\cos\varphi)$、$b\defeq\xi-y/s$ とおく。$|y/s|=d\cos\varphi$, $(y/s)\cdot e=d\cos^{2}\varphi$ なので
$$
|b-a|^{2}=|de-y/s|^{2}=d^{2}-2d^{2}\cos^{2}\varphi+d^{2}\cos^{2}\varphi=d^{2}\sin^{2}\varphi\le d^{2}\sin^{2}\beta=\frac{\varepsilon^{2}}{4}.
$$

**Step 2（凸性）.** 【主張：任意の $\rho>0$ で $C(\xi,e,\beta,\rho)\cap\Omega=\varnothing$】$\xi\notin\Omega$。$y\ne0$ を Step 1 のとおりとし、$x\defeq\xi+y\in\Omega$ と仮定する。$x=\xi+s(\xi-b)$ から $\xi=\frac{1}{1+s}x+\frac{s}{1+s}b$ は $\Omega$ の 2 点 $x,b$ の凸結合なので $\xi\in\Omega$ となり矛盾。

\ref{pde:barrier-exterior-cone} から各境界点は正則で、\ref{pde:perron-dirichlet-solvable} から主張が従う。
:::

::: supplement
**前提を変えると.** 外部錐条件の証明で使ったのは、$\xi$ の近くで $\Omega$ が「軸のまわりの正の角」から外れていることだけである。同じ議論で、$C^{1}$ 境界（\ref{pde:prob-pr-c1-cone}）や、リプシッツ境界（境界が局所的にリプシッツ関数のグラフ）をもつ有界領域でも、すべての境界点で外部錐条件が成り立ち、ディリクレ問題が解ける。錐の代わりに、角が 0 に縮んでいく「棘」になると、障壁が作れないことがある（次の節）。$n=2$ では事情がずっとよく、$\xi$ を含む $\mathbb{R}^{2}\setminus\Omega$ の連結成分が 1 点でなければ $\xi$ は正則であることが知られている（ここでは証明しない）。線分を除いた円板（\ref{pde:prob-pr-slit}）はその例である。

**似た定理.** 正則性の正確な判定法は、ウィーナーの判定法として知られている：$\xi$ が正則であることは、$\xi$ のまわりの球殻 $\{2^{-k-1}\le|x-\xi|\le2^{-k}\}$ の中の補集合 $\mathbb{R}^{n}\setminus\Omega$ の部分の**容量**を $2^{-k(n-2)}$（$n=2$ では対数の尺度）で正規化した量の和が発散することと同値である（ここでは証明しない）。外部錐条件は、各球殻で補集合がその殻と同じ大きさの容量をもつので、和の各項が下から押さえられる場合に当たる。

**高い視点：錐の中の調和関数.** 障壁 $|x-\xi|^{\alpha}f$ は、錐の外の領域で「頂点に向かって $\alpha$ 次の速さで 0 になる」優調和関数である。錐の外側の領域の真の調和関数（境界で 0）は $r^{\alpha_{*}}\varphi(\theta)$ の形で、$\alpha_{*}$ は球面上の領域のラプラシアンの第一固有値で決まる。錐を細くすると $\alpha_{*}\to0$ になり、頂点で 0 に近づく速さが限りなく遅くなる。ここでは固有関数を求める代わりに、具体的な $f$ で $\alpha$ を小さく妥協した。比喩で言えば、外へとがった錐は「熱が逃げていく排水口」で、口が狭いほど排水は遅くなるが、口がある限り水はいずれ吸い込まれる。
:::

## 解けない例 {#pde:sec-pr-irregular}

::: counterexample 穴あき球のディリクレ問題 {#pde:perron-punctured-ball keywords="Dirichlet problem on the punctured ball B(0,1) minus the origin with g = 0 on the sphere and g(0) = 1 has no classical solution; the Perron function is identically 0; the origin is an irregular boundary point" index="穴あき球のディリクレ問題|あなあききゅうのでぃりくれもんだい, 正則でない境界点|せいそくでないきょうかいてん"}
$\Omega\defeq B(0,1)\setminus\{0\}\subset\mathbb{R}^{n}$ とすると $\partial\Omega=\partial B(0,1)\cup\{0\}$。$g\defeq0$（$|x|=1$）、$g(0)\defeq1$ とおくと、$g\in C(\partial\Omega)$ で、
1. 対応するディリクレ問題の古典解は存在しない。
2. ペロン関数は $u_{g}\equiv0$ で、$0$ は正則でない境界点である。
:::

::: proof
**1.** $h\in C(\overline{\Omega})$ が $\Omega$ で調和で、$\partial\Omega$ の上で $h=g$ だとする。$h$ は $0$ の近くで有界なので、\ref{pde:gf-removable-singularity} から $B(0,1)$ の調和関数 $\tilde h$ で $\Omega$ の上で $\tilde h=h$ となるものがある。$\tilde h$ は $0$ で連続なので $\tilde h(0)=\lim_{x\to0}h(x)=h(0)=1$。$\tilde h$ は $\overline{B}(0,1)$ で連続（球面では $h$ と一致）で、球面上で $0$ なので、\ref{pde:weak-maximum-principle} から $\tilde h\equiv0$。$\tilde h(0)=1$ に反する。

**2.** 定数 $0$ は $\mathcal{S}_{g}$ に入る（上極限は $0\le g$）ので $u_{g}\ge0$。$v\in\mathcal{S}_{g}$ と $\varepsilon>0$ をとり、$b\defeq\varepsilon(\Phi-\Psi(1))$ とおく。$b$ は $\Omega$ で調和（\ref{pde:gf-fundamental-properties.1}）、$|x|=1$ で $0$、$x\to0$ で $+\infty$。$v\le\sup g=1$（\ref{pde:perron-family-properties.1}）なので、$\limsup_{x\to0}(v-b)=-\infty$、$|\eta|=1$ では $\limsup(v-b)\le g(\eta)-0=0$。\ref{pde:subharmonic-comparison.1} から $\Omega$ の上で $v\le b$。$x$ を固定して $\varepsilon\to0$ とすると $v(x)\le0$。よって $u_{g}\equiv0$ で、$u_{g}(x)\to0\ne g(0)$（$x\to0$）なので、\ref{pde:barrier-regular} から $0$ は正則でない。

::: hypcheck
- **除去可能な特異点**：1 で、境界の 1 点 $0$ での値が調和関数に「見えない」ことに使った。2 では同じことを、基本解 $\Phi$ を比較関数にして直接示した（$\Phi$ が $0$ で $+\infty$ になるので、$0$ での上極限の条件は $v$ が有界なら自動的にみたされる）。
- **$n\ge2$**：$\Phi$ が $0$ で $+\infty$ に発散することに使った。$n=1$ では $(-1,0)\cup(0,1)$ の上の 1 次関数を区間ごとに選べるので、ディリクレ問題は解ける（$0$ は二つの区間の端点として正則）。
- **公理**：1 は選択公理を使わない。2 はペロン関数の性質を通して可算選択公理を使う（$u_{g}\equiv0$ の計算自体は使わない）。
:::
:::

同じ考え方で、有界な開集合の**孤立した境界点**（その点の近くに他の境界点がないもの）は、$n\ge2$ では正則でないことが示せる（比較を孤立点のまわりの小さな穴あき球の上で行う。ここでは細部を略し、穴あき球の場合だけを示した）。

次の例は、境界が「つながっている」のに正則でない点をもつ、より劇的なものである。$\mathbb{R}^{3}$ で、原点に向かって指数関数的に細くなる棘を球から取り除く。

::: counterexample ルベーグの棘 {#pde:lebesgue-spine keywords="Lebesgue spine (Lebesgue thorn) in R^3: the ball B(0,1/2) minus the thin spine {x_1 > 0, x_2^2 + x_3^2 <= exp(-2c/x_1)}; the potential of the line charge s ds on [0,1] e_1 is discontinuous at the tip; the tip is an irregular boundary point" index="ルベーグの棘|るべーぐのとげ, ルベーグのスパイン|るべーぐのすぱいん"}
$n=3$、$c>0$ とし、$\varrho(x)\defeq\sqrt{x_{2}^{2}+x_{3}^{2}}$,
$$
T\defeq\{x:x_{1}>0,\ \varrho(x)\le e^{-c/x_{1}}\}\cup\{0\},\qquad\Omega\defeq B(0,\tfrac12)\setminus T
$$
とおく（$T$ を**ルベーグの棘**という）。このとき $\Omega$ は有界な開集合で、ある $g\in C(\partial\Omega)$ について対応するディリクレ問題は古典解をもたず、原点は正則でない境界点である。
:::

::: proof
$\Sigma\defeq\{se_{1}:0\le s\le1\}$ とし、$\mathbb{R}^{3}\setminus\Sigma$ の上で
$$
u(x)\defeq\int_{0}^{1}\frac{s\,ds}{|x-se_{1}|}
$$
とおく（線分の上に密度 $s$ で電荷を置いたときのポテンシャル）。

**Step 1（$\Omega$ と境界）.** 【主張：$T$ は閉集合で、$\Sigma\cap\overline{\Omega}=\{0\}$、$|\eta|<\frac12$ の境界点 $\eta\ne0$ は $\eta_{1}>0$, $\varrho(\eta)=e^{-c/\eta_{1}}$ をみたす】$T$ の点列が $p$ に収束するとき、$p_{1}>0$ なら条件 $\varrho\le e^{-c/x_{1}}$ は連続性で保たれ、$p_{1}\le0$ なら項の $x_{1}\to0^{+}$ と $\varrho\le e^{-c/x_{1}}\to0$ から $p=0\in T$。よって $T$ は閉で $\Omega$ は開。$0<s\le\frac12$ の $se_{1}$ は開集合 $\{x_{1}>0,\varrho<e^{-c/x_{1}}\}\subset T$ に含まれ、$\Omega$ の閉包に入らない。$s>\frac12$ なら $|se_{1}|>\frac12$。$\eta\in\partial\Omega$, $0<|\eta|<\frac12$ なら $\eta\in T$ で、$\eta_{1}>0$、$\varrho(\eta)<e^{-c/\eta_{1}}$ なら $\eta$ は $T$ の内部の点で $\Omega$ の閉包に入らないので、$\varrho(\eta)=e^{-c/\eta_{1}}$。

**Step 2（$u$ の調和性と閉じた式）.** 【主張：$u$ は $\mathbb{R}^{3}\setminus\Sigma$ で調和、$u>0$ で、$x_{1}<1$ の点では $q_{s}\defeq|x-se_{1}|$ について
$$
u(x)=q_{1}-q_{0}+x_{1}\log\frac{1-x_{1}+q_{1}}{q_{0}-x_{1}}
$$
】$|x-se_{1}|^{-1}=4\pi\Phi(x-se_{1})$ は $x\ne se_{1}$ で調和（\ref{pde:gf-fundamental-properties.1}）。$\mathbb{R}^{3}\setminus\Sigma$ のコンパクト集合の上では $|x-se_{1}|$ は正の数で下から押さえられ、$x$ についての各偏導関数は $(x,s)$ について連続で有界なので、\ref{meas:parameter-integrals} で積分記号下で微分でき、$u$ は $C^{2}$ 級で $\Delta u=\int_{0}^{1}s\,\Delta_{x}|x-se_{1}|^{-1}ds=0$。被積分関数は正なので $u>0$。式は、$F(s)\defeq q_{s}+x_{1}\log(s-x_{1}+q_{s})$ が $F'(s)=\frac{s-x_{1}}{q_{s}}+x_{1}\frac{1+(s-x_{1})/q_{s}}{s-x_{1}+q_{s}}=\frac{s}{q_{s}}$ をみたすことから（$x\notin\Sigma$, $x_{1}<1$ なら $s-x_{1}+q_{s}>0$：$\varrho>0$ なら $q_{s}>|s-x_{1}|$、$\varrho=0$ なら $x_{1}<0$）。

**Step 3（原点の近くでの $u$ の振る舞い）.** 【主張：(a) $\limsup_{x\to0,x\in\Omega}u(x)\le1+2c$、(b) 棘の表面 $\{\varrho=e^{-c/x_{1}}\}$ に沿って $x\to0$ なら $u(x)\to1+2c$、(c) $u(-te_{1})\to1$（$t\to0^{+}$）】$N\defeq1-x_{1}+q_{1}$、$D\defeq q_{0}-x_{1}=|x|-x_{1}$ とおく。三角不等式から $q_{1}-q_{0}\le|e_{1}|=1$、また $x\to0$ で $q_{1}-q_{0}\to1$, $N\to2$。$|x|<\frac12$ なら $1\le N\le3$。
(a)：$x_{1}\le0$ なら $D\le2|x|<1\le N$ なので $x_{1}\log(N/D)\le0$、$u\le1$。$x_{1}>0$, $x\in\Omega$ なら $\varrho>e^{-c/x_{1}}$ で、$D=\frac{\varrho^{2}}{|x|+x_{1}}$ から $-x_{1}\log D=-2x_{1}\log\varrho+x_{1}\log(|x|+x_{1})<2c$（$|x|+x_{1}<1$）。よって $u<1+x_{1}\log3+2c$。
(b)：表面では $-2x_{1}\log\varrho=2c$ なので $u=q_{1}-q_{0}+x_{1}\log N+2c+x_{1}\log(|x|+x_{1})$。$x_{1}$ が小さければ $e^{-c/x_{1}}\le x_{1}$ なので $x_{1}\le|x|+x_{1}\le3x_{1}$、よって $|x_{1}\log(|x|+x_{1})|\le x_{1}|\log x_{1}|\to0$。ほかの項は $1$, $0$, $2c$ に収束する。
(c)：$x=-te_{1}$ では $q_{1}=1+t$, $q_{0}=t$, $D=2t$, $N=2+2t$ なので $u=1-t\log\frac{1+t}{t}\to1$。

**Step 4（境界値と、ペロン関数が $u$ に一致すること）.** 【主張：$g\defeq u$（$\partial\Omega\setminus\{0\}$ の上）、$g(0)\defeq1+2c$ は $\partial\Omega$ で連続で、$\Omega$ の上で $u_{g}=u$】Step 1 から $\partial\Omega\setminus\{0\}\subset\mathbb{R}^{3}\setminus\Sigma$ で、$u$ はそこで連続。$0$ の近くの境界点は表面の点なので、Step 3 (b) から $g$ は $0$ でも連続。$u$ は $\Omega$ で調和（劣調和）で、$\eta\ne0$ では上極限 $u(\eta)=g(\eta)$、$0$ では Step 3 (a) から $\le g(0)$ なので $u\in\mathcal{S}_{g}$、$u_{g}\ge u$。逆に $v\in\mathcal{S}_{g}$, $\varepsilon>0$ について $v-u-\varepsilon\Phi$ は劣調和で（$0\notin\Omega$）、$\eta\ne0$ では上極限 $\le g(\eta)-u(\eta)-\varepsilon\Phi(\eta)<0$、$0$ では $v\le\sup g$, $u>0$, $\Phi\to+\infty$ から $-\infty$。\ref{pde:subharmonic-limsup-maximum} から $v\le u+\varepsilon\Phi$、$\varepsilon\to0$ で $v\le u$。よって $u_{g}=u$。

**Step 5（結論）.** 【主張：$g$ のディリクレ問題は古典解をもたず、$0$ は正則でない】古典解 $h$ があれば \ref{pde:perron-family-properties.4} から $u=u_{g}=h$ で、$h$ は $0$ で連続なので $u(x)\to g(0)=1+2c$（$x\to0$）。しかし Step 3 (c) の $-te_{1}\in\Omega$（$0<t<\frac12$）に沿っては $u\to1\ne1+2c$。正則でないことは、同じ極限の食い違いと \ref{pde:barrier-regular} から。

::: hypcheck
- **棘が指数関数的に細いこと**：Step 3 (a)(b) で、$-x_{1}\log\varrho^{2}$ が有限の値 $2c$ に収まることに使った。この値が $u$ の跳び $2c$ を生む。棘を $\varrho\le x_{1}^{k}$（多項式の細さ）にすると $-x_{1}\log\varrho^{2}=2kx_{1}\log\frac{1}{x_{1}}\to0$ となり、このポテンシャルでは跳びが生じない。
- **$n=3$**：線分上の電荷のポテンシャルが原点で有限（$\int_{0}^{1}s\cdot s^{-1}ds=1$）で、しかも線分の近くで対数的に発散することに使った。$n=2$ ではこのような例はない（補足）。
- **境界値 $g$**：連続ではあるが、棘の表面の上での $u$ の値として選んだ。もっと素朴な境界値でも解けない：\ref{pde:barrier-regular} の証明の Step 3 は、ある 1 つの $g(\eta)=|\eta-\xi|$ についてペロン関数が $\xi$ で $0$ に近づけば $\xi$ は正則であることを示しているので、正則でない原点では $g(\eta)=|\eta|$ のペロン関数は原点で $0$ に近づかず、このリプシッツ連続な $g$ のディリクレ問題も（\ref{pde:perron-family-properties.4} から）古典解をもたない。
- **公理**：Step 4 の比較では選択公理を使わない。正則でないことの結論は \ref{pde:barrier-regular} を通して可算選択公理を使う（古典解がないことは \ref{pde:perron-family-properties.4} だけで、選択公理を使わない）。
:::
:::

::: supplement
**前提を変えると.** 外部錐条件では角が正であることが本質的だった（\ref{pde:barrier-exterior-cone} の検査欄）。ルベーグの棘は、錐を角 0 の極限まで細くし、さらに指数関数的に細くした例である。棘を多項式の細さ $\varrho\le x_{1}^{k}$ にすると原点は正則になることが、ウィーナーの判定法から知られている（ここでは証明しない）。$n=2$ では、補集合の連結成分が 1 点でなければ正則なので（前の節の補足）、棘の先端も正則である：平面では、どんなに細い線でも境界として「見える」。$n\ge3$ では線分は容量が 0 で「見えない」ので、それを囲む棘が十分細いと、その先端は見えなくなる。

**似た定理.** 穴あき球の例は、除去可能な特異点（\ref{pde:gf-removable-singularity}）の言い換えである：1 点は調和関数にとって見えないので、そこに境界値を課すことはできない。ルベーグの棘はその「連続版」で、1 点ではなく細い集合でも、容量が小さければ見えなくなる。熱方程式では、円柱の上面には値を与えなくてよく、底面と側面（放物境界）の値だけで解が決まる（\see{pde:heat-parabolic-boundary}）。境界のどの部分が解に「見える」かが方程式によって違う、という点で似ている。

**高い視点：粒子は棘に当たらない.** ブラウン運動で言えば、$\mathbb{R}^{3}$ の粒子は線分にほとんど確実に当たらない。原点の近くから出発した粒子は、細い棘の表面にほとんど当たらずに遠くまでさまよい、球面に当たって止まる。だから原点の近くの解の値は、棘の上の境界値 $1+2c$ ではなく、遠くの球面の値の平均の方に引っ張られる。比喩で言えば、細すぎる排水口には水が吸い込まれない。
:::

## 古典的手法と関数解析的手法の前提 {#pde:sec-pr-comparison}

ここまでの結果を、関数解析的手法と対比してまとめる（両者の詳しい比較は系列の後のページで行う）。

::: table ディリクレ問題の二つの解き方 {#pde:table-pr-classical-weak}
| | 古典的手法（ペロンの方法） | 関数解析的手法（弱解） |
|---|---|---|
| 解く空間 | $C^{2}(\Omega)\cap C(\overline{\Omega})$ | $H^{1}(\Omega)$ |
| 境界値の意味 | 各点での連続な極限 | $u-G\in H_{0}^{1}(\Omega)$（$G$ は境界値の延長） |
| 内部の解の存在 | どんな有界領域でも（\ref{pde:perron-harmonic}） | どんな有界領域でも（\see{fa:weak-dirichlet-existence}） |
| 境界値をとるための条件 | 境界の各点の正則性（障壁）：外部球・外部錐・凸・$C^{1}$ 境界なら成立 | 条件なし（弱い意味でとる） |
| 解けない例 | 穴あき球の中心、ルベーグの棘の先端 | なし（穴あき球では中心の値は無視される） |
| 一意性 | 弱最大値原理（\ref{pde:dirichlet-uniqueness.1}） | ラックス–ミルグラムの定理の一意性 |
:::

::: supplement
**前提の対比.** 古典的手法では、内部で調和な関数（ペロン関数）は領域の形によらずにいつでも作れ、問題は**境界で値をとるか**だけに集約される。そしてそれは境界値 $g$ の滑らかさではなく、**境界の幾何**（障壁の存在）で決まる。関数解析的手法では、境界値 $g$ が $\mathbb{R}^{n}$ の $C^{2}$ 関数 $G$ の制限なら、$-\Delta w=\Delta G$ の弱解 $w\in H_{0}^{1}(\Omega)$（\see{fa:weak-dirichlet-existence}）から $u\defeq G+w$ が、どんな有界領域でも、境界の形を問わずに得られる。その代わり、「境界で $g$ に等しい」は $u-G\in H_{0}^{1}(\Omega)$ という弱い意味になる。たとえば穴あき球では、$n\ge2$ で $H_{0}^{1}(B(0,1)\setminus\{0\})=H_{0}^{1}(B(0,1))$ であることが知られており（ここでは証明しない）、弱解は中心での値 $g(0)=1$ を無視して $u\equiv0$ になる。これはペロン関数 $u_{g}\equiv0$（\ref{pde:perron-punctured-ball}）と一致する。弱解が境界の各点で連続に $g$ をとるかどうかを問うと、やはり境界点の正則性に戻ってくる。二つの手法は、同じ困難を「境界での値の意味」のどちらの側に置くかが違うのである。

**高い視点：比喩.** 古典的手法は「ぴんと張った膜を枠にはめる」方法で、枠の形が悪い（棘や針の先がある）と膜がそこで枠に届かない。関数解析的手法は「膜のエネルギーを最小にする」方法で、届かない所は最初から気にしない。どちらも同じ膜を作るが、枠に届いたかどうかの判定の厳しさが違う。
:::

## 問題 {#pde:sec-pr-cone-problems}

::: problem {#pde:prob-pr-slit}
$n=2$ とし、$\mathbb{R}^{2}=\mathbb{C}$ と同一視して、$\Omega\defeq B(0,1)\setminus\{x_{1}+0i:0\le x_{1}<1\}$ とする。$\Omega$ の点を $z=re^{i\theta}$（$0<r<1$, $0<\theta<2\pi$）と書き、
$$
w(z)\defeq-\frac{\log r}{(\log r)^{2}+\theta^{2}}
$$
とおく。$w$ が $\Omega\cap B(0,\frac12)$ の上の局所的な障壁（\ref{pde:barrier-local} の条件をみたす関数）であることを示し、原点が正則であることを導け。
:::

::: solution
**調和性.** 対数の主値 $\mathrm{Log}$ は $\mathbb{C}\setminus(-\infty,0]$ で正則（\ref{cx:log-holomorphic}）なので、$\ell(z)\defeq\mathrm{Log}(-z)+i\pi$ は $\mathbb{C}\setminus[0,\infty)$ で正則。$z=re^{i\theta}$（$0<\theta<2\pi$）なら $-z=re^{i(\theta-\pi)}$、$\theta-\pi\in(-\pi,\pi)$ なので $\ell(z)=\log r+i\theta$。$\Omega$ では $\log r<0$ なので $\ell\ne0$ で、$-1/\ell$ は正則。$-\frac{1}{\log r+i\theta}=-\frac{\log r-i\theta}{(\log r)^{2}+\theta^{2}}$ の実部が $w$ なので、$w$ は $\Omega$ で調和（\ref{cx:real-part-harmonic}）、とくに優調和で連続。

**障壁の条件.** $L\defeq-\log r>0$ とおくと $w=\frac{L}{L^{2}+\theta^{2}}>0$、$w\le\frac1L\to0$（$r\to0$）。$0<\delta<\frac12$ について、$\delta\le r<\frac12$ なら $L\in(\log2,\log\frac1\delta]$, $\theta^{2}<4\pi^{2}$ なので $w\ge\frac{L}{L^{2}+4\pi^{2}}\ge\min_{s\in[\log2,\log(1/\delta)]}\frac{s}{s^{2}+4\pi^{2}}>0$（正の連続関数の閉区間での最小値）。

よって \ref{pde:barrier-local}（$\rho=\frac12$）から原点は正則。（原点では外部錐条件は成り立たない。正則性の判定に、外部錐条件は十分条件だが必要条件ではない。）
:::

::: problem {#pde:prob-pr-c1-cone}
$\Omega$ を $C^{1}$ 境界（\ref{fa:c1-boundary.2}）をもつ有界な開集合とする。$\partial\Omega$ の各点で外部錐条件が成り立つことを示し、すべての $g\in C(\partial\Omega)$ についてディリクレ問題が古典解をもつことを導け。
:::

::: solution
\ref{pde:perron-c2-boundary} の証明と同じく、$\xi\in\partial\Omega\cap U_{i}$ をとり、直交変換 $A$ で写した座標 $z=Ax$ で考える。$\zeta\defeq A\xi=(\zeta',\gamma(\zeta'))$、$p\defeq\nabla\gamma(\zeta')$ とする。

**半径の選択.** $\nabla\gamma$ の連続性から、$r>0$ を $B(\zeta,r)\subset AU_{i}$、$\{|z'-\zeta'|\le r\}\subset W_{i}$、$|z'-\zeta'|\le r$ で $|\nabla\gamma(z')-p|\le1$ となるようにとる。平均値の定理（\tref{calc:mean-value-theorem}。$\tau\mapsto\gamma(\zeta'+\tau h')$ に使う）から、$|h'|\le r$ なら $\gamma(\zeta'+h')-\gamma(\zeta')=\nabla\gamma(\zeta'+\theta h')\cdot h'\ge p\cdot h'-|h'|\ge-(|p|+1)|h'|$。

**錐.** $\beta\defeq\arctan\frac{1}{2(|p|+1)}$、軸 $-e_{n}$、高さ $\rho\defeq r/2$ の錐を考える。$h\ne0$, $|h|\le\rho$, $-h_{n}\ge|h|\cos\beta$ なら、$|h'|\le|h|\sin\beta$ なので
$$
h_{n}\le-|h|\cos\beta<-(|p|+1)|h|\sin\beta\le-(|p|+1)|h'|\le\gamma(\zeta'+h')-\gamma(\zeta')
$$
（真ん中の不等号は $\tan\beta<\frac{1}{|p|+1}$ と $|h|>0$ から）。よって $z\defeq\zeta+h$ は $AU_{i}$ に入り $z_{n}<\gamma(z')$ なので $z\notin A\Omega$。$h=0$ は $\xi\notin\Omega$。$A^{-1}$ で戻すと、$\xi$ を頂点、軸 $-A^{-1}e_{n}$、半頂角 $\beta$、高さ $\rho$ の錐が $\Omega$ と交わらない。

\ref{pde:barrier-exterior-cone} から各境界点は正則で、\ref{pde:perron-dirichlet-solvable} からディリクレ問題は解ける。（$C^{1}$ 境界では外部球条件は成り立たないことがある：\ref{pde:perron-c2-boundary} の検査欄。）
:::
