# 演習：古典的手法（1） {#pde:page-exercises-classical keywords="exercises, classical methods for PDE"}

この系列の前半（特性曲線からペロンの方法まで）の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、放物線の特性曲線と焦点をもつ準線形方程式の解、なだらかな山が崩れる時刻と場所、二つの衝撃波の合体、$e^{x_{1}}\cos x_{2}$ での評価の検算とハルナックの定数の上下からの評価、多項式の境界値のポアソン積分、球のねじれ関数とグリーン関数の積分、ヘルダー連続でないがディニ連続な右辺、ケルヴィン変換による外部の調和関数の減衰、劣調和関数の判定と簡単な障壁、平面の外部錐条件の平方根の障壁、円環のディリクレ問題と孤立した境界点である。後半（熱方程式・波動方程式・変数分離）は \see{pde:page-exercises-classical-b} にある。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#pde:sec-excl-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。特性曲線の節では時間を先に $(t,x)$ と書き、それ以外の節では $\Omega\subset\mathbb{R}^{n}$ は開集合、$\Delta=\sum_{i}\partial_{i}^{2}$（解析学の符号）、$B(x,r)$, $\overline{B}(x,r)$, $\omega_{n}=\lambda(B(0,1))$、球面測度 $\sigma$（$\sigma(S^{n-1})=n\omega_{n}$）、球面平均 $S_{r}u$ と球平均 $A_{r}u$ は \ref{pde:spherical-mean} のとおり。
- 基本解は $\Phi(x)=\Psi(|x|)$（\ref{pde:gf-fundamental-solution}）で、$n=2$ では $\Psi(s)=-\frac{1}{2\pi}\log s$、$n\ge3$ では $\Psi(s)=\frac{s^{2-n}}{n(n-2)\omega_{n}}$。動径関数 $g(|x|)$ のラプラシアンは $g''(r)+\frac{n-1}{r}g'(r)$（\ref{pde:harmonic-function} の後の例 3）。
- 一つの問題の解答は、ほかの問題の結果を使わない（使うのは各ページの本文の結果だけである）。
- **選択公理**：引用する各ページの結果に含まれるもの（測度論の基礎の結果、ペロン関数の調和性と \ref{pde:barrier-regular} を通した可算選択公理）のほかには使わない。
:::

## 特性曲線とバーガース方程式 {#pde:sec-ch-exercises}

対応するページ：\ref{pde:page-characteristics}、\ref{pde:page-burgers}

::: problem ★ 基本：放物線の特性曲線と焦点をもつ準線形方程式 {#pde:ex-ch-1}
1. $n=1$ で、輸送方程式 $\partial_{t}u+t\,\partial_{x}u=x$, $u(0,x)=\sin x$ を考える。特性曲線 $\phi(s,t,x)$ を求め、\ref{pde:transport-variable.2} の公式で $u$ を求めよ。それが $\mathbb{R}\times\mathbb{R}$ 上の古典解であることを直接確かめ、$0$ を含むどの開区間 $J$ の上でも古典解はこれだけであることを示せ。
2. $n=2$、$G=\mathbb{R}^{3}$ で、準線形方程式 $u\,\partial_{1}u+\partial_{2}u=1$（$a(x,z)=(z,1)$, $c=1$）と、初期曲線 $\gamma(y)=(y,0)$、データ $h(y)=y$（$y\in\mathbb{R}$）を考える。データがすべての $y$ で非特性的であることを示し、特性曲線の連立系を解いて
$$
u(x)=\frac{x_{1}+x_{2}+x_{2}^{2}/2}{1+x_{2}}\qquad(x_{2}>-1)
$$
が $W\defeq\{x:x_{2}>-1\}$ 上の $C^{1}$ 解で $u(x_{1},0)=x_{1}$ を満たすことを示せ。さらに、$W$ 上の $C^{1}$ 解 $v$ で $v(x_{1},0)=x_{1}$ となるものは $u$ だけであることを示せ。
3. 2 の特性曲線の射影がすべて点 $(\frac12,-1)$ を通ることを示し、$u$ は直線 $x_{2}=-1$ の上の $(\frac12,-1)$ 以外のどの点にも連続に延びないことを示せ。
:::

::: solution
**1.** $b(t,x)=t$ は連続で $D_{x}b=0$、$|b|\le|t|$、$f(t,x)=x$ は $D_{x}f=1$、$g=\sin$ は $C^{1}$ 級なので、\ref{pde:transport-variable} の (a)〜(d) が成り立つ。$X'(s)=s$, $X(t)=x$ の解は $\phi(s,t,x)=x+\frac{s^{2}-t^{2}}{2}$ で、特性曲線は放物線である。公式から
$$
u(t,x)=\sin\Bigl(x-\frac{t^{2}}{2}\Bigr)+\int_{0}^{t}\Bigl(x+\frac{s^{2}-t^{2}}{2}\Bigr)ds=\sin\Bigl(x-\frac{t^{2}}{2}\Bigr)+xt-\frac{t^{3}}{3}.
$$
直接の確認：$\partial_{t}u=-t\cos(x-\frac{t^{2}}{2})+x-t^{2}$、$t\,\partial_{x}u=t\cos(x-\frac{t^{2}}{2})+t^{2}$ で、和は $x$。$u(0,x)=\sin x$ で、$u$ は $C^{\infty}$ 級。\ref{pde:transport-variable.2} から、$J\times\mathbb{R}$ 上の古典解はこの $u$ に等しい。

**2.** $\gamma'(y)=(1,0)$ と $a(\gamma(y),h(y))=(y,1)$ は、行列式 $1\cdot1-0\cdot y=1\neq0$ なので一次独立で、データは至る所で非特性的である。特性曲線の連立系 $X_{1}'=Z$, $X_{2}'=1$, $Z'=1$ を $(X,Z)(0)=(y,0,y)$ で解くと
$$
Z=y+s,\qquad X_{2}=s,\qquad X_{1}=y+ys+\frac{s^{2}}{2}.
$$
$x_{2}=s>-1$ なら $x_{1}=y(1+x_{2})+\frac{x_{2}^{2}}{2}$ を $y$ について解けて $y=\frac{x_{1}-x_{2}^{2}/2}{1+x_{2}}$、$u=Z=y+x_{2}$ が主張の式になる（\ref{pde:quasilinear-local-existence.1} の $u=Z\circ X^{-1}$）。直接の確認：$\partial_{1}u=\frac{1}{1+x_{2}}$、$\partial_{2}u=\frac{(1+x_{2})^{2}-(x_{1}+x_{2}+x_{2}^{2}/2)}{(1+x_{2})^{2}}$ なので
$$
u\,\partial_{1}u+\partial_{2}u=\frac{(x_{1}+x_{2}+x_{2}^{2}/2)+(1+x_{2})^{2}-(x_{1}+x_{2}+x_{2}^{2}/2)}{(1+x_{2})^{2}}=1,
$$
$u(x_{1},0)=x_{1}$。$u$ は $W$ で $C^{\infty}$ 級である。

一意性：$v$ を $W$ 上の $C^{1}$ 解で $v(x_{1},0)=x_{1}$ とし、$x\in W$ を固定する。$F(X)\defeq(v(X),1)$ は $W$ で $C^{1}$ 級なので局所リプシッツで（\ref{ode:c1-locally-lipschitz}）、$X'=F(X)$, $X(0)=x$ の最大解 $X$ がある（\ref{ode:maximal-solution}）。連鎖律から $\frac{d}{ds}v(X(s))=v\,\partial_{1}v+\partial_{2}v=1$ なので、$v(X(s))=v(x)+s$、$X_{2}(s)=x_{2}+s$、$X_{1}(s)=x_{1}+v(x)s+\frac{s^{2}}{2}$。$s_{0}\defeq-x_{2}$ とおく。$0$ と $s_{0}$ の間の $s$ では $X_{2}(s)$ は $x_{2}$ と $0$ の間にあり、$X(s)$ は $W$ の中のコンパクト集合（$X_{1}$ は有界、$X_{2}\in[\min(x_{2},0),\max(x_{2},0)]$）に入るので、\ref{ode:escape-lemma} から最大解は $s_{0}$ まで定義される。$X(s_{0})=(y,0)$ と書くと $v(y,0)=y$ なので $y=v(x)-x_{2}$、そして $y=X_{1}(s_{0})=x_{1}-v(x)x_{2}+\frac{x_{2}^{2}}{2}$。二式から $y(1+x_{2})+\frac{x_{2}^{2}}{2}=x_{1}$、$v(x)=y+x_{2}=u(x)$。

**3.** 射影は $s\mapsto(y+ys+\frac{s^{2}}{2},s)$ で、$s=-1$ では $y$ によらず $(\frac12,-1)$。$c\neq\frac12$ とし、$x\to(c,-1)$（$x\in W$）とすると分子は $c-1+\frac12=c-\frac12\neq0$ に、分母 $1+x_{2}$ は正のまま $0$ に近づくので $|u(x)|\to\infty$。よって $(c,-1)$ に連続に延びない。特性曲線がすべて一点に集まる（焦点）ので、解は $x_{2}=-1$ を越えられない。
:::

::: problem ★★ 標準：なだらかな山が崩れる時刻と場所 {#pde:ex-ch-2}
バーガース方程式の初期値を $g(x)\defeq\frac{1}{1+x^{2}}$ とする。
1. \ref{pde:burgers-shock-formation} の $m$ と $T^{*}$ を求めよ。$t\uparrow T^{*}$ で $\partial_{x}u$ が $-\infty$ に発散する特性曲線と、その特性曲線の $t=T^{*}$ での位置を求めよ。
2. $0\le t<T^{*}$ について、$0<u(t,\cdot)\le1$ で、最大値 $1$ をとる点は $x=t$ だけであること、$u(t,\cdot)$ は $x<t$ で増加、$x>t$ で減少することを示せ。
3. $0\le t<T^{*}$ について $\int_{\mathbb{R}}u(t,x)\,dx=\pi$ を示せ。
:::

::: solution
**1.** $g'(\xi)=-\frac{2\xi}{(1+\xi^{2})^{2}}$、$g''(\xi)=\frac{6\xi^{2}-2}{(1+\xi^{2})^{3}}$。$\xi\le0$ で $g'\ge0$、$\xi>0$ では $g'<0$ で、$g''$ の符号から $g'$ は $(0,\frac{1}{\sqrt3}]$ で減少、$[\frac{1}{\sqrt3},\infty)$ で増加し $\xi\to\infty$ で $0$ に近づく。よって
$$
m=g'\Bigl(\frac{1}{\sqrt3}\Bigr)=-\frac{2/\sqrt3}{(4/3)^{2}}=-\frac{3\sqrt3}{8},\qquad T^{*}=-\frac1m=\frac{8}{3\sqrt3}=\frac{8\sqrt3}{9}.
$$
最小値は $\xi_{0}=\frac{1}{\sqrt3}$ でとられるので、\ref{pde:burgers-shock-formation.3} から、$\xi_{0}$ を出る特性曲線 $x=\chi_{t}(\xi_{0})$ に沿って $\partial_{x}u=\frac{m}{1+tm}\to-\infty$。その位置は $\chi_{T^{*}}(\xi_{0})=\frac{1}{\sqrt3}+\frac{8}{3\sqrt3}\cdot\frac34=\frac{3}{\sqrt3}=\sqrt3$。

**2.** \ref{pde:burgers-shock-formation.1} から $u(t,x)=g(\Xi(t,x))\in(0,1]$ で、$u=1$ となるのは $\Xi=0$、つまり $x=\chi_{t}(0)=t$ のときだけ。$1+tg'(\xi)\ge1+tm>0$ なので、同じ項の式から $\partial_{x}u$ の符号は $g'(\Xi)$ の符号に等しい。$\chi_{t}$ は狭義増加で $\chi_{t}(0)=t$ なので、$x<t\iff\Xi<0\iff g'(\Xi)>0$。よって $x<t$ で $\partial_{x}u>0$、$x>t$ で $\partial_{x}u<0$。

**3.** $\chi_{t}$ は $C^{1}$ 級で $\chi_{t}'=1+tg'>0$、$\Xi(t,\cdot)$ はその逆写像なので、$A>0$ について置換積分（\ref{calc:substitution-parts}）から
$$
\begin{aligned}
\int_{\chi_{t}(-A)}^{\chi_{t}(A)}u(t,x)\,dx&=\int_{-A}^{A}g(\xi)\bigl(1+tg'(\xi)\bigr)d\xi\\
&=\int_{-A}^{A}g\,d\xi+t\Bigl[\frac{g^{2}}{2}\Bigr]_{-A}^{A}\\
&=\int_{-A}^{A}g\,d\xi
\end{aligned}
$$
（$g$ は偶関数）。$|\chi_{t}(\xi)-\xi|\le t$ なので $A\to\infty$ で $\chi_{t}(\pm A)\to\pm\infty$。$u\ge0$ なので単調収束により $\int_{\mathbb{R}}u(t,x)\,dx=\int_{\mathbb{R}}g=\pi$。崩れる直前まで、山の形は前が急に、後ろがなだらかになるが、面積は保たれる。
:::

::: problem ★★★ 発展：二つの衝撃波の合体 {#pde:ex-ch-3}
初期値を $g(x)\defeq2$（$x<0$）、$1$（$0\le x<1$）、$0$（$x\ge1$）とし、$t\ge0$ で
$$
\begin{aligned}
&0\le t<1:\quad u(t,x)\defeq\begin{cases}2&(x<s_{1}(t))\\1&(s_{1}(t)\le x<s_{2}(t))\\0&(x\ge s_{2}(t))\end{cases}\\
&t\ge1:\quad u(t,x)\defeq\begin{cases}2&(x<s(t))\\0&(x\ge s(t))\end{cases}
\end{aligned}
$$
とおく。ここで $s_{1}(t)\defeq\frac{3t}{2}$, $s_{2}(t)\defeq1+\frac{t}{2}$, $s(t)\defeq t+\frac12$。
1. 三本の飛び目がそれぞれ \ref{pde:rankine-hugoniot} の条件を満たすことを確かめ、二本の衝撃波が時刻 $1$ に $x=\frac32$ で合体することを確かめよ。
2. 試験関数 $\varphi$ について $m(t)\defeq\int_{\mathbb{R}}u(t,x)\varphi(t,x)\,dx$ とおく。$(0,1)$ と $(1,\infty)$ の上で $\int_{\mathbb{R}}\bigl(u\,\partial_{t}\varphi+F(u)\,\partial_{x}\varphi\bigr)dx=m'(t)$ を示し、$u$ が $[0,\infty)\times\mathbb{R}$ 上の弱解であることを示せ。
3. 各飛び目がラックスのエントロピー条件（\ref{pde:entropy-uniqueness.1}）を満たし、$u$ がオレイニクの条件（\ref{pde:entropy-uniqueness.2}）も満たすことを確かめよ。また $A>0$ が大きいとき $\frac{d}{dt}\int_{-A}^{A}u(t,x)\,dx=2$ を確かめ、流束 $F(u)$ の出入りで説明せよ。
:::

::: solution
**1.** $F(2)=2$, $F(1)=\frac12$, $F(0)=0$。$s_{1}$ では $u_{-}=2$, $u_{+}=1$ で $\frac{u_{-}+u_{+}}{2}=\frac32=s_{1}'$、$s_{2}$ では $\frac{1+0}{2}=\frac12=s_{2}'$、$s$ では $\frac{2+0}{2}=1=s'$。$s_{1}(t)=s_{2}(t)\iff\frac{3t}{2}=1+\frac t2\iff t=1$ で、そのとき位置は $\frac32=s(1)$。$0\le t<1$ では $s_{1}<s_{2}$ である。

**2.** $\varphi$ の台を $[-A,A]\times[-A,A]$（$A>3$）に含まれるようにとる。$0<t<1$ では
$$
m(t)=2\int_{-A}^{s_{1}(t)}\varphi\,dx+\int_{s_{1}(t)}^{s_{2}(t)}\varphi\,dx
$$
で、積分範囲が動く場合の微分（\ref{calc:leibniz-rule}）から
$$
\begin{aligned}
m'(t)&=\int_{\mathbb{R}}u\,\partial_{t}\varphi\,dx\\
&\quad+(2-1)s_{1}'\varphi(t,s_{1})+(1-0)s_{2}'\varphi(t,s_{2}).
\end{aligned}
$$
一方 $\int F(u)\partial_{x}\varphi\,dx=2\varphi(t,s_{1})+\frac12\bigl(\varphi(t,s_{2})-\varphi(t,s_{1})\bigr)=\frac32\varphi(t,s_{1})+\frac12\varphi(t,s_{2})$。$s_{1}'=\frac32$, $s_{2}'=\frac12$ なので
$$
\begin{aligned}
&\int_{\mathbb{R}}\bigl(u\,\partial_{t}\varphi+F(u)\,\partial_{x}\varphi\bigr)dx\\
&\quad=m'(t)-\tfrac32\varphi(t,s_{1})-\tfrac12\varphi(t,s_{2})+\tfrac32\varphi(t,s_{1})+\tfrac12\varphi(t,s_{2})\\
&\quad=m'(t).
\end{aligned}
$$
打ち消し合うのは、1 のランキン–ユゴニオの関係 $s_{j}'(u_{-}-u_{+})=F(u_{-})-F(u_{+})$ そのものである。$t>1$ では $m(t)=2\int_{-A}^{s(t)}\varphi\,dx$、$m'(t)=\int u\,\partial_{t}\varphi\,dx+2s'\varphi(t,s)$、$\int F(u)\partial_{x}\varphi\,dx=2\varphi(t,s)$ で、$s'=1$ から同じく $m'(t)$ に等しい。

$m$ の二つの式は $t=1$ で一致し（$s_{1}(1)=s_{2}(1)=s(1)$）、$t=0$ では $m(0)=\int g(x)\varphi(0,x)\,dx$。$m$ は $[0,1]$ と $[1,\infty)$ の上で片側の微分を含めて $C^{1}$ 級で、$t\ge A$ で $0$。被積分関数は有界で台がコンパクトなので、フビニ–トネリの定理（\ref{meas:fubini-lebesgue}）で累次積分にでき、微積分学の基本定理から
$$
\begin{aligned}
&\int_{0}^{\infty}\!\!\int_{\mathbb{R}}\bigl(u\,\partial_{t}\varphi+F(u)\,\partial_{x}\varphi\bigr)dx\,dt\\
&\quad=\int_{0}^{1}m'\,dt+\int_{1}^{A}m'\,dt=-m(0)\\
&\quad=-\int_{\mathbb{R}}g\,\varphi(0,\cdot)\,dx.
\end{aligned}
$$
これは \eqref{pde:eq-weak-burgers} にほかならない。

**3.** 三本とも $u_{-}>u_{+}$（$2>1$, $1>0$, $2>0$）。各 $t$ で $u(t,\cdot)$ は非増加なので、$z>0$ について $u(t,x+z)-u(t,x)\le0\le C(1+\frac1t)z$ がどの $C\ge0$ でも成り立つ。したがって $u$ は \ref{pde:entropy-uniqueness.2} の意味のエントロピー解である（その一意性は fact として引用する）。$A>3$, $0\le t<A-1$ では $-A<s_{1},s_{2},s<A$ で、
$$
\int_{-A}^{A}u\,dx=\begin{cases}2(s_{1}+A)+(s_{2}-s_{1})&(t<1),\\2(s+A)&(t\ge1)\end{cases}\ =2A+1+2t
$$
なので導関数は $2$。左端 $x=-A$ からは流束 $F(2)=2$ が流れ込み、右端からは $F(0)=0$ しか流れ出ないので、量は速さ $2$ で増える。合体の前後で式が同じなのは、合体しても保存則が崩れないことの表れである。
:::

## 調和関数 {#pde:sec-hf-exercises}

対応するページ：\ref{pde:page-harmonic-functions}、\ref{pde:page-harmonic-estimates}

::: problem ★ 基本：$e^{x_{1}}\cos x_{2}$ で評価を検算する {#pde:ex-hf-1}
$n=2$ とし、$u(x)\defeq e^{x_{1}}\cos x_{2}$ とする。
1. $u$ が $\mathbb{R}^{2}$ で調和であることを確かめ、$0$ でのテイラー級数が $\sum_{k\ge0}\frac{1}{k!}\operatorname{Re}(x_{1}+ix_{2})^{k}$ であることを示せ。\ref{pde:harmonic-analytic} が保証する収束半径と比べよ。
2. \ref{pde:gradient-sphere-estimate} を $x_{0}=0$、半径 $s$ で使うと $|\partial_{1}u(0)|\le\frac{2e^{s}}{s}$ となることを示し、$s$ について最良の値を求めて実際の値 $\partial_{1}u(0)=1$ と比べよ。
3. \ref{pde:derivative-estimates} の後半の評価を $\alpha=(k,0)$ で使い、$r$ について最適化すると $1\le(16e)^{k}$ という評価になることを示せ。
4. $u$ は上にも下にも有界でないことを示し、\ref{pde:liouville-one-sided} と照らし合わせよ。
:::

::: solution
**1.** $\partial_{1}^{2}u=e^{x_{1}}\cos x_{2}$、$\partial_{2}^{2}u=-e^{x_{1}}\cos x_{2}$ で $\Delta u=0$。$z\defeq x_{1}+ix_{2}$ とすると $u=\operatorname{Re}e^{z}=\sum_{k}\frac{1}{k!}\operatorname{Re}z^{k}$ で、この級数は絶対収束する。$\operatorname{Re}z^{k}$ は $k$ 次の同次多項式なので、これを単項式 $x^{\alpha}$ に展開して並べたものは（絶対収束する二重和の並べ替えで）$u$ の $0$ での冪級数展開であり、係数は項別微分から $\frac{\partial^{\alpha}u(0)}{\alpha!}$、つまりテイラー級数に一致する。この級数は $\mathbb{R}^{2}$ 全体で収束する。\ref{pde:harmonic-analytic} は $B(0,d)\subset\mathbb{R}^{2}$ となる任意の $d$ について $|h|<\frac{d}{2^{6}\cdot4\cdot e}=\frac{d}{256e}$ での収束を保証し、$d$ はいくらでも大きくとれるので、結論はやはり全平面での収束である（定理の半径の定数は小さいが、ここでは制約にならない）。

**2.** $|x|=s$ なら $|u(x)|\le e^{x_{1}}\le e^{s}$ で、$x=(s,0)$ で等号。よって \ref{pde:gradient-sphere-estimate}（$n=2$）から $|\partial_{1}u(0)|\le\frac{2}{s}e^{s}$。$\frac{d}{ds}\frac{e^{s}}{s}=\frac{e^{s}(s-1)}{s^{2}}$ なので最小は $s=1$ で、評価は $|\partial_{1}u(0)|\le2e\approx5.44$。実際は $\partial_{1}u(0)=1$。

**3.** $n=2$ では $\omega_{2}C_{k}=(2^{3}\cdot2k)^{k}=(16k)^{k}$。$\sup_{B(0,r)}|u|\le e^{r}$ なので $|\partial_{1}^{k}u(0)|\le(16k)^{k}r^{-k}e^{r}$。$r^{-k}e^{r}$ は $r=k$ で最小値 $k^{-k}e^{k}$ をとるので、$1=|\partial_{1}^{k}u(0)|\le(16k)^{k}k^{-k}e^{k}=(16e)^{k}$。$k$ 階導関数の評価が $k^{k}$ ではなく $C^{k}$ の大きさになることが、\ref{pde:harmonic-analytic} の証明でテイラー級数の収束に効いている。

**4.** $u(x_{1},0)=e^{x_{1}}\to\infty$、$u(x_{1},\pi)=-e^{x_{1}}\to-\infty$（$x_{1}\to\infty$）。\ref{pde:liouville-one-sided} から、定数でない全平面の調和関数は上下どちらにも有界でありえないが、$u$ はその通りになっている。
:::

::: problem ★★ 標準：ハルナックの定数を上下から評価する {#pde:ex-hf-2}
$n\ge2$ とする。
1. $u\ge0$ が $B(0,4)$ で調和なら、$x,y\in B(0,1)$ について $u(x)\le3^{n}u(y)$ を示せ。とくに $\sup_{B(0,1)}u\le3^{n}\inf_{B(0,1)}u$。
2. 1 の不等式が $B(0,4)$ のすべての非負調和関数について成り立つ最小の定数を $C_{n}$ とする。$n\ge3$ なら $C_{n}\ge(\frac53)^{n-2}$、$n=2$ なら $C_{2}\ge\frac{\log(8/3)}{\log(8/5)}$ を示せ。
3. $L>0$、$K\defeq\{se_{1}:0\le s\le L\}$ とし、$\Omega$ が $\{x:\operatorname{dist}(x,K)<4\}$ を含むとする。$\Omega$ の非負調和関数 $u$ について $\sup_{K}u\le3^{n\lceil L\rceil}\inf_{K}u$ を示せ。$n=2$ で $u(x)=e^{ax_{1}}\cos(ax_{2})$（$a=\frac{\pi}{9}$）を考えて、$\{|x_{2}|<4\}$ を $\Omega$ とする場合、\ref{pde:harnack-inequality} の定数は $L$ について指数関数的に大きくなりうることを示せ。
:::

::: solution
**1.** 一般に、$\overline{B}(y,3)\subset\Omega$, $|x-y|<2$ なら、$|z-x|\le1$ のとき $|z-y|\le|z-x|+|x-y|<3$ なので $\overline{B}(x,1)\subset B(y,3)$。$\overline{B}(x,1)\subset\Omega$ でもあるので、球についての平均値の性質（\ref{pde:mean-value-property.2}）と $u\ge0$ から
$$
\begin{aligned}
u(x)&=\frac{1}{\omega_{n}}\int_{B(x,1)}u\,dz\\
&\le\frac{1}{\omega_{n}}\int_{B(y,3)}u\,dz\\
&=3^{n}\cdot\frac{1}{\omega_{n}3^{n}}\int_{B(y,3)}u\,dz\\
&=3^{n}u(y).
\end{aligned}
$$
$x,y\in B(0,1)$ なら $|x-y|<2$、$\overline{B}(y,3)\subset B(0,4)$ なので当てはまる。

**2.** $y_{0}\defeq4e_{1}$ とする。$n\ge3$ で $u(x)\defeq|x-y_{0}|^{2-n}$ は $\mathbb{R}^{n}\setminus\{y_{0}\}\supset B(0,4)$ で調和（記法の節の公式）で正。$x\in B(0,1)$ なら $3<|x-y_{0}|<5$ で、$x=\pm se_{1}$（$s\uparrow1$）で両端に近づくので $\sup_{B(0,1)}u=3^{2-n}$, $\inf_{B(0,1)}u=5^{2-n}$。比は $(\frac53)^{n-2}$ なので $C_{n}\ge(\frac53)^{n-2}$。$n=2$ では $u(x)\defeq\log\frac{8}{|x-y_{0}|}$ が $B(0,4)$ で調和（$\log|x|$ が調和）で、$|x-y_{0}|<8$ から正。同様に $\sup=\log\frac83$, $\inf=\log\frac85$。こうして $(\frac53)^{n-2}\le C_{n}\le3^{n}$。

**3.** $x,y\in K$ とし、$N\defeq\lceil L\rceil$（$L\le N$）、$p_{j}\defeq x+\frac{j}{N}(y-x)$（$0\le j\le N$）とおく。$|p_{j+1}-p_{j}|\le\frac LN\le1<2$、$p_{j}\in K$ なので $\overline{B}(p_{j},3)\subset\{\operatorname{dist}(\cdot,K)<4\}\subset\Omega$。1 の証明の一般形から $u(p_{j})\le3^{n}u(p_{j+1})$ で、つなげて $u(x)\le3^{nN}u(y)$。$x,y$ は任意なので主張を得る。

$n=2$、$a=\frac\pi9$ では、$|x_{2}|<4$ なら $|ax_{2}|<\frac{4\pi}{9}<\frac\pi2$ なので $u>0$ で、$u$ は調和（\ref{pde:harmonic-function} の後の例 2 と同様に $\Delta u=a^{2}u-a^{2}u=0$）。$K$ の上では $u=e^{ax_{1}}$ なので $\frac{\sup_{K}u}{\inf_{K}u}=e^{aL}=e^{\pi L/9}$。$K$ と $\Omega=\{|x_{2}|<4\}$ に対する \ref{pde:harnack-inequality} の定数は $e^{\pi L/9}$ 以上で、上の $3^{2\lceil L\rceil}$ とともに $L$ について指数関数的に増える。細長い領域では、ハルナックの定数は長さとともに指数的に悪化する。
:::

## グリーン関数とポアソン積分 {#pde:sec-gf-exercises}

対応するページ：\ref{pde:page-green-functions}、\ref{pde:page-poisson-integrals}、\ref{pde:page-holder-poisson}

::: problem ★ 基本：多項式の境界値のポアソン積分 {#pde:ex-gf-1}
$n\ge2$、$P_{1}$ を単位球 $B(0,1)$ のポアソン積分（\ref{pde:poisson-kernel-ball}）とする。
1. $g(y)\defeq y_{1}^{2}$（$|y|=1$）について $P_{1}[g](x)=x_{1}^{2}+\frac{1-|x|^{2}}{n}$ を示せ。
2. 1 の $x=0$ での値から $\int_{S^{n-1}}\theta_{1}^{2}\,d\sigma(\theta)=\omega_{n}$ を導き、$i\neq j$ について $\int_{S^{n-1}}\theta_{i}\theta_{j}\,d\sigma=0$ も同じ方法で示せ。\ref{pde:gf-second-derivatives.2} と比べよ。
3. $g(y)\defeq y_{1}^{3}$ について $P_{1}[g](x)=x_{1}^{3}+\frac{3}{n+2}x_{1}(1-|x|^{2})$ を示せ。
:::

::: solution
**1.** $v(x)\defeq x_{1}^{2}+\frac{1-|x|^{2}}{n}$ は多項式で、$\Delta v=2-\frac{2n}{n}=0$。$|x|=1$ で $v=x_{1}^{2}=g$。$v\in C^{2}(B(0,1))\cap C(\overline{B}(0,1))$ は調和で境界値 $g$ をもつので、\ref{pde:poisson-ball-dirichlet} の一意性から $v=P_{1}[g]$。

**2.** $K_{1}(0,y)=\frac{1}{n\omega_{n}}$ なので $P_{1}[g](0)=\frac{1}{n\omega_{n}}\int_{S^{n-1}}g\,d\sigma$。1 から $P_{1}[g](0)=\frac1n$ なので $\int\theta_{1}^{2}\,d\sigma=\omega_{n}$。$i\neq j$ なら $x_{i}x_{j}$ は調和（$\Delta(x_{i}x_{j})=0$）なので、同じ一意性から $g=y_{i}y_{j}$ のポアソン積分は $x_{i}x_{j}$ 自身で、$x=0$ の値 $0$ から $\int\theta_{i}\theta_{j}\,d\sigma=0$。合わせて $\int\theta_{i}\theta_{j}\,d\sigma=\delta_{ij}\omega_{n}$ で、これは \ref{pde:gf-second-derivatives.2} と同じ式である（そこでは別の方法で示されている）。

**3.** $v(x)\defeq x_{1}^{3}+cx_{1}(1-|x|^{2})$ は $|x|=1$ で $x_{1}^{3}$。$\Delta(x_{1}^{3})=6x_{1}$、積の公式から
$$
\begin{aligned}
\Delta\bigl(x_{1}(1-|x|^{2})\bigr)&=x_{1}\Delta(1-|x|^{2})+2\nabla x_{1}\cdot\nabla(1-|x|^{2})\\
&=-2nx_{1}-4x_{1}.
\end{aligned}
$$
よって $\Delta v=(6-c(2n+4))x_{1}$ で、$c=\frac{3}{n+2}$ なら調和。1 と同じく一意性から $v=P_{1}[g]$。
:::

::: problem ★★ 標準：球のねじれ関数とグリーン関数の積分 {#pde:ex-gf-2}
$n\ge2$、$r>0$ とし、$G$ を $B(0,r)$ のグリーン関数（\ref{pde:green-ball}）とする。
1. $x\in B(0,r)$, $y\in\overline{B}(0,r)\setminus\{x\}$ について $G(x,y)\ge0$ を示せ。
2. $x\in B(0,r)$ について $\int_{B(0,r)}G(x,y)\,dy=\frac{r^{2}-|x|^{2}}{2n}$ を示せ。$x=0$ では $G(0,y)=\Psi(|y|)-\Psi(r)$ を使って直接計算して確かめよ。
3. $u$ が $\overline{B}(0,r)$ の近傍で $C^{2}$ 級、$\partial B(0,r)$ で $u=0$、$|\Delta u|\le M$ なら、$|u(x)|\le\frac{M(r^{2}-|x|^{2})}{2n}$ を示せ。等号が成り立つ例を挙げよ。
:::

::: solution
**1.** $x$ を固定する。$\rho_{x}$ は $\overline{B}(0,r)$ の上で正の連続関数なので、$\Psi(\rho_{x}(y))$ は $\overline{B}(0,r)$ の上で有界。$\Psi(s)\to\infty$（$s\to0$）なので、$\varepsilon>0$ を $\overline{B}(x,\varepsilon)\subset B(0,r)$ かつ $\Psi(\varepsilon)\ge\max_{\overline{B}(0,r)}\Psi\circ\rho_{x}$ となるようにとれる。$D\defeq B(0,r)\setminus\overline{B}(x,\varepsilon)$ の上で $y\mapsto G(x,y)$ は調和で（\ref{pde:green-ball.2} と $\Phi$ の調和性）、$\overline{D}$ で連続、$|y|=r$ で $0$、$|y-x|=\varepsilon$ で $\Psi(\varepsilon)-\Psi(\rho_{x}(y))\ge0$。\ref{pde:weak-maximum-principle} の最小値の形から $D$ の上で $G(x,\cdot)\ge0$。$\varepsilon$ はいくらでも小さくとれるので主張を得る。

**2.** $w(y)\defeq\frac{r^{2}-|y|^{2}}{2n}$ は多項式で $-\Delta w=1$、$|y|=r$ で $w=0$。\ref{pde:green-dirichlet}（$f=1$, $g=0$）から $w(x)=\int_{B(0,r)}G(x,y)\,dy$。

$x=0$ では $\rho_{0}=r$ なので $G(0,y)=\Psi(|y|)-\Psi(r)$。放射関数の積分（\ref{meas:polar-radial.2}）から、$n\ge3$ なら
$$
\begin{aligned}
\int_{B(0,r)}G(0,y)\,dy&=n\omega_{n}\int_{0}^{r}\frac{s^{2-n}-r^{2-n}}{n(n-2)\omega_{n}}s^{n-1}ds\\
&=\frac{1}{n-2}\Bigl(\frac{r^{2}}{2}-\frac{r^{2}}{n}\Bigr)\\
&=\frac{r^{2}}{2n},
\end{aligned}
$$
$n=2$ なら $2\pi\int_{0}^{r}\frac{1}{2\pi}\log\frac{r}{s}\,s\,ds=\frac{r^{2}}{4}$。どちらも $w(0)$ に一致する。

**3.** \ref{pde:green-dirichlet}（$f=-\Delta u$, $g=0$）から $u(x)=\int G(x,y)f(y)\,dy$。1 と 2 から $|u(x)|\le M\int G(x,y)\,dy=\frac{M(r^{2}-|x|^{2})}{2n}$。$u=Mw$ で等号。ねじれ関数 $w$ は、右辺の大きさだけで解を抑える比較関数になっている。
:::

::: problem ★★ 標準：ヘルダー連続でないがディニ連続な右辺 {#pde:ex-gf-3}
$n\ge2$、$a\defeq e^{-3}$ とし、$p\in\{1,2\}$ について $\varphi_{p}(s)\defeq(\log\frac1s)^{-p}$（$0<s\le a$）、$\varphi_{p}(0)\defeq0$、
$$
f_{p}(x)\defeq\varphi_{p}(a)-\varphi_{p}\bigl(\min(|x|,a)\bigr)\qquad(x\in\mathbb{R}^{n})
$$
とおく。
1. $\varphi_{p}$ は $[0,a]$ で連続な増加関数で、$(0,a]$ で凹であることを示せ。これを使って、$0\le t\le a$ で $\omega_{f_{p}}(t)=\varphi_{p}(t)$、$t\ge a$ で $\omega_{f_{p}}(t)=\varphi_{p}(a)$ を示せ（\ref{pde:gf-dini-continuous}）。
2. $f_{2}$ はディニ連続だが、どの $0<\alpha\le1$ についても $\alpha$ 次ヘルダー連続でないことを示せ。$f_{1}$ はディニ連続でないことを示せ。
3. $u\defeq\Phi*f_{2}$ について、$u\in C^{2}(\mathbb{R}^{n})$ と $-\Delta u=f_{2}$ を確かめ、\eqref{pde:eq-newton-second-derivative} から $\partial_{i}\partial_{j}u(0)=-\frac{\delta_{ij}}{9n}$ を求めよ。
:::

::: solution
**1.** $L\defeq\log\frac1s\in[3,\infty)$ とおく。$s\downarrow0$ で $L\to\infty$ なので $\varphi_{p}$ は $0$ で連続。$\varphi_{p}'(s)=pL^{-p-1}s^{-1}>0$、
$$
\varphi_{1}''(s)=-\frac{L-2}{s^{2}L^{3}},\qquad\varphi_{2}''(s)=-\frac{2(L-3)}{s^{2}L^{4}}
$$
で、$L\ge3$ からどちらも $\le0$。よって $\varphi_{p}'$ は $(0,a]$ で非増加。$0\le\rho\le q\le a$ なら、$\varphi_{p}$ は $[0,a]$ で連続なので
$$
\begin{aligned}
\varphi_{p}(q)-\varphi_{p}(\rho)&=\int_{0}^{q-\rho}\varphi_{p}'(\rho+\tau)\,d\tau\\
&\le\int_{0}^{q-\rho}\varphi_{p}'(\tau)\,d\tau\\
&=\varphi_{p}(q-\rho)
\end{aligned}
$$
（$\tau\to0$ での広義積分は $\varphi_{p}$ の連続性から有限）。$x,y$ について $\rho\defeq\min(|x|,a)$, $q\defeq\min(|y|,a)$ とすると $|\rho-q|\le\bigl||x|-|y|\bigr|\le|x-y|$ で、上の不等式と単調性から $|f_{p}(x)-f_{p}(y)|\le\varphi_{p}(\min(|x-y|,a))$。逆に $0\le t\le a$ で $x=0$, $|y|=t$ とすると $|f_{p}(0)-f_{p}(y)|=\varphi_{p}(t)$、$t\ge a$ で $|y|=a$ とすると $\varphi_{p}(a)$。合わせて主張の等式を得る。$f_{p}$ は連続で $|x|\ge a$ で $0$ なので $f_{p}\in C_{c}(\mathbb{R}^{n})$。

**2.** $t=e^{-L}$ と置換すると $\int_{0}^{a}\frac{\varphi_{p}(t)}{t}\,dt=\int_{3}^{\infty}L^{-p}\,dL$ で、$p=2$ なら $\frac13$、$p=1$ なら $\infty$。$\int_{a}^{1}\frac{\varphi_{p}(a)}{t}dt=3\varphi_{p}(a)$ は有限なので、$f_{2}$ はディニ連続、$f_{1}$ はそうでない。$0<\alpha\le1$ なら $\frac{\varphi_{2}(t)}{t^{\alpha}}=\frac{e^{\alpha L}}{L^{2}}\to\infty$（$t\to0$）なので、$|f_{2}(0)-f_{2}(y)|\le C|y|^{\alpha}$ となる $C$ はない。

**3.** 2 と \ref{pde:newton-holder.1}・\ref[2]{pde:newton-holder.2} から $u\in C^{2}$、$-\Delta u=f_{2}$。\eqref{pde:eq-newton-second-derivative} を $x=0$, $R=1$ で使う。$f_{2}(y)-f_{2}(0)=-\varphi_{2}(\min(|y|,a))$ は動径関数で、\ref{pde:gf-second-derivatives.1} から $\partial_{i}\partial_{j}\Phi(-s\theta)=\frac{n\theta_{i}\theta_{j}-\delta_{ij}}{n\omega_{n}s^{n}}$。積分は絶対収束するので、極座標の公式（\ref{meas:polar-decomposition}）で
$$
\begin{aligned}
&\int_{B(0,1)}\partial_{i}\partial_{j}\Phi(-y)\bigl(f_{2}(y)-f_{2}(0)\bigr)dy\\
&\quad=-\int_{0}^{1}\frac{\varphi_{2}(\min(s,a))}{n\omega_{n}s}\,I_{ij}\,ds,\qquad I_{ij}\defeq\int_{S^{n-1}}(n\theta_{i}\theta_{j}-\delta_{ij})\,d\sigma,
\end{aligned}
$$
$I_{ij}$ は \ref{pde:gf-second-derivatives.2} から $n\delta_{ij}\omega_{n}-\delta_{ij}n\omega_{n}=0$。よって $\partial_{i}\partial_{j}u(0)=-\frac{\delta_{ij}}{n}f_{2}(0)=-\frac{\delta_{ij}}{n}\varphi_{2}(a)=-\frac{\delta_{ij}}{9n}$。和をとると $\Delta u(0)=-f_{2}(0)$ で、2 の結論と合う。$f_{1}$ については \ref{pde:newton-holder} は使えない（ディニ連続性は十分条件であり、$\Phi*f_{1}$ が $C^{2}$ 級かどうかはこの定理からは決まらない）。
:::

::: problem ★★★ 発展：ケルヴィン変換と外部の調和関数の減衰 {#pde:ex-gf-4}
$n\ge3$ とし、$x\neq0$ について $x^{*}\defeq x/|x|^{2}$、関数 $u$ について $K[u](x)\defeq|x|^{2-n}u(x^{*})$ とおく（**ケルヴィン変換**）。
1. 開集合 $U\subset\mathbb{R}^{n}\setminus\{0\}$ と $u\in C^{2}(U)$ について、$U^{*}\defeq\{x^{*}:x\in U\}$ の上で $\Delta(K[u])(x)=|x|^{-n-2}(\Delta u)(x^{*})$ を示せ。とくに $u$ が調和なら $K[u]$ も調和。
2. $R_{0}>0$ とし、$u$ を $\{|x|>R_{0}\}$ の調和関数で、$|x|\to\infty$ のとき $u(x)\to0$ となるものとする。極限 $c\defeq\lim_{|x|\to\infty}|x|^{n-2}u(x)$ が存在し、定数 $C$ があって $|x|\ge2R_{0}$ で $\bigl|u(x)-c|x|^{2-n}\bigr|\le C|x|^{1-n}$ となることを示せ。
3. $u(x)=\Phi(x-b)$（$|b|<R_{0}$）と $u(x)=x_{1}|x|^{-n}$ について $c$ を求めよ。
:::

::: solution
**1.** $r\defeq|x|$、$w(x)\defeq u(x^{*})$ とおく。$x\mapsto x^{*}$ は $\mathbb{R}^{n}\setminus\{0\}$ の $C^{\infty}$ 級の対合（$(x^{*})^{*}=x$）で $U^{*}$ は開集合。連鎖律から、$u_{j}\defeq(\partial_{j}u)(x^{*})$ と書いて
$$
\begin{aligned}
\partial_{i}w&=\sum_{j}u_{j}\,\partial_{i}\Bigl(\frac{x_{j}}{r^{2}}\Bigr)\\
&=\sum_{j}u_{j}\Bigl(\frac{\delta_{ij}}{r^{2}}-\frac{2x_{i}x_{j}}{r^{4}}\Bigr),\qquad x\cdot\nabla w\\
&=-\frac{x\cdot(\nabla u)(x^{*})}{r^{2}}.
\end{aligned}
$$
$Q\defeq(\delta_{ij}-2x_{i}x_{j}/r^{2})_{ij}$ は直交行列（$Q^{2}=I$, 対称）なので、2 階の部分は $\sum_{i}\sum_{j,k}(\partial_{j}\partial_{k}u)(x^{*})\,r^{-4}Q_{ij}Q_{ik}=r^{-4}(\Delta u)(x^{*})$。残りは $\sum_{j}u_{j}\Delta(x_{j}r^{-2})$ で、記法の節の公式から $\Delta r^{-2}=-2(n-4)r^{-4}$、$\nabla r^{-2}=-2xr^{-4}$ なので
$$
\Delta(x_{j}r^{-2})=x_{j}\Delta r^{-2}+2\partial_{j}r^{-2}=-2(n-2)x_{j}r^{-4}.
$$
よって $\Delta w=r^{-4}(\Delta u)(x^{*})-2(n-2)r^{-4}\,x\cdot(\nabla u)(x^{*})$。$\Delta(r^{2-n})=0$、$\nabla r^{2-n}=(2-n)r^{-n}x$ から
$$
\begin{aligned}
\Delta(r^{2-n}w)&=2(2-n)r^{-n}\,x\cdot\nabla w+r^{2-n}\Delta w\\
&=r^{-n-2}(\Delta u)(x^{*})+\bigl(2(n-2)-2(n-2)\bigr)r^{-n-2}x\cdot(\nabla u)(x^{*}),
\end{aligned}
$$
最後の項は消える。

**2.** $\{|x|>R_{0}\}^{*}=B(0,1/R_{0})\setminus\{0\}$ なので、1 から $v\defeq K[u]$ はそこで調和。$\frac{v(x)}{\Phi(x)}=n(n-2)\omega_{n}u(x^{*})\to0$（$x\to0$ で $|x^{*}|\to\infty$）なので、\ref{pde:gf-removable-singularity} から $B(0,1/R_{0})$ の調和関数 $\tilde v$ で $v$ の延長になるものがある。$K$ は対合（$K[K[u]]=u$）なので $u(x)=|x|^{2-n}\tilde v(x^{*})$、つまり $|x|^{n-2}u(x)=\tilde v(x^{*})\to\tilde v(0)\eqdef c$。$\tilde v$ は $\overline{B}(0,\frac{1}{2R_{0}})$ の近傍で $C^{1}$ 級なので、凸集合上の平均値の不等式（\tref{calc:mean-value-inequality}）から $|\tilde v(z)-\tilde v(0)|\le C|z|$（$|z|\le\frac{1}{2R_{0}}$、$C=\max|\nabla\tilde v|$）。$|x|\ge2R_{0}$ なら $z=x^{*}$, $|z|=|x|^{-1}$ として
$$
\bigl|u(x)-c|x|^{2-n}\bigr|=|x|^{2-n}|\tilde v(x^{*})-\tilde v(0)|\le C|x|^{1-n}.
$$

**3.** $\Phi(x-b)\to0$ で、$|x|^{n-2}\Phi(x-b)=\frac{1}{n(n-2)\omega_{n}}\frac{|x|^{n-2}}{|x-b|^{n-2}}\to\frac{1}{n(n-2)\omega_{n}}$。$x_{1}|x|^{-n}=\frac{1}{2-n}\partial_{1}(|x|^{2-n})$ は \ref{pde:harmonic-derivatives} から $\mathbb{R}^{n}\setminus\{0\}$ で調和で、$|x_{1}|x|^{-n}|\le|x|^{1-n}\to0$、$|x|^{n-2}x_{1}|x|^{-n}=x_{1}/|x|^{2}\to0$ なので $c=0$。このとき 2 は $|u|\le C|x|^{1-n}$ という速い減衰を与え、実際その通りである。
:::

## ペロンの方法と障壁 {#pde:sec-pr-exercises}

対応するページ：\ref{pde:page-perron}、\ref{pde:page-perron-irregular}

::: problem ★ 基本：劣調和関数の判定と簡単な障壁 {#pde:ex-pr-1}
1. $u\in C^{2}(\Omega)$ が劣調和であるための必要十分条件は $\Omega$ で $\Delta u\ge0$ であることを示せ。
2. $n\ge2$ とし、$\mathbb{R}^{n}\setminus\{0\}$ の上の $|x|^{a}$ が劣調和になる実数 $a$ をすべて求めよ。$\log(1+|x|^{2})$ は $\mathbb{R}^{n}$ で劣調和か。
3. $\Omega=B(0,1)$, $\xi\in\partial\Omega$ について $w(x)\defeq1-x\cdot\xi$ が障壁であることを示せ。$\Omega=(0,1)^{2}$ について、$\xi=(0,0)$ では $w(x)\defeq x_{1}+x_{2}$ が障壁であること、$\xi=(0,\frac12)$ では $w(x)\defeq x_{1}$ が障壁でないことを示し、$\xi=(0,\frac12)$ の障壁を \ref{pde:barrier-exterior-sphere} で作れ。
:::

::: solution
**1.** 十分性は \ref{pde:subharmonic-equivalent} の後の例 2。必要性：ある $x$ で $\Delta u(x)<0$ なら、連続性から $r_{0}>0$ があって $\overline{B}(x,r_{0})\subset\Omega$ の上で $\Delta u<0$。\ref{pde:mean-value-property.1} から $\varphi(r)\defeq S_{r}u(x)$ は $(0,r_{0}]$ で $\varphi'(r)=\frac rnA_{r}(\Delta u)(x)<0$、$\varphi$ は $[0,r_{0}]$ で連続（\ref{pde:means-relation.1}）なので、平均値の定理から $S_{r_{0}}u(x)=\varphi(r_{0})<\varphi(0)=u(x)$。これは \ref{pde:subharmonic-equivalent.3} に反する。

**2.** 記法の節の公式から $\Delta|x|^{a}=a(a+n-2)|x|^{a-2}$。1 から、劣調和 $\iff a(a+n-2)\ge0\iff a\ge0$ または $a\le2-n$（$n=2$ ではすべての $a$）。$g(r)=\log(1+r^{2})$ では $g'=\frac{2r}{1+r^{2}}$, $g''=\frac{2-2r^{2}}{(1+r^{2})^{2}}$ で
$$
\Delta\log(1+|x|^{2})=\frac{2-2r^{2}+2(n-1)(1+r^{2})}{(1+r^{2})^{2}}=\frac{2n+(2n-4)r^{2}}{(1+r^{2})^{2}}>0
$$
（$r>0$。$r=0$ でも多項式の計算で $2n>0$）。よって劣調和。

**3.** $w=1-x\cdot\xi$ は 1 次関数なので調和、したがって優調和（\ref{pde:subharmonic-equivalent} の後の例 1）。$|x|<1$ なら $x\cdot\xi<1$ で $w>0$、$x\to\xi$ で $w\to0$。$|x-\xi|^{2}=|x|^{2}-2x\cdot\xi+1<2w$ なので、$|x-\xi|\ge\delta$ なら $w>\frac{\delta^{2}}{2}$。よって障壁。

正方形で $\xi=0$：$x_{1}+x_{2}$ は調和で $\Omega$ で正、$x\to0$ で $0$ に近づき、$x_{1},x_{2}>0$ から $x_{1}+x_{2}\ge|x|$ なので $|x|\ge\delta$ で $w\ge\delta$。$\xi=(0,\frac12)$：$w=x_{1}$ は $(\varepsilon,\frac14)$（$\varepsilon\to0$）で $0$ に近づくが $|x-\xi|\ge\frac14$ なので、\ref{pde:barrier.3} の下限が $0$ になり障壁でない。開円板 $B((-1,\frac12),1)$ は $\Omega$ と交わらず $\xi$ で接するので、\ref{pde:barrier-exterior-sphere} から $y=(-\frac12,\frac12)$, $R=\frac12$ として
$$
w(x)=\Psi(\tfrac12)-\Psi(|x-y|)=\frac{1}{2\pi}\log\bigl(2|x-y|\bigr)
$$
が $\overline{\Omega}\setminus\{\xi\}$ で正、$\xi$ で $0$ の調和関数で、$\xi$ の障壁を与える（連続性とコンパクト性から \ref{pde:barrier.3} の下限は正）。
:::

::: problem ★★ 標準：平面の外部錐条件の平方根の障壁 {#pde:ex-pr-2}
$n=2$ とし、有界な開集合 $\Omega$ と $\xi\in\partial\Omega$ について $C(\xi,e,\beta,\rho)\cap\Omega=\varnothing$（\ref{pde:exterior-cone-condition}）とする。$z\defeq x-\xi$ として
$$
w(x)\defeq\sqrt{\frac{|z|-z\cdot e}{2}}
$$
とおく。
1. $w$ は $\mathbb{R}^{2}$ で連続で、半直線 $\{\xi+se:s\ge0\}$ の外で $C^{\infty}$ 級かつ調和であることを示せ。
2. $x\neq\xi$, $z\cdot e<|z|\cos\beta$ なら $w(x)>|z|^{1/2}\sin\frac\beta2$ を示し、$w$ が $\Omega\cap B(\xi,\rho)$ の上の局所的な障壁（\ref{pde:barrier-local}）であることを示せ。
3. 2 の指数 $\frac12$ を、\ref{pde:barrier-exterior-cone} の $\alpha$（$n=2$）と $\beta=\frac\pi4$ で比べよ。また $\Omega=B(0,1)\setminus\{(s,0):0\le s<1\}$（切れ目のある円板）と $\xi=0$, $e=e_{1}$ では、$w$ は障壁にならないことを説明せよ。
:::

::: solution
**1.** $q\defeq\frac{|z|-z\cdot e}{2}\ge0$ は連続で、$q=0$ となるのは $z\cdot e=|z|$、つまり $z$ が半直線 $\{se:s\ge0\}$ の上にあるときだけ。その外では $|z|>0$ で $q>0$ なので $w=q^{1/2}$ は $C^{\infty}$ 級。$\nabla q=\frac12(\frac{z}{|z|}-e)$、$|\nabla q|^{2}=\frac14(2-\frac{2z\cdot e}{|z|})=\frac{q}{|z|}$、$\Delta q=\frac12\Delta|z|=\frac{1}{2|z|}$（$n=2$ で $\Delta|z|=\frac{n-1}{|z|}$）。よって
$$
\Delta q^{1/2}=\frac12q^{-1/2}\Delta q-\frac14q^{-3/2}|\nabla q|^{2}=\frac{q^{-1/2}}{4|z|}-\frac{q^{-1/2}}{4|z|}=0.
$$

**2.** $z\cdot e<|z|\cos\beta$ なら $q>\frac{|z|(1-\cos\beta)}{2}=|z|\sin^{2}\frac\beta2$ で主張の不等式を得る。$x\in\Omega$, $|z|<\rho$ なら、$x\notin C(\xi,e,\beta,\rho)$ なので $z\cdot e<|z|\cos\beta$（そうでなければ $x$ は錐に入る）。とくに $x$ は半直線の上になく、$w$ は $\Omega_{\rho}\defeq\Omega\cap B(\xi,\rho)$ で調和、したがって優調和で、$w>0$。$w\le|z|^{1/2}\to0$（$x\to\xi$）、$|z|\ge\delta$ なら $w>\delta^{1/2}\sin\frac\beta2>0$。\ref{pde:barrier-local} から $\xi$ は正則。

**3.** $n=2$ では $\kappa=\frac12$、\ref{pde:barrier-exterior-cone} の $f(t)=1-\log(1-c)+\log(1-t)$ は減少なので $F=f(-1)=1+\log\frac{2}{1-c}$、$\alpha=\frac{1}{2(1+\log\frac{2}{1-c})}$。$\beta=\frac\pi4$（$c=\frac{1}{\sqrt2}$）では $\alpha\approx0.171$ で、$\frac12$ より小さい。一般次元の証明が係数の評価で指数を犠牲にしているのに対し、平面では $\operatorname{Re}\sqrt{\cdot}$ に当たる調和関数がそのまま使える（$\beta$ によらず指数 $\frac12$）。切れ目のある円板では、$\Omega$ の点が半直線 $\{s e_{1}:0<s<1\}$ にいくらでも近づけて、そこで $w\to0$ なので、$|x|\ge\delta$ での下限が $0$ になり \ref{pde:barrier.3} が成り立たない（外部錐条件は $\beta>0$ を要求していることに当たる。この領域の原点の正則性は別の障壁で示される：\see{pde:prob-pr-slit}）。
:::

::: problem ★★ 標準：円環のディリクレ問題と孤立した境界点 {#pde:ex-pr-3}
$n\ge2$ とする。
1. $0<a<1$、$A_{a}\defeq\{a<|x|<1\}$ とし、境界値を $|x|=a$ で $1$、$|x|=1$ で $0$ とするディリクレ問題の古典解が
$$
u_{a}(x)=\frac{\Psi(|x|)-\Psi(1)}{\Psi(a)-\Psi(1)}
$$
だけであることを示せ。
2. $x\neq0$ を固定すると $a\to0$ で $u_{a}(x)\to0$ を示し、$|x|=\frac12$ での値を $n=2$ と $n=3$ で比べよ。
3. $\Omega$ を空でない有界な開集合、$\xi\in\partial\Omega$ を孤立した境界点（ある $\rho>0$ で $B(\xi,\rho)\cap\partial\Omega=\{\xi\}$）とする。$g(\xi)\defeq1$、$g\defeq0$（$\partial\Omega\setminus\{\xi\}$）とおくと、ペロン関数は $u_{g}\equiv0$ で、$\xi$ は正則でないことを示せ。
:::

::: solution
**1.** $\Phi$ は $\mathbb{R}^{n}\setminus\{0\}$ で調和（\ref{pde:gf-fundamental-properties.1}）なので $u_{a}$ は $\overline{A_{a}}$ の近傍で調和、境界で所定の値をとる。一意性は \ref{pde:dirichlet-uniqueness.1}。具体的には $n=2$ で $u_{a}=\frac{\log|x|}{\log a}$、$n\ge3$ で $u_{a}=\frac{|x|^{2-n}-1}{a^{2-n}-1}$。

**2.** $a\to0$ で $\Psi(a)\to\infty$ なので $u_{a}(x)\to0$。$|x|=\frac12$ では $n=2$ で $\frac{\log2}{\log(1/a)}$、$n=3$ で $\frac{1}{a^{-1}-1}=\frac{a}{1-a}$。平面では内側の穴の影響は $1/\log(1/a)$ でしか消えず、ずっと遅い。穴が点になった極限では、境界の点 $0$ の値は内部に伝わらない（\see{pde:perron-punctured-ball}）。

**3.** $\partial\Omega\setminus\{\xi\}\subset\{|\eta-\xi|\ge\rho\}$ なので $g\in C(\partial\Omega)$。定数 $0$ は下関数なので $u_{g}\ge0$。$d\defeq\max\{1,\operatorname{diam}\Omega\}$ とし、$\varepsilon>0$ について $b_{\varepsilon}(x)\defeq\varepsilon\bigl(\Phi(x-\xi)-\Psi(d)\bigr)$ とおく。$\xi\notin\Omega$ なので $b_{\varepsilon}$ は $\Omega$ の近傍 $\mathbb{R}^{n}\setminus\{\xi\}$ で調和、$x\in\overline{\Omega}$ では $|x-\xi|\le d$ と $\Psi$ の単調性から $b_{\varepsilon}\ge0$、$x\to\xi$ で $b_{\varepsilon}\to+\infty$。$v\in\mathcal{S}_{g}$ をとる。$v\le\sup g=1$（\ref{pde:perron-family-properties.1}）なので $\limsup_{x\to\xi}(v-b_{\varepsilon})=-\infty$、$\eta\in\partial\Omega\setminus\{\xi\}$ では $b_{\varepsilon}$ が $\eta$ で連続なので $\limsup_{x\to\eta}(v-b_{\varepsilon})\le g(\eta)-b_{\varepsilon}(\eta)\le0$。\ref{pde:subharmonic-comparison.1} から $\Omega$ の上で $v\le b_{\varepsilon}$。$x$ を固定して $\varepsilon\to0$ とすると $v(x)\le0$。よって $u_{g}\equiv0$ で、$x\to\xi$ のとき $u_{g}\to0\neq g(\xi)$ なので、\ref{pde:barrier-regular} から $\xi$ は正則でない。$\rho$ の大きさは使わず、$g$ の連続性のためだけに孤立性を使った。
:::
