# トーラスの尺度と係数の凍結 {#gl:page-frozen-coefficients keywords="Sobolev scale of all integer orders on the torus, multiplication by smooth functions, Peetre inequality, freezing coefficients, local elliptic estimate, local elliptic regularity by difference quotients, transplanting small balls to the torus"}

前のページ \ref{gl:page-ellipticity} では、トーラスの上の定数係数の楕円型作用素について、フーリエ係数を使って評価 $\|u\|_{H^{s+k}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$ を示した。このページと次のページで、それを閉多様体の上の一般の（変数係数の、ベクトル束の間の）楕円型作用素に広げる。方法は古典的な**係数の凍結**である。台の小さな切断を座標で見ると、作用素はほとんど一点で係数を止めた定数係数の作用素で、その差は「最高階では係数の連続性から小さく、下の階数では一段弱いノルムで抑えられる」。このページでは、その局所的な部分を扱う。弱解の正則性には負の階数のノルムが現れるので、まずトーラスの上ですべての整数階のソボレフ・ノルムを係数列の重みとして定め、滑らかな関数を掛ける作用素の評価を示す。次に凍結した作用素の評価から局所的な楕円型評価と、差分商による局所的な正則性を示し、座標近傍の小さな球をトーラスへ移す手続きを整える。1 の分割による貼り合わせ（閉多様体上の楕円型評価）は次のページで行う。

## 記法と定義の確認 {#gl:sec-er-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（$n\ge1$）、$g$ はリーマン計量、$\mu_{g}$ はリーマン測度（\ref{gl:riemannian-measure}）。$E$, $F$ は $M$ の上のベクトル束で、複素係数の約束（$E$ を $E^{\mathbb{C}}$ に置き換え、係数は複素行列）は \ref{gl:sec-ps-notation} のとおり。以下 $E^{\mathbb{C}}$ も $E$ と書く。
- 切断のソボレフ空間 $H^{s}(M;E)$（$s\ge0$ は整数）は \ref{gl:sobolev-sections} で、複素の切断については実部と虚部がともに $H^{s}$ に入ることと定める。ノルム $\|\cdot\|_{H^{s}}$ は一つ固定した局所化のデータで測り、基本性質（切り出しと貼り付け、完備性、稠密性、$H^{0}=L^{2}$）は \ref{gl:sobolev-sections-properties}。$E$ にファイバー計量を一つ固定し、$L^{2}(M;E)$ のノルムはそれで測る（\ref{gl:sobolev-sections-properties.4} から $\|\cdot\|_{H^{0}}$ と同値）。
- 微分作用素は \ref{gl:differential-operator-manifold.2}、ソボレフ空間の間の有界性と局所的な式は \ref{gl:differential-operator-sobolev}。主表象は \ref{gl:principal-symbol}（約束は $\partial_{j}\mapsto i\xi_{j}$）、計算規則は \ref{gl:symbol-calculus}、楕円型作用素は \ref{gl:elliptic-operator}。楕円型なら $E$ と $F$ の階数は等しく、それを $r$ と書く。
- トーラス $T^{n}$、$p(z)=(e^{iz_{1}},\dots,e^{iz_{n}})$、座標近傍 $x_{a}$、ベクトル場 $D_{j}$、$e_{m}$（$m\in\mathbb{Z}^{n}$）、フーリエ係数 $\hat{u}(m)$ は \ref{gl:sec-nt-torus}、フーリエ級数の基本性質は \ref{gl:torus-fourier-basis}, \ref{gl:torus-sobolev}。$o\defeq p(0)$、$\mathbb{R}^{n}$ の開球を $B(0,\rho)$、閉球を $\bar{B}(0,\rho)$ とし、$\rho\le\pi$ について $W_{\rho}\defeq p(B(0,\rho))$ とおく。$Q\defeq(-\pi,\pi)^{n}$ の上で $p$ は単射で、その逆写像は $a=(-\pi,\dots,-\pi)$ の座標近傍 $x_{a}$ である。
- $\mathbb{R}^{n}$ 上の関数 $w$ で $Q$ の中のコンパクト集合の外で $0$ となるものについて、$T^{n}$ 上の関数 $\breve{w}$ を、$p(Q)$ の上で $\breve{w}(p(z))\defeq w(z)$、その外で $0$ と定める。これは \ref{gl:sec-sm-notation} の記法の $x_{a}^{*}w$ にほかならない。$w\in C_{c}^{\infty}(Q)$ なら $\breve{w}$ は滑らかである（$p(Q)$ の上では $x_{a}$ で見て $w$、$p(\operatorname{supp}w)$ の外では近傍で $0$）。
- $\mathbb{C}^{r}$ のノルムは $|v|$、行列の作用素ノルムは $\|A\|$、$\mathbb{C}^{r}$ の双線形な内積は $v\cdot v'\defeq\sum_{a}v_{a}v'_{a}$。多重指数 $\alpha$ について $K_{k}\defeq\#\{\alpha:|\alpha|=k\}$。
- $k\ge1$ は整数とする（$0$ 階の楕円型作用素はベクトル束の同型を掛ける作用素で、以下の主張は自明になる）。
- **選択公理**：局所化のデータと 1 の分割（\ref{mfd:smooth-partition-of-unity}）で従属選択公理（DC）を使う点は前の系列と同じ。点ごとに座標近傍や半径を選ぶところは、有限個の座標近傍から番号の最小のものをとり、半径は $2^{-l}$ の形の最大のものをとる、というように具体的に決めるので、新しい選択は使わない。
:::

## トーラスの上のすべての整数階の尺度 {#gl:sec-er-scale}

弱解 $u\in L^{2}$ から出発して $u\in H^{1}$, $H^{2}$, … と滑らかさを一段ずつ上げるとき、$k$ 階の作用素を施した $Pu$ は $H^{-k}$ 程度の対象になり、負の階数のノルムが避けられない。トーラスの上ではフーリエ係数の重みを負にするだけでそれが定義でき、作用素はすべて係数列の上の具体的な演算になる。

::: definition トーラスの係数空間 {#gl:torus-scale keywords="Sobolev scale of all integer orders on the torus defined by weighted l^2 norms of coefficient sequences; formal Fourier series; H^t for negative t" index="トーラスの係数空間|とーらすのけいすうくうかん, 形式的フーリエ級数|けいしきてきふーりえきゅうすう"}
$r\ge1$ と整数 $t$ について、$c\colon\mathbb{Z}^{n}\to\mathbb{C}^{r}$ で
$$
\|c\|_{(t)}^{2}\defeq\sum_{m\in\mathbb{Z}^{n}}(1+|m|^{2})^{t}\,|c(m)|^{2}<\infty
$$
となるものの全体を $\mathcal{H}^{t}$ と書き、$\mathcal{H}^{-\infty}\defeq\bigcup_{t\in\mathbb{Z}}\mathcal{H}^{t}$ とおく。$\mathcal{H}^{-\infty}$ の元を（$r$ 成分の）**形式的フーリエ級数**という。$t'\le t$ なら $\mathcal{H}^{t}\subset\mathcal{H}^{t'}$ で $\|c\|_{(t')}\le\|c\|_{(t)}$。
:::

::: intuition
関数をフーリエ係数の列だけで表し、高い周波数の係数に周波数の $2t$ 乗の重みを掛けた二乗和でその滑らかさを測る。$t$ が負なら重みは罰金ではなく割引になり、関数でない「粗い」対象（関数を何回か微分したもの）も同じ枠に入る。
:::

形式的フーリエ級数の上の演算を定める。$c\in\mathcal{H}^{-\infty}$、多重指数 $\alpha$、滑らかな行列値関数 $b\in C^{\infty}(T^{n};\mathbb{C}^{r'\times r})$、$h\in\mathbb{R}^{n}$ について
$$
\begin{aligned}
(D^{\alpha}c)(m)&\defeq(im)^{\alpha}c(m),\qquad(\tau_{h}c)(m)\defeq e^{im\cdot h}c(m),\\
(bc)(m)&\defeq\sum_{l\in\mathbb{Z}^{n}}\hat{b}(m-l)\,c(l)
\end{aligned}
$$
とし、$\Delta_{h}^{j}\defeq h^{-1}(\tau_{he_{j}}-1)$（$h\in\mathbb{R}\setminus\{0\}$、$e_{j}$ は標準基底）とおく。関数については $(\tau_{h}u)(p(z))\defeq u(p(z+h))$、$\Delta_{h}^{j}u\defeq h^{-1}(\tau_{he_{j}}u-u)$ である。滑らかな $b$ について $|b|_{N}\defeq\sum_{m}(1+|m|)^{N}\|\hat{b}(m)\|$（$N\ge0$）、$\|b\|_{\infty}\defeq\sup_{q\in T^{n}}\|b(q)\|$ とする。$\varphi\in C^{\infty}(T^{n};\mathbb{C}^{r})$ との**対合**を $\langle c,\varphi\rangle\defeq(2\pi)^{n}\sum_{m}c(m)\cdot\hat{\varphi}(-m)$ と定める。

::: lemma 係数空間の演算 {#gl:torus-scale-operations keywords="operations on formal Fourier series: L^2 functions and H^j functions correspond to H^(0) and H^(j); smooth functions have rapidly decreasing coefficients; products with smooth functions are convolutions of coefficients; Leibniz rule; translations; pairing with smooth functions" index="形式的フーリエ級数の演算|けいしきてきふーりえきゅうすうのえんざん"}
1. $u\mapsto\hat{u}$ は $L^{2}(T^{n})^{r}$ から $\mathcal{H}^{0}$ への線形な全単射で $\|\hat{u}\|_{(0)}=(2\pi)^{-n/2}\|u\|_{L^{2}}$。整数 $j\ge0$ について $u\in H^{j}(T^{n})^{r}\iff\hat{u}\in\mathcal{H}^{j}$ で、$\|\hat{u}\|_{(j)}$ と $\|u\|_{H^{j}}$ は同値。$|\alpha|\le j$ なら $\widehat{D^{\alpha}u}=D^{\alpha}\hat{u}$。
2. $b\in C^{\infty}(T^{n};\mathbb{C}^{r'\times r})$ なら、すべての $N$ で $|b|_{N}<\infty$。
3. $(bc)(m)$ の和は絶対収束し、$u\in L^{2}(T^{n})^{r}$ について $\widehat{bu}=b\hat{u}$。また $(ab)c=a(bc)$（$ab$ は関数の積）、$D_{j}(bc)=(D_{j}b)c+b(D_{j}c)$。
4. $u\in L^{2}$ について $\widehat{\tau_{h}u}=\tau_{h}\hat{u}$。また $\tau_{h}(bc)=(\tau_{h}b)(\tau_{h}c)$ で、$\Delta_{h}^{j}(bc)=(\Delta_{h}^{j}b)(\tau_{he_{j}}c)+b\,\Delta_{h}^{j}c$。
5. $u\in L^{2}$ なら $\langle\hat{u},\varphi\rangle=\int_{T^{n}}u\cdot\varphi\,d\mu_{g}$。$\langle D^{\alpha}c,\varphi\rangle=\langle c,(-D)^{\alpha}\varphi\rangle$。$b$ が $r'\times r$ 行列値なら $\langle bc,\varphi\rangle=\langle c,b^{\mathsf{T}}\varphi\rangle$（左辺は $r'$ 成分、右辺は $r$ 成分の対合）。すべての $\varphi$ について $\langle c,\varphi\rangle=0$ なら $c=0$。
:::

::: proof
**1.** \ref{gl:torus-fourier-basis.2} から $\{(2\pi)^{-n/2}e_{m}\}$ は $L^{2}(T^{n})$ の正規直交基底なので、成分ごとに \ref{fa:orthonormal-basis} を使うと、$\hat{u}$ は二乗総和可能で等式が成り立ち、逆に $c\in\mathcal{H}^{0}$ について $\sum_{m}c(m)e_{m}$ は $L^{2}$ で収束して、その係数は $c$ である。後半は \ref{gl:torus-sobolev} を成分ごとに使う。

**2.** $b$ の各成分はすべての $H^{j}(T^{n})$ に入るので（\ref{gl:sobolev-manifold} の後の注意）、\ref{gl:torus-sobolev.2} から $\sum_{m}(1+|m|^{2})^{j}|\hat{b}_{ab}(m)|^{2}<\infty$。$(1+|m|)^{N}\le2^{N/2}(1+|m|^{2})^{N/2}$ とコーシー–シュワルツの不等式から
$$
\sum_{m}(1+|m|)^{N}|\hat{b}_{ab}(m)|\le2^{N/2}\Bigl(\sum_{m}(1+|m|^{2})^{N+n}|\hat{b}_{ab}(m)|^{2}\Bigr)^{1/2}\Bigl(\sum_{m}(1+|m|^{2})^{-n}\Bigr)^{1/2},
$$
最後の和は $2n>n$ なので有限（\ref{gl:prob-nt-delta-torus} の解答の前半）。

**3.** $c\in\mathcal{H}^{t}$ なら $|c(l)|\le\|c\|_{(t)}(1+|l|^{2})^{-t/2}$ は $|l|$ の多項式で抑えられ、$\|\hat{b}(m-l)\|$ は 2 から $(1+|m-l|)^{-N}$ のどの $N$ についても定数倍で抑えられるので、和は絶対収束する。$u\in L^{2}$ について、成分 $a$ ごとに $(bu)_{a}=\sum_{c'}b_{ac'}u_{c'}\in L^{2}$ で、$w\defeq\overline{b_{ac'}}e_{m}$ について $\hat{w}(l)=\overline{\hat{b}_{ac'}(m-l)}$。正規直交基底による内積の展開（\ref{fa:orthonormal-basis}）から
$$
(2\pi)^{n}\widehat{b_{ac'}u_{c'}}(m)=\int u_{c'}\bar{w}\,d\mu_{g}=(2\pi)^{n}\sum_{l}\hat{u}_{c'}(l)\,\hat{b}_{ac'}(m-l).
$$
$c'$ について足せば $\widehat{bu}=b\hat{u}$。とくに滑らかな $a$, $b$ について $\widehat{ab}=a\hat{b}$ で、$((ab)c)(m)=\sum_{l}\sum_{j}\hat{a}(m-j)\hat{b}(j-l)c(l)$ は絶対収束する二重和なので、和の順序を替えて $(a(bc))(m)$ に等しい。ライプニッツ則は $im_{j}=i(m_{j}-l_{j})+il_{j}$ を和の各項に使えば、$\widehat{D_{j}b}(q)=iq_{j}\hat{b}(q)$（\ref{gl:torus-fourier-basis.3}）から出る。

**4.** 周期関数の一周期の積分は始点によらないので、$z\mapsto z-h$ と置き換えて $\widehat{\tau_{h}u}(m)=(2\pi)^{-n}\int_{(0,2\pi)^{n}}u(p(z+h))e^{-im\cdot z}dz=e^{im\cdot h}\hat{u}(m)$。積の式は $e^{im\cdot h}=e^{i(m-l)\cdot h}e^{il\cdot h}$ を和の各項に使う。最後の式は $\tau_{he_{j}}(bc)-bc=(\tau_{he_{j}}b-b)(\tau_{he_{j}}c)+b(\tau_{he_{j}}c-c)$ を $h$ で割る。

**5.** 内積の展開を $\bar{\varphi}$ に使うと、$\overline{\widehat{\bar{\varphi}}(m)}=\hat{\varphi}(-m)$ から最初の等式が出る。$D^{\alpha}$ については、$\widehat{(-D)^{\alpha}\varphi}(-m)=(-1)^{|\alpha|}(-im)^{\alpha}\hat{\varphi}(-m)=(im)^{\alpha}\hat{\varphi}(-m)$ から $\langle D^{\alpha}c,\varphi\rangle=(2\pi)^{n}\sum_{m}(im)^{\alpha}c(m)\cdot\hat{\varphi}(-m)=\langle c,(-D)^{\alpha}\varphi\rangle$。積については、$\widehat{b^{\mathsf{T}}\varphi}(-l)=\sum_{m}\hat{b}(m-l)^{\mathsf{T}}\hat{\varphi}(-m)$（3 の積の式で和の変数を $-m$ と置いたもの）と、絶対収束する二重和の順序の入れ替えから。最後に $\varphi=e_{-m}\mathbf{e}_{a}$（$\mathbf{e}_{a}$ は標準基底）とすると $\langle c,\varphi\rangle=(2\pi)^{n}c_{a}(m)$。
:::

1 により、$L^{2}(T^{n})^{r}$ と $\mathcal{H}^{0}$、$H^{j}(T^{n})^{r}$ と $\mathcal{H}^{j}$（$j\ge0$）を同一視する。$D^{\alpha}$ は $\mathcal{H}^{t}$ から $\mathcal{H}^{t-|\alpha|}$ へノルム $1$ 以下で写し（$|m^{\alpha}|\le|m|^{|\alpha|}\le(1+|m|^{2})^{|\alpha|/2}$）、$\tau_{h}$ は各 $\mathcal{H}^{t}$ の等長写像である。$\mathcal{H}^{t}$ のどの元も、$\mathcal{H}^{0}$ の元（すなわち $L^{2}$ 関数）に $D^{\alpha}$ たちを施したものの和として書ける（$t<0$ なら $(1+|m|^{2})^{-t}=\sum_{|\alpha|\le-t}c_{\alpha}m^{2\alpha}$ と多項定理で分ければよい）ので、形式的フーリエ級数は「$L^{2}$ 関数を有限回微分したもの」を具体的に表したものである。

::: lemma 滑らかな関数を掛ける評価 {#gl:torus-multiplication-estimate keywords="Peetre inequality 1 + |y|^2 <= 2 (1 + |y - l|^2)(1 + |l|^2); multiplication by a smooth function is bounded on every H^(t); the leading term is controlled by the sup norm: ||b c||_(t) <= ||b||_infty ||c||_(t) + C ||c||_(t-1)" index="ピートルの不等式|ぴーとるのふとうしき, 滑らかな関数を掛ける評価|なめらかなかんすうをかけるひょうか"}
$b\in C^{\infty}(T^{n};\mathbb{C}^{r'\times r})$、$t\in\mathbb{Z}$、$c\in\mathcal{H}^{t}$ とする。
1. 実数 $\sigma$ と $y,l\in\mathbb{R}^{n}$ について $(1+|y|^{2})^{\sigma}\le2^{|\sigma|}(1+|y-l|^{2})^{|\sigma|}(1+|l|^{2})^{\sigma}$。
2. $\|bc\|_{(t)}\le2^{|t|/2}|b|_{|t|}\,\|c\|_{(t)}$。
3. $\|bc\|_{(t)}\le\|b\|_{\infty}\|c\|_{(t)}+|t|\,2^{|t-1|/2}|b|_{|t-1|+1}\,\|c\|_{(t-1)}$。
:::

::: proof
数列 $a\ge0$, $d\ge0$ について $\|a*d\|_{\ell^{2}}\le\|a\|_{\ell^{1}}\|d\|_{\ell^{2}}$（$(a*d)(m)\defeq\sum_{l}a(m-l)d(l)$）を使う。これはコーシー–シュワルツの不等式 $(\sum_{l}a(m-l)d(l))^{2}\le\|a\|_{\ell^{1}}\sum_{l}a(m-l)d(l)^{2}$ を $m$ について足し、和の順序を替えれば出る。

**Step 1.** 【主張：1】$|y|\le|y-l|+|l|$ と $2|y-l||l|\le|y-l|^{2}+|l|^{2}$ から $|y|^{2}\le2|y-l|^{2}+2|l|^{2}$、よって $1+|y|^{2}\le1+2|y-l|^{2}+2|l|^{2}\le2(1+|y-l|^{2})(1+|l|^{2})$。$\sigma\ge0$ ならこれを $\sigma$ 乗する。$\sigma<0$ なら $y$ と $l$ の役を入れ替えた $1+|l|^{2}\le2(1+|l-y|^{2})(1+|y|^{2})$ を $|\sigma|$ 乗して整理する。

**Step 2.** 【主張：2】1 を $\sigma=t/2$、$(y,l)=(m,l)$ に使い、$(1+|q|^{2})^{1/2}\le1+|q|$ を使うと
$$
(1+|m|^{2})^{t/2}|(bc)(m)|\le2^{|t|/2}\sum_{l}(1+|m-l|)^{|t|}\|\hat{b}(m-l)\|\,(1+|l|^{2})^{t/2}|c(l)|.
$$
右辺は $a(q)\defeq(1+|q|)^{|t|}\|\hat{b}(q)\|$ と $d(l)\defeq(1+|l|^{2})^{t/2}|c(l)|$ のたたみ込みなので、冒頭の不等式から結論が出る。

**Step 3.** 【主張：$f(y)\defeq(1+|y|^{2})^{t/2}$ について $|f(m)-f(l)|\le|t|\,2^{|t-1|/2}|m-l|(1+|m-l|)^{|t-1|}(1+|l|^{2})^{(t-1)/2}$】$\nabla f(y)=t\,y\,(1+|y|^{2})^{t/2-1}$ で $|y|\le(1+|y|^{2})^{1/2}$ なので $|\nabla f(y)|\le|t|(1+|y|^{2})^{(t-1)/2}$。平均値の定理から $|f(m)-f(l)|\le|m-l|\sup_{y\in[l,m]}|\nabla f(y)|$ で、線分 $[l,m]$ の上の $y$ は $|y-l|\le|m-l|$ なので、1（$\sigma=(t-1)/2$）から $(1+|y|^{2})^{(t-1)/2}\le2^{|t-1|/2}(1+|m-l|)^{|t-1|}(1+|l|^{2})^{(t-1)/2}$。

**Step 4.** 【主張：3】$\Lambda c(l)\defeq(1+|l|^{2})^{t/2}c(l)$ とおくと $\Lambda c\in\mathcal{H}^{0}$、$\|\Lambda c\|_{(0)}=\|c\|_{(t)}$ で、
$$
(1+|m|^{2})^{t/2}(bc)(m)=(b\,\Lambda c)(m)+\sum_{l}\hat{b}(m-l)\bigl(f(m)-f(l)\bigr)c(l).
$$
第一項：\ref{gl:torus-scale-operations.1} から $\Lambda c=\hat{G}$ となる $G\in L^{2}(T^{n})^{r}$ があり、\ref{gl:torus-scale-operations.3} から $b\Lambda c=\widehat{bG}$。各点で $|b(q)G(q)|\le\|b\|_{\infty}|G(q)|$ なので
$$
\|b\Lambda c\|_{(0)}=(2\pi)^{-n/2}\|bG\|_{L^{2}}\le(2\pi)^{-n/2}\|b\|_{\infty}\|G\|_{L^{2}}=\|b\|_{\infty}\|c\|_{(t)}.
$$
第二項：Step 3 から、各項の大きさは $|t|2^{|t-1|/2}\,a(m-l)\,d(l)$ 以下、ただし $a(q)\defeq|q|(1+|q|)^{|t-1|}\|\hat{b}(q)\|$, $d(l)\defeq(1+|l|^{2})^{(t-1)/2}|c(l)|$。$\|a\|_{\ell^{1}}\le|b|_{|t-1|+1}$, $\|d\|_{\ell^{2}}=\|c\|_{(t-1)}$ なので、冒頭の不等式から第二項の $\ell^{2}$ ノルムは $|t|2^{|t-1|/2}|b|_{|t-1|+1}\|c\|_{(t-1)}$ 以下。三角不等式から 3 が出る。

::: hypcheck
- **$b$ が滑らか**：$|b|_{N}<\infty$（\ref{gl:torus-scale-operations.2}）として、2 と 3 の第二項に使った。3 の第一項は $\|b\|_{\infty}$ だけで済み、これが係数の凍結で「小さな係数を掛けても小さい」ことを保証する。
- **第二項は外せない**：$t\neq0$ では $\|bc\|_{(t)}\le\|b\|_{\infty}\|c\|_{(t)}$ だけでは一般に偽（\ref{gl:prob-er-multiplication}）。
- **公理**：選択は使わない。
:::
:::

## 係数の凍結と局所評価 {#gl:sec-er-local}

この節では、$T^{n}$ の上の変数係数の作用素
$$
\breve{P}\defeq\sum_{|\alpha|\le k}B_{\alpha}D^{\alpha},\qquad B_{\alpha}\in C^{\infty}(T^{n};\mathbb{C}^{r\times r}),
$$
を $\mathcal{H}^{-\infty}$ に作用させる（$\breve{P}c\defeq\sum_{\alpha}B_{\alpha}(D^{\alpha}c)$）。\ref{gl:torus-multiplication-estimate.2} から $\breve{P}$ は $\mathcal{H}^{t+k}$ から $\mathcal{H}^{t}$ への有界線形写像である。$c\in\mathcal{H}^{-\infty}$ が**開集合 $W\subset T^{n}$ の外で $0$** であるとは、台が $W$ に含まれる $\chi\in C^{\infty}(T^{n})$ で $c=\chi c$ となるものがあることをいう（$L^{2}$ 関数 $u$ が $W$ の中のコンパクト集合 $K$ の外で a.e. $0$ なら、$K$ の近傍で $1$ となる $\chi$ について $u=\chi u$ なので、$\hat{u}$ は $W$ の外で $0$）。

::: lemma 凍結した作用素の評価 {#gl:frozen-estimate keywords="constant coefficient homogeneous elliptic operator on the torus scale: ||c||_(t+k) <= 2^{k/2} c_0^{-1} ||P_0 c||_(t) + ||c||_(t+k-1) for every integer t" index="凍結した作用素の評価|とうけつしたさようそのひょうか"}
$A_{\alpha}\in\mathbb{C}^{r\times r}$（$|\alpha|=k$）を定数とし、$\sigma_{0}(\xi)\defeq\sum_{|\alpha|=k}A_{\alpha}(i\xi)^{\alpha}$ がすべての $\xi\in\mathbb{R}^{n}\setminus\{0\}$ で可逆とする。$c_{0}>0$ を、すべての $\xi\in\mathbb{R}^{n}$, $v\in\mathbb{C}^{r}$ で $|\sigma_{0}(\xi)v|\ge c_{0}|\xi|^{k}|v|$ となる定数とする（\ref{gl:torus-elliptic-estimate} の証明の Step 1 から存在する）。$P_{0}\defeq\sum_{|\alpha|=k}A_{\alpha}D^{\alpha}$ は $(P_{0}c)(m)=\sigma_{0}(m)c(m)$ を満たし、すべての整数 $t$ と $c\in\mathcal{H}^{t+k}$ について
$$
\|c\|_{(t+k)}\le2^{k/2}c_{0}^{-1}\|P_{0}c\|_{(t)}+\|c\|_{(t+k-1)}.
$$
:::

::: proof
定数行列 $A$ は $\hat{A}(0)=A$, $\hat{A}(q)=0$（$q\neq0$）なので $(Ac)(m)=Ac(m)$、よって $(P_{0}c)(m)=\sum_{|\alpha|=k}A_{\alpha}(im)^{\alpha}c(m)=\sigma_{0}(m)c(m)$。$m\neq0$ なら $|m|\ge1$ なので $1+|m|^{2}\le2|m|^{2}$ で、
$$
(1+|m|^{2})^{t+k}|c(m)|^{2}\le2^{k}|m|^{2k}(1+|m|^{2})^{t}|c(m)|^{2}\le\frac{2^{k}}{c_{0}^{2}}(1+|m|^{2})^{t}|\sigma_{0}(m)c(m)|^{2}.
$$
$m=0$ の項は $(1+0)^{t+k}|c(0)|^{2}=(1+0)^{t+k-1}|c(0)|^{2}$。足し合わせて $\|c\|_{(t+k)}^{2}\le2^{k}c_{0}^{-2}\|P_{0}c\|_{(t)}^{2}+\|c\|_{(t+k-1)}^{2}$、$\sqrt{a+b}\le\sqrt{a}+\sqrt{b}$ から結論が出る。
:::

これは \ref{gl:torus-elliptic-estimate} の証明の Step 4 の計算を、斉次な作用素について、負の $t$ を含む係数空間でそのまま行ったものである。斉次なので低い周波数で崩れるのは $m=0$ の一項だけで、それを $\|c\|_{(t+k-1)}$ が引き受ける。

::: proposition 係数の凍結による局所評価 {#gl:local-elliptic-estimate keywords="freezing coefficients: for an operator elliptic at o, there is delta depending only on the ellipticity constant and the modulus of continuity of the top-order coefficients at o, not on t, such that ||c||_(t+k) <= C(||P c||_(t) + ||c||_(t+k-1)) for c vanishing outside a delta-ball" index="係数の凍結|けいすうのとうけつ, 局所的な楕円型評価|きょくしょてきなだえんがたひょうか"}
$\breve{P}=\sum_{|\alpha|\le k}B_{\alpha}D^{\alpha}$ について、$\sigma_{0}(\xi)\defeq\sum_{|\alpha|=k}B_{\alpha}(o)(i\xi)^{\alpha}$ がすべての $\xi\neq0$ で可逆とし、$c_{0}$ を \ref{gl:frozen-estimate} の定数とする。$0<\delta\le1$ について
$$
\varepsilon(\delta)\defeq\max_{|\alpha|=k}\ \sup_{|z|<2\delta}\|B_{\alpha}(p(z))-B_{\alpha}(o)\|
$$
とおく。
1. $\varepsilon(\delta)\to0$（$\delta\to0$）なので、$\varepsilon(\delta)\le c_{0}/(2^{k/2+1}K_{k})$ となる $\delta\in(0,1]$ がある。この条件は $t$ を含まない。
2. 1 の条件を満たす $\delta$ と整数 $t$ について、定数 $C$ があって、$W_{\delta}$ の外で $0$ となるすべての $c\in\mathcal{H}^{t+k}$ について
$$
\|c\|_{(t+k)}\le C\bigl(\|\breve{P}c\|_{(t)}+\|c\|_{(t+k-1)}\bigr).
$$
$C$ は $t$, $\delta$, $k$, $c_{0}$、係数 $B_{\alpha}$（$|B_{\alpha}|_{N}$ を通して）と、証明で $\delta$ ごとに一つ固定する切り落とし $\theta$ で決まり、$c$ にはよらない。
:::

::: intuition
一点で楕円型な作用素は、その点の十分小さな近傍に台をもつ関数に対しては、係数をその点で止めた定数係数の作用素とほとんど同じに働く。だから定数係数の評価が、一段弱いノルムの誤差を足すだけで、そのまま成り立つ。近傍の大きさは、測る滑らかさの段数によらずに選べる。
:::

::: proof
**Step 1.** 【主張：1】$B_{\alpha}$ は連続なので、$\delta\to0$ のとき $\sup_{|z|<2\delta}\|B_{\alpha}(p(z))-B_{\alpha}(o)\|\to0$。条件の右辺は $c_{0}$, $k$, $n$ だけで決まる。

**Step 2.** 【主張：$W_{\delta}$ の外で $0$ となる $c$ について、$\breve{P}c=P_{0}c+\sum_{|\alpha|=k}b_{\alpha}D^{\alpha}c+\sum_{|\alpha|<k}B_{\alpha}D^{\alpha}c$。ただし $P_{0}\defeq\sum_{|\alpha|=k}B_{\alpha}(o)D^{\alpha}$、$b_{\alpha}\defeq\theta\,(B_{\alpha}-B_{\alpha}(o))$ で、$\|b_{\alpha}\|_{\infty}\le\varepsilon(\delta)$】\ref{fa:test-function-density.2} から $\theta_{0}\in C_{c}^{\infty}(B(0,2\delta))$ で $0\le\theta_{0}\le1$、$\bar{B}(0,\delta)$ の近傍で $\theta_{0}=1$ となるものを一つ固定し、$\theta\defeq\breve{\theta}_{0}$ とおく（$2\delta\le2<\pi$ なので定義できる）。$\theta$ は $W_{\delta}$ の上で $1$ で、台は $p(\bar{B}(0,2\delta))$ に含まれるので $\|b_{\alpha}\|_{\infty}\le\varepsilon(\delta)$。$c=\chi c$（$\operatorname{supp}\chi\subset W_{\delta}$）とすると、\ref{gl:torus-scale-operations.3} のライプニッツ則を繰り返して $D^{\alpha}c=\sum_{\gamma\le\alpha}\binom{\alpha}{\gamma}(D^{\gamma}\chi)(D^{\alpha-\gamma}c)$。$(1-\theta)D^{\gamma}\chi=0$（$D^{\gamma}\chi$ の台は $\operatorname{supp}\chi$ に含まれる）なので、積の結合法則から $(1-\theta)(B_{\alpha}-B_{\alpha}(o))D^{\alpha}c=0$。よって $(B_{\alpha}-B_{\alpha}(o))D^{\alpha}c=b_{\alpha}D^{\alpha}c$ で、$|\alpha|=k$ の項を $B_{\alpha}(o)D^{\alpha}c$ と $b_{\alpha}D^{\alpha}c$ に分ければ主張の式になる。

**Step 3.** 【主張：$\|P_{0}c\|_{(t)}\le\|\breve{P}c\|_{(t)}+K_{k}\varepsilon(\delta)\|c\|_{(t+k)}+C_{1}\|c\|_{(t+k-1)}$（$C_{1}$ は $t$, $\theta$, $B_{\alpha}$ で決まる）】Step 2 の式から $P_{0}c=\breve{P}c-\sum_{|\alpha|=k}b_{\alpha}D^{\alpha}c-\sum_{|\alpha|<k}B_{\alpha}D^{\alpha}c$。$|\alpha|=k$ の項は \ref{gl:torus-multiplication-estimate.3} から
$$
\|b_{\alpha}D^{\alpha}c\|_{(t)}\le\varepsilon(\delta)\|D^{\alpha}c\|_{(t)}+E_{\alpha}\|D^{\alpha}c\|_{(t-1)}\le\varepsilon(\delta)\|c\|_{(t+k)}+E_{\alpha}\|c\|_{(t+k-1)},
$$
$E_{\alpha}\defeq|t|2^{|t-1|/2}|b_{\alpha}|_{|t-1|+1}$。$|\alpha|<k$ の項は \ref{gl:torus-multiplication-estimate.2} から $\|B_{\alpha}D^{\alpha}c\|_{(t)}\le2^{|t|/2}|B_{\alpha}|_{|t|}\|c\|_{(t+|\alpha|)}\le2^{|t|/2}|B_{\alpha}|_{|t|}\|c\|_{(t+k-1)}$。三角不等式から主張が出る。

**Step 4.** 【主張：2】$c\in\mathcal{H}^{t+k}$ に \ref{gl:frozen-estimate}（$A_{\alpha}=B_{\alpha}(o)$）を使い、Step 3 を代入すると
$$
\|c\|_{(t+k)}\le\frac{2^{k/2}}{c_{0}}\|\breve{P}c\|_{(t)}+\frac{2^{k/2}K_{k}\varepsilon(\delta)}{c_{0}}\|c\|_{(t+k)}+\Bigl(1+\frac{2^{k/2}C_{1}}{c_{0}}\Bigr)\|c\|_{(t+k-1)}.
$$
1 の条件から右辺第二項の係数は $\frac12$ 以下で、$\|c\|_{(t+k)}<\infty$ なので左辺に移せる。$C\defeq2\max(2^{k/2}c_{0}^{-1},\,1+2^{k/2}C_{1}c_{0}^{-1})$ とすればよい。

::: hypcheck
- **一点 $o$ での楕円性**：Step 4 で \ref{gl:frozen-estimate} を使うのに使った。$o$ 以外での楕円性は使っていない（係数の連続性が近くの点での振る舞いを保証する）。
- **最高階の係数の連続性**：Step 1 で $\varepsilon(\delta)\to0$ に使った。下の階数の係数と $b_{\alpha}$ の滑らかさは、\ref{gl:torus-multiplication-estimate} を通して誤差を $\|c\|_{(t+k-1)}$ に押し込むのに使った。
- **台が小さいこと**：Step 2 で $b_{\alpha}$ を小さくするのに使った。台の制限を外すと、$o$ から離れた点では係数が凍結した値と違うので、評価は凍結の議論からは出ない（大域的な評価には各点での楕円性と 1 の分割が要る。\see{gl:elliptic-estimate}）。
- **公理**：選択は使わない（$\theta_{0}$ は一つ固定すればよく、$\delta$ は $2^{-l}$ の形の最大のものと決められる）。
:::
:::

次の命題が楕円正則性の局所的な核心で、差分商の一様な有界性から、係数空間での滑らかさを一段上げる。

::: proposition トーラスでの局所正則性 {#gl:local-regularity-torus keywords="local elliptic regularity on the torus scale by difference quotients: if c is in H^(tau), vanishes outside the delta/2-ball and Pc is in H^(tau-k+1), then c is in H^(tau+1); works for negative tau - k" index="差分商|さぶんしょう, 局所的な楕円正則性|きょくしょてきなだえんせいそくせい"}
$\breve{P}$ を \ref{gl:local-elliptic-estimate} の仮定を満たすもの、$\delta$ を \ref{gl:local-elliptic-estimate.1} の条件を満たすものとし、$\tau$ を整数とする。$c\in\mathcal{H}^{\tau}$ が $W_{\delta/2}$ の外で $0$ で、$\breve{P}c\in\mathcal{H}^{\tau-k+1}$ なら、$c\in\mathcal{H}^{\tau+1}$ で、$c$ によらない定数 $C$（$\tau$, $\delta$, $\breve{P}$ で決まる）について
$$
\|c\|_{(\tau+1)}\le C\bigl(\|\breve{P}c\|_{(\tau-k+1)}+\|c\|_{(\tau)}\bigr).
$$
:::

::: intuition
小さな近傍に台をもつ形式的フーリエ級数が楕円型作用素で写されて一段よくなるなら、それ自身も一段滑らかである。少しずらしたものとの差を測り、その大きさがずらし幅に比例して一様に抑えられることを、凍結した評価から導く。
:::

::: proof
$j\in\{1,\dots,n\}$ を固定し、$0<|h|<\delta/4$ とする。$\Delta_{h}\defeq\Delta_{h}^{j}$ の乗数 $h^{-1}(e^{ihm_{j}}-1)$ は大きさ $\min(2|h|^{-1},|m_{j}|)$ 以下（$|e^{i\theta}-1|\le|\theta|$）なので、$\Delta_{h}c\in\mathcal{H}^{\tau}$ で $\|\Delta_{h}c\|_{(\tau-1)}\le\|c\|_{(\tau)}$。

**Step 1.** 【主張：$\Delta_{h}c$ は $W_{\delta}$ の外で $0$】$c=\chi c$, $\operatorname{supp}\chi\subset W_{\delta/2}$ とする。$\operatorname{supp}\chi$ はコンパクトなので、ある $\rho<\delta/2$ について $p(\bar{B}(0,\rho))$ に含まれる。\ref{gl:torus-scale-operations.4} から $\Delta_{h}c=(\Delta_{h}\chi)(\tau_{he_{j}}c)+\chi\Delta_{h}c$ で、$\tau_{he_{j}}c=(\tau_{he_{j}}\chi)(\tau_{he_{j}}c)$。関数 $\tau_{he_{j}}\chi$, $\Delta_{h}\chi$ の台は $p(\bar{B}(0,\rho+|h|))\subset W_{3\delta/4}$ に含まれる。$\chi'_{0}\in C_{c}^{\infty}(B(0,\delta))$ で $\bar{B}(0,3\delta/4)$ の上で $1$ となるものをとり $\chi'\defeq\breve{\chi}'_{0}$ とすると、$\chi'$ は $\chi$, $\tau_{he_{j}}\chi$, $\Delta_{h}\chi$ に掛けても変えないので、結合法則から $\chi'\Delta_{h}c=\Delta_{h}c$。

**Step 2.** 【主張：$\|\breve{P}\Delta_{h}c\|_{(\tau-k)}\le\|\breve{P}c\|_{(\tau-k+1)}+G\|c\|_{(\tau)}$（$G$ は $h$ によらない）】$\Delta_{h}$ と $D^{\alpha}$ はどちらも係数ごとの掛け算なので交換し、\ref{gl:torus-scale-operations.4} から $\Delta_{h}(B_{\alpha}D^{\alpha}c)=(\Delta_{h}B_{\alpha})\tau_{he_{j}}(D^{\alpha}c)+B_{\alpha}D^{\alpha}\Delta_{h}c$。$\alpha$ について足して
$$
\breve{P}\Delta_{h}c=\Delta_{h}(\breve{P}c)-\sum_{|\alpha|\le k}(\Delta_{h}B_{\alpha})\,\tau_{he_{j}}(D^{\alpha}c).
$$
第一項は乗数の評価から $\|\Delta_{h}(\breve{P}c)\|_{(\tau-k)}\le\|\breve{P}c\|_{(\tau-k+1)}$。関数 $\Delta_{h}B_{\alpha}$ の係数は $h^{-1}(e^{ihq_{j}}-1)\hat{B}_{\alpha}(q)$ で、大きさは $|q_{j}|\|\hat{B}_{\alpha}(q)\|$ 以下なので $|\Delta_{h}B_{\alpha}|_{N}\le|B_{\alpha}|_{N+1}$。\ref{gl:torus-multiplication-estimate.2} と、$\tau_{he_{j}}$ が等長であることから
$$
\|(\Delta_{h}B_{\alpha})\tau_{he_{j}}(D^{\alpha}c)\|_{(\tau-k)}\le2^{|\tau-k|/2}|B_{\alpha}|_{|\tau-k|+1}\|D^{\alpha}c\|_{(\tau-k)}\le2^{|\tau-k|/2}|B_{\alpha}|_{|\tau-k|+1}\|c\|_{(\tau)}.
$$
$G\defeq\sum_{\alpha}2^{|\tau-k|/2}|B_{\alpha}|_{|\tau-k|+1}$ とすればよい。

**Step 3.** 【主張：$\sup_{0<|h|<\delta/4}\|\Delta_{h}^{j}c\|_{(\tau)}\le R\defeq C'\bigl(\|\breve{P}c\|_{(\tau-k+1)}+(G+1)\|c\|_{(\tau)}\bigr)$】Step 1 から $\Delta_{h}c\in\mathcal{H}^{\tau}$ は $W_{\delta}$ の外で $0$ なので、\ref{gl:local-elliptic-estimate.2} を $t=\tau-k$ で使える（その定数を $C'$ とする）。$\|\Delta_{h}c\|_{(\tau)}\le C'(\|\breve{P}\Delta_{h}c\|_{(\tau-k)}+\|\Delta_{h}c\|_{(\tau-1)})$ に Step 2 と冒頭の評価を入れる。

**Step 4.** 【主張：$c\in\mathcal{H}^{\tau+1}$ と評価】有限集合 $S\subset\mathbb{Z}^{n}$ について、$h\to0$ のとき $|h^{-1}(e^{ihm_{j}}-1)|^{2}\to m_{j}^{2}$ なので、Step 3 から
$$
\sum_{m\in S}(1+|m|^{2})^{\tau}m_{j}^{2}|c(m)|^{2}=\lim_{h\to0}\sum_{m\in S}(1+|m|^{2})^{\tau}\Bigl|\frac{e^{ihm_{j}}-1}{h}\Bigr|^{2}|c(m)|^{2}\le R^{2}.
$$
$S$ について上限をとり $j$ について足すと、$(1+|m|^{2})^{\tau+1}=(1+|m|^{2})^{\tau}(1+\sum_{j}m_{j}^{2})$ から $\|c\|_{(\tau+1)}^{2}\le\|c\|_{(\tau)}^{2}+nR^{2}<\infty$。$\sqrt{a+b}\le\sqrt{a}+\sqrt{b}$ で評価の形にする。

::: hypcheck
- **楕円性と台が小さいこと**：Step 3 で \ref{gl:local-elliptic-estimate} を使うのに使った。ずらし幅 $|h|<\delta/4$ と台 $W_{\delta/2}$ の余裕は、Step 1 でずらした後も $W_{\delta}$ に収まるように使った。
- **$\breve{P}c\in\mathcal{H}^{\tau-k+1}$**：Step 2 の第一項に使った。これが一段よいことが、差分商を一様に抑える源である。
- **係数の滑らかさ**：Step 2 で $\Delta_{h}B_{\alpha}$ を $h$ によらず抑えるのに使った（$|B_{\alpha}|_{N+1}<\infty$）。
- **$\tau$ は負でもよい**：$\tau-k$ が負のときに \ref{gl:local-elliptic-estimate} を負の階数で使うことが、この命題を $L^{2}$ の弱解から出発させるために要る。
- **公理**：選択は使わない（Step 4 は有限和の極限と上限だけ）。
:::
:::

::: supplement
**前提を変えると.** 楕円型でなければ結論は偽である。$T^{2}$ の波動作用素 $D_{1}^{2}-D_{2}^{2}$ では、$\mathfrak{g}(t_{1}+t_{2})$ の形の関数に切り落としを掛けたものは、作用素で写すと切り落としの微分から来る項しか残らないが、もとの関数は $H^{1}$ に入らない（\ref{gl:prob-el-wave-weak-solution} と同じ係数の計算）。差分商は特性方向 $(1,1)$ に沿ってずらしても一様に有界にならず、特異性は直線に沿って残る。

**似た定理.** 差分商の方法は、偏微分方程式論で $2$ 階の発散形の作用素の弱解の正則性を示す標準的な方法で、そこでは $\mathbb{R}^{n}$ の上で $\int|\Delta_{h}\nabla u|^{2}$ を強圧性で評価する。もう一つの標準的な方法は、軟化子（\ref{fa:mollifier}）$u\mapsto\eta_{\varepsilon}*u$ で滑らかにし、作用素との交換子が一様に一段低い階数であること（フリードリッヒスの補題）を使うものである。ここではトーラスの係数列の上で差分商を使ったので、平行移動と微分が対角化され、交換子の計算が \ref{gl:torus-scale-operations.4} の一行で済む。

**高い視点：揺すってみる.** 物体がどれだけ滑らかかは、少しずらして元と比べればわかる。ずらし幅 $h$ に対する変化が $h$ に比例して一様に小さいなら、物体は一段滑らかである。楕円型作用素は、ずらしたものの変化を「作用素を通した像の変化」と「ずらしで生じる係数の小さな揺れ」に分け、前者は一段よい $\breve{P}c$ から、後者は一段弱いノルムから抑える。像に死角がない（楕円性）ので、像の揺れが小さければ元の揺れも小さい。
:::


## 問題 {#gl:sec-er-problems}

::: problem {#gl:prob-er-multiplication}
$n=1$、$r=r'=1$ とし、整数 $q\neq0$ について $b\defeq e_{q}$（$b(p(z))=e^{iqz}$）とする。
1. $c\in\mathcal{H}^{t}$ について $(bc)(m)=c(m-q)$ を示し、$c=\delta_{0}$（$c(0)=1$、他は $0$）について $\|bc\|_{(t)}/\|c\|_{(t)}=(1+q^{2})^{t/2}$ を求めよ。とくに $t\ge1$ なら $\|bc\|_{(t)}\le\|b\|_{\infty}\|c\|_{(t)}$ は成り立たない。
2. 同じ $b$, $c$ について \ref{gl:torus-multiplication-estimate.3} の右辺を計算し、不等式が成り立っていることを $t=1$ で確かめよ。
:::

::: solution
**1.** $\hat{b}(j)=1$（$j=q$）、$0$（$j\neq q$）なので $(bc)(m)=\sum_{l}\hat{b}(m-l)c(l)=c(m-q)$。$c=\delta_{0}$ なら $bc=\delta_{q}$ で、$\|bc\|_{(t)}^{2}=(1+q^{2})^{t}$, $\|c\|_{(t)}^{2}=1$。$\|b\|_{\infty}=1$ なので、$t\ge1$ では $\|bc\|_{(t)}=(1+q^{2})^{t/2}>1=\|b\|_{\infty}\|c\|_{(t)}$。周波数 $0$ の定数関数に $e_{q}$ を掛けると周波数が $q$ に移り、重み $(1+q^{2})^{t}$ の分だけ大きく測られる。

**2.** $t=1$ では $|t|2^{|t-1|/2}=1$、$|b|_{1}=\sum_{j}(1+|j|)\|\hat{b}(j)\|=1+|q|$、$\|c\|_{(0)}=1$ なので、右辺は $1+(1+|q|)=2+|q|$。左辺は $(1+q^{2})^{1/2}\le1+|q|<2+|q|$ で成り立つ。第二項がなければ右辺は $1$ で、第二項が周波数の移動による増加を引き受けていることがわかる。
:::
