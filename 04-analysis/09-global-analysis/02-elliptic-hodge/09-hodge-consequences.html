# ホッジの定理の帰結 {#gl:page-hodge-consequences keywords="consequences of the Hodge theorem, Hodge star commutes with the Hodge Laplacian, Green operator and harmonic projection, Poincare duality for de Rham cohomology via harmonic forms, b_k = b_{n-k}, nondegenerate wedge pairing, Euler characteristic as the index of d + delta from even to odd forms, odd dimensional manifolds have Euler characteristic zero, harmonic forms on the flat torus are parallel, spheres have no harmonic forms in intermediate degrees, first Betti number of a closed oriented surface is even, conformal invariance of harmonic 1-forms on surfaces, signature of 4-manifolds, ポアンカレ双対性, オイラー標数, d+δ の指数, 平坦トーラスの調和形式, 球面の調和形式, 閉曲面のベッチ数"}

前のページ \ref{gl:page-hodge-theorem} では、向きづけられた閉リーマン多様体の上で、ド・ラーム・コホモロジーの各類が調和形式をただ一つ含むこと（\ref{gl:hodge-theorem}）を示した。このページでは、その帰結を調べる。まず、星作用素がラプラシアンと可換であることから、星作用素が $k$ 次と $n-k$ 次の調和形式を対応させ、ベッチ数の等式 $b_{k}=b_{n-k}$ と、ウェッジ積による対のコホモロジーでの非退化性（ド・ラーム・コホモロジーの**ポアンカレ双対性**）が出ることを示す。次に、偶数次から奇数次への $d+\delta$ が楕円型作用素で、その指数がオイラー標数に等しいことを示す。これは楕円型作用素の指数が位相不変量で表される最も簡単な例である。最後に、平坦トーラス・球面・閉曲面の調和形式を具体的に求める。

## 記法と定義の確認 {#gl:sec-ho-cons-notation}

::: notation
- $(M,g)$ は向きづけられた $n$ 次元の閉リーマン多様体（$n\ge1$）。$\Lambda^{k}$, $L^{2}(\Lambda^{k})$, $H^{s}(\Lambda^{k})$, $\Omega^{k}(M)$, $\Omega^{k}_{\mathbb{C}}(M)$、$L^{2}$ の内積 $(\cdot,\cdot)$、$d$, $\star$, $\delta$, $\Delta$、調和形式の空間 $\mathcal{H}^{k}\subset\mathcal{H}^{k}_{\mathbb{C}}$、ド・ラーム・コホモロジー $H^{k}_{\mathrm{dR}}(M)$ とベッチ数 $b_{k}(M)$ は \ref{gl:sec-ho-notation} のとおり。調和射影 $H$ とグリーン作用素 $G$ は \ref{gl:harmonic-projection}, \ref{gl:green-operator}、ホッジ分解とホッジの定理は \tref{gl:hodge-decomposition}, \tref{gl:hodge-theorem}。
- 星作用素の性質（$\star\star=(-1)^{k(n-k)}$ on $\Lambda^{k}$、$\alpha\wedge\star\beta=\langle\alpha,\beta\rangle\mathrm{vol}_{g}$、$\star1=\mathrm{vol}_{g}$）は \ref{riem:hodge-star-properties}、各点の $\star$ が等長であることは \ref{lin:hodge-star.2}。$\delta=(-1)^{n(k+1)+1}\star d\star$ on $\Omega^{k}$（\ref{riem:codifferential}）。外積 $\varepsilon_{\xi}$ と内部積 $\iota_{\xi}$ は \ref{gl:wedge-interior} のとおり。
- $\Lambda^{\bullet}\defeq\bigoplus_{k=0}^{n}\Lambda^{k}$、$\Lambda^{\mathrm{ev}}\defeq\bigoplus_{k\text{ 偶数}}\Lambda^{k}$, $\Lambda^{\mathrm{odd}}\defeq\bigoplus_{k\text{ 奇数}}\Lambda^{k}$ とし、異なる次数の成分は互いに直交するようにファイバー計量を入れる。$\chi(M)\defeq\sum_{k=0}^{n}(-1)^{k}b_{k}(M)$ を $M$ のオイラー標数という（\ref{gl:hodge-theorem.2} から有限の和である）。
- **選択公理**：前のページの結果（\ref{gl:green-operator}, \ref{gl:hodge-theorem}）を通して、前の系列の DC・可算選択と有限個の選択を使う。このページで新しく使う選択はない。
:::

## 星作用素とポアンカレ双対性 {#gl:sec-ho-duality}

::: lemma 星作用素とラプラシアン {#gl:star-laplacian keywords="star delta = (-1)^k d star and star d = (-1)^{k+1} delta star on k-forms; star commutes with the Hodge Laplacian; star is an L^2 isometry; star commutes with the harmonic projection and the Green operator" index="星作用素とラプラシアンの可換性|ほしさようそとらぷらしあんのかかんせい"}
$(M,g)$ を向きづけられた閉リーマン多様体、$0\le k\le n$ とし、$\alpha\in\Omega^{k}_{\mathbb{C}}(M)$ とする。
1. $\star\delta\alpha=(-1)^{k}d\star\alpha$、$\star d\alpha=(-1)^{k+1}\delta\star\alpha$。
2. $\star\Delta\alpha=\Delta\star\alpha$。
3. $\beta\in L^{2}(\Lambda^{k})$ についても $\star\beta$ が定まり、$(\star\alpha,\star\beta)=(\alpha,\beta)$。
4. $\star H=H\star$、$\star G=G\star$（左辺の $H$, $G$ は $\Lambda^{k}$ の上、右辺は $\Lambda^{n-k}$ の上のもの）。
:::

::: proof
**Step 1.** 【主張：1】$\delta$ の定義と $\star\star$ の符号を使う。$d\star\alpha$ は $n-k+1$ 次なので
$$
\star\delta\alpha=(-1)^{n(k+1)+1}\star\star(d\star\alpha)=(-1)^{n(k+1)+1+(n-k+1)(k-1)}d\star\alpha.
$$
2 を法として $(n-k+1)(k-1)=(n+1)(k-1)-k(k-1)\equiv(n+1)(k-1)$（$k(k-1)$ は偶数）なので、指数は $nk+n+1+nk-n+k-1=2nk+k\equiv k$。次に $\star\alpha$ は $n-k$ 次なので $\delta\star\alpha=(-1)^{n(n-k+1)+1}\star d\star\star\alpha=(-1)^{n(n-k+1)+1+k(n-k)}\star d\alpha$。指数は $n^{2}+n+1-k^{2}\equiv1+k$（$n^{2}+n$ は偶数、$k^{2}\equiv k$）で、$\star d\alpha=(-1)^{k+1}\delta\star\alpha$。

**Step 2.** 【主張：2】1 を $\delta\alpha$（$k-1$ 次）と $d\alpha$（$k+1$ 次）にも使うと
$$
\star d\delta\alpha=(-1)^{k}\delta\star\delta\alpha=(-1)^{k}(-1)^{k}\delta d\star\alpha=\delta d\star\alpha,
$$
$$
\star\delta d\alpha=(-1)^{k+1}d\star d\alpha=(-1)^{k+1}(-1)^{k+1}d\delta\star\alpha=d\delta\star\alpha.
$$
足すと $\star\Delta\alpha=(\delta d+d\delta)\star\alpha=\Delta\star\alpha$。

**Step 3.** 【主張：3】$\star$ は各点の線形写像（$0$ 階の微分作用素、\ref{riem:hodge-star-properties.1}）なので、可測な切断に各点で施せる。各点で $\star$ は実の内積について等長（\ref{lin:hodge-star.2}）で、複素化した $h(a,\bar{b})$ は実部と虚部の内積の組み合わせなので、$h(\star a,\overline{\star b})=h(a,\bar{b})$。積分して $(\star\alpha,\star\beta)=(\alpha,\beta)$。

**Step 4.** 【主張：$\star H=H\star$】2 から、滑らかな $h\in\mathcal{H}^{k}_{\mathbb{C}}$ について $\Delta\star h=\star\Delta h=0$ で $\star h\in\mathcal{H}^{n-k}_{\mathbb{C}}$。$\star\star=\pm1$ なので $\star\colon\mathcal{H}^{k}_{\mathbb{C}}\to\mathcal{H}^{n-k}_{\mathbb{C}}$ は全単射（逆は $\pm\star$）。$f\in L^{2}(\Lambda^{k})$ について、$f-Hf\perp\mathcal{H}^{k}_{\mathbb{C}}$ と 3 から、$h'\in\mathcal{H}^{n-k}_{\mathbb{C}}$ に対して $(\star(f-Hf),h')=(\star(f-Hf),\star(\pm\star h'))=\pm(f-Hf,\star h')=0$。よって $\star f=\star Hf+\star(f-Hf)$ は $\mathcal{H}^{n-k}_{\mathbb{C}}$ の元と、それに直交する元の和で、$H\star f=\star Hf$。

**Step 5.** 【主張：$\star G=G\star$】$\star$ は $0$ 階の微分作用素なので $H^{2}$ を $H^{2}$ に有界に写し（\ref{gl:differential-operator-sobolev.3}）、2 の可換性は滑らかな形式の稠密性（\ref{gl:sobolev-sections-properties.3}）と連続性で $H^{2}$ の元に延びる。$u\defeq\star Gf$ は $H^{2}$ に入り、Step 4 と同じく 3 から $\mathcal{H}^{n-k}_{\mathbb{C}}$ と直交し、$\Delta u=\star\Delta Gf=\star(f-Hf)=\star f-H\star f$。\ref{gl:green-operator.1} の一意性から $u=G\star f$。
:::

::: theorem ホッジの定理によるポアンカレ双対性 {#gl:hodge-poincare-duality keywords="Poincare duality for de Rham cohomology of a closed oriented manifold via harmonic forms: star maps harmonic k-forms isomorphically onto harmonic (n-k)-forms, b_k = b_{n-k}, the pairing (alpha, beta) -> int alpha ^ beta on H^k x H^{n-k} is nondegenerate, H^{n-k} is the dual of H^k" index="ポアンカレ双対性（ド・ラーム・コホモロジー）|ぽあんかれそうついせいどらーむこほもろじー, ベッチ数の対称性|べっちすうのたいしょうせい, ウェッジ積の対|うぇっじせきのつい"}
$(M,g)$ を向きづけられた $n$ 次元の閉リーマン多様体、$0\le k\le n$ とする。
1. $\star$ は $\mathcal{H}^{k}$ を $\mathcal{H}^{n-k}$ に線形同型に写す。とくに $b_{k}(M)=b_{n-k}(M)$。
2. $\langle[\alpha],[\beta]\rangle\defeq\int_{M}\alpha\wedge\beta$ は双線形写像 $H^{k}_{\mathrm{dR}}(M)\times H^{n-k}_{\mathrm{dR}}(M)\to\mathbb{R}$ を矛盾なく定め、これは非退化である。したがって $[\beta]\mapsto\langle\cdot,[\beta]\rangle$ は線形同型 $H^{n-k}_{\mathrm{dR}}(M)\to H^{k}_{\mathrm{dR}}(M)^{*}$ である。
3. $0$ でない $c\in H^{k}_{\mathrm{dR}}(M)$ の調和代表元を $h$ とすると、$[\star h]\in H^{n-k}_{\mathrm{dR}}(M)$ について $\langle c,[\star h]\rangle=\|h\|_{L^{2}}^{2}>0$。
:::

::: intuition
向きと計量の決まった閉多様体では、$k$ 次の穴と $n-k$ 次の穴は同じ数だけあり、星作用素が調和形式の対応を具体的に与える。$k$ 次の閉形式と $n-k$ 次の閉形式をウェッジ積で掛けて積分すると、完全形式の差によらない値が決まり、どの $0$ でない類にも、積分が $0$ にならない相手の類が必ずある。
:::

::: proof
**Step 1.** 【主張：1】\ref{gl:star-laplacian} の証明の Step 4 から $\star$ は $\mathcal{H}^{k}_{\mathbb{C}}$ から $\mathcal{H}^{n-k}_{\mathbb{C}}$ への全単射で、実の形式を実の形式に写すので、$\mathcal{H}^{k}$ から $\mathcal{H}^{n-k}$ への線形同型である（逆は $(-1)^{k(n-k)}\star$）。\ref{gl:hodge-theorem.2} から $b_{k}=\dim\mathcal{H}^{k}=\dim\mathcal{H}^{n-k}=b_{n-k}$。

**Step 2.** 【主張：2 の対は矛盾なく定まる】$\alpha$, $\beta$ が閉で $\eta\in\Omega^{k-1}(M)$ なら、ライプニッツ則から $d(\eta\wedge\beta)=d\eta\wedge\beta+(-1)^{k-1}\eta\wedge d\beta=d\eta\wedge\beta$ なので、\ref{mfd:stokes-corollaries.1} から $\int_{M}d\eta\wedge\beta=\int_{M}d(\eta\wedge\beta)=0$。$\beta$ を $\beta+d\zeta$ に替えても、$d(\alpha\wedge\zeta)=(-1)^{k}\alpha\wedge d\zeta$ から同様に積分は変わらない。双線形性は積分とウェッジ積の線形性から。

**Step 3.** 【主張：3 と 2 の非退化性】$c\neq0$ の調和代表元 $h$ は $0$ でない（\ref{gl:hodge-theorem.1}）。Step 1 から $\star h$ は調和、とくに閉で、$\langle c,[\star h]\rangle=\int_{M}h\wedge\star h=\int_{M}\langle h,h\rangle\,\mathrm{vol}_{g}=\|h\|_{L^{2}}^{2}>0$（\ref{gl:rm-integral-formulas.3}）。よって $c\mapsto\langle c,\cdot\rangle$ は $H^{k}_{\mathrm{dR}}$ から $(H^{n-k}_{\mathrm{dR}})^{*}$ への単射である。$k$ と $n-k$ の役割を入れ替えた同じ議論（$\langle\alpha,\beta\rangle=(-1)^{k(n-k)}\int\beta\wedge\alpha$）から $H^{n-k}_{\mathrm{dR}}\to(H^{k}_{\mathrm{dR}})^{*}$ も単射で、どちらも有限次元（\ref{gl:hodge-theorem.2}）、1 から次元が等しいので、どちらも同型である。

::: hypcheck
- **向き**：$\star$ の定義と、Step 2・3 の積分（\ref{mfd:stokes-corollaries}）に使った。外すと偽：$\mathbb{RP}^{2}$ では $b_{0}=1$, $b_{2}=0$（\ref{mfd:prob-dr-rp2}）。
- **閉多様体であること**：ホッジの定理（調和代表元の存在）と、Step 2 で境界項が消えることに使った。境界のある $M=[0,1]$ では $b_{0}=1$, $b_{1}=0$。
- **計量**：補助として使っただけで、結論 2 は計量によらない（積分 $\int\alpha\wedge\beta$ は向きだけで決まる）。ただし 3 の相手の類 $[\star h]$ は計量によって変わる。
- **公理**：\ref{gl:hodge-theorem} を通した選択だけを使う。
:::
:::

::: supplement
**前提を変えると.** 向き付け不可能な閉多様体では、$\star$ は形式を「向きの直線束に値をもつ形式」に写すので、$b_{k}=b_{n-k}$ の代わりに、ねじれた係数のコホモロジーとの双対性が成り立つ。$\mathbb{Z}/2$ 係数のコホモロジーでは向きによらないポアンカレ双対性が成り立つ（\see{at:poincare-duality}）。境界つきのコンパクトな多様体では、絶対コホモロジーと相対コホモロジーが双対になる（レフシェッツ双対性。ここでは証明しない）。

**似た定理.** 代数的位相幾何学のポアンカレ双対性（\see{at:poincare-duality}）は、整数係数で基本類とのキャップ積が同型を与えるという、より精密な形をしている。ここでの 2 はその実係数の部分を、星作用素と調和形式で具体的に実現したものである（二つの同型が一致することは、ド・ラームの同型が積を保つこと \ref{mfd:de-rham-cup} などから従うが、ここでは扱わない）。複素多様体では、星作用素の代わりに複素共役と組み合わせた作用素によって、ドルボー・コホモロジーの**セール双対性**が同じ方法で示される（ここでは証明しない）。

**高い視点：鏡としての星作用素.** $\star$ は各点で「$k$ 本の方向」を「残りの $n-k$ 本の方向」に取り替える鏡で、ラプラシアンと可換なので、方程式の解である調和形式を調和形式に映す。コホモロジーの言葉では、$k$ 次の類に、それと積分の対で「一番よく噛み合う」$n-k$ 次の類を対応させている。3 の式 $\langle c,[\star h]\rangle=\|h\|^{2}$ は、鏡に映した相手との対が自分自身の長さの二乗になるということで、非退化性はこの「自分の鏡像と必ず噛み合う」性質から出る。
:::

## オイラー標数と d+δ の指数 {#gl:sec-ho-euler}

::: theorem オイラー標数は d+δ の指数 {#gl:euler-index keywords="the operator d + delta from even forms to odd forms on a closed oriented Riemannian manifold is a first order elliptic operator whose formal adjoint is d + delta from odd to even forms; its kernel is the even harmonic forms and its index equals the Euler characteristic; Euler characteristic of odd dimensional closed oriented manifolds vanishes" index="d+δ の指数|でぃーぷらすでるたのしすう, オイラー標数と指数|おいらーひょうすうとしすう, ガウス–ボネ作用素|がうすぼねさようそ"}
$(M,g)$ を向きづけられた $n$ 次元の閉リーマン多様体とし、$D^{+}\defeq(d+\delta)|_{\Lambda^{\mathrm{ev}}}\colon\Gamma(M,\Lambda^{\mathrm{ev}})\to\Gamma(M,\Lambda^{\mathrm{odd}})$、$D^{-}\defeq(d+\delta)|_{\Lambda^{\mathrm{odd}}}\colon\Gamma(M,\Lambda^{\mathrm{odd}})\to\Gamma(M,\Lambda^{\mathrm{ev}})$ とする。
1. $D^{+}$ は $1$ 階の楕円型作用素で、その形式的随伴は $D^{-}$ である。
2. $\ker D^{+}=\bigoplus_{k\text{ 偶数}}\mathcal{H}^{k}_{\mathbb{C}}$, $\ker D^{-}=\bigoplus_{k\text{ 奇数}}\mathcal{H}^{k}_{\mathbb{C}}$。
3. $D^{+}\colon H^{1}(M;\Lambda^{\mathrm{ev}})\to L^{2}(M;\Lambda^{\mathrm{odd}})$ はフレドホルム作用素で、その指数は $\chi(M)$ に等しい。
4. $n$ が奇数なら $\chi(M)=0$。
:::

::: intuition
外微分と余微分の和を、偶数次の形式から奇数次の形式への作用素とみると、解の自由度（核）から、方程式が解けるための条件の数（余核）を引いた差が、偶数次のベッチ数の和から奇数次のベッチ数の和を引いたもの、つまりオイラー標数になる。解析的な量（方程式の解の数）が位相的な量（穴の数の交代和）で決まる、という指数定理の最初の例である。
:::

::: proof
**Step 1.** 【主張：$D^{+}$ は楕円型】$\sigma_{d+\delta}(m,\xi)=i(\varepsilon_{\xi}-\iota_{\xi})$（\ref{gl:hodge-laplacian-symbol.3}）は次数を $\pm1$ ずらすので $\Lambda^{\mathrm{ev}}_{m}$ を $\Lambda^{\mathrm{odd}}_{m}$ に写し、$D^{+}$ の主表象はその制限である（係数を制限したもの）。$\sigma_{d+\delta}^{2}=|\xi|^{2}\mathrm{id}$ から、$\xi\neq0$ ならこの制限は単射。$n\ge1$ なので二項定理から $\sum_{k\text{ 偶数}}\binom{n}{k}-\sum_{k\text{ 奇数}}\binom{n}{k}=(1-1)^{n}=0$ で、$\Lambda^{\mathrm{ev}}_{m}$ と $\Lambda^{\mathrm{odd}}_{m}$ の次元は等しい（ともに $2^{n-1}$）。等しい次元の空間の間の単射な線形写像は可逆なので、$D^{+}$ は楕円型である。

**Step 2.** 【主張：$(D^{+})^{*}=D^{-}$】滑らかな $u=\sum_{k\text{ 偶数}}u_{k}$, $v=\sum_{k\text{ 奇数}}v_{k}$ について、異なる次数の成分は直交するので、$(du,v)=\sum_{k}(du_{k},v_{k+1})=\sum_{k}(u_{k},\delta v_{k+1})=(u,\delta v)$、同様に $(\delta u,v)=(u,dv)$。足して $(D^{+}u,v)=(u,D^{-}v)$ で、\ref{gl:formal-adjoint-bundle.3} の一意性から $(D^{+})^{*}=D^{-}$。1 が示された。

**Step 3.** 【主張：2】$u\in\ker D^{+}$ は \ref{gl:elliptic-kernel-range.1} から滑らかで $(d+\delta)u=0$。$dd=0$, $\delta\delta=0$ から $(d+\delta)^{2}=d\delta+\delta d=\Delta$ なので $\Delta u=\sum_{k}\Delta u_{k}=0$ で、$\Delta u_{k}\in\Omega^{k}_{\mathbb{C}}$ は次数ごとに $0$、つまり各 $u_{k}\in\mathcal{H}^{k}_{\mathbb{C}}$。逆に $h_{k}\in\mathcal{H}^{k}_{\mathbb{C}}$ は $dh_{k}=\delta h_{k}=0$（\ref{gl:harmonic-projection.1}）なので $(d+\delta)\sum h_{k}=0$ で、滑らかな古典解は弱解である（\ref{gl:formal-transpose-bundle.4}）。$D^{-}$ も同じ。

**Step 4.** 【主張：3】\ref{gl:elliptic-fredholm.3}（$k=1$, $s=0$）から $D^{+}$ はフレドホルム作用素で、指数は $\dim\ker D^{+}-\dim\ker(D^{+})^{t}$、\ref{gl:elliptic-fredholm.1} から $\dim\ker(D^{+})^{t}=\dim\ker(D^{+})^{*}=\dim\ker D^{-}$。\ref{gl:harmonic-projection.1} と \ref{gl:hodge-theorem.2} から $\dim_{\mathbb{C}}\mathcal{H}^{k}_{\mathbb{C}}=\dim\mathcal{H}^{k}=b_{k}$ なので、2 から指数は $\sum_{k\text{ 偶数}}b_{k}-\sum_{k\text{ 奇数}}b_{k}=\chi(M)$。

**Step 5.** 【主張：4】$n$ が奇数なら $k$ と $n-k$ の偶奇は逆で、\ref{gl:hodge-poincare-duality.1} の $b_{k}=b_{n-k}$ から $\chi(M)=\sum_{k}(-1)^{k}b_{n-k}=\sum_{j}(-1)^{n-j}b_{j}=-\chi(M)$（$j=n-k$）。よって $\chi(M)=0$。

::: hypcheck
- **偶数次と奇数次に分けること**：Step 1 で次元が等しいことに使った。$d+\delta$ を $\Lambda^{\bullet}$ 全体の上で考えると形式的に自己共役なので、指数は $0$ になる（\ref{gl:elliptic-fredholm.4}）。
- **閉多様体であること**：フレドホルム性とホッジの定理に使った。
- **向き**：$\delta$ の定義と、4 でポアンカレ双対性に使った。1〜3 は向き付け不可能でも成り立つ（ホッジの定理の補足と同じく、$\delta$ は局所的に定まる）。4 は向き付け不可能でも成り立つが、ここでの証明（星作用素によるポアンカレ双対性）はそのままでは使えない（位相的な証明は \see{at:odd-dimension-euler}）。
- **$n\ge1$**：Step 1 の次元の等式に使った（$n=0$ では $\Lambda^{\mathrm{odd}}=0$）。
- **公理**：\ref{gl:hodge-theorem} を通した選択だけを使う。
:::
:::

::: supplement
**前提を変えると.** 計量を変えると $D^{+}$ も核も変わるが、指数 $\chi(M)$ は変わらない。$\chi(M)$ は位相的なオイラー標数（単体の個数の交代和）とも一致する（ド・ラームの定理と \see{at:euler-poincare} から）。$n=4m$ では、$\Lambda^{\bullet}$ を $\star$ に符号を合わせた対合の $\pm1$ 固有空間に分けると、別の分け方での $d+\delta$（**符号数作用素**）が得られ、その指数は交叉形式の符号数になる（\ref{gl:prob-ho-signature} はその $m=1$ の調和形式の部分。指数との関係はここでは証明しない）。

**似た定理.** **ガウス–ボネ–チャーンの定理**は、$\chi(M)$ を曲率から作った $n$ 形式の積分で表す（$n=2$ ではガウス–ボネの定理 $2\pi\chi=\int K\,dA$）。アティヤ–シンガーの指数定理は、一般の楕円型作用素の指数を主表象の位相的な不変量で表し、この定理とガウス–ボネ–チャーンの定理を結びつける（いずれもここでは証明しない）。熱核のページでは、$e^{-t\Delta}$ の跡の交代和が $t$ によらず $\chi(M)$ に等しいこと（マッキーン–シンガーの公式）の考え方に触れる。その鍵は、$0$ でない固有値 $\lambda$ の $\Delta$ の固有空間の上で、$D^{+}$ が偶数次の部分を奇数次の部分に同型に写す（$D^{-}D^{+}=\Delta$ だから）ことである。

**高い視点：偶数と奇数の帳尻.** 偶数次の形式と奇数次の形式を二つの部屋にたとえると、$D^{+}$ は偶数の部屋から奇数の部屋への通路である。$0$ でない固有値の固有形式は、二つの部屋の間で $D^{+}$ によってきっちり一対一に組になり、指数には何も残さない。組になれずに残るのは固有値 $0$ の調和形式だけで、その数の差が指数である。計量をどう動かしても、固有値が $0$ を横切るときは偶数の部屋と奇数の部屋で同時に横切るので、帳尻の差 $\chi(M)$ は変わらない。
:::

## 例：トーラス・球面・曲面 {#gl:sec-ho-examples}

::: proposition 平坦トーラスの調和形式 {#gl:torus-harmonic-forms keywords="harmonic forms on the flat torus T^n are the constant coefficient (parallel) forms sum c_I dt_I; the Hodge Laplacian acts coefficientwise; b_k(T^n) = binomial(n, k); delta(f beta) = - sum D_j f iota_j beta for constant coefficient beta" index="平坦トーラスの調和形式|へいたんとーらすのちょうわけいしき, トーラスのベッチ数|とーらすのべっちすう"}
平坦トーラス $T^{n}$（\ref{gl:sec-nt-torus}）に向き $dt_{1}\wedge\cdots\wedge dt_{n}$ を入れる（$dt_{j}$ は各座標近傍 $x_{a}$ で座標 $t_{j}$ の微分で、座標変換が平行移動なので大域的に定まる）。$\iota_{j}\defeq\iota_{dt_{j}}$ と書き、$dt_{I}$（$I$ は増加列）の定数係数の一次結合を**定数係数の形式**という。
1. 滑らかな関数 $f$ と定数係数の $k$ 形式 $\beta$ について $d(f\beta)=\sum_{j}(D_{j}f)\,dt_{j}\wedge\beta$、$\delta(f\beta)=-\sum_{j}(D_{j}f)\,\iota_{j}\beta$。
2. $\Delta\bigl(\sum_{I}f_{I}\,dt_{I}\bigr)=\sum_{I}(\Delta f_{I})\,dt_{I}$（右辺の $\Delta=-\sum_{j}D_{j}^{2}$ は関数のラプラシアン）。
3. $\mathcal{H}^{k}$ は定数係数の $k$ 形式の全体で、$\{dt_{I}:|I|=k\}$ が基底である。とくに $b_{k}(T^{n})=\binom{n}{k}$ で、$\{[dt_{I}]:|I|=k\}$ は $H^{k}_{\mathrm{dR}}(T^{n})$ の基底である。
:::

::: intuition
平らなトーラスでは、ホッジのラプラシアンは形式の各係数に関数のラプラシアンを施すだけである。したがって調和形式は係数がすべて定数の形式、つまりトーラス全体で「同じ向きを向いた」形式で、その個数がトーラスの $k$ 次の穴の数 $\binom{n}{k}$ になる。
:::

::: proof
**Step 1.** 【主張：1】$x_{a}$ で $g_{ij}=\delta_{ij}$ なので $(D_{j})$ は正の正規直交フレーム、$(dt_{j})$ はその双対で、\ref{riem:hodge-star-properties.1} から $\star dt_{I}=\pm dt_{I^{c}}$ は定数係数である。定数係数の形式 $\gamma$ について $d\gamma=0$ なので $d(f\gamma)=df\wedge\gamma=\sum_{j}(D_{j}f)dt_{j}\wedge\gamma$。$k\ge1$ のとき $\delta(f\beta)=(-1)^{n(k+1)+1}\star d(f\star\beta)=(-1)^{n(k+1)+1}\star(df\wedge\star\beta)$ で、各点で \ref{gl:wedge-interior.3}（$f$ が複素数値なら実部と虚部に分けて使う）から $\star(df\wedge\star\beta)=(-1)^{n(k+1)}\iota_{df}\beta$。符号は $(-1)^{2n(k+1)+1}=-1$ で、$\iota_{\xi}$ は $\xi$ について線形なので $\iota_{df}=\sum_{j}(D_{j}f)\iota_{j}$。$k=0$ では両辺 $0$。

**Step 2.** 【主張：$\varepsilon_{i}\iota_{j}+\iota_{j}\varepsilon_{i}+\varepsilon_{j}\iota_{i}+\iota_{i}\varepsilon_{j}=2\delta_{ij}$（$\varepsilon_{j}\defeq\varepsilon_{dt_{j}}$）】\ref{gl:wedge-interior.2} を $\xi=dt_{i}+dt_{j}$, $dt_{i}$, $dt_{j}$ に使い、$\varepsilon_{\xi}$, $\iota_{\xi}$ が $\xi$ について線形であることから、$\varepsilon_{\xi}\iota_{\xi}+\iota_{\xi}\varepsilon_{\xi}$ の展開の交差項は $|dt_{i}+dt_{j}|^{2}-|dt_{i}|^{2}-|dt_{j}|^{2}=2\langle dt_{i},dt_{j}\rangle=2\delta_{ij}$ に等しい。

**Step 3.** 【主張：2】$\Delta$ の線形性から $f\,dt_{I}$ について示せばよい。1 を繰り返し使う（$\iota_{j}dt_{I}$, $dt_{j}\wedge dt_{I}$ は定数係数）と
$$
\begin{aligned}
d\delta(f\,dt_{I})&=-\sum_{i,j}(D_{i}D_{j}f)\,\varepsilon_{i}\iota_{j}dt_{I},\\
\delta d(f\,dt_{I})&=-\sum_{i,j}(D_{i}D_{j}f)\,\iota_{i}\varepsilon_{j}dt_{I}.
\end{aligned}
$$
$D_{i}D_{j}f=D_{j}D_{i}f$（座標で偏微分の順序交換）なので、和の $i$ と $j$ を入れ替えた式との平均をとり、Step 2 を使うと
$$
\begin{aligned}
\Delta(f\,dt_{I})&=-\frac12\sum_{i,j}(D_{i}D_{j}f)(\varepsilon_{i}\iota_{j}+\iota_{j}\varepsilon_{i}+\varepsilon_{j}\iota_{i}+\iota_{i}\varepsilon_{j})dt_{I}\\
&=-\sum_{i}(D_{i}^{2}f)\,dt_{I}.
\end{aligned}
$$
平坦な計量では関数のラプラシアンは $-\sum_{i}D_{i}^{2}$（\ref{gl:laplacian-examples.2}）なので、これは $(\Delta f)dt_{I}$。

**Step 4.** 【主張：3】$\{dt_{I}\}$ は各点で $\Lambda^{k}$ の基底なので、2 から $\sum f_{I}dt_{I}$ が調和であることは、すべての $I$ で $\Delta f_{I}=0$ であることと同値で、$T^{n}$ は連結（$\mathbb{R}^{n}$ の連続像）なので \ref{gl:closed-manifold-laplacian.4} から各 $f_{I}$ は定数である。逆に定数係数の形式は 2 から調和。$\{dt_{I}\}$ は一次独立なので、$\dim\mathcal{H}^{k}=\binom{n}{k}$ で、\ref{gl:hodge-theorem.2} から $b_{k}(T^{n})=\binom{n}{k}$、$[dt_{I}]$ が基底になる。
:::

定数係数の形式は、平坦な計量のレビ–チビタ接続で平行な形式（座標 $x_{a}$ でクリストッフェル記号が $0$）にほかならない。$b_{k}(T^{n})=\binom{n}{k}$ は、$b_{0}(S^{1})=b_{1}(S^{1})=1$ とベッチ数のキュネットの公式（\ref{mfd:de-rham-kunneth}）からも得られ、$\sum_{i+j=k}$ の数え上げが $\binom{n}{k}$ を与える。平坦でない計量では調和形式は定数係数とは限らないが、その次元は \ref{gl:hodge-theorem.2} から変わらない。

::: corollary 球面と閉曲面の調和形式 {#gl:sphere-surface-harmonic keywords="on a sphere S^n with any Riemannian metric there are no harmonic k-forms for 0 < k < n, harmonic 0-forms are constants and harmonic n-forms are multiples of vol; on a closed oriented surface star is a complex structure on harmonic 1-forms, so b_1 is even, and harmonic 1-forms depend only on the conformal class" index="球面の調和形式|きゅうめんのちょうわけいしき, 閉曲面の 1 次のベッチ数|へいきょくめんのいちじのべっちすう, 調和 1 形式の共形不変性|ちょうわいちけいしきのきょうけいふへんせい"}
1. $n\ge1$ とし、球面 $S^{n}$ に任意のリーマン計量 $g$ と向きを入れる。$\mathcal{H}^{0}$ は定数関数、$\mathcal{H}^{n}=\mathbb{R}\,\mathrm{vol}_{g}$ で、$0<k<n$ なら $\mathcal{H}^{k}=0$。
2. $\Sigma$ を向きづけられた連結な閉曲面（$2$ 次元）、$g$ をその上の任意のリーマン計量とする。$\mathcal{H}^{0}$ は定数関数、$\mathcal{H}^{2}=\mathbb{R}\,\mathrm{vol}_{g}$ で、$\star$ は $\mathcal{H}^{1}$ をそれ自身に写して $\star\star=-1$。とくに $b_{1}(\Sigma)$ は偶数である。
3. 2 の状況で、正の滑らかな関数 $\varphi$ について計量を $g'=\varphi^{2}g$ に替えても $\mathcal{H}^{1}$ は変わらない。
:::

::: proof
**Step 1.** 【主張：1】$S^{n}$ は連結なので、$\mathcal{H}^{0}$ は \ref{gl:closed-manifold-laplacian.4} から定数関数（定数は調和）。\ref{gl:hodge-poincare-duality.1} から $\mathcal{H}^{n}=\star\mathcal{H}^{0}=\mathbb{R}\star1=\mathbb{R}\,\mathrm{vol}_{g}$。$0<k<n$ なら \ref{mfd:sphere-de-rham} から $H^{k}_{\mathrm{dR}}(S^{n})=0$ で、\ref{gl:hodge-theorem.2} から $\mathcal{H}^{k}=0$。

**Step 2.** 【主張：2】$\mathcal{H}^{0}$, $\mathcal{H}^{2}$ は Step 1 と同じ。\ref{gl:hodge-poincare-duality.1}（$n=2$, $k=1$）から $\star\mathcal{H}^{1}=\mathcal{H}^{1}$ で、$\Lambda^{1}$ の上で $\star\star=(-1)^{1\cdot1}=-1$。$J\defeq\star|_{\mathcal{H}^{1}}$ は $J^{2}=-1$ を満たす実ベクトル空間 $\mathcal{H}^{1}$ の線形変換なので、$N\defeq\dim\mathcal{H}^{1}$ について $(\det J)^{2}=\det(J^{2})=\det(-1)=(-1)^{N}$。左辺は $0$ 以上の実数なので $N$ は偶数で、\ref{gl:hodge-theorem.2} から $b_{1}(\Sigma)=N$。

**Step 3.** 【主張：3】各点 $m$ で、$g_{m}$ の正の正規直交基底 $(e_{1},e_{2})$ の双対を $(\theta^{1},\theta^{2})$ とすると、$g'_{m}$ の正の正規直交基底は $(\varphi^{-1}e_{1},\varphi^{-1}e_{2})$、双対は $(\varphi\theta^{1},\varphi\theta^{2})$ で、\ref{riem:hodge-star-properties.1} から $g'$ の星作用素は $\star'(\varphi\theta^{1})=\varphi\theta^{2}$, $\star'(\varphi\theta^{2})=-\varphi\theta^{1}$。線形性から $\star'\theta^{1}=\theta^{2}=\star\theta^{1}$, $\star'\theta^{2}=-\theta^{1}=\star\theta^{2}$ で、$1$ 形式の上で $\star'=\star$。$1$ 形式 $h$ について、$\delta h=-\star d\star h$（$n=2$, $k=1$ の符号）と $\star$ が単射であることから、$\delta h=0$ と $d\star h=0$ は同値である。よって $h\in\mathcal{H}^{1}$ は「$dh=0$ かつ $d\star h=0$」（\ref{gl:harmonic-projection.1}）と同値で、この条件は $1$ 形式の上の $\star$ だけで決まるので、$g$ と $g'$ で同じである。

::: hypcheck
- **向き**：$\star$ と、2 の $\star\mathcal{H}^{1}=\mathcal{H}^{1}$ に使った。向き付け不可能な閉曲面では $b_{1}$ は奇数にもなる：クラインの壺では $b_{1}=1$（\see{at:surface-homology}。$\mathbb{Z}$ 係数の $H_{1}=\mathbb{Z}\oplus\mathbb{Z}/2$ の階数）。
- **1 の「任意の計量」**：計量によらないのは $H^{k}_{\mathrm{dR}}(S^{n})$ が位相だけで決まるからで、調和形式の空間そのもの（$\mathcal{H}^{n}=\mathbb{R}\mathrm{vol}_{g}$）は計量によって変わる。
- **3 の次元 $2$**：$n=2k$ のときだけ $k$ 形式の上の $\star$ が共形変換で変わらない（\ref{riem:hodge-star-properties.3} の各点版）。$n\neq2$ の $1$ 形式では偽である。
- **公理**：\ref{gl:hodge-theorem} を通した選択だけを使う。
:::
:::

::: supplement
**前提を変えると.** 1 は「計量をどう選んでも」中間次数の調和形式がないという主張で、位相（コホモロジー）から解析（方程式の解の非存在）を導いている。逆向きに、曲率の符号から調和形式の非存在を示す**ボホナーの方法**がある：リッチ曲率が正の閉リーマン多様体では調和 $1$ 形式が $0$ で、$b_{1}=0$ になる（ここでは証明しない）。平坦トーラスでは調和 $1$ 形式が平行になり、曲率 $0$ の場合の等号にあたる。

**似た定理.** 閉曲面 $\Sigma$ が種数 $g$ なら $b_{1}=2g$ である（\see{at:surface-homology}）。2 と 3 は、$\Sigma$ にリーマン面の構造（共形構造）を入れると、$\mathcal{H}^{1}$ が $\star$ を虚数単位とする $g$ 次元の複素ベクトル空間になり、これが正則 $1$ 形式の空間と同一視される（調和 $1$ 形式 $h$ に $h+i\star h$ を対応させる。ここでは証明しない）ことの出発点である。高次元では、コンパクトなケーラー多様体の奇数次のベッチ数が偶数になる（\see{symp:kahler-facts}）。

**高い視点：位相が方程式を縛る.** 球面の上ではどんなに計量を歪めても $1$ 次の調和形式は現れず、トーラスの上ではどんなに歪めても $n$ 個の一次独立な調和 $1$ 形式が必ずある。ホッジの定理は、計量という「形の自由」を与えたときの方程式 $\Delta h=0$ の解の数を、位相という「変えられない骨組み」が固定することを言っている。太鼓の皮をどう張り替えても、穴の数だけ鳴らない音（固有値 $0$）が残る、と言ってもよい。
:::

## 問題 {#gl:sec-ho-cons-problems}

::: problem {#gl:prob-ho-torus-decomposition}
平坦トーラス $T^{2}$（\ref{gl:torus-harmonic-forms} の記号）の上の $1$ 形式
$$
\omega\defeq(1+\cos t_{1}+\cos t_{2})\,dt_{1}
$$
を考える（$\cos t_{j}$ は $u\circ p=\cos t_{j}$ となる関数 $u$）。
1. $d\omega$ と $\delta\omega$ を求めよ。
2. $\omega$ のホッジ分解 $\omega=h+d\alpha+\delta\beta$（$h\in\mathcal{H}^{1}$, $\alpha\in\Omega^{0}$, $\beta\in\Omega^{2}$）を具体的に求めよ。
3. 2 を、\ref{gl:hodge-decomposition.1} の式 $h=H\omega$, $\alpha=\delta G\omega$, $\beta=dG\omega$ と照らし合わせて確かめよ（$\alpha$ は定数の差を除く）。
:::

::: solution
**1.** \ref{gl:torus-harmonic-forms.1} から、$D_{1}\cos t_{1}=-\sin t_{1}$, $D_{2}\cos t_{2}=-\sin t_{2}$ と $dt_{1}\wedge dt_{1}=0$ を使って
$$
d\omega=-\sin t_{2}\,dt_{2}\wedge dt_{1}=\sin t_{2}\,dt_{1}\wedge dt_{2},
$$
$\delta\omega=-(-\sin t_{1})\iota_{1}dt_{1}-(-\sin t_{2})\iota_{2}dt_{1}=\sin t_{1}$（$\iota_{1}dt_{1}=1$, $\iota_{2}dt_{1}=0$）。

**2.** $h\defeq dt_{1}$ は \ref{gl:torus-harmonic-forms.3} から調和。$\cos t_{1}\,dt_{1}=d(\sin t_{1})$。$g$ を関数とすると 1 と $\iota_{1}(dt_{1}\wedge dt_{2})=dt_{2}$, $\iota_{2}(dt_{1}\wedge dt_{2})=-dt_{1}$ から $\delta(g\,dt_{1}\wedge dt_{2})=(D_{2}g)\,dt_{1}-(D_{1}g)\,dt_{2}$ で、$g=\sin t_{2}$ とすると $\cos t_{2}\,dt_{1}$。よって
$$
\omega=dt_{1}+d(\sin t_{1})+\delta(\sin t_{2}\,dt_{1}\wedge dt_{2}).
$$
\ref{gl:hodge-decomposition.1} の直和性から、各成分はこれで一意に決まる。

**3.** $\mathcal{H}^{1}$ の正規直交基底 $(2\pi)^{-1}dt_{1}$, $(2\pi)^{-1}dt_{2}$ について $(\omega,dt_{1})=\int_{(0,2\pi)^{2}}(1+\cos t_{1}+\cos t_{2})\,dt=4\pi^{2}$, $(\omega,dt_{2})=0$ なので $H\omega=dt_{1}$。\ref{gl:torus-harmonic-forms.2} から $\Delta(\cos t_{j}\,dt_{1})=\cos t_{j}\,dt_{1}$ で、$\cos t_{j}\,dt_{1}$ は調和形式と直交するので $G(\cos t_{j}\,dt_{1})=\cos t_{j}\,dt_{1}$、$G(dt_{1})=0$。よって $G\omega=(\cos t_{1}+\cos t_{2})\,dt_{1}$ で、1 と同じ計算から $\delta G\omega=\sin t_{1}$, $dG\omega=\sin t_{2}\,dt_{1}\wedge dt_{2}$。2 と一致する。ベクトル場で言えば、$\omega^{\sharp}=(1+\cos t_{1}+\cos t_{2})D_{1}$ は、一様な流れ $D_{1}$、勾配の流れ $\operatorname{grad}\sin t_{1}$、発散が $0$ で渦をもつずれの流れ $\cos t_{2}\,D_{1}$ の和である。
:::

::: problem {#gl:prob-ho-signature}
$(M,g)$ を向きづけられた $4$ 次元の閉リーマン多様体とする。
1. $\Lambda^{2}$ の上で $\star\star=1$ を確かめ、$\mathcal{H}^{\pm}\defeq\{h\in\mathcal{H}^{2}:\star h=\pm h\}$ について $\mathcal{H}^{2}=\mathcal{H}^{+}\oplus\mathcal{H}^{-}$ を示せ。
2. $Q(\alpha,\beta)\defeq\int_{M}\alpha\wedge\beta$（$\alpha,\beta\in\mathcal{H}^{2}$）は対称で、$\mathcal{H}^{+}$ の上で正定値、$\mathcal{H}^{-}$ の上で負定値、$\alpha\in\mathcal{H}^{+}$, $\beta\in\mathcal{H}^{-}$ について $Q(\alpha,\beta)=0$ かつ $(\alpha,\beta)=0$ であることを示せ。
3. \ref{gl:hodge-poincare-duality.2} の対 $\langle\cdot,\cdot\rangle$ を $H^{2}_{\mathrm{dR}}(M)$ の上の対称双線形形式（**交叉形式**）とみると、\ref{lin:sylvester-inertia} の組 $(p,q)$ が $(\dim\mathcal{H}^{+},\dim\mathcal{H}^{-})$ に等しいことを示せ。とくに $\dim\mathcal{H}^{\pm}$ は計量によらない。
:::

::: solution
**1.** $\star\star=(-1)^{k(n-k)}=(-1)^{4}=1$。\ref{gl:hodge-poincare-duality.1} から $\star\mathcal{H}^{2}=\mathcal{H}^{2}$ で、$h=\frac12(h+\star h)+\frac12(h-\star h)$ の各項は $\star(h\pm\star h)=\star h\pm h=\pm(h\pm\star h)$ から $\mathcal{H}^{\pm}$ に入る。$\mathcal{H}^{+}\cap\mathcal{H}^{-}$ の元は $h=\star h=-h$ で $0$。

**2.** $2$ 形式どうしは $\alpha\wedge\beta=(-1)^{4}\beta\wedge\alpha=\beta\wedge\alpha$ なので $Q$ は対称。$\alpha\in\mathcal{H}^{\pm}$ なら $Q(\alpha,\alpha)=\pm\int\alpha\wedge\star\alpha=\pm\|\alpha\|_{L^{2}}^{2}$（\ref{riem:hodge-star-properties.2}）で、$\alpha\neq0$ なら正（負）。$\alpha\in\mathcal{H}^{+}$, $\beta\in\mathcal{H}^{-}$ なら $Q(\alpha,\beta)=-\int\alpha\wedge\star\beta=-(\alpha,\beta)$、一方 $Q(\alpha,\beta)=Q(\beta,\alpha)=\int\beta\wedge\star\alpha=(\beta,\alpha)=(\alpha,\beta)$（実の内積は対称）。よって $(\alpha,\beta)=-(\alpha,\beta)$ で $(\alpha,\beta)=0$、$Q(\alpha,\beta)=0$。

**3.** \ref{gl:hodge-theorem.2} の同型 $h\mapsto[h]$ で、$\langle[\alpha],[\beta]\rangle=Q(\alpha,\beta)$。2 から、$\mathcal{H}^{+}$ の $(\cdot,\cdot)$ についての正規直交基底と $\mathcal{H}^{-}$ のそれを並べると、$Q$ の行列は対角成分が $+1$（$\dim\mathcal{H}^{+}$ 個）と $-1$（$\dim\mathcal{H}^{-}$ 個）の対角行列になる。\ref{lin:sylvester-inertia} から組 $(p,q)$ は基底によらないので、交叉形式の $(p,q)$ は $(\dim\mathcal{H}^{+},\dim\mathcal{H}^{-})$ である。交叉形式は積分 $\int\alpha\wedge\beta$ だけで決まり計量によらないので、$\dim\mathcal{H}^{\pm}$ も計量によらない（空間 $\mathcal{H}^{\pm}$ 自体は計量によって変わる）。整数 $p-q=\dim\mathcal{H}^{+}-\dim\mathcal{H}^{-}$ も $M$ の符号数と呼ばれる。
:::
