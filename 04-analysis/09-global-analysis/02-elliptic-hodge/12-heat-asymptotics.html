# 熱核の長時間と短時間の振る舞い {#gl:page-heat-asymptotics keywords="long time behaviour of the heat semigroup on closed manifolds, convergence of e^{-tP} u to the projection onto ker P at the rate of the smallest positive eigenvalue, spectral gap, heat flow of differential forms converges to the harmonic projection, heat equation proof of the Hodge theorem, heat trace, McKean-Singer formula sum (-1)^k Tr e^{-t Delta_k} = Euler characteristic, short time asymptotic expansion of the heat kernel, Minakshisundaram-Pleijel coefficients, scalar curvature, Weyl law via Karamata, heat kernel proof of Gauss-Bonnet and the index theorem, 熱核の漸近展開, マッキーン–シンガーの公式, 熱トレース, スペクトル・ギャップ, 調和射影への収束"}

前のページ \ref{gl:page-heat-kernel} では、閉多様体の上の形式的に自己共役で非負な楕円型作用素 $P$ の熱核 $K_{t}(x,y)$ が滑らかであることを示し、関数の上のラプラシアンではそれが確率密度になることを最大値原理から導いた。このページでは、時間を両極端に動かす。$t\to\infty$ では、熱の流れは $P$ の核への直交射影に、最小の正の固有値で決まる指数関数の速さで近づく。微分形式に使うと、閉形式を熱で流したものはコホモロジー類を保ったまま調和形式に収束し、ホッジの定理を「熱の流れ」の言葉で見直すことができる。$t\to0$ の側では、まずホッジのラプラシアンの熱トレースの交代和がつねにオイラー標数に等しいこと（マッキーン–シンガーの公式）を示す。そのあと、熱核の対角成分の短時間の漸近展開を証明なしに紹介し、そこから次元・体積・曲率がスペクトルで読み取れること、ガウス–ボネの定理（さらに指数定理）が熱核から導かれる道筋を説明する。これで系列「楕円型作用素とホッジの定理」の本文を終える。

## 記法と定義の確認 {#gl:sec-hk-asym-notation}

::: notation
- $M$, $g$, $\mu_{g}$, $E$, $\langle\cdot,\cdot\rangle_{h}$、作用素 $P$（形式的に自己共役で非負な $k$ 階の楕円型）、固有切断の基底 $(\varphi_{j},\lambda_{j})$ と係数 $c_{j}$、級数の優収束、局所化のデータと成分 $u_{(i)}^{a}$ は \ref{gl:sec-hk-notation} と \ref{gl:sec-hk-growth} のとおり。熱作用素と熱核は \ref{gl:heat-semigroup}, \ref{gl:heat-smoothing}, \ref{gl:eigen-growth}, \ref{gl:heat-kernel} のとおりで、$t>0$ では $e^{-tP}u$ を滑らかな代表元で表す。
- $\ker P$ は有限次元で滑らかな切断からなり（\ref{gl:elliptic-kernel-range.1}）、\ref{gl:elliptic-spectral-decomposition.2} から $\{\varphi_{j}:\lambda_{j}=0\}$ がその正規直交基底である。$\Pi_{0}$ を $L^{2}$ から $\ker P$ への直交射影とすると $\Pi_{0}u=\sum_{\lambda_{j}=0}c_{j}\varphi_{j}$。$P$ が正の固有値をもつとき（$E\ne0$ なら $\lambda_{j}\to\infty$ からつねにもつ）、その最小のものを $\mu(P)$ と書く。
- 微分形式については \ref{gl:sec-ho-notation} の記法を使う：$(M,g)$ は向きづけられた閉リーマン多様体、$\Lambda^{k}$, $\Omega^{k}(M)$, $\Omega^{k}_{\mathbb{C}}(M)$, $d$, $\delta$, ホッジのラプラシアン $\Delta=d\delta+\delta d$（$k$ 次の形式の上のものを $\Delta_{k}$ とも書く）、$\mathcal{H}^{k}\subset\mathcal{H}^{k}_{\mathbb{C}}=\ker\Delta_{k}$、調和射影 $H$、グリーン作用素 $G$、ベッチ数 $b_{k}$。$\chi(M)\defeq\sum_{k}(-1)^{k}b_{k}$ はオイラー標数（\ref{gl:sec-ho-cons-notation}）。滑らかな形式について $d\Delta=\Delta d$, $\delta\Delta=\Delta\delta$ が成り立つ：$d^{2}=0$, $\delta^{2}=0$ から $\Delta d=(d\delta+\delta d)d=d\delta d=d(\delta d+d\delta)=d\Delta$、$\delta$ も同様。
- **選択公理**：前のページまでと同じく、1 の分割とスペクトル分解を通して DC を使う。このページで新しく使う選択はない。
:::

## 長い時間での振る舞い {#gl:sec-hk-long-time}

::: theorem 熱の流れの長時間の振る舞い {#gl:heat-long-time keywords="long time behaviour of the heat semigroup: e^{-tP} u converges to the orthogonal projection onto ker P with rate e^{-mu t}, mu the smallest positive eigenvalue, in L^2 (sharp), in every Sobolev space and uniformly with derivatives; the heat kernel converges to the kernel of the projection onto ker P; for the Laplacian on a connected closed manifold K_t(x,y) -> 1/vol(M) exponentially fast" index="熱の流れの長時間の振る舞い|ねつのながれのちょうじかんのふるまい, スペクトル・ギャップと熱の減衰|すぺくとるぎゃっぷとねつのげんすい, 熱核の平衡への収束|ねつかくのへいこうへのしゅうそく"}
$P$ を記法の節の作用素、$\mu\defeq\mu(P)$ とする。
1. すべての $u\in L^{2}(M;E)$ と $t\ge0$ で $\|e^{-tP}u-\Pi_{0}u\|_{L^{2}}\le e^{-\mu t}\|u-\Pi_{0}u\|_{L^{2}}$。$u-\Pi_{0}u\ne0$ のとき、ある（したがってすべての）$t>0$ で等号が成り立つことと $u-\Pi_{0}u\in\ker(P-\mu)$ は同値である。
2. 整数 $l\ge0$ について定数 $C$ があって、すべての $u\in L^{2}$ と $t\ge1$ で $\|e^{-tP}u-\Pi_{0}u\|_{H^{kl}}\le Ce^{-\mu t}\|u\|_{L^{2}}$。とくに各 $m$ について、$e^{-tP}u-\Pi_{0}u$ の成分の $m$ 階までの導関数は $x_{i}(V_{i})$ の上で一様に $O(e^{-\mu t})$ である。
3. $K_{\infty}(x,y)\defeq\sum_{\lambda_{j}=0}\varphi_{j}(x)\otimes\varphi_{j}(y)^{*}$（$\Pi_{0}$ の積分核）とおくと、$t\ge1$ で $K_{t}-K_{\infty}$ の成分とそのすべての偏導関数は、一様に $O(e^{-\mu t})$ である。とくに $M$ が連結なとき、関数の上のラプラシアンの熱核について $\sup_{x,y}|K_{t}(x,y)-\operatorname{vol}(M)^{-1}|=O(e^{-\lambda_{1}t})$（$\lambda_{1}$ は最小の正の固有値）。
:::

::: intuition
熱を流し続けると、どの初期値も、$P$ で $0$ になる「平衡状態」（ラプラシアンなら各連結成分の上の定数、微分形式なら調和形式）へ近づく。近づく速さは指数関数で、その指数は最も遅く減衰する振動、すなわち最小の正の固有値で決まる。この速さはそれ以上改善できない。
:::

::: proof
**Step 1.** 【主張：1】$e^{-tP}u-\Pi_{0}u$ の係数は、$\lambda_{j}=0$ では $c_{j}-c_{j}=0$、$\lambda_{j}>0$ では $e^{-t\lambda_{j}}c_{j}$（\ref{gl:heat-semigroup.1}）。$\lambda_{j}>0$ なら $\lambda_{j}\ge\mu$ なので、パーセヴァルの等式から
$$
\begin{aligned}\|e^{-tP}u-\Pi_{0}u\|^{2}&=\sum_{\lambda_{j}>0}e^{-2t\lambda_{j}}|c_{j}|^{2}\le e^{-2\mu t}\sum_{\lambda_{j}>0}|c_{j}|^{2}\\&=e^{-2\mu t}\|u-\Pi_{0}u\|^{2}.\end{aligned}
$$
差は $\sum_{\lambda_{j}>\mu}(e^{-2\mu t}-e^{-2t\lambda_{j}})|c_{j}|^{2}$ で、$t>0$ なら各係数 $e^{-2\mu t}-e^{-2t\lambda_{j}}$ は正なので、等号は $\lambda_{j}>\mu$ のすべての $j$ で $c_{j}=0$ のとき、すなわち（\ref{gl:elliptic-spectral-decomposition.2} から）$u-\Pi_{0}u\in\ker(P-\mu)$ のときに限る。

**Step 2.** 【主張：2】\ref{gl:heat-smoothing} の証明の Step 1 から $(1+x)^{l}e^{-x}\le B_{l}(1)$（$x\ge0$）。$t\ge1$, $\lambda\ge\mu$ なら $e^{-t\lambda}=e^{-\lambda}e^{-(t-1)\lambda}\le e^{-\lambda}e^{-(t-1)\mu}$ なので $(1+\lambda)^{l}e^{-t\lambda}\le B_{l}(1)e^{\mu}e^{-\mu t}$。\ref{gl:spectral-sobolev-norms.1} とパーセヴァルの等式から
$$
\begin{aligned}c\|e^{-tP}u-\Pi_{0}u\|_{H^{kl}}^{2}&\le\sum_{\lambda_{j}>0}(1+\lambda_{j})^{2l}e^{-2t\lambda_{j}}|c_{j}|^{2}\\&\le B_{l}(1)^{2}e^{2\mu}e^{-2\mu t}\|u\|^{2}.\end{aligned}
$$
後半は、$kl>\frac n2+m$ として \ref{gl:local-cm-sections.1} を使う（$e^{-tP}u-\Pi_{0}u$ は滑らか）。

**Step 3.** 【主張：3】$K_{t}-K_{\infty}=\sum_{\lambda_{j}>0}e^{-t\lambda_{j}}\varphi_{j}(x)\otimes\varphi_{j}(y)^{*}$ で、\ref{gl:heat-kernel} の証明の Step 1 と同じ評価から、成分の偏導関数（$t$ で $p$ 回、合わせて $m$ 階まで）の各項は $C(1+\lambda_{j})^{q}e^{-t\lambda_{j}}$（$q$ は $p$, $m$ だけによる）で抑えられる。$t\ge1$ なら $e^{-t\lambda_{j}}\le e^{-(t-1)\mu}e^{-\lambda_{j}}$ なので、和は $Ce^{\mu}e^{-\mu t}\sum_{j}(1+\lambda_{j})^{q}e^{-\lambda_{j}}$ 以下で、\ref{gl:eigen-growth.4} から有限。連結な $M$ の関数のラプラシアンでは、\ref{gl:poincare-best-constant.1} から $\ker\Delta$ は定数で $\varphi_{0}=\operatorname{vol}(M)^{-1/2}$ としてよく、$K_{\infty}=\operatorname{vol}(M)^{-1}$、$\mu=\lambda_{1}$。

::: hypcheck
- **固有値の離散性**：Step 1 で $\mu>0$ が「$0$ を除いた固有値の下限」として正であることに使った（固有値は有限の重複度で $\infty$ に発散するので、正の固有値の最小値が存在する）。$\mathbb{R}^{n}$ の上の熱半群ではスペクトルが $[0,\infty)$ で、$\|e^{t\Delta_{0}}u\|_{L^{2}}\to0$ は成り立つが、一様な指数の速さはない。
- **非負性と自己共役性**：$e^{-t\lambda_{j}}\le1$ と係数による計算全体に使った。
- **連結性**（3 の後半）：$K_{\infty}$ が定数になることに使った。連結でなければ $K_{\infty}$ は成分ごとの定数になる（\ref{gl:prob-hk-disconnected}）。
- **公理**：新しい選択は使わない。
:::
:::

::: supplement
**前提を変えると.** 1 は \ref{gl:poincare-best-constant} の時間発展版で、関数のラプラシアンなら $\mu=\lambda_{1}$ はポアンカレの不等式の最良定数の二乗の逆数である。前のページの問題 \ref{gl:prob-hk-energy-decay} では、固有関数展開を使わずにエネルギー法で同じ評価を出した。$P$ に $\ker P=0$ なら熱の流れは $0$ に収束し、$\|e^{-tP}\|=e^{-\lambda_{0}t}$ である。計量を $\rho^{2}$ 倍すると固有値は $\rho^{-2}$ 倍になり、大きな多様体ほど平衡に達するのが遅い。

**似た定理.** 確率論の言葉では、3 はブラウン運動の分布が時間とともに一様分布（体積の正規化）へ近づくことで、$\lambda_{1}$ は「混ざる速さ」を表す。有限グラフの上の酔歩でも、グラフ・ラプラシアンの最小の正の固有値（スペクトル・ギャップ）が同じ役割を果たし、エクスパンダー・グラフの理論の出発点になる。チーガーの不等式（\ref{gl:poincare-best-constant} の後の補足）は、くびれのない多様体では熱が速く混ざることを言っている。

**高い視点：一番遅い音が最後まで残る.** 鐘を打つと、高い音はすぐに消え、最後には一番低い音だけが響く。熱の流れは高い振動ほど速く減衰させるので、長い時間の後に残るのは、減衰しない成分（平衡）と、最も遅く減衰する最低音 $\lambda_{1}$ の成分だけである。平衡からのずれが $e^{-\lambda_{1}t}$ で消えるのは、その最低音の減衰の速さそのものである。
:::

微分形式に使うと、熱の流れがコホモロジー類を保つことがわかる。

::: corollary 微分形式の熱の流れと調和代表元 {#gl:heat-flow-hodge keywords="heat flow of differential forms: e^{-t Delta} commutes with d and delta and preserves real forms; for a closed form omega, e^{-t Delta} omega is closed, cohomologous to omega via omega - e^{-t Delta} omega = d int_0^t delta e^{-s Delta} omega ds, and converges exponentially fast to the harmonic representative H omega; omega - H omega = d delta G omega; heat equation approach to the Hodge theorem" index="微分形式の熱の流れ|びぶんけいしきのねつのながれ, 熱の流れと調和代表元|ねつのながれとちょうわだいひょうげん"}
$(M,g)$ を向きづけられた閉リーマン多様体、$0\le k\le n$ とし、$e^{-t\Delta}$ を $\Lambda^{k}$ の上のホッジのラプラシアンの熱作用素とする。
1. 滑らかな $\omega\in\Omega^{k}_{\mathbb{C}}(M)$ と $t\ge0$ について、$de^{-t\Delta}\omega=e^{-t\Delta}d\omega$、$\delta e^{-t\Delta}\omega=e^{-t\Delta}\delta\omega$（右辺の $e^{-t\Delta}$ はそれぞれ $\Lambda^{k+1}$, $\Lambda^{k-1}$ の上のもの）。また $\overline{e^{-t\Delta}\omega}=e^{-t\Delta}\bar{\omega}$ で、$e^{-t\Delta}$ は実の形式を実の形式に写す。
2. 滑らかな $\omega$ について、$t\to\infty$ で $e^{-t\Delta}\omega\to H\omega$ がすべての $H^{s}$ で、成分の導関数を込めて一様に、$e^{-\mu(\Delta_{k})t}$ の速さで成り立つ。
3. $\omega\in\Omega^{k}(M)$ が閉形式なら、各 $t>0$ で $e^{-t\Delta}\omega$ は実の閉形式で、$\beta_{t}\defeq\int_{0}^{t}e^{-s\Delta}\delta\omega\,ds$（各 $H^{s'}$ に値をとるリーマン積分）は実の滑らかな $(k-1)$ 形式であり、$\omega-e^{-t\Delta}\omega=d\beta_{t}$。とくに $e^{-t\Delta}\omega$ は $\omega$ と同じコホモロジー類に属する。
4. 3 で $t\to\infty$ とすると $\beta_{t}$ はすべての $H^{s}$ で $\delta G\omega$ に収束し、$\omega-H\omega=d\delta G\omega$。
:::

::: intuition
閉じた微分形式に熱を流すと、閉じたまま、属するコホモロジー類も変えずに、形だけがならされていき、最後にはその類の調和形式にたどり着く。途中で失われた分はいつも何かの外微分になっている。
:::

::: proof
**Step 1.** 【主張：1 の前半】$(\psi_{i},\nu_{i})$ を $\Lambda^{k+1}$ の上の $\Delta$ の滑らかな固有形式の正規直交基底とする（\ref{gl:hodge-laplacian-spectrum.2}）。記法の節から $\Delta\delta\psi_{i}=\delta\Delta\psi_{i}=\nu_{i}\delta\psi_{i}$ で、$\delta\psi_{i}$ は滑らかなので $\ker(\Delta_{k}-\nu_{i})$ に属し、\ref{gl:heat-semigroup.1} から $e^{-t\Delta}\delta\psi_{i}=e^{-t\nu_{i}}\delta\psi_{i}$。$e^{-t\Delta}\omega$ は滑らか（$t=0$ では $\omega$ 自身、$t>0$ では \ref{gl:heat-smoothing.2}）なので、$d$ と $\delta$ の随伴性（\ref{gl:sec-ho-notation}）と \ref{gl:heat-semigroup.2} の自己共役性から
$$
\begin{aligned}(de^{-t\Delta}\omega,\psi_{i})&=(e^{-t\Delta}\omega,\delta\psi_{i})=(\omega,e^{-t\Delta}\delta\psi_{i})\\&=e^{-t\nu_{i}}(d\omega,\psi_{i})=(e^{-t\Delta}d\omega,\psi_{i}).\end{aligned}
$$
\ref{fa:orthonormal-basis.3} から $de^{-t\Delta}\omega=e^{-t\Delta}d\omega$。$\delta$ についても、$\Lambda^{k-1}$ の基底と $d\Delta=\Delta d$ で同じ計算をする。

**Step 2.** 【主張：1 の後半と 2】$\Delta$ は実の係数をもつので、$(\overline{\varphi_{j}},\lambda_{j})$ も \ref{gl:elliptic-spectral-decomposition.2} の基底である。$e^{-t\Delta}\bar{\omega}$ と $\overline{e^{-t\Delta}\omega}$ の、基底 $(\overline{\varphi_{j}})$ についての係数はどちらも $e^{-t\lambda_{j}}\overline{(\omega,\varphi_{j})}$（\ref{gl:heat-semigroup.1}）なので等しい。2 は \ref{gl:heat-long-time.2} で、$\ker\Delta_{k}=\mathcal{H}^{k}_{\mathbb{C}}$ への直交射影が調和射影 $H$ であること（\ref{gl:harmonic-projection.2}）による。

**Step 3.** 【主張：3】$d\omega=0$ なので 1 から $de^{-t\Delta}\omega=e^{-t\Delta}0=0$ で、1 から実。$\omega\in H^{2}$ は生成作用素 $-\Delta$ の定義域に属するので（\ref{gl:heat-semigroup.4}）、\ref{fa:semigroup-basic.3} から $L^{2}$ のリーマン積分として $\omega-e^{-t\Delta}\omega=\int_{0}^{t}e^{-s\Delta}\Delta\omega\,ds$。$\Delta\omega=d\delta\omega+\delta d\omega=d\delta\omega$ と 1 から $e^{-s\Delta}\Delta\omega=d\,e^{-s\Delta}\delta\omega$。$\delta\omega$ は滑らかなので、\ref{gl:heat-smoothing.3} から $s\mapsto e^{-s\Delta}\delta\omega$ は $[0,\infty)$ からすべての $H^{s'}$ への連続写像で、リーマン積分 $\beta_{t}$ は各 $H^{s'}$ で存在し（包含 $H^{s'}\subset L^{2}$ は連続なので、どの $s'$ でとっても同じ元）、すべての $H^{s'}$ に入るので滑らか（\ref{gl:elliptic-smooth} の証明の Step 2）、各 $e^{-s\Delta}\delta\omega$ が実なので実である。$d\colon H^{1}\to L^{2}$ は有界なのでリーマン積分と交換し、$d\beta_{t}=\int_{0}^{t}de^{-s\Delta}\delta\omega\,ds=\omega-e^{-t\Delta}\omega$。

**Step 4.** 【主張：4】$\delta\omega$ は余完全なので調和形式と直交し（\ref{gl:harmonic-projection.3}）、$H\delta\omega=0$。\ref{gl:heat-long-time.2}（$\Delta$ は $2$ 階なので $H^{2l}$）から $s\ge1$ で $\|e^{-s\Delta}\delta\omega\|_{H^{2l}}\le Ce^{-\mu s}\|\delta\omega\|$（$\mu=\mu(\Delta_{k-1})$）がすべての $l$ で成り立つので、$\beta_{t}$ は $t\to\infty$ で各 $H^{s'}$ の極限 $\beta_{\infty}$ をもつ。係数で見ると、$\lambda_{j}>0$ の $j$ について $(\beta_{\infty},\varphi_{j})=\int_{0}^{\infty}e^{-s\lambda_{j}}ds\,(\delta\omega,\varphi_{j})=\lambda_{j}^{-1}(\delta\omega,\varphi_{j})$、$\lambda_{j}=0$ では $0$ なので、\ref{gl:green-operator.4} から $\beta_{\infty}=G\delta\omega$、\ref{gl:green-operator.5} から $=\delta G\omega$。3 の式で $t\to\infty$ とすれば、$d$ の連続性と 2 から $\omega-H\omega=d\delta G\omega$。

::: hypcheck
- **$\omega$ が閉形式**：Step 3 で $\Delta\omega=d\delta\omega$ と書けること、$e^{-t\Delta}\omega$ が閉じていることに使った。閉でない形式では、$\omega-e^{-t\Delta}\omega$ は完全形式と余完全形式の和になる（\ref{gl:hodge-decomposition.1} の形）。
- **滑らかさ**：Step 1・3 で部分積分と、$\omega\in H^{2}$ に使った。
- **向き・閉多様体**：$\delta$ と $\Delta$ の定義、スペクトル分解に使った。
- **公理**：新しい選択は使わない。
:::
:::

::: supplement
**前提を変えると.** 4 は \ref{gl:hodge-decomposition.2} の閉形式の分解 $\omega=H\omega+d(\delta G\omega)$ を、熱の流れで作り直したものである。ここではスペクトル分解とグリーン作用素を先に使っているので、新しい証明にはなっていない。しかし、熱方程式の解が全時間で存在して $t\to\infty$ で収束することを放物型方程式の評価から直接示せれば、3・4 の議論はそのまま調和代表元の存在の証明になる。これが**ホッジの定理の熱方程式による証明**の考え方で、ミルグラムとローゼンブルームによるものが知られている（ここでは証明しない）。$\delta\omega=0$ の余閉形式では、同じく $\omega-e^{-t\Delta}\omega$ は余完全形式である。

**似た定理.** 同じ発想は非線形の問題でも強力である。調和写像の熱流（イールズ–サンプソン）は、写像を熱方程式で流してエネルギー最小の調和写像に到達させる方法で、リッチ流は計量そのものを熱方程式に似た方程式で流してならす方法である（いずれもここでは扱わない）。どちらも「熱で流して平衡に落とす」という、このページの線形の議論の拡張である。

**高い視点：坂を下る道筋.** \ref{gl:hodge-theorem.3} は、調和代表元がその類の中でエネルギー（$L^{2}$ ノルム）を最小にすることを言っていた。熱の流れは、類から外れずにエネルギーを減らし続ける道筋で、谷底がちょうど調和代表元である。ホッジ分解が「谷底の場所を一度に計算する」方法だとすれば、熱の流れは「ボールを置いて転がす」方法で、どちらも同じ谷底に着く。
:::

## 熱トレースとマッキーン–シンガーの公式 {#gl:sec-hk-trace}

短い時間の側では、熱トレース $Z(t)=\sum_{j}e^{-t\lambda_{j}}=\int_{M}\operatorname{tr}K_{t}(x,x)\,d\mu_{g}$（\ref{gl:heat-kernel.6}）を考える。$t\to\infty$ では $Z(t)\to\dim\ker P$ で、$t\to0$ では $Z(t)\to\infty$（固有値の個数）である。ホッジのラプラシアンについて交代和をとると、この二つが打ち消し合って $t$ によらない量が残る。

::: proposition マッキーン–シンガーの公式 {#gl:mckean-singer refname="マッキーン–シンガーの公式" keywords="McKean-Singer formula: on a closed oriented Riemannian manifold, sum_k (-1)^k Tr e^{-t Delta_k} = Euler characteristic for every t > 0; supertrace of the heat operator of the Hodge Laplacian; pairing of nonzero eigenspaces of even and odd forms by d + delta" index="マッキーン–シンガーの公式|まっきーんしんがーのこうしき, 熱トレースの交代和|ねつとれーすのこうたいわ, 超トレース|ちょうとれーす"}
$(M,g)$ を向きづけられた閉リーマン多様体とし、$Z_{k}(t)$ を $k$ 次の形式の上のホッジのラプラシアン $\Delta_{k}$ の熱トレース（\ref{gl:heat-kernel.6}）とする。すべての $t>0$ で
$$
\sum_{k=0}^{n}(-1)^{k}Z_{k}(t)=\chi(M).
$$
:::

::: intuition
偶数次の形式と奇数次の形式の上のラプラシアンの固有値は、$0$ を除いてちょうど同じ重複度で現れる。だから熱トレースの交代和をとると、$0$ でない固有値の寄与はすべて打ち消し合い、どの時刻でも調和形式の次元の交代和、つまりオイラー標数だけが残る。
:::

::: proof
**Step 1.** 【主張：$Z_{k}(t)=\sum_{\lambda}e^{-t\lambda}\dim\ker(\Delta_{k}-\lambda)$（$\lambda$ は $\Delta_{k}$ の固有値全体を動く）】\ref{gl:elliptic-spectral-decomposition.2} から、各固有値 $\lambda$ は基底の中にちょうど $\dim\ker(\Delta_{k}-\lambda)$ 回現れる。$Z_{k}(t)$ は正の項の収束級数（\ref{gl:heat-kernel.6}）なので、同じ値の項をまとめてよい。

**Step 2.** 【主張：$\lambda>0$ について $E^{\mathrm{ev}}_{\lambda}\defeq\bigoplus_{k\text{ 偶数}}\ker(\Delta_{k}-\lambda)$ と $E^{\mathrm{odd}}_{\lambda}\defeq\bigoplus_{k\text{ 奇数}}\ker(\Delta_{k}-\lambda)$ は同じ次元をもつ】$D\defeq d+\delta$ は次数を $\pm1$ ずらすので、偶数次の形式を奇数次の形式に、奇数次を偶数次に写す。$d^{2}=\delta^{2}=0$ から $D^{2}=d\delta+\delta d=\Delta$（各次数で）、したがって $D\Delta=D^{3}=\Delta D$。$\omega\in E^{\mathrm{ev}}_{\lambda}$（滑らか）なら $\Delta D\omega=D\Delta\omega=\lambda D\omega$ で、$\Delta$ は次数を保つので $D\omega$ の各次数の成分も固有値 $\lambda$ の固有形式であり、$D\omega\in E^{\mathrm{odd}}_{\lambda}$。$D\omega=0$ なら $\lambda\omega=\Delta\omega=D^{2}\omega=0$ で $\omega=0$ なので、$D\colon E^{\mathrm{ev}}_{\lambda}\to E^{\mathrm{odd}}_{\lambda}$ は単射。逆向きも同様で、どちらも有限次元なので次元は等しい。

**Step 3.** 【主張：公式】Step 1 から、交代和は絶対収束する級数の並べ替えとして
$$
\sum_{k}(-1)^{k}Z_{k}(t)=\sum_{\lambda\ge0}e^{-t\lambda}\bigl(\dim E^{\mathrm{ev}}_{\lambda}-\dim E^{\mathrm{odd}}_{\lambda}\bigr)
$$
と書ける。Step 2 から $\lambda>0$ の項は $0$ で、$\lambda=0$ の項は $\sum_{k}(-1)^{k}\dim_{\mathbb{C}}\mathcal{H}^{k}_{\mathbb{C}}$。\ref{gl:harmonic-projection.1} から $\dim_{\mathbb{C}}\mathcal{H}^{k}_{\mathbb{C}}=\dim_{\mathbb{R}}\mathcal{H}^{k}$、\ref{gl:hodge-theorem.2} からこれは $b_{k}$ で、和は $\chi(M)$。

::: hypcheck
- **ホッジの定理**：Step 3 で調和形式の次元をベッチ数に置き換えるのに使った。それを使わなければ、右辺は「調和形式の次元の交代和」になる。
- **$d^{2}=0$**：Step 2 で $D^{2}=\Delta$ に使った。これが偶数次と奇数次の固有空間を対にする仕組みである。
- **熱トレースの有限性**：Step 1・3 の並べ替えに使った（\ref{gl:eigen-growth.4}）。
- **公理**：新しい選択は使わない。
:::
:::

::: supplement
**前提を変えると.** 同じ証明は、$D^{+}\colon\Gamma(E^{+})\to\Gamma(E^{-})$ と形式的随伴 $D^{-}$ で $D^{-}D^{+}$, $D^{+}D^{-}$ が非負の楕円型になる一般の場合に通り、$\operatorname{Tr}e^{-tD^{-}D^{+}}-\operatorname{Tr}e^{-tD^{+}D^{-}}=\operatorname{ind}D^{+}$ を与える（$D^{+}$ が $0$ でない固有値の固有空間を同型に写すため）。$d+\delta$ の場合は \ref{gl:euler-index} の指数がオイラー標数であることと一致する。向き付けを外しても、$\delta$ と $\Delta$ は局所的に定まるので同じ公式が成り立つ（\ref{gl:hodge-theorem} の後の補足）。

**似た定理.** 熱トレースの $t\to\infty$ の極限が核の次元、$t\to0$ の振る舞いが局所的な幾何で決まる、という対比は、トレース公式（セルバーグのトレース公式など）や、ゼータ関数 $\sum_{\lambda_{j}>0}\lambda_{j}^{-s}=\frac{1}{\Gamma(s)}\int_{0}^{\infty}t^{s-1}(Z(t)-\dim\ker P)\,dt$ による行列式の定義（解析的捩率）にも現れる（いずれもここでは扱わない）。

**高い視点：時間に左右されない量.** 熱トレースそのものは時間とともに変わるが、交代和は時間によらない。$t\to\infty$ で見れば位相（ベッチ数）だけが、$t\to0$ で見れば各点の近くの幾何（曲率）だけが見える。両者が同じ数だというのが、次の補足の「熱による指数定理の証明」の核心である。遠くから見たときの形（大域的な位相）と、虫眼鏡で見たときの形（局所的な曲率）が、一つの時間によらない量でつながっている。
:::

短い時間での熱核の振る舞いについては、次の事実が知られている。

::: fact 熱核の短時間の漸近展開 {#gl:heat-asymptotic-expansion keywords="short time asymptotic expansion of the heat kernel on the diagonal (Minakshisundaram-Pleijel): tr K_t(x,x) ~ (4 pi t)^{-n/2} sum_i t^i tr a_i(x) for Laplace type operators; a_0 = identity, a_1 = scalar curvature / 6 for the Laplacian on functions; heat trace Z(t) ~ (4 pi t)^{-n/2} (rank vol(M) + t/6 int scal + ...)" index="熱核の漸近展開|ねつかくのぜんきんてんかい, ミナクシサンドラム–プレイエルの展開|みなくしさんどらむぷれいえるのてんかい, 熱トレースの漸近展開|ねつとれーすのぜんきんてんかい"}
$P$ を、主表象が $|\xi|_{g}^{2}\cdot\mathrm{id}$ の形の（**ラプラス型**の）形式的に自己共役で非負な $2$ 階の作用素とする（関数の上のラプラシアン、ホッジのラプラシアンはこの形）。$M$ の上の滑らかな自己準同型 $a_{i}(x)\in\operatorname{End}(E_{x})$（$i=0,1,2,\dots$）があって、各 $N$ について $0<t\le1$ で一様に
$$
\Bigl|\operatorname{tr}K_{t}(x,x)-(4\pi t)^{-n/2}\sum_{i=0}^{N}t^{i}\operatorname{tr}a_{i}(x)\Bigr|\le C_{N}\,t^{N+1-n/2}.
$$
$a_{0}=\mathrm{id}$ で、$a_{i}(x)$ は $x$ での計量と $P$ の係数の有限階の導関数の多項式である。関数の上のラプラシアンでは $a_{1}=\frac{\tau}{6}$（$\tau$ はスカラー曲率、\ref{riem:ricci-scalar}）。とくに
$$
Z(t)=(4\pi t)^{-n/2}\Bigl(\operatorname{vol}(M)+\frac t6\int_{M}\tau\,d\mu_{g}+O(t^{2})\Bigr)\qquad(t\to0+).
$$
（ここでは証明しない。Berline–Getzler–Vergne『Heat Kernels and Dirac Operators』、Rosenberg『The Laplacian on a Riemannian Manifold』を参照。）
:::

::: example
平坦トーラスでは \ref{gl:torus-heat-kernel.3} から $Z(t)=(4\pi t)^{-n/2}(2\pi)^{n}(1+o(t^{N}))$ で、曲率が $0$ なので $a_{i}=0$（$i\ge1$）と整合する。単位球面 $S^{2}$ では \ref{gl:sphere-spectrum.2} から $Z(t)=\sum_{l\ge0}(2l+1)e^{-l(l+1)t}$。$f(x)\defeq(2x+1)e^{-x(x+1)t}$ について置換 $v=x(x+1)$ で $\int_{0}^{\infty}f\,dx=\frac1t$、オイラー–マクローリンの和公式の最初の項 $\frac{f(0)}{2}-\frac{f'(0)}{12}=\frac12-\frac{2-t}{12}$ から $Z(t)=\frac1t+\frac13+O(t)$ が得られる（剰余の評価はここでは省く。数値的にも $t=0.01$ で $Z=100.334\ldots$）。$\operatorname{vol}(S^{2})=4\pi$, $\tau=2$ を上の式に入れると $(4\pi t)^{-1}(4\pi+\frac t6\cdot2\cdot4\pi)=\frac1t+\frac13$ で、一致する。
:::

::: supplement
**スペクトルから聞こえるもの.** 熱トレースはスペクトルだけで決まるので、漸近展開の係数、すなわち次元 $n$、体積 $\operatorname{vol}(M)$、全スカラー曲率 $\int\tau$ はスペクトルから決まる。$2$ 次元ではガウス–ボネの定理から $\int\tau=2\int K\,dA=4\pi\chi(M)$ なので、閉曲面の位相（向きづけられていれば種数）もスペクトルから「聞こえる」。展開の主要項 $Z(t)\sim(4\pi t)^{-n/2}\operatorname{vol}(M)$ にカラマタのタウバー型定理を使うと、ワイルの漸近公式 $\#\{j:\lambda_{j}\le\lambda\}\sim(4\pi)^{-n/2}\Gamma(\frac n2+1)^{-1}\operatorname{vol}(M)\lambda^{n/2}$ が出る（\ref{gl:elliptic-spectral-decomposition} の後の補足の形と同じ定数。ここでは証明しない）。

**熱によるガウス–ボネと指数定理の考え方.** \ref{gl:mckean-singer} の左辺は $t$ によらないので、$t\to0$ として漸近展開を代入すると
$$
\begin{aligned}\chi(M)=&\sum_{i=0}^{N}(4\pi)^{-n/2}t^{i-n/2}\int_{M}\sum_{k}(-1)^{k}\operatorname{tr}a_{i}^{(k)}\,d\mu_{g}\\&+O(t^{N+1-n/2})\end{aligned}
$$
（$a_{i}^{(k)}$ は $\Delta_{k}$ の係数）。左辺は定数なので、$t$ の負の冪の係数はすべて $0$ で、$n$ が偶数なら $\chi(M)=(4\pi)^{-n/2}\int_{M}\sum_{k}(-1)^{k}\operatorname{tr}a_{n/2}^{(k)}\,d\mu_{g}$、$n$ が奇数なら $t^{0}$ の項がないので $\chi(M)=0$（\ref{gl:euler-index.4} と一致）。ここまでは漸近展開を認めれば厳密である。曲面（$n=2$）では、ワイツェンベックの公式から $1$ 形式の上で $\Delta_{1}$ のリッチ曲率の項を計算すると $\sum_{k}(-1)^{k}\operatorname{tr}a_{1}^{(k)}=\frac{\tau}{6}+\frac{2\tau}{3}+\frac{\tau}{6}=\tau=2K$（$K$ はガウス曲率）となり、$\chi(M)=\frac{1}{2\pi}\int_{M}K\,dA$、すなわち \see{surf:gauss-bonnet-global} が得られる（係数の計算はここでは証明しない）。一般の偶数次元で、被積分関数の中の高い階数の導関数が打ち消し合い、ちょうどオイラー形式（曲率のパフィアン）が残ること（チャーン–ガウス–ボネの定理の局所版）はパトディが示した。同じ道筋をディラック作用素に使うのが、アティヤ–シンガーの指数定理の熱核による証明（ゲッツラーの方法など）である（いずれもここでは証明しない）。
:::

## 問題 {#gl:sec-hk-asym-problems}

::: problem {#gl:prob-hk-disconnected}
$M$ を閉リーマン多様体で、連結成分 $M_{1},\dots,M_{N}$ をもつものとし、$K$ を関数の上のラプラシアンの熱核とする。
1. $\ker\Delta$ は各 $M_{i}$ の上で定数な関数の全体で、$\mathbf{1}_{M_{i}}$ を $M_{i}$ の上で $1$、ほかで $0$ の関数とすると、$\{\operatorname{vol}(M_{i})^{-1/2}\mathbf{1}_{M_{i}}\}$ がその正規直交基底であることを示せ。
2. $t\to\infty$ で $K_{t}(x,y)$ は一様に $K_{\infty}(x,y)=\sum_{i}\operatorname{vol}(M_{i})^{-1}\mathbf{1}_{M_{i}}(x)\mathbf{1}_{M_{i}}(y)$ に収束することを示し、その意味を熱の言葉で説明せよ。
3. $x$, $y$ が異なる成分にあるなら、すべての $t>0$ で $K_{t}(x,y)=0$ であることを示せ。
:::

::: solution
**1.** 各 $M_{i}$ は開かつ閉な部分多様体で、それ自身が連結な閉リーマン多様体である。$u\in\ker\Delta$ は滑らかで（\ref{gl:elliptic-kernel-range.1}）、$M_{i}$ への制限は $M_{i}$ の上の $\Delta u=0$ を満たすので、実部と虚部に \ref{gl:closed-manifold-laplacian.4} を使って $M_{i}$ の上で定数。逆に $\mathbf{1}_{M_{i}}$ は滑らか（成分が開集合なので局所的に定数）で $\Delta\mathbf{1}_{M_{i}}=0$。台が互いに交わらないので直交し、$\|\mathbf{1}_{M_{i}}\|^{2}=\operatorname{vol}(M_{i})$。

**2.** \ref{gl:heat-long-time.3} の $K_{\infty}=\sum_{\lambda_{j}=0}\varphi_{j}(x)\overline{\varphi_{j}(y)}$ に 1 の基底を入れたものである（\ref{gl:heat-kernel.3} と同じく、$\Pi_{0}$ の核は基底によらない）。点 $y$ に置いた単位の熱は、長い時間の後、$y$ を含む成分 $M_{i}$ 全体に一様に（密度 $\operatorname{vol}(M_{i})^{-1}$ で）広がり、ほかの成分には移らない。

**3.** $u_{0}\defeq\mathbf{1}_{M_{i}}$（$y\in M_{i}$, $x\notin M_{i}$）について $e^{-t\Delta}u_{0}=u_{0}$（\ref{gl:heat-semigroup.1}）なので、$x$ で $\int K_{t}(x,y')\mathbf{1}_{M_{i}}(y')\,dy'=0$。$K_{t}\ge0$（\ref{gl:heat-kernel-positivity.1}）で $y'\mapsto K_{t}(x,y')$ は連続なので、$M_{i}$ の上で $K_{t}(x,\cdot)=0$（もし $y'\in M_{i}$ で正なら、その近くの開集合で正で、測度が正の集合の上の積分が正になる。\ref{gl:riemannian-measure.2}）。とくに $K_{t}(x,y)=0$。
:::

::: problem {#gl:prob-hk-sphere-forms}
単位球面 $S^{2}$（誘導計量、標準的な向き）の上のホッジのラプラシアン $\Delta_{0}$, $\Delta_{1}$, $\Delta_{2}$ を考える。
1. $\lambda>0$ について $\ker(\Delta_{1}-\lambda)=d\bigl(\ker(\Delta_{0}-\lambda)\bigr)\oplus\delta\bigl(\ker(\Delta_{2}-\lambda)\bigr)$ で、$d$ と $\delta$ はそれぞれ単射であることを示せ。また $\ker\Delta_{1}=0$ を示せ。
2. $\star$ を使って $\ker(\Delta_{2}-\lambda)=\star\ker(\Delta_{0}-\lambda)$ を示し、$\Delta_{1}$ の固有値が $l(l+1)$（$l\ge1$、重複度 $2(2l+1)$）であることを導け。
3. $Z_{0}(t)-Z_{1}(t)+Z_{2}(t)=2$ を 2 から直接確かめ、\ref{gl:mckean-singer} と比べよ。
:::

::: solution
**1.** $f\in\ker(\Delta_{0}-\lambda)$ は滑らかで、記法の節の $\Delta d=d\Delta$ から $\Delta_{1}df=d\Delta_{0}f=\lambda df$。$df=0$ なら $f$ は局所的に定数で $\lambda f=\Delta_{0}f=0$、$f=0$ なので $d$ は単射。$\beta\in\ker(\Delta_{2}-\lambda)$ についても $\Delta_{1}\delta\beta=\lambda\delta\beta$ で、$\delta\beta=0$ なら（$d\beta=0$ は $3$ 形式なので自明）$\lambda\beta=\Delta_{2}\beta=0$、$\beta=0$。$df$ と $\delta\beta$ は \ref{gl:harmonic-projection.3} から直交する。逆に $\omega\in\ker(\Delta_{1}-\lambda)$ なら $\omega=\lambda^{-1}\Delta\omega=d(\lambda^{-1}\delta\omega)+\delta(\lambda^{-1}d\omega)$ で、$\Delta_{0}\delta\omega=\delta\Delta_{1}\omega=\lambda\delta\omega$、同様に $d\omega\in\ker(\Delta_{2}-\lambda)$。$\ker\Delta_{1}=\mathcal{H}^{1}_{\mathbb{C}}=0$ は \ref{gl:sphere-surface-harmonic.1}（$\mathcal{H}^{1}=0$）と \ref{gl:harmonic-projection.1} から。

**2.** \ref{gl:star-laplacian.2} から $\star\Delta=\Delta\star$ で、$\star\colon\Omega^{0}_{\mathbb{C}}\to\Omega^{2}_{\mathbb{C}}$ は全単射（$\star\star=1$）なので、$\star$ は $\ker(\Delta_{0}-\lambda)$ を $\ker(\Delta_{2}-\lambda)$ の上へ同型に写す。\ref{gl:sphere-spectrum.2} から $\ker(\Delta_{0}-\lambda)\ne0$ は $\lambda=l(l+1)$ のときに限り次元 $2l+1$ なので、1 から $\Delta_{1}$ の正の固有値は $l(l+1)$（$l\ge1$）で、重複度は $(2l+1)+(2l+1)$。$0$ は 1 から固有値でない。

**3.** $Z_{0}(t)=Z_{2}(t)=\sum_{l\ge0}(2l+1)e^{-l(l+1)t}$、$Z_{1}(t)=\sum_{l\ge1}2(2l+1)e^{-l(l+1)t}$ なので、$Z_{0}-Z_{1}+Z_{2}$ では $l\ge1$ の項が $(1-2+1)(2l+1)e^{-l(l+1)t}=0$ となり、$l=0$ の項 $1+1=2$ だけが残る。$\chi(S^{2})=b_{0}-b_{1}+b_{2}=1-0+1=2$ で、\ref{gl:mckean-singer} と一致する。1 の対応は、その証明の Step 2 の $D=d+\delta$ による対を具体的に書いたものである。
:::
