# 演習：楕円型作用素とホッジの定理 {#gl:page-exercises-elliptic-hodge keywords="exercises, elliptic operators, Hodge theorem"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、球面とトーラスの上の具体的な作用素の主表象と転置の計算、楕円性の判定と、楕円型でないのに核が有限次元になる例、点に集中した形式的フーリエ級数と係数の凍結の定数、円周の上の交換子と評価の積み上げ、方形波を右辺とするポアソン方程式と 1 階の作用素のゲージ変換、円周のレゾルベントの積分核と符号の定まらない系のスペクトル、球面調和関数への分解と六角トーラスのスペクトル、球面と一様でない円周の上のホッジ分解と調和代表元、ベッチ数とポアンカレ双対性の計算、トーラスの 1 形式のホッジ分解である。いくつかのページの結果を組み合わせる問題として、球面の 1 形式のホッジのラプラシアンのスペクトルと、トーラスの $d+\delta$ の指数の直接の計算を置いた。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#gl:sec-exeh-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。主表象の約束は $\partial_{j}\mapsto i\xi_{j}$（\ref{gl:principal-symbol}）、関数のラプラシアンは $\Delta=-\operatorname{div}\operatorname{grad}$ で、座標では $\Delta u=-\frac{1}{\sqrt{g}}\sum_{i,j}\partial_{i}(\sqrt{g}\,g^{ij}\partial_{j}u)$（\ref{gl:divergence-unoriented} の後の式）。
- 平坦トーラス $T^{n}$、$p(t)=(e^{it_{1}},\dots,e^{it_{n}})$、$e_{m}$、フーリエ係数 $\hat{u}(m)$、ベクトル場 $D_{j}$ は \ref{gl:sec-nt-torus} のとおりで、$\Delta=-\sum_{j}D_{j}^{2}$、$D_{j}e_{m}=im_{j}e_{m}$（\ref{gl:laplacian-examples.2}）。$n=1$ では関数 $u$ を $2\pi$ 周期関数 $u\circ p$ と同一視し、$D=D_{1}=d/dt$ と書く。一周期の積分は区間の位置によらない。$u,w\in L^{2}(T^{n})$ について、\ref{gl:torus-fourier-basis.2} の正規直交基底で内積を展開し $\widehat{\bar{w}}(m)=\overline{\hat{w}(-m)}$ を使うと
$$
\int_{T^{n}}uw\,d\mu_{g}=(2\pi)^{n}\sum_{m}\hat{u}(m)\,\hat{w}(-m).
$$
- 単位球面 $S^{2}$ では球面座標 $(\theta,\phi)$ を使い、$\sqrt{g}=\sin\theta$, $g^{\theta\theta}=1$, $g^{\phi\phi}=\sin^{-2}\theta$（\ref{gl:rm-examples.1}）、$\Delta$ の式は \ref{gl:laplacian-examples.1}。$x,y,z$ は座標関数の制限で $x=\sin\theta\cos\phi$, $y=\sin\theta\sin\phi$, $z=\cos\theta$。向きは、この座標で $\mathrm{vol}_{g}=\sin\theta\,d\theta\wedge d\phi$ となるものをとる。このとき $(d\theta,\sin\theta\,d\phi)$ は正の正規直交な余接フレームである。座標近傍の定義域は稠密なので、連続な関数・形式の等式はその上で確かめれば全体で成り立つ（\ref{gl:laplacian-examples} の冒頭と同じ）。$\int_{S^{2}}G(z)\,d\mu_{g}=2\pi\int_{-1}^{1}G(s)\,ds$（球面座標で $s=\cos\theta$ と置換）。
- 切断と形式の $L^{2}$ の内積は $(u,v)\defeq\int_{M}h(u,\bar{v})\,d\mu_{g}$（\ref{gl:sec-er-weak-notation}, \ref{gl:sec-ho-notation}）。
- **選択公理**：引用する各ページの結果に含まれるもの（1 の分割と核の有限次元性の DC、スペクトル定理の DC など）のほかには使わない。基底はすべて具体的な生成系にグラム–シュミットの直交化を施して作る。
:::

## 主表象 {#gl:sec-ps-exercises}

対応するページ：\ref{gl:page-principal-symbol}

::: problem ★ 基本：球面のラプラシアンの主表象と振動による検算 {#gl:ex-ps-1}
$S^{2}$ の上で考え、$R$ を $\mathbb{R}^{3}$ のベクトル場 $(-y,x,0)$ の $S^{2}$ への制限とする（$S^{2}$ に接する）。
1. 球面座標での $\Delta$ の係数から、$\xi=\xi_{\theta}d\theta+\xi_{\phi}d\phi$ について $\sigma_{\Delta}(m,\xi)=\xi_{\theta}^{2}+\sin^{-2}\theta\,\xi_{\phi}^{2}$ を求め、\ref{gl:principal-symbol-examples.3} と一致することを確かめよ。
2. 滑らかな $u$ と実数 $t$ について
$$
e^{-itz}\Delta(e^{itz}u)=t^{2}(1-z^{2})u+2it\bigl(zu-\langle\operatorname{grad}z,\operatorname{grad}u\rangle\bigr)+\Delta u
$$
を示し、\ref{gl:symbol-oscillation} の $t^{2}$ の係数が $\sigma_{\Delta}(m,dz_{m})u(m)$ に一致することを確かめよ。両極では何が起こるか。
3. 球面座標で $R=\partial_{\phi}$ を示し、$\sigma_{R}$（$1$ 次）と $\sigma_{R^{2}}$, $\sigma_{\Delta+R^{2}}$（$2$ 次）を求めよ。$\sigma_{\Delta+R^{2}}(m,\xi)=0$ となる $\xi\neq0$ がある点 $m$ をすべて求めよ。
:::

::: solution
**1.** \ref{gl:laplacian-examples.1} を展開すると $\Delta=-\partial_{\theta}^{2}-\cot\theta\,\partial_{\theta}-\sin^{-2}\theta\,\partial_{\phi}^{2}$ で、$2$ 階の係数は $-1$, $-\sin^{-2}\theta$（混合項なし）。よって $\sigma_{\Delta}=(-1)(i\xi_{\theta})^{2}+(-\sin^{-2}\theta)(i\xi_{\phi})^{2}=\xi_{\theta}^{2}+\sin^{-2}\theta\,\xi_{\phi}^{2}=g^{\theta\theta}\xi_{\theta}^{2}+g^{\phi\phi}\xi_{\phi}^{2}=|\xi|^{2}$。

**2.** 複素数値の滑らかな $f$, $u$ について $\Delta(fu)=f\Delta u+u\Delta f-2\langle\operatorname{grad}f,\operatorname{grad}u\rangle$（$\langle\cdot,\cdot\rangle$ は双線形に延ばす）。両辺は $(f,u)$ について複素双線形で、実数値のときは $\operatorname{grad}(fu)=f\operatorname{grad}u+u\operatorname{grad}f$ と \ref{gl:divergence-unoriented.2} から出る。$f=e^{itz}$ では $\operatorname{grad}f=itf\operatorname{grad}z$ で、同じ \ref{gl:divergence-unoriented.2} から
$$
\Delta f=-it\bigl(f\operatorname{div}\operatorname{grad}z+\langle\operatorname{grad}f,\operatorname{grad}z\rangle\bigr)=itf\,\Delta z+t^{2}f\,|\operatorname{grad}z|^{2}.
$$
$\Delta z=2z$（\ref{gl:laplacian-examples.1}）、$|\operatorname{grad}z|^{2}=|\partial_{\theta}\cos\theta|^{2}=\sin^{2}\theta=1-z^{2}$ を入れて $f$ で割れば主張の式。$t^{2}$ の係数は $(1-z^{2})u$ で、$\sigma_{\Delta}(m,dz_{m})=|dz_{m}|^{2}=|\operatorname{grad}z|^{2}(m)=1-z(m)^{2}$ と一致する。両極では $dz=0$ なので $t^{2}$ の係数が消え、式は $\Delta u\pm2itu$ という $1$ 次式になる（$\sigma_{\Delta}(m,0)=0$）。

**3.** 球面座標の写像を $\phi$ で微分すると $(-\sin\theta\sin\phi,\sin\theta\cos\phi,0)=(-y,x,0)$ なので $R=\partial_{\phi}$。\ref{gl:principal-symbol-examples.2} から $\sigma_{R}(m,\xi)=i\xi(R_{m})=i\xi_{\phi}$、\ref{gl:symbol-calculus.1} から $\sigma_{R^{2}}=-\xi_{\phi}^{2}$、$\sigma_{\Delta+R^{2}}=\xi_{\theta}^{2}+(\sin^{-2}\theta-1)\xi_{\phi}^{2}=\xi_{\theta}^{2}+\cot^{2}\theta\,\xi_{\phi}^{2}$。これが $\xi\neq0$ で $0$ になるのは $\xi_{\theta}=0$, $\xi_{\phi}\neq0$, $\cot\theta=0$、つまり赤道 $\theta=\frac{\pi}{2}$ の点で $\xi$ が $d\phi$ の定数倍のときだけ。座標近傍から外れた半大円 $C$ の極以外の点は、$\phi$ の範囲を $(-\pi,\pi)$ にずらした球面座標で同じ計算をすればよい。両極では $R=0$ なので $\sigma_{R^{2}}=0$、$\sigma_{\Delta+R^{2}}=|\xi|^{2}>0$。よって求める点は赤道上の点全体で、$\Delta+R^{2}$ は楕円型でない（\see{gl:elliptic-operator}）。
:::

::: problem ★★ 標準：座標変換と転置での最高階の係数 {#gl:ex-ps-2}
1. 平坦トーラス $T^{2}$ の開集合 $W\defeq p(\{(r\cos\vartheta,r\sin\vartheta):0<r<1,\ 0<\vartheta<2\pi\})$ の上で $(r,\vartheta)$ を座標とする。この座標で $\Delta=-\partial_{r}^{2}-r^{-1}\partial_{r}-r^{-2}\partial_{\vartheta}^{2}$ を示せ（$1$ 階の係数が座標による）。$\xi=\xi_{1}dt_{1}+\xi_{2}dt_{2}=\eta_{r}dr+\eta_{\vartheta}d\vartheta$ について、$(\eta_{r},\eta_{\vartheta})$ を $(\xi_{1},\xi_{2})$ で表し、$\eta_{r}^{2}+r^{-2}\eta_{\vartheta}^{2}=\xi_{1}^{2}+\xi_{2}^{2}$ を確かめて \ref{gl:principal-symbol-invariance} と照らし合わせよ。
2. $S^{2}$ の上のベクトル場 $T\defeq\operatorname{grad}z$ と、$(-y,x,0)$ の制限 $R$ について、球面座標で $T=-\sin\theta\,\partial_{\theta}$ を示し、\ref{gl:formal-transpose.2} から $T^{t}=-T+2z$, $R^{t}=-R$ を導け。主表象を \ref{gl:symbol-calculus.2} と比べよ。
3. $T^{t}T=-\sin^{2}\theta\,\partial_{\theta}^{2}-3\sin\theta\cos\theta\,\partial_{\theta}$ を示し、係数から求めた主表象と \ref{gl:symbol-calculus.1}・\ref[2]{gl:symbol-calculus.2} から求めた $\xi(T_{m})^{2}$ が一致することを確かめよ。
:::

::: solution
**1.** $W$ は $p(Q)$（$Q=(-\pi,\pi)^{2}$）に含まれ、$x_{a}$（$a=(-\pi,-\pi)$）で見ると $B(0,1)$ から半直線 $\{(s,0):s\ge0\}$ を除いた集合で、$\Psi(r,\vartheta)\defeq(r\cos\vartheta,r\sin\vartheta)$ はそこへの微分同相写像なので、$\Psi^{-1}\circ x_{a}$ は座標近傍。$dt_{1}=\cos\vartheta\,dr-r\sin\vartheta\,d\vartheta$, $dt_{2}=\sin\vartheta\,dr+r\cos\vartheta\,d\vartheta$ から計量は $dr^{2}+r^{2}d\vartheta^{2}$、$\sqrt{g}=r$, $g^{rr}=1$, $g^{\vartheta\vartheta}=r^{-2}$ で
$$
\Delta u=-\frac{1}{r}\Bigl(\partial_{r}(r\,\partial_{r}u)+\partial_{\vartheta}(r^{-1}\partial_{\vartheta}u)\Bigr)=-\partial_{r}^{2}u-r^{-1}\partial_{r}u-r^{-2}\partial_{\vartheta}^{2}u.
$$
$t$ の座標では $1$ 階の項はないが、ここでは $-r^{-1}\partial_{r}$ が現れる。$\xi_{1}dt_{1}+\xi_{2}dt_{2}$ に上の式を入れると $\eta_{r}=\xi_{1}\cos\vartheta+\xi_{2}\sin\vartheta$, $\eta_{\vartheta}=r(-\xi_{1}\sin\vartheta+\xi_{2}\cos\vartheta)$ で、$(\eta_{r},r^{-1}\eta_{\vartheta})$ は $(\xi_{1},\xi_{2})$ の回転なので $\eta_{r}^{2}+r^{-2}\eta_{\vartheta}^{2}=\xi_{1}^{2}+\xi_{2}^{2}$。左辺は $(r,\vartheta)$ の $2$ 階の係数 $-1$, $-r^{-2}$ から作った主表象、右辺は $t$ の座標での主表象で、余接ベクトルの成分として読めば一致する。

**2.** $T=\sum_{i,j}g^{ij}\partial_{j}z\,\partial_{i}=\partial_{\theta}(\cos\theta)\,\partial_{\theta}=-\sin\theta\,\partial_{\theta}$。\ref{gl:formal-transpose.2}（$\gamma=\sin\theta$）から
$$
T^{t}v=-\frac{1}{\sin\theta}\partial_{\theta}\bigl(\sin\theta\cdot(-\sin\theta)v\bigr)=2\cos\theta\,v+\sin\theta\,\partial_{\theta}v=-Tv+2zv,
$$
$R^{t}v=-\frac{1}{\sin\theta}\partial_{\phi}(\sin\theta\,v)=-Rv$。両辺は $S^{2}$ の上の滑らかな関数なので全体で成り立つ。主表象は $\sigma_{T^{t}}=-i\xi(T_{m})=-\sigma_{T}$, $\sigma_{R^{t}}=-\sigma_{R}$ で、\ref{gl:symbol-calculus.2}（$k=1$）のとおり。$0$ 階の部分 $2z=\Delta z=-\operatorname{div}T$ は主表象からは決まらない。

**3.** $T(Tv)=-\sin\theta\,\partial_{\theta}(-\sin\theta\,\partial_{\theta}v)=\sin\theta\cos\theta\,\partial_{\theta}v+\sin^{2}\theta\,\partial_{\theta}^{2}v$ と $2zTv=-2\sin\theta\cos\theta\,\partial_{\theta}v$ から $T^{t}Tv=-T(Tv)+2zTv$ は主張の式。$2$ 階の係数から $\sigma=-\sin^{2}\theta\,(i\xi_{\theta})^{2}=\sin^{2}\theta\,\xi_{\theta}^{2}$。一方 $\sigma_{T^{t}}\sigma_{T}=(-i\xi(T_{m}))(i\xi(T_{m}))=\xi(T_{m})^{2}=(-\sin\theta\,\xi_{\theta})^{2}$ で一致する。これは $\ge0$ だが $\xi=d\phi$ で $0$ になる。
:::

## 楕円性とトーラス上の評価 {#gl:sec-el-exercises}

対応するページ：\ref{gl:page-ellipticity}

::: problem ★ 基本：楕円性の判定 {#gl:ex-el-1}
$T^{2}$ の上の次の定数係数の作用素が（書かれた最高階の作用素として）楕円型かどうかを判定し、楕円型でなければ特性方向をすべて求めよ。
1. $P_{1}\defeq D_{1}^{2}+D_{1}D_{2}+D_{2}^{2}$、$P_{2}\defeq D_{1}^{2}+3D_{1}D_{2}+D_{2}^{2}$。
2. $P_{3}\defeq D_{1}^{4}+D_{2}^{4}+D_{1}$（$4$ 階）、$P_{4}\defeq D_{1}^{2}+iD_{2}$（$2$ 階）。
3. $\mathbb{C}^{2}$ 値の $(u,v)$ に作用する $1$ 階の $Q_{1}(u,v)\defeq(D_{1}u-D_{2}v,\ D_{2}u+D_{1}v)$ と $Q_{2}(u,v)\defeq(D_{1}u+D_{2}v,\ D_{2}u+D_{1}v)$。
:::

::: solution
主表象は \ref{gl:sec-el-torus} の式 $\sigma_{P}(\xi)=\sum_{|\alpha|=k}A_{\alpha}(i\xi)^{\alpha}$ で計算する。

**1.** $\sigma_{P_{1}}=-(\xi_{1}^{2}+\xi_{1}\xi_{2}+\xi_{2}^{2})=-\bigl((\xi_{1}+\tfrac12\xi_{2})^{2}+\tfrac34\xi_{2}^{2}\bigr)$ は $\xi\neq0$ で負なので楕円型。$\sigma_{P_{2}}=-(\xi_{1}^{2}+3\xi_{1}\xi_{2}+\xi_{2}^{2})$ は、$\xi_{2}=0$ なら $-\xi_{1}^{2}\neq0$、$\xi_{2}\neq0$ なら $s\defeq\xi_{1}/\xi_{2}$ が $s^{2}+3s+1=0$ を満たすときに $0$。特性方向は $\bigl(\frac{-3\pm\sqrt{5}}{2},1\bigr)$ の $0$ でない実数倍で、$P_{2}$ は楕円型でない。

**2.** $\sigma_{P_{3}}=(i\xi_{1})^{4}+(i\xi_{2})^{4}=\xi_{1}^{4}+\xi_{2}^{4}>0$（$D_{1}$ は下の階数）なので楕円型。$\sigma_{P_{4}}=(i\xi_{1})^{2}=-\xi_{1}^{2}$（$iD_{2}$ は下の階数）なので楕円型でなく、特性方向は $(0,\xi_{2})$, $\xi_{2}\neq0$。

**3.** $Q_{1}$ の係数は $A_{(1,0)}=I$, $A_{(0,1)}=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ で、$\sigma_{Q_{1}}=i\begin{pmatrix}\xi_{1}&-\xi_{2}\\\xi_{2}&\xi_{1}\end{pmatrix}$、行列式は $-(\xi_{1}^{2}+\xi_{2}^{2})\neq0$ なので楕円型（$u+iv$ についてのコーシー–リーマン作用素）。$\sigma_{Q_{2}}=i\begin{pmatrix}\xi_{1}&\xi_{2}\\\xi_{2}&\xi_{1}\end{pmatrix}$ の行列式は $-(\xi_{1}^{2}-\xi_{2}^{2})$ で、特性方向は $(1,\pm1)$ の $0$ でない実数倍。$Q_{2}$ は $u\pm v$ について $D_{1}\pm D_{2}$ に分かれ、それぞれベクトル場一本である。
:::

::: problem ★★ 標準：楕円性と核の有限次元性は別のこと {#gl:ex-el-2}
$T^{2}$ の上の $P_{1}\defeq D_{1}^{2}+D_{1}D_{2}+D_{2}^{2}$, $P_{2}\defeq D_{1}^{2}+3D_{1}D_{2}+D_{2}^{2}$ の全表象を $\mathsf{p}_{1}$, $\mathsf{p}_{2}$ とする。
1. すべての $m\in\mathbb{Z}^{2}$ で $(1+|m|^{2})^{2}\le8|\mathsf{p}_{1}(m)|^{2}+2$ を示し、$u\in H^{2}(T^{2})$ について $\sum_{m}(1+|m|^{2})^{2}|\hat{u}(m)|^{2}\le8\sum_{m}|\widehat{P_{1}u}(m)|^{2}+2\sum_{m}|\hat{u}(m)|^{2}$ を導け（\ref{gl:torus-elliptic-estimate.1} の具体形）。
2. $j=1,2$ について、$P_{j}u=0$ の $L^{2}$ の弱解は定数だけであることを示せ。
3. $a_{0}=b_{0}=1$, $a_{l+1}\defeq b_{l}$, $b_{l+1}\defeq3b_{l}-a_{l}$ とする。$a_{l}^{2}-3a_{l}b_{l}+b_{l}^{2}=-1$ と $b_{l}\to\infty$ を示し、$u_{l}\defeq e_{(a_{l},-b_{l})}$ を使って、$\|u\|_{H^{2}}\le C(\|P_{2}u\|_{L^{2}}+\|u\|_{L^{2}})$ がどの $C$ でも成り立たないことを示せ。
:::

::: solution
**1.** $\mathsf{p}_{1}(m)=-(m_{1}^{2}+m_{1}m_{2}+m_{2}^{2})$ で、$m_{1}^{2}+m_{1}m_{2}+m_{2}^{2}=\frac12(m_{1}^{2}+m_{2}^{2})+\frac12(m_{1}+m_{2})^{2}\ge\frac12|m|^{2}$。よって $|m|^{4}\le4|\mathsf{p}_{1}(m)|^{2}$、$(1+|m|^{2})^{2}\le2(1+|m|^{4})\le2+8|\mathsf{p}_{1}(m)|^{2}$。\ref{gl:torus-sobolev.2} から $\widehat{P_{1}u}(m)=\mathsf{p}_{1}(m)\hat{u}(m)$ なので、$|\hat{u}(m)|^{2}$ を掛けて足せばよい。

**2.** \ref{gl:formal-transpose.2}（$\gamma=1$、定数係数で各項は $2$ 階）から $P_{j}^{t}=P_{j}$。$v=e_{-m}$ について $P_{j}e_{-m}=\mathsf{p}_{j}(-m)e_{-m}=\mathsf{p}_{j}(m)e_{-m}$ で、$\int ue_{-m}\,d\mu_{g}=(2\pi)^{2}\hat{u}(m)$ なので、弱解の定義から $\mathsf{p}_{j}(m)\hat{u}(m)=0$。$\mathsf{p}_{1}(m)=0$ は 1 から $m=0$ のときだけ。$\mathsf{p}_{2}(m)=0$ なら、$m_{2}=0$ のとき $m_{1}=0$、$m_{2}\neq0$ のとき $m_{1}/m_{2}$ は $s^{2}+3s+1=0$ の有理数解だが、解 $\frac{-3\pm\sqrt{5}}{2}$ は無理数なので起こらない。よって $m\neq0$ で $\hat{u}(m)=0$ で、\ref{gl:torus-fourier-basis.1} を $u-\hat{u}(0)$ に使うと $u$ は定数。定数は解である。

**3.** $(a,b)\mapsto(b,3b-a)$ で $b^{2}-3b(3b-a)+(3b-a)^{2}=a^{2}-3ab+b^{2}$ は変わらず、$(1,1)$ で $-1$。また $1\le a_{l}\le b_{l}$ なら $b_{l+1}-b_{l}=2b_{l}-a_{l}\ge1$ で $a_{l+1}=b_{l}\le b_{l+1}$ なので、帰納法で $b_{l}\ge l+1$。$m_{l}\defeq(a_{l},-b_{l})$ について $m_{1}^{2}+3m_{1}m_{2}+m_{2}^{2}=a_{l}^{2}-3a_{l}b_{l}+b_{l}^{2}=-1$ なので $\mathsf{p}_{2}(m_{l})=1$、$P_{2}u_{l}=u_{l}$ で $\|P_{2}u_{l}\|_{L^{2}}=\|u_{l}\|_{L^{2}}=2\pi$。一方 \ref{gl:torus-sobolev.2} の定数 $C'$ について $\|u_{l}\|_{H^{2}}^{2}\ge C'^{-1}(1+a_{l}^{2}+b_{l}^{2})^{2}\to\infty$ なので、評価は成り立たない。$P_{2}$ の核は $P_{1}$ と同じく $1$ 次元で、特性方向に格子点はないが、$\sigma_{P_{2}}(m_{l}/|m_{l}|)=-|m_{l}|^{-2}\to0$ のように特性方向に近づく格子点の列が評価を壊す（\ref{gl:torus-estimate-converse} の証明と同じ仕組み）。核が有限次元であることは楕円性の代わりにならない。
:::

## トーラスの尺度と係数の凍結 {#gl:sec-er-exercises}

対応するページ：\ref{gl:page-frozen-coefficients}

::: problem ★ 基本：一点に集中した形式的フーリエ級数 {#gl:ex-er-1}
$n=r=1$ とし、$c_{0}(m)\defeq1$（すべての $m\in\mathbb{Z}$）とおく（\ref{gl:torus-scale}）。
1. 整数 $t$ について $c_{0}\in\mathcal{H}^{t}\iff t\le-1$ を示し、滑らかな $\varphi$ について $\langle c_{0},\varphi\rangle=2\pi\varphi(o)$ を示せ。
2. $Dc_{0}$、$\cos\cdot c_{0}$、$\sin\cdot c_{0}$、$\sin\cdot(Dc_{0})$ を求め、$\sin\cdot(Dc_{0})=-c_{0}$ を、\ref{gl:torus-scale-operations.5} による対合の計算でも確かめよ。
:::

::: solution
**1.** $\sum_{m}(1+m^{2})^{-1}\le1+2\sum_{m\ge1}m^{-2}<\infty$ で、$\sum_{m}1=\infty$。$t\le-1$ なら $(1+m^{2})^{t}\le(1+m^{2})^{-1}$、$t\ge0$ なら $(1+m^{2})^{t}\ge1$ なので主張が出る。$\langle c_{0},\varphi\rangle=2\pi\sum_{m}\hat{\varphi}(-m)=2\pi\sum_{m}\hat{\varphi}(m)$。\ref{gl:torus-scale-operations.2}（$N=0$）から $\sum|\hat{\varphi}(m)|<\infty$ なので $\sum_{m}\hat{\varphi}(m)e_{m}$ は一様収束して連続関数を定め、\ref{gl:torus-fourier-basis.2} からそれは $\varphi$ と a.e. で等しく、どちらも連続なので至る所等しい（空でない開集合の測度は正）。$o=p(0)$ で評価して $\sum\hat{\varphi}(m)=\varphi(o)$。

**2.** $(Dc_{0})(m)=im$。$\widehat{\cos}(\pm1)=\frac12$、$\widehat{\sin}(\pm1)=\pm\frac{1}{2i}$、ほかは $0$ なので
$$
(\cos\cdot c_{0})(m)=\tfrac{1}{2}\bigl(c_{0}(m-1)+c_{0}(m+1)\bigr)=1,\qquad(\sin\cdot c_{0})(m)=\tfrac{1}{2i}\bigl(c_{0}(m-1)-c_{0}(m+1)\bigr)=0,
$$
$(\sin\cdot Dc_{0})(m)=\frac{1}{2i}\bigl(i(m-1)-i(m+1)\bigr)=-1$。よって $\cos\cdot c_{0}=c_{0}$, $\sin\cdot c_{0}=0$, $\sin\cdot Dc_{0}=-c_{0}$。対合では、\ref{gl:torus-scale-operations.5} と 1 から $\langle\sin\cdot Dc_{0},\varphi\rangle=\langle c_{0},-D(\sin\varphi)\rangle=-2\pi\bigl(\cos0\cdot\varphi(o)+\sin0\cdot(D\varphi)(o)\bigr)=-2\pi\varphi(o)=\langle-c_{0},\varphi\rangle$。$c_{0}$ は $o$ に集中した点質量の $2\pi$ 倍のように振る舞い、超関数の $\sin\cdot\delta=0$, $\sin\cdot\delta'=-\delta$ と同じ関係を満たす。
:::

::: problem ★★ 標準：係数の凍結の定数 {#gl:ex-er-2}
$n=r=1$, $k=2$ とし、$B(p(z))\defeq2+\cos z$、$\breve{P}\defeq BD^{2}$ とする。
1. $\sigma_{0}$ と \ref{gl:frozen-estimate} の最良の $c_{0}$ を求め、\ref{gl:local-elliptic-estimate.1} の条件を $\varepsilon(\delta)$ の式で書け。条件を満たす $\delta\in(0,1]$ の範囲と、そのうち $2^{-l}$ の形の最大のものを求めよ。
2. $P_{0}\defeq3D^{2}$ と $c=\delta_{m}$（$m$ で $1$、ほかで $0$）について \ref{gl:frozen-estimate} の不等式を確かめ、第 2 項が要るのは $m=0$ のときだけであること、第 1 項の係数 $2^{k/2}c_{0}^{-1}$ を $\frac13$ より小さくはできないことを示せ。
3. $b=\cos$, $c=\delta_{m}$ について $\|bc\|_{(1)}$ を求め、\ref{gl:torus-multiplication-estimate.3}（$t=1$）の右辺と比べよ。
:::

::: solution
**1.** $\sigma_{0}(\xi)=B(o)(i\xi)^{2}=-3\xi^{2}$ で $|\sigma_{0}(\xi)v|=3\xi^{2}|v|$ なので、最良の $c_{0}$ は $3$。$n=1$ では $K_{2}=1$ で、条件は $\varepsilon(\delta)\le\frac{3}{2^{2}}=\frac34$。$|B(p(z))-B(o)|=1-\cos z$ は $[0,\pi]$ で増加し、$2\delta\le2<\pi$ なので $\varepsilon(\delta)=\sup_{|z|<2\delta}(1-\cos z)=1-\cos2\delta$。条件は $\cos2\delta\ge\frac14$、すなわち $\delta\le\frac12\arccos\frac14\approx0.659$。$\delta=1$ では $1-\cos2\approx1.416>\frac34$、$\delta=\frac12$ では $1-\cos1\approx0.460\le\frac34$ なので、$2^{-l}$ の形の最大のものは $\frac12$。条件は $t$ を含まない。

**2.** $(P_{0}\delta_{m})(m)=-3m^{2}$ なので $\|P_{0}\delta_{m}\|_{(t)}=3m^{2}(1+m^{2})^{t/2}$, $\|\delta_{m}\|_{(s)}=(1+m^{2})^{s/2}$。不等式 $\|c\|_{(t+2)}\le\frac23\|P_{0}c\|_{(t)}+\|c\|_{(t+1)}$ は $(1+m^{2})^{t/2}$ で割ると $1+m^{2}\le2m^{2}+(1+m^{2})^{1/2}$ で、$m\neq0$ なら $1+m^{2}\le2m^{2}$ だけで成り立ち、$m=0$ では $1\le0+1$ で第 2 項がちょうど必要（$P_{0}\delta_{0}=0$）。係数 $A$ で $\|c\|_{(t+2)}\le A\|P_{0}c\|_{(t)}+\|c\|_{(t+1)}$ が成り立てば、$\delta_{m}$ で $1+m^{2}\le3Am^{2}+(1+m^{2})^{1/2}$、$m^{2}$ で割って $m\to\infty$ とすると $1\le3A$。

**3.** $b\delta_{m}=\frac12(\delta_{m-1}+\delta_{m+1})$ なので $\|b\delta_{m}\|_{(1)}^{2}=\frac14\bigl((1+(m-1)^{2})+(1+(m+1)^{2})\bigr)=1+\frac{m^{2}}{2}$。右辺は $\|b\|_{\infty}=1$, $|b|_{1}=\sum_{j}(1+|j|)|\hat{b}(j)|=2$ から $(1+m^{2})^{1/2}+2$ で、成り立つ。$\|b\delta_{m}\|_{(1)}/\|\delta_{m}\|_{(1)}\to2^{-1/2}<\|b\|_{\infty}$ で、高い周波数では第 1 項の $\|b\|_{\infty}$ が主要である。
:::

## 閉多様体上の楕円型評価 {#gl:sec-erg-exercises}

対応するページ：\ref{gl:page-elliptic-regularity}

::: problem ★ 基本：交換子と補間不等式の計算 {#gl:ex-erg-1}
$T^{1}$ の上で考える。整数 $j\ge0$ について $\llbracket u\rrbracket_{j}^{2}\defeq\sum_{m}(1+m^{2})^{j}|\hat{u}(m)|^{2}$ とおく（\ref{gl:torus-sobolev.2} から $\|u\|_{H^{j}}$ と同値）。
1. $[\Delta,\cos]u=\cos\cdot u+2\sin\cdot Du$ を示し、\ref{gl:commutator-lower-order.1} と比べよ。
2. すべての $\eta>0$ と $u\in H^{2}(T^{1})$ について $\llbracket u\rrbracket_{1}^{2}\le\eta\llbracket u\rrbracket_{2}^{2}+(4\eta)^{-1}\llbracket u\rrbracket_{0}^{2}$ を示し、\ref{gl:sobolev-interpolation} の証明の Step 1 の評価と比べよ。
3. 2 の定数 $(4\eta)^{-1}$ は、$\eta=\frac{1}{2(1+N^{2})}$（$N\in\mathbb{Z}$）のとき小さくできないことを示せ。
:::

::: solution
**1.** $D(\cos u)=-\sin u+\cos Du$, $D^{2}(\cos u)=-\cos u-2\sin Du+\cos D^{2}u$ なので $[\Delta,\cos]u=-D^{2}(\cos u)+\cos D^{2}u=\cos u+2\sin Du$。これはベクトル場 $2\sin\cdot D$ と $0$ 階の項の和で $1$ 階以下、$1$ 次の主表象は $2i\sin t\cdot\xi$（\ref{gl:principal-symbol-examples.2}）で、補題のとおり $2$ 階の部分は消えている。

**2.** $T\ge1$ について $\eta T^{2}+\frac{1}{4\eta}-T=\eta\bigl(T-\frac{1}{2\eta}\bigr)^{2}\ge0$。$T=1+m^{2}$ として $|\hat{u}(m)|^{2}$ を掛けて足す。補題の Step 1（$a=2$）は $T\le\eta T^{2}+\eta^{-1}$ で、定数が $4$ 倍大きい。

**3.** $u=e_{N}$ では $\llbracket u\rrbracket_{j}^{2}=T^{j}$, $T\defeq1+N^{2}$。$T\le\eta T^{2}+C$ が必要で、$\eta=\frac{1}{2T}$ では $C\ge T-\frac{T}{2}=\frac{T}{2}=\frac{1}{4\eta}$。
:::

::: problem ★★ 標準：変数係数の作用素での評価の積み上げ {#gl:ex-erg-2}
$T^{1}$ の上で $a\defeq2+\cos$, $b\defeq\sin$, $P\defeq aD^{2}+bD$ とし、$\|\cdot\|$ を $L^{2}(T^{1})$ のノルムとする。滑らかな $u$ について次を示せ。
1. $\|D^{2}u\|\le\|Pu\|+\|Du\|$、$\|Du\|^{2}\le\|u\|\,\|D^{2}u\|$。
2. $\|D^{2}u\|^{2}\le4\|Pu\|^{2}+4\|u\|^{2}$、$\|Du\|^{2}\le2\|Pu\|^{2}+\frac52\|u\|^{2}$。
3. $D(Pu)=P(Du)-\sin\cdot D^{2}u+\cos\cdot Du$ を示し、$\|D^{3}u\|\le\|D(Pu)\|+6\|Pu\|+6\|u\|$ を導け。これが \ref{gl:elliptic-estimate-l2} のどの場合の具体形か、楕円性がどこで使われたかを述べよ。
:::

::: solution
**1.** 各点で $aD^{2}u=Pu-bDu$、$|a|\ge1$, $|b|\le1$ なので $|D^{2}u|\le|Pu|+|Du|$ で、$L^{2}$ の三角不等式から前半。一周期で部分積分すると（境界項は周期性で消える）$\|Du\|^{2}=\int Du\,\overline{Du}=-\int u\,\overline{D^{2}u}\le\|u\|\,\|D^{2}u\|$。

**2.** 1 と $2xy\le2x^{2}+\frac12y^{2}$ から
$$
\|D^{2}u\|^{2}\le2\|Pu\|^{2}+2\|Du\|^{2}\le2\|Pu\|^{2}+2\|u\|^{2}+\tfrac12\|D^{2}u\|^{2},
$$
よって $\|D^{2}u\|^{2}\le4\|Pu\|^{2}+4\|u\|^{2}$。また $\|Du\|^{2}\le\frac12\|u\|^{2}+\frac12\|D^{2}u\|^{2}\le2\|Pu\|^{2}+\frac52\|u\|^{2}$。

**3.** $D(Pu)=a'D^{2}u+aD^{3}u+b'Du+bD^{2}u=P(Du)+a'D^{2}u+b'Du$ で $a'=-\sin$, $b'=\cos$。1 を $Du$ に使い、この式を入れると
$$
\|D^{3}u\|\le\|P(Du)\|+\|D^{2}u\|\le\|D(Pu)\|+2\|D^{2}u\|+\|Du\|.
$$
2 から $\|D^{2}u\|\le2\|Pu\|+2\|u\|$、$\|Du\|\le2\|Pu\|+2\|u\|$ なので主張が出る。$N_{j}(u)^{2}\defeq\sum_{i\le j}\|D^{i}u\|^{2}=2\pi\sum_{m}\bigl(\sum_{i\le j}m^{2i}\bigr)|\hat{u}(m)|^{2}$ は、$2^{-j}(1+m^{2})^{j}\le\sum_{i\le j}m^{2i}\le(1+m^{2})^{j}$ から $\|u\|_{H^{j}}$ と同値なので、2・3 は \ref{gl:elliptic-estimate-l2} の $k=2$, $s=0,1$ の場合を定数まで具体的にしたものである。楕円性は 1 の $|a|\ge1$（主表象 $-a\xi^{2}$ が $\xi\neq0$ で $0$ にならないこと）で使った。3 の交換子 $[D,P]=a'D^{2}+b'D$ は $2$ 階だが、評価したい $\|D^{3}u\|$ より一段低い $\|D^{2}u\|$ にしか効かない。これは \ref{gl:elliptic-estimate} の証明で交換子 $[P,\psi_{l}]$ を一段弱いノルムに押し込むのと同じ形である。
:::

## 弱解の正則性と核の有限次元性 {#gl:sec-erw-exercises}

対応するページ：\ref{gl:page-weak-regularity}

::: problem ★ 基本：方形波を右辺とするポアソン方程式 {#gl:ex-erw-1}
$T^{1}$ の上で、$f(p(t))\defeq1$（$0<t<\pi$）、$-1$（$-\pi<t<0$）、$u(p(t))\defeq\frac12t(\pi-|t|)$（$|t|\le\pi$）とする。
1. $u$ は $C^{1}$ 級で、$\hat{f}(m)=\frac{1-(-1)^{m}}{i\pi m}$, $\hat{u}(m)=\frac{\hat{f}(m)}{m^{2}}$（$m\neq0$）、$\hat{f}(0)=\hat{u}(0)=0$ を示せ。
2. $u$ は $\Delta u=f$ の弱解であることを示せ。
3. $f\in L^{2}\setminus H^{1}$, $u\in H^{2}\setminus H^{3}$ を示し、\ref{gl:elliptic-regularity} と比べよ。
:::

::: solution
**1.** $0<t<\pi$ で $u=\frac12(\pi t-t^{2})$、$-\pi<t<0$ で $u=\frac12(\pi t+t^{2})$ なので $u'(t)=\frac12(\pi-2|t|)$ は $[-\pi,\pi]$ で連続、$u(\pm\pi)=0$, $u'(\pm\pi)=-\frac{\pi}{2}$ なので $u\circ p$ は $C^{1}$ 級の周期関数で、$t\notin\pi\mathbb{Z}$ で $u''=-f$。$\hat{f}(m)=\frac{1}{2\pi}\bigl(\int_{0}^{\pi}-\int_{-\pi}^{0}\bigr)e^{-imt}dt=\frac{1-(-1)^{m}}{i\pi m}$（$m\neq0$）、$f$ は奇関数なので $\hat{f}(0)=0$。$m\neq0$ で $[-\pi,0]$, $[0,\pi]$ に分けて二回部分積分すると、$u$, $u'$ の連続性と周期性から境界項は消えて
$$
\int_{-\pi}^{\pi}ue^{-imt}dt=\frac{1}{im}\int_{-\pi}^{\pi}u'e^{-imt}dt=\frac{1}{(im)^{2}}\int_{-\pi}^{\pi}u''e^{-imt}dt=\frac{1}{m^{2}}\int_{-\pi}^{\pi}fe^{-imt}dt.
$$
$u$ は奇関数なので $\hat{u}(0)=0$。

**2.** $\Delta^{t}=\Delta$ なので、滑らかな $v$ について $\int u\Delta v=\int fv$ を示せばよい。\ref{gl:torus-fourier-basis.3} から $\widehat{\Delta v}(m)=m^{2}\hat{v}(m)$ で、記法の節の式と 1 から
$$
\int u\,\Delta v\,d\mu_{g}=2\pi\sum_{m\neq0}\hat{u}(m)m^{2}\hat{v}(-m)=2\pi\sum_{m}\hat{f}(m)\hat{v}(-m)=\int fv\,d\mu_{g}.
$$

**3.** $m$ が奇数なら $|\hat{f}(m)|=\frac{2}{\pi|m|}$, $|\hat{u}(m)|=\frac{2}{\pi|m|^{3}}$、偶数なら $0$。\ref{gl:torus-sobolev.1} を使う：$\sum(1+m^{2})|\hat{f}|^{2}\ge\sum_{m\text{ 奇数}}\frac{4}{\pi^{2}}=\infty$、$\sum(1+m^{2})^{2}|\hat{u}|^{2}\le\sum_{m\text{ 奇数}}\frac{16}{\pi^{2}m^{2}}<\infty$（$1+m^{2}\le2m^{2}$）、$\sum(1+m^{2})^{3}|\hat{u}|^{2}\ge\sum_{m\text{ 奇数}}\frac{4}{\pi^{2}}=\infty$。$f\in H^{0}$ から $u\in H^{2}$ は定理（$s=0$, $k=2$）のとおりで、$u\in H^{3}$ なら $f=\Delta u\in H^{1}$ となるので、取り戻せる滑らかさはちょうど $2$ 段である。$f$ の跳びが $u''$ の跳びとして残っている。
:::

::: problem ★★ 標準：1 階の作用素の核とゲージ変換 {#gl:ex-erw-2}
$T^{1}$ の上の滑らかな複素数値関数 $a$ について $\kappa\defeq\frac{1}{2\pi}\int_{0}^{2\pi}a(p(t))\,dt$（平均）、$P\defeq D+a$ とする。
1. $P$ は $1$ 階の楕円型で、$\ker P\neq0$ $\iff$ $\kappa\in i\mathbb{Z}$ であり、そのとき $\ker P$ は $u(p(t))\defeq\exp\bigl(-\int_{0}^{t}a(p(s))\,ds\bigr)$ で張られる $1$ 次元の空間であることを示せ。
2. $P^{t}=-D+a$ を示し、$\dim\ker P^{t}=\dim\ker P$ を示せ。
3. $A(t)\defeq\int_{0}^{t}\bigl(a(p(s))-\kappa\bigr)ds$ は $T^{1}$ 上の滑らかな関数を定め、$e^{A}P(e^{-A}w)=(D+\kappa)w$ であることを示し、これとフーリエ係数から 1 をもう一度導け。
4. $a=i(1+\cos)$ と $a=i(\frac12+\cos)$ の場合の $\ker P$ を求めよ。
:::

::: solution
**1.** $\sigma_{P}(\xi)=i\xi\neq0$（$\xi\neq0$）なので楕円型。$u\in\ker P$ なら \ref{gl:elliptic-smooth} から滑らかで古典的に $Pu=0$。$U\defeq u\circ p$, $\alpha\defeq a\circ p$, $F(t)\defeq\int_{0}^{t}\alpha$ とすると $(Ue^{F})'=(U'+\alpha U)e^{F}=0$ なので $U=U(0)e^{-F}$。$\alpha$ の周期性から $F(t+2\pi)=F(t)+2\pi\kappa$ で、$e^{-F}$ が周期的 $\iff$ $e^{-2\pi\kappa}=1$ $\iff$ $\kappa\in i\mathbb{Z}$。そのとき $e^{-F}$ は滑らかな古典解で、\ref{gl:formal-transpose.1} から弱解。そうでなければ $U(0)=0$ で $u=0$。

**2.** \ref{gl:formal-transpose.2}（$\gamma=1$）から $P^{t}v=-Dv+av$。$P^{t}$ も楕円型で、同じ議論で $V'=\alpha V$、$V=V(0)e^{F}$ が周期的 $\iff$ $e^{2\pi\kappa}=1$ $\iff$ $\kappa\in i\mathbb{Z}$。よって次元は等しい（\see{gl:elliptic-fredholm}）。

**3.** $\alpha-\kappa$ は平均 $0$ なので $A(t+2\pi)=A(t)$ で、$A$ は $T^{1}$ の上の滑らかな関数。$A'=\alpha-\kappa$ から $e^{A}P(e^{-A}w)=Dw-A'w+aw=Dw+\kappa w$。$e^{\pm A}$ を掛ける写像は滑らかな関数の全体を全単射に写し、1 から両方の核は滑らかな関数からなるので、$w\mapsto e^{-A}w$ は $\ker(D+\kappa)$ から $\ker P$ への同型。$\ker(D+\kappa)$ は、$e_{-m}$ を試験関数にすると $(im+\kappa)\hat{w}(m)=0$ から、$\kappa=-im$ となる $m\in\mathbb{Z}$（$m=i\kappa$）があるときだけ $\operatorname{span}\{e_{m}\}$、それ以外は $0$。$e^{-A(t)}e^{i(i\kappa)t}=e^{-A(t)-\kappa t}=e^{-F(t)}$ で 1 と一致する。

**4.** $a=i(1+\cos)$ では $\kappa=i$ で、$\ker P$ は $e^{-i(t+\sin t)}$ で張られる。$a=i(\frac12+\cos)$ では $\kappa=\frac{i}{2}\notin i\mathbb{Z}$ で $\ker P=0$。主表象は同じでも、下の階数の項（の平均）で核の次元が変わる。
:::

## 楕円型作用素のスペクトル {#gl:sec-sp-exercises}

対応するページ：\ref{gl:page-elliptic-spectrum}

::: problem ★ 基本：円周のレゾルベントの積分核 {#gl:ex-sp-1}
$T^{1}$ の上で $R\defeq(\Delta+1)^{-1}$（\ref{gl:elliptic-resolvent}）とし、$k(p(t))\defeq\frac{\cosh(\pi-|t|)}{2\sinh\pi}$（$|t|\le\pi$）とおく。
1. $Re_{m}=(1+m^{2})^{-1}e_{m}$ を示し、$R$ の固有値と $\|R\|$ を求めよ。
2. $\hat{k}(m)=\frac{1}{2\pi(1+m^{2})}$ を示し、$f\in L^{2}$ について $Rf(p(t))=\int_{-\pi}^{\pi}k(p(t-s))f(p(s))\,ds$（a.e.）を示せ。
3. $\sum_{m\in\mathbb{Z}}\frac{1}{1+m^{2}}=\pi\coth\pi$ を導け。
:::

::: solution
**1.** $(\Delta+1)e_{m}=(1+m^{2})e_{m}$ で、$\Delta+1\colon H^{2}\to L^{2}$ は全単射（\ref{gl:elliptic-resolvent.2}）なので $Re_{m}=(1+m^{2})^{-1}e_{m}$。$R$ は $L^{2}$ で有界で $f=\sum\hat{f}(m)e_{m}$（$L^{2}$ 収束）なので $Rf=\sum\hat{f}(m)(1+m^{2})^{-1}e_{m}$。固有値は $1$（$m=0$、重複度 $1$）と $(1+m^{2})^{-1}$（$m\ge1$、重複度 $2$）で $0$ に近づき、パーセヴァルの等式から $\|Rf\|\le\|f\|$、$f=1$ で等号なので $\|R\|=1$。\ref{gl:elliptic-resolvent.3} のとおりである。

**2.** $k$ は偶関数で、$s=\pi-t$ と置き換えると $\int_{0}^{\pi}\cosh(\pi-t)\cos mt\,dt=(-1)^{m}\int_{0}^{\pi}\cosh s\cos ms\,ds$。$\frac{d}{ds}(\sinh s\cos ms+m\cosh s\sin ms)=(1+m^{2})\cosh s\cos ms$ から後者は $\frac{(-1)^{m}\sinh\pi}{1+m^{2}}$ で、
$$
\hat{k}(m)=\frac{1}{2\pi}\cdot\frac{2}{2\sinh\pi}\int_{0}^{\pi}\cosh(\pi-t)\cos mt\,dt=\frac{1}{2\pi(1+m^{2})}.
$$
$Kf(t)\defeq\int_{-\pi}^{\pi}k(t-s)f(s)ds$（周期的に延ばす）は有界で、フビニの定理と周期性から $\widehat{Kf}(m)=2\pi\hat{k}(m)\hat{f}(m)=\frac{\hat{f}(m)}{1+m^{2}}=\widehat{Rf}(m)$。\ref{gl:torus-fourier-basis.1} から $Kf=Rf$（a.e.）。

**3.** $k$ は連続（$t=\pm\pi$ で値が一致）で $\sum|\hat{k}(m)|<\infty$ なので、$\sum\hat{k}(m)e_{m}$ は一様収束して連続関数になり、\ref{gl:torus-fourier-basis.2} から $k$ と a.e. で、したがって至る所等しい。$t=0$ で $\frac{\cosh\pi}{2\sinh\pi}=\frac{1}{2\pi}\sum_{m}\frac{1}{1+m^{2}}$。これは $R$ の固有値の和（トレース）でもある。
:::

::: problem ★★ 標準：符号の定まらない 1 階の系のスペクトル {#gl:ex-sp-2}
$c\in\mathbb{R}$ とし、$T^{1}$ の上の関数に作用する $A\defeq D+c$, $A^{\natural}\defeq-D+c$ と、自明な束 $T^{1}\times\mathbb{C}^{2}$（標準のファイバー計量）の切断に作用する $P(u,v)\defeq(A^{\natural}v,\ Au)$ を考える。
1. $P$ は形式的に自己共役な $1$ 階の楕円型作用素で、$P^{2}(u,v)=((\Delta+c^{2})u,(\Delta+c^{2})v)$、非負でないことを示せ。
2. $\rho_{m}\defeq\sqrt{m^{2}+c^{2}}>0$ となる $m$ について $\varphi_{m,\pm}\defeq(2\sqrt{\pi}\rho_{m})^{-1}(c-im,\ \pm\rho_{m})\,e_{m}$ とおく。$P\varphi_{m,\pm}=\pm\rho_{m}\varphi_{m,\pm}$ を示し、（$c=0$ のときは定数の切断を加えて）滑らかな固有切断からなる正規直交基底を作り、$P$ の固有値と重複度をすべて求めよ。\ref{gl:elliptic-spectral-general} と比べよ。
3. $\ker P=\ker A\oplus\ker A^{t}$ を示し、$\ker P$ を $c$ で場合分けして求めよ。
:::

::: solution
**1.** $\sigma_{P}(\xi)=\begin{pmatrix}0&-i\xi\\ i\xi&0\end{pmatrix}$ の行列式は $-\xi^{2}\neq0$（$\xi\neq0$）。一周期の部分積分で $\int(Dw)\bar{w}'=-\int w\,\overline{Dw'}$ と $c\in\mathbb{R}$ から $\int(A^{\natural}u_{2})\bar{v}_{1}=\int u_{2}\overline{Av_{1}}$, $\int(Au_{1})\bar{v}_{2}=\int u_{1}\overline{A^{\natural}v_{2}}$ で、足すと $(Pu,v)=(u,Pv)$。$A^{\natural}A=(-D+c)(D+c)=-D^{2}+c^{2}$、$AA^{\natural}$ も同じなので $P^{2}$ の式が出る。2 の $\varphi_{m,-}$ で $(P\varphi,\varphi)=-\rho_{m}<0$ なので非負でない。

**2.** $Ae_{m}=(c+im)e_{m}$, $A^{\natural}e_{m}=(c-im)e_{m}$ から $P(\alpha e_{m},\beta e_{m})=((c-im)\beta,\ (c+im)\alpha)e_{m}$。$(\alpha,\beta)=(c-im,\pm\rho_{m})$ では $((c-im)(\pm\rho_{m}),\ \rho_{m}^{2})=\pm\rho_{m}(c-im,\pm\rho_{m})$。$\|(c-im,\pm\rho_{m})e_{m}\|^{2}=2\pi\cdot2\rho_{m}^{2}$ なので $\varphi_{m,\pm}$ は単位ベクトルで、$(\varphi_{m,+},\varphi_{m,-})\propto|c-im|^{2}-\rho_{m}^{2}=0$。各 $m$ で $\varphi_{m,\pm}$ は $2$ 次元の空間 $\{(\alpha,\beta)e_{m}\}$ の正規直交基底で、$c=0$, $m=0$ では $P(\alpha,\beta)=0$ なので $(2\pi)^{-1/2}(1,0)$, $(2\pi)^{-1/2}(0,1)$ をとる。$\{(2\pi)^{-1/2}(1,0)e_{m},(2\pi)^{-1/2}(0,1)e_{m}\}$ は成分ごとの \ref{gl:torus-fourier-basis.2} から正規直交基底なので、こうして作った族も正規直交基底である。$Pu=\lambda u$ の $L^{2}$ の弱解 $u$ は \ref{gl:elliptic-smooth} から滑らかで、基底の元 $\varphi$（固有値 $\lambda_{\varphi}\in\mathbb{R}$）との係数は 1 の対称性から $\lambda(u,\varphi)=(u,P\varphi)=\lambda_{\varphi}(u,\varphi)$ を満たす。よって固有空間は $\lambda_{\varphi}=\lambda$ の $\varphi$ で張られ、固有値は $c\neq0$ なら $\pm|c|$（重複度 $1$）と $\pm\sqrt{m^{2}+c^{2}}$, $m\ge1$（重複度 $2$）、$c=0$ なら $0$（重複度 $2$）と $\pm m$, $m\ge1$（重複度 $2$）。固有値は正負の両方に発散し、二乗すると $\Delta+c^{2}$ の固有値 $m^{2}+c^{2}$ になる。

**3.** $P(u,v)=0$ $\iff$ $Au=0$ かつ $A^{\natural}v=0$ で、\ref{gl:formal-transpose.2} から $A^{t}=-D+c=A^{\natural}$。$\ker A$ は $(im+c)\hat{u}(m)=0$ から、$c\in\mathbb{R}$ では $c=0$ のとき定数、それ以外は $0$。$\ker A^{t}$ も同じ。よって $c\neq0$ なら $\ker P=0$、$c=0$ なら $\ker P=\mathbb{C}^{2}$（定数）。$A$ の核と転置の核の次元は等しい。偶数次と奇数次に分けた $d+\delta$ はこの形をしている（\see{gl:euler-index}）。
:::

## 固有関数展開と球面調和関数 {#gl:sec-spx-exercises}

対応するページ：\ref{gl:page-spectral-examples}

::: problem ★ 基本：z³ の球面調和関数への分解 {#gl:ex-spx-1}
$S^{2}$ の上で考え、$h\defeq z^{3}-\frac32z(x^{2}+y^{2})$（$\mathbb{R}^{3}$ の多項式）とする。
1. $h\in\mathcal{H}_{3}$, $h|_{S}=\frac12(5z^{3}-3z)$, $S^{2}$ の上で $z^{3}=\frac25h|_{S}+\frac35z$ を示せ。
2. 1 を使って $\Delta(z^{3})$, $\|z^{3}\|_{L^{2}}^{2}$, $\|\nabla z^{3}\|_{L^{2}}^{2}$ を求め、直接の計算と比べよ。
3. $u=z^{3}$ について \ref{gl:poincare-best-constant.2} の不等式を確かめ、等号が成り立つかを判定せよ。
:::

::: solution
**1.** $\Delta_{0}h=6z-\frac32(2z+2z)=0$ で、$h$ は $3$ 次斉次。$S^{2}$ では $x^{2}+y^{2}=1-z^{2}$ なので $h=\frac12(5z^{3}-3z)$、$\frac25h+\frac35z=z^{3}-\frac35z+\frac35z=z^{3}$。

**2.** \ref{gl:sphere-spectrum.2} から $\Delta h|_{S}=12h|_{S}$, $\Delta z=2z$ なので $\Delta(z^{3})=\frac{24}{5}h|_{S}+\frac65z=12z^{3}-6z$（\ref{gl:sphere-laplacian-polynomial} で $\Delta_{0}z^{3}=6z$ から直接出る式と一致）。$\|z\|^{2}=2\pi\int_{-1}^{1}s^{2}ds=\frac{4\pi}{3}$、$\|h|_{S}\|^{2}=2\pi\int_{-1}^{1}\frac14(5s^{3}-3s)^{2}ds=2\pi\cdot\frac27=\frac{4\pi}{7}$、$(h|_{S},z)=0$（固有値が違う）。$\mathcal{H}_{3}|_{S}$, $\mathcal{H}_{1}|_{S}$ の正規直交基底を $h|_{S}/\|h|_{S}\|$, $z/\|z\|$ から始めるグラム–シュミットで作れば、$z^{3}$ の係数は $\frac25\|h|_{S}\|$, $\frac35\|z\|$ の二つだけで、パーセヴァルの等式と \ref{gl:laplacian-energy-spectral.2} から
$$
\|z^{3}\|^{2}=\tfrac{4}{25}\cdot\tfrac{4\pi}{7}+\tfrac{9}{25}\cdot\tfrac{4\pi}{3}=\tfrac{4\pi}{7},\qquad\|\nabla z^{3}\|^{2}=12\cdot\tfrac{4}{25}\cdot\tfrac{4\pi}{7}+2\cdot\tfrac{9}{25}\cdot\tfrac{4\pi}{3}=\tfrac{72\pi}{35}.
$$
直接には $\|z^{3}\|^{2}=2\pi\int s^{6}ds=\frac{4\pi}{7}$、$|\nabla z^{3}|^{2}=|\partial_{\theta}\cos^{3}\theta|^{2}=9z^{4}(1-z^{2})$ から $\|\nabla z^{3}\|^{2}=18\pi\int_{-1}^{1}(s^{4}-s^{6})ds=18\pi\bigl(\frac25-\frac27\bigr)=\frac{72\pi}{35}$。

**3.** $z^{3}$ は奇関数で平均 $0$、$\lambda_{1}=2$（\ref{gl:sphere-spectrum.2}）。$\|z^{3}\|^{2}=\frac{20\pi}{35}\le\frac12\cdot\frac{72\pi}{35}=\frac{36\pi}{35}$ で成り立ち、$z^{3}$ は $h$ の成分をもつので $\ker(\Delta-2)$ に入らず、等号は成り立たない。
:::

::: problem ★★ 標準：六角トーラスのスペクトル {#gl:ex-spx-2}
$T^{2}$ に、各座標近傍 $x_{a}$ で $g_{11}=g_{22}=1$, $g_{12}=g_{21}=\frac12$ となる計量 $g$ を入れる。
1. $g$ がリーマン計量として矛盾なく定まることを示し、$\mu_{g}=\frac{\sqrt{3}}{2}\mu_{\mathrm{flat}}$（$\mu_{\mathrm{flat}}$ は平坦な計量の測度）、$\operatorname{vol}=2\sqrt{3}\pi^{2}$, $\Delta=-\frac43(D_{1}^{2}-D_{1}D_{2}+D_{2}^{2})$ を示せ。
2. $\Delta$ の固有値が $\frac43(m_{1}^{2}-m_{1}m_{2}+m_{2}^{2})$（$m\in\mathbb{Z}^{2}$）の形の数だけであることを示し、最小の正の固有値 $\lambda_{1}$ と次の固有値、その重複度を求めよ。
3. $(T^{2},g)$ のポアンカレの不等式の最良定数を求め、同じ面積の正方形のトーラス（計量 $\rho^{2}(dt_{1}^{2}+dt_{2}^{2})$）の $\lambda_{1}$ と比べよ。
:::

::: solution
**1.** 座標変換は $2\pi\mathbb{Z}^{2}$ の元による平行移動（の成分ごとの組）で微分は恒等写像なので、定数の成分は座標変換で保たれ、$g$ は矛盾なく定まる。行列 $G=\begin{pmatrix}1&\frac12\\\frac12&1\end{pmatrix}$ は固有値 $\frac32,\frac12$ で正定値、$\det G=\frac34$, $G^{-1}=\frac43\begin{pmatrix}1&-\frac12\\-\frac12&1\end{pmatrix}$。\ref{gl:rm-integral-formulas.1} を \ref{gl:rm-examples.2} と同じ座標近傍に使うと $\mu_{g}=\frac{\sqrt{3}}{2}\mu_{\mathrm{flat}}$、$\operatorname{vol}=\frac{\sqrt{3}}{2}(2\pi)^{2}$。$\sqrt{g}$ が定数なので $\Delta=-\sum g^{ij}\partial_{i}\partial_{j}=-\frac43(D_{1}^{2}-D_{1}D_{2}+D_{2}^{2})$。

**2.** $\Delta e_{m}=\frac43q(m)e_{m}$、$q(m)\defeq m_{1}^{2}-m_{1}m_{2}+m_{2}^{2}$。$\mu_{g}$ は $\mu_{\mathrm{flat}}$ の定数倍なので、$\{(2\pi)^{-1}(\frac{\sqrt{3}}{2})^{-1/2}e_{m}\}$ は \ref{gl:torus-fourier-basis.2} から $L^{2}(T^{2},\mu_{g})$ の滑らかな固有関数からなる正規直交基底で、\ref{gl:elliptic-spectral-decomposition.2} から固有値は $\frac43q(m)$ だけ、重複度は $q(m)$ がその値をとる $m$ の個数。$q(m)=\frac12\bigl(m_{1}^{2}+m_{2}^{2}+(m_{1}-m_{2})^{2}\bigr)$ なので、$q=1$ は三つの整数 $m_{1},m_{2},m_{1}-m_{2}$ の二つが $\pm1$ で一つが $0$ のとき：$\pm(1,0)$, $\pm(0,1)$, $\pm(1,1)$ の $6$ 個。$q=2$ は平方の和 $4$ を三つの整数（どれか二つが $0$ なら $m=0$）で作れないので起こらない。$q=3$ は二つが $\pm1$ で一つが $\pm2$ のとき：$\pm(1,-1)$, $\pm(1,2)$, $\pm(2,1)$ の $6$ 個。よって $\lambda_{1}=\frac43$（重複度 $6$）、次は $4$（重複度 $6$）。

**3.** \ref{gl:poincare-best-constant.3} から最良定数は $\lambda_{1}^{-1/2}=\frac{\sqrt{3}}{2}$。正方形のトーラスでは $\Delta=-\rho^{-2}(D_{1}^{2}+D_{2}^{2})$ で固有値は $\rho^{-2}|m|^{2}$、同じ面積なら $\rho^{2}\cdot4\pi^{2}=2\sqrt{3}\pi^{2}$ で $\rho^{2}=\frac{\sqrt{3}}{2}$、$\lambda_{1}=\frac{2}{\sqrt{3}}\approx1.155<\frac43$。六角トーラスの方が最小の固有値が大きく、ポアンカレの定数が小さい。
:::

## ホッジの定理 {#gl:sec-ho-exercises}

対応するページ：\ref{gl:page-hodge-theorem}

::: problem ★ 基本：球面の上の調和射影・グリーン作用素とホッジ分解 {#gl:ex-ho-1}
$S^{2}$（記法の節の向き）の上で考える。
1. $f\defeq x^{2}+yz$ について、$\Lambda^{0}$ の上の $Hf$ と $Gf$ を求めよ。
2. $1$ 形式 $\omega\defeq(x\,dy-y\,dx)|_{S^{2}}$ について $\omega=\sin^{2}\theta\,d\phi$, $d\omega=2z\,\mathrm{vol}_{g}$, $\delta\omega=0$, $\delta(z\,\mathrm{vol}_{g})=\omega$, $\Delta\omega=2\omega$ を示せ。
3. $H\omega$, $G\omega$ を求め、\ref{gl:hodge-decomposition.1} の式で $\omega$ の分解を書け。
:::

::: solution
**1.** $S^{2}$ は連結なので $\mathcal{H}^{0}_{\mathbb{C}}$ は定数（\ref{gl:harmonic-projection.1} と \ref{gl:closed-manifold-laplacian.4}）で、$Hf$ は平均。$\int x^{2}=\int_{0}^{\pi}\!\int_{0}^{2\pi}\sin^{3}\theta\cos^{2}\phi\,d\phi\,d\theta=\frac{4\pi}{3}$、$\int yz=0$（$\phi$ の積分が $0$）なので $Hf=\frac13$。$S^{2}$ では $f-\frac13=\frac13(2x^{2}-y^{2}-z^{2})+yz$ で、$2x^{2}-y^{2}-z^{2}$, $yz$ は $\mathcal{H}_{2}$ の元なので、\ref{gl:sphere-laplacian-polynomial} から $\Delta(f-\frac13)=6(f-\frac13)$。$u\defeq\frac16(f-\frac13)$ は滑らかで $\Delta u=f-Hf$、$(u,1)=\frac16(\Delta u,1)=\frac16(u,\Delta1)=0$。\ref{gl:green-operator.1} の一意性から $Gf=\frac16\bigl(\frac13(2x^{2}-y^{2}-z^{2})+yz\bigr)$。

**2.** $dx=\cos\theta\cos\phi\,d\theta-\sin\theta\sin\phi\,d\phi$, $dy=\cos\theta\sin\phi\,d\theta+\sin\theta\cos\phi\,d\phi$ から $x\,dy-y\,dx=\sin^{2}\theta\,d\phi$。$\theta^{1}\defeq d\theta$, $\theta^{2}\defeq\sin\theta\,d\phi$ について \ref{riem:hodge-star-properties.1} から $\star\theta^{1}=\theta^{2}$, $\star\theta^{2}=-\theta^{1}$、$\star1=\mathrm{vol}_{g}$, $\star\mathrm{vol}_{g}=1$。$n=2$ では $\Omega^{1}$, $\Omega^{2}$ の上でどちらも $\delta=-\star d\star$（\ref{riem:codifferential}）。
$$
d\omega=2\sin\theta\cos\theta\,d\theta\wedge d\phi=2z\,\mathrm{vol}_{g},\qquad\delta\omega=-\star d(-\sin\theta\,d\theta)=0,
$$
$\delta(z\,\mathrm{vol}_{g})=-\star dz=-\star(-\sin\theta\,\theta^{1})=\sin\theta\,\theta^{2}=\omega$。よって $\Delta\omega=\delta d\omega=2\delta(z\,\mathrm{vol}_{g})=2\omega$。どの形式も $S^{2}$ の上で滑らかなので、座標の中の等式は全体で成り立つ。

**3.** \ref{gl:hodge-theorem.2} と \ref{mfd:sphere-de-rham} から $\dim\mathcal{H}^{1}=b_{1}(S^{2})=0$、\ref{gl:harmonic-projection.1} から $\mathcal{H}^{1}_{\mathbb{C}}=0$ で $H\omega=0$。$\frac12\omega$ は $\Delta(\frac12\omega)=\omega-H\omega$ を満たすので $G\omega=\frac12\omega$（\ref{gl:green-operator.1}）。$\delta G\omega=0$, $dG\omega=z\,\mathrm{vol}_{g}$ なので $\omega=0+d(0)+\delta(z\,\mathrm{vol}_{g})$ で、2 の直接の計算と一致する。$\omega$ は余完全で、$\omega^{\sharp}$ は $z$ 軸のまわりの回転の流れ $(-y,x,0)$ である。
:::

::: problem ★★ 標準：一様でない円周の調和形式と最小ノルム {#gl:ex-ho-2}
$T^{1}$ の上の正の滑らかな関数 $a$ について計量 $g\defeq a^{2}\,dt^{2}$（$g(D,D)=a^{2}$）と向き $dt$ を入れ、$L\defeq\int_{0}^{2\pi}a\,dt$ とする。
1. $\mathrm{vol}_{g}=a\,dt$, $\star(f\,dt)=f/a$, $\delta(f\,dt)=-a^{-1}D(f/a)$ を示し、$\mathcal{H}^{1}=\mathbb{R}\,a\,dt$ を示せ。
2. $H(f\,dt)=\bigl(L^{-1}\int_{0}^{2\pi}f\,dt\bigr)a\,dt$ を示し、$f\,dt-H(f\,dt)$ が完全形式であることを確かめよ。
3. $\int_{0}^{2\pi}f\,dt=2\pi$ となる $1$ 形式 $f\,dt$（$dt$ のコホモロジー類）の $L^{2}$ ノルムの二乗の最小値が $4\pi^{2}/L$ であることを、\ref{gl:hodge-theorem.3} とコーシー–シュワルツの不等式の両方で示せ。
:::

::: solution
**1.** $|dt|_{g}=a^{-1}$ なので $\theta\defeq a\,dt$ は正の単位余接フレームで、\ref{riem:hodge-star-properties.1} から $\star1=a\,dt=\mathrm{vol}_{g}$, $\star(a\,dt)=1$、線形性から $\star(f\,dt)=f/a$。$n=k=1$ で $\delta=-\star d\star$ なので $\delta(f\,dt)=-\star\bigl(D(f/a)\,dt\bigr)=-a^{-1}D(f/a)$。$1$ 形式はすべて閉なので、\ref{gl:harmonic-projection.1} から $f\,dt\in\mathcal{H}^{1}$ $\iff$ $D(f/a)=0$ $\iff$ $f=ca$（$c$ は定数、$T^{1}$ は連結）。

**2.** $(f\,dt,a\,dt)=\int f\,dt\wedge\star(a\,dt)=\int_{0}^{2\pi}f\,dt$、$\|a\,dt\|^{2}=\int a\,dt=L$ なので、直交射影は主張の式。$c\defeq L^{-1}\int f$ とすると $\int_{0}^{2\pi}(f-ca)\,dt=0$ なので $F(t)\defeq\int_{0}^{t}(f-ca)$ は周期的で滑らか、$f\,dt-H(f\,dt)=dF$。

**3.** $1$ 形式 $e\,dt$ が完全 $\iff$ 原始関数 $\int_{0}^{t}e$ が周期的 $\iff$ $\int_{0}^{2\pi}e=0$ なので、$f\,dt$ が $dt$ の類に入ることは $\int f=2\pi$ と同値。\ref{gl:hodge-theorem.3} から最小値は $\|H(dt)\|^{2}=\|(2\pi/L)a\,dt\|^{2}=4\pi^{2}/L$。直接には $\|f\,dt\|^{2}=\int f\,dt\wedge\star(f\,dt)=\int_{0}^{2\pi}f^{2}a^{-1}dt$ で、コーシー–シュワルツの不等式から
$$
4\pi^{2}=\Bigl(\int_{0}^{2\pi}\frac{f}{\sqrt{a}}\sqrt{a}\,dt\Bigr)^{2}\le\int_{0}^{2\pi}\frac{f^{2}}{a}dt\cdot L,
$$
等号は $f/\sqrt{a}$ が $\sqrt{a}$ の定数倍、つまり $f=(2\pi/L)a$ のとき。調和代表元は、円周が長く伸びている所（$a$ が大きい所）ほど大きく、長さあたりの密度 $f/a$ は一定である。
:::

::: problem ★★★ 発展：球面の 1 形式のホッジのラプラシアンのスペクトル {#gl:ex-ho-3}
$S^{2}$（記法の節の向き）の $1$ 形式（複素係数）の上のホッジのラプラシアンの固有値はちょうど $l(l+1)$（$l\ge1$）で、重複度は $2(2l+1)$ であることを示せ。とくに $0$ は固有値でない。
:::

::: solution
**Step 1.** 【主張：滑らかな関数 $f$ について $\Delta(df)=d(\Delta f)$、$\Delta(f\,\mathrm{vol}_{g})=(\Delta f)\mathrm{vol}_{g}$、$\Delta\delta(f\,\mathrm{vol}_{g})=\delta\bigl((\Delta f)\mathrm{vol}_{g}\bigr)$】関数の上で $\Delta=\delta d$ なので $\Delta df=d\delta df+\delta ddf=d(\Delta f)$。$n=2$ では $\Omega^{1}$, $\Omega^{2}$ の上で $\delta=-\star d\star$、$\star(f\,\mathrm{vol}_{g})=f$、$\Omega^{2}$ の上で $\star\star=1$ なので、$\delta(f\,\mathrm{vol}_{g})=-\star df$、$\Delta f=-\star d\star df$。$d(f\,\mathrm{vol}_{g})=0$ から $\Delta(f\,\mathrm{vol}_{g})=d\delta(f\,\mathrm{vol}_{g})=-d\star df=\star(\Delta f)=(\Delta f)\mathrm{vol}_{g}$。$\delta\delta=0$ から $\Delta\delta=\delta d\delta=\delta\Delta$ で、最後の式が出る。

**Step 2.** 【主張：滑らかな $Y$, $Y'$ について $(dY,dY')=(Y,\Delta Y')$、$(\delta(Y\mathrm{vol}_{g}),\delta(Y'\mathrm{vol}_{g}))=(Y,\Delta Y')$、$(dY,\delta(Y'\mathrm{vol}_{g}))=0$】複素係数でも $(d\alpha,\beta)=(\alpha,\delta\beta)$（\ref{gl:sec-ho-notation}）なので $(dY,dY')=(Y,\delta dY')$。$d(Y'\mathrm{vol}_{g})=0$ と Step 1 から $(\delta(Y\mathrm{vol}_{g}),\delta(Y'\mathrm{vol}_{g}))=(Y\mathrm{vol}_{g},(\Delta Y')\mathrm{vol}_{g})=(Y,\Delta Y')$（$|\mathrm{vol}_{g}|=1$）。最後は \ref{gl:harmonic-projection.3}。

**Step 3.** 【主張：$\Delta Y_{j}=\lambda_{j}Y_{j}$ となる滑らかな関数からなる $L^{2}(S^{2})$ の正規直交基底 $(Y_{j})$ をとり、$\lambda_{j}>0$ の $j$ について $\psi_{j}\defeq\lambda_{j}^{-1/2}dY_{j}$, $\chi_{j}\defeq\lambda_{j}^{-1/2}\delta(Y_{j}\mathrm{vol}_{g})$ とおくと、$\{\psi_{j},\chi_{j}\}$ は滑らかな固有形式からなる正規直交系で、$\Delta\psi_{j}=\lambda_{j}\psi_{j}$, $\Delta\chi_{j}=\lambda_{j}\chi_{j}$】基底は \ref{gl:sphere-spectrum.3} の各 $\mathcal{H}_{l}|_{S}$ にグラム–シュミットの直交化を施して並べればよく、$\lambda_{j}=l(l+1)$、$\lambda_{j}=0$ は定数の $Y_{j}$ だけ。正規直交性は Step 2 の $(dY_{i},dY_{j})=\lambda_{j}(Y_{i},Y_{j})$ などから、固有形式であることは Step 1 から。

**Step 4.** 【主張：$\{\psi_{j},\chi_{j}\}$ の張る空間は $L^{2}(\Lambda^{1})$ で稠密】\ref{gl:hodge-decomposition.4} から $L^{2}(\Lambda^{1})=\mathcal{H}^{1}_{\mathbb{C}}\oplus\overline{d\Omega^{0}_{\mathbb{C}}}\oplus\overline{\delta\Omega^{2}_{\mathbb{C}}}$ で、$\mathcal{H}^{1}_{\mathbb{C}}=0$（\ref{gl:hodge-theorem.2}、\ref{mfd:sphere-de-rham}、\ref{gl:harmonic-projection.1}）。$f\in\Omega^{0}_{\mathbb{C}}$ を $f=\sum c_{j}Y_{j}$ と展開すると、部分和は $H^{1}$ で収束し（\ref{gl:spectral-sobolev-norms.2}）、$d\colon H^{1}\to L^{2}$ は有界なので $df=\lim\sum_{j\le N}c_{j}dY_{j}$（$L^{2}$）。$\Omega^{2}_{\mathbb{C}}$ の元は $f\,\mathrm{vol}_{g}$（$f=\star\beta$）と書け、$\delta(f\,\mathrm{vol}_{g})=-\star df$ で、$\star$ は正規直交フレームで $\theta^{1}\mapsto\theta^{2}\mapsto-\theta^{1}$ と働く各点の等長写像なので、同様に $\delta(f\,\mathrm{vol}_{g})=\lim\sum_{j\le N}c_{j}\delta(Y_{j}\mathrm{vol}_{g})$。

**Step 5.** 【主張：結論】$1$ 形式の上の $\Delta$ は形式的に自己共役で非負な楕円型作用素（\ref{gl:hodge-laplacian-spectrum.1}・\ref[2]{gl:hodge-laplacian-spectrum.2}）で、Step 3・4 から $\{\psi_{j},\chi_{j}\}_{\lambda_{j}>0}$ は滑らかな固有形式からなる正規直交基底である。\ref{gl:elliptic-spectral-decomposition.2} から、固有値はちょうど $\lambda_{j}>0$ の値 $l(l+1)$（$l\ge1$）で、重複度は $\mathcal{H}_{l}|_{S}$ の各基底元から $\psi$, $\chi$ が一つずつ出るので $2(2l+1)$。重複度を込めると $2\ (6\text{ 回}),\ 6\ (10\text{ 回}),\ 12\ (14\text{ 回}),\dots$ で、関数の $0;\,2\ (3\text{ 回});\,6\ (5\text{ 回});\dots$ から $0$ を除いて重複度を倍にしたものになる。
:::

## ホッジの定理の帰結 {#gl:sec-hoc-exercises}

対応するページ：\ref{gl:page-hodge-consequences}

::: problem ★ 基本：ベッチ数・オイラー標数・双対性の計算 {#gl:ex-hoc-1}
1. $T^{n}$ のベッチ数とオイラー標数を求め、$b_{k}=b_{n-k}$ を確かめよ。
2. $T^{2}$（向き $dt_{1}\wedge dt_{2}$）について、$\mathcal{H}^{1}$ の上の $\star$、基底 $[dt_{1}]$, $[dt_{2}]$ での \ref{gl:hodge-poincare-duality.2} の対の行列を求め、$h=a\,dt_{1}+b\,dt_{2}$（$a,b\in\mathbb{R}$）で \ref{gl:hodge-poincare-duality.3} を確かめよ。
3. $T^{3}$ について $\star dt_{j}$ を求め、$H^{1}_{\mathrm{dR}}\times H^{2}_{\mathrm{dR}}$ の対の行列を基底 $[dt_{i}]$, $[\star dt_{j}]$ で求めよ。
4. 任意の計量を入れた $S^{n}$ のオイラー標数を求め、$S^{2}$ と $T^{2}$ で $\dim\ker D^{+}$, $\dim\ker D^{-}$（\ref{gl:euler-index}）を求めよ。
:::

::: solution
**1.** \ref{gl:torus-harmonic-forms.3} から $b_{k}(T^{n})=\binom{n}{k}=\binom{n}{n-k}=b_{n-k}$、$\chi(T^{n})=\sum_{k}(-1)^{k}\binom{n}{k}=(1-1)^{n}=0$。

**2.** $(dt_{1},dt_{2})$ は正の正規直交余接フレームなので、\ref{riem:hodge-star-properties.1} から $\star dt_{1}=dt_{2}$, $\star dt_{2}=-dt_{1}$ で、$\mathcal{H}^{1}$ の上で $\star\star=-1$。$\int_{T^{2}}dt_{1}\wedge dt_{2}=\operatorname{vol}(T^{2})=4\pi^{2}$ なので、対の行列は $4\pi^{2}\begin{pmatrix}0&1\\-1&0\end{pmatrix}$ で、行列式 $16\pi^{4}\neq0$ から非退化。$\star h=a\,dt_{2}-b\,dt_{1}$, $h\wedge\star h=(a^{2}+b^{2})\,dt_{1}\wedge dt_{2}$ なので $\langle[h],[\star h]\rangle=4\pi^{2}(a^{2}+b^{2})=\int|h|^{2}d\mu_{g}=\|h\|_{L^{2}}^{2}$。

**3.** $\star dt_{1}=dt_{2}\wedge dt_{3}$, $\star dt_{2}=-dt_{1}\wedge dt_{3}=dt_{3}\wedge dt_{1}$, $\star dt_{3}=dt_{1}\wedge dt_{2}$。$\int dt_{i}\wedge\star dt_{j}=\int\langle dt_{i},dt_{j}\rangle\mathrm{vol}_{g}=(2\pi)^{3}\delta_{ij}$ なので、行列は $(2\pi)^{3}I_{3}$。$b_{1}=b_{2}=3$ である。

**4.** \ref{gl:sphere-surface-harmonic.1} と \ref{gl:hodge-theorem.2} から $b_{0}=b_{n}=1$、ほかは $0$（$n=1$ では $b_{0}=b_{1}=1$）なので $\chi(S^{n})=1+(-1)^{n}$ で、$n$ が奇数なら $0$（\ref{gl:euler-index.4} と一致）。\ref{gl:euler-index.2} から、$S^{2}$ では $\dim\ker D^{+}=\dim(\mathcal{H}^{0}_{\mathbb{C}}\oplus\mathcal{H}^{2}_{\mathbb{C}})=2$, $\dim\ker D^{-}=0$ で差は $2=\chi(S^{2})$、$T^{2}$ では $2$ と $2$ で差は $0=\chi(T^{2})$。
:::

::: problem ★★ 標準：トーラスの 1 形式のホッジ分解とピタゴラスの等式 {#gl:ex-hoc-2}
$T^{2}$ の上の $1$ 形式 $\omega\defeq(2+\sin t_{2})\,dt_{1}+(\cos t_{1}+\sin(t_{1}+t_{2}))\,dt_{2}$ を考える（\ref{gl:torus-harmonic-forms} の記号）。
1. $d\omega$ と $\delta\omega$ を求めよ。
2. $H\omega$, $G\omega$, $\alpha\defeq\delta G\omega$, $\beta\defeq dG\omega$ を求め、$\omega=H\omega+d\alpha+\delta\beta$ を確かめよ。
3. $\|\omega\|^{2}$, $\|H\omega\|^{2}$, $\|d\alpha\|^{2}$, $\|\delta\beta\|^{2}$ を求め、\ref{gl:hodge-decomposition.1} の直交性と合うことを確かめよ。
:::

::: solution
\ref{gl:torus-harmonic-forms.1} と $\iota_{1}(dt_{1}\wedge dt_{2})=dt_{2}$, $\iota_{2}(dt_{1}\wedge dt_{2})=-dt_{1}$ から、関数 $P,Q,b$ について
$$
\begin{aligned}
d(P\,dt_{1}+Q\,dt_{2})&=(D_{1}Q-D_{2}P)\,dt_{1}\wedge dt_{2},\qquad\delta(P\,dt_{1}+Q\,dt_{2})=-(D_{1}P+D_{2}Q),\\
\delta(b\,dt_{1}\wedge dt_{2})&=(D_{2}b)\,dt_{1}-(D_{1}b)\,dt_{2}.
\end{aligned}
$$
$s\defeq t_{1}+t_{2}$ と書く。

**1.** $D_{1}Q=-\sin t_{1}+\cos s$, $D_{2}P=\cos t_{2}$, $D_{1}P=0$, $D_{2}Q=\cos s$ なので $d\omega=(-\sin t_{1}+\cos s-\cos t_{2})\,dt_{1}\wedge dt_{2}$, $\delta\omega=-\cos s$。

**2.** $\mathcal{H}^{1}$ の正規直交基底 $(2\pi)^{-1}dt_{1}$, $(2\pi)^{-1}dt_{2}$（\ref{gl:torus-harmonic-forms.3}）について $(\omega,dt_{1})=\int P=8\pi^{2}$, $(\omega,dt_{2})=\int Q=0$ なので $H\omega=2\,dt_{1}$。\ref{gl:torus-harmonic-forms.2} から $\Delta(\sin t_{2}\,dt_{1})=\sin t_{2}\,dt_{1}$, $\Delta(\cos t_{1}\,dt_{2})=\cos t_{1}\,dt_{2}$, $\Delta(\sin s\,dt_{2})=2\sin s\,dt_{2}$ なので、$u\defeq\sin t_{2}\,dt_{1}+(\cos t_{1}+\frac12\sin s)\,dt_{2}$ は $\Delta u=\omega-H\omega$ を満たし、係数の平均が $0$ なので $\mathcal{H}^{1}$ と直交する。\ref{gl:green-operator.1} から $G\omega=u$ で
$$
\alpha=-\tfrac12\cos s,\qquad\beta=\bigl(-\sin t_{1}+\tfrac12\cos s-\cos t_{2}\bigr)\,dt_{1}\wedge dt_{2}.
$$
$d\alpha=\frac12\sin s\,(dt_{1}+dt_{2})$, $\delta\beta=(\sin t_{2}-\frac12\sin s)\,dt_{1}+(\cos t_{1}+\frac12\sin s)\,dt_{2}$ で、和をとると $dt_{1}$ の係数は $2+\sin t_{2}$、$dt_{2}$ の係数は $\cos t_{1}+\sin s$ で $\omega$ に戻る。

**3.** 各点で $|P\,dt_{1}+Q\,dt_{2}|^{2}=|P|^{2}+|Q|^{2}$。$(0,2\pi)^{2}$ の上で $\sin^{2}$, $\cos^{2}$ の積分は $2\pi^{2}$、周波数の違う三角関数の積の積分は $0$ なので
$$
\|\omega\|^{2}=(16\pi^{2}+2\pi^{2})+(2\pi^{2}+2\pi^{2})=22\pi^{2},\quad\|H\omega\|^{2}=16\pi^{2},\quad\|d\alpha\|^{2}=\pi^{2},\quad\|\delta\beta\|^{2}=5\pi^{2}.
$$
$16+1+5=22$ で、三つの成分の直交性によるピタゴラスの等式と一致する。
:::

::: problem ★★★ 発展：トーラスの d+δ の指数をフーリエ係数で求める {#gl:ex-hoc-3}
$T^{2}$ の上の $D^{+}$, $D^{-}$（\ref{gl:euler-index}）を考える。偶数次の形式を $f+g\,dt_{1}\wedge dt_{2}$、奇数次の形式を $a\,dt_{1}+b\,dt_{2}$ と書く。
1. $D^{\pm}$ を座標で書き、$D^{+}$ の主表象の行列式を計算して楕円型であることを直接確かめよ。
2. フーリエ係数を使って $\ker D^{+}$, $\ker D^{-}$ と像 $D^{+}(H^{1}(T^{2};\Lambda^{\mathrm{ev}}))$ を求め、$D^{+}$ の指数が $0$ であることを示して \ref{gl:euler-index.3} と比べよ。
:::

::: solution
**Step 1.** 【主張：$D^{+}(f+g\,dt_{1}\wedge dt_{2})=(D_{1}f+D_{2}g)\,dt_{1}+(D_{2}f-D_{1}g)\,dt_{2}$、$D^{-}(a\,dt_{1}+b\,dt_{2})=-(D_{1}a+D_{2}b)+(D_{1}b-D_{2}a)\,dt_{1}\wedge dt_{2}$】\ref{gl:torus-harmonic-forms.1} から $df=D_{1}f\,dt_{1}+D_{2}f\,dt_{2}$, $\delta f=0$, $d(g\,dt_{1}\wedge dt_{2})=0$, $\delta(g\,dt_{1}\wedge dt_{2})=D_{2}g\,dt_{1}-D_{1}g\,dt_{2}$、奇数次も同様。

**Step 2.** 【主張：$D^{+}$ の主表象は、フレーム $(1,dt_{1}\wedge dt_{2})$, $(dt_{1},dt_{2})$ で $i\begin{pmatrix}\xi_{1}&\xi_{2}\\\xi_{2}&-\xi_{1}\end{pmatrix}$、行列式は $\xi_{1}^{2}+\xi_{2}^{2}$】$D_{1}$, $D_{2}$ の係数行列は $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$, $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ で、行列式は $i^{2}(-\xi_{1}^{2}-\xi_{2}^{2})$。$\xi\neq0$ で可逆なので楕円型（\ref{gl:hodge-laplacian-symbol.3} の制限と一致）。

**Step 3.** 【主張：$\mathbf{u}=(f,g)\in H^{1}$ について $\widehat{D^{+}\mathbf{u}}(m)=M(m)\hat{\mathbf{u}}(m)$、$M(m)\defeq i\begin{pmatrix}m_{1}&m_{2}\\m_{2}&-m_{1}\end{pmatrix}$ で、$|M(m)v|=|m||v|$。$D^{-}$ の係数の行列は $-M(m)$】\ref{gl:torus-sobolev.2} を成分ごとに使う。$S(m)\defeq\begin{pmatrix}m_{1}&m_{2}\\m_{2}&-m_{1}\end{pmatrix}$ は実対称で $S(m)^{2}=|m|^{2}I$ なので $|M(m)v|^{2}=\bar{v}^{\mathsf{T}}S(m)^{2}v=|m|^{2}|v|^{2}$。$D^{-}$ は Step 1 から $(\hat{a},\hat{b})\mapsto i(-m_{1}\hat{a}-m_{2}\hat{b},\ m_{1}\hat{b}-m_{2}\hat{a})$。

**Step 4.** 【主張：$\ker D^{+}$ は定数の $(f,g)$、$\ker D^{-}$ は定数の $(a,b)$ で、どちらも $2$ 次元】\ref{gl:elliptic-kernel-range.1} から核は $H^{1}$ の中で考えればよく、Step 3 から $m\neq0$ で係数は $0$、\ref{gl:torus-fourier-basis.1} から定数。定数は核に入る。これは $\mathcal{H}^{0}_{\mathbb{C}}\oplus\mathcal{H}^{2}_{\mathbb{C}}$ と $\mathcal{H}^{1}_{\mathbb{C}}$ で、\ref{gl:euler-index.2} と一致する。

**Step 5.** 【主張：$D^{+}(H^{1})=\{\mathbf{w}\in L^{2}(T^{2};\Lambda^{1}):\hat{\mathbf{w}}(0)=0\}$ で余次元 $2$、指数 $0=\chi(T^{2})$】$M(0)=0$ から $\subset$。逆に $\hat{\mathbf{w}}(0)=0$ なら $\hat{\mathbf{u}}(m)\defeq M(m)^{-1}\hat{\mathbf{w}}(m)$（$m\neq0$）、$\hat{\mathbf{u}}(0)\defeq0$ とおくと $|\hat{\mathbf{u}}(m)|=|\hat{\mathbf{w}}(m)|/|m|$ で $\sum(1+|m|^{2})|\hat{\mathbf{u}}(m)|^{2}\le2\sum|\hat{\mathbf{w}}(m)|^{2}<\infty$。\ref{gl:torus-fourier-basis.2} でこの係数の $L^{2}$ の元 $\mathbf{u}$ をとると、\ref{gl:torus-sobolev.1} から $\mathbf{u}\in H^{1}$、Step 3 と \ref{gl:torus-fourier-basis.1} から $D^{+}\mathbf{u}=\mathbf{w}$。像は連続な線形汎関数 $\mathbf{w}\mapsto\hat{\mathbf{w}}(0)$（$2$ 成分）の共通の核なので閉じていて余次元 $2$、余核は $\ker D^{-}$（定数）と同じ次元である（\ref{gl:elliptic-fredholm.3}）。指数は $2-2=0$ で、\ref{gl:torus-harmonic-forms.3} の $b_{0}-b_{1}+b_{2}=1-2+1=0$ と一致する。

なお、実の $f,g$ について $F\defeq f-ig$ とおくと $(D_{1}+iD_{2})F=(D_{1}f+D_{2}g)+i(D_{2}f-D_{1}g)$ なので、$a\,dt_{1}+b\,dt_{2}\leftrightarrow a+ib$ と同一視すれば、実の形式の上の $D^{+}$ は $T^{2}$ のコーシー–リーマン作用素 $D_{1}+iD_{2}$ である（\see{gl:prob-er-cauchy-riemann-torus}）。
:::
