# 主表象 {#gl:page-principal-symbol keywords="principal symbol of a differential operator, sigma_P(m, xi) on the cotangent bundle, coordinate invariance of the top-order coefficients, characterization by oscillating functions e^{i t phi}, symbol of a composition, of the formal transpose and of the formal adjoint, commutators lower the order, 主表象, 表象, 最高階の係数"}

前の系列（\ref{gl:page-sobolev-sections}, \ref{gl:page-negative-sobolev-torus}）では、閉多様体の上の微分作用素がソボレフ空間の間の有界作用素になり、形式的転置を使って弱解が定義できることを見た。この系列の目標は、楕円正則性（弱解が自動的に滑らかになること）とホッジの定理を示すことで、このページはその準備である。微分作用素の性質のうち、高い周波数の振る舞いを決めるのは最高階の部分だけで、それを余接ベクトルの多項式として取り出したものが**主表象**である。このページでは、主表象が座標によらず余接束の上の関数として定まることを、座標変換で最高階の係数がどう変わるかを追って確かめ、高い周波数の波 $e^{it\varphi}$ による座標を使わない特徴づけを与え、合成・形式的転置・形式的随伴の主表象を計算する。主表象が $0$ でない余接ベクトルで常に可逆であるという楕円性と、その例（ホッジのラプラシアン・$d+\delta$ など）、トーラスの上の評価は次のページで扱う。

## 記法と定義の確認 {#gl:sec-ps-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（$n\ge1$）、$g$ はリーマン計量、$\mu_{g}$ はリーマン測度（\ref{gl:riemannian-measure}）。$M$ の点は $m$ と書き、座標近傍は $(U,x)$ と書く。
- 微分作用素とその係数は \ref{gl:differential-operator-manifold}、例は \ref{gl:differential-operator-examples}、ソボレフ空間の間の有界性は \ref{gl:differential-operator-sobolev}、形式的転置と形式的随伴は \ref{gl:formal-transpose}, \ref{gl:formal-transpose-examples}。これらの定義・証明はここでは繰り返さない。
- **複素係数.** 関数は複素数値とする（前のページまでと同じ）。ベクトル束の間の作用素では、実ベクトル束 $E$ をその複素化 $E^{\mathbb{C}}\defeq E\otimes\mathbb{C}$（局所自明化で成分が複素数の切断）に置き換え、係数 $A_{\alpha}$ は複素行列とする。複素ベクトル束（ファイバーが複素ベクトル空間で、局所自明化がファイバーごとに $\mathbb{C}^{r}$ への複素線形同型、推移関数が滑らかなもの）も同じように扱い、そのときは $E^{\mathbb{C}}\defeq E$ と読む。$\Phi$ を $E$ の局所自明化とするとき、$\Phi_{m}\colon E_{m}^{\mathbb{C}}\to\mathbb{C}^{r}$ はそのファイバーの部分（を複素線形に延ばしたもの）である。
- 多重指数 $\alpha$ と $\zeta\in\mathbb{C}^{n}$ について $\zeta^{\alpha}\defeq\prod_{j}\zeta_{j}^{\alpha_{j}}$、$(i\xi)^{\alpha}\defeq\prod_{j}(i\xi_{j})^{\alpha_{j}}$。添字の列 $I=(i_{1},\dots,i_{k})\in\{1,\dots,n\}^{k}$ について $\partial_{I}\defeq\partial_{i_{1}}\cdots\partial_{i_{k}}$、$\zeta_{I}\defeq\zeta_{i_{1}}\cdots\zeta_{i_{k}}$。
- 余接空間と関数の微分は \ref{mfd:cotangent-space}、座標ベクトルは \ref{mfd:tangent-basis}。$\xi\in T_{m}^{*}M$ を $\xi=\sum_{i}\xi_{i}(dx_{i})_{m}$ と書き、$(\xi_{i})$ を $(U,x)$ での成分という。計量による同一視 $\flat$, $\sharp$ は \ref{riem:musical-gradient}。$T_{m}^{*}M$ には内積 $\langle\xi,\eta\rangle\defeq g(\xi^{\sharp},\eta^{\sharp})=\xi(\eta^{\sharp})=\sum_{i,j}g^{ij}\xi_{i}\eta_{j}$ を入れ、$|\xi|^{2}\defeq\langle\xi,\xi\rangle$ と書く。ラプラシアンの符号は前のページまでと同じで、関数の上では $\Delta=-\operatorname{div}\operatorname{grad}$。
- **選択公理**：新しい選択は使わない（局所化のデータの 1 の分割で DC を使う点は前の系列と同じだが、このページの議論はそれを直接は使わない）。試験関数・位相関数はすべて具体的に作る。
:::

## 主表象 {#gl:sec-ps-symbol}

$k$ 階以下の微分作用素 $P$ の座標での式 $\sum_{|\alpha|\le k}A_{\alpha}\partial^{\alpha}$ のうち、$|\alpha|=k$ の部分だけを残し、$\partial_{j}$ を $i\xi_{j}$ に置き換えたものが主表象である。係数 $A_{\alpha}$ そのものは座標を替えると下の階数の項と混ざって複雑に変わるが、最高階の部分は、$\xi$ を余接ベクトルの成分と読む限り変わらない。そのために、合成関数の高階微分の最高階の項を調べる。

::: lemma 合成関数の高階微分の最高階の項 {#gl:ps-chain-rule-top keywords="k-th derivatives of w o tau: the top-order part is sum over I of (d_I w) o tau times products of first derivatives of tau; the remainder involves only derivatives of w of order < k" index="合成関数の高階微分|ごうせいかんすうのこうかいびぶん"}
$V'$, $V$ を $\mathbb{R}^{n}$ の開集合、$\tau\colon V'\to V$ を滑らかな写像、$k\ge1$、$J=(j_{1},\dots,j_{k})$ を添字の列とする。$|\gamma|<k$ の多重指数 $\gamma$ ごとに $c_{\gamma}\in C^{\infty}(V')$（$\tau$ と $J$ だけで決まる）があって、すべての $w\in C^{\infty}(V)$ について $V'$ の上で
$$
\begin{aligned}
\partial_{J}(w\circ\tau)&=\sum_{I\in\{1,\dots,n\}^{k}}\bigl((\partial_{I}w)\circ\tau\bigr)\prod_{l=1}^{k}\partial_{j_{l}}\tau_{i_{l}}\\
&\quad+\sum_{|\gamma|<k}c_{\gamma}\,(\partial^{\gamma}w)\circ\tau.
\end{aligned}
$$
:::

::: proof
$k$ についての帰納法。$k=1$ は連鎖律 $\partial_{j}(w\circ\tau)=\sum_{i}((\partial_{i}w)\circ\tau)\,\partial_{j}\tau_{i}$（$c_{\gamma}=0$）。$k$ で成り立つとし、$J'=(j_{1},\dots,j_{k},j)$ とする。$k$ の式の各項を $\partial_{j}$ で微分する。

**Step 1.** 【主張：主要項 $((\partial_{I}w)\circ\tau)\prod_{l}\partial_{j_{l}}\tau_{i_{l}}$ を $\partial_{j}$ で微分すると、$\sum_{i}((\partial_{i}\partial_{I}w)\circ\tau)\,\partial_{j}\tau_{i}\prod_{l}\partial_{j_{l}}\tau_{i_{l}}$ と、$w$ の $k$ 階の導関数に滑らかな関数を掛けた項の和になる】積の微分法で、$(\partial_{I}w)\circ\tau$ を微分した部分は連鎖律から前者、係数 $\prod_{l}\partial_{j_{l}}\tau_{i_{l}}$ を微分した部分は $((\partial_{I}w)\circ\tau)\cdot\partial_{j}\bigl(\prod_{l}\partial_{j_{l}}\tau_{i_{l}}\bigr)$ で後者。前者を $I'=(i_{1},\dots,i_{k},i)$ について足したものが $k+1$ の式の主要項である。

**Step 2.** 【主張：剰余項 $c_{\gamma}(\partial^{\gamma}w)\circ\tau$（$|\gamma|<k$）を微分すると、$w$ の $|\gamma|+1\le k$ 階以下の導関数に滑らかな関数を掛けた項の和になる】$\partial_{j}(c_{\gamma}(\partial^{\gamma}w)\circ\tau)=(\partial_{j}c_{\gamma})(\partial^{\gamma}w)\circ\tau+c_{\gamma}\sum_{i}((\partial_{i}\partial^{\gamma}w)\circ\tau)\,\partial_{j}\tau_{i}$。

Step 1・2 で現れた主要項以外の項は、どれも $w$ の $k$ 階以下の導関数に $\tau$ と $J'$ だけで決まる滑らかな関数を掛けたものなので、$k+1$ の場合の剰余項にまとめられる。
:::

**対称な係数.** $\sum_{|\alpha|=k}A_{\alpha}\partial^{\alpha}$ は、添字の列 $I$ について対称な（$I$ の並べ替えで変わらない）係数 $C^{I}\defeq\frac{\alpha!}{k!}A_{\alpha}$（$\alpha$ は $I$ に現れる各添字の個数を並べた多重指数）を使って $\sum_{I\in\{1,\dots,n\}^{k}}C^{I}\partial_{I}$ と書ける。$\alpha$ を与える列 $I$ はちょうど $k!/\alpha!$ 個あり、$\partial_{I}=\partial^{\alpha}$ だからである。同じ理由で $\sum_{|\alpha|=k}A_{\alpha}\zeta^{\alpha}=\sum_{I}C^{I}\zeta_{I}$。逆に、対称な $(C^{I})$ は $A_{\alpha}=\sum_{I\text{ の型が }\alpha}C^{I}$ で $(A_{\alpha})$ から決まる。

::: theorem 主表象は座標によらない {#gl:principal-symbol-invariance keywords="invariance of the principal symbol: the top-order part sum_{|alpha| = k} A_alpha (i xi)^alpha, read with xi the components of a cotangent vector, is independent of the chart and of the local trivializations" index="主表象の座標不変性|しゅひょうしょうのざひょうふへんせい, 最高階の係数の座標変換|さいこうかいのけいすうのざひょうへんかん"}
$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階以下の微分作用素（\ref{gl:differential-operator-manifold.2}。関数の場合は $E=F=M\times\mathbb{C}$）とする。座標近傍 $(U,x)$ と $U$ の上の局所自明化 $\Phi$（$E$ の）, $\Psi$（$F$ の）での係数を $A_{\alpha}$ とし、$m\in U$, $\xi=\sum_{i}\xi_{i}(dx_{i})_{m}\in T_{m}^{*}M$ について
$$
\sigma^{x,\Phi,\Psi}(m,\xi)\defeq\Psi_{m}^{-1}\Bigl(\sum_{|\alpha|=k}A_{\alpha}(x(m))\,(i\xi)^{\alpha}\Bigr)\Phi_{m}
$$
（$E_{m}^{\mathbb{C}}\to F_{m}^{\mathbb{C}}$ の線形写像）とおく。$m$ を含む別の座標近傍 $(V,y)$ と $V$ の上の局所自明化 $\Phi'$, $\Psi'$ について、$\sigma^{x,\Phi,\Psi}(m,\xi)=\sigma^{y,\Phi',\Psi'}(m,\xi)$ である。
:::

::: intuition
微分作用素の係数は座標を替えるとごちゃごちゃに変わるが、いちばん高い階数の部分だけは、「$\partial_{j}$ を余接ベクトルの成分 $i\xi_{j}$ に置き換えた多項式」として、どの座標で計算しても同じものになる。
:::

::: proof
**Step 1（係数の一意性）.** 【主張：$(U,x)$ と $\Phi$, $\Psi$ を固定するとき、係数 $A_{\alpha}$ は $P$ から一通りに決まる。とくに $U$ の中の座標近傍 $(U',x\restr{U'})$ での係数は $A_{\alpha}$ の $x(U')$ への制限である】二通りの係数の差を $B_{\alpha}$ とすると、すべての $u$ について $\sum_{|\alpha|\le k}B_{\alpha}\partial^{\alpha}(u_{\Phi}\circ x^{-1})=0$。$z_{0}\in x(U)$、多重指数 $\beta$、$c\in\{1,\dots,r\}$ を固定し、\ref{fa:test-function-density.2} から $\varphi\in C_{c}^{\infty}(x(U))$ で $z_{0}$ の近傍で $1$ となるものをとり、$u\defeq(x,\Phi)^{*}\bigl(\varphi(z)\,\tfrac{(z-z_{0})^{\beta}}{\beta!}\,\mathbf{e}_{c}\bigr)$（$\mathbf{e}_{c}$ は標準基底）とおくと、$u$ は滑らかな切断で、$z_{0}$ の近くで $u_{\Phi}\circ x^{-1}=\frac{(z-z_{0})^{\beta}}{\beta!}\mathbf{e}_{c}$。$\partial^{\alpha}\frac{(z-z_{0})^{\beta}}{\beta!}$ の $z_{0}$ での値は $\alpha=\beta$ のとき $1$、それ以外は $0$ なので、$z_{0}$ で式は $B_{\beta}(z_{0})\mathbf{e}_{c}=0$。$z_{0}$, $\beta$, $c$ は任意なので $B_{\beta}=0$。制限についての主張は、$A_{\alpha}\restr{x(U')}$ が $(U',x\restr{U'})$ での係数の条件を満たすことと一意性から。

**Step 2（座標の取り替え）.** 【主張：同じ局所自明化 $\Phi$, $\Psi$ のまま、$U\cap V$ の上で座標を $x$ から $y$ に替えると、$m\in U\cap V$ で $\sigma^{x,\Phi,\Psi}(m,\xi)=\sigma^{y,\Phi,\Psi}(m,\xi)$】$\tau\defeq y\circ x^{-1}\colon x(U\cap V)\to y(U\cap V)$、$G\defeq\tau^{-1}=x\circ y^{-1}$ とし、$W\defeq u_{\Phi}\circ y^{-1}$、$w\defeq u_{\Phi}\circ x^{-1}=W\circ\tau$ とする。\ref{gl:ps-chain-rule-top} を $W\circ\tau$ に（成分ごとに）使い、$G$ と合成すると、列 $I$ ごとに
$$
(\partial_{I}w)\circ G=\sum_{J}\Bigl(\prod_{l=1}^{k}(\partial_{i_{l}}\tau_{j_{l}})\circ G\Bigr)\partial_{J}W+\bigl(W\text{ の }k\text{ 階未満の導関数の項}\bigr).
$$
$(Pu)_{\Psi}\circ y^{-1}=\bigl((Pu)_{\Psi}\circ x^{-1}\bigr)\circ G=\sum_{\alpha}(A_{\alpha}\circ G)\,(\partial^{\alpha}w)\circ G$ に入れると、$|\alpha|<k$ の項と剰余項は $W$ の $k$ 階未満の導関数しか含まないので、$k$ 階の部分は $\sum_{J}D^{J}\partial_{J}W$、
$$
D^{J}\defeq\sum_{I}(C^{I}\circ G)\prod_{l=1}^{k}(\partial_{i_{l}}\tau_{j_{l}})\circ G
$$
である（$C^{I}$ は $A_{\alpha}$ の対称な係数）。$J$ の並べ替えは $I$ の同じ並べ替えと組にすれば和が変わらないので $D^{J}$ は対称で、Step 1 から、これが $(U\cap V,y)$ での $k$ 階の係数の対称な形である。$m$ で $z\defeq x(m)$ とし、$\xi=\sum_{j}\eta_{j}(dy_{j})_{m}$ と書く。$(dy_{j})_{m}$ を $\partial/\partial x_{i}|_{m}$ に施すと $\partial_{i}(y_{j}\circ x^{-1})(z)=\partial_{i}\tau_{j}(z)$ なので（\ref{mfd:tangent-basis.1}）、$\xi_{i}=\sum_{j}\eta_{j}\,\partial_{i}\tau_{j}(z)$。よって
$$
\begin{aligned}
\sum_{J}D^{J}(y(m))\,(i\eta)_{J}&=\sum_{I}C^{I}(z)\prod_{l=1}^{k}\Bigl(i\sum_{j}\partial_{i_{l}}\tau_{j}(z)\,\eta_{j}\Bigr)\\
&=\sum_{I}C^{I}(z)\,(i\xi)_{I}.
\end{aligned}
$$
両辺に $\Psi_{m}^{-1}$, $\Phi_{m}$ を掛ければ主張が出る。

**Step 3（局所自明化の取り替え）.** 【主張：同じ座標 $x$ のまま、$U\cap V$ の上で局所自明化を $\Phi'$, $\Psi'$ に替えても $\sigma$ は変わらない】\ref{mfd:vector-bundle-gl.1} から滑らかな $a\colon U\cap V\to\mathrm{GL}(r)$, $b\colon U\cap V\to\mathrm{GL}(r')$ があって $u_{\Phi'}=a\,u_{\Phi}$, $v_{\Psi'}=b\,v_{\Psi}$、すなわち $\Phi'_{m}=a(m)\Phi_{m}$, $\Psi'_{m}=b(m)\Psi_{m}$。$\tilde{a}\defeq a\circ x^{-1}$ などと書くと
$$
(Pu)_{\Psi'}\circ x^{-1}=\tilde{b}\sum_{\alpha}A_{\alpha}\,\partial^{\alpha}\bigl(\tilde{a}^{-1}(u_{\Phi'}\circ x^{-1})\bigr).
$$
ライプニッツ則で展開すると、$\tilde{a}^{-1}$ が微分される項は $u_{\Phi'}\circ x^{-1}$ の $k$ 階未満の導関数しか含まない。よって Step 1 から新しい $k$ 階の係数は $\tilde{b}A_{\alpha}\tilde{a}^{-1}$（$|\alpha|=k$）で、$\Psi'^{-1}_{m}\,b(m)A_{\alpha}a(m)^{-1}\,\Phi'_{m}=\Psi_{m}^{-1}A_{\alpha}\Phi_{m}$。

**Step 4.** 【主張：定理】$(U\cap V,x)$ と $(U\cap V,y)$ は座標近傍で、Step 1 からそこでの係数は元の係数の制限である。$(x,\Phi,\Psi)\to(y,\Phi,\Psi)$ を Step 2 で、$(y,\Phi,\Psi)\to(y,\Phi',\Psi')$ を Step 3 で取り替えればよい。

::: hypcheck
- **$|\alpha|=k$ の部分だけをとること**：Step 2・3 で、取り替えによって生じる余分な項がすべて $k$ 階未満になることに使った。$k$ 階未満の係数は不変でない：$M=\mathbb{R}$（局所的な計算なので閉でなくてよい）で $P=\frac{d^{2}}{dx^{2}}$ を $x=y^{3}+y$ で書き直すと $P=(3y^{2}+1)^{-2}\frac{d^{2}}{dy^{2}}-6y(3y^{2}+1)^{-3}\frac{d}{dy}$ で、$1$ 階の係数が現れる。
- **$\xi$ を余接ベクトルの成分と読むこと**：Step 2 の最後に使った。$\xi$ を接ベクトルの成分（$\partial_{j}$ の係数）と読むと、成分は $\partial_{i}\tau_{j}$ の逆行列で変わるので、一般の座標変換では等式は成り立たない（上の例で、主表象 $-\xi_{x}^{2}$ は $\xi_{x}=\eta_{y}/(3y^{2}+1)$ で $-(3y^{2}+1)^{-2}\eta_{y}^{2}$ に一致する）。
- **推移関数が滑らか**：Step 3 で $\tilde{a}^{-1}$ を微分するのに使った。
- **公理**：選択は使わない。
:::
:::

::: definition 主表象 {#gl:principal-symbol keywords="principal symbol sigma_P(m, xi) = sum_{|alpha| = k} A_alpha(x(m)) (i xi)^alpha of a differential operator of order at most k, a linear map E_m -> F_m homogeneous of degree k in xi in T_m^* M; convention with the factor i^k" index="主表象|しゅひょうしょう, 表象（微分作用素）|ひょうしょうびぶんさようそ"}
$k$ 階以下の微分作用素 $P\colon\Gamma(M,E)\to\Gamma(M,F)$、$m\in M$、$\xi\in T_{m}^{*}M$ について、\ref{gl:principal-symbol-invariance} の共通の値を
$$
\sigma_{P}(m,\xi)\colon E_{m}^{\mathbb{C}}\to F_{m}^{\mathbb{C}}
$$
と書き、$P$ の（$k$ 次の）**主表象**という。関数に作用する作用素では、$\sigma_{P}(m,\xi)$ は複素数で、$\sigma_{P}(m,\xi)=\sum_{|\alpha|=k}a_{\alpha}(x(m))(i\xi)^{\alpha}$。
:::

::: intuition
主表象とは、作用素の最高階の部分で「$\partial_{j}$ を $i\xi_{j}$ に置き換えた」もので、各点の各余接ベクトルに、ファイバーの間の線形写像を対応させる。$i$ を付けるのは、$e^{i\xi\cdot z}$ を $\partial_{j}$ で微分すると $i\xi_{j}$ 倍になるからである。
:::

$\sigma_{P}(m,\xi)$ は、$\xi$ の成分について次数 $k$ の斉次多項式で、実数 $\lambda$ について $\sigma_{P}(m,\lambda\xi)=\lambda^{k}\sigma_{P}(m,\xi)$。座標近傍の上で $(m,\xi)\mapsto\sigma_{P}(m,\xi)$ の行列成分は $x(m)$ と $\xi_{i}$ の滑らかな関数なので、$\sigma_{P}$ は余接束の上の滑らかな関数（行列値）とみなせる。主表象は $k$ をどう選ぶかによる：$P$ が $k-1$ 階以下なら、$k$ 次の主表象は $0$ である。また \ref{gl:principal-symbol-invariance} の Step 1 から、**$k$ 次の主表象が恒等的に $0$ なら $P$ は $k-1$ 階以下**である（$\sum_{|\alpha|=k}A_{\alpha}\zeta^{\alpha}$ が $\zeta\in\mathbb{R}^{n}$ で恒等的に $0$ なら多項式として $0$ で、$A_{\alpha}=0$）。

::: example 主表象の例 {#gl:principal-symbol-examples keywords="principal symbols of multiplication operators, vector fields (i xi(X)), the Laplace-Beltrami operator (|xi|^2) and the exterior derivative (i xi wedge)" index="主表象の例|しゅひょうしょうのれい"}
1. $f\in C^{\infty}(M)$ を掛ける $0$ 階の作用素：$\sigma(m,\xi)=f(m)$。
2. ベクトル場 $X=\sum_{j}X^{j}\partial_{j}$（$1$ 階、\ref{gl:differential-operator-examples.2}）：$\sigma_{X}(m,\xi)=\sum_{j}X^{j}(m)\,i\xi_{j}=i\,\xi(X_{m})$。
3. ラプラシアン $\Delta$（$2$ 階、$2$ 階の係数は $-g^{ij}$、\ref{gl:differential-operator-examples.3}）：$\sigma_{\Delta}(m,\xi)=\sum_{i,j}(-g^{ij})(i\xi_{i})(i\xi_{j})=\sum_{i,j}g^{ij}\xi_{i}\xi_{j}=|\xi|^{2}$。
4. 外微分 $d\colon\Omega^{k}\to\Omega^{k+1}$（$1$ 階、\ref{gl:differential-operator-examples.4}）：余接フレームによる自明化で $\partial_{j}$ の係数は $\alpha\mapsto dx_{j}\wedge\alpha$ なので、$\sigma_{d}(m,\xi)\alpha=\sum_{j}i\xi_{j}\,dx_{j}\wedge\alpha=i\,\xi\wedge\alpha$（$\xi$ を外から掛けて $i$ 倍する写像）。
:::

主表象には、座標を使わない次の特徴づけがある。合成や星作用素を含む作用素の主表象を計算するときに便利である。

::: proposition 振動する関数による主表象の特徴づけ {#gl:symbol-oscillation keywords="e^{-i t phi} P(e^{i t phi} u) is a polynomial in t of degree at most k whose top coefficient is sigma_P(m, d phi_m) u(m)" index="主表象の振動による特徴づけ|しゅひょうしょうのしんどうによるとくちょうづけ"}
$P$ を $k$ 階以下の微分作用素、$\varphi\in C^{\infty}(M)$ を実数値、$u$ を $E^{\mathbb{C}}$ の滑らかな切断とする。滑らかな切断 $u_{0},\dots,u_{k}$ があって、すべての実数 $t$ について
$$
e^{-it\varphi}P(e^{it\varphi}u)=\sum_{j=0}^{k}t^{j}u_{j},\qquad u_{k}(m)=\sigma_{P}(m,d\varphi_{m})\,u(m).
$$
:::

::: proof
**Step 1.** 【主張：$\mathbb{R}^{n}$ の開集合の上の実数値の滑らかな関数 $\phi$ と多重指数 $\beta$ について、$e^{-it\phi}\partial^{\beta}(e^{it\phi})$ は $t$ の $|\beta|$ 次以下の多項式で、係数は滑らかな関数、$t^{|\beta|}$ の係数は $(i\partial\phi)^{\beta}\defeq\prod_{j}(i\partial_{j}\phi)^{\beta_{j}}$】$|\beta|$ の帰納法。$q$ を $t$ の $d$ 次以下の多項式（係数は滑らか）で $t^{d}$ の係数が $c$ とすると、$\partial_{j}(e^{it\phi}q)=e^{it\phi}(it\,\partial_{j}\phi\,q+\partial_{j}q)$ は $e^{it\phi}$ 掛ける $d+1$ 次以下の多項式で、$t^{d+1}$ の係数は $i\partial_{j}\phi\cdot c$。

**Step 2.** 【主張：座標近傍 $(U,x)$ の上で命題の式が成り立ち、$u_{j}$ の成分は $u$ の成分の導関数に滑らかな関数を掛けた和である】$\phi\defeq\varphi\circ x^{-1}$, $w\defeq u_{\Phi}\circ x^{-1}$ とする。ライプニッツ則から $e^{-it\phi}\partial^{\alpha}(e^{it\phi}w)=\sum_{\beta\le\alpha}\binom{\alpha}{\beta}e^{-it\phi}\partial^{\beta}(e^{it\phi})\,\partial^{\alpha-\beta}w$ で、Step 1 からこれは $|\alpha|$ 次以下の多項式、$t^{|\alpha|}$ の係数は $\beta=\alpha$ の項の $(i\partial\phi)^{\alpha}w$ だけから来る。$A_{\alpha}$ を掛けて足すと、$k$ 次以下の多項式で、$t^{k}$ の係数は $\sum_{|\alpha|=k}A_{\alpha}(i\partial\phi)^{\alpha}w$。$\partial_{j}\phi(x(m))$ は $d\varphi_{m}$ の成分なので、これは $\Psi$ で見た $\sigma_{P}(m,d\varphi_{m})u(m)$ である。

**Step 3.** 【主張：$u_{j}$ は座標近傍によらず $M$ 全体で定まる】各点 $m$ で、$t\mapsto e^{-it\varphi}P(e^{it\varphi}u)(m)$ は座標によらず決まる $t$ の関数で、多項式の係数はその関数から一通りに決まる（$k+1$ 個の異なる $t$ での値から、ヴァンデルモンドの行列式で決まる）。よって二つの座標近傍の Step 2 の $u_{j}$ は重なりで一致し、$M$ 上の滑らかな切断を定める。
:::

::: proposition 主表象の計算規則 {#gl:symbol-calculus keywords="symbol of a composition sigma_{PQ} = sigma_P sigma_Q; symbol of the formal transpose sigma_{P^t} = (-1)^k sigma_P and of the formal adjoint sigma_{P^*} = conj sigma_P; for bundles with fibre metrics, an operator Q with int <Pu, v> = int <u, Qv> has sigma_Q = (-1)^k sigma_P^T" index="主表象の計算規則|しゅひょうしょうのけいさんきそく, 合成の主表象|ごうせいのしゅひょうしょう, 転置の主表象|てんちのしゅひょうしょう"}
1. $P\colon\Gamma(M,F)\to\Gamma(M,G)$ を $k$ 階以下、$Q\colon\Gamma(M,E)\to\Gamma(M,F)$ を $l$ 階以下の微分作用素とすると、$PQ$ は $k+l$ 階以下で、$\sigma_{PQ}(m,\xi)=\sigma_{P}(m,\xi)\,\sigma_{Q}(m,\xi)$（$PQ$ は $k+l$ 次、$P$, $Q$ は $k$, $l$ 次の主表象）。同じ $k$ について $\sigma_{P+P'}=\sigma_{P}+\sigma_{P'}$。
2. 関数に作用する $k$ 階以下の $P$ について、形式的転置と形式的随伴（\ref{gl:formal-transpose}）の主表象は $\sigma_{P^{t}}(m,\xi)=(-1)^{k}\sigma_{P}(m,\xi)$、$\sigma_{P^{*}}(m,\xi)=\overline{\sigma_{P}(m,\xi)}$。
3. 実ベクトル束 $E$, $F$ にファイバー計量 $h_{E}$, $h_{F}$（滑らかなもの）を入れ、複素双線形に $E^{\mathbb{C}}$, $F^{\mathbb{C}}$ へ延ばす。実の切断を実の切断に写す $k$ 階以下の微分作用素 $P\colon\Gamma(M,E)\to\Gamma(M,F)$, $Q\colon\Gamma(M,F)\to\Gamma(M,E)$ が、すべての滑らかな実の切断 $u$, $v$ について
$$
\int_{M}h_{F}(Pu,v)\,d\mu_{g}=\int_{M}h_{E}(u,Qv)\,d\mu_{g}
$$
を満たせば、$\sigma_{Q}(m,\xi)=(-1)^{k}\sigma_{P}(m,\xi)^{\mathsf{T}}$。ここで $^{\mathsf{T}}$ は $h_{E}$, $h_{F}$ に関する転置（$h_{E}(L^{\mathsf{T}}f,e)=h_{F}(f,Le)$）である。
:::

::: intuition
最高階の部分だけを見れば、作用素の合成は主表象の掛け算になり、部分積分で微分を相手に移すと、主表象は（$i\xi$ の符号が反転するぶん）$(-1)^{k}$ 倍の転置になる。
:::

::: proof
**Step 1.** 【主張：1】座標近傍 $(U,x)$ と自明化で $Q=\sum_{\beta}B_{\beta}\partial^{\beta}$, $P=\sum_{\alpha}A_{\alpha}\partial^{\alpha}$ とすると、ライプニッツ則から
$$
PQu=\sum_{\alpha,\beta}A_{\alpha}B_{\beta}\,\partial^{\alpha+\beta}w+\bigl(B_{\beta}\text{ が微分される項}\bigr)
$$
（$w$ は $u$ の成分）で、後者は $w$ の $k+l$ 階未満の導関数しか含まない。よって $|\gamma|=k+l$ の係数は $\sum_{\alpha+\beta=\gamma,|\alpha|=k,|\beta|=l}A_{\alpha}B_{\beta}$ で、$(i\xi)^{\alpha+\beta}=(i\xi)^{\alpha}(i\xi)^{\beta}$ から
$$
\sum_{|\gamma|=k+l}\Bigl(\sum_{\alpha+\beta=\gamma}A_{\alpha}B_{\beta}\Bigr)(i\xi)^{\gamma}=\Bigl(\sum_{|\alpha|=k}A_{\alpha}(i\xi)^{\alpha}\Bigr)\Bigl(\sum_{|\beta|=l}B_{\beta}(i\xi)^{\beta}\Bigr).
$$
和の主表象は係数の和から。

**Step 2.** 【主張：2】\ref{gl:formal-transpose.2} から、$V=v\circ x^{-1}$ として $(P^{t}v)\circ x^{-1}=\gamma_{x}^{-1}\sum_{|\alpha|\le k}(-1)^{|\alpha|}\partial^{\alpha}(\gamma_{x}a_{\alpha}V)$。ライプニッツ則で展開すると、$\partial^{\alpha}$ がすべて $V$ にかかる項は $(-1)^{|\alpha|}a_{\alpha}\partial^{\alpha}V$ で、それ以外は $V$ の $|\alpha|$ 階未満の導関数しか含まない。よって $P^{t}$ の $k$ 階の係数は $(-1)^{k}a_{\alpha}$ で、$\sigma_{P^{t}}=(-1)^{k}\sigma_{P}$。$P^{*}v=\overline{P^{t}\bar{v}}$ の係数は $P^{t}$ の係数の共役なので、$\xi$ が実であることと $\overline{i^{k}}=(-1)^{k}i^{k}$ から $\sigma_{P^{*}}=\sum_{|\alpha|=k}(-1)^{k}\overline{a_{\alpha}}(i\xi)^{\alpha}=\overline{\sum_{|\alpha|=k}a_{\alpha}(i\xi)^{\alpha}}$。

**Step 3.** 【主張：3 の仮定の等式から、実数値の $\varphi\in C^{\infty}(M)$ と滑らかな切断 $u$, $v$（複素）について $\int_{M}H\,d\mu_{g}=0$、ただし $H(m)\defeq h_{F}(\sigma_{P}(m,d\varphi_{m})u(m),v(m))-(-1)^{k}h_{E}(u(m),\sigma_{Q}(m,d\varphi_{m})v(m))$】仮定の等式の両辺は $(u,v)$ について双線形なので、実部と虚部に分けて、複素の切断についても成り立つ（$h$ は複素双線形に延ばしてある）。$u$ を $e^{it\varphi}u$、$v$ を $e^{-it\varphi}v$ に替えると、$h$ の双線形性から $h_{F}(P(e^{it\varphi}u),e^{-it\varphi}v)=h_{F}(e^{-it\varphi}P(e^{it\varphi}u),v)$ などとなり
$$
\int_{M}h_{F}\bigl(e^{-it\varphi}P(e^{it\varphi}u),v\bigr)d\mu_{g}=\int_{M}h_{E}\bigl(u,e^{-it(-\varphi)}Q(e^{it(-\varphi)}v)\bigr)d\mu_{g}.
$$
\ref{gl:symbol-oscillation} から両辺は $t$ の $k$ 次以下の多項式で、$t^{k}$ の係数は左辺が $\int h_{F}(\sigma_{P}(d\varphi)u,v)$、右辺が $\int h_{E}(u,\sigma_{Q}(-d\varphi)v)=(-1)^{k}\int h_{E}(u,\sigma_{Q}(d\varphi)v)$（斉次性）。すべての $t$ で等しい多項式の係数は等しい。

**Step 4.** 【主張：$H=0$（$M$ の各点で）】$\rho\in C^{\infty}(M)$ を実数値とし、Step 3 を $u$ の代わりに $\rho u$ に使うと、$\sigma_{P}(m,\cdot)$ はファイバーの上で線形なので $H$ は $\rho H$ に替わり、$\int\rho H\,d\mu_{g}=0$。$\rho=\operatorname{Re}H$（滑らか）とすると $\int(\operatorname{Re}H)^{2}=0$、虚部も同様で、$H=0$ a.e.。$H$ は連続なので、$\{H\neq0\}$ は測度 $0$ の開集合で空（\ref{gl:riemannian-measure.2}）。

**Step 5.** 【主張：3】$m_{0}\in M$, $\xi_{0}\in T_{m_{0}}^{*}M$, $e\in E_{m_{0}}$, $f\in F_{m_{0}}$ をとる。$m_{0}$ を含む座標近傍 $(U,x)$ で、\ref{fa:test-function-density.2} の $\chi\in C_{c}^{\infty}(x(U))$（$x(m_{0})$ の近傍で $1$）を使って $\varphi\defeq x^{*}\bigl(\chi(z)\sum_{i}\xi_{0,i}z_{i}\bigr)$ とおけば $d\varphi_{m_{0}}=\xi_{0}$。同様に局所自明化で定数の成分に $\chi$ を掛けて、$u(m_{0})=e$, $v(m_{0})=f$ となる滑らかな実の切断をとる。Step 4 から $h_{F}(\sigma_{P}(m_{0},\xi_{0})e,f)=(-1)^{k}h_{E}(e,\sigma_{Q}(m_{0},\xi_{0})f)$。両辺は $(e,f)$ について複素双線形なので複素のファイバーでも成り立ち、これは $\sigma_{Q}(m_{0},\xi_{0})=(-1)^{k}\sigma_{P}(m_{0},\xi_{0})^{\mathsf{T}}$ ということである。

::: hypcheck
- **最高階だけを比べること**：Step 1・2 で、ライプニッツ則で生じる余分な項が下の階数に落ちることに使った。主表象の外では等式は成り立たない：$P=Q=\frac{d}{dt}$ と $f$ を掛ける作用素について、$P(fQ)$ と $(fP)Q$ の主表象は等しいが、作用素としては $f'\frac{d}{dt}$ だけ違う。
- **境界がないこと**：2 では \ref{gl:formal-transpose} を通して、3 では仮定の等式の形で使った（境界があれば境界項が残る）。
- **ファイバー計量**：3 で、主表象の「転置」を定めるのに使った。転置は計量によるが、次のページの楕円性のように「可逆かどうか」だけを問う性質は計量によらない。
- **公理**：選択は使わない（試験関数・位相関数は具体的に作った）。
:::
:::

::: supplement
**前提を変えると.** 主表象の約束は流儀によって違う。$i$ を付けずに $\sum_{|\alpha|=k}A_{\alpha}\xi^{\alpha}$ とする流儀では、ラプラシアンの主表象は $-|\xi|^{2}$ になり、$\sigma_{P^{t}}=(-1)^{k}\sigma_{P}$ はそのまま成り立つが、形式的随伴は $\sigma_{P^{*}}=(-1)^{k}\overline{\sigma_{P}}$ となる。このページの $i^{k}$ を付ける約束では $\sigma_{P^{*}}=\overline{\sigma_{P}}$（ベクトル束では随伴行列）となり、自己随伴な作用素の主表象がエルミートになる。どちらの約束でも、主表象が可逆かどうか（次のページの楕円性）は変わらない。

**似た定理.** \ref{gl:symbol-oscillation} は、主表象を $\sigma_{P}(m,\xi)v=\lim_{t\to\infty}t^{-k}e^{-it\varphi}P(e^{it\varphi}u)(m)$（$d\varphi_{m}=\xi$, $u(m)=v$）と書くことで、座標をまったく使わない別の定義を与え、それ自体が \ref{gl:principal-symbol-invariance} の別証明になる。また 1 から、関数に作用する作用素 $P$, $Q$（$k$, $l$ 階）では $\sigma_{PQ}=\sigma_{P}\sigma_{Q}=\sigma_{QP}$ なので、交換子 $[P,Q]=PQ-QP$ の $k+l$ 次の主表象は $0$ で、$[P,Q]$ は $k+l-1$ 階以下である（主表象の定義の後の注意）。$[P,Q]$ の $k+l-1$ 次の主表象が $\sigma_{P}$ と $\sigma_{Q}$ の余接束の上のポアソン括弧で与えられることも知られている（ここでは証明しない。定数倍は約束による）。

**高い視点：高い音で叩く打診.** 主表象は、作用素を「高い周波数の波 $e^{it\varphi}$ で叩いたときの響き」の大きい部分である。周波数 $t$ を上げると、$k$ 回微分する部分は $t^{k}$ で響き、それより低い階数の部分は小さな雑音として埋もれていく。響きの向き（$d\varphi$ の方向）ごとに作用素がファイバーをどう写すかを記録したものが $\sigma_{P}(m,\xi)$ で、合成すれば響きは掛け算になり、細かい順序の違い（交換子）は一段小さな雑音に落ちる。こうして微分作用素の環から、ずっと扱いやすい余接束の上の多項式関数の環への「粗視化」が得られる。
:::

主表象が $0$ でない余接ベクトルで常に可逆な作用素が楕円型作用素で、次のページではその定義と例（ラプラシアン、ホッジのラプラシアンと $d+\delta$、コーシー–リーマン作用素）を調べ、トーラスの上の定数係数の作用素で楕円性がソボレフ・ノルムの評価と同値であることを示す。

## 問題 {#gl:sec-ps-problems}

::: problem {#gl:prob-ps-commutator-laplacian}
$M$ を閉リーマン多様体、$f\in C^{\infty}(M)$ を実数値とし、交換子 $[\Delta,f]u\defeq\Delta(fu)-f\Delta u$ を考える。
1. 主表象の計算規則だけを使って、$[\Delta,f]$ が $1$ 階以下の微分作用素であることを示せ。
2. $[\Delta,f]u=(\Delta f)u-2\langle\operatorname{grad}f,\operatorname{grad}u\rangle$ を示し、$[\Delta,f]$ の $1$ 次の主表象が $-2i\langle df_{m},\xi\rangle$ であることを導け。
:::

::: solution
**1.** $f$ を掛ける作用素 $f$ は $0$ 階で $\sigma_{f}(m,\xi)=f(m)$（\ref{gl:principal-symbol-examples.1}）。\ref{gl:symbol-calculus.1} から $\Delta f$（合成）と $f\Delta$ はどちらも $2$ 階以下で、$2$ 次の主表象は $\sigma_{\Delta}\sigma_{f}=|\xi|^{2}f(m)=\sigma_{f}\sigma_{\Delta}$。よって差 $[\Delta,f]$ の $2$ 次の主表象は $0$ で、主表象の定義の後の注意から $[\Delta,f]$ は $1$ 階以下。

**2.** $u\in C^{\infty}(M)$ について $d(fu)=f\,du+u\,df$ で $\sharp$ は線形なので $\operatorname{grad}(fu)=f\operatorname{grad}u+u\operatorname{grad}f$。\ref{gl:divergence-unoriented.2} の $\operatorname{div}(hX)=h\operatorname{div}X+\langle\operatorname{grad}h,X\rangle$ を二回使うと
$$
\begin{aligned}
\Delta(fu)&=-\operatorname{div}(f\operatorname{grad}u)-\operatorname{div}(u\operatorname{grad}f)\\
&=f\Delta u-\langle\operatorname{grad}f,\operatorname{grad}u\rangle+u\Delta f-\langle\operatorname{grad}u,\operatorname{grad}f\rangle.
\end{aligned}
$$
よって $[\Delta,f]u=(\Delta f)u-2\langle\operatorname{grad}f,\operatorname{grad}u\rangle=(\Delta f)u-2(\operatorname{grad}f)u$（$\langle\operatorname{grad}f,\operatorname{grad}u\rangle=du(\operatorname{grad}f)$）。これはベクトル場 $-2\operatorname{grad}f$ と $0$ 階の作用素 $\Delta f$ の和で、\ref{gl:principal-symbol-examples.2} から $1$ 次の主表象は $-2i\,\xi(\operatorname{grad}f)=-2i\,\xi((df)^{\sharp})=-2i\langle\xi,df_{m}\rangle$。$df_{m}\neq0$ の点では、$\xi$ が $df_{m}$ と直交する方向で $1$ 次の主表象は $0$ になる。
:::

::: problem {#gl:prob-ps-adjoint-composition}
\ref{gl:symbol-calculus.3} の状況（実ベクトル束 $E$, $F$ とファイバー計量、実の切断を実の切断に写す $k$ 階以下の $P$ と、等式を満たす $Q$）を考える。
1. $P$ の係数は実行列で、$\sigma_{P}(m,\xi)=i^{k}R(m,\xi)$（$R(m,\xi)\colon E_{m}\to F_{m}$ は実の線形写像）と書けることを示せ。
2. $\sigma_{QP}(m,\xi)=R(m,\xi)^{\mathsf{T}}R(m,\xi)$ を示し、$\sigma_{QP}(m,\xi)$ が $h_{E}$ について対称で半正定値であること、正定値 $\iff$ $\sigma_{P}(m,\xi)$ が単射であることを示せ。
3. $M$ が向きづけられているとき、$P=d\colon\Omega^{0}\to\Omega^{1}$, $Q=\delta$（\ref{riem:codifferential-adjoint}）に 2 を当てはめ、$\sigma_{\Delta}(m,\xi)=|\xi|^{2}$ を再び導け。
:::

::: solution
**1.** \ref{gl:principal-symbol-invariance} の証明の Step 1 と同じ試験切断 $u$（実の多項式と $\mathbf{e}_{c}$ から作るので実の切断）をとると、$z_{0}$ での値は $(Pu)_{\Psi}\circ x^{-1}(z_{0})=A_{\beta}(z_{0})\mathbf{e}_{c}$（$\alpha\neq\beta$ の項は $z_{0}$ で $0$）。$Pu$ は実の切断なので $A_{\beta}(z_{0})$ の各列は実で、係数は実行列。$(i\xi)^{\alpha}=i^{k}\xi^{\alpha}$（$|\alpha|=k$）なので $R(m,\xi)\defeq\Psi_{m}^{-1}\bigl(\sum_{|\alpha|=k}A_{\alpha}\xi^{\alpha}\bigr)\Phi_{m}$ とおけばよい。

**2.** \ref{gl:symbol-calculus.1} と \ref{gl:symbol-calculus.3} から $\sigma_{QP}=\sigma_{Q}\sigma_{P}=(-1)^{k}\sigma_{P}^{\mathsf{T}}\sigma_{P}=(-1)^{k}i^{2k}R^{\mathsf{T}}R=R^{\mathsf{T}}R$（$i^{2k}=(-1)^{k}$）。$h_{E}(R^{\mathsf{T}}Re,e')=h_{F}(Re,Re')$ は $e,e'$ について対称で、$h_{E}(R^{\mathsf{T}}Re,e)=h_{F}(Re,Re)\ge0$、等号は $Re=0$ のときに限る。よって正定値 $\iff$ $R$ が単射 $\iff$ $\sigma_{P}=i^{k}R$ が単射。

**3.** $k=1$ の \ref{riem:codifferential-adjoint} は、$h_{E}$ を関数の積、$h_{F}$ を $1$ 形式の内積 $\langle\cdot,\cdot\rangle$ とした 3 の等式である（向きづけられた場合 $\int_{M}\langle\alpha,\beta\rangle\mathrm{vol}_{g}=\int_{M}\langle\alpha,\beta\rangle\,d\mu_{g}$、\ref{gl:rm-integral-formulas.3}）。\ref{gl:principal-symbol-examples.4} から $\sigma_{d}(m,\xi)c=i\,c\,\xi$ なので $R(m,\xi)c=c\,\xi$。$h_{E}(R^{\mathsf{T}}\beta,c)=\langle\beta,c\,\xi\rangle$ から $R^{\mathsf{T}}\beta=\langle\beta,\xi\rangle$、よって $\sigma_{\delta d}(m,\xi)c=\langle c\,\xi,\xi\rangle=|\xi|^{2}c$。関数の上で $\Delta=\delta d$（\ref{riem:codifferential}）なので、\ref{gl:principal-symbol-examples.3} の座標での計算と一致する。$\sigma_{d}(m,\xi)$ は $\xi\neq0$ で単射なので、2 から $\sigma_{\Delta}(m,\xi)>0$ もわかる。
:::
