# 楕円型作用素のスペクトル {#gl:page-elliptic-spectrum keywords="spectral theory of elliptic operators on closed manifolds, Fredholm property of elliptic operators, cokernel is the kernel of the formal adjoint, Fredholm index, formally self-adjoint elliptic operators, compact resolvent, (P+1)^{-1} is compact and self-adjoint, eigenfunction expansion, orthonormal basis of eigensections, smooth eigenfunctions, eigenvalues of finite multiplicity tending to infinity, Sobolev norms by eigenvalues, Rayleigh quotient, フレドホルム性, 指数, 形式的随伴, 形式的自己共役, コンパクトなレゾルベント, 固有関数展開, 固有値, スペクトル分解"}

前のページ \ref{gl:page-weak-regularity} では、閉多様体の上の楕円型作用素 $P$ について、弱解の正則性、核が有限次元で滑らかな切断からなること、像が閉じていることを示した。その補足で予告したとおり、このページではまず、像の余次元が形式的随伴の核の次元に等しいこと、つまり $P$ が**フレドホルム作用素**であることを示す。次に、$P$ が形式的に自己共役で非負なら、$(P+1)^{-1}$ が $L^{2}$ の上のコンパクトな自己共役作用素になることを示し、関数解析のスペクトル定理をそれに使って、$L^{2}$ が $P$ の滑らかな固有切断からなる正規直交基底をもち、固有値が有限の重複度で $+\infty$ に発散することを導く。ラプラシアンやホッジのラプラシアンはこの形の作用素で、ここで得る固有関数展開は、次のページ（固有値によるソボレフ空間の特徴づけ、トーラスと球面の例、ポアンカレの不等式の最良定数）と、その後のホッジの定理・熱核の基礎になる。

## 記法と定義の確認 {#gl:sec-sp-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（$n\ge1$）、$g$ はリーマン計量、$\mu_{g}$ はリーマン測度。ベクトル束 $E$, $F$ と複素係数の約束、切断のソボレフ空間 $H^{s}(M;E)$（$s\ge0$ は整数）とノルム、微分作用素・主表象・楕円型作用素は \ref{gl:sec-er-garding-notation} のとおり。$\|\cdot\|_{H^{s}}\le\|\cdot\|_{H^{s'}}$（$s\le s'$）はノルムの定義（\ref{gl:sobolev-sections}）から従う。
- ファイバー計量 $h_{E}$, $h_{F}$、$L^{2}(M;E)$ の内積 $(u,u')\defeq\int_{M}h_{E}(u,\overline{u'})\,d\mu_{g}$ とノルム $\|u\|_{L^{2}}$、形式的転置 $P^{t}$、弱解、楕円正則性、核と像は \ref{gl:sec-er-weak-notation} 以下の前のページのとおり（\ref{gl:formal-transpose-bundle}, \ref{gl:weak-solution-bundle}, \ref{gl:elliptic-regularity}, \ref{gl:elliptic-smooth}, \ref{gl:elliptic-kernel-range}）。$\ker P$ は $Pu=0$ の $L^{2}$ の弱解の全体で、\ref{gl:elliptic-kernel-range.1} から滑らかな切断からなる有限次元の空間であり、有界作用素 $P\colon H^{s+k}\to H^{s}$ の核に等しい。
- **共役.** $E^{\mathbb{C}}=E\otimes\mathbb{C}$ の共役を $\overline{e\otimes c}\defeq e\otimes\bar{c}$ で定める。実の局所自明化 $\Phi$ を複素線形に延ばしたものは共役と可換なので、成分で見ると共役は成分ごとの複素共役である。とくに $u\in H^{s}(M;E)$ なら $\bar{u}\in H^{s}(M;E)$ で $\|\bar{u}\|_{H^{s}}=\|u\|_{H^{s}}$、$h_{E}$ は実の計量を双線形に延ばしたものなので $\overline{h_{E}(e,e')}=h_{E}(\bar{e},\bar{e}')$。
- 関数解析：コンパクト作用素は \ref{fa:compact-operator}、ヒルベルト空間の直交分解は \ref{fa:orthogonal-decomposition}、正規直交基底とパーセヴァルの等式は \ref{fa:orthonormal-basis}、自己共役コンパクト作用素のスペクトル定理は \ref{fa:compact-selfadjoint-spectral}。正規直交基底 $(e_{j})$ について $(x,y)=\sum_{j}(x,e_{j})\overline{(y,e_{j})}$ が成り立つ（$x=\sum_{j}(x,e_{j})e_{j}$ の部分和と $y$ の内積をとり、内積の連続性で極限をとる）。
- **選択公理**：1 の分割で DC を使う点、核の有限次元性で DC、像の閉性の評価で可算選択を使う点は前のページと同じで、このページではそれらの結果を通して使う。新しく使うのは、自己共役コンパクト作用素のスペクトル定理（\ref{fa:compact-selfadjoint-spectral}）の証明で固有ベクトルを帰納的に選ぶ DC だけである。核の正規直交基底（その定理の証明で選択公理を使う部分）は、ここでは核が $0$ なので要らない。有限次元の空間の正規直交基底は、具体的に与えた生成系にグラム–シュミットの直交化を順に施して作るので、選択は要らない。
:::

## 形式的随伴とフレドホルム性 {#gl:sec-sp-fredholm}

前のページの形式的転置 $P^{t}$ はファイバー計量の双線形形式についての転置で、$L^{2}$ の内積（エルミート形式）については、係数を共役にした作用素が随伴になる。まず、転置と随伴がまた楕円型であることを確かめる。

::: lemma 転置と随伴の楕円性 {#gl:formal-adjoint-bundle keywords="formal adjoint P^* v = conj(P^t conj v) of a differential operator between vector bundles with fibre metrics: (P u, v) = (u, P^* v) for the L^2 inner products; (P^t)^t = P, (P^*)^* = P; principal symbol of the transpose (-1)^k H_E^{-1} sigma^T H_F; transpose and adjoint of an elliptic operator are elliptic; ker P^* is the conjugate of ker P^t; formally self-adjoint operators" index="形式的随伴（ベクトル束）|けいしきてきずいはんべくとるそく, 形式的自己共役|けいしきてきじこきょうやく, 転置の主表象（ベクトル束）|てんちのしゅひょうしょうべくとるそく"}
$M$ を閉多様体、$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階以下の微分作用素とする。
1. $(P^{t})^{t}=P$。
2. $m\in M$ で、局所自明化 $\Phi$, $\Psi$ による行列で表すと $\sigma_{P^{t}}(m,\xi)=(-1)^{k}H_{E}(m)^{-1}\sigma_{P}(m,\xi)^{\mathsf{T}}H_{F}(m)$。とくに $P$ が $k$ 階の楕円型なら $P^{t}$ もそうである。
3. $P^{*}v\defeq\overline{P^{t}\bar{v}}$ は $k$ 階以下の微分作用素 $\Gamma(M,F)\to\Gamma(M,E)$ で、滑らかな $u$, $v$ について $(Pu,v)=(u,P^{*}v)$ が成り立ち、この性質をもつ微分作用素はただ一つである。$(P^{*})^{*}=P$ で、$P$ が楕円型なら $P^{*}$ もそうである。$P^{*}$ を $P$ の**形式的随伴**という。
4. $w\in L^{2}(M;F)$ が $P^{*}w=0$ の弱解であることと、$\bar{w}$ が $P^{t}z=0$ の弱解であることは同値である。したがって $\ker P^{*}=\{\bar{z}:z\in\ker P^{t}\}$。
:::

関数（$E=F=M\times\mathbb{C}$、$h$ は積）では、3 の $P^{*}$ は \ref{gl:formal-transpose.3} の形式的随伴である。$E=F$, $h_{E}=h_{F}$ で $P^{*}=P$、つまりすべての滑らかな $u$, $v$ で $(Pu,v)=(u,Pv)$ となるとき、$P$ は**形式的に自己共役**であるという。

::: proof
**Step 1.** 【主張：1】$h_{E}$, $h_{F}$ は対称なので、\ref{gl:formal-transpose-bundle.1} の等式は $\int h_{E}(P^{t}v,u)\,d\mu_{g}=\int h_{F}(v,Pu)\,d\mu_{g}$ と書ける。これは $P$ が $P^{t}$ の形式的転置の定義の等式を満たすことを言っているので、一意性（\ref{gl:formal-transpose-bundle.1}）から $(P^{t})^{t}=P$。

**Step 2.** 【主張：2】\ref{gl:formal-transpose-bundle.2} の右辺をライプニッツ則で展開すると、$|\alpha|=k$ の項で $k$ 回の微分がすべて $V$ にかかる部分は $(-1)^{k}\gamma A_{\alpha}^{\mathsf{T}}\tilde{H}_{F}\,\partial^{\alpha}V$ で、ほかの部分は $V$ の $k-1$ 階以下の微分しか含まない。両辺に $(\gamma\tilde{H}_{E})^{-1}$ を掛けると、$P^{t}$ の $(x,\Psi,\Phi)$ での係数のうち $|\alpha|=k$ のものは $(-1)^{k}\tilde{H}_{E}^{-1}A_{\alpha}^{\mathsf{T}}\tilde{H}_{F}$ である。主表象の定義（\ref{gl:principal-symbol}）から、$m$ で $\sigma_{P^{t}}=\sum_{|\alpha|=k}(-1)^{k}H_{E}^{-1}A_{\alpha}^{\mathsf{T}}H_{F}(i\xi)^{\alpha}=(-1)^{k}H_{E}^{-1}\sigma_{P}^{\mathsf{T}}H_{F}$（$(i\xi)^{\alpha}$ はスカラー）。$H_{E}$, $H_{F}$ は可逆なので、$\sigma_{P}(m,\xi)$ が可逆なら $\sigma_{P^{t}}(m,\xi)$ も可逆である。

**Step 3.** 【主張：3】$P^{t}$ の係数を $C_{\alpha}$ とすると、共役が成分ごとの複素共役であることから $(P^{*}v)_{\Phi}\circ x^{-1}=\sum_{\alpha}\overline{C_{\alpha}}\,\partial^{\alpha}(v_{\Psi}\circ x^{-1})$ で、$P^{*}$ は滑らかな係数の $k$ 階以下の微分作用素である。記法の節の共役の性質と \ref{gl:formal-transpose-bundle.1} から
$$
(Pu,v)=\int h_{F}(Pu,\bar{v})\,d\mu_{g}=\int h_{E}(u,P^{t}\bar{v})\,d\mu_{g}=\int h_{E}\bigl(u,\overline{P^{*}v}\bigr)d\mu_{g}=(u,P^{*}v).
$$
$Q$ も同じ性質をもてば、$w\defeq P^{*}v-Qv$ について $(u,w)=0$ がすべての滑らかな $u$ で成り立ち、$u=w$ として $w=0$（\ref{gl:formal-transpose-bundle} の証明の Step 2 と同じ）。$(P^{*}w,u)=\overline{(u,P^{*}w)}=\overline{(Pu,w)}=(w,Pu)$ なので、一意性から $(P^{*})^{*}=P$。主表象は $\sum_{|\alpha|=k}\overline{C_{\alpha}}(i\xi)^{\alpha}=\overline{\sum_{|\alpha|=k}C_{\alpha}(-i\xi)^{\alpha}}=(-1)^{k}\,\overline{\sigma_{P^{t}}(m,\xi)}$（$\xi$ は実の余接ベクトル）で、Step 2 から $P$ が楕円型なら可逆である。

**Step 4.** 【主張：4】$P^{*}$ の形式的転置は $(P^{*})^{t}u=\overline{P\bar{u}}$ である：$\int h_{E}(P^{*}w,u)=\overline{\int h_{E}(P^{t}\bar{w},\bar{u})}=\overline{\int h_{F}(\bar{w},P\bar{u})}=\int h_{F}(w,\overline{P\bar{u}})$ で、一意性から。よって $w$ が $P^{*}w=0$ の弱解であることは、すべての滑らかな $u$ で $\int h_{F}(w,\overline{P\bar{u}})=0$、共役をとって $\int h_{F}(\bar{w},P\bar{u})=0$ となることで、$\bar{u}$ も滑らかな切断全体を動くので、Step 1（$(P^{t})^{t}=P$）からこれは $\bar{w}$ が $P^{t}z=0$ の弱解であることにほかならない。
:::

次の主張の言葉を一つ用意する。

::: definition フレドホルム作用素 {#gl:fredholm-operator keywords="Fredholm operator: a bounded operator between Banach spaces with finite dimensional kernel, closed range and finite dimensional cokernel; Fredholm index = dim ker - dim coker" index="フレドホルム作用素|ふれどほるむさようそ, 指数（フレドホルム作用素）|しすうふれどほるむさようそ, 余核|よかく"}
$X$, $Y$ をバナッハ空間とする。有界線形作用素 $T\colon X\to Y$ が**フレドホルム作用素**であるとは、$\ker T$ が有限次元、$T(X)$ が閉じていて、**余核** $Y/T(X)$ が有限次元であることをいう。整数 $\operatorname{ind}T\defeq\dim\ker T-\dim(Y/T(X))$ を $T$ の**指数**という。
:::

::: intuition
フレドホルム作用素とは、有限次元の行列と同じように、解の自由度（核）と方程式が解けるための条件の数（余核）がどちらも有限な作用素である。指数はその差である。
:::

::: example
有限次元の空間の間の線形写像 $T\colon\mathbb{C}^{a}\to\mathbb{C}^{b}$ はフレドホルム作用素で、次元公式 $\dim\ker T+\dim T(\mathbb{C}^{a})=a$ から $\operatorname{ind}T=a-b$ は $T$ によらない。$\ell^{2}$ の右シフト $(x_{1},x_{2},\dots)\mapsto(0,x_{1},x_{2},\dots)$ は核が $0$、像が第 1 成分の $0$ な数列の全体（閉じていて余次元 $1$）なので、指数 $-1$ のフレドホルム作用素である。コンパクト作用素 $K$ について $I-K$ は、\ref{fa:riesz-schauder} から核が有限次元で像が閉じている。
:::

::: theorem 楕円型作用素のフレドホルム性 {#gl:elliptic-fredholm keywords="Fredholm property of elliptic operators on closed manifolds: the range of P: H^{s+k} -> H^s is the annihilator of ker P^t, equivalently the L^2 orthogonal complement of ker P^* intersected with H^s; H^s = P(H^{s+k}) + ker P^*; cokernel isomorphic to ker P^*; finite index dim ker P - dim ker P^t independent of s; index zero for formally self-adjoint operators" index="楕円型作用素のフレドホルム性|だえんがたさようそのふれどほるむせい, 楕円型作用素の指数|だえんがたさようそのしすう, フレドホルムの二者択一（楕円型作用素）|ふれどほるむのにしゃたくいつだえんがたさようそ"}
$M$ を閉多様体、$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階（$k\ge1$）の楕円型作用素、$s\ge0$ を整数とする。
1. $\ker P^{t}$ と $\ker P^{*}$ は滑らかな切断からなる同じ次元の有限次元空間である。
2. $f\in H^{s}(M;F)$ について、次は同値である。
   - (a) $f\in P(H^{s+k}(M;E))$。
   - (b) すべての $z\in\ker P^{t}$ について $\int_{M}h_{F}(f,z)\,d\mu_{g}=0$。
   - (c) すべての $w\in\ker P^{*}$ について $(f,w)=0$。
3. $H^{s}(M;F)=P(H^{s+k}(M;E))\oplus\ker P^{*}$（$L^{2}$ の内積で直交する直和）。したがって $P\colon H^{s+k}(M;E)\to H^{s}(M;F)$ はフレドホルム作用素で、余核は $\ker P^{*}$ と同型、指数は $\dim\ker P-\dim\ker P^{t}$ で $s$ によらない。
4. $E=F$ で $P$ が形式的に自己共役なら、$H^{s}(M;E)=P(H^{s+k}(M;E))\oplus\ker P$ で、指数は $0$ である。
:::

::: intuition
閉多様体の上の楕円型方程式 $Pu=f$ は、右辺が随伴作用素の有限個の解と直交していれば必ず解け、それ以外の条件は要らない。解の自由度も有限なので、楕円型作用素は「無限次元の空間の上の、ほぼ正方行列」のように振る舞う。
:::

::: proof
**Step 1.** 【主張：1】\ref{gl:formal-adjoint-bundle.2}・\ref[3]{gl:formal-adjoint-bundle.3} から $P^{t}\colon\Gamma(M,F)\to\Gamma(M,E)$ と $P^{*}$ は $k$ 階の楕円型なので、\ref{gl:elliptic-kernel-range.1} から $\ker P^{t}$, $\ker P^{*}$ は滑らかな切断からなる有限次元空間である。\ref{gl:formal-adjoint-bundle.4} から $z\mapsto\bar{z}$ は $\ker P^{t}$ から $\ker P^{*}$ への全単射（共役線形）で、基底を基底に写すので次元は等しい。

**Step 2.** 【主張：(a) ⇒ (b)、(b) ⇔ (c)】$u\in H^{s+k}\subset H^{k}$, $z\in\ker P^{t}$ とする。$z$ は滑らかで、\ref{gl:elliptic-kernel-range.1} から $P^{t}z=0$（古典的な意味で）。\ref{gl:formal-transpose-bundle.4} から $\int h_{F}(Pu,z)=\int h_{E}(u,P^{t}z)=0$。(b) と (c) は、$w=\bar{z}$ とおくと $(f,w)=\int h_{F}(f,z)$ で、Step 1 の全単射から同値である。

**Step 3.** 【主張：$s=0$ のとき (c) ⇒ (a)】$V\defeq P(H^{k}(M;E))$ は \ref{gl:elliptic-kernel-range.3} から $H^{0}(M;F)$ の閉部分空間で、$H^{0}$ のノルムと $L^{2}$ のノルムは同値（\ref{gl:sobolev-sections-properties.4}）なので、ヒルベルト空間 $L^{2}(M;F)$ の閉部分空間でもある。$f$ が (c) を満たすとし、\ref{fa:orthogonal-decomposition.2} で $f=f_{V}+f'$（$f_{V}\in V$, $f'\in V^{\perp}$）と分ける。$f'\perp V$ から、すべての滑らかな $u$ で $0=(Pu,f')=\int h_{F}(Pu,\overline{f'})=\int h_{F}(\overline{f'},Pu)$。\ref{gl:formal-adjoint-bundle.1} から $P=(P^{t})^{t}$ なので、これは $\overline{f'}$ が $P^{t}z=0$ の弱解であること、つまり $f'\in\ker P^{*}$（\ref{gl:formal-adjoint-bundle.4}）を言っている。(c) から $(f,f')=0$、また $(f_{V},f')=0$ なので $\|f'\|_{L^{2}}^{2}=(f-f_{V},f')=0$。よって $f=f_{V}\in V$。

**Step 4.** 【主張：一般の $s$ で (c) ⇒ (a)】$f\in H^{s}\subset L^{2}$ が (c) を満たせば、Step 3 から $u\in H^{k}(M;E)$ で $Pu=f$ となるものがある。\ref{gl:formal-transpose-bundle.4} から、すべての滑らかな $v$ で $\int h_{E}(u,P^{t}v)=\int h_{F}(Pu,v)=\int h_{F}(f,v)$ なので、$u\in L^{2}$ は $Pu=f$ の弱解で、$f\in H^{s}$ だから \ref{gl:elliptic-regularity} より $u\in H^{s+k}$。

**Step 5.** 【主張：3】$\ker P^{*}$ の基底にグラム–シュミットの直交化を施して、$L^{2}$ の内積について正規直交な基底 $w_{1},\dots,w_{d}$ をとる（$d\defeq\dim\ker P^{*}$）。各 $w_{i}$ は滑らかなので $H^{s}$ に入る。$f\in H^{s}$ について $f'\defeq f-\sum_{i}(f,w_{i})w_{i}\in H^{s}$ は $(f',w_{i})=0$ を満たすので、\ref[2(c)⇒(a)]{gl:elliptic-fredholm.2} から $f'\in P(H^{s+k})$。よって $H^{s}=P(H^{s+k})+\ker P^{*}$。$f\in P(H^{s+k})\cap\ker P^{*}$ なら \ref[2(c)]{gl:elliptic-fredholm.2} を $w=f$ に使って $(f,f)=0$ で $f=0$。直交性は \ref[2(c)]{gl:elliptic-fredholm.2} そのものである。したがって $f\mapsto((f,w_{i}))_{i}$ は余核 $H^{s}/P(H^{s+k})$ から $\mathbb{C}^{d}$ への線形同型を誘導し、像は 2 から閉じていて（連続な線形汎関数 $f\mapsto(f,w_{i})$ の共通の核）、核は $\ker P$（\ref{gl:elliptic-kernel-range.1}）で有限次元。指数は $\dim\ker P-d=\dim\ker P-\dim\ker P^{t}$（Step 1）で、$\ker P$, $\ker P^{t}$ は $s$ によらない。

**Step 6.** 【主張：4】$P^{*}=P$ なら $\ker P^{*}=\ker P$（同じ作用素の弱解の全体）なので、3 から直和分解が従い、指数は $\dim\ker P-\dim\ker P^{*}=0$（Step 1 から $\dim\ker P^{t}=\dim\ker P^{*}$）。

::: hypcheck
- **楕円性**：Step 1 で転置と随伴の核が有限次元で滑らかであることに、Step 3 で像の閉性（\ref{gl:elliptic-kernel-range.3}）に、Step 4 で正則性に使った。外すと偽：$T^{2}$ の波動作用素 $D_{1}^{2}-D_{2}^{2}$ は核も余核も無限次元である（$e_{(N,N)}$ がすべて核に入り、形式的に自己共役なので余核も同じ。\ref{gl:nonelliptic-examples.1}）。
- **閉多様体であること**：前のページの結果（レリッヒの定理による像の閉性と核の有限次元性）を通して使った。$\mathbb{R}^{n}$ の上の $\Delta\colon H^{2}(\mathbb{R}^{n})\to L^{2}(\mathbb{R}^{n})$ は単射で形式的に自己共役だが、像は閉じておらず（\ref{gl:elliptic-kernel-range} の hypcheck）、2 の同値は (c) の条件が空なのに (a) が成り立たない $f$ があるので崩れる。
- **$s\ge0$ が整数**：負の階数の切断の空間をここでは定めていないので、整数 $s\ge0$ に限った。
- **公理**：前のページの \ref{gl:elliptic-kernel-range} を通して DC と可算選択を使う。Step 3 の直交分解と Step 5 のグラム–シュミットの直交化（有限次元）は選択を使わない。
:::
:::

::: supplement
**前提を変えると.** 指数は $\dim\ker P-\dim\ker P^{t}$ で、低い階数の項を変えると核の次元は一般に変わる（\ref{gl:prob-er-circle-kernel}）が、指数は主表象だけで決まり、主表象を楕円性を保ったまま連続に変形しても変わらないことが知られている（ここでは証明しない）。形式的に自己共役な作用素の指数は 4 から $0$ だが、一般のベクトル束の間の作用素では $0$ でない指数が現れ、たとえば閉リーマン面のコーシー–リーマン作用素の指数は、リーマン–ロッホの定理によって種数で表される（ここでは証明しない）。境界つきの多様体では、境界条件を課さないと核が無限次元になる（ラプラシアンの核は調和関数の全体）ので、フレドホルム性には適切な境界条件（ロパチンスキー–シャピロ条件などと呼ばれるもの）が要る（ここでは扱わない）。

**似た定理.** 4 は、行列の「エルミート行列 $A$ について $\mathbb{C}^{N}=\operatorname{im}A\oplus\ker A$」の無限次元版で、\ref{fa:fredholm-alternative} と同じく「一意性が成り立てば存在も成り立つ」という形をしている：$\ker P^{*}=0$ ならすべての右辺について解ける。指数が主表象の位相的な不変量だけで書けるというのがアティヤ–シンガーの指数定理で、ガウス–ボネの定理やリーマン–ロッホの定理を特別な場合として含む（ここでは証明しない）。

**高い視点：方程式の数と未知数の数の釣り合い.** 有限次元の連立一次方程式では、未知数の数から方程式の数を引いた値が、解の自由度と解けるための条件の数の差に等しい。この差は係数を少し変えても変わらない。楕円型作用素では未知数も方程式も無限個あるが、主表象が可逆であることが「各周波数で方程式と未知数が釣り合っている」ことを保証し、釣り合わない部分は低い周波数の有限個の自由度に押し込められる。指数はその有限個の不釣り合いを数える整数で、連続な変形では整数が飛べないので不変になる。
:::

## コンパクトなレゾルベント {#gl:sec-sp-resolvent}

ここからは $E=F$ とし、$P$ を形式的に自己共役な楕円型作用素とする。さらに $P$ が**非負**、すなわちすべての滑らかな $u$ で $(Pu,u)\ge0$ と仮定する。関数の上のラプラシアン $\Delta$ は、実の係数で $\Delta^{t}=\Delta$（\ref{gl:formal-transpose-examples.1}）なので $\Delta^{*}=\Delta$、$(\Delta u,u)=\int|\nabla u|^{2}d\mu_{g}\ge0$（\ref{gl:closed-manifold-laplacian.2} を実部と虚部に分けて使う）なので、この条件を満たす。ホッジのラプラシアンも満たすことは次のページで確かめる。

::: theorem コンパクトなレゾルベント {#gl:elliptic-resolvent keywords="for a formally self-adjoint nonnegative elliptic operator P of order k on a closed manifold, P + 1: H^{s+k} -> H^s is bijective with bounded inverse, and R = (P+1)^{-1}: L^2 -> L^2 is compact, self-adjoint, positive, injective with norm at most 1; compact resolvent" index="コンパクトなレゾルベント|こんぱくとなれぞるべんと, レゾルベント（楕円型作用素）|れぞるべんとだえんがたさようそ"}
$M$ を閉多様体、$P\colon\Gamma(M,E)\to\Gamma(M,E)$ を形式的に自己共役で非負な $k$ 階（$k\ge1$）の楕円型作用素とする。
1. $u,v\in H^{k}(M;E)$ について $(Pu,v)=(u,Pv)$、$(Pu,u)\ge0$。
2. 各整数 $s\ge0$ について $P+1\colon H^{s+k}(M;E)\to H^{s}(M;E)$ は全単射で、定数 $C_{s}$ があって $\|(P+1)^{-1}f\|_{H^{s+k}}\le C_{s}\|f\|_{H^{s}}$。
3. $R\defeq(P+1)^{-1}$ を $L^{2}(M;E)\to H^{k}(M;E)\subset L^{2}(M;E)$ とみると、$R$ は $L^{2}(M;E)$ の上のコンパクトな自己共役作用素で、$(Rf,f)\ge0$、$\|R\|\le1$、$\ker R=0$。
:::

::: intuition
非負の楕円型作用素に $1$ を足すと必ず逆が作れて、その逆作用素は関数を滑らかにする方向に働くので、二乗可積分な関数の有界な集まりを「ほとんど有限次元」の集まりに写す。
:::

::: proof
**Step 1.** 【主張：1】$u\in H^{k}$ と滑らかな $v$ については、\ref{gl:formal-transpose-bundle.4} と \ref{gl:formal-adjoint-bundle.3} の証明の計算から $(Pu,v)=(u,P^{*}v)=(u,Pv)$。両辺は $v\in H^{k}$ について連続（$P\colon H^{k}\to L^{2}$ は有界、\ref{gl:differential-operator-sobolev.3}）で、滑らかな切断は $H^{k}$ で稠密（\ref{gl:sobolev-sections-properties.3}）なので、$v\in H^{k}$ でも成り立つ。同様に、滑らかな $u_{i}\to u$（$H^{k}$）について $(Pu_{i},u_{i})\to(Pu,u)$ なので $(Pu,u)\ge0$。

**Step 2.** 【主張：$P+1$ は $k$ 階の楕円型で形式的に自己共役、$\ker(P+1)=0$】$k\ge1$ なので $1$ を掛ける作用素を足しても $|\alpha|=k$ の係数は変わらず、主表象は $P$ と同じ（\ref{gl:symbol-calculus.1}）。$(u,v)$ の定義から $((P+1)u,v)=(u,(P+1)v)$。$u\in\ker(P+1)$ なら、\ref{gl:elliptic-kernel-range.1} から $u$ は滑らかで $(P+1)u=0$、よって $0=((P+1)u,u)=(Pu,u)+\|u\|_{L^{2}}^{2}\ge\|u\|_{L^{2}}^{2}$ で $u=0$。

**Step 3.** 【主張：2】Step 2 と \ref{gl:elliptic-fredholm.4} から $H^{s}=(P+1)(H^{s+k})\oplus\ker(P+1)=(P+1)(H^{s+k})$ で全射、核は $0$（\ref{gl:elliptic-kernel-range.1}）なので単射。$u\in H^{s+k}$, $f\defeq(P+1)u$ について、1 から
$$
\|u\|_{L^{2}}^{2}\le(Pu,u)+\|u\|_{L^{2}}^{2}=\operatorname{Re}(f,u)\le\|f\|_{L^{2}}\|u\|_{L^{2}},
$$
よって $\|u\|_{L^{2}}\le\|f\|_{L^{2}}\le c\|f\|_{H^{s}}$（$c$ は $L^{2}$ と $H^{0}$ のノルムの同値性の定数）。\ref{gl:elliptic-estimate-l2} を $P+1$ に使うと $\|u\|_{H^{s+k}}\le C(\|f\|_{H^{s}}+\|u\|_{L^{2}})\le C(1+c)\|f\|_{H^{s}}$。

**Step 4.** 【主張：$R$ はコンパクト】$(f_{i})$ を $L^{2}$ の有界列とすると、Step 3（$s=0$）から $(Rf_{i})$ は $H^{k}$ で有界で、\ref{gl:rellich-sections}（$a=k$, $b=0$）から $H^{0}$ で、したがって $L^{2}$ で収束する部分列をもつ。\ref{fa:compact-operator} の点列による言い換えから $R$ はコンパクトである。

**Step 5.** 【主張：$R$ は自己共役で、$(Rf,f)\ge0$、$\|R\|\le1$、$\ker R=0$】$f,f'\in L^{2}$ について、$Rf,Rf'\in H^{k}$ と 1 から
$$
(Rf,f')=(Rf,(P+1)Rf')=((P+1)Rf,Rf')=(f,Rf').
$$
$f'=f$ とすると $(Rf,f)=\overline{(f,Rf)}=\overline{((P+1)Rf,Rf)}=(PRf,Rf)+\|Rf\|_{L^{2}}^{2}\ge0$（1 から実数）。$\|Rf\|_{L^{2}}\le\|f\|_{L^{2}}$ は Step 3 の最初の不等式。$Rf=0$ なら $f=(P+1)Rf=0$。

::: hypcheck
- **楕円性**：Step 3 で \ref{gl:elliptic-fredholm} による全射性と、楕円型評価に、Step 2 で核の元が滑らかであることに使った。
- **形式的自己共役**：Step 1・5 の対称性と、Step 3 で余核が $\ker(P+1)$ 自身になること（\ref{gl:elliptic-fredholm.4}）に使った。外すと $R$ は自己共役でなく、スペクトル定理が使えない。
- **非負性**：Step 2 で $\ker(P+1)=0$ に、Step 3 で $L^{2}$ の評価に使った。外すと偽：$S^{1}$ の上の $P=\Delta-2$ は形式的に自己共役な楕円型だが、$P+1=\Delta-1$ は $e^{\pm it}$ を核にもち、可逆でない（\ref{gl:prob-er-circle-kernel}）。ただし $(Pu,u)\ge-c\|u\|_{L^{2}}^{2}$（下に有界）なら、$P+c$ に定理を使えばよい。
- **$M$ がコンパクト**：Step 4 のレリッヒの定理に使った。$\mathbb{R}^{n}$ の上の $(\Delta+1)^{-1}$ は有界な自己共役作用素だが、$\varphi\neq0$ の平行移動の列 $\varphi(\cdot-i\,e)$ の像は平行移動で、収束する部分列をもたないのでコンパクトでない。
- **公理**：\ref{gl:elliptic-fredholm} を通して DC と可算選択を使う。Step 4 の部分列の選び方は \ref{gl:rellich-sections} の具体的な手順で、新しい選択は使わない。
:::
:::

::: supplement
**前提を変えると.** 関数の上のラプラシアンでは、2 の存在（$s=0$）は前のページのラックス–ミルグラムの定理による構成（\ref{gl:laplacian-weak-regular}、$\lambda=1$）でも得られる。そこでは形式 $\int(\langle\nabla u,\nabla v\rangle+u\bar{v})$ が $H^{1}$ で強圧的であることを使った。一般の $2m$ 階の非負な作用素でも、$(Pu,u)+\|u\|^{2}$ が $H^{m}$ のノルムの二乗と同値になること（ガルディングの不等式の別の形）を示せば同じ道が通るが、ここではフレドホルム性を使って一般の $k$ でまとめて示した。$1$ の代わりに、下界より大きい任意の実数 $c$ について $(P+c)^{-1}$ も同じ性質をもつ。

**似た定理.** 有界な領域のディリクレ・ラプラシアンの解作用素がコンパクトな自己共役作用素になること（\see{fa:dirichlet-eigenfunctions}）と同じ構造で、そこでは $H_{0}^{1}$ のレリッヒの定理が、ここでは閉多様体のレリッヒの定理がコンパクト性を生む。非有界な自己共役作用素の言葉では、$P$ は定義域 $H^{k}$ の上の自己共役作用素で、$(P+1)^{-1}$ はそのレゾルベントである（\see{fa:unbounded-spectral-theorem}）。

**高い視点：逆にすると見えやすい.** 微分作用素 $P$ は関数を荒くする非有界な作用素で、スペクトル理論を直接使いにくい。逆の $(P+1)^{-1}$ は滑らかにする有界な作用素で、しかも閉多様体の上では「有限次元の行列の極限」（コンパクト作用素）になる。望遠鏡を逆さにのぞくと遠くの景色が小さくまとまって見えるように、作用素を逆にすると、無限に広がる固有値の列が $0$ に集まる列に変わり、有限次元の対角化の議論がそのまま使える。
:::

## スペクトル分解 {#gl:sec-sp-decomposition}

::: theorem 楕円型作用素のスペクトル分解 {#gl:elliptic-spectral-decomposition keywords="spectral decomposition of a formally self-adjoint nonnegative elliptic operator on a closed manifold: L^2(M;E) has an orthonormal basis of smooth eigensections, eigenvalues 0 <= lambda_0 <= lambda_1 <= ... tend to infinity, finite multiplicities, eigenspaces are kernels of P - lambda, P - lambda invertible off the spectrum; eigenfunction expansion" index="楕円型作用素のスペクトル分解|だえんがたさようそのすぺくとるぶんかい, 固有関数展開（閉多様体）|こゆうかんすうてんかいへいたようたい, 固有切断|こゆうせつだん, 固有値の重複度|こゆうちのちょうふくど"}
$M$ を閉多様体、$E$ を階数 $r\ge1$ のベクトル束、$P\colon\Gamma(M,E)\to\Gamma(M,E)$ を形式的に自己共役で非負な $k$ 階（$k\ge1$）の楕円型作用素とする。
1. $L^{2}(M;E)$ の正規直交基底 $(\varphi_{j})_{j\ge0}$ で各 $\varphi_{j}$ が滑らかなものと、実数 $0\le\lambda_{0}\le\lambda_{1}\le\lambda_{2}\le\cdots$ で $\lambda_{j}\to\infty$ となるものがあって、$P\varphi_{j}=\lambda_{j}\varphi_{j}$。
2. $(\varphi_{j})$ を、滑らかな切断からなる $L^{2}(M;E)$ の任意の正規直交基底で、実数 $\lambda_{j}$ について $P\varphi_{j}=\lambda_{j}\varphi_{j}$ となるものとする（1 のものに限らない）。$\lambda\in\mathbb{C}$ について、$Pu=\lambda u$ の $L^{2}$ の弱解の全体 $\ker(P-\lambda)$ は $\{\varphi_{j}:\lambda_{j}=\lambda\}$ の張る空間に等しく、その次元は $\#\{j:\lambda_{j}=\lambda\}<\infty$ である。とくに $\ker(P-\lambda)\neq0$ となる $\lambda$（**固有値**）は $\lambda_{j}$ のどれかで、すべて $0$ 以上の実数であり、重複度を込めて小さい順に並べた固有値の列は基底によらない。
3. $\lambda$ が固有値でなければ、各整数 $s\ge0$ について $P-\lambda\colon H^{s+k}(M;E)\to H^{s}(M;E)$ は全単射である。
:::

::: intuition
閉多様体の上の非負の自己共役な楕円型作用素は、無限次元のエルミート行列のように対角化できる。固有値は重複を込めて $0$ 以上の実数の列で、各値は有限回しか現れず、どこまでも大きくなる。固有ベクトルにあたる固有切断はすべて滑らかで、それらを並べると二乗可積分な切断の座標系（正規直交基底）になる。
:::

::: proof
**Step 1.** 【主張：$L^{2}(M;E)$ は無限次元】座標近傍 $(U,x)$ と $U$ の上の局所自明化 $\Phi$ をとり、$x(U)$ の中の互いに交わらない閉球 $\bar{B}_{1},\bar{B}_{2},\dots$ を一つずつ具体的に（たとえば一つの点を中心に半径を $2^{-i}$ ずつずらして）決め、$\chi_{i}\in C_{c}^{\infty}(B_{i})$ を $0$ でないものとする。$(x,\Phi)^{*}(\chi_{i}\,\mathbf{e}_{1})$（$\mathbf{e}_{1}$ は $\mathbb{R}^{r}$ の第 1 基本ベクトル、$U$ の外で $0$）は $0$ でない滑らかな切断で、台が互いに交わらないので $L^{2}$ で互いに直交する。

**Step 2.** 【主張：$L^{2}(M;E)$ の正規直交基底 $(e_{i})_{i\ge1}$ と $\mu_{1}\ge\mu_{2}\ge\cdots>0$, $\mu_{i}\to0$ で $Re_{i}=\mu_{i}e_{i}$ となるものがある】$R\defeq(P+1)^{-1}$ は \ref{gl:elliptic-resolvent.3} からコンパクトな自己共役作用素なので、\ref{fa:compact-selfadjoint-spectral} から、有限または可算な正規直交系 $(e_{i})$ と実数 $\mu_{i}\neq0$（$|\mu_{1}|\ge|\mu_{2}|\ge\cdots$、無限個なら $\mu_{i}\to0$）で $Re_{i}=\mu_{i}e_{i}$、$L^{2}=\ker R\oplus\overline{\operatorname{span}}\{e_{i}\}$ となるものがある。$\ker R=0$ なので $(e_{i})$ は正規直交基底で、Step 1 から無限個、よって $\mu_{i}\to0$。$\mu_{i}=(Re_{i},e_{i})\ge0$ で $\mu_{i}\neq0$ なので $\mu_{i}>0$、とくに $|\mu_{i}|=\mu_{i}$ は単調非増加。

**Step 3.** 【主張：1】$\varphi_{j}\defeq e_{j+1}$, $\lambda_{j}\defeq\mu_{j+1}^{-1}-1$（$j\ge0$）とおく。$\mu_{i}$ は正で単調非増加、$\mu_{i}\to0$ なので、$\lambda_{j}$ は単調非減少で $\lambda_{j}\to\infty$。$\varphi_{j}=R(\mu_{j+1}^{-1}\varphi_{j})\in H^{k}$ で $(P+1)\varphi_{j}=\mu_{j+1}^{-1}\varphi_{j}$、つまり $L^{2}$ の元として $(P-\lambda_{j})\varphi_{j}=0$。$P-\lambda_{j}$ は $P$ と同じ主表象の $k$ 階の楕円型作用素（\ref{gl:symbol-calculus.1}）で、\ref{gl:formal-transpose-bundle.4} から $\varphi_{j}$ は $(P-\lambda_{j})\varphi_{j}=0$ の弱解なので、\ref{gl:elliptic-smooth} から滑らかである。$\lambda_{j}=(P\varphi_{j},\varphi_{j})\ge0$（\ref{gl:elliptic-resolvent.1}）。

**Step 4.** 【主張：2 の前半、$\ker(P-\lambda)$ は $\{\varphi_{j}:\lambda_{j}=\lambda\}$ の張る空間の閉包】$u\in\ker(P-\lambda)$ とすると、Step 3 と同じく \ref{gl:elliptic-smooth} から $u$ は滑らかで $Pu=\lambda u$。$c_{j}\defeq(u,\varphi_{j})$ とおくと、\ref{gl:elliptic-resolvent.1} と $\lambda_{j}\in\mathbb{R}$ から $\lambda c_{j}=(Pu,\varphi_{j})=(u,P\varphi_{j})=\lambda_{j}c_{j}$。よって $\lambda_{j}\neq\lambda$ なら $c_{j}=0$ で、$u=\sum_{j}c_{j}\varphi_{j}=\sum_{\lambda_{j}=\lambda}c_{j}\varphi_{j}$（\ref{fa:orthonormal-basis}）。逆に $\lambda_{j}=\lambda$ の $\varphi_{j}$ は滑らかで $(P-\lambda)\varphi_{j}=0$ なので弱解で、$\ker(P-\lambda)$ は $L^{2}$ で閉じている（\ref{gl:elliptic-kernel-range} の証明の Step 2）。

**Step 5.** 【主張：2 の後半】1 の基底では、$\lambda_{j}\to\infty$ から $\{j:\lambda_{j}=\lambda\}$ は有限集合なので、Step 4 から $\ker(P-\lambda)$ はその個数の次元をもつ。一般の基底では、$\{\varphi_{j}:\lambda_{j}=\lambda\}$ はこの有限次元空間の正規直交系なので有限個で、Step 4 からその空間の基底になり、個数は次元に等しい。固有値は $\lambda_{j}$ のどれかで、Step 3 の基底では $0$ 以上の実数。重複度を込めた列は各値の次元 $\dim\ker(P-\lambda)$ だけで決まるので、基底によらない。

**Step 6.** 【主張：3】$P-\lambda$ は $k$ 階の楕円型で、$(P-\lambda)^{*}=P-\bar{\lambda}$（$(\lambda u,v)=(u,\bar{\lambda}v)$ と一意性 \ref{gl:formal-adjoint-bundle.3}）。固有値は実数なので、$\lambda$ が固有値でなければ $\bar{\lambda}$ も固有値でなく、$\ker(P-\lambda)=\ker(P-\bar{\lambda})=0$。\ref{gl:elliptic-fredholm.3} から $H^{s}=(P-\lambda)(H^{s+k})\oplus\ker(P-\bar{\lambda})=(P-\lambda)(H^{s+k})$ で全射、核は $0$ なので単射。

::: hypcheck
- **楕円性**：レゾルベントのコンパクト性（\ref{gl:elliptic-resolvent}）と、Step 3・4 の固有切断の滑らかさ、Step 6 のフレドホルム性に使った。外すと偽：$T^{2}$ の波動作用素 $D_{1}^{2}-D_{2}^{2}$ は形式的に自己共役で $e_{m}$ を固有関数にもつが、固有値 $m_{2}^{2}-m_{1}^{2}$ の固有空間は無限次元になりうる（$0$ の固有空間は $e_{(N,\pm N)}$ を含む）。
- **形式的自己共役**：Step 2 で $R$ が自己共役であること（スペクトル定理）と、Step 4 の $(Pu,\varphi_{j})=(u,P\varphi_{j})$ に使った。外すと、固有値は実数とは限らず、固有ベクトルが基底をなすとも限らない（\ref{gl:prob-sp-circle-dirac.3} の $P_{c}$ では $c\notin\mathbb{R}$ で固有値は非実数）。
- **非負性**：$R$ の構成と $\mu_{i}>0$ に使った。外しても、下に有界なら $P+c$ に使えば同じ結論（固有値は $-c$ 以上）で、下に有界でもなければ、次の \ref{gl:elliptic-spectral-general} のように固有値は $\pm\infty$ の両方に発散しうる。
- **閉多様体であること**：レリッヒの定理（$R$ のコンパクト性）に使った。$\mathbb{R}^{n}$ の $\Delta$ は $L^{2}$ の固有関数を一つももたない：$\Delta u=\lambda u$ ならフーリエ変換で $(4\pi^{2}|\xi|^{2}-\lambda)\hat{u}=0$ がほとんどすべての $\xi$ で成り立ち、$\{4\pi^{2}|\xi|^{2}=\lambda\}$ は測度 $0$ なので $\hat{u}=0$。
- **$r\ge1$, $n\ge1$**：Step 1 で $L^{2}$ が無限次元であることに使った（$r=0$ なら $L^{2}=0$ で主張は空）。
- **公理**：Step 2 でスペクトル定理の証明の DC（固有ベクトルの帰納的な選択）を使う。$\ker R=0$ なので核の正規直交基底（選択公理）は使わない。そのほかは前の結果を通した DC と可算選択だけである。
:::
:::

::: supplement
**前提を変えると.** 非コンパクトな完備リーマン多様体や $\mathbb{R}^{n}$ では、ラプラシアンのスペクトルは一般に固有値だけでなく連続スペクトルを含む（$\mathbb{R}^{n}$ では $[0,\infty)$ 全体が連続スペクトルで、固有値は一つもない。上の hypcheck）。境界つきのコンパクトな多様体では、ディリクレ条件やノイマン条件を課すと同じ形の離散スペクトルが得られる（\see{fa:dirichlet-eigenfunctions}）。形式的に自己共役でない楕円型作用素では、固有値は複素平面に散らばり、一般化固有ベクトルまで含めても基底になるとは限らない。

**似た定理.** 固有値の増え方について、関数の上のラプラシアンでは**ワイルの漸近公式** $\#\{j:\lambda_{j}\le\lambda\}\sim(2\pi)^{-n}\omega_{n}\operatorname{vol}(M)\lambda^{n/2}$（$\lambda\to\infty$、$\omega_{n}$ は $\mathbb{R}^{n}$ の単位球の体積）が成り立つ（ここでは証明しない）。とくにスペクトルから次元と体積が読み取れる。逆にスペクトルが多様体を決めるかは「太鼓の形が聞こえるか」というカッツの問いとして知られ、ミルナーは等長でない $16$ 次元の平坦トーラスで同じスペクトルをもつものを示した（ここでは証明しない）。両側不変な計量を入れたコンパクト・リー群の上では、ラプラシアンの固有空間は既約表現の行列成分で張られ、この定理はコンパクト群の行列成分による展開（\see{four:cg-peter-weyl}）と結びつく。$1$ 次元の区間ではスツルム–リウヴィル理論が同じ形の固有関数展開を与える。

**高い視点：多様体の上の楽器.** 閉多様体を太鼓や鐘のような楽器だと思うと、固有切断はその楽器の「固有振動の形」、固有値の平方根は「振動数」にあたる。どんな音（$L^{2}$ の切断）も、固有振動の重ね合わせ（フーリエ級数の一般化）としてただ一通りに書け、高い音ほど細かく振動する。楽器が有限の大きさ（コンパクト）なので、ある高さ以下の音は有限個しかなく、音の列は離散的に $\infty$ へ上っていく。トーラスではこの分解がフーリエ級数そのもので、一般の多様体では計量に合わせた「自前のフーリエ級数」が得られる。
:::

形式的に自己共役でも非負でない楕円型作用素（$d+\delta$ など）は、二乗すると非負になることを使って同じように扱える。

::: corollary 下に有界でない場合 {#gl:elliptic-spectral-general keywords="spectral decomposition of a formally self-adjoint elliptic operator without sign condition, such as d + delta or a Dirac type operator: orthonormal basis of smooth eigensections, real eigenvalues with finite multiplicities and |lambda_j| -> infinity; proof via P^2" index="自己共役な楕円型作用素のスペクトル|じこきょうやくなだえんがたさようそのすぺくとる"}
$M$ を閉多様体、$E$ を階数 $r\ge1$ のベクトル束、$P\colon\Gamma(M,E)\to\Gamma(M,E)$ を形式的に自己共役な $k$ 階（$k\ge1$）の楕円型作用素とする。$L^{2}(M;E)$ の正規直交基底 $(\varphi_{j})_{j\ge0}$ で各 $\varphi_{j}$ が滑らかなものと、実数 $\lambda_{j}$ で $|\lambda_{j}|\to\infty$ となるものがあって $P\varphi_{j}=\lambda_{j}\varphi_{j}$。各 $\lambda\in\mathbb{C}$ について、$\ker(P-\lambda)$ は $\{\varphi_{j}:\lambda_{j}=\lambda\}$ の張る有限次元空間である。
:::

::: proof
**Step 1.** 【主張：$Q\defeq P^{2}$ は形式的に自己共役で非負な $2k$ 階の楕円型作用素】\ref{gl:symbol-calculus.1} から $\sigma_{Q}=\sigma_{P}\sigma_{P}$ は $\xi\neq0$ で可逆。滑らかな $u$, $v$ について $(Qu,v)=(Pu,Pv)=(u,Qv)$、$(Qu,u)=\|Pu\|_{L^{2}}^{2}\ge0$。

**Step 2.** 【主張：$Q$ の各固有空間 $V_{\nu}\defeq\ker(Q-\nu)$ は $P$ で不変で、その上で $P$ の固有ベクトルからなる正規直交基底が具体的に作れる】\ref{gl:elliptic-spectral-decomposition} を $Q$ に使い、基底 $(\psi_{i})$ と固有値 $\nu_{i}\to\infty$ をとる。$V_{\nu}$ は滑らかな切断からなる有限次元空間で、$u\in V_{\nu}$ なら $Q(Pu)=P(Qu)=\nu Pu$ から $Pu\in V_{\nu}$。$V_{\nu}$ の上で $P$ はエルミート（$(Pu,v)=(u,Pv)$）で $P^{2}=\nu$ なので、$\nu>0$ なら $V_{\nu}=V_{\nu}^{+}\oplus V_{\nu}^{-}$（$V_{\nu}^{\pm}\defeq\ker(P\mp\sqrt{\nu})\cap V_{\nu}$、直交）。実際 $u=\frac12(u+\nu^{-1/2}Pu)+\frac12(u-\nu^{-1/2}Pu)$ が分解を与える。$\nu=0$ なら $\|Pu\|^{2}=(Qu,u)=0$ から $V_{0}=\ker P$。各 $V_{\nu}^{\pm}$ の基底は、$\nu_{i}=\nu$ となる $\psi_{i}$ を添字の順に $V_{\nu}^{\pm}$ へ射影したもの（$u\mapsto\frac12(u\pm\nu^{-1/2}Pu)$）に、添字の順にグラム–シュミットの直交化を施して（$0$ になったものは捨てて）作る。

**Step 3.** 【主張：系】Step 2 の基底を、$\nu$ の小さい順、$+$, $-$ の順、直交化の順に並べたものを $(\varphi_{j})$、対応する $P$ の固有値（$\pm\sqrt{\nu}$）を $\lambda_{j}$ とする。異なる $\nu$ の $V_{\nu}$ は互いに直交し（\ref{gl:elliptic-spectral-decomposition.2}）、各 $\psi_{i}$ はその $V_{\nu_{i}}$ の基底の張る空間に入るので、$(\varphi_{j})$ は張る空間が稠密な正規直交系、つまり正規直交基底である（\ref{fa:orthonormal-basis}）。$|\lambda_{j}|=\sqrt{\nu}$ で、各 $\nu$ は有限回しか現れず $\nu_{i}\to\infty$ なので $|\lambda_{j}|\to\infty$。$\ker(P-\lambda)$ の主張は \ref{gl:elliptic-spectral-decomposition} の証明の Step 4・5 と同じ議論で出る。そこで使った対称性 $(Pu,v)=(u,Pv)$（$u,v\in H^{k}$）は \ref{gl:elliptic-resolvent} の証明の Step 1 で非負性を使わずに示したもので、ほかに非負性は使っていない（有限性は $|\lambda_{j}|\to\infty$ から）。

::: hypcheck
- **形式的自己共役**：Step 1 で $Q$ が非負で自己共役であること、Step 2 で $P$ が $V_{\nu}$ の上でエルミートであることに使った。
- **楕円性**：Step 1 で $Q$ が楕円型であることに使った。
- **公理**：Step 2 の基底は添字の順の具体的な手順で決めるので、可算個の固有空間で基底を選ぶ可算選択は要らない。そのほかは \ref{gl:elliptic-spectral-decomposition} と同じ。
:::
:::

::: example
$S^{1}$ の上の $-iD_{1}$ は形式的に自己共役な $1$ 階の楕円型作用素で、固有値は整数 $m$（固有関数 $e_{m}$）、正にも負にも発散する（\ref{gl:prob-sp-circle-dirac}）。向きづけられた閉リーマン多様体の上の $d+\delta\colon\Gamma(M,\Lambda^{\bullet})\to\Gamma(M,\Lambda^{\bullet})$ は、\ref{gl:hodge-laplacian-symbol.4} から $1$ 階の楕円型で、余微分が外微分の随伴であること（\ref{riem:codifferential-adjoint}）から形式的に自己共役であり、その二乗はホッジのラプラシアン $d\delta+\delta d$ である（$d^{2}=0$, $\delta^{2}=0$）。この系から、$d+\delta$ の固有値は正負の両方に発散しうる実数の列で、核はホッジのラプラシアンの核と一致する。
:::

## 問題 {#gl:sec-sp-problems}

::: problem {#gl:prob-sp-circle-dirac}
$S^{1}=T^{1}$（平坦な計量）の上の複素数値の関数に作用する $P\defeq-iD_{1}$ を考える。
1. $P$ が $1$ 階の楕円型で、形式的に自己共役（$P^{*}=P$）だが非負でないことを示せ。
2. $P$ の固有値と固有空間をすべて求め、\ref{gl:elliptic-spectral-general} の結論（固有値は正負の両方に発散する）を確かめよ。また $P^{2}=\Delta$ を確かめ、$\Delta$ の固有値 $m^{2}>0$ の固有空間が $P$ の二つの固有空間に分かれることを見よ。
3. $c\in\mathbb{C}$ について $P_{c}\defeq P+c$ とする。$\ker P_{c}$ と $\ker P_{c}^{*}$ を求め、$P_{c}\colon H^{1}(S^{1})\to L^{2}(S^{1})$ の指数が $0$ であることと、像が \ref{gl:elliptic-fredholm.2} のとおりであることを確かめよ。
:::

::: solution
**1.** $P$ の係数は $\partial_{1}$ について $-i$ なので、$\xi=\xi_{1}\,dt_{1}$ について $\sigma_{P}(m,\xi)=-i\cdot i\xi_{1}=\xi_{1}$ で、$\xi\neq0$ なら $0$ でない。平坦な計量では $\gamma_{x_{a}}=1$ で係数は定数なので、\ref{gl:formal-transpose.2} から $D_{1}^{t}=-D_{1}$、$P^{t}=iD_{1}$。よって $P^{*}v=\overline{P^{t}\bar{v}}=\overline{iD_{1}\bar{v}}=-iD_{1}v=Pv$。$Pe_{m}=-i(im)e_{m}=me_{m}$ なので、$(Pe_{-1},e_{-1})=-\|e_{-1}\|_{L^{2}}^{2}=-2\pi<0$ で、非負でない。

**2.** $\{(2\pi)^{-1/2}e_{m}\}_{m\in\mathbb{Z}}$ は滑らかな関数からなる $L^{2}(S^{1})$ の正規直交基底（\ref{gl:torus-fourier-basis.2}）で、$Pe_{m}=me_{m}$。\ref{gl:elliptic-spectral-decomposition.2} の議論（\ref{gl:elliptic-spectral-general} の証明の Step 3 で述べたとおり非負性は要らない）から、固有値はすべての整数 $m$ で、固有空間は $\operatorname{span}\{e_{m}\}$（$1$ 次元）。固有値は $m\to\pm\infty$ の両方に発散する。$P^{2}=-D_{1}^{2}=\Delta$ で、$\Delta$ の固有値 $m^{2}$（$m\ge1$）の固有空間 $\operatorname{span}\{e_{m},e_{-m}\}$（\ref{gl:prob-er-circle-kernel.1}）は、$P$ の固有値 $m$ と $-m$ の固有空間の直和に分かれる。$\cos mt$ と $\sin mt$ は $\Delta$ の固有関数だが $P$ の固有関数ではない。

**3.** $P_{c}e_{m}=(m+c)e_{m}$。$(cu,v)=(u,\bar{c}v)$ から $P_{c}^{*}=P+\bar{c}$。$u\in L^{2}$ が $P_{c}u=0$ の弱解なら、$P_{c}^{t}=iD_{1}+c$ と $P_{c}^{t}e_{-m}=(m+c)e_{-m}$ から $(m+c)\hat{u}(m)=0$ がすべての $m$ で成り立つ。よって $\ker P_{c}=\operatorname{span}\{e_{-c}\}$（$c\in\mathbb{Z}$ のとき）、$\{0\}$（それ以外）。同様に $\ker P_{c}^{*}$ は $m+\bar{c}=0$ となる $e_{m}$ で張られ、$\bar{c}\in\mathbb{Z}$ と $c\in\mathbb{Z}$ は同値なので、$c\in\mathbb{Z}$ なら $\operatorname{span}\{e_{-c}\}$、それ以外は $0$。どちらの場合も $\dim\ker P_{c}=\dim\ker P_{c}^{*}$ で、指数は $0$。像：$u\in H^{1}$ について $\widehat{P_{c}u}(m)=(m+c)\hat{u}(m)$（\ref{gl:torus-sobolev.2}）。$c\in\mathbb{Z}$ なら、$f\in L^{2}$ が $P_{c}(H^{1})$ に入ることは $\hat{f}(-c)=0$、つまり $(f,e_{-c})=0$ と同値で（逆は $\hat{u}(m)\defeq\hat{f}(m)/(m+c)$, $m\neq-c$ とおき、$|m+c|\ge\frac12(1+|m|)$ が有限個の $m$ を除いて成り立つことと \ref{gl:torus-sobolev.1} から $u\in H^{1}$）、これは \ref[2(c)]{gl:elliptic-fredholm.2} の条件である。$c\notin\mathbb{Z}$ なら $\inf_{m}|m+c|(1+|m|)^{-1}>0$ なので同じ式で全射になり、(c) の条件は空である。
:::

::: problem {#gl:prob-sp-rayleigh}
\ref{gl:elliptic-spectral-decomposition} の状況で、$(\varphi_{j},\lambda_{j})$ を 1 の基底と固有値とする。$u\in H^{k}(M;E)$, $u\neq0$ について $\mathcal{R}(u)\defeq(Pu,u)/\|u\|_{L^{2}}^{2}$（**レイリー商**）とおく。
1. $u\in H^{k}$ について $(Pu,u)=\sum_{j}\lambda_{j}|c_{j}|^{2}$（$c_{j}=(u,\varphi_{j})$）を示せ。
2. $\lambda_{0}=\min_{u\neq0}\mathcal{R}(u)$ で、最小値をとるのは $u\in\ker(P-\lambda_{0})$ のときに限ることを示せ。
3. $j\ge1$ について、$\lambda_{j}=\min\{\mathcal{R}(u):u\neq0,\ (u,\varphi_{0})=\cdots=(u,\varphi_{j-1})=0\}$ を示せ。
4. $\lambda_{j}=\min_{V}\max_{u\in V\setminus\{0\}}\mathcal{R}(u)$（$V$ は $H^{k}(M;E)$ の $j+1$ 次元部分空間を動く）を示せ（**ミニマックス原理**）。
:::

::: solution
**1.** \ref{gl:elliptic-resolvent.1} と $\lambda_{j}\in\mathbb{R}$ から $(Pu,\varphi_{j})=(u,P\varphi_{j})=\lambda_{j}c_{j}$。記法の節の $(x,y)=\sum_{j}(x,\varphi_{j})\overline{(y,\varphi_{j})}$ を $x=Pu$, $y=u$ に使うと $(Pu,u)=\sum_{j}\lambda_{j}c_{j}\overline{c_{j}}=\sum_{j}\lambda_{j}|c_{j}|^{2}$。

**2.** 1 とパーセヴァルの等式から $(Pu,u)=\sum_{j}\lambda_{j}|c_{j}|^{2}\ge\lambda_{0}\sum_{j}|c_{j}|^{2}=\lambda_{0}\|u\|_{L^{2}}^{2}$ で、$\mathcal{R}(\varphi_{0})=\lambda_{0}$ なので最小値は $\lambda_{0}$。等号は $\sum_{j}(\lambda_{j}-\lambda_{0})|c_{j}|^{2}=0$、つまり $\lambda_{j}>\lambda_{0}$ のすべての $j$ で $c_{j}=0$ のときで、\ref{gl:elliptic-spectral-decomposition.2} からこれは $u\in\ker(P-\lambda_{0})$ と同値。

**3.** 条件から $c_{0}=\cdots=c_{j-1}=0$ なので、$(Pu,u)=\sum_{i\ge j}\lambda_{i}|c_{i}|^{2}\ge\lambda_{j}\sum_{i\ge j}|c_{i}|^{2}=\lambda_{j}\|u\|_{L^{2}}^{2}$（$\lambda_{i}$ は単調非減少）。$u=\varphi_{j}$ で等号。

**4.** $V_{0}\defeq\operatorname{span}\{\varphi_{0},\dots,\varphi_{j}\}\subset H^{k}$ では、$u=\sum_{i\le j}c_{i}\varphi_{i}$ について $(Pu,u)=\sum_{i\le j}\lambda_{i}|c_{i}|^{2}\le\lambda_{j}\|u\|^{2}$ なので最大値は $\lambda_{j}$（$\varphi_{j}$ でとる）。逆に任意の $j+1$ 次元部分空間 $V$ では、$j$ 個の線形条件 $(u,\varphi_{0})=\cdots=(u,\varphi_{j-1})=0$ を満たす $0$ でない $u\in V$ があり（次元公式）、3 から $\mathcal{R}(u)\ge\lambda_{j}$。よって $\max_{V}\mathcal{R}\ge\lambda_{j}$ で、最小値は $V_{0}$ でとる $\lambda_{j}$。
:::
