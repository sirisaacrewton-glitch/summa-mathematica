# 固有関数展開と球面調和関数 {#gl:page-spectral-examples keywords="eigenfunction expansion on closed manifolds, Sobolev norms via eigenvalues, Dirichlet energy and eigenvalues, Fourier series on the flat torus as an eigenfunction expansion, lattice point counting and Weyl law, spherical harmonics, eigenvalues l(l+1) of the Laplacian on the 2-sphere with multiplicity 2l+1, harmonic homogeneous polynomials, smallest positive eigenvalue and the sharp Poincare constant, spectral gap, Hodge Laplacian on forms, harmonic forms, 固有関数展開, 球面調和関数, 調和多項式, 最小の正の固有値, ポアンカレの不等式の最良定数, スペクトル・ギャップ, ホッジのラプラシアン"}

前のページ \ref{gl:page-elliptic-spectrum} では、閉多様体の上の形式的に自己共役で非負な楕円型作用素について、滑らかな固有切断からなる $L^{2}$ の正規直交基底があり、固有値が有限の重複度で $\infty$ へ発散することを示した。このページでは、その固有関数展開を使う。まず、ソボレフ空間に入ることやラプラシアンのエネルギー $\int|\nabla u|^{2}$ が、展開の係数と固有値の重みで表せることを示す。次に具体例として、平坦トーラスではこの展開がフーリエ級数そのものであること、単位球面 $S^{2}$ ではラプラシアンの固有値が $l(l+1)$、固有空間が $l$ 次の調和な斉次多項式の制限（球面調和関数）で次元 $2l+1$ であることを示す。最後に、最小の正の固有値が \ref{gl:poincare-manifold} の最良の定数を与えることを示し、ホッジのラプラシアンにも定理が使えることを確かめる。

## 記法と定義の確認 {#gl:sec-sp-ex-notation}

::: notation
- $M$, $g$, $\mu_{g}$, $\operatorname{vol}(M)$、ベクトル束とファイバー計量、$L^{2}$ の内積 $(u,u')$、形式的随伴と形式的自己共役、非負性は \ref{gl:sec-sp-notation} と \ref{gl:formal-adjoint-bundle} のとおり。前のページの主な結果は \ref{gl:elliptic-fredholm}, \ref{gl:elliptic-resolvent}, \ref{gl:elliptic-spectral-decomposition}, \ref{gl:elliptic-spectral-general}。固有切断の正規直交基底 $(\varphi_{j},\lambda_{j})$ は、\ref{gl:elliptic-spectral-decomposition.2} の意味の任意のもの（滑らかな切断からなり、$P\varphi_{j}=\lambda_{j}\varphi_{j}$）を指し、$u\in L^{2}$ の係数を $c_{j}\defeq(u,\varphi_{j})$ と書く。
- 関数の上のラプラシアン $\Delta=-\operatorname{div}\operatorname{grad}$ は形式的に自己共役で非負な $2$ 階の楕円型作用素である（\ref{gl:sec-sp-resolvent} の冒頭）。$|\nabla u|^{2}$, $\|\nabla u\|_{L^{2}}$, 平均 $u_{M}$ は \ref{gl:sec-pw-notation} のとおり。滑らかな複素数値の $u$, $v$ について
$$
q(u,v)\defeq\int_{M}\sum_{i,l}g^{il}\,\partial_{i}u\,\overline{\partial_{l}v}\,d\mu_{g}
$$
（座標によらない式で $g(\operatorname{grad}u,\operatorname{grad}\bar{v})$ の積分）とおく。各点でコーシー–シュワルツの不等式を使うと $|q(u,v)|\le\|\nabla u\|_{L^{2}}\|\nabla v\|_{L^{2}}\le C\|u\|_{H^{1}}\|v\|_{H^{1}}$（\ref{gl:sm-metric-h1}）なので、$q$ は稠密性（\ref{gl:sobolev-manifold-density}）で $H^{1}(M)$ の上の有界な半双線形形式にただ一通りに延び、$q(v,u)=\overline{q(u,v)}$（$g^{il}$ は実対称）も保たれる。$u\in H^{1}$ について $\|\nabla u\|_{L^{2}}^{2}\defeq q(u,u)$ とおく（$M$ が連結なら \ref{gl:poincare-manifold.2} の延長と一致する。どちらも滑らかな関数の上の同じ式の連続な延長なので）。滑らかな $u$, $v$ について、\ref{gl:closed-manifold-laplacian.1} を実部と虚部に分けて使うと（$\Delta$ は実の係数）$q(u,v)=(u,\Delta v)$。
- トーラス $T^{n}$、$p$, $x_{a}$, $D_{j}$, $e_{m}$, フーリエ係数 $\hat{u}(m)$ は \ref{gl:sec-nt-torus} のとおりで、平坦な計量では $\Delta=-\sum_{j}D_{j}^{2}$、$\Delta e_{m}=|m|^{2}e_{m}$（\ref{gl:laplacian-examples.2}）。単位球面 $S^{2}\subset\mathbb{R}^{3}$ には誘導計量を入れ、球面座標 $(\theta,\phi)$ とラプラシアンの式は \ref{gl:rm-examples.1}, \ref{gl:laplacian-examples.1} のとおり。$\mathbb{R}^{3}$ の上では $\Delta_{0}\defeq\partial_{1}^{2}+\partial_{2}^{2}+\partial_{3}^{2}$（解析学の符号）と書き、ユークリッド計量のラプラシアンは $-\Delta_{0}$ である（\ref{riem:laplace-beltrami.2}）。
- **選択公理**：前のページのスペクトル分解を通して DC（と前の系列の DC・可算選択）を使う。このページで新しく使うのは、球面の節での\tref{top:stone-weierstrass}（ストーン–ワイエルシュトラスの定理）だけで、その証明での選択の扱いはそのページのとおりである。有限次元の空間の基底は、具体的な生成系にグラム–シュミットの直交化を順に施して作る。
:::

## 固有値によるソボレフ空間 {#gl:sec-sp-sobolev}

固有値による展開で、ソボレフ空間と滑らかさが係数の減衰の速さで表せる。

::: proposition 固有値によるソボレフ・ノルム {#gl:spectral-sobolev-norms keywords="Sobolev spaces via eigenfunction expansions: u is in H^{kl} iff sum (1 + lambda_j)^{2l} |c_j|^2 < infinity with equivalent norms; for second order operators such as the Laplacian the weight is (1 + lambda_j)^s for even s; smooth sections are those whose coefficients decay faster than any power; convergence of the expansion in every H^s" index="固有値によるソボレフ・ノルム|こゆうちによるそぼれふのるむ, 固有関数展開の収束|こゆうかんすうてんかいのしゅうそく"}
\ref{gl:elliptic-spectral-decomposition} の状況で、$(\varphi_{j},\lambda_{j})$ を \ref{gl:elliptic-spectral-decomposition.2} の基底とし、$u\in L^{2}(M;E)$ について $c_{j}\defeq(u,\varphi_{j})$ とおく。
1. 整数 $l\ge0$ について、$u\in H^{kl}(M;E)$ であることと $\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}<\infty$ は同値で、$u$ によらない正の定数 $c$, $C$ について $c\|u\|_{H^{kl}}^{2}\le\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}\le C\|u\|_{H^{kl}}^{2}$。$u\in H^{kl}$ なら $((P+1)^{l}u,\varphi_{j})=(1+\lambda_{j})^{l}c_{j}$。
2. $u$ が滑らかな代表元をもつことと、すべての $l$ で $\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}<\infty$ となることは同値で、そのとき部分和 $\sum_{j\le N}c_{j}\varphi_{j}$ はすべての $H^{s}(M;E)$ で $u$ に収束する。
:::

とくに $k=2$（関数の上のラプラシアンなど）では、偶数 $s=2l$ について $\|u\|_{H^{s}}^{2}$ は $\sum_{j}(1+\lambda_{j})^{s}|c_{j}|^{2}$ と同値である。$s$ が奇数の場合のうち $s=1$ のラプラシアンについては、次の \ref{gl:laplacian-energy-spectral} で $\|u\|_{L^{2}}^{2}+\|\nabla u\|_{L^{2}}^{2}=\sum_{j}(1+\lambda_{j})|c_{j}|^{2}$ を示す。

::: proof
**Step 1.** 【主張：$u\in H^{kl}$ なら $((P+1)^{l}u,\varphi_{j})=(1+\lambda_{j})^{l}c_{j}$ で、$\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}\le C\|u\|_{H^{kl}}^{2}$】$l$ についての帰納法で示す。$l\ge1$ のとき $(P+1)^{l-1}u\in H^{k}$（$P+1\colon H^{k(i+1)}\to H^{ki}$ は有界）なので、\ref{gl:elliptic-resolvent.1} から $((P+1)^{l}u,\varphi_{j})=((P+1)^{l-1}u,(P+1)\varphi_{j})=(1+\lambda_{j})((P+1)^{l-1}u,\varphi_{j})$ で、帰納法の仮定（$(P+1)^{l-1}u$ には $u\in H^{k(l-1)}$ として適用）から等式が出る。パーセヴァルの等式（\ref{fa:orthonormal-basis.4}）から $\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}=\|(P+1)^{l}u\|_{L^{2}}^{2}$ で、$(P+1)^{l}\colon H^{kl}\to L^{2}$ の有界性から右の評価が出る。

**Step 2.** 【主張：$\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}<\infty$ なら $u\in H^{kl}$ で $\|u\|_{H^{kl}}^{2}\le C'\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}$】部分和 $\sum_{j\le N}(1+\lambda_{j})^{l}c_{j}\varphi_{j}$ は正規直交性から $L^{2}$ のコーシー列で、極限 $g\in L^{2}$ は $\|g\|_{L^{2}}^{2}=\sum_{j}(1+\lambda_{j})^{2l}|c_{j}|^{2}$、$(g,\varphi_{j})=(1+\lambda_{j})^{l}c_{j}$ を満たす。$R\defeq(P+1)^{-1}$ は $R\varphi_{j}=(1+\lambda_{j})^{-1}\varphi_{j}$ を満たす有界作用素なので、部分和に $R^{l}$ を施して極限をとると $R^{l}g=\sum_{j}c_{j}\varphi_{j}=u$。\ref{gl:elliptic-resolvent.2} を $s=0,k,\dots,k(l-1)$ と繰り返すと $R^{l}$ は $L^{2}$ から $H^{kl}$ への有界作用素なので、$u\in H^{kl}$ で $\|u\|_{H^{kl}}\le C_{0}C_{k}\cdots C_{k(l-1)}\|g\|_{L^{2}}$。

**Step 3.** 【主張：2】滑らかな切断はすべての $H^{s}$ に入るので、1 から和はすべて有限。逆にすべての和が有限なら、1 から $u$ はすべての $H^{kl}$ に、したがって（$\|\cdot\|_{H^{s}}\le\|\cdot\|_{H^{kl}}$, $s\le kl$）すべての $H^{s}$ に入り、\ref{gl:elliptic-smooth} の証明の Step 2 から滑らかな代表元をもつ。部分和との差 $u-\sum_{j\le N}c_{j}\varphi_{j}$ の係数は $j\le N$ で $0$、$j>N$ で $c_{j}$ なので、1 から $\|u-\sum_{j\le N}c_{j}\varphi_{j}\|_{H^{kl}}^{2}\le c^{-1}\sum_{j>N}(1+\lambda_{j})^{2l}|c_{j}|^{2}\to0$。

::: hypcheck
- **非負性と自己共役性**：Step 1 の対称性と $1+\lambda_{j}\ge1>0$ に使った（$R^{l}$ が意味をもつため）。
- **楕円性**：Step 2 の $R$ の正則化の評価（\ref{gl:elliptic-resolvent.2}）に使った。楕円型でない $P$ では、係数の減衰とソボレフ空間は対応しない。
- **階数が $k$ の倍数であること**：$(P+1)^{l}$ で測れるのは $H^{kl}$ だけなので、ほかの階数はこの命題では扱わない。補間（$H^{s}$ を $s$ について連続に動かす）を使えば $\sum_{j}(1+\lambda_{j})^{2s/k}|c_{j}|^{2}$ がすべての $s\ge0$ で $H^{s}$ のノルムの二乗と同値になることが知られている（ここでは証明しない）。
- **公理**：新しい選択は使わない。
:::
:::

ラプラシアンでは、$2$ 階なので前の命題は偶数階のソボレフ空間しか扱わないが、$H^{1}$ はエネルギー $\|\nabla u\|^{2}$ で直接表せる。

::: lemma エネルギーの固有値展開 {#gl:laplacian-energy-spectral keywords="Dirichlet energy via eigenfunction expansion of the Laplacian: u is in H^1 iff sum lambda_j |c_j|^2 < infinity, and ||grad u||^2 = sum lambda_j |c_j|^2, ||u||^2 + ||grad u||^2 = sum (1 + lambda_j) |c_j|^2" index="エネルギーの固有値展開|えねるぎーのこゆうちてんかい, ディリクレ・エネルギー（閉多様体）|でぃりくれえねるぎーへいたようたい"}
$(M,g)$ を閉リーマン多様体、$(\varphi_{j},\lambda_{j})$ を関数の上のラプラシアン $\Delta$ の固有関数の正規直交基底とし、$u\in L^{2}(M)$, $c_{j}\defeq(u,\varphi_{j})$ とする。
1. $u\in H^{1}(M)$ であることと $\sum_{j}\lambda_{j}|c_{j}|^{2}<\infty$ は同値である。
2. $u\in H^{1}(M)$ なら $\|\nabla u\|_{L^{2}}^{2}=\sum_{j}\lambda_{j}|c_{j}|^{2}$、したがって $\|u\|_{L^{2}}^{2}+\|\nabla u\|_{L^{2}}^{2}=\sum_{j}(1+\lambda_{j})|c_{j}|^{2}$。
:::

::: proof
**Step 1.** 【主張：$u\in H^{1}$ について $q(u,\varphi_{j})=\lambda_{j}c_{j}$、$q(\varphi_{i},\varphi_{j})=\lambda_{j}\delta_{ij}$】滑らかな $u$ では記法の節の式と $\lambda_{j}\in\mathbb{R}$ から $q(u,\varphi_{j})=(u,\Delta\varphi_{j})=\lambda_{j}(u,\varphi_{j})$。両辺は $u\in H^{1}$ について連続なので、稠密性から $H^{1}$ でも成り立つ。$u=\varphi_{i}$ とすれば後半。

**Step 2.** 【主張：$u\in H^{1}$ なら $\sum_{j}\lambda_{j}|c_{j}|^{2}\le\|\nabla u\|_{L^{2}}^{2}$】$s_{N}\defeq\sum_{j\le N}c_{j}\varphi_{j}$, $v_{N}\defeq u-s_{N}$ とおく。$i\le N$ について $(v_{N},\varphi_{i})=c_{i}-c_{i}=0$ なので、Step 1 と $q$ のエルミート性から $q(s_{N},v_{N})=\sum_{i\le N}c_{i}\overline{q(v_{N},\varphi_{i})}=\sum_{i\le N}c_{i}\lambda_{i}\overline{(v_{N},\varphi_{i})}=0$。よって
$$
q(u,u)=q(s_{N},s_{N})+2\operatorname{Re}q(s_{N},v_{N})+q(v_{N},v_{N})=\sum_{j\le N}\lambda_{j}|c_{j}|^{2}+q(v_{N},v_{N})\ge\sum_{j\le N}\lambda_{j}|c_{j}|^{2}
$$
（$q(v_{N},v_{N})=\|\nabla v_{N}\|^{2}\ge0$ は滑らかな関数での非負性の極限）。$N\to\infty$ とすればよい。

**Step 3.** 【主張：$u\in H^{2}$ なら等号】滑らかな $u$ では $q(u,u)=(u,\Delta u)$ で、両辺は $u\in H^{2}$ について連続なので $H^{2}$ でも成り立つ。\ref{gl:elliptic-resolvent.1} から $(\Delta u,\varphi_{j})=(u,\Delta\varphi_{j})=\lambda_{j}c_{j}$ なので、記法（\ref{gl:sec-sp-notation}）の $(x,y)=\sum_{j}(x,\varphi_{j})\overline{(y,\varphi_{j})}$ から $(u,\Delta u)=\sum_{j}c_{j}\overline{\lambda_{j}c_{j}}=\sum_{j}\lambda_{j}|c_{j}|^{2}$。

**Step 4.** 【主張：2】Step 2 を差 $u-u'$ に使うと、$\Lambda u\defeq(\sqrt{\lambda_{j}}\,c_{j})_{j}$ は $H^{1}$ から $\ell^{2}$ への有界線形写像（$\|\Lambda u\|^{2}\le q(u,u)\le C\|u\|_{H^{1}}^{2}$）である。$u\mapsto\|\Lambda u\|^{2}$ と $u\mapsto q(u,u)$ はどちらも $H^{1}$ で連続で、$H^{2}$（滑らかな関数を含むので $H^{1}$ で稠密）の上で Step 3 から等しいので、$H^{1}$ 全体で等しい。後半はパーセヴァルの等式と足し合わせる。

**Step 5.** 【主張：1】$\Rightarrow$ は 2 から。逆に $\sum_{j}\lambda_{j}|c_{j}|^{2}<\infty$ なら、$N>N'$ について 2（滑らかな $s_{N}-s_{N'}$ に使う）と \ref{gl:sm-metric-h1} から $c\|s_{N}-s_{N'}\|_{H^{1}}^{2}\le\sum_{N'<j\le N}(1+\lambda_{j})|c_{j}|^{2}\to0$ で、$(s_{N})$ は $H^{1}$ のコーシー列。極限 $w\in H^{1}$ は $L^{2}$ での極限 $u$ と一致する（$H^{1}$ のノルムは $L^{2}$ のノルムを抑える）ので、$u\in H^{1}$。

::: hypcheck
- **$\Delta$ が形式的に自己共役で非負**：Step 1・3 の部分積分と $\lambda_{j}\ge0$（$\sqrt{\lambda_{j}}$ をとるため）に使った。
- **閉多様体であること**：$q(u,v)=(u,\Delta v)$ に境界項が出ないこと（\ref{gl:closed-manifold-laplacian.1}）に使った。境界つきでは、ディリクレ条件の固有関数で展開すれば $H_{0}^{1}$ について同じ式が成り立つ。
- **公理**：新しい選択は使わない。
:::
:::

## トーラスと円周 {#gl:sec-sp-torus}

::: example 平坦トーラスのスペクトル {#gl:spectrum-torus keywords="spectrum of the flat torus T^n: eigenvalues |m|^2 for lattice points m, multiplicity = number of representations as a sum of n squares; the eigenfunction expansion is the Fourier series; circle: eigenvalues 0, 1, 1, 4, 4, ...; lattice point count and Weyl law" index="平坦トーラスのスペクトル|へいたんとーらすのすぺくとる, 円周のラプラシアンの固有値|えんしゅうのらぷらしあんのこゆうち"}
平坦トーラス $T^{n}$ の関数の上のラプラシアン $\Delta=-\sum_{j}D_{j}^{2}$ を考える。
1. $\{(2\pi)^{-n/2}e_{m}\}_{m\in\mathbb{Z}^{n}}$ は滑らかな固有関数からなる $L^{2}(T^{n})$ の正規直交基底で（\ref{gl:torus-fourier-basis.2}, \ref{gl:laplacian-examples.2}）、$\Delta e_{m}=|m|^{2}e_{m}$。したがって \ref{gl:elliptic-spectral-decomposition.2} から、固有値は $\lambda=|m|^{2}$（$m\in\mathbb{Z}^{n}$）の形の整数だけで、$\ker(\Delta-\lambda)=\operatorname{span}\{e_{m}:|m|^{2}=\lambda\}$、重複度は $r_{n}(\lambda)\defeq\#\{m\in\mathbb{Z}^{n}:|m|^{2}=\lambda\}$（$\lambda$ を $n$ 個の整数の平方和で表す方法の数）。
2. **円周**（$n=1$）：固有値は $0$（重複度 $1$、定数）と $m^{2}$（$m\ge1$、重複度 $2$、$e^{\pm imt}$ または実の $\cos mt$, $\sin mt$）。重複度を込めて並べると $0,1,1,4,4,9,9,\dots$。
3. $n=2$：$r_{2}(1)=r_{2}(2)=r_{2}(4)=4$、$r_{2}(5)=8$（$(\pm1,\pm2)$, $(\pm2,\pm1)$）、$r_{2}(25)=12$（$(\pm5,0)$, $(0,\pm5)$, $(\pm3,\pm4)$, $(\pm4,\pm3)$）で、$3$, $6$, $7$ は固有値でない。重複度は数論的に不規則に振る舞う。
4. 係数は $c_{m}=(u,(2\pi)^{-n/2}e_{m})=(2\pi)^{n/2}\hat{u}(m)$ なので、\ref{gl:spectral-sobolev-norms.1}（$k=2$）は偶数 $s$ について $\|u\|_{H^{s}}^{2}$ と $\sum_{m}(1+|m|^{2})^{s}|\hat{u}(m)|^{2}$ の同値性を与え、\ref{gl:torus-sobolev.1} の偶数階の場合を再現する。\ref{gl:laplacian-energy-spectral.2} は $\|\nabla u\|_{L^{2}}^{2}=(2\pi)^{n}\sum_{m}|m|^{2}|\hat{u}(m)|^{2}$ を与える。
5. **固有値の個数.** $N(\lambda)\defeq\#\{m:|m|^{2}\le\lambda\}$ と $R\defeq\sqrt{\lambda}$ について、格子点 $m$ を中心とする一辺 $1$ の立方体（対角線の半分は $\sqrt{n}/2$）を考えると、$|m|\le R$ の立方体は互いに内部で交わらず半径 $R+\sqrt{n}/2$ の球に含まれ、半径 $R-\sqrt{n}/2$ の球はそれらの和に含まれる（その球の点 $y$ の各成分を最も近い整数に丸めた格子点 $m$ は、$|y-m|\le\sqrt{n}/2$ なので $|m|\le R$ を満たし、$y$ は $m$ の立方体に入る）。よって $\omega_{n}(R-\sqrt{n}/2)^{n}\le N(\lambda)\le\omega_{n}(R+\sqrt{n}/2)^{n}$（$R\ge\sqrt{n}/2$）で、$N(\lambda)\sim\omega_{n}\lambda^{n/2}$。$\operatorname{vol}(T^{n})=(2\pi)^{n}$ なので、これはワイルの漸近公式（\ref{gl:elliptic-spectral-decomposition} の後の補足）の $(2\pi)^{-n}\omega_{n}\operatorname{vol}(M)\lambda^{n/2}$ と一致する。
:::

## 球面調和関数 {#gl:sec-sp-sphere}

$\mathcal{P}_{l}$ を $\mathbb{R}^{3}$ の上の複素係数の $l$ 次斉次多項式の全体（$\mathcal{P}_{-1}=\mathcal{P}_{-2}\defeq0$）、$\mathcal{H}_{l}\defeq\{p\in\mathcal{P}_{l}:\Delta_{0}p=0\}$ を $l$ 次の**調和な斉次多項式**の全体とし、$p\in\mathcal{P}_{l}$ の $S^{2}$ への制限を $p|_{S}$ と書く。$\mathcal{H}_{l}|_{S}$ の元を $l$ 次の**球面調和関数**という。

::: lemma 斉次多項式の制限とラプラシアン {#gl:sphere-laplacian-polynomial keywords="for a homogeneous polynomial p of degree l on R^3, the spherical Laplacian of its restriction is Delta_S (p|_S) = l(l+1) p|_S - (Delta_0 p)|_S; harmonic homogeneous polynomials restrict to eigenfunctions with eigenvalue l(l+1)" index="斉次多項式の制限のラプラシアン|せいじたこうしきのせいげんのらぷらしあん"}
$p\in\mathcal{P}_{l}$ について、$S^{2}$ の上で $\Delta(p|_{S})=l(l+1)\,p|_{S}-(\Delta_{0}p)|_{S}$。とくに $p\in\mathcal{H}_{l}$ なら $\Delta(p|_{S})=l(l+1)\,p|_{S}$。
:::

::: proof
$\mathbb{R}^{3}$ の極座標 $(r,\theta,\phi)\in(0,\infty)\times(0,\pi)\times(0,2\pi)\mapsto r(\sin\theta\cos\phi,\sin\theta\sin\phi,\cos\theta)$ の逆は座標近傍で、座標ベクトル場 $\partial_{r},\partial_{\theta},\partial_{\phi}$ は直交し長さは $1,r,r\sin\theta$（直接計算）なので、ユークリッド計量の成分は $g=\operatorname{diag}(1,r^{2},r^{2}\sin^{2}\theta)$、$\sqrt{g}=r^{2}\sin\theta$。\ref{riem:laplace-beltrami.2} から、この座標でユークリッド計量のラプラシアンは
$$
-\Delta_{0}f=-\frac{1}{r^{2}}\partial_{r}\bigl(r^{2}\partial_{r}f\bigr)+\frac{1}{r^{2}}\Bigl(-\frac{1}{\sin\theta}\partial_{\theta}(\sin\theta\,\partial_{\theta}f)-\frac{1}{\sin^{2}\theta}\partial_{\phi}^{2}f\Bigr)
$$
（左辺は直交座標での式。どちらも座標によらない $-\operatorname{div}\operatorname{grad}f$）。括弧の中は、$r$ を止めて $(\theta,\phi)$ の関数とみたときの $S^{2}$ のラプラシアンの式（\ref{gl:laplacian-examples.1}）である。$p$ は $l$ 次斉次なので、極座標で $p=r^{l}Y(\theta,\phi)$（$Y$ は $p|_{S}$ の球面座標での表示）と書け、$-r^{-2}\partial_{r}(r^{2}\cdot lr^{l-1})Y=-l(l+1)r^{l-2}Y$ から $-\Delta_{0}p=r^{l-2}\bigl(\Delta Y-l(l+1)Y\bigr)$。$r=1$ とおくと、球面座標の定義域 $S^{2}\setminus C$（\ref{gl:rm-examples.1}）の上で $\Delta(p|_{S})=l(l+1)p|_{S}-(\Delta_{0}p)|_{S}$。両辺は $S^{2}$ の上の連続関数で、$C$ は内点をもたない（測度 $0$ の閉集合で、空でない開集合の測度は正、\ref{gl:riemannian-measure.2}）ので、$S^{2}$ 全体で等しい。
:::

::: theorem 球面のラプラシアンのスペクトル {#gl:sphere-spectrum keywords="spectrum of the Laplacian on the round 2-sphere: eigenvalues l(l+1), l = 0, 1, 2, ..., eigenspaces are spherical harmonics of degree l (restrictions of harmonic homogeneous polynomials), of dimension 2l+1; L^2(S^2) is the orthogonal sum; dimension count via restrictions of polynomials of degree at most L" index="球面調和関数|きゅうめんちょうわかんすう, 球面のラプラシアンの固有値|きゅうめんのらぷらしあんのこゆうち, 調和多項式|ちょうわたこうしき"}
単位球面 $S^{2}$（誘導計量）の関数の上のラプラシアン $\Delta$ について次が成り立つ。
1. 制限 $p\mapsto p|_{S}$ は $\mathcal{P}_{l}$ の上で単射で、$\dim\mathcal{H}_{l}=2l+1$。
2. $\Delta$ の固有値はちょうど $l(l+1)$（$l=0,1,2,\dots$）で、$\ker(\Delta-l(l+1))=\mathcal{H}_{l}|_{S}$、重複度は $2l+1$。
3. $\mathcal{H}_{l}|_{S}$（$l\ge0$）は互いに直交し、それらの和は $L^{2}(S^{2})$ で稠密である。重複度を込めた固有値の列は $0;\,2,2,2;\,6,6,6,6,6;\,12\ (7\text{ 回});\dots$。
:::

::: intuition
球面のラプラシアンの固有関数は、$l$ 次の調和な多項式を球面に制限したものだけで、固有値は $l(l+1)$、同じ固有値の独立な固有関数はちょうど $2l+1$ 個ある。どんな関数も、それらの重ね合わせとして書ける。
:::

::: example
$\mathcal{H}_{0}=\operatorname{span}\{1\}$、$\mathcal{H}_{1}=\operatorname{span}\{x,y,z\}$（固有値 $2$。$z$ については \ref{gl:laplacian-examples.1}）、$\mathcal{H}_{2}=\operatorname{span}\{xy,yz,zx,x^{2}-y^{2},x^{2}+y^{2}-2z^{2}\}$（固有値 $6$）。$z^{2}\notin\mathcal{H}_{2}$ だが、$S^{2}$ の上では $z^{2}=\frac13-\frac13(x^{2}+y^{2}-2z^{2})$ なので、$\Delta(z^{2})=6z^{2}-2$（\ref{gl:ex-dg-2}）と整合する。回転対称な固有関数はルジャンドル多項式 $P_{l}(z)$ である（\ref{gl:ex-sm-3}）。
:::

::: proof
**Step 1.** 【主張：1 の前半と、$W_{L}\defeq\{p|_{S}:p\text{ は }L\text{ 次以下の多項式}\}$ の次元が $(L+1)^{2}$】$p\in\mathcal{P}_{l}$ が $p|_{S}=0$ なら、$x\neq0$ で $p(x)=|x|^{l}p(x/|x|)=0$、連続性から $p(0)=0$ で、多項式関数として $0$、係数は $\partial^{\alpha}p(0)/\alpha!$ なので $p=0$。$S^{2}$ の上では $|x|^{2}=1$ なので、$L-2i$ 次の斉次部分に $|x|^{2i}$ を、$L-1-2i$ 次の部分に $|x|^{2i}$ を掛けても制限は変わらず、$W_{L}=\mathcal{P}_{L}|_{S}+\mathcal{P}_{L-1}|_{S}$。$a\in\mathcal{P}_{L}$, $b\in\mathcal{P}_{L-1}$ で $(a+b)|_{S}=0$ なら、$-\omega$ で評価して $(-1)^{L}(a-b)(\omega)=0$ なので $(a-b)|_{S}=0$、合わせて $a|_{S}=b|_{S}=0$ で $a=b=0$。よって和は直和で、$\dim\mathcal{P}_{l}=\binom{l+2}{2}$ から $\dim W_{L}=\frac{(L+1)(L+2)}{2}+\frac{L(L+1)}{2}=(L+1)^{2}$。

**Step 2.** 【主張：$\dim\mathcal{H}_{l}\ge2l+1$ で、$\mathcal{H}_{l}|_{S}\subset\ker(\Delta-l(l+1))$】$\Delta_{0}\colon\mathcal{P}_{l}\to\mathcal{P}_{l-2}$ は線形なので、核の次元は $\dim\mathcal{P}_{l}-\dim\mathcal{P}_{l-2}=\frac{(l+2)(l+1)-l(l-1)}{2}=2l+1$ 以上。後半は \ref{gl:sphere-laplacian-polynomial}。

**Step 3.** 【主張：1 と、$W_{L}=\bigoplus_{l\le L}\mathcal{H}_{l}|_{S}$（直交直和）】異なる $l$ の $\mathcal{H}_{l}|_{S}$ は異なる固有値 $l(l+1)$ の固有関数の空間なので直交する（$\lambda(u,v)=(\Delta u,v)=(u,\Delta v)=\lambda'(u,v)$）。$\mathcal{H}_{l}\subset\mathcal{P}_{l}$ と Step 1 の議論から $\mathcal{H}_{l}|_{S}\subset W_{L}$（$l\le L$）なので、直交直和 $\bigoplus_{l\le L}\mathcal{H}_{l}|_{S}$ は $W_{L}$ に含まれ、その次元は Step 1（制限の単射性）と Step 2 から $\sum_{l\le L}(2l+1)=(L+1)^{2}=\dim W_{L}$ 以上。よって等号が成り立ち、各 $l$ で $\dim\mathcal{H}_{l}=2l+1$。

**Step 4.** 【主張：$\bigcup_{L}W_{L}$ は $L^{2}(S^{2})$ で稠密】実係数の多項式の制限は $C(S^{2};\mathbb{R})$ の部分代数で、定数を含み、座標関数が二点を分離するので、\ref{top:stone-weierstrass} から一様に稠密。$f\in L^{2}(S^{2})$ と $\varepsilon>0$ について、滑らかな $g$ で $\|f-g\|_{L^{2}}<\varepsilon$ となるものがあり（\ref{gl:sobolev-manifold-density}、$k=0$）、$\operatorname{Re}g$, $\operatorname{Im}g$ を一様に $\varepsilon$ 以内で多項式 $a$, $b$ で近似すると、$\operatorname{vol}(S^{2})=4\pi$ から $\|g-(a+ib)|_{S}\|_{L^{2}}\le2\varepsilon\sqrt{4\pi}$。

**Step 5.** 【主張：2・3】各 $\mathcal{H}_{l}$ の基底を（単項式の基底で $\Delta_{0}$ の核を掃き出し法で求めて）具体的に定め、その制限にグラム–シュミットの直交化を施すと、$\mathcal{H}_{l}|_{S}$ の正規直交基底を得る。これらをすべての $l$ について並べた族は、Step 3 から正規直交系で、張る空間 $\bigcup_{L}W_{L}$ は Step 4 から稠密なので、滑らかな固有関数からなる正規直交基底である（\ref{fa:orthonormal-basis}）。\ref{gl:elliptic-spectral-decomposition.2} をこの基底に使うと、固有値は $l(l+1)$ だけ（$l$ が違えば値も違う）で、$\ker(\Delta-l(l+1))=\mathcal{H}_{l}|_{S}$、重複度は $2l+1$。

::: hypcheck
- **丸い計量**：\ref{gl:sphere-laplacian-polynomial} の極座標の計算（$\mathbb{R}^{3}$ の計量の制限であること）に使った。ほかの計量を入れた $S^{2}$ では固有値も固有関数も変わる（\ref{gl:laplacian-examples.3} の回転トーラスと同じ現象）。
- **調和であること**：Step 2・3 で、$\mathcal{H}_{l}$ が固有関数になることに使った。調和でない斉次多項式（$z^{2}$ など）の制限は、一般に複数の固有空間にまたがる（上の例）。
- **次元の数え上げ**：$S^{2}$ が $\mathbb{R}^{3}$ の中の球面で $|x|^{2}=1$ となることと、対蹠写像で斉次多項式の次数の偶奇が分かれることを Step 1 で使った。
- **公理**：Step 4 のストーン–ワイエルシュトラスの定理（記法の節）と、前のページのスペクトル分解を通した選択だけ。基底は具体的な手順で作る。
:::
:::

::: supplement
**前提を変えると.** 同じ議論で、$S^{n}\subset\mathbb{R}^{n+1}$（$n\ge1$）のラプラシアンの固有値は $l(l+n-1)$、固有空間は $n+1$ 変数の $l$ 次の調和な斉次多項式の制限で、次元は $\binom{n+l}{n}-\binom{n+l-2}{n}$ になる（ここでは証明しない。補題の計算で $r^{2}$ が $r^{n}$ に変わる）。$n=1$ では固有値 $l^{2}$、次元 $2$（$l\ge1$）で円周の結果に戻る。半径 $\rho$ の球面では固有値は $\rho^{-2}l(l+1)$ になる（計量を $\rho^{2}$ 倍するとラプラシアンは $\rho^{-2}$ 倍）。

**似た定理.** $\mathcal{H}_{l}$ には回転群 $SO(3)$ が作用し、$2l+1$ 次元の既約表現になる。ラプラシアンは回転と可換なので固有空間は表現で、球面の固有関数展開は、等質空間 $SO(3)/SO(2)$ の上のコンパクト群の行列成分による展開（\see{four:cg-peter-weyl}）の具体例である。回転対称な固有関数がルジャンドル多項式であることは、常微分方程式（ルジャンドルの微分方程式）の固有値問題の言葉で言い直せる。

**高い視点：地球儀の上の定常波.** 球面調和関数は、地球儀の上に立つ定常波の形である。$l$ が大きいほど細かく振動し、振動の「波数」の二乗がほぼ $l(l+1)$ になる。同じ $l$ に $2l+1$ 個の独立な形があるのは、球面がどの向きにも同じ形をしている（回転の対称性）ため、一つの波の形を回して作れる形がすべて同じ振動数をもつからである。化学で水素原子の $s,p,d$ 軌道が $1,3,5$ 個ずつあるのは、この $2l+1$ の現れである。
:::

## ポアンカレの不等式の最良定数 {#gl:sec-sp-poincare}

::: theorem ポアンカレの不等式の最良定数 {#gl:poincare-best-constant keywords="sharp Poincare constant on a closed connected Riemannian manifold: ||u - u_M||^2 <= lambda_1^{-1} ||grad u||^2 with lambda_1 the smallest positive eigenvalue of the Laplacian; equality exactly for u - u_M in the first eigenspace; variational characterization of lambda_1 by the Rayleigh quotient; spectral gap" index="ポアンカレの不等式の最良定数|ぽあんかれのふとうしきのさいりょうていすう, 最小の正の固有値|さいしょうのせいのこゆうち, スペクトル・ギャップ|すぺくとるぎゃっぷ"}
$(M,g)$ を連結な閉リーマン多様体とし、関数の上のラプラシアンの固有値を重複度を込めて $\lambda_{0}\le\lambda_{1}\le\cdots$ と並べる。
1. $\lambda_{0}=0<\lambda_{1}$ で、$\ker\Delta$ は定数関数の全体（$1$ 次元）である。
2. すべての $u\in H^{1}(M)$ について $\|u-u_{M}\|_{L^{2}}^{2}\le\lambda_{1}^{-1}\|\nabla u\|_{L^{2}}^{2}$ で、等号は $u-u_{M}\in\ker(\Delta-\lambda_{1})$ のときに限る。
3. $\lambda_{1}=\min\{\|\nabla u\|_{L^{2}}^{2}/\|u\|_{L^{2}}^{2}:u\in H^{1}(M),\ u\neq0,\ \int_{M}u\,d\mu_{g}=0\}$。したがって \ref{gl:poincare-manifold.1} の不等式の最良の定数は $\lambda_{1}^{-1/2}$ である。
:::

::: intuition
連結な閉多様体の上で、平均からのずれは勾配で抑えられるが、その最良の倍率は、ラプラシアンの最も低い非自明な振動数（最小の正の固有値）の平方根の逆数である。最良の倍率に達するのは、その最も低い振動そのものだけである。
:::

::: proof
**Step 1.** 【主張：1】$u\in\ker\Delta$ は \ref{gl:elliptic-spectral-decomposition.2} から滑らかで $\Delta u=0$ なので、実部と虚部に \ref{gl:closed-manifold-laplacian.4} を使って定数。定数は $\Delta1=0$ を満たす。よって $\ker\Delta$ は $1$ 次元で、固有値 $0$ の重複度は $1$、ほかの固有値は正（\ref{gl:elliptic-spectral-decomposition.1} から $\ge0$）なので $\lambda_{0}=0<\lambda_{1}$。

**Step 2.** 【主張：基底を $\varphi_{0}=\operatorname{vol}(M)^{-1/2}$ としてよく、そのとき $c_{0}\varphi_{0}=u_{M}$ で $u-u_{M}=\sum_{j\ge1}c_{j}\varphi_{j}$】Step 1 から $\ker\Delta$ の正規直交基底は単位の大きさの定数で、$\varphi_{0}$ をその一つに取り替えても固有関数の正規直交基底のままである。$c_{0}\varphi_{0}=\operatorname{vol}(M)^{-1}\int_{M}u\,d\mu_{g}=u_{M}$ で、展開から残りが従う。

**Step 3.** 【主張：2】\ref{gl:laplacian-energy-spectral.2} とパーセヴァルの等式から
$$
\|\nabla u\|_{L^{2}}^{2}=\sum_{j\ge1}\lambda_{j}|c_{j}|^{2}\ge\lambda_{1}\sum_{j\ge1}|c_{j}|^{2}=\lambda_{1}\|u-u_{M}\|_{L^{2}}^{2}.
$$
等号は $\sum_{j\ge1}(\lambda_{j}-\lambda_{1})|c_{j}|^{2}=0$、つまり $\lambda_{j}>\lambda_{1}$ のすべての $j$ で $c_{j}=0$ のときで、\ref{gl:elliptic-spectral-decomposition.2} からこれは $u-u_{M}\in\ker(\Delta-\lambda_{1})$ と同値。

**Step 4.** 【主張：3】$\int u=0$ なら $u_{M}=0$ で、2 から商は $\lambda_{1}$ 以上。$\varphi_{1}$ は $\varphi_{0}$ と直交するので $\int\varphi_{1}=0$ で、商はちょうど $\lambda_{1}$（\ref{gl:laplacian-energy-spectral.2}）。最良の定数：$C$ が \ref{gl:poincare-manifold.1} を満たせば、$\varphi_{1}$（滑らか）に使って $\|\varphi_{1}\|\le C\sqrt{\lambda_{1}}\|\varphi_{1}\|$ から $C\ge\lambda_{1}^{-1/2}$、逆に 2 から $C=\lambda_{1}^{-1/2}$ で成り立つ。

::: hypcheck
- **連結性**：Step 1 で核が定数だけであることに使った。外すと偽：二つの成分をもつ $M$ で、一方で $1$、他方で $0$ の関数 $u$ は $\nabla u=0$ だが $u-u_{M}\neq0$ で、不等式は成り立たない（固有値 $0$ の重複度は成分の数）。
- **閉多様体であること**：スペクトル分解（レリッヒの定理）とエネルギーの展開に使った。
- **公理**：前のページのスペクトル分解を通した選択だけで、\ref{gl:poincare-manifold} の背理法の可算選択は使わない（不等式そのものも、ここで別に示された）。
:::
:::

::: example
平坦トーラス $T^{n}$ では \ref{gl:spectrum-torus.1} から $\lambda_{1}=1$（$m=\pm\mathbf{e}_{j}$）で、最良定数は $1$、等号は $u$ が $1$ と $e^{\pm it_{j}}$ の一次結合のときで、\ref{gl:torus-direct.3} と一致する。単位球面 $S^{2}$ では \ref{gl:sphere-spectrum.2} から $\lambda_{1}=2$ で、最良定数は $2^{-1/2}$、等号は $u=a+bx+cy+dz$ のときに限る。これは \ref{gl:poincare-manifold} の後の注意で予告した値である。
:::

::: supplement
**前提を変えると.** 連結でない $M$ では、各成分の上の平均を引いた $u-\sum_{i}(u_{M_{i}})\mathbf{1}_{M_{i}}$ について同じ不等式が成り立ち、定数はすべての成分の最小の正の固有値のうち最小のもので決まる。境界つきの領域では、平均を引く不等式（ポアンカレ–ヴィルティンガー）はノイマン条件の固有値で、$u=0$ を境界で課す不等式はディリクレ条件の最小固有値で最良定数が決まる（\see{fa:dirichlet-eigenfunctions}）。計量を一様に $\rho^{2}$ 倍すると $\lambda_{1}$ は $\rho^{-2}$ 倍になり、大きな多様体ほど定数は大きい。

**似た定理.** 円周の長さ $L$ の場合は、ヴィルティンガーの不等式 $\int(u-u_{M})^{2}\le(L/2\pi)^{2}\int(u')^{2}$ である。リッチ曲率が $(n-1)K>0$ 以上の閉多様体では $\lambda_{1}\ge nK$（リヒネロヴィッツの定理）で、単位球面 $S^{n}$ で等号が成り立つ。$S^{2}$ の $\lambda_{1}=2$ はその等号の場合である。チーガーの不等式 $\lambda_{1}\ge h^{2}/4$（$h$ は多様体を二つに切る「くびれ」の細さを測る定数）は、$\lambda_{1}$ を幾何で下から抑える（いずれもここでは証明しない）。

**高い視点：一番低い音とくびれ.** $\lambda_{1}$ は多様体という楽器の一番低い（定数でない）音で、勾配のエネルギーをできるだけ使わずに平均からずれる方法を測っている。細長い多様体やくびれた多様体では、片側を高く、反対側を低くする「ゆっくりした」ずれ方ができるので、$\lambda_{1}$ は小さく、ポアンカレの定数は大きくなる（\ref{gl:prob-sp-rect-torus}）。逆に $\lambda_{1}$ が大きいことは、多様体がどこでも「よくつながっている」ことを意味し、熱が速く均される（熱核のページで扱う）ことにもつながる。
:::

## ホッジのラプラシアン {#gl:sec-sp-hodge}

::: example ホッジのラプラシアンのスペクトル {#gl:hodge-laplacian-spectrum keywords="the Hodge Laplacian on k-forms of a closed oriented Riemannian manifold is formally self-adjoint, nonnegative and elliptic: (Delta alpha, beta) = (d alpha, d beta) + (delta alpha, delta beta); orthonormal basis of smooth eigenforms; harmonic forms are finite dimensional, smooth, closed and coclosed" index="ホッジのラプラシアンのスペクトル|ほっじのらぷらしあんのすぺくとる, 調和形式の有限次元性|ちょうわけいしきのゆうげんじげんせい"}
$(M,g)$ を向きづけられた閉リーマン多様体、$0\le k\le n$ とし、$E=\Lambda^{k}T^{*}M$ に \ref{lin:exterior-inner-product.1} の内積をファイバー計量として入れる。ホッジのラプラシアン $\Delta=d\delta+\delta d$（\ref{riem:codifferential}）について：
1. 滑らかな（複素係数の）$k$ 形式 $\alpha$, $\beta$ について $(\Delta\alpha,\beta)=(d\alpha,d\beta)+(\delta\alpha,\delta\beta)$。とくに $\Delta$ は形式的に自己共役で非負である。
2. $\Delta$ は $2$ 階の楕円型で（\ref{gl:hodge-laplacian-symbol.4}）、\ref{gl:elliptic-spectral-decomposition} から、$L^{2}(M;\Lambda^{k}T^{*}M)$ は滑らかな固有形式からなる正規直交基底をもち、固有値は $0$ 以上で $\infty$ へ発散する。
3. 調和 $k$ 形式の空間 $\mathcal{H}^{k}\defeq\ker\Delta$ は有限次元で、滑らかな形式からなり、$\alpha\in\mathcal{H}^{k}$ $\iff$ $d\alpha=0$ かつ $\delta\alpha=0$。
4. $k=0$ では $\delta=0$ なので $\Delta=\delta d$ は関数のラプラシアン（\ref{riem:laplace-beltrami.2}）である。
:::

::: proof
**1.** \ref{riem:codifferential-adjoint} の内積は実の形式について $\int\langle\alpha,\beta\rangle\,\mathrm{vol}_{g}$ で、\ref{gl:rm-integral-formulas.3}（$D=M$）から $\int\langle\alpha,\beta\rangle\,d\mu_{g}$ に等しい。$d$, $\delta$ は実の形式を実の形式に写すので共役と可換で、実部と虚部に分けて半双線形に延ばすと、複素係数の形式でも $(d\alpha,\beta)=(\alpha,\delta\beta)$（次数が合うもの）が成り立ち、共役をとれば $(\delta\gamma,\beta)=(\gamma,d\beta)$。よって $(d\delta\alpha,\beta)=(\delta\alpha,\delta\beta)$、$(\delta d\alpha,\beta)=(d\alpha,d\beta)$ で、足して 1 の等式。右辺は $\alpha$, $\beta$ について対称な形（$\overline{(\Delta\beta,\alpha)}$ と等しい）なので $(\Delta\alpha,\beta)=(\alpha,\Delta\beta)$、$\beta=\alpha$ として非負。

**2.** 1 と \ref{gl:hodge-laplacian-symbol.4} から \ref{gl:elliptic-spectral-decomposition} の仮定が満たされる。

**3.** 有限次元と滑らかさは \ref{gl:elliptic-kernel-range.1}。滑らかな $\alpha$ について 1 から $(\Delta\alpha,\alpha)=\|d\alpha\|_{L^{2}}^{2}+\|\delta\alpha\|_{L^{2}}^{2}$ なので、$\Delta\alpha=0$ と $d\alpha=\delta\alpha=0$ は同値（逆向きは定義から）。

**4.** \ref{riem:codifferential} の約束。
:::

平坦トーラス $T^{n}$ では、平行なフレーム $dt_{I}$ について係数ごとに $\Delta(\sum_{I}f_{I}\,dt_{I})=\sum_{I}(\Delta f_{I})\,dt_{I}$ となるので（ここでは証明しない。平坦な計量では余微分が係数の微分 $-\sum_{j}\iota_{\partial_{j}}D_{j}$ と書けることと \ref{gl:wedge-interior.2} から従う）、$\mathcal{H}^{k}$ は定数係数の $k$ 形式の全体で、次元は $\binom{n}{k}$ である。これは $T^{n}$ のベッチ数と一致し、調和形式がコホモロジーを表すこと（\see{gl:hodge-theorem}）の予告になっている。次のページでは、この例の 3 を出発点にホッジ分解を示す。

## 問題 {#gl:sec-sp-ex-problems}

::: problem {#gl:prob-sp-rect-torus}
$a>0$ とし、$T^{2}$ に、各座標近傍 $x_{b}$（$b\in\mathbb{R}^{2}$）で成分が $g_{11}=1$, $g_{22}=a^{2}$, $g_{12}=0$ となる計量 $g_{a}$ を入れる（長さ $2\pi$ と $2\pi a$ の円周の積）。
1. $g_{a}$ が well-defined なリーマン計量であることと、$\mu_{g_{a}}=a\,\mu_{g_{1}}$, $\Delta_{a}=-D_{1}^{2}-a^{-2}D_{2}^{2}$ を示せ。
2. $\Delta_{a}$ の固有値をすべて求め、最小の正の固有値 $\lambda_{1}$ とその固有空間を $a$ によって場合分けして求めよ。
3. $(T^{2},g_{a})$ のポアンカレの不等式の最良定数が $\max(1,a)$ であることを示し、細長いトーラスほど定数が大きくなる理由を説明せよ。
:::

::: solution
**1.** 座標近傍 $x_{b}$ の間の座標変換は $2\pi\mathbb{Z}^{2}$ の元による平行移動で、ヤコビ行列は単位行列なので、定数の成分は座標変換で保たれ、計量は矛盾なく定まる（正定値対称）。$\gamma_{x_{b}}=\sqrt{\det g}=a$ なので、\ref{gl:rm-basic-properties.2} から $\mu_{g_{a}}=a\,\mu_{g_{1}}$。\ref{riem:laplace-beltrami.2} に $\sqrt{g}=a$, $g^{11}=1$, $g^{22}=a^{-2}$ を入れると $\Delta_{a}=-\partial_{1}^{2}-a^{-2}\partial_{2}^{2}$、つまり $-D_{1}^{2}-a^{-2}D_{2}^{2}$。

**2.** $\Delta_{a}e_{m}=(m_{1}^{2}+a^{-2}m_{2}^{2})e_{m}$。$L^{2}(T^{2},\mu_{g_{a}})$ の内積は平坦な場合の $a$ 倍なので、\ref{gl:torus-fourier-basis.2} から $\{(2\pi)^{-1}a^{-1/2}e_{m}\}$ は滑らかな固有関数からなる正規直交基底で、\ref{gl:elliptic-spectral-decomposition.2} から固有値は $m_{1}^{2}+m_{2}^{2}/a^{2}$（$m\in\mathbb{Z}^{2}$）の全体。$m_{1}\neq0$ なら値は $1$ 以上（等号は $m=(\pm1,0)$）、$m_{1}=0$, $m_{2}\neq0$ なら $a^{-2}$ 以上（等号は $m=(0,\pm1)$）なので $\lambda_{1}=\min(1,a^{-2})$。固有空間は、$a>1$ なら $\operatorname{span}\{e^{\pm it_{2}}\}$、$a<1$ なら $\operatorname{span}\{e^{\pm it_{1}}\}$（$m_{2}^{2}=a^{2}<1$ となる整数 $m_{2}\neq0$ はない）、$a=1$ なら両方を合わせた $4$ 次元。

**3.** \ref{gl:poincare-best-constant.3} から最良定数は $\lambda_{1}^{-1/2}=\max(1,a)$。$a$ が大きいと、長い方向（長さ $2\pi a$）にゆっくり変化する $e^{\pm it_{2}}$ は、勾配が小さい（$|\nabla e^{it_{2}}|=a^{-1}$）のに平均からのずれは大きさ $1$ のままなので、勾配で抑える定数を大きくしなければならない。
:::

::: problem {#gl:prob-sp-sphere-counting}
単位球面 $S^{2}$ の上で考える。
1. $\mathcal{H}_{2}$ の元として、$xy$, $yz$, $zx$, $x^{2}-y^{2}$, $x^{2}+y^{2}-2z^{2}$ が調和で一次独立であることを確かめ、\ref{gl:sphere-spectrum.1} の $\dim\mathcal{H}_{2}=5$ と比べよ。
2. $N(\lambda)\defeq\#\{j:\lambda_{j}\le\lambda\}$（重複度を込める）について、$L(L+1)\le\lambda<(L+1)(L+2)$ なら $N(\lambda)=(L+1)^{2}$ であることを示し、$N(\lambda)/\lambda\to1$ を導け。これはワイルの漸近公式の定数 $(2\pi)^{-2}\omega_{2}\operatorname{vol}(S^{2})$ と一致するか。
3. $u\defeq z+xy$ について、固有関数展開を使って $\|u\|_{L^{2}}^{2}$, $\|\nabla u\|_{L^{2}}^{2}$ を求め、\ref{gl:poincare-best-constant.2} の不等式を確かめよ（$\int_{S^{2}}z^{2}\,d\mu=\frac{4\pi}{3}$, $\int_{S^{2}}x^{2}y^{2}\,d\mu=\frac{4\pi}{15}$ を球面座標で示してから使え）。
:::

::: solution
**1.** $\Delta_{0}(xy)=0$ などは直接計算で、$\Delta_{0}(x^{2}-y^{2})=2-2=0$、$\Delta_{0}(x^{2}+y^{2}-2z^{2})=2+2-4=0$。一次独立性：$\sum c_{i}p_{i}=0$ とすると、$xy$, $yz$, $zx$ の係数を見て $c_{1}=c_{2}=c_{3}=0$、$x^{2}$, $z^{2}$ の係数から $c_{4}+c_{5}=0$, $-2c_{5}=0$ で $c_{4}=c_{5}=0$。$5$ 個の一次独立な元なので、$\dim\mathcal{H}_{2}=5$ からこれらは基底である。

**2.** \ref{gl:sphere-spectrum.2} から、$\lambda_{j}\le\lambda$ となる固有値は $l(l+1)$, $l\le L$ のもので、個数は $\sum_{l\le L}(2l+1)=(L+1)^{2}$。$\lambda\ge2$（$L\ge1$）では $\frac{(L+1)^{2}}{(L+1)(L+2)}<\frac{N(\lambda)}{\lambda}\le\frac{(L+1)^{2}}{L(L+1)}$ で、両端は $L\to\infty$ で $1$ に収束する。$\omega_{2}=\pi$, $\operatorname{vol}(S^{2})=4\pi$ から $(2\pi)^{-2}\cdot\pi\cdot4\pi=1$ で一致する。

**3.** \ref{gl:rm-examples.1} から $\int z^{2}=2\pi\int_{0}^{\pi}\cos^{2}\theta\sin\theta\,d\theta=2\pi\cdot\frac23=\frac{4\pi}{3}$、$\int x^{2}y^{2}=\int_{0}^{\pi}\sin^{5}\theta\,d\theta\int_{0}^{2\pi}\cos^{2}\phi\sin^{2}\phi\,d\phi=\frac{16}{15}\cdot\frac{\pi}{4}=\frac{4\pi}{15}$。$z\in\mathcal{H}_{1}|_{S}$（固有値 $2$）、$xy\in\mathcal{H}_{2}|_{S}$（固有値 $6$）は直交し、ともに定数と直交するので $u_{M}=0$。正規直交基底の元 $\varphi=z/\|z\|$, $\varphi'=xy/\|xy\|$ について $u=\|z\|\varphi+\|xy\|\varphi'$ なので、\ref{gl:laplacian-energy-spectral.2} から
$$
\|u\|^{2}=\frac{4\pi}{3}+\frac{4\pi}{15}=\frac{24\pi}{15},\qquad\|\nabla u\|^{2}=2\cdot\frac{4\pi}{3}+6\cdot\frac{4\pi}{15}=\frac{64\pi}{15}.
$$
比は $\frac{8}{3}\ge2=\lambda_{1}$ で、不等式 $\|u-u_{M}\|^{2}\le\frac12\|\nabla u\|^{2}$（$\frac{24\pi}{15}\le\frac{32\pi}{15}$）が成り立ち、$xy$ の成分があるので等号ではない。
:::
