# 閉多様体上の楕円型評価 {#gl:page-elliptic-regularity keywords="elliptic estimate on closed manifolds, Garding inequality, partition of unity, commutator of lower order, interpolation inequality, elliptic estimate with L^2 remainder"}

前のページ \ref{gl:page-frozen-coefficients} では、トーラスの上の整数階の尺度を整え、係数の凍結によって台の小さな切断についての局所的な楕円型評価と正則性を示した。このページでは、それを 1 の分割で貼り合わせ、閉多様体の上の $k$ 階楕円型作用素 $P$ について評価 $\|u\|_{H^{s+k}}\le C(\|Pu\|_{H^{s}}+\|u\|_{H^{s+k-1}})$ を示す。切り出す関数との交換子は階数が一つ下がるので誤差として吸収できる。さらに補間不等式で右辺の第 2 項を $L^{2}$ ノルムに下げる。これは次のページで弱解の正則性と核の有限次元性を示すときの道具になる。

## 記法と定義の確認 {#gl:sec-er-garding-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（$n\ge1$）、$g$ はリーマン計量、$\mu_{g}$ はリーマン測度（\ref{gl:riemannian-measure}）。$E$, $F$ は $M$ の上のベクトル束で、複素係数の約束（$E$ を $E^{\mathbb{C}}$ に置き換え、係数は複素行列）は \ref{gl:sec-ps-notation} のとおり。以下 $E^{\mathbb{C}}$ も $E$ と書く。
- 切断のソボレフ空間 $H^{s}(M;E)$（$s\ge0$ は整数）は \ref{gl:sobolev-sections} で、複素の切断については実部と虚部がともに $H^{s}$ に入ることと定める。ノルム $\|\cdot\|_{H^{s}}$ は一つ固定した局所化のデータで測り、基本性質（切り出しと貼り付け、完備性、稠密性、$H^{0}=L^{2}$）は \ref{gl:sobolev-sections-properties}。$E$ にファイバー計量を一つ固定し、$L^{2}(M;E)$ のノルムはそれで測る（\ref{gl:sobolev-sections-properties.4} から $\|\cdot\|_{H^{0}}$ と同値）。
- 微分作用素は \ref{gl:differential-operator-manifold.2}、ソボレフ空間の間の有界性と局所的な式は \ref{gl:differential-operator-sobolev}。主表象は \ref{gl:principal-symbol}（約束は $\partial_{j}\mapsto i\xi_{j}$）、計算規則は \ref{gl:symbol-calculus}、楕円型作用素は \ref{gl:elliptic-operator}。楕円型なら $E$ と $F$ の階数は等しく、それを $r$ と書く。
- トーラス $T^{n}$、$p(z)=(e^{iz_{1}},\dots,e^{iz_{n}})$、座標近傍 $x_{a}$、ベクトル場 $D_{j}$、$e_{m}$（$m\in\mathbb{Z}^{n}$）、フーリエ係数 $\hat{u}(m)$ は \ref{gl:sec-nt-torus}、フーリエ級数の基本性質は \ref{gl:torus-fourier-basis}, \ref{gl:torus-sobolev}。$o\defeq p(0)$、$\mathbb{R}^{n}$ の開球を $B(0,\rho)$、閉球を $\bar{B}(0,\rho)$ とし、$\rho\le\pi$ について $W_{\rho}\defeq p(B(0,\rho))$ とおく。$Q\defeq(-\pi,\pi)^{n}$ の上で $p$ は単射で、その逆写像は $a=(-\pi,\dots,-\pi)$ の座標近傍 $x_{a}$ である。
- $\mathbb{R}^{n}$ 上の関数 $w$ で $Q$ の中のコンパクト集合の外で $0$ となるものについて、$T^{n}$ 上の関数 $\breve{w}$ を、$p(Q)$ の上で $\breve{w}(p(z))\defeq w(z)$、その外で $0$ と定める。これは \ref{gl:sec-sm-notation} の記法の $x_{a}^{*}w$ にほかならない。$w\in C_{c}^{\infty}(Q)$ なら $\breve{w}$ は滑らかである（$p(Q)$ の上では $x_{a}$ で見て $w$、$p(\operatorname{supp}w)$ の外では近傍で $0$）。
- $\mathbb{C}^{r}$ のノルムは $|v|$、行列の作用素ノルムは $\|A\|$、$\mathbb{C}^{r}$ の双線形な内積は $v\cdot v'\defeq\sum_{a}v_{a}v'_{a}$。多重指数 $\alpha$ について $K_{k}\defeq\#\{\alpha:|\alpha|=k\}$。
- $k\ge1$ は整数とする（$0$ 階の楕円型作用素はベクトル束の同型を掛ける作用素で、以下の主張は自明になる）。
- **選択公理**：局所化のデータと 1 の分割（\ref{mfd:smooth-partition-of-unity}）で従属選択公理（DC）を使う点は前の系列と同じ。点ごとに座標近傍や半径を選ぶところは、有限個の座標近傍から番号の最小のものをとり、半径は $2^{-l}$ の形の最大のものをとる、というように具体的に決めるので、新しい選択は使わない。
- 前のページの結果：トーラスの尺度と掛け算の評価、凍結した作用素の評価、局所的な楕円型評価、小さな球のトーラスへの移植は \ref{gl:page-frozen-coefficients}。
:::

## 閉多様体の上の楕円型評価 {#gl:sec-er-garding}

閉多様体の上の切断を、座標近傍の小さな球からトーラスの基本領域 $Q$ に移して前節の結果を使う。そのために座標を正規化する。座標近傍 $(U,y)$ が**正規化されている**とは、$\bar{B}(0,2)\subset y(U)$ であることをいう。任意の座標近傍 $(U,x)$ と $m_{0}\in U$ について、$\bar{B}(x(m_{0}),2\cdot2^{-l})\subset x(U)$ となる最小の $l\ge0$ をとって $y\defeq2^{l}(x-x(m_{0}))$ とすれば、$(U,y)$ は正規化されていて $y(m_{0})=0$ である。以下 $L_{1}\defeq\bar{B}(0,3/2)$ とし、$\bar{B}(0,2)\subset Q$（$2<\pi$）に注意する。

正規化された座標近傍 $(U,y)$ と、$U$ の上の $E$ の局所自明化 $\Phi$ を固定する。$E$ の可測な切断 $u$ で $y^{-1}(L_{1})$ の外で $0$ となるものについて、$u^{y,\Phi}$（\ref{gl:sec-ss-bundles} の記法）は $L_{1}$ の外で $0$ なので、$\breve{w}$（$w\defeq u^{y,\Phi}$）が定まる。$u$ が $L^{2}$ なら、そのフーリエ係数を
$$
\mathcal{T}_{y,\Phi}u\defeq\widehat{\breve{w}}\in\mathcal{H}^{0},\qquad w\defeq u^{y,\Phi}
$$
と書く。$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階以下の微分作用素、$\Psi$ を $U$ の上の $F$ の局所自明化、$A_{\alpha}$ を $(y,\Phi,\Psi)$ での係数とする。$\chi_{0}\in C_{c}^{\infty}(B(0,2))$ で $\bar{B}(0,7/4)$ の上で $1$ となるものを一つ固定し、$B_{\alpha}\defeq\breve{w}_{\alpha}$（$w_{\alpha}\defeq\chi_{0}A_{\alpha}$）とおいて、$\breve{P}\defeq\sum_{\alpha}B_{\alpha}D^{\alpha}$ を $P$ の**トーラスでの姿**という。主表象の定義（\ref{gl:principal-symbol}）から、$m_{0}\defeq y^{-1}(0)$ と $\xi=\sum_{j}\xi_{j}(dy_{j})_{m_{0}}$ について
$$
\Psi_{m_{0}}\,\sigma_{P}(m_{0},\xi)\,\Phi_{m_{0}}^{-1}=\sum_{|\alpha|=k}B_{\alpha}(o)(i\xi)^{\alpha}.
$$
とくに $P$ が楕円型なら、$\breve{P}$ は \ref{gl:local-elliptic-estimate} の仮定（$o$ での楕円性）を満たす。

まず、作用素と切り落としの交換子が一段低い階数であることを確かめる。

::: lemma 切り落としとの交換子 {#gl:commutator-lower-order keywords="commutator [P, psi] of a differential operator of order k with multiplication by a smooth function is of order k - 1; P(psi u) = psi P u + [P, psi] u on Sobolev sections; P(psi u) vanishes outside supp psi" index="交換子（切り落とし）|こうかんしきりおとし"}
$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階以下（$k\ge1$）の微分作用素、$\psi\in C^{\infty}(M)$ とし、$s\ge0$ を整数とする。
1. $[P,\psi]\defeq P\circ\psi-\psi\circ P$ は $k-1$ 階以下の微分作用素である（$\psi$ は $\psi$ を掛ける作用素）。
2. $u\in H^{s+k}(M;E)$ なら $\psi u\in H^{s+k}(M;E)$ で、$H^{s}(M;F)$ の元として $P(\psi u)=\psi\,Pu+[P,\psi]u$。
3. 2 の $P(\psi u)$ は $\operatorname{supp}\psi$ の外で a.e. $0$ である。
:::

::: proof
**1.** $\psi$ を掛ける作用素は $0$ 階で、主表象は $\psi(m)\,\mathrm{id}$（\ref{gl:principal-symbol-examples.1} と同じ計算）。\ref{gl:symbol-calculus.1} から $P\circ\psi$ と $\psi\circ P$ はどちらも $k$ 階以下で、$k$ 次の主表象は $\sigma_{P}(m,\xi)\psi(m)=\psi(m)\sigma_{P}(m,\xi)$。差の $k$ 次の主表象は $0$ なので、\ref{gl:principal-symbol} の後の注意から $[P,\psi]$ は $k-1$ 階以下。

**2.** $\psi$ を掛ける作用素は $0$ 階なので \ref{gl:differential-operator-sobolev.3} から $H^{s+k}(M;E)$ の上で有界。$u\mapsto P(\psi u)$、$u\mapsto\psi Pu+[P,\psi]u$ はどちらも $H^{s+k}(M;E)$ から $H^{s}(M;F)$ への有界線形写像（$[P,\psi]$ は 1 から $H^{s+k-1}\to H^{s}$ で有界）で、滑らかな切断の上では定義から一致する。滑らかな切断は稠密（\ref{gl:sobolev-sections-properties.3}）なので全体で一致する。

**3.** 滑らかな $u_{i}\to u$（$H^{s+k}$）をとると $P(\psi u_{i})\to P(\psi u)$（$H^{s}$、したがって $L^{2}$）。$\psi u_{i}$ は開集合 $M\setminus\operatorname{supp}\psi$ の上で $0$ なので、微分作用素の局所性（\ref{gl:differential-operator-manifold} の後の注意）から $P(\psi u_{i})$ もそこで $0$。$L^{2}$ 収束する列から a.e. 収束する部分列がとれるので、極限も a.e. $0$。
:::

::: lemma 小さな球のトーラスへの埋め込み {#gl:torus-transplant keywords="transplanting sections supported in a small coordinate ball into the fundamental domain of the torus: Sobolev norms are comparable, and the operator becomes its torus picture with cut-off coefficients" index="トーラスへの埋め込み（局所化）|とーらすへのうめこみきょくしょか"}
$(U,y)$ を正規化された座標近傍、$\Phi$, $\Psi$ を $U$ の上の $E$, $F$ の局所自明化（階数 $r$, $r'$）とする。
1. 整数 $j\ge0$ について正の定数 $c_{j},C_{j}$（$y$, $\Phi$, $j$ と局所化のデータで決まる）があって、$y^{-1}(L_{1})$ の外で $0$ となる $E$ の可測な切断 $u$ について、$u\in H^{j}(M;E)$ $\iff$ $\mathcal{T}_{y,\Phi}u\in\mathcal{H}^{j}$ で、そのとき $c_{j}\|u\|_{H^{j}}\le\|\mathcal{T}_{y,\Phi}u\|_{(j)}\le C_{j}\|u\|_{H^{j}}$（$j=0$ では $u\in L^{2}$ を仮定に含める）。$F$ と $\Psi$ についても同じ。
2. $P$ を $k$ 階以下の微分作用素、$\breve{P}$ をそのトーラスでの姿とする。$u\in H^{k}(M;E)$ が $y^{-1}(B(0,3/2))$ の中のコンパクト集合の外で a.e. $0$ なら、$Pu$ は $y^{-1}(L_{1})$ の外で a.e. $0$ で、$\mathcal{T}_{y,\Psi}(Pu)=\breve{P}\,\mathcal{T}_{y,\Phi}u$。
:::

::: proof
**Step 1.** 【主張：$u\in H^{j}(M;E)$ $\iff$ $u^{y,\Phi}\in H^{j}(\mathbb{R}^{n})^{r}$ で、ノルムは同値】\ref{fa:test-function-density.2} から $\varphi\in C_{c}^{\infty}(y(U))$ で $L_{1}$ の近傍で $1$ となるものをとり、$\theta\defeq y^{*}\varphi\in C^{\infty}(M)$（台は $U$ に含まれる）とすると $\theta u=u$。⇒ は \ref{gl:sobolev-sections-properties.2} の切り出し（$(\theta u)^{y,\Phi}=u^{y,\Phi}$）、⇐ は同じ所の貼り付け（$u=(y,\Phi)^{*}u^{y,\Phi}$ で、$u^{y,\Phi}$ はコンパクト集合 $L_{1}\subset y(U)$ の外で $0$）。どちらも有界な写像なので、ノルムの不等式が両向きに出る。

**Step 2.** 【主張：$L_{1}$ の外で $0$ の $w$ について、$w\in H^{j}(\mathbb{R}^{n})^{r}$ $\iff$ $\breve{w}\in H^{j}(T^{n})^{r}$ で、ノルムは同値】$T^{n}$ と座標近傍 $x_{a}$（定義域 $p(Q)$）と自明な束で Step 1 と同じ議論をする。$\breve{w}=x_{a}^{*}w$ で、$L_{1}$ は $Q=x_{a}(p(Q))$ のコンパクト集合だから、\ref{gl:sm-localization} の切り出しと貼り付けを成分ごとに使えばよい。

**Step 3.** 【主張：1】Step 1・2 と \ref{gl:torus-scale-operations.1}（$\mathcal{H}^{j}$ と $H^{j}(T^{n})^{r}$ の同一視とノルムの同値）をつなげる。

**Step 4.** 【主張：2 で、$u$ が滑らかで $y^{-1}(B(0,3/2))$ の中のコンパクト集合の外で $0$ なら、$Pu$ も同じ集合の外で $0$ で、$\mathcal{T}_{y,\Psi}(Pu)=\breve{P}\mathcal{T}_{y,\Phi}u$】$w\defeq u^{y,\Phi}\in C_{c}^{\infty}(B(0,3/2))^{r}$。$Pu$ は局所性から同じ集合の外で $0$ で、$U$ の上では定義（\ref{gl:differential-operator-manifold.2}）から $(Pu)_{\Psi}\circ y^{-1}=\sum_{\alpha}A_{\alpha}\partial^{\alpha}w$。$w$ の台の上で $\chi_{0}=1$ なので $(Pu)^{y,\Psi}=\sum_{\alpha}(\chi_{0}A_{\alpha})\partial^{\alpha}w$（$\mathbb{R}^{n}$ 全体で）。$x_{a}$ で見ると $D^{\alpha}$ は $\partial^{\alpha}$ なので、$T^{n}$ の上の滑らかな関数として $\breve{v}_{\alpha}=B_{\alpha}D^{\alpha}\breve{w}$（$v_{\alpha}\defeq(\chi_{0}A_{\alpha})\partial^{\alpha}w$）。係数をとると、\ref{gl:torus-scale-operations.3} の積の式と \ref{gl:torus-fourier-basis.3} から $\mathcal{T}_{y,\Psi}(Pu)=\sum_{\alpha}B_{\alpha}D^{\alpha}\hat{\breve{w}}=\breve{P}\mathcal{T}_{y,\Phi}u$。

**Step 5.** 【主張：2】$u$ が $y^{-1}(B(0,3/2))$ の中のコンパクト集合 $K$ の外で $0$ とする。$\psi\in C^{\infty}(M)$ を $K$ の近傍で $1$、台が $y^{-1}(B(0,3/2))$ に含まれるものとすると（$\varphi$ を座標でとって引き戻す）、$u=\psi u$ なので \ref{gl:commutator-lower-order.3} から $Pu$ は $\operatorname{supp}\psi\subset y^{-1}(L_{1})$ の外で a.e. $0$。$w\defeq u^{y,\Phi}\in H^{k}(\mathbb{R}^{n})^{r}$（Step 1）は $y(K)$ の外で $0$ なので、\ref{fa:mollification-sobolev.3}（$\Omega=B(0,3/2)$）から、十分小さい $\varepsilon$ で $w_{\varepsilon}\defeq\eta_{\varepsilon}*w\in C_{c}^{\infty}(B(0,3/2))^{r}$、$w_{\varepsilon}\to w$（$H^{k}$）。$u_{\varepsilon}\defeq(y,\Phi)^{*}w_{\varepsilon}$ は滑らかで、Step 1 から $u_{\varepsilon}\to u$（$H^{k}(M;E)$）。$Pu_{\varepsilon}\to Pu$（$L^{2}$）で、どれも $y^{-1}(L_{1})$ の外で $0$ なので、1（$j=0$）から $\mathcal{T}_{y,\Psi}(Pu_{\varepsilon})\to\mathcal{T}_{y,\Psi}(Pu)$（$\mathcal{H}^{0}$）。一方 1（$j=k$）から $\mathcal{T}_{y,\Phi}u_{\varepsilon}\to\mathcal{T}_{y,\Phi}u$（$\mathcal{H}^{k}$）で、$\breve{P}\colon\mathcal{H}^{k}\to\mathcal{H}^{0}$ は有界。Step 4 の等式の極限をとればよい。

::: hypcheck
- **正規化（$\bar{B}(0,2)\subset y(U)$）と $2<\pi$**：Step 1 で $L_{1}$ が $y(U)$ のコンパクト集合であること、Step 2 で $L_{1}$ が $Q$ のコンパクト集合であることに使った。これが「小さな球をトーラスの基本領域に埋める」ことの正当化で、台が基本領域の中のコンパクト集合に収まる限り、トーラスの周期性は何の影響も及ぼさない。
- **切り落とし $\chi_{0}$**：$A_{\alpha}$ は $y(U)$ の上でしか定義されていないので、$T^{n}$ 全体の滑らかな係数にするために使った。台の近くでは係数を変えないので、作用素の働きは変わらない（Step 4）。
- **公理**：選択は使わない。
:::
:::

::: theorem 楕円型評価（ガルディングの不等式） {#gl:elliptic-estimate refname="楕円型評価" keywords="elliptic estimate on a closed manifold: ||u||_{H^{s+k}} <= C(||P u||_{H^s} + ||u||_{H^{s+k-1}}) for an elliptic operator of order k between vector bundles; Garding inequality; fundamental elliptic estimate; proof by freezing coefficients and partition of unity" index="楕円型評価|だえんがたひょうか, ガルディングの不等式|がるでぃんぐのふとうしき, 基本楕円型評価|きほんだえんがたひょうか"}
$M$ を閉多様体、$P\colon\Gamma(M,E)\to\Gamma(M,F)$ を $k$ 階（$k\ge1$）の楕円型作用素、$s\ge0$ を整数とする。定数 $C$ があって、すべての $u\in H^{s+k}(M;E)$ について
$$
\|u\|_{H^{s+k}}\le C\bigl(\|Pu\|_{H^{s}}+\|u\|_{H^{s+k-1}}\bigr).
$$
$C$ は $P$, $s$ と、ノルムを測る局所化のデータ（と証明の中で一度だけ選ぶ有限個の座標近傍と 1 の分割）で決まり、$u$ にはよらない。
:::

::: intuition
楕円型作用素で写した結果が $s$ 回微分できるなら、元の切断は $s+k$ 回微分でき、その大きさは像の大きさと、一段だけ弱いノルムで測った元の大きさで抑えられる。作用素の階数ぶんの滑らかさは、必ず取り戻せる。
:::

::: proof
**Step 1.** 【主張：有限個の正規化された座標近傍 $(U_{l},y_{l})$ と局所自明化 $\Phi_{l}$, $\Psi_{l}$、$\delta_{l}\in(0,1]$、滑らかな 1 の分割 $(\psi_{l})_{l=1}^{N}$ があって、$\operatorname{supp}\psi_{l}\subset y_{l}^{-1}(B(0,\delta_{l}/2))$ で、$P$ のトーラスでの姿 $\breve{P}_{l}$ について $\delta_{l}$ は \ref{gl:local-elliptic-estimate.1} の条件を満たす】$M$ はコンパクトなので、$E$ と $F$ がともに自明化される座標近傍の定義域で有限個 $U_{1}',\dots,U_{N_{0}}'$ に覆え、それぞれで座標と局所自明化を一つずつ選ぶ（有限回の選択）。$m\in M$ について、$m\in U_{i}'$ となる最小の $i$ をとり、上の手順で $y(m)=0$ となる正規化された座標 $y_{m}$ を作る。$P$ は $m$ で楕円型なので、$\breve{P}$ は $o$ で楕円型で、\ref{gl:local-elliptic-estimate.1} の条件を満たす $2^{-l}$ の形の最大の $\delta_{m}$ がある。開集合 $W_{m}\defeq y_{m}^{-1}(B(0,\delta_{m}/2))$ は $m$ を含むので、コンパクト性から有限個の $W_{m_{1}},\dots,W_{m_{N}}$ で $M$ が覆える。これに従属する滑らかな 1 の分割を \ref{mfd:smooth-partition-of-unity.2} でとる（DC）。$l$ 番目のものを添字 $l$ で書く。

**Step 2.** 【主張：$u\in H^{s+k}(M;E)$ について $c_{l}\defeq\mathcal{T}_{y_{l},\Phi_{l}}(\psi_{l}u)\in\mathcal{H}^{s+k}$ は $W_{\delta_{l}/2}$（したがって $W_{\delta_{l}}$）の外で $0$ で、$\breve{P}_{l}c_{l}=\mathcal{T}_{y_{l},\Psi_{l}}(P(\psi_{l}u))$】\ref{gl:commutator-lower-order.2} から $\psi_{l}u\in H^{s+k}$ で、これはコンパクト集合 $\operatorname{supp}\psi_{l}\subset y_{l}^{-1}(B(0,\delta_{l}/2))$ の外で $0$。\ref{gl:torus-transplant.1} から $c_{l}\in\mathcal{H}^{s+k}$。$y_{l}(\operatorname{supp}\psi_{l})$ の近傍で $1$ となる $\chi_{l}\in C_{c}^{\infty}(B(0,\delta_{l}/2))$ をとると、$w_{l}\defeq(\psi_{l}u)^{y_{l},\Phi_{l}}$ について関数として $\breve{w}_{l}=\breve{\chi}_{l}\breve{w}_{l}$ なので、\ref{gl:torus-scale-operations.3} から $c_{l}=\breve{\chi}_{l}c_{l}$。等式は \ref{gl:torus-transplant.2}。

**Step 3.** 【主張：各 $l$ で $\|\psi_{l}u\|_{H^{s+k}}\le C_{l}(\|Pu\|_{H^{s}}+\|u\|_{H^{s+k-1}})$】\ref{gl:torus-transplant.1} と \ref{gl:local-elliptic-estimate.2}（$t=s$）から
$$
\|\psi_{l}u\|_{H^{s+k}}\le c_{s+k}^{-1}\|c_{l}\|_{(s+k)}\le c_{s+k}^{-1}C\bigl(\|\breve{P}_{l}c_{l}\|_{(s)}+\|c_{l}\|_{(s+k-1)}\bigr).
$$
Step 2 と \ref{gl:torus-transplant.1}（$P(\psi_{l}u)$ は $\operatorname{supp}\psi_{l}$ の外で $0$、\ref{gl:commutator-lower-order.3}）から $\|\breve{P}_{l}c_{l}\|_{(s)}\le C_{s}\|P(\psi_{l}u)\|_{H^{s}}$、$\|c_{l}\|_{(s+k-1)}\le C_{s+k-1}\|\psi_{l}u\|_{H^{s+k-1}}$。\ref{gl:commutator-lower-order.2} と \ref{gl:differential-operator-sobolev.3}（$\psi_{l}$ は $0$ 階、$[P,\psi_{l}]$ は $k-1$ 階）から
$$
\|P(\psi_{l}u)\|_{H^{s}}\le\|\psi_{l}Pu\|_{H^{s}}+\|[P,\psi_{l}]u\|_{H^{s}}\le C'\bigl(\|Pu\|_{H^{s}}+\|u\|_{H^{s+k-1}}\bigr),
$$
また $\|\psi_{l}u\|_{H^{s+k-1}}\le C''\|u\|_{H^{s+k-1}}$。これらをまとめればよい。

**Step 4.** 【主張：定理】$u=\sum_{l}\psi_{l}u$ と三角不等式から $\|u\|_{H^{s+k}}\le\sum_{l}\|\psi_{l}u\|_{H^{s+k}}$。Step 3 を足して $C\defeq\sum_{l}C_{l}$。

::: hypcheck
- **楕円性**：Step 1 で、各点 $m$ で $\breve{P}$ が $o$ で楕円型であること（\ref{gl:local-elliptic-estimate} の仮定）に使った。外すと偽：$T^{2}$ の波動作用素 $P=D_{1}^{2}-D_{2}^{2}$ では、$u_{N}=e_{(N,N)}$ が $Pu_{N}=0$ を満たし（\ref{gl:nonelliptic-examples.1}）、\ref{gl:torus-sobolev.2} から $\|u_{N}\|_{H^{s+2}}/\|u_{N}\|_{H^{s+1}}$ は $N$ 程度の速さで発散するので、どの $C$ でも評価は成り立たない。
- **$M$ がコンパクト**：Step 1 で有限個の $W_{m}$ で覆い、定数を有限個の和にするのに使った。外すと、各点の近くの評価はあっても、定数が一様にならない。
- **閉多様体（境界がない）**：各点が内点で、その周りの小さな球の中で凍結できることに使った。境界があると、境界の点では内部の球がとれず、境界条件を加えた別の評価が要る（ここでは扱わない）。
- **下の階数の項**：作用素の下の階数の部分と交換子 $[P,\psi_{l}]$ は、すべて $\|u\|_{H^{s+k-1}}$ に押し込んだ（Step 3 と、\ref{gl:local-elliptic-estimate} の証明の Step 3）。
- **公理**：Step 1 の 1 の分割で DC を使う。それ以外の選び方（各点の座標と $\delta_{m}$）は具体的に決めたので選択は要らない（有限個の $m_{l}$ を選ぶのは有限回の選択）。
:::
:::

::: supplement
**前提を変えると.** 右辺の $\|u\|_{H^{s+k-1}}$ は、$P$ の核が $0$ でなければ外せない：ラプラシアンでは定数 $u$ について $\Delta u=0$ だが $\|u\|_{H^{s+2}}\neq0$。逆に $\Delta+1$ のように核が $0$ で「下から抑えられる」作用素では外せる（\ref{gl:prob-er-resolvent-estimate}）。一般には、核が有限次元であること（\see{gl:page-weak-regularity} で示す）と組み合わせて、核の直交補空間の上で $\|u\|_{H^{s+k}}\le C\|Pu\|_{H^{s}}$ が成り立つ。非コンパクトな多様体では、評価は台が固定したコンパクト集合に含まれる切断についてだけ成り立つ（内部評価）。

**似た定理.** 狭い意味の**ガルディングの不等式**は、$2l$ 階の作用素 $P$ で主表象の実部が正定値（強楕円型）のものについて、$\operatorname{Re}\int\langle Pu,u\rangle\ge c\|u\|_{H^{l}}^{2}-C\|u\|_{L^{2}}^{2}$ が成り立つことを指し、ラックス–ミルグラムの定理（\ref{fa:lax-milgram}）と組んで弱解の存在に使われる（一般の場合はここでは証明しない）。ラプラシアンでは $\int(\Delta u)\bar{u}=\int|\nabla u|^{2}$ と \ref{gl:sm-metric-h1} からただちに出る。このページの評価は、その「正則性の側」の一般形である。ヘルダー空間 $C^{k,\alpha}$ で同じ形の評価を示すのがシャウダー評価で、これはポテンシャル論による古典的な手法で示され、偏微分方程式論の系列で関数解析的な手法と対比する。

**高い視点：虫眼鏡で見れば平ら.** 曲がった道も、虫眼鏡で十分拡大すれば直線に見える。変数係数の作用素も、十分小さな範囲だけを見れば定数係数の作用素で、そこではフーリエ係数で完全に解ける。拡大しても残る小さな歪み（係数の変化）は主要部の半分以下に抑えられるので吸収でき、歪みの微分から来る項は一段粗い目のふるい（$\|u\|_{H^{s+k-1}}$）に落ちる。あとは小さな範囲ごとの評価を 1 の分割で継ぎ合わせればよく、継ぎ目（交換子 $[P,\psi_{l}]$）も一段低い階数の雑音にしかならない。
:::

右辺の $\|u\|_{H^{s+k-1}}$ は、次の補間不等式で $\|u\|_{L^{2}}$ に替えられる。

::: lemma 補間不等式 {#gl:sobolev-interpolation keywords="interpolation inequality on closed manifolds: ||u||_{H^{a-1}} <= epsilon ||u||_{H^a} + C epsilon^{-(a-1)} ||u||_{L^2}; proof by the Fourier characterization on R^n and localization" index="補間不等式（ソボレフ空間）|ほかんふとうしきそぼれふくうかん"}
整数 $a\ge1$ について定数 $C$（$a$, $n$, $r$ と局所化のデータ、ファイバー計量で決まる）があって、すべての $0<\varepsilon\le1$ と $u\in H^{a}(M;E)$ について
$$
\|u\|_{H^{a-1}}\le\varepsilon\|u\|_{H^{a}}+C\varepsilon^{-(a-1)}\|u\|_{L^{2}}.
$$
:::

::: proof
**Step 1.** 【主張：$T\ge1$, $\eta>0$ について $T^{a-1}\le\eta T^{a}+\eta^{-(a-1)}$】$\eta T\ge1$ なら $T^{a-1}\le\eta T\cdot T^{a-1}=\eta T^{a}$。$\eta T<1$ なら $T<\eta^{-1}$ で $a-1\ge0$ なので $T^{a-1}\le\eta^{-(a-1)}$。

**Step 2.** 【主張：$w\in H^{a}(\mathbb{R}^{n})$ について $\|w\|_{H^{a-1}}\le\varepsilon\|w\|_{H^{a}}+C_{0}\varepsilon^{-(a-1)}\|w\|_{L^{2}}$（$C_{0}$ は $a$, $n$ で決まる）】\ref{fa:sobolev-fourier.2} の定数を $j=a-1,a$ について $c_{j},C_{j}$ とする。Step 1 を $T=1+|\xi|^{2}$ に使って積分し、プランシュレルの定理（\ref{four:plancherel}）を使うと
$$
c_{a-1}^{2}\|w\|_{H^{a-1}}^{2}\le\int(1+|\xi|^{2})^{a-1}|\mathcal{F}w|^{2}d\xi\le\eta\,C_{a}^{2}\|w\|_{H^{a}}^{2}+\eta^{-(a-1)}\|w\|_{L^{2}}^{2}.
$$
$\sqrt{\eta}\defeq\varepsilon c_{a-1}/C_{a}$ とし、$\sqrt{x+y}\le\sqrt{x}+\sqrt{y}$ を使えばよい（$C_{0}\defeq c_{a-1}^{-1}(C_{a}/c_{a-1})^{a-1}$）。

**Step 3.** 【主張：補題】定義のノルム $\|u\|_{a,2}$ は、局所化のデータ $(U_{j},x_{j},\Phi_{j},\rho_{j})$ の片 $(\rho_{j}u)^{x_{j},\Phi_{j}}$ の各成分の $H^{a}(\mathbb{R}^{n})$ ノルムの和である。各成分（複素数値）に Step 2 を使って足すと $\|u\|_{a-1,2}\le\varepsilon'\|u\|_{a,2}+C_{0}\varepsilon'^{-(a-1)}\|u\|_{0,2}$（$\varepsilon'>0$ は任意）。$\|\cdot\|_{H^{j}}$ と $\|\cdot\|_{j,2}$、$\|\cdot\|_{0,2}$ と $\|\cdot\|_{L^{2}}$ は同値（\ref{gl:sobolev-sections}, \ref{gl:sobolev-sections-properties.4}）なので、それらの定数を $\varepsilon'$ に繰り込めば主張の形になる。

::: hypcheck
- **$a\ge1$**：Step 1 で $a-1\ge0$ を使った。
- **公理**：選択は使わない（レリッヒの定理による背理法を避けたので、点列を選ぶ必要がない）。
:::
:::

::: corollary L² による楕円型評価 {#gl:elliptic-estimate-l2 keywords="elliptic estimate with the L^2 norm: ||u||_{H^{s+k}} <= C(||P u||_{H^s} + ||u||_{L^2})" index="楕円型評価（L2 版）|だえんがたひょうかえるつーばん"}
\ref{gl:elliptic-estimate} の状況で、定数 $C$ があって、すべての $u\in H^{s+k}(M;E)$ について $\|u\|_{H^{s+k}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$。
:::

::: proof
\ref{gl:elliptic-estimate} の定数を $C_{1}$ とし、\ref{gl:sobolev-interpolation}（$a=s+k\ge1$）で $\varepsilon\defeq\min(1,1/(2C_{1}))$ とすると
$$
\|u\|_{H^{s+k}}\le C_{1}\|Pu\|_{H^{s}}+\tfrac12\|u\|_{H^{s+k}}+C_{1}C\varepsilon^{-(s+k-1)}\|u\|_{L^{2}}.
$$
$\|u\|_{H^{s+k}}<\infty$ なので第二項を左辺に移し、$2$ 倍する。
:::

補間不等式は、レリッヒの定理（\ref{gl:rellich-manifold}）による背理法でも示せる（$\|u_{i}\|_{H^{a}}=1$、$\|u_{i}\|_{H^{a-1}}>\varepsilon+i\|u_{i}\|_{L^{2}}$ となる列をとり、$H^{a-1}$ で収束する部分列を考える）。その方法は $H^{a}\to H^{a-1}$ のコンパクト性だけを使うので一般的だが、列 $(u_{i})$ を選ぶのに可算選択を使い、定数の $\varepsilon$ への依存もわからない。上の証明はフーリエ変換で直接示したので、そのどちらも避けられる。


## 問題 {#gl:sec-er-garding-problems}

::: problem {#gl:prob-er-resolvent-estimate}
$(M,g)$ を閉リーマン多様体とし、関数に作用する $P\defeq\Delta+1$ を考える。
1. $u\in H^{2}(M)$ について $\int_{M}(\Delta u)\bar{u}\,d\mu_{g}\ge0$ を示し、$\|u\|_{L^{2}}\le\|(\Delta+1)u\|_{L^{2}}$ を導け。
2. 定数 $C$ があって、すべての $u\in H^{2}(M)$ について $\|u\|_{H^{2}}\le C\|(\Delta+1)u\|_{L^{2}}$ が成り立つことを示せ。$\Delta$ そのものについて同じ形の不等式が成り立たないことも確かめよ。
:::

::: solution
**1.** 滑らかな $u$ について、$u=a+ib$（$a,b$ は実数値）と分けると、$\Delta$ は実の係数をもつので \ref{gl:closed-manifold-laplacian.1} から
$$
\int(\Delta u)\bar{u}=\int(\Delta a)a+\int(\Delta b)b+i\Bigl(\int(\Delta b)a-\int(\Delta a)b\Bigr)=\int|\operatorname{grad}a|^{2}+\int|\operatorname{grad}b|^{2}\ge0
$$
（虚部は対称性から $0$）。両辺は $u\in H^{2}$ について連続（$\Delta\colon H^{2}\to L^{2}$ は有界、\ref{gl:differential-operator-sobolev.1}）で、滑らかな関数は稠密（\ref{gl:sobolev-manifold-density}）なので、$H^{2}$ 全体で $\int(\Delta u)\bar{u}\ge0$（実数で非負）。よって
$$
\|u\|_{L^{2}}^{2}\le\operatorname{Re}\int\bigl((\Delta+1)u\bigr)\bar{u}\,d\mu_{g}\le\|(\Delta+1)u\|_{L^{2}}\|u\|_{L^{2}},
$$
$\|u\|_{L^{2}}$ で割る（$0$ なら自明）。

**2.** $\Delta+1$ は $\Delta$ と主表象が同じなので楕円型（\ref{gl:elliptic-examples.1}）。\ref{gl:elliptic-estimate-l2}（$s=0$, $k=2$）と 1 から $\|u\|_{H^{2}}\le C(\|(\Delta+1)u\|_{L^{2}}+\|u\|_{L^{2}})\le2C\|(\Delta+1)u\|_{L^{2}}$。$\Delta$ については、定数関数 $u=1$ が $\Delta u=0$ で $\|u\|_{H^{2}}>0$ を満たすので、$\|u\|_{H^{2}}\le C\|\Delta u\|_{L^{2}}$ はどの $C$ でも成り立たない。
:::
