# 楕円性とトーラス上の評価 {#gl:page-ellipticity keywords="elliptic operators, ellipticity of the Laplace-Beltrami operator, Hodge Laplacian and d + delta, Cauchy-Riemann operator, vector fields are not elliptic, elliptic estimate for constant coefficient operators on the torus, converse, failure for the wave operator, characteristic directions, 楕円型作用素, 楕円性, 特性方向, 楕円型評価"}


前のページ \ref{gl:page-principal-symbol} では、微分作用素の最高階の部分を、余接ベクトルの多項式として座標によらずに取り出し、合成と転置での振る舞いを計算した。このページでは、主表象が $0$ でない余接ベクトルで常に可逆であるという**楕円性**を定め、ラプラシアン・ホッジのラプラシアン・$d+\delta$・コーシー–リーマン作用素が楕円型で、ベクトル場はそうでないことを示す。後半では、トーラスの上の定数係数の作用素について、楕円性がフーリエ係数による評価 $\|u\|_{H^{s+k}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$ と同値であることを示し、波動作用素では評価が崩れることを見る。これが、次のページで閉多様体の一般の楕円型作用素について評価と楕円正則性を示すときの出発点になる。

## 記法と定義の確認 {#gl:sec-el-notation}

::: notation
- $M$, $g$, $\mu_{g}$、微分作用素とその係数、複素係数と $E^{\mathbb{C}}$ の約束、多重指数の記法、余接ベクトルの成分、$T_{m}^{*}M$ の内積 $\langle\cdot,\cdot\rangle$ と $|\xi|$ は \ref{gl:sec-ps-notation} のとおり。主表象は \ref{gl:principal-symbol}（約束は $\partial_{j}\mapsto i\xi_{j}$）、その例と計算規則は \ref{gl:principal-symbol-examples}, \ref{gl:symbol-oscillation}, \ref{gl:symbol-calculus}。
- 弱解と負の階数への延長は \ref{gl:weak-solution-manifold}, \ref{gl:operator-negative-extension}、形式的転置は \ref{gl:formal-transpose}。
- $\Lambda^{k}T_{m}^{*}M$ には $T_{m}^{*}M$ の内積から決まる内積（\ref{lin:exterior-inner-product.1}）を入れる。星作用素・余微分・ホッジのラプラシアン $\Delta=d\delta+\delta d$ は \ref{riem:hodge-star}, \ref{riem:codifferential}、内部積は \ref{mfd:interior-product}, \ref{mfd:interior-product-properties}。$\xi\in T_{m}^{*}M$ について $\varepsilon_{\xi}\alpha\defeq\xi\wedge\alpha$、$\iota_{\xi}\defeq i_{\xi^{\sharp}}$（$\Lambda^{k}T_{m}^{*}M\to\Lambda^{k-1}T_{m}^{*}M$）と書く。
- トーラス $T^{n}$、$p(t)=(e^{it_{1}},\dots,e^{it_{n}})$、座標近傍 $x_{a}$、ベクトル場 $D_{j}$、$e_{m}$（$m\in\mathbb{Z}^{n}$）、フーリエ係数 $\hat{u}(m)$ は \ref{gl:sec-nt-torus} のとおり。トーラスの節では $m$ は格子点を表す。
- **選択公理**：新しい選択は使わない。局所化のデータの 1 の分割で DC を使う点は前の系列と同じで、このページではトーラス上のソボレフ・ノルムの同値性（\ref{gl:torus-sobolev}）を通してだけ現れる。格子点や試験関数はすべて具体的に選ぶ。
:::

## 楕円性 {#gl:sec-el-elliptic}

::: definition 楕円型作用素 {#gl:elliptic-operator keywords="elliptic differential operator of order k: sigma_P(m, xi) is invertible for every nonzero cotangent vector xi; characteristic directions; elliptic operators between bundles of the same rank" index="楕円型作用素|だえんがたさようそ, 楕円性|だえんせい, 特性方向|とくせいほうこう"}
$k$ 階以下の微分作用素 $P\colon\Gamma(M,E)\to\Gamma(M,F)$ が（$k$ 階の）**楕円型**であるとは、すべての $m\in M$ と $0$ でないすべての $\xi\in T_{m}^{*}M$ について $\sigma_{P}(m,\xi)\colon E_{m}^{\mathbb{C}}\to F_{m}^{\mathbb{C}}$ が線形同型であることをいう。$\sigma_{P}(m,\xi)$ が同型でない $\xi\neq0$ を $P$ の $m$ での**特性方向**という。
:::

::: intuition
楕円型とは、どの方向の高い周波数の波に対しても、作用素の最高階の部分が「見えない」ことがない（情報を失わない）ことである。
:::

$n\ge1$ なので $T_{m}^{*}M\neq0$ で、楕円型なら $E$ と $F$ の（複素の）階数は等しい。\ref{gl:symbol-calculus} から、楕円型作用素の合成は楕円型で、関数に作用する $P$ が楕円型であることと $P^{t}$, $P^{*}$ が楕円型であることは同値である（$(-1)^{k}$ 倍や複素共役は可逆性を変えない）。楕円性は計量によらない。

ホッジのラプラシアンの主表象を計算するために、外積と内部積の線形代数を準備する。

::: lemma 外積と内部積 {#gl:wedge-interior keywords="at a point, exterior multiplication by xi and interior multiplication by xi^sharp are adjoint, anticommute to |xi|^2: xi ^ i_{xi^sharp} + i_{xi^sharp} xi ^ = |xi|^2; star xi ^ star = (-1)^{n(k+1)} i_{xi^sharp} on k-forms" index="外積と内部積の反交換関係|がいせきとないぶせきのはんこうかんかんけい"}
$m\in M$, $\xi\in T_{m}^{*}M$ とする。
1. $\alpha\in\Lambda^{k-1}T_{m}^{*}M$, $\beta\in\Lambda^{k}T_{m}^{*}M$ について $\langle\varepsilon_{\xi}\alpha,\beta\rangle=\langle\alpha,\iota_{\xi}\beta\rangle$。
2. $\Lambda^{k}T_{m}^{*}M$（$k\ge0$）の上で $\varepsilon_{\xi}\iota_{\xi}+\iota_{\xi}\varepsilon_{\xi}=|\xi|^{2}\,\mathrm{id}$、また $\varepsilon_{\xi}\varepsilon_{\xi}=0$, $\iota_{\xi}\iota_{\xi}=0$。
3. $T_{m}M$ に向きが与えられていれば、$\beta\in\Lambda^{k}T_{m}^{*}M$（$k\ge1$）について $\star(\xi\wedge\star\beta)=(-1)^{n(k+1)}\iota_{\xi}\beta$。
:::

::: proof
\ref{mfd:interior-product-properties} の 2・3 は、各点での等式である：$(i_{X}\omega)_{m}$ は $X_{m}$ と $\omega_{m}$ だけで決まり（\ref{mfd:interior-product}）、$T_{m}M$ や $\Lambda^{k}T_{m}^{*}M$ の任意の元は、座標で定数の成分に切り落としを掛けたベクトル場・形式の $m$ での値になるからである。以下これを点 $m$ で使う。

**Step 1.** 【主張：2】$\beta\in\Lambda^{k}T_{m}^{*}M$ について、反微分性（\ref{mfd:interior-product-properties.2}、$\xi$ は $1$ 次）から $\iota_{\xi}(\xi\wedge\beta)=(\iota_{\xi}\xi)\beta-\xi\wedge\iota_{\xi}\beta$。$\iota_{\xi}\xi=\xi(\xi^{\sharp})=|\xi|^{2}$ なので $\iota_{\xi}\varepsilon_{\xi}\beta+\varepsilon_{\xi}\iota_{\xi}\beta=|\xi|^{2}\beta$。$\xi\wedge\xi=0$ から $\varepsilon_{\xi}\varepsilon_{\xi}=0$、\ref{mfd:interior-product-properties.3} から $\iota_{\xi}\iota_{\xi}=0$。

**Step 2.** 【主張：1】$T_{m}M$ の正規直交基底 $(e_{i})$ をとり、$\theta^{i}\defeq e_{i}^{\flat}$ とおくと、$(\theta^{i})$ は $(e_{i})$ の双対基底で、$T_{m}^{*}M$ の正規直交基底である（$\langle\theta^{i},\theta^{j}\rangle=g(e_{i},e_{j})$）。$\xi=\sum_{j}\xi_{j}\theta^{j}$ なら $\xi^{\sharp}=\sum_{j}\xi_{j}e_{j}$。両辺は $(\xi,\alpha,\beta)$ について多重線形なので、$\xi=\theta^{j}$、$\alpha=\theta^{J}$、$\beta=\theta^{I}$（$J$, $I$ は増加列、\ref{lin:exterior-inner-product.1} から $\{\theta^{I}\}$ は正規直交基底）で確かめればよい。左辺：$j\in J$ なら $\theta^{j}\wedge\theta^{J}=0$。$j\notin J$ なら $\theta^{j}$ を $J$ の $j$ より小さい $c\defeq\#\{i\in J:i<j\}$ 個の後ろへ動かして $\theta^{j}\wedge\theta^{J}=(-1)^{c}\theta^{J\cup\{j\}}$。よって左辺は、$I=J\cup\{j\}$（$j\notin J$）のとき $(-1)^{c}$、それ以外は $0$。右辺：反微分性を繰り返すと $\iota_{e_{j}}(\theta^{i_{1}}\wedge\cdots\wedge\theta^{i_{k}})=\sum_{l}(-1)^{l-1}\theta^{i_{l}}(e_{j})\,\theta^{I\setminus\{i_{l}\}}$ で、これは $j=i_{l}\in I$ のとき $(-1)^{l-1}\theta^{I\setminus\{j\}}$、$j\notin I$ のとき $0$。$l-1=\#\{i\in I:i<j\}$ は、$I=J\cup\{j\}$ なら $c$ に等しい。よって右辺も、$I=J\cup\{j\}$（$j\notin J$）のとき $(-1)^{c}$、それ以外は $0$。

**Step 3.** 【主張：3】$\alpha\in\Lambda^{k-1}T_{m}^{*}M$ を任意にとる。$\gamma\defeq\star(\xi\wedge\star\beta)\in\Lambda^{k-1}$ について、\ref{riem:hodge-star-properties.2} の $\alpha\wedge\star\gamma=\langle\alpha,\gamma\rangle\mathrm{vol}_{g}$ と、$\Lambda^{n-k+1}$ の上の $\star\star=(-1)^{(n-k+1)(k-1)}$ から
$$
\begin{aligned}
\langle\alpha,\gamma\rangle\mathrm{vol}_{g}&=(-1)^{(n-k+1)(k-1)}\,\alpha\wedge\xi\wedge\star\beta\\
&=(-1)^{(n-k+1)(k-1)+(k-1)}\,\xi\wedge\alpha\wedge\star\beta\\
&=(-1)^{(n-k+2)(k-1)}\langle\xi\wedge\alpha,\beta\rangle\mathrm{vol}_{g}.
\end{aligned}
$$
（$\alpha\wedge\xi=(-1)^{k-1}\xi\wedge\alpha$ を使った。）1 から右辺は $(-1)^{(n-k+2)(k-1)}\langle\alpha,\iota_{\xi}\beta\rangle\mathrm{vol}_{g}$。$\alpha$ は任意なので $\gamma=(-1)^{(n-k+2)(k-1)}\iota_{\xi}\beta$。2 を法として $(n-k+2)(k-1)=nk-n-k^{2}+3k-2\equiv nk+n+k(k+1)\equiv n(k+1)$（$k(k+1)$ は偶数）。
:::

::: proposition ホッジのラプラシアンと d+δ の主表象 {#gl:hodge-laplacian-symbol keywords="sigma_d = i xi ^, sigma_delta = - i i_{xi^sharp}, sigma of the Hodge Laplacian is |xi|^2 id, sigma_{d + delta} = i(xi ^ - i_{xi^sharp}) squares to |xi|^2; the Hodge Laplacian, d + delta and the Laplace-Beltrami operator are elliptic" index="ホッジのラプラシアンの主表象|ほっじのらぷらしあんのしゅひょうしょう, d+δ の楕円性|でぃーぷらすでるたのだえんせい"}
$(M,g)$ を向きづけられた閉リーマン多様体とし、$\Lambda^{\bullet}\defeq\bigoplus_{k=0}^{n}\Lambda^{k}T^{*}M$ とする。$m\in M$, $\xi\in T_{m}^{*}M$ について次が成り立つ（$d$, $\delta$ は $1$ 次、$\Delta$ は $2$ 次の主表象）。
1. $\sigma_{d}(m,\xi)=i\varepsilon_{\xi}$、$\sigma_{\delta}(m,\xi)=-i\iota_{\xi}$。
2. 各 $\Lambda^{k}T^{*}M$ の上で $\sigma_{\Delta}(m,\xi)=|\xi|^{2}\,\mathrm{id}$。とくに関数の上（ラプラス–ベルトラミ作用素）では $\sigma_{\Delta}(m,\xi)=|\xi|^{2}$。
3. $d+\delta\colon\Gamma(M,\Lambda^{\bullet})\to\Gamma(M,\Lambda^{\bullet})$ について $\sigma_{d+\delta}(m,\xi)=i(\varepsilon_{\xi}-\iota_{\xi})$ で、$\sigma_{d+\delta}(m,\xi)^{2}=|\xi|^{2}\,\mathrm{id}$。
4. したがって $\Delta$（各次数で）と $d+\delta$ は楕円型である。
:::

::: intuition
ホッジのラプラシアンの最高階の部分は、どの次数の形式に対しても「$|\xi|^{2}$ を掛ける」だけで、関数のラプラシアンと同じである。$d+\delta$ はその平方根で、主表象を二乗すると $|\xi|^{2}$ になる。
:::

::: proof
**Step 1.** 【主張：$\sigma_{d}(m,\xi)=i\varepsilon_{\xi}$】\ref{gl:principal-symbol-examples.4} で示した。\ref{gl:symbol-oscillation} からも、外微分のライプニッツ則で $d(e^{it\varphi}\alpha)=e^{it\varphi}(it\,d\varphi\wedge\alpha+d\alpha)$ なので、$t$ の係数は $i\,d\varphi\wedge\alpha$。

**Step 2.** 【主張：$\sigma_{\delta}(m,\xi)=-i\iota_{\xi}$】$k\ge1$ について $\Omega^{k}$ の上で $\delta=c_{k}\star d\star$、$c_{k}\defeq(-1)^{n(k+1)+1}$（\ref{riem:codifferential}）。$\star$ は $C^{\infty}(M)$ 線形（\ref{riem:hodge-star-properties.1}）なので、複素線形に延ばせば $e^{it\varphi}$ と交換し、Step 1 の式から
$$
\delta(e^{it\varphi}\beta)=c_{k}\star d(e^{it\varphi}\star\beta)=e^{it\varphi}\bigl(it\,c_{k}\star(d\varphi\wedge\star\beta)+\delta\beta\bigr).
$$
\ref{gl:symbol-oscillation} から $\sigma_{\delta}(m,\xi)\beta=i\,c_{k}\star(\xi\wedge\star\beta)$ で、\ref{gl:wedge-interior.3} から $i\,c_{k}(-1)^{n(k+1)}\iota_{\xi}\beta=-i\iota_{\xi}\beta$。$k=0$ では $\delta=0$, $\iota_{\xi}=0$ で一致する。

**Step 3.** 【主張：2】$\Delta=d\delta+\delta d$ は $1$ 階の作用素の合成の和なので、\ref{gl:symbol-calculus.1} から、$\Lambda^{k}$ の上で
$$
\sigma_{\Delta}=\sigma_{d}\sigma_{\delta}+\sigma_{\delta}\sigma_{d}=(i\varepsilon_{\xi})(-i\iota_{\xi})+(-i\iota_{\xi})(i\varepsilon_{\xi})=\varepsilon_{\xi}\iota_{\xi}+\iota_{\xi}\varepsilon_{\xi}.
$$
\ref{gl:wedge-interior.2} からこれは $|\xi|^{2}\mathrm{id}$。関数（$k=0$）では $\varepsilon_{\xi}\iota_{\xi}=0$ で、$\iota_{\xi}(\xi f)=|\xi|^{2}f$。これは \ref{gl:principal-symbol-examples.3} の座標での計算と一致する。

**Step 4.** 【主張：3】1 から $\sigma_{d+\delta}=i(\varepsilon_{\xi}-\iota_{\xi})$。二乗すると、\ref{gl:wedge-interior.2} の $\varepsilon_{\xi}^{2}=\iota_{\xi}^{2}=0$ から
$$
\sigma_{d+\delta}^{2}=-(\varepsilon_{\xi}-\iota_{\xi})^{2}=-\varepsilon_{\xi}^{2}+\varepsilon_{\xi}\iota_{\xi}+\iota_{\xi}\varepsilon_{\xi}-\iota_{\xi}^{2}=|\xi|^{2}\,\mathrm{id}.
$$

**Step 5.** 【主張：4】$\xi\neq0$ なら $|\xi|^{2}>0$（計量は正定値）なので、$\sigma_{\Delta}(m,\xi)=|\xi|^{2}\mathrm{id}$ は可逆で、$\sigma_{d+\delta}(m,\xi)$ は $|\xi|^{-2}\sigma_{d+\delta}(m,\xi)$ を逆にもつ。

::: hypcheck
- **計量が正定値**：Step 5 で $|\xi|^{2}>0$ に使った。符号の入った計量（ローレンツ計量）では同じ形の作用素の主表象 $\sum g^{ij}\xi_{i}\xi_{j}$ は $0$ でない $\xi$ で $0$ になりうる（波動作用素、\ref{gl:nonelliptic-examples.1}）。
- **向き**：$\star$ と $\delta$ の定義に使った（\ref{riem:codifferential}）。$\delta=c_{k}\star d\star$ は $\star$ を二回含むので、向きを逆にしても変わらず、向きのない多様体でも局所的に同じ式で定まる。主表象の計算は各点の近くだけで行うので、結論は向きによらない。
- **閉多様体であること**：使わなかった。主表象と楕円性は局所的な概念である。
- **公理**：選択は使わない。
:::
:::

::: supplement
**前提を変えると.** $d$ だけ、$\delta$ だけでは楕円型にならない：$\sigma_{d}(m,\xi)=i\varepsilon_{\xi}$ は $\xi\wedge\xi=0$ から $\xi$ 自身を消すので単射でなく（$\Lambda^{k}\to\Lambda^{k+1}$ は階数も一般に違う）、二つを足して初めて可逆になる。$d+\delta$ を偶数次から奇数次への部分 $\Lambda^{\mathrm{even}}\to\Lambda^{\mathrm{odd}}$ に制限しても楕円型である（両者の階数は $2^{n-1}$ で等しく、主表象は $\sigma_{d+\delta}$ の制限で、その二乗が $|\xi|^{2}$）。

**似た定理.** 主表象の二乗が $|\xi|^{2}$ になる 1 階の作用素を一般に**ディラック型作用素**といい、$d+\delta$ はその基本例である。等式 $\sigma^{2}=|\xi|^{2}$ は、余接ベクトルがクリフォード代数の関係式 $c(\xi)^{2}=-|\xi|^{2}$（約束により符号が変わる）を満たすように働くことを表す。偶数次から奇数次への $d+\delta$ について、核の次元から余核の次元を引いた指数はオイラー標数 $\chi(M)$ に等しいことが、ホッジの定理（\see{riem:hodge-theorem}）から従う。これは、楕円型作用素の指数を位相不変量で表すアティヤ–シンガーの指数定理の最も簡単な例として知られている（ここでは証明しない）。

**高い視点：生成と消滅.** $\varepsilon_{\xi}$ は形式に $\xi$ の方向を一本「足し」、$\iota_{\xi}$ は $\xi$ の方向を一本「抜く」。同じ方向を二度足すことも二度抜くこともできない（$\varepsilon_{\xi}^{2}=\iota_{\xi}^{2}=0$）。一つの形式について「足してから抜く」と「抜いてから足す」の一方だけが生き残り、合わせるとちょうど元の形式の $|\xi|^{2}$ 倍に戻る。これはフェルミ粒子の生成・消滅作用素の反交換関係と同じ形で、この「戻り」があるおかげで、ホッジのラプラシアンはどの次数でも関数のラプラシアンと同じ最高階の部分をもつ。
:::

::: example 楕円型の作用素とそうでない作用素 {#gl:elliptic-examples keywords="second order operators with positive definite leading part are elliptic; real vector fields are not elliptic when n >= 2; a nowhere vanishing vector field on S^1 is elliptic; the Cauchy-Riemann operator dbar on a Riemann surface is elliptic with symbol i xi^{0,1}" index="楕円型作用素の例|だえんがたさようそのれい, コーシー–リーマン作用素|こーしーりーまんさようそ"}
1. **正定値の 2 階作用素.** 座標近傍ごとに $P=-\sum_{i,j}a^{ij}\partial_{i}\partial_{j}+(\text{1 階以下})$ で $(a^{ij})$ が実対称な正定値行列なら、$\sigma_{P}(m,\xi)=\sum a^{ij}\xi_{i}\xi_{j}>0$（$\xi\neq0$）で $P$ は楕円型。$a^{ij}=g^{ij}$ がラプラシアンである。
2. **ベクトル場.** 実のベクトル場 $X$ について $\sigma_{X}(m,\xi)=i\,\xi(X_{m})$（\ref{gl:principal-symbol-examples.2}）。$n\ge2$ なら、$\xi\mapsto\xi(X_{m})$ は $n$ 次元の $T_{m}^{*}M$ から $\mathbb{R}$ への線形写像で核は $n-1\ge1$ 次元なので、$\xi(X_{m})=0$ となる $\xi\neq0$ があり、$X$ は楕円型でない。$n=1$ では、$X$ が楕円型 $\iff$ $X$ がどこでも $0$ でない（例：$S^{1}$ の上の $\frac{d}{dt}$）。
3. **コーシー–リーマン作用素.** $M$ を $1$ 次元の複素多様体（\ref{symp:complex-manifold}。実 $2$ 次元のリーマン面）とする。正則な座標 $z=x+iy$ で $dz\defeq dx+i\,dy$, $d\bar{z}\defeq dx-i\,dy$ とおき、$\partial_{\bar{z}}$ を \ref{cx:wirtinger} のヴィルティンガー微分とすると、$du=\partial_{z}u\,dz+\partial_{\bar{z}}u\,d\bar{z}$（右辺を展開すると $u_{x}dx+u_{y}dy$）。正則な座標変換 $z=h(w)$ では、コーシー–リーマンの方程式（\ref{cx:cauchy-riemann}）から $dz=h'(w)\,dw$, $d\bar{z}=\overline{h'(w)}\,d\bar{w}$（$h'\neq0$）なので、$d\bar{z}$ の張る複素直線 $\Lambda_{m}^{0,1}\subset T_{m}^{*}M\otimes\mathbb{C}$ と $dz$ の張る直線は座標によらない。それらは $T_{m}^{*}M\otimes\mathbb{C}$ の直和分解を与え、$\Lambda^{0,1}$ は $c\,d\bar{z}\mapsto c$ を局所自明化とする複素直線束（推移関数 $\overline{h'}$ は滑らか）である。$\bar{\partial}u\defeq\partial_{\bar{z}}u\,d\bar{z}$（$du$ の $\Lambda^{0,1}$ 成分）は座標によらない $1$ 階の作用素 $C^{\infty}(M)\to\Gamma(M,\Lambda^{0,1})$ で、$\partial_{x}$, $\partial_{y}$ の係数は $\frac12$, $\frac{i}{2}$。よって $\xi=\xi_{1}dx+\xi_{2}dy$ について
$$
\sigma_{\bar{\partial}}(m,\xi)c=\frac{i}{2}(\xi_{1}+i\xi_{2})\,c\,d\bar{z}=i\,c\,\xi^{0,1}
$$
（$\xi^{0,1}\defeq\frac12(\xi_{1}+i\xi_{2})d\bar{z}$ は $\xi$ の $\Lambda^{0,1}$ 成分）。実の $\xi\neq0$ では $\xi_{1}+i\xi_{2}\neq0$ なので、$\bar{\partial}$ は楕円型である。$u=a+ib$ を実の組 $(a,b)$ とみると、$\bar{\partial}u=0$ は \ref{cx:cauchy-riemann} の方程式そのもので、実の $2\times2$ 行列の主表象 $\frac{i}{2}\begin{pmatrix}\xi_{1}&-\xi_{2}\\ \xi_{2}&\xi_{1}\end{pmatrix}$ の行列式は $-\frac14(\xi_{1}^{2}+\xi_{2}^{2})\neq0$。
:::

2 と 3 を比べると、$n=2$ では実のベクトル場一本は楕円型でないが、二本の独立なベクトル場を複素係数で組み合わせた $\partial_{\bar{z}}=\frac12(\partial_{x}+i\partial_{y})$ は楕円型になる（\ref{gl:prob-el-first-order-scalar}）。複素次元が $2$ 以上の複素多様体では、関数に $\bar{\partial}$ を施す作用素は階数 $1$ の束から階数 $n/2$ の束への作用素なので楕円型でない。

## トーラス上の定数係数の楕円型作用素 {#gl:sec-el-torus}

この節では $T^{n}$ の上の定数係数の作用素
$$
P=\sum_{|\alpha|\le k}A_{\alpha}D^{\alpha},\qquad A_{\alpha}\in\mathbb{C}^{r\times r}\ (\text{定数}),\quad D^{\alpha}=D_{1}^{\alpha_{1}}\cdots D_{n}^{\alpha_{n}}
$$
を、$\mathbb{C}^{r}$ 値の関数 $u=(u_{1},\dots,u_{r})$ に成分ごとに作用させる（自明な束 $T^{n}\times\mathbb{C}^{r}$ の上の作用素）。$H^{s}(T^{n})^{r}$ には $\|u\|_{H^{s}}^{2}\defeq\sum_{c}\|u_{c}\|_{H^{s}}^{2}$、$L^{2}$ には $\|u\|_{L^{2}}^{2}\defeq\sum_{c}\|u_{c}\|_{L^{2}}^{2}$ を入れ、$\hat{u}(m)\defeq(\hat{u}_{c}(m))_{c}\in\mathbb{C}^{r}$、$|\cdot|$ は $\mathbb{C}^{r}$ の標準のノルムとする。座標近傍 $x_{a}$ で $D_{j}=\partial/\partial t_{j}$ なので、$P$ の係数は $A_{\alpha}$ そのもので、主表象は点によらず、$\xi=\sum_{j}\xi_{j}dt_{j}$ について
$$
\sigma_{P}(\xi)=\sum_{|\alpha|=k}A_{\alpha}(i\xi)^{\alpha}.
$$
$\xi\in\mathbb{R}^{n}$ の多項式 $\mathsf{p}(\xi)\defeq\sum_{|\alpha|\le k}A_{\alpha}(i\xi)^{\alpha}$ を $P$ の**全表象**と呼ぶ。

::: theorem トーラス上の楕円型評価 {#gl:torus-elliptic-estimate keywords="for a constant coefficient elliptic operator of order k on the torus, ||u||_{H^{s+k}} <= C(||Pu||_{H^s} + ||u||_{L^2}); proof by Fourier coefficients; weak solutions of Pu = f with f in H^s lie in H^{s+k}" index="楕円型評価（トーラス）|だえんがたひょうかとーらす, 楕円型作用素の先験的評価|だえんがたさようそのせんけんてきひょうか"}
$P$ を上の形の定数係数の作用素で、楕円型（すべての $\xi\in\mathbb{R}^{n}\setminus\{0\}$ で $\sigma_{P}(\xi)$ が可逆）とし、$s\ge0$ を整数とする。
1. 定数 $C$ があって、すべての $u\in H^{s+k}(T^{n})^{r}$ について
$$
\|u\|_{H^{s+k}}\le C\bigl(\|Pu\|_{H^{s}}+\|u\|_{L^{2}}\bigr).
$$
2. $r=1$ とする。$u\in L^{2}(T^{n})$ が $Pu=f$ の弱解（\ref{gl:weak-solution-manifold}）で $f\in H^{s}(T^{n})$ なら、$u\in H^{s+k}(T^{n})$ で、$L^{2}$ の元として $Pu=f$。
:::

::: intuition
トーラスの上の定数係数の楕円型作用素では、$Pu$ が $s$ 回微分できて $u$ が二乗可積分なら、$u$ は $s+k$ 回微分でき、そのノルムは $Pu$ と $u$ のノルムで抑えられる。作用素の階数ぶん、滑らかさが必ず取り戻せる。
:::

::: proof
$W(m)\defeq1+|m|^{2}$ とおく。\ref{gl:torus-sobolev.2} を成分ごとに使うと、整数 $j\ge0$ ごとに正の定数 $c_{j},C_{j}$ があって、$u\in H^{j}(T^{n})^{r}$ について
$$
c_{j}\|u\|_{H^{j}}^{2}\le\sum_{m}W(m)^{j}|\hat{u}(m)|^{2}\le C_{j}\|u\|_{H^{j}}^{2},
$$
またパーセヴァルの等式（\ref{gl:torus-fourier-basis.2}）から $\|u\|_{L^{2}}^{2}=(2\pi)^{n}\sum_{m}|\hat{u}(m)|^{2}$。

**Step 1.** 【主張：$c>0$ があって、すべての $\xi\in\mathbb{R}^{n}$, $v\in\mathbb{C}^{r}$ について $|\sigma_{P}(\xi)v|\ge c|\xi|^{k}|v|$】$(\xi,v)\mapsto|\sigma_{P}(\xi)v|$ は連続で、コンパクト集合 $\{|\xi|=1\}\times\{|v|=1\}$ の上で正（楕円性から $\sigma_{P}(\xi)$ は単射）なので、正の最小値 $c$ をとる。$\xi\neq0$, $v\neq0$ なら、斉次性 $\sigma_{P}(\xi)=|\xi|^{k}\sigma_{P}(\xi/|\xi|)$ と線形性から $|\sigma_{P}(\xi)v|=|\xi|^{k}|v|\,|\sigma_{P}(\xi/|\xi|)(v/|v|)|\ge c|\xi|^{k}|v|$。$v=0$ では両辺が $0$。$\xi=0$ では、$k\ge1$ なら右辺が $0$、$k=0$ なら $\sigma_{P}(\xi)=A_{0}$ は $\xi$ によらないので単位ベクトルの場合に帰着する。

**Step 2.** 【主張：$R\ge1$ があって、$|\xi|\ge R$ なら $|\mathsf{p}(\xi)v|\ge\frac{c}{2}|\xi|^{k}|v|$】$B\defeq\sum_{|\alpha|<k}\|A_{\alpha}\|$（作用素ノルム）とする。$|\xi^{\alpha}|\le|\xi|^{|\alpha|}$ なので、$|\xi|\ge1$ では $|(\mathsf{p}(\xi)-\sigma_{P}(\xi))v|\le B|\xi|^{k-1}|v|$。$R\defeq\max(1,2B/c)$ とすると、$|\xi|\ge R$ で $B|\xi|^{k-1}\le\frac{c}{2}|\xi|^{k}$ なので、Step 1 と三角不等式から主張が出る。

**Step 3.** 【主張：$u\in H^{s+k}(T^{n})^{r}$ なら $\widehat{Pu}(m)=\mathsf{p}(m)\hat{u}(m)$】$|\alpha|\le k\le s+k$ なので \ref{gl:torus-sobolev.2} から $\widehat{D^{\alpha}u_{c}}(m)=(im)^{\alpha}\hat{u}_{c}(m)$。$(Pu)_{a}=\sum_{\alpha}\sum_{c}(A_{\alpha})_{ac}D^{\alpha}u_{c}$ とフーリエ係数の線形性から。

**Step 4.** 【主張：1】$|m|\ge R$ の項では、Step 2・3 と $W(m)\le2|m|^{2}$（$|m|\ge1$）から
$$
W(m)^{s+k}|\hat{u}(m)|^{2}\le W(m)^{s}\,\frac{2^{k}|m|^{2k}\cdot4}{c^{2}|m|^{2k}}\,|\widehat{Pu}(m)|^{2}=\frac{2^{k+2}}{c^{2}}W(m)^{s}|\widehat{Pu}(m)|^{2}.
$$
$|m|<R$ の項では $W(m)^{s+k}|\hat{u}(m)|^{2}\le(1+R^{2})^{s+k}|\hat{u}(m)|^{2}$。足し合わせて冒頭の不等式を使うと
$$
c_{s+k}\|u\|_{H^{s+k}}^{2}\le\frac{2^{k+2}C_{s}}{c^{2}}\|Pu\|_{H^{s}}^{2}+\frac{(1+R^{2})^{s+k}}{(2\pi)^{n}}\|u\|_{L^{2}}^{2}.
$$
$\sqrt{a+b}\le\sqrt{a}+\sqrt{b}$ から 1 が出る。

**Step 5.** 【主張：2】$P^{t}$ を求める。$(T^{n},x_{a})$ では $\gamma_{x_{a}}=1$ で係数は定数なので、\ref{gl:formal-transpose.2} から $P^{t}=\sum_{\alpha}(-1)^{|\alpha|}a_{\alpha}D^{\alpha}$。$D_{j}e_{-m}=-im_{j}e_{-m}$ から $P^{t}e_{-m}=\sum_{\alpha}(-1)^{|\alpha|}a_{\alpha}(-im)^{\alpha}e_{-m}=\mathsf{p}(m)e_{-m}$。弱解の定義を $v=e_{-m}$ に使うと、$\int ue_{-m}\,d\mu_{g}=(2\pi)^{n}\hat{u}(m)$ などから $\mathsf{p}(m)\hat{u}(m)=\hat{f}(m)$。Step 2 から $|m|\ge R$ で $|\hat{u}(m)|\le\frac{2}{c}|m|^{-k}|\hat{f}(m)|$ なので、Step 4 と同じ計算で $\sum_{m}W(m)^{s+k}|\hat{u}(m)|^{2}<\infty$（$|m|<R$ は有限個）。\ref{gl:torus-sobolev.1} から $u\in H^{s+k}$。Step 3 から $\widehat{Pu}=\mathsf{p}\hat{u}=\hat{f}$ で、\ref{gl:torus-fourier-basis.1} から $Pu=f$。

::: hypcheck
- **楕円性**：Step 1 で $c>0$ を得るのに使った。外すと 1 も 2 も偽（\ref{gl:nonelliptic-examples}、\ref{gl:prob-el-wave-weak-solution}）。
- **$\|u\|_{L^{2}}$ の項**：有限個の低い周波数 $|m|<R$ を抑えるのに使った（Step 4）。外すと偽：$P=\Delta$（$T^{n}$）では $u=1$ について $Pu=0$ だが $\|u\|_{H^{s+2}}\neq0$。全表象が $0$ になる格子点（$\Delta$ の $m=0$、$T^{1}$ の上の $\Delta-1$ の $m=\pm1$）があれば、そこは $Pu$ から見えない。
- **定数係数とトーラス**：フーリエ係数が作用素を対角化すること（Step 3）に使った。一般の閉多様体と変数係数への拡張は次のページの主題である。
- **公理**：選択は使わない（$R$ や $c$ は具体的に決まる）。
:::
:::

::: supplement
**前提を変えると.** 楕円型でない作用素でも、評価が別の形で残ることがある。$T^{2}$ の上の熱作用素 $P=D_{1}-D_{2}^{2}$（$t_{1}$ が時間）は、$2$ 次の主表象 $-(i\xi_{2})^{2}=\xi_{2}^{2}$ が $\xi=(1,0)$ で $0$ になるので（$2$ 階の作用素として）楕円型でない。実際 $u=e_{(N,0)}$ では $\|Pu\|_{H^{s}}$ は $N^{s+1}$ 程度、$\|u\|_{H^{s+2}}$ は $N^{s+2}$ 程度で、1 は成り立たない。しかし全表象 $\mathsf{p}(m)=im_{1}+m_{2}^{2}$ は $|\mathsf{p}(m)|^{2}=m_{1}^{2}+m_{2}^{4}\ge|m|^{2}$ を満たすので、Step 4 と同じ計算で $\|u\|_{H^{s+1}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$ が成り立ち、滑らかさを $1$ 段だけ取り戻せる。このように、楕円性より弱い条件で正則性が成り立つ作用素は**準楕円型**と呼ばれる。

**似た定理.** $\mathbb{R}^{n}$ の上でも、\ref{fa:sobolev-fourier} を使って同じ評価がフーリエ変換で示せる。違いは周波数が連続で、低い周波数が有限個でないことで、$\|u\|_{L^{2}}$ の項は $|\xi|<R$ の部分をまとめて抑える役をする。次のページでは、変数係数の作用素の係数を各点で「凍結」してこの定数係数の評価を当てはめ、凍結の誤差を小さな近傍と下の階数の項で吸収し、1 の分割で閉多様体全体に貼り合わせる。こうして、閉多様体の上の任意の楕円型作用素について同じ形の評価（ガルディングの不等式に当たるもの）と、2 に当たる楕円正則性が示される。このページの定理はその出発点である。

**高い視点：死角のないカメラ.** フーリエ係数は関数を周波数ごとの成分に分け、定数係数の作用素は各周波数 $m$ に行列 $\mathsf{p}(m)$ を掛けるだけになる。楕円性は、高い周波数のどの方向から写しても、像が $|m|^{k}$ の割合で拡大されて写る、死角のないカメラであることを意味する。だから写った像（$Pu$）から元の被写体（$u$）の高い周波数成分を復元でき、写りの悪い低い周波数の有限個の成分だけを別に（$\|u\|_{L^{2}}$ で）補えばよい。楕円型でないと、特性方向という死角があり、その方向の高い周波数成分は写真に写らない（次の節）。
:::

## 楕円でないと評価が崩れる {#gl:sec-el-nonelliptic}

::: example 楕円型でない作用素での評価の破れ {#gl:nonelliptic-examples keywords="the wave operator D_1^2 - D_2^2 on T^2 and the vector field D_1 on T^2 violate the elliptic estimate along characteristic directions: P e_{(N,N)} = 0" index="波動作用素（トーラス）|はどうさようそとーらす, 楕円型評価の破れ|だえんがたひょうかのやぶれ"}
1. **波動作用素.** $T^{2}$ の上の $P\defeq D_{1}^{2}-D_{2}^{2}$（$t_{1}$ を時間、$t_{2}$ を空間とみる）の主表象は $\sigma_{P}(\xi)=(i\xi_{1})^{2}-(i\xi_{2})^{2}=-\xi_{1}^{2}+\xi_{2}^{2}$ で、$\xi=(1,\pm1)$ が特性方向である。$u_{N}\defeq e_{(N,N)}$ とすると $D_{j}^{2}u_{N}=-N^{2}u_{N}$ から $Pu_{N}=0$。一方 $\|u_{N}\|_{L^{2}}^{2}=(2\pi)^{2}$ で、\ref{gl:torus-sobolev.2} から（その定数を $C_{s+2}$ として）$\|u_{N}\|_{H^{s+2}}^{2}\ge C_{s+2}^{-1}(1+2N^{2})^{s+2}\to\infty$。よって、どの $s$, $C$ についても $\|u\|_{H^{s+2}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$ は成り立たない。$\{e_{(N,N)}\}_{N}$ はどれも $P$ の核に入るので、核は無限次元である。
2. **ベクトル場.** $T^{2}$ の上の $X\defeq D_{1}$ は $\sigma_{X}(\xi)=i\xi_{1}$ で、$\xi=(0,1)$ が特性方向である（\ref{gl:elliptic-examples.2}）。$u_{N}\defeq e_{(0,N)}$ について $Xu_{N}=0$、$\|u_{N}\|_{L^{2}}^{2}=(2\pi)^{2}$、$\|u_{N}\|_{H^{s+1}}\to\infty$ なので、$\|u\|_{H^{s+1}}\le C(\|Xu\|_{H^{s}}+\|u\|_{L^{2}})$ は成り立たない。
:::

どちらの例でも、評価を破る関数の周波数 $(N,N)$, $(0,N)$ は特性方向を向いている。定数係数の作用素では、これは偶然ではない。

::: proposition 評価は楕円性を導く {#gl:torus-estimate-converse keywords="converse on the torus: if a constant coefficient operator satisfies ||u||_{H^{s+k}} <= C(||Pu||_{H^s} + ||u||_{L^2}) for smooth u, then it is elliptic; proof by lattice points approximating a characteristic direction" index="楕円型評価の逆|だえんがたひょうかのぎゃく"}
$T^{n}$ の上の定数係数の作用素 $P=\sum_{|\alpha|\le k}A_{\alpha}D^{\alpha}$ と整数 $s\ge0$、定数 $C$ について、すべての $u\in C^{\infty}(T^{n})^{r}$ で $\|u\|_{H^{s+k}}\le C(\|Pu\|_{H^{s}}+\|u\|_{L^{2}})$ が成り立てば、$P$ は楕円型である。
:::

::: proof
楕円型でないとして矛盾を導く。$\omega\in\mathbb{R}^{n}$, $|\omega|=1$ と $v\in\mathbb{C}^{r}$, $|v|=1$ で $\sigma_{P}(\omega)v=0$ となるものがある（斉次性から特性方向を単位ベクトルにとれる）。

**Step 1.** 【主張：$L$ があって、$m\in\mathbb{Z}^{n}\setminus\{0\}$ について $|\mathsf{p}(m)v|\le L|m|^{k}\,\bigl|\tfrac{m}{|m|}-\omega\bigr|+B(1+|m|)^{k-1}$（$B$ は \ref{gl:torus-elliptic-estimate} の Step 2 のもの）】$\xi\mapsto\sigma_{P}(\xi)$ は多項式なので、閉単位球の上で作用素ノルムについてリプシッツ連続（定数 $L$）。斉次性と $\sigma_{P}(\omega)v=0$ から $|\sigma_{P}(m)v|=|m|^{k}|\sigma_{P}(m/|m|)v-\sigma_{P}(\omega)v|\le L|m|^{k}|m/|m|-\omega|$。下の階数の部分は $|\xi^{\alpha}|\le(1+|\xi|)^{k-1}$ で抑える。

**Step 2.** 【主張：任意の $\varepsilon\in(0,1)$ について、$|m|$ がいくらでも大きく $|m/|m|-\omega|<\varepsilon$ となる $m\in\mathbb{Z}^{n}$ がある】$\mathbb{Q}^{n}$ は稠密なので $|q-\omega|<\varepsilon/2$ となる $q\in\mathbb{Q}^{n}$ があり、$|q|>1-\varepsilon/2>0$。$q$ の成分の分母の積を $d$ とし、$m_{N}\defeq Ndq\in\mathbb{Z}^{n}$（$N=1,2,\dots$）とおくと $|m_{N}|\to\infty$ で、$m_{N}/|m_{N}|=q/|q|$。$\bigl||q|-1\bigr|=\bigl||q|-|\omega|\bigr|\le|q-\omega|$ なので $|q/|q|-\omega|\le|q/|q|-q|+|q-\omega|=\bigl|1-|q|\bigr|+|q-\omega|<\varepsilon$。

**Step 3.** 【主張：矛盾】$u\defeq e_{m}v$ とすると $\hat{u}(l)=v$（$l=m$）、$0$（$l\neq m$）。\ref{gl:torus-elliptic-estimate} の証明の冒頭の不等式と Step 3（どちらも楕円性を使わない）から $\|u\|_{H^{s+k}}^{2}\ge C_{s+k}^{-1}W(m)^{s+k}$、$\|Pu\|_{H^{s}}^{2}\le c_{s}^{-1}W(m)^{s}|\mathsf{p}(m)v|^{2}$、$\|u\|_{L^{2}}^{2}=(2\pi)^{n}$。仮定の評価を二乗して $(a+b)^{2}\le2a^{2}+2b^{2}$ を使い、$W(m)^{s+k}$ で割ると
$$
C_{s+k}^{-1}\le\frac{2C^{2}}{c_{s}}\cdot\frac{|\mathsf{p}(m)v|^{2}}{W(m)^{k}}+\frac{2C^{2}(2\pi)^{n}}{W(m)^{s+k}}.
$$
Step 1 と $W(m)^{k}\ge|m|^{2k}$ から $\frac{|\mathsf{p}(m)v|^{2}}{W(m)^{k}}\le2L^{2}\bigl|\tfrac{m}{|m|}-\omega\bigr|^{2}+\frac{2B^{2}(1+|m|)^{2k-2}}{|m|^{2k}}$。$\varepsilon$ を $\frac{2C^{2}}{c_{s}}\cdot2L^{2}\varepsilon^{2}<\frac{1}{2}C_{s+k}^{-1}$ となるようにとり、Step 2 の $m=m_{N}$ で $N\to\infty$ とすると、右辺の残りの項は $0$ に近づくので、右辺は $C_{s+k}^{-1}$ より小さくなり、矛盾。

::: hypcheck
- **定数係数**：Step 3 で $e_{m}v$ が作用素を対角化することに使った。変数係数でも、特性方向に集中した高周波の波束を使えば同じ結論（評価から楕円性）が得られることが知られているが、ここでは扱わない。
- **公理**：$q$ の選び方は（たとえば成分の小数展開を有限で打ち切ることで）具体的にでき、選択は使わない。
:::
:::

::: supplement
**前提を変えると.** 評価の右辺の $\|u\|_{L^{2}}$ をもっと弱い $\|u\|_{H^{-j}}$（\ref{gl:negative-sobolev}）に替えても、波動作用素では評価は回復しない：$u_{N}=e_{(N,N)}$ は $Pu_{N}=0$ で、$\|u_{N}\|_{H^{-j}}$ は有界なままだからである。核が無限次元であることが、評価が崩れる根本の理由である。逆に、楕円型なら \ref{gl:torus-elliptic-estimate} の証明の Step 2 から $|m|\ge R$ で $\mathsf{p}(m)$ は可逆なので、$Pu=0$ の解のフーリエ係数は有限個の $m$（$|m|<R$）でしか $0$ でなく、核は有限次元で三角多項式だけからなる。$r=1$ なら \ref{gl:torus-elliptic-estimate.2} から、$Pu=0$ の $L^{2}$ の弱解はすべての $H^{s}$ に入り、\ref{gl:hk-smooth.2} から滑らかである。一般の閉多様体では、評価と \ref{gl:rellich-manifold} を組み合わせて核の有限次元性を示すことになる（後のページ）。

**似た定理.** 波動作用素の核の元 $e_{(N,N)}$ は、関数 $t_{1}+t_{2}$ だけによる。一般に、$g$ を $1$ 変数の周期関数として $u=g(t_{1}+t_{2})$ は $Pu=0$ の弱解で、$g$ が滑らかでなければ $u$ も滑らかでない（\ref{gl:prob-el-wave-weak-solution}）。$u$ の特異性は直線 $t_{1}+t_{2}=\text{一定}$ に沿って並び、その直線に垂直な余接ベクトル $(1,1)$ はちょうど特性方向である。双曲型の作用素では、特異性が特性的な曲線（この例では直線 $t_{1}+t_{2}=\text{一定}$）に沿って伝わることが一般に知られていて（特異性の伝播。ここでは証明しない）、楕円型作用素ではそもそも特性方向がないので、特異性が生じえない。これが次のページの楕円正則性の直観的な理由である。

**高い視点：死角に隠れる波.** 特性方向は作用素の死角である。その方向を向いた高周波の波は、作用素を通すとほとんど（波動作用素ではまったく）消えてしまうので、$Pu$ を見ても $u$ がその方向にどれだけ激しく振動しているかはわからない。評価 $\|u\|_{H^{s+k}}\lesssim\|Pu\|_{H^{s}}+\|u\|_{L^{2}}$ は「死角がない」ことの定量的な言い換えで、\ref{gl:torus-estimate-converse} は、トーラスの定数係数の作用素ではその言い換えが正確であることを示している。
:::

## 問題 {#gl:sec-el-problems}

::: problem {#gl:prob-el-wave-weak-solution}
$\mathfrak{g}\colon\mathbb{R}\to\mathbb{C}$ を周期 $2\pi$ の可測関数で $\int_{0}^{2\pi}|\mathfrak{g}|^{2}<\infty$ となるものとし、$T^{2}$ 上の関数 $u$ を $u(p(t))\defeq\mathfrak{g}(t_{1}+t_{2})$ で定める。$\hat{\mathfrak{g}}(j)\defeq\frac{1}{2\pi}\int_{0}^{2\pi}\mathfrak{g}(s)e^{-ijs}ds$ とし、$P\defeq D_{1}^{2}-D_{2}^{2}$ とする。
1. $u\in L^{2}(T^{2})$ で、$\hat{u}(m)=\hat{\mathfrak{g}}(m_{1})$（$m_{1}=m_{2}$）、$0$（$m_{1}\neq m_{2}$）を示せ。
2. $u$ は $Pu=0$ の弱解であることを示せ。
3. $\mathfrak{g}$ を $(0,\pi)$ の上で $1$、$[\pi,2\pi]$ の上で $0$ の関数を周期的に延ばしたものとすると、$u\notin H^{1}(T^{2})$ であることを示せ。これにより、\ref{gl:torus-elliptic-estimate.2} の結論は楕円性なしには成り立たない。
:::

::: solution
**1.** $u\circ p$ は $(t_{1},t_{2})\mapsto t_{1}+t_{2}$（連続）と $\mathfrak{g}$ の合成なので可測。\ref{meas:tonelli} と周期性（$t_{2}$ を固定すると $t_{1}\mapsto|\mathfrak{g}(t_{1}+t_{2})|^{2}$ の一周期の積分は $\int_{0}^{2\pi}|\mathfrak{g}|^{2}$）から $\int_{(0,2\pi)^{2}}|u\circ p|^{2}=2\pi\int_{0}^{2\pi}|\mathfrak{g}|^{2}<\infty$。同じく \ref{meas:fubini} と、$s=t_{1}+t_{2}$ の置き換え（一周期の積分は始点によらない）から
$$
\int_{0}^{2\pi}\mathfrak{g}(t_{1}+t_{2})e^{-im_{1}t_{1}}dt_{1}=e^{im_{1}t_{2}}\int_{0}^{2\pi}\mathfrak{g}(s)e^{-im_{1}s}ds=2\pi e^{im_{1}t_{2}}\hat{\mathfrak{g}}(m_{1}).
$$
これに $e^{-im_{2}t_{2}}$ を掛けて $t_{2}$ で積分すると、$\int_{0}^{2\pi}e^{i(m_{1}-m_{2})t_{2}}dt_{2}=2\pi\delta_{m_{1}m_{2}}$ から $(2\pi)^{2}\hat{u}(m)=(2\pi)^{2}\delta_{m_{1}m_{2}}\hat{\mathfrak{g}}(m_{1})$。

**2.** $\gamma_{x_{a}}=1$ と定数係数から \ref{gl:formal-transpose.2} で $P^{t}=P$。$v\in C^{\infty}(T^{2})$ について $\int uPv\,d\mu_{g}=0$ を示せばよい。\ref{gl:torus-fourier-basis.2} の正規直交基底による展開から得られる内積の形のパーセヴァルの等式 $\int u\bar{w}\,d\mu_{g}=(2\pi)^{2}\sum_{m}\hat{u}(m)\overline{\hat{w}(m)}$ を $\bar{w}=Pv$ に使う。$\overline{\hat{w}(m)}=\widehat{\bar{w}}(-m)$ と \ref{gl:torus-fourier-basis.3} から $\widehat{Pv}(-m)=\mathsf{p}(-m)\hat{v}(-m)$、$\mathsf{p}(-m)=-m_{1}^{2}+m_{2}^{2}$。よって
$$
\int uPv\,d\mu_{g}=(2\pi)^{2}\sum_{m}\hat{u}(m)\,(-m_{1}^{2}+m_{2}^{2})\,\hat{v}(-m).
$$
1 から $\hat{u}(m)\neq0$ となるのは $m_{1}=m_{2}$ のときだけで、そこで $-m_{1}^{2}+m_{2}^{2}=0$ なので、和は $0$。

**3.** $j\neq0$ について $\hat{\mathfrak{g}}(j)=\frac{1}{2\pi}\int_{0}^{\pi}e^{-ijs}ds=\frac{1-(-1)^{j}}{2\pi ij}$ で、$j$ が奇数なら $|\hat{\mathfrak{g}}(j)|=\frac{1}{\pi|j|}$。1 から
$$
\sum_{m}(1+|m|^{2})|\hat{u}(m)|^{2}=\sum_{j}(1+2j^{2})|\hat{\mathfrak{g}}(j)|^{2}\ge\sum_{j\text{ 奇数}}\frac{2j^{2}}{\pi^{2}j^{2}}=\infty
$$
なので、\ref{gl:torus-sobolev.1} から $u\notin H^{1}(T^{2})$。$Pu=0$ で $0\in H^{s}$（すべての $s$）なのに $u$ は $H^{1}$ にすら入らない。$u$ の不連続性は直線 $t_{1}+t_{2}\in\pi\mathbb{Z}$ に沿って並ぶ。
:::

::: problem {#gl:prob-el-first-order-scalar}
$M$ を $n$ 次元の閉多様体、$P$ を関数に作用する（複素係数の）$1$ 階以下の微分作用素とする。
1. 滑らかな実のベクトル場 $X$, $Y$ がただ一組あって $\sigma_{P}(m,\xi)=i\bigl(\xi(X_{m})+i\,\xi(Y_{m})\bigr)$ となることを示せ。
2. $P$ が（$1$ 階の）楕円型であることは、すべての $m$ で $X_{m}$, $Y_{m}$ が $T_{m}M$ を張ることと同値であることを示せ。とくに $n\ge3$ なら関数に作用する $1$ 階の楕円型作用素はない。
3. $T^{2}$ には関数に作用する $1$ 階の楕円型作用素があるが、$S^{2}$ にはないことを示せ。
:::

::: solution
**1.** 座標近傍で $P=\sum_{j}b_{j}\partial_{j}+b_{0}$ とすると $\sigma_{P}(m,\xi)=i\sum_{j}b_{j}(x(m))\xi_{j}$。$-i\sigma_{P}(m,\cdot)$ は $T_{m}^{*}M$ 上の実線形な複素数値関数なので、その実部・虚部はそれぞれ $T_{m}^{*}M$ 上の実線形形式で、$T_{m}M=(T_{m}^{*}M)^{*}$ のただ一つの元 $X_{m}$, $Y_{m}$ で $\xi\mapsto\xi(X_{m})$, $\xi\mapsto\xi(Y_{m})$ と表される。$\sigma_{P}$ は座標によらない（\ref{gl:principal-symbol-invariance}）ので $X$, $Y$ も座標によらず、座標では $X=\sum_{j}(\operatorname{Re}b_{j})\partial_{j}$, $Y=\sum_{j}(\operatorname{Im}b_{j})\partial_{j}$ なので滑らか。

**2.** $\sigma_{P}(m,\xi)$ は複素数なので、同型 $\iff$ $\neq0$ $\iff$ $\xi(X_{m})$, $\xi(Y_{m})$ の少なくとも一方が $0$ でない。よって楕円型 $\iff$ $X_{m}$ と $Y_{m}$ の両方を消す $\xi\neq0$ がない $\iff$ $X_{m}$, $Y_{m}$ の張る部分空間 $S$ の零化空間 $\{\xi:\xi\restr{S}=0\}$ が $0$ $\iff$ $S=T_{m}M$（零化空間の次元は $n-\dim S$）。$\dim S\le2$ なので $n\ge3$ では起こらない。

**3.** $T^{2}$ では $P=D_{1}+iD_{2}$ について $X=D_{1}$, $Y=D_{2}$ は各点で基底なので、2 から楕円型（$\sigma_{P}(\xi)=i(\xi_{1}+i\xi_{2})$）。$S^{2}$ に楕円型の $P$ があれば、2 から $X_{m}$, $Y_{m}$ は各点で一次独立で、とくに $X$ はどこでも $0$ でない滑らかな接ベクトル場になる。$S^{2}\subset\mathbb{R}^{3}$ の接ベクトルを包含写像の微分で $\mathbb{R}^{3}$ のベクトルとみれば、これは \ref{at:hairy-ball} に反する（$n=2$ は偶数）。なお、リーマン球面の上の $\bar{\partial}$（\ref{gl:elliptic-examples.3}）は楕円型だが、値は自明でない複素直線束 $\Lambda^{0,1}$ の切断で、関数ではないので矛盾しない。局所的には $\partial_{\bar{z}}=\frac12(\partial_{x}+i\partial_{y})$ だが、大域的に関数から関数への作用素にはできない。
:::
