# 負の階数のソボレフ空間とトーラス {#gl:page-negative-sobolev-torus keywords="negative Sobolev spaces H^{-k}(M) as duals, L^2 pairing, extension of differential operators to negative orders, weak solutions, Sobolev spaces on the torus and Fourier coefficients, orthonormal basis of L^2(T^n)"}

前のページ（\ref{gl:page-sobolev-sections}）の形式的転置を使って、負の階数のソボレフ空間 $H^{-k}(M)$ を $H^{k}(M)$ の双対として定め、微分作用素を負の階数へ延ばして弱解を定義する。後半では、平坦トーラス $T^{n}$ の上で $H^{k}$ がフーリエ係数の重みつきの二乗和で特徴づけられることを示す。

## 記法と定義の確認 {#gl:sec-nt-notation}

::: notation
- 閉多様体 $M$、$\mu_{g}$、$L^{2}(M)$、$H^{k}(M)$ と内積 $\langle\cdot,\cdot\rangle_{H^{k}}$ は \ref{gl:page-sobolev-manifolds} のとおり。微分作用素・その有界性・形式的転置は \ref{gl:differential-operator-manifold}, \ref{gl:differential-operator-sobolev}, \ref{gl:formal-transpose}。
- リースの表現定理・直交分解・正規直交基底は \ref{fa:riesz-representation}, \ref{fa:orthogonal-decomposition}, \ref{fa:orthonormal-basis}。フーリエ係数（円周）と一意性定理は \ref{four:fourier-coefficients}, \ref{four:uniqueness}。
- **選択公理**：新しい選択は使わない（局所化のデータの 1 の分割で DC を使う点は前のページと同じ）。$L^{2}(T^{n})$ の正規直交基底は具体的に与えるので、ツォルンの補題は使わない。
:::

## 負の階数のソボレフ空間と弱解 {#gl:sec-nt-negative}

::: definition 負の階数のソボレフ空間 {#gl:negative-sobolev keywords="H^{-k}(M) as the space of bounded linear functionals on H^k(M) with the dual norm; L^2 functions act by the pairing <f, v> = int f v d mu" index="負の階数のソボレフ空間|ふのかいすうのそぼれふくうかん, H-k(M)|えいちまいなすけーえむ"}
$k\ge1$ について、$H^{k}(M)$ 上の有界線形汎関数 $T$ の全体を $H^{-k}(M)$ と書き、$\langle T,v\rangle\defeq T(v)$、$\|T\|_{H^{-k}}\defeq\sup\{|\langle T,v\rangle|:\|v\|_{H^{k}}\le1\}$ とする。$H^{0}(M)\defeq L^{2}(M)$。$f\in L^{2}(M)$ について $\iota f\in H^{-k}(M)$ を $\langle\iota f,v\rangle\defeq\int_{M}fv\,d\mu_{g}$（**$L^{2}$ の対合**）で定める。
:::

::: intuition
負の階数のソボレフ関数とは、$H^{k}$ の関数を「試験関数」として入れると数を返す連続な規則のことで、普通の二乗可積分関数 $f$ は「$v$ に $\int fv$ を対応させる規則」としてその仲間になる。
:::

::: proposition 負の階数のソボレフ空間の性質 {#gl:negative-sobolev-properties keywords="H^{-k}(M) is a Hilbert space independent of choices; iota: L^2 -> H^{-k} is injective and bounded; smooth functions are dense in H^{-k}; chain H^k in L^2 in H^{-k} in H^{-k-1}" index="負の階数のソボレフ空間の性質|ふのかいすうのそぼれふくうかんのせいしつ"}
$M$ を閉多様体、$k\ge1$ とする。
1. $H^{-k}(M)$ はヒルベルト空間で、集合と位相は局所化のデータによらない。
2. $\iota\colon L^{2}(M)\to H^{-k}(M)$ は有界な線形単射である。
3. $\iota(C^{\infty}(M))$ は $H^{-k}(M)$ で稠密である。
4. 制限 $T\mapsto T\restr{H^{k+1}(M)}$ は $H^{-k}(M)$ から $H^{-k-1}(M)$ への有界な線形単射で、$\iota$ と両立する。
:::

::: proof
**Step 1.** 【主張：1】\ref{fa:riesz-representation} から、$R(w)\defeq\langle\cdot,w\rangle_{H^{k}}$ は $H^{k}(M)$ から $H^{-k}(M)$ への共役線形な等長全単射で、$\langle T,v\rangle=\langle v,R^{-1}T\rangle_{H^{k}}$。$\langle T,S\rangle_{H^{-k}}\defeq\langle R^{-1}S,R^{-1}T\rangle_{H^{k}}$ は $T$ について線形（$R^{-1}(cT)=\bar{c}R^{-1}T$）、共役対称で、$\langle T,T\rangle_{H^{-k}}=\|R^{-1}T\|^{2}=\|T\|_{H^{-k}}^{2}$。$R$ は等長全単射で $H^{k}(M)$ は完備なので $H^{-k}(M)$ も完備。データを替えると $H^{k}$ のノルムは同値なものに替わる（\ref{gl:sobolev-manifold-independence.1}）ので、有界線形汎関数の全体は変わらず、双対ノルムも同値。

**Step 2.** 【主張：2】\ref{gl:sobolev-manifold-independence.3} から $\|v\|_{L^{2}}\le C\|v\|_{H^{k}}$ なので、$|\langle\iota f,v\rangle|\le\|f\|_{L^{2}}\|v\|_{L^{2}}\le C\|f\|_{L^{2}}\|v\|_{H^{k}}$。$\iota f=0$ なら、\ref{gl:sobolev-manifold-density}（$k=0$, $p=2$）から滑らかな $v_{m}\to\bar{f}$（$L^{2}$）をとって $\int|f|^{2}=\lim\int fv_{m}=0$。

**Step 3.** 【主張：3】$N\defeq\iota(C^{\infty}(M))$ とし、$S\perp N$ とする。$w\defeq R^{-1}S$ について $\langle\iota\varphi,S\rangle_{H^{-k}}=\langle w,R^{-1}\iota\varphi\rangle_{H^{k}}=\langle\iota\varphi,w\rangle=\int\varphi w\,d\mu_{g}$ がすべての $\varphi\in C^{\infty}(M)$ で $0$。$w\in L^{2}$ なので Step 2 と同じ議論で $w=0$、よって $S=0$。$N^{\perp}=0$ なので \ref{fa:orthogonal-decomposition.3} から $\overline{N}=N^{\perp\perp}=H^{-k}(M)$。

**Step 4.** 【主張：4】$\|v\|_{H^{k}}\le\|v\|_{H^{k+1}}$（$H^{k+1}(\mathbb{R}^{n})$ のノルムの和は $H^{k}$ の項をすべて含む）なので、制限は有界でノルムを増やさない。$T\restr{H^{k+1}}=0$ なら、$T$ は $H^{k}$ で稠密な $C^{\infty}(M)$ の上で $0$ なので $T=0$。$\iota$ との両立は定義から。
:::

4 と 2 により、以後 $f\in L^{2}$ を $\iota f$ と同一視し、$H^{k}\subset L^{2}\subset H^{-k}$ とみなす。

::: definition 弱解 {#gl:weak-solution-manifold keywords="weak solution of Pu = f on a closed manifold: int u P^t v = int f v for all smooth v" index="弱解（多様体）|じゃくかいたようたい"}
$P$ を $k$ 階以下の微分作用素、$u,f\in L^{2}(M)$ とする。すべての $v\in C^{\infty}(M)$ について
$$
\int_{M}u\,(P^{t}v)\,d\mu_{g}=\int_{M}fv\,d\mu_{g}
$$
となるとき、$u$ を $Pu=f$ の**弱解**という。
:::

::: intuition
弱解とは、方程式の両辺を滑らかな試験関数と掛けて積分し、微分を試験関数の側に移したときに等しくなる関数のことである。$u$ 自身は微分できなくてもよい。
:::

::: theorem 微分作用素の負の階数への延長 {#gl:operator-negative-extension keywords="a differential operator of order k extends to bounded maps L^2 -> H^{-k} and H^{-s} -> H^{-s-k} by <PT, v> = <T, P^t v>; agrees with the classical P on H^k; u is a weak solution of Pu = f iff Pu = f in H^{-k}" index="微分作用素の負の階数への延長|びぶんさようそのふのかいすうへのえんちょう"}
$M$ を閉多様体、$P$ を $k$ 階以下の微分作用素、$s\ge0$ を整数とする。
1. $T\in H^{-s}(M)$（$s=0$ なら $T\in L^{2}(M)$）について $\langle\tilde{P}T,v\rangle\defeq\langle T,P^{t}v\rangle$（$v\in H^{s+k}(M)$。$s=0$ では $\int TP^{t}v$）と定めると、$\tilde{P}\colon H^{-s}(M)\to H^{-s-k}(M)$ は有界線形で、$\varphi\in C^{\infty}(M)$ について $\tilde{P}\varphi=P\varphi$ となる有界線形写像はこれだけである。
2. $u\in H^{k}(M)$ なら、$H^{-k}(M)$ の元として $\tilde{P}u=Pu$（右辺は \ref{gl:differential-operator-sobolev.1} の延長）。
3. $u,f\in L^{2}(M)$ について、$u$ が $Pu=f$ の弱解 $\iff$ $H^{-k}(M)$ で $\tilde{P}u=f$。さらに $u\in H^{k}(M)$ なら、$Pu=f$（$L^{2}$ の元として）。
:::

::: intuition
微分作用素は、微分を相手に移すことで、微分できない関数や関数でないものにまで作用させられる。その意味で方程式を満たすことが弱解で、解がもともと十分に微分できるなら、弱解は普通の意味の解である。
:::

::: proof
**Step 1.** 【主張：$\tilde{P}$ は有界】\ref{gl:differential-operator-sobolev.1} を $P^{t}$ に使うと $\|P^{t}v\|_{H^{s}}\le C\|v\|_{H^{s+k}}$（$H^{s}$ のノルムと $\|\cdot\|_{s,2}$ は同値）。$s\ge1$ なら $|\langle T,P^{t}v\rangle|\le\|T\|_{H^{-s}}\|P^{t}v\|_{H^{s}}\le C\|T\|_{H^{-s}}\|v\|_{H^{s+k}}$、$s=0$ なら $|\int TP^{t}v|\le\|T\|_{L^{2}}\|P^{t}v\|_{L^{2}}\le C\|T\|_{L^{2}}\|v\|_{H^{k}}$。よって $\tilde{P}T\in H^{-s-k}$ で $\|\tilde{P}T\|\le C\|T\|$。線形性は定義から。

**Step 2.** 【主張：$\varphi\in C^{\infty}(M)$ なら $\tilde{P}\varphi=P\varphi$ で、そのような有界線形写像は一つしかない】$v\in C^{\infty}(M)$ について $\langle\tilde{P}\varphi,v\rangle=\int\varphi\,P^{t}v=\int(P\varphi)v=\langle P\varphi,v\rangle$（\ref{gl:formal-transpose.1}）。両辺は $v\in H^{s+k}$ について有界線形なので、稠密性（\ref{gl:sobolev-manifold-density}）から $H^{s+k}$ 全体で等しい。一意性は、$\iota(C^{\infty}(M))$ が $H^{-s}(M)$ で稠密（\ref{gl:negative-sobolev-properties.3}。$s=0$ なら $C^{\infty}(M)$ が $L^{2}(M)$ で稠密）であることから。

**Step 3.** 【主張：2】滑らかな $\varphi_{m}\to u$（$H^{k}$）をとる。$\varphi_{m}\to u$（$L^{2}$）なので Step 1 から $\tilde{P}\varphi_{m}\to\tilde{P}u$（$H^{-k}$）。一方 $P\varphi_{m}\to Pu$（$L^{2}$、\ref{gl:differential-operator-sobolev.1}）で、\ref{gl:negative-sobolev-properties.2} から $H^{-k}$ でも収束する。Step 2 から $\tilde{P}\varphi_{m}=P\varphi_{m}$ なので、極限も等しい。

**Step 4.** 【主張：3】弱解の条件は、$\langle\tilde{P}u,v\rangle=\langle f,v\rangle$ が $v\in C^{\infty}(M)$ で成り立つことである。両辺は $v\in H^{k}$ について有界線形なので、稠密性から $v\in H^{k}$ 全体で成り立つことと同値で、それは $H^{-k}$ で $\tilde{P}u=f$ ということ。$u\in H^{k}$ なら 2 から $Pu=\tilde{P}u=f$（$H^{-k}$ の元として）で、\ref{gl:negative-sobolev-properties.2} の単射性から $L^{2}$ の元として $Pu=f$。

::: hypcheck
- **$M$ が閉**：形式的転置（境界項がないこと）と、\ref{gl:differential-operator-sobolev} を $P^{t}$ に使うことに使った。境界があると、弱解の定義に使う試験関数を境界で $0$ のものに限るなど、境界条件を定義に組み込む必要がある。
- **稠密性**：Step 2 の一意性と Step 4 の同値性に使った。
- **公理**：新しい選択は使わない（リースの表現定理と直交分解は \ref{fa:riesz-representation}, \ref{fa:orthogonal-decomposition} による）。
:::
:::

以後、$\tilde{P}$ も $P$ と書く。

::: supplement
**前提を変えると.** 3 の後半で $u\in H^{k}$ という仮定を外すと、弱解が $H^{k}$ に入るかどうかは $P$ による。$P=\frac{d}{dt}$（$M=S^{1}$）なら、$Pu=0$ の弱解は定数だけなので滑らか（\ref{fa:zero-derivative} の多様体版）だが、$M=T^{2}$ で $P=\partial_{t_{1}}$ とすると、$t_{2}$ だけによる任意の $L^{2}$ 関数が $Pu=0$ の弱解で、どれだけ滑らかかはまったく決まらない。弱解が自動的に滑らかになる作用素の典型が楕円型作用素で、その理論（楕円正則性）はこの分野の後の系列で扱う。ベクトル束の間の作用素についても、ファイバー計量 $h$ を固定して $\int_{M}\langle u,v\rangle_{h}d\mu_{g}$ を対合に使えば、形式的転置・$H^{-k}(M;E)$・弱解が同じ証明で定まる。

**似た定理.** $\mathbb{R}^{n}$ の負の階数の空間 $H^{-s}(\mathbb{R}^{n})$ は緩増加超関数で表され、$H^{s}$ の双対と同一視できる（\see{fa:fractional-sobolev} の後の補足）。$H^{-k}(M)$ の元は $C^{\infty}(M)$ 上の連続線形汎関数を定めるので、多様体の上の超関数の一種であり、3 は超関数の意味で $Pu=f$ ということである。有限次元の線形代数では、行列 $A$ の方程式 $Ax=b$ を「すべての $y$ について $\langle x,A^{\mathsf{T}}y\rangle=\langle b,y\rangle$」と言い換えられ、それが弱解の原型である。

**高い視点：直接見ずに天秤で量る.** 関数 $u$ を直接微分する代わりに、滑らかな試験関数 $v$ を天秤の反対側に載せ、$v$ のほうを微分してつり合いを量る。どの試験関数で量ってもつり合っていれば、$u$ は方程式を満たしているとみなす。$H^{-k}$ は「$H^{k}$ の重りで量れる物」の全体で、量れる物ほど粗くてよい（$k$ が大きいほど $H^{-k}$ は大きい）。
:::

## 例：トーラス上のソボレフ空間 {#gl:sec-nt-torus}

平坦トーラス $T^{n}=(S^{1})^{n}\subset\mathbb{C}^{n}$（\ref{gl:rm-examples.2}）を考え、$p(t)\defeq(e^{it_{1}},\dots,e^{it_{n}})$ とする。$a\in\mathbb{R}^{n}$ について $Q_{a}\defeq a+(0,2\pi)^{n}$ の上の $p$ の逆写像 $x_{a}$ は座標近傍で、そこで $g_{ij}=\delta_{ij}$、$\gamma_{x_{a}}=1$ である（\ref{gl:rm-examples.2}）。$T^{n}$ 上の関数 $u$ は $2\pi\mathbb{Z}^{n}$ 周期の関数 $u\circ p$ と一対一に対応し、$\int_{T^{n}}u\,d\mu_{g}=\int_{(0,2\pi)^{n}}u\circ p\,d\lambda$（\ref{gl:rm-examples.2} の測度の式から単関数近似で）。$u$ が滑らかであることは $u\circ p$ が滑らかであることと同値である（$u\circ p$ は各 $Q_{a}$ の上で $u\circ x_{a}^{-1}$）。各点の各座標 $t_{j}$ は $0$ か $\pi$ の一方とは $2\pi$ を法として合同でないので、$a\in\{0,\pi\}^{n}$ の $2^{n}$ 個の座標近傍で $T^{n}$ は覆える。$D_{j}$ を、各 $x_{a}$ で座標ベクトル場 $\partial/\partial t_{j}$ になる $T^{n}$ 上のベクトル場とすると $(D_{j}u)\circ p=\partial_{j}(u\circ p)$ で、$D^{\beta}\defeq D_{1}^{\beta_{1}}\cdots D_{n}^{\beta_{n}}$ は $|\beta|$ 階の微分作用素である（\ref{gl:differential-operator-examples.2}）。$m\in\mathbb{Z}^{n}$ について $e_{m}(p(t))\defeq e^{im\cdot t}$、$u\in L^{1}(T^{n})$ の**フーリエ係数**を
$$
\hat{u}(m)\defeq(2\pi)^{-n}\int_{(0,2\pi)^{n}}(u\circ p)(t)\,e^{-im\cdot t}\,dt
$$
と定め、$S_{N}u\defeq\sum_{|m|_{\infty}\le N}\hat{u}(m)e_{m}$ とおく（$|m|_{\infty}\defeq\max_{j}|m_{j}|$）。

::: lemma トーラスのフーリエ級数 {#gl:torus-fourier-basis keywords="uniqueness of Fourier coefficients on T^n by induction and Fubini; (2 pi)^{-n/2} e^{i m t} is an orthonormal basis of L^2(T^n); Parseval; derivatives multiply coefficients by (i m)^beta" index="トーラスのフーリエ級数|とーらすのふーりえきゅうすう, 多変数のフーリエ級数|たへんすうのふーりえきゅうすう"}
1. $u\in L^{1}(T^{n})$ のフーリエ係数がすべて $0$ なら $u=0$（a.e.）。
2. $\{(2\pi)^{-n/2}e_{m}\}_{m\in\mathbb{Z}^{n}}$ は $L^{2}(T^{n})$ の正規直交基底で、$u\in L^{2}(T^{n})$ について $\|u\|_{L^{2}}^{2}=(2\pi)^{n}\sum_{m}|\hat{u}(m)|^{2}$、$\|S_{N}u-u\|_{L^{2}}\to0$。
3. $u\in C^{\infty}(T^{n})$ なら $\widehat{D^{\beta}u}(m)=(im)^{\beta}\hat{u}(m)$（$(im)^{\beta}\defeq\prod_{j}(im_{j})^{\beta_{j}}$）。
:::

::: proof
**Step 1.** 【主張：$n=1$ で 1 が成り立つ】$h(y)\defeq(u\circ p)(2\pi y)$ は周期 $1$ の関数で、$\mathbb{T}=\mathbb{R}/\mathbb{Z}$ の上で可積分。$t=2\pi y$ と変数変換すると、\ref{four:fourier-coefficients} の係数は $\hat{h}(m)=\int_{0}^{1}h(y)e^{-2\pi imy}dy=\frac{1}{2\pi}\int_{0}^{2\pi}(u\circ p)(t)e^{-imt}dt=\hat{u}(m)=0$。\ref{four:uniqueness} から $h=0$ a.e.、よって $u\circ p=0$ が $(0,2\pi)$ 上 a.e. で、測度の式から $u=0$ a.e.。

**Step 2.** 【主張：$n\ge2$ で、$n-1$ について 1 が成り立てば $n$ でも成り立つ】$U\defeq u\circ p$ を $(0,2\pi)^{n}$ 上で $t=(t',t_{n})$ と書く。\ref{meas:fubini} から、零集合 $Z_{0}$ を除く $t_{n}$ について $U(\cdot,t_{n})$ は可積分で、$m'\in\mathbb{Z}^{n-1}$ について $h_{m'}(t_{n})\defeq\int U(t',t_{n})e^{-im'\cdot t'}dt'$ は $(0,2\pi)$ 上で可積分、
$$
\int_{0}^{2\pi}h_{m'}(t_{n})e^{-im_{n}t_{n}}dt_{n}=(2\pi)^{n}\hat{u}(m',m_{n})=0\quad(m_{n}\in\mathbb{Z}).
$$
Step 1 から $h_{m'}=0$ が零集合 $Z_{m'}$ の外で成り立つ。$Z\defeq Z_{0}\cup\bigcup_{m'}Z_{m'}$（可算和）は零集合で、$t_{n}\notin Z$ なら $U(\cdot,t_{n})$ の $(n-1)$ 次元のフーリエ係数はすべて $0$ なので、帰納法の仮定から $U(\cdot,t_{n})=0$ a.e.。\ref{meas:tonelli} から $\int|U|=0$。

**Step 3.** 【主張：2】$\int e_{m}\overline{e_{l}}\,d\mu_{g}=\prod_{j}\int_{0}^{2\pi}e^{i(m_{j}-l_{j})t_{j}}dt_{j}=(2\pi)^{n}\delta_{ml}$ なので正規直交系。$u\in L^{2}$ が全部と直交すれば、$\mu_{g}(T^{n})<\infty$ からコーシー–シュワルツで $u\in L^{1}$ で、$\langle u,e_{m}\rangle=(2\pi)^{n}\hat{u}(m)=0$ なので 1 から $u=0$。\ref{fa:orthonormal-basis}（1 ⇒ 基底、4）から正規直交基底で、$|\langle u,(2\pi)^{-n/2}e_{m}\rangle|^{2}=(2\pi)^{n}|\hat{u}(m)|^{2}$ からパーセヴァルの等式。$u-S_{N}u$ は $|m|_{\infty}\le N$ の $e_{m}$ と直交するので、ピタゴラスから $\|u-S_{N}u\|^{2}=\|u\|^{2}-\|S_{N}u\|^{2}=(2\pi)^{n}\sum_{|m|_{\infty}>N}|\hat{u}(m)|^{2}\to0$。

**Step 4.** 【主張：3】$|\beta|=1$, $D^{\beta}=D_{j}$ の場合を示せば帰納法で出る。$U=u\circ p$ は $t_{j}$ について周期 $2\pi$ なので、他の変数を止めて部分積分すると、境界項 $[Ue^{-im_{j}t_{j}}]_{0}^{2\pi}=0$ から $\int_{0}^{2\pi}\partial_{j}U\,e^{-im_{j}t_{j}}dt_{j}=im_{j}\int_{0}^{2\pi}U\,e^{-im_{j}t_{j}}dt_{j}$。残りの変数で積分する（\ref{meas:fubini}）。
:::

::: theorem トーラス上のソボレフ空間とフーリエ係数 {#gl:torus-sobolev keywords="H^k(T^n) is characterized by sum (1 + |m|^2)^k |hat u(m)|^2 < infinity, with equivalent norms; derivatives multiply Fourier coefficients by (i m)^beta" index="トーラス上のソボレフ空間|とーらすじょうのそぼれふくうかん, ソボレフ空間のフーリエ級数による特徴づけ|そぼれふくうかんのふーりえきゅうすうによるとくちょうづけ"}
$k\ge0$ を整数、$u\in L^{2}(T^{n})$ とする。
1. $u\in H^{k}(T^{n})$ $\iff$ $\sum_{m\in\mathbb{Z}^{n}}(1+|m|^{2})^{k}|\hat{u}(m)|^{2}<\infty$。
2. $u\in H^{k}(T^{n})$ なら、$|\beta|\le k$ について $\widehat{D^{\beta}u}(m)=(im)^{\beta}\hat{u}(m)$（$D^{\beta}$ は \ref{gl:differential-operator-sobolev.1} の延長）で、$u$ によらない正の定数 $c,C$ について
$$
c\|u\|_{H^{k}}^{2}\le\sum_{m}(1+|m|^{2})^{k}|\hat{u}(m)|^{2}\le C\|u\|_{H^{k}}^{2}.
$$
:::

::: intuition
トーラスの上では、関数が $k$ 回弱微分できることは、フーリエ係数が高い周波数で十分速く小さくなること、すなわち周波数の $2k$ 乗を重みにした係数の二乗和が有限であることと同じである。
:::

::: proof
局所化のデータとして、$a\in\{0,\pi\}^{n}$ の座標近傍 $(p(Q_{a}),x_{a})$ と従属する 1 の分割 $(\rho_{a})$ をとる（ノルムは同値なものに替わるだけ、\ref{gl:sobolev-manifold-independence.1}）。$u\in H^{k}(T^{n})$ について $\mathcal{N}_{k}(u)^{2}\defeq\sum_{|\beta|\le k}\|D^{\beta}u\|_{L^{2}}^{2}$ とおく。

**Step 1.** 【主張：正の定数 $c_{1},C_{1}$ があって、すべての $u\in H^{k}(T^{n})$ について $c_{1}\|u\|_{H^{k}}\le\mathcal{N}_{k}(u)\le C_{1}\|u\|_{H^{k}}$】両辺は $H^{k}$ 上で連続（$D^{\beta}\colon H^{k}\to L^{2}$ は有界、\ref{gl:differential-operator-sobolev.1}）なので、稠密性（\ref{gl:sobolev-manifold-density}）から $u\in C^{\infty}(T^{n})$ で示せばよい。$Q_{a}$ の上で $(\rho_{a}u)^{x_{a}}=(\rho_{a}\circ p)(u\circ p)$ で、その外で $0$。ライプニッツ則から $\partial^{\alpha}(\rho_{a}u)^{x_{a}}=\sum_{\gamma\le\alpha}\binom{\alpha}{\gamma}\bigl((D^{\gamma}\rho_{a})(D^{\alpha-\gamma}u)\bigr)\circ p$（$Q_{a}$ 上）。$\gamma_{x_{a}}=1$ なので $\int_{Q_{a}}|F\circ p|^{2}d\lambda=\int_{p(Q_{a})}|F|^{2}d\mu_{g}\le\|F\|_{L^{2}}^{2}$（\ref{gl:rm-integral-formulas.1}）。よって $\|(\rho_{a}u)^{x_{a}}\|_{H^{k}(\mathbb{R}^{n})}\le C\mathcal{N}_{k}(u)$ で、$a$ について足して $\|u\|_{H^{k}}\le C\mathcal{N}_{k}(u)$。逆に $D^{\beta}u=\sum_{a}D^{\beta}(\rho_{a}u)$ で、$D^{\beta}(\rho_{a}u)$ は $p(Q_{a})$ の外で $0$、$Q_{a}$ の上で $D^{\beta}(\rho_{a}u)\circ p=\partial^{\beta}(\rho_{a}u)^{x_{a}}$ なので $\|D^{\beta}(\rho_{a}u)\|_{L^{2}}=\|\partial^{\beta}(\rho_{a}u)^{x_{a}}\|_{L^{2}(\mathbb{R}^{n})}\le\|(\rho_{a}u)^{x_{a}}\|_{H^{k}}$。$a$ について足し、$\beta$ について二乗和をとれば $\mathcal{N}_{k}(u)\le C\|u\|_{H^{k}}$。

**Step 2.** 【主張：$w_{k}(m)\defeq\sum_{|\beta|\le k}m^{2\beta}$（$m^{2\beta}\defeq\prod_{j}m_{j}^{2\beta_{j}}$）について $w_{k}(m)\le(1+|m|^{2})^{k}\le(n+1)^{k}w_{k}(m)$】多項定理から
$$
(1+m_{1}^{2}+\cdots+m_{n}^{2})^{k}=\sum_{|\beta|\le k}\frac{k!}{(k-|\beta|)!\,\beta_{1}!\cdots\beta_{n}!}\,m^{2\beta}.
$$
各 $\beta$ はちょうど一度現れ、係数は $1$ 以上で、係数の総和は $(1+1+\cdots+1)^{k}=(n+1)^{k}$ なので各係数は $(n+1)^{k}$ 以下。

**Step 3.** 【主張：2】$u\in H^{k}$ とし、滑らかな $\varphi_{l}\to u$（$H^{k}$）をとる。$|\hat{f}(m)|\le(2\pi)^{-n}\|f\|_{L^{1}}\le(2\pi)^{-n/2}\|f\|_{L^{2}}$（コーシー–シュワルツ）なので、フーリエ係数は $L^{2}$ 上で連続。$D^{\beta}\varphi_{l}\to D^{\beta}u$（$L^{2}$）と \ref{gl:torus-fourier-basis.3} から $\widehat{D^{\beta}u}(m)=\lim(im)^{\beta}\hat{\varphi_{l}}(m)=(im)^{\beta}\hat{u}(m)$。$D^{\beta}u\in L^{2}$ にパーセヴァルの等式（\ref{gl:torus-fourier-basis.2}）を使うと $\|D^{\beta}u\|^{2}=(2\pi)^{n}\sum_{m}m^{2\beta}|\hat{u}(m)|^{2}$、$\beta$ について足して $\mathcal{N}_{k}(u)^{2}=(2\pi)^{n}\sum_{m}w_{k}(m)|\hat{u}(m)|^{2}$。Step 1・2 から 2 の不等式が出る。とくに 1 の ⇒ が成り立つ。

**Step 4.** 【主張：1 の ⇐】$\sum(1+|m|^{2})^{k}|\hat{u}(m)|^{2}<\infty$ とする。$S_{N}u$ は三角多項式なので滑らかで、$S_{N}u-S_{N'}u$（$N'<N$）のフーリエ係数は $N'<|m|_{\infty}\le N$ で $\hat{u}(m)$、他で $0$。Step 3 の不等式（滑らかな関数に使う）から
$$
\|S_{N}u-S_{N'}u\|_{H^{k}}^{2}\le c^{-1}\sum_{N'<|m|_{\infty}\le N}(1+|m|^{2})^{k}|\hat{u}(m)|^{2}\to0
$$
なので $(S_{N}u)$ は $H^{k}$ のコーシー列で、完備性（\ref{gl:sobolev-manifold-complete.1}）から $v\in H^{k}$ に収束する。$H^{k}\to L^{2}$ は連続で、$S_{N}u\to u$（$L^{2}$、\ref{gl:torus-fourier-basis.2}）なので $v=u$。

::: hypcheck
- **トーラスの平坦な計量**：Step 1 で $\gamma_{x_{a}}=1$ と、$D_{j}$ が座標ベクトル場であることに使った。ほかの計量でも $H^{k}(T^{n})$ は同じ空間（\ref{gl:sobolev-manifold-independence.4}）なので、1 の特徴づけは計量によらない。定数だけが変わる。
- **$k$ が整数**：$D^{\beta}$ で定義したソボレフ空間と比べるのに使った。非整数の $s$ では、2 の重みの式を定義にするのが自然である（補足）。
- **公理**：正規直交基底は具体的に与えたので、選択公理は使わない（Step 2 の可算個の零集合の和も、選択なしに定まる）。
:::
:::

::: supplement
**前提を変えると.** 実数 $s$ について $H^{s}(T^{n})\defeq\{u\in L^{2}:\sum(1+|m|^{2})^{s}|\hat{u}(m)|^{2}<\infty\}$ と定めれば、$s=k$ のとき上の定理の空間と一致し、$\mathbb{R}^{n}$ の \ref{fa:fractional-sobolev} と同じ考え方で非整数の階数が定まる。負の階数 $H^{-k}(T^{n})$ の元 $T$ は、係数 $T_{m}\defeq(2\pi)^{-n}\langle T,e_{-m}\rangle$ について $\sum(1+|m|^{2})^{-k}|T_{m}|^{2}<\infty$ で特徴づけられることが、2 とリースの表現定理から示せる（ここでは詳細を省く）。

**似た定理.** $\mathbb{R}^{n}$ では \ref{fa:sobolev-fourier} が同じ特徴づけで、フーリエ変換の流儀（$e^{-2\pi ix\cdot\xi}$）の違いから重みが $(1+|\xi|^{2})^{k}$ と $2\pi$ の因子だけ異なる。円周（$n=1$）の場合は \ref{four:fourier-coefficients} の係数と $t=2\pi y$ で対応する。$\sum(1+|m|^{2})^{k}|\hat{u}(m)|^{2}<\infty$ で $2k>n$ なら、コーシー–シュワルツの不等式から $\sum|\hat{u}(m)|<\infty$ となり、フーリエ級数は一様収束して $u$ は連続な代表をもつ（\ref{gl:prob-nt-delta-torus}）。これは一般のソボレフの埋め込みの最も簡単な場合で、閉多様体での一般の場合は次のページで扱う。

**高い視点：倍音の減り方.** 弦の音を基音と倍音に分けると、角のある波形（のこぎり波）は倍音がゆっくりしか減らず、なめらかな波形ほど高い倍音が速く消える。$H^{k}$ のノルムは、各倍音の強さに周波数の $2k$ 乗の「罰金」を課して足したもので、これが有限であることが「$k$ 回微分できる」ことと同じだ、というのがこの定理である。トーラスでは倍音（$e_{m}$）がちょうどラプラシアンの固有関数（\ref{gl:laplacian-examples.2}）なので、微分作用素は倍音ごとの掛け算になり、すべてが係数の計算に帰着する。
:::

## 問題 {#gl:sec-nt-problems}

::: problem {#gl:prob-nt-delta-torus}
$T^{n}$ の点 $o\defeq p(0)$ での値 $\ell(v)\defeq v(o)$（$v\in C^{\infty}(T^{n})$）を考える。$\ell$ が $H^{k}$ ノルムについて有界（$|\ell(v)|\le A\|v\|_{H^{k}}$）であること、したがって $H^{-k}(T^{n})$ の元に一意に延びることは、$2k>n$ と同値であることを示せ。
:::

::: solution
$\Sigma_{N}\defeq\sum_{|m|_{\infty}\le N}(1+|m|^{2})^{-k}$, $\Sigma\defeq\lim_{N}\Sigma_{N}\in(0,\infty]$ とする。

**$\Sigma<\infty\iff2k>n$.** $|m|_{\infty}=j\ge1$ となる $m$ の個数は $(2j+1)^{n}-(2j-1)^{n}$ で、$(2j-1)^{n-1}\cdot2$ 以上 $2n(2j+1)^{n-1}$ 以下（平均値の定理）。その上で $j^{2}\le|m|^{2}\le nj^{2}$ なので、$\Sigma$ の $j$ の殻の和は $j^{n-1}(1+j^{2})^{-k}$ の正の定数倍の範囲にあり、$\sum_{j}j^{n-1-2k}$ が収束する条件 $2k-n+1>1$、すなわち $2k>n$ と同値。

**$2k>n$ ⇒ 有界.** $v\in C^{\infty}$ なら \ref{gl:torus-sobolev.2} から $\sum(1+|m|^{2})^{k}|\hat{v}(m)|^{2}\le C\|v\|_{H^{k}}^{2}$、コーシー–シュワルツから $\sum|\hat{v}(m)|\le\Sigma^{1/2}C^{1/2}\|v\|_{H^{k}}$。よって $S_{N}v$ は一様収束し、極限 $w$ は連続（各点の値は $\sum\hat{v}(m)e_{m}$）。$S_{N}v\to v$（$L^{2}$）なので $w=v$ a.e.、連続関数どうしなので $\{w\neq v\}$ は測度 $0$ の開集合で空（\ref{gl:riemannian-measure.2}）。$e_{m}(o)=1$ なので $|v(o)|=|\sum\hat{v}(m)|\le(C\Sigma)^{1/2}\|v\|_{H^{k}}$。稠密な $C^{\infty}$ の上で有界な線形汎関数は $H^{k}$ 全体にただ一つに延びる。

**有界 ⇒ $2k>n$.** $v_{N}\defeq\sum_{|m|_{\infty}\le N}(1+|m|^{2})^{-k}e_{m}$ は滑らかで $v_{N}(o)=\Sigma_{N}$。\ref{gl:torus-sobolev.2} から $c\|v_{N}\|_{H^{k}}^{2}\le\sum_{|m|_{\infty}\le N}(1+|m|^{2})^{k}(1+|m|^{2})^{-2k}=\Sigma_{N}$。$|\ell(v_{N})|\le A\|v_{N}\|_{H^{k}}$ から $\Sigma_{N}\le Ac^{-1/2}\Sigma_{N}^{1/2}$、すなわち $\Sigma_{N}\le A^{2}/c$ がすべての $N$ で成り立つので $\Sigma<\infty$、よって $2k>n$。
:::

::: problem {#gl:prob-nt-torus-weak-solution}
$f\in L^{2}(T^{n})$ とし、$u\in L^{2}(T^{n})$ が $(\Delta+1)u=f$ の弱解（\ref{gl:weak-solution-manifold}）であるとする。$\hat{u}(m)=\hat{f}(m)/(1+|m|^{2})$ を示し、$u\in H^{2}(T^{n})$ で、$L^{2}$ の元として $(\Delta+1)u=f$ が成り立つことを導け。
:::

::: solution
$\Delta^{t}=\Delta$（\ref{gl:formal-transpose-examples.1}）なので $(\Delta+1)^{t}=\Delta+1$。$\Delta=-\sum_{j}D_{j}^{2}$（\ref{gl:laplacian-examples.2}）から $(\Delta+1)e_{-m}=(1+|m|^{2})e_{-m}$。弱解の定義を $v=e_{-m}$ に使うと
$$
(1+|m|^{2})\int u\,e_{-m}\,d\mu_{g}=\int f\,e_{-m}\,d\mu_{g},
$$
両辺の積分は $(2\pi)^{n}\hat{u}(m)$, $(2\pi)^{n}\hat{f}(m)$ なので $\hat{u}(m)=\hat{f}(m)/(1+|m|^{2})$。よって $\sum(1+|m|^{2})^{2}|\hat{u}(m)|^{2}=\sum|\hat{f}(m)|^{2}<\infty$（\ref{gl:torus-fourier-basis.2}）で、\ref{gl:torus-sobolev.1} から $u\in H^{2}(T^{n})$。\ref{gl:operator-negative-extension.3} の後半から、$L^{2}$ の元として $(\Delta+1)u=f$。
:::
