# ソボレフの埋め込みとレリッヒの定理 {#gl:page-embeddings keywords="Sobolev embedding theorem on closed manifolds, W^{k,p}(M) into L^q for kp < n, W^{k,p}(M) into C^m(M) for k - n/p > m, H^k(M) into C^m(M) for k > n/2 + m, intersection of all H^k is C^infinity, Rellich theorem on closed manifolds, compact embeddings H^k into H^l for k > l including negative orders, Poincare inequality on closed connected manifolds, direct proofs on the torus by Fourier coefficients, ソボレフの埋め込み定理, レリッヒの定理, レリッヒ–コンドラショフの定理, ポアンカレの不等式, コンパクト埋め込み"}

前のページまでで、閉多様体 $M$ の上のソボレフ空間 $W^{k,p}(M)$ を局所化で定め（\ref{gl:page-sobolev-manifolds}）、負の階数の空間とトーラスでのフーリエ係数による特徴づけを調べた（\ref{gl:page-negative-sobolev-torus}）。このページでは、$\mathbb{R}^{n}$ で知られている二つの基本定理を閉多様体へ移す。一つは**ソボレフの埋め込み定理**で、「弱い意味で $k$ 回微分できて $p$ 乗可積分」という情報から、より高い可積分性や、古典的な意味での微分可能性が従う。とくに、すべての $H^{k}(M)$ に入る関数は滑らかで、これは後の系列で楕円正則性（弱解が滑らかであること）を示すときの最後の一歩になる。もう一つは**レリッヒの定理**で、包含 $H^{k}(M)\subset H^{l}(M)$（$k>l$）がコンパクト作用素であることを述べる。これは、閉多様体の上の楕円型作用素のスペクトルが離散的であることの源である。証明はどちらも、1 の分割で $\mathbb{R}^{n}$ の結果に帰着させる。レリッヒの定理の最初の応用であるポアンカレの不等式と、トーラスではこれらがフーリエ係数だけで直接示せることは、次のページで扱う。

## 記法と定義の確認 {#gl:sec-em-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（コンパクトで境界のない可微分多様体、$n\ge1$）、$g$ はリーマン計量、$\mu_{g}$ はリーマン測度（\ref{gl:riemannian-measure}）、$L^{p}(M)$ は \ref{gl:lp-manifold}。$M$ はコンパクトなので $\operatorname{vol}(M)=\mu_{g}(M)<\infty$（\ref{gl:riemannian-measure.3}）。空でない開集合の測度は正（\ref{gl:riemannian-measure.2}）なので、**$M$ 上の二つの連続関数が a.e. で等しければ、至る所で等しい**（等しくない点の集合は測度 $0$ の開集合で、空）。
- 局所化のデータ $\mathfrak{A}=(U_{j},x_{j},\rho_{j})_{j=1}^{N}$、座標表示 $f^{x}$ と $x^{*}w$、$W^{k,p}(M)$, $H^{k}(M)$、ノルム $\|\cdot\|_{k,p}$ と内積 $\langle\cdot,\cdot\rangle_{H^{k}}$ は \ref{gl:sobolev-manifold} と \ref{gl:sobolev-manifold-independence} のとおりで、ノルムは一つ固定した $\mathfrak{A}$ で測る。$K_{j}\defeq x_{j}(\operatorname{supp}\rho_{j})$ はコンパクトで、$u\in W^{k,p}(M)$ の**片** $f_{j}\defeq(\rho_{j}u)^{x_{j}}\in W^{k,p}(\mathbb{R}^{n})$ は $K_{j}$ の外で $0$、$|\alpha|\le k$ の $\partial^{\alpha}f_{j}$ も $K_{j}$ の外で $0$ である（\ref{gl:sobolev-local-operations.2}）。座標表示と $L^{p}$ ノルムの比較は \ref{gl:sm-chart-lp}（どの指数 $1\le p<\infty$ でも成り立つ）、切り出しと貼り付けは \ref{gl:sm-localization}、完備性と稠密性は \ref{gl:sobolev-manifold-complete}, \ref{gl:sobolev-manifold-density}。
- 負の階数の空間 $H^{-k}(M)$、対合 $\iota\colon L^{2}(M)\to H^{-k}(M)$、制限 $H^{-k}\to H^{-k-1}$ は \ref{gl:negative-sobolev}, \ref{gl:negative-sobolev-properties}。$H^{0}(M)=L^{2}(M)$ には $L^{2}$ のノルムを使う。
- $\mathbb{R}^{n}$ の結果：\ref{fa:gns-inequality}, \ref{fa:morrey-inequality}, \ref{fa:higher-embeddings}, \ref{fa:rellich-kondrachov}, \ref{fa:zero-gradient}, \ref{fa:test-dense-rn}。$p<n$ のとき $p^{*}\defeq\frac{np}{n-p}$。コンパクト作用素は \ref{fa:compact-operator}（「有界列の像が収束する部分列をもつ」の形で使う）と \ref{fa:compact-ideal}。$L^{p}$ の包含は \ref{meas:lp-inclusions}。
- トーラス $T^{n}$、$e_{m}$、フーリエ係数 $\hat{u}(m)$ は \ref{gl:sec-nt-torus} のとおり（問題でだけ使う）。
- **選択公理**：局所化のデータの存在（1 の分割）で従属選択公理（DC）を使う点は前のページと同じで、新しい選択は使わない。部分列は、引用する定理の証明の中の具体的な手順を有限回使って決まる。
:::

## ソボレフの埋め込み定理 {#gl:sec-em-embedding}

まず、比べる相手の $C^{m}$ 関数の空間とノルムを決める。

::: definition 多様体上の Cᵐ 関数と Cᵐ ノルム {#gl:cm-norm-manifold keywords="C^m functions on a manifold: u o x^{-1} is C^m in every chart; C^m norm defined by localizing data: sum over pieces of sup norms of derivatives up to order m" index="Cm 関数（多様体）|しーえむかんすうたようたい, Cm ノルム|しーえむのるむ"}
$m\ge0$ を整数とする。
1. 関数 $u\colon M\to\mathbb{C}$ が **$C^{m}$ 級**であるとは、$M$ のすべての座標近傍 $(U,x)$ について $u\circ x^{-1}$ が $x(U)$ の上で $C^{m}$ 級であることをいう。その全体を $C^{m}(M)$ と書く。
2. 局所化のデータ $\mathfrak{B}=(V_{i},y_{i},\sigma_{i})_{i=1}^{N'}$ について、$u\in C^{m}(M)$ の **$C^{m}$ ノルム**を
$$
\|u\|_{C^{m};\mathfrak{B}}\defeq\sum_{i=1}^{N'}\sum_{|\alpha|\le m}\sup_{\mathbb{R}^{n}}\bigl|\partial^{\alpha}(\sigma_{i}u)^{y_{i}}\bigr|
$$
と定める。
:::

::: intuition
多様体の上の関数が $m$ 回連続微分できるとは、どの座標で見てもそうであることで、その大きさは、1 の分割で切った各片の $m$ 階までの導関数の最大値を足して測る。
:::

座標変換は $C^{\infty}$ 級なので、$C^{m}$ 級であることは $M$ を覆う座標近傍の族で確かめれば足り、$C^{\infty}(M)=\bigcap_{m}C^{m}(M)$（\ref{mfd:smooth-map.1}）。$u\in C^{m}(M)$ なら $(\sigma_{i}u)^{y_{i}}$ は $y_{i}(V_{i})$ の上で $C^{m}$ 級で、コンパクト集合 $y_{i}(\operatorname{supp}\sigma_{i})$ の外で $0$ なので、$\mathbb{R}^{n}$ 全体で $C^{m}$ 級で台がコンパクトであり、右辺は有限である。$|u|\le\sum_{i}|\sigma_{i}u|$ から $\sup_{M}|u|\le\|u\|_{C^{0};\mathfrak{B}}$ で、とくに $\|\cdot\|_{C^{m};\mathfrak{B}}$ はノルムである。

次に $\mathbb{R}^{n}$ の側の準備をする。\ref{fa:higher-embeddings.2} は $\frac np$ が整数でないことを仮定するので、台がコンパクトな関数に限って、その仮定を外す。

::: lemma 台がコンパクトなソボレフ関数の連続性 {#gl:em-rn-continuous keywords="for w in W^{k,p}(R^n) vanishing outside a fixed compact set K, if k - n/p > m, or p = 1 and k - n >= m, then w has a C^m representative vanishing outside K with sum of sup norms of derivatives up to order m bounded by C ||w||_{W^{k,p}}; integer n/p handled by lowering p on the compact set" index="台がコンパクトなソボレフ関数の連続性|だいがこんぱくとなそぼれふかんすうのれんぞくせい"}
$k\ge1$, $m\ge0$ を整数、$1\le p<\infty$、$K\subset\mathbb{R}^{n}$ をコンパクト集合とし、次のどちらかを仮定する。
1. $k-\frac np>m$。
2. $p=1$ かつ $k-n\ge m$。

このとき定数 $C$ があって、$K$ の外で $0$ となるすべての $w\in W^{k,p}(\mathbb{R}^{n})$ は、$K$ の外で $0$ となる $C^{m}$ 級の代表元 $\tilde{w}$ をもち、$\sum_{|\alpha|\le m}\sup|\partial^{\alpha}\tilde{w}|\le C\|w\|_{W^{k,p}}$。
:::

::: proof
台についての主張は、どの場合も最後にまとめて示す：連続な $\tilde{w}$ が開集合 $\mathbb{R}^{n}\setminus K$ の上で a.e. $0$ なら、そこで至る所 $0$ である（$\tilde{w}(z)\neq0$ なら $z$ のまわりの球の上で $\tilde{w}\neq0$ となり、球の測度は正）。

**Step 1（$\frac np$ が整数でない）.** 【主張：1 を仮定し $\frac np\notin\mathbb{Z}$ なら結論が成り立つ】$m_{0}\defeq k-\lfloor\frac np\rfloor-1$ とおく。$\lfloor\frac np\rfloor<\frac np$ なので $m_{0}>k-\frac np-1>m-1$、$m_{0}$ と $m$ は整数なので $m_{0}\ge m\ge0$。\ref{fa:higher-embeddings.2} から $w$ は $C^{m_{0}}$ 級の代表元をもち、$\sum_{|\alpha|\le m_{0}}\sup|\partial^{\alpha}\tilde{w}|\le C\|w\|_{W^{k,p}}$。和を $|\alpha|\le m$ に減らせばよい（ここでは $K$ は使わない）。

**Step 2（$\frac np$ が整数で $p>1$）.** 【主張：1 を仮定し、$\frac np\in\mathbb{Z}$, $p>1$ なら、$1<p'<p$ で $\frac n{p'}\notin\mathbb{Z}$, $k-\frac n{p'}>m$ となる $p'$ と定数 $C'$ があって $\|w\|_{W^{k,p'}}\le C'\|w\|_{W^{k,p}}$】$\frac np$ は $n$ より小さい整数なので $\frac np\le n-1$。$\delta\defeq\frac12\min(1,k-m-\frac np)>0$ とし、$\frac n{p'}=\frac np+\delta$ で $p'$ を定める。$\frac np<\frac n{p'}<\frac np+1$ なので $\frac n{p'}$ は整数でなく、$\frac n{p'}<n$ から $p'>1$、$k-\frac n{p'}=(k-\frac np-m)-\delta+m>m$。$\lambda(K)=0$ なら $w=0$ で明らか。そうでなければ、$\partial^{\alpha}w$（$|\alpha|\le k$）は $K$ の外で $0$ なので（\ref{gl:sobolev-local-operations.2}）、\ref{meas:lp-inclusions.1} を有限測度空間 $K$ に使って
$$
\|\partial^{\alpha}w\|_{L^{p'}(\mathbb{R}^{n})}=\|\partial^{\alpha}w\|_{L^{p'}(K)}\le\lambda(K)^{\frac1{p'}-\frac1p}\|\partial^{\alpha}w\|_{L^{p}(K)}.
$$
よって $w\in W^{k,p'}(\mathbb{R}^{n})$ で、$\|w\|_{W^{k,p'}}\le\sum_{|\alpha|\le k}\|\partial^{\alpha}w\|_{p'}\le\lambda(K)^{\frac1{p'}-\frac1p}A\|w\|_{W^{k,p}}$（$A$ は $|\alpha|\le k$ の多重指数の個数）。この $p'$ に Step 1 を使えば結論が出る。

**Step 3（$p=1$）.** 【主張：2 を仮定すれば結論が成り立つ】$p=1$ なら $\frac np=n$ は整数で、1 からも $k-n\ge m+1\ge m$ が出るので、2 だけを仮定すればよい。$v\in C_{c}^{\infty}(\mathbb{R}^{n})$ について、各変数ごとに微分積分学の基本定理を使うと（台がコンパクトなので下端の値は $0$）
$$
\begin{aligned}v(z)&=\int_{-\infty}^{z_{1}}\!\!\cdots\int_{-\infty}^{z_{n}}\partial_{1}\cdots\partial_{n}v(y)\,dy_{n}\cdots dy_{1},\\ \sup|v|&\le\|\partial_{1}\cdots\partial_{n}v\|_{L^{1}}.\end{aligned}
$$
これを $\partial^{\alpha}v$（$|\alpha|\le m$）に使うと、$|\alpha|+n\le k$ なので $\sup|\partial^{\alpha}v|\le\|v\|_{W^{k,1}}$。\ref{fa:test-dense-rn} から $v_{i}\in C_{c}^{\infty}$, $v_{i}\to w$（$W^{k,1}$）をとると、$|\alpha|\le m$ の $\partial^{\alpha}v_{i}$ は一様コーシー列なので一様収束し、一様収束と微分の交換（\ref{calc:uniform-derivative} を各変数に使う）から極限 $\tilde{w}$ は $C^{m}$ 級で $\partial^{\alpha}\tilde{w}=\lim\partial^{\alpha}v_{i}$。各球 $B$ の上で $v_{i}\to\tilde{w}$ は一様収束なので $L^{1}(B)$ でも収束し、$v_{i}\to w$（$L^{1}$）と合わせて $\tilde{w}=w$ が $B$ の上で a.e.、球の可算個で $\mathbb{R}^{n}$ を覆えば $\tilde{w}$ は $w$ の代表元。評価は $\sum_{|\alpha|\le m}\sup|\partial^{\alpha}\tilde{w}|=\lim_{i}\sum_{|\alpha|\le m}\sup|\partial^{\alpha}v_{i}|\le A\|w\|_{W^{k,1}}$。

::: hypcheck
- **$w$ が $K$ の外で $0$**：Step 2 でヘルダーの不等式により $p$ を下げるのに使った（Step 1・3 では使わない）。$\mathbb{R}^{n}$ 全体では $L^{p}\not\subset L^{p'}$（\ref{meas:lp-inclusions.3}）なので、この下げ方はできない。
- **$k-\frac np>m$ の不等号が真**：Step 2 で $\delta>0$ をとるのに使った。$\frac np$ が整数で $p>1$ のとき $k-\frac np=m$ では偽：$n\ge2$, $k=1$, $p=n$, $m=0$ で、$\log\log(1+\frac1{|z|})$ を切り落とした関数は $W^{1,n}$ に入るが有界でない（\ref{fa:higher-embeddings} の後の hypcheck）。
- **$p=1$**：Step 3 で、$L^{1}$ ノルムが $n$ 回の積分で上限を抑えることに使った。このときだけ等号 $k-n=m$ が許される。
- **公理**：選択公理は使わない（近似列は \ref{fa:test-dense-rn} の具体的な構成で決まる）。
:::
:::

::: lemma 閉多様体での指数の引き下げ {#gl:em-lower-exponent keywords="on a closed manifold W^{k,p}(M) is continuously contained in W^{k,r}(M) for 1 <= r <= p, by Holder's inequality on the compact supports of the pieces" index="指数の引き下げ（ソボレフ空間）|しすうのひきさげそぼれふくうかん"}
$1\le r\le p<\infty$ なら $W^{k,p}(M)\subset W^{k,r}(M)$ で、定数 $C$ があって $\|u\|_{k,r}\le C\|u\|_{k,p}$。
:::

::: proof
$\mu_{g}(M)<\infty$ なので \ref{meas:lp-inclusions.1} から $u\in L^{r}(M)$。片 $f_{j}$ とその弱微分 $\partial^{\alpha}f_{j}$（$|\alpha|\le k$）は $K_{j}$ の外で $0$ なので、\ref{gl:em-rn-continuous} の Step 2 と同じヘルダーの評価から $\|\partial^{\alpha}f_{j}\|_{r}\le\lambda(K_{j})^{\frac1r-\frac1p}\|\partial^{\alpha}f_{j}\|_{p}$（$\lambda(K_{j})=0$ なら両辺 $0$）。よって $f_{j}\in W^{k,r}(\mathbb{R}^{n})$, $\|f_{j}\|_{W^{k,r}}\le C_{j}\|f_{j}\|_{W^{k,p}}$ で、$j$ について足せばよい。
:::

::: theorem 閉多様体上のソボレフの埋め込み定理 {#gl:sobolev-embedding-manifold refname="閉多様体上のソボレフの埋め込み定理" keywords="Sobolev embedding theorem on a closed manifold: W^{k,p}(M) into L^q(M) for 1/q >= 1/p - k/n when kp < n; into every L^q when kp = n; into C^m(M) with ||u||_{C^m} <= C ||u||_{k,p} when k - n/p > m (or p = 1 and k - n >= m)" index="ソボレフの埋め込み定理（閉多様体）|そぼれふのうめこみていりへいたようたい, 連続な埋め込み|れんぞくなうめこみ"}
$M$ を $n$ 次元の閉多様体、$k\ge1$ を整数、$1\le p<\infty$ とする。
1. $kp<n$ なら、$\frac1{p_{k}}\defeq\frac1p-\frac kn$ と $1\le q\le p_{k}$ について $W^{k,p}(M)\subset L^{q}(M)$ で、定数 $C$ があって $\|u\|_{L^{q}}\le C\|u\|_{k,p}$。
2. $kp=n$ なら、すべての $1\le q<\infty$ について 1 の包含と評価が成り立つ。
3. 整数 $m\ge0$ について $k-\frac np>m$（または $p=1$ かつ $k-n\ge m$）なら、$u\in W^{k,p}(M)$ は $C^{m}$ 級の代表元 $\tilde{u}$ をただ一つもち、任意の局所化のデータ $\mathfrak{B}$ について、定数 $C$ があって $\|\tilde{u}\|_{C^{m};\mathfrak{B}}\le C\|u\|_{k,p}$。とくに $kp>n$ なら $W^{k,p}(M)\subset C^{0}(M)$。
:::

::: intuition
閉多様体の上でも、弱い意味で多く微分できる関数ほど性質がよい。微分の回数 $k$ から「次元を指数で割った値」$\frac np$ を引いた量が、$0$ より小さければ可積分性の指数が上がり、$m$ より大きければ $m$ 回連続微分できる関数とみなせる。
:::

::: proof
$u\in W^{k,p}(M)$ の片を $f_{j}=(\rho_{j}u)^{x_{j}}$ とする。$u=\sum_{j}\rho_{j}u$、$\rho_{j}u=x_{j}^{*}f_{j}$ である。

**Step 1.** 【主張：1 が成り立つ】\ref{fa:higher-embeddings.1} から $f_{j}\in L^{p_{k}}(\mathbb{R}^{n})$, $\|f_{j}\|_{p_{k}}\le C\|f_{j}\|_{W^{k,p}}$（$kp<n$ なので $p_{k}<\infty$）。$\rho_{j}u$ は $\operatorname{supp}\rho_{j}$ の外で $0$ なので、\ref{gl:sm-chart-lp.2}（指数 $p_{k}$）から $\|\rho_{j}u\|_{L^{p_{k}}(M)}\le c^{-1}\|f_{j}\|_{p_{k}}$。$j$ について足して $\|u\|_{L^{p_{k}}}\le C\sum_{j}\|f_{j}\|_{W^{k,p}}=C\|u\|_{k,p}$。$q\le p_{k}$ なら \ref{meas:lp-inclusions.1} から $\|u\|_{q}\le\operatorname{vol}(M)^{\frac1q-\frac1{p_{k}}}\|u\|_{p_{k}}$。

**Step 2.** 【主張：3 の仮定のもとで、$w_{j}\in C^{m}(\mathbb{R}^{n})$ が $K_{j}$ の外で $0$ となる $f_{j}$ の代表元なら、$\tilde{u}\defeq\sum_{j}x_{j}^{*}w_{j}$ は $C^{m}(M)$ に入る $u$ の代表元で、$\sum_{|\alpha|\le m}\sup|\partial^{\alpha}w_{j}|\le C\|f_{j}\|_{W^{k,p}}$ となるものがとれる】$w_{j}$ の存在と評価は \ref{gl:em-rn-continuous}（$K=K_{j}$）。$x_{j}^{*}w_{j}$ は $U_{j}$ の上で $w_{j}\circ x_{j}$ なので $C^{m}$ 級で、コンパクト集合 $\operatorname{supp}\rho_{j}$（$M$ の閉集合）の外で $0$ なので、開集合 $M\setminus\operatorname{supp}\rho_{j}$ の上でも $C^{m}$ 級である。この二つの開集合は $M$ を覆うので $x_{j}^{*}w_{j}\in C^{m}(M)$。また $x_{j}^{*}w_{j}$ と $x_{j}^{*}f_{j}=\rho_{j}u$ は、$x_{j}$ で零集合に対応する集合の外で等しいので $\mu_{g}$-a.e. で等しい（\ref{gl:sm-chart-lp.1}）。足して $\tilde{u}=u$（a.e.）。代表元の一意性は、記法の節の「連続関数が a.e. で等しければ等しい」から。

**Step 3.** 【主張：$\|\tilde{u}\|_{C^{m};\mathfrak{B}}\le C\|u\|_{k,p}$】$\mathfrak{B}=(V_{i},y_{i},\sigma_{i})$ とし、$h_{ij}\defeq(\sigma_{i}\,x_{j}^{*}w_{j})^{y_{i}}$ とおく。$L_{ij}\defeq y_{i}(\operatorname{supp}\sigma_{i}\cap\operatorname{supp}\rho_{j})$ はコンパクトで開集合 $y_{i}(V_{i}\cap U_{j})$ に含まれ、$h_{ij}$ は $L_{ij}$ の外で $0$、$y_{i}(V_{i}\cap U_{j})$ の上で $h_{ij}=(\sigma_{i}\circ y_{i}^{-1})\cdot(w_{j}\circ\tau)$（$\tau\defeq x_{j}\circ y_{i}^{-1}$）。連鎖律と積の微分の公式を $|\alpha|$ についての帰納法で使うと、$\partial^{\alpha}(w_{j}\circ\tau)$（$|\alpha|\le m$）は、$(\partial^{\beta}w_{j})\circ\tau$（$|\beta|\le|\alpha|$）に $\tau$ の $|\alpha|$ 階までの導関数の多項式を掛けたものの和である。$\tau$ と $\sigma_{i}\circ y_{i}^{-1}$ の $m$ 階までの導関数はコンパクト集合 $L_{ij}$ の上で有界なので、ライプニッツ則から
$$
\sum_{|\alpha|\le m}\sup|\partial^{\alpha}h_{ij}|\le C_{ij}\sum_{|\beta|\le m}\sup|\partial^{\beta}w_{j}|\le C'_{ij}\|f_{j}\|_{W^{k,p}}.
$$
$\sigma_{i}\tilde{u}=\sum_{j}\sigma_{i}x_{j}^{*}w_{j}$ なので $(\sigma_{i}\tilde{u})^{y_{i}}=\sum_{j}h_{ij}$ で、$i$, $j$ について足せば $\|\tilde{u}\|_{C^{m};\mathfrak{B}}\le\max_{i,j}C'_{ij}\cdot N'\sum_{j}\|f_{j}\|_{W^{k,p}}=C\|u\|_{k,p}$。Step 2 と合わせて 3 が出る。$kp>n$ は $m=0$ の場合。

**Step 4.** 【主張：2 が成り立つ】$p>1$ のとき：$q<\infty$ を与える。$1\le r<p$ なら $kr<kp=n$ で、$r\uparrow p$ のとき $n-kr\downarrow0$ なので $\frac{nr}{n-kr}\to\infty$。そこで $1\le r<p$ を $\frac{nr}{n-kr}\ge q$ となるようにとると、\ref{gl:em-lower-exponent} と 1（$r$ について）から $\|u\|_{q}\le C\|u\|_{k,r}\le C'\|u\|_{k,p}$。$p=1$ のとき：$k=n$ なので 3（$p=1$, $m=0$）から $\sup|\tilde{u}|\le\|\tilde{u}\|_{C^{0};\mathfrak{A}}\le C\|u\|_{k,1}$、よって $\|u\|_{q}\le\operatorname{vol}(M)^{1/q}C\|u\|_{k,1}$。

::: hypcheck
- **$M$ がコンパクト**：片を有限個にし、$\operatorname{vol}(M)<\infty$ で $L^{q}$ の指数を下げ（Step 1・4）、$\tau$ の導関数をコンパクト集合の上で抑える（Step 3）のに使った。外すと 1 の「$q\le p_{k}$」は偽：$M=\mathbb{R}^{n}$ で $L^{q}\not\supset L^{p}$（$q<p$）の例として、$\beta$ を隆起関数とし $u_{R}(z)\defeq\beta(z/R)$ とすると $\|u_{R}\|_{W^{k,p}}$ は $R^{n/p}$ 程度、$\|u_{R}\|_{q}$ は $R^{n/q}$ 程度で、$q<p$ なら比は $R\to\infty$ で発散する。
- **境界がないこと**：$\operatorname{supp}\rho_{j}$ が座標の像の内部のコンパクト集合に写ることを Step 2・3 で使った。境界つき領域では、$\mathbb{R}^{n}$ の \ref{fa:bounded-domain-embedding} と同じく延長作用素（\ref{fa:extension-theorem} の多様体版）が要る。
- **$k-\frac np>m$**：\ref{gl:em-rn-continuous} の hypcheck のとおり、$\frac np$ が整数で $p>1$ なら等号では偽。$p=1$ だけは等号が許される。
- **公理**：新しい選択は使わない（局所化のデータの存在の DC を除く）。
:::
:::

::: supplement
**前提を変えると.** $kp=n$, $p>1$ のときは 2 のとおりすべての $L^{q}$（$q<\infty$）に入るが $L^{\infty}$ には入らない：座標近傍の中で $\log\log(1+\frac1{|z|})$ を切り落として貼り付けた関数（\ref{gl:sm-localization.2}）は $W^{1,n}(M)$ に入るが有界でない。非コンパクトな完備リーマン多様体では、指数を下げる包含（\ref{gl:em-lower-exponent}）がなくなるうえ、$p<n$ の埋め込み $W^{1,p}\subset L^{p^{*}}$ も、半径 $1$ の球の体積が一様に下から抑えられないような多様体では成り立たないことが知られている（ここでは証明しない）。

**似た定理.** $\mathbb{R}^{n}$ では \ref{fa:gns-inequality}, \ref{fa:morrey-inequality}, \ref{fa:higher-embeddings} がこの定理の局所版で、3 の代表元の $m$ 階の導関数は、$\frac np$ が整数でなければ各座標で指数 $\lfloor\frac np\rfloor+1-\frac np$ のヘルダー連続性ももつ（\ref{fa:higher-embeddings.2} を片に使えばわかる）。トーラスでの $p=2$ の場合はフーリエ係数だけで示せる（次のページの \see{gl:torus-direct}）。

**高い視点：為替レートとしての次元.** ソボレフの埋め込みは、「$1$ 回分の微分」と「可積分性の指数」が、次元 $n$ を為替レートとして交換できることを述べる。$W^{k,p}$ の「通貨価値」は $k-\frac np$ で、これが $m$ を超えれば $C^{m}$ という硬貨に両替できる。閉多様体は「小さな部屋」なので、指数を下げる両替（$L^{p}\to L^{r}$, $r<p$）は手数料なしでいつでもできる。$\mathbb{R}^{n}$ のように無限に広い部屋では、薄く広がった関数があるので、この下向きの両替ができない。
:::

::: corollary H^k と滑らかな関数 {#gl:hk-smooth keywords="H^k(M) is contained in C^m(M) when k > n/2 + m; the intersection of all W^{k,p}(M) (in particular of all H^k(M)) is C^infinity(M); used to conclude smoothness in elliptic regularity" index="ソボレフ空間の共通部分と滑らかな関数|そぼれふくうかんのきょうつうぶぶんとなめらかなかんすう"}
$M$ を $n$ 次元の閉多様体とする。
1. $k>\frac n2+m$ なら $H^{k}(M)\subset C^{m}(M)$（代表元をとる意味で）で、$\|\tilde{u}\|_{C^{m};\mathfrak{B}}\le C\|u\|_{H^{k}}$。
2. $1\le p<\infty$ について $\bigcap_{k\ge0}W^{k,p}(M)=C^{\infty}(M)$。すなわち、すべての $W^{k,p}(M)$ に入る $u$ は滑らかな代表元をただ一つもち、逆に滑らかな関数はすべての $W^{k,p}(M)$ に入る。とくに $\bigcap_{k}H^{k}(M)=C^{\infty}(M)$。
:::

::: intuition
二乗可積分の意味で次元の半分より $m$ 回多く微分できる関数は、$m$ 回連続微分でき、あらゆる回数だけ弱微分できる関数は滑らかである。
:::

::: proof
**1.** $p=2$ で $k-\frac n2>m$ なので、\ref{gl:sobolev-embedding-manifold.3} そのもの（$\|\cdot\|_{H^{k}}$ と $\|\cdot\|_{k,2}$ は同値）。

**2.** $C^{\infty}(M)\subset W^{k,p}(M)$ は \ref{gl:sobolev-manifold} の後の注意。逆に $u$ がすべての $W^{k,p}(M)$ に入るとする。各 $m$ について $k>\frac np+m$ となる $k$ をとると、\ref{gl:sobolev-embedding-manifold.3} から $C^{m}$ 級の代表元 $\tilde{u}_{m}$ がある。$\tilde{u}_{m}$ と $\tilde{u}_{0}$ はどちらも連続で a.e. で等しいので、至る所等しい。よって $\tilde{u}_{0}$ はすべての $m$ で $C^{m}$ 級、すなわち滑らかである。一意性も連続な代表元の一意性から。
:::

::: supplement
**使い方.** 楕円型作用素 $P$ の弱解 $u$ について「$Pu\in H^{s}$ なら $u\in H^{s+2}$」（楕円正則性。後の系列で示す）が示せれば、$Pu$ が滑らかなとき $u$ はすべての $H^{k}$ に入り、2 から滑らかになる。「各段階は $H^{k}$ のヒルベルト空間の議論で行い、最後に一度だけ埋め込みで古典的な滑らかさに戻る」というのが関数解析的な手法の型である。

**前提を変えると.** 1 の $k>\frac n2+m$ は最良である：トーラスでは、点での値が $H^{k}$ ノルムで抑えられることと $2k>n$ は同値だった（\ref{gl:prob-nt-delta-torus}）。2 で $p=\infty$ を許しても結論は同じだが（$W^{k,\infty}\subset W^{k,p}$）、局所化のデータによる $W^{k,\infty}$ の扱いはこの系列では省いている。

**似た定理.** 2 から、$\bigcap_{k}W^{k,p}(M)$ は $p$ によらない。$\mathbb{R}^{n}$ では事情が違い、$\bigcap_{k}H^{k}(\mathbb{R}^{n})$ は「滑らかで、すべての導関数が $L^{2}$ に入る関数」の全体で、$C^{\infty}(\mathbb{R}^{n})$ より真に小さい（定数関数 $1$ は入らない）。閉多様体で等号になるのは、コンパクト性から滑らかな関数がすべての $L^{p}$ に自動的に入るからである。

**高い視点：ふるいを重ねる.** $H^{1}\supset H^{2}\supset\cdots$ は、目がだんだん細かくなるふるいの列で、すべてのふるいを通り抜けた関数だけが残る。埋め込みは「十分細かいふるいを通ったものは、もう $C^{m}$ の形をしている」ことを保証し、すべてを通ったものは滑らかな形しか残らない。ヒルベルト空間のふるいは扱いやすいので、方程式の解はまずふるいで選り分け、最後に形を確かめる。
:::

## レリッヒの定理 {#gl:sec-em-rellich}

::: theorem 閉多様体上のレリッヒの定理 {#gl:rellich-manifold refname="閉多様体上のレリッヒの定理" keywords="Rellich theorem on closed manifolds: W^{1,p}(M) into L^q(M) is compact for q < p* (any q if p >= n); W^{k,p}(M) into W^{l,p}(M) is compact for k > l >= 0; H^k(M) into H^l(M) is compact for all integers k > l including negative orders; proof by localization, Rellich-Kondrachov on balls and the Hilbert adjoint" index="レリッヒの定理（閉多様体）|れりっひのていりへいたようたい, コンパクト埋め込み（閉多様体）|こんぱくとうめこみへいたようたい"}
$M$ を $n$ 次元の閉多様体、$1\le p<\infty$ とする。
1. $p<n$ なら $1\le q<p^{*}$、$p\ge n$ なら $1\le q<\infty$ について、$W^{1,p}(M)$ の有界列は $L^{q}(M)$ で収束する部分列をもつ。とくに（$q=p$）包含 $W^{1,p}(M)\to L^{p}(M)$ はコンパクト作用素である。
2. 整数 $k>l\ge0$ について、包含 $W^{k,p}(M)\to W^{l,p}(M)$ はコンパクト作用素である。
3. 整数 $k>l$（負でもよい）について、包含 $H^{k}(M)\to H^{l}(M)$ はコンパクト作用素である。ここで $l<0$ のときの「包含」は、包含 $H^{k}\subset H^{0}=L^{2}$（$k\ge0$）、対合 $\iota\colon L^{2}\to H^{-1}$、制限 $H^{-j}\to H^{-j-1}$（\ref{gl:negative-sobolev-properties.2}・\ref[4]{gl:negative-sobolev-properties.4}）を順に合成した単射である。
:::

::: intuition
閉多様体の上では、微分を 1 回分余分に抑えられた関数の列は、弱いノルムで見ると必ず収束する部分列をもつ。微分の階数が負の空間でも、階数を 1 下げる包含は同じ性質をもつ。
:::

::: proof
**Step 1（$\mathbb{R}^{n}$ の局所版）.** 【主張：$K\subset\mathbb{R}^{n}$ をコンパクト集合、$q$ を 1 の範囲とする。$K$ の外で $0$ となる $W^{1,p}(\mathbb{R}^{n})$ の有界列 $(h_{i})$ は、$L^{q}(\mathbb{R}^{n})$ で収束する部分列をもつ】$K$ を含む開球 $B$ をとる。$B$ は $C^{1}$ 境界をもつ有界開集合で、$h_{i}\restr{B}$ は $W^{1,p}(B)$ の有界列（\ref{gl:sobolev-local-operations.1}）。\ref{fa:rellich-kondrachov.1}（$p<n$）または \ref{fa:rellich-kondrachov.2}（$p\ge n$）から、部分列が $L^{q}(B)$ で $h$ に収束する。$h_{i}$ は $B\setminus K$ で a.e. $0$ なので $h$ も $B\setminus K$ で a.e. $0$ で、$h$ を $B$ の外で $0$ と延ばせば、部分列は $L^{q}(\mathbb{R}^{n})$ で $h$ に収束する（$B$ の外ではどれも $0$）。

**Step 2.** 【主張：1 が成り立つ】$(u_{i})$ を $W^{1,p}(M)$ の有界列とし、片を $f_{ij}\defeq(\rho_{j}u_{i})^{x_{j}}$ とする。$\|f_{ij}\|_{W^{1,p}}\le\|u_{i}\|_{1,p}$ で、$f_{ij}$ は $K_{j}$ の外で $0$。$j=1$ について Step 1 で部分列をとり、その部分列について $j=2$ で部分列をとり、と $N$ 回繰り返すと、部分列（記号を変えずに $(u_{i})$ と書く）で、すべての $j$ について $(f_{ij})_{i}$ が $L^{q}(\mathbb{R}^{n})$ のコーシー列となるものが得られる。\ref{gl:sobolev-embedding-manifold}（$p<n$ なら 1 で $q<p^{*}=p_{1}$、$p=n$ なら 2、$p>n$ なら 3 で $m=0$）から $u_{i}\in L^{q}(M)$ で、\ref{gl:sm-chart-lp.2}（指数 $q$）から
$$
\|u_{i}-u_{i'}\|_{L^{q}(M)}\le\sum_{j}\|\rho_{j}(u_{i}-u_{i'})\|_{L^{q}(M)}\le c^{-1}\sum_{j}\|f_{ij}-f_{i'j}\|_{L^{q}(\mathbb{R}^{n})}\to0.
$$
$L^{q}(M)$ は完備（\ref{meas:riesz-fischer}）なので部分列は収束する。$q=p$ は 1 の範囲に入る（$p<n$ なら $p<p^{*}$）ので、包含 $W^{1,p}\to L^{p}$（有界、\ref{gl:sobolev-manifold-independence.3}）はコンパクト。

**Step 3.** 【主張：2 が成り立つ】まず $k=l+1$ とする。$(u_{i})$ を $W^{l+1,p}(M)$ の有界列とすると、$|\alpha|\le l$ について $\partial^{\alpha}f_{ij}\in W^{1,p}(\mathbb{R}^{n})$ で $\|\partial^{\alpha}f_{ij}\|_{W^{1,p}}\le\|f_{ij}\|_{W^{l+1,p}}\le\|u_{i}\|_{l+1,p}$（$\partial^{\alpha}f_{ij}$ の 1 階の弱微分は $\partial^{\alpha+e_{s}}f_{ij}$）、しかも $K_{j}$ の外で $0$。有限個の組 $(j,\alpha)$ について順に Step 1（$q=p$）で部分列をとると、すべての $(j,\alpha)$ で $(\partial^{\alpha}f_{ij})_{i}$ が $L^{p}(\mathbb{R}^{n})$ のコーシー列となる部分列が得られ、
$$
\|u_{i}-u_{i'}\|_{l,p}=\sum_{j}\|f_{ij}-f_{i'j}\|_{W^{l,p}}\le\sum_{j}\sum_{|\alpha|\le l}\|\partial^{\alpha}f_{ij}-\partial^{\alpha}f_{i'j}\|_{L^{p}}\to0.
$$
$W^{l,p}(M)$ は完備（\ref{gl:sobolev-manifold-complete.1}）なので収束する。一般の $k>l$ では、包含 $W^{k,p}\to W^{l+1,p}$ は有界（\ref{gl:sobolev-manifold-independence.3}）なので、\ref{fa:compact-ideal.3} からコンパクト作用素との合成はコンパクト。

**Step 4.** 【主張：$j\ge0$ について、$r_{j}\colon H^{-j}(M)\to H^{-j-1}(M)$（$j=0$ なら $\iota$、$j\ge1$ なら制限）はコンパクト作用素】$J\colon H^{j+1}(M)\to H^{j}(M)$ を包含とすると、Step 3（$p=2$）からコンパクト。$w\in H^{j}$ について $v\mapsto\langle Jv,w\rangle_{H^{j}}$ は $H^{j+1}$ 上の有界線形汎関数なので、\ref{fa:riesz-representation} から $\langle Jv,w\rangle_{H^{j}}=\langle v,J^{*}w\rangle_{H^{j+1}}$ となる $J^{*}w\in H^{j+1}$ がただ一つあり、$J^{*}\colon H^{j}\to H^{j+1}$ は線形で $\|J^{*}w\|\le\|J\|\|w\|$（$v=J^{*}w$ とおいてコーシー–シュワルツ）。$T\in H^{-j}$ に対し、$j\ge1$ なら \ref{fa:riesz-representation} から $T=\langle\cdot,w_{T}\rangle_{H^{j}}$, $\|w_{T}\|_{H^{j}}=\|T\|_{H^{-j}}$、$j=0$ で $T=f\in L^{2}$ なら $\langle\iota f,v\rangle=\int fv\,d\mu_{g}=\langle v,\bar{f}\rangle_{L^{2}}$ なので $w_{T}\defeq\bar{f}$。どちらでも $v\in H^{j+1}$ について $\langle r_{j}T,v\rangle=\langle v,J^{*}w_{T}\rangle_{H^{j+1}}$ なので、双対ノルムの定義とコーシー–シュワルツ（等号は $v=J^{*}w_{T}$ の定数倍）から
$$
\|r_{j}T-r_{j}T'\|_{H^{-j-1}}=\|J^{*}(w_{T}-w_{T'})\|_{H^{j+1}}.
$$
$(T_{i})$ を有界列とし $w_{i}\defeq w_{T_{i}}$（$\|w_{i}\|\le B$）とする。$JJ^{*}\colon H^{j}\to H^{j}$ はコンパクト（\ref{fa:compact-ideal.3}）なので、部分列で $(JJ^{*}w_{i})$ が $H^{j}$ のコーシー列となる。すると
$$
\|J^{*}(w_{i}-w_{i'})\|_{H^{j+1}}^{2}=\langle JJ^{*}(w_{i}-w_{i'}),w_{i}-w_{i'}\rangle_{H^{j}}\le2B\,\|JJ^{*}(w_{i}-w_{i'})\|_{H^{j}}\to0
$$
なので $(r_{j}T_{i})$ は $H^{-j-1}$ のコーシー列で、$H^{-j-1}$ は完備（\ref{gl:negative-sobolev-properties.1}）なので収束する。

**Step 5.** 【主張：3 が成り立つ】$l\ge0$ なら Step 3（$p=2$）。$l<0$ なら $j\defeq-l-1\ge0$ とおくと、3 の包含は、$H^{k}\to H^{l+1}=H^{-j}$ への写像（$k\ge l+1$ なので、包含・$\iota$・制限を順に合成したもの。$k=l+1$ なら恒等写像）と $r_{j}\colon H^{-j}\to H^{l}$ の合成である。前者は有界（\ref{gl:sobolev-manifold-independence.3}・\ref{gl:negative-sobolev-properties.2}・\ref[4]{gl:negative-sobolev-properties.4}）、後者は Step 4 からコンパクトなので、\ref{fa:compact-ideal.3} から合成もコンパクト。

::: hypcheck
- **$M$ がコンパクト**：片を有限個にして部分列の取り出しを有限回で終わらせ（Step 2・3）、各片の台を有界にして \ref{fa:rellich-kondrachov} を使うのに使った。外すと偽：$M=\mathbb{R}^{n}$ で、固定した隆起関数の平行移動 $\beta(\cdot-ie_{1})$ は $H^{k}$ で有界だが、$L^{2}$ で収束する部分列をもたない（互いの距離が一定）。
- **$k>l$**：恒等写像 $H^{k}\to H^{k}$ はコンパクトでない（\ref{gl:prob-em-torus-noncompact}、一般には \ref{fa:compact-unit-ball}）。
- **$q<p^{*}$**：Step 1 で \ref{fa:rellich-kondrachov} に使った。$q=p^{*}$ では、一つの座標近傍の中で $\lambda^{n/p^{*}}h(\lambda z)$ と縮めて貼り付けた列が反例になる（$\mathbb{R}^{n}$ の場合と同じ、\ref{fa:rellich-kondrachov} の後の hypcheck）。
- **境界がないこと**：片の台が座標の像の内部に入ることを Step 1 で使った（球 $B$ は $x_{j}(U_{j})$ の外にはみ出してよい。片は $\mathbb{R}^{n}$ 全体の関数として扱っている）。
- **公理**：新しい選択は使わない。部分列は、\ref{fa:rellich-kondrachov} の証明の具体的な対角線論法を有限回使って決まる。コンパクト作用素の定義の同値性（閉包のコンパクト性 ⇔ 点列の形）には DC が要るが、ここでは点列の形だけを示し、使う。
:::
:::

::: supplement
**前提を変えると.** 境界つきのコンパクト領域 $D$ では、$W_{0}^{1,p}(\operatorname{int}D)$ については境界の仮定なしに同じ結論が成り立つ（\ref{fa:rellich-kondrachov.3} の多様体版）が、$W^{1,p}(\operatorname{int}D)$ には境界の正則性（延長作用素）が要る。$C^{m}$ の空間についても、$C^{m+1}(M)\to C^{m}(M)$（$C^{m}$ ノルム）はコンパクトである（片ごとに $m$ 階までの導関数へ \ref{top:ascoli-classical} を使う。詳細は省く）。

**似た定理.** トーラスでは、包含 $H^{k}\to H^{l}$ はフーリエ係数を $(1+|m|^{2})^{(l-k)/2}$ 倍する対角作用素と見なせ、重みが $0$ に近づくことからコンパクト性が直接わかる（次のページの \see{gl:torus-direct.2}）。Step 4 は「コンパクト作用素の共役はコンパクト」というシャウダーの定理のヒルベルト空間版を、この場合に示したものである。応用として、閉多様体の上のラプラシアンの逆（の延長）はコンパクトな自己共役作用素になり、\ref{fa:compact-selfadjoint-spectral} から固有関数による $L^{2}(M)$ の正規直交基底が得られる。これは後の系列（楕円作用素のスペクトル）で扱う。

**高い視点：有限の部屋の中の弦.** 長さの限られた弦は、決まった倍音でしか振動できない。閉多様体の上の関数も、「部屋が有限（コンパクト）」なので振動の仕方が離散的な倍音に分かれ、$H^{k}$ のノルムが有界であることは「高い倍音ほど強く罰金を課しても予算内」ということである。すると高い倍音の寄与は一様に小さく、関数たちは有限個の低い倍音でほぼ記述でき、有限次元のように振る舞う。これがコンパクト性の正体で、部屋が無限に広いと（$\mathbb{R}^{n}$）、同じ形の波を遠くへ運ぶだけで、いつまでも近づかない列が作れる。
:::

## 問題 {#gl:sec-em-problems}

::: problem {#gl:prob-em-torus-noncompact}
$k\ge0$ を整数とし、$m\in\mathbb{Z}^{n}$ について $v_{m}\defeq(1+|m|^{2})^{-k/2}e_{m}\in C^{\infty}(T^{n})$ とおく。
1. $\|v_{m}\|_{H^{k}}$ は $m$ によらない正の定数の間にあり、$m\neq m'$ なら $\|v_{m}-v_{m'}\|_{H^{k}}$ は $m,m'$ によらない正の定数以上であることを示せ。これから、恒等写像 $H^{k}(T^{n})\to H^{k}(T^{n})$ はコンパクトでないことを導け。
2. 整数 $0\le l<k$ について $\|v_{m}\|_{H^{l}}\to0$（$|m|\to\infty$）を示し、\ref{gl:rellich-manifold.3} と矛盾しないことを確かめよ。
:::

::: solution
$\hat{v}_{m}(m')$ は $m'=m$ で $(1+|m|^{2})^{-k/2}$、それ以外で $0$ である（\ref{gl:torus-fourier-basis.2} の正規直交性）。\ref{gl:torus-sobolev.2} の定数を $c_{s},C_{s}$（階数 $s$）と書く。

**1.** $\sum_{m'}(1+|m'|^{2})^{k}|\hat{v}_{m}(m')|^{2}=1$ なので $C_{k}^{-1}\le\|v_{m}\|_{H^{k}}^{2}\le c_{k}^{-1}$。$m\neq m'$ なら $v_{m}-v_{m'}$ の係数の重みつき二乗和は $1+1=2$ なので $\|v_{m}-v_{m'}\|_{H^{k}}^{2}\ge2C_{k}^{-1}$。よって $\mathbb{Z}^{n}$ を並べた列 $(v_{m^{(i)}})$ は $H^{k}$ で有界だが、どの部分列もコーシー列でなく、収束しない。恒等写像がコンパクトなら有界列の像が収束する部分列をもつはずなので、コンパクトでない。

**2.** $\sum_{m'}(1+|m'|^{2})^{l}|\hat{v}_{m}(m')|^{2}=(1+|m|^{2})^{l-k}$ なので $\|v_{m}\|_{H^{l}}^{2}\le c_{l}^{-1}(1+|m|^{2})^{l-k}\to0$。とくに 1 の列のどの部分列も $H^{l}$ で $0$ に収束し、包含 $H^{k}\to H^{l}$ が有界列を収束する部分列のある列に写すという \ref{gl:rellich-manifold.3} と合う。1 と合わせると、$H^{k}$ で互いに一定の距離を保つ列が、$H^{l}$ では一点に集まることがわかる。
:::

::: problem {#gl:prob-em-delta}
$M$ を $n$ 次元の閉多様体、$o\in M$、$k>\frac n2$ を整数とする。$v\in H^{k}(M)$ の連続な代表元を $\tilde{v}$ と書く（\ref{gl:hk-smooth.1}）。
1. $\delta_{o}(v)\defeq\tilde{v}(o)$ は $H^{-k}(M)$ の元であることを示せ。
2. $\delta_{o}$ は $\iota(L^{2}(M))$ に入らないことを示せ。
:::

::: solution
**1.** $\tilde{v}$ は連続な代表元としてただ一つに決まるので、$\delta_{o}$ は $H^{k}(M)$ 上の線形汎関数である。\ref{gl:hk-smooth.1}（$m=0$）から $|\tilde{v}(o)|\le\sup_{M}|\tilde{v}|\le\|\tilde{v}\|_{C^{0};\mathfrak{A}}\le C\|v\|_{H^{k}}$ なので有界で、$\delta_{o}\in H^{-k}(M)$。

**2.** $\iota f=\delta_{o}$（$f\in L^{2}(M)$）とする。$o$ のまわりの座標近傍 $(U,x)$ で $x(o)=0$ となるものをとり、$x(U)$ が半径 $r>0$ の球を含むとする。\ref{mfd:bump-function} の隆起関数を拡大縮小して、$\beta\in C_{c}^{\infty}(\mathbb{R}^{n})$, $0\le\beta\le1$、$0$ の近傍で $\beta=1$、台が単位球に含まれるものをとり、$i>1/r$ について $\theta_{i}$ を $U$ の上で $1-\beta(i\,x(\cdot))$、$U$ の外で $1$ と定める。$\theta_{i}$ は滑らかで、$o$ の近傍で $0$、$i\to\infty$ で $M\setminus\{o\}$ の各点で $1$ に収束する。$v\in C^{\infty}(M)$ について $\theta_{i}v$ は $o$ の近傍で $0$ なので $\int f\theta_{i}v\,d\mu_{g}=\delta_{o}(\theta_{i}v)=0$。$|f\theta_{i}v|\le|f||v|$ は可積分で、$\{o\}$ は 0 次元の部分多様体なので測度 $0$（\ref{gl:rm-basic-properties.3}、$n\ge1$）だから、優収束定理から $\int fv\,d\mu_{g}=0$。$v=1$ とすると $\delta_{o}(1)=0$ となるが、$\delta_{o}(1)=1$ なので矛盾する。

$H^{-k}$ の元は「関数」とは限らないことの、最も簡単な例である。トーラスでは、1 が $2k>n$ のときに限ることを \ref{gl:prob-nt-delta-torus} で見た。
:::
