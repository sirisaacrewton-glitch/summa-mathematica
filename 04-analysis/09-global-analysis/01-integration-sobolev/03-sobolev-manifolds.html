# 多様体上のソボレフ空間 {#gl:page-sobolev-manifolds keywords="Sobolev spaces on closed manifolds, W^{k,p}(M) and H^k(M) defined by a finite atlas and a partition of unity, invariance of W^{k,p} under smooth changes of coordinates for compactly supported functions, independence of the atlas, the partition of unity and the metric, local characterization, completeness, density of smooth functions, metric H^1 norm"}

$\mathbb{R}^{n}$ の開集合の上のソボレフ空間（\ref{fa:sobolev-space}）は、「何回まで弱い意味で微分でき、その導関数が $p$ 乗可積分か」を測る空間である。楕円型作用素やホッジの定理を関数解析的に扱うには、これを多様体の上に移す必要がある。移し方は単純で、関数を 1 の分割で小さな片に切り、各片を座標で $\mathbb{R}^{n}$ に写して $\mathbb{R}^{n}$ のソボレフ・ノルムで測り、足し合わせる。問題は、こうして決めた空間とノルムが、座標近傍や 1 の分割の選び方によらないかどうかである。その鍵は「台がコンパクトなソボレフ関数を滑らかな座標変換で写しても、ソボレフ関数のままで、ノルムは定数倍しか変わらない」ことにある。このページでは、閉多様体（コンパクトで境界のない多様体）の上でこれを示し、$W^{k,p}(M)$ が座標・1 の分割・計量によらないバナッハ空間（$p=2$ ならヒルベルト空間）で、$C^{\infty}(M)$ が稠密であることを証明する。ベクトル束（とくに微分形式）の切断への拡張、微分作用素の有界性、負の階数のソボレフ空間、トーラスでのフーリエ係数による特徴づけは次のページで扱う。

## 記法と定義の確認 {#gl:sec-sm-notation}

::: notation
- $M$ は $n$ 次元の閉多様体（コンパクトで境界のない可微分多様体、$n\ge1$。\ref{mfd:smooth-manifold}）。座標近傍を $(U,x)$、$x=(x_{1},\dots,x_{n})\colon U\to x(U)\subset\mathbb{R}^{n}$ と書く。滑らかな 1 の分割は \ref{mfd:smooth-partition-of-unity}。
- リーマン計量 $g$ を一つ固定し、リーマン測度 $\mu_{g}$ と $L^{p}(M)$ は \ref{gl:riemannian-measure}, \ref{gl:lp-manifold}、座標での積分は \ref{gl:rm-integral-formulas}。$M$ はコンパクトなので、$L^{p}(M)$ は集合として $g$ によらず、ノルムは同値である（\ref{gl:lp-manifold} の後の注意）。座標では $\gamma_{x}\defeq\sqrt{\det(g_{ij}\circ x^{-1})}$。
- **境界つきの場合**：前のページと同じく、境界つき多様体は多様体の中の境界つき領域として扱い、このページでは補足（\ref{gl:sobolev-manifold-independence} の後）で触れるだけにする。
- $\mathbb{R}^{n}$ の開集合 $\Omega$ の上の弱微分とソボレフ空間 $W^{k,p}(\Omega)$、$H^{k}(\Omega)=W^{k,2}(\Omega)$ は \ref{fa:sobolev-space}、完備性は \ref{fa:sobolev-complete}、滑らかな関数との積は \ref{fa:sobolev-product-rule}、$C^{1}$ 微分同相写像による変数変換（1 階）は \ref{fa:sobolev-chain-rule}、変分法の基本補題は \ref{fa:fundamental-lemma}、テスト関数の存在は \ref{fa:test-function-density}。
- 軟化子は \ref{fa:mollifier}、軟化の性質は \ref{fa:mollification}, \ref{fa:mollification-sobolev}。このページでは 1 の分割を $\rho_{j}$ と書くので、軟化子を $\eta_{\varepsilon}$ と書く（\ref{fa:mollifier} の $\rho_{\varepsilon}$ と同じもの）。
- $k\ge0$ は整数、$1\le p<\infty$ とする（$p=\infty$ は補足でだけ触れる）。関数は複素数値とする（実数値でも同じ）。「$f$ は $K$ の外で $0$」はほとんど至る所の意味。
- **座標表示**：$M$ 上の関数 $f$ と座標近傍 $(U,x)$ について、$f^{x}\colon\mathbb{R}^{n}\to\mathbb{C}$ を $x(U)$ 上で $f\circ x^{-1}$、その外で $0$ と定める。逆に $\mathbb{R}^{n}$ 上の関数 $w$ について、$x^{*}w\colon M\to\mathbb{C}$ を $U$ 上で $w\circ x$、その外で $0$ と定める。$f$ が $U$ の外で $0$ なら $x^{*}(f^{x})=f$。
- **選択公理**：1 の分割の存在（\ref{mfd:smooth-partition-of-unity}）で従属選択公理（DC）を使う。それ以外に新しい選択は使わない（引用する測度論・関数解析の結果がそれぞれの系列で使う範囲を除く）。有限個の座標近傍を選ぶのは有限回の選択なので公理は要らない。
:::

## ℝⁿ での座標変換 {#gl:sec-sm-coordinates}

まず、$\mathbb{R}^{n}$ の開集合の上のソボレフ関数について、台がコンパクトなものの扱いをまとめる。

::: lemma ソボレフ関数の局所的な操作 {#gl:sobolev-local-operations keywords="restriction of Sobolev functions to open subsets; weak derivatives vanish outside the support; extension by zero of compactly supported Sobolev functions; u is in W^{k,p} if u is in L^p and its first weak derivatives are in W^{k-1,p}" index="ソボレフ関数の零延長|そぼれふかんすうのれいえんちょう, ソボレフ関数の制限|そぼれふかんすうのせいげん"}
$\Omega'\subset\Omega\subset\mathbb{R}^{n}$ を開集合とする。
1. $u\in W^{k,p}(\Omega)$ なら、制限 $u\restr{\Omega'}$ は $W^{k,p}(\Omega')$ に入り、その弱微分は $\partial^{\alpha}u$ の制限である。
2. $f\in W^{k,p}(\Omega')$ がコンパクト集合 $K\subset\Omega'$ の外で $0$ なら、$|\alpha|\le k$ について $\partial^{\alpha}f$ も $K$ の外で $0$。
3. 2 の $f$ を $\Omega\setminus\Omega'$ で $0$ と延ばした $\bar{f}$ は $W^{k,p}(\Omega)$ に入り、$\partial^{\alpha}\bar{f}$ は $\partial^{\alpha}f$ を $0$ と延ばしたもので、$\|\bar{f}\|_{W^{k,p}(\Omega)}=\|f\|_{W^{k,p}(\Omega')}$。
4. $k\ge1$ とし、$g\in L^{p}(\Omega)$ の 1 階の弱微分 $\partial_{j}g$ がすべて存在して $W^{k-1,p}(\Omega)$ に入るなら、$g\in W^{k,p}(\Omega)$ で $\|g\|_{W^{k,p}}\le\|g\|_{p}+\sum_{j}\|\partial_{j}g\|_{W^{k-1,p}}$。
:::

::: proof
**1.** $C_{c}^{\infty}(\Omega')$ の元は $0$ と延ばせば $C_{c}^{\infty}(\Omega)$ の元なので、弱微分の定義の等式がそのまま成り立つ。

**2.** $\psi\in C_{c}^{\infty}(\Omega'\setminus K)$ について $\int\partial^{\alpha}f\,\psi=(-1)^{|\alpha|}\int f\,\partial^{\alpha}\psi=0$（$\partial^{\alpha}\psi$ の台は $K$ と交わらない）。\ref{fa:fundamental-lemma} を開集合 $\Omega'\setminus K$ に使う。

**3.** $\varphi\in C_{c}^{\infty}(\Omega)$ をとる。\ref{fa:test-function-density.2} から、$\chi\in C_{c}^{\infty}(\Omega')$ で $K$ のある近傍 $N$ の上で $\chi=1$ となるものをとると、$\chi\varphi\in C_{c}^{\infty}(\Omega')$ で、$N$ の上で $\partial^{\alpha}(\chi\varphi)=\partial^{\alpha}\varphi$。$f$ と $\partial^{\alpha}f$ は $K$ の外で $0$（2）なので
$$
\int_{\Omega}\bar{f}\,\partial^{\alpha}\varphi=\int_{\Omega'}f\,\partial^{\alpha}(\chi\varphi)=(-1)^{|\alpha|}\int_{\Omega'}\partial^{\alpha}f\,\chi\varphi=(-1)^{|\alpha|}\int_{\Omega}\overline{\partial^{\alpha}f}\,\varphi.
$$
ノルムの等式は、各 $\partial^{\alpha}\bar{f}$ の $L^{p}$ ノルムが変わらないことから。

**4.** $1\le|\alpha|\le k$ なら $\alpha=e_{j}+\beta$（$|\beta|\le k-1$）と書け、$h\defeq\partial^{\beta}(\partial_{j}g)\in L^{p}$ がある。$\varphi\in C_{c}^{\infty}(\Omega)$ について
$$
\int g\,\partial^{\alpha}\varphi=\int g\,\partial_{j}(\partial^{\beta}\varphi)=-\int\partial_{j}g\,\partial^{\beta}\varphi=-(-1)^{|\beta|}\int h\,\varphi=(-1)^{|\alpha|}\int h\,\varphi
$$
なので $\partial^{\alpha}g=h\in L^{p}$。ノルムは $\|g\|_{W^{k,p}}^{p}\le\|g\|_{p}^{p}+\sum_{j}\|\partial_{j}g\|_{W^{k-1,p}}^{p}$（各 $\alpha\neq0$ を一つの $j$ に割り当てる）と $(\sum a_{i}^{p})^{1/p}\le\sum a_{i}$ から。
:::

::: theorem ソボレフ空間の座標変換による不変性 {#gl:sobolev-diffeo-invariance keywords="invariance of W^{k,p} under C^infinity diffeomorphisms for compactly supported functions: if tau: Omega' -> Omega is a smooth diffeomorphism and f in W^{k,p}(Omega) vanishes outside a compact L, then f o tau is in W^{k,p}(Omega') with ||f o tau|| <= C ||f||" index="ソボレフ空間の座標変換による不変性|そぼれふくうかんのざひょうへんかんによるふへんせい, 微分同相写像とソボレフ空間|びぶんどうそうしゃぞうとそぼれふくうかん"}
$\tau\colon\Omega'\to\Omega$ を $\mathbb{R}^{n}$ の開集合の間の $C^{\infty}$ 微分同相写像、$L\subset\Omega$ をコンパクト集合とする。$f\in W^{k,p}(\Omega)$ が $L$ の外で $0$ なら、次が成り立つ。
1. $f\circ\tau\in W^{k,p}(\Omega')$ で、$f\circ\tau$ はコンパクト集合 $\tau^{-1}(L)$ の外で $0$。$k\ge1$ なら $\partial_{j}(f\circ\tau)=\sum_{l}\bigl((\partial_{l}f)\circ\tau\bigr)\,\partial_{j}\tau_{l}$。
2. $\tau$, $L$, $k$, $p$ だけで決まる定数 $C$ があって $\|f\circ\tau\|_{W^{k,p}(\Omega')}\le C\|f\|_{W^{k,p}(\Omega)}$。
:::

::: intuition
台がコンパクトなソボレフ関数を滑らかな座標変換で写しても、何回微分できるかは変わらず、ソボレフ・ノルムは変換だけで決まる定数倍の範囲でしか変わらない。
:::

::: proof
$\tau$ は零集合を零集合に写し、$\tau^{-1}$ も同様なので（\ref{meas:change-of-variables.1}）、$f\circ\tau$ はほとんど至る所で定まる関数の類として意味をもつ。$\tau^{-1}$ は連続なので $\tau^{-1}(L)$ はコンパクト。

**Step 1（$k=0$）.** 【主張：$\|f\circ\tau\|_{L^{p}(\Omega')}\le C\|f\|_{L^{p}(\Omega)}$】\ref{meas:change-of-variables.2} を $\Phi=\tau^{-1}\colon\Omega\to\Omega'$ と $|f\circ\tau|^{p}$ に使うと
$$
\int_{\Omega'}|f\circ\tau|^{p}\,d\lambda=\int_{\Omega}|f|^{p}J_{\tau^{-1}}\,d\lambda\le\Bigl(\max_{L}J_{\tau^{-1}}\Bigr)\int_{\Omega}|f|^{p}\,d\lambda,
$$
$f$ は $L$ の外で $0$ で、$J_{\tau^{-1}}=|\det D(\tau^{-1})|$ はコンパクト集合 $L$ の上で連続なので最大値をもつ。

**Step 2.** 【主張：$k=1$ で 1・2 が成り立つ】$\Omega\neq\mathbb{R}^{n}$ なら $d\defeq\operatorname{dist}(L,\mathbb{R}^{n}\setminus\Omega)>0$（コンパクト集合と、交わらない閉集合の距離）として $\delta\defeq d/2$、$\Omega=\mathbb{R}^{n}$ なら $\delta\defeq1$ とし、$G\defeq\{z:\operatorname{dist}(z,L)<\delta\}$ とおく。$\overline{G}\subset\{z:\operatorname{dist}(z,L)\le\delta\}$ は有界閉集合なのでコンパクトで、$\Omega$ に含まれる。$G'\defeq\tau^{-1}(G)$ とすると $\tau\colon G'\to G$ は微分同相写像で、$D\tau$ は $G'\subset\tau^{-1}(\overline{G})$（コンパクト）の上で、$D(\tau^{-1})$ は $\overline{G}$ の上で連続なので、どちらも有界である。\ref{gl:sobolev-local-operations.1} から $f\restr{G}\in W^{1,p}(G)$ で、\ref{fa:sobolev-chain-rule} から $f\circ\tau\in W^{1,p}(G')$、弱微分は 1 の式で与えられ、$\|f\circ\tau\|_{W^{1,p}(G')}\le C\|f\|_{W^{1,p}(G)}\le C\|f\|_{W^{1,p}(\Omega)}$。$f\circ\tau$ は $G'$ の中のコンパクト集合 $\tau^{-1}(L)$ の外で $0$ なので、\ref{gl:sobolev-local-operations.3} から $\Omega'$ に $0$ と延ばしたもの（これは $\Omega'$ 上の $f\circ\tau$ そのもの）は $W^{1,p}(\Omega')$ に入り、ノルムも弱微分の式も変わらない（$\partial_{l}f$ は $L$ の外で $0$、\ref{gl:sobolev-local-operations.2}）。

**Step 3.** 【主張：$k\ge2$ とし、$k-1$ で 1・2 が成り立てば $k$ でも成り立つ】$f\in W^{k,p}\subset W^{1,p}$ なので Step 2 の式が成り立つ。各 $l$ について $\partial_{l}f\in W^{k-1,p}(\Omega)$ は $L$ の外で $0$（\ref{gl:sobolev-local-operations.2}）なので、帰納法の仮定から $(\partial_{l}f)\circ\tau\in W^{k-1,p}(\Omega')$、ノルムは $\le C\|\partial_{l}f\|_{W^{k-1,p}}\le C\|f\|_{W^{k,p}}$。\ref{fa:test-function-density.2} から $\chi\in C_{c}^{\infty}(\Omega')$ で $\tau^{-1}(L)$ の近傍で $\chi=1$ となるものをとり、$b_{jl}\defeq\chi\,\partial_{j}\tau_{l}$ とおく。$b_{jl}$ は台がコンパクトな $C^{\infty}$ 関数なので、すべての導関数が有界で、$(\partial_{l}f)\circ\tau$ は $\tau^{-1}(L)$ の外で $0$ なので $\bigl((\partial_{l}f)\circ\tau\bigr)\partial_{j}\tau_{l}=b_{jl}\,(\partial_{l}f)\circ\tau$。\ref{fa:sobolev-product-rule} から右辺は $W^{k-1,p}(\Omega')$ に入り、ライプニッツ則の各項を $\sup|\partial^{\gamma}b_{jl}|$ で評価して、そのノルムは $\le C\|(\partial_{l}f)\circ\tau\|_{W^{k-1,p}}$。よって $\partial_{j}(f\circ\tau)\in W^{k-1,p}(\Omega')$ で、\ref{gl:sobolev-local-operations.4} と Step 1 から $f\circ\tau\in W^{k,p}(\Omega')$、
$$
\|f\circ\tau\|_{W^{k,p}}\le\|f\circ\tau\|_{p}+\sum_{j}\|\partial_{j}(f\circ\tau)\|_{W^{k-1,p}}\le C\|f\|_{W^{k,p}}.
$$
定数は $\tau$, $L$, $\chi$（$\tau$ と $L$ から一つ決めておく）、$k$, $p$ だけによる。

::: hypcheck
- **$f$ の台がコンパクト**：Step 2 で $D\tau$, $D(\tau^{-1})$ を有界にし、Step 3 で切り落とし $\chi$ を使うのに使った。外すと偽：$\Omega=\Omega'=(0,\infty)$、$\tau(t)=\sqrt{t}$、$f(s)=(1+s)^{-3/4}$ とすると $f\in W^{1,2}(0,\infty)$（$|f|^{2}=(1+s)^{-3/2}$, $|f'|^{2}\le(1+s)^{-7/2}$ は可積分）だが、$\int_{0}^{\infty}|f(\sqrt{t})|^{2}dt=\int_{0}^{\infty}2s(1+s)^{-3/2}ds=\infty$ で $f\circ\tau\notin L^{2}$。
- **$\tau$ が $C^{\infty}$**：Step 3 で $\partial_{j}\tau_{l}$ に積の法則を使うのに使った。$W^{k,p}$ については $C^{k}$ 級の微分同相写像で足りる（積の法則を $C^{k-1}$ 級の係数に広げれば同じ証明が通る）。
- **$p<\infty$**：Step 2 で引用した \ref{fa:sobolev-chain-rule}（マイヤーズ–セリンの定理による近似を使う）に要る。
- **公理**：選択公理は使わない。
:::
:::

::: supplement
**前提を変えると.** 同相写像では $W^{1,p}$ さえ保たれない。$\tau(t)=t^{1/3}$ は $\mathbb{R}$ の同相写像（$0$ でだけ滑らかでない）で、$f\in C_{c}^{\infty}(\mathbb{R})$ が $f'(0)\neq0$ なら $(f\circ\tau)'(t)=\frac13t^{-2/3}f'(t^{1/3})$ は $0$ の近くで $|t|^{-2/3}$ 程度なので、$p\ge\frac32$ では $L^{p}$ に入らない。一方、双リプシッツ同相写像（それ自身と逆写像がリプシッツ連続）は $W^{1,p}$ を保つことが知られている（ここでは証明しない）。$k\ge2$ では、2 階以上の導関数が座標変換の 2 階以上の導関数を通して入るので、$C^{k}$ 級程度の滑らかさが要る。

**似た定理.** $k=0$ は変数変換公式そのもので、台がコンパクトである必要もない（Step 1 の最大値を $\sup J_{\tau^{-1}}$ に替える）。非整数の階数 $H^{s}$（\ref{fa:fractional-sobolev}）も、台がコンパクトな関数については滑らかな座標変換で保たれることが知られている（ここでは証明しない）。ただし $H^{s}$ はフーリエ変換の重み（\ref{fa:sobolev-fourier}）で定義されていて、座標変換はフーリエ側で見えにくいので、その証明は整数階の場合からの補間などを使う。多様体の上で整数階を弱微分で定義するのは、座標変換との相性がよいからである。

**高い視点：ゴム膜の上の凹凸.** 滑らかな座標変換は、平面に張ったゴム膜を滑らかに伸び縮みさせることにあたる。膜の上に描いた模様（関数）の凹凸の激しさ（弱微分の大きさ）は、伸び縮みの割合（$D\tau$ とその導関数）の分しか変わらないので、「$k$ 回微分できる」という性質は膜の伸ばし方によらない。台がコンパクトという仮定は、伸び縮みの割合が一様に抑えられる範囲だけを見るためのもので、膜の端で無限に引き伸ばす変換（上の $\sqrt{t}$ の例）では、模様の面積（$L^{p}$ ノルム）さえ無限大になりうる。
:::

## 多様体上のソボレフ空間の定義 {#gl:sec-sm-definition}

::: lemma 座標表示と Lᵖ ノルム {#gl:sm-chart-lp keywords="null sets correspond under charts; for functions vanishing outside a compact subset of a chart, the L^p norm on M and the L^p norm of the coordinate expression are comparable" index="座標表示と Lp ノルム|ざひょうひょうじとえるぴーのるむ"}
$(U,x)$ を座標近傍、$K\subset U$ をコンパクト集合とする。
1. ボレル集合 $E\subset U$ について、$\mu_{g}(E)=0$ $\iff$ $\lambda(x(E))=0$。とくに $f^{x}$ はほとんど至る所で等しい関数の類として定まる。
2. 正の定数 $c,C$ があって、$K$ の外で $0$ となるボレル可測な $f$ について $c\|f\|_{L^{p}(M)}\le\|f^{x}\|_{L^{p}(\mathbb{R}^{n})}\le C\|f\|_{L^{p}(M)}$。
:::

::: proof
**1.** \eqref{gl:eq-rm-chart} から $\mu_{g}(E)=\int_{x(E)}\gamma_{x}\,d\lambda$ で、$\gamma_{x}>0$ なので、これが $0$ になるのは $\lambda(x(E))=0$ のときに限る。

**2.** $K=\varnothing$ なら明らか。そうでなければ、$\gamma_{x}$ はコンパクト集合 $x(K)$ の上で正の最小値 $a$ と最大値 $b$ をもつ。\ref{gl:rm-integral-formulas.1} を $|f|^{p}$ に使うと $\int_{M}|f|^{p}d\mu_{g}=\int_{x(K)}|f\circ x^{-1}|^{p}\gamma_{x}\,d\lambda$ なので、$a\|f^{x}\|_{p}^{p}\le\|f\|_{L^{p}(M)}^{p}\le b\|f^{x}\|_{p}^{p}$。$c\defeq b^{-1/p}$, $C\defeq a^{-1/p}$ とすればよい。
:::

::: definition 多様体上のソボレフ空間 {#gl:sobolev-manifold keywords="localizing data: finite atlas (U_j, x_j) with a subordinate smooth partition of unity rho_j; W^{k,p}(M) = {u in L^p(M) : (rho_j u) o x_j^{-1} in W^{k,p}(R^n)} with norm sum_j ||(rho_j u) o x_j^{-1}||_{W^{k,p}}; H^k(M) with an inner product" index="ソボレフ空間（多様体）|そぼれふくうかんたようたい, 局所化のデータ|きょくしょかのでーた, Hk(M)|えいちけーえむ"}
$M$ を閉多様体とする。
1. $M$ を覆う有限個の座標近傍 $(U_{j},x_{j})$（$j=1,\dots,N$）と、滑らかな 1 の分割 $(\rho_{j})$ で $\operatorname{supp}\rho_{j}\subset U_{j}$ となるものの組 $\mathfrak{A}=(U_{j},x_{j},\rho_{j})_{j=1}^{N}$ を**局所化のデータ**という。
2. $\mathfrak{A}$ について
$$
W_{\mathfrak{A}}^{k,p}(M)\defeq\{u\in L^{p}(M):\text{すべての }j\text{ で }(\rho_{j}u)^{x_{j}}\in W^{k,p}(\mathbb{R}^{n})\},\qquad\|u\|_{k,p;\mathfrak{A}}\defeq\sum_{j=1}^{N}\|(\rho_{j}u)^{x_{j}}\|_{W^{k,p}(\mathbb{R}^{n})}
$$
とおき、**ソボレフ空間**という。$H_{\mathfrak{A}}^{k}(M)\defeq W_{\mathfrak{A}}^{k,2}(M)$ には内積
$$
\langle u,v\rangle_{H^{k};\mathfrak{A}}\defeq\sum_{j=1}^{N}\bigl\langle(\rho_{j}u)^{x_{j}},(\rho_{j}v)^{x_{j}}\bigr\rangle_{H^{k}(\mathbb{R}^{n})}
$$
を入れ、そのノルムを $\|u\|_{H^{k};\mathfrak{A}}$ と書く。
:::

::: intuition
多様体の上の関数が $k$ 回（弱い意味で）微分できて導関数が $p$ 乗可積分であるとは、1 の分割で小さく切った各片を座標で $\mathbb{R}^{n}$ に写したものがそうであることで、その大きさは片ごとのソボレフ・ノルムの和で測る。
:::

局所化のデータは存在する：各点はある座標近傍の定義域に含まれるので、$M$ のコンパクト性から有限個の定義域で覆え、その有限個の開被覆に従属する滑らかな 1 の分割をとればよい（\ref{mfd:smooth-partition-of-unity.2}、ここで DC を使う）。$\operatorname{supp}\rho_{j}$ は $M$ の閉集合なのでコンパクトで、$\rho_{j}u$ は $U_{j}$ のコンパクト集合の外で $0$、したがって $(\rho_{j}u)^{x_{j}}$ は \ref{gl:sm-chart-lp.1} から類として定まる。$\|\cdot\|_{k,p;\mathfrak{A}}$ はノルムである：$\|u\|_{k,p;\mathfrak{A}}=0$ なら各 $(\rho_{j}u)^{x_{j}}=0$ で、\ref{gl:sm-chart-lp.1} から $\rho_{j}u=0$、よって $u=\sum_{j}\rho_{j}u=0$。また $(\sum_{j}a_{j}^{2})^{1/2}\le\sum_{j}a_{j}\le\sqrt{N}(\sum_{j}a_{j}^{2})^{1/2}$ から $\|u\|_{H^{k};\mathfrak{A}}\le\|u\|_{k,2;\mathfrak{A}}\le\sqrt{N}\|u\|_{H^{k};\mathfrak{A}}$。$u\in C^{\infty}(M)$ なら $(\rho_{j}u)^{x_{j}}$ は $x_{j}(U_{j})$ 上で滑らかで、台はコンパクト集合 $x_{j}(\operatorname{supp}\rho_{j})$（$\mathbb{R}^{n}$ の閉集合）に含まれるので $C_{c}^{\infty}(\mathbb{R}^{n})$ の元である。よって $C^{\infty}(M)\subset W_{\mathfrak{A}}^{k,p}(M)$。

座標によらないことを示す鍵は、次の「切り出し」と「貼り付け」である。

::: proposition 切り出しと貼り付け {#gl:sm-localization keywords="localization estimates: for any chart (U,x) and cut-off theta with compact support in U, u -> (theta u) o x^{-1} is bounded W^{k,p}(M) -> W^{k,p}(R^n); conversely w -> w o x (extended by zero) is bounded from W^{k,p} functions supported in a fixed compact subset of x(U) into W^{k,p}(M)" index="切り出しと貼り付け（ソボレフ空間）|きりだしとはりつけそぼれふくうかん"}
$\mathfrak{A}=(U_{j},x_{j},\rho_{j})$ を局所化のデータ、$(U,x)$ を $M$ の任意の座標近傍とする。
1. （切り出し）$\theta\in C^{\infty}(M)$ の台が $U$ に含まれるなら（$M$ はコンパクトなので台はコンパクト）、$u\in W_{\mathfrak{A}}^{k,p}(M)$ について $(\theta u)^{x}\in W^{k,p}(\mathbb{R}^{n})$ で、$u$ によらない定数 $C$ について $\|(\theta u)^{x}\|_{W^{k,p}}\le C\|u\|_{k,p;\mathfrak{A}}$。
2. （貼り付け）$L\subset x(U)$ をコンパクト集合とすると、$L$ の外で $0$ となる $w\in W^{k,p}(\mathbb{R}^{n})$ について $x^{*}w\in W_{\mathfrak{A}}^{k,p}(M)$ で、$w$ によらない定数 $C$ について $\|x^{*}w\|_{k,p;\mathfrak{A}}\le C\|w\|_{W^{k,p}}$。
:::

::: proof
**Step 1.** 【主張：$(U,x)$, $(V,y)$ を座標近傍、$L\subset x(U)$ をコンパクト集合、$b\in C^{\infty}(M)$ を台が $V$ に含まれる関数とすると、$L$ の外で $0$ となる $w\in W^{k,p}(\mathbb{R}^{n})$ について $(b\cdot x^{*}w)^{y}\in W^{k,p}(\mathbb{R}^{n})$ で、ノルムは $w$ によらない定数 $C$ について $\le C\|w\|_{W^{k,p}}$】$x(U\cap\operatorname{supp}b)$ は $x(U)$ の閉集合なので、$L'\defeq L\cap x(U\cap\operatorname{supp}b)$ はコンパクトで、開集合 $\Omega\defeq x(U\cap V)$ に含まれる。\ref{fa:test-function-density.2} から $\theta'\in C_{c}^{\infty}(x(U))$ で $L$ の近傍で $\theta'=1$ となるものをとり、$a\defeq\theta'\cdot(b\circ x^{-1})$（$x(U)$ の外で $0$）とおくと $a\in C_{c}^{\infty}(\mathbb{R}^{n})$ で、$h\defeq aw=(b\circ x^{-1})w$（$L$ の上で $\theta'=1$）。\ref{fa:sobolev-product-rule} から $h\in W^{k,p}(\mathbb{R}^{n})$, $\|h\|_{W^{k,p}}\le C\|w\|_{W^{k,p}}$ で、$h$ は $L'$ の外で $0$。$h\restr{\Omega}\in W^{k,p}(\Omega)$（\ref{gl:sobolev-local-operations.1}）に、座標変換 $\tau\defeq x\circ y^{-1}\colon y(U\cap V)\to\Omega$ について \ref{gl:sobolev-diffeo-invariance} を使うと、$h\circ\tau\in W^{k,p}(y(U\cap V))$ はコンパクト集合 $\tau^{-1}(L')$ の外で $0$ で、ノルムは $\le C\|h\|_{W^{k,p}}$。これを $0$ と延ばしたもの（\ref{gl:sobolev-local-operations.3}）が $(b\cdot x^{*}w)^{y}$ に等しい：$z\in y(U\cap V)$ では $(b\cdot x^{*}w)(y^{-1}(z))=(b\circ x^{-1})(\tau z)\,w(\tau z)=h(\tau z)$、$z\in y(V)\setminus y(U)$ では $x^{*}w=0$、$y(V)$ の外では定義から $0$。

**Step 2.** 【主張：貼り付け（2）が成り立つ】$\rho_{i}(x^{*}w)$ に Step 1 を $(V,y,b)=(U_{i},x_{i},\rho_{i})$ として使うと $\|(\rho_{i}\,x^{*}w)^{x_{i}}\|_{W^{k,p}}\le C_{i}\|w\|_{W^{k,p}}$。また $x^{*}w$ は $x^{-1}(L)$（コンパクト）の外で $0$ なので、\ref{gl:sm-chart-lp.2} から $x^{*}w\in L^{p}(M)$。$i$ について足せばよい。

**Step 3.** 【主張：切り出し（1）が成り立つ】$f_{j}\defeq(\rho_{j}u)^{x_{j}}\in W^{k,p}(\mathbb{R}^{n})$ はコンパクト集合 $x_{j}(\operatorname{supp}\rho_{j})\subset x_{j}(U_{j})$ の外で $0$ で、$\rho_{j}u=x_{j}^{*}f_{j}$。Step 1 を $(U,x,L,w)=(U_{j},x_{j},x_{j}(\operatorname{supp}\rho_{j}),f_{j})$, $(V,y,b)=(U,x,\theta)$ として使うと $\|(\theta\rho_{j}u)^{x}\|_{W^{k,p}}\le C_{j}\|f_{j}\|_{W^{k,p}}$。$\theta u=\sum_{j}\theta\rho_{j}u$ なので、$(\theta u)^{x}=\sum_{j}(\theta\rho_{j}u)^{x}\in W^{k,p}(\mathbb{R}^{n})$、ノルムは $\le\max_{j}C_{j}\cdot\|u\|_{k,p;\mathfrak{A}}$。
:::

::: theorem ソボレフ空間は座標によらない {#gl:sobolev-manifold-independence keywords="W^{k,p}(M) on a closed manifold does not depend on the atlas, the partition of unity or the Riemannian metric; equivalent norms; local characterization by cut-offs in arbitrary charts; W^{0,p} = L^p" index="ソボレフ空間の座標によらないこと|そぼれふくうかんのざひょうによらないこと, ソボレフ・ノルムの同値性|そぼれふのるむのどうちせい" refname="多様体上のソボレフ空間の座標不変性"}
$M$ を閉多様体とする。
1. 局所化のデータ $\mathfrak{A}$, $\mathfrak{B}$ について $W_{\mathfrak{A}}^{k,p}(M)=W_{\mathfrak{B}}^{k,p}(M)$ で、定数 $C$ があって $\|u\|_{k,p;\mathfrak{B}}\le C\|u\|_{k,p;\mathfrak{A}}$（$\mathfrak{A}$ と $\mathfrak{B}$ を入れ替えても同様）。
2. $u\in L^{p}(M)$ について、$u\in W_{\mathfrak{A}}^{k,p}(M)$ $\iff$ $M$ のすべての座標近傍 $(U,x)$ と、台が $U$ に含まれるすべての $\theta\in C^{\infty}(M)$ について $(\theta u)^{x}\in W^{k,p}(\mathbb{R}^{n})$。
3. $W_{\mathfrak{A}}^{0,p}(M)=L^{p}(M)$ で、ノルムは同値。$W_{\mathfrak{A}}^{k+1,p}(M)\subset W_{\mathfrak{A}}^{k,p}(M)$ で $\|u\|_{k,p;\mathfrak{A}}\le\|u\|_{k+1,p;\mathfrak{A}}$。
4. 空間 $W_{\mathfrak{A}}^{k,p}(M)$ とその位相は、リーマン計量 $g$ によらない。

以後 $W^{k,p}(M)$, $H^{k}(M)$ と書き、ノルム $\|\cdot\|_{k,p}$ と内積 $\langle\cdot,\cdot\rangle_{H^{k}}$ は、一つ固定した局所化のデータで測る。
:::

::: intuition
多様体の上のソボレフ空間は、どの座標近傍とどの 1 の分割で切り分けて測っても同じ空間になり、ノルムの値は変わっても互いに定数倍で抑え合う。$k$ 回微分できるかどうかは局所的な性質で、どの局所座標で見ても同じだからである。
:::

::: proof
**Step 1.** 【主張：$\mathfrak{B}=(V_{i},y_{i},\sigma_{i})_{i=1}^{N'}$ について、$u\in W_{\mathfrak{A}}^{k,p}(M)$ なら $u\in W_{\mathfrak{B}}^{k,p}(M)$ で $\|u\|_{k,p;\mathfrak{B}}\le C\|u\|_{k,p;\mathfrak{A}}$】\ref{gl:sm-localization.1}（データ $\mathfrak{A}$ について）を $(U,x,\theta)=(V_{i},y_{i},\sigma_{i})$ に使うと、$(\sigma_{i}u)^{y_{i}}\in W^{k,p}(\mathbb{R}^{n})$ で $\|(\sigma_{i}u)^{y_{i}}\|_{W^{k,p}}\le C_{i}\|u\|_{k,p;\mathfrak{A}}$。$i$ について足して $C\defeq\sum_{i}C_{i}$。$\mathfrak{A}$ と $\mathfrak{B}$ の役を入れ替えれば逆の包含と評価が出る。

**Step 2.** 【主張：2 の局所的な特徴づけ】⇒ は \ref{gl:sm-localization.1}。⇐ は、条件を $(U,x,\theta)=(U_{j},x_{j},\rho_{j})$ に使えば定義そのもの。

**Step 3.** 【主張：3 と 4。$W^{0,p}=L^{p}$（ノルムは同値）、包含、計量によらないこと】\ref{gl:sm-chart-lp.2} を $\rho_{j}u$（$\operatorname{supp}\rho_{j}$ の外で $0$）に使い、$|\rho_{j}u|\le|u|$ と $u=\sum_{j}\rho_{j}u$ から
$$
c\|u\|_{L^{p}(M)}\le c\sum_{j}\|\rho_{j}u\|_{L^{p}(M)}\le\|u\|_{0,p;\mathfrak{A}}\le C\sum_{j}\|\rho_{j}u\|_{L^{p}(M)}\le CN\|u\|_{L^{p}(M)}
$$
（$c,C$ は $j$ についての最小・最大をとる）。$W^{0,p}(\mathbb{R}^{n})=L^{p}(\mathbb{R}^{n})$ なので、どの $u\in L^{p}(M)$ も $W_{\mathfrak{A}}^{0,p}(M)$ に入る。包含とノルムの不等式は、$W^{k+1,p}(\mathbb{R}^{n})$ のノルムが $W^{k,p}(\mathbb{R}^{n})$ のノルムの和の項をすべて含むことから。$\|\cdot\|_{k,p;\mathfrak{A}}$ の定義はルベーグ測度だけを使い、$g$ は $L^{p}(M)$（集合として $g$ によらない）と零集合（\ref{gl:sm-chart-lp.1} から座標の零集合で決まる）を通してしか入らないので、空間もノルムも $g$ によらない。

::: hypcheck
- **$M$ がコンパクト**：局所化のデータを有限個にし（ノルムが有限和）、$\theta$, $\rho_{j}$, $\sigma_{i}$ の台をコンパクトにして \ref{gl:sm-localization} を使うのに使った。外すと 1 は偽になりうる。可算個のデータで同じ形のノルムを定めて比べる：$M=\mathbb{R}$、$U_{j}=(j-1,j+1)$, $\rho_{j}(t)=\rho_{0}(t-j)$（$j\in\mathbb{Z}$）とし、座標を $x_{j}(t)=t-j$ にしたものと $x'_{j}(t)=2^{|j|}(t-j)$ にしたものを比べると、$(\rho_{j}u)^{x'_{j}}(r)=(\rho_{j}u)(j+2^{-|j|}r)$ の $L^{p}$ ノルムは $2^{|j|/p}\|\rho_{j}u\|_{p}$ なので、固定した隆起関数を $j$ だけ平行移動した関数の列は、前者のノルムでは有界で後者のノルムでは有界でない。
- **1 の分割**：$u=\sum_{j}\rho_{j}u$ と書くために使った（Step 3 と \ref{gl:sm-localization} の Step 3）。存在に DC を使う。
- **滑らかさ**：座標変換が $C^{\infty}$ であることを \ref{gl:sobolev-diffeo-invariance} で、$\rho_{j}$ の滑らかさを積の法則で使った。
:::
:::

::: supplement
**前提を変えると（非コンパクトな多様体）.** $M$ がコンパクトでなければ、局所的なソボレフ空間 $W_{\mathrm{loc}}^{k,p}(M)$（台がコンパクトな切り落とし $\theta$ について $(\theta u)^{x}\in W^{k,p}$）は 2 と同じ証明で座標によらないが、大域的なノルムは、上の例のように座標や計量の選び方による。そのため非コンパクトな場合は、完備なリーマン多様体の上で、計量から作るノルム $\bigl(\sum_{l\le k}\int|\nabla^{l}u|^{p}\,d\mu_{g}\bigr)^{1/p}$（$\nabla^{l}$ はレビ–チヴィタ接続による $l$ 階の共変微分）で定義するのが普通である。閉多様体では、このノルムが上の $\|\cdot\|_{k,p}$ と同値になることが知られている（ここでは証明しない。$k=1$, $p=2$ は \ref{gl:prob-sm-metric-h1}）。

**前提を変えると（境界つき領域）.** $D\subset M$ がコンパクトな境界つき領域なら、境界の点では半空間型の座標近傍（\ref{mfd:regular-domain}）を使い、$(\rho_{j}u)^{x_{j}}$ を開集合 $x_{j}(U_{j})\cap\{r_{n}<0\}$ の上のソボレフ関数として測ると、$W^{k,p}(\operatorname{int}D)$ が同じ形で定義できる。座標変換は開半空間を開半空間に写し（\ref{mfd:half-space-change-of-variables} の状況）、\ref{gl:sobolev-diffeo-invariance} の証明は、台が $\{r_{n}=0\}$ に触れてもよい「$L$ の外で $0$」の形のまま通る（零延長で使う切り落とし $\chi$ との積は、$\{r_{n}<0\}$ の中で台がコンパクトになる）ので、座標によらないことも同様に示せる（細部はここでは省く）。ただし境界まで滑らかな関数の稠密性やトレースには延長（\ref{fa:extension-theorem}, \ref{fa:smooth-up-to-boundary} の多様体版）が要り、ここでは扱わない。

**似た定理.** 関数解析の \ref{fa:extension-theorem} の証明も、有限個の局所座標で境界をまっすぐにし、1 の分割で貼り合わせる、同じ型の議論である。$k=0$ では、この定理は \ref{gl:lp-manifold} の後の「$L^{p}(M)$ は計量によらない」の言い換えになる。

**高い視点：地図帳で測る凹凸.** 多様体は、重なりのある何枚もの地図（座標近傍）を綴じた地図帳である。$\|\cdot\|_{k,p;\mathfrak{A}}$ は、土地の起伏（関数とその導関数）を地図ごとに測って足したもので、地図帳を取り替えると、同じ土地が別の縮尺・別の歪みで描かれるので値は変わる。それでも、地図同士の換算（座標変換）は滑らかで、コンパクトな範囲ではその歪みが一様に抑えられるので、値は定数倍の範囲でしか変わらない。土地が無限に広がっていると（非コンパクト）、遠くの地図ほど縮尺を極端にでき、この保証が崩れる。
:::

::: theorem 完備性 {#gl:sobolev-manifold-complete keywords="W^{k,p}(M) is a Banach space and H^k(M) is a Hilbert space on a closed manifold; bounded sequences in H^k(M) have weakly convergent subsequences" index="多様体上のソボレフ空間の完備性|たようたいじょうのそぼれふくうかんのかんびせい"}
$M$ を閉多様体とする。
1. $W^{k,p}(M)$ はバナッハ空間である。
2. $H^{k}(M)$ は内積 $\langle\cdot,\cdot\rangle_{H^{k}}$ についてヒルベルト空間で、その有界列は弱収束する部分列をもつ。
:::

::: intuition
多様体の上でも、ソボレフ・ノルムについてのコーシー列は、ソボレフ関数に収束する。
:::

::: proof
**Step 1.** 【主張：$W^{k,p}(M)$ のコーシー列 $(u_{m})$ について、$f_{j}\defeq\lim_{m}(\rho_{j}u_{m})^{x_{j}}$（$W^{k,p}(\mathbb{R}^{n})$ での極限）と $u\defeq\lim_{m}u_{m}$（$L^{p}(M)$ での極限）が存在する】ノルムの定義から各 $((\rho_{j}u_{m})^{x_{j}})_{m}$ は $W^{k,p}(\mathbb{R}^{n})$ のコーシー列なので、\ref{fa:sobolev-complete.1} から収束する。\ref{gl:sobolev-manifold-independence.3} から $\|u_{m}-u_{m'}\|_{L^{p}(M)}\le C\|u_{m}-u_{m'}\|_{k,p}$ なので $(u_{m})$ は $L^{p}(M)$ のコーシー列で、\ref{meas:riesz-fischer} から収束する。

**Step 2.** 【主張：$f_{j}=(\rho_{j}u)^{x_{j}}$。したがって $u\in W^{k,p}(M)$ で $u_{m}\to u$】$\rho_{j}(u_{m}-u)$ は $\operatorname{supp}\rho_{j}$ の外で $0$ なので、\ref{gl:sm-chart-lp.2} から $\|(\rho_{j}u_{m})^{x_{j}}-(\rho_{j}u)^{x_{j}}\|_{L^{p}}\le C\|\rho_{j}(u_{m}-u)\|_{L^{p}(M)}\le C\|u_{m}-u\|_{L^{p}(M)}\to0$。一方 $W^{k,p}$ での収束は $L^{p}$ での収束を含むので、$L^{p}(\mathbb{R}^{n})$ の極限の一意性から $f_{j}=(\rho_{j}u)^{x_{j}}$。よって $u\in W^{k,p}(M)$ で、$\|u_{m}-u\|_{k,p}=\sum_{j}\|(\rho_{j}u_{m})^{x_{j}}-f_{j}\|_{W^{k,p}}\to0$。

**Step 3.** 【主張：2】$\langle\cdot,\cdot\rangle_{H^{k}}$ は各項が半正定値エルミート形式の和なので半正定値エルミート形式で、そのノルムは $\|\cdot\|_{k,2}$ と同値（\ref{gl:sobolev-manifold} の後の注意）なので正定値で完備。有界列の主張は \ref{fa:hilbert-weak-compactness}。

::: hypcheck
- **$M$ がコンパクト**：ノルムを有限和にし、Step 1 で \ref{gl:sobolev-manifold-independence.3} を使うのに使った。
- **公理**：新しい選択は使わない（弱収束部分列の存在は \ref{fa:hilbert-weak-compactness} による）。
:::
:::

## 滑らかな関数の稠密性 {#gl:sec-sm-density}

::: theorem 滑らかな関数の稠密性 {#gl:sobolev-manifold-density keywords="smooth functions are dense in W^{k,p}(M) on a closed manifold for p < infinity; explicit approximation by mollifying each localized piece in its chart and gluing back" index="滑らかな関数の稠密性（多様体）|なめらかなかんすうのちゅうみつせいたようたい"}
$M$ を閉多様体、$1\le p<\infty$ とすると、$C^{\infty}(M)$ は $W^{k,p}(M)$ で稠密である。具体的には、局所化のデータ $(U_{j},x_{j},\rho_{j})$ と $u\in W^{k,p}(M)$ について、十分小さな $\varepsilon>0$ で
$$
u_{\varepsilon}\defeq\sum_{j=1}^{N}x_{j}^{*}\bigl(\eta_{\varepsilon}*(\rho_{j}u)^{x_{j}}\bigr)
$$
は $C^{\infty}(M)$ の元で、$\varepsilon\to0$ で $\|u_{\varepsilon}-u\|_{k,p}\to0$。
:::

::: intuition
多様体の上のソボレフ関数は、1 の分割で切った片を座標の中で少しぼかし、元の場所に貼り戻すことで、滑らかな関数でいくらでもよく近似できる。
:::

::: proof
$f_{j}\defeq(\rho_{j}u)^{x_{j}}\in W^{k,p}(\mathbb{R}^{n})$ はコンパクト集合 $K_{j}\defeq x_{j}(\operatorname{supp}\rho_{j})$ の外で $0$ である。$x_{j}(U_{j})\neq\mathbb{R}^{n}$ なら $\delta_{j}\defeq\frac12\operatorname{dist}(K_{j},\mathbb{R}^{n}\setminus x_{j}(U_{j}))>0$、そうでなければ $\delta_{j}\defeq1$ とし、$L_{j}\defeq\{z:\operatorname{dist}(z,K_{j})\le\delta_{j}\}$ とおく。$L_{j}$ はコンパクトで $x_{j}(U_{j})$ に含まれる。

**Step 1.** 【主張：$\varepsilon<\delta_{j}$ なら $\eta_{\varepsilon}*f_{j}\in C_{c}^{\infty}(\mathbb{R}^{n})$ は $L_{j}$ の外で $0$ で、$\varepsilon\to0$ で $W^{k,p}(\mathbb{R}^{n})$ において $f_{j}$ に収束する】台の主張は \ref{fa:mollification.4}（$\Omega=\mathbb{R}^{n}$）から。$f_{j}$ は $\mathbb{R}^{n}$ のコンパクト集合の外で $0$ なので、\ref{fa:mollification-sobolev.3}（$\Omega=\mathbb{R}^{n}$、ここで $p<\infty$ を使う）から収束する。

**Step 2.** 【主張：$\varepsilon<\min_{j}\delta_{j}$ なら $u_{\varepsilon}\in C^{\infty}(M)$ で、$u=\sum_{j}x_{j}^{*}f_{j}$】$w\in C_{c}^{\infty}(\mathbb{R}^{n})$ が $L_{j}$ の外で $0$ なら、$x_{j}^{*}w$ は $U_{j}$ の上で滑らかで、コンパクト集合 $x_{j}^{-1}(L_{j})$（$M$ の閉集合）の外で $0$ なので、開集合 $M\setminus x_{j}^{-1}(L_{j})$ の上でも滑らかである。よって $u_{\varepsilon}$ は滑らか。また $\rho_{j}u$ は $U_{j}$ の外で $0$ なので $x_{j}^{*}f_{j}=\rho_{j}u$ で、足すと $u$。

**Step 3.** 【主張：$\|u_{\varepsilon}-u\|_{k,p}\to0$】Step 2 から $u_{\varepsilon}-u=\sum_{j}x_{j}^{*}(\eta_{\varepsilon}*f_{j}-f_{j})$ で、$\eta_{\varepsilon}*f_{j}-f_{j}$ は $L_{j}$ の外で $0$。\ref{gl:sm-localization.2}（$(U,x,L)=(U_{j},x_{j},L_{j})$）から
$$
\|u_{\varepsilon}-u\|_{k,p}\le\sum_{j=1}^{N}C_{j}\,\|\eta_{\varepsilon}*f_{j}-f_{j}\|_{W^{k,p}(\mathbb{R}^{n})},
$$
右辺は Step 1 から $0$ に収束する。

::: hypcheck
- **$p<\infty$**：Step 1 で軟化の $L^{p}$ 収束に使った。$p=\infty$ では偽：$W^{1,\infty}(S^{1})$ を同じ形で定義すると、角度座標で $|t|$（$-\pi\le t\le\pi$ の上）となる関数は $W^{1,\infty}$ に入るが、弱微分が $t=0$ で跳ぶので、$C^{1}$ 関数で $W^{1,\infty}$ ノルムについて近似できない（連続関数の一様極限は連続）。
- **$M$ がコンパクト（閉）**：Step 3 の和を有限にし、遠方での切り落としを不要にした。境界がないことは、$K_{j}$ が座標の像の内部のコンパクト集合で、軟化しても $x_{j}(U_{j})$ からはみ出さないこと（Step 1・2）に使った。
- **公理**：新しい選択は使わない（$\varepsilon$ は具体的に決まる）。
:::
:::

::: supplement
**前提を変えると.** 境界つき領域 $D$ では、境界に台が触れる片を軟化すると $D$ の外にはみ出すので、この証明は使えない。$D$ の内部で滑らかな関数の稠密性は \ref{fa:meyers-serrin} と同じ議論で示せるが、境界まで滑らかな関数の稠密性には延長が要る（$\mathbb{R}^{n}$ の領域では \ref{fa:smooth-up-to-boundary}）。$C_{c}^{\infty}(\operatorname{int}D)$ の閉包 $W_{0}^{k,p}(\operatorname{int}D)$ は（$k\ge1$, $\partial D\neq\varnothing$ なら）$W^{k,p}(\operatorname{int}D)$ より真に小さい（ディリクレ境界条件を課した空間）。非コンパクトな完備リーマン多様体では、計量によるノルムの $W^{1,p}$ について $C_{c}^{\infty}(M)$ が稠密であることが知られている（ここでは証明しない）。

**似た定理.** $\mathbb{R}^{n}$ では、遠方を切り落としてから軟化する（\ref{fa:test-dense-rn}）。開集合では、局所有限な 1 の分割と場所ごとに幅を変えた軟化を使う（\ref{fa:meyers-serrin}）。閉多様体は「無限遠も境界もない」ので、有限個の片を同じ幅で軟化するだけで済む。

**高い視点：タイルごとのぼかし.** 大きな写真を何枚かのタイルに切って（1 の分割）、各タイルを平らな台の上で少しだけぼかし（軟化）、元に貼り戻すと、継ぎ目まで滑らかな写真が得られる。ぼかしの幅を小さくすれば元の写真にいくらでも近い。タイルの枚数が有限で、どのタイルも台の縁から離れている（境界がない）ので、ぼかしが台からはみ出すことも、無限に多くのタイルで誤差が積み上がることもない。
:::

## 問題 {#gl:sec-sm-problems}

::: problem {#gl:prob-sm-diffeomorphism}
$F\colon M\to N$ を閉多様体の間の微分同相写像とする。$u\mapsto u\circ F$ が $W^{k,p}(N)$ から $W^{k,p}(M)$ への有界な線形全単射で、逆写像も有界であることを示せ。
:::

::: solution
$M$ の局所化のデータ $(U_{j},x_{j},\rho_{j})$ をとる。$F$ は微分同相写像なので、$(F(U_{j}),x_{j}\circ F^{-1})$ は $N$ の座標近傍で、$\theta_{j}\defeq\rho_{j}\circ F^{-1}\in C^{\infty}(N)$ の台は $F(U_{j})$ に含まれる。$(x_{j}\circ F^{-1})^{-1}=F\circ x_{j}^{-1}$ なので、$x_{j}(U_{j})$ の上で
$$
\bigl(\rho_{j}\cdot(u\circ F)\bigr)\circ x_{j}^{-1}=(\rho_{j}\circ F^{-1}\circ F\circ x_{j}^{-1})\,(u\circ F\circ x_{j}^{-1})=(\theta_{j}u)\circ(x_{j}\circ F^{-1})^{-1},
$$
すなわち $(\rho_{j}\cdot(u\circ F))^{x_{j}}=(\theta_{j}u)^{x_{j}\circ F^{-1}}$。$F$ は座標で見て微分同相写像なので零集合を零集合に写し（\ref{gl:sm-chart-lp.1} と \ref{meas:change-of-variables.1}）、$u\circ F$ は類として定まる。$u\in W^{k,p}(N)$ なら、\ref{gl:sm-localization.1}（$N$ の上で、座標近傍 $(F(U_{j}),x_{j}\circ F^{-1})$ と $\theta_{j}$ に使う）から右辺は $W^{k,p}(\mathbb{R}^{n})$ に入り、ノルムは $\le C_{j}\|u\|_{k,p}$。各 $\rho_{j}(u\circ F)$ は \ref{gl:sm-chart-lp.2} から $L^{p}(M)$ に入るので $u\circ F\in L^{p}(M)$、よって $u\circ F\in W^{k,p}(M)$ で $\|u\circ F\|_{k,p}\le(\sum_{j}C_{j})\|u\|_{k,p}$。逆写像 $v\mapsto v\circ F^{-1}$ にも同じ議論を $F^{-1}$ で行えばよい。
:::

::: problem {#gl:prob-sm-metric-h1}
$(M,g)$ を閉リーマン多様体とし、複素数値の $u\in C^{\infty}(M)$ について $|\nabla u|^{2}\defeq|\operatorname{grad}\operatorname{Re}u|^{2}+|\operatorname{grad}\operatorname{Im}u|^{2}$（座標では $\sum_{i,l}g^{il}\partial_{i}u\,\overline{\partial_{l}u}$）とおく。正の定数 $c,C$ があって、すべての $u\in C^{\infty}(M)$ について
$$
c\|u\|_{H^{1}}^{2}\le\int_{M}\bigl(|u|^{2}+|\nabla u|^{2}\bigr)\,d\mu_{g}\le C\|u\|_{H^{1}}^{2}
$$
となることを示せ。これから、$H^{1}(M)$ は $C^{\infty}(M)$ をノルム $\bigl(\int(|u|^{2}+|\nabla u|^{2})\bigr)^{1/2}$ で完備化したものと同一視できることを導け。
:::

::: solution
局所化のデータ $(U_{j},x_{j},\rho_{j})$ を固定し、$K_{j}\defeq x_{j}(\operatorname{supp}\rho_{j})$、$F_{j}\defeq(\rho_{j}u)^{x_{j}}$ とする。コンパクト集合 $K_{j}$ の上で、$\gamma_{x_{j}}$ は $[d_{1},d_{2}]\subset(0,\infty)$ に値をとり、正定値行列 $(g^{il}\circ x_{j}^{-1})$ の固有値は $[a,b]\subset(0,\infty)$ に入る（$(m,v)\mapsto v^{\mathsf{T}}G(m)v$ がコンパクト集合 $K_{j}\times\{|v|=1\}$ の上で正の最小値と最大値をとるため。$G$ はこの行列）。よって $K_{j}$ の上で $a\sum_{i}|\partial_{i}F_{j}|^{2}\le|\nabla(\rho_{j}u)|^{2}\circ x_{j}^{-1}\le b\sum_{i}|\partial_{i}F_{j}|^{2}$（実部と虚部に分けて固有値の評価を使う）。

**左の不等式.** \ref{gl:rm-integral-formulas.1} から
$$
\|F_{j}\|_{H^{1}(\mathbb{R}^{n})}^{2}=\int_{K_{j}}\Bigl(|F_{j}|^{2}+\sum_{i}|\partial_{i}F_{j}|^{2}\Bigr)d\lambda\le\frac{\max(1,a^{-1})}{d_{1}}\int_{M}\bigl(|\rho_{j}u|^{2}+|\nabla(\rho_{j}u)|^{2}\bigr)d\mu_{g}.
$$
$\nabla(\rho_{j}u)=\rho_{j}\nabla u+u\nabla\rho_{j}$ から $|\nabla(\rho_{j}u)|\le|\nabla u|+B|u|$（$B\defeq\max_{j}\max_{M}|\nabla\rho_{j}|$）、$|\rho_{j}u|\le|u|$ なので右辺は $\le C'\int(|u|^{2}+|\nabla u|^{2})$。$j$ について足す。

**右の不等式.** $u=\sum_{j}\rho_{j}u$ とコーシー–シュワルツの不等式から $|u|^{2}\le N\sum_{j}|\rho_{j}u|^{2}$、$|\nabla u|^{2}\le N\sum_{j}|\nabla(\rho_{j}u)|^{2}$。各項は
$$
\int_{M}\bigl(|\rho_{j}u|^{2}+|\nabla(\rho_{j}u)|^{2}\bigr)d\mu_{g}\le d_{2}\max(1,b)\,\|F_{j}\|_{H^{1}(\mathbb{R}^{n})}^{2}.
$$
$j$ について足せば $C=Nd_{2}\max(1,b)$ でよい。

**完備化.** $C^{\infty}(M)$ は $H^{1}(M)$ で稠密（\ref{gl:sobolev-manifold-density}）で、$H^{1}(M)$ は完備（\ref{gl:sobolev-manifold-complete}）。二つのノルムは $C^{\infty}(M)$ の上で同値なので、$C^{\infty}(M)$ の列が一方のノルムでコーシー列であることと他方でコーシー列であることは同じで、計量のノルムでの完備化は、$H^{1}(M)$ の中の $C^{\infty}(M)$ の閉包、すなわち $H^{1}(M)$ と同一視できる。
:::
