<p class="mn-msc">MSC2020: 58A05, 46E35, 58J05</p>

## 前提知識

- [多様体論 › 可微分多様体](../../../05-geometry-topology/04-manifolds/02-smooth-manifolds/index.html)（全体、10 ページ）：可微分多様体・1 の分割・微分形式・ストークスの定理
- [微分幾何学 › リーマン幾何](../../../05-geometry-topology/05-differential-geometry/03-riemannian/index.html)（全体、8 ページ）：リーマン計量・体積形式・星作用素とラプラシアン
- [関数解析 › 超関数とソボレフ空間](../../../04-analysis/07-functional-analysis/03-distributions-sobolev/index.html)（全体、7 ページ）：ℝⁿ と領域上のソボレフ空間・埋め込み・レリッヒ
- [測度とルベーグ積分 › ルベーグ積分](../../../04-analysis/03-measure-theory/02-integration/index.html)（全体、9 ページ）：ルベーグ積分・Lᵖ 空間
