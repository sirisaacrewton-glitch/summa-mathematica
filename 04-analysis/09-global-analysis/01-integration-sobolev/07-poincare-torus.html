# ポアンカレの不等式とトーラスでの直接の証明 {#gl:page-poincare-torus keywords="Poincare inequality on closed connected Riemannian manifolds, ||u - u_{M}||_{L^2} <= C ||grad u||_{L^2}, proof by contradiction from Rellich's theorem, smallest positive eigenvalue of the Laplacian, direct proofs of Sobolev embedding and Rellich compactness on the flat torus by Fourier coefficients, sharp Poincare constant on the torus, ポアンカレの不等式, ポアンカレ–ヴィルティンガーの不等式, トーラス"}

前のページ（\ref{gl:page-embeddings}）では、閉多様体の上のソボレフの埋め込み定理とレリッヒの定理を、1 の分割で $\mathbb{R}^{n}$ の結果に帰着させて示した。このページでは、レリッヒの定理の最初の応用として、連結な閉多様体の上のポアンカレの不等式「平均からのずれは勾配で抑えられる」を背理法で示す。その最良の定数はラプラシアンの最小の正の固有値で決まるが、それは後の系列（楕円作用素のスペクトル）で扱う。後半では、平坦トーラスの上で、埋め込み・レリッヒの定理・ポアンカレの不等式（最良の定数つき）がフーリエ係数だけで直接示せることを見て、一般の証明と比べる。

## 記法と定義の確認 {#gl:sec-pw-notation}

::: notation
- $M$ は $n$ 次元の閉多様体、$g$ はリーマン計量、$\mu_{g}$, $\operatorname{vol}(M)$, $L^{p}(M)$, $W^{k,p}(M)$, $H^{k}(M)$、局所化のデータ、片、座標表示は \ref{gl:page-embeddings} の記法の節のとおり。$M$ 上の二つの連続関数が a.e. で等しければ至る所で等しい（\ref{gl:riemannian-measure.2}）。
- 前のページの二つの主定理 \ref{gl:sobolev-embedding-manifold}, \ref{gl:rellich-manifold} を使う。$\mathbb{R}^{n}$ の勾配が $0$ の関数は \ref{fa:zero-gradient}、領域でのポアンカレ–ヴィルティンガーの不等式は \ref{fa:poincare-wirtinger}。
- 複素数値の $u\in C^{\infty}(M)$ について $|\nabla u|^{2}\defeq|\operatorname{grad}\operatorname{Re}u|^{2}+|\operatorname{grad}\operatorname{Im}u|^{2}$（座標では $\sum_{i,l}g^{il}\,\partial_{i}u\,\overline{\partial_{l}u}$）、$\|\nabla u\|_{L^{2}}\defeq\bigl(\int_{M}|\nabla u|^{2}d\mu_{g}\bigr)^{1/2}$。正の定数 $c_{0},C_{0}$ があって $c_{0}\|u\|_{H^{1}}^{2}\le\|u\|_{L^{2}}^{2}+\|\nabla u\|_{L^{2}}^{2}\le C_{0}\|u\|_{H^{1}}^{2}$（\ref{gl:sm-metric-h1}）。$u\in L^{1}(M)$ の平均を $u_{M}\defeq\operatorname{vol}(M)^{-1}\int_{M}u\,d\mu_{g}$ と書く。
- トーラス $T^{n}$、写像 $p(t)=(e^{it_{1}},\dots,e^{it_{n}})$、座標近傍 $x_{a}$、$e_{m}$、フーリエ係数 $\hat{u}(m)$、$S_{N}u$、$D_{j}$ は \ref{gl:sec-nt-torus} のとおり。$|m|_{\infty}\defeq\max_{j}|m_{j}|$。
- **選択公理**：局所化のデータの存在（1 の分割）で DC を使う点は前のページと同じ。新しく使うのは、ポアンカレの不等式（\ref{gl:poincare-manifold}）の背理法で列を一つずつ選ぶ可算選択公理だけである（\ref{fa:poincare-wirtinger} と同じ）。トーラスでの部分列は具体的な手順で決まる。
:::

## ポアンカレの不等式 {#gl:sec-pw-poincare}

::: theorem 閉多様体上のポアンカレの不等式 {#gl:poincare-manifold refname="閉多様体上のポアンカレの不等式" keywords="Poincare inequality on a closed connected Riemannian manifold: ||u - u_{M}||_{L^2} <= C ||grad u||_{L^2}; proof by contradiction using Rellich's theorem; extension of ||grad u|| to H^1(M); relation to the smallest positive eigenvalue of the Laplacian" index="ポアンカレの不等式（閉多様体）|ぽあんかれのふとうしきへいたようたい, ポアンカレ–ヴィルティンガーの不等式（閉多様体）|ぽあんかれう゛ぃるてぃんがーのふとうしきへいたようたい"}
$(M,g)$ を連結な閉リーマン多様体とする。
1. 定数 $C$ があって、すべての $u\in C^{\infty}(M)$ について $\|u-u_{M}\|_{L^{2}}\le C\|\nabla u\|_{L^{2}}$。
2. $u\mapsto\|\nabla u\|_{L^{2}}$ は $H^{1}(M)$ の上の連続な半ノルムにただ一通りに延び、記法の節の不等式 $c_{0}\|u\|_{H^{1}}^{2}\le\|u\|_{L^{2}}^{2}+\|\nabla u\|_{L^{2}}^{2}\le C_{0}\|u\|_{H^{1}}^{2}$ と 1 の不等式は $u\in H^{1}(M)$ でも成り立つ。
:::

::: intuition
つながった閉多様体の上では、関数の平均からのずれは、勾配の大きさで抑えられる。勾配がほとんど $0$ なのに平均から大きくずれる関数はない。
:::

::: proof
**Step 1（局所の評価）.** 【主張：座標近傍 $(U,x)$ と $\psi\in C_{c}^{\infty}(x(U))$ について、定数 $C_{\psi}$ があって、すべての $v\in C^{\infty}(M)$ と $l$ について $\bigl|\int_{x(U)}\partial_{l}(v\circ x^{-1})\,\psi\,d\lambda\bigr|\le C_{\psi}\|\nabla v\|_{L^{2}}$】$L\defeq\operatorname{supp}\psi$ はコンパクトなので、$\gamma_{x}$ は $L$ の上で正の最小値 $d$ をもち、正定値行列 $G=(g^{il}\circ x^{-1})$ の固有値は $L$ の上で正の数 $a$ 以上である（$(z,\xi)\mapsto\xi^{\mathsf{T}}G(z)\xi$ はコンパクト集合 $L\times\{|\xi|=1\}$ の上で正の最小値をとる）。$V\defeq v\circ x^{-1}$ について、実部と虚部に分けてこの評価を使うと $L$ の上で $\sum_{i}|\partial_{i}V|^{2}\le a^{-1}|\nabla v|^{2}\circ x^{-1}$。コーシー–シュワルツの不等式と \ref{gl:rm-integral-formulas.1} から
$$
\begin{aligned}\int_{L}|\partial_{l}V|\,|\psi|\,d\lambda&\le\|\psi\|_{L^{2}}\Bigl(\frac1{ad}\int_{L}(|\nabla v|^{2}\circ x^{-1})\,\gamma_{x}\,d\lambda\Bigr)^{1/2}\\&\le\frac{\|\psi\|_{L^{2}}}{\sqrt{ad}}\|\nabla v\|_{L^{2}}.\end{aligned}
$$

**Step 2.** 【主張：1 が成り立たないなら、$u_{i}\in C^{\infty}(M)$ で $(u_{i})_{M}=0$, $\|u_{i}\|_{L^{2}}=1$, $\|\nabla u_{i}\|_{L^{2}}<\frac1i$ となる列がある】成り立たなければ、各 $i$ について $\|v-v_{M}\|_{L^{2}}>i\|\nabla v\|_{L^{2}}$ となる $v\in C^{\infty}(M)$ がある（ここで $v$ を $i$ ごとに一つ選ぶのに可算選択公理を使う）。$v-v_{M}\neq0$ なので $u_{i}\defeq(v-v_{M})/\|v-v_{M}\|_{L^{2}}$ とおけば、定数の勾配は $0$ なので $\nabla u_{i}=\nabla v/\|v-v_{M}\|_{L^{2}}$ で、主張の性質をもつ。

**Step 3.** 【主張：部分列が $L^{2}(M)$ で $u$ に収束し、$\|u\|_{L^{2}}=1$, $u_{M}=0$】記法の節の不等式から $c_{0}\|u_{i}\|_{H^{1}}^{2}\le1+i^{-2}\le2$ なので $(u_{i})$ は $H^{1}(M)$ で有界。\ref{gl:rellich-manifold.1}（$p=q=2$）から部分列が $L^{2}$ で収束する。ノルムは連続なので $\|u\|=1$。平均は $|v_{M}|\le\operatorname{vol}(M)^{-1/2}\|v\|_{L^{2}}$（コーシー–シュワルツ）から $L^{2}$ で連続なので $u_{M}=\lim(u_{i})_{M}=0$。

**Step 4.** 【主張：$u$ は a.e. で定数】各点は、$x(U)$ が開球となる座標近傍 $(U,x)$ に含まれる（任意の座標近傍を、像の中の球の逆像に制限する）。そのような $(U,x)$ と $\psi\in C_{c}^{\infty}(x(U))$、$L\defeq\operatorname{supp}\psi$ について、\ref{gl:rm-integral-formulas.1} から $\int_{L}|(u_{i}-u)\circ x^{-1}|^{2}d\lambda\le d^{-1}\|u_{i}-u\|_{L^{2}}^{2}\to0$ なので（$u\circ x^{-1}$ は同じ評価から $L_{\mathrm{loc}}^{1}(x(U))$ に入る）、部分積分と Step 1 から
$$
\begin{aligned}\Bigl|\int(u\circ x^{-1})\,\partial_{l}\psi\,d\lambda\Bigr|&=\lim_{i}\Bigl|\int(u_{i}\circ x^{-1})\,\partial_{l}\psi\,d\lambda\Bigr|\\&=\lim_{i}\Bigl|\int\partial_{l}(u_{i}\circ x^{-1})\,\psi\,d\lambda\Bigr|\le\lim_{i}\frac{C_{\psi}}i=0.\end{aligned}
$$
よって $u\circ x^{-1}$ の弱勾配は連結な開集合 $x(U)$ の上で $0$ で、\ref{fa:zero-gradient} から $U$ の上で $u$ は a.e. で定数 $c_{U}$（\ref{gl:sm-chart-lp.1} で零集合が対応する）。$c_{U}$ は $U$ だけで決まる。一つの $U_{0}$ をとって $c\defeq c_{U_{0}}$ とし、$G$ を $c_{U}=c$ となるそのような $U$ の和、$G'$ を $c_{U}\neq c$ となるものの和とする。$U$ と $U'$ が交われば、共通部分は測度が正の開集合（\ref{gl:riemannian-measure.2}）でその上で $c_{U}=u=c_{U'}$ a.e. なので $c_{U}=c_{U'}$。よって $G$, $G'$ は交わらない開集合で、和は $M$、$G\ni U_{0}$ は空でない。$M$ は連結なので $G=M$。$M$ はコンパクトなので有限個の $U$ で覆え、$u=c$ a.e.。

**Step 5.** 【主張：矛盾が起こり、1 が成り立つ】Step 4 と $u_{M}=0$ から $c\operatorname{vol}(M)=0$、$c=0$、$u=0$ となり、$\|u\|_{L^{2}}=1$ に反する。

**Step 6.** 【主張：2 が成り立つ】各点で $|\nabla(v+w)|\le|\nabla v|+|\nabla w|$（$T_{p}M\oplus T_{p}M$ の上の $g$ のノルム）なので、ミンコフスキーの不等式から $E(v)\defeq\|\nabla v\|_{L^{2}}$ は $C^{\infty}(M)$ の上の半ノルムで、$|E(v)-E(w)|\le E(v-w)\le C_{0}^{1/2}\|v-w\|_{H^{1}}$。$C^{\infty}(M)$ は $H^{1}(M)$ で稠密（\ref{gl:sobolev-manifold-density}）なので、$E$ は $H^{1}(M)$ 上の連続関数にただ一通りに延び、極限で半ノルムのまま。記法の節の不等式と 1 の両辺は $H^{1}$ のノルムについて連続（$\|v-v_{M}\|_{L^{2}}\le2\|v\|_{L^{2}}$）なので、稠密性から $H^{1}(M)$ 全体で成り立つ。

::: hypcheck
- **$M$ が連結**：Step 4 で $G=M$ とするのに使った。外すと偽：$M=M_{1}\sqcup M_{2}$ で、$M_{1}$ の上で $\operatorname{vol}(M_{2})$、$M_{2}$ の上で $-\operatorname{vol}(M_{1})$ となる関数は、滑らかで勾配が $0$、平均が $0$ だが $0$ でない。
- **$M$ がコンパクト**：Step 3 でレリッヒの定理を使い、Step 4 で有限個の近傍で覆うのに使った。外すと偽：$M=\mathbb{R}^{n}$ では平均さえ定義できず、平均 $0$ の $u_{R}(z)\defeq\beta(z/R)-\beta(z/R-3e_{1})$（$\beta$ は台が単位球に入る隆起関数）について $\|u_{R}\|_{L^{2}}/\|\nabla u_{R}\|_{L^{2}}=R\,\|u_{1}\|/\|\nabla u_{1}\|\to\infty$。
- **$p=2$**：本質的でない。$|\nabla u|$ の $L^{p}$ ノルムで同じ証明が通る（$1\le p<\infty$）。
- **公理**：Step 2 で可算選択公理を使った。それ以外の新しい選択は使わない。
:::
:::

::: supplement
**最良の定数とラプラシアン.** $u$ が実数値で滑らかなら $\int_{M}|\nabla u|^{2}d\mu_{g}=\int_{M}u\,\Delta u\,d\mu_{g}$（\ref{gl:closed-manifold-laplacian.2}）。滑らかな実数値の $\varphi\neq0$ が $\Delta\varphi=\lambda\varphi$, $\lambda>0$ を満たせば、$\lambda\int\varphi=\int\Delta\varphi=0$（\ref{gl:closed-manifold-laplacian.3}）から $\varphi_{M}=0$ で、$\|\nabla\varphi\|_{L^{2}}^{2}=\lambda\|\varphi\|_{L^{2}}^{2}$。よって 1 の定数は $C\ge\lambda^{-1/2}$ でなければならない。実は最良の定数はちょうど $\lambda_{1}^{-1/2}$（$\lambda_{1}$ はラプラシアンの最小の正の固有値）で、$\lambda_{1}$ の存在とこの等式は、後の系列（楕円作用素のスペクトル）で、レリッヒの定理から得られる固有関数展開を使って示す予定である。平坦トーラスでは $\lambda_{1}=1$ で、$C=1$ が直接確かめられる（\ref{gl:torus-direct.3}）。単位球面 $S^{2}$ では高さ関数 $z$ が $\Delta z=2z$ を満たす（\ref{gl:laplacian-examples.1}）ので $C\ge2^{-1/2}$ である。

**似た定理.** $\mathbb{R}^{n}$ の有界な連結 $C^{1}$ 領域での \ref{fa:poincare-wirtinger} と同じ背理法で、閉多様体では境界がないぶん境界の正則性の仮定が要らない。境界で $0$ となる関数については、平均を引かない形（\ref{fa:poincare-inequality}）が成り立つ。背理法の証明は定数の値を与えないが、リッチ曲率の正の下限から $\lambda_{1}$ の下限を与えるリヒネロヴィッツの定理など、幾何から $\lambda_{1}$ を評価する定理が知られている（ここでは証明しない）。

**高い視点：太鼓の張り.** 閉多様体を一枚の太鼓の膜と思うと、$\|\nabla u\|^{2}$ は膜をゆがめたときの張力のエネルギー、$\|u-u_{M}\|^{2}$ は平らな位置からのずれの大きさである。ポアンカレの不等式は「ずれに比べて張力のエネルギーを任意に小さくはできない」ことで、最良の定数は膜の最も低い振動数（基音）で決まる。膜が二枚に分かれていれば（非連結）、片方を持ち上げてもう片方を下げるだけで、張力なしにずらせてしまう。
:::

## トーラスでの直接の証明 {#gl:sec-pw-torus}

平坦トーラス $T^{n}$ では、$H^{k}$ がフーリエ係数の重みつきの二乗和で特徴づけられる（\ref{gl:torus-sobolev}）ので、埋め込み・レリッヒ・ポアンカレのどれもが、係数についての初等的な評価に帰着する。この節では、フーリエ係数の添字に $m\in\mathbb{Z}^{n}$ を使うので、微分の回数を $r$ と書く。

::: proposition トーラスでの埋め込みとコンパクト性 {#gl:torus-direct keywords="direct proofs on the flat torus via Fourier coefficients: H^k(T^n) into C^r for k > n/2 + r by Cauchy-Schwarz and summability of weights; compactness of H^k into H^l by a diagonal argument on coefficients; Poincare inequality with the sharp constant 1" index="トーラスでのソボレフの埋め込み|とーらすでのそぼれふのうめこみ, トーラスでのレリッヒの定理|とーらすでのれりっひのていり"}
$k\ge0$ を整数とする。
1. $k>\frac n2+r$（$r\ge0$ は整数）なら、$u\in H^{k}(T^{n})$ について $\sum_{m}(1+|m|^{2})^{r/2}|\hat{u}(m)|\le C\|u\|_{H^{k}}$ で、フーリエ級数 $\sum_{m}\hat{u}(m)e_{m}$ は一様に絶対収束して $u$ の $C^{r}$ 級の代表元 $\tilde{u}$ を与え、$|\beta|\le r$ について $D^{\beta}\tilde{u}=\sum_{m}(im)^{\beta}\hat{u}(m)e_{m}$（一様収束）。
2. 整数 $k>l\ge0$ について、$H^{k}(T^{n})$ の有界列は $H^{l}(T^{n})$ で収束する部分列をもつ。
3. $u\in H^{1}(T^{n})$ について $\|u-u_{M}\|_{L^{2}}\le\|\nabla u\|_{L^{2}}$（$M=T^{n}$、平坦な計量）で、等号が成り立つのは、$|m|^{2}\ge2$ となるすべての $m$ で $\hat{u}(m)=0$ のとき（$u$ が $1$ と $e^{\pm it_{j}}$ の一次結合のとき）に限る。とくに定数 $1$ は最良である。
:::

::: proof
\ref{gl:torus-sobolev.2} の定数を $c,C$ とし、$\Sigma_{s}\defeq\sum_{m\in\mathbb{Z}^{n}}(1+|m|^{2})^{-s}$ とおく。$\Sigma_{s}<\infty\iff2s>n$（\ref{gl:prob-nt-delta-torus} の解答の前半。$s$ は整数でも実数でも同じ計算）。

**Step 1（重みの和の収束）.** 【主張：1 の係数の評価】$s\defeq k-r$ とすると $2s>n$。コーシー–シュワルツの不等式から
$$
\sum_{m}(1+|m|^{2})^{r/2}|\hat{u}(m)|\le\Sigma_{s}^{1/2}\Bigl(\sum_{m}(1+|m|^{2})^{k}|\hat{u}(m)|^{2}\Bigr)^{1/2}\le(C\Sigma_{s})^{1/2}\|u\|_{H^{k}}.
$$

**Step 2.** 【主張：1 の残り】$|\beta|\le r$ なら $|(im)^{\beta}|\le|m|^{|\beta|}\le(1+|m|^{2})^{r/2}$ で $|e_{m}|=1$ なので、Step 1 とワイエルシュトラスの判定法から、$S_{N}u$ と $D^{\beta}S_{N}u=\sum_{|m|_{\infty}\le N}(im)^{\beta}\hat{u}(m)e_{m}$ は $T^{n}$ 上で一様収束する（和は絶対収束なので並べ方によらない）。$U_{N}\defeq(S_{N}u)\circ p$ は $\mathbb{R}^{n}$ 上の滑らかな周期関数で、$\partial^{\beta}U_{N}=(D^{\beta}S_{N}u)\circ p$（\ref{gl:sec-nt-torus} の冒頭の $D_{j}$ の性質）が $|\beta|\le r$ で一様収束するので、一様収束と微分の交換（\ref{calc:uniform-derivative} を各変数に使う）から極限 $\tilde{U}$ は $C^{r}$ 級で $\partial^{\beta}\tilde{U}=\lim\partial^{\beta}U_{N}$。$\tilde{u}\defeq\lim S_{N}u$ について $\tilde{u}\circ p=\tilde{U}$ で、各座標近傍 $x_{a}$ では $\tilde{u}\circ x_{a}^{-1}=\tilde{U}$ なので $\tilde{u}\in C^{r}(T^{n})$。$S_{N}u\to u$（$L^{2}$、\ref{gl:torus-fourier-basis.2}）で、$\mu_{g}(T^{n})<\infty$ から一様収束は $L^{2}$ 収束を含むので、$\tilde{u}=u$ a.e.。

**Step 3（対角線論法）.** 【主張：2】$\|u_{i}\|_{H^{k}}\le B$ とすると、$\sum_{m}(1+|m|^{2})^{k}|\hat{u}_{i}(m)|^{2}\le CB^{2}\eqdef B'$ で、とくに $|\hat{u}_{i}(m)|\le B'^{1/2}$。$\mathbb{Z}^{n}$ を $m^{(1)},m^{(2)},\dots$ と並べ（$|m|_{\infty}$ の順、同じ値の中は辞書式の順）、\ref{top:bolzano-weierstrass} で $(\hat{u}_{i}(m^{(1)}))_{i}$ が収束する部分列をとり、その中で $(\hat{u}_{i}(m^{(2)}))_{i}$ が収束する部分列をとり、と続けて対角線をとると、部分列（記号を変えない）で、すべての $m$ について $(\hat{u}_{i}(m))_{i}$ が収束するものが得られる。$\varepsilon>0$ について $R$ を $4B'(1+R^{2})^{l-k}<\varepsilon$ となるようにとると、$|m|>R$ の部分は
$$
\begin{aligned}&\sum_{|m|>R}(1+|m|^{2})^{l}|\hat{u}_{i}(m)-\hat{u}_{i'}(m)|^{2}\\&\le(1+R^{2})^{l-k}\sum_{m}(1+|m|^{2})^{k}\cdot2\bigl(|\hat{u}_{i}(m)|^{2}+|\hat{u}_{i'}(m)|^{2}\bigr)\\&\le4B'(1+R^{2})^{l-k}<\varepsilon\end{aligned}
$$
（$l-k<0$ なので $|m|>R$ で $(1+|m|^{2})^{l-k}\le(1+R^{2})^{l-k}$）。$|m|\le R$ の有限個の項は $i,i'\to\infty$ で $0$ に近づく。\ref{gl:torus-sobolev.2}（$l$ について、$u_{i}-u_{i'}\in H^{k}\subset H^{l}$ に使う）から $c\|u_{i}-u_{i'}\|_{H^{l}}^{2}$ はこの和以下なので、$(u_{i})$ は $H^{l}$ のコーシー列で、完備性（\ref{gl:sobolev-manifold-complete.2}）から収束する。

**Step 4.** 【主張：3】平坦な計量では $g^{il}=\delta_{il}$ で、各 $x_{a}$ で $D_{j}$ は座標ベクトル場なので、滑らかな $u$ について $|\nabla u|^{2}=\sum_{j}|D_{j}u|^{2}$。パーセヴァルの等式（\ref{gl:torus-fourier-basis.2}）と \ref{gl:torus-fourier-basis.3} から $\|\nabla u\|_{L^{2}}^{2}=(2\pi)^{n}\sum_{m}|m|^{2}|\hat{u}(m)|^{2}$。$u_{M}=(2\pi)^{-n}\int_{(0,2\pi)^{n}}u\circ p=\hat{u}(0)$ なので $u-u_{M}$ の係数は $m\neq0$ で $\hat{u}(m)$、$m=0$ で $0$、よって
$$
\|u-u_{M}\|_{L^{2}}^{2}=(2\pi)^{n}\sum_{m\neq0}|\hat{u}(m)|^{2}\le(2\pi)^{n}\sum_{m\neq0}|m|^{2}|\hat{u}(m)|^{2}=\|\nabla u\|_{L^{2}}^{2}.
$$
$m\neq0$ なら $|m|^{2}$ は正の整数なので $|m|^{2}\ge1$ で、右辺と左辺の差は $(2\pi)^{n}\sum_{m\neq0}(|m|^{2}-1)|\hat{u}(m)|^{2}$。これが $0$ になるのは、$|m|^{2}\ge2$ のすべての $m$ で $\hat{u}(m)=0$ のときに限る。$u=e^{it_{1}}$（を $T^{n}$ 上の関数とみたもの）では $u_{M}=0$ で等号が成り立つので、定数 $1$ は最良。$H^{1}$ への拡張は、両辺が $H^{1}$ で連続（\ref{gl:poincare-manifold.2}）なことと稠密性から。

::: hypcheck
- **平坦な計量**：\ref{gl:torus-sobolev} を通して Step 1〜3 で、$|\nabla u|^{2}=\sum_{j}|D_{j}u|^{2}$ として Step 4 で使った。計量を替えると、1・2 は（空間が計量によらないので）そのまま成り立つが、3 の定数 $1$ は変わる。
- **$k>\frac n2+r$**：Step 1 で $\Sigma_{s}<\infty$ に使った。$2(k-r)\le n$ なら $\Sigma_{k-r}=\infty$ で、$r=0$ では一点での値が $H^{k}$ で抑えられない（\ref{gl:prob-nt-delta-torus}）。
- **$k>l$**：Step 3 で重み $(1+R^{2})^{l-k}\to0$ に使った。
- **公理**：選択公理は使わない。Step 3 の \ref{top:bolzano-weierstrass} の部分列は、区間を二等分して無限個の項を含む側（両方なら左）を選び、その中の最小の添字をとる、という手順で具体的に決まる。
:::
:::

::: supplement
**二つの証明の比較.** 一般の閉多様体での証明（\ref{gl:sobolev-embedding-manifold}, \ref{gl:rellich-manifold}）は、1 の分割で $\mathbb{R}^{n}$ に移し、ガリアルド–ニーレンバーグ–ソボレフ・モレーの不等式（\ref{fa:gns-inequality}, \ref{fa:morrey-inequality}）や、軟化とアスコリ–アルツェラの定理によるコンパクト性（\ref{fa:rellich-kondrachov}）といった実解析の道具を使う。トーラスではそれが、「重み $(1+|m|^{2})^{-s}$ の和が $2s>n$ で収束する」という一つの計算と、可算個の係数についての対角線論法に置き換わる。指数 $\frac n2$ がどこから来るか（格子点の個数が半径の $n-1$ 乗で増えること）が一目でわかるのがトーラスの利点で、$p\neq2$ の $W^{k,p}$ を扱えず、計量や座標の取り方の自由がないのが欠点である。一般の閉多様体でも、ラプラシアンの固有関数展開（後の系列）を使えば、ここと同じ「係数の重み」による議論が $p=2$ で再現できる。

**前提を変えると.** 実数の階数 $H^{s}(T^{n})$（\ref{gl:torus-sobolev} の後の補足）でも同じ証明が通り、$s>\frac n2+r$ なら $C^{r}$ へ、$s>t$ なら $H^{s}\to H^{t}$ はコンパクトである。

**似た定理.** 2 の証明の後半は、対角作用素 $a_{m}\mapsto(1+|m|^{2})^{(l-k)/2}a_{m}$ が、対角成分が $0$ に収束するので有限階数作用素のノルム極限となり、コンパクトである（\ref{fa:compact-ideal.4}）ことと同じ内容である。3 は 1 次元のヴィルティンガーの不等式（\ref{four:prob-fj-wirtinger}）の $n$ 次元版である。

**高い視点：音階の上の会計.** トーラスの上の関数は、各音程 $m$ の音量 $\hat{u}(m)$ の一覧表（楽譜）と同じものである。$H^{k}$ ノルムは、高い音ほど高い税率 $(1+|m|^{2})^{k}$ を課した総額で、埋め込みは「税込みの総額が有限なら、税率の低い帳簿（各点の値）でも総額は有限」、レリッヒは「高い税率で予算内なら、低い税率の帳簿では高音部の金額が無視できるほど小さい」という会計の言い換えである。一般の多様体では、この楽譜を作るのに固有関数展開という大きな道具が要るので、まず局所化で同じ結論を出しておく。
:::

## 問題 {#gl:sec-pw-problems}

::: problem {#gl:prob-pw-equivalent-norm}
$(M,g)$ を連結な閉リーマン多様体とし、$u\in H^{1}(M)$ について $\|\nabla u\|_{L^{2}}$ は \ref{gl:poincare-manifold.2} の延長とする。
1. 正の定数 $c,C$ があって、すべての $u\in H^{1}(M)$ について
$$
c\|u\|_{H^{1}}^{2}\le\Bigl|\int_{M}u\,d\mu_{g}\Bigr|^{2}+\|\nabla u\|_{L^{2}}^{2}\le C\|u\|_{H^{1}}^{2}
$$
となることを示せ。
2. $u\in H^{1}(M)$ が $\|\nabla u\|_{L^{2}}=0$ を満たせば、$u$ は a.e. で定数であることを示せ。
:::

::: solution
$V\defeq\operatorname{vol}(M)$、\ref{gl:poincare-manifold.1} の定数を $C_{P}$ とする（\ref{gl:poincare-manifold.2} から $H^{1}(M)$ で成り立つ）。

**1.** 右の不等式：コーシー–シュワルツから $|\int u|^{2}\le V\|u\|_{L^{2}}^{2}$、また $\|\nabla u\|^{2}\le C_{0}\|u\|_{H^{1}}^{2}$（\ref{gl:poincare-manifold.2}）なので、$C=VC_{0}+C_{0}$ でよい（$\|u\|_{L^{2}}^{2}\le C_{0}\|u\|_{H^{1}}^{2}$ も同じ不等式から）。左の不等式：$u_{M}$ は定数関数なので $\|u_{M}\|_{L^{2}}=V^{1/2}|u_{M}|=V^{-1/2}|\int u|$。三角不等式と \ref{gl:poincare-manifold.1} から
$$
\|u\|_{L^{2}}\le\|u-u_{M}\|_{L^{2}}+\|u_{M}\|_{L^{2}}\le C_{P}\|\nabla u\|_{L^{2}}+V^{-1/2}\Bigl|\int u\Bigr|,
$$
二乗して $(a+b)^{2}\le2a^{2}+2b^{2}$ を使うと $\|u\|_{L^{2}}^{2}\le2C_{P}^{2}\|\nabla u\|^{2}+2V^{-1}|\int u|^{2}$。\ref{gl:poincare-manifold.2} の $c_{0}\|u\|_{H^{1}}^{2}\le\|u\|_{L^{2}}^{2}+\|\nabla u\|^{2}$ と合わせて
$$
\begin{aligned}c_{0}\|u\|_{H^{1}}^{2}&\le(2C_{P}^{2}+1)\|\nabla u\|_{L^{2}}^{2}+2V^{-1}\Bigl|\int u\Bigr|^{2}\\&\le\max(2C_{P}^{2}+1,2V^{-1})\Bigl(\Bigl|\int u\Bigr|^{2}+\|\nabla u\|_{L^{2}}^{2}\Bigr).\end{aligned}
$$

**2.** \ref{gl:poincare-manifold.1}（$H^{1}$ 版）から $\|u-u_{M}\|_{L^{2}}\le C_{P}\cdot0=0$ なので $u=u_{M}$ a.e.。
:::

::: problem {#gl:prob-pw-components}
$(M,g)$ を閉リーマン多様体とし、連結とは仮定しない。
1. $M$ の連結成分は有限個 $M_{1},\dots,M_{s}$ で、それぞれ連結な閉多様体であることを示せ。
2. $u\in L^{1}(M)$ について $Pu\defeq\sum_{a=1}^{s}u_{M_{a}}\mathbf{1}_{M_{a}}$（$u_{M_{a}}$ は $M_{a}$ の上の平均）とおく。定数 $C$ があって、すべての $u\in C^{\infty}(M)$ について $\|u-Pu\|_{L^{2}}\le C\|\nabla u\|_{L^{2}}$ となることを示せ。
3. $s\ge2$ なら、2 で $Pu$ を $u_{M}$ に置き換えた不等式はどんな $C$ でも成り立たないことを示せ。
:::

::: solution
**1.** 多様体は局所的に $\mathbb{R}^{n}$ の開球と同相なので局所連結で、連結成分は開集合である。連結成分は互いに交わらない開集合で $M$ を覆うので、$M$ のコンパクト性から有限個。各成分は補集合（他の成分の和）が開集合なので閉集合で、コンパクトな $M$ の閉集合としてコンパクト、$M$ の開集合なので境界のない多様体である。

**2.** $M_{a}$ に計量 $g\restr{M_{a}}$ を入れると、そのリーマン測度は $\mu_{g}$ の制限（\ref{gl:rm-basic-properties.1}）で、$|\nabla u|$ も $M_{a}$ の上で変わらない。$u\restr{M_{a}}\in C^{\infty}(M_{a})$ に \ref{gl:poincare-manifold.1} を使うと、定数 $C_{a}$ があって $\|u-u_{M_{a}}\|_{L^{2}(M_{a})}\le C_{a}\|\nabla u\|_{L^{2}(M_{a})}$。$M_{a}$ の上で $Pu=u_{M_{a}}$ なので、二乗して $a$ について足すと
$$
\begin{aligned}\|u-Pu\|_{L^{2}(M)}^{2}&=\sum_{a}\|u-u_{M_{a}}\|_{L^{2}(M_{a})}^{2}\le\max_{a}C_{a}^{2}\sum_{a}\|\nabla u\|_{L^{2}(M_{a})}^{2}\\&=\max_{a}C_{a}^{2}\,\|\nabla u\|_{L^{2}(M)}^{2}.\end{aligned}
$$

**3.** $u\defeq\operatorname{vol}(M_{2})\mathbf{1}_{M_{1}}-\operatorname{vol}(M_{1})\mathbf{1}_{M_{2}}$ は（成分が開かつ閉なので）滑らかで、$\nabla u=0$、$\int_{M}u\,d\mu_{g}=\operatorname{vol}(M_{2})\operatorname{vol}(M_{1})-\operatorname{vol}(M_{1})\operatorname{vol}(M_{2})=0$ なので $u_{M}=0$。一方 $\|u\|_{L^{2}}>0$（$\operatorname{vol}(M_{a})>0$、\ref{gl:riemannian-measure.2}）なので、$\|u-u_{M}\|\le C\cdot0$ は成り立たない。
:::
