# 演習：フーリエ変換 {#four:page-exercises-transform keywords="exercises, Fourier Transform"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な関数のフーリエ変換と積分・級数の値の計算、多次元のガウス関数とエルミート関数、実数直線上の熱方程式と標本化定理、超関数の微分とフーリエ変換の計算、ポアソン和公式の応用、不確定性原理の変種と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#four:sec-exft-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。とくに $\hat f(\xi)=\int f(x)e^{-2\pi ix\cdot\xi}\,dx$（\ref{four:fourier-transform}）、平行移動・変調・拡大縮小 $\tau_{h}$, $M_{\eta}$, $\delta_{a}$、ガウス関数 $G(x)=e^{-\pi|x|^{2}}$ は \ref{four:page-l1-transform}、逆変換 $\check g$、$L^{2}$ 上のフーリエ変換 $\mathcal{F}$ とその逆 $\mathcal{F}^{-}$、ガウス核 $W_{s}(x)=s^{-d}e^{-\pi|x|^{2}/s^{2}}$ は \ref{four:page-inversion-plancherel}、シュワルツ空間 $\mathcal{S}$ と半ノルム $p_{\alpha,\beta}$, $\|\cdot\|_{(N)}$、緩増加超関数の空間 $\mathcal{S}'$ は \ref{four:schwartz-space}, \ref{four:tempered-distribution} のとおり。
- $d=1$ では $\Lambda(x)\defeq\max(1-|x|,0)$（\ref{four:prob-ft-triangle}）、$\operatorname{sgn}$ は \ref{four:prob-sd-sign} のとおりとし、$\operatorname{sinc}(y)\defeq\frac{\sin(\pi y)}{\pi y}$（$y\ne0$）、$\operatorname{sinc}(0)\defeq1$ とおく。\ref{four:transform-examples.1} から $\int_{-1/2}^{1/2}e^{2\pi iy\xi}d\xi=\operatorname{sinc}(y)$（すべての $y$）。
- 複素数値関数の微分・積分と、パラメータを含む積分の定理（\ref{meas:parameter-integrals}）は、実部と虚部に分けて使う。
- 緩増加な関数 $f$ と超関数 $T_{f}$ を同一視する（\ref{four:distribution-injective}）。
- **選択公理**：使わない。
:::

## L¹ のフーリエ変換 {#four:sec-ft-exercises}

対応するページ：\ref{four:page-l1-transform}

::: problem ★ 基本：具体的な関数のフーリエ変換 {#four:ex-ft-1}
$d=1$ とする。
1. $f(x)\defeq xe^{-\pi x^{2}}$ について $\hat f(\xi)=-i\xi e^{-\pi\xi^{2}}$ を示せ。
2. $a>0$, $b\in\mathbb{R}$ とし、$g(x)\defeq e^{-2\pi a|x|}\cos(2\pi bx)$ とする。
$$
\hat g(\xi)=\frac{a}{2\pi}\Bigl(\frac{1}{a^{2}+(\xi-b)^{2}}+\frac{1}{a^{2}+(\xi+b)^{2}}\Bigr)
$$
を示せ。
3. 整数 $k\ge0$ について、$x>0$ で $f_{k}(x)\defeq x^{k}e^{-2\pi x}$、$x\le0$ で $f_{k}(x)\defeq0$ とする。
$$
\hat f_{k}(\xi)=\frac{k!}{\bigl(2\pi(1+i\xi)\bigr)^{k+1}}
$$
を示せ。また $f_{0}*f_{0}=f_{1}$ を確かめ、これが \ref{four:convolution-rd.2} と整合することを確かめよ。
:::

::: solution
**1.** $g_{0}(x)\defeq e^{-\pi x^{2}}$ とすると、$xg_{0}=f$ は可積分で、\ref{four:gaussian-transform} から $\hat g_{0}(\xi)=e^{-\pi\xi^{2}}$。\ref{four:differentiation-multiplication.1} から
$$
-2\pi i\,\hat f(\xi)=\widehat{(-2\pi ixg_{0})}(\xi)=(\hat g_{0})'(\xi)=-2\pi\xi e^{-\pi\xi^{2}}.
$$
$-2\pi i$ で割ると $\hat f(\xi)=\frac{\xi}{i}e^{-\pi\xi^{2}}=-i\xi e^{-\pi\xi^{2}}$。

**2.** $h(x)\defeq e^{-2\pi|x|}$ とすると $e^{-2\pi a|x|}=(\delta_{a}h)(x)$ なので、\ref{four:transform-basic.3} と \ref{four:transform-examples.2} から
$$
\widehat{\delta_{a}h}(\xi)=\frac{1}{a}\cdot\frac{1}{\pi(1+\xi^{2}/a^{2})}=\frac{a}{\pi(a^{2}+\xi^{2})}.
$$
$\cos(2\pi bx)=\frac12(e^{2\pi ixb}+e^{-2\pi ixb})$ なので $g=\frac12(M_{b}\delta_{a}h+M_{-b}\delta_{a}h)$。\ref{four:transform-basic.1} の線形性と \ref{four:transform-basic.2} から
$$
\hat g(\xi)=\frac12\Bigl(\widehat{\delta_{a}h}(\xi-b)+\widehat{\delta_{a}h}(\xi+b)\Bigr)=\frac{a}{2\pi}\Bigl(\frac{1}{a^{2}+(\xi-b)^{2}}+\frac{1}{a^{2}+(\xi+b)^{2}}\Bigr).
$$

**3.** **可積分性.** $m\ge0$ について $x^{m}e^{-\pi x}$ は $[0,\infty)$ 上有界（$e^{\pi x}\ge\frac{(\pi x)^{m}}{m!}$）なので、$x^{m}e^{-2\pi x}\le C_{m}e^{-\pi x}$ で、$(0,\infty)$ 上可積分。よって $f_{k}$ と $xf_{k}=f_{k+1}$ は可積分。

**$k=0$.** $c\defeq2\pi(1+i\xi)$ とおくと $\operatorname{Re}c=2\pi>0$ で、$R>0$ について
$$
\int_{0}^{R}e^{-2\pi x}e^{-2\pi ix\xi}dx=\int_{0}^{R}e^{-cx}dx=\frac{1-e^{-cR}}{c}.
$$
$|e^{-cR}|=e^{-2\pi R}\to0$ で、被積分関数の絶対値は可積分な $e^{-2\pi x}$ で抑えられるので、$R\to\infty$ として（\ref{meas:dominated-convergence}）$\hat f_{0}(\xi)=\frac{1}{c}$。

**帰納法.** \ref{four:differentiation-multiplication.1} から $(\hat f_{k})'=\widehat{(-2\pi ixf_{k})}=-2\pi i\hat f_{k+1}$、すなわち $\hat f_{k+1}=\frac{i}{2\pi}(\hat f_{k})'$。$\hat f_{k}(\xi)=k!(2\pi)^{-k-1}(1+i\xi)^{-k-1}$ を仮定すると、$\frac{d}{d\xi}(1+i\xi)^{-k-1}=-(k+1)i(1+i\xi)^{-k-2}$ と $i\cdot(-i)=1$ から
$$
\hat f_{k+1}(\xi)=\frac{i}{2\pi}\cdot k!(2\pi)^{-k-1}\cdot\bigl(-(k+1)i\bigr)(1+i\xi)^{-k-2}=\frac{(k+1)!}{\bigl(2\pi(1+i\xi)\bigr)^{k+2}}.
$$

**畳み込み.** $f_{0}(x-y)f_{0}(y)\ne0$ となるのは $y>0$ かつ $x-y>0$ のときだけである。よって $x\le0$ なら $(f_{0}*f_{0})(x)=0$、$x>0$ なら
$$
(f_{0}*f_{0})(x)=\int_{0}^{x}e^{-2\pi(x-y)}e^{-2\pi y}dy=xe^{-2\pi x}=f_{1}(x).
$$
\ref{four:convolution-rd.2} から $\hat f_{1}=\hat f_{0}^{2}=\frac{1}{(2\pi(1+i\xi))^{2}}$ となり、帰納法で得た $k=1$ の式と一致する。

（3 の $|\hat f_{k}(\xi)|=\frac{k!}{(2\pi)^{k+1}}(1+\xi^{2})^{-(k+1)/2}$ は $|\xi|^{-k-1}$ 程度で減衰する。$f_{k}$ は $x=0$ で $k$ 階導関数が跳ぶので $C^{k}$ 級でなく、\ref{four:smoothness-decay.1} と比べると、減衰の速さが滑らかさを反映していることがわかる。）
:::

::: problem ★★ 標準：正定値二次形式のガウス関数 {#four:ex-ft-2}
$A$ を $d$ 次の実対称行列で正定値（$x\ne0$ なら $x\cdot Ax>0$）とし、$f(x)\defeq e^{-\pi x\cdot Ax}$ とする。
1. $f\in L^{1}(\mathbb{R}^{d})$ で、$\hat f(\xi)=(\det A)^{-1/2}e^{-\pi\xi\cdot A^{-1}\xi}$ を示せ。
2. $1\le j,k\le d$ について $x_{j}x_{k}f$ は可積分で
$$
\int_{\mathbb{R}^{d}}x_{j}x_{k}e^{-\pi x\cdot Ax}\,dx=\frac{(A^{-1})_{jk}}{2\pi\sqrt{\det A}}
$$
となることを示せ。
3. $d=2$, $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$ のとき、$\hat f$ と $\int x_{1}x_{2}f$ を求めよ。
:::

::: solution
**1.** **Step 1（対角化）.** \ref{lin:spectral-theorem.3} から $A=QD{}^{t}Q$（$Q$ は直交行列、$D=\operatorname{diag}(\lambda_{1},\dots,\lambda_{d})$ は実対角行列）。$e_{j}$ を第 $j$ 単位ベクトルとすると、${}^{t}QQ=I$ から $\lambda_{j}=e_{j}\cdot De_{j}=(Qe_{j})\cdot A(Qe_{j})>0$。とくに $\det A=\prod_{j}\lambda_{j}>0$ で、$A^{-1}=QD^{-1}{}^{t}Q$。

**Step 2（変数変換）.** $\Phi(y)\defeq Qy$ は $\mathbb{R}^{d}$ から $\mathbb{R}^{d}$ への $C^{1}$ 微分同相写像で、ヤコビアンは $|\det Q|=1$。$x=Qy$ なら
$$
x\cdot Ax=y\cdot{}^{t}QAQy=y\cdot Dy=\sum_{j}\lambda_{j}y_{j}^{2},\qquad x\cdot\xi=y\cdot{}^{t}Q\xi.
$$
\ref{meas:change-of-variables.2} とトネリ（\ref{meas:fubini-lebesgue}）、\ref{four:gaussian-transform}（$d=1$, $\xi=0$, $a=\lambda_{j}$）から
$$
\int|f|=\int_{\mathbb{R}^{d}}\prod_{j}e^{-\pi\lambda_{j}y_{j}^{2}}dy=\prod_{j}\lambda_{j}^{-1/2}<\infty.
$$

**Step 3（変換）.** $\eta\defeq{}^{t}Q\xi$ とおく。\ref{meas:change-of-variables.3} を可積分関数 $x\mapsto f(x)e^{-2\pi ix\cdot\xi}$ に使い、フビニ（\ref{meas:fubini-lebesgue}）と \ref{four:gaussian-transform}（$d=1$, $a=\lambda_{j}$）を使うと
$$
\hat f(\xi)=\int_{\mathbb{R}^{d}}\prod_{j}e^{-\pi\lambda_{j}y_{j}^{2}}e^{-2\pi iy_{j}\eta_{j}}dy=\prod_{j}\lambda_{j}^{-1/2}e^{-\pi\eta_{j}^{2}/\lambda_{j}}=(\det A)^{-1/2}e^{-\pi\eta\cdot D^{-1}\eta}.
$$
$\eta\cdot D^{-1}\eta={}^{t}Q\xi\cdot D^{-1}{}^{t}Q\xi=\xi\cdot QD^{-1}{}^{t}Q\xi=\xi\cdot A^{-1}\xi$ なので主張を得る。

**2.** **可積分性.** $|x_{j}x_{k}|\le|x|^{2}$ で、$x=Qy$ なら $|x|=|y|$。Step 2 と同じく
$$
\int|x_{j}x_{k}f|\le\int_{\mathbb{R}^{d}}|y|^{2}\prod_{m}e^{-\pi\lambda_{m}y_{m}^{2}}dy=\sum_{l}\Bigl(\int_{\mathbb{R}}t^{2}e^{-\pi\lambda_{l}t^{2}}dt\Bigr)\prod_{m\ne l}\lambda_{m}^{-1/2}<\infty
$$
（$t^{2}e^{-\pi\lambda t^{2}/2}$ は有界なので $t^{2}e^{-\pi\lambda t^{2}}$ は可積分）。同様に $x_{k}f$ も可積分（$|x_{k}|\le1+|x|^{2}$）。

**2 階微分.** \ref{four:differentiation-multiplication.1} を $f$ と $x_{k}f$ に続けて使うと、$\hat f$ は $\partial_{j}\partial_{k}\hat f=\widehat{(-2\pi i)^{2}x_{j}x_{k}f}$ をもち、$\xi=0$ で
$$
\partial_{j}\partial_{k}\hat f(0)=-4\pi^{2}\int x_{j}x_{k}f.
$$
一方 $C\defeq A^{-1}$（対称）、$c\defeq(\det A)^{-1/2}$ とおくと、1 から $\hat f(\xi)=ce^{-\pi\xi\cdot C\xi}$ で、$\partial_{k}(\xi\cdot C\xi)=2(C\xi)_{k}$ なので
$$
\partial_{k}\hat f=-2\pi(C\xi)_{k}\hat f,\qquad\partial_{j}\partial_{k}\hat f=-2\pi C_{jk}\hat f-2\pi(C\xi)_{k}\partial_{j}\hat f.
$$
$\xi=0$ では $\partial_{j}\partial_{k}\hat f(0)=-2\pi C_{jk}c$。比べて $\int x_{j}x_{k}f=\frac{2\pi C_{jk}c}{4\pi^{2}}=\frac{C_{jk}}{2\pi\sqrt{\det A}}$。

**3.** $\det A=3$, $A^{-1}=\frac13\begin{pmatrix}2&-1\\-1&2\end{pmatrix}$ なので
$$
\hat f(\xi)=\frac{1}{\sqrt3}\exp\Bigl(-\frac{2\pi}{3}(\xi_{1}^{2}-\xi_{1}\xi_{2}+\xi_{2}^{2})\Bigr),\qquad\int_{\mathbb{R}^{2}}x_{1}x_{2}f=\frac{-1/3}{2\pi\sqrt3}=-\frac{1}{6\sqrt3\,\pi}.
$$

（$A=aI$ なら 1 は \ref{four:gaussian-transform} に戻る。$f/\int f$ を確率密度とみると、2 は共分散行列が $\frac{1}{2\pi}A^{-1}$ であることを言っている。変換で二次形式が $A$ から $A^{-1}$ に替わるのは、細い山の変換が太い山になることの多次元版である。）
:::

::: problem ★★★ 発展：エルミート関数はフーリエ変換の固有関数 {#four:ex-ft-3}
$d=1$ とする。$P$ を複素係数の多項式として $P(x)e^{-\pi x^{2}}$ の形に書ける関数全体を $V$ とする。$f\in V$ について $(Af)(x)\defeq xf(x)-\frac{1}{2\pi}f'(x)$ とおき、$h_{0}(x)\defeq e^{-\pi x^{2}}$, $h_{n+1}\defeq Ah_{n}$ とする。
1. $h_{n}=P_{n}(x)e^{-\pi x^{2}}$ で、$P_{n}$ は最高次の係数が $2^{n}$ の $n$ 次多項式であり、$P_{n}(-x)=(-1)^{n}P_{n}(x)$ となることを示せ。$P_{1},P_{2},P_{3}$ を求めよ。
2. $f\in V$ なら $\hat f$ は微分可能で
$$
\widehat{Af}(\xi)=-i\Bigl(\xi\hat f(\xi)-\frac{1}{2\pi}(\hat f)'(\xi)\Bigr)
$$
となることを示し、$\hat h_{n}=(-i)^{n}h_{n}$ を導け。
3. $n-m$ が $4$ で割り切れなければ $\int_{\mathbb{R}}h_{n}h_{m}=0$ を示せ。また、$f\in V$ なら $\hat f\in V$ で、すべての $x$ で $\widehat{\hat f}(x)=f(-x)$ となることを示せ。さらに $x^{2}e^{-\pi x^{2}}$ のフーリエ変換を求めよ。
:::

::: solution
**1.** $P$ を多項式とすると $(Pe^{-\pi x^{2}})'=(P'-2\pi xP)e^{-\pi x^{2}}$ なので
$$
A\bigl(Pe^{-\pi x^{2}}\bigr)=\Bigl(xP-\frac{P'-2\pi xP}{2\pi}\Bigr)e^{-\pi x^{2}}=\Bigl(2xP-\frac{1}{2\pi}P'\Bigr)e^{-\pi x^{2}}.
$$
よって $A$ は $V$ を $V$ に移し、$P_{0}=1$, $P_{n+1}=2xP_{n}-\frac{1}{2\pi}P_{n}'$。$P_{n}$ が最高次の係数 $2^{n}$ の $n$ 次式なら、$2xP_{n}$ は最高次の係数 $2^{n+1}$ の $n+1$ 次式で、$P_{n}'$ の次数は $n$ 未満なので、$P_{n+1}$ も主張の形。偶奇：$P_{n}(-x)=(-1)^{n}P_{n}(x)$ を微分すると $-P_{n}'(-x)=(-1)^{n}P_{n}'(x)$、すなわち $P_{n}'(-x)=(-1)^{n+1}P_{n}'(x)$。$(-x)P_{n}(-x)=(-1)^{n+1}xP_{n}(x)$ と合わせて $P_{n+1}(-x)=(-1)^{n+1}P_{n+1}(x)$。具体的には
$$
P_{1}=2x,\qquad P_{2}=4x^{2}-\frac{1}{\pi},\qquad P_{3}=2x\Bigl(4x^{2}-\frac1\pi\Bigr)-\frac{8x}{2\pi}=8x^{3}-\frac{6x}{\pi}.
$$

**2.** **$V$ の元の性質.** $m\ge0$ について $|x|^{m}e^{-\pi x^{2}/2}$ は有界なので $|x|^{m}e^{-\pi x^{2}}\le C_{m}e^{-\pi x^{2}/2}$ で、$V$ の元はすべて可積分。$f\in V$ は $C^{\infty}$ 級で、1 の計算から $xf$, $f'\in V$。

**変換の公式.** $f\in V$ とする。$xf\in L^{1}$ なので \ref{four:differentiation-multiplication.1} から $\hat f$ は微分可能で $(\hat f)'=-2\pi i\,\widehat{xf}$、すなわち $\widehat{xf}=\frac{i}{2\pi}(\hat f)'$。$f$ は $C^{1}$ 級で $f'\in L^{1}$ なので \ref{four:differentiation-multiplication.2} から $\widehat{f'}=2\pi i\xi\hat f$。\ref{four:transform-basic.1} の線形性から
$$
\widehat{Af}=\frac{i}{2\pi}(\hat f)'-\frac{1}{2\pi}\cdot2\pi i\xi\hat f=-i\Bigl(\xi\hat f-\frac{1}{2\pi}(\hat f)'\Bigr).
$$

**固有関数.** $n$ についての帰納法。$\hat h_{0}=h_{0}$ は \ref{four:gaussian-transform}。$\hat h_{n}=(-i)^{n}h_{n}$ なら
$$
\hat h_{n+1}(\xi)=\widehat{Ah_{n}}(\xi)=-i\Bigl(\xi(-i)^{n}h_{n}(\xi)-\frac{1}{2\pi}(-i)^{n}h_{n}'(\xi)\Bigr)=(-i)^{n+1}(Ah_{n})(\xi)=(-i)^{n+1}h_{n+1}(\xi).
$$

**3.** **直交性.** $h_{n}$, $h_{m}$ は実数値で可積分。\ref{four:multiplication-formula} から $\int\hat h_{n}h_{m}=\int h_{n}\hat h_{m}$、2 から
$$
\bigl((-i)^{n}-(-i)^{m}\bigr)\int h_{n}h_{m}=0.
$$
$(-i)^{n}=(-i)^{m}\iff(-i)^{n-m}=1\iff4\mid n-m$ なので、$4\nmid n-m$ なら $\int h_{n}h_{m}=0$。

**反転.** $f=Pe^{-\pi x^{2}}\in V$、$N\defeq\deg P$ とする（$P=0$ なら明らか）。1 から、$N$ 次以下の多項式は $P_{0},\dots,P_{N}$ の一次結合である：$Q$ の最高次の項が $cx^{M}$ なら $Q-c2^{-M}P_{M}$ の次数は $M$ 未満なので、次数についての帰納法で示せる。よって $f=\sum_{n=0}^{N}c_{n}h_{n}$ と書け、線形性と 2 から
$$
\hat f=\sum_{n=0}^{N}c_{n}(-i)^{n}h_{n}\in V,\qquad\widehat{\hat f}=\sum_{n=0}^{N}c_{n}(-i)^{2n}h_{n}=\sum_{n=0}^{N}c_{n}(-1)^{n}h_{n}.
$$
1 の偶奇から $(-1)^{n}h_{n}(x)=h_{n}(-x)$ なので $\widehat{\hat f}(x)=\sum_{n}c_{n}h_{n}(-x)=f(-x)$。

**例.** 1 から $x^{2}e^{-\pi x^{2}}=\frac14\bigl(P_{2}+\frac1\pi\bigr)e^{-\pi x^{2}}=\frac14\bigl(h_{2}+\frac1\pi h_{0}\bigr)$。2 から $\hat h_{2}=-h_{2}$, $\hat h_{0}=h_{0}$ なので
$$
\widehat{x^{2}e^{-\pi x^{2}}}(\xi)=\frac14\Bigl(-\Bigl(4\xi^{2}-\frac1\pi\Bigr)+\frac1\pi\Bigr)e^{-\pi\xi^{2}}=\Bigl(\frac{1}{2\pi}-\xi^{2}\Bigr)e^{-\pi\xi^{2}}.
$$
（\ref{four:differentiation-multiplication.1} を 2 回使って $-\frac{1}{4\pi^{2}}\frac{d^{2}}{d\xi^{2}}e^{-\pi\xi^{2}}$ を計算しても同じ結果になる。）

（$h_{n}$ を**エルミート関数**という。$V$ の元を $n$ を $4$ で割った余りごとにまとめると、$f=\sum_{r=0}^{3}g_{r}$, $\hat g_{r}=(-i)^{r}g_{r}$ と固有関数に分解される。3 の後半は、反転公式の $V$ の上での直接の確認である。実際には $n\ne m$ ならつねに $\int h_{n}h_{m}=0$ となる（$A$ の随伴 $x+\frac{1}{2\pi}\frac{d}{dx}$ を使う）が、ここでは示さない。）
:::

## 反転公式とプランシュレルの定理 {#four:sec-ip-exercises}

対応するページ：\ref{four:page-inversion-plancherel}

::: problem ★ 基本：反転とノルムの保存による積分の計算 {#four:ex-ip-1}
$d=1$ とする。
1. すべての $x$ で $\int_{-\infty}^{\infty}\operatorname{sinc}(\xi)^{2}e^{2\pi ix\xi}d\xi=\Lambda(x)$ を示し、$\int_{-\infty}^{\infty}\bigl(\frac{\sin x}{x}\bigr)^{4}dx=\frac{2\pi}{3}$ を導け。
2. 整数 $k\ge0$ について、\ref{four:ex-ft-1} の $f_{k}$ を使って
$$
\int_{-\infty}^{\infty}\frac{d\xi}{(1+\xi^{2})^{k+1}}=\frac{\pi}{4^{k}}\binom{2k}{k}
$$
を示せ。
3. すべての $x$ で
$$
\int_{-\infty}^{\infty}\frac{e^{2\pi ix\xi}}{(1+\xi^{2})^{2}}d\xi=\frac{\pi}{2}\bigl(1+2\pi|x|\bigr)e^{-2\pi|x|}
$$
を示せ。
:::

::: solution
**1.** $\Lambda$ は連続で可積分、\ref{four:prob-ft-triangle} から $\hat\Lambda=\operatorname{sinc}^{2}$ で、$0\le\operatorname{sinc}(\xi)^{2}\le\min\bigl(1,\frac{1}{\pi^{2}\xi^{2}}\bigr)$ なので $\hat\Lambda$ も可積分。\ref{four:inversion-theorem.1} から、すべての $x$ で $\Lambda(x)=\int\hat\Lambda(\xi)e^{2\pi ix\xi}d\xi$。これが第 1 式。

$\Lambda\in L^{1}\cap L^{2}$ なので、\ref{four:plancherel-identity} から
$$
\int_{-\infty}^{\infty}\operatorname{sinc}(\xi)^{4}d\xi=\|\hat\Lambda\|_{2}^{2}=\|\Lambda\|_{2}^{2}=2\int_{0}^{1}(1-x)^{2}dx=\frac23.
$$
$x=\pi\xi$ と置き換えると $\int\bigl(\frac{\sin x}{x}\bigr)^{4}dx=\pi\int\operatorname{sinc}(\xi)^{4}d\xi=\frac{2\pi}{3}$。

**2.** **補題.** $c>0$、整数 $m\ge0$ について $\int_{0}^{\infty}x^{m}e^{-cx}dx=\frac{m!}{c^{m+1}}$。$m=0$ は直接。$[0,R]$ 上の部分積分
$$
\int_{0}^{R}x^{m+1}e^{-cx}dx=-\frac{R^{m+1}e^{-cR}}{c}+\frac{m+1}{c}\int_{0}^{R}x^{m}e^{-cx}dx
$$
で $R\to\infty$ とし（\ref{meas:improper-lebesgue.1}）、$m$ についての帰納法。

**計算.** $f_{k}$ は有界で可積分なので $f_{k}\in L^{1}\cap L^{2}$。補題（$m=2k$, $c=4\pi$）から $\|f_{k}\|_{2}^{2}=\int_{0}^{\infty}x^{2k}e^{-4\pi x}dx=\frac{(2k)!}{(4\pi)^{2k+1}}$。\ref{four:ex-ft-1.3} と $|1+i\xi|^{2}=1+\xi^{2}$ から $|\hat f_{k}(\xi)|^{2}=\frac{(k!)^{2}}{(2\pi)^{2k+2}(1+\xi^{2})^{k+1}}$。\ref{four:plancherel-identity} から
$$
\int_{-\infty}^{\infty}\frac{d\xi}{(1+\xi^{2})^{k+1}}=\frac{(2\pi)^{2k+2}}{(k!)^{2}}\cdot\frac{(2k)!}{(4\pi)^{2k+1}}=\frac{(2k)!}{(k!)^{2}}\cdot\frac{2^{2k+2}\pi^{2k+2}}{2^{4k+2}\pi^{2k+1}}=\frac{\pi}{4^{k}}\binom{2k}{k}.
$$
（$k=1$ は \ref{four:prob-ip-cauchy} の第 2 式。）

**3.** $h(x)\defeq e^{-2\pi|x|}$ とする。まず $x\ge0$ で $h*h$ を計算する。$y<0$, $0\le y\le x$, $y>x$ に分けると
$$
(h*h)(x)=\int_{-\infty}^{0}e^{-2\pi(x-y)}e^{2\pi y}dy+\int_{0}^{x}e^{-2\pi(x-y)}e^{-2\pi y}dy+\int_{x}^{\infty}e^{-2\pi(y-x)}e^{-2\pi y}dy=\frac{e^{-2\pi x}}{4\pi}+xe^{-2\pi x}+\frac{e^{-2\pi x}}{4\pi}.
$$
$h$ は偶関数なので、$y\mapsto-y$ と置き換えると $(h*h)(-x)=(h*h)(x)$。よってすべての $x$ で $(h*h)(x)=\bigl(|x|+\frac{1}{2\pi}\bigr)e^{-2\pi|x|}$ で、これは連続。$h*h\in L^{1}$（\ref{four:convolution-rd.1}）で、\ref{four:convolution-rd.2} と \ref{four:transform-examples.2} から $\widehat{h*h}(\xi)=\frac{1}{\pi^{2}(1+\xi^{2})^{2}}$ は可積分。\ref{four:inversion-theorem.1} から、すべての $x$ で
$$
\Bigl(|x|+\frac{1}{2\pi}\Bigr)e^{-2\pi|x|}=\int_{-\infty}^{\infty}\frac{e^{2\pi ix\xi}}{\pi^{2}(1+\xi^{2})^{2}}d\xi.
$$
$\pi^{2}$ を掛けると $\pi^{2}|x|+\frac{\pi}{2}=\frac\pi2(1+2\pi|x|)$ なので主張を得る。（$x=0$ で 2 の $k=1$ の場合と一致する。）
:::

::: problem ★★ 標準：実数直線上の熱方程式 {#four:ex-ip-2}
$d=1$, $f\in L^{1}(\mathbb{R})$ とし、$t>0$, $x\in\mathbb{R}$ について
$$
u(t,x)\defeq\int_{\mathbb{R}}f(y)\frac{1}{\sqrt{4\pi t}}e^{-(x-y)^{2}/(4t)}dy
$$
とおく。
1. 右辺はすべての $(t,x)$ で絶対収束し、
$$
u(t,x)=\int_{\mathbb{R}}\hat f(\xi)e^{-4\pi^{2}t\xi^{2}}e^{2\pi ix\xi}d\xi,\qquad\widehat{u(t,\cdot)}(\xi)=e^{-4\pi^{2}t\xi^{2}}\hat f(\xi),\qquad\int_{\mathbb{R}}u(t,x)\,dx=\int_{\mathbb{R}}f
$$
となることを示せ。
2. $u$ は $x$ について何回でも、$t$ について 1 回偏微分可能で、これらの偏導関数は $(0,\infty)\times\mathbb{R}$ 上連続であり、$\partial_{t}u=\partial_{x}^{2}u$ を満たすことを示せ。
3. $t\to0$ で $\|u(t,\cdot)-f\|_{1}\to0$ となること、$\sup_{x}|u(t,x)|\le\frac{\|f\|_{1}}{\sqrt{4\pi t}}$ を示せ。また $u(t,\cdot)\in L^{2}$ で、$t\mapsto\|u(t,\cdot)\|_{2}$ は単調非増加、$t\to\infty$ で $0$ に収束することを示せ。$f\in L^{1}\cap L^{2}$ なら $\|u(t,\cdot)\|_{2}\le\|f\|_{2}$ であることも示せ。
:::

::: solution
**1.** $s\defeq\sqrt{4\pi t}$ とおくと $W_{s}(z)=s^{-1}e^{-\pi z^{2}/s^{2}}=\frac{1}{\sqrt{4\pi t}}e^{-z^{2}/(4t)}$ なので、$u(t,x)=\int f(y)W_{s}(x-y)\,dy=(f*W_{s})(x)$。$0<W_{s}\le s^{-1}$ なので、被積分関数の絶対値は $s^{-1}|f(y)|$ 以下で、すべての $(t,x)$ で絶対収束する。\ref{four:gauss-summation}（$t$ を $s$ として。$\pi s^{2}=4\pi^{2}t$）から第 1 式。$W_{s}=s^{-1}\delta_{1/s}G$ なので \ref{four:transform-basic.3} と \ref{four:gaussian-transform} から $\widehat{W_{s}}(\xi)=s^{-1}\cdot s\,G(s\xi)=e^{-4\pi^{2}t\xi^{2}}$。$u(t,\cdot)=f*W_{s}\in L^{1}$ で、\ref{four:convolution-rd.2} から第 2 式。第 2 式で $\xi=0$ とすれば第 3 式。

**2.** $t_{0}>0$ を固定し、$t>t_{0}$ で考える。$k(\xi;t,x)\defeq\hat f(\xi)e^{-4\pi^{2}t\xi^{2}}e^{2\pi ix\xi}$ とおくと、$m\ge0$ について
$$
\partial_{x}^{m}k=(2\pi i\xi)^{m}k,\qquad\partial_{t}k=-4\pi^{2}\xi^{2}k,\qquad\bigl|(2\pi i\xi)^{m}k\bigr|\le g_{m}(\xi)\defeq\|f\|_{1}(2\pi|\xi|)^{m}e^{-4\pi^{2}t_{0}\xi^{2}}
$$
（$|\hat f|\le\|f\|_{1}$ は \ref{four:transform-basic.1}）。$g_{m}$ は可積分である。\ref{meas:parameter-integrals.2} を $x$ について繰り返し、また $t$ について（区間 $(t_{0},\infty)$ 上で）使うと、1 の第 1 式から
$$
\partial_{x}^{m}u(t,x)=\int(2\pi i\xi)^{m}k(\xi;t,x)\,d\xi,\qquad\partial_{t}u(t,x)=\int(-4\pi^{2}\xi^{2})k(\xi;t,x)\,d\xi.
$$
$(t_{n},x_{n})\to(t,x)$（$t_{n}>t_{0}$）なら被積分関数は各 $\xi$ で収束し、$g_{m}$ または $g_{2}$ で抑えられるので、\ref{meas:dominated-convergence} からこれらは $(t,x)$ について連続。$(2\pi i\xi)^{2}=-4\pi^{2}\xi^{2}$ なので $\partial_{x}^{2}u=\partial_{t}u$。$t_{0}>0$ は任意。

**3.** **$t\to0$.** $\int G=1$ で $W_{s}=G_{s}$ なので、\ref{four:approximate-identity-rd.1}（$K=G$, $p=1$）から、$t\to0$（すなわち $s\to0$）で $\|f*W_{s}-f\|_{1}\to0$。

**一様な評価.** $|u(t,x)|\le\int|f(y)|W_{s}(x-y)\,dy\le s^{-1}\|f\|_{1}$。

**$L^{2}$ ノルム.** $u(t,\cdot)$ は可積分で有界なので $|u|^{2}\le s^{-1}\|f\|_{1}|u|$ から $u(t,\cdot)\in L^{1}\cap L^{2}$。\ref{four:plancherel-identity} と 1 から
$$
\|u(t,\cdot)\|_{2}^{2}=\int_{\mathbb{R}}|\hat f(\xi)|^{2}e^{-8\pi^{2}t\xi^{2}}d\xi.
$$
被積分関数は各 $\xi$ で $t$ について単調非増加なので、$\|u(t,\cdot)\|_{2}$ も単調非増加。$t\ge1$ では被積分関数は可積分な $\|f\|_{1}^{2}e^{-8\pi^{2}\xi^{2}}$ で抑えられ、$\xi\ne0$ で $t\to\infty$ のとき $0$ に収束するので、\ref{meas:dominated-convergence}（$t$ の列に使う）から $\|u(t,\cdot)\|_{2}\to0$。$f\in L^{1}\cap L^{2}$ なら、$e^{-8\pi^{2}t\xi^{2}}\le1$ と \ref{four:plancherel-identity} から $\|u(t,\cdot)\|_{2}^{2}\le\int|\hat f|^{2}=\|f\|_{2}^{2}$。

（フーリエ変換で、熱方程式は各振動数 $\xi$ ごとの常微分方程式 $\partial_{t}\hat u=-4\pi^{2}\xi^{2}\hat u$ になり、高い振動数ほど速く減衰する。円周の場合（\ref{four:heat-equation}）の級数 $\sum_{n}$ が、ここでは積分 $\int d\xi$ に替わっている。熱の総量 $\int u$ は保存されるが、$\mathbb{R}$ 上では熱は無限遠に散らばり、最大値も $L^{2}$ ノルムも $0$ に近づく。）
:::

::: problem ★★★ 発展：標本化定理 {#four:ex-ip-3}
$d=1$ とする。$g$ を $[-\frac12,\frac12]$ の外で $0$ となる可測関数で $\int|g|^{2}<\infty$ となるものとし、
$$
f(x)\defeq\int_{-1/2}^{1/2}g(\xi)e^{2\pi ix\xi}d\xi\qquad(x\in\mathbb{R})
$$
とおく。
1. $g\in L^{1}\cap L^{2}$ で、$f$ は連続、$f\in L^{2}$、$\mathcal{F}f=g$（a.e.）、$\|f\|_{2}=\|g\|_{2}$ を示せ。
2. $\sum_{n\in\mathbb{Z}}|f(n)|^{2}=\|f\|_{2}^{2}$ を示せ。とくに、すべての $n\in\mathbb{Z}$ で $f(n)=0$ なら $f\equiv0$ である。
3. $N\to\infty$ のとき
$$
\sup_{x\in\mathbb{R}}\Bigl|f(x)-\sum_{|n|\le N}f(n)\operatorname{sinc}(x-n)\Bigr|\to0,\qquad\Bigl\|f-\sum_{|n|\le N}f(n)\operatorname{sinc}(\cdot-n)\Bigr\|_{2}\to0
$$
を示せ。
:::

::: solution
**1.** コーシー–シュワルツの不等式から $\int|g|=\int_{-1/2}^{1/2}|g|\le\bigl(\int_{-1/2}^{1/2}|g|^{2}\bigr)^{1/2}<\infty$ なので $g\in L^{1}\cap L^{2}$。$f=\check g$ で、$\check g(x)=\hat g(-x)$ は \ref{four:transform-basic.1} から連続。\ref{four:plancherel.1} の $\mathcal{F}^{-}$ は $L^{1}\cap L^{2}$ 上で $g\mapsto\check g$ なので $f=\mathcal{F}^{-}g\in L^{2}$。\ref{four:plancherel.2} から $\mathcal{F}f=\mathcal{F}\mathcal{F}^{-}g=g$ で、$\mathcal{F}^{-}$ は等長なので $\|f\|_{2}=\|g\|_{2}$。

**2.** $[-\frac12,\frac12)$ 上で $g$ に等しい周期 $1$ の関数を $\tilde g\in L^{2}(\mathbb{T})$ とする。そのフーリエ係数は
$$
\hat{\tilde g}(n)=\int_{-1/2}^{1/2}g(\xi)e^{-2\pi in\xi}d\xi=f(-n).
$$
\ref{four:l2-theory.2} と 1 から $\sum_{n}|f(-n)|^{2}=\|\tilde g\|_{L^{2}(\mathbb{T})}^{2}=\int_{-1/2}^{1/2}|g|^{2}=\|g\|_{2}^{2}=\|f\|_{2}^{2}$。すべての $n$ で $f(n)=0$ なら $\|f\|_{2}=0$ で $f=0$（a.e.）。$f$ は連続なので、$\{f\ne0\}$ は測度 $0$ の開集合で空、すなわち $f\equiv0$。

**3.** $S_{N}\tilde g(\xi)=\sum_{|n|\le N}\hat{\tilde g}(n)e^{2\pi in\xi}=\sum_{|n|\le N}f(-n)e^{2\pi in\xi}$。記法の確認の $\int_{-1/2}^{1/2}e^{2\pi iy\xi}d\xi=\operatorname{sinc}(y)$ から
$$
\int_{-1/2}^{1/2}S_{N}\tilde g(\xi)e^{2\pi ix\xi}d\xi=\sum_{|n|\le N}f(-n)\operatorname{sinc}(x+n)=\sum_{|m|\le N}f(m)\operatorname{sinc}(x-m).
$$
$r_{N}\defeq(g-S_{N}\tilde g)\mathbf{1}_{[-1/2,1/2]}$ とおくと $r_{N}\in L^{1}\cap L^{2}$ で、
$$
f(x)-\sum_{|m|\le N}f(m)\operatorname{sinc}(x-m)=\int_{-1/2}^{1/2}r_{N}(\xi)e^{2\pi ix\xi}d\xi=\check r_{N}(x).
$$
**一様収束.** コーシー–シュワルツの不等式から、すべての $x$ で $|\check r_{N}(x)|\le\bigl(\int_{-1/2}^{1/2}|r_{N}|^{2}\bigr)^{1/2}=\|\tilde g-S_{N}\tilde g\|_{L^{2}(\mathbb{T})}$ で、右辺は \ref{four:l2-theory.2} から $0$ に収束する。

**$L^{2}$ 収束.** $\check r_{N}=\overline{\widehat{\bar r_{N}}}$ なので、\ref{four:plancherel-identity} から $\|\check r_{N}\|_{2}=\|\bar r_{N}\|_{2}=\|r_{N}\|_{2}\to0$。

（$F\in L^{2}$ で $\mathcal{F}F$ が $[-\frac12,\frac12]$ の外で $0$（a.e.）なら、$g\defeq\mathcal{F}F$ について $F=\mathcal{F}^{-}g=f$（a.e.）なので、この問題はそのような「帯域制限された」関数すべてに当てはまる。振動数が $\frac12$ 以下に限られた信号は、間隔 $1$ の標本 $f(n)$ だけから完全に復元できる、というのがシャノンの標本化定理の内容である。$g=\mathbf{1}_{[-1/2,1/2]}$ とすると $f=\operatorname{sinc}$, $f(n)=\delta_{n0}$ で、3 の和はその一項だけになる。同じ計算で、$\operatorname{sinc}(\cdot-n)$（$n\in\mathbb{Z}$）は $L^{2}(\mathbb{R})$ の正規直交系であることもわかる。）
:::

## シュワルツ空間と緩増加超関数 {#four:sec-sd-exercises}

対応するページ：\ref{four:page-schwartz-distributions}

::: problem ★ 基本：超関数の微分の計算 {#four:ex-sd-1}
$d=1$ とする。
1. $|x|'=\operatorname{sgn}$ と $|x|''=2\delta$ を示せ。
2. $a>0$ について $E_{a}(x)\defeq\frac{1}{2a}e^{-a|x|}$ とおく。$-E_{a}''+a^{2}E_{a}=\delta$ を直接の計算で示し、両辺のフーリエ変換が一致することも確かめよ。
3. $x\delta=0$, $x\delta'=-\delta$ を示し、後者の両辺のフーリエ変換が一致することを確かめよ。
:::

::: solution
**1.** $|x|$ と $\operatorname{sgn}$ は緩増加な関数である（\ref{four:tempered-examples.1}）。$\varphi\in\mathcal{S}$, $R>0$ について、部分積分から
$$
\int_{0}^{R}x\varphi'(x)\,dx=R\varphi(R)-\int_{0}^{R}\varphi,\qquad\int_{-R}^{0}(-x)\varphi'(x)\,dx=-R\varphi(-R)+\int_{-R}^{0}\varphi.
$$
$R\varphi(\pm R)\to0$ で、$|x\varphi'|$, $|\varphi|$ は可積分なので、$R\to\infty$ として（\ref{meas:dominated-convergence}）
$$
|x|'(\varphi)=-\int|x|\varphi'(x)\,dx=\int_{0}^{\infty}\varphi-\int_{-\infty}^{0}\varphi=\int\operatorname{sgn}(x)\varphi(x)\,dx.
$$
よって $|x|'=\operatorname{sgn}$ で、\ref{four:prob-sd-sign} から $|x|''=\operatorname{sgn}'=2\delta$。

**2.** **直接の計算.** $\varphi\in\mathcal{S}$ とする。$E_{a}''(\varphi)=\int E_{a}\varphi''$。部分積分を 2 回行うと（境界項には $e^{-a|x|}\varphi'(x)\to0$, $e^{-a|x|}\varphi(x)\to0$（$x\to\pm\infty$）を使う）
$$
\int_{0}^{\infty}e^{-ax}\varphi''=-\varphi'(0)+a\int_{0}^{\infty}e^{-ax}\varphi'=-\varphi'(0)-a\varphi(0)+a^{2}\int_{0}^{\infty}e^{-ax}\varphi,
$$
$$
\int_{-\infty}^{0}e^{ax}\varphi''=\varphi'(0)-a\int_{-\infty}^{0}e^{ax}\varphi'=\varphi'(0)-a\varphi(0)+a^{2}\int_{-\infty}^{0}e^{ax}\varphi.
$$
足すと $\int e^{-a|x|}\varphi''=-2a\varphi(0)+a^{2}\int e^{-a|x|}\varphi$。$\frac{1}{2a}$ を掛けると $E_{a}''=a^{2}E_{a}-\delta$、すなわち $-E_{a}''+a^{2}E_{a}=\delta$。

**フーリエ変換.** $h(x)\defeq e^{-2\pi|x|}$, $b\defeq\frac{a}{2\pi}$ とすると $e^{-a|x|}=(\delta_{b}h)(x)$ なので、\ref{four:transform-basic.3} と \ref{four:transform-examples.2} から
$$
\widehat{e^{-a|x|}}(\xi)=\frac{b}{\pi(b^{2}+\xi^{2})}=\frac{2a}{a^{2}+4\pi^{2}\xi^{2}},\qquad\hat E_{a}(\xi)=\frac{1}{a^{2}+4\pi^{2}\xi^{2}}.
$$
\ref{four:distribution-fourier.1} から超関数 $E_{a}$ の変換はこの関数で、\ref{four:distribution-fourier.3} を 2 回使うと $\widehat{E_{a}''}=(2\pi i\xi)^{2}\hat E_{a}=-4\pi^{2}\xi^{2}\hat E_{a}$。よって
$$
\widehat{-E_{a}''+a^{2}E_{a}}=(4\pi^{2}\xi^{2}+a^{2})\hat E_{a}=1=\hat\delta
$$
（最後は \ref{four:distribution-fourier.4}）。\ref{four:distribution-fourier.2} から変換は単射なので、これは直接の計算と同値な確認になっている。

**3.** $(x\delta)(\varphi)=\delta(x\varphi)=0\cdot\varphi(0)=0$。$(x\delta')(\varphi)=\delta'(x\varphi)=-(x\varphi)'(0)=-\bigl(\varphi(0)+0\cdot\varphi'(0)\bigr)=-\varphi(0)$。

変換：\ref{four:distribution-fourier.3} と \ref{four:distribution-fourier.4} から $\widehat{\delta'}=2\pi i\xi\hat\delta=2\pi i\xi$（関数 $\xi\mapsto2\pi i\xi$）。もう一度 \ref{four:distribution-fourier.3} を使い、$C^{1}$ 級関数 $2\pi i\xi$ の超関数の微分は関数の微分 $2\pi i$ に等しい（\ref{four:distribution-fourier.1}）ことから
$$
\widehat{x\delta'}=-\frac{1}{2\pi i}\bigl(\widehat{\delta'}\bigr)'=-\frac{1}{2\pi i}\cdot2\pi i=-1=-\hat\delta.
$$

（2 の $E_{a}$ は作用素 $-\frac{d^{2}}{dx^{2}}+a^{2}$ の基本解である。フーリエ変換の側では、微分方程式を解くことが $4\pi^{2}\xi^{2}+a^{2}$ で割ることになる。）
:::

::: problem ★★ 標準：主値 1/x と符号関数のフーリエ変換 {#four:ex-sd-2}
$d=1$ とする。$\varphi\in\mathcal{S}$ について
$$
P(\varphi)\defeq\lim_{\varepsilon\downarrow0}\int_{|x|\ge\varepsilon}\frac{\varphi(x)}{x}dx
$$
とおく。
1. 極限は存在して $P(\varphi)=\int_{0}^{\infty}\frac{\varphi(x)-\varphi(-x)}{x}dx$ となり、$|P(\varphi)|\le4\|\varphi\|_{(1)}$ であることを示せ。とくに $P\in\mathcal{S}'$。また $xP=1$ を示せ。
2. $\log|x|$ は緩増加な関数で、$(\log|x|)'=P$ となることを示せ。
3. $\widehat{\operatorname{sgn}}=\frac{1}{\pi i}P$ を示せ。
:::

::: solution
**1.** $\psi(x)\defeq\frac{\varphi(x)-\varphi(-x)}{x}$（$x>0$）とおく。$\varphi(x)-\varphi(-x)=\int_{-x}^{x}\varphi'$ から $|\psi(x)|\le2p_{0,1}(\varphi)$。$x\ge1$ では $|\varphi(\pm x)|\le\frac{p_{1,0}(\varphi)}{x}$ から $|\psi(x)|\le\frac{2p_{1,0}(\varphi)}{x^{2}}$。よって $\psi$ は $(0,\infty)$ 上可積分で
$$
\int_{0}^{\infty}|\psi|\le2p_{0,1}(\varphi)+2p_{1,0}(\varphi)\int_{1}^{\infty}\frac{dx}{x^{2}}\le4\|\varphi\|_{(1)}.
$$
$\varepsilon>0$ について、$|x|\ge\varepsilon$ で $|\frac{\varphi(x)}{x}|\le\frac{|\varphi(x)|}{\varepsilon}$ は可積分で、負の側を $x\mapsto-x$ と置き換えると $\int_{|x|\ge\varepsilon}\frac{\varphi(x)}{x}dx=\int_{\varepsilon}^{\infty}\psi$。$\varepsilon\downarrow0$ で、\ref{meas:dominated-convergence}（$\psi\mathbf{1}_{[\varepsilon,\infty)}$ は $|\psi|$ で抑えられる）から $\int_{0}^{\infty}\psi$ に収束する。$P$ は明らかに線形なので $P\in\mathcal{S}'$。

$xP=1$：$(xP)(\varphi)=P(x\varphi)=\int_{0}^{\infty}\frac{x\varphi(x)-(-x)\varphi(-x)}{x}dx=\int_{0}^{\infty}\bigl(\varphi(x)+\varphi(-x)\bigr)dx=\int\varphi$。

**2.** **緩増加.** $\int_{0}^{1}|\log x|\,dx=1$、また $x\ge1$ で $0\le\log x\le x$ なので
$$
\int_{\mathbb{R}}|\log|x||\,\langle x\rangle^{-3}dx\le2\int_{0}^{1}|\log x|\,dx+2\int_{1}^{\infty}\frac{x}{(1+x^{2})^{3/2}}dx<\infty.
$$

**微分.** $\varphi\in\mathcal{S}$ とする。$\log|x|\,\varphi'$ は可積分なので、\ref{meas:dominated-convergence} から $(\log|x|)'(\varphi)=-\lim_{\varepsilon\downarrow0}\int_{|x|\ge\varepsilon}\log|x|\,\varphi'(x)\,dx$。$\frac{d}{dx}\log|x|=\frac1x$（$x\ne0$）なので、$[\varepsilon,R]$ と $[-R,-\varepsilon]$ 上で部分積分して $R\to\infty$ とすると（$\log R\,\varphi(\pm R)\to0$）
$$
\int_{|x|\ge\varepsilon}\log|x|\,\varphi'(x)\,dx=-\log\varepsilon\,\bigl(\varphi(\varepsilon)-\varphi(-\varepsilon)\bigr)-\int_{|x|\ge\varepsilon}\frac{\varphi(x)}{x}dx.
$$
1 と同じく $|\varphi(\varepsilon)-\varphi(-\varepsilon)|\le2\varepsilon p_{0,1}(\varphi)$ で、$\varepsilon\log\varepsilon\to0$ なので、第 1 項は $0$ に収束する。よって $(\log|x|)'(\varphi)=P(\varphi)$。

**3.** **近似.** $\varepsilon>0$ について $s_{\varepsilon}(x)\defeq\operatorname{sgn}(x)e^{-2\pi\varepsilon|x|}\in L^{1}$ とおく。\ref{four:ex-ft-1.3} の $k=0$ と同じ計算で
$$
\hat s_{\varepsilon}(\xi)=\int_{0}^{\infty}e^{-2\pi x(\varepsilon+i\xi)}dx-\int_{0}^{\infty}e^{-2\pi x(\varepsilon-i\xi)}dx=\frac{1}{2\pi(\varepsilon+i\xi)}-\frac{1}{2\pi(\varepsilon-i\xi)}=-\frac{i\xi}{\pi(\varepsilon^{2}+\xi^{2})}.
$$

**極限.** $\varphi\in\mathcal{S}$ とする。$\hat\varphi\in L^{1}$ で $|s_{\varepsilon}\hat\varphi|\le|\hat\varphi|$、$\varepsilon\to0$ で $s_{\varepsilon}\to\operatorname{sgn}$（各点）なので、\ref{meas:dominated-convergence} と \ref{four:multiplication-formula} から
$$
\widehat{\operatorname{sgn}}(\varphi)=\int\operatorname{sgn}\,\hat\varphi=\lim_{\varepsilon\to0}\int s_{\varepsilon}\hat\varphi=\lim_{\varepsilon\to0}\int\hat s_{\varepsilon}\varphi=-\frac{i}{\pi}\lim_{\varepsilon\to0}\int_{0}^{\infty}\frac{\xi^{2}}{\varepsilon^{2}+\xi^{2}}\psi(\xi)\,d\xi
$$
（最後は負の側を $\xi\mapsto-\xi$ と置き換えた）。被積分関数は $|\psi|$ で抑えられ、$\psi$ に各点収束するので、極限は $\int_{0}^{\infty}\psi=P(\varphi)$。よって $\widehat{\operatorname{sgn}}=-\frac{i}{\pi}P=\frac{1}{\pi i}P$。

（確認：\ref{four:distribution-fourier.3} と 1 から $\widehat{\operatorname{sgn}'}=2\pi i\xi\cdot\frac{1}{\pi i}P=2\xi P=2=\widehat{2\delta}$ で、\ref{four:prob-sd-sign} と整合する。また $H=\frac12(1+\operatorname{sgn})$（a.e.）から、ヘヴィサイド関数の変換は $\hat H=\frac12\delta+\frac{1}{2\pi i}P$。$P$ を $\mathrm{p.v.}\frac1x$ と書き、**主値**という。）
:::

::: problem ★★★ 発展：超関数の割り算と微分方程式 {#four:ex-sd-3}
$d=1$ とする。
1. $\varphi\in\mathcal{S}$, $\varphi(0)=0$ なら、$\psi(x)\defeq\frac{\varphi(x)}{x}$（$x\ne0$）、$\psi(0)\defeq\varphi'(0)$ は $\mathcal{S}$ の元であることを示せ。これを使って、$T\in\mathcal{S}'$ が $xT=0$ を満たせば、ある $c\in\mathbb{C}$ について $T=c\delta$ となることを示せ。
2. $T\in\mathcal{S}'$ が $T'=0$ を満たせば、$T$ は定数関数であることを示せ。
3. $xT=1$ を満たす $T\in\mathcal{S}'$ は $P+c\delta$（$P$ は \ref{four:ex-sd-2} の主値、$c\in\mathbb{C}$）の形のものに限ることを示せ。また $T'=\delta$ を満たす $T\in\mathcal{S}'$ は $H+c$（$H=\mathbf{1}_{[0,\infty)}$）の形のものに限ることを示せ。さらに、\ref{four:prob-sd-sign} の $\operatorname{sgn}'=2\delta$ と奇関数性だけから $\widehat{\operatorname{sgn}}=\frac{1}{\pi i}P$ を導け。
:::

::: solution
**1.** **Step 1（滑らかさ）.** \ref{calc:fundamental-theorem.2} から、すべての $x$ で $\varphi(x)=\varphi(x)-\varphi(0)=\int_{0}^{1}\frac{d}{dt}\varphi(tx)\,dt=x\int_{0}^{1}\varphi'(tx)\,dt$。よって
$$
\psi(x)=\int_{0}^{1}\varphi'(tx)\,dt\qquad(x\in\mathbb{R})
$$
（$x=0$ でも $\varphi'(0)$ に等しい）。$\partial_{x}^{k}\bigl(\varphi'(tx)\bigr)=t^{k}\varphi^{(k+1)}(tx)$ の絶対値は $p_{0,k+1}(\varphi)$ 以下なので、\ref{meas:parameter-integrals.2} を $k$ について繰り返し使うと（連続性は \ref{meas:parameter-integrals.1}）、$\psi$ は $C^{\infty}$ 級で $\psi^{(k)}(x)=\int_{0}^{1}t^{k}\varphi^{(k+1)}(tx)\,dt$、とくに $|\psi^{(k)}|\le p_{0,k+1}(\varphi)$。

**Step 2（減衰）.** $|x|\ge1$ では $\psi=\varphi\cdot x^{-1}$ で、$(x^{-1})^{(j)}=(-1)^{j}j!x^{-j-1}$ とライプニッツの公式から
$$
|x^{m}\psi^{(k)}(x)|\le\sum_{j=0}^{k}\binom{k}{j}j!\,|x|^{m-j-1}|\varphi^{(k-j)}(x)|\le\sum_{j=0}^{k}\binom{k}{j}j!\,p_{m,k-j}(\varphi)
$$
（$|x|\ge1$ なので $|x|^{m-j-1}\le|x|^{m}$）。$|x|\le1$ では Step 1 から $|x^{m}\psi^{(k)}(x)|\le p_{0,k+1}(\varphi)$。よって $p_{m,k}(\psi)<\infty$ で、$\psi\in\mathcal{S}$。

**Step 3（$xT=0$）.** $\varphi\in\mathcal{S}$ とし、$\varphi_{0}\defeq\varphi-\varphi(0)G$ とおく（$G(0)=1$）。$\varphi_{0}\in\mathcal{S}$, $\varphi_{0}(0)=0$ なので、Step 1–2 から $\varphi_{0}=x\psi$（$\psi\in\mathcal{S}$）。よって
$$
T(\varphi)=\varphi(0)T(G)+T(x\psi)=\varphi(0)T(G)+(xT)(\psi)=T(G)\,\delta(\varphi).
$$
$c\defeq T(G)$ とおけば $T=c\delta$。

**2.** \ref{four:distribution-fourier.3} から $0=\widehat{T'}=2\pi i\xi\hat T$ なので $\xi\hat T=0$。1 から $\hat T=c\delta$。\ref{four:distribution-fourier.2} から $T=(\hat T)^{\vee}=c\check\delta$ で、$\check\delta(\varphi)=\check\varphi(0)=\int\varphi$ なので $\check\delta=1$。よって $T=c$（定数関数）。

**3.** **$xT=1$.** \ref{four:ex-sd-2.1} から $xP=1$ なので $x(T-P)=0$、1 から $T-P=c\delta$。逆に $x(P+c\delta)=1+c\,x\delta=1$（$x\delta=0$）。

**$T'=\delta$.** \ref{four:distribution-examples.1} から $H'=\delta$ なので $(T-H)'=0$、2 から $T-H=c$。逆に $(H+c)'=\delta$（定数の微分は $-c\int\varphi'=0$）。

**$\widehat{\operatorname{sgn}}$.** $\varphi\in\mathcal{S}$ について $(R\varphi)(x)\defeq\varphi(-x)$ とし、$T\in\mathcal{S}'$ が $T(R\varphi)=-T(\varphi)$（すべての $\varphi$）を満たすとき**奇**という。置き換え $x\mapsto-x$ から $\widehat{R\varphi}=R\hat\varphi$、また $\int\operatorname{sgn}\,R\varphi=-\int\operatorname{sgn}\,\varphi$。よって
$$
\widehat{\operatorname{sgn}}(R\varphi)=\int\operatorname{sgn}\,R\hat\varphi=-\int\operatorname{sgn}\,\hat\varphi=-\widehat{\operatorname{sgn}}(\varphi)
$$
で、$\widehat{\operatorname{sgn}}$ は奇。$P$ も奇（$P(R\varphi)=\int_{0}^{\infty}\frac{\varphi(-x)-\varphi(x)}{x}dx=-P(\varphi)$）。一方、$\operatorname{sgn}'=2\delta$ の変換をとると \ref{four:distribution-fourier.3}, \ref{four:distribution-fourier.4} から $2\pi i\xi\widehat{\operatorname{sgn}}=2$、すなわち $x\bigl(\pi i\,\widehat{\operatorname{sgn}}\bigr)=1$（変数名を $x$ とした）。前半から $\pi i\,\widehat{\operatorname{sgn}}=P+c\delta$。$c\delta=\pi i\,\widehat{\operatorname{sgn}}-P$ は奇なので、$c\varphi(0)=c\delta(R\varphi)=-c\delta(\varphi)=-c\varphi(0)$ がすべての $\varphi$ で成り立ち、$\varphi=G$ として $c=0$。よって $\widehat{\operatorname{sgn}}=\frac{1}{\pi i}P$ で、\ref{four:ex-sd-2.3} と一致する。

（1 は「$x$ で割る」ことの超関数版で、割り算の不定性が $\delta$ の定数倍だけであることを言う。2 から、緩増加超関数の範囲でも「導関数が $0$ なら定数」が成り立つ。3 の後半のように、超関数のフーリエ変換は、微分方程式と対称性から積分を使わずに決められることが多い。）
:::

## ポアソン和公式と不確定性原理 {#four:sec-pu-exercises}

対応するページ：\ref{four:page-poisson-uncertainty}

::: problem ★ 基本：ポアソン和公式による級数の値 {#four:ex-pu-1}
1. $t>0$ について
$$
\sum_{n\in\mathbb{Z}}(-1)^{n}e^{-\pi n^{2}t}=\frac{1}{\sqrt t}\sum_{n\in\mathbb{Z}}e^{-\pi(n+1/2)^{2}/t}
$$
を示し、$0<\sum_{n\in\mathbb{Z}}(-1)^{n}e^{-\pi n^{2}t}\le\frac{2e^{-\pi/(4t)}}{\sqrt t\,(1-e^{-\pi/t})}$ を導け。
2. $a>0$, $0\le x\le1$ について
$$
\sum_{n\in\mathbb{Z}}\frac{\cos(2\pi nx)}{n^{2}+a^{2}}=\frac{\pi}{a}\cdot\frac{\cosh(\pi a(1-2x))}{\sinh(\pi a)}
$$
を示せ。
3. $\sum_{n\in\mathbb{Z}}\frac{(-1)^{n}}{n^{2}+a^{2}}=\frac{\pi}{a\sinh(\pi a)}$ を示し、$a\downarrow0$ として $\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^{2}}=\frac{\pi^{2}}{12}$ を導け。
:::

::: solution
**1.** $f(x)\defeq e^{-\pi tx^{2}}\in\mathcal{S}$ で、\ref{four:gaussian-transform}（$a=t$）から $\hat f(\xi)=t^{-1/2}e^{-\pi\xi^{2}/t}$。\ref{four:poisson-summation} を点 $x=\frac12$ で使うと、$e^{\pi in}=(-1)^{n}$ から
$$
\sum_{n}e^{-\pi t(n+1/2)^{2}}=\frac{1}{\sqrt t}\sum_{n}(-1)^{n}e^{-\pi n^{2}/t}.
$$
$t$ を $\frac1t$ に替えて $\sqrt t$ で割れば主張の等式。右辺の和は、$n=k$ と $n=-k-1$（$k\ge0$）を組にすると $(-k-1+\frac12)^{2}=(k+\frac12)^{2}$ なので $2\sum_{k\ge0}e^{-\pi(k+1/2)^{2}/t}>0$。$(k+\frac12)^{2}=k^{2}+k+\frac14\ge k+\frac14$ から
$$
2\sum_{k\ge0}e^{-\pi(k+1/2)^{2}/t}\le2e^{-\pi/(4t)}\sum_{k\ge0}e^{-\pi k/t}=\frac{2e^{-\pi/(4t)}}{1-e^{-\pi/t}}.
$$

**2.** $f_{a}(x)\defeq e^{-2\pi a|x|}$ とする。\ref{four:ex-ft-1.2}（$b=0$）から $\hat f_{a}(\xi)=\frac{a}{\pi(a^{2}+\xi^{2})}$。$f_{a}$ は連続で $(1+|x|)^{2}f_{a}(x)$ は有界、$(1+|\xi|)^{2}\le2(1+\xi^{2})$ と $a^{2}+\xi^{2}\ge\min(a^{2},1)(1+\xi^{2})$ から $(1+|\xi|)^{2}\hat f_{a}(\xi)$ も有界なので、\ref{four:poisson-summation}（$\varepsilon=1$）が使える：
$$
\sum_{n}e^{-2\pi a|x+n|}=\sum_{n}\frac{a}{\pi(a^{2}+n^{2})}e^{2\pi inx}.
$$
右辺は絶対収束し、$n$ と $-n$ を組にすると虚部は消えて $\sum_{n}\frac{a\cos(2\pi nx)}{\pi(a^{2}+n^{2})}$。左辺：$0\le x\le1$ なら、$n\ge0$ で $|x+n|=x+n$、$n=-m$（$m\ge1$）で $|x+n|=m-x$ なので
$$
\sum_{n}e^{-2\pi a|x+n|}=\frac{e^{-2\pi ax}}{1-e^{-2\pi a}}+\frac{e^{2\pi ax}e^{-2\pi a}}{1-e^{-2\pi a}}=\frac{e^{\pi a(1-2x)}+e^{-\pi a(1-2x)}}{e^{\pi a}-e^{-\pi a}}=\frac{\cosh(\pi a(1-2x))}{\sinh(\pi a)}
$$
（分子と分母に $e^{\pi a}$ を掛けた）。$\frac{\pi}{a}$ を掛ければ主張を得る。（$x=0$ は \ref{four:prob-pu-cot}。）

**3.** **交代級数.** 2 で $x=\frac12$ とすると $\cos(\pi n)=(-1)^{n}$、$\cosh0=1$ なので第 1 式。

**$a\downarrow0$.** 第 1 式から $n=0$ の項を除いて 2 で割ると
$$
\sum_{n=1}^{\infty}\frac{(-1)^{n}}{n^{2}+a^{2}}=\frac12\Bigl(\frac{\pi}{a\sinh(\pi a)}-\frac{1}{a^{2}}\Bigr)=-\frac{\pi^{2}}{2}\cdot\frac{\sinh y-y}{y^{3}}\cdot\frac{y}{\sinh y}\qquad(y\defeq\pi a).
$$
左辺：$0\le a\le1$ で各項は $a$ について連続で、絶対値は $\frac{1}{n^{2}}$ 以下なので、\ref{calc:uniform-limit-theorems.3} から一様収束し、\ref{calc:uniform-limit-theorems.2} から和は $a$ について連続。よって $a\downarrow0$ で左辺は $\sum_{n\ge1}\frac{(-1)^{n}}{n^{2}}$ に収束する。右辺：$\sinh y-y=\sum_{k\ge1}\frac{y^{2k+1}}{(2k+1)!}$ で、$(2k+1)!\ge6\,(2k-2)!$（$k\ge1$）から $y>0$ で
$$
\frac{y^{3}}{6}\le\sinh y-y\le\frac{y^{3}}{6}\sum_{k\ge1}\frac{y^{2k-2}}{(2k-2)!}\le\frac{y^{3}}{6}\cosh y.
$$
よって $y\to0$ で $\frac{\sinh y-y}{y^{3}}\to\frac16$、また $\frac{\sinh y}{y}\to1$。右辺は $-\frac{\pi^{2}}{2}\cdot\frac16=-\frac{\pi^{2}}{12}$ に収束し、$\sum_{n\ge1}\frac{(-1)^{n-1}}{n^{2}}=\frac{\pi^{2}}{12}$。

（1 の左辺の交代和は $t\to0$ で $e^{-\pi/(4t)}$ の速さで $0$ に近づく。各項は $1$ に近づくのに、打ち消し合いが極めて精密であることを、ポアソン和公式が双対側の速い減衰として示している。3 の値は、\ref{four:basel} の $\sum\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$ から偶数番目を引いても得られる。）
:::

::: problem ★★ 標準：標本間隔とリーマン和 {#four:ex-pu-2}
1. $f$ が \ref{four:poisson-summation} の仮定を満たすとき、$T>0$ について $T\sum_{n\in\mathbb{Z}}f(nT)=\sum_{n\in\mathbb{Z}}\hat f(n/T)$ を示せ。
2. $f\defeq\operatorname{sinc}^{2}$ は \ref{four:poisson-summation} の仮定を満たし、$\hat f=\Lambda$ であることを示せ。
3. $0<T\le1$ について $T\sum_{n\in\mathbb{Z}}\operatorname{sinc}(nT)^{2}=1$ を示し、
$$
\sum_{n=1}^{\infty}\frac{\sin^{2}(\pi nT)}{n^{2}}=\frac{\pi^{2}}{2}T(1-T)\qquad(0<T\le1)
$$
を導け。$T=\frac12$ の場合から $\sum_{k=0}^{\infty}\frac{1}{(2k+1)^{2}}=\frac{\pi^{2}}{8}$ を導け。
:::

::: solution
**1.** $g(x)\defeq f(Tx)$ とする。$g$ は連続で、$1+T|x|\ge\min(1,T)(1+|x|)$ から
$$
|g(x)|\le C(1+T|x|)^{-1-\varepsilon}\le C\min(1,T)^{-1-\varepsilon}(1+|x|)^{-1-\varepsilon}.
$$
\ref{four:transform-basic.3} から $\hat g(\xi)=T^{-1}\hat f(\xi/T)$ で、$1+|\xi|/T\ge\min(1,T^{-1})(1+|\xi|)$ から同様に $|\hat g(\xi)|\le C'(1+|\xi|)^{-1-\varepsilon}$。\ref{four:poisson-summation} を $g$ に使うと $\sum_{n}f(nT)=\sum_{n}g(n)=\sum_{n}\hat g(n)=T^{-1}\sum_{n}\hat f(n/T)$。

**2.** $f=\hat\Lambda$（\ref{four:prob-ft-triangle}）は連続。$|x|\le1$ では $f(x)\le1\le\frac{4}{(1+|x|)^{2}}$、$|x|\ge1$ では $(1+|x|)^{2}\le4x^{2}$ から $f(x)\le\frac{1}{\pi^{2}x^{2}}\le\frac{4}{(1+|x|)^{2}}$。$\Lambda$ は連続で可積分、$\hat\Lambda$ も可積分なので、\ref{four:inversion-theorem.1} からすべての $\xi$ で $\Lambda(\xi)=\int\hat\Lambda(x)e^{2\pi ix\xi}dx$。よって
$$
\hat f(\xi)=\int\hat\Lambda(x)e^{-2\pi ix\xi}dx=\Lambda(-\xi)=\Lambda(\xi).
$$
$0\le\Lambda\le1$ で $|\xi|\ge1$ なら $\Lambda(\xi)=0$ なので、$|\hat f(\xi)|\le\frac{4}{(1+|\xi|)^{2}}$。仮定は $C=4$, $\varepsilon=1$ で満たされる。

**3.** $0<T\le1$ なら、$n\ne0$ で $|n/T|\ge1$ なので $\Lambda(n/T)=0$。1 と 2 から $T\sum_{n}f(nT)=\sum_{n}\Lambda(n/T)=\Lambda(0)=1$。$f$ は偶関数で $f(0)=1$ なので
$$
1=T\Bigl(1+2\sum_{n=1}^{\infty}\frac{\sin^{2}(\pi nT)}{\pi^{2}n^{2}T^{2}}\Bigr)=T+\frac{2}{\pi^{2}T}\sum_{n=1}^{\infty}\frac{\sin^{2}(\pi nT)}{n^{2}},
$$
これを解いて主張の式。$T=\frac12$ では、$\sin^{2}(\frac{\pi n}{2})$ は $n$ が奇数なら $1$、偶数なら $0$ なので、$\sum_{k\ge0}\frac{1}{(2k+1)^{2}}=\frac{\pi^{2}}{2}\cdot\frac12\cdot\frac12=\frac{\pi^{2}}{8}$（\ref{four:prob-fj-odd-squares} と一致する）。

（$\hat f$ が $[-1,1]$ の外で $0$ なので、間隔 $T\le1$ のリーマン和 $T\sum f(nT)$ は積分 $\int f=\hat f(0)=1$ に正確に一致する。$T>1$ では $\hat f(n/T)$（$n\ne0$）が和に入り込み、例えば $T=2$ では $T\sum f(nT)=2$（$f(2n)=0$, $n\ne0$）$=\Lambda(0)+\Lambda(\frac12)+\Lambda(-\frac12)$ となる。標本間隔が粗すぎると高い振動数が低い振動数に紛れ込む、いわゆるエイリアシングである。）
:::

::: problem ★★★ 発展：不確定性原理の変種 {#four:ex-pu-3}
$d=1$ とする。
1. \ref{four:ex-ft-3} の $h_{1}(x)=2xe^{-\pi x^{2}}$ について、$4\pi\|xh_{1}\|_{2}\|\xi\hat h_{1}\|_{2}=3\|h_{1}\|_{2}^{2}$ を示せ。
2. $f\in L^{2}(\mathbb{R})$, $f\ne0$ とし、可測集合 $E,F\subset\mathbb{R}$ について、$f$ は $E$ の外で $0$（a.e.）、$\mathcal{F}f$ は $F$ の外で $0$（a.e.）で、$A\defeq\lambda(E)<\infty$, $B\defeq\lambda(F)<\infty$ とする。$AB\ge1$ を示せ。
3. 2 の状況で、実は $AB>1$ であることを示せ。
:::

::: solution
**1.** **モーメント.** \ref{four:ex-ft-2.2}（$d=1$, $A=(2)$）から $\int x^{2}e^{-2\pi x^{2}}dx=\frac{1/2}{2\pi\sqrt2}=\frac{1}{4\sqrt2\,\pi}$。$xe^{-2\pi x^{2}}=-\frac{1}{4\pi}(e^{-2\pi x^{2}})'$ なので、$[-R,R]$ 上で部分積分して $R\to\infty$ とすると
$$
\int x^{4}e^{-2\pi x^{2}}dx=\frac{3}{4\pi}\int x^{2}e^{-2\pi x^{2}}dx=\frac{3}{16\sqrt2\,\pi^{2}}.
$$
**ノルム.** $\|h_{1}\|_{2}^{2}=4\int x^{2}e^{-2\pi x^{2}}=\frac{1}{\sqrt2\,\pi}$、$\|xh_{1}\|_{2}^{2}=4\int x^{4}e^{-2\pi x^{2}}=\frac{3}{4\sqrt2\,\pi^{2}}$。\ref{four:ex-ft-3.2} から $\hat h_{1}=-ih_{1}$ なので $|\hat h_{1}|=|h_{1}|$ で、$\|\xi\hat h_{1}\|_{2}=\|xh_{1}\|_{2}$。よって
$$
4\pi\|xh_{1}\|_{2}\|\xi\hat h_{1}\|_{2}=4\pi\cdot\frac{3}{4\sqrt2\,\pi^{2}}=\frac{3}{\sqrt2\,\pi}=3\|h_{1}\|_{2}^{2}.
$$
（$h_{1}\in\mathcal{S}$ はガウス関数 $Ae^{-ax^{2}}$ の形でないので、\ref{four:heisenberg} の不等式は等号にならず、実際に 3 倍の開きがある。）

**2.** **Step 1（$f\in L^{1}$）.** コーシー–シュワルツの不等式から $\|f\|_{1}=\int_{E}|f|\le A^{1/2}\|f\|_{2}<\infty$。よって $f\in L^{1}\cap L^{2}$ で、\ref{four:plancherel.1} の延長の構成から $\mathcal{F}f=\hat f$（a.e.）。

**Step 2.** \ref{four:transform-basic.1} から $|\hat f(\xi)|\le\|f\|_{1}$（すべての $\xi$）。\ref{four:plancherel-identity} と Step 1 から
$$
\|f\|_{2}^{2}=\|\hat f\|_{2}^{2}=\int_{F}|\hat f|^{2}\le B\|f\|_{1}^{2}\le AB\|f\|_{2}^{2}.
$$
$f\ne0$ なので $\|f\|_{2}>0$ で、$AB\ge1$。

**3.** $AB=1$ とすると、2 の Step 2 の不等式はすべて等号である。

**Step 1（変換の絶対値）.** $\int_{F}\bigl(\|f\|_{1}^{2}-|\hat f|^{2}\bigr)=B\|f\|_{1}^{2}-\|f\|_{2}^{2}=0$ で被積分関数は非負なので、ほとんどすべての $\xi\in F$ で $|\hat f(\xi)|=\|f\|_{1}$。$\|f\|_{2}^{2}\le B\|f\|_{1}^{2}$ から $B>0$ なので、この等式が成り立つ $\xi\in F$ が二つ（$\xi_{1}\ne\xi_{2}$）とれる。

**Step 2（位相がそろう）.** 補題：$h\in L^{1}$ で $|\int h|=\int|h|$ なら、ある $\theta\in\mathbb{R}$ について $h=e^{i\theta}|h|$（a.e.）。実際、$\int h=e^{i\theta}|\int h|$ となる $\theta$ をとると $\int\operatorname{Re}(e^{-i\theta}h)=\int|h|$ で、$\operatorname{Re}(e^{-i\theta}h)\le|h|$ なので a.e. で等号、すなわち $e^{-i\theta}h$ の虚部は a.e. で $0$ で $e^{-i\theta}h=|h|$。補題を $h(x)=f(x)e^{-2\pi ix\xi_{k}}$（$k=1,2$）に使うと、$\theta_{k}$ があって $f(x)e^{-2\pi ix\xi_{k}}=e^{i\theta_{k}}|f(x)|$（a.e.）。

**Step 3（矛盾）.** $Z\defeq\{f\ne0\}$ は $f\ne0$ から測度が正。Step 2 の二式を $Z$ の上で割ると、ほとんどすべての $x\in Z$ で $e^{-2\pi ix(\xi_{1}-\xi_{2})}=e^{i(\theta_{1}-\theta_{2})}$。$\eta\defeq\xi_{1}-\xi_{2}\ne0$ について、この式を満たす $x$ の集合は $x_{0}+\frac{1}{|\eta|}\mathbb{Z}$ の形（$x_{0}$ は一つの解）で可算、したがって測度 $0$ である。すると $Z$ の測度も $0$ となり矛盾。よって $AB>1$。

（\ref{four:heisenberg} は「広がり」を 2 次モーメントで測ったが、2・3 は台の測度で測った不確定性原理である。実は $f$ と $\mathcal{F}f$ がともに測度有限の集合の外で $0$ なら $f=0$ となること（ベネディクスの定理）が知られているが、ここでは示さない。）
