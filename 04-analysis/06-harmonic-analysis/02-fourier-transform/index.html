# フーリエ変換（Fourier Transform）

ℝᵈ 上の可積分関数のフーリエ変換、リーマン–ルベーグの補題と畳み込み、微分と掛け算の入れ替え、ガウス関数、反転公式とプランシュレルの定理、シュワルツ空間と緩増加超関数、ポアソン和公式と不確定性原理。

<p class="mn-msc">MSC2020: 42A38, 42B10, 46F05, 46F10</p>
