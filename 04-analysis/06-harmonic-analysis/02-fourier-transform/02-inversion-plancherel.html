# 反転公式とプランシュレルの定理 {#four:page-inversion-plancherel keywords="approximate identities on R^d (dilations K_t of an integrable kernel), Gauss-Weierstrass summation of the Fourier integral, Fourier inversion theorem for f and hat f integrable, uniqueness of the Fourier transform, Plancherel identity on L^1 cap L^2, extension of the Fourier transform to L^2, unitarity, inverse transform, int (sin x / x)^2 dx = pi"}

$f\in L^{1}$ の変換 $\hat f$ が可積分なら、$f$ は $\hat f$ から $f(x)=\int\hat f(\xi)e^{2\pi ix\cdot\xi}d\xi$ で復元できる（**反転公式**）。$\hat f$ が可積分でないときにも使えるように、積分にガウス関数の重み $e^{-\pi t^{2}|\xi|^{2}}$ を掛けて和をとり（フーリエ級数のチェザロ平均にあたる）、それが $f$ とガウス核の畳み込みに等しいことを使う。さらに $L^{2}$ では、フーリエ変換はノルムを保ち（**プランシュレルの定理**）、$L^{2}$ から $L^{2}$ へのユニタリ作用素に延びる。フーリエ級数の $L^{2}(\mathbb{T})\cong\ell^{2}(\mathbb{Z})$（\ref{four:l2-theory.3}）の $\mathbb{R}^{d}$ 版である。

## 記法と定義の確認 {#four:sec-ip-notation}

::: notation
- $L^{p}$, $\hat f$, $C_{0}$, 畳み込み, $\delta_{a}$ は \ref{four:page-l1-transform} のとおり。$L^{2}$ の内積は $\langle f,g\rangle\defeq\int f\bar g$。
- $g\in L^{1}$ の**逆変換**を $\check g(x)\defeq\int g(\xi)e^{2\pi ix\cdot\xi}d\xi$ と書く。$\check g(x)=\hat g(-x)=\overline{\widehat{\bar g}(x)}$。
- $K\in L^{1}$, $t>0$ について $K_{t}(x)\defeq t^{-d}K(x/t)$。$\int K_{t}=\int K$（\ref{meas:lebesgue-linear}）。
- ガウス核 $W_{t}(x)\defeq t^{-d}e^{-\pi|x|^{2}/t^{2}}$（$G(x)=e^{-\pi|x|^{2}}$ について $W_{t}=G_{t}$）。$\int W_{t}=1$（\ref{four:gaussian-transform} で $\xi=0$）。
- **選択公理**：使わない。
:::

## 実数空間上の総和核 {#four:sec-ip-approximate}

::: theorem 実数空間上の総和核 {#four:approximate-identity-rd keywords="for K in L^1(R^d) with integral 1 and K_t(x) = t^{-d} K(x/t): f*K_t -> f in L^p for 1 <= p < infinity, uniformly for bounded uniformly continuous f, and at every point of continuity of a bounded f" index="総和核（実数空間）|そうわかくじっすうくうかん"}
$K\in L^{1}(\mathbb{R}^{d})$, $\int K=1$ とする。$t\to0$ について：
1. $1\le p<\infty$, $f\in L^{p}$ なら $\|f*K_{t}-f\|_{p}\to0$。
2. $f$ が有界で一様連続なら $f*K_{t}\to f$（一様収束）。
3. $f$ が有界可測で点 $x$ で連続なら $(f*K_{t})(x)\to f(x)$。
:::

::: proof
**Step 0.** 置き換え $y=tz$ と $\int K=1$ から
$$
(f*K_{t})(x)-f(x)=\int\bigl(f(x-y)-f(x)\bigr)t^{-d}K(y/t)\,dy=\int\bigl(f(x-tz)-f(x)\bigr)K(z)\,dz.
$$

**1.** $q$ を共役指数とし、\ref{four:convolution-rd} の Step 1 と同じくヘルダーの不等式を測度 $|K(z)|dz$ について使い、$x$ で積分してトネリを使うと（$p=1$ では $\|K\|_{1}^{p/q}$ の因子なし）
$$
\|f*K_{t}-f\|_{p}^{p}\le\|K\|_{1}^{p/q}\int|K(z)|\,\|f(\cdot-tz)-f\|_{p}^{p}\,dz.
$$
被積分関数は各 $z$ で $t\to0$ のとき $0$ に収束し（\ref{meas:translation-continuity.2}）、$2^{p}\|f\|_{p}^{p}|K(z)|$ で抑えられる。優収束定理（$t$ の列に使う）から右辺は $0$ に収束する。

**2・3.** Step 0 の右辺の被積分関数は $2\|f\|_{\infty}|K(z)|$ で抑えられ、各 $z$ で $0$ に収束する（3 では $x$ での連続性、2 では一様連続性から）。3 は優収束定理から。2 は、$\varepsilon>0$ について $\int_{|z|>R}|K|<\varepsilon$ となる $R$ をとり、$|z|\le R$ では一様連続性から $t$ が小さければ $\sup_{x}|f(x-tz)-f(x)|<\varepsilon$ となるので、$\sup_{x}|(f*K_{t})(x)-f(x)|\le\varepsilon\|K\|_{1}+2\|f\|_{\infty}\varepsilon$。
:::

## 反転公式 {#four:sec-ip-inversion}

::: lemma ガウス総和 {#four:gauss-summation keywords="int hat f(xi) e^{-pi t^2 |xi|^2} e^{2 pi i x.xi} d xi = (f * W_t)(x) for f in L^1, where W_t is the Gauss kernel" index="ガウス総和|がうすそうわ"}
$f\in L^{1}(\mathbb{R}^{d})$, $t>0$ なら、すべての $x$ で
$$
\int\hat f(\xi)e^{-\pi t^{2}|\xi|^{2}}e^{2\pi ix\cdot\xi}d\xi=(f*W_{t})(x).
$$
:::

::: proof
$x$ を固定し $g(\xi)\defeq e^{-\pi t^{2}|\xi|^{2}}e^{2\pi ix\cdot\xi}$ とおく。$g=M_{x}(\delta_{t}G)$ なので、\ref{four:transform-basic.2}, \ref{four:transform-basic.3} と \ref{four:gaussian-transform} から
$$
\hat g(y)=\widehat{\delta_{t}G}(y-x)=t^{-d}G\Bigl(\frac{y-x}{t}\Bigr)=W_{t}(x-y)
$$
（$G$ は偶関数）。\ref{four:multiplication-formula} から $\int\hat fg=\int f\hat g=\int f(y)W_{t}(x-y)\,dy=(f*W_{t})(x)$。
:::

::: theorem 反転公式 {#four:inversion-theorem keywords="Fourier inversion: if f and hat f are integrable then f(x) = int hat f(xi) e^{2 pi i x.xi} d xi for almost every x, and everywhere if f is continuous; the Fourier transform is injective on L^1" index="反転公式（フーリエ変換）|はんてんこうしきふーりえへんかん, フーリエの反転公式|ふーりえのはんてんこうしき"}
1. $f\in L^{1}$ かつ $\hat f\in L^{1}$ なら、ほとんどすべての $x$ で $f(x)=(\hat f)^{\vee}(x)=\int\hat f(\xi)e^{2\pi ix\cdot\xi}d\xi$。右辺は $C_{0}$ の元なので、$f$ は（a.e. で等しい関数を除いて）連続で、$f$ が連続ならすべての $x$ で等式が成り立つ。
2. （一意性）$f\in L^{1}$ で $\hat f=0$ なら $f=0$（a.e.）。
:::

::: proof
**1.** \ref{four:gauss-summation} の左辺は、$t\to0$ で各 $x$ について $\int\hat f(\xi)e^{2\pi ix\cdot\xi}d\xi$ に収束する（被積分関数は $|\hat f|$ で抑えられ、$e^{-\pi t^{2}|\xi|^{2}}\to1$、優収束定理）。右辺は \ref{four:approximate-identity-rd.1}（$K=G$, $p=1$）から $L^{1}$ で $f$ に収束するので、ある列 $t_{k}\to0$ についてほとんどすべての $x$ で $f(x)$ に収束する（\ref{meas:riesz-fischer}）。よって a.e. で等しい。$(\hat f)^{\vee}(x)=\widehat{\hat f}(-x)$ は \ref{four:transform-riemann-lebesgue} から $C_{0}$ の元。$f$ も連続なら、二つの連続関数が a.e. で等しいので、差の零でない集合は測度 $0$ の開集合で空。

**2.** $\hat f=0\in L^{1}$ なので 1 から $f=0$ a.e.。
:::

## プランシュレルの定理 {#four:sec-ip-plancherel}

::: lemma L¹∩L² 上の等長性 {#four:plancherel-identity keywords="for f in L^1 cap L^2, hat f is in L^2 and ||hat f||_2 = ||f||_2" index="プランシュレルの等式|ぷらんしゅれるのとうしき"}
$f\in L^{1}\cap L^{2}$ なら $\hat f\in L^{2}$ で $\|\hat f\|_{2}=\|f\|_{2}$。
:::

::: proof
**Step 1.** $\tilde f(x)\defeq\overline{f(-x)}$, $h\defeq f*\tilde f$ とおく。$f,\tilde f\in L^{1}$ なので $h\in L^{1}$ で、\ref{four:convolution-rd.2} と \ref{four:transform-basic.4} から $\hat h=\hat f\cdot\overline{\hat f}=|\hat f|^{2}$。

**Step 2（$h$ は有界連続で $h(0)=\|f\|_{2}^{2}$）.** $h(x)=\int f(x-y)\overline{f(-y)}\,dy=\int f(x+u)\overline{f(u)}\,du$（$u=-y$）で、これはすべての $x$ で絶対収束する（コーシー–シュワルツ）。$|h(x+s)-h(x)|\le\|f(\cdot+s)-f\|_{2}\|f\|_{2}\to0$（\ref{meas:translation-continuity.2}）、$|h|\le\|f\|_{2}^{2}$、$h(0)=\int|f|^{2}$。（$h\in L^{1}$ としての畳み込みとこの $h$ は a.e. で一致する。）

**Step 3.** \ref{four:gauss-summation} を $h$ と $x=0$ に使うと
$$
\int|\hat f(\xi)|^{2}e^{-\pi t^{2}|\xi|^{2}}d\xi=(h*W_{t})(0).
$$
$t\to0$ で、左辺は単調収束定理から $\int|\hat f|^{2}$（$+\infty$ もありうる）に、右辺は \ref{four:approximate-identity-rd.3}（$h$ は有界で $0$ で連続）から $h(0)=\|f\|_{2}^{2}$ に収束する。よって $\int|\hat f|^{2}=\|f\|_{2}^{2}<\infty$。
:::

::: theorem プランシュレルの定理 {#four:plancherel keywords="Plancherel theorem: the Fourier transform on L^1 cap L^2 extends uniquely to a unitary operator F on L^2(R^d); its inverse is the extension of the inverse transform; F f is the L^2 limit of the transforms of f 1_{|x|<=R}" index="プランシュレルの定理|ぷらんしゅれるのていり"}
1. $L^{1}\cap L^{2}$ 上の $f\mapsto\hat f$ は、$L^{2}$ から $L^{2}$ への等長線形写像 $\mathcal{F}$ に一意に延びる。同様に $g\mapsto\check g$ も等長線形写像 $\mathcal{F}^{-}$ に延びる。
2. $\mathcal{F}$ は全単射で $\mathcal{F}^{-1}=\mathcal{F}^{-}=\mathcal{F}^{*}$（ユニタリ）。とくに $\langle\mathcal{F}f,\mathcal{F}g\rangle=\langle f,g\rangle$。
3. $f\in L^{2}$ なら、$f_{R}\defeq f\mathbf{1}_{\{|x|\le R\}}$ について $\mathcal{F}f=\lim_{R\to\infty}\hat f_{R}$（$L^{2}$ の極限）。
:::

::: proof
**Step 1（延長）.** $L^{1}\cap L^{2}$ は $L^{2}$ で稠密（例えば $f_{R}\in L^{1}\cap L^{2}$ で、優収束定理から $\|f-f_{R}\|_{2}\to0$）。\ref{four:plancherel-identity} から $f\mapsto\hat f$ はこの稠密部分空間上で等長なので、$f_{k}\to f$（$L^{2}$）なら $(\hat f_{k})$ は $L^{2}$ のコーシー列で、$L^{2}$ の完備性（\ref{meas:riesz-fischer}）から極限 $\mathcal{F}f$ がある。極限は列のとり方によらず（二つの列を交互に並べればよい）、$\mathcal{F}$ は線形で等長。連続な延長は稠密部分空間上の値で決まるので一意。$\check g=\overline{\widehat{\bar g}}$ なので、$g\mapsto\check g$ も $L^{1}\cap L^{2}$ 上で等長で、同様に延びる。3 は Step 1 の構成そのもの。

**Step 2（$\mathcal{F}^{-}=\mathcal{F}^{*}$）.** $f,g\in L^{1}\cap L^{2}$ なら、フビニ（$(x,\xi)\mapsto f(x)\overline{g(\xi)}e^{-2\pi ix\cdot\xi}$ は可積分）から
$$
\langle\hat f,g\rangle=\iint f(x)e^{-2\pi ix\cdot\xi}\overline{g(\xi)}\,dx\,d\xi=\int f(x)\overline{\int g(\xi)e^{2\pi ix\cdot\xi}d\xi}\,dx=\langle f,\check g\rangle.
$$
両辺は $f,g$ について $L^{2}$ で連続なので（コーシー–シュワルツ）、すべての $f,g\in L^{2}$ で $\langle\mathcal{F}f,g\rangle=\langle f,\mathcal{F}^{-}g\rangle$。

**Step 3（ユニタリ）.** 等長線形写像 $A$ について $A^{*}A=I$：分極恒等式 $4\langle x,y\rangle=\sum_{k=0}^{3}i^{k}\|x+i^{k}y\|^{2}$ から $\langle Ax,Ay\rangle=\langle x,y\rangle$、すなわち $\langle A^{*}Ax-x,y\rangle=0$（すべての $y$）。$A=\mathcal{F}$ に使うと Step 2 から $\mathcal{F}^{-}\mathcal{F}=I$。Step 2 の等式の共役をとると $\langle\mathcal{F}^{-}g,f\rangle=\langle g,\mathcal{F}f\rangle$ で、$\mathcal{F}=(\mathcal{F}^{-})^{*}$。$A=\mathcal{F}^{-}$ に使うと $\mathcal{F}\mathcal{F}^{-}=I$。よって $\mathcal{F}$ は全単射で逆は $\mathcal{F}^{-}=\mathcal{F}^{*}$。内積の保存は分極恒等式から。
:::

::: example 正弦積分の 2 乗 {#four:sinc-squared keywords="Plancherel applied to the indicator of [-1/2,1/2] gives int (sin(pi xi)/(pi xi))^2 d xi = 1 and int (sin x / x)^2 dx = pi" index="sinc 関数の 2 乗積分|しんくかんすうの2じょうせきぶん"}
$\chi\defeq\mathbf{1}_{[-1/2,1/2]}\in L^{1}\cap L^{2}$ に \ref{four:plancherel-identity} と \ref{four:transform-examples.1} を使うと
$$
\int_{-\infty}^{\infty}\Bigl(\frac{\sin(\pi\xi)}{\pi\xi}\Bigr)^{2}d\xi=\|\chi\|_{2}^{2}=1,\qquad\text{よって}\qquad\int_{-\infty}^{\infty}\Bigl(\frac{\sin x}{x}\Bigr)^{2}dx=\pi
$$
（$x=\pi\xi$ と置き換えた）。
:::

::: hypcheck
- 反転公式で $\hat f\in L^{1}$ の仮定は、左辺の極限を優収束定理でとるのに使った。仮定がなくても、ガウス総和（\ref{four:gauss-summation}）は $L^{1}$ で $f$ に収束する（総和法による反転）。
- \ref{four:plancherel-identity} の Step 3 で、$\int|\hat f|^{2}<\infty$ を前もって仮定していない点が重要である：単調収束定理は値 $+\infty$ を許すので、等式から有限性が出る。
- プランシュレルの定理の 3 は $f_{R}$ に限らない：$L^{1}\cap L^{2}$ の元で $L^{2}$ で $f$ に収束する任意の列について同じ極限になる。一方、$f\in L^{2}\setminus L^{1}$ に対して $\int f(x)e^{-2\pi ix\cdot\xi}dx$ は一般に（絶対）収束しないので、$\mathcal{F}f$ は各点の積分としては定義されない。
- 用いたのはヒルベルト空間の初歩（分極恒等式、稠密部分空間からの連続な延長）だけで、リースの表現定理などは使っていない。
:::

::: supplement
**関連する結果.**
- $1\le p\le2$ なら $\mathcal{F}$ は $L^{p}$ から $L^{p'}$（$\frac1p+\frac1{p'}=1$）への有界作用素に延び、$\|\hat f\|_{p'}\le\|f\|_{p}$（ハウスドルフ–ヤングの不等式）。$p=1$（\ref{four:transform-basic.1}）と $p=2$（プランシュレル）の間をリース–ソーリンの補間定理でつなぐのが標準的な証明。$p>2$ では $L^{p}$ の関数のフーリエ変換は一般に関数にならない。いずれもこのサイトではまだ証明していない。
- フーリエ級数の場合（\ref{four:l2-theory}）では $L^{2}(\mathbb{T})\cong\ell^{2}(\mathbb{Z})$ で、両側の空間が異なる。$\mathbb{R}^{d}$ では双対群が $\mathbb{R}^{d}$ 自身なので、$\mathcal{F}$ は $L^{2}(\mathbb{R}^{d})$ 上のユニタリ作用素になり、$\mathcal{F}^{4}=I$（$\mathcal{F}^{2}f(x)=f(-x)$）。したがって $\mathcal{F}$ の固有値は $\pm1,\pm i$ のどれかで、固有関数としてエルミート関数がとれる（$G$ は固有値 $1$）。

**高い視点：可換な対称性の同時対角化.** $L^{2}(\mathbb{R}^{d})$ 上の平行移動 $\tau_{h}$ は互いに可換なユニタリ作用素の族で、プランシュレルの定理は、この族を同時に「掛け算作用素」$e^{-2\pi ih\cdot\xi}$ として対角化するユニタリ変換が存在することを述べている。有限次元で可換な正規行列の族が同時対角化できることの無限次元版であり、固有ベクトル $e^{2\pi ix\cdot\xi}$ が $L^{2}$ に入らないため、和の代わりに積分（連続スペクトル）が現れる。比喩で言えば、反転公式は「音を周波数ごとの成分に分けた楽譜から、元の音を寸分違わず再生できる」こと、プランシュレルの定理は「分解の前後で音のエネルギーが変わらない」ことである。
:::

## 問題 {#four:sec-ip-problems}

::: problem {#four:prob-ip-cauchy}
$d=1$ とする。\ref{four:transform-examples.2} と反転公式を使い、$\int_{-\infty}^{\infty}\frac{e^{2\pi ix\xi}}{1+\xi^{2}}d\xi=\pi e^{-2\pi|x|}$ を示せ。また $\int_{-\infty}^{\infty}\frac{d\xi}{(1+\xi^{2})^{2}}=\frac{\pi}{2}$ をプランシュレルから導け。
:::

::: solution
$f(x)=e^{-2\pi|x|}$ は可積分かつ連続で、$\hat f(\xi)=\frac{1}{\pi(1+\xi^{2})}$ も可積分。\ref{four:inversion-theorem.1} から、すべての $x$ で $e^{-2\pi|x|}=\int\frac{e^{2\pi ix\xi}}{\pi(1+\xi^{2})}d\xi$。$\pi$ を掛ければ第 1 式。第 2 式：$f\in L^{1}\cap L^{2}$ で、\ref{four:plancherel-identity} から
$$
\int\frac{d\xi}{\pi^{2}(1+\xi^{2})^{2}}=\int e^{-4\pi|x|}dx=2\cdot\frac{1}{4\pi}=\frac{1}{2\pi},\qquad\int\frac{d\xi}{(1+\xi^{2})^{2}}=\frac{\pi^{2}}{2\pi}=\frac\pi2.
$$
:::

::: problem {#four:prob-ip-convolution-l2}
$f,g\in L^{2}(\mathbb{R}^{d})$ なら $f*g$（$(f*g)(x)=\int f(x-y)g(y)dy$、各点で絶対収束）は $C_{0}$ に入ることを示せ。
:::

::: solution
コーシー–シュワルツと平行移動不変性から $|(f*g)(x)|\le\|f\|_{2}\|g\|_{2}$ で各点で絶対収束し、$|(f*g)(x+h)-(f*g)(x)|\le\|f(\cdot+h)-f\|_{2}\|g\|_{2}$ から一様連続（\ref{meas:translation-continuity.2}）。$C_{0}$ に入ること：$f_{R}\defeq f\mathbf{1}_{\{|x|\le R\}}$, $g_{R}$ も同様にすると、$f_{R}*g_{R}$ は $|x|>2R$ で $0$（$|x-y|\le R$ かつ $|y|\le R$ は $|x|\le2R$ を導く）。$\|f*g-f_{R}*g_{R}\|_{\infty}\le\|f-f_{R}\|_{2}\|g\|_{2}+\|f_{R}\|_{2}\|g-g_{R}\|_{2}\to0$ で、台がコンパクトな連続関数の一様極限は $0$ に近づく：$\varepsilon>0$ に対し $\|f*g-f_{R}*g_{R}\|_{\infty}<\varepsilon$ となる $R$ をとれば $|x|>2R$ で $|(f*g)(x)|<\varepsilon$。
:::
