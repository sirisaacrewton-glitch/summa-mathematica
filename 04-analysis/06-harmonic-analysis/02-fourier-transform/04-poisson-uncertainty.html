# ポアソン和公式と不確定性原理 {#four:page-poisson-uncertainty keywords="Poisson summation formula sum f(x+n) = sum hat f(n) e^{2 pi i n x} under decay conditions, sum f(n) = sum hat f(n), Dirac comb is its own Fourier transform, Jacobi theta function transformation theta(1/t) = sqrt(t) theta(t), heat kernel on the circle is positive and an approximate identity, Heisenberg uncertainty principle ||f||^4 <= 16 pi^2 ||x f||^2 ||xi hat f||^2 with equality for Gaussians"}

フーリエ級数とフーリエ変換は、実数直線 $\mathbb{R}$ を周期 $1$ で「巻き付けて」円周 $\mathbb{T}$ にする操作で結びつく。$f$ を巻き付けた周期関数 $\sum_{n}f(x+n)$ のフーリエ係数は、ちょうど $\hat f$ の整数点での値 $\hat f(n)$ になる。ここから**ポアソン和公式** $\sum_{n}f(n)=\sum_{n}\hat f(n)$ が出る。ガウス関数に使うとテータ関数の変換公式が得られ、また円周上の熱核が正であること（\ref{four:page-applications} で残した点）もわかる。最後に、$f$ と $\hat f$ の両方を同時に一点の近くに集中させることはできないという**ハイゼンベルクの不確定性原理**を示す。

## 記法と定義の確認 {#four:sec-pu-notation}

::: notation
- $d=1$ とする。$\hat f$, $W_{s}$（ガウス核 $W_{s}(x)=s^{-1}e^{-\pi x^{2}/s^{2}}$）, $\mathcal{S}$ は \ref{four:page-l1-transform}, \ref{four:page-inversion-plancherel}, \ref{four:page-schwartz-distributions} のとおり。
- $\mathbb{T}$ 上のフーリエ係数を $\hat F(n)$、総和核・絶対収束するフーリエ級数は \ref{four:approximate-identity}, \ref{four:absolutely-convergent}。
- $\|\cdot\|_{2}$ は $L^{2}(\mathbb{R})$ のノルム。
- **選択公理**：使わない。
:::

## ポアソン和公式 {#four:sec-pu-poisson}

::: theorem ポアソン和公式 {#four:poisson-summation keywords="Poisson summation: if f is continuous with |f(x)| <= C (1+|x|)^{-1-eps} and |hat f(xi)| <= C (1+|xi|)^{-1-eps}, then sum_n f(x+n) = sum_n hat f(n) e^{2 pi i n x} for all x; in particular sum f(n) = sum hat f(n); holds for f in S" index="ポアソン和公式|ぽあそんわこうしき"}
$f\colon\mathbb{R}\to\mathbb{C}$ が連続で、ある $C,\varepsilon>0$ について
$$
|f(x)|\le C(1+|x|)^{-1-\varepsilon},\qquad|\hat f(\xi)|\le C(1+|\xi|)^{-1-\varepsilon}
$$
とする。このとき、すべての $x$ で
$$
\sum_{n\in\mathbb{Z}}f(x+n)=\sum_{n\in\mathbb{Z}}\hat f(n)e^{2\pi inx},\qquad\text{とくに}\qquad\sum_{n\in\mathbb{Z}}f(n)=\sum_{n\in\mathbb{Z}}\hat f(n)
$$
で、両辺の級数は絶対収束する。$f\in\mathcal{S}$ なら仮定は満たされる。
:::

::: proof
**Step 1（周期化）.** $x\in[0,1]$, $n\in\mathbb{Z}$ なら $1+|x+n|\ge\max(1,|n|)$（$n\ge0$ なら $|x+n|\ge n$、$n\le-1$ なら $|x+n|\ge|n|-1$ で $1+|x+n|\ge|n|$）。よって $|f(x+n)|\le C\max(1,|n|)^{-1-\varepsilon}$ で、右辺は $n$ について和が有限。ワイエルシュトラスの $M$ 判定法から $F(x)\defeq\sum_{n}f(x+n)$ は $[0,1]$ 上一様絶対収束し、$F$ は連続。$F(x+1)=F(x)$（和の番号をずらす）なので、どの区間 $[k,k+1]$ でも一様収束し、$F\in C(\mathbb{T})$。

**Step 2（係数）.** 一様収束なので項別に積分でき、
$$
\hat F(m)=\sum_{n}\int_{0}^{1}f(x+n)e^{-2\pi imx}dx=\sum_{n}\int_{n}^{n+1}f(y)e^{-2\pi imy}dy=\int_{\mathbb{R}}f(y)e^{-2\pi imy}dy=\hat f(m).
$$
2 番目の等号は $y=x+n$ と $e^{-2\pi imn}=1$、3 番目は $f\in L^{1}$ と優収束定理（部分和は $|f|$ で抑えられる）から。

**Step 3.** 仮定から $\sum_{m}|\hat F(m)|=\sum_{m}|\hat f(m)|<\infty$。$F$ は連続なので、\ref{four:absolutely-convergent} からすべての $x$ で $F(x)=\sum_{m}\hat f(m)e^{2\pi imx}$。$x=0$ とすれば第 2 式。

**Step 4（$\mathcal{S}$）.** $f\in\mathcal{S}$ なら $(1+|x|)^{2}|f(x)|$ は有界で（\ref{four:schwartz-basic}）、$\hat f\in\mathcal{S}$（\ref{four:schwartz-fourier.1}）も同様。$\varepsilon=1$ でよい。
:::

::: corollary ディラックの櫛 {#four:dirac-comb keywords="the Dirac comb sum_n delta_n is a tempered distribution equal to its own Fourier transform" index="ディラックの櫛|でぃらっくのくし"}
$\mathrm{III}\defeq\sum_{n\in\mathbb{Z}}\delta_{n}$（\ref{four:prob-sd-delta-comb}）について $\widehat{\mathrm{III}}=\mathrm{III}$。
:::

::: proof
$\varphi\in\mathcal{S}$ について $\widehat{\mathrm{III}}(\varphi)=\mathrm{III}(\hat\varphi)=\sum_{n}\hat\varphi(n)=\sum_{n}\varphi(n)=\mathrm{III}(\varphi)$（\ref{four:poisson-summation}）。
:::

## テータ関数と熱核 {#four:sec-pu-theta}

::: theorem テータ関数の変換公式 {#four:theta-transformation keywords="Jacobi theta function theta(t) = sum_n e^{-pi n^2 t} satisfies theta(1/t) = sqrt(t) theta(t) for t > 0" index="テータ関数|てーたかんすう, テータ関数の変換公式|てーたかんすうのへんかんこうしき"}
$t>0$ について $\theta(t)\defeq\sum_{n\in\mathbb{Z}}e^{-\pi n^{2}t}$ とおくと $\theta(1/t)=\sqrt t\,\theta(t)$。
:::

::: proof
$f(x)\defeq e^{-\pi tx^{2}}\in\mathcal{S}$。\ref{four:gaussian-transform}（$a=t$）から $\hat f(\xi)=t^{-1/2}e^{-\pi\xi^{2}/t}$。\ref{four:poisson-summation} から $\sum_{n}e^{-\pi tn^{2}}=t^{-1/2}\sum_{n}e^{-\pi n^{2}/t}$、すなわち $\theta(t)=t^{-1/2}\theta(1/t)$。
:::

::: corollary 円周上の熱核 {#four:circle-heat-kernel keywords="the heat kernel on the circle H_t(x) = sum_n e^{-4 pi^2 n^2 t} e^{2 pi i n x} equals the periodization sum_m (4 pi t)^{-1/2} e^{-(x+m)^2/(4t)}; it is positive and an approximate identity as t -> 0" index="熱核（円周）|ねつかくえんしゅう"}
$t>0$ について $H_{t}(x)\defeq\sum_{n}e^{-4\pi^{2}n^{2}t}e^{2\pi inx}$ とおく。
1. $H_{t}(x)=\sum_{m\in\mathbb{Z}}(4\pi t)^{-1/2}e^{-(x+m)^{2}/(4t)}$。とくに $H_{t}>0$。
2. $\int_{\mathbb{T}}H_{t}=1$ で、$0<\delta<\frac12$ について $\int_{\delta\le|x|_{\mathbb{T}}}H_{t}\to0$（$t\to0$）。したがって $(H_{t})$ は（$N\to\infty$ の代わりに $t\to0$ を添字とする）非負の総和核で、$f\in L^{p}(\mathbb{T})$（$1\le p<\infty$）なら $\|H_{t}*f-f\|_{p}\to0$、$f\in C(\mathbb{T})$ なら一様収束する。
:::

::: proof
**1.** $s\defeq\sqrt{4\pi t}$ とおくと $W_{s}(y)=(4\pi t)^{-1/2}e^{-y^{2}/(4t)}$ で、\ref{four:gaussian-transform} と \ref{four:transform-basic.3} から $\widehat{W_{s}}(\xi)=e^{-\pi s^{2}\xi^{2}}=e^{-4\pi^{2}t\xi^{2}}$。$W_{s}\in\mathcal{S}$ に \ref{four:poisson-summation} を使えばよい。

**2.** $\int_{\mathbb{T}}H_{t}=\hat H_{t}(0)=1$（級数は一様収束するので項別積分）。$H_{t}\ge0$ と 1 から
$$
\int_{\delta\le|x|_{\mathbb{T}}}H_{t}=\int_{\{y\in\mathbb{R}:\,\operatorname{dist}(y,\mathbb{Z})\ge\delta\}}W_{s}(y)\,dy\le\int_{|y|\ge\delta}W_{s}(y)\,dy=\int_{|z|\ge\delta/s}e^{-\pi z^{2}}dz
$$
（1 番目の等号は \ref{four:poisson-summation} の Step 2 と同じ周期化の積分、最後は $y=sz$）。$t\to0$ で $s\to0$ なので右辺は $0$ に収束する（優収束定理）。収束の主張は \ref{four:approximate-identity-convergence} の証明が、添字 $N$ を $t$ に替えてそのまま通る。
:::

この系により、\ref{four:heat-equation} の解 $u(t,\cdot)=H_{t}*f$ は、初期値 $f\in L^{1}(\mathbb{T})$ でも $t\to0$ で $L^{1}$ で $f$ に収束する。

## 不確定性原理 {#four:sec-pu-uncertainty}

::: theorem ハイゼンベルクの不確定性原理 {#four:heisenberg keywords="Heisenberg uncertainty principle: for f in S(R), ||f||_2^2 <= 4 pi ||x f||_2 ||xi hat f||_2, with equality iff f is a Gaussian A e^{-a x^2}, a > 0; translated and modulated versions" index="不確定性原理|ふかくていせいげんり, ハイゼンベルクの不等式|はいぜんべるくのふとうしき"}
$f\in\mathcal{S}(\mathbb{R})$ について
$$
\|f\|_{2}^{2}\le4\pi\,\|xf\|_{2}\,\|\xi\hat f\|_{2}.
$$
等号は $f(x)=Ae^{-ax^{2}}$（$A\in\mathbb{C}$, $a>0$）のときに限る。さらに任意の $x_{0},\xi_{0}\in\mathbb{R}$ について $\|f\|_{2}^{2}\le4\pi\|(x-x_{0})f\|_{2}\|(\xi-\xi_{0})\hat f\|_{2}$。
:::

::: proof
**Step 1（部分積分）.** $|f|^{2}=f\bar f$ は $C^{1}$ で $(|f|^{2})'=f'\bar f+f\bar f'=2\operatorname{Re}(f'\bar f)$。$[-R,R]$ 上で部分積分して $R\to\infty$ とすると（$x|f(x)|^{2}\to0$）
$$
\|f\|_{2}^{2}=\int|f|^{2}dx=-\int x(|f|^{2})'dx=-2\operatorname{Re}\int xf(x)\overline{f'(x)}\,dx.
$$

**Step 2（コーシー–シュワルツ）.** $\|f\|_{2}^{2}\le2\bigl|\int xf\overline{f'}\bigr|\le2\|xf\|_{2}\|f'\|_{2}$。

**Step 3（プランシュレル）.** $f'\in\mathcal{S}$ で $\widehat{f'}=2\pi i\xi\hat f$（\ref{four:schwartz-fourier.1}）なので、\ref{four:plancherel-identity} から $\|f'\|_{2}=2\pi\|\xi\hat f\|_{2}$。Step 2 と合わせて不等式を得る。

**Step 4（等号）.** $f\ne0$ で等号とする（$f=0$ は $A=0$）。$xf\ne0$ なので、Step 2 のコーシー–シュワルツの等号から $f'=\lambda xf$（ある $\lambda\in\mathbb{C}$）で、かつ $-\operatorname{Re}\int xf\overline{f'}=|\int xf\overline{f'}|$。前者から $(e^{-\lambda x^{2}/2}f)'=0$、すなわち $f=Ae^{\lambda x^{2}/2}$。$f\in L^{2}$ なので $\operatorname{Re}\lambda<0$。後者は $-\operatorname{Re}\bar\lambda\,\|xf\|_{2}^{2}=|\lambda|\|xf\|_{2}^{2}$ で、$\lambda$ が負の実数であることを意味する。$a\defeq-\lambda/2>0$。逆に $f=Ae^{-ax^{2}}$ なら $f'=-2axf$ で Step 2 の二つの不等式はどちらも等号になる。

**Step 5（平行移動）.** $g(x)\defeq e^{-2\pi i\xi_{0}x}f(x+x_{0})\in\mathcal{S}$ とおくと、$|g(x)|=|f(x+x_{0})|$、\ref{four:transform-basic.2} から $|\hat g(\xi)|=|\hat f(\xi+\xi_{0})|$。$g$ に不等式を使い、$x\mapsto x-x_{0}$, $\xi\mapsto\xi-\xi_{0}$ と置き換えればよい。
:::

::: hypcheck
- ポアソン和公式の二つの減衰条件はどちらも本質的である。$f$ の減衰は周期化 $F$ の一様収束（連続性）に、$\hat f$ の減衰はフーリエ級数 $\sum\hat f(n)e^{2\pi inx}$ の絶対収束に使った。片方だけでは一般に成り立たない（両辺の一方が発散しうる）。
- 熱核の正値性は、フーリエ級数の側からは見えにくい（係数はすべて正だが、それだけでは関数の正値性は出ない）。周期化の表示によって初めて明らかになる。
- 不確定性原理の証明は $f\in\mathcal{S}$ を仮定した。部分積分の境界項と $f'$ の存在にしか使っていないので、$xf,f'\in L^{2}$ となる $f\in L^{2}$ に拡張できる（$\mathcal{S}$ が稠密であることを使う）が、ここでは示していない。
:::

::: supplement
**関連する結果.**
- $\mathbb{R}^{d}$ 版：$\sum_{n\in\mathbb{Z}^{d}}f(x+n)=\sum_{n\in\mathbb{Z}^{d}}\hat f(n)e^{2\pi in\cdot x}$（$f\in\mathcal{S}(\mathbb{R}^{d})$）。格子 $\Lambda$ とその双対格子 $\Lambda^{*}$ について $\sum_{\lambda\in\Lambda}f(\lambda)=\frac{1}{\operatorname{vol}(\mathbb{R}^{d}/\Lambda)}\sum_{\mu\in\Lambda^{*}}\hat f(\mu)$。証明は同じである。
- テータ関数の変換公式は、リーマンのゼータ関数の関数等式 $\pi^{-s/2}\Gamma(s/2)\zeta(s)=\pi^{-(1-s)/2}\Gamma(\frac{1-s}{2})\zeta(1-s)$ の標準的な証明の出発点である（メリン変換 $\int_{0}^{\infty}(\theta(t)-1)t^{s/2}\frac{dt}{t}$ を使う）。これは解析的整数論で扱う予定。
- 「$f$ と $\hat f$ の両方が台コンパクトなら $f=0$」という不確定性原理の定性版もある（台コンパクトな $f$ の $\hat f$ は整関数に延びるので、零点が集積して恒等的に $0$）。

**高い視点：巻き付けと双対格子.** ポアソン和公式は、部分群 $\mathbb{Z}\subset\mathbb{R}$ と商 $\mathbb{T}=\mathbb{R}/\mathbb{Z}$ についての「制限と周期化の双対性」である。$\mathbb{R}$ の双対は $\mathbb{R}$、$\mathbb{T}$ の双対は $\mathbb{Z}$ で、$\mathbb{R}$ 上で周期化する（$\mathbb{T}$ に押し出す）ことは、双対側で $\mathbb{Z}$ に制限することに対応する。比喩で言えば、長い紙テープに書いた模様を円筒に巻き付けて重ね合わせると、重ね合わせた模様の「音程」は、元の模様の音程のうち円筒の一周にちょうど合う整数番目のものだけが残る。不確定性原理は、プランシュレルの定理のもとで、位置の掛け算作用素 $x$ と運動量の作用素 $\frac{1}{2\pi i}\frac{d}{dx}$（フーリエ変換で $\xi$ になる）が交換しないこと、すなわち交換子が $[\frac{d}{dx},x]=1$ であることの定量的な表現である。
:::

## 問題 {#four:sec-pu-problems}

::: problem {#four:prob-pu-cot}
$a>0$ について $f(x)\defeq e^{-2\pi a|x|}$ にポアソン和公式を使い、$\sum_{n\in\mathbb{Z}}\frac{1}{a^{2}+n^{2}}=\frac{\pi}{a}\coth(\pi a)$ を示せ。
:::

::: solution
\ref{four:transform-examples.2} と \ref{four:transform-basic.3}（$f=\delta_{a}(e^{-2\pi|x|})$）から $\hat f(\xi)=a^{-1}\cdot\frac{1}{\pi(1+(\xi/a)^{2})}=\frac{a}{\pi(a^{2}+\xi^{2})}$。$f$ は連続で指数的に減衰し、$|\hat f(\xi)|\le C(1+|\xi|)^{-2}$ なので \ref{four:poisson-summation} が使える：
$$
\sum_{n}\frac{a}{\pi(a^{2}+n^{2})}=\sum_{n}e^{-2\pi a|n|}=1+\frac{2e^{-2\pi a}}{1-e^{-2\pi a}}=\frac{1+e^{-2\pi a}}{1-e^{-2\pi a}}=\coth(\pi a).
$$
$\frac{\pi}{a}$ を掛ければよい。
:::

::: problem {#four:prob-pu-theta-asymptotic}
$\theta(t)\sim t^{-1/2}$（$t\to0$）、すなわち $\sqrt t\,\theta(t)\to1$ を示せ。
:::

::: solution
\ref{four:theta-transformation} から $\sqrt t\,\theta(t)=\theta(1/t)=1+2\sum_{n\ge1}e^{-\pi n^{2}/t}$。$t\le1$ なら $e^{-\pi n^{2}/t}\le e^{-\pi n/t}$ なので、右辺の和は $\le\frac{2e^{-\pi/t}}{1-e^{-\pi/t}}\to0$（$t\to0$）。
:::
