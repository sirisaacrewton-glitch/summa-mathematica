# シュワルツ空間と緩増加超関数 {#four:page-schwartz-distributions keywords="Schwartz space S(R^d) of rapidly decreasing functions, seminorms sup |x^alpha d^beta f|, Fourier transform is a bijection of S with seminorm estimates, tempered distributions S'(R^d) defined by seminorm bounds, functions of polynomial growth as distributions, Dirac delta, derivatives of distributions, Fourier transform of tempered distributions, hat delta = 1, hat 1 = delta, consistency with L^1 and L^2 transforms"}

フーリエ変換は微分と掛け算を入れ替える（\ref{four:differentiation-multiplication}）。そこで「何回微分しても、どんな多項式を掛けても有界なまま」という関数の空間——**シュワルツ空間** $\mathcal{S}$——を考えると、フーリエ変換は $\mathcal{S}$ をそれ自身に全単射に移す。この空間の上の「連続な」線形汎関数を**緩増加超関数**といい、多項式・定数関数・デルタ関数 $\delta$ のように、可積分でない関数や関数でさえない対象を含む。緩増加超関数のフーリエ変換は、掛け算公式（\ref{four:multiplication-formula}）を定義に格上げしたもので、$\hat\delta=1$, $\hat1=\delta$ のような式に正確な意味を与える。

## 記法と定義の確認 {#four:sec-sd-notation}

::: notation
- 多重指数 $\alpha=(\alpha_{1},\dots,\alpha_{d})\in\mathbb{Z}_{\ge0}^{d}$ について $|\alpha|\defeq\sum\alpha_{j}$、$x^{\alpha}\defeq\prod x_{j}^{\alpha_{j}}$、$\partial^{\alpha}\defeq\partial_{1}^{\alpha_{1}}\cdots\partial_{d}^{\alpha_{d}}$。$\langle x\rangle\defeq(1+|x|^{2})^{1/2}$。
- $\hat f$, $\check g$, $L^{p}$, 畳み込み, $W_{t}$, $\mathcal{F}$（$L^{2}$ 上）は \ref{four:page-l1-transform}, \ref{four:page-inversion-plancherel} のとおり。
- 単項式と $\langle x\rangle$ の比較：$|x^{\alpha}|\le\langle x\rangle^{|\alpha|}$、$\langle x\rangle^{2k}=(1+|x|^{2})^{k}$ は $|\gamma|\le2k$ の単項式 $x^{\gamma}$ の、正の係数の一次結合（2 乗の項だけ）。$\int\langle x\rangle^{-d-1}dx<\infty$（極座標、あるいは $\langle x\rangle^{-d-1}\le\prod_{j}(1+|x_{j}|)^{-(d+1)/d}$ とフビニ）。
- **選択公理**：使わない。
:::

## シュワルツ空間 {#four:sec-sd-schwartz}

::: definition シュワルツ空間 {#four:schwartz-space keywords="Schwartz space S(R^d): smooth functions with sup |x^alpha d^beta f| finite for all multi-indices; seminorms p_{alpha,beta}; rapidly decreasing functions" index="シュワルツ空間|しゅわるつくうかん, 急減少関数|きゅうげんしょうかんすう"}
$C^{\infty}$ 級関数 $f\colon\mathbb{R}^{d}\to\mathbb{C}$ で、すべての多重指数 $\alpha,\beta$ について
$$
p_{\alpha,\beta}(f)\defeq\sup_{x\in\mathbb{R}^{d}}|x^{\alpha}\partial^{\beta}f(x)|<\infty
$$
となるもの全体を $\mathcal{S}=\mathcal{S}(\mathbb{R}^{d})$ と書き、**シュワルツ空間**（急減少関数の空間）という。$p_{\alpha,\beta}$ は $\mathcal{S}$ 上の半ノルムである。$N\ge0$ について $\|f\|_{(N)}\defeq\max_{|\alpha|,|\beta|\le N}p_{\alpha,\beta}(f)$ とおく。
:::

::: proposition シュワルツ空間の基本性質 {#four:schwartz-basic keywords="S contains Gaussians and compactly supported smooth functions; S is closed under derivatives, multiplication by polynomials, products, and multiplication by smooth functions of polynomial growth with all derivatives; S is contained in every L^p; ||f||_1 is bounded by a seminorm" index="シュワルツ空間の性質|しゅわるつくうかんのせいしつ"}
1. ガウス関数 $G(x)=e^{-\pi|x|^{2}}$ と、台がコンパクトな $C^{\infty}$ 級関数は $\mathcal{S}$ に入る。
2. $f\in\mathcal{S}$ なら $\partial^{\beta}f$, $x^{\alpha}f\in\mathcal{S}$。$f,g\in\mathcal{S}$ なら $fg\in\mathcal{S}$。より一般に、$C^{\infty}$ 級関数 $m$ ですべての導関数が多項式で抑えられる（各 $\gamma$ について $|\partial^{\gamma}m|\le C_{\gamma}\langle x\rangle^{N_{\gamma}}$）ものについて $mf\in\mathcal{S}$。例えば $m=\langle x\rangle^{-2k}$, $m(x)=e^{2\pi ix\cdot\eta}$。
3. $f\in\mathcal{S}$, $1\le p\le\infty$ なら $f\in L^{p}$。とくに $\|f\|_{1}\le C_{d}\|f\|_{(d+1)}$（$C_{d}$ は $d$ だけによる定数）。
:::

::: proof
**1.** $\partial^{\beta}G$ は（帰納法で）多項式 $\times G$ の形で、$|x|^{k}e^{-\pi|x|^{2}}$ は有界（$e^{s}\ge s^{k}/k!$ で $s=\pi|x|^{2}$）。台がコンパクトな連続関数は有界。

**2.** $\partial^{\beta}f$ は定義から。$x^{\alpha}f$ と $mf$ はライプニッツの公式 $\partial^{\beta}(mf)=\sum_{\gamma\le\beta}\binom{\beta}{\gamma}\partial^{\gamma}m\,\partial^{\beta-\gamma}f$ から：各項は $|x^{\alpha}\partial^{\gamma}m\,\partial^{\beta-\gamma}f|\le C_{\gamma}\langle x\rangle^{|\alpha|+N_{\gamma}}|\partial^{\beta-\gamma}f|$ で、$\langle x\rangle^{2k}$ が単項式の一次結合であることから有界。$fg$ は $m=g$（$g\in\mathcal{S}$ の導関数は有界）の場合。$\langle x\rangle^{-2k}$ の導関数は帰納法で（多項式）$/\langle x\rangle^{2k+2j}$ の形で、多項式で抑えられる。

**3.** $\langle x\rangle\le1+|x|\le1+\sum_{j}|x_{j}|$ なので、$(1+\sum_{j}|x_{j}|)^{d+1}$ を多項定理で展開すると、$\langle x\rangle^{d+1}$ は単項 $|x^{\alpha}|$（$|\alpha|\le d+1$）の非負係数の一次結合で抑えられ、係数の和は（$x_{j}=1$ を代入して）$(1+d)^{d+1}$ である。したがって $\langle x\rangle^{d+1}|f(x)|\le(1+d)^{d+1}\|f\|_{(d+1)}$。これと $\int\langle x\rangle^{-d-1}dx<\infty$ から $\|f\|_{1}\le(1+d)^{d+1}\|f\|_{(d+1)}\int\langle x\rangle^{-d-1}dx$。$f$ は有界なので $|f|^{p}\le\|f\|_{\infty}^{p-1}|f|$ から $L^{p}$ にも入る。
:::

::: theorem シュワルツ空間上のフーリエ変換 {#four:schwartz-fourier keywords="the Fourier transform maps S bijectively onto S with inverse the inverse transform; (d^beta f)^ = (2 pi i xi)^beta hat f, (x^alpha f)^ = (-1/(2 pi i))^{|alpha|} d^alpha hat f; seminorm estimate ||hat f||_(N) <= C ||f||_(N+d+1)" index="シュワルツ空間上のフーリエ変換|しゅわるつくうかんじょうのふーりえへんかん"}
$f\in\mathcal{S}$ とする。
1. $\hat f\in\mathcal{S}$ で、$\widehat{\partial^{\beta}f}=(2\pi i\xi)^{\beta}\hat f$、$\partial^{\alpha}\hat f=\widehat{(-2\pi ix)^{\alpha}f}$。
2. 各 $N$ について、$f$ によらない定数 $C_{N}$ があって $\|\hat f\|_{(N)}\le C_{N}\|f\|_{(2N+d+1)}$。
3. $f\mapsto\hat f$ は $\mathcal{S}$ から $\mathcal{S}$ への線形な全単射で、逆写像は $g\mapsto\check g$。
:::

::: proof
**1.** $x^{\alpha}f$ はすべて可積分（\ref{four:schwartz-basic.3}）なので、\ref{four:smoothness-decay.2} の証明から $\hat f$ は $C^{\infty}$ で $\partial^{\alpha}\hat f=\widehat{(-2\pi ix)^{\alpha}f}$。$\partial^{\beta}f$ はすべて $C^{1}$ で可積分なので、\ref{four:differentiation-multiplication.2} を繰り返して $\widehat{\partial^{\beta}f}=(2\pi i\xi)^{\beta}\hat f$。この二つを組み合わせると
$$
\xi^{\beta}\partial^{\alpha}\hat f=(2\pi i)^{-|\beta|}\,\mathcal{F}\bigl(\partial^{\beta}((-2\pi ix)^{\alpha}f)\bigr).
$$
右辺の $\mathcal{F}$ の中身は \ref{four:schwartz-basic.2} から $\mathcal{S}$ の元で可積分なので、\ref{four:transform-basic.1} から右辺は有界。よって $p_{\beta,\alpha}(\hat f)<\infty$。

**2.** 1 の等式と \ref{four:transform-basic.1}, \ref{four:schwartz-basic.3} から
$$
p_{\beta,\alpha}(\hat f)\le(2\pi)^{|\alpha|-|\beta|}\bigl\|\partial^{\beta}(x^{\alpha}f)\bigr\|_{1}\le(2\pi)^{|\alpha|-|\beta|}C_{d}\bigl\|\partial^{\beta}(x^{\alpha}f)\bigr\|_{(d+1)}.
$$
ライプニッツの公式から $\partial^{\beta}(x^{\alpha}f)$ は $x^{\alpha'}\partial^{\beta'}f$（$|\alpha'|\le|\alpha|$, $|\beta'|\le|\beta|$）の一次結合（係数は $\alpha,\beta$ だけで決まる）なので、$\|\partial^{\beta}(x^{\alpha}f)\|_{(d+1)}$ は $\|f\|_{(|\alpha|+|\beta|+d+1)}$ の定数倍で抑えられる。

**3.** $\check g(x)=\hat g(-x)$ なので、1 から $\check{}$ も $\mathcal{S}$ を $\mathcal{S}$ に移す。$f\in\mathcal{S}$ なら $f,\hat f\in L^{1}$ で $f$ は連続なので、\ref{four:inversion-theorem.1} からすべての $x$ で $(\hat f)^{\vee}=f$。同様に（$\check{}$ と $\hat{}$ の役割を入れ替えて）$(\check g)^{\wedge}=g$。
:::

## 緩増加超関数 {#four:sec-sd-tempered}

::: definition 緩増加超関数 {#four:tempered-distribution keywords="tempered distribution: linear functional T on S with |T(phi)| <= C ||phi||_(N) for some C, N; the space S'(R^d)" index="緩増加超関数|かんぞうかちょうかんすう, 超関数|ちょうかんすう"}
線形写像 $T\colon\mathcal{S}\to\mathbb{C}$ で、ある $C\ge0$ と $N\ge0$ について
$$
|T(\varphi)|\le C\|\varphi\|_{(N)}\qquad(\varphi\in\mathcal{S})
$$
を満たすものを**緩増加超関数**といい、その全体を $\mathcal{S}'=\mathcal{S}'(\mathbb{R}^{d})$ と書く。
:::

::: example 緩増加超関数の例 {#four:tempered-examples keywords="functions of polynomial growth (int |f| <x>^{-N} < infinity) define tempered distributions T_f; L^p functions; Dirac delta and its derivatives" index="デルタ関数|でるたかんすう, ディラックのデルタ|でぃらっくのでるた"}
1. 可測関数 $f$ で、ある $M\ge0$ について $\int|f|\langle x\rangle^{-M}dx<\infty$ となるもの（**緩増加な関数**）は $T_{f}(\varphi)\defeq\int f\varphi$ で緩増加超関数を定める。$L^{p}$（$1\le p\le\infty$）の元と、多項式で抑えられる連続関数（多項式・定数を含む）はこの条件を満たす。
2. $a\in\mathbb{R}^{d}$ と多重指数 $\beta$ について $\varphi\mapsto\partial^{\beta}\varphi(a)$ は緩増加超関数。とくに $\delta_{a}(\varphi)\defeq\varphi(a)$、$\delta\defeq\delta_{0}$（**デルタ関数**）。
:::

::: proof
**1.** $M$ を偶数としてよい（大きくしても条件は保たれる）。$\langle x\rangle^{M}$ は単項式の一次結合なので、ある $C$ で $\sup\langle x\rangle^{M}|\varphi|\le C\|\varphi\|_{(M)}$。よって $|T_{f}(\varphi)|\le\int|f|\langle x\rangle^{-M}\cdot\sup\langle x\rangle^{M}|\varphi|\le C'\|\varphi\|_{(M)}$。$f\in L^{p}$ なら、$q$ を共役指数として、$M$ を $\langle x\rangle^{-M}\in L^{q}$ となるように大きくとれば（$Mq>d$、$q=\infty$ なら $M=0$）ヘルダーの不等式から条件が成り立つ。$|f|\le C\langle x\rangle^{k}$ なら $M=k+d+1$。

**2.** $|\partial^{\beta}\varphi(a)|\le p_{0,\beta}(\varphi)\le\|\varphi\|_{(|\beta|)}$。
:::

::: proposition 緩増加な関数は超関数として決まる {#four:distribution-injective keywords="if f is of polynomial growth and int f phi = 0 for all phi in S then f = 0 a.e.; so functions embed into S'" index="超関数としての関数の一意性|ちょうかんすうとしてのかんすうのいちいせい"}
$f$ が緩増加な関数で、すべての $\varphi\in\mathcal{S}$ について $\int f\varphi=0$ なら、$f=0$（a.e.）。
:::

::: proof
$M$ を \ref{four:tempered-examples.1} のとおり偶数にとり、$h\defeq f\langle x\rangle^{-M}\in L^{1}$ とする。$x_{0}\in\mathbb{R}^{d}$, $t>0$ について $\psi(y)\defeq\langle y\rangle^{-M}W_{t}(x_{0}-y)$ は \ref{four:schwartz-basic.2} から $\mathcal{S}$ の元（$W_{t}(x_{0}-\cdot)$ は平行移動したガウス関数で $\mathcal{S}$ に入る）。仮定から $0=\int f\psi=(h*W_{t})(x_{0})$。\ref{four:approximate-identity-rd.1} から $\|h\|_{1}=\lim_{t\to0}\|h*W_{t}-h\|_{1}=0$ で、$h=0$ a.e.、$\langle x\rangle^{-M}>0$ なので $f=0$ a.e.。
:::

この命題から、緩増加な関数 $f$ と超関数 $T_{f}$ を同一視してよい。以下 $T_{f}$ を単に $f$ と書く。

## 超関数の演算とフーリエ変換 {#four:sec-sd-operations}

::: definition 超関数の微分・掛け算・フーリエ変換 {#four:distribution-operations keywords="for T in S': derivative (d^beta T)(phi) = (-1)^{|beta|} T(d^beta phi); multiplication by x^alpha; Fourier transform hat T(phi) = T(hat phi); inverse transform check T(phi) = T(check phi)" index="超関数の微分|ちょうかんすうのびぶん, 超関数のフーリエ変換|ちょうかんすうのふーりえへんかん"}
$T\in\mathcal{S}'$ について、$\varphi\in\mathcal{S}$ に対し
$$
(\partial^{\beta}T)(\varphi)\defeq(-1)^{|\beta|}T(\partial^{\beta}\varphi),\quad(x^{\alpha}T)(\varphi)\defeq T(x^{\alpha}\varphi),\quad\hat T(\varphi)\defeq T(\hat\varphi),\quad\check T(\varphi)\defeq T(\check\varphi)
$$
と定める。これらは $\mathcal{S}'$ の元である：$\|\partial^{\beta}\varphi\|_{(N)}\le\|\varphi\|_{(N+|\beta|)}$、$\|x^{\alpha}\varphi\|_{(N)}\le C\|\varphi\|_{(N+|\alpha|)}$（ライプニッツの公式）、$\|\hat\varphi\|_{(N)}\le C_{N}\|\varphi\|_{(2N+d+1)}$（\ref{four:schwartz-fourier.2}）。
:::

::: theorem 超関数のフーリエ変換 {#four:distribution-fourier keywords="the Fourier transform on S' is a bijection with inverse check; it extends the L^1 and L^2 transforms; (d_j T)^ = 2 pi i xi_j hat T, (x_j T)^ = -(1/(2 pi i)) d_j hat T; hat delta = 1, hat 1 = delta" index="デルタ関数のフーリエ変換|でるたかんすうのふーりえへんかん"}
1. （整合性）$f\in L^{1}$ なら $\widehat{T_{f}}=T_{\hat f}$。$f\in L^{2}$ なら $\widehat{T_{f}}=T_{\mathcal{F}f}$。緩増加な $C^{1}$ 級関数 $f$ で $\partial_{j}f$ も緩増加なら $\partial_{j}T_{f}=T_{\partial_{j}f}$。
2. $T\mapsto\hat T$ は $\mathcal{S}'$ から $\mathcal{S}'$ への全単射で、逆写像は $T\mapsto\check T$。
3. $\widehat{\partial_{j}T}=2\pi i\xi_{j}\hat T$、$\widehat{x_{j}T}=-\frac{1}{2\pi i}\partial_{j}\hat T$。
4. $\hat\delta=1$、$\hat1=\delta$。より一般に $\widehat{\delta_{a}}=e^{-2\pi ia\cdot\xi}$、$\widehat{e^{2\pi ix\cdot\eta}}=\delta_{\eta}$。
:::

::: proof
**1.** $L^{1}$：$\hat\varphi\in L^{1}$ なので \ref{four:multiplication-formula} から $T_{f}(\hat\varphi)=\int f\hat\varphi=\int\hat f\varphi=T_{\hat f}(\varphi)$。$L^{2}$：$f\in L^{1}\cap L^{2}$ なら今示した等式。両辺 $\int f\hat\varphi$, $\int(\mathcal{F}f)\varphi$ は $f$ について $L^{2}$ で連続（コーシー–シュワルツ、$\hat\varphi,\varphi\in L^{2}$、\ref{four:plancherel} の等長性）で、$L^{1}\cap L^{2}$ は $L^{2}$ で稠密なので、すべての $f\in L^{2}$ で成り立つ。微分：$\int\partial_{j}f\,\varphi=-\int f\,\partial_{j}\varphi$ を示せばよい。$f\varphi\in C^{1}$ で、$f\varphi$ と $\partial_{j}(f\varphi)=\partial_{j}f\,\varphi+f\,\partial_{j}\varphi$ は可積分（緩増加 $\times$ 急減少）なので、\ref{four:differentiation-multiplication.2} を $f\varphi$ に $\xi=0$ で使うと $\int\partial_{j}(f\varphi)=0$。

**2.** \ref{four:schwartz-fourier.3} から $\varphi=(\check\varphi)^{\wedge}=(\hat\varphi)^{\vee}$ なので、$(\hat T)^{\vee}(\varphi)=\hat T(\check\varphi)=T((\check\varphi)^{\wedge})=T(\varphi)$。同様に $(\check T)^{\wedge}=T$。

**3.** \ref{four:schwartz-fourier.1} から $\partial_{j}\hat\varphi=\widehat{(-2\pi ix_{j}\varphi)}$ と $x_{j}\hat\varphi=\frac{1}{2\pi i}\widehat{\partial_{j}\varphi}$（変数名を $x$ とした）。よって
$$
\widehat{\partial_{j}T}(\varphi)=-T(\partial_{j}\hat\varphi)=T\bigl(\widehat{2\pi ix_{j}\varphi}\bigr)=\hat T(2\pi ix_{j}\varphi)=(2\pi i\xi_{j}\hat T)(\varphi),
$$
$$
\widehat{x_{j}T}(\varphi)=T(x_{j}\hat\varphi)=\frac{1}{2\pi i}\hat T(\partial_{j}\varphi)=-\frac{1}{2\pi i}(\partial_{j}\hat T)(\varphi).
$$

**4.** $\hat\delta(\varphi)=\hat\varphi(0)=\int\varphi=T_{1}(\varphi)$。$\hat1(\varphi)=\int\hat\varphi=(\hat\varphi)^{\vee}(0)=\varphi(0)$（\ref{four:schwartz-fourier.3}）。$\widehat{\delta_{a}}(\varphi)=\hat\varphi(a)=\int\varphi(x)e^{-2\pi ia\cdot x}dx$。$e^{2\pi ix\cdot\eta}$ については $\int e^{2\pi ix\cdot\eta}\hat\varphi(x)dx=(\hat\varphi)^{\vee}(\eta)=\varphi(\eta)$。
:::

::: example ヘヴィサイド関数と多項式 {#four:distribution-examples keywords="derivative of the Heaviside function is delta; Fourier transform of x is (i/(2 pi)) delta'; Fourier transform of polynomials are derivatives of delta" index="ヘヴィサイド関数|へう゛ぃさいどかんすう"}
$d=1$ とする。
1. $H\defeq\mathbf{1}_{[0,\infty)}$ について $H'=\delta$（超関数の微分）。
2. $\hat x=\frac{i}{2\pi}\delta'$。一般に多項式のフーリエ変換は $\delta$ の導関数の一次結合。
:::

::: proof
**1.** $H'(\varphi)=-\int_{0}^{\infty}\varphi'(x)\,dx=-\bigl(\lim_{R\to\infty}\varphi(R)-\varphi(0)\bigr)=\varphi(0)$。

**2.** \ref{four:distribution-fourier.3} と 4 から $\widehat{x\cdot1}=-\frac{1}{2\pi i}(\hat1)'=-\frac{1}{2\pi i}\delta'=\frac{i}{2\pi}\delta'$。$x^{k}$ も繰り返し使えば $\delta^{(k)}$ の定数倍。
:::

::: hypcheck
- 緩増加超関数の定義は、$\mathcal{S}$ の位相（半ノルム族 $p_{\alpha,\beta}$ が定める局所凸位相）についての連続性と同値である。ここでは位相を導入せず、評価式そのものを定義にした。
- \ref{four:distribution-injective} で使ったのは、$h*W_{t}\to h$（$L^{1}$）だけで、反転公式は使っていない。
- \ref{four:distribution-fourier.1} の微分の整合性で、「$f$ も $\partial_{j}f$ も緩増加」の仮定は $f\varphi$, $\partial_{j}(f\varphi)$ の可積分性に使った。境界項が消えることは \ref{four:differentiation-multiplication} の Step 1 から自動的に出る。
- 緩増加でない関数（例えば $e^{x}$, $d=1$）は $T_{f}$ を定めない：$\varphi(x)=e^{-\sqrt{1+x^{2}}}$ は $\mathcal{S}$ の元だが $\int e^{x}\varphi=\infty$。これが「緩増加」の名の由来である。
:::

::: supplement
**関連する結果.**
- $C_{c}^{\infty}$ は $\mathcal{S}$ で（半ノルムについて）稠密で、$\mathcal{S}'$ はより広い超関数の空間 $\mathcal{D}'$（$C_{c}^{\infty}$ 上の連続線形汎関数）の部分空間になる。
- 偏微分方程式への応用：定数係数の微分作用素 $P(\partial)$ はフーリエ変換で掛け算 $P(2\pi i\xi)$ になる。例えば $-\Delta+1$ の基本解（$(-\Delta+1)E=\delta$ の解）は $\hat E=(4\pi^{2}|\xi|^{2}+1)^{-1}$ で与えられる（$d=1$ では $E(x)=\frac12e^{-|x|}$ で、\ref{four:transform-examples.2} から確かめられる）。
- シュワルツの核定理、構造定理（緩増加超関数は、緩増加な連続関数の有限階の導関数の和）などがあるが、このサイトではまだ証明していない。

**高い視点：双対とスペクトルの延長.** $\mathcal{S}\subset L^{2}\subset\mathcal{S}'$ という三つ組（ゲルファントの三つ組）で、フーリエ変換は三つすべての上の同型であり、互いに整合する。$L^{2}$ では $e^{2\pi ix\cdot\xi}$ は固有ベクトルになれなかったが（2 乗可積分でない）、$\mathcal{S}'$ に広げると、$e^{2\pi ix\cdot\eta}$ は $\widehat{e_{\eta}}=\delta_{\eta}$ という形で「一点に集中したスペクトル」をもつ一般化固有ベクトルになる。線形代数の比喩で言えば、$\mathcal{S}$ は「よすぎる」ベクトルの空間、$\mathcal{S}'$ はその双対で「悪すぎる」ベクトルまで許す空間であり、フーリエ変換が微分と掛け算を入れ替える対称性を、どちらの側でも壊さずに保つ。
:::

## 問題 {#four:sec-sd-problems}

::: problem {#four:prob-sd-sign}
$d=1$ とし、$\operatorname{sgn}(x)\defeq\mathbf{1}_{(0,\infty)}(x)-\mathbf{1}_{(-\infty,0)}(x)$ とする。$\operatorname{sgn}'=2\delta$ と、$x\cdot\operatorname{sgn}=|x|$（超関数として）を示せ。
:::

::: solution
$\operatorname{sgn}'(\varphi)=-\int_{0}^{\infty}\varphi'+\int_{-\infty}^{0}\varphi'=\varphi(0)+\varphi(0)=2\varphi(0)$（$\varphi(\pm\infty)=0$）。$(x\operatorname{sgn})(\varphi)=\operatorname{sgn}(x\varphi)=\int x\operatorname{sgn}(x)\varphi(x)\,dx=\int|x|\varphi(x)\,dx$。
:::

::: problem {#four:prob-sd-delta-comb}
$d=1$ とする。$\sum_{n\in\mathbb{Z}}\delta_{n}$（$\varphi\mapsto\sum_{n}\varphi(n)$）が緩増加超関数であることを示せ。
:::

::: solution
$|\varphi(n)|\le(1+n^{2})^{-1}\sup_{x}(1+x^{2})|\varphi(x)|\le(1+n^{2})^{-1}\bigl(p_{0,0}(\varphi)+p_{2,0}(\varphi)\bigr)$ なので、$|\sum_{n}\varphi(n)|\le\Bigl(\sum_{n}\frac{1}{1+n^{2}}\Bigr)\cdot2\|\varphi\|_{(2)}$。級数は絶対収束し、線形性も明らか。（このフーリエ変換が自分自身であることがポアソン和公式で、次のページで示す。）
:::
