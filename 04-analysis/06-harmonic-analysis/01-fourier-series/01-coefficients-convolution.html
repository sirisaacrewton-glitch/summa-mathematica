# フーリエ係数と畳み込み {#four:page-coefficients-convolution keywords="circle group T = R/Z, periodic functions, L^p(T), translation invariance and continuity of translations, Fourier coefficients, Riemann-Lebesgue lemma, coefficients of derivatives, convolution on the circle, Young's inequality ||f*g||_p <= ||f||_p ||g||_1, Fourier coefficients of a convolution, approximate identities (good kernels), uniform and L^p convergence of K_N * f"}

周期 $1$ の関数 $f$ を $e^{2\pi inx}$（$n\in\mathbb{Z}$）の重ね合わせ $\sum_{n}\hat f(n)e^{2\pi inx}$ で表すのがフーリエ級数である。このページでは、その係数 $\hat f(n)$（**フーリエ係数**）を可積分関数について定義し、$|n|\to\infty$ で $0$ に近づくこと（**リーマン–ルベーグの補題**）を示す。フーリエ級数の部分和や平均は、いずれも $f$ とある関数（核）の**畳み込み**として書ける。そこで、畳み込みの基本的な評価と、「質量が $0$ に集中していく」核の列（**総和核**）との畳み込みが $f$ に収束することを示す。これが次のページ以降の収束定理の共通の土台になる。

## 記法と定義の確認 {#four:sec-cc-notation}

::: notation
- $\mathbb{T}\defeq\mathbb{R}/\mathbb{Z}$。$\mathbb{T}$ 上の関数は周期 $1$ の関数 $\mathbb{R}\to\mathbb{C}$ と同一視する。$\int_{\mathbb{T}}f\defeq\int_{[0,1)}f\,d\lambda$、$L^{p}(\mathbb{T})$ はこの積分についての $L^{p}$ 空間（\ref{meas:lp-space}）。$\|f\|_{p}$ もこの積分で測る。
- $|x|_{\mathbb{T}}$ は $x$ から最も近い整数までの距離。$\int_{|y|_{\mathbb{T}}<\delta}$ などは $[-\frac12,\frac12)$ の上で考える。
- $e_{n}(x)\defeq e^{2\pi inx}$。$\int_{\mathbb{T}}e_{n}\overline{e_{m}}=\delta_{nm}$。
- ヘルダーの不等式・トネリ/フビニ・優収束定理・ボレル版・平行移動の連続性は \ref{meas:holder}, \ref{meas:tonelli}, \ref{meas:fubini}, \ref{meas:dominated-convergence}, \ref{meas:borel-version}, \ref{meas:translation-continuity}。
- **選択公理**：使わない（可算選択公理を含む測度論の結果を除く）。
:::

## 円周上の積分 {#four:sec-cc-circle}

::: lemma 円周上の平行移動 {#four:circle-translation keywords="integrals over the circle are translation invariant: int_T f(x+a) dx = int_T f; translation is continuous in L^p(T) for p < infinity" index="円周上の平行移動|えんしゅうじょうのへいこういどう"}
$f\in L^{1}(\mathbb{T})$, $a\in\mathbb{R}$ とする。
1. $\int_{\mathbb{T}}f(x+a)\,dx=\int_{\mathbb{T}}f$。積分を $[c,c+1)$ の上でとっても同じ値。
2. $1\le p<\infty$, $f\in L^{p}(\mathbb{T})$ なら $\|f(\cdot+h)-f\|_{p}\to0$（$h\to0$）。
:::

::: proof
**1.** 周期性から $a\in[0,1)$ としてよい。$\int_{[0,1)}f(x+a)\,dx=\int_{[a,1+a)}f$（\ref{meas:translation-continuity.1}、平行移動不変性）で、$[a,1)$ と $[1,1+a)$ に分けて後者を周期性で $[0,a)$ に移すと $\int_{[0,1)}f$。$[c,c+1)$ も同様。

**2.** $F\defeq f\mathbf{1}_{[-1,2)}\in L^{p}(\mathbb{R})$ とすると、$|h|<1$ で $x\in[0,1)$ なら $x+h\in[-1,2)$ なので $\int_{[0,1)}|f(x+h)-f(x)|^{p}dx\le\int_{\mathbb{R}}|F(x+h)-F(x)|^{p}dx\to0$（\ref{meas:translation-continuity.2}）。
:::

## フーリエ係数 {#four:sec-cc-coefficients}

::: definition フーリエ係数とフーリエ級数 {#four:fourier-coefficients keywords="Fourier coefficients hat f(n) = int_T f(x) e^{-2 pi i n x} dx of f in L^1(T); Fourier series; partial sums S_N f; trigonometric polynomials" index="フーリエ係数|ふーりえけいすう, フーリエ級数|ふーりえきゅうすう, 三角多項式|さんかくたこうしき"}
$f\in L^{1}(\mathbb{T})$ と $n\in\mathbb{Z}$ について
$$
\hat f(n)\defeq\int_{\mathbb{T}}f(x)e^{-2\pi inx}\,dx
$$
を**フーリエ係数**、形式的な級数 $\sum_{n\in\mathbb{Z}}\hat f(n)e_{n}$ を**フーリエ級数**、$S_{N}f\defeq\sum_{|n|\le N}\hat f(n)e_{n}$ を**部分和**という。有限和 $\sum_{|n|\le N}c_{n}e_{n}$ を**三角多項式**という。
:::

::: proposition フーリエ係数の基本性質 {#four:coefficients-basic keywords="|hat f(n)| <= ||f||_1; linearity; translation multiplies coefficients by e^{2 pi i n a}; coefficients of trigonometric polynomials; derivative: (f')^(n) = 2 pi i n hat f(n) for C^1 functions" index="フーリエ係数の性質|ふーりえけいすうのせいしつ"}
$f\in L^{1}(\mathbb{T})$ とする。
1. $|\hat f(n)|\le\|f\|_{1}$。$f\mapsto\hat f(n)$ は線形。
2. $f_{a}(x)\defeq f(x-a)$ なら $\widehat{f_{a}}(n)=e^{-2\pi ina}\hat f(n)$。
3. 三角多項式 $p=\sum c_{n}e_{n}$ なら $\hat p(n)=c_{n}$。
4. $f$ が $C^{1}$ 級（周期 $1$）なら $\widehat{f'}(n)=2\pi in\hat f(n)$。
:::

::: proof
**1.** $|e^{-2\pi inx}|=1$ と積分の三角不等式（\ref{meas:integral-linearity.3}）。**2.** \ref{four:circle-translation.1} で $x\mapsto x+a$。**3.** $\int e_{m}\overline{e_{n}}=\delta_{mn}$。**4.** 部分積分：$\int_{0}^{1}f'(x)e^{-2\pi inx}dx=[f(x)e^{-2\pi inx}]_{0}^{1}+2\pi in\int_{0}^{1}f(x)e^{-2\pi inx}dx$ で、周期性から境界項は $0$。
:::

::: theorem リーマン–ルベーグの補題 {#four:riemann-lebesgue keywords="Riemann-Lebesgue lemma: Fourier coefficients of an integrable function on the circle tend to zero" index="リーマン–ルベーグの補題|りーまんるべーぐのほだい"}
$f\in L^{1}(\mathbb{T})$ なら $\hat f(n)\to0$（$|n|\to\infty$）。
:::

::: proof
$n\ne0$ とし $h\defeq\frac{1}{2n}$ とおく。$e^{-2\pi inh}=e^{-\pi i}=-1$ であることに注意する。\ref{four:circle-translation.1} を $x\mapsto x+h$ に使うと
$$
\hat f(n)=\int_{\mathbb{T}}f(x+h)e^{-2\pi in(x+h)}dx=e^{-2\pi inh}\int_{\mathbb{T}}f(x+h)e^{-2\pi inx}dx=-\int_{\mathbb{T}}f(x+h)e^{-2\pi inx}dx.
$$
これを定義式 $\hat f(n)=\int f(x)e^{-2\pi inx}dx$ と足して 2 で割ると
$$
\hat f(n)=\frac12\int_{\mathbb{T}}\bigl(f(x)-f(x+h)\bigr)e^{-2\pi inx}dx,\qquad|\hat f(n)|\le\frac12\|f-f(\cdot+h)\|_{1}.
$$
$|n|\to\infty$ で $h\to0$ なので、\ref{four:circle-translation.2} から $0$ に収束する。
:::

## 畳み込み {#four:sec-cc-convolution}

::: theorem 円周上の畳み込み {#four:convolution keywords="convolution on the circle (f*g)(x) = int f(x-y) g(y) dy for f in L^p and g in L^1: defined a.e., ||f*g||_p <= ||f||_p ||g||_1, commutative, (f*g)^ = hat f hat g" index="畳み込み（円周）|たたみこみえんしゅう"}
$1\le p\le\infty$, $f\in L^{p}(\mathbb{T})$, $g\in L^{1}(\mathbb{T})$ とする。
1. ほとんどすべての $x$ で $(f*g)(x)\defeq\int_{\mathbb{T}}f(x-y)g(y)\,dy$ は絶対収束し、$f*g\in L^{p}(\mathbb{T})$、$\|f*g\|_{p}\le\|f\|_{p}\|g\|_{1}$。
2. $f,g\in L^{1}$ なら $f*g=g*f$、$\widehat{f*g}(n)=\hat f(n)\hat g(n)$。
3. $f\in L^{\infty}$ なら $f*g$ は連続。
:::

::: proof
**Step 0（可測性）.** $f$ のボレル版（\ref{meas:borel-version}、周期的に延ばす）をとれば $(x,y)\mapsto f(x-y)g(y)$ は $[0,1)^{2}$ 上可測で、元の $f$ との違いは零集合 $\{(x,y):x-y\in N\}$（トネリで測度 $0$）の上だけ。

**Step 1（$p<\infty$）.** $p=1$ なら、トネリと \ref{four:circle-translation.1} から $\iint|f(x-y)||g(y)|\,dx\,dy=\|f\|_{1}\|g\|_{1}$。よって a.e. の $x$ で絶対収束し、$\|f*g\|_{1}\le\|f\|_{1}\|g\|_{1}$。$1<p<\infty$ なら、$q$ を共役指数として、$|g|=|g|^{1/p}|g|^{1/q}$ とヘルダーの不等式から
$$
\int|f(x-y)||g(y)|\,dy\le\Bigl(\int|f(x-y)|^{p}|g(y)|\,dy\Bigr)^{1/p}\|g\|_{1}^{1/q}.
$$
$p$ 乗して $x$ で積分し、トネリと平行移動不変性を使うと $\|f*g\|_{p}^{p}\le\|g\|_{1}^{p/q}\|f\|_{p}^{p}\|g\|_{1}$、すなわち $\|f*g\|_{p}\le\|f\|_{p}\|g\|_{1}$（$p/q+1=p$）。$p=\infty$ は $|f(x-y)|\le\|f\|_{\infty}$（a.e. $y$）から。

**Step 2（2）.** 可換性は $y\mapsto x-y$ の置き換え（周期性と、$y\mapsto-y$ による $\lambda$ の不変性）。係数：フビニ（Step 1 で絶対可積分）から
$$
\widehat{f*g}(n)=\iint f(x-y)g(y)e^{-2\pi in(x-y)}e^{-2\pi iny}\,dy\,dx=\int g(y)e^{-2\pi iny}\Bigl(\int f(x-y)e^{-2\pi in(x-y)}dx\Bigr)dy=\hat f(n)\hat g(n).
$$

**Step 3（3）.** $|(f*g)(x+h)-(f*g)(x)|=|\int f(y)(g(x+h-y)-g(x-y))\,dy|\le\|f\|_{\infty}\|g(\cdot+h)-g\|_{1}\to0$（可換性で役割を入れ替え、\ref{four:circle-translation.2}）。
:::

## 総和核 {#four:sec-cc-kernels}

::: definition 総和核 {#four:approximate-identity keywords="approximate identity (good kernels, summability kernel) on the circle: integral 1, uniformly bounded L^1 norms, mass concentrating at 0" index="総和核|そうわかく, 近似単位元|きんじたんいげん"}
$K_{N}\in L^{1}(\mathbb{T})$（$N=1,2,\dots$）が次を満たすとき**総和核**（近似単位元）という。
1. $\int_{\mathbb{T}}K_{N}=1$。
2. $\sup_{N}\|K_{N}\|_{1}<\infty$。
3. 任意の $0<\delta<\frac12$ について $\int_{\delta\le|y|_{\mathbb{T}}}|K_{N}(y)|\,dy\to0$（$N\to\infty$）。
:::

::: theorem 総和核による収束 {#four:approximate-identity-convergence keywords="for an approximate identity, K_N * f -> f uniformly for continuous f and in L^p for f in L^p, 1 <= p < infinity" index="総和核による収束|そうわかくによるしゅうそく"}
$(K_{N})$ を総和核とする。
1. $f$ が連続（周期 $1$）なら $K_{N}*f\to f$（一様収束）。
2. $1\le p<\infty$, $f\in L^{p}(\mathbb{T})$ なら $\|K_{N}*f-f\|_{p}\to0$。
:::

::: proof
$\Delta_{y}f(x)\defeq f(x-y)-f(x)$、$C\defeq\sup\|K_{N}\|_{1}$ とおく。条件 1 と可換性から
$$
(K_{N}*f)(x)-f(x)=\int_{\mathbb{T}}K_{N}(y)\,\Delta_{y}f(x)\,dy.
$$

**1.** $f$ は一様連続で有界：$\varepsilon>0$ について $\delta$ を $|y|_{\mathbb{T}}<\delta\Rightarrow|\Delta_{y}f(x)|<\varepsilon$（すべての $x$）となるようにとる。$\sup_{x}|(K_{N}*f)(x)-f(x)|\le C\varepsilon+2\|f\|_{\infty}\int_{\delta\le|y|_{\mathbb{T}}}|K_{N}|$ で、第 2 項は $N\to\infty$ で $0$。

**2.** \ref{four:convolution} の Step 1 と同じくヘルダーの不等式を測度 $|K_{N}(y)|dy$ について使い、$x$ で積分してトネリを使うと
$$
\|K_{N}*f-f\|_{p}^{p}\le C^{p/q}\int_{\mathbb{T}}|K_{N}(y)|\,\|\Delta_{y}f\|_{p}^{p}\,dy
$$
（$p=1$ では $C^{p/q}$ の因子なしで同じ）。\ref{four:circle-translation.2} から $\delta$ を $|y|_{\mathbb{T}}<\delta\Rightarrow\|\Delta_{y}f\|_{p}<\varepsilon$ となるようにとり、それ以外では $\|\Delta_{y}f\|_{p}\le2\|f\|_{p}$。右辺は $\le C^{p/q}(C\varepsilon^{p}+2^{p}\|f\|_{p}^{p}\int_{\delta\le|y|_{\mathbb{T}}}|K_{N}|)$ で、$N\to\infty$ の後 $\varepsilon\to0$。

::: hypcheck
- 条件 2（$L^{1}$ ノルムの一様有界性）は、核が符号を変えるときに本質的：非負の核なら 1 から自動。ディリクレ核 $D_{N}$（部分和の核）は 1・3 の一部を満たすが 2 を満たさず（\ref{fa:fourier-divergence} の Step 2）、総和核でない。これが部分和の収束が一般には成り立たない理由である。
- 2 で $p<\infty$ を使ったのは平行移動の連続性。$L^{\infty}$ では偽（不連続な $f$ に対して一様収束はしない）。
:::
:::

::: supplement
**高い視点：畳み込み代数.** $L^{1}(\mathbb{T})$ は畳み込みを積とするバナッハ環（単位元はない）で、フーリエ係数をとる写像 $f\mapsto\hat f$ はこの環から数列の環（各点ごとの積）への準同型であり、リーマン–ルベーグの補題からその像は $c_{0}(\mathbb{Z})$ に入る。$n\mapsto\hat f(n)$ は $L^{1}(\mathbb{T})$ の指標 $f\mapsto\hat f(n)$ による値で、ゲルファント理論（\ref{fa:page-spectrum} の補足）の言葉では、$\mathbb{Z}$ は $\mathbb{T}$ の双対群である。単位元がない代わりに、総和核が「近似的な単位元」として働く。比喩で言えば、畳み込みは「重み $g$ で $f$ をぼかす」操作で、総和核はぼかしの幅がだんだん狭くなる一連のレンズであり、レンズの総量が有限に抑えられている限り、ぼかした像は元の像に戻っていく。
:::

## 問題 {#four:sec-cc-problems}

::: problem {#four:prob-cc-sawtooth}
$[0,1)$ 上で $f(x)\defeq x$ とし周期 $1$ に延ばす。$\hat f(0)=\frac12$、$n\ne0$ で $\hat f(n)=\frac{i}{2\pi n}$ を示せ。
:::

::: solution
$\hat f(0)=\int_{0}^{1}x\,dx=\frac12$。$n\ne0$ なら部分積分で
$$
\int_{0}^{1}xe^{-2\pi inx}dx=\Bigl[\frac{xe^{-2\pi inx}}{-2\pi in}\Bigr]_{0}^{1}+\frac{1}{2\pi in}\int_{0}^{1}e^{-2\pi inx}dx=\frac{1}{-2\pi in}+0=\frac{i}{2\pi n}.
$$
:::

::: problem {#four:prob-cc-smoothness}
$f$ が $C^{k}$ 級（周期 $1$、$k\ge1$）なら $|n|^{k}\hat f(n)\to0$ を示し、$C^{2}$ 級なら $\sum_{n}|\hat f(n)|<\infty$ を導け。
:::

::: solution
\ref{four:coefficients-basic.4} を $k$ 回使うと $\widehat{f^{(k)}}(n)=(2\pi in)^{k}\hat f(n)$。$f^{(k)}$ は連続で可積分なので、\ref{four:riemann-lebesgue} から左辺 $\to0$。$k=2$ なら $|\hat f(n)|\le\frac{\|f''\|_{1}}{4\pi^{2}n^{2}}$（$n\ne0$、\ref{four:coefficients-basic.1}）で、$\sum1/n^{2}<\infty$ から絶対収束。
:::
