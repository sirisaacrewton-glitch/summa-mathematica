# フーリエ級数（Fourier Series）

円周上のフーリエ係数とリーマン–ルベーグの補題、畳み込みと総和核、フェイェールの定理と一意性、三角関数系の完全性とパーセヴァルの等式、各点収束（ディニの判定法・ディリクレ–ジョルダン）とギブス現象、ζ(2)・一様分布・熱方程式・等周不等式への応用。

<p class="mn-msc">MSC2020: 42A05, 42A16, 42A20, 42A24, 42A38</p>
