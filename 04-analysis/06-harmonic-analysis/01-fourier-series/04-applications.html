# フーリエ級数の応用 {#four:page-applications keywords="applications of Fourier series: Weyl's equidistribution criterion, equidistribution of n alpha mod 1 for irrational alpha, heat equation on the circle, heat kernel, smoothing, uniqueness of classical solutions, Hurwitz's proof of the isoperimetric inequality, zeta(4)"}

このページでは、ここまでのフーリエ級数の理論（三角多項式の稠密性 \ref{four:trigonometric-density}、一意性定理 \ref{four:uniqueness}、パーセヴァルの等式 \ref{four:l2-theory}）の三つの応用を述べる。一つ目は数列が $[0,1)$ に「均等に散らばる」ことを指数和で判定する**ワイルの判定法**で、$\alpha$ が無理数なら $n\alpha$ の小数部分が一様分布することが従う。二つ目は円周上の**熱方程式**で、フーリエ係数ごとに方程式が独立な常微分方程式に分かれる。三つ目は、長さ $L$ の閉曲線が囲む面積は $\frac{L^{2}}{4\pi}$ 以下であるという**等周不等式**の、フルヴィッツによる証明である。

## 記法と定義の確認 {#four:sec-ap-notation}

::: notation
- $\mathbb{T}$, $e_{n}$, $\hat f(n)$, $S_{N}f$, $L^{p}(\mathbb{T})$, $C(\mathbb{T})$ は \ref{four:page-coefficients-convolution}, \ref{four:page-fejer} のとおり。
- 実数 $x$ の小数部分を $\{x\}\defeq x-\lfloor x\rfloor\in[0,1)$ と書く。$e_{k}(x)=e_{k}(\{x\})$（周期性）。
- 一様収束の基本定理と項別微分は \ref{calc:uniform-limit-theorems}, \ref{calc:uniform-derivative}。
- **選択公理**：使わない。
:::

## ワイルの一様分布定理 {#four:sec-ap-weyl}

::: definition 一様分布 {#four:equidistribution keywords="a sequence of reals is equidistributed modulo 1 if the proportion of fractional parts in each interval [a,b) tends to b - a" index="一様分布（mod 1）|いちようぶんぷもっど1"}
実数列 $(x_{n})_{n\ge1}$ が **mod 1 で一様分布する**とは、$0\le a<b\le1$ となるすべての $a,b$ について
$$
\frac{1}{N}\#\{1\le n\le N:\{x_{n}\}\in[a,b)\}\to b-a\qquad(N\to\infty)
$$
となることをいう。
:::

::: theorem ワイルの判定法 {#four:weyl-criterion keywords="Weyl's criterion: (x_n) is equidistributed mod 1 iff (1/N) sum_{n<=N} e^{2 pi i k x_n} -> 0 for every nonzero integer k, iff (1/N) sum f(x_n) -> int_T f for every continuous periodic f" index="ワイルの判定法|わいるのはんていほう"}
実数列 $(x_{n})$ と $\mu_{N}(f)\defeq\frac1N\sum_{n=1}^{N}f(x_{n})$（$f$ は周期 $1$ の関数）について、次は同値。
1. $(x_{n})$ は mod 1 で一様分布する。
2. すべての $f\in C(\mathbb{T})$ について $\mu_{N}(f)\to\int_{\mathbb{T}}f$。
3. すべての整数 $k\ne0$ について $\frac1N\sum_{n=1}^{N}e^{2\pi ikx_{n}}\to0$。
:::

::: proof
$\mu_{N}$ は線形で、$|\mu_{N}(f)|\le\|f\|_{\infty}$ を満たす。

**1 ⇒ 2.** 1 は、区間 $[a,b)\subset[0,1)$ の指示関数を周期 $1$ に延ばした $\chi$ について $\mu_{N}(\chi)\to\int\chi$ という意味である。線形性から、そのような指示関数の有限一次結合（階段関数）$s$ について $\mu_{N}(s)\to\int s$。$f\in C(\mathbb{T})$ は $[0,1]$ 上一様連続なので、$\varepsilon>0$ について $[0,1)$ を十分細かい区間に分け、各区間で左端の値をとる階段関数 $s$ を作れば $\|f-s\|_{\infty}\le\varepsilon$。すると
$$
|\mu_{N}(f)-\textstyle\int f|\le|\mu_{N}(f-s)|+|\mu_{N}(s)-\int s|+|\int(s-f)|\le2\varepsilon+|\mu_{N}(s)-\int s|
$$
で、$\limsup\le2\varepsilon$。

**2 ⇒ 3.** $f=e_{k}$ とすればよい（$\int_{\mathbb{T}}e_{k}=0$）。

**3 ⇒ 2.** 3 と $\mu_{N}(e_{0})=1=\int e_{0}$ から、三角多項式 $p$ について $\mu_{N}(p)\to\int p$。$f\in C(\mathbb{T})$ と $\varepsilon>0$ について、\ref{four:trigonometric-density} から $\|f-p\|_{\infty}\le\varepsilon$ となる三角多項式 $p$ をとれば、1 ⇒ 2 と同じ評価で $\limsup|\mu_{N}(f)-\int f|\le2\varepsilon$。

**2 ⇒ 1.** $0\le a<b\le1$ とし、$\chi$ を $[a,b)$ の指示関数の周期的延長とする。$\varepsilon>0$ について、周期 $1$ の連続関数 $g^{-}\le\chi\le g^{+}$ で $\int(g^{+}-g^{-})\le4\varepsilon$ となるものを作る：$g^{+}$ は $[a,b]$ 上 $1$、$[a-\varepsilon,b+\varepsilon]$ の外（を周期的に延ばした集合）で $0$、その間は 1 次関数でつなぎ、値を $\le1$ に切り詰めたもの（$b-a+2\varepsilon\ge1$ なら $g^{+}\equiv1$）。$g^{-}$ は、$b-a>2\varepsilon$ なら $[a+\varepsilon,b-\varepsilon]$ 上 $1$、$(a,b)$ の外で $0$、間は 1 次関数のもの、そうでなければ $g^{-}\equiv0$。どちらの場合も $\int g^{+}\le b-a+2\varepsilon$, $\int g^{-}\ge b-a-2\varepsilon$。$\mu_{N}$ は単調（$f\le g$ なら $\mu_{N}(f)\le\mu_{N}(g)$）なので
$$
\int g^{-}\leftarrow\mu_{N}(g^{-})\le\mu_{N}(\chi)\le\mu_{N}(g^{+})\to\int g^{+}
$$
から $b-a-2\varepsilon\le\liminf\mu_{N}(\chi)\le\limsup\mu_{N}(\chi)\le b-a+2\varepsilon$。
:::

::: corollary ワイルの一様分布定理 {#four:weyl-equidistribution keywords="if alpha is irrational, the sequence n alpha is equidistributed mod 1; if alpha is rational it is not" index="ワイルの一様分布定理|わいるのいちようぶんぷていり"}
$\alpha\in\mathbb{R}$ とする。$\alpha$ が無理数なら $(n\alpha)_{n\ge1}$ は mod 1 で一様分布する。$\alpha$ が有理数なら一様分布しない。
:::

::: proof
**無理数.** $k\ne0$ なら $k\alpha\notin\mathbb{Z}$ なので $z\defeq e^{2\pi ik\alpha}\ne1$。等比数列の和から
$$
\Bigl|\frac1N\sum_{n=1}^{N}z^{n}\Bigr|=\frac1N\Bigl|\frac{z(1-z^{N})}{1-z}\Bigr|\le\frac{2}{N|1-z|}\to0.
$$
\ref{four:weyl-criterion}（3 ⇒ 1）から一様分布する。

**有理数.** $\alpha=\frac pq$（$q\ge1$）なら $\{n\alpha\}$ は $\{0,\frac1q,\dots,\frac{q-1}{q}\}$ の値しかとらないので、区間 $[0,\frac1{2q})$ に入る割合は、$0$ をとる $n$（$q$ の倍数）の割合 $\frac1q$ に近づき（$N$ 以下の $q$ の倍数は $\lfloor N/q\rfloor$ 個）、長さ $\frac{1}{2q}$ と一致しない。
:::

## 円周上の熱方程式 {#four:sec-ap-heat}

::: theorem 円周上の熱方程式 {#four:heat-equation keywords="heat equation u_t = u_xx on the circle with initial data f in L^2(T): the solution u(t,x) = sum hat f(n) e^{-4 pi^2 n^2 t} e_n(x) is smooth for t > 0, u(t,.) -> f in L^2 as t -> 0, uniformly if sum |hat f(n)| < infinity; uniqueness of classical solutions" index="熱方程式（円周）|ねつほうていしきえんしゅう, 熱核|ねつかく"}
$f\in L^{2}(\mathbb{T})$ とし、$t>0$, $x\in\mathbb{R}$ について
$$
u(t,x)\defeq\sum_{n\in\mathbb{Z}}\hat f(n)e^{-4\pi^{2}n^{2}t}e_{n}(x)
$$
とおく。
1. 右辺は $t\ge t_{0}>0$ で（すべての偏導関数を項別にとったものも含めて）一様絶対収束し、$u$ は $(0,\infty)\times\mathbb{R}$ 上 $C^{\infty}$ 級、$x$ について周期 $1$ で、$\partial_{t}u=\partial_{x}^{2}u$ を満たす。
2. $t\downarrow0$ で $\|u(t,\cdot)-f\|_{2}\to0$。$\sum_{n}|\hat f(n)|<\infty$ なら（例えば $f$ が $C^{1}$ 級なら）$u(t,\cdot)\to f$ は一様収束。
3. （一意性）$v\colon[0,\infty)\times\mathbb{R}\to\mathbb{C}$ が連続で $x$ について周期 $1$、$(0,\infty)\times\mathbb{R}$ 上で $\partial_{t}v$, $\partial_{x}^{2}v$ が存在して連続、$\partial_{t}v=\partial_{x}^{2}v$、$v(0,\cdot)=f$ を満たすなら、$t>0$ で $v(t,\cdot)=u(t,\cdot)$。
:::

::: proof
**Step 1（収束と微分）.** $|\hat f(n)|\le\|f\|_{1}\le\|f\|_{2}$（\ref{four:coefficients-basic.1}、コーシー–シュワルツ）。$j,k\ge0$ について、第 $n$ 項を $t$ で $j$ 回、$x$ で $k$ 回微分したものの絶対値は、$t\ge t_{0}$ で
$$
\|f\|_{2}(4\pi^{2}n^{2})^{j}(2\pi|n|)^{k}e^{-4\pi^{2}n^{2}t_{0}}
$$
以下で、これは $n$ について和をとって有限（$|n|^{m}e^{-cn^{2}}\le C_{m}e^{-cn^{2}/2}$ と、$e^{-cn^{2}/2}\le e^{-c|n|/2}$ の等比級数）。よって項別微分したすべての級数が $[t_{0},\infty)\times\mathbb{R}$ で一様収束し、\ref{calc:uniform-derivative} を各変数について繰り返し使えば、$u$ は $C^{\infty}$ 級で偏導関数は項別にとれる。各項 $e^{-4\pi^{2}n^{2}t}e_{n}(x)$ は $\partial_{t}=-4\pi^{2}n^{2}=\partial_{x}^{2}$ を満たすので、$u$ も熱方程式を満たす。

**Step 2（$L^{2}$ 収束）.** 1 の級数は $L^{2}$ でも収束し、$u(t,\cdot)$ のフーリエ係数は $\hat f(n)e^{-4\pi^{2}n^{2}t}$。パーセヴァルの等式（\ref{four:l2-theory.2}）から
$$
\|u(t,\cdot)-f\|_{2}^{2}=\sum_{n}|\hat f(n)|^{2}\bigl(1-e^{-4\pi^{2}n^{2}t}\bigr)^{2}.
$$
各項は $t\downarrow0$ で $0$ に収束し、$|\hat f(n)|^{2}$ で抑えられ、$\sum|\hat f(n)|^{2}<\infty$。数え上げ測度についての優収束定理（\ref{meas:dominated-convergence}）から右辺は $0$ に収束する。

**Step 3（一様収束）.** $\sum|\hat f(n)|<\infty$ なら、\ref{four:absolutely-convergent} から $f$ は（a.e. で）連続関数 $\sum\hat f(n)e_{n}$ に等しく、$\sup_{x}|u(t,x)-f(x)|\le\sum|\hat f(n)|(1-e^{-4\pi^{2}n^{2}t})$ で、Step 2 と同じく優収束定理から $0$ に収束する。$C^{1}$ 級なら $\sum|\hat f(n)|<\infty$（\ref{four:prob-fj-c1}）。

**Step 4（一意性）.** $c_{n}(t)\defeq\int_{\mathbb{T}}v(t,x)e^{-2\pi inx}dx$ とおく。$v$ は $[0,1]\times[0,T]$ 上一様連続なので、$c_{n}$ は $[0,\infty)$ 上連続で $c_{n}(0)=\hat f(n)$。$t>0$ では、$\partial_{t}v$ が $[t_{1},t_{2}]\times[0,1]$（$0<t_{1}<t_{2}$）上で連続（よって有界）なので、積分記号下の微分（平均値の定理と優収束定理）から $c_{n}'(t)=\int\partial_{t}v\,e^{-2\pi inx}dx=\int\partial_{x}^{2}v\,e^{-2\pi inx}dx$。$x$ について 2 回部分積分すると（周期性から境界項は消える）$c_{n}'(t)=-4\pi^{2}n^{2}c_{n}(t)$。よって $\frac{d}{dt}\bigl(e^{4\pi^{2}n^{2}t}c_{n}(t)\bigr)=0$ で、$e^{4\pi^{2}n^{2}t}c_{n}(t)$ は $(0,\infty)$ で定数、$t\downarrow0$ の連続性からその定数は $\hat f(n)$。したがって $v(t,\cdot)$ と $u(t,\cdot)$ はフーリエ係数がすべて等しく、どちらも連続なので \ref{four:uniqueness} から等しい。
:::

（Step 4 の部分積分は $t$ を固定して $x$ について行う。$\partial_{x}^{2}v(t,\cdot)$ が存在して連続なので、$v(t,\cdot)$ は $x$ について $C^{2}$ 級であり、部分積分ができる。）

## 等周不等式 {#four:sec-ap-isoperimetric}

::: theorem 等周不等式 {#four:isoperimetric keywords="Hurwitz's proof of the isoperimetric inequality: for a closed C^1 curve of length L parametrized with constant speed, the signed area A = (1/2) int (x y' - y x') satisfies A <= L^2/(4 pi), with equality only for circles" index="等周不等式|とうしゅうふとうしき"}
$\gamma=(x,y)\colon\mathbb{R}\to\mathbb{R}^{2}$ を周期 $1$ の $C^{1}$ 級の曲線で、速さが一定 $|\gamma'(t)|\equiv L$ とする（$L$ は $\gamma$ の長さ）。
$$
A\defeq\frac12\int_{0}^{1}\bigl(x(t)y'(t)-y(t)x'(t)\bigr)dt
$$
とおくと $A\le\frac{L^{2}}{4\pi}$。等号は $\gamma$ が（正の向きの）円のときに限る。
:::

::: proof
**Step 1（複素数で書く）.** $\gamma=x+iy$ とみて、$c_{n}\defeq\hat\gamma(n)$ とおく。\ref{four:coefficients-basic.4} から $\widehat{\gamma'}(n)=2\pi inc_{n}$。

**Step 2（長さ）.** パーセヴァルの等式（\ref{four:l2-theory.2}）を $\gamma'$ に使うと
$$
L^{2}=\int_{0}^{1}|\gamma'|^{2}dt=\sum_{n}4\pi^{2}n^{2}|c_{n}|^{2}.
$$

**Step 3（面積）.** $\overline{\gamma}\gamma'=(x-iy)(x'+iy')=(xx'+yy')+i(xy'-yx')$ なので $A=\frac12\operatorname{Im}\int\gamma'\overline{\gamma}=\frac12\operatorname{Im}\langle\gamma',\gamma\rangle$。内積についてのパーセヴァルの等式から
$$
\langle\gamma',\gamma\rangle=\sum_{n}2\pi inc_{n}\overline{c_{n}}=2\pi i\sum_{n}n|c_{n}|^{2},\qquad A=\pi\sum_{n}n|c_{n}|^{2}.
$$

**Step 4.** Step 2・3 から
$$
\frac{L^{2}}{4\pi}-A=\pi\sum_{n}(n^{2}-n)|c_{n}|^{2}\ge0,
$$
整数 $n$ について $n^{2}-n=n(n-1)\ge0$ で、等号は $n\in\{0,1\}$ のときだけだから。

**Step 5（等号）.** 等号なら $n\notin\{0,1\}$ で $c_{n}=0$。$\gamma$ は連続で、\ref{four:uniqueness} から $\gamma(t)=c_{0}+c_{1}e^{2\pi it}$：中心 $c_{0}$、半径 $|c_{1}|$ の円を正の向きに 1 周する。逆に円なら直接の計算で等号が成り立つ。
:::

::: hypcheck
- ワイルの判定法の 3 ⇒ 2 で本質的なのは、三角多項式が $C(\mathbb{T})$ で一様ノルムについて稠密なこと（\ref{four:trigonometric-density}）。$L^{p}$ での稠密性では足りない（$\mu_{N}$ は一様ノルムについてしか連続でない）。
- 熱方程式の 1 は $f\in L^{1}$ でも成り立つ（Step 1 で使ったのは $|\hat f(n)|\le\|f\|_{1}$ だけ）。2 の $L^{2}$ 収束にはパーセヴァルを使った。$L^{1}$ での収束には熱核 $\sum e^{-4\pi^{2}n^{2}t}e_{n}$ が非負の総和核であることが要り、これはポアソン和公式で示すのが標準的である。
- 一意性（3）は「有界な時間区間ごとに $[0,1]$ 上一様連続」を使った。周期性がないと（$\mathbb{R}$ 上の熱方程式では）増大度の条件なしには一意性は成り立たない（チホノフの例）。これは標準的な事実として知られているが、このサイトでは示していない。
- 等周不等式では、速さ一定の仮定を Step 2 の $L^{2}=\int|\gamma'|^{2}$ にだけ使った。一般の $C^{1}$ 曲線でも、正則（$\gamma'\ne0$）なら弧長で径数を取り替えて速さ一定にできる。$A$ が「$\gamma$ の囲む領域の面積」に等しいことは、$\gamma$ が単純閉曲線のとき \ref{vec:green-theorem} から従う事実で、証明自体には使っていない。
:::

::: supplement
**関連する結果.**
- ワイルの判定法は多次元（$\mathbb{T}^{d}$）にもそのまま拡張され、$1,\alpha_{1},\dots,\alpha_{d}$ が $\mathbb{Q}$ 上一次独立なら $(n\alpha_{1},\dots,n\alpha_{d})$ は $\mathbb{T}^{d}$ で一様分布する（クロネッカーの定理の量的な形）。また、多項式 $p(n)$ で最高次以外にも無理数の係数を含むものについて $p(n)$ が一様分布することがワイルの差分法で示される。いずれもこのサイトではまだ証明していない。
- 熱方程式の解 $u(t,\cdot)$ は、$f$ がどんなに荒くても $t>0$ で $C^{\infty}$ になる（平滑化）。また $\|u(t,\cdot)\|_{2}$ は $t$ について単調減少する（係数ごとに $e^{-4\pi^{2}n^{2}t}$ 倍）。

**高い視点：対角化.** 三つの応用はすべて、$e_{n}$ が平行移動と微分の同時固有関数であることを使っている。熱方程式では $\partial_{x}^{2}$ が $e_{n}$ 上で $-4\pi^{2}n^{2}$ 倍なので、無限次元の線形常微分方程式 $u'=\partial_{x}^{2}u$ が、係数ごとの独立な 1 次元の方程式 $c_{n}'=-4\pi^{2}n^{2}c_{n}$ に分かれる。行列の対角化で $e^{tA}$ を計算するのと同じ構図である。等周不等式では、長さと面積がどちらも「$n$ ごとの寄与の和」になり、不等式は各 $n$ ごとの $n^{2}\ge n$ に帰着する。比喩で言えば、曲線を「1 周、2 周、…と回る円」の重ね合わせに分解すると、長さの割に面積を稼げるのは 1 周する円だけである。
:::

## 問題 {#four:sec-ap-problems}

::: problem {#four:prob-ap-zeta4}
\ref{four:prob-pw-leibniz} の $f(x)=|x|$ にパーセヴァルの等式を使い、$\sum_{k\ge0}\frac{1}{(2k+1)^{4}}=\frac{\pi^{4}}{96}$ と $\sum_{n\ge1}\frac{1}{n^{4}}=\frac{\pi^{4}}{90}$ を示せ。
:::

::: solution
$\|f\|_{2}^{2}=2\int_{0}^{1/2}x^{2}dx=\frac{1}{12}$。係数は $\hat f(0)=\frac14$、$n$ が奇数なら $|\hat f(n)|=\frac{1}{\pi^{2}n^{2}}$、偶数（$\ne0$）なら $0$。\ref{four:l2-theory.2} から
$$
\frac{1}{12}=\frac{1}{16}+2\sum_{k\ge0}\frac{1}{\pi^{4}(2k+1)^{4}},\qquad\sum_{k\ge0}\frac{1}{(2k+1)^{4}}=\frac{\pi^{4}}{2}\Bigl(\frac1{12}-\frac1{16}\Bigr)=\frac{\pi^{4}}{96}.
$$
$S\defeq\sum_{n\ge1}n^{-4}$ とすると、偶数の項の和は $\frac{S}{16}$ なので $S-\frac{S}{16}=\frac{\pi^{4}}{96}$、$S=\frac{16}{15}\cdot\frac{\pi^{4}}{96}=\frac{\pi^{4}}{90}$。
:::

::: problem {#four:prob-ap-leading-digit}
$\alpha\defeq\log_{10}2$ は無理数であることを示し、\ref{four:weyl-equidistribution} を使って、$2^{n}$ の十進表示の先頭の数字が $1$ である $n$ の割合は $\log_{10}2$ に収束することを示せ。
:::

::: solution
$\log_{10}2=\frac pq$（$p,q$ は正の整数）なら $2^{q}=10^{p}$ で、右辺は $5$ で割り切れるが左辺は割り切れず矛盾。先頭の数字が $1$ であることは、$2^{n}=10^{m}\cdot s$（$m$ は整数、$1\le s<10$）で $1\le s<2$、すなわち $\{n\alpha\}=\log_{10}s\in[0,\log_{10}2)$ と同値。$\alpha$ は無理数なので $(n\alpha)$ は一様分布し、その割合は区間の長さ $\log_{10}2$ に収束する。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{four:sec-ap-exercises} にまとめた。
