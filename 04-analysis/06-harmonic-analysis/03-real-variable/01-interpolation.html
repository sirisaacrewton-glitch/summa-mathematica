# 補間定理 {#four:page-interpolation keywords="interpolation of operators on L^p spaces: distribution function, layer cake formula, weak L^p spaces, sublinear operators of weak type, Marcinkiewicz interpolation theorem, Hadamard three lines lemma, Riesz-Thorin interpolation theorem, Hausdorff-Young inequality, Young's convolution inequality"}

作用素が二つの「端」の空間、例えば $L^{1}$ と $L^{\infty}$ や $L^{1}$ と $L^{2}$ で\term[有界]{fa:bounded-operator}であることがわかると、その「間」の $L^{p}$ でも有界であることが自動的に従う——これが**補間定理**である。調和解析では、端点の評価はしばしば簡単（$L^{2}$ ならプランシュレルの定理、$L^{\infty}$ なら自明な評価）なのに、中間の $L^{p}$ の評価を直接示すのは難しい。このページでは二つの補間定理を示す。一つは、端点で「弱い」評価（チェビシェフの不等式の形）しかなくても中間で本当の $L^{p}$ 評価が得られる**マルチンキェヴィチの補間定理**で、証明は関数を「大きい部分」と「小さい部分」に切り分けるだけの、実変数の議論である。もう一つは、線形作用素について指数を同時に動かせる**リース–ソーリンの補間定理**で、証明には複素解析（**アダマールの三線定理**）を使う。応用としてフーリエ変換の**ハウスドルフ–ヤングの不等式**と、畳み込みの**ヤングの不等式**を得る。

## 記法と定義の確認 {#four:sec-ip2-notation}

::: notation
- $(X,\mu)$, $(Y,\nu)$ は σ 有限な測度空間。$L^{p}=L^{p}(X,\mu)$ は複素数値。$1\le p\le\infty$ の共役指数を $p'$ と書く（$\frac1p+\frac1{p'}=1$）。
- ヘルダーの不等式、$L^{p}$ の双対は \ref{meas:holder}, \ref{fa:lp-dual}。トネリの定理は \ref{meas:tonelli}。
- **単関数**：有限個の測度有限な集合の指示関数の一次結合。単関数の全体は $1\le p<\infty$ で $L^{p}$ に稠密（\ref{meas:lp-simple-dense}）。
- 三線定理で使う複素解析の結果：\ref{cx:maximum-principle}。
- フーリエ変換とプランシュレルの定理は \ref{four:fourier-transform}, \ref{four:plancherel}、畳み込みは \ref{four:convolution-rd}。
- **選択公理**：使わない。
:::

## 分布関数と弱 Lᵖ {#four:sec-ip2-weak}

::: definition 分布関数と弱 Lᵖ {#four:weak-lp keywords="distribution function lambda_f(t) = mu(|f| > t); weak L^p with quasinorm [f]_p = sup_t t lambda_f(t)^{1/p}; Chebyshev: L^p subset weak L^p; sublinear operators of strong type and weak type (p,q)" index="分布関数（測度）|ぶんぷかんすうそくど, 弱 Lp 空間|じゃくえるぴーくうかん, 弱型|じゃくがた, 強型|きょうがた, 劣線形作用素|れつせんけいさようそ"}
1. 可測関数 $f$ について $\lambda_{f}(t)\defeq\mu(\{|f|>t\})$（$t\ge0$）を $f$ の**分布関数**という。
2. $1\le p<\infty$ について $[f]_{p}\defeq\sup_{t>0}t\lambda_{f}(t)^{1/p}$ とおき、$[f]_{p}<\infty$ となる $f$ の全体を**弱 $L^{p}$** という。
3. $L^{p}$ のある部分空間で定義され可測関数に値をとる写像 $T$ が**劣線形**とは、$|T(f+g)|\le|Tf|+|Tg|$, $|T(cf)|=|c||Tf|$（a.e.）を満たすことをいう。$\|Tf\|_{q}\le A\|f\|_{p}$ のとき**強 $(p,q)$ 型**、$[Tf]_{q}\le A\|f\|_{p}$ のとき**弱 $(p,q)$ 型**という（$q=\infty$ の弱型は強型と同じとする）。
:::

::: intuition
分布関数は、$|f|$ が高さ $t$ を超える部分の大きさを高さごとに記録したものである。弱 $L^{p}$ はその大きさが $t^{-p}$ 程度で減ることだけを求める空間で、$L^{p}$ より少し広い。弱型の評価は、作用素の値がそのような減り方をすることを保証する。
:::

::: proposition 層の公式 {#four:layer-cake keywords="layer cake formula ||f||_p^p = p int_0^infinity t^{p-1} lambda_f(t) dt; Chebyshev inequality [f]_p <= ||f||_p" index="層の公式|そうのこうしき"}
1. $0<p<\infty$ について $\|f\|_{p}^{p}=p\int_{0}^{\infty}t^{p-1}\lambda_{f}(t)\,dt$。
2. $[f]_{p}\le\|f\|_{p}$。
:::

::: proof
**1.** $|f(x)|^{p}=\int_{0}^{\infty}pt^{p-1}\mathbf{1}_{\{t<|f(x)|\}}dt$ をトネリで積分する（$(x,t)\mapsto|f(x)|-t$ は積の σ 加法族について可測なので、被積分関数 $pt^{p-1}\mathbf{1}_{\{(x,t):t<|f(x)|\}}$ も可測）。**2.** $t\mathbf{1}_{\{|f|>t\}}\le|f|$ の $p$ 乗を積分する。
:::

## マルチンキェヴィチの補間定理 {#four:sec-ip2-marcinkiewicz}

::: theorem マルチンキェヴィチの補間定理 {#four:marcinkiewicz keywords="Marcinkiewicz interpolation theorem: a sublinear operator of weak type (p0,p0) and (p1,p1), 1 <= p0 < p1 <= infinity, defined on L^{p0} + L^{p1}, is of strong type (p,p) for p0 < p < p1" index="マルチンキェヴィチの補間定理|まるちんきぇう゛ぃちのほかんていり"}
$1\le p_{0}<p_{1}\le\infty$ とし、$T$ を $L^{p_{0}}+L^{p_{1}}$ 上の劣線形作用素で、弱 $(p_{0},p_{0})$ 型（定数 $A_{0}$）かつ弱 $(p_{1},p_{1})$ 型（定数 $A_{1}$）とする。このとき $p_{0}<p<p_{1}$ について、$p,p_{0},p_{1},A_{0},A_{1}$ だけで決まる $A_{p}$ で $\|Tf\|_{p}\le A_{p}\|f\|_{p}$。
:::

::: intuition
劣線形な作用素が、二つの指数で弱い評価（チェビシェフの不等式の形）さえもてば、その間のすべての指数では本当の $L^{p}$ 有界性をもつ。
:::

::: proof
$f\in L^{p}$ とする。$t>0$ と定数 $c>0$（後で選ぶ）について、$f$ を切り分ける：
$$
f_{0}^{t}\defeq f\mathbf{1}_{\{|f|>ct\}},\qquad f_{1}^{t}\defeq f\mathbf{1}_{\{|f|\le ct\}}.
$$
$|f_{0}^{t}|^{p_{0}}\le(ct)^{p_{0}-p}|f|^{p}$ なので $f_{0}^{t}\in L^{p_{0}}$、同様に $f_{1}^{t}\in L^{p_{1}}$（$p_{1}=\infty$ なら $|f_{1}^{t}|\le ct$）。劣線形性から $|Tf|\le|Tf_{0}^{t}|+|Tf_{1}^{t}|$ なので
$$
\lambda_{Tf}(t)\le\lambda_{Tf_{0}^{t}}(t/2)+\lambda_{Tf_{1}^{t}}(t/2).
$$

**場合 $p_{1}<\infty$.** $c=1$ とする。弱型の評価から
$$
\lambda_{Tf}(t)\le\Bigl(\frac{2A_{0}}{t}\Bigr)^{p_{0}}\int_{\{|f|>t\}}|f|^{p_{0}}+\Bigl(\frac{2A_{1}}{t}\Bigr)^{p_{1}}\int_{\{|f|\le t\}}|f|^{p_{1}}.
$$
\ref{four:layer-cake.1} とトネリから
$$
\|Tf\|_{p}^{p}\le p(2A_{0})^{p_{0}}\int|f|^{p_{0}}\int_{0}^{|f|}t^{p-1-p_{0}}dt\,d\mu+p(2A_{1})^{p_{1}}\int|f|^{p_{1}}\int_{|f|}^{\infty}t^{p-1-p_{1}}dt\,d\mu.
$$
$p>p_{0}$ なので $\int_{0}^{|f|}t^{p-1-p_{0}}dt=\frac{|f|^{p-p_{0}}}{p-p_{0}}$、$p<p_{1}$ なので $\int_{|f|}^{\infty}t^{p-1-p_{1}}dt=\frac{|f|^{p-p_{1}}}{p_{1}-p}$。よって $\|Tf\|_{p}^{p}\le p\bigl(\frac{(2A_{0})^{p_{0}}}{p-p_{0}}+\frac{(2A_{1})^{p_{1}}}{p_{1}-p}\bigr)\|f\|_{p}^{p}$。

**場合 $p_{1}=\infty$.** $c\defeq\frac{1}{2A_{1}}$ とすると $\|Tf_{1}^{t}\|_{\infty}\le A_{1}ct=\frac t2$ なので $\lambda_{Tf_{1}^{t}}(t/2)=0$。残りは前の場合と同じ計算で $\|Tf\|_{p}^{p}\le p(2A_{0})^{p_{0}}\int|f|^{p_{0}}\int_{0}^{|f|/c}t^{p-1-p_{0}}dt\,d\mu=\frac{p(2A_{0})^{p_{0}}(2A_{1})^{p-p_{0}}}{p-p_{0}}\|f\|_{p}^{p}$。

::: hypcheck
- **劣線形性**：$\lambda_{Tf}(t)\le\lambda_{Tf_{0}^{t}}(t/2)+\lambda_{Tf_{1}^{t}}(t/2)$ の分解だけに使った。$T$ が線形である必要はない（極大関数のような非線形な作用素にも使える）。
- **端点の弱型評価**：両方の場合で、二つの項の評価に使った（$p_{1}=\infty$ では、弱型は強型と同じなので $\lambda_{Tf_{1}^{t}}(t/2)=0$）。
- **$p_{0}<p<p_{1}$**：$t$ についての積分 $\int_{0}^{|f|}t^{p-1-p_{0}}dt$（$p>p_{0}$ で有限）と $\int_{|f|}^{\infty}t^{p-1-p_{1}}dt$（$p<p_{1}$ で有限）に使った。端点では一般に偽（下の補足）。
- 指数は $p\to p$ の対角に限られる。$p\ne q$ の版もあるが、$p_{i}\le q_{i}$ の条件が要る。
:::
:::

::: supplement
**前提を変えると.**
- 端点 $p=p_{0}$ では結論は一般に偽である。次のページの極大関数は弱 $(1,1)$ 型かつ強 $(\infty,\infty)$ 型だが、$L^{1}$ では有界でない（\see{four:maximal-not-l1}）。上の定数 $A_{p}$ が $p\downarrow p_{0}$ で $(p-p_{0})^{-1/p}$ の速さで発散するのは、この失敗の量的な表れである。
- 弱型の評価を、すべての $f$ ではなく測度有限な集合の指示関数 $f=\mathbf{1}_{E}$ についてだけ仮定しても（制限弱型という）、$T$ が線形なら同じ結論が成り立つことが知られている（スタイン–ワイスの補間定理。Stein–Weiss『Introduction to Fourier Analysis on Euclidean Spaces』第 V 章。ここでは証明しない）。端点で確かめるべきことが「集合の上の振る舞い」だけに減る。

**似た定理.** 補間の逆向きにあたる**ヤノの外挿定理**がある：$\mu(X)<\infty$ とし、$T$ が $1<p\le p_{1}$ のすべての $p$ で $\|Tf\|_{p}\le C(p-1)^{-1}\|f\|_{p}$ を満たすなら、$\int|Tf|\,d\mu\le C'\bigl(1+\int|f|\log(e+|f|)\,d\mu\bigr)$ の形の評価が成り立ち、$T$ は $L\log L$ を $L^{1}$ に移す（Zygmund『Trigonometric Series』第 XII 章。ここでは証明しない）。端点 $p=1$ の失敗の度合いが $(p-1)^{-1}$ 程度なら、$L^{1}$ より少しだけ小さい空間 $L\log L$ で救える、という主張である。線形な作用素について指数を同時に動かせる補間は、このページの \see{four:riesz-thorin} である。

**高い視点：実補間法.** 二つの空間 $X_{0},X_{1}$ と $t>0$ について $K(t,f)\defeq\inf\{\|f_{0}\|_{X_{0}}+t\|f_{1}\|_{X_{1}}:f=f_{0}+f_{1}\}$ とおき、$t$ ごとの最良の分け方の費用を $t$ について重みつきで集めたものが実補間空間 $(X_{0},X_{1})_{\theta,q}$ である。$(L^{p_{0}},L^{p_{1}})_{\theta,q}$ はローレンツ空間 $L^{p,q}$（$\frac1p=\frac{1-\theta}{p_{0}}+\frac{\theta}{p_{1}}$）で、$L^{p,p}=L^{p}$、$L^{p,\infty}$ は弱 $L^{p}$ であることが知られている。上の証明で $f$ を高さ $ct$ で切って $f_{0}^{t}+f_{1}^{t}$ に分けたのは、各 $t$ で $K(t,f)$ をほぼ最小にする分け方を具体的に選んだことにあたる。マルチンキェヴィチの定理は「弱 $L^{p_{i}}$ への有界性から、間の $L^{p}$ への有界性が出る」ことで、実補間法では端点を弱 $L^{p_{i}}$ にしても間の空間が変わらないことの現れである。比喩で言えば、関数を高さで層に切り、低い層は強い指数で、高い層は弱い指数で測るという層ごとの会計で、どの層でも安いほうの帳簿を使えば全体の費用が抑えられる。
:::

## リース–ソーリンの補間定理 {#four:sec-ip2-riesz-thorin}

::: lemma アダマールの三線定理 {#four:three-lines keywords="Hadamard three lines lemma: if F is bounded and continuous on the strip 0 <= Re z <= 1, holomorphic inside, |F| <= M0 on Re z = 0 and |F| <= M1 on Re z = 1, then |F(theta + iy)| <= M0^{1-theta} M1^theta" index="アダマールの三線定理|あだまーるのさんせんていり"}
$S\defeq\{z:0\le\operatorname{Re}z\le1\}$ とし、$F$ を $S$ 上の有界連続関数で $S$ の内部で正則、$|F(iy)|\le M_{0}$, $|F(1+iy)|\le M_{1}$（$y\in\mathbb{R}$、$M_{0},M_{1}>0$）とする。このとき $0\le\theta\le1$ について $|F(\theta+iy)|\le M_{0}^{1-\theta}M_{1}^{\theta}$。
:::

::: proof
**Step 1（正規化）.** $G(z)\defeq F(z)M_{0}^{z-1}M_{1}^{-z}$ とおく。【主張：$G$ は $S$ 上有界連続で内部で正則、$\operatorname{Re}z=0,1$ で $|G|\le1$】 $|M_{0}^{z-1}M_{1}^{-z}|=M_{0}^{\operatorname{Re}z-1}M_{1}^{-\operatorname{Re}z}$ は $S$ で有界なので $G$ も有界で、$\operatorname{Re}z=0$ では $|G|=|F|/M_{0}\le1$、$\operatorname{Re}z=1$ では $|G|=|F|/M_{1}\le1$。$|G(\theta+iy)|=|F(\theta+iy)|M_{0}^{\theta-1}M_{1}^{-\theta}$ なので、$|G(\theta+iy)|\le1$ を示せばよい。

**Step 2（減衰因子）.** $\varepsilon>0$ について $G_{\varepsilon}(z)\defeq G(z)e^{\varepsilon z^{2}}$ とおく。【主張：$\operatorname{Re}z=0,1$ で $|G_{\varepsilon}|\le e^{\varepsilon}$ で、$|y|\to\infty$ のとき $S$ 上一様に $G_{\varepsilon}(x+iy)\to0$】 $z=x+iy\in S$ なら $|e^{\varepsilon z^{2}}|=e^{\varepsilon(x^{2}-y^{2})}\le e^{\varepsilon}e^{-\varepsilon y^{2}}$。よって $|G_{\varepsilon}|\le e^{\varepsilon}$（$\operatorname{Re}z=0,1$）、かつ $|y|\to\infty$ で $G_{\varepsilon}\to0$（$G$ は有界）。

**Step 3（最大値原理）.** $z_{0}=\theta+iy_{0}$ を固定する。【主張：$|G(z_{0})|\le1$】 $R>|y_{0}|$ を $|y|\ge R$ で $|G_{\varepsilon}(z)|\le e^{\varepsilon}$ となるようにとる。長方形 $\{0\le x\le1,|y|\le R\}$ の境界上で $|G_{\varepsilon}|\le e^{\varepsilon}$ なので、\ref{cx:maximum-principle.2} から $|G_{\varepsilon}(z_{0})|\le e^{\varepsilon}$。$|G_{\varepsilon}(z_{0})|=|G(z_{0})|e^{\varepsilon(\theta^{2}-y_{0}^{2})}$ なので $|G(z_{0})|\le e^{\varepsilon(1-\theta^{2}+y_{0}^{2})}$ で、$\varepsilon\to0$ とすればよい。

::: hypcheck
- **$F$ の有界性**：Step 2 で $G_{\varepsilon}\to0$（$|y|\to\infty$）を得るのに使った。本質的である：$F(z)=\exp(-ie^{\pi iz})$ は端で $|F|=1$ だが、帯の中で非有界になる（下の補足）。減衰因子 $e^{\varepsilon z^{2}}$ は、この有界性を使って最大値原理を無限の帯に持ち込むための工夫である。
- **$M_{0},M_{1}>0$**：Step 1 で $M_{0}^{z-1}M_{1}^{-z}$ を作るのに使った。$M_{0}=0$ などのときは $M_{i}$ を $M_{i}+\delta$ に替えて $\delta\to0$ とすればよい（結論は $|F(\theta+iy)|\le0$ を含む）。
:::
:::

::: supplement
**前提を変えると.** 有界性は増大度の条件に弱められる：ある $a<\pi$ と $A>0$ について $S$ 上で $|F(x+iy)|\le\exp(Ae^{a|y|})$ なら、同じ結論が成り立つ（フラグメン–リンデレーフの原理の一つの形）。証明は、Step 2 の減衰因子をより速く減衰するものに替えるだけである。$\max(a,0)<b<\pi$ をとり、$h_{\varepsilon}(z)\defeq\exp\bigl(-\varepsilon\cos(b(z-\tfrac12))\bigr)$（$\varepsilon>0$）とおく。$z=x+iy\in S$ なら $\operatorname{Re}\cos(b(z-\frac12))=\cos(b(x-\frac12))\cosh(by)$ で、$|b(x-\frac12)|\le\frac b2<\frac\pi2$ なので、$\kappa\defeq\cos\frac b2>0$ として $|h_{\varepsilon}(z)|\le\exp(-\varepsilon\kappa\cosh(by))\le1$。Step 1 の $G$ は $|G(z)|\le C\exp(Ae^{a|y|})$（$C\defeq\max_{0\le x\le1}M_{0}^{x-1}M_{1}^{-x}$）を満たすので、$\cosh(by)\ge\frac12e^{b|y|}$ と $b>a$ から
$$
|G(z)h_{\varepsilon}(z)|\le C\exp\Bigl(Ae^{a|y|}-\frac{\varepsilon\kappa}{2}e^{b|y|}\Bigr)\to0\qquad(|y|\to\infty)
$$
で、$\operatorname{Re}z=0,1$ では $|Gh_{\varepsilon}|\le1$。Step 3 と同じく長方形の上で \ref{cx:maximum-principle.2} を使うと $|G(z_{0})h_{\varepsilon}(z_{0})|\le1$ で、$\varepsilon\to0$ のとき $h_{\varepsilon}(z_{0})\to1$ なので $|G(z_{0})|\le1$。$a=\pi$ では偽で、上の hypcheck の例 $F(z)=\exp(-ie^{\pi iz})$ は $|F(\frac12+iy)|=\exp(e^{-\pi y})$ となり、ちょうど $a=\pi$ の増大度をもつ。

**似た定理.** **アダマールの三円定理**：$f$ が円環 $r_{1}<|z|<r_{2}$ で正則で閉円環で連続なら、$M(r)\defeq\max_{|z|=r}|f(z)|$ について $\log M(r)$ は $\log r$ の凸関数である。これは、帯 $\log r_{1}\le\operatorname{Re}w\le\log r_{2}$ 上の $f(e^{w})$（$\operatorname{Im}w$ について周期的なので有界）に、帯を一次関数で $S$ に移してから三線定理を使えば従う。

**高い視点：劣調和性.** $F$ が正則なら $\log|F|$ は劣調和で、$\ell(z)\defeq(1-\operatorname{Re}z)\log M_{0}+\operatorname{Re}z\,\log M_{1}$ は調和（$\operatorname{Re}z$ の一次関数）で境界では $\log|F|\le\ell$。三線定理は、劣調和関数が境界での調和な上界を内部でも超えないという最大値原理の一つの形であり、「$\theta\mapsto\log\sup_{y}|F(\theta+iy)|$ は凸」と言い換えられる。比喩で言えば、両側の壁の温度が $\log M_{0}$, $\log M_{1}$ に保たれた帯の中では、（熱源がないので）温度は壁の間を直線的につなぐ値を超えない。
:::

::: theorem リース–ソーリンの補間定理 {#four:riesz-thorin keywords="Riesz-Thorin interpolation theorem: a linear operator bounded L^{p0} -> L^{q0} with norm M0 and L^{p1} -> L^{q1} with norm M1 is bounded L^{p_theta} -> L^{q_theta} with norm <= M0^{1-theta} M1^theta, where 1/p_theta = (1-theta)/p0 + theta/p1" index="リース–ソーリンの補間定理|りーすそーりんのほかんていり"}
$1\le p_{0},p_{1}<\infty$、$1<q_{0},q_{1}\le\infty$ とする。$T$ を $X$ 上の単関数の空間から $Y$ 上の可測関数への線形写像で、単関数 $f$ について
$$
\|Tf\|_{q_{0}}\le M_{0}\|f\|_{p_{0}},\qquad\|Tf\|_{q_{1}}\le M_{1}\|f\|_{p_{1}}
$$
とする。$0<\theta<1$ について $\frac{1}{p_{\theta}}\defeq\frac{1-\theta}{p_{0}}+\frac{\theta}{p_{1}}$, $\frac{1}{q_{\theta}}\defeq\frac{1-\theta}{q_{0}}+\frac{\theta}{q_{1}}$ とおくと、単関数 $f$ について $\|Tf\|_{q_{\theta}}\le M_{0}^{1-\theta}M_{1}^{\theta}\|f\|_{p_{\theta}}$。したがって $T$ は $L^{p_{\theta}}$ から $L^{q_{\theta}}$ への有界作用素に（ノルム $\le M_{0}^{1-\theta}M_{1}^{\theta}$ で）一意に延びる。
:::

::: intuition
線形な作用素が二組の指数で有界なら、その二点を結ぶ線分の上のすべての指数の組で有界であり、ノルムは両端のノルムの重みつき幾何平均を超えない。
:::

::: proof
$p\defeq p_{\theta}$, $q\defeq q_{\theta}$ と書く。$q>1$ なので $q'<\infty$。

**Step 1（双対性への帰着）.** 【主張：単関数 $f$, $g$ で $\|f\|_{p}=\|g\|_{q'}=1$ のものについて $|\int Tf\,g\,d\nu|\le M_{0}^{1-\theta}M_{1}^{\theta}$ を示せばよい】 単関数 $f$ について $h\defeq Tf\in L^{q_{0}}\cap L^{q_{1}}$ で、$q$ は $q_{0}$ と $q_{1}$ の間にあるので $h\in L^{q}$（$q_{0},q_{1}<\infty$ なら $|h|^{q}\le|h|^{q_{0}}+|h|^{q_{1}}$、$q_{1}=\infty>q$ なら $|h|^{q}\le\|h\|_{\infty}^{q-q_{0}}|h|^{q_{0}}$、$q_{0}=\infty$ も同様、$q=\infty$ なら $q_{0}=q_{1}=\infty$）。$h\in L^{q}(Y)$ について $\|h\|_{q}=\sup\{|\int hg\,d\nu|:g\text{ は単関数},\ \|g\|_{q'}=1\}$（\ref{fa:lp-dual} の証明と同じく、$q<\infty$ なら $g$ を $\overline{\operatorname{sgn}h}|h|^{q-1}$ の単関数近似に、$q=\infty$ なら $\{|h|>\|h\|_{\infty}-\varepsilon\}$ の測度有限な部分集合の上の単関数にとる。σ 有限性を使う）。$T$ の線形性から $\|f\|_{p}=1$ に正規化してよいので、主張が従う。

**Step 2（複素指数の族）.** $f=\sum_{k}a_{k}e^{i\alpha_{k}}\mathbf{1}_{A_{k}}$, $g=\sum_{j}b_{j}e^{i\beta_{j}}\mathbf{1}_{B_{j}}$（$a_{k},b_{j}>0$、$A_{k}$ たちは互いに素、$B_{j}$ たちも互いに素）と書く。$z\in S$ について $\frac{1}{p(z)}\defeq\frac{1-z}{p_{0}}+\frac{z}{p_{1}}$, $\frac{1}{q'(z)}\defeq\frac{1-z}{q_{0}'}+\frac{z}{q_{1}'}$ とし、
$$
f_{z}\defeq\sum_{k}a_{k}^{p/p(z)}e^{i\alpha_{k}}\mathbf{1}_{A_{k}},\qquad g_{z}\defeq\sum_{j}b_{j}^{q'/q'(z)}e^{i\beta_{j}}\mathbf{1}_{B_{j}},\qquad F(z)\defeq\int Tf_{z}\,g_{z}\,d\nu.
$$
【主張：$F$ は整関数で $S$ 上有界、$F(\theta)=\int Tf\,g\,d\nu$】 線形性から $F(z)=\sum_{k,j}a_{k}^{p/p(z)}b_{j}^{q'/q'(z)}e^{i(\alpha_{k}+\beta_{j})}\int T(\mathbf{1}_{A_{k}})\mathbf{1}_{B_{j}}d\nu$ は、$z$ の 1 次式の指数関数の有限和なので整関数で、$S$ 上有界（実部が有界な 1 次式）。$F(\theta)=\int Tf\,g$（$p(\theta)=p$, $q'(\theta)=q'$）。

**Step 3（端での評価）.** 【主張：$\operatorname{Re}z=0$ で $|F(z)|\le M_{0}$、$\operatorname{Re}z=1$ で $|F(z)|\le M_{1}$】 $\operatorname{Re}z=0$ なら $\operatorname{Re}\frac{p}{p(z)}=\frac{p}{p_{0}}$ なので $|f_{z}|=|f|^{p/p_{0}}$、$\|f_{z}\|_{p_{0}}^{p_{0}}=\|f\|_{p}^{p}=1$。同様に $|g_{z}|=|g|^{q'/q_{0}'}$ で $\|g_{z}\|_{q_{0}'}^{q_{0}'}=\|g\|_{q'}^{q'}=1$（$q_{0}'$ は有限：$q_{0}'=\infty$ となる $q_{0}=1$ は仮定から除いた。$q_{0}=\infty$ なら $q_{0}'=1$ で $\|g_{z}\|_{1}=\|g\|_{q'}^{q'}=1$）。ヘルダーの不等式と仮定から $|F(z)|\le\|Tf_{z}\|_{q_{0}}\|g_{z}\|_{q_{0}'}\le M_{0}\|f_{z}\|_{p_{0}}=M_{0}$。$\operatorname{Re}z=1$ でも同様に $|F(z)|\le M_{1}$。

Step 2・3 と \ref{four:three-lines} から $|F(\theta)|\le M_{0}^{1-\theta}M_{1}^{\theta}$ で（$M_{0}$ か $M_{1}$ が $0$ なら $M_{i}+\delta$ に替えて $\delta\to0$）、Step 1 から単関数についての評価が従う。

**Step 4（延長）.** 【主張：$T$ は $L^{p}$ から $L^{q}$ への有界作用素（ノルム $\le M_{0}^{1-\theta}M_{1}^{\theta}$）に一意に延びる】 $p<\infty$ なので単関数は $L^{p}$ で稠密（\ref{meas:lp-simple-dense}）で、稠密な部分空間上の有界線形写像は完備な $L^{q}$ への有界線形写像に一意に延びる。

::: hypcheck
- **線形性**：Step 2 で $F(z)$ を指数関数の有限和に書き、正則関数を作るのに本質的に使った。代わりに定数が $M_{0}^{1-\theta}M_{1}^{\theta}$ と最良の形で得られ、$p\ne q$ も扱える。
- **$q_{0},q_{1}>1$**：Step 1 の双対性（$q'<\infty$ で単関数が $L^{q'}$ で稠密）と Step 3 の $q_{0}'<\infty$ に使った。**$p_{0},p_{1}<\infty$**：Step 4 の稠密性に使った。どちらも証明を短くするためのもので、外せる（下の補足）。
- **複素数値**：Step 2 で $f_{z}$ が複素数値になる。実数値の $L^{p}$ の間の作用素では、定数に $2$ 倍が付くことがある。
:::
:::

::: supplement
**前提を変えると.**
- 指数の制限 $p_{0},p_{1}<\infty$, $q_{0},q_{1}>1$ は、証明を短くするため（単関数での双対性と稠密性）のものである。定理そのものは $1\le p_{0},p_{1},q_{0},q_{1}\le\infty$ のすべてで成り立つことが知られている（$p_{\theta}=\infty$ のときは延長の主張を除く）。
- 結論が出るのは、二点 $(\frac1{p_{0}},\frac1{q_{0}})$, $(\frac1{p_{1}},\frac1{q_{1}})$ を結ぶ線分の上だけである。線分の外へは延ばせない：フーリエ変換は $(1,0)$ と $(\frac12,\frac12)$ で有界だが、その延長線上の $p>2$ では $L^{p}$ から $L^{p'}$ へ有界でない（\see{four:hausdorff-young} の補足）。

**似た定理.** **スタインの補間定理**：作用素 $T$ の代わりに、帯 $S$ の上で解析的に動く作用素の族 $T_{z}$ を考え、$\operatorname{Re}z=0$ で $L^{p_{0}}\to L^{q_{0}}$、$\operatorname{Re}z=1$ で $L^{p_{1}}\to L^{q_{1}}$ の評価があり（定数は $|\operatorname{Im}z|$ について許容される増大度をもってよい）、$T_{z}$ の値がそれに合った増大度の条件を満たせば、$T_{\theta}$ は $L^{p_{\theta}}\to L^{q_{\theta}}$ で有界である（ここでは証明しない）。上の証明の $f_{z}$, $g_{z}$ を作用素の側に移したものにあたる。乗数 $|\xi|^{i\tau}$（\see{four:ml-homogeneous-symbols}）のような虚数べきの評価と組み合わせて、分数階の微分・積分の評価を補間で出すのに使われる。

**高い視点：凸性としての補間.** リース–ソーリンの定理は、「$(\frac1p,\frac1q)$ の平面の点ごとの作用素ノルムの対数は凸関数である」と言い換えられる（ソーリンの元の形）。正則関数の対数絶対値が劣調和であること（\ref{four:three-lines} の補足）が、その凸性の源である。抽象的には、二つのバナッハ空間 $X_{0},X_{1}$ から複素補間空間 $[X_{0},X_{1}]_{\theta}$ を作る操作（複素補間法）があり、$[L^{p_{0}},L^{p_{1}}]_{\theta}=L^{p_{\theta}}$ で、この定理は「複素補間法は作用素の有界性を指数 $\theta$ の凸結合の形で保つ」ことの特別な場合である。ソボレフ空間を補間すると分数階の空間が得られる（\see{four:fi-bessel-space}）。比喩で言えば、二つの端の橋が丈夫であることを確かめれば、その間に架け渡した吊り橋のどこを歩いても落ちないことが保証される。
:::

## 応用 {#four:sec-ip2-applications}

::: corollary ハウスドルフ–ヤングの不等式 {#four:hausdorff-young keywords="Hausdorff-Young inequality: for 1 <= p <= 2, the Fourier transform extends to a bounded map L^p(R^n) -> L^{p'}(R^n) with ||hat f||_{p'} <= ||f||_p; similarly for Fourier coefficients on the circle" index="ハウスドルフ–ヤングの不等式|はうすどるふやんぐのふとうしき"}
$1\le p\le2$ なら、単関数 $f$ について $\|\hat f\|_{p'}\le\|f\|_{p}$。したがってフーリエ変換は $L^{p}(\mathbb{R}^{n})$ から $L^{p'}(\mathbb{R}^{n})$ への有界作用素（ノルム $\le1$）に延びる。
:::

::: proof
$p=1$：$\|\hat f\|_{\infty}\le\|f\|_{1}$（\ref{four:transform-basic.1}）。$p=2$：$\|\hat f\|_{2}=\|f\|_{2}$（\ref{four:plancherel-identity}、単関数は $L^{1}\cap L^{2}$）。$1<p<2$ なら $\frac1p=\frac{1-\theta}{1}+\frac{\theta}{2}$ となる $\theta\in(0,1)$ について $\frac{1}{p'}=1-\frac1p=\frac{1-\theta}{\infty}+\frac{\theta}{2}$。\ref{four:riesz-thorin}（$p_{0}=1$, $q_{0}=\infty$, $p_{1}=q_{1}=2$, $M_{0}=M_{1}=1$）から。
:::

::: supplement
**前提を変えると.**
- $p>2$ では、フーリエ変換は $L^{p}$ から関数の空間へ有界に延びない（緩増加超関数にはなる）ことが知られている。
- 行き先の指数 $p'$ は拡大縮小で決まる：ある $q$ と $C$ で、すべての単関数 $f$ について $\|\hat f\|_{q}\le C\|f\|_{p}$ が成り立つとする。$f_{\delta}(x)\defeq f(\delta x)$（$\delta>0$）とおくと $\|f_{\delta}\|_{p}=\delta^{-n/p}\|f\|_{p}$、$\widehat{f_{\delta}}(\xi)=\delta^{-n}\hat f(\xi/\delta)$ から $\|\widehat{f_{\delta}}\|_{q}=\delta^{-n+n/q}\|\hat f\|_{q}$。$\hat f\ne0$ の $f$ を固定して $\delta\to0$ と $\delta\to\infty$ を比べると $-n+\frac nq=-\frac np$、すなわち $q=p'$ でなければならない。

**似た定理.**
- 最良定数は $1$ ではなく、ガウス関数で達成される $(p^{1/p}/p'^{1/p'})^{n/2}$ である（ベックナーの定理。ここでは証明しない）。
- 重みを付けると、指数を $p'$ から $p$ に替えられる：$1<p\le2$, $f\in L^{p}(\mathbb{T})$ なら $\sum_{n}(1+|n|)^{p-2}|\hat f(n)|^{p}\le C_{p}\|f\|_{p}^{p}$（ハーディ–リトルウッドの不等式）。証明：$\mathbb{Z}$ に測度 $w(\{n\})\defeq(1+|n|)^{-2}$（σ 有限）を入れ、$L^{1}(\mathbb{T})=L^{1}+L^{2}$ 上の線形作用素 $Tf\defeq((1+|n|)\hat f(n))_{n}$ を考える。強 $(2,2)$ 型（定数 $1$）：$\int|Tf|^{2}dw=\sum_{n}|\hat f(n)|^{2}=\|f\|_{2}^{2}$（\ref{four:l2-theory.2}）。弱 $(1,1)$ 型（定数 $4$）：$|\hat f(n)|\le\|f\|_{1}$ なので、$s\defeq t/\|f\|_{1}$ として $\{|Tf|>t\}\subset\{n:1+|n|>s\}$。$k=1+|n|$ となる $n$ は高々 $2$ 個で、$s\ge1$ なら $m\defeq\lfloor s\rfloor+1$ について $\sum_{k\ge m}k^{-2}\le\frac{1}{m^{2}}+\int_{m}^{\infty}\frac{dx}{x^{2}}\le\frac2m<\frac2s$、$s<1$ なら $\sum_{k\ge1}k^{-2}\le1+\int_{1}^{\infty}\frac{dx}{x^{2}}=2<\frac2s$。よって $w(\{|Tf|>t\})\le\frac{4\|f\|_{1}}{t}$。\ref{four:marcinkiewicz}（$p_{0}=1$, $p_{1}=2$、行き先は $(\mathbb{Z},w)$）から、$1<p<2$ で $\int|Tf|^{p}dw=\sum_{n}(1+|n|)^{p-2}|\hat f(n)|^{p}\le A_{p}^{p}\|f\|_{p}^{p}$（$p=2$ は強 $(2,2)$ 型そのもの）。端点 $p=1$ では重みつきの $\ell^{1}$ への強型の評価がない（$\sum_{n}(1+|n|)^{-1}=\infty$）ので、弱型で足りるマルチンキェヴィチの定理が要る例である。

**高い視点.** 二つの端点は、「指標 $e^{-2\pi ix\cdot\xi}$ の絶対値は $1$」（$L^{1}\to L^{\infty}$）と「フーリエ変換はユニタリ」（$L^{2}\to L^{2}$）という、フーリエ変換の最も基本的な二つの性質そのものである。ハウスドルフ–ヤングの不等式は、その間を補間しただけのものなので、同じ二つの性質が成り立つ場面（円周と整数、より一般に局所コンパクト可換群とその\term[双対群]{four:lc-character}）ではそのまま成り立つ。比喩で言えば、$L^{1}$ の関数は「どの周波数にも少しずつ」、$L^{2}$ の関数は「エネルギーを保って」配られ、$1<p<2$ はその中間の配り方である。
:::

::: corollary ヤングの不等式 {#four:young-inequality keywords="Young's convolution inequality ||f * g||_r <= ||f||_p ||g||_q for 1 + 1/r = 1/p + 1/q, by Riesz-Thorin" index="ヤングの不等式（畳み込み）|やんぐのふとうしきたたみこみ"}
$1\le p,q,r\le\infty$, $1+\frac1r=\frac1p+\frac1q$ とする。$f\in L^{p}(\mathbb{R}^{n})$, $g\in L^{q}(\mathbb{R}^{n})$ について $\|f*g\|_{r}\le\|f\|_{p}\|g\|_{q}$。
:::

::: proof
$f\in L^{p}$ を固定し、$T_{f}g\defeq f*g$ とする。$q=1$：$\|f*g\|_{p}\le\|f\|_{p}\|g\|_{1}$（\ref{four:convolution-rd.1}）。$q=p'$：ヘルダーの不等式と平行移動不変性から $|f*g(x)|\le\|f\|_{p}\|g\|_{p'}$、すなわち $\|f*g\|_{\infty}\le\|f\|_{p}\|g\|_{p'}$。$1<q<p'$ のとき $\frac1q=\frac{1-\theta}{1}+\frac{\theta}{p'}$ とおくと $\frac1r=\frac1p+\frac1q-1=\frac{1-\theta}{p}+\frac{\theta}{\infty}$。$1<p<\infty$ なら $p_{1}=p'<\infty$, $q_{0}=p>1$ なので \ref{four:riesz-thorin}（$p_{0}=1,q_{0}=p$, $p_{1}=p',q_{1}=\infty$）が使え、単関数 $g$ について $\|f*g\|_{r}\le\|f\|_{p}\|g\|_{q}$。このとき $q<p'$ なので $q<\infty$、$\frac1r=\frac{1-\theta}{p}>0$ なので $r<\infty$。一般の $g\in L^{q}$ には、$|f|$ と、$|g|$ に下から単調に収束する非負の単関数の列 $g_{k}$ にこの評価を使う：$|f|*g_{k}\uparrow|f|*|g|$ なので \ref{meas:monotone-convergence} から $\bigl\||f|*|g|\bigr\|_{r}\le\|f\|_{p}\|g\|_{q}$。とくにほとんどすべての $x$ で $\int|f(x-y)||g(y)|\,dy<\infty$ で $(f*g)(x)$ が定まり、$|f*g|\le|f|*|g|$ から主張が従う。$p=1$ なら $r=q$ で、\ref{four:convolution-rd.1} を $g\in L^{q}$, $f\in L^{1}$ に使う（置き換え $y\mapsto x-y$ で $f*g=g*f$）。$p=\infty$ なら $q=1$, $r=\infty$ で、ヘルダーの不等式から直接。
:::

::: supplement
**前提を変えると（ヤングの不等式）.**
- 指数の関係 $1+\frac1r=\frac1p+\frac1q$ は拡大縮小で決まる：$f_{\delta}(x)\defeq f(\delta x)$ とおくと、置き換え $y=z/\delta$ から $(f_{\delta}*g_{\delta})(x)=\delta^{-n}(f*g)(\delta x)$ なので $\|f_{\delta}*g_{\delta}\|_{r}=\delta^{-n-n/r}\|f*g\|_{r}$、一方 $\|f_{\delta}\|_{p}\|g_{\delta}\|_{q}=\delta^{-n/p-n/q}\|f\|_{p}\|g\|_{q}$。$f*g\ne0$ となる組を固定して $\delta\to0,\infty$ を比べると、評価がすべての $f,g$ で成り立つには $1+\frac1r=\frac1p+\frac1q$ が必要である。
- 空間を変えると条件が変わる。円周 $\mathbb{T}$（測度 $1$）では $L^{p}\subset L^{\tilde p}$（$\tilde p\le p$）なので、$1+\frac1r\ge\frac1p+\frac1q$ でよい。整数 $\mathbb{Z}$（数え上げ測度）では $\ell^{p}\subset\ell^{\tilde p}$（$\tilde p\ge p$）なので、$1+\frac1r\le\frac1p+\frac1q$ でよい。$\mathbb{R}^{n}$ はどちらの包含もないので等号に限られる。
- 核 $g$ が $L^{q}$ ではなく弱 $L^{q}$ に入るだけの場合（例 $|x|^{-n/q}$）も、$1<p,q,r<\infty$ なら同じ形の評価が成り立つ。その典型が \see{four:fi-hls} である。

**似た定理.** $1<p,q,r<\infty$ では最良定数は $1$ より小さく、ガウス関数で達成されることが知られている（ベックナー、ブラスカンプ–リーブ。ここでは証明しない）。

**高い視点：フーリエ側のヘルダーの不等式.** 共役指数で書くと、$1+\frac1r=\frac1p+\frac1q$ は $\frac1{r'}=\frac1{p'}+\frac1{q'}$ と同じである。フーリエ変換は畳み込みを積に移し、\ref{four:hausdorff-young} は $L^{p}$ の関数を $L^{p'}$ に移すので、ヤングの不等式の指数の関係は、フーリエ側で見たヘルダーの不等式の指数の関係そのものになっている（ハウスドルフ–ヤングは逆向きには成り立たないので、これは証明ではなく見通しである）。代数的には、$L^{1}$ は畳み込みについてバナッハ代数で、$q=1$ の場合は「$L^{p}$ は $L^{1}$ 加群である」ことを、一般の場合は畳み込みが指数 $\frac1p$ の足し算（から $1$ を引いたもの）に沿って空間を移すことを述べている。比喩で言えば、ぼかし（畳み込み）は関数の尖りを丸めるので、二つの関数を混ぜた結果は、それぞれよりも「より可積分」になる。
:::

## 問題 {#four:sec-ip2-problems}

::: problem {#four:prob-ip2-weak-not-strong}
$\mathbb{R}$ 上の $f(x)\defeq\frac{1}{|x|}$ は弱 $L^{1}$ に入るが $L^{1}$ に入らないことを示せ。また $[f+g]_{1}\le2([f]_{1}+[g]_{1})$ を示せ（弱 $L^{1}$ の三角不等式は定数倍でしか成り立たない）。
:::

::: solution
$\lambda_{f}(t)=\lambda(\{|x|<\frac1t\})=\frac2t$ なので $[f]_{1}=\sup_{t}t\cdot\frac2t=2$。$\int\frac{dx}{|x|}=\infty$。三角不等式：$\{|f+g|>t\}\subset\{|f|>\frac t2\}\cup\{|g|>\frac t2\}$ なので $t\lambda_{f+g}(t)\le2\cdot\frac t2\lambda_{f}(\frac t2)+2\cdot\frac t2\lambda_{g}(\frac t2)\le2([f]_{1}+[g]_{1})$。
:::

::: problem {#four:prob-ip2-hy-circle}
$1\le p\le2$ なら、$f\in L^{p}(\mathbb{T})$ のフーリエ係数について $\bigl(\sum_{n}|\hat f(n)|^{p'}\bigr)^{1/p'}\le\|f\|_{p}$ を示せ（$p'=\infty$ のときは $\sup$）。
:::

::: solution
$T\colon f\mapsto(\hat f(n))_{n}$ は線形で、$L^{1}(\mathbb{T})\to\ell^{\infty}(\mathbb{Z})$ でノルム $\le1$（\ref{four:coefficients-basic.1}）、$L^{2}\to\ell^{2}$ でノルム $1$（\ref{four:l2-theory.2}）。$Y=\mathbb{Z}$（数え上げ測度、σ 有限）として \ref{four:riesz-thorin} を \ref{four:hausdorff-young} の証明と同じ指数で使うと、単関数 $f$ について評価が成り立つ。一般の $f\in L^{p}(\mathbb{T})$ には、$L^{p}$ で $f$ に収束する単関数の列 $f_{k}$（\ref{meas:lp-simple-dense}）をとる。$\mathbb{T}$ の測度は $1$ なので $L^{1}$ でも収束し、各 $n$ で $\hat f_{k}(n)\to\hat f(n)$。$p'<\infty$ ならファトゥの補題（数え上げ測度）から $\sum_{n}|\hat f(n)|^{p'}\le\liminf_{k}\sum_{n}|\hat f_{k}(n)|^{p'}\le\liminf_{k}\|f_{k}\|_{p}^{p'}=\|f\|_{p}^{p'}$、$p'=\infty$（$p=1$）なら \ref{four:coefficients-basic.1} そのもの。
:::
