# 演習：実変数の調和解析 {#four:page-exercises-real-variable keywords="exercises, real-variable harmonic analysis"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な関数の分布関数・弱 $L^{p}$ ノルム・極大関数・ポアソン積分・ヒルベルト変換・共役関数・特異積分の乗数・リース・ポテンシャルの計算、$2\times2$ 行列でのリース–ソーリンの定理の等号、極大関数の局所的な非可積分性、ド・ラ・ヴァレ・プーサン平均、$p=4$ での共役関数の評価、$p=\infty$ でのカルデロン–ジグムント評価の破綻、実数直線のフーリエ積分の $L^{p}$ 収束、端点 $p=n/\alpha$ での分数積分と、いくつかのページの結果を組み合わせる問題（共役ポアソン積分、一般の楕円型作用素の二階微分の評価、熱核によるヘドベリの不等式）である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#four:sec-exrv-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。とくに分布関数 $\lambda_{f}$ と弱 $L^{p}$ の $[f]_{p}$ は \ref{four:weak-lp}、極大関数 $Mf$ は \ref{meas:maximal-function}、フーリエ変換は $\hat f(\xi)=\int f(x)e^{-2\pi ix\cdot\xi}dx$（\ref{four:fourier-transform}）、$L^{2}$ 上の $\mathcal{F}$ は \ref{four:plancherel}、$\langle f,g\rangle\defeq\int f\bar g$。
- ルベーグ測度は $\lambda(E)$ または $|E|$ と書く。$\omega_{n}\defeq|B(0,1)|$。$\mathbb{T}=\mathbb{R}/\mathbb{Z}$、$e_{n}(x)=e^{2\pi inx}$。
- 複数の定数 $A_{p}$ が現れるときは、極大関数の定数（\ref{four:maximal-lp}）を $A_{p}^{M}$、ヒルベルト変換の定数（\ref{four:ht-lp}）を $A_{p}^{H}$ と書いて区別する。
- 1 次元の非負連続関数の積分は、広義リーマン積分として計算してよい（\ref{meas:improper-lebesgue.1}）。
- **選択公理**：使わない（引用する測度論の結果に含まれるものを除く）。\ref{four:ex-ht-2} で使う部分列の取り出しは、コーシー列の条件から番号を具体的に決められる。
:::

## 補間定理 {#four:sec-ip2-exercises}

対応するページ：\ref{four:page-interpolation}

::: problem ★ 基本：分布関数と層の公式の計算 {#four:ex-ip2-1}
1. $\mathbb{R}$ 上の $f(x)\defeq e^{-|x|}$ について $\lambda_{f}$ を求め、\ref{four:layer-cake.1} で $\|f\|_{p}^{p}=\frac2p$（$0<p<\infty$）を確かめよ。
2. $1\le p<\infty$ について $[f]_{p}=\bigl(\frac{2}{ep}\bigr)^{1/p}$ を示し、$[f]_{p}/\|f\|_{p}=e^{-1/p}$ を確かめよ。
3. $1\le p_{0}<p<p_{1}<\infty$ とする。$f$ が弱 $L^{p_{0}}$ と弱 $L^{p_{1}}$ の両方に入れば $f\in L^{p}$ で
$$
\|f\|_{p}^{p}\le p\Bigl(\frac{[f]_{p_{0}}^{p_{0}}}{p-p_{0}}+\frac{[f]_{p_{1}}^{p_{1}}}{p_{1}-p}\Bigr)
$$
であることを示せ。
:::

::: solution
**1.** $0\le f\le1$ なので $t\ge1$ で $\lambda_{f}(t)=0$。$0<t<1$ なら $e^{-|x|}>t\iff|x|<\log\frac1t$ なので $\lambda_{f}(t)=2\log\frac1t$。直接には $\|f\|_{p}^{p}=2\int_{0}^{\infty}e^{-px}dx=\frac2p$。層の公式の側は、置き換え $t=e^{-s}$（$dt=-e^{-s}ds$）から
$$
p\int_{0}^{1}t^{p-1}\cdot2\log\frac1t\,dt=2p\int_{0}^{\infty}e^{-ps}s\,ds=2p\cdot\frac{1}{p^{2}}=\frac2p
$$
（$\int_{0}^{\infty}se^{-ps}ds=\frac{1}{p^{2}}$ は部分積分）で、一致する。

**2.** $[f]_{p}^{p}=\sup_{0<t<1}t^{p}\cdot2\log\frac1t$。$s=\log\frac1t\in(0,\infty)$ とおくと $\varphi(s)\defeq2se^{-ps}$ の上限で、$\varphi'(s)=2e^{-ps}(1-ps)$ は $s<\frac1p$ で正、$s>\frac1p$ で負。よって最大値は $\varphi(\frac1p)=\frac{2}{ep}$、$[f]_{p}=(\frac{2}{ep})^{1/p}$。1 から $\|f\|_{p}=(\frac2p)^{1/p}$ なので比は $e^{-1/p}$。（\ref{four:layer-cake.2} の不等式 $[f]_{p}\le\|f\|_{p}$ は真の不等号である。）

**3.** 定義から $t\lambda_{f}(t)^{1/p_{i}}\le[f]_{p_{i}}$、すなわち $\lambda_{f}(t)\le[f]_{p_{i}}^{p_{i}}t^{-p_{i}}$（$i=0,1$）。\ref{four:layer-cake.1} の積分を $t=1$ で分け、$t<1$ では $i=0$、$t\ge1$ では $i=1$ の評価を使うと
$$
\|f\|_{p}^{p}\le p[f]_{p_{0}}^{p_{0}}\int_{0}^{1}t^{p-1-p_{0}}dt+p[f]_{p_{1}}^{p_{1}}\int_{1}^{\infty}t^{p-1-p_{1}}dt .
$$
$p>p_{0}$ から第 1 の積分は $\frac{1}{p-p_{0}}$、$p<p_{1}$ から第 2 の積分は $\frac{1}{p_{1}-p}$。（恒等写像に \ref{four:marcinkiewicz} の証明の切り分けを当てはめたものである。）
:::

::: problem ★★ 標準：2 次の行列での等号 {#four:ex-ip2-2}
$X=\{1,2\}$ に数え上げ測度を入れ、$A\defeq\begin{pmatrix}1&1\\1&-1\end{pmatrix}$ を $f=(f_{1},f_{2})\in\mathbb{C}^{2}$ に掛ける写像とする。$1\le p\le2$, $p'$ を共役指数とする。
1. $\|Af\|_{\infty}\le\|f\|_{1}$、$\|Af\|_{2}=\sqrt2\|f\|_{2}$ を示せ。
2. \ref{four:riesz-thorin} から $\|Af\|_{p'}\le2^{1/p'}\|f\|_{p}$ を導き、この定数は最良であることを示せ。
3. ヘルダーの不等式だけを使う評価 $\|Af\|_{p'}\le2^{1/p'}\|Af\|_{\infty}\le2^{1/p'}\|f\|_{1}\le2^{2/p'}\|f\|_{p}$ と比べよ。
:::

::: solution
**1.** $Af=(f_{1}+f_{2},f_{1}-f_{2})$。各成分は $|f_{1}|+|f_{2}|=\|f\|_{1}$ 以下。また $|a+b|^{2}+|a-b|^{2}=2|a|^{2}+2|b|^{2}$（中線定理）から $\|Af\|_{2}^{2}=2\|f\|_{2}^{2}$。

**2.** $p=1,2$ は 1 そのもの（$1'=\infty$, $2^{1/2}=\sqrt2$）。$1<p<2$ とし、$\theta\defeq\frac{2}{p'}\in(0,1)$ とおくと
$$
\frac{1-\theta}{1}+\frac{\theta}{2}=1-\frac{1}{p'}=\frac1p,\qquad\frac{1-\theta}{\infty}+\frac{\theta}{2}=\frac{1}{p'} .
$$
$X$ は σ 有限で、$X$ 上の関数はすべて単関数。\ref{four:riesz-thorin} を $p_{0}=1$, $q_{0}=\infty$, $M_{0}=1$, $p_{1}=q_{1}=2$, $M_{1}=\sqrt2$ で使うと（$q_{0},q_{1}>1$ を満たす）
$$
\|Af\|_{p'}\le1^{1-\theta}(\sqrt2)^{\theta}\|f\|_{p}=2^{1/p'}\|f\|_{p}.
$$
$f=(1,0)$ なら $Af=(1,1)$ で $\|Af\|_{p'}=2^{1/p'}$, $\|f\|_{p}=1$。よって $p\to p'$ の作用素ノルムはちょうど $2^{1/p'}$。（$f=(1,1)$ でも $\|Af\|_{p'}=2$, $\|f\|_{p}=2^{1/p}$ で等号になる。）

**3.** $\|g\|_{p'}^{p'}=|g_{1}|^{p'}+|g_{2}|^{p'}\le2\|g\|_{\infty}^{p'}$、ヘルダーの不等式から $\|f\|_{1}\le2^{1-1/p}\|f\|_{p}=2^{1/p'}\|f\|_{p}$ なので、この評価の定数は $2^{2/p'}$。$1<p\le2$ では補間で得た定数の $2^{1/p'}$ 倍で、損をしている。
:::

## 極大関数 {#four:sec-mf-exercises}

対応するページ：\ref{four:page-maximal-functions}

::: problem ★ 基本：べき関数の極大関数 {#four:ex-mf-1}
$n=1$、$f(x)\defeq|x|^{-1/2}$（$f(0)\defeq0$）とする。
1. $x\ne0$ について $Mf(x)=c|x|^{-1/2}$、$c\defeq(27/4)^{1/4}\approx1.612$ を示せ。また $Mf(0)=\infty$。
2. $[f]_{2}=\sqrt2$, $[Mf]_{2}=\sqrt2\,c$ を示せ。
:::

::: solution
**1.** $f\in L^{1}_{\mathrm{loc}}$。$Mf(0)\ge\frac{1}{2r}\int_{-r}^{r}|y|^{-1/2}dy=\frac{4\sqrt r}{2r}=\frac{2}{\sqrt r}\to\infty$（$r\to0$）。$x\ne0$ とし、$y=|x|z$ と置き換えると、$\rho\defeq r/|x|$, $e\defeq\operatorname{sgn}x$ について
$$
\begin{aligned}\frac{1}{2r}\int_{x-r}^{x+r}|y|^{-1/2}dy&=|x|^{-1/2}\,g_{e}(\rho),\\g_{e}(\rho)&\defeq\frac{1}{2\rho}\int_{e-\rho}^{e+\rho}|z|^{-1/2}dz .\end{aligned}
$$
$z\mapsto-z$ から $g_{-1}=g_{1}\eqdef g$。よって $Mf(x)=|x|^{-1/2}\sup_{\rho>0}g(\rho)$ で、$\sup g=c$ を示せばよい。

$0<\rho\le1$ なら $\int_{1-\rho}^{1+\rho}z^{-1/2}dz=2(\sqrt{1+\rho}-\sqrt{1-\rho})$ で
$$
g(\rho)=\frac{\sqrt{1+\rho}-\sqrt{1-\rho}}{\rho}=\frac{2}{\sqrt{1+\rho}+\sqrt{1-\rho}} .
$$
分母の 2 乗 $2+2\sqrt{1-\rho^{2}}$ は減少するので $g$ は増加し、$g\le g(1)=\sqrt2$。

$\rho\ge1$ なら区間は $0$ を含み、$\int_{1-\rho}^{0}|z|^{-1/2}dz=2\sqrt{\rho-1}$ なので $g(\rho)=\frac{\sqrt{\rho+1}+\sqrt{\rho-1}}{\rho}$。$s\defeq\frac1\rho\in(0,1]$ とおくと
$$
g^{2}=\bigl(\sqrt{s+s^{2}}+\sqrt{s-s^{2}}\bigr)^{2}=2s+2s\sqrt{1-s^{2}}\eqdef2\varphi(s).
$$
$0<s<1$ で $c_{s}\defeq\sqrt{1-s^{2}}$ とすると、$1-2s^{2}=2c_{s}^{2}-1$ から
$$
\varphi'(s)=1+c_{s}-\frac{s^{2}}{c_{s}}=\frac{c_{s}+1-2s^{2}}{c_{s}}=\frac{(2c_{s}-1)(c_{s}+1)}{c_{s}} .
$$
これは $c_{s}>\frac12$（$s<\frac{\sqrt3}{2}$）で正、$s>\frac{\sqrt3}{2}$ で負なので、$\varphi$ の最大値は $\varphi(\frac{\sqrt3}{2})=\frac{\sqrt3}{2}(1+\frac12)=\frac{3\sqrt3}{4}$。よって $\rho\ge1$ での $g$ の最大値は $\sqrt{3\sqrt3/2}=(27/4)^{1/4}$（$\rho=\frac{2}{\sqrt3}$ で達成）で、$\sqrt2$ より大きい（$2<\frac{3\sqrt3}{2}$ は $16<27$ から）。以上から $\sup g=c$。

**2.** $\lambda_{f}(t)=|\{|x|<t^{-2}\}|=2t^{-2}$、$\lambda_{Mf}(t)=|\{|x|<c^{2}t^{-2}\}|=2c^{2}t^{-2}$。よって $t\lambda_{f}(t)^{1/2}=\sqrt2$, $t\lambda_{Mf}(t)^{1/2}=\sqrt2\,c$。（$f$ は $L^{2}$ に入らない弱 $L^{2}$ の関数で、$M$ はその弱 $L^{2}$ ノルムを $c$ 倍にする。）
:::

::: problem ★★ 標準：局所的にも可積分でない極大関数 {#four:ex-mf-2}
$n=1$ とし、$0<|x|<\frac12$ で $f(x)\defeq\dfrac{1}{|x|(\log\frac{1}{|x|})^{2}}$、それ以外で $f(x)\defeq0$ とする。
1. $f\in L^{1}$ で $\|f\|_{1}=\frac{2}{\log2}$ を示せ。
2. $0<x<\frac12$ で $Mf(x)\ge\dfrac{1}{2x\log\frac1x}$ を示し、$\int_{(-1/2,1/2)}Mf=\infty$ を導け。
3. 一方、$1<p\le\infty$ で $g\in L^{p}$ が有界区間 $I$ の外で $0$ なら $\int_{I}Mg<\infty$ であることを示せ。
:::

::: solution
**1.** $0<y<1$ で $\frac{d}{dy}\frac{1}{\log(1/y)}=\frac{1}{y(\log(1/y))^{2}}$ で、$y\to0$ で $\frac{1}{\log(1/y)}\to0$。よって $0<x<\frac12$ について $\int_{0}^{x}f=\frac{1}{\log(1/x)}$（\ref{meas:improper-lebesgue.1}）、$f$ は偶関数なので $\|f\|_{1}=\frac{2}{\log2}$。

**2.** $B(x,2x)=(-x,3x)\supset(-x,x)$ なので、1 の計算から
$$
Mf(x)\ge\frac{1}{4x}\int_{-x}^{x}f=\frac{1}{4x}\cdot\frac{2}{\log(1/x)}=\frac{1}{2x\log(1/x)} .
$$
$\frac{d}{dx}\bigl(-\log\log\frac1x\bigr)=\frac{1}{x\log(1/x)}$ で、$x\to0$ で $\log\log\frac1x\to\infty$ なので $\int_{0}^{1/4}\frac{dx}{x\log(1/x)}=\infty$。よって $\int_{(-1/2,1/2)}Mf=\infty$。\ref{four:maximal-not-l1} は遠方での減衰 $|x|^{-1}$ による障害だったが、ここでは $f$ の台の中で $Mf$ が可積分でない。

**3.** $p<\infty$ ならヘルダーの不等式と \ref{four:maximal-lp} から $\int_{I}Mg\le|I|^{1/p'}\|Mg\|_{p}\le|I|^{1/p'}A_{p}^{M}\|g\|_{p}$。$p=\infty$ なら $Mg\le\|g\|_{\infty}$ から。したがって局所的な障害は $p=1$ に特有である。（\ref{four:maximal-not-l1} の後の補足で述べた $L\log L$ の条件とも合う：$y>0$ が小さければ $y^{1/2}(\log\frac1y)^{2}\le1$ なので $f(y)\ge y^{-1/2}$、$\log f(y)\ge\frac12\log\frac1y$、よって $f\log f\ge\frac{1}{2y\log(1/y)}$ は $0$ の近くで可積分でない。）
:::

## ポアソン積分とフェイェール平均 {#four:sec-pf-exercises}

対応するページ：\ref{four:page-poisson-fejer}

::: problem ★ 基本：区間の指示関数のポアソン積分 {#four:ex-pf-1}
$n=1$, $f\defeq\mathbf{1}_{[-1,1]}$ とし、$u(x,t)\defeq(P_{t}*f)(x)$ とする。
1. $u(x,t)=\frac1\pi\bigl(\arctan\frac{x+1}{t}-\arctan\frac{x-1}{t}\bigr)$ を示せ。
2. $t\to0$ のとき、$|x|<1$ で $u\to1$、$|x|>1$ で $u\to0$、$x=\pm1$ で $u\to\frac12$ を示せ。$\pm1$ は $f$ のルベーグ点でないことを確かめよ。
3. $x>1$ について $\sup_{t>0}u(x,t)=\frac1\pi\arcsin\frac1x$ を示し、$Mf(x)=\frac{1}{1+x}$ と比べよ。\ref{four:poisson-boundary.2} の定数 $1$ は小さくできないことを導け。
:::

::: solution
**1.** $P_{t}(z)=\frac1\pi\frac{t}{t^{2}+z^{2}}$ で、$\frac{d}{dy}\bigl(-\frac1\pi\arctan\frac{x-y}{t}\bigr)=\frac1\pi\frac{t}{t^{2}+(x-y)^{2}}$ なので
$$
u(x,t)=\int_{-1}^{1}P_{t}(x-y)\,dy=\frac1\pi\Bigl(\arctan\frac{x+1}{t}-\arctan\frac{x-1}{t}\Bigr).
$$

**2.** $|x|<1$ なら $\frac{x+1}{t}\to+\infty$, $\frac{x-1}{t}\to-\infty$ で $u\to\frac1\pi(\frac\pi2+\frac\pi2)=1$。$|x|>1$ なら二つの比は同じ符号の無限大に近づき $u\to0$。$x=1$ なら $u=\frac1\pi\arctan\frac2t\to\frac12$、$x=-1$ も同様。$0<r<2$ なら、$f$ は $[1-r,1]$ で $1$、$(1,1+r]$ で $0$ なので、$f(1)$ にどの値を与えても
$$
\frac{1}{2r}\int_{1-r}^{1+r}|f(y)-f(1)|\,dy=\frac{r|1-f(1)|+r|f(1)|}{2r}\ge\frac12
$$
（$|1-f(1)|+|f(1)|\ge1$）で、$0$ に近づかない。よって $1$ はルベーグ点でなく（$-1$ も同様）、\ref{four:poisson-boundary.3} の結論はそこでは保証されない。実際に極限 $\frac12$ は $f(\pm1)=1$ と異なる。

**3.** $x>1$ なら $a\defeq\frac{x+1}{t}>b\defeq\frac{x-1}{t}>0$ で、$\theta\defeq\arctan a-\arctan b\in(0,\frac\pi2)$、
$$
\tan\theta=\frac{a-b}{1+ab}=\frac{2/t}{1+(x^{2}-1)/t^{2}}=\frac{2t}{t^{2}+x^{2}-1}\le\frac{1}{\sqrt{x^{2}-1}}
$$
（相加相乗平均 $t^{2}+(x^{2}-1)\ge2t\sqrt{x^{2}-1}$、等号は $t=\sqrt{x^{2}-1}$）。$\arctan$ は増加なので $\sup_{t}u(x,t)=\frac1\pi\arctan\frac{1}{\sqrt{x^{2}-1}}=\frac1\pi\arcsin\frac1x$（斜辺 $x$、辺 $1$, $\sqrt{x^{2}-1}$ の直角三角形）。

一方、$g\defeq\mathbf{1}_{[0,1]}$ について $f(y)=g(\frac{y+1}{2})$ で、球（区間）の上の平均はアフィン変換 $y\mapsto\frac{y+1}{2}$ で保たれるので $Mf(x)=Mg(\frac{x+1}{2})$。\ref{four:prob-mf-indicator} から $\frac{x+1}{2}\ge1$ で $Mg(\frac{x+1}{2})=\frac{1}{x+1}$。\ref{four:poisson-boundary.2} のとおり $\frac1\pi\arcsin\frac1x\le\frac{1}{1+x}$ で、$x\downarrow1$ では両辺とも $\frac12$ に近づく。よって $\sup_{t}|P_{t}*f|\le C\,Mf$ がすべての $f$ で成り立つなら $C\ge1$。（$x\to\infty$ では比は $\frac1\pi$ に近づく。）
:::

::: problem ★★ 標準：ド・ラ・ヴァレ・プーサン平均 {#four:ex-pf-2}
$f\in L^{1}(\mathbb{T})$, $N\ge1$ について $V_{N}f\defeq2\sigma_{2N}f-\sigma_{N}f$ とおく。
1. $V_{N}f=\sum_{|n|\le N}\hat f(n)e_{n}+\sum_{N<|n|<2N}\bigl(2-\frac{|n|}{N}\bigr)\hat f(n)e_{n}$ を示せ。とくに次数 $N$ 以下の三角多項式 $P$ について $V_{N}P=P$。
2. すべての $x$ で $\sup_{N}|V_{N}f(x)|\le6M_{\mathbb{T}}f(x)$、$1\le p\le\infty$ で $\|V_{N}f\|_{p}\le3\|f\|_{p}$ を示せ。
3. $E_{N}(f)_{p}\defeq\inf\{\|f-P\|_{p}:P\text{ は次数 }N\text{ 以下の三角多項式}\}$ とおくと $\|V_{N}f-f\|_{p}\le4E_{N}(f)_{p}$ を示せ。
4. ほとんどすべての $x$ で $V_{N}f(x)\to f(x)$、$1\le p<\infty$ なら $L^{p}$ でも収束することを示せ。
:::

::: solution
**1.** \ref{four:kernel-formulas.1} から $\sigma_{M}f=\sum_{|n|<M}(1-\frac{|n|}{M})\hat f(n)e_{n}$。$|n|<N$ では係数は $2(1-\frac{|n|}{2N})-(1-\frac{|n|}{N})=1$、$N\le|n|<2N$ では $2(1-\frac{|n|}{2N})=2-\frac{|n|}{N}$（$|n|=N$ では $1$）。$P$ が次数 $N$ 以下なら $\hat P(n)=0$（$|n|>N$）なので（\ref{four:coefficients-basic.3}）$V_{N}P=\sum_{|n|\le N}\hat P(n)e_{n}=P$。

**2.** \ref{four:fejer-ae.1} から $|V_{N}f|\le2|\sigma_{2N}f|+|\sigma_{N}f|\le2\cdot2M_{\mathbb{T}}f+2M_{\mathbb{T}}f$。また \ref{four:fejer-theorem.3} から $\|V_{N}f\|_{p}\le2\|\sigma_{2N}f\|_{p}+\|\sigma_{N}f\|_{p}\le3\|f\|_{p}$。

**3.** $P$ を次数 $N$ 以下の三角多項式とする。1 と線形性から $V_{N}f-f=V_{N}(f-P)-(f-P)$ なので、2 から $\|V_{N}f-f\|_{p}\le4\|f-P\|_{p}$。$P$ について下限をとる。

**4.** \ref{four:fejer-ae.3} から、ほとんどすべての $x$ で $\sigma_{2N}f(x)\to f(x)$ かつ $\sigma_{N}f(x)\to f(x)$ なので $V_{N}f(x)\to2f(x)-f(x)=f(x)$。$p<\infty$ なら $\sigma_{N}f$ は次数 $N$ 以下で $E_{N}(f)_{p}\le\|f-\sigma_{N}f\|_{p}\to0$（\ref{four:fejer-theorem.2}）なので、3 から $L^{p}$ 収束する。（フェイェール平均と違い、$V_{N}f$ は最良近似の定数倍の精度をもつ。）
:::

## カルデロン–ジグムント分解とヒルベルト変換 {#four:sec-ht-exercises}

対応するページ：\ref{four:page-hilbert-transform}

::: problem ★ 基本：sinc 関数のヒルベルト変換 {#four:ex-ht-1}
$s(x)\defeq\frac{\sin x}{x}$（$s(0)\defeq1$）とする。
1. $a\defeq\frac{1}{2\pi}$, $g\defeq\pi\mathbf{1}_{[-a,a]}$ について $\hat g=s$、$\mathcal{F}s=g$ を示せ。
2. $Hs(x)=\frac{1-\cos x}{x}$（a.e.）を示せ。
3. $\|Hs\|_{2}=\|s\|_{2}$ から $\int_{\mathbb{R}}\frac{\sin^{4}u}{u^{2}}du=\frac\pi2$ を導け。
:::

::: solution
**1.** $\hat g(x)=\pi\int_{-a}^{a}e^{-2\pi ix\xi}d\xi=\pi\cdot\frac{2\sin(2\pi ax)}{2\pi x}=\frac{\sin x}{x}$（$x\ne0$）、$\hat g(0)=2\pi a=1$。$g\in L^{1}\cap L^{2}$ なので $\mathcal{F}g=s$、とくに $s\in L^{2}$。$L^{1}\cap L^{2}$ 上で $\check h(x)=\hat h(-x)$ で、両辺は $h$ について $L^{2}$ で連続な等長写像なので、\ref{four:plancherel.1} の延長について $\mathcal{F}^{-}h=(\mathcal{F}h)(-\,\cdot)$（$h\in L^{2}$）。\ref{four:plancherel.2} から $g=\mathcal{F}^{-}\mathcal{F}g=(\mathcal{F}s)(-\,\cdot)$、$g$ は偶関数なので $\mathcal{F}s=g$。

**2.** \ref{four:ht-l2} から $Hs=\mathcal{F}^{-1}(m\,g)$ で、$mg\in L^{1}\cap L^{2}$ なので右辺は逆変換の積分で与えられる。$x\ne0$ で
$$
\begin{aligned}Hs(x)&=-i\pi\int_{0}^{a}\bigl(e^{2\pi ix\xi}-e^{-2\pi ix\xi}\bigr)d\xi=2\pi\int_{0}^{a}\sin(2\pi x\xi)\,d\xi\\&=2\pi\cdot\frac{1-\cos(2\pi ax)}{2\pi x}=\frac{1-\cos x}{x}.\end{aligned}
$$
（負の側は $\xi\mapsto-\xi$ と置き換えた。）$s+iHs=\frac{\sin x+i-i\cos x}{x}=\frac{-i(e^{ix}-1)}{x}$ で、その $\mathcal{F}$ は $2\mathbf{1}_{(0,\infty)}g$ と一致する（\ref{four:prob-ht-real}）。

**3.** \ref{four:ht-l2.2} と \ref{four:plancherel.2} から $\|Hs\|_{2}^{2}=\|s\|_{2}^{2}=\|g\|_{2}^{2}=\pi^{2}\cdot2a=\pi$。$1-\cos x=2\sin^{2}\frac x2$ なので、$x=2u$ と置き換えると
$$
\pi=\int\frac{4\sin^{4}(x/2)}{x^{2}}dx=\int\frac{4\sin^{4}u}{4u^{2}}\,2\,du=2\int\frac{\sin^{4}u}{u^{2}}du .
$$
:::

::: problem ★★ 標準：区間の指示関数のヒルベルト変換の分布関数 {#four:ex-ht-2}
$f\defeq\mathbf{1}_{[0,1]}$ とする。
1. ほとんどすべての $x\in\mathbb{R}$（$[0,1]$ の中も含む）で $Hf(x)=\frac1\pi\log\bigl|\frac{x}{x-1}\bigr|$ を示せ。
2. $\alpha>0$ について $\lambda_{Hf}(\alpha)=\dfrac{2}{\sinh(\pi\alpha)}$ を示し、$[Hf]_{1}=\frac2\pi$ を導け。
3. $Hf\in L^{p}$ $\iff$ $1<p<\infty$ を確かめ、$\|Hf\|_{2}=\|f\|_{2}$ から $\int_{0}^{\infty}\frac{u}{\sinh u}du=\frac{\pi^{2}}{4}$ を導け。
:::

::: solution
**1.** $\varepsilon_{k}\defeq\frac1k$, $R_{k}\defeq k$ とする。$x\notin\{0,1\}$ を固定し、$k$ を $\varepsilon_{k}<\min(|x|,|x-1|)$, $R_{k}>|x|+1$ となるほど大きくとる。$f(x-y)\ne0\iff x-1\le y\le x$ なので
$$
H_{\varepsilon_{k},R_{k}}f(x)=\frac1\pi\int_{\{\varepsilon_{k}<|y|\}\cap[x-1,x]}\frac{dy}{y}.
$$
$0<x<1$ なら積分範囲は $[x-1,-\varepsilon_{k})\cup(\varepsilon_{k},x]$ で、値は $\frac1\pi\bigl(\log\frac{\varepsilon_{k}}{1-x}+\log\frac{x}{\varepsilon_{k}}\bigr)=\frac1\pi\log\frac{x}{1-x}$。$x>1$ なら $[x-1,x]\subset(\varepsilon_{k},\infty)$ で $\frac1\pi\log\frac{x}{x-1}$、$x<0$ なら $\frac1\pi\log\frac{|x|}{|x-1|}$。いずれも $h(x)\defeq\frac1\pi\log|\frac{x}{x-1}|$ に等しい。一方 \ref{four:ht-l2.3} から $H_{\varepsilon_{k},R_{k}}f\to Hf$（$L^{2}$）で、\ref{meas:riesz-fischer} からある部分列がほとんど至る所 $Hf$ に収束する。よって $Hf=h$（a.e.）。

**2.** $c\defeq e^{\pi\alpha}>1$ とする。$|h(x)|>\alpha$ $\iff$ $|x|>c|x-1|$ または $c|x|<|x-1|$。前者は $(c^{2}-1)x^{2}-2c^{2}x+c^{2}<0$、根は $\frac{c^{2}\pm c}{c^{2}-1}$ なので $\frac{c}{c+1}<x<\frac{c}{c-1}$（$x\ne1$）で、長さは $\frac{c}{c-1}-\frac{c}{c+1}=\frac{2c}{c^{2}-1}$。後者は $x\mapsto1-x$ で前者に移るので同じ長さ。二つは交わらない（両方なら $|x|>c|x-1|>c^{2}|x|$）。よって
$$
\lambda_{Hf}(\alpha)=\frac{4c}{c^{2}-1}=\frac{4}{c-c^{-1}}=\frac{2}{\sinh(\pi\alpha)} .
$$
$\sinh u\ge u$ から $\alpha\lambda_{Hf}(\alpha)\le\frac2\pi$ で、$\alpha\to0$ で $\frac2\pi$ に近づく。よって $[Hf]_{1}=\frac2\pi$（$\|f\|_{1}=1$。\ref{four:ht-weak-type} の定数 $10+\frac8\pi$ よりずっと小さい）。

**3.** \ref{four:layer-cake.1} から $\|Hf\|_{p}^{p}=2p\int_{0}^{\infty}\frac{\alpha^{p-1}}{\sinh(\pi\alpha)}d\alpha$。$\alpha\to\infty$ では $\sinh(\pi\alpha)\ge\frac14e^{\pi\alpha}$（$\alpha\ge1$）で可積分、$0<\alpha\le1$ では $\pi\alpha\le\sinh(\pi\alpha)\le\sinh(\pi)\alpha$（$\sinh$ は凸）なので被積分関数は $\alpha^{p-2}$ と同程度で、$p>1$ のときだけ可積分。$p=\infty$ では $Hf$ は $0$ の近くで非有界。$p=2$ では $\|Hf\|_{2}^{2}=4\int_{0}^{\infty}\frac{\alpha\,d\alpha}{\sinh\pi\alpha}=\frac{4}{\pi^{2}}\int_{0}^{\infty}\frac{u\,du}{\sinh u}$（$u=\pi\alpha$）で、\ref{four:ht-l2.2} から左辺は $\|f\|_{2}^{2}=1$。
:::

::: problem ★★★ 発展：共役ポアソン積分 {#four:ex-ht-3}
$t>0$ について $Q_{t}(x)\defeq\frac{1}{\pi}\frac{x}{t^{2}+x^{2}}$ とおく（$Q_{t}\in L^{2}$ だが $Q_{t}\notin L^{1}$）。$f\in L^{2}(\mathbb{R})$ について $u(x,t)\defeq(P_{t}*f)(x)$, $v(x,t)\defeq\int Q_{t}(x-y)f(y)\,dy$ とおく。
1. $HP_{t}=Q_{t}$、$\mathcal{F}Q_{t}(\xi)=-i\operatorname{sgn}\xi\,e^{-2\pi t|\xi|}$ を示せ。
2. すべての $(x,t)$ で $v(x,t)=(P_{t}*Hf)(x)$ を示せ。
3. $\sup_{t>0}|v(x,t)|\le M(Hf)(x)$（すべての $x$）、ほとんどすべての $x$ で $v(x,t)\to Hf(x)$（$t\to0$）を示せ。$1<p<\infty$, $f\in L^{2}\cap L^{p}$ なら $\|\sup_{t}|v(\cdot,t)|\|_{p}\le A_{p}^{M}A_{p}^{H}\|f\|_{p}$ を示せ。
4. $z=x+it$ について $u+iv=\frac{i}{\pi}\int\frac{f(y)}{z-y}dy$ で、これは上半平面で正則であることを示せ。
:::

::: solution
**Step 1.** 【主張：項目 1】 \ref{four:poisson-kernel-basic.2} から $\widehat{P_{t}}(\xi)=e^{-2\pi t|\xi|}$ で、$P_{t}$ と $m\widehat{P_{t}}$ は $L^{1}\cap L^{2}$ に入る。\ref{four:ht-l2} から $HP_{t}=\mathcal{F}^{-1}(m\widehat{P_{t}})$ は逆変換の積分で、$\xi<0$ の側を $\xi\mapsto-\xi$ と置き換えると
$$
\begin{aligned}HP_{t}(x)&=-i\Bigl(\int_{0}^{\infty}e^{-2\pi\xi(t-ix)}d\xi-\int_{0}^{\infty}e^{-2\pi\xi(t+ix)}d\xi\Bigr)\\&=\frac{-i}{2\pi}\Bigl(\frac{1}{t-ix}-\frac{1}{t+ix}\Bigr)=\frac{-i}{2\pi}\cdot\frac{2ix}{t^{2}+x^{2}}=Q_{t}(x).\end{aligned}
$$
よって $\mathcal{F}Q_{t}=\mathcal{F}HP_{t}=m\,e^{-2\pi t|\xi|}$。$Q_{t}\notin L^{1}$ は $|x|\to\infty$ で $Q_{t}(x)\sim\frac{1}{\pi x}$ から。

**Step 2.** $x\in\mathbb{R}$ を固定し、$\tau_{x}h(y)\defeq h(y-x)$ とおく。【主張：$h\in L^{2}$ について $\mathcal{F}(\tau_{x}h)(\xi)=e^{-2\pi ix\xi}\mathcal{F}h(\xi)$】 $L^{1}\cap L^{2}$ 上では \ref{four:transform-basic.2}。両辺は $h$ について $L^{2}$ で連続で、$L^{1}\cap L^{2}$ は $L^{2}$ で稠密なので $L^{2}$ 全体で成り立つ。

**Step 3.** 【主張：項目 2】 $P_{t}$ は偶関数、$Q_{t}$ は奇関数で、どちらも実数値。よって $P_{t}(x-y)=\tau_{x}P_{t}(y)$, $Q_{t}(x-y)=-\tau_{x}Q_{t}(y)$ で、どちらも $L^{2}$ に入るので、$u$, $v$, $P_{t}*Hf$ の積分はコーシー–シュワルツの不等式から絶対収束する。\ref{four:plancherel.2}、Step 2、\ref{four:ht-l2} から
$$
\begin{aligned}(P_{t}*Hf)(x)&=\langle Hf,\tau_{x}P_{t}\rangle=\int m(\xi)\mathcal{F}f(\xi)\,e^{2\pi ix\xi}e^{-2\pi t|\xi|}d\xi,\\v(x,t)&=-\langle f,\tau_{x}Q_{t}\rangle=-\int\mathcal{F}f(\xi)\,e^{2\pi ix\xi}\,\overline{m(\xi)}\,e^{-2\pi t|\xi|}d\xi .\end{aligned}
$$
$\overline{m}=-m$ なので二つは等しい。

**Step 4.** 【主張：項目 3】 $Hf\in L^{2}$ なので、2 と \ref{four:poisson-boundary.2}・\ref{four:poisson-boundary.3}（$f$ の代わりに $Hf$）から、すべての $x$ で $\sup_{t}|v(x,t)|\le M(Hf)(x)$、$Hf$ のルベーグ点（ほとんどすべての点）で $v(x,t)\to Hf(x)$。$f\in L^{2}\cap L^{p}$ なら \ref{four:ht-lp.1}・\ref{four:ht-lp.2} から $\|Hf\|_{p}\le A_{p}^{H}\|f\|_{p}$ で、\ref{four:maximal-lp} から $\|M(Hf)\|_{p}\le A_{p}^{M}\|Hf\|_{p}$。

**Step 5.** 【主張：項目 4】 $w\defeq x-y$ とすると
$$
\begin{aligned}P_{t}(w)+iQ_{t}(w)&=\frac{t+iw}{\pi(t^{2}+w^{2})}=\frac{t+iw}{\pi(t+iw)(t-iw)}\\&=\frac{1}{\pi(t-iw)}=\frac{i}{\pi(w+it)}=\frac{i}{\pi(z-y)} .\end{aligned}
$$
正則性：$z$ を固定し、複素数 $h_{k}\to0$, $0<|h_{k}|<\frac t2$ とする。$|z-y|\ge t$ から $|z+h_{k}-y|\ge|z-y|-\frac t2\ge\frac12|z-y|$ なので
$$
\Bigl|\frac{1}{h_{k}}\Bigl(\frac{1}{z+h_{k}-y}-\frac{1}{z-y}\Bigr)\Bigr|=\frac{1}{|z+h_{k}-y||z-y|}\le\frac{2}{|z-y|^{2}}\le\frac{2}{t^{2}+(x-y)^{2}} .
$$
右辺と $|f|$ の積は（$L^{2}$ どうしの積なので）可積分で、差分商は $-(z-y)^{-2}$ に収束する。\ref{meas:dominated-convergence} から $u+iv$ は $z$ で複素微分可能。

（$v$ は $u$ の調和共役で、境界値は $Hf$。ヒルベルト変換は「上半平面の正則関数の実部の境界値から虚部の境界値を作る作用素」である。）
:::

## 共役関数とフーリエ級数の Lᵖ 収束 {#four:sec-cj-exercises}

対応するページ：\ref{four:page-conjugate-function}

::: problem ★ 基本：共役ポアソン核と p = 1 での破綻 {#four:ex-cj-1}
$0\le r<1$, $\theta\defeq2\pi x$, $z\defeq re^{i\theta}$ とし、$P_{r}$ を円周上のポアソン核とする。
1. $Q_{r}(x)\defeq\sum_{n\in\mathbb{Z}}(-i\operatorname{sgn}n)r^{|n|}e_{n}(x)=\dfrac{2r\sin\theta}{1-2r\cos\theta+r^{2}}$ を示し、$P_{r}+iQ_{r}=\frac{1+z}{1-z}$ を確かめよ。
2. $x\notin\mathbb{Z}$ で $Q_{r}(x)\to\cot(\pi x)$（$r\uparrow1$）を示し、$\|Q_{r}\|_{L^{1}(\mathbb{T})}\to\infty$ を導け。
3. 三角多項式 $P$ について $\|\tilde P\|_{1}\le C\|P\|_{1}$ となる定数 $C$ はないことを示せ。
:::

::: solution
**1.** 級数は $\sum r^{|n|}<\infty$ で絶対一様収束する。$n\ge1$ の項と $-n$ の項をまとめると $(-i)(e_{n}-e_{-n})r^{n}=2r^{n}\sin(n\theta)$ なので、$|z|<1$ の等比級数から
$$
\begin{aligned}Q_{r}&=2\operatorname{Im}\sum_{n\ge1}z^{n}=2\operatorname{Im}\frac{z}{1-z}=2\operatorname{Im}\frac{z(1-\bar z)}{|1-z|^{2}}\\&=2\operatorname{Im}\frac{z-r^{2}}{|1-z|^{2}}=\frac{2r\sin\theta}{1-2r\cos\theta+r^{2}} .\end{aligned}
$$
また $\frac{1+z}{1-z}=\frac{(1+z)(1-\bar z)}{|1-z|^{2}}=\frac{1-r^{2}+2ir\sin\theta}{|1-z|^{2}}$ の実部は \ref{four:fejer-ae.2} の $P_{r}$、虚部は $Q_{r}$。

**2.** $x\notin\mathbb{Z}$ なら $1-\cos\theta>0$ で、$Q_{r}(x)\to\frac{2\sin\theta}{2-2\cos\theta}=\frac{2\sin\frac\theta2\cos\frac\theta2}{2\sin^{2}\frac\theta2}=\cot\frac\theta2=\cot(\pi x)$。$0<x\le\frac14$ では $\cos\pi x\ge\frac{1}{\sqrt2}$, $\sin\pi x\le\pi x$ なので $\cot\pi x\ge\frac{1}{\sqrt2\pi x}$、よって $\int_{-1/2}^{1/2}|\cot\pi x|dx=\infty$。\ref{meas:fatou} から $\liminf_{r\uparrow1}\|Q_{r}\|_{1}\ge\int|\cot\pi x|dx=\infty$。

**3.** そのような $C$ があるとする。$P_{r,N}\defeq\sum_{|n|\le N}r^{|n|}e_{n}$ とおくと、定義から $\widetilde{P_{r,N}}=\sum_{|n|\le N}(-i\operatorname{sgn}n)r^{|n|}e_{n}$。$N\to\infty$ で $P_{r,N}\to P_{r}$, $\widetilde{P_{r,N}}\to Q_{r}$（一様収束、誤差は $2\sum_{n>N}r^{n}$ 以下）なので、$\|Q_{r}\|_{1}\le C\|P_{r}\|_{1}=C$（$P_{r}>0$, $\int P_{r}=1$ は \ref{four:fejer-ae.2}）。これはすべての $r$ で成り立つので 2 に反する。（\ref{four:ht-m-riesz} は $p=1$ に延ばせない。）
:::

::: problem ★★ 標準：p = 4 での共役関数の評価 {#four:ex-cj-2}
1. $P$ を実数値の三角多項式で $\hat P(0)=0$ とする。$F\defeq P+i\tilde P$ について $\int_{\mathbb{T}}F^{4}=0$ を示し、これから $\|\tilde P\|_{4}\le(1+\sqrt2)\|P\|_{4}$ を導け。
2. すべての三角多項式 $P$ について $\|\tilde P\|_{4}\le4(1+\sqrt2)\|P\|_{4}$ を示し、\ref{four:ht-m-riesz.2} の延長について $L^{4}(\mathbb{T})$ 上の作用素ノルムが $4(1+\sqrt2)$ 以下であることを導け。
:::

::: solution
**1.** $P=\sum_{|n|\le N}c_{n}e_{n}$ とする。$P$ が実数値 $\iff$ $c_{-n}=\overline{c_{n}}$（\ref{four:coefficients-basic.3} と $\overline{e_{n}}=e_{-n}$）。$\tilde P$ の係数 $d_{n}=-i\operatorname{sgn}n\,c_{n}$ は $d_{-n}=i\operatorname{sgn}n\,\overline{c_{n}}=\overline{d_{n}}$ を満たすので、$\tilde P$ も実数値。$F$ の係数は $(1+\operatorname{sgn}n)c_{n}$ で、$c_{0}=0$ から $F=\sum_{n=1}^{N}2c_{n}e_{n}$。$F^{4}$ は $e_{m}$（$4\le m\le4N$）の一次結合なので $\int F^{4}=0$。

$a\defeq P$, $b\defeq\tilde P$（実数）とすると $\operatorname{Re}(a+ib)^{4}=a^{4}-6a^{2}b^{2}+b^{4}$。実部をとって積分し、コーシー–シュワルツの不等式 $\int a^{2}b^{2}\le\|a\|_{4}^{2}\|b\|_{4}^{2}$ を使うと
$$
\int b^{4}=6\int a^{2}b^{2}-\int a^{4}\le6\|a\|_{4}^{2}\|b\|_{4}^{2}-\|a\|_{4}^{4}.
$$
$X\defeq\|b\|_{4}^{2}$, $Y\defeq\|a\|_{4}^{2}$ とおくと $X^{2}-6XY+Y^{2}\le0$ で、$X$ についての 2 次式の根は $(3\pm2\sqrt2)Y$ なので $X\le(3+2\sqrt2)Y$。$3+2\sqrt2=(1+\sqrt2)^{2}$ から主張が従う。

**2.** $P$ を三角多項式とし、$A\defeq\frac12(P+\bar P)$, $B\defeq\frac{1}{2i}(P-\bar P)$ とおくと、これらは実数値の三角多項式で $P=A+iB$、$\|A\|_{4},\|B\|_{4}\le\|P\|_{4}$。$\widetilde{A-\hat A(0)}=\tilde A$ で、$|\hat A(0)|\le\|A\|_{1}\le\|A\|_{4}$ から $\|A-\hat A(0)\|_{4}\le2\|A\|_{4}$。1 から $\|\tilde A\|_{4}\le2(1+\sqrt2)\|P\|_{4}$、$B$ も同様で、$\tilde P=\tilde A+i\tilde B$ から $\|\tilde P\|_{4}\le4(1+\sqrt2)\|P\|_{4}$。

$f\in L^{4}(\mathbb{T})$ なら $\sigma_{N}f\to f$（$L^{4}$、\ref{four:fejer-theorem.2}）で、$\sigma_{N}f$ は三角多項式。\ref{four:ht-m-riesz.2} の延長は $L^{4}$ で連続なので $\|\tilde f\|_{4}=\lim\|\widetilde{\sigma_{N}f}\|_{4}\le4(1+\sqrt2)\lim\|\sigma_{N}f\|_{4}=4(1+\sqrt2)\|f\|_{4}$。$f$ が実数値で $\hat f(0)=0$ なら $\sigma_{N}f$ もそうなので（係数の形から）、定数は $1+\sqrt2$ にできる。

（$1+\sqrt2=\cot\frac\pi8$ は、\ref{four:page-hilbert-transform} の補足で述べた最良定数 $\cot\frac{\pi}{2p}$ の $p=4$ の値で、実数値の関数についての共役関数の最良定数でもあることが知られている。$p=2k$ でも $\int F^{2k}=0$ から同様の議論で評価が得られる。）
:::

## 特異積分作用素 {#four:sec-si-exercises}

対応するページ：\ref{four:page-singular-integrals}

::: problem ★ 基本：R₁R₂ の核 {#four:ex-si-1}
$n=2$, $\Omega(\theta)\defeq\theta_{1}\theta_{2}$, $K(x)\defeq\Omega(x')/|x|^{2}=\frac{x_{1}x_{2}}{|x|^{4}}$ とする。
1. $\Omega$ が \ref{four:si-homogeneous} の前提を満たすことを確かめよ。
2. $\int_{-\pi}^{\pi}\cos2\psi\,\log|\cos\psi|\,d\psi=\pi$ を示せ。
3. \ref{four:si-homogeneous-multiplier} の $m$ が $m(\xi)=-\pi\frac{\xi_{1}\xi_{2}}{|\xi|^{2}}$ であることを示し、$L^{2}$ 上で $R_{1}R_{2}=\frac1\pi T_{\Omega}$、すなわち $f\in\mathcal{S}$ について $R_{1}R_{2}f(x)=\mathrm{p.v.}\frac1\pi\int\frac{y_{1}y_{2}}{|y|^{4}}f(x-y)\,dy$（a.e.）を導け。
:::

::: solution
**準備.** $n=2$ では、$\Phi(r,\varphi)=(r\cos\varphi,r\sin\varphi)$ は $(0,\infty)\times(0,2\pi)$ から $\mathbb{R}^{2}$ の半直線を除いた集合（補集合は零集合）への $C^{1}$ 微分同相で、ヤコビアンは $r$。\ref{meas:change-of-variables} から $\int g=\int_{0}^{\infty}\int_{0}^{2\pi}g(r\cos\varphi,r\sin\varphi)\,d\varphi\,r\,dr$ で、\ref{four:si-polar} の一意性から $\int_{S^{1}}u\,d\sigma=\int_{0}^{2\pi}u(\cos\varphi,\sin\varphi)\,d\varphi$。

**1.** $\tilde\Omega(x)=\frac{x_{1}x_{2}}{|x|^{2}}$ は $\mathbb{R}^{2}\setminus\{0\}$ で $C^{\infty}$。$\int_{0}^{2\pi}\cos\varphi\sin\varphi\,d\varphi=\frac12\int_{0}^{2\pi}\sin2\varphi\,d\varphi=0$。

**2.** $|\cos\psi|$, $\cos2\psi$ は周期 $\pi$ なので、求める積分は $2J$, $J\defeq\int_{-\pi/2}^{\pi/2}\cos2\psi\log\cos\psi\,d\psi$。$|\cos2\psi\log\cos\psi|\le|\log\cos\psi|$ は可積分なので、$J=\lim_{b\uparrow\pi/2}\int_{-b}^{b}$（\ref{meas:dominated-convergence}）。$(\frac12\sin2\psi)'=\cos2\psi$, $(\log\cos\psi)'=-\tan\psi$, $\frac12\sin2\psi\tan\psi=\sin^{2}\psi$ から、部分積分で
$$
\int_{-b}^{b}\cos2\psi\log\cos\psi\,d\psi=\sin2b\,\log\cos b+\int_{-b}^{b}\sin^{2}\psi\,d\psi .
$$
$\sin2b\log\cos b=2\sin b\,(\cos b\log\cos b)\to0$、$\int_{-\pi/2}^{\pi/2}\sin^{2}\psi\,d\psi=\frac\pi2$。よって $J=\frac\pi2$、積分は $\pi$。

**3.** $\Omega$ は偶関数、$\theta\mapsto\operatorname{sgn}(\theta\cdot\xi)$ は奇関数なので、\ref{four:si-sphere-lemma.1} から $m$ の第 1 項は $0$。$\xi'=(\cos\alpha,\sin\alpha)$ とし、$\varphi=\psi+\alpha$ と置き換える（周期性）と、$\cos\varphi\sin\varphi=\frac12(\sin2\psi\cos2\alpha+\cos2\psi\sin2\alpha)$ から
$$
m(\xi)=-\frac12\int_{-\pi}^{\pi}\bigl(\sin2\psi\cos2\alpha+\cos2\psi\sin2\alpha\bigr)\log|\cos\psi|\,d\psi .
$$
$\sin2\psi\log|\cos\psi|$ は奇関数で積分 $0$、残りは 2 から $-\frac\pi2\sin2\alpha=-\pi\frac{\xi_{1}\xi_{2}}{|\xi|^{2}}$。

\ref{four:si-riesz-multiplier.1} から $R_{1}R_{2}$ の乗数は $(-i\frac{\xi_{1}}{|\xi|})(-i\frac{\xi_{2}}{|\xi|})=-\frac{\xi_{1}\xi_{2}}{|\xi|^{2}}=\frac1\pi m(\xi)$。乗数が等しいので $R_{1}R_{2}=\frac1\pi T_{\Omega}$（$L^{2}$ 上）で、\ref{four:si-homogeneous.3} から $f\in\mathcal{S}$ では主値の積分になる。（$R_{1}R_{2}=-\partial_{1}\partial_{2}\Delta^{-1}$ で、核 $\frac{x_{1}x_{2}}{\pi|x|^{4}}$ は $-\partial_{1}\partial_{2}\frac{1}{2\pi}\log|x|$ に等しい。）
:::

::: problem ★★ 標準：p = ∞ でのカルデロン–ジグムント評価の破綻 {#four:ex-si-2}
$n=2$ とする。$\eta\in C_{c}^{\infty}(B(0,2))$ を、$0\le\eta\le1$ で $\bar B(0,1)$ の近傍で $\eta=1$ となるものとし（\ref{fa:test-function-density.2}）、$0<\varepsilon<1$ について
$$
v_{\varepsilon}(x)\defeq x_{1}x_{2}\log(|x|^{2}+\varepsilon^{2}),\qquad u_{\varepsilon}\defeq\eta v_{\varepsilon}\in C_{c}^{\infty}(\mathbb{R}^{2})
$$
とおく。$\sup_{\varepsilon}\|\Delta u_{\varepsilon}\|_{\infty}<\infty$ だが $\|\partial_{1}\partial_{2}u_{\varepsilon}\|_{\infty}\ge2\log\frac1\varepsilon$ を示し、\ref{four:si-cz-estimate.2} は $p=\infty$ で成り立たないことを導け。
:::

::: solution
$s\defeq|x|^{2}$, $g(s)\defeq\log(s+\varepsilon^{2})$, $g'=\frac{1}{s+\varepsilon^{2}}$, $g''=-\frac{1}{(s+\varepsilon^{2})^{2}}$ とし、$v=v_{\varepsilon}=x_{1}x_{2}g(s)$ と書く（$\partial_{j}[g(s)]=2x_{j}g'$）。

**Step 1.** 【主張：$\partial_{1}\partial_{2}v=g+2sg'+4x_{1}^{2}x_{2}^{2}g''$、とくに $\partial_{1}\partial_{2}v(0)=2\log\varepsilon$】 $\partial_{1}v=x_{2}g+2x_{1}^{2}x_{2}g'$ を $x_{2}$ で微分すると $g+2x_{2}^{2}g'+2x_{1}^{2}g'+4x_{1}^{2}x_{2}^{2}g''$。

**Step 2.** 【主張：$\Delta v=x_{1}x_{2}(12g'+4sg'')$ で $|\Delta v|\le6$】 $\Delta(ab)=a\Delta b+2\nabla a\cdot\nabla b+b\Delta a$ を $a=x_{1}x_{2}$, $b=g(s)$ に使う。$\Delta a=0$、$\nabla a\cdot\nabla b=(x_{2},x_{1})\cdot2g'(x_{1},x_{2})=4x_{1}x_{2}g'$、$\Delta b=\sum_{j}\partial_{j}(2x_{j}g')=4g'+4sg''$。よって $\Delta v=x_{1}x_{2}(4g'+4sg''+8g')$。$12g'+4sg''=\frac{12}{s+\varepsilon^{2}}-\frac{4s}{(s+\varepsilon^{2})^{2}}\in\bigl[0,\frac{12}{s+\varepsilon^{2}}\bigr]$ と $|x_{1}x_{2}|\le\frac s2$ から $|\Delta v|\le\frac s2\cdot\frac{12}{s}=6$。

**Step 3.** 【主張：$1\le|x|\le2$ で $|v|$, $|\nabla v|$ は $\varepsilon$ によらない定数 $C_{0}$ で押さえられる】 そこでは $1\le s+\varepsilon^{2}\le5$ なので $|g|\le\log5$、$|g'|\le\frac1s$。$|v|\le\frac s2\log5\le2\log5$、$|\partial_{1}v|\le|x_{2}||g|+2x_{1}^{2}|x_{2}|g'\le2\log5+2|x|\le2\log5+4$（$\partial_{2}v$ も同様）。

$\Delta u_{\varepsilon}=\eta\Delta v+2\nabla\eta\cdot\nabla v+v\Delta\eta$ で、$\nabla\eta$, $\Delta\eta$ は $1\le|x|\le2$ の外で $0$。Step 2・3 から $\|\Delta u_{\varepsilon}\|_{\infty}\le6+2\sqrt2C_{0}\|\nabla\eta\|_{\infty}+C_{0}\|\Delta\eta\|_{\infty}$ で、$\varepsilon$ によらない。一方、$0$ の近傍で $u_{\varepsilon}=v$ なので Step 1 から $\partial_{1}\partial_{2}u_{\varepsilon}(0)=2\log\varepsilon$。$\partial_{1}\partial_{2}u_{\varepsilon}$ は連続なので、任意の $\delta>0$ について $|\partial_{1}\partial_{2}u_{\varepsilon}|>2\log\frac1\varepsilon-\delta$ が正の測度の集合（$0$ の近傍）で成り立ち、$\|\partial_{1}\partial_{2}u_{\varepsilon}\|_{\infty}\ge2\log\frac1\varepsilon\to\infty$。よって $\|\partial_{1}\partial_{2}u\|_{\infty}\le C\|\Delta u\|_{\infty}$ となる定数 $C$ はない。（極限の $x_{1}x_{2}\log|x|^{2}$ は $\Delta$ が有界だが、$\partial_{1}\partial_{2}$ が原点で対数的に発散する。）
:::

## フーリエ乗数とリトルウッド–ペイリー理論 {#four:sec-ml-exercises}

対応するページ：\ref{four:page-multipliers-lp}

::: problem ★ 基本：1 − d²/dx² による一階・二階微分の評価 {#four:ex-ml-1}
$n=1$（$k=1$）とし、$m_{1}(\xi)\defeq\frac{4\pi^{2}\xi^{2}}{1+4\pi^{2}\xi^{2}}$, $m_{2}(\xi)\defeq\frac{2\pi i\xi}{1+4\pi^{2}\xi^{2}}$ とする。
1. $m_{1}$ は $B=1$、$m_{2}$ は $B=\frac12$ で \ref{four:ml-mihlin} の仮定を満たすことを示せ。
2. $1<p<\infty$ について、$u\in\mathcal{S}$ なら $\|u'\|_{p}+\|u''\|_{p}\le C\|u-u''\|_{p}$（$C$ は $p$ だけによる）を示せ。$p=2$ では $\|u''\|_{2}\le\|u-u''\|_{2}$, $\|u'\|_{2}\le\frac12\|u-u''\|_{2}$ を示せ。
:::

::: solution
**1.** $\sigma\defeq2\pi|\xi|$ と書く。$|m_{1}|=\frac{\sigma^{2}}{1+\sigma^{2}}\le1$、$m_{1}'(\xi)=\frac{8\pi^{2}\xi}{(1+4\pi^{2}\xi^{2})^{2}}$ から $|\xi m_{1}'|=\frac{2\sigma^{2}}{(1+\sigma^{2})^{2}}\le\frac12$（$4\sigma^{2}\le(1+\sigma^{2})^{2}$）。$|m_{2}|=\frac{\sigma}{1+\sigma^{2}}\le\frac12$、$m_{2}'(\xi)=2\pi i\frac{1-4\pi^{2}\xi^{2}}{(1+4\pi^{2}\xi^{2})^{2}}$ から $|\xi m_{2}'|=\frac{\sigma|1-\sigma^{2}|}{(1+\sigma^{2})^{2}}\le\frac{\sigma}{1+\sigma^{2}}\le\frac12$。どちらも $\mathbb{R}\setminus\{0\}$ で $C^{1}$。

**2.** $u\in\mathcal{S}$ なら $w\defeq u-u''\in\mathcal{S}$ で、\ref{four:schwartz-fourier.1} から $\hat w=(1+4\pi^{2}\xi^{2})\hat u$、$\widehat{u''}=-4\pi^{2}\xi^{2}\hat u=-m_{1}\hat w$、$\widehat{u'}=2\pi i\xi\hat u=m_{2}\hat w$。\ref{four:schwartz-fourier.3} から $u''=-T_{m_{1}}w$, $u'=T_{m_{2}}w$。1 と \ref{four:ml-mihlin.2} から $\|u''\|_{p}\le C_{1,p}\|w\|_{p}$, $\|u'\|_{p}\le\frac12C_{1,p}\|w\|_{p}$。$p=2$ では \ref{four:ml-multiplier-basic.1} から $\|m_{1}\|_{M_{2}}=\sup|m_{1}|=1$, $\|m_{2}\|_{M_{2}}=\frac12$。（$\hat u$ を $\sigma$ の大きいところ、または $\sigma=1$ の近くに集中させると、$p=2$ の定数 $1$, $\frac12$ はそれぞれ最良であることもわかる。）
:::

::: problem ★★ 標準：フーリエ積分の Lᵖ 収束 {#four:ex-ml-2}
$n=1$, $1<p<\infty$ とし、$R>0$, $f\in\mathcal{S}$ について $S_{R}f\defeq(\mathbf{1}_{[-R,R]}\hat f)^{\vee}$ とおく。
1. $\|S_{R}f\|_{p}\le(1+A_{p}^{H})\|f\|_{p}$（$R$ によらない）を示せ。
2. $\|S_{R}f-f\|_{p}\to0$（$R\to\infty$）を示せ。
3. $S_{R}$ は $L^{p}$ 上の有界作用素に延び、すべての $f\in L^{p}$ で 2 が成り立つことを示せ。
:::

::: solution
**1.** $\mathbf{1}_{[-R,R]}$ と $\mathbf{1}_{(-R,R)}$ は 2 点でしか違わないので $T_{m}$ は同じ。\ref{four:prob-ml-interval} から。

**2.** $\varphi\in C_{c}^{\infty}(\mathbb{R})$ を $[-1,1]$ の外で $0$、$\varphi(0)=1$ ととり（\ref{fa:test-function-density.2}）、$K\defeq\check\varphi\in\mathcal{S}$（\ref{four:schwartz-fourier.3}）とする。$\hat K=\varphi$ なので $\int K=\hat K(0)=1$。$\delta>0$ について $g_{\delta}\defeq f*K_{\delta}$ とすると、\ref{four:convolution-rd.2} と \ref{four:transform-basic.3} から $\widehat{g_{\delta}}(\xi)=\hat f(\xi)\varphi(\delta\xi)$。これは $\mathcal{S}$ に入り $[-\frac1\delta,\frac1\delta]$ の外で $0$ なので、$g_{\delta}=(\widehat{g_{\delta}})^{\vee}\in\mathcal{S}$（\ref{four:inversion-theorem.1}、両辺連続）で、$R\ge\frac1\delta$ なら $S_{R}g_{\delta}=g_{\delta}$。

$\varepsilon>0$ について、\ref{four:approximate-identity-rd.1} から $\delta$ を $\|g_{\delta}-f\|_{p}<\varepsilon$ ととる。$R\ge\frac1\delta$ なら、$S_{R}$ の線形性と 1 から
$$
\|S_{R}f-f\|_{p}\le\|S_{R}(f-g_{\delta})\|_{p}+\|S_{R}g_{\delta}-g_{\delta}\|_{p}+\|g_{\delta}-f\|_{p}\le(2+A_{p}^{H})\varepsilon .
$$

**3.** $\mathcal{S}\supset C_{c}^{\infty}$ は $L^{p}$ で稠密（\ref{fa:test-function-density.1}）なので、1 から $S_{R}$ はノルム $\le1+A_{p}^{H}$ の有界作用素にただ一つに延びる。$f\in L^{p}$, $h\in\mathcal{S}$ について、2 と同じく $\|S_{R}f-f\|_{p}\le(2+A_{p}^{H})\|f-h\|_{p}+\|S_{R}h-h\|_{p}$。$h$ を $f$ に近くとり、次に $R$ を大きくとればよい。（\ref{four:ht-partial-sums} の実数直線版である。$n\ge2$ で球の指示関数をとると、$p\ne2$ では $L^{p}$ 乗数でないことが知られている（フェファーマンの定理）。）
:::

::: problem ★★★ 発展：楕円型作用素による二階微分の評価 {#four:ex-ml-3}
$A=(a_{kl})$ を実対称な正定値 $n\times n$ 行列とし、$Lu\defeq\sum_{k,l}a_{kl}\partial_{k}\partial_{l}u$ とおく。
1. $1<p<\infty$ と $i,j$ について、$u\in\mathcal{S}$ なら $\|\partial_{i}\partial_{j}u\|_{p}\le C\|Lu\|_{p}$（$C$ は $A,p,i,j$ だけによる）を示せ。
2. $n=2$, $A=\operatorname{diag}(1,2)$, $i=1$, $j=2$ のとき、$p=2$ の最良定数は $\frac{1}{2\sqrt2}$ であることを示せ。
3. $n=2$, $1\le p\le\infty$ のとき、$\|\partial_{1}\partial_{2}u\|_{p}\le C\|\partial_{1}^{2}u\|_{p}$ がすべての $u\in\mathcal{S}$ で成り立つ定数 $C$ はないことを示せ。
:::

::: solution
$q(\xi)\defeq\sum a_{kl}\xi_{k}\xi_{l}$ とし、$\mu>0$ を $A$ の最小固有値とすると $q(\xi)\ge\mu|\xi|^{2}$。

**Step 1.** 【主張：項目 1】 $m(\xi)\defeq\frac{\xi_{i}\xi_{j}}{q(\xi)}$ は分母が $\mathbb{R}^{n}\setminus\{0\}$ で $0$ にならない有理関数なので $C^{\infty}$ で、$m(t\xi)=m(\xi)$（$t>0$）。\ref{four:ml-homogeneous-symbols}（$\tau=0$）から $\|m\|_{M_{p}}<\infty$。$u\in\mathcal{S}$ なら $Lu\in\mathcal{S}$ で、\ref{four:schwartz-fourier.1} から $\widehat{Lu}=-4\pi^{2}q\hat u$, $\widehat{\partial_{i}\partial_{j}u}=-4\pi^{2}\xi_{i}\xi_{j}\hat u=m\widehat{Lu}$。\ref{four:schwartz-fourier.3} から $\partial_{i}\partial_{j}u=T_{m}(Lu)$、よって $C=\|m\|_{M_{p}}$ でよい。$A=I$ では \ref{four:si-cz-estimate.2} の別証明になる。

**Step 2.** 【主張：$A=\operatorname{diag}(1,2)$ で $\sup|m|=\frac{1}{2\sqrt2}$ で、$\xi_{0}\defeq(\sqrt2,1)$ で達成】 相加相乗平均から $\xi_{1}^{2}+2\xi_{2}^{2}\ge2\sqrt2|\xi_{1}\xi_{2}|$、等号は $|\xi_{1}|=\sqrt2|\xi_{2}|$。$m(\xi_{0})=\frac{\sqrt2}{2+2}=\frac{1}{2\sqrt2}$。

**Step 3.** 【主張：項目 2】 \ref{four:plancherel.2} から $\|\partial_{1}\partial_{2}u\|_{2}=\|m\widehat{Lu}\|_{2}\le\frac{1}{2\sqrt2}\|Lu\|_{2}$。逆に $\delta\in(0,\frac12)$ について $0\ne\varphi\in C_{c}^{\infty}(B(\xi_{0},\delta))$ をとり、$u\defeq\check\varphi\in\mathcal{S}$ とすると $\hat u=\varphi$ で
$$
\frac{\|\partial_{1}\partial_{2}u\|_{2}^{2}}{\|Lu\|_{2}^{2}}=\frac{\int|m|^{2}q^{2}|\varphi|^{2}}{\int q^{2}|\varphi|^{2}}\ge\min_{\bar B(\xi_{0},\delta)}|m|^{2}.
$$
$m$ は $\xi_{0}$ で連続なので、右辺は $\delta\to0$ で $\frac18$ に近づく。

**Step 4.** 【主張：項目 3】 $u\in\mathcal{S}$, $\Lambda>0$ について $u_{\Lambda}(x)\defeq u(x_{1},\Lambda x_{2})$ とすると $\partial_{1}\partial_{2}u_{\Lambda}=\Lambda(\partial_{1}\partial_{2}u)(x_{1},\Lambda x_{2})$, $\partial_{1}^{2}u_{\Lambda}=(\partial_{1}^{2}u)(x_{1},\Lambda x_{2})$。\ref{meas:lebesgue-linear} から $\|h(x_{1},\Lambda x_{2})\|_{p}=\Lambda^{-1/p}\|h\|_{p}$（$p=\infty$ では $\Lambda^{0}$）なので、$u_{\Lambda}$ に対する比は $u$ に対する比の $\Lambda$ 倍。$u(x)\defeq e^{-\pi|x|^{2}}$ では $\partial_{1}\partial_{2}u=4\pi^{2}x_{1}x_{2}e^{-\pi|x|^{2}}\ne0$ で比は正なので、$\Lambda\to\infty$ で非有界。

（$\partial_{1}^{2}$ の記号 $\xi_{1}^{2}$ は $\xi_{2}$ 方向で $0$ になり、楕円性がない。1 の評価の本質は $q$ が原点以外で $0$ にならないことである。）
:::

## 分数積分 {#four:sec-fi-exercises}

対応するページ：\ref{four:page-fractional-integration}

::: problem ★ 基本：1 次元のリース・ポテンシャル {#four:ex-fi-1}
$n=1$, $0<\alpha<1$ とする。
1. $\gamma(\frac12)=\sqrt{2\pi}$ を示せ。
2. $f\defeq\mathbf{1}_{[0,1]}$ について、$\gamma(\alpha)I_{\alpha}f(x)$ は $0\le x\le1$ で $\frac{x^{\alpha}+(1-x)^{\alpha}}{\alpha}$、$x>1$ で $\frac{x^{\alpha}-(x-1)^{\alpha}}{\alpha}$、$x<0$ で $\frac{(1+|x|)^{\alpha}-|x|^{\alpha}}{\alpha}$ であることを示せ。
3. $1\le q\le\infty$ について $I_{\alpha}f\in L^{q}\iff q>\frac{1}{1-\alpha}$ を示し、\ref{four:fi-hls.1} が与える $q$ の範囲と比べよ。
:::

::: solution
**1.** $n=1$ では $\gamma(\alpha)=\pi^{1/2}2^{\alpha}\Gamma(\frac\alpha2)/\Gamma(\frac{1-\alpha}{2})$ で、$\alpha=\frac12$ なら $\Gamma(\frac14)$ が約分されて $\gamma(\frac12)=\sqrt\pi\sqrt2=\sqrt{2\pi}$。

**2.** $\gamma(\alpha)I_{\alpha}f(x)=\int_{0}^{1}|x-y|^{\alpha-1}dy$。$0<x<1$ なら $\int_{0}^{x}(x-y)^{\alpha-1}dy+\int_{x}^{1}(y-x)^{\alpha-1}dy=\frac{x^{\alpha}}{\alpha}+\frac{(1-x)^{\alpha}}{\alpha}$（端点でも同じ式）。$x>1$ なら $\int_{0}^{1}(x-y)^{\alpha-1}dy=\frac{x^{\alpha}-(x-1)^{\alpha}}{\alpha}$、$x<0$ なら $\int_{0}^{1}(y-x)^{\alpha-1}dy=\frac{(1-x)^{\alpha}-(-x)^{\alpha}}{\alpha}$。

**3.** $a,b\ge0$, $a+b>0$ なら $(\frac{a}{a+b})^{\alpha}+(\frac{b}{a+b})^{\alpha}\ge\frac{a}{a+b}+\frac{b}{a+b}=1$ なので $(a+b)^{\alpha}\le a^{\alpha}+b^{\alpha}$。これから $x^{\alpha}-(x-1)^{\alpha}\le1$（$x>1$）、$(1+|x|)^{\alpha}-|x|^{\alpha}\le1$ がわかり、2 から $0\le I_{\alpha}f\le\frac{2}{\alpha\gamma(\alpha)}$。$|x|\ge2$ とする。平均値の定理から、$\gamma(\alpha)I_{\alpha}f(x)=c^{\alpha-1}$ となる $c$ が $|x|-1$ と $|x|+1$ の間にある（$x>1$ なら $x^{\alpha}-(x-1)^{\alpha}=\alpha c^{\alpha-1}$、$x<0$ も同様）。$t^{\alpha-1}$ は減少し、$|x|-1\ge\frac{|x|}{2}$, $|x|+1\le2|x|$ なので
$$
2^{\alpha-1}|x|^{\alpha-1}\le\gamma(\alpha)I_{\alpha}f(x)\le2^{1-\alpha}|x|^{\alpha-1}.
$$よって $q=\infty$ では $I_{\alpha}f\in L^{\infty}$、$q<\infty$ では $I_{\alpha}f\in L^{q}\iff\int_{2}^{\infty}x^{-q(1-\alpha)}dx<\infty\iff q(1-\alpha)>1$。

$f$ はすべての $L^{p}$ に入る。\ref{four:fi-hls.1} は $1<p<\frac1\alpha$、$\frac1q=\frac1p-\alpha$ について $I_{\alpha}f\in L^{q}$ を与え、$q$ の範囲はちょうど $(\frac{1}{1-\alpha},\infty)$ である。端点 $q=\frac{1}{1-\alpha}$ では $L^{q}$ に入らず、弱 $L^{q}$ に入る（\ref{four:fi-hls.2}、\ref{four:prob-fi-endpoint} の 1 次元版）。
:::

::: problem ★★ 標準：端点 p = n/α での破綻 {#four:ex-fi-2}
$0<\alpha<n$ とし、$|y|<1$ で $f(y)\defeq|y|^{-\alpha}\bigl(\log\frac{e}{|y|}\bigr)^{-1}$、それ以外で $f(y)\defeq0$ とする。
1. $f\in L^{n/\alpha}$ を示せ。
2. $I_{\alpha}f(0)=\infty$ を示し、さらに $x\to0$ で $I_{\alpha}f(x)\to\infty$、とくに $I_{\alpha}f\notin L^{\infty}$ を示せ。
:::

::: solution
\ref{four:si-polar} と $\sigma(S^{n-1})=n\omega_{n}$ から、ボレル可測な $h\ge0$ について $\int h(|y|)\,dy=n\omega_{n}\int_{0}^{\infty}h(r)r^{n-1}dr$。以下 $\beta\defeq\frac n\alpha>1$。

**1.** $f^{\beta}=|y|^{-n}(\log\frac{e}{|y|})^{-\beta}$（$|y|<1$）なので、$s=\log\frac er\in(1,\infty)$（$ds=-\frac{dr}{r}$）と置き換えて
$$
\int f^{\beta}=n\omega_{n}\int_{0}^{1}\Bigl(\log\frac er\Bigr)^{-\beta}\frac{dr}{r}=n\omega_{n}\int_{1}^{\infty}s^{-\beta}ds=\frac{n\omega_{n}}{\beta-1}<\infty .
$$

**2.** 同じ置き換えで $\gamma(\alpha)I_{\alpha}f(0)=\int_{|y|<1}|y|^{-n}(\log\frac{e}{|y|})^{-1}dy=n\omega_{n}\int_{1}^{\infty}\frac{ds}{s}=\infty$。$x_{k}\to0$ とすると、$y\ne0$ で $|x_{k}-y|^{\alpha-n}f(y)\to|y|^{\alpha-n}f(y)$ なので、\ref{meas:fatou} から $\liminf_{k}I_{\alpha}f(x_{k})\ge I_{\alpha}f(0)=\infty$。よってどの $N$ についても、ある $\delta>0$ があって $B(0,\delta)$ 上で $I_{\alpha}f>N$（そうでなければ $I_{\alpha}f(x_{k})\le N$, $x_{k}\to0$ となる列がとれる）。$B(0,\delta)$ は正の測度をもつので $\|I_{\alpha}f\|_{\infty}\ge N$。

（\ref{four:fi-hls.1} の指数の関係で $p=\frac n\alpha$ とすると $q=\infty$ になるが、この端点は除かれている。$f$ は $L^{1}$ にも入るので、補間で $L^{\infty}$ の評価を得ることもできない。）
:::

::: problem ★★★ 発展：熱核によるヘドベリ型の不等式 {#four:ex-fi-3}
$0<\alpha<n$, $1\le p<\frac n\alpha$ とし、$h_{s}(x)\defeq(4\pi s)^{-n/2}e^{-|x|^{2}/(4s)}$（\ref{four:heat-kernel-ae}）とする。
1. $x\ne0$ について $\dfrac{|x|^{\alpha-n}}{\gamma(\alpha)}=\dfrac{1}{\Gamma(\frac\alpha2)}\displaystyle\int_{0}^{\infty}s^{\frac\alpha2-1}h_{s}(x)\,ds$ を示せ。
2. $\|h_{s}\|_{p'}=K(4\pi s)^{-\frac{n}{2p}}$、$K\defeq p'^{-\frac{n}{2p'}}$（$p=1$ では $K=1$）を示せ。
3. $f\in L^{p}$ と $Mf(x)<\infty$ となる $x$ について
$$
\begin{aligned}I_{\alpha}|f|(x)&\le C'\,Mf(x)^{1-\frac{\alpha p}{n}}\|f\|_{p}^{\frac{\alpha p}{n}},\\C'&\defeq\frac{1}{\Gamma(\frac\alpha2)}\Bigl(\frac2\alpha+\frac{2K(4\pi)^{-\frac{n}{2p}}}{\frac np-\alpha}\Bigr)\end{aligned}
$$
を示せ。
4. $1<p<\frac n\alpha$, $\frac1q=\frac1p-\frac\alpha n$ なら $\|I_{\alpha}f\|_{q}\le C'(A_{p}^{M})^{p/q}\|f\|_{p}$ を導け。
:::

::: solution
**Step 1.** 【主張：項目 1】 \eqref{four:eq-fi-gamma} の右の等式を $c=\frac{|x|^{2}}{4}$, $b=\frac{n-\alpha}{2}>0$ に使うと
$$
\begin{aligned}\int_{0}^{\infty}s^{\frac\alpha2-1}h_{s}(x)\,ds&=(4\pi)^{-\frac n2}\int_{0}^{\infty}e^{-\frac{|x|^{2}}{4s}}s^{-\frac{n-\alpha}{2}-1}ds\\&=(4\pi)^{-\frac n2}\Gamma\Bigl(\frac{n-\alpha}{2}\Bigr)\Bigl(\frac{|x|^{2}}{4}\Bigr)^{-\frac{n-\alpha}{2}} .\end{aligned}
$$
右辺は $\pi^{-\frac n2}2^{-\alpha}\Gamma(\frac{n-\alpha}{2})|x|^{\alpha-n}$ で、$\Gamma(\frac\alpha2)$ で割ると \ref{four:fi-riesz-potential} の $\gamma(\alpha)^{-1}|x|^{\alpha-n}$ になる。

**Step 2.** 【主張：項目 2】 $p=1$ なら $\|h_{s}\|_{\infty}=h_{s}(0)=(4\pi s)^{-n/2}$。$p>1$ なら \ref{four:gaussian-transform}（$\xi=0$, $a=\frac{p'}{4\pi s}$）から $\int e^{-p'|x|^{2}/(4s)}dx=(\frac{4\pi s}{p'})^{n/2}$ なので
$$
\begin{aligned}\|h_{s}\|_{p'}&=(4\pi s)^{-\frac n2}\Bigl(\frac{4\pi s}{p'}\Bigr)^{\frac{n}{2p'}}\\&=p'^{-\frac{n}{2p'}}(4\pi s)^{-\frac n2+\frac{n}{2p'}}=K(4\pi s)^{-\frac{n}{2p}} .\end{aligned}
$$

**Step 3.** 【主張：$S>0$ について $I_{\alpha}|f|(x)\le\frac{1}{\Gamma(\alpha/2)}\bigl(\frac2\alpha S^{\frac\alpha2}Mf(x)+\frac{2K(4\pi)^{-\frac{n}{2p}}}{\frac np-\alpha}S^{\frac\alpha2-\frac{n}{2p}}\|f\|_{p}\bigr)$】 Step 1 と \ref{meas:tonelli}（被積分関数は非負）から
$$
I_{\alpha}|f|(x)=\frac{1}{\Gamma(\frac\alpha2)}\int_{0}^{\infty}s^{\frac\alpha2-1}(h_{s}*|f|)(x)\,ds .
$$
$s\le S$ では \ref{four:heat-kernel-ae} から $(h_{s}*|f|)(x)\le M|f|(x)=Mf(x)$ で、$\int_{0}^{S}s^{\frac\alpha2-1}ds=\frac2\alpha S^{\frac\alpha2}$。$s>S$ ではヘルダーの不等式と Step 2 から $(h_{s}*|f|)(x)\le K(4\pi s)^{-\frac{n}{2p}}\|f\|_{p}$ で、$\frac\alpha2-\frac{n}{2p}<0$ から $\int_{S}^{\infty}s^{\frac\alpha2-\frac{n}{2p}-1}ds=\frac{2}{\frac np-\alpha}S^{\frac\alpha2-\frac{n}{2p}}$。

**Step 4.** 【主張：項目 3】 $\|f\|_{p}=0$ なら左辺は $0$。$Mf(x)=0$ なら、すべての $r$ で $\int_{B(x,r)}|f|=0$ なので $f=0$（a.e.）で左辺は $0$。そこで $0<Mf(x)<\infty$, $\|f\|_{p}>0$ とし、$S^{\frac{n}{2p}}\defeq\|f\|_{p}/Mf(x)$ と選ぶ。$S^{\frac\alpha2}=(\|f\|_{p}/Mf(x))^{\frac{\alpha p}{n}}$ なので
$$
S^{\frac\alpha2}Mf(x)=S^{\frac\alpha2-\frac{n}{2p}}\|f\|_{p}=Mf(x)^{1-\frac{\alpha p}{n}}\|f\|_{p}^{\frac{\alpha p}{n}},
$$
Step 3 の二つの項がともにこの形になり、主張が従う。

**Step 5.** 【主張：項目 4】 \ref{four:maximal-lp} から $Mf<\infty$（a.e.）なので、3 はほとんどすべての $x$ で成り立ち、$I_{\alpha}f(x)$ はそこで絶対収束する。$(1-\frac{\alpha p}{n})q=p$ なので
$$
\begin{aligned}\|I_{\alpha}f\|_{q}&\le C'\|f\|_{p}^{\frac{\alpha p}{n}}\Bigl(\int(Mf)^{p}\Bigr)^{\frac1q}\\&\le C'\|f\|_{p}^{\frac{\alpha p}{n}}(A_{p}^{M})^{\frac pq}\|f\|_{p}^{\frac pq},\end{aligned}
$$
$\frac{\alpha p}{n}+\frac pq=p(\frac\alpha n+\frac1q)=1$。

（\ref{four:fi-hedberg} はリース核を直接「近い部分」と「遠い部分」に分けたが、ここでは熱核の時間 $s$ で分けた。小さい $s$ は極大関数（局所的な平均）、大きい $s$ は $L^{p}$ ノルム（大域的な大きさ）で押さえるという構造は同じである。）
:::
