# 特異積分作用素 {#four:page-singular-integrals keywords="singular integral operators, Calderon-Zygmund kernel, Calderon-Zygmund operator, Hormander condition, homogeneous kernel Omega(x/|x|)/|x|^n, Riesz transforms, Calderon-Zygmund estimate, 特異積分, カルデロン・ジグムント作用素, リース変換"}

前のページ \ref{four:page-hilbert-transform} では、ヒルベルト変換が $L^{p}$（$1<p<\infty$）で有界であることを、カルデロン–ジグムント分解と核の滑らかさ（ヘルマンダー条件）から示した。その証明が核について使ったのは「$L^{2}$ 有界性」「大きさ $|K(x)|\lesssim|x|^{-n}$」「ヘルマンダー条件」の三つだけである。このページでは、この三つを満たす $\mathbb{R}^{n}$ 上の作用素を**カルデロン–ジグムント作用素**として抽出し、弱 $(1,1)$ 型と $L^{p}$ 有界性を一般に示す。例として球面上の平均 $0$ の関数 $\Omega$ による斉次核 $\Omega(x/|x|)/|x|^{n}$ を扱い、そのフーリエ乗数を計算する。とくに**リース変換** $R_{j}$ は乗数 $-i\xi_{j}/|\xi|$ をもち、そこから楕円型方程式の基本的な評価 $\|\partial_{i}\partial_{j}u\|_{p}\le C_{p}\|\Delta u\|_{p}$ が従う。

## 記法と定義の確認 {#four:sec-si-notation}

::: notation
- 空間は $\mathbb{R}^{n}$（$n\ge1$）。$|E|$ はルベーグ測度、$\omega_{n}$ は単位球の測度で、放射的な関数の積分は \ref{four:radial-integral} のとおり。$x\ne0$ について $x'\defeq x/|x|$、$S^{n-1}\defeq\{|\theta|=1\}$、$|x|_{\infty}\defeq\max_{i}|x_{i}|$。
- フーリエ変換 $\hat f$、$L^{2}$ 上の $\mathcal{F}$、畳み込み、シュワルツ空間 $\mathcal{S}$ は \ref{four:fourier-transform}, \ref{four:plancherel}, \ref{four:convolution-rd}, \ref{four:schwartz-space} のとおり。$\langle f,g\rangle\defeq\int f\bar g$。$\operatorname{sgn}$ は \ref{four:page-hilbert-transform} の約束（$\sgn z=z/|z|$, $\sgn0=0$）。
- 分布関数・弱型は \ref{four:weak-lp}。\term[2 進立方体]{four:ht-dyadic-cubes}とカルデロン–ジグムント分解は \ref{four:ht-cz-decomposition}。ヒルベルト変換 $H$ とその結果は \ref{four:ht-l2}, \ref{four:ht-weak-type}, \ref{four:ht-lp} のとおり。
- $c_{n}\defeq\Gamma(\frac{n+1}{2})/\pi^{(n+1)/2}$ はポアソン核 \ref{four:poisson-kernel-rd} の定数と同じものである。
- **選択公理**：使わない（カルデロン–ジグムント分解も、$L^{1}$ への延長も、前ページのとおり選択なしに構成できる）。
:::

## カルデロン–ジグムント作用素 {#four:sec-si-cz}

::: definition カルデロン–ジグムント作用素 {#four:si-cz-operator keywords="Calderon-Zygmund kernel: size |K(x)| <= A|x|^{-n} and Hormander condition; Calderon-Zygmund operator: L^2 bounded T with Tf(x) = int K(x-y) f(y) dy off the support of f" index="カルデロン–ジグムント核|かるでろんじぐむんとかく, カルデロン–ジグムント作用素|かるでろんじぐむんとさようそ, ヘルマンダー条件（一般次元）|へるまんだーじょうけんいっぱんじげん"}
$A>0$ とする。可測関数 $K\colon\mathbb{R}^{n}\setminus\{0\}\to\mathbb{C}$ と有界線形作用素 $T\colon L^{2}(\mathbb{R}^{n})\to L^{2}(\mathbb{R}^{n})$ が次を満たすとき、$K$ を（定数 $A$ の）**カルデロン–ジグムント核**、$T$ をその核をもつ**カルデロン–ジグムント作用素**という。
1. $|K(x)|\le A|x|^{-n}$（$x\ne0$）。
2. **ヘルマンダー条件**：$y\ne0$ について $\displaystyle\int_{|x|>2|y|}|K(x-y)-K(x)|\,dx\le A$。
3. $\|Tf\|_{2}\le A\|f\|_{2}$（$f\in L^{2}$）。
4. $f\in L^{2}$ がコンパクト集合 $F$ の外で $0$ なら、ほとんどすべての $x\notin F$ で $Tf(x)=\int_{F}K(x-y)f(y)\,dy$。
:::

::: intuition
$T$ は「核 $K$ との畳み込み」のように振る舞うが、原点での $K$ の特異性のために積分そのものは意味をもたない。そこで、$L^{2}$ 有界性で全体を定め、$f$ の台から離れた所でだけ積分で表せることを要求する。
:::

4 の右辺は絶対収束する：$d\defeq\operatorname{dist}(x,F)>0$ なら $|K(x-y)|\le Ad^{-n}$ で、$f\in L^{1}$（$F$ は有界なのでコーシー–シュワルツの不等式から）。$n=1$, $K(x)=\frac{1}{\pi x}$, $T=H$ は \ref{four:ht-hormander}, \ref{four:ht-l2.2}, \ref{four:ht-off-support} から定数 $1$ のカルデロン–ジグムント作用素である（\ref{four:ht-off-support} は区間について述べたが、同じ証明がコンパクト集合で通る）。

::: theorem カルデロン–ジグムント作用素の有界性 {#four:si-cz-bounds keywords="Calderon-Zygmund theorem: a Calderon-Zygmund operator is of weak type (1,1) with constant (2^{n+2} + (2 sqrt n)^n + 4) A and bounded on L^p for 1 < p < infinity; duality via the transpose with kernel K(-x)" index="カルデロン–ジグムントの定理|かるでろんじぐむんとのていり, 特異積分の Lp 有界性|とくいせきぶんのえるぴーゆうかいせい"}
$T$ を定数 $A$ のカルデロン–ジグムント作用素とし、$C_{n}\defeq2^{n+2}+(2\sqrt n)^{n}+4$ とおく。
1. $f\in L^{1}\cap L^{2}$, $\alpha>0$ なら $|\{|Tf|>\alpha\}|\le C_{n}A\|f\|_{1}/\alpha$。
2. $1<p<\infty$ について、$n,p,A$ だけで決まる $A_{p}$ があって、$f\in L^{2}\cap L^{p}$ なら $\|Tf\|_{p}\le A_{p}\|f\|_{p}$。したがって $T$ は $L^{p}$ 上の有界線形作用素にただ一つに延びる。
:::

::: intuition
核が原点の近くで $|x|^{-n}$ 程度に大きく、遠くでは「少しずらしても平均的にあまり変わらない」なら、$L^{2}$ で有界な作用素は自動的に $1<p<\infty$ のすべての $L^{p}$ で有界になる。
:::

::: proof
1 の証明は \ref{four:ht-weak-type} の証明と同じ組み立てで、変わる点だけを書く。$\gamma\defeq\alpha/A$ とし、\ref{four:ht-cz-decomposition} を高さ $\gamma$ で使って $Q_{j}$, $g$, $b_{j}$, $b$ をとる。$Q_{j}$ の中心を $c_{j}$、辺の長さを $\ell_{j}$ とする。

**Step 1.** 【主張：$|\{|Tg|>\frac\alpha2\}|\le2^{n+2}A\|f\|_{1}/\alpha$】 \ref{meas:markov.1}、\ref{four:si-cz-operator.3}、\ref{four:ht-cz-decomposition.5} から
$$
|\{|Tg|>\tfrac\alpha2\}|\le\frac{4}{\alpha^{2}}A^{2}\|g\|_{2}^{2}\le\frac{4A^{2}}{\alpha^{2}}\cdot2^{n}\frac{\alpha}{A}\|f\|_{1}.
$$

**Step 2.** 【主張：$Q_{j}^{*}$ を中心 $c_{j}$、辺の長さ $2\sqrt n\,\ell_{j}$ の閉立方体とすると $\int_{\mathbb{R}^{n}\setminus Q_{j}^{*}}|Tb_{j}|\le A\|b_{j}\|_{1}$】 $x\notin Q_{j}^{*}$ なら $|x-c_{j}|_{\infty}>\sqrt n\,\ell_{j}$。$z\in\overline{Q_{j}}$ なら $|z-c_{j}|_{\infty}\le\ell_{j}/2$ なので $|x-z|\ge|x-z|_{\infty}>(\sqrt n-\frac12)\ell_{j}$、とくに $x$ は $\overline{Q_{j}}$ から正の距離にある。\ref{four:si-cz-operator.4}（$F=\overline{Q_{j}}$）と $\int b_{j}=0$ から、ほとんどすべての $x\notin Q_{j}^{*}$ で $Tb_{j}(x)=\int_{Q_{j}}b_{j}(y)\bigl(K(x-y)-K(x-c_{j})\bigr)dy$。$y\in Q_{j}$ なら $|y-c_{j}|\le\frac{\sqrt n}{2}\ell_{j}$ で、$|x-c_{j}|\ge|x-c_{j}|_{\infty}>\sqrt n\,\ell_{j}\ge2|y-c_{j}|$。よって \ref{four:ht-weak-type} の Step 3 と同じくトネリの定理と平行移動で、内側の積分は $\int_{|x'|>2|y'|}|K(x'-y')-K(x')|dx'\le A$（$y'=y-c_{j}$）。1 次元では $Q_{j}$ の 2 倍で足りたが、$n$ 次元では立方体の中心から角までの距離 $\frac{\sqrt n}{2}\ell_{j}$ の 2 倍まで離す必要があるので、倍率が $2\sqrt n$ になる。

**Step 3.** 【主張：$|\{|Tb|>\frac\alpha2\}|\le\bigl((2\sqrt n)^{n}+4\bigr)A\|f\|_{1}/\alpha$】 $|Tb|\le\sum_{j}|Tb_{j}|$（a.e.）は \ref{four:ht-weak-type} の Step 2 と同じ（$T$ の $L^{2}$ 連続性だけを使う）。$\Omega^{*}\defeq\bigcup_{j}Q_{j}^{*}$ は \ref{four:ht-cz-decomposition.2} から $|\Omega^{*}|\le(2\sqrt n)^{n}\sum_{j}|Q_{j}|\le(2\sqrt n)^{n}\|f\|_{1}/\gamma$。$\Omega^{*}$ の外では、マルコフの不等式、Step 2、\ref{four:ht-cz-decomposition.6} から
$$
|\{x\notin\Omega^{*}:|Tb(x)|>\tfrac\alpha2\}|\le\frac{2}{\alpha}\sum_{j}A\|b_{j}\|_{1}\le\frac{4A}{\alpha}\|f\|_{1}.
$$
Step 1 と合わせて 1 が出る。

**Step 4.** 【主張：$1<p\le2$ での 2】 \ref{four:ht-l1-extension} の証明は $H$ の線形性と $L^{1}\cap L^{2}$ 上の弱 $(1,1)$ 評価しか使わないので、$T$ も同じく $L^{1}+L^{2}$ 上の線形写像に延び、弱 $(1,1)$ 型（定数 $C_{n}A$）で弱 $(2,2)$ 型（定数 $A$、\ref{four:layer-cake.2}）である。\ref{four:marcinkiewicz} を $p_{0}=1$, $p_{1}=2$ で使う（\ref{four:ht-lp} の Step 1 と同じ）。

**Step 5.** 【主張：転置 $T^{t}g\defeq\overline{T^{*}\bar g}$ は、核 $K^{t}(x)\defeq K(-x)$ をもつ定数 $A$ のカルデロン–ジグムント作用素で、$f,g\in L^{2}$ について $\int(Tf)g=\int f\,(T^{t}g)$】 等式は $\int(Tf)g=\langle Tf,\bar g\rangle=\langle f,T^{*}\bar g\rangle$。$\|T^{t}\|=\|T^{*}\|=\|T\|\le A$。$K^{t}$ の大きさの条件は明らかで、ヘルマンダー条件は $x\mapsto-x$ と置き換えると $K$ の $-y$ についての条件になる。\ref[4]{four:si-cz-operator.4} を示す：$g\in L^{2}$ がコンパクト集合 $G$ の外で $0$ とし、$h(y)\defeq\int_{G}K(x-y)g(x)dx$ とおく。コンパクト集合 $E$ で $\operatorname{dist}(E,G)\ge\delta>0$ のものと、$E$ の外で $0$ の $f\in L^{2}$ について、$f$ についての \ref[4]{four:si-cz-operator.4} とフビニの定理（被積分関数は $A\delta^{-n}|f(y)||g(x)|$ で抑えられる）から
$$
\int f\,T^{t}g=\int_{G}g(x)\int_{E}K(x-y)f(y)\,dy\,dx=\int_{E}f\,h.
$$
$h$ は $E$ 上で $A\delta^{-n}\|g\|_{1}$ 以下なので $f\defeq\overline{(T^{t}g-h)}\mathbf{1}_{E}\in L^{2}$ とおけて、$T^{t}g=h$（$E$ 上 a.e.）。$E_{k}\defeq\{|y|\le k,\ \operatorname{dist}(y,G)\ge\frac1k\}$ の和は $\mathbb{R}^{n}\setminus G$ である。

**Step 6.** 【主張：$2<p<\infty$ での 2 と延長】 \ref{four:ht-lp} の Step 2 を、反対称性の代わりに Step 5 の等式で行う：$h\defeq Tf$, $h_{k}\defeq h\mathbf{1}_{\{|x|\le k,|h|\le k\}}$, $g_{k}\defeq|h_{k}|^{p-1}\overline{\sgn h_{k}}$ とおくと $\int hg_{k}=\|h_{k}\|_{p}^{p}$ で、Step 4 を $T^{t}$ と $p'<2$ に使い $\|h_{k}\|_{p}^{p}=\int f\,T^{t}g_{k}\le A_{p'}\|f\|_{p}\|h_{k}\|_{p}^{p-1}$。延長は \ref{four:ht-lp} の Step 3 と同じ。

::: hypcheck
- **大きさの条件（\ref{four:si-cz-operator.1}）**：Step 2 と Step 5 で、台の外の積分が絶対収束することに使った（評価そのものには現れない）。
- **ヘルマンダー条件**：Step 2 だけで使う。$\int b_{j}=0$ と組み合わせて、遠方の寄与を $A\|b_{j}\|_{1}$ に抑える。
- **$L^{2}$ 有界性**：Step 1（良い部分）、Step 3（和の交換）、Step 5（転置）。
- **次元の影響**：定数 $2^{n}$（親と子の体積比）が Step 1 に、$(2\sqrt n)^{n}$（広げた立方体）が Step 3 に入る。
- **選択公理**：使わない。
:::
:::

::: supplement
**前提を変えると.**
- $L^{2}$ 有界性は核の条件からは出ない。$K(x)=|x|^{-n}$ は大きさの条件を満たし、\see{four:si-homogeneous.1} の計算（$\Omega\equiv1$）からヘルマンダー条件も満たすが、切断した核のフーリエ変換は発散し（\see{four:prob-si-mean-zero}）、平均 $0$ という打ち消しがないので $L^{2}$ 有界な作用素を与えない。畳み込み型の核ではこの打ち消しを乗数の有界性で確かめればよいが、$K(x,y)$ の形の一般の核では $L^{2}$ 有界性の判定が難しく、それを与えるのがデヴィッド–ジュルネの $T(1)$ 定理である（ここでは証明しない）。
- ヘルマンダー条件は、勾配の評価 $|\nabla K(x)|\le A|x|^{-n-1}$ から従う（\see{four:si-homogeneous} の Step 2 の計算）が、それより弱い。連続度についてのディニ型の条件でも足りる。
- 端点 $p=1,\infty$ では強型の評価は一般に成り立たない（$n=1$ の $H$ がその例、\ref{four:ht-lp.4}）。代わりに $H^{1}\to L^{1}$ と $L^{\infty}\to\mathrm{BMO}$ の有界性が成り立つことが知られている（\ref{four:ht-weak-type} の補足と同じ）。

**似た定理.** 切断した積分の上限 $T^{*}f(x)\defeq\sup_{\varepsilon>0}\bigl|\int_{|x-y|>\varepsilon}K(x-y)f(y)\,dy\bigr|$ についても、核にもう少し滑らかさを仮定すれば $L^{p}$（$1<p<\infty$）の評価と弱 $(1,1)$ 評価が成り立つ（コトラーの不等式 $T^{*}f\le C(M(Tf)+Mf)$ による。ここでは証明しない）。極大原理（\ref{four:maximal-principle}）と合わせると、主値 $\lim_{\varepsilon\to0}\int_{|x-y|>\varepsilon}K(x-y)f(y)dy$ が $f\in L^{p}$ についてほとんど至る所存在することが従う。値をヒルベルト空間にとった版は \see{four:ml-cz-vector} で扱う。

**高い視点：$L^{2}$ と幾何の分業.** この定理は「$L^{2}$ の情報（フーリエ変換で調べる）と、核の局所的な幾何（大きさとヘルマンダー条件）を合わせれば、$L^{p}$ の情報が出る」という原理である。証明が使う空間の性質は、立方体の入れ子構造と「立方体を定数倍に広げても測度は定数倍」という二倍条件だけなので、理論は二倍条件をもつ測度の入った距離空間（等質型空間）の上の特異積分にそのまま移せる。比喩で言えば、$L^{2}$ 有界性は「全体のエネルギーの帳簿」、ヘルマンダー条件は「遠方への影響の減り方」で、この二つの帳簿がそろえば、関数がどれほど尖っていても（$1<p<\infty$）作用素の出力は定数倍に収まる。
:::

## 斉次核 {#four:sec-si-homogeneous}

球面上の積分には次の事実を使う。

::: proposition 極座標 {#four:si-polar keywords="polar coordinates in R^n: surface measure sigma on the sphere with int f = int_0^infinity int_{S^{n-1}} f(r theta) d sigma(theta) r^{n-1} dr" index="極座標（n 次元）|きょくざひょうえぬじげん, 球面測度|きゅうめんそくど"}
$S^{n-1}$ 上のボレル測度 $\sigma$ がただ一つあって、$\mathbb{R}^{n}$ 上のボレル可測関数 $g\ge0$ について
$$
\int_{\mathbb{R}^{n}}g(x)\,dx=\int_{0}^{\infty}\Bigl(\int_{S^{n-1}}g(r\theta)\,d\sigma(\theta)\Bigr)r^{n-1}dr.
$$
$g\in L^{1}$ についても（内側の積分はほとんどすべての $r$ で絶対収束して）同じ式が成り立つ。$\sigma(S^{n-1})=n\omega_{n}$ で、$n=1$ では $\sigma$ は $S^{0}=\{\pm1\}$ の数え上げ測度。
:::

::: proof
測度論のページでの定義と結果をそのまま使う。$\sigma$ の存在と一意性は \ref{meas:polar-decomposition.4}、非負ボレル可測関数での公式は \ref{meas:polar-decomposition.2}、可積分な関数での公式は \ref{meas:polar-decomposition.3}、$\sigma(S^{n-1})=n\omega_{n}$ と $n=1$ の場合は \ref{meas:polar-sphere-measure-basic.1}・\ref{meas:polar-sphere-measure-basic.2}。
:::

::: lemma 球面上の積分の二つの性質 {#four:si-sphere-lemma keywords="odd functions on the sphere integrate to zero; int_{S^{n-1}} |theta . omega|^{-1/2} d sigma(theta) <= 2 n 4^n uniformly in the unit vector omega" index="球面上の奇関数の積分|きゅうめんじょうのきかんすうのせきぶん"}
1. $u\in L^{1}(\sigma)$ が $u(-\theta)=-u(\theta)$ を満たせば $\int_{S^{n-1}}u\,d\sigma=0$。
2. 単位ベクトル $\omega$ について $J(\omega)\defeq\int_{S^{n-1}}|\theta\cdot\omega|^{-1/2}d\sigma(\theta)\le2n4^{n}$。とくに $\sigma(\{\theta:\theta\cdot\omega=0\})=0$。
:::

::: proof
**1.** \ref{four:si-polar} を $g(x)\defeq u(x')\mathbf{1}_{\{1\le|x|\le2\}}$ に使うと $\int g=\frac{2^{n}-1}{n}\int u\,d\sigma$。$g(-x)=-g(x)$ で、$x\mapsto-x$ についての \ref{meas:change-of-variables.3} から $\int g=-\int g$、よって $0$。

**2.** 直交行列 $U$ で $Ue_{1}=\omega$ となるものをとる。$g(x)\defeq|x\cdot\omega|^{-1/2}|x|^{1/2}\mathbf{1}_{\{1\le|x|\le2\}}$ に \ref{four:si-polar} を使うと $\int g=\frac{2^{n}-1}{n}J(\omega)\ge\frac1nJ(\omega)$。$x=Uy$ と置き換えると（\ref{meas:change-of-variables.2}、$|\det U|=1$、$Uy\cdot\omega=y\cdot U^{\mathsf T}\omega=y_{1}$）
$$
\begin{aligned}\int g&=\int_{1\le|y|\le2}|y_{1}|^{-1/2}|y|^{1/2}dy\le\sqrt2\int_{[-2,2]^{n}}|y_{1}|^{-1/2}dy\\&=\sqrt2\cdot4\sqrt2\cdot4^{n-1}=2\cdot4^{n}.\end{aligned}
$$
:::

以下、$\Omega\colon S^{n-1}\to\mathbb{C}$ は、$\tilde\Omega(x)\defeq\Omega(x')$ が $\mathbb{R}^{n}\setminus\{0\}$ 上 $C^{1}$ 級で、$\int_{S^{n-1}}\Omega\,d\sigma=0$ を満たすとする。$\|\Omega\|_{\infty}\defeq\max|\Omega|$, $L\defeq\max_{|x|=1}|\nabla\tilde\Omega(x)|$ とおき、
$$
K(x)\defeq\frac{\Omega(x')}{|x|^{n}},\qquad K_{\varepsilon,R}\defeq K\mathbf{1}_{\{\varepsilon<|x|<R\}}\quad(0<\varepsilon<R<\infty).
$$
$K_{\varepsilon,R}$ は有界で台が有界なので $L^{1}\cap L^{\infty}$ に入る。

::: lemma 斉次核の乗数 {#four:si-homogeneous-multiplier keywords="Fourier transform of truncated homogeneous kernels Omega(x')/|x|^n with mean zero: uniformly bounded, converging to m(xi) = int Omega(theta) (-(i pi/2) sgn(theta . xi) + log(1/|theta . xi'|)) d sigma(theta), homogeneous of degree 0" index="斉次核の乗数|せいじかくのじょうすう"}
$M_{\Omega}\defeq\|\Omega\|_{\infty}(\pi n\omega_{n}+8n4^{n})$ とおき、$\xi\ne0$ について
$$
m(\xi)\defeq\int_{S^{n-1}}\Omega(\theta)\Bigl(-\frac{i\pi}{2}\sgn(\theta\cdot\xi)+\log\frac{1}{|\theta\cdot\xi'|}\Bigr)d\sigma(\theta)
$$
とおく。
1. $|\widehat{K_{\varepsilon,R}}(\xi)|\le M_{\Omega}$（すべての $\xi$, $\varepsilon$, $R$）。
2. $\xi\ne0$ なら、$\varepsilon\to0$, $R\to\infty$ のとき $\widehat{K_{\varepsilon,R}}(\xi)\to m(\xi)$。$m$ は $0$ 次斉次（$m(t\xi)=m(\xi)$, $t>0$）で $|m|\le M_{\Omega}$。
:::

::: proof
$\xi=0$ なら \ref{four:si-polar} と $\int\Omega\,d\sigma=0$ から $\widehat{K_{\varepsilon,R}}(0)=\log\frac{R}{\varepsilon}\int\Omega\,d\sigma=0$。以下 $\xi\ne0$。

**Step 1.** 【主張：$\widehat{K_{\varepsilon,R}}(\xi)=\int_{S^{n-1}}\Omega(\theta)\bigl(C(\theta)-iS(\theta)\bigr)d\sigma(\theta)$、ただし $a\defeq\theta\cdot\xi$ について $C(\theta)\defeq\int_{\varepsilon}^{R}\frac{\cos(2\pi ra)-\cos(2\pi r|\xi|)}{r}dr$, $S(\theta)\defeq\int_{\varepsilon}^{R}\frac{\sin(2\pi ra)}{r}dr$】 \ref{four:si-polar}（$K_{\varepsilon,R}\in L^{1}$）とフビニの定理から $\widehat{K_{\varepsilon,R}}(\xi)=\int\Omega(\theta)\int_{\varepsilon}^{R}e^{-2\pi ir\theta\cdot\xi}\frac{dr}{r}d\sigma(\theta)$。$\int\Omega\,d\sigma=0$ なので、$\theta$ によらない $\int_{\varepsilon}^{R}\cos(2\pi r|\xi|)\frac{dr}{r}$ を内側から引いてよい。

**Step 2.** 【主張：$|S|\le\pi$ で $S(\theta)\to\frac\pi2\sgn(\theta\cdot\xi)$】 $t=2\pi|a|r$ と置き換えると $S(\theta)=\sgn a\,\bigl(\operatorname{Si}(2\pi|a|R)-\operatorname{Si}(2\pi|a|\varepsilon)\bigr)$ で、\ref{four:ht-sine-integral.1}・\ref{four:ht-sine-integral.2} から（\ref{four:ht-truncated-multiplier} の証明と同じ）。

**Step 3.** 【主張：$\theta\cdot\xi\ne0$ なら $|C(\theta)|\le2\log\frac{1}{|\theta\cdot\xi'|}\le4|\theta\cdot\xi'|^{-1/2}$ で、$C(\theta)\to\log\frac{1}{|\theta\cdot\xi'|}$】 $\alpha\defeq2\pi|a|\le\beta\defeq2\pi|\xi|$, $G(s,t)\defeq\int_{s}^{t}\frac{\cos u}{u}du$ とおくと、置き換えで $C=G(\alpha\varepsilon,\alpha R)-G(\beta\varepsilon,\beta R)=G(\alpha\varepsilon,\beta\varepsilon)-G(\alpha R,\beta R)$。$|G(s,t)|\le\log\frac ts$（$s\le t$）と $\frac\beta\alpha=\frac{1}{|\theta\cdot\xi'|}$ から最初の不等式、$\log y\le2\sqrt y$ から 2 番目。また $0\le1-\cos u\le\frac{u^{2}}{2}$ から $|G(\alpha\varepsilon,\beta\varepsilon)-\log\frac\beta\alpha|\le\int_{\alpha\varepsilon}^{\beta\varepsilon}\frac u2du\le\frac{(\beta\varepsilon)^{2}}{4}\to0$。部分積分 $G(s,t)=\bigl[\frac{\sin u}{u}\bigr]_{s}^{t}+\int_{s}^{t}\frac{\sin u}{u^{2}}du$ から $|G(\alpha R,\beta R)|\le\frac{3}{\alpha R}\to0$。

**Step 4.** 【主張：項目 1・2】 Step 2・3 から、Step 1 の被積分関数は $\|\Omega\|_{\infty}(\pi+4|\theta\cdot\xi'|^{-1/2})$ で抑えられ、\ref{four:si-sphere-lemma.2} からこれは $\sigma$ 可積分で積分は $M_{\Omega}$ 以下。$\{\theta\cdot\xi=0\}$ は $\sigma$ 零集合なので、優収束定理から 2 の収束。$m(\xi)$ は $\xi'$ だけで決まる。

::: hypcheck
- **$\int\Omega\,d\sigma=0$**：Step 1 で $\cos(2\pi r|\xi|)$ を引くのに使った。これがないと $\widehat{K_{\varepsilon,R}}(\xi)$ は $\log\frac{R}{\varepsilon}$ の速さで発散しうる（\see{four:prob-si-mean-zero}）。
- **$\Omega$ の滑らかさ**：ここでは使わない（有界可測で足りる）。滑らかさはヘルマンダー条件のために要る。
:::
:::

::: theorem 斉次核の特異積分 {#four:si-homogeneous keywords="singular integral with homogeneous kernel Omega(x')/|x|^n, Omega C^1 with mean zero: Hormander condition, principal value on Schwartz functions, L^2 bounded multiplier operator, Calderon-Zygmund operator, L^p bounded for 1 < p < infinity" index="斉次核の特異積分|せいじかくのとくいせきぶん"}
$m$, $M_{\Omega}$ を \ref{four:si-homogeneous-multiplier} のものとし、$A_{\Omega}\defeq\max\{M_{\Omega},\ 2^{n}n\omega_{n}(L+n\|\Omega\|_{\infty})\}$ とおく。
1. $|K(x)|\le\|\Omega\|_{\infty}|x|^{-n}$ で、$y\ne0$ について $\int_{|x|>2|y|}|K(x-y)-K(x)|dx\le2^{n}n\omega_{n}(L+n\|\Omega\|_{\infty})$。
2. $f\in\mathcal{S}$ なら、すべての $x$ で主値 $\lim_{\varepsilon\to0,R\to\infty}\int_{\varepsilon<|y|<R}K(y)f(x-y)dy$ が存在する。
3. $f\in L^{2}$ について $T_{\Omega}f\defeq\mathcal{F}^{-1}(m\,\mathcal{F}f)$ とおくと、$\|T_{\Omega}f\|_{2}\le M_{\Omega}\|f\|_{2}$、$\|K_{\varepsilon,R}*f-T_{\Omega}f\|_{2}\to0$。$f\in\mathcal{S}$ なら $T_{\Omega}f$ は 2 の主値と a.e. で一致する。
4. $T_{\Omega}$ は核 $K$ をもつ定数 $A_{\Omega}$ のカルデロン–ジグムント作用素である。とくに \ref{four:si-cz-bounds} から弱 $(1,1)$ 型で、$1<p<\infty$ の $L^{p}$ で有界。
:::

::: intuition
球面上で平均 $0$ の滑らかな関数を $|x|^{-n}$ で割った核は、原点の周りで打ち消し合うので主値が意味をもち、フーリエ側では方向だけによる有界な関数を掛ける作用素になる。したがってすべての $L^{p}$（$1<p<\infty$）で有界である。
:::

::: proof
**Step 1.** 【主張：$|\nabla K(x)|\le(L+n\|\Omega\|_{\infty})|x|^{-n-1}$】 $\tilde\Omega(tx)=\tilde\Omega(x)$（$t>0$）を $x$ で微分して $t\nabla\tilde\Omega(tx)=\nabla\tilde\Omega(x)$、$t=1/|x|$ として $|\nabla\tilde\Omega(x)|\le L|x|^{-1}$。$\nabla K=|x|^{-n}\nabla\tilde\Omega-n\tilde\Omega\,x|x|^{-n-2}$ から。

**Step 2.** 【主張：項目 1】 大きさは定義から。$|x|>2|y|$ なら線分上の点は $|x-ty|\ge|x|-|y|>\frac{|x|}{2}$（$0\le t\le1$）なので、$K(x-y)-K(x)=-\int_{0}^{1}\nabla K(x-ty)\cdot y\,dt$ と Step 1 から $|K(x-y)-K(x)|\le2^{n+1}(L+n\|\Omega\|_{\infty})|y||x|^{-n-1}$。\ref{four:si-polar} と $\sigma(S^{n-1})=n\omega_{n}$ から $\int_{|x|>2|y|}|x|^{-n-1}dx=n\omega_{n}\int_{2|y|}^{\infty}r^{-2}dr=\frac{n\omega_{n}}{2|y|}$。

**Step 3.** 【主張：項目 2】 $0<\varepsilon<1<R$ とする。\ref{four:si-polar} から $\int_{\varepsilon<|y|<1}K=\log\frac1\varepsilon\int\Omega\,d\sigma=0$ なので
$$
\begin{aligned}\int_{\varepsilon<|y|<R}K(y)f(x-y)dy&=\int_{\varepsilon<|y|<1}K(y)\bigl(f(x-y)-f(x)\bigr)dy\\&\quad+\int_{1\le|y|<R}K(y)f(x-y)dy.\end{aligned}
$$
第 1 項の被積分関数は $\|\Omega\|_{\infty}\|\nabla f\|_{\infty}|y|^{1-n}$ で抑えられ、これは $\{|y|<1\}$ で可積分（\ref{four:radial-integral.1} で積分は $n\omega_{n}$）。第 2 項は $\|\Omega\|_{\infty}|f(x-y)|$ で抑えられる。優収束定理から収束する（\ref{four:ht-pv-exists} と同じ）。

**Step 4.** 【主張：項目 3】 \ref{four:ht-l2} の Step 3・4 と \ref{four:ht-multiplier} の Step 3 で、\ref{four:ht-truncated-multiplier} の代わりに \ref{four:si-homogeneous-multiplier} を使えば同じ議論が通る（$|\widehat{K_{\varepsilon,R}}-m|\le2M_{\Omega}$ が優関数を与える）。\term[ノルム]{fa:normed-space}の評価は \ref{four:plancherel.2} と $|m|\le M_{\Omega}$ から。

**Step 5.** 【主張：項目 4】 \ref{four:si-cz-operator.1}〜\ref[3]{four:si-cz-operator.3} は 1 と 3 から。\ref[4]{four:si-cz-operator.4} は \ref{four:ht-off-support} の証明と同じ：$h\in L^{2}$ がコンパクト集合 $F$ の外で $0$、$d\defeq\operatorname{dist}(x,F)>0$、$M\defeq\max_{F}|z|$ なら、$\frac1k<d$, $k>|x|+M$ のとき $K_{1/k,k}*h(x)=\int_{F}K(x-z)h(z)dz$ で、3 と \ref{meas:riesz-fischer} から部分列で左辺は a.e. で $T_{\Omega}h(x)$ に収束する。

::: hypcheck
- **$\Omega\in C^{1}$**：Step 1・2（ヘルマンダー条件）だけで使った。ディニ型の連続性の条件 $\int_{0}^{1}\frac{w(t)}{t}dt<\infty$（$w$ は $\Omega$ の連続度）でも同じ結論が出ることが知られている。
- **平均 $0$**：Step 3 と \ref{four:si-homogeneous-multiplier} の Step 1 に本質的。
- **選択公理**：使わない（Step 5 の部分列は \ref{meas:riesz-fischer} の証明の具体的な選び方による）。
:::
:::

::: supplement
**前提を変えると.** $\Omega$ が奇関数なら、ヒルベルト変換を各方向に施して球面上で平均する**回転法**により、$\Omega\in L^{1}(\sigma)$ だけで $L^{p}$ 有界性が出ることが知られている（ここでは扱わない）。偶関数の $\Omega$ には別の工夫が要る。

**似た定理.** $n=1$ では $S^{0}=\{\pm1\}$ で、平均 $0$ の $\Omega$ は $\Omega(\pm1)=\pm c$ の形だけなので、$T_{\Omega}=\pi cH$ である。乗数の公式は $m(\xi)=c\bigl(-\frac{i\pi}{2}\sgn\xi\bigr)\cdot2=-i\pi c\sgn\xi$ となり、\ref{four:ht-l2} と一致する。

**高い視点：回転の対称性と球面調和関数.** 写像 $\Omega\mapsto m$（\ref{four:si-homogeneous-multiplier}）は線形で、回転 $U$ と可換である（$\Omega(U^{-1}\cdot)$ には $m(U^{-1}\cdot)$ が対応する。\ref{four:si-polar} の面積要素の回転不変性と $(U\theta)\cdot\xi=\theta\cdot U^{-1}\xi$ から）。回転と可換な線形写像は、回転群の既約な表現の上では定数倍として働く（シューアの補題）。球面上の関数の空間は次数 $k$ の球面調和関数の空間 $\mathcal{H}_{k}$ に分かれ、各 $\mathcal{H}_{k}$ は回転群の既約表現なので、$\Omega\in\mathcal{H}_{k}$（$k\ge1$）なら $m(\xi)=\gamma_{k}\Omega(\xi')$ の形になる。定数は $\gamma_{k}=(-i)^{k}\pi^{n/2}\Gamma(\frac k2)/\Gamma(\frac{k+n}{2})$ であることが知られている（Stein『Singular Integrals and Differentiability Properties of Functions』第 III 章。ここでは証明しない）。$k=1$, $\Omega=c_{n}\theta_{j}$ なら $\gamma_{1}=-i\pi^{(n+1)/2}/\Gamma(\frac{n+1}{2})=-i/c_{n}$ で、次の節のリース変換の乗数 $-i\xi_{j}/|\xi|$ と一致する。平均 $0$ の条件は、$k=0$ の成分（定数）がないことにあたる。比喩で言えば、球面上の模様 $\Omega$ を、回転について「純粋な音色」（球面調和関数）に分解すると、この写像は各音色の音量をそれぞれ $\gamma_{k}$ 倍するだけのイコライザーである。
:::

## リース変換 {#four:sec-si-riesz}

::: definition リース変換 {#four:si-riesz-transform keywords="Riesz transforms R_j f = p.v. c_n int y_j / |y|^{n+1} f(x-y) dy, c_n = Gamma((n+1)/2) / pi^{(n+1)/2}" index="リース変換|りーすへんかん"}
$j=1,\dots,n$ について $\Omega_{j}(\theta)\defeq c_{n}\theta_{j}$ とおき、$R_{j}\defeq T_{\Omega_{j}}$（\ref{four:si-homogeneous.3}）を**リース変換**という。核は $K_{j}(x)=c_{n}\frac{x_{j}}{|x|^{n+1}}$ で、$f\in\mathcal{S}$ なら $R_{j}f(x)=\mathrm{p.v.}\,c_{n}\int\frac{y_{j}}{|y|^{n+1}}f(x-y)dy$（a.e.）。
:::

::: intuition
リース変換はヒルベルト変換の $n$ 次元版で、$j$ 番目の座標方向の「位相を $90^{\circ}$ ずらす」作用素である。$n$ 個そろえて初めて、回転に関して自然な対象になる。
:::

$\tilde\Omega_{j}(x)=c_{n}x_{j}/|x|$ は $\mathbb{R}^{n}\setminus\{0\}$ 上 $C^{1}$ 級で、$\Omega_{j}$ は奇関数なので \ref{four:si-sphere-lemma.1} から平均 $0$。よって \ref{four:si-homogeneous} の前提を満たす。$n=1$ では $c_{1}=\frac1\pi$ で $R_{1}=H$。

::: theorem リース変換の乗数 {#four:si-riesz-multiplier keywords="Riesz transform multiplier -i xi_j / |xi|; sum of R_j^2 = -I on L^2; R_j bounded on L^p for 1 < p < infinity" index="リース変換の乗数|りーすへんかんのじょうすう"}
1. $R_{j}$ の乗数は $m_{j}(\xi)=-i\frac{\xi_{j}}{|\xi|}$ である：$\mathcal{F}(R_{j}f)=m_{j}\mathcal{F}f$（$f\in L^{2}$）。
2. $\sum_{j=1}^{n}R_{j}^{2}=-I$（$L^{2}$ 上）。
3. $1<p<\infty$ について、$f\in L^{2}\cap L^{p}$ なら $\|R_{j}f\|_{p}\le B_{p}\|f\|_{p}$（$B_{p}$ は $n,p$ だけによる）。
:::

::: intuition
$j$ 番目のリース変換は、周波数 $\xi$ の成分に、その方向の $j$ 成分 $\xi_{j}/|\xi|$ と $-i$ を掛ける。二乗して足すと $-1$ になる。
:::

::: proof
単位ベクトル $\omega\defeq\xi'$ をとる。\ref{four:si-homogeneous-multiplier} の $m$ を $\Omega_{j}$ について計算する。

**Step 1.** 【主張：$\log$ の項は消える】 $\theta\mapsto c_{n}\theta_{j}\log\frac{1}{|\theta\cdot\omega|}$ は奇関数で、\ref{four:si-sphere-lemma.2} から可積分なので、\ref{four:si-sphere-lemma.1} から積分は $0$。よって $m_{j}(\xi)=-\frac{i\pi}{2}c_{n}v_{j}$, $v_{j}\defeq\int\theta_{j}\sgn(\theta\cdot\omega)d\sigma(\theta)$。

**Step 2.** 【主張：$v_{j}=\frac{2\omega_{j}}{\pi c_{n}}$】 $g(x)\defeq x_{j}\sgn(x\cdot\omega)e^{-\pi|x|^{2}}$ に \ref{four:si-polar} を使うと $\int g=v_{j}\int_{0}^{\infty}r^{n}e^{-\pi r^{2}}dr$。$t=\pi r^{2}$ と置き換えて \ref{calc:gamma} から
$$
\int_{0}^{\infty}r^{n}e^{-\pi r^{2}}dr=\frac{1}{2\pi^{(n+1)/2}}\int_{0}^{\infty}t^{\frac{n-1}{2}}e^{-t}dt=\frac{c_{n}}{2}.
$$
一方、直交行列 $U$（$Ue_{1}=\omega$）で $x=Uy$ と置き換えると $x\cdot\omega=y_{1}$ なので $\int g=\sum_{k}U_{jk}\int y_{k}\sgn(y_{1})e^{-\pi|y|^{2}}dy$。$k\ne1$ の項は $y_{k}\mapsto-y_{k}$ について奇関数なので $0$。$k=1$ の項はフビニの定理と $\int e^{-\pi t^{2}}dt=1$（\ref{calc:gaussian-integral} から $t\mapsto\sqrt\pi t$ の置き換え）、$\int|t|e^{-\pi t^{2}}dt=\frac1\pi$ から $U_{j1}\cdot\frac1\pi=\frac{\omega_{j}}{\pi}$。よって $v_{j}=\frac{\omega_{j}}{\pi}\cdot\frac{2}{c_{n}}$。

**Step 3.** 【主張：1〜3】 Step 1・2 から $m_{j}(\xi)=-\frac{i\pi}{2}c_{n}\cdot\frac{2\omega_{j}}{\pi c_{n}}=-i\frac{\xi_{j}}{|\xi|}$。2 は $\sum_{j}m_{j}(\xi)^{2}=-\sum_{j}\frac{\xi_{j}^{2}}{|\xi|^{2}}=-1$（$\xi\ne0$）と、$\mathcal{F}$ が $L^{2}$ 上の全単射であること（\ref{four:plancherel.2}）から。3 は \ref{four:si-homogeneous.4} と \ref{four:si-cz-bounds.2}。

::: hypcheck
- 乗数の計算は \ref{four:poisson-fourier-rd}（証明していない事実）に頼らず、\ref{four:si-polar} とガウス積分だけで行った。そのかわり \ref{four:si-polar} を事実として使っている。
- 定数 $c_{n}$ がポアソン核と同じなのは偶然ではない：$K_{j}$ は共役ポアソン核 $c_{n}x_{j}/(t^{2}+|x|^{2})^{(n+1)/2}$ の $t\to0$ での極限で、\see{four:poisson-fourier-rd} を使って乗数を求める別の計算法がある（ここでは扱わない）。
:::
:::

::: supplement
**前提を変えると.** $p=1$ では $R_{j}$ は有界でない：$f\in L^{1}\cap L^{2}$ で $R_{j}f\in L^{1}$ がすべての $j$ で成り立てば、$\mathcal{F}(R_{j}f)=-i\frac{\xi_{j}}{|\xi|}\hat f$ は連続なので、$\xi\to0$ の方向ごとの極限 $-i\omega_{j}\hat f(0)$ が方向 $\omega$ によらず、$\hat f(0)=\int f=0$ でなければならない（\ref{four:ht-lp} の hypcheck の議論と同じ）。$\int f\ne0$ の $f\in\mathcal{S}$ では $R_{j}f\notin L^{1}$ である。

**似た定理.** $f\in L^{1}$ がハーディ空間 $H^{1}(\mathbb{R}^{n})$ に入ることと、$R_{1}f,\dots,R_{n}f$ がすべて $L^{1}$ に入ることは同値であることが知られている（フェファーマン–スタイン。ここでは証明しない）。$f$ のポアソン積分 $u$ と $R_{j}f$ のポアソン積分 $v_{j}$ の組 $(u,v_{1},\dots,v_{n})$ は、一般化されたコーシー–リーマン方程式 $\sum_{j}\partial_{x_{j}}v_{j}+\partial_{t}u=0$, $\partial_{x_{j}}u=\partial_{t}v_{j}$, $\partial_{x_{i}}v_{j}=\partial_{x_{j}}v_{i}$ を満たし（スタイン–ワイスの共役調和関数系）、$n=1$ では正則関数の実部と虚部に戻る。

**高い視点：正規化した勾配.** 乗数で見ると $(R_{1},\dots,R_{n})=-\nabla(-\Delta)^{-1/2}$（$\nabla$ の乗数は $2\pi i\xi$、$(-\Delta)^{-1/2}$ の乗数は $(2\pi|\xi|)^{-1}$）で、リース変換の組は「大きさをそろえた勾配」である。回転 $U$ について $(R_{j})$ はベクトルとして変換し、$\sum_{j}R_{j}^{2}=-I$ は $H^{2}=-I$ の $n$ 次元版である。リース変換は平行移動・正の拡大縮小と可換で、回転についてベクトルとして変換する $L^{2}$ 上の有界作用素の組として、定数倍を除いて一つに決まることが知られている（\see{four:ht-m-riesz} の補足の $n$ 次元版。ここでは証明しない）。比喩で言えば、各周波数成分の「進む向き」$\xi/|\xi|$ を読み取る方位磁針で、強さは見ずに向きだけを返す。
:::

## カルデロン–ジグムント評価 {#four:sec-si-cz-estimate}

::: theorem カルデロン–ジグムント評価 {#four:si-cz-estimate keywords="Calderon-Zygmund estimate ||d_i d_j u||_p <= C_p ||Delta u||_p for u in C_c^infty(R^n), 1 < p < infinity, from d_i d_j u = -R_i R_j Delta u; fails for p = 1, infinity" index="カルデロン–ジグムント評価|かるでろんじぐむんとひょうか, 二階微分の Lp 評価|にかいびぶんのえるぴーひょうか"}
$u\in C_{c}^{\infty}(\mathbb{R}^{n})$ とする。
1. $\partial_{i}\partial_{j}u=-R_{i}R_{j}\Delta u$（a.e.）。
2. $1<p<\infty$ なら $\|\partial_{i}\partial_{j}u\|_{p}\le B_{p}^{2}\|\Delta u\|_{p}$（$B_{p}$ は \ref{four:si-riesz-multiplier.3} の定数）。
:::

::: intuition
ラプラシアンが $L^{p}$ に入っていれば、二階の偏導関数はすべて同じ $L^{p}$ に入る。混合偏導関数はラプラシアンにリース変換を二回施したものだからである。
:::

::: proof
**Step 1.** 【主張：項目 1】 \ref{four:schwartz-basic.1}・\ref{four:schwartz-basic.2} から $u$, $\partial_{i}\partial_{j}u$, $\Delta u\in\mathcal{S}\subset L^{1}\cap L^{2}$ で、\ref{four:schwartz-fourier.1} から $\widehat{\partial_{i}\partial_{j}u}=-4\pi^{2}\xi_{i}\xi_{j}\hat u$, $\widehat{\Delta u}=-4\pi^{2}|\xi|^{2}\hat u$。\ref{four:si-riesz-multiplier.1} から
$$
\begin{aligned}\mathcal{F}(R_{i}R_{j}\Delta u)&=\Bigl(-i\frac{\xi_{i}}{|\xi|}\Bigr)\Bigl(-i\frac{\xi_{j}}{|\xi|}\Bigr)(-4\pi^{2}|\xi|^{2})\hat u\\&=4\pi^{2}\xi_{i}\xi_{j}\hat u=-\widehat{\partial_{i}\partial_{j}u}.\end{aligned}
$$
$\mathcal{F}$ は $L^{2}$ 上単射なので 1 が出る。

**Step 2.** 【主張：項目 2】 $\Delta u\in L^{2}\cap L^{p}$ なので、\ref{four:si-riesz-multiplier.3} から $R_{j}\Delta u\in L^{2}\cap L^{p}$ で $\|R_{j}\Delta u\|_{p}\le B_{p}\|\Delta u\|_{p}$。もう一度 $R_{i}$ に使い、1 と合わせる。

::: hypcheck
- **$1<p<\infty$**：Step 2 でリース変換の $L^{p}$ 有界性に使った。$n\ge2$ なら、$p=1$ でも $p=\infty$ でもこの評価は成り立たない（\ref{four:si-cz-endpoint}。$p=\infty$ では $x_{1}x_{2}\log\log\frac{1}{|x|}$ を原点の近くで滑らかにした関数の族で、$\Delta u$ が一様に有界なまま $\partial_{1}\partial_{2}u$ が非有界になる）。$n=1$ では $\partial_{1}\partial_{1}u=\Delta u$ なので、どの $p$ でも定数 $1$ で自明に成り立つ。
- **$u\in C_{c}^{\infty}$**：$\mathcal{S}$ に入ることだけを使った。$u\in\mathcal{S}$ でも同じ。
:::
:::

::: supplement
**一般化.** 同じ評価は $u\in W^{2,p}(\mathbb{R}^{n})$（$1<p<\infty$。弱導関数で考える。ソボレフ空間は \ref{fa:sobolev-space}）に延びる：\ref{fa:test-dense-rn} から $u_{k}\in C_{c}^{\infty}$ で $\|u_{k}-u\|_{W^{2,p}}\to0$ となるものをとると、$\partial_{i}\partial_{j}u_{k}\to\partial_{i}\partial_{j}u$ と $\Delta u_{k}=\sum_{l}\partial_{l}^{2}u_{k}\to\Delta u$ が $L^{p}$ で成り立つので、$\|\partial_{i}\partial_{j}u_{k}\|_{p}\le B_{p}^{2}\|\Delta u_{k}\|_{p}$ の極限をとれば $\|\partial_{i}\partial_{j}u\|_{p}\le B_{p}^{2}\|\Delta u\|_{p}$。これが楕円型方程式の $L^{p}$ 正則性理論の出発点になる。$p=2$ では定数 $1$ で成り立つ（\see{four:prob-si-l2-hessian}）。

**高い視点：乗数の言葉.** $\partial_{i}\partial_{j}\Delta^{-1}$ の乗数 $\xi_{i}\xi_{j}/|\xi|^{2}$ は $0$ 次斉次で、原点以外で滑らかである。このような乗数は一般にカルデロン–ジグムント作用素を与え（ミフリンの乗数定理）、次のページで扱う。比喩で言えば、微分作用素の「次数」を数え、次数 $0$ の部分が $L^{p}$ で安全に扱える、という会計である。

**前提を変えると.** $p=\infty$ の代わりにヘルダー空間 $C^{\alpha}$（$0<\alpha<1$）をとると、評価は再び成り立つ：$\Delta u\in C^{\alpha}$ なら $\partial_{i}\partial_{j}u\in C^{\alpha}$（シャウダー評価。ここでは証明しない）。$\alpha=0$（連続関数・有界関数）と $\alpha=1$ では成り立たない。端点の $L^{\infty}$ を、少しだけ滑らかさを足した空間か、少しだけ大きい空間（BMO）に替えれば救える、というのがこの分野の典型的な形である。

**似た定理.** ラプラシアンを一般の定数係数の楕円型作用素 $P(D)$（$d$ 次斉次で、表象 $P(\xi)$ が $\xi\ne0$ で $0$ にならないもの）に替えても、$|\alpha|=d$ について $\|\partial^{\alpha}u\|_{p}\le C\|P(D)u\|_{p}$（$1<p<\infty$）が成り立つ。乗数 $\xi^{\alpha}/P(\xi)$ が $0$ 次斉次で原点の外で滑らかなので、次のページの \see{four:ml-homogeneous-symbols} から従う。
:::

::: proposition 端点での反例 {#four:si-cz-endpoint keywords="failure of the Calderon-Zygmund estimate at p = infinity (x_1 x_2 log log 1/|x|) and at p = 1 (smoothed fundamental solution log|x|)" index="カルデロン–ジグムント評価の端点での反例|かるでろんじぐむんとひょうかのたんてんでのはんれい"}
$n=2$ とする。
1. $C_{c}^{\infty}(\mathbb{R}^{2})$ の関数の族 $(u_{\delta})_{0<\delta\le1/4}$ で、$\sup_{\delta}\|\Delta u_{\delta}\|_{\infty}<\infty$ かつ $\partial_{1}\partial_{2}u_{\delta}(0)=\log\log\frac1\delta\to\infty$（$\delta\to0$）となるものがある。原点の近くでは $u_{\delta}(x)=x_{1}x_{2}\log\log\bigl(|x|^{2}+\delta^{2}\bigr)^{-1/2}$。
2. $C_{c}^{\infty}(\mathbb{R}^{2})$ の関数の族 $(w_{\varepsilon})_{0<\varepsilon<1}$ で、$\|\Delta w_{\varepsilon}\|_{1}\le2$ かつ $\|\partial_{1}\partial_{2}w_{\varepsilon}\|_{1}\to\infty$（$\varepsilon\to0$）となるものがある。$\varepsilon<|x|<1$ では $w_{\varepsilon}(x)=\frac{1}{2\pi}\log|x|+(\text{定数})$。

とくに \ref{four:si-cz-estimate.2} の形の評価 $\|\partial_{1}\partial_{2}u\|_{p}\le C\|\Delta u\|_{p}$ は、$p=\infty$ でも $p=1$ でも成り立たない。$n\ge3$ でも同じである。
:::

::: proof
$\beta$ を \ref{calc:non-analytic-smooth.2} の関数（$C^{\infty}$ 級で、$|t|\le\frac12$ で $1$、$|t|\ge1$ で $0$、値は $[0,1]$）とする。$\beta$ は $0$ の近くで定数なので、$x\mapsto\beta(c|x|)$（$c>0$）は $\mathbb{R}^{2}$ 上 $C^{\infty}$ 級である。

**Step 1.** $0<\delta\le\frac14$ とし、$|x|<\frac14$ で $\rho\defeq(|x|^{2}+\delta^{2})^{1/2}$, $\ell\defeq\log\frac1\rho$, $F(\rho)\defeq\log\ell$, $v_{\delta}(x)\defeq x_{1}x_{2}F(\rho)$ とおく。$\rho\le\frac{1}{2\sqrt2}<\frac1e$ なので $\ell>1$ で、$v_{\delta}$ は $C^{\infty}$ 級。【主張：$|x|<\frac14$ で $|\Delta v_{\delta}|\le\frac72$、また $\partial_{1}\partial_{2}v_{\delta}(0)=\log\log\frac1\delta$】 $F'(\rho)=-\frac{1}{\rho\ell}$, $F''(\rho)=\frac{\ell-1}{\rho^{2}\ell^{2}}$ と $\partial_{k}\rho=\frac{x_{k}}{\rho}$, $\Delta(x_{1}x_{2})=0$, $\nabla(x_{1}x_{2})=(x_{2},x_{1})$ から
$$
\begin{aligned}\Delta\bigl(F(\rho)\bigr)&=F''\frac{|x|^{2}}{\rho^{2}}+F'\Bigl(\frac{2}{\rho}-\frac{|x|^{2}}{\rho^{3}}\Bigr),\\\Delta v_{\delta}&=x_{1}x_{2}\,\Delta\bigl(F(\rho)\bigr)+\frac{4x_{1}x_{2}F'}{\rho}.\end{aligned}
$$
$\ell>1$ から $0\le\frac{\ell-1}{\ell^{2}}<1$, $\frac1\ell<1$。$\frac{|x|^{2}}{\rho^{2}}\le1$, $0<\frac2\rho-\frac{|x|^{2}}{\rho^{3}}\le\frac2\rho$ なので $|\Delta(F(\rho))|\le\frac{1}{\rho^{2}}+\frac{2}{\rho^{2}}=\frac{3}{\rho^{2}}$。$|x_{1}x_{2}|\le\frac{|x|^{2}}{2}\le\frac{\rho^{2}}{2}$ と合わせて $|\Delta v_{\delta}|\le\frac32+4\cdot\frac{\rho^{2}}{2}\cdot\frac{1}{\rho^{2}\ell}\le\frac32+2$。また積の微分から $\partial_{1}\partial_{2}v_{\delta}=F+x_{1}\partial_{1}F+x_{2}\partial_{2}F+x_{1}x_{2}\partial_{1}\partial_{2}F$ で、$x=0$ では第 1 項だけが残り、$\rho=\delta$ なので値は $F(\delta)=\log\log\frac1\delta$。

**Step 2.** $\chi(x)\defeq\beta(4|x|)$（$|x|\le\frac18$ で $1$、$|x|\ge\frac14$ で $0$）とし、$u_{\delta}\defeq\chi v_{\delta}$（$|x|\ge\frac14$ では $0$）とおく。【主張：項目 1】 $u_{\delta}\in C_{c}^{\infty}$ で、$|x|\le\frac18$ では $u_{\delta}=v_{\delta}$ なので $\partial_{1}\partial_{2}u_{\delta}(0)=\log\log\frac1\delta$。$\frac18\le|x|\le\frac14$ では $\frac18\le\rho\le\frac{1}{2\sqrt2}$ なので $1<\ell<\log8<3$、$0<F<\log3<2$ で、$|\partial_{k}v_{\delta}|=|\partial_{k}(x_{1}x_{2})F+x_{1}x_{2}F'\frac{x_{k}}{\rho}|\le\frac14\cdot2+\frac{\rho^{2}}{2}\cdot\frac{1}{\rho\ell}\le1$, $|v_{\delta}|\le1$。よって $\Delta u_{\delta}=\chi\Delta v_{\delta}+2\nabla\chi\cdot\nabla v_{\delta}+v_{\delta}\Delta\chi$ と Step 1 から、$|\Delta u_{\delta}|\le\frac72+2\sqrt2\|\nabla\chi\|_{\infty}+\|\Delta\chi\|_{\infty}$ で、右辺は $\delta$ によらない。

**Step 3.** $a,b>0$ を $\int_{\mathbb{R}^{2}}a\beta(|x|)dx=\int_{\mathbb{R}^{2}}b\beta(2|x|-3)dx=1$ となるようにとる（被積分関数は連続で非負、それぞれ $|x|<\frac12$, $\frac54<|x|<\frac74$ の上で正なので、どちらの積分も正）。$0<\varepsilon<1$ について $G_{\varepsilon}(t)\defeq a\varepsilon^{-2}\beta(t/\varepsilon)-b\beta(2t-3)$（$t\ge0$）、$g_{\varepsilon}(x)\defeq G_{\varepsilon}(|x|)$ とおく。第 1 項は $|x|<\varepsilon$ に、第 2 項は $1<|x|<2$ に台をもち、$\int g_{\varepsilon}=1-1=0$。$\Phi_{\varepsilon}(r)\defeq\int_{0}^{r}G_{\varepsilon}(s)s\,ds$ とおくと、\ref{four:si-polar}（$n=2$, $\sigma(S^{1})=2\pi$）から $2\pi\Phi_{\varepsilon}(r)=\int_{|x|<r}g_{\varepsilon}$ なので、$\Phi_{\varepsilon}(r)=\frac{1}{2\pi}$（$\varepsilon\le r\le1$）、$\Phi_{\varepsilon}(r)=0$（$r\ge2$）。$W_{\varepsilon}(r)\defeq-\int_{r}^{\infty}\frac{\Phi_{\varepsilon}(s)}{s}ds$（$r>0$）、$w_{\varepsilon}(x)\defeq W_{\varepsilon}(|x|)$ とおく。【主張：$w_{\varepsilon}\in C_{c}^{\infty}(\mathbb{R}^{2})$ で $\Delta w_{\varepsilon}=g_{\varepsilon}$】 $r\ge2$ で $W_{\varepsilon}=0$。$W_{\varepsilon}'=\Phi_{\varepsilon}/r$ は $(0,\infty)$ で $C^{\infty}$ 級なので、$w_{\varepsilon}$ は原点の外で $C^{\infty}$ 級。$r\le\frac\varepsilon2$ では $G_{\varepsilon}=a\varepsilon^{-2}\eqdef c$ が定数で、$\Phi_{\varepsilon}=\frac{cr^{2}}{2}$, $W_{\varepsilon}'=\frac{cr}{2}$ から $w_{\varepsilon}(x)=\frac{c}{4}|x|^{2}+(\text{定数})$ なので、原点の近くでも $C^{\infty}$ 級。$x\ne0$ では $\partial_{k}w_{\varepsilon}=W_{\varepsilon}'\frac{x_{k}}{r}$, $\partial_{k}^{2}w_{\varepsilon}=W_{\varepsilon}''\frac{x_{k}^{2}}{r^{2}}+W_{\varepsilon}'\bigl(\frac1r-\frac{x_{k}^{2}}{r^{3}}\bigr)$（$r=|x|$）を $k=1,2$ で足して $\Delta w_{\varepsilon}=W_{\varepsilon}''+\frac{W_{\varepsilon}'}{r}=\frac1r(rW_{\varepsilon}')'=\frac1r\Phi_{\varepsilon}'(r)=G_{\varepsilon}(r)$。原点では両辺の連続性から。

**Step 4.** 【主張：項目 2】 Step 3 から $\|\Delta w_{\varepsilon}\|_{1}=\|g_{\varepsilon}\|_{1}\le1+1=2$。$\varepsilon<r<1$ では $W_{\varepsilon}'(r)=\frac{1}{2\pi r}$ なので $w_{\varepsilon}(x)=\frac{1}{2\pi}\log|x|+(\text{定数})$ で、$\partial_{2}w_{\varepsilon}=\frac{x_{2}}{2\pi|x|^{2}}$, $\partial_{1}\partial_{2}w_{\varepsilon}=-\frac{x_{1}x_{2}}{\pi|x|^{4}}$。$\kappa\defeq\int_{S^{1}}|\theta_{1}\theta_{2}|d\sigma(\theta)$ とおくと、\ref{four:si-polar} から
$$
\|\partial_{1}\partial_{2}w_{\varepsilon}\|_{1}\ge\frac1\pi\int_{\varepsilon<|x|<1}\frac{|x_{1}x_{2}|}{|x|^{4}}dx=\frac{\kappa}{\pi}\int_{\varepsilon}^{1}\frac{dr}{r}=\frac{\kappa}{\pi}\log\frac1\varepsilon.
$$
$\kappa>0$ である：同じ公式から $\int_{|x|<1}|x_{1}x_{2}|dx=\frac\kappa4$ で、左辺は開集合 $\{|x|<1,\ x_{1}x_{2}\ne0\}$ の上で正の連続関数の積分なので正。よって $\varepsilon\to0$ で右辺は $\infty$ に発散する。

最後の主張：評価が $p=\infty$ で成り立てば $\log\log\frac1\delta=|\partial_{1}\partial_{2}u_{\delta}(0)|\le\|\partial_{1}\partial_{2}u_{\delta}\|_{\infty}\le C\sup_{\delta}\|\Delta u_{\delta}\|_{\infty}$ が $\delta\to0$ で矛盾し、$p=1$ で成り立てば $\|\partial_{1}\partial_{2}w_{\varepsilon}\|_{1}\le2C$ が矛盾する。$n\ge3$ では $\eta(y)\defeq\beta(|y|)$（$y\in\mathbb{R}^{n-2}$, $\eta(0)=1$）を掛けた $U_{\delta}(x)\defeq u_{\delta}(x_{1},x_{2})\eta(x_{3},\dots,x_{n})$, $\tilde W_{\varepsilon}(x)\defeq w_{\varepsilon}(x_{1},x_{2})\eta(x_{3},\dots,x_{n})$ を使う。$\Delta U_{\delta}=(\Delta u_{\delta})\eta+u_{\delta}\Delta\eta$ で、$|u_{\delta}|\le|x_{1}x_{2}|\ell\le\frac{\rho^{2}}{2}\log\frac1\rho\le\frac{1}{4e}$（$F=\log\ell\le\ell$、$t^{2}\log\frac1t\le\frac{1}{2e}$）は $\delta$ によらず有界、$\partial_{1}\partial_{2}U_{\delta}(0)=\log\log\frac1\delta$。$\Delta\tilde W_{\varepsilon}=g_{\varepsilon}\eta+w_{\varepsilon}\Delta\eta$、$\|\partial_{1}\partial_{2}\tilde W_{\varepsilon}\|_{1}=\|\partial_{1}\partial_{2}w_{\varepsilon}\|_{1}\|\eta\|_{1}$ で、$\|w_{\varepsilon}\|_{1}$ は $\varepsilon$ によらず有界である：$s\ge1$ での $\Phi_{\varepsilon}(s)=\frac{1}{2\pi}-\int_{0}^{s}b\beta(2t-3)t\,dt$ は $\varepsilon$ によらないので $W_{\varepsilon}$ も $[1,\infty)$ で $\varepsilon$ によらず、$\varepsilon\le r\le1$ では $W_{\varepsilon}(r)=\frac{1}{2\pi}\log r+W_{\varepsilon}(1)$、$r<\varepsilon$ では $0\le\Phi_{\varepsilon}\le\frac{1}{2\pi}$ から $|W_{\varepsilon}(r)-W_{\varepsilon}(\varepsilon)|\le\frac{1}{2\pi}\log\frac\varepsilon r$。よって $0<r\le1$ で $|W_{\varepsilon}(r)|\le|W_{\varepsilon}(1)|+\frac{1}{2\pi}\log\frac1r$ で、$\int_{|x|<1}\log\frac{1}{|x|}dx=2\pi\int_{0}^{1}r\log\frac1r\,dr=\frac\pi2$。

::: hypcheck
- **$n\ge2$**：$\partial_{1}\partial_{2}$ が $\Delta$ と別の微分であることに使った。$n=1$ では $\partial_{1}^{2}u=\Delta u$ で、評価は自明に成り立つ。
- **1 の $\log\log$**：$|x_{1}x_{2}|\le\frac{\rho^{2}}{2}$ が $\Delta(F(\rho))$ の $\rho^{-2}$ の大きさを打ち消し、残る $F'$ の項の $\frac1\ell$ が $\Delta v_{\delta}$ を有界に保つ（Step 1）。より簡単な $x_{1}x_{2}\log(|x|^{2}+\delta^{2})$ でも $p=\infty$ の反例になる（\see{four:ex-si-2}）。$\log\log$ にすると、$\delta=0$ の関数 $x_{1}x_{2}\log\log\frac1{|x|}$ について 原点の外で計算した $\Delta v_{0}=-\frac{x_{1}x_{2}}{|x|^{2}}\bigl(\frac{1}{\ell^{2}}+\frac4\ell\bigr)$（$\ell=\log\frac{1}{|x|}$）が原点で $0$ に連続につながるのに、$\partial_{1}\partial_{2}v_{0}$ は原点の近くで有界でない。
- **2 の構成**：$g_{\varepsilon}$ は原点の点質量と半径 $1$〜$2$ の円環上の負の質量を近似したもので、$\int g_{\varepsilon}=0$ だから $w_{\varepsilon}$ はコンパクトな台をもつ（Step 3 の $\Phi_{\varepsilon}(r)=0$, $r\ge2$）。$\partial_{1}\partial_{2}\log|x|$ が $|x|^{-2}$ の大きさで、2 次元では原点の近くで可積分でないことが発散の原因である。
- **選択公理**：使わない。
:::
:::

## 問題 {#four:sec-si-problems}

::: problem {#four:prob-si-mean-zero}
$\Omega\equiv1$（平均 $0$ でない）とし、$K(x)=|x|^{-n}$ とする。$f\in\mathcal{S}$ が $f\ge0$, $f(0)>0$ を満たせば、$\int_{\varepsilon<|y|<1}K(y)f(-y)\,dy\to\infty$（$\varepsilon\to0$）であり、$\widehat{K_{\varepsilon,1}}(0)\to\infty$ であることを示せ。
:::

::: solution
$f$ は連続なので、ある $\delta\in(0,1)$ について $|y|<\delta$ で $f(-y)\ge\frac{f(0)}{2}$。$\varepsilon<\delta$ なら、$f\ge0$ と \ref{four:si-polar}（$\sigma(S^{n-1})=n\omega_{n}$）から
$$
\begin{aligned}\int_{\varepsilon<|y|<1}\frac{f(-y)}{|y|^{n}}dy&\ge\frac{f(0)}{2}\int_{\varepsilon<|y|<\delta}\frac{dy}{|y|^{n}}\\&=\frac{f(0)}{2}n\omega_{n}\log\frac{\delta}{\varepsilon}\to\infty.\end{aligned}
$$
同じ計算で $\widehat{K_{\varepsilon,1}}(0)=\int_{\varepsilon<|y|<1}|y|^{-n}dy=n\omega_{n}\log\frac1\varepsilon\to\infty$。したがって切断の乗数は一様に有界にならず、\ref{four:si-homogeneous-multiplier} の平均 $0$ の条件は外せない。
:::

::: problem {#four:prob-si-l2-hessian}
$u\in C_{c}^{\infty}(\mathbb{R}^{n})$ について $\sum_{i,j=1}^{n}\|\partial_{i}\partial_{j}u\|_{2}^{2}=\|\Delta u\|_{2}^{2}$ を示せ。とくに $\|\partial_{i}\partial_{j}u\|_{2}\le\|\Delta u\|_{2}$。
:::

::: solution
\ref{four:si-cz-estimate} の証明の Step 1 から $\widehat{\partial_{i}\partial_{j}u}=-4\pi^{2}\xi_{i}\xi_{j}\hat u$, $\widehat{\Delta u}=-4\pi^{2}|\xi|^{2}\hat u$。\ref{four:plancherel.2} から
$$
\begin{aligned}\sum_{i,j}\|\partial_{i}\partial_{j}u\|_{2}^{2}&=16\pi^{4}\int\sum_{i,j}\xi_{i}^{2}\xi_{j}^{2}|\hat u|^{2}d\xi\\&=16\pi^{4}\int|\xi|^{4}|\hat u|^{2}d\xi=\|\Delta u\|_{2}^{2},\end{aligned}
$$
$\sum_{i,j}\xi_{i}^{2}\xi_{j}^{2}=\bigl(\sum_{i}\xi_{i}^{2}\bigr)^{2}$ を使った。各項は和以下なので後半が従う。（$\|R_{j}\|_{L^{2}\to L^{2}}\le1$ からも出る。）
:::
