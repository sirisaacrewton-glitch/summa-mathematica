# フーリエ乗数とリトルウッド–ペイリー理論 {#four:page-multipliers-lp keywords="Fourier multipliers, Mihlin multiplier theorem, Littlewood-Paley theory, square function, フーリエ乗数, ミフリンの乗数定理, リトルウッド–ペイリー理論, 二乗関数"}

ヒルベルト変換もリース変換も、フーリエ側で有界な関数 $m$ を掛ける作用素で、$1<p<\infty$ の $L^{p}$ で有界だった（\ref{four:page-singular-integrals}）。どんな $m$ がこの性質をもつかを問う。$L^{2}$ では $m$ が有界なら十分だが、$p\ne2$ では $m$ の滑らかさが要る。原点の外で $\lfloor n/2\rfloor+1$ 階まで $|\partial^{\beta}m(\xi)|\lesssim|\xi|^{-|\beta|}$ なら十分、というのが**ミフリンの乗数定理**である。証明は周波数を 2 進の環に切り分け（リトルウッド–ペイリー分解）、各片の核を評価して \ref{four:si-cz-bounds} に帰着させる。同じ分解から**二乗関数** $Sf$ が定まり、$\|Sf\|_{p}$ と $\|f\|_{p}$ が同程度であることが、$\ell^{2}$ 値の核のカルデロン–ジグムント理論から従う。

## 記法と定義の確認 {#four:sec-ml-notation}

::: notation
- 空間は $\mathbb{R}^{n}$（$n\ge1$）。$\hat f$、$L^{2}$ 上の $\mathcal{F}$、逆変換 $\check g(x)=\int g(\xi)e^{2\pi ix\cdot\xi}d\xi$、$\mathcal{S}$ は \ref{four:fourier-transform}, \ref{four:plancherel}, \ref{four:schwartz-space} のとおり。$\omega_{n}$ と放射的な関数の積分は \ref{four:radial-integral}。
- 多重指数 $\beta$ について $|\beta|=\beta_{1}+\dots+\beta_{n}$。このページを通して $k\defeq\lfloor n/2\rfloor+1$ と固定する。$2k\ge n+1$ で、$k-\frac n2\ge\frac12$ である。
- カルデロン–ジグムント作用素は \ref{four:si-cz-operator}、その有界性は \ref{four:si-cz-bounds}（証明の Step 1〜6 を引用する）、カルデロン–ジグムント分解は \ref{four:ht-cz-decomposition}。
- $\ell^{2}\defeq\ell^{2}(\mathbb{Z})$。$H$ は $\mathbb{C}$ か $\ell^{2}$ を表す。$H$ 値関数の可測性と積分は成分ごとに考え、$L^{p}(\mathbb{R}^{n};H)$ は $\|f\|_{L^{p}(H)}\defeq\bigl\|\|f(\cdot)\|_{H}\bigr\|_{p}<\infty$ となる関数の空間とする。$L^{2}(\mathbb{R}^{n};\ell^{2})$ は $L^{2}(\mathbb{R}^{n}\times\mathbb{Z})$ と同じなので完備である。$\int\|F\|<\infty$ なら $\int F\in H$ で $\|\int F\|\le\int\|F\|$（$w=(\int F_{j})_{|j|\le N}$ について $\|w\|^{2}=\int\sum_{j}\bar w_{j}F_{j}\le\|w\|\int\|F\|$）。$u,v\in H$ について $u\cdot v\defeq\sum_{j}u_{j}v_{j}$（$H=\mathbb{C}$ なら積）。
- **選択公理**：使わない。
:::

## Lᵖ 乗数 {#four:sec-ml-multipliers}

::: definition Lᵖ 乗数 {#four:ml-multiplier keywords="L^p Fourier multiplier, multiplier norm M_p" index="Lp 乗数|えるぴーじょうすう, フーリエ乗数|ふーりえじょうすう, 乗数ノルム|じょうすうのるむ"}
$m\in L^{\infty}(\mathbb{R}^{n})$ とする。$f\in\mathcal{S}$ について $T_{m}f\defeq(m\hat f)^{\vee}$ とおく（$m\hat f\in L^{1}\cap L^{2}$ なので $T_{m}f$ は有界連続で、$\mathcal{F}^{-1}(m\mathcal{F}f)$ と a.e. で一致する）。$1\le p<\infty$ について
$$
\|m\|_{M_{p}}\defeq\sup\Bigl\{\frac{\|T_{m}f\|_{p}}{\|f\|_{p}}:f\in\mathcal{S},\ f\ne0\Bigr\}\in[0,\infty]
$$
とおき、これが有限のとき $m$ を **$L^{p}$ 乗数**（フーリエ乗数）という。
:::

::: intuition
周波数ごとに $m(\xi)$ 倍しても $L^{p}$ ノルムが定数倍までしか増えないとき、$m$ を $L^{p}$ 乗数という。
:::

$\mathcal{S}$ は $L^{p}$ で稠密なので（\ref{fa:test-dense-rn} で $k=0$、\ref{four:schwartz-basic.1}）、$L^{p}$ 乗数の $T_{m}$ は $L^{p}$ 上にただ一つに延びる。例：$n=1$ の $-i\sgn\xi$ は \ref{four:ht-multiplier}, \ref{four:ht-lp} から、$-i\xi_{j}/|\xi|$ は \ref{four:si-riesz-multiplier} から、$1<p<\infty$ の $L^{p}$ 乗数である。

::: proposition Lᵖ 乗数の基本性質 {#four:ml-multiplier-basic keywords="L^2 multipliers = L^infinity, translation dilation modulation invariance, duality M_p = M_p'" index="Lp 乗数の基本性質|えるぴーじょうすうのきほんせいしつ"}
$m\in L^{\infty}$, $1\le p<\infty$ とする。
1. $\|m\|_{M_{2}}=\|m\|_{\infty}$。
2. $a,b\in\mathbb{R}^{n}$, $\lambda\in\mathbb{R}\setminus\{0\}$ について、$m(\cdot+a)$、$e^{2\pi ib\cdot\xi}m(\xi)$、$m(\lambda\,\cdot)$ の $M_{p}$ ノルムはどれも $\|m\|_{M_{p}}$ に等しい。
3. $1<p<\infty$, $\frac1p+\frac1{p'}=1$ なら $\|m\|_{M_{p}}=\|m\|_{M_{p'}}$。
:::

::: proof
**Step 1.** 【1】 \ref{four:plancherel.2} から $\|T_{m}f\|_{2}=\|m\hat f\|_{2}\le\|m\|_{\infty}\|f\|_{2}$。逆に $0<t<\|m\|_{\infty}$ なら $\{|m|>t\}$ は測度が正で、$0<|E|<\infty$ の可測集合 $E$ を含む。$\mathcal{S}$ は $L^{2}$ で稠密なので $\varphi_{l}\in\mathcal{S}$ で $\varphi_{l}\to\mathbf{1}_{E}$（$L^{2}$）となるものをとり、$f_{l}\defeq\check\varphi_{l}$ とおくと \ref{four:schwartz-fourier.3} から $\hat f_{l}=\varphi_{l}$。$\|T_{m}f_{l}\|_{2}=\|m\varphi_{l}\|_{2}\to\|m\mathbf{1}_{E}\|_{2}\ge t|E|^{1/2}$、$\|f_{l}\|_{2}=\|\varphi_{l}\|_{2}\to|E|^{1/2}$ なので $\|m\|_{M_{2}}\ge t$。

**Step 2.** 【2】 $M_{a}f(x)\defeq e^{2\pi ia\cdot x}f(x)$、$\tau_{b}f(x)\defeq f(x+b)$、$D_{\lambda}f(x)\defeq f(\lambda x)$ は $\mathcal{S}$ を $\mathcal{S}$ に移し、$\|M_{a}f\|_{p}=\|\tau_{b}f\|_{p}=\|f\|_{p}$、$\|D_{\lambda}f\|_{p}=|\lambda|^{-n/p}\|f\|_{p}$。$T_{m}f$ を定める積分で変数を置き換えると（$\widehat{M_{a}f}(\xi)=\hat f(\xi-a)$、$\widehat{D_{\lambda}f}(\zeta)=|\lambda|^{-n}\hat f(\zeta/\lambda)$）
$$
T_{m(\cdot+a)}f=M_{-a}T_{m}M_{a}f,\quad T_{e^{2\pi ib\cdot\xi}m}f=\tau_{b}T_{m}f,\quad T_{m(\lambda\cdot)}f=D_{1/\lambda}T_{m}D_{\lambda}f.
$$
よって三つの $M_{p}$ ノルムは $\|m\|_{M_{p}}$ 以下（3 番目は $|\lambda|^{n/p}\cdot|\lambda|^{-n/p}=1$）。$-a$, $-b$, $1/\lambda$ に同じことを使えば逆の不等式。

**Step 3.** 【$h\in L^{2}$ がすべての $g\in\mathcal{S}$ で $|\int hg|\le C\|g\|_{p'}$ を満たせば $\|h\|_{p}\le C$】 有界で台がコンパクトな $g$ は軟化 $\rho_{\varepsilon}*g\in C_{c}^{\infty}$ で $L^{2}$ と $L^{p'}$ の両方で近似できる（\ref{fa:mollification-sobolev.3}, $k=0$）ので、不等式はこの $g$ にも延びる。$E_{R}\defeq\{|x|\le R,\ |h|\le R\}$、$g\defeq|h|^{p-1}\overline{\sgn h}\,\mathbf{1}_{E_{R}}$ とおくと $\int hg=\int_{E_{R}}|h|^{p}$、$\|g\|_{p'}=(\int_{E_{R}}|h|^{p})^{1/p'}$ なので $(\int_{E_{R}}|h|^{p})^{1/p}\le C$。$R\to\infty$ として \ref{meas:monotone-convergence}。

**Step 4.** 【3】 $f,g\in\mathcal{S}$ について、$m\hat f\in L^{1}$, $g\in L^{1}$ なのでフビニの定理から $\int(T_{m}f)g=\int m(\xi)\hat f(\xi)\hat g(-\xi)d\xi$。$\tilde m(\xi)\defeq m(-\xi)$ について同じ計算と $\xi\mapsto-\xi$ から、これは $\int f\,(T_{\tilde m}g)$ に等しい。ヘルダーの不等式から $|\int(T_{m}f)g|\le\|f\|_{p}\|\tilde m\|_{M_{p'}}\|g\|_{p'}$ で、Step 3（$h=T_{m}f$）から $\|m\|_{M_{p}}\le\|\tilde m\|_{M_{p'}}=\|m\|_{M_{p'}}$（2 で $\lambda=-1$）。$p$ と $p'$ を入れ替える。
:::

## 二進分割とベクトル値の特異積分 {#four:sec-ml-tools}

::: lemma 滑らかな二進分割 {#four:ml-partition keywords="smooth dyadic partition of unity, sum psi(2^{-j} xi)^2 = 1" index="二進分割|にしんぶんかつ, リトルウッド–ペイリー分解|りとるうっどぺいりーぶんかい"}
実数値の $\psi\in C_{c}^{\infty}(\mathbb{R}^{n})$ で、次を満たすものがある。
1. $\psi$ は $\{\frac12\le|\xi|\le2\}$ の外で $0$。
2. $\xi\ne0$ なら $\sum_{j\in\mathbb{Z}}\psi(2^{-j}\xi)^{2}=1$ で、和の $0$ でない項は高々二つ。
:::

::: proof
\ref{calc:non-analytic-smooth.2} の関数（$|x|\le\frac12$ で $1$、$|x|\ge1$ で $0$）を $\theta$ とし、$\chi(\xi)\defeq\theta(|\xi|/2)$ とおく。$\chi$ は原点の近くで $1$ なので $\mathbb{R}^{n}$ で $C^{\infty}$ 級で、$|\xi|\le1$ で $1$、$|\xi|\ge2$ で $0$。$\eta_{0}(\xi)\defeq\chi(\xi)-\chi(2\xi)$ は $|\xi|\le\frac12$ と $|\xi|\ge2$ で $0$ なので、$\eta_{0}(2^{-j}\xi)\ne0$ なら $2^{j-1}<|\xi|<2^{j+1}$ で、そのような $j$ は高々二つ。$\sum_{j=-N}^{N}\eta_{0}(2^{-j}\xi)=\chi(2^{-N}\xi)-\chi(2^{N+1}\xi)$ は $N$ が大きければ $1$。$D(\xi)\defeq\sum_{j}\eta_{0}(2^{-j}\xi)^{2}$ は、項が高々二つなのでコーシー–シュワルツの不等式から $D\ge\frac12$。$D$ は局所的に有限和なので $\mathbb{R}^{n}\setminus\{0\}$ で $C^{\infty}$ 級、$D(2\xi)=D(\xi)$。$\psi\defeq\eta_{0}/\sqrt D$（$\psi(0)\defeq0$）とおけば $\sum_{j}\psi(2^{-j}\xi)^{2}=\sum_{j}\eta_{0}(2^{-j}\xi)^{2}/D(\xi)=1$。
:::

以下 $\psi$ を一つ固定し、$\eta\defeq\psi^{2}$ とおく（$\sum_{j}\eta(2^{-j}\xi)=1$、$0\le\eta\le1$）。

::: theorem ベクトル値のカルデロン–ジグムント作用素 {#four:ml-cz-vector keywords="vector-valued Calderon-Zygmund operators, l^2-valued kernels, L^2 size condition" index="ベクトル値の特異積分|べくとるちのとくいせきぶん, ヒルベルト空間値の核|ひるべるとくうかんちのかく"}
$H_{1},H_{2}\in\{\mathbb{C},\ell^{2}\}$, $A>0$ とする。$\mathbb{R}^{n}\setminus\{0\}$ 上の可測関数 $K$ は、$H_{1}=H_{2}=\mathbb{C}$ なら複素数値、それ以外なら $\ell^{2}$ 値で、$K(x)$ は写像 $c\mapsto cK(x)$（$H_{1}=\mathbb{C}$）または $v\mapsto K(x)\cdot v$（$H_{2}=\mathbb{C}$）として働く（作用素ノルムは $\|K(x)\|$）。線形作用素 $T\colon L^{2}(\mathbb{R}^{n};H_{1})\to L^{2}(\mathbb{R}^{n};H_{2})$ が次を満たすとする。
- (a) $r>0$ について $\int_{|x|>r}\|K(x)\|^{2}dx\le A^{2}r^{-n}$。
- (b) $y\ne0$ について $\int_{|x|>2|y|}\|K(x-y)-K(x)\|dx\le A$。
- (c) $\|Tf\|_{L^{2}(H_{2})}\le A\|f\|_{L^{2}(H_{1})}$。
- (d) $f\in L^{2}(H_{1})$ がコンパクト集合 $F$ の外で $0$ なら、ほとんどすべての $x\notin F$ で $Tf(x)=\int_{F}K(x-y)f(y)\,dy$。

このとき、\ref{four:si-cz-bounds} と同じ定数 $C_{n}$, $A_{p}$ について次が成り立つ。
1. $f\in L^{1}\cap L^{2}(H_{1})$, $\alpha>0$ なら $|\{\|Tf\|_{H_{2}}>\alpha\}|\le C_{n}A\|f\|_{L^{1}(H_{1})}/\alpha$。
2. $1<p<\infty$, $f\in L^{2}\cap L^{p}(H_{1})$ なら $\|Tf\|_{L^{p}(H_{2})}\le A_{p}\|f\|_{L^{p}(H_{1})}$。
:::

::: intuition
値がヒルベルト空間に入っていても、絶対値をノルムに読み替えるだけで同じ定理が成り立つ。核の大きさは、原点から離れた所での二乗平均で抑えれば足りる。
:::

\ref{four:si-cz-operator.1} からは $\int_{|x|>r}A^{2}|x|^{-2n}dx=A^{2}\omega_{n}r^{-n}$（\ref{four:radial-integral.1}）なので (a) が出る（$A$ を定数倍して）。

::: proof
\ref{four:si-cz-bounds} の証明を、すべての絶対値を $H_{1}$, $H_{2}$ のノルムに読み替えてたどる。変わるのは次の点だけである。

**Step 0.** 【$H_{1}=\ell^{2}$ でも、\ref{four:ht-cz-decomposition.5}・\ref[6]{four:ht-cz-decomposition.6} をノルムで満たす分解がある】 $\|f\|$ に \ref{four:ht-cz-decomposition} を使って $Q_{j}$ をとり、$g$, $b_{j}$ を同じ式で（平均 $f_{Q}$ は成分ごとに）定める。$\|f_{Q}\|\le\frac{1}{|Q|}\int_{Q}\|f\|$ なので $\|g\|\le2^{n}\gamma$、$\int_{Q_{j}}\|f_{Q_{j}}\|\le\int_{Q_{j}}\|f\|$ から $\|g\|_{1}\le\|f\|_{1}$、$\|g\|_{2}^{2}\le\|g\|_{\infty}\|g\|_{1}$、$\int b_{j}=0$、$\|b_{j}\|_{1}\le2\int_{Q_{j}}\|f\|$。

**Step 1・3** は変更なし（Step 3 の $\|Tb\|\le\sum_{j}\|Tb_{j}\|$ は (c) と $L^{2}(H_{2})$ の完備性から）。

**Step 2.** 【$x\notin Q_{j}^{*}$ なら $\|Tb_{j}(x)\|\le\int_{Q_{j}}\|K(x-y)-K(x-c_{j})\|\,\|b_{j}(y)\|dy$（a.e.）】 (d) の積分の絶対収束を、$|K|\le A|x|^{-n}$ の代わりに (a) とコーシー–シュワルツの不等式で確かめる：$\delta\defeq\operatorname{dist}(x,\overline{Q_{j}})>0$ として $\int_{Q_{j}}\|K(x-y)\|\|b_{j}(y)\|dy\le(\int_{|z|\ge\delta}\|K\|^{2})^{1/2}\|b_{j}\|_{L^{2}}$。$K(x-c_{j})$ は $y$ によらない有界線形写像なので $\int K(x-c_{j})b_{j}(y)dy=K(x-c_{j})\int b_{j}=0$ で、あとは積分のノルムの評価。以降は (b) をノルムで使う。

**Step 4.** 【$1<p\le2$ での 2】 \ref{four:ht-l1-extension} と \ref{four:marcinkiewicz} の証明は、$T$ の線形性、ノルムの三角不等式、分け方 $f=f\mathbf{1}_{\{\|f\|>t\}}+f\mathbf{1}_{\{\|f\|\le t\}}$ だけを使うので、$f\mapsto\|Tf\|_{H_{2}}$ についてそのまま通る（ここでは繰り返さない）。

**Step 5.** 【転置 $T^{t}g\defeq\overline{T^{*}\bar g}$（成分ごとの共役）は $\int(Tf)\cdot g=\int f\cdot(T^{t}g)$ を満たし、$K^{t}(x)\defeq K(-x)$ を $H_{2}$ から $H_{1}$ への写像とみて、同じ $A$ で (a)〜(d) を満たす】 $\|K^{t}(x)\|=\|K(-x)\|$ なので (a)〜(c) はすぐ分かる。(d) の証明で使ったフビニの定理の正当化と $h$ の有界性を、(a) とコーシー–シュワルツの不等式で行う：$\int_{G}\int_{E}\|K(x-y)\|\|f(y)\|\|g(x)\|dy\,dx\le\|g\|_{L^{1}}(\int_{|z|\ge\delta}\|K\|^{2})^{1/2}\|f\|_{L^{2}}$、$\|h(y)\|\le(\int_{|z|\ge\delta}\|K\|^{2})^{1/2}\|g\|_{L^{2}}$。

**Step 6.** 【$2<p<\infty$ での 2】 $g_{k}\defeq\|h_{k}\|^{p-2}\bar h_{k}$（$h_{k}=0$ の所では $0$）とおけば $(Tf)\cdot g_{k}=\|h_{k}\|^{p}$, $\|g_{k}\|_{L^{p'}}=\|h_{k}\|_{L^{p}}^{p-1}$ で、あとは同じ。

::: hypcheck
- **(a)**：Step 2 と Step 5 で、台の外の積分の絶対収束にだけ使った。定数 $C_{n}$, $A_{p}$ には入らない。
- **(b)**：Step 2 だけ。**(c)**：Step 1・3・5。
- **$H$ がヒルベルト空間であること**：Step 5 の随伴 $T^{*}$ に使った。
- **選択公理**：使わない。
:::
:::

::: lemma 核の重みつき評価 {#four:ml-kernel-lemma keywords="weighted bounds for the kernel via Plancherel, k = [n/2]+1 derivatives" index="核の重みつき評価|かくのおもみつきひょうか"}
$\mu\in C^{k}(\mathbb{R}^{n})$ が $\{|\zeta|\le2\}$ の外で $0$ で、$|\beta|\le k$ について $|\partial^{\beta}\mu|\le M$ とし、$\kappa\defeq\check\mu$ とおく。$n$ だけで決まる $C_{0},C_{1}$ について
1. $\int(1+|x|)^{2k}|\kappa(x)|^{2}dx\le C_{0}^{2}M^{2}$。
2. $\int|\kappa(x)|(1+|x|)^{1/4}dx\le C_{1}M$。
:::

::: proof
**1.** $|\beta|\le k$ について、部分積分（$\mu$ は台がコンパクトな $C^{k}$ 級）から $(\partial^{\beta}\mu)^{\vee}(x)=(-2\pi ix)^{\beta}\kappa(x)$。$\partial^{\beta}\mu\in L^{1}\cap L^{2}$ なので \ref{four:plancherel.1} から $\|(2\pi x)^{\beta}\kappa\|_{2}=\|\partial^{\beta}\mu\|_{2}\le M(2^{n}\omega_{n})^{1/2}$。$(1+t)^{2k}\le2^{2k-1}(1+t^{2k})$ と $|x|^{2k}\le n^{k-1}\sum_{i}x_{i}^{2k}$ から
$$
\int(1+|x|)^{2k}|\kappa|^{2}\le2^{2k-1}\Bigl(\|\kappa\|_{2}^{2}+n^{k-1}\sum_{i}\|x_{i}^{k}\kappa\|_{2}^{2}\Bigr)\le C_{0}^{2}M^{2},
$$
$C_{0}^{2}\defeq2^{2k-1}(1+n^{k}(2\pi)^{-2k})2^{n}\omega_{n}$。

**2.** コーシー–シュワルツの不等式と 1 から $\int|\kappa|(1+|x|)^{1/4}\le C_{0}M\bigl(\int(1+|x|)^{1/2-2k}dx\bigr)^{1/2}$。\ref{four:radial-integral.1} と $r^{n-1}\le(1+r)^{n-1}$、$2k-n-\frac12\ge\frac12$ から $\int(1+|x|)^{1/2-2k}dx\le n\omega_{n}\int_{0}^{\infty}(1+r)^{n-1/2-2k}dr\le2n\omega_{n}$。$C_{1}\defeq C_{0}(2n\omega_{n})^{1/2}$。ここで $k>\frac n2$ を使った。
:::

## ミフリンの乗数定理 {#four:sec-ml-mihlin}

::: theorem ミフリンの乗数定理 {#four:ml-mihlin keywords="Mihlin multiplier theorem, Mikhlin, Hormander-Mihlin, |d^beta m| <= B |xi|^{-|beta|}" index="ミフリンの乗数定理|みふりんのじょうすうていり, ミフリン条件|みふりんじょうけん"}
$m\colon\mathbb{R}^{n}\setminus\{0\}\to\mathbb{C}$ は $C^{k}$ 級で、$B>0$ について
$$
|\partial^{\beta}m(\xi)|\le B|\xi|^{-|\beta|}\qquad(\xi\ne0,\ |\beta|\le k)
$$
を満たすとする。$n$ だけで決まる $C'_{n}$ と、$n,p$ だけで決まる $C_{n,p}$ があって、次が成り立つ。
1. $T_{m}f\defeq\mathcal{F}^{-1}(m\mathcal{F}f)$（$f\in L^{2}$）は、核 $K$（証明で構成する）について \ref{four:ml-cz-vector} の (a)〜(d) を $H_{1}=H_{2}=\mathbb{C}$, $A=C'_{n}B$ で満たす。とくに $f\in L^{1}\cap L^{2}$ なら $|\{|T_{m}f|>\alpha\}|\le C_{n}C'_{n}B\|f\|_{1}/\alpha$。
2. $1<p<\infty$ なら $m$ は $L^{p}$ 乗数で、$\|m\|_{M_{p}}\le C_{n,p}B$。
:::

::: intuition
$m$ が原点の外で滑らかで、各 2 進の環の上で環の大きさに見合ったゆっくりした変化しかしなければ、$m$ を掛ける作用素は $1<p<\infty$ の $L^{p}$ で有界である。
:::

::: proof
$E\defeq\max_{|\alpha|\le k}\|\partial^{\alpha}\eta\|_{\infty}$、$m_{j}(\xi)\defeq m(\xi)\eta(2^{-j}\xi)$、$\mu_{j}(\zeta)\defeq m_{j}(2^{j}\zeta)=m(2^{j}\zeta)\eta(\zeta)$ とおく。これらは原点の近くで $0$ なので $C^{k}$ 級で台がコンパクト。$K_{j}\defeq\check m_{j}$, $\kappa_{j}\defeq\check\mu_{j}$ とおくと、$\xi=2^{j}\zeta$ の置き換えで $K_{j}(x)=2^{jn}\kappa_{j}(2^{j}x)$。

**Step 1.** 【$|\beta|\le k$ について $|\partial^{\beta}\mu_{j}|\le M\defeq3^{k}EB$、$|\partial^{\beta}(\zeta_{i}\mu_{j})|\le(k+2)M$（$j$ によらない）】 ライプニッツの公式から $\partial^{\beta}\mu_{j}(\zeta)=\sum_{\gamma\le\beta}\binom{\beta}{\gamma}2^{j|\gamma|}(\partial^{\gamma}m)(2^{j}\zeta)\,\partial^{\beta-\gamma}\eta(\zeta)$。$\eta(\zeta)\ne0$ なら $|\zeta|\ge\frac12$ なので、仮定から $2^{j|\gamma|}|\partial^{\gamma}m(2^{j}\zeta)|\le B|\zeta|^{-|\gamma|}\le2^{|\gamma|}B$。$\sum_{\gamma\le\beta}\binom{\beta}{\gamma}2^{|\gamma|}=3^{|\beta|}$。後半は $\partial^{\beta}(\zeta_{i}\mu)=\zeta_{i}\partial^{\beta}\mu+\beta_{i}\partial^{\beta-e_{i}}\mu$ と $|\zeta|\le2$ から。

**Step 2.** 【$C_{2}\defeq2\pi n(k+2)C_{1}$ とすると、$y\ne0$, $r>0$ について
$$
\begin{aligned}\int_{|x|>2|y|}|K_{j}(x-y)-K_{j}(x)|dx&\le C_{2}M\min\{2^{j}|y|,(2^{j}|y|)^{-1/4}\},\\ \|K_{j}\|_{L^{2}(\{|x|>r\})}&\le C_{0}Mr^{-n/2}\min\{(2^{j}r)^{n/2},(2^{j}r)^{n/2-k}\}\end{aligned}
$$
】 $\zeta\mu_{j}\in L^{1}$ なので \ref{four:differentiation-multiplication.1}（逆変換でも同じ）から $\kappa_{j}$ は $C^{1}$ 級で $\partial_{i}\kappa_{j}=(2\pi i\zeta_{i}\mu_{j})^{\vee}$。Step 1 と \ref{four:ml-kernel-lemma.2} から $\int|\nabla\kappa_{j}|\le\sum_{i}\int|\partial_{i}\kappa_{j}|\le C_{2}M$、$\int|\kappa_{j}|(1+|u|)^{1/4}du\le C_{1}M$。
- $K_{j}(x-y)-K_{j}(x)=-\int_{0}^{1}\nabla K_{j}(x-ty)\cdot y\,dt$（\ref{calc:fundamental-theorem}）なので、トネリの定理と平行移動から $\int|K_{j}(x-y)-K_{j}(x)|dx\le|y|\int|\nabla K_{j}|=2^{j}|y|\int|\nabla\kappa_{j}|$。
- $|x|>2|y|$ なら $|x-y|>|y|$ なので、左辺 $\le2\int_{|x|>|y|}|K_{j}|=2\int_{|u|>2^{j}|y|}|\kappa_{j}|\le2(2^{j}|y|)^{-1/4}C_{1}M$。
- $\int_{|x|>r}|K_{j}|^{2}=2^{jn}\int_{|u|>2^{j}r}|\kappa_{j}|^{2}$ で、\ref{four:ml-kernel-lemma.1} から右辺の積分は $C_{0}^{2}M^{2}\min\{1,(2^{j}r)^{-2k}\}$ 以下。

**Step 3.** 【$S_{N}\defeq\sum_{|j|\le N}K_{j}$ は、各 $r>0$ について $L^{2}(\{|x|>r\})$ で収束する。その極限 $K$（$\mathbb{R}^{n}\setminus\{0\}$ 上 a.e. で定まる）は (a) を $A=8C_{0}M$、(b) を $A=9C_{2}M$ で満たす】 $t>0$ について、$2^{j}t$ は公比 $2$ の等比数列なので
$$
\sum_{j}\min\{2^{j}t,(2^{j}t)^{-1/4}\}\le2+\frac{1}{1-2^{-1/4}}\le9,\qquad\sum_{j}\min\{(2^{j}t)^{\frac n2},(2^{j}t)^{\frac n2-k}\}\le\frac{2}{1-2^{-1/2}}\le8
$$
（後者は $k-\frac n2\ge\frac12$ を使う）。Step 2 の第 2 式から $\sum_{j}\|K_{j}\|_{L^{2}(\{|x|>r\})}\le8C_{0}Mr^{-n/2}$ なので、$L^{2}(\{|x|>r\})$ の完備性（\ref{meas:riesz-fischer}）から収束し、(a) が出る。(b)：$y\ne0$ を固定する。\ref{meas:riesz-fischer} から部分列 $S_{N_{i}}$ が $\{|x|>|y|\}$ 上 a.e. で $K$ に収束し、$|x|>2|y|$ なら $x$ も $x-y$ もこの集合にある（零集合の平行移動は零集合）。\ref{meas:fatou} と Step 2 の第 1 式から
$$
\int_{|x|>2|y|}|K(x-y)-K(x)|dx\le\liminf_{i}\int_{|x|>2|y|}|S_{N_{i}}(x-y)-S_{N_{i}}(x)|dx\le9C_{2}M.
$$

**Step 4.** 【$T_{m}$ は (c) を $A=B$ で、(d) を Step 3 の $K$ で満たす】 $|m|\le B$ と \ref{four:plancherel.2} から (c)。(d)：$f\in L^{2}$ がコンパクト集合 $F$ の外で $0$ とする。$f\in L^{1}$（コーシー–シュワルツ）。$m_{N}\defeq\sum_{|j|\le N}m_{j}$ について、$S_{N}=\check m_{N}\in L^{1}$（Step 2 から $\int|K_{j}|=\int|\kappa_{j}|<\infty$）で、\ref{four:inversion-theorem} から $\widehat{S_{N}}=m_{N}$。\ref{four:convolution-rd.1}・\ref[2]{four:convolution-rd.2} から $S_{N}*f\in L^{1}\cap L^{2}$, $\widehat{S_{N}*f}=m_{N}\hat f$、すなわち $S_{N}*f=\mathcal{F}^{-1}(m_{N}\mathcal{F}f)$。$N\to\infty$ のとき：
- $\xi\ne0$ では $m_{N}(\xi)=m(\xi)$（$N$ が大きいとき）で $|m_{N}|\le B$ なので、\ref{meas:dominated-convergence} から $\|(m_{N}-m)\mathcal{F}f\|_{2}\to0$、よって $S_{N}*f\to T_{m}f$（$L^{2}$）。
- $\operatorname{dist}(x,F)\ge\frac1l$ なら $\bigl|S_{N}*f(x)-\int_{F}K(x-y)f(y)dy\bigr|\le\|S_{N}-K\|_{L^{2}(\{|z|\ge1/l\})}\|f\|_{2}$ で、Step 3 から右辺は $x$ によらず $0$ に収束する。

二つの極限は $\{\operatorname{dist}(x,F)\ge\frac1l\}$ の上で a.e. で一致し、$l$ についての和集合は $\mathbb{R}^{n}\setminus F$。

**Step 5.** 【1・2】 Step 3・4 から $A\defeq\max\{B,8C_{0}M,9C_{2}M\}=C'_{n}B$（$M=3^{k}EB$ で、$E$ は $n$ だけによる）で (a)〜(d) が成り立ち、\ref{four:ml-cz-vector.1} から 1。$f\in\mathcal{S}\subset L^{2}\cap L^{p}$ なので、\ref{four:ml-cz-vector.2} から $\|m\|_{M_{p}}\le A_{p}$（定数 $A$ に対するもの）。

::: hypcheck
- **$k=\lfloor n/2\rfloor+1>\frac n2$**：\ref{four:ml-kernel-lemma.2}（$(1+|x|)^{1/2-2k}$ の可積分性）と Step 3 の第 2 の和（$k-\frac n2>0$）で使った。点ごとの評価 $|K(x)|\le A|x|^{-n}$ はこの方法では出ないので、(a) を使った。
- **$|\beta|\le k$ の微分の評価**：Step 1 だけ。有界性（$\beta=0$）だけでは $L^{2}$ 乗数にしかならない：$n\ge2$ で単位球の指示関数 $\mathbf{1}_{\{|\xi|<1\}}$ は $p\ne2$ の $L^{p}$ 乗数でない（フェファーマンの定理。ここでは証明しない）。
- **$1<p<\infty$**：$n=1$ の $m=-i\sgn\xi$ は $B=1$ で仮定を満たすが、$H$ は $L^{1}$ でも $L^{\infty}$ でも有界でない（\ref{four:ht-lp.4}）。
- **選択公理**：使わない。
:::
:::

::: proposition 斉次な乗数 {#four:ml-homogeneous-symbols keywords="homogeneous multipliers |xi|^{i tau}, xi_i xi_j/|xi|^2, P(xi)/|xi|^d" index="斉次な乗数|せいじなじょうすう"}
$\tau\in\mathbb{R}$ とし、$m\in C^{k}(\mathbb{R}^{n}\setminus\{0\})$ が $m(t\xi)=t^{i\tau}m(\xi)$（$t>0$, $\xi\ne0$）を満たすとする。このとき $m$ は $B\defeq\max_{|\beta|\le k}\max_{|\theta|=1}|\partial^{\beta}m(\theta)|$ で \ref{four:ml-mihlin} の仮定を満たし、$1<p<\infty$ の $L^{p}$ 乗数である。とくに $|\xi|^{i\tau}$、$\xi_{i}\xi_{j}/|\xi|^{2}$、$-i\xi_{j}/|\xi|$、$d$ 次斉次多項式 $P$ についての $P(\xi)/|\xi|^{d}$ は $L^{p}$ 乗数である。
:::

::: proof
恒等式 $m(t\xi)=t^{i\tau}m(\xi)$ を $\xi$ で $\beta$ 回微分すると（連鎖律）$t^{|\beta|}(\partial^{\beta}m)(t\xi)=t^{i\tau}\partial^{\beta}m(\xi)$。$\xi\ne0$ に対して $\theta=\xi/|\xi|$, $t=|\xi|$ とおくと $|\partial^{\beta}m(\xi)|=|\xi|^{-|\beta|}|\partial^{\beta}m(\theta)|$。$\partial^{\beta}m$ は単位球面（コンパクト）の上で連続なので最大値をもつ。例は原点の外で $C^{\infty}$ 級で、$|\xi|^{i\tau}=e^{i\tau\log|\xi|}$ 以外は $\tau=0$ の場合。
:::

$\xi_{i}\xi_{j}/|\xi|^{2}$ からは \ref{four:si-cz-estimate} が、$-i\xi_{j}/|\xi|$ からはリース変換の有界性が改めて出る。

::: supplement
**似た定理（証明しない）.** **マルチンキェヴィチの乗数定理**：$n=1$ では、有界な $m$ が各区間 $\pm[2^{j},2^{j+1}]$ の上で一様に有界な全変動をもてば、$1<p<\infty$ の $L^{p}$ 乗数である。$n$ 次元版は座標ごとの拡大縮小で不変な条件 $|\partial^{\beta}m(\xi)|\le B\prod_{i}|\xi_{i}|^{-\beta_{i}}$（$\beta\in\{0,1\}^{n}$）を仮定する。**ヘルマンダーの乗数定理**：$s>\frac n2$ について $\sup_{j}\|m(2^{j}\cdot)\eta\|_{H^{s}}<\infty$（\see{fa:fractional-sobolev}）なら同じ結論。上の証明は $\kappa_{j}$ の重みつき $L^{2}$ 評価しか使わないので、この形が自然である。どちらも Grafakos『Classical Fourier Analysis』にある。

**前提を変えると.** 滑らかでなくても $n=1$ の区間の指示関数は $L^{p}$ 乗数だが（\see{four:prob-ml-interval}）、$n\ge2$ の球ではそうでない（フェファーマン）。
:::

## リトルウッド–ペイリーの二乗関数 {#four:sec-ml-square}

::: definition リトルウッド–ペイリーの二乗関数 {#four:ml-square-function keywords="Littlewood-Paley pieces Delta_j, square function Sf" index="リトルウッド–ペイリー片|りとるうっどぺいりーへん, 二乗関数|にじょうかんすう, 平方関数|へいほうかんすう"}
$\psi$ を \ref{four:ml-partition} で固定したものとする。$f\in L^{2}$ について $\Delta_{j}f\defeq\mathcal{F}^{-1}(\psi(2^{-j}\cdot)\mathcal{F}f)$（$j\in\mathbb{Z}$）を**リトルウッド–ペイリー片**、$Sf(x)\defeq\bigl(\sum_{j}|\Delta_{j}f(x)|^{2}\bigr)^{1/2}$ を**二乗関数**という。
:::

::: intuition
$\Delta_{j}f$ は $f$ の周波数がおよそ $2^{j}$ の部分（1 オクターブ）で、$Sf$ は各点で各オクターブの大きさを二乗和でまとめたもの（位相は捨てる）。
:::

::: theorem リトルウッド–ペイリーの定理 {#four:ml-littlewood-paley keywords="Littlewood-Paley theorem, c_p ||f||_p <= ||Sf||_p <= C_p ||f||_p" index="リトルウッド–ペイリーの定理|りとるうっどぺいりーのていり, リトルウッド–ペイリーの不等式|りとるうっどぺいりーのふとうしき"}
1. $f,g\in L^{2}$ なら $\int f\bar g=\sum_{j}\int\Delta_{j}f\,\overline{\Delta_{j}g}$。とくに $\|Sf\|_{2}=\|f\|_{2}$。
2. $n$ だけで決まる $C$ があって、$f\in L^{1}\cap L^{2}$, $\alpha>0$ なら $|\{Sf>\alpha\}|\le C\|f\|_{1}/\alpha$。
3. $1<p<\infty$ について、$n,p$ だけで決まる $c_{p},C_{p}>0$ があって、$f\in L^{2}\cap L^{p}$ なら $c_{p}\|f\|_{p}\le\|Sf\|_{p}\le C_{p}\|f\|_{p}$。
:::

::: intuition
周波数をオクターブに分け、各オクターブの大きさだけを二乗和で集めても、$L^{p}$ ノルムは（定数倍を除いて）失われない。
:::

::: proof
**Step 1.** 【1】 $\psi$ は実数値なので、\ref{four:plancherel.2} から $\int\Delta_{j}f\,\overline{\Delta_{j}g}=\int\psi(2^{-j}\xi)^{2}\mathcal{F}f\,\overline{\mathcal{F}g}\,d\xi$。$|j|\le N$ で足すと、被積分関数は $|\mathcal{F}f||\mathcal{F}g|\in L^{1}$ で抑えられ、$N\to\infty$ で $\mathcal{F}f\,\overline{\mathcal{F}g}$ に収束する（\ref{four:ml-partition.2}）。\ref{meas:dominated-convergence} と \ref{four:plancherel.2} から和は $\int f\bar g$。$g=f$ とし、トネリの定理で和と積分を入れ替える。

**Step 2.** 【$Tf\defeq(\Delta_{j}f)_{j}$、$K(x)\defeq(K_{j}(x))_{j}$、$K_{j}(x)\defeq2^{jn}\check\psi(2^{j}x)$ は、$H_{1}=\mathbb{C}$, $H_{2}=\ell^{2}$ として \ref{four:ml-cz-vector} の (a)〜(d) を満たす】 $\|Tf(x)\|_{\ell^{2}}=Sf(x)$。$\check\psi\in\mathcal{S}$（\ref{four:schwartz-fourier}）なので $c_{1}\defeq\int|\nabla\check\psi|$, $c_{2}\defeq\int|u||\check\psi(u)|du$, $c_{3}\defeq\int|u|^{2n}|\check\psi(u)|^{2}du$ は有限。
- (c)：Step 1 から $\|Tf\|_{L^{2}(\ell^{2})}=\|Sf\|_{2}=\|f\|_{2}$。ここでは $L^{2}$ 有界性がプランシュレルの定理から直接出る。
- (a)：トネリの定理から $\int_{|x|>r}\|K\|^{2}=\sum_{j}2^{jn}\int_{|u|>2^{j}r}|\check\psi|^{2}\le\sum_{j}2^{jn}\min\{\|\psi\|_{2}^{2},c_{3}(2^{j}r)^{-2n}\}\le2(\|\psi\|_{2}^{2}+c_{3})r^{-n}$（等比級数で評価）。
- (b)：$\|K(x-y)-K(x)\|_{\ell^{2}}\le\sum_{j}|K_{j}(x-y)-K_{j}(x)|$ で、\ref{four:ml-mihlin} の Step 2 と同じ議論から各項の積分は $\min\{c_{1}2^{j}|y|,2c_{2}(2^{j}|y|)^{-1}\}$ 以下。足して $2c_{1}+4c_{2}$ 以下。
- (d)：$f\in L^{2}$ がコンパクト集合 $F$ の外で $0$ なら $f\in L^{1}$ で、$\widehat{K_{j}}=\psi(2^{-j}\cdot)$ と \ref{four:convolution-rd.2} から $\Delta_{j}f=K_{j}*f$。$x\notin F$ での $K_{j}*f(x)$ は $\int_{F}K(x-y)f(y)dy$ の第 $j$ 成分そのもの。

**Step 3.** 【2 と 3 の右側の不等式】 Step 2 と \ref{four:ml-cz-vector.1}・\ref[2]{four:ml-cz-vector.2}（$A\defeq\max\{1,(2\|\psi\|_{2}^{2}+2c_{3})^{1/2},2c_{1}+4c_{2}\}$）から。$C_{p}$ はこの $A$ に対する $A_{p}$。

**Step 4.** 【3 の左側の不等式（$c_{p}=1/C_{p'}$）】 $E_{R}\defeq\{|x|\le R,\ |f|\le R\}$、$g\defeq|f|^{p-1}\sgn f\,\mathbf{1}_{E_{R}}\in L^{2}\cap L^{p'}$ とおくと $f\bar g=|f|^{p}\mathbf{1}_{E_{R}}$。1、$\ell^{2}$ のコーシー–シュワルツの不等式、ヘルダーの不等式、Step 3（$p'$ について）から
$$
\begin{aligned}\int_{E_{R}}|f|^{p}&=\sum_{j}\int\Delta_{j}f\,\overline{\Delta_{j}g}\le\int Sf\,Sg\le\|Sf\|_{p}\|Sg\|_{p'}\\&\le C_{p'}\|Sf\|_{p}\Bigl(\int_{E_{R}}|f|^{p}\Bigr)^{1/p'}.\end{aligned}
$$
よって $(\int_{E_{R}}|f|^{p})^{1/p}\le C_{p'}\|Sf\|_{p}$ で、$R\to\infty$ とする。

::: hypcheck
- **$\sum_{j}\psi(2^{-j}\xi)^{2}=1$**：Step 1 の恒等式（(c) と Step 4 の偏極）。
- **$\psi$ の滑らかさ**：Step 2 の $c_{1},c_{2},c_{3}$ の有限性。$n=1$ では切り方 $\mathbf{1}_{\{2^{j}\le|\xi|<2^{j+1}\}}$ でも成り立つが、別の議論が要る（ここでは証明しない）。
- **$1<p<\infty$**：左側の不等式は $p'$ での右側の不等式から出る。$p=1$ では右側の不等式は成り立たない（$\int f\ne0$ の $f\in\mathcal{S}$ では $Sf\notin L^{1}$。ここでは証明しない）。
- **選択公理**：使わない。
:::
:::

::: supplement
**高い視点（無作為な符号）.** \ref{four:prob-ml-signs} から、符号 $\varepsilon_{j}=\pm1$ をどう選んでも $\|\sum_{j}\varepsilon_{j}\Delta_{j}f\|_{p}\le C\|f\|_{p}$（$C$ は符号によらない）。符号を独立な等確率の $\pm1$ として平均し、ヒンチンの不等式 $\mathbb{E}|\sum_{j}\varepsilon_{j}a_{j}|^{p}\approx(\sum_{j}|a_{j}|^{2})^{p/2}$（ここでは証明しない）を使えば、右側の不等式の別証明になる。比喩：$Sf$ はイコライザーの各オクターブの音量計で、つまみを $\pm1$ 倍に回しても全体の音量（$L^{p}$ ノルム）は定数倍しか変わらない。
:::

## 問題 {#four:sec-ml-problems}

::: problem {#four:prob-ml-interval}
$n=1$ とし、$1<p<\infty$ とする。$a<b$ について $\mathbf{1}_{(a,b)}$ は $L^{p}$ 乗数で、$\|\mathbf{1}_{(a,b)}\|_{M_{p}}\le1+A_{p}$（$A_{p}$ は \ref{four:ht-lp} の定数）であることを示せ。
:::

::: solution
$\xi\ne0$ では $\mathbf{1}_{(0,\infty)}(\xi)=\frac12\bigl(1+i\cdot(-i\sgn\xi)\bigr)$。\ref{four:ht-l2} から $H=T_{-i\sgn}$（$L^{2}$ 上）で、$f\in\mathcal{S}$ について $T_{\mathbf{1}_{(0,\infty)}}f=\frac12(f+iHf)$ なので、\ref{four:ht-lp} から $\|\mathbf{1}_{(0,\infty)}\|_{M_{p}}\le\frac12(1+A_{p})$。a.e. で $\mathbf{1}_{(a,b)}(\xi)=\mathbf{1}_{(0,\infty)}(\xi-a)-\mathbf{1}_{(0,\infty)}(\xi-b)$（一点の違いは $T_{m}$ を変えない）。\ref{four:ml-multiplier-basic.2} から右辺の各項の $M_{p}$ ノルムは $\|\mathbf{1}_{(0,\infty)}\|_{M_{p}}$ に等しく、三角不等式から $\|\mathbf{1}_{(a,b)}\|_{M_{p}}\le1+A_{p}$。
:::

::: problem {#four:prob-ml-signs}
$(a_{j})_{j\in\mathbb{Z}}$ を $|a_{j}|\le1$ の複素数列とし、$m_{a}(\xi)\defeq\sum_{j}a_{j}\psi(2^{-j}\xi)$（$\psi$ は \ref{four:ml-partition} のもの）とおく。$m_{a}$ が \ref{four:ml-mihlin} の仮定を $(a_{j})$ によらない $B$ で満たすことを示し、$1<p<\infty$, $f\in\mathcal{S}$ について $\|\sum_{j}a_{j}\Delta_{j}f\|_{p}\le C\|f\|_{p}$（$C$ は $n,p$ だけによる。和は $L^{2}$ 収束）を導け。
:::

::: solution
$\psi(2^{-j}\xi)\ne0$ なら $2^{j-1}<|\xi|<2^{j+1}$ なので和は局所的に有限和、とくに $m_{a}\in C^{\infty}(\mathbb{R}^{n}\setminus\{0\})$ で、各点で $0$ でない項は高々二つ。連鎖律から $\partial^{\beta}[\psi(2^{-j}\xi)]=2^{-j|\beta|}(\partial^{\beta}\psi)(2^{-j}\xi)$ で、項が $0$ でなければ $2^{-j}<2/|\xi|$ なので、その絶対値は $2^{|\beta|}|\xi|^{-|\beta|}\|\partial^{\beta}\psi\|_{\infty}$ 以下。よって $|\partial^{\beta}m_{a}(\xi)|\le B|\xi|^{-|\beta|}$, $B\defeq2^{k+1}\max_{|\beta|\le k}\|\partial^{\beta}\psi\|_{\infty}$。\ref{four:ml-mihlin.2} から $\|T_{m_{a}}f\|_{p}\le C_{n,p}B\|f\|_{p}$。最後に $\sum_{|j|\le N}a_{j}\psi(2^{-j}\cdot)\hat f\to m_{a}\hat f$ は $|\hat f|$ で抑えられ \ref{meas:dominated-convergence} から $L^{2}$ 収束し、\ref{four:plancherel.2} から $\sum_{|j|\le N}a_{j}\Delta_{j}f\to T_{m_{a}}f$（$L^{2}$）。
:::
