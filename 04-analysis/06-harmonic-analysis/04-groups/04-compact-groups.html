# コンパクト群の表現とピーター–ワイルの定理 {#four:page-compact-groups keywords="representations of compact groups, unitarian trick, Schur orthogonality relations, characters, Peter-Weyl theorem, matrix coefficients, SU(2), コンパクト群, ユニタリ化, シューアの直交関係, 行列成分, ピーター–ワイルの定理"}

コンパクト群 $G$ の有限次元表現は、ハール測度で平均をとることで有限群の表現（\ref{rep:page-representations}）とほとんど同じに扱える：ユニタリにでき、既約表現の直和に分かれ、行列成分は $L^{2}(G)$ で直交する。このページの中心は、既約表現の行列成分が $C(G)$ で一様稠密、$L^{2}(G)$ で完全であるという**ピーター–ワイルの定理**である。証明では、前のページの畳み込み（\ref{four:ga-convolution}）が $L^{2}(G)$ 上のコンパクトな自己共役作用素を与えることを使い、その固有空間から有限次元の表現を取り出す。円周群ではフーリエ級数の完全性になる。

## 記法と定義の確認 {#four:sec-cg-notation}

::: notation
- このページでは $G$ は**コンパクト・ハウスドルフな位相群**、$\mu$ は $\mu(G)=1$ と正規化した左ハール測度（\ref{four:hm-existence-uniqueness}。コンパクト集合の測度は有限で、\ref{four:hm-open-positive} から正）。$G$ は単模（\ref{four:hm-unimodular-examples.2}）なので、\ref{four:hm-modular-function.2} から $\int f(yx)\,d\mu(y)=\int f\,d\mu$ でもある。$C(G)=C_{c}(G)$。$L_{s}$, $R_{s}$, 対称な関数、畳み込み $f*g$ は前のページまでの記法（\ref{four:ga-convolution}）。
- $L^{2}(G)$ の内積は $\langle f,g\rangle=\int f\bar g\,d\mu$。$\mu(G)=1$ と \ref{meas:holder} から $\|f\|_{1}\le\|f\|_{2}\le\|f\|_{\infty}$。a.e. に等しい\term[連続関数]{top:continuous}は等しい（差が $0$ でない点の集合は開集合で測度 $0$、\ref{four:hm-open-positive}）ので、$C(G)\subset L^{2}(G)$ とみなす。
- $L_{s}$, $R_{s}$ は $L^{2}(G)$ 上のユニタリ作用素で、$s\mapsto L_{s}$（左正則表現、\ref{four:ga-regular-representation}）と $s\mapsto R_{s}$（**右正則表現**。$R_{s}R_{t}=R_{st}$、\ref{four:ga-translation-continuity.2} で $\Delta=1$）は強連続なユニタリ表現（\ref{four:ga-unitary-representation}）。
- 有限群の表現・指標は \ref{rep:representation}, \ref{rep:character}。コンパクト作用素・自己共役作用素・そのスペクトル定理・\term[正規直交基底]{fa:orthonormal-basis}は \ref{fa:compact-operator}, \ref{fa:selfadjoint}, \ref{fa:compact-selfadjoint-spectral}, \ref{fa:orthonormal-basis}。$\mathrm{U}(d)$ は $d$ 次ユニタリ行列の群。
- **選択公理**：\ref{four:rm-urysohn}・\ref{four:rm-cc-dense}・\ref{top:ascoli}・\ref{fa:compact-selfadjoint-spectral} を通じて従属選択公理（DC）を使う。既約表現の同値類ごとに代表を選ぶ箇所（\ref{four:cg-peter-weyl.3}・\ref{four:cg-separation.2}）だけ選択公理を使い、そこは明記する。
:::

## 有限次元表現とユニタリ化 {#four:sec-cg-finite-dim}

::: definition 有限次元の連続表現 {#four:cg-finite-representation keywords="finite-dimensional continuous representation, matrix coefficient, unitary dual, character of a compact group" index="連続表現|れんぞくひょうげん, 行列成分|ぎょうれつせいぶん, ユニタリ双対|ゆにたりそうつい, 指標（コンパクト群）|しひょうこんぱくとぐん"}
1. 有限次元の複素ベクトル空間 $V\ne0$ と群準同型 $\pi\colon G\to\GL(V)$ で、各 $v\in V$ について $x\mapsto\pi(x)v$ が連続なものを $G$ の（有限次元の）**連続表現**、$d_{\pi}\defeq\dim V$ を次数という。準同型・同値・部分表現・既約は \ref{rep:representation} と同じに定める。$V$ に内積があり各 $\pi(x)$ がユニタリなとき**ユニタリ**という。
2. $u\in V$, $\ell\in V^{*}$ について $x\mapsto\ell(\pi(x)u)$ を $\pi$ の**行列成分**といい、その張る $C(G)$ の部分空間を $\mathcal{E}_{\pi}$ と書く。$V$ の基底をとって $\pi(x)$ を行列 $(\pi_{ij}(x))$ と書けば $\mathcal{E}_{\pi}=\operatorname{span}\{\pi_{ij}\}$ で、ユニタリなら正規直交基底 $(e_{i})$ について $\pi_{ij}(x)=\langle\pi(x)e_{j},e_{i}\rangle$、$\pi$ は連続準同型 $G\to\mathrm{U}(d_{\pi})$ とみなせる。
3. 既約なユニタリ表現の同値類の全体を $\widehat{G}$ と書き、$\mathcal{E}(G)\defeq\sum_{\pi}\mathcal{E}_{\pi}$（既約なユニタリ表現すべてにわたる和）とする。
4. $\chi_{\pi}(x)\defeq\tr\pi(x)$ を $\pi$ の**指標**という。$\chi_{\pi}\in\mathcal{E}_{\pi}$ は連続な類関数である。
:::

::: intuition
群の元を連続に動く行列で表したものが連続表現で、その行列の成分は $G$ 上の連続関数になる。ピーター–ワイルの定理は、こうした関数で $G$ 上の関数がすべて近似できることを言う。
:::

同値な表現 $\pi'(x)=A\pi(x)A^{-1}$ については $\ell(\pi'(x)u)=(\ell\circ A)(\pi(x)A^{-1}u)$ なので $\mathcal{E}_{\pi'}=\mathcal{E}_{\pi}$, $\chi_{\pi'}=\chi_{\pi}$。よって $\mathcal{E}_{\pi}$, $\chi_{\pi}$ は $\widehat{G}$ の元ごとに決まる。

::: theorem ユニタリ化と完全可約性 {#four:cg-unitarization keywords="Weyl's unitarian trick, invariant inner product by averaging, complete reducibility of representations of compact groups" index="ユニタリ化|ゆにたりか, 完全可約性（コンパクト群）|かんぜんかやくせいこんぱくとぐん"}
$\pi$ を $V$ 上の有限次元の連続表現とする。
1. $V$ には、すべての $\pi(x)$ をユニタリにする内積がある。
2. $\pi$ は既約なユニタリ表現の直和と同値である。
3. $\pi$ の行列成分は $\mathcal{E}(G)$ に属する。
:::

::: intuition
コンパクト群では内積を群全体で平均すると不変な内積が得られ、不変な部分空間の直交補空間もまた不変になる。だから表現はいつも既約なものに分解できる。
:::

::: proof
**Step 1.** 【主張：$V$ の内積 $\langle\cdot,\cdot\rangle_{0}$ をひとつとると、$\langle u,v\rangle\defeq\int\langle\pi(x)u,\pi(x)v\rangle_{0}\,d\mu(x)$ は内積である】 被積分関数は連続（\ref{fa:cauchy-schwarz}）なので積分は有限で、$u$ について線形、$v$ について共役線形、エルミート対称。$u\ne0$ なら $x\mapsto\|\pi(x)u\|_{0}^{2}$ は正の連続関数で、コンパクトな $G$ 上の最小値 $m>0$ をもつので $\langle u,u\rangle\ge m\mu(G)=m$ である。

**Step 2.** 【主張：この内積で $\pi(y)$ はユニタリ】 $g(x)\defeq\langle\pi(x)u,\pi(x)v\rangle_{0}$ とおくと $\langle\pi(y)u,\pi(y)v\rangle=\int g(xy)\,d\mu(x)=\int g\,d\mu=\langle u,v\rangle$ である（単模性、記法の節）。$\pi(y)$ は可逆なので全射な等長写像、すなわちユニタリ。

**Step 3.** 【主張：ユニタリ表現の部分表現 $W$ の直交補空間 $W^{\perp}$ も部分表現で、$V$ は互いに直交する既約な部分表現の直和である】 $w\in W$, $v\in W^{\perp}$ なら $\langle\pi(x)v,w\rangle=\langle v,\pi(x^{-1})w\rangle=0$ である。$\dim V$ についての帰納法：$V$ が既約でなければ $0\ne W\ne V$ をとり、$V=W\oplus W^{\perp}$ の両方に帰納法の仮定を使う。部分表現への制限も連続で、各成分の正規直交基底をつなげれば 2 を得る。

**Step 4.** 【主張：3 が成り立つ】 2 の正規直交基底を並べた行列 $P$ で $\pi(x)=P\operatorname{diag}(\pi_{1}(x),\dots,\pi_{m}(x))P^{-1}$（$\pi_{k}$ は既約ユニタリ表現の行列）と書けるので、$\pi$ の行列成分は $\pi_{k}$ の行列成分の 1 次結合である。基底によらないことは定義の後の注意から。

::: hypcheck
- **コンパクト性**：Step 1 で最小値 $m>0$ と積分の有限性に、Step 2 で単模性に使った。$\mathbb{R}$ の表現 $t\mapsto\begin{pmatrix}1&t\\0&1\end{pmatrix}$ は不変な直線 $\mathbb{C}e_{1}$ をもつが補空間は不変でなく、ユニタリ化できない。
- **連続性**：Step 1 の可積分性に使った。
:::
:::

::: supplement
**似た定理.** 有限群では、ハール測度による平均が $\frac{1}{|G|}\sum_{x\in G}$ になり、2 は \ref{mod:maschke}（複素数体の場合）と同じ議論である。半単純リー環の有限次元表現の完全可約性を、コンパクトな群の表現に移して示す方法は、ワイルの「ユニタリ・トリック」として知られている（ここでは扱わない）。

**前提を変えると.**
- **コンパクトでない群.** hypcheck の $\mathbb{R}$ の例のほか、有限次元に限らず、可換群や可解群のように「平均がとれる」群（従順群）では、一様に有界な表現はユニタリな表現と相似であることが知られている（ここでは証明しない）。$\mathbb{R}$ の例の $\begin{pmatrix}1&t\\0&1\end{pmatrix}$ は一様に有界でない。
- **無限次元.** コンパクト群の強連続なユニタリ表現は、無限次元でも有限次元の既約なユニタリ表現のヒルベルト直和に分解されることが知られている（\ref{four:cg-peter-weyl} と同じく、畳み込み作用素のコンパクト性を使う。ここでは証明しない）。

**高い視点：重心による不動点.** $V$ 上の内積の全体は凸な錐で、$G$ は $\langle u,w\rangle\mapsto\langle\pi(x)^{-1}u,\pi(x)^{-1}w\rangle$ で作用する。1 の構成は、一つの内積の軌道の「重心」をハール測度でとると、それが作用の不動点（不変な内積）になる、という議論である。比喩でいえば、回転する台の上でいびつな楕円を描いた紙を回し、すべての向きでの形を平均すると、回転で変わらない形が残る。コンパクト性は、軌道が有界で平均が有限にとれることを保証する。
:::

::: lemma シューアの補題（コンパクト群） {#four:cg-schur-lemma keywords="Schur's lemma for finite-dimensional representations of a group, irreducible representations of abelian groups are one-dimensional" index="シューアの補題（コンパクト群）|しゅーあのほだいこんぱくとぐん"}
$\pi$, $\sigma$ を $V$, $W$ 上の有限次元の既約表現、$A\colon W\to V$ を線形写像で、すべての $x$ で $\pi(x)A=A\sigma(x)$ とする。
1. $A=0$ または $A$ は全単射（このとき $\pi$ と $\sigma$ は同値）。
2. $\sigma=\pi$ なら $A=c\,I$（$c\in\mathbb{C}$）。
3. $G$ が可換なら、既約表現はすべて 1 次元である。
:::

::: proof
1：$\ker A$ は $\sigma$ の、$\operatorname{im}A$ は $\pi$ の部分表現なので、既約性から $\ker A\in\{0,W\}$, $\operatorname{im}A\in\{0,V\}$ である。2：$\mathbb{C}$ は代数閉体なので $A$ は固有値 $c$ をもち、$A-cI$ は全単射でない準同型だから 1 から $0$ である。3：$\pi(x)$ はすべての $\pi(y)$ と可換なので 2 からスカラー倍で、すべての部分空間が不変になり、既約性から $\dim V=1$ である。

連続性も $G$ の有限性も使わないので、有限群の場合（\ref{rep:schur-and-decomposition.2}・\ref[4]{rep:schur-and-decomposition.4}）と同じ議論である。
:::

## シューアの直交関係 {#four:sec-cg-orthogonality}

::: theorem シューアの直交関係 {#four:cg-schur-orthogonality keywords="Schur orthogonality relations for matrix coefficients of a compact group: <pi_ij, sigma_kl> = delta_ik delta_jl / d_pi" index="シューアの直交関係（コンパクト群）|しゅーあのちょっこうかんけいこんぱくとぐん"}
$\pi\colon G\to\mathrm{U}(d)$, $\sigma\colon G\to\mathrm{U}(d')$ を既約な連続表現とする。
1. $\pi$ と $\sigma$ が同値でなければ、すべての $i,j,k,l$ で $\langle\pi_{ij},\sigma_{kl}\rangle=0$。
2. $\langle\pi_{ij},\pi_{kl}\rangle=\delta_{ik}\delta_{jl}/d$。
3. $\{\sqrt{d}\,\pi_{ij}\}_{i,j}$ は $\mathcal{E}_{\pi}$ の正規直交基底で $\dim\mathcal{E}_{\pi}=d^{2}$。$\widehat{G}$ の異なる元の $\mathcal{E}_{\pi}$ どうしは直交する。
:::

::: intuition
異なる既約表現の行列成分は互いに直交し、同じ表現の行列成分も、次数の平方根を掛ければ正規直交になる。有限群の指標の直交関係を、行列の成分ごとに精密にしたものである。
:::

::: proof
**Step 1.** 【主張：$d\times d'$ 行列 $A$ について $\tilde A\defeq\int\pi(x)A\sigma(x)^{-1}\,d\mu(x)$（成分ごとの積分）は $\pi(y)\tilde A=\tilde A\sigma(y)$ を満たす】 \ref{four:hm-transport}（$x\mapsto yx$）から
$$
\pi(y)\tilde A\sigma(y)^{-1}=\int\pi(yx)A\sigma(yx)^{-1}\,d\mu(x)=\tilde A.
$$

**Step 2.** 【主張：$\pi,\sigma$ が同値でなければ $\tilde A=0$、$\sigma=\pi$ なら $\tilde A=\frac{\tr A}{d}I$】 \ref{four:cg-schur-lemma.1}・\ref[2]{four:cg-schur-lemma.2} から、前者は $0$、後者は $cI$ である。トレースは $\tr(\pi(x)A\pi(x)^{-1})=\tr A$ を積分して $\tr\tilde A=\tr A\cdot\mu(G)=\tr A$ なので $cd=\tr A$ である。

**Step 3.** 【主張：$A=E_{jl}$（$(j,l)$ 成分だけ $1$ の行列）とすると $\tilde A_{ik}=\langle\pi_{ij},\sigma_{kl}\rangle$】 $\sigma(x)^{-1}=\sigma(x)^{*}$ から $(\sigma(x)^{-1})_{lk}=\overline{\sigma_{kl}(x)}$ なので、
$$
\tilde A_{ik}=\int\pi_{ij}(x)\,(\sigma(x)^{-1})_{lk}\,d\mu(x)=\int\pi_{ij}\overline{\sigma_{kl}}\,d\mu.
$$
Step 2 から 1 と、$\tr E_{jl}=\delta_{jl}$ により 2 を得る。3 は、正規直交系は 1 次独立で $\mathcal{E}_{\pi}$ を張ることと、$\widehat{G}$ の元の代表をユニタリにとって 1 を使うことから（\ref{four:cg-unitarization.1}）。

::: hypcheck
- **既約性**：Step 2 のシューアの補題で使った。可約なら 2 は崩れる（自明表現の 2 個の直和では $\pi_{12}=0$）。
- **ユニタリ性**：Step 3 の $\sigma(x)^{-1}=\sigma(x)^{*}$ に使った。ユニタリでない基底では内積が $\overline{\sigma_{kl}}$ でなく $(\sigma(x)^{-1})_{lk}$ との積分になる。
- **$\mu(G)=1$**：Step 2 のトレースの計算に使った。
:::
:::

::: supplement
**似た定理.** 有限群では平均が $\frac{1}{|G|}\sum_{x}$ になり、有限群の表現論での行列成分の直交関係そのものになる（対角和をとると \ref{rep:orthogonality}。\ref{four:cg-examples.2}）。円周では $\{e_{n}\}$ の正規直交性そのもので、$\mathbb{R}^{n}/\mathbb{Z}^{n}$ のような高次元のトーラスでも指標 $e^{2\pi i\langle k,x\rangle}$ の正規直交性になる。

**前提を変えると.** コンパクトでない群では、既約なユニタリ表現の行列成分 $x\mapsto\langle\pi(x)u,v\rangle$ は一般に $L^{2}(G)$ に入らない（$\mathbb{R}$ の指標は $|e^{2\pi ixy}|=1$）。行列成分が $L^{2}(G)$ に入る既約表現（**二乗可積分表現**）については、$G$ が単模なら、次元 $d$ の代わりに「形式的次数」と呼ばれる正の数を使って、2 と同じ形の直交関係が成り立つことが知られている（ここでは証明しない。単模でない群では、形式的次数は数ではなく正の自己共役作用素（デュフロ–ムーアの作用素）になる）。

**高い視点：次元は双対の側の重さ.** 2 の $1/d$ は、\ref{four:cg-peter-weyl} の展開で既約表現 $\pi$ が重み $d_{\pi}$ で現れる理由である。可換な $G$ では $d=1$ であり、\term[双対群]{four:lc-character} $\hat G$ の数え上げ測度が双対測度になる（\see{four:bp-examples.2}）。非可換な場合は、「双対の点 $\pi$ の重さ」が $d_{\pi}$ だと思えば、可換群のプランシュレルの定理と同じ形に読める。
:::

::: corollary 指標の直交関係（コンパクト群） {#four:cg-character-orthogonality keywords="orthogonality of irreducible characters of a compact group, multiplicity <chi_rho, chi_pi>, characters determine representations" index="指標の直交関係（コンパクト群）|しひょうのちょっこうかんけいこんぱくとぐん"}
1. 既約な連続表現 $\pi$, $\sigma$ について、$\langle\chi_{\pi},\chi_{\sigma}\rangle$ は同値なら $1$、同値でなければ $0$。
2. 有限次元の連続表現 $\rho$ が既約表現の直和 $\bigoplus_{\pi}\pi^{\oplus m_{\pi}}$ と同値なら $m_{\pi}=\langle\chi_{\rho},\chi_{\pi}\rangle$。とくに重複度は分解によらず、$\chi_{\rho}$ で $\rho$ の同値類が決まる。
:::

::: proof
1：ユニタリな代表をとり（\ref{four:cg-unitarization.1}）$\chi_{\pi}=\sum_{i}\pi_{ii}$ と書くと、\ref{four:cg-schur-orthogonality.1} から同値でなければ $0$、同値なら \ref{four:cg-schur-orthogonality.2} から $\sum_{i,k}\delta_{ik}\delta_{ik}/d=1$ である。2：ブロック対角な行列のトレースから $\chi_{\rho}=\sum_{\sigma}m_{\sigma}\chi_{\sigma}$ で、1 から $\langle\chi_{\rho},\chi_{\pi}\rangle=m_{\pi}$ である。同じ指標の二つの表現は同じ重複度の直和と同値（\ref{four:cg-unitarization.2}）。
:::

## ピーター–ワイルの定理 {#four:sec-cg-peter-weyl}

::: theorem ピーター–ワイルの定理 {#four:cg-peter-weyl keywords="Peter-Weyl theorem: matrix coefficients are uniformly dense in C(G) and complete in L^2(G); L^2(G) = Hilbert sum of E_pi; regular representation contains each pi with multiplicity d_pi" index="ピーター–ワイルの定理|ぴーたーわいるのていり" refname="ピーター–ワイルの定理"}
1. $\mathcal{E}(G)$ は $C(G)$ で一様ノルムについて稠密である。
2. $L^{2}(G)$ は互いに直交する有限次元部分空間 $\mathcal{E}_{\pi}$（$\pi\in\widehat{G}$）の直和の閉包に等しい。各 $\mathcal{E}_{\pi}$ は右正則表現で不変で、そこへの制限は $\pi$ の $d_{\pi}$ 個の直和と同値である。
3. （選択公理を使う）$\widehat{G}$ の各元からユニタリな代表 $\pi$ を選ぶと、$\{\sqrt{d_{\pi}}\,\pi_{ij}\}$ は $L^{2}(G)$ の正規直交基底で、$f\in L^{2}(G)$ について
$$
\|f\|_{2}^{2}=\sum_{\pi\in\widehat{G}}d_{\pi}\sum_{i,j=1}^{d_{\pi}}|\langle f,\pi_{ij}\rangle|^{2}.
$$
:::

::: intuition
コンパクト群の上の連続関数は、既約表現の行列成分の 1 次結合で一様に近似でき、二乗可積分関数は行列成分で「フーリエ展開」できる。各既約表現は正則表現の中に、その次数と同じ回数だけ現れる。
:::

証明の道具を二つ用意する。

::: lemma 畳み込み作用素 {#four:cg-convolution-operator keywords="right convolution by a continuous kernel is a compact self-adjoint operator on L^2(G) commuting with left translations" index="畳み込み作用素（コンパクト群）|たたみこみさようそこんぱくとぐん"}
$\psi\in C(G)$ が $\psi(x^{-1})=\overline{\psi(x)}$ を満たすとし、$f\in L^{2}(G)$ の代表 $\tilde f$ について $Tf(x)\defeq\int\tilde f(y)\psi(y^{-1}x)\,d\mu(y)$ とおく（$=f*\psi(x)$）。
1. $Tf(x)$ はすべての $x$ で定まり代表によらず、$Tf\in C(G)$, $\|Tf\|_{\infty}\le\|\psi\|_{\infty}\|f\|_{2}$。
2. $T$ は $L^{2}(G)$ 上のコンパクトな自己共役作用素である。
3. すべての $s\in G$ で $TL_{s}=L_{s}T$。
4. $\lambda\ne0$ について $E_{\lambda}\defeq\{f\in L^{2}(G):Tf=\lambda f\}$ は有限次元で、$C(G)$ に含まれ、すべての $L_{s}$ で不変である。
:::

::: proof
**Step 1.** 【主張：1 が成り立ち、しかも $\|f\|_{2}\le1$ の $f$ すべてについて $\{Tf\}$ は同等連続】 $|\tilde f(y)\psi(y^{-1}x)|\le\|\psi\|_{\infty}|\tilde f(y)|$ であり $\|f\|_{1}\le\|f\|_{2}$ なので積分は有限で、\term[零集合]{meas:complete-measure}上の値の変更に影響されない。$\varepsilon>0$ について \ref{four:hm-uniform-continuity.1} の $V$ をとると、$x^{-1}x'\in V$ なら $(y^{-1}x)^{-1}(y^{-1}x')=x^{-1}x'\in V$ から
$$
|Tf(x)-Tf(x')|\le\int|\tilde f(y)|\,|\psi(y^{-1}x)-\psi(y^{-1}x')|\,d\mu(y)\le\varepsilon\|f\|_{2}.
$$
$V$ は $f$ によらない。

**Step 2.** 【主張：$T$ はコンパクト】 単位球 $B$ の像 $T(B)$ は $C(G)$ の中で同等連続で、値は $\|\psi\|_{\infty}$ 以下なので、\ref{top:ascoli}（値域 $\mathbb{C}$ の有界集合は相対コンパクト）から一様ノルムで相対コンパクト。包含 $C(G)\to L^{2}(G)$ は $\|g\|_{2}\le\|g\|_{\infty}$ から連続なので、$T(B)$ の $C(G)$ での閉包の像は $L^{2}(G)$ のコンパクト集合で $T(B)$ を含む。よって $L^{2}$ での閉包もコンパクト（\ref{fa:compact-operator}）。

**Step 3.** 【主張：$\langle Tf,g\rangle=\langle f,Tg\rangle$】 $F(x,y)\defeq\tilde f(y)\psi(y^{-1}x)\overline{\tilde g(x)}$ は \ref{four:ga-measurability.4}（$b=\tilde f$, $h=\psi$）から $\mathcal{B}(G)\otimes\mathcal{B}(G)$ 可測で、$|F|\le\|\psi\|_{\infty}|\tilde f(y)||\tilde g(x)|$ の積分は $\|\psi\|_{\infty}\|f\|_{1}\|g\|_{1}<\infty$ である。\ref{four:ga-measurability.5}（$T=S=G$）で順序を交換し、$\psi(y^{-1}x)=\overline{\psi(x^{-1}y)}$ を使うと
$$
\langle Tf,g\rangle=\int\tilde f(y)\,\overline{\int\tilde g(x)\psi(x^{-1}y)\,d\mu(x)}\,d\mu(y)=\langle f,Tg\rangle.
$$
$T$ は 1 から有界（$\|Tf\|_{2}\le\|Tf\|_{\infty}$）なので自己共役（\ref{fa:selfadjoint}）。

**Step 4.** 【主張：3 が成り立つ】 \ref{four:hm-transport}（$y\mapsto sy$）から
$$
L_{s}Tf(x)=\int\tilde f(y)\psi((sy)^{-1}x)\,d\mu(y)=\int\tilde f(s^{-1}w)\psi(w^{-1}x)\,d\mu(w)=T(L_{s}f)(x).
$$

**Step 5.** 【主張：4 が成り立つ】 $f\in E_{\lambda}$ なら $f=\lambda^{-1}Tf$ は 1 から連続である。3 から $T(L_{s}f)=L_{s}Tf=\lambda L_{s}f$ である。$E_{\lambda}$ が無限次元なら、正規直交列 $(e_{k})$ を帰納的にとれ（DC）、$k\ne j$ で $\|Te_{k}-Te_{j}\|^{2}=|\lambda|^{2}\|e_{k}-e_{j}\|^{2}=2|\lambda|^{2}$ なので $(Te_{k})$ は収束する部分列をもたず、コンパクト性に反する。

::: hypcheck
- **$\psi(x^{-1})=\overline{\psi(x)}$**：Step 3 の自己共役性だけに使った。
- **コンパクト性**：Step 2 で $G$ がコンパクト空間であること（\ref{top:ascoli}）と $\mu(G)<\infty$（$L^{2}\subset L^{1}$）に使った。$G=\mathbb{R}$（ルベーグ測度）では、$0$ でない $\psi\in C_{c}(\mathbb{R})$ について $Tf\defeq f*\psi=\psi*f$ は $L^{2}(\mathbb{R})$ 上の有界作用素（\ref{four:ga-convolution.1}）だが、コンパクトでない。実際、$f_{0}(y)\defeq\overline{\psi(-y)}$ とおくと $g\defeq Tf_{0}$ は連続（\ref{four:ga-convolution.2}）で $g(0)=\int|\psi|^{2}>0$ なので、$L^{2}$ の元として $g\ne0$ である。Step 4 と同じ計算で $T(L_{s}f_{0})=L_{s}g$ であり、$\|L_{s}f_{0}\|_{2}=\|f_{0}\|_{2}$ である。$T$ がコンパクトなら、$s_{k}\to\infty$ について $(L_{s_{k}}g)$ のある部分列が $L^{2}$ で $h$ に収束し、$\|h\|_{2}=\|g\|_{2}>0$ となる。一方、$\supp\varphi\subset[-R,R]$ の $\varphi\in C_{c}(\mathbb{R})$ について、コーシー–シュワルツの不等式から $|\langle L_{s}g,\varphi\rangle|\le\|\varphi\|_{2}\bigl(\int_{-R-s}^{R-s}|g|^{2}\bigr)^{1/2}$ であり、これは優収束定理から $s\to\infty$ で $0$ に近づく。ゆえに $\langle h,\varphi\rangle=0$ であり、$C_{c}(\mathbb{R})$ は $L^{2}(\mathbb{R})$ で稠密（\ref{meas:cc-dense}）なので $h=0$ となって矛盾する。
- **右からの畳み込み**：左平行移動と可換にするため $f*\psi$ を使った（Step 4）。$\psi*f$ なら右平行移動と可換になる。
:::
:::

::: lemma 有限次元の不変部分空間 {#four:cg-invariant-subspace keywords="a finite-dimensional translation invariant subspace of C(G) consists of matrix coefficients" index="有限次元の不変部分空間|ゆうげんじげんのふへんぶぶんくうかん"}
$C(G)$ の有限次元部分空間 $W$ がすべての $L_{s}$ で不変なら、$W\subset\mathcal{E}(G)$。
:::

::: proof
**Step 1.** 【主張：$W$ の基底 $f_{1},\dots,f_{n}$ について $L_{x}f_{i}=\sum_{j}a_{ji}(x)f_{j}$ と書くと、$a\colon G\to\GL_{n}(\mathbb{C})$ は連続な準同型】 $L_{xy}=L_{x}L_{y}$ から $a(xy)=a(x)a(y)$、$a(e)=I$ である。一様ノルムについて $\|L_{x}f-L_{t}f\|_{\infty}=\|L_{t^{-1}x}f-f\|_{\infty}$ であり、これは \ref{four:hm-uniform-continuity} から $x\to t$ で $0$ に近づく。有限次元空間 $W$ の座標は一様ノルムについて連続なので、$a_{ji}$ は連続。

**Step 2.** 【主張：$\rho(x)\defeq a(x^{-1})^{\mathsf T}$ は連続表現で、$f_{i}(x)=\sum_{j}\rho_{ij}(x)f_{j}(e)$】 $\rho(xy)=(a(y^{-1})a(x^{-1}))^{\mathsf T}=\rho(x)\rho(y)$ であり、逆元をとる写像は連続である。$L_{x}f_{i}=\sum_{j}a_{ji}(x)f_{j}$ を $e$ で評価すると $f_{i}(x^{-1})=\sum_{j}a_{ji}(x)f_{j}(e)$ を得るので、$x$ を $x^{-1}$ に替えればよい。

したがって $f_{i}$ は $\rho$ の行列成分の 1 次結合で、\ref{four:cg-unitarization.3} から $\mathcal{E}(G)$ に属する。
:::

::: restate {ref="four:cg-peter-weyl"}
:::

::: proof
**Step 1.** 【主張：$f\in C(G)$, $\varepsilon>0$ について、実数値で対称な $\psi\in C(G)^{+}$, $\int\psi\,d\mu=1$ があって $\|f*\psi-f\|_{\infty}\le\varepsilon$】 \ref{four:hm-uniform-continuity} の対称な開近傍 $V$（$f$ と $\varepsilon$ について）をとり、\ref{four:rm-urysohn} で $\{e\}\prec\theta\prec V$ とする。$\theta'(x)\defeq\theta(x)+\theta(x^{-1})$ は対称で台は $V\cup V^{-1}=V$ に入り、$\int\theta'>0$（\ref{four:hm-open-positive}）なので $\psi\defeq\theta'/\int\theta'$ とする。\ref{four:hm-transport}（$y=xw$）と $\psi(w^{-1})=\psi(w)$, $\int\psi=1$ から
$$
f*\psi(x)-f(x)=\int\bigl(f(xw)-f(x)\bigr)\psi(w)\,d\mu(w).
$$
$\psi(w)\ne0$ なら $w\in V$ であり、$x^{-1}(xw)=w$ なので $|f(xw)-f(x)|<\varepsilon$ である。よって左辺の絶対値は $\varepsilon$ 以下。

**Step 2.** $Tf\defeq f*\psi$ とおく。【主張：$T$ の $0$ でない固有値の固有ベクトルはすべて $\mathcal{E}(G)$ に属する】 $\psi$ は \ref{four:cg-convolution-operator} の仮定を満たす（実数値で対称）。\ref{four:cg-convolution-operator.4} から $E_{\lambda}$ は $C(G)$ の有限次元で左平行移動不変な部分空間なので、\ref{four:cg-invariant-subspace} を使う。

**Step 3.** 【主張：$f\in C(G)$ について、$\|f*\psi-g\|_{\infty}\le\varepsilon$ となる $g\in\mathcal{E}(G)$ がある】 \ref{four:cg-convolution-operator.2} と \ref{fa:compact-selfadjoint-spectral} から、正規直交系 $(e_{k})$ と $\lambda_{k}\ne0$ で $Th=\sum_{k}\lambda_{k}\langle h,e_{k}\rangle e_{k}$（すべての $h$）となるものをとる。$Pf\defeq\sum_{k}\langle f,e_{k}\rangle e_{k}$（\ref{fa:bessel.2}）とおくと $f-Pf$ はすべての $e_{k}$ と直交するので $T(f-Pf)=0$ である。$r_{N}\defeq\sum_{k>N}\langle f,e_{k}\rangle e_{k}$ とおくと、\ref{fa:bessel.1} から $\|r_{N}\|_{2}^{2}=\sum_{k>N}|\langle f,e_{k}\rangle|^{2}\to0$ である。$g_{N}\defeq\sum_{k\le N}\lambda_{k}\langle f,e_{k}\rangle e_{k}$ は Step 2 から $\mathcal{E}(G)$ に属し、$Tf-g_{N}=T(f-Pf)+Tr_{N}=Tr_{N}$ は連続関数としての等式（記法の節）なので、\ref{four:cg-convolution-operator.1} から
$$
\|f*\psi-g_{N}\|_{\infty}=\|Tr_{N}\|_{\infty}\le\|\psi\|_{\infty}\|r_{N}\|_{2}\to0.
$$
（$(e_{k})$ が有限個なら $r_{N}=0$。）Step 1 と合わせて $\|f-g_{N}\|_{\infty}\le2\varepsilon$ となり、1 を得る。

**Step 4.** 【主張：2 の前半】 \ref{four:cg-schur-orthogonality.3} から $\mathcal{E}_{\pi}$ は互いに直交する。$C(G)$ は $L^{2}(G)$ で稠密（\ref{four:rm-cc-dense}）で $\|\cdot\|_{2}\le\|\cdot\|_{\infty}$ なので、1 から $\mathcal{E}(G)=\sum_{\pi}\mathcal{E}_{\pi}$ も稠密 である。

**Step 5.** 【主張：$\pi$ をユニタリな代表とし $W_{i}\defeq\operatorname{span}\{\pi_{i1},\dots,\pi_{id}\}$ とおくと、$R_{x}W_{i}\subset W_{i}$ で、基底 $(\sqrt{d}\,\pi_{ik})_{k}$ についての $R_{x}$ の行列は $\pi(x)$】 $\pi(yx)=\pi(y)\pi(x)$ の $(i,j)$ 成分から
$$
R_{x}\pi_{ij}(y)=\pi_{ij}(yx)=\sum_{k}\pi_{kj}(x)\,\pi_{ik}(y).
$$
\ref{four:cg-schur-orthogonality.3} から $(\sqrt{d}\,\pi_{ik})_{k}$ は $W_{i}$ の正規直交基底で、$W_{1},\dots,W_{d}$ は直交し $\mathcal{E}_{\pi}=W_{1}\oplus\dots\oplus W_{d}$ である。よって $R$ の $\mathcal{E}_{\pi}$ への制限は $\pi^{\oplus d}$ と同値で、2 の後半を得る。

**Step 6.** 【主張：3 が成り立つ】 $\{\sqrt{d_{\pi}}\,\pi_{ij}\}$ は \ref{four:cg-schur-orthogonality.2}・\ref[3]{four:cg-schur-orthogonality.3} から正規直交系で、その張る空間 $\mathcal{E}(G)$ は Step 4 から稠密なので、\ref{fa:orthonormal-basis.2}⇒\ref[4]{fa:orthonormal-basis.4} から正規直交基底でパーセヴァルの等式が成り立つ（$|\langle f,\sqrt{d}\pi_{ij}\rangle|^{2}=d|\langle f,\pi_{ij}\rangle|^{2}$）。

::: hypcheck
- **$G$ のコンパクト性**：Step 3・4 の $\|\cdot\|_{2}\le\|\cdot\|_{\infty}$（$\mu(G)=1$）と、\ref{four:cg-convolution-operator} のコンパクト性に使った（Step 1 の置換は左不変性だけで済む）。
- **ハウスドルフ性**：\ref{four:rm-urysohn} とハール測度の存在に使った。
- **選択公理**：Step 1・4 の \ref{four:rm-urysohn}・\ref{four:rm-cc-dense}、Step 3 の \ref{fa:compact-selfadjoint-spectral}、\ref{four:cg-convolution-operator} の \ref{top:ascoli} で DC。3 の代表の選択だけは選択公理（$\widehat{G}$ の各類から一つずつ選ぶ）。1・2 は代表の選び方によらない形に述べた。
- **既約表現の存在を前提にしない**：既約表現は Step 2 で固有空間から作られる。
:::
:::

::: supplement
**前提を変えると.** 局所コンパクトだがコンパクトでない群では成り立たない。$\mathbb{R}$ の連続な 1 次元ユニタリ表現 $t\mapsto e^{2\pi i\xi t}$ は点を分離するが、行列成分は $L^{2}(\mathbb{R})$ に入らず、$L^{2}(\mathbb{R})$ は既約な部分表現の直和に分かれない（直和ではなく「連続的な重ね合わせ」としてのフーリエ変換が代わりになる）。$\SL_{2}(\mathbb{R})$ のような連結で非コンパクトな単純リー群では、有限次元のユニタリ表現は自明なものしかないことが知られている（ここでは証明しない）。

**似た定理.** $G$ が $\mathrm{U}(n)$ の閉部分群なら、1 は \ref{top:stone-weierstrass} からも出る：行列成分の積はテンソル積表現の、複素共役は共役表現の行列成分なので $\mathcal{E}(G)$ は複素共役で閉じた部分代数で、定数を含み、恒等表現の成分 $x\mapsto x_{ij}$ が点を分離する。一般のコンパクト群では点を分離する表現の存在がまさに問題で、それを上の固有空間の議論が与える。

**高い視点：非可換なフーリエ級数.** $\hat f(\pi)\defeq\int f(x)\pi(x)^{*}\,d\mu(x)$（$d_{\pi}$ 次の行列）とおくと $\hat f(\pi)_{ji}=\langle f,\pi_{ij}\rangle$ で、3 は
$$
f(x)=\sum_{\pi}d_{\pi}\tr\bigl(\hat f(\pi)\pi(x)\bigr),\qquad\|f\|_{2}^{2}=\sum_{\pi}d_{\pi}\tr\bigl(\hat f(\pi)^{*}\hat f(\pi)\bigr)
$$
（前者は $L^{2}$ の収束）と書ける。比喩でいえば、可換な群では関数は「純音」$e_{n}$ に分解されるが、非可換な群の純音は $d_{\pi}\times d_{\pi}$ の行列の形をした「和音」で、その音色の数 $d_{\pi}^{2}$ だけの次元をもつ。有限群ではこれは群環が行列環の直積になること（\ref{mod:group-algebra-structure}）の言い換えである。
:::

::: corollary 点の分離 {#four:cg-separation keywords="compact groups have enough finite-dimensional unitary representations; embedding into a product of unitary groups" index="点の分離（コンパクト群）|てんのぶんりこんぱくとぐん"}
1. $x\ne y$ なら、既約なユニタリ表現 $\pi$ で $\pi(x)\ne\pi(y)$ となるものがある。
2. （選択公理を使う）$\widehat{G}$ の各元の代表 $\pi\colon G\to\mathrm{U}(d_{\pi})$ を選ぶと、$x\mapsto(\pi(x))_{\pi}$ は $G$ から $\prod_{\pi\in\widehat{G}}\mathrm{U}(d_{\pi})$ の閉部分群への位相群の同型である。
:::

::: proof
1：\ref{four:rm-urysohn} で $\{x\}\prec f\prec G\setminus\{y\}$ をとり、\ref{four:cg-peter-weyl.1} で $\|f-g\|_{\infty}<\frac12$ の $g\in\mathcal{E}(G)$ をとると $g(x)\ne g(y)$ である。$g$ は既約ユニタリ表現の行列成分 $\ell(\pi(\cdot)u)$ の 1 次結合なので、そのどれかで $\ell(\pi(x)u)\ne\ell(\pi(y)u)$、すなわち $\pi(x)\ne\pi(y)$ である。2：写像は連続な準同型で、1 から単射。コンパクト空間からハウスドルフ空間への連続な単射なので像への同相写像で、像はコンパクトだから閉じている。
:::

::: supplement
**有限次元の表現は十分多い.** 1 は「コンパクト群は有限次元ユニタリ表現で十分よく見える」ことを言う。2 で $\widehat{G}$ が有限個で済めば（たとえばリー群の場合）、$G$ は一つの $\mathrm{U}(n)$ の閉部分群になる：コンパクト・リー群は忠実な有限次元表現をもつ（ここでは証明しない）。
:::

## 例 {#four:sec-cg-examples}

::: theorem SU(2) の既約表現 {#four:cg-su2 keywords="irreducible representations of SU(2): homogeneous polynomials of degree n, character sin((n+1)theta)/sin(theta), Weyl integration formula for SU(2)" index="SU(2) の既約表現|えすゆーつーのきやくひょうげん, ワイルの積分公式（SU(2)）|わいるのせきぶんこうしきえすゆーつー"}
$G=\mathrm{SU}(2)$, $n\ge0$ とし、$V_{n}$ を $z=(z_{1},z_{2})$ の $n$ 次斉次多項式の空間、$(\pi_{n}(g)P)(z)\defeq P(zg)$（$z$ は行ベクトル）とする。$t_{\theta}\defeq\operatorname{diag}(e^{i\theta},e^{-i\theta})$ と書く。
1. $\pi_{n}$ は $n+1$ 次の既約な連続表現で、$\sin\theta\ne0$ なら $\chi_{\pi_{n}}(t_{\theta})=\sin((n+1)\theta)/\sin\theta$ である。$\mathrm{SU}(2)$ の既約な連続表現はちょうど一つの $\pi_{n}$ と同値である。
2. 類関数 $f\in C(G)$ について $\int f\,d\mu=\frac{2}{\pi}\int_{0}^{\pi}f(t_{\theta})\sin^{2}\theta\,d\theta$（ワイルの積分公式）。
:::

::: intuition
$\mathrm{SU}(2)$ の既約表現は次数ごとにちょうど一つずつあり、2 変数の斉次多項式に行列を変数の側から作用させたものになる。類関数の積分は、対角行列の回転角 $\theta$ についての、重み $\sin^{2}\theta$ つきの 1 変数の積分になる。
:::

::: proof
**Step 1.** 【主張：$\pi_{n}$ は $n+1$ 次の連続表現で、単項式 $m_{k}\defeq z_{1}^{n-k}z_{2}^{k}$（$0\le k\le n$）について $\pi_{n}(t_{\theta})m_{k}=e^{i(n-2k)\theta}m_{k}$、$\sin\theta\ne0$ なら $\chi_{\pi_{n}}(t_{\theta})=\sin((n+1)\theta)/\sin\theta$ である】 $(m_{k})_{k}$ は $V_{n}$ の基底なので $\dim V_{n}=n+1$ である。$zg$ の成分は $z$ の 1 次式なので $P(zg)$ はまた $n$ 次斉次であり、$\pi_{n}(g)$ は線形である。$(\pi_{n}(g)\pi_{n}(h)P)(z)=(\pi_{n}(h)P)(zg)=P(zgh)$ から $\pi_{n}(g)\pi_{n}(h)=\pi_{n}(gh)$ が成り立ち、$\pi_{n}(e)=I$ なので $\pi_{n}(g)$ は可逆で $\pi_{n}$ は準同型である。$\pi_{n}(g)m_{k}$ の係数は $g$ の成分の多項式なので、$g\mapsto\pi_{n}(g)P$ は連続である。$zt_{\theta}=(e^{i\theta}z_{1},e^{-i\theta}z_{2})$ を代入すると固有値の式を得る。ゆえに $\chi_{\pi_{n}}(t_{\theta})=\sum_{k=0}^{n}e^{i(n-2k)\theta}$ であり、これに $e^{i\theta}-e^{-i\theta}=2i\sin\theta$ を掛けると和が打ち消し合って $e^{i(n+1)\theta}-e^{-i(n+1)\theta}=2i\sin((n+1)\theta)$ となる。

**Step 2.** 【主張：$\pi_{n}$ の部分表現 $W$ が $P=\sum_{k}a_{k}m_{k}$ を含めば、$a_{k}\ne0$ となるすべての $k$ について $m_{k}\in W$ である】 $\theta_{0}\defeq\pi/(n+1)$, $A\defeq\pi_{n}(t_{\theta_{0}})$, $\lambda_{k}\defeq e^{i(n-2k)\theta_{0}}$ とおく。$0\le k<k'\le n$ なら $0<2(k'-k)\theta_{0}<2\pi$ なので $\lambda_{k}/\lambda_{k'}=e^{2i(k'-k)\theta_{0}}\ne1$ であり、$\lambda_{0},\dots,\lambda_{n}$ は相異なる。$p_{k}(X)\defeq\prod_{j\ne k}(X-\lambda_{j})/(\lambda_{k}-\lambda_{j})$ とおくと、Step 1 から $p_{k}(A)m_{j}=p_{k}(\lambda_{j})m_{j}=\delta_{jk}m_{j}$ となるので $p_{k}(A)P=a_{k}m_{k}$ である。$W$ は $A$ で不変なので $a_{k}m_{k}\in W$ が成り立つ。

**Step 3.** 【主張：$\pi_{n}$ は既約】 $W\ne0$ を部分表現とし、$0\ne P\in W$ をとる。Step 2 から、ある $k$ で $m_{k}\in W$ である。$r\defeq\frac{1}{\sqrt2}\begin{pmatrix}1&-1\\1&1\end{pmatrix}\in\mathrm{SU}(2)$ とおくと $zr=\frac{1}{\sqrt2}(z_{1}+z_{2},\,z_{2}-z_{1})$ なので
$$
\pi_{n}(r)m_{k}=2^{-n/2}(z_{1}+z_{2})^{n-k}(z_{2}-z_{1})^{k}
$$
であり、その $m_{0}=z_{1}^{n}$ の係数は $2^{-n/2}(-1)^{k}\ne0$ である。Step 2 から $m_{0}\in W$ となる。さらに $\pi_{n}(r)m_{0}=2^{-n/2}\sum_{j=0}^{n}\binom{n}{j}m_{j}$ の係数はすべて $0$ でないので、Step 2 からすべての $m_{j}$ が $W$ に入り、$W=V_{n}$ である。

**Step 4.** 【主張：各 $g\in G$ は、ある $\theta\in[0,\pi]$ について $G$ の中で $t_{\theta}$ と共役である。したがって二つの連続な類関数が $\{t_{\theta}:0\le\theta\le\pi\}$ の上で一致すれば、$G$ 全体で一致する】 $g$ の固有値 $\lambda$ の単位固有ベクトル $v_{1}$ をとり、$v_{1}$ と直交する単位ベクトルを $v_{2}$ とする。$g$ はユニタリなので $|\lambda|=1$ であり、$\langle gv_{2},v_{1}\rangle=\langle gv_{2},\bar\lambda gv_{1}\rangle=\lambda\langle v_{2},v_{1}\rangle=0$ から $gv_{2}=\lambda'v_{2}$ となる。$\det g=\lambda\lambda'=1$ から $\lambda'=\bar\lambda$ であり、$\lambda=e^{i\theta}$（$-\pi<\theta\le\pi$）と書くと、$v_{1},v_{2}$ を列とするユニタリ行列 $U$ について $g=Ut_{\theta}U^{-1}$ である。$c^{2}=(\det U)^{-1}$ となる $c$（$|c|=1$）をとれば $cU\in\mathrm{SU}(2)$ で、$(cU)t_{\theta}(cU)^{-1}=g$ が成り立つ。$\theta<0$ の場合は、$w\defeq\begin{pmatrix}0&-1\\1&0\end{pmatrix}\in\mathrm{SU}(2)$ について $wt_{\theta}w^{-1}=t_{-\theta}$ なので $-\theta$ に替えればよい。

**Step 5.** 【主張：既約な連続表現 $\rho$ について、整数 $a_{k}\ge0$（有限個を除いて $0$）で $a_{k}=a_{-k}$ かつ $\chi_{\rho}(t_{\theta})=\sum_{k\in\mathbb{Z}}a_{k}e^{ik\theta}$ となるものがある】 $\rho$ はユニタリとしてよい（\ref{four:cg-unitarization.1}。指標は同値で変わらない）。$T_{0}\defeq\{t_{\theta}\}$ はコンパクトな可換部分群なので、\ref{four:cg-unitarization.2} と \ref{four:cg-schur-lemma.3} から $\rho|_{T_{0}}$ は 1 次元の連続表現の直和と同値である。その一つ $\tau$ について $x\mapsto\tau(t_{2\pi x})$ は連続な準同型 $\mathbb{T}\to\mathrm{U}(1)$ なので、\ref{four:prob-cg-circle-characters} から $\tau(t_{\theta})=e^{ik\theta}$（$k\in\mathbb{Z}$）と書ける。$a_{k}$ をそのような $\tau$ の個数とすれば和の式を得る。Step 4 の $w$ から $\chi_{\rho}(t_{-\theta})=\chi_{\rho}(t_{\theta})$ なので $\sum_{k}(a_{k}-a_{-k})e^{ik\theta}=0$ がすべての $\theta$ で成り立ち、$e^{-ij\theta}$ を掛けて $[0,2\pi]$ で積分すると $a_{j}=a_{-j}$ を得る。

**Step 6.** 【主張：Step 5 の $\rho$ について、整数 $c_{0},\dots,c_{N}$ で $\chi_{\rho}=\sum_{n=0}^{N}c_{n}\chi_{\pi_{n}}$ となるものがある】 整数係数で $b_{k}=b_{-k}$ を満たす $\varphi(\theta)=\sum_{|k|\le N}b_{k}e^{ik\theta}$ が $\chi_{\pi_{n}}(t_{\theta})$（$n\le N$）の整数係数の 1 次結合であることを、$N$ についての帰納法で示す。$N=0$ の場合、$\varphi=b_{0}\chi_{\pi_{0}}(t_{\theta})$ である。$N\ge1$ の場合、Step 1 から $\chi_{\pi_{N}}(t_{\theta})$ の $e^{\pm iN\theta}$ の係数は $1$ で、ほかの項は $|k|<N$ なので、$\varphi-b_{N}\chi_{\pi_{N}}(t_{\theta})$ は同じ条件を満たす $N-1$ 以下の和になり、帰納法の仮定が使える。こうして $\chi_{\rho}$ と $\sum_{n}c_{n}\chi_{\pi_{n}}$ はどちらも連続な類関数で $t_{\theta}$ の上で一致するので、Step 4 から等しい。

**Step 7.** 【主張：1 の後半】 $\rho$ がどの $\pi_{n}$ とも同値でないと仮定する。\ref{four:cg-character-orthogonality.1} からすべての $n$ で $\langle\chi_{\rho},\chi_{\pi_{n}}\rangle=0$ なので、Step 6 から $1=\langle\chi_{\rho},\chi_{\rho}\rangle=\sum_{n}c_{n}\langle\chi_{\rho},\chi_{\pi_{n}}\rangle=0$（$c_{n}$ は実数）となり矛盾する。$\pi_{n}$ は次数が異なるので互いに同値でない。Step 1・3 と合わせて 1 を得る。

**Step 8.** 【主張：連続な類関数 $f$ と $\varepsilon>0$ について、$\chi_{\pi_{n}}$ たちの 1 次結合 $h$ で $\|f-h\|_{\infty}\le\varepsilon$ となるものがある】 \ref{four:cg-peter-weyl.1} から $\|f-g\|_{\infty}\le\varepsilon$ となる $g\in\mathcal{E}(G)$ をとり、$g^{\natural}(x)\defeq\int g(yxy^{-1})\,d\mu(y)$ とおく。$f(yxy^{-1})=f(x)$ なので $|f(x)-g^{\natural}(x)|\le\int|(f-g)(yxy^{-1})|\,d\mu(y)\le\varepsilon$ である。$g$ は既約なユニタリ表現 $\pi$ の $\pi_{ij}$ の 1 次結合で、$x$ を固定して $M\defeq\int\pi(y)\pi(x)\pi(y)^{-1}\,d\mu(y)$ とおくと、\ref{four:hm-transport}（$y\mapsto sy$）から $\pi(s)M\pi(s)^{-1}=M$ が成り立つ。\ref{four:cg-schur-lemma.2} から $M=cI$ であり、トレースを比べると $cd_{\pi}=\chi_{\pi}(x)$ となる。ゆえに $(\pi_{ij})^{\natural}(x)=M_{ij}=\delta_{ij}\chi_{\pi}(x)/d_{\pi}$ であり、1 から $\chi_{\pi}$ はある $\chi_{\pi_{n}}$ に等しいので、$h\defeq g^{\natural}$ とすればよい。

**Step 9.** 【主張：2 が成り立つ】 $I(f)\defeq\int f\,d\mu$, $J(f)\defeq\frac{2}{\pi}\int_{0}^{\pi}f(t_{\theta})\sin^{2}\theta\,d\theta$ とおく。$\chi_{\pi_{0}}=1$ と \ref{four:cg-character-orthogonality.1} から $I(\chi_{\pi_{n}})=\langle\chi_{\pi_{n}},\chi_{\pi_{0}}\rangle=\delta_{n0}$ である。1 の指標の式から
$$
J(\chi_{\pi_{n}})=\frac{2}{\pi}\int_{0}^{\pi}\sin((n+1)\theta)\sin\theta\,d\theta=\frac{1}{\pi}\int_{0}^{\pi}\bigl(\cos n\theta-\cos((n+2)\theta)\bigr)d\theta=\delta_{n0}
$$
（$\theta=0,\pi$ の値は積分に影響しない）なので、$I$ と $J$ は $\chi_{\pi_{n}}$ たちの 1 次結合の上で一致する。$|I(u)|\le\|u\|_{\infty}$ と $|J(u)|\le\frac{2}{\pi}\cdot\frac{\pi}{2}\|u\|_{\infty}=\|u\|_{\infty}$ が成り立つので、Step 8 の $h$ について $|I(f)-J(f)|\le|I(f-h)|+|J(f-h)|\le2\varepsilon$ である。$\varepsilon$ は任意なので $I(f)=J(f)$ となる。

::: hypcheck
- **行列式が $1$**：Step 4 で $\lambda'=\bar\lambda$ を出すのに使った。$\mathrm{U}(2)$ では極大トーラスが 2 次元になり、指標は 2 変数の関数になる。
- **表現の連続性**：Step 5 で \ref{four:prob-cg-circle-characters} を使うのに使った。
- **既約性**：Step 7 の $\langle\chi_{\rho},\chi_{\rho}\rangle=1$ に使った。
- **類関数であること**：Step 8 の $f(yxy^{-1})=f(x)$ に使った。類関数でない $f(g)\defeq g_{11}$ では、$-I\in G$ による平行移動 $g\mapsto-g$（\ref{four:hm-transport}）から $\int f\,d\mu=-\int f\,d\mu=0$ だが、右辺は $\frac{2}{\pi}\int_{0}^{\pi}e^{i\theta}\sin^{2}\theta\,d\theta=\frac{2}{\pi}\cdot\frac{4i}{3}\ne0$ であり、2 は成り立たない。
- **ピーター–ワイルの定理**：2 の証明（Step 8）だけで使った。1 はシューアの直交関係だけで済む。選択公理は \ref{four:cg-peter-weyl.1} を通じた DC だけである。
:::
:::

::: supplement
**別の見方.** $\mathrm{SU}(2)$ の元は $\begin{pmatrix}a&-\bar b\\b&\bar a\end{pmatrix}$（$|a|^{2}+|b|^{2}=1$）と書けるので、$\mathrm{SU}(2)$ は 3 次元球面と同相で、ハール測度は球面の回転で不変な測度になる。$\tr g=2\operatorname{Re}a=2\cos\theta$ なので、2 は「球面上の一様な点の座標 $\operatorname{Re}a=\cos\theta$ の分布の密度が $\sin^{2}\theta$ に比例する」ことを言っている（ここでは使わない）。
:::

::: example コンパクト群の例 {#four:cg-examples}
1. **円周 $\mathbb{T}=\mathbb{R}/\mathbb{Z}$.** 可換なので既約表現は 1 次元（\ref{four:cg-schur-lemma.3}）、すなわち連続準同型 $\mathbb{T}\to\mathrm{U}(1)$ で、それは $e_{n}(x)=e^{2\pi inx}$（$n\in\mathbb{Z}$）に限る（\ref{four:prob-cg-circle-characters}）。1 次元の表現は等しいときだけ同値なので $\widehat{\mathbb{T}}=\{e_{n}\}$, $d=1$, $\mathcal{E}(\mathbb{T})$ は三角多項式全体。ハール測度は \ref{four:hm-examples.2} の $\int_{[0,1)}$ で、ルベーグ可測関数は a.e. にボレル関数と等しい（\ref{meas:borel-version}）ので $L^{2}(\mathbb{T})$ はフーリエ級数のものと同じ。\ref{four:cg-peter-weyl.1} は \ref{four:trigonometric-density}、\ref{four:cg-peter-weyl.3} は \ref{four:l2-theory.1} と一致する（ここでの証明はフーリエ級数の結果を使わない別証明になっている）。
2. **有限群.** 離散位相でコンパクトで、$\mu(E)=|E|/|G|$（\ref{four:hm-examples.3} を正規化）。すべての表現は連続で、$\langle f,g\rangle=\frac{1}{|G|}\sum_{x}f(x)\overline{g(x)}$ は \ref{rep:character} の内積なので、\ref{four:cg-character-orthogonality} は \ref{rep:orthogonality} に戻る。$\dim L^{2}(G)=|G|$ なので \ref{four:cg-peter-weyl.2} から $|G|=\sum_{\pi}d_{\pi}^{2}$（\ref{mod:group-algebra-structure} と一致）。
3. **$\mathrm{SU}(2)$.** \ref{four:cg-su2.1} から $\chi_{n}(\theta)\defeq\chi_{\pi_{n}}(\operatorname{diag}(e^{i\theta},e^{-i\theta}))=\sin((n+1)\theta)/\sin\theta$ で、指標の直交性は
$$
\frac{2}{\pi}\int_{0}^{\pi}\chi_{n}(\theta)\chi_{m}(\theta)\sin^{2}\theta\,d\theta=\frac{2}{\pi}\int_{0}^{\pi}\sin((n+1)\theta)\sin((m+1)\theta)\,d\theta=\delta_{nm}
$$
と確かめられる。
:::

## 問題 {#four:sec-cg-problems}

::: problem {#four:prob-cg-circle-characters}
連続な準同型 $\chi\colon\mathbb{T}\to\mathrm{U}(1)$ は、ある $n\in\mathbb{Z}$ について $\chi=e_{n}$ であることを示せ。
:::

::: solution
$\varphi(t)\defeq\chi(t\bmod1)$ は連続な準同型 $\mathbb{R}\to\mathrm{U}(1)$ で $\varphi(0)=\varphi(1)=1$ である。連続性から $\delta>0$ を $[0,\delta]$ 上 $|\varphi-1|<\frac12$ ととると、$c\defeq\int_{0}^{\delta}\varphi$ は $\operatorname{Re}c\ge\delta/2>0$ なので $c\ne0$ である。$\varphi(x+t)=\varphi(x)\varphi(t)$ を $t\in[0,\delta]$ で積分すると
$$
c\,\varphi(x)=\int_{x}^{x+\delta}\varphi(t)\,dt=\Phi(x+\delta)-\Phi(x),\qquad\Phi(x)\defeq\int_{0}^{x}\varphi.
$$
\ref{calc:fundamental-theorem.1} から右辺は $C^{1}$ なので $\varphi$ も $C^{1}$ で、$a\defeq(\varphi(\delta)-1)/c$ とおくと $\varphi'(x)=(\varphi(x+\delta)-\varphi(x))/c=a\varphi(x)$ となる。$(\varphi(x)e^{-ax})'=0$ から $\varphi(x)=e^{ax}$（$\varphi(0)=1$）を得る。$|\varphi|=1$ から $e^{(\operatorname{Re}a)x}=1$ がすべての $x$ で成り立ち $\operatorname{Re}a=0$、$\varphi(1)=1$ から $e^{a}=1$ なので $a=2\pi in$（$n\in\mathbb{Z}$）である。
:::

::: problem {#four:prob-cg-irreducibility-criterion}
(a) 有限次元の連続表現 $\rho$ について、$\rho$ が既約であることと $\|\chi_{\rho}\|_{2}=1$ が同値であることを示せ。(b) \ref{four:cg-su2.2} を使って、$\mathrm{SU}(2)$ の定義表現（$\mathbb{C}^{2}$ に行列の積で作用）が既約であることを確かめよ。
:::

::: solution
(a) \ref{four:cg-unitarization.2} から $\rho\cong\bigoplus\pi^{\oplus m_{\pi}}$ で、$\chi_{\rho}=\sum m_{\pi}\chi_{\pi}$ と \ref{four:cg-character-orthogonality.1} から $\|\chi_{\rho}\|_{2}^{2}=\sum_{\pi}m_{\pi}^{2}$ である。これが $1$ であることは、ちょうど一つの $\pi$ で $m_{\pi}=1$、他は $0$、すなわち $\rho$ が既約であることと同値（$m_{\pi}$ は非負整数）。

(b) 定義表現の指標は $\tr g$ で、$\operatorname{diag}(e^{i\theta},e^{-i\theta})$ では $2\cos\theta$ である。$\tr g$ は類関数なので \ref{four:cg-su2.2} から
$$
\|\chi\|_{2}^{2}=\frac{2}{\pi}\int_{0}^{\pi}4\cos^{2}\theta\sin^{2}\theta\,d\theta=\frac{2}{\pi}\int_{0}^{\pi}\sin^{2}2\theta\,d\theta=\frac{2}{\pi}\cdot\frac{\pi}{2}=1
$$
である（$|\chi|^{2}$ も類関数）。(a) から既約である。
:::
