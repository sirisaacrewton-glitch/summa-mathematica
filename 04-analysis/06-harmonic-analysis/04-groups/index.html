# 群の上の調和解析（Harmonic Analysis on Groups）

局所コンパクト空間上のラドン測度とリース–マルコフ–角谷の定理、ハール測度、群環と畳み込み、コンパクト群の表現とピーター–ワイルの定理、局所コンパクト可換群の双対群、プランシュレルの定理とポンチャーギン双対性。

<p class="mn-msc">MSC2020: 43A05, 43A10, 43A25, 43A40, 22D10, 28C10</p>
