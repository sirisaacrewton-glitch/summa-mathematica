# 群の上の調和解析（Harmonic Analysis on Groups）

局所コンパクト空間上のラドン測度とリース–マルコフ–角谷の定理、ハール測度、群環と畳み込み、コンパクト群の表現とピーター–ワイルの定理、局所コンパクト可換群の双対群、プランシュレルの定理とポンチャーギン双対性。

<p class="mn-msc">MSC2020: 43A05, 43A10, 43A25, 43A40, 22D10, 28C10</p>

## 前提知識

- [位相群とリー群 › 位相群](../../../05-geometry-topology/06-lie-groups/01-topological-groups/index.html)（全体、3 ページ）：位相群・局所コンパクト空間・一点コンパクト化・ウリゾーンの補題
- [測度とルベーグ積分 › ルベーグ積分](../../../04-analysis/03-measure-theory/02-integration/index.html)（全体、9 ページ）：外測度とカラテオドリの拡張・Lᵖ 空間
- [フーリエ解析 › フーリエ変換](../../../04-analysis/06-harmonic-analysis/02-fourier-transform/index.html)（全体、5 ページ）：ℝ 上のフーリエ変換（双対群の例）
- [関数解析 › 作用素とスペクトル](../../../04-analysis/07-functional-analysis/02-operators/index.html)（全体、4 ページ）：バナッハ環・有界作用素・共役作用素（群環とユニタリ表現で使う）
- [群論 › 有限群の表現](../../../02-algebra/02-group-theory/07-representations/index.html)（全体、5 ページ）：有限群の表現と指標（コンパクト群の表現の特別な場合）
- [一般位相 › 関数空間の位相](../../../05-geometry-topology/01-general-topology/03-function-spaces/index.html)（全体、5 ページ）：コンパクト開位相・アスコリの定理（双対群の位相、畳み込み作用素のコンパクト性）
- [フーリエ解析 › フーリエ級数](../../../04-analysis/06-harmonic-analysis/01-fourier-series/index.html)（全体、5 ページ）：フーリエ級数（𝕋 の場合の例）
