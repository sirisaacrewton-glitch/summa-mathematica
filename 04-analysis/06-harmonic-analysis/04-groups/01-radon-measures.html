# 局所コンパクト空間上のラドン測度 {#four:page-radon-measures keywords="Radon measures on locally compact Hausdorff spaces: Urysohn lemma for compactly supported functions, partition of unity subordinate to a finite open cover, positive linear functionals on C_c(X), Riesz-Markov-Kakutani representation theorem, outer regularity, inner regularity, density of C_c in L^p, Lebesgue measure from the Riemann integral, counting measure, Dirac measure, ラドン測度, リース–マルコフ–角谷の表現定理, 正値線形汎関数"}

群の上で調和解析をするには、まず群の上の「積分」が要る。局所コンパクト群には、平行移動で不変な積分（ハール測度）がただ一つ（定数倍を除いて）あることを次のページで示すが、その証明は「不変な正値線形汎関数 $I\colon C_{c}(G)\to\mathbb{C}$ を作る」ことと「それを測度で表す」ことの二段に分かれる。このページは後半を一般の局所コンパクト・ハウスドルフ空間で行う。主結果は、$C_{c}(X)$ 上の正値線形汎関数がただ一つの**ラドン測度**による積分で表されるという**リース–マルコフ–角谷の表現定理**で、区間の場合（\ref{fa:riesz-markov-interval}）の一般化である。区間版はスティルチェス関数を経由したが、一般の空間には「左端からの累積」がないので、ここでは開集合の測度を汎関数から直接定義し、外測度とカラテオドリの定理（\ref{meas:page-caratheodory}）で測度に延ばす。

## 記法と定義の確認 {#four:sec-rm-notation}

::: notation
- 局所コンパクト、一点コンパクト化 $X^{*}=X\cup\{\infty\}$ とその性質は \ref{top:locally-compact}, \ref{top:one-point-compactification}, \ref{top:one-point-properties}。コンパクトハウスドルフ空間は正規（\ref{top:compact-hausdorff-normal}）、正規性の言い換えは \ref{top:regular-normal-characterization.2}、コンパクト集合が閉であることは \ref{top:compact-hausdorff-closed}。
- 関数で分離されることの定義は \ref{top:function-separated}、正規空間での分離は \ref{top:urysohn-lemma}。
- 外測度・カラテオドリ可測・カラテオドリの定理は \ref{meas:outer-measure}, \ref{meas:caratheodory}。位相空間 $X$ のボレル集合族 $\mathcal{B}(X)$ は \ref{meas:generated-sigma-algebra.2}。連続関数はボレル可測（\ref{meas:measurability-generators.2}）。$L^{p}(\mu)$ は複素数値で \ref{meas:lp-space} のとおり。
- 以下 $X$ は**局所コンパクトなハウスドルフ空間**とする。関数 $f\colon X\to\mathbb{C}$ の台 $\supp f$ は $\{f\ne0\}$ の閉包。$C_{c}(X)$ は台がコンパクトな連続関数 $X\to\mathbb{C}$ の全体、$C_{c}(X)^{+}$ はそのうち値が $[0,\infty)$ に入るもの。$\|f\|_{\infty}\defeq\sup_{X}|f|$。
- コンパクト集合 $K$、開集合 $U$、$f\in C_{c}(X)$ について、$K\prec f$ は「$0\le f\le1$ かつ $K$ 上で $f=1$」、$f\prec U$ は「$0\le f\le1$ かつ $\supp f\subset U$」を表す。$K\prec f\prec U$ は両方。
- **選択公理**：\ref{top:urysohn-lemma} の「正規 ⇒ 関数で分離」の証明は従属選択公理（DC）を使う。そこを経由する \ref{four:rm-urysohn}、\ref{four:rm-partition-of-unity}、表現定理とその帰結は DC を使う。表現定理の Step 2 では可算選択公理（DC から従う）を使う。それ以外の選択は有限回である。
:::

## 局所コンパクト空間の準備 {#four:sec-rm-lch}

::: lemma コンパクト集合の相対コンパクトな近傍 {#four:rm-shrink keywords="in a locally compact Hausdorff space, for compact K inside open U there is an open V with compact closure, K in V, closure of V in U" index="相対コンパクトな近傍|そうたいこんぱくとなきんぼう"}
$K\subset U$（$K$ はコンパクト、$U$ は開）なら、開集合 $V$ で $K\subset V\subset\overline{V}\subset U$、$\overline{V}$ はコンパクト、となるものがある。
:::

::: proof
$X^{*}$ はコンパクトハウスドルフ（\ref{top:one-point-properties.2}・\ref{top:one-point-properties.3}。ここで $X$ が局所コンパクト・ハウスドルフであることを使う）なので正規（\ref{top:compact-hausdorff-normal}）。$K$ は $X^{*}$ でもコンパクトなので閉、$U$ は $X^{*}$ で開（\ref{top:one-point-properties.1}）。\ref{top:regular-normal-characterization.2} から $X^{*}$ の開集合 $V$ で $K\subset V\subset\operatorname{cl}_{X^{*}}V\subset U$ となるものがある。$\operatorname{cl}_{X^{*}}V$ はコンパクト空間 $X^{*}$ の閉集合なのでコンパクトで、$U\subset X$ に入るので $\infty$ を含まない。$V\subset X$ は $X$ で開で、$X$ での閉包は $\operatorname{cl}_{X^{*}}V\cap X=\operatorname{cl}_{X^{*}}V$ である。
:::

::: lemma ウリゾーンの補題（コンパクト台版） {#four:rm-urysohn keywords="Urysohn lemma for locally compact Hausdorff spaces: for compact K inside open U there is f in C_c(X) with K < f < U" index="ウリゾーンの補題（局所コンパクト空間）|うりぞーんのほだいきょくしょこんぱくとくうかん"}
$K\subset U$（$K$ はコンパクト、$U$ は開）なら、$K\prec f\prec U$ となる $f\in C_{c}(X)$ がある。
:::

::: intuition
コンパクト集合の上で $1$、与えられた開集合の外で $0$ となる「山形の関数」を、台がコンパクトになるように作れる。
:::

::: proof
\ref{four:rm-shrink} の $V$ をとる。$X^{*}$ の中で $X^{*}\setminus V$ と $K$ は交わらない閉集合で、$X^{*}$ は正規なので、\ref{top:urysohn-lemma} から連続な $g\colon X^{*}\to[0,1]$ で $X^{*}\setminus V$ 上 $0$、$K$ 上 $1$ のものがある（ここで DC を使う）。$f\defeq g\restriction X$ は連続で、$\{f\ne0\}\subset V$ なので $\supp f\subset\overline{V}\subset U$、$\supp f$ はコンパクト $\overline{V}$ の閉集合なのでコンパクト。
:::

::: lemma 1 の分割（有限開被覆） {#four:rm-partition-of-unity keywords="partition of unity on a compact set subordinate to a finite open cover by compactly supported functions" index="1 の分割（コンパクト台）|いちのぶんかつこんぱくとだい"}
$K$ がコンパクトで $K\subset U_{1}\cup\dots\cup U_{n}$（$U_{i}$ は開）なら、$h_{i}\prec U_{i}$（$i=1,\dots,n$）で、$K$ 上で $\sum_{i}h_{i}=1$、$X$ 上で $\sum_{i}h_{i}\le1$ となるものがある。
:::

::: proof
**Step 1.** 【主張：開集合 $V_{i}$ で、$\overline{V_{i}}$ がコンパクトで $\overline{V_{i}}\subset U_{i}$、$K\subset V_{1}\cup\dots\cup V_{n}$ となるものがある】 $i=1,\dots,n$ の順に、$K\subset V_{1}\cup\dots\cup V_{i-1}\cup U_{i}\cup\dots\cup U_{n}$ を保って $V_{i}$ を作る。$L_{i}\defeq K\setminus(V_{1}\cup\dots\cup V_{i-1}\cup U_{i+1}\cup\dots\cup U_{n})$ は $K$ の閉集合なのでコンパクト（\ref{top:compact-basic.1}）で、仮定から $L_{i}\subset U_{i}$。\ref{four:rm-shrink} から $L_{i}\subset V_{i}\subset\overline{V_{i}}\subset U_{i}$（$\overline{V_{i}}$ コンパクト）となる $V_{i}$ をとれば、$U_{i}$ を $V_{i}$ に替えても $K$ は覆われる。選択は $n$ 回だけである。

**Step 2.** 【主張：$h_{1}\defeq g_{1}$, $h_{i}\defeq(1-g_{1})\cdots(1-g_{i-1})g_{i}$ が求めるもの。ここで $\overline{V_{i}}\prec g_{i}\prec U_{i}$】 $g_{i}$ は \ref{four:rm-urysohn} でとる。$0\le h_{i}\le g_{i}$ なので $\supp h_{i}\subset\supp g_{i}\subset U_{i}$ で $h_{i}\prec U_{i}$。$i$ についての帰納法で
$$
h_{1}+\dots+h_{i}=1-(1-g_{1})\cdots(1-g_{i})
$$
（$i$ から $i+1$ へは、右辺に $h_{i+1}=(1-g_{1})\cdots(1-g_{i})g_{i+1}$ を足すと $1-(1-g_{1})\cdots(1-g_{i})(1-g_{i+1})$）。右辺は $[0,1]$ に値をとり、$x\in K$ ならある $i$ で $x\in V_{i}$、$g_{i}(x)=1$ なので積が $0$ になり $\sum_{i}h_{i}(x)=1$。
:::

## ラドン測度 {#four:sec-rm-radon}

::: definition 正値線形汎関数とラドン測度 {#four:rm-radon-measure keywords="positive linear functional on C_c(X); Radon measure: Borel measure finite on compact sets, outer regular on Borel sets, inner regular on open sets" index="ラドン測度|らどんそくど, 正値線形汎関数|せいちせんけいはんかんすう, 外部正則|がいぶせいそく, 内部正則|ないぶせいそく, 外正則|がいせいそく, 内正則|ないせいそく"}
1. 線形写像 $I\colon C_{c}(X)\to\mathbb{C}$ が、$f\in C_{c}(X)^{+}$ について $I(f)\ge0$ を満たすとき、**正値線形汎関数**という。
2. $\mathcal{B}(X)$ 上の測度 $\mu$ が次の (a)〜(c) を満たすとき、**ラドン測度**という。
- (a) コンパクト集合 $K$ について $\mu(K)<\infty$。
- (b) （**外部正則**）$E\in\mathcal{B}(X)$ について $\mu(E)=\inf\{\mu(U):U\supset E\text{ は開集合}\}$。
- (c) （**内部正則**、開集合で）開集合 $U$ について $\mu(U)=\sup\{\mu(K):K\subset U\text{ はコンパクト}\}$。
:::

::: intuition
ラドン測度は、集合の大きさが「外から開集合で」も「（開集合については）内からコンパクト集合で」も近似できる測度で、位相とよく噛み合う。正値線形汎関数は「非負の関数には非負の値を与える平均のとり方」である。
:::

正値線形汎関数 $I$ は実数値関数に実数を与える：実数値の $f\in C_{c}(X)$ は $f=f^{+}-f^{-}$（$f^{\pm}\defeq\max(\pm f,0)\in C_{c}(X)^{+}$）と書けるので $I(f)=I(f^{+})-I(f^{-})\in\mathbb{R}$。とくに実数値の $f\le g$ なら $I(g)-I(f)=I(g-f)\ge0$（単調性）。また $f\prec U$ なら $I(f)\in[0,\infty)$。

::: lemma 測度有限な集合での内部正則性 {#four:rm-finite-inner-regular keywords="a Radon measure is inner regular on Borel sets of finite measure (and on sigma-finite Borel sets)" index="内部正則性（測度有限な集合）|ないぶせいそくせいそくどゆうげんなしゅうごう"}
$\mu$ をラドン測度とする。$E\in\mathcal{B}(X)$, $\mu(E)<\infty$ なら、$\mu(E)=\sup\{\mu(K):K\subset E\text{ はコンパクト}\}$。
:::

::: proof
$\varepsilon>0$ とする。外部正則性から開集合 $U\supset E$ で $\mu(U)<\mu(E)+\varepsilon$ となるものがあり、$\mu(U)<\infty$ なので $\mu(U\setminus E)<\varepsilon$（\ref{meas:measure-properties.2}）。開集合での内部正則性からコンパクト $F\subset U$ で $\mu(F)>\mu(U)-\varepsilon$、外部正則性から開集合 $W\supset U\setminus E$ で $\mu(W)<\varepsilon$ となるものがある。$K\defeq F\setminus W$ はコンパクト $F$ の閉集合なのでコンパクトで、$K\subset U\setminus(U\setminus E)=E$。そして $\mu(K)\ge\mu(F)-\mu(W)>\mu(U)-2\varepsilon\ge\mu(E)-2\varepsilon$。
:::

## リース–マルコフ–角谷の表現定理 {#four:sec-rm-riesz}

::: theorem リース–マルコフ–角谷の表現定理 {#four:rm-riesz-markov-kakutani keywords="Riesz-Markov-Kakutani representation theorem: every positive linear functional on C_c(X), X locally compact Hausdorff, is integration against a unique Radon measure; mu(U) = sup I(f) over f < U, mu(K) = inf I(f) over K < f" index="リース–マルコフ–角谷の表現定理|りーすまるこふかくたにのひょうげんていり, リースの表現定理（測度）|りーすのひょうげんていりそくど" refname="リース–マルコフ–角谷の表現定理"}
$I$ を $C_{c}(X)$ 上の正値線形汎関数とする。
1. ラドン測度 $\mu$ で、すべての $f\in C_{c}(X)$ について $I(f)=\int f\,d\mu$ となるものがある。
2. このようなラドン測度はただ一つである。
3. この $\mu$ は、開集合 $U$ とコンパクト集合 $K$ について次を満たす：
$$
\mu(U)=\sup\{I(f):f\prec U\},\qquad\mu(K)=\inf\{I(f):K\prec f\}.
$$
:::

::: intuition
コンパクト台の連続関数に「非負なら非負」の値を線形に割り当てる規則は、必ずある測度での積分であり、その測度は正則性を課せばただ一つに決まる。開集合の測度は、その中に収まる山形の関数の積分の上限として、汎関数から読み取れる。
:::

::: proof
3 の第 1 式を定義として $\mu$ を作る。開集合 $U$ について $\mu_{0}(U)\defeq\sup\{I(f):f\prec U\}\in[0,\infty]$ とおく。$f\prec U$ となるのは $f=0$ だけのとき $\mu_{0}(U)=0$ で、とくに $\mu_{0}(\varnothing)=0$。$U\subset U'$ なら $f\prec U\Rightarrow f\prec U'$ なので $\mu_{0}(U)\le\mu_{0}(U')$。

**Step 1.** 【主張：開集合 $U_{1},U_{2},\dots$ について $\mu_{0}(\bigcup_{n}U_{n})\le\sum_{n}\mu_{0}(U_{n})$】 $f\prec\bigcup_{n}U_{n}$ とする。$\supp f$ はコンパクトなので、ある $N$ で $\supp f\subset U_{1}\cup\dots\cup U_{N}$（有限部分被覆の番号の最大値をとる）。\ref{four:rm-partition-of-unity} から $h_{i}\prec U_{i}$（$i\le N$）で $\supp f$ 上 $\sum_{i}h_{i}=1$ のものをとる。$f$ は $\supp f$ の外で $0$ なので $f=\sum_{i\le N}h_{i}f$ で、$0\le h_{i}f\le1$, $\supp(h_{i}f)\subset\supp h_{i}\subset U_{i}$ から $h_{i}f\prec U_{i}$。よって
$$
I(f)=\sum_{i\le N}I(h_{i}f)\le\sum_{i\le N}\mu_{0}(U_{i})\le\sum_{n}\mu_{0}(U_{n}).
$$
$f$ について上限をとる。

**Step 2.** 【主張：$\mu^{*}(E)\defeq\inf\{\mu_{0}(U):U\supset E\text{ は開集合}\}$（$E\subset X$）は外測度で、開集合の上で $\mu_{0}$ と一致する】 開集合 $U$ については $\mu_{0}$ の単調性から $\mu^{*}(U)=\mu_{0}(U)$。$\mu^{*}(\varnothing)=0$ と単調性は定義から従う。可算劣加法性：$\sum_{n}\mu^{*}(E_{n})<\infty$ とし、$\varepsilon>0$ について各 $n$ で開集合 $U_{n}\supset E_{n}$, $\mu_{0}(U_{n})\le\mu^{*}(E_{n})+\varepsilon2^{-n}$ を選ぶ（可算選択公理）。Step 1 から $\mu^{*}(\bigcup_{n}E_{n})\le\mu_{0}(\bigcup_{n}U_{n})\le\sum_{n}\mu^{*}(E_{n})+\varepsilon$。

**Step 3.** 【主張：コンパクト集合 $K$ について $\mu^{*}(K)=\inf\{I(f):K\prec f\}<\infty$。また $f\prec U$ なら $I(f)\le\mu^{*}(\supp f)$】 $K\prec f$ と $0<\alpha<1$ について $V_{\alpha}\defeq\{f>\alpha\}$ は $K$ を含む開集合。$g\prec V_{\alpha}$ なら、$V_{\alpha}$ 上 $\alpha g\le\alpha<f$、外では $g=0$ なので $\alpha g\le f$、単調性から $I(g)\le I(f)/\alpha$。よって $\mu^{*}(K)\le\mu_{0}(V_{\alpha})\le I(f)/\alpha$、$\alpha\to1$ で $\mu^{*}(K)\le I(f)$。逆に開集合 $U\supset K$ について \ref{four:rm-urysohn} から $K\prec f\prec U$ となる $f$ があり $I(f)\le\mu_{0}(U)$。$U$ について下限をとれば $\inf\{I(f):K\prec f\}\le\mu^{*}(K)$。$X$ 自身についての \ref{four:rm-urysohn} から $K\prec f$ となる $f$ があるので有限。後半：$f\prec U$ なら、$\supp f$ を含む任意の開集合 $W$ について $f\prec W$ なので $I(f)\le\mu_{0}(W)$。$W$ について下限をとる。

**Step 4.** 【主張：開集合はカラテオドリ可測】 開集合 $U$ と $E\subset X$ について $\mu^{*}(E)\ge\mu^{*}(E\cap U)+\mu^{*}(E\setminus U)$ を示せばよい（\ref{meas:outer-measure.2}）。$\mu^{*}(E)=\infty$ なら明らか。まず $E=V$ が開集合で $\mu_{0}(V)<\infty$ の場合。$\varepsilon>0$ について $f\prec V\cap U$ で $I(f)>\mu_{0}(V\cap U)-\varepsilon$ となる $f$ をとり、$K\defeq\supp f$ とする。$V\setminus K$ は開なので $g\prec V\setminus K$ で $I(g)>\mu_{0}(V\setminus K)-\varepsilon$ となる $g$ をとる。$f$ と $g$ の台は交わらないので $0\le f+g\le1$、$\supp(f+g)\subset V$ で $f+g\prec V$。$V\setminus U\subset V\setminus K$ なので
$$
\mu_{0}(V)\ge I(f)+I(g)>\mu^{*}(V\cap U)+\mu^{*}(V\setminus U)-2\varepsilon.
$$
一般の $E$（$\mu^{*}(E)<\infty$）では、$E\subset V$ となる開集合 $V$ について単調性から $\mu_{0}(V)\ge\mu^{*}(E\cap U)+\mu^{*}(E\setminus U)$ で、$V$ について下限をとる。

**Step 5.** 【主張：$\mu\defeq\mu^{*}\restriction\mathcal{B}(X)$ はラドン測度で、3 を満たす】 \ref{meas:caratheodory} から $\mu^{*}$ 可測集合の全体 $\mathcal{M}^{*}$ は σ-加法族で、$\mu^{*}\restriction\mathcal{M}^{*}$ は測度。Step 4 から $\mathcal{M}^{*}$ は開集合を含むので $\mathcal{B}(X)\subset\mathcal{M}^{*}$（\ref{meas:generated-properties.1}）、$\mu$ は測度。コンパクト集合は閉（\ref{top:compact-hausdorff-closed}）なのでボレル集合で、Step 3 から (a)。(b) は $\mu^{*}$ の定義そのもの。(c)：$f\prec U$ なら Step 3 から $I(f)\le\mu(\supp f)$ で $\supp f\subset U$ はコンパクトなので、$\mu(U)=\mu_{0}(U)\le\sup\{\mu(K):K\subset U\}\le\mu(U)$。3 は $\mu_{0}$ の定義と Step 3。

**Step 6.** 【主張：$f\in C_{c}(X)$, $0\le f\le1$ なら $|I(f)-\int f\,d\mu|\le\mu(\supp f)/N$（$N\ge1$ は任意）】 $f$ を高さ $\frac1N$ の層に分ける：$j=1,\dots,N$ について
$$
\begin{aligned}
f_{j}&\defeq\min\Bigl(\max\Bigl(f-\frac{j-1}{N},0\Bigr),\frac1N\Bigr),\\
K_{j}&\defeq\Bigl\{f\ge\frac jN\Bigr\},\qquad K_{0}\defeq\supp f.
\end{aligned}
$$
$t\in[0,1]$ について $\sum_{j=1}^{N}\min(\max(t-\frac{j-1}{N},0),\frac1N)=t$ なので $f=\sum_{j}f_{j}$。$f_{j}$ は連続で $\supp f_{j}\subset K_{j-1}$（$\{f_{j}\ne0\}=\{f>\frac{j-1}{N}\}$ の閉包は、$j=1$ なら $K_{0}$ そのもの、$j\ge2$ なら閉集合 $K_{j-1}$ に入る）。$K_{j}$（$j\ge1$）は $K_{0}$ の閉集合なのでコンパクト。$K_{j}$ 上 $f_{j}=\frac1N$ なので、次の左の不等式と、それを積分した右の不等式が成り立つ：
$$
\frac1N\mathbf{1}_{K_{j}}\le f_{j}\le\frac1N\mathbf{1}_{K_{j-1}},\qquad\frac{\mu(K_{j})}{N}\le\int f_{j}\,d\mu\le\frac{\mu(K_{j-1})}{N}.
$$
同じ評価が $I(f_{j})$ にも成り立つ：$K_{j}\prec Nf_{j}$ なので Step 3 から $\mu(K_{j})\le I(Nf_{j})$。$K_{j-1}$ を含む任意の開集合 $U$ について $Nf_{j}\prec U$ なので $I(Nf_{j})\le\mu(U)$、外部正則性から $I(Nf_{j})\le\mu(K_{j-1})$。$j$ について足すと、$I(f)$ と $\int f\,d\mu$ はともに $\frac1N\sum_{j=1}^{N}\mu(K_{j})$ と $\frac1N\sum_{j=0}^{N-1}\mu(K_{j})$ の間にあり、その差は $\frac1N(\mu(K_{0})-\mu(K_{N}))\le\frac1N\mu(\supp f)$。

**Step 7.** 【主張：項目 1】 Step 6 で $N\to\infty$ とすれば、$0\le f\le1$ の $f\in C_{c}(X)$ で $I(f)=\int f\,d\mu$。$f\in C_{c}(X)^{+}$, $f\ne0$ には $f/\|f\|_{\infty}$ に使い、両辺の線形性から一般の $f\in C_{c}(X)$ に及ぶ（実部・虚部に分け、それぞれを $f^{+}-f^{-}$ と書く）。$f$ は有界で台の測度が有限なので $\mu$ 可積分であり、積分の線形性は \ref{meas:integral-linearity.1}。

**Step 8.** 【主張：項目 2】 $\nu$ もラドン測度で $I(f)=\int f\,d\nu$ とする。コンパクト $K$ について、$K\prec f$ なら $\mathbf{1}_{K}\le f$ から $\nu(K)\le I(f)$。$\varepsilon>0$ について外部正則性から開集合 $U\supset K$ で $\nu(U)<\nu(K)+\varepsilon$ となるものをとり、\ref{four:rm-urysohn} の $K\prec f\prec U$ について $I(f)\le\nu(U)<\nu(K)+\varepsilon$。よって $\nu(K)=\inf\{I(f):K\prec f\}=\mu(K)$。開集合では内部正則性 (c) から $\nu=\mu$、ボレル集合では外部正則性 (b) から $\nu=\mu$。

::: hypcheck
- **局所コンパクト**：\ref{four:rm-urysohn} を通して Step 3 と Step 8 で使った（$X^{*}$ がハウスドルフになるため）。外すと一意性が崩れる：$X=\mathbb{Q}$ では、コンパクト集合 $K$ の内部は空なので（内部があれば、端点を無理数にとった $[s,t]\cap\mathbb{Q}$ を含み、これは $K$ の閉集合としてコンパクトだが $\mathbb{R}$ で閉でない）、$\{f\ne0\}$ が開で $\supp f$ に入る $f\in C_{c}(\mathbb{Q})$ は $0$ だけである。零汎関数は零測度でも点測度 $\delta_{0}$ でも表され、どちらもラドン測度。
- **ハウスドルフ**：$X^{*}$ の正規性と、コンパクト集合がボレル集合であること（Step 5）に使った。
- **正値性**：Step 3 の単調性（$\alpha g\le f\Rightarrow I(g)\le I(f)/\alpha$）と、Step 1・4 で $I(f)$ を実数として比べることに使った。正値でない有界線形汎関数を表すには複素測度が要る（下の補足）。
- **正則性の要求**：2 の一意性は、ラドン測度の中での一意性である。Step 8 は (b)・(c) を両方使った。
- **選択公理**：\ref{four:rm-urysohn} の DC（Step 1 の 1 の分割、Step 3、Step 8）と、Step 2 の可算選択。
:::
:::

::: supplement
**区間版との関係.** $X=[a,b]$ では $C_{c}(X)=C([a,b])$ で、1 は \ref{fa:riesz-markov-interval.1} を含む（コンパクト距離空間上の有限ボレル測度は自動的にラドン測度であることが知られているので、一意性の主張も同じものになる。ここでは証明しない）。区間版の証明はスティルチェス関数 $F(t)=\mu([a,t])$ を汎関数から読み取ったが、ここでは $[a,t]$ の代わりに開集合とコンパクト集合を使い、Step 6 の層分けがリーマン–スティルチェス和の役をする。

**前提を変えると.** (1) ラドン測度に限らなければ一意性は崩れうる。$[0,\omega_{1}]$（順序位相）上のデュドネ測度は、すべての連続関数に対して $\delta_{\omega_{1}}$ と同じ積分を与えるが $\delta_{\omega_{1}}$ と異なるボレル測度として知られている（ここでは証明しない）。(2) 内部正則性 (c) をすべてのボレル集合に要求すると、表現定理の測度がそれを満たさない例がある（離散空間 $\mathbb{R}_{d}$ と $\mathbb{R}$ の積の上の例が知られている。ここでは証明しない）。ただし $X$ が σ コンパクト（コンパクト集合の可算和）なら、ラドン測度はすべてのボレル集合で内部正則である：$E=\bigcup_{n}(E\cap L_{n})$（$L_{n}$ はコンパクトの増大列）と書き、$\mu(E\cap L_{n})<\infty$ に \ref{four:rm-finite-inner-regular} を使う。

**似た定理.** $C_{0}(X)$（無限遠で $0$ になる連続関数、上限ノルム）の双対空間は、$X$ 上の正則な複素ボレル測度の空間と全変動ノルムで等長同型である（これもリース–マルコフ–角谷の定理と呼ばれる。ここでは証明しない）。

**高い視点：積分は測度より先にある.** 測度論は集合の大きさから積分を作るが、この定理は逆向きの道を示す：連続関数の「平均のとり方」さえ決まれば、集合の大きさはそこから一意に復元される。比喩で言えば、開集合 $U$ の測度は「$U$ の中に収まる砂山（$f\prec U$）にどれだけ砂を積めるか」の上限で、コンパクト集合の測度は「$K$ を覆い尽くす砂山に最低どれだけ砂が要るか」の下限である。群の上では、平行移動で不変な平均を作れば、不変な測度が自動的に得られる。
:::

## Lᵖ での稠密性 {#four:sec-rm-density}

::: theorem コンパクト台の連続関数の稠密性（ラドン測度） {#four:rm-cc-dense keywords="C_c(X) is dense in L^p(mu) for a Radon measure mu on a locally compact Hausdorff space and 1 <= p < infinity" index="コンパクト台の連続関数の稠密性（ラドン測度）|こんぱくとだいのれんぞくかんすうのちゅうみつせいらどんそくど"}
$\mu$ を $X$ 上のラドン測度、$1\le p<\infty$ とすると、$C_{c}(X)$ は $L^{p}(\mu)=L^{p}(X,\mathcal{B}(X),\mu)$ で稠密である。
:::

::: intuition
ラドン測度に関する $p$ 乗可積分関数は、台がコンパクトな連続関数でいくらでもよく近似できる。$\mathbb{R}^{n}$ のルベーグ測度の場合（\ref{meas:cc-dense}）が、一般の局所コンパクト空間でそのまま成り立つ。
:::

::: proof
$f\in C_{c}(X)$ は $|f|\le\|f\|_{\infty}\mathbf{1}_{\supp f}$ と (a) から $L^{p}(\mu)$ に入る。

**Step 1.** 【主張：$E\in\mathcal{B}(X)$, $\mu(E)<\infty$, $\varepsilon>0$ について、$\|\varphi-\mathbf{1}_{E}\|_{p}^{p}<\varepsilon$ となる $\varphi\in C_{c}(X)$ がある】 \ref{four:rm-finite-inner-regular} からコンパクト $K\subset E$ で $\mu(E\setminus K)<\varepsilon/2$、外部正則性から開集合 $U\supset E$ で $\mu(U\setminus E)<\varepsilon/2$ となるものをとる（$\mu(E)<\infty$ なので差がとれる）。\ref{four:rm-urysohn} から $K\prec\varphi\prec U$ となる $\varphi$ をとる。$K$ 上では $\varphi=1=\mathbf{1}_{E}$、$U$ の外では $\varphi=0=\mathbf{1}_{E}$、$U\setminus K$ 上では $|\varphi-\mathbf{1}_{E}|\le1$ なので $|\varphi-\mathbf{1}_{E}|^{p}\le\mathbf{1}_{U\setminus K}$、積分して $\le\mu(U\setminus K)<\varepsilon$。

**Step 2.** 【主張：結論】 \ref{meas:lp-simple-dense} から、$\mu(\{s\ne0\})<\infty$ の単関数 $s=\sum_{k=1}^{m}c_{k}\mathbf{1}_{E_{k}}$ が $L^{p}(\mu)$ で稠密。各 $E_{k}\subset\{s\ne0\}$（$c_{k}\ne0$ としてよい）は測度有限なので、Step 1 で $\|\varphi_{k}-\mathbf{1}_{E_{k}}\|_{p}<\delta$ となる $\varphi_{k}$ をとれば、ミンコフスキーの不等式から $\|\sum_{k}c_{k}\varphi_{k}-s\|_{p}\le\delta\sum_{k}|c_{k}|$。$\delta$ は任意。

::: hypcheck
- **$p<\infty$**：Step 1 で $|\varphi-\mathbf{1}_{E}|^{p}$ の積分を小さな集合の測度で抑えるのに使った。$p=\infty$ では偽：$X=\mathbb{R}$, ルベーグ測度で、連続な $\varphi$ について $\|\varphi-\mathbf{1}_{[0,\infty)}\|_{\infty}\ge\frac12$（$\varphi(0)\ge\frac12$ なら $0$ の左の小区間で、$\varphi(0)<\frac12$ なら右の小区間で、差が $\frac12-\eta$ 以上）。
- **ラドン性**：Step 1 で外部正則性と、\ref{four:rm-finite-inner-regular} を通して開集合での内部正則性を使った。
- **選択公理**：\ref{four:rm-urysohn} の DC。
:::
:::

::: supplement
**前提を変えると.** 局所コンパクト性を外すと、$C_{c}(X)$ が $\{0\}$ になることがある。$X=\mathbb{Q}$（$\mathbb{R}$ の部分空間）のコンパクト集合は内点をもたない（内点があれば、その近傍の閉区間と $\mathbb{Q}$ の交わりが無理数に収束する点列を含み、コンパクトでない）。$f\in C_{c}(\mathbb{Q})$, $f\ne0$ なら $\{f\ne0\}$ は空でない開集合でコンパクトな $\supp f$ に含まれるので、これは起こらない。よって $C_{c}(\mathbb{Q})=\{0\}$ だが、点測度 $\delta_{0}$ について $L^{p}(\delta_{0})\cong\mathbb{C}\ne0$。無限次元のヒルベルト空間でも同じことが起こる（コンパクト集合は内点をもたない）。

**似た定理.** ラドン測度については、可測関数が「ほとんど連続」であるというルージンの定理も成り立つ：$\mu(E)<\infty$ で $f$ が $E$ の外で $0$ の可測関数なら、各 $\varepsilon>0$ に $\mu(\{f\ne g\})<\varepsilon$ となる $g\in C_{c}(X)$ がある（Step 1 と同じく正則性と \ref{four:rm-urysohn} から示せることが知られている。ここでは証明しない）。上限ノルムについては、$C_{c}(X)$ は $C_{0}(X)$（無限遠で $0$ になる連続関数）で稠密である（\ref{four:rm-urysohn} で $\{|f|\ge\varepsilon\}\prec\theta$ をとり $\theta f$ で近似する）。

**高い視点：$L^{p}$ は $C_{c}$ の完備化.** $L^{p}(\mu)$ は完備（\ref{meas:riesz-fischer}）なので、この定理は「$L^{p}(\mu)$ は $C_{c}(X)$ をノルム $\|f\|_{p}=(\int|f|^{p}d\mu)^{1/p}$ で完備化したものである」と言い換えられる。右辺に必要なのは $C_{c}(X)$ 上の積分 $f\mapsto\int f\,d\mu$、すなわち \ref{four:rm-riesz-markov-kakutani} の正値線形汎関数だけなので、測度を経由せずに $L^{p}$ を作ることもできる。測度をはじめから $C_{c}(X)$ 上の線形汎関数として定義する積分論の流儀（ブルバキ『積分』など）は、この見方を出発点にしている。比喩でいえば、連続関数は「なめらかに削った積み木」、$L^{p}$ の関数はその極限として得られるどんな形の砂山でもよい。群の上の調和解析では、平行移動や畳み込みのような操作をまず扱いやすい $C_{c}(G)$ の上で確かめ、この稠密性で $L^{p}(G)$ に延ばす、という手順を繰り返し使う。
:::

## 例 {#four:sec-rm-examples}

::: example ラドン測度の例 {#four:rm-examples}
1. **リーマン積分からルベーグ測度へ.** $X=\mathbb{R}^{n}$、$f\in C_{c}(\mathbb{R}^{n})$ について、$\supp f$ を含む閉直方体 $R$ をとり $I(f)\defeq\int_{R}f$（リーマン積分、\ref{calc:box-integral}。実部と虚部ごとにとる。連続関数は積分可能、\ref{calc:box-integral-properties.3}）とおく。\ref{meas:riemann-lebesgue} から $\int_{R}f=\int f\,d\lambda$（$f$ は $R$ の外で $0$）なので $I(f)$ は $R$ によらず、正値線形である。表現定理の $\mu$ はボレル集合族上の $\lambda$ に一致する：$\lambda\restriction\mathcal{B}(\mathbb{R}^{n})$ は、コンパクト集合が有界なので (a)（\ref{meas:lebesgue-basic.4}）、\ref{meas:lebesgue-regularity.1} から (b)、\ref{meas:lebesgue-regularity.2} から (c) を満たすラドン測度で $I$ を表すので、一意性から $\mu=\lambda$。こうしてルベーグ測度は「連続関数のリーマン積分」から再構成される。リーマン和は平行移動でそのまま移るので $I(f(\cdot+h))=I(f)$ で、一意性から $\mu$ の平行移動不変性も従う——次のページのハール測度はこの見方の一般化である。$\mathbb{R}^{n}$ では \ref{four:rm-cc-dense} は \ref{meas:cc-dense} に戻る。
2. **数え上げ測度.** $X$ を離散空間とする。すべての部分集合が開で、コンパクト集合は有限集合、$C_{c}(X)$ は有限個の点の外で $0$ の関数の全体。$I(f)\defeq\sum_{x\in X}f(x)$（有限和）は正値線形で、対応するラドン測度は数え上げ測度 $\mu(E)=\#E$ である：Step 3 から有限集合 $K$ について $\mu(K)=I(\mathbf{1}_{K})=\#K$、(c) から $\mu(U)=\sup\{\#K:K\subset U\text{ 有限}\}=\#U$。重み $w\colon X\to[0,\infty)$ をつけた $\sum_{x}w(x)f(x)$ からは $\mu(E)=\sum_{x\in E}w(x)$ が得られる。
3. **点測度.** $a\in X$ について $I(f)\defeq f(a)$ は正値線形で、対応するラドン測度は $\delta_{a}(E)\defeq\mathbf{1}_{E}(a)$ である。実際 $\int f\,d\delta_{a}=f(a)$ で、$\delta_{a}$ はラドン測度：(a) は明らか。(b)：$a\notin E$ なら開集合 $X\setminus\{a\}\supset E$（一点はハウスドルフ空間で閉）の測度が $0$。(c)：$a\in U$ ならコンパクト $\{a\}\subset U$ の測度が $1$。
:::

## 問題 {#four:sec-rm-problems}

::: problem {#four:prob-rm-full-support}
$I$ を $C_{c}(X)$ 上の正値線形汎関数、$\mu$ を対応するラドン測度とする。空でないすべての開集合 $U$ で $\mu(U)>0$ となることと、$0$ でないすべての $f\in C_{c}(X)^{+}$ で $I(f)>0$ となることが同値であることを示せ。
:::

::: solution
「⇒」：$f\in C_{c}(X)^{+}$, $f\ne0$ とし、$c\defeq\frac12\|f\|_{\infty}>0$ とおく（コンパクトな台の上の連続関数なので最大値 $2c$ をとる）。$U\defeq\{f>c\}$ は空でない開集合で、$f\ge c\mathbf{1}_{U}$ なので $I(f)=\int f\,d\mu\ge c\mu(U)>0$。「⇐」：$U\ne\varnothing$ を開集合、$x\in U$ とする。$\{x\}$ はコンパクトなので \ref{four:rm-urysohn} から $\{x\}\prec f\prec U$ となる $f$ があり、$f(x)=1$ なので $f\ne0$。仮定と \ref{four:rm-riesz-markov-kakutani.3} から $0<I(f)\le\mu(U)$。
:::

::: problem {#four:prob-rm-local-bound}
$I$ を $C_{c}(X)$ 上の正値線形汎関数とする。各コンパクト集合 $K$ について定数 $C_{K}$ があり、$\supp f\subset K$ となるすべての $f\in C_{c}(X)$ について $|I(f)|\le C_{K}\|f\|_{\infty}$ となることを、表現定理を使わずに示せ。また表現定理を使うと $C_{K}=\mu(K)$ にとれることを示せ。
:::

::: solution
\ref{four:rm-urysohn}（$U=X$）から $K\prec g$ となる $g$ をとる。まず $f$ が実数値なら、$\supp f\subset K$ なので $-\|f\|_{\infty}g\le f\le\|f\|_{\infty}g$ で、単調性から $|I(f)|\le\|f\|_{\infty}I(g)$。複素数値の $f$ では $I(f)\ne0$ のとき $\theta\defeq\overline{I(f)}/|I(f)|$ とおくと $|I(f)|=I(\theta f)=I(\operatorname{Re}(\theta f))+iI(\operatorname{Im}(\theta f))$ で、左辺が実数なので第 2 項は $0$（$I$ は実数値関数に実数を与える）。$\|\operatorname{Re}(\theta f)\|_{\infty}\le\|f\|_{\infty}$ と実数値の場合から $|I(f)|\le\|f\|_{\infty}I(g)$。$C_{K}\defeq I(g)$。表現定理を使えば $|I(f)|=|\int f\,d\mu|\le\int|f|\,d\mu\le\|f\|_{\infty}\mu(K)$（\ref{meas:integral-linearity.3}、$|f|\le\|f\|_{\infty}\mathbf{1}_{K}$）。
:::
