# ポンチャーギンの双対定理 {#four:page-pontryagin-duality keywords="Pontryagin duality theorem, double dual, characters separate points, annihilator, dual of a quotient group, ポンチャーギン双対性, 双対定理, 二重双対, 消去群"}

局所コンパクト可換群 $G$ の双対群 $\hat G$（\ref{four:lc-character}）もまた局所コンパクト可換群なので、その双対群 $\hat{\hat{G}}$ が考えられる。$x\in G$ は「$\xi$ を $\xi(x)$ に写す」ことで $\hat G$ の指標になる。このページでは、この自然な写像 $\alpha\colon G\to\hat{\hat{G}}$ が位相群の同型であること（双対定理）を示す。道具は前のページの \ref{four:bp-inversion} と \ref{four:bp-plancherel} だけで、前者を $G$ に使って $\alpha$ が開写像であることを、後者を $\hat G$ に使って $\alpha(G)$ が稠密であることを導く。帰結として、コンパクト群と離散群の双対の関係と、閉部分群による商の双対を述べる。

## 記法と定義の確認 {#four:sec-pd-notation}

::: notation
- $G$ は局所コンパクト・ハウスドルフな可換位相群、$\mu$ は固定したハール測度（\ref{four:hm-haar-measure}）、$\int F\,dx\defeq\int F\,d\mu$。$L_{s}f(x)=f(s^{-1}x)$、対合 $f^{*}$（\ref{four:ga-involution}）はこれまでのページのとおりで、$\langle f,g\rangle=\int f\overline{g}$ は $L^{2}$ の内積。
- 双対群 $\hat G$ とフーリエ変換 $\hat f$ は \ref{four:lc-character}, \ref{four:lc-fourier-transform}。$\hat G$ には $\mu$ の双対測度 $d\xi$（\ref{four:bp-inversion}）を入れる。$\hat G$ も局所コンパクト・ハウスドルフな可換群（\ref{four:lc-dual-topology.1}・\ref{four:lc-dual-topology.3}）なので、そのまた双対群 $\hat{\hat{G}}$ も同じ性質をもつ。$\hat{\hat{G}}$ の元を $p,q$ と書き、ハール測度として $d\xi$ の双対測度 $dq$ を入れる。$\hat{\hat{G}}$ の単位元（定数 $1$）を $1$ と書く。
- $\hat{\hat{G}}$ の位相：コンパクトな $C\subset\hat G$ と $\varepsilon>0$ について $B_{C}(p,\varepsilon)\defeq\{q:\sup_{\xi\in C}|q(\xi)-p(\xi)|<\varepsilon\}$ は開集合で、$p$ の基本近傍系をなす（\ref{four:page-lca-duality} の記法の約束を $\hat G$ に当てはめたもの）。
- 位相群の平行移動・近傍は \ref{top:tg-neighbourhoods}、剰余群は \ref{top:tg-quotient}。
- **選択公理**：前のページと同じく、\ref{four:rm-urysohn}・\ref{four:rm-cc-dense} を通じて従属選択公理（DC）を、\ref{four:lc-dual-topology.3} を通じて超フィルター補題を使う。反転公式・プランシュレルの定理はボホナーの定理を通じて極大イデアルの存在（\ref{four:bp-spectral-radius}）に依存するので、このページの主要な結果はすべて選択公理に依存する。このページで新たに無限個の選択はしない。
:::

## 指標は点を分離する {#four:sec-pd-separation}

::: lemma 単位元の近傍と指標 {#four:pd-neighbourhood keywords="for each neighbourhood U of e there is a compact set C of characters with |xi(x)-1| >= 1/4 for some xi in C whenever x is outside U" index="単位元の近傍と指標|たんいげんのきんぼうとしひょう"}
$U$ を $G$ の単位元 $e$ の近傍とする。コンパクトな $C\subset\hat G$ で、$x\notin U$ ならば $|\xi(x)-1|\ge1/4$ となる $\xi\in C$ があるようなものが存在する。
:::

::: proof
**Step 1.** 【主張：連続な正定値関数 $g\in L^{1}(G)$ で、$g(e)>0$, $\hat g\ge0$ で、$U$ の外で $g=0$ となるものがある】 \ref{top:tg-neighbourhoods.2} から $e$ の対称な開近傍 $V$ で $VV\subset U$ となるものをとり、$0$ でない $f\in C_{c}(G)^{+}$ で $\supp f\subset V$ のもの（\ref{four:rm-urysohn}）をとる。$g(x)\defeq\langle f,L_{x}f\rangle=\int f(y)f(x^{-1}y)\,dy$ とおく。\ref{four:bp-pd-basic.3} から $g$ は連続な正定値関数で $f*f^{*}$ の代表なので、\ref{four:lc-fourier-basic.2}・\ref{four:bp-fourier-dense.1} から $\hat g=|\hat f|^{2}\ge0$。$g(x)\ne0$ なら $y\in V$, $x^{-1}y\in V$ となる $y$ があり、$x\in yV^{-1}\subset VV\subset U$。とくに $g$ は $S\cdot S^{-1}$（$S\defeq\supp f$、コンパクト集合の連続像なのでコンパクト）の外で $0$ で、有界連続なので可積分。$g(e)=\|f\|_{2}^{2}>0$（\ref{four:hm-open-positive}）。

**Step 2.** 【主張：コンパクトな $C\subset\hat G$ で $\int_{\hat G\setminus C}\hat g\,d\xi<g(e)/4$ となるものがある】 $g$ は正定値かつ可積分なので $g\in B^{1}(G)$（\ref{four:bp-positive-definite.2}）で、 \ref{four:bp-inversion} から $\hat g\in L^{1}(\hat G)$ で、すべての $x$ について
$$
g(x)=\int_{\hat G}\hat g(\xi)\xi(x)\,d\xi,\qquad\text{とくに}\quad g(e)=\int_{\hat G}\hat g\,d\xi.
$$
$C_{m}\defeq\{\hat g\ge1/m\}$ はコンパクト（\ref{four:lc-riemann-lebesgue}）で $C_{m}\uparrow\{\hat g>0\}$ なので、単調収束定理（\ref{meas:monotone-convergence}）から $\int_{C_{m}}\hat g\,d\xi\to g(e)$。十分大きい $m$ について $C\defeq C_{m}$ とすればよい。

**Step 3.** 【主張：$x\notin U$ なら $|\xi(x)-1|\ge1/4$ となる $\xi\in C$ がある】 すべての $\xi\in C$ で $|\xi(x)-1|<1/4$ だったとすると、$|\xi(x)-1|\le2$ と Step 2 から
$$
\begin{aligned}
|g(x)-g(e)|&\le\int_{C}\hat g(\xi)|\xi(x)-1|\,d\xi+\int_{\hat G\setminus C}2\hat g\,d\xi\\
&<\tfrac14g(e)+\tfrac12g(e)=\tfrac34g(e).
\end{aligned}
$$
一方 Step 1 から $g(x)=0$ なので左辺は $g(e)$ で、矛盾。

::: hypcheck
- **反転公式**：Step 2 で $g$ を $\hat g$ から復元するのに使った。ここが「指標が十分たくさんある」ことの源である。
- **可換性**：$\hat G$・反転公式全体に使う。
:::
:::

::: theorem 指標は点を分離する {#four:pd-separation keywords="characters of a locally compact abelian group separate points" index="指標による点の分離|しひょうによるてんのぶんり"}
$x\in G$, $x\ne e$ なら $\xi(x)\ne1$ となる $\xi\in\hat G$ がある。したがって $x\ne y$ なら $\xi(x)\ne\xi(y)$ となる $\xi\in\hat G$ がある。
:::

::: intuition
局所コンパクト可換群では、違う二点はかならずどれかの指標で見分けられる。
:::

::: proof
$G$ はハウスドルフなので $U\defeq G\setminus\{x\}$ は $e$ の開近傍。\ref{four:pd-neighbourhood} の $C$ から、$x\notin U$ について $|\xi(x)-1|\ge1/4$ の $\xi$ がとれる。後半は $xy^{-1}\ne e$ に使い、$\xi(xy^{-1})=\xi(x)\overline{\xi(y)}$ とする。

::: hypcheck
- **ハウスドルフ性**：$\{x\}$ が閉であることに使った。外すと偽：$\overline{\{e\}}$ の点は連続な $\xi$ で $1$ に写る。
- **可換性**：外すと偽。3 次対称群の指標は自明な指標と符号だけで（\ref{four:page-lca-duality} の補足）、互換と別の互換を区別できない。
:::
:::

::: supplement
**似た定理.** コンパクト群では、可換でなくても有限次元の既約なユニタリ表現が点を分離する（\ref{four:cg-separation.1}）。一般の局所コンパクト群でも、既約なユニタリ表現（無限次元のものを含む）が点を分離することが知られている（ゲルファント–ライコフの定理。正定値関数の全体の端点が既約表現から来ることを使う。ここでは証明しない）。可換群ではその既約表現が 1 次元、すなわち指標なので、この定理になる。ノルム空間で連続線形汎関数が点を分離すること（ハーン–バナッハの定理の帰結）も同じ型の主張で、「十分たくさんの座標がある」ことを言う。

**前提を変えると.** 局所コンパクト性を外すと偽になりうる：ハウスドルフな可換位相群で、連続な指標が自明なものしかない例が知られている（ここでは証明しない）。そのような群では $\hat G=\{1\}$ で、双対からは何も復元できない。この定理の証明が反転公式、したがってハール測度に頼っているのはそのためである。

**高い視点.** この定理は、$\alpha\colon G\to\hat{\hat{G}}$ が単射であること（\ref{four:pd-evaluation-map.3}）と同じである。比喩でいえば、指標は群の上の「座標関数」で、点を分離するとは座標を全部読めば点が決まることである。証明では、反転公式で「$e$ の近くに集中した関数」をフーリエ変換から組み立て、$e$ から離れた点 $x$ ではその値が小さいことから、どこかの指標が $x$ を $1$ から引き離していることを読み取った。
:::

## 双対定理 {#four:sec-pd-theorem}

::: proposition 二重双対への自然な写像 {#four:pd-evaluation-map keywords="canonical map from G to its double dual, evaluation map, alpha(x)(xi) = xi(x)" index="二重双対への自然な写像|にじゅうそうついへのしぜんなしゃぞう"}
$x\in G$ について $\alpha(x)(\xi)\defeq\xi(x)$（$\xi\in\hat G$）とおく。
1. $\alpha(x)\in\hat{\hat{G}}$。
2. $\alpha\colon G\to\hat{\hat{G}}$ は連続な群準同型である。
3. $\alpha$ は単射である。
:::

::: proof
**1.** $\alpha(x)(\xi\eta)=\xi(x)\eta(x)$ なので準同型。$|\alpha(x)(\xi)-\alpha(x)(\xi_{0})|=|\xi(x)-\xi_{0}(x)|$ は $\xi\in B_{\{x\}}(\xi_{0},\varepsilon)$ で $\varepsilon$ 未満なので連続。

**2.** $\alpha(xy)(\xi)=\xi(x)\xi(y)$ なので準同型。連続性：$x_{0}\in G$ とコンパクトな $C\subset\hat G$, $\varepsilon>0$ をとる。$(x,\xi)\mapsto\xi(x)$ は $G\times\hat G$ 上連続である（$x_{0}$ のコンパクト近傍 $K$ について、$x\in K$, $\xi\in B_{K}(\xi_{1},\delta)$ なら $|\xi(x)-\xi_{1}(x_{0})|\le\delta+|\xi_{1}(x)-\xi_{1}(x_{0})|$）。よって $W\defeq\{(x,\xi):|\xi(x)-\xi(x_{0})|<\varepsilon\}$ は連続関数 $(x,\xi)\mapsto|\xi(x)-\xi(x_{0})|$ による逆像として開で、$\{x_{0}\}\times C$ を含む。\ref{top:tube-lemma-compact-subset} から $x_{0}$ の開近傍 $V$ で $V\times C\subset W$ となるものがある。$x\in V$ なら連続関数 $\xi\mapsto|\xi(x)-\xi(x_{0})|$ のコンパクト集合 $C$ 上の最大値は $\varepsilon$ 未満なので、$\alpha(x)\in B_{C}(\alpha(x_{0}),\varepsilon)$。

**3.** $\alpha(x)=1$ なら、すべての $\xi$ で $\xi(x)=1$ なので、\ref{four:pd-separation} から $x=e$。
:::

::: theorem ポンチャーギンの双対定理 {#four:pd-duality keywords="Pontryagin duality theorem: the canonical map G -> double dual is an isomorphism of topological groups" index="ポンチャーギンの双対定理|ぽんちゃーぎんのそうついていり, 双対定理|そうついていり, ポントリャーギンの双対定理|ぽんとりゃーぎんのそうついていり" refname="ポンチャーギンの双対定理"}
局所コンパクト・ハウスドルフな可換群 $G$ について、\ref{four:pd-evaluation-map} の写像 $\alpha\colon G\to\hat{\hat{G}}$ は位相群の同型（全単射な連続準同型で、逆写像も連続）である。
:::

::: intuition
双対群の双対群をとると、もとの群に自然に戻る。群は、その指標の全体から位相まで含めて完全に復元できる。
:::

証明の道筋：(i) $\alpha$ が $G$ から像 $\alpha(G)$ への同相写像であることを \ref{four:pd-neighbourhood}（反転公式を $G$ に使う）から示す。(ii) すると $\alpha(G)$ は局所コンパクトな部分群なので閉である（\ref{four:pd-lc-subgroup-closed}）。(iii) $\alpha(G)$ は稠密である（\ref{four:pd-image-dense}、プランシュレルの定理を $\hat G$ に使う）。閉かつ稠密なので全体に一致する。

::: lemma 局所コンパクトな部分群は閉 {#four:pd-lc-subgroup-closed keywords="a locally compact subgroup of a Hausdorff topological group is closed" index="局所コンパクトな部分群|きょくしょこんぱくとなぶぶんぐん"}
$\Gamma$ をハウスドルフな位相群、$H$ をその部分群とし、$H$ は部分空間の位相で局所コンパクトとする。このとき $H$ は $\Gamma$ の閉集合である。
:::

::: proof
**Step 1.** 【主張：$H$ のコンパクト集合 $K$ と $\Gamma$ の開集合 $W\ni e$ で、$W\cap H\subset K$ かつ $K$ が $\Gamma$ で閉なものがある】 $K$ を $e$ の $H$ でのコンパクト近傍とすると、$H$ で開な $e\in O\subset K$ があり、部分空間の位相の定義から $O=W\cap H$ となる $\Gamma$ の開集合 $W$ がある。$K$ は $\Gamma$ でもコンパクトで、$\Gamma$ はハウスドルフなので閉（\ref{top:compact-hausdorff-closed.1}）。

**Step 2.** 【主張：$x\in\overline{H}$ なら $h_{0}\in H$ で $z\defeq h_{0}^{-1}x\in W\cap\overline{H}$ となるものがある】 $xW^{-1}$ は $x$ の開近傍（\ref{top:tg-neighbourhoods.1}）なので $H$ と交わり、$h_{0}\in H\cap xW^{-1}$ をとると $h_{0}^{-1}x\in W$。左平行移動 $y\mapsto h_{0}^{-1}y$ は $H$ を $H$ に写す同相写像なので、$\overline{H}$ を $\overline{H}$ に写す。

**Step 3.** 【主張：$z\in K$、したがって $x=h_{0}z\in H$】 $z$ の任意の開近傍 $N$ について $N\cap W$ は $z$ の開近傍で、$z\in\overline{H}$ なので $H$ の点を含み、その点は $W\cap H\subset K$ に属する。よって $z\in\overline{K}=K\subset H$。

::: hypcheck
- **ハウスドルフ性**：Step 1 で $K$ が閉であることに使った。
- **局所コンパクト性**：Step 1 に使った。外すと偽：$\mathbb{Q}\subset\mathbb{R}$ は閉でない部分群。
:::
:::

::: lemma 像の稠密性 {#four:pd-image-dense keywords="the image of G in the double dual is dense, via Plancherel theorem on the dual group" index="二重双対での像の稠密性|にじゅうそうついでのぞうのちゅうみつせい"}
$\alpha(G)$ は $\hat{\hat{G}}$ で稠密である。
:::

::: proof
$p_{0}\in\hat{\hat{G}}\setminus\overline{\alpha(G)}$ があったとして矛盾を導く。

**Step 1.** 【主張：$\theta\in C_{c}(\hat{\hat{G}})^{+}$ で、$F(p)\defeq\langle L_{p_{0}}\theta,L_{p}\theta\rangle_{L^{2}(\hat{\hat{G}})}$ が $\alpha(G)$ 上で $0$、$F(p_{0})>0$ となるものがある】 $N\defeq p_{0}^{-1}(\hat{\hat{G}}\setminus\overline{\alpha(G)})$ は $1$ の開近傍なので、\ref{top:tg-neighbourhoods.2} から対称な開近傍 $V$ で $VV\subset N$ となるものをとり、$0$ でない $\theta\in C_{c}(\hat{\hat{G}})^{+}$ で $\supp\theta\subset V$ のもの（\ref{four:rm-urysohn}）をとる。$F(p)=\int\theta(p_{0}^{-1}q)\theta(p^{-1}q)\,dq\ne0$ なら $p_{0}^{-1}q\in V$, $p^{-1}q\in V$ となる $q$ があり、$p\in qV^{-1}\subset p_{0}VV\subset\hat{\hat{G}}\setminus\overline{\alpha(G)}$。また $F(p_{0})=\|\theta\|_{2}^{2}>0$（\ref{four:hm-open-positive}）。

**Step 2.** 【主張：$a,b\in L^{2}(\hat G)$ があり、すべての $p\in\hat{\hat{G}}$ で $F(p)=\int_{\hat G}a(\xi)\overline{b(\xi)}\,\overline{p(\xi)}\,d\xi$】 \ref{four:bp-plancherel.2} を群 $\hat G$ に使い、そのユニタリ作用素を $\mathcal{F}\colon L^{2}(\hat G)\to L^{2}(\hat{\hat{G}})$ とする。全射性から $\mathcal{F}a=L_{p_{0}}\theta$, $\mathcal{F}b=\theta$ となる $a,b$ がある。$c\in L^{1}\cap L^{2}(\hat G)$ なら、$(p^{-1}q)(\xi)=\overline{p(\xi)}q(\xi)$ から
$$
(L_{p}\hat c)(q)=\int c(\xi)\,p(\xi)\overline{q(\xi)}\,d\xi=\widehat{pc}(q).
$$
$c\mapsto L_{p}\mathcal{F}c$ と $c\mapsto\mathcal{F}(pc)$ はともに $L^{2}(\hat G)$ からの等長写像（\ref{four:ga-translation-continuity.1}、$|p|=1$）で、稠密な $L^{1}\cap L^{2}$（\ref{four:rm-cc-dense}）上で一致するので等しい。よって $L_{p}\theta=\mathcal{F}(pb)$ で、内積の保存から $F(p)=\langle\mathcal{F}a,\mathcal{F}(pb)\rangle=\langle a,pb\rangle$。

**Step 3.** 【主張：矛盾】 $k\defeq a\overline{b}\in L^{1}(\hat G)$（コーシー–シュワルツの不等式）とし、\ref{four:bp-measure-transform} の $\check k$ を $\lambda=d\xi$ でとる。$x\in G$ について、Step 2 と $\overline{\xi(x)}=\xi(x^{-1})$ から
$$
F(\alpha(x))=\int k(\xi)\overline{\xi(x)}\,d\xi=\check k(x^{-1}).
$$
Step 1 からこれはすべての $x$ で $0$ なので、\ref{four:bp-measure-transform.3} から a.e. で $k=0$。すると Step 2 から $F(p_{0})=\int k\,\overline{p_{0}}\,d\xi=0$ となり、Step 1 に反する。

::: hypcheck
- **プランシュレルの定理の全射性**：Step 2 で $a,b$ をとるのに使った。等長性だけでは足りない。
- **$G$ 上の関数の一意性**：Step 3 の \ref{four:bp-measure-transform.3}。$\alpha(G)$ の点での値だけから $k=0$ を出す部分で、ここに $G$ が使われる。
:::
:::

::: restate {ref="four:pd-duality"}
:::

::: proof
**Step 1.** 【主張：$\alpha$ は $G$ から部分空間 $\alpha(G)$ への同相写像】 \ref{four:pd-evaluation-map} から $\alpha$ は $\alpha(G)$ への連続な全単射なので、$G$ の開集合 $O$ の像が $\alpha(G)$ で開であることを示せばよい。$x_{0}\in O$ について $U\defeq x_{0}^{-1}O$ に \ref{four:pd-neighbourhood} を使い、$C$ を得る。$W\defeq\{x:|\xi(x)-1|<1/4\ (\forall\xi\in C)\}$ とおくと $W\subset U$ で、
$$
\alpha(W)=\alpha(G)\cap B_{C}(1,1/4)
$$
（$C$ 上の連続関数 $|\xi(x)-1|$ の最大値で考える）。$\alpha(G)$ は部分群なので $\alpha(x_{0})\alpha(G)=\alpha(G)$ で、
$$
\alpha(O)\supset\alpha(x_{0}W)=\alpha(G)\cap\alpha(x_{0})B_{C}(1,1/4).
$$
$\alpha(x_{0})B_{C}(1,1/4)$ は開集合（\ref{top:tg-neighbourhoods.1}, \ref{four:lc-dual-topology.1}）で $\alpha(x_{0})$ を含むので、$\alpha(O)$ は各点の $\alpha(G)$ での近傍。

**Step 2.** 【主張：$\alpha(G)$ は $\hat{\hat{G}}$ の閉部分群】 $\alpha$ は準同型なので $\alpha(G)$ は部分群。Step 1 から $\alpha(G)$ は $G$ と同相で局所コンパクト。$\hat{\hat{G}}$ はハウスドルフ（\ref{four:lc-dual-topology.1}）なので、\ref{four:pd-lc-subgroup-closed} から閉。

**Step 3.** 【主張：$\alpha$ は位相群の同型】 Step 2 と \ref{four:pd-image-dense} から $\alpha(G)=\overline{\alpha(G)}=\hat{\hat{G}}$。$\alpha$ は全単射な連続準同型で、Step 1 から逆写像も連続。

::: hypcheck
- **局所コンパクト性**：ハール測度・反転公式・プランシュレルの定理全体と、Step 2 の閉性に使った。
- **ハウスドルフ性**：単射性（\ref{four:pd-separation}）に使った。
- **可換性**：外すと偽。3 次対称群 $S_{3}$ では $\hat S_{3}\cong\mathbb{Z}/2$ で、$\alpha\colon S_{3}\to\mathbb{Z}/2$ は符号であり単射でない。
- **反転公式とプランシュレルの定理**：前者を $G$ に（Step 1、\ref{four:pd-neighbourhood}）、後者を $\hat G$ に（Step 3、\ref{four:pd-image-dense}）使った。双対定理そのものはどちらの証明にも使っていない（循環しない）。
- **選択公理**：記法の約束のとおり、反転公式・プランシュレルの定理を通じて依存する。
:::
:::

::: supplement
**高い視点.** 連続準同型 $\varphi\colon G_{1}\to G_{2}$ に $\hat\varphi(\xi)\defeq\xi\circ\varphi$ を対応させると、$G\mapsto\hat G$ は局所コンパクト・ハウスドルフ可換群の圏からそれ自身への反変関手になり、$\alpha$ は自然変換である（$\alpha(\varphi(x))(\xi)=\xi(\varphi(x))=\alpha(x)(\hat\varphi(\xi))$）。双対定理は、この関手が圏の反変な自己同値を与えることの中心部分である（関手の連続性などはここでは証明しない）。

**前提を変えると.** 非可換群では指標の代わりに既約ユニタリ表現の全体を使う。コンパクト群については表現の全体から群を復元するタンナカ–クラインの双対定理があることが知られている（ここでは扱わない）。

**別の道筋.** 稠密性の証明には、$\alpha(G)$ で消える $\hat{\hat{G}}$ 上の関数を作る代わりに、剰余群 $\hat{\hat{G}}/\overline{\alpha(G)}$ に \ref{four:pd-separation} を使って $\alpha(G)$ 上で $1$ になる $\hat{\hat{G}}$ の指標を作る道もある。ただしその指標が $\hat G$ の元から来ることを言うには $\hat G$ についての双対定理が必要になるので、このページではプランシュレルの定理の全射性を使う道を選んだ。

**似た定理.** 有限次元ベクトル空間 $V$ の二重双対への自然な写像 $V\to V^{**}$ が同型であることが、もっとも身近な同じ型の定理である（$S^{1}$ の代わりに係数体を使う）。ブール代数とストーン空間の双対性（\see{top:page-stone-duality}）や、コンパクト・ハウスドルフ空間 $X$ が $C(X)$ の複素準同型の全体として復元されること（\ref{four:page-lca-duality} の補足）も、「対象を、ある決まった対象への射の全体で表し直すと元に戻る」という同じ形の双対性である。
:::

## 帰結 {#four:sec-pd-consequences}

::: corollary コンパクト群と離散群の双対性 {#four:pd-compact-discrete keywords="G is compact iff its dual is discrete; G is discrete iff its dual is compact" index="コンパクト群と離散群の双対性|こんぱくとぐんとりさんぐんのそうついせい"}
1. $G$ がコンパクトであることと、$\hat G$ が離散であることは同値である。
2. $G$ が離散であることと、$\hat G$ がコンパクトであることは同値である。
:::

::: intuition
閉じて小さい群の双対はとびとびの群になり、その逆も成り立つ。
:::

::: proof
**1.** ⇒ は \ref{four:lc-compact-discrete.1}。$\hat G$ が離散なら \ref{four:lc-compact-discrete.2} を群 $\hat G$ に使って $\hat{\hat{G}}$ はコンパクトで、\ref{four:pd-duality} から $G$ はそれと同相なのでコンパクト。

**2.** ⇒ は \ref{four:lc-compact-discrete.2}。$\hat G$ がコンパクトなら \ref{four:lc-compact-discrete.1} から $\hat{\hat{G}}$ は離散で、$G$ もそうである。
:::

::: definition 消去群 {#four:pd-annihilator keywords="annihilator of a closed subgroup, H perp" index="消去群|しょうきょぐん, 零化群|れいかぐん, 直交補群|ちょっこうほぐん"}
部分群 $H\subset G$ について、$H^{\perp}\defeq\{\xi\in\hat G:\xi(h)=1\ (\forall h\in H)\}$ を $H$ の**消去群**という。
:::

::: intuition
部分群の上でいつも $1$ になる指標を集めたものである。
:::

::: theorem 剰余群の双対 {#four:pd-quotient-dual keywords="dual of G/H is the annihilator of H; a closed subgroup equals its double annihilator" index="剰余群の双対群|じょうよぐんのそうついぐん"}
$H$ を $G$ の閉部分群、$q\colon G\to G/H$ を射影とする。
1. $H^{\perp}$ は $\hat G$ の閉部分群である。
2. $G/H$ は局所コンパクト・ハウスドルフな可換群で、$Q(\chi)\defeq\chi\circ q$ は位相群の同型 $Q\colon\widehat{G/H}\to H^{\perp}$ である。
3. $H=\{x\in G:\xi(x)=1\ (\forall\xi\in H^{\perp})\}$。
:::

::: intuition
剰余群の指標は「部分群の上で $1$ になる指標」と同じものであり、閉部分群は、その上で $1$ になる指標の全体から復元できる。
:::

::: proof
**Step 1.** 【主張：1】 $\xi\mapsto\xi(h)$ は連続（\ref{four:pd-evaluation-map.1} の証明と同じ）なので、$H^{\perp}=\bigcap_{h\in H}\{\xi:\xi(h)=1\}$ は閉。部分群であることは値ごとの積から。

**Step 2.** 【主張：$G/H$ は局所コンパクト・ハウスドルフな可換群】 可換な位相群であることは \ref{top:tg-quotient.3}、ハウスドルフ性は \ref{top:tg-quotient.2}。$q$ は開写像（\ref{top:tg-quotient.1}）なので、$x$ のコンパクト近傍 $K$ について $q(K)$ はコンパクト（\ref{top:compact-basic.2}）で開集合 $q(\operatorname{int}K)\ni q(x)$ を含む。

**Step 3.** 【主張：$Q$ は全単射な群準同型】 $\chi\circ q$ は連続で $H$ 上 $1$ なので $Q(\chi)\in H^{\perp}$。$q$ は全射なので $Q$ は単射。$\xi\in H^{\perp}$ は剰余類 $xH$ の上で一定なので、\ref{top:quotient-universal} から $\xi=\chi\circ q$ となる連続な $\chi$ があり、$q$ が全射準同型なので $\chi$ も準同型。

**Step 4.** 【主張：コンパクトな $L\subset G/H$ にはコンパクトな $K\subset G$ で $q(K)=L$ となるものがある】 閉包がコンパクトな $e$ の開近傍 $W$ をとる。$\{q(xW)\}_{x\in G}$ は $L$ の開被覆なので有限個 $q(x_{1}W),\dots,q(x_{n}W)$ で覆える。$L$ は閉（\ref{top:compact-hausdorff-closed.1}）なので $K\defeq q^{-1}(L)\cap\bigcup_{i}x_{i}\overline{W}$ はコンパクト集合の閉集合でコンパクト（\ref{top:compact-basic.1}・\ref{top:compact-basic.3}）。$l\in L$ は $l=q(y)$, $y\in x_{i}W$ と書けて $y\in K$。

**Step 5.** 【主張：2】 コンパクトな $K\subset G$ について $\sup_{K}|\chi\circ q-\chi_{0}\circ q|=\sup_{q(K)}|\chi-\chi_{0}|$ で、$q(K)$ はコンパクトなので $Q$ は連続。Step 4 の $K$ について $\sup_{L}|\chi-\chi_{0}|=\sup_{K}|Q\chi-Q\chi_{0}|$ なので $Q^{-1}$ も連続。

**Step 6.** 【主張：3】 $\subset$ は定義から。$x\notin H$ なら $q(x)$ は $G/H$ の単位元でないので、Step 2 と \ref{four:pd-separation} から $\chi(q(x))\ne1$ の $\chi\in\widehat{G/H}$ があり、$\xi\defeq Q(\chi)\in H^{\perp}$ は $\xi(x)\ne1$。

::: hypcheck
- **$H$ が閉**：Step 2 のハウスドルフ性と、Step 6 に使った。閉でない $H$ では $H^{\perp}=\overline{H}^{\perp}$（連続性から）なので 3 は $\overline{H}$ についてしか成り立たない。
- **局所コンパクト性**：Step 4 の $W$ と、Step 6 の \ref{four:pd-separation}（$G/H$ に使う）。
:::
:::

::: supplement
**部分群の双対.** 双対の形で対になる主張として、制限写像 $\hat G\to\hat H$, $\xi\mapsto\xi|_{H}$ は全射で、位相群の同型 $\hat G/H^{\perp}\cong\hat H$ を引き起こすことが知られている。とくに閉部分群の指標はつねに $G$ の指標に延びる。証明には双対定理と \ref{four:pd-quotient-dual} を組み合わせる議論が要るが、ここでは証明しない。

**消去群の対応.** 3 と双対定理から、$H\mapsto H^{\perp}$ は $G$ の閉部分群と $\hat G$ の閉部分群の間の包含を逆にする全単射であることも導かれる（$\hat G$ の閉部分群 $\Lambda$ について、3 を群 $\hat G$ に使い、$\Lambda^{\perp}=\alpha(\alpha^{-1}(\Lambda^{\perp}))$ に注意すると $\Lambda=(\alpha^{-1}(\Lambda^{\perp}))^{\perp}$ が出る）。
:::

## 例 {#four:sec-pd-examples}

::: example 整数・円周・実数直線の二重双対 {#four:pd-examples}
\ref{four:lc-basic-duals} の同一視のもとで $\alpha$ を書き下すと、どの場合も恒等写像（またはその場合の自然な同型）になる。
1. **$\mathbb{Z}$.** $\hat{\mathbb{Z}}$ は $z\in S^{1}$ による $\xi_{z}(n)=z^{n}$ で $S^{1}\cong\mathbb{T}$ と同一視される。$\alpha(n)(\xi_{z})=z^{n}$ は、$z=e^{2\pi it}$ と書くと $\mathbb{T}$ の指標 $\xi_{n}(t+\mathbb{Z})=e^{2\pi int}$ そのものである。よって $\alpha$ は $\hat{\hat{\mathbb{Z}}}\cong\hat{\mathbb{T}}\cong\mathbb{Z}$ の同一視のもとで $n\mapsto n$。
2. **$\mathbb{T}$.** $\hat{\mathbb{T}}$ は $n\mapsto\xi_{n}$ で $\mathbb{Z}$ と同一視される。$\alpha(t+\mathbb{Z})(\xi_{n})=e^{2\pi int}=(e^{2\pi it})^{n}=\xi_{z}(n)$（$z=e^{2\pi it}$）なので、$\alpha$ は $\hat{\hat{\mathbb{T}}}\cong\hat{\mathbb{Z}}\cong S^{1}$ の同一視のもとで $t+\mathbb{Z}\mapsto e^{2\pi it}$。
3. **$\mathbb{R}$.** $\hat{\mathbb{R}}$ は $y\mapsto\xi_{y}$, $\xi_{y}(x)=e^{2\pi ixy}$ で $\mathbb{R}$ と同一視される。$\alpha(x)(\xi_{y})=e^{2\pi ixy}=\xi_{x}(y)$ なので、$\alpha$ は $\hat{\hat{\mathbb{R}}}\cong\hat{\mathbb{R}}\cong\mathbb{R}$ の同一視のもとで $x\mapsto x$。

ここで、位相群の同型 $\Phi\colon\Gamma'\to\hat G$ があれば $P\mapsto P\circ\Phi$ は位相群の同型 $\hat{\hat{G}}\to\widehat{\Gamma'}$ である（$\Phi$ はコンパクト集合をコンパクト集合に一対一に写すので、$B_{C}$ の形の近傍が対応する）。これらの群では、双対定理は \ref{four:lc-basic-duals} を二度使えばすぐに確かめられる。双対定理の内容は、一般の $G$ では $\hat G$ を具体的に知らなくても同じことが起きる、という点にある。

**剰余群.** $G=\mathbb{R}$, $H=\mathbb{Z}$ なら $H^{\perp}=\{\xi_{y}:y\in\mathbb{Z}\}$（\ref{four:prob-pd-integer-annihilator}）で、\ref{four:pd-quotient-dual.2} は $\hat{\mathbb{T}}\cong\mathbb{Z}$（\ref{four:lc-basic-duals.2}）を言い直したものである。
:::

## 問題 {#four:sec-pd-problems}

::: problem {#four:prob-pd-integer-annihilator}
$G=\mathbb{R}$, $H=\mathbb{Z}$ とし、$\hat{\mathbb{R}}$ を $\xi_{y}(x)=e^{2\pi ixy}$ で $\mathbb{R}$ と同一視する（\ref{four:lc-basic-duals.3}）。$H^{\perp}=\{\xi_{y}:y\in\mathbb{Z}\}$ を示し、\ref{four:pd-quotient-dual.3} がこの場合に成り立つことを直接確かめよ。
:::

::: solution
$\xi_{y}\in H^{\perp}$ は、すべての $n\in\mathbb{Z}$ で $e^{2\pi iny}=1$ となることで、$n=1$ から $y\in\mathbb{Z}$、逆に $y\in\mathbb{Z}$ なら $e^{2\pi iny}=1$。次に $\{x:e^{2\pi ixy}=1\ (\forall y\in\mathbb{Z})\}$ は $y=1$ の条件 $e^{2\pi ix}=1$ から $\mathbb{Z}$ に含まれ、逆に $x\in\mathbb{Z}$ はすべての $y\in\mathbb{Z}$ で条件を満たす。よって $\mathbb{Z}$ に一致する。
:::

::: problem {#four:prob-pd-trigonometric-dense}
$G$ をコンパクトとする。指標の有限個の一次結合（**三角多項式**）の全体は、複素数値連続関数の空間 $C(G;\mathbb{C})$ で一様ノルムについて稠密であることを、\ref{four:pd-separation} と \ref{top:stone-weierstrass} を使って示せ。
:::

::: solution
三角多項式の全体 $\mathcal{A}$ は、$\xi\eta\in\hat G$ から積で閉じ、$\overline{\xi}\in\hat G$ から共役で閉じ、定数 $1$ を含む。実数値の元の全体 $\mathcal{A}_{r}$ は実数の部分代数で、$u\in\mathcal{A}$ について $\operatorname{Re}u=(u+\overline{u})/2$, $\operatorname{Im}u=(u-\overline{u})/(2i)$ を含む。$x\ne y$ なら \ref{four:pd-separation} から $\xi(x)\ne\xi(y)$ の $\xi$ があり、$\operatorname{Re}\xi$, $\operatorname{Im}\xi$ のどちらかが $x,y$ を分離する。$G$ はコンパクト・ハウスドルフなので、\ref{top:stone-weierstrass} から $\mathcal{A}_{r}$ は実数値連続関数の空間で稠密。複素数値の $v$ は $\operatorname{Re}v$, $\operatorname{Im}v$ をそれぞれ $u_{1},u_{2}\in\mathcal{A}_{r}$ で近似し、$\|v-(u_{1}+iu_{2})\|_{\infty}\le\|\operatorname{Re}v-u_{1}\|_{\infty}+\|\operatorname{Im}v-u_{2}\|_{\infty}$ とすればよい。
:::
