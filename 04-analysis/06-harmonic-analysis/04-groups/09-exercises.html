# 演習：群の上の調和解析 {#four:page-exercises-groups keywords="exercises, harmonic analysis on groups"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは、具体的な汎関数が表すラドン測度とその台、上三角行列群のハール測度とモジュラー関数、$\mathrm{SL}_{2}(\mathbb{R})$ の単模性、乗法群・整数・$ax+b$ 群での畳み込みと対合、$L^{2}*L^{2}\subset C_{0}$ とシュタインハウスの定理、$\mathrm{SO}(2)$・$\mathrm{SU}(2)$・四元数群の指標、指標による射影、$\mathbb{Z}/n$・$\mathbb{R}\times\mathbb{T}$・離散な $\mathbb{Q}$・乗法群の双対群、具体的な正定値関数のボホナー測度と周期性、プランシュレルの定理による和の計算と $L^{2}$ での畳み込み定理、消去群とクロネッカーの稠密性定理の計算と、いくつかのページの結果を組み合わせる問題（有限群の群環の構造、離散な $\mathbb{Q}$ の双対群の構造）である。各節の中は、計算・基本（★）、標準（★★）、発展（★★★）の順に並べた。

## 記法と定義の確認 {#four:sec-exgh-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。とくに $L_{s}f(x)=f(s^{-1}x)$, $R_{s}f(x)=f(xs)$, $\check f(x)=f(x^{-1})$（\ref{four:page-haar-measure}）、モジュラー関数 $\Delta$ は $\int f(yx)\,d\mu(y)=\Delta(x^{-1})\int f\,d\mu$ を満たすもの（\ref{four:hm-modular-function.2}）、畳み込みは $f*g(x)=\int f(y)g(y^{-1}x)\,d\mu(y)$、対合は $f^{*}(x)=\Delta(x^{-1})\overline{f(x^{-1})}$（\ref{four:ga-involution}）。
- $\mathbb{T}=\mathbb{R}/\mathbb{Z}$、$e_{n}(t)=e^{2\pi int}$、$S^{1}=\{|z|=1\}$。$\mathbb{T}$ のハール測度は全測度 $1$（\ref{four:hm-examples.2}）。$\mathbb{R}_{>0}$ は乗法群、$\lambda$ はルベーグ測度。
- 連続な正定値関数 $\varphi$ について、\ref{four:bp-bochner.1} の測度 $\nu$ をここでは $\varphi$ のボホナー測度と呼ぶ。
- コンパクト群のハール測度は $\mu(G)=1$ と正規化し、$\langle f,g\rangle=\int f\bar g\,d\mu$。既約なユニタリ表現 $\pi$ の行列成分を $\pi_{ij}$、次数を $d_{\pi}$、指標を $\chi_{\pi}$ と書く（\ref{four:cg-finite-representation}）。
- **選択公理**：引用する各ページの結果に含まれるもの（\ref{four:rm-urysohn} の従属選択公理、\ref{four:bp-spectral-radius} の極大イデアルの存在など）のほかには、\ref{four:ex-cg-3} で有限個の表現の代表を選ぶだけである。\ref{four:ex-rm-2} の $\mathbb{Q}$ の番号づけは具体的に一つ固定でき、\ref{four:ex-lc-1}・\ref{four:ex-pd-3} の冪根は偏角 $[0,1)$ の主値で選ぶので、選択は要らない。
:::

## 局所コンパクト空間上のラドン測度 {#four:sec-rm-exercises}

対応するページ：\ref{four:page-radon-measures}

::: problem ★ 基本：点測度とルベーグ測度の和 {#four:ex-rm-1}
$X=\mathbb{R}$ 上で $I(f)\defeq f(0)+\int_{0}^{1}f(x)\,dx$（リーマン積分）とおき、$\mu$ を対応するラドン測度とする。
1. \ref{four:rm-riesz-markov-kakutani.3} の式だけを使って $\mu(\{0\})=1$, $\mu([0,1])=2$, $\mu((0,1))=1$, $\mu(\{1\})=0$ を求めよ。
2. $\nu(E)\defeq\mathbf{1}_{E}(0)+\lambda(E\cap[0,1])$ がラドン測度で $I$ を表すことを示し、$\mu=\nu$ を導け。
:::

::: solution
$I$ は正値線形である（連続関数のリーマン積分の線形性と単調性）。

**1.** $\{0\}\prec f$ なら $f(0)=1$, $\int_{0}^{1}f\ge0$ なので $I(f)\ge1$ である。$0<\varepsilon\le1$ について $f_{\varepsilon}(x)\defeq\max(1-|x|/\varepsilon,0)$ とおくと $\{0\}\prec f_{\varepsilon}$ で、$I(f_{\varepsilon})=1+\frac{\varepsilon}{2}$ となる。よって $\mu(\{0\})=1$ である。$[0,1]\prec f$ なら $[0,1]$ 上 $f=1$ なので $I(f)=2$ であり、そのような $f$ はある（\ref{four:rm-urysohn}）から $\mu([0,1])=2$ である。$f\prec(0,1)$ なら $f(0)=0$, $\int_{0}^{1}f\le1$ なので $I(f)\le1$ である。$n\ge3$ について、$[\frac1n,1-\frac1n]$ 上で $1$、$(\frac{1}{2n},1-\frac{1}{2n})$ の外で $0$ となる台形関数を $g_{n}$ とおくと、$g_{n}\prec(0,1)$ かつ $I(g_{n})\ge1-\frac2n$ なので $\mu((0,1))=1$ である。最後に、$\{1\}\prec f_{\varepsilon}(\cdot-1)$ であり $I(f_{\varepsilon}(\cdot-1))=\frac{\varepsilon}{2}$ なので $\mu(\{1\})=0$ である。

**2.** $\nu$ は（点測度とルベーグ測度の制限の和なので）測度であり、$f\in C_{c}(\mathbb{R})$ について $\int f\,d\nu=f(0)+\int_{[0,1]}f\,d\lambda=I(f)$ が成り立つ（\ref{meas:riemann-lebesgue}）。ラドン測度の条件を確かめる。(a) については、どのコンパクト集合 $K$ でも $\nu(K)\le\nu(\mathbb{R})=2$ である。(b) について：ボレル集合 $E$ と $\varepsilon>0$ について、\ref{meas:lebesgue-regularity.1} から開集合 $W\supset E\cap[0,1]$ で $\lambda(W)<\lambda(E\cap[0,1])+\varepsilon$ となるものをとる。$U_{0}\defeq W\cup(\mathbb{R}\setminus[0,1])$ とおき、$0\in E$ なら $U\defeq U_{0}$、$0\notin E$ なら $U\defeq U_{0}\setminus\{0\}$ と定める。$U$ は $E$ を含む開集合で、$U\cap[0,1]\subset W$ かつ $\mathbf{1}_{U}(0)\le\mathbf{1}_{E}(0)$ なので $\nu(U)\le\mathbf{1}_{E}(0)+\lambda(W)<\nu(E)+\varepsilon$ である。(c) について：開集合 $U$ について \ref{meas:lebesgue-regularity.2} からコンパクトな $K'\subset U\cap[0,1]$ で $\lambda(K')>\lambda(U\cap[0,1])-\varepsilon$ となるものをとり、$K\defeq K'\cup(\{0\}\cap U)$ とおけば、$K\subset U$ はコンパクトで $\nu(K)\ge\mathbf{1}_{U}(0)+\lambda(K')>\nu(U)-\varepsilon$ となる。よって $\nu$ はラドン測度で、\ref{four:rm-riesz-markov-kakutani.2} から $\mu=\nu$ である。1 の値は $\nu$ からも読める。
:::

::: problem ★★ 標準：ラドン測度の台 {#four:ex-rm-2}
$\mu$ を $X$ 上のラドン測度とし、測度 $0$ の開集合すべての和を $W$、$\supp\mu\defeq X\setminus W$ とおく。
1. $\mu(W)=0$ を示せ。
2. $f\in C_{c}(X)^{+}$ について、$\int f\,d\mu=0$ と「$\supp\mu$ 上で $f=0$」が同値であることを示せ。
3. $n\mapsto q_{n}$ を $\{1,2,\dots\}$ から $\mathbb{Q}$ への全単射とし、$\mathbb{R}$ 上で $I(f)\defeq\sum_{n\ge1}2^{-n}f(q_{n})$ とおく。対応するラドン測度 $\mu$ は $\mu(E)=\sum_{q_{n}\in E}2^{-n}$ で、$\supp\mu=\mathbb{R}$ なのに $\mu(\mathbb{R}\setminus\mathbb{Q})=0$ であることを示せ。
:::

::: solution
**1.** $W$ は開集合なので、内部正則性 (c) から、コンパクト $K\subset W$ について $\mu(K)=0$ を示せばよい。$K$ は測度 $0$ の開集合の族で覆われるので有限個 $V_{1},\dots,V_{m}$ で覆え、$\mu(K)\le\sum_{i}\mu(V_{i})=0$ となる。（$W$ は非可算個の開集合の和でありうるので、可算加法性だけでは済まない。）

**2.** $\supp\mu$ 上で $f=0$ なら $\{f\ne0\}\subset W$ なので、1 から $\int f\,d\mu\le\|f\|_{\infty}\mu(W)=0$ である。逆に、ある $x\in\supp\mu$ で $f(x)>0$ と仮定する。$U\defeq\{f>f(x)/2\}$ とおくと $U$ は $x$ を含む開集合で、$x\notin W$ から $\mu(U)>0$ である。よって $\int f\,d\mu\ge\frac{f(x)}{2}\mu(U)>0$ となる。

**3.** 級数は $|f(q_{n})|\le\|f\|_{\infty}$ から絶対収束し、$I$ は正値線形である。$\nu(E)\defeq\sum_{q_{n}\in E}2^{-n}$ とおくと、$\nu$ は（非負項の級数の並べ替えから）可算加法的な測度で、$\nu(\mathbb{R})=1$ である。$f\ge0$ がボレル可測なら、$f\mathbf{1}_{\mathbb{Q}}=\sum_{n}f(q_{n})\mathbf{1}_{\{q_{n}\}}$ の\term[部分和]{calc:series}に \ref{meas:monotone-convergence} を使い、$\nu(\mathbb{R}\setminus\mathbb{Q})=0$ と合わせて $\int f\,d\nu=\sum_{n}2^{-n}f(q_{n})$ を得る。よって $\nu$ は $I$ を表す。ラドン性：$\varepsilon>0$ について $\sum_{n>N}2^{-n}<\varepsilon$ となる $N$ をとる。(b) $E$ に対し $U\defeq\mathbb{R}\setminus\{q_{n}:n\le N,\ q_{n}\notin E\}$ は（有限集合の補集合なので）開で $E$ を含み、$\nu(U)<\nu(E)+\varepsilon$ を満たす。(c) 開集合 $U$ に対し $K\defeq\{q_{n}\in U:n\le N\}$ は有限集合なのでコンパクトで、$\nu(K)>\nu(U)-\varepsilon$ を満たす。(a) は $\nu(\mathbb{R})=1$ から。よって \ref{four:rm-riesz-markov-kakutani.2} から $\mu=\nu$ である。空でない開集合はある $q_{n}$ を含み測度 $2^{-n}$ 以上なので、$W=\varnothing$、すなわち $\supp\mu=\mathbb{R}$ である。一方、$\mu(\mathbb{R}\setminus\mathbb{Q})=\nu(\mathbb{R}\setminus\mathbb{Q})=0$ である。台が全体でも、測度は零集合の補集合（ここでは可算集合）に集中しうる。
:::

## ハール測度 {#four:sec-hm-exercises}

対応するページ：\ref{four:page-haar-measure}

::: problem ★ 基本：上三角行列群のハール測度とモジュラー関数 {#four:ex-hm-1}
$B\defeq\Bigl\{\begin{pmatrix}a&b\\0&d\end{pmatrix}:a,d\in\mathbb{R}\setminus\{0\},\ b\in\mathbb{R}\Bigr\}$ を $(a,b,d)$ で $\mathbb{R}^{3}$ の開集合と同一視する。
1. $g=\begin{pmatrix}\alpha&\beta\\0&\delta\end{pmatrix}$ による左平行移動 $x\mapsto gx$、右平行移動 $x\mapsto xg$ のヤコビアンがそれぞれ $|\alpha^{2}\delta|$, $|\alpha\delta^{2}|$ であることを示せ。
2. $d\mu\defeq|a|^{-2}|d|^{-1}\,da\,db\,dd$ が左ハール測度であることを示せ。
3. $\Delta\begin{pmatrix}a&b\\0&d\end{pmatrix}=\dfrac{|d|}{|a|}$ を示し、右ハール測度 $|a|^{-1}|d|^{-2}\,da\,db\,dd$ を求めよ。$d=1$, $a>0$ の部分群で \ref{four:hm-examples.5} と比べよ。
:::

::: solution
$B$ は $\GL_{2}(\mathbb{R})$ の部分群で、演算は $(a,b,d)$ の有理式なので、$\mathbb{R}^{3}$ の開集合として局所コンパクト・ハウスドルフな位相群である。

**1.** 行列の積を計算すると $gx=(\alpha a,\ \alpha b+\beta d,\ \delta d)$ であり、このヤコビ行列は $(a,b,d)$ について三角行列で、対角成分は $\alpha,\alpha,\delta$ である。よってヤコビアンは $|\alpha^{2}\delta|$ である。同様に $xg=(a\alpha,\ a\beta+b\delta,\ d\delta)$ のヤコビ行列も三角行列で、対角成分は $\alpha,\delta,\delta$ なので、ヤコビアンは $|\alpha\delta^{2}|$ である。

**2.** $\rho(a,b,d)\defeq|a|^{-2}|d|^{-1}$ とおき、$f\in C_{c}(B)$ について $I(f)\defeq\int_{B}f\rho\,d\lambda$ と定める。$\Phi(x)\defeq gx$ は $B$ の微分同相で、$\rho(gx)=|\alpha a|^{-2}|\delta d|^{-1}$ と 1 から $\rho(gx)J_{\Phi}(x)=\rho(x)$ が成り立つ。\ref{meas:change-of-variables.3} を $f\rho$ に使うと
$$
I(f)=\int_{B}f(gx)\rho(gx)J_{\Phi}(x)\,d\lambda(x)=I(L_{g^{-1}}f).
$$
$I$ は $0$ でない正値線形汎関数なので、\ref{four:hm-existence-uniqueness.3} から $I(f)=\int f\,d\mu$ となる左ハール測度 $\mu$ がある。

**3.** $x=(\alpha,\beta,\delta)$ を固定し、$\Psi(y)\defeq yx$ とおく。1 から $J_{\Psi}=|\alpha\delta^{2}|$ であり、$\rho(yx)=\rho(y)|\alpha|^{-2}|\delta|^{-1}$ なので、同じ変数変換から
$$
I(f)=\int f(yx)\rho(y)|\alpha|^{-2}|\delta|^{-1}|\alpha\delta^{2}|\,d\lambda(y)=\frac{|\delta|}{|\alpha|}\int f(yx)\,d\mu(y).
$$
$\int f\,d\mu>0$ の $f$（\ref{four:hm-open-positive}）と \ref{four:hm-modular-function.2} から $\Delta(x^{-1})=|\alpha|/|\delta|$ であり、準同型性から $\Delta(x)=|\delta|/|\alpha|$ である。\ref{four:hm-modular-function.4} から、右ハール測度は $\Delta(x^{-1})\,d\mu(x)=\frac{|a|}{|d|}\cdot\frac{da\,db\,dd}{|a|^{2}|d|}=|a|^{-1}|d|^{-2}\,da\,db\,dd$ である。直接にも、$\rho_{R}\defeq|a|^{-1}|d|^{-2}$ は $\rho_{R}(xg)|\alpha\delta^{2}|=\rho_{R}(x)$ を満たす。$d=1$, $a>0$ の部分群に制限すると $\Delta=a^{-1}$ となり、\ref{four:hm-examples.5} と一致する。対角行列の部分群（可換で単模）の上でも $\Delta\ne1$ なので、閉部分群のモジュラー関数は $\Delta$ の制限とは限らない。
:::

::: problem ★★ 標準：交換子とコンパクト部分群、SL₂(ℝ) の単模性 {#four:ex-hm-2}
$G$ を局所コンパクト・ハウスドルフな位相群とする。
1. $\Delta$ は交換子 $xyx^{-1}y^{-1}$ とコンパクト部分群の上で $1$ であることを示せ。したがって、これらで生成される部分群の上で $\Delta=1$。
2. $u(t)\defeq\begin{pmatrix}1&t\\0&1\end{pmatrix}$, $l(t)\defeq\begin{pmatrix}1&0\\t&1\end{pmatrix}$ はどちらも $\mathrm{SL}_{2}(\mathbb{R})$ の交換子であり、$u(t)$, $l(t)$ の全体が $\mathrm{SL}_{2}(\mathbb{R})$ を生成することを示せ。$\mathrm{SL}_{2}(\mathbb{R})$ が単模であることを導け。
:::

::: solution
**1.** \ref{four:hm-modular-function.3} から $\Delta$ は可換群 $(0,\infty)$ への準同型なので、$\Delta(xyx^{-1}y^{-1})=\Delta(x)\Delta(y)\Delta(x)^{-1}\Delta(y)^{-1}=1$ である。コンパクト部分群 $K$ の像 $\Delta(K)$ は $(0,\infty)$ のコンパクトな部分群なので、\ref{four:hm-unimodular-examples.2} の証明と同じく $\{1\}$ である。$\Delta$ は準同型なので、$\Delta=1$ となる元の全体は部分群であり、生成された部分群の上でも $\Delta=1$ である。

**2.** $\mathrm{SL}_{2}(\mathbb{R})$ は $\GL_{2}(\mathbb{R})$ の閉部分群（$\det$ の連続性）なので局所コンパクト・ハウスドルフである。$h\defeq\operatorname{diag}(\sqrt2,1/\sqrt2)$ とおくと $hu(s)h^{-1}=u(2s)$ なので、次が成り立つ。
$$
hu(t)h^{-1}u(t)^{-1}=u(2t)u(-t)=u(t).
$$
同様に $h^{-1}l(s)h=l(2s)$ から $h^{-1}l(t)hl(t)^{-1}=l(2t)l(-t)=l(t)$ である。生成について：$g=\begin{pmatrix}a&b\\c&d\end{pmatrix}\in\mathrm{SL}_{2}(\mathbb{R})$ とする。$c\ne0$ の場合、$x\defeq(a-1)/c$, $y\defeq(d-1)/c$ とおくと
$$
u(x)l(c)u(y)=\begin{pmatrix}1+xc&(1+xc)y+x\\c&cy+1\end{pmatrix}=\begin{pmatrix}a&\frac{ad-1}{c}\\c&d\end{pmatrix}=g
$$
である（$ad-bc=1$ を使った）。$c=0$ の場合、$l(1)g$ の左下成分は $a\ne0$ なので、前の場合から $l(1)g$ は生成され、$g=l(-1)(l(1)g)$ も生成される。よって 1 から $\mathrm{SL}_{2}(\mathbb{R})$ 上で $\Delta=1$ である。（\ref{four:ex-hm-1} の $B$ では、対角成分への連続準同型 $B\to(\mathbb{R}^{\times})^{2}$ の像を考えると、交換子もコンパクト部分群の元も対角成分が $\pm1$ なので、これらは $B$ を生成しない。）
:::

## 群環と畳み込み {#four:sec-ga-exercises}

対応するページ：\ref{four:page-group-algebra}

::: problem ★ 基本：具体的な畳み込みと対合 {#four:ex-ga-1}
1. $\mathbb{R}_{>0}$ に $\mu(E)\defeq\lambda(\log E)$ を入れる。$\mu$ がハール測度で $d\mu=dt/t$ であることを示し、$f\defeq\mathbf{1}_{[1,e]}$ について $f*f(x)=\max(0,1-|\log x-1|)$ を示せ。
2. $\ell^{1}(\mathbb{Z})$ で $a_{n}\defeq2^{-|n|}$ について $a*a(n)=\frac{3|n|+5}{3}2^{-|n|}$ を示し、$\|a*a\|_{1}=\|a\|_{1}^{2}$ を確かめよ。
3. $ax+b$ 群（\ref{four:hm-examples.5}、$d\mu=a^{-2}da\,db$）で $f\defeq\mathbf{1}_{[1,2]\times[0,1]}$ とする。$\int f\,d\mu=\int f^{*}\,d\mu=\frac12$、$\int f(x^{-1})\,d\mu(x)=\log2$ を示せ。
:::

::: solution
**1.** $\log\colon\mathbb{R}_{>0}\to\mathbb{R}$ は位相群の同型なので、開集合・コンパクト集合・ボレル集合が対応し、ルベーグ測度のラドン性（\ref{four:rm-examples.1}）と平行移動不変性から $\mu$ はハール測度である（$\log(sE)=\log s+\log E$）。\ref{meas:change-of-variables.1}（$\Phi=\log$, $J_{\Phi}(t)=1/t$）から $\mu(E)=\int_{E}dt/t$ である。\ref{four:hm-transport} と同じ議論で $\int F\,d\mu=\int F(e^{s})\,ds$ なので、$u\defeq\log x$ とおくと
$$
f*f(x)=\int f(e^{s})f(xe^{-s})\,ds=\int\mathbf{1}_{[0,1]}(s)\mathbf{1}_{[0,1]}(u-s)\,ds=\lambda([0,1]\cap[u-1,u]),
$$
となり、これは $\max(0,1-|u-1|)$ に等しい。$\log$ で $\mathbb{R}$ の畳み込み $\mathbf{1}_{[0,1]}*\mathbf{1}_{[0,1]}$（三角形）に移っただけである。

**2.** $a$ は偶関数なので $a*a$ も偶関数であり、$n\ge0$ の場合を示せばよい。$a*a(n)=\sum_{m}a(m)a(n-m)$ の和を $m$ の範囲で三つに分ける。$m<0$ の部分は $\sum_{m<0}2^{m}2^{-(n-m)}=2^{-n}\sum_{k\ge1}4^{-k}=\frac{2^{-n}}{3}$ である。$0\le m\le n$ の部分は各項が $2^{-n}$ なので計 $(n+1)2^{-n}$ である。$m>n$ の部分は $\sum_{m>n}2^{-m}2^{-(m-n)}=2^{n}\cdot\frac{4^{-n-1}}{1-1/4}=\frac{2^{-n}}{3}$ である。ゆえに $a*a(n)=(n+\frac53)2^{-n}=\frac{3n+5}{3}2^{-n}$ である。ノルムを計算すると $\|a\|_{1}=1+2\sum_{n\ge1}2^{-n}=3$ であり、$\sum_{n\ge1}n2^{-n}=2$ を使うと $\|a*a\|_{1}=\frac53+2\sum_{n\ge1}(n+\frac53)2^{-n}=\frac53+2(2+\frac53)=9=\|a\|_{1}^{2}$ となる。

**3.** 直接計算すると $\int f\,d\mu=\int_{1}^{2}\int_{0}^{1}a^{-2}\,db\,da=\frac12$ である。$x=(a,b)$ なら $x^{-1}=(a^{-1},-a^{-1}b)$ であり、$x^{-1}\in[1,2]\times[0,1]$ は $a\in[\frac12,1]$, $b\in[-a,0]$ と同値である。$\Delta(x^{-1})=a$ なので次を得る。
$$
\int f^{*}d\mu=\int_{1/2}^{1}\!\!\int_{-a}^{0}a\cdot a^{-2}\,db\,da=\int_{1/2}^{1}da=\frac12,\quad\int f(x^{-1})\,d\mu=\int_{1/2}^{1}\frac{da}{a}=\log2.
$$
前者は \ref{four:ga-involution.1} の $\|f^{*}\|_{1}=\|f\|_{1}$ と合う。後者は、$E\defeq[1,2]\times[0,1]$ について $\int_{E}\Delta(x^{-1})\,d\mu=\int_{1}^{2}\frac{da}{a}=\log2$ となり、\ref{four:hm-modular-function.4} の式と合う。対合の因子 $\Delta(x^{-1})$ がなければ $L^{1}$ ノルムは保たれない。
:::

::: problem ★★ 標準：L²∗L² ⊂ C₀ {#four:ex-ga-2}
$G$ を単模とし、$f,g\in L^{2}(G)$ とする。
1. $\check g\in L^{2}(G)$, $\|\check g\|_{2}=\|g\|_{2}$ を示せ。
2. 各 $x$ で $F(x)\defeq\int f(y)g(y^{-1}x)\,d\mu(y)$ は絶対収束して代表によらず、$|F(x)|\le\|f\|_{2}\|g\|_{2}$、$F$ は一様連続であることを示せ。
3. $F\in C_{0}(G)$ を示せ。$f,g\in L^{1}\cap L^{2}$ なら $F$ は $f*g$ の連続な代表である。
4. $G$ がコンパクトなら、$L^{2}(G)$ は畳み込みについてバナッハ環であることを示せ。
5. ボレル集合 $A,B$ が $0<\mu(A),\mu(B)<\infty$ なら、$AB\defeq\{ab:a\in A,b\in B\}$ は空でない開集合を含み、$AA^{-1}$ は $e$ の近傍であることを示せ。
:::

::: solution
**1.** $|g|^{2}\in L^{1}$ であり、$\Delta=1$ なので $(|g|^{2})^{*}=|\check g|^{2}$ である。よって \ref{four:ga-involution.1} から $\|\check g\|_{2}^{2}=\|(|g|^{2})^{*}\|_{1}=\|g\|_{2}^{2}$ となる。

**2.** $g(y^{-1}x)=\check g(x^{-1}y)=L_{x}\check g(y)$ なので、コーシー–シュワルツの不等式と \ref{four:ga-translation-continuity.1} から $\int|f||L_{x}\check g|\,d\mu\le\|f\|_{2}\|L_{x}\check g\|_{2}=\|f\|_{2}\|g\|_{2}$ である。$g$ を零集合 $N$ の上で変えると $L_{x}\check g$ は $xN^{-1}$ の上で変わるだけであり、これは零集合である（\ref{four:ga-inversion-null} と左不変性）。同じ評価から次を得る。
$$
|F(x)-F(x')|\le\|f\|_{2}\|L_{x}\check g-L_{x'}\check g\|_{2}=\|f\|_{2}\|L_{x'^{-1}x}\check g-\check g\|_{2},
$$
右辺は $x'^{-1}x$ だけで決まり、\ref{four:ga-translation-continuity.1} から $x'^{-1}x\to e$ のとき $0$ に近づくので、$F$ は一様連続である。

**3.** \ref{four:rm-cc-dense} から $L^{2}$ で $f_{n}\to f$, $g_{n}\to g$ となる $f_{n},g_{n}\in C_{c}(G)$ をとる。$F_{n}\defeq f_{n}*g_{n}\in C_{c}(G)$（\ref{four:ga-convolution.2}）であり、$F-F_{n}=(f-f_{n})*g+f_{n}*(g-g_{n})$ と 2 の評価から次を得る。
$$
\|F-F_{n}\|_{\infty}\le\|f-f_{n}\|_{2}\|g\|_{2}+\|f_{n}\|_{2}\|g-g_{n}\|_{2}\to0.
$$
$\varepsilon>0$ について $\|F-F_{n}\|_{\infty}<\varepsilon/2$ となる $n$ をとると、$\{|F|\ge\varepsilon\}\subset\{|F_{n}|\ge\varepsilon/2\}\subset\supp F_{n}$ なので、$\{|F|\ge\varepsilon\}$ はコンパクト集合の閉部分集合としてコンパクトである。よって $F\in C_{0}(G)$ である。後半は、\ref{four:ga-convolution.1} の式と同じ式で、2 から代表によらないことによる。

**4.** $\mu(G)=1$ なので $L^{2}\subset L^{1}$ であり、2 から $\|f*g\|_{2}\le\|f*g\|_{\infty}\le\|f\|_{2}\|g\|_{2}$ が成り立つ。結合法則と双線形性は $L^{1}(G)$ のもの（\ref{four:ga-convolution.3}）。

**5.** $F\defeq\mathbf{1}_{A}*\mathbf{1}_{B}$ は 2 から連続で $0$ 以上、\ref{four:ga-convolution} の Step 2 の計算から $\int F\,d\mu=\mu(A)\mu(B)>0$ である。よって $U\defeq\{F>0\}$ は空でない開集合で、$F(x)>0$ なら $y\in A$, $y^{-1}x\in B$ となる $y$ があり、$x=y(y^{-1}x)\in AB$ となる。$B=A^{-1}$（1 から $\mu(A^{-1})=\mu(A)$）とすると $F(e)=\int\mathbf{1}_{A}(y)\mathbf{1}_{A^{-1}}(y^{-1})\,d\mu(y)=\mu(A)>0$ なので、$e\in U\subset AA^{-1}$ である。$\mathbb{R}$ では「正の測度の集合 $A$ について $A-A$ は $0$ の近傍」となる。
:::

## コンパクト群の表現とピーター–ワイルの定理 {#four:sec-cg-exercises}

対応するページ：\ref{four:page-compact-groups}

::: problem ★ 基本：SO(2)・SU(2)・四元数群の指標 {#four:ex-cg-1}
1. $r(\theta)\defeq\begin{pmatrix}\cos2\pi\theta&-\sin2\pi\theta\\\sin2\pi\theta&\cos2\pi\theta\end{pmatrix}$ により $\mathbb{T}\cong\mathrm{SO}(2)$ とする。$\mathrm{SO}(2)$ の既約表現を求め、$\mathbb{C}^{2}$ への自然な表現を既約分解せよ。
2. \ref{four:cg-su2} を認める。$\chi_{n}\defeq\chi_{\pi_{n}}$ について $\chi_{1}\chi_{n}=\chi_{n+1}+\chi_{n-1}$（$n\ge1$）、$\chi_{1}^{2}=\chi_{2}+\chi_{0}$ を示し、$\pi_{1}\otimes\pi_{n}\cong\pi_{n+1}\oplus\pi_{n-1}$ を導け。
3. $\mathbf{i}\defeq\operatorname{diag}(i,-i)$, $\mathbf{j}\defeq\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, $\mathbf{k}\defeq\mathbf{i}\mathbf{j}$ とし、$Q_{8}\defeq\{\pm1,\pm\mathbf{i},\pm\mathbf{j},\pm\mathbf{k}\}\subset\mathrm{SU}(2)$ とする。$\pi_{1}|_{Q_{8}}$ は既約で、$\pi_{2}|_{Q_{8}}$ は互いに異なる 3 つの自明でない 1 次元表現の直和であることを示せ。
:::

::: solution
**1.** $\mathrm{SO}(2)$ は可換なので既約表現は 1 次元（\ref{four:cg-schur-lemma.3}）で、\ref{four:prob-cg-circle-characters} から、それは $r(\theta)\mapsto e^{2\pi in\theta}$（$n\in\mathbb{Z}$）である。$v_{\pm}\defeq(1,\mp i)$ について、$c\defeq\cos2\pi\theta$, $s\defeq\sin2\pi\theta$ とおくと $r(\theta)v_{+}=(c+is,\ s-ic)=e^{2\pi i\theta}v_{+}$ であり、同様に $r(\theta)v_{-}=e^{-2\pi i\theta}v_{-}$ である。よって自然な表現は $e_{1}\oplus e_{-1}$ と同値で、その指標は $2c=e_{1}+e_{-1}$ である。

**2.** $\mathrm{SU}(2)$ の元は\term[ユニタリ]{lin:adjoint}行列なので $\mathrm{SU}(2)$ の元で対角化され（対角化する行列をスカラー倍して行列式を $1$ にする）、$\operatorname{diag}(e^{i\theta},e^{-i\theta})$ と共役。指標は類関数なので、この元での値を比べればよい。$\theta\notin\pi\mathbb{Z}$ なら、加法定理 $2\cos\theta\sin(n+1)\theta=\sin(n+2)\theta+\sin n\theta$ から次が成り立つ。
$$
2\cos\theta\cdot\frac{\sin(n+1)\theta}{\sin\theta}=\frac{\sin(n+2)\theta+\sin n\theta}{\sin\theta}=\chi_{n+1}+\chi_{n-1}.
$$
$\theta\in\pi\mathbb{Z}$ の場合は、両辺の連続性から等式が成り立つ。$\chi_{1}^{2}=\chi_{2}+\chi_{0}$ は $n=1$ の場合である（$\chi_{0}=1$）。$\tr(A\otimes B)=\tr A\tr B$ から $\pi_{1}\otimes\pi_{n}$ の指標は $\chi_{1}\chi_{n}$ で、\ref{four:cg-character-orthogonality.2} から分解を得る。

**3.** $\mathbf{k}=\begin{pmatrix}0&i\\i&0\end{pmatrix}$ であり、直接の計算から $\mathbf{i}^{2}=\mathbf{j}^{2}=\mathbf{k}^{2}=-1$ となるので、$Q_{8}$ は位数 $8$ の部分群である。ハール測度は $|E|/8$ である（\ref{four:cg-examples.2}）。$\chi_{1}=\tr$ の値は $\pm1$ で $\pm2$、他の 6 元で $0$ なので、$\|\chi_{1}\|_{2}^{2}=\frac{4+4}{8}=1$ である。$\rho$ を $\pi_{1}|_{Q_{8}}$ の既約分解の重複度 $m_{\sigma}$ で書くと、\ref{four:cg-character-orthogonality.1} から $\|\chi_{\rho}\|_{2}^{2}=\sum m_{\sigma}^{2}$ なので、これが $1$ なら既約である。2 から $\chi_{2}=\chi_{1}^{2}-1$ の値は $\pm1$ で $3$、他の 6 元で $-1$ であり、$\|\chi_{2}\|_{2}^{2}=\frac{9+9+6}{8}=3$ となる。$\sum m_{\sigma}^{2}=3$ から重複度 $1$ の互いに異なる 3 つの成分があり、$\sum m_{\sigma}d_{\sigma}=\chi_{2}(1)=3$ からそれらの次数はすべて $1$ である。$\langle\chi_{2},1\rangle=\frac{3+3-6}{8}=0$ なので、自明表現は現れない。
:::

::: problem ★★ 標準：指標による射影 {#four:ex-cg-2}
$\pi,\sigma$ を既約なユニタリ表現とする。
1. $\pi_{ij}*\pi_{kl}=\frac{\delta_{jk}}{d_{\pi}}\pi_{il}$、$\pi,\sigma$ が同値でなければ $\pi_{ij}*\sigma_{kl}=0$ を示せ。
2. $\chi_{\pi}*\chi_{\pi}=\chi_{\pi}/d_{\pi}$、$\chi_{\pi}*\chi_{\sigma}=0$（同値でないとき）を示せ。
3. $P_{\pi}f\defeq d_{\pi}\chi_{\pi}*f$ は $L^{2}(G)$ から $\mathcal{E}_{\pi}$ への直交射影であることを示せ。$G=\mathbb{T}$ ではどうなるか。
:::

::: solution
**1.** $\pi(y^{-1}x)=\pi(y)^{*}\pi(x)$ から $\pi_{kl}(y^{-1}x)=\sum_{m}\overline{\pi_{mk}(y)}\pi_{ml}(x)$ である。これを畳み込みに代入し、\ref{four:cg-schur-orthogonality.2} を使うと次を得る。
$$
\pi_{ij}*\pi_{kl}(x)=\sum_{m}\langle\pi_{ij},\pi_{mk}\rangle\pi_{ml}(x)=\sum_{m}\frac{\delta_{im}\delta_{jk}}{d_{\pi}}\pi_{ml}(x)=\frac{\delta_{jk}}{d_{\pi}}\pi_{il}(x).
$$
$\pi_{ij}*\sigma_{kl}$ も同じ展開で $\sum_{m}\langle\pi_{ij},\sigma_{mk}\rangle\sigma_{ml}$ となり、係数 $\langle\pi_{ij},\sigma_{mk}\rangle$ は \ref{four:cg-schur-orthogonality.1} から $0$ である。

**2.** $\chi_{\pi}=\sum_{i}\pi_{ii}$ を代入すると、1 から $\chi_{\pi}*\chi_{\pi}=\sum_{i,k}\pi_{ii}*\pi_{kk}=\sum_{i,k}\frac{\delta_{ik}}{d_{\pi}}\pi_{ik}=\frac{\chi_{\pi}}{d_{\pi}}$ となる。後半も 1 から従う。

**3.** \ref{four:ga-convolution.1}（$p=2$）から $\|P_{\pi}f\|_{2}\le d_{\pi}\|\chi_{\pi}\|_{1}\|f\|_{2}$ なので、$P_{\pi}$ は\term[有界]{fa:bounded-operator}である。1 から $P_{\pi}\pi_{kl}=\sum_{i}d_{\pi}\pi_{ii}*\pi_{kl}=\sum_{i}\delta_{ik}\pi_{il}=\pi_{kl}$ であり、$\sigma$ が $\pi$ と同値でなければ $P_{\pi}\sigma_{kl}=0$ である。よって $P_{\pi}$ は $\mathcal{E}_{\pi}$ 上で恒等写像であり、$\pi$ と同値でない $\sigma$ の $\mathcal{E}_{\sigma}$ 上で $0$ である。\ref{four:cg-peter-weyl.2} から $\mathcal{E}_{\pi}^{\perp}$ は $\sum_{\sigma\ne\pi}\mathcal{E}_{\sigma}$ の閉包なので、連続性から $P_{\pi}$ は $\mathcal{E}_{\pi}^{\perp}$ 上で $0$ で、直交射影である。$G=\mathbb{T}$ の場合は $\chi=e_{n}$, $d=1$ であり、$e_{n}*f(x)=\int f(z)e_{n}(x-z)\,dz=\hat f(n)e_{n}(x)$ となる。すなわち $P_{\pi}f$ は $f$ のフーリエ級数の第 $n$ 項である。
:::

::: problem ★★★ 発展：有限群の群環の構造 {#four:ex-cg-3}
$G$ をコンパクト群とし、連続なユニタリ表現 $\sigma\colon G\to\mathrm{U}(d)$ と $f\in L^{1}(G)$ について $\sigma(f)\defeq\int f(x)\sigma(x)\,d\mu(x)$（成分ごとの積分）とおく。
1. $\sigma(f*g)=\sigma(f)\sigma(g)$, $\sigma(f^{*})=\sigma(f)^{*}$ を示せ。
2. $f\in L^{1}(G)$ が、すべての既約なユニタリ表現 $\pi$ で $\pi(f)=0$ を満たせば $f=0$ であることを示せ。
3. $G$ が有限で、$\pi_{1},\dots,\pi_{r}$ が $\widehat{G}$ の代表なら、$f\mapsto(\pi_{1}(f),\dots,\pi_{r}(f))$ は $L^{1}(G)$ から $\prod_{k}M_{d_{\pi_{k}}}(\mathbb{C})$ への $*$-環の同型であることを示せ。
4. 二面体群 $D_{4}=\langle r,s\mid r^{4}=s^{2}=1,\ srs=r^{-1}\rangle$ と \ref{four:ex-cg-1.3} の $Q_{8}$ について、$L^{1}(D_{4})\cong L^{1}(Q_{8})\cong\mathbb{C}^{4}\times M_{2}(\mathbb{C})$ だが $D_{4}\not\cong Q_{8}$ であることを示せ。
:::

::: solution
**Step 1.** 【主張：1】 $\langle\sigma(f)e_{j},e_{i}\rangle=\int f\sigma_{ij}\,d\mu=\int f(x)\langle\sigma(x)e_{j},e_{i}\rangle\,d\mu$ なので、$\sigma(f)$ は \ref{four:ga-integrated-representation.1} の作用素（$H=\mathbb{C}^{d}$）で、\ref{four:ga-integrated-representation.2} から従う。

**Step 2.** 【主張：$f\in L^{2}(G)$ なら 2 が成り立つ】 定義から $\pi(f)_{ij}=\int f\pi_{ij}=\langle f,\overline{\pi_{ij}}\rangle$ である。$\bar\pi(x)\defeq\overline{\pi(x)}$ は連続なユニタリ表現で、$W$ が $\bar\pi$ で不変 $\iff\overline{W}$ が $\pi$ で不変なので既約。既約なユニタリ表現 $\sigma$ は $\sigma=\overline{\bar\sigma}$ なので、仮定を $\pi=\bar\sigma$ に使うと $f\perp\sigma_{ij}$ を得る。よって $f$ はすべての $\mathcal{E}_{\sigma}$ と直交し、\ref{four:cg-peter-weyl.2} から $f=0$ である。

**Step 3.** 【主張：2】 $f\in L^{1}$ とし、$\psi$ を \ref{four:ga-approximate-identity} の関数（$\supp\psi\subset V$）とする。$\psi^{*}\in C(G)\subset L^{2}$ で、\ref{four:ga-convolution.1}（$p=2$）から $f^{*}*\psi^{*}\in L^{2}$ である。1 から $\pi(f^{*}*\psi^{*})=\pi(f)^{*}\pi(\psi^{*})=0$ なので、Step 2 から $f^{*}*\psi^{*}=0$ である。\ref{four:ga-involution.2} と $f^{**}=f$ から $\psi*f=(f^{*}*\psi^{*})^{*}=0$ となり、$\|f\|_{1}=\|\psi*f-f\|_{1}\le\varepsilon$ である。$\varepsilon$ は任意なので $f=0$ である。

**Step 4.** 【主張：3】 $\widehat G$ が有限であることと $\sum_{k}d_{\pi_{k}}^{2}=|G|$ は \ref{four:cg-examples.2} による。写像は 1 から $*$-準同型であり、2 から単射である（同値な表現 $A\pi A^{-1}$ では $\pi(f)$ が共役になるだけなので、代表で $0$ ならすべての既約表現で $0$）。両辺の次元はともに $|G|$ なので、全単射である。

**Step 5.** 【主張：4】 $D_{4}$ の元は $r^{a}s^{b}$（$a\bmod4$, $b\bmod2$）と一意に書け、$sr^{c}=r^{-c}s$ が成り立つ。1 次元表現 $\chi$ は $\chi(r)^{-1}=\chi(srs^{-1})=\chi(r)$ から $\chi(r),\chi(s)\in\{\pm1\}$ で、逆にこの 4 通りは $\chi(r^{a}s^{b})\defeq\chi(r)^{a}\chi(s)^{b}$ で準同型を与える（$\chi(r)^{-c}=\chi(r)^{c}$）。正方形の対称としての $\mathbb{C}^{2}$ への表現の指標の値は $e$ で $2$、$r^{2}$ で $-2$、他の 6 元（$\pm90^{\circ}$ の回転と鏡映）で $0$ なので、ノルムの 2 乗は $\frac{4+4}{8}=1$ であり、既約である（\ref{four:cg-character-orthogonality.1}）。$4\cdot1^{2}+2^{2}=8$ なので、\ref{four:cg-examples.2} からこれで全部である。$Q_{8}$ では \ref{four:ex-cg-1.3} から、自明表現と $\pi_{2}|_{Q_{8}}$ の 3 成分（1 次元）と $\pi_{1}|_{Q_{8}}$（2 次元）が既約であり、同じく $4+4=8$ なのでこれで全部である。3 からどちらも $\mathbb{C}^{4}\times M_{2}(\mathbb{C})$ と同型である。一方、\term[位数]{grp:element-order} 2 の元は $Q_{8}$ では $-1$ だけ、$D_{4}$ では $r^{2}$ と 4 つの鏡映 $r^{a}s$ の 5 個なので、群は同型でない。群環は群を決めない。
:::

## 局所コンパクト可換群の双対群 {#four:sec-lc-exercises}

対応するページ：\ref{four:page-lca-duality}

::: problem ★ 基本：ℤ/n・ℝ×𝕋・離散な ℚ の双対群 {#four:ex-lc-1}
1. $\omega\defeq e^{2\pi i/n}$ とする。$\widehat{\mathbb{Z}/n}=\{\xi_{k}:k=0,\dots,n-1\}$, $\xi_{k}(m)=\omega^{km}$ を確かめ、数え上げ測度について $f\defeq\mathbf{1}_{\{0,1\}}$ の $\hat f$ と $|\hat f|^{2}$ を求めよ。
2. $\widehat{\mathbb{R}\times\mathbb{T}}\cong\mathbb{R}\times\mathbb{Z}$, $\xi_{(y,n)}(x,t)=e^{2\pi i(xy+nt)}$ を示し、ハール測度 $\int F\,d\mu=\int_{0}^{1}\!\int_{\mathbb{R}}F\,dx\,dt$（$F\in C_{c}$）について $f(x,t)\defeq\max(1-|x|,0)(1+\cos2\pi t)$ の $\hat f$ を求めよ。
3. $\mathbb{Q}$ に離散位相を入れる。$\xi\mapsto(\xi(1/k!))_{k\ge1}$ が位相群の同型 $\hat{\mathbb{Q}}\to\Sigma\defeq\{(z_{k})\in(S^{1})^{\mathbb{N}}:z_{k+1}^{k+1}=z_{k}\}$（直積位相）であり、$\hat{\mathbb{Q}}$ はコンパクトで、$j(y)(q)\defeq e^{2\pi iqy}$ が単射な連続準同型 $j\colon\mathbb{R}\to\hat{\mathbb{Q}}$ であることを示せ。
:::

::: solution
**1.** $\xi\in\widehat{\mathbb{Z}/n}$ とする。$\xi(1)^{n}=\xi(n\cdot1)=1$ なので、ある $k$ について $\xi(1)=\omega^{k}$ であり、$\xi(m)=\xi(1)^{m}$ から $\xi=\xi_{k}$ である。逆に $\xi_{k}$ は\term[指標]{four:lc-character}で、$k$ が違えば $\xi_{k}(1)$ が違う。$f$ の変換は $\hat f(\xi_{k})=\sum_{m}f(m)\overline{\xi_{k}(m)}=1+\omega^{-k}$ であり、$|\hat f(\xi_{k})|^{2}=2+2\cos\frac{2\pi k}{n}=4\cos^{2}\frac{\pi k}{n}$ となる。$f*f=\mathbf{1}_{\{0\}}+2\cdot\mathbf{1}_{\{1\}}+\mathbf{1}_{\{2\}}$（$n\ge3$）の変換は $(1+\omega^{-k})^{2}$ であり、\ref{four:lc-fourier-basic.2} と合う。

**2.** 同型は \ref{four:lc-products} と \ref{four:lc-basic-duals.2}・\ref{four:lc-basic-duals.3} から。汎関数は正値線形で平行移動不変（$x$ 方向はルベーグ測度、$t$ 方向は \ref{four:circle-translation.1}）なので、\ref{four:hm-existence-uniqueness.3} からハール測度を定める。$f\overline{\xi_{(y,n)}}\in C_{c}$ なので、フビニの定理から次のように変数が分かれる。
$$
\hat f(y,n)=\int_{-1}^{1}(1-|x|)e^{-2\pi ixy}dx\cdot\int_{0}^{1}(1+\cos2\pi t)e^{-2\pi int}dt .
$$
第 1 因子は、$y\ne0$ なら $2\int_{0}^{1}(1-x)\cos(2\pi xy)\,dx=2\cdot\frac{1-\cos2\pi y}{(2\pi y)^{2}}=\bigl(\frac{\sin\pi y}{\pi y}\bigr)^{2}$（部分積分で $\int_{0}^{1}(1-x)\cos(ax)\,dx=\frac{1-\cos a}{a^{2}}$）であり、$y=0$ なら $1$ である。第 2 因子は、$n=0$ なら $1$、$n=\pm1$ なら $\frac12$、それ以外なら $0$ である。よって $\hat f(y,n)$ は $|y|+|n|\to\infty$ のとき $0$ に近づき、\ref{four:lc-riemann-lebesgue} と合う。

**3.** $q=a/b$（$b\ge1$）は $q=a\frac{b!}{b}\big/b!$ と書けるので、各 $q$ は $m/k!$（$m\in\mathbb{Z}$）の形である。$\xi\in\hat{\mathbb{Q}}$ なら $z_{k}\defeq\xi(1/k!)$ は $z_{k+1}^{k+1}=\xi(\frac{k+1}{(k+1)!})=z_{k}$ を満たし、$\xi(m/k!)=z_{k}^{m}$ から $\xi$ は $(z_{k})$ で決まる。逆に $(z_{k})\in\Sigma$ について $\xi(m/k!)\defeq z_{k}^{m}$ は、$\frac{m}{k!}=\frac{m(k+1)}{(k+1)!}$ と $z_{k+1}^{m(k+1)}=z_{k}^{m}$ から表し方によらず、準同型である（二つの元を同じ $k$ で書く）。$\mathbb{Q}$ のコンパクト集合は有限集合なので、コンパクト開位相は各点収束の位相で、各 $q=m/k!$ での値は $z_{k}$ の連続関数なので、各点収束は $(z_{k})$ の各成分の収束と同値である。よって対応は同相である。コンパクト性は \ref{four:lc-compact-discrete.2}（$\Sigma$ が $(S^{1})^{\mathbb{N}}$ の閉集合であることからも従う）。$j(y)$ は\term[指標]{four:lc-character}で $j$ は準同型であり、各点での値 $e^{2\pi iqy}$ は $y$ について連続なので、$j$ は連続である。単射性：$y\ne0$ とする。$y\notin\mathbb{Z}$ なら $q=1$、$y\in\mathbb{Z}$ なら $q=\frac{1}{2y}$ とおくと $e^{2\pi iqy}\ne1$ なので、$j(y)\ne1$ である。
:::

::: problem ★★ 標準：乗法群の双対群とメリン変換 {#four:ex-lc-2}
1. $\Phi\colon G'\to G$ が局所コンパクト可換群の位相群としての同型なら、$\xi\mapsto\xi\circ\Phi$ は位相群の同型 $\hat G\to\widehat{G'}$ であることを示せ。
2. $\widehat{\mathbb{R}_{>0}}\cong\mathbb{R}$（$t\mapsto t^{2\pi iy}$）、$\widehat{\mathbb{R}^{\times}}\cong\mathbb{Z}/2\times\mathbb{R}$（$x\mapsto\operatorname{sgn}(x)^{\epsilon}|x|^{2\pi iy}$）、$\widehat{\mathbb{C}^{\times}}\cong\mathbb{Z}\times\mathbb{R}$（$z\mapsto(z/|z|)^{n}|z|^{2\pi iy}$）を示せ。
3. $\mathbb{R}_{>0}$ のハール測度 $dt/t$（\ref{four:ex-ga-1.1}）について、$f=\mathbf{1}_{[1,e]}$ の $\hat f(y)$ を求めよ。また $dA/|z|^{2}$ が $\mathbb{C}^{\times}$ のハール測度であることを示せ。
:::

::: solution
**1.** $\xi\circ\Phi$ は $G'\to S^{1}$ の連続準同型であり、対応は群同型である（逆は $\eta\mapsto\eta\circ\Phi^{-1}$）。$\Phi$ はコンパクト集合 $K'\subset G'$ をコンパクト集合 $\Phi(K')$ に一対一に写し、$\sup_{K'}|\xi\circ\Phi-\xi_{0}\circ\Phi|=\sup_{\Phi(K')}|\xi-\xi_{0}|$ なので、基本近傍 $B_{K}$ が互いに対応する。

**2.** $\log\colon\mathbb{R}_{>0}\to\mathbb{R}$ に 1 と \ref{four:lc-basic-duals.3} を使うと、$\mathbb{R}_{>0}$ の\term[指標]{four:lc-character}は $e^{2\pi iy\log t}=t^{2\pi iy}$（$y\in\mathbb{R}$）である。$x\mapsto(\operatorname{sgn}x,|x|)$ は $\mathbb{R}^{\times}\to\{\pm1\}\times\mathbb{R}_{>0}$ の位相群の同型（両方向とも連続）で、$\widehat{\{\pm1\}}\cong\mathbb{Z}/2$（\ref{four:ex-lc-1.1}、$n=2$）と \ref{four:lc-products} から $\widehat{\mathbb{R}^{\times}}\cong\mathbb{Z}/2\times\mathbb{R}$ を得る。$z\mapsto(z/|z|,|z|)$ は $\mathbb{C}^{\times}\to S^{1}\times\mathbb{R}_{>0}$ の位相群の同型（逆は $(w,r)\mapsto rw$）であり、$S^{1}\cong\mathbb{T}$ と \ref{four:lc-basic-duals.2}・\ref{four:lc-products} から $\widehat{\mathbb{C}^{\times}}\cong\mathbb{Z}\times\mathbb{R}$ を得る。

**3.** $s=\log t$ と置き換えると、$y\ne0$ なら $\hat f(y)=\int_{1}^{e}t^{-2\pi iy}\frac{dt}{t}=\int_{0}^{1}e^{-2\pi iys}ds=\frac{1-e^{-2\pi iy}}{2\pi iy}$ であり、$\hat f(0)=1$ である。これは $\mathbb{R}$ での $\widehat{\mathbf{1}_{[0,1]}}$ で、\ref{four:ex-ga-1.1} の $f*f$ の変換 $\hat f^{2}$ は三角形の変換になる。$\int_{0}^{\infty}F(t)t^{s-1}dt$ の形の積分（メリン変換）を $s=-2\pi iy$ で見たものである。$\mathbb{C}^{\times}$ について：$w$ を掛ける写像は $\mathbb{R}^{2}$ の線形写像でヤコビアンは $|w|^{2}$ であり、$\rho(z)\defeq|z|^{-2}$ とおくと $\rho(wz)|w|^{2}=\rho(z)$ を満たすので、\ref{four:ex-hm-1.2} と同じく \ref{meas:change-of-variables.3} と \ref{four:hm-existence-uniqueness.3} から $dA/|z|^{2}$ はハール測度である。
:::

## 正定値関数とボホナーの定理 {#four:sec-bp-exercises}

対応するページ：\ref{four:page-bochner-plancherel}

::: problem ★ 基本：ボホナー測度の計算 {#four:ex-bp-1}
\ref{four:lc-basic-duals} の同一視を使う。
1. $\tau(y)\defeq\max(1-|y|,0)$ とする。$\mathbb{R}$ 上の $\varphi(x)\defeq\bigl(\frac{\sin\pi x}{\pi x}\bigr)^{2}$（$\varphi(0)\defeq1$）は正定値で、ボホナー測度は $\tau(y)\,dy$ であることを示せ。
2. $0<r<1$ について $\mathbb{Z}$ 上の $\varphi(n)\defeq r^{|n|}$ は正定値で、ボホナー測度は $\mathbb{T}$ 上の $P_{r}(t)\,dt$, $P_{r}(t)\defeq\frac{1-r^{2}}{1-2r\cos2\pi t+r^{2}}$ であることを示せ。
3. $\mathbb{T}$ 上の $\cos^{2}2\pi t$ のボホナー測度を求めよ。$\psi(t)\defeq\cos2\pi t-\frac12$ は正定値でないことを示せ。
:::

::: solution
**Step 1.** 【主張：$p\ge0$ が有界な連続関数で、全測度が有限なら、$\nu(E)\defeq\int_{E}p\,d\lambda$ は $\mathbb{R}$ 上のラドン測度】 $M\defeq\sup p$ とおく。(a) は $\nu(\mathbb{R})<\infty$ から従う。(b) について：\ref{meas:lebesgue-regularity.3}（(a)⇒(b)）から開集合 $U\supset E$ で $\lambda(U\setminus E)<\varepsilon$ となるものがあり、$\nu(U\setminus E)\le M\varepsilon$ である。(c) について：開集合 $U$ について $\nu(U\setminus(-N,N))<\varepsilon$ となる $N$ をとり、\ref{meas:lebesgue-regularity.2} からコンパクトな $K\subset U\cap(-N,N)$ で $\lambda(U\cap(-N,N)\setminus K)<\varepsilon$ となるものをとれば、$\nu(U\setminus K)<(1+M)\varepsilon$ となる。$\mathbb{T}$ 上（測度は全測度 $1$ のハール測度）でも、(b)・(c) をハール測度の正則性（\ref{four:rm-finite-inner-regular}）で同様に示せる。

**Step 2.** 【主張：1】 $\tau$ は偶関数なので、\ref{four:ex-lc-1.2} の計算から $\int e^{2\pi ixy}\tau(y)\,dy=\int e^{-2\pi ixy}\tau(y)\,dy=\varphi(x)$ である。Step 1 から $\tau\,dy$ は有限なラドン測度なので、\ref{four:bp-bochner.2} から $\varphi$ は正定値で、\ref{four:bp-bochner.1} の一意性からこれがボホナー測度である（台はコンパクト集合 $[-1,1]$）。

**Step 3.** 【主張：2】 $w\defeq re^{2\pi it}$ とおくと、等比級数の和から次が成り立つ。
$$
\sum_{m\in\mathbb{Z}}r^{|m|}e^{2\pi imt}=\frac{1}{1-w}+\frac{\bar w}{1-\bar w}=\frac{1-|w|^{2}}{|1-w|^{2}}=P_{r}(t).
$$
級数は $\sum r^{|m|}<\infty$ から一様収束するので、項別積分から $\int_{0}^{1}e^{2\pi int}P_{r}(t)\,dt=r^{|n|}$ を得る。$\hat{\mathbb{Z}}$ の元 $\xi_{z}$（$z=e^{2\pi it}$）は $\xi_{z}(n)=e^{2\pi int}$ なので、$P_{r}\ge0$ と Step 1 から \ref{four:bp-bochner} の式が成り立つ。

**Step 4.** 【主張：3】 $\cos^{2}2\pi t=\frac12+\frac14(e_{2}+e_{-2})$ なので、ボホナー測度は $\hat{\mathbb{T}}=\mathbb{Z}$ 上の $\frac12\delta_{0}+\frac14(\delta_{2}+\delta_{-2})$ である（点測度の和。$\mathbb{Z}$ は離散なので有限集合に集中する測度はラドン測度で、\ref{four:bp-bochner.2} から $\cos^{2}2\pi t$ は正定値）。$\psi$ については、二点 $0,\frac12$ と係数 $c=(1,1)$ をとると次のように和が負になるので、正定値でない。
$$
\psi(0)+\psi(\tfrac12)+\psi(-\tfrac12)+\psi(0)=\tfrac12-\tfrac32-\tfrac32+\tfrac12=-2<0 .
$$
（ボホナー測度があれば、それは $\{0\}$ に重み $-\frac12$ を置くことになる。）
:::

::: problem ★★ 標準：絶対値が最大になる点と周期性 {#four:ex-bp-2}
$\varphi$ を連続な正定値関数、$\nu$ をボホナー測度、$\varphi(e)>0$ とする。
1. $|\varphi(x_{0})|=\varphi(e)$ なら、$c\defeq\varphi(x_{0})/\varphi(e)$ について $\nu$ に関してほとんどすべての $\xi$ で $\xi(x_{0})=c$ で、すべての $x$ で $\varphi(xx_{0})=c\varphi(x)$ であることを示せ。
2. $H\defeq\{x:\varphi(x)=\varphi(e)\}$ は閉部分群で、$\varphi$ は $H$ の剰余類の上で一定、$\nu$ は $\Lambda\defeq\{\xi:\xi(h)=1\ (\forall h\in H)\}$ の外で $0$ であることを示せ。
3. $\mathbb{R}$ 上の $\varphi(x)\defeq\frac{2+\cos2\pi x}{3}$ で $H$, $\nu$, $\Lambda$ を求めよ。
:::

::: solution
**1.** 仮定から $|c|=1$ である。$\xi\mapsto\xi(x_{0})$ は連続（\ref{four:bp-measure-transform} の Step 1）で、\ref{four:bp-bochner.1} から
$$
\int|\xi(x_{0})-c|^{2}d\nu=2\nu(\hat G)-2\operatorname{Re}\Bigl(\bar c\int\xi(x_{0})\,d\nu\Bigr)=2\varphi(e)-2\operatorname{Re}(\bar c\varphi(x_{0}))=0
$$
ここで $\bar c\varphi(x_{0})=|\varphi(x_{0})|^{2}/\varphi(e)=\varphi(e)$ を使った。よって $\nu$-a.e. で $\xi(x_{0})=c$ であり、$\varphi(xx_{0})=\int\xi(x)\xi(x_{0})\,d\nu=c\varphi(x)$ となる。

**2.** $\varphi$ は連続なので $H$ は閉であり、明らかに $e\in H$ である。$x_{0},x_{1}\in H$ なら、1（$c=1$）から $\varphi(x_{1}x_{0})=\varphi(x_{1})=\varphi(e)$ であり、\ref{four:bp-pd-basic.1} から $\varphi(x_{0}^{-1})=\overline{\varphi(x_{0})}=\varphi(e)$ である。よって $H$ は部分群である。剰余類の上で一定なのは、1 の $\varphi(xh)=\varphi(x)$（$h\in H$）による。$\hat G\setminus\Lambda=\bigcup_{h\in H}\{\xi:\xi(h)\ne1\}$ は開集合の和で、各々は 1 から $\nu$ 零集合である。\ref{four:ex-rm-2.1} と同じく、内部正則性からこの和も $\nu$ 零集合である。

**3.** $\nu\defeq\frac23\delta_{0}+\frac16(\delta_{1}+\delta_{-1})$ とおくと、$\cos2\pi x=\frac12(e^{2\pi ix}+e^{-2\pi ix})$ から $\varphi=\int\xi_{y}\,d\nu(y)$ なので、\ref{four:bp-bochner.2} から $\varphi$ は正定値で、一意性からこれがボホナー測度である。$\varphi(x)=1\iff\cos2\pi x=1\iff x\in\mathbb{Z}$ なので $H=\mathbb{Z}$、$\Lambda=\{y:e^{2\pi iny}=1\ (\forall n\in\mathbb{Z})\}=\mathbb{Z}$ であり、$\nu$ は確かに $\Lambda$ に集中する。（\ref{four:ex-bp-1.1} の $\varphi$ では、$x\ne0$ なら $|\sin\pi x|<\pi|x|$ であることから $H=\{0\}$, $\Lambda=\mathbb{R}$ で、制約はない。）
:::

## 反転公式とプランシュレルの定理 {#four:sec-il-exercises}

対応するページ：\ref{four:page-inversion-plancherel-lca}

::: problem ★ 基本：プランシュレルの定理による和と積分の計算 {#four:ex-il-1}
双対測度は \ref{four:bp-examples} のものを使う。
1. $\mathbb{R}$ で $\int_{\mathbb{R}}\bigl(\frac{\sin\pi y}{\pi y}\bigr)^{2}dy=1$, $\int_{\mathbb{R}}\bigl(\frac{\sin\pi y}{\pi y}\bigr)^{4}dy=\frac23$ を示せ。
2. $\mathbb{Z}/n$（数え上げ測度）で $f\defeq\mathbf{1}_{\{0,1,\dots,m-1\}}$（$1\le m\le n$）に使い、$\sum_{k=1}^{n-1}\frac{\sin^{2}(\pi km/n)}{\sin^{2}(\pi k/n)}=m(n-m)$ を示せ。
3. $\mathbb{T}$ で $\varphi(t)\defeq1-2|t|$（$|t|\le\frac12$）に使い、$\sum_{n\text{ 奇数},n>0}n^{-4}=\frac{\pi^{4}}{96}$ を示せ。
:::

::: solution
**1.** \ref{four:bp-examples.1} から双対測度は $dy$ である。$\mathbf{1}_{[0,1]}\in L^{1}\cap L^{2}$ の変換は $\frac{1-e^{-2\pi iy}}{2\pi iy}$ で、その絶対値は $\bigl|\frac{\sin\pi y}{\pi y}\bigr|$（$|1-e^{-i\alpha}|=2|\sin\frac\alpha2|$）。よって \ref{four:bp-plancherel.1} から、積分は $\|\mathbf{1}_{[0,1]}\|_{2}^{2}=1$ に等しい。$\tau(x)\defeq\max(1-|x|,0)$ の変換は $\bigl(\frac{\sin\pi y}{\pi y}\bigr)^{2}$（\ref{four:ex-lc-1.2}）なので、同じく積分は $\|\tau\|_{2}^{2}=2\int_{0}^{1}(1-x)^{2}dx=\frac23$ に等しい。

**2.** \ref{four:bp-examples.3} から双対測度は各点に重み $\frac1n$ を置く測度である。$\omega\defeq e^{2\pi i/n}$ とおく。$k\ne0$ なら $\hat f(\xi_{k})=\sum_{j<m}\omega^{-kj}=\frac{1-\omega^{-km}}{1-\omega^{-k}}$ であり、$|1-\omega^{-l}|=2|\sin\frac{\pi l}{n}|$ から $|\hat f(\xi_{k})|^{2}=\frac{\sin^{2}(\pi km/n)}{\sin^{2}(\pi k/n)}$ である。また $\hat f(\xi_{0})=m$ である。よって \ref{four:bp-plancherel.1} から $m=\|f\|_{2}^{2}=\frac1n\bigl(m^{2}+\sum_{k=1}^{n-1}|\hat f(\xi_{k})|^{2}\bigr)$ となり、整理すると主張を得る。

**3.** \ref{four:bp-examples.2} から双対測度は $\mathbb{Z}$ の数え上げ測度である。直接計算すると $\hat\varphi(0)=\frac12$ であり、$n\ne0$ なら $\varphi$ が偶関数であることと部分積分から次を得る。
$$
\hat\varphi(n)=2\int_{0}^{1/2}(1-2t)\cos2\pi nt\,dt=\frac{2}{\pi n}\int_{0}^{1/2}\sin2\pi nt\,dt=\frac{1-(-1)^{n}}{\pi^{2}n^{2}}.
$$
$\|\varphi\|_{2}^{2}=2\int_{0}^{1/2}(1-2t)^{2}dt=\frac13$ なので、\ref{four:bp-plancherel.1} から $\frac13=\frac14+2\sum_{n\text{ 奇数}>0}\frac{4}{\pi^{4}n^{4}}$ となり、これを解くと主張を得る。（$\hat\varphi\ge0$, $\sum\hat\varphi<\infty$ なので、反転公式の $t=0$ から $\sum_{n\text{ 奇数}>0}n^{-2}=\frac{\pi^{2}}{8}$ も出る。）
:::

::: problem ★★ 標準：L² での畳み込み定理 {#four:ex-il-2}
$f,g\in L^{2}(G)$ とし、$f*g$ を \ref{four:ex-ga-2.2} の連続関数 $F$ とする。
1. すべての $x$ で $f*g(x)=\int_{\hat G}(\mathcal{F}f)(\xi)(\mathcal{F}g)(\xi)\xi(x)\,d\xi$ を示せ。
2. $f*g\equiv0$ と、$\hat G$ 上ほとんどいたるところ $(\mathcal{F}f)(\mathcal{F}g)=0$ が同値であることを示せ。
3. $\mathbb{R}$ で $f(x)\defeq\frac12e^{\pi ix}\bigl(\frac{\sin(\pi x/2)}{\pi x/2}\bigr)^{2}$, $g(x)\defeq e^{4\pi ix}f(x)$ とすると、$f,g\ne0$ だが $f*g\equiv0$ であることを示せ。
:::

::: solution
**Step 1.** 【主張：$f,g\in L^{1}\cap L^{2}$ なら 1 が成り立つ】 $h\defeq g^{*}$（$h(y)=\overline{g(y^{-1})}$）とおくと $g(y^{-1}x)=\overline{L_{x}h(y)}$ なので $f*g(x)=\langle f,L_{x}h\rangle$ である。\ref{four:lc-fourier-basic.3} と \ref{four:bp-fourier-dense.1} から $\widehat{L_{x}h}(\xi)=\overline{\xi(x)}\,\overline{\hat g(\xi)}$ である。$L_{x}h\in L^{1}\cap L^{2}$ なので、\ref{four:bp-plancherel.2} から次を得る。
$$
f*g(x)=\langle\hat f,\widehat{L_{x}h}\rangle=\int\hat f(\xi)\hat g(\xi)\xi(x)\,d\xi .
$$

**Step 2.** 【主張：1】 両辺は $(f,g)$ について双線形で、左辺は \ref{four:ex-ga-2.2}、右辺はコーシー–シュワルツの不等式と $\|\mathcal{F}f\|_{2}=\|f\|_{2}$ から、どちらも絶対値が $\|f\|_{2}\|g\|_{2}$ 以下（$x$ によらない）。$L^{1}\cap L^{2}\supset C_{c}(G)$ は $L^{2}$ で稠密（\ref{four:rm-cc-dense}）なので、Step 1 が極限で保たれる。

**Step 3.** 【主張：2】 $k\defeq(\mathcal{F}f)(\mathcal{F}g)$ とおくと、コーシー–シュワルツの不等式から $k\in L^{1}(\hat G)$ である。1 は $f*g=\check k$（\ref{four:bp-measure-transform}、$\lambda=d\xi$）と読めるので、\ref{four:bp-measure-transform.3} から、$f*g\equiv0$ なら $k=0$ a.e. である。逆は 1 から従う。

**Step 4.** 【主張：3】 $\tau_{1}(y)\defeq\max(1-|2y-1|,0)$（$[0,1]$ 上の三角形）とおく。$y=\frac{1+u}{2}$ と置き換えると、\ref{four:ex-lc-1.2} の計算から $\int\tau_{1}(y)e^{2\pi ixy}dy=\frac12e^{\pi ix}\int_{-1}^{1}(1-|u|)e^{\pi ixu}du=f(x)$ となる。$\tau_{1}$ は連続で可積分、その変換 $\hat\tau_{1}(\xi)=f(-\xi)$ も可積分なので、\ref{four:inversion-theorem.1} から $\tau_{1}(y)=\int f(-\xi)e^{2\pi iy\xi}d\xi=\hat f(y)$ である。\ref{four:transform-basic.2} から $\hat g=\tau_{1}(\cdot-2)$ であり、台 $[0,1]$ と $[2,3]$ は交わらないので $\hat f\hat g=0$ である。$f,g\in L^{1}\cap L^{2}$ では $\mathcal{F}f=\hat f$（\ref{four:bp-examples.1}）なので、2 から $f*g\equiv0$ である。
:::

## ポンチャーギンの双対定理 {#four:sec-pd-exercises}

対応するページ：\ref{four:page-pontryagin-duality}

::: problem ★ 基本：消去群と剰余群の双対の計算 {#four:ex-pd-1}
\ref{four:ex-lc-1}・\ref{four:lc-basic-duals} の同一視を使い、次の $G,H$ について $H^{\perp}$、$\widehat{G/H}\cong H^{\perp}$ の対応、$\{x:\xi(x)=1\ (\forall\xi\in H^{\perp})\}=H$ を確かめよ。
1. $G=\mathbb{Z}/12$, $H=\{0,4,8\}$。
2. $G=\mathbb{T}$, $H=\{j/n+\mathbb{Z}:j=0,\dots,n-1\}$。
3. $G=\mathbb{R}^{2}$（$\xi_{y}(x)=e^{2\pi ix\cdot y}$）, $H=\{(s,\alpha s):s\in\mathbb{R}\}$。
:::

::: solution
**1.** $\omega\defeq e^{2\pi i/12}$ とおく。$\xi_{k}\in H^{\perp}\iff\omega^{4k}=1\iff3\mid k$ なので、$H^{\perp}=\{\xi_{0},\xi_{3},\xi_{6},\xi_{9}\}$ である。$G/H\cong\mathbb{Z}/4$（$m\mapsto m\bmod4$）の\term[指標]{four:lc-character} $\chi_{l}(m)=i^{lm}$ について $Q(\chi_{l})(m)=i^{lm}=\omega^{3lm}$、すなわち $Q(\chi_{l})=\xi_{3l}$ である。最後に、$\xi_{3l}(m)=1\ (\forall l)\iff12\mid3m\iff m\in H$ であり、$H^{\perp}$ の消去群は $H$ に一致する。

**2.** $\xi_{k}\in H^{\perp}\iff e^{2\pi ikj/n}=1\ (\forall j)\iff n\mid k$ なので、$H^{\perp}=n\mathbb{Z}$ である。$t\mapsto nt$ は核 $H$ の $\mathbb{T}$ から $\mathbb{T}$ への連続な全射準同型で、\ref{top:quotient-universal} から連続な全単射 $G/H\to\mathbb{T}$ を引き起こし、コンパクトからハウスドルフへなので同相。この同一視で $\chi_{l}=\xi_{l}$ に対して $Q(\chi_{l})(t)=e^{2\pi ilnt}$、すなわち $Q(\chi_{l})=\xi_{nl}$ である。最後に、$e^{2\pi inlt}=1\ (\forall l)\iff nt\in\mathbb{Z}\iff t\in H$ である。

**3.** $\xi_{y}\in H^{\perp}\iff e^{2\pi is(y_{1}+\alpha y_{2})}=1\ (\forall s)\iff y_{1}+\alpha y_{2}=0$ である（$c\defeq y_{1}+\alpha y_{2}\ne0$ なら $s=\frac{1}{2c}$ とおくと値が $-1$ になる）。よって $H^{\perp}=\{(-\alpha u,u):u\in\mathbb{R}\}$ であり、同じ理由で $x\in(H^{\perp})^{\perp}\iff u(x_{2}-\alpha x_{1})\in\mathbb{Z}\ (\forall u)\iff x_{2}=\alpha x_{1}$ となる。$G/H\cong\mathbb{R}$（$x\mapsto x_{2}-\alpha x_{1}$）の\term[指標]{four:lc-character} $e^{2\pi iu(x_{2}-\alpha x_{1})}$ が、$Q$ により $\xi_{(-\alpha u,u)}$ に対応する。
:::

::: problem ★★ 標準：クロネッカーの稠密性定理 {#four:ex-pd-2}
1. 部分群 $H\subset G$（閉とは限らない）について $H^{\perp}=\overline{H}^{\perp}$ で、$\overline{H}=\{x:\xi(x)=1\ (\forall\xi\in H^{\perp})\}$ を示せ。とくに $H$ が稠密 $\iff H^{\perp}=\{1\}$。
2. $\alpha\in\mathbb{R}^{d}$ について、$\{n\alpha+\mathbb{Z}^{d}:n\in\mathbb{Z}\}$ が $\mathbb{T}^{d}$ で稠密であることと、$1,\alpha_{1},\dots,\alpha_{d}$ が $\mathbb{Q}$ 上一次独立であることが同値であることを示せ。
3. $\alpha=(\sqrt2,\sqrt3)$ では稠密、$\alpha=(\sqrt2,2\sqrt2)$ では閉包が $\{t:2t_{1}-t_{2}\in\mathbb{Z}\}$ であることを示せ。
:::

::: solution
**1.** $\xi$ は連続なので $\{x:\xi(x)=1\}$ は閉で、$H$ を含めば $\overline{H}$ も含む。よって $H^{\perp}=\overline{H}^{\perp}$ である。$(x,y)\mapsto xy^{-1}$ の連続性（\ref{top:topological-group}）から $\overline{H}$ は閉部分群なので、\ref{four:pd-quotient-dual.3} を $\overline{H}$ に使うと $\overline{H}=\{x:\xi(x)=1\ (\forall\xi\in\overline{H}^{\perp})\}=\{x:\xi(x)=1\ (\forall\xi\in H^{\perp})\}$ を得る。とくに $H^{\perp}=\{1\}$ なら $\overline{H}=G$ であり、逆に $\overline{H}=G$ なら $H^{\perp}=G^{\perp}=\{1\}$ である。

**2.** \ref{four:lc-products} と \ref{four:lc-basic-duals.2} から $\widehat{\mathbb{T}^{d}}=\{\xi_{k}:k\in\mathbb{Z}^{d}\}$, $\xi_{k}(t)=e^{2\pi ik\cdot t}$ である。$H$ を問題の部分群とすると $\xi_{k}\in H^{\perp}\iff e^{2\pi ink\cdot\alpha}=1\ (\forall n)\iff k\cdot\alpha\in\mathbb{Z}$ である。$k\ne0$ かつ $k\cdot\alpha=k_{0}\in\mathbb{Z}$ なら、これは自明でない一次関係 $k_{0}\cdot1-\sum k_{i}\alpha_{i}=0$ を与え、逆に自明でない有理係数の関係は分母を払うと $k\cdot\alpha\in\mathbb{Z}$, $k\ne0$ を与える（$k=0$ なら定数項も $0$）。1 から主張を得る。

**3.** 有理数 $a,b,c$ について $a+b\sqrt2+c\sqrt3=0$ と仮定する。$(a+b\sqrt2)^{2}=3c^{2}$ から $2ab\sqrt2$ が有理数となり、$\sqrt2$ は無理数なので $ab=0$ である。$b=0$ の場合、$a=-c\sqrt3$ と $\sqrt3$ の無理性から $a=c=0$ である。$a=0$ の場合、$2b^{2}=3c^{2}$ であり、$c\ne0$ なら $|b/c|=\sqrt{3/2}$ が無理数であることに反するので $b=c=0$ である。よって $1,\sqrt2,\sqrt3$ は一次独立で、2 から稠密である。$\alpha=(\sqrt2,2\sqrt2)$ では $k\cdot\alpha=(k_{1}+2k_{2})\sqrt2\in\mathbb{Z}\iff k_{1}+2k_{2}=0$ なので、$H^{\perp}=\{\xi_{m(2,-1)}:m\in\mathbb{Z}\}$ である。よって 1 から $\overline{H}=\{t:e^{2\pi im(2t_{1}-t_{2})}=1\ (\forall m)\}=\{t:2t_{1}-t_{2}\in\mathbb{Z}\}$ となる。
:::

::: problem ★★★ 発展：離散な ℚ の双対群の構造 {#four:ex-pd-3}
$\Gamma\defeq\hat{\mathbb{Q}}$（$\mathbb{Q}$ は離散）、$j\colon\mathbb{R}\to\Gamma$ を \ref{four:ex-lc-1.3} のものとする。
1. $j(\mathbb{R})$ は $\Gamma$ で稠密で、$\Gamma$ は連結なコンパクト群であることを示せ。
2. $K\defeq\{\xi\in\Gamma:\xi(1)=1\}$ は $\widehat{\mathbb{Q}/\mathbb{Z}}$ と同型な閉部分群で、$K\cap j(\mathbb{R})=j(\mathbb{Z})$ は可算、$K$ は非可算であることを示せ。とくに $j$ は全射でない。
:::

::: solution
**Step 1.** 【主張：$j(\mathbb{R})^{\perp}=\{1\}$（$\hat\Gamma$ の中で）】 \ref{four:pd-duality} から $\hat\Gamma$ の元は $\alpha(q)$（$q\in\mathbb{Q}$）の形で、$\alpha(q)(j(y))=j(y)(q)=e^{2\pi iqy}$ である。これがすべての $y$ で $1$ なら、$q\ne0$ のとき $y=\frac{1}{2q}$ とおくと値が $-1$ になるので、$q=0$ である。

**Step 2.** 【主張：1】 Step 1 と \ref{four:ex-pd-2.1}（群 $\Gamma$ に使う）から $j(\mathbb{R})$ は稠密である。$\Gamma$ はコンパクトである（\ref{four:lc-compact-discrete.2}）。$j(\mathbb{R})$ は連結な $\mathbb{R}$ の連続像なので連結で（\ref{top:connected-preservation.1}）、その閉包 $\Gamma$ も連結（\ref{top:connected-preservation.3}）。

**Step 3.** 【主張：2 の前半】 $K=\mathbb{Z}^{\perp}$ は閉部分群（\ref{four:pd-quotient-dual.1}）で、\ref{four:pd-quotient-dual.2} から $\widehat{\mathbb{Q}/\mathbb{Z}}\cong K$ である。$j(y)(1)=e^{2\pi iy}=1\iff y\in\mathbb{Z}$ なので、$K\cap j(\mathbb{R})=j(\mathbb{Z})$ であり、これは可算である。

**Step 4.** 【主張：$K$ は非可算】 \ref{four:ex-lc-1.3} の $\Sigma$ で、$K$ は $z_{1}=1$ の列に対応する。$b=(b_{k})_{k\ge2}\in\{0,1\}^{\{2,3,\dots\}}$ について、$z_{1}\defeq1$ とし、$z_{k-1}=e^{2\pi i\theta}$（$\theta\in[0,1)$）から $z_{k}\defeq e^{2\pi i(\theta+b_{k})/k}$ と順に定めると $z_{k}^{k}=z_{k-1}$ が成り立つ。$b\ne b'$ について最初に異なる番号を $k$ とすると、$z_{k-1}=z'_{k-1}$ なので $z_{k}/z'_{k}=e^{\pm2\pi i/k}\ne1$ である。よって $\{0,1\}^{\{2,3,\dots\}}$ から $K$ への単射があり、$K$ は非可算。Step 3 から $K\not\subset j(\mathbb{R})$ であり、$j$ は全射でない。

$\Gamma$ は、稠密な 1 径数部分群 $j(\mathbb{R})$ をもつ連結なコンパクト群で（ソレノイドと呼ばれる）、$\mathbb{T}$ と違って $j$ は全射にならない。
:::
