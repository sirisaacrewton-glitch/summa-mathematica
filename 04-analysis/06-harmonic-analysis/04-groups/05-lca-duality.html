# 局所コンパクト可換群の双対群 {#four:page-lca-duality keywords="Pontryagin dual group, characters of locally compact abelian groups, compact-open topology, complex homomorphisms of L^1(G), Gelfand transform, Fourier transform on LCA groups, Riemann-Lebesgue lemma, 双対群, 指標, 局所コンパクト可換群, フーリエ変換"}

局所コンパクト可換群 $G$ の**指標**（$G$ から円周への連続準同型）の全体 $\hat G$ は、コンパクト開位相でまた局所コンパクト可換群になる。$\mathbb{R}$ の指標 $x\mapsto e^{2\pi ixy}$ や円周の指標 $x\mapsto e^{2\pi inx}$ はフーリエ変換・フーリエ係数（\ref{four:fourier-transform}, \ref{four:fourier-coefficients}）の核であり、一般の $G$ でも $\hat f(\xi)=\int f\overline{\xi}\,d\mu$ がフーリエ変換になる。このページでは、群環 $L^{1}(G)$（\ref{four:ga-group-algebra}）の $0$ でない乗法的線形汎関数がちょうど指標の積分であることを示し、それを使って $\hat G$ の局所コンパクト性と $\hat f$ が無限遠で $0$ になることを導く。ゲルファント理論は使わない。

## 記法と定義の確認 {#four:sec-lc-notation}

::: notation
- このページでは $G$ は**局所コンパクト・ハウスドルフな可換位相群**（\ref{top:topological-group}）で、積は $xy$、単位元は $e$ と書く（$\mathbb{R}$, $\mathbb{Z}$ などの例では加法で書く）。$\mu$ は固定したハール測度（\ref{four:hm-haar-measure}）。$G$ は単模（\ref{four:hm-unimodular-examples.1}）なので $\Delta=1$。
- $L_{s}f(x)=f(s^{-1}x)$, $C_{c}(G)$, $L^{1}(G)$, 畳み込み $f*g$, 対合 $f^{*}(x)=\overline{f(x^{-1})}$ は前のページ（\ref{four:ga-convolution}, \ref{four:ga-involution}）のとおり。$L^{1}(G)$ は可換なバナッハ $*$-環である（\ref{four:ga-group-algebra.1}・\ref{four:ga-group-algebra.2}）。
- $S^{1}\defeq\{z\in\mathbb{C}:|z|=1\}$（乗法群）。円周 $\mathbb{T}=\mathbb{R}/\mathbb{Z}$（\ref{four:hm-examples.2}）は $t+\mathbb{Z}\mapsto e^{2\pi it}$ で $S^{1}$ と位相群として同型なので、適宜同一視する。
- コンパクト開位相は \ref{top:compact-open-topology}。$S^{1}$ は距離空間なので、\ref{top:compact-open-uniform-on-compacta} から、コンパクトな $K\subset G$ と $\varepsilon>0$ についての $B_{K}(\xi,\varepsilon)\defeq\{\eta:\sup_{x\in K}|\eta(x)-\xi(x)|<\varepsilon\}$ が $\xi$ の基本近傍系をなす。$B_{K}(\xi,\varepsilon)$ は開集合でもある（$\eta\in B_{K}(\xi,\varepsilon)$ なら $r\defeq\sup_{K}|\eta-\xi|<\varepsilon$ は最大値として達成され、三角不等式から $B_{K}(\eta,\varepsilon-r)\subset B_{K}(\xi,\varepsilon)$）。
- ノルム空間の双対 $X^{*}$ と汎弱位相は \ref{fa:weak-topology.2}、閉単位球のコンパクト性は \ref{fa:banach-alaoglu}、単位的バナッハ環とスペクトルは \ref{fa:banach-algebra}, \ref{fa:spectrum}。
- **選択公理**：\ref{four:rm-cc-dense}・\ref{four:ga-translation-continuity} を通じて従属選択公理（DC）を使う。\ref{four:lc-dual-topology} の局所コンパクト性と \ref{four:lc-compact-discrete.2} では \ref{fa:banach-alaoglu} を通じて \ref{top:tychonoff} を使う（因子はコンパクト・ハウスドルフなので、超フィルター補題で足りる：\ref{top:tychonoff-hausdorff}）。それ以外に無限個の選択はしない。
:::

## 指標と双対群 {#four:sec-lc-characters}

::: definition 指標と双対群 {#four:lc-character keywords="character of a locally compact abelian group, dual group, Pontryagin dual, compact-open topology" index="指標（局所コンパクト可換群）|しひょうきょくしょこんぱくとかかんぐん, 双対群（局所コンパクト可換群）|そうついぐんきょくしょこんぱくとかかんぐん"}
連続な群準同型 $\xi\colon G\to S^{1}$ を $G$ の**指標**といい、その全体を $\hat G$ と書く。値ごとの積 $(\xi\eta)(x)\defeq\xi(x)\eta(x)$ で $\hat G$ は可換群になる（単位元は定数 $1$、逆元は $\overline{\xi}$）。これにコンパクト開位相を入れたものを $G$ の**双対群**という。
:::

::: intuition
指標は、群を円周の上で「回転」として表す一番簡単な方法である。指標を全部集めるとまた群になり、コンパクト集合の上で一様に近いものを近いとみて位相を入れる。
:::

$|\xi(x)|=1$ なので $\overline{\xi(x)}=\xi(x)^{-1}=\xi(x^{-1})$。定数 $1$ を**自明な指標**という。

## L¹(G) の複素準同型 {#four:sec-lc-homomorphisms}

::: lemma 複素準同型の有界性 {#four:lc-homomorphism-bound keywords="complex homomorphisms of L^1(G) are bounded with norm at most 1" index="複素準同型|ふくそじゅんどうけい"}
$0$ でない線形写像 $h\colon L^{1}(G)\to\mathbb{C}$ で $h(f*g)=h(f)h(g)$ を満たすものを $L^{1}(G)$ の**複素準同型**といい、その全体を $\mathcal{H}(G)$ と書く。$h\in\mathcal{H}(G)$ なら、すべての $f$ で $|h(f)|\le\|f\|_{1}$。とくに $\mathcal{H}(G)$ は $L^{1}(G)^{*}$ の閉単位球 $B^{*}$ に含まれる。
:::

::: proof
$|h(f)|>\|f\|_{1}$ となる $f$ があったとし、$g\defeq f/h(f)$ とおくと $h(g)=1$, $\|g\|_{1}<1$ である。$g^{n}$ を $g$ の $n$ 個の畳み込みとすると $\|g^{n}\|_{1}\le\|g\|_{1}^{n}$（\ref{four:ga-convolution.1}）なので、$s\defeq\sum_{n\ge1}g^{n}$ は $L^{1}(G)$ で収束する（\ref{fa:absolute-series-completeness}）。$u\mapsto g*u$ は連続（$\|g*u\|_{1}\le\|g\|_{1}\|u\|_{1}$）なので $g*s=\sum_{n\ge2}g^{n}=s-g$ である。$h$ を施すと $h(g)h(s)=h(s)-h(g)$、すなわち $h(s)=h(s)-1$ となり矛盾する。

::: hypcheck
- **完備性**：級数 $s$ の収束に使った。完備でない環では偽：$C_{c}(\mathbb{R})$ 上の $h(f)\defeq\int f(x)e^{x}\,dx$ は乗法的だが（$e^{x}=e^{y}e^{x-y}$ と順序交換）、$[R,R+1]$ に台をもつ $f\ge0$ では $h(f)\ge e^{R}\|f\|_{1}$ である。
- **可換性・単位元**：使わなかった。$h$ の連続性も仮定していない。
:::
:::

::: proof 別証明（単位元の添加とスペクトル）
$A\defeq L^{1}(G)\times\mathbb{C}$ に $(f,a)(g,b)\defeq(f*g+ag+bf,\,ab)$, $\|(f,a)\|\defeq\|f\|_{1}+|a|$ を入れる。結合法則は畳み込みの結合性・双線形性から、また
$$
\|f*g+ag+bf\|_{1}+|ab|\le(\|f\|_{1}+|a|)(\|g\|_{1}+|b|)
$$
で、単位元 $(0,1)$ のノルムは $1$ なので、$A$ は単位的バナッハ環（\ref{fa:banach-algebra}）。$\tilde h(f,a)\defeq h(f)+a$ は $\tilde h((f,a)(g,b))=h(f)h(g)+ah(g)+bh(f)+ab=\tilde h(f,a)\tilde h(g,b)$ を満たす。$\lambda\defeq h(f)$ について $\lambda-(f,0)$ が逆元 $v$ をもてば $1=\tilde h(0,1)=\tilde h(v)\tilde h(\lambda-(f,0))=\tilde h(v)(\lambda-h(f))=0$ となり矛盾する。よって $\lambda\in\sigma((f,0))$（\ref{fa:spectrum}）で、\ref{fa:spectrum-nonempty-compact.1} から $|\lambda|\le\|(f,0)\|=\|f\|_{1}$ である。
:::

::: theorem 指標と複素準同型 {#four:lc-characters-homomorphisms keywords="complex homomorphisms of L^1(G) correspond bijectively to characters: h(f) = int f conj(xi) dmu" index="指標と複素準同型の対応|しひょうとふくそじゅんどうけいのたいおう"}
1. $\xi\in\hat G$ について $h_{\xi}(f)\defeq\int f(x)\overline{\xi(x)}\,d\mu(x)$ は $\mathcal{H}(G)$ に属し、$h_{\xi}(L_{x}f)=\overline{\xi(x)}\,h_{\xi}(f)$。
2. 各 $h\in\mathcal{H}(G)$ について、$h=h_{\xi}$ となる $\xi\in\hat G$ がただ一つある。
:::

::: intuition
$L^{1}(G)$ から複素数への「掛け算を保つ」線形写像は、どれもある指標で重みをつけて積分したものであり、指標が違えば写像も違う。
:::

::: proof
**Step 1.** 【主張：項目 1】 $\pi(x)v\defeq\overline{\xi(x)}v$ は $H=\mathbb{C}$ 上の強連続なユニタリ表現（\ref{four:ga-unitary-representation}）で、$\langle\pi(f)1,1\rangle=\int f\overline{\xi}\,d\mu=h_{\xi}(f)$ である。\ref{four:ga-integrated-representation.2} から $h_{\xi}(f*g)=h_{\xi}(f)h_{\xi}(g)$、\ref{four:ga-integrated-representation.3} から $h_{\xi}(L_{x}f)=\overline{\xi(x)}h_{\xi}(f)$ が成り立つ。$0$ でない $\theta\in C_{c}(G)^{+}$（\ref{four:rm-urysohn}）について $h_{\xi}(\theta\xi)=\int\theta\,d\mu>0$（\ref{four:hm-open-positive}）なので $h_{\xi}\ne0$ である。

**Step 2.** 以下 $h\in\mathcal{H}(G)$ とする。$h\ne0$ で、$h$ は連続（\ref{four:lc-homomorphism-bound}）、$C_{c}(G)$ は稠密（\ref{four:rm-cc-dense}）なので、$h(g)\ne0$ となる $g\in C_{c}(G)$ がある。$\varphi(x)\defeq h(L_{x}g)/h(g)$ とおく。【主張：すべての $f\in L^{1}(G)$, $x\in G$ で $h(L_{x}f)=\varphi(x)h(f)$】 \ref{four:hm-transport}（$y\mapsto xy$）から
$$
(L_{x}f)*g(z)=\int f(x^{-1}y)g(y^{-1}z)\,d\mu(y)=\int f(y)g(y^{-1}x^{-1}z)\,d\mu(y)=L_{x}(f*g)(z).
$$
可換性（\ref{four:ga-group-algebra.2}）から $f*(L_{x}g)=(L_{x}g)*f=L_{x}(g*f)=L_{x}(f*g)$ である。よって $h(L_{x}f)h(g)=h(L_{x}(f*g))=h(f)h(L_{x}g)=h(f)\varphi(x)h(g)$ であり、$h(g)$ で割ればよい。

**Step 3.** 【主張：$\overline{\varphi}\in\hat G$】 \ref{four:lc-homomorphism-bound} から $|\varphi(x)-\varphi(x')|\le\|L_{x}g-L_{x'}g\|_{1}/|h(g)|$ で、\ref{four:ga-translation-continuity.1} から $\varphi$ は連続。$\varphi(e)=1$ であり、Step 2 から $\varphi(xy)h(g)=h(L_{x}(L_{y}g))=\varphi(x)h(L_{y}g)=\varphi(x)\varphi(y)h(g)$ である。また $|\varphi(x)|\le\|L_{x}g\|_{1}/|h(g)|=\|g\|_{1}/|h(g)|\eqdef C$ である。すべての $n\in\mathbb{Z}$ で $|\varphi(x)|^{n}=|\varphi(x^{n})|\le C$ なので $|\varphi(x)|=1$ である。

**Step 4.** 【主張：$f\in C_{c}(G)$ なら $h(f)=\int f\varphi\,d\mu$】 $K\defeq\supp f$, $\varepsilon>0$ とする。\ref{four:ga-translation-continuity.1} から $u\in U$ なら $\|L_{u}g-g\|_{1}<\varepsilon$ となる $e$ の開近傍 $U$ をとり、$K$ を $y_{1}U,\dots,y_{m}U$ で覆い、\ref{four:rm-partition-of-unity} で $\theta_{i}\prec y_{i}U$, $K$ 上 $\sum_{i}\theta_{i}=1$ とする。$\theta_{i}(y)\ne0$ なら $y_{i}^{-1}y\in U$ なので
$$
\|L_{y}g-L_{y_{i}}g\|_{1}=\|L_{y_{i}^{-1}y}g-g\|_{1}<\varepsilon.
$$
$c_{i}\defeq\int f\theta_{i}\,d\mu$, $S\defeq\sum_{i}c_{i}L_{y_{i}}g$ とおく。\ref{four:ga-convolution.2} から各 $z$ で $f*g(z)-S(z)=\sum_{i}\int f(y)\theta_{i}(y)\bigl(g(y^{-1}z)-g(y_{i}^{-1}z)\bigr)d\mu(y)$ である。被積分関数は \ref{four:ga-measurability.4} から可測で、コンパクト集合の積の外で $0$ なので、\ref{four:ga-measurability.5} で $z$ についての積分と順序を交換して
$$
\|f*g-S\|_{1}\le\sum_{i}\int|f(y)|\theta_{i}(y)\|L_{y}g-L_{y_{i}}g\|_{1}\,d\mu(y)\le\varepsilon\|f\|_{1}.
$$
一方 Step 2 から $h(S)=h(g)\sum_{i}c_{i}\varphi(y_{i})$ であり、Step 3 の評価から $\bigl|\int f\varphi\,d\mu-\sum_{i}c_{i}\varphi(y_{i})\bigr|\le\sum_{i}\int|f|\theta_{i}|\varphi(y)-\varphi(y_{i})|\,d\mu\le\varepsilon\|f\|_{1}/|h(g)|$ である。よって
$$
\Bigl|h(f)h(g)-h(g)\int f\varphi\,d\mu\Bigr|\le|h(f*g-S)|+\Bigl|h(S)-h(g)\int f\varphi\,d\mu\Bigr|\le2\varepsilon\|f\|_{1}.
$$
$\varepsilon$ は任意であり $h(g)\ne0$ なので、$h(f)=\int f\varphi\,d\mu$ を得る。

**Step 5.** 【主張：項目 2】 $\xi\defeq\overline{\varphi}\in\hat G$ とおく。$h$ と $h_{\xi}$ はともに $L^{1}(G)$ 上連続（$|h_{\xi}(f)|\le\|f\|_{1}$）で、Step 4 から稠密な $C_{c}(G)$ 上で一致するので $h=h_{\xi}$ である。一意性：$h_{\xi}=h_{\eta}$ と仮定し $k\defeq\overline{\xi}-\overline{\eta}$ とおくと、$k$ は連続であり、すべての $f\in C_{c}(G)$ で $\int fk\,d\mu=0$ である。$\theta\in C_{c}(G)^{+}$ について $f=\theta\overline{k}$ とすると $\int\theta|k|^{2}\,d\mu=0$ となり、\ref{four:hm-open-positive} から $\theta|k|^{2}\equiv0$ である。どの点 $y$ にも $\theta(y)=1$ の $\theta$ がとれる（\ref{four:rm-urysohn}）ので $k\equiv0$ である。

::: hypcheck
- **$G$ の可換性**：Step 2 の $f*(L_{x}g)=L_{x}(f*g)$ に使った。Step 1（指標から複素準同型を作る向き）では使わない。
- **$h$ の\term[有界性]{fa:bounded-operator}**：Step 2 で $g$ を $C_{c}(G)$ からとるのと、Step 3 の連続性・有界性、Step 4 の評価に使った。
- **$\mu$ の σ 有限性**：使わない。$L^{1}$ の双対を $L^{\infty}$ と同一視せず、$\varphi$ を $h(L_{x}g)/h(g)$ で直接作った。
- **選択公理**：\ref{four:rm-cc-dense}・\ref{four:ga-translation-continuity} の DC。被覆と 1 の分割は有限個の選択。
:::
:::

::: supplement
**高い視点：点は「評価」である.** コンパクト・ハウスドルフ空間 $X$ の点 $p$ は、\term[連続関数]{top:continuous}の環 $C(X)$ から $\mathbb{C}$ への線形な環準同型 $f\mapsto f(p)$（点での評価）を与え、$C(X)$ から $\mathbb{C}$ への $0$ でない線形な環準同型はすべてこの形である（証明は次の段落）。つまり空間の点は、関数の環の「数への評価の仕方」として環から復元できる。この定理はその群環版で、$L^{1}(G)$ の数への評価の仕方（複素準同型）がちょうど指標で、評価の式が $h_{\xi}(f)=\hat f(\xi)$、すなわちフーリエ変換である。こうしてフーリエ変換は「$L^{1}(G)$ を、$\hat G$ という空間の上の関数の環として見直す写像」になる（\ref{four:lc-riemann-lebesgue} と、このページの最後の補足のゲルファント変換）。比喩でいえば、指標は $L^{1}(G)$ という楽器の固有の音高で、$\hat f(\xi)$ は音 $f$ のうちその音高がどれだけ鳴っているかを測る。畳み込み（二つの音を「掛け合わせる」こと）は、各音高ごとの強さの掛け算に変わる（\ref{four:lc-fourier-basic.2}）。

**$C(X)$ の環準同型は評価であることの証明.** $h$ を $C(X)$ から $\mathbb{C}$ への $0$ でない線形な環準同型とする。$h(f)\ne0$ の $f$ について $h(1)h(f)=h(f)$ なので $h(1)=1$ である。実数値の $u$ について $h(u)=a+ib$（$a,b$ は実数）とおき $b\ne0$ と仮定すると、$v\defeq(u-a)^{2}+b^{2}\ge b^{2}>0$ は $C(X)$ で可逆なので $h(v)h(1/v)=1$ から $h(v)\ne0$ だが、$h(v)=(h(u)-a)^{2}+b^{2}=(ib)^{2}+b^{2}=0$ となり矛盾する。ゆえに $h(u)$ は実数であり、実部と虚部に分けて $h(\bar f)=\overline{h(f)}$ が成り立つ。どの点 $p$ にも $f_{p}(p)\ne h(f_{p})$ となる $f_{p}$ があると仮定すると、$g_{p}\defeq f_{p}-h(f_{p})$ は $h(g_{p})=0$ かつ $g_{p}(p)\ne0$ を満たす。開集合 $\{g_{p}\ne0\}$ たちは $X$ を覆うので有限個 $p_{1},\dots,p_{m}$ で覆え、$g\defeq\sum_{i}g_{p_{i}}\overline{g_{p_{i}}}$ は至る所正なので可逆である。一方 $h(g)=\sum_{i}h(g_{p_{i}})\overline{h(g_{p_{i}})}=0$ であり、可逆元の像が $0$ になって矛盾する。ゆえにある $p$ ですべての $f$ について $h(f)=f(p)$ であり、コンパクト・ハウスドルフ空間の 2 点は連続関数で分けられる（\ref{four:rm-urysohn}）ので $p$ は一つに決まる。

**似た定理：ウィーナーの補題.** この見方のもっとも有名な応用として、「$\mathbb{T}$ 上の関数のフーリエ級数が絶対収束し、関数がどこでも $0$ でなければ、その逆数のフーリエ級数も絶対収束する」というウィーナーの補題がある。$\ell^{1}(\mathbb{Z})=L^{1}(\mathbb{Z})$ の単位元をもつ環としてのゲルファント理論（極大イデアルと複素準同型の対応）と、この定理（$\hat{\mathbb{Z}}=\mathbb{T}$、\ref{four:lc-basic-duals.1}）から従うことが知られている（ここでは証明しない。\see{four:absolutely-convergent}）。

**前提を変えると.** 1 は可換性を使わない（hypcheck）ので、非可換な $G$ でも連続準同型 $\xi\colon G\to S^{1}$ は $L^{1}(G)$ の複素準同型を与えるが、それは $G$ の交換子群の上で $1$ になる 1 次元の情報しか拾わない（このページの最後の補足の $S_{3}$ の例）。
:::

## フーリエ変換 {#four:sec-lc-fourier}

::: definition フーリエ変換 {#four:lc-fourier-transform keywords="Fourier transform on a locally compact abelian group, hat f(xi) = int f(x) conj(xi(x)) dmu(x), Gelfand transform of L^1(G)" index="フーリエ変換（局所コンパクト可換群）|ふーりえへんかんきょくしょこんぱくとかかんぐん, ゲルファント変換|げるふぁんとへんかん"}
$f\in L^{1}(G)$ について、$\hat G$ 上の関数
$$
\hat f(\xi)\defeq h_{\xi}(f)=\int_{G}f(x)\overline{\xi(x)}\,d\mu(x)
$$
を $f$ の**フーリエ変換**という（ハール測度の正規化に依存する）。
:::

::: proposition フーリエ変換の基本性質 {#four:lc-fourier-basic keywords="|hat f| <= ||f||_1, (f*g)^ = hat f hat g, translation becomes multiplication by a character" index="フーリエ変換の性質（局所コンパクト可換群）|ふーりえへんかんのせいしつきょくしょこんぱくとかかんぐん"}
$f,g\in L^{1}(G)$, $x\in G$, $\xi\in\hat G$ とする。
1. $|\hat f(\xi)|\le\|f\|_{1}$。
2. $\widehat{f*g}=\hat f\,\hat g$。
3. $\widehat{L_{x}f}(\xi)=\overline{\xi(x)}\hat f(\xi)$。
:::

::: proof
1 は $|\overline{\xi}|=1$ から。2・3 は \ref{four:lc-characters-homomorphisms.1}。
:::

## 双対群の位相 {#four:sec-lc-topology}

::: theorem 双対群は局所コンパクト可換群 {#four:lc-dual-topology keywords="the dual group is a locally compact Hausdorff abelian group; compact-open topology equals the weak-star topology of the complex homomorphisms of L^1(G)" index="双対群の局所コンパクト性|そうついぐんのきょくしょこんぱくとせい"}
1. $\hat G$ はハウスドルフな可換位相群である。
2. $\hat G$ のコンパクト開位相は、すべての $\hat f$（$f\in L^{1}(G)$）を連続にする最弱の位相と一致する。したがって $\Theta(\xi)\defeq h_{\xi}$ は $\hat G$ から $\mathcal{H}(G)$（$L^{1}(G)^{*}$ の汎弱位相の部分空間）への同相写像である。
3. $\hat G$ は局所コンパクトである。
:::

::: intuition
指標どうしの近さは、コンパクト集合上の値で測っても、あらゆる可積分関数との積分の値で測っても同じになる。後者の見方では指標の集合が単位球の一部に見え、単位球のコンパクト性から局所コンパクト性が出る。
:::

::: proof
**Step 1.** 【主張：項目 1】 $K$ 上で $|\xi\eta-\xi_{0}\eta_{0}|\le|\xi-\xi_{0}||\eta|+|\xi_{0}||\eta-\eta_{0}|=|\xi-\xi_{0}|+|\eta-\eta_{0}|$ なので、積は $B_{K}(\xi_{0},\varepsilon/2)\times B_{K}(\eta_{0},\varepsilon/2)$ を $B_{K}(\xi_{0}\eta_{0},\varepsilon)$ に写す。$|\overline{\xi}-\overline{\xi_{0}}|=|\xi-\xi_{0}|$ から逆元も連続である。$\xi(x)\ne\eta(x)$ なら $\varepsilon\defeq|\xi(x)-\eta(x)|/2$ について $B_{\{x\}}(\xi,\varepsilon)$ と $B_{\{x\}}(\eta,\varepsilon)$ は交わらない。

**Step 2.** 【主張：各 $\hat f$ はコンパクト開位相で連続】 $\varphi\in C_{c}(G)$, $K\defeq\supp\varphi$ なら $|\hat\varphi(\xi)-\hat\varphi(\xi_{0})|\le\int_{K}|\varphi||\xi-\xi_{0}|\,d\mu\le\|\varphi\|_{1}\sup_{K}|\xi-\xi_{0}|$ である。一般の $f$ では、\ref{four:rm-cc-dense} の $\varphi$ について $\hat G$ 全体で $|\hat f-\hat\varphi|\le\|f-\varphi\|_{1}$（\ref{four:lc-fourier-basic.1}）なので、$\hat f$ は連続関数の一様極限なので連続である。

**Step 3.** $\xi_{0}\in\hat G$, コンパクトな $K$, $\varepsilon>0$ をとる。\ref{four:lc-characters-homomorphisms.1} から $h_{\xi_{0}}\ne0$ なので、$\hat g(\xi_{0})\ne0$ の $g\in L^{1}(G)$ があり、$\eta\defeq\varepsilon|\hat g(\xi_{0})|/8$ とおく。【主張：有限個の $g_{1},\dots,g_{m}\in L^{1}(G)$ があり、$W\defeq\{\xi:|\hat g(\xi)-\hat g(\xi_{0})|<\eta,\ |\hat g_{i}(\xi)-\hat g_{i}(\xi_{0})|<\eta\ (\forall i)\}$ は $B_{K}(\xi_{0},\varepsilon)$ に含まれる】 $\{L_{x}g:x\in K\}$ は連続写像 $x\mapsto L_{x}g$（\ref{four:ga-translation-continuity.1}）によるコンパクト集合の像なのでコンパクトで、半径 $\eta$ の有限個の球 $B(L_{x_{i}}g,\eta)$ で覆える。$g_{i}\defeq L_{x_{i}}g$ とし、$\xi\in W$, $x\in K$, $\|L_{x}g-g_{i}\|_{1}<\eta$ とすると、\ref{four:lc-fourier-basic.3}・\ref{four:lc-fourier-basic.1} から
$$
\bigl|\overline{\xi(x)}\hat g(\xi)-\overline{\xi_{0}(x)}\hat g(\xi_{0})\bigr|=\bigl|\widehat{L_{x}g}(\xi)-\widehat{L_{x}g}(\xi_{0})\bigr|<\eta+\eta+\eta.
$$
よって $|\xi(x)-\xi_{0}(x)||\hat g(\xi_{0})|\le|\hat g(\xi_{0})-\hat g(\xi)|+3\eta<4\eta$、すなわち $\sup_{K}|\xi-\xi_{0}|\le\varepsilon/2<\varepsilon$ である。

**Step 4.** 【主張：項目 2】 すべての $\hat f$ を連続にする最弱の位相を $\mathcal{T}_{w}$、コンパクト開位相を $\mathcal{T}_{co}$ とする。Step 2 から $\mathcal{T}_{w}\subset\mathcal{T}_{co}$ である。$O\in\mathcal{T}_{co}$ と $\xi_{0}\in O$ について、$B_{K}(\xi_{0},\varepsilon)\subset O$ となる $K,\varepsilon$ があり（\ref{top:compact-open-uniform-on-compacta}）、Step 3 の $W\in\mathcal{T}_{w}$ は $\xi_{0}\in W\subset O$ を満たすので $O\in\mathcal{T}_{w}$ である。$\Theta$ は全単射（\ref{four:lc-characters-homomorphisms}）で、$\mathcal{H}(G)$ の汎弱位相は $h\mapsto h(f)$ たちによる始位相（\ref{fa:weak-topology.2}, \ref{top:initial-topology}）、$h_{\xi}(f)=\hat f(\xi)$ なので、$\Theta$ で引き戻すと $\mathcal{T}_{w}$ になる。

**Step 5.** 【主張：$\mathcal{H}_{0}\defeq\mathcal{H}(G)\cup\{0\}$ は汎弱位相でコンパクト】 \ref{four:lc-homomorphism-bound} から $\mathcal{H}_{0}=\{h\in B^{*}:h(f*g)=h(f)h(g)\ (\forall f,g)\}$ である。各条件は汎弱連続な関数 $h\mapsto h(f*g)-h(f)h(g)$ の零点集合なので $\mathcal{H}_{0}$ は閉集合で、\ref{fa:banach-alaoglu} の $B^{*}$ の閉集合としてコンパクト。

**Step 6.** 【主張：項目 3】 $\xi_{0}\in\hat G$ について $\hat f(\xi_{0})\ne0$ の $f$ をとり、$\delta\defeq|\hat f(\xi_{0})|/2$ とする。$C\defeq\{h\in\mathcal{H}_{0}:|h(f)|\ge\delta\}$ はコンパクト集合 $\mathcal{H}_{0}$ の閉集合なのでコンパクトで、$0\notin C$ なので $C\subset\mathcal{H}(G)$ である。2 から $\Theta^{-1}(C)=\{\xi:|\hat f(\xi)|\ge\delta\}$ はコンパクトで、$\xi_{0}$ の開近傍 $\{|\hat f|>\delta\}$ を含む。

::: hypcheck
- **$G$ の局所コンパクト性**：ハール測度と $L^{1}(G)$ の構成全体、Step 2・3 の \ref{four:rm-cc-dense}, \ref{four:ga-translation-continuity} に使った。
- **完備性・有界性**：Step 5 で $\mathcal{H}_{0}\subset B^{*}$ とするのに \ref{four:lc-homomorphism-bound} を使った。
- **選択公理**：Step 5 の \ref{fa:banach-alaoglu}（超フィルター補題で足りる）。Step 3 の有限被覆は有限個の選択。
:::
:::

::: supplement
**高い視点：二つの位相の一致.** 2 は、指標の近さを「群の側」から測る見方（コンパクト集合の上で値が一様に近い）と、「環の側」から測る見方（どの可積分関数で平均しても値が近い）が同じになることを言っている。後者は $L^{1}(G)$ の\term[双対空間]{fa:bounded-operator}の汎弱位相で、バナッハ–アラオグルの定理の舞台にのるので、3 の局所コンパクト性が「単位球のコンパクト性から $0$ という一点を除いたもの」として出てくる。比喩でいえば、$\hat G$ は単位球の中の複素準同型の集合 $\mathcal{H}_{0}$ から原点を抜いたもので、原点が「無限遠点」の役をする。実際 \ref{four:lc-riemann-lebesgue} の「無限遠で $0$」は、$\hat f$ を $\mathcal{H}_{0}$ 上の連続関数 $h\mapsto h(f)$ と見たときの原点での値が $0$ であることにほかならない。

**前提を変えると（群の位相を変える）.** 同じ群でも位相を変えると双対は大きく変わる。$\mathbb{R}$ に離散位相を入れた群 $\mathbb{R}_{d}$ の指標は、連続性の条件がなくなるのですべての準同型 $\mathbb{R}\to S^{1}$ で、$\hat{\mathbb{R}_{d}}$ は \ref{four:lc-compact-discrete.2} からコンパクトである。通常の指標 $\xi_{y}$ は $\hat{\mathbb{R}_{d}}$ の中で稠密になることが知られており、$\hat{\mathbb{R}_{d}}$ は $\mathbb{R}$ の**ボーア・コンパクト化**と呼ばれる（ここでは証明しない）。概周期関数の理論の舞台である。
:::

::: corollary リーマン–ルベーグの補題（局所コンパクト可換群） {#four:lc-riemann-lebesgue keywords="Riemann-Lebesgue lemma for LCA groups: hat f lies in C_0(dual group); the Fourier transform is a contractive algebra homomorphism L^1(G) -> C_0(hat G)" index="リーマン–ルベーグの補題（局所コンパクト可換群）|りーまんるべーぐのほだいきょくしょこんぱくとかかんぐん"}
$f\in L^{1}(G)$ なら $\hat f$ は $\hat G$ 上の連続関数で、各 $\varepsilon>0$ について $\{\xi:|\hat f(\xi)|\ge\varepsilon\}$ はコンパクト（無限遠で $0$）。したがって $f\mapsto\hat f$ は $L^{1}(G)$ から $C_{0}(\hat G)$（無限遠で $0$ になる連続関数の環、上限ノルム）への、ノルムを増やさない環準同型である。
:::

::: intuition
可積分関数のフーリエ変換は、指標が「遠くへ行く」につれて小さくなる。
:::

::: proof
連続性は \ref{four:lc-dual-topology} の Step 2。$\{h\in\mathcal{H}_{0}:|h(f)|\ge\varepsilon\}$ は Step 6 と同じ理由でコンパクトで $\mathcal{H}(G)$ に含まれ、$\Theta^{-1}$ による像が $\{|\hat f|\ge\varepsilon\}$。環準同型であることとノルムの評価は \ref{four:lc-fourier-basic.1}・\ref{four:lc-fourier-basic.2}。
:::

## 例 {#four:sec-lc-examples}

::: lemma 実数直線の指標 {#four:lc-real-characters keywords="continuous homomorphisms R -> S^1 are x -> e^{2 pi i x y}" index="実数直線の指標|じっすうちょくせんのしひょう"}
連続な準同型 $\chi\colon\mathbb{R}\to S^{1}$ には $\chi(x)=e^{2\pi ixy}$（$x\in\mathbb{R}$）となる $y\in\mathbb{R}$ がただ一つある。
:::

::: proof
**Step 1.** 【主張：$c\defeq\int_{0}^{\delta}\chi(t)\,dt\ne0$ となる $\delta>0$ がある】 $\chi(0)=1$ と連続性から、$|t|\le\delta$ で $|\chi(t)-1|<\frac12$ となる $\delta$ をとると $|c-\delta|\le\delta/2$ である。

**Step 2.** 【主張：$\chi$ は微分可能で $\chi'=a\chi$（$a\defeq(\chi(\delta)-1)/c$）】 $\Phi(u)\defeq\int_{0}^{u}\chi$ は（実部・虚部に \ref{calc:fundamental-theorem.1} を使って）微分可能で $\Phi'=\chi$ である。$\chi(x)c=\int_{0}^{\delta}\chi(x+t)\,dt=\Phi(x+\delta)-\Phi(x)$ なので $\chi$ は微分可能で、$\chi'(x)c=\chi(x+\delta)-\chi(x)=\chi(x)(\chi(\delta)-1)$ である。

**Step 3.** 【主張：結論】 $F(x)\defeq\chi(x)e^{-ax}$ は $F'=0$ なので \ref{calc:fundamental-theorem.2} から $F(x)=F(0)=1$、$\chi(x)=e^{ax}$ である。$|e^{ax}|=e^{x\operatorname{Re}a}=1$ がすべての $x$ で成り立つので $\operatorname{Re}a=0$、$a=2\pi iy$ である。$e^{2\pi ixy}=e^{2\pi ixy'}$ がすべての $x$ で成り立てば、$x=0$ で微分して $y=y'$ である。
:::

::: proposition コンパクト群と離散群の双対 {#four:lc-compact-discrete keywords="the dual of a compact group is discrete; the dual of a discrete group is compact" index="コンパクト群の双対は離散|こんぱくとぐんのそうついはりさん, 離散群の双対はコンパクト|りさんぐんのそうついはこんぱくと"}
1. $G$ がコンパクトなら $\hat G$ は離散である。
2. $G$ が離散なら $\hat G$ はコンパクトである。
:::

::: intuition
群が小さく閉じていれば指標はとびとびにしかなく、群がとびとびなら指標の全体は閉じた一塊になる。円周と整数がその典型である。
:::

::: proof
**1.** $z\in S^{1}\setminus\{1\}$ を $z=e^{i\theta}$（$0<|\theta|\le\pi$）と書き、$n|\theta|\ge\pi/3$ となる最小の $n\ge1$ をとると $\pi/3\le n|\theta|<\pi/3+\pi$ なので、$|z^{n}-1|=2|\sin(n\theta/2)|\ge1$ である。$\xi\ne\xi_{0}$ なら $\xi\overline{\xi_{0}}$ の値の全体は $S^{1}$ の部分群で、$1$ でない $z$ を含むので $z^{n}$ も含み $\sup_{G}|\xi-\xi_{0}|=\sup_{G}|\xi\overline{\xi_{0}}-1|\ge1$ である。$G$ 自身がコンパクトなので $B_{G}(\xi_{0},1)=\{\xi_{0}\}$ は開集合。

**2.** $\mu$ を数え上げ測度とする（\ref{four:hm-examples.3}）。$\delta_{e}$ は $L^{1}(G)$ の単位元（\ref{four:ga-group-algebra.3}）で、$h\in\mathcal{H}(G)$ について $h(f)\ne0$ の $f$ をとると $h(f)=h(\delta_{e})h(f)$ から $h(\delta_{e})=1$ である。よって $\mathcal{H}(G)=\{h\in\mathcal{H}_{0}:h(\delta_{e})=1\}$ は \ref{four:lc-dual-topology} の Step 5 のコンパクト集合 $\mathcal{H}_{0}$ の閉集合でコンパクト。\ref{four:lc-dual-topology.2} から $\hat G$ もコンパクト。
:::

::: theorem 整数・円周・実数直線の双対群 {#four:lc-basic-duals keywords="dual of Z is the circle T, dual of T is Z, dual of R is R; agreement with Fourier series and the Fourier transform" index="整数の双対群|せいすうのそうついぐん, 円周の双対群|えんしゅうのそうついぐん, 実数直線の双対群|じっすうちょくせんのそうついぐん"}
次の写像は位相群の同型である。
1. $S^{1}\cong\mathbb{T}\to\hat{\mathbb{Z}}$, $z\mapsto\xi_{z}$, $\xi_{z}(n)\defeq z^{n}$。
2. $\mathbb{Z}\to\hat{\mathbb{T}}$, $n\mapsto\xi_{n}$, $\xi_{n}(t+\mathbb{Z})\defeq e^{2\pi int}$。
3. $\mathbb{R}\to\hat{\mathbb{R}}$, $y\mapsto\xi_{y}$, $\xi_{y}(x)\defeq e^{2\pi ixy}$。

この同一視のもとで、$\mathbb{T}$ の正規化したハール測度と $\mathbb{R}$ のルベーグ測度（\ref{four:hm-examples.1}・\ref{four:hm-examples.2}）についての $\hat f$ は、それぞれフーリエ係数 $\hat f(n)$（\ref{four:fourier-coefficients}）とフーリエ変換 $\hat f(y)$（\ref{four:fourier-transform}、$d=1$）に一致する。
:::

::: intuition
整数の指標は円周の点で、円周の指標は整数で番号づけられ、実数直線の指標は実数で番号づけられる。フーリエ級数とフーリエ変換は、同じ一つの構成をこれらの群に当てはめたものである。
:::

::: proof
**Step 1.** 【主張：項目 1】 $\xi\in\hat{\mathbb{Z}}$ は $z\defeq\xi(1)$ から帰納的に $\xi(n)=z^{n}$（$n\in\mathbb{Z}$）と決まり、逆にどの $z\in S^{1}$ でも $\xi_{z}$ は（離散群の上なので連続な）指標。$\xi_{zw}=\xi_{z}\xi_{w}$ なので群同型。$\mathbb{Z}$ のコンパクト集合は有限集合 $F$ であり、$|z^{n}-z_{0}^{n}|\le|n||z-z_{0}|$ から $z\mapsto\xi_{z}$ は連続、$|z-z_{0}|=|\xi_{z}(1)-\xi_{z_{0}}(1)|$ から逆も連続。

**Step 2.** 【主張：項目 2】 商写像 $q\colon\mathbb{R}\to\mathbb{T}$ について、$\xi\in\hat{\mathbb{T}}$ なら $\xi\circ q$ は $\mathbb{R}$ の指標で、\ref{four:lc-real-characters} から $e^{2\pi ixy}$ の形。$q(1)=q(0)$ から $e^{2\pi iy}=1$、すなわち $y\in\mathbb{Z}$ である。逆に $x\mapsto e^{2\pi inx}$ は周期 $1$ なので $\mathbb{T}$ 上の連続関数を定める（\ref{top:quotient-universal}）。$n\mapsto\xi_{n}$ は単射（\ref{four:lc-real-characters} の一意性）な群同型で、$\mathbb{Z}$ も $\hat{\mathbb{T}}$（\ref{four:lc-compact-discrete.1}）も離散なので同相。

**Step 3.** 【主張：項目 3】 \ref{four:lc-real-characters} から $y\mapsto\xi_{y}$ は全単射な群準同型。$|e^{i\alpha}-1|\le|\alpha|$ から $\sup_{|x|\le R}|\xi_{y}-\xi_{y_{0}}|\le2\pi R|y-y_{0}|$ なので連続である。逆に $\delta>0$ と $R\defeq1/(2\delta)$ について、$t\defeq y-y_{0}$ が $|t|\ge\delta$ なら $x\defeq1/(2t)$ は $|x|\le R$ で $|\xi_{y}(x)-\xi_{y_{0}}(x)|=|e^{\pi i}-1|=2$ である。よって $B_{[-R,R]}(\xi_{y_{0}},2)\subset\{\xi_{y}:|y-y_{0}|<\delta\}$ で、逆写像も連続。

フーリエ変換の一致は定義を書き下すだけである：$\int_{\mathbb{T}}f(t)\overline{e^{2\pi int}}\,dt=\hat f(n)$, $\int_{\mathbb{R}}f(x)\overline{e^{2\pi ixy}}\,dx=\hat f(y)$ である。
:::

::: supplement
**高い視点：標本化と折り返し.** 1・2 は、信号処理の言葉で「時刻を整数に限ると周波数は $1$ を法としてしか意味をもたない」「周期 $1$ の信号の周波数は整数に限られる」ということである。整数の時刻でしか観測しないと、周波数 $y$ と $y+1$ の波 $e^{2\pi iny}$, $e^{2\pi in(y+1)}$ は区別できない（折り返し、エイリアシング）。一般に部分群 $\mathbb{Z}\subset\mathbb{R}$ に制限することと、双対の側で商 $\hat{\mathbb{R}}/\mathbb{Z}^{\perp}=\mathbb{R}/\mathbb{Z}$ をとることが対応し（\see{four:pd-quotient-dual} の補足）、周期化（商 $\mathbb{R}/\mathbb{Z}$ に移ること）と双対の側で部分群 $\mathbb{Z}$ に制限することが対応する。3 で $\mathbb{R}$ が自分自身と双対になるのは、$\mathbb{R}$ がどちらの操作もしていない「連続な時間・連続な周波数」の場合だからである。

**似た定理：線形代数の双対空間.** 有限次元ベクトル空間 $V$ は双対空間 $V^{*}=\operatorname{Hom}(V,\mathbb{C})$ と同じ次元をもつが、同型は基底の選び方による。指標 $\operatorname{Hom}(G,S^{1})$ はその群版で、$S^{1}$ が係数の体 $\mathbb{C}$ の役をする。有限可換群では $\hat G\cong G$ だが同型は選択による（\ref{four:lc-finite-groups}）ことも、$V\cong V^{*}$ が自然でないことと同じ現象であり、一方 $V\to V^{**}$ が自然な同型であることに当たるのが双対定理（\see{four:pd-duality}）である。$\mathbb{R}$ では、3 のように $\xi_{y}$ の $2\pi$ の入れ方を決めると同型 $\mathbb{R}\cong\hat{\mathbb{R}}$ が一つ決まるが、$e^{ixy}$ や $e^{2\pi icxy}$（$c\ne0$）でもよく、これも一つの選択である。
:::

::: example 整数の場合とフーリエ級数
$a\in L^{1}(\mathbb{Z})=\ell^{1}(\mathbb{Z})$（数え上げ測度）について $\hat a(\xi_{z})=\sum_{n}a_{n}z^{-n}$。$z=e^{2\pi it}$ とおくと $F(t)\defeq\sum_{n}a_{n}e^{-2\pi int}$ は一様収束する $\mathbb{T}$ 上の連続関数で、項別積分からそのフーリエ係数は $\hat F(n)=a_{-n}$ である。\ref{four:lc-riemann-lebesgue} は、$\mathbb{T}$ がコンパクトなのでここでは「$F$ が連続」というだけだが、$\mathbb{R}$ では \ref{four:transform-riemann-lebesgue} そのもの、$\hat{\mathbb{T}}=\mathbb{Z}$ では \ref{four:riemann-lebesgue}（$\hat f(n)\to0$）である。
:::

::: proposition 直積の双対 {#four:lc-products keywords="the dual of a product G_1 x G_2 is the product of the duals" index="直積の双対群|ちょくせきのそうついぐん"}
局所コンパクト・ハウスドルフな可換群 $G_{1},G_{2}$ について、$(\xi_{1},\xi_{2})\mapsto\xi_{1}\otimes\xi_{2}$, $(\xi_{1}\otimes\xi_{2})(x_{1},x_{2})\defeq\xi_{1}(x_{1})\xi_{2}(x_{2})$ は位相群の同型 $\hat G_{1}\times\hat G_{2}\to\widehat{G_{1}\times G_{2}}$ である。
:::

::: proof
準同型であることは定義から。$\xi\in\widehat{G_{1}\times G_{2}}$ について $\xi_{1}(x_{1})\defeq\xi(x_{1},e)$, $\xi_{2}(x_{2})\defeq\xi(e,x_{2})$ は指標で、$(x_{1},x_{2})=(x_{1},e)(e,x_{2})$ から $\xi=\xi_{1}\otimes\xi_{2}$ である。$\xi_{1}\otimes\xi_{2}$ の $G_{1}\times\{e\}$, $\{e\}\times G_{2}$ への制限が $\xi_{1}$, $\xi_{2}$ なので単射。連続性：コンパクトな $K\subset G_{1}\times G_{2}$ は射影の像 $K_{1},K_{2}$（コンパクト）の積に含まれ、\ref{four:lc-dual-topology} の Step 1 と同じ評価で
$$
\sup_{K}|\xi_{1}\otimes\xi_{2}-\eta_{1}\otimes\eta_{2}|\le\sup_{K_{1}}|\xi_{1}-\eta_{1}|+\sup_{K_{2}}|\xi_{2}-\eta_{2}|.
$$
逆写像の連続性：$\sup_{K_{1}}|\xi(\cdot,e)-\eta(\cdot,e)|$ はコンパクト集合 $K_{1}\times\{e\}$ 上の上限。
:::

\ref{four:lc-basic-duals.3} と合わせると $\widehat{\mathbb{R}^{n}}\cong\mathbb{R}^{n}$（$\xi_{y}(x)=e^{2\pi ix\cdot y}$）で、ルベーグ測度についての $\hat f$ は \ref{four:fourier-transform} と一致する。

::: example 有限可換群 {#four:lc-finite-groups keywords="dual of a finite abelian group; isomorphic but not canonically; discrete Fourier transform" index="有限可換群の双対群|ゆうげんかかんぐんのそうついぐん, 離散フーリエ変換|りさんふーりえへんかん"}
$G$ が有限なら $G$ は離散かつコンパクトなので、$\hat G$ も有限で離散（\ref{four:lc-compact-discrete}）。指標の値は 1 の冪根で、$\hat G$ は \ref{grp:dual-group} の指標群と同じものである。\ref{grp:dual-group-basic.3} から $\hat G\cong G$ だが、この同型は選択に依存する：$G=\mathbb{Z}/n\mathbb{Z}$ なら $\xi\mapsto\xi(1)$ で $\hat G$ は 1 の $n$ 乗根の群になり、$\mathbb{Z}/n\mathbb{Z}$ と同一視するには原始 $n$ 乗根 $\omega$ を一つ選んで $\xi_{k}(m)\defeq\omega^{km}$ とおく必要がある（$\omega$ を $\omega^{j}$（$\gcd(j,n)=1$）に替えると同型も変わる）。数え上げ測度について $\hat f(\xi_{k})=\sum_{m}f(m)\omega^{-km}$ は**離散フーリエ変換**である。
:::

::: supplement
**$p$ 進数.** $\mathbb{Q}_{p}$（\see{nt:page-p-adic}）は局所コンパクト可換群で、$x$ の $p$ 進展開の負の冪の部分を $\{x\}_{p}$ と書くと $\xi_{y}(x)\defeq e^{2\pi i\{xy\}_{p}}$ により $\mathbb{Q}_{p}\cong\widehat{\mathbb{Q}_{p}}$ となることが知られている（ここでは証明しない）。$\mathbb{R}$ と同じく自分自身と双対になる例である。

**ゲルファント理論との関係.** 単位的な可換バナッハ環では、ゲルファント–マズールの定理から極大イデアルと複素準同型が対応し、元 $a$ のスペクトルは $\{h(a)\}$ に一致する。$L^{1}(G)$ では $\mathcal{H}(G)=\hat G$ がこの「極大イデアル空間」で、$f\mapsto\hat f$ がゲルファント変換にあたる（これらの一般論はここでは証明せず、使わずに直接示した）。

**前提を変えると.** 非可換群では指標が少なすぎる。たとえば 3 次対称群 $S_{3}$ の指標は交換子群 $A_{3}$ の上で $1$ なので、自明な指標と符号の 2 つしかなく、$\hat{S_{3}}$ から $S_{3}$ は復元できない。非可換群は既約ユニタリ表現の全体で調べることになる。

**この先.** 正定値関数の特徴づけは \see{four:page-bochner-plancherel}、$L^{1}\cap L^{2}$ 上のフーリエ変換が $L^{2}(\hat G)$ へのユニタリ作用素に延びることと $\hat f$ が $f$ を決めることは \see{four:page-inversion-plancherel-lca}、$\hat{\hat G}$ が自然に $G$ と同型であること（双対定理）は \see{four:page-pontryagin-duality} で扱う。
:::

## 問題 {#four:sec-lc-problems}

::: problem {#four:prob-lc-involution}
$f\in L^{1}(G)$ について $\widehat{f^{*}}=\overline{\hat f}$ を示せ。したがって各 $h\in\mathcal{H}(G)$ は $h(f^{*})=\overline{h(f)}$ を満たす。
:::

::: solution
$u\defeq f\overline{\xi}\in L^{1}(G)$ とおくと、$\Delta=1$ と $\overline{\xi(x^{-1})}=\xi(x)$ から
$$
u^{*}(x)=\overline{f(x^{-1})}\,\xi(x^{-1})=f^{*}(x)\overline{\xi(x)}.
$$
\ref{four:ga-involution.1} から $\widehat{f^{*}}(\xi)=\int u^{*}\,d\mu=\overline{\int u\,d\mu}=\overline{\hat f(\xi)}$ である。後半は \ref{four:lc-characters-homomorphisms.2} で $h=h_{\xi}$ と書けることから。
:::

::: problem {#four:prob-lc-orthogonality}
$G$ をコンパクトとし、$\mu(G)=1$ と正規化する。$\xi,\eta\in\hat G$ について、$\xi=\eta$ なら $\int\xi\overline{\eta}\,d\mu=1$、$\xi\ne\eta$ なら $0$ であることを示せ。さらにこれと \ref{four:lc-dual-topology.2} を使って、\ref{four:lc-compact-discrete.1} の別証明を与えよ。
:::

::: solution
$\xi=\eta$ なら被積分関数は $1$ である。$\xi\ne\eta$ なら $\chi\defeq\xi\overline{\eta}\in\hat G$ は自明でなく、$\chi(y)\ne1$ の $y$ がある。\ref{four:hm-transport}（$x\mapsto yx$）から
$$
\int\chi(x)\,d\mu(x)=\int\chi(yx)\,d\mu(x)=\chi(y)\int\chi\,d\mu,
$$
よって $\int\chi\,d\mu=0$ である。後半：$G$ はコンパクトなので $\xi_{0}\in\hat G$ は $L^{1}(G)$ に属し（$\int|\xi_{0}|\,d\mu=1$）、前半から $\widehat{\xi_{0}}(\xi)=\int\xi_{0}\overline{\xi}\,d\mu$ は $\xi=\xi_{0}$ のとき $1$、それ以外のとき $0$ である。$\widehat{\xi_{0}}$ はコンパクト開位相で連続（\ref{four:lc-dual-topology.2}）なので、$\{\xi:|\widehat{\xi_{0}}(\xi)-1|<1\}=\{\xi_{0}\}$ は開集合。
:::
