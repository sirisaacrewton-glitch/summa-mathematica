# ハール測度 {#four:page-haar-measure keywords="Haar measure, existence and uniqueness (H. Cartan's method without Tychonoff), modular function, unimodular group, GL_n(R), ax+b group, ハール測度, モジュラー関数, 単模群"}

局所コンパクト群の上には、左平行移動で不変な $0$ でないラドン測度（**左ハール測度**）が、正の定数倍を除いてただ一つある。証明は、前のページの予告どおり、不変な正値線形汎関数を作り、\ref{four:rm-riesz-markov-kakutani} で測度に移す。汎関数は「$f$ を小さな山形の関数の平行移動で覆うのに何個要るか」という比から作るが、その極限を、チコノフの定理を使わずに、比がコーシー列のように振る舞うことから直接得る（H. カルタンの考えに従い、存在と一意性を同じ評価から導く）。後半では、右平行移動による伸び縮みの率である**モジュラー関数**を調べる。

## 記法と定義の確認 {#four:sec-hm-notation}

::: notation
- 位相群と単位元の近傍は \ref{top:topological-group}, \ref{top:tg-neighbourhoods}、左右の一様構造と一様連続は \ref{top:left-uniformity}, \ref{top:unif-continuous}。
- ラドン測度・正値線形汎関数・$K\prec f\prec U$・$C_{c}(X)^{+}$ は前のページ（\ref{four:rm-radon-measure}）のとおり。コンパクト台のウリゾーンの補題と 1 の分割は \ref{four:rm-urysohn}, \ref{four:rm-partition-of-unity}。
- 以下（\ref{four:hm-uniform-continuity} を除き）$G$ は**局所コンパクト・ハウスドルフな位相群**、単位元は $e$。$s\in G$ と関数 $f$ について $L_{s}f(x)\defeq f(s^{-1}x)$, $R_{s}f(x)\defeq f(xs)$, $\check{f}(x)\defeq f(x^{-1})$。$L_{s}L_{t}=L_{st}$, $\supp L_{s}f=s\supp f$。$E\subset G$ について $xE$, $Ex$, $E^{-1}$ は \ref{top:page-topological-groups} の記法。
- $\check{\varphi}=\varphi$ となる $\varphi$ を**対称**という。$e$ の近傍 $V$ について $\mathcal{S}_{V}$ は、$\supp\varphi\subset V$ となる対称な $\varphi\in C_{c}(G)^{+}$, $\varphi\ne0$ の全体。
- **選択公理**：無限個の対象を一斉に選ぶ箇所はない（ハール積分は「$\inf\sup$」で定義し、必要な関数は「存在する」と言うだけで済ませる）。チコノフの定理は使わない。ただし \ref{four:rm-urysohn}・\ref{four:rm-partition-of-unity} を経由して従属選択公理（DC）を、\ref{four:rm-riesz-markov-kakutani} を経由して可算選択公理を使う。
:::

## コンパクト台の関数の一様連続性 {#four:sec-hm-uniform}

::: lemma コンパクト台の関数の一様連続性 {#four:hm-uniform-continuity keywords="left and right uniform continuity of compactly supported functions on a topological group" index="一様連続性（位相群上の関数）|いちようれんぞくせいいそうぐんじょうのかんすう"}
$G$ を位相群（局所コンパクトでなくてよい）、$f\in C_{c}(G)$, $\varepsilon>0$ とすると、$e$ の対称な開近傍 $V$ で次を満たすものがある。
1. $x^{-1}y\in V$ なら $|f(x)-f(y)|<\varepsilon$。
2. $yx^{-1}\in V$ なら $|f(x)-f(y)|<\varepsilon$。

とくに $s\in V$ なら $\|L_{s}f-f\|_{\infty}\le\varepsilon$ かつ $\|R_{s}f-f\|_{\infty}\le\varepsilon$。
:::

::: intuition
台がコンパクトな連続関数は、どの点でも「同じ大きさのずれ」に対して同じだけしか変化しない。言い換えると、$f$ は左右どちらの一様構造についても一様連続である。
:::

::: proof
**1.** $K\defeq\supp f$ とし、$x\in G$ と「$w\in WW$ なら $|f(xw)-f(x)|<\varepsilon/2$」となる $e$ の対称な開近傍 $W$ からなる $xW$ の全体を $\mathcal{W}$ とする。$n\mapsto f(xn)$ の $e$ での連続性と \ref{top:tg-neighbourhoods.2} から各 $x$ にそのような $W$ があるので、$\mathcal{W}$ は $K$ を覆い、有限個 $x_{1}W_{1},\dots,x_{n}W_{n}$ で覆える。$V\defeq W_{1}\cap\dots\cap W_{n}$ は対称な開近傍。$x^{-1}y\in V$ とする。$x,y\notin K$ なら差は $0$。$x\in K$ なら $x=x_{i}w$（$w\in W_{i}$）、$y=xv$（$v\in V\subset W_{i}$）と書けて $wv\in W_{i}W_{i}$, $w\in W_{i}W_{i}$ なので
$$
|f(y)-f(x)|\le|f(x_{i}wv)-f(x_{i})|+|f(x_{i})-f(x_{i}w)|<\varepsilon.
$$
$y\in K$ なら $y^{-1}x=(x^{-1}y)^{-1}\in V$ なので $x,y$ を入れ替えて同じ議論をする。

**2.** $\check{f}\in C_{c}(G)$ に 1 を使う：$yx^{-1}\in V$ なら $(x^{-1})^{-1}y^{-1}=(yx^{-1})^{-1}\in V$ なので $|f(x)-f(y)|=|\check{f}(x^{-1})-\check{f}(y^{-1})|<\varepsilon$。1 と 2 の近傍の共通部分をとる。

最後の主張は、$(s^{-1}x)x^{-1}=s^{-1}\in V$ に 2 を、$x^{-1}(xs)=s\in V$ に 1 を使う。
:::

## ハール測度の定義 {#four:sec-hm-definition}

::: definition ハール測度 {#four:hm-haar-measure keywords="left Haar measure: nonzero Radon measure invariant under left translations; right Haar measure" index="ハール測度|はーるそくど, 左ハール測度|ひだりはーるそくど, 右ハール測度|みぎはーるそくど"}
$G$ 上のラドン測度 $\mu\ne0$ が、すべての $x\in G$ とボレル集合 $E$ について $\mu(xE)=\mu(E)$ を満たすとき**左ハール測度**、$\mu(Ex)=\mu(E)$ を満たすとき**右ハール測度**という。
:::

::: intuition
左ハール測度は、図形を群の元で左から動かしても大きさが変わらない「物差し」である。
:::

平行移動と逆元は同相写像（\ref{top:tg-neighbourhoods.1}）で、ボレル集合・開集合・コンパクト集合を同じ種類の集合に移すので、$\mu$ がラドン測度なら $E\mapsto\mu(sE)$, $\mu(Es)$, $\mu(E^{-1})$ もラドン測度である（\ref{four:rm-radon-measure.2} の (a)〜(c) が保たれる）。

::: lemma 移した測度での積分 {#four:hm-transport keywords="integral of f composed with a homeomorphism T against mu equals integral of f against the image measure" index="像測度の積分|ぞうそくどのせきぶん"}
$T\colon G\to G$ を同相写像、$\mu,\nu$ を $\mathcal{B}(G)$ 上の測度とし、すべてのボレル集合 $E$ で $\mu(T^{-1}(E))=\nu(E)$ とする。ボレル可測な $f\colon G\to[0,\infty]$ について $\int f\circ T\,d\mu=\int f\,d\nu$。$f\in L^{1}(\nu)$ なら $f\circ T\in L^{1}(\mu)$ で同じ等式が成り立つ。
:::

::: proof
$T$ は連続なので $f\circ T$ はボレル可測。$f=\mathbf{1}_{E}$ なら $f\circ T=\mathbf{1}_{T^{-1}(E)}$ で、両辺は $\mu(T^{-1}(E))=\nu(E)$。両辺は非負の単関数について線形（\ref{meas:simple-integral-properties}）。一般の $f\ge0$ には単関数の増加列 $s_{n}\uparrow f$（\ref{meas:simple-approximation}）をとると $s_{n}\circ T\uparrow f\circ T$ なので \ref{meas:monotone-convergence} から従う。可積分な $f$ は実部・虚部の正負の部分に分ける。
:::

とくに $\mu$ が左ハール測度なら、$T(x)=s^{-1}x$, $\nu=\mu$ として $f\in C_{c}(G)$ について $\int L_{s}f\,d\mu=\int f\,d\mu$（$C_{c}(G)$ の関数は可積分）。

## 存在と一意性 {#four:sec-hm-theorem}

::: theorem ハール測度の存在と一意性 {#four:hm-existence-uniqueness keywords="existence and uniqueness of Haar measure, Haar's theorem, invariant positive functional" index="ハール測度の存在と一意性|はーるそくどのそんざいといちいせい, ハールの定理|はーるのていり" refname="ハール測度の存在と一意性"}
$G$ を局所コンパクト・ハウスドルフな位相群とする。
1. $G$ には左ハール測度がある。
2. $\mu,\nu$ が左ハール測度なら、$\nu=c\mu$ となる $c>0$ がある。
3. $C_{c}(G)$ 上の $0$ でない正値線形汎関数 $J$ が左不変（すべての $s,f$ で $J(L_{s}f)=J(f)$）なら、左ハール測度 $\mu$ で $J(f)=\int f\,d\mu$ となるものがある。
:::

::: intuition
局所コンパクト群には、左から動かしても変わらない積分の仕方が必ずあり、しかも本質的に一通りしかない（違いは全体を何倍するかだけ）。
:::

証明のため、ハールの被覆数を導入する。

::: definition 被覆数 {#four:hm-covering-number keywords="Haar covering number (f:phi) = inf of sum c_i over f <= sum c_i L_{s_i} phi" index="被覆数（ハール）|ひふくすうはーる"}
$f\in C_{c}(G)^{+}$, $\varphi\in C_{c}(G)^{+}$, $\varphi\ne0$ について、
$$
(f:\varphi)\defeq\inf\Bigl\{\sum_{i=1}^{n}c_{i}:c_{i}\ge0,\ s_{i}\in G,\ f\le\sum_{i=1}^{n}c_{i}L_{s_{i}}\varphi\Bigr\}.
$$
また $P\colon C_{c}(G)^{+}\to[0,\infty)$ が単調（$f\le g\Rightarrow P(f)\le P(g)$）、劣加法的、正斉次（$a\ge0$ で $P(af)=aP(f)$）、左不変（$P(L_{s}f)=P(f)$）のとき、このページでは**不変劣加法汎関数**と呼ぶ。
:::

::: lemma 被覆数の性質 {#four:hm-covering-properties keywords="properties of the Haar covering number"}
$f\in C_{c}(G)^{+}$, $\varphi,\psi\in C_{c}(G)^{+}\setminus\{0\}$ とする。
1. $\|f\|_{\infty}/\|\varphi\|_{\infty}\le(f:\varphi)<\infty$。
2. $f\mapsto(f:\varphi)$ は不変劣加法汎関数である。
3. $P$ が不変劣加法汎関数なら $P(f)\le(f:\varphi)P(\varphi)$。とくに $(f:\varphi)\le(f:\psi)(\psi:\varphi)$。
:::

::: proof
**1.** $U\defeq\{\varphi>\|\varphi\|_{\infty}/2\}\ni a$ とすると $\supp f$ は有限個の $s_{j}U$（$s_{j}=x_{j}a^{-1}$）で覆え、そこで $L_{s_{j}}\varphi>\|\varphi\|_{\infty}/2$ なので $f\le\sum_{j}(2\|f\|_{\infty}/\|\varphi\|_{\infty})L_{s_{j}}\varphi$。下からの評価は $f\le\sum c_{i}L_{s_{i}}\varphi$ の上限ノルムをとって $\|f\|_{\infty}\le\sum c_{i}\|\varphi\|_{\infty}$。

**2.** $f\le\sum c_{i}L_{s_{i}}\varphi$ なら $L_{t}f\le\sum c_{i}L_{ts_{i}}\varphi$、$af\le\sum ac_{i}L_{s_{i}}\varphi$。$f\le g$ なら $g$ を覆うものは $f$ も覆う。$f_{1},f_{2}$ を覆う和を足せば $f_{1}+f_{2}$ を覆う。

**3.** $f\le\sum c_{i}L_{s_{i}}\varphi$ なら $P(f)\le\sum c_{i}P(L_{s_{i}}\varphi)=\sum c_{i}P(\varphi)$。下限をとる。後半は 2 から $P=(\cdot:\psi)$ が不変劣加法汎関数であることによる。
:::

::: lemma 近似的な加法性 {#four:hm-approximate-additivity keywords="approximate additivity of the covering number for small supports" index="被覆数の近似的加法性|ひふくすうのきんじてきかほうせい"}
$f_{1},\dots,f_{m}\in C_{c}(G)^{+}$, $F\defeq f_{1}+\dots+f_{m}$, $k\in C_{c}(G)^{+}$ は $\supp F$ 上で $k\ge1$ とし、$\eta>0$ とする。$e$ の近傍 $W$ があり、$\supp\varphi\subset W$ となるすべての $\varphi\in C_{c}(G)^{+}\setminus\{0\}$ について
$$
\sum_{i=1}^{m}(f_{i}:\varphi)\le(1+\eta)\bigl((F:\varphi)+\eta(k:\varphi)\bigr).
$$
:::

::: proof
$\delta\defeq\eta/m$, $h\defeq F+\delta k$ とし、$h_{i}\defeq f_{i}/h$（$h>0$ の所）、$h_{i}\defeq0$（他）とおく。$h\ge\delta$ が $\supp F$ 上で成り立つので、$h_{i}$ は開集合 $\{h>0\}$ と $G\setminus\supp F$ の上でそれぞれ連続で、$h_{i}\in C_{c}(G)^{+}$, $\sum_{i}h_{i}\le1$。\ref{four:hm-uniform-continuity.1} から、$s^{-1}x\in W$ なら全 $i$ で $|h_{i}(x)-h_{i}(s)|<\delta$ となる $W$ をとる。$h\le\sum_{j}c_{j}L_{s_{j}}\varphi$ とすると、$\varphi(s_{j}^{-1}x)\ne0$ なら $s_{j}^{-1}x\in W$ なので
$$
f_{i}(x)=h_{i}(x)h(x)\le\sum_{j}c_{j}h_{i}(x)\varphi(s_{j}^{-1}x)\le\sum_{j}c_{j}\bigl(h_{i}(s_{j})+\delta\bigr)L_{s_{j}}\varphi(x).
$$
よって $(f_{i}:\varphi)\le\sum_{j}c_{j}(h_{i}(s_{j})+\delta)$ で、$i$ について足すと $\sum_{i}h_{i}\le1$ から $\le(1+m\delta)\sum_{j}c_{j}$。下限をとり、\ref{four:hm-covering-properties.2} から $(h:\varphi)\le(F:\varphi)+\delta(k:\varphi)$、$m\delta=\eta$, $\delta\le\eta$。
:::

次が証明の要である：$\varphi$ が小さければ、$g$ を $\varphi$ の平行移動で覆う効率は、どの不変劣加法汎関数で測っても最良に近い。

::: lemma カルタンの評価 {#four:hm-cartan-estimate keywords="Cartan's key estimate for the Haar covering number" index="カルタンの評価|かるたんのひょうか"}
$g\in C_{c}(G)^{+}\setminus\{0\}$, $K\defeq\supp g$, $K\prec k$, $c_{g}\defeq(k:g)$, $0<\varepsilon\le1$, $\delta\defeq\varepsilon/(8(1+c_{g}))$ とする。$e$ の近傍 $V$ があり、各 $\varphi\in\mathcal{S}_{V}$ について $g=g_{1}+\dots+g_{m}$ となる $g_{i}\in C_{c}(G)^{+}$ がとれて、次が成り立つ：不変劣加法汎関数 $P$ が
$$
\sum_{i=1}^{m}P(g_{i})\le(1+\delta)\bigl(P(g)+\delta P(k)\bigr)
\label{four:eq-hm-almost-additive}
$$
を満たすなら $(g:\varphi)P(\varphi)\le(1+\varepsilon)P(g)$。
:::

::: proof
\ref{four:hm-uniform-continuity.1} から、$x^{-1}y\in V$ なら $|g(x)-g(y)|<\delta$ となる対称な開近傍 $V$ をとる。$\varphi\in\mathcal{S}_{V}$ とし、$\delta'\defeq\delta/(k:\varphi)$ とおく。\ref{four:hm-uniform-continuity.2} から、$z'z^{-1}\in U$ なら $|\varphi(z)-\varphi(z')|<\delta'$ となる対称な開近傍 $U$ をとる。$K$ を有限個の $y_{1}U,\dots,y_{m}U$（$y_{i}\in K$）で覆い、\ref{four:rm-partition-of-unity} から $h_{i}\prec y_{i}U$, $K$ 上 $\sum_{i}h_{i}=1$ となる $h_{i}$ をとり、$g_{i}\defeq gh_{i}$ とする（$\sum_{i}g_{i}=g$）。$P$ は \eqref{four:eq-hm-almost-additive} を満たし、$P(\varphi)>0$ とする（$P(\varphi)=0$ なら明らか）。

**Step 1.** 【主張：$x\in G$ を固定すると、$y$ の関数として $(g(x)-\delta)L_{x}\varphi\le\sum_{i}\varphi(y_{i}^{-1}x)g_{i}+\delta'g$】 $\varphi$ は対称なので $L_{x}\varphi(y)=\varphi(x^{-1}y)=\varphi(y^{-1}x)$。$g(y)\ne0$ なら $y\in K$ で $\sum_{i}h_{i}(y)=1$。$h_{i}(y)\ne0$ なら $y\in y_{i}U$ で、$z\defeq y^{-1}x$, $z'\defeq y_{i}^{-1}x$ について $z'z^{-1}=y_{i}^{-1}y\in U$ なので $\varphi(y_{i}^{-1}x)\ge\varphi(y^{-1}x)-\delta'$。$h_{i}(y)$ を掛けて足し、$g(y)$ を掛けると $\sum_{i}\varphi(y_{i}^{-1}x)g_{i}(y)\ge g(y)L_{x}\varphi(y)-\delta'g(y)$（$g(y)=0$ でも成り立つ）。一方 $L_{x}\varphi(y)\ne0$ なら $x^{-1}y\in V$ なので $g(y)>g(x)-\delta$、よって $g(y)L_{x}\varphi(y)\ge(g(x)-\delta)L_{x}\varphi(y)$。

**Step 2.** 【主張：$g\le\sum_{i}\frac{P(g_{i})}{P(\varphi)}L_{y_{i}}\varphi+\bigl(\delta+\delta'\frac{P(g)}{P(\varphi)}\bigr)k$】 Step 1 の不等式に $P$ を施す。$g(x)\ge\delta$ なら左辺は $C_{c}(G)^{+}$ の元で、$P$ の単調性・劣加法性・正斉次性と $P(L_{x}\varphi)=P(\varphi)$ から
$$
(g(x)-\delta)P(\varphi)\le\sum_{i}\varphi(y_{i}^{-1}x)P(g_{i})+\delta'P(g).
$$
$g(x)<\delta$ でもこれは成り立つ（左辺が負）。$P(\varphi)$ で割り、$\varphi(y_{i}^{-1}x)=L_{y_{i}}\varphi(x)$ に注意する。$x\in K$ では $k(x)=1$、$x\notin K$ では $g(x)=0$ なので主張を得る。

**Step 3.** 【主張：$(g:\varphi)P(\varphi)\le(1+\varepsilon)P(g)$】 Step 2 と \ref{four:hm-covering-properties.2}（$(L_{y}\varphi:\varphi)\le1$）から $(g:\varphi)\le\sum_{i}P(g_{i})/P(\varphi)+(\delta+\delta'P(g)/P(\varphi))(k:\varphi)$。$P(\varphi)$ を掛け、$A\defeq(g:\varphi)P(\varphi)$ とおく。$\delta'(k:\varphi)=\delta$、\ref{four:hm-covering-properties.3} から $(k:\varphi)P(\varphi)\le(k:g)(g:\varphi)P(\varphi)=c_{g}A$ と $P(k)\le c_{g}P(g)$、さらに \eqref{four:eq-hm-almost-additive} を使うと
$$
\begin{aligned}
A&\le(1+\delta)(1+\delta c_{g})P(g)+\delta c_{g}A+\delta P(g)\\
&\le(1+2\delta+2\delta c_{g})P(g)+\delta c_{g}A.
\end{aligned}
$$
$2\delta(1+c_{g})=\varepsilon/4$, $\delta c_{g}\le\varepsilon/8$ なので $A\le\frac{1+\varepsilon/4}{1-\varepsilon/8}P(g)\le(1+\varepsilon)P(g)$（$(1+\varepsilon)(1-\varepsilon/8)\ge1+3\varepsilon/4$ を $\varepsilon\le1$ で使う）。
:::

::: restate {ref="four:hm-existence-uniqueness"}
:::

::: proof
$f_{0}\in C_{c}(G)^{+}\setminus\{0\}$ を固定し、$\varphi\in C_{c}(G)^{+}\setminus\{0\}$ について $I_{\varphi}(f)\defeq(f:\varphi)/(f_{0}:\varphi)$ とおく。\ref{four:hm-covering-properties.3} から、$f\ne0$ なら $(f_{0}:f)^{-1}\le I_{\varphi}(f)\le(f:f_{0})$。$\mathcal{S}_{V}$ は空でない：\ref{four:rm-urysohn} から $\{e\}\prec\theta\prec V\cap V^{-1}$ となる $\theta$ をとれば、$\theta\check{\theta}\in\mathcal{S}_{V}$。

**Step 1.** 【主張：$f\in C_{c}(G)^{+}$, $0<\varepsilon\le1$ について、近傍 $V$ があり、$\varphi,\psi\in\mathcal{S}_{V}$ なら $I_{\varphi}(f)\le(1+\varepsilon)^{2}I_{\psi}(f)$】 $f=0$ なら明らか。\ref{four:hm-cartan-estimate} を $g=f$ と $g=f_{0}$ に使い、二つの $V$ の共通部分を $V$ とする。$\varphi\in\mathcal{S}_{V}$ について、補題の $g_{i}$ の二つの族に \ref{four:hm-approximate-additivity}（$\eta=\delta$）を使うと、$\supp\chi\subset W_{\varphi}$ となる $\chi\ne0$ では $P=(\cdot:\chi)$ が \eqref{four:eq-hm-almost-additive} を満たす近傍 $W_{\varphi}$ がある。このとき $(f:\varphi)(\varphi:\chi)\le(1+\varepsilon)(f:\chi)$, $(f_{0}:\varphi)(\varphi:\chi)\le(1+\varepsilon)(f_{0}:\chi)$ で、逆向きの $(f:\chi)\le(f:\varphi)(\varphi:\chi)$, $(f_{0}:\chi)\le(f_{0}:\varphi)(\varphi:\chi)$ と合わせて
$$
I_{\varphi}(f)\le(1+\varepsilon)I_{\chi}(f),\qquad I_{\chi}(f)\le(1+\varepsilon)I_{\varphi}(f).
$$
$\varphi,\psi\in\mathcal{S}_{V}$ には、\ref{four:rm-urysohn} で $\supp\chi\subset W_{\varphi}\cap W_{\psi}$ となる $\chi\ne0$ を一つとれば、$I_{\varphi}(f)\le(1+\varepsilon)I_{\chi}(f)\le(1+\varepsilon)^{2}I_{\psi}(f)$。

**Step 2.** 【主張：$I(f)\defeq\inf_{V}\sup_{\varphi\in\mathcal{S}_{V}}I_{\varphi}(f)$（$V$ は $e$ の近傍全体）とおくと、$\varepsilon>0$ に近傍 $V$ があり、$\varphi\in\mathcal{S}_{V}$ なら $|I_{\varphi}(f)-I(f)|\le\varepsilon$】 $s_{V}\defeq\sup_{\mathcal{S}_{V}}I_{\varphi}(f)$, $i_{V}\defeq\inf_{\mathcal{S}_{V}}I_{\varphi}(f)$ とする。$V'$ が任意の近傍なら $s_{V'}\ge s_{V\cap V'}\ge i_{V\cap V'}\ge i_{V}$ なので $i_{V}\le I(f)\le s_{V}$。$\varphi\in\mathcal{S}_{V}$ なら $I_{\varphi}(f)$ も $[i_{V},s_{V}]$ にあるので $|I_{\varphi}(f)-I(f)|\le s_{V}-i_{V}$。Step 1 の $V$（$\varepsilon'$ について）では $s_{V}\le(1+\varepsilon')^{2}i_{V}$ なので $s_{V}-i_{V}\le3\varepsilon'(f:f_{0})$。$\varepsilon'$ を小さくとればよい。

**Step 3.** 【主張：$I$ は $C_{c}(G)^{+}$ 上で加法的・正斉次・左不変で、$I(f_{0})=1$】 有限個の関数について Step 2 の近傍の共通部分をとれば、$I_{\varphi}$ の性質（\ref{four:hm-covering-properties.2}）が極限で保たれ、$I$ は正斉次・左不変・劣加法的で $I(f_{0})=1$。逆向き：$\supp(f_{1}+f_{2})$ 上で $k\ge1$ となる $k$ をとると、\ref{four:hm-approximate-additivity}（$m=2$）から $\varphi\in\mathcal{S}_{W}$ について $I_{\varphi}(f_{1})+I_{\varphi}(f_{2})\le(1+\eta)(I_{\varphi}(f_{1}+f_{2})+\eta I_{\varphi}(k))$。極限をとって $\eta\to0$ とすれば $I(f_{1})+I(f_{2})\le I(f_{1}+f_{2})$。

**Step 4.** 【主張：項目 1】 実数値の $f$ には $I(f)\defeq I(f^{+})-I(f^{-})$ とおく。$f=u-v$（$u,v\in C_{c}(G)^{+}$）なら $u+f^{-}=v+f^{+}$ と Step 3 から $I(u)-I(v)=I(f)$ なので $I$ は線形。複素数値には $I(f)\defeq I(\operatorname{Re}f)+iI(\operatorname{Im}f)$。$I$ は正値線形で $(L_{s}f)^{\pm}=L_{s}(f^{\pm})$ から左不変、$I(f_{0})=1$。\ref{four:rm-riesz-markov-kakutani.1} のラドン測度 $\mu$ をとる。開集合 $U$ について、$f\prec sU$ と $L_{s^{-1}}f\prec U$ は同値なので、\ref{four:rm-riesz-markov-kakutani.3} から $\mu(sU)=\sup\{I(L_{s}f'):f'\prec U\}=\mu(U)$。ボレル集合 $E$ では、$U\mapsto sU$ は $E$ を含む開集合から $sE$ を含む開集合への全単射なので、外部正則性から $\mu(sE)=\mu(E)$。$\int f_{0}\,d\mu=1$ から $\mu\ne0$。

**Step 5.** 【主張：3：$J$ が 3 の汎関数なら、$C_{c}(G)$ 上で $J=J(f_{0})I$】 $J$ を $C_{c}(G)^{+}$ に制限したものは不変劣加法汎関数で、$\sum_{i}J(g_{i})=J(g)$ なので \eqref{four:eq-hm-almost-additive} を満たす。$J\ne0$ なので $J(f)>0$ となる $f\in C_{c}(G)^{+}$ があり（実部・虚部・正負の部分に分ける）、\ref{four:hm-covering-properties.3} の $J(f)\le(f:\varphi)J(\varphi)$ から、すべての $\varphi\ne0$ で $J(\varphi)>0$。$f\ne0$ と $\varepsilon$ について \ref{four:hm-cartan-estimate} を $f$, $f_{0}$ に使うと、$\varphi\in\mathcal{S}_{V}$ で
$$
\frac{J(f)}{J(\varphi)}\le(f:\varphi)\le(1+\varepsilon)\frac{J(f)}{J(\varphi)}
$$
と $f_{0}$ についての同じ式が成り立ち、割り算して $I_{\varphi}(f)$ は $(1+\varepsilon)^{\pm1}J(f)/J(f_{0})$ の間にある。Step 2 で $\varphi$ の台を小さくすれば $I(f)$ も同じ範囲にあり、$\varepsilon\to0$ で $J(f)=J(f_{0})I(f)$。線形性から $C_{c}(G)$ 全体に及ぶ。よって $J(f)=\int f\,d(J(f_{0})\mu)$ で、$J(f_{0})\mu$ は左ハール測度。

**Step 6.** 【主張：項目 2】 $\nu$ を左ハール測度とし、$J_{\nu}(f)\defeq\int f\,d\nu$ とおく。\ref{four:hm-transport} の後の注意から $J_{\nu}$ は左不変な正値線形汎関数。$\nu(G)>0$ と内部正則性から $\nu(K)>0$ のコンパクト $K$ があり、$K\prec f$ なら $J_{\nu}(f)\ge\nu(K)>0$。Step 5 から $J_{\nu}=J_{\nu}(f_{0})I$。$\mu$ についても同じなので、$c\defeq J_{\nu}(f_{0})/J_{\mu}(f_{0})>0$ について $\nu$ と $c\mu$ は同じ汎関数を表し、\ref{four:rm-riesz-markov-kakutani.2} から $\nu=c\mu$。

::: hypcheck
- **局所コンパクト・ハウスドルフ**：$\mathcal{S}_{V}\ne\varnothing$ と $\chi$ の存在（Step 1）、\ref{four:hm-cartan-estimate} の 1 の分割、表現定理（Step 4・6）で使った。外すと偽：$(\mathbb{Q},+)$ では、左不変でコンパクト集合上有限なボレル測度は $0$ だけ（一点の測度は共通で、正なら $\{0\}\cup\{1/n\}$ の測度が $\infty$、$0$ なら可算加法性から全体も $0$）。
- **$J$ の左不変性**：Step 5 で \ref{four:hm-cartan-estimate}（その Step 2 の $P(L_{x}\varphi)=P(\varphi)$）を使うために使った。
- **$\varphi$ の対称性**：\ref{four:hm-cartan-estimate} の Step 1 で、$y\mapsto\varphi(y^{-1}x)$ を左平行移動 $L_{x}\varphi$ と見るために使った。
- **選択公理**：近傍ごとに関数を選ぶ操作はない（Step 1 の $\chi$ は一つ、Step 2 の極限は $\inf\sup$）。$\mathcal{S}_{V}\ne\varnothing$、$\chi$、$k$、1 の分割で \ref{four:rm-urysohn} の DC を、Step 4 で表現定理の可算選択を使う。チコノフの定理は使わない。
:::
:::

::: supplement
**ヴェイユの証明との比較.** よく知られたもう一つの証明（A. ヴェイユによる）は、$I_{\varphi}$ を区間の直積 $\prod_{f}[(f_{0}:f)^{-1},(f:f_{0})]$ の点と見て、チコノフの定理で集積点をとる。そこでは無限個の区間の直積のコンパクト性という選択公理の一形態を使う。ここでは \ref{four:hm-cartan-estimate} で $I_{\varphi}(f)$ がそれ自体で収束することを示したので、その必要がない。

**高い視点：砂山の数え方.** $(f:\varphi)$ は「砂山 $f$ を、型 $\varphi$ の小さな砂山を並べて覆うには何杯要るか」である。型を小さくすると杯数の比 $(f:\varphi)/(f_{0}:\varphi)$ は型によらない値に落ち着き、それが $f$ の体積になる。平行移動しても杯数は変わらないので、体積も変わらない。

**前提を変えると.**
- **局所コンパクト性.** hypcheck の $\mathbb{Q}$ のほかに、無限次元の可分なヒルベルト空間 $\ell^{2}$（加法群）でも、平行移動で不変なボレル測度で、ある空でない開球の測度が有限なものは $0$ しかない。実際、開球 $B(a,r)$ の測度が有限なら、正規直交系 $e_{n}$ について球 $B(a+\frac{r}{2}e_{n},\frac{r}{4})$ は互いに交わらず（中心の距離は $r/\sqrt2>r/2$）$B(a,r)$ に含まれ、不変性からすべて同じ測度なので、その測度は $0$。$B(a,r)$ の中の小さい球にも同じ議論が使え、半径 $r/4$ 以下の球はすべて測度 $0$。可分性からどの開集合も可算個のそのような球の和なので、開集合の測度はすべて $0$ になる。
- **コンパクト集合上の有限性.** ラドン測度であることを外すと一意性が崩れる：$\mathbb{R}$ の数え上げ測度も平行移動で不変だが、コンパクト集合 $[0,1]$ の測度が $\infty$ でルベーグ測度の定数倍でない。
- **群から等質空間へ.** 閉部分群 $H$ による剰余空間 $G/H$ には $G$ が左から作用する。その上に $G$ 不変な $0$ でないラドン測度があるための必要十分条件は、$H$ の上で $\Delta_{G}=\Delta_{H}$ となること（\see{four:hm-modular-function}）で、そのとき測度は定数倍を除いて一意であることが知られている（ここでは証明しない）。$H=\{e\}$ の場合が 1・2 である。

**似た定理.** $\mathbb{R}^{n}$ では、2 は「平行移動で不変で単位立方体の測度が有限なボレル測度はルベーグ測度の定数倍」（\see{meas:translation-invariant-unique.2}）にあたる。そこでは立方体を細かく分割して直接示したが、ここでは群の構造しか使えないので、被覆数の比で「大きさ」を測った。コンパクト群では、ハール測度は $C(G)$ 上の「平均のとり方」で、全体の測度を $1$ に正規化すると平行移動で不変な正値線形汎関数として一意に決まる。
:::

::: proposition 開集合の測度は正 {#four:hm-open-positive keywords="a left Haar measure is positive on nonempty open sets and positive integrals of nonzero nonnegative C_c functions" index="ハール測度の正値性|はーるそくどのせいちせい"}
$\mu$ を左ハール測度とする。空でない開集合 $U$ について $\mu(U)>0$。とくに $f\in C_{c}(G)^{+}$, $f\ne0$ なら $\int f\,d\mu>0$。
:::

::: proof
$\mu(U)=0$ とする。コンパクト $K$ は有限個の $xU$ で覆え、$\mu(xU)=\mu(U)=0$ なので $\mu(K)=0$。開集合 $G$ での内部正則性から $\mu(G)=0$ となり $\mu\ne0$ に反する。後半は $f\ge\frac12\|f\|_{\infty}\mathbf{1}_{U}$, $U\defeq\{f>\frac12\|f\|_{\infty}\}$ から。
:::

## モジュラー関数 {#four:sec-hm-modular}

::: theorem モジュラー関数 {#four:hm-modular-function keywords="modular function, mu(Ex) = Delta(x) mu(E), right Haar measure, d mu(x^{-1}) = Delta(x^{-1}) d mu(x)" index="モジュラー関数|もじゅらーかんすう, モジュラ関数|もじゅらかんすう"}
$\mu$ を $G$ の左ハール測度とする。
1. 各 $x\in G$ に $\Delta(x)>0$ がただ一つあり、すべてのボレル集合 $E$ で $\mu(Ex)=\Delta(x)\mu(E)$。$\Delta$ は $\mu$ の選び方によらない（**モジュラー関数**）。
2. ボレル可測な $f\ge0$ または $f\in L^{1}(\mu)$ について $\int f(yx)\,d\mu(y)=\Delta(x^{-1})\int f\,d\mu$。
3. $\Delta$ は $G$ から乗法群 $(0,\infty)$ への連続な準同型である。
4. $\check{\mu}(E)\defeq\mu(E^{-1})$ は右ハール測度で、$f\in C_{c}(G)$ について
$$
\int f(x^{-1})\,d\mu(x)=\int f(x)\Delta(x^{-1})\,d\mu(x).
$$
:::

::: intuition
左ハール測度は右から動かすと一定の倍率 $\Delta(x)$ で伸び縮みし、その倍率は群の準同型になる。逆元で裏返した測度は右ハール測度で、左ハール測度との違いはちょうど密度 $\Delta(x^{-1})$ である。
:::

::: proof
**Step 1.** 【主張：項目 1】 $\nu_{x}(E)\defeq\mu(Ex)$ はラドン測度（定義の後の注意）で、$\nu_{x}(sE)=\mu(sEx)=\mu(Ex)$ なので左ハール測度。\ref{four:hm-existence-uniqueness.2} から $\nu_{x}=\Delta(x)\mu$ となる $\Delta(x)>0$ があり、$\mu(E)\in(0,\infty)$ となる $E$（$e$ のコンパクトな近傍。\ref{four:hm-open-positive}）があるので一意。$c\mu$ に替えても両辺が $c$ 倍になるだけ。

**Step 2.** 【主張：項目 2】 $T(y)\defeq yx$ とすると $T^{-1}(E)=Ex^{-1}$, $\mu(Ex^{-1})=\Delta(x^{-1})\mu(E)$。\ref{four:hm-transport} を $\nu=\Delta(x^{-1})\mu$ で使う。

**Step 3.** 【主張：項目 3】 $0<\mu(E)<\infty$ の $E$ について $\Delta(xy)\mu(E)=\mu(Exy)=\Delta(y)\mu(Ex)=\Delta(y)\Delta(x)\mu(E)$。連続性：$f\in C_{c}(G)^{+}$, $f\ne0$ を固定すると 2 から $\Delta(x^{-1})=\int f(yx)\,d\mu(y)/\int f\,d\mu$（分母は \ref{four:hm-open-positive} で正）。$x_{0}$, $\varepsilon$ について \ref{four:hm-uniform-continuity.1} の $V$ と、$\overline{V_{1}}$ がコンパクトな開近傍 $V_{1}\subset V$（\ref{four:rm-shrink}）をとる。$x\in x_{0}V_{1}$ なら $w\defeq x_{0}^{-1}x\in V$ で、$z\defeq yx_{0}$ について $|f(yx)-f(yx_{0})|=|f(zw)-f(z)|<\varepsilon$。被積分関数の差は、コンパクト集合 $C\defeq\supp f\cdot(x_{0}\overline{V_{1}})^{-1}$ の外で $0$ なので
$$
\Bigl|\int f(yx)\,d\mu(y)-\int f(yx_{0})\,d\mu(y)\Bigr|\le\varepsilon\mu(C).
$$
よって $x\mapsto\Delta(x^{-1})$ は連続で、逆元との合成をとって $\Delta$ も連続。

**Step 4.** 【主張：項目 4】 $\check{\mu}$ はラドン測度で、$(Ex)^{-1}=x^{-1}E^{-1}$ から右不変。\ref{four:hm-transport}（$T(x)=x^{-1}$）から $\int f\,d\check{\mu}=\int f(x^{-1})\,d\mu(x)$。$C_{c}(G)$ 上の汎関数 $J_{1}(f)\defeq\int\check{f}\,d\check{\mu}=\int f\,d\mu$ と $J_{2}(f)\defeq\int f(x^{-1})\Delta(x^{-1})\,d\mu(x)$ を比べる。$J_{2}$ は $0$ でない正値線形汎関数で、左不変である：$F(z)\defeq f(z^{-1})\Delta(z^{-1})$ とおくと $F(xs)=f(s^{-1}x^{-1})\Delta(s^{-1})\Delta(x^{-1})$ なので、2 から
$$
J_{2}(L_{s}f)=\Delta(s)\int F(xs)\,d\mu(x)=\Delta(s)\Delta(s^{-1})\int F\,d\mu=J_{2}(f).
$$
\ref{four:hm-existence-uniqueness.3}・\ref{four:hm-existence-uniqueness.2} から $J_{2}=cJ_{1}$（$c>0$）。$\varepsilon>0$ について、3 から $V$ 上で $|\Delta(x^{-1})-1|\le\varepsilon$ となる近傍 $V$ をとり、$\varphi\in\mathcal{S}_{V}$ に使うと $J_{2}(\varphi)$ は $(1\pm\varepsilon)J_{1}(\varphi)$ の間にあり（$\check{\varphi}=\varphi$）、$J_{1}(\varphi)>0$ なので $|c-1|\le\varepsilon$。よって $c=1$ で、$f$ を $\check{f}$ に替えれば 4 の等式。
:::

::: supplement
**高い視点：内部自己同型による体積の伸び.** 1 から $\mu(x^{-1}Ex)=\mu(Ex)=\Delta(x)\mu(E)$ なので、$\Delta(x)$ は内部自己同型 $y\mapsto x^{-1}yx$ が体積を何倍にするかを表す。左平行移動は体積を変えないので、右平行移動のずれはすべて「共役で群がどれだけ伸び縮みするか」に集まる。リー群で $\Delta(x)=|\det\mathrm{Ad}(x)|^{-1}$（\ref{four:hm-examples.6}）となるのは、単位元の近くで共役が線形写像 $\mathrm{Ad}(x)$ で近似されるからである（$\mathrm{Ad}(x)$ は $y\mapsto xyx^{-1}$ の微分で、$x^{-1}$ による共役とは向きが逆）。比喩でいえば、$ax+b$ 群では「拡大してから平行移動する」と「平行移動してから拡大する」で平行移動の量が $a$ 倍ずれ、この食い違いが $\Delta(a,b)=a^{-1}$ として現れる。

**前提を変えると（単模性の判定）.** 3 から $\Delta$ は可換群 $(0,\infty)$ への連続準同型なので、次の部分群の上では $1$ になる：交換子 $xyx^{-1}y^{-1}$ で生成される部分群（\see{grp:commutator-subgroup}）とその閉包、コンパクトな部分群（像は $(0,\infty)$ のコンパクトな部分群なので、\ref{four:hm-unimodular-examples.2} の証明と同じく $\{1\}$）。とくに交換子群が稠密な群は単模で、$SL_{n}(\mathbb{R})$ は自分自身の交換子群に等しいことが知られているので単模である。一方 $ax+b$ 群の交換子は $(1,b)$ の形で、$\Delta$ はそれを殺すが、$a$ 方向の拡大は殺さない。

**似た定理.** 単模でない群では、$L^{1}(G)$ の対合（\see{four:ga-involution}）や畳み込みの評価に $\Delta$ が現れる。等質空間 $G/H$ に不変測度があるための条件 $\Delta_{G}|_{H}=\Delta_{H}$（\ref{four:hm-existence-uniqueness} の補足）も、モジュラー関数が「群の左右の非対称性」を測る量であることの現れである。
:::

::: definition 単模群 {#four:hm-unimodular keywords="unimodular group: modular function identically 1, left Haar measure is right invariant" index="単模群|たんもぐん, ユニモジュラー群|ゆにもじゅらーぐん"}
$\Delta\equiv1$ のとき $G$ を**単模**という。\ref{four:hm-modular-function.1} から、これは左ハール測度が右ハール測度でもあることと同値である。
:::

::: proposition 単模群の例 {#four:hm-unimodular-examples keywords="abelian groups, compact groups and discrete groups are unimodular" index="単模群の例|たんもぐんのれい"}
1. 可換群は単模である。
2. コンパクト群は単模である。
3. 離散群は単模である。
:::

::: proof
**1.** $Ex=xE$ なので $\mu(Ex)=\mu(E)$。

**2.** $\Delta(G)$ は連続な準同型（\ref{four:hm-modular-function.3}）によるコンパクト集合の像なので、$(0,\infty)$ のコンパクトな部分群。$t\in\Delta(G)$, $t\ne1$ なら $t^{n}\in\Delta(G)$（$n\in\mathbb{Z}$）は $\infty$ にも $0$ にも近づくので、有界かつ $0$ から離れた閉集合であることに反する。よって $\Delta(G)=\{1\}$。（$\mu(G)<\infty$ と $\mu(G)=\mu(Gx)=\Delta(x)\mu(G)$ からも従う。）

**3.** $\{e\}$ は開集合なので $0<\mu(\{e\})<\infty$（\ref{four:hm-open-positive}、一点はコンパクト）。$\Delta(x)\mu(\{e\})=\mu(\{x\})=\mu(x\{e\})=\mu(\{e\})$。
:::

## 例 {#four:sec-hm-examples}

::: example ハール測度の例 {#four:hm-examples}
1. **$\mathbb{R}^{n}$.** ボレル集合族上のルベーグ測度 $\lambda$ は平行移動で不変なラドン測度である（\ref{four:rm-examples.1}）。\ref{four:hm-existence-uniqueness.2} から、$\mathbb{R}^{n}$ の左ハール測度はちょうど $c\lambda$（$c>0$）である。
2. **円周 $\mathbb{T}=\mathbb{R}/\mathbb{Z}$**（商群、\ref{top:tg-quotient}。コンパクトな可換群）. $C(\mathbb{T})$ の関数を周期 $1$ の関数と見た $I(f)\defeq\int_{\mathbb{T}}f$ は正値線形、$I(1)=1$ で、\ref{four:circle-translation.1} から不変。\ref{four:hm-existence-uniqueness.3} の測度が全体の測度 $1$ のハール測度である。
3. **離散群.** 数え上げ測度（\ref{four:rm-examples.2}）は $\#(xE)=\#E$ なので左ハール測度。たとえば $\mathbb{Z}$, $\mathbb{Z}^{n}$, 有限群。
4. **$GL_{n}(\mathbb{R})$.** $GL_{n}(\mathbb{R})$ は $M_{n}(\mathbb{R})\cong\mathbb{R}^{n^{2}}$ の開集合（$\det$ は連続）。線形写像 $X\mapsto gX$ は列ごとに $g$ を掛けるので行列式は $(\det g)^{n}$、$X\mapsto Xg$ も（行ごとに考えて）同じ。$f\in C_{c}(GL_{n}(\mathbb{R}))$ について
$$
I(f)\defeq\int_{GL_{n}(\mathbb{R})}f(x)\,|\det x|^{-n}\,d\lambda(x)
$$
とおき、$F(y)\defeq f(y)|\det y|^{-n}$, $\Phi(x)\defeq gx$（$GL_{n}(\mathbb{R})$ からそれ自身への微分同相、$J_{\Phi}=|\det g|^{n}$）に \ref{meas:change-of-variables.3} を使うと、$(F\circ\Phi)J_{\Phi}(x)=f(gx)|\det x|^{-n}$ なので $I(L_{g^{-1}}f)=I(f)$。右も同様。よって $|\det x|^{-n}dx$ は左ハール測度かつ右ハール測度で、$GL_{n}(\mathbb{R})$ は単模である。
5. **$ax+b$ 群（非単模の例）.** $G\defeq\{(a,b):a>0,\ b\in\mathbb{R}\}$ に積 $(a,b)(a',b')\defeq(aa',ab'+b)$ を入れる（行列 $\begin{pmatrix}a&b\\0&1\end{pmatrix}$ の積。直線の変換 $t\mapsto at+b$ の合成）。$G$ は $\mathbb{R}^{2}$ の開集合と同相。$x=(\alpha,\beta)$ による左平行移動 $(a,b)\mapsto(\alpha a,\alpha b+\beta)$ のヤコビアンは $\alpha^{2}$、右平行移動 $(a,b)\mapsto(a\alpha,a\beta+b)$ のヤコビアンは $\alpha$。4 と同様に \ref{meas:change-of-variables.3} を使うと、$d\mu\defeq a^{-2}\,da\,db$ について
$$
\int f(x\cdot y)\,d\mu(y)=\int f\,d\mu,\qquad\int f(y\cdot x)\,d\mu(y)=\alpha\int f\,d\mu.
$$
よって $\mu$ は左ハール測度で、\ref{four:hm-modular-function.2} から $\Delta(x^{-1})=\alpha$、すなわち $\Delta(a,b)=a^{-1}$。$G$ は単模でない。\ref{four:hm-modular-function.4} から右ハール測度は $\Delta(x^{-1})\,d\mu(x)=a^{-1}\,da\,db$。
6. **リー群.** リー群 $G$（\ref{lie:lie-group}）では、左不変ベクトル場（\ref{lie:left-invariant-field}）の基底の双対から至る所 $0$ でない左不変な最高次の形式 $\omega$ が作れ、$\omega$ が正になる向き（\ref{mfd:orientation}）での $f\mapsto\int_{G}f\omega$（\ref{mfd:integral}）が左ハール測度を与える。また $\Delta(x)=|\det\mathrm{Ad}(x)|^{-1}$（\ref{lie:adjoint-representation}）。これらはここでは証明しない。$ax+b$ 群では $\det\mathrm{Ad}(a,b)=a$ で 5 と合い、$GL_{n}(\mathbb{R})$ では $X\mapsto gXg^{-1}$ の行列式が $1$ で 4 と合う。
:::

## 問題 {#four:sec-hm-problems}

::: problem {#four:prob-hm-discrete}
$\mu$ を $G$ の左ハール測度とする。$\mu(\{e\})>0$ であることと、$G$ が離散であることが同値であることを示せ。
:::

::: solution
「⇐」：\ref{four:hm-open-positive}。「⇒」：$c\defeq\mu(\{e\})>0$ とすると、すべての $x$ で $\mu(\{x\})=\mu(x\{e\})=c$。\ref{four:rm-shrink}（$K=\{e\}$, $U=G$）から $\overline{U'}$ がコンパクトな $e$ の開近傍 $U'$ をとると $\mu(U')\le\mu(\overline{U'})<\infty$。$U'$ が $N$ 個の点を含めば $Nc\le\mu(U')$ なので $U'$ は有限集合。ハウスドルフ空間の有限集合は閉なので $\{e\}=U'\setminus(U'\setminus\{e\})$ は開集合。平行移動して、すべての一点集合が開。
:::

::: problem {#four:prob-hm-heisenberg}
$N\defeq\mathbb{R}^{3}$ に積 $(x,y,z)(x',y',z')\defeq(x+x',\,y+y',\,z+z'+xy')$ を入れる（行列 $\begin{pmatrix}1&x&z\\0&1&y\\0&0&1\end{pmatrix}$ の積。\see{lie:ex-lgb-1}）。$N$ は可換でないが、ルベーグ測度が左ハール測度かつ右ハール測度であり、$N$ が単模であることを示せ。
:::

::: solution
行列の積の $(1,3)$ 成分は $z+z'+xy'$ なので、$N$ は群（逆元 $(-x,-y,-z+xy)$）で、演算は多項式なので $\mathbb{R}^{3}$ と同相な局所コンパクト・ハウスドルフな位相群。$(1,0,0)(0,1,0)=(1,1,1)\ne(1,1,0)=(0,1,0)(1,0,0)$ なので可換でない。$(a,b,c)$ による左平行移動は $(x,y,z)\mapsto(x+a,\,y+b,\,z+c+ay)$、右平行移動は $(x,y,z)\mapsto(x+a,\,y+b,\,z+c+xb)$ で、どちらもアフィン写像で、線形部分は対角成分が $1$ の三角行列なのでヤコビアンは $1$。\ref{meas:change-of-variables.1} から、ボレル集合 $E$ について $\lambda((a,b,c)E)=\lambda(E)=\lambda(E(a,b,c))$。$\lambda$ は $\mathbb{R}^{3}$ のラドン測度（\ref{four:rm-examples.1}）なので左ハール測度かつ右ハール測度で、\ref{four:hm-modular-function.1} から $\Delta\equiv1$。
:::
