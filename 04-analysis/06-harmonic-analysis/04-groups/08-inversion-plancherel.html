# 反転公式とプランシュレルの定理 {#four:page-inversion-plancherel-lca keywords="Fourier inversion theorem on locally compact abelian groups, dual measure, Plancherel theorem for LCA groups, unitary Fourier transform L^2(G) -> L^2(hat G), 反転公式, 双対測度, プランシュレルの定理, 局所コンパクト可換群"}

前のページ（\ref{four:page-bochner-plancherel}）では、局所コンパクト可換群 $G$ 上の連続な正定値関数が、双対群 $\hat G$ 上の有限な正値測度の逆フーリエ変換としてただ一通りに書けることを示した。このページではそれを使って、$\hat G$ のハール測度を一つ選び出し（**双対測度**）、その正規化のもとで反転公式 $f(x)=\int_{\hat G}\hat f(\xi)\xi(x)\,d\xi$ と、フーリエ変換が $L^{2}(G)$ から $L^{2}(\hat G)$ へのユニタリ作用素に延びること（プランシュレルの定理）を示す。$\hat G$ のハール測度の存在は一般論（\ref{four:hm-existence-uniqueness}）からも分かるが、ここでは正定値関数から直接作り、同時に正規化を決める。$\mathbb{R}$ では \ref{four:inversion-theorem} と \ref{four:plancherel} に、円周では \ref{four:l2-theory} に戻る。ポンチャーギンの双対定理は使わない（次のページでは逆に、ここでの結果から双対定理を導く）。

## 記法と定義の確認 {#four:sec-il-notation}

::: notation
- $G$ は局所コンパクト・ハウスドルフな可換位相群、$\mu$ は固定したハール測度（\ref{four:hm-haar-measure}）、$\Delta=1$。$\int F\,dx\defeq\int F\,d\mu$。$\mu$ は反転でも不変：$\int F(x^{-1})\,dx=\int F\,dx$（\ref{four:ga-involution.1}）。
- $L_{s}f(x)=f(s^{-1}x)$、畳み込み $f*g$、$f^{*}(x)=\overline{f(x^{-1})}$ は \ref{four:ga-convolution}, \ref{four:ga-involution}, \ref{four:ga-group-algebra}。$\langle f,g\rangle=\int f\overline{g}\,dx$ は $L^{2}(G)$ の内積。
- 双対群 $\hat G$、$h_{\xi}$、フーリエ変換 $\hat f(\xi)=\int f\overline{\xi}\,dx$ は \ref{four:lc-character}, \ref{four:lc-characters-homomorphisms}, \ref{four:lc-fourier-transform}。$\hat G$ は局所コンパクト・ハウスドルフ（\ref{four:lc-dual-topology}）、$\hat f\in C_{0}(\hat G)$（\ref{four:lc-riemann-lebesgue}、上限ノルム $\|\cdot\|_{\infty}$）。ラドン測度、$f\prec U$、$K\prec f$ は \ref{four:rm-radon-measure}, \ref{four:rm-riesz-markov-kakutani}。
- 前のページの定義と結果：
  - \term[連続関数]{top:continuous} $\varphi$ が**正定値**とは、すべての有限個の $x_{i}\in G$, $c_{i}\in\mathbb{C}$ で $\sum_{i,j}c_{i}\overline{c_{j}}\varphi(x_{i}x_{j}^{-1})\ge0$ となること（\ref{four:bp-positive-definite.1}）。その一次結合の全体が $B(G)$、そのうち可積分なものの全体が $B^{1}(G)$（\ref{four:bp-positive-definite.2}）。
  - 正定値関数 $\varphi$ は $|\varphi|\le\varphi(e)$, $\varphi(x^{-1})=\overline{\varphi(x)}$ を満たし、\term[指標]{four:lc-character}を掛けても正定値。$f\in L^{2}(G)$ について $x\mapsto\langle f,L_{x}f\rangle$ は正定値で、$f\in L^{1}\cap L^{2}$ なら $f*f^{*}$ の連続な代表（\ref{four:bp-pd-basic}）。
  - $\widehat{f^{*}}=\overline{\hat f}$ と、$\{\hat f:f\in C_{c}(G)\}$ の $C_{0}(\hat G)$ での稠密性（\ref{four:bp-fourier-dense}）。
  - $\hat G$ 上のラドン測度 $\lambda$ と $k\in L^{1}(\lambda)$ の逆フーリエ変換 $\check k(x)=\int k(\xi)\xi(x)\,d\lambda(\xi)$ は連続で、$\int f(x)\check k(x^{-1})\,dx=\int\hat f\,k\,d\lambda$ を満たし、$\check k\equiv0$ なら $k=0$（$\lambda$ について a.e.）（\ref{four:bp-measure-transform}）。
  - \ref{four:bp-bochner}：連続な正定値関数 $\varphi$ には $\hat G$ 上の有限なラドン測度 $\nu_{\varphi}$ で $\varphi(x)=\int\xi(x)\,d\nu_{\varphi}(\xi)$ となるものがただ一つあり、$\nu_{\varphi}(\hat G)=\varphi(e)$。
- **選択公理**：前のページと同じく、\ref{four:rm-urysohn}・\ref{four:rm-cc-dense}・\ref{four:ga-approximate-identity} を通じて従属選択公理（DC）を、\ref{four:rm-riesz-markov-kakutani}・\ref{four:ga-measurability} を通じて可算選択公理を、\ref{four:lc-dual-topology.3} を通じて超フィルター補題を使う。ボホナーの定理は極大イデアルの存在（\ref{four:bp-spectral-radius}）のために選択公理を使うので、このページの主要な結果はすべてそれに依存する。このページで新たに無限個の選択はしない。
:::

## 反転公式 {#four:sec-bp-inversion}

$\varphi\in B(G)$ の分解 $\varphi=\sum_{k}a_{k}\varphi_{k}$（$\varphi_{k}$ は正定値で、\ref{four:bp-bochner.1} の測度 $\nu_{k}$ をもつ）を固定し、有界連続な $u$ に $\Lambda_{\varphi}(u)\defeq\sum_{k}a_{k}\int u\,d\nu_{k}$ とおく。\ref{four:bp-measure-transform.2} から
$$
\Lambda_{\varphi}(\hat h)=\int h(x)\varphi(x^{-1})\,dx\qquad(h\in L^{1}(G))
\label{four:eq-bp-lambda}
$$
が成り立ち、$|\Lambda_{\varphi}(u)|\le M_{\varphi}\|u\|_{\infty}$（$M_{\varphi}\defeq\sum|a_{k}|\nu_{k}(\hat G)$）である。\eqref{four:eq-bp-lambda} の右辺は分解によらないので、\ref{four:bp-fourier-dense.2} から $C_{0}(\hat G)$ 上の $\Lambda_{\varphi}$ は分解によらない。

::: lemma 正値なフーリエ変換 {#four:bp-positive-on-compact keywords="positive definite g with hat g > 0 on a compact set" index="正値なフーリエ変換をもつ関数|せいちなふーりえへんかんをもつかんすう"}
$C\subset\hat G$ がコンパクトなら、正定値な $g\in C_{c}(G)$ で、$\hat g\ge0$ かつ $C$ 上 $\hat g>0$ となるものがある。$C\ne\varnothing$ なら $g(e)>0$。
:::

::: proof
各 $\xi_{0}\in C$ に、$h_{\xi_{0}}\ne0$ と \ref{four:rm-cc-dense} から $\hat f(\xi_{0})\ne0$ の $f\in C_{c}(G)$ がある。コンパクト性から有限個の $f_{i}$ で $C\subset\bigcup\{\hat f_{i}\ne0\}$ とし、$g\defeq\sum_{i}f_{i}*f_{i}^{*}\in C_{c}(G)$（\ref{four:ga-convolution.2}）とする。すると $g(x)=\sum_{i}\langle f_{i},L_{x}f_{i}\rangle$ は正定値であり（\ref{four:bp-pd-basic.3}）、$\hat g=\sum|\hat f_{i}|^{2}$ は $0$ 以上で、$C$ の各点でどれかの項が正なので $C$ 上で正である（\ref{four:bp-fourier-dense.1}）。また $f_{i}\ne0$ なので $g(e)=\sum\|f_{i}\|_{2}^{2}>0$ である（\ref{four:hm-open-positive}）。
:::

::: theorem 反転公式（局所コンパクト可換群） {#four:bp-inversion keywords="Fourier inversion theorem on LCA groups, dual measure" index="反転公式（局所コンパクト可換群）|はんてんこうしききょくしょこんぱくとかかんぐん, 双対測度|そうついそくど" refname="反転公式（局所コンパクト可換群）"}
$\hat G$ のハール測度 $d\xi$ で、各 $f\in B^{1}(G)$ について $\hat f\in L^{1}(\hat G)$ かつ
$$
f(x)=\int_{\hat G}\hat f(\xi)\xi(x)\,d\xi\qquad(x\in G)
$$
となるものがただ一つある。これを $\mu$ の**双対測度**という。
:::

::: intuition
正定値関数の組み合わせで可積分な関数は、フーリエ変換に\term[指標]{four:lc-character}を掛けて双対群上で積分すると元に戻る。
:::

::: proof
**Step 1.** 【主張：$f,g\in B^{1}(G)$ なら、すべての $u\in C_{0}(\hat G)$ で $\Lambda_{f}(\hat gu)=\Lambda_{g}(\hat fu)$】 $h\in L^{1}(G)$ について \eqref{four:eq-bp-lambda} と \ref{four:lc-fourier-basic.2} から $\Lambda_{f}(\hat g\hat h)=\int(h*g)(y)f(y^{-1})\,dy$。$h,g$ を \ref{four:ga-measurability.3} の代表にとると、\ref{four:ga-measurability.4}・\ref{four:ga-measurability.5} で順序を交換でき（$f$ は有界）、$y=zw$ と変数変換して
$$
\Lambda_{f}(\hat g\hat h)=\int h(z)\int g(w)f(w^{-1}z^{-1})\,dw\,dz.
$$
内側は $w\mapsto z^{-1}w^{-1}$ と変数変換すると $\int f(w)g(w^{-1}z^{-1})\,dw$ に等しいので、右辺は $f,g$ について対称であり、$\Lambda_{f}(\hat g\hat h)=\Lambda_{g}(\hat f\hat h)$ となる。$\{\hat h\}$ の稠密性（\ref{four:bp-fourier-dense.2}）と $\Lambda_{f},\Lambda_{g}$ の連続性から、一般の $u\in C_{0}(\hat G)$ でも等式が成り立つ。

**Step 2.** 【主張：$\psi\in C_{c}(\hat G)$ について、$\supp\psi$ 上で $\hat g>0$ の正定値な $g\in C_{c}(G)$（\ref{four:bp-positive-on-compact}）をとり $I(\psi)\defeq\Lambda_{g}(\psi/\hat g)$ とおくと、$I$ は $g$ によらない $0$ でない正値線形汎関数】 $\psi/\hat g$ は $\{\hat g>0\}$ の外で $0$ と定める（連続）。$g_{1},g_{2}$ が条件を満たせば、Step 1 を $u=\psi/(\hat g_{1}\hat g_{2})$ に使って $\Lambda_{g_{1}}(\psi/\hat g_{1})=\Lambda_{g_{1}}(\hat g_{2}u)=\Lambda_{g_{2}}(\hat g_{1}u)=\Lambda_{g_{2}}(\psi/\hat g_{2})$。線形性は共通の $g$ を使えばよく、$\nu_{g}\ge0$ から正値。$C=\{1\}$ の $g$ は $\nu_{g}(\hat G)=g(e)>0$ なので $\int\theta\,d\nu_{g}>0$ の $\theta\prec\hat G$ があり（\ref{four:rm-riesz-markov-kakutani.3}）、$\supp\theta$ 上正の $g'$ について Step 1 から $I(\theta\hat g)=\Lambda_{g'}(\hat g\theta/\hat g')=\Lambda_{g}(\theta)>0$。

**Step 3.** 【主張：$I$ は平行移動で不変】 $\eta\in\hat G$, $(L_{\eta}\psi)(\zeta)\defeq\psi(\overline{\eta}\zeta)$ とし、$g$ を Step 2 のものとすると、$g'\defeq\eta g$ は正定値（\ref{four:bp-pd-basic.2}）、$\hat g'(\zeta)=\hat g(\overline{\eta}\zeta)$ は $\eta\supp\psi=\supp L_{\eta}\psi$ 上で正。$\eta g(x)=\int(\eta\xi)(x)\,d\nu_{g}(\xi)$ と \ref{four:bp-bochner.1} の一意性から、$\nu_{g'}$ は $\nu_{g}$ の $\xi\mapsto\eta\xi$ による像。\ref{four:hm-transport} から
$$
I(L_{\eta}\psi)=\int\frac{\psi(\overline{\eta}\zeta)}{\hat g(\overline{\eta}\zeta)}\,d\nu_{g'}(\zeta)=\int\frac{\psi(\xi)}{\hat g(\xi)}\,d\nu_{g}(\xi)=I(\psi).
$$
\ref{four:hm-existence-uniqueness.3} から $I(\psi)=\int\psi\,d\xi$ となるハール測度 $d\xi$ がある。

**Step 4.** 【主張：$f\in B^{1}(G)$, $u\in C_{c}(\hat G)$ なら $\Lambda_{f}(u)=\int u\hat f\,d\xi$】 $\supp u$ 上正の $g$ をとると、Step 1 から $\Lambda_{f}(u)=\Lambda_{f}(\hat g\cdot u/\hat g)=\Lambda_{g}(\hat fu/\hat g)=I(u\hat f)$。

**Step 5.** 【主張：$\int|\hat f|\,d\xi\le M_{f}$】 $C_{m}\defeq\{|\hat f|\ge1/m\}$ はコンパクトである（\ref{four:lc-riemann-lebesgue}）。$C_{m}\prec\theta$ をとり（\ref{four:rm-urysohn}）、$u\defeq\theta\overline{\hat f}/\max(|\hat f|,1/m)$ に Step 4 を使うと
$$
\int_{C_{m}}|\hat f|\,d\xi\le\int u\hat f\,d\xi=\Lambda_{f}(u)\le M_{f}.
$$
$C_{m}\uparrow\{\hat f\ne0\}$ なので、単調収束定理（\ref{meas:monotone-convergence}）から $\int|\hat f|\,d\xi\le M_{f}$ を得る。

**Step 6.** 【主張：反転公式】 $x\in G$, $\varepsilon>0$ とする。$\nu_{k}$ の内部正則性（\ref{four:rm-radon-measure}）と Step 5 から、コンパクトな $C$ で $\nu_{k}(\hat G\setminus C)<\varepsilon$（すべての $k$）、$\int_{\hat G\setminus C}|\hat f|\,d\xi<\varepsilon$ となるものをとる。$C\prec\theta\prec\hat G$ とし、$u(\xi)\defeq\theta(\xi)\xi(x)$ に Step 4 を使うと、
$$
\Bigl|f(x)-\int\hat f(\xi)\xi(x)\,d\xi\Bigr|\le|\Lambda_{f}((1-\theta)\xi(x))|+\int(1-\theta)|\hat f|\,d\xi\le\varepsilon\Bigl(\sum_{k}|a_{k}|+1\Bigr).
$$
ここで $\Lambda_{f}(\xi\mapsto\xi(x))=\sum a_{k}\varphi_{k}(x)=f(x)$ を使った。$\varepsilon$ は任意なので反転公式が成り立つ。

**Step 7.** 【主張：一意性】 $c\,d\xi$ も条件を満たせば、\ref{four:bp-positive-on-compact}（$C=\{1\}$）の $g$ について $0<g(e)=\int\hat g\,d\xi=c\int\hat g\,d\xi$ なので $c=1$。

::: hypcheck
- **$f\in B(G)$**：Step 1 の \eqref{four:eq-bp-lambda} と Step 6 に使った。外すと $\hat f$ は可積分とは限らない（$\mathbb{R}$ 上の区間の指示関数）。
- **$f\in L^{1}$**：Step 1 の順序交換に使った。
:::
:::

::: supplement
**前提を変えると.**
- **ハール測度の取り替え.** $\mu$ を $c\mu$（$c>0$）に替えるとフーリエ変換は $c$ 倍になるので、一意性から双対測度は $c^{-1}d\xi$ になる。$\mu$ と双対測度の「積」は正規化によらない。$\mathbb{R}$ で\term[指標]{four:lc-character}を $e^{ixt}$ と書くと双対測度は $dt/2\pi$ になり、公式に $1/2\pi$ が現れる（\ref{four:prob-il-other-normalization}）。
- **$f\in B^{1}(G)$ を弱めると.** 「$f\in L^{1}(G)$ かつ $\hat f\in L^{1}(\hat G)$」を仮定すれば、反転公式はほとんどすべての $x$ で成り立ち、右辺は $B(G)$ に属する\term[連続関数]{top:continuous}である（\ref{four:bp-inversion-l1}。$\mathbb{R}$ では \ref{four:inversion-theorem}）。$f\in L^{1}(G)$ だけでは $\hat f$ は可積分とは限らない（hypcheck）。
- **非可換群.** コンパクト群では、\ref{four:cg-peter-weyl} の補足の式 $f(x)=\sum_{\pi}d_{\pi}\tr\bigl(\hat f(\pi)\pi(x)\bigr)$ が反転公式にあたり、双対測度の役を「既約表現 $\pi$ に重み $d_{\pi}$」が担う。$\widehat G$ は群でないが、重み（測度）は残る。局所コンパクトで単模な群のうち「I 型」と呼ばれる群（連結な半単純リー群や連結な冪零リー群を含む）では、既約表現の同値類の空間の上の**プランシュレル測度**による反転公式とプランシュレルの定理が知られている（ここでは扱わない）。

**似た定理.**
- **$\mathbb{R}$.** \ref{four:bp-examples.1} の同一視のもとで、このページの公式は \ref{four:inversion-theorem} と一致する。ただし $\mathbb{R}$ ではガウス関数という具体的な総和核で示したのに対し、ここでは正定値関数とボホナーの測度だけを使った。
- **円周とウィーナー環.** $G=\mathbb{T}$ では双対測度は $\mathbb{Z}$ の数え上げ測度（\ref{four:bp-examples.2}）で、公式は $f=\sum_{n}\hat f(n)e_{n}$、Step 5 は $\sum_{n}|\hat f(n)|<\infty$ を与える。逆に $\sum_{n}|a_{n}|<\infty$ なら、$a_{n}$ を $0$ 以上の 4 つの数列の一次結合に分けると、$\sum_{n}a_{n}e_{n}$ は連続な正定値関数（\ref{four:bp-bochner.2}、離散な測度）の一次結合なので $B(\mathbb{T})$ に属する。よって $B(\mathbb{T})$ はちょうどフーリエ級数が絶対収束する\term[連続関数]{top:continuous}の全体（ウィーナー環）であり、反転公式は \ref{four:absolutely-convergent} と同じ内容になる。
- **ポアソン和公式.** $\mathbb{R}$ のポアソン和公式（\see{four:poisson-summation}）は、閉部分群 $\mathbb{Z}\subset\mathbb{R}$ とその消去群（\see{four:pd-annihilator}）$\mathbb{Z}\subset\hat{\mathbb{R}}$ についての反転公式の変種である。一般に閉部分群 $H\subset G$ について、測度を適切に正規化すると、適当な条件のもとで $\int_{H}f=\int_{H^{\perp}}\hat f$ となることが知られている（ここでは証明しない）。

**高い視点：双対測度は「デルタ関数のスペクトル」.** 証明の Step 4 は、$g\in B^{1}(G)$ が正定値なら、そのボホナーの測度が $d\nu_{g}=\hat g\,d\xi$ であること（$u\in C_{c}(\hat G)$ について $\int u\,d\nu_{g}=\int u\hat g\,d\xi$）を言っている。双対測度は、どの $g$ についても「$\nu_{g}$ を $\hat g$ で割ったもの」として同じものになる測度で、Step 2・3 はまさにこの割り算で $d\xi$ を作った。$G$ が離散で $\mu$ が数え上げ測度なら $\mathbf{1}_{\{e\}}$ 自身が正定値で $\hat{\mathbf{1}}_{\{e\}}\equiv1$ なので、双対測度は $\mathbf{1}_{\{e\}}$ のボホナーの測度そのものである（\ref{four:bp-examples.3} の証明）。比喩でいえば、正定値関数のボホナーの測度はその「パワースペクトル」で、双対測度は、単位元に集中した理想的な衝撃（デルタ関数）のスペクトル、すなわちどの周波数にも等しい強さをもつ「白色雑音」のスペクトルである。$G$ が離散でないとデルタ関数は関数でないので、実在する $g$ のスペクトルを $\hat g$ で割って平らにする、というのが証明の工夫である。$\mu$ を $c$ 倍にすると、$\int\delta\,d\mu=1$ となる衝撃 $\delta$ の高さが $c^{-1}$ 倍になり、平らなスペクトルの高さも $c^{-1}$ 倍になる。これが前の項目の $c^{-1}$ である。
:::

::: proposition 可積分なフーリエ変換をもつ関数の反転公式 {#four:bp-inversion-l1 keywords="Fourier inversion for f in L^1 with integrable Fourier transform, almost everywhere" index="反転公式（可積分な関数）|はんてんこうしきかせきぶんなかんすう"}
$f\in L^{1}(G)$ で $\hat f\in L^{1}(\hat G)$ とし、$F(x)\defeq\int_{\hat G}\hat f(\xi)\xi(x)\,d\xi$ とおく。
1. $F\in B(G)$ で、$F$ は連続である。
2. ほとんどすべての $x$ で $f(x)=F(x)$ である。したがって $f$ は $B^{1}(G)$ の元 $F$ を代表にもつ。
:::

::: proof
**Step 1.** 【主張：1】 $\hat f=\sum_{j=0}^{3}i^{j}p_{j}$ と、$0$ 以上の $p_{j}\in L^{1}(\hat G)$ に分ける（実部・虚部の正の部分と負の部分）。$F_{j}(x)\defeq\int p_{j}(\xi)\xi(x)\,d\xi$ は \ref{four:bp-measure-transform.1} から連続であり、$\xi(x_{a}x_{b}^{-1})=\xi(x_{a})\overline{\xi(x_{b})}$ から $\sum_{a,b}c_{a}\overline{c_{b}}F_{j}(x_{a}x_{b}^{-1})=\int|\sum_{a}c_{a}\xi(x_{a})|^{2}p_{j}\,d\xi\ge0$ となるので正定値である。ゆえに $F=\sum_{j}i^{j}F_{j}\in B(G)$ である。

**Step 2.** 【主張：正定値な $k\in C_{c}(G)$ について、すべての $x$ で $(f*k)(x)=(F*k)(x)=\int\hat f\hat k\,\xi(x)\,d\xi$】 $f\in L^{1}$ と $k$, $F$ の有界性から、両辺の畳み込みの積分はすべての $x$ で絶対収束する。$k\in B^{1}(G)$ なので、\ref{four:bp-inversion} から $\hat k\in L^{1}(\hat G)$ で、$k(z)=\int\hat k(\xi)\xi(z)\,d\xi$ である。$x$ を固定し $k_{x}(\xi)\defeq\hat k(\xi)\xi(x)$ とおくと、$k(y^{-1}x)=\int k_{x}(\xi)\xi(y^{-1})\,d\xi=\check k_{x}(y^{-1})$ なので、\ref{four:bp-measure-transform.2}（$\lambda=d\xi$）から
$$
(f*k)(x)=\int f(y)\check k_{x}(y^{-1})\,dy=\int\hat f\,k_{x}\,d\xi=\int\hat f\hat k\,\xi(x)\,d\xi
$$
となる。一方、反転不変性から $(F*k)(x)=\int F(y^{-1})k(yx)\,dy$ であり、$m(y)\defeq k(yx)$ とおくと $\hat m(\xi)=\xi(x)\hat k(\xi)$（\ref{four:lc-fourier-basic.3}）である。$F=\check{(\hat f)}$ なので、\ref{four:bp-measure-transform.2} を $m$ と $\hat f$ に使うと $(F*k)(x)=\int\hat m\hat f\,d\xi=\int\hat f\hat k\,\xi(x)\,d\xi$ となる。

**Step 3.** 【主張：コンパクトな $K\subset G$ について $\int_{K}|f-F|\,dx=0$】 $\varepsilon>0$ とする。\ref{four:ga-approximate-identity}（$f$, $p=1$）の近傍を $V_{0}$ とする。$e$ の対称なコンパクト近傍 $W$ をとり、$KW\prec\theta$ となる $\theta\in C_{c}(G)$（\ref{four:rm-urysohn}）をとって、$\theta F\in C_{c}(G)$ に \ref{four:hm-uniform-continuity} を使い、$s\in V_{1}$ なら $\|L_{s}(\theta F)-\theta F\|_{\infty}\le\varepsilon$ となる $V_{1}$ をとる。$VV^{-1}\subset V_{0}\cap V_{1}\cap W$ となる $e$ の近傍 $V$ と、$\psi\in C_{c}(G)^{+}$, $\int\psi=1$, $\supp\psi\subset V$ をとり、$k\defeq\psi*\psi^{*}$ とおく。$k$ は正定値（\ref{four:bp-pd-basic.3}）で、$k\ge0$, $\supp k\subset VV^{-1}$, $\int k=\hat k(1)=|\hat\psi(1)|^{2}=1$ である（\ref{four:lc-fourier-basic.2}, \ref{four:bp-fourier-dense.1}）。よって $\|f*k-f\|_{1}=\|k*f-f\|_{1}\le\varepsilon$ である。また $x\in K$ なら、変数変換 $y\mapsto xz^{-1}$ により
$$
|(F*k)(x)-F(x)|=\Bigl|\int k(z)\bigl(F(xz^{-1})-F(x)\bigr)\,dz\Bigr|\le\sup_{z\in VV^{-1}}\bigl|L_{z}(\theta F)(x)-(\theta F)(x)\bigr|\le\varepsilon
$$
となる（$xz^{-1}\in KW$ では $\theta=1$）。Step 2 から $f*k=F*k$ なので、$\int_{K}|f-F|\le\|f-f*k\|_{1}+\mu(K)\sup_{K}|F*k-F|\le\varepsilon(1+\mu(K))$ を得る。

**Step 4.** 【主張：2】 $E\defeq\{f\ne F\}$ とする（$f$ はボレル可測な代表）。Step 3 から、コンパクトな $K$ について $\mu(K\cap E)=0$ であり、$\int_{K}|F|\le\int_{K}|f|\le\|f\|_{1}$ である。開集合 $O_{n}\defeq\{|F|>1/n\}$ に含まれるコンパクトな $K$ は $\mu(K)\le n\int_{K}|F|\le n\|f\|_{1}$ を満たすので、開集合での内部正則性（\ref{four:rm-radon-measure}）から $\mu(O_{n})\le n\|f\|_{1}$ である。チェビシェフの不等式から $\mu(\{|f|>1/n\})\le n\|f\|_{1}$ でもあるので、$S_{n}\defeq\{|f|>1/n\}\cup O_{n}$ は測度有限である。$E\cap S_{n}$ のコンパクトな部分集合はすべて零集合なので、\ref{four:rm-finite-inner-regular} から $\mu(E\cap S_{n})=0$ となる。$E\subset\bigcup_{n}S_{n}$ なので $\mu(E)=0$ である。ゆえに $F$ は可積分で、$F\in B^{1}(G)$ である。

::: hypcheck
- **$\hat f\in L^{1}(\hat G)$**：Step 1 で $F$ を定義し、Step 2 で \ref{four:bp-measure-transform.2} を使うのに使った。
- **$f\in L^{1}(G)$**：Step 2 の \ref{four:bp-measure-transform.2}、Step 3 の近似単位元、Step 4 の測度の評価に使った。
- **可換性**：$k*f=f*k$（Step 3）と、双対群・反転公式全体に使った。
:::
:::

## プランシュレルの定理 {#four:sec-bp-plancherel}

以下 $\hat G$ には双対測度を入れる。

::: theorem プランシュレルの定理（局所コンパクト可換群） {#four:bp-plancherel keywords="Plancherel theorem for LCA groups, unitary Fourier transform L^2(G) -> L^2(hat G)" index="プランシュレルの定理（局所コンパクト可換群）|ぷらんしゅれるのていりきょくしょこんぱくとかかんぐん" refname="プランシュレルの定理（局所コンパクト可換群）"}
1. $f\in L^{1}(G)\cap L^{2}(G)$ なら $\hat f\in L^{2}(\hat G)$ で $\|\hat f\|_{2}=\|f\|_{2}$。
2. $f\mapsto\hat f$ はユニタリ作用素（全単射な線形等長写像）$\mathcal{F}\colon L^{2}(G)\to L^{2}(\hat G)$ に一意に延び、$\langle\mathcal{F}f,\mathcal{F}g\rangle=\langle f,g\rangle$。
:::

::: intuition
二乗可積分な関数のエネルギーはフーリエ変換で保たれ、双対群上の二乗可積分関数はどれもちょうど一つの関数のフーリエ変換である。
:::

::: proof
**Step 1.** 【主張：1】 $h(x)\defeq\langle f,L_{x}f\rangle$ は連続な正定値関数で $f*f^{*}$ の代表（\ref{four:bp-pd-basic.3}）なので $h\in B^{1}(G)$ であり、$\hat h=|\hat f|^{2}$ である（\ref{four:lc-fourier-basic.2}, \ref{four:bp-fourier-dense.1}）。\ref{four:bp-inversion} で $x=e$ とおくと $\|f\|_{2}^{2}=h(e)=\int|\hat f|^{2}\,d\xi$ を得る。

**Step 2.** 【主張：$\mathcal{F}$ は等長な延長をもち、像は閉部分空間】 $L^{1}\cap L^{2}\supset C_{c}(G)$ は $L^{2}(G)$ で稠密（\ref{four:rm-cc-dense}）なので、1 と $L^{2}(\hat G)$ の完備性（\ref{meas:riesz-fischer}）から、コーシー列の極限として等長な $\mathcal{F}$ がただ一つ定まる。内積の保存は分極恒等式から従う。像は完備な空間の等長像なので完備であり、閉である。

**Step 3.** 【主張：$w\in L^{2}(\hat G)$ が像に直交すれば、各 $f\in L^{1}\cap L^{2}$ について a.e. で $\hat f\overline{w}=0$】 $k\defeq\hat f\overline{w}$ とおくと、コーシー–シュワルツの不等式から $k\in L^{1}(\hat G)$ である。$x\in G$ について $L_{x}f\in L^{1}\cap L^{2}$, $\widehat{L_{x}f}=\overline{\xi(x)}\hat f$（\ref{four:lc-fourier-basic.3}）なので
$$
0=\langle\widehat{L_{x}f},w\rangle=\int k(\xi)\overline{\xi(x)}\,d\xi=\check k(x^{-1}).
$$
すべての $x$ でこれが $0$ なので、\ref{four:bp-measure-transform.3} から a.e. で $k=0$ である。

**Step 4.** 【主張：像は $L^{2}(\hat G)$ 全体】 Step 3 の $w$ について、$E_{n}\defeq\{|w|>1/n\}$ はチェビシェフの不等式から測度有限である。コンパクトな $C\subset E_{n}$ に \ref{four:bp-positive-on-compact} の $g$ をとると、Step 3 から $C$ 上 a.e. で $w=0$ なので $C$ は零集合。\ref{four:rm-finite-inner-regular} から $E_{n}$ も零集合であり、a.e. で $w=0$ となる。ゆえに像を $M$ とすると $M^{\perp}=0$ であり、$M$ は閉なので \ref{fa:orthogonal-decomposition.2} から $M=L^{2}(\hat G)$ である。

::: hypcheck
- **双対測度**：Step 1 で使った。ほかのハール測度 $c\,d\xi$ では $\|\hat f\|_{2}=\sqrt{c}\|f\|_{2}$。
- **全射性**：Step 3 では関数 $\xi\mapsto\xi(x)$ が $\hat G$ 上の測度を決めること（\ref{four:bp-measure-transform.3}）だけを使い、双対定理は使っていない。
:::
:::

::: supplement
**似た定理.**
- **$\mathbb{R}$.** \ref{four:bp-examples.1} から、$G=\mathbb{R}$ では \ref{four:plancherel} そのものである。
- **円周と整数（フーリエ級数の $L^{2}$ 理論）.** $G=\mathbb{T}$ では双対測度は $\mathbb{Z}$ の数え上げ測度なので $L^{2}(\hat G)=\ell^{2}(\mathbb{Z})$ で、2 は $L^{2}(\mathbb{T})\cong\ell^{2}(\mathbb{Z})$（\ref{four:l2-theory.3}）になる。$G=\mathbb{Z}$ では同じ同型を逆向きに読んだもの（$\ell^{2}(\mathbb{Z})\to L^{2}(\mathbb{T})$）になる。違いは証明の形にある。コンパクト群 $G$ では\term[指標]{four:lc-character}そのものが $L^{2}(G)$ に入り、$\mathcal{F}\xi=\mathbf{1}_{\{\xi\}}$（\ref{four:prob-lc-orthogonality}）なので、2 は「指標の全体が $L^{2}(G)$ の正規直交基底である」（\ref{four:l2-theory.1}）と同値である。コンパクトでない $G$ では指標は $L^{2}(G)$ に入らず、正規直交基底による展開の和が双対群の上の積分に替わる。いわば「連続な正規直交基底」である。
- **有限可換群.** $G$ に数え上げ測度を入れると双対測度は各点 $1/|G|$（\ref{four:bp-examples.3}）なので、$\sum_{x}|f(x)|^{2}=\frac{1}{|G|}\sum_{\xi}|\hat f(\xi)|^{2}$。離散フーリエ変換を $1/\sqrt{|G|}$ 倍したものが\term[ユニタリ]{lin:adjoint}行列であるということである。
- **コンパクト群.** 非可換なコンパクト群では \ref{four:cg-peter-weyl} が対応する主張で、$\|f\|_{2}^{2}=\sum_{\pi}d_{\pi}\tr\bigl(\hat f(\pi)^{*}\hat f(\pi)\bigr)$（\ref{four:cg-peter-weyl} の補足）がプランシュレルの等式にあたる。

**前提を変えると.**
- **$p\ne2$.** $1\le p\le2$, $1/p+1/p'=1$ なら、\ref{four:lc-fourier-basic.1}（$p=1$）と 1（$p=2$）を補間して、ハウスドルフ–ヤングの不等式 $\|\hat f\|_{p'}\le\|f\|_{p}$（$f\in L^{1}\cap L^{p}$）が局所コンパクト可換群でも成り立つことが知られている（$\mathbb{R}^{d}$ での補間の議論は \see{four:riesz-thorin}, \see{four:hausdorff-young}。一般の場合はここでは証明しない）。$p>2$ では、$\mathbb{R}$ 上の $L^{p}$ の関数のフーリエ変換は一般に関数としては定まらず、超関数としてしか意味をもたないことが知られている。
- **双対測度以外のハール測度.** hypcheck のとおり、等長性は定数倍だけずれる。ユニタリになる正規化は双対測度ただ一つである。

**高い視点：平行移動の同時対角化.** \ref{four:lc-fourier-basic.3} から $\mathcal{F}L_{x}\mathcal{F}^{-1}$ は $L^{2}(\hat G)$ 上の「$\overline{\xi(x)}$ を掛ける作用素」である。つまりプランシュレルの定理は、互いに可換なユニタリ作用素の族 $\{L_{x}\}_{x\in G}$（左正則表現）を、ただ一つのユニタリ作用素 $\mathcal{F}$ で一斉に「対角化」する。有限群ではこれは、可換なユニタリ行列の族が共通の固有ベクトルからなる正規直交基底をもつことで、巡回群 $\mathbb{Z}/n\mathbb{Z}$ では「巡回行列はすべて離散フーリエ変換で対角化される」ことになる。\term[指標]{four:lc-character} $\xi$ は「すべての平行移動の共通の固有ベクトル」（$L_{x}\xi=\overline{\xi(x)}\,\xi$）だが、コンパクトでない $G$ では $L^{2}(G)$ に入らないので、固有ベクトルによる展開がスペクトル定理（\see{fa:spectral-theorem-bounded}）のような積分の形になる。$G=\mathbb{R}$ なら、$L_{t}$ を生成する微分作用素 $-d/dx$ が $\mathcal{F}$ で $-2\pi iy$ を掛ける作用素に変わり、これは一径数ユニタリ群についてのストーンの定理（\see{fa:stone-theorem}）の具体例である。一般に局所コンパクト可換群の強連続なユニタリ表現は、$\hat G$ 上の射影値測度と一対一に対応することが知られている（ここでは証明しない）。畳み込み作用素 $\lambda(f)g=f*g$ も $\hat f$ を掛ける作用素に変わり、$\hat f$ は連続でハール測度は空でない開集合で正（\ref{four:hm-open-positive}）なので $\|\lambda(f)\|=\|\hat f\|_{\infty}$。前のページの補足の群 C* 環のノルムは、左正則表現だけで測っても同じ値になるわけである。

比喩でいえば、$\mathcal{F}$ はプリズムである。平行移動で形を変えない仕組み（畳み込み、平行移動）は、プリズムを通すと各周波数の成分を何倍かするだけの単純な操作に分かれ、エネルギー（$L^{2}$ ノルム）はプリズムの前後で変わらない。
:::


## 双対測度の例 {#four:sec-bp-examples}

::: proposition 双対測度の例 {#four:bp-examples keywords="dual measures for R, T, Z and finite groups" index="双対測度の例|そうついそくどのれい"}
1. $G=\mathbb{R}$（ルベーグ測度）の双対測度は、\ref{four:lc-basic-duals.3} で $\hat G=\mathbb{R}$ と見てルベーグ測度。$\mathcal{F}$ は \ref{four:plancherel} の作用素と一致する。
2. $G$ がコンパクトで $\mu(G)=1$ なら、双対測度は（離散群 $\hat G$ の）数え上げ測度。$G=\mathbb{T}$ では \ref{four:bp-plancherel.2} は \ref{four:l2-theory.3} になる。
3. $G$ が離散で $\mu$ が数え上げ測度なら、双対測度はコンパクト群 $\hat G$ の全測度 $1$ のハール測度。$G$ が有限なら各点の測度は $1/|G|$。
:::

::: proof
\ref{four:bp-inversion} の一意性から、$0$ でない一つの $f\in B^{1}(G)$ で公式を確かめればよい。

**1.** $\hat G\cong\mathbb{R}$ のハール測度は、ある $c>0$ について $c\,dy$ である（\ref{four:hm-examples.1}）。$f(x)\defeq e^{-\pi x^{2}}=\int e^{2\pi ixy}e^{-\pi y^{2}}\,dy$（\ref{four:gaussian-transform}）は \ref{four:bp-bochner.2} から正定値で、$\hat f(y)=e^{-\pi y^{2}}$ である。公式で $x=0$ とおくと $1=c\int e^{-\pi y^{2}}\,dy=c$ を得る。$\mathcal{F}$ は $L^{1}\cap L^{2}$ 上一致するので全体で一致する。

**2.** $\hat G$ は離散であり（\ref{four:lc-compact-discrete.1}）、そのハール測度は数え上げ測度の $c$ 倍である。$f\equiv1$ は正定値かつ可積分である。$\xi\ne1$ なら $\xi(y)\ne1$ の $y$ があり、不変性から $\int\overline{\xi}=\overline{\xi(y)}\int\overline{\xi}$ なので $\hat f(\xi)=0$ であり、$\hat f(1)=\mu(G)=1$ である。公式で $x=e$ とおくと $1=c\hat f(1)=c$ を得る。$\mathbb{T}$ では \ref{four:lc-basic-duals.2} の同一視により $\hat f$ はフーリエ係数である。

**3.** $f\defeq\mathbf{1}_{\{e\}}$ について $f(x)=\langle f,L_{x}f\rangle$ なので $f$ は正定値であり、$\hat f\equiv1$ である。公式で $x=e$ とおくと、全測度は $f(e)=1$ となる。$G$ が有限なら $|\hat G|=|G|$（\ref{four:lc-finite-groups}, \ref{grp:dual-group-basic.3}）と不変性から、各点の測度は $1/|G|$ である。
:::

## 問題 {#four:sec-il-problems}

::: problem {#four:prob-bp-uniqueness}
$f\in L^{1}(G)$ で $\hat f\equiv0$ なら $f=0$ であることを、\ref{four:bp-plancherel} を使って示せ。
:::

::: solution
$g\in C_{c}(G)$ なら $f*g\in L^{1}\cap L^{2}$ であり（\ref{four:ga-convolution.1}）、$\widehat{f*g}=\hat f\hat g=0$ なので、\ref{four:bp-plancherel.1} から $\|f*g\|_{2}=0$、すなわち $f*g=0$ である。$\varepsilon>0$ について \ref{four:ga-approximate-identity} の $\psi$ をとると $\psi*f=f*\psi=0$ なので、$\|f\|_{1}=\|\psi*f-f\|_{1}\le\varepsilon$ となる。$\varepsilon$ は任意なので $f=0$ である。
:::

::: problem {#four:prob-il-other-normalization}
1. $\mu$ を $c\mu$（$c>0$）に替えると、双対測度は $c^{-1}$ 倍になることを示せ。
2. $G=\mathbb{R}$（ルベーグ測度 $dx$）の\term[指標]{four:lc-character}を $\eta_{t}(x)\defeq e^{ixt}$（$t\in\mathbb{R}$）と書くとき、$t$ の座標で双対測度は $dt/2\pi$ であることを示し、反転公式を $t$ の座標で書け。また、$\mathbb{R}$ に $dx/\sqrt{2\pi}$ を入れると、双対測度は $dt/\sqrt{2\pi}$ になることを示せ。
:::

::: solution
**1.** $c\mu$ についてのフーリエ変換は $c\hat f$ で、$c\mu$ についても $B^{1}(G)$ は同じ集合である。$\mu$ の双対測度 $d\xi$ について、$f\in B^{1}(G)$ なら $f(x)=\int\hat f\,\xi(x)\,d\xi=\int(c\hat f)\,\xi(x)\,c^{-1}d\xi$ なので、$c^{-1}d\xi$ は $c\mu$ について \ref{four:bp-inversion} の条件を満たし、一意性からそれが双対測度である。

**2.** $\xi_{y}(x)=e^{2\pi ixy}$ と書くと $\eta_{t}=\xi_{t/2\pi}$ である。\ref{four:bp-examples.1} から、$\xi_{y}\leftrightarrow y$ の座標で双対測度は $dy$ なので、$F\in C_{c}(\hat{\mathbb{R}})$ について $\int F\,d\xi=\int F(\xi_{y})\,dy=\int F(\eta_{t})\,\frac{dt}{2\pi}$（$y=t/2\pi$ で置換）。よって $t$ の座標で双対測度は $dt/2\pi$ で、反転公式は
$$
f(x)=\frac{1}{2\pi}\int_{\mathbb{R}}\Bigl(\int_{\mathbb{R}}f(s)e^{-ist}\,ds\Bigr)e^{ixt}\,dt\qquad(f\in B^{1}(\mathbb{R})).
$$
$dx/\sqrt{2\pi}$ は $dx$ の $c=1/\sqrt{2\pi}$ 倍なので、1 から双対測度は $\sqrt{2\pi}\cdot dt/2\pi=dt/\sqrt{2\pi}$ である。このとき $G$ と $\hat G$ の公式は同じ形になる。
:::
