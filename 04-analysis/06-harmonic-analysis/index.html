# フーリエ解析（Fourier Analysis）

フーリエ級数、フーリエ変換、プランシュレルの定理、超関数、調和解析の入口。

<p class="mn-msc">MSC2020: 42A, 42B</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-fourier-series/index.html"><span class="mn-card-title">フーリエ級数</span><span class="mn-card-en">Fourier Series</span><span class="mn-card-desc">円周上のフーリエ係数とリーマン–ルベーグの補題、畳み込みと総和核、フェイェールの定理と一意性、三角関数系の完全性とパーセヴァルの等式、各点収束（ディニの判定法・ディリクレ–ジョルダン）とギブス現象、ζ(2)・一様分布・熱方程式・等周不等式への応用。</span><span class="mn-card-count">5 ページ</span></a>
<a class="mn-card" href="02-fourier-transform/index.html"><span class="mn-card-title">フーリエ変換</span><span class="mn-card-en">Fourier Transform</span><span class="mn-card-desc">ℝᵈ 上の可積分関数のフーリエ変換、リーマン–ルベーグの補題と畳み込み、微分と掛け算の入れ替え、ガウス関数、反転公式とプランシュレルの定理、シュワルツ空間と緩増加超関数、ポアソン和公式と不確定性原理。</span><span class="mn-card-count">5 ページ</span></a>
