# 実解析（Real Analysis）

実数論、一変数の微積分、多変数解析、ベクトル解析。

<p class="mn-msc">MSC2020: 26</p>

## 分野

<div class="mn-cards">
<a class="mn-card" href="01-real-numbers/index.html"><span class="mn-card-title">実数論</span><span class="mn-card-en">Real Numbers and Series</span><span class="mn-card-desc">順序体とアルキメデスの原理、連続の公理とその同値な形（上限・デデキント・単調収束・区間縮小・ボルツァーノ–ワイエルシュトラス・コーシー・ハイネ–ボレル・連結性）、デデキント切断とコーシー列による実数の構成と一意性、数列の極限、級数の収束判定・絶対収束と再配列・コーシー積と二重級数。</span><span class="mn-card-count">6 ページ</span></a>
<a class="mn-card" href="02-calculus/index.html"><span class="mn-card-title">一変数の微積分</span><span class="mn-card-en">Calculus of One Variable</span><span class="mn-card-desc">関数の極限と連続性、中間値・最大値・一様連続、微分と平均値の定理、テイラーの定理、リーマン積分と微分積分学の基本定理、広義積分、一様収束と極限・積分・微分の交換、冪級数、指数関数・対数関数・三角関数・ガンマ関数とスターリングの公式。</span><span class="mn-card-count">11 ページ</span></a>
<a class="mn-card" href="03-multivariable-calculus/index.html"><span class="mn-card-title">多変数解析</span><span class="mn-card-en">Multivariable Calculus</span><span class="mn-card-desc">全微分と連鎖律、テイラーの定理、逆関数定理・陰関数定理、重積分と変数変換、ℝⁿ 上の微分形式とストークスの定理。</span><span class="mn-card-count">11 ページ</span></a>
<a class="mn-card" href="04-vector-analysis/index.html"><span class="mn-card-title">ベクトル解析</span><span class="mn-card-en">Vector Analysis</span><span class="mn-card-desc">曲線の長さと線積分、保存力場とポテンシャル、パラメータ曲面と面積分、勾配・発散・回転、グリーン・ガウス・ストークスの定理（鎖の上のストークスの定理の系として）。</span><span class="mn-card-count">4 ページ</span></a>
</div>
