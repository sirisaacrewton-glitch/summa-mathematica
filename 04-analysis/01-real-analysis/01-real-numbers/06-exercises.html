# 演習：実数論 {#calc:page-exercises-real-numbers keywords="exercises, Real Numbers and Series"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exrealnumbers-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 順序体 {#calc:sec-of-exercises}

対応するページ：\ref{calc:page-ordered-fields}

::: problem ★ 基本：上限と下限の計算 {#calc:ex-of-1}
$A\defeq\{(-1)^{n}+\frac1n:n\ge1\}$ の上限・下限・最大元・最小元を求めよ。
:::

::: solution
$n$ が偶数なら $1+\frac1n$ で、最大は $n=2$ の $\frac32$。$n$ が奇数なら $-1+\frac1n$ で、$n=1$ の $0$ が奇数の中の最大、$n\to\infty$ で $-1$ に近づく。よって $\sup A=\max A=\frac32$、$\inf A=-1$ で、$-1\notin A$ なので最小元はない（任意の $\varepsilon>0$ に $-1+\frac1n<-1+\varepsilon$ となる奇数 $n$ があることがアルキメデス性から従う）。
:::

::: problem ★ 基本：上限の特徴づけの練習 {#calc:ex-of-2}
$\sup\{1-\frac1n:n\ge1\}=1$ を上限の定義から示せ。
:::

::: solution
$1$ は上界（$1-\frac1n<1$）。$c<1$ を上界とすると、アルキメデス性で $\frac1n<1-c$ となる $n$ があり、$1-\frac1n>c$ で矛盾。よって最小の上界は $1$。
:::

::: problem ★★ 標準：有理数体の不完備性 {#calc:ex-of-3}
$\{q\in\mathbb{Q}:q>0,\ q^{2}<2\}$ は $\mathbb{Q}$ で上に有界だが、$\mathbb{Q}$ に上限をもたないことを示せ。
:::

::: solution
上界 $2$。$s\in\mathbb{Q}$ が上限とすると $s^{2}\neq2$（$\sqrt2$ は無理数）。$s^{2}<2$ なら $h\defeq\frac{2-s^{2}}{2s+1}\in(0,1)$ について $(s+h)^{2}<s^{2}+h(2s+1)=2$ で、$s$ より大きな集合の元があり上界でない。$s^{2}>2$ なら $s-\frac{s^{2}-2}{2s}$ はより小さな上界（$(s-h)^{2}>s^{2}-2sh=2$）。どちらも矛盾。
:::

::: problem ★★★ 発展：アルキメデス的順序体での稠密性 {#calc:ex-of-4}
アルキメデス的な順序体 $K$ で、任意の $a<b$ の間に有理数（$\mathbb{Q}\subseteq K$ と見る）があることを示せ。
:::

::: solution
アルキメデス性で $n(b-a)>1$ となる $n\ge1$ をとる。$m\defeq\min\{m\in\Z:m>na\}$（$\{m:m>na\}$ はアルキメデス性で空でなく、下に有界な整数の集合なので最小元がある）。$m-1\le na$ なので $m\le na+1<nb$。よって $a<\frac mn<b$。
:::

## 連続の公理とその同値な形 {#calc:sec-ca-exercises}

対応するページ：\ref{calc:page-continuity-axioms}

::: problem ★ 基本：漸化式で定まる単調列 {#calc:ex-ca-1}
$a_{1}=\sqrt2$, $a_{n+1}=\sqrt{2+a_{n}}$ は収束することを示し、極限を求めよ。
:::

::: solution
帰納法で $0<a_{n}<2$ かつ $a_{n}<a_{n+1}$：$a_{n}<2$ なら $a_{n+1}<\sqrt4=2$、$a_{n+1}^{2}-a_{n}^{2}=2+a_{n}-a_{n}^{2}=(2-a_{n})(1+a_{n})>0$。有界な単調増加列なので収束（単調収束定理）。極限 $\alpha$ は $\alpha=\sqrt{2+\alpha}$, $\alpha\ge0$ をみたし $\alpha=2$。
:::

::: problem ★ 基本：区間縮小法 {#calc:ex-ca-2}
$I_{n}\defeq[1-\frac1n,\ 1+\frac1{n^{2}}]$ の共通部分を求め、開区間 $(0,\frac1n)$ の共通部分と比べよ。
:::

::: solution
$\bigcap_{n}I_{n}=\{1\}$（$1$ はすべてに入り、$x\neq1$ は十分大きい $n$ で外れる）。開区間の場合は $\bigcap(0,\frac1n)=\emptyset$：閉区間であることが区間縮小法の本質的な仮定。
:::

::: problem ★★ 標準：ボルツァーノ–ワイエルシュトラス {#calc:ex-ca-3}
$(\sin n)_{n\ge1}$ は収束する部分列をもつことを示せ。さらに、$[-1,1]$ のどの点にも収束する部分列があることが知られているが、その理由を述べよ（$\pi$ が無理数であることを認めてよい）。
:::

::: solution
有界数列なので BW の定理から収束部分列がある。後半：$\{n\bmod2\pi\}$ は $[0,2\pi)$ で稠密（$\pi$ が無理数なので、$n\mapsto n\bmod2\pi$ の値は相異なり、鳩の巣原理で差が任意に小さい二つがとれ、その差の倍数で区間を細かく埋められる）なので、$\sin$ の連続性から $\{\sin n\}$ は $[-1,1]$ で稠密で、各点に収束する部分列がとれる。
:::

::: problem ★★★ 発展：上限公理からアルキメデス性 {#calc:ex-ca-4}
上限の公理をみたす順序体はアルキメデス的であることを示せ。
:::

::: solution
そうでないとすると $\N$ は上に有界で、上限 $s$ がある。$s-1$ は上界でないので $n>s-1$ となる $n\in\N$ があり、$n+1>s$ で矛盾。
:::

## 実数の構成と一意性 {#calc:sec-rc-exercises}

対応するページ：\ref{calc:page-real-construction}

::: problem ★ 基本：ニュートン法による有理数列 {#calc:ex-rc-1}
$q_{1}=\frac32$, $q_{n+1}=\frac12\bigl(q_{n}+\frac{2}{q_{n}}\bigr)$ の $q_{2},q_{3}$ を求め、$(q_{n})$ が $\sqrt2$ に収束する有理数のコーシー列であることを示せ。
:::

::: solution
$q_{2}=\frac{17}{12}$, $q_{3}=\frac{577}{408}$。相加相乗平均から $q_{n+1}\ge\sqrt2$、$q_{n+1}-\sqrt2=\frac{(q_{n}-\sqrt2)^{2}}{2q_{n}}\le\frac{(q_{n}-\sqrt2)^{2}}{2\sqrt2}$ で、誤差は 2 乗のオーダーで減る。収束列なのでコーシー列で、各項は有理数。
:::

::: problem ★★ 標準：小数展開の一意性 {#calc:ex-rc-2}
$0.999\cdots=1$ を示し、二通りの小数展開をもつ実数は有限小数（$m/10^{k}$ の形）に限ることを示せ。
:::

::: solution
$\sum_{i\ge1}9\cdot10^{-i}=9\cdot\frac{1/10}{1-1/10}=1$。二つの展開が初めて異なる桁を $k$ とし $d_{k}<d'_{k}$ とすると、残りの寄与の差は $10^{-k}$ 以下なので、$d_{k}=d'_{k}-1$ で、片方の以後の桁がすべて $9$、他方がすべて $0$ のときに限り等しい。
:::

::: problem ★★ 標準：デデキント切断 {#calc:ex-rc-3}
$\mathbb{Q}$ の切断 $(A,B)$, $A=\{q:q<0\text{ または }q^{2}<2\}$ は端点をもたない（$A$ に最大元、$B$ に最小元がない）ことを示せ。
:::

::: solution
$\sqrt2\notin\mathbb{Q}$ なので $B=\{q>0:q^{2}>2\}$。$A$ の最大元・$B$ の最小元がないことは、有理数体の不完備性の問題（\ref{calc:ex-of-3}）の計算と同じ。
:::

::: problem ★★★ 発展：完備性から平方根の存在 {#calc:ex-rc-4}
実数の完備性（上限の公理）から、$a>0$ について $x^{2}=a$ となる $x>0$ があることを示せ。
:::

::: solution
$S\defeq\{x>0:x^{2}<a\}$ は空でなく（$\min(1,a)/2\in S$）、上に有界（$1+a$）。$s\defeq\sup S$ について、$s^{2}<a$ や $s^{2}>a$ を仮定すると、有理数の場合（\ref{calc:ex-of-3}）と同じ $h$ の選び方で矛盾する。よって $s^{2}=a$。
:::

## 数列の極限 {#calc:sec-sq-exercises}

対応するページ：\ref{calc:page-sequences}

::: problem ★ 基本：極限の計算 {#calc:ex-sq-1}
次の極限を求めよ。(1) $\lim\frac{n^{2}+3n}{2n^{2}-1}$ (2) $\lim(\sqrt{n^{2}+n}-n)$ (3) $\lim\bigl(1+\frac2n\bigr)^{n}$
:::

::: solution
(1) 分子分母を $n^{2}$ で割って $\frac12$。(2) $\frac{n}{\sqrt{n^{2}+n}+n}=\frac{1}{\sqrt{1+1/n}+1}\to\frac12$。(3) $\bigl(1+\frac2n\bigr)^{n}=\Bigl(\bigl(1+\frac{1}{n/2}\bigr)^{n/2}\Bigr)^{2}\to e^{2}$（$e$ の定義と、連続関数 $y\mapsto y^{2}$）。
:::

::: problem ★ 基本：上極限と下極限 {#calc:ex-sq-2}
$a_{n}=(-1)^{n}\frac{n}{n+1}$ の上極限・下極限を求めよ。
:::

::: solution
偶数番目は $\frac{n}{n+1}\to1$、奇数番目は $\to-1$。$\limsup a_{n}=1$, $\liminf a_{n}=-1$ で、収束しない。
:::

::: problem ★★ 標準：チェザロ平均 {#calc:ex-sq-3}
$a_{n}\to\alpha$ なら $\frac{a_{1}+\cdots+a_{n}}{n}\to\alpha$ を示せ。逆は成り立たないことを例で示せ。
:::

::: solution
$\varepsilon>0$ について $n\ge N$ で $\lvert a_{n}-\alpha\rvert<\varepsilon$。$\Bigl\lvert\frac1n\sum(a_{i}-\alpha)\Bigr\rvert\le\frac1n\sum_{i<N}\lvert a_{i}-\alpha\rvert+\varepsilon$ で、第 1 項は $n\to\infty$ で $0$。逆の反例：$a_{n}=(-1)^{n}$ は平均が $0$ に収束するが収束しない。
:::

::: problem ★★★ 発展：n 乗根の極限 {#calc:ex-sq-4}
$a_{n}>0$ で $\frac{a_{n+1}}{a_{n}}\to\beta$ なら $a_{n}^{1/n}\to\beta$ を示し、$\lim\frac{n}{(n!)^{1/n}}=e$ を導け。
:::

::: solution
$\log a_{n}=\log a_{1}+\sum_{i<n}\log\frac{a_{i+1}}{a_{i}}$ で、チェザロ平均（前問）から $\frac{\log a_{n}}{n}\to\log\beta$（$\beta>0$ の場合。$\beta=0$ は $-\infty$ への発散で同様）。$a_{n}=\frac{n^{n}}{n!}$ とすると $\frac{a_{n+1}}{a_{n}}=\bigl(1+\frac1n\bigr)^{n}\to e$。
:::

## 級数 {#calc:sec-se-exercises}

対応するページ：\ref{calc:page-series}

::: problem ★ 基本：級数の和 {#calc:ex-se-1}
(1) $\sum_{n\ge1}\frac{1}{n(n+1)}$ (2) $\sum_{n\ge1}\frac{n^{2}}{2^{n}}$ を求めよ（(2) は冪級数の項別微分を使ってよい）。
:::

::: solution
(1) 部分分数 $\frac1n-\frac1{n+1}$ で部分和は $1-\frac1{N+1}\to1$。(2) $\sum nx^{n}=\frac{x}{(1-x)^{2}}$, $\sum n^{2}x^{n}=\frac{x(1+x)}{(1-x)^{3}}$（$\lvert x\rvert<1$、項別微分）に $x=\frac12$ を代入して $6$。
:::

::: problem ★ 基本：収束判定 {#calc:ex-se-2}
次の級数の収束・発散を判定せよ。(1) $\sum\frac{n!}{n^{n}}$ (2) $\sum\frac{1}{n\log n}$ (3) $\sum\frac{(-1)^{n}}{\sqrt n}$
:::

::: solution
(1) 比 $\frac{a_{n+1}}{a_{n}}=\bigl(\frac{n}{n+1}\bigr)^{n}\to\frac1e<1$ で収束。(2) 凝縮判定で $\sum2^{k}\frac{1}{2^{k}k\log2}=\sum\frac{1}{k\log2}$ が発散するので発散。(3) $\frac1{\sqrt n}$ は単調に $0$ に収束するのでライプニッツ（交代級数）判定で収束、ただし絶対収束しない。
:::

::: problem ★★ 標準：項が単調な収束級数 {#calc:ex-se-3}
$a_{n}\ge0$ が単調減少で $\sum a_{n}$ が収束すれば $na_{n}\to0$ であることを示せ。
:::

::: solution
コーシーの判定で、$\varepsilon>0$ に $N$ があって $m>N$ なら $\sum_{k=N+1}^{m}a_{k}<\varepsilon$。単調性から $(m-N)a_{m}\le\sum_{N<k\le m}a_{k}<\varepsilon$。$m\ge2N$ なら $m-N\ge\frac m2$ で $ma_{m}<2\varepsilon$。
:::

::: problem ★★★ 発展：再配列で和を変える {#calc:ex-se-4}
$\sum\frac{(-1)^{n+1}}{n}=\log2$ を認めて、正の項 2 個・負の項 1 個の順に並べた級数 $1+\frac13-\frac12+\frac15+\frac17-\frac14+\cdots$ の和が $\frac32\log2$ であることを示せ。
:::

::: solution
$H_{n}=\log n+\gamma+o(1)$（オイラー定数 $\gamma$）を使う。$3n$ 項までの部分和は $\sum_{k\le2n}\frac{1}{2k-1}-\sum_{k\le n}\frac{1}{2k}=\bigl(H_{4n}-\frac12H_{2n}\bigr)-\frac12H_{n}=\log4n-\frac12\log2n-\frac12\log n+o(1)=\frac32\log2+o(1)$。項は $0$ に収束するので、$3n$ 項以外の部分和も同じ極限。
:::
