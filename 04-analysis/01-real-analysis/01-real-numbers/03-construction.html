# 実数の構成と一意性 {#calc:page-real-construction keywords="construction of the real numbers, Cauchy sequences of rationals, completion, Dedekind cuts, uniqueness of complete ordered fields, embedding of Archimedean ordered fields, automorphisms of R, decimal expansion, base b expansion, cardinality of the continuum"}

前ページで、実数体を「連続の公理を満たす順序体（完備順序体）」と定めた。このページでは、そのような順序体が存在し、順序体として同型を除いてただ一つであることを示す。存在は、有理数のコーシー列による構成（**完備化**）で示す。一意性は、アルキメデス的順序体から完備順序体への順序を保つ埋め込みがただ一つあることから従う。集合論で採用したデデキント切断による構成（\ref{set:number-systems-construction}）は、この一意性を通じてコーシー列による構成と同型であることを、切断の演算の明示的な式とともに示す。最後に、小数展開と、実数全体の濃度 $2^{\aleph_{0}}$ を扱う。

> 資料：杉浦光夫『解析入門 I』第 I 章 §3 の問題（完備化、一意性、デデキントの公理）、Rudin『Principles of Mathematical Analysis』第 1 章の付録（デデキント切断）に相当する内容。構成の順序（コーシー列で存在を示し、一意性の写像でデデキント切断の演算を確かめる）は、証明を短くするために自分で組み立てた。

## 記法と定義の確認 {#calc:sec-rc-notation}

::: notation
- 順序体、$\mathbb{Q}$ の埋め込み、アルキメデスの原理、上限：\tref{calc:page-ordered-fields}。順序体の数列、連続の公理の同値な形、完備順序体：\ref{calc:page-continuity-axioms}（とくに \ref{calc:continuity-axioms-equivalent} の (C)+(A) ⇒ (W)）。
- $\mathbb{Z}$, $\mathbb{Q}$ は集合論の標準的な構成（\ref{set:number-systems-construction}）による。$\mathbb{Z}$ は可換環で、$[\langle m,n\rangle]>0\iff m>n$ で順序環（整域）、$\mathbb{Q}$ はその商体（\ref{ring:fraction-field} の構成と同じ）で、順序は \ref{model:fraction-field-order} により一意に延びる。これらの確かめは $\mathbb{N}$ の演算の性質を定義どおりに展開するだけなので省く。
- 有理数の列についての「コーシー列」「$0$ に収束する」は、$\varepsilon$ を正の有理数として定める。単射 $e\colon\mathbb{Q}\to\omega$ を 1 つ固定する（既約分数 $\frac pq$（$q\ge1$）に $(p,q)$ を対応させ、$\mathbb{Z}\times\omega\to\omega$ の明示的な単射と合成する）。以下「最初のもの」は「$e$ の値が最小のもの」の意味。
- シュレーダー＝ベルンシュタインの定理 \tref{set:schroder-bernstein}。
- **公理系**：$\ZF$ で行い、選択公理は使わない（選択が必要に見える箇所は、上の $e$ で「最初のもの」をとる）。
:::

## コーシー列による構成 {#calc:sec-rc-cauchy}

::: construction コーシー列による実数の構成 {#calc:cauchy-construction keywords="the ring of rational Cauchy sequences modulo null sequences; completion of Q" index="コーシー列による実数の構成|こーしーれつによるじっすうのこうせい, 完備化|かんびか"}
有理数のコーシー列の全体を $\mathcal{C}$、$0$ に収束する有理数列（**零列**）の全体を $\mathcal{N}$ とする。$\mathcal{C}$ に項ごとの和と積を入れ、$\mathbb{R}_{\mathcal{C}}\defeq\mathcal{C}/\mathcal{N}$ とおく。$(a_{n})$ の類を $[a_{n}]$ と書く。$[a_{n}]>0$ を「正の有理数 $\delta$ と $N$ があって、$n\ge N$ で $a_{n}\ge\delta$」と定める。有理数 $r$ を定数列の類 $[r]$ と同一視する。
:::

::: lemma コーシー列の環 {#calc:cauchy-ring keywords="rational Cauchy sequences form a commutative ring, null sequences form an ideal, a non-null Cauchy sequence is eventually bounded away from zero with constant sign" index="コーシー列の環|こーしーれつのかん"}
1. $\mathcal{C}$ は項ごとの演算で可換環、$\mathcal{N}$ はそのイデアル。
2. $(a_{n})\in\mathcal{C}\setminus\mathcal{N}$ なら、正の有理数 $\delta$ と $N$ があって、「すべての $n\ge N$ で $a_{n}\ge\delta$」か「すべての $n\ge N$ で $a_{n}\le-\delta$」のどちらかが成り立つ。
:::

::: proof
**1.** コーシー列は有界（\ref{calc:ordered-field-sequences.2} の証明は $\mathbb{Q}$ でそのまま通る）。$(a_{n}),(b_{n})\in\mathcal{C}$ について $|(a_{m}+b_{m})-(a_{n}+b_{n})|\le|a_{m}-a_{n}|+|b_{m}-b_{n}|$、$|a_{n}|,|b_{n}|\le M$ なら
$$
|a_{m}b_{m}-a_{n}b_{n}|\le|a_{m}||b_{m}-b_{n}|+|b_{n}||a_{m}-a_{n}|\le M(|b_{m}-b_{n}|+|a_{m}-a_{n}|)
$$
なので和と積はコーシー列。環の公理は項ごとに $\mathbb{Q}$ から従う。零列の和は零列で、零列 $(z_{n})$ と有界列 $(a_{n})$（$|a_{n}|\le M$）の積は $|a_{n}z_{n}|\le M|z_{n}|$ から零列。零列はコーシー列。

**2.** $(a_{n})$ は零列でないので、正の有理数 $\varepsilon$ で $|a_{n}|\ge\varepsilon$ となる $n$ が無限個あるものがある。コーシー性から $m,n\ge N$ で $|a_{m}-a_{n}|<\frac{\varepsilon}{2}$ となる $N$ をとり、$n_{0}\ge N$ で $|a_{n_{0}}|\ge\varepsilon$ となるものをとる。$a_{n_{0}}\ge\varepsilon$ なら、$n\ge N$ で $a_{n}>a_{n_{0}}-\frac{\varepsilon}{2}\ge\frac{\varepsilon}{2}$。$a_{n_{0}}\le-\varepsilon$ なら同様に $a_{n}<-\frac{\varepsilon}{2}$。$\delta\defeq\frac{\varepsilon}{2}$。
:::

::: theorem コーシー列による構成は完備順序体 {#calc:cauchy-reals-complete keywords="R_C = Cauchy sequences modulo null sequences is a complete ordered field" index="完備順序体の存在|かんびじゅんじょたいのそんざい"}
$\mathbb{R}_{\mathcal{C}}$ は完備順序体で、$r\mapsto[r]$ は \ref{calc:rational-embedding} の埋め込み $\mathbb{Q}\to\mathbb{R}_{\mathcal{C}}$ である。さらに、$(a_{n})\in\mathcal{C}$ について、$\mathbb{R}_{\mathcal{C}}$ の中で $[a_{m}]\to[a_{n}]_{n}$（$m\to\infty$）。
:::

::: proof
**Step 1（体）.** \ref{calc:cauchy-ring.1} から $\mathbb{R}_{\mathcal{C}}$ は可換環で、$[1]\neq[0]$。$x=[a_{n}]\neq0$ なら、\ref{calc:cauchy-ring.2} の $\delta$, $N$ について $b_{n}\defeq a_{n}^{-1}$（$n\ge N$）、$b_{n}\defeq0$（$n<N$）とおくと、$m,n\ge N$ で $|b_{m}-b_{n}|=\frac{|a_{n}-a_{m}|}{|a_{m}||a_{n}|}\le\frac{|a_{n}-a_{m}|}{\delta^{2}}$ なので $(b_{n})\in\mathcal{C}$、$a_{n}b_{n}-1$ は $n\ge N$ で $0$ なので $xy=1$（$y=[b_{n}]$）。

**Step 2（順序）.** 正であることは代表によらない：$(a_{n})$ が $n\ge N$ で $a_{n}\ge\delta$、$(z_{n})$ が零列なら、$|z_{n}|<\frac{\delta}{2}$ となる $n$ 以降 $a_{n}+z_{n}>\frac{\delta}{2}$。正の元の和と積は正（$a_{n}\ge\delta$, $b_{n}\ge\delta'$ なら $a_{n}+b_{n}\ge\delta$, $a_{n}b_{n}\ge\delta\delta'$）。\ref{calc:cauchy-ring.2} から $x\neq0$ なら $x>0$ と $-x>0$ のちょうど一方が成り立ち（両方なら $a_{n}\ge\delta$ と $a_{n}\le-\delta'$ が同時に成り立ち矛盾）、$0$ は正でない。正の錐の性質から $x<y\iff y-x>0$ は順序体の順序。$r<s$（有理数）なら $[s-r]>0$ なので、$r\mapsto[r]$ は順序を保つ環準同型。

**Step 3（列の値と極限）.** $(c_{n})\in\mathcal{C}$ が「$n\ge N$ で $c_{n}\ge0$」を満たせば $[c_{n}]\ge0$（$[c_{n}]<0$ なら $c_{n}\le-\delta$ が十分先で成り立ち矛盾）。$(a_{n})\in\mathcal{C}$、$x\defeq[a_{n}]$、正の有理数 $\varepsilon$ について、$m,n\ge N$ で $|a_{n}-a_{m}|<\varepsilon$ となる $N$ をとると、$m\ge N$ について列 $(\varepsilon-|a_{n}-a_{m}|)_{n}$ は $n\ge N$ で正なので $\varepsilon-|x-[a_{m}]|\ge0$（$|x-[a_{m}]|=[|a_{n}-a_{m}|]_{n}$：絶対値は代表の絶対値の類）。よって $|x-[a_{m}]|\le\varepsilon$（$m\ge N$）。

**Step 4（アルキメデス的）.** $x=[a_{n}]$ で $|a_{n}|\le M$（$M\in\mathbb{N}$）なら、$(M+1-a_{n})\ge1$ なので $x<M+1$。

**Step 5（コーシー完備）.** $(x_{k})$ を $\mathbb{R}_{\mathcal{C}}$ のコーシー列とする。$\mathbb{Q}$ は稠密（Step 4 と \ref{calc:archimedean-equivalents.5}）なので、$|x_{k}-r_{k}|<\frac1k$ となる有理数 $r_{k}$ がある。そのうち最初のもの（$e$ の値が最小のもの）をとる。$|r_{j}-r_{k}|\le\frac1j+|x_{j}-x_{k}|+\frac1k$ なので $(r_{k})$ は有理数のコーシー列（$\varepsilon$ が有理数でも $\mathbb{R}_{\mathcal{C}}$ の元でも、アルキメデス性から同じ）。$x\defeq[r_{k}]$ とおくと Step 3 から $r_{k}\to x$、よって $|x_{k}-x|\le\frac1k+|r_{k}-x|\to0$。(C)+(A) から \ref{calc:continuity-axioms-equivalent} により完備順序体。

::: hypcheck
- **選択公理**：Step 5 で $r_{k}$ を $e$ による最初のものとして定め、使わなかった。
- **アルキメデス性**：Step 5 の $\mathbb{Q}$ の稠密性と、(C) から (W) を導くのに使った（\ref{calc:laurent-series-field} が示すように、(C) だけでは足りない）。
:::
:::

## 一意性 {#calc:sec-rc-uniqueness}

::: theorem アルキメデス的順序体の埋め込み {#calc:archimedean-embedding keywords="every Archimedean ordered field embeds uniquely into a complete ordered field by x -> sup of rationals below x; the embedding is onto iff the source is complete" index="アルキメデス的順序体の埋め込み|あるきめですてきじゅんじょたいのうめこみ"}
$K$ をアルキメデス的順序体、$L$ を完備順序体とする（$\mathbb{Q}\subset K$, $\mathbb{Q}\subset L$）。
1. $\phi(x)\defeq\sup_{L}\{r\in\mathbb{Q}\mid r<x\}$ は、順序を保つ単射な環準同型 $K\to L$ である。
2. 順序を保つ環準同型 $K\to L$ は $\phi$ だけである。
3. $\phi$ が全射 $\iff$ $K$ は完備。
:::

::: proof
$D(x)\defeq\{r\in\mathbb{Q}\mid r<x\}$ とおく。$K$ はアルキメデス的なので $D(x)$ は空でなく、$x$ より大きい有理数で上に有界。

**Step 1（有理数と単調性）.** $L$ もアルキメデス的（\ref{calc:reals-basic}）なので、$r\in\mathbb{Q}$ について $\phi(r)=\sup_{L}\{q\in\mathbb{Q}\mid q<r\}=r$（\ref{calc:prob-of-sup-rationals}）。$x<y$ なら有理数 $x<r_{1}<r_{2}<y$ をとって $\phi(x)\le r_{1}<r_{2}\le\phi(y)$。

**Step 2（和）.** $r\in D(x)$, $s\in D(y)$ なら $r+s\in D(x+y)$ なので $r+s\le\phi(x+y)$。$s$ を固定して $r$ について上限をとり、次に $s$ についてとると $\phi(x)+\phi(y)\le\phi(x+y)$。逆に $q\in D(x+y)$ なら、有理数 $r$ を $q-y<r<x$ ととり $s\defeq q-r<y$ とすると、$q=r+s\le\phi(x)+\phi(y)$。よって $\phi(x+y)=\phi(x)+\phi(y)$、とくに $\phi(0)=0$, $\phi(-x)=-\phi(x)$。

**Step 3（積）.** $x,y>0$ とする。正の $r\in D(x)$, $s\in D(y)$ について $rs<xy$ なので $rs\le\phi(xy)$。$x>0$ なので $D(x)$ の上限は正の元の上限に等しく、$s$ を固定して $r$ について上限をとると $\phi(x)s\le\phi(xy)$、次に $s$ について上限をとると $\phi(x)\phi(y)\le\phi(xy)$（$\phi(x)>0$）。逆に $q\in D(xy)$ で $q>0$ なら、有理数 $r$ を $\frac qy<r<x$ ととり $s\defeq\frac qr$ とすると $0<s<y$ で、$q=rs\le\phi(x)\phi(y)$。$q\le0$ なら明らか。よって $\phi(xy)=\phi(x)\phi(y)$。符号が異なる場合は Step 2 の $\phi(-x)=-\phi(x)$ から。$\phi(1)=1$ なので $\phi$ は環準同型で、Step 1 から順序を保ち単射。

**Step 4（2）.** $\psi\colon K\to L$ を順序を保つ環準同型とすると、$\psi$ は $\mathbb{Q}$ の上で恒等（\ref{calc:rational-embedding} の一意性）。$\psi(x)\neq\phi(x)$ なら、その間に有理数 $q$ がある。$\phi(x)<q<\psi(x)$ とする（逆も同様）。$q<x$ なら $q\in D(x)$ で $q\le\phi(x)$ となり矛盾、$q\ge x$ なら $q=\psi(q)\ge\psi(x)$ となり矛盾。

**Step 5（3）.** $\phi$ は順序体の同型なので、全射なら $K$ は $L$ と同型で完備。逆に $K$ が完備なら、$y\in L$ について $x\defeq\sup_{K}D_{L}(y)$（$D_{L}(y)\defeq\{r\in\mathbb{Q}\mid r<y\}$）とおく。$D(x)=D_{L}(y)$ を示す：$r<y$ なら $r<r'<y$ となる有理数 $r'$ があり $r<r'\le x$。$r<x$ なら $r$ より大きく $x$ より小さい有理数 $r'$ は $D_{L}(y)$ の上界でないので $r<r'<q<y$ となる $q\in D_{L}(y)$ がある。よって $\phi(x)=\sup D_{L}(y)=y$（\ref{calc:prob-of-sup-rationals}）。
:::

::: corollary 完備順序体の一意性 {#calc:complete-ordered-field-unique keywords="any two complete ordered fields are isomorphic by a unique isomorphism; every Archimedean ordered field is isomorphic to a subfield of R; R has no nontrivial field automorphism" index="完備順序体の一意性|かんびじゅんじょたいのいちいせい, 実数体の自己同型|じっすうたいのじこどうけい"}
1. 二つの完備順序体の間には、順序体の同型がただ一つある。とくに $\mathbb{R}_{\mathcal{C}}$ を $\mathbb{R}$ と書く。
2. アルキメデス的順序体は $\mathbb{R}$ の部分体とただ一通りに同型。
3. $\mathbb{R}$ の環準同型 $\mathbb{R}\to\mathbb{R}$ は恒等写像だけ。
:::

::: proof
1・2：\ref{calc:archimedean-embedding}。3：$a\ge0$ なら $a=b^{2}$ となる $b$ がある（$f(y)=y^{2}$ は $|y^{2}-z^{2}|\le|y-z|(|y|+|z|)$ から連続で、$f(0)=0\le a<f(a+1)$ なので中間値の定理 \ref{calc:reals-basic}）。環準同型 $\sigma$ について $\sigma(b^{2})=\sigma(b)^{2}\ge0$ なので、$\sigma$ は $0$ 以上の元を $0$ 以上の元に写し、$x<y\Rightarrow\sigma(y)-\sigma(x)\ge0$、単射性（体の準同型）から $\sigma$ は順序を保つ。2 の一意性から $\sigma=1$。
:::

## デデキント切断による構成 {#calc:sec-rc-dedekind}

::: construction デデキント切断による実数の構成 {#calc:real-construction keywords="Dedekind cuts of Q with inclusion as order and explicit sum, negation and product; they form a complete ordered field isomorphic to the Cauchy construction" index="デデキント切断|ででぎんとせつだん, 実数の構成|じっすうのこうせい"}
$\mathbb{Q}$ の部分集合 $\alpha$ で、空でなく、$\mathbb{Q}$ 全体でなく、下に閉じていて（$a\in\alpha$, $b<a\Rightarrow b\in\alpha$）、最大元をもたないものを**デデキント切断**（以下、切断）という（\ref{set:number-systems-construction} の $\mathbb{R}$ の元）。切断の全体を $\mathbb{R}_{\mathcal{D}}$ とし、
- 順序：$\alpha\le\beta\iff\alpha\subset\beta$。$0^{*}\defeq\{q\mid q<0\}$, $1^{*}\defeq\{q\mid q<1\}$。
- 和：$\alpha+\beta\defeq\{a+b\mid a\in\alpha,\ b\in\beta\}$。
- 符号の反転：$-\alpha\defeq\{q\mid$ ある有理数 $r>0$ で $-q-r\notin\alpha\}$。
- 積：$\alpha,\beta\ge0^{*}$ では $\alpha\beta\defeq0^{*}\cup\{ab\mid a\in\alpha,\ b\in\beta,\ a\ge0,\ b\ge0\}$。他の符号では $\alpha\beta\defeq-((-\alpha)\beta)$（$\alpha<0^{*}\le\beta$）、$-(\alpha(-\beta))$（$\beta<0^{*}\le\alpha$）、$(-\alpha)(-\beta)$（$\alpha,\beta<0^{*}$）。
:::

::: theorem 切断は完備順序体 {#calc:dedekind-cuts-field keywords="for a complete ordered field L, x -> {q in Q : q < x} is a bijection onto the Dedekind cuts that carries sum, negation, product and order to the cut operations; hence the cuts form a complete ordered field" index="デデキント切断の体|ででぎんとせつだんのたい"}
$L$ を完備順序体とし、$\Phi(x)\defeq\{q\in\mathbb{Q}\mid q<x\}$ とおく。$\Phi\colon L\to\mathbb{R}_{\mathcal{D}}$ は全単射で、
$$
\begin{aligned}&\Phi(x+y)=\Phi(x)+\Phi(y),\quad\Phi(-x)=-\Phi(x),\quad\Phi(xy)=\Phi(x)\Phi(y),\\ &x\le y\iff\Phi(x)\subset\Phi(y).\end{aligned}
$$
したがって $\mathbb{R}_{\mathcal{D}}$ は上の演算と順序で完備順序体で、$\mathbb{R}_{\mathcal{C}}$ と（ただ一つの同型で）同型。
:::

::: proof
**Step 1（切断であること・全単射）.** $L$ はアルキメデス的なので $\Phi(x)$ は空でなく $\mathbb{Q}$ 全体でもない。下に閉じていることは明らか。$q<x$ なら $q<q'<x$ となる有理数 $q'$ があるので最大元をもたない。$x<y$ なら間の有理数が $\Phi(y)\setminus\Phi(x)$ に入るので、$x\le y\iff\Phi(x)\subset\Phi(y)$ で $\Phi$ は単射。全射：切断 $\alpha$ について、$\alpha$ に入らない有理数 $q_{0}$ は上界（$a\ge q_{0}$ なら $q_{0}\in\alpha$）なので $x\defeq\sup_{L}\alpha$ がある。$q\in\alpha$ なら最大元がないので $q<q'\in\alpha$ で $q<q'\le x$。$q<x$ なら $q$ は上界でないので $q<a\in\alpha$ で $q\in\alpha$。よって $\Phi(x)=\alpha$。

**Step 2（和）.** $a<x$, $b<y$ なら $a+b<x+y$。逆に $q<x+y$ なら有理数 $a$ を $q-y<a<x$ ととり $b\defeq q-a<y$。

**Step 3（符号の反転）.** $q<-x$ なら有理数 $r$ を $0<r\le-x-q$ ととると $-q-r\ge x$、すなわち $-q-r\notin\Phi(x)$。逆に $-q-r\ge x$（$r>0$）なら $q\le-x-r<-x$。

**Step 4（積）.** $x,y\ge0$ とする。$q<0$ なら $q<xy$。$0\le a<x$, $0\le b<y$ なら $ab\le ay<xy$（$y>b\ge0$ と $x>a$）。逆に $0\le q<xy$ なら $x,y>0$ で、$q=0$ は $0\cdot0$、$q>0$ なら有理数 $a$ を $\frac qy<a<x$ ととり $b\defeq\frac qa\in(0,y)$ とすれば $q=ab$。他の符号は、$L$ での符号の規則 $xy=-((-x)y)$ などと Step 3 から。

**Step 5.** $\Phi$ は全単射で演算と順序を保つので、$\mathbb{R}_{\mathcal{D}}$ の演算と順序は $L$ のそれを写したものに一致し、$\mathbb{R}_{\mathcal{D}}$ は $L$ と同型な完備順序体。$L=\mathbb{R}_{\mathcal{C}}$（\ref{calc:cauchy-reals-complete}）とすれば $\mathbb{R}_{\mathcal{D}}$ が完備順序体であることが従い、同型の一意性は \ref{calc:complete-ordered-field-unique}。

::: hypcheck
- **$L$ の完備性**：Step 1 の全射性（上限の存在）に使った。$L$ がアルキメデス的なだけなら $\Phi$ は単射な順序体の準同型だが全射とは限らない（$L=\mathbb{Q}$ では $\Phi(\mathbb{Q})$ は「有理数で終わる切断」だけ）。
- **アルキメデス性**：有理数の稠密性として Step 1〜4 のすべてで使った。
:::
:::

::: intuition
コーシー列による構成は「有理数の近似の列」を、デデキント切断による構成は「有理数をそれより小さいものと大きいものに分ける切り口」を実数とみなす。前者は解析的（距離による完備化）で、どの距離空間にも一般化される。後者は順序的（順序による完備化）で、どの全順序集合にも一般化される。二つが一致するのは、$\mathbb{Q}$ ではアルキメデス性のおかげで「近づく列」と「切り口」が同じ情報をもつからである。
:::

## 小数展開と濃度 {#calc:sec-rc-decimal}

::: theorem $b$ 進展開 {#calc:decimal-expansion keywords="base b expansion: every real number in [0,1) has a unique digit sequence not ending in b-1's; every digit sequence defines a convergent series" index="小数展開|しょうすうてんかい, b 進展開|びーしんてんかい"}
$b\ge2$ を整数とする。
1. 数字の列 $(d_{k})_{k\ge1}$（$d_{k}\in\{0,1,\dots,b-1\}$）について、級数 $\sum_{k\ge1}d_{k}b^{-k}$（部分和の極限）は $[0,1]$ で収束する。
2. $x\in[0,1)$ について、「最終的にすべて $b-1$」ではない数字の列で $x=\sum_{k}d_{k}b^{-k}$ となるものがただ一つある。それは $d_{k}=\lfloor b^{k}x\rfloor-b\lfloor b^{k-1}x\rfloor$ で与えられる。
:::

::: proof
**Step 1（1）.** 部分和 $s_{n}\defeq\sum_{k\le n}d_{k}b^{-k}$ は単調増加で、$s_{n}\le\sum_{k\le n}(b-1)b^{-k}=1-b^{-n}<1$。(M) から収束し、極限は $[0,1]$ に入る（\ref{calc:ordered-field-sequences.1}）。また $\sum_{k>m}(b-1)b^{-k}=b^{-m}$（部分和 $b^{-m}-b^{-n}$ の極限）。

**Step 2（存在）.** $y\defeq b^{k-1}x$ について $d_{k}=\lfloor by\rfloor-b\lfloor y\rfloor$ で、$b\lfloor y\rfloor\le by<b\lfloor y\rfloor+b$ から $0\le d_{k}\le b-1$。部分和は $\lfloor x\rfloor=0$ から望遠鏡和で $s_{n}=b^{-n}\lfloor b^{n}x\rfloor$ となり、$0\le x-s_{n}<b^{-n}\to0$。最終的にすべて $b-1$ なら、ある $m$ で $x-s_{m}=\sum_{k>m}(b-1)b^{-k}=b^{-m}$ となり $x-s_{m}<b^{-m}$ に反する。

**Step 3（一意性）.** 異なる二つの列 $(d_{k})$, $(d'_{k})$（どちらも最終的にすべて $b-1$ ではない）が同じ $x$ を与えるとし、最初に異なる番号を $k$、$d_{k}<d'_{k}$ とする。$(d_{j})_{j>k}$ はすべて $b-1$ ではないので、ある $j>k$ で $d_{j}\le b-2$ となり
$$
\sum_{j\ge k}d_{j}b^{-j}<d_{k}b^{-k}+\sum_{j>k}(b-1)b^{-j}=(d_{k}+1)b^{-k}\le d'_{k}b^{-k}\le\sum_{j\ge k}d'_{j}b^{-j}.
$$
$j<k$ の項は等しいので、両辺の $x$ が異なることになり矛盾。
:::

::: theorem 実数全体の濃度 {#calc:reals-cardinality keywords="the set of real numbers is equinumerous with the power set of omega: |R| = 2^aleph_0, in ZF" index="実数全体の濃度|じっすうぜんたいののうど, 連続体の濃度|れんぞくたいののうど"}
$\mathbb{R}$ と $\mathcal{P}(\omega)$ の間に全単射がある（$\ZF$）。すなわち $|\mathbb{R}|=2^{\aleph_{0}}$。
:::

::: proof
**Step 1（$\mathbb{R}\preceq\mathcal{P}(\omega)$）.** $x\mapsto\Phi(x)=\{q\in\mathbb{Q}\mid q<x\}$ は単射 $\mathbb{R}\to\mathcal{P}(\mathbb{Q})$（\ref{calc:dedekind-cuts-field}）で、$e$ による像 $A\mapsto e[A]$ は単射 $\mathcal{P}(\mathbb{Q})\to\mathcal{P}(\omega)$ なので、合成して単射 $\mathbb{R}\to\mathcal{P}(\omega)$。

**Step 2（$\mathcal{P}(\omega)\preceq\mathbb{R}$）.** $S\subset\omega$ に $\chi(S)\defeq\sum_{k\ge0}2\cdot\mathbf{1}_{S}(k)\,3^{-k-1}$（3 進展開で数字 $0$ と $2$ だけを使うもの）を対応させる。$S\neq T$ で最初に異なる番号を $k$（$k\in T\setminus S$）とすると、$\chi(T)-\chi(S)\ge2\cdot3^{-k-1}-\sum_{j>k}2\cdot3^{-j-1}=2\cdot3^{-k-1}-3^{-k-1}>0$（Step 1 の幾何級数）。よって $\chi$ は単射。

**Step 3.** シュレーダー＝ベルンシュタインの定理（\tref{set:schroder-bernstein}、$\ZF$ の定理）から全単射がある。
:::

::: supplement
**一般化と関連する事実.**
- コーシー列による構成は、任意の距離空間の**完備化**として一般化され、$p$ 進距離で同じ構成をすると $p$ 進数体 $\mathbb{Q}_{p}$ が得られる（\ref[p 進数]{nt:page-p-adic}）。デデキント切断による構成は、任意の全順序集合の**デデキント–マクニール完備化**として一般化される（知られている）。
- 他にも同値な構成がいくつか知られている：整数列の「ほとんど準同型」$f\colon\mathbb{Z}\to\mathbb{Z}$（$f(m+n)-f(m)-f(n)$ が有界）による**エウドクソスの実数**、小数展開の列を直接実数とみなす構成など（本サイト未収録）。どの構成も完備順序体を与えるので、\ref{calc:complete-ordered-field-unique} によりすべて同型である。
- アルキメデス的でない完備性（(C) だけを満たす体など）では一意性は成り立たない（\ref{calc:laurent-series-field}）。

**前提を変えると.** 選択公理なしでも、構成・一意性・濃度の主張はすべて成り立つ。ただし「$2^{\aleph_{0}}$ が整列可能な基数（アレフ）である」ことは選択公理なしには示せない（知られている）。

**高い視点.** 完備順序体の一意性は、圏論的には「$\mathbb{Q}$ の上のアルキメデス的順序体の圏で、$\mathbb{R}$ が終対象である」と言い換えられる：どのアルキメデス的順序体からも $\mathbb{R}$ へちょうど一つの射がある（\ref{calc:archimedean-embedding}）。終対象は同型を除いて一意なので、どの構成でも同じ $\mathbb{R}$ が得られる。比喩で言えば、実数は「有理数の世界に開いた穴を、どの順番でどの道具（列・切り口・小数）で埋めても、最後に出来上がる完成図はただ一枚」というものである。
:::

## 問題 {#calc:sec-rc-problems}

::: problem {#calc:prob-rc-sqrt-cut}
デデキント切断 $\alpha\defeq\{q\in\mathbb{Q}\mid q<0$ または $q^{2}<2\}$ について、$\alpha\alpha=\{q\mid q<2\}=\Phi(2)$ を、積の定義から直接確かめよ。
:::

::: solution
$\alpha\ge0^{*}$ なので $\alpha\alpha=0^{*}\cup\{ab\mid a,b\in\alpha,\ a,b\ge0\}$。$0\le a,b$, $a^{2},b^{2}<2$ なら $(ab)^{2}<4$ で $ab<2$。逆に $0\le q<2$ とする。$q=0$ は $0\cdot0$。$q>0$ なら、$\mathbb{R}$ で $\sqrt q<a<\sqrt2$ となる有理数 $a$ をとる（稠密性。$\sqrt{\ }$ の存在は \ref{calc:complete-ordered-field-unique.3} の証明）。$a\ge0$, $a^{2}<2$ なので $a\in\alpha$、$a^{2}>q$。$b\defeq\frac qa$ とすると $b^{2}=\frac{q^{2}}{a^{2}}<\frac{q^{2}}{q}=q<2$ で $b\in\alpha$、$q=ab$。
:::

::: problem {#calc:prob-rc-binary-unique}
2 進展開で、$\frac12=0.1000\cdots_{(2)}=0.0111\cdots_{(2)}$ の 2 通りの表示があることを確かめ、\ref{calc:decimal-expansion} の一意性の条件「最終的にすべて $b-1$ ではない」が必要であることを説明せよ。
:::

::: solution
$\sum_{k\ge2}2^{-k}=\frac12$（Step 1 の幾何級数で $b=2$, $m=1$）。よって数字の列 $(1,0,0,\dots)$ と $(0,1,1,\dots)$ は同じ $\frac12$ を与える。後者は最終的にすべて $1=b-1$ で、条件がなければ一意性は崩れる。
:::

::: problem {#calc:prob-rc-no-order-automorphism-q}
$\mathbb{Q}(\sqrt2)$ の体の自己同型 $a+b\sqrt2\mapsto a-b\sqrt2$ は、\ref{calc:complete-ordered-field-unique.3} の議論（正の元は平方）がなぜ使えないかを示す例であることを説明せよ。
:::

::: solution
$\mathbb{Q}(\sqrt2)$ では正の元がすべて平方とは限らない（たとえば $\sqrt2>0$（$\mathbb{R}$ の順序）は $\mathbb{Q}(\sqrt2)$ の平方でない：$(a+b\sqrt2)^{2}=\sqrt2$ なら $a^{2}+2b^{2}=0$, $2ab=1$ で不可能）。そのため環準同型が順序を保つとは言えず、実際この自己同型は $\sqrt2>0$ を $-\sqrt2<0$ に写して順序を保たない。$\mathbb{R}$ では中間値の定理により正の元は平方なので、どの自己同型も順序を保ち、恒等写像になる。
:::
