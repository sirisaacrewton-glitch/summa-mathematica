# ℝⁿ 上の微分形式と鎖の上のストークスの定理 {#calc:page-differential-forms keywords="differential forms on open subsets of R^n defined concretely by minors dx_I, wedge product, exterior derivative, d^2 = 0, pullback, Poincare lemma on star-shaped sets, singular cubes and chains, boundary of a chain, Stokes theorem for chains, closed but not exact forms"}

ベクトル解析の積分定理（グリーン・ガウス・ストークス）は、すべて $\int_{c}d\omega=\int_{\partial c}\omega$ という 1 つの式の特別な場合である。このページではその式を、$\mathbb{R}^{n}$ の開集合の上の**微分形式**と、立方体からの写像の形式的な和（**鎖**）について証明する。微分形式は、外積代数の抽象的な構成を使わず、**小行列式**で具体的に定義する：$dx_{I}$ は、ベクトルを並べた行列から行 $I$ を取り出した小行列式である。使う線形代数は行列式の定義と基本性質だけである。外微分 $d$、引き戻し $\varphi^{*}$ を定義し、$dd=0$、$d\varphi^{*}=\varphi^{*}d$、**ポアンカレの補題**（星形の開集合上で閉形式は完全）を示したあと、鎖の上の**ストークスの定理**を示す。

> 資料：Spivak『Calculus on Manifolds』第 4 章（鎖とストークスの定理）、Rudin『Principles of Mathematical Analysis』第 10 章と同じ標準的な内容。小行列式による定義と、それに合わせた証明は自分で書き下ろした。多様体の上の微分形式（外積代数による抽象的な定義）は多様体論で扱い、そこでこのページの定義と一致することを示す。

## 記法と定義の確認 {#calc:sec-df-notation}

::: notation
- 行列式（ライプニッツの式）\ref{lin:leibniz-formula}、多重線形・交代的 \ref{lin:alternating-form}, \ref{lin:alternating-consequences}、行列式の乗法性 \ref{lin:det-multiplicative}。
- 全微分と連鎖律 \ref{calc:total-derivative}, \ref{calc:multivariable-chain-rule}、シュワルツの定理 \ref{calc:ck-symmetric}、積分記号下の微分 \ref{calc:differentiation-under-integral}、重積分とフビニの定理 \ref{calc:box-integral}, \ref{calc:fubini-continuous}、変数変換公式 \tref{calc:change-of-variables}、微分積分学の基本定理 \tref{calc:fundamental-theorem}。
- $U\subset\mathbb{R}^{n}$ は開集合。$I^{k}\defeq[0,1]^{k}$。$C^{r}$ 級の関数や写像は \ref{calc:ck-map}。閉集合 $A$ 上の写像が $C^{r}$ 級とは、$A$ を含む開集合上の $C^{r}$ 級写像の制限であることをいう。
- **添字の列**：$A=(a_{1},\dots,a_{k})$（$1\le a_{l}\le n$）を長さ $k$ の添字の列という。狭義増加の列を $I=(i_{1}<\cdots<i_{k})$ と書き、その全体を $\mathcal{I}_{k}$ とする。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## 交代形式と小行列式 {#calc:sec-df-alternating}

::: definition 小行列式による $dx_{A}$ {#calc:dx-minor keywords="dx_A(v_1,...,v_k) is the k x k minor of the matrix (v_1 ... v_k) on the rows a_1,...,a_k" index="dx_I|でぃーえっくすあい, 交代形式（ℝⁿ 上）|こうたいけいしきあーるえぬじょう"}
添字の列 $A=(a_{1},\dots,a_{k})$ について、$dx_{A}\colon(\mathbb{R}^{n})^{k}\to\mathbb{R}$ を
$$
dx_{A}(v_{1},\dots,v_{k})\defeq\det\bigl((v_{b})_{a_{l}}\bigr)_{l,b=1}^{k}
$$
で定める（$n\times k$ 行列 $(v_{1}\ \cdots\ v_{k})$ の第 $a_{1},\dots,a_{k}$ 行を、この順に並べた $k\times k$ 行列の行列式）。$k=1$ では $dx_{i}(v)=v_{i}$（第 $i$ 座標）。$k=0$ では $dx_{\varnothing}\defeq1$（定数）。
:::

::: intuition
$k=2$, $n=3$ のとき $dx_{(1,2)}(v,w)=v_{1}w_{2}-v_{2}w_{1}$ は、$v,w$ の張る平行四辺形を $x_{1}x_{2}$ 平面に射影したものの符号付き面積である。一般に $dx_{I}(v_{1},\dots,v_{k})$ は「$v_{1},\dots,v_{k}$ の張る平行体を座標 $x_{i_{1}},\dots,x_{i_{k}}$ の空間に射影した $k$ 次元の符号付き体積」である。微分形式は、この「射影した体積」の一次結合を各点に割り当てたものになる。
:::

::: lemma $dx_{A}$ の性質 {#calc:dx-properties keywords="dx_A is alternating multilinear; permuting A multiplies by the sign; repeated index gives zero; the dx_I for increasing I form a basis of alternating k-linear forms" index="交代形式の基底|こうたいけいしきのきてい"}
1. $dx_{A}$ は $k$ 重線形かつ交代的。
2. $A$ の並べ替え $A^{\sigma}=(a_{\sigma(1)},\dots,a_{\sigma(k)})$ について $dx_{A^{\sigma}}=\operatorname{sgn}(\sigma)\,dx_{A}$。$A$ に同じ添字が 2 回現れれば $dx_{A}=0$。とくに $dx_{A}$ は、$A$ の並べ替えで得られる $I\in\mathcal{I}_{k}$ について $\pm dx_{I}$ か $0$。
3. $I,J\in\mathcal{I}_{k}$ について $dx_{I}(e_{j_{1}},\dots,e_{j_{k}})=\delta_{IJ}$。
4. $(\mathbb{R}^{n})^{k}$ 上の任意の交代 $k$ 重線形形式 $\alpha$ は、ただ一通りに $\alpha=\sum_{I\in\mathcal{I}_{k}}c_{I}\,dx_{I}$ と書け、$c_{I}=\alpha(e_{i_{1}},\dots,e_{i_{k}})$。$k>n$ なら $\alpha=0$。
:::

::: proof
**Step 1（1・2）.** 行列式は各列について線形で、2 つの列が等しければ $0$（\ref{lin:alternating-form} の例としての行列式）。$v_{b}$ は第 $b$ 列にだけ現れるので 1。行を並べ替えると符号 $\operatorname{sgn}(\sigma)$ 倍、2 行が等しいと $0$（行列式の転置不変性と列についての性質）で 2。

**Step 2（3）.** $(e_{j_{1}},\dots,e_{j_{k}})$ の第 $i_{l}$ 行は、$i_{l}\in J$ なら $j_{b}=i_{l}$ となる $b$ の位置に $1$、他は $0$。$I=J$ なら単位行列で $\det=1$。$I\neq J$ なら（同じ大きさの増加列なので）ある $i_{l}\notin J$ があり、その行は $0$ で $\det=0$。

**Step 3（4 の存在）.** $v_{b}=\sum_{j}(v_{b})_{j}e_{j}$ を代入し多重線形性で展開すると
$$
\alpha(v_{1},\dots,v_{k})=\sum_{j_{1},\dots,j_{k}}(v_{1})_{j_{1}}\cdots(v_{k})_{j_{k}}\,\alpha(e_{j_{1}},\dots,e_{j_{k}}).
$$
同じ添字を含む項は交代性から $0$。残りの項は、集合 $\{j_{1},\dots,j_{k}\}$ を並べた $I\in\mathcal{I}_{k}$ と置換 $\sigma$ で $j_{b}=i_{\sigma(b)}$ と書け、$\alpha(e_{j_{1}},\dots)=\operatorname{sgn}(\sigma)\alpha(e_{i_{1}},\dots)$（\ref{lin:alternating-consequences}）。$I$ ごとにまとめると、係数は $\sum_{\sigma}\operatorname{sgn}(\sigma)\prod_{b}(v_{b})_{i_{\sigma(b)}}$ で、ライプニッツの式（\ref{lin:leibniz-formula}）からこれは $dx_{I}(v_{1},\dots,v_{k})$。$k>n$ なら同じ添字を含まない列がないので $\alpha=0$。

**Step 4（4 の一意性）.** $\sum c_{I}dx_{I}=0$ なら、3 から $(e_{j_{1}},\dots,e_{j_{k}})$ に代入して $c_{J}=0$。
:::

::: definition 外積 {#calc:wedge-product keywords="wedge product of alternating forms defined on the basis by concatenation of index sequences: dx_A wedge dx_B = dx_{(A,B)}" index="外積（微分形式）|がいせきびぶんけいしき, ウェッジ積|うぇっじせき"}
長さ $k$ の交代形式 $\alpha=\sum_{I}c_{I}dx_{I}$ と長さ $l$ の $\beta=\sum_{J}d_{J}dx_{J}$ の**外積**を
$$
\alpha\wedge\beta\defeq\sum_{I,J}c_{I}d_{J}\,dx_{(I,J)}
$$
で定める。ここで $(I,J)$ は列をつなげた長さ $k+l$ の列（\ref{calc:dx-properties.2} により $\pm dx_{K}$ か $0$）。$k=0$ では $c\wedge\beta=c\beta$。
:::

::: proposition 外積の性質 {#calc:wedge-properties keywords="dx_A wedge dx_B = dx_{(A,B)} for all sequences; bilinear, associative, graded commutative; alpha_1 wedge ... wedge alpha_k (v_1,...,v_k) = det(alpha_a(v_b)) for 1-forms" index="外積の性質|がいせきのせいしつ"}
1. 任意の添字の列 $A,B$ について $dx_{A}\wedge dx_{B}=dx_{(A,B)}$。とくに $dx_{a_{1}}\wedge\cdots\wedge dx_{a_{k}}=dx_{A}$。
2. $\wedge$ は双線形で結合的、$\alpha\wedge\beta=(-1)^{kl}\beta\wedge\alpha$（$\alpha$ が長さ $k$、$\beta$ が長さ $l$）。とくに長さ 1 の $\alpha$ について $\alpha\wedge\alpha=0$。
3. 長さ 1 の交代形式（線形汎関数）$\alpha_{1},\dots,\alpha_{k}$ について $(\alpha_{1}\wedge\cdots\wedge\alpha_{k})(v_{1},\dots,v_{k})=\det\bigl(\alpha_{a}(v_{b})\bigr)_{a,b}$。
:::

::: proof
**Step 1（1）.** $A$ を並べ替えた $I$（$dx_{A}=\varepsilon dx_{I}$、$\varepsilon=\pm1$ または $A$ に重複があれば $dx_{A}=0$）、$B$ についても同様に $J$, $\varepsilon'$ とする。定義から $dx_{A}\wedge dx_{B}=\varepsilon\varepsilon'dx_{(I,J)}$。一方、$(A,B)$ の前半を $I$ に、後半を $J$ に並べ替える置換の符号は $\varepsilon\varepsilon'$ で、\ref{calc:dx-properties.2} から $dx_{(A,B)}=\varepsilon\varepsilon'dx_{(I,J)}$。重複がある場合はどちらも $0$。

**Step 2（2）.** 双線形性は定義から。結合性：1 から $(dx_{A}\wedge dx_{B})\wedge dx_{C}=dx_{(A,B,C)}=dx_{A}\wedge(dx_{B}\wedge dx_{C})$ で、双線形性で一般化。反可換性：$(A,B)$ を $(B,A)$ に並べ替える置換は、$B$ の $l$ 個をそれぞれ $A$ の $k$ 個の前に移すもので、符号は $(-1)^{kl}$。$\alpha\wedge\alpha=-\alpha\wedge\alpha$ から $\alpha\wedge\alpha=0$。

**Step 3（3）.** 両辺は $(\alpha_{1},\dots,\alpha_{k})$ のそれぞれについて線形（左辺は 2 の双線形性、右辺は行列式の行についての線形性）。$\alpha_{a}=dx_{c_{a}}$ のときは 1 から左辺は $dx_{(c_{1},\dots,c_{k})}(v)$ で、定義から右辺 $\det((v_{b})_{c_{a}})$ に等しい。一般の $\alpha_{a}=\sum_{c}\alpha_{a}(e_{c})dx_{c}$ は線形性で展開する。
:::

## 微分形式と外微分 {#calc:sec-df-forms}

::: definition 微分形式 {#calc:differential-form keywords="a differential k-form on an open set U of R^n is omega = sum_I f_I dx_I with coefficient functions f_I; C^r forms; wedge product pointwise" index="微分形式|びぶんけいしき, k 形式|けーけいしき"}
開集合 $U\subset\mathbb{R}^{n}$ 上の **$k$ 形式**（**微分形式**）とは、関数 $f_{I}\colon U\to\mathbb{R}$（$I\in\mathcal{I}_{k}$）の組で、
$$
\omega=\sum_{I\in\mathcal{I}_{k}}f_{I}\,dx_{I}
$$
と書く。各点 $p$ に交代 $k$ 重線形形式 $\omega_{p}=\sum f_{I}(p)dx_{I}$ を割り当てたものとみなす（\ref{calc:dx-properties.4} から、これは組 $(f_{I})$ と同じ情報）。係数がすべて $C^{r}$ 級なら $\omega$ は $C^{r}$ 級という。0 形式は関数。外積は各点で $(\omega\wedge\eta)_{p}\defeq\omega_{p}\wedge\eta_{p}$ と定める。添字の列 $A$ について $f\,dx_{A}$ も \ref{calc:dx-properties.2} で $k$ 形式とみなす。
:::

::: definition 外微分 {#calc:exterior-derivative keywords="exterior derivative d(sum f_I dx_I) = sum_I sum_j d_j f_I dx_j wedge dx_I; df = sum d_j f dx_j" index="外微分|がいびぶん"}
$C^{1}$ 級の $k$ 形式 $\omega=\sum f_{I}dx_{I}$ の**外微分**を
$$
d\omega\defeq\sum_{I}\sum_{j=1}^{n}\partial_{j}f_{I}\,dx_{j}\wedge dx_{I}
$$
（$(k+1)$ 形式、係数は連続）で定める。とくに関数 $f$ について $df=\sum_{j}\partial_{j}f\,dx_{j}$ で、$df_{p}(v)=Df(p)v$。
:::

::: proposition 外微分の性質 {#calc:exterior-derivative-properties keywords="d is linear; d(f dx_A) = df wedge dx_A for any sequence A; Leibniz rule d(omega wedge eta) = d omega wedge eta + (-1)^k omega wedge d eta; d d = 0 for C^2 forms" index="外微分の性質|がいびぶんのせいしつ"}
$\omega$ を $C^{1}$ 級の $k$ 形式、$\eta$ を $C^{1}$ 級の $l$ 形式とする。
1. $d$ は線形で、任意の添字の列 $A$ について $d(f\,dx_{A})=df\wedge dx_{A}$。
2. （ライプニッツ則）$d(\omega\wedge\eta)=d\omega\wedge\eta+(-1)^{k}\omega\wedge d\eta$。
3. $\omega$ が $C^{2}$ 級なら $d(d\omega)=0$。
:::

::: proof
**Step 1（1）.** 線形性は定義から。$dx_{A}=\varepsilon dx_{I}$（または $0$）なら $d(f\,dx_{A})=d(\varepsilon f\,dx_{I})=\varepsilon\,df\wedge dx_{I}=df\wedge dx_{A}$（\ref{calc:wedge-properties} の双線形性）。

**Step 2（2）.** 双線形性から $\omega=f\,dx_{A}$, $\eta=g\,dx_{B}$ の場合でよい。$\omega\wedge\eta=fg\,dx_{(A,B)}$ で、1 と積の微分 $d(fg)=g\,df+f\,dg$ から
$$
d(\omega\wedge\eta)=(g\,df+f\,dg)\wedge dx_{A}\wedge dx_{B}=df\wedge dx_{A}\wedge g\,dx_{B}+(-1)^{k}f\,dx_{A}\wedge dg\wedge dx_{B}
$$
（$dg$ を長さ $k$ の $dx_{A}$ の右へ移すと $(-1)^{k}$、\ref{calc:wedge-properties.2}）。これは $d\omega\wedge\eta+(-1)^{k}\omega\wedge d\eta$。

**Step 3（3）.** $\omega=f\,dx_{I}$ でよい。$d\omega=\sum_{j}\partial_{j}f\,dx_{j}\wedge dx_{I}$、$d(d\omega)=\sum_{i,j}\partial_{i}\partial_{j}f\,dx_{i}\wedge dx_{j}\wedge dx_{I}$。シュワルツの定理（\ref{calc:ck-symmetric}）から $\partial_{i}\partial_{j}f=\partial_{j}\partial_{i}f$ で、$dx_{i}\wedge dx_{j}=-dx_{j}\wedge dx_{i}$ なので、$(i,j)$ と $(j,i)$ の項は打ち消し合い、$i=j$ の項は $dx_{i}\wedge dx_{i}=0$。
:::

::: definition 閉形式と完全形式 {#calc:closed-exact keywords="closed form d omega = 0; exact form omega = d eta" index="閉形式|へいけいしき, 完全形式|かんぜんけいしき"}
$C^{1}$ 級の $k$ 形式 $\omega$ が $d\omega=0$ を満たすとき**閉形式**、ある $C^{1}$ 級の $(k-1)$ 形式 $\eta$ で $\omega=d\eta$ と書けるとき**完全形式**という（$k\ge1$）。$C^{2}$ 級の $\eta$ について $d(d\eta)=0$ なので、そのような完全形式は閉形式。
:::

## 引き戻し {#calc:sec-df-pullback}

::: definition 引き戻し {#calc:pullback keywords="pullback of a form by a C^1 map: phi^*(sum f_I dx_I) = sum (f_I o phi) d phi_{i_1} wedge ... wedge d phi_{i_k}" index="引き戻し|ひきもどし"}
$V\subset\mathbb{R}^{m}$, $U\subset\mathbb{R}^{n}$ を開集合、$\varphi\colon V\to U$ を $C^{1}$ 級とする。$U$ 上の $k$ 形式 $\omega=\sum f_{I}dx_{I}$ の**引き戻し**を
$$
\varphi^{*}\omega\defeq\sum_{I}(f_{I}\circ\varphi)\,d\varphi_{i_{1}}\wedge\cdots\wedge d\varphi_{i_{k}}
$$
（$V$ 上の $k$ 形式。$d\varphi_{i}=\sum_{j}\partial_{j}\varphi_{i}\,du_{j}$、$u$ は $V$ の座標）で定める。0 形式（関数）では $\varphi^{*}f=f\circ\varphi$。
:::

::: theorem 引き戻しの性質 {#calc:pullback-properties keywords="pointwise formula (phi^* omega)_p(w) = omega_{phi(p)}(D phi(p) w_1, ...); phi^* respects wedge; (psi o phi)^* = phi^* psi^*; d phi^* = phi^* d for C^2 maps; top degree forms pick up det D phi" index="引き戻しの性質|ひきもどしのせいしつ"}
1. （各点の式）$(\varphi^{*}\omega)_{p}(w_{1},\dots,w_{k})=\omega_{\varphi(p)}\bigl(D\varphi(p)w_{1},\dots,D\varphi(p)w_{k}\bigr)$。
2. $\varphi^{*}(\omega\wedge\eta)=\varphi^{*}\omega\wedge\varphi^{*}\eta$。任意の添字の列 $A$ について $\varphi^{*}(f\,dx_{A})=(f\circ\varphi)\,d\varphi_{a_{1}}\wedge\cdots\wedge d\varphi_{a_{k}}$。
3. $\psi\colon U\to W$ も $C^{1}$ 級なら $(\psi\circ\varphi)^{*}=\varphi^{*}\psi^{*}$。
4. $\varphi$ が $C^{2}$ 級、$\omega$ が $C^{1}$ 級なら $d(\varphi^{*}\omega)=\varphi^{*}(d\omega)$。
5. $m=n=k$ なら $\varphi^{*}(f\,dx_{1}\wedge\cdots\wedge dx_{n})=(f\circ\varphi)\det D\varphi\;du_{1}\wedge\cdots\wedge du_{n}$。
:::

::: proof
**Step 1（1）.** $d\varphi_{i}$ の点 $p$ での値は線形汎関数 $w\mapsto(D\varphi(p)w)_{i}$。\ref{calc:wedge-properties.3} から
$$
(d\varphi_{i_{1}}\wedge\cdots\wedge d\varphi_{i_{k}})_{p}(w_{1},\dots,w_{k})=\det\bigl((D\varphi(p)w_{b})_{i_{a}}\bigr)_{a,b}=dx_{I}\bigl(D\varphi(p)w_{1},\dots,D\varphi(p)w_{k}\bigr).
$$
係数 $f_{I}(\varphi(p))$ を掛けて足す。

**Step 2（2）.** 後半：1 から $\varphi^{*}(f\,dx_{A})$ の各点の値は $f(\varphi(p))dx_{A}(D\varphi(p)\cdot)$ で、同じ計算で $d\varphi_{a_{1}}\wedge\cdots\wedge d\varphi_{a_{k}}$ の値と一致する（\ref{calc:wedge-properties.3} は任意の線形汎関数の列について成り立つ）。前半：$\omega=f\,dx_{A}$, $\eta=g\,dx_{B}$ でよく、$\omega\wedge\eta=fg\,dx_{(A,B)}$ に後半を使えば $(fg)\circ\varphi\,d\varphi_{a_{1}}\wedge\cdots\wedge d\varphi_{b_{l}}=\varphi^{*}\omega\wedge\varphi^{*}\eta$。

**Step 3（3）.** 1 と連鎖律 $D(\psi\circ\varphi)(p)=D\psi(\varphi(p))D\varphi(p)$ から、両辺の各点の値は $\omega_{\psi(\varphi(p))}(D\psi\,D\varphi\,w_{1},\dots)$ で一致。

**Step 4（4）.** 関数 $f$ について：連鎖律から $d(f\circ\varphi)=\sum_{j}\sum_{i}(\partial_{i}f\circ\varphi)\partial_{j}\varphi_{i}\,du_{j}=\sum_{i}(\partial_{i}f\circ\varphi)d\varphi_{i}=\varphi^{*}(df)$。$\varphi$ が $C^{2}$ 級なら各 $d\varphi_{i}$ は $C^{1}$ 級で $d(d\varphi_{i})=0$（\ref{calc:exterior-derivative-properties.3}）、ライプニッツ則から $d(d\varphi_{i_{1}}\wedge\cdots\wedge d\varphi_{i_{k}})=0$。よって
$$
\begin{aligned}
d\bigl(\varphi^{*}(f\,dx_{I})\bigr)&=d(f\circ\varphi)\wedge d\varphi_{i_{1}}\wedge\cdots\wedge d\varphi_{i_{k}}\\
&=\varphi^{*}(df)\wedge\varphi^{*}(dx_{I})=\varphi^{*}(df\wedge dx_{I})=\varphi^{*}(d(f\,dx_{I})).
\end{aligned}
$$

**Step 5（5）.** 1 で $w_{b}=e_{b}$ とすると、$(\varphi^{*}dx_{(1,\dots,n)})_{p}(e_{1},\dots,e_{n})=\det D\varphi(p)$。\ref{calc:dx-properties.4} から係数が決まる。

::: hypcheck
- **$\varphi$ の $C^{2}$ 級**：4 で $d(d\varphi_{i})=0$ に使った（シュワルツの定理）。$C^{1}$ 級だけでは $\varphi^{*}\omega$ の係数が微分可能とは限らない。
- 5 の $\det D\varphi$ には絶対値が付かない：形式の積分は向き付きである（次節）。
:::
:::

## ポアンカレの補題 {#calc:sec-df-poincare}

::: theorem ポアンカレの補題 {#calc:poincare-lemma keywords="on a star-shaped open set, every closed C^1 k-form (k >= 1) is exact; explicit homotopy operator K with dK + Kd = id" index="ポアンカレの補題|ぽあんかれのほだい" refname="ポアンカレの補題"}
$U\subset\mathbb{R}^{n}$ を原点に関して星形（$x\in U$, $t\in[0,1]$ なら $tx\in U$）の開集合とし、$k\ge1$ とする。$C^{1}$ 級の $k$ 形式 $\omega=\sum_{A}f_{A}dx_{A}$（添字の列 $A$ についての和）に対して
$$
K\omega\defeq\sum_{A}\Bigl(\int_{0}^{1}t^{k-1}f_{A}(tx)\,dt\Bigr)\sum_{a=1}^{k}(-1)^{a-1}x_{A_{a}}\,dx_{A\setminus a}
$$
（$A\setminus a$ は $A$ から第 $a$ 項を除いた列）とおくと、$K\omega$ は $C^{1}$ 級の $(k-1)$ 形式で、$d(K\omega)+K(d\omega)=\omega$。とくに閉形式は完全：$\omega=d(K\omega)$。
:::

::: intuition
$\omega$ を原点から各点 $x$ へ向かう線分に沿って「積分して戻す」操作が $K$ である。$k=1$ では $K(\sum f_{i}dx_{i})(x)=\int_{0}^{1}\sum_{i}f_{i}(tx)x_{i}\,dt$ は、線分 $t\mapsto tx$ に沿った $\omega$ の線積分で、$d\omega=0$ ならこれがポテンシャル（原始関数）になる。
:::

::: proof
**Step 0（well-defined）.** $A$ を並べ替えた列 $A^{\sigma}$ では、$\sum_{a}(-1)^{a-1}x_{A_{a}}dx_{A\setminus a}$ も $\operatorname{sgn}(\sigma)$ 倍になる（隣接互換で確かめる：第 $a$, $a+1$ 項を入れ替えると、それ以外の項は $dx_{A\setminus\cdot}$ の中で隣接互換が起きて $-1$ 倍、第 $a$, $a+1$ 項は互いに入れ替わり符号 $(-1)^{a-1}$, $(-1)^{a}$ も入れ替わって $-1$ 倍）。よって $f\,dx_{A}$ と $\operatorname{sgn}(\sigma)f\,dx_{A^{\sigma}}$ に対する $K$ は一致し、重複のある $A$ では $0$（隣り合う同じ添字の互換で $-1$ 倍かつ不変）。したがって $K$ は $\omega$ の表し方によらない。係数 $x\mapsto\int_{0}^{1}t^{k-1}f_{A}(tx)\,dt$ は、\ref{calc:differentiation-under-integral}（$f_{A}(tx)$ は $(x,t)$ の $C^{1}$ 級関数）から $C^{1}$ 級で、$\partial_{j}\int_{0}^{1}t^{k-1}f_{A}(tx)\,dt=\int_{0}^{1}t^{k}(\partial_{j}f_{A})(tx)\,dt$。

**Step 1（$dK\omega$）.** 線形性から $\omega=f\,dx_{I}$（$I\in\mathcal{I}_{k}$）でよい。$g(x)\defeq\int_{0}^{1}t^{k-1}f(tx)\,dt$ とすると、ライプニッツ則から
$$
d(K\omega)=\sum_{j}\Bigl(\int_{0}^{1}t^{k}\partial_{j}f(tx)\,dt\Bigr)dx_{j}\wedge\sum_{a}(-1)^{a-1}x_{i_{a}}dx_{I\setminus a}+g\sum_{a}(-1)^{a-1}dx_{i_{a}}\wedge dx_{I\setminus a}.
$$
$dx_{i_{a}}\wedge dx_{I\setminus a}=(-1)^{a-1}dx_{I}$（$i_{a}$ を第 $a$ 位置へ戻す）なので、第 2 項は $k\,g\,dx_{I}$。

**Step 2（$Kd\omega$）.** $d\omega=\sum_{j}\partial_{j}f\,dx_{(j,I)}$（長さ $k+1$ の列 $(j,i_{1},\dots,i_{k})$）。$K$ の定義で、列 $(j,I)$ の第 1 項 $j$ を除くと $+x_{j}dx_{I}$、第 $a+1$ 項 $i_{a}$ を除くと $(-1)^{a}x_{i_{a}}dx_{(j,I\setminus a)}$ なので
$$
K(d\omega)=\sum_{j}\Bigl(\int_{0}^{1}t^{k}\partial_{j}f(tx)\,dt\Bigr)\Bigl(x_{j}dx_{I}-\sum_{a}(-1)^{a-1}x_{i_{a}}dx_{j}\wedge dx_{I\setminus a}\Bigr).
$$

**Step 3（和）.** Step 1 の第 1 項と Step 2 の第 2 項は打ち消し合い、
$$
\begin{aligned}
d(K\omega)+K(d\omega)&=\Bigl(\int_{0}^{1}\bigl(kt^{k-1}f(tx)+t^{k}\textstyle\sum_{j}x_{j}\partial_{j}f(tx)\bigr)dt\Bigr)dx_{I}\\
&=\Bigl(\int_{0}^{1}\frac{d}{dt}\bigl(t^{k}f(tx)\bigr)dt\Bigr)dx_{I}=f(x)\,dx_{I}
\end{aligned}
$$
（連鎖律と微分積分学の基本定理）。

::: hypcheck
- **星形**：$K\omega$ の定義（$tx\in U$）に使った。外すと偽：下の例で $\mathbb{R}^{2}\setminus\{0\}$ 上の閉形式は完全でない。
- **$C^{1}$ 級**：積分記号下の微分と、$d\omega$ の存在に使った。
- **$k\ge1$**：$k=0$ では閉形式は（連結なら）定数で、完全という概念がない。
:::
:::

## 鎖とストークスの定理 {#calc:sec-df-stokes}

::: definition 特異立方体と鎖 {#calc:singular-cube-chain keywords="singular k-cube c: I^k -> U of class C^2, k-chains as formal integer combinations, faces c_{(i,alpha)}, boundary of a cube and of a chain" index="特異立方体|とくいりっぽうたい, 鎖（立方体）|さりっぽうたい, 境界（鎖）|きょうかいさ"}
1. $U$ の**特異 $k$ 立方体**とは $C^{2}$ 級の写像 $c\colon I^{k}\to U$ をいう（$k=0$ では 1 点 $c(0)$）。恒等写像 $\iota_{k}\colon I^{k}\to I^{k}$ を**標準立方体**という。特異 $k$ 立方体の整数係数の形式的な有限和 $\sum m_{j}c_{j}$ を **$k$ 鎖**という。
2. $1\le i\le k$, $\alpha\in\{0,1\}$ について、面 $c_{(i,\alpha)}\colon I^{k-1}\to U$ を $c_{(i,\alpha)}(u)\defeq c(u_{1},\dots,u_{i-1},\alpha,u_{i},\dots,u_{k-1})$ とし、**境界**を
$$
\partial c\defeq\sum_{i=1}^{k}\sum_{\alpha=0,1}(-1)^{i+\alpha}c_{(i,\alpha)}
$$
とする（$(k-1)$ 鎖。鎖には線形に延ばす）。
:::

::: example
1. $k=1$：$\partial c=c(1)-c(0)$（0 立方体の差）。
2. $k=2$：$\partial\iota_{2}=-\iota_{2(1,0)}+\iota_{2(1,1)}+\iota_{2(2,0)}-\iota_{2(2,1)}$。$\iota_{2(2,0)}(u)=(u,0)$（下辺を右へ）、$\iota_{2(1,1)}(u)=(1,u)$（右辺を上へ）、$-\iota_{2(2,1)}$（上辺を左へ）、$-\iota_{2(1,0)}$（左辺を下へ）で、正方形の境界を反時計回りに 1 周する。
:::

::: definition 鎖の上の積分 {#calc:chain-integral keywords="integral of a k-form over a singular k-cube via pullback to I^k, extended linearly to chains" index="鎖の上の積分|さのうえのせきぶん"}
$I^{k}$ の近傍の上の連続な $k$ 形式 $\eta=g\,du_{1}\wedge\cdots\wedge du_{k}$ について $\int_{I^{k}}\eta\defeq\int_{I^{k}}g$（重積分）。$U$ 上の連続な $k$ 形式 $\omega$ と特異 $k$ 立方体 $c$ について $\int_{c}\omega\defeq\int_{I^{k}}c^{*}\omega$、鎖について $\int_{\sum m_{j}c_{j}}\omega\defeq\sum m_{j}\int_{c_{j}}\omega$。$k=0$ では $\int_{c}f\defeq f(c(0))$。
:::

::: remark
$p\colon I^{k}\to I^{k}$ が $I^{k}$ の近傍で定義された $C^{1}$ 級の単射で、$\det Dp>0$、$p(I^{k})=I^{k}$ なら、5（\ref{calc:pullback-properties}）と\ref{calc:change-of-variables}から $\int_{c\circ p}\omega=\int_{c}\omega$。$\det Dp<0$ なら符号が変わる。この意味で鎖の上の積分は「向き付きの」パラメータ付けによらない。
:::

::: theorem 鎖の上のストークスの定理 {#calc:stokes-chains keywords="Stokes theorem for chains: int_c d omega = int_{partial c refname="鎖の上のストークスの定理"} omega for a C^1 (k-1)-form omega and a C^2 k-chain c" index="ストークスの定理（鎖）|すとーくすのていりさ"}
$U$ 上の $C^{1}$ 級の $(k-1)$ 形式 $\omega$ と $k$ 鎖 $c$（$k\ge1$）について
$$
\int_{c}d\omega=\int_{\partial c}\omega.
$$
:::

::: proof
**Step 1（標準立方体）.** $c=\iota_{k}$ で、$\omega$ が $I^{k}$ の近傍上の $C^{1}$ 級の形式の場合を示す。線形性から $\omega=f\,du_{1}\wedge\cdots\wedge\widehat{du_{i}}\wedge\cdots\wedge du_{k}$（$du_{i}$ を除く）でよい。
$$
d\omega=\partial_{i}f\,du_{i}\wedge du_{1}\wedge\cdots\wedge\widehat{du_{i}}\wedge\cdots\wedge du_{k}=(-1)^{i-1}\partial_{i}f\,du_{1}\wedge\cdots\wedge du_{k}.
$$
フビニの定理（\ref{calc:fubini-continuous}、$u_{i}$ を最初に積分）と微分積分学の基本定理から
$$
\int_{I^{k}}d\omega=(-1)^{i-1}\int_{I^{k-1}}\bigl(f(u_{1},\dots,1,\dots,u_{k})-f(u_{1},\dots,0,\dots,u_{k})\bigr)
$$
（$1$, $0$ は第 $i$ 座標）。

**Step 2（標準立方体の境界）.** 面 $\iota_{k(j,\alpha)}$ の第 $j$ 成分は定数なので、$\iota_{k(j,\alpha)}^{*}du_{j}=0$、$\iota_{k(j,\alpha)}^{*}du_{l}=du_{l}$（$l<j$）、$du_{l-1}$（$l>j$）。よって $j\neq i$ なら $\iota_{k(j,\alpha)}^{*}\omega=0$（$du_{j}$ を含む）、$j=i$ なら $\iota_{k(i,\alpha)}^{*}\omega=f(\dots,\alpha,\dots)du_{1}\wedge\cdots\wedge du_{k-1}$。
$$
\int_{\partial\iota_{k}}\omega=\sum_{\alpha}(-1)^{i+\alpha}\int_{I^{k-1}}f(\dots,\alpha,\dots)=(-1)^{i-1}\int_{I^{k-1}}\bigl(f(\dots,1,\dots)-f(\dots,0,\dots)\bigr).
$$
Step 1 と一致する。

**Step 3（一般の立方体）.** $c$ は $I^{k}$ の近傍の上の $C^{2}$ 級写像の制限なので、\ref{calc:pullback-properties.4} から $c^{*}d\omega=d(c^{*}\omega)$。Step 1・2 を $c^{*}\omega$ に使うと
$$
\int_{c}d\omega=\int_{I^{k}}d(c^{*}\omega)=\int_{\partial\iota_{k}}c^{*}\omega=\sum_{i,\alpha}(-1)^{i+\alpha}\int_{I^{k-1}}\iota_{k(i,\alpha)}^{*}c^{*}\omega=\sum_{i,\alpha}(-1)^{i+\alpha}\int_{c_{(i,\alpha)}}\omega,
$$
最後は $(c\circ\iota_{k(i,\alpha)})^{*}=\iota_{k(i,\alpha)}^{*}c^{*}$（\ref{calc:pullback-properties.3}）と $c\circ\iota_{k(i,\alpha)}=c_{(i,\alpha)}$ から。右辺は $\int_{\partial c}\omega$。鎖には線形に延ばす。

::: hypcheck
- **$c$ の $C^{2}$ 級**：Step 3 で $c^{*}d=dc^{*}$ に使った。
- **$\omega$ の $C^{1}$ 級**：$d\omega$ の存在と、Step 1 の微分積分学の基本定理（$\partial_{i}f$ の連続性）に使った。
- 1 の分割も多様体も使わない：積分領域は常に標準立方体 $I^{k}$ で、計算はフビニの定理と 1 変数の基本定理に帰着した。
:::
:::

::: corollary 閉曲線と完全形式 {#calc:exact-closed-curve keywords="the integral of an exact 1-form df over a 1-chain with zero boundary vanishes; d omega = 0 does not imply exactness on R^2 minus a point" index="完全形式の周回積分|かんぜんけいしきのしゅうかいせきぶん"}
1. $\int_{c}df=f(c(1))-f(c(0))$（1 立方体 $c$）。とくに $\partial c=0$ となる 1 鎖 $c$ の上で完全形式の積分は $0$。
2. $U=\mathbb{R}^{2}\setminus\{0\}$ 上の $\omega\defeq\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$ は閉形式だが完全形式でない。
:::

::: proof
**Step 1（1）.** ストークスの定理で $k=1$。$\partial c=0$ なら右辺は $0$。

**Step 2（2 の閉性）.** $\partial_{x}\frac{x}{x^{2}+y^{2}}=\frac{y^{2}-x^{2}}{(x^{2}+y^{2})^{2}}$, $\partial_{y}\frac{-y}{x^{2}+y^{2}}=\frac{y^{2}-x^{2}}{(x^{2}+y^{2})^{2}}$ なので $d\omega=\bigl(\partial_{x}\frac{x}{r^{2}}-\partial_{y}\frac{-y}{r^{2}}\bigr)dx\wedge dy=0$。

**Step 3（2 の非完全性）.** $c(t)\defeq(\cos2\pi t,\sin2\pi t)$ は $c(0)=c(1)$ で $\partial c=0$。$c^{*}\omega=\bigl(-\sin2\pi t\cdot(-2\pi\sin2\pi t)+\cos2\pi t\cdot2\pi\cos2\pi t\bigr)dt=2\pi\,dt$ なので $\int_{c}\omega=2\pi\neq0$。$\omega=df$ なら 1 に反する。
:::

::: supplement
**多様体論との関係.** このページの $k$ 形式は、各点に交代 $k$ 重線形形式（\ref{calc:dx-properties.4} により $\Lambda^{k}(\mathbb{R}^{n})^{*}$ の元、外積代数 \ref{lin:exterior-algebra}）を割り当てたものと同じである。多様体論では、接空間の双対の外冪 $\Lambda^{k}T_{p}^{*}$ の切断として抽象的に定義し、座標近傍の上では $dx_{I}$ が基底になって、このページの定義と一致することを示す。\ref{calc:pullback-properties.1}（各点の式）は、その一致のための座標によらない記述になっている。

**一般化.** ストークスの定理は、境界付きの多様体（さらには角付き多様体）の上で $\int_{M}d\omega=\int_{\partial M}\omega$ の形に一般化される。そこでは $M$ を立方体の像に分ける代わりに 1 の分割を使う。ポアンカレの補題の「閉形式なのに完全でない」形式の空間は**ド・ラーム・コホモロジー**を定め、$\mathbb{R}^{2}\setminus\{0\}$ の例は、それが円周の 1 次コホモロジー $\mathbb{R}$ を検出していることにあたる（知られている）。

**高い視点.** ストークスの定理 $\int_{c}d\omega=\int_{\partial c}\omega$ は、「外微分 $d$ と境界 $\partial$ は、積分というペアリングについて互いに随伴」であることを言っている。$dd=0$ と $\partial\partial=0$ が対応し、閉形式と境界のない鎖（サイクル）、完全形式と境界を対にしたものが、コホモロジーとホモロジーの双対性の原型である。比喩で言えば、$d\omega$ を領域の内側で全部足すと、内側どうしの寄与は隣り合う小立方体の共通の面で打ち消し合い（向きが逆）、外周の寄与だけが残る。1 変数の微分積分学の基本定理 $\int_{a}^{b}f'=f(b)-f(a)$ はその最も簡単な場合（区間の境界は 2 点）である。
:::

## 問題 {#calc:sec-df-problems}

::: problem {#calc:prob-df-dx-dy-polar}
極座標 $\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$ について $\Phi^{*}(dx\wedge dy)=r\,dr\wedge d\theta$ を、定義（$d\Phi_{1}\wedge d\Phi_{2}$ の展開）と \ref{calc:pullback-properties.5} の 2 通りで確かめよ。
:::

::: solution
$d\Phi_{1}=\cos\theta\,dr-r\sin\theta\,d\theta$, $d\Phi_{2}=\sin\theta\,dr+r\cos\theta\,d\theta$。外積は $r\cos^{2}\theta\,dr\wedge d\theta-r\sin^{2}\theta\,d\theta\wedge dr=r\,dr\wedge d\theta$。5 では $\det D\Phi=r$。
:::

::: problem {#calc:prob-df-boundary-squared}
特異立方体 $c$ について $\partial(\partial c)=0$ を示せ（$i<j$ について $(c_{(i,\alpha)})_{(j-1,\beta)}=(c_{(j,\beta)})_{(i,\alpha)}$ を使う）。
:::

::: solution
$\partial\partial c=\sum_{i,\alpha}\sum_{j',\beta}(-1)^{i+\alpha+j'+\beta}(c_{(i,\alpha)})_{(j',\beta)}$ を、$j'\ge i$ の項と $j'<i$ の項に分ける。前者では $j\defeq j'+1>i$ とおくと、関係式から項は $(-1)^{i+\alpha+j-1+\beta}(c_{(j,\beta)})_{(i,\alpha)}$。後者では添字の名前を $(i,\alpha)\to(j,\beta)$, $(j',\beta)\to(i,\alpha)$ と付け替えると、$i<j$ について項は $(-1)^{j+\beta+i+\alpha}(c_{(j,\beta)})_{(i,\alpha)}$。同じ $(i,\alpha,j,\beta)$（$i<j$）の 2 つの項は符号が逆で打ち消し合う。関係式は、両辺とも第 $i$ 座標に $\alpha$、第 $j$ 座標に $\beta$ を入れ、残りの座標を順に $u$ で埋めた写像であることから。
:::

::: problem {#calc:prob-df-potential}
$\omega=2xy\,dx+(x^{2}+3y^{2})\,dy$ が $\mathbb{R}^{2}$ 上で閉形式であることを確かめ、ポアンカレの補題の $K$ でポテンシャル $f$（$df=\omega$）を求めよ。
:::

::: solution
$\partial_{x}(x^{2}+3y^{2})=2x=\partial_{y}(2xy)$ なので $d\omega=0$。$K\omega(x,y)=\int_{0}^{1}\bigl(2t^{2}xy\cdot x+(t^{2}x^{2}+3t^{2}y^{2})y\bigr)dt=\frac{2x^{2}y}{3}+\frac{x^{2}y}{3}+y^{3}=x^{2}y+y^{3}$。
:::
