# フビニの定理 {#calc:page-fubini keywords="Fubini's theorem for Riemann integrals, iterated integrals, lower and upper integrals, order of integration, normal domains (vertical slices), area and volume between graphs, counterexamples to Fubini"}

重積分を実際に計算するには、1 変数の積分を繰り返す（**累次積分**）のがふつうである。このページの主結果**フビニの定理**は、直方体 $A\times B$ 上で積分可能な関数の重積分が、まず $y$ で、次に $x$ で積分した値に等しいことを主張する。リーマン積分の枠組みでは、各 $x$ で $y\mapsto f(x,y)$ が積分可能とは限らないので、主張は下積分・上積分を使って述べる。応用として、2 つのグラフにはさまれた**縦線集合**の上の積分を 1 変数の積分に帰着させる。積分の順序を入れ替えてはいけない例も挙げる。

> 資料：Rudin『Principles of Mathematical Analysis』第 10 章、杉浦光夫『解析入門 I』第 IV 章と同じ標準的な内容。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-fu-notation}

::: notation
- 直方体上の積分・ダルブー和・判定法 \ref{calc:box-partition}, \ref{calc:box-integral}, \ref{calc:box-riemann-criterion}、基本性質 \ref{calc:box-integral-properties}、測度 $0$ \ref{calc:measure-zero-rn}, \ref{calc:measure-zero-rn-properties}、ルベーグの判定法 \tref{calc:lebesgue-criterion-rn}、ジョルダン可測集合 \ref{calc:jordan-measurable}, \ref{calc:jordan-measurable-criterion}。
- 1 変数の積分の性質 \ref{calc:integral-properties}、微分積分学の基本定理 \tref{calc:fundamental-theorem}、置換積分 \ref{calc:substitution-parts}。
- $A\subset\mathbb{R}^{n}$, $B\subset\mathbb{R}^{m}$ を閉直方体、$A\times B\subset\mathbb{R}^{n+m}$ の点を $(x,y)$ と書く。有界な関数 $g$ の下積分・上積分を $\underline{\int}g$, $\overline{\int}g$ と書く（\ref{calc:box-integral}）。
- **体系**：$\mathsf{ZF}$。選択公理は使わない。
:::

## フビニの定理 {#calc:sec-fu-fubini}

::: theorem フビニの定理 {#calc:fubini keywords="Fubini's theorem for Riemann integrable functions on a product of boxes, stated with lower and upper integrals of the sections" index="フビニの定理|ふびにのていり, 累次積分|るいじせきぶん, 逐次積分|ちくじせきぶん" refname="フビニの定理"}
$f\colon A\times B\to\mathbb{R}$ を積分可能とし、$x\in A$ について
$$
\underline{\varphi}(x)\defeq\underline{\int_{B}}f(x,y)\,dy,\qquad\overline{\varphi}(x)\defeq\overline{\int_{B}}f(x,y)\,dy
$$
とおく。$\underline{\varphi}$, $\overline{\varphi}$ は $A$ 上で積分可能で
$$
\int_{A\times B}f=\int_{A}\underline{\varphi}=\int_{A}\overline{\varphi}.
$$
とくに、各 $x$ で $y\mapsto f(x,y)$ が積分可能なら $\int_{A\times B}f=\int_{A}\bigl(\int_{B}f(x,y)\,dy\bigr)dx$。$x$ と $y$ の役割を入れ替えても同じ。
:::

::: intuition
重積分のダルブー和を「$A$ 側の小直方体 $S$ ごと」に並べ直すと、$S$ の上での $y$ 方向のダルブー和を $S$ について足したものになる。$y$ 方向のダルブー和は $y$ についての下積分・上積分で挟めるので、重積分のダルブー和は累次積分のダルブー和で挟まれる。重積分のダルブー和の上下が近づくなら、挟まれた累次積分も同じ値になる。
:::

::: proof
**Step 1（分割）.** 【主張：$A\times B$ の分割は $A$ の分割と $B$ の分割の組で、小直方体の体積は積】$A\times B$ の分割は、$A$ の分割 $P_{A}$ と $B$ の分割 $P_{B}$ の組 $P=(P_{A},P_{B})$ であり（各座標の区間の分割の組なので）、小直方体は $S\times T$（$S\in P_{A}$, $T\in P_{B}$）の形で、$v(S\times T)=v(S)v(T)$ である。

**Step 2.** $|f|\le C$ とすると、各 $x$ で $|f(x,\cdot)|\le C$ なので $|\underline{\varphi}(x)|,|\overline{\varphi}(x)|\le Cv(B)$ である。よって $\underline{\varphi}$, $\overline{\varphi}$ は有界で、$A$ の分割についてのダルブー和が定義できる。【主張：$L(f,P)\le L(\underline{\varphi},P_{A})$】$S\in P_{A}$ と $x\in S$ を固定する。各 $T$ で $m_{S\times T}(f)\le\inf_{y\in T}f(x,y)$ なので
$$
\sum_{T}m_{S\times T}(f)v(T)\le L\bigl(f(x,\cdot),P_{B}\bigr)\le\underline{\varphi}(x)
$$
が成り立つ。左辺は $x\in S$ によらないので、$x$ について下限をとって $\sum_{T}m_{S\times T}(f)v(T)\le m_{S}(\underline{\varphi})$ を得る。$v(S)$ を掛けて $S$ について足すと $L(f,P)\le L(\underline{\varphi},P_{A})$ となる。

**Step 3.** 【主張：$U(\overline{\varphi},P_{A})\le U(f,P)$ であり、$\underline{\varphi}\le\overline{\varphi}$】Step 2 の下限を上限に替えた同じ議論で $U(\overline{\varphi},P_{A})\le U(f,P)$ を得る。また、各 $x$ で下積分は上積分以下なので（\ref{calc:box-refinement}）、$\underline{\varphi}\le\overline{\varphi}$ である。以上から次の 2 つの不等式の列が成り立つ：
$$
L(f,P)\le L(\underline{\varphi},P_{A})\le U(\underline{\varphi},P_{A})\le U(\overline{\varphi},P_{A})\le U(f,P),
$$
$$
L(f,P)\le L(\underline{\varphi},P_{A})\le L(\overline{\varphi},P_{A})\le U(\overline{\varphi},P_{A})\le U(f,P).
$$
（各列の内側の不等式は、下和 $\le$ 上和と $\underline{\varphi}\le\overline{\varphi}$ による。）

**Step 4.** 【主張：$\underline{\varphi}$, $\overline{\varphi}$ は積分可能で、積分はどちらも $\int_{A\times B}f$】$\varepsilon>0$ について $U(f,P)-L(f,P)<\varepsilon$ となる $P$ をとる（\ref{calc:box-riemann-criterion}）。上の 2 つの不等式の列から $U(\underline{\varphi},P_{A})-L(\underline{\varphi},P_{A})<\varepsilon$, $U(\overline{\varphi},P_{A})-L(\overline{\varphi},P_{A})<\varepsilon$ となる。$\varepsilon$ は任意なので、$\underline{\varphi}$, $\overline{\varphi}$ は積分可能である（\ref{calc:box-riemann-criterion}）。さらに $\int_{A}\underline{\varphi}$ と $\int f$ はともに区間 $[L(f,P),U(f,P)]$ に入るので、差は $\varepsilon$ 未満である。$\varepsilon$ は任意なので両者は等しい。$\overline{\varphi}$ についても同様である。各 $x$ で $f(x,\cdot)$ が積分可能なら $\underline{\varphi}=\overline{\varphi}=\int_{B}f(x,y)\,dy$ なので、「とくに」の主張を得る。

::: hypcheck
- **$f$ が $A\times B$ 上で積分可能**：Step 4 で $U(f,P)-L(f,P)$ を小さくするのに使った。外すと偽：下の \ref{calc:fubini-counterexamples.1} では累次積分が両方存在して等しいが、$f$ は積分可能でない。
- 下積分・上積分の形は省けない：\ref{calc:fubini-counterexamples.2} では、$f$ は積分可能だが、ある $x$ で $f(x,\cdot)$ が積分可能でない。
- 選択公理は使わない。
:::
:::

::: corollary 連続関数の累次積分 {#calc:fubini-continuous keywords="for continuous f on a box, the integral equals the iterated integral in any order" index="累次積分（連続関数）|るいじせきぶんれんぞくかんすう"}
$f$ が $R=\prod_{i=1}^{n}[a_{i},b_{i}]$ 上で連続なら、
$$
\int_{R}f=\int_{a_{1}}^{b_{1}}\Bigl(\cdots\Bigl(\int_{a_{n}}^{b_{n}}f(x_{1},\dots,x_{n})\,dx_{n}\Bigr)\cdots\Bigr)dx_{1}
$$
で、右辺の積分の順序は任意に入れ替えてよい。
:::

::: proof
$n$ についての帰納法で示す。$n=1$ なら、式は $\int_{R}f=\int_{a_{1}}^{b_{1}}f$ そのものである。$n\ge2$ とし、$A\defeq\prod_{i=1}^{n-1}[a_{i},b_{i}]$ とおいて $R=A\times[a_{n},b_{n}]$ とみる。$f$ は積分可能であり（\ref{calc:box-integral-properties.3}）、各 $x\in A$ で $f(x,\cdot)$ は連続なので積分可能である。よってフビニの定理から、$g(x)\defeq\int_{a_{n}}^{b_{n}}f(x,t)\,dt$ とおくと $\int_{R}f=\int_{A}g$ である。$g$ は連続である。実際、$f$ はコンパクト集合 $R$ 上で一様連続（\ref{top:heine-cantor}）なので、$\varepsilon>0$ に $\delta>0$ があり、$|x-x'|<\delta$ ならすべての $t$ で $|f(x,t)-f(x',t)|<\varepsilon$ となる。このとき $|g(x)-g(x')|\le\varepsilon(b_{n}-a_{n})$ である。帰納法の仮定を $A$ 上の連続関数 $g$ に使えば式を得る。

順序の入れ替えについて。座標の並べ替え $\sigma$ は閉直方体を閉直方体に写し、分割を分割に、小直方体を同じ体積の小直方体に写す。よって $f$ と $f\circ\sigma^{-1}$ のダルブー和は分割の対応で一致し、$\int_{\sigma(R)}f\circ\sigma^{-1}=\int_{R}f$ である。並べ替えた変数の順で上の式を使えば、任意の順序の累次積分が $\int_{R}f$ に等しい。
:::

::: counterexample フビニの定理の前提が外れる例 {#calc:fubini-counterexamples keywords="iterated integrals equal but f not integrable (dense set meeting lines finitely); f integrable but a section not integrable; unbounded f with different iterated integrals" index="フビニの定理の反例|ふびにのていりのはんれい"}
1. $S\defeq\{(i/2^{k},j/2^{k}):k\ge1,\ 0<i,j<2^{k},\ i,j\text{ は奇数}\}\subset[0,1]^{2}$、$f\defeq\chi_{S}$ とする。2 つの累次積分は存在してともに $0$ だが、$f$ は $[0,1]^{2}$ 上で積分可能でない。
2. $f(x,y)\defeq1$（$x=\frac12$ かつ $y\in\mathbb{Q}$）、それ以外で $0$、とする。$f$ は $[0,1]^{2}$ 上で積分可能で積分は $0$ だが、$y\mapsto f(\frac12,y)$ は積分可能でない。
3. $f(x,y)\defeq\dfrac{x^{2}-y^{2}}{(x^{2}+y^{2})^{2}}$（$(x,y)\in(0,1]^{2}$）は有界でなく、
$$
\int_{0}^{1}\Bigl(\int_{0}^{1}f\,dy\Bigr)dx=\frac\pi4,\qquad\int_{0}^{1}\Bigl(\int_{0}^{1}f\,dx\Bigr)dy=-\frac\pi4.
$$
:::

::: proof
**Step 1（1 の累次積分）.** 【主張：反例 1 の 2 つの累次積分は存在して $0$】$x=i/2^{k}$（$i$ 奇数、既約）と書ける $x$ について、$(x,y)\in S$ となる $y$ は分母が同じ $2^{k}$ のもの $j/2^{k}$ だけ（$S$ の点の 2 つの座標は同じ $k$ で既約表示される）で、有限個。それ以外の $x$ では、どの $y$ でも $(x,y)\notin S$ である。よってどの $x$ でも $f(x,\cdot)$ は有限個の点を除いて $0$ である。このような関数は積分可能で（\ref{calc:integrable-classes.3}）、どの小区間も $f(x,\cdot)=0$ の点を含むので下和は $0$ であり、積分は $0$ である。ゆえに外側の被積分関数は恒等的に $0$ で、累次積分は $0$ である。$S$ は $x,y$ について対称なので、逆の順序でも同じである。

**Step 2（1 の非可積分性）.** 【主張：反例 1 の $f$ は $[0,1]^{2}$ 上で積分可能でない】$S$ は $[0,1]^{2}$ で稠密である（$(0,1)^{2}$ に含まれる任意の開正方形は、$2^{1-k}$ が辺より小さい $k$ について、分子 $i,j$ が奇数の点 $(i/2^{k},j/2^{k})$ を含む。長さが $2^{1-k}$ より大きい開区間は $1/2^{k}$ の連続する 2 つの倍数を含み、その一方の分子は奇数だからである。$(0,1)^{2}$ は $[0,1]^{2}$ で稠密なので、これで足りる）。補集合も稠密である（$S$ は可算集合で、正方形は非可算）。よって $\chi_{S}$ は $[0,1]^{2}$ のすべての点で不連続である。$[0,1]^{2}$ は測度 $0$ でない（\ref{calc:measure-zero-rn-properties.3}）ので、ルベーグの判定法（\tref{calc:lebesgue-criterion-rn}）から $\chi_{S}$ は積分可能でない。

**Step 3（2）.** 【主張：反例 2 の $f$ は積分可能で積分は $0$ だが、$f(\frac12,\cdot)$ は積分可能でない】$f$ の不連続点は線分 $\{\frac12\}\times[0,1]$ の上にあり、これは測度 $0$（\ref{calc:measure-zero-rn-properties.4}）なので、ルベーグの判定法から $f$ は積分可能である。$f\ge0$ であり、体積正の小長方形はどれも $f=0$ の点を含むので下和は $0$ である。ゆえに積分は $0$ である。$f(\frac12,\cdot)$ は 1 変数のディリクレ関数なので積分可能でない。フビニの定理の記号では $\underline{\varphi}(\frac12)=0$, $\overline{\varphi}(\frac12)=1$ であり、1 点での値の違いは $\int_{A}$ に影響しない。

**Step 4（3）.** 【主張：反例 3 の累次積分は順に $\frac\pi4$, $-\frac\pi4$】$x\in(0,1]$ を固定すると、$\frac{\partial}{\partial y}\frac{y}{x^{2}+y^{2}}=\frac{(x^{2}+y^{2})-2y^{2}}{(x^{2}+y^{2})^{2}}=f(x,y)$ である。同じ式で $y=0$ まで延ばすと $y\mapsto f(x,y)$ は $[0,1]$ 上で連続なので、微分積分学の基本定理から $\int_{0}^{1}f(x,y)\,dy=\frac{1}{1+x^{2}}$ となる。これは $[0,1]$ 上で連続に延び、$\int_{0}^{1}\frac{dx}{1+x^{2}}=\arctan1=\frac\pi4$ である。$f(y,x)=-f(x,y)$ なので、変数の名前を入れ替えると逆の順序の累次積分は $-\frac\pi4$ である。$f$ は原点の近くで有界でない（$f(2t,t)=\frac{3}{25t^{2}}$）ので、リーマン積分の枠組み（フビニの定理）の外にある。
:::

## 縦線集合上の積分 {#calc:sec-fu-normal-domain}

::: theorem 縦線集合上の積分 {#calc:normal-domain-integral keywords="region between graphs of continuous functions over a box is Jordan measurable; integral over it as an iterated integral; volume as integral of the difference" index="縦線集合|じゅうせんしゅうごう, 縦線領域|じゅうせんりょういき"}
$A\subset\mathbb{R}^{n}$ を閉直方体、$\varphi_{1}\le\varphi_{2}$ を $A$ 上の連続関数とし、
$$
E\defeq\{(x,y)\in A\times\mathbb{R}:\varphi_{1}(x)\le y\le\varphi_{2}(x)\}
$$
（**縦線集合**）とおく。$E$ はコンパクトなジョルダン可測集合で、$E$ 上の連続関数 $f$ について
$$
\int_{E}f=\int_{A}\Bigl(\int_{\varphi_{1}(x)}^{\varphi_{2}(x)}f(x,y)\,dy\Bigr)dx.
$$
とくに $v(E)=\int_{A}(\varphi_{2}-\varphi_{1})$。
:::

::: intuition
二つの連続関数のグラフで上下を挟まれた領域の上の積分は、まず縦方向に積分してから横方向に積分すれば計算できる。
:::

::: proof
**Step 1.** 【主張：縦線集合 $E$ はコンパクト】$\varphi_{i}$ は $A$ 上で有界なので、$c\le\varphi_{1}$, $\varphi_{2}\le d$ となる $c,d$ があり、$E\subset A\times[c,d]$ なので $E$ は有界である。$E$ は、連続関数 $(x,y)\mapsto y-\varphi_{1}(x)$, $\varphi_{2}(x)-y$ が $\ge0$ となる閉集合と閉集合 $A\times\mathbb{R}$ の共通部分なので閉である。ゆえにハイネ–ボレルの定理からコンパクトである。

**Step 2（境界）.** 【主張：$E$ の境界は測度 $0$ で、$E$ はジョルダン可測】$E$ は閉なので $\partial E\subset E$ である。$(x,y)\in E$ が $x\in\operatorname{int}A$, $\varphi_{1}(x)<y<\varphi_{2}(x)$ を満たすなら、連続性から $(x,y)$ のある近傍で同じ不等式が成り立つので、$(x,y)$ は内点である。よって $\partial E$ は 2 つのグラフと $\partial A\times[c,d]$ の和に含まれ、どれも測度 $0$（\ref{calc:measure-zero-rn-properties.4}。$\partial A\times[c,d]$ は、1 辺の長さが $0$ の閉直方体の有限個の和）。ゆえに \ref{calc:jordan-measurable-criterion.1} から $E$ はジョルダン可測である。

**Step 3.** 【主張：$\int_{E}f$ は累次積分に等しい】$\tilde f$ を $f$ の $A\times[c,d]$ への零延長とすると、\ref{calc:jordan-measurable-criterion.3} から $\tilde f$ は積分可能である。各 $x\in A$ で $y\mapsto\tilde f(x,y)$ は、$[\varphi_{1}(x),\varphi_{2}(x)]$ の上で $f(x,y)$（連続）、その外で $0$ である。よって不連続点は高々 2 個なので積分可能であり（\ref{calc:integrable-classes.3}）、積分は $\int_{\varphi_{1}(x)}^{\varphi_{2}(x)}f(x,y)\,dy$ である（1 変数の区間の加法性）。ゆえにフビニの定理（各 $x$ で積分可能な場合）から主張を得る。$f=1$ とすれば体積の式を得る。
:::

::: example
1. **円板の面積**：$A=[-1,1]$, $\varphi_{2}=\sqrt{1-x^{2}}=-\varphi_{1}$ で $v(E)=\int_{-1}^{1}2\sqrt{1-x^{2}}\,dx$。$x=\sin t$（$t\in[-\frac\pi2,\frac\pi2]$）と置換すると $\int_{-\pi/2}^{\pi/2}2\cos^{2}t\,dt=\pi$。
2. **積分の順序の交換**：$\int_{0}^{1}\bigl(\int_{x}^{1}e^{y^{2}}dy\bigr)dx$ は内側の原始関数が初等関数で書けないが、領域 $\{0\le x\le y\le1\}$ を $y$ を外側にして縦線集合とみると（$A=[0,1]\ni y$, $0\le x\le y$）、
$$
\int_{0}^{1}\Bigl(\int_{0}^{y}e^{y^{2}}dx\Bigr)dy=\int_{0}^{1}ye^{y^{2}}dy=\frac{e-1}{2}.
$$
2 つの累次積分がともに三角形上の重積分に等しいことは、\ref{calc:normal-domain-integral} を $x$ 方向と $y$ 方向の両方の縦線集合として使うことによる。
:::

::: supplement
**一般化.** ルベーグ積分では、$f$ が $A\times B$ 上で可積分（または非負可測）なら、ほとんどすべての $x$ で $f(x,\cdot)$ が可積分で同じ等式が成り立つ（フビニ–トネリの定理。非負可測の場合は可積分性の仮定なしに、値 $+\infty$ も許して成り立つ。\see{meas:fubini-lebesgue}）。\ref{calc:fubini-counterexamples.2} の「1 点での不具合」は、ルベーグ積分では「測度 $0$ の集合での不具合」として自然に吸収される。

**前提を変えると.** 積分可能性を外すと、累次積分が等しくても重積分は存在しないことがあり（反例 1）、有界性を外すと、累次積分が順序によって異なることがある（反例 3）。

**高い視点.** フビニの定理は、積分が「\term[直積]{set:cartesian-product}の上では各成分の積分の合成」になることを言っている。体積の言葉では、立体を薄い板に切って、板の面積（断面積）を積分すれば体積になる（断面積による体積の公式。$f=\chi_{E}$ の場合）。この公式から、各高さでの断面積が等しい 2 つの立体は体積が等しいこと（カヴァリエリの原理）が従う。比喩で言えば、重積分は「升目に分けて数える」、累次積分は「まず各列を数え、次に列の合計を足す」数え方で、全体がきちんと数えられる（積分可能）なら、数え方の順序によらない。反例 1 は「各列は数えられるが、全体は数えられない」状況、反例 3 は「数える量が無限に大きく、足し方の順序で結果が変わる」状況（条件収束する級数の並べ替えと同じ現象）である。
:::

## 問題 {#calc:sec-fu-problems}

::: problem {#calc:prob-fu-tetrahedron}
$T\defeq\{(x,y,z):x,y,z\ge0,\ x+y+z\le1\}$ の体積が $\frac16$ であることを、縦線集合を 2 回使って示せ。
:::

::: solution
$D\defeq\{(x,y):0\le x\le1,\ 0\le y\le1-x\}$ とおくと、$T=\{(x,y,z):(x,y)\in D,\ 0\le z\le1-x-y\}$ である。$D$ は直方体でないので、$[0,1]^{2}$ 上の連続関数 $\varphi_{1}\defeq0$, $\varphi_{2}\defeq\max(0,1-x-y)$ に \ref{calc:normal-domain-integral} を使う（1 回目）。こうしてできる縦線集合 $E$ は、$T$ に平面 $z=0$ 上の集合 $Z\defeq\{(x,y,0):x,y\in[0,1],\ x+y>1\}$ を付け加えたものである。$Z$ の閉包は座標超平面と有界集合の共通部分なので測度 $0$ であり（\ref{calc:measure-zero-rn-properties.4}）、$Z$ はジョルダン可測で体積 $0$ である。ゆえに $T=E\setminus Z$ はジョルダン可測で（\ref{calc:jordan-measurable-criterion.2}）、\ref{calc:jordan-additivity} から $v(T)=v(E)$ である。よって
$$
v(T)=\int_{[0,1]^{2}}\max(0,1-x-y)=\int_{0}^{1}\int_{0}^{1-x}(1-x-y)\,dy\,dx=\int_{0}^{1}\frac{(1-x)^{2}}{2}dx=\frac16
$$
である。第 2 の等号は、被積分関数が $D$ の外で $0$ なので、$D$ を $[0,1]$ 上の縦線集合とみて \ref{calc:normal-domain-integral} を使ったもの（2 回目）である。
:::

::: problem {#calc:prob-fu-continuity-of-parameter}
$f$ が $[a,b]\times[c,d]$ 上で連続なら $F(x)\defeq\int_{c}^{d}f(x,y)\,dy$ は連続で、$\int_{a}^{b}F=\int_{c}^{d}\bigl(\int_{a}^{b}f(x,y)\,dx\bigr)dy$ であることを示せ。
:::

::: solution
連続性は、\ref{calc:fubini-continuous} の証明の $g$ と同じ議論（$f$ の一様連続性）で示せる。等式は、\ref{calc:fubini-continuous} を 2 通りの順序で使うと、両辺がともに $\int_{[a,b]\times[c,d]}f$ に等しくなることから従う。
:::
