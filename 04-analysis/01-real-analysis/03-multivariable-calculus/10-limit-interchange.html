# 極限操作の交換の一覧 {#calc:page-limit-interchange keywords="interchange of limits, limit and integral, limit and derivative, term-by-term integration and differentiation, rearrangement of series, double series, Fubini, Schwarz, differentiation under the integral sign, Moore-Osgood theorem, counterexamples"}

解析学の議論の多くは「二つの極限操作の順序を入れ替えてよいか」に帰着する。極限と極限、極限と積分、極限と微分、和の順序、積分の順序、偏微分の順序、積分と微分。このページでは、これまでのページで証明した交換定理を一つの表（\ref{calc:interchange-table}）にまとめ、各行に「交換できる十分条件」と「条件を外すと交換できない反例」を並べる。表にない短い主張は \ref{calc:sec-li-proofs} で証明する。

> ルベーグ積分による交換定理（単調収束定理・優収束定理）は測度論の系列で扱う予定で、ここではリーマン積分の範囲の定理だけを並べる。

## 記法と定義の確認 {#calc:sec-li-notation}

::: notation
- 各点収束と一様収束（\ref{calc:uniform-convergence}）。$\|f\|_{E}\defeq\sup_{x\in E}\lvert f(x)\rvert$。
- 積分はリーマン積分（\ref{calc:page-fundamental-theorem}、多変数は \ref{calc:page-multiple-integrals}）、$[c,\infty)$ 上の積分は広義積分（\ref{calc:improper-integral}）。
- 「交換できる」は、両方の順序で極限（積分・微分・和）が存在して値が一致すること。
:::

## 交換の一覧 {#calc:sec-li-table}

::: table 極限操作の交換 {#calc:interchange-table}
| 交換する操作 | 交換できる十分条件 | 条件を外した反例 |
|---|---|---|
| 二つの極限 $\lim_{m}\lim_{n}a_{mn}$ と $\lim_{n}\lim_{m}a_{mn}$ | 一方の極限が他方の添字について一様（ムーア–オズグッド、\ref{calc:li-double-limit}） | $a_{mn}=\frac{m}{m+n}$ で $1$ と $0$（\ref{calc:li-double-limit.2}） |
| 極限と連続性：$\lim_{x\to a}\lim_{n}f_{n}(x)$ と $\lim_{n}\lim_{x\to a}f_{n}(x)$ | 一様収束（\ref{calc:uniform-limit-theorems.2}） | $[0,1]$ 上の $x^{n}$ の極限は $x=1$ で不連続（\ref{calc:li-counterexamples.1}） |
| 極限と積分 $\lim\int_{a}^{b}f_{n}=\int_{a}^{b}\lim f_{n}$ | 有界閉区間上の一様収束（\ref{calc:uniform-limit-theorems.4}） | $f_{n}=n\chi_{(0,1/n]}$ は $0$ に各点収束するが積分は $1$（\ref{calc:li-counterexamples.2}） |
| 極限と広義積分 $\lim\int_{c}^{\infty}f_{n}=\int_{c}^{\infty}\lim f_{n}$ | 有界閉区間ごとの一様収束 ＋ 可積分な優関数（\ref{calc:li-improper-dominated}） | $f_{n}=\frac1n\chi_{[0,n]}$ は $[0,\infty)$ で一様に $0$ に収束するが積分は $1$（\ref{calc:li-counterexamples.3}） |
| 極限と微分 $(\lim f_{n})'=\lim f_{n}'$ | 導関数の一様収束 ＋ 一点での収束（\ref{calc:uniform-derivative}） | $f_{n}=\frac{\sin nx}{n}$ は一様に $0$ に収束するが $f_{n}'=\cos nx$ は収束しない（\ref{calc:li-counterexamples.4}） |
| 級数と積分（項別積分） | 部分和の一様収束（\ref{calc:uniform-limit-theorems.3}, \ref[4]{calc:uniform-limit-theorems.4}）、収束半径の内側の冪級数（\ref{calc:power-series-differentiation}） | 部分和を上の 2 の $f_{n}$ にとる |
| 級数と微分（項別微分） | 項別に微分した級数の一様収束（\ref{calc:uniform-derivative}）、収束半径の内側の冪級数 | $\sum\frac{\sin n^{2}x}{n^{2}}$ は一様収束するが、項別微分 $\sum\cos n^{2}x$ は $x=0$ で発散 |
| 冪級数の和と端点への極限 $\lim_{x\to1-}\sum c_{n}x^{n}=\sum c_{n}$ | $\sum c_{n}$ が収束（アーベル、\tref{calc:abel-theorem}） | 逆は偽：$c_{n}=(-1)^{n}$ では左辺 $\frac12$ だが右辺は発散（\ref{calc:li-counterexamples.5}） |
| 和の順序（再配列） | 絶対収束（\ref{calc:absolute-rearrangement.3}） | 条件収束なら任意の値に並べ替えられる（\ref{calc:riemann-rearrangement}） |
| 二重級数の和の順序 $\sum_{m}\sum_{n}=\sum_{n}\sum_{m}$ | 絶対収束（\ref{calc:double-series}） | $a_{mm}=1$, $a_{m,m+1}=-1$ で $0$ と $1$（\ref{calc:li-double-series}） |
| 級数の積（コーシー積） | 一方が絶対収束（メルテンス、\ref{calc:cauchy-product}） | $\sum\frac{(-1)^{n}}{\sqrt{n+1}}$ の自分自身とのコーシー積は発散（\ref{calc:cauchy-product} の証明の後の注意） |
| 積分の順序（累次積分） | 長方形上で積分可能で内側の積分が存在（フビニ、\tref{calc:fubini}）、とくに連続関数（\ref{calc:fubini-continuous}） | 有界でない $\frac{x^{2}-y^{2}}{(x^{2}+y^{2})^{2}}$ で $\frac{\pi}{4}$ と $-\frac{\pi}{4}$（\ref{calc:fubini-counterexamples.3}） |
| 広義重積分と近似列の選び方 | 絶対可積分 | 絶対可積分でないと近似列で値が変わる（\ref{calc:improper-exhaustion-dependence}） |
| 偏微分の順序 $\partial_{1}\partial_{2}f=\partial_{2}\partial_{1}f$ | $\partial_{2}\partial_{1}f$ が連続（シュワルツ、\tref{calc:schwarz-theorem}）、とくに $C^{2}$ 級 | $\frac{xy(x^{2}-y^{2})}{x^{2}+y^{2}}$ で原点で $1$ と $-1$（\ref{calc:schwarz-counterexample}） |
| 積分記号下の微分 $\frac{d}{dx}\int f\,dy=\int\partial_{x}f\,dy$ | $f$, $\partial_{x}f$ が連続でコンパクト集合上の積分（\ref{calc:differentiation-under-integral}）、広義積分なら優関数（\ref{calc:dominated-parameter-integral}） | $\frac{x^{3}}{y^{2}}e^{-x^{2}/y}$ で $x=0$ の微分が $1$ と $0$（\ref{calc:li-differentiation-counter}） |
| 積分範囲が動く積分の微分 | $f$, $\partial_{x}f$ が連続、端が微分可能（ライプニッツの公式、\ref{calc:leibniz-rule}） | 上と同じ例 |
| 微分と積分 $\frac{d}{dx}\int_{a}^{x}f=f(x)$ | $f$ が $x$ で連続（\ref{calc:fundamental-theorem.1}） | $f=\chi_{[1/2,1]}$ では $x=\frac12$ で微分不可能 |
| 積分と微分 $\int_{a}^{b}F'=F(b)-F(a)$ | $F'$ が積分可能（\ref{calc:fundamental-theorem.2}） | $F(x)=x^{2}\sin(1/x^{2})$ は至るところ微分可能だが $F'$ は $[0,1]$ で有界でなく、リーマン積分可能でない（\ref{calc:li-counterexamples.6}） |
| 各点収束から一様収束へ | 単調・連続・コンパクト（ディニ、\tref{calc:dini}） | $[0,1)$ 上の $x^{n}$（定義域がコンパクトでない） |
:::

::: intuition
どの反例も「無限が一か所に逃げる」形をしている。$n\chi_{(0,1/n]}$ では面積 $1$ の山が $0$ に押しつぶされ、$\frac1n\chi_{[0,n]}$ では面積 $1$ の山が無限遠に平たく逃げ、$\frac{\sin nx}{n}$ では高さは消えるが振動の速さ（傾き）が残る。一様収束は「縦方向の逃げ」を防ぎ、優関数は「横方向（無限遠）への逃げ」を防ぎ、導関数の一様収束は「振動の速さ」を抑える。交換定理の仮定は、どの方向の逃げを防ぐかを指定していると読める。
:::

## 短い主張の証明 {#calc:sec-li-proofs}

::: proposition 二重数列の極限（ムーア–オズグッド） {#calc:li-double-limit keywords="Moore-Osgood theorem: interchange of iterated limits under uniform convergence" index="ムーア–オズグッドの定理|むーあおずぐっどのていり, 累次極限|るいじきょくげん"}
1. 実数の二重数列 $(a_{mn})$ について、各 $m$ で $b_{m}\defeq\lim_{n}a_{mn}$ が存在し、各 $n$ で $c_{n}\defeq\lim_{m}a_{mn}$ が $n$ について一様に存在する（任意の $\varepsilon>0$ に $M$ があって、$m\ge M$ ならすべての $n$ で $\lvert a_{mn}-c_{n}\rvert<\varepsilon$）とする。このとき $\lim_{m}b_{m}$ と $\lim_{n}c_{n}$ はともに存在して等しい。
2. $a_{mn}\defeq\frac{m}{m+n}$（$m,n\ge1$）では $\lim_{m}\lim_{n}a_{mn}=0$, $\lim_{n}\lim_{m}a_{mn}=1$。
:::

::: proof
**Step 1（$(c_{n})$ はコーシー列）.** $\varepsilon>0$ について一様性の $M$ をとる。$m=M$ を固定すると $(a_{Mn})_{n}$ は $b_{M}$ に収束するのでコーシー列で、$N$ があって $n,n'\ge N$ なら $\lvert a_{Mn}-a_{Mn'}\rvert<\varepsilon$。よって
$$
\lvert c_{n}-c_{n'}\rvert\le\lvert c_{n}-a_{Mn}\rvert+\lvert a_{Mn}-a_{Mn'}\rvert+\lvert a_{Mn'}-c_{n'}\rvert<3\varepsilon.
$$
実数の完備性から $L\defeq\lim_{n}c_{n}$ が存在する。

**Step 2（$b_{m}\to L$）.** $m\ge M$ とすると、すべての $n$ で $\lvert a_{mn}-c_{n}\rvert<\varepsilon$。$n\to\infty$ として $\lvert b_{m}-L\rvert\le\varepsilon$。

**Step 3（2）.** 固定した $m$ で $n\to\infty$ とすると $a_{mn}\to0$。固定した $n$ で $m\to\infty$ とすると $a_{mn}=\frac{1}{1+n/m}\to1$。（$m$ を大きくする収束は $n$ について一様でない：$n=m$ では $a_{mm}=\frac12$。）

::: hypcheck
- **一様性**：Step 1 で $M$ を $n$ によらずとれることを使った。外すと 2 が反例。
- 関数列の言葉では、$a_{mn}=f_{m}(x_{n})$ として、極限関数の連続性（\ref{calc:uniform-limit-theorems.2}）と同じ構造である。
:::
:::

::: proposition 交換できない例 {#calc:li-counterexamples keywords="counterexamples to interchange of limit with continuity, integral, improper integral, derivative; Abel summation converse; fundamental theorem of calculus" index="極限の交換の反例|きょくげんのこうかんのはんれい"}
1. $f_{n}(x)\defeq x^{n}$ は $[0,1]$ で、$x<1$ では $0$、$x=1$ では $1$ に各点収束し、極限関数は連続でない。
2. $f_{n}\defeq n\chi_{(0,1/n]}$ は $[0,1]$ で積分可能、$0$ に各点収束し、$\int_{0}^{1}f_{n}=1$。
3. $f_{n}\defeq\frac{1}{n}\chi_{[0,n]}$ は $[0,\infty)$ で $0$ に一様収束し、$\int_{0}^{\infty}f_{n}=1$。
4. $f_{n}(x)\defeq\frac{\sin nx}{n}$ は $\R$ で $0$ に一様収束するが、$f_{n}'(0)=1$, $f_{n}'(\pi)=(-1)^{n}$ で $(f_{n}')$ は各点収束もしない。
5. $\sum(-1)^{n}x^{n}=\frac{1}{1+x}$（$\lvert x\rvert<1$）は $x\to1-$ で $\frac12$ に収束するが、$\sum(-1)^{n}$ は発散する。
6. $F(x)\defeq x^{2}\sin(1/x^{2})$（$x\neq0$）, $F(0)\defeq0$ は $\R$ で微分可能だが、$F'$ は $[0,1]$ で有界でない。
:::

::: proof
**Step 1（1）.** $0\le x<1$ では $x^{n}\to0$（\ref{calc:standard-limits}）、$x=1$ では $1$。

**Step 2（2）.** $x>0$ を固定すると $1/n<x$ となる $n$ から先は $f_{n}(x)=0$。$f_{n}(0)=0$。$f_{n}$ は不連続点が 2 点の階段関数なので積分可能で、積分は $n\cdot\frac1n=1$。

**Step 3（3）.** $\sup_{x}\lvert f_{n}(x)\rvert=\frac1n\to0$。$\int_{0}^{\infty}f_{n}=\frac1n\cdot n=1$。

**Step 4（4）.** $\lvert f_{n}(x)\rvert\le\frac1n$。$f_{n}'(x)=\cos nx$ で、$\cos(n\pi)=(-1)^{n}$ は収束しない。

**Step 5（5）.** 等比級数の和。$\sum(-1)^{n}$ の項は $0$ に収束しないので発散（\ref{calc:series-basic}）。

**Step 6（6）.** $x\neq0$ では $F'(x)=2x\sin(1/x^{2})-\frac{2}{x}\cos(1/x^{2})$。$x=0$ では $\lvert F(h)/h\rvert\le\lvert h\rvert\to0$ なので $F'(0)=0$。$x_{k}\defeq(2k\pi)^{-1/2}$ で $F'(x_{k})=-2\sqrt{2k\pi}\to-\infty$ なので有界でなく、リーマン積分可能でない（リーマン積分は有界な関数について定義される：\tref{calc:page-riemann-integral}）。
:::

::: proposition 広義積分と極限の交換 {#calc:li-improper-dominated keywords="interchange of limit and improper integral under local uniform convergence and an integrable dominating function" index="広義積分と極限の交換|こうぎせきぶんときょくげんのこうかん"}
$f_{n},f\colon[c,\infty)\to\R$ を連続関数とし、各 $R>c$ で $f_{n}\to f$ が $[c,R]$ 上一様、さらに連続な $g\ge0$ で $\int_{c}^{\infty}g<\infty$、$\lvert f_{n}\rvert\le g$（すべての $n$）となるものがあるとする。このとき $\int_{c}^{\infty}f_{n}$, $\int_{c}^{\infty}f$ は絶対収束し、$\int_{c}^{\infty}f_{n}\to\int_{c}^{\infty}f$。
:::

::: proof
**Step 1（絶対収束）.** $\lvert f\rvert\le g$（各点の極限）なので、比較判定（\ref{calc:improper-tests.2}）から $\int_{c}^{\infty}f_{n}$, $\int_{c}^{\infty}f$ は絶対収束する。

**Step 2（評価）.** $\varepsilon>0$ について $R$ を $\int_{R}^{\infty}g<\varepsilon$ となるようにとる。
$$
\Bigl\lvert\int_{c}^{\infty}f_{n}-\int_{c}^{\infty}f\Bigr\rvert\le\int_{c}^{R}\lvert f_{n}-f\rvert+\int_{R}^{\infty}\lvert f_{n}\rvert+\int_{R}^{\infty}\lvert f\rvert\le(R-c)\|f_{n}-f\|_{[c,R]}+2\varepsilon.
$$
$[c,R]$ 上の一様収束から、十分大きい $n$ で右辺は $3\varepsilon$ 以下。

::: hypcheck
- **優関数**：Step 2 で「無限遠の部分」$\int_{R}^{\infty}$ を $n$ によらず小さくするのに使った。外すと \ref{calc:li-counterexamples.3} が反例（一様収束しているが優関数がない：$\sup_{n}f_{n}(x)$ は $x\in[n-1,n]$ で $\frac1n$ 程度で、$\int\frac{dx}{x}$ のように発散する）。
- **有界閉区間ごとの一様収束**：ルベーグ積分の優収束定理では各点収束でよい。リーマン積分の範囲では、極限関数の積分可能性を保証するためにこの形にした。
:::
:::

::: proposition 和の順序が交換できない二重級数 {#calc:li-double-series keywords="double series whose iterated sums differ" index="二重級数の反例|にじゅうきゅうすうのはんれい"}
$a_{mm}\defeq1$, $a_{m,m+1}\defeq-1$（$m\ge0$）、それ以外の $a_{mn}\defeq0$ とすると、$\sum_{m}\sum_{n}a_{mn}=0$, $\sum_{n}\sum_{m}a_{mn}=1$。
:::

::: proof
第 $m$ 行の和は $a_{mm}+a_{m,m+1}=1-1=0$ なので、行ごとの和の和は $0$。第 $0$ 列の和は $a_{00}=1$、第 $n\ge1$ 列の和は $a_{nn}+a_{n-1,n}=1-1=0$ なので、列ごとの和の和は $1$。（$\sum\lvert a_{mn}\rvert=\infty$ で、\ref{calc:double-series} の仮定をみたさない。）
:::

::: proposition 積分記号下で微分できない例 {#calc:li-differentiation-counter keywords="counterexample to differentiation under the integral sign" index="積分記号下の微分の反例|せきぶんきごうかのびぶんのはんれい"}
$f(x,y)\defeq\frac{x^{3}}{y^{2}}e^{-x^{2}/y}$（$y>0$）, $f(x,0)\defeq0$ とし、$F(x)\defeq\int_{0}^{1}f(x,y)\,dy$ とおく。このとき $F(x)=xe^{-x^{2}}$ で $F'(0)=1$ だが、$\partial_{x}f(0,y)=0$（すべての $y$）なので $\int_{0}^{1}\partial_{x}f(0,y)\,dy=0$。
:::

::: proof
**Step 1（$F$ の計算）.** $x=0$ では $f(0,y)=0$ で $F(0)=0$。$x\neq0$ のとき、$t=x^{2}/y$（$y=x^{2}/t$, $dy=-\frac{x^{2}}{t^{2}}dt$）と置換すると、$\frac{x^{3}}{y^{2}}=\frac{t^{2}}{x}$ なので（置換積分、\ref{calc:substitution-parts}、広義積分として）
$$
F(x)=\int_{x^{2}}^{\infty}\frac{t^{2}}{x}e^{-t}\frac{x^{2}}{t^{2}}\,dt=x\int_{x^{2}}^{\infty}e^{-t}\,dt=xe^{-x^{2}}.
$$
（$y\to0+$ で $t\to\infty$ となり、$f(x,\cdot)$ は $(0,1]$ で連続で $y\to0+$ で $0$ に収束するので、$[0,1]$ 上の積分は置換後の広義積分に等しい。）よって $F'(0)=1$。

**Step 2（$\partial_{x}f(0,y)$）.** $y>0$ では $\frac{f(h,y)-f(0,y)}{h}=\frac{h^{2}}{y^{2}}e^{-h^{2}/y}\to0$（$h\to0$）。$y=0$ では $f(h,0)=0$。

::: hypcheck
- **\ref{calc:differentiation-under-integral} の仮定のうち外れているもの**：$\partial_{x}f$ が原点の近くで連続でない（有界でもない）。$y>0$ では $\partial_{x}f(x,y)=\bigl(\frac{3x^{2}}{y^{2}}-\frac{2x^{4}}{y^{3}}\bigr)e^{-x^{2}/y}$ で、曲線 $y=x^{2}$ に沿うと $\partial_{x}f(x,x^{2})=\frac{e^{-1}}{x^{2}}\to\infty$（$x\to0$）。
:::
:::

::: supplement
**ルベーグ積分では.** 測度論の系列で扱う予定の単調収束定理・優収束定理を使うと、「極限と積分」「級数と積分」「積分記号下の微分」「積分の順序（フビニ–トネリ）」の十分条件が、それぞれ「単調性」「可積分な優関数」「可積分性（または非負性）」という一つの形にまとまる。この表のリーマン積分版の条件（一様収束・連続性）は、その特別な場合である。

**高い視点.** 二つの極限の交換は、二変数の関数 $(m,n)\mapsto a_{mn}$ を $(\N\cup\{\infty\})^{2}$ の角 $(\infty,\infty)$ まで連続に延長できるかという問題である。一様収束はその延長が存在するための条件で、一様構造（\ref{top:page-uniform-spaces}）の言葉では「一様連続な写像は完備化に延長できる」（\ref{top:uniform-extension}）の一例と見なせる。
:::

## 問題 {#calc:sec-li-problems}

::: problem {#calc:prob-li-tannery}
**タナリーの定理.** $a_{n}(k)\to a(k)$（$n\to\infty$）がすべての $k$ で成り立ち、$\lvert a_{n}(k)\rvert\le M_{k}$, $\sum_{k}M_{k}<\infty$ とする。$\sum_{k}a_{n}(k)\to\sum_{k}a(k)$ を示し、これを使って $\lim_{n}\bigl(1+\frac{x}{n}\bigr)^{n}=\sum_{k}\frac{x^{k}}{k!}$ を示せ。
:::

::: solution
$\varepsilon>0$ について $\sum_{k>K}M_{k}<\varepsilon$ となる $K$ をとる。$\lvert a(k)\rvert\le M_{k}$ なので
$$
\Bigl\lvert\sum_{k}a_{n}(k)-\sum_{k}a(k)\Bigr\rvert\le\sum_{k\le K}\lvert a_{n}(k)-a(k)\rvert+2\varepsilon,
$$
有限和は $n\to\infty$ で $0$ に収束する。（\ref{calc:li-improper-dominated} の級数版で、$M_{k}$ が優関数。）応用：二項定理で $\bigl(1+\frac{x}{n}\bigr)^{n}=\sum_{k=0}^{n}\binom{n}{k}\frac{x^{k}}{n^{k}}$。$a_{n}(k)\defeq\binom{n}{k}\frac{x^{k}}{n^{k}}=\frac{x^{k}}{k!}\prod_{j<k}\bigl(1-\frac{j}{n}\bigr)$（$k\le n$）、$k>n$ では $0$ とすると、$a_{n}(k)\to\frac{x^{k}}{k!}$ で、$\lvert a_{n}(k)\rvert\le\frac{\lvert x\rvert^{k}}{k!}=M_{k}$、$\sum M_{k}=e^{\lvert x\rvert}<\infty$。
:::

::: problem {#calc:prob-li-integral-sum}
$\int_{0}^{1}\frac{\log(1/x)}{1-x}\,dx=\sum_{n\ge1}\frac{1}{n^{2}}$ を、項別積分の正当化を含めて示せ。
:::

::: solution
$0<x<1$ で $\frac{\log(1/x)}{1-x}=\sum_{k\ge0}x^{k}\log(1/x)$ で、項はすべて非負。$\int_{0}^{1}x^{k}\log(1/x)\,dx=\frac{1}{(k+1)^{2}}$（部分積分）。部分和 $S_{N}(x)\defeq\sum_{k<N}x^{k}\log(1/x)=\frac{1-x^{N}}{1-x}\log(1/x)$ は $0\le S_{N}\le g(x)\defeq\frac{\log(1/x)}{1-x}$ で、$g$ は $(0,1)$ 上の広義積分が収束する（$x\to1$ で $1$ に、$x\to0$ で $\log(1/x)$ のように振る舞う）。$\int_{0}^{1}(g-S_{N})=\int_{0}^{1}x^{N}g$ は $0$ に収束する：$\varepsilon>0$ について $\int_{0}^{\delta}g<\varepsilon$ となる $\delta$ をとると、$g$ は $[\delta,1)$ で連続で $x\to1$ で $1$ に収束するので有界（$\le C$）で、$\int_{0}^{1}x^{N}g\le\varepsilon+C\int_{0}^{1}x^{N}dx=\varepsilon+\frac{C}{N+1}$。したがって $\int_{0}^{1}g=\lim_{N}\sum_{k<N}\frac{1}{(k+1)^{2}}=\sum_{n\ge1}\frac{1}{n^{2}}$。
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{calc:sec-li-exercises} にまとめた。
