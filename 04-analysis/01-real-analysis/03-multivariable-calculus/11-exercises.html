# 演習：多変数解析 {#calc:page-exercises-multivariable keywords="exercises, Multivariable Calculus"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#calc:sec-exmultivariable-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## ユークリッド空間 {#calc:sec-eu-exercises}

対応するページ：\ref{calc:page-euclidean-space}

::: problem ★ 基本：ノルムの比較 {#calc:ex-eu-1}
$\R^{n}$ で $\lVert x\rVert_{\infty}\le\lVert x\rVert_{2}\le\lVert x\rVert_{1}\le n\lVert x\rVert_{\infty}$ を示せ。
:::

::: solution
最大値は和の一項なので $\max\lvert x_{i}\rvert^{2}\le\sum x_{i}^{2}$ である。$(\sum\lvert x_{i}\rvert)^{2}$ を展開すると交差項 $2\lvert x_{i}\rvert\lvert x_{j}\rvert$ が非負なので $\sum x_{i}^{2}\le(\sum\lvert x_{i}\rvert)^{2}$ である。各項を最大値で抑えると $\sum\lvert x_{i}\rvert\le n\max\lvert x_{i}\rvert$ である。前の 2 つは平方根をとれば主張の不等式になる。
:::

::: problem ★ 基本：開集合と閉集合 {#calc:ex-eu-2}
$\R^{2}$ の部分集合 $A=\{(x,y):0<x\le1\}$ の内部・閉包・境界を求めよ。
:::

::: solution
内部は $\{0<x<1\}$、閉包は $\{0\le x\le1\}$、境界は $\{x=0\}\cup\{x=1\}$ である。$A$ は開でも閉でもない。
:::

::: problem ★★ 標準：コンパクト性の判定 {#calc:ex-eu-3}
$\{(x,y):x^{4}+y^{4}\le1\}$ はコンパクトか。$\{(x,y):xy=1\}$ はどうか。
:::

::: solution
前者は有界（$\lvert x\rvert,\lvert y\rvert\le1$）で閉（連続関数の逆像）なのでコンパクト（ハイネ–ボレル）。後者は閉だが有界でない（$(n,1/n)$）のでコンパクトでない。
:::

::: problem ★★★ 発展：有限次元のノルムの同値性 {#calc:ex-eu-4}
$\R^{n}$ 上の任意のノルム $N$ について $c\lVert x\rVert_{2}\le N(x)\le C\lVert x\rVert_{2}$ となる $c,C>0$ があることを示せ。
:::

::: solution
$N(x)\le\sum\lvert x_{i}\rvert N(e_{i})\le C\lVert x\rVert_{2}$（$C=\sqrt{\sum N(e_{i})^{2}}$、コーシー–シュワルツ）なので $N$ はユークリッドノルムについて連続。単位球面はコンパクトなので $N$ はそこで正の最小値 $c$ をとり、斉次性から $N(x)\ge c\lVert x\rVert_{2}$。
:::

## 全微分と連鎖律 {#calc:sec-di-exercises}

対応するページ：\ref{calc:page-differentiability}

::: problem ★ 基本：ヤコビ行列 {#calc:ex-di-1}
$F(x,y)=(x^{2}y,\ e^{xy},\ x+\sin y)$ のヤコビ行列を求め、$(1,0)$ での値を計算せよ。
:::

::: solution
成分ごとに偏微分すると $DF=\begin{pmatrix}2xy&x^{2}\\ye^{xy}&xe^{xy}\\1&\cos y\end{pmatrix}$ であり、$(1,0)$ を代入すると $\begin{pmatrix}0&1\\0&1\\1&1\end{pmatrix}$ となる。
:::

::: problem ★ 基本：方向微分と勾配 {#calc:ex-di-2}
$f(x,y)=x^{2}+3xy$ の点 $(1,2)$ での勾配と、方向 $u=\frac15(3,4)$ の方向微分を求めよ。$f$ が最も速く増える方向はどれか。
:::

::: solution
$\nabla f=(2x+3y,3x)$ なので、点 $(1,2)$ では $\nabla f=(8,3)$ である。$u$ は単位ベクトルなので $D_{u}f=\nabla f\cdot u=\frac{24+12}{5}=\frac{36}{5}$ となる。最も速く増えるのは $\nabla f$ の方向 $\frac{1}{\sqrt{73}}(8,3)$。
:::

::: problem ★★ 標準：偏微分可能だが連続でない {#calc:ex-di-3}
$f(x,y)=\frac{xy}{x^{2}+y^{2}}$（$(x,y)\neq0$）, $f(0,0)=0$ は原点で偏微分可能だが連続でないことを示せ。
:::

::: solution
$f(x,0)=f(0,y)=0$ なので偏微分係数はどちらも $0$。直線 $y=x$ 上で $f=\frac12$ なので原点で連続でない（したがって全微分可能でもない）。
:::

::: problem ★★★ 発展：連鎖律の応用 {#calc:ex-di-4}
$f$ を $\R^{2}$ の $C^{1}$ 関数とし、$g(r,\theta)=f(r\cos\theta,r\sin\theta)$ とする。$r\neq0$ のとき $f_{x}^{2}+f_{y}^{2}=g_{r}^{2}+\frac{1}{r^{2}}g_{\theta}^{2}$ を示せ（左辺は点 $(r\cos\theta,r\sin\theta)$ での値）。
:::

::: solution
連鎖律から $g_{r}=f_{x}\cos\theta+f_{y}\sin\theta$、$g_{\theta}=-f_{x}r\sin\theta+f_{y}r\cos\theta$ である。$r\neq0$ のとき $g_{r}^{2}+\frac{1}{r^{2}}g_{\theta}^{2}$ を展開すると、交差項 $\pm2f_{x}f_{y}\cos\theta\sin\theta$ が打ち消し合い、$f_{x}^{2}(\cos^{2}\theta+\sin^{2}\theta)+f_{y}^{2}(\sin^{2}\theta+\cos^{2}\theta)=f_{x}^{2}+f_{y}^{2}$ となる。
:::

## 高階微分とテイラーの定理 {#calc:sec-hd-exercises}

対応するページ：\ref{calc:page-higher-derivatives}

::: problem ★ 基本：極値の判定 {#calc:ex-hd-1}
$f(x,y)=x^{3}-3xy+y^{3}$ の臨界点を求め、ヘッセ行列で極値を判定せよ。
:::

::: solution
$f_{x}=3x^{2}-3y=0$, $f_{y}=-3x+3y^{2}=0$ から $y=x^{2}$ かつ $x=y^{2}$ であり、$x=x^{4}$ の実数解は $x=0,1$ なので、臨界点は $(0,0),(1,1)$ である。ヘッセ行列 $\begin{pmatrix}6x&-3\\-3&6y\end{pmatrix}$ の行列式は $(0,0)$ で $-9<0$（鞍点）、$(1,1)$ で $27>0$ かつ $f_{xx}=6>0$（極小、値 $-1$）。
:::

::: problem ★ 基本：2 次のテイラー展開 {#calc:ex-hd-2}
$f(x,y)=e^{x}\cos y$ の原点での 2 次のテイラー多項式を求めよ。
:::

::: solution
$f=1$, $f_{x}=1$, $f_{y}=0$, $f_{xx}=1$, $f_{xy}=0$, $f_{yy}=-1$ なので、2 次のテイラー多項式は $1+x+\frac12(x^{2}-y^{2})$ である。
:::

::: problem ★★ 標準：ラプラス方程式 {#calc:ex-hd-3}
$u(x,y)=\log(x^{2}+y^{2})$ が $\R^{2}\setminus\{0\}$ で $u_{xx}+u_{yy}=0$ をみたすことを示せ。
:::

::: solution
$u_{x}=\frac{2x}{x^{2}+y^{2}}$ なので $u_{xx}=\frac{2(y^{2}-x^{2})}{(x^{2}+y^{2})^{2}}$ であり、$x$ と $y$ を入れ替える対称性から $u_{yy}=\frac{2(x^{2}-y^{2})}{(x^{2}+y^{2})^{2}}$ である。ゆえに和は $0$ である。
:::

::: problem ★★★ 発展：鞍点の判定の限界 {#calc:ex-hd-4}
$f(x,y)=x^{2}-3xy^{2}+2y^{4}$ は原点を通るどの直線に制限しても原点で極小だが、原点で極小でないことを示せ。
:::

::: solution
展開して確かめると $f=(x-y^{2})(x-2y^{2})$ である。直線 $y=mx$ 上では $f=x^{2}(1-3m^{2}x+2m^{4}x^{2})$ であり、$x\to0$ で括弧の中は $1$ に近づくので、$0$ に近い $x\neq0$ で $f>0$ である。直線 $x=0$ 上では $y\neq0$ で $f=2y^{4}>0$ である。一方、放物線 $x=\frac32y^{2}$ 上では $f=\frac12y^{2}\cdot(-\frac12y^{2})=-\frac14y^{4}<0$ なので、原点のどの近傍にも $f<0$ の点がある。ヘッセ行列は原点で $\mathrm{diag}(2,0)$ で退化しているので、2 次の判定法は使えない。
:::

## 逆関数定理と陰関数定理 {#calc:sec-ii-exercises}

対応するページ：\ref{calc:page-inverse-implicit}

::: problem ★ 基本：陰関数の微分 {#calc:ex-ii-1}
$x^{3}+y^{3}-3xy=0$ の点 $(\frac32,\frac32)$ の近くで $y=y(x)$ と解けることを示し、$y'(\frac32)$ を求めよ。
:::

::: solution
$F(x,y)\defeq x^{3}+y^{3}-3xy$ とおくと、$F(\frac32,\frac32)=\frac{27}{8}+\frac{27}{8}-\frac{27}{4}=0$ で点は曲線上にある。$F_{y}=3y^{2}-3x=\frac{27}{4}-\frac92=\frac94\neq0$ なので陰関数定理が使える。陰関数の微分の公式から $y'=-\frac{F_{x}}{F_{y}}=-\frac{3x^{2}-3y}{3y^{2}-3x}$ であり、$(\frac32,\frac32)$ では分子と分母がともに $\frac94$ なので $y'(\frac32)=-1$ である。
:::

::: problem ★ 基本：局所的な逆写像 {#calc:ex-ii-2}
$F(x,y)=(e^{x}\cos y,\ e^{x}\sin y)$ のヤコビ行列式を計算し、$F$ が各点の近くで逆写像をもつが、全体では単射でないことを示せ。
:::

::: solution
$\det DF=e^{2x}\neq0$ なので逆関数定理から局所的に可逆。$F(x,y)=F(x,y+2\pi)$ なので単射でない（複素指数関数 $e^{z}$ に対応する）。
:::

::: problem ★★ 標準：ラグランジュの未定乗数法 {#calc:ex-ii-3}
$x^{2}+y^{2}=1$ の上で $f=xy$ の最大値・最小値を求めよ。
:::

::: solution
$g\defeq x^{2}+y^{2}$ とおくと、円周上で $\nabla g\neq0$ なので、極値点では $\nabla f=\lambda\nabla g$、すなわち $y=2\lambda x$, $x=2\lambda y$ が成り立つ。$y=0$ なら $x=0$ となり円周上にないので $y\neq0$ で、$y=4\lambda^{2}y$ から $4\lambda^{2}=1$、$x=\pm y$ となり、$x^{2}=y^{2}=\frac12$ である。このとき $xy=\pm\frac12$ であり、最大 $\frac12$（$x=y=\pm\frac1{\sqrt2}$）、最小 $-\frac12$。円周はコンパクトなので最大・最小は存在し、臨界点の中にある。
:::

::: problem ★★★ 発展：陰関数定理の幾何 {#calc:ex-ii-4}
$\R^{3}$ で $x^{2}+y^{2}-z^{2}=c$ が滑らかな曲面（各点の近くで二変数のグラフ）になる $c$ を求めよ。
:::

::: solution
$\nabla F=2(x,y,-z)$ は原点以外で $0$ でない。原点を含むのは $c=0$ のときだけなので、$c\neq0$ なら陰関数定理から各点の近くで、$0$ でない成分の変数について解ける。$c=0$ では原点が錐の頂点となり、原点の近くでどの座標についてのグラフにもならない：曲面は各座標の符号の反転で不変なので、小さい $t\neq0$ について $(\pm\lvert t\rvert,0,t)$、$(0,\pm\lvert t\rvert,t)$、$(t,0,\pm\lvert t\rvert)$ がそれぞれ曲面上にあり、$(y,z)$・$(x,z)$・$(x,y)$ のどれを決めても点が 2 つあるからである。
:::

## 重積分 {#calc:sec-mi-exercises}

対応するページ：\ref{calc:page-multiple-integrals}

::: problem ★ 基本：長方形上の積分 {#calc:ex-mi-1}
$\int_{[0,1]^{2}}(x+y)^{2}\,dx\,dy$ を求めよ。
:::

::: solution
展開して項ごとに累次積分すると $\int\int(x^{2}+2xy+y^{2})=\frac13+\frac12+\frac13=\frac76$ となる。
:::

::: problem ★ 基本：三角形上の積分 {#calc:ex-mi-2}
$D=\{0\le y\le x\le1\}$ で $\int_{D}xy$ を求めよ。
:::

::: solution
$D$ は $0\le x\le1$ の上で $0\le y\le x$ の縦線集合なので、累次積分で $\int_{0}^{1}\int_{0}^{x}xy\,dy\,dx=\int_{0}^{1}\frac{x^{3}}{2}dx=\frac18$ となる。
:::

::: problem ★★ 標準：体積 {#calc:ex-mi-3}
$x,y,z\ge0$, $x+y+z\le1$ の四面体の体積を重積分で求めよ。
:::

::: solution
四面体は三角形 $\{x,y\ge0,\ x+y\le1\}$ の上で高さ $1-x-y$ のグラフの下の部分なので、体積は $\int_{0}^{1}\int_{0}^{1-x}(1-x-y)\,dy\,dx=\int_{0}^{1}\frac{(1-x)^{2}}{2}dx=\frac16$ である。
:::

::: problem ★★★ 発展：ジョルダン可測でない集合 {#calc:ex-mi-4}
$[0,1]^{2}$ の有理点全体 $\mathbb{Q}^{2}\cap[0,1]^{2}$ はジョルダン可測でないことを示せ。可算個のジョルダン可測集合の和が可測とは限らないことを結論せよ。
:::

::: solution
内部は空なので内測度 $0$、閉包は $[0,1]^{2}$ なので外測度 $1$。一点はジョルダン可測（測度 $0$）なので、可算個の可測集合の和でも可測でない。（ルベーグ測度では測度 $0$。）
:::

## フビニの定理 {#calc:sec-fu-exercises}

対応するページ：\ref{calc:page-fubini}

::: problem ★ 基本：積分順序の交換 {#calc:ex-fu-1}
$\int_{0}^{1}\int_{x}^{1}e^{y^{2}}\,dy\,dx$ を求めよ。
:::

::: solution
$e^{y^{2}}$ の原始関数は初等関数で書けないので順序を交換する。積分の領域は $\{0\le x\le y\le1\}$ なので、$y$ を外側にすると $\int_{0}^{1}\int_{0}^{y}e^{y^{2}}\,dx\,dy=\int_{0}^{1}ye^{y^{2}}dy=\frac{e-1}{2}$ となる。
:::

::: problem ★ 基本：累次積分の計算 {#calc:ex-fu-2}
$\int_{0}^{1}\int_{0}^{2}(x^{2}+xy)\,dy\,dx$ を両方の順序で計算し、一致を確かめよ。
:::

::: solution
内側を $y$ にすると $\int_{0}^{2}(x^{2}+xy)dy=2x^{2}+2x$ であり、外側の積分は $\frac23+1=\frac53$ となる。内側を $x$ にすると $\int_{0}^{1}(x^{2}+xy)dx=\frac13+\frac y2$ であり、外側の積分は $\frac23+1=\frac53$ となる。ゆえに両者は一致する。
:::

::: problem ★★ 標準：フビニが使えない例の確認 {#calc:ex-fu-3}
$f(x,y)=\frac{x^{2}-y^{2}}{(x^{2}+y^{2})^{2}}$ について $\int_{0}^{1}f(x,y)\,dy=\frac{1}{1+x^{2}}$ を確かめ、二つの累次積分が $\pm\frac\pi4$ になることを示せ。
:::

::: solution
$\frac{\partial}{\partial y}\frac{y}{x^{2}+y^{2}}=f(x,y)$ なので $x>0$ では $\int_{0}^{1}f\,dy=\bigl[\frac{y}{x^{2}+y^{2}}\bigr]_{0}^{1}=\frac{1}{x^{2}+1}$ であり、外側の積分は $\int_{0}^{1}\frac{dx}{1+x^{2}}=\frac\pi4$ となる。$f(y,x)=-f(x,y)$ なので、逆の順序の累次積分は $-\frac\pi4$ である（\ref{calc:fubini-counterexamples.3}）。
:::

::: problem ★★★ 発展：確率への応用 {#calc:ex-fu-4}
$X,Y$ が $[0,1]$ 上の一様分布で独立なとき、$P(X+Y\le t)$（$0\le t\le2$）を求めよ。
:::

::: solution
独立性から $(X,Y)$ は $[0,1]^{2}$ 上の一様分布なので、求める確率は $\{x+y\le t\}\cap[0,1]^{2}$ の面積である。$0\le t\le1$ の場合は直角三角形なので $\frac{t^{2}}{2}$、$1\le t\le2$ の場合は正方形から直角三角形 $\{x+y>t\}$ を除いたものなので $1-\frac{(2-t)^{2}}{2}$ である。
:::

## 変数変換公式 {#calc:sec-cv-exercises}

対応するページ：\ref{calc:page-change-of-variables}

::: problem ★ 基本：極座標 {#calc:ex-cv-1}
$\int_{x^{2}+y^{2}\le1}e^{-(x^{2}+y^{2})}\,dx\,dy$ を求めよ。
:::

::: solution
極座標（ヤコビアン $r$）に変換すると $\int_{0}^{2\pi}\int_{0}^{1}e^{-r^{2}}r\,dr\,d\theta=2\pi\cdot\frac{1-e^{-1}}{2}=\pi(1-e^{-1})$ となる。
:::

::: problem ★ 基本：球の体積 {#calc:ex-cv-2}
半径 $a$ の球の体積を球座標で計算せよ。
:::

::: solution
球座標 $x=r\sin\varphi\cos\theta$, $y=r\sin\varphi\sin\theta$, $z=r\cos\varphi$ のヤコビアンは $r^{2}\sin\varphi$ なので、体積は $\int_{0}^{2\pi}\int_{0}^{\pi}\int_{0}^{a}r^{2}\sin\varphi\,dr\,d\varphi\,d\theta=2\pi\cdot2\cdot\frac{a^{3}}{3}=\frac43\pi a^{3}$ である。
:::

::: problem ★★ 標準：一次変換 {#calc:ex-cv-3}
$D$ を $0\le x+y\le1$, $0\le x-y\le1$ の正方形として、$\int_{D}(x+y)^{2}\,dx\,dy$ を求めよ。
:::

::: solution
$u=x+y$, $v=x-y$ とすると $\lvert\det\frac{\partial(u,v)}{\partial(x,y)}\rvert=2$ なので $dx\,dy=\frac12du\,dv$。$D$ は $(u,v)\in[0,1]^{2}$ に対応するので、積分は $\frac12\int_{0}^{1}\int_{0}^{1}u^{2}\,du\,dv=\frac16$ となる。
:::

::: problem ★★★ 発展：n 次元球の体積 {#calc:ex-cv-4}
$n$ 次元単位球の体積 $V_{n}$ について $V_{n}=\frac{2\pi}{n}V_{n-2}$ を示し、$V_{4}=\frac{\pi^{2}}{2}$ を求めよ。
:::

::: solution
$n\ge3$ とする。最後の 2 座標を極座標 $(\rho,\theta)$ にとると、残りの $n-2$ 座標は半径 $\sqrt{1-\rho^{2}}$ の球を動く。半径 $s$ の $(n-2)$ 次元球の体積は、拡大 $x\mapsto sx$ の変数変換（ヤコビアン $s^{n-2}$）から $s^{n-2}V_{n-2}$ なので、フビニの定理と極座標から $V_{n}=\int_{0}^{2\pi}\int_{0}^{1}V_{n-2}(1-\rho^{2})^{(n-2)/2}\rho\,d\rho\,d\theta=2\pi V_{n-2}\cdot\frac{1}{n}$ である（$\int_{0}^{1}(1-\rho^{2})^{(n-2)/2}\rho\,d\rho=\bigl[-\frac1n(1-\rho^{2})^{n/2}\bigr]_{0}^{1}=\frac1n$）。$V_{2}=\pi$ から $V_{4}=\frac{2\pi}{4}\pi=\frac{\pi^{2}}{2}$ となる。
:::

## 広義重積分とパラメータを含む積分 {#calc:sec-pi-exercises}

対応するページ：\ref{calc:page-parameter-integrals}

::: problem ★ 基本：パラメータについての微分 {#calc:ex-pi-1}
$\int_{0}^{1}x^{a}\,dx=\frac{1}{a+1}$（$a>-1$）を $a$ で微分して、$\int_{0}^{1}x^{a}\log x\,dx$ を求めよ。微分の正当化も述べよ。
:::

::: solution
答えは $\int_{0}^{1}x^{a}\log x\,dx=-\frac{1}{(a+1)^{2}}$ である。正当化：$x=e^{-y}$ と置換すると $\int_{0}^{1}x^{a}\,dx=\int_{0}^{\infty}e^{-(a+1)y}\,dy$ となる。$-1<a_{0}$ を固定し、$a>a_{0}$ の範囲（開区間）で $f(a,y)\defeq e^{-(a+1)y}$ を考えると、$\lvert f\rvert\le e^{-(a_{0}+1)y}$、$\lvert\partial_{a}f\rvert=ye^{-(a+1)y}\le ye^{-(a_{0}+1)y}$ で、右辺はどちらも $[0,\infty)$ で可積分である。ゆえに \ref{calc:dominated-parameter-integral.2} から $\frac{d}{da}\int_{0}^{\infty}e^{-(a+1)y}dy=-\int_{0}^{\infty}ye^{-(a+1)y}dy$ であり、置換を戻すと右辺は $\int_{0}^{1}x^{a}\log x\,dx$ である。左辺は $\frac{d}{da}\frac{1}{a+1}=-\frac{1}{(a+1)^{2}}$ である。例：$a=2$ では $-\frac19$。
:::

::: problem ★ 基本：繰り返し微分 {#calc:ex-pi-2}
$\int_{0}^{\infty}e^{-ax}dx=\frac1a$（$a>0$）を $n$ 回微分して $\int_{0}^{\infty}x^{n}e^{-ax}dx=\frac{n!}{a^{n+1}}$ を導け。
:::

::: solution
$a>a_{0}>0$ の範囲では、$k\le n$ について $x^{k}e^{-ax}\le x^{k}e^{-a_{0}x}$ が $[0,\infty)$ で可積分なので、\ref{calc:dominated-parameter-integral.2} を $k=0,1,\dots,n-1$ の順に使って、積分記号下で $n$ 回微分できる。$\frac{d^{n}}{da^{n}}\frac1a=\frac{(-1)^{n}n!}{a^{n+1}}$ と被積分関数の微分 $(-x)^{n}e^{-ax}$ を比べる。
:::

::: problem ★★ 標準：フルラーニ型の積分 {#calc:ex-pi-3}
$\int_{0}^{1}\frac{x^{b}-x^{a}}{\log x}\,dx=\log\frac{b+1}{a+1}$（$a,b>-1$）を示せ。
:::

::: solution
$a<b$ としてよい（$a=b$ なら両辺 $0$、$a>b$ なら両辺の符号が変わる）。$0<x<1$ では $\frac{x^{b}-x^{a}}{\log x}=\int_{a}^{b}x^{s}\,ds$ である。$0<\delta<1$ をとると、$(x,s)\mapsto x^{s}$ は $[\delta,1]\times[a,b]$ で連続なので、\ref{calc:fubini-continuous} から
$$
\int_{\delta}^{1}\frac{x^{b}-x^{a}}{\log x}\,dx=\int_{a}^{b}\int_{\delta}^{1}x^{s}\,dx\,ds=\int_{a}^{b}\frac{1-\delta^{s+1}}{s+1}\,ds
$$
である（$x=1$ では被積分関数を極限値 $b-a$ で補う）。$s\in[a,b]$ で $0<\delta^{s+1}\le\delta^{a+1}\to0$（$\delta\to0+$）なので、右辺は $\int_{a}^{b}\frac{ds}{s+1}=\log\frac{b+1}{a+1}$ に収束する。ゆえに左辺の広義積分は収束し、値は $\log\frac{b+1}{a+1}$ である。
:::

::: problem ★★★ 発展：ディリクレ積分 {#calc:ex-pi-4}
$I(a)=\int_{0}^{\infty}e^{-ax}\frac{\sin x}{x}dx$（$a>0$）について $I'(a)=-\frac{1}{1+a^{2}}$ を示し、$\int_{0}^{\infty}\frac{\sin x}{x}dx=\frac\pi2$ を導け（$a\to0+$ の極限は認めてよい）。
:::

::: solution
被積分関数は $x=0$ で値 $1$ を補えば連続で、$\lvert e^{-ax}\frac{\sin x}{x}\rvert\le e^{-a_{0}x}$、$a$ についての偏導関数は $-e^{-ax}\sin x$ で $\lvert e^{-ax}\sin x\rvert\le e^{-a_{0}x}$（$a>a_{0}>0$）なので、\ref{calc:dominated-parameter-integral.2} から微分でき、$I'(a)=-\int_{0}^{\infty}e^{-ax}\sin x\,dx=-\frac{1}{1+a^{2}}$。ゆえに $I(a)=C-\arctan a$（$C$ は定数）である。$\lvert\frac{\sin x}{x}\rvert\le1$ から $\lvert I(a)\rvert\le\int_{0}^{\infty}e^{-ax}dx=\frac1a\to0$（$a\to\infty$）なので $C=\frac\pi2$ であり、$I(a)=\frac\pi2-\arctan a$ となる。認めた極限 $I(a)\to\int_{0}^{\infty}\frac{\sin x}{x}dx$（$a\to0+$）から、値は $\frac\pi2$ である。
:::

## ℝⁿ 上の微分形式と鎖の上のストークスの定理 {#calc:sec-df-exercises}

対応するページ：\ref{calc:page-differential-forms}

::: problem ★ 基本：外微分の計算 {#calc:ex-df-1}
$\omega=xy\,dx+x^{2}\,dy$ について $d\omega$ を求めよ。$\omega$ は閉形式か。
:::

::: solution
\ref{calc:exterior-derivative-properties.1} から $d\omega=d(xy)\wedge dx+d(x^{2})\wedge dy=x\,dy\wedge dx+2x\,dx\wedge dy=x\,dx\wedge dy\neq0$ である。ゆえに閉形式でない。
:::

::: problem ★ 基本：引き戻し {#calc:ex-df-2}
極座標 $\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$ による $dx\wedge dy$ の引き戻しを求めよ。
:::

::: solution
$\Phi^{*}dx=\cos\theta\,dr-r\sin\theta\,d\theta$, $\Phi^{*}dy=\sin\theta\,dr+r\cos\theta\,d\theta$ と \ref{calc:pullback-properties.2} から $\Phi^{*}(dx\wedge dy)=r\,dr\wedge d\theta$ となる（係数 $r$ はヤコビアン）。
:::

::: problem ★★ 標準：閉だが完全でない形式 {#calc:ex-df-3}
$\omega=\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$ は $\R^{2}\setminus\{0\}$ で閉だが完全でないことを、単位円周上の積分で示せ。
:::

::: solution
$\omega=P\,dx+Q\,dy$（$P=\frac{-y}{x^{2}+y^{2}}$, $Q=\frac{x}{x^{2}+y^{2}}$）について $d\omega=(\partial_{x}Q-\partial_{y}P)\,dx\wedge dy$ なので、$d\omega=\Bigl(\frac{\partial}{\partial x}\frac{x}{x^{2}+y^{2}}+\frac{\partial}{\partial y}\frac{y}{x^{2}+y^{2}}\Bigr)dx\wedge dy=\frac{(y^{2}-x^{2})+(x^{2}-y^{2})}{(x^{2}+y^{2})^{2}}dx\wedge dy=0$ である。円周 $c(t)\defeq(\cos2\pi t,\sin2\pi t)$（$0\le t\le1$）では $c^{*}\omega=2\pi\,dt$ なので $\int_{c}\omega=2\pi\neq0$ である。$c(0)=c(1)$ から $\partial c=0$ なので、$\omega=df$（$f$ は $C^{1}$ 級）なら \ref{calc:exact-closed-curve.1} から $\int_{c}\omega=0$ となって矛盾する。ゆえに完全でない。
:::

::: problem ★★★ 発展：ポアンカレの補題の具体例 {#calc:ex-df-4}
$\R^{3}$ の 1 形式 $\omega=yz\,dx+xz\,dy+xy\,dz$ が閉であることを確かめ、$\omega=df$ となる $f$ を、ポアンカレの補題の公式 $f(p)=\int_{0}^{1}\omega_{tp}(p)\,dt$ で求めよ。
:::

::: solution
$d\omega=d(yz)\wedge dx+d(xz)\wedge dy+d(xy)\wedge dz$ を展開すると、$dx\wedge dy$ の係数は $z-z$、$dy\wedge dz$ の係数は $x-x$、$dz\wedge dx$ の係数は $y-y$ なので $d\omega=0$ である。$p=(x,y,z)$ とおくと $\omega_{tp}(p)=t^{2}(yz\cdot x+xz\cdot y+xy\cdot z)=3t^{2}xyz$ なので、$f=\int_{0}^{1}3t^{2}xyz\,dt=xyz$ である（実際 $df=\omega$）。
:::

## 極限操作の交換の一覧 {#calc:sec-li-exercises}

対応するページ：\ref{calc:page-limit-interchange}

::: problem ★ 基本：極限と積分が交換できない例の計算 {#calc:ex-li-1}
$f_{n}(x)=nx(1-x^{2})^{n}$ について $\lim_{n}\int_{0}^{1}f_{n}$ と $\int_{0}^{1}\lim_{n}f_{n}$ を求めよ。
:::

::: solution
$u=1-x^{2}$ と置換すると $\int_{0}^{1}nx(1-x^{2})^{n}dx=\frac n2\int_{0}^{1}u^{n}du=\frac{n}{2(n+1)}$ なので、$\lim_{n}\int_{0}^{1}f_{n}=\frac12$ である。各点では、$x=0$ なら $f_{n}(0)=0$、$0<x\le1$ なら $q\defeq1-x^{2}\in[0,1)$ について $nq^{n}\to0$（$q>0$ なら比 $\frac{(n+1)q^{n+1}}{nq^{n}}\to q<1$）なので $f_{n}(x)\to0$ であり、$\int_{0}^{1}\lim_{n}f_{n}=0$ である。一様収束はしない：$x=n^{-3/4}$ ではベルヌーイの不等式 $(1-a)^{n}\ge1-na$（$0\le a\le1$）から $f_{n}(x)=n^{1/4}(1-n^{-3/2})^{n}\ge n^{1/4}(1-n^{-1/2})$ で、$n\ge4$ なら $\frac12n^{1/4}$ 以上なので $\sup f_{n}\to\infty$ である。
:::

::: problem ★★ 標準：項別積分の正当化 {#calc:ex-li-2}
$\int_{0}^{1}\frac{\log(1+x)}{x}\,dx=\sum_{n\ge1}\frac{(-1)^{n+1}}{n^{2}}=\frac{\pi^{2}}{12}$ を、項別積分を正当化して示せ（$\sum\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$ は認めてよい）。
:::

::: solution
$\frac{\log(1+x)}{x}=\sum_{n\ge1}\frac{(-1)^{n+1}x^{n-1}}{n}$ は $[0,1]$ で一様収束する（各 $x$ で項の絶対値 $\frac{x^{n-1}}{n}$ は $n$ について減少して $0$ に近づくので、交代級数の剰余は次の項 $\frac{x^{n}}{n+1}\le\frac{1}{n+1}$ で抑えられる）。級数の和は $[0,1]$ で連続（\ref{calc:uniform-limit-theorems.2}）で、$[0,1)$ では $\frac{\log(1+x)}{x}$（$x=0$ では $1$）に等しいので、$x=1$ でも連続性から等しい。ゆえに項別積分でき（\ref{calc:uniform-limit-theorems.4}）、$\sum\frac{(-1)^{n+1}}{n^{2}}=\frac{\pi^{2}}{6}-2\cdot\frac{1}{4}\cdot\frac{\pi^{2}}{6}=\frac{\pi^{2}}{12}$。
:::
