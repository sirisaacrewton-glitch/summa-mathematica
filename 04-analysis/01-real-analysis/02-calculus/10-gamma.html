# ガンマ関数とスターリングの公式 {#calc:page-gamma keywords="Gamma function, functional equation Gamma(x+1) = x Gamma(x), Young and Holder inequalities for integrals, log-convexity, Bohr-Mollerup theorem, Gauss product formula, Beta function, Gamma(1/2) = sqrt(pi), Wallis product, Stirling's formula"}

階乗 $n!$ を正の実数に補間する**ガンマ関数** $\Gamma(x)=\int_{0}^{\infty}t^{x-1}e^{-t}\,dt$ を導入する。関数等式 $\Gamma(x+1)=x\Gamma(x)$ を満たす関数はいくらでもあるが、$\log\Gamma$ が凸であるという条件を加えるとただ一つに決まる（**ボーア–モレルップの定理**）。この特徴づけから、ベータ関数との関係 $B(x,y)=\frac{\Gamma(x)\Gamma(y)}{\Gamma(x+y)}$ と $\Gamma(\frac12)=\sqrt\pi$ を導く。最後に、ウォリスの積を経由して、$n!$ の大きさを与える**スターリングの公式** $n!\sim\sqrt{2\pi n}\bigl(\frac ne\bigr)^{n}$ を証明する。

> 資料：Rudin『Principles of Mathematical Analysis』第 8 章（8.18〜8.22）、杉浦光夫『解析入門 I』第 IV 章（ガンマ関数、ウォリスの公式、スターリングの公式）の内容に相当する標準的な事項。スターリングの公式の誤差評価の証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-ga-notation}

::: notation
- 広義積分と比較判定法 \ref{calc:improper-integral}, \ref{calc:improper-tests}、部分積分と置換積分 \ref{calc:substitution-parts}。

- $a_{n}\sim b_{n}$ は $\frac{a_{n}}{b_{n}}\to1$ の意味。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## ガンマ関数 {#calc:sec-ga-gamma}

::: definition ガンマ関数 {#calc:gamma keywords="Gamma(x) = int_0^infinity t^{x-1} e^{-t} dt converges for x > 0" index="ガンマ関数|がんまかんすう"}
$x>0$ について $\Gamma(x)\defeq\int_{0}^{\infty}t^{x-1}e^{-t}\,dt$ とする。
:::

::: proposition ガンマ関数の基本性質 {#calc:gamma-basic keywords="the integral defining Gamma converges for x > 0; Gamma(x+1) = x Gamma(x); Gamma(n+1) = n!; Gamma > 0" index="ガンマ関数の関数等式|がんまかんすうのかんすうとうしき"}
1. $x>0$ で $\Gamma(x)$ は収束し、$\Gamma(x)>0$。
2. $\Gamma(x+1)=x\Gamma(x)$、$\Gamma(1)=1$、$\Gamma(n+1)=n!$。
:::

::: proof
**1.** $(0,1]$ では $0<t^{x-1}e^{-t}\le t^{x-1}$ で、$\int_{0}^{1}t^{x-1}dt=\frac1x$ は収束（$x>0$）。$[1,\infty)$ では $t^{x+1}e^{-t}\to0$（\ref{calc:growth-rates}）なので十分大きい $t$ で $t^{x-1}e^{-t}\le t^{-2}$ となり、比較判定法。被積分関数は正。

**2.** $[\varepsilon,R]$ で部分積分すると $\int_{\varepsilon}^{R}t^{x}e^{-t}dt=\bigl[-t^{x}e^{-t}\bigr]_{\varepsilon}^{R}+x\int_{\varepsilon}^{R}t^{x-1}e^{-t}dt$。$\varepsilon\to0$, $R\to\infty$ で境界項は $0$。$\Gamma(1)=\int_{0}^{\infty}e^{-t}dt=1$。帰納法で $\Gamma(n+1)=n!$。
:::

::: lemma ヤングとヘルダーの不等式 {#calc:holder-integral keywords="Young's inequality ab <= a^p/p + b^q/q; Holder's inequality for Riemann integrals and nonnegative improper integrals" index="ヤングの不等式|やんぐのふとうしき, ヘルダーの不等式|へるだーのふとうしき" refname="ヤングとヘルダーの不等式"}
$p,q>1$, $\frac1p+\frac1q=1$ とする。
1. $a,b\ge0$ なら $ab\le\frac{a^{p}}{p}+\frac{b^{q}}{q}$。
2. $f,g\ge0$ が $[a,b]$ で積分可能なら $\int fg\le\bigl(\int f^{p}\bigr)^{1/p}\bigl(\int g^{q}\bigr)^{1/q}$。両辺が収束する広義積分でも成り立つ。
:::

::: proof
1：$a,b>0$ とする（どちらかが $0$ なら明らか）。$\log$ は凹（\ref{calc:log-properties}、$\log''<0$）なので $\log\bigl(\frac{a^{p}}{p}+\frac{b^{q}}{q}\bigr)\ge\frac1p\log a^{p}+\frac1q\log b^{q}=\log(ab)$。2：$A\defeq(\int f^{p})^{1/p}$, $B\defeq(\int g^{q})^{1/q}$ とする。$A,B>0$ なら、1 を各点で $\frac{f}{A}$, $\frac{g}{B}$ に使って積分すると $\frac{\int fg}{AB}\le\frac1p+\frac1q=1$。$A=0$ なら（$B=0$ も同様）、任意の $\lambda>0$ で 1 から $fg=(\lambda f)\frac g\lambda\le\frac{\lambda^{p}f^{p}}{p}+\frac{g^{q}}{q\lambda^{q}}$ を積分して $\int fg\le\frac{B^{q}}{q\lambda^{q}}\to0$（$\lambda\to\infty$）。広義積分は区間を広げた極限。
:::

::: theorem ボーア–モレルップの定理 {#calc:bohr-mollerup keywords="Bohr-Mollerup: Gamma is the unique positive function on (0,infinity) with f(1) = 1, f(x+1) = x f(x) and log f convex; Gauss product formula" index="ボーア–モレルップの定理|ぼーあもれるっぷのていり, ガウスの積公式|がうすのせきこうしき, 対数凸|たいすうとつ" refname="ボーア–モレルップの定理"}
1. $\log\Gamma$ は $(0,\infty)$ で凸である。
2. $(0,\infty)$ 上の正の関数 $f$ が $f(1)=1$, $f(x+1)=xf(x)$, $\log f$ が凸 を満たすなら $f=\Gamma$。
3. **（ガウスの積公式）** $x>0$ で
$$
\Gamma(x)=\lim_{n\to\infty}\frac{n!\,n^{x}}{x(x+1)\cdots(x+n)}.
$$
:::

::: proof
**Step 1（1）.** $x,y>0$, $0<\lambda<1$ とし、$p\defeq\frac1\lambda$, $q\defeq\frac{1}{1-\lambda}$ とする。$t^{\lambda x+(1-\lambda)y-1}e^{-t}=\bigl(t^{x-1}e^{-t}\bigr)^{\lambda}\bigl(t^{y-1}e^{-t}\bigr)^{1-\lambda}$ にヘルダーの不等式を使うと $\Gamma(\lambda x+(1-\lambda)y)\le\Gamma(x)^{\lambda}\Gamma(y)^{1-\lambda}$、対数をとると凸性。

**Step 2（2 と 3：$0<x<1$ での値）.** $\varphi\defeq\log f$ とすると $\varphi(x+1)=\varphi(x)+\log x$、$\varphi(1)=0$ から $\varphi(n+1)=\log n!$。$0<x<1$ と $n\ge1$ について、凸関数の傾きの単調性（\ref{calc:convex-properties.1}）を $n<n+1<n+1+x<n+2$ に使うと
$$
\begin{aligned}\log n&=\varphi(n+1)-\varphi(n)\le\frac{\varphi(n+1+x)-\varphi(n+1)}{x}\\ &\le\varphi(n+2)-\varphi(n+1)=\log(n+1).\end{aligned}
$$
関数等式を繰り返して $\varphi(n+1+x)=\varphi(x)+\log\bigl(x(x+1)\cdots(x+n)\bigr)$ なので
$$
0\le\varphi(x)-\log\frac{n!\,n^{x}}{x(x+1)\cdots(x+n)}\le x\log\Bigl(1+\frac1n\Bigr)\to0.
$$
よって $\varphi(x)$ は $x$ だけで決まる極限に等しい。$x=1$ でも同じ式が成り立つ（両辺 $0$ に収束）。

**Step 3.** $x>1$ では関数等式で $(0,1]$ に戻せるので、$f$ はただ一つ。$\Gamma$ は条件を満たす（\ref{calc:gamma-basic} と 1）ので $f=\Gamma$。積公式は Step 2 の極限（$x>1$ では関数等式で移すと同じ形）。
:::

## ベータ関数と $\Gamma(\frac12)$ {#calc:sec-ga-beta}

::: theorem ベータ関数 {#calc:beta-function keywords="Beta function B(x,y) = int_0^1 t^{x-1}(1-t)^{y-1} dt = Gamma(x)Gamma(y)/Gamma(x+y); Gamma(1/2) = sqrt(pi)" index="ベータ関数|べーたかんすう"}
$x,y>0$ について $B(x,y)\defeq\int_{0}^{1}t^{x-1}(1-t)^{y-1}\,dt$ は収束し、
$$
B(x,y)=\frac{\Gamma(x)\Gamma(y)}{\Gamma(x+y)}.
$$
とくに $\Gamma(\frac12)=\sqrt\pi$。
:::

::: proof
**Step 1（収束）.** $t\to0$ で $t^{x-1}$、$t\to1$ で $(1-t)^{y-1}$ と比較する。

**Step 2（ボーア–モレルップの条件）.** $y$ を固定し $f(x)\defeq\frac{\Gamma(x+y)}{\Gamma(y)}B(x,y)$ とおく。(a) $B(1,y)=\frac1y$ なので $f(1)=\frac{\Gamma(1+y)}{y\Gamma(y)}=1$。(b) 部分積分で $B(x+1,y)=\frac{x}{y}B(x,y+1)$、また $B(x,y)=B(x+1,y)+B(x,y+1)$（被積分関数に $t+(1-t)=1$ を掛ける）から $B(x+1,y)=\frac{x}{x+y}B(x,y)$。よって $f(x+1)=\frac{(x+y)\Gamma(x+y)}{\Gamma(y)}\cdot\frac{x}{x+y}B(x,y)=xf(x)$。(c) $\log B(\cdot,y)$ はヘルダーの不等式で凸（Step 1 の \ref{calc:bohr-mollerup} と同じ議論）、$\log\Gamma(x+y)$ も凸で、和は凸。\ref{calc:bohr-mollerup.2} から $f=\Gamma$。

**Step 3（$\Gamma(\frac12)$）.** $B(\frac12,\frac12)=\frac{\Gamma(\frac12)^{2}}{\Gamma(1)}$。置換 $t=\sin^{2}\theta$（$\theta\in(0,\frac\pi2)$、$dt=2\sin\theta\cos\theta\,d\theta$）で $B(\frac12,\frac12)=\int_{0}^{\pi/2}\frac{2\sin\theta\cos\theta}{\sin\theta\cos\theta}d\theta=\pi$（両端での広義積分は内側の区間の極限）。$\Gamma(\frac12)>0$。
:::

## スターリングの公式 {#calc:sec-ga-stirling}

::: theorem ウォリスの積 {#calc:wallis keywords="Wallis product pi/2 = prod (2n)^2/((2n-1)(2n+1)); integrals of powers of sine" index="ウォリスの積|うぉりすのせき"}
$$
\frac\pi2=\lim_{m\to\infty}\prod_{n=1}^{m}\frac{(2n)^{2}}{(2n-1)(2n+1)}.
$$
:::

::: proof
**Step 1（漸化式）.** $S_{n}\defeq\int_{0}^{\pi/2}\sin^{n}x\,dx$ とする。部分積分（$\sin^{n}=\sin^{n-1}\cdot\sin$）と $\cos^{2}=1-\sin^{2}$ から $S_{n}=\frac{n-1}{n}S_{n-2}$（$n\ge2$）。$S_{0}=\frac\pi2$, $S_{1}=1$ なので
$$
S_{2m}=\frac\pi2\prod_{n=1}^{m}\frac{2n-1}{2n},\qquad S_{2m+1}=\prod_{n=1}^{m}\frac{2n}{2n+1}.
$$

**Step 2（はさみうち）.** $0\le\sin x\le1$ なので $S_{2m+1}\le S_{2m}\le S_{2m-1}$。よって $1\le\frac{S_{2m}}{S_{2m+1}}\le\frac{S_{2m-1}}{S_{2m+1}}=\frac{2m+1}{2m}\to1$。$\frac{S_{2m}}{S_{2m+1}}=\frac\pi2\prod_{n\le m}\frac{(2n-1)(2n+1)}{(2n)^{2}}$ なので結論。
:::

::: theorem スターリングの公式 {#calc:stirling keywords="Stirling's formula n! ~ sqrt(2 pi n) (n/e)^n, with the error bounds 1 < n!/(sqrt(2 pi n)(n/e)^n) < e^{1/(12n) refname="スターリングの公式"}" index="スターリングの公式|すたーりんぐのこうしき"}
$$
n!\sim\sqrt{2\pi n}\Bigl(\frac ne\Bigr)^{n}.
$$
より詳しく、$1<\dfrac{n!}{\sqrt{2\pi n}(n/e)^{n}}<e^{1/(12n)}$。
:::

::: proof
**Step 1（差の評価）.** $a_{n}\defeq\frac{n!}{\sqrt n(n/e)^{n}}$ とすると
$$
\log\frac{a_{n}}{a_{n+1}}=\Bigl(n+\frac12\Bigr)\log\Bigl(1+\frac1n\Bigr)-1.
$$
$u\defeq\frac{1}{2n+1}$ とおくと $1+\frac1n=\frac{1+u}{1-u}$ で、\ref{calc:log-series} から $\log\frac{1+u}{1-u}=2\sum_{k\ge0}\frac{u^{2k+1}}{2k+1}$。よって
$$
\log\frac{a_{n}}{a_{n+1}}=\frac{1}{2u}\log\frac{1+u}{1-u}-1=\sum_{k\ge1}\frac{u^{2k}}{2k+1}.
$$
これは正で、$\sum_{k\ge1}\frac{u^{2k}}{3}=\frac{u^{2}}{3(1-u^{2})}=\frac{1}{12n(n+1)}$ より小さい。

**Step 2（極限の存在）.** $(a_{n})$ は狭義減少で正なので $a_{n}\to C\ge0$。$b_{n}\defeq a_{n}e^{-1/(12n)}$ とすると、$\log\frac{b_{n}}{b_{n+1}}<\frac{1}{12n(n+1)}-\frac{1}{12n}+\frac{1}{12(n+1)}=0$ なので $(b_{n})$ は増加し、$C=\lim b_{n}\ge b_{1}>0$。$b_{n}<C<a_{n}$。

**Step 3（$C=\sqrt{2\pi}$）.** ウォリスの積の部分積は $\frac{2^{4m}(m!)^{4}}{((2m)!)^{2}(2m+1)}$ と書ける（分子の $\prod(2n)^{2}=2^{2m}(m!)^{2}$ を 2 回、分母の $\prod(2n-1)(2n+1)=\frac{((2m)!)^{2}(2m+1)}{2^{2m}(m!)^{2}}$）。$m!=a_{m}\sqrt m(m/e)^{m}$ を代入すると
$$
\frac{2^{4m}a_{m}^{4}m^{2}(m/e)^{4m}}{a_{2m}^{2}\,2m\,(2m/e)^{4m}(2m+1)}=\frac{a_{m}^{4}}{a_{2m}^{2}}\cdot\frac{m}{2(2m+1)}\to\frac{C^{2}}{4}.
$$
ウォリスの積から $\frac{C^{2}}{4}=\frac\pi2$、$C=\sqrt{2\pi}$。誤差の評価は Step 2 の $b_{n}<C<a_{n}$。
:::

::: supplement
**一般化と関連する事実.**
- ガンマ関数は複素平面に有理型に延び（$0,-1,-2,\dots$ で 1 位の極）、相補公式 $\Gamma(x)\Gamma(1-x)=\frac{\pi}{\sin\pi x}$ と倍数公式を満たす（知られている。\ref{cx:page-power-series} の後で扱える）。
- スターリングの公式は $\log\Gamma(x)$ の漸近展開 $\bigl(x-\frac12\bigr)\log x-x+\frac12\log2\pi+\frac{1}{12x}-\cdots$（ベルヌーイ数を係数とする発散級数）の最初の項である（知られている）。
- $n$ 次元単位球の体積は $\frac{\pi^{n/2}}{\Gamma(\frac n2+1)}$ で与えられる（多変数の積分で示せる）。

**前提を変えると.** 関数等式 $f(x+1)=xf(x)$ と $f(1)=1$ だけでは $f$ は決まらない：$\Gamma(x)(1+\sin^{2}\pi x)$ も満たす。対数凸性の代わりに単調性や連続性だけを課しても一意性は得られない（周期 $1$ の関数を掛ける自由度が残る）。

**高い視点.** ボーア–モレルップの定理は、「関数等式と凸性」という定性的な条件が、無限次元の自由度（周期関数を掛ける自由）を消してただ一つの関数を選び出す例である。比喩で言えば、階乗の点 $n!$ を通る滑らかな曲線は無数に描けるが、「どこでも外側に膨らまない（対数で見て下に凸）」という自然な制約を課すと、描ける曲線はガンマ関数だけになる。
:::

## 問題 {#calc:sec-ga-problems}

::: problem {#calc:prob-ga-half-integers}
$\Gamma\bigl(n+\frac12\bigr)=\frac{(2n)!}{4^{n}n!}\sqrt\pi$ を示せ。
:::

::: solution
$\Gamma(\frac12)=\sqrt\pi$ と関数等式から $\Gamma(n+\frac12)=\prod_{k=0}^{n-1}\bigl(k+\frac12\bigr)\sqrt\pi=\frac{1\cdot3\cdots(2n-1)}{2^{n}}\sqrt\pi$。$1\cdot3\cdots(2n-1)=\frac{(2n)!}{2^{n}n!}$。
:::

::: problem {#calc:prob-ga-gaussian}
$\int_{0}^{\infty}e^{-x^{2}}\,dx=\frac{\sqrt\pi}{2}$ を示せ。
:::

::: solution
置換 $t=x^{2}$（$x=\sqrt t$, $dx=\frac{dt}{2\sqrt t}$、広義積分は内側の区間で置換して極限）で $\int_{0}^{\infty}e^{-x^{2}}dx=\frac12\int_{0}^{\infty}t^{-1/2}e^{-t}dt=\frac12\Gamma(\frac12)=\frac{\sqrt\pi}{2}$。
:::

::: problem {#calc:prob-ga-central-binomial}
スターリングの公式から $\binom{2n}{n}\sim\frac{4^{n}}{\sqrt{\pi n}}$ を導け。
:::

::: solution
$\binom{2n}{n}=\frac{(2n)!}{(n!)^{2}}\sim\frac{\sqrt{4\pi n}(2n/e)^{2n}}{2\pi n(n/e)^{2n}}=\frac{2\sqrt{\pi n}\,4^{n}}{2\pi n}=\frac{4^{n}}{\sqrt{\pi n}}$（$\sim$ は積と商で保たれる）。
:::
