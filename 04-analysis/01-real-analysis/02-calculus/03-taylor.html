# テイラーの定理 {#calc:page-taylor keywords="Taylor polynomial, Taylor's theorem with Lagrange remainder, Peano remainder, little o, uniqueness of Taylor polynomials, higher derivative test for local extrema, Newton's method, quadratic convergence, square root algorithm"}

微分は関数を一次関数で近似する操作だった。高階の導関数を使えば、関数を $n$ 次多項式（**テイラー多項式**）で近似でき、その誤差は $(n+1)$ 階導関数で評価できる（**テイラーの定理**）。このページでは、ラグランジュ型とペアノ型の剰余項、高階導関数による極値の判定、方程式の数値解法である**ニュートン法**の収束を扱う。積分形の剰余項は \ref[微分積分学の基本定理]{calc:page-fundamental-theorem} で扱う。

> 資料：Rudin『Principles of Mathematical Analysis』第 5 章（5.15）、杉浦光夫『解析入門 I』第 II 章（テイラーの定理、定理 2.14 のニュートンの逐次近似法）の内容に相当する標準的な事項。証明は自分で書き下ろした。

## 記法と定義の確認 {#calc:sec-ta-notation}

::: notation
- 微分・平均値の定理・ロルの定理・凸関数は \ref{calc:page-derivatives}（\ref{calc:derivative}, \tref{calc:mean-value-theorem}, \ref{calc:mvt-consequences}, \ref{calc:convex-properties}）。
- $f(x)=o(g(x))$（$x\to a$）は $\frac{f(x)}{g(x)}\to0$ の意味（$x\neq a$ の近くで $g\neq0$）。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## テイラーの定理 {#calc:sec-ta-taylor}

::: definition テイラー多項式 {#calc:taylor-polynomial keywords="Taylor polynomial T_n f(x; a) = sum_{k<=n} f^{(k)}(a)/k! (x-a)^k" index="テイラー多項式|ているあーたこうしき"}
$f$ が $a$ で $n$ 回微分可能なとき、
$$
T_{n}(x)=T_{n}f(x;a)\defeq\sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x-a)^{k}
$$
を $f$ の $a$ における $n$ 次の**テイラー多項式**という。$T_{n}^{(k)}(a)=f^{(k)}(a)$（$k\le n$）で、$(T_{n}f)'=T_{n-1}(f')$。
:::

::: theorem テイラーの定理（ラグランジュの剰余項） {#calc:taylor-lagrange keywords="Taylor's theorem with Lagrange remainder: f(x) = T_n(x) + f^{(n+1) refname="テイラーの定理（ラグランジュの剰余項）"}(xi)/(n+1)! (x-a)^{n+1}" index="テイラーの定理|ているあーのていり, ラグランジュの剰余項|らぐらんじゅのじょうよこう"}
$f^{(n)}$ が閉区間 $J$ で連続、$f^{(n+1)}$ が $J^{\circ}$ で存在するとする。相異なる $a,x\in J$ について、$a$ と $x$ の間の $\xi$ で
$$
f(x)=\sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}(x-a)^{k}+\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-a)^{n+1}
$$
となるものがある。
:::

::: proof
**Step 1.** $M$ を $f(x)=T_{n}(x)+M(x-a)^{n+1}$ となる数とし（$x\neq a$ なので一意）、$g(t)\defeq f(t)-T_{n}(t)-M(t-a)^{n+1}$ とおく。$g$ の $k$ 階導関数（$k\le n$）は $a$ と $x$ の間の閉区間で連続で、$g^{(n+1)}(t)=f^{(n+1)}(t)-(n+1)!M$。

**Step 2.** $g^{(k)}(a)=0$（$k\le n$、$T_{n}^{(k)}(a)=f^{(k)}(a)$）で $g(x)=0$。ロルの定理から $a$ と $x$ の間に $g'(x_{1})=0$ となる $x_{1}$ がある。$g'(a)=0=g'(x_{1})$ なので $a$ と $x_{1}$ の間に $g''(x_{2})=0$ となる $x_{2}$ がある。繰り返して $g^{(n+1)}(x_{n+1})=0$ となる $x_{n+1}$ が $a$ と $x$ の間にある。$\xi\defeq x_{n+1}$ とすると $f^{(n+1)}(\xi)=(n+1)!M$。

::: hypcheck
- **$f^{(n)}$ の連続性**：Step 2 の最後のロルの定理（$g^{(n)}$ の端点での連続性）に使った。
- $\xi$ は $x$ に依存し、一般には $x$ の関数として連続ですらない。
:::
:::

::: theorem テイラーの定理（ペアノの剰余項） {#calc:taylor-peano keywords="Taylor's theorem with Peano remainder: if f^{(n) refname="テイラーの定理（ペアノの剰余項）"}(a) exists then f(x) - T_n(x) = o((x-a)^n); uniqueness of the Taylor polynomial" index="ペアノの剰余項|ぺあののじょうよこう"}
1. $f$ が $a$ で $n$ 回微分可能（$n\ge1$）なら、$f(x)-T_{n}f(x;a)=o((x-a)^{n})$（$x\to a$）。
2. 次数 $n$ 以下の多項式 $P$ で $f(x)-P(x)=o((x-a)^{n})$ となるものは $T_{n}f(\cdot\,;a)$ だけ。
:::

::: proof
**Step 1（1）.** $n$ についての帰納法。$n=1$ は微分係数の定義そのもの。$n\ge2$ とし、$h\defeq f-T_{n}f$ とおく。$f$ は $a$ の近くで $(n-1)$ 回微分可能で、$f'$ は $a$ で $(n-1)$ 回微分可能なので、帰納法の仮定から $h'=f'-T_{n-1}(f')=o((x-a)^{n-1})$。$h(a)=0$ なので、平均値の定理から $h(x)=h'(\xi_{x})(x-a)$（$|\xi_{x}-a|<|x-a|$）で
$$
\Bigl|\frac{h(x)}{(x-a)^{n}}\Bigr|=\Bigl|\frac{h'(\xi_{x})}{(\xi_{x}-a)^{n-1}}\Bigr|\cdot\Bigl|\frac{\xi_{x}-a}{x-a}\Bigr|^{n-1}\le\Bigl|\frac{h'(\xi_{x})}{(\xi_{x}-a)^{n-1}}\Bigr|\to0
$$
（$\xi_{x}=a$ の場合は $h'(a)=0$ から $h(x)=0$）。

**Step 2（2）.** $Q\defeq P-T_{n}$ は次数 $n$ 以下で $Q(x)=o((x-a)^{n})$。$Q(x)=\sum_{k\le n}c_{k}(x-a)^{k}$ で $c_{m}$ を最初の $0$ でない係数とすると、$\frac{Q(x)}{(x-a)^{m}}\to c_{m}\neq0$ となり矛盾。
:::

::: corollary 高階導関数による極値の判定 {#calc:higher-derivative-test keywords="if the first nonzero derivative at a critical point has even order, f has a strict local extremum; if odd, no extremum" index="極値の判定|きょくちのはんてい"}
$f$ が $a\in I^{\circ}$ で $n$ 回微分可能、$f'(a)=\cdots=f^{(n-1)}(a)=0$, $f^{(n)}(a)\neq0$ とする。$n$ が偶数なら $f$ は $a$ で狭義の極値をとり、$f^{(n)}(a)>0$ なら極小、$<0$ なら極大。$n$ が奇数なら極値をとらない。
:::

::: proof
ペアノの剰余項から $\frac{f(x)-f(a)}{(x-a)^{n}}\to\frac{f^{(n)}(a)}{n!}\neq0$。よって $a$ の近くで $f(x)-f(a)$ は $\frac{f^{(n)}(a)}{n!}(x-a)^{n}$ と同符号。$n$ が偶数なら $(x-a)^{n}>0$（$x\neq a$）で符号一定、奇数なら $x>a$ と $x<a$ で符号が変わる。
:::

## ニュートン法 {#calc:sec-ta-newton}

::: theorem ニュートン法の収束 {#calc:newton-method keywords="Newton's method: local quadratic convergence near a simple root of a C^2 function; monotone convergence for increasing convex functions" index="ニュートン法|にゅーとんほう, 2 次収束|にじしゅうそく"}
$f$ を $c$ を含む開区間で $C^{2}$ 級、$f(c)=0$, $f'(c)\neq0$ とし、$x_{k+1}\defeq x_{k}-\frac{f(x_{k})}{f'(x_{k})}$ とおく。
1. **（局所 2 次収束）** $\delta>0$ を、$J\defeq[c-\delta,c+\delta]$ で $|f'|\ge m>0$, $|f''|\le M$ かつ $K\delta<1$（$K\defeq\frac{M}{2m}$）となるようにとる。$x_{0}\in J$ なら $x_{k}\in J$ で、$|x_{k+1}-c|\le K|x_{k}-c|^{2}$。とくに $x_{k}\to c$。
2. **（凸の場合）** $f$ が $[c,b]$ で $f'>0$, $f''\ge0$ なら、$x_{0}\in(c,b]$ から始めると $(x_{k})$ は単調減少して $c$ に収束する。
:::

::: proof
**Step 1（誤差の式）.** $x_{k}\in J$ なら、テイラーの定理（$n=1$）を $x_{k}$ のまわりで $c$ に使うと $0=f(c)=f(x_{k})+f'(x_{k})(c-x_{k})+\frac{f''(\xi)}{2}(c-x_{k})^{2}$。$f'(x_{k})$ で割って $x_{k+1}$ の定義と比べると
$$
x_{k+1}-c=\frac{f''(\xi)}{2f'(x_{k})}(x_{k}-c)^{2},\qquad|x_{k+1}-c|\le K|x_{k}-c|^{2}.
$$

**Step 2（1）.** $|x_{k}-c|\le\delta$ なら $|x_{k+1}-c|\le K\delta|x_{k}-c|\le|x_{k}-c|$ なので $x_{k+1}\in J$。帰納法で $|x_{k}-c|\le(K\delta)^{k}\delta\to0$。

**Step 3（2）.** $x_{k}\in(c,b]$ とする。$f$ は狭義増加なので $f(x_{k})>0$ で $x_{k+1}<x_{k}$。Step 1 の式（$\xi\in(c,x_{k})$）で $f''\ge0$, $f'>0$ から $x_{k+1}\ge c$。$x_{k+1}=c$ なら以後一定。よって $(x_{k})$ は $c$ 以上の単調減少列で、極限 $x^{*}\ge c$ があり、$x_{k+1}=x_{k}-\frac{f(x_{k})}{f'(x_{k})}$ で極限をとると（$f$, $f'$ は連続、$f'(x^{*})>0$）$f(x^{*})=0$、狭義増加から $x^{*}=c$。
:::

::: example 平方根の計算
$a>0$ について $f(x)=x^{2}-a$ にニュートン法を使うと $x_{k+1}=\frac12\bigl(x_{k}+\frac{a}{x_{k}}\bigr)$。$f$ は $(0,\infty)$ で $f'>0$, $f''=2>0$ なので、任意の $x_{0}>\sqrt a$ から単調減少して $\sqrt a$ に収束する（2）。$x_{0}\in(0,\sqrt a)$ でも $x_{1}=\frac12(x_{0}+\frac a{x_{0}})\ge\sqrt a$（相加相乗平均）なので、2 回目以降は同じ。誤差は $x_{k+1}-\sqrt a=\frac{(x_{k}-\sqrt a)^{2}}{2x_{k}}$ で、正しい桁数がほぼ倍々に増える。
:::

::: supplement 計算の観点
ニュートン法は「各段で関数を接線で置き換えて解く」方法で、単根の近くでは 2 次収束（誤差がほぼ 2 乗になる）するので、倍精度の浮動小数点数なら数回の反復で丸め誤差の限界に達する。一方、初期値が根から遠いと収束しないことがあり（$f(x)=x^{3}-2x+2$ を $x_{0}=0$ から始めると $0,1,0,1,\dots$ と振動する）、重根では収束が 1 次に落ちる。実用では、二分法（\ref{calc:continuity-axioms-equivalent} の Step 6 と同じ考え）で根を挟みながらニュートン法を使う組み合わせ（ブレント法など）が使われる。多項式の値とその導関数の値は、ホーナー法（$p(x)=(\cdots(a_{n}x+a_{n-1})x+\cdots)x+a_{0}$）で $n$ 回の乗算で計算できる。
:::

::: supplement
**一般化と関連する事実.**
- 積分形の剰余項 $\frac{1}{n!}\int_{a}^{x}f^{(n+1)}(t)(x-t)^{n}\,dt$ は \ref[微分積分学の基本定理]{calc:page-fundamental-theorem} で扱う。
- テイラー多項式が $n\to\infty$ で $f$ に収束するとは限らない。すべての階数の導関数が $0$ で $0$ でない $C^{\infty}$ 級関数（$e^{-1/x^{2}}$）や、任意の数列をテイラー係数にもつ $C^{\infty}$ 級関数（ボレルの定理）は、指数関数を定義した後に \ref[指数関数と対数関数]{calc:page-exp-log} で扱う。
- 多変数のテイラーの定理とヘッセ行列による極値の判定は多変数の微分で扱う。

**前提を変えると.** ペアノの剰余項は $a$ での $n$ 回微分可能性だけで成り立つが、ラグランジュの剰余項は区間での $(n+1)$ 回微分可能性を要する。高階導関数による判定は $f^{(n)}(a)\neq0$ となる $n$ がないと何も言わない（すべての導関数が $0$ の関数は、極小・極大・どちらでもない、のいずれもありうる）。

**高い視点.** テイラー多項式は、$a$ での「$n$ 次までの局所的な情報」（$n$ ジェット）を多項式で表したもので、ペアノの剰余項は、この対応が関数の芽から $n$ ジェットへの写像として well-defined であることを言っている。比喩で言えば、テイラー多項式は関数の「拡大鏡で見た姿」で、倍率を上げる（$n$ を増やす）ほど細部が見えるが、拡大鏡で見えるのはその点のごく近くだけで、遠くの姿（解析的かどうか）までは保証しない。
:::

## 問題 {#calc:sec-ta-problems}

::: problem {#calc:prob-ta-sqrt}
$f(x)=\sqrt{1+x}$ の $0$ における 2 次のテイラー多項式を求め、$0\le x\le1$ で誤差が $\frac{x^{3}}{16}$ 以下であることを示せ。
:::

::: solution
逆関数と連鎖律（\ref{calc:chain-rule}）から $f'=\frac12(1+x)^{-1/2}$, $f''=-\frac14(1+x)^{-3/2}$, $f'''=\frac38(1+x)^{-5/2}$（$(1+x)^{-1/2}=1/f$ を微分）。$T_{2}=1+\frac x2-\frac{x^{2}}{8}$。ラグランジュの剰余項は $\frac{f'''(\xi)}{6}x^{3}=\frac{1}{16}(1+\xi)^{-5/2}x^{3}$（$0<\xi<x$）で、$(1+\xi)^{-5/2}\le1$ から誤差は $\frac{x^{3}}{16}$ 以下。
:::

::: problem {#calc:prob-ta-polynomial}
次数 $n$ 以下の多項式 $P$ について、任意の $a$ で $P=T_{n}P(\cdot\,;a)$ であることを、ラグランジュの剰余項から導け。
:::

::: solution
$P^{(n+1)}=0$ なので、テイラーの定理の剰余項は $0$ で、すべての $x$ で $P(x)=T_{n}P(x;a)$。
:::

::: problem {#calc:prob-ta-newton-cycle}
$f(x)=x^{3}-2x+2$ にニュートン法を $x_{0}=0$ から使うと、$x_{1}=1$, $x_{2}=0$ と振動することを確かめよ。\ref{calc:newton-method.1} の条件が満たされない理由を述べよ。
:::

::: solution
$f'(x)=3x^{2}-2$。$x_{1}=0-\frac{2}{-2}=1$, $x_{2}=1-\frac{1}{1}=0$。$f$ の実根 $c$ は $f(-2)=-2<0<f(-1)=3$ から $(-2,-1)$ にあり、$x_{0}=0$ は $c$ から距離 $1$ 以上離れている。$c$ を含み $0$ まで届く区間 $J$ には $f'(x)=0$ となる点 $x=-\sqrt{2/3}$ が含まれ、$|f'|\ge m>0$ を満たす $\delta$ がとれない。
:::
