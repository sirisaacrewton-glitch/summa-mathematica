# リーマン積分 {#calc:page-riemann-integral keywords="partition, Darboux sums, upper and lower integrals, Riemann integrable function, Riemann criterion, Riemann sums and mesh, equivalence of Darboux and Riemann definitions, integrability of continuous and monotone functions, linearity and monotonicity of the integral, additivity over intervals, mean value theorem for integrals, oscillation, sets of measure zero, Lebesgue's criterion for Riemann integrability, Thomae function"}

有界関数 $f\colon[a,b]\to\mathbb{R}$ の積分を、区間を細かく分けて「上から押さえる面積」（上ダルブー和）と「下から押さえる面積」（下ダルブー和）がはさむ値として定義する。リーマン自身の定義（任意の代表点による和の、分割を細かくした極限）と同値であることを示し、連続関数・単調関数が積分可能であること、積分の基本性質を述べる。最後に、積分可能性を不連続点の集合の「大きさ」で特徴づける**ルベーグの判定法**を、選択公理を使わずに証明する。

> 資料：Rudin『Principles of Mathematical Analysis』第 6 章（6.1〜6.20、11.33）、杉浦光夫『解析入門 I』第 III 章の内容に相当する標準的な事項。ルベーグの判定法の選択公理を避ける証明は、等分割の列を使う形に自分で組み立てた。

## 記法と定義の確認 {#calc:sec-ri-notation}

::: notation
- 連続関数、一様連続性（ハイネ–カントール）、単調関数は \tref{calc:page-continuity}（\ref{calc:interval-theorems}, \ref{calc:monotone-function-limits}）。上限と下限 \ref{calc:supremum}。有界閉区間のコンパクト性 (HB) \ref{calc:continuity-axioms-equivalent}。
- $f\colon[a,b]\to\mathbb{R}$ は有界とし、$|f|\le B$ と書く。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## ダルブー和と積分 {#calc:sec-ri-darboux}

::: definition 分割とダルブー和 {#calc:darboux-sums keywords="partition of [a,b], mesh, refinement, upper and lower Darboux sums, Riemann sums with tags" index="分割|ぶんかつ, ダルブー和|だるぶーわ, リーマン和|りーまんわ, 細分|さいぶん"}
1. $[a,b]$ の**分割** $P$ は有限列 $a=x_{0}<x_{1}<\cdots<x_{n}=b$。$\Delta x_{i}\defeq x_{i}-x_{i-1}$、$|P|\defeq\max_{i}\Delta x_{i}$（**幅**）。$P\subset P'$ のとき $P'$ は $P$ の**細分**。
2. $M_{i}\defeq\sup_{[x_{i-1},x_{i}]}f$, $m_{i}\defeq\inf_{[x_{i-1},x_{i}]}f$ とし、$U(f,P)\defeq\sum M_{i}\Delta x_{i}$（**上ダルブー和**）、$L(f,P)\defeq\sum m_{i}\Delta x_{i}$（**下ダルブー和**）。
3. 代表点 $t_{i}\in[x_{i-1},x_{i}]$ を選んだ $S(f,P,t)\defeq\sum f(t_{i})\Delta x_{i}$ を**リーマン和**という。
:::

::: lemma 細分とダルブー和 {#calc:refinement keywords="refining a partition decreases the upper sum and increases the lower sum; L(f,P) <= U(f,Q) for all P, Q" index="細分とダルブー和|さいぶんとだるぶーわ"}
1. $P\subset P'$ なら $L(f,P)\le L(f,P')\le U(f,P')\le U(f,P)$。$P'$ が $P$ に $k$ 個の点を加えたものなら、$U(f,P)-U(f,P')\le2Bk|P|$。
2. 任意の分割 $P,Q$ について $L(f,P)\le U(f,Q)$。
:::

::: proof
1：点を 1 つ加えて $[x_{i-1},x_{i}]$ を $[x_{i-1},y]$, $[y,x_{i}]$ に分けると、各部分での上限は $M_{i}$ 以下なので上和は増えず、減少量は $(M_{i}-\sup_{[x_{i-1},y]}f)(y-x_{i-1})+(M_{i}-\sup_{[y,x_{i}]}f)(x_{i}-y)\le2B\Delta x_{i}\le2B|P|$。下和も同様。$k$ 回繰り返す。2：$P\cup Q$ は両方の細分なので $L(f,P)\le L(f,P\cup Q)\le U(f,P\cup Q)\le U(f,Q)$。
:::

::: definition リーマン積分 {#calc:riemann-integrable keywords="upper and lower Riemann integrals; Riemann integrable function; the integral" index="リーマン積分|りーまんせきぶん, 積分可能|せきぶんかのう, 上積分|じょうせきぶん, 下積分|かせきぶん"}
$\overline{\int}f\defeq\inf_{P}U(f,P)$（**上積分**）、$\underline{\int}f\defeq\sup_{P}L(f,P)$（**下積分**）とする（\ref{calc:refinement.2} から $\underline{\int}f\le\overline{\int}f$）。両者が等しいとき $f$ は**リーマン積分可能**といい、その値を $\int_{a}^{b}f=\int_{a}^{b}f(x)\,dx$ と書く。$\int_{b}^{a}f\defeq-\int_{a}^{b}f$、$\int_{a}^{a}f\defeq0$。
:::

::: theorem 積分可能性の判定 {#calc:riemann-criterion keywords="Riemann criterion: f is integrable iff for every eps there is a partition with U - L < eps; Darboux: then U(f,P) - L(f,P) -> 0 as the mesh tends to 0 and Riemann sums converge to the integral; equivalence with Riemann's definition" index="リーマンの判定条件|りーまんのはんていじょうけん, ダルブーの定理（積分）|だるぶーのていりせきぶん"}
有界な $f\colon[a,b]\to\mathbb{R}$ について次は同値。
1. $f$ はリーマン積分可能。
2. 任意の $\varepsilon>0$ に、$U(f,P)-L(f,P)<\varepsilon$ となる分割 $P$ がある。
3. 任意の $\varepsilon>0$ に $\delta>0$ があって、$|P|<\delta$ なら $U(f,P)-L(f,P)<\varepsilon$。
4. （**リーマンの定義**）ある $I$ について、任意の $\varepsilon>0$ に $\delta>0$ があって、$|P|<\delta$ なら代表点のとり方によらず $|S(f,P,t)-I|<\varepsilon$。

このとき 4 の $I$ は $\int_{a}^{b}f$ に等しい。
:::

::: proof
**Step 1（1 ⇔ 2）.** 1 なら $U(f,P_{1})<\int f+\frac\varepsilon2$, $L(f,P_{2})>\int f-\frac\varepsilon2$ となる $P_{1},P_{2}$ をとり、$P\defeq P_{1}\cup P_{2}$ で \ref{calc:refinement}。2 なら $\overline{\int}f-\underline{\int}f\le U(f,P)-L(f,P)<\varepsilon$。

**Step 2（2 ⇒ 3）.** $U(f,P_{0})-L(f,P_{0})<\frac\varepsilon2$ となる $P_{0}$（分点が $k$ 個の内部の点）をとり、$\delta\defeq\frac{\varepsilon}{8Bk+1}$ とする。$|P|<\delta$ なら、$P'\defeq P\cup P_{0}$ は $P$ に高々 $k$ 点加えたものなので、\ref{calc:refinement.1} から $U(f,P)-U(f,P')\le2Bk\delta$, $L(f,P')-L(f,P)\le2Bk\delta$。よって
$$
U(f,P)-L(f,P)\le U(f,P')-L(f,P')+4Bk\delta\le U(f,P_{0})-L(f,P_{0})+\frac{\varepsilon}{2}<\varepsilon.
$$

**Step 3（3 ⇒ 4）.** 1 も成り立つ（3 ⇒ 2 ⇒ 1）ので $I\defeq\int f$ とする。$L(f,P)\le S(f,P,t)\le U(f,P)$ と $L(f,P)\le I\le U(f,P)$ から $|S-I|\le U-L<\varepsilon$。

**Step 4（4 ⇒ 2）.** $|P|<\delta$ の分割を 1 つとる（等分割）。各小区間で $f(t_{i})>M_{i}-\frac{\varepsilon}{b-a}$ となる代表点をとると $S(f,P,t)>U(f,P)-\varepsilon$ なので $U(f,P)\le I+2\varepsilon$。同様に $L(f,P)\ge I-2\varepsilon$。よって $U-L\le4\varepsilon$。代表点は有限個なので選択公理は要らない。

**Step 5.** Step 3 から 4 の $I$ は $\int f$。
:::

::: theorem 積分可能な関数 {#calc:integrable-classes keywords="continuous functions, monotone functions, bounded functions with finitely many discontinuities are Riemann integrable; phi o f with phi continuous; products and absolute values" index="積分可能な関数|せきぶんかのうなかんすう"}
1. $[a,b]$ 上の連続関数は積分可能。
2. $[a,b]$ 上の単調関数は積分可能。
3. 有界で不連続点が有限個の関数は積分可能。
4. $f$ が積分可能で $|f|\le B$、$\varphi$ が $[-B,B]$ で連続なら、$\varphi\circ f$ は積分可能。とくに $|f|$, $f^{2}$、積分可能な $f,g$ の積 $fg=\frac14((f+g)^{2}-(f-g)^{2})$ は積分可能。
:::

::: proof
**1.** ハイネ–カントールの定理（\ref{calc:interval-theorems.3}）から、$|x-y|<\delta$ なら $|f(x)-f(y)|<\frac{\varepsilon}{b-a}$。$|P|<\delta$ なら最大値の定理で $M_{i}-m_{i}<\frac{\varepsilon}{b-a}$ で、$U-L<\varepsilon$。

**2.** 増加なら $M_{i}=f(x_{i})$, $m_{i}=f(x_{i-1})$。等分割 $P_{n}$ で $U-L=\frac{b-a}{n}\sum(f(x_{i})-f(x_{i-1}))=\frac{(b-a)(f(b)-f(a))}{n}\to0$。

**3.** 不連続点 $c_{1},\dots,c_{k}$ のそれぞれを幅 $\eta$ の小区間で囲み（$2Bk\eta\cdot2<\frac\varepsilon2$）、残りの有限個の閉区間では $f$ は連続なので 1 の議論で $U-L$ を $\frac\varepsilon2$ 未満にする。合わせた分割で $U-L<\varepsilon$。

**4.** $\varphi$ は一様連続で、$|s-t|<\eta$ なら $|\varphi(s)-\varphi(t)|<\varepsilon$（$\eta<\varepsilon$ ととる）。$U(f,P)-L(f,P)<\eta^{2}$ となる $P$ をとり、小区間を $M_{i}-m_{i}<\eta$ のもの（良い区間）とそれ以外に分ける。良い区間では $\varphi\circ f$ の振れ幅は $\varepsilon$ 未満。悪い区間の長さの和は $\frac{1}{\eta}\sum(M_{i}-m_{i})\Delta x_{i}<\eta$ で、そこでの振れ幅は $2\sup|\varphi|$ 以下。よって $U(\varphi\circ f,P)-L(\varphi\circ f,P)<\varepsilon(b-a)+2\sup|\varphi|\,\eta$。
:::

::: proposition 積分の基本性質 {#calc:integral-properties keywords="linearity, monotonicity, |int f| <= int |f|, additivity over adjacent intervals, mean value theorem for integrals" index="積分の基本性質|せきぶんのきほんせいしつ, 積分の平均値の定理|せきぶんのへいきんちのていり"}
$f,g$ を $[a,b]$ で積分可能とする。
1. **（線形性）** $\int(f+g)=\int f+\int g$、$\int cf=c\int f$。
2. **（単調性）** $f\le g$ なら $\int f\le\int g$。$\bigl|\int f\bigr|\le\int|f|$。
3. **（区間についての加法性）** $a<c<b$ なら、$f$ は $[a,c]$, $[c,b]$ で積分可能で $\int_{a}^{b}f=\int_{a}^{c}f+\int_{c}^{b}f$。逆に両方で積分可能なら $[a,b]$ で積分可能。
4. **（平均値の定理）** $f$ が連続なら、$\int_{a}^{b}f=f(\xi)(b-a)$ となる $\xi\in[a,b]$ がある。
:::

::: proof
1：リーマンの定義（\ref{calc:riemann-criterion.4}）で、リーマン和は線形なので極限も線形。2：$S(f,P,t)\le S(g,P,t)$ と極限。$-|f|\le f\le|f|$ と 4 の $|f|$ の積分可能性（\ref{calc:integrable-classes}）。3：$c$ を分点に含む分割では $U$, $L$ が $[a,c]$ と $[c,b]$ の部分の和になる（\ref{calc:refinement} から、$c$ を加えても $U-L$ は増えない）。4：$m\le f\le M$（最小・最大値）から $m(b-a)\le\int f\le M(b-a)$ で、中間値の定理。
:::

## ルベーグの判定法 {#calc:sec-ri-lebesgue}

::: definition 測度 0 の集合と振動 {#calc:measure-zero keywords="set of measure zero: covered by countably many intervals of arbitrarily small total length; oscillation of a function at a point" index="測度 0 の集合|そくどぜろのしゅうごう, 零集合|れいしゅうごう, 振動|しんどう"}
1. $E\subset\mathbb{R}$ が**測度 $0$** とは、任意の $\varepsilon>0$ に、開区間の列 $(I_{k})$ で $E\subset\bigcup_{k}I_{k}$, $\sum_{k}|I_{k}|<\varepsilon$ となるものがあることをいう。
2. $f$ の $x$ での**振動**を $\omega_{f}(x)\defeq\lim_{\delta\to0+}\sup\{|f(s)-f(t)|\mid s,t\in(x-\delta,x+\delta)\cap[a,b]\}$ とする。$f$ が $x$ で連続 $\iff$ $\omega_{f}(x)=0$。
:::

::: theorem ルベーグの判定法 {#calc:lebesgue-criterion keywords="Lebesgue's criterion: a bounded function on [a,b] is Riemann integrable iff its set of discontinuities has measure zero; proof without the axiom of choice using equal partitions" index="ルベーグの判定法|るべーぐのはんていほう, リーマン積分可能性の特徴づけ|りーまんせきぶんかのうせいのとくちょうづけ" refname="ルベーグの判定法"}
有界な $f\colon[a,b]\to\mathbb{R}$ がリーマン積分可能 $\iff$ $f$ の不連続点の集合 $D$ が測度 $0$。（$\ZF$ で証明できる。）
:::

::: proof
$D_{k}\defeq\{x\mid\omega_{f}(x)\ge\frac1k\}$ とおくと $D=\bigcup_{k\ge1}D_{k}$。$D_{k}$ は閉集合（$\omega_{f}(x)<\frac1k$ なら $x$ のある近傍の各点 $y$ で $\omega_{f}(y)<\frac1k$）。

**Step 1（⇒）.** $P_{n}$ を $[a,b]$ の $n$ 等分割とする。\ref{calc:riemann-criterion.3} から $U(f,P_{n})-L(f,P_{n})\to0$。$\varepsilon>0$ と $k$ について、$U(f,P_{n})-L(f,P_{n})<\frac{\varepsilon}{2k}\cdot2^{-k}$ となる最小の $n=n(k)$ をとる。$D_{k}$ の点で $P_{n}$ の分点でないものは、ある小区間の内部にあり、その小区間で $M_{i}-m_{i}\ge\frac1k$。そのような小区間の長さの和は $k\sum(M_{i}-m_{i})\Delta x_{i}<\frac\varepsilon2\cdot2^{-k}$。分点（$n+1$ 個）は、長さの和が $\frac\varepsilon2\cdot2^{-k}$ の小さな開区間で覆う（中心と長さを分点と $n$ から決める）。こうして各 $k$ について $D_{k}$ を長さの和 $<\varepsilon2^{-k}$ の有限個の開区間で覆う族が、$k$ から一意に決まる。全部を並べると $D$ は長さの和 $<\varepsilon$ の可算個の開区間で覆える。

**Step 2（⇐）.** $\varepsilon>0$ とし、$k$ を $\frac{b-a}{k}<\frac\varepsilon2$ ととる。$D_{k}\subset D$ は長さの和 $<\eta$ の開区間の列で覆え、$D_{k}$ はコンパクト (HB) なので有限個 $J_{1},\dots,J_{r}$ で覆える。$[a,b]\setminus\bigcup J_{j}$ の各点 $x$ では $\omega_{f}(x)<\frac1k$ なので、$x$ の近傍で $f$ の振れ幅は $\frac1k$ 未満。$[a,b]\setminus\bigcup J_{j}$ は有限個の閉区間の和で、コンパクト性（ルベーグ数）から、それを十分細かく分けた各小区間で $M_{i}-m_{i}<\frac1k$。$J_{j}$ の端点と合わせた分割 $P$ について
$$
U(f,P)-L(f,P)<2B\eta+\frac1k(b-a)<2B\eta+\frac\varepsilon2,
$$
$\eta\defeq\frac{\varepsilon}{4B+1}$ とすれば $<\varepsilon$。

::: hypcheck
- **選択公理を使わない工夫**：Step 1 で、各 $D_{k}$ の被覆を「条件を満たす最小の $n$ の等分割」から作った。一般の「測度 $0$ の集合の可算和は測度 $0$」は、各集合の被覆を同時に選ぶので可算選択公理を使う（選択公理なしでは成り立たないモデルがあることが知られている）が、ここではその一般論を使わない。
- Step 2 では、与えられた被覆（定義から 1 つ存在する）から有限部分被覆をとるだけなので、選択は要らない（有限個の選択）。
- **有界性**：$B$ による評価に使った。
:::
:::

::: example
1. ディリクレ関数 $\mathbf{1}_{\mathbb{Q}}$ は $[0,1]$ のすべての点で不連続で、$[0,1]$ は測度 $0$ でない（問題 \ref{calc:prob-ri-interval-not-null}）ので積分可能でない。実際、どの分割でも $U=1$, $L=0$。
2. トマエ関数（\ref{calc:prob-co-thomae}）の不連続点は有理数全体で、可算集合は測度 $0$（$k$ 番目の点を長さ $\varepsilon2^{-k-1}$ の区間で覆う。並べ方は \ref{calc:page-real-construction} の固定した単射 $e$ による）。よって積分可能で、すべての下和が $0$ なので積分は $0$。
:::

::: supplement
**一般化と関連する事実.**
- リーマン積分可能な関数はルベーグ積分可能で、積分は一致する（\ref[測度論]{meas:lebesgue-measure} で扱う予定）。広義積分は \ref[微分積分学の基本定理]{calc:page-fundamental-theorem} で扱う。
- 積分の値を、分割の細分を有向集合とするネットの極限（\ref{calc:riemann-criterion.2} と同値）として見ることもできる。
- リーマン–スティルチェス積分 $\int f\,d\alpha$（$\alpha$ は増加関数）は、$\Delta x_{i}$ を $\Delta\alpha_{i}$ に置き換えて同じ理論が展開できる（\ref[微分積分学の基本定理]{calc:page-fundamental-theorem}）。

**前提を変えると.** 有界性を外すと、ダルブー和が定義できない。非有界な関数の積分は広義積分として極限で定義する。

**高い視点.** リーマン積分は「関数のグラフの下の面積を、長方形の和で上下から挟む」定義で、積分可能性は「挟み撃ちが成功する」ことである。ルベーグの判定法は、挟み撃ちを妨げるのが不連続点の集合の「長さ」だけであることを示す。比喩で言えば、リーマン積分は「縦長の短冊で面積を測る」方法で、短冊の中で関数が暴れる場所（不連続点）が、全体として長さ $0$ の砂粒程度しかなければ測定は成功する。
:::

## 問題 {#calc:sec-ri-problems}

::: problem {#calc:prob-ri-interval-not-null}
区間 $[0,1]$ は測度 $0$ でないことを示せ。
:::

::: solution
**主張：有限個の開区間 $(c_{j},d_{j})$（$j=1,\dots,r$）が $[\alpha,\beta]$ を覆えば $\sum_{j}(d_{j}-c_{j})>\beta-\alpha$。** $r$ についての帰納法。$\alpha$ を含む区間を $(c,d)$ とする（$c<\alpha<d$）。$d>\beta$ なら、その長さだけで $d-c>\beta-\alpha$。$d\le\beta$ なら、$[d,\beta]$ は $(c,d)$ と交わらないので残りの $r-1$ 個で覆われ、帰納法の仮定から残りの長さの和 $>\beta-d$。合計 $>(d-c)+(\beta-d)>\beta-\alpha$。

$[0,1]$ が測度 $0$ なら、長さの和 $<1$ の開区間の列で覆え、(HB) から有限個で覆えるので、主張に反する。
:::

::: problem {#calc:prob-ri-square}
$\int_{0}^{1}x^{2}\,dx=\frac13$ を、等分割のダルブー和から直接示せ。
:::

::: solution
$n$ 等分割で $x^{2}$ は増加なので $U=\sum_{i=1}^{n}\frac{i^{2}}{n^{3}}=\frac{(n+1)(2n+1)}{6n^{2}}$、$L=\sum_{i=0}^{n-1}\frac{i^{2}}{n^{3}}=\frac{(n-1)(2n-1)}{6n^{2}}$。どちらも $\frac13$ に収束し、$L\le\underline\int\le\overline\int\le U$ なので積分は $\frac13$。
:::

::: problem {#calc:prob-ri-composition}
リーマン積分可能な二つの関数の合成は、積分可能とは限らないことを示せ（ヒント：トマエ関数 $T$ と $\psi\defeq\mathbf{1}_{(0,1]}$）。
:::

::: solution
$\psi$ は不連続点が 1 個の有界関数なので積分可能（\ref{calc:integrable-classes.3}）、$T$ も積分可能（上の例）。$\psi\circ T$ は有理数で $1$（$T>0$）、無理数で $0$ なのでディリクレ関数で、積分可能でない。\ref{calc:integrable-classes.4} で外側の関数に連続性を仮定する理由である。
:::
