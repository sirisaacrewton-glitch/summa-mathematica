# 演習：ベクトル解析 {#vec:page-exercises-analysis keywords="exercises, Vector Analysis"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。

## 記法と定義の確認 {#vec:sec-exanalysis-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 曲線と線積分 {#vec:sec-cl-exercises}

対応するページ：\ref{vec:page-curves-line-integrals}

::: problem ★ 基本：曲線の長さ {#vec:ex-cl-1}
らせん $\gamma(t)=(\cos t,\sin t,t)$（$0\le t\le2\pi$）の長さを求めよ。
:::

::: solution
$\lvert\gamma'(t)\rvert=\sqrt{\sin^{2}t+\cos^{2}t+1}=\sqrt2$ なので長さ $2\sqrt2\pi$。
:::

::: problem ★ 基本：保存場の線積分 {#vec:ex-cl-2}
$F=(y,x)$ に沿った、$(0,0)$ から $(1,2)$ への任意の滑らかな道の線積分を求めよ。
:::

::: solution
$F=\nabla(xy)$ なので、道によらず $xy\big|_{(0,0)}^{(1,2)}=2$。
:::

::: problem ★★ 標準：保存場でない例 {#vec:ex-cl-3}
$F=(-y,x)$ の単位円周（反時計回り）上の線積分を求め、$F$ が保存場でないことを示せ。
:::

::: solution
$\int_{0}^{2\pi}(\sin^{2}t+\cos^{2}t)\,dt=2\pi\neq0$。保存場なら閉曲線上の線積分は $0$。
:::

::: problem ★★★ 発展：曲率 {#vec:ex-cl-4}
単位速度の曲線 $\gamma$ について曲率を $\kappa=\lvert\gamma''\rvert$ と定める。半径 $a$ の円の曲率が $\frac1a$ であることと、一般の正則曲線では $\kappa=\frac{\lvert\gamma'\times\gamma''\rvert}{\lvert\gamma'\rvert^{3}}$ であることを示せ。
:::

::: solution
$\gamma(s)=a(\cos\frac sa,\sin\frac sa,0)$ で $\lvert\gamma''\rvert=\frac1a$。一般には弧長 $s$ で再パラメータ化し、$\frac{d}{dt}=\lvert\gamma'\rvert\frac{d}{ds}$ から $\gamma''=\lvert\gamma'\rvert^{2}T'+(\cdots)T$（$T$ は単位接ベクトル）。$\gamma'\times\gamma''=\lvert\gamma'\rvert^{3}T\times T'$ で、$T\perp T'$ なので長さは $\lvert\gamma'\rvert^{3}\kappa$。
:::

## パラメータ曲面と面積分 {#vec:sec-si-exercises}

対応するページ：\ref{vec:page-surface-integrals}

::: problem ★ 基本：球面の面積 {#vec:ex-si-1}
半径 $a$ の球面の面積を、パラメータ表示 $(a\sin\varphi\cos\theta,a\sin\varphi\sin\theta,a\cos\varphi)$ で計算せよ。
:::

::: solution
$\lvert\Phi_{\varphi}\times\Phi_{\theta}\rvert=a^{2}\sin\varphi$ なので $\int_{0}^{2\pi}\int_{0}^{\pi}a^{2}\sin\varphi\,d\varphi\,d\theta=4\pi a^{2}$。
:::

::: problem ★ 基本：流束 {#vec:ex-si-2}
$F=(x,y,z)$ の、単位球面（外向き）を通る流束を求めよ。
:::

::: solution
球面上で外向き単位法線は $n=(x,y,z)$ なので $F\cdot n=1$、流束は面積 $4\pi$。
:::

::: problem ★★ 標準：グラフの曲面積 {#vec:ex-si-3}
$z=x^{2}+y^{2}$（$x^{2}+y^{2}\le1$）の曲面積を求めよ。
:::

::: solution
$\sqrt{1+z_{x}^{2}+z_{y}^{2}}=\sqrt{1+4r^{2}}$。極座標で $\int_{0}^{2\pi}\int_{0}^{1}\sqrt{1+4r^{2}}\,r\,dr\,d\theta=\frac{\pi(5\sqrt5-1)}{6}$。
:::

::: problem ★★★ 発展：回転面 {#vec:ex-si-4}
$xz$ 平面の曲線 $x=f(z)>0$（$a\le z\le b$）を $z$ 軸のまわりに回転した曲面の面積が $2\pi\int_{a}^{b}f(z)\sqrt{1+f'(z)^{2}}\,dz$ であることを示し、球面の帯の面積が高さだけで決まること（アルキメデス）を導け。
:::

::: solution
パラメータ $(f(z)\cos\theta,f(z)\sin\theta,z)$ で $\lvert\Phi_{z}\times\Phi_{\theta}\rvert=f\sqrt{1+f'^{2}}$。球 $f=\sqrt{a^{2}-z^{2}}$ では $f\sqrt{1+f'^{2}}=a$ なので、帯 $z_{1}\le z\le z_{2}$ の面積は $2\pi a(z_{2}-z_{1})$。
:::

## グリーン・ガウス・ストークスの定理 {#vec:sec-it-exercises}

対応するページ：\ref{vec:page-integral-theorems}

::: problem ★ 基本：グリーンの定理で面積 {#vec:ex-it-1}
楕円 $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}\le1$ の面積を $\frac12\oint(x\,dy-y\,dx)$ で求めよ。
:::

::: solution
$(a\cos t,b\sin t)$ で $\frac12\int_{0}^{2\pi}(ab\cos^{2}t+ab\sin^{2}t)\,dt=\pi ab$。
:::

::: problem ★ 基本：発散定理 {#vec:ex-it-2}
$F=(x,y,z)$ の、立方体 $[0,1]^{3}$ の表面（外向き）を通る流束を、発散定理と直接計算の両方で求めよ。
:::

::: solution
$\mathrm{div}F=3$ なので体積分は $3$。直接計算：$x=1$ の面で $F\cdot n=1$、$x=0$ の面で $0$、他の面も同様で合計 $3$。
:::

::: problem ★★ 標準：ストークスの定理 {#vec:ex-it-3}
$F=(-y,x,0)$ について、単位円板（$z=0$、上向き）での $\int\mathrm{rot}F\cdot n\,dS$ と、境界の円周上の線積分を比べよ。
:::

::: solution
$\mathrm{rot}F=(0,0,2)$ なので面積分は $2\pi$。円周上の線積分も $2\pi$（\ref{vec:ex-cl-3}）。
:::

::: problem ★★★ 発展：ガウスの法則 {#vec:ex-it-4}
$F=\frac{x}{\lvert x\rvert^{3}}$ について、原点を囲む任意の（滑らかな境界をもつ）有界領域の境界を通る流束が $4\pi$ であることを示せ。
:::

::: solution
$\mathrm{div}F=0$（$x\neq0$）。領域から原点中心の小さな球を除いた部分に発散定理を使うと、外側の境界と小球面の流束は等しい。小球面（半径 $\varepsilon$）では $F\cdot n=\varepsilon^{-2}$ で面積 $4\pi\varepsilon^{2}$、流束 $4\pi$。
:::
