# 大域的な理論（Global Theory of Holomorphic Functions）

ミッタク–レフラーの定理とワイエルシュトラスの因数分解定理（sin の積表示・複素ガンマ関数）、一次分数変換と自己同型群（シュワルツの補題）、正規族とモンテルの定理、リーマンの写像定理、解析接続とモノドロミー定理、楕円関数とワイエルシュトラスの ℘ 関数（杉浦『解析入門 II』第 IX 章 §10〜§14 を参考）。

<p class="mn-msc">MSC2020: 30A</p>

## 前提知識

- [複素解析 › 留数と調和関数](../../../04-analysis/02-complex-analysis/02-residues/index.html)（全体、5 ページ）：留数定理・偏角の原理・単連結領域の対数
- [一般位相 › 関数空間の位相](../../../05-geometry-topology/01-general-topology/03-function-spaces/index.html)（全体、5 ページ）：アスコリ–アルツェラの定理
