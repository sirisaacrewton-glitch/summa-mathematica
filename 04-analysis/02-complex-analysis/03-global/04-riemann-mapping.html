# リーマンの写像定理 {#cx:page-riemann-mapping keywords="Riemann mapping theorem, conformal equivalence of simply connected domains with the unit disk, existence via extremal problem and normal families, Koebe square root trick, uniqueness with normalization, characterizations of simply connected plane domains, holomorphic square roots, homeomorphic to the disk, explicit conformal maps"}

**リーマンの写像定理**は、平面全体でない単連結な領域は、すべて単位円板と双正則に写り合うことを主張する。境界がどんなに入り組んでいても（フラクタルでも）、領域の内部は複素解析の意味で円板と区別がつかない。証明は、条件を満たす単射な写像のうち、基準点での微分係数の絶対値を最大にするものを探す、という極値問題として行う。その存在はモンテルの定理（コンパクト性）、極限が単射であることはフルヴィッツの定理、それが全射であることはシュワルツの補題と平方根をとる操作（ケーベの方法）で示す。証明で実際に使う領域の性質は「零点をもたない正則関数が正則な平方根をもつ」ことだけなので、その帰結として、平面の領域の単連結性のいろいろな言い換えが同値であることも得られる。

## 記法と定義の確認 {#cx:sec-rm-notation}

::: notation
- 単位円板 $\mathbb{D}$、ブラシュケ因子 $\varphi_{a}(z)=\frac{z-a}{1-\bar az}$ とその性質 \ref{cx:blaschke-factor}, \ref{cx:blaschke-properties}、シュワルツの補題 \tref{cx:schwarz-lemma}、単位円板の自己同型群 \ref{cx:aut-disk}。
- 正規族とモンテルの定理 \ref{cx:normal-family}, \tref{cx:montel}、単射な関数の極限 \ref{cx:hurwitz-injective}、ワイエルシュトラスの収束定理 \tref{cx:weierstrass-convergence}、コーシーの評価式 \ref{cx:cauchy-estimates}、開写像定理 \tref{cx:open-mapping}、双正則写像 \ref{cx:local-inverse}。
- 単連結領域で回転数が消える \ref{cx:simply-connected-homologous}、正則な対数と冪根 \ref{cx:holomorphic-log}、原始関数の存在 \ref{cx:primitive-existence}、ホモロジー版のコーシーの定理 \tref{cx:cauchy-homology}。
- 位相：単連結（\ref{at:fundamental-group} の 3）、同相写像は基本群の同型を誘導する \ref{at:induced-homomorphism}、可縮な空間は単連結 \ref{at:pi1-homotopy-invariance}。
- **公理系**：$\ZF$ に**可算選択公理**を加えて行う（\ref{cx:riemann-mapping} の Step 3 で、上限に近づく関数の列を選ぶため）。それ以外では選択公理を使わない。
:::

## 写像定理 {#cx:sec-rm-theorem}

::: theorem リーマンの写像定理 {#cx:riemann-mapping keywords="Riemann mapping theorem: a domain U != C in which every nonvanishing holomorphic function has a holomorphic square root (e.g. a simply connected domain) is biholomorphic to the unit disk; uniqueness with f(z0) = 0, f'(z0) > 0" index="リーマンの写像定理|りーまんのしゃぞうていり" refname="リーマンの写像定理"}
$U\subsetneq\C$ を領域とし、$U$ で零点をもたない任意の正則関数が $U$ で正則な平方根をもつとする（とくに $U$ が単連結なら、\ref{cx:holomorphic-log} からこの条件が成り立つ）。$z_{0}\in U$ について、双正則写像 $f\colon U\to\mathbb{D}$ で $f(z_{0})=0$, $f'(z_{0})>0$ を満たすものがただ一つ存在する。
:::

::: intuition
$U$ から $\mathbb{D}$ への単射な正則写像で $z_{0}$ を $0$ に写すもののうち、$z_{0}$ のまわりを最も大きく引き伸ばす（$|f'(z_{0})|$ が最大の）ものを選ぶ。もしその像が $\mathbb{D}$ の一部 $w$ を取りこぼしていたら、$w$ を $0$ に移して平方根をとると、取りこぼしを埋めるように像が広がり、さらに引き伸ばせてしまう。よって最大のものは全射である。
:::

::: proof
**Step 1（族 $\mathcal{F}$）.** $\mathcal{F}\defeq\{f\in\mathcal{O}(U)\mid f\text{ は単射},\ |f|<1,\ f(z_{0})=0\}$ とおく。

**Step 2（$\mathcal{F}\neq\varnothing$）.** $a\in\C\setminus U$ をとる。$z-a$ は $U$ で零点をもたないので、仮定から $h^{2}=z-a$ となる正則な $h$ がある。$h$ は単射（$h(z_{1})=h(z_{2})$ なら平方して $z_{1}=z_{2}$）で、さらに $h(z_{1})=-h(z_{2})$ となることもない（平方して $z_{1}=z_{2}$、すると $h(z_{1})=0$ で $z_{1}-a=0$ となり $a\notin U$ に反する）。開写像定理から $h(U)$ は開集合で、ある $\rho>0$ について $D(h(z_{0}),\rho)\subset h(U)$。したがって $D(-h(z_{0}),\rho)$ は $h(U)$ と交わらない（交われば $h(z_{1})=-h(z_{2})$ となる点がある）。すなわち $U$ 上で $|h(z)+h(z_{0})|\ge\rho$。$g\defeq\frac{\rho}{h+h(z_{0})}$ は単射な正則関数で $|g|\le1$。$g$ は定数でないので、開写像定理から $g(U)$ は開集合で、閉円板に含まれる開集合なので $|g|<1$。$f_{0}\defeq\varphi_{g(z_{0})}\circ g$ とおくと $f_{0}\in\mathcal{F}$。

**Step 3（極値問題の解）.** $s\defeq\sup_{f\in\mathcal{F}}|f'(z_{0})|$ とする。$\overline{D}(z_{0},r)\subset U$ をとると、コーシーの評価式から $|f'(z_{0})|\le\frac1r$ なので $s<\infty$。単射な正則関数の微分は $0$ にならない（\ref{cx:local-inverse.2}）ので $s\ge|f_{0}'(z_{0})|>0$。各 $n$ について $|f_{n}'(z_{0})|>s-\frac1n$ となる $f_{n}\in\mathcal{F}$ を選ぶ（ここで可算選択を使う）。$\mathcal{F}$ は $|f|<1$ なので局所有界、モンテルの定理から広義一様収束する部分列があり、その極限を $f$ とする。ワイエルシュトラスの収束定理から $f$ は正則で $|f'(z_{0})|=s>0$、とくに定数でないので、\ref{cx:hurwitz-injective} から単射。$|f|\le1$ と開写像定理から $|f|<1$、$f(z_{0})=0$。よって $f\in\mathcal{F}$ で $|f'(z_{0})|=s$。

**Step 4（全射性：ケーベの方法）.** $f(U)\neq\mathbb{D}$ と仮定し、$w\in\mathbb{D}\setminus f(U)$ をとる。$\varphi_{w}\circ f$ は $U$ で零点をもたないので、仮定から $h^{2}=\varphi_{w}\circ f$ となる正則な $h$ がある。$h$ は単射（$\varphi_{w}\circ f$ が単射なので）で $|h|<1$。$b\defeq h(z_{0})$ とおき、$G\defeq\varphi_{b}\circ h\in\mathcal{F}$。一方 $f=\varphi_{-w}\circ h^{2}=\psi\circ G$、ここで
$$
\psi(\zeta)\defeq\varphi_{-w}\bigl((\varphi_{-b}(\zeta))^{2}\bigr)
$$
は $\mathbb{D}$ から $\mathbb{D}$ への正則写像で、$\psi(0)=\varphi_{-w}(b^{2})=\varphi_{-w}(\varphi_{w}(f(z_{0})))=0$（$b^{2}=h(z_{0})^{2}=\varphi_{w}(0)=-w$）。$\psi$ は単射でない（平方する写像が $\mathbb{D}$ 上で単射でないので）から回転ではなく、シュワルツの補題から $|\psi'(0)|<1$。連鎖律から $f'(z_{0})=\psi'(0)G'(z_{0})$ で、$|G'(z_{0})|=\frac{|f'(z_{0})|}{|\psi'(0)|}>s$。$G\in\mathcal{F}$ なので $s$ の定義に反する。よって $f(U)=\mathbb{D}$。

**Step 5（正規化）.** $f'(z_{0})=|f'(z_{0})|e^{i\theta}$ とし、$e^{-i\theta}f$ をとれば $f'(z_{0})>0$。

**Step 6（一意性）.** $f_{1},f_{2}$ が条件を満たせば、$f_{2}\circ f_{1}^{-1}\in\operatorname{Aut}(\mathbb{D})$ は $0$ を固定するので回転 $\lambda z$（\ref{cx:aut-disk}）、$0$ での微分 $\frac{f_{2}'(z_{0})}{f_{1}'(z_{0})}>0$ から $\lambda=1$。

::: hypcheck
- **前提「$U\neq\C$」**：Step 2 で $a\notin U$ をとるのに使った。$\C$ は $\mathbb{D}$ と双正則でない（双正則写像 $\C\to\mathbb{D}$ は有界な整関数で、リウヴィルの定理から定数）。
- **前提「平方根の存在」**：Step 2（$h^{2}=z-a$）と Step 4（$h^{2}=\varphi_{w}\circ f$）で使った。これ以外に $U$ の位相的な性質は使っていない。
- **可算選択**：Step 3 で $f_{n}$ を選ぶのに使った。
- Step 4 の $\psi$ が単射でないこと：$(\varphi_{-b}(\zeta))^{2}$ は、$\varphi_{-b}(\zeta)=\pm\eta$ となる 2 点で同じ値をとる。
:::
:::

::: supplement
**歴史.** リーマンは 1851 年の学位論文でこの主張を述べたが、その証明はディリクレの原理（境界値問題の解を変分法で求める方法）に頼っていて、当時の水準では完全ではなかったとされる。正規族による現在の形の証明は、フェイェールとリースによるものとされ、ケーベの平方根の工夫と合わせて標準的な証明になっている。

**境界の振る舞い.** 写像定理は内部の対応しか主張しない。境界がジョルダン曲線なら写像は閉円板の同相に延びる（カラテオドリの定理。未収録）。

**一意化定理.** 単連結なリーマン面は、$\mathbb{D}$, $\C$, $\widehat{\C}$ のどれかと双正則である（ケーベとポアンカレの一意化定理。未収録）。写像定理はその平面の領域の場合である。
:::

## 単連結性の言い換え {#cx:sec-rm-simply-connected}

::: theorem 平面の領域の単連結性 {#cx:simply-connected-equivalents keywords="for a plane domain the following are equivalent: simply connected; every closed curve has winding number zero about points outside; Cauchy's theorem holds; every holomorphic function has a primitive; nonvanishing functions have logarithms; nonvanishing functions have square roots; conformally equivalent to the disk or the plane; homeomorphic to the disk" index="単連結性の言い換え|たんれんけつせいのいいかえ"}
領域 $U\subset\C$ について次は同値である。
1. $U$ は単連結である。
2. $U$ 内の任意の閉曲線 $\gamma$ と $a\notin U$ について $n(\gamma,a)=0$。
3. $U$ で正則な任意の $f$ と $U$ 内の任意の閉曲線 $\gamma$ について $\oint_{\gamma}f\,dz=0$。
4. $U$ で正則な任意の関数は原始関数をもつ。
5. $U$ で零点をもたない任意の正則関数は正則な対数をもつ。
6. $U$ で零点をもたない任意の正則関数は正則な平方根をもつ。
7. $U=\C$ であるか、$U$ は $\mathbb{D}$ と双正則である。
8. $U$ は $\mathbb{D}$ と同相である。
:::

::: proof
**1 ⇒ 2.** \ref{cx:simply-connected-homologous}。

**2 ⇒ 3.** \ref{cx:cauchy-homology.2}。

**3 ⇒ 4.** \ref{cx:primitive-existence}。

**4 ⇒ 5.** \ref{cx:holomorphic-log} の証明の Step 1・2 は、$\frac{f'}{f}$ が原始関数をもつことだけを使っている。

**5 ⇒ 6.** $g\defeq e^{L/2}$。

**6 ⇒ 7.** $U\neq\C$ なら \ref{cx:riemann-mapping}。

**7 ⇒ 8.** $\C$ は $z\mapsto\frac{z}{1+|z|}$ で $\mathbb{D}$ と同相（逆写像は $w\mapsto\frac{w}{1-|w|}$）。双正則写像は同相写像。

**8 ⇒ 1.** $\mathbb{D}$ は凸なので可縮（$H(z,t)=(1-t)z$）で単連結（\ref{at:pi1-homotopy-invariance}）。同相写像は基本群の同型を誘導する（\ref{at:induced-homomorphism}）ので、$U$ も単連結（弧状連結性も同相で保たれる）。

::: hypcheck
- **選択公理**：6 ⇒ 7 で写像定理を使うので、その部分だけ可算選択を使う。1 ⇒ 6 の各段は $\ZF$ で示されている。
- 2（ホモロジー的な条件）から 1（ホモトピー的な条件）が出ることは、一般の位相空間では成り立たない（基本群が非自明で 1 次ホモロジーが消える空間がある）。平面の開集合ではこれが成り立つことを、複素解析（写像定理）を経由して示したことになる。
:::
:::

## 具体的な等角写像 {#cx:sec-rm-examples}

::: example
1. **帯から円板へ.** 帯 $S\defeq\{0<\operatorname{Im}z<\pi\}$ は $e^{z}$ で上半平面 $\mathbb{H}$ に双正則に写る（$e^{x+iy}=e^{x}e^{iy}$ で、$y\in(0,\pi)$ なら $e^{iy}$ は上半円周の点、$e^{x}$ は正の数全体を動く。単射性は $e^{z}=e^{w}\Rightarrow z-w\in2\pi i\mathbb{Z}$ と帯の幅 $\pi<2\pi$ から）。ケーリー変換 $\frac{w-i}{w+i}$ と合わせて $z\mapsto\frac{e^{z}-i}{e^{z}+i}$ は $S\to\mathbb{D}$ の双正則写像。
2. **四分円から半平面へ.** 第 1 象限 $Q\defeq\{\operatorname{Re}z>0,\operatorname{Im}z>0\}$ は $z^{2}$ で $\mathbb{H}$ に双正則に写る（偏角を 2 倍。$Q$ 上の単射性は $z^{2}=w^{2}\Rightarrow z=\pm w$ と $-w\notin Q$）。
3. **切れ目のある平面.** $\C^{-}=\C\setminus(-\infty,0]$ は $z^{1/2}$（主値）で右半平面に、さらに $-iz$ で $\mathbb{H}$ に写る。$\C^{-}$ は星形で単連結なので、写像定理の通りである。
:::

## 問題 {#cx:sec-rm-problems}

::: problem {#cx:prob-rm-half-disk}
上半円板 $\{|z|<1,\operatorname{Im}z>0\}$ から $\mathbb{D}$ への双正則写像を一つ求めよ。
:::

::: solution
$T(z)\defeq\frac{1+z}{1-z}$ は $-1\mapsto0$, $1\mapsto\infty$, $i\mapsto i$ で、単位円周と実軸を $-1,1$ を通る直交する直線に写す。上半円板は第 1 象限に写る（$z=\frac i2$ で $T=\frac{1+i/2}{1-i/2}=\frac{(1+i/2)^{2}}{5/4}=\frac{3+4i}{5}$ は第 1 象限）。次に $w\mapsto w^{2}$ で $\mathbb{H}$ へ、ケーリー変換で $\mathbb{D}$ へ。合成 $z\mapsto\frac{T(z)^{2}-i}{T(z)^{2}+i}$。
:::

::: problem {#cx:prob-rm-annulus}
円環 $A(0;1,2)$ は $\mathbb{D}$ と双正則か。理由とともに答えよ。
:::

::: solution
双正則でない。双正則なら同相で、$\mathbb{D}$ は単連結なので $A$ も単連結になるが、$A$ の中の円周 $|z|=\frac32$ は $0\notin A$ のまわりの回転数が $1$ で、\ref{cx:simply-connected-equivalents.2} に反する。（さらに、二つの円環 $A(0;1,R)$ と $A(0;1,R')$ は $R=R'$ のときに限り双正則であることが知られている：未収録。）
:::

::: problem {#cx:prob-rm-uniqueness}
$f\colon\mathbb{D}\to\mathbb{D}$ が双正則で $f(\frac12)=\frac12$ かつ $f'(\frac12)>0$ なら、$f$ は恒等写像であることを示せ。
:::

::: solution
$g\defeq\varphi_{1/2}\circ f\circ\varphi_{1/2}^{-1}$ は $0$ を固定する自己同型なので回転 $\lambda z$（\ref{cx:aut-disk}）。$g'(0)=\varphi_{1/2}'(\frac12)f'(\frac12)(\varphi_{1/2}^{-1})'(0)$ で、\ref{cx:blaschke-properties} から $\varphi_{1/2}'(\frac12)=\frac{1}{1-1/4}>0$、$(\varphi_{1/2}^{-1})'(0)=\varphi_{-1/2}'(0)=1-\frac14>0$。よって $\lambda=g'(0)>0$、$|\lambda|=1$ から $\lambda=1$、$f=\mathrm{id}$。
:::
