# 一次分数変換と自己同型群 {#cx:page-mobius keywords="linear fractional transformation, Mobius transformation, PGL(2,C), generalized circles, cross ratio, fixed points, Schwarz lemma, automorphisms of the unit disk, Blaschke factor, automorphisms of the plane, automorphisms of the Riemann sphere, rational maps of degree one, Cayley transform, upper half plane, PSL(2,R)"}

$T(z)=\frac{az+b}{cz+d}$ の形の写像（**一次分数変換**、メビウス変換）は、リーマン球面の上の全単射で、円と直線を円と直線に写し、角度を保つ。このページでは、一次分数変換の基本性質（行列との対応、円の保存、複比）を整えたうえで、正則関数の基本的な領域の**自己同型群**（自分自身への双正則写像の全体）を決定する。中心となる道具は**シュワルツの補題**（単位円板から単位円板への正則写像で原点を止めるものは、原点からの距離を縮める）で、これから単位円板の自己同型はすべて一次分数変換であることが分かる。平面・リーマン球面・上半平面についても同様の決定を行う。

## 記法と定義の確認 {#cx:sec-mb-notation}

::: notation
- リーマン球面 $\widehat{\C}$ と無限遠点 \ref{cx:riemann-sphere}、有理型関数 \ref{cx:meromorphic}、リーマン球面上の有理型関数は有理関数 \ref{cx:meromorphic-sphere-rational}、無限遠点での整関数の分類 \ref{cx:entire-at-infinity}、カゾラーティ–ワイエルシュトラス \tref{cx:casorati-weierstrass}。
- 最大値原理 \tref{cx:maximum-principle}、除去可能特異点定理 \tref{cx:removable-singularity}、開写像定理 \tref{cx:open-mapping}、局所逆関数と双正則写像 \ref{cx:local-inverse}、等角性 \ref{cx:conformal}、一致の定理 \tref{cx:identity-theorem}、偏角の原理 \tref{cx:argument-principle}。
- $\mathbb{D}\defeq D(0,1)$、上半平面 $\mathbb{H}\defeq\{\operatorname{Im}z>0\}$。開集合 $U$ の**自己同型群** $\operatorname{Aut}(U)$ は、$U$ から $U$ への双正則写像（正則な全単射。逆も正則：\ref{cx:local-inverse.2}）全体が合成についてなす群。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 一次分数変換 {#cx:sec-mb-mobius}

::: definition 一次分数変換 {#cx:mobius keywords="linear fractional (Mobius) transformation T(z) = (az+b)/(cz+d), ad - bc != 0, as a bijection of the Riemann sphere; correspondence with matrices" index="一次分数変換|いちじぶんすうへんかん, メビウス変換|めびうすへんかん"}
$a,b,c,d\in\C$、$ad-bc\neq0$ について $T(z)\defeq\frac{az+b}{cz+d}$ を**一次分数変換**という。$\widehat{\C}$ 上の写像として、$c\neq0$ なら $T(-\frac dc)\defeq\infty$, $T(\infty)\defeq\frac ac$、$c=0$ なら $T(\infty)\defeq\infty$ と定める。行列 $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ に $T_{A}$ を対応させる。
:::

::: proposition 一次分数変換の基本性質 {#cx:mobius-basic keywords="composition corresponds to matrix product; T_A = T_B iff B = lambda A; Mobius maps are bijections and homeomorphisms of the sphere, meromorphic on C; generated by translations, rotations-dilations and inversion" index=""}
1. $T_{A}\circ T_{B}=T_{AB}$、$T_{A}^{-1}=T_{A^{-1}}$。$T_{A}=T_{B}$ $\iff$ $B=\lambda A$（$\lambda\in\C\setminus\{0\}$）。したがって一次分数変換の全体は群 $\mathrm{PGL}_{2}(\C)=\mathrm{GL}_{2}(\C)/\C^{\times}$ と同型である。
2. $T_{A}$ は $\widehat{\C}$ の全単射で、同相写像である。$\C$ 上では有理型で、$c\neq0$ なら $-\frac dc$ で 1 位の極をもち、それ以外で正則で $T'(z)=\frac{ad-bc}{(cz+d)^{2}}\neq0$。
3. 任意の一次分数変換は、平行移動 $z\mapsto z+\beta$、回転と拡大 $z\mapsto\alpha z$（$\alpha\neq0$）、反転 $z\mapsto\frac1z$ の合成である。
:::

::: proof
**1.** $T_{B}(z)=\frac{a'z+b'}{c'z+d'}$ を $T_{A}$ に代入して分母を払うと、分子・分母の係数は $AB$ の成分になる（$\infty$ と分母が $0$ になる点の扱いは、$\widehat{\C}$ を同次座標 $[z_{1}:z_{2}]$ で見て $T_{A}[z_{1}:z_{2}]=[az_{1}+bz_{2}:cz_{1}+dz_{2}]$ と書けば行列の作用そのものなので自然に整合する）。$T_{A}=T_{B}$ なら $T_{B^{-1}A}=\mathrm{id}$ で、$\mathrm{id}$ が $0,\infty,1$ を固定することから $B^{-1}A$ はスカラー行列（$0\mapsto0$ で $b=0$、$\infty\mapsto\infty$ で $c=0$、$1\mapsto1$ で $a=d$）。

**2.** 1 から逆写像 $T_{A^{-1}}$ をもつ全単射。連続性：$\C$ のうち極でない点では有理関数として連続。極 $-\frac dc$ では $|T(z)|\to\infty$、$\infty$ の近くでは $T(z)\to\frac ac$（$c\neq0$）または $\infty$（$c=0$）で、$\widehat{\C}$ の位相（\ref{cx:riemann-sphere}）で連続。逆も一次分数変換なので同相。微分は商の微分。

**3.** $c=0$ なら $T(z)=\frac adz+\frac bd$（回転拡大と平行移動）。$c\neq0$ なら $T(z)=\frac ac-\frac{ad-bc}{c}\cdot\frac{1}{cz+d}$ で、$z\mapsto cz+d\mapsto\frac{1}{cz+d}\mapsto\cdots$ と分解できる。
:::

::: proposition 円の保存 {#cx:mobius-circles keywords="Mobius transformations map generalized circles (circles and lines) to generalized circles" index="一般化された円|いっぱんかされたえん"}
$\widehat{\C}$ の**一般化された円**を、円周、および直線に $\infty$ を加えたものとする。一次分数変換は一般化された円を一般化された円に写す。
:::

::: proof
**Step 1（方程式）.** 一般化された円は、$\infty$ を除けば $A|z|^{2}+\bar Bz+B\bar z+C=0$（$A,C\in\R$, $B\in\C$, $|B|^{2}>AC$）の形で書ける集合で、$A=0$ なら直線（このとき $\infty$ を加える）、$A\neq0$ なら中心 $-\frac BA$、半径 $\frac{\sqrt{|B|^{2}-AC}}{|A|}$ の円周。逆も成り立つ（$|z-z_{0}|^{2}=r^{2}$ と直線 $\operatorname{Re}(\bar\beta z)=c$ を展開する）。

**Step 2（生成元）.** 平行移動と回転拡大は円を円、直線を直線に写す。反転 $w=\frac1z$ では、$z=\frac1w$ を代入して $|w|^{2}$ を掛けると $A+\bar B\bar w+Bw+C|w|^{2}=0$ で、同じ形（係数の役割が入れ替わる、判別条件 $|B|^{2}>AC$ も同じ）。$z=0$ と $\infty$ の対応も含めて一般化された円に写る。\ref{cx:mobius-basic.3} から一般の場合。
:::

::: definition 複比 {#cx:cross-ratio keywords="cross ratio (z, z2, z3, z4) = (z - z3)(z2 - z4) / ((z - z4)(z2 - z3)); the unique Mobius map sending z2, z3, z4 to 1, 0, infinity" index="複比|ふくひ, 非調和比|ひちょうわひ"}
相異なる $z_{2},z_{3},z_{4}\in\widehat{\C}$ について
$$
(z,z_{2},z_{3},z_{4})\defeq\frac{(z-z_{3})(z_{2}-z_{4})}{(z-z_{4})(z_{2}-z_{3})}
$$
を**複比**という（$\infty$ を含むときは、その点を含む因子を約して解釈する。たとえば $z_{4}=\infty$ なら $\frac{z-z_{3}}{z_{2}-z_{3}}$）。$z\mapsto(z,z_{2},z_{3},z_{4})$ は $z_{2}\mapsto1$, $z_{3}\mapsto0$, $z_{4}\mapsto\infty$ を満たす一次分数変換である。
:::

::: theorem 三点で決まる {#cx:mobius-three-points keywords="a Mobius transformation is determined by the images of three distinct points; cross ratio is invariant; four points lie on a generalized circle iff their cross ratio is real" index="複比の不変性|ふくひのふへんせい"}
1. 相異なる 3 点 $z_{2},z_{3},z_{4}$ と相異なる 3 点 $w_{2},w_{3},w_{4}$ について、$T(z_{j})=w_{j}$ となる一次分数変換 $T$ がただ一つ存在する。
2. 一次分数変換 $T$ について $(Tz,Tz_{2},Tz_{3},Tz_{4})=(z,z_{2},z_{3},z_{4})$。
3. 相異なる 4 点が同じ一般化された円の上にある $\iff$ 複比が実数。
:::

::: proof
**Step 1（3 点を $1,0,\infty$ に固定する変換）.** $S$ が $1,0,\infty$ を固定するなら $S(z)=\frac{az+b}{cz+d}$ で $S(0)=0\Rightarrow b=0$, $S(\infty)=\infty\Rightarrow c=0$, $S(1)=1\Rightarrow a=d$、よって $S=\mathrm{id}$。

**Step 2（1）.** $S_{z}(z)\defeq(z,z_{2},z_{3},z_{4})$、$S_{w}$ も同様とすると $T\defeq S_{w}^{-1}\circ S_{z}$ が求めるもの。一意性：$T,T'$ がともに条件を満たせば $S_{w}T'T^{-1}S_{w}^{-1}$ は $1,0,\infty$ を固定し、Step 1 から恒等写像。

**Step 3（2）.** $S_{z}\circ T^{-1}$ は $Tz_{2},Tz_{3},Tz_{4}$ を $1,0,\infty$ に写すので、Step 2 の一意性から複比の写像 $w\mapsto(w,Tz_{2},Tz_{3},Tz_{4})$ に等しい。$w=Tz$ を入れる。

**Step 4（3）.** $S\defeq S_{z}$ は $z_{2},z_{3},z_{4}$ を $1,0,\infty$ に写し、\ref{cx:mobius-circles} から $z_{2},z_{3},z_{4}$ を通る一般化された円（3 点を通るものはただ一つ）を、$1,0,\infty$ を通る一般化された円、すなわち $\R\cup\{\infty\}$ に写す。よって $z$ がその円の上 $\iff$ $S(z)\in\R\cup\{\infty\}$。$z\neq z_{4}$ なら $S(z)\neq\infty$ なので、複比が実数。
:::

::: proposition 不動点 {#cx:mobius-fixed-points keywords="a Mobius transformation other than the identity has one or two fixed points in the Riemann sphere" index=""}
恒等写像でない一次分数変換は、$\widehat{\C}$ に 1 個または 2 個の不動点をもつ。
:::

::: proof
$c=0$ なら $\infty$ は不動点で、$\C$ の不動点は $\frac adz+\frac bd=z$ の解で、$a\neq d$ なら 1 個、$a=d$ なら $b\neq0$（恒等でない）で $0$ 個。$c\neq0$ なら $\infty$ は不動点でなく、$cz^{2}+(d-a)z-b=0$ の解で 1 個か 2 個（代数学の基本定理）。いずれにせよ 3 個以上ならば \ref{cx:mobius-three-points} の Step 1 から恒等写像。
:::

## シュワルツの補題と単位円板の自己同型 {#cx:sec-mb-disk}

::: theorem シュワルツの補題 {#cx:schwarz-lemma keywords="Schwarz lemma: a holomorphic self-map of the unit disk fixing 0 satisfies |f(z)| <= |z| and |f'(0)| <= 1, with equality only for rotations" index="シュワルツの補題|しゅわるつのほだい" refname="シュワルツの補題"}
$f\colon\mathbb{D}\to\mathbb{D}$ が正則で $f(0)=0$ なら、
1. すべての $z\in\mathbb{D}$ で $|f(z)|\le|z|$、また $|f'(0)|\le1$。
2. ある $z_{0}\neq0$ で $|f(z_{0})|=|z_{0}|$ となるか、$|f'(0)|=1$ なら、$|\lambda|=1$ の定数 $\lambda$ について $f(z)=\lambda z$。
:::

::: proof
**Step 1.** $g(z)\defeq\frac{f(z)}{z}$（$z\neq0$）、$g(0)\defeq f'(0)$ とおく。$f$ のテイラー展開 $f(z)=f'(0)z+\cdots$ から $g$ は $\mathbb{D}$ で正則（除去可能）。

**Step 2.** $0<r<1$ について、$|z|=r$ で $|g(z)|=\frac{|f(z)|}{r}<\frac1r$。最大値原理（\tref{cx:maximum-principle.2}、$D=D(0,r)$）から $|z|\le r$ で $|g|\le\frac1r$。$r\to1$ として $\mathbb{D}$ で $|g|\le1$、これが 1。

**Step 3（2）.** 仮定から $|g|$ は $\mathbb{D}$ の内点で最大値 $1$ をとるので、\ref{cx:maximum-principle.1} から $g$ は定数 $\lambda$、$|\lambda|=1$。
:::

::: definition ブラシュケ因子 {#cx:blaschke-factor keywords="phi_a(z) = (z - a)/(1 - conj(a) z), |a| < 1, an automorphism of the disk exchanging a and 0" index="ブラシュケ因子|ぶらしゅけいんし"}
$a\in\mathbb{D}$ について $\varphi_{a}(z)\defeq\dfrac{z-a}{1-\bar az}$ とする。
:::

::: lemma ブラシュケ因子の性質 {#cx:blaschke-properties keywords="phi_a maps the disk onto itself and the circle onto itself, with inverse phi_{-a}; phi_a(a) = 0, phi_a'(a) = 1/(1-|a|^2), phi_a'(0) = 1 - |a|^2" index=""}
$\varphi_{a}$ は $\mathbb{D}$ の自己同型で、$\varphi_{a}^{-1}=\varphi_{-a}$、$\varphi_{a}(a)=0$、$\varphi_{a}(0)=-a$、$\varphi_{a}'(a)=\frac{1}{1-|a|^{2}}$、$\varphi_{a}'(0)=1-|a|^{2}$。単位円周を単位円周に写す。
:::

::: proof
$|z-a|^{2}-|1-\bar az|^{2}=|z|^{2}+|a|^{2}-1-|a|^{2}|z|^{2}=-(1-|z|^{2})(1-|a|^{2})$ なので、$|z|<1\iff|\varphi_{a}(z)|<1$、$|z|=1\iff|\varphi_{a}(z)|=1$（$1-\bar az\neq0$ は $|\bar az|<1$ から）。$\varphi_{-a}(\varphi_{a}(z))=z$ は直接計算（行列 $\begin{pmatrix}1&a\\\bar a&1\end{pmatrix}\begin{pmatrix}1&-a\\-\bar a&1\end{pmatrix}=(1-|a|^{2})I$ と \ref{cx:mobius-basic.1}）。微分は $\varphi_{a}'(z)=\frac{1-|a|^{2}}{(1-\bar az)^{2}}$。
:::

::: theorem 単位円板の自己同型群 {#cx:aut-disk keywords="Aut(D) = { e^{i theta} (z - a)/(1 - conj(a) z) : |a| < 1 }" index="単位円板の自己同型群|たんいえんばんのじこどうけいぐん"}
$\operatorname{Aut}(\mathbb{D})=\{\lambda\varphi_{a}\mid|\lambda|=1,\ a\in\mathbb{D}\}$。とくに $\mathbb{D}$ の自己同型はすべて一次分数変換で、原点を固定するものは回転 $z\mapsto\lambda z$ だけである。
:::

::: proof
**Step 1（原点を固定する場合）.** $f\in\operatorname{Aut}(\mathbb{D})$, $f(0)=0$ とする。シュワルツの補題を $f$ と $f^{-1}$ に使うと $|f(z)|\le|z|$ かつ $|z|=|f^{-1}(f(z))|\le|f(z)|$。よって $|f(z)|=|z|$ で、補題の 2 から $f(z)=\lambda z$。

**Step 2（一般の場合）.** $f\in\operatorname{Aut}(\mathbb{D})$ について $a\defeq f^{-1}(0)$ とすると、$f\circ\varphi_{a}^{-1}=f\circ\varphi_{-a}$ は原点を固定する自己同型なので、Step 1 から $\lambda z$。よって $f=\lambda\varphi_{a}$。逆に $\lambda\varphi_{a}$ は自己同型（\ref{cx:blaschke-properties}）。
:::

::: corollary シュワルツ–ピックの補題 {#cx:schwarz-pick keywords="Schwarz-Pick lemma: holomorphic self-maps of the disk do not increase the pseudo-hyperbolic distance; |f'(z)| <= (1 - |f(z)|^2)/(1 - |z|^2)" index="シュワルツ–ピックの補題|しゅわるつぴっくのほだい" refname="シュワルツ–ピックの補題"}
$f\colon\mathbb{D}\to\mathbb{D}$ が正則なら、$z,w\in\mathbb{D}$ について
$$
\Bigl|\frac{f(z)-f(w)}{1-\overline{f(w)}f(z)}\Bigr|\le\Bigl|\frac{z-w}{1-\bar wz}\Bigr|,\qquad|f'(z)|\le\frac{1-|f(z)|^{2}}{1-|z|^{2}}.
$$
:::

::: proof
$g\defeq\varphi_{f(w)}\circ f\circ\varphi_{w}^{-1}$ は $\mathbb{D}$ から $\mathbb{D}$ への正則写像で $g(0)=0$。シュワルツの補題から $|g(\zeta)|\le|\zeta|$、$\zeta=\varphi_{w}(z)$ を入れると第 1 式。$z=w$ での微分：$|g'(0)|\le1$ と連鎖律 $g'(0)=\varphi_{f(w)}'(f(w))f'(w)(\varphi_{w}^{-1})'(0)=\frac{1}{1-|f(w)|^{2}}f'(w)(1-|w|^{2})$ から第 2 式（$w$ を $z$ と書き直す）。
:::

## 平面・球面・上半平面の自己同型 {#cx:sec-mb-others}

::: theorem 平面の自己同型群 {#cx:aut-plane keywords="Aut(C) = { az + b : a != 0 }; injective entire functions are affine" index="平面の自己同型群|へいめんのじこどうけいぐん"}
単射な整関数は $az+b$（$a\neq0$）の形である。とくに $\operatorname{Aut}(\C)=\{az+b\mid a\neq0\}$。
:::

::: proof
**Step 1（無限遠点は真性特異点でない）.** $f$ を単射な整関数とする。開写像定理から $V\defeq f(\mathbb{D})$ は開集合。$\infty$ が $f$ の真性特異点なら、カゾラーティ–ワイエルシュトラス（$g(w)=f(1/w)$ に適用）から $f(\{|z|>1\})$ は稠密で、開集合 $V$ と交わる。すると $|z|>1$ の点と $\mathbb{D}$ の点が同じ値をとり、単射に反する。

**Step 2.** \ref{cx:entire-at-infinity} から $f$ は多項式。$d\defeq\deg f\ge2$ なら、$f(z)=w$ の解は重複度込みで $d$ 個。$f'$ の零点（有限個）の像を除いた $w$ では解はすべて単根なので相異なる $d\ge2$ 個の解があり、単射に反する。定数は単射でない。よって $d=1$。
:::

::: theorem リーマン球面の自己同型群 {#cx:aut-sphere keywords="the automorphisms of the Riemann sphere (bijective maps meromorphic in both charts) are exactly the Mobius transformations" index="リーマン球面の自己同型群|りーまんきゅうめんのじこどうけいぐん"}
$f\colon\widehat{\C}\to\widehat{\C}$ を全単射で、$f$ と $f^{-1}$ が $\widehat{\C}$ 上で有理型（$\C$ 上で有理型で、$f(1/w)$ が $w=0$ で有理型、という意味）なものとする。このとき $f$ は一次分数変換である。
:::

::: proof
$T$ を $f(\infty)$ を $\infty$ に写す一次分数変換とすると、$g\defeq T\circ f$ も同じ条件を満たし $g(\infty)=\infty$。$g$ は $\C$ を $\C$ に全単射に写す（$\infty$ の逆像は $\infty$ だけ）ので、$\C$ 上で極をもたない有理型関数、すなわち整関数で単射。\ref{cx:aut-plane} から $g(z)=az+b$、$f=T^{-1}\circ g$ は一次分数変換。
:::

::: theorem 上半平面の自己同型群 {#cx:aut-half-plane keywords="Cayley transform (z - i)/(z + i) maps H onto D; Aut(H) = PSL(2,R) acting by (az+b)/(cz+d), ad - bc = 1, real coefficients" index="上半平面|じょうはんへいめん, ケーリー変換|けーりーへんかん"}
1. **ケーリー変換** $C(z)\defeq\frac{z-i}{z+i}$ は $\mathbb{H}$ から $\mathbb{D}$ への双正則写像である。
2. $\operatorname{Aut}(\mathbb{H})=\Bigl\{z\mapsto\dfrac{az+b}{cz+d}\ \Big|\ a,b,c,d\in\R,\ ad-bc=1\Bigr\}$。これは群 $\mathrm{PSL}_{2}(\R)=\mathrm{SL}_{2}(\R)/\{\pm I\}$ と同型である。
:::

::: proof
**Step 1（1）.** $|z-i|^{2}-|z+i|^{2}=-4\operatorname{Im}z$ なので $|C(z)|<1\iff\operatorname{Im}z>0$。$C$ は $\widehat{\C}$ の全単射なので $\mathbb{H}$ から $\mathbb{D}$ への全単射で、正則（極 $-i\notin\mathbb{H}$）。

**Step 2（実係数の変換）.** $a,b,c,d\in\R$, $ad-bc>0$ なら $\operatorname{Im}\frac{az+b}{cz+d}=\frac{(ad-bc)\operatorname{Im}z}{|cz+d|^{2}}$（分母分子に $\overline{cz+d}$ を掛けて虚部を計算）なので $\mathbb{H}$ を $\mathbb{H}$ に写し、逆写像（行列の逆、同じ形）も同様なので自己同型。行列を $\sqrt{ad-bc}$ で割れば行列式 $1$ にできる。

**Step 3（逆）.** $f\in\operatorname{Aut}(\mathbb{H})$ なら $C\circ f\circ C^{-1}\in\operatorname{Aut}(\mathbb{D})$ は一次分数変換（\ref{cx:aut-disk}）なので $f$ も一次分数変換 $T$。$T$ は $\widehat{\C}$ の同相写像（\ref{cx:mobius-basic.2}）で $T(\mathbb{H})=\mathbb{H}$ なので、$\widehat{\C}$ における $\mathbb{H}$ の境界 $\R\cup\{\infty\}$ を自分自身に写す。$0,1,\infty$ の像 $w_{2},w_{3},w_{4}$ は実数か $\infty$ で、\ref{cx:mobius-three-points} の構成から $T=S_{w}^{-1}\circ S_{z}$ は実係数の行列で表される（複比の式の係数が実数）。$\operatorname{Im}T(i)>0$ と Step 2 の式から行列式は正。

**Step 4（群の同型）.** $\mathrm{SL}_{2}(\R)\to\operatorname{Aut}(\mathbb{H})$ は全射準同型で、核は $T_{A}=\mathrm{id}$ となる $A$、すなわちスカラー行列で行列式 $1$ の実行列 $\pm I$（\ref{cx:mobius-basic.1}）。
:::

::: supplement
**高い視点.** 単位円板と上半平面は、双曲幾何（ポアンカレ・モデル）の舞台で、自己同型群 $\mathrm{PSL}_{2}(\R)$ はその向きを保つ等長変換群である。シュワルツ–ピックの補題は「正則写像は双曲距離を縮める」と読める。平面・円板・球面は、後で見るように（リーマンの写像定理と一意化定理）単連結なリーマン面のすべてである。それぞれの自己同型群は、ユークリッド幾何（$az+b$ のうち $|a|=1$ のものが等長変換）、双曲幾何、球面幾何（$\mathrm{PGL}_{2}(\C)$ の部分群 $\mathrm{PSU}(2)$ が回転群）に対応する。
:::

## 問題 {#cx:sec-mb-problems}

::: problem {#cx:prob-mb-three-points}
$0,1,\infty$ をそれぞれ $1,i,-1$ に写す一次分数変換を求め、実軸の像を答えよ。
:::

::: solution
$T(z)=\frac{az+b}{cz+d}$ で $T(\infty)=\frac ac=-1$, $T(0)=\frac bd=1$。$a=-c$, $b=d$ として $T(z)=\frac{-cz+d}{cz+d}$、$T(1)=\frac{d-c}{d+c}=i$ から $d-c=i(d+c)$、$d(1-i)=c(1+i)$、$c=d\frac{1-i}{1+i}=-id$。$d=1$ として $T(z)=\frac{iz+1}{-iz+1}=\frac{1+iz}{1-iz}$。実軸は $1,i,-1$ を通る一般化された円、すなわち単位円周に写る。
:::

::: problem {#cx:prob-mb-half-plane-disk}
$\mathbb{H}$ から $\mathbb{D}$ への双正則写像で $2i\mapsto0$ となるものをすべて求めよ。
:::

::: solution
$C(z)=\frac{z-i}{z+i}$ で $C(2i)=\frac{i}{3i}=\frac13$。$\varphi_{1/3}\circ C$ は $2i$ を $0$ に写す。求める写像は $\lambda\varphi_{1/3}\circ C$（$|\lambda|=1$）で、計算すると $\varphi_{1/3}(C(z))=\frac{\frac{z-i}{z+i}-\frac13}{1-\frac13\cdot\frac{z-i}{z+i}}=\frac{2z-4i}{2z+4i}=\frac{z-2i}{z+2i}$。よって $\lambda\frac{z-2i}{z+2i}$。（別の写像 $F$ があれば $F\circ(\varphi_{1/3}\circ C)^{-1}$ は原点を固定する $\mathbb{D}$ の自己同型で回転。）
:::

::: problem {#cx:prob-mb-fixed}
$T(z)=\frac{2z+1}{z+1}$ の不動点を求めよ。また $T$ は $\mathbb{H}$ の自己同型か。
:::

::: solution
$\frac{2z+1}{z+1}=z\iff z^{2}-z-1=0\iff z=\frac{1\pm\sqrt5}{2}$（実数の 2 点）。係数は実数で $ad-bc=2-1=1>0$ なので、\ref{cx:aut-half-plane} から $\mathbb{H}$ の自己同型である。
:::
