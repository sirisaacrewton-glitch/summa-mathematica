# 演習：基本事項 {#cx:page-exercises-basics keywords="exercises, Basics of Complex Analysis"}

この系列の各ページの内容を使う演習を、ページの順に並べた。各ページの末尾の「問題」はそのページの内容の確認で、ここに集めたのは計算練習と、いくつかのページの結果を組み合わせる問題である。各節の中は、計算練習（★ 基本）、定理を組み合わせる問題（★★ 標準）、証明や一般化（★★★ 発展）の順に並べた。数値の答えは計算機（sympy）でも確かめた。

## 記法と定義の確認 {#cx:sec-exbasics-notation}

::: notation
- 記号と用語は、各節の見出しの下に示した対応するページの約束に従う。
:::

## 冪級数と正則関数 {#cx:sec-ps-exercises}

対応するページ：\ref{cx:page-power-series}

::: problem ★ 基本：コーシー–リーマンの方程式 {#cx:ex-ps-1}
実数 $a,b,c$ について $f(x+iy)\defeq(x^{2}+axy+by^{2})+i(cx^{2}+2xy+y^{2})$ が整関数になる $a,b,c$ を求め、$f$ を $z$ の式で表せ。
:::

::: solution
$u=x^{2}+axy+by^{2}$, $v=cx^{2}+2xy+y^{2}$ は $C^{1}$ なので、コーシー–リーマンの方程式が恒等的に成り立てばよい（\ref{cx:cr-consequences.1}）。$u_{x}=2x+ay$, $v_{y}=2x+2y$ から $a=2$。$u_{y}=ax+2by$, $-v_{x}=-2cx-2y$ から $a=-2c$, $2b=-2$、すなわち $c=-1$, $b=-1$。このとき $f=x^{2}+2xy-y^{2}+i(-x^{2}+2xy+y^{2})=(1-i)(x+iy)^{2}=(1-i)z^{2}$（展開して確かめる）。
:::

::: problem ★ 基本：収束半径 {#cx:ex-ps-2}
(a) $\sum_{n\ge0}\frac{n^{2}+1}{3^{n}}z^{2n}$　(b) $\sum_{n\ge1}\frac{(1+i)^{n}}{n}z^{n}$ の収束半径を求めよ。
:::

::: solution
(a) $w=z^{2}$ の冪級数 $\sum\frac{n^{2}+1}{3^{n}}w^{n}$ の収束半径は $3$（$(n^{2}+1)^{1/n}\to1$）なので、$|z|^{2}<3$ で収束し $|z|^{2}>3$ で発散する。収束半径は $\sqrt3$。(b) $\bigl|\frac{(1+i)^{n}}{n}\bigr|^{1/n}=\frac{\sqrt2}{n^{1/n}}\to\sqrt2$ なので $\frac{1}{\sqrt2}$。
:::

::: problem ★★ 標準：正弦の方程式 {#cx:ex-ps-3}
$\sin z=2$ の解をすべて求めよ。
:::

::: solution
$w\defeq e^{iz}$ とすると $\frac{w-w^{-1}}{2i}=2$、$w^{2}-4iw-1=0$、$w=i(2\pm\sqrt3)$。$|w|=2\pm\sqrt3$, 偏角 $\frac\pi2$ なので $iz\in\log(2\pm\sqrt3)+i\frac\pi2+2\pi i\mathbb{Z}$（\ref{cx:exp}）。$\log(2-\sqrt3)=-\log(2+\sqrt3)$ なので $z\in\frac\pi2+2\pi\mathbb{Z}\pm i\log(2+\sqrt3)$。確かめ：$\sin(\frac\pi2+it)=\cos(it)=\cosh t$ で、$\cosh t=2\iff t=\pm\log(2+\sqrt3)$。
:::

::: problem ★★★ 発展：$|\sin z|$ の公式 {#cx:ex-ps-4}
$z=x+iy$ について $|\sin z|^{2}=\sin^{2}x+\sinh^{2}y$ を示し（$\sinh y\defeq\frac{e^{y}-e^{-y}}{2}$）、これから $\sin$ の零点が $\pi\mathbb{Z}$ だけであることと、$|\sin z|\to\infty$（$|\operatorname{Im}z|\to\infty$）を導け。
:::

::: solution
加法定理（\ref{cx:trig-properties}）から $\sin(x+iy)=\sin x\cos(iy)+\cos x\sin(iy)=\sin x\cosh y+i\cos x\sinh y$（$\cos(iy)=\cosh y$, $\sin(iy)=i\sinh y$ は定義から）。よって $|\sin z|^{2}=\sin^{2}x\cosh^{2}y+\cos^{2}x\sinh^{2}y=\sin^{2}x(1+\sinh^{2}y)+\cos^{2}x\sinh^{2}y=\sin^{2}x+\sinh^{2}y$（$\cosh^{2}-\sinh^{2}=1$）。零点は $\sin x=0$ かつ $\sinh y=0$、すなわち $x\in\pi\mathbb{Z}$, $y=0$。また $|\sin z|\ge|\sinh y|\to\infty$。
:::

## 複素線積分 {#cx:sec-li-exercises}

対応するページ：\ref{cx:page-line-integrals}

::: problem ★ 基本：半円周に沿った積分 {#cx:ex-li-1}
上半円周 $\gamma(t)=e^{it}$（$0\le t\le\pi$）に沿って $\int_{\gamma}(z^{2}+\bar z)\,dz$ を計算せよ。
:::

::: solution
$z^{2}$ は原始関数 $\frac{z^{3}}{3}$ をもつので $\frac{(-1)^{3}-1^{3}}{3}=-\frac23$（\ref{cx:fundamental-theorem-contour}）。$\bar z$ は直接計算：$\int_{0}^{\pi}e^{-it}\cdot ie^{it}dt=i\pi$。合計 $-\frac23+i\pi$。
:::

::: problem ★★ 標準：長さによる評価 {#cx:ex-li-2}
線分 $[0,1+i]$ に沿った $\int e^{z^{2}}dz$ の絶対値は $\sqrt2$ 以下であることを示せ。また $\bigl|\oint_{|z|=R}\frac{e^{iz}}{z^{2}+1}dz\bigr|$ を上から評価し、$R\to\infty$ で $0$ に収束するか調べよ。
:::

::: solution
線分上 $z=t(1+i)$ で $z^{2}=2it^{2}$、$|e^{z^{2}}|=1$、長さ $\sqrt2$。\ref{cx:ml-inequality} から $\sqrt2$ 以下。円周上では $|e^{iz}|=e^{-\operatorname{Im}z}\le e^{R}$ で、$|z^{2}+1|\ge R^{2}-1$ なので評価は $\frac{2\pi Re^{R}}{R^{2}-1}$ で、$R\to\infty$ で発散し、この評価では $0$ への収束は示せない（下半分で $|e^{iz}|$ が大きくなるため。上半円だけなら別の評価で $0$ に収束する：\ref{cx:page-definite-integrals}）。
:::

::: problem ★★★ 発展：余弦の冪の積分 {#cx:ex-li-3}
$\oint_{|z|=1}\frac{(z+z^{-1})^{2n}}{z}\,dz$ を二項展開で計算し、$\int_{0}^{2\pi}\cos^{2n}t\,dt=\frac{2\pi}{4^{n}}\binom{2n}{n}$ を導け。
:::

::: solution
$(z+z^{-1})^{2n}=\sum_{k=0}^{2n}\binom{2n}{k}z^{2n-2k}$ なので、$\frac{(z+z^{-1})^{2n}}{z}$ の $z^{-1}$ の係数は $k=n$ の項 $\binom{2n}{n}$ だけで、\ref{cx:circle-integral-powers} から積分は $2\pi i\binom{2n}{n}$。一方 $z=e^{it}$ で $z+z^{-1}=2\cos t$、$\frac{dz}{z}=i\,dt$ なので積分は $i\int_{0}^{2\pi}4^{n}\cos^{2n}t\,dt$。比べて主張。（$n=3$ で $\frac{5\pi}{8}$。）
:::

## コーシーの積分定理 {#cx:sec-ct-exercises}

対応するページ：\ref{cx:page-cauchy-theorem}

::: problem ★ 基本：積分定理の適用 {#cx:ex-ct-1}
$\oint_{|z|=1}\frac{e^{z}}{z-3}dz$ と $\oint_{|z-1|=1/2}\frac{dz}{z^{2}+z}$ を求めよ。
:::

::: solution
どちらも、円周を含む円板（それぞれ $D(0,2)$、$D(1,\frac34)$）で被積分関数が正則（$3\notin D(0,2)$、$z^{2}+z=z(z+1)$ の零点 $0,-1\notin D(1,\frac34)$）。\ref{cx:cauchy-star} から両方 $0$。
:::

::: problem ★★ 標準：ガウス型積分 {#cx:ex-ct-2}
$\int_{0}^{\infty}e^{-x^{2}}\cos2x\,dx$ を求めよ。
:::

::: solution
\ref{cx:prob-ct-gaussian-cos} で $a=1$, $b=2$ とすると $\frac{\sqrt\pi}{2}e^{-1}\approx0.3260$。
:::

::: problem ★★★ 発展：回転したガウス積分 {#cx:ex-ct-3}
$|\alpha|<\frac\pi4$ について $\int_{0}^{\infty}e^{-t^{2}e^{2i\alpha}}dt=\frac{\sqrt\pi}{2}e^{-i\alpha}$ を示し、$\int_{0}^{\infty}e^{-t^{2}\cos2\alpha}\cos(t^{2}\sin2\alpha)\,dt=\frac{\sqrt\pi}{2}\cos\alpha$ を導け。
:::

::: solution
$\alpha>0$ とする（負なら共役をとる）。扇形 $0\le\theta\le\alpha$, $r\le R$ の周に沿って $e^{-z^{2}}$ を積分すると $0$（\ref{cx:cauchy-star}）。円弧上 $|e^{-z^{2}}|=e^{-R^{2}\cos2\theta}\le e^{-R^{2}\cos2\alpha}$（$\cos2\theta\ge\cos2\alpha>0$）で、長さ $R\alpha$ なので円弧の積分は $R\alpha e^{-R^{2}\cos2\alpha}\to0$。斜めの辺 $z=te^{i\alpha}$ では $\int_{0}^{R}e^{-t^{2}e^{2i\alpha}}e^{i\alpha}dt$。よって $e^{i\alpha}\int_{0}^{\infty}e^{-t^{2}e^{2i\alpha}}dt=\int_{0}^{\infty}e^{-x^{2}}dx=\frac{\sqrt\pi}{2}$（左辺の積分は $|e^{-t^{2}e^{2i\alpha}}|=e^{-t^{2}\cos2\alpha}$ で絶対収束）。実部をとると後半（$\alpha=\frac\pi8$ で数値的にも一致を確かめた）。
:::

## コーシーの積分公式と正則関数の性質 {#cx:sec-cf-exercises}

対応するページ：\ref{cx:page-cauchy-formula}

::: problem ★ 基本：積分公式による計算 {#cx:ex-cf-1}
(a) $\oint_{|z|=2}\frac{z^{3}+1}{(z-1)^{2}}dz$　(b) $\oint_{|z|=3}\frac{e^{z}}{z(z-1)}dz$ を求めよ。
:::

::: solution
(a) 導関数の積分公式（\ref{cx:holomorphic-analytic.3}、$n=1$）から $2\pi i\cdot(3z^{2})|_{z=1}=6\pi i$。(b) $\frac{1}{z(z-1)}=\frac{1}{z-1}-\frac1z$ と分け、\ref{cx:cauchy-formula} を 2 回使って $2\pi i(e^{1}-e^{0})=2\pi i(e-1)$。
:::

::: problem ★★ 標準：テイラー展開と収束半径 {#cx:ex-cf-2}
$\tan z$ の $0$ のまわりのテイラー展開を $z^{5}$ の項まで求め、収束半径を答えよ。
:::

::: solution
$\tan z=\frac{\sin z}{\cos z}=z+\frac{z^{3}}{3}+\frac{2z^{5}}{15}+\cdots$（$\cos z\cdot(a_{1}z+a_{3}z^{3}+a_{5}z^{5})=\sin z$ の係数を比べる：$a_{1}=1$、$a_{3}-\frac{a_{1}}{2}=-\frac16$、$a_{5}-\frac{a_{3}}{2}+\frac{a_{1}}{24}=\frac{1}{120}$）。$\cos$ の零点で最も近いのは $\pm\frac\pi2$ なので、\ref{cx:prob-cf-cos-radius} と同じ議論で収束半径は $\frac\pi2$。
:::

::: problem ★★ 標準：増大度と多項式 {#cx:ex-cf-3}
整関数 $f$ がすべての $z$ で $|f(z)|\le C|z|^{3/2}$ を満たすとき、$f(z)=az$ の形であることを示せ。
:::

::: solution
$|z|\ge1$ では $|f(z)|\le C|z|^{2}$、$|z|\le1$ では有界なので、\ref{cx:liouville.2} から $f$ は 2 次以下の多項式 $a_{0}+a_{1}z+a_{2}z^{2}$。$z=0$ で $f(0)=0$ から $a_{0}=0$。$|a_{1}+a_{2}z|=\frac{|f(z)|}{|z|}\le C|z|^{1/2}$ を $|z|\to\infty$ で見ると、$a_{2}\neq0$ なら左辺は $|z|$ の程度で増えて矛盾。よって $a_{2}=0$。
:::

::: problem ★★★ 発展：最大値原理 {#cx:ex-cf-4}
閉円板 $|z|\le1$ 上の $|z^{2}-z|$ の最大値と、それをとる点を求めよ。
:::

::: solution
\ref{cx:maximum-principle.2}から最大値は円周 $|z|=1$ 上でとられる。$z=e^{it}$ で $|z^{2}-z|=|z||z-1|=|e^{it}-1|=2|\sin\frac t2|$ で、最大値 $2$ は $t=\pi$、すなわち $z=-1$ でとられる。
:::

## 孤立特異点とローラン展開 {#cx:sec-sg-exercises}

対応するページ：\ref{cx:page-singularities}

::: problem ★ 基本：主要部 {#cx:ex-sg-1}
$\frac{e^{z}}{z^{3}}$ の $0$ における主要部と、特異点の種類を答えよ。
:::

::: solution
$\frac{e^{z}}{z^{3}}=\sum_{n\ge0}\frac{z^{n-3}}{n!}$ なので主要部は $\frac{1}{z^{3}}+\frac{1}{z^{2}}+\frac{1}{2z}$、\term[位数]{cx:isolated-singularity} 3 の極。
:::

::: problem ★★ 標準：円環での展開 {#cx:ex-sg-2}
$\frac{1}{z^{2}(1-z)}$ の $|z|>1$ でのローラン展開を求めよ。
:::

::: solution
$|z|>1$ で $\frac{1}{1-z}=-\frac1z\cdot\frac{1}{1-1/z}=-\sum_{n\ge1}z^{-n}$。よって $\frac{1}{z^{2}(1-z)}=-\sum_{n\ge3}z^{-n}$。
:::

::: problem ★★ 標準：除去可能な特異点 {#cx:ex-sg-3}
$\frac{1}{\sin z}-\frac1z$ の $0$ での特異点の種類と、延長した値を答えよ。
:::

::: solution
$\sin z=z(1-\frac{z^{2}}{6}+\cdots)$ なので $\frac{1}{\sin z}=\frac1z(1+\frac{z^{2}}{6}+\cdots)$、差は $\frac z6+\frac{7z^{3}}{360}+\cdots$。除去可能で値は $0$。
:::

::: problem ★★★ 発展：実部が非負なら除去可能 {#cx:ex-sg-4}
$f$ が $D^{*}(0,1)$ で正則で $\operatorname{Re}f\ge0$ なら、$0$ は除去可能な特異点であることを示せ。
:::

::: solution
真性特異点ならカゾラーティ–ワイエルシュトラス（\tref{cx:casorati-weierstrass}）から $f$ の値は $-1$ のいくらでも近くをとり、$\operatorname{Re}f\ge0$ に反する。\term[位数]{cx:isolated-singularity} $m$ の極なら $f(z)=\frac{g(z)}{z^{m}}$, $g(0)=c\neq0$（\ref{cx:pole-characterization}）。$c=|c|e^{i\varphi}$ とし、$z=re^{i\theta}$ で $e^{i(\varphi-m\theta)}=-1$ となる $\theta$ をとると $\frac{c}{z^{m}}=-\frac{|c|}{r^{m}}$。$g(z)=c+O(r)$ なので $\operatorname{Re}f(z)\le-\frac{|c|}{r^{m}}+\frac{O(r)}{r^{m}}<0$（$r$ が十分小さいとき）で矛盾。よって除去可能。
:::
