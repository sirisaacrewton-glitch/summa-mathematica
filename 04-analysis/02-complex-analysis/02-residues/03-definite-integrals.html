# 定積分の計算 {#cx:page-definite-integrals keywords="evaluation of definite integrals by residues, trigonometric integrals over [0, 2pi], rational functions over the real line, large semicircle estimate, Jordan's lemma, Fourier type integrals, indented contour, half residue at a simple pole on the contour, Dirichlet integral sin x / x, rectangle contour for x^(alpha-1)/(1+x), sector contour for 1/(1+x^n), summation of series by residues, pi cot pi z, sum 1/n^2 = pi^2/6"}

\ref{cx:residue-theorem}は、実数の積分の計算にとても強力である。実軸上の積分を、複素平面の閉曲線の一部とみなし、残りの部分の積分が消えるか、元の積分で書けるように閉曲線を選べば、積分は留数の和で計算できる。このページでは、典型的な型（三角関数の有理式の 1 周期の積分、実軸上の有理関数、フーリエ型の積分、実軸上に極がある場合、多価関数を含む積分）を順に扱い、最後に同じ考え方で級数の和 $\sum\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$ などを計算する。数値はすべて計算機（sympy, mpmath）でも確かめた。

## 記法と定義の確認 {#cx:sec-di-notation}

::: notation
- 留数とその計算法 \ref{cx:residue}, \ref{cx:residue-computation}、留数定理 \tref{cx:residue-theorem}、回転数 \ref{cx:winding-number}。
- 複素線積分と基本性質 \ref{cx:contour-integral}, \ref{cx:contour-integral-basic}、長さによる評価 \tref{cx:ml-inequality}、ローラン展開 \ref{cx:laurent}、円周上の冪の積分 \ref{cx:circle-integral-powers}。
- 広義積分 \ref{calc:improper-integral}, \ref{calc:improper-tests}、凸関数 \ref{calc:convex}, \ref{calc:convex-properties}、$|\sin z|^{2}=\sin^{2}x+\sinh^{2}y$（\ref{cx:ex-ps-4}）と同様に $|\cos z|^{2}=\cos^{2}x+\sinh^{2}y$。
- 以下で使う閉曲線は、線分と円弧をつないだ単純な形（長方形・半円・扇形の周）で、内部の点の回転数は $1$、外部の点では $0$ である。これは、回転数を直接計算するか（円弧と線分の積分）、\ref{cx:winding-number-properties} と曲線の変形（内部の点を中心とする小円への連続な変形）で確かめられる。以下ではこの事実を断らずに使う。
- **公理系**：$\ZF$ で行い、選択公理は使わない。
:::

## 三角関数の有理式 {#cx:sec-di-trig}

::: proposition 三角関数の有理式の積分 {#cx:trig-rational-integral keywords="int_0^{2 pi} R(cos t, sin t) dt = int over |z| = 1 of R((z+1/z)/2, (z-1/z)/(2i)) dz/(iz)" index="三角関数の有理式の積分|さんかくかんすうのゆうりしきのせきぶん"}
$R(x,y)$ を 2 変数の有理関数で、単位円周上で分母が $0$ にならないものとする。$z=e^{it}$ とおくと
$$
\int_{0}^{2\pi}R(\cos t,\sin t)\,dt=\oint_{|z|=1}R\Bigl(\frac{z+z^{-1}}{2},\frac{z-z^{-1}}{2i}\Bigr)\frac{dz}{iz}
=2\pi\sum_{|a|<1}\operatorname{Res}(F,a),
$$
ここで $F(z)\defeq\frac{1}{z}R\bigl(\frac{z+z^{-1}}{2},\frac{z-z^{-1}}{2i}\bigr)$。
:::

::: proof
$z=e^{it}$ なら $\cos t=\frac{z+z^{-1}}{2}$, $\sin t=\frac{z-z^{-1}}{2i}$, $dz=iz\,dt$。$F$ は有理関数なので極は有限個で、単位円板の中の極について留数定理（$\Gamma=C(0,1)$、回転数 $1$）を使うと積分は $\frac1i\cdot2\pi i\sum\operatorname{Res}(F,a)$。
:::

::: example
$a>1$ について $\displaystyle\int_{0}^{2\pi}\frac{dt}{a+\cos t}=\frac{2\pi}{\sqrt{a^{2}-1}}$。$F(z)=\frac{1}{z(a+\frac{z+z^{-1}}{2})}=\frac{2}{z^{2}+2az+1}$ の極は $z_{\pm}=-a\pm\sqrt{a^{2}-1}$ で、$z_{+}z_{-}=1$, $|z_{-}|>1$ なので円板の中は $z_{+}$ だけ。$\operatorname{Res}(F,z_{+})=\frac{2}{z_{+}-z_{-}}=\frac{1}{\sqrt{a^{2}-1}}$。（$a=3$ で $\frac{2\pi}{\sqrt8}\approx2.2214$。）
:::

## 実軸上の有理関数 {#cx:sec-di-rational}

::: lemma 大きな半円の評価 {#cx:large-semicircle keywords="if |f(z)| <= M/|z|^2 on large semicircles then the integral over the semicircle tends to zero" index=""}
$C_{R}$ を上半円 $t\mapsto Re^{it}$（$0\le t\le\pi$）とする。$|z|$ が大きいとき $|f(z)|\le\frac{M}{|z|^{2}}$ なら、$R\to\infty$ で $\int_{C_{R}}f\,dz\to0$。
:::

::: proof
\ref{cx:ml-inequality} から $\bigl|\int_{C_{R}}f\bigr|\le\frac{M}{R^{2}}\cdot\pi R=\frac{\pi M}{R}\to0$。
:::

::: theorem 有理関数の積分 {#cx:rational-integral keywords="int_R P/Q dx = 2 pi i sum of residues in the upper half plane when deg Q >= deg P + 2 and Q has no real zeros" index="有理関数の積分（留数）|ゆうりかんすうのせきぶんりゅうすう"}
$P,Q$ を多項式、$\deg Q\ge\deg P+2$、$Q$ は実数の零点をもたないとする。このとき
$$
\int_{-\infty}^{\infty}\frac{P(x)}{Q(x)}dx=2\pi i\sum_{\operatorname{Im}a>0}\operatorname{Res}\Bigl(\frac PQ,a\Bigr).
$$
:::

::: proof
**Step 1（評価）.** $\deg Q\ge\deg P+2$ なので、$|z|$ が大きいとき $\bigl|\frac{P(z)}{Q(z)}\bigr|\le\frac{M}{|z|^{2}}$（$\frac{P}{Q}z^{2}$ は無限遠で有界：分子と分母の最高次の比較）。とくに広義積分は絶対収束する。

**Step 2（閉曲線）.** $R$ を $Q$ の零点の絶対値より大きくとり、$\Gamma_{R}\defeq[-R,R]+C_{R}$ とすると、内部（回転数 $1$）には上半平面の極がすべて入り、下半平面の極は外部にある。留数定理から $\int_{-R}^{R}\frac PQdx+\int_{C_{R}}\frac PQdz=2\pi i\sum_{\operatorname{Im}a>0}\operatorname{Res}$。

**Step 3.** $R\to\infty$ で \ref{cx:large-semicircle} から半円の積分は $0$。
:::

::: example
1. $\int_{-\infty}^{\infty}\frac{dx}{1+x^{4}}=\frac{\pi}{\sqrt2}$。上半平面の極は $e^{i\pi/4}$, $e^{3i\pi/4}$ で、留数は $-\frac{z}{4}$（\ref{cx:residue-computation.2}、$\frac{1}{4z^{3}}=-\frac z4$）。和は $-\frac14(e^{i\pi/4}+e^{3i\pi/4})=-\frac{i\sqrt2}{4}$、$2\pi i\cdot(-\frac{i\sqrt2}{4})=\frac{\pi\sqrt2}{2}$。
2. $\int_{-\infty}^{\infty}\frac{dx}{(x^{2}+1)^{2}}=\frac\pi2$。$i$ で 2 位の極、留数は $\frac{d}{dz}(z+i)^{-2}|_{z=i}=-2(2i)^{-3}=\frac{1}{4i}$。
:::

## フーリエ型の積分 {#cx:sec-di-fourier}

::: lemma ジョルダンの補題 {#cx:jordan-lemma keywords="Jordan's lemma: int_0^pi e^{-R sin t refname="ジョルダンの補題"} dt < pi/R; if f -> 0 uniformly on large semicircles then int_{C_R} f(z) e^{iaz} dz -> 0 for a > 0" index="ジョルダンの補題|じょるだんのほだい"}
1. $R>0$ について $\int_{0}^{\pi}e^{-R\sin t}dt<\frac{\pi}{R}$。
2. $a>0$ とし、$M(R)\defeq\max_{C_{R}}|f|\to0$（$R\to\infty$）なら $\int_{C_{R}}f(z)e^{iaz}dz\to0$。
:::

::: proof
**Step 1（1）.** $-\sin$ は $[0,\frac\pi2]$ で凸（$(-\sin)''=\sin\ge0$、\ref{calc:convex-properties.3}）なので、凸性の定義（\ref{calc:convex}）から $\sin t\ge\frac{2t}{\pi}$（$0\le t\le\frac\pi2$）。よって $\int_{0}^{\pi/2}e^{-R\sin t}dt\le\int_{0}^{\pi/2}e^{-2Rt/\pi}dt=\frac{\pi}{2R}(1-e^{-R})<\frac{\pi}{2R}$。$[\frac\pi2,\pi]$ は $t\mapsto\pi-t$ で同じ。

**Step 2（2）.** $z=Re^{it}$ で $|e^{iaz}|=e^{-aR\sin t}$。\ref{cx:complex-integral-inequality} から $\bigl|\int_{C_{R}}fe^{iaz}dz\bigr|\le M(R)\int_{0}^{\pi}e^{-aR\sin t}R\,dt<M(R)\frac{\pi}{a}\to0$。
:::

::: theorem フーリエ型の積分 {#cx:fourier-integral keywords="int_R P(x)/Q(x) e^{iax} dx = 2 pi i sum of residues of P/Q e^{iaz} in the upper half plane for a > 0, deg Q >= deg P + 1" index="フーリエ型の積分|ふーりえがたのせきぶん"}
$P,Q$ を多項式、$\deg Q\ge\deg P+1$、$Q$ は実数の零点をもたないとし、$a>0$ とする。広義積分 $\int_{-R}^{R}\frac{P(x)}{Q(x)}e^{iax}dx$ は $R\to\infty$ で収束し、
$$
\lim_{R\to\infty}\int_{-R}^{R}\frac{P(x)}{Q(x)}e^{iax}dx=2\pi i\sum_{\operatorname{Im}b>0}\operatorname{Res}\Bigl(\frac{P}{Q}e^{iaz},b\Bigr).
$$
:::

::: proof
\ref{cx:rational-integral} の Step 2 と同じ閉曲線で留数定理を使い、半円の積分はジョルダンの補題（$M(R)\le\frac{M}{R}\to0$）で $0$ に収束する。左辺の極限の存在もこの等式から従う。
:::

::: example
$\int_{-\infty}^{\infty}\frac{e^{ix}}{x^{2}+1}dx=2\pi i\operatorname{Res}\bigl(\frac{e^{iz}}{z^{2}+1},i\bigr)=2\pi i\frac{e^{-1}}{2i}=\frac{\pi}{e}$。実部と虚部から $\int_{-\infty}^{\infty}\frac{\cos x}{x^{2}+1}dx=\frac\pi e$、$\int_{-\infty}^{\infty}\frac{\sin x}{x^{2}+1}dx=0$。同様に $\int_{-\infty}^{\infty}\frac{xe^{ix}}{x^{2}+1}dx=2\pi i\frac{ie^{-1}}{2i}=\frac{\pi i}{e}$ から $\int_{-\infty}^{\infty}\frac{x\sin x}{x^{2}+1}dx=\frac\pi e$（この場合は $\deg Q=\deg P+1$ で、絶対収束しない）。
:::

## 実軸上に極がある場合 {#cx:sec-di-indented}

::: lemma 小さな半円の積分 {#cx:small-semicircle keywords="if f has a simple pole at a, the integral over a small arc of angle theta around a tends to i theta Res(f,a); half residue for a semicircle" index="半留数|はんりゅうすう"}
$f$ が $a$ で 1 位の極をもつとき、$c_{\varepsilon}$ を $a$ を中心とする半径 $\varepsilon$、角 $\theta_{1}$ から $\theta_{2}$ までの円弧（$t\mapsto a+\varepsilon e^{it}$）とすると
$$
\lim_{\varepsilon\to0}\int_{c_{\varepsilon}}f(z)\,dz=i(\theta_{2}-\theta_{1})\operatorname{Res}(f,a).
$$
:::

::: proof
$f(z)=\frac{c}{z-a}+g(z)$（$c=\operatorname{Res}(f,a)$、$g$ は $a$ の近くで正則で有界、$|g|\le B$）。$\int_{c_{\varepsilon}}\frac{c}{z-a}dz=\int_{\theta_{1}}^{\theta_{2}}\frac{c}{\varepsilon e^{it}}i\varepsilon e^{it}dt=ic(\theta_{2}-\theta_{1})$。$\bigl|\int_{c_{\varepsilon}}g\bigr|\le B\varepsilon(\theta_{2}-\theta_{1})\to0$。
:::

::: theorem ディリクレ積分 {#cx:dirichlet-integral keywords="int_0^infty sin x / x dx = pi / 2 via an indented semicircular contour" index="ディリクレ積分|でぃりくれせきぶん"}
$\displaystyle\int_{0}^{\infty}\frac{\sin x}{x}dx=\frac\pi2$（広義積分として収束する）。
:::

::: proof
**Step 1（閉曲線）.** $f(z)=\frac{e^{iz}}{z}$、$0<\varepsilon<R$ とし、$[\varepsilon,R]$、上半円 $C_{R}$、$[-R,-\varepsilon]$、原点のまわりの上半円 $c_{\varepsilon}$ を時計回り（$t$ が $\pi$ から $0$）にたどる閉曲線をとる。$f$ はこの閉曲線の内部と曲線上で正則なので、積分は $0$（内部に極がない。\ref{cx:cauchy-homology}）。

**Step 2（各部分）.** $\int_{\varepsilon}^{R}\frac{e^{ix}}{x}dx+\int_{-R}^{-\varepsilon}\frac{e^{ix}}{x}dx=\int_{\varepsilon}^{R}\frac{e^{ix}-e^{-ix}}{x}dx=2i\int_{\varepsilon}^{R}\frac{\sin x}{x}dx$。ジョルダンの補題（$M(R)=\frac1R$）から $\int_{C_{R}}f\to0$。\ref{cx:small-semicircle}（角は $\pi$ から $0$、留数 $1$）から $\int_{c_{\varepsilon}}f\to-i\pi$。

**Step 3.** $0=2i\int_{\varepsilon}^{R}\frac{\sin x}{x}dx+\int_{C_{R}}f+\int_{c_{\varepsilon}}f$ で $\varepsilon\to0$, $R\to\infty$ とすると $2i\int_{0}^{\infty}\frac{\sin x}{x}dx=i\pi$。（$\frac{\sin x}{x}$ は $0$ で連続に延びるので、$\varepsilon\to0$ の極限は通常の積分。）

::: hypcheck
- $\int_{0}^{\infty}\bigl|\frac{\sin x}{x}\bigr|dx$ は発散する（絶対収束しない）。この証明では $R\to\infty$ の極限の存在も等式から得ている。
- $e^{iz}$ を使うのは、上半平面で $|e^{iz}|=e^{-\operatorname{Im}z}\le1$ と有界になるため。$\frac{\sin z}{z}$ のままでは $\sin$ が虚軸方向に大きくなり、半円の評価ができない。
:::
:::

## 多価関数を含む積分 {#cx:sec-di-multivalued}

::: proposition 冪を含む積分 {#cx:power-integral keywords="int_0^infty x^{alpha-1}/(1+x) dx = pi / sin(pi alpha) for 0 < alpha < 1, via a rectangle after x = e^t" index="ベータ型の積分|べーたがたのせきぶん"}
$0<\alpha<1$ について
$$
\int_{0}^{\infty}\frac{x^{\alpha-1}}{1+x}dx=\frac{\pi}{\sin\pi\alpha}.
$$
:::

::: proof
**Step 1（置換）.** $x=e^{t}$ とすると左辺は $I\defeq\int_{-\infty}^{\infty}\frac{e^{\alpha t}}{1+e^{t}}dt$（両端で被積分関数は $e^{\alpha t}$, $e^{(\alpha-1)t}$ の程度で減衰し、絶対収束）。

**Step 2（長方形）.** $f(z)\defeq\frac{e^{\alpha z}}{1+e^{z}}$ の極は $e^{z}=-1$、すなわち $i\pi+2\pi i\mathbb{Z}$。長方形 $[-R,R]\times[0,2\pi]$ の周の内部には $i\pi$ だけがあり、$\operatorname{Res}(f,i\pi)=\frac{e^{i\pi\alpha}}{e^{i\pi}}=-e^{i\pi\alpha}$（\ref{cx:residue-computation.2}）。

**Step 3（上の辺）.** $z=t+2\pi i$ で $f(z)=e^{2\pi i\alpha}f(t)$。上の辺は右から左へたどるので、その積分は $-e^{2\pi i\alpha}\int_{-R}^{R}f(t)dt$。

**Step 4（縦の辺）.** $z=\pm R+is$ で、$R\to\infty$ のとき右辺 $|f|\le\frac{e^{\alpha R}}{e^{R}-1}\to0$、左辺 $|f|\le\frac{e^{-\alpha R}}{1-e^{-R}}\to0$。長さは $2\pi$ なので積分は $0$ に収束。

**Step 5.** 留数定理から $(1-e^{2\pi i\alpha})I=2\pi i(-e^{i\pi\alpha})$、よって $I=\frac{2\pi i}{e^{i\pi\alpha}-e^{-i\pi\alpha}}=\frac{\pi}{\sin\pi\alpha}$。
:::

::: example
$n\ge2$ について $\int_{0}^{\infty}\frac{dx}{1+x^{n}}=\frac{\pi}{n\sin(\pi/n)}$。$x^{n}=y$ と置換すると $\frac1n\int_{0}^{\infty}\frac{y^{1/n-1}}{1+y}dy$ で、\ref{cx:power-integral}（$\alpha=\frac1n$）から。$n=3$ で $\frac{2\pi}{3\sqrt3}\approx1.2092$、$n=6$ で $\frac\pi3$。（中心角 $\frac{2\pi}{n}$ の扇形を使っても直接計算できる。）
:::

## 級数の和 {#cx:sec-di-series}

::: lemma 正方形の上の余接の評価 {#cx:cot-bound keywords="|cot pi z| is bounded on the squares with vertices +-(N+1/2)(1 +- i) uniformly in N" index=""}
$Q_{N}$ を頂点 $(N+\frac12)(\pm1\pm i)$ の正方形の周とする（$N\ge0$ は整数）。$Q_{N}$ 上で $|\cot\pi z|\le\coth\frac\pi2$（$N$ によらない）。
:::

::: proof
$z=x+iy$ とすると、$|\cos\pi z|^{2}=\cos^{2}\pi x+\sinh^{2}\pi y$、$|\sin\pi z|^{2}=\sin^{2}\pi x+\sinh^{2}\pi y$（加法定理と $\cos(iy)=\cosh y$, $\sin(iy)=i\sinh y$、$\cosh^{2}-\sinh^{2}=1$）。縦の辺 $x=\pm(N+\frac12)$ では $\cos\pi x=0$, $\sin^{2}\pi x=1$ なので $|\cot\pi z|^{2}=\frac{\sinh^{2}\pi y}{1+\sinh^{2}\pi y}\le1$。横の辺 $|y|=N+\frac12\ge\frac12$ では $|\cot\pi z|^{2}\le\frac{1+\sinh^{2}\pi y}{\sinh^{2}\pi y}=\coth^{2}\pi y\le\coth^{2}\frac\pi2$（$\coth$ は正の範囲で減少）。$\coth\frac\pi2>1$。
:::

::: theorem 留数による級数の和 {#cx:residue-series keywords="sum over n in Z of f(n) = - sum of residues of pi cot(pi z) f(z) at the poles of f, if |f(z)| <= M/|z|^2" index="級数の和（留数）|きゅうすうのわりゅうすう"}
$f$ が $\C$ で有理型で極は有限個、そのどれも整数でなく、$|z|$ が大きいとき $|f(z)|\le\frac{M}{|z|^{2}}$ とする。このとき
$$
\sum_{n\in\mathbb{Z}}f(n)=-\sum_{a:\,f\text{ の極}}\operatorname{Res}\bigl(\pi\cot(\pi z)f(z),a\bigr).
$$
:::

::: proof
**Step 1（整数での留数）.** $\pi\cot\pi z=\frac{\pi\cos\pi z}{\sin\pi z}$ は整数 $n$ で 1 位の極をもち（$\sin\pi z$ の零点は $\mathbb{Z}$ で 1 位、\ref{cx:trig-properties}）、留数は $\frac{\pi\cos\pi n}{\pi\cos\pi n}=1$（\ref{cx:residue-computation.2}）。よって $\operatorname{Res}(\pi\cot(\pi z)f(z),n)=f(n)$（$f$ は $n$ で正則）。

**Step 2（留数定理）.** $N$ が大きいとき $f$ の極はすべて $Q_{N}$ の内部にあり、留数定理から
$$
\frac{1}{2\pi i}\oint_{Q_{N}}\pi\cot(\pi z)f(z)\,dz=\sum_{|n|\le N}f(n)+\sum_{a}\operatorname{Res}(\pi\cot(\pi z)f,a).
$$

**Step 3（評価）.** \ref{cx:cot-bound} と仮定から、$Q_{N}$ 上（$|z|\ge N+\frac12$）で $|\pi\cot(\pi z)f(z)|\le\frac{\pi M\coth(\pi/2)}{(N+\frac12)^{2}}$、長さは $8(N+\frac12)$ なので左辺は $0$ に収束する。$\sum_{|n|\le N}f(n)$ は（$|f(n)|\le\frac{M}{n^{2}}$ なので絶対収束する）級数の和に収束する。
:::

::: example
1. $\sum_{n\ge1}\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$。$f(z)=\frac{1}{z^{2}}$ は $0$ が整数なので直接は使えないが、証明の Step 2 で $0$ での留数を別に扱えばよい：$\frac{\pi\cot\pi z}{z^{2}}$ の $0$ での留数は $-\frac{\pi^{2}}{3}$（\ref{cx:residue-computation} の例 3）で、$\sum_{n\neq0}\frac{1}{n^{2}}+\bigl(-\frac{\pi^{2}}{3}\bigr)=0$。よって $2\sum_{n\ge1}\frac{1}{n^{2}}=\frac{\pi^{2}}{3}$。
2. 同様に $\frac{\pi\cot\pi z}{z^{4}}$ の $0$ での留数 $-\frac{\pi^{4}}{45}$ から $\sum_{n\ge1}\frac{1}{n^{4}}=\frac{\pi^{4}}{90}$。
3. $a>0$ について $\sum_{n\in\mathbb{Z}}\frac{1}{n^{2}+a^{2}}=\frac{\pi}{a}\coth\pi a$。極 $\pm ia$ での留数の和は $\frac{\pi\cot(\pi ia)}{2ia}+\frac{\pi\cot(-\pi ia)}{-2ia}=\frac{\pi\cot(i\pi a)}{ia}=-\frac{\pi\coth\pi a}{a}$（$\cot(iy)=-i\coth y$）。
:::

## 問題 {#cx:sec-di-problems}

::: problem {#cx:prob-di-trig}
$\displaystyle\int_{0}^{2\pi}\frac{dt}{2+\sin t}$ を求めよ。
:::

::: solution
$F(z)=\frac1z\cdot\frac{1}{2+\frac{z-z^{-1}}{2i}}=\frac{2i}{z^{2}+4iz-1}$。極は $z=i(-2\pm\sqrt3)$ で、単位円板の中は $z_{+}=i(\sqrt3-2)$。$\operatorname{Res}=\frac{2i}{2z_{+}+4i}=\frac{2i}{2i\sqrt3}=\frac{1}{\sqrt3}$。積分は $\frac{2\pi}{\sqrt3}\approx3.6276$。
:::

::: problem {#cx:prob-di-rational}
$\displaystyle\int_{-\infty}^{\infty}\frac{x^{2}}{x^{4}+1}dx$ を求めよ。
:::

::: solution
上半平面の極 $e^{i\pi/4}$, $e^{3i\pi/4}$ での留数は $\frac{z^{2}}{4z^{3}}=\frac{1}{4z}$。和は $\frac14(e^{-i\pi/4}+e^{-3i\pi/4})=-\frac{i\sqrt2}{4}$、積分は $\frac{\pi}{\sqrt2}$。
:::

::: problem {#cx:prob-di-fourier}
$a,b>0$ について $\displaystyle\int_{0}^{\infty}\frac{\cos ax}{x^{2}+b^{2}}dx=\frac{\pi}{2b}e^{-ab}$ を示せ。
:::

::: solution
$\int_{-\infty}^{\infty}\frac{e^{iax}}{x^{2}+b^{2}}dx=2\pi i\frac{e^{-ab}}{2ib}=\frac{\pi}{b}e^{-ab}$（\ref{cx:fourier-integral}）。実部をとり、偶関数なので半分。（$a=2$, $b=3$ で $\frac{\pi}{6}e^{-6}\approx0.0012979$。）
:::

計算練習と、ほかのページの結果と組み合わせる演習は \ref{cx:sec-di-exercises} にまとめた。
