# 留数と調和関数（Residues and Harmonic Functions）

回転数と一般のコーシーの定理（ホモロジー版・単連結領域）、留数定理と偏角の原理・ルーシェの定理・開写像定理、留数による定積分と級数の計算、調和関数とポアソン積分・ディリクレ問題・鏡像原理（杉浦『解析入門 II』第 IX 章 §6〜§9 を参考）。

<p class="mn-msc">MSC2020: 30A</p>

## 前提知識

- [複素解析 › 基本事項](../../../04-analysis/02-complex-analysis/01-basics/index.html)（全体、6 ページ）：コーシーの積分公式・ローラン展開
- [代数的位相幾何学 › ホモトピー論](../../../05-geometry-topology/02-algebraic-topology/01-homotopy/index.html) [§1](../../../05-geometry-topology/02-algebraic-topology/01-homotopy/01-fundamental-group.html)〜[§3](../../../05-geometry-topology/02-algebraic-topology/01-homotopy/03-van-kampen.html)（基本群 〜 ファン・カンペンの定理）：円周の基本群と単連結性
