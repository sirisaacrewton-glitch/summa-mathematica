# 計算機科学の様相論理（Modal Logics in Computer Science）

双模倣と有限モデル性・計算量、ギーチ論理、命題動的論理 PDL、時相論理 LTL・CTL とモデル検査、様相 μ 計算とパリティゲーム、ホーア論理。各体系について健全性・完全性・決定可能性（と計算量）を示す（参考：『コンピュータサイエンスにおける様相論理』）。

<p class="mn-msc">MSC2020: 03B45</p>

## 前提知識

- [一般論理 › 様相論理](../../../03-mathematical-logic/03B-general-logic/03-modal-logic/index.html)（全体、7 ページ）：クリプキ意味論・健全性・完全性・カノニカルモデル
- [計算理論 › 計算複雑性](../../../03-mathematical-logic/03D-computability-theory/04-complexity/index.html)（全体、16 ページ）：NP・PSPACE・多項式時間還元（計算量の節）
