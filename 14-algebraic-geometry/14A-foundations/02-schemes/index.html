# スキーム（Schemes）

環のスペクトルと構造層、スキームと環の圏の反同値、スキームの性質とファイバー積、分離射と固有射、準連接層、Proj、因子と直線束、コホモロジー、曲線のリーマン–ロッホの定理。グロタンディークの定義の意図と永田の反例への対処にも触れる。

<p class="mn-msc">MSC2020: 14A15</p>
