# 分離射と固有射 {#ag:page-separated-proper keywords="diagonal morphism, diagonal is an immersion, separated morphism, affine morphisms are separated, projective space P^n_A is separated, affine line with doubled origin is not separated, valuative criterion of separatedness, universally closed, proper morphism, A^1 is not proper, main theorem of elimination theory, projective varieties are complete, regular functions on projective varieties are constant, Nagata compactification"}

位相空間がハウスドルフであることは「対角線 $\Delta\subset X\times X$ が閉」と同値である。ザリスキ位相はハウスドルフからほど遠いが、スキームの**ファイバー積**の対角射が閉埋め込みであることを**分離性**と定義すると、ハウスドルフ性の代わりとしてうまく働く。同様に、コンパクト性の代わりに「どんな底変換の後でも閉写像」という**固有性**を定義する。後半では古典的な場合に、射影空間からの射影が閉写像であること（**消去法の主定理**）を射影零点定理から示し、その系として**射影多様体上の大域的な正則関数は定数**であること（\ref{ag:page-projective-varieties} で予告）を証明する。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-sep-notation}

::: notation
- ファイバー積・射の貼り合わせ・開集合への制限は \ref{ag:fiber-product}, \ref{ag:morphisms-glue}（証明の Step 2：$p^{-1}(U)\cap q^{-1}(V)=U\times_{S}V$）。閉埋め込みとアフィンの場合は \ref{ag:immersions}, \ref{ag:closed-immersion-affine}。アフィンのファイバーは \ref{ag:affine-fiber}。
- $f:X\to S$ の**対角射** $\Delta=\Delta_{X/S}:X\to X\times_{S}X$ は、$(1_{X},1_{X})$ に対応する射（$p\Delta=q\Delta=1_{X}$）。
- 古典的な部分：$k$ は代数的閉体、$S=k[x_{0},\dots,x_{n}]$、$S_{d}$ は $d$ 次斉次多項式の空間、$S_{+}=(x_{0},\dots,x_{n})$。射影空間・射影代数的集合・射影零点定理・正則関数は \ref{ag:projective-space}, \ref{ag:projective-algebraic-set}, \ref{ag:projective-nullstellensatz}, \ref{ag:quasi-projective-regular}。正則関数は連続（\ref{ag:regular-functions-sheaf} の 1）。
- 線形代数：$N\times M$ 行列の定める線形写像 $k^{M}\to k^{N}$ が全射 $\iff$ ある $N$ 次小行列式が $0$ でない（\ref{lin:rank-minors}。線形代数の系列で扱う予定）。
- **選択公理**：\ref{ag:fiber-product} と \ref{ag:closed-immersion-affine} を通して使う。古典的な部分は射影零点定理を通して使う（零点定理の証明に依存）。
:::

## 分離射 {#ag:sec-sep-separated}

::: proposition 対角射ははめ込み {#ag:diagonal-immersion keywords="the diagonal is a closed immersion onto a closed subset of an open subscheme; for affine morphisms the diagonal is a closed immersion" index="対角射|たいかくしゃ"}
（AC）射 $f:X\to S$ について：
1. $X=\operatorname{Spec}A$, $S=\operatorname{Spec}R$ なら、$\Delta$ は乗法 $\mu:A\otimes_{R}A\to A$, $a\otimes b\mapsto ab$ に対応し、閉埋め込み。
2. 一般に、$X\times_{S}X$ の開集合 $W$ で $\Delta(X)\subset W$ となり、$\Delta:X\to W$ が閉埋め込みとなるものがある。
3. したがって、$\Delta$ が閉埋め込み $\iff$ $\Delta(X)$ が $X\times_{S}X$ の閉集合。
:::

::: proof
**Step 1（1）.** \ref{ag:fiber-product} の Step 1 で、$(1_{X},1_{X})$ は $(1_{A},1_{A})$ に、したがって余積の普遍性で $\mu$ に対応する。$\mu$ は全射（$\mu(a\otimes1)=a$）なので $A\cong(A\otimes_{R}A)/\ker\mu$ で、\ref{ag:closed-immersion-affine} の 1 から閉埋め込み。

**Step 2（2：局所的な閉埋め込み）.** $S$ のアフィン開集合 $V$ と、$f^{-1}(V)$ に含まれる $X$ のアフィン開集合 $U$ をとる。$U\times_{S}U=p^{-1}(U)\cap q^{-1}(U)$ は $X\times_{S}X$ の開集合で、$U\times_{V}U$ と一致する（$U\to S$ は $V$ を経由し、$V\to S$ はモノ射：\ref{ag:morphisms-glue} の 2）。$\Delta^{-1}(U\times_{S}U)=U$（$p\Delta=1$ から $\Delta(x)\in p^{-1}(U)\iff x\in U$）で、制限 $U\to U\times_{V}U$ は $U$ の対角射なので、1 から閉埋め込み。

**Step 3（2：まとめ）.** $W\defeq\bigcup_{U}U\times_{S}U$（$U$ は Step 2 の形のものすべて、これらは $X$ を覆う）とする。$\Delta(X)\subset W$。閉埋め込みであることは底の開被覆で局所的に確かめられる：$\Delta$ は単射（$p\Delta=1$）、各 $U\times_{S}U$ との交わりで像は閉、茎の全射性は各点の性質。また $W$ の各点はある $U\times_{S}U$ に入り、その中で $\Delta(X)\cap(U\times_{S}U)=\Delta(U)$ は閉なので、$\Delta(X)$ は $W$ の閉集合。$\Delta:X\to\Delta(X)$ は連続な全単射で、逆写像は $p|_{\Delta(X)}$（連続）なので同相。

**Step 4（3）.** ⇒ は定義。⇐：$\Delta(X)$ が閉なら、2 の $W$ について $\Delta:X\to W$ が閉埋め込みで、$\Delta(X)$ は $X\times_{S}X$ でも閉、茎の全射性は $W$ の外では茎 $(\Delta_{*}\mathcal{O}_{X})_{z}=0$（$z\notin\Delta(X)$ は閉集合 $\Delta(X)$ と交わらない近傍をもつ）なので自明。
:::

::: definition 分離射 {#ag:separated keywords="separated morphism: the diagonal is a closed immersion; separated scheme: separated over Spec Z" index="分離射|ぶんりしゃ, 分離スキーム|ぶんりすきーむ"}
射 $f:X\to S$ が**分離的**であるとは、$\Delta_{X/S}$ が閉埋め込み（同値に、\ref{ag:diagonal-immersion} の 3 から $\Delta(X)$ が閉）であることをいう。$X\to\operatorname{Spec}\mathbb{Z}$ が分離的なとき、$X$ を**分離スキーム**という。\ref{ag:diagonal-immersion} の 1 から、アフィンスキームの間の射はすべて分離的。
:::

::: proposition アフィン開被覆による判定 {#ag:separated-criterion keywords="X over affine S is separated if it has an affine open cover U_i with U_i cap U_j affine and O(U_i) tensor O(U_j) -> O(U_i cap U_j) surjective" index="分離性の判定|ぶんりせいのはんてい"}
（AC）$S=\operatorname{Spec}R$ とし、$X$ が $S$ 上のスキームで、アフィン開被覆 $\{U_{i}\}$ が次をみたすとする：各 $U_{i}\cap U_{j}$ がアフィンで、$\mathcal{O}(U_{i})\otimes_{R}\mathcal{O}(U_{j})\to\mathcal{O}(U_{i}\cap U_{j})$, $a\otimes b\mapsto a|\cdot b|$ が全射。このとき $X$ は $S$ 上分離的。
:::

::: proof
**Step 1（被覆）.** $X\times_{S}X$ は $U_{i}\times_{S}U_{j}=p^{-1}(U_{i})\cap q^{-1}(U_{j})$ で覆われる（\ref{ag:fiber-product} の Step 2・3）。

**Step 2（逆像）.** $\Delta(x)\in p^{-1}(U_{i})\cap q^{-1}(U_{j})\iff x\in U_{i}\cap U_{j}$（$p\Delta=q\Delta=1$）なので $\Delta^{-1}(U_{i}\times_{S}U_{j})=U_{i}\cap U_{j}$。

**Step 3（各片で閉埋め込み）.** 制限 $U_{i}\cap U_{j}\to U_{i}\times_{S}U_{j}=\operatorname{Spec}(\mathcal{O}(U_{i})\otimes_{R}\mathcal{O}(U_{j}))$ は、\ref{ag:fiber-product} の Step 1 から、二つの包含に対応する環準同型の組、すなわち仮定の写像に対応する。$U_{i}\cap U_{j}$ はアフィンで、この写像は全射なので、\ref{ag:closed-immersion-affine} の 1 から閉埋め込み。とくに $\Delta(X)\cap(U_{i}\times_{S}U_{j})=\Delta(U_{i}\cap U_{j})$ は閉。

**Step 4（まとめ）.** $\Delta(X)$ は開被覆の各片との交わりが閉なので閉。\ref{ag:diagonal-immersion} の 3 から分離的。
:::

::: remark 判定法の逆
逆に、$X$ が $S=\operatorname{Spec}R$ 上分離的なら、任意のアフィン開集合 $U,V$ について $U\cap V$ はアフィンで、上の写像は全射である。これには「アフィンスキームの閉部分スキームはアフィン」が必要で、準連接層の理論を使って \ref{ag:separated-affine-intersection} で示す。
:::

::: example 射影空間と原点が二重の直線 {#ag:separated-examples}
1. **射影空間** $\mathbb{P}^{n}_{A}$：$U_{i}\defeq\operatorname{Spec}A[x_{0}/x_{i},\dots,x_{n}/x_{i}]$（$n$ 変数の多項式環）を、$U_{i}\supset D(x_{j}/x_{i})$ と $U_{j}\supset D(x_{i}/x_{j})$ で $x_{k}/x_{j}\mapsto(x_{k}/x_{i})(x_{j}/x_{i})^{-1}$ により貼り合わせる（コサイクル条件は分数の計算そのもの）。$U_{i}\cap U_{j}=\operatorname{Spec}A[x_{0}/x_{i},\dots,x_{n}/x_{i}][(x_{j}/x_{i})^{-1}]$ はアフィンで、この環は $x_{k}/x_{i}$（$U_{i}$ の座標）と $(x_{j}/x_{i})^{-1}=x_{i}/x_{j}$（$U_{j}$ の座標の像）で生成されるので、\ref{ag:separated-criterion} の写像は全射。よって $\mathbb{P}^{n}_{A}$ は $\operatorname{Spec}A$ 上分離的。
2. **原点が二重の直線**（\ref{ag:scheme-examples} の 2）：$X=U\cup V$, $U=\operatorname{Spec}k[t]$, $V=\operatorname{Spec}k[s]$, $U\cap V$ は $D(t)=D(s)$ で $s=t$ と同一視。$U\times_{k}V=\operatorname{Spec}k[t,s]$ で、$\Delta^{-1}(U\times_{k}V)=U\cap V$、その上の $\Delta$ は $k[t,s]\to k[t,t^{-1}]$, $t,s\mapsto t$ に対応する。その像は（\ref{ring:localization-primes} と \ref{ag:spec-functor} から）$t-s$ を含み $t$ を含まない素イデアルの集合 $V(t-s)\cap D(t)$ で、閉包は $V(t-s)$（既約な $V(t-s)\cong\mathbb{A}^{1}$ の空でない開集合は稠密）なので点 $(t,s)$ を含むが、$(t,s)\notin D(t)$。よって $\Delta(X)\cap(U\times_{k}V)$ は $U\times_{k}V$ で閉でなく、$X$ は分離的でない。図形的には、二つの原点の組 $(0_{1},0_{2})$ が対角線の閉包に入ってしまう。
:::

::: proposition 分離性の付値判定法（一意性） {#ag:valuative-separated keywords="valuative criterion of separatedness: for separated X over S, morphisms from Spec R agreeing on Spec K are equal" index="付値判定法（分離性）|ふちはんていほうぶんりせい"}
（AC）$f:X\to S$ を分離射、$R$ を付値環（商体 $K$）とし、$i:\operatorname{Spec}K\to\operatorname{Spec}R$ を包含に対応する射とする。$S$ 上の射 $h_{1},h_{2}:\operatorname{Spec}R\to X$ が $h_{1}i=h_{2}i$ をみたせば $h_{1}=h_{2}$。
:::

::: proof
**Step 1（閉点の像が一致）.** $h\defeq(h_{1},h_{2}):\operatorname{Spec}R\to X\times_{S}X$ とする。生成点 $\xi=(0)$ について、$hi=(h_{1}i,h_{2}i)=\Delta\circ h_{1}i$ なので $h(\xi)\in\Delta(X)$。$\operatorname{Spec}R$ の閉点 $\mathfrak{m}$ は $\xi$ の閉包に入り（$V((0))=\operatorname{Spec}R$）、$h$ は連続、$\Delta(X)$ は閉なので $h(\mathfrak{m})\in\Delta(X)$、$h(\mathfrak{m})=\Delta(x)$。$p\Delta=q\Delta=1$ から $h_{1}(\mathfrak{m})=h_{2}(\mathfrak{m})=x$。

**Step 2（アフィン近傍に入る）.** $x$ のアフィン開近傍 $U=\operatorname{Spec}A$ をとる。$h_{1}^{-1}(U)$ は閉点 $\mathfrak{m}$ を含む $\operatorname{Spec}R$ の開集合で、局所環 $R$ の素イデアルはすべて $\mathfrak{m}$ に含まれ、$\mathfrak{m}$ を含む開集合 $D(g)$ は $g\notin\mathfrak{m}$（$g$ は単元）から全体。よって $h_{1},h_{2}$ はともに $U$ を経由する（\ref{ag:morphisms-glue} の 2）。

**Step 3（環準同型の比較）.** \ref{ag:morphisms-to-affine} から $h_{1},h_{2}$ は $\alpha_{1},\alpha_{2}:A\to R$ に対応し、$h_{1}i=h_{2}i$ は $A\to R\hookrightarrow K$ の合成が等しいことを意味する。$R\to K$ は単射なので $\alpha_{1}=\alpha_{2}$、$h_{1}=h_{2}$。
:::

::: remark 付値判定法の逆
$X$ がネーターなら、逆に「任意の付値環について一意性が成り立つ」から $f$ の分離性が従うことが知られている（本サイト未収録。$\Delta(X)$ の閉包に入る点を付値環で捉える議論で、付値環の存在定理を使う）。古典的には、\ref{ag:agreement-closed}（射が一致する集合は閉）が分離性の役割を果たしていた。
:::

## 固有射 {#ag:sec-sep-proper}

::: definition 固有射 {#ag:proper keywords="closed morphism, universally closed, proper morphism: separated, finite type, universally closed" index="固有射|こゆうしゃ, 普遍的に閉|ふへんてきにへい"}
射 $f:X\to S$ が**閉**であるとは、閉集合の像が閉であること。**普遍的に閉**であるとは、任意の $S'\to S$ について底変換 $X\times_{S}S'\to S'$ が閉であること。分離的・有限型（\ref{ag:finite-type}）・普遍的に閉な射を**固有射**という。$k$ 上固有なスキームを**完備**ともいう。
:::

::: example アフィン直線は固有でない {#ag:affine-line-not-proper}
$f:\mathbb{A}^{1}_{k}\to\operatorname{Spec}k$ は閉（終域が 1 点）だが、普遍的に閉でない：$S'=\mathbb{A}^{1}_{k}=\operatorname{Spec}k[x]$ への底変換は射影 $\mathbb{A}^{2}_{k}=\operatorname{Spec}k[x,y]\to\operatorname{Spec}k[x]$ で、閉集合 $Z=V(xy-1)=\operatorname{Spec}k[x,x^{-1}]$ の像は、\ref{ag:affine-fiber} から「ファイバー $k[x,x^{-1}]\otimes_{k[x]}\kappa(\mathfrak{p})$ が $0$ でない」点 $\mathfrak{p}$、すなわち $x\notin\mathfrak{p}$ の集合 $D(x)$。$D(x)$ は閉でない（閉包は全体）。双曲線を $x$ 軸に射影すると原点が抜ける、という「無限遠に逃げる」現象である。
:::

::: remark なぜ「普遍的に」閉か
上の例のとおり、$\operatorname{Spec}k$ への射はいつも閉なので、閉写像という条件だけでは何も言わない。位相空間では、$X$ がコンパクト $\iff$ 任意の位相空間 $T$ について射影 $X\times T\to T$ が閉（クラトフスキ–ムルフカの定理）であることが知られており、固有性の定義はこの特徴付けの翻訳である。ザリスキ位相の積は積位相でないので、「任意の底変換で閉」を要求する必要がある。
:::

::: remark 固有性の付値判定法と射影空間
$f:X\to S$ が有限型で $X$ がネーターのとき、$f$ が固有 $\iff$ 任意の付値環 $R$（商体 $K$）と可換図式 $\operatorname{Spec}K\to X$, $\operatorname{Spec}R\to S$ について、$\operatorname{Spec}R\to X$ への持ち上げがちょうど一つ存在すること、が知られている（**付値判定法**。本サイト未収録）。これから $\mathbb{P}^{n}_{A}\to\operatorname{Spec}A$ は固有であることが従う。持ち上げの存在は、$K$ に値をとる点 $(a_{0}:\dots:a_{n})$ の座標を、付値が最小のもの $a_{j}$ で割ると、すべての座標が $R$ に入り、$a_{j}/a_{j}=1$ なので $U_{j}$ の $R$ 値点になる、という計算に対応する。以下では、古典的な多様体の場合に、射影空間からの射影が閉であることを付値判定法を使わずに直接示す。
:::

## 射影多様体の完備性 {#ag:sec-sep-completeness}

::: definition 積 $\mathbb{P}^{n}\times\mathbb{A}^{m}$ のザリスキ位相 {#ag:product-topology-classical}
$\mathbb{P}^{n}\times\mathbb{A}^{m}$ の部分集合で、$k[y_{1},\dots,y_{m}][x_{0},\dots,x_{n}]$ の元のうち $x$ について斉次なものの族の共通零点として書けるものを閉集合とする（「$f(x,y)=0$」は $x$ の斉次座標の取り方によらない）。同様に $\mathbb{P}^{n}\times\mathbb{P}^{m}$ では、$x$ と $u=(u_{0},\dots,u_{m})$ の両方について斉次な多項式の共通零点を閉集合とする。$\mathbb{P}^{m}$ の標準アフィン被覆 $u_{j}\neq0$ の上では、$u_{j}=1$ とおくと $\mathbb{P}^{n}\times\mathbb{A}^{m}$ の閉集合になる。
:::

::: theorem 消去法の主定理 {#ag:elimination-theorem keywords="main theorem of elimination theory: the projection P^n x A^m -> A^m is closed; projective varieties are complete" index="消去法の主定理|しょうきょほうのしゅていり, 完備性（射影多様体）|かんびせいしゃえいたようたい"}
$k$ を代数的閉体とする。射影 $\pi:\mathbb{P}^{n}\times\mathbb{A}^{m}\to\mathbb{A}^{m}$ は閉集合を閉集合に写す。同様に $\mathbb{P}^{n}\times\mathbb{P}^{m}\to\mathbb{P}^{m}$ も閉写像。
:::

::: proof
**Step 1（設定）.** 閉集合 $Z$ を、$x$ について斉次な $f_{1},\dots,f_{r}$（$x$ についての次数 $d_{1},\dots,d_{r}$）の共通零点とする（ヒルベルトの基底定理 \ref{ring:hilbert-basis} から有限個でよい）。$b\in\mathbb{A}^{m}$ について $f_{i}^{b}(x)\defeq f_{i}(x,b)\in S_{d_{i}}$ とし、$\mathfrak{a}_{b}\defeq(f_{1}^{b},\dots,f_{r}^{b})\subset S$（斉次イデアル）とおく。$b\notin\pi(Z)\iff V(\mathfrak{a}_{b})=\emptyset$。

**Step 2（射影零点定理で言い換え）.** 次を示す：$V(\mathfrak{a}_{b})=\emptyset\iff$ ある $d$ について $S_{d}\subset\mathfrak{a}_{b}$。⇒：\ref{ag:projective-nullstellensatz} の 1 から $\sqrt{\mathfrak{a}_{b}}\supset S_{+}$、よって $x_{j}^{N}\in\mathfrak{a}_{b}$（$N$ は $j$ によらず大きくとる）。$d\ge(n+1)(N-1)+1$ なら、$d$ 次の単項式はどれかの $x_{j}$ を $N$ 乗以上含む（指数の和が $d$ なので）ので $S_{d}\subset\mathfrak{a}_{b}$。⇐：$x_{j}^{d}\in\mathfrak{a}_{b}$ がすべての $j$ で成り立てば、共通零点では $x_{0}=\dots=x_{n}=0$ となり、$\mathbb{P}^{n}$ の点はない。

**Step 3（各 $d$ での条件は開）.** $S_{d}\subset\mathfrak{a}_{b}$ は、線形写像
$$
\Phi_{d,b}:\bigoplus_{i:\,d_{i}\le d}S_{d-d_{i}}\to S_{d},\qquad(g_{i})\mapsto\sum g_{i}f_{i}^{b}
$$
が全射であることと同値（$\mathfrak{a}_{b}$ の $d$ 次の元 $\sum h_{i}f_{i}^{b}$ は、$h_{i}$ をその $d-d_{i}$ 次成分に取り替えても同じ：他の次数の成分は打ち消し合う）。単項式の基底について $\Phi_{d,b}$ の行列の成分は $f_{i}$ の係数、すなわち $b$ の多項式である。全射 $\iff$ ある $\dim S_{d}$ 次の小行列式 $\ne0$（記法の確認）なので、$U_{d}\defeq\{b : \Phi_{d,b}\text{ が全射}\}$ は、有限個の多項式（小行列式）のどれかが $0$ でない点の集合で、$\mathbb{A}^{m}$ の開集合。

**Step 4（結論）.** Step 1〜3 から $\mathbb{A}^{m}\setminus\pi(Z)=\bigcup_{d}U_{d}$ は開、$\pi(Z)$ は閉。

**Step 5（$\mathbb{P}^{m}$ の場合）.** $\mathbb{P}^{m}$ の閉性は標準アフィン被覆 $W_{j}=\{u_{j}\neq0\}\cong\mathbb{A}^{m}$ で確かめればよい：$\pi(Z)\cap W_{j}=\pi(Z\cap(\mathbb{P}^{n}\times W_{j}))$ で、$Z\cap(\mathbb{P}^{n}\times W_{j})$ は $u_{j}=1$ とおいた方程式で定まる $\mathbb{P}^{n}\times\mathbb{A}^{m}$ の閉集合（\ref{ag:product-topology-classical}）なので、Step 4 から $W_{j}$ で閉。各 $W_{j}$ との交わりが閉な集合は閉。
:::

::: corollary 射影多様体上の正則関数 {#ag:projective-regular-constant keywords="global regular functions on a projective variety are constant; morphisms from projective varieties to affine varieties are constant" index="射影多様体上の正則関数|しゃえいたようたいじょうのせいそくかんすう"}
$k$ を代数的閉体、$Y\subset\mathbb{P}^{n}$ を射影多様体（既約な射影代数的集合）とする。
1. $\mathcal{O}(Y)=k$。
2. 射影多様体からアフィン多様体への射は定値。
:::

::: proof
**Step 1（グラフ）.** $\varphi\in\mathcal{O}(Y)$ をとる。$\varphi$ を局所的に表す組 $(g,h)$（同じ次数 $e$ の斉次多項式で、開集合 $Y\cap D(h)$ の上で $\varphi=g/h$）全体を $\mathcal{R}$ とする。**主張**：$(g,h)\in\mathcal{R}$ と $y\in Y$ について $\varphi(y)h(y)=g(y)$（斉次座標の代表を固定して読む；両辺は同じ $e$ 次）。$y\in D(h)$ なら定義から。一般には、$y\in U_{i}=\{x_{i}\neq0\}$ をとると、$\psi\defeq\varphi\cdot(h/x_{i}^{e})-g/x_{i}^{e}$ は $Y\cap U_{i}$ 上の正則関数で、空でない開集合 $Y\cap U_{i}\cap D(h)$ の上で $0$。正則関数は連続なので $\psi$ の零点集合は $Y\cap U_{i}$ の閉集合で、既約な $Y\cap U_{i}$ の稠密な開集合を含むので全体。$x_{i}(y)\neq0$ なので $\varphi(y)h(y)=g(y)$。

**Step 2（グラフは閉）.** $\mathbb{P}^{1}$ の斉次座標を $(u_{0}:u_{1})$ とし、
$$
\Gamma\defeq\{(y,(1:\varphi(y))) : y\in Y\}\subset\mathbb{P}^{n}\times\mathbb{P}^{1}
$$
とおく。$\Gamma=(Y\times\mathbb{P}^{1})\cap\bigcap_{(g,h)\in\mathcal{R}}V(u_{1}h(x)-u_{0}g(x))$ を示す（右辺は \ref{ag:product-topology-classical} の閉集合）。$\subset$：Step 1 から $\varphi(y)h(y)-g(y)=0$。$\supset$：$(y,(u_{0}:u_{1}))$ が右辺にあるとし、$h(y)\neq0$ となる $(g,h)\in\mathcal{R}$ をとる（正則関数の定義）。$u_{1}h(y)=u_{0}g(y)$ で、$u_{0}=0$ なら $u_{1}=0$ となり矛盾、よって $u_{0}\neq0$ で $u_{1}/u_{0}=g(y)/h(y)=\varphi(y)$。

**Step 3（像は 1 点）.** \ref{ag:elimination-theorem} から、$\Gamma$ の $\mathbb{P}^{1}$ への射影 $\{(1:\varphi(y)) : y\in Y\}$ は $\mathbb{P}^{1}$ の閉集合。これは連続写像 $Y\to\mathbb{P}^{1}$, $y\mapsto(1:\varphi(y))$（$\varphi$ と、$\mathbb{A}^{1}$ から開集合 $\{u_{0}\neq0\}$ への同相 $t\mapsto(1:t)$ の合成）による既約な $Y$ の像なので既約で、点 $(0:1)$ を含まないので $\mathbb{P}^{1}$ の真の閉集合。$\mathbb{P}^{1}$ の真の閉集合は、$0$ でない斉次多項式の零点集合を含む集合の共通部分で、2 変数の $0$ でない斉次多項式の零点は有限個（$k$ 上で一次式の積に分解する）なので有限集合。既約な有限集合は 1 点。よって $\varphi$ は定数で、$\mathcal{O}(Y)=k$（定数は正則）。

**Step 4（2）.** 射 $\Phi:Y\to X\subset\mathbb{A}^{N}$ の各座標 $x_{j}\circ\Phi$ は $\mathcal{O}(Y)$ の元なので定数。
:::

::: remark 永田のコンパクト化とグロタンディークの意図
1. **完備だが射影的でない多様体**：完備な多様体は射影的とは限らない（永田・広中の例、\ref{ag:page-curves} の注意）。固有性は「射影空間に埋め込めること」より弱く、位相的な「コンパクト」に近い概念として EGA II で定義された。
2. **永田のコンパクト化**：ネーターな $S$ 上の分離的・有限型の射 $X\to S$ は、開埋め込み $X\hookrightarrow\bar{X}$ と固有射 $\bar{X}\to S$ の合成に分解することが知られている（永田雅宜、1962〜63 年。本サイト未収録）。SGA 4 では、エタールコホモロジーの「コンパクト台の順像」$Rf_{!}$ がこの分解を使って定義されたことが知られている。
3. **分離性の歴史**：EGA I（1960 年）では一般のものを「前スキーム（préschéma）」、分離的なものを「スキーム（schéma）」と呼んでいた。後に（1971 年の EGA I の改訂版などで）分離性を仮定せずに「スキーム」と呼ぶ用語法に改められたことが知られている。分離性はハウスドルフ性の代わりで、\ref{ag:valuative-separated} のように「極限の一意性」を保証する。
:::

::: hypcheck
- **代数的閉体**：\ref{ag:elimination-theorem} の Step 2 で射影零点定理を使い、\ref{ag:projective-regular-constant} の Step 3 で $\mathbb{P}^{1}$ の閉集合の有限性（一次式への分解）に使った。$k=\mathbb{R}$ では射影零点定理が成り立たず（$x_{0}^{2}+x_{1}^{2}$ は $\mathbb{P}^{1}(\mathbb{R})$ に零点をもたないが $S_{d}$ を含まない）、Step 2 の同値が崩れる。
- **既約性**：\ref{ag:projective-regular-constant} の Step 1（一致の原理）と Step 3（像が 1 点）で使った。$Y$ が二点の和なら $\mathcal{O}(Y)=k\times k$。
- **射影的（$\mathbb{P}^{n}$ の閉集合）であること**：$Y$ が準射影なら成り立たない（$\mathbb{A}^{1}\subset\mathbb{P}^{1}$ 上の座標関数）。Step 2 で $Y\times\mathbb{P}^{1}$ が閉であることに使う。
- **分離性**：\ref{ag:valuative-separated} の Step 1 で $\Delta(X)$ が閉であることに使い、それ以外では使わない。付値環であること（$R\to K$ の単射性と局所性）は Step 2・3 で使い、付値の性質そのものは使わない：実際、この一意性は任意の局所整域 $R$ について同じ証明で成り立つ。
- **選択公理**：\ref{ag:fiber-product} と \ref{ag:closed-immersion-affine}、射影零点定理を通して使う。
:::

::: supplement
**前提を変えると.** 消去法の主定理は、任意の環 $A$ について $\mathbb{P}^{n}_{A}\to\operatorname{Spec}A$ が普遍的に閉、という形に一般化され、証明は Step 3 の小行列式の代わりに中山の補題を使って同様にできることが知られている（本サイト未収録）。

**似た定理.** 位相空間では「コンパクト空間からハウスドルフ空間への連続写像は閉」「コンパクト連結複素多様体上の正則関数は定数」（最大値原理）がそれぞれ \ref{ag:elimination-theorem} と \ref{ag:projective-regular-constant} の類似である。

**計算の観点.** \ref{ag:elimination-theorem} の証明は実際に計算できる：$d$ を増やしながら $\Phi_{d,b}$ の階数を調べると、像 $\pi(Z)$ の方程式（小行列式）が得られる。$d$ の上限は、実効的な零点定理（次数の評価）から与えられることが知られている。一般にはグレブナー基底による消去（変数 $x$ を消去する順序）で $\pi(Z)$ の閉包の方程式を計算するが、アフィンの場合は閉包しか得られず（\ref{ag:affine-line-not-proper}）、射影的な場合に限って像そのものが得られる。
:::

## 高い視点 {#ag:sec-sep-viewpoint}

::: remark ハウスドルフとコンパクトの圏論的な翻訳
位相空間の圏で、ハウスドルフ性は「対角線が閉」、コンパクト性は「任意の空間との積からの射影が閉」と、どちらも**積と閉写像**だけで書ける。スキームの圏では積をファイバー積に、閉部分集合を閉埋め込みに置き換えることで、点の集合の位相が貧弱でも同じ定義が意味をもつ。こうして定義した性質は、底変換と合成で保たれるように設計されている（「射の性質」としてのグロタンディークの流儀）。比喩で言えば、分離性は「近づいていく点列の行き先が二つに分かれない」こと、固有性は「点列がどこかへ逃げ出さずに必ず行き先をもつ」ことで、付値環 $\operatorname{Spec}R$ はその「点列」、$\operatorname{Spec}K\to\operatorname{Spec}R$ は「極限をとる前の部分」にあたる。
:::

## 問題 {#ag:sec-sep-problems}

::: problem {#ag:prob-sep-doubled-plane}
二つの $\mathbb{A}^{2}_{k}=\operatorname{Spec}k[x,y]$ を開集合 $\mathbb{A}^{2}\setminus\{0\}$ の上で恒等写像で貼り合わせたスキーム $X$（原点が二重の平面）は分離的でないことを示せ。
:::

::: solution
二つの片を $U=\operatorname{Spec}k[x,y]$, $V=\operatorname{Spec}k[x',y']$ とし、$U\cap V=D(x)\cup D(y)$（$x=x'$, $y=y'$ で同一視）。$U\times_{k}V=\operatorname{Spec}k[x,y,x',y']$ で、$\Delta^{-1}(U\times_{k}V)=U\cap V$。$D(x)$ 上の $\Delta$ は $k[x,y,x',y']\to k[x,y]_{x}$（$x,x'\mapsto x$, $y,y'\mapsto y$）に対応し、像は $x-x'$, $y-y'$ を含み $x$ を含まない素イデアル全体 $V(x-x',y-y')\cap D(x)$（\ref{ring:localization-primes}）。$D(y)$ も同様で、$\Delta(U\cap V)=V(x-x',y-y')\setminus\{\mathfrak{n}\}$（$\mathfrak{n}=(x,y,x',y')$）。$V(x-x',y-y')\cong\mathbb{A}^{2}$ は既約なので、その空でない開集合の閉包は全体で $\mathfrak{n}$ を含む。よって $\Delta(X)\cap(U\times_{k}V)$ は閉でなく、\ref{ag:diagonal-immersion} の 3 から $X$ は分離的でない。
:::

::: problem {#ag:prob-sep-conic-constant}
$k$ を代数的閉体、$Y=V(x_{0}x_{2}-x_{1}^{2})\subset\mathbb{P}^{2}$ とする。$Y$ 上の正則関数 $\varphi$ で、$x_{0}\neq0$ の上で $x_{1}/x_{0}$ と一致するものは存在しないことを示せ。
:::

::: solution
$Y$ は射影多様体：$\nu:\mathbb{P}^{1}\to\mathbb{P}^{2}$, $(s:t)\mapsto(s^{2}:st:t^{2})$ は連続（$V(f)$ の逆像は $V(f(s^{2},st,t^{2}))$）で像は $Y$（$a_{0}\neq0$ なら $(a_{0}:a_{1})\mapsto a_{0}(a_{0}:a_{1}:a_{1}^{2}/a_{0})=(a_{0}:a_{1}:a_{2})$、$a_{0}=0$ なら $a_{1}=0$ で $(0:1)\mapsto(0:0:1)$）、既約な空間の連続像は既約。\ref{ag:projective-regular-constant} から $\varphi$ は定数 $c$。しかし $Y\cap\{x_{0}\neq0\}$ の点 $(1:t:t^{2})$ で $x_{1}/x_{0}=t$ はすべての $t\in k$ をとるので定数でない。矛盾。
:::
