# 局所環付き空間とスキーム {#ag:page-schemes keywords="ringed space, locally ringed space, morphism of locally ringed spaces, local homomorphism, Spec as a locally ringed space, morphisms into an affine scheme correspond to ring homomorphisms into global sections, affine schemes anti-equivalent to rings, scheme, gluing, projective line, affine line with doubled origin, varieties as schemes, functor of points"}

**局所環付き空間**とは、位相空間と、茎がすべて局所環である環の層の組である。$\operatorname{Spec}A$ はその例で、局所環付き空間の射 $X\to\operatorname{Spec}A$ は環準同型 $A\to\Gamma(X,\mathcal{O}_{X})$ と一対一に対応する。とくに**アフィンスキームの圏は可換環の圏の反対圏と同値**になる。局所的にアフィンスキームと同型な局所環付き空間を**スキーム**という。射の定義で茎の準同型に「局所的」であることを要求する理由と、スキームを「点の関手」として見るグロタンディークの視点にも触れる。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-sch-notation}

::: notation
- 層・順像 $f_{*}$・茎・層の射は \ref{cat:sheaf-space}, \ref{cat:direct-image}, \ref{cat:stalk}。順像と逆像の随伴は \ref{cat:inverse-direct-adjunction}。
- 局所環と局所準同型（$\varphi(\mathfrak{m}_{A})\subset\mathfrak{m}_{B}$、同値に $\varphi^{-1}(\mathfrak{m}_{B})=\mathfrak{m}_{A}$）は \ref{ring:local-ring}。
- スペクトル・主開集合・構造層とその性質は \ref{ag:spectrum}, \ref{ag:spec-topology}, \ref{ag:spec-functor}, \ref{ag:structure-sheaf}, \ref{ag:structure-sheaf-properties}。
- **選択公理**：\ref{ag:structure-sheaf-properties}（AC）を通して使う。
:::

## 局所環付き空間 {#ag:sec-sch-lrs}

::: definition 環付き空間と局所環付き空間 {#ag:locally-ringed-space keywords="ringed space, locally ringed space, morphisms (f, f^#), local homomorphisms on stalks" index="環付き空間|かんつきくうかん, 局所環付き空間|きょくしょかんつきくうかん"}
1. **環付き空間** $(X,\mathcal{O}_{X})$ とは、位相空間 $X$ と環の層 $\mathcal{O}_{X}$ の組。射 $(f,f^{\#}):(X,\mathcal{O}_{X})\to(Y,\mathcal{O}_{Y})$ は、連続写像 $f:X\to Y$ と環の層の射 $f^{\#}:\mathcal{O}_{Y}\to f_{*}\mathcal{O}_{X}$ の組。$f^{\#}$ は茎の準同型 $f^{\#}_{x}:\mathcal{O}_{Y,f(x)}\to\mathcal{O}_{X,x}$ を誘導する（$\mathcal{O}_{Y}(V)\to\mathcal{O}_{X}(f^{-1}V)\to\mathcal{O}_{X,x}$ の、$f(x)\in V$ についての余極限）。
2. **局所環付き空間**とは、すべての茎 $\mathcal{O}_{X,x}$ が局所環である環付き空間。その射は、環付き空間の射で、すべての $f^{\#}_{x}$ が局所準同型であるもの。剰余体を $\kappa(x)$ と書く。
:::

::: lemma 単元の開集合 {#ag:invertible-locus keywords="for a section s of a locally ringed space, X_s = {x : s_x is a unit} is open and s is invertible on X_s" index="単元の開集合|たんげんのかいしゅうごう"}
局所環付き空間 $X$ と $s\in\mathcal{O}_{X}(X)$ について、$X_{s}\defeq\{x : s_{x}\notin\mathfrak{m}_{x}\}$（$s_{x}$ が単元）は開集合で、$s|_{X_{s}}$ は $\mathcal{O}_{X}(X_{s})$ の単元。
:::

::: proof
$x\in X_{s}$ なら $s_{x}t_{x}=1$ となる芽 $t_{x}$ があり、ある近傍 $W$ で $s|_{W}t=1$。$W$ の各点で $s$ は単元なので $W\subset X_{s}$、開。逆元は局所的に一意（逆元は一意）なので貼り合わさる。
:::

::: theorem アフィンスキームへの射 {#ag:morphisms-to-affine keywords="Hom_LRS(X, Spec A) = Hom_Ring(A, Gamma(X, O_X)); Spec is fully faithful; affine schemes are anti-equivalent to commutative rings" index="アフィンスキームへの射|あふぃんすきーむへのしゃ, アフィンスキーム|あふぃんすきーむ"}
1. $(\operatorname{Spec}A,\mathcal{O})$ は局所環付き空間。
2. 局所環付き空間 $X$ と環 $A$ について、$(f,f^{\#})\mapsto f^{\#}(\operatorname{Spec}A):A\cong\mathcal{O}(\operatorname{Spec}A)\to\mathcal{O}_{X}(X)$ は全単射
$$
\operatorname{Hom}_{\mathrm{LRS}}(X,\operatorname{Spec}A)\cong\operatorname{Hom}_{\mathrm{Ring}}(A,\Gamma(X,\mathcal{O}_{X})).
$$
3. したがって $A\mapsto\operatorname{Spec}A$ は環の圏の反対圏から局所環付き空間の圏への充満忠実な関手で、その像（と同型なもの、**アフィンスキーム**）の圏は環の圏の反対圏と同値。
:::

::: proof
**Step 1（1）.** 茎は $A_{\mathfrak{p}}$（\ref{ag:structure-sheaf-properties} の 2）で局所環。

**Step 2（射の構成：点の写像）.** 環準同型 $\varphi:A\to\Gamma(X,\mathcal{O}_{X})$ を与える。$x\in X$ について、$A\to\Gamma(X,\mathcal{O}_{X})\to\mathcal{O}_{X,x}$ の合成 $\varphi_{x}$ による極大イデアル $\mathfrak{m}_{x}$ の逆像 $f(x)\defeq\varphi_{x}^{-1}(\mathfrak{m}_{x})$ は素イデアル。$f^{-1}(D(g))=\{x : \varphi(g)_{x}\notin\mathfrak{m}_{x}\}=X_{\varphi(g)}$ は開（\ref{ag:invertible-locus}）なので、$f$ は連続。

**Step 3（射の構成：層の射）.** $\varphi(g)$ は $X_{\varphi(g)}$ 上で単元なので、局所化の普遍性から $A_{g}\to\mathcal{O}_{X}(X_{\varphi(g)})=(f_{*}\mathcal{O}_{X})(D(g))$ が一意に定まり、$D(g')\subset D(g)$ の制限と両立する（普遍性の一意性）。$\mathcal{O}(D(g))=A_{g}$ なので、これは主開集合の基底の上の層の射で、$\mathcal{O}$ の切断は主開集合の上の切断の貼り合わせ（層の条件）なので、層の射 $f^{\#}:\mathcal{O}\to f_{*}\mathcal{O}_{X}$ に一意に延びる。茎の準同型 $f^{\#}_{x}:A_{f(x)}\to\mathcal{O}_{X,x}$ は $a/g\mapsto\varphi_{x}(a)\varphi_{x}(g)^{-1}$ で、$f(x)=\varphi_{x}^{-1}(\mathfrak{m}_{x})$ なので、$f(x)A_{f(x)}$ の元は $\mathfrak{m}_{x}$ に写る：局所準同型。$\Gamma$ をとると $\varphi$ に戻る。

**Step 4（逆向きの一意性）.** 局所環付き空間の射 $(f,f^{\#})$ について $\varphi\defeq f^{\#}(\operatorname{Spec}A)$ とする。$x\in X$, $\mathfrak{p}\defeq f(x)$ について、可換図式 $A\to A_{\mathfrak{p}}\xrightarrow{f^{\#}_{x}}\mathcal{O}_{X,x}$ と $A\xrightarrow{\varphi}\Gamma(X,\mathcal{O}_{X})\to\mathcal{O}_{X,x}$ は一致する（茎の準同型の定義）。$f^{\#}_{x}$ が局所的なので $(f^{\#}_{x})^{-1}(\mathfrak{m}_{x})=\mathfrak{p}A_{\mathfrak{p}}$、その $A$ での逆像は $\mathfrak{p}$。よって $f(x)=\varphi_{x}^{-1}(\mathfrak{m}_{x})$ で、点の写像は $\varphi$ で決まる。層の射も、$A_{g}$ 上では局所化の普遍性から $\varphi$ で決まる。

**Step 5（3）.** 2 で $X=\operatorname{Spec}B$ とすると $\Gamma=B$ なので、$\operatorname{Hom}(\operatorname{Spec}B,\operatorname{Spec}A)\cong\operatorname{Hom}(A,B)$。
:::

::: example 局所性を外すと何が起こるか {#ag:non-local-morphism}
DVR $R$（商体 $K$）について、$X=\operatorname{Spec}K$（1 点 $\ast$）から $Y=\operatorname{Spec}R=\{\mathfrak{m},0\}$ への写像 $f(\ast)=\mathfrak{m}$ と、$f^{\#}:\mathcal{O}_{Y}\to f_{*}\mathcal{O}_{X}$（$f_{*}\mathcal{O}_{X}$ は $\mathfrak{m}$ を含む開集合 $Y$ 上で $K$、$\{0\}$ 上で $0$）を $R\hookrightarrow K$ で定めると、環付き空間の射になる。しかし茎の準同型 $R=\mathcal{O}_{Y,\mathfrak{m}}\to K$ は局所的でない（$\mathfrak{m}$ の元が単元に写る）。$\operatorname{Hom}(R,K)$ の元 $R\hookrightarrow K$ に対応する正しい射は、点を生成点 $0$ に写すものである。局所性の条件がないと、「どの点に写るか」と「関数の引き戻し」が整合しない。
:::

## スキーム {#ag:sec-sch-schemes}

::: definition スキーム {#ag:scheme keywords="scheme: locally ringed space locally isomorphic to affine schemes; open subschemes; morphisms of schemes" index="スキーム|すきーむ, 開部分スキーム|かいぶぶんすきーむ"}
局所環付き空間 $(X,\mathcal{O}_{X})$ で、各点が開近傍 $U$ をもち、$(U,\mathcal{O}_{X}|_{U})$ がアフィンスキームと同型なものを**スキーム**という。スキームの射は局所環付き空間の射。開集合 $U\subset X$ と $\mathcal{O}_{X}|_{U}$ の組は再びスキーム（**開部分スキーム**。アフィンスキームの主開集合はアフィン：$D(f)\cong\operatorname{Spec}A_{f}$、\ref{ag:spec-functor} と \ref{ag:structure-sheaf-properties}）。
:::

::: proposition スキームの貼り合わせ {#ag:gluing-schemes keywords="gluing schemes along open subschemes with cocycle condition; projective line; affine line with doubled origin" index="スキームの貼り合わせ|すきーむのはりあわせ"}
スキーム $X_{i}$（$i\in I$）、開部分スキーム $U_{ij}\subset X_{i}$（$U_{ii}=X_{i}$）、同型 $\varphi_{ij}:U_{ij}\to U_{ji}$ で、$\varphi_{ii}=1$ と、$\varphi_{ij}(U_{ij}\cap U_{ik})=U_{ji}\cap U_{jk}$ および $U_{ij}\cap U_{ik}$ 上で $\varphi_{ik}=\varphi_{jk}\circ\varphi_{ij}$（**コサイクル条件**）をみたすものが与えられると、スキーム $X$ と開埋め込み $\psi_{i}:X_{i}\to X$ で、$X=\bigcup\psi_{i}(X_{i})$, $\psi_{i}(U_{ij})=\psi_{i}(X_{i})\cap\psi_{j}(X_{j})$, $U_{ij}$ 上で $\psi_{i}=\psi_{j}\circ\varphi_{ij}$ となるものがある。
:::

::: proof
**Step 1（空間）.** $\coprod X_{i}$ に「$x\in U_{ij}$ と $\varphi_{ij}(x)\in U_{ji}$ を同一視する」関係を入れる。コサイクル条件から同値関係（反射は $\varphi_{ii}=1$、対称は $\varphi_{ji}=\varphi_{ij}^{-1}$（コサイクル条件で $k=i$）、推移は $\varphi_{ik}=\varphi_{jk}\varphi_{ij}$）。商空間を $X$ とする。各 $X_{i}\to X$ は開集合の上への同相（$U_{ij}$ が開で $\varphi_{ij}$ が同相なので、$X_{i}$ の開集合の飽和は開）。

**Step 2（層）.** 開集合 $V\subset X$ について、$\mathcal{O}_{X}(V)$ を、族 $(s_{i})$（$s_{i}\in\mathcal{O}_{X_{i}}(\psi_{i}^{-1}V)$）で $U_{ij}$ 上 $\varphi_{ij}^{\#}(s_{j})=s_{i}$ をみたすものとする（層の貼り合わせ）。コサイクル条件から $\psi_{i}^{-1}$ への制限は $\mathcal{O}_{X_{i}}$ と同型で、各点の近傍がアフィンスキームと同型なので $X$ はスキーム。
:::

::: example スキームの例 {#ag:scheme-examples}
1. **射影直線** $\mathbb{P}^{1}_{A}$：$X_{0}=\operatorname{Spec}A[t]$, $X_{1}=\operatorname{Spec}A[s]$ を、$U_{01}=D(t)\cong\operatorname{Spec}A[t,t^{-1}]$ と $U_{10}=D(s)$ で $t\mapsto s^{-1}$ により貼り合わせる。$\Gamma(\mathbb{P}^{1}_{A},\mathcal{O})=A[t]\cap A[t^{-1}]=A$（$A[t,t^{-1}]$ の中で）なので、$\mathbb{P}^{1}_{A}$ はアフィンでない（アフィンなら \ref{ag:morphisms-to-affine} から $\operatorname{Spec}A$ と同型になるが、$A$ が体なら点は 1 点でなく無限個）。
2. **原点が二重の直線**：二つの $\operatorname{Spec}k[t]$ を $D(t)$ の上で恒等写像で貼り合わせる。二つの原点 $0_{1},0_{2}$ をもち、包含 $\operatorname{Spec}k[t]\to X$ の二通りは $D(t)$ の上で一致するが全体で異なる。これは**分離性**がないことの典型例（\ref{ag:page-separated-proper}）。
3. **多様体をスキームとみる**：代数閉体 $k$ 上の多様体 $V$ に対し、$V$ の既約閉部分集合の全体 $t(V)$ に位相と構造層を入れるとスキームになり、アフィン多様体 $V$ では $t(V)\cong\operatorname{Spec}A(V)$。$V$ は $t(V)$ の閉点の集合と一致し、多様体の射は $k$ 上のスキームの射と一対一に対応する（関手 $t$ は充満忠実）ことが知られている（本サイトでは、アフィンの場合 \ref{ag:morphisms-coordinate-rings} と \ref{ag:morphisms-to-affine} の比較に留める）。
:::

::: remark 点の関手（グロタンディークの視点）
1. **点の関手**：スキーム $X$ に、関手 $h_{X}\defeq\operatorname{Hom}(\operatorname{Spec}(-),X):\mathbf{Ring}\to\mathbf{Set}$ を対応させる。米田の補題と \ref{ag:morphisms-to-affine} から、$X\mapsto h_{X}$ は充満忠実で、スキームは「環から集合への関手」のうち、局所的に表現可能なもの（ザリスキ位相の層で、アフィン開被覆をもつもの）として特徴づけられることが知られている。$h_{X}(R)$ は「$R$ に値をとる $X$ の点」で、方程式系 $X=\operatorname{Spec}\mathbb{Z}[x]/(f)$ については $h_{X}(R)=\{a\in R^{n} : f(a)=0\}$ という素朴な解の集合である。
2. **相対的な視点**：グロタンディークは「スキーム $X$」ではなく「射 $X\to S$」（$S$ 上のスキーム）を基本の対象とした。体上の多様体は $X\to\operatorname{Spec}k$、整数係数の方程式は $X\to\operatorname{Spec}\mathbb{Z}$ で、後者の各点 $p$ でのファイバーが「$\bmod p$ での還元」になる。性質を射について定義すること（分離・固有・平坦・滑らか）で、族の理論や係数拡大が統一的に扱える。
3. **なぜネーターや有限型を仮定するか**：一般のスキームは非常に広いので、多くの定理はネーターで有限型（さらに優秀）なスキームに限って述べられる。これは永田の病理的な例（\ref{ring:nagata-infinite-dimension}, \ref{ring:nagata-examples}）を避けつつ、整数論と幾何を同時に扱える範囲を選んだものである（\ref{ag:page-dimension} の注意も参照）。
:::

::: hypcheck
- **選択公理**：構造層の性質（\ref{ag:structure-sheaf-properties} の 3）を通して使う。
- **局所準同型の条件**：\ref{ag:morphisms-to-affine} の Step 4 で点の写像を $\varphi$ から復元するのに本質的。\ref{ag:non-local-morphism} がその反例。
- **層の条件**：Step 3 で主開集合上の射を全体に延ばすのに使った。
- 貼り合わせのコサイクル条件は、同値関係の推移律と、層の貼り合わせの整合性に使った。
:::

::: supplement
**前提を変えると.** 局所環付き空間の代わりに「環付きトポス」を使うと、エタール位相などの他のグロタンディーク位相の上のスキーム（代数空間・スタック）に一般化される（本サイト未収録。エタール位相は \ref{cat:page-etale-site}）。

**計算の観点.** アフィンスキームの射は環準同型で、有限表示の環なら生成元の像（有限個の元）を与え、関係式が保たれることを確かめれば射が決まる。
:::

## 高い視点 {#ag:sec-sch-viewpoint}

::: remark 局所的に環、大域的に貼り合わせ
スキームは、多様体が「局所的にユークリッド空間」であるのと同じように、「局所的に可換環」である空間である。\ref{ag:morphisms-to-affine} は、アフィンスキームが「環の反対」そのもので、どんな局所環付き空間からアフィンスキームへの射も大域切断の環準同型だけで決まることを述べる：アフィンスキームは、圏論的には「大域切断関手 $\Gamma$ の右随伴の像」である（$\operatorname{Spec}$ は $\Gamma:\mathrm{LRS}\to\mathbf{Ring}^{\mathrm{op}}$ の右随伴）。比喩で言えば、アフィンスキームは「環という設計図から直接建てた建物」で、一般のスキームはそれらを貼り合わせた都市である。
:::

## 問題 {#ag:sec-sch-problems}

::: problem {#ag:prob-sch-points-over-z}
$X=\operatorname{Spec}\mathbb{Z}[x,y]/(x^{2}+y^{2}-1)$ について、$h_{X}(R)=\operatorname{Hom}(\operatorname{Spec}R,X)$ が $\{(a,b)\in R^{2} : a^{2}+b^{2}=1\}$ と一対一に対応することを示し、$R=\mathbb{F}_{3}$ のときの点の個数を求めよ。
:::

::: solution
\ref{ag:morphisms-to-affine} の 3 から $\operatorname{Hom}(\operatorname{Spec}R,X)\cong\operatorname{Hom}(\mathbb{Z}[x,y]/(x^{2}+y^{2}-1),R)$ で、これは $x,y$ の像 $(a,b)$ で $a^{2}+b^{2}=1$ をみたすものと一対一（多項式環の普遍性と剰余環の普遍性）。$\mathbb{F}_{3}$ では平方は $0,1$ で、$a^{2}+b^{2}=1$ の解は $(0,\pm1)$, $(\pm1,0)$ の 4 個。
:::
