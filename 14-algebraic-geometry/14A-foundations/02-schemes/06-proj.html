# 射影スキームと Proj {#ag:page-proj keywords="graded ring, irrelevant ideal, Proj S, homogeneous prime ideals, V_+, D_+(f), D_+(f) = Spec S_(f), degree zero localization, structure sheaf of Proj, projective space P^n_A = Proj A[x_0,...,x_n], Proj is separated, twisting sheaf O(n), graded module tilde, invertible sheaf, global sections of O(n) on P^n, morphisms to projective space from globally generated line bundles, Veronese embedding, projective morphism"}

次数付き環 $S=\bigoplus_{d\ge0}S_{d}$ から、斉次素イデアル全体 $\operatorname{Proj}S$ にスキームの構造を入れる。鍵は、正の次数の斉次元 $f$ について $D_{+}(f)\cong\operatorname{Spec}S_{(f)}$（$S_{f}$ の次数 $0$ の部分）となることで、これにより \ref{ag:page-projective-varieties} の射影多様体と \ref{ag:separated-examples} の $\mathbb{P}^{n}_{A}$ が同じ枠組みに入る。次数をずらした加群から**ねじれ層** $\mathcal{O}(n)$ を作り、$\Gamma(\mathbb{P}^{n}_{A},\mathcal{O}(n))=A[x_{0},\dots,x_{n}]_{n}$ を計算する。最後に、**大域切断で生成された直線束**から射影空間への射が作れることを示す。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-pj-notation}

::: notation
- 次数付き環 $S=\bigoplus_{d\ge0}S_{d}$（$S_{c}S_{d}\subset S_{c+d}$）は \ref{ring:graded-ring}。$S_{+}\defeq\bigoplus_{d>0}S_{d}$（**無縁イデアル**）。$S_{0}$ は部分環で、各 $S_{d}$ は $S_{0}$ 加群。
- 斉次イデアル（斉次成分で閉じる）とその性質（斉次元で生成される $\iff$ 斉次、素であることは斉次元で判定できる）は \ref{ag:homogeneous-ideal}, \ref{ag:homogeneous-ideal-properties}（多項式環について述べたが、証明は一般の次数付き環でそのまま通る）。
- 斉次元 $f\in S_{e}$ について、$S_{f}$ は $\deg(a/f^{m})=\deg a-me$ で $\mathbb{Z}$ 次数付き環になる。その次数 $0$ の部分を $S_{(f)}\defeq\{a/f^{m} : a\in S_{me}\}$ とする。斉次素イデアル $\mathfrak{p}$ について、$T$ を $\mathfrak{p}$ に含まれない斉次元全体とし、$S_{(\mathfrak{p})}\defeq(T^{-1}S)_{0}$ とする。
- スキーム・貼り合わせ・射の貼り合わせ・分離性の判定は \ref{ag:scheme}, \ref{ag:gluing-schemes}, \ref{ag:morphisms-glue}, \ref{ag:separated-criterion}。準連接層は \ref{ag:quasi-coherent}, \ref{ag:tilde-properties}。
- **選択公理**：\ref{ag:spec-topology} と \ref{ag:structure-sheaf-properties} を通して使う。
:::

## Proj の構成 {#ag:sec-pj-proj}

::: definition 射影スペクトル {#ag:proj keywords="Proj S: homogeneous primes not containing S_+; V_+(a); D_+(f)" index="射影スペクトル|しゃえいすぺくとる, Proj|ぷろじぇくてぃぶ"}
$\operatorname{Proj}S$ を、$S_{+}$ を含まない斉次素イデアル全体とする。斉次イデアル $\mathfrak{a}$ について $V_{+}(\mathfrak{a})\defeq\{\mathfrak{p}\in\operatorname{Proj}S : \mathfrak{p}\supset\mathfrak{a}\}$、斉次元 $f$ について $D_{+}(f)\defeq\{\mathfrak{p} : f\notin\mathfrak{p}\}$ とする。$V_{+}(\mathfrak{a})$ を閉集合として位相を入れる（\ref{ag:spec-topology} の 1 と同じ議論、素イデアルと積は斉次のまま扱える）。
:::

::: lemma Proj の開基 {#ag:proj-basis keywords="D_+(f) for homogeneous f of positive degree form a basis; D_+(f) cap D_+(g) = D_+(fg)" index="Proj の開基|ぷろじぇくてぃぶのかいき"}
1. $D_{+}(f)\cap D_{+}(g)=D_{+}(fg)$。
2. $f$ が正の次数の斉次元を動くとき、$D_{+}(f)$ は $\operatorname{Proj}S$ の開基をなす。$S_{+}$ が斉次元 $f_{1},\dots,f_{r}$ で生成されれば、$\operatorname{Proj}S=\bigcup_{i}D_{+}(f_{i})$。
:::

::: proof
**Step 1（1）.** $\mathfrak{p}$ は素なので $fg\notin\mathfrak{p}\iff f\notin\mathfrak{p}$ かつ $g\notin\mathfrak{p}$。

**Step 2（2）.** 閉集合 $V_{+}(\mathfrak{a})$ の補集合は、$\mathfrak{a}$ の斉次元 $g$（\ref{ag:homogeneous-ideal-properties} の 1）について $D_{+}(g)$ の和。$\mathfrak{p}\in D_{+}(g)$ について、$\mathfrak{p}\not\supset S_{+}$ なので正の次数の斉次元 $h\notin\mathfrak{p}$ がある（$S_{+}$ は正の次数の斉次元で生成され、それらがすべて $\mathfrak{p}$ に入れば $S_{+}\subset\mathfrak{p}$）。$\mathfrak{p}\in D_{+}(gh)\subset D_{+}(g)$ で $gh$ は正の次数。後半：$\mathfrak{p}\not\supset S_{+}$ から、ある $f_{i}\notin\mathfrak{p}$。
:::

::: theorem $D_{+}(f)$ はアフィン {#ag:proj-affine-pieces keywords="D_+(f) is homeomorphic to Spec S_(f) for f homogeneous of positive degree; stalks are S_(p); Proj S is a scheme" index="Proj の局所構造|ぷろじぇくてぃぶのきょくしょこうぞう"}
$f\in S_{e}$（$e>0$）とする。
1. $\psi:D_{+}(f)\to\operatorname{Spec}S_{(f)}$, $\mathfrak{p}\mapsto\mathfrak{p}S_{f}\cap S_{(f)}$ は同相。
2. （AC）$\operatorname{Proj}S$ 上に、「局所的に同じ次数の斉次元の商 $a/h$（$h\notin$ 各点）」である関数の層として構造層 $\mathcal{O}$ を定めると、茎は $S_{(\mathfrak{p})}$ で、$(D_{+}(f),\mathcal{O}|_{D_{+}(f)})\cong\operatorname{Spec}S_{(f)}$。とくに $\operatorname{Proj}S$ はスキームで、$\operatorname{Spec}S_{0}$ 上のスキームになる。
:::

::: proof
**Step 1（$\psi$ は素イデアルを素イデアルに写す）.** $\mathfrak{p}\in D_{+}(f)$ について、$\mathfrak{p}S_{f}$ は $S_{f}$ の素イデアル（\ref{ring:localization-primes}、$f^{m}\notin\mathfrak{p}$）で、その部分環 $S_{(f)}$ への制限は素。具体的には $\psi(\mathfrak{p})=\{a/f^{m} : a\in\mathfrak{p}\cap S_{me}\}$（$a/f^{m}\in\mathfrak{p}S_{f}$ なら $f^{k}a\in\mathfrak{p}$ で、$f\notin\mathfrak{p}$ から $a\in\mathfrak{p}$）。

**Step 2（逆写像の構成）.** $S_{(f)}$ の素イデアル $\mathfrak{q}$ について、$\mathfrak{p}_{d}\defeq\{s\in S_{d} : s^{e}/f^{d}\in\mathfrak{q}\}$、$\mathfrak{p}\defeq\bigoplus_{d}\mathfrak{p}_{d}$ とする。
- 和で閉じる：$s,t\in\mathfrak{p}_{d}$ について $(s+t)^{2e}/f^{2d}=\sum_{i}\binom{2e}{i}s^{i}t^{2e-i}/f^{2d}$。各項は $i\ge e$ なら $(s^{e}/f^{d})\cdot(s^{i-e}t^{2e-i}/f^{d})$、$i<e$ なら $(t^{e}/f^{d})\cdot(s^{i}t^{e-i}/f^{d})$ で、第 2 因子の分子の次数は $(2e-e)d=ed$ なので $S_{(f)}$ の元。よって $((s+t)^{e}/f^{d})^{2}\in\mathfrak{q}$、$\mathfrak{q}$ は素なので $(s+t)^{e}/f^{d}\in\mathfrak{q}$。
- 斉次元の倍で閉じる：$r\in S_{c}$ について $(rs)^{e}/f^{c+d}=(r^{e}/f^{c})(s^{e}/f^{d})\in\mathfrak{q}$。
よって $\mathfrak{p}$ は斉次イデアル。$f^{e}/f^{e}=1\notin\mathfrak{q}$ なので $f\notin\mathfrak{p}$、とくに $\mathfrak{p}\neq S$, $\mathfrak{p}\not\supset S_{+}$。斉次元 $s\in S_{c}$, $t\in S_{d}$ で $st\in\mathfrak{p}$ なら $(s^{e}/f^{c})(t^{e}/f^{d})\in\mathfrak{q}$ から一方が $\mathfrak{q}$ に入るので、\ref{ag:homogeneous-ideal-properties} の 3 から $\mathfrak{p}$ は素。この $\mathfrak{p}$ を $\chi(\mathfrak{q})$ とおく。

**Step 3（互いに逆）.** $\psi\chi(\mathfrak{q})=\mathfrak{q}$：$a\in S_{me}$ について、$a/f^{m}\in\mathfrak{q}\iff(a/f^{m})^{e}=a^{e}/f^{me}\in\mathfrak{q}$（$\mathfrak{q}$ は素）$\iff a\in\chi(\mathfrak{q})$ $\iff a/f^{m}\in\psi\chi(\mathfrak{q})$（Step 1 の記述）。$\chi\psi(\mathfrak{p})=\mathfrak{p}$：$s\in S_{d}$ について $s^{e}/f^{d}\in\psi(\mathfrak{p})\iff s^{e}\in\mathfrak{p}\iff s\in\mathfrak{p}$。

**Step 4（同相）.** 正の次数の斉次元 $g\in S_{d}$ について、$g\notin\mathfrak{p}\iff g^{e}\notin\mathfrak{p}\iff g^{e}/f^{d}\notin\psi(\mathfrak{p})$ なので $\psi(D_{+}(fg))=D(g^{e}/f^{d})$。逆に $S_{(f)}$ の元 $a/f^{m}$ について $D(a/f^{m})=D(a^{e}/f^{me})=\psi(D_{+}(fa))$。開基が開基に写るので同相（\ref{ag:proj-basis}）。

**Step 5（茎）.** $\mathfrak{p}\in D_{+}(f)$, $\mathfrak{q}=\psi(\mathfrak{p})$ について、$(S_{(f)})_{\mathfrak{q}}\to S_{(\mathfrak{p})}$, $(a/f^{m})/(b/f^{n})\mapsto af^{n}/(bf^{m})$（$b\notin\mathfrak{p}$、分子分母は同じ次数）は環の同型（$a\in S_{me}$, $b\in S_{ne}$）。逆写像は、$a,b\in S_{d}$（$b\notin\mathfrak{p}$）について $a/b\mapsto(ab^{e-1}/f^{d})/(b^{e}/f^{d})$（$b^{e}/f^{d}\notin\mathfrak{q}$）。一方の合成は $ab^{e-1}f^{d}/(b^{e}f^{d})=a/b$。他方は、$A\defeq af^{n}$, $B\defeq bf^{m}$ とおくと $(a/f^{m})/(b/f^{n})\mapsto(AB^{e-1}/f^{d'})/(B^{e}/f^{d'})$（$d'=(m+n)e$）で、交差積を比べると $AB^{e-1}\cdot b\cdot f^{m}=aB^{e-1}f^{n}\cdot B=B^{e}\cdot a\cdot f^{n}$ なので元の分数に等しい。

**Step 6（層の同型）.** $D_{+}(f)$ 上の $\mathcal{O}$ の切断（局所的に $a/h$、$\deg a=\deg h$）は、Step 5 の同一視のもとで、$\operatorname{Spec}S_{(f)}$ 上の局所的に $(a'/f^{m})/(h'/f^{n})$ の形の切断と一致する（$a/h=(ah^{e-1}/f^{d})/(h^{e}/f^{d})$ と、Step 4 で $D_{+}(fh)=\psi^{-1}D(h^{e}/f^{d})$）。よって $\psi$ と茎の同型が局所環付き空間の同型を与える。$S_{0}\to S_{(f)}$ はこれらの貼り合わせと両立するので、$\operatorname{Proj}S\to\operatorname{Spec}S_{0}$ が定まる（\ref{ag:morphisms-glue}）。
:::

::: example 射影空間 {#ag:proj-projective-space keywords="P^n_A = Proj A[x_0..x_n]; S_(x_i) = A[x_0/x_i,...,x_n/x_i]" index="射影空間（スキーム）|しゃえいくうかんすきーむ"}
$S=A[x_{0},\dots,x_{n}]$（$\deg x_{i}=1$）とすると $S_{(x_{i})}=A[x_{0}/x_{i},\dots,x_{n}/x_{i}]$（$a/x_{i}^{m}$ で $a$ が $m$ 次の単項式の一次結合なら、各単項式 $x^{\alpha}/x_{i}^{m}=\prod_{j}(x_{j}/x_{i})^{\alpha_{j}}$）。$D_{+}(x_{i})\cap D_{+}(x_{j})=D_{+}(x_{i}x_{j})$ は $D_{+}(x_{i})$ の中で $D(x_{j}/x_{i})$（\ref{ag:proj-affine-pieces} の Step 4 で $e=d=1$）で、貼り合わせの写像は $x_{k}/x_{j}=(x_{k}/x_{i})(x_{j}/x_{i})^{-1}$。よって $\operatorname{Proj}S$ は \ref{ag:separated-examples} の 1 の $\mathbb{P}^{n}_{A}$ と同じスキームである。$A=k$（代数的閉体）のとき、閉点は $\mathbb{P}^{n}$ の点と一対一で、射影多様体 $Y=V(\mathfrak{p})$ は $\operatorname{Proj}S/\mathfrak{p}$ の閉点の集合とみなせる。
:::

::: proposition Proj の分離性 {#ag:proj-separated keywords="if S is generated by S_1 over S_0 then Proj S is separated over Spec S_0" index="Proj の分離性|ぷろじぇくてぃぶのぶんりせい"}
（AC）$S$ が $S_{0}$ 上 $S_{1}$ の元で生成されるとき、$\operatorname{Proj}S$ は $\operatorname{Spec}S_{0}$ 上分離的。とくに $\mathbb{P}^{n}_{A}$ は $\operatorname{Spec}A$ 上分離的（\ref{ag:separated-examples} の 1 の再確認）。
:::

::: proof
$f\in S_{1}$ について $D_{+}(f)$ は $\operatorname{Proj}S$ を覆う（$S_{+}$ は $S_{1}$ で生成されるので \ref{ag:proj-basis} の 2）。$f,g\in S_{1}$ について $D_{+}(f)\cap D_{+}(g)=D_{+}(fg)\cong\operatorname{Spec}S_{(fg)}$ はアフィン。$S_{(fg)}$ の元 $a/(fg)^{m}$（$a\in S_{2m}$）は $(a/f^{2m})\cdot(f/g)^{m}$ と書け、$a/f^{2m}\in S_{(f)}$, $f/g\in S_{(g)}$ なので、$S_{(f)}\otimes_{S_{0}}S_{(g)}\to S_{(fg)}$ は全射。\ref{ag:separated-criterion} から分離的。
:::

::: remark 固有性と射影的な射
$S$ が $S_{0}$ 上 $S_{1}$ の有限個の元で生成されるとき、$\operatorname{Proj}S\to\operatorname{Spec}S_{0}$ は固有であることが知られている（付値判定法による。本サイトでは古典的な場合を \ref{ag:elimination-theorem} で示した）。$S\to T$ が全射な次数付き準同型なら $\operatorname{Proj}T\to\operatorname{Proj}S$ は閉埋め込みになり、$\mathbb{P}^{n}_{A}$ の閉部分スキームはすべて $\operatorname{Proj}A[x_{0},\dots,x_{n}]/I$（$I$ は斉次イデアル）の形に書けることも知られている（本サイト未収録）。

**射影的な射の二つの定義**：ハーツホーンの教科書では $X\to Y$ が射影的とは $\mathbb{P}^{n}_{Y}$ への閉埋め込みを経由することとし、EGA II では準連接な次数付き $\mathcal{O}_{Y}$ 代数の $\operatorname{Proj}$ として書けること（同値に、ある準連接層 $\mathcal{E}$ の $\mathbb{P}(\mathcal{E})$ への閉埋め込み）とする。両者は一般には異なり、$Y$ がアフィン（より一般に $Y$ が豊富な直線束をもつ準コンパクトなスキーム）なら一致することが知られている。EGA の定義は底 $Y$ の上で局所的に決まるように作られている。
:::

## ねじれ層 $\mathcal{O}(n)$ {#ag:sec-pj-twisting}

::: definition 次数付き加群に付随する層とねじれ層 {#ag:twisting-sheaf keywords="graded S-module M, M tilde on Proj S, shift M(n), twisting sheaf O(n) = S(n) tilde, invertible sheaf" index="ねじれ層|ねじれそう, 可逆層|かぎゃくそう, 直線束|ちょくせんそく"}
1. 次数付き $S$ 加群 $M=\bigoplus_{d\in\mathbb{Z}}M_{d}$ について、$\operatorname{Proj}S$ 上の $\mathcal{O}$ 加群 $\widetilde{M}$ を、局所的に $m/h$（$m\in M_{d}$, $h\in S_{d}$ 斉次、$h\notin$ 各点）である切断の層とする。茎は $M_{(\mathfrak{p})}$（次数 $0$ の部分）で、\ref{ag:proj-affine-pieces} と同じ議論で $\widetilde{M}|_{D_{+}(f)}\cong(M_{(f)})^{\sim}$（$M_{(f)}$ は $M_{f}$ の次数 $0$ の部分、$S_{(f)}$ 加群）。とくに $\widetilde{M}$ は準連接。
2. $M(n)_{d}\defeq M_{n+d}$ とし、$\mathcal{O}(n)\defeq S(n)^{\sim}$ を**ねじれ層**という。
3. $\mathcal{O}_{X}$ 加群 $\mathcal{L}$ が**可逆層**（**直線束**）とは、開被覆 $U_{i}$ で $\mathcal{L}|_{U_{i}}\cong\mathcal{O}_{U_{i}}$ となるものがあることをいう。
:::

::: proposition ねじれ層の性質 {#ag:twisting-sheaf-properties keywords="O(n) is invertible when S is generated by S_1; O(n)|_{D_+(f)} is generated by f^n; global sections of O(n) on P^n_A are homogeneous polynomials of degree n" index="ねじれ層の性質|ねじれそうのせいしつ"}
1. $f\in S_{1}$ について、$S(n)_{(f)}=f^{n}S_{(f)}$ は $f^{n}/1$ で生成される階数 1 の自由 $S_{(f)}$ 加群（$f^{n}/1$ は $S_{f}$ の次数 $n$ の元）。よって $S$ が $S_{0}$ 上 $S_{1}$ で生成されれば、$\mathcal{O}(n)$ は可逆層で、$D_{+}(f)$ 上 $f^{n}$ を基底とする。
2. $S=A[x_{0},\dots,x_{n}]$（$n\ge1$）、$X=\mathbb{P}^{n}_{A}$ について $\Gamma(X,\mathcal{O}(m))\cong S_{m}$（$m\ge0$）、$\Gamma(X,\mathcal{O}(m))=0$（$m<0$）。
:::

::: proof
**Step 1（1）.** $S(n)_{(f)}$ の元は $a/f^{k}$（$a\in S_{n+k}$）で、$a/f^{k}=(a/f^{n+k})\cdot f^{n}$、$a/f^{n+k}\in S_{(f)}$。$f^{n}$ は $S_{f}$ で単元なので、$b\mapsto bf^{n}$ は $S_{(f)}\to S(n)_{(f)}$ の単射で、自由。

**Step 2（2：切断の記述）.** $D_{+}(x_{i})$ たちは $X$ を覆い（\ref{ag:proj-basis} の 2）、$\Gamma(D_{+}(x_{i}),\mathcal{O}(m))=S(m)_{(x_{i})}=(S_{x_{i}})_{m}$（$S_{x_{i}}$ の次数 $m$ の部分）。$x_{j}$ は $S$ の非零因子なので $S_{x_{i}}\to S_{x_{i}x_{j}}\to S'\defeq S_{x_{0}\cdots x_{n}}$ は単射で、層の条件から $\Gamma(X,\mathcal{O}(m))\cong\bigcap_{i}(S_{x_{i}})_{m}$（$S'_{m}$ の中で）。

**Step 3（2：共通部分の計算）.** $S'=A[x_{0}^{\pm1},\dots,x_{n}^{\pm1}]$ は単項式 $x^{\alpha}$（$\alpha\in\mathbb{Z}^{n+1}$）を $A$ 上の基底にもち、$S_{x_{i}}$ は「$j\neq i$ について $\alpha_{j}\ge0$」の単項式で張られる。$n\ge1$ なので、各 $j$ について $i\neq j$ をとれば、共通部分の元に現れる単項式は $\alpha_{j}\ge0$ をすべての $j$ でみたし、次数 $m=\sum\alpha_{j}$ の多項式、すなわち $S_{m}$ の元。$m<0$ ならそのような単項式はない。
:::

::: theorem 射影空間への射 {#ag:morphism-to-projective-space keywords="an invertible sheaf L with global sections s_0..s_n generating it defines a morphism X -> P^n_A with x_j/x_i pulled back to s_j/s_i" index="射影空間への射|しゃえいくうかんへのしゃ, 大域切断で生成される|たいいきせつだんでせいせいされる"}
$X$ を $A$ 上のスキーム、$\mathcal{L}$ を可逆層、$s_{0},\dots,s_{n}\in\Gamma(X,\mathcal{L})$ が $\mathcal{L}$ を**生成する**（各 $x$ で芽 $s_{i,x}$ が $\mathcal{L}_{x}$ を $\mathcal{O}_{X,x}$ 加群として生成する）とする。このとき $A$ 上の射 $\varphi:X\to\mathbb{P}^{n}_{A}$ で、$X_{i}\defeq\{x : s_{i,x}\text{ が }\mathcal{L}_{x}\text{ を生成}\}$ について $\varphi^{-1}(D_{+}(x_{i}))=X_{i}$ かつ $X_{i}$ 上で $\varphi^{\#}(x_{j}/x_{i})=s_{j}/s_{i}$ となるものがただ一つある。
:::

::: proof
**Step 1（$X_{i}$ と比 $s_{j}/s_{i}$）.** $\mathcal{L}|_{U}\cong\mathcal{O}_{U}$ となる開集合 $U$ で $s_{i}$ が $a\in\mathcal{O}(U)$ に対応するなら、$X_{i}\cap U=U_{a}$（$\mathcal{L}_{x}\cong\mathcal{O}_{X,x}$ を $a_{x}$ が生成 $\iff a_{x}$ が単元）なので $X_{i}$ は開（\ref{ag:invertible-locus}）。$X_{i}$ 上では $\mathcal{O}\to\mathcal{L}$, $b\mapsto bs_{i}$ が茎で同型なので層の同型で、$s_{j}|_{X_{i}}=a_{ji}s_{i}$ となる $a_{ji}\in\mathcal{O}(X_{i})$ がただ一つある。これを $s_{j}/s_{i}$ と書く。生成の仮定から $X=\bigcup X_{i}$。

**Step 2（比の関係）.** $X_{i}\cap X_{j}$ 上で $s_{k}=a_{ki}s_{i}=a_{kj}s_{j}=a_{kj}a_{ji}s_{i}$ なので $a_{ki}=a_{kj}a_{ji}$。とくに $a_{ij}a_{ji}=a_{ii}=1$。また $X_{i}$ の中で $X_{i}\cap X_{j}=(X_{i})_{a_{ji}}$（$s_{j}=a_{ji}s_{i}$ が生成 $\iff a_{ji}$ が単元）。

**Step 3（各片の射）.** \ref{ag:morphisms-to-affine} から、$A[x_{0}/x_{i},\dots,x_{n}/x_{i}]\to\mathcal{O}(X_{i})$, $x_{j}/x_{i}\mapsto a_{ji}$ に対応する射 $\varphi_{i}:X_{i}\to D_{+}(x_{i})$ がある。$\varphi_{i}^{-1}(D(x_{j}/x_{i}))=(X_{i})_{a_{ji}}=X_{i}\cap X_{j}$（\ref{ag:fiber-product} の記法の確認：$\operatorname{Spec}$ の主開集合の逆像は単元の開集合）。

**Step 4（重なりで一致）.** $X_{i}\cap X_{j}$ 上の $\varphi_{i}$ と $\varphi_{j}$ は、どちらもアフィンスキーム $D_{+}(x_{i}x_{j})=\operatorname{Spec}A[x_{k}/x_{i}][x_{i}/x_{j}]$ への射で、環準同型で決まる（\ref{ag:morphisms-to-affine}）。$\varphi_{i}$ は $x_{k}/x_{i}\mapsto a_{ki}$, $x_{i}/x_{j}\mapsto a_{ji}^{-1}=a_{ij}$。$\varphi_{j}$ は $x_{k}/x_{j}\mapsto a_{kj}$ で、$x_{k}/x_{i}=(x_{k}/x_{j})(x_{j}/x_{i})$ は $a_{kj}a_{ji}=a_{ki}$ に写る（Step 2）。生成元の像が一致するので $\varphi_{i}=\varphi_{j}$。\ref{ag:morphisms-glue} で $\varphi$ に貼り合わさる。

**Step 5（一意性と性質）.** $\varphi^{-1}(D_{+}(x_{i}))=X_{i}$ と $\varphi^{\#}(x_{j}/x_{i})=a_{ji}$ から、各 $\varphi|_{X_{i}}$ は \ref{ag:morphisms-to-affine} で一意に決まる。
:::

::: remark 普遍性
上の $\varphi$ について $\varphi^{*}\mathcal{O}(1)\cong\mathcal{L}$ で $\varphi^{*}x_{i}=s_{i}$ となり、逆に射 $X\to\mathbb{P}^{n}_{A}$ から $(\varphi^{*}\mathcal{O}(1),\varphi^{*}x_{i})$ が得られ、$A$ 上の射 $X\to\mathbb{P}^{n}_{A}$ は「可逆層と、それを生成する $n+1$ 個の大域切断の組」の同型類と一対一に対応することが知られている（$\mathcal{O}_{X}$ 加群の引き戻し $\varphi^{*}$ を使う。本サイトでは $\varphi^{*}$ を定義していないので未収録）。これが「$\mathbb{P}^{n}$ は直線の空間（直線束の商の空間）を表現する」という点の関手としての $\mathbb{P}^{n}$ の特徴付けである。
:::

::: example ヴェロネーゼ埋め込み {#ag:veronese}
$X=\mathbb{P}^{1}_{k}$, $\mathcal{L}=\mathcal{O}(2)$ とし、$s_{0}=x_{0}^{2}$, $s_{1}=x_{0}x_{1}$, $s_{2}=x_{1}^{2}$（\ref{ag:twisting-sheaf-properties} の 2 から $\Gamma(\mathcal{O}(2))$ の基底）とする。$D_{+}(x_{0})$ では $s_{0}$ が生成し、$D_{+}(x_{1})$ では $s_{2}$ が生成するので、$\mathcal{L}$ は生成される。\ref{ag:morphism-to-projective-space} の射 $\mathbb{P}^{1}\to\mathbb{P}^{2}$ は、$D_{+}(x_{0})$ 上で $y_{1}/y_{0}\mapsto x_{1}/x_{0}=t$, $y_{2}/y_{0}\mapsto t^{2}$、すなわち閉点では $(1:t)\mapsto(1:t:t^{2})$ で、像は円錐曲線 $V(y_{0}y_{2}-y_{1}^{2})$（\ref{ag:prob-sep-conic-constant} の $\nu$）。$\mathcal{O}(1)$ の 3 つの切断ではこうはならない（$\Gamma(\mathcal{O}(1))$ は 2 次元）。
:::

::: hypcheck
- **$e>0$**：\ref{ag:proj-affine-pieces} で $f$ の次数が正であることは、Step 2 の $f^{e}/f^{e}=1$ と Step 4 の $D(a/f^{m})=\psi(D_{+}(fa))$ に使う。$e=0$ では一般に一致しない：$S=k[x,y]$（$\deg x=\deg y=1$）、$f=1$ なら $D_{+}(1)=\mathbb{P}^{1}_{k}$ だが $S_{(1)}=S_{0}=k$ で $\operatorname{Spec}k$ は 1 点。
- **$S_{1}$ による生成**：\ref{ag:proj-separated} と \ref{ag:twisting-sheaf-properties} の 1 で使う。$S=k[x,y]$（$\deg x=1$, $\deg y=2$）では $\mathcal{O}(1)$ は可逆層でない（$D_{+}(y)$ 上で $S(1)_{(y)}$ は $S_{(y)}$ と同型でない）ことが知られている。
- **$n\ge1$**：\ref{ag:twisting-sheaf-properties} の 2 の Step 3 で、各 $j$ について $i\neq j$ をとるのに使う。$n=0$ なら $\mathbb{P}^{0}_{A}=\operatorname{Spec}A$ で $\Gamma(\mathcal{O}(m))=A$（$m<0$ でも）。
- **生成の仮定**：\ref{ag:morphism-to-projective-space} で $X=\bigcup X_{i}$ に使う。生成しなければ、切断が同時に消える点（**基点**）で射が定義されない（有理写像になる）。
- **選択公理**：\ref{ag:structure-sheaf-properties} と \ref{ag:spec-topology} を通して使う。
:::

::: supplement
**前提を変えると.** $\operatorname{Proj}$ は相対版がある：スキーム $Y$ 上の準連接な次数付き $\mathcal{O}_{Y}$ 代数 $\mathcal{S}$ について、アフィン開集合ごとの $\operatorname{Proj}\mathcal{S}(U)$ を貼り合わせて $\mathbf{Proj}\,\mathcal{S}\to Y$ が作れる（爆発 $\mathbf{Proj}\bigoplus\mathcal{I}^{d}$ はその例。本サイト未収録）。

**似た定理.** セールの定理：$X=\operatorname{Proj}S$（$S$ はネーターな $S_{0}$ 上 $S_{1}$ で有限生成）上の連接層 $\mathcal{F}$ について、$n\gg0$ なら $\mathcal{F}(n)$ は有限個の大域切断で生成されることが知られている（本サイト未収録）。また $\Gamma_{*}(\mathcal{F})=\bigoplus_{n}\Gamma(\mathcal{F}(n))$ から $\mathcal{F}$ が復元される。

**計算の観点.** \ref{ag:twisting-sheaf-properties} の 2 は「射影空間上の $n$ 次の切断＝$n$ 次斉次多項式」で、$\dim_{k}\Gamma(\mathbb{P}^{r}_{k},\mathcal{O}(n))=\binom{n+r}{r}$。\ref{ag:morphism-to-projective-space} の射は、切断の比を局所座標で書き下すだけで計算できる。
:::

## 高い視点 {#ag:sec-pj-viewpoint}

::: remark 次数は $\mathbb{G}_{m}$ の作用
次数付き環 $S$ は、乗法群 $\mathbb{G}_{m}$ の $\operatorname{Spec}S$ への作用（$\lambda\cdot s=\lambda^{d}s$, $s\in S_{d}$）と同じものである。$\operatorname{Proj}S$ は、$\operatorname{Spec}S$ から「錐の頂点」$V(S_{+})$ を除いたものの $\mathbb{G}_{m}$ による商で、$D_{+}(f)\cong\operatorname{Spec}S_{(f)}$ は「$f=1$ という切り口を選ぶと商が見える」ことを表す（不変式 $S_{(f)}$ が商の座標環）。古典的な $\mathbb{P}^{n}=(k^{n+1}\setminus0)/k^{\times}$ そのものである。比喩で言えば、$\operatorname{Proj}$ は錐を光源から見た影で、$\mathcal{O}(n)$ は「重み $n$ で変換する関数」——影の上では関数でなく、直線束の切断になる。
:::

## 問題 {#ag:sec-pj-problems}

::: problem {#ag:prob-pj-one-variable}
$S=A[x]$（$\deg x=1$）について $\operatorname{Proj}S\cong\operatorname{Spec}A$ を示せ。
:::

::: solution
$S_{+}=(x)$ なので $\operatorname{Proj}S=D_{+}(x)$（\ref{ag:proj-basis} の 2）。$S_{(x)}$ の元は $a/x^{m}$（$a\in S_{m}=Ax^{m}$）、すなわち $cx^{m}/x^{m}=c\in A$ なので $S_{(x)}=A$。\ref{ag:proj-affine-pieces} から $\operatorname{Proj}S\cong\operatorname{Spec}A$。
:::

::: problem {#ag:prob-pj-segre-sections}
$X=\mathbb{P}^{1}_{k}$ 上で、$\mathcal{O}(1)$ の大域切断 $s_{0}=x_{0}$, $s_{1}=x_{1}$ が定める射 $X\to\mathbb{P}^{1}_{k}$ は恒等射であることを示せ。
:::

::: solution
$X_{i}=D_{+}(x_{i})$（$x_{i}$ は $D_{+}(x_{i})$ 上で $\mathcal{O}(1)$ の基底：\ref{ag:twisting-sheaf-properties} の 1）。$X_{0}$ 上 $s_{1}=(x_{1}/x_{0})s_{0}$ なので $a_{10}=x_{1}/x_{0}$、射は $x_{1}/x_{0}\mapsto x_{1}/x_{0}$ で $D_{+}(x_{0})$ 上恒等。$X_{1}$ でも同様。\ref{ag:morphism-to-projective-space} の一意性から恒等射。
:::
