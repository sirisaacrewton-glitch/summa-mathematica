# 有理写像と双有理同値 {#ag:page-rational-maps keywords="varieties as quasi-projective varieties, affine open subsets form a basis, morphisms agreeing on a dense open subset agree, rational map, dominant rational map, function field, equivalence between varieties with dominant rational maps and finitely generated field extensions, birational equivalence, rational varieties, Cremona transformation"}

**有理写像**は、空でない開集合の上でだけ定義された射を「定義域を縮める」ことで同一視したものである。像が稠密な（**支配的な**）有理写像は関数体の逆向きの埋め込みを誘導し、**多様体と支配的有理写像の圏は、有限生成な体の拡大 $K/k$ の圏と反同値**になる。この反同値の同型が**双有理同値**で、二つの多様体が双有理同値であることと、関数体が同型であること、同型な開集合をもつことは同値である。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-rm-notation}

::: notation
- 本ページで**多様体**とは準射影多様体（射影多様体の空でない開集合。\ref{ag:projective-algebraic-set}）のこと。アフィン多様体は $\mathbb{A}^{n}\cong U_{0}\subset\mathbb{P}^{n}$ により準射影多様体とみなせる（\ref{ag:standard-affine-charts}）。正則関数・射は \ref{ag:quasi-projective-regular}。
- 座標環・主開集合上の正則関数・関数体・射と座標環は \ref{ag:regular-functions-principal}, \ref{ag:morphisms-coordinate-rings}。$\mathcal{O}(X)$ をアフィン多様体以外の $X$ についても使う。\ref{ag:morphisms-coordinate-rings} の 1 は、$X$ が準射影多様体でも同じ証明で成り立つ（$Y$ がアフィン）。
- 体の拡大の超越次数は \ref{fld:transcendence-degree}。
- **選択公理**：使わない。
:::

## 準備 {#ag:sec-rm-preliminaries}

::: lemma アフィン開集合の基底 {#ag:affine-open-basis keywords="every variety has a basis of open affine subvarieties" index="アフィン開集合の基底|あふぃんかいしゅうごうのきてい"}
多様体 $X$ の各点は、アフィン多様体と同型な開近傍の基本近傍系をもつ。
:::

::: proof
**Step 1.** 標準アフィン被覆により、$X\cap U_{i}$ は準アフィン多様体で、$X$ の開集合（\ref{ag:standard-affine-charts}）。よって $X$ を準アフィン多様体 $Y'$（アフィン多様体 $Y$ の開集合）としてよい。

**Step 2.** $P\in Y'$ と近傍 $W\subset Y'$ について、$Y\setminus W$ は閉で $P$ を含まないので、それを含む $V_{Y}(\bar f)$ で $f(P)\neq0$ となるものがある（$P\notin Y\setminus W=V_{Y}(\mathfrak{b})$ から、$\mathfrak{b}$ の元 $f$ で $f(P)\neq0$）。$D_{Y}(f)$ は $P$ を含み $W$ に含まれ、$D_{Y}(f)\cong V(\mathfrak{p},x_{n+1}f-1)\subset\mathbb{A}^{n+1}$（$\mathfrak{p}=I(Y)$；座標環は $A(Y)_{f}$、\ref{ag:regular-functions-principal} と \ref{ag:morphisms-coordinate-rings} の 2）はアフィン多様体。
:::

::: lemma 一致する集合は閉 {#ag:agreement-closed keywords="for morphisms phi, psi: X -> Y the locus where they agree is closed; two morphisms agreeing on a nonempty open set are equal" index="一致の集合|いっちのしゅうごう"}
多様体の射 $\varphi,\psi:X\to Y$ について、$\{P\in X : \varphi(P)=\psi(P)\}$ は閉集合。したがって $\varphi$ と $\psi$ が空でない開集合上で一致すれば $\varphi=\psi$。
:::

::: proof
**Step 1（射影空間への射に帰着）.** $Y\subset\mathbb{P}^{n}$ なので、$\varphi,\psi$ を $X\to\mathbb{P}^{n}$ とみなしてよい。

**Step 2（局所的な方程式）.** 点 $P$ の近傍 $W$ で $\varphi(W)\subset U_{i}$, $\psi(W)\subset U_{j}$ となるものをとると、$W$ 上で $\varphi=(f_{0}:\dots:f_{n})$, $\psi=(g_{0}:\dots:g_{n})$（$f_{l},g_{l}\in\mathcal{O}(W)$, $f_{i}=1$, $g_{j}=1$）と書ける（$U_{i}\cong\mathbb{A}^{n}$ の座標の引き戻し）。$\varphi(Q)=\psi(Q)$ $\iff$ 斉次座標が比例 $\iff$ すべての $l,m$ で $f_{l}(Q)g_{m}(Q)=f_{m}(Q)g_{l}(Q)$。正則関数は連続なので、これは $W$ の閉集合。閉であることは局所的なので、一致の集合は $X$ で閉。

**Step 3.** 一致の集合は閉で空でない開集合を含み、$X$ は既約なので開集合は稠密、したがって $X$ 全体。
:::

## 有理写像 {#ag:sec-rm-rational}

::: definition 有理写像と支配的 {#ag:rational-map keywords="rational map as an equivalence class of morphisms on nonempty open sets; dominant rational map" index="有理写像|ゆうりしゃぞう, 支配的な有理写像|しはいてきなゆうりしゃぞう"}
多様体 $X,Y$ について、組 $(U,\varphi)$（$U\subset X$ は空でない開集合、$\varphi:U\to Y$ は射）に、$U\cap V$ 上で $\varphi=\psi$ のとき $(U,\varphi)\sim(V,\psi)$ と同値関係を入れる（推移律は \ref{ag:agreement-closed}：$U\cap V\cap W$ 上で一致すれば $U\cap W$ 上で一致）。同値類を**有理写像** $X\dashrightarrow Y$ という。代表 $\varphi(U)$ が $Y$ で稠密なとき（代表によらない）、**支配的**という。
:::

::: proposition 支配的有理写像の合成と関数体 {#ag:dominant-composition keywords="dominant rational maps can be composed and induce k-embeddings of function fields" index="支配的有理写像の合成|しはいてきゆうりしゃぞうのごうせい"}
1. 支配的有理写像 $\varphi:X\dashrightarrow Y$, $\psi:Y\dashrightarrow Z$ について、合成 $\psi\circ\varphi$ が支配的有理写像として定まる。
2. 支配的有理写像 $\varphi:X\dashrightarrow Y$ は $k$ 上の体の準同型 $\varphi^{*}:K(Y)\to K(X)$ を誘導し、$(\psi\circ\varphi)^{*}=\varphi^{*}\circ\psi^{*}$。
:::

::: proof
**Step 1（1）.** 代表 $(U,\varphi)$, $(V,\psi)$ について、$\varphi^{-1}(V)$ は $U$ の開集合で、$\varphi(U)$ が稠密なので $V$ と交わり、空でない。$\psi\circ\varphi$ を $\varphi^{-1}(V)$ 上で定める。像は $\psi(\varphi(\varphi^{-1}V))$ で、$\varphi(\varphi^{-1}V)=\varphi(U)\cap V$ は $V$ で稠密、$\psi$ は連続なので $\psi(V)$ の中で稠密、したがって $Z$ で稠密。代表の取り方によらないことは \ref{ag:agreement-closed} から。

**Step 2（2）.** $K(Y)$ の元を $(W,f)$（$f\in\mathcal{O}(W)$）で表すと、$\varphi^{-1}(W)$ は空でない開集合（稠密性）で、$f\circ\varphi\in\mathcal{O}(\varphi^{-1}W)$。これは体の $k$ 準同型（体の準同型は単射）で、代表によらない。合成との両立は定義から。
:::

::: theorem 有理写像と関数体 {#ag:birational-equivalence-fields keywords="the category of varieties and dominant rational maps is anti-equivalent to finitely generated field extensions of k" index="双有理幾何と関数体|そうゆうりきかとかんすうたい"}
$X\mapsto K(X)$, $\varphi\mapsto\varphi^{*}$ は、多様体と支配的有理写像の圏と、$k$ 上有限生成な体の拡大と $k$ 準同型の圏の反同値。
:::

::: proof
**Step 1（充満）.** $\theta:K(Y)\to K(X)$ を与える。\ref{ag:affine-open-basis} から $Y$ をアフィン多様体（開集合に縮めても $K(Y)$ も有理写像も変わらない）$Y\subset\mathbb{A}^{n}$ としてよく、$A(Y)=k[\bar y_{1},\dots,\bar y_{n}]$。$\theta(\bar y_{i})\in K(X)$ はある空でない開集合 $U$ 上の正則関数（有限個なので共通の $U$ がとれる）で、$\theta|_{A(Y)}:A(Y)\to\mathcal{O}(U)$ は $k$ 代数準同型。\ref{ag:morphisms-coordinate-rings} の 1 から射 $\varphi:U\to Y$ で $\varphi^{*}=\theta|_{A(Y)}$ となるものがある。$\varphi(U)$ の閉包 $V_{Y}(\mathfrak{b})$ について、$\mathfrak{b}$ の元 $g$ は $\varphi^{*}(g)=g\circ\varphi=0$、$\theta$ は単射なので $g=0$。よって $\varphi$ は支配的で、$\varphi^{*}=\theta$（$K(Y)=\operatorname{Frac}A(Y)$ 上で一致）。

**Step 2（忠実）.** $\varphi^{*}=\psi^{*}$ なら、$Y$ をアフィンにとって座標関数 $\bar y_{i}$ の引き戻しが一致し、共通の定義域で $\varphi=\psi$（射は座標関数の引き戻しで決まる、\ref{ag:morphisms-coordinate-rings}）。

**Step 3（本質的全射）.** 有限生成な拡大 $K=k(a_{1},\dots,a_{n})$ について、$B\defeq k[a_{1},\dots,a_{n}]\subset K$ は有限生成整域で $\operatorname{Frac}B=K$。$B\cong A(Y)$ となるアフィン多様体 $Y$（\ref{ag:morphisms-coordinate-rings} の 2）について $K(Y)\cong K$。
:::

::: corollary 双有理同値 {#ag:birational-equivalence keywords="birational equivalence: K(X) = K(Y) iff X and Y have isomorphic open subsets" index="双有理同値|そうゆうりどうち, 双有理写像|そうゆうりしゃぞう"}
多様体 $X,Y$ について次は同値で、成り立つとき $X$ と $Y$ は**双有理同値**という。
1. 支配的有理写像 $\varphi:X\dashrightarrow Y$, $\psi:Y\dashrightarrow X$ で $\psi\varphi=1$, $\varphi\psi=1$（有理写像として）となるものがある（**双有理写像**）。
2. $K(X)\cong K(Y)$（$k$ 上）。
3. 空でない開集合 $U\subset X$, $V\subset Y$ で $U\cong V$ となるものがある。
:::

::: proof
1 ⇔ 2 は \ref{ag:birational-equivalence-fields}（圏の同型は反同値で対応する）。3 ⇒ 1：同型 $U\cong V$ とその逆を有理写像とみる。1 ⇒ 3：代表 $\varphi:U\to Y$, $\psi:V\to X$ をとる。$\psi\circ\varphi$ は有理写像として恒等なので、ある空でない開集合 $U_{0}\subset\varphi^{-1}(V)$ の上で恒等（\ref{ag:agreement-closed}）。同様に $\varphi\circ\psi$ は空でない開集合 $V_{0}\subset\psi^{-1}(U)$ の上で恒等。$U_{1}\defeq U_{0}\cap\varphi^{-1}(V_{0})$, $V_{1}\defeq V_{0}\cap\psi^{-1}(U_{0})$ とおく（どちらも空でない：支配性から $\varphi(U_{0})$ は $V_{0}$ と交わる）。$P\in U_{1}$ について $Q\defeq\varphi(P)\in V_{0}$ で、$\psi(Q)=\psi\varphi(P)=P\in U_{0}$ なので $Q\in V_{1}$。同様に $\psi(V_{1})\subset U_{1}$。$U_{1}$ 上 $\psi\varphi=1$、$V_{1}$ 上 $\varphi\psi=1$ なので、$\varphi|_{U_{1}}:U_{1}\to V_{1}$ は同型。
:::

::: example 双有理同値の例 {#ag:birational-examples}
1. $\mathbb{P}^{n}$ と $\mathbb{A}^{n}$ は双有理同値（$U_{0}\cong\mathbb{A}^{n}$）。関数体 $k(x_{1},\dots,x_{n})$ をもつ多様体（$\mathbb{P}^{n}$ と双有理同値）を**有理多様体**という。
2. **2 次曲線は有理的**：$C=V(x^{2}+y^{2}-1)\subset\mathbb{A}^{2}$（$\operatorname{char}k\neq2$）は、点 $(-1,0)$ からの射影 $(x,y)\mapsto t=y/(x+1)$ と、逆 $t\mapsto\bigl(\tfrac{1-t^{2}}{1+t^{2}},\tfrac{2t}{1+t^{2}}\bigr)$ により $\mathbb{A}^{1}$ と双有理同値。関数体は $k(t)$。
3. **尖点は有理的**：$V(y^{2}-x^{3})$ は $t=y/x$ により $\mathbb{A}^{1}$ と双有理同値（\ref{ag:affine-examples} の 3 の射は双有理写像だが同型ではない）。
4. **クレモナ変換**：$\mathbb{P}^{2}\dashrightarrow\mathbb{P}^{2}$, $(x:y:z)\mapsto(yz:xz:xy)$ は、$xyz\neq0$ の上で $(1/x:1/y:1/z)$ と同じで、自分自身が逆の双有理写像。3 本の座標直線を 3 点に潰すので、どんな開集合の拡大でも同型にはならない（射としては 3 点で定義されない）。
5. $\operatorname{trdeg}K(X)=\dim X$（\ref{ag:dimension-trdeg}）は双有理不変量。
:::

::: hypcheck
- **選択公理**：使わない。
- **既約性**：一致の原理（\ref{ag:agreement-closed} の Step 3）と、空でない開集合の稠密性（合成が定義できること）に本質的。
- **射影空間に埋め込めること**（準射影性）：\ref{ag:agreement-closed} の Step 2 で $\mathbb{P}^{n}$ の座標を使った。一般のスキームでは、この性質が**分離性**として公理化される（\ref{ag:page-separated-proper}）：分離でないスキーム（原点を二重にした直線）では、開集合上で一致する二つの射が全体で異なりうる。
- **$\operatorname{char}k\neq2$**：例 2 だけで使った。
:::

::: supplement
**知られている事実（本サイト未収録）.**
- **リュロートの定理**：$k\subsetneq L\subset k(t)$ なら $L\cong k(s)$。したがって有理曲線に支配される曲線は有理的（**単有理な曲線は有理的**）。
- **カステルヌオーヴォの定理**：標数 0 の代数閉体上で、単有理な曲面は有理的。3 次元以上では単有理だが有理的でない多様体がある（クレメンス–グリフィス、イスコフスキフ–マニン、アルティン–マンフォード、1972）。
- **ザリスキの例**：正標数では単有理だが有理的でない曲面がある。

**計算の観点.** 曲線が有理的かどうかは種数が 0 かどうかで判定でき（\ref[曲線のリーマン–ロッホの定理]{ag:page-riemann-roch}）、有理的なら有理パラメータ表示を計算するアルゴリズムが知られている（本サイト未収録）。高次元の有理性の判定は一般に未解決の問題を含む。
:::

## 高い視点 {#ag:sec-rm-viewpoint}

::: remark 「ほとんどどこでも」の幾何
双有理幾何は、多様体を「稠密な開集合を除いて」同一視する、いわば「測度 0 を無視する」幾何である。反同値は、この粗い同一視のもとでは、多様体は関数体という一つの代数的対象に完全に還元されることを述べる。比喩で言えば、同型が「地図の完全な一致」なら、双有理同値は「どこかの地域で一致する地図」で、関数体は地図帳の背表紙の題名のようなものである。題名が同じでも中身（特異点・無限遠の様子）は異なりうるので、双有理類の中で「最も良い代表」（極小モデル、非特異射影モデル）を探すことが双有理幾何の中心問題になる。曲線では、各双有理類にただ一つの非特異射影モデルがある（\ref{ag:page-curves}）。
:::

## 問題 {#ag:sec-rm-problems}

::: problem {#ag:prob-rm-node}
結節点をもつ 3 次曲線 $N=V(y^{2}-x^{2}(x+1))$ が $\mathbb{A}^{1}$ と双有理同値であることを、直線 $y=tx$ との交わりを使って示せ。
:::

::: solution
$y=tx$ を代入すると $x^{2}(t^{2}-x-1)=0$。原点以外の交点は $x=t^{2}-1$, $y=t(t^{2}-1)$。射 $\mathbb{A}^{1}\to N$, $t\mapsto(t^{2}-1,t(t^{2}-1))$ と、有理写像 $N\dashrightarrow\mathbb{A}^{1}$, $(x,y)\mapsto y/x$（$x\neq0$ で定義）は、$x\neq0$ の部分と $t\neq\pm1$ の部分で互いに逆（$y/x=t$、逆に $t=y/x$ から $x=t^{2}-1$ は方程式から）。よって双有理同値で $K(N)\cong k(t)$。原点は $t=\pm1$ の二点の像で、射は単射でない（結節点で二つの枝が交わる）。
:::
