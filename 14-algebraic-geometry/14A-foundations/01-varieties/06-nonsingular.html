# 非特異性 {#ag:page-nonsingular keywords="nonsingular point, regular local ring, Zariski tangent space, Jacobian criterion for varieties, singular locus is a proper closed subset, every variety is birational to a hypersurface, cusp and node, Fermat curves, regular versus smooth, openness of the regular locus, excellent rings"}

多様体の点 $P$ が**非特異**であるとは、局所環 $\mathcal{O}_{Y,P}$ が正則局所環であることをいう。これは「接空間の次元が多様体の次元に等しい」ことで、方程式で書けばヤコビ行列の階数の条件になる（**ヤコビアンの判定法**）。非特異でない点（**特異点**）の全体は真の閉集合で、したがってどの多様体も「ほとんどすべての点で非特異」である。後者の証明は、すべての多様体が超曲面と双有理同値であることを使う。最後に、正則性と滑らかさの違い、永田の例と優秀環に触れる。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-ns-notation}

::: notation
- 正則局所環・埋め込み次元・ヤコビアンの判定法は \ref{ring:regular-local-ring}, \ref{ring:dimension-corollaries}, \ref{ring:jacobian-criterion}。代数閉体は完全体なので、判定法は $k$ 上でそのまま使える。
- 局所環 $\mathcal{O}_{Y,P}\cong A(Y)_{\mathfrak{m}_{P}}$（\ref{ag:regular-functions-principal}）、その次元は $\dim Y$（\ref{ag:catenary} の 3）。双有理同値と同型な開集合は \ref{ag:birational-equivalence}。
- 完全体上の分離生成と原始元定理は \ref{fld:perfect-separably-generated}, \ref{fld:primitive-element}。
- **選択公理**：可換環論・体論の引用を通して使う。
:::

## 非特異点 {#ag:sec-ns-definition}

::: definition 非特異点と接空間 {#ag:nonsingular-point keywords="nonsingular point: local ring is regular; Zariski tangent space (m/m^2)^*" index="非特異点|ひとくいてん, 特異点|とくいてん, ザリスキ接空間|ざりすきせっくうかん"}
多様体 $Y$ の点 $P$ が**非特異**であるとは、$\mathcal{O}_{Y,P}$ が正則局所環であることをいう。そうでない点を**特異点**という。すべての点が非特異な $Y$ を**非特異**（**滑らか**）という。$\mathfrak{m}_{P}$ を $\mathcal{O}_{Y,P}$ の極大イデアルとして、$k$ ベクトル空間 $T_{P}Y\defeq(\mathfrak{m}_{P}/\mathfrak{m}_{P}^{2})^{*}$ を**ザリスキ接空間**という。
:::

::: proposition 接空間と非特異性 {#ag:tangent-space-dimension keywords="dim T_P Y >= dim Y with equality iff P is nonsingular" index="接空間の次元|せっくうかんのじげん"}
$\dim T_{P}Y\ge\dim Y$ で、等号は $P$ が非特異のとき、かつそのときに限る。
:::

::: proof
$\mathcal{O}_{Y,P}/\mathfrak{m}_{P}=k$（$P$ は $k$ 有理点）なので $\dim T_{P}Y=\dim_{k}\mathfrak{m}_{P}/\mathfrak{m}_{P}^{2}=\operatorname{edim}\mathcal{O}_{Y,P}\ge\dim\mathcal{O}_{Y,P}$（\ref{ring:dimension-corollaries} の 1）$=\dim Y$。等号は正則局所環の定義。
:::

::: theorem 多様体のヤコビアンの判定法 {#ag:jacobian-criterion-varieties keywords="P in Y subset A^n is nonsingular iff the Jacobian matrix of generators of I(Y) at P has rank n - dim Y; tangent space is the kernel of the Jacobian" index="多様体のヤコビアン判定法|たようたいのやこびあんはんていほう"}
アフィン多様体 $Y\subset\mathbb{A}^{n}$（$\dim Y=r$）と $I(Y)=(f_{1},\dots,f_{m})$、$P\in Y$ について、$J(P)\defeq(\partial f_{i}/\partial x_{j}(P))\in M_{m,n}(k)$ とすると、$\operatorname{rank}J(P)\le n-r$ で、$P$ が非特異 $\iff$ $\operatorname{rank}J(P)=n-r$。さらに $T_{P}Y\cong\ker J(P)\subset k^{n}$。
:::

::: proof
\ref{ring:jacobian-criterion} を $I=I(Y)$, 極大イデアル $\mathfrak{m}_{P}$（$L=k$）に使うと $\operatorname{edim}\mathcal{O}_{Y,P}=n-\operatorname{rank}J(P)$。\ref{ag:tangent-space-dimension} から $n-\operatorname{rank}J(P)\ge r$ で、等号が非特異性。接空間：$\mathfrak{m}/\mathfrak{m}^{2}$（$\mathfrak{m}=\mathfrak{m}_{P}$ in $k[x]$）は $dx_{1},\dots,dx_{n}$ を基底とする $k^{n}$ で、$\mathcal{O}_{Y,P}$ の $\mathfrak{m}_{P}/\mathfrak{m}_{P}^{2}$ はその $df_{i}(P)=\sum_{j}\partial f_{i}/\partial x_{j}(P)\,dx_{j}$ による商（同じ判定法の証明による）。双対をとると $\ker J(P)$。
:::

::: example 特異点の例 {#ag:singular-examples}
1. **尖点** $V(y^{2}-x^{3})$：$J=(-3x^{2},\,2y)$ は原点で $0$（階数 $0<2-1$）なので原点は特異点、他の点は非特異。
2. **結節点** $V(y^{2}-x^{2}(x+1))$：$J=(-3x^{2}-2x,\,2y)$ は原点で $0$、特異点。（$\operatorname{char}k\neq2$）
3. **2 次曲線** $V(x^{2}+y^{2}-1)$（$\operatorname{char}k\neq2$）：$J=(2x,2y)$ が $0$ になるのは原点だけで、原点は曲線上にない。非特異。
4. **錐** $V(x^{2}+y^{2}-z^{2})\subset\mathbb{A}^{3}$：原点だけが特異点（$J=(2x,2y,-2z)$）。
5. **フェルマー曲線**：射影曲線 $V(x^{d}+y^{d}+z^{d})\subset\mathbb{P}^{2}$（$\operatorname{char}k\nmid d$）は非特異：各標準アフィン被覆で非斉次化し、たとえば $z=1$ では $J=(dx^{d-1},dy^{d-1})$ が $0$ となるのは $x=y=0$ で、そこで $0^{d}+0^{d}+1\neq0$。
:::

## 特異点集合 {#ag:sec-ns-singular-locus}

::: proposition 超曲面との双有理同値 {#ag:birational-hypersurface keywords="every variety is birational to a hypersurface in A^{r+1}" index="超曲面との双有理同値|ちょうきょくめんとのそうゆうりどうち"}
$r$ 次元の多様体 $Y$ は、$\mathbb{A}^{r+1}$ のある既約な超曲面と双有理同値。
:::

::: proof
**Step 1（関数体の形）.** $K(Y)$ は $k$ 上有限生成で超越次数 $r$（\ref{ag:dimension-trdeg}）。$k$ は代数閉、したがって完全なので、生成元の中から分離超越基底 $t_{1},\dots,t_{r}$ を選べる（\ref{fld:perfect-separably-generated}）。$K(Y)/k(t)$ は有限次分離拡大なので、原始元 $u$ で $K(Y)=k(t_{1},\dots,t_{r},u)$（\ref{fld:primitive-element}）。

**Step 2（超曲面）.** $u$ の $k(t)$ 上の最小多項式に分母を払って、既約多項式 $f(t_{1},\dots,t_{r},u)\in k[t,u]$ を得る（ガウスの補題により $k[t][u]$ で既約にとれる）。超曲面 $H\defeq V(f)\subset\mathbb{A}^{r+1}$ の関数体は $\operatorname{Frac}(k[t,u]/(f))\cong k(t)(u)=K(Y)$。\ref{ag:birational-equivalence} から $Y$ と $H$ は双有理同値。
:::

::: theorem 特異点集合は真の閉集合 {#ag:singular-locus-closed keywords="the singular locus of a variety is a proper closed subset; the nonsingular points form a dense open subset" index="特異点集合|とくいてんしゅうごう"}
多様体 $Y$ の特異点の集合 $\operatorname{Sing}Y$ は $Y$ の真の閉部分集合。したがって非特異点の全体は空でない（稠密な）開集合。
:::

::: proof
**Step 1（閉集合：アフィンの場合）.** $Y\subset\mathbb{A}^{n}$ をアフィン、$\dim Y=r$ とする。\ref{ag:jacobian-criterion-varieties} から $\operatorname{Sing}Y=\{P\in Y : \operatorname{rank}J(P)<n-r\}$ で、これは $J$ の $(n-r)$ 次小行列式（多項式）がすべて $0$ になる点の集合、すなわち閉集合。一般の多様体は、非特異性が局所環だけで決まり、アフィン開集合で覆われる（\ref{ag:affine-open-basis}）ので、局所的に閉、したがって閉。

**Step 2（超曲面では真）.** $H=V(f)\subset\mathbb{A}^{r+1}$（$f$ 既約）では $I(H)=(f)$ で、$\operatorname{Sing}H=V(f,\partial f/\partial x_{1},\dots,\partial f/\partial x_{r+1})$。これが $H$ 全体なら、各 $\partial f/\partial x_{i}$ は $H$ で消えるので $(f)$ に入り、次数が $\deg f$ より小さいので $\partial f/\partial x_{i}=0$。$\operatorname{char}k=0$ なら $f$ は定数で矛盾。$\operatorname{char}k=p>0$ なら $f$ は $x_{i}^{p}$ だけの多項式で、$k$ は完全なので係数の $p$ 乗根をとって $f=g^{p}$、$f$ の既約性に矛盾。

**Step 3（一般の場合）.** \ref{ag:birational-hypersurface} と \ref{ag:birational-equivalence} から、$Y$ の空でない開集合 $U$ と超曲面 $H$ の空でない開集合 $V$ で $U\cong V$ となるものがある。$H$ の非特異点の集合は空でない開集合（Step 1・2）で、$V$ と交わる（$H$ は既約）。同型は局所環の同型を誘導するので、$U$ に非特異点がある。Step 1 と合わせて $\operatorname{Sing}Y$ は真の閉集合。
:::

::: remark 正則と滑らか、そして永田の例
1. **完全でない体**では、正則（局所環が正則）と**滑らか**（ヤコビアンの判定法の条件、あるいは代数閉包に係数拡大しても正則）が一致しない：$\operatorname{char}k=p$, $a\in k\setminus k^{p}$ について $\operatorname{Spec}k[x]/(x^{p}-a)$ は体（正則）だが、$\bar k$ 上では $(x-a^{1/p})^{p}$ で被約でない。グロタンディークは EGA IV で、絶対的な性質「正則」と、射の性質「滑らか（smooth, lisse）」を区別し、後者を平坦性と微分の言葉で定義した。これにより、整数論で現れる「$\mathbb{Z}$ 上のスキーム」の各素数でのファイバーの振る舞いが統一的に扱えるようになった。
2. **正則点の集合が開とは限らない**：上の \ref{ag:singular-locus-closed} は体上の有限型の場合の事実で、一般のネーター環 $A$ では $\{\mathfrak{p} : A_{\mathfrak{p}}\text{ が正則}\}$ が $\operatorname{Spec}A$ で開とは限らない（永田の例。本サイト未収録）。グロタンディークの**優秀環**の定義は、普遍鎖状性（\ref{ag:page-dimension} の注意）に加えて、この**正則点の集合の開性**（J-2 条件）と、完備化のファイバーの正則性を要求する。体上・$\mathbb{Z}$ 上の有限型の代数は優秀で、そこでは本ページの議論がそのまま使える。
:::

::: hypcheck
- **選択公理**：引用（正則局所環・判定法・原始元定理）を通して使う。
- **$k$ が完全（代数閉）**：ヤコビアンの判定法（剰余体の分離性）と、超曲面との双有理同値（分離超越基底）、Step 2 の $p$ 乗根に使った。
- **既約性**：Step 3 で開集合 $V$ と非特異点の開集合が交わることに使った。
- $\operatorname{char}k\neq2$ は例 2・3・4 だけ。
:::

::: supplement
**前提を変えると.** 射影多様体 $Y=V(F_{1},\dots,F_{m})\subset\mathbb{P}^{n}$ では、斉次多項式のヤコビ行列 $(\partial F_{i}/\partial x_{j}(P))$（$(n+1)$ 列）の階数が $n-\dim Y$ であることが非特異の条件になる（オイラーの公式 $\sum x_{j}\partial F/\partial x_{j}=(\deg F)F$ により、斉次座標の取り方によらない。$\operatorname{char}k\nmid\deg F$ のとき）。

**計算の観点.** 特異点集合は小行列式のイデアルとして明示的に計算でき、その空・非空はグレブナー基底で判定できる。
:::

## 高い視点 {#ag:sec-ns-viewpoint}

::: remark 線形近似ができる点
非特異点は、多様体が「接空間という線形空間で正しく近似できる」点で、解析での逆関数定理・陰関数定理が成り立つ場所にあたる（$k=\mathbb{C}$ なら非特異点の近くで多様体は複素多様体になる。本サイト未収録）。特異点では接空間が大きすぎ、多様体の形を線形に捉えきれない。特異点が「ほとんどない」ことは、代数多様体が局所的にはほぼ多様体として扱えることを保証し、特異点の解消（広中の定理、標数 0）はその「ほとんど」を「すべて」にする操作である（本サイト未収録）。
:::

## 問題 {#ag:sec-ns-problems}

::: problem {#ag:prob-ns-whitney}
$Y=V(x^{2}-y^{2}z)\subset\mathbb{A}^{3}$（ホイットニーの傘、$\operatorname{char}k\neq2$）の特異点集合を求めよ。
:::

::: solution
$f=x^{2}-y^{2}z$ は既約（$z$ について 1 次で、係数 $y^{2}$ と $x^{2}$ が共通因子をもたない）なので $I(Y)=(f)$、$\dim Y=2$。$J=(2x,\,-2yz,\,-y^{2})$ が $0$ になるのは $x=0$, $y=0$（$z$ は任意）。これらは $Y$ 上にある（$0-0=0$）。よって $\operatorname{Sing}Y$ は $z$ 軸 $V(x,y)$（1 次元の真の閉集合）。
:::
