# 次元 {#ag:page-dimension keywords="dimension of a topological space, dimension of a variety equals Krull dimension of the coordinate ring equals transcendence degree of the function field, catenary, height plus dimension, hypersurfaces have codimension one, open subsets have the same dimension, projective dimension theorem, intersection with hypersurfaces, universally catenary, Nagata's non-catenary rings"}

多様体の**次元**を「既約な閉部分集合の鎖の長さの上限」と位相的に定義すると、アフィン多様体では座標環のクルル次元に等しく、さらに関数体の超越次数に等しい。この等式から、次元は空でない開集合で変わらず、射影多様体でも標準アフィン被覆から計算できる。さらに有限生成整域は**鎖状**（素イデアルの極大な鎖の長さがすべて等しい）なので、余次元と次元の足し算が成り立つ。超曲面は余次元 1 で、超曲面との交わりは次元を高々 1 しか下げない。最後に、一般のネーター環では鎖状性が成り立たない永田の例と、グロタンディークがそれに対して導入した「普遍鎖状」の概念に触れる。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-dm-notation}

::: notation
- クルル次元・高さは \ref{ring:krull-dimension}、整拡大は次元を保つ（\ref{ring:integral-dimension}）、多項式環の次元（\ref{ring:polynomial-dimension}）、比較不能定理・下降定理（\ref{ring:incomparability}, \ref{ring:going-down}）、ネーターの正規化定理（\ref{ring:noether-normalization}）、クルルの単項イデアル定理（\ref{ring:principal-ideal-theorem}）、一意分解環は正規（\ref{ring:ufd-normal}）、高さ 1 の素イデアルは単項（\ref{ring:ufd-height-one}）。
- 超越次数は \ref{fld:transcendence-degree}、その加法性は \ref{fld:trdeg-additivity}。
- アフィン多様体・座標環・関数体・射影多様体・標準アフィン被覆は \ref{ag:affine-variety}, \ref{ag:regular-functions-principal}, \ref{ag:projective-algebraic-set}, \ref{ag:standard-affine-charts}。
- **選択公理**：可換環論の引用（上の多くの結果は（AC）つき）を通して使う。体上の有限生成代数に限れば、極大イデアルの存在などは選択公理なしに示せることが多いが、本ページでは区別しない。
:::

## 位相的な次元 {#ag:sec-dm-topological}

::: definition 次元 {#ag:dimension keywords="dimension of a topological space as the supremum of lengths of chains of irreducible closed subsets; codimension" index="次元（位相空間）|じげんいそうくうかん, 余次元|よじげん"}
位相空間 $X$ の**次元** $\dim X$ を、既約な閉部分集合の鎖 $Z_{0}\subsetneq Z_{1}\subsetneq\cdots\subsetneq Z_{r}$ の長さ $r$ の上限とする。既約な閉部分集合 $Z\subset X$ の**余次元** $\operatorname{codim}(Z,X)$ を、$Z$ から始まる鎖 $Z=Z_{0}\subsetneq\cdots\subsetneq Z_{r}$ の長さの上限とする。
:::

::: proposition アフィン多様体の次元 {#ag:dimension-krull keywords="dim Y = dim A(Y) for affine algebraic sets; dim A^n = n; codimension equals height" index="多様体の次元|たようたいのじげん"}
アフィン代数的集合 $Y$ について $\dim Y=\dim A(Y)$（クルル次元）。既約な閉部分集合 $Z\subset Y$ について $\operatorname{codim}(Z,Y)=\operatorname{ht}(I_{Y}(Z))$（$A(Y)$ の素イデアルの高さ）。とくに $\dim\mathbb{A}^{n}=n$。
:::

::: proof
\ref{ag:nullstellensatz-coordinate-ring} と \ref{ag:irreducible-prime} から、$Y$ の既約な閉部分集合と $A(Y)$ の素イデアルは包含を逆にして一対一に対応する。鎖の長さは保たれるので両辺は一致する。$\dim k[x_{1},\dots,x_{n}]=n$（\ref{ring:polynomial-dimension}）。
:::

## 次元と超越次数 {#ag:sec-dm-trdeg}

::: theorem 次元と超越次数 {#ag:dimension-trdeg keywords="for a finitely generated k-domain B, dim B = trdeg_k Frac(B)" index="次元と超越次数|じげんとちょうえつじすう"}
体 $k$ 上の有限生成整域 $B$ について $\dim B=\operatorname{trdeg}_{k}\operatorname{Frac}(B)$。したがってアフィン多様体 $Y$ について $\dim Y=\operatorname{trdeg}_{k}K(Y)$。
:::

::: proof
ネーターの正規化定理から、代数的に独立な $y_{1},\dots,y_{d}\in B$ で $B$ が $R\defeq k[y_{1},\dots,y_{d}]$ 上整なものがある。整拡大は次元を保つので $\dim B=\dim R=d$。$B$ の元は $R$ 上整なので $\operatorname{Frac}(R)=k(y_{1},\dots,y_{d})$ 上代数的で、$\operatorname{Frac}(B)$ は $k(y)$ 上代数的（商体は $B$ の元で生成される）。よって $\operatorname{trdeg}_{k}\operatorname{Frac}(B)=\operatorname{trdeg}_{k}k(y)=d$（\ref{fld:trdeg-additivity}）。$K(Y)\cong\operatorname{Frac}A(Y)$（\ref{ag:regular-functions-principal} の 3）。
:::

::: lemma 高さ 1 の素イデアル {#ag:height-one-quotient keywords="if p is a height one prime of a finitely generated k-domain B then dim B/p = dim B - 1" index="高さ 1 の素イデアルと次元|たかさいちのそいであるとじげん"}
有限生成 $k$ 整域 $B$（$\dim B=d$）の高さ 1 の素イデアル $\mathfrak{p}$ について $\dim B/\mathfrak{p}=d-1$。
:::

::: proof
**Step 1（正規化と高さの比較）.** 正規化 $R=k[y_{1},\dots,y_{d}]\subset B$ をとり、$\mathfrak{q}\defeq\mathfrak{p}\cap R$ とする。$B$ の中の $\mathfrak{p}$ で終わる鎖を $R$ に縮めると、比較不能定理から異なる素イデアルは異なる素イデアルに縮むので $\operatorname{ht}\mathfrak{q}\ge\operatorname{ht}\mathfrak{p}$。逆に $R$ は一意分解環なので正規（\ref{ring:ufd-normal}）で、下降定理から $\mathfrak{q}$ で終わる鎖は $\mathfrak{p}$ で終わる鎖に持ち上がるので $\operatorname{ht}\mathfrak{p}\ge\operatorname{ht}\mathfrak{q}$。よって $\operatorname{ht}\mathfrak{q}=1$。

**Step 2（$\mathfrak{q}$ は単項）.** $R$ は一意分解環なので、高さ 1 の素イデアルは単項（\ref{ring:ufd-height-one}）、$\mathfrak{q}=(f)$。

**Step 3（$\dim R/(f)=d-1$）.** $R/(f)$ は有限生成整域なので、\ref{ag:dimension-trdeg} から超越次数を計算すればよい。変数の変換（ネーターの正規化の証明と同じ $y_{i}\mapsto y_{i}+y_{d}^{m_{i}}$）で $f$ は $k[y_{1},\dots,y_{d-1}]$ 上 $y_{d}$ についてモニック（定数倍を除いて）にでき、$R/(f)$ は $k[y_{1},\dots,y_{d-1}]$ 上有限。$k[y_{1},\dots,y_{d-1}]\to R/(f)$ は単射（$f$ は $y_{d}$ を含むモニック多項式で、$y_{d}$ を含まない元の倍数にならない）なので、$\dim R/(f)=d-1$。

**Step 4.** $B/\mathfrak{p}$ は $R/\mathfrak{q}$ 上整（$B$ が $R$ 上整なので）で単射なので、$\dim B/\mathfrak{p}=\dim R/\mathfrak{q}=d-1$（\ref{ring:integral-dimension}）。
:::

::: theorem 鎖状性 {#ag:catenary keywords="finitely generated k-domains are catenary: all maximal chains of primes have length dim B; ht p + dim B/p = dim B" index="鎖状性|さじょうせい, 鎖状環|さじょうかん"}
有限生成 $k$ 整域 $B$（$\dim B=d$）について、
1. 素イデアルの極大な鎖（それ以上細分できず、$0$ から極大イデアルまで続く鎖）の長さはすべて $d$。
2. 素イデアル $\mathfrak{p}$ について $\operatorname{ht}\mathfrak{p}+\dim B/\mathfrak{p}=d$。
3. 極大イデアル $\mathfrak{m}$ について $\operatorname{ht}\mathfrak{m}=\dim B_{\mathfrak{m}}=d$。
:::

::: proof
**Step 1（1：$d$ についての帰納法）.** $d=0$ なら $B$ は $k$ 上整な整域なので体（\ref{ring:integral-field}）で、鎖は長さ 0。$d\ge1$ とし、極大な鎖 $0=\mathfrak{p}_{0}\subsetneq\mathfrak{p}_{1}\subsetneq\cdots\subsetneq\mathfrak{p}_{r}$ をとる。間に素イデアルがないので $\operatorname{ht}\mathfrak{p}_{1}=1$、\ref{ag:height-one-quotient} から $\dim B/\mathfrak{p}_{1}=d-1$。$B/\mathfrak{p}_{1}$ の鎖 $\mathfrak{p}_{1}/\mathfrak{p}_{1}\subsetneq\cdots\subsetneq\mathfrak{p}_{r}/\mathfrak{p}_{1}$ も極大なので、帰納法の仮定から $r-1=d-1$。

**Step 2（2）.** $\mathfrak{p}$ で終わる最長の鎖（長さ $\operatorname{ht}\mathfrak{p}$、ネーター環で有限：\ref{ring:dimension-corollaries} の 2）と、$\mathfrak{p}$ から始まる最長の鎖（長さ $\dim B/\mathfrak{p}$）をつなぐと極大な鎖になる（最長なので細分できない）。1 からその長さは $d$。

**Step 3（3）.** 2 で $\dim B/\mathfrak{m}=0$。
:::

::: corollary 多様体の次元の性質 {#ag:dimension-properties keywords="nonempty open subsets have the same dimension; projective varieties: dimension of affine pieces; hypersurfaces have dimension n-1 and codimension one subvarieties of A^n are hypersurfaces" index="超曲面の次元|ちょうきょくめんのじげん"}
1. アフィン多様体 $Y$ の空でない開集合 $U$ について $\dim U=\dim Y$。射影多様体 $Y$ について $\dim Y=\dim(Y\cap U_{i})$（$Y\cap U_{i}\neq\emptyset$）。
2. アフィン多様体 $Y$ と既約な閉部分集合 $Z$ について $\dim Z+\operatorname{codim}(Z,Y)=\dim Y$。
3. $\mathbb{A}^{n}$ の既約な閉部分集合が次元 $n-1$ であることと、ある既約多項式 $f$ について $V(f)$ であることは同値。
:::

::: proof
**Step 1（次元は開被覆で計算できる）.** 位相空間 $X$ の開被覆 $\{U_{\lambda}\}$ について $\dim X=\sup\dim U_{\lambda}$：$X$ の鎖 $Z_{0}\subsetneq\cdots\subsetneq Z_{r}$ について $Z_{0}$ と交わる $U_{\lambda}$ をとると、$Z_{i}\cap U_{\lambda}$ は $U_{\lambda}$ の既約な閉集合で、$Z_{i}$ の中で稠密（既約な空間の空でない開集合）なので互いに異なる。逆向きは閉包をとる。

**Step 2（1）.** $U$ の主開集合 $D(f)\subset U$ について $D(f)$ はアフィン多様体 $V(xf-1)\subset\mathbb{A}^{n+1}$ と同型（\ref{ag:affine-examples} の 1 と同様）で、$A(D(f))=A(Y)_{f}$ の商体は $K(Y)$。\ref{ag:dimension-trdeg} から $\dim D(f)=\dim Y$。$U$ は主開集合で覆われるので Step 1 から $\dim U=\dim Y$。射影多様体では、$Y\cap U_{i}$ は（\ref{ag:standard-affine-charts} により）アフィン多様体で、空でないものの関数体はすべて同じ（共通部分 $Y\cap U_{i}\cap U_{j}$ はどちらの空でない開集合でもある）ので次元は等しく、Step 1 から $\dim Y$ に等しい。

**Step 3（2）.** \ref{ag:dimension-krull} と \ref{ag:catenary} の 2。

**Step 4（3）.** 2 から、次元 $n-1$ ⇔ 余次元 1 ⇔ $I(Z)$ の高さが 1。$k[x_{1},\dots,x_{n}]$ は一意分解環なので高さ 1 の素イデアルは $(f)$（$f$ 既約）の形（\ref{ring:ufd-height-one}）。逆に $f$ 既約なら $(f)$ は素で、単項イデアル定理から高さ 1。
:::

## 交わりの次元 {#ag:sec-dm-intersection}

::: theorem 超曲面との交わり {#ag:intersection-hypersurface keywords="every component of Y cap H has dimension at least dim Y - 1; projective dimension theorem: intersection with a hypersurface is nonempty if dim Y >= 1" index="超曲面との交わり|ちょうきょくめんとのまじわり, 射影次元定理|しゃえいじげんていり"}
1. アフィン多様体 $Y\subset\mathbb{A}^{n}$（$\dim Y=r$）と多項式 $f$ について、$Y\cap V(f)$ の既約成分の次元はすべて $\ge r-1$（$Y\cap V(f)\neq\emptyset$ のとき）。$f$ が $Y$ 上で恒等的に $0$ でなければ、ちょうど $r-1$。
2. 射影多様体 $Y\subset\mathbb{P}^{n}$（$\dim Y=r\ge1$）と、次数が正の斉次多項式 $f$ について、$Y\cap V(f)\neq\emptyset$ で、その既約成分の次元は $\ge r-1$。
:::

::: proof
**Step 1（1）.** $Y\cap V(f)$ の既約成分 $Z$ は、$A(Y)$ の中で $(\bar f)$ 上の極小素イデアル $\mathfrak{p}$ に対応する（\ref{ag:irreducible-decomposition} の 3 を $A(Y)$ で）。単項イデアル定理から $\operatorname{ht}\mathfrak{p}\le1$（$\bar f\neq0$ で非単元なら $=1$）。鎖状性（\ref{ag:catenary} の 2）から $\dim Z=r-\operatorname{ht}\mathfrak{p}\ge r-1$。

**Step 2（2：アフィン錐の次元）.** アフィン錐 $C(Y)\subset\mathbb{A}^{n+1}$（\ref{ag:projective-nullstellensatz} の Step 1）は既約（$I(Y)$ は素）で、その座標環は斉次座標環 $S(Y)\defeq S/I(Y)$。$x_{0}\notin I(Y)$（$Y\cap U_{0}\neq\emptyset$）としてよく、$S(Y)[x_{0}^{-1}]\cong A(Y\cap U_{0})[x_{0},x_{0}^{-1}]$（次数 $0$ の部分が $A(Y\cap U_{0})$、非斉次化による）なので、$\operatorname{trdeg}\operatorname{Frac}S(Y)=\operatorname{trdeg}K(Y)+1$、すなわち $\dim C(Y)=r+1$。

**Step 3（2：交わり）.** $C(Y)\cap V^{\mathrm{a}}(f)$ は原点を含む（$f$ は次数が正の斉次多項式）ので空でなく、1 から原点を含む既約成分 $W$ は次元 $\ge r\ge1$。$W$ は原点だけではないので、原点以外の点 $a$ を含み、$a$ の類は $Y\cap V(f)$ の点。$W$ は錐（$\lambda$ 倍で閉じる）で、$Y\cap V(f)$ の既約成分は $C$ の対応する成分（次元が 1 大きい）から、次元 $\ge r-1$。
:::

::: example
1. $\mathbb{A}^{3}$ の二つの曲面 $V(z)$ と $V(z-xy)$ の交わりは $V(z,xy)$ で、既約成分は二つの直線（次元 1 $=2-1$）。
2. $\mathbb{P}^{2}$ の任意の二曲線（$\dim=1$）は交わる（2 から）。アフィン平面の平行線は交わらないので、1 で「$\neq\emptyset$ のとき」は外せない。
3. **余次元が足りない例**：$\mathbb{A}^{4}$ の 2 平面 $V(x,y)$ と $V(z,w)$ の交わりは原点だけ（次元 0 $=2+2-4$）。$V(x,y)\cup V(z,w)$ は 2 次元（余次元 2）だが、二つの方程式の零点集合としては表せないことが知られている（ハーツホーンの連結性定理による。本サイト未収録）。余次元と同じ個数の方程式で切り出せるとは限らない。
:::

::: remark 永田の反例と普遍鎖状性
1. 一般のネーター環は鎖状とは限らない：永田は、極大な素イデアルの鎖の長さが異なるネーター局所整域を構成した（M. Nagata, *Local Rings*, 1962。本サイト未収録）。また、無限次元のネーター環もある（\ref{ring:nagata-infinite-dimension}）。いずれも、次元論が「点の近くの局所的な情報」と「全体の情報」で食い違うことを示す。
2. グロタンディークは EGA IV（1965）で、ネーター環 $A$ が**普遍鎖状**（$A$ 上の有限生成代数がすべて鎖状）であるという条件を立て、さらにそれを含む**優秀環**の概念を定義した。体・$\mathbb{Z}$・完備局所環・コーエン–マコーレー環は普遍鎖状で（\ref{ring:cm-universally-catenary}）、普遍鎖状性は有限生成代数・局所化・剰余で保たれる。上の \ref{ag:catenary} は「体は普遍鎖状」の内容である。代数幾何で扱うスキームをこのような「良い」環の上の有限型のものに限ると、永田の病理的な例は現れない：これが、スキームの基礎理論で「ネーター」「有限型」「優秀」が組み合わせて仮定される理由である。
:::

::: hypcheck
- **選択公理**：引用した可換環論の結果を通して使う。
- **有限生成性**：ネーターの正規化（\ref{ag:dimension-trdeg}）と鎖状性に本質的。
- **$k$ が体**：正規化の土台 $k[y]$ が一意分解環・正規であることに使った。$\mathbb{Z}$ 上の有限生成整域でも同様の議論（$\mathbb{Z}[y]$ を土台にする）で鎖状性が成り立つことが知られている（本サイト未収録）。
- 代数閉体であることは、多様体との対応（零点定理）だけに使い、\ref{ag:dimension-trdeg}・\ref{ag:catenary} の環論的な部分は任意の体で成り立つ。
:::

::: supplement
**前提を変えると.** 位相的な次元は任意のネーター空間で定義でき、$\operatorname{Spec}A$ の次元は $\dim A$ に等しい。$\dim$ が有限でもネーター空間でなければ病的な例があり、また有限型でないスキームでは開集合の次元が全体と異なることがある（$\operatorname{Spec}$ of a DVR：1 次元だが、生成点だけの開集合は 0 次元）。

**計算の観点.** イデアル $\mathfrak{a}\subset k[x_{1},\dots,x_{n}]$ の定める代数的集合の次元は、グレブナー基底の先頭単項式のイデアルの次元（組合せ的に計算できる）に等しいことが知られており、計算可能（本サイト未収録）。
:::

## 高い視点 {#ag:sec-dm-viewpoint}

::: remark 三つの次元が一致する
多様体の次元には、位相的（閉集合の鎖）、環論的（素イデアルの鎖）、体論的（関数体の自由に動ける変数の数）の三つの見方があり、零点定理とネーターの正規化がそれらを結びつける。比喩で言えば、「何回入れ子にできるか」（位相）、「何回割れるか」（環）、「何個の独立なパラメータで描けるか」（体）が、良い対象では同じ数になる。永田の例は、良くない対象ではこれらがずれることを示し、グロタンディークの「良い環」の条件は、ずれが起きない世界を公理で切り出したものである。
:::

## 問題 {#ag:sec-dm-problems}

::: problem {#ag:prob-dm-twisted-cubic}
ねじれ 3 次曲線 $C=V(y-x^{2},z-x^{3})\subset\mathbb{A}^{3}$（\ref{ag:prob-as-twisted-cubic}）の次元を三通り（座標環のクルル次元、関数体の超越次数、閉部分集合の鎖）で求めよ。
:::

::: solution
$A(C)\cong k[t]$ なので $\dim C=\dim k[t]=1$。$K(C)\cong k(t)$ の超越次数も 1。閉部分集合の鎖：$\{P\}\subsetneq C$ は長さ 1 の鎖で、$C$ の真の既約閉部分集合は $k[t]$ の $0$ でない素イデアル $(t-a)$、すなわち点だけなので、これより長い鎖はない。
:::
