# 非特異曲線 {#ag:page-curves keywords="algebraic curve, nonsingular points of curves are DVRs, normal equals nonsingular for curves, normalization of an affine curve, discrete valuation rings of a function field of transcendence degree one, every function lies in almost all valuation rings, extension of morphisms from nonsingular curves to projective varieties, birational nonsingular projective curves are isomorphic, abstract nonsingular curve, Nagata compactification"}

1 \term[次元]{ag:dimension}の多様体を**曲線**という。曲線の点が非特異であることは、局所環が**離散付値環**（DVR）であることと同値で、正規性とも同値である。このため、曲線の特異点は**正規化**で解消でき、非特異な曲線の点は関数体の付値と一対一に対応する。主定理は、**非特異曲線から射影多様体への有理写像は射に延びる**こと、したがって**双有理同値な非特異射影曲線は同型**であることである。こうして非特異射影曲線は関数体だけで決まる。

> 非特異射影モデルの存在は本ページでは証明しない（hypcheck 参照）。

## 記法と定義の確認 {#ag:sec-cv-notation}

::: notation
- 多様体・局所環・関数体・射・有理写像・双有理同値は \ref{ag:regular-functions-principal}, \ref{ag:morphisms-coordinate-rings}, \ref{ag:rational-map}, \ref{ag:birational-equivalence}。一致の集合は閉（\ref{ag:agreement-closed}）。非特異点は \ref{ag:nonsingular-point}、\term[次元]{ag:dimension}と超越次数は \ref{ag:dimension-trdeg}。
- DVR の特徴づけは \ref{ring:dvr-characterization}、デデキント環は \ref{ring:dedekind}、ネーターの有限性定理（正規化の有限性）は \tref{ring:noether-finiteness}。DVR $R$ の付値を $v_{R}$、極大イデアルを $\mathfrak{m}_{R}$ と書く。
- **選択公理**：可換環論の引用を通して使う。
:::

## 曲線の非特異点 {#ag:sec-cv-dvr}

::: proposition 曲線の非特異点 {#ag:curve-nonsingular-dvr keywords="for a curve, P is nonsingular iff O_P is a DVR iff O_P is normal" index="曲線の非特異点|きょくせんのひとくいてん"}
曲線 $Y$ の点 $P$ について、次は同値：(1) $P$ は非特異、(2) $\mathcal{O}_{Y,P}$ は DVR、(3) $\mathcal{O}_{Y,P}$ は正規。アフィン曲線 $Y$ が非特異 $\iff$ $A(Y)$ が正規（したがってデデキント環）。
:::

::: proof
**Step 1.** $\mathcal{O}_{Y,P}$ は 1 \term[次元]{ring:krull-dimension}のネーター局所整域（\ref{ag:catenary.3}）。(1)：正則 $\iff$ 極大イデアルが 1 元で生成 $\iff$（\ref{ring:dvr-characterization.4}）DVR。(2)⇔(3) は同じ特徴づけの 5。

**Step 2.** 正規性は局所的（各極大イデアルでの局所化が正規なら正規。逆も）なので、$A(Y)$ が正規 $\iff$ すべての $\mathcal{O}_{Y,P}=A(Y)_{\mathfrak{m}_{P}}$ が正規。$A(Y)$ はネーターで次元 1 なので、正規ならデデキント環。
:::

::: theorem アフィン曲線の正規化 {#ag:curve-normalization keywords="the normalization of an affine curve is a nonsingular affine curve with a finite birational morphism to the original" index="曲線の正規化|きょくせんのせいきか"}
アフィン曲線 $Y$ について、$A(Y)$ の商体 $K(Y)$ における整閉包 $\tilde B$ は有限生成 $k$ 整域で、$\tilde B=A(\tilde Y)$ となるアフィン曲線 $\tilde Y$ は非特異。包含 $A(Y)\subset\tilde B$ に対応する射 $\nu:\tilde Y\to Y$ は全射で、各点の逆像は有限、双有理。
:::

::: proof
**Step 1.** ネーターの有限性定理（$L=K(Y)$）から $\tilde B$ は有限生成 $A(Y)$ 加群、したがって有限生成 $k$ 整域で、\ref{ag:morphisms-coordinate-rings.2} から $\tilde Y$ がある。整拡大なので $\dim\tilde B=1$、商体は $K(Y)$（双有理）。$\tilde B$ は正規なので \ref{ag:curve-nonsingular-dvr} から $\tilde Y$ は非特異。

**Step 2（全射・有限）.** $Y$ の点 $P$（極大イデアル $\mathfrak{m}_{P}$）の上の $\tilde Y$ の点は、$\mathfrak{m}_{P}$ の上にある $\tilde B$ の極大イデアルで、\ref{ring:lying-over}から存在する。それらは $\mathfrak{m}_{P}\tilde B$ 上の素イデアルで、$\tilde B/\mathfrak{m}_{P}\tilde B$ は有限次元 $k$ 代数（$\tilde B$ は有限生成 $A(Y)$ 加群）なので、有限個。
:::

## 関数体の付値 {#ag:sec-cv-valuations}

::: lemma アフィン曲線の点と付値環 {#ag:affine-curve-valuations keywords="for a nonsingular affine curve Y, the DVRs of K(Y) containing A(Y) are exactly the local rings O_P" index="曲線の点と付値環|きょくせんのてんとふちかん"}
非特異アフィン曲線 $Y$、$B=A(Y)$、$K=K(Y)$ について、$K$ の DVR で $B$ を含むものは、ちょうど $\mathcal{O}_{Y,P}=B_{\mathfrak{m}_{P}}$（$P\in Y$）で、$P\mapsto\mathcal{O}_{Y,P}$ は単射。
:::

::: proof
**Step 1（$\mathcal{O}_{Y,P}$ は DVR）.** \ref{ag:curve-nonsingular-dvr}。異なる点 $P\neq Q$ では $\mathfrak{m}_{P}\neq\mathfrak{m}_{Q}$ で、$\mathcal{O}_{Y,P}$ の極大イデアルと $B$ の共通部分は $\mathfrak{m}_{P}$ なので、局所環は異なる。

**Step 2（すべての付値環がこの形）.** $R\supset B$ を $K$ の DVR とし、$\mathfrak{p}\defeq\mathfrak{m}_{R}\cap B$（素イデアル）とする。$\mathfrak{p}=0$ なら $B\setminus\{0\}\subset R^{\times}$ で $R\supset\operatorname{Frac}B=K$、矛盾。よって $\mathfrak{p}\neq0$ で、$\dim B=1$ から極大、$\mathfrak{p}=\mathfrak{m}_{P}$。$B_{\mathfrak{m}_{P}}\subset R$（$B\setminus\mathfrak{m}_{P}$ の元は $R$ で可逆）。$x\in R\setminus B_{\mathfrak{m}_{P}}$ があれば、$B_{\mathfrak{m}_{P}}$ は付値環なので $x^{-1}\in\mathfrak{m}_{P}B_{\mathfrak{m}_{P}}\subset\mathfrak{m}_{R}$、すると $1=x\cdot x^{-1}\in\mathfrak{m}_{R}$ で矛盾。よって $R=B_{\mathfrak{m}_{P}}$。
:::

::: lemma 有限個の付値を除いて整 {#ag:almost-all-valuations keywords="an element of a function field of transcendence degree one lies in all but finitely many of its discrete valuation rings" index="付値環の有限性|ふちかんのゆうげんせい"}
$K/k$ を超越次数 1 の有限生成拡大、$C_{K}$ を $K$ の DVR で $k$ を含むものの集合とする。$x\in K$ について、$x\notin R$ となる $R\in C_{K}$ は有限個。
:::

::: proof
**Step 1.** $x$ が $k$ 上代数的なら $x\in k$（$k$ は代数閉）で、すべての $R$ に入る。そうでなければ $k[y]\defeq k[x^{-1}]$ は多項式環で、$K$ は $k(y)$ 上有限次。

**Step 2.** $x\notin R$ なら $v_{R}(x)<0$ で $y=x^{-1}\in\mathfrak{m}_{R}$。$R$ は $k[y]$ を含み、正規なので $k[y]$ の $K$ における整閉包 $B'$ を含む（\ref{ring:noether-finiteness} から $B'$ は有限生成 $k$ 整域で、正規、1 \term[次元]{ring:krull-dimension}、すなわち非特異アフィン曲線の座標環）。\ref{ag:affine-curve-valuations} から $R=B'_{\mathfrak{n}}$（$\mathfrak{n}$ は $B'$ の極大イデアル）で、$y\in\mathfrak{n}$。

**Step 3.** $y$ を含む $B'$ の極大イデアルは、$yB'$ 上の素イデアルで、$B'/yB'$ は有限次元（$B'$ は $k[y]$ 上有限生成加群で、$k[y]/(y)=k$）なので有限個。よって $x\notin R$ となる $R$ は有限個。
:::

## 射の延長 {#ag:sec-cv-extension}

::: theorem 非特異曲線からの射の延長 {#ag:curve-morphism-extension keywords="a morphism from a nonsingular curve minus a point to a projective variety extends uniquely to the whole curve" index="射の延長（曲線）|しゃのえんちょうきょくせん"}
$X$ を非特異曲線、$P\in X$、$Y$ を射影多様体とする。射 $\varphi:X\setminus\{P\}\to Y$ は、射 $\bar\varphi:X\to Y$ に一意に延びる。したがって、非特異曲線から射影多様体への有理写像はすべて射（全域で定義される）。
:::

::: proof
**Step 1（座標）.** $Y\subset\mathbb{P}^{n}$ とし、$\varphi(X\setminus\{P\})$ が $V(x_{i})$ に含まれない $i$ をとる（$\varphi$ の像は既約で、すべての $V(x_{i})$ に含まれることはない）。並べ替えて $i=0$ とすると、$\varphi^{-1}(U_{0})$ は空でない開集合で、その上で $\varphi=(1:f_{1}:\dots:f_{n})$（$f_{j}=x_{j}/x_{0}$ の引き戻し、$f_{j}\in K(X)$）。

**Step 2（付値で正規化）.** $R\defeq\mathcal{O}_{X,P}$ は DVR（\ref{ag:curve-nonsingular-dvr}）、$v\defeq v_{R}$、$t$ をその一意化元とする。$f_{0}\defeq1$ とし、$m\defeq\min_{j}v(f_{j})$ となる $j_{0}$ をとる。$g_{j}\defeq t^{-m}f_{j}$ とおくと $v(g_{j})\ge0$（すなわち $g_{j}\in R$、$P$ の近傍で正則）で、$v(g_{j_{0}})=0$（$g_{j_{0}}(P)\neq0$）。

**Step 3（延長）.** $P$ の近傍 $W$ で、$g_{0},\dots,g_{n}$ と $t$ がすべて正則、$g_{j_{0}}$ が $0$ にならず、$t$ の零点が $P$ だけであるものをとり（零点の集合は真の閉集合、すなわち有限集合なので、$P$ 以外の零点を除けばよい）、$\psi\defeq(g_{0}:\dots:g_{n}):W\to\mathbb{P}^{n}$（$U_{j_{0}}$ に値をとる射）とする。$W\setminus\{P\}$ では $t$ は $0$ でないので、$\varphi$ の定義域と交わる部分で $(g_{j})=t^{-m}(f_{j})$ は $(f_{j})$ と同じ点を表すので $\psi=\varphi$。$\psi(W)\subset Y$：$\psi^{-1}(Y)$ は閉（$Y$ は閉）で $W\setminus\{P\}$ の稠密な部分を含むので $W$ 全体。$\varphi$ と $\psi$ を貼り合わせて $\bar\varphi$ を得る（\ref{ag:agreement-closed} から重なりで一致）。

**Step 4（一意性）.** 二つの延長は $X\setminus\{P\}$ で一致するので全体で一致（\ref{ag:agreement-closed}）。有理写像の主張は、定義されない点が有限個（定義域は空でない開集合で、曲線の真の閉集合は有限集合）なので、1 点ずつ延長すればよい。
:::

::: corollary 双有理同値な非特異射影曲線 {#ag:birational-curves-isomorphic keywords="birationally equivalent nonsingular projective curves are isomorphic; dominant rational maps between them are morphisms" index="非特異射影曲線の一意性|ひとくいしゃえいきょくせんのいちいせい"}
1. 非特異射影曲線の間の有理写像はすべて射。
2. 双有理同値な非特異射影曲線は同型。したがって、非特異射影曲線は（同型を除いて）関数体だけで決まり、関手 $X\mapsto K(X)$ は、非特異射影曲線と支配的射の圏から、超越次数 1 の有限生成拡大 $K/k$ の圏への充満忠実な反変関手。
:::

::: proof
1 は \ref{ag:curve-morphism-extension}。2：双有理写像 $\varphi:X\dashrightarrow Y$, $\psi:Y\dashrightarrow X$ は 1 から射で、$\psi\varphi$ と $\varphi\psi$ は空でない開集合で恒等なので全体で恒等（\ref{ag:agreement-closed}）。充満忠実は \ref{ag:birational-equivalence-fields} と 1（支配的有理写像＝支配的射）から。
:::

::: example
$\mathbb{P}^{1}$ の関数体は $k(t)$ で、$C_{k(t)}$ の元は $k[t]_{(t-a)}$（$a\in k$、$\mathbb{P}^{1}$ の点 $(1:a)$）と $k[t^{-1}]_{(t^{-1})}$（無限遠点 $(0:1)$）。実際、$k(t)$ の DVR で $k$ を含むものは、$t$ を含めば $k[t]$ を含み \ref{ag:affine-curve-valuations} から $k[t]_{(t-a)}$、含まなければ $t^{-1}\in\mathfrak{m}$ で無限遠点のもの。$C_{K}$ と $\mathbb{P}^{1}$ の点が一対一に対応する。
:::

::: remark 抽象曲線と永田の完備化
1. **存在定理（本サイトでは未証明）**：超越次数 1 の有限生成拡大 $K/k$ には、非特異射影曲線 $X$ で $K(X)\cong K$ となるものがある。標準的な証明は、$C_{K}$ に（\ref{ag:almost-all-valuations} を使って）補有限位相と局所環の層を入れた「抽象曲線」を作り、有限個のアフィン片の閉包の積への射の像として射影空間に埋め込む。これで \ref{ag:birational-curves-isomorphic.2} の関手は圏同値になる。上の例は $K=k(t)$ のとき $C_{K}\cong\mathbb{P}^{1}$ であることを示している。
2. **抽象多様体の必要性**：この構成は、多様体をはじめから射影空間の中で考えるのではなく、「局所環をもつ空間」として抽象的に作ってから埋め込む、という発想を含む。高次元では埋め込めない（完備だが射影的でない）多様体があり（永田雅宜、1950 年代後半；広中の例）、射影的な多様体だけでは理論が閉じない。グロタンディークが多様体を射影空間から切り離し、局所環付き空間として定義した（\ref{ag:page-schemes}）理由の一つである。
3. **永田の完備化定理**（1962）：有限型の分離スキーム（たとえば多様体）は、完備な（固有な）スキームの開部分スキームとして埋め込める。曲線では非特異射影モデルがその役割を果たす。永田の名前は「病理的な反例」だけでなく、このような基礎定理にも残っている。
:::

::: hypcheck
- **選択公理**：可換環論の引用を通して使う。
- **非特異性（DVR）**：射の延長（Step 2 の付値による正規化）に本質的。尖点 $V(y^{2}-x^{3})\to\mathbb{A}^{1}$, $(x,y)\mapsto y/x$ は原点で延びない（正規化 $\mathbb{A}^{1}$ では延びる）。
- **$Y$ が射影的**：Step 3 で斉次座標を一斉に $t^{-m}$ 倍できることに使った。アフィン多様体では延びない例がある（$\mathbb{A}^{1}\setminus\{0\}\to\mathbb{A}^{1}$, $t\mapsto1/t$）。
- **\term[次元]{ag:dimension} 1**：Step 2 で局所環が DVR であること、Step 4 で真の閉集合が有限であることに使った。高次元では延びない（$\mathbb{A}^{2}\dashrightarrow\mathbb{P}^{1}$, $(x:y)$ は原点で延びない）。
- **$k$ が代数閉**：\ref{ag:almost-all-valuations} の Step 1 に使った。
:::

::: supplement
**前提を変えると.** 高次元では、射影多様体への有理写像の不確定点は余次元 2 以上の閉集合に限られる（正規多様体なら）ことが知られている（本サイト未収録）。曲線ではそれが空になるのが \ref{ag:curve-morphism-extension} である。

**計算の観点.** 曲線の正規化（\ref{ag:curve-normalization}）は、整閉包を計算するアルゴリズム（グラウエルト–レマートの判定法など）で計算できることが知られている（本サイト未収録）。
:::

## 高い視点 {#ag:sec-cv-viewpoint}

::: remark 曲線＝関数体の付値の空間
非特異射影曲線の点は、関数体 $K$ の「関数の零・極の位置」、すなわち付値そのものである。曲線を描く代わりに、「どの関数がどの点でどれだけ消えるか」を記録する付値の全体が曲線になる。これは数体の整数環の素イデアル（代数的整数論で扱う）と同じ構造で、$\mathbb{Z}$ と $k[t]$、数体と関数体の類似（ヴェイユ）の出発点である。比喩で言えば、曲線は「関数体という音楽の、音の高さ（付値）を並べた鍵盤」である。
:::

## 問題 {#ag:sec-cv-problems}

::: problem {#ag:prob-cv-cusp-normalization}
尖点 $Y=V(y^{2}-x^{3})$ の正規化が $\mathbb{A}^{1}\to Y$, $t\mapsto(t^{2},t^{3})$ であることを確かめよ。
:::

::: solution
$A(Y)\cong k[t^{2},t^{3}]\subset k[t]$（$x\mapsto t^{2}$, $y\mapsto t^{3}$）で、商体は $k(t)$（$t=y/x$）。$t$ は $T^{2}-t^{2}=0$ の根なので $A(Y)$ 上整、$k[t]$ は一意分解環なので正規。よって $A(Y)$ の整閉包は $k[t]$（$k[t]\supset$ 整閉包 $\supset k[t^{2},t^{3}][t]=k[t]$）で、\ref{ag:curve-normalization} の $\tilde Y=\mathbb{A}^{1}$、$\nu$ は包含に対応する $t\mapsto(t^{2},t^{3})$。
:::
