# アフィン多様体と射 {#ag:page-affine-varieties keywords="affine variety, coordinate ring, regular function, sheaf of regular functions, regular functions on principal open sets are A_f, local ring at a point, function field, morphism of varieties, anti-equivalence with finitely generated domains, A^2 minus origin is not affine"}

既約な代数的集合を**アフィン多様体**という。その上の**正則関数**（局所的に多項式の商で書ける関数）は層をなし、大域的な正則関数の環は**座標環** $A(Y)=k[x_{1},\dots,x_{n}]/I(Y)$ に一致する。さらに主開集合 $D(f)$ の上では局所化 $A(Y)_{f}$、点 $P$ の茎では局所環 $A(Y)_{\mathfrak{m}_{P}}$ になる。多様体の射 $X\to Y$（$Y$ はアフィン）は座標環の $k$ 代数準同型 $A(Y)\to\mathcal{O}(X)$ と一対一で、**アフィン多様体の圏は有限生成 $k$ 整域の圏と反同値**になる。

> 資料によらず、標準的な議論で書いた。

## 記法と定義の確認 {#ag:sec-av-notation}

::: notation
- $k$ は代数閉体、$A=k[x_{1},\dots,x_{n}]$。代数的集合・ザリスキ位相・主開集合 $D(f)$・零点定理による対応・既約性は \ref{ag:algebraic-set}, \ref{ag:zariski-topology}, \ref{ag:algebraic-radical-correspondence}, \ref{ag:irreducible-prime}。
- 局所化 $B_{f}$, $B_{\mathfrak{p}}$ とその普遍性は \ref{ring:localization}, \ref{ring:localization-universal}。多項式環の普遍性は \ref{ring:multivariate-universal}。
- 層・茎は \ref{cat:sheaf-space}, \ref{cat:stalk}。連続関数の層は層（\ref{cat:presheaf-examples} の 1）。
- **選択公理**：使わない。
:::

## アフィン多様体と座標環 {#ag:sec-av-varieties}

::: definition アフィン多様体と座標環 {#ag:affine-variety keywords="affine variety (irreducible algebraic set), quasi-affine variety, coordinate ring A(Y)" index="アフィン多様体|あふぃんたようたい, 座標環|ざひょうかん, 準アフィン多様体|じゅんあふぃんたようたい"}
既約な代数的集合 $Y\subset\mathbb{A}^{n}$（ザリスキ位相）を**アフィン多様体**、その空でない開部分集合を**準アフィン多様体**という。$A(Y)\defeq A/I(Y)$ を $Y$ の**座標環**という。$I(Y)$ は素イデアルなので $A(Y)$ は有限生成 $k$ 代数で整域。$\bar f\in A(Y)$ は $Y$ 上の関数 $P\mapsto f(P)$ と同一視できる（$f\equiv g\pmod{I(Y)}$ なら $Y$ 上で同じ値）。
:::

::: lemma 座標環の上の零点定理 {#ag:nullstellensatz-coordinate-ring keywords="Nullstellensatz relative to an affine variety: closed subsets of Y correspond to radical ideals of A(Y); points to maximal ideals" index="座標環の零点定理|ざひょうかんのれいてんていり"}
アフィン多様体 $Y$ について、$Y$ の閉集合と $A(Y)$ の根基イデアルは $Z\mapsto I_{Y}(Z)\defeq I(Z)/I(Y)$, $\mathfrak{b}\mapsto V_{Y}(\mathfrak{b})$ で一対一に対応し、$Y$ の点は $A(Y)$ の極大イデアル $\mathfrak{m}_{P}$ と対応する。とくに $Y$ 上で値がすべて $0$ の $\bar f\in A(Y)$ は $0$。
:::

::: proof
$A(Y)$ のイデアル（根基イデアル、極大イデアル）は、$I(Y)$ を含む $A$ のイデアル（根基、極大）と一対一に対応し、$Y$ の閉集合は $Y$ に含まれる $\mathbb{A}^{n}$ の閉集合。\ref{ag:algebraic-radical-correspondence} を $I(Y)$ を含む部分に制限すればよい。最後の主張は $V_{Y}(\bar f)=Y$ から $\bar f\in I_{Y}(Y)=0$。
:::

## 正則関数 {#ag:sec-av-regular}

::: definition 正則関数 {#ag:regular-function keywords="regular function on a quasi-affine variety: locally a quotient of polynomials" index="正則関数（代数多様体）|せいそくかんすうだいすうたようたい"}
準アフィン多様体 $X\subset\mathbb{A}^{n}$ の開集合 $U$ 上の関数 $\varphi:U\to k$ が**正則**であるとは、各点 $P\in U$ に開近傍 $V\subset U$ と多項式 $g,h$ で、$V$ 上 $h$ が $0$ にならず $\varphi=g/h$ となるものがあることをいう。$U$ 上の正則関数の環を $\mathcal{O}_{X}(U)$ と書く。
:::

::: proposition 正則関数の層 {#ag:regular-functions-sheaf keywords="regular functions form a sheaf of k-algebras; regular functions are continuous" index="正則関数の層|せいそくかんすうのそう"}
1. 正則関数は連続（$k=\mathbb{A}^{1}$ にザリスキ位相を入れて）。
2. $U\mapsto\mathcal{O}_{X}(U)$ は $k$ 代数の層。
3. 二つの正則関数が空でない開集合上で一致すれば、それらの定義域の共通部分全体で一致する（**一致の原理**）。
:::

::: proof
**Step 1（1）.** $\mathbb{A}^{1}$ の閉集合は有限集合なので、点 $c$ の逆像 $\varphi^{-1}(c)$ が閉であることを示せばよい。$V$ 上 $\varphi=g/h$ なら $\varphi^{-1}(c)\cap V=V\cap V(g-ch)$ は $V$ で閉。閉であることは局所的なので、$\varphi^{-1}(c)$ は $U$ で閉。

**Step 2（2）.** 正則性は局所的な条件なので、関数の層（\ref{cat:presheaf-examples} の 1）の部分層。和・積・定数は正則（$g/h+g'/h'=(gh'+g'h)/(hh')$ など）。

**Step 3（3）.** 差 $\psi$ が開集合 $W\neq\emptyset$ で $0$ とすると、1 から $\psi^{-1}(0)$ は閉で $W$ を含む。$X$ は既約なので $W$ は稠密（\ref{ag:irreducible-space}）、したがって $\psi^{-1}(0)$ は定義域全体。
:::

::: theorem 主開集合上の正則関数 {#ag:regular-functions-principal keywords="O(D(f)) = A(Y)_f, O(Y) = A(Y), O_{Y,P} = A(Y)_{m_P}, function field" index="主開集合上の正則関数|しゅかいしゅうごうじょうのせいそくかんすう, 関数体（多様体）|かんすうたいたようたい"}
アフィン多様体 $Y$ と $f\in A(Y)$ について：
1. $A(Y)_{f}\to\mathcal{O}_{Y}(D(f))$, $g/f^{N}\mapsto(P\mapsto g(P)/f(P)^{N})$ は $k$ 代数の同型。とくに $f=1$ で $\mathcal{O}_{Y}(Y)\cong A(Y)$。
2. 点 $P$ について、茎 $\mathcal{O}_{Y,P}$ は局所環 $A(Y)_{\mathfrak{m}_{P}}$ と同型。
3. 芽の全体を空でない開集合について合わせた $K(Y)\defeq\operatorname*{colim}_{U\neq\emptyset}\mathcal{O}_{Y}(U)$（**関数体**）は $A(Y)$ の商体と同型。
:::

::: proof
以下 $B\defeq A(Y)$（整域）とし、$D(f)$ は $Y$ の中の主開集合。

**Step 1（単射）.** $g/f^{N}$ が $D(f)$ 上の関数として $0$ なら、$fg$ は $Y$ 上で $0$（$D(f)$ では $g=0$、$V(f)$ では $f=0$）なので、\ref{ag:nullstellensatz-coordinate-ring} から $fg=0$ in $B$、したがって $B_{f}$ で $g/f^{N}=0$。

**Step 2（全射：主開集合による被覆）.** $\varphi\in\mathcal{O}(D(f))$ をとる。各点 $P\in D(f)$ に $\varphi=g/h$（近傍 $V$ 上）をとり、$V$ を主開集合 $D(h')\subset V\cap D(h)$（$P\in D(h')$）に縮め、$g\mapsto gh'$, $h\mapsto hh'$ と取り替えると、$D(hh')=D(h')$ 上で $\varphi=gh'/(hh')$。よって近傍は分母の主開集合 $D(h)$ にとれる。$Y$ はネーター空間なので開集合 $D(f)$ は準コンパクト（開被覆の和の増加列は止まる）で、有限個の $D(h_{1}),\dots,D(h_{m})$ で覆え、$D(h_{i})$ 上 $\varphi=g_{i}/h_{i}$。

**Step 3（全射：分母の調整）.** $D(h_{i})\cap D(h_{j})=D(h_{i}h_{j})$ 上で $g_{i}h_{j}=g_{j}h_{i}$ なので、$h_{i}h_{j}(g_{i}h_{j}-g_{j}h_{i})$ は $Y$ 上で $0$、したがって $B$ で $0$。$g_{i}$ を $g_{i}h_{i}$、$h_{i}$ を $h_{i}^{2}$ に取り替える（$D(h_{i}^{2})=D(h_{i})$ 上の同じ関数）と、$B$ の中で $g_{i}h_{j}=g_{j}h_{i}$ がすべての $i,j$ で成り立つ。

**Step 4（全射：零点定理）.** $Y\cap V(h_{1},\dots,h_{m})\subset V(f)$（$D(f)=\bigcup D(h_{i})$）なので、\ref{ag:nullstellensatz-coordinate-ring} から $f\in\sqrt{(h_{1},\dots,h_{m})}$、すなわち $f^{N}=\sum a_{i}h_{i}$。$\psi\defeq\sum a_{i}g_{i}$ とおくと、$h_{j}\psi=\sum a_{i}g_{i}h_{j}=\sum a_{i}h_{i}g_{j}=f^{N}g_{j}$ なので、$D(h_{j})$ 上 $\psi/f^{N}=g_{j}/h_{j}=\varphi$。よって $\varphi$ は $\psi/f^{N}$ の像。

**Step 5（2）.** 芽 $\varphi_{P}$ は近傍で $g/h$（$h(P)\neq0$）と書け、$g/h\in B_{\mathfrak{m}_{P}}$ を対応させる。これが well-defined な同型であることは、Step 1 と同じ議論（$P$ の近傍で関数として一致する $g/h$, $g'/h'$ は $B$ で $(gh'-g'h)h''=0$, $h''(P)\neq0$）と、$B_{\mathfrak{m}_{P}}$ の元が $P$ の近傍 $D(h)$ 上の正則関数を与えることから。

**Step 6（3）.** 同様に、空でない開集合上の正則関数の芽は、ある $D(h)$ 上の $g/h^{N}$ で表され、$\operatorname{Frac}B$ の元 $g/h^{N}$ と一対一に対応する（一致の原理 \ref{ag:regular-functions-sheaf} の 3 で、空でない開集合で一致すれば全体で一致）。
:::

## 射 {#ag:sec-av-morphisms}

::: definition 多様体の射 {#ag:morphism-varieties keywords="morphism of (quasi-)affine varieties: continuous map pulling back regular functions to regular functions" index="多様体の射|たようたいのしゃ"}
準アフィン多様体 $X,Y$ の**射** $\varphi:X\to Y$ とは、連続写像で、$Y$ の開集合 $V$ と正則関数 $g\in\mathcal{O}_{Y}(V)$ について $g\circ\varphi\in\mathcal{O}_{X}(\varphi^{-1}V)$ となるものをいう。射は $k$ 代数の準同型 $\varphi^{*}:\mathcal{O}_{Y}(Y)\to\mathcal{O}_{X}(X)$, $g\mapsto g\circ\varphi$ を誘導する。
:::

::: theorem 射と座標環 {#ag:morphisms-coordinate-rings keywords="Hom(X,Y) = Hom_{k-alg}(A(Y), O(X)) for Y affine; anti-equivalence between affine varieties and finitely generated k-domains" index="アフィン多様体の圏|あふぃんたようたいのけん"}
1. 準アフィン多様体 $X$ とアフィン多様体 $Y\subset\mathbb{A}^{n}$ について、$\varphi\mapsto\varphi^{*}$ は全単射 $\operatorname{Hom}(X,Y)\to\operatorname{Hom}_{k\text{-alg}}(A(Y),\mathcal{O}_{X}(X))$。
2. $Y\mapsto A(Y)$ は、アフィン多様体の圏と、有限生成 $k$ 整域の圏の反同値。
:::

::: proof
**Step 1（逆写像の構成）.** $\theta:A(Y)\to\mathcal{O}(X)$ について $\xi_{i}\defeq\theta(\bar x_{i})$ とし、$\psi\defeq(\xi_{1},\dots,\xi_{n}):X\to k^{n}$ とおく。$g\in I(Y)$ について $g(\psi(P))=\theta(\bar g)(P)=0$（$\theta$ は $k$ 代数準同型なので、多項式への代入と可換）なので $\psi(X)\subset Y$。

**Step 2（$\psi$ は射）.** $Y$ の閉集合 $V_{Y}(\bar g)$ の逆像は $\{P : \theta(\bar g)(P)=0\}$ で、正則関数は連続なので閉。$Y$ の開集合 $V$ 上の正則関数 $g/h$ について $(g/h)\circ\psi=\theta(\bar g)/\theta(\bar h)$ は $\psi^{-1}V$ 上で正則（正則関数の商で、分母は $0$ にならない）。正則性は局所的なので一般の正則関数でも同じ。

**Step 3（互いに逆）.** $\psi^{*}(\bar x_{i})=\xi_{i}=\theta(\bar x_{i})$ で、$A(Y)$ は $\bar x_{i}$ で生成されるので $\psi^{*}=\theta$。逆に射 $\varphi$ について、$\varphi^{*}$ から作った $\psi$ は $\psi=(x_{1}\circ\varphi,\dots,x_{n}\circ\varphi)=\varphi$。

**Step 4（2）.** 1 で $X$ もアフィンなら $\mathcal{O}(X)=A(X)$（\ref{ag:regular-functions-principal}）なので、$A(-)$ は充満忠実な反変関手。本質的全射：有限生成 $k$ 整域 $B$ は $A/\mathfrak{p}$（$\mathfrak{p}$ は素イデアル）と同型で、$Y\defeq V(\mathfrak{p})$ は既約（\ref{ag:irreducible-prime}）、$A(Y)=A/I(V(\mathfrak{p}))=A/\mathfrak{p}\cong B$（零点定理、素イデアルは根基）。
:::

::: example 射の例 {#ag:affine-examples}
1. **双曲線**：$\mathbb{A}^{1}\setminus\{0\}=D(x)\subset\mathbb{A}^{1}$ は、$\mathcal{O}(D(x))=k[x]_{x}=k[x,x^{-1}]\cong k[x,y]/(xy-1)$ により、アフィン多様体 $V(xy-1)\subset\mathbb{A}^{2}$ と同型（射 $t\mapsto(t,1/t)$ と射影）。準アフィン多様体がアフィンになることがある。
2. **$\mathbb{A}^{2}\setminus\{0\}$ はアフィンでない**：$X\defeq\mathbb{A}^{2}\setminus\{(0,0)\}=D(x)\cup D(y)$。$\mathcal{O}(X)$ の元は $D(x)$ と $D(y)$ への制限で $k[x,y]_{x}\cap k[x,y]_{y}$（$k(x,y)$ の中で）に入り、$k[x,y]$ は一意分解環なので、$g/x^{a}=h/y^{b}$（$g,h$ は $x$, $y$ で割り切れない形に約分）から $a=b=0$、すなわち $\mathcal{O}(X)=k[x,y]$。$X$ がアフィンなら、包含 $X\to\mathbb{A}^{2}$ は $\mathcal{O}$ の同型を誘導するので、1 から同型、特に全単射になるが、原点が像に入らない。矛盾。
3. **尖点**：$C=V(y^{2}-x^{3})$ について、$\mathbb{A}^{1}\to C$, $t\mapsto(t^{2},t^{3})$ は全単射な射だが同型でない：$A(C)\cong k[t^{2},t^{3}]\subsetneq k[t]$（座標環が同型でない）。全単射で連続でも、逆写像 $(x,y)\mapsto y/x$ は原点で正則でない。
:::

::: remark グロタンディークへの道
1. 反同値 2 は「幾何（アフィン多様体）＝代数（有限生成整域）の反対」という辞書である。グロタンディークはこれを、**すべての可換環** $R$ について「$\operatorname{Spec}R$ という幾何的対象」を考え、アフィンスキームの圏と可換環の圏の反同値（\ref{ag:page-schemes}）に拡張した。有限生成性・整域性・代数閉体を外すことで、整数論（$\operatorname{Spec}\mathbb{Z}$）と幾何を同じ言葉で扱えるようにすることが狙いの一つだった。
2. 例 3 の尖点は、「点の集合と連続写像」だけでは多様体を区別できず、構造層 $\mathcal{O}$ が本質的であることを示す。スキームの定義が「位相空間＋環の層」の組（局所環付き空間）になっているのはこのためである。
:::

::: hypcheck
- **選択公理**：使わない。Step 2 では「$\varphi=g/h$ と書ける主開集合 $D(h)$」の全体という（選択なしに定まる）開被覆をとり、準コンパクト性で有限個を取り出してから、その有限個について $g_{i},h_{i}$ を選ぶ（有限個の選択）。
- **既約性（整域性）**：一致の原理（\ref{ag:regular-functions-sheaf} の 3）と関数体の定義に使った。主開集合の定理の 1・2 は被約性だけで成り立つ（Step 1 で $fg=0$ を導くのに被約性、すなわち「関数として $0$ なら $0$」を使った）。
- **零点定理**：Step 4（$f\in\sqrt{(h_{i})}$）と、\ref{ag:nullstellensatz-coordinate-ring} に使った。
- **ネーター性**（準コンパクト性）：Step 2 で有限個の被覆にするのに使った。
:::

::: supplement
**前提を変えると.** 被約な（整域とは限らない）有限生成 $k$ 代数は、既約とは限らないアフィン代数的集合に対応し、同様の反同値が成り立つ。冪零元を許すと点の集合では表せなくなり、スキームが必要になる。

**計算の観点.** 射 $X\to Y$ は座標の多項式（またはその商）の組で与えられ、それが $Y$ に入ることは $I(Y)$ の生成元への代入で確かめられる（有限回の多項式の計算）。二つのアフィン多様体が同型かの判定は、有限生成整域の同型問題で、一般には難しい（決定可能性は本サイト未収録）。
:::

## 高い視点 {#ag:sec-av-viewpoint}

::: remark 関数で空間を知る
反同値 2 は、ゲルファント–ナイマルク（コンパクトハウスドルフ空間と可換 C* 環）やストーン双対性（\ref{top:page-stone-duality}）と同じ型の「空間＝その上の関数の環の反対」という原理の代数版である。比喩で言えば、地形（多様体）を直接見る代わりに、地形の上の高さの測り方（正則関数）の全体を調べれば地形が分かる。射は「関数を引き戻す規則」として測り方の側から定義され、圏の反同値は「地形の写像＝測り方の逆向きの変換」を表す。
:::

## 問題 {#ag:sec-av-problems}

::: problem {#ag:prob-av-parabola}
放物線 $P=V(y-x^{2})\subset\mathbb{A}^{2}$ は $\mathbb{A}^{1}$ と同型であることを座標環で示し、双曲線 $H=V(xy-1)$ は $\mathbb{A}^{1}$ と同型でないことを示せ。
:::

::: solution
$A(P)=k[x,y]/(y-x^{2})\cong k[x]$（$y\mapsto x^{2}$）なので、\ref{ag:morphisms-coordinate-rings} の 2 から $P\cong\mathbb{A}^{1}$（射 $t\mapsto(t,t^{2})$ と $(x,y)\mapsto x$）。$A(H)\cong k[x,x^{-1}]$ は、単元群が $k^{\times}\times x^{\mathbb{Z}}$ で $k^{\times}$ より大きいが、$k[t]$ の単元は $k^{\times}$ だけなので、$k[t]\not\cong k[x,x^{-1}]$。よって $H\not\cong\mathbb{A}^{1}$。
:::
