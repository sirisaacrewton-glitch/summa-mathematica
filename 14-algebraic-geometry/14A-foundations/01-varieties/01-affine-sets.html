# アフィン代数的集合とザリスキ位相 {#ag:page-affine-sets keywords="affine space, algebraic set, ideal of a set, Zariski topology, Nullstellensatz correspondence, irreducible space, irreducible components, noetherian topological space, hypersurfaces"}

代数閉体 $k$ 上の $n$ 次元**アフィン空間** $\mathbb{A}^{n}=k^{n}$ の中で、多項式の共通零点として表される集合を**代数的集合**という。代数的集合を閉集合とする位相が**ザリスキ位相**で、零点定理により、代数的集合は多項式環の根基イデアルと一対一に対応する。この対応で、既約な集合は素イデアルに、点は極大イデアルに対応する。ザリスキ位相はハウスドルフでない粗い位相だが、ネーター的なので、すべての代数的集合は有限個の既約成分に一意に分解する。

> 資料によらず、標準的な議論で書いた（指定の参考書 Hartshorne『Algebraic Geometry』のテキストは資料フォルダにない）。可換環論の結果は 13A から引用する。

## 記法と定義の確認 {#ag:sec-as-notation}

::: notation
- $k$ は代数閉体、$A\defeq k[x_{1},\dots,x_{n}]$。多項式 $f$ と点 $a\in k^{n}$ について $f(a)$ は代入した値。
- 根基・根基イデアルは \ref{ring:radical-ideal}、ネーター環とヒルベルトの基底定理は \ref{ring:noetherian-artinian-def}, \ref{ring:hilbert-basis}、多項式環の一意分解性は \ref{ring:polynomial-ufd}。
- 零点定理（弱形・強形）は \ref{ring:weak-nullstellensatz}, \ref{ring:nullstellensatz}。そこでは零点集合を $V(J)$ と書いており、本ページもそれに従う（Hartshorne では $Z(J)$）。
- ハウスドルフ空間は \ref{top:hausdorff}。
- **選択公理**：使わない。
:::

## 代数的集合とザリスキ位相 {#ag:sec-as-zariski}

::: definition 代数的集合とイデアル {#ag:algebraic-set keywords="affine algebraic set V(T), ideal I(Y) of a subset" index="代数的集合|だいすうてきしゅうごう, アフィン空間|あふぃんくうかん"}
$T\subset A$ について $V(T)\defeq\{a\in k^{n} : f(a)=0\ (f\in T)\}$ を $T$ の**零点集合**といい、この形の集合を**（アフィン）代数的集合**という。部分集合 $Y\subset k^{n}$ について $I(Y)\defeq\{f\in A : f(a)=0\ (a\in Y)\}$ を $Y$ の**イデアル**という。
:::

::: proposition 零点集合の性質 {#ag:zero-set-properties keywords="V reverses inclusions, V of products and sums, every algebraic set is cut out by finitely many polynomials" index="零点集合の性質|れいてんしゅうごうのせいしつ"}
1. $T\subset T'$ なら $V(T')\subset V(T)$。$V(T)=V((T))$（$(T)$ は $T$ の生成するイデアル）$=V(\sqrt{(T)})$。
2. $V(0)=k^{n}$, $V(A)=\emptyset$。
3. イデアル $\mathfrak{a},\mathfrak{b}$ について $V(\mathfrak{a})\cup V(\mathfrak{b})=V(\mathfrak{a}\cap\mathfrak{b})=V(\mathfrak{a}\mathfrak{b})$。
4. イデアルの族について $\bigcap_{\lambda}V(\mathfrak{a}_{\lambda})=V(\sum_{\lambda}\mathfrak{a}_{\lambda})$。
5. 代数的集合は有限個の多項式の零点集合。
6. $I(Y)$ は根基イデアル、$Y\subset V(I(Y))$ で、$V(I(Y))$ は $Y$ を含む最小の代数的集合。
:::

::: proof
**Step 1（1）.** 前半は定義から。$f,g\in T$ が $a$ で消えれば $hf+h'g$ も消えるので $V(T)=V((T))$。$f^{m}\in(T)$ で $f^{m}(a)=0$ なら $f(a)=0$（$k$ は体）なので $V(\sqrt{(T)})=V((T))$。

**Step 2（2）.** $0$ はどこでも消え、$1\in A$ はどこでも消えない。

**Step 3（3）.** $\mathfrak{a}\mathfrak{b}\subset\mathfrak{a}\cap\mathfrak{b}\subset\mathfrak{a}$ から $V(\mathfrak{a})\cup V(\mathfrak{b})\subset V(\mathfrak{a}\cap\mathfrak{b})\subset V(\mathfrak{a}\mathfrak{b})$。逆に $a\in V(\mathfrak{a}\mathfrak{b})$ で $a\notin V(\mathfrak{a})$ なら、$f\in\mathfrak{a}$ で $f(a)\neq0$ となるものがあり、すべての $g\in\mathfrak{b}$ で $f(a)g(a)=(fg)(a)=0$ から $g(a)=0$、すなわち $a\in V(\mathfrak{b})$。

**Step 4（4）.** $a$ が各 $\mathfrak{a}_{\lambda}$ の元で消えることと、それらの有限和 $\sum\mathfrak{a}_{\lambda}$ の元で消えることは同値。

**Step 5（5）.** ヒルベルトの基底定理から $(T)$ は有限生成 $(f_{1},\dots,f_{m})$ で、1 から $V(T)=V(f_{1},\dots,f_{m})$。

**Step 6（6）.** $I(Y)$ がイデアルなのは明らか。$f^{m}\in I(Y)$ なら $f$ も $Y$ で消える。$Y\subset V(\mathfrak{a})$ なら $\mathfrak{a}\subset I(Y)$ で、$V(I(Y))\subset V(\mathfrak{a})$。
:::

::: definition ザリスキ位相 {#ag:zariski-topology keywords="Zariski topology on affine space: closed sets are algebraic sets" index="ザリスキ位相|ざりすきいそう"}
\ref{ag:zero-set-properties} の 2〜4 から、代数的集合の全体は閉集合系の公理をみたす（有限和と任意の共通部分で閉じ、$\emptyset$ と $k^{n}$ を含む）。これを閉集合とする $k^{n}$ の位相を**ザリスキ位相**といい、この位相をもつ $k^{n}$ を $\mathbb{A}^{n}$ と書く。部分集合には相対位相を入れる。$f\in A$ について $D(f)\defeq\mathbb{A}^{n}\setminus V(f)$ を**主開集合**という。
:::

::: example ザリスキ位相の例 {#ag:zariski-examples}
1. **$\mathbb{A}^{1}$**：$k[x]$ は PID で、$0$ でない多項式の零点は有限個。よって閉集合は有限集合と全体で、ザリスキ位相は**補有限位相**。$k$ は無限集合（代数閉体は無限：有限体 $\{a_{1},\dots,a_{q}\}$ なら $\prod(x-a_{i})+1$ は根をもたない）なので、二つの空でない開集合はつねに交わり、ハウスドルフでない。
2. **$\mathbb{A}^{2}$ と積位相**：$\mathbb{A}^{2}$ のザリスキ位相は $\mathbb{A}^{1}\times\mathbb{A}^{1}$ の積位相より真に細かい。対角線 $V(x-y)$ は $\mathbb{A}^{2}$ で閉だが、積位相の閉集合は有限個の点・縦線・横線の和（とその全体）なので、対角線は積位相では閉でない。
3. 主開集合 $D(f)$ は開集合の基底をなす：開集合 $U=\mathbb{A}^{n}\setminus V(f_{1},\dots,f_{m})=\bigcup_{i}D(f_{i})$。
:::

## 零点定理による対応 {#ag:sec-as-correspondence}

::: theorem 代数的集合と根基イデアル {#ag:algebraic-radical-correspondence keywords="I and V give an inclusion reversing bijection between algebraic sets and radical ideals; points correspond to maximal ideals; closure of Y is V(I(Y))" index="代数的集合と根基イデアルの対応|だいすうてきしゅうごうとこんきいであるのたいおう"}
1. $Y\subset\mathbb{A}^{n}$ のザリスキ閉包は $V(I(Y))$。
2. $V$ と $I$ は、$\mathbb{A}^{n}$ の代数的集合全体と $A$ の根基イデアル全体の間の、包含を逆にする一対一対応で、互いに逆。
3. 点 $a=(a_{1},\dots,a_{n})$ には極大イデアル $\mathfrak{m}_{a}=(x_{1}-a_{1},\dots,x_{n}-a_{n})$ が対応し、これで $\mathbb{A}^{n}$ の点と $A$ の極大イデアルが一対一に対応する。
:::

::: proof
**Step 1（1）.** \ref{ag:zero-set-properties} の 6。

**Step 2（2）.** 代数的集合 $Y=V(\mathfrak{a})$ について $V(I(Y))=Y$（1、$Y$ は閉）。根基イデアル $\mathfrak{a}$ について $I(V(\mathfrak{a}))=\sqrt{\mathfrak{a}}=\mathfrak{a}$（強形の零点定理 \ref{ring:nullstellensatz}）。包含の逆転は定義から。

**Step 3（3）.** $I(\{a\})$ は $a$ で消える多項式で、$f\mapsto f(a)$ は全射 $A\to k$、その核は $\mathfrak{m}_{a}$（$f$ を $x_{i}-a_{i}$ で展開する）。$A/\mathfrak{m}_{a}\cong k$ は体なので極大。弱形の零点定理（\ref{ring:weak-nullstellensatz} の 1）から、極大イデアルはすべてこの形。
:::

::: remark この対応で見えないもの
対応 2 で、$A$ の素イデアルのうち極大でないもの（たとえば $\mathfrak{p}=(f)$, $f$ は既約多項式）は「点」に対応せず、代数的集合 $V(\mathfrak{p})$（既約な集合、次の節）に対応する。グロタンディークは、すべての素イデアルを点とみなす空間 $\operatorname{Spec}A$ を導入した（\ref[環のスペクトルと構造層]{ag:page-spectrum}）。そこでは $\mathfrak{p}$ は $V(\mathfrak{p})$ の「生成点」になり、既約な閉集合と点が一対一に対応する。また、根基でないイデアル（たとえば $(x^{2})$）は代数的集合を区別しないが、スキームでは「重複度をもつ点」として区別される。古典的な対応がもつこの二つの欠落（生成点と冪零元）を埋めることが、スキームの定義の動機の一つである。
:::

## 既約性 {#ag:sec-as-irreducible}

::: definition 既約な空間 {#ag:irreducible-space keywords="irreducible topological space, irreducible components" index="既約（位相空間）|きやくいそうくうかん, 既約成分|きやくせいぶん"}
位相空間 $Y$ が**既約**であるとは、$Y\neq\emptyset$ で、二つの真の閉部分集合の和として書けないことをいう。同値な言い方：空でない開集合はすべて稠密（二つの空でない開集合は交わる）。$Y$ の極大な既約部分集合を**既約成分**という。既約な部分集合の閉包は既約、既約な空間の空でない開集合は既約で稠密。
:::

::: proposition 既約性と素イデアル {#ag:irreducible-prime keywords="an algebraic set is irreducible iff its ideal is prime; affine space is irreducible; irreducible hypersurfaces" index="既約性と素イデアル|きやくせいとそいである"}
代数的集合 $Y$ が既約 $\iff$ $I(Y)$ が素イデアル。とくに $\mathbb{A}^{n}$ は既約（$I(\mathbb{A}^{n})=0$ は素）。既約な多項式 $f$ について $V(f)$ は既約（**既約な超曲面**）。
:::

::: proof
**Step 1（$\Rightarrow$）.** $fg\in I(Y)$ なら $Y\subset V(fg)=V(f)\cup V(g)$ で、$Y=(Y\cap V(f))\cup(Y\cap V(g))$ は閉集合の和。既約なのでどちらかが $Y$、たとえば $Y\subset V(f)$、すなわち $f\in I(Y)$。$Y\neq\emptyset$ から $I(Y)\neq A$。

**Step 2（$\Leftarrow$）.** $Y=Y_{1}\cup Y_{2}$（閉集合）なら $I(Y)=I(Y_{1})\cap I(Y_{2})\supset I(Y_{1})I(Y_{2})$。素イデアルなので、どちらか、たとえば $I(Y_{1})\subset I(Y)$。$I(Y)\subset I(Y_{1})$ と合わせて $I(Y_{1})=I(Y)$ で、\ref{ag:algebraic-radical-correspondence} の 2 から $Y_{1}=Y$。

**Step 3（$\mathbb{A}^{n}$）.** $I(\mathbb{A}^{n})=0$：$k$ が無限体なので、すべての点で消える多項式は $0$（変数の数についての帰納法）。$A$ は整域なので $0$ は素。

**Step 4（超曲面）.** $A$ は一意分解環（\ref{ring:polynomial-ufd}）なので、既約多項式 $f$ の生成する $(f)$ は素イデアル。素イデアルは根基なので $I(V(f))=(f)$（零点定理）で素。
:::

::: definition ネーター空間 {#ag:noetherian-space keywords="noetherian topological space: descending chain condition on closed sets" index="ネーター空間|ねーたーくうかん"}
位相空間 $Y$ が**ネーター的**であるとは、閉集合の減少列 $Y_{1}\supset Y_{2}\supset\cdots$ がすべて有限で止まることをいう。
:::

::: theorem 既約成分への分解 {#ag:irreducible-decomposition keywords="every noetherian space is a finite union of irreducible closed sets, uniquely if irredundant; affine algebraic sets are noetherian" index="既約分解|きやくぶんかい"}
1. $\mathbb{A}^{n}$ とその部分空間はネーター的。
2. ネーター空間 $Y$ の空でない閉集合は、既約な閉集合の有限和 $Y_{1}\cup\cdots\cup Y_{r}$（$Y_{i}\not\subset Y_{j}$, $i\neq j$）として一意に（順序を除いて）書け、$Y_{i}$ は既約成分。
3. 代数的集合 $V(\mathfrak{a})$ の既約成分は、$\sqrt{\mathfrak{a}}$ を含む極小な素イデアル $\mathfrak{p}_{i}$ の $V(\mathfrak{p}_{i})$ で、$\sqrt{\mathfrak{a}}=\bigcap\mathfrak{p}_{i}$。
:::

::: proof
**Step 1（1）.** 閉集合の減少列 $Y_{1}\supset Y_{2}\supset\cdots$ は根基イデアルの増加列 $I(Y_{1})\subset I(Y_{2})\subset\cdots$ を与える（対応は包含を逆にする全単射）。$A$ はネーター（基底定理）なので増加列は止まり、閉集合の列も止まる。部分空間の閉集合は閉集合との共通部分なので、部分空間もネーター的。

**Step 2（2：存在）.** 有限和に書けない空でない閉集合の全体 $\mathcal{S}$ が空でないとする。ネーター性から $\mathcal{S}$ は極小元 $Z$ をもつ（極小元がなければ、各元より真に小さい元を次々にとって真に減少する無限列が作れ、ネーター性に反する。この列の構成に従属選択公理（DC）を使う）。$Z$ は既約でない（既約ならそれ自身の 1 項の和）ので $Z=Z_{1}\cup Z_{2}$（真の閉部分集合）で、$Z_{i}\notin\mathcal{S}$ だから有限和に書け、$Z$ も書ける。矛盾。余分な項（他の項に含まれるもの）を除けば、互いに含まれない形になる。

**Step 3（2：一意性）.** $Y_{1}\cup\cdots\cup Y_{r}=Y'_{1}\cup\cdots\cup Y'_{s}$ とする。$Y'_{1}=\bigcup_{i}(Y'_{1}\cap Y_{i})$ と既約性から、ある $i$ で $Y'_{1}\subset Y_{i}$。同様に $Y_{i}\subset Y'_{j}$ となる $j$ があり、$Y'_{1}\subset Y'_{j}$ から $j=1$、$Y'_{1}=Y_{i}$。帰納法で一致する。既約成分であること：既約な $W\supset Y_{i}$ は $W\subset\bigcup Y_{j}$ から、ある $Y_{j}$ に含まれ、$Y_{i}\subset Y_{j}$ から $i=j$、$W=Y_{i}$。

**Step 4（3）.** 2 と \ref{ag:irreducible-prime} から、既約成分 $Y_{i}=V(\mathfrak{p}_{i})$（$\mathfrak{p}_{i}=I(Y_{i})$ は素）で、$\sqrt{\mathfrak{a}}=I(V(\mathfrak{a}))=\bigcap_{i}I(Y_{i})=\bigcap\mathfrak{p}_{i}$。$\sqrt{\mathfrak{a}}\subset\mathfrak{q}$（素）なら $\bigcap\mathfrak{p}_{i}\subset\mathfrak{q}$ で、素イデアルの性質からある $\mathfrak{p}_{i}\subset\mathfrak{q}$。よって $\mathfrak{p}_{i}$ は極小な素イデアル（互いに含まれないので、すべて極小）。
:::

::: example
1. $V(xy)\subset\mathbb{A}^{2}$ の既約成分は二つの座標軸 $V(x)$, $V(y)$（$xy$ の既約因子）。
2. $V(x^{2}-yz,\,xz-x)\subset\mathbb{A}^{3}$：$x(z-1)=0$ から、$x=0$ なら $yz=0$、$z=1$ なら $x^{2}=y$。既約成分は $V(x,y)$（$z$ 軸）、$V(x,z)$（$y$ 軸）、$V(z-1,x^{2}-y)$（放物線）の三つ。
3. 一般に、超曲面 $V(f)$ の既約成分は、$f=\prod f_{i}^{e_{i}}$（相異なる既約因子）の $V(f_{i})$ で、$\sqrt{(f)}=(f_{1}\cdots f_{r})$。
:::

::: hypcheck
- **選択公理**：既約分解の存在（\ref{ag:irreducible-decomposition} の Step 2）で、減少列の条件から極小元の存在を導くのに従属選択公理（DC）を使う。$\mathbb{A}^{n}$ の場合は、根基イデアルの空でない族が極大元をもつこと（ネーター環の性質）を直接使えば、その証明の仕方によっては DC を避けられる。他の部分では使わない。
- **$k$ が代数閉体**：零点定理による対応（\ref{ag:algebraic-radical-correspondence}）と、点＝極大イデアル（弱形の零点定理）に使った。$k=\mathbb{R}$ なら $V(x^{2}+1)=\emptyset=V(1)$ で、対応は単射でない。
- **$k$ が無限体**：$I(\mathbb{A}^{n})=0$（既約性）に使った（代数閉体は自動的に無限）。
:::

::: supplement
**前提を変えると.** 代数閉でない体 $k$ 上では、$k^{n}$ の点だけでは方程式の情報が失われる（上の $\mathbb{R}$ の例）。そこで $\bar k^{n}$ の点（$\operatorname{Gal}(\bar k/k)$ の作用を込めて）を考えるか、$\operatorname{Spec}k[x_{1},\dots,x_{n}]$ の素イデアルを考える。後者がスキームの立場で、$\operatorname{Spec}\mathbb{R}[x]$ の閉点は実数 $a$（$x-a$）と、共役な複素数の組（$x^{2}+bx+c$, $b^{2}<4c$）に対応する。

**計算の観点.** 代数的集合の既約分解（イデアルの素イデアル分解・準素分解）は、グレブナー基底を使って計算可能である（有理数体上。ただし計算量は最悪の場合に変数の数について 2 重指数的になることが知られている。本サイト未収録）。根基の帰属判定（$f\in\sqrt{\mathfrak{a}}$）は、ラビノヴィッチの技法により $1\in\mathfrak{a}+(1-tf)$ の判定（イデアル帰属問題）に帰着する（\ref{ring:nullstellensatz} の証明）。
:::

## 高い視点 {#ag:sec-as-viewpoint}

::: remark 「方程式」と「図形」の辞書
零点定理は、代数（根基イデアル）と幾何（代数的集合）の間の辞書で、包含を逆にする（ガロア接続、\ref{fld:polarity} と同じ形）。既約性⇔素、点⇔極大、和集合⇔共通部分（積）、共通部分⇔和、という翻訳が成り立つ。ザリスキ位相が粗いのは、図形を「多項式で区別できる範囲」でしか見ないからで、比喩で言えば、ピントを多項式の次数に合わせた解像度の低い写真である。それでも有限性（ネーター性）があるので、すべての図形は有限個の「既約な部品」に一意に分解できる。圏論的には、この辞書は「有限生成被約 $k$ 代数の圏と、アフィン多様体の圏の反同値」（\ref[アフィン多様体と射]{ag:page-affine-varieties}）にまで高められる。
:::

## 問題 {#ag:sec-as-problems}

::: problem {#ag:prob-as-twisted-cubic}
$C\defeq\{(t,t^{2},t^{3}) : t\in k\}\subset\mathbb{A}^{3}$ が代数的集合 $V(y-x^{2},z-x^{3})$ であり、既約であることを示せ（**ねじれ 3 次曲線**）。
:::

::: solution
**$C=V(\mathfrak{a})$.** $\mathfrak{a}\defeq(y-x^{2},z-x^{3})$ とする。$C$ の点は明らかに $V(\mathfrak{a})$ に入り、逆に $(a,b,c)\in V(\mathfrak{a})$ なら $b=a^{2}$, $c=a^{3}$ で $t=a$ の点。

**既約.** 準同型 $\varphi:k[x,y,z]\to k[t]$, $x\mapsto t$, $y\mapsto t^{2}$, $z\mapsto t^{3}$ は全射で、$\mathfrak{a}\subset\ker\varphi$。逆に $f\in\ker\varphi$ を、$y=x^{2}+(y-x^{2})$, $z=x^{3}+(z-x^{3})$ と代入して展開すると $f\equiv g(x)\pmod{\mathfrak{a}}$ で、$\varphi(f)=g(t)=0$ から $g=0$。よって $\ker\varphi=\mathfrak{a}$ で、$k[x,y,z]/\mathfrak{a}\cong k[t]$ は整域、$\mathfrak{a}$ は素イデアル。$I(C)=\sqrt{\mathfrak{a}}=\mathfrak{a}$（零点定理）は素なので、$C$ は既約（\ref{ag:irreducible-prime}）。
:::
